  chapters:
    - id: ch01
      title: The Quest for the Little Dog
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a king had three sons. They were all clever and brave, so clever and brave that he began to fear they might want his kingdom before he was dead. The King was growing old, but he had no wish to stop ruling while he could still manage his affairs. He decided to keep his sons occupied with promises he could escape when the time came to fulfill them.
        - id: ch01-b02
          speaker: narrator
          text: He called all three princes to him. First he spoke kindly. Then he told them what he wanted.
        - id: ch01-b03
          speaker: king
          text: My dear sons, you can see that my age makes it harder to attend to the kingdom as carefully as I once did. I fear my subjects may suffer, so I want one of you to inherit my crown. Such a gift deserves something in return. I mean to retire to the country, where a pretty, lively, faithful little dog would be fine company. No matter which of you is oldest, the son who brings me the most beautiful little dog will become king at once.
        - id: ch01-b04
          speaker: narrator
          text: The princes were amazed by this sudden desire for a dog. The two younger sons would normally have had no chance of becoming king, so the strange contest suited them very well. The eldest might have objected, but he was too courteous. All three gladly accepted. They said farewell to their father, and the King gave them silver and precious stones for their journeys. He told them to return to that same place and hour when one year had passed. Then he would judge the little dogs they brought him.
        - id: ch01-b05
          speaker: narrator
          text: The brothers and their closest friends went to a castle about a league from the city and held a grand banquet before parting. The three princes promised always to be friends. Whatever good fortune came to one of them would be shared, and no envy or jealousy would separate them. When the appointed day arrived, they would meet again at this castle and present themselves to the King together. With that settled, each brother chose a different road and began his search.
        - id: ch01-b06
          speaker: narrator
          text: The two older brothers had many adventures, but this tale follows the youngest. He was young, cheerful, handsome, and trained in everything a prince should know. As for courage, his seemed endless.
        - id: ch01-b07
          speaker: narrator
          text: Nearly every day he bought several dogs. He tried great dogs and tiny ones, greyhounds, mastiffs, spaniels, and lapdogs. Whenever he found a pretty dog, a prettier one soon appeared. Then he sold the others and bought that one, since a lone traveler could hardly take thirty or forty thousand dogs along.
        - id: ch01-b08
          speaker: narrator
          text: He wandered on without knowing where he was headed. At nightfall one day, he entered a vast, gloomy forest and lost his way. Thunder broke overhead, and rain poured down. He followed the first path he found. After a long while, a faint light appeared. He hoped it came from a cottage where he might shelter.
        - id: ch01-b09
          speaker: narrator
          text: Instead, the light led him to the grandest castle he had ever imagined. Its golden door was covered in carbuncles, and their pure red glow had guided him through the trees. The walls were made from the finest porcelain, painted in the most delicate colors. Every story he had ever read seemed to be pictured across them. He longed to stop and study the scenes, but he was soaked through. Rain was still pouring down, so he hurried back beneath the shelter of the golden door.
        - id: ch01-b10
          speaker: narrator
          text: Beside the golden door hung a deer's foot on a diamond chain. The Prince wondered who could live in such a place.
        - id: ch01-b11
          speaker: youngest_prince
          text: Whoever lives here must feel very safe from robbers. What would stop someone from cutting off that chain, digging out those carbuncles, and becoming rich for life?
        - id: ch01-b12
          speaker: narrator
          text: He pulled the deer's foot. A silver bell rang, and the door flew open. No servants stood behind it. He saw only dozens of hands floating in the air, each one holding a torch. He froze in surprise until more hands pushed him gently forward. Uneasy as he was, he had to go on. He kept one hand on his sword as he entered a hall paved with lapis lazuli. Then two beautiful voices began to sing.
        - id: ch01-b13
          speakers: [singer_one, singer_two]
          ensemble: duo
          text: These hands in the air will attend to your needs. If your heart is brave enough to conquer Love, you may stay here without fear.
        - id: ch01-b14
          speaker: narrator
          text: Such a welcome did not sound dangerous, so the Prince began to feel easier. The floating hands guided him to a coral door, and it opened by itself as he approached. Beyond it was a vast hall made of mother-of-pearl. Door after door led from it into more splendid rooms. Thousands of lights glittered everywhere. Beautiful pictures and precious objects surrounded him until he felt quite bewildered by all he saw.
        - id: ch01-b15
          speaker: narrator
          text: The hands conducted him through sixty rooms before they finally stopped. A comfortable armchair had been drawn close to a cold hearth. The moment he reached it, the fire lit itself. Pretty, soft, skillful hands removed every piece of his wet, muddy clothing. Other hands brought fresh garments made from the richest fabrics and embroidered all over with gold and emeralds. The Prince admired both the clothes and the remarkable way the hands waited on him. Still, one sometimes appeared so suddenly beside him that he could not help jumping.
        - id: ch01-b16
          speaker: narrator
          text: Once he was dressed, he looked nothing like the wet and weary traveler who had stood in the rain and pulled the deer's foot. The hands brought him to a splendid dining room. Pictures showing the adventures of Puss in Boots and other famous cats covered the walls. Two places had been laid for supper with golden plates, spoons, and forks. On the sideboard stood dishes and glasses of crystal, all set with precious stones.
        - id: ch01-b17
          speaker: narrator
          text: While he wondered who would take the second place, about a dozen cats entered carrying guitars and rolls of music. They arranged themselves at one end of the room. A cat conductor raised a rolled sheet of paper and began to beat time. The others mewed in every possible key while drawing their claws across the guitar strings. It was the strangest music the Prince had ever heard. He quickly stopped his ears, but even then the musicians looked so comical that he fell into fits of laughter.
        - id: ch01-b18
          speaker: youngest_prince
          text: What strange thing can possibly come next?
        - id: ch01-b19
          speaker: narrator
          text: At once, the door opened. A tiny figure entered beneath a long black veil, escorted by two cats in black mantles with swords. Behind them came many more cats carrying cages of rats and mice. The Prince wondered if he was dreaming.
        - id: ch01-b20
          speaker: narrator
          text: The little figure approached and lifted her veil. She was the loveliest white cat anyone could imagine. She looked young and deeply sad. When she spoke, her sweet voice went straight to the Prince's heart.
        - id: ch01-b21
          speaker: white_cat
          text: King's son, welcome. The Queen of the Cats is pleased to see you.
        - id: ch01-b22
          speaker: youngest_prince
          text: Lady Cat, thank you for receiving me so kindly. But you cannot be an ordinary cat. Your speech and this magnificent castle make that perfectly clear.
        - id: ch01-b23
          speaker: white_cat
          text: King's son, please spare me your compliments. I am not accustomed to them. Now let supper be served, and let the musicians stop. The Prince cannot understand what they are saying.
        - id: ch01-b24
          speaker: narrator
          text: At the White Cat's command, the mysterious hands began serving supper. The first two dishes were set down together. One held stewed pigeons, while the other contained a fricassee of fat mice. The sight of those mice made the Prince feel that he might not enjoy a single bite of his supper.
        - id: ch01-b25
          speaker: white_cat
          text: Your food was made in another kitchen. You may be certain there are no rats or mice in anything meant for you.
        - id: ch01-b26
          speaker: narrator
          text: He felt certain she would never deceive him, so he put aside his doubts and began to eat. Presently, he noticed a bracelet around the White Cat's nearest paw. A tiny portrait was set inside it, and he asked whether he might look more closely. To his astonishment, the picture showed an extremely handsome young man who looked so much like him that it might have been his own portrait. The White Cat sighed while he studied it and seemed sadder than ever. The Prince wanted to understand, but he was afraid a question might displease her, so he said nothing about the picture.
        - id: ch01-b27
          speaker: narrator
          text: Instead, he led the conversation toward other subjects. He soon discovered that the White Cat took an interest in everything he cared about himself. She also seemed to know perfectly well what was happening in the world beyond her castle. When supper ended, they moved to another room fitted up as a theater. Cats performed a play and danced for their amusement. Only after the entertainment was over did the White Cat wish him good night.
        - id: ch01-b28
          speaker: narrator
          text: The hands led him to a bedroom hung with tapestry made from butterflies' wings in every color. Mirrors reached from ceiling to floor, and ribbons tied back gauze curtains around a small white bed. The Prince went to sleep without speaking. He had no idea how to begin a conversation with a pair of hands.
        - id: ch01-b29
          speaker: narrator
          text: In the morning, noise and confusion outside his window woke him. The hands appeared at once and quickly dressed him in hunting clothes. Looking down into the courtyard, he saw all the cats assembled. Some held greyhounds, while others blew hunting horns. The White Cat was going out to hunt. The hands led a wooden horse up to the Prince and plainly expected him to mount it. He was indignant at being offered such a steed, but his objections did nothing. Before long, the hands had placed him on its back, and the wooden horse pranced merrily away.
        - id: ch01-b30
          speaker: narrator
          text: The White Cat rode a monkey. Whenever she wanted a young eaglet, it climbed all the way to the eagles' nests. No hunting party could have been more pleasant. Back at the castle, the Prince and the White Cat shared supper again.
        - id: ch01-b31
          speaker: narrator
          text: When the meal ended, she gave him a crystal goblet. It must have held a magic drink. The moment he swallowed it, he forgot everything, even the little dog he was seeking for his father. He thought only of how happy he was with the White Cat.
        - id: ch01-b32
          speaker: narrator
          text: The days passed in one amusement after another until the year was almost over. The Prince had forgotten his brothers and even the country he came from. The White Cat had forgotten nothing.
        - id: ch01-b33
          speaker: white_cat
          text: Do you know you have only three days left to find your father's little dog? Your brothers have already found beautiful ones.
        - id: ch01-b34
          speaker: narrator
          text: All at once, the Prince's memory returned.
        - id: ch01-b35
          speaker: youngest_prince
          text: How could I forget something so important? My whole future depends on it. Even if I found a dog fit to win a kingdom, where could I find a horse that would carry me home in three days?
          emotion: fearful
        - id: ch01-b36
          speaker: white_cat
          text: King's son, do not worry. I am your friend, and I will make this easy. You may stay one more day. The good wooden horse can carry you home in twelve hours.
          emotion: calm
        - id: ch01-b37
          speaker: youngest_prince
          text: Thank you, beautiful Cat. But arriving in time will do no good if I have no dog for my father.
        - id: ch01-b38
          speaker: white_cat
          text: Look at this acorn. Inside it is a dog prettier than any in the Dog Star.
        - id: ch01-b39
          speaker: youngest_prince
          text: Oh, dear White Cat, this is no time to tease me!
        - id: ch01-b40
          speaker: white_cat
          text: Just listen.
        - id: ch01-b41
          speaker: narrator
          text: She held the acorn to his ear. From inside came a tiny voice saying, "Bow-wow!" The Prince was delighted. Any dog that fit inside an acorn must be very small. He wanted to take it out, but the White Cat told him to wait until he stood before the King. The little dog might grow cold during the journey.
        - id: ch01-b42
          speaker: narrator
          text: He thanked her a thousand times. When he had to leave, he said goodbye with a heavy heart.
        - id: ch01-b43
          speaker: youngest_prince
          text: The days went by so quickly with you. I only wish I could take you home with me.
          emotion: sad
        - id: ch01-b44
          speaker: narrator
          text: The White Cat only shook her head and sighed deeply.
        - id: ch01-b45
          speaker: narrator
          text: The youngest prince reached the meeting castle before either of his brothers. They arrived soon afterward and stared in amazement at his wooden horse, which leaped about the courtyard like a spirited hunter. He welcomed them joyfully, and the three began exchanging tales of their travels. The youngest listened to every adventure but managed to hide what had happened to him. He even led them to believe that a plain turnspit dog traveling at his side was the animal he meant to offer the King. Though the brothers truly loved one another, the older two could not help feeling pleased. Their own dogs now seemed certain to have the better chance.
        - id: ch01-b46
          speaker: narrator
          text: The next morning, all three rode toward the palace in one chariot. Each older prince carried a tiny, delicate dog in a basket and hardly dared touch it for fear of hurting it. The turnspit ran behind the chariot and became so covered in mud that no one could tell what it looked like. At the palace, everyone crowded around to welcome the brothers as they entered the great hall. The older princes presented their little dogs first. No one could decide which animal was prettier, and the two brothers were already planning how they would divide the kingdom equally.
        - id: ch01-b47
          speaker: narrator
          text: Then the youngest prince stepped forward. He took the White Cat's acorn from his pocket and cracked it open. Inside, on a white cushion, sat a dog small enough to pass through a ring. He set it on the floor, and it immediately began to dance. Nothing could have been prettier. The King had no answer, yet he was still in no hurry to surrender his crown.
        - id: ch01-b48
          speaker: king
          text: You have done so well that I will ask you to make one more journey. Search by land and sea. Bring me a piece of muslin fine enough to pass through the eye of a needle.
        - id: ch01-b49
          speaker: narrator
          text: The princes did not want to leave again. The older two agreed because the new task gave them another chance. They set out as before, while the youngest mounted the wooden horse and raced back to his beloved White Cat.
    - id: ch02
      title: The Muslin in the Millet Seed
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Every castle door stood open to receive him. Every window and turret shone with light, making the place more wonderful than before. The hands hurried out, took the wooden horse to the stable, and guided the Prince inside.
        - id: ch02-b02
          speaker: narrator
          text: He found the White Cat asleep in a little basket on a white satin cushion. At the sound of his arrival, she sprang up in delight.
        - id: ch02-b03
          speaker: white_cat
          text: King's son, how could I have hoped you would return to me?
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: The Prince stroked and petted her. He told her how the journey had succeeded and explained the new demand. He had come for her help because he believed no one could find such muslin.
        - id: ch02-b05
          speaker: white_cat
          text: I must think about what can be done. Luckily, some cats in this castle spin extremely well. If anyone can make this cloth, they can. I will give them the task myself.
        - id: ch02-b06
          speaker: narrator
          text: The hands soon arrived carrying torches. They led the Prince and the White Cat into a long gallery whose windows overlooked the river. From there, the two watched a magnificent display of fireworks of every kind. Afterward they sat down to supper. The Prince had ridden far and arrived very late, so however beautiful the fireworks had been, he liked the supper even better.
        - id: ch02-b07
          speaker: narrator
          text: Once again, the days flew past. No one could be bored with the White Cat. She was always inventing a new amusement, and she seemed far wiser than any cat had a right to be. Whenever the Prince asked where her wisdom came from, she refused to explain.
        - id: ch02-b08
          speaker: white_cat
          text: King's son, do not ask me. Guess anything you like, but I am not allowed to tell you.
        - id: ch02-b09
          speaker: narrator
          text: The Prince was too happy to watch the time. At last the White Cat told him the year had ended. The muslin was ready, and he had no cause to worry.
        - id: ch02-b10
          speaker: white_cat
          text: This time I can send a proper escort with you.
        - id: ch02-b11
          speaker: narrator
          text: In the courtyard stood a magnificent chariot of polished gold. Flame-colored enamel covered it in a thousand different designs. Twelve snow-white horses were harnessed to it, four abreast. Flame-colored velvet covered their trappings, and diamonds sparkled in the embroidery. Behind the first carriage waited a hundred more chariots. Eight horses drew each one, and officers in splendid uniforms filled them all. Around the entire procession stood a thousand guards.
        - id: ch02-b12
          speaker: white_cat
          text: Go before the King in this state, and surely he cannot deny you the crown you deserve. Take this walnut. Do not open it until you stand before him. Inside, you will find the cloth he requested.
        - id: ch02-b13
          speaker: youngest_prince
          text: Lovely Blanchette, how can I ever thank you for such kindness? Say the word, and I will forget the crown forever. I would gladly stay here with you.
        - id: ch02-b14
          speaker: white_cat
          text: King's son, your care for a little white cat shows how good your heart is. I am useful for nothing but catching mice. Still, you must go.
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: The Prince kissed her paw and departed. His glittering company traveled so swiftly that they reached the palace in half the time the wooden horse had taken.
        - id: ch02-b16
          speaker: narrator
          text: This time, the Prince arrived too late to meet his brothers at the castle. When he failed to appear, they decided he must not be coming and felt rather glad. They went before the King without him and proudly spread out their pieces of muslin. Both fabrics were extremely fine, and either one could be drawn through the eye of a very large needle.
        - id: ch02-b17
          speaker: narrator
          text: The King was glad to find a difficulty. He ordered servants to bring a special needle kept among the Crown jewels. Its eye was so tiny that everyone saw at once the cloth could never pass through. The older princes angrily began to call the trial a trick.
        - id: ch02-b18
          speaker: narrator
          text: Just then trumpets sounded. The youngest prince entered in all his splendor. His father and brothers stared. After greeting them, he confidently opened the walnut. But it held only a hazelnut.
        - id: ch02-b19
          speaker: narrator
          text: He cracked the hazelnut and found a cherry stone. The King chuckled at the thought of finding muslin in such a place. The Prince broke open the cherry stone, and everyone laughed when they saw only its kernel. Inside that kernel was a grain of wheat. Inside the wheat was a millet seed. Now even the Prince began to doubt.
        - id: ch02-b20
          speaker: youngest_prince
          text: White Cat, White Cat, are you playing a joke on me?
        - id: ch02-b21
          speaker: narrator
          text: At that instant, a cat's claw gave his hand a sharp scratch. The scratch hurt, but the Prince hoped it was meant to encourage him. He carefully opened the millet seed. From that speck, he drew four hundred ells of muslin, woven in the loveliest colors and the most wonderful patterns. When the Crown needle was brought, the great length of cloth passed through its tiny eye not once, but six times, and did so with perfect ease.
        - id: ch02-b22
          speaker: narrator
          text: The King went pale. The older princes stood silent and sorrowful. No one could deny that this was the most wonderful muslin in the world.
        - id: ch02-b23
          speaker: narrator
          text: At last the King sighed deeply and turned to his sons.
        - id: ch02-b24
          speaker: king
          text: Nothing comforts me more in my old age than seeing how willingly you fulfill my wishes. Go out once again. At the end of a year, the son who brings home the loveliest princess shall marry her and receive the crown without further delay. My successor must, of course, be married.
        - id: ch02-b25
          speaker: narrator
          text: The youngest prince felt he had fairly won the kingdom twice already. Yet he was too well mannered to argue. He returned to his golden chariot and raced back to the White Cat, surrounded by his splendid escort.
    - id: ch03
      title: The White Cat's Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: This time, the White Cat was expecting him. Flowers had been scattered all along the path to welcome him. A thousand braziers burned sweet-smelling woods, and their perfume drifted through the air around the castle. The White Cat waited in a gallery with a clear view of the road, watching as the Prince and his magnificent escort came racing back even faster than they had left.
        - id: ch03-b02
          speaker: white_cat
          text: Well, King's son, here you are again, and still you have no crown.
        - id: ch03-b03
          speaker: youngest_prince
          text: Madam, your generosity has helped me earn it twice. My father is so unwilling to let it go that taking it from him would bring me no pleasure.
        - id: ch03-b04
          speaker: white_cat
          text: Never mind. It is still worth trying to deserve the crown. Since you must return with a beautiful princess, I will keep watch for one who suits you. Until then, let us enjoy ourselves. Tonight, especially for your amusement, I have ordered my cats to fight a battle against the rats from the river.
        - id: ch03-b05
          speaker: narrator
          text: That year passed even more pleasantly than the two before it. Now and then, the Prince could not resist asking how the White Cat was able to speak.
        - id: ch03-b06
          speaker: youngest_prince
          text: Perhaps you are a fairy. Or did an enchanter turn you into a cat?
        - id: ch03-b07
          speaker: narrator
          text: Her answers never revealed anything. Happiness made the days pass so quickly that the Prince would not have noticed the year ending. One evening, as they sat together, the White Cat told him he could take home a lovely princess the next day, but only if he obeyed her.
        - id: ch03-b08
          speaker: white_cat
          text: Take this sword and cut off my head.
        - id: ch03-b09
          speaker: youngest_prince
          text: Me? Cut off your head? Darling Blanchette, how could I ever do that?
          emotion: fearful
        - id: ch03-b10
          speaker: white_cat
          text: King's son, I beg you to do exactly as I say.
        - id: ch03-b11
          speaker: narrator
          text: Tears filled the Prince's eyes. He begged her to ask anything else of him. She could set him the hardest task she knew, and he would gladly perform it as proof of his devotion. He asked only to be spared the grief of killing his dear little Cat. Yet no plea could change her determination. At last, driven to despair, he drew the sword. With tears in his eyes and his hand trembling, he cut off the small white head.
        - id: ch03-b12
          speaker: narrator
          text: In the same instant, a beautiful princess stood before him. His horror gave way to such astonishment and delight that he could not speak. Then the door opened, and a noble company of knights and ladies entered the room. Every one of them carried a cat skin. They hurried toward the Princess with every sign of joy, kissed her hand, and congratulated her on being restored at last to her natural form.
        - id: ch03-b13
          speaker: narrator
          text: She greeted them graciously, then asked them to leave her alone with the Prince. At last, she began to explain.
        - id: ch03-b14
          speaker: white_cat
          text: You see, Prince, you were right. I was never an ordinary cat. My father ruled six kingdoms. My mother, the Queen, loved travel and exploration. When I was only a few weeks old, she asked his permission to visit a mountain famous for its wonders. She set out with many attendants.
        - id: ch03-b15
          speaker: white_cat
          text: Their road passed near an ancient castle that belonged to fairies. No one had ever entered it, but people said it was filled with marvelous things. My mother remembered hearing that fruit grew in its garden unlike any fruit in the world. She decided she must taste it.
        - id: ch03-b16
          speaker: white_cat
          text: She reached a door blazing with gold and jewels and ordered her servants to knock as loudly as they could. They knocked again and again, but no one answered. The whole castle seemed asleep or dead. Every new obstacle only made the Queen more determined to have the fruit. She commanded her servants to bring ladders and climb over the garden wall. The wall did not appear very high. Still, even when the servants tied their ladders together into one enormous ladder, its top could not reach the top of the wall.
        - id: ch03-b17
          speaker: white_cat
          text: My mother despaired. Night was coming, so she ordered the company to camp where they stood. She went to bed feeling ill with disappointment. In the middle of the night, she woke and found a tiny, ugly old woman sitting beside her.
        - id: ch03-b18
          speaker: old_fairy
          text: Your Majesty, we find your insistence on tasting our fruit rather troublesome. Still, my sisters and I will spare you further annoyance. You may take away as much as you can carry, but only on one condition. You must give us your little daughter to raise as our own.
        - id: ch03-b19
          speaker: queen_mother
          text: Oh, my dear lady, is there nothing else you would accept? I would gladly give you my kingdoms for the fruit.
        - id: ch03-b20
          speaker: old_fairy
          text: No. We want only your daughter. She will be happy every day, and we will give her everything worth having in fairyland. But you may not see her again until she is married.
        - id: ch03-b21
          speaker: queen_mother
          text: It is a cruel condition, but I agree. If I cannot taste the fruit, I am certain I will die. Then I would lose my little daughter anyway.
        - id: ch03-b22
          speaker: narrator
          text: The old fairy led the Queen into the castle. Though it was still midnight, she could see that its beauty surpassed every tale she had heard.
        - id: ch03-b23
          speaker: white_cat
          text: Prince, you can easily believe that. The fairy castle was the very castle where we are standing now.
        - id: ch03-b24
          speaker: old_fairy
          text: Would you like to gather the fruit yourself, Queen, or shall I call it to come to you?
        - id: ch03-b25
          speaker: queen_mother
          text: Please let me watch it come when you call. I have never seen such a thing.
        - id: ch03-b26
          speaker: narrator
          text: The old fairy whistled twice before calling out.
        - id: ch03-b27
          speaker: old_fairy
          text: Apricots, peaches, nectarines, cherries, plums, pears, melons, grapes, apples, oranges, lemons, gooseberries, strawberries, and raspberries, come here!
        - id: ch03-b28
          speaker: narrator
          text: The fruit tumbled in all at once, piece over piece, without becoming bruised or dusty. It tasted every bit as wonderful as the Queen had imagined, for it grew on fairy trees.
    - id: ch04
      title: The Princess's History
      blocks:
        - id: ch04-b01
          speaker: white_cat
          text: The fairy gave my mother golden baskets. Four hundred mules were needed to carry all the fruit away. Then the fairy reminded her of their bargain and returned her to the camp.
        - id: ch04-b02
          speaker: white_cat
          text: The next morning, the Queen started home. Before she had traveled far, she regretted her promise. My father rode out to meet her and saw such sorrow in her face that he knew something was wrong. She was afraid to confess what she had done.
        - id: ch04-b03
          speaker: white_cat
          text: As soon as they reached the palace, five horrible little dwarfs arrived. The fairies had sent them to carry me away. Their appearance left my mother no choice, and she confessed the promise she had made. My father was furious. He ordered the Queen and me shut inside a great tower, placed guards all around it for our safety, and drove the five dwarfs out of his kingdom.
        - id: ch04-b04
          speaker: white_cat
          text: The fairies answered by sending a great dragon. It devoured everyone it met, and its breath burned everything along its path. My father tried in vain to destroy it. To save his subjects, he finally had to surrender me.
        - id: ch04-b05
          speaker: white_cat
          text: This time, the fairies came to fetch me themselves. They arrived in a chariot made of pearl and drawn by sea horses. Behind it came the dragon, led by chains of diamonds. The fairies placed my cradle between the old women in the chariot. They covered me with kisses, and then the whole company whirled away through the air. They carried me to a tower they had built especially for me.
        - id: ch04-b06
          speaker: white_cat
          text: I grew up among everything beautiful and rare. I learned all that a princess is ever taught. Yet my only companions were a parrot and a little dog, though both could speak. Each day, one of the old fairies visited me on the dragon.
        - id: ch04-b07
          speaker: white_cat
          text: One day, I sat at my window and saw a handsome young prince. He had been hunting in the forest around my prison. He stood below and looked up. When he saw me watching, he bowed with great respect.
        - id: ch04-b08
          speaker: white_cat
          text: You can imagine how glad I was to have someone new to speak with after so much loneliness. My window stood very high above him, yet we managed to talk until night covered the forest. He said farewell reluctantly. After that first meeting, he found his way back many times. With every visit, I came to love him more, and at last I agreed to become his wife.
        - id: ch04-b09
          speaker: white_cat
          text: We still had to find a way for me to escape. The fairies always gave me flax to spin. I worked so diligently that I made enough cord for a ladder reaching to the ground.
        - id: ch04-b10
          speaker: white_cat
          text: But just as my prince helped me climb down, the ugliest and cruelest fairy flew toward us. Before he could defend himself, the dragon swallowed my unhappy love.
          emotion: sad
        - id: ch04-b11
          speaker: white_cat
          text: The fairies were furious because I had ruined their plans. They meant me to marry the king of the dwarfs, and I had refused him completely. As punishment, they changed me into a white cat.
        - id: ch04-b12
          speaker: white_cat
          text: When they brought me to this castle, all the lords and ladies of my father's court were waiting under the same spell. People of lower rank had been made invisible, except for their hands.
        - id: ch04-b13
          speaker: white_cat
          text: While casting the spell, the fairies told me my whole history. Until that moment, I had believed I was their child. They warned me that I had only one hope of regaining my true form. I must win the love of a prince who resembled my lost lover in every way.
        - id: ch04-b14
          speaker: youngest_prince
          text: And you have won that love, beautiful Princess.
        - id: ch04-b15
          speaker: white_cat
          text: You truly are like him in every way, in your face and even your voice. If you really love me, then all my suffering is over.
        - id: ch04-b16
          speaker: narrator
          text: The Prince fell at her feet.
        - id: ch04-b17
          speaker: youngest_prince
          text: And my troubles are over too, if you will agree to marry me.
        - id: ch04-b18
          speaker: white_cat
          text: I already love you more than anyone in the world. Now we must return to your father and hear what he has to say.
          emotion: happy
        - id: ch04-b19
          speaker: narrator
          text: The Prince took her hand and led her outside. They entered the chariot together. It was finer than ever, and so was the entire company. Even the horses wore ruby shoes fixed with diamond nails, perhaps the first such horseshoes ever seen.
        - id: ch04-b20
          speaker: narrator
          text: The Princess was as kind and clever as she was beautiful. The Prince found the journey delightful, because everything she said charmed him.
        - id: ch04-b21
          speaker: narrator
          text: Near the castle where the brothers would meet, the Princess entered a chair carried by four guards. It was carved from a single splendid crystal. She pulled its silk curtains closed so no one could see her.
    - id: ch05
      title: The Princess in the Crystal Chair
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Prince saw his brothers walking on the terrace. Each had a lovely princess beside him. They hurried down to meet their younger brother.
        - id: ch05-b02
          speakers: [eldest_prince, middle_prince]
          ensemble: duo
          text: Have you found a wife too?
        - id: ch05-b03
          speaker: youngest_prince
          text: I found something much rarer than a wife. I found a white cat.
        - id: ch05-b04
          speaker: narrator
          text: His brothers laughed heartily.
        - id: ch05-b05
          speakers: [eldest_prince, middle_prince]
          ensemble: duo
          text: Are there so many mice in the palace that you fear they will eat you?
        - id: ch05-b06
          speaker: narrator
          text: The three brothers set out together for the city. Each older prince rode beside his princess in a splendid carriage. Great plumes of feathers waved above their horses, and gold glittered across every harness. The youngest prince came behind them in his own carriage. Last of all came the curtained crystal chair. No one knew what it contained, so everyone along the road stared after it with admiration and curiosity.
        - id: ch05-b07
          speaker: narrator
          text: Courtiers rushed ahead to tell the King that his sons were coming.
        - id: ch05-b08
          speaker: king
          text: Are the ladies beautiful?
        - id: ch05-b09
          speakers: [courtier_one, courtier_two]
          ensemble: duo
          text: No one has ever seen princesses so lovely, Your Majesty.
        - id: ch05-b10
          speaker: narrator
          text: The news seemed to annoy the King. Even so, he welcomed the princes and their companions graciously. He studied the two princesses but could find no way to choose between them. Then he turned to his youngest son.
        - id: ch05-b11
          speaker: king
          text: After all this time, have you returned alone?
        - id: ch05-b12
          speaker: youngest_prince
          text: Your Majesty will find a little white cat inside that crystal chair. Her paws are so soft, and her mew is so pretty, that I am sure she will charm you.
        - id: ch05-b13
          speaker: narrator
          text: The King smiled and reached for the curtains himself. Before he could draw them back, the hidden Princess touched the crystal. The whole chair shattered into a thousand splinters.
        - id: ch05-b14
          speaker: narrator
          text: There stood the Princess in all her beauty, revealed before the King, the three princes, and the whole court. Fair hair flowed over her shoulders beneath a crown of flowers, and her pure white robe fell softly around her. She greeted the King with perfect grace. All through the crowded hall rose a murmur of admiration, for no one had expected to find such a princess inside the crystal chair.
        - id: ch05-b15
          speaker: white_cat
          text: Sire, I have not come to take away the throne you rule so worthily. I already possess six kingdoms. Allow me to give one to you and one to each of your sons. I ask only for your friendship and your permission to marry your youngest son. We will still have three kingdoms for ourselves.
        - id: ch05-b16
          speaker: narrator
          text: The King and every courtier showed their joy and amazement. All three princes were married at once. The celebrations continued for several months. Then each king and queen departed for a kingdom of their own, and they lived happily ever after.
