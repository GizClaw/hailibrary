audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严圆滑而善于掩饰, timbre: 浑厚年长, pace: 从容, pitch: 中低音}
    young_prince:
      display_name: 小王子
      tts: {delivery: 真诚勇敢而有朝气, timbre: 清朗年轻, pace: 中等有变化, pitch: 中音}
    white_cat:
      display_name: 白猫布朗谢特
      tts: {delivery: 温柔聪慧而略带忧伤, timbre: 甜美细柔, pace: 从容, pitch: 中高音}
    cat_singers_1:
      display_name: 猫歌手甲
      tts: {delivery: 奇妙而热情, timbre: 尖细明亮, pace: 轻快, pitch: 高音}
    cat_singers_2:
      display_name: 猫歌手乙
      tts: {delivery: 奇妙而热情, timbre: 轻柔明亮, pace: 轻快, pitch: 中高音}
    old_fairy:
      display_name: 老仙女
      tts: {delivery: 冷静强硬而不容商量, timbre: 干涩年长, pace: 缓慢, pitch: 中低音}
    queen_mother:
      display_name: 王后
      tts: {delivery: 任性急切而感情外露, timbre: 柔美成熟, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 国王的三位儿子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，三个儿子都聪明勇敢。儿子越出色，他心里越不安，总怕自己还活着，他们就想坐上王位。他虽已年老，却觉得国家还治理得很好，半点也不想交权。于是他打算先许下承诺，等兑现时再想办法脱身。
        - id: ch01-b02
          speaker: king
          text: 亲爱的孩子们，我年纪大了，料理国事难免不如从前周全。我怕臣民受苦，想从你们中选一个继承王位。不过，这样贵重的礼物，总该换来一点回报。我日后要住到乡下，正缺一只漂亮、活泼又忠心的小狗作伴。不论长幼，谁带回最漂亮的小狗，我马上把王位传给谁。
        - id: ch01-b03
          speaker: narrator
          text: 三位王子怎么也没想到，父王想要的竟是一只小狗。两个弟弟原本绝不可能继承王位，如今忽然有了机会，自然高兴。长兄教养极好，也不肯提出异议。三人欣然领命，向国王辞行。国王赐给他们银钱和宝石，约定一年之后，在同一时辰、同一地点相见，再看看他们带回来的小狗。三兄弟先一同来到都城外约一法里的一座城堡，亲近的朋友也跟来送行。大家摆下宴席，三兄弟相约永远和睦。无论谁交上好运，都要与另外两人分享，绝不因嫉妒猜忌而反目。他们又说好，到期仍在这座城堡会合，再一起去见国王，这才各走一条路。
        - id: ch01-b04
          speaker: narrator
          text: 两位兄长也经历了许多奇遇，不过我们只讲小王子。他年轻俊美，性情快活，王子该懂的事样样精通，勇气更像永远也用不完。一路上，他几乎每天都买下好几只狗。大的、小的，灵缇、獒犬、猎鹬犬和哈巴狗，什么都有。可每当他买到一只漂亮的，转眼又会看见更漂亮的，只好把先前那只送走，再买下新看中的狗。毕竟他孤身一人，总不能赶着三四万只狗上路。
        - id: ch01-b05
          speaker: narrator
          text: 他就这样漫无目的地走了一天又一天。某个黄昏，他来到一片阴森的大森林，不认识路，偏偏又遇上雷声大作、大雨倾盆。他随便选了一条路，走了很久，才隐约望见一点微光。他盼着前面有间小屋，能让自己借宿一夜。可循着光走到尽头，眼前竟是一座华美得难以想象的城堡。堡门由黄金铸成，嵌满红宝石。正是宝石放出的纯净红光，照亮了他穿过森林的路。墙壁用最上等的瓷砖砌成，颜色淡雅细腻，上面画着他读过的所有故事。可王子浑身湿透，雨又下得正急，实在不能久看，只好回到金门前。门边垂着一只鹿脚，还系在一条钻石链上。他不禁猜想，这座富丽堂皇的城堡里，究竟住着什么人。
        - id: ch01-b06
          speaker: young_prince
          text: 这里的主人一定不怕强盗。谁若砍断钻石链，再挖走红宝石，不就一辈子不愁了吗？
        - id: ch01-b07
          speaker: narrator
          text: 他拉了拉鹿脚，银铃立刻响起，金门也猛然敞开。门里看不见一个人，只有无数只手浮在空中，每只手都举着一支火把。小王子惊得站在原地，一动也不敢动。直到另一些手从背后推着他往前，他才勉强迈开脚步。心里虽有些不安，他也只能继续走，一只手始终按着佩剑，以防不测。就这样，他踏进了一座铺着青金石的大厅。
        - id: ch01-b08
          speakers: [cat_singers_1, cat_singers_2]
          ensemble: duo
          text: 空中飘浮的这些手，听凭吩咐，片刻不休。只要你心中不怕爱来征服，便可安心在此停留。
        - id: ch01-b09
          speaker: narrator
          text: 受到这样的欢迎，王子相信这里不会再有什么危险，便跟着神秘的手走向一扇珊瑚门。门自己打开了，里面是一座巨大的珍珠母大厅，四周又通向许多房间。千万盏灯灿然闪耀，到处都是绝美的画作和珍宝，看得他眼花缭乱。走过整整六十个房间，领路的手才在一张舒适的扶手椅前停下，壁炉里的火也自己燃了起来。那些秀美、柔软又灵巧的手替他脱掉湿淋淋、沾满泥的衣裳，又捧来一身用名贵料子制成、绣满黄金和祖母绿的新衣。王子赞叹眼前的一切，也赞叹手儿们伺候人的利落劲儿。只是它们有时会突然冒出来，着实叫他吓一跳。
    - id: ch02
      title: 白猫的城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 等王子收拾妥当，他已经和刚才站在雨里拉动鹿脚时判若两人。手儿们把他领进一间华丽的餐厅。墙上画着穿靴子的猫和许多别的名猫，桌上摆着两副金盘、金匙和金叉，餐具柜里排满镶嵌宝石的水晶碟盏。王子正猜另一套餐具是为谁准备的，十来只猫走了进来。有的抱着吉他，有的拿着乐谱卷。它们在房间一头各就各位，一只猫挥动纸卷指挥，其余的用想得到的一切音调喵喵高唱，还伸出爪子拨弄琴弦。那音乐古怪极了，王子赶忙捂住耳朵，可只要看一眼这些滑稽的乐师，他又忍不住笑个不停。
        - id: ch02-b02
          speaker: young_prince
          text: 这座城堡里，接下来还会冒出什么怪事？
        - id: ch02-b03
          speaker: narrator
          text: 房门随即打开。一个罩着黑色长面纱的小小身影走了进来，两只披黑斗篷、佩长剑的猫护在左右，后面还跟着一大群猫，抬来许多装满大鼠小鼠的笼子。王子惊讶得以为自己在做梦。那小身影来到他面前，掀开面纱，露出一只任谁都想象不出还能更可爱的白猫。她看起来十分年轻，神情却很忧伤，说话的声音又细又甜，直入人心。
        - id: ch02-b04
          speaker: white_cat
          text: 国王的儿子，欢迎你。猫中王后很高兴见到你。
        - id: ch02-b05
          speaker: young_prince
          text: 猫夫人，多谢你这样亲切。凭你说话的样子，还有这座城堡，我可不信你是只寻常小猫。
        - id: ch02-b06
          speaker: white_cat
          text: 国王的儿子，别再夸我了，我听不惯。我们吃晚餐吧。也请乐师停下来，王子听不懂你们的歌。
        - id: ch02-b07
          speaker: narrator
          text: 手儿们开始上菜，先摆下两只盘子。一盘是炖鸽子，另一盘却是肥老鼠烩肉。王子一看见老鼠，顿时什么胃口都没了。白猫瞧了出来，便向他保证，给他的菜是在另一间厨房里做的，里面绝没有大鼠小鼠。王子相信她不会欺骗自己，这才放心动筷。不久，他注意到白猫靠近自己的一只小爪上戴着手镯，里面嵌着一幅肖像，便借来细看。画上是个英俊非凡的青年，竟与他酷似，几乎就像他的自画像。白猫见他端详那幅肖像，深深叹了口气，神情比先前更加忧伤。王子怕惹她不快，不敢追问，只好谈起别的话题。他很快发现，无论自己关心什么，白猫都兴致盎然，而且对世上正在发生的事情了如指掌。
        - id: ch02-b08
          speaker: narrator
          text: 饭后，他们来到另一间布置成剧场的屋子，看猫儿们演戏跳舞。后来白猫道过晚安，手儿们把王子送进一间从未见过的卧房。墙上挂着用各色蝴蝶翅膀绣成的壁毯，镜子从天花板一直落到地面，白色小床垂着薄纱帐幔，用缎带束在两旁。王子默默上了床，因为他实在不知道该怎样同那些手攀谈。第二天清早，窗外一阵喧闹惊醒了他。手儿们赶来，飞快替他换好猎装。他向外一望，只见所有猫都聚在庭院里。有的牵着灵缇，有的吹着号角，原来白猫要出门打猎。手儿们又牵来一匹木马，要王子骑上去。他觉得这简直是侮辱，可抗议一点用也没有。不一会儿，他已经坐在木马背上。那木马欢快地腾跃起来，驮着他飞奔出去。
        - id: ch02-b09
          speaker: narrator
          text: 白猫自己骑着一只猴子。只要她想捉小鹰，猴子甚至会爬到鹰巢里去。世上再没有比这更愉快的狩猎了。回到城堡，王子又像前一晚那样同白猫共进晚餐。饭后，她递给他一只水晶杯，里面大概装着魔药。王子一饮而尽，竟把一切全忘了。父王要他寻找的小狗、和兄长会合的约定，甚至自己属于哪个国家，他都不记得了，心里只剩下与白猫相伴的快乐。日子就在各式各样的游乐中飞快过去，转眼一年将尽。王子不记得归期，白猫却一直记得。
        - id: ch02-b10
          speaker: white_cat
          text: 你只剩三天替父王找狗了。你的哥哥们已经各自找到一只漂亮的小狗。
        - id: ch02-b11
          speaker: young_prince
          text: 我怎么把这样要紧的事全忘了？我的前程都在这件事上。就算三天内找到能赢得王国的狗，我又去哪里找一匹马，赶完这么远的路？
        - id: ch02-b12
          speaker: white_cat
          text: 国王的儿子，别发愁。我是你的朋友，会替你安排好。你还可以多住一天。那匹木马只要十二个小时，就能送你回国。
        - id: ch02-b13
          speaker: young_prince
          text: 谢谢你，美丽的白猫。可我连小狗都没有，回去有什么用？
        - id: ch02-b14
          speaker: white_cat
          text: 瞧这枚橡子。里面的小狗，比天狼星上的狗还漂亮。
        - id: ch02-b15
          speaker: young_prince
          text: 亲爱的白猫，都到这时候了，你还拿我取笑！
        - id: ch02-b16
          speaker: white_cat
          text: 你先听一听。
        - id: ch02-b17
          speaker: narrator
          text: 白猫把橡子凑到他耳边，他果然清清楚楚地听见里面有个微小的声音在叫。王子高兴极了。能装进橡子里的狗，当然小得不得了。他想立刻把小狗取出来看看，白猫却劝他等到了国王面前再打开，免得小家伙在旅途中受寒。临行的时刻到了，王子向她道谢了千遍万遍，依依不舍地告别。
        - id: ch02-b18
          speaker: young_prince
          text: 和你在一起，日子过得太快了。真希望这次能把你也带走。
        - id: ch02-b19
          speaker: narrator
          text: 白猫只是摇头，深深叹息。
    - id: ch03
      title: 橡子里的小狗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小王子第一个赶到约定的城堡。两个哥哥不久也回来了，看见庭院里的木马像猎马一样蹦跳，全都惊得目瞪口呆。王子欢欢喜喜地迎接他们，听他们讲各自的奇遇，却设法隐瞒了自己这一年来的经历。他甚至故意让哥哥们以为，身边那只转轮狗就是要献给父王的狗。兄弟三人虽然彼此亲爱，两个哥哥想到自己的狗显然胜算更大，还是忍不住暗暗高兴。
        - id: ch03-b02
          speaker: narrator
          text: 第二天清早，三人同乘一辆马车进宫。哥哥们各捧着一只装在篮里的小狗。狗儿娇小脆弱，几乎碰也不敢碰。小王子的转轮狗却跟在车后一路奔跑，弄得满身泥浆，简直看不出原来的模样。到了王宫，众人簇拥着三位王子，一直跟进国王的大殿。两位兄长献上的狗同样漂亮，谁也分不出高下。他们已经私下盘算怎样平分王国，小王子才走上前，取出白猫送的橡子。壳一打开，只见白色软垫上躺着一只小狗，小得轻轻松松就能穿过戒指。他把小狗放到地上，它马上站起来跳起舞来。国王无话可说，因为世上绝不可能有比这小东西更漂亮的狗了。
        - id: ch03-b03
          speaker: narrator
          text: 可国王一点也不急着交出王冠。他说，既然头一回大家都这样成功，不妨再去一次，走遍陆地与海洋，找一块细得能穿过针眼的棉布。兄弟们虽不愿再度出发，两个哥哥想到自己又有了机会，还是答应下来。三人照旧上路。小王子骑上木马，全速奔回白猫的城堡。城堡的每扇门都大开着，每扇窗、每座塔楼都灯火通明，看起来比从前更奇妙。手儿们赶来迎接，牵走木马。王子匆匆入内寻找白猫，见她正在一只铺着白缎软枕的小篮里熟睡。她一听见王子的声音，马上惊醒，发现他真的回来了，欢喜得不得了。
        - id: ch03-b04
          speaker: white_cat
          text: 国王的儿子，我哪里敢指望你还会回来？
        - id: ch03-b05
          speaker: narrator
          text: 王子轻抚着她，把她抱了又抱，讲起自己怎样赢得头一场考验。接着他说明来意，父王又要一块细得能穿过针眼的棉布，那东西根本不可能找得到。白猫的神情严肃起来，说自己得认真想想。幸好城堡里有几只猫极会纺织。如果真有谁能办到，那一定是它们，她会亲自把任务交代下去。
        - id: ch03-b06
          speaker: narrator
          text: 随后，手儿们举着火把出现了，引王子和白猫来到一条俯瞰河流的长廊。他们从窗口看了一场盛大的焰火，各种颜色、各种模样，应有尽有。之后才去吃晚餐。王子骑了很久的马，早已饿坏，因此觉得晚餐甚至比焰火还要可爱。日子又像从前一样飞快过去。白猫最会想出新鲜的游乐，有她作伴，谁也不会觉得无聊。她的聪慧远远超过一只猫该有的分寸，可王子每次追问，她都不肯解释。
        - id: ch03-b07
          speaker: white_cat
          text: 国王的儿子，别问了。任你怎样猜，我也不能告诉你。
        - id: ch03-b08
          speaker: narrator
          text: 王子过得太快活，根本没有留心时日。不久，白猫告诉他一年已经过去，细棉布也已经织得非常好，他完全不必担心。这一回，她还为王子备下了一支相称的随从队伍。庭院里停着一辆锃亮的金车，表面涂成火焰般的颜色，还装饰着一千种不同图案。十二匹雪白的骏马分作三排拉车，身上披着火红的天鹅绒挽具，上面绣满钻石。后面跟着一百辆马车，每辆由八匹马拉着，车里坐满衣着华贵的官员。整支车队四周，还有一千名卫兵护送。
        - id: ch03-b09
          speaker: white_cat
          text: 带着这些人去见国王，他总不能再拒绝你的王冠。收好这枚核桃，见到他以前不要打开。你要的布就在里面。
        - id: ch03-b10
          speaker: young_prince
          text: 可爱的布朗谢特，你这样帮助我，要我怎样回报？只要你希望我留下，我可以不要王位，一辈子陪着你。
        - id: ch03-b11
          speaker: white_cat
          text: 国王的儿子，你竟这样在意一只只会捉老鼠的小白猫，可见你的心很好。但你不能留下。
        - id: ch03-b12
          speaker: narrator
          text: 王子吻过她的小爪，带着车队出发。车队只花了木马一半的时间就赶到王宫，实在快得惊人。这一回王子回来得太晚，没有先去约定的城堡与哥哥们会合。两个哥哥以为他不会来了，心里十分高兴，正得意地向国王展示各自的细棉布。那些布确实很细，足以穿过粗针眼。可国王巴不得挑出毛病，便命人拿来王室珠宝中收藏的一枚特制细针。针眼小得叫人一看便知，任何布都不可能穿过去。两个哥哥正要抱怨这是圈套，忽然号角齐鸣，小王子的车队到了。父王和哥哥们见了那身气派，全都惊叹不已。
        - id: ch03-b13
          speaker: narrator
          text: 问候过父王和哥哥们，他从衣袋里拿出核桃。本以为里面会有细棉布，打开后却只看见一枚榛子。他敲开榛子，里面躺着一颗樱桃核。国王想到有人竟想从坚果壳里找出细棉布，独自吃吃地笑了起来。王子还是敲开樱桃核，大家看见里面只有一粒果仁，也都笑出了声。他剥开果仁，又找到一颗麦粒，麦粒里还有一粒粟子。众人越看越想笑，到了这时，连王子自己也动摇了。
        - id: ch03-b14
          speaker: young_prince
          text: 白猫啊白猫，难道你真在捉弄我？
        - id: ch03-b15
          speaker: narrator
          text: 话音刚落，一只看不见的猫爪便狠狠抓了他的手。他猜白猫是在给自己打气，于是剥开最后那粒粟子。里面竟真能抽出一块足有四百厄尔长的细棉布，上面织着最绚丽的色彩和最奇妙的图案。拿来那枚细针一试，布竟轻轻松松从针眼里穿过六次。国王脸色发白，两个哥哥默默站着，满面愁容。谁也不能否认，这正是世上最神奇的一块细棉布。
    - id: ch04
      title: 第三次考验
      blocks:
        - id: ch04-b01
          speaker: king
          text: 到了晚年，知道你们这么愿意满足我的心愿，最叫我安慰。那就再去一次。一年以后，谁带回世上最美丽的公主，谁就娶她为妻，并立刻得到王冠。我的继承人当然必须成婚。
        - id: ch04-b02
          speaker: narrator
          text: 小王子觉得自己已经堂堂正正赢了两次，可他教养太好，没有开口争辩。他回到华丽的金车上，在随从簇拥下飞驰而去，速度比来时还快。这一回，白猫早就在等他。通往城堡的路上铺满鲜花，一千只火盆燃着芬芳的木料，香气弥漫在空气中。白猫坐在一条长廊里，从那里正好能望见他回来。
        - id: ch04-b03
          speaker: white_cat
          text: 国王的儿子，你又回来了，头上还是没有王冠。
        - id: ch04-b04
          speaker: young_prince
          text: 夫人，多亏你，我已经两次赢得它。父王这样舍不得，我就算拿到手，也不会快乐。
        - id: ch04-b05
          speaker: white_cat
          text: 别在意。再证明一次你配得上它，也没有坏处。下回要带美丽的公主回去，我会替你留心。眼下先快活吧。今晚我安排了猫儿和河鼠大战。
        - id: ch04-b06
          speaker: narrator
          text: 这一年过得比前两年还要快乐。白猫安排的游乐一场接着一场，王子有时还是忍不住问，她究竟为什么会说话。
        - id: ch04-b07
          speaker: young_prince
          text: 也许你本来是仙女，也许某个魔法师把你变成了猫？
        - id: ch04-b08
          speaker: narrator
          text: 白猫每次都避而不答，半点秘密也不肯透露。人在幸福的时候，日子总是走得飞快。一天傍晚，两人坐在一起，白猫忽然告诉王子，归期已经到了。他若想在第二天带一位美丽的公主回国，就必须准备好完全照她的吩咐行事。
        - id: ch04-b09
          speaker: white_cat
          text: 拿起这把剑，砍下我的头。
        - id: ch04-b10
          speaker: young_prince
          text: 要我砍下你的头？亲爱的布朗谢特，我怎么可能下得了手！
          emotion: surprised
        - id: ch04-b11
          speaker: white_cat
          text: 国王的儿子，我求你照做。
        - id: ch04-b12
          speaker: narrator
          text: 王子眼里涌出泪水，求她换一个要求。无论交给他什么任务来证明自己的爱，他都甘愿领受，只求别让他承受杀死心爱小猫的悲痛。可他说尽了话，也动摇不了白猫的决心。最后，他只得拔出长剑。双手不停颤抖，他还是绝望地砍下了那颗白色的小脑袋。
        - id: ch04-b13
          speaker: narrator
          text: 谁知一位美丽的公主忽然出现在他面前。王子的惊喜简直难以想象，震惊得一句话也说不出来。房门又打开了，一大群衣着华贵的骑士和夫人走进来，每个人手里都拿着一张猫皮。他们满面欢欣地奔向公主，亲吻她的手，祝贺她终于恢复本来模样。公主亲切地接待了众人。过了几分钟，她请大家离开，好与王子单独说话。
    - id: ch05
      title: 公主的身世
      blocks:
        - id: ch05-b01
          speaker: white_cat
          text: 王子，你猜得没错，我的确不是寻常的猫。父亲统治六个王国，母后深受他的宠爱，却最喜欢旅行和探险。我出生才几个星期，她便获准带着大批侍从，前往一座听说有无数奇事的山。途中必须经过一座属于仙女的古堡。虽然从来没人进去过，传言却说，那里尽是世间最奇妙的东西。母后还听说，仙女花园里长着别处看不到、也尝不到的果子，便一心想亲口尝尝。
        - id: ch05-b02
          speaker: white_cat
          text: 她来到金光闪闪的大门前，叫仆人拼命敲门，却始终没有回应。城堡里仿佛所有人都睡着了，又像根本没有活人。果子越是拿不到，她越是非要不可，便命人搬来梯子翻墙。那堵墙看着并不太高，可侍从把许多梯子接在一起，弄得再长也碰不到墙顶。眼看天黑，母后只好命人在原地扎营，自己上床歇息。她失望得几乎病倒。半夜忽然醒来，竟看见一个又矮又丑的老太婆坐在床边。
        - id: ch05-b03
          speaker: old_fairy
          text: 陛下非要尝我们的果子，实在给我们添了麻烦。不过，为免您难受，我和姐妹愿让您带走所有拿得动的果子。条件只有一个，把小女儿交给我们，当作亲生孩子抚养。
        - id: ch05-b04
          speaker: queen_mother
          text: 亲爱的夫人，不能换一样东西吗？我的王国都可以给你们！
        - id: ch05-b05
          speaker: old_fairy
          text: 不能。我们只要您的小女儿。她会天天幸福，仙境里真正值得拥有的东西，我们全会给她。可在她出嫁以前，您再也不能见她。
        - id: ch05-b06
          speaker: queen_mother
          text: 这条件太残酷了，可我答应。吃不到果子，我一定会死，到时照样要失去女儿。
        - id: ch05-b07
          speaker: white_cat
          text: 老仙女带母后进了城堡。虽然还是深夜，里面的美丽远胜传闻。王子，你当然相信，因为就是我们所在的地方。
        - id: ch05-b08
          speaker: old_fairy
          text: 王后，您要亲手采果子，还是让我把它们叫来？
        - id: ch05-b09
          speaker: queen_mother
          text: 请把它们叫来吧。我从没见过果子会听召唤。
        - id: ch05-b10
          speaker: old_fairy
          text: 杏子、桃子、油桃、樱桃、李子、梨、甜瓜、葡萄、苹果、橙子、柠檬、醋栗、草莓、覆盆子，全都过来！
        - id: ch05-b11
          speaker: white_cat
          text: 老仙女吹了两声口哨，果子立刻争先恐后地滚了进来。它们没有一个沾上灰，也没有一个碰坏。母后一尝，果然和想象中一样美味，因为这些果子全都长在仙树上。老仙女拿出金篮子，给她装了足足要四百头骡子才能驮走的果子。随后，仙女提醒母后不要忘记约定，便把她送回营地。
    - id: ch06
      title: 高塔与魔法
      blocks:
        - id: ch06-b01
          speaker: white_cat
          text: 第二天早晨，母后带着果子启程回国。可还没走出多远，她便开始后悔这桩交易。父王出城迎接，看出她神情哀伤，猜到一定出了变故。她起初不敢开口，可刚回王宫，仙女就派来五个丑陋可怕的小矮人接我，她只得坦白自己许下的承诺。父王勃然大怒，把母后和我一起锁进高塔，派人严密看守，又把小矮人赶出了国境。
        - id: ch06-b02
          speaker: white_cat
          text: 仙女随即放出一条巨龙。它吃掉沿途遇见的每个人，嘴里喷出的烈火又焚毁了国内的一切。父王想尽办法，也除不掉这头怪兽。为了拯救臣民，他最终只好答应把我交出去。这一回，仙女们亲自来接我。她们乘着海马拉的珍珠车，身后用钻石锁链牵着巨龙。我的摇篮放在老仙女们中间，她们轮流把我抱在怀里爱抚。我们就这样飞过天空，来到一座特意为我建造的高塔。
        - id: ch06-b03
          speaker: white_cat
          text: 我在那里长大，身边尽是美丽稀有的东西，也学会了公主该学的一切。可除了会说话的鹦鹉和小狗，我没有别的同伴。每天都有一位老仙女骑着巨龙来看我。一天，我坐在窗边，看见一位英俊的年轻王子在高塔四周的森林里打猎。他站在塔下抬头望我，发现我注意到他，便恭恭敬敬地行礼。终于有个陌生人能同我说话，你可以想象我有多欣喜。尽管窗口高不可攀，我们还是一直谈到夜幕降临，他才依依不舍地离开。
        - id: ch06-b04
          speaker: white_cat
          text: 后来他常常来看我，我终于答应嫁给他。可是，我们该怎样逃出高塔呢？仙女总会送亚麻给我纺线，我便辛勤劳作，把亚麻搓成长绳，终于结出一架能垂到塔底的软梯。可偏偏就在王子扶我沿着梯子往下爬时，脾气最坏、模样最丑的老仙女飞了回来。他甚至来不及抵抗，便被巨龙一口吞下。
          emotion: sad
        - id: ch06-b05
          speaker: white_cat
          text: 仙女原本打算让我嫁给小矮人国王，我却坚决不肯。眼看计划落空，她们大发雷霆，把我变成一只白猫，又将我带到这里。我这才发现，父王宫廷里的贵族男女也中了同样的魔法，早已变成猫在此等候。身份低一些的人，则全被变得看不见，只剩下一双双手。
        - id: ch06-b06
          speaker: white_cat
          text: 施下魔法时，仙女们才把我的整个身世告诉我。在那以前，我一直以为自己就是她们的孩子。她们还警告我，若想恢复本来面貌，唯一的希望就是赢得一位王子的爱。而那位王子无论声音还是相貌，都必须处处像我那位不幸的爱人。
        - id: ch06-b07
          speaker: young_prince
          text: 而你已经得到这份爱了，亲爱的公主。
        - id: ch06-b08
          speaker: white_cat
          text: 你的声音和相貌都像极了他。只要你真心爱我，我所有的苦难就结束了。
        - id: ch06-b09
          speaker: young_prince
          text: 我的苦难也结束了！只要你愿意嫁给我。
          emotion: happy
        - id: ch06-b10
          speaker: white_cat
          text: 我爱你胜过世上任何人。不过现在该去见你的父王，听听他怎么说。
    - id: ch07
      title: 水晶轿中的公主
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 王子牵起公主的手，领她走出城堡，两人一同登上金车。金车比从前更加华丽，整支队伍也比从前更加气派。就连马蹄铁都是红宝石做的，还用钻石钉子钉牢，这样的东西，世上恐怕还是头一回有人见到。公主不但美丽，而且聪慧善良。这一路上，她说的每一句话，在王子听来都无比动人。
        - id: ch07-b02
          speaker: narrator
          text: 快到兄弟们约定会合的城堡时，公主坐进一顶由四名卫兵抬着的轿子。整顶轿子由一块璀璨的水晶凿成，四周垂着丝帘。她把帘子拉拢，不让旁人看见自己。两位兄长正和各自找到的公主在露台散步，见弟弟回来，便走来迎接，问他是不是也找到了妻子。小王子却说，自己找到的东西更稀有，是一只白猫。两个哥哥听了放声大笑，问他是不是怕王宫会叫老鼠吃掉。
        - id: ch07-b03
          speaker: narrator
          text: 随后众人一同向都城出发。每位王子和公主都坐着华美的马车，马匹头戴羽饰，浑身闪耀着金光。小王子的车跟在他们后面，最后才是那顶神秘的水晶轿。沿途人人都在赞叹，也都好奇轿里藏着什么。车队来到王宫前时，金光几乎照亮了四周。朝臣远远望见他们，赶忙跑进宫里向国王禀报。国王听见消息，焦急地问起那些姑娘。
        - id: ch07-b04
          speaker: king
          text: 那些姑娘真的漂亮吗？
        - id: ch07-b05
          speaker: narrator
          text: 听说从来没人见过如此美丽的公主，国王显得十分懊恼。不过，他还是和颜悦色地迎接了众人。他仔细看过两位姑娘，却怎么也无法分出谁更美，只好转向自己的小儿子。
        - id: ch07-b06
          speaker: king
          text: 到最后，你还是一个人回来了？
        - id: ch07-b07
          speaker: young_prince
          text: 陛下，那顶水晶轿里有一只白猫。她的爪子柔软，叫声又悦耳，您一定会喜欢她。
        - id: ch07-b08
          speaker: narrator
          text: 国王笑了，亲自上前拉开帘子。公主只轻轻一碰，整顶水晶轿便碎成了千百片。她绝世的姿容一下出现在众人眼前。金发披散在肩头，头上戴着鲜花编成的冠冕，一袭纯白长袍柔柔垂落。她优雅地向国王行礼，四周顿时响起一片赞叹的低语。
        - id: ch07-b09
          speaker: white_cat
          text: 陛下，您把王国治理得很好，我不是来夺王位的。我已有六个王国，愿送给您一个，也送给您的每个儿子一个。我只求您的友谊，并请您答应我与小王子成婚。这样，我们自己还留下三个王国。
        - id: ch07-b10
          speaker: narrator
          text: 国王和满朝群臣再也掩不住惊喜。三位王子的婚礼立刻举行，盛大的庆典一连持续了好几个月。后来，每一对国王和王后都回到属于自己的王国，从此永远幸福地生活下去。
