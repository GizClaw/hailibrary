audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严中带着急躁, timbre: 洪亮厚实, pace: 中等, pitch: 中低音}
    wise_old_man:
      display_name: 智慧老人
      tts: {delivery: 从容笃定, timbre: 苍老清晰, pace: 徐缓, pitch: 低音}
    messenger:
      display_name: 国王的使者
      tts: {delivery: 爽快直接, timbre: 清亮结实, pace: 中等, pitch: 中音}
    gardener:
      display_name: 园丁
      tts: {delivery: 朴实拘谨, timbre: 温厚略哑, pace: 稍慢, pitch: 中低音}
    princess:
      display_name: 公主
      tts: {delivery: 坦率坚定, timbre: 年轻明亮, pace: 中等, pitch: 中高音}
    gardener_son:
      display_name: 园丁的儿子
      tts: {delivery: 真诚勇敢, timbre: 年轻清朗, pace: 稳健, pitch: 中音}
    minister_son:
      display_name: 宰相的儿子
      tts: {delivery: 傲慢急促, timbre: 年轻偏尖, pace: 稍快, pitch: 中高音}
    beggar_woman:
      display_name: 老乞妇
      tts: {delivery: 沉静而神秘, timbre: 苍老柔韧, pace: 徐缓, pitch: 中低音}
    herald:
      display_name: 传令官
      tts: {delivery: 高声宣告, timbre: 嘹亮, pace: 稍慢, pitch: 中高音}
    sultan:
      display_name: 苏丹
      tts: {delivery: 尊贵而真诚, timbre: 雄浑, pace: 中等, pitch: 低音}
    slave:
      display_name: 女奴
      tts: {delivery: 恭敬利落, timbre: 柔和清晰, pace: 中等, pitch: 中高音}
    sorcerer:
      display_name: 老巫师
      tts: {delivery: 阴沉狡猾, timbre: 干涩低哑, pace: 稍慢, pitch: 低音}
    mouse_queen:
      display_name: 鼠后
      tts: {delivery: 威严而忧虑, timbre: 细亮端正, pace: 中等, pitch: 高音}
    mouse_envoy:
      display_name: 老鼠使者
      tts: {delivery: 紧张恳切, timbre: 细小清楚, pace: 稍快, pitch: 高音}
    blind_mouse:
      display_name: 盲眼老鼠
      tts: {delivery: 谨慎执着, timbre: 细柔, pace: 中等, pitch: 高音}
    cropped_mouse:
      display_name: 缺耳老鼠
      tts: {delivery: 机敏好胜, timbre: 细脆, pace: 稍快, pitch: 高音}
    lame_mouse:
      display_name: 瘸腿老鼠
      tts: {delivery: 果断好胜, timbre: 细亮, pace: 稍快, pitch: 高音}
  chapters:
    - id: ch01
      title: 不结果的花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王住在一座大宫殿里，宫殿四周是一片宽阔的花园。那里园丁很多，泥土也肥沃，可园里不见鲜花果实，甚至连青草和遮荫的树都不长。国王为这件事愁坏了。
        - id: ch01-b02
          speaker: wise_old_man
          text: 您这些园丁并不懂本行。他们的父亲都是鞋匠和木匠，又能从哪里学会料理花园呢？
        - id: ch01-b03
          speaker: king
          text: 你说得一点不错！
        - id: ch01-b04
          speaker: wise_old_man
          text: 那就去找一位父亲和祖父都做园丁的人吧。用不了多久，园里会长满绿草，开遍鲜花，结出香甜的果子。
        - id: ch01-b05
          speaker: narrator
          text: 国王马上派出使者。他们走遍国土上的每一座城、每一个村庄和小镇，专找祖父和父亲也做园丁的人。整整四十天以后，他们终于找到了一个。
        - id: ch01-b06
          speaker: messenger
          text: 跟我们去吧，给国王料理花园。
        - id: ch01-b07
          speaker: gardener
          text: 我这么穷，怎么能去见国王？再说，我还欠着好几个人的钱。
        - id: ch01-b08
          speaker: messenger
          text: 不妨事。你和家人都有新衣服，欠下的钱也由我们还清。
        - id: ch01-b09
          speaker: narrator
          text: 使者又答应替他还清债务，园丁这才被说动。他带着妻子和儿子来到王宫，国王高兴地把花园全交给他。新园丁料理起来毫不费力。才过一年，御花园便鲜花盛开，果实累累，整座园林和从前完全两样。国王十分欢喜，把一件又一件礼物赏给了他。
        - id: ch01-b10
          speaker: narrator
          text: 园丁的儿子年轻英俊，举止讨人喜欢。他每天把最好的果子送给国王，把最美的花送给公主。公主刚满十六岁，美得惊人，国王也开始为她的婚事打算。
        - id: ch01-b11
          speaker: king
          text: 女儿，你已经到了成婚的年纪。我想把你嫁给宰相的儿子。
        - id: ch01-b12
          speaker: princess
          text: 父王，我绝不会嫁给他。
        - id: ch01-b13
          speaker: king
          text: 为什么？
        - id: ch01-b14
          speaker: princess
          text: 因为我爱的是园丁的儿子。
        - id: ch01-b15
          speaker: narrator
          text: 国王一听先是大发雷霆，随后又流泪又叹气，怎么也不肯承认园丁的儿子配得上公主。可女儿心意已定，非园丁的儿子不嫁。国王只好召集大臣。大臣们献计说，要摆脱这个年轻人，就把两个求婚者都派到极远的国度去，谁先回来，谁才有资格迎娶公主。
        - id: ch01-b16
          speaker: narrator
          text: 国王照计行事。宰相的儿子得到一匹骏马，还有装得满满的一袋金币。园丁的儿子分到的，却只有一匹又老又瘸的马和一袋铜钱。两边相差如此悬殊，所有人都断定，园丁的儿子这一走，再也回不来了。
        - id: ch01-b17
          speaker: princess
          text: 你一定要勇敢，也别忘了我爱你。带上这袋珠宝，好好使用它们，快些回来向父王求娶我。

    - id: ch02
      title: 老乞妇的指点
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两人一同离开京城。宰相的儿子骑着好马一路飞奔，很快便消失在最远的山岭后面。他又赶了几天路，来到一眼泉边。一个衣衫褴褛的老妇人正坐在泉旁的石头上。
        - id: ch02-b02
          speaker: beggar_woman
          text: 年轻的旅人，祝你平安。可怜可怜我吧，我已经三天没吃东西，快要饿死了。
        - id: ch02-b03
          speaker: minister_son
          text: 别来烦我，老妖婆！我帮不了你。
          emotion: disgusted
        - id: ch02-b04
          speaker: narrator
          text: 老妇人第一次向他问好时，宰相的儿子一声不答。等她再次求助，他才丢下那句狠话，头也不回地走了。就在当天傍晚，园丁的儿子骑着那匹瘸腿灰马，也来到这眼泉边。
        - id: ch02-b05
          speaker: beggar_woman
          text: 年轻的旅人，祝你平安。请你可怜可怜我。
        - id: ch02-b06
          speaker: gardener_son
          text: 也祝你平安，大娘。拿着我的钱袋，再坐到我身后吧。你的腿脚一定没什么力气了。
        - id: ch02-b07
          speaker: narrator
          text: 老妇人不等他再请，马上坐到他的身后。两人就这样来到一个强大王国的都城。先到的宰相之子住进豪华客店，园丁的儿子和老妇人却在专供乞丐投宿的小店下了马。第二天，街上传来一阵喧闹。国王的传令官吹着各种乐器走过，一路高喊。
        - id: ch02-b08
          speaker: herald
          text: 国王年老体弱！谁能治好他，让他恢复青春，谁就能得到重赏！
        - id: ch02-b09
          speaker: beggar_woman
          text: 想得到赏赐，就从南门出城。那里有白、黑、红三只小狗。把它们分别杀死烧掉，骨灰装进同色的袋子。再到宫门前宣称，阿尔巴尼亚亚尼纳来了一位名医，只有他能让国王恢复青春。
        - id: ch02-b10
          speaker: beggar_woman
          text: 御医会说你是骗子，也会百般阻拦，但你终究能见到国王。到时要三头骡子驮得动的木柴和一口大锅，把自己和苏丹关在屋里。水开以后，把他放进锅里，煮到骨肉分离。你再摆好骨头，撒上三袋骨灰，他就会活过来，变回二十岁的模样。
        - id: ch02-b11
          speaker: beggar_woman
          text: 作为报酬，你只要那枚能满足一切愿望的青铜戒指。去吧，孩子，我说的每一句都别忘。
        - id: ch02-b12
          speaker: narrator
          text: 年轻人一句也没有忘。他从南门出去，果然找到白、红、黑三只小狗。他把它们杀死，分别烧成灰，装进三个袋子，然后跑到宫门前，宣告亚尼纳的名医已经来到，只有这位医生能让国王重获青春。御医们起先只顾嘲笑这个来历不明的旅人，苏丹却下令放他进宫。
        - id: ch02-b13
          speaker: narrator
          text: 一口大锅和几大驮木柴都送来了。房门紧闭，水很快沸腾，国王就在锅里煮到骨肉完全分离。临近中午，园丁的儿子把每一块骨头放回原位。三袋骨灰才刚撒下，老国王便睁开眼睛，重新活了过来。他低头一看，自己竟又年轻又强健，正像二十岁时一样。
        - id: ch02-b14
          speaker: sultan
          text: 恩人，我该怎样报答你？给你一半财宝，还是把女儿嫁给你？要不，就拿走我的半壁江山！
          emotion: happy
        - id: ch02-b15
          speaker: gardener_son
          text: 这些我都不要。请把那枚能立刻实现愿望的青铜戒指给我。
        - id: ch02-b16
          speaker: sultan
          text: 唉，那枚神奇的戒指是我的珍宝。不过，我答应给你。
        - id: ch02-b17
          speaker: narrator
          text: 苏丹虽然舍不得这件宝物，仍守住诺言，把戒指交给了他。园丁的儿子先回到穷人客店，郑重向老乞妇道别，接着举起了青铜戒指。

    - id: ch03
      title: 金船归来
      blocks:
        - id: ch03-b01
          speaker: gardener_son
          text: 青铜戒指，请备一艘船让我继续旅行。我要纯金船身、白银桅杆、锦缎船帆。十二位英俊的年轻人穿得像国王一样，由圣尼古拉斯掌舵。船舱里装满钻石、红宝石、绿宝石和红榴石。
        - id: ch03-b02
          speaker: narrator
          text: 话音刚落，海上立刻出现了一艘华美的大船，船身、桅杆、船帆、水手和货物，全都与他说的一模一样。年轻人登船继续远行。不久，他来到一座大城，在一座奇丽的宫殿里住下。几天后，他竟遇见了自己的对手。宰相的儿子已经花光所有钱财，沦落到替人搬运尘土和垃圾。
        - id: ch03-b03
          speaker: gardener_son
          text: 你叫什么？出身哪一家，又从哪里来？
        - id: ch03-b04
          speaker: minister_son
          text: 我本是一个大国的宰相之子，现在却只能干这种低贱的活儿。
        - id: ch03-b05
          speaker: gardener_son
          text: 我虽然不认识你，却愿意送你一艘船回国，只是有个条件。你跟我到宫里来。
        - id: ch03-b06
          speaker: minister_son
          text: 无论什么条件，我都答应。
        - id: ch03-b07
          speaker: narrator
          text: 宰相的儿子始终没认出眼前的富人，便跟他来到宫中。园丁的儿子朝奴仆做了个手势，他们马上把新来的客人脱得精光。主人又命人把青铜戒指烧得通红，在那人的背上狠狠烙下一个印记。奴仆完全照办。
        - id: ch03-b08
          speaker: gardener_son
          text: 现在，我会给你一艘回国的船。青铜戒指，听从命令。船板要半腐朽，漆成黑色，船帆破烂。水手们病弱残疾，有人缺腿，有人少胳膊，有人驼背、跛脚、失明，满身伤疤。立刻照办。
        - id: ch03-b09
          speaker: narrator
          text: 戒指也完全照办。宰相的儿子登上这艘破败不堪的船。一路风向有利，他终于回到自己的国家。尽管他乘的船如此可怜，模样也如此凄惨，人们仍然欢欢喜喜地迎接了他。
        - id: ch03-b10
          speaker: minister_son
          text: 我第一个回来了。请您履行诺言，把公主嫁给我。
        - id: ch03-b11
          speaker: narrator
          text: 宫里立刻开始筹备婚礼。可怜的公主知道自己即将嫁给宰相的儿子，又伤心又愤怒，却想不出脱身的办法。第二天清早，天才刚亮，一艘张满所有船帆的奇船便驶到城前抛锚。国王恰好站在宫殿窗口。他从未见过这样的船，金色的船身闪闪发亮，银桅杆上张着丝绸船帆。那些年轻水手个个都像王子，他甚至还看见圣尼古拉斯亲自在掌舵。
        - id: ch03-b12
          speaker: king
          text: 快去把那艘奇船的船长请到宫里来！
        - id: ch03-b13
          speaker: narrator
          text: 仆人们立刻遵命而去。不久，一位俊美得惊人的年轻王子走进宫来。他身穿华贵丝袍，衣上缀满珍珠和钻石。
        - id: ch03-b14
          speaker: king
          text: 年轻人，不管你是谁，我都欢迎你。留在都城时，请做我的贵客。我的女儿就要结婚了，你愿意把她交到新郎手中吗？
        - id: ch03-b15
          speaker: gardener_son
          text: 多谢陛下。我愿意接受邀请，也很乐意为公主送嫁。
        - id: ch03-b16
          speaker: narrator
          text: 国王请船长留下做客。没过多久，公主和她那位未婚夫也来到他们面前。
        - id: ch03-b17
          speaker: gardener_son
          text: 这是怎么回事？您真要把这样迷人的公主嫁给那个人？他其实是我的仆人。
        - id: ch03-b18
          speaker: king
          text: 他可是我宰相的儿子！怎么会是你的仆人？
          emotion: surprised
        - id: ch03-b19
          speaker: gardener_son
          text: 我在远方见到他时，他正替人搬运尘土和垃圾。我可怜他，才收下他。送他回来的那艘黑色破船，也是我给他的，船上全是病弱残疾的水手。
        - id: ch03-b20
          speaker: king
          text: 他回来时确实如此。
        - id: ch03-b21
          speaker: minister_son
          text: 他在撒谎！我根本不认识他！
          emotion: angry
        - id: ch03-b22
          speaker: gardener_son
          text: 陛下，叫人脱去他的衣服吧。看看他背上有没有我用戒指烙下的印记。
        - id: ch03-b23
          speaker: narrator
          text: 国王正要命人剥去宰相之子的衣服。那年轻人一想到背上的印记会暴露在众人眼前，实在受不了这份羞辱，只好当场承认，船长说的一切都是真的。
        - id: ch03-b24
          speaker: gardener_son
          text: 陛下，现在您认出我了吗？
        - id: ch03-b25
          speaker: princess
          text: 我认得你。你就是我一直深爱的园丁之子，也是我唯一愿意嫁的人。
          emotion: happy
        - id: ch03-b26
          speaker: king
          text: 那你就做我的女婿！庆典已经开始，今天便迎娶我的女儿吧！
          emotion: happy
        - id: ch03-b27
          speaker: narrator
          text: 婚礼早已准备妥当，于是园丁的儿子就在当天娶了美丽的公主。几个月过去，年轻夫妻一天到晚都过得无比幸福。国王也越来越得意，觉得自己能找到这样出色的女婿，实在做得太对了。

    - id: ch04
      title: 戒指失窃
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可是没过多久，金船的船长有要事在身，必须出海远航。他深情地拥抱妻子，随后登船离去。京城郊外住着一个老人，一辈子都在钻研黑暗法术，炼金术、占星术、魔法和巫术，他样样都学。这个人查明，园丁的儿子能娶到公主，全靠青铜戒指里的精灵相助。
        - id: ch04-b02
          speaker: sorcerer
          text: 那枚戒指，我一定要弄到手。
        - id: ch04-b03
          speaker: narrator
          text: 他来到海边，捉了几条红色的小鱼。那些鱼小巧鲜亮，实在漂亮得出奇。老人带着鱼回到城里，故意从公主窗前走过，一边走，一边放声叫卖。
        - id: ch04-b04
          speaker: sorcerer
          text: 谁要漂亮的红色小鱼？
        - id: ch04-b05
          speaker: narrator
          text: 公主听见后，派女奴出去询问。
        - id: ch04-b06
          speaker: slave
          text: 你的鱼卖多少钱？
        - id: ch04-b07
          speaker: sorcerer
          text: 我只要一枚青铜戒指。
        - id: ch04-b08
          speaker: slave
          text: 青铜戒指？你这老傻瓜，我上哪儿找去？
        - id: ch04-b09
          speaker: sorcerer
          text: 公主房间的坐垫下面就有一枚。
        - id: ch04-b10
          speaker: narrator
          text: 女奴回去告诉公主，老疯子不要金银，只要藏在坐垫下的青铜戒指。
        - id: ch04-b11
          speaker: princess
          text: 那就找到戒指，拿去换鱼吧。
        - id: ch04-b12
          speaker: narrator
          text: 女奴在房里找了好一阵，果然从坐垫下面摸出青铜戒指。原来金船的船长离家时，一时疏忽，把最珍贵的宝物落在了这里。她拿戒指去换红鱼，老人一接到手，便立刻逃回自己的住处。
        - id: ch04-b13
          speaker: sorcerer
          text: 青铜戒指，听从主人。让金船变成黑木船，让船员变成面目丑陋的黑人。叫圣尼古拉斯离开船舵，船上的货物全都变成黑猫。
        - id: ch04-b14
          speaker: narrator
          text: 戒指里的精灵服从了新主人。海上的金船顷刻变成一艘又黑又破的木船，英俊的水手全都变得面目丑陋，圣尼古拉斯从船舵前消失了，满舱的钻石和宝石只剩下一群黑猫。年轻的船长看见自己在茫茫海上落到这般凄惨的境地，立刻明白一定有人偷走了青铜戒指。他放声哀叹自己的不幸，可无论哭喊多久，眼前的一切都没有改变。
        - id: ch04-b15
          speaker: gardener_son
          text: 唉，偷戒指的人也许连我亲爱的妻子都抢走了。我再回祖国，又有什么用？
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 他不肯回国，驾船从一座岛漂到另一座岛，从一片海岸漂到另一片海岸。无论停在哪里，他都觉得每个人在嘲笑自己。不久，他们穷困到了极点，船长、船员和可怜的黑猫全都没有别的食物，只能吃青草和树根。这样漂泊了很久，破船终于来到一座老鼠居住的岛。
        - id: ch04-b17
          speaker: narrator
          text: 船长上岸探查。岛上到处都是老鼠，除了老鼠，几乎什么也看不见。几只黑猫也跟着他溜上岸。它们已经好几天没吃东西，饿得发狂，一见鼠群便扑过去，在岛上大肆捕杀。

    - id: ch05
      title: 三只老鼠出发
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 鼠后急忙召集群臣商议。
        - id: ch05-b02
          speaker: mouse_queen
          text: 船长若不关住这些凶猛的猫，我们会被吃得一只不剩。选最勇敢的老鼠去见他吧。
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: 几只老鼠自告奋勇，找到年轻的船长。
        - id: ch05-b04
          speaker: mouse_envoy
          text: 船长，请快离开这座岛吧，不然我们全都会死。
          emotion: fearful
        - id: ch05-b05
          speaker: gardener_son
          text: 我可以走，但你们得找回被狡猾魔法师偷走的青铜戒指。办不到，我就把所有的猫放上岛，让你们一只不剩。
        - id: ch05-b06
          speaker: narrator
          text: 使者们吓得魂不附体，赶紧退回去禀告鼠后。鼠后焦急地问群臣该怎么办，又问该到哪里寻找这枚戒指。她只好再次召开大会，把世界各地的老鼠全召来打听。可是问遍大家，谁也不知道戒指的下落。就在这时，三只老鼠从极遥远的国家赶到。一只眼盲，一只腿瘸，另一只的耳朵被剪掉了。
        - id: ch05-b07
          speakers: [blind_mouse, cropped_mouse, lame_mouse]
          ensemble: chorus
          text: 嗬，嗬，嗬！我们从很远的国家来。
        - id: ch05-b08
          speaker: mouse_queen
          text: 你们知道那枚能号令精灵的青铜戒指在哪里吗？
        - id: ch05-b09
          speakers: [blind_mouse, cropped_mouse, lame_mouse]
          ensemble: chorus
          text: 我们知道！一个老巫师占了它，白天放在口袋里，夜里含在嘴里。
        - id: ch05-b10
          speaker: mouse_queen
          text: 去把它取回来，越快越好。
        - id: ch05-b11
          speaker: narrator
          text: 三只老鼠自己做了一条小船，扬帆驶向巫师的国家。抵达京城后，它们上了岸，朝王宫跑去，只留下盲眼老鼠在海边看守小船。缺耳老鼠和瘸腿老鼠一直等到夜里。邪恶的老人上床躺下，像往常一样把青铜戒指含进嘴里，很快便沉沉睡去。
        - id: ch05-b12
          speaker: lame_mouse
          text: 我们现在怎么办？
        - id: ch05-b13
          speaker: narrator
          text: 缺耳老鼠找到一盏油灯和一瓶胡椒。她把尾巴先浸进油里，再蘸满胡椒，伸到巫师鼻子下面。
        - id: ch05-b14
          speaker: narrator
          text: 老人“阿嚏、阿嚏”连打两个喷嚏，却始终没有醒。那阵震动把青铜戒指从他嘴里弹了出来。瘸腿老鼠眼疾手快，一把抓起珍贵的宝物，带着它逃回船上。等巫师醒来，到处找不到戒指，简直绝望透顶。可这时，三只老鼠早已带着宝物启航，顺风驶向鼠后等待的岛屿。

    - id: ch06
      title: 戒指落海
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 船上，三只老鼠谈起这次冒险，忽然一同问了起来。
        - id: ch06-b02
          speakers: [blind_mouse, cropped_mouse, lame_mouse]
          ensemble: chorus
          text: 我们三个，究竟谁的功劳最大？
        - id: ch06-b03
          speaker: blind_mouse
          text: 当然是我。要不是我守着船，它早就漂进大海了。
        - id: ch06-b04
          speaker: cropped_mouse
          text: 才不是！是我让戒指从巫师嘴里跳出来的，功劳应该归我。
        - id: ch06-b05
          speaker: lame_mouse
          text: 功劳是我的！戒指是我抢到手，也是我带着它逃走的。
        - id: ch06-b06
          speaker: narrator
          text: 三只老鼠从大声争辩变成互相叫骂，又从叫骂变成了扭打。唉，就在她们打得最厉害的时候，谁也没有护住那枚青铜戒指。它从船上滚落，扑通一声掉进大海。
        - id: ch06-b07
          speakers: [blind_mouse, cropped_mouse, lame_mouse]
          ensemble: chorus
          text: 都怪我们太蠢！戒指丢了，全族也会被消灭。我们还有什么脸去见女王？不如登上那座荒岛，在那里结束性命吧。
          emotion: sad
        - id: ch06-b08
          speaker: narrator
          text: 她们说完就把小船划向眼前的荒岛。三只老鼠登岸不久，缺耳老鼠和瘸腿老鼠便丢下盲眼姐妹，各自去捕苍蝇。盲眼老鼠独自伤心地沿着海岸徘徊，偶然发现一条死鱼。她正吃着，牙齿忽然碰到一件硬得出奇的东西，连忙惊叫起来。两个姐妹听见声音，都跑到了她身边。
        - id: ch06-b09
          speakers: [blind_mouse, cropped_mouse, lame_mouse]
          ensemble: chorus
          text: 是青铜戒指！宝物找回来了！
          emotion: happy
        - id: ch06-b10
          speaker: narrator
          text: 三只老鼠高高兴兴地重新登船，很快回到鼠岛。她们回来得正是时候，船长已经失去耐心，正准备把满船的黑猫全部放上岸。老鼠使者匆匆赶到，在最后关头把珍贵的青铜戒指交给了他。

    - id: ch07
      title: 金船再现
      blocks:
        - id: ch07-b01
          speaker: gardener_son
          text: 青铜戒指，听从主人。让我的船恢复原来的模样。
        - id: ch07-b02
          speaker: narrator
          text: 戒指里的精灵马上动手。破旧的黑船重新变成华美的金船，锦缎船帆高高扬起。英俊的水手们也恢复了原貌，纷纷奔向银桅杆和丝缆绳。不一会儿，船便离开鼠岛，朝京城驶去。船儿飞快掠过明镜般的海面，水手们一路唱着欢快的歌。
        - id: ch07-b03
          speaker: narrator
          text: 经过航行，金船终于抵达港口。船长一上岸就朝王宫飞奔，在那里找到了正在睡觉的邪恶老人。公主也终于见到丈夫，她扑上去紧紧抱住他，久久不肯松手。巫师惊醒后转身想逃，却立刻被人抓住，用粗绳牢牢捆了起来。
        - id: ch07-b04
          speaker: narrator
          text: 第二天，人们牵来一头性情凶悍的骡子，骡背上驮满了坚果。他们把巫师紧紧绑在骡子的尾巴上，让骡子拖着他一路狂奔。最后，巫师摔成的碎块，竟和骡背上的坚果一样多。
