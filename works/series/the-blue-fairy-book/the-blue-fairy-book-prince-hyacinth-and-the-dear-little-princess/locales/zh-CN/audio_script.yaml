audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 自信而热切, timbre: 洪亮厚实, pace: 中等, pitch: 中低音}
    first_fairy:
      display_name: 仙女
      tts: {delivery: 神秘而直率, timbre: 清澈柔和, pace: 舒缓, pitch: 中高音}
    enchanter:
      display_name: 魔法师
      tts: {delivery: 冷酷而威吓, timbre: 低沉锐利, pace: 稍慢, pitch: 低音}
    prince_hyacinth:
      display_name: 风信子王子
      tts: {delivery: 骄傲坦率又不失礼貌, timbre: 年轻明亮, pace: 中等有变化, pitch: 中音}
    old_fairy:
      display_name: 老仙女
      tts: {delivery: 健谈自得又带着善意, timbre: 苍老清亮, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 猫尾巴上的魔法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王深深爱着一位公主。可公主身中魔法，不能嫁给任何人。国王只好找到一位仙女，请她指点自己怎样才能赢得公主的心。
        - id: ch01-b02
          speaker: first_fairy
          text: 公主最疼爱那只大猫。谁能踩中它的尾巴，谁就是命里该娶她的人。
        - id: ch01-b03
          speaker: narrator
          text: 国王觉得这事一点也不难。他告别仙女时已经打定主意，无论如何也要成功。哪怕得把那条猫尾巴踩得粉碎，他也一定要踩中。
        - id: ch01-b04
          speaker: narrator
          text: 他马上去见公主。大猫照旧弓起背，走在前头。国王跨出一大步，眼看就要把猫尾巴踩住，那只猫却猛一转身，让他踏了个空。接下来八天，猫尾巴没有一刻安稳。国王简直怀疑里面灌了水银。
        - id: ch01-b05
          speaker: narrator
          text: 后来，他终于撞见大猫睡得正熟，尾巴正好摊在一旁。他一秒也没耽误，抬脚狠狠踩了下去。大猫惨叫着跳起，眨眼间化成一个高大的男人。那人怒视着国王。
        - id: ch01-b06
          speaker: enchanter
          text: 你解开了魔法，可以迎娶公主。可我也要报复你。你会生下一个儿子，他若看不出自己的鼻子太长，就永远不会幸福。你要敢把我的话告诉别人，立刻就会消失，从此再没人能看见你，也没人能听到你的消息。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 国王怕这魔法师怕得要命，却还是被那句威胁逗笑了。
        - id: ch01-b08
          speaker: king
          text: 我儿子的鼻子若真有那么长，他难道看不见也摸不着？除非他没眼睛，也没双手。
        - id: ch01-b09
          speaker: narrator
          text: 魔法师已经不见了，国王不愿再浪费时间琢磨这件事，立刻去找公主。公主很快答应了婚事。可两人成婚还没多久，国王便去世了。王后失去了丈夫，从此一心只牵挂幼小的儿子风信子。
        - id: ch01-b10
          speaker: narrator
          text: 小王子有一双蓝汪汪的大眼睛，那是世上最漂亮的眼睛。他还有一张可爱的小嘴。偏偏他的鼻子大得惊人，足足遮住了半张脸。王后一看便伤心得怎么也安慰不了。宫里的女官们赶紧告诉她，鼻子只不过看着大，其实那是高贵的罗马鼻。只要随手翻开一本史书，就会发现英雄个个都有大鼻子。王后爱极了孩子，听到这里很是欣慰。她再看风信子时，果然觉得鼻子没有刚才那么大了。

    - id: ch02
      title: 最美的长鼻子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 风信子王子被人无微不至地照料着。才刚会说话，他听到的便全是短鼻子人物的可怕故事。鼻子不像他的人，谁都不许靠近。朝臣们为了讨王后欢心，每天要把自家孩子的鼻子拉上好几回，盼着那些鼻子也能越长越长。可他们费尽力气，仍没有一只鼻子能同王子的相比。
        - id: ch02-b02
          speaker: narrator
          text: 等王子懂事以后，他开始学习历史。老师每讲到一位伟大的王子或美丽的公主，都特意告诉他，那人长着一只长鼻子。他房间四面的墙上也挂满了画像，画中人无一不是大鼻子。风信子就这样一天一天长大，越来越相信长鼻子才是了不起的美貌。谁要把他的鼻子缩短哪怕一寸，他无论如何也不会答应。
        - id: ch02-b03
          speaker: narrator
          text: 王子过了二十岁生日，王后命人送来许多公主的画像，让他挑选妻子。其中一幅画着可爱的小公主。她是大国王的女儿，将来会继承好几个王国，可风信子根本没有心思管这些。他只看见了她的美貌。
        - id: ch02-b04
          speaker: narrator
          text: 小公主生着一只俏皮的、微微上翘的小鼻子，衬在她脸上再漂亮不过。朝臣们却犯了难。他们嘲笑短鼻子成了习惯，有时还没想起眼前画的是谁，笑声已经脱口而出。可在王子面前，这样做万万不行。王子一点也不觉得好笑，两个胆敢对小公主鼻子出言不敬的朝臣，甚至被他赶出了国境。
        - id: ch02-b05
          speaker: narrator
          text: 其他人看见他们的下场，从此开口前都要三思。有个朝臣甚至告诉王子，男人没有长鼻子固然不会有出息，女人的美却完全是另一回事。他还声称认识一位通晓希腊文的学者。那学者读过古代手稿，发现美丽的克娄巴特拉本人，正有一只鼻尖上翘的鼻子。
        - id: ch02-b06
          speaker: narrator
          text: 王子听了这个好消息，赏给朝臣一份厚礼，马上派使者去求婚。小公主的父王答应了。风信子急着见她，亲自赶出三法里路迎接。四周的人都在看着，他正走上前去，想亲吻公主的手，魔法师忽然像闪电一样现身。众人吓得魂不附体，只见他一把抓住小公主，卷着她消失得无影无踪。
        - id: ch02-b07
          speaker: narrator
          text: 风信子留在原地，伤心得谁也安慰不了。他当众发誓，只要一天找不到小公主，就一天不回自己的王国。他还拒绝让任何一个朝臣跟随，独自跨上马背，连该朝哪里走也不再费心，只让坐骑自己选择道路，载着他悲伤地远去。
        - id: ch02-b08
          speaker: narrator
          text: 没过多久，他来到一片辽阔的平原。从早到晚骑了一整天，连一座房屋也没看见。夜幕降临时，王子和坐骑都饿得厉害。就在这时，他忽然发现远处有一点光，仿佛从洞穴里透出来。他催马来到近前，看见洞里坐着一个小个子的老妇人，看上去至少有一百岁了。

    - id: ch03
      title: 两只可笑的鼻子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老妇人想看清风信子，便拿出眼镜。可她的鼻子短得厉害，眼镜怎么也找不到安稳的位置。她费了好半天工夫，才终于把它架好。王子和老妇人刚刚看清对方，就一齐笑得停不下来，还在同一时刻喊出了同一句话。原来，这老妇人也是一位仙女。
        - id: ch03-b02
          speakers: [prince_hyacinth, old_fairy]
          ensemble: duo
          text: 哎呀，你的鼻子真可笑！
          emotion: surprised
        - id: ch03-b03
          speaker: prince_hyacinth
          text: 您的鼻子比我的更可笑。不过，夫人，咱们先别管鼻子了。请给我一点吃的吧，我和那匹可怜的马都快饿坏了。
        - id: ch03-b04
          speaker: old_fairy
          text: 没问题。你的鼻子虽然荒唐，你到底是我最好朋友的儿子。我把你父亲当亲兄弟一样爱。他可有一只漂亮的鼻子！
        - id: ch03-b05
          speaker: prince_hyacinth
          text: 那我的鼻子到底少了什么？
        - id: ch03-b06
          speaker: old_fairy
          text: 它什么也不少，反倒多过头了。不过鼻子太长，也不妨碍一个人有价值。我和你父亲是老朋友，他从前常来看我。那时我很美，至少他一直这样说。我真想讲讲最后一次见他时，我们谈了些什么。
        - id: ch03-b07
          speaker: prince_hyacinth
          text: 等我吃过晚饭，我会很乐意听。可您想想，我今天什么也没吃过。
        - id: ch03-b08
          speaker: old_fairy
          text: 可怜的孩子说得对，我竟然忘了。进来吃晚饭吧。你吃的时候，我用几句话就能讲完。我最不喜欢没完没了的故事，舌头太长比鼻子太长还糟。年轻时人人都夸我不多嘴，还常把这话告诉我的母后。别看我现在这样，我曾是大国王的女儿。说到我的父王——
        - id: ch03-b09
          speaker: prince_hyacinth
          text: 您的父王肚子饿时，想必有东西吃吧！
        - id: ch03-b10
          speaker: old_fairy
          text: 当然有，你也马上就能吃饭。我只是想先告诉你——
        - id: ch03-b11
          speaker: narrator
          text: 王子已经很恼火了。他说，自己没吃东西以前，实在听不进去。可他还需要仙女帮忙，于是硬把口气放得客气起来。
        - id: ch03-b12
          speaker: prince_hyacinth
          text: 听您说话一定会叫人入迷，我也许连饿都忘了。可是我的马听不见您的话，总该先喂一喂它吧？
        - id: ch03-b13
          speaker: narrator
          text: 这句恭维让仙女非常高兴。她叫来了仆人。
        - id: ch03-b14
          speaker: old_fairy
          text: 你这么有礼貌，一分钟也别再等了。鼻子虽然大得出奇，你这个人倒十分可爱。
        - id: ch03-b15
          speaker: prince_hyacinth
          text: 这老太太怎么总抓住我的鼻子不放？好像她少的那一截全长到我脸上了！若不是我饿得厉害，早就丢下这个自以为话少的唠叨鬼走了。她看不见自己的毛病，真够愚蠢。只因为是公主，就被奉承的人惯坏了，竟以为自己说话很有分寸！
        - id: ch03-b16
          speaker: narrator
          text: 仆人们忙着把晚饭摆上桌。仙女只是喜欢听自己说话，就接连问了他们上千个问题。王子在一旁听着，觉得十分好笑。他尤其留意到一个女仆。无论大家正在谈什么，她总能把话绕回来，恰到好处地赞美女主人的智慧。
        - id: ch03-b17
          speaker: prince_hyacinth
          text: 幸好我来了一趟，才更明白自己从不听奉承有多聪明。这种人当面乱夸，把缺点藏起来，还会把缺点说成优点。我绝不会受骗。至少，我知道自己有什么毛病。
        - id: ch03-b18
          speaker: narrator
          text: 可怜的风信子！他真心相信这番话，完全不知道夸他鼻子的人也在暗笑他，就像女仆暗笑仙女那样。因为他亲眼看见，只要仙女没留神，那女仆就偷偷地笑。

    - id: ch04
      title: 老仙女说个不停
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子虽然看穿了女仆，却一句话也没说。过了一会儿，他总算吃下不少东西，饥饿慢慢消退。老仙女见他腾出了耳朵，马上又说了起来。
        - id: ch04-b02
          speaker: old_fairy
          text: 亲爱的王子，请你往那边挪一点好吗？你的鼻子投下好大一片阴影，我连盘子里的食物都看不见。谢谢。现在该谈谈你父亲了。我去他宫廷时，他还是个小男孩。那已经是四十年前，从那以后我一直住在这个荒凉地方。如今外面是什么样？贵妇们还爱玩吗？我们那时每天都有宴会、戏剧、舞会和散步。哎呀，你的鼻子太长了，我怎么也习惯不了！
        - id: ch04-b03
          speaker: prince_hyacinth
          text: 夫人，请别再提我的鼻子。它是什么模样，并不碍着您。我对它很满意，也不想让它变短。人天生是什么样，就该接受什么样。
        - id: ch04-b04
          speaker: old_fairy
          text: 可怜的风信子，你生我的气了。我不是故意惹你，只是想帮忙。你的鼻子确实让我吃惊，但我会尽量不再说，甚至努力把它看成普通鼻子。说真的，它足够做三只大小合适的鼻子。
        - id: ch04-b05
          speaker: narrator
          text: 王子这时已经吃饱，再也忍受不了仙女不停议论他的鼻子。他一刻也不愿多待，跳上马背，匆匆离开。可后面的旅途中，无论走到什么地方，人们都在谈论他的鼻子。王子只觉得那些人全都疯了。毕竟从小到大，他听见的始终是别人称赞那只鼻子漂亮。听惯了这样的话，他无论如何也不能承认鼻子其实太长。

    - id: ch05
      title: 水晶宫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 老仙女并没有因王子的离去而生气。她一心想让他得到幸福，思来想去，终于有了一个办法。她把可爱的小公主关进一座透明的水晶宫，又把整座宫殿放在王子无论如何也不会错过的地方。
        - id: ch05-b02
          speaker: narrator
          text: 风信子终于又见到了公主，欢喜得难以形容。他立刻动手，使出全身力气，想砸开囚禁她的水晶宫。可是无论怎样努力，水晶仍纹丝不动。王子绝望了，只想走得近一点，至少能和可爱的小公主说上几句话。小公主也尽力从里面伸出手，盼着他能吻一吻自己的手。
        - id: ch05-b03
          speaker: narrator
          text: 王子换了一个方向又一个方向，左转右转，始终不能把她的手送到唇边。那只长鼻子每一次都挡在中间。直到此刻，他生平第一次看清自己的鼻子到底有多长。
        - id: ch05-b04
          speaker: prince_hyacinth
          text: 好吧，我必须承认，我的鼻子确实太长了！
          emotion: surprised
        - id: ch05-b05
          speaker: narrator
          text: 话音一落，水晶牢笼立刻炸成千百块碎片。老仙女牵住可爱的小公主的手，来到王子面前。
        - id: ch05-b06
          speaker: old_fairy
          text: 现在你该承认，你很感谢我了吧？我跟你说了那么多次鼻子，根本没有用。要不是它妨碍你做想做的事，你永远不会发现它有多么异乎寻常。人太爱自己，就认不出自己身心的缺点。理智怎么提醒也没有用，直到缺点挡住了自己的利益，人们才肯看见。
        - id: ch05-b07
          speaker: narrator
          text: 就在水晶宫破碎的时候，风信子的鼻子也变得和普通人的一模一样。他没有白白经历这一切，把得到的教训牢牢记在心里。后来，他娶了可爱的小公主。从此以后，两个人一直幸福地生活在一起。
