  chapters:
    - id: ch01
      title: The Cat's Enchantment
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a king fell deeply in love with a princess. But an enchantment kept her from marrying anyone. The King went to a fairy and asked how he might win the Princess's love.
        - id: ch01-b02
          speaker: fairy
          text: The Princess has a great cat that she loves dearly. The man clever enough to step on that cat's tail is the man she is destined to marry.
        - id: ch01-b03
          speaker: narrator
          text: The King thought that sounded easy. He left the Fairy quite certain that he would succeed. If necessary, he was determined to grind the cat's tail to powder rather than fail to tread on it.
        - id: ch01-b04
          speaker: narrator
          text: Before long, he visited the Princess. As always, the cat marched ahead of her with his back arched. The King took one long step and thought the tail was under his foot. But the cat whipped around, and the King stepped on nothing but air.
        - id: ch01-b05
          speaker: narrator
          text: This went on for eight days. The King began to think that dreadful tail must be full of quicksilver, because it never stayed still for a moment.
        - id: ch01-b06
          speaker: narrator
          text: At last, he found the cat fast asleep with his tail spread out conveniently behind him. The King wasted no time. He brought his foot down hard upon it.
        - id: ch01-b07
          speaker: narrator
          text: The cat gave one terrible howl, sprang up, and instantly became a tall man. He fixed his angry eyes on the King.
        - id: ch01-b08
          speaker: enchanter
          text: You broke the enchantment, so you shall marry the Princess. But I will have my revenge. You will have a son, and he will never be happy until he discovers that his nose is too long. If you tell anyone what I have said, you will vanish at once, and no one will ever see or hear of you again.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: The King was terribly afraid of the enchanter, yet he could not help laughing at the threat.
        - id: ch01-b10
          speaker: king
          text: If my son's nose is truly that long, he will see it or feel it. At least he will unless he is blind and has no hands.
        - id: ch01-b11
          speaker: narrator
          text: By then, the enchanter had vanished. The King decided there was no use wasting any more time on the threat. He went to find the Princess, and she soon agreed to marry him.
        - id: ch01-b12
          speaker: narrator
          text: They had not been married long when the King died. The Queen had only her little son left to care for, and his name was Hyacinth. He had the loveliest blue eyes in the world and a sweet little mouth. But his nose was enormous. It covered half his face.
        - id: ch01-b13
          speaker: narrator
          text: The Queen could not be comforted when she saw that great nose. Her ladies hurried to reassure her. They said it was not really as large as it looked. It was a Roman nose, and she had only to open a history book to see that every hero had a large one. The Queen adored her baby and wanted to believe them. Their words pleased her so much that, when she looked at Hyacinth again, his nose truly did not seem quite so large after all.
    - id: ch02
      title: A Prince Who Loved Long Noses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Prince Hyacinth was raised with the greatest care. As soon as he could speak, people began telling him all sorts of dreadful stories about anyone with a short nose. The whole court was arranged around the same idea. No one was allowed near the young Prince unless that person's nose looked at least somewhat like his own.
        - id: ch02-b02
          speaker: narrator
          text: The courtiers wanted the Queen's favor, so they pulled their babies' noses several times a day, hoping to make them grow. Nothing they did could make those noses compare with the Prince's.
        - id: ch02-b03
          speaker: narrator
          text: When Hyacinth was old enough to understand his lessons, he began to study history. Whenever the story mentioned a great prince or a beautiful princess, his teachers carefully told him that the person had a long nose. Portraits of people with enormous noses covered the walls of his room. With lessons and pictures telling him the same thing every day, he grew completely certain that a long nose was a mark of great beauty. He would not have made his own one inch shorter for anything in the world.
        - id: ch02-b04
          speaker: narrator
          text: After his twentieth birthday, the Queen decided he should marry. She ordered portraits of several princesses to be shown to him. Among them was a picture of the Dear Little Princess.
        - id: ch02-b05
          speaker: narrator
          text: She was the daughter of a mighty king and would one day possess several kingdoms of her own. Prince Hyacinth did not spare a thought for any of that. He could think only of how charming and beautiful she was.
        - id: ch02-b06
          speaker: narrator
          text: She did have one tiny, saucy nose. On her face, it was as pretty as could be. This troubled the courtiers. They were so used to mocking short noses that they sometimes laughed at hers before they could stop themselves.
        - id: ch02-b07
          speaker: narrator
          text: The Prince saw nothing funny in it. He banished two courtiers who dared to speak disrespectfully about the Dear Little Princess's tiny nose. The others took warning. From then on, everyone thought carefully before saying a word in front of him.
        - id: ch02-b08
          speaker: courtier
          text: It is true that a man can be worth nothing without a long nose. A woman's beauty is another matter. I know a learned gentleman who reads Greek. He found an old manuscript saying that beautiful Cleopatra herself had a tip-tilted nose.
        - id: ch02-b09
          speaker: narrator
          text: Prince Hyacinth gave the courtier a splendid present for such welcome news. Then he sent ambassadors to ask the Dear Little Princess to marry him. Her father agreed.
        - id: ch02-b10
          speaker: narrator
          text: The Prince was so eager to see her that he traveled three leagues to meet her. He had just stepped forward to kiss her hand when the enchanter appeared like a flash of lightning. Before anyone could move, he seized the Dear Little Princess and whirled her out of sight.
        - id: ch02-b11
          speaker: narrator
          text: Prince Hyacinth was heartbroken. He swore he would never return to his kingdom until he had found her. He would not let any courtier follow him. Alone, he mounted his horse and rode sadly away, allowing the animal to choose the path.
    - id: ch03
      title: The Fairy in the Cavern
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon he reached a vast plain. He rode across it all day without seeing a single house. By nightfall, both horse and rider were terribly hungry. Then the Prince noticed a light shining from a cavern.
        - id: ch03-b02
          speaker: narrator
          text: He rode toward it and found a little old woman who looked at least a hundred years old. She put on her spectacles to study Prince Hyacinth. It took her a very long time to settle them because her nose was so short.
        - id: ch03-b03
          speaker: narrator
          text: The Prince and the old woman, who was really the Fairy, had barely looked at each other when both of them burst out laughing. At that very same moment, they cried out together.
        - id: ch03-b04
          speakers: [prince_hyacinth, fairy]
          ensemble: duo
          text: Oh, what a funny nose!
        - id: ch03-b05
          speaker: prince_hyacinth
          text: Yours is certainly funnier than mine. But madam, let us stop discussing our noses and please give me something to eat. My poor horse and I are starving.
        - id: ch03-b06
          speaker: fairy
          text: Gladly. Your nose may look ridiculous, but you are the son of my dearest friend. I loved your father like a brother. Now, he had a very handsome nose.
        - id: ch03-b07
          speaker: prince_hyacinth
          text: And what, exactly, is wrong with mine?
        - id: ch03-b08
          speaker: fairy
          text: Nothing is missing. Quite the opposite. There is much too much of it. Still, a man can be very worthy even if his nose is too long. As I was saying, your father often visited me years ago. I was very pretty then, or so he told me. I would love to tell you about our last conversation.
        - id: ch03-b09
          speaker: prince_hyacinth
          text: I will be delighted to hear it after supper. Please remember that I have eaten nothing all day.
        - id: ch03-b10
          speaker: fairy
          text: The poor boy is right. I forgot. Come in and have supper. While you eat, I can tell my story in very few words. I dislike endless tales myself. A tongue can be too long, just like a nose. When I was young, everyone admired how little I talked. They told my mother the Queen so. You see, I was once the daughter of a great king. My father—
        - id: ch03-b11
          speaker: prince_hyacinth
          text: I am sure your father was given food whenever he was hungry!
        - id: ch03-b12
          speaker: fairy
          text: Of course he was. You shall have supper at once, too. I only wanted to explain—
        - id: ch03-b13
          speaker: narrator
          text: The Prince was growing quite angry. He cried that he truly could not listen to anything until he had eaten. Then he remembered that he needed the Fairy's help, so it would be wiser to remain polite. He quickly chose a more flattering way to make his point.
        - id: ch03-b14
          speaker: prince_hyacinth
          text: Listening to you is such a pleasure that I would forget my own hunger. My horse cannot hear you, though, and he truly must be fed.
        - id: ch03-b15
          speaker: narrator
          text: The compliment delighted the Fairy. She called for her servants.
        - id: ch03-b16
          speaker: fairy
          text: You will not wait another minute. You are wonderfully agreeable, despite the enormous size of your nose.
        - id: ch03-b17
          speaker: prince_hyacinth
          text: Plague take this old lady! She never stops talking about my nose. Anyone might think mine had taken all the length that hers is missing. If I were not so hungry, I would leave this chatterbox who thinks she hardly speaks at all. What fools people are when they cannot see their own faults! She was born a princess, so flatterers have spoiled her into thinking she is a moderate talker.
        - id: ch03-b18
          speaker: narrator
          text: Meanwhile, the servants began setting supper on the table. The Prince listened to the Fairy in amusement. She asked them what seemed like a thousand questions, all for the pleasure of hearing herself talk. One maid caught his attention in particular. No matter what anyone said, she always found a way to praise her mistress's wisdom.
        - id: ch03-b19
          speaker: maid
          text: How wise you are, madam.
        - id: ch03-b20
          speaker: prince_hyacinth
          text: I am glad I came here. This proves how sensible I have been never to trust flatterers. They praise us shamelessly, then hide our faults or turn them into virtues. No flatterer will ever fool me. I know my own defects, I hope.
        - id: ch03-b21
          speaker: narrator
          text: Poor Prince Hyacinth truly believed every word of his own thoughts. He had no idea that the people who praised his nose were really laughing at him. They treated him exactly as the maid treated the Fairy. The Prince had seen the maid laugh slyly whenever she could do so without her mistress noticing. Yet he never guessed that his own flatterers did the same. He said nothing and went on with his supper.
    - id: ch04
      title: The Lesson at Supper
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Once his hunger began to ease, the Fairy asked him to move a little farther away from her.
        - id: ch04-b02
          speaker: fairy
          text: My dear Prince, would you shift a little to the side? Your nose casts such a shadow that I cannot see what is on my plate. Thank you. Now, let us speak of your father. He was only a little boy when I visited his court, but that was forty years ago. I have lived in this lonely place ever since. Tell me about life today. Do ladies still love entertainments? In my day, we went to parties, theaters, balls, and promenades every day. Goodness, what a long nose you have! I simply cannot get used to it.
        - id: ch04-b03
          speaker: prince_hyacinth
          text: Madam, please stop mentioning my nose. Its appearance makes no difference to you. I am perfectly satisfied with it and do not want it any shorter. We must accept what we are given.
          emotion: angry
        - id: ch04-b04
          speaker: fairy
          text: Now you are angry with me, poor Hyacinth. I never meant to upset you. I wanted to help. Your nose truly shocks me, but I will try not to mention it again. I will even pretend that it is ordinary. Though, to be honest, there is enough of it for three ordinary noses.
        - id: ch04-b05
          speaker: narrator
          text: By then, the Prince was no longer hungry. The Fairy's endless remarks about his nose had made him so impatient that he could bear no more. At last, he sprang onto his horse and rode hastily away from the cavern.
        - id: ch04-b06
          speaker: narrator
          text: Wherever his journey took him, the same thing happened. People stared and talked about his nose. Prince Hyacinth decided that they must all be mad. Even after hearing the same remark everywhere, he could not bring himself to admit that his nose was too long. He had spent his whole life hearing people call it handsome, and their flattery was still stronger than the evidence before him.
    - id: ch05
      title: The Palace of Crystal
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The old Fairy wanted Prince Hyacinth to be happy, and at last she found a way to help him. She shut the Dear Little Princess inside a crystal palace and placed it where the Prince was certain to find it.
        - id: ch05-b02
          speaker: narrator
          text: His joy at seeing the Princess again was beyond measure. He immediately set to work against the crystal prison and used every bit of his strength. He tried with all his might, but he could not break it.
        - id: ch05-b03
          speaker: narrator
          text: In despair, he thought he might at least come close enough to speak to her. The Dear Little Princess reached out her hand so that he could kiss it. But whichever way Prince Hyacinth turned, he could never raise her hand to his lips. His long nose was always in the way.
        - id: ch05-b04
          speaker: narrator
          text: For the first time, Prince Hyacinth understood just how long his nose truly was.
        - id: ch05-b05
          speaker: prince_hyacinth
          text: Well, I must admit it. My nose is too long!
          emotion: surprised
        - id: ch05-b06
          speaker: narrator
          text: At once, the crystal prison burst into a thousand pieces. The old Fairy took the Dear Little Princess by the hand and turned to the Prince.
        - id: ch05-b07
          speaker: fairy
          text: Now you must admit that you owe me thanks. Talking about your nose did no good at all. You would never have discovered how extraordinary it was if it had not stopped you from doing what you wanted. Self-love keeps us from seeing our own faults, whether they are in the mind or the body. Reason may try to show them to us, but we refuse to look until those faults stand in the way of something we care about.
        - id: ch05-b08
          speaker: narrator
          text: Prince Hyacinth's nose was now like anyone else's. He remembered the lesson he had learned. Then he married the Dear Little Princess, and they lived happily ever after.
