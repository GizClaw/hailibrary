  chapters:
    - id: ch01
      title: The Two Sisters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a widow had two daughters. The elder daughter looked and acted so much like her that anyone who saw the girl seemed to see the mother too. Both of them were proud and disagreeable. Living with them was almost impossible.
        - id: ch01-b02
          speaker: narrator
          text: The younger daughter was the very picture of her father. She had his courteous ways and his sweet temper, and she was one of the loveliest girls anyone had ever seen. People naturally love those who resemble them. So the widow doted on her elder daughter, while she felt a terrible dislike for the younger one. She made the poor child eat in the kitchen and kept her working all the time.
        - id: ch01-b03
          speaker: narrator
          text: Of all her chores, one was especially hard. Twice every day, the younger girl had to walk more than a mile and a half to fetch water. Then she had to carry a pitcher filled to the top all the way home.
    - id: ch02
      title: A Gift at the Fountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, while the girl stood at the fountain, a poor woman came to her and asked for a drink.
        - id: ch02-b02
          speaker: younger_daughter
          text: Oh, yes, Goody. With all my heart.
        - id: ch02-b03
          speaker: narrator
          text: The girl rinsed the pitcher at once. Then she drew fresh water from the clearest part of the fountain. She held up the pitcher the whole time the woman drank, making it as easy for her as she could.
        - id: ch02-b04
          speaker: fairy
          text: My dear, you are so pretty, so kind, and so well mannered that I must give you a gift.
        - id: ch02-b05
          speaker: narrator
          text: The poor country woman was really a fairy in disguise. She had taken that form to discover just how courteous and kind the girl would be.
        - id: ch02-b06
          speaker: fairy
          text: This is my gift to you. Whenever you speak, either a flower or a jewel will fall from your mouth.
    - id: ch03
      title: Roses, Pearls, and Diamonds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the girl finally returned home with the water, her mother was waiting. The widow scolded her for taking so long at the fountain.
        - id: ch03-b02
          speaker: younger_daughter
          text: Please forgive me, Mamma. I am sorry I did not hurry more.
        - id: ch03-b03
          speaker: narrator
          text: As she spoke, two roses, two pearls, and two diamonds fell from her mouth.
        - id: ch03-b04
          speaker: widow
          text: What am I seeing? Pearls and diamonds are coming from the girl's mouth! Child, how did this happen?
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: That was the first time the widow had ever called the younger girl her child. The poor girl answered frankly. She told her mother everything that had happened at the fountain, and as the story came out, countless diamonds fell from her mouth.
        - id: ch03-b06
          speaker: widow
          text: Then my own daughter must go there. Fanny, come and see what falls from your sister's mouth whenever she talks. Wouldn't you like to receive the same gift, my dear? All you need to do is fetch water from the fountain. When a poor woman asks for a drink, serve her very politely.
        - id: ch03-b07
          speaker: fanny
          text: What a fine sight that would be, seeing me go to fetch water!
        - id: ch03-b08
          speaker: widow
          text: You will go, you hussy, and you will go this minute!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: Fanny set off, grumbling the whole way. She took the finest silver tankard in the house with her.
    - id: ch04
      title: Snakes and Toads
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As soon as Fanny reached the fountain, a splendidly dressed lady came out of the wood and asked her for a drink. This was the same fairy who had met her sister. Now the fairy looked like a princess, for she wished to see just how rude this girl could be.
        - id: ch04-b02
          speaker: fanny
          text: Do you think I came all this way just to serve you water? I suppose this silver tankard was brought especially for your ladyship! Well, drink from it if you really want to.
        - id: ch04-b03
          speaker: fairy
          text: You are certainly not very polite. Since you have such bad manners and treat others so poorly, here is my gift. Each time you speak, either a snake or a toad will fall from your mouth.
        - id: ch04-b04
          speaker: narrator
          text: The fairy said this without losing her temper. Then Fanny went home.
        - id: ch04-b05
          speaker: narrator
          text: The moment the widow saw Fanny coming home, she called out to her.
        - id: ch04-b06
          speaker: widow
          text: Well, daughter?
        - id: ch04-b07
          speaker: fanny
          text: Well, mother?
        - id: ch04-b08
          speaker: narrator
          text: With those words, Fanny sent two vipers and two toads tumbling from her mouth.
        - id: ch04-b09
          speaker: widow
          text: Mercy! What am I looking at? Her wretched sister caused this, and she will pay for it!
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: The widow ran at once to beat her younger daughter. The poor girl fled and hid in the forest nearby.
    - id: ch05
      title: The King's Son
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The King's son was returning from a hunt when he met her there. He saw how beautiful she was and asked why she sat alone in the forest, crying.
        - id: ch05-b02
          speaker: younger_daughter
          text: Alas, sir! My mamma has driven me out of our home.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: As the girl answered, five or six pearls and just as many diamonds fell from her mouth. The King's son saw them. Astonished by such a sight, he asked her how it had happened. So she told him the whole story, from the fountain to her flight into the forest.
        - id: ch05-b04
          speaker: narrator
          text: The King's son fell in love with her. He thought such a gift was worth more than any marriage portion. He led her to the palace of his father, the King, and there he married her.
        - id: ch05-b05
          speaker: narrator
          text: As for Fanny, she made herself so hated that even her own mother turned her away. The miserable girl wandered for a long time, but no one would take her in.
        - id: ch05-b06
          speaker: narrator
          text: At last, she went to a corner of the wood, and there she died.
