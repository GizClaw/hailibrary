audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    younger_daughter:
      display_name: 小女儿
      tts: {delivery: 温柔真诚，谦逊有礼, timbre: 柔和清亮, pace: 中等偏慢, pitch: 中高音}
    mother:
      display_name: 母亲
      tts: {delivery: 势利刻薄，急躁强硬, timbre: 成熟尖利, pace: 稍快, pitch: 中音}
    fairy:
      display_name: 仙女
      tts: {delivery: 从容端庄，洞察人心, timbre: 清澈温润, pace: 舒缓, pitch: 中音}
    fanny:
      display_name: 芬妮
      tts: {delivery: 骄傲任性，言语无礼, timbre: 明亮偏尖, pace: 稍快, pitch: 中高音}
    prince:
      display_name: 王子
      tts: {delivery: 真诚端正，彬彬有礼, timbre: 年轻清朗, pace: 中等, pitch: 中低音}
  chapters:
    - id: ch01
      title: 泉边的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个寡妇，养着两个女儿。大女儿从长相到脾气都像母亲，见到女儿，就如同见到母亲。母女俩一样骄傲，一样讨人嫌，谁也受不了她们。
        - id: ch01-b02
          speaker: narrator
          text: 小女儿却处处像父亲，待人亲切，性情温柔，还是个少见的美人。人总是喜欢同自己相像的人，这位母亲也一样。她把大女儿宠得不得了，却厌恶小女儿，逼她在厨房里吃饭，还叫她一天到晚不停地干活。
        - id: ch01-b03
          speaker: narrator
          text: 小女儿每天要做的苦差事可不少。其中一件，是早晚两次走到一英里半外的泉边打水，再把满满一罐水提回家。一天，她正在泉边忙着，一位穷苦的妇人走了过来，求她给自己一点水喝。
        - id: ch01-b04
          speaker: younger_daughter
          text: 好呀，婆婆，我很乐意。
        - id: ch01-b05
          speaker: narrator
          text: 小姑娘马上把水罐涮得干干净净，又从泉水最清澈的地方汲了一罐。她用双手稳稳托住水罐，一直举在那里，好让妇人喝得轻松些。
        - id: ch01-b06
          speaker: fairy
          text: 好姑娘，你这么美，心地又好，还这样懂礼貌，我一定要送你一件礼物。
        - id: ch01-b07
          speaker: narrator
          text: 原来，她是一位仙女，故意变成贫苦的乡下妇人，想看看小姑娘究竟有多善良、多懂礼貌。
        - id: ch01-b08
          speaker: fairy
          text: 从今以后，你每说一句话，嘴里就会落下一朵鲜花，或是一颗宝石。
    - id: ch02
      title: 鲜花与宝石
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小姑娘回家以后，母亲责骂她在泉边耽搁了太久。
        - id: ch02-b02
          speaker: younger_daughter
          text: 妈妈，请原谅我，我回来晚了。
        - id: ch02-b03
          speaker: narrator
          text: 她刚说完，嘴里就落出两朵玫瑰、两颗珍珠和两颗钻石。母亲看得目瞪口呆。
        - id: ch02-b04
          speaker: mother
          text: 这是怎么回事？她嘴里怎么会掉出珍珠和钻石？孩子，快告诉我！
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: 这还是母亲有生以来头一回叫小女儿“孩子”。姑娘一点也没有隐瞒，把泉边发生的事情从头到尾说了出来。她每说几句话，就有钻石从嘴里落下，最后多得数也数不清。
        - id: ch02-b06
          speaker: mother
          text: 这地方一定得让我的女儿也去！芬妮，快来看，你妹妹一说话，嘴里就掉出什么。亲爱的，你也想要这样的礼物吧？你只要到泉边打水。等那个穷妇人来讨水，你客客气气地给她喝。
        - id: ch02-b07
          speaker: fanny
          text: 要我去打水？让别人瞧见了，可真体面呀！
        - id: ch02-b08
          speaker: mother
          text: 你这个懒丫头，非去不可！现在就走！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 芬妮只好带上家里最好的银杯出门。她一路走，一路抱怨，气冲冲地来到泉边。
    - id: ch03
      title: 蛇与蟾蜍
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 芬妮才到泉边，就看见一位衣着极其华贵的夫人从树林里走来。那位夫人来到她面前，也向她讨水喝。其实，这还是先前见过妹妹的那位仙女。她这回有意打扮成公主，是想看看芬妮究竟能无礼到什么地步。
        - id: ch03-b02
          speaker: fanny
          text: 怎么，我特地跑到这里，就是为了伺候您喝水吗？这个银杯，想必也是专门给夫人您带的吧？您实在想喝，就拿去喝好了。
        - id: ch03-b03
          speaker: fairy
          text: 你实在不懂礼貌。不过，我不会为此生气。既然你这样没有教养，也不肯好好待人，我就送你一件礼物。从今以后，你每说一句话，嘴里都会掉出一条蛇，或是一只蟾蜍。
        - id: ch03-b04
          speaker: narrator
          text: 芬妮回到家，母亲一见她就急忙问了起来。
        - id: ch03-b05
          speaker: mother
          text: 怎么样，女儿？
        - id: ch03-b06
          speaker: fanny
          text: 还能怎么样，母亲？
        - id: ch03-b07
          speaker: narrator
          text: 芬妮一开口，两条毒蛇和两只蟾蜍就从嘴里掉了出来。
        - id: ch03-b08
          speaker: mother
          text: 天哪，这是什么？准是她那个该死的妹妹害的！我绝不饶她！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: 母亲立刻冲去打小女儿。可怜的姑娘逃出家门，躲进了附近的森林。
    - id: ch04
      title: 森林里的相遇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，国王的儿子打猎归来，恰巧在林中遇见了她。王子见姑娘长得这样美，却独自躲在这里哭泣，便走上前，问她为什么一个人在森林里，又为什么这样伤心。
        - id: ch04-b02
          speaker: younger_daughter
          text: 唉，殿下，妈妈把我赶出了家门。
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 话音落下，五六颗珍珠和同样多的钻石从姑娘嘴里掉出来。王子十分惊奇，请她说说缘由。姑娘便把整件事都告诉了他。
        - id: ch04-b04
          speaker: narrator
          text: 听完姑娘的全部经历，王子爱上了她。他仔细想了想，觉得这份奇妙的礼物比任何嫁妆都更加珍贵，便带着姑娘回到父王的宫殿，在那里同她结了婚。
        - id: ch04-b05
          speaker: narrator
          text: 至于芬妮，她变得人人厌恶，最后连亲生母亲也把她赶出了家门。她流浪了很久，没有一个人肯收留她。后来，她走到森林的一处角落，就死在那里。
