  chapters:
    - id: ch01
      title: Cinderella and Her Sisters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a gentleman who married for a second time. His new wife was the proudest, haughtiest woman anyone had ever seen. She had two daughters from her first marriage, and they were just like her. The gentleman also had a young daughter. She had inherited her own mother's extraordinary goodness and sweet temper, for her mother had been the best creature in the world.
        - id: ch01-b02
          speaker: narrator
          text: As soon as the wedding was over, the stepmother showed her true nature. She could not bear the girl's goodness, especially because it made her own daughters seem more unpleasant. She gave the girl the lowest work in the house. She washed the dishes and tables, scrubbed her stepmother's room, and cleaned both sisters' rooms too.
        - id: ch01-b03
          speaker: narrator
          text: At night, the girl climbed to a miserable attic and slept on a wretched bed of straw. Her sisters rested in fine rooms with beautifully inlaid floors. Their beds were made in the newest fashion, and their mirrors were so tall that they could admire themselves from head to foot.
        - id: ch01-b04
          speaker: narrator
          text: The poor girl bore everything patiently. She did not dare complain to her father, because his wife ruled him completely and he would only have scolded her. When her work was done, she sat in the chimney corner among the cinders and ashes. So everyone called her Cinderwench. The younger sister, who was a little less rude than the elder, called her Cinderella.
        - id: ch01-b05
          speaker: narrator
          text: Yet even in her shabby clothes, Cinderella was a hundred times more beautiful than her richly dressed sisters.
        - id: ch01-b06
          speaker: narrator
          text: One day, the King's son announced a ball and invited everyone of fashion. The two sisters were invited because they made a grand show among important people. They were delighted. At once they began choosing the gowns, petticoats, and headpieces that would suit them best. From that moment, they could think of almost nothing else.
        - id: ch01-b07
          speaker: narrator
          text: That meant more work for Cinderella. She ironed their linen and pleated their ruffles while they talked all day about what they would wear.
        - id: ch01-b08
          speaker: eldest_sister
          text: I shall wear my red velvet dress with the French trimming.
        - id: ch01-b09
          speaker: charlotte
          text: I will wear my usual petticoat. But I shall make up for that with my gold-flowered gown and my diamond stomacher. It is certainly no ordinary jewel.
        - id: ch01-b10
          speaker: narrator
          text: They sent for the best hairdresser they could find to arrange their hair and set their double lace caps just right. They would trust no ordinary shop for the rest. Their red brushes and fashionable beauty patches came from Mademoiselle de la Poche herself.
        - id: ch01-b11
          speaker: narrator
          text: They asked Cinderella's advice because she had excellent taste. She always chose what suited them best, and she even offered to dress their hair. They gladly let her do it.
        - id: ch01-b12
          speaker: eldest_sister
          text: Cinderella, wouldn't you like to go to the ball?
        - id: ch01-b13
          speaker: cinderella
          text: Oh, you are only making fun of me. A girl like me could never go there.
          emotion: sad
        - id: ch01-b14
          speakers: [eldest_sister, charlotte]
          ensemble: duo
          text: Quite right. Everyone would laugh if a Cinderwench came to a ball.
        - id: ch01-b15
          speaker: narrator
          text: Someone else in Cinderella's place might have twisted their hair crooked out of spite. Cinderella was too good for that, and she arranged every curl perfectly. The sisters were so carried away with excitement that they hardly ate for nearly two days. They broke more than a dozen laces by pulling them tight, trying to make their waists look slender. Between fittings, they kept hurrying back to their mirrors.
        - id: ch01-b16
          speaker: narrator
          text: At last the happy day arrived. The sisters left for Court. Cinderella watched until they disappeared from sight. Then she began to cry.
    - id: ch02
      title: The Fairy Godmother
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Cinderella's godmother saw her in tears and asked what was wrong.
        - id: ch02-b02
          speaker: cinderella
          text: I wish I could... I wish I could...
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: Her sobs would not let her finish. But her godmother was a fairy, and she understood.
        - id: ch02-b04
          speaker: fairy_godmother
          text: You wish you could go to the ball. Is that it?
        - id: ch02-b05
          speaker: cinderella
          text: Y-yes.
          emotion: sad
        - id: ch02-b06
          speaker: fairy_godmother
          text: Then be a good girl, and I will see that you go. Run into the garden and bring me a pumpkin.
        - id: ch02-b07
          speaker: narrator
          text: Cinderella hurried into the garden and chose the finest pumpkin she could find. She carried it back without the least idea how a pumpkin could possibly help her reach the ball. Her godmother cut it open and carefully scooped out all the flesh and seeds, leaving only the hollow rind. Then she struck it with her wand. In an instant, the plain pumpkin became a splendid coach, gilded all over with gold.
        - id: ch02-b08
          speaker: narrator
          text: Next the fairy looked in the mousetrap and found six live mice. Cinderella lifted the little door. As each mouse ran out, the fairy tapped it with her wand. Each one became a fine horse, until six beautiful dapple-gray horses stood ready.
        - id: ch02-b09
          speaker: narrator
          text: The fairy still needed a coachman.
        - id: ch02-b10
          speaker: cinderella
          text: I will check the rat trap. If there is a rat inside, perhaps we can turn him into the coachman.
        - id: ch02-b11
          speaker: fairy_godmother
          text: A good thought. Go and see.
        - id: ch02-b12
          speaker: narrator
          text: Cinderella returned with the rat trap, and three enormous rats were crouched inside it. The fairy studied them and chose the one whose beard was largest. At the touch of her wand, he became a plump, cheerful coachman. His whiskers were finer and smarter than any whiskers ever seen.
        - id: ch02-b13
          speaker: fairy_godmother
          text: Go back to the garden. Behind the watering pot you will find six lizards. Bring them here.
        - id: ch02-b14
          speaker: narrator
          text: Cinderella found all six lizards behind the watering pot and carried them back. The fairy touched them one after another, changing them into six footmen. Their uniforms glittered with gold and silver. They sprang onto the back of the coach and clung there as neatly as if they had done nothing else all their lives.
        - id: ch02-b15
          speaker: fairy_godmother
          text: There. You have a carriage fit for any ball. Are you pleased?
        - id: ch02-b16
          speaker: cinderella
          text: Oh, yes! But must I go in these filthy rags?
        - id: ch02-b17
          speaker: narrator
          text: Her godmother touched her with the wand. At once, Cinderella's rags became cloth of gold and silver covered with jewels. Then the fairy gave her the prettiest pair of glass slippers in the whole world.
        - id: ch02-b18
          speaker: narrator
          text: Cinderella climbed into the coach, but first her godmother gave her a strict warning.
        - id: ch02-b19
          speaker: fairy_godmother
          text: Above all, leave the ball before midnight. If you stay one moment longer, the coach will become a pumpkin again. The horses will be mice, the coachman a rat, and the footmen lizards. Your beautiful clothes will turn back into rags.
        - id: ch02-b20
          speaker: cinderella
          text: I promise. I will leave before midnight.
        - id: ch02-b21
          speaker: narrator
          text: Then the coach swept away, and Cinderella could hardly contain her joy.
    - id: ch03
      title: The Unknown Princess
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Word reached the King's son that a great princess had arrived, though no one knew who she was. He ran out to receive her himself. When the golden coach stopped, he offered his hand as she stepped down, then led her through the waiting company and into the ballroom.
        - id: ch03-b02
          speaker: narrator
          text: At once, the room fell silent. Everyone stopped dancing, and even the violins stopped playing. Every eye was fixed on the beautiful stranger. Then whispers rose all around her.
        - id: ch03-b03
          speakers: [guest_1, guest_2]
          ensemble: duo
          text: Oh, how beautiful she is!
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: Even the old King could not take his eyes from her.
        - id: ch03-b05
          speaker: king
          text: It has been many years since I saw anyone so beautiful and lovely.
        - id: ch03-b06
          speaker: narrator
          text: All the ladies studied Cinderella's clothes and headdress from every side. Each one planned to have something made in exactly the same style the very next day. That would only be possible, of course, if they could find material so fine and a dressmaker skillful enough to work with it.
        - id: ch03-b07
          speaker: narrator
          text: The Prince led Cinderella to the most honorable seat in the room. Soon he asked her to dance. She moved with such grace that the whole company admired her more with every step. Later, a splendid supper was served. The Prince never tasted a morsel. He was far too busy gazing at Cinderella.
        - id: ch03-b08
          speaker: narrator
          text: Cinderella went over and sat beside her sisters. She spoke to them with the greatest kindness and gave them some of the oranges and citrons the Prince had presented to her. Such attention from the mysterious princess amazed them. They had no idea that the lovely stranger beside them was Cinderella.
        - id: ch03-b09
          speaker: narrator
          text: While she was talking with them, Cinderella heard the clock strike a quarter to twelve. She rose at once, bowed to the company, and hurried home as fast as she could.
        - id: ch03-b10
          speaker: narrator
          text: As soon as Cinderella reached home, she ran to find her godmother and thanked her. Then she said how dearly she wished to attend the ball again the next evening, for the Prince himself had asked her to return. She was eagerly describing everything that had happened when her two sisters knocked at the door. Cinderella hurried to open it.
        - id: ch03-b11
          speaker: cinderella
          text: How late you stayed!
        - id: ch03-b12
          speaker: narrator
          text: She yawned, rubbed her eyes, and stretched as if she had just awakened, though she had not felt sleepy for a moment while they were gone.
        - id: ch03-b13
          speaker: eldest_sister
          text: If you had been at the ball, you would not call it late. The most beautiful princess anyone has ever seen came tonight. She was wonderfully kind to us and even gave us oranges and citrons.
        - id: ch03-b14
          speaker: narrator
          text: Cinderella pretended not to care. She asked the princess's name. Her sisters said no one knew it, and the Prince was so troubled by her disappearance that he would give anything to learn who she was.
        - id: ch03-b15
          speaker: cinderella
          text: Then she must be very beautiful indeed. How lucky you were! Dear Miss Charlotte, lend me the yellow dress you wear every day. Then perhaps I could see her too.
        - id: ch03-b16
          speaker: charlotte
          text: Of course not! Lend my clothes to a dirty Cinderwench like you? I would have to be a fool.
          emotion: disgusted
        - id: ch03-b17
          speaker: narrator
          text: Cinderella had expected exactly that answer, and secretly she was glad to hear it. She had asked for the yellow dress only as a joke. If Charlotte had unexpectedly agreed to lend it, Cinderella would have been in real difficulty, because she had no intention of wearing it to the ball.
    - id: ch04
      title: The Lost Glass Slipper
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next evening, both sisters went to the ball again. Cinderella went too, dressed even more magnificently than before.
        - id: ch04-b02
          speaker: narrator
          text: The Prince stayed beside her all evening. He never stopped offering compliments and speaking kindly to her, and Cinderella did not find his attention tiresome at all. She enjoyed it so much that the warning from her godmother slipped from her mind. When the clock began to strike twelve, Cinderella thought it could only be eleven.
        - id: ch04-b03
          speaker: narrator
          text: Then she understood. She sprang up and fled as swiftly as a deer. The Prince chased her but could not catch her. One glass slipper fell from her foot, and he picked it up with the greatest care.
        - id: ch04-b04
          speaker: narrator
          text: Cinderella reached home quite out of breath. The golden coach and its servants were gone. Her splendid clothes had become the same old rags she had worn before, and every jewel had vanished. Of all her finery, only one little glass slipper remained, the mate of the one she had dropped.
        - id: ch04-b05
          speaker: narrator
          text: At the palace, the guards were asked whether they had seen a princess leave. They had seen no princess at all. Only a poorly dressed young girl had passed through the gate, looking more like a country servant than a lady.
        - id: ch04-b06
          speaker: narrator
          text: When the sisters came home, Cinderella asked whether they had enjoyed themselves and whether the beautiful stranger had returned.
        - id: ch04-b07
          speaker: eldest_sister
          text: Yes, she came. But the moment the clock struck twelve, she rushed away so quickly that she dropped a little glass slipper. It was the prettiest slipper in the world, and the Prince picked it up.
        - id: ch04-b08
          speaker: charlotte
          text: He did nothing but watch her all evening. He must be deeply in love with whoever owns that slipper.
        - id: ch04-b09
          speaker: narrator
          text: And that was true. A few days later, trumpets sounded through the kingdom. The Prince proclaimed that he would marry the woman whose foot fitted the glass slipper exactly.
        - id: ch04-b10
          speaker: narrator
          text: The men appointed by the Prince carried the slipper throughout the land. They tried it first on princesses, then on duchesses, and then on every lady at Court. It fit none of them. At last, they brought it to Cinderella's house. Both sisters pushed, squeezed, and did everything they could to force their feet inside, but neither one succeeded.
        - id: ch04-b11
          speaker: cinderella
          text: Let me try. Perhaps it will fit me.
        - id: ch04-b12
          speaker: narrator
          text: Her sisters burst out laughing and mocked her. But the royal officer looked closely at Cinderella and saw how beautiful she was.
        - id: ch04-b13
          speaker: royal_officer
          text: It is only fair that she should try. My orders say that every woman may do so.
        - id: ch04-b14
          speaker: narrator
          text: The officer made Cinderella sit down and knelt to place the slipper against her foot. It slid on with perfect ease and fit as closely as if it had been made of wax. Her two sisters stared in astonishment. Then Cinderella reached into her pocket, drew out the other glass slipper, and placed it on her other foot. Their amazement grew greater still.
        - id: ch04-b15
          speaker: narrator
          text: At that moment, her godmother entered. One touch of the wand changed Cinderella's clothes into robes richer and more magnificent than any she had worn before.
    - id: ch05
      title: Cinderella's Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Now the sisters knew that Cinderella was the beautiful lady from the ball. They threw themselves at her feet and begged forgiveness for all the cruel treatment she had endured.
        - id: ch05-b02
          speaker: narrator
          text: Cinderella raised them up and embraced them.
        - id: ch05-b03
          speaker: cinderella
          text: I forgive you with all my heart. From now on, I ask only that you always love me.
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: Still dressed in her magnificent clothes, Cinderella was taken to the Prince. He found her more charming than ever. A few days later, they were married.
        - id: ch05-b05
          speaker: narrator
          text: Cinderella was as good as she was beautiful. She gave her two sisters rooms in the palace, and that very same day she arranged marriages for them with two great lords of the Court.
