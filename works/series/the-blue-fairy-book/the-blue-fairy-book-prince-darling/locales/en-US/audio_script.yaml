  chapters:
    - id: ch01
      title: The Good King's Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a king so just and kind that his people called him the Good King. One day, while he was hunting, his dogs chased a little white rabbit. It sprang straight into his arms for shelter. The King stroked it gently.
        - id: ch01-b02
          speaker: king
          text: Well, little rabbit, you came to me for protection. I will not let anyone hurt you.
        - id: ch01-b03
          speaker: narrator
          text: He carried the rabbit home to his palace. There he gave it a pretty little house and plenty of good things to eat.
        - id: ch01-b04
          speaker: narrator
          text: That night, the King was alone in his room when a beautiful lady suddenly appeared. Her long dress was white as snow, and white roses crowned her head. The King stared in surprise. His door was tightly shut, so how had she entered?
        - id: ch01-b05
          speaker: fairy_truth
          text: I am the Fairy Truth. I was passing through the woods while you hunted. Everyone said you were good, and I wanted to discover whether it was true. So I took the shape of that little rabbit and ran to your arms for shelter. I know that anyone who shows mercy to animals will be kinder still to other people. If you had refused to help me, I would have known you were wicked. Instead, you protected me and treated me kindly. That kindness has made me your friend forever. Ask for anything you desire, and I promise to grant it.
        - id: ch01-b06
          speaker: king
          text: Madam, since you are a fairy, you must already know my dearest wish. I have one son, Prince Darling, whom I love with all my heart. If you truly wish to help me, please become his friend.
        - id: ch01-b07
          speaker: fairy_truth
          text: Gladly. I can make your son the handsomest prince alive, the richest, or the most powerful. Which gift do you choose?
        - id: ch01-b08
          speaker: king
          text: I want none of those. If you can help him become the best of princes, I will be deeply grateful. Riches, beauty, and every kingdom in the world could never make him happy if he were wicked. Only a good man can be truly content.
        - id: ch01-b09
          speaker: fairy_truth
          text: You are right. But I cannot make him good unless he helps me. He must work hard at goodness himself. I can advise him, scold him when he fails, and punish him if he refuses to correct his own faults.
        - id: ch01-b10
          speaker: narrator
          text: That promise satisfied the Good King. Not long afterward, he died. Prince Darling grieved with all his heart. He would have given every kingdom he ruled and every piece of gold and silver he owned if only his father could have stayed with him.
        - id: ch01-b11
          speaker: narrator
          text: Two days later, after the Prince had gone to bed, the Fairy suddenly appeared beside him. She reminded him of the promise she had made to his father and said she had brought him a present. Then she placed a little gold ring on his finger.
        - id: ch01-b12
          speaker: fairy_truth
          text: I promised your father that I would be your friend, and I have come to keep my word. Guard this ring carefully. It is worth more than diamonds. Whenever you do wrong, it will prick your finger. If you ignore the warning and continue along an evil path, you will lose my friendship, and I will become your enemy.
        - id: ch01-b13
          speaker: narrator
          text: Then she vanished, leaving Prince Darling amazed. For a while, he behaved so well that the ring never pricked him. He was so content that his subjects called him Prince Darling the Happy.
    - id: ch02
      title: The Ring's Warning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the Prince went hunting and found no game. He rode home in a foul temper. The ring pressed against his finger, but it did not prick, so he paid no attention. In his room, his little dog Bibi bounded around him, delighted to see him.
        - id: ch02-b02
          speaker: prince_darling
          text: Go away! I do not want you under my feet.
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: Poor Bibi did not understand. She tugged at his coat, hoping he would at least look at her. That made him so cross that he kicked her hard. At once, the ring stabbed his finger like a pin. Startled and ashamed, he sat down in a corner.
        - id: ch02-b04
          speaker: prince_darling
          text: The Fairy must be laughing at me. Surely kicking one tiresome animal is no terrible crime. What is the use of ruling a great kingdom if I cannot even strike my own dog?
        - id: ch02-b05
          speaker: fairy_truth
          text: I am not laughing at you. You have done three wrong things. First, you lost your temper because you did not get what you wanted, as if every person and animal existed only to please you. Then you gave yourself up to anger. Last, you were cruel to a helpless creature that had done nothing to deserve it.
        - id: ch02-b06
          speaker: fairy_truth
          text: You may stand far above a little dog, but that gives you no right to hurt it. If the greater may mistreat the smaller, then I could beat or kill you, because a fairy is greater than a man. A mighty kingdom is not a chance to do every evil you desire. It is a chance to do all the good you can.
        - id: ch02-b07
          speaker: narrator
          text: The Prince understood how badly he had behaved and promised to do better in the future, but he did not keep that promise. A foolish nurse had spoiled him when he was small. Whenever he wanted something, he only had to cry, fret, and stamp his feet. She would give in and hand him whatever he demanded, teaching him to follow his own will. From morning until night, she also told him that he would be a king one day. Kings, she said, were the happiest men alive. Everyone had to respect and obey them, and no one could prevent them from doing exactly as they pleased.
        - id: ch02-b08
          speaker: narrator
          text: When he grew old enough to understand, Prince Darling learned that few things were worse than pride, stubbornness, and conceit. He truly tried to cure himself of those faults. But by then, they had hardened into habits, and a bad habit is very hard to break. He was not wicked by nature. Each time he lost the struggle and behaved badly, he was honestly sorry afterward.
        - id: ch02-b09
          speaker: prince_darling
          text: Every day I must fight my anger and pride. If someone had corrected me when I was small, they would not torment me so much now.
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: The ring pricked him often. Sometimes its warning made him stop at once. At other times, he refused to listen. Strangely, a small fault brought only a light prick, but a truly wicked deed made his finger bleed. At last, he grew tired of being reminded whenever he did wrong. He wanted to act exactly as he pleased, so he threw the ring aside. Free of its troublesome pricks, he thought himself the happiest man alive. Now nothing checked him. He followed every foolish impulse that came into his mind until he became thoroughly wicked, and no one could love him any longer.
        - id: ch02-b11
          speaker: narrator
          text: Then he saw a young shepherdess named Celia. She was as good as she was beautiful, and he decided at once that he would marry her. He expected her to be overjoyed at the thought of becoming a great queen. Instead, she faced him without fear.
        - id: ch02-b12
          speaker: celia
          text: Sire, I may be a poor shepherdess, but I will not marry you.
        - id: ch02-b13
          speaker: prince_darling
          text: Do you dislike me?
        - id: ch02-b14
          speaker: celia
          text: No, my Prince. You are very handsome. But what use would I have for riches, splendid gowns, or grand carriages? If I watched you do evil every day, I would come to hate and despise you.
        - id: ch02-b15
          speaker: narrator
          text: Her fearless answer enraged him. He ordered his officers to seize Celia, make her a prisoner, and carry her to the palace. Yet her words stayed in his mind all day and would not leave him in peace. He was angry with her, but he also loved her, and he could not bring himself to order her punishment.
        - id: ch02-b16
          speaker: narrator
          text: The Prince trusted his foster-brother more than anyone. But this favorite companion was not a good man. He constantly gave Prince Darling bad advice and encouraged him along every evil path. When he saw the Prince looking miserable, he asked what was troubling him. Prince Darling explained that he could not bear Celia's poor opinion. He said he had resolved to become a better man so that he might please her.
        - id: ch02-b17
          speaker: foster_brother
          text: You are far too kind to worry over one little girl. If I were you, I would soon make her obey. You are a king. Imagine trying to please a shepherdess who should be grateful to serve you. Lock her away with only bread and water. If she still refuses you, have her put to death. Then everyone will know that you expect obedience. If you cannot command a girl like her, your subjects may forget that they exist for our pleasure.
        - id: ch02-b18
          speaker: prince_darling
          text: But Celia is innocent. Would it not be shameful to have her killed when she has done nothing that deserves punishment?
        - id: ch02-b19
          speaker: foster_brother
          text: Anyone who defies your command should suffer. Even if people called it unjust, that would be better than letting them believe they can insult and oppose you whenever they please.
        - id: ch02-b20
          speaker: narrator
          text: Those words struck the Prince where he was weakest. More than anything, he feared losing even a part of his power. The warning that his subjects might defy him swept away his better purpose. At once, he gave up the thought of becoming good for Celia's sake and decided instead to frighten the shepherdess until she agreed to marry him.
        - id: ch02-b21
          speaker: narrator
          text: To hold him to that decision, his foster-brother invited three equally wicked young courtiers to supper. They urged the Prince to drink heavily and claimed that Celia had mocked his love. At last, furious with wine and anger, he rushed toward her prison. If she refused him again, he declared, she would be sold as a slave the next day.
    - id: ch03
      title: The Monster in the Cage
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Prince Darling reached the locked room, Celia was gone. He had carried the key himself, so her escape astonished him. He flew into a terrible rage and swore revenge on whoever had helped her.
        - id: ch03-b02
          speaker: narrator
          text: His wicked friends decided to turn that anger against Suliman, the old nobleman who had once been his tutor. Suliman loved the Prince like a son and still dared to point out his faults. At first, the Prince had thanked him. Later, surrounded by praise and flattery, he decided the old man merely enjoyed finding fault. He sent Suliman away from court, though he still called him worthy and spoke of respecting him.
        - id: ch03-b03
          speaker: narrator
          text: The courtiers feared that Prince Darling might someday change his mind and recall Suliman. Celia's escape gave them the chance they wanted to banish the old tutor forever. They reported that Suliman had boasted of helping her get away. To make the lie seem true, they bribed three men to claim that Suliman himself had told them about it. The furious Prince believed the false witnesses. He sent his foster-brother with a band of soldiers and ordered them to bring his old tutor before him in chains, like a common criminal.
        - id: ch03-b04
          speaker: narrator
          text: The Prince had barely returned to his room when thunder cracked and the ground shook. The Fairy Truth stood before him, stern and terrible.
        - id: ch03-b05
          speaker: fairy_truth
          text: I promised your father to advise you and to punish you if you refused my counsel. You despised every warning. You followed evil until only your outward shape remained human. Inside, you became a monster that horrifies all who know you. Now your punishment must begin.
        - id: ch03-b06
          speaker: fairy_truth
          text: You raged like a lion and grasped like a wolf. Like a snake, you turned ungratefully against a man who was a second father to you. Your brutish temper made you like a bull. Since you chose the ways of those animals, you shall wear their shapes.
        - id: ch03-b07
          speaker: narrator
          text: As she finished, the change came over him. Prince Darling had a lion's head, a bull's horns, a wolf's feet, and a snake's body. In the same instant, he found himself beside a clear lake in a vast forest. The water showed him the horrible creature he had become.
        - id: ch03-b08
          speaker: fairy_truth
          text: Look carefully at what your wickedness has made of you. Your soul is a thousand times uglier than your body.
        - id: ch03-b09
          speaker: narrator
          text: He knew the Fairy's voice and turned furiously, hoping to catch and devour her. But no one was there.
        - id: ch03-b10
          speaker: fairy_truth
          text: Your helpless anger amuses me. I will punish your pride by letting your own subjects capture you.
        - id: ch03-b11
          speaker: narrator
          text: The Prince decided that the best thing he could do was put as much distance as possible between himself and the lake. At least then he would not have to keep seeing his dreadful ugliness in the water. He ran toward the woods, but before he had gone many yards, he plunged into a deep pit dug to trap bears. Hunters had been waiting out of sight in a tree. They leaped down, secured the strange beast with several chains, and led him toward the chief city of his own kingdom.
        - id: ch03-b12
          speaker: narrator
          text: All along the road, he refused to see that his own faults had brought this punishment upon him. He blamed the Fairy for every misfortune and bit and tore furiously at his chains. As they neared the city, he saw signs of a great celebration. The streets rang with rejoicing, though he could not imagine the cause, and the hunters asked what had happened.
        - id: ch03-b13
          speaker: townsman
          text: The Prince, who delighted in tormenting us, was found dead in his room after a thunderbolt struck. Four wicked courtiers tried to seize the kingdom and divide it among themselves. We knew their advice had corrupted him, so they were put to death. We freed Suliman from prison and offered him the crown. He has just been crowned, and now a good and just man will give us peace and prosperity again.
        - id: ch03-b14
          speaker: narrator
          text: Prince Darling roared with anger when he heard that Suliman wore his crown. Still worse awaited him in the great square before his own palace. There sat his former tutor upon a magnificent throne. The people crowded close around Suliman and wished him a long life, so that he might undo all the misery and harm caused by the ruler who came before him.
        - id: ch03-b15
          speaker: narrator
          text: Suliman raised a hand, and the people fell silent.
        - id: ch03-b16
          speaker: suliman
          text: I accepted your crown only to keep it safe for Prince Darling. He is not dead. The Fairy has told me there is still hope that you may see him again, as good and virtuous as he was when he first took the throne. Flatterers led him astray. I knew his heart, and without their influence, I believe he would have been a good king and a father to his people. Hate his faults, but pity him and hope that he returns. I would gladly die if my death could bring him back to rule with justice and honor.
          emotion: sad
        - id: ch03-b17
          speaker: narrator
          text: Suliman's words went straight to Prince Darling's heart. The man he had accused and sent for in chains still loved him with perfect faithfulness. For the first time, the Prince reproached himself for all his evil deeds. He felt his anger melting away. One by one, he remembered the choices he had made and admitted that his punishment was no worse than he deserved. He stopped biting his chains and tearing at the iron bars of his cage. From that moment, the terrible monster became as gentle as a lamb.
    - id: ch04
      title: Good Returned for Evil
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The hunters took him to a great menagerie and chained him among the wild beasts. He resolved to show his sorrow by obeying the man who cared for him and behaving gently. But the keeper was rough and cruel. Even when the monster sat quietly, the man often beat him simply because he was in a bad temper.
        - id: ch04-b02
          speaker: narrator
          text: One day, while the keeper slept, a tiger broke its chain and sprang at him. At first, Prince Darling felt pleased. His tormentor would be gone. Then better thoughts rose in him, and he longed to be free.
        - id: ch04-b03
          speaker: prince_darling
          text: I would repay evil with good. I would save that unhappy man's life.
        - id: ch04-b04
          speaker: narrator
          text: The moment he formed that wish, his iron cage flew open. He rushed toward the keeper, who was awake now and struggling to defend himself against the tiger. When the man saw the many-shaped monster coming too, he gave himself up for lost. His terror soon turned to joy. Prince Darling threw himself upon the tiger, fought it, and quickly killed it. Then, without harming the keeper, he went quietly to crouch at the feet of the man he had saved.
        - id: ch04-b05
          speaker: narrator
          text: Filled with gratitude, the keeper bent to stroke the strange creature.
        - id: ch04-b06
          speaker: fairy_truth
          text: A good deed should never go unrewarded.
        - id: ch04-b07
          speaker: narrator
          text: At that instant, the monster vanished. In its place, the astonished keeper saw only a pretty little dog at his feet. Prince Darling was delighted by the change. He frisked around the man and showed his joy in every way a dog could. The grateful keeper lifted him into his arms, carried him straight to the King, and told the whole story of the escaped tiger and the strange creature that had saved his life.
        - id: ch04-b08
          speaker: narrator
          text: When the keeper brought the wonderful little dog to court, the Queen wished to keep him for herself. Prince Darling might have been perfectly happy in his new home if he could only have forgotten that he was really a man and a king. The Queen petted him tenderly and took great care of him. Yet she became so worried that her favorite might grow too fat that she asked the court physician to decide exactly how he should be fed.
        - id: ch04-b09
          speaker: physician
          text: Feed him nothing but bread, Your Majesty, and do not give him very much of that.
        - id: ch04-b10
          speaker: narrator
          text: The physician's order meant that poor Prince Darling stayed terribly hungry all day, but he bore his hunger patiently and never complained. One morning, when his little breakfast loaf was given to him, he decided to eat it in the garden. He took it carefully in his mouth and trotted toward a brook he knew, a long way from the palace. To his surprise, the brook had vanished. In its place stood a great house that seemed to be built entirely of gold and precious stones. Crowds of splendidly dressed people streamed through its doors, while sounds of music, dancing, and feasting poured from the windows.
        - id: ch04-b11
          speaker: narrator
          text: The people coming out looked very different from those going in. Their faces were pale and thin, and their fine clothes had become torn rags that hung loosely around them. Some collapsed and died before they could get away from the house. Others crawled farther with the greatest difficulty. Still others lay on the ground, fainting with hunger. They begged for a morsel of bread from the richly dressed people hurrying inside, but those people would not so much as look at the sufferers.
        - id: ch04-b12
          speaker: narrator
          text: Prince Darling approached a young girl who was so hungry that she was trying to eat a few blades of grass. Compassion filled him.
        - id: ch04-b13
          speaker: prince_darling
          text: I am hungry, but I will have dinner before I starve. If I give her my breakfast, perhaps I can save her life.
        - id: ch04-b14
          speaker: narrator
          text: Though he could not speak aloud in his dog's shape, he placed the bread in the girl's hand and watched her eat every bit of it eagerly. Soon her strength returned, and she seemed quite well again. Prince Darling was delighted that his small sacrifice had helped her. He was thinking of returning to the palace when a great outcry made him turn around. There was Celia, struggling as several people carried her against her will toward the golden house.
        - id: ch04-b15
          speaker: narrator
          text: For the first time, he wished he were still a monster, strong enough to rescue her. As a little dog, he could only bark weakly and run after her. Her captors chased him away with kicks.
        - id: ch04-b16
          speaker: narrator
          text: He refused to leave until he knew what had become of Celia, and he blamed himself for her danger.
        - id: ch04-b17
          speaker: prince_darling
          text: I am furious with the people who carried Celia away. But did I not do the very same thing? If no one had stopped me, would I not have treated her even more cruelly?
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: Just then, a noise sounded over his head as someone opened a window. To his delight, Celia herself stepped forward and threw out a plate piled with delicious-looking food. Then the window shut again, and she disappeared from view. Prince Darling had eaten nothing all day. He thought he might as well take this chance to feed himself and ran eagerly toward the plate. But the girl who had received his bread gave a terrified cry, caught him up in her arms, and held him back before he could touch it.
        - id: ch04-b19
          speaker: hungry_girl
          text: Do not touch it, poor little dog! That house is the Palace of Pleasure. Everything thrown out of it is poisoned!
          emotion: fearful
        - id: ch04-b20
          speaker: fairy_truth
          text: Now you see that a good action always brings its reward.
        - id: ch04-b21
          speaker: narrator
          text: At once, Prince Darling changed into a beautiful white dove. He remembered that white was the Fairy Truth's favorite color, and this new shape gave him hope that he might finally regain her favor. But his first concern was still Celia. He rose into the air and circled the golden house again and again until he found an open window. He flew inside and searched through every room, looking everywhere he could. Celia had vanished without a trace.
    - id: ch05
      title: The White Dove
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In despair, the Prince resolved to search the whole world until he found Celia. He flew onward for several days, never giving up his search, until he reached a vast desert. There, among the emptiness, he saw a cavern. To his great delight, Celia was sitting inside. She was safe and sharing the simple breakfast of an old hermit.
        - id: ch05-b02
          speaker: narrator
          text: Overjoyed to find her at last, Prince Darling flew straight to Celia and settled on her shoulder. He pressed close and caressed her, trying in every way he could to show how glad he was to see her again. Celia was surprised and delighted by such a tame and beautiful white dove. She stroked its feathers softly. When she spoke to it, she never dreamed that the bird understood every word.
        - id: ch05-b03
          speaker: celia
          text: You have offered yourself to me, little dove, and I accept. I will always love you.
        - id: ch05-b04
          speaker: fairy_truth
          text: Be careful what you say, Celia. Are you ready to keep that promise?
        - id: ch05-b05
          speaker: prince_darling
          text: I truly hope you are, my sweet shepherdess!
        - id: ch05-b06
          speaker: narrator
          text: In that moment, he stood before her in his own shape once more.
        - id: ch05-b07
          speaker: prince_darling
          text: You promised to love me always. Tell me you meant it, or I must ask the Fairy to make me the dove you liked so well again.
        - id: ch05-b08
          speaker: fairy_truth
          text: You need not fear that Celia will change her mind.
        - id: ch05-b09
          speaker: narrator
          text: The old hermit cast off the robe, and the Fairy Truth appeared before them.
        - id: ch05-b10
          speaker: fairy_truth
          text: Celia has loved you since the day she first saw you. She would not admit it while you were stubborn and wicked. Now you have repented and truly intend to be good. You deserve happiness, and she may love you as much as she wishes.
        - id: ch05-b11
          speaker: narrator
          text: Celia and Prince Darling fell together at the Fairy's feet. The Prince could not thank her enough for her patience and kindness. Celia listened as he told her how sorry he was for every foolish act and evil deed in his past. His true repentance delighted her, and she freely promised that she would love him for as long as she lived.
        - id: ch05-b12
          speaker: fairy_truth
          text: Rise, my children. I will carry you back to the palace, and Prince Darling will receive the crown that his wrongdoing cost him.
        - id: ch05-b13
          speaker: narrator
          text: Even while the Fairy was speaking, the desert cavern vanished. Celia and Prince Darling suddenly found themselves standing in Suliman's great hall. His faithful old tutor could hardly contain his delight when he saw his dear master alive and restored. Suliman gave the throne back joyfully, and for the rest of his life, he remained the Prince's most faithful subject.
        - id: ch05-b14
          speaker: narrator
          text: Celia and Prince Darling ruled together for many years. The Prince never forgot what pride and cruelty had cost him. He was determined to govern worthily, care for his people, and do his duty as a king. He began wearing the Fairy's gold ring again. From then on, it never once had cause to prick him severely.
