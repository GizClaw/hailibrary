audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    good_king:
      display_name: 好国王
      tts: {delivery: 仁厚端正，诚恳慈爱, timbre: 成熟温润, pace: 从容, pitch: 中低音}
    truth_fairy:
      display_name: 真理仙女
      tts: {delivery: 从容庄严，明辨善恶, timbre: 清澈有力量, pace: 舒缓, pitch: 中音}
    prince_darling:
      display_name: 亲爱的王子
      tts: {delivery: 年轻鲜明，随心境由骄横转为真诚, timbre: 清朗结实, pace: 中等有变化, pitch: 中低音}
    celia:
      display_name: 西莉娅
      tts: {delivery: 温柔坚定，不卑不亢, timbre: 柔和清亮, pace: 中等偏慢, pitch: 中高音}
    foster_brother:
      display_name: 乳兄弟
      tts: {delivery: 阴险谄媚，善于煽动, timbre: 圆滑偏冷, pace: 中等偏快, pitch: 中音}
    suliman:
      display_name: 苏利曼
      tts: {delivery: 忠厚庄重，语气恳切, timbre: 苍老浑厚, pace: 舒缓, pitch: 低音}
    keeper:
      display_name: 兽苑看守
      tts: {delivery: 粗声直气，情绪外露, timbre: 粗粝低沉, pace: 中等, pitch: 低音}
    hungry_girl:
      display_name: 饥饿的姑娘
      tts: {delivery: 虚弱而善良，急切真诚, timbre: 年轻轻柔, pace: 稍慢, pitch: 中高音}
  chapters:
    - id: ch01
      title: 白兔与金戒指
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王公正又仁慈，臣民都叫他“好国王”。一天，他出门打猎，猎犬追着一只小白兔跑。小兔猛地蹿进国王怀里，向他求救。国王轻轻摸着它。
        - id: ch01-b02
          speaker: good_king
          text: 好啦，小兔子。你既然来找我保护，我就不会让任何人伤害你。
        - id: ch01-b03
          speaker: narrator
          text: 国王把小兔带回王宫，给它一间漂亮的小屋，还备了各式各样的食物。当天夜里，国王独自在房中，一位美丽女子忽然出现在眼前。她的长裙白得像雪，头上戴着白玫瑰花冠。房门明明关得严严实实，国王怎么也想不通她是怎样进来的。
        - id: ch01-b04
          speaker: truth_fairy
          text: 我是真理仙女。你打猎时，我从林中经过，想看看你是否真像大家说的那么善良。我便化作小白兔，躲进你怀里。肯怜惜动物的人，对自己的同类只会更仁慈。要是你不肯救我，我就知道你是恶人了。你善待了我，从此我永远是你的朋友。说出你的心愿吧，无论是什么，我都答应送给你。
        - id: ch01-b05
          speaker: good_king
          text: 夫人，您既然是仙女，一定知道我的愿望。我只有一个儿子，爱他爱得不得了，所以给他取名“亲爱的王子”。您若真愿意赐我恩惠，就请您做他的朋友。
        - id: ch01-b06
          speaker: truth_fairy
          text: 我十分乐意。我能让他成为世上最英俊、最富有，或是最有权势的王子。您替他选一样吧。
        - id: ch01-b07
          speaker: good_king
          text: 这些我一样也不求。您若能让他成为世上最好的王子，我才真正感激。一个人若品行邪恶，就算富有、英俊，拥有天下所有王国，又能怎样？他照样不会幸福。只有善良的人，心里才能真正满足。
        - id: ch01-b08
          speaker: truth_fairy
          text: 您说得对。可他自己若不肯出力，我也没法让他变得善良。他必须努力向善。我只能答应劝导他。他犯错时，我会斥责他。他若不肯改正，不肯约束自己，我便惩罚他。
        - id: ch01-b09
          speaker: narrator
          text: 好国王很满意这个承诺。没过多久，他便去世了。亲爱的王子伤心极了。他全心爱着父亲，只要能留下好国王，哪怕献出所有王国和全部金银财宝，他也愿意。
        - id: ch01-b10
          speaker: narrator
          text: 两天以后，王子已经上床安歇，仙女忽然来到他面前。
        - id: ch01-b11
          speaker: truth_fairy
          text: 我答应过你父亲，要做你的朋友。为了信守诺言，我来送你一件礼物。
        - id: ch01-b12
          speaker: narrator
          text: 她把一枚小金戒指套在王子手指上。
        - id: ch01-b13
          speaker: truth_fairy
          text: 一定要珍惜它。它比钻石还宝贵。每当你做坏事，它就会刺痛你的手指。可它刺了你，你还是一意孤行，那你就会失去我的友谊，我也会成为你的敌人。
        - id: ch01-b14
          speaker: narrator
          text: 仙女说完便消失了，留下王子站在那里，惊讶不已。此后一阵子，他表现得很好，戒指一次也没刺过他。他非常满足，臣民便叫他“幸福的亲爱王子”。
    - id: ch02
      title: 王子走上邪路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可有一天，王子出门打猎，什么也没打到，心情顿时坏透了。回宫路上，戒指仿佛在压他的手指，却没有真的刺痛，他便不理会。刚回房间，小狗比比就欢欢喜喜地跑来迎接，围着他跳个不停。
        - id: ch02-b02
          speaker: prince_darling
          text: 走开！我不想看见你，别挡路！
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 小狗不明白主人为何这样，仍轻轻拉扯他的衣襟，只想让他看自己一眼。王子更恼火了，狠狠踢了它一脚。戒指立刻像针一样猛刺他的手指。他吓了一跳，羞愧地坐到房间一角。
        - id: ch02-b04
          speaker: prince_darling
          text: 仙女准是在笑我。我不过踢了一脚讨厌的小狗，能是什么大错？我统治这么大的王国，却连自己的狗都不能打，做国王还有什么用？
        - id: ch02-b05
          speaker: truth_fairy
          text: 我没有笑你。你一连犯了三个错。没得到想要的东西，你就发脾气，还以为所有人和动物都该供你取乐，这是第一个错。接着，你真的动了怒，这是第二个。最后，你残忍地伤害一只可怜的小动物，而它根本不该受这样的对待。
        - id: ch02-b06
          speaker: truth_fairy
          text: 你的地位当然比小狗高。可要是地位高的人真能随便欺负低于自己的一切，那我现在也可以打你，甚至杀死你，因为仙女高于凡人。拥有庞大帝国，不是为了让你随意作恶，而是为了让你尽力行善。
        - id: ch02-b07
          speaker: narrator
          text: 王子明白自己错了，答应以后努力改过，却没有做到。他小时候由一个糊涂的保姆照料，早就被宠坏了。想要什么，只要哭闹、发火、跺脚，保姆立刻满足他。她还整天说，他将来会成为国王，人人都必须服从、敬重他，谁也不能拦着他做任何想做的事。王子因此越来越任性。
        - id: ch02-b08
          speaker: narrator
          text: 等他懂事以后，已经知道骄傲、固执、自负都很糟糕，也认真试过改掉它们。可这些毛病早已变成习惯，而坏习惯很难戒除。他的天性并不坏，每次做错事都真心后悔。
        - id: ch02-b09
          speaker: prince_darling
          text: 我每天都要跟自己的怒气和傲慢打仗，真是苦恼。小时候若有人为这些毛病惩罚我，如今它们就不会这样折磨我了。
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: 戒指常常刺他。有时他马上停手，有时却不理警告。小错只让戒指轻刺一下，大恶却会使手指流血。最后，王子厌烦了没完没了的提醒，只想随心所欲，便扔掉戒指。他以为摆脱刺痛，自己就是世上最幸福的人。从此，心里冒出什么荒唐念头，他都放手去做，终于变得十分邪恶，再也没人喜欢他。
        - id: ch02-b11
          speaker: narrator
          text: 一天，王子散步时看见一位极美的年轻姑娘，当场决定娶她。姑娘名叫西莉娅，心灵和容貌同样美好。王子以为，让她做王后，她一定会欣喜若狂。西莉娅却毫不害怕。
        - id: ch02-b12
          speaker: celia
          text: 陛下，我只是个贫穷的牧羊姑娘。可就算这样，我也不愿嫁给您。
        - id: ch02-b13
          speaker: prince_darling
          text: 你讨厌我吗？
        - id: ch02-b14
          speaker: celia
          text: 不，殿下。我承认您十分英俊。可我要是每天看着您做坏事，最后恨您、瞧不起您，那么财富、华服和豪华马车，对我又有什么用？
        - id: ch02-b15
          speaker: narrator
          text: 王子听得勃然大怒，命侍从抓住西莉娅，把她押进王宫。她的话一整天都在他心里打转，惹得他烦躁不安。可他爱着她，到底狠不下心惩罚她。
        - id: ch02-b16
          speaker: narrator
          text: 王子最宠爱的亲信里，有一个是他的乳兄弟。王子完全信任他，可这个人一肚子坏主意，总怂恿王子作恶。他见王子闷闷不乐，便问缘故。王子说，自己受不了西莉娅看不起他，决定改好来赢得她的心。
        - id: ch02-b17
          speaker: foster_brother
          text: 您为一个小丫头这样费心，真是太抬举她了。换作我，早叫她乖乖听话。您是国王，反过来讨好一个牧羊女，岂不可笑？她若能做您的奴仆，都该庆幸才对。把她关起来，只给面包和水。她要是还不肯嫁，就砍掉她的脑袋，让别人知道您的命令不能违抗。连这样的姑娘都摆布不了，臣民很快就会忘记，他们活着就是为了供我们取乐。
        - id: ch02-b18
          speaker: prince_darling
          text: 可西莉娅没有做过该受罚的事。处死一个无辜的姑娘，难道不可耻吗？
        - id: ch02-b19
          speaker: foster_brother
          text: 谁不照您的吩咐做，谁就该受苦。即使这样不公平，也好过让臣民发现，他们可以随意侮辱您、违抗您。
        - id: ch02-b20
          speaker: narrator
          text: 这番话戳中了王子的弱处。他最怕失去权力，立刻放弃了改好的念头，决定吓得西莉娅答应婚事。乳兄弟怕他反悔，又邀来三个同样邪恶的年轻廷臣陪他吃晚餐。他们灌王子喝了许多酒，还不停说西莉娅如何嘲笑他的爱情。王子终于暴跳如雷，冲出去找她，扬言她若再拒绝，第二天就把她卖作奴隶。
    - id: ch03
      title: 怪物受到惩罚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子来到囚禁西莉娅的房间，却发现里面空空荡荡。钥匙明明一直在他口袋里，人竟然不见了。他大发雷霆，发誓报复帮助她逃走的人。坏朋友们趁机把他的怒火引向一位年老贵族，也就是王子从前的老师。
        - id: ch03-b02
          speaker: narrator
          text: 老人爱王子如同亲生儿子，至今还敢指出他的过错。起初王子会感谢他，后来却越来越不耐烦。别人都在奉承，只有老师责备他，他便认定老人爱挑毛病，把人赶出了宫廷。不过，他偶尔仍承认那是位值得敬重的正直之士。坏朋友怕老师有朝一日被召回来，便要借这个机会永远除掉他。
        - id: ch03-b03
          speaker: narrator
          text: 他们告诉王子，老师苏利曼曾夸口说，是自己帮助西莉娅逃走的，还买通三个人作伪证。王子怒气冲天，派乳兄弟带士兵去抓苏利曼，要给他戴上锁链，当罪犯一样押来。命令一下，王子回到房间。才进门，一声霹雳震得大地颤动，真理仙女突然现身。
        - id: ch03-b04
          speaker: truth_fairy
          text: 我答应过你父亲，要劝导你。你若不听，我便惩罚你。你轻蔑我的忠告，顺着邪念一路走到今天。如今你只有外表像人，内里早成了人人厌恶的怪物。该履行我的承诺了。你模仿野兽的脾性，我便罚你带上它们的模样。暴怒让你像狮子，贪婪让你像恶狼。你像毒蛇一样忘恩负义，反过来伤害那位如同你第二个父亲的人。你的粗蛮又像公牛。现在，你就变成兼有这些野兽形貌的东西吧。
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 仙女话音刚落，可怕的变化便发生了。王子长出狮头、公牛角、恶狼脚和毒蛇身。转眼间，他来到一片大森林，身旁是一泓清亮的湖水。湖面照出他的丑陋模样。一个声音响了起来。
        - id: ch03-b06
          speaker: truth_fairy
          text: 好好看看吧，你的恶行把你带到了什么境地。你的灵魂，比这副身体还要丑陋一千倍。
        - id: ch03-b07
          speaker: narrator
          text: 王子认出仙女的声音，怒气冲冲地转身去抓她，恨不得一口吞掉她。可是四周空无一人。
        - id: ch03-b08
          speaker: truth_fairy
          text: 你这样无能，却还发这么大的脾气，实在可笑。我要让你落进自己臣民手里，好好治一治你的傲慢。
        - id: ch03-b09
          speaker: narrator
          text: 王子只想离湖越远越好，免得一直看见自己的丑相。他朝树林跑去，没跑多远，便掉进捕熊的深坑。埋伏在树上的猎人跳下来，用几条铁链捆牢他，把他押往王国的都城。一路上，他不肯承认是自己的错招来惩罚，只怪仙女害了他，还疯狂撕咬铁链。
        - id: ch03-b10
          speaker: narrator
          text: 快进城时，王子发现人们正在举行盛大庆典。猎人一打听，才知道百姓以为那个专爱折磨他们的王子已经被雷劈死。怂恿他作恶的四名廷臣想夺取王国，分而治之。百姓知道，正是他们的坏话让王子变得邪恶，便砍了四人的头，把王冠献给刚从牢里放出的苏利曼。老人已经加冕，王国得到解救，百姓都说，他善良公正，大家终于能重享安宁富足。
        - id: ch03-b11
          speaker: narrator
          text: 王子气得大声咆哮。来到王宫前的大广场，他更难受了。苏利曼坐在华美的宝座上，百姓围在四周，祝他长寿，好让他弥补前任君王造成的灾祸。过了一会儿，苏利曼抬手请大家安静。
        - id: ch03-b12
          speaker: suliman
          text: 我接受你们献来的王冠，只是替亲爱的王子保管。他并没有像大家以为的那样死去。仙女向我保证，我们仍有希望再见到他，看他恢复刚登基时的善良正直。唉，他是受了谄媚小人的引诱。我了解他的心。若不是身边那些人把他带上歧途，他原本会成为好国王，成为百姓的父亲。我们可以痛恨他的过错，却也该怜悯他，盼望他回头。只要能让我们的王子回来，重新公正无愧地治理国家，我情愿献出生命。
        - id: ch03-b13
          speaker: narrator
          text: 这些话直抵王子心底。他终于明白，老人的爱护多么真挚，忠诚多么坚定。生平第一次，他为自己的种种恶行责备自己。满腔怒气慢慢消散，他回想过去，终于承认这份惩罚并不比自己应得的更重。他不再撕扯铁栏，变得像羔羊一样温顺。
    - id: ch04
      title: 以德报怨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 猎人把怪物送进一座大兽苑，同其他猛兽关在一起。王子决心温顺服从看守，用行动表示自己真心悔过。偏偏看守粗暴狠毒。怪物明明安安静静，那人心情一坏，仍会没来由地毒打他。
        - id: ch04-b02
          speaker: narrator
          text: 一天，看守睡着时，一只老虎挣断锁链，猛扑过去要吃他。王子看在眼里，起先暗暗高兴，以为自己终于能摆脱这个折磨他的人。可他很快改变了想法，只盼望铁笼能够打开。
        - id: ch04-b03
          speaker: prince_darling
          text: 我要以德报怨，救下这个不幸的人。
        - id: ch04-b04
          speaker: narrator
          text: 念头刚起，铁笼猛然敞开。王子冲到看守身边，那人已经醒来，正在抵挡老虎。看守见怪物逃出笼子，以为自己死定了。没想到，怪物扑向老虎，很快把它杀死，又回来俯伏在他脚下。看守又惊又喜，感激地弯腰抚摸救命恩人。一个声音忽然在耳边响起。
        - id: ch04-b05
          speaker: truth_fairy
          text: 善行绝不该得不到回报。
        - id: ch04-b06
          speaker: narrator
          text: 怪物立刻消失，看守脚边只剩一只漂亮的小狗。王子为这次变化高兴极了，围着看守蹦来跳去。看守把他抱进怀里，带去见国王，把事情从头讲了一遍。
        - id: ch04-b07
          speaker: narrator
          text: 王后想留下这只神奇的小狗。王子若能忘记自己曾经是人，曾经是国王，在这个新家原本会很幸福。王后宠爱他，也照料得很好，却怕他长胖，便问宫廷御医该怎么办。御医说，只能喂面包，而且不能多给。可怜的王子整天饿着肚子，却一直耐心忍受。
        - id: ch04-b08
          speaker: narrator
          text: 一天早晨，他得到一小块面包做早餐，想带去花园里吃，便叼着它跑向宫外很远的一条小溪。到了那里，小溪竟然不见了，原处矗立着一座大屋，仿佛由黄金宝石砌成。衣着华美的人们不断走进去，窗内传出音乐、舞步和欢宴的声音。
        - id: ch04-b09
          speaker: narrator
          text: 可从屋里出来的人全都面色苍白、骨瘦如柴，衣服破成一条条碎布。有些人刚出门就倒地死去，有些人艰难地往前爬，还有些人饿昏在地，向进屋的人讨一口面包。那些人却连看都不看他们。
        - id: ch04-b10
          speaker: narrator
          text: 王子走向一位饿得嚼草叶的年轻姑娘，心里十分怜悯。
        - id: ch04-b11
          speaker: prince_darling
          text: 我是很饿，可等到晚餐也不会饿死。把早餐给她，也许能救她一命。
        - id: ch04-b12
          speaker: narrator
          text: 他把面包放进姑娘手里，看着她狼吞虎咽地吃完。姑娘很快恢复精神。王子帮到了她，心里很高兴，正想回王宫，忽然听见一阵喧嚷。他回头一看，竟然是西莉娅。她拼命反抗，还是被人抬进了大屋。
        - id: ch04-b13
          speaker: narrator
          text: 王子第一次后悔自己不再是怪物。若还有那副身躯，他就能救出西莉娅。现在，他只能无力地朝那些人叫，试着跟在后面，却被他们踢开。他决心守在这里，直到知道西莉娅的下落，还为她遭遇的一切责怪自己。
        - id: ch04-b14
          speaker: prince_darling
          text: 唉，他们抓走西莉娅，我气得要命。可我以前不也做过同样的事吗？要不是有人拦住，我还打算更残忍地对待她呢。
          emotion: sad
    - id: ch05
      title: 白鸽寻找西莉娅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 头顶忽然传来声音，有人推开了一扇窗。王子欣喜地看见西莉娅走到窗前，抛出一盘看上去十分美味的食物，随后又关上窗。王子一整天没吃东西，觉得正好可以饱餐一顿。他刚跑过去，那位吃过他面包的姑娘便惊叫起来，一把抱住了他。
        - id: ch05-b02
          speaker: hungry_girl
          text: 别碰它，我可怜的小狗！那座屋子是享乐宫，从里面出来的东西全都有毒！
          emotion: fearful
        - id: ch05-b03
          speaker: truth_fairy
          text: 你看，善行总会带来回报。
        - id: ch05-b04
          speaker: narrator
          text: 王子随即变成了一只美丽的白鸽。他记得白色是真理仙女最喜欢的颜色，开始盼望自己终于能重新得到她的喜爱。不过此刻，他最牵挂的是西莉娅。他飞上天空，绕着大屋一圈圈盘旋，终于找到一扇开着的窗。
        - id: ch05-b05
          speaker: narrator
          text: 他飞遍每一个房间，却怎么也找不到西莉娅。王子近乎绝望，决心找遍全世界，直到寻见她。他飞了好几天，来到一片辽阔的沙漠。那里有一座洞穴。西莉娅竟坐在洞里，正同一位老隐士分享简朴的早餐。
        - id: ch05-b06
          speaker: narrator
          text: 王子喜不自胜，落在西莉娅肩头，不住亲昵地依偎，想让她明白自己有多么高兴。西莉娅见这只漂亮的白鸽如此温顺，又惊奇又欢喜。她轻轻抚摸它，从没想到白鸽能听懂自己的话。
        - id: ch05-b07
          speaker: celia
          text: 你把自己送给我，我就收下这份礼物。我会永远爱你。
          emotion: happy
        - id: ch05-b08
          speaker: truth_fairy
          text: 西莉娅，留心你刚才许下的话。你准备一直信守它吗？
        - id: ch05-b09
          speaker: narrator
          text: 就在这时，白鸽恢复了王子的模样。
        - id: ch05-b10
          speaker: prince_darling
          text: 我的好牧羊姑娘，我真希望你会守诺！你答应永远爱我。快告诉我，你说的是真心话。不然，我只好求仙女把我重新变回那只讨你喜欢的白鸽了。
          emotion: happy
        - id: ch05-b11
          speaker: truth_fairy
          text: 你不用担心她改变心意。
        - id: ch05-b12
          speaker: narrator
          text: 老隐士脱下伪装的长袍，原来正是真理仙女。
        - id: ch05-b13
          speaker: truth_fairy
          text: 西莉娅第一眼见到你，就已经爱上了你。只是那时候你又固执又顽劣，她不肯告诉你。如今你已经悔过，决心做个好人，你配得上幸福。以后，她想多么爱你，就可以多么爱你。
    - id: ch06
      title: 王冠归还
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 西莉娅和亲爱的王子一同跪在仙女脚边。王子一遍遍感谢她的仁慈。西莉娅听到王子为过去的荒唐与恶行深深悔恨，十分欣慰，答应一生一世爱他。
        - id: ch06-b02
          speaker: truth_fairy
          text: 起来吧，我的孩子们。我现在就送你们回王宫。亲爱的王子曾因恶行失去王冠，如今该把王冠还给他了。
        - id: ch06-b03
          speaker: narrator
          text: 仙女还在说话，两人便已经站在苏利曼的大厅里。老人重新见到亲爱的主人，欢喜极了，立刻把王位交还给王子。此后，他始终是王子最忠诚的臣子。
        - id: ch06-b04
          speaker: narrator
          text: 西莉娅和亲爱的王子共同治理王国许多年。王子一心做一位贤明的君主，尽好自己的责任。他重新戴上那枚戒指，而戒指再也没有狠狠刺痛过他。
