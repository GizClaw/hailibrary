    citizen_2:
      display_name: 市民乙
      tts: {delivery: 兴奋响亮, timbre: 清亮有力, pace: 快, pitch: 中高音}
    citizen_3:
      display_name: 市民丙
      tts: {delivery: 兴奋响亮, timbre: 浑厚开朗, pace: 快, pitch: 中低音}
  chapters:
    - id: ch01
      title: 国王的求婚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，世上有一位美丽无双的公主。她的金发像最纯的黄金，一层层起伏着，几乎垂到地面，所以人人都叫她美丽的金发姑娘。她总戴着鲜花冠冕，衣裙上绣满珍珠与钻石。见过她的人，没有一个不爱她。邻国有位尚未成婚的年轻国王。他富有又英俊，虽然从未见过公主，只听人谈起她，便爱得吃不下饭，也喝不进水。他决定派使臣前去求婚，为此造了一辆华丽马车，配上一百多匹骏马和一百名仆从，还再三吩咐使臣，务必把公主接回来。使臣一上路，宫廷里谈论的便只有这件事。国王深信求婚一定成功，早已让人缝制漂亮的新衣，打造华贵家具，只等新娘到来。
        - id: ch01-b02
          speaker: narrator
          text: 使臣一路带着浩浩荡荡的车马，终于抵达公主的宫殿，郑重传达了国王的求婚，却只得到一句客气的回绝。也许公主那天碰巧心情不好，也许国王的殷勤没能打动她，谁也说不准。她感谢国王的美意，却明白表示自己一点也不想结婚。公主教养极好。她既不接受国王，自然也不肯留下国王所赠的珍珠与钻石，便让使臣把礼物原样带回。她只留下二十五枚英格兰别针，免得国王觉得自己遭到了彻底轻视。使臣只好垂头丧气地踏上归途。回到都城时，国王正在焦急等候，宫里人人见他没有带回公主，都气恼地埋怨他。国王更是伤心得哭起来，哭得像个小娃娃，任谁也劝不住。
        - id: ch01-b03
          speaker: narrator
          text: 宫廷里还有一位名叫夏尔芒的年轻人。他才貌出众，深受国王宠爱，知道所有国家机密。人人都喜欢他，只有几个嫉妒他的廷臣例外。一天，大家谈起使臣空手而归，夏尔芒一时口快。
        - id: ch01-b04
          speaker: charming
          text: 国王若是派我去见金发公主，我敢说，她一定会跟我回来。
        - id: ch01-b05
          speaker: narrator
          text: 嫉妒他的廷臣立刻跑去告状。
        - id: ch01-b06
          speaker: courtier
          text: 陛下，夏尔芒竟说，若派他去，金发公主一定会跟他回来。他大概觉得自己比您英俊得多，公主见了他就会爱上他，心甘情愿随他走呢。
        - id: ch01-b07
          speaker: young_king
          text: 好啊！他竟敢拿我的痛苦取笑，还以为自己比我更迷人？把他关进高塔，叫他活活饿死！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 夏尔芒早把那句冒失话忘了，却被卫兵凶狠地押进监牢。塔里只有一小堆稻草供他睡觉，连一口食物也没有。幸好一线细水流过塔底，他才没有渴死。绝望中，他想不明白自己怎样得罪了国王。他明明一向忠心，从未做过对不起主人的事。一天，国王恰好从塔下经过，听出昔日宠臣的声音，便停下脚步细听。几个廷臣竭力劝他别再理会这个叛徒，他却叫众人安静，执意听夏尔芒在说什么。随后，他亲手打开塔门，把夏尔芒叫到面前。年轻人神色凄苦地走出来，吻过国王的手。
        - id: ch01-b09
          speaker: charming
          text: 陛下，我究竟做错了什么，竟要受这样残酷的惩罚？
        - id: ch01-b10
          speaker: young_king
          text: 你嘲笑我和我的使臣，还夸口说，我若派你去接金发公主，你准能把她带回来。
        - id: ch01-b11
          speaker: charming
          text: 我的确说过。我要把您的风采描绘得活灵活现，再好好讲清您的美德。公主听完，怎么可能不动心？可这句话究竟有什么值得您生气的呢？
        - id: ch01-b12
          speaker: narrator
          text: 国王听他这样解释，也觉得毫无可恼之处，便狠狠瞪了那些歪曲原话的廷臣。他带夏尔芒回宫，先让他饱餐一顿，又说自己依旧深爱金发姑娘，遭到拒绝也没有改变心意，只是不知道怎样劝她回心转意。
        - id: ch01-b13
          speaker: young_king
          text: 我想派你再去一趟。也许你能说服她嫁给我。不过，你得等我备好盛大的仪仗队。
        - id: ch01-b14
          speaker: narrator
          text: 夏尔芒答应第二天便出发，还说只需一匹好马。国王喜出望外，把致公主的书信交给他，祝他一路顺风。星期一清晨，夏尔芒独自上路，满心琢磨该怎样说服公主。他随身带着一本簿子，每想出一个好主意，便下马坐到树下，赶紧把它添进自己的说辞。
    - id: ch02
      title: 三次善意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，他天刚蒙蒙亮便出发，骑马穿过广阔的草地，忽然想出了一个绝妙的主意。他立刻翻身下马，来到小河边，在一棵柳树下坐好，把这个主意认真写进簿子。写完抬头时，他正为周围的美景欢喜，却发现一条大金鲤躺在草上，张着嘴奄奄一息。原来，她追小飞虫时跃得太高，一下落到岸上，已经困了很久，眼看就要死了。夏尔芒心中可怜她，虽然也忍不住觉得这条鱼做晚餐一定鲜美，还是轻轻把她捧起来，放回河里。金鲤一碰到清凉舒爽的水，便快活地沉到河底，随后又大着胆子游回岸边。
        - id: ch02-b02
          speaker: dame_carp
          text: 夏尔芒，谢谢你的好心。你救了我的命，总有一天，我一定会报答你。
        - id: ch02-b03
          speaker: narrator
          text: 金鲤夫人说完便沉入水中，留下夏尔芒为她的彬彬有礼惊讶不已。继续赶路时，他又看见一只乌鸦被鹰紧紧追赶，马上就要落进鹰嘴。夏尔芒急忙弯弓搭箭，一箭射死了鹰。乌鸦欢喜地栖到树上。
        - id: ch02-b04
          speaker: raven
          text: 你肯救一只可怜的乌鸦，实在慷慨。我可不会忘恩负义，总有一天，我也会报答你。
        - id: ch02-b05
          speaker: narrator
          text: 夏尔芒觉得乌鸦这样说很可爱，便继续前行。另一个清晨，太阳还未升起，他走进一片昏暗的密林，听见猫头鹰绝望地哀叫。他猜她落入了捕鸟人的网，四下一找，果然发现前夜设下的罗网。
        - id: ch02-b06
          speaker: charming
          text: 人为什么只会折磨这些从未伤害过谁的可怜生灵？
        - id: ch02-b07
          speaker: narrator
          text: 他掏出小刀割断绳索。猫头鹰飞进黑暗，又转身回到他面前。
        - id: ch02-b08
          speaker: owl
          text: 你救了我一条命。再过几分钟，捕鸟人就会赶来，没有你，我一定会死。我心里感激，总有一天会报答你。
        - id: ch02-b09
          speaker: narrator
          text: 这三件事便是夏尔芒旅途中仅有的要紧奇遇。此后，他加紧赶路，终于来到金发公主的宫殿。眼前的一切都叫他赞叹不已。这里的钻石多得像路边石子，金银、华服、糖果与精巧玩意儿更是随处可见。他暗想，公主若肯抛下这一切，跟自己回去嫁给国王，国王可真是走了大运。他仔细装扮起来，穿上华美锦衣，插好红白两色羽饰，又把绣工精美的长巾斜披在肩头，竭力显得神采飞扬、风度翩翩。他怀里还抱着一只途中买来的漂亮小狗。夏尔芒来到宫门前，卫兵恭敬行礼，立刻派人进去禀告，说邻国国王的使臣已经到来。
        - id: ch02-b10
          speaker: goldilocks
          text: 夏尔芒，这名字听着就不错。我猜他准是容貌出众，人人见了都会着迷。
        - id: ch02-b11
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 可不是吗，殿下！我们在阁楼窗边纺麻，一看见他，就什么也做不成了。只要他还在眼前，我们就只顾着看他。
        - id: ch02-b12
          speaker: goldilocks
          text: 原来你们就是这样消遣的，趴在窗口瞧陌生人！快拿来我的绣花蓝缎裙，梳好我的金发。再编新鲜的花冠，把高跟鞋和扇子拿来，也要扫净大厅和宝座。我要让人人都承认，我的确是美丽的金发姑娘。
        - id: ch02-b13
          speaker: narrator
          text: 侍女们东奔西跑，慌乱中不断撞到彼此的脑袋，越急越碍手碍脚。她们总算替公主装扮妥当，领她到镜廊逐一查看，再扶她登上黄金、乌木和象牙制成的宝座。贵妇们弹起吉他，轻声歌唱。夏尔芒被领入大厅，惊艳得一时说不出话。等他鼓起勇气，终于慷慨激昂地说完准备好的话，恳求公主不要让他独自回去。
        - id: ch02-b14
          speaker: goldilocks
          text: 你说得都很好。若能顺从你的心意，我也会比顺从别人更高兴。可一个月前，我在河边脱手套，指上的戒指滑落水中。那枚戒指比整个王国还珍贵。我已经发誓，哪位求婚使臣不能先把它找回来，我就绝不听他的请求。你就是说上十五天十五夜，也改变不了我的主意。
        - id: ch02-b15
          speaker: narrator
          text: 夏尔芒十分惊讶，仍深深鞠躬，请公主收下绣花披巾和小狗。她不肯要礼物，只让他记住自己的条件。夏尔芒回到住处，一口晚餐也没吃。名叫弗里斯克的小狗也吃不下，紧挨着主人趴好。夏尔芒叹息了一整夜，觉得戒指落水已经一个月，根本无处可寻，公主准是故意交给他一件办不到的差事。
        - id: ch02-b16
          speaker: frisk
          text: 亲爱的主人，别灰心。运气也许会变好。你这样善良，一定会得到幸福。天一亮，我们就去河边找找。
        - id: ch02-b17
          speaker: narrator
          text: 夏尔芒只轻轻拍了小狗两下，什么也没说，很快便睡着了。东方刚露出第一线晨光，弗里斯克就在屋里蹦蹦跳跳，终于叫醒主人。他们一同出门，先穿过花园，再走到河岸，沿着水边来来回回寻找。夏尔芒什么也找不到，正伤心地想着自己只能空手回去，忽然听见有人一声接一声地叫他的名字。他停步四下张望，岸上明明一个人也没有。他以为自己仍在做梦，便继续往前走，可那声音再次清清楚楚地响了起来。
        - id: ch02-b18
          speaker: charming
          text: 是谁在叫我？
        - id: ch02-b19
          speaker: frisk
          text: 我看见一条金鲤游过来了！
        - id: ch02-b20
          speaker: dame_carp
          text: 你在柳树旁救过我的命，我也许诺过要报答你。拿着吧，这就是金发公主的戒指。
        - id: ch02-b21
          speaker: narrator
          text: 夏尔芒从金鲤夫人口中接过戒指，千恩万谢，马上带着小小的弗里斯克直奔宫殿。有人进去禀告，说夏尔芒正在门外求见。公主听了，还以为这个可怜人发现事情办不到，只能来向她告别。没想到夏尔芒走进来，将那枚完好无损的戒指送到她手上。
        - id: ch02-b22
          speaker: charming
          text: 殿下，您的吩咐我已经办到。现在，您愿意嫁给我的主人了吗？
        - id: ch02-b23
          speaker: narrator
          text: 公主看见戒指完好无损，惊讶得仿佛身在梦中。
        - id: ch02-b24
          speaker: goldilocks
          text: 夏尔芒，你一定深受某位仙女宠爱，不然绝不可能找回它。
        - id: ch02-b25
          speaker: charming
          text: 帮助我的，只有一心服从您愿望的念头。
    - id: ch03
      title: 巨人与乌鸦
      blocks:
        - id: ch03-b01
          speaker: goldilocks
          text: 既然你这样好心，也许愿意再帮我一次。附近有个叫加利弗龙的王子。我拒绝他的求婚后，他发誓毁掉我的国家，不断杀害我的臣民。可他像高塔一样高，吃人如同猴子吃栗子，说话又响得能把人震聋，我怎么能嫁给这种巨人？在我考虑求婚以前，你必须杀掉他，把他的头带回来。
        - id: ch03-b02
          speaker: charming
          text: 好吧，我去和加利弗龙交战。他多半会杀死我，不过至少，我会为保卫您而死。
        - id: ch03-b03
          speaker: narrator
          text: 公主听夏尔芒说自己会死，反倒害怕起来。她把所有想得到的话都说了，竭力阻止他去和巨人交战，可夏尔芒已经下定决心。任她怎样劝说，也不能让他回头。他出去备好合适的武器，带着小弗里斯克骑上马，向加利弗龙的国土进发。沿路每个遇见的人都告诉他，这个巨人有多么可怕，世上根本没有人敢走到他附近。夏尔芒听得越多，心里就越怕，可他仍旧朝巨人的城堡走去。
        - id: ch03-b04
          speaker: frisk
          text: 主人，等你和他交手，我就去咬他的脚后跟。他低头看我时，你正好杀了他。
        - id: ch03-b05
          speaker: narrator
          text: 夏尔芒夸奖了小狗的计策，心里却知道这点帮助远远不够。他来到巨人城堡附近，只见每条路都铺满白骨。不久，加利弗龙走了过来，脑袋高过最高的树梢，嘴里唱着可怕的歌。
        - id: ch03-b06
          speaker: galifron
          text: “快把男孩女孩送出来，别磨蹭着替他们卷头发。反正我要吃掉一大群，谁还管他们卷没卷发。”
        - id: ch03-b07
          speaker: charming
          text: “勇敢的夏尔芒来会你，见了你一点也不惊慌。他的个头虽然不算高，也足够把你打倒在地。”
        - id: ch03-b08
          speaker: narrator
          text: 夏尔芒仓促编出的韵脚实在不怎么样。不过你要知道，他怕得要命，还能立刻唱出这几句，没有更糟已经是奇迹了。巨人听见有人这样挑衅，四下张望，终于发现夏尔芒持剑站在那里，顿时暴怒。他举起硕大的铁棍猛砸下来。这一棍若打中，夏尔芒必死无疑。恰在此时，那只乌鸦落到巨人头顶，坚硬的喙一下接一下地啄刺，宽大的翅膀贴着他的眼睛猛烈拍打，把加利弗龙弄得晕头转向，两眼什么也看不见。巨人的铁棍接连砸下，却每一下都落在空中。夏尔芒趁机冲上去，用锋利的剑接连砍了几下，终于将他击倒。巨人还没弄清发生了什么，夏尔芒已经割下他的头。乌鸦飞到近旁的树上，朝他嘎嘎叫起来。
        - id: ch03-b09
          speaker: raven
          text: 瞧，我没有忘记你杀死老鹰、救我一命的恩情。今天，我总算兑现了报答你的诺言。
        - id: ch03-b10
          speaker: charming
          text: 现在是我欠你的恩情，比你从前欠我的多得多。
        - id: ch03-b11
          speaker: narrator
          text: 夏尔芒骑马带走巨人的头。回到都城时，百姓成群结队追在身后，高声欢呼。
        - id: ch03-b12
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 快看勇敢的夏尔芒，他杀死了巨人！
        - id: ch03-b13
          speaker: narrator
          text: 百姓的欢呼一路传入宫中。公主听见夏尔芒的名字，却不敢询问外面究竟出了什么事，生怕别人告诉她，年轻人已经战死。没过多久，夏尔芒亲自来到宫殿，把巨人的头带到她面前，她才终于放下心来。可加利弗龙那颗头实在太过可怕，尽管已经不能再伤人，公主见了仍旧心惊胆战。
        - id: ch03-b14
          speaker: charming
          text: 公主，我已经杀死您的敌人。现在，您该答应嫁给我的主人了吧？
        - id: ch03-b15
          speaker: goldilocks
          text: 还不行！你得替我从幽暗洞窟取来泉水。洞口有两条眼冒烈火的巨龙，谁也过不去。里面还有一个爬满癞蛤蟆与蛇的深坑，坑底的小洞才涌出美貌与青春之泉。那泉水能让美丽永不消退，让丑陋变得可爱，让年轻人永不衰老，也让老人重返青春。我离开王国时，不能不带上一些。
        - id: ch03-b16
          speaker: charming
          text: 公主，您永远不需要这种泉水。可我是个不幸的使臣，您一心想要我的命。无论您叫我去哪里，我都会去，尽管我知道自己回不来了。
          emotion: sad
        - id: ch03-b17
          speaker: narrator
          text: 公主没有一点心软的表示，夏尔芒只好带弗里斯克动身。一路上，人们都替这个英俊的年轻人惋惜，说他竟这样轻率地丢掉性命。他独自去洞窟，就算带上一百个人，也不可能成功。公主为什么总要别人办不可能的事？夏尔芒听见这些话，心里十分悲伤，却始终一言不发，只顾赶路。快到山顶时，他下马让坐骑吃草，弗里斯克在一旁追苍蝇取乐。夏尔芒知道洞窟已经不远了，便仔细观察四周。他看见一块丑陋的黑岩，浓烟正从石缝中滚滚涌出。转眼间，一条巨龙从烟中现身。它的嘴里和眼里都喷着火，身躯黄绿相间，利爪鲜红，长得惊人的尾巴在地上盘了一百个圈。弗里斯克吓得魂飞魄散，简直不知道该躲到哪里。夏尔芒却已决心取到泉水，否则宁可死在这里。他拔出剑，又拿出公主交给他的水晶瓶。
        - id: ch03-b18
          speaker: charming
          text: 我一定回不来了。我死以后，你去告诉公主，这件差事要了我的命。再去找我的主人，把我经历的一切都讲给他听。
        - id: ch03-b19
          speaker: narrator
          text: 这时，一个声音叫起夏尔芒的名字。他看见猫头鹰正栖在空心树里。
        - id: ch03-b20
          speaker: owl
          text: 你在捕鸟网里救过我，现在该我报答你。把瓶子交给我吧。幽暗洞窟的每条路我都认得，我会替你装满美貌之泉的泉水。
        - id: ch03-b21
          speaker: narrator
          text: 夏尔芒听说猫头鹰认得洞窟中的所有道路，心里别提多高兴了，连忙把水晶瓶交给她。猫头鹰轻轻振翅，悄无声息地从巨龙身旁飞进洞窟，守在入口的怪物竟毫无察觉。过了一阵，她平安飞了回来，带回满满一瓶闪亮的泉水，水一直盛到瓶口。夏尔芒满怀感激地向她道谢，随后带着弗里斯克，欢欢喜喜赶回都城。
    - id: ch04
      title: 王后的选择
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 夏尔芒径直进宫，把盛满闪亮泉水的瓶子交给公主。三件难事全已完成，公主再也找不到拒绝的理由，只得向他道谢，命人准备离开自己的国家。他们很快一同上路。一路相处下来，公主发现夏尔芒是个极讨人喜欢的旅伴。她越来越舍不得他，有时终于忍不住对他说。
        - id: ch04-b02
          speaker: goldilocks
          text: 我们为什么不留在那里？我本可以让你当国王，那样我们会多么幸福！
        - id: ch04-b03
          speaker: charming
          text: 即使能得到一个王国，即使是为了讨您欢心，我也不能做出让主人那样伤心的事。不过在我眼中，您的确像太阳一样美丽。
        - id: ch04-b04
          speaker: narrator
          text: 他们终于抵达国王那座宏伟的都城。国王带着许多珍贵礼物亲自出城迎接公主，所有人都为她的到来而欢呼。盛大的婚礼随即举行，整座城市沉浸在喜悦之中。可婚后不久，国王便看出金发姑娘十分喜欢夏尔芒。只要这个年轻人不在身边，她便快乐不起来。她还常常在国王面前称赞夏尔芒，把他一路完成的奇迹说了一遍又一遍。
        - id: ch04-b05
          speaker: goldilocks
          text: 若不是夏尔芒，我绝不会来到这里。你应该好好感谢他。他做成了那些最不可能的事，还替我取回美貌之泉。从此我永不衰老，只会一年比一年漂亮。
        - id: ch04-b06
          speaker: narrator
          text: 夏尔芒的仇人看准机会，又来煽风点火。
        - id: ch04-b07
          speaker: courtier
          text: 真奇怪，您竟然不嫉妒。王后眼里全世界谁也比不上夏尔芒，好像您另派一个人，就做不成同样的事！
        - id: ch04-b08
          speaker: young_king
          text: 你这样一说，倒真有道理。把夏尔芒的手脚锁起来，扔进高塔！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 卫兵立刻抓走夏尔芒。他忠心侍奉国王，完成了一件又一件不可能的差事，得到的报答却是手脚戴上锁链，再次被扔进高塔。那里没有朋友，也没有阳光，他每天只能见到狱卒。狱卒送来的食物只有一块黑面包，饮水也只有一罐。幸好小弗里斯克常来安慰主人，也把宫中的消息一一带给他。金发姑娘得知夏尔芒被囚，马上扑倒在国王脚边，苦苦哀求他释放这个忠诚的年轻人。可她哭得越厉害，国王就越生气。最后，金发姑娘终于明白，再说什么也没有用，只能满心悲伤地离去。
        - id: ch04-b10
          speaker: narrator
          text: 国王却突然有了一个念头。他怀疑自己也许不够英俊，才不能让金发姑娘满意，于是想起美貌之泉，打算用泉水洗一洗脸。那只水晶瓶原本摆在王后房中的架子上，她特意放在那里，好让自己常常看见。可就在不久前，有个侍女追打一只蜘蛛，不慎将瓶子碰落。水晶摔得粉碎，珍贵的泉水一滴不剩，全洒在地上。侍女不知道该怎么办，只能慌忙扫走碎片。随后，她忽然想起国王房中也有一只形状完全相同的瓶子，里面同样盛着闪闪发亮的水。她不敢把自己闯下的祸告诉任何人，便偷偷取来那只瓶子，摆回王后的架子，装作什么也没发生。
        - id: ch04-b11
          speaker: narrator
          text: 那瓶水却不是普通的水，而是这个国家专门用来除掉麻烦人物的毒水。这里不照寻常办法砍掉犯人的头，只须把这种水洒到那人的脸上，他就会立刻沉沉睡去，从此再也醒不过来。国王对此毫不知情。他满心以为架上的水能让自己变得更美，便高兴地拿起瓶子，将闪亮的水洒遍脸庞。结果，他当场倒下，仿佛只是睡着了。宫里的人轮番呼唤，又想尽办法摇醒他，却没有一个人能够让国王重新睁开眼睛。
    - id: ch05
      title: 忠诚的夏尔芒
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 小弗里斯克最先听到国王去世的消息。他马上跑到高塔，把事情告诉夏尔芒。夏尔芒自己无法离开，只能托小狗去恳求公主，不要忘记高塔里的可怜囚徒。国王突然死去，整座宫殿乱成一团，到处都是慌张奔走的人。小小的弗里斯克却没有退缩，他从拥挤的人群中一点点挤出一条路，终于来到公主身边。
        - id: ch05-b02
          speaker: frisk
          text: 殿下，请别忘记可怜的夏尔芒。
        - id: ch05-b03
          speaker: narrator
          text: 听见小狗的话，公主终于想起夏尔芒为她做过的一切。他替她找回戒指，杀死巨人，又取来神奇泉水，如今却还被锁在高塔里。她没有把自己的决定告诉任何人，立刻独自来到塔中，亲手解开夏尔芒手脚上的锁链。随后，她把一顶金冠戴到他头上，又将象征国王身份的王袍披在他肩头。
        - id: ch05-b04
          speaker: goldilocks
          text: 来吧，忠诚的夏尔芒。我封你为王，也愿意嫁给你，做你的妻子。
        - id: ch05-b05
          speaker: narrator
          text: 夏尔芒终于重获自由，满心幸福地跪在公主脚边，感谢她这番仁厚的话。宫里宫外的每一个人听说他将成为国王，都由衷欢喜。人们立刻为两人举行婚礼，那场婚礼美得简直无法想象。受尽苦难的夏尔芒王子终于和金发公主结为夫妻，从此永远幸福地生活在一起。这个故事出自奥诺瓦夫人。
