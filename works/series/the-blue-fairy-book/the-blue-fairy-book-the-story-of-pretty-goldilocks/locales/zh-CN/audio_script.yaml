      tts: {delivery: 活泼热切, timbre: 柔亮年轻, pace: 稍快, pitch: 中高音}
    maid_3:
      display_name: 侍女丙
      tts: {delivery: 活泼热切, timbre: 轻快年轻, pace: 稍快, pitch: 中音}
