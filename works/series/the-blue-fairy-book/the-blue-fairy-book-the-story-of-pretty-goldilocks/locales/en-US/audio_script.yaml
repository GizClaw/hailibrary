  chapters:
    - id: ch01
      title: The King's Unanswered Proposal
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a princess who was the loveliest creature in the world. Her hair shone like the finest gold and fell in waves almost to the ground, so people called her Pretty Goldilocks. She wore a crown of flowers, and diamonds and pearls covered her dresses. Everyone who saw her fell in love with her.
        - id: ch01-b02
          speaker: narrator
          text: A young unmarried king ruled a neighboring country. He was rich and handsome. Though he had never seen Goldilocks, the stories of her beauty made him fall so deeply in love that he could neither eat nor drink. At last, he decided to send an ambassador to ask her to marry him.
        - id: ch01-b03
          speaker: narrator
          text: The King had a splendid carriage made for his ambassador. He sent more than a hundred horses and a hundred servants with him, then ordered him to bring the Princess home. Once that grand company had left, the whole court talked of nothing else. The King felt certain Goldilocks would agree, so he put his people to work making beautiful dresses and magnificent furniture. He wanted everything ready by the time she arrived.
        - id: ch01-b04
          speaker: narrator
          text: The ambassador reached the Princess's palace and gave her the King's message. Perhaps she was cross that day, or perhaps the compliment did not please her. No one knew.
        - id: ch01-b05
          speaker: princess_goldilocks
          text: Please thank the King for me, but I have no wish to marry him.
        - id: ch01-b06
          speaker: narrator
          text: The ambassador sadly started home with all the King's presents. Goldilocks was too well brought up to keep the pearls and diamonds when she would not accept the King. She kept only twenty-five English pins, so he would not feel entirely rejected.
        - id: ch01-b07
          speaker: narrator
          text: The King waited impatiently in his city. When the ambassador returned without the Princess, everyone blamed the poor man. The King wept like a baby, and no one could comfort him.
        - id: ch01-b08
          speaker: narrator
          text: There was a young man at court named Charming. He was cleverer and handsomer than anyone else, and almost everyone loved him. Only a few envious courtiers hated him because he was the King's favorite and knew every secret of state. One day, Charming heard some people saying that the ambassador's journey had done little good. Without thinking, he spoke up.
        - id: ch01-b09
          speaker: charming
          text: If the King had sent me to Princess Goldilocks, I am sure she would have returned with me.
        - id: ch01-b10
          speaker: narrator
          text: His enemies hurried straight to the King.
        - id: ch01-b11
          speaker: courtier_1
          text: Your Majesty, you will hardly believe Charming's insolence. He says that if he had gone to Princess Goldilocks, she certainly would have followed him home.
        - id: ch01-b12
          speaker: courtier_2
          text: He must think himself so much handsomer than you that the Princess would fall in love with him at once.
        - id: ch01-b13
          speaker: narrator
          text: The King flew into a rage.
        - id: ch01-b14
          speaker: king
          text: So he laughs at my sorrow and thinks he is more charming than I am! Lock him in my great tower and leave him there to starve.
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: The guards came for Charming, who had forgotten all about his careless remark. They seized him and carried him cruelly away to prison. Inside the great tower, he had only a little straw for a bed and no one to help him. A thin stream of water flowed through the stones. Without it, he would have died of thirst.
        - id: ch01-b16
          speaker: narrator
          text: One day, deep in despair, Charming spoke to himself.
        - id: ch01-b17
          speaker: charming
          text: How have I offended the King? I have always served him faithfully. I have never done anything against him.
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: The King happened to be passing the tower and recognized his former favorite's voice. Charming's enemies begged him not to listen to a traitor, but the King stopped beside the door.
        - id: ch01-b19
          speaker: king
          text: Be quiet. I want to hear what he is saying.
        - id: ch01-b20
          speaker: narrator
          text: He opened the tower. Charming came forward sadly and kissed the King's hand.
        - id: ch01-b21
          speaker: charming
          text: What have I done, Your Majesty, to deserve such cruelty?
          emotion: sad
        - id: ch01-b22
          speaker: king
          text: You made fun of me and my ambassador. You said that if I had sent you to Goldilocks, you would have brought her back.
        - id: ch01-b23
          speaker: charming
          text: That is true, Your Majesty. I would have described you so well and told her so much about your good qualities that she could not have resisted you. But why should that make you angry?
        - id: ch01-b24
          speaker: narrator
          text: Once Charming explained what he had meant, the King could find no cause for anger either. He understood that Charming had meant to praise him, not mock him. Then he turned and glared fiercely at the courtiers who had twisted his favorite's words.
        - id: ch01-b25
          speaker: narrator
          text: The King took Charming back to the palace and gave him an excellent supper. Then he told him that Goldilocks's refusal had not changed his love.
        - id: ch01-b26
          speaker: king
          text: I still love Pretty Goldilocks as much as ever, but I do not know how to change her mind. Will you go and try to persuade her to marry me?
        - id: ch01-b27
          speaker: charming
          text: I am ready to go, Your Majesty. I will leave tomorrow.
        - id: ch01-b28
          speaker: king
          text: Then you must wait while I arrange a grand escort for you.
        - id: ch01-b29
          speaker: narrator
          text: Charming said he needed nothing but a good horse. Delighted by his eagerness, the King gave him letters for the Princess and wished him a safe journey.
    - id: ch02
      title: Three Promises on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Charming set out alone on Monday morning with the King's letters in his pocket. As he rode, he thought of nothing but how to persuade Goldilocks to marry his master. He also carried a writing book. Whenever a happy thought came to him, he climbed down from his horse and sat beneath the trees. He wrote each idea into the speech he was preparing before he had time to forget it.
        - id: ch02-b02
          speaker: narrator
          text: One morning, he set out at the earliest light of dawn and rode across a broad meadow. A wonderful thought came to him, so he leaped down from his horse and sat beneath a willow beside a little river. He carefully wrote down the idea for his speech. When he finished, he looked around, pleased by the pretty place. Then he noticed a great golden carp lying on the grass, gasping for breath.
        - id: ch02-b03
          speaker: narrator
          text: She had jumped onto the bank while snapping at little flies, and now she was almost dead. Charming felt sorry for her. She would have made a fine dinner, but he gently lifted her and put her back in the river.
        - id: ch02-b04
          speaker: narrator
          text: The cool water revived Dame Carp. She sank joyfully to the bottom, then swam boldly back to the bank.
        - id: ch02-b05
          speaker: dame_carp
          text: Thank you for your kindness, Charming. You saved my life, and one day I will repay you.
        - id: ch02-b06
          speaker: narrator
          text: With that, she disappeared beneath the water. Charming was greatly surprised by her politeness.
        - id: ch02-b07
          speaker: narrator
          text: On another day, he saw a raven in terrible danger. An eagle was chasing the poor bird and would soon have eaten him. Charming quickly set an arrow to his bow and shot the eagle dead. The raven landed happily in a tree.
        - id: ch02-b08
          speaker: raven
          text: You were generous to save a poor raven, Charming. I will not forget it. Someday, I will repay you.
        - id: ch02-b09
          speaker: narrator
          text: Charming thought that was very kind of the raven, and continued on his way.
        - id: ch02-b10
          speaker: narrator
          text: Before sunrise on another morning, he entered a thick wood where the path was hidden in darkness. He heard an owl crying as though her heart would break.
        - id: ch02-b11
          speaker: charming
          text: Listen! That owl must be in trouble. I am sure she has been caught in a snare.
        - id: ch02-b12
          speaker: narrator
          text: He searched until he found a large net that bird catchers had spread the night before.
        - id: ch02-b13
          speaker: charming
          text: What a shame that people torment innocent creatures that have never harmed them!
        - id: ch02-b14
          speaker: narrator
          text: He took out his knife and cut through the cords. The owl flew into the darkness. Then, with a flicker of her wings, she turned and came back.
        - id: ch02-b15
          speaker: owl
          text: I need few words to tell you what you have done for me. I was trapped, and the bird catchers would have killed me within minutes. You saved me. I am grateful, and one day I will repay you.
        - id: ch02-b16
          speaker: narrator
          text: Those were the only important adventures Charming met along the road. He hurried on toward the palace of Princess Goldilocks.
    - id: ch03
      title: The Princess's Lost Ring
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Everything at Goldilocks's palace seemed delightful and magnificent to Charming. Diamonds lay about like ordinary pebbles. Wherever he looked, he saw gold and silver, beautiful clothes, sweetmeats, and every kind of pretty treasure. If the Princess agreed to leave all this and go with him to marry the King, Charming thought his master should count himself very lucky.
        - id: ch03-b02
          speaker: narrator
          text: Charming dressed with great care in rich brocade and scarlet-and-white plumes. He draped a splendid embroidered scarf over one shoulder and made himself look as bright and graceful as possible. Then he went to the palace door. In his arms he carried a tiny, pretty dog he had bought during his journey.
        - id: ch03-b03
          speaker: narrator
          text: The guards saluted him, and a messenger told the Princess that Charming had arrived as ambassador from the neighboring King.
        - id: ch03-b04
          speaker: princess_goldilocks
          text: Charming? That name sounds promising. I am sure he must be handsome and able to charm everyone.
        - id: ch03-b05
          speakers: [maid_1, maid_2]
          ensemble: duo
          text: Oh, he is, madam! We watched him from the attic window while we were spinning flax, and we could not look away until he was gone.
        - id: ch03-b06
          speaker: princess_goldilocks
          text: So that is how you amuse yourselves, staring at strangers through the window! Quickly, bring my blue satin embroidered dress and comb out my golden hair. Have fresh flower garlands made. Bring my high heels and my fan, and tell the servants to sweep the great hall and my throne. I want everyone to agree that I truly am Pretty Goldilocks.
        - id: ch03-b07
          speaker: narrator
          text: The maids rushed this way and that to make the Princess ready. In their hurry, they bumped heads and got in one another's way until Goldilocks thought they would never finish. At last, they led her into the gallery of mirrors, where she inspected herself and made sure nothing was missing. Then she climbed onto a throne made of gold, ebony, and ivory. Her ladies took up their guitars and began to sing softly while she waited.
        - id: ch03-b08
          speaker: narrator
          text: Charming entered. Goldilocks's beauty struck him with such wonder that for a moment he could not speak. Then he found his courage and gave the speech he had prepared. He ended by begging her not to send him home without her.
        - id: ch03-b09
          speaker: princess_goldilocks
          text: Sir Charming, your reasons are excellent, and I would rather oblige you than anyone. But a month ago, I was walking beside the river with my ladies. When I removed my glove, a ring slipped from my finger and rolled into the water. I valued it more than my kingdom. I was so upset that I vowed never to consider marriage unless the ambassador first returned my ring. You know what you must do. Even if you spoke for fifteen days and nights, you could not change my mind.
        - id: ch03-b10
          speaker: narrator
          text: Her answer astonished Charming. He bowed very low before her and offered her the embroidered scarf and the little dog, but she refused all presents and reminded him of her command.
        - id: ch03-b11
          speaker: narrator
          text: Charming returned to his rooms and went to bed without supper. His little dog, whose name was Frisk, could not eat either. He curled up close to his master while Charming sighed through the night.
        - id: ch03-b12
          speaker: charming
          text: How can I find a ring that fell into the river a month ago? There is no use even trying. The Princess must have chosen this task because she knew it was impossible.
          emotion: sad
        - id: ch03-b13
          speaker: frisk
          text: Dear master, do not give up. Your luck may change. You are too good to remain unhappy. Let us go to the river as soon as morning comes.
        - id: ch03-b14
          speaker: narrator
          text: Charming only patted him twice and said nothing. Soon he fell asleep.
        - id: ch03-b15
          speaker: narrator
          text: At the first glimmer of dawn, Frisk jumped around until Charming woke. Together they crossed the garden and went down to the river. They wandered along the bank while Charming sadly imagined returning without success. Then a voice called his name.
        - id: ch03-b16
          speaker: dame_carp
          text: Charming! Charming!
        - id: ch03-b17
          speaker: narrator
          text: He looked everywhere, but saw no one and thought he must be dreaming. He walked on. Again the voice called him.
        - id: ch03-b18
          speaker: charming
          text: Who is calling me?
        - id: ch03-b19
          speaker: frisk
          text: I can see a golden carp swimming toward us!
        - id: ch03-b20
          speaker: narrator
          text: It was the great carp Charming had rescued.
        - id: ch03-b21
          speaker: dame_carp
          text: You saved my life beside the willow tree, and I promised to repay you. Here is Princess Goldilocks's ring.
        - id: ch03-b22
          speaker: narrator
          text: Charming reached down and took the ring from Dame Carp's mouth. He thanked her a thousand times for keeping her promise. Then he and tiny Frisk hurried straight from the river to the palace. A servant went to Goldilocks and told her that Charming was asking to see her.
        - id: ch03-b23
          speaker: princess_goldilocks
          text: Ah, poor man. He must have come to say farewell because my task was impossible.
        - id: ch03-b24
          speaker: narrator
          text: Charming entered and held out the ring.
        - id: ch03-b25
          speaker: charming
          text: Madam, I have done as you asked. Will you marry my master now?
        - id: ch03-b26
          speaker: narrator
          text: Goldilocks stared at her ring, returned to her without a scratch. She was so amazed that she wondered whether she was dreaming.
        - id: ch03-b27
          speaker: princess_goldilocks
          text: Truly, Charming, some fairy must favor you. Otherwise, you could never have found it.
          emotion: surprised
        - id: ch03-b28
          speaker: charming
          text: Madam, nothing helped me except my wish to obey you.
        - id: ch03-b29
          speaker: princess_goldilocks
          text: Since you are so kind, perhaps you will serve me once more. I will not marry until it is done. A prince named Galifron lives nearby. He wanted to marry me, and when I refused, he threatened to destroy my country. But how could I accept him? He is a hideous giant as tall as a tower. He eats people the way a monkey eats chestnuts, and his voice is loud enough to deafen anyone who hears it. He still hunts and kills my subjects. You must kill him and bring me his head before I consider your proposal.
    - id: ch04
      title: The Giant Galifron
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: This new command dismayed Charming, but he gave his answer.
        - id: ch04-b02
          speaker: charming
          text: Very well, Princess. I will fight Galifron. I believe he will kill me, but at least I will die defending you.
        - id: ch04-b03
          speaker: narrator
          text: That frightened Goldilocks. She tried every argument she could think of to stop him from fighting the giant, but Charming would not be turned aside. He armed himself, took Frisk with him, mounted his horse, and rode toward Galifron's country.
        - id: ch04-b04
          speaker: narrator
          text: Everyone Charming met told him how terrible Galifron was. No one dared go near the giant or his country. Each new warning was worse than the last, and the more Charming heard, the more afraid he became. Still, he kept riding toward the danger.
        - id: ch04-b05
          speaker: frisk
          text: Dear master, while you fight him, I will bite his heels. When he bends down to see what is hurting him, you can kill him.
        - id: ch04-b06
          speaker: narrator
          text: Charming praised the little dog's plan, though he knew it would not help very much.
        - id: ch04-b07
          speaker: narrator
          text: At last, they approached Galifron's castle. Bones covered every path that led to it. Before long, the giant himself appeared. His head rose above the tallest trees, and he sang in a dreadful voice.
        - id: ch04-b08
          speaker: galifron
          text: Bring out your little boys and girls. Do not stop to curl their hair. I mean to eat so many that I will never notice whether they have curls or not.
        - id: ch04-b09
          speaker: narrator
          text: Charming answered as loudly as he could, singing to the same tune.
        - id: ch04-b10
          speaker: charming
          text: Come out and face the valiant Charming. You do not frighten him at all. Though he may not be very tall, he is tall enough to make you fall.
        - id: ch04-b11
          speaker: narrator
          text: The rhyme was not very good, but Charming had made it up in a moment while horribly frightened, so it was a wonder that it was not worse.
        - id: ch04-b12
          speaker: narrator
          text: Galifron looked around and saw Charming waiting with his sword. The challenge sent the giant into a fury. He swung his enormous iron club. One blow would certainly have killed Charming if it had landed.
        - id: ch04-b13
          speaker: narrator
          text: At that instant, the raven landed on Galifron's head. He pecked with his strong beak and beat his broad wings across the giant's eyes. The attack confused and blinded Galifron so completely that every blow of his club struck only empty air. Charming saw his chance. He rushed in and struck several times with his sharp sword. The enormous giant crashed to the ground, and before he understood what had happened, Charming cut off his head.
        - id: ch04-b14
          speaker: narrator
          text: From a nearby tree, the raven called down to him.
        - id: ch04-b15
          speaker: raven
          text: You see, I did not forget how you saved me from the eagle. Today I have kept my promise and repaid you.
        - id: ch04-b16
          speaker: charming
          text: I owe you far more gratitude than you ever owed me.
        - id: ch04-b17
          speaker: narrator
          text: Charming mounted his horse and rode away carrying Galifron's head.
        - id: ch04-b18
          speaker: narrator
          text: When he reached the city, people ran after him in crowds and shouted his victory.
        - id: ch04-b19
          speakers: [citizen_1, citizen_2]
          ensemble: duo
          text: Look! Brave Charming has killed the giant!
          emotion: happy
        - id: ch04-b20
          speaker: narrator
          text: The crowd's cries reached the Princess, but she was afraid to ask what had happened. She feared someone might tell her that Charming had been killed. Very soon, he entered the palace carrying the giant's head. Though it could no longer harm her, the sight of it still terrified Goldilocks.
        - id: ch04-b21
          speaker: charming
          text: Princess, I have killed your enemy. Will you agree now to marry my master?
        - id: ch04-b22
          speaker: princess_goldilocks
          text: Oh, no. Not until you bring me water from the Gloomy Cavern.
    - id: ch05
      title: The Water of Health and Beauty
      blocks:
        - id: ch05-b01
          speaker: princess_goldilocks
          text: A deep cave lies not far from here. Two dragons with fiery eyes guard its entrance, and they let no one pass. Inside, you will find an enormous pit. You must climb down into it, though it is filled with toads and snakes. At the very bottom is another little cave, and there you will find the Fountain of Health and Beauty. I must have some of its water. Everything it touches becomes wonderful. Beauty never fades, ugliness turns lovely, the young never grow old, and the old become young again. I cannot leave my kingdom without it.
        - id: ch05-b02
          speaker: charming
          text: Princess, you could never need such water. But I see that I am an unhappy ambassador whose death you want. Wherever you send me, I will go, even though I know I will never return.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: Goldilocks showed no sign of changing her mind. Charming and Frisk set off for the Gloomy Cavern.
        - id: ch05-b04
          speaker: narrator
          text: Travelers along the road watched them pass with pity.
        - id: ch05-b05
          speaker: traveler_1
          text: What a waste of a fine young life! He is going to that cavern alone, when even a hundred men could not succeed.
        - id: ch05-b06
          speaker: traveler_2
          text: Why does the Princess demand impossible things from him?
        - id: ch05-b07
          speaker: narrator
          text: Charming made no reply, but he was deeply sad. Near the top of a hill, he dismounted and let his horse graze while Frisk chased flies.
        - id: ch05-b08
          speaker: narrator
          text: Charming knew the cavern could not be far away. He looked around and saw a hideous black rock with thick smoke pouring from it. A moment later, one of the guardian dragons appeared through the smoke. Fire blazed from its mouth and eyes. Its body was yellow and green, its claws were scarlet, and its tail was so long that it lay in a hundred coils. Frisk was terrified by the sight and could not decide where to hide.
        - id: ch05-b09
          speaker: narrator
          text: Charming was determined to bring back the water or die. He drew his sword and took out the crystal flask Goldilocks had given him.
        - id: ch05-b10
          speaker: charming
          text: I am sure I will not return from this task. When I die, go tell the Princess that her command cost me my life. Then find my King and tell him everything that happened to us.
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: As he spoke, a voice called his name.
        - id: ch05-b12
          speaker: owl
          text: Charming! Charming!
        - id: ch05-b13
          speaker: charming
          text: Who is calling me?
        - id: ch05-b14
          speaker: narrator
          text: He saw an owl sitting inside a hollow tree.
        - id: ch05-b15
          speaker: owl
          text: You saved my life when I was trapped in the net. Now I can repay you. Give me the flask. I know every path through the Gloomy Cavern, and I can fill it at the Fountain of Beauty.
        - id: ch05-b16
          speaker: narrator
          text: Charming was only too glad to hand her the flask. The owl flew past the dragon and into the cavern without being noticed. She knew all its dark passages and disappeared from sight. After some time, she returned safely with the crystal flask filled to the very brim with sparkling water.
        - id: ch05-b17
          speaker: narrator
          text: Charming thanked the owl with all his heart and hurried joyfully back to the city. He went straight to the palace and placed the flask in Goldilocks's hands. At last, the Princess had no more objections.
        - id: ch05-b18
          speaker: princess_goldilocks
          text: Thank you, Charming. I will prepare to leave.
        - id: ch05-b19
          speaker: narrator
          text: Before long, Goldilocks and Charming began the journey together. She found him such delightful company that sometimes she wondered aloud why they should go on.
        - id: ch05-b20
          speaker: princess_goldilocks
          text: Why did we not stay in my country? I could have made you king, and we could have been so happy together.
        - id: ch05-b21
          speaker: charming
          text: I could never betray my master that way, not for a kingdom and not even to please you, though I think you are as beautiful as the sun.
    - id: ch06
      title: A Faithful Servant's Reward
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last, they reached the King's great city. The King himself came out to meet Goldilocks and brought magnificent presents to welcome her. Soon the marriage was celebrated, and the whole city joined in the great rejoicing.
        - id: ch06-b02
          speaker: narrator
          text: Yet Goldilocks had grown so fond of Charming that she was unhappy whenever he was away, and she constantly praised him to the King.
        - id: ch06-b03
          speaker: princess_goldilocks
          text: I would never have come here without Charming. You should be deeply grateful to him. He accomplished impossible tasks and even brought me water from the Fountain of Beauty. Now I can never grow old, and I will become prettier every year.
        - id: ch06-b04
          speaker: narrator
          text: The envious courtiers saw another chance to poison the King's thoughts.
        - id: ch06-b05
          speaker: courtier_1
          text: It is remarkable that you are not jealous, Your Majesty. The Queen acts as if no one in the world can compare with Charming.
        - id: ch06-b06
          speaker: courtier_2
          text: Any ambassador you chose could have done exactly the same things.
        - id: ch06-b07
          speaker: king
          text: Now that I think about it, you are right. Chain Charming by his hands and feet, and throw him into the tower.
          emotion: angry
        - id: ch06-b08
          speaker: narrator
          text: So Charming was seized once more. As his reward for serving the King faithfully, he was locked in the tower. He saw no one but the jailer, who brought him a piece of black bread and a pitcher of water each day.
        - id: ch06-b09
          speaker: narrator
          text: Faithful little Frisk came to comfort him and carried him all the news from the palace.
        - id: ch06-b10
          speaker: narrator
          text: When Goldilocks heard what had happened, she ran to the King and threw herself at his feet. She begged him to set Charming free. But the more she cried, the angrier the King became. At last, she understood that nothing she said would move him. She stopped pleading, though Charming's imprisonment made her very sad.
        - id: ch06-b11
          speaker: narrator
          text: Then the King began to wonder whether he was handsome enough to please Goldilocks. He decided to wash his face with water from the Fountain of Beauty. The crystal flask stood on a shelf in the Queen's room, where she had placed it so she could look at it often.
        - id: ch06-b12
          speaker: narrator
          text: But one of Goldilocks's ladies had chased a spider near the shelf and accidentally knocked the flask to the floor. It shattered, and every drop of the precious water spilled. The lady did not know what to do. She quickly swept away the broken crystal, then remembered seeing another flask of exactly the same shape in the King's room. That flask was also filled with sparkling water. Without telling anyone what had happened, she fetched it and put it on the Queen's shelf.
        - id: ch06-b13
          speaker: narrator
          text: That second flask held a very different liquid. The kingdom used it to get rid of troublesome people. Instead of cutting off their heads, officials washed their faces with this water. They fell asleep at once and never woke again.
        - id: ch06-b14
          speaker: narrator
          text: The King believed he had found the Fountain water. Hoping to become more handsome, he sprinkled the liquid over his face. At once, he fell asleep, and no one could wake him.
    - id: ch07
      title: The Crown of Charming
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Frisk was the first to hear that the King had died. He raced to the tower and told Charming, who sent him back with a message for the Princess.
        - id: ch07-b02
          speaker: charming
          text: Please ask the Princess not to forget her poor prisoner.
        - id: ch07-b03
          speaker: narrator
          text: The whole palace was in confusion over the King's death, but tiny Frisk slipped through the crowd until he reached Goldilocks.
        - id: ch07-b04
          speaker: frisk
          text: Madam, please do not forget poor Charming.
        - id: ch07-b05
          speaker: narrator
          text: Goldilocks remembered everything Charming had done for her and how faithfully he had served. Without saying a word to anyone, she went straight to the tower. With her own hands, she removed the chains from his wrists and ankles. Then she placed a golden crown on his head and laid the royal mantle over his shoulders.
        - id: ch07-b06
          speaker: princess_goldilocks
          text: Come with me, faithful Charming. I make you king, and I will take you as my husband.
        - id: ch07-b07
          speaker: narrator
          text: Free and happy once more, Charming fell at her feet and thanked her for her gracious words.
        - id: ch07-b08
          speaker: narrator
          text: Everyone rejoiced that Charming would be king. The wedding took place at once, and it was the prettiest anyone could imagine.
        - id: ch07-b09
          speaker: narrator
          text: Prince Charming and Princess Goldilocks lived happily ever after.
