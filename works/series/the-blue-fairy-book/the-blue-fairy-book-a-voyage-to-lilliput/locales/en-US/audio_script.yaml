  chapters:
    - id: ch01
      title: Chapter I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: My father owned a small estate in Nottinghamshire, and I was the third of his four sons. He sent me to Cambridge when I was fourteen. After three years there, I became an apprentice to Mr. Bates, a well-known London surgeon. Whenever my father could spare me a little money, I used it to study navigation and other useful arts for travelers. I had always believed that travel would one day be my fortune.
        - id: ch01-b02
          speaker: narrator
          text: Three years after I left Mr. Bates, that good master recommended me as surgeon aboard the Swallow. I sailed on her for three years. When I returned, I settled in London, rented part of a small house, and married Mary Burton, the daughter of Edmund Burton, a hosier.
        - id: ch01-b03
          speaker: narrator
          text: Two years later, Mr. Bates died. I had few friends, and my business began to fail, so I went back to sea. After several voyages, Captain W. Pritchard offered me a place on the Antelope for a voyage to the South Sea. We left Bristol on May 4, 1699, and at first everything went well.
        - id: ch01-b04
          speaker: narrator
          text: On our way to the East Indies, a violent storm drove us northwest of Van Diemen's Land. Twelve sailors died from hard labor and bad food, and everyone else grew terribly weak. In hazy weather on November 5, the crew saw a rock only a hundred and twenty yards away. The wind hurled us straight onto it, and the ship split apart.
        - id: ch01-b05
          speaker: narrator
          text: Six of us lowered a boat and escaped the wreck. We rowed about three leagues, until we could do no more, and then gave ourselves up to the waves. Half an hour later, a sudden squall overturned us. I never learned what became of the others in the boat, on the rock, or aboard the ship. I could only believe that all of them were lost.
        - id: ch01-b06
          speaker: narrator
          text: I swam wherever wind and tide carried me. Just when I had no strength left, my feet touched bottom. The storm had eased by then. At about eight that evening, I reached the shore and walked nearly half a mile inland. I saw no house, light, or any other sign that people lived there. I was worn out, and the heat made me terribly sleepy. I lay down on grass that was very short and soft. For about nine hours, I slept more soundly than ever before.
        - id: ch01-b07
          speaker: narrator
          text: Daylight had just come when I woke. I tried to rise, but I could not move. I was flat on my back, with both arms and both legs fastened to the ground. My long, thick hair had been tied down too. All I could see was the sky. The sun grew hot, the light hurt my eyes, and confused noises sounded all around me.
        - id: ch01-b08
          speaker: narrator
          text: Soon I felt something alive climbing my left leg. It crossed my chest and came almost to my chin. I bent my eyes downward and saw a human creature less than six inches tall. He carried a bow and arrow, with a quiver on his back. At least forty more were following him.
        - id: ch01-b09
          speaker: narrator
          text: I was so astonished that I roared louder than I knew I could. Every little man fled in terror. Some leaped from my body so hastily that the fall injured them. Before long, though, they gathered their courage and returned. One climbed close enough to see my whole face. He stared at me and lifted both hands in wonder.
        - id: ch01-b10
          speaker: narrator
          text: I had been lying in great discomfort all this time. At last I struggled hard enough to snap the strings around my left arm and wrench it free. Then I pulled against the cords in my hair. The effort caused terrible pain, but it loosened them enough for me to turn my head about two inches. Before I could seize anyone, the little people ran off again. A great shout rose from the crowd. In an instant, more than a hundred arrows struck my left hand, each one pricking me like a needle. They fired another shower high into the air. Some of those arrows fell toward my face, and I covered it at once with my free hand.
        - id: ch01-b11
          speaker: narrator
          text: When the arrows stopped, I groaned with pain. I tried once more to free myself, and they answered with an even larger flight. Some also thrust spears at me, but my leather jacket could not be pierced. I decided it was wisest to lie still until night. With one hand already free, I could then release myself, and I felt sure I could face their largest army if every soldier was as small as the first man I had seen.
        - id: ch01-b12
          speaker: narrator
          text: Once I lay quiet, no more arrows came. The growing noise told me that the crowd was getting larger. For more than an hour, I heard knocking about four yards away, as if people were building something. Turning as far as the cords allowed, I saw a platform about a foot and a half high, with ladders leading up to it.
        - id: ch01-b13
          speaker: narrator
          text: A person who seemed to be of high rank climbed onto the platform and gave a long speech. I understood none of his words. Even so, his voice and gestures made some things clear. At moments he seemed to threaten me. Then his manner changed, and he spoke as if he pitied me or meant to treat me kindly. I answered with only a few words and made my manner as humble as possible. By then I was nearly starving. I kept putting a finger to my mouth, impatiently trying to make him understand that I needed food.
        - id: ch01-b14
          speaker: narrator
          text: He understood. At his command, ladders were placed against my sides. More than a hundred people climbed onto me and walked toward my mouth with baskets of food, sent by the King as soon as he heard about me. They brought legs and shoulders that tasted like mutton, though each was smaller than a lark's wing. I ate two or three at a time, along with three tiny loaves at once. They kept feeding me as quickly as they could, amazed at every mouthful.
        - id: ch01-b15
          speaker: narrator
          text: I signaled for a drink. Knowing that a little cup would never do, those clever people hoisted one of their largest barrels, rolled it to my hand, and knocked out the top. It held less than half a pint, so I emptied it in one swallow. I drank a second barrel and asked for more, but they had nothing left.
        - id: ch01-b16
          speaker: narrator
          text: I could hardly believe the courage of these tiny mortals. With one of my hands loose, they still dared to climb and walk over my enormous body without trembling.
        - id: ch01-b17
          speaker: narrator
          text: After a while, an important representative of his Imperial Majesty appeared. He climbed my right leg and came toward my face with about twelve attendants. For ten minutes he spoke and repeatedly pointed ahead. I later learned that he was pointing toward the capital, half a mile away, where the Emperor had ordered them to take me.
        - id: ch01-b18
          speaker: narrator
          text: I raised my free hand and moved it toward the one still tied down. I had to pass it over the official and his attendants, so I held it high above their heads to avoid hurting anyone. My meaning was that I wanted them to release me. He seemed to understand well enough, but he shook his head. With other signs, he promised that I would have plenty to eat and drink, and that they would treat me very well.
        - id: ch01-b19
          speaker: narrator
          text: I considered escaping again. Then I felt the burning arrow wounds on my blistered face and hands, and saw how greatly their numbers had increased. I gave them signs that they might do as they wished with me. They spread a sweet-smelling ointment over my wounds, and within minutes the pain was gone. Relief from pain and hunger made me sleepy. I fell asleep right away and slept for about eight hours. Later I learned that, by the Emperor's order, the physicians had mixed a sleeping potion into the wine.
        - id: ch01-b20
          speaker: narrator
          text: The Emperor had heard about me soon after I was found asleep on the ground. He ordered his people to bind me during the night, provide food and drink, and build a machine to carry me to the capital. Five hundred carpenters and engineers made a wooden frame seven feet long and four feet wide. It stood three inches above the ground and rolled on twenty-two wheels.
        - id: ch01-b21
          speaker: narrator
          text: Getting me onto it was the hard part. The workers planted eighty poles in the ground. They tied broad bandages around my neck, hands, body, and legs, then fastened very strong cords to those bands. Pulleys at the tops of the poles carried the cords. Nine hundred of their strongest men pulled together. In less than three hours, they raised my whole body, swung me over the wooden frame, lowered me onto it, and tied me down. Then fifteen hundred of the Emperor's largest horses were harnessed to the machine. Even those great horses stood only about four and a half inches high. They began hauling me toward the city while I remained in a deep sleep. I did not wake until the journey had already lasted four hours.
        - id: ch01-b22
          speaker: narrator
          text: The Emperor and his entire Court came out when we reached the capital, though his officials would not let him risk climbing onto my body. The carriage stopped beside an ancient temple, believed to be the largest in the kingdom. That temple was to be my home. Its great gate was wide enough for me to crawl through.
        - id: ch01-b23
          speaker: narrator
          text: Near the gate, the workers locked ninety-one chains to my left leg with thirty-six padlocks. Each chain was no larger than one that might hang from a lady's watch. Once they were sure I could not break free, they cut away the strings around the rest of my body.
        - id: ch01-b24
          speaker: narrator
          text: I stood up, feeling as miserable as I ever had in my life. The people had never seen me rise or walk before. Their cries and astonishment were beyond description. The chains on my left leg were about two yards long. They gave me enough room to walk backward and forward in a half circle. I could also crawl through the great gate and lie at full length inside the temple.
        - id: ch01-b25
          speaker: narrator
          text: The Emperor came forward among his splendidly dressed courtiers and examined me with wonder, staying beyond the reach of my chain. He stood about the width of my fingernail taller than anyone else at Court, enough by itself to make him seem awe-inspiring. He was graceful and majestic. I lay on my side so my face would be level with his, while he stood three yards away.
        - id: ch01-b26
          speaker: narrator
          text: I later held him in my hand many times, so I know these details are exact. His clothing was simple, but he wore a light gold helmet with jewels and a plume. He kept his sword drawn in case I escaped. It was nearly three inches long, with a gold hilt set with diamonds. His voice was high but very clear. He spoke to me many times, and I replied, but neither of us understood a single word.
    - id: ch02
      title: Chapter II
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After about two hours, the Court went away. A strong guard remained to hold back the crowd. Some people had been bold enough to shoot arrows at me while I sat by the door of my temple. The colonel seized six of them and delivered them to me with their hands bound.
        - id: ch02-b02
          speaker: narrator
          text: I put five into my coat pocket. I held the sixth and made a face as if I meant to eat him alive. The poor man screamed, and the colonel and his officers were deeply alarmed, especially when I drew my penknife. Then I showed them my purpose. I cut the prisoner's bonds, set him gently on the ground, and watched him run away. I released the other five in the same way, one by one. Soldiers and townspeople alike were delighted by this act of kindness.
        - id: ch02-b03
          speaker: narrator
          text: Toward evening, I crawled into my house with some difficulty and lay down on the bare ground. That remained my bed for a fortnight. At last, the Lilliputians brought together six hundred beds of their ordinary size and made a single bed large enough for me.
        - id: ch02-b04
          speaker: narrator
          text: Six hundred servants were appointed to attend me. Three hundred tailors worked together to make me a suit of clothes. The Emperor also selected six of the greatest scholars in his realm to teach me their language. I learned quickly enough that before long, I could manage a rough conversation with him. He often honored me by coming to the temple himself.
        - id: ch02-b05
          speaker: narrator
          text: The first words I learned were a request for my liberty. I repeated it every day on my knees.
        - id: ch02-b06
          speaker: emperor_of_lilliput
          text: Your freedom must come in time. First you must promise peace with me and with my kingdom.
        - id: ch02-b07
          speaker: narrator
          text: He also told me that two officers had to search me under the laws of Lilliput. Since they could not do it without my help, he would trust them in my hands. Anything they took would be returned when I left the country. I lifted the officers and placed them in my coat pockets. Carrying pen, ink, and paper, they made a careful list of everything they found. Later, I translated their report into English.
        - id: ch02-b08
          speaker: search_officer
          text: In the Man-Mountain's right coat pocket, we found one great piece of coarse cloth. It is large enough to cover the carpet in Your Majesty's chief room of state. In his left pocket, we saw a huge silver chest with a silver cover that neither of us could lift. We asked him to open it. One of us stepped inside and sank to mid-leg in a kind of dust. When some of that dust blew into our faces, it sent both of us into a violent fit of sneezing.
        - id: ch02-b09
          speaker: search_officer
          text: In his right waistcoat pocket, we found many thin white objects folded together. Each was about the size of three men. A strong cable held them, and black marks covered them. We humbly believe they are writings. In the left pocket, we found an engine with twenty long poles extending from its back. We suppose the Man-Mountain uses it to comb his head.
        - id: ch02-b10
          speaker: search_officer
          text: In the smaller pocket on his right side were many round, flat pieces of red and white metal in different sizes. Some white pieces, which seemed to be silver, were so large and heavy that my companion and I could barely lift them.
        - id: ch02-b11
          speaker: search_officer
          text: From another pocket hung a huge silver chain attached to a marvelous engine. It was a globe, half silver and half made of a transparent substance. Through the clear side, we saw strange figures. We thought we could touch them, but a shining surface stopped our fingers. The engine made an endless noise like a water mill. We judge that it is either an unknown animal or the god he worships. The latter seems more likely, because he told us he seldom does anything without consulting it.
        - id: ch02-b12
          speaker: search_officer
          text: This is the list of what we found on the body of the Man-Mountain, who treated us with great courtesy.
        - id: ch02-b13
          speaker: narrator
          text: One private pocket escaped their search. It held my spectacles and a small spyglass. Since those things meant nothing to the Emperor, I did not feel honor-bound to reveal them.
    - id: ch03
      title: Chapter III
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: My gentleness and good conduct slowly won over the Emperor, his Court, and people throughout the country. I began to hope that freedom would not be far away. Day by day, the Lilliputians grew less afraid that I might harm them. Sometimes I lay flat on the ground and held out one hand while five or six people danced on my palm. In time, even the boys and girls became bold enough to climb into my hair and play hide-and-seek there.
        - id: ch03-b02
          speaker: narrator
          text: The army horses and the horses in the royal stables also stopped shying from me, because they were led past me every day. One of the Emperor's huntsmen even made his large horse leap over my whole foot, shoe and all.
        - id: ch03-b03
          speaker: narrator
          text: One day, I prepared an unusual amusement for the Emperor. I planted nine sticks firmly in the ground to form a square. At each corner, I fixed another stick sideways, about two feet above the earth. Then I stretched my handkerchief tightly over the nine upright sticks until it was as firm as a drumhead.
        - id: ch03-b04
          speaker: narrator
          text: With the Emperor's approval, I lifted twenty-four of his best cavalrymen onto this little plain, along with their officers. They formed two companies, fired blunt arrows, drew their swords, chased and retreated, and displayed the finest military discipline I had ever seen. The four side rails kept horses and riders from falling.
        - id: ch03-b05
          speaker: narrator
          text: The Emperor enjoyed it so much that he ordered the performance repeated for several days. He even persuaded the Empress to sit in her chair while I held her within two yards of the stage, where she could see everything.
        - id: ch03-b06
          speaker: narrator
          text: Fortunately, only one accident occurred. A spirited horse struck the handkerchief with its hoof, tore a hole, and toppled over with its rider. I reached them at once and lifted both to safety. Then I covered the opening with one hand while I used the other to remove the soldiers and horses, one after another, just as I had placed them there. The rider escaped without injury, though the horse strained its shoulder. I repaired my handkerchief as well as I could, but after that I would not trust its strength in any performance so dangerous.
        - id: ch03-b07
          speaker: narrator
          text: I sent the Emperor so many petitions that he finally raised my freedom before the full council. No one opposed it except Skyresh Bolgolam, the admiral, who had become my deadly enemy without any cause. In the end he agreed, but he took charge of writing the terms for my release.
        - id: ch03-b08
          speaker: narrator
          text: When the terms had been read, I had to swear by the custom of Lilliput. I held my right foot in my left hand. Then I placed the middle finger of my right hand on the crown of my head and my thumb on the top of my right ear. Here is my English translation of the conditions.
        - id: ch03-b09
          speaker: imperial_herald
          text: Golbaste Mamarem Evlame Gurdile Shefin Mully Ully Gue, Most Mighty Emperor of Lilliput, delight and terror of the universe. His lands reach to the ends of the globe. He is monarch of all monarchs, taller than the sons of men. His feet press down to the center of the earth, and his head strikes the sun. At his nod, the princes of the world shake their knees. He is pleasant as spring, comfortable as summer, fruitful as autumn, and dreadful as winter. His Most Sublime Majesty gives these articles to the Man-Mountain, newly arrived in our celestial dominions. By solemn oath, the Man-Mountain must obey them.
        - id: ch03-b10
          speaker: imperial_herald
          text: First, the Man-Mountain may not leave our lands without a license under the great seal. Second, he may not enter our capital unless he receives a direct order. The inhabitants must first have two hours of warning so they can remain indoors.
        - id: ch03-b11
          speaker: imperial_herald
          text: Third, the Man-Mountain must walk only on our principal high roads. He may not walk or lie down in any meadow or field of grain. Fourth, while using those roads, he must take the greatest care not to step on any of our loving subjects, their horses, or their carriages. He must not pick up a subject without that person's consent.
        - id: ch03-b12
          speaker: imperial_herald
          text: Fifth, when an express messenger needs extraordinary speed, the Man-Mountain must carry the messenger and horse in his pocket for a journey of six days. If required, he must return that messenger safely to the imperial presence.
        - id: ch03-b13
          speaker: imperial_herald
          text: Sixth, he must become our ally against our enemies on the island of Blefuscu. He must do his utmost to destroy their fleet, which is now preparing to invade us.
        - id: ch03-b14
          speaker: imperial_herald
          text: Last, after swearing to obey all these articles, the Man-Mountain will receive each day enough food and drink to support one thousand seven hundred and twenty-four of our subjects. He will have free access to our royal person and receive other signs of our favor. Given at our palace at Belfaburac, on the twelfth day of the ninety-first moon of our reign.
        - id: ch03-b15
          speaker: narrator
          text: I gladly swore to these conditions. My chains were unlocked at once, and I was completely free.
        - id: ch03-b16
          speaker: narrator
          text: About two weeks later, Reldresal, the Emperor's secretary for private affairs, came to my house with only one servant. He left his coach at a distance and asked for an hour of my time. I offered to lie down so he could reach my ear, but he preferred to sit in my hand while we talked. He began by congratulating me on my freedom. Then he admitted that the troubles at Court might have helped me gain it so quickly.
        - id: ch03-b17
          speaker: reldresal
          text: Our empire may look prosperous to foreign eyes, but we are in grave danger of an invasion from Blefuscu. It is the other great empire in the universe, nearly as large and powerful as Lilliput. You have told us there are more kingdoms in the world, inhabited by people as large as you. Our philosophers are very doubtful. They believe you probably fell from the moon or one of the stars. After all, only a hundred creatures of your size would soon consume every piece of fruit and every animal in the Emperor's lands. There is another reason for their doubt. Our written histories reach back six thousand moons, yet they name no regions beyond the two mighty empires of Lilliput and Blefuscu.
        - id: ch03-b18
          speaker: reldresal
          text: Those two empires are trapped in a bitter war, and it began with an egg. Everyone agrees that eggs were first broken at the larger end. But when our present Emperor's grandfather was a boy, he cut his finger while opening an egg in the old way. His father then made a law ordering every subject to break eggs at the smaller end.
        - id: ch03-b19
          speaker: reldresal
          text: The people hated that law. It caused six rebellions. One emperor lost his life, and another lost his crown. By our count, eleven hundred people have suffered rather than open their eggs at the small end. The Bigendian rebels receive help from the Emperor of Blefuscu, and they always flee to his Court for safety.
        - id: ch03-b20
          speaker: reldresal
          text: Because of this, our empires have fought a bloody war for thirty-six moons. Now the Blefuscudians have prepared a great fleet and are about to invade us. His Imperial Majesty has great faith in your courage and strength, and he commanded me to explain our danger to you.
        - id: ch03-b21
          speaker: narrator
          text: I asked Reldresal to give the Emperor my humble duty and tell him that I was ready to risk my life defending Lilliput against any invader.
    - id: ch04
      title: Chapter IV
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before long, I told the Emperor my plan for taking the whole enemy fleet. Blefuscu is an island separated from Lilliput by a channel eight hundred yards wide. Experienced sailors told me that at high tide, the deepest part measured seventy glumguffs, or about six European feet.
        - id: ch04-b02
          speaker: narrator
          text: I went to the coast and lay behind a small hill. Through my spyglass, I saw the Blefuscudian fleet at anchor. There were about fifty warships, with other vessels nearby. I returned home and ordered a large supply of the strongest cables and iron bars. To me, each cable was only as thick as packing thread, and each bar was about the size of a knitting needle.
        - id: ch04-b03
          speaker: narrator
          text: I braided each cable threefold to make it stronger. For the same reason, I twisted the iron bars together in groups of three and bent the ends of each group into a hook. In this way, I made fifty strong hooks and fixed each one to a cable. Then I returned to the shore. About half an hour before high tide, I removed my coat, shoes, and stockings. Wearing only my leather jacket over the rest of my clothes, I walked into the sea.
        - id: ch04-b04
          speaker: narrator
          text: I waded as quickly as possible. For about thirty yards in the middle, I had to swim. In less than half an hour, I reached the fleet. At the sight of me, the enemy sailors abandoned their ships and swam ashore. There must have been at least thirty thousand of them.
        - id: ch04-b05
          speaker: narrator
          text: I fastened a hook through the hole at the prow of each warship. When all fifty were attached, I gathered the loose ends and tied the cords into one great knot. The enemy kept firing from the shore. Several thousand arrows flew toward me, and many lodged in my hands and face. More than the pain, I feared losing my eyes. Suddenly I remembered the spectacles that had escaped the Emperor's searchers. I took them from my hidden pocket and fastened them firmly across my nose. With my eyes protected, I continued the work in spite of the arrows. Many struck directly against the lenses. They could do no more than jolt my spectacles slightly out of place.
        - id: ch04-b06
          speaker: narrator
          text: I gripped the great knot and pulled. Not one ship moved. Their anchors still held them fast. The boldest part of my plan remained. I dropped the knot, took out my knife, and cut every anchor cable. More than two hundred arrows struck my face and hands while I worked. Then I picked up the joined cords again and easily drew fifty of the enemy's largest warships behind me.
        - id: ch04-b07
          speaker: narrator
          text: When the Blefuscudians saw their fleet moving in a line with me at the front, they gave a scream of grief and despair beyond anything I can describe. Once I was out of range, I stopped to pull the arrows from my face and hands. I rubbed my wounds with the same ointment that had helped me when I first arrived. Then I removed my spectacles and waited about an hour for the tide to fall before wading toward Lilliput's royal port.
        - id: ch04-b08
          speaker: narrator
          text: The Emperor and his whole Court waited on the shore. They saw the ships advancing in a broad half-moon, but the water reached my neck and hid me from view. The Emperor believed I had drowned and that an enemy fleet was sailing straight toward him. With every step, however, the channel grew shallower. Soon I was close enough to be heard. I raised the cable that held the captured ships and shouted.
        - id: ch04-b09
          speaker: narrator
          text: Long live the mighty Emperor of Lilliput!
        - id: ch04-b10
          speaker: narrator
          text: The Emperor welcomed me ashore with the greatest joy. On the spot, he made me a Nardal, the highest title of honor in Lilliput.
        - id: ch04-b11
          speaker: narrator
          text: His Majesty soon asked me to bring the rest of Blefuscu's ships into his ports. He dreamed of conquering the whole empire, ruling it alone, killing the Bigendian exiles, and forcing everyone to break eggs at the smaller end. I told him plainly that I would never help enslave a free and courageous people. The wisest ministers agreed with me, but my refusal stood directly against the Emperor's ambition. He never forgave it. From that moment, he and my enemies among the ministers began a plot that nearly destroyed me.
        - id: ch04-b12
          speaker: narrator
          text: About three weeks after I captured the fleet, ambassadors arrived from Blefuscu with humble offers of peace. The two empires soon agreed on terms very favorable to the Emperor of Lilliput. Six ambassadors came with a magnificent company of about five hundred attendants.
        - id: ch04-b13
          speaker: narrator
          text: They had privately heard that I had spoken for their people, so they visited me. After praising my courage and generosity, they invited me to Blefuscu in their Emperor's name. I asked them to carry my humble respects to their master and said I meant to visit him before returning to my own country.
        - id: ch04-b14
          speaker: narrator
          text: The next time I saw the Emperor of Lilliput, I requested general permission to make that visit. He granted it, but his manner was very cold. Only later did I understand why.
        - id: ch04-b15
          speaker: narrator
          text: As I was preparing to leave, a distinguished courtier came secretly to my house at night. I had once done him a great service. He sent no name ahead and asked to be admitted. I placed him in my coat pocket, ordered a trusted servant to let no one enter, locked the door, and set my visitor on the table. His face was deeply troubled. He asked me to listen patiently, because my honor and my life were at stake.
        - id: ch04-b16
          speaker: court_friend
          text: You know that Skyresh Bolgolam has hated you from the time you arrived. Your victory over Blefuscu has made his hatred worse, because it has dimmed his glory as admiral. He and several others have charged you with treason. The council has met in deepest secrecy to discuss your case. Because I owe you gratitude, I risked my own head to learn everything. These are the charges against you.
        - id: ch04-b17
          speaker: court_friend
          text: First, after you brought Blefuscu's fleet into our royal port, His Majesty ordered you to seize all the ships that remained. You were also to kill the Bigendian exiles and everyone in Blefuscu who refused to break eggs at the smaller end. The charge says that you acted as a false traitor when you refused, claiming that you would not force the consciences of innocent people or destroy their freedom and their lives.
        - id: ch04-b18
          speaker: court_friend
          text: Second, when the ambassadors came from Blefuscu, you helped and welcomed them even though they served a ruler who had recently been at war with His Imperial Majesty. Third, you are now preparing to visit the Court of Blefuscu, against the duty of a faithful subject.
        - id: ch04-b19
          speaker: court_friend
          text: During the debate, the Emperor often reminded the council of the great services you had done for him. The admiral and the treasurer would hear none of it. Both insisted that you should suffer a shameful death. Reldresal, the secretary for private affairs, has always shown himself your friend. He spoke against them. He asked His Majesty to spare your life and order only that both your eyes be put out. In the secretary's view, taking your sight would satisfy justice in some measure.
        - id: ch04-b20
          speaker: court_friend
          text: Bolgolam sprang up in fury and asked how the secretary dared to preserve the life of a traitor. The treasurer complained about the cost of feeding you and also demanded your death. His Majesty then graciously observed that if the council thought blindness too light a punishment, another could be added later.
        - id: ch04-b21
          speaker: court_friend
          text: Reldresal asked to speak once more. He said your daily food could slowly be reduced. Without enough to eat, you would grow weak, faint, and die after a few months. Then the Emperor's subjects could strip the flesh from your bones and bury it, leaving your skeleton for future generations to admire.
        - id: ch04-b22
          speaker: court_friend
          text: So, through the secretary's great friendship, the council settled your fate. The plan to starve you is to remain secret, but the sentence of blindness has been entered in the records. In three days, your friend the secretary will come here and read the charges. He will explain His Majesty's great mercy in condemning you only to lose your eyes. He has no doubt that you will accept the sentence humbly and gratefully.
        - id: ch04-b23
          speaker: court_friend
          text: Twenty imperial surgeons will supervise the operation. While you lie on the ground, they will fire sharp-pointed arrows straight into your eyes. I leave you to decide what you will do. To avoid suspicion, I must return as secretly as I came.
          emotion: fearful
        - id: ch04-b24
          speaker: narrator
          text: He left at once, and I remained alone in great confusion. At first, I meant to resist. While I was free, I could easily have smashed the capital to pieces with stones. The thought soon filled me with horror. I remembered my oath to the Emperor and the favors he had granted me.
        - id: ch04-b25
          speaker: narrator
          text: At last I decided to use the permission I already had to visit the Emperor of Blefuscu. Before the three days ended, I wrote to my friend the secretary and told him what I meant to do. I did not wait for an answer. I went straight to the coast and entered the channel. Sometimes I waded and sometimes I swam, until I reached Blefuscu's port. The people there had long expected my visit, and they led me on to their capital.
        - id: ch04-b26
          speaker: narrator
          text: The Emperor, the royal family, and the great officers of Blefuscu came out to welcome me. They treated me with the generosity of a noble prince. I said nothing about my disgrace in Lilliput. I did not believe its Emperor would reveal his secret once I was beyond his power. I soon discovered that I was mistaken.
    - id: ch05
      title: Chapter V
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Three days after I arrived, curiosity took me to the northeast shore of Blefuscu. Far out in the water, I noticed something that looked like an overturned boat. I removed my shoes and stockings and waded two or three hundred yards toward it. Then I could see clearly that it was a real boat, perhaps driven away from some ship by a storm.
        - id: ch05-b02
          speaker: narrator
          text: I hurried back to the city for help. After an enormous amount of work, I managed to bring the boat into Blefuscu's royal port. A great crowd gathered, amazed by the sight of such a gigantic vessel.
        - id: ch05-b03
          speaker: narrator
          text: I went before the Emperor and told him that good fortune had placed the boat in my path. It might carry me to some land where I could find passage back to my native country. To make that possible, I asked for his orders to supply whatever materials were needed to fit out the boat. I also asked his permission to depart from Blefuscu once the work was finished. He answered with many kind speeches and graciously granted both requests.
        - id: ch05-b04
          speaker: narrator
          text: Meanwhile, the Emperor of Lilliput had grown uneasy about my long absence. He never imagined that I knew of his plans. He sent a person of rank to report my disgrace to the Emperor of Blefuscu. The messenger praised his master's great mercy in choosing to punish me only by taking my eyes. He demanded that Blefuscu send me back to Lilliput, bound hand and foot, to receive a traitor's punishment.
        - id: ch05-b05
          speaker: narrator
          text: The Emperor of Blefuscu answered with many courteous excuses.
        - id: ch05-b06
          speaker: emperor_of_blefuscu
          text: My brother knows that sending the Man-Mountain back in chains is impossible. Though he carried away my fleet, I am grateful for the good he did while making peace between our empires. In any case, both Your Majesty and I will soon be relieved of him. He has found an enormous boat on our shore, large enough to carry him to sea. I have ordered my people to prepare it, and within a few weeks I hope both empires will be free of his presence.
        - id: ch05-b07
          speaker: narrator
          text: The messenger took that answer back to Lilliput. The Emperor of Blefuscu privately offered me his protection if I would remain in his service. I still hurried my preparations, resolved never again to put my trust in princes.
        - id: ch05-b08
          speaker: narrator
          text: In about a month, I was ready to say farewell. The Emperor and Empress of Blefuscu came out of the palace with the rest of the royal family. I lay flat on my face so that I could kiss their hands, which they graciously held out to me. His Majesty gave me fifty purses of sprugs, the greatest gold coin in his country. He also presented me with a full-length portrait of himself. I slipped the little picture into one of my gloves at once so that nothing would damage it. Many other ceremonies marked my departure.
        - id: ch05-b09
          speaker: narrator
          text: I stocked the boat with food and drink. I also took six cows, two bulls, and the same number of ewes and rams, hoping to bring them home alive. A large bundle of hay and a bag of grain would feed them during the voyage.
        - id: ch05-b10
          speaker: narrator
          text: I would gladly have taken twelve Lilliputian-sized people with me, but the Emperor absolutely refused. He ordered a careful search of my pockets and made me pledge my honor that I would carry away none of his subjects, even if they wished and agreed to go.
        - id: ch05-b11
          speaker: narrator
          text: When everything was as ready as I could make it, I set sail. By my own calculation, I had traveled twenty-four leagues from the island of Blefuscu when I saw a sail in the distance. The ship was steering toward the northeast. I hailed her, but no answer came back. Still, the wind began to weaken, and my little boat steadily gained on the larger vessel. About half an hour later, someone aboard finally saw me. The ship fired a gun to signal that I had been noticed.
        - id: ch05-b12
          speaker: narrator
          text: Between five and six in the evening on September 26, 1701, I drew alongside. My heart leaped when I saw English colors. I placed the cows and sheep in my coat pockets, then climbed aboard with the rest of my tiny cargo.
        - id: ch05-b13
          speaker: narrator
          text: The captain received me kindly and asked where I had last come from. When I answered, he thought I was delirious. I reached into my pockets and brought out the little cattle and sheep. The sight filled him with astonishment, but it also convinced him that my story was true.
        - id: ch05-b14
          speaker: narrator
          text: We reached England on April 13, 1702. I remained with my wife and family for two months, but my hunger to see foreign countries would not let me stay any longer.
        - id: ch05-b15
          speaker: narrator
          text: During my time in England, I made a great profit by showing the cattle to noble families and other curious people. Before my next voyage, I sold them for six hundred pounds. I left fifteen hundred pounds with my wife and settled her in a good house.
        - id: ch05-b16
          speaker: narrator
          text: Then I said goodbye to my wife, my son, and my daughter. There were tears on both sides as I sailed away aboard the Adventure.
