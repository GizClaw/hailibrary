audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    gulliver:
      display_name: 格列佛
      tts: {delivery: 坦率镇定，带着旅行者的好奇与勇气, timbre: 清朗成熟, pace: 中等, pitch: 中低音}
    liliput_official:
      display_name: 利立浦特高官
      tts: {delivery: 庄重审慎，善意中带着戒备, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    liliput_emperor:
      display_name: 利立浦特皇帝
      tts: {delivery: 威严自负，言辞尖细而清楚, timbre: 明亮成熟, pace: 中等, pitch: 中高音}
    inventory_officer:
      display_name: 搜查官
      tts: {delivery: 一本正经，观察细致而谨慎, timbre: 清晰成熟, pace: 稍慢, pitch: 中音}
    secretary:
      display_name: 雷德雷萨尔
      tts: {delivery: 恭谨沉着，谈论国事时郑重直接, timbre: 稳健成熟, pace: 中等, pitch: 中低音}
    secret_noble:
      display_name: 神秘显贵
      tts: {delivery: 忧虑急切，刻意压低声音, timbre: 低沉成熟, pace: 稍快, pitch: 低音}
    blefuscu_emperor:
      display_name: 不来夫斯古皇帝
      tts: {delivery: 客气从容，君王气度中带着谨慎, timbre: 圆润成熟, pace: 中等, pitch: 中低音}
    english_captain:
      display_name: 英国船长
      tts: {delivery: 亲切爽朗，疑惑时直截了当, timbre: 浑厚成熟, pace: 中等, pitch: 中低音}
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 格列佛的父亲在诺丁汉郡有一小块产业，他是家里四个儿子中的老三。十四岁时，父亲送他去剑桥读书。三年后，他又跟着伦敦名医贝茨先生做学徒。父亲偶尔寄来的钱，都被他用来学习航海和旅途中用得上的本领。他一直相信，自己早晚会出门远游。
        - id: ch01-b02
          speaker: narrator
          text: 离开贝茨先生三年后，格列佛经老师举荐，登上“燕子号”做船医，在海上度过了三年。回到伦敦，他租下小房子的一部分安顿下来，还娶了袜商埃德蒙·伯顿先生的女儿玛丽为妻。
        - id: ch01-b03
          speaker: narrator
          text: 两年后，贝茨先生去世了。格列佛朋友不多，生意也越来越差，只得再次出海。几次航行以后，他接受“羚羊号”船长W.普里查德的邀请，前往南洋。1699年5月4日，他们从布里斯托尔起航，开头一路顺利。
        - id: ch01-b04
          speaker: narrator
          text: 可船开往东印度群岛时，一场暴风把他们刮到范迪门地西北方。十二名水手因为过度劳累和食物太差而死，其他人也十分虚弱。11月5日，海上浓雾弥漫。水手发现前方不到一百二十码就是礁石，可风太猛，船直撞上去，立刻裂开了。
        - id: ch01-b05
          speaker: narrator
          text: 格列佛和另外五个人放下小艇，划了大约三里格，累得再也抬不起桨，只能随海浪漂流。不到半个钟头，一阵狂风掀翻了小艇。伙伴们、逃上礁石的人，还有留在船里的人后来怎样，他无从知道，只能认定他们都丧生了。
        - id: ch01-b06
          speaker: narrator
          text: 格列佛独自在海里游，风和潮水推着他向前。就在他快撑不住时，脚碰到了海底，风暴也弱了许多。晚上八点左右，他终于登岸，又往内陆走了将近半英里，还是见不到一点人烟。他又热又累，倒在短而柔软的草地上，一口气睡了九个钟头。这是他一生睡得最香的一觉。
        - id: ch01-b07
          speaker: narrator
          text: 天刚亮，格列佛醒来想起身，却一动也不能动。他仰面躺着，手脚被牢牢绑在身体两侧，钉在地上，连长发也给缚住了。他只能望着天空。太阳越升越高，光刺得眼睛发痛。四周十分嘈杂，他却什么也看不见。
        - id: ch01-b08
          speaker: narrator
          text: 忽然，有个活物爬上他的左腿，慢慢越过胸口，来到下巴附近。格列佛垂眼一看，那竟是个不到六英寸高的小人，手里拿着弓箭，背上还有箭囊。后面至少跟着四十个同样的小人。他吓得大吼一声，小人们也吓得四散奔逃，有几个跳下去时还摔伤了。
        - id: ch01-b09
          speaker: narrator
          text: 他们很快又回来了。其中一个壮着胆子走到能看清格列佛整张脸的地方，惊叹着举起双手。格列佛实在难受，奋力挣断左臂上的绳索，又忍着钻心的头皮疼，把捆头发的绳子扯松一点，总算能把头转动两英寸左右。
        - id: ch01-b10
          speaker: narrator
          text: 小人们再次逃开，紧接着一片喊声响起。一百多支箭射中格列佛的左手，像一百多根针同时扎下来。他们又把箭射向空中，落下的箭直扑他的脸。他赶忙用左手遮住。箭雨停后，他疼得呻吟，又试着挣脱。于是更多箭射来，还有人拿长矛刺他。幸好皮背心挡住了矛尖。
        - id: ch01-b11
          speaker: narrator
          text: 格列佛决定安静等到夜里。左手已经自由，到时逃走并不难。再说，这里的居民要是都这么小，就算最强的军队来了，他也对付得了。见他不再挣扎，小人们停止放箭，可聚来的人越来越多。四码外连续响了一个多钟头的敲打声，像是在造什么东西。
        - id: ch01-b12
          speaker: narrator
          text: 格列佛尽量转头，只见一座离地约一英尺半的台子，旁边架着两三把梯子。一位身份很高的人站上台，对他讲了很久。格列佛一句也听不懂，只看出对方一会儿威胁，一会儿又显出怜悯和善意。他简短答了几句，尽量显得谦恭。
        - id: ch01-b13
          speaker: narrator
          text: 格列佛饿得快昏过去，只好反复把手指送到嘴边。那位高官立刻明白了。他走下台，命人架起梯子。一百多个居民提着国王下令送来的满篮食物，爬到格列佛身上。那些像羊腿羊肩的肉，比云雀翅膀还小。他一口吃两三块，一次吞三个面包，居民们一面不停送，一面惊叹他的胃口。
        - id: ch01-b14
          speaker: narrator
          text: 格列佛又打手势要水。小人们知道一点饮料远远不够，便把最大的酒桶吊起来，滚到他手边，敲掉桶盖。他一口喝光，因为那桶连半品脱也装不下。第二桶也喝完了，他还想要，可他们已经没有。格列佛十分佩服这些小人的胆量。他的一只手明明自由，他们还是敢在这个庞然大物身上来回行走。
        - id: ch01-b15
          speaker: narrator
          text: 过了一会儿，皇帝派来一位高官。他带着十二名左右的随从，从格列佛右腿走到脸前，说了约十分钟，还不断指向前方。格列佛后来才知道，半英里外就是都城，皇帝下令把他运到那里。
        - id: ch01-b16
          speaker: narrator
          text: 格列佛把自由的左手伸向被缚的右手，小心绕过高官和随从，示意他们放开自己。高官摇摇头，又用手势保证会给他足够的食物和饮料，也会善待他。格列佛本想逃脱，可中箭的脸和手刺痛难忍，处处起泡，四周的人又越来越多，便表示愿听他们处置。
        - id: ch01-b17
          speaker: narrator
          text: 小人们马上给他的脸和手涂上一种气味好闻的药膏。几分钟后，伤口就不疼了。格列佛吃饱了，困意也涌上来，很快沉沉睡去。后来他才知道，自己睡了约八个钟头，因为医师奉皇帝之命，在酒里放了安眠药。
        - id: ch01-b18
          speaker: narrator
          text: 原来，皇帝很早就听说岸上躺着一个沉睡的巨人，便命人在夜里把他绑好，送来足够的食物和饮料，再造一部机器运他进城。五百名木匠和工程师立刻开工。机器是一副木架，离地三英寸，长约七英尺，宽约四英尺，底下有二十二个轮子。
        - id: ch01-b19
          speaker: narrator
          text: 为了把格列佛放上木架，他们竖起八十根木杆，把结实的绳索系在他颈项、双手、身体和双腿的布带上。九百名壮汉借助滑轮拉绳，不到三个钟头就把他吊起来，牢牢绑在木架上。随后，一千五百匹皇帝最大的马拉着他前往都城，每匹马只有四英寸半高。格列佛一直睡得很沉，出发四个钟头后才醒。
        - id: ch01-b20
          speaker: narrator
          text: 到达都城时，皇帝带着全体廷臣出城迎接。大臣们不肯让皇帝冒险登上格列佛的身体。车停在一座全国最大的古庙旁，他们决定让格列佛住在那里。庙门足够大，他能轻易爬进去。门边有九十一条像怀表链一样粗的链子，三十六把挂锁把它们锁在他的左腿上。
        - id: ch01-b21
          speaker: narrator
          text: 工匠确认他挣不开，才割断其他绳索。格列佛站起身，一生从没这样低落过。百姓见他站立行走，又惊又怕，喧闹得难以形容。腿上的链子长约两码，他能在半圆里来回走，也能爬进庙里伸直身子躺下。
        - id: ch01-b22
          speaker: narrator
          text: 皇帝从衣着华美的廷臣中走出来，满怀惊奇地打量格列佛，却始终站在铁链够不到的地方。他比宫中所有人都高出约一指甲的宽度，已经足以叫旁人敬畏。他仪态优雅威严，衣着朴素，头上却戴着饰有珠宝和羽饰的轻巧金盔，手里还拔出一柄将近三英寸长、镶满钻石的金柄宝剑。格列佛后来曾多次把他托在手中，所以这些尺寸绝不会看错。
        - id: ch01-b23
          speaker: narrator
          text: 为了看清皇帝，格列佛侧身躺下，让两人的脸处在同一高度。皇帝站在三码外，嗓音尖细，却十分清楚。他一再开口，格列佛也回答，可两个人连一个字都听不懂。
    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两小时后，宫廷众人退去，只留下一队重兵驱赶围观者。几个无礼的人趁格列佛坐在庙门边，竟朝他放箭。上校抓住其中六人，捆好交到他手里。格列佛把五个装进外衣口袋，又对第六个装出要生吞他的样子。小人放声尖叫，上校和军官们见格列佛拿出折刀，也吓得不知怎么办。
        - id: ch02-b02
          speaker: narrator
          text: 格列佛很快让大家放下心。他割断那人的绳子，轻轻放到地上。小人立刻飞奔而去。其余五个也被他逐一从口袋里取出，全部放走。士兵和百姓见他这样仁慈，都十分欢喜。
        - id: ch02-b03
          speaker: narrator
          text: 天快黑时，格列佛费了很大力气才钻进住处，只能睡在地上。这样的日子过了两个星期，居民们才把六百张普通大小的床拼在一起，给他做成一张床。
        - id: ch02-b04
          speaker: narrator
          text: 皇帝派六百名仆人服侍他，又让三百名裁缝给他做衣服，还请来六位最博学的学者教他本国语言。没过多久，格列佛已经能勉强和皇帝交谈。皇帝常来看他，而他最先学会的，就是请求恢复自由。
        - id: ch02-b05
          speaker: gulliver
          text: 陛下，请把自由还给我吧。
        - id: ch02-b06
          speaker: narrator
          text: 格列佛每天跪下重复这个请求。皇帝却说不能着急，他得先发誓与皇帝和王国和平相处。按照本国法律，还必须有两名官员搜查他的身体。皇帝愿把他们交到格列佛手中，拿走的东西也会在他离境时归还。
        - id: ch02-b07
          speaker: narrator
          text: 格列佛把两名官员拿起来，放进外衣口袋。他们带着纸笔墨水，仔细查看每件东西，列出一份清单。格列佛后来把它译了出来。
        - id: ch02-b08
          speaker: inventory_officer
          text: 我们在“人山”右边的外衣口袋里，只找到一大块粗布，足够铺满陛下正殿的地面。左边口袋里有一只带盖的巨大银箱，我们根本抬不动。我们请他打开箱子，其中一人走了进去。里面有一种没到小腿的尘土，扑到我们脸上，害得两个人不停打喷嚏。
        - id: ch02-b09
          speaker: inventory_officer
          text: 他右边的背心口袋里，叠着许多薄薄的白色东西，每张约有三个人那么大，用一根结实的缆绳捆着，上面满是黑色符号。我们大胆猜想，那是文字。左边口袋里还有一件器械，背后伸出二十根长杆。我们推测，“人山”就是用它梳头的。
        - id: ch02-b10
          speaker: inventory_officer
          text: 右侧一个较小的口袋里，装着大小不同的圆形扁片，有白色的，也有红色的，都是金属做的。有些白色扁片看起来像银子，又大又重，我和同伴一起也很难抬动。
        - id: ch02-b11
          speaker: inventory_officer
          text: 另一个口袋里垂下一条巨大的银链，末端系着一件奇妙的器械。那是个圆球，一半是银，一半是某种透明材料。我们隔着透明的一面看到许多古怪符号，还以为伸手就能摸到，结果手指被那层光亮的东西挡住了。器械不停发出水磨般的响声。
        - id: ch02-b12
          speaker: inventory_officer
          text: 我们猜它要么是一种不知名的动物，要么是“人山”崇拜的神明。后一种更有可能，因为他告诉我们，自己几乎做什么事以前，都要先听它的意见。以上就是我们在“人山”身上发现的物品。他对我们十分有礼。
        - id: ch02-b13
          speaker: narrator
          text: 格列佛还有一个隐秘的口袋，官员没有发现。里面放着一副眼镜和一架小望远镜。他认为这两样东西对皇帝并不重要，道义上也没有必要交出去。
    - id: ch03
      title: 第三章
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 格列佛性情温和，待人友善，渐渐赢得皇帝、宫廷和百姓的好感。他开始盼望自己很快能恢复自由。居民也一点点不再怕他。有时，他躺下来让五六个人在手掌上跳舞，后来男孩女孩甚至敢钻进他的头发里玩捉迷藏。
        - id: ch03-b02
          speaker: narrator
          text: 军队和皇家马厩的马每天都被牵来，也不再受惊。有一回，皇帝的一名猎手骑着高头大马，跃过格列佛穿着鞋的整只脚，那一跳十分惊人。
        - id: ch03-b03
          speaker: narrator
          text: 一天，格列佛想出一个特别的游戏供皇帝消遣。他把九根木棍插进地里，围成正方形，又在四角平行绑上四根横杆，离地约两英尺。他将手帕系在九根竖棍上，朝四面拉紧，绷得像鼓面，再请求皇帝准许二十四名精锐骑兵到上面操练。
        - id: ch03-b04
          speaker: narrator
          text: 皇帝同意了。格列佛把骑兵和指挥官逐个托上手帕。队伍列好阵势，分成两队，用钝箭互射，拔剑交锋，一会儿逃，一会儿追，军纪是格列佛平生所见最严整的。四周的横杆护着人马，不让他们跌下去。
        - id: ch03-b05
          speaker: narrator
          text: 皇帝看得兴致勃勃，命他们连续表演好几天，还说服皇后，让格列佛连人带椅把她托到离台子两码以内，好看清整场演练。只有一次出了意外。一匹烈马用蹄子刨破手帕，骑手和马一起摔倒。格列佛立刻救起他们，一手遮住破洞，另一手把整队骑兵放回地上。马扭伤了肩膀，骑手没有受伤。格列佛补好手帕，从此再也不敢拿它冒险。
        - id: ch03-b06
          speaker: narrator
          text: 格列佛多次请求恢复自由，皇帝终于把事情交给议政大臣商量。只有海军上将斯凯雷什·博尔戈兰反对。格列佛从未得罪过他，他却成了格列佛的死敌。最后，他还是同意了，不过坚持由自己起草释放条件。
        - id: ch03-b07
          speaker: narrator
          text: 条款宣读后，格列佛要按照本国的姿势发誓遵守。他左手握住右脚，右手中指按在头顶，拇指抵住右耳尖。那份条款先用一长串称号颂扬利立浦特最强大的皇帝，说他是宇宙的欢乐与恐惧、万王之王，疆土直到世界尽头，身高压过众人，双脚踏到地心，头颅直冲太阳。他一点头，天下诸侯便双膝发抖。他像春天一样和悦，像夏日一样舒适，像秋天一样丰饶，像冬天一样可畏。
        - id: ch03-b08
          speaker: liliput_emperor
          text: 新近来到朕天国领土的“人山”，必须庄严宣誓遵守以下条款。第一，没有盖着国玺的许可，不得离开我国。第二，没有明确命令，不得擅自进入都城。进城前要提前两个钟头通知，让居民全都留在屋内。
        - id: ch03-b09
          speaker: liliput_emperor
          text: 第三，“人山”只能走我国的主要大道，不得走进或躺在草地和麦田里。第四，他在路上必须万分小心，不得踩到任何臣民，也不得踩到他们的马匹车辆。没有得到本人同意，更不许把臣民拿在手中。
        - id: ch03-b10
          speaker: liliput_emperor
          text: 第五，若有信使急需赶路，“人山”要把信使连人带马放进口袋，送出六日路程，需要时再安全送回朕面前。第六，他必须与我国结盟，抵御不来夫斯古岛上的敌人，并尽力摧毁敌方准备入侵我国的舰队。
        - id: ch03-b11
          speaker: liliput_emperor
          text: “人山”庄严发誓以后，每天可以得到足够一千七百二十四名臣民食用的饮食。他可以自由觐见朕，也可享受我国其他恩宠。此令于朕在位第九十一月第十二日，颁于贝尔法布拉克宫。
        - id: ch03-b12
          speaker: narrator
          text: 格列佛欣然宣誓。铁链随即打开，他完全恢复了自由。
        - id: ch03-b13
          speaker: narrator
          text: 两个星期后的一天早晨，掌管机密事务的大臣雷德雷萨尔来到格列佛住处，只带一名仆人。他让马车停在远处，请格列佛给他一个钟头谈话。格列佛提出躺下，让他靠近耳朵，可大臣宁愿站在格列佛手中。他先祝贺格列佛获得自由，又说，要不是宫廷眼下的形势，格列佛恐怕没这么快获释。
        - id: ch03-b14
          speaker: secretary
          text: 我国表面上十分繁荣，眼下却面临不来夫斯古入侵的危险。那是宇宙中的另一个大帝国，国土和国力几乎不输给我国。您说世上还有别的王国，那里也住着像您一样高大的人，可我们的哲学家大多不信。他们宁愿猜想，您是从月亮或某颗星星上掉下来的。只要有一百个您这样的人，很快就会吃光陛下国土上的一切果实和牲畜。我国六千个月的史书里，也从没提过这两大帝国以外的地方。
        - id: ch03-b15
          speaker: secretary
          text: 如今两国正在打一场极顽强的战争。人人都承认，自古以来，鸡蛋应该从大头敲开。可是当今陛下的祖父小时候照这个习惯吃鸡蛋，不小心割伤了一根手指。他父亲便下令，从此所有臣民都得从小头敲鸡蛋。
        - id: ch03-b16
          speaker: secretary
          text: 百姓痛恨这道法令，先后发动六次叛乱。一个皇帝丢了性命，另一个丢了王位。据估算，有一千一百人宁愿受刑，也不肯从小头敲开鸡蛋。这些被叫作“大端派”的叛徒受到不来夫斯古皇帝的鼓励，每次逃难都去那里寻求庇护。因此，两大帝国已经血战了三十六个月。
        - id: ch03-b17
          speaker: secretary
          text: 现在，不来夫斯古装备了一支庞大舰队，正准备入侵。皇帝陛下深信您的勇气和力量，所以命我把实情告诉您。
        - id: ch03-b18
          speaker: gulliver
          text: 请代我向皇帝致以最恭敬的敬意。我愿冒着生命危险保卫陛下，抵抗任何来犯的敌人。
    - id: ch04
      title: 第四章
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久，格列佛把夺取敌军全部舰队的计划报告给皇帝。不来夫斯古是一座岛，和利立浦特之间隔着一条八百码宽的海峡。经验最丰富的水手告诉他，涨潮时海峡中央有七十格兰格夫深，换成欧洲尺度约是六英尺。
        - id: ch04-b02
          speaker: narrator
          text: 格列佛来到海岸，伏在小丘后，用望远镜观察对岸的敌舰。那里停着约五十艘战舰，还有一些别的船。他回到住处，要人送来许多最结实的绳索和铁棍。绳索和包东西的细线差不多粗，铁棍则像织针。他把绳索三股合成一股，又把铁棍每三根绞在一起，末端弯成钩子。最后，五十个钩子各自系上了绳索。
        - id: ch04-b03
          speaker: narrator
          text: 格列佛再次来到海岸，脱掉外衣、鞋和袜子，只穿着皮背心，在满潮前半个钟头走进海里。他尽快涉水前进，中间游了约三十码，脚才重新踩到海底。不到半个钟头，他已经来到舰队旁。
        - id: ch04-b04
          speaker: narrator
          text: 敌人一看见他，吓得跳船游向岸边，足有三万人。格列佛把钩子逐个扣进每艘船头的孔洞，再把绳子的另一端全都结在一起。敌人射来几千支箭，许多扎进他的手和脸。他最担心眼睛，幸好突然想起了那副没被搜走的眼镜。他牢牢戴好，让它像护甲一样挡在眼前，继续顶着箭雨干活。镜片中了许多箭，不过只被轻轻撞歪。
        - id: ch04-b05
          speaker: narrator
          text: 格列佛抓住绳结用力拉，可没有一艘船移动，原来船锚还牢牢抓着它们。最需要胆量的事就在这时。他放下绳子，用刀割断所有锚缆，脸和手又中了两百多箭。接着，他重新抓紧绳结，轻而易举地把敌方最大的五十艘战舰拖在身后。
        - id: ch04-b06
          speaker: narrator
          text: 不来夫斯古人看见整支舰队排着队移动，格列佛又在前面拖曳，立刻发出无法形容的悲痛尖叫。离开危险后，他停下来拔掉手和脸上的箭，涂上初到小人国时得到的药膏，又摘下眼镜。等了约一个钟头，潮水退下一些，他才继续涉水走进利立浦特的皇家港口。
        - id: ch04-b07
          speaker: narrator
          text: 皇帝和全体廷臣都在岸边等候。他们只看见大批船只排成半月形前进，却看不见海水已经淹到颈部的格列佛。皇帝以为他淹死了，敌军舰队正大举来犯。很快，海水越来越浅，格列佛走到了众人能听清的地方。他高高举起拴着舰队的绳索末端。
        - id: ch04-b08
          speaker: gulliver
          text: 最强大的利立浦特皇帝万岁！
        - id: ch04-b09
          speaker: narrator
          text: 格列佛一上岸，皇帝便满心欢喜地接见他，当场封他为“纳达克”，这是全国最高的荣誉称号。
        - id: ch04-b10
          speaker: narrator
          text: 皇帝还想让格列佛找机会拖走敌方剩余的船。他一心要征服整个不来夫斯古，成为全世界唯一的君主。格列佛却坦率地拒绝了。
        - id: ch04-b11
          speaker: gulliver
          text: 我绝不会帮助任何人，把一个自由而勇敢的民族变成奴隶。
        - id: ch04-b12
          speaker: narrator
          text: 最明智的几位大臣赞同格列佛，可皇帝再也不能原谅他公开反对自己的野心。从那时起，皇帝和敌视格列佛的大臣暗中谋划，险些将他彻底毁掉。
        - id: ch04-b13
          speaker: narrator
          text: 大约三个星期后，不来夫斯古派来使团谦恭求和。双方很快签订条约，条件对利立浦特皇帝十分有利。使团包括六名衣着华美的大使和约五百名随员。他们私下得知格列佛替他们说过话，便来拜访，称赞他的勇气和宽宏，还以本国皇帝的名义邀请他前去。
        - id: ch04-b14
          speaker: narrator
          text: 格列佛请他们代自己向不来夫斯古皇帝致以最恭敬的敬意，也决定回祖国以前亲自觐见那位君王。下一次见到利立浦特皇帝时，他请求准许自己去拜会不来夫斯古君主。皇帝答应了，态度却十分冷淡，格列佛后来才明白其中原因。
        - id: ch04-b15
          speaker: narrator
          text: 格列佛正准备动身时，宫中一位地位显赫的人趁夜秘密来访。这个人曾受过格列佛的大恩，没有通报姓名便请求入内。格列佛把他装进外衣口袋，叫一名可靠的仆人守门，不许任何人进来。他锁好门，把访客放到桌上，自己坐在旁边。那位大人满脸忧虑，请格列佛耐心听一件关系到名誉和性命的大事。
        - id: ch04-b16
          speaker: secret_noble
          text: 斯凯雷什·博尔戈兰从您来到这里起，就一直把您当作死敌。您战胜不来夫斯古，盖过了他这个海军上将的荣光，他对您也更加痛恨。如今，他和几位大臣指控您叛国，已经秘密开过几次会议。我感念您的恩情，冒着性命危险查清了全部经过。
        - id: ch04-b17
          speaker: secret_noble
          text: 第一项罪名是，您把不来夫斯古舰队拖进皇家港口以后，陛下命您夺走他们剩下的船，杀死逃到那里的所有大端派，也杀死一切不肯立刻从鸡蛋小头敲开的人。您却以不愿逼迫无辜百姓违背良心、不愿毁掉他们的自由和生命为理由，拒绝效命。他们说，这是背叛至尊陛下。
        - id: ch04-b18
          speaker: secret_noble
          text: 第二项罪名是，不来夫斯古派大使来时，您明知他们的君王不久前还和陛下交战，却仍帮助并款待他们。第三项罪名是，您准备前往不来夫斯古宫廷，这不合忠臣的本分。
        - id: ch04-b19
          speaker: secret_noble
          text: 商议罪名时，陛下多次提到您的功劳，海军上将和财政大臣却坚持要羞辱您，再把您处死。掌管机密事务的雷德雷萨尔一直是您的朋友，他建议陛下留下您的性命，只挖去您的双眼，也算维护了一部分正义。博尔戈兰听了勃然大怒，质问他怎么敢保住一个叛徒的性命。财政大臣又拿供养您的花费说事，也主张处死您。
        - id: ch04-b20
          speaker: secret_noble
          text: 陛下仁慈地表示，既然大臣们觉得只失去双眼还不够重，以后可以再加别的惩罚。雷德雷萨尔再次恭敬进言，说到供养的花费，可以慢慢削减您的食物，让您越来越虚弱昏沉，几个月后死去。到那时，陛下的臣民就能从您的骨头上割下肉来埋葬，再把骷髅留下，让后世的人惊叹观赏。
        - id: ch04-b21
          speaker: secret_noble
          text: 多亏雷德雷萨尔对您的深厚友谊，事情就这样定下了。慢慢饿死您的计划必须保密，挖去双眼的判决却已经正式记录在案。三天后，他会来这里宣读罪状，还会说明陛下何等仁慈，只判您失去双眼。他相信您会谦恭而感激地接受。
        - id: ch04-b22
          speaker: secret_noble
          text: 到时，陛下会派二十名外科医师到场监督。您躺在地上，他们会把极尖的箭射进您的两颗眼珠。我要说的只有这些。请您好好想想该怎么办。为了不叫人怀疑，我必须立刻像来时一样秘密离开。
        - id: ch04-b23
          speaker: narrator
          text: 大人走后，格列佛独自留下，心里乱极了。起初，他决意反抗。只要还自由，他用石头就能轻易砸碎整座都城。可一想到自己向皇帝发过誓，又受过皇帝的恩惠，他便惊恐地放弃这个念头。
        - id: ch04-b24
          speaker: narrator
          text: 最后，格列佛想起自己已经获准觐见不来夫斯古皇帝，决定趁机离开。三天期限还没到，他先写信把决定告诉雷德雷萨尔，随后不等回信，径直走到海岸。他踏进海峡，一路时而涉水、时而游泳，抵达不来夫斯古港。那里的人早就在等他，立刻把他领往都城。
        - id: ch04-b25
          speaker: narrator
          text: 不来夫斯古皇帝带着王室成员和宫中大臣出城迎接，以伟大君王应有的慷慨款待格列佛。格列佛没有说自己已被利立浦特皇帝厌弃。他以为，只要自己不在那位君王手里，对方就不会泄露秘密。事实很快证明，他错了。
    - id: ch05
      title: 第五章
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 抵达不来夫斯古三天后，格列佛好奇地到岛屿东北海岸散步。远处海面有个东西，看起来像一条翻扣的船。他脱掉鞋袜，涉水走了两三百码，终于看清那确实是一条小船，大概是被风暴从某艘大船上吹落的。
        - id: ch05-b02
          speaker: narrator
          text: 格列佛立即回城求援，费尽力气，总算把船拖进不来夫斯古的皇家港口。大群百姓围过来，惊叹这条庞然大物。格列佛告诉皇帝，命运把这条船送到面前，他便能乘船去某个地方，再从那里返回祖国。他请求皇帝赐给自己修船的材料，并准许他离开。
        - id: ch05-b03
          speaker: narrator
          text: 皇帝对格列佛说了许多亲切的话，答应了他的请求。
        - id: ch05-b04
          speaker: narrator
          text: 与此同时，利立浦特皇帝因为格列佛迟迟不回而心神不安，却没想到他已经知道了秘密谋划。皇帝派一位显贵去见不来夫斯古皇帝，通报格列佛失宠的消息。使者奉命宣扬君王的无比仁慈，说皇帝只判格列佛失去双眼，还要求兄弟君王把他捆住送回利立浦特，以叛徒的罪名受罚。
        - id: ch05-b05
          speaker: narrator
          text: 不来夫斯古皇帝用许多客气话推托。他说，兄弟君王也知道，想把格列佛捆起来送回去，根本不可能。格列佛虽然夺走过他的舰队，他仍然感激格列佛为促成和约所做的事。
        - id: ch05-b06
          speaker: blefuscu_emperor
          text: 两位陛下很快都能安心。“人山”在海岸找到一艘巨大的船，可以载他出海。我已经命人把船修好。想来用不了几个星期，两大帝国都不必再为他操心了。
        - id: ch05-b07
          speaker: narrator
          text: 使者带着这份答复回到利立浦特。不来夫斯古皇帝又私下提出，只要格列佛愿意为他效力，就赐给格列佛仁慈的庇护。格列佛还是加紧准备离开。他已经决定，从今以后再也不信任君王。
        - id: ch05-b08
          speaker: narrator
          text: 大约一个月后，一切准备妥当，格列佛前去辞行。不来夫斯古皇帝、皇后和王室成员走出宫殿。他伏在地上，亲吻他们伸来的手。皇帝赐给他五十袋斯普拉格，也就是本国面值最大的金币，还送给他一幅自己的全身画像。格列佛立刻把画像放进一只手套，免得损坏。临行前，宫中还举行了许多别的仪式。
        - id: ch05-b09
          speaker: narrator
          text: 格列佛在船上装足食物和饮料，又带上六头母牛、两头公牛，以及同样数目的母羊和公羊，打算把它们送回祖国。他还带了一大捆干草和一袋谷物，留着在船上喂养牲畜。
        - id: ch05-b10
          speaker: narrator
          text: 格列佛很想再带十二个当地人回去，可皇帝无论如何也不答应。他不但命人仔细搜查格列佛的口袋，还要格列佛以名誉保证，绝不带走他的任何臣民，哪怕那些人自愿而且一心想走也不行。
        - id: ch05-b11
          speaker: narrator
          text: 格列佛把一切安排好，扬帆启程。按他的估算，船驶离不来夫斯古岛二十四里格后，他看见一艘船正向东北方航行。他大声呼喊，却没有得到回应。后来风势减弱，他发现自己正慢慢追上那艘船。
        - id: ch05-b12
          speaker: narrator
          text: 半个钟头后，船上的人看见了格列佛，放了一炮。1701年9月26日下午五六点之间，他来到大船旁。一看见船上挂着英国旗，他的心立刻欢腾起来。他把牛羊装进外衣口袋，带着全部小小的货物登上大船。
        - id: ch05-b13
          speaker: english_captain
          text: 你刚从什么地方来？
        - id: ch05-b14
          speaker: narrator
          text: 船长亲切地接待了格列佛，可听完他的回答，却以为他在说胡话。格列佛便从口袋里取出黑色的牛和羊。船长惊讶极了，这才完全相信他的故事。
        - id: ch05-b15
          speaker: narrator
          text: 1702年4月13日，格列佛回到英国。他和妻子家人住了两个月，可探访异国的强烈愿望又让他待不下去了。在英国时，他把那些牲畜展示给贵族和其他人看，赚了不少钱。第二次出航前，他又以六百英镑卖掉牲畜，给妻子留下一千五百英镑，让她住进一所很好的房子。
        - id: ch05-b16
          speaker: narrator
          text: 随后，格列佛含着眼泪告别妻子和一儿一女，登上“冒险号”，再次出发远航。
