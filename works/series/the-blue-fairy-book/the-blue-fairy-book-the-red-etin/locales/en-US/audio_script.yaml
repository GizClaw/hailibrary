  chapters:
    - id: ch01
      title: The Red Etin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were two widows who rented a little patch of ground from a farmer. One widow had two sons, and the other had one. In time, the widow with two sons knew they must go out and seek their fortunes.
        - id: ch01-b02
          speaker: mother
          text: Take this can to the well and bring me water. I will bake you a cake for your journey. If you bring much water, the cake will be large. If you bring little, it will be small. That cake is all I can give you when you leave.
        - id: ch01-b03
          speaker: narrator
          text: The elder son filled the can at the well and carried it home. But the can was broken, and most of the water leaked away. His mother could bake only a very small cake.
        - id: ch01-b04
          speaker: mother
          text: Will you take half the cake with my blessing, or the whole cake with my curse?
        - id: ch01-b05
          speaker: elder_son
          text: I may have a long way to travel, and I do not know when I will find more food. Give me the whole cake, whatever comes with your curse.
        - id: ch01-b06
          speaker: narrator
          text: She gave him the whole cake and her curse with it. Before he left, the young man took his brother aside and handed him a knife.
        - id: ch01-b07
          speaker: elder_son
          text: Keep this until I return, and look at it every morning. While the blade stays bright, you will know I am well. If it turns dull and rusty, some harm has surely come to me.
        - id: ch01-b08
          speaker: narrator
          text: He traveled all that day and the next. On the afternoon of the third day, he found a shepherd sitting beside a flock of sheep. The young man asked who owned them.
        - id: ch01-b09
          speaker: shepherd
          text: The Red Etin of Ireland once lived in Bellygan. He stole King Malcolm's daughter from the King of fair Scotland. He beats her and binds her. He lays her on a band, and every day he strikes her with a bright silver wand. Like Julian the Roman, he fears no man. They say one man is destined to be his mortal foe, but that man is not yet born, and long may it be so.
        - id: ch01-b10
          speaker: narrator
          text: Farther on, the young man saw an old white-haired swineherd. When he asked who owned the swine, he received the same answer.
        - id: ch01-b11
          speaker: swineherd
          text: They belong to the Red Etin of Ireland. He stole King Malcolm's daughter and keeps her bound. Each day he beats her with a silver wand. He fears no man, and the enemy destined to destroy him has not yet been born.
        - id: ch01-b12
          speaker: narrator
          text: A little farther along, he met another very old man tending goats. The young man asked who owned them.
        - id: ch01-b13
          speaker: goatherd
          text: The Red Etin of Ireland owns them. He once lived in Bellygan, and he stole King Malcolm's daughter from the King of fair Scotland. He beats her and binds her. He lays her on a band and strikes her every day with a bright silver wand. Like Julian the Roman, he fears no man. They say one man is destined to be his mortal foe, but that man is not yet born. Now beware of the next beasts you meet. They are unlike any creatures you have seen before.
        - id: ch01-b14
          speaker: narrator
          text: Before long, the young man came upon a great crowd of dreadful beasts. Each had two heads, and each head bore four horns. Terrified, he ran from them as fast as he could. He was glad to reach a castle on a little hill, with its door standing wide open.
        - id: ch01-b15
          speaker: narrator
          text: He hurried inside for shelter and found an old woman beside the kitchen fire. Tired from his long journey, he asked if he might stay for the night.
        - id: ch01-b16
          speaker: castle_woman
          text: You may stay, but this is a dangerous place. The castle belongs to the Red Etin. He is a terrible creature with three heads, and he spares no living man he catches.
        - id: ch01-b17
          speaker: narrator
          text: The young man wanted to leave, but he feared the beasts outside. He begged the woman to hide him and say nothing to the Etin. If he could survive the night, he hoped to escape in the morning after the beasts had gone.
        - id: ch01-b18
          speaker: narrator
          text: He had barely settled into his hiding place when the dreadful Etin came in, roaring.
        - id: ch01-b19
          speaker: red_etin
          text: Snouk out and snouk in, I smell an earthly man. Living or dead, his heart will season my bread tonight!
        - id: ch01-b20
          speaker: narrator
          text: The monster soon found the poor young man and dragged him from his hiding place. He promised to spare the lad's life if he could answer three questions.
        - id: ch01-b21
          speaker: red_etin
          text: Which was inhabited first, Ireland or Scotland? Was man made for woman, or woman for man? And which were made first, men or beasts?
        - id: ch01-b22
          speaker: narrator
          text: The lad could not answer even one. The Red Etin struck him on the head with a mace and turned him into a pillar of stone.
        - id: ch01-b23
          speaker: narrator
          text: The next morning, the younger brother examined the knife. He grieved when he saw that the blade had turned brown with rust.
        - id: ch01-b24
          speaker: younger_son
          text: Mother, the time has come for me to travel too.
        - id: ch01-b25
          speaker: narrator
          text: His mother sent him to fetch water so she could bake his journey cake. Because the can was broken, he brought home as little water as his brother had, and his cake was just as small.
        - id: ch01-b26
          speaker: mother
          text: Will you have half the cake with my blessing, or all of it with my curse?
        - id: ch01-b27
          speaker: younger_son
          text: I will take the whole cake, whatever your curse may bring.
        - id: ch01-b28
          speaker: narrator
          text: He set out, and everything that had happened to his elder brother happened to him as well.
        - id: ch01-b29
          speaker: narrator
          text: A fairy told the other widow and her son what had happened. The young man decided to travel in search of his two friends and see whether he could save them.
        - id: ch01-b30
          speaker: second_widow
          text: Then take this can to the well. Bring me water, and I will bake a cake for your journey.
        - id: ch01-b31
          speaker: narrator
          text: He filled the can and started home. As the water leaked through its broken sides, a raven called from overhead.
        - id: ch01-b32
          speaker: raven
          text: Look at your can! The water is running out!
        - id: ch01-b33
          speaker: narrator
          text: The young man had good sense. When he saw the leak, he stopped the holes with clay and carried home enough water for a large cake. His mother offered him half with her blessing or the whole with her curse.
        - id: ch01-b34
          speaker: prudent_youth
          text: I choose half the cake and your blessing.
        - id: ch01-b35
          speaker: narrator
          text: Even that half was larger than both of the other lads' cakes put together. The young man took it and began his journey.
        - id: ch01-b36
          speaker: narrator
          text: After traveling a long way, he met an old woman who asked him to share a piece of his cake.
        - id: ch01-b37
          speaker: fairy
          text: Would you spare a little of your cake for me?
        - id: ch01-b38
          speaker: prudent_youth
          text: Gladly. You are welcome to a piece.
        - id: ch01-b39
          speaker: narrator
          text: He gave her some of his cake. In return, she handed him a magic wand and told him it might serve him well if he used it properly. The old woman was a fairy. She told him much about what lay ahead and what he should do in every danger. Then she vanished in an instant.
        - id: ch01-b40
          speaker: narrator
          text: The young man journeyed on until he reached the old shepherd. He asked who owned the sheep, and the shepherd answered in verse.
        - id: ch01-b41
          speaker: shepherd
          text: The Red Etin of Ireland once lived in Bellygan. He stole King Malcolm's daughter from the King of fair Scotland. He beats her and binds her. He lays her on a band, and every day he strikes her with a bright silver wand. Like Julian the Roman, he fears no man. But now I fear his end is near, and destiny is at hand. I plainly see that you will be the heir to all his land.
        - id: ch01-b42
          speaker: narrator
          text: The swineherd and the goatherd gave him the same answer when he asked about their animals.
        - id: ch01-b43
          speaker: narrator
          text: Then he reached the place where the monstrous beasts stood. He neither stopped nor ran. He walked boldly among them. One beast rushed at him, roaring with its mouth open to devour him. The young man struck it with the wand, and it fell dead at his feet.
        - id: ch01-b44
          speaker: narrator
          text: Soon he reached the Etin's castle. He knocked at the door and was allowed inside. The old woman by the fire warned him about the terrible Etin and told him what had happened to the two brothers.
        - id: ch01-b45
          speaker: castle_woman
          text: The Red Etin has already turned two young men into stone. You must beware of him.
        - id: ch01-b46
          speaker: narrator
          text: But the young man would not be frightened away. Before long, the monster came in and cried out.
        - id: ch01-b47
          speaker: red_etin
          text: Snouk out and snouk in, I smell an earthly man. Living or dead, his heart will season my bread!
        - id: ch01-b48
          speaker: narrator
          text: The Etin quickly spotted him and ordered him into the middle of the floor.
        - id: ch01-b49
          speaker: red_etin
          text: Come out here. Now answer me this. Which was inhabited first, Ireland or Scotland? Was man made for woman, or woman for man? And which were made first, men or beasts?
        - id: ch01-b50
          speaker: narrator
          text: The good fairy had prepared the young man for everything, so he answered all three questions. The Etin knew at once that his power was gone. The young man seized the axe and cut off all three of the monster's heads.
        - id: ch01-b51
          speaker: prudent_youth
          text: Show me where the King's daughters are held.
        - id: ch01-b52
          speaker: narrator
          text: The old woman led him upstairs and opened a great many doors. From every doorway came a beautiful lady whom the Etin had imprisoned. One of them was the King's daughter.
        - id: ch01-b53
          speaker: narrator
          text: Next, the old woman took him down to a low room where two stone pillars stood. He touched them with his wand, and his two friends and neighbors sprang back to life.
        - id: ch01-b54
          speaker: narrator
          text: All the prisoners rejoiced at their deliverance, and they knew they owed their freedom to the prudent young man. The next day, the whole company set out for the King's court. They made a gallant sight along the road.
        - id: ch01-b55
          speaker: narrator
          text: The King gave his daughter in marriage to the young man who had rescued her. Each of the other young men married a nobleman's daughter. And they all lived happily for the rest of their days.
