audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    mother:
      display_name: 两兄弟的母亲
      tts: {delivery: 务实而郑重, timbre: 温厚成熟, pace: 从容, pitch: 中低音}
    elder_son:
      display_name: 哥哥
      tts: {delivery: 自信中带着谨慎, timbre: 清朗年轻, pace: 中等, pitch: 中音}
    younger_son:
      display_name: 弟弟
      tts: {delivery: 诚恳而坚决, timbre: 清朗年轻, pace: 中等, pitch: 中音}
    shepherd:
      display_name: 牧羊老人
      tts: {delivery: 郑重如同吟诵预言, timbre: 沧桑洪亮, pace: 徐缓, pitch: 低音}
    swineherd:
      display_name: 放猪老人
      tts: {delivery: 郑重如同吟诵预言, timbre: 苍老粗粝, pace: 徐缓, pitch: 低音}
    goatherd:
      display_name: 放山羊老人
      tts: {delivery: 郑重而带有警示, timbre: 苍老干涩, pace: 徐缓, pitch: 低音}
    castle_woman:
      display_name: 炉边老婆子
      tts: {delivery: 警觉而心怀怜悯, timbre: 苍老柔和, pace: 不疾不徐, pitch: 中低音}
    red_etin:
      display_name: 红巨魔
      tts: {delivery: 凶暴而充满威胁, timbre: 粗砺如雷, pace: 沉重, pitch: 极低音}
    prudent_youth:
      display_name: 聪明的小伙子
      tts: {delivery: 沉着勇敢又有礼貌, timbre: 清朗年轻, pace: 中等, pitch: 中音}
    second_widow:
      display_name: 聪明小伙子的母亲
      tts: {delivery: 关切而明理, timbre: 温厚成熟, pace: 从容, pitch: 中低音}
    raven:
      display_name: 乌鸦
      tts: {delivery: 尖利而急切, timbre: 清脆幽暗, pace: 快, pitch: 中高音}
    fairy:
      display_name: 仙女
      tts: {delivery: 慈祥而洞悉一切, timbre: 苍老明澈, pace: 不疾不徐, pitch: 中音}
  chapters:
    - id: ch01
      title: 两兄弟出门寻运气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，两个寡妇租了农夫的一小块地过活。一个有两个儿子，另一个只有一个。后来，有两个儿子的寡妇觉得，孩子们该出门碰碰运气了。她先把大儿子叫到跟前。
        - id: ch01-b02
          speaker: mother
          text: 拿水罐去井边打水吧，我给你烤一张路上吃的饼。水带得多，饼就大；水带得少，饼就小。你出门时，我能给你的只有这张饼。
        - id: ch01-b03
          speaker: narrator
          text: 大儿子把罐子装满，可罐底有破洞。等他回到家，水已经漏掉大半，母亲只烤出一张很小的饼。她让儿子自己选。
        - id: ch01-b04
          speaker: mother
          text: 你可以拿半张饼，带上我的祝福；也可以拿整张饼，不过要受我的诅咒。
        - id: ch01-b05
          speaker: elder_son
          text: 前面的路也许很远，我还不知道什么时候才能再找到吃的。我要整张饼，就算连您的诅咒也一起带走。
        - id: ch01-b06
          speaker: narrator
          text: 母亲把整张饼和诅咒都给了他。临行前，他把弟弟拉到一旁，交给弟弟一把刀。
        - id: ch01-b07
          speaker: elder_son
          text: 替我收好，每天早晨看一眼。刀身只要还亮着，我就平安无事；要是变暗生锈，我一定遭了祸。
        - id: ch01-b08
          speaker: narrator
          text: 大儿子走了两天，第三天下午遇见一个牧羊老人。他问羊群属于谁，老人唱道。
        - id: ch01-b09
          speaker: shepherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。听说命中注定有个人会取他性命，只是那人还没有降生，但愿他迟迟不要降临。
        - id: ch01-b10
          speaker: narrator
          text: 他继续赶路，又遇见放猪的白发老人。小伙子问那些猪是谁的，老人唱出了同一首歌。
        - id: ch01-b11
          speaker: swineherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。听说命中注定有个人会取他性命，只是那人还没有降生，但愿他迟迟不要降临。
        - id: ch01-b12
          speaker: narrator
          text: 再往前，他碰见一位放山羊的老人。听到同样的问题，老人也唱了那首歌，随后又特意警告他。
        - id: ch01-b13
          speaker: goatherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。听说命中注定有个人会取他性命，只是那人还没有降生，但愿他迟迟不要降临。接下来遇到的野兽，你可千万当心。它们跟你见过的任何野兽都不一样。
    - id: ch02
      title: 红巨魔的城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不久，一大群怪兽出现在路上。每头怪兽都有两个脑袋，每个脑袋上又长着四只角。小伙子吓得拼命逃跑，直到一座小山包上的城堡出现在眼前。他冲进敞开的大门，看见一个老婆子坐在厨房的炉火旁，便求她留自己过夜。
        - id: ch02-b02
          speaker: castle_woman
          text: 你可以留下，可这地方不安全。城堡属于红巨魔。那怪物长着三个脑袋，活人只要落到他手里，谁也活不了。
        - id: ch02-b03
          speaker: narrator
          text: 小伙子本想离开，又怕外面的怪兽，只好央求老婆子把他藏好。他打算熬过一夜，天一亮就逃。可是没过多久，红巨魔回来了，一进门便大声嚷起来。
        - id: ch02-b04
          speaker: red_etin
          text: 里里外外嗅一嗅，凡人的气味钻进鼻头！不管他是活人还是死尸，今晚都拿他的心给面包调味！
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 怪物很快找到小伙子，把他拖了出来，说只要能答对三个问题，就饶他一命。
        - id: ch02-b06
          speaker: red_etin
          text: 爱尔兰和苏格兰，哪里先有居民？男人是为女人造的，还是女人为男人造的？人和野兽，又是哪一种先被造出来？
        - id: ch02-b07
          speaker: narrator
          text: 小伙子一个问题也答不出。红巨魔抡起狼牙棒，朝他头上一击，把他变成了一根石柱。
        - id: ch02-b08
          speaker: narrator
          text: 第二天早晨，弟弟取出那把刀，发现刀身已经锈得通体褐红。他难过极了，却还是去告诉母亲自己的决定。
        - id: ch02-b09
          speaker: younger_son
          text: 哥哥已经出了事。现在该轮到我出门了。
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: 母亲也让他拿破水罐去打水。带回来的水和哥哥一样少，饼也烤得一样小。弟弟同样选择了带着诅咒拿走整张饼。他走上哥哥走过的路，哥哥遭遇的一切，也全都在他身上重演了一遍。
    - id: ch03
      title: 有祝福的半张饼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 另一个寡妇和她的儿子从仙女那里听说了这件事。小伙子决定出门，看看能否救回两个朋友。母亲也递给他一个水罐。
        - id: ch03-b02
          speaker: second_widow
          text: 到井边打些水回来吧，我给你烤一张路上吃的饼。
        - id: ch03-b03
          speaker: narrator
          text: 小伙子装了水，正往家走，头顶的乌鸦忽然叫了起来。
        - id: ch03-b04
          speaker: raven
          text: 低头看看！水正从罐子里往外漏呢！
        - id: ch03-b05
          speaker: narrator
          text: 他一看果然如此，马上用泥堵住破洞，带回了足够烤一张大饼的水。母亲也让他在整张饼和半张饼之间选择。
        - id: ch03-b06
          speaker: second_widow
          text: 整张饼带着我的诅咒，半张饼带着我的祝福。你要哪一样？
        - id: ch03-b07
          speaker: prudent_youth
          text: 我要有您祝福的那一半。
        - id: ch03-b08
          speaker: narrator
          text: 这半张饼，竟比前两个小伙子得到的饼加起来还大。他带着饼走了很远，路上遇见一个老婆婆。
        - id: ch03-b09
          speaker: fairy
          text: 小伙子，能分我一点燕麦饼吗？
        - id: ch03-b10
          speaker: prudent_youth
          text: 当然可以，我很乐意分给您。
        - id: ch03-b11
          speaker: narrator
          text: 他切下一块饼送给老婆婆。原来她是一位仙女。作为回报，她送给他一根魔棍。
        - id: ch03-b12
          speaker: fairy
          text: 好好使用这根棍子，往后它会帮上你的忙。我还要告诉你，前面会遇到什么，以及每一件事该怎样应对。
        - id: ch03-b13
          speaker: narrator
          text: 仙女把该说的全告诉了他，转眼便消失不见。小伙子继续赶路，来到牧羊老人面前。他问羊群是谁的，老人又唱起来。
        - id: ch03-b14
          speaker: shepherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。可如今他的末日已经临近，命运来到面前。而你，我看得清清楚楚，将继承他的全部田产。
        - id: ch03-b15
          speaker: narrator
          text: 小伙子又去问放猪老人和放山羊老人。两个人也各自唱了同样的歌谣。
        - id: ch03-b16
          speaker: swineherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。可如今他的末日已经临近，命运来到面前。而你，我看得清清楚楚，将继承他的全部田产。
        - id: ch03-b17
          speaker: goatherd
          text: >-
            爱尔兰的红巨魔，从前住在贝利根。他抢走美丽苏格兰马尔科姆王的女儿，把她捆在长凳上，天天用银杖抽打。他像罗马人朱利安，谁也不怕。可如今他的末日已经临近，命运来到面前。而你，我看得清清楚楚，将继承他的全部田产。
    - id: ch04
      title: 三个问题与三个脑袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 聪明的小伙子来到怪兽群前，没有停步，也没有逃跑。他大胆地从怪兽中间穿过。一头怪兽张开血盆大口，咆哮着扑向他。他挥起魔棍，只打了一下，怪兽便死在脚边。
        - id: ch04-b02
          speaker: narrator
          text: 到了红巨魔的城堡，他敲门进去。炉边的老婆子把两兄弟的下场告诉了他，又提醒他红巨魔有多么可怕。小伙子毫不退缩。没过多久，巨魔便回来了。
        - id: ch04-b03
          speaker: red_etin
          text: 里里外外嗅一嗅，凡人的气味钻进鼻头！不管他是活人还是死尸，都拿他的心给面包调味！
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 红巨魔一眼看见小伙子，叫他走到屋子中央。
        - id: ch04-b05
          speaker: red_etin
          text: 爱尔兰和苏格兰，哪里先有居民？男人是为女人造的，还是女人为男人造的？人和野兽，哪一种先被造出来？
        - id: ch04-b06
          speaker: narrator
          text: 仙女已经把答案全教给了小伙子，所以三道题他一一答对。红巨魔这才明白，自己的力量已经消失。小伙子拿起斧头，一口气砍掉了怪物的三个脑袋。
        - id: ch04-b07
          speaker: prudent_youth
          text: 请带我去找国王的女儿吧。
        - id: ch04-b08
          speaker: narrator
          text: 老婆子领他上楼，打开一扇又一扇门。每扇门后，都走出一位被红巨魔囚禁的美丽姑娘，其中一位正是国王的女儿。随后，老婆子又把他带到楼下一间低矮的屋子。里面立着两根石柱。小伙子用魔棍轻轻一碰，两个朋友兼邻居立刻恢复了生命。
    - id: ch05
      title: 众人重获自由
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 所有囚徒都为重获自由欢喜不已。他们知道，这全是聪明谨慎的小伙子的功劳。第二天，众人一起向王宫出发，一路上组成了一支神气非凡的队伍。
        - id: ch05-b02
          speaker: narrator
          text: 国王把女儿嫁给救她的小伙子，又让另外两个年轻人各自迎娶了一位贵族小姐。从此以后，他们全都快快乐乐地过完了一生。这个故事，收在钱伯斯的《苏格兰民间传说》里。
