  chapters:
    - id: ch01
      title: Felicia's Inheritance
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a poor laborer. He felt that he did not have long to live, and he wanted to divide his few possessions between the son and daughter he dearly loved. So he called both children to his side.
        - id: ch01-b02
          speaker: laborer
          text: Your mother brought two stools and a straw bed when we married. I also have a hen, a pot of pinks, and a silver ring. A noble lady gave me those last three things when she stayed in this poor cottage. Before she left, she told me to guard her gifts carefully. I must never lose the ring or forget to water the pinks.
        - id: ch01-b03
          speaker: laborer
          text: She promised that my daughter would grow more beautiful than anyone I had ever seen. She told me to name you Felicia, and to give you the ring and the pinks when you grew up, so they could comfort you in your poverty. Take them now, my dear child. Your brother will have everything else.
        - id: ch01-b04
          speaker: narrator
          text: Both children seemed content with their shares. When their father died, they wept for him and divided the possessions exactly as he had directed. Felicia still believed her brother loved her. But when she sat down on one of the stools he had inherited, Bruno spoke angrily.
        - id: ch01-b05
          speaker: bruno
          text: Keep your pinks and your ring, and leave my things alone. I want my house kept in order.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Felicia was too gentle to argue. She rose from the stool without a word and quietly began to cry, while Bruno made himself comfortable beside the fire. When supper time came, he cooked a delicious egg for himself. After eating it, he tossed the empty shell to his sister.
        - id: ch01-b07
          speaker: bruno
          text: That is all you will get from me. If you do not like it, catch some frogs. There are plenty in the marsh nearby.
        - id: ch01-b08
          speaker: narrator
          text: Again, Felicia gave him no answer. Her tears only came harder. She left Bruno and went away to her own little room. The sweet scent of the pinks filled it, so she went close to the flowers and spoke to them sadly.
        - id: ch01-b09
          speaker: felicia
          text: Beautiful pinks, you are so sweet and pretty. You are all the comfort I have left. I will care for you and water you well. I will never let a cruel hand tear you from your stems.
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: As she leaned close, she saw how dry they were. She took her pitcher and ran through the clear moonlight to a distant fountain. She had just sat on its edge to rest when a stately lady approached with many attendants. Six maids carried her train, and she leaned on the arm of another.
        - id: ch01-b11
          speaker: narrator
          text: Near the fountain, the attendants spread a canopy and set beneath it a sofa made of cloth-of-gold. Soon they served a delicate supper on a table covered with gold and crystal dishes. Wind moved through the trees, and the falling water murmured the softest music.
    - id: ch02
      title: The Queen at the Fountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Felicia stayed hidden in the deep shade near the tree. Everything she saw astonished her so much that she did not dare to move. Yet after a few moments, the Queen caught sight of the young shepherdess.
        - id: ch02-b02
          speaker: queen_of_the_woods
          text: I believe there is a shepherdess by that tree. Ask her to come here.
        - id: ch02-b03
          speaker: narrator
          text: Felicia stepped forward and greeted the Queen timidly, yet so gracefully that everyone was surprised.
        - id: ch02-b04
          speaker: queen_of_the_woods
          text: What brings you here, pretty child? Are you not frightened of robbers?
        - id: ch02-b05
          speaker: felicia
          text: Madam, a poor shepherdess with nothing to lose has no reason to fear robbers.
        - id: ch02-b06
          speaker: queen_of_the_woods
          text: Then you are not very rich?
        - id: ch02-b07
          speaker: felicia
          text: I am so poor that a pot of pinks and a silver ring are everything I own.
        - id: ch02-b08
          speaker: queen_of_the_woods
          text: But you have a heart. What would you say if someone tried to steal that?
        - id: ch02-b09
          speaker: felicia
          text: I do not know what losing a heart feels like, madam. But I have heard that no one can live without one, and that a broken heart can make a person die. Poor as I am, I would still be sorry to stop living.
        - id: ch02-b10
          speaker: queen_of_the_woods
          text: You are right to guard your heart, pretty one. Now tell me, have you eaten supper?
        - id: ch02-b11
          speaker: felicia
          text: No, madam. My brother ate all the food there was.
        - id: ch02-b12
          speaker: narrator
          text: The Queen ordered her attendants to make a place for Felicia at the table. Then she filled the girl's plate with good things herself. But Felicia was still so astonished by the company and all its splendor that she could hardly feel hungry. After a while, the Queen asked what had brought her to the fountain so late at night.
        - id: ch02-b13
          speaker: felicia
          text: I came to fetch a pitcher of water for my pinks, madam.
        - id: ch02-b14
          speaker: narrator
          text: Felicia stooped to pick up the pitcher standing beside her. The plain vessel she had carried from home had become solid gold and now sparkled with great diamonds. Even the water had changed. Its fragrance was sweeter than the sweetest roses. Felicia stared in amazement and was afraid to take the pitcher away.
        - id: ch02-b15
          speaker: queen_of_the_woods
          text: It belongs to you, Felicia. Water your pinks with it, and let it remind you that the Queen of the Woods is your friend.
        - id: ch02-b16
          speaker: narrator
          text: Felicia fell at the Queen's feet and humbly thanked her.
        - id: ch02-b17
          speaker: felicia
          text: Madam, if you will wait for just a moment, I will bring you my pot of pinks. No one could care for them better than you.
        - id: ch02-b18
          speaker: queen_of_the_woods
          text: Go, Felicia. I will wait until you return.
        - id: ch02-b19
          speaker: narrator
          text: The Queen gently stroked her cheek. Felicia took the pitcher and ran home. While she had been gone, Bruno had stolen the pot of pinks and left a large cabbage in its place. At the sight of it, Felicia was deeply upset. At last, she hurried back to the fountain and knelt before the Queen.
        - id: ch02-b20
          speaker: felicia
          text: Madam, Bruno has taken my pot of pinks. I have nothing left but my silver ring, and I beg you to accept it as a sign of my gratitude.
        - id: ch02-b21
          speaker: queen_of_the_woods
          text: If I take your ring, pretty shepherdess, you will have nothing at all. What will you do then?
        - id: ch02-b22
          speaker: felicia
          text: Madam, if I have your friendship, I shall manage very well.
        - id: ch02-b23
          speaker: narrator
          text: The Queen accepted the ring and slipped it onto her finger. Then she mounted a chariot made of coral and studded with emeralds. Six milk-white horses drew her away through the woods. Felicia stood watching until the chariot followed a bend in the forest path and disappeared. Only then did she walk back to the cottage, thinking over every wonderful thing that had happened.
    - id: ch03
      title: The Cabbage and the Hen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As soon as Felicia reached her room, she threw the cabbage out the window.
        - id: ch03-b02
          speaker: cabbage_guard
          text: Oh! You have nearly killed me!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The odd little voice startled Felicia. She could not tell where it came from, because cabbages do not usually speak.
        - id: ch03-b04
          speaker: narrator
          text: As soon as daylight came, Felicia went outside to search for her beloved pot of pinks. Before she found any sign of the flowers, she came upon the unfortunate cabbage she had thrown from the window. She gave it a push with her foot and demanded an answer.
        - id: ch03-b05
          speaker: felicia
          text: What are you doing here? How dare you take the place of my pot of pinks?
        - id: ch03-b06
          speaker: cabbage_guard
          text: I was carried there. I certainly would not have chosen to go myself. Plant me beside my companions again, and I will tell you where your pinks are. Bruno has hidden them in his bed.
        - id: ch03-b07
          speaker: narrator
          text: Hearing a cabbage answer made Felicia shiver with fear. Learning where Bruno had hidden the flowers left her in despair, because she could not imagine how she would get them back. Even so, she kept her word and kindly planted the cabbage beside all his old companions. As she pressed the last earth around him, Bruno's hen came into view. Felicia reached out and caught hold of it.
        - id: ch03-b08
          speaker: felicia
          text: Come here, you horrid little creature! You will pay for all my brother's cruelty to me.
          emotion: angry
        - id: ch03-b09
          speaker: hen_nurse
          text: Please do not kill me, shepherdess! I do love to gossip, and I can tell you astonishing things you will want to hear. You are not really the daughter of the poor laborer who raised you. Your mother was a queen with six daughters. The King threatened to cut off her head unless she gave him a son to inherit his kingdom.
          emotion: fearful
        - id: ch03-b10
          speaker: hen_nurse
          text: When the Queen bore another girl, she was terrified. Her sister was a fairy, and they agreed to exchange the baby princess for the fairy's little son. The King had shut the Queen inside a great tower. Many days passed without word from the Fairy, so the Queen escaped through a window on a rope ladder, carrying her baby with her.
        - id: ch03-b11
          speaker: hen_nurse
          text: She wandered until cold and weariness nearly killed her, and then she reached this cottage. I was the laborer's wife, and I knew how to nurse a child. The Queen placed you in my care and told me all her troubles. Before she could say what should happen to you, she died.
        - id: ch03-b12
          speaker: hen_nurse
          text: I could never keep a secret. I told the whole strange story to my neighbors. One day, a beautiful lady visited, and I told her too. When I finished, she touched me with her wand. In an instant, I became a hen, and that ended my talking. I was miserable. My husband was away when it happened, and he never learned where I had gone. He searched everywhere, then decided I had drowned or been eaten by wild beasts in the forest.
        - id: ch03-b13
          speaker: hen_nurse
          text: That same lady returned later. She ordered your father to call you Felicia and left the ring and the pot of pinks for you. While she was inside, twenty-five of the King's guards came looking for you. They surely meant to kill you. The lady murmured a few words, and every guard became a cabbage. You threw one of them from your window yesterday.
        - id: ch03-b14
          speaker: hen_nurse
          text: I cannot explain how that cabbage spoke. None of them had ever said a word before, and neither had I until today.
        - id: ch03-b15
          speaker: narrator
          text: By the end of this strange history, the girl knew that she had been born a princess. She had heard how her true mother died, how her nurse became a hen, and how the soldiers became cabbages. The whole story left her greatly astonished.
        - id: ch03-b16
          speaker: felicia
          text: My poor nurse, I am truly sorry for you. I wish I could give you back your proper form. But we must not lose hope. After everything you have told me, I feel that something will happen soon. For now, I must find my pinks. I love them more than anything in the world.
    - id: ch04
      title: The Rescue of the Pinks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Bruno had gone into the forest. He never imagined Felicia would search his room, and she was delighted to find him away. She expected to recover the flowers easily. But when she entered, a terrible army of rats stood guard around the straw bed. As she moved closer, they leaped at her, biting and scratching fiercely. Felicia backed away in terror.
        - id: ch04-b02
          speaker: felicia
          text: Oh, my dear pinks! How can you stay among such horrible creatures?
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: Then Felicia remembered the golden pitcher and wondered if its water might have magic in it. She ran to fetch it and sprinkled only a few drops over the savage swarm. In a moment, there was not a single tail or whisker to be seen. Every rat had fled to its hole as fast as its legs could carry it. The way to the straw bed was clear, and Felicia could safely take back her pot of pinks.
        - id: ch04-b04
          speaker: narrator
          text: The flowers were almost dead from thirst. Felicia quickly poured the remaining water over them. She bent close, breathing in their lovely scent, and a soft voice seemed to rustle through the leaves.
        - id: ch04-b05
          speaker: prince_pink
          text: Lovely Felicia, the day has finally come when I may tell you that even the flowers love you and rejoice in your beauty.
        - id: ch04-b06
          speaker: narrator
          text: The wonders and terrors of that morning had become too much for Felicia. First a cabbage had spoken, then a hen had told her that she was a princess. After that came the terrible army of rats, and now a voice spoke from among the pinks. Felicia turned very pale and fainted away.
        - id: ch04-b07
          speaker: narrator
          text: Bruno came into the room at that very moment. He had been working hard in the heat, and it had done nothing to improve his temper. The sight of Felicia beside the recovered pinks made him furious. He dragged his unconscious sister outside into the garden and shut the cottage door on her. The fresh air soon revived her. When Felicia opened her eyes, she saw the Queen of the Woods standing before her, looking as charming as ever.
        - id: ch04-b08
          speaker: queen_of_the_woods
          text: Your brother treats you badly. I saw him throw you out. Shall I punish him?
        - id: ch04-b09
          speaker: felicia
          text: Oh, no, madam. I am not angry with him.
        - id: ch04-b10
          speaker: queen_of_the_woods
          text: And what if he is not your brother after all?
        - id: ch04-b11
          speaker: felicia
          text: But I think he must be my brother.
        - id: ch04-b12
          speaker: queen_of_the_woods
          text: What? Have you not heard that you are a princess?
        - id: ch04-b13
          speaker: felicia
          text: Someone told me a little while ago, madam. But how could I believe it without any proof?
        - id: ch04-b14
          speaker: queen_of_the_woods
          text: Dear child, the way you answer tells me that even after your humble upbringing, you are a true princess. I can make sure no one treats you this way again.
        - id: ch04-b15
          speaker: narrator
          text: Before the Queen could say more, a very handsome young man arrived. He wore a green velvet coat fastened with shining emerald clasps, and a crown made of pinks rested on his head. He went straight to the Queen, knelt on one knee before her, and kissed her hand.
        - id: ch04-b16
          speaker: queen_of_the_woods
          text: My pink, my dear son! What joy to see Felicia's care restore your true shape!
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: The Queen embraced him joyfully, then turned to Felicia.
        - id: ch04-b18
          speaker: queen_of_the_woods
          text: Charming Princess, I know everything the hen told you. But you have not heard what happened to my son. The zephyrs were meant to carry him to the tower where your mother waited anxiously. Instead, they left him in a flower garden while they flew off to tell her they had arrived. A fairy who had quarreled with me found him there and changed him into a pink. I could not stop her.
        - id: ch04-b19
          speaker: queen_of_the_woods
          text: I was furious, and I tried to undo her spell, but nothing worked. All I could do was bring Prince Pink to the cottage where you were growing up. I hoped that when you were older, he would love you, and your care would restore him. Everything has happened as I hoped. Giving me your silver ring showed that the charm was almost broken.
        - id: ch04-b20
          speaker: queen_of_the_woods
          text: My enemy had one last chance. She sent the army of rats to frighten you, but she failed. Now, dear Felicia, if you marry my son with this silver ring, your happiness will be secure. Is he handsome and kind enough for you to marry him?
    - id: ch05
      title: Prince Pink
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Felicia blushed before she answered.
        - id: ch05-b02
          speaker: felicia
          text: Madam, your kindness overwhelms me. I know you are my mother's sister. Your magic changed the soldiers who came to kill me into cabbages, and it changed my nurse into a hen. You honor me greatly by asking me to marry your son. Yet I hardly know how to explain why I hesitate. For the first time in my life, I understand how happy it would make me to be loved. Can you truly give me the Prince's heart?
        - id: ch05-b03
          speaker: prince_pink
          text: Lovely Princess, my heart is already yours! That dreadful spell kept me silent. Without it, I would have told you long ago how dearly I love you.
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: The Prince's answer made Felicia very happy. The Queen looked at the poor cotton dress her niece still wore. She could not bear to see a princess dressed like a poor shepherdess any longer, so she raised her wand and spoke.
        - id: ch05-b05
          speaker: queen_of_the_woods
          text: I wish you to be dressed in a way that suits your rank and beauty.
        - id: ch05-b06
          speaker: narrator
          text: At once, Felicia's cotton dress became a magnificent robe of silver brocade embroidered with carbuncles. A diamond crown circled her soft dark hair, and a clear white veil floated from it. Her bright eyes and the lovely color in her cheeks made her so dazzling that the Prince could scarcely bear the sight.
        - id: ch05-b07
          speaker: prince_pink
          text: Felicia, how beautiful you are! Please do not leave me waiting. Say you will marry me.
        - id: ch05-b08
          speaker: queen_of_the_woods
          text: I do not think she will refuse you now.
        - id: ch05-b09
          speaker: narrator
          text: Just then, Bruno came out of the cottage to return to his work. He stopped when he saw Felicia in her silver robe and diamond crown. The sight was so far beyond anything he expected that he thought he must be dreaming. Felicia did not turn away from him. She called him over kindly and begged the Queen to take pity on him.
        - id: ch05-b10
          speaker: queen_of_the_woods
          text: After all the unkindness he showed you?
        - id: ch05-b11
          speaker: felicia
          text: Madam, I am so happy that I want everyone else to be happy too.
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: The Queen kissed her.
        - id: ch05-b13
          speaker: queen_of_the_woods
          text: Very well. To please you, I will see what can be done for this cross Bruno.
        - id: ch05-b14
          speaker: narrator
          text: She waved her wand. The poor cottage became a splendid palace filled with treasure. Only the two stools and the straw bed stayed as they were, so Bruno would remember his old poverty. Then the Queen touched Bruno himself and made him gentle, polite, and grateful. He thanked the Queen and Felicia over and over.
        - id: ch05-b15
          speaker: narrator
          text: Last of all, the Queen restored the hen and the cabbages to their natural forms. She left everyone content. Prince Pink and Felicia married as soon as possible in a splendid celebration.
        - id: ch05-b16
          speaker: narrator
          text: And they lived happily ever after.
