audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    laborer:
      display_name: 贫苦的雇工
      tts: {delivery: 慈爱诚恳而略显虚弱, timbre: 温和沧桑, pace: 舒缓, pitch: 中低音}
    felicia:
      display_name: 费利西娅
      tts: {delivery: 温柔真挚而有分寸, timbre: 清亮年轻, pace: 从容, pitch: 中高音}
    bruno:
      display_name: 布鲁诺
      tts: {delivery: 粗暴急躁而直率, timbre: 粗粝年轻, pace: 稍快, pitch: 中低音}
    queen_of_the_woods:
      display_name: 森林女王
      tts: {delivery: 高贵慈和而笃定, timbre: 丰润明亮, pace: 从容, pitch: 中音}
    cabbage_guard:
      display_name: 卷心菜卫兵
      tts: {delivery: 委屈中带着热心, timbre: 清脆成熟, pace: 中等, pitch: 中音}
    hen_nurse:
      display_name: 母鸡奶妈
      tts: {delivery: 健谈亲切而坦率, timbre: 明快成熟, pace: 轻快, pitch: 中高音}
    prince_pink:
      display_name: 石竹王子
      tts: {delivery: 热烈真诚而彬彬有礼, timbre: 温暖年轻, pace: 从容, pitch: 中音}
  chapters:
    - id: ch01
      title: 父亲留下的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个贫苦的雇工。他知道自己的日子不多了，便把心爱的儿女叫到床前，想分一分仅有的家当。
        - id: ch01-b02
          speaker: laborer
          text: 你们的母亲嫁给我时，只带来两张凳子和一张草垫床。我还有一只母鸡、一盆石竹花和一枚银戒指，那是从前借住在这里的一位贵妇送的。她叮嘱我守好戒指，别忘了给花浇水。
        - id: ch01-b03
          speaker: laborer
          text: 她还说，我的女儿会长成世上最美的姑娘，要取名费利西娅。等你长大，戒指和石竹花就归你，好在贫苦的日子里安慰你。亲爱的孩子，现在拿去吧，其他东西都留给你哥哥。
        - id: ch01-b04
          speaker: narrator
          text: 两个孩子似乎都满意。父亲去世后，他们伤心地哭了一场，又照父亲的吩咐分好家当。费利西娅一直以为哥哥疼爱自己，谁知她刚在那两张凳子中的一张上坐下，布鲁诺就冲她发起火来。
        - id: ch01-b05
          speaker: bruno
          text: 你有自己的石竹花和戒指，别再碰我的东西。我不许家里乱七八糟。
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 费利西娅性情温顺，一句也没有争辩，只默默站起身，一边悄悄流泪。布鲁诺却舒舒服服地坐在火边。到了晚饭时间，他给自己弄了一只香喷喷的鸡蛋，吃完又把空蛋壳扔给妹妹。
        - id: ch01-b07
          speaker: bruno
          text: 我只能给你这个。不爱吃就到外面捉青蛙，附近的沼泽里有的是。
        - id: ch01-b08
          speaker: narrator
          text: 费利西娅没有回答，眼泪却流得更厉害了。她独自回到自己的小屋，甜美的石竹花香立刻围住了她。她走到花盆前，伤心地对花儿说起话来。
        - id: ch01-b09
          speaker: felicia
          text: 美丽的石竹花，你们又香又好看，是我仅有的安慰。我会好好浇水、照顾你们，绝不让残忍的手把你们扯下来。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 她俯下身，这才看见花盆里的泥土已经干透，赶紧提起水罐，踏着明亮的月光跑向远处的泉水。到了那里，她刚在泉边坐下歇脚，就看见一位气度高贵的夫人缓缓走来，身旁簇拥着许多侍从。六名宫女替她托着长长的裙裾，她自己则挽着另一名宫女的手臂。
        - id: ch01-b11
          speaker: narrator
          text: 一行人来到泉边，侍从们为她撑起华盖，在下面摆好一张金线织成的长榻。不一会儿，精美的晚餐也端上了桌，所有菜肴都盛在金盘与水晶器皿里。风吹过树林，泉水从旁边轻轻落下，两种声音合在一起，仿佛奏着世上最柔美的音乐。
    - id: ch02
      title: 泉边的森林女王
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 费利西娅躲在树影里，惊奇得一动也不敢动。没过多久，那位女王发现了她。
        - id: ch02-b02
          speaker: queen_of_the_woods
          text: 树边好像有个牧羊姑娘，请她过来吧。
        - id: ch02-b03
          speaker: narrator
          text: 费利西娅怯生生地上前行礼，姿态却优雅得让所有人都吃了一惊。
        - id: ch02-b04
          speaker: queen_of_the_woods
          text: 漂亮的孩子，这么晚了，你在这里做什么？难道不怕强盗吗？
        - id: ch02-b05
          speaker: felicia
          text: 夫人，我只是个穷牧羊姑娘，什么也没有，自然不怕强盗来抢。
        - id: ch02-b06
          speaker: queen_of_the_woods
          text: 看来你并不富有，是吗？
        - id: ch02-b07
          speaker: felicia
          text: 我全部的家当，就是一盆石竹花和一枚银戒指。
        - id: ch02-b08
          speaker: queen_of_the_woods
          text: 可你还有一颗心。若有人想偷走它，你怎么办？
        - id: ch02-b09
          speaker: felicia
          text: 我不知道失去一颗心是什么滋味。可人们说，没有心就活不成，心碎了也会死。我虽然贫穷，却还舍不得离开这个世界。
        - id: ch02-b10
          speaker: queen_of_the_woods
          text: 那就好好守住你的心吧。告诉我，你吃过晚饭了吗？
        - id: ch02-b11
          speaker: felicia
          text: 没有，夫人。所有晚饭都让哥哥吃光了。
        - id: ch02-b12
          speaker: narrator
          text: 女王立刻命人在桌边添了座位，还亲手往费利西娅的盘里放满各种美食。可眼前的一切实在太新奇，姑娘惊讶得连饥饿都忘了，几乎一口也吃不下。过了一会儿，女王又问她，为什么这么晚还独自来到泉边。
        - id: ch02-b13
          speaker: felicia
          text: 我的石竹花渴坏了，我来给它们取一罐水。
        - id: ch02-b14
          speaker: narrator
          text: 她说着弯下腰，捧起一直放在身边的水罐。可拿给女王看时，她才惊讶地发现，原本普通的罐子已经变成黄金，罐身缀满闪亮的大钻石。就连满满一罐水也变了，闻起来比最芬芳的玫瑰还香。费利西娅望着它，害怕得不敢再拿走。
        - id: ch02-b15
          speaker: queen_of_the_woods
          text: 这是你的，费利西娅。拿去给花浇水吧。以后看见它，别忘了森林女王是你的朋友。
        - id: ch02-b16
          speaker: narrator
          text: 费利西娅伏倒在女王脚边，谦恭地感谢她这番慈爱的承诺。她忽然很想把自己最珍贵的礼物也送给女王。
        - id: ch02-b17
          speaker: felicia
          text: 夫人，请您稍等一会儿。我马上把石竹花取来送给您，因为谁也不会比您更值得托付。
        - id: ch02-b18
          speaker: queen_of_the_woods
          text: 去吧，费利西娅。我在这里等你回来。
        - id: ch02-b19
          speaker: narrator
          text: 女王轻轻抚过她的脸颊。费利西娅提起水罐，飞快跑回自己的小屋。可就在她离开的这段时间里，布鲁诺已经进过房间，偷走了石竹花，只在原处留下一棵大卷心菜。费利西娅看见它，难过得没了主意。最后，她只好跑回泉边，跪在女王面前说明发生了什么。
        - id: ch02-b20
          speaker: felicia
          text: 布鲁诺偷走了我的花。如今我只剩这枚银戒指，请您收下，让它替我表达谢意吧。
        - id: ch02-b21
          speaker: queen_of_the_woods
          text: 可我若拿走戒指，你便一无所有了。以后怎么办呢？
        - id: ch02-b22
          speaker: felicia
          text: 只要拥有您的友谊，我就已经足够幸运了。
        - id: ch02-b23
          speaker: narrator
          text: 女王接过银戒指，戴在自己的手指上。随后，她登上一辆珊瑚制成、镶满祖母绿的华美车驾，由六匹乳白色骏马拉着离去。费利西娅一直站在原地望着，直到车驾转过曲折的林间小路，彻底消失在视线里。她这才慢慢回到小屋，心里还在反复想着女王、金水罐和这一夜的种种奇遇。
    - id: ch03
      title: 会说话的卷心菜与母鸡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 费利西娅回房后，立刻把卷心菜扔出窗外。外面却响起一个古怪的细嗓门。
        - id: ch03-b02
          speaker: cabbage_guard
          text: 哎哟，你差点把我摔死啦！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 费利西娅吓了一跳，却怎么也找不到说话的人，因为她从没听说过卷心菜会开口。天一亮，她就惦记着被偷走的石竹花，马上出门寻找。可她最先看见的又是那棵倒霉的卷心菜。她走过去，用脚推了推它。
        - id: ch03-b04
          speaker: felicia
          text: 你怎么跑到这里来了？又怎么敢占掉我石竹花的位置？
        - id: ch03-b05
          speaker: cabbage_guard
          text: 是别人把我搬过去的，我自己才不想去。你若肯把我栽回同伴身边，我就告诉你，石竹花正藏在布鲁诺的床里。
        - id: ch03-b06
          speaker: narrator
          text: 听说花盆藏在哥哥的床里，费利西娅急坏了，因为她不知道怎样才能把它取回来。可她没有忘记卷心菜提出的请求，还是好心地把它抱回菜地，栽在从前那群同伴身边。她刚把根边的土按好，就看见布鲁诺的母鸡从旁经过，于是伸手一把抓住了它。
        - id: ch03-b07
          speaker: felicia
          text: 你这讨厌的小东西，布鲁诺对我那么坏，我要叫你替他受罚！
          emotion: angry
        - id: ch03-b08
          speaker: hen_nurse
          text: 牧羊姑娘，别杀我！我嘴巴虽不严，却知道几件会让你惊讶的事。那个穷雇工并不是你的亲生父亲。你的母亲是一位王后，已经生过六个女儿。国王威胁她，若再生不出继承王位的儿子，就砍掉她的脑袋。
          emotion: fearful
        - id: ch03-b09
          speaker: hen_nurse
          text: 王后后来又生下一个女儿，吓得不得了，只好和做仙女的姐姐约定，用女婴交换姐姐的小儿子。国王早已下令把她锁在高塔里。她等了许多天，始终不见仙女的消息，只得带着你顺绳梯逃出窗口。她抱着婴儿四处流浪，冻得半死，也累得半死，最后才找到这间小屋。
        - id: ch03-b10
          speaker: hen_nurse
          text: 那时我是雇工的妻子，也很会照顾婴儿。王后把你交给我照料，又把自己遭遇的所有不幸都讲给我听。她还来不及说明以后该怎样安置你，就去世了。可我这一辈子从来守不住秘密，忍不住把这段奇事说给邻居听。后来一位美丽的夫人来到这里，我连她也没有瞒。
        - id: ch03-b11
          speaker: hen_nurse
          text: 那位夫人听完，举起手里的魔杖碰了我一下。我当场变成母鸡，从此再也说不出话，心里不知有多难过。事情发生时，我丈夫恰好外出。他回来后找遍了各处，始终不见我的踪影，最后只当我掉进水里淹死了，或被森林里的野兽吃掉了。那位夫人后来又到这里，吩咐人们给你取名费利西娅，并留下戒指和石竹花，等你长大后交给你。
        - id: ch03-b12
          speaker: hen_nurse
          text: 就在那时，国王派来的二十五名卫兵闯进屋里找你，想必是要杀你。夫人只低声念了几句话，他们便全变成卷心菜。昨天被你扔出窗外的，正是其中一个。奇怪的是，在这么多年里，我从没听它们任何一个说过话，自己也始终只能咯咯叫，直到今天才终于重新开口。
        - id: ch03-b13
          speaker: felicia
          text: 我可怜的奶妈，听见你的遭遇，我真难过。要是我能让你恢复原形就好了。不过，别绝望。照你说的这些事来看，新的变化很快就会发生。现在我得先去找回石竹花，它们是我最珍爱的东西。
        - id: ch03-b14
          speaker: narrator
          text: 布鲁诺恰好进了森林。他根本没料到妹妹会搜他的房间。费利西娅见哥哥意外不在家，高兴极了，还以为自己不用再费什么力气，就能拿回花盆。可是门一开，一支凶恶的老鼠大军便出现在眼前，严严实实地守着那张草垫床。她刚想靠近，老鼠们就发疯似的扑上来，又抓又咬。
        - id: ch03-b15
          speaker: felicia
          text: 我心爱的石竹花，你们怎么落进这样一群坏家伙手里了？
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: 费利西娅吓得连忙退开。忽然，她想到了女王送的那只水罐，也许其中藏着魔力。她飞快地把水取来，朝面目凶恶的鼠群洒了几滴。刹那间，所有老鼠都使出浑身力气钻回洞里，连一根胡须、一条尾巴也看不见了。
        - id: ch03-b17
          speaker: narrator
          text: 费利西娅终于能安然拿起花盆。她看见石竹花缺水缺得快要枯死，连忙把罐里剩余的水全都浇上去。随后，她俯下身，安心地闻着那醉人的花香。就在这时，一个柔和的声音响了起来，仿佛正从叶片间窸窣传出。
        - id: ch03-b18
          speaker: prince_pink
          text: 美丽的费利西娅，这一天终于到了。我总算可以告诉你，连花儿也爱着你，也为你的美丽欢喜。
        - id: ch03-b19
          speaker: narrator
          text: 先是卷心菜，再是母鸡，如今连石竹花也开口说话，眼前还出现过一支凶恶可怕的老鼠大军。短短时间里发生的怪事太多了。费利西娅再也承受不住，脸色忽然变得惨白，倒在花盆旁昏了过去。
    - id: ch04
      title: 石竹王子恢复原形
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 布鲁诺偏在这时回来了。烈日下辛苦劳作没有让他的脾气变好一点。他见妹妹竟然找回了石竹花，顿时怒不可遏，把仍旧昏迷的费利西娅拖进花园，关在门外。清新的空气很快唤醒了她。费利西娅睁开眼睛，只见森林女王正站在面前，依旧那样光彩照人。
        - id: ch04-b02
          speaker: queen_of_the_woods
          text: 你哥哥实在太坏了。我看见他赶你出来，要我惩罚他吗？
        - id: ch04-b03
          speaker: felicia
          text: 不，夫人，我并不生他的气。
        - id: ch04-b04
          speaker: queen_of_the_woods
          text: 如果他根本不是你的哥哥，你又会怎么说？
        - id: ch04-b05
          speaker: felicia
          text: 可我想，他一定是我的哥哥呀。
        - id: ch04-b06
          speaker: queen_of_the_woods
          text: 难道你还不知道，自己其实是一位公主？
        - id: ch04-b07
          speaker: felicia
          text: 刚才有人告诉我了，可是没有一点证据，我怎么敢相信呢？
        - id: ch04-b08
          speaker: queen_of_the_woods
          text: 亲爱的孩子，你从小虽过着穷苦生活，言谈却证明你是真正的公主。我能救你，让你再也不受这样的欺负。
        - id: ch04-b09
          speaker: narrator
          text: 话音未落，一位英俊非凡的年轻人忽然走来，打断了她们的谈话。他身穿绿天鹅绒外套，衣襟由祖母绿搭扣系住，头上还戴着一顶鲜艳的石竹花冠。他来到女王跟前，单膝跪下，恭敬地吻了她的手。
        - id: ch04-b10
          speaker: queen_of_the_woods
          text: 我的石竹花，我亲爱的儿子！费利西娅帮助你恢复了原形，我终于又见到你了！
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: 女王满心欢喜地抱住儿子。费利西娅看着眼前这位头戴石竹花冠的年轻人，还不明白他为什么会突然出现。女王于是转过身，把另一段从未有人告诉过她的往事说了出来。
        - id: ch04-b12
          speaker: queen_of_the_woods
          text: 可爱的公主，母鸡讲的事我都知道。她却没有告诉你，我曾命西风精灵把儿子送到高塔，让你的母亲用他交换你。精灵们却把他丢在花园里，自己飞去报信。一个与我结过仇的仙女趁机把他变成石竹花，我怎么也阻止不了。
        - id: ch04-b13
          speaker: queen_of_the_woods
          text: 你可以想见我有多么生气。我到处寻找办法，想解除仇敌施下的祸害，却始终破不了魔咒。最后，我只能把石竹王子带到你长大的地方，盼着你成年之后，他会爱上你，也会因为得到你的照料而恢复原形。如今你看，一切果然像我盼望的那样圆满了。
        - id: ch04-b14
          speaker: queen_of_the_woods
          text: 你把银戒指送给我，正是魔咒力量即将消失的征兆。我的仇敌只剩最后一次机会，于是派出老鼠大军来吓你，可她还是没能得逞。费利西娅，只要你愿意戴着这枚银戒指嫁给我儿子，往后的幸福就有了保证。你觉得他够英俊、性情也够可爱吗？你愿意和他成婚吗？
        - id: ch04-b15
          speaker: felicia
          text: 您的厚爱让我不知如何是好。我知道您是母亲的姐姐，也知道您施展法术，把前来杀我的卫兵变成卷心菜，把我的奶妈变成母鸡。如今您又让我嫁给王子，给我的荣耀已经远远超过我应得的。可我该怎样说明心里的迟疑呢？这是我有生以来第一次明白，被人真心爱着会让我多么幸福。您真的能把王子的心交给我吗？
        - id: ch04-b16
          speaker: prince_pink
          text: 美丽的公主，我的心早已属于你！若不是可恨的魔咒封住了我的嘴，我早就亲口告诉你，我有多爱你。
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 费利西娅听了，满心欢喜。女王却不愿再看她穿着贫寒牧羊姑娘的衣服，便用魔杖碰了碰她。
        - id: ch04-b18
          speaker: queen_of_the_woods
          text: 我要让你的衣着配得上你的身份和美貌。
        - id: ch04-b19
          speaker: narrator
          text: 话音刚落，费利西娅身上的棉布裙立刻化成一袭华丽的银锦长袍，上面绣满红宝石。公主深色而柔软的头发戴上了一顶钻石王冠，冠后垂下洁白透明的面纱。她的双眼明亮，脸颊泛着动人的红晕，整个人光彩夺目，王子看得几乎不敢直视。
        - id: ch04-b20
          speaker: prince_pink
          text: 费利西娅，你真美！求你别再让我悬着心了，快答应嫁给我吧。
        - id: ch04-b21
          speaker: queen_of_the_woods
          text: 我想，她现在不会拒绝你了。
    - id: ch05
      title: 人人都得到幸福
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这时，布鲁诺正要回去干活。他一走出小屋，看见眼前身穿银锦长袍、头戴钻石王冠的费利西娅，还以为自己正在做梦。妹妹却没有记恨他，反而亲切地把他叫到近前，请女王也对他发发慈悲。
        - id: ch05-b02
          speaker: queen_of_the_woods
          text: 他那样狠心地对待你，你还替他求情吗？
          emotion: surprised
        - id: ch05-b03
          speaker: felicia
          text: 夫人，我已经这样幸福了，所以也希望每个人都能幸福。
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 女王吻了吻费利西娅，答应为了她帮助这个坏脾气的布鲁诺。她举起魔杖轻轻一挥，寒酸的小屋顿时变成了珍宝满室、富丽堂皇的宫殿。屋里只有两张凳子和那张草垫床仍是原来的旧模样，好让布鲁诺永远记得自己从前过着怎样的贫穷日子。
        - id: ch05-b05
          speaker: narrator
          text: 女王又用魔杖碰了碰布鲁诺，让他变得温和、有礼，也懂得感恩。他一遍又一遍地向女王与公主道谢。最后，女王让那只母鸡和所有卷心菜都恢复了原来的模样，这才离开，留下了心满意足的众人。
        - id: ch05-b06
          speaker: narrator
          text: 女王的安排一刻也没有耽搁。石竹王子和费利西娅公主很快举行了一场无比隆重、无比华美的婚礼。从此以后，他们彼此相爱，永远幸福地生活在一起。这个故事由奥努瓦伯爵夫人写下，名叫《幸运儿》。
