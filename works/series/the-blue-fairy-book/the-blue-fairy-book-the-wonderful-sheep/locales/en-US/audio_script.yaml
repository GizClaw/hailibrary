  chapters:
    - id: ch01
      title: The Dream in the White Dress
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, in the days when fairies still lived in the world, a king had three daughters. All three were young, clever, and beautiful. The youngest was named Miranda. She was the prettiest of them and the one her father loved best. The King gave Miranda more dresses and jewels in a single month than he gave her sisters in a whole year. But Miranda was generous. She shared every gift with the other two, so there was no jealousy among them. The three sisters were as happy together and as fond of one another as anyone could be.
        - id: ch01-b02
          speaker: narrator
          text: The King had neighbors who were always looking for a quarrel. Tired of leaving him in peace, they finally made war on him with such force that he feared they might defeat him completely. He gathered a great army and marched away to defend his kingdom. His three daughters stayed behind with their governess in a castle. Each day brought fresh news from the war. One day the King had captured a town. Another day he had won a battle. At last word came that he had beaten his enemies, chased them beyond his borders, and was returning as quickly as he could. More than anything, he longed to see his dear little Miranda.
        - id: ch01-b03
          speaker: narrator
          text: The princesses had satin dresses made especially for his return. The eldest wore green, with emeralds to match. The second wore blue, with turquoise jewels. Miranda chose white satin and diamonds. Dressed in all their finery, they went out to meet their father. As they came, they sang verses they had composed about his victories. The King found them so beautiful and joyful that he embraced them tenderly. Yet, as always, Miranda received more kisses than either of her sisters.
        - id: ch01-b04
          speaker: narrator
          text: Soon a splendid banquet was served, and the King sat down with his daughters. He always believed that everything carried some special meaning. Before long, he began wondering what each princess had meant by the color of her dress. He turned first to his eldest daughter.
        - id: ch01-b05
          speaker: king
          text: Why did you choose green today?
        - id: ch01-b06
          speaker: eldest_princess
          text: Sire, when I heard of your victories, I chose green for my joy and for my hope that you would soon return.
        - id: ch01-b07
          speaker: king
          text: That is an excellent answer. And why did you choose blue, my daughter?
        - id: ch01-b08
          speaker: second_princess
          text: Sire, I wanted to show that we never stopped hoping you would succeed. Seeing you again is as welcome to me as a sky full of beautiful stars.
        - id: ch01-b09
          speaker: king
          text: Such wise answers! Miranda, why are you dressed all in white?
        - id: ch01-b10
          speaker: miranda
          text: Because white suits me better than any other color, sire.
        - id: ch01-b11
          speaker: king
          text: What? Is that all you thought about, you vain child?
          emotion: angry
        - id: ch01-b12
          speaker: miranda
          text: I only thought that you would be pleased with me.
        - id: ch01-b13
          speaker: narrator
          text: Because the King loved Miranda so dearly, her simple answer satisfied him. He even pretended he was pleased that she had kept her full reason to herself at first. When the meal was over, he had eaten well, but it was still too early to go to bed. So he asked each daughter to tell him what she had dreamed the night before.
        - id: ch01-b14
          speaker: narrator
          text: The eldest said she had dreamed that her father brought her a dress. Its precious stones and golden embroidery shone more brightly than the sun. The second had dreamed that he brought her a spinning wheel and a distaff, so she could spin thread and make shirts for him. Then it was Miranda's turn to tell her dream.
        - id: ch01-b15
          speaker: miranda
          text: I dreamed that my second sister was getting married. On her wedding day, Father, you held a golden ewer and said, “Come, Miranda. I will hold the water while you dip your hands in it.”
        - id: ch01-b16
          speaker: narrator
          text: The moment he heard the dream, the King became furious. He frowned so horribly and pulled such an ugly face that everyone at the table knew how angry he was. He rose at once and hurried away to bed. But lying there did not help. He could not forget a single word of Miranda's dream.
        - id: ch01-b17
          speaker: king
          text: Does that proud girl want to make me her servant? She wore white satin without one thought for me. She believes I am beneath her notice. I will put an end to these ambitions soon enough!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: His anger grew until he could bear it no longer. Although daylight had not yet come, he sprang from bed in a fury and summoned the Captain of his Bodyguard.
        - id: ch01-b19
          speaker: king
          text: You heard Princess Miranda's dream. I believe it means something dangerous for me. Take her into the forest and kill her. Bring me her heart and tongue as proof. If you deceive me, you will die!
          emotion: angry
    - id: ch02
      title: Three Faithful Friends
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Captain could hardly believe such a barbarous order. He was horrified, but he dared not contradict the King. An argument might make the King still angrier, or persuade him to send a crueler servant in the Captain's place. So he answered that he would fetch the Princess and do exactly as he had been told. At Miranda's room, the servants were unwilling to admit anyone so early. The Captain insisted that the King had sent for her. Miranda rose quickly and came out. A little girl named Patypata held up the train of her dress. Miranda's pet monkey, Grabugeon, and her little dog, Tintin, scampered after them.
        - id: ch02-b02
          speaker: narrator
          text: The Captain asked Miranda to come down into the garden, where he said the King was enjoying the fresh morning air. Once they reached it, he pretended to search among the paths. When the King was nowhere to be found, the Captain said His Majesty had probably strolled into the forest. He opened the little gate that led beyond the garden, and they all passed through. By now the first daylight was beginning to appear. Miranda looked at her guide and saw tears standing in his eyes. His sorrow was so great that he seemed unable to speak.
        - id: ch02-b03
          speaker: miranda
          text: What troubles you? You look terribly sad.
        - id: ch02-b04
          speaker: captain
          text: Alas, Princess, who would not grieve over such an order? The King commanded me to kill you here and bring him your heart and tongue. If I refuse, I will lose my own life.
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: Miranda went pale with terror and began to weep quietly. She looked up at the Captain.
        - id: ch02-b06
          speaker: miranda
          text: Can you truly bring yourself to kill me? I have never harmed you, and I have always spoken well of you to the King. If I had deserved my father's anger, I would bear it without complaint. But I have always loved and respected him. His anger is unjust.
          emotion: fearful
        - id: ch02-b07
          speaker: captain
          text: Do not fear me, Princess. I would rather die than hurt you. But my death would not make you safe. We must convince the King that you are dead.
        - id: ch02-b08
          speaker: miranda
          text: How can we do that? Without my heart and tongue, he will never believe you.
        - id: ch02-b09
          speaker: narrator
          text: Miranda and the Captain were so absorbed in their terrible problem that they had forgotten Patypata was close enough to hear every word. The little girl had listened to it all. Now she hurried forward and threw herself at Miranda's feet.
        - id: ch02-b10
          speaker: patypata
          text: Madam, take my life instead. I would gladly die for a mistress as kind as you.
        - id: ch02-b11
          speaker: miranda
          text: No, Patypata!
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: Miranda kissed her.
        - id: ch02-b13
          speaker: miranda
          text: Your life is as precious to me as my own, especially after such loving devotion.
        - id: ch02-b14
          speaker: grabugeon
          text: You are right to love faithful Patypata, Princess. She can help you far more than I can. Take my heart and tongue instead. I have always wanted to make a famous name for myself in Goblin Land.
        - id: ch02-b15
          speaker: miranda
          text: No, my little Grabugeon. I cannot bear to sacrifice you.
        - id: ch02-b16
          speaker: tintin
          text: I am a good little dog. I will not let either of them die for my mistress. If someone must die for you, it should be me.
        - id: ch02-b17
          speaker: narrator
          text: Patypata, Grabugeon, and Tintin began a fierce argument over which of them should die. Their voices rose higher and higher. At last Grabugeon, who was quicker than either of the others, settled the quarrel herself. She raced to the very top of the nearest tree and threw herself down headfirst. She struck the ground and lay there quite dead.
        - id: ch02-b18
          speaker: narrator
          text: Miranda grieved for her. Since Grabugeon was already dead, she allowed the Captain to take the monkey's tongue. It was no larger than Miranda's thumb. They knew at once it could never deceive the King.
        - id: ch02-b19
          speaker: miranda
          text: Oh, my little monkey! I have lost you, and your death has not saved me at all.
          emotion: sad
        - id: ch02-b20
          speaker: patypata
          text: Then the honor of saving you will be mine.
        - id: ch02-b21
          speaker: narrator
          text: Before anyone could stop her, Patypata seized a knife and cut off her own head. But her tongue was black, and the King would never have mistaken it for Miranda's.
        - id: ch02-b22
          speaker: miranda
          text: How unlucky I am! I lose everyone I love, and still nothing is gained.
          emotion: sad
        - id: ch02-b23
          speaker: tintin
          text: If you had taken my offer, you would only have lost me. Then all your gratitude would have belonged to me.
        - id: ch02-b24
          speaker: narrator
          text: Miranda kissed her little dog and wept so bitterly that Tintin could bear her grief no longer. The faithful dog died for her mistress too. Miranda could not endure the sight of all she had lost, so she turned away and walked deeper into the forest. When she finally looked back, the Captain of the Guard had disappeared. She was alone now, except for Patypata, Grabugeon, and Tintin lying still upon the ground.
        - id: ch02-b25
          speaker: narrator
          text: Miranda could not abandon her friends where they had fallen. At the foot of a tree, she made them a pretty little grave lined with moss. She carved their names into the bark and wrote that all three had died to save her life. Only then did she consider where she might find safety. Her father's castle was so near that the first traveler could recognize her. Worse still, lions and wolves roamed the forest, ready to seize a princess as quickly as a stray chicken. Miranda walked as fast as she could. The forest stretched on without end, and the sun grew unbearably hot. Heat, terror, and weariness nearly overcame her. Whenever a branch moved behind her, she imagined her father racing after her to kill her. She cried as she went, unable to tell which path might lead out. Thorny bushes scratched her cruelly and tore her pretty dress to pieces.
    - id: ch03
      title: The Kingdom Beneath the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last Miranda heard a sheep bleating.
        - id: ch03-b02
          speaker: miranda
          text: There must be shepherds nearby. They can guide me to a village, where I can hide as a peasant girl. Kings and princesses are not always the happiest people. Who could have guessed that I would flee for my life because my father wants me dead for no reason?
        - id: ch03-b03
          speaker: narrator
          text: She followed the sound into a lovely little glade completely surrounded by trees. There lay a great sheep with wool as white as snow and horns that shone like gold. A garland of flowers circled his neck. Strings of large pearls hung around his legs, and diamonds covered his collar. He rested on a bank of orange blossoms beneath a canopy of golden cloth that shaded him from the sun. Nearly a hundred other sheep were scattered across the glade. Strangest of all, not one of them was eating grass. Some drank coffee, lemonade, or sherbet. Others ate ices, strawberries with cream, and sweetmeats, while the rest played games. Many wore golden collars set with jewels and decorated with flowers and ribbons.
        - id: ch03-b04
          speaker: narrator
          text: Miranda stopped in amazement and searched for the shepherd. Then the beautiful sheep bounded toward her.
        - id: ch03-b05
          speaker: sheep_king
          text: Come closer, lovely Princess. You have nothing to fear from animals as gentle and peaceful as we are.
        - id: ch03-b06
          speaker: miranda
          text: What a wonder! A sheep that speaks!
          emotion: surprised
        - id: ch03-b07
          speaker: sheep_king
          text: Your monkey and dog could speak, madam. Why should we surprise you more than they did?
        - id: ch03-b08
          speaker: miranda
          text: A fairy gave them speech, so I was accustomed to hearing them.
        - id: ch03-b09
          speaker: sheep_king
          text: Perhaps a fairy did the same for us. But tell me, Princess, what brought you here?
        - id: ch03-b10
          speaker: miranda
          text: A thousand troubles, Sir Sheep. No princess could be more unhappy. I need somewhere to hide from my father's anger.
          emotion: sad
        - id: ch03-b11
          speaker: sheep_king
          text: Come with me, madam. I know a hiding place that no one else can find, and everything there will be yours to command.
        - id: ch03-b12
          speaker: miranda
          text: I cannot follow you. I am too tired to take another step.
        - id: ch03-b13
          speaker: narrator
          text: The Sheep with the golden horns ordered his chariot to be brought. A moment later, six goats appeared, harnessed to an enormous pumpkin. It was large enough for two passengers, and its inside was lined with soft cushions of velvet and down. Miranda could not help being amused by such a new kind of carriage. She climbed in, and the King of the Sheep took his place beside her. The six goats raced away at full speed. They did not stop until they reached a cavern whose entrance was blocked by a huge stone. The King touched the stone with one foot. It fell down at once, and he invited Miranda to enter without fear.
        - id: ch03-b14
          speaker: narrator
          text: If Miranda had not already been terrified by everything that had happened, nothing could have persuaded her to enter such a dreadful cave. Now she feared whatever might be following behind her so much that she would almost have thrown herself down a well to escape it. She did not hesitate. The Sheep went first, and she followed him down, down, and farther down. The path sank so deep that she began to think they must come out on the other side of the world. She could not even be sure that her guide was not leading her straight into Fairyland.
        - id: ch03-b15
          speaker: narrator
          text: At last a vast plain opened before her. Every part of it was covered with flowers, and their scent was sweeter than anything Miranda had ever smelled. A broad river of orange-flower water flowed around the plain. Fountains of every sort of wine ran in all directions, making pretty little streams and cascades. The trees were stranger still. Along whole avenues, roasted partridges hung ready to eat from every branch. Anyone who preferred pheasants, quails, turkeys, or rabbits had only to turn to the right or the left to find them. In some places, showers of lobster patties, white puddings, sausages, tarts, and every kind of sweetmeat darkened the air. In others, gold, silver, diamonds, and pearls rained down. Such wonders and such comfort would surely have drawn crowds of visitors, if the King of the Sheep had enjoyed company. But by every account, he was as grave and unsociable as a judge.
        - id: ch03-b16
          speaker: narrator
          text: Miranda had arrived during the loveliest part of the year, so there was no stone palace to be seen. Instead, long rows of orange trees, jasmine, honeysuckle, and musk roses made a palace for her. Their interlacing branches formed the prettiest rooms imaginable. Silver and gold gauze hung upon the living walls, with great mirrors, shining candlesticks, and beautiful pictures. The Wonderful Sheep begged Miranda to consider herself queen of everything she saw. For several years, he told her, he had lived in sadness and great trouble. Yet she had the power to make him forget every grief.
        - id: ch03-b17
          speaker: miranda
          text: Noble Sheep, you are so generous that I cannot thank you enough. Still, everything here is so strange that I do not know what to think.
        - id: ch03-b18
          speaker: narrator
          text: As she spoke, a band of lovely fairies came toward her. Each carried an amber basket piled with fruit and held it out as an offering. Miranda reached to take some. The figures glided away from her fingers, and no matter how she tried, her hands could feel nothing at all.
        - id: ch03-b19
          speaker: miranda
          text: Oh! What are they? Who have you brought me among?
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: Miranda began to cry. The King of the Sheep returned at that moment. The sight of her tears distressed him so much that he could have torn out his wool.
        - id: ch03-b21
          speaker: sheep_king
          text: What has happened, lovely Princess? Has anyone treated you without proper respect?
        - id: ch03-b22
          speaker: miranda
          text: No. I am simply not used to sprites or talking sheep, and everything here frightens me. It was kind of you to bring me, but I would be even more grateful if you took me back to the world above.
          emotion: fearful
        - id: ch03-b23
          speaker: sheep_king
          text: Please do not be afraid. Be patient and hear the story of my troubles.
    - id: ch04
      title: The Wonderful Sheep's Story
      blocks:
        - id: ch04-b01
          speaker: sheep_king
          text: I was once a king, and mine was the finest kingdom in the world. My people loved me. My neighbors envied and feared me. Everyone respected me, and they said no king had earned that respect more fully.
        - id: ch04-b02
          speaker: sheep_king
          text: I loved hunting. One day, while I chased a stag, I left all my attendants far behind. The stag leaped into a pool, and I foolishly urged my horse after it. Instead of cool water, I felt a terrible heat. The pool vanished. A deep gulf opened, flames shot upward, and I fell helplessly to the bottom.
        - id: ch04-b03
          speaker: narrator
          text: The Sheep told Miranda that he had believed himself lost. Then a voice spoke through the fire.
        - id: ch04-b04
          speaker: ragotte
          text: Ungrateful Prince! Even these flames can hardly warm your cold heart.
          emotion: angry
        - id: ch04-b05
          speaker: sheep_king
          text: Who is accusing me of coldness in this dreadful place?
        - id: ch04-b06
          speaker: ragotte
          text: Someone who loves you without hope.
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: At the same moment, the flames began to flicker and stopped burning him. In their fading light, the Prince saw Ragotte. He had known the fairy for as long as he could remember, and her ugliness had always filled him with horror. Ragotte leaned upon the arm of a beautiful young girl. Golden chains circled the girl's wrists. One glance was enough to show that she was the fairy's slave.
        - id: ch04-b08
          speaker: sheep_king
          text: Ragotte, what is happening? Did you bring me here?
        - id: ch04-b09
          speaker: ragotte
          text: Whose fault is it that you never understood me before now? Why should a powerful fairy explain herself to someone no greater than an ant beside her, even if he calls himself a king?
        - id: ch04-b10
          speaker: sheep_king
          text: Call me whatever you please. What do you want from me? My crown, my cities, or my treasure?
        - id: ch04-b11
          speaker: ragotte
          text: Treasure? I could make any kitchen servant richer and more powerful than you. I want your heart. Marry me, and I will add twenty kingdoms to yours. You shall have a hundred castles filled with gold, five hundred filled with silver, and anything else you desire.
        - id: ch04-b12
          speaker: sheep_king
          text: Madam Ragotte, a man at the bottom of a pit, expecting to be roasted alive, can hardly think about marrying such a charming lady. Set me free. Then I hope I can give you a proper answer.
        - id: ch04-b13
          speaker: ragotte
          text: If you loved me, the place would not matter. A cave, a forest, a fox's hole, or a desert would suit you just as well. You will not trick me into letting you escape. You will stay here, and your first task will be tending my sheep. They are excellent company and speak every bit as well as you do.
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: Ragotte led him onto the very plain where he and Miranda now stood. She showed him the flock he was meant to tend. But the Prince paid little attention to the sheep, and just as little to Ragotte. He was lost in admiration of the beautiful young slave. The cruel fairy noticed where his eyes had gone. She turned upon the girl with a look so furious and terrible that the poor creature fell lifeless to the ground.
        - id: ch04-b15
          speaker: narrator
          text: The dreadful sight drove the Prince into a rage. He drew his sword and rushed at Ragotte, fully intending to cut off her head. Before he could reach her, the fairy used her magic. Invisible chains held him fast to the very spot where he stood. He fought them with all his strength, but he could not move. At last he threw himself upon the ground in despair. Ragotte looked down at him with a scornful smile.
        - id: ch04-b16
          speaker: ragotte
          text: Now you will learn what my power can do. You think yourself a lion. From this moment, you will be a sheep.
        - id: ch04-b17
          speaker: narrator
          text: Ragotte touched him with her wand. In an instant, the proud king became the sheep Miranda saw before her. The spell did not take away his power of speech. Nor did it dull his mind or his feelings. He understood his strange new shape completely and felt every part of its misery.
        - id: ch04-b18
          speaker: ragotte
          text: You will remain a sheep for five years and rule this pleasant land. I cannot bear to see the face I once loved, so in this shape I may learn to hate you as you deserve.
          emotion: angry
        - id: ch04-b19
          speaker: sheep_king
          text: Then she vanished. If I had not been too wretched to care about anything, I would have rejoiced to see her go.
        - id: ch04-b20
          speaker: sheep_king
          text: The talking sheep welcomed me as their king. They were princes too, each punished for offending the vengeful fairy. Their sentences differ. Now and then, one reaches the end of his appointed years, returns to his true form, and goes back to the upper world.
        - id: ch04-b21
          speaker: sheep_king
          text: The other beings you saw are Ragotte's rivals or enemies. She has imprisoned them for a hundred years or so, but one day they will also be free. The young slave I told you about is one of those prisoners. I saw her often, and for a time the sight of her gave me great pleasure. Yet she never spoke to me. I also knew that if I approached her, I would find only a shadow, and that thought vexed me. Then I noticed one of my fellow sufferers watching the little sprite with great tenderness. I discovered that he had once been her lover, until cruel Ragotte carried him away from her. From that moment, I stopped thinking of the girl. I have cared for nothing except the hope of regaining my freedom.
        - id: ch04-b22
          speaker: sheep_king
          text: I often went into the forest, and that is where I saw you. Sometimes you guided your chariot with wonderful grace and skill. Sometimes you rode to the hunt on a horse so spirited that no one else could have managed it. Sometimes you raced the ladies of your court and always won. Oh, Princess, I have loved you for so long. Yet how can I speak of love? What hope is there for an unhappy sheep like me?
          emotion: sad
        - id: ch04-b23
          speaker: narrator
          text: Miranda was astonished and confused. She hardly knew how to answer. Still, her little speech did not take away his hope. Now that she knew the shadows would live again someday, she said they no longer frightened her.
        - id: ch04-b24
          speaker: miranda
          text: If only poor Patypata, dear Grabugeon, and little Tintin, who all died for me, were as fortunate, I would have nothing else to wish for here.
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: Though the King of the Sheep was a prisoner, he still had certain powers.
        - id: ch04-b26
          speaker: sheep_king
          text: Find the shadows of the little girl, the monkey, and the dog. Bring them here to cheer our Princess.
        - id: ch04-b27
          speaker: narrator
          text: An instant later, Miranda saw her three friends coming toward her. She could not touch them, but their presence filled her with joy. The King of the Sheep was kind and entertaining, and he loved her dearly. In time, Miranda loved him too. He was handsome for a sheep, unfailingly polite and considerate, and she knew he was truly a king whose enchantment would soon end.
        - id: ch04-b28
          speaker: narrator
          text: Her days passed happily as they waited for his freedom. With the whole flock's help, he arranged balls, concerts, and hunts. Even the shadows joined the merriment, pretending they were solid and alive again.
    - id: ch05
      title: The First Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One evening the couriers arrived with news. The King of the Sheep sent for reports with great care, and his messengers always brought back the freshest and best information. This time they announced that Miranda's eldest sister was about to marry a great prince. Nothing could have been more splendid than all the preparations being made for the wedding.
        - id: ch05-b02
          speaker: miranda
          text: How unhappy I am to miss so many beautiful things! I am shut beneath the earth with only sheep and shadows, while my sister will be dressed like a queen and surrounded by everyone who loves her. Everyone but me can go and wish her joy.
          emotion: sad
        - id: ch05-b03
          speaker: sheep_king
          text: Why do you complain, Princess? I never said you could not attend the wedding. Leave whenever you wish. Only promise that you will return. I love you too much to live without you.
        - id: ch05-b04
          speaker: narrator
          text: Miranda was deeply grateful for his permission. She promised faithfully that nothing in the world would prevent her from returning. The King of the Sheep prepared an escort worthy of her royal rank, while Miranda dressed herself splendidly. She remembered every ornament that could add to her beauty. Her chariot was made of mother-of-pearl. Six dun-colored griffins, newly brought from the far side of the world, drew it. A great company of guards rode behind her in magnificent uniforms. Each guard stood at least eight feet tall, and they had come from distant lands for the honor of riding in the Princess's train.
        - id: ch05-b05
          speaker: narrator
          text: Miranda reached her father's palace at the very moment the wedding ceremony began. As soon as she entered, everyone was struck with wonder. Her beauty dazzled them, and so did the splendor of her jewels. She heard exclamations of admiration on every side. Her father stared at her with such close attention that Miranda became afraid he must recognize her. But the King believed without question that his youngest daughter was dead. Because of that certainty, the truth never entered his mind.
        - id: ch05-b06
          speaker: narrator
          text: Afraid she might be stopped, Miranda left before the wedding ended. In her haste, she left a small coral casket set with emeralds. Diamond letters on it said, “Jewels for the Bride.” When the casket was opened, it seemed to hold an endless store of lovely things.
        - id: ch05-b07
          speaker: narrator
          text: The King had hoped to join the unknown princess before she left and discover who she was. When she vanished so suddenly, he was bitterly disappointed. He gave strict orders for the future. If the beautiful stranger ever appeared again, every door in the palace was to be shut before she could slip away so easily.
        - id: ch05-b08
          speaker: narrator
          text: Miranda had not been gone long, but to the King of the Sheep, her absence felt like a hundred years. He waited beside a fountain in the thickest part of the forest, listening for her approach. Around him, the ground was strewn with splendid gifts. He had prepared every one of them to show Miranda how joyful and grateful he was that she had kept her promise and returned.
        - id: ch05-b09
          speaker: narrator
          text: The moment she came into sight, he rushed to meet her, leaping and bounding like a true sheep. He caressed her tenderly, threw himself at her feet, and covered her hands with kisses. Then he told her how uneasy he had been every moment she was away and how impatiently he had waited for her return. He spoke with such feeling and eloquence that Miranda was completely charmed.
    - id: ch06
      title: The Promise Broken
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Some time later, news came that the King's second daughter was also going to marry. Miranda begged the King of the Sheep to let her attend this wedding just as she had attended the first. The request made him deeply sad. A dark feeling warned him that some misfortune must come of this second journey. Still, his love for Miranda was stronger than his fear, and he could not bring himself to refuse her.
        - id: ch06-b02
          speaker: sheep_king
          text: You want to leave me, Princess. That is my unhappy fate, and I do not blame you. You may go. Believe me, I could give no greater proof of my love.
          emotion: sad
        - id: ch06-b03
          speaker: miranda
          text: I will stay only a little while, just as I did before. Please do not worry. If anything delayed me, I would grieve as deeply as you.
        - id: ch06-b04
          speaker: narrator
          text: Miranda set out with the same splendid escort and once again reached the palace just as the marriage ceremony began. Everyone was delighted that the mysterious princess had returned. She looked so beautiful that the guests decided she must be some fairy princess. The princes gathered there could not take their eyes from her.
        - id: ch06-b05
          speaker: narrator
          text: Her father was more pleased than anyone else to see her again. He remembered how quickly she had vanished before and gave orders that every door should be shut and bolted that very minute. When the wedding was almost over, Miranda rose quickly. She hoped to hide herself among the moving crowd and escape without notice. To her great dismay, she found every door firmly fastened.
        - id: ch06-b06
          speaker: narrator
          text: Miranda's fear eased a little when the King came toward her with the greatest respect. He begged her not to run away so soon. At least, he said, she must honor him by staying for the splendid feast prepared for all the princes and princesses. He led her into a magnificent hall where the whole court was assembled. Then the King himself picked up the golden bowl filled with water. He held it before the unknown princess so that she might dip her pretty fingers into it.
        - id: ch06-b07
          speaker: miranda
          text: My dream has come true! On my sister's wedding day, you have offered me water for my hands, and you did it willingly.
          emotion: surprised
        - id: ch06-b08
          speaker: narrator
          text: Miranda fell at his feet. The King recognized her at once. More than once already, he had thought how much this unknown princess resembled the daughter he had lost.
        - id: ch06-b09
          speaker: king
          text: My dear daughter! Can you ever forgive my cruelty? I ordered your death because I thought your dream foretold the loss of my crown. And it did. Your sisters now have kingdoms of their own, and mine shall belong to you.
          emotion: sad
        - id: ch06-b10
          speaker: narrator
          text: He placed his crown upon Miranda's head.
        - id: ch06-b11
          speaker: king
          text: Long live Queen Miranda!
          emotion: happy
        - id: ch06-b12
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: Long live Queen Miranda!
          emotion: happy
        - id: ch06-b13
          speaker: narrator
          text: Miranda's two sisters came running to her. They threw their arms around her neck and kissed her a thousand times. Laughter and tears, questions and embraces all came at once. Miranda thanked her father and began asking after everyone she remembered from the palace. Most of all, she asked for the Captain of the Guard, because she owed her life to his mercy. The answer brought her great sorrow. The good Captain was dead.
        - id: ch06-b14
          speaker: narrator
          text: They sat down to the feast, and the King asked Miranda to tell everything that had happened since that terrible morning. She told her adventures so vividly that every guest listened without a breath.
        - id: ch06-b15
          speaker: narrator
          text: While Miranda rejoiced with her father and sisters, the King of the Sheep waited for her return. The promised time came and passed. When she did not appear, his fear became more than he could bear.
        - id: ch06-b16
          speaker: sheep_king
          text: She will never come back. My miserable sheep's face has driven her away. Without Miranda, what remains for a wretch like me? Cruel Ragotte, my punishment is complete!
          emotion: sad
        - id: ch06-b17
          speaker: narrator
          text: For a long time, he mourned his sad fate in this way. The daylight faded, darkness came, and still there was no sign of the Princess. At last he could wait no longer. He set off as quickly as he could toward the town. When he reached the palace, he asked for Miranda. By then everyone had heard the story of her adventures. They had decided that their new queen must never return to live among sheep and shadows. The palace guards sternly refused to let him see her.
        - id: ch06-b18
          speaker: narrator
          text: The King of the Sheep begged them again and again. He pleaded for one glimpse of Miranda. His entreaties might have melted hearts made of stone, but they did not move the palace guards. At last, utterly brokenhearted, he fell at their feet and died.
        - id: ch06-b19
          speaker: narrator
          text: Inside the palace, Miranda's father had not the slightest idea what tragedy was taking place beyond his gate. He proposed a celebration for the new queen. Miranda would ride in her chariot all around the town. Thousands upon thousands of torches would illuminate her way, shining from windows and balconies and filling every grand square with light.
        - id: ch06-b20
          speaker: narrator
          text: But at the very entrance of the palace, Miranda saw a dreadful sight. Her dear, kind Sheep lay silent and still upon the pavement.
        - id: ch06-b21
          speaker: narrator
          text: She leaped from the chariot and ran to him, weeping bitterly. Her broken promise had cost him his life. For a long, long time, Miranda was so unhappy that everyone feared she would die as well.
        - id: ch06-b22
          speaker: narrator
          text: So even a princess is not always happy, especially when she forgets to keep her word. The greatest misfortunes often arrive just when people believe they have gained everything their hearts desire.
