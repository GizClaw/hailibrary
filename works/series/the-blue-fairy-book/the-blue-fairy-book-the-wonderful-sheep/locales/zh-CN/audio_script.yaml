      display_name: 马政官
      tts: {delivery: 恭谨利落, timbre: 平稳清晰, pace: 中等, pitch: 中音}
    courtier_1:
      display_name: 宫廷侍从甲
      tts: {delivery: 庄重热烈, timbre: 明亮, pace: 中等, pitch: 中音}
    courtier_2:
      display_name: 宫廷侍从乙
      tts: {delivery: 庄重热烈, timbre: 温厚, pace: 中等, pitch: 中低音}
    courtier_3:
      display_name: 宫廷侍从丙
      tts: {delivery: 庄重热烈, timbre: 清朗, pace: 中等, pitch: 中高音}
  chapters:
    - id: ch01
      title: 白衣与梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，仙女还生活在人间。有位国王养育着三个年轻、美丽又聪明的女儿。最小的米兰达尤其漂亮，也最受父王疼爱。国王一个月送给她的衣裙和珠宝，比给两个姐姐一年的还多。好在米兰达从不独占，总把东西分给姐姐，所以姐妹三个仍旧亲密快乐。
        - id: ch01-b02
          speaker: narrator
          text: 后来，几个爱争斗的邻国不肯再让国王安享太平，向他的国家发起猛烈进攻。国王担心自己若不拼力抵抗，就会彻底战败，于是召集大军亲自出征。他把女儿们留在一座城堡里，由女管教照顾。战报天天传来。有时说国王攻下了一座城，有时说他又打赢一场仗。最后，消息说敌军已经被他赶出国境，他正尽快赶回城堡，只想早些见到最心爱的米兰达。三位公主为这场凯旋特意做了绿、蓝、白三身缎子衣裙，珠宝也各自配成同样的颜色。大公主佩祖母绿，二公主戴绿松石，米兰达浑身闪着钻石的光。她们唱着亲自写的胜利之歌去迎接父亲。国王看见女儿们这样漂亮又欢喜，便亲热地逐一拥抱，只是给米兰达的吻比给两个姐姐的更多。
        - id: ch01-b03
          speaker: narrator
          text: 宴席摆好后，国王和女儿们一同吃饭。他总觉得每件事都另有含义，先问大女儿为什么穿绿衣。
        - id: ch01-b04
          speaker: eldest_princess
          text: 父王，听说您连连得胜，我用绿色表示心里的欢喜，也表示我一直盼您早些回来。
        - id: ch01-b05
          speaker: father_king
          text: 说得好。那么你呢？为什么穿蓝色？
        - id: ch01-b06
          speaker: second_princess
          text: 因为我们始终盼着您获胜。见到您，就像看见布满美丽星辰的天空一样叫我高兴。
        - id: ch01-b07
          speaker: father_king
          text: 你们的回答真聪明。米兰达，你为什么偏偏穿了一身白？
        - id: ch01-b08
          speaker: miranda
          text: 因为我穿白色最好看呀。
        - id: ch01-b09
          speaker: father_king
          text: 什么？你只想到这个？真是个虚荣的孩子！
          emotion: angry
        - id: ch01-b10
          speaker: miranda
          text: 我只想着，您看见我会高兴。
        - id: ch01-b11
          speaker: narrator
          text: 国王毕竟疼爱米兰达，听完这句也就不再计较。他甚至装出一副很满意的样子，好像女儿起初没有把全部理由告诉自己，反而是一件值得高兴的事。国王把这顿丰盛的晚饭吃得很饱。看看时间，离上床睡觉还早，他便请三个女儿把昨夜做过的梦都说来听听。大公主先说，她梦见父王送给自己一件衣裙。衣裙上镶满宝石，还绣着金线，放出的光彩比太阳更加明亮。二公主则梦见父王带回一架纺车和一根纺纱杆。她可以坐在那里纺出细线，再替父亲做几件衬衫。
        - id: ch01-b12
          speaker: miranda
          text: 我梦见二姐姐出嫁。婚礼那天，父王手里捧着金水壶，对我说：“米兰达，来吧，我替你倒水，让你洗洗手。”
        - id: ch01-b13
          speaker: narrator
          text: 国王一听便大发雷霆，眉头拧紧，脸色可怕。他匆匆回房，却怎么也忘不了这个梦。
        - id: ch01-b14
          speaker: father_king
          text: 她是想把我当奴仆吗？难怪她只想着那身白缎衣裳，根本不把我放在眼里。她这份妄想，我马上就叫它结束！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 天还没亮，国王就召来御前卫队长。
        - id: ch01-b16
          speaker: father_king
          text: 米兰达的梦预示着对我不利。把她带进森林杀掉，再把她的心和舌头带回来作证。你敢骗我，我就处死你！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 卫队长被这道残忍的命令惊呆了，却不敢反驳。他怕国王更加恼怒，也怕国王改派一个真会下手的人，只能答应照办。清晨，他来到米兰达房外。因为天色实在太早，里面的人起先不肯开门。他只好说国王急着召见米兰达。公主一听便赶快起身，跟他走了出来。黑人小姑娘帕蒂帕塔替她提着长长的裙裾，宠物猴格拉比容和小狗丁丁也一路跑在身后。卫队长请米兰达下楼去花园，说国王正在那里呼吸清晨的新鲜空气。到了花园，他装作四处寻找，明知国王根本不在那里，仍带着一行人来到通往森林的小门前。
        - id: ch01-b18
          speaker: guard_captain
          text: 陛下一定散步进森林了，我们往里面找吧。
    - id: ch02
      title: 森林里的牺牲
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天渐渐亮了。米兰达看见卫队长眼里含着泪，悲伤得说不出话。
        - id: ch02-b02
          speaker: miranda
          text: 你怎么了？看起来这样难过。
        - id: ch02-b03
          speaker: guard_captain
          text: 公主，国王命我在这里杀死您，把您的心和舌头带回去。我若不照办，也会没命。奉命做这样的事，谁能不难过呢？
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: 米兰达吓得脸色发白，悄悄落泪。她抬眼望着卫队长。
        - id: ch02-b05
          speaker: miranda
          text: 你真忍心杀我吗？我从没伤害过你，还常在父王面前说你的好话。若是我犯了错，我愿意受罚。可我一直敬爱父亲，他这样待我实在不公平。
          emotion: fearful
        - id: ch02-b06
          speaker: guard_captain
          text: 别怕，我宁可自己死也不会伤您。可我死了，您仍不安全。我们得想个办法，让国王相信您已经不在人世。
        - id: ch02-b07
          speaker: miranda
          text: 可我们能怎么办？没有我的心和舌头，他绝不会信。
        - id: ch02-b08
          speaker: narrator
          text: 米兰达与卫队长谈得太专心，完全忘记帕蒂帕塔还跟在身边。可他们方才说过的每一句话，她全都听见了。知道主人面临死亡，她没有后退，也没有犹豫，而是立刻走上前，扑倒在米兰达脚下，主动提出一个可怕的办法。
        - id: ch02-b09
          speaker: patypata
          text: 殿下，请用我的性命救您吧。能为您这样仁慈的主人而死，我心甘情愿。
        - id: ch02-b10
          speaker: miranda
          text: 不行，帕蒂帕塔！你这样真心待我，你的命在我眼里更和我的一样宝贵。
        - id: ch02-b11
          speaker: grabugeon
          text: 公主说得对。帕蒂帕塔忠心又能干，比我有用。还是拿我的心和舌头吧，我正想去精灵国闯出大名声呢！
        - id: ch02-b12
          speaker: miranda
          text: 小格拉比容，我也不能拿你的命。
        - id: ch02-b13
          speaker: tintin
          text: 我这样一条好狗，怎么能让你们替主人去死？要牺牲，也该轮到我！
        - id: ch02-b14
          speaker: narrator
          text: 帕蒂帕塔、格拉比容和丁丁都争着替主人牺牲，三个人的话越说越冲，谁也不肯把这个机会让给别人。格拉比容动作最快，忽然冲到最近的一棵树下，一口气爬上最高的树梢。大家还没明白她要做什么，她已经头朝下纵身一跳，重重摔在地上，当场死去。公主伤心极了。可是格拉比容既然真的死了，她只得同意卫队长取出猴子的舌头。等他们拿到手里一看，那条舌头还没有米兰达的拇指大。国王只要看上一眼，就会知道这绝不可能是公主的舌头。
        - id: ch02-b15
          speaker: miranda
          text: 我失去了小猴子，却还是没能逃过危险！
          emotion: sad
        - id: ch02-b16
          speaker: patypata
          text: 那就让我来救您！
        - id: ch02-b17
          speaker: narrator
          text: 大家来不及阻止，帕蒂帕塔已经拾刀割下自己的头。卫队长却发现她的舌头通体乌黑，同样无法蒙骗国王。
        - id: ch02-b18
          speaker: miranda
          text: 我怎么这样不幸！心爱的人一个个离开，事情却毫无转机。
          emotion: sad
        - id: ch02-b19
          speaker: tintin
          text: 您早些答应我，现在只需要为我伤心，我也能得到您全部的感激了。
        - id: ch02-b20
          speaker: narrator
          text: 米兰达吻着丁丁，越哭越伤心，终于再也承受不住，只好转身往森林深处走。等她回头时，卫队长已经离去，帕蒂帕塔、格拉比容和丁丁都躺在地上。她不忍心就这样抛下他们，便在一棵树下挑了个长满青苔的可爱地方，亲手挖出一座小坟，把三位伙伴安葬进去。她还把他们的名字刻在树皮上，写明他们全是为救自己而死。做完这一切，米兰达才开始考虑该去哪里藏身。这片森林离城堡太近，第一个经过的人就可能认出她。林中又有狮子和狼，它们吃掉一位公主，恐怕不会比叼走一只迷路的小鸡更费力。她顶着炎热的太阳尽快赶路，几乎被暑热、疲惫和恐惧夺去性命。无论朝哪个方向看，森林都没有尽头。她太害怕了，每隔一会儿便觉得父王正从后面追来，要亲手杀死自己。她不知道该选哪条路，只能哭着向前。带刺的灌木一次次划伤她，还把那身漂亮的衣裙撕成了碎片。
        - id: ch02-b21
          speaker: narrator
          text: 终于，她听见了羊叫，以为附近有牧人，可以带她去村里，扮成农家姑娘生活。
        - id: ch02-b22
          speaker: miranda
          text: 原来国王和公主也未必幸福。谁能想到，我竟得逃出来躲藏，只因为父王毫无缘由地想杀我？
    - id: ch03
      title: 地下的绵羊王国
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 米兰达循着羊叫来到一片秀美的林间空地。四周都是树木，中央卧着一只大绵羊。他的羊毛洁白如雪，双角闪着金光，颈上围着花环，腿上缠着一串串硕大的珍珠，还戴着一副钻石项圈。他卧在铺满橙花的土坡上，头顶撑着金锦华盖，正好挡住炎热的阳光。附近散布着将近一百只绵羊，却没有一只低头吃草。有的喝着咖啡、柠檬水或果子露，有的吃冰品、奶油草莓和糖果，还有一些在玩游戏。许多绵羊都戴金项圈，上面缀满珠宝、鲜花和彩带。米兰达被这意外的场面惊得停下脚步，正四处寻找这群奇怪绵羊的牧人，那只漂亮的绵羊便一跃而起，朝她奔来。
        - id: ch03-b02
          speaker: sheep_king
          text: 美丽的公主，请过来吧。我们这样温顺平和的动物，绝不会伤害您。
        - id: ch03-b03
          speaker: miranda
          text: 真不可思议，一只绵羊竟然会说话！
          emotion: surprised
        - id: ch03-b04
          speaker: sheep_king
          text: 您的猴子和小狗也会说话，为什么见了我们反而更惊讶呢？
        - id: ch03-b05
          speaker: miranda
          text: 仙女赐给了他们说话的本领，我早就听惯了。
        - id: ch03-b06
          speaker: sheep_king
          text: 说不定我们也有同样的奇遇。公主，是什么把您带到了这里？
        - id: ch03-b07
          speaker: miranda
          text: 是数不清的灾难，绵羊先生。我是世上最不幸的公主，只想找个地方躲开父亲的怒火。
        - id: ch03-b08
          speaker: sheep_king
          text: 那就跟我走吧。我会给您一个只有您知道的藏身处，里面的一切都听您安排。
        - id: ch03-b09
          speaker: miranda
          text: 可我实在太累，一步也走不动了。
        - id: ch03-b10
          speaker: narrator
          text: 金角绵羊吩咐人取来车驾。片刻以后，六只山羊拉来一个大南瓜。南瓜大得足够两个人舒舒服服地坐在里面，内壁还铺满天鹅绒和绒羽软垫。米兰达第一次见到这样的车，觉得十分有趣，便坐了进去。绵羊王坐在她身旁，六只山羊立刻全速飞奔，一直跑到一座洞穴前才停下。洞口被一块巨石严严实实地堵住。绵羊王用蹄子轻轻一碰，石头便倒了下去。他请米兰达放心跟自己进去。若不是刚才发生的一切吓坏了她，任谁也不可能劝她走进这样骇人的洞穴。可她更怕身后的危险，那一刻即便眼前是一口井，她恐怕也会跳下去。米兰达不再犹豫，跟着走在前面的绵羊不断向下。路长得像是没有尽头，她以为两个人一定会从地球另一面钻出去，甚至怀疑他正在把自己带进仙境。
        - id: ch03-b11
          speaker: narrator
          text: 洞穴尽头是一片辽阔平原，地上开满各种花，香气胜过米兰达从前闻到的一切。一条宽阔的橙花水河绕着平原流淌。四处还有喷涌着各种美酒的泉眼，泉水汇成秀美的小瀑布与溪流。这里的树木更加奇怪。整条林荫道上，每根树枝都挂着已经烤熟的鹧鸪。要是你更喜欢野鸡、鹌鹑、火鸡或者兔肉，只需往左或往右转，总能找到合口味的树。有些地方，天空会被一阵阵落下的食物遮暗。龙虾馅饼、白香肠、腊肠、果馅饼和各种糖果从天而降，有时落下的又是金银、钻石与珍珠。这样的雨和这样怡人的地方，本该招来无数客人。可据说绵羊王严肃得像法官，实在不大热衷同人交往。
        - id: ch03-b12
          speaker: narrator
          text: 米兰达到来时，正是一年里最好的季节。她看见的宫殿没有砖石墙壁，而是一长排橙树、茉莉、忍冬与麝香蔷薇。枝条彼此交织，围成一间间极其可爱的房间。里面悬着金银薄纱，摆着巨大的镜子、烛台，还有漂亮得叫人看不够的图画。绵羊王请米兰达把自己当作眼前一切的女王。他说，自己这些年一直陷在悲伤与苦恼里，而米兰达拥有一种力量，能够让他忘掉全部忧愁。
        - id: ch03-b13
          speaker: miranda
          text: 高贵的绵羊，您这样仁慈慷慨，我实在感激。可这里处处出奇，我真不知道该怎样看待这一切。
        - id: ch03-b14
          speaker: narrator
          text: 一群可爱的仙女捧来装满水果的琥珀篮子。米兰达伸手时，她们却滑开了。她再去触摸，仍旧什么也碰不到。
        - id: ch03-b15
          speaker: miranda
          text: 她们到底是什么？我身边这些又是什么人？
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: 她害怕得哭了。绵羊王回来见她落泪，急得恨不能扯掉自己的一身羊毛。
        - id: ch03-b17
          speaker: sheep_king
          text: 美丽的公主，出了什么事？难道有人怠慢了您？
        - id: ch03-b18
          speaker: miranda
          text: 没有人怠慢我。只是幽灵和会说话的绵羊让我害怕。您带我来已经很好了，要是肯再送我回到地面，我会更加感激。
        - id: ch03-b19
          speaker: sheep_king
          text: 请耐心听完我的遭遇，您就不会害怕了。我原本也是国王，拥有世上最辉煌的王国。臣民爱我，邻国嫉妒我，也畏惧我。人人都说，没有哪位君王比我更配得到尊敬。
    - id: ch04
      title: 拉戈特的诅咒
      blocks:
        - id: ch04-b01
          speaker: sheep_king
          text: 我从前非常喜欢打猎。一天，我追着一头雄鹿，把随从远远甩在后面。那头鹿忽然跃进水池，我一时鲁莽，也催马跟了进去。才走几步，池水非但不凉，反而热得惊人。水一下干了，眼前裂开一道喷着火焰的深渊，我毫无办法，一直掉到悬崖底下。
        - id: ch04-b02
          speaker: narrator
          text: 绵羊王以为自己必死无疑，却听见一个声音从火中传来。
        - id: ch04-b03
          speaker: ragotte
          text: 忘恩负义的王子，这团火恐怕还暖不了你那颗冰冷的心！
          emotion: angry
        - id: ch04-b04
          speaker: sheep_king
          text: 谁在这可怕的地方埋怨我无情？
        - id: ch04-b05
          speaker: ragotte
          text: 是一个爱着你，却永远得不到回应的可怜人。
          emotion: sad
        - id: ch04-b06
          speaker: sheep_king
          text: 火焰渐渐熄灭，我看见一位从小就认识的仙女。她叫拉戈特，丑陋的模样一直令我厌恶。她倚着一名绝色少女的手臂。少女腕上锁着金链，显然是她的奴隶。我问她：“拉戈特，这是怎么回事？是你把我弄到这里来的？”
        - id: ch04-b07
          speaker: ragotte
          text: 你到今天才懂我的心，这能怪谁？我法力强大，你在我面前不过像只蚂蚁，却以为自己是伟大的国王。难道我还得屈尊向你解释？
        - id: ch04-b08
          speaker: sheep_king
          text: 你爱怎么说都行。告诉我，你要的是王冠、城池，还是我的财宝？
        - id: ch04-b09
          speaker: ragotte
          text: 财宝？只要我愿意，随便一个厨房帮工都能比你富有，比你更有权势。我不要钱财。把你的心给我，娶我为妻，我就在你的王国之外再送你二十个王国，还有一百座装黄金的城堡、五百座装白银的城堡。你想要什么，都可以开口。
        - id: ch04-b10
          speaker: sheep_king
          text: 拉戈特夫人，一个人落在坑底，以为自己就要被活活烤死，哪里想得到要向您这样迷人的人求婚？先放我自由，出去以后我一定好好回答您。
        - id: ch04-b11
          speaker: ragotte
          text: 你若真爱我，洞穴、树林、狐狸洞和荒漠都会一样称心。别想骗我。你以为自己能逃，其实只能留在这里。先替我看守羊群吧，他们很会陪伴人，说话也不比你差。
        - id: ch04-b12
          speaker: sheep_king
          text: 她一面说，一面把我领到我们此刻站立的平原，又指给我看她的羊群。我却没有认真看那些羊，也没有再留心拉戈特。我完全被那名美丽的女奴吸引了，眼里再也装不下别的东西。残忍的拉戈特立刻察觉我的心思。她转过脸，对那少女投去凶狠又可怕的一瞥，少女当场失去生命，倒在地上。看见这样骇人的一幕，我拔剑冲向拉戈特。本来我一定会砍下她的头，可她施展魔法，把我的身体牢牢锁在站立的地方。我使尽全身力气也迈不出一步，最后只能绝望地把自己摔在地上。
        - id: ch04-b13
          speaker: ragotte
          text: 现在就让你见识我的力量。你眼下像头狮子，我偏要把你变成一只绵羊。
        - id: ch04-b14
          speaker: sheep_king
          text: 她用魔杖碰了我一下，我就成了现在这样。我还会说话，也仍能清楚感到这副模样带来的痛苦。
        - id: ch04-b15
          speaker: ragotte
          text: 五年之内，你都是一只绵羊，也是这片乐土的主人。我再也看不见那张曾经深爱的脸，也就能照你应得的那样恨你了。
        - id: ch04-b16
          speaker: sheep_king
          text: 她说完就消失了。那时我悲惨得什么也不在乎，否则看见她离开，真该觉得庆幸。会说话的绵羊们接纳了我，还拥我做他们的国王。他们告诉我，自己原本也都是不幸的王子。每个人都曾用某种不同的方式得罪报复心极强的拉戈特，于是被她赶进羊群，罚作绵羊若干年。有的刑期长，有的刑期短。每隔一段时间，确实会有一只羊恢复原来的身体，回到地面上属于他的地方。至于您刚才见过的其他身影，他们本是拉戈特的情敌或仇人，被她囚禁了一百年左右。不过，即使是他们，最终也会得到自由，回到从前的生活里。
        - id: ch04-b17
          speaker: sheep_king
          text: 我刚才说起的年轻女奴，也是这些影子中的一个。我常常看见她，每次都很愉快。可她从来不同我说话。我也知道，真走到近前，只会发现她不过是一道无法触碰的影子，那实在叫人扫兴。后来我注意到，一位与我同受苦难的伙伴也格外留心这个小幽灵。打听之后我才明白，他原来是少女真正的恋人。早在很久以前，残忍的拉戈特就把他从少女身边夺走了。知道这些以后，我便不再惦记那道美丽的影子，心里只剩下恢复自由这一件事。
        - id: ch04-b18
          speaker: sheep_king
          text: 我常常走进森林，也正是在那里一次次看见您。有时您亲自驾驶马车，动作优雅，技巧又好，世上几乎没人比得上。有时您骑着一匹性情猛烈的骏马去打猎，那匹马仿佛只有您才驾驭得了。还有些时候，您会和宫廷里的公主们在平原上赛跑。您的脚步轻得像要飞起来，每一次都是您赢得奖赏。米兰达，我爱您已经这样久，却一直不敢把这份感情说出口。像我这样一只受了诅咒的不幸绵羊，又能为自己的爱情怀抱什么希望呢？
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: 米兰达听完这番长长的讲述，既惊讶又慌乱，一时根本不知道该怎样回答绵羊王。她好不容易说出一小段得体的话。那番话虽然没有明确答应什么，却也没有彻底断绝绵羊王的希望。她还告诉他，既然已经知道那些影子有一天会重新活过来，自己以后看见他们就不再害怕了。
        - id: ch04-b20
          speaker: miranda
          text: 要是帕蒂帕塔、格拉比容和小丁丁也能这样安然无恙，我在这里就再也没有别的愿望了。
        - id: ch04-b21
          speaker: narrator
          text: 绵羊王虽然被困，仍保留着一些法力与特权。他吩咐马政官去寻找米兰达三位伙伴的影子。
        - id: ch04-b22
          speaker: sheep_king
          text: 把那个黑人小姑娘、猴子和小狗的影子请来，让他们陪公主散散心。
        - id: ch04-b23
          speaker: narrator
          text: 转眼间，米兰达就看见帕蒂帕塔、格拉比容和丁丁朝自己走来。能够再见三位伙伴，她欢喜极了，只可惜他们仍是无法靠近、无法触碰的影子。绵羊王待她温柔又风趣，还全心全意爱着她。时间久了，米兰达也开始爱他。这样一只漂亮的绵羊，既礼貌又体贴，实在很难叫人不喜欢。何况她知道，他其实是一位国王，这场奇怪的囚禁很快就会结束。她等待着那个幸福时刻，每一天都过得十分愉快。绵羊王请整个羊群帮忙，为她接连举办舞会、音乐会和狩猎聚会。就连那些影子也来参加欢乐，假装自己仍然是从前那些有血有肉的人。
    - id: ch05
      title: 第一次归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天傍晚，绵羊王派出的信使带来上好的消息。米兰达的一位姐姐将嫁给一位了不起的王子，婚礼的准备华美得无与伦比。
        - id: ch05-b02
          speaker: miranda
          text: 那么多漂亮东西，我却一样都看不到！姐姐会打扮得像女王，身边全是爱她、赞美她的人。每个人都能去祝福她，只有我被困在地下，陪着绵羊和影子。
        - id: ch05-b03
          speaker: sheep_king
          text: 我并没有说不许您去。想出发就出发吧，只要答应回来。我太爱您，没有您便活不下去。
        - id: ch05-b04
          speaker: narrator
          text: 米兰达原以为自己只能错过姐姐的婚礼，听见绵羊王准许她前去，心中感激不尽。她郑重保证，世上无论发生什么，都不能阻止自己按时回来。绵羊王相信了她的许诺，还为她备好一支与公主身份相称的护卫队。米兰达也仔细打扮起来，凡是能使自己更加美丽的东西，一样都没有忘记。她坐上一辆由珍珠母制成的马车。光滑的车身闪着柔和光彩，拉车的则是六头暗褐色狮鹫。这些稀奇的猛兽刚从世界另一端运来。随行卫兵从四面八方赶来，人人至少有八英尺高，身上还穿着为这趟旅程准备的华丽制服。他们浩浩荡荡地护送着公主，朝她父亲的宫殿出发。
        - id: ch05-b05
          speaker: narrator
          text: 她到达父王宫殿时，婚礼仪式刚刚开始。米兰达一走进大厅，所有人都被她的美貌与珠宝的光辉惊得说不出话，四面八方很快响起赞叹。国王盯着她仔细端详，吓得她以为自己马上就会被认出。可国王坚信米兰达已经死了，根本没有想到，眼前的陌生公主正是自己的女儿。米兰达始终怕耽搁太久便无法脱身，所以仪式尚未结束，就匆匆离开。临走时，她留下一个镶着祖母绿的珊瑚小匣。匣盖上用钻石拼着一行字：“赠给新娘的珠宝。”人们一发现就把匣子打开，里面装着的精美饰物好像永远也拿不完。
        - id: ch05-b06
          speaker: narrator
          text: 国王原想走到陌生公主身边，问清她到底是谁，见她突然消失，心里失望极了。他马上下令，如果这位公主再次出现，就把宫殿所有大门关紧，决不能让她轻易离去。米兰达这次出门的时间其实很短，绵羊王却觉得自己像等了一百年。他一直守在森林最深处的喷泉旁，周围的地面铺满了为她准备的华美礼物。那些礼物要让米兰达知道，他对她的归来多么欢喜，又有多么感激。米兰达的身影刚一出现，他便像真正的绵羊一样又跑又跳地迎上去。他扑倒在她脚边，亲吻她的双手，还不停诉说她离开时自己有多不安，等待她时又有多么焦急。那一番深情的话说得动人极了，米兰达听得心醉神迷。
    - id: ch06
      title: 实现的梦与破碎的诺言
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 过了一阵，消息说米兰达的第二位姐姐也要成婚。米兰达再次请求绵羊王准她去参加婚礼。绵羊王心中悲伤，总觉得这次会带来灾祸，可他太爱米兰达，不忍心拒绝。
        - id: ch06-b02
          speaker: sheep_king
          text: 公主，您又想离开我。这是我命里注定的不幸，并不是您的错。我答应让您走，可我再也拿不出比这更大的爱来证明给您看了。
          emotion: sad
        - id: ch06-b03
          speaker: miranda
          text: 我会像上次一样，很快就回来。请别担心。要是真有事情绊住我，我一定会和您一样难过。
        - id: ch06-b04
          speaker: narrator
          text: 米兰达带着原来的护卫出发，再次在婚礼仪式开始时赶到宫殿。人人都为她的归来而高兴。她美得像一位真正的仙女公主，在场的王子们全都盯着她，谁也舍不得移开目光。见到她最高兴的却是国王。他没有忘记上次的失望，当场下令把每一扇大门关上，再插紧所有门闩。婚礼快要结束时，米兰达迅速站起身，想趁没人留意，混在人群中悄悄溜走。可她走到门边才惊慌地发现，所有出口都已经锁得牢牢的。
        - id: ch06-b05
          speaker: narrator
          text: 国王看出她正在寻找出口，便亲自走到她面前。他没有揭穿自己的安排，而是用最恭敬的态度，请她不要这样匆忙地离开。即使她不愿久留，也请她至少赏脸参加那场为王子与公主们准备的盛大宴席。米兰达见国王只是诚恳挽留，这才稍稍放心。父王领着她走进一座金碧辉煌的大厅，宫廷里的宾客全都聚集在那里。入席以前，国王亲自捧起一只盛满清水的金钵，送到她面前。他请这位陌生公主伸出手，把纤细的手指浸在水里洗一洗。
        - id: ch06-b06
          speaker: miranda
          text: 我的梦终于成真了！姐姐婚礼这一天，您亲手捧着水让我洗手，而且这样做也没有使您生气。
          emotion: surprised
        - id: ch06-b07
          speaker: narrator
          text: 她扑倒在国王脚边。国王立刻认出了女儿。其实，他先前已经好几次觉得陌生公主像极了可怜的小米兰达。
        - id: ch06-b08
          speaker: father_king
          text: 我亲爱的女儿，你能原谅我的残忍吗？我以为那个梦预示自己会失去王冠，竟下令杀你。如今你的姐姐们都已出嫁，各有自己的王国，我的王国就交给你。看来那个梦果然预示我会失去王冠。
          emotion: sad
        - id: ch06-b09
          speaker: narrator
          text: 国王把王冠戴在米兰达头上，高声欢呼。
        - id: ch06-b10
          speaker: father_king
          text: 米兰达女王万岁！
          emotion: happy
        - id: ch06-b11
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: 米兰达女王万岁！
          emotion: happy
        - id: ch06-b12
          speaker: narrator
          text: 两位姐姐跑来搂住她的脖子，一遍又一遍地亲吻。宫里的人有的欢笑，有的落泪，有的急着说话，有的忙着拥吻，一切都同时发生。米兰达谢过父王，接着问起每一个人的近况。她尤其挂念那位给过自己莫大帮助的卫队长。听说他已经去世，米兰达非常难过。过了一会儿，众人入席赴宴。国王请她从那个可怕的清晨讲起，说说自己被卫队长带走以后究竟发生了什么。米兰达把一路的遭遇讲得生动极了，满座宾客都屏住呼吸，唯恐漏听一句。
        - id: ch06-b13
          speaker: narrator
          text: 可在宫殿外，绵羊王正等她回去。约定的时刻已经过去，米兰达仍没有出现。他越来越不安，再也忍耐不住。
        - id: ch06-b14
          speaker: sheep_king
          text: 她不会回来了！一定是我这张绵羊的脸让她厌恶。没有米兰达，我活着还剩下什么？残忍的拉戈特，这回你给我的惩罚终于完整了！
          emotion: sad
        - id: ch06-b15
          speaker: narrator
          text: 他一遍遍哀叹自己的悲惨命运，过了很久才发现天色正在变暗，公主还是没有半点踪影。他再也等不下去，立刻朝都城的方向拼命赶去。到了宫殿门前，他报出米兰达的名字，苦苦请求守卫让自己进去。可这时候，宫里每个人都已经听完她的经历，谁也不愿让她再回到绵羊王身边。守卫严厉地拒绝了他。他一再恳求，哀告的话足以熔化石头做的心，宫门前的卫兵却始终毫不动摇。最后，他的心彻底碎了，就这样倒在守卫脚边，失去了生命。
        - id: ch06-b16
          speaker: narrator
          text: 宫里的国王完全不知道大门外正在发生怎样的惨剧。他兴高采烈地提议，让米兰达坐上马车，绕着整座都城巡游。为了迎接她，全城将点燃千千万万支火炬。火光会铺满每一扇窗户、每一座阳台，也会照亮所有宏伟的广场。可马车刚到宫殿入口，米兰达就看见了最不愿看见的一幕。那只亲爱而善良的绵羊躺在冰冷的石路上，一声不响，一动不动。
        - id: ch06-b17
          speaker: narrator
          text: 米兰达甚至来不及等马车停稳，便从车上跳了下去，奔到绵羊王身旁放声痛哭。她一看见那具沉默的身体，就明白发生了什么。是自己忘记了郑重许下的诺言，没有在约定的时刻回去，才使深爱她的绵羊王赶来宫殿，也最终失去了生命。这个念头使她痛苦极了。此后很久很久，米兰达都无法从悲伤中走出来。她日渐消沉，身边的人甚至以为，这位刚刚得到王冠的公主也会随他死去。
        - id: ch06-b18
          speaker: narrator
          text: 所以，公主也不见得永远幸福，尤其是在她忘记信守诺言的时候。人们往往以为自己终于如愿，最大的灾难却偏偏在这时降临。这个故事，是奥尔诺瓦夫人讲给我们的。
