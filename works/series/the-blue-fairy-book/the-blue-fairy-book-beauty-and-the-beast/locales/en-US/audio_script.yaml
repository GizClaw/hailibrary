  chapters:
    - id: ch01
      title: Fortune Lost
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, in a far-off country, there lived a merchant who had prospered in everything he did. He was enormously rich. Yet he had six sons and six daughters, all used to having whatever they fancied, so even his great fortune had plenty of uses.
        - id: ch01-b02
          speaker: narrator
          text: Then, without warning, disaster came. Their house caught fire and quickly burned to the ground. The splendid furniture, the books and pictures, the gold, silver, and precious goods were all destroyed. And that was only the start. Every one of the merchant's ships was lost to pirates, shipwreck, or fire. Trusted clerks in distant lands betrayed him. At last, the family fell from great wealth into the deepest poverty.
        - id: ch01-b03
          speaker: narrator
          text: The merchant had only one possession left, a small house in a lonely place a hundred leagues from town. He and his children had to go there. His daughters hoped their many old friends would invite them to stay, but no one offered help. Some even blamed the family's troubles on its extravagance.
        - id: ch01-b04
          speaker: narrator
          text: Their cottage stood in the middle of a dark forest and seemed the gloomiest place on earth. They could no longer afford servants. The sons worked in the fields, while the daughters labored like peasants. In rough clothes, living as simply as they could, the older girls never stopped mourning their former pleasures.
        - id: ch01-b05
          speaker: narrator
          text: Only the youngest tried to stay brave and cheerful. She had grieved as much as anyone when ruin came, but her natural happiness soon returned. She worked hard, amused her father and brothers, and tried to persuade her sisters to sing and dance. They refused. Because she was not as miserable as they were, they said this poor life was all she deserved. In truth, she was cleverer and far lovelier than they were, and everyone called her Beauty.
        - id: ch01-b06
          speaker: narrator
          text: Two years passed, and the family was settling into its new life when surprising news arrived. One ship the merchant had thought lost had reached port with a rich cargo. His children were sure their poverty was over and wanted to leave for town at once. Their father was more cautious. Though it was harvest time and the farm needed him, he decided to go alone and learn the truth.
        - id: ch01-b07
          speaker: narrator
          text: Nearly all the children imagined they would soon be rich again, or at least comfortable enough to enjoy town and lively company. They asked their father for costly jewels and dresses. Beauty alone expected nothing and made no request. Her father noticed.
        - id: ch01-b08
          speaker: merchant
          text: What would you like me to bring you, Beauty?
        - id: ch01-b09
          speaker: beauty
          text: I only want to see you come safely home.
        - id: ch01-b10
          speaker: narrator
          text: Her sisters took offense, thinking Beauty meant to shame them for their expensive wishes. Her father was pleased, but he told her that a girl her age ought to choose some pretty gift.
        - id: ch01-b11
          speaker: beauty
          text: Well, dear Father, if you insist, please bring me a rose. I love roses, and I haven't seen one since we came here.
    - id: ch02
      title: The Enchanted Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The merchant hurried to town, only to find that his former companions had believed him dead and divided the cargo among themselves. He spent six months struggling to recover it. In the end, he won back barely enough to pay for his journey and remained as poor as before.
        - id: ch02-b02
          speaker: narrator
          text: He left town in terrible weather. By the time he was a few leagues from home, cold and weariness had nearly overcome him. He pressed on into the forest, but night fell. Deep snow and bitter frost stopped his horse. There was no house anywhere, so he crouched inside the hollow trunk of a great tree. Wolves howled all through the longest night he could remember. At daybreak, snow had hidden every path.
        - id: ch02-b03
          speaker: narrator
          text: At last he found a rough, slippery track. He fell more than once, but the way soon grew easier and opened into an avenue ending at a magnificent castle. No snow lay there. Orange trees lined the road, covered in flowers and fruit.
        - id: ch02-b04
          speaker: narrator
          text: The merchant climbed agate steps and walked through room after splendid room. Warm air brought him back to life, and hunger gnawed at him, but the vast palace was silent. He found no one to ask for food. Finally, in a smaller chamber, he saw a bright fire with a couch beside it. Thinking someone was expected, he sat down to wait and soon fell sound asleep.
        - id: ch02-b05
          speaker: narrator
          text: Hours later, hunger woke him. A little table now stood close by, set with a fine dinner. He had eaten nothing for a full day, so he began at once, hoping his unseen host would appear and accept his thanks. No one came. After another long sleep, he woke refreshed and found fresh cakes and fruit beside him.
        - id: ch02-b06
          speaker: narrator
          text: The endless silence began to frighten him. He searched the palace again, but not one servant or any other living creature appeared. To distract himself, he pretended the treasures were his and planned how to divide them among his children.
        - id: ch02-b07
          speaker: narrator
          text: Then he entered the garden. Winter ruled everywhere beyond it, but here the sun shone, birds sang, flowers bloomed, and the air was soft and sweet. Delighted by all he saw, the merchant spoke aloud.
        - id: ch02-b08
          speaker: merchant
          text: All of this must be meant for me. I'll go home at once and bring my children here to enjoy it too.
        - id: ch02-b09
          speaker: narrator
          text: He had fed his horse in the stable when he arrived. Now he went to saddle it. Roses grew along both sides of the path, finer and sweeter than any he had known. Remembering his promise to Beauty, he picked one. A strange noise sounded behind him. He turned and saw a frightful Beast, furious with him.
        - id: ch02-b10
          speaker: beast
          text: Who gave you leave to pick my roses? I welcomed you into my palace and treated you kindly. Is this how you thank me, by stealing my flowers? Such insolence will be punished!
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: Terrified, the merchant dropped the rose and fell to his knees.
        - id: ch02-b12
          speaker: merchant
          text: Forgive me, noble sir. I am truly grateful for your magnificent hospitality. I never imagined that taking one small rose would offend you.
          emotion: fearful
        - id: ch02-b13
          speaker: beast
          text: You have excuses and flattering words ready enough, but they won't save you from the death you deserve.
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: The merchant thought despairingly of the danger Beauty's rose had brought him. He told the Beast every misfortune he had suffered, why he had made the journey, and what Beauty had asked him to bring.
        - id: ch02-b15
          speaker: merchant
          text: It would have taken a king's ransom to buy what my other daughters wanted. I thought I could at least bring Beauty one rose. Please forgive me. I meant no harm.
        - id: ch02-b16
          speaker: narrator
          text: The Beast considered this, and his voice became less furious.
        - id: ch02-b17
          speaker: beast
          text: I will spare you on one condition. You must give me one of your daughters.
        - id: ch02-b18
          speaker: merchant
          text: How could I be cruel enough to buy my life with my own child's? What excuse could ever bring her here?
          emotion: fearful
        - id: ch02-b19
          speaker: beast
          text: She must come willingly, with no excuse and no deceit. Find out whether one daughter is brave enough and loves you enough to save your life. You seem honest, so I will let you go home. You have one month. If one of them returns with you and remains here, you may go free. If none will come, say farewell to them forever and return alone, because then you belong to me. Do not think you can hide. Break your word, and I will come for you.
        - id: ch02-b20
          speaker: narrator
          text: The merchant accepted, though he could not believe any daughter would agree. He promised to return on the appointed day and asked to leave immediately.
        - id: ch02-b21
          speaker: beast
          text: You cannot leave until tomorrow. A horse will be ready then. Go eat your supper now, and wait for my orders.
        - id: ch02-b22
          speaker: narrator
          text: More dead than alive, the merchant returned to his room. A delicious supper waited before the fire. Fear took away his appetite, yet he tasted a few dishes so the Beast would not be angered by disobedience. Then a great noise announced the Beast's approach. Escape was impossible, so the merchant tried not to show his terror.
        - id: ch02-b23
          speaker: beast
          text: Did you have a good supper?
        - id: ch02-b24
          speaker: merchant
          text: Yes, thanks to my host's kindness.
        - id: ch02-b25
          speaker: narrator
          text: The Beast warned him to remember their bargain and tell his daughter exactly what awaited her.
        - id: ch02-b26
          speaker: beast
          text: Tomorrow, stay in bed until the sun is up and a golden bell rings. Your breakfast will be here, and your horse will wait in the courtyard. He will carry you back when you return with your daughter one month from now. Farewell. Take a rose to Beauty, and remember your promise.
        - id: ch02-b27
          speaker: narrator
          text: The merchant was relieved when the Beast left, though sorrow kept him awake. At sunrise he ate quickly, gathered Beauty's rose, and mounted the waiting horse. It flew so swiftly that the palace vanished in an instant. Still sunk in gloomy thoughts, he reached the cottage before he knew it.
    - id: ch03
      title: Beauty Keeps the Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: His children rushed out, anxious after his long absence. The splendid horse and rich mantle made them expect good news. At first he hid the truth. He handed Beauty the rose sadly.
        - id: ch03-b02
          speaker: merchant
          text: Here is what you asked me to bring. You cannot know what it has cost.
        - id: ch03-b03
          speaker: narrator
          text: Their questions soon drew out the whole story. The daughters loudly mourned their lost hopes. The sons swore their father must not return and planned to kill the Beast if it came for him. But the merchant reminded them of his promise. Then the girls turned on Beauty. They blamed her foolish request for all their suffering.
        - id: ch03-b04
          speaker: beauty
          text: I did cause this trouble, but I did it innocently. Who could guess that asking for a rose in summer would bring such misery? Since the harm began with me, it is right that I bear it. I will go back with Father and keep his promise.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: No one would hear of it at first. Her father and brothers loved her dearly and declared they would never allow her to go. Beauty remained firm. As the day drew near, she shared her few possessions among her sisters and said goodbye to everything she loved.
        - id: ch03-b06
          speaker: narrator
          text: On the appointed day, Beauty cheered her grieving father as they mounted the enchanted horse together. It seemed to fly instead of gallop, yet moved so smoothly that she felt no fear. She might have enjoyed the ride if she had not dreaded its end. Her father kept begging her to turn back, but she would not.
        - id: ch03-b07
          speaker: narrator
          text: Night fell while they spoke. Colored lights suddenly shone through the forest, and splendid fireworks blazed ahead. The bitter air grew warm. Statues carrying flaming torches lined the orange-tree avenue. The palace glittered from roof to ground, and soft music floated from the courtyard.
        - id: ch03-b08
          speaker: beauty
          text: The Beast must be terribly hungry if he celebrates his prey like this.
        - id: ch03-b09
          speaker: narrator
          text: She tried to laugh, and despite her worry, she could not help admiring the wonders around her. The horse stopped below the terrace steps. Her father led her to the room he remembered, where a bright fire and delicious supper awaited them. The long ride had made Beauty hungry, and seeing no Beast had eased her fear, so they ate.
        - id: ch03-b10
          speaker: narrator
          text: They had barely finished when heavy footsteps approached. Beauty clung to her father, and his own terror frightened her even more. When the Beast entered, she trembled at his appearance but forced herself to hide it and greeted him respectfully. The Beast seemed pleased.
        - id: ch03-b11
          speaker: beast
          text: Good evening, old man. Good evening, Beauty.
        - id: ch03-b12
          speaker: narrator
          text: The merchant was too frightened to answer.
        - id: ch03-b13
          speaker: beauty
          text: Good evening, Beast.
        - id: ch03-b14
          speaker: beast
          text: Did you come here willingly? Will you remain after your father leaves?
        - id: ch03-b15
          speaker: beauty
          text: Yes. I came prepared to stay.
        - id: ch03-b16
          speaker: beast
          text: I am pleased with you. Because you came of your own will, you may remain. Old man, you will leave at sunrise tomorrow. Rise when the bell rings, eat your breakfast, and take the horse home. You must never expect to see my palace again.
        - id: ch03-b17
          speaker: beast
          text: Beauty, take your father into the next room. Help him choose whatever your brothers and sisters would like. You will find two traveling trunks. Fill them as full as you can. It is only right that they receive precious gifts to remember you by.
        - id: ch03-b18
          speaker: beast
          text: Goodbye, Beauty. Goodbye, old man.
        - id: ch03-b19
          speaker: narrator
          text: Beauty dreaded her father's departure, but she dared not disobey. The next room was ringed with shelves and cupboards holding astonishing riches. There were dresses fit for a queen, ornaments to match, and heaps of dazzling jewels. Beauty chose a great store and made a pile of dresses for each sister. Then she opened a chest full of gold.
        - id: ch03-b20
          speaker: beauty
          text: Father, gold will be more useful to you. Let's take the other things out and fill the trunks with it.
        - id: ch03-b21
          speaker: narrator
          text: They did, but the more gold they added, the more room appeared. They put back all the jewels and dresses, and Beauty carried in still more jewels. At last the trunks were full, but so heavy that even an elephant could not have lifted them.
        - id: ch03-b22
          speaker: merchant
          text: The Beast has mocked us. He offered all this because he knew I could never carry it away.
        - id: ch03-b23
          speaker: beauty
          text: Let us wait and see. I don't believe he meant to deceive us. We can fasten the trunks and leave them ready.
        - id: ch03-b24
          speaker: narrator
          text: They returned to find breakfast waiting. The merchant ate well. The Beast's generosity made him hope he might someday visit Beauty. She believed they were parting forever, and when the bell rang sharply a second time, she was deeply sad.
        - id: ch03-b25
          speaker: narrator
          text: In the courtyard, one horse carried the trunks and another waited for the merchant. Both pawed the ground, eager to leave. He had time only for a hurried farewell. The instant he mounted, the horses raced away and vanished. Beauty wept, wandered back to her room, and soon fell asleep.
    - id: ch04
      title: Dreams and Palace Wonders
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Beauty dreamed she was walking beside a tree-lined brook and mourning her fate. A young Prince appeared, handsomer than anyone she had ever seen. His voice went straight to her heart.
        - id: ch04-b02
          speaker: prince
          text: Beauty, you are not as unfortunate as you think. Here you will be rewarded for all you have suffered, and every wish will be granted. Only try to discover who I am, however I may be disguised. I love you dearly. Make me happy, and you will find your own happiness. Stay as true-hearted as you are beautiful, and nothing will remain for us to wish for.
        - id: ch04-b03
          speaker: beauty
          text: What can I do to make you happy, Prince?
        - id: ch04-b04
          speaker: prince
          text: Be grateful, and do not trust your eyes too much. Above all, do not leave me until you have rescued me from my cruel misery.
        - id: ch04-b05
          speaker: narrator
          text: Then Beauty dreamed she stood with a stately, beautiful lady.
        - id: ch04-b06
          speaker: fairy
          text: Dear Beauty, do not grieve for what you left behind. A better fate awaits you. Just remember that appearances can deceive.
        - id: ch04-b07
          speaker: narrator
          text: Beauty wanted the dream to continue, but a clock softly called her name twelve times and woke her. Her dressing table held everything she could need. Once she was ready, she found dinner in the next room. Eating alone did not take long, and soon she curled up on a sofa to think about the Prince.
        - id: ch04-b08
          speaker: beauty
          text: He said I could make him happy. The horrible Beast must be holding him prisoner. How can I free him? Why did both of them warn me not to trust appearances? I don't understand. Still, it was only a dream. I should find something to do.
        - id: ch04-b09
          speaker: narrator
          text: She began exploring the palace. The first room was lined with mirrors, reflecting her on every side. From a chandelier hung a bracelet. Inside it, to her amazement, was the portrait of the Prince from her dream. Delighted, she put it on. In a picture gallery, she found a life-sized portrait of him, painted so perfectly that he seemed to smile at her.
        - id: ch04-b10
          speaker: narrator
          text: At last she pulled herself away. Another room contained every kind of musical instrument, and she played and sang until she was tired. The library held everything she had ever read or wished to read. There were so many books that a lifetime would hardly be enough to read their titles. As dusk came, candles in diamond and ruby holders lit themselves throughout the palace.
        - id: ch04-b11
          speaker: narrator
          text: Supper appeared at Beauty's favorite hour. Still, the palace was silent, and loneliness began to trouble her. Then she heard the Beast coming and trembled, wondering whether he meant to eat her. He seemed far from savage when he entered.
        - id: ch04-b12
          speaker: beast
          text: Good evening, Beauty.
        - id: ch04-b13
          speaker: narrator
          text: Beauty hid her fear and answered brightly. The Beast asked how she had spent the day, and she described the rooms she had visited. He asked whether she could be happy there. She replied that the palace was so beautiful that anyone who could not be happy in it would be very hard to please. After an hour of talking, she no longer found him nearly as terrible as before. When he rose to leave, he asked in his rough voice.
        - id: ch04-b14
          speaker: beast
          text: Do you love me, Beauty? Will you marry me?
        - id: ch04-b15
          speaker: beauty
          text: Oh, what can I say?
          emotion: fearful
        - id: ch04-b16
          speaker: beast
          text: Say yes or no. You need not be afraid.
        - id: ch04-b17
          speaker: beauty
          text: No, Beast. I cannot.
        - id: ch04-b18
          speaker: beast
          text: Then good night, Beauty.
        - id: ch04-b19
          speaker: beauty
          text: Good night, Beast.
        - id: ch04-b20
          speaker: narrator
          text: She was relieved that her refusal had not angered him. Soon she was asleep and dreaming of the unknown Prince again.
        - id: ch04-b21
          speaker: prince
          text: Beauty, why are you so unkind to me? I fear I must remain unhappy for many a long day.
          emotion: sad
        - id: ch04-b22
          speaker: narrator
          text: The dream changed again and again, but the Prince was always there. In the morning, Beauty compared his portrait with the face she remembered and found them exactly alike.
        - id: ch04-b23
          speaker: narrator
          text: That day she explored the sunny garden, where all the fountains played. Every path seemed familiar. She reached the brook and myrtle trees from her first dream, which made her more certain that the Beast held the Prince captive.
        - id: ch04-b24
          speaker: narrator
          text: Back inside, she discovered materials for every sort of work, with ribbons for bows and silks for flowers. An aviary held rare, tame birds that flew onto her shoulders and head as soon as they saw her.
        - id: ch04-b25
          speaker: beauty
          text: You pretty little creatures. I wish your cage were nearer my room so I could hear you sing more often.
        - id: ch04-b26
          speaker: narrator
          text: She opened a door and was delighted to find her own room beyond it, though she had thought it lay across the palace. Farther on were parrots and cockatoos that could speak and greeted her by name. They were so entertaining that she took two back to keep her company at supper.
        - id: ch04-b27
          speaker: narrator
          text: The Beast visited as usual, asked the same questions, and left with his gruff good night. Beauty slept and dreamed of her mysterious Prince. Her days passed quickly among the palace pleasures.
        - id: ch04-b28
          speaker: narrator
          text: Later she discovered an almost empty room with a comfortable chair beneath each window. At first, a black curtain seemed to cover the view. When she sat down, the curtain rolled aside and a merry pantomime began, full of dancing, music, colored lights, and pretty costumes. Each of the other seven windows offered a different entertainment. After that, Beauty never had to feel lonely.
        - id: ch04-b29
          speaker: narrator
          text: Every evening the Beast came after supper, and every night he asked the same question.
        - id: ch04-b30
          speaker: beast
          text: Beauty, will you marry me?
        - id: ch04-b31
          speaker: beauty
          text: No, Beast.
        - id: ch04-b32
          speaker: narrator
          text: Now that she understood him better, she saw that her answer made him sad. Yet dreams of the handsome Prince soon pushed the poor Beast from her thoughts. Only the repeated warnings troubled her. She was told to distrust appearances and let her heart guide her instead of her eyes, but no matter how she considered those words, she could not understand them.
    - id: ch05
      title: The Promise of Two Months
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: This life continued for a long while. At last, happy though she was, Beauty began to long for her father, brothers, and sisters. One night the Beast noticed her sadness and asked what troubled her. She no longer feared him, for beneath his frightening face and voice she had found true gentleness. She told him she wished to see home again.
        - id: ch05-b02
          speaker: beast
          text: Beauty, can you really abandon an unhappy Beast? What else do you need to be happy? Do you want to escape because you hate me?
          emotion: sad
        - id: ch05-b03
          speaker: beauty
          text: No, dear Beast. I do not hate you, and I would be sorry never to see you again. But I long to see my father. Let me go for only two months. I promise I will return and remain with you for the rest of my life.
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: The Beast sighed unhappily as she spoke.
        - id: ch05-b05
          speaker: beast
          text: I cannot refuse you anything, even if granting this costs my life. In the room beside yours are four boxes. Fill them with whatever you want to take. But keep your promise. Return when the two months end, or you may have reason to regret it. If you are late, you will find your faithful Beast dead. You need no carriage to return. The night before you leave, say goodbye to your family. Then, in bed, turn this ring on your finger and say firmly, “I wish to go back to my palace and see my Beast again.” Good night, Beauty. Be afraid of nothing. Sleep peacefully, and soon you will see your father.
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: Once alone, Beauty hurried to fill the boxes with rare and precious things. Only when she was tired of piling in treasures did they finally seem full. She went to bed too joyful to sleep. When the Prince came into her dream, she was distressed to see him stretched on a grassy bank, weary and hardly like himself.
        - id: ch05-b07
          speaker: beauty
          text: What is wrong?
        - id: ch05-b08
          speaker: prince
          text: How can you ask me that? You are leaving me, perhaps to my death.
          emotion: sad
        - id: ch05-b09
          speaker: beauty
          text: Please don't be so sad. I am only going to show Father that I am safe and happy. I gave the Beast my word that I would return. He would die of grief if I broke my promise.
        - id: ch05-b10
          speaker: prince
          text: Why should that matter to you? Surely you do not care about him.
        - id: ch05-b11
          speaker: beauty
          text: Of course I care! The Beast has been so kind that I would be ungrateful not to. I would die rather than cause him pain. It isn't his fault that he is ugly.
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: A nearby voice woke her. She opened her eyes in an unfamiliar room, much plainer than the palace. The four packed boxes stood beside her. She dressed quickly, wondering what magic had carried them all there. Then she heard her father and rushed out to embrace him.
        - id: ch05-b13
          speaker: narrator
          text: Her brothers and sisters had never expected to see her again. They crowded around with questions. Beauty also heard what had happened to them and how her father had returned. When the family learned that she could stay only briefly before going back to the Beast forever, they cried out in grief.
        - id: ch05-b14
          speaker: narrator
          text: Beauty asked her father what her dreams could mean, and why the Prince always warned her against appearances. He thought for a long time before answering.
        - id: ch05-b15
          speaker: merchant
          text: You say yourself that the Beast loves you dearly. Frightful as he looks, his gentleness and kindness deserve your love and gratitude. Perhaps the Prince means that you should reward the Beast by granting his wish, despite his ugliness.
        - id: ch05-b16
          speaker: narrator
          text: Beauty had to admit this seemed possible. Still, whenever she remembered her handsome Prince, she had no wish to marry the Beast. She need not decide for two months, so she tried to enjoy being with her sisters.
        - id: ch05-b17
          speaker: narrator
          text: The family was rich again, living in town among many acquaintances, but little amused Beauty. She often missed the palace, especially because the Prince never came into her dreams at home. Without him, she grew sad. Her sisters had become used to her absence and now found her rather troublesome. She would gladly have left when the two months ended, except that her father and brothers begged her to stay.
        - id: ch05-b18
          speaker: narrator
          text: Every morning Beauty meant to announce her departure that night. Every night, their sorrow weakened her courage, and she delayed again. At last a dreadful dream decided her.
        - id: ch05-b19
          speaker: narrator
          text: In the dream, she wandered down a lonely garden path and heard groaning behind bushes at the mouth of a cave. She ran closer and found the Beast lying on his side, near death. In a faint voice, he blamed his suffering on her. Then the stately lady appeared.
        - id: ch05-b20
          speaker: fairy
          text: Beauty, you have arrived only just in time to save him. This is what comes of breaking a promise. One more day's delay, and you would have found him dead.
        - id: ch05-b21
          speaker: narrator
          text: The dream terrified Beauty. Next morning, she declared she would leave at once. That night she said goodbye to her father, brothers, and sisters. As soon as she was in bed, she turned the ring around her finger.
        - id: ch05-b22
          speaker: beauty
          text: I wish to go back to my palace and see my Beast again.
        - id: ch05-b23
          speaker: narrator
          text: She fell asleep at once.
    - id: ch06
      title: Beauty Returns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Beauty woke to the musical clock calling her name twelve times. She knew at once that she was back in the palace. Everything stood as before, and her birds rejoiced to see her. Yet the day seemed longer than any she had known because she was so anxious for the Beast to come at supper.
        - id: ch06-b02
          speaker: narrator
          text: Supper arrived, but the Beast did not. Beauty listened and waited until fear took hold of her. Then she ran into the garden to search. Up and down every path and avenue she hurried, calling to him. No one answered, and she found no trace.
        - id: ch06-b03
          speaker: narrator
          text: Exhausted, she paused and realized she stood across from the shaded path in her dream. She rushed along it. There was the cave, and inside lay the Beast. Beauty thought he was sleeping and gladly stroked his head, but he neither moved nor opened his eyes.
        - id: ch06-b04
          speaker: beauty
          text: Oh, he is dead, and it is all my fault!
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: She wept bitterly. Looking again, she thought she saw him breathe. She hurried to the nearest fountain, brought water, and sprinkled it on his face. To her great joy, the Beast began to revive.
        - id: ch06-b06
          speaker: beauty
          text: Oh, Beast, you frightened me so! I never knew how much I loved you until I thought I had come too late to save you.
          emotion: surprised
        - id: ch06-b07
          speaker: beast
          text: Can you truly love a creature as ugly as I am? Beauty, you returned only just in time. I was dying because I believed you had forgotten your promise. Go back and rest now. I will see you again soon.
          emotion: sad
        - id: ch06-b08
          speaker: narrator
          text: Beauty had half expected his anger. His gentle voice reassured her, and she returned to the palace, where supper waited. Later, the Beast came in as usual. He asked about her visit, whether she had enjoyed it, and whether her family had been glad to see her. Beauty took pleasure in telling him everything.
        - id: ch06-b09
          speaker: narrator
          text: At last the time came for him to leave. Once more, he asked the question he had asked so often.
        - id: ch06-b10
          speaker: beast
          text: Beauty, will you marry me?
        - id: ch06-b11
          speaker: beauty
          text: Yes, dear Beast.
        - id: ch06-b12
          speaker: narrator
          text: The moment she spoke, light blazed outside the palace windows. Fireworks crackled and guns thundered. Across the avenue of orange trees, fireflies formed glowing words that cried, “Long live the Prince and his Bride.”
        - id: ch06-b13
          speaker: narrator
          text: Beauty turned to ask the Beast what it meant. He was gone. In his place stood the Prince she had loved in her dreams. At that instant, carriage wheels sounded on the terrace. Two ladies entered. One was the stately lady from Beauty's dreams. The other looked so grand and queenly that Beauty scarcely knew which one to greet first.
    - id: ch07
      title: The Prince and His Bride
      blocks:
        - id: ch07-b01
          speaker: fairy
          text: Your Majesty, this is Beauty. She had the courage to rescue your son from a terrible enchantment. They love each other. Only your consent to their marriage is needed to make them perfectly happy.
        - id: ch07-b02
          speaker: queen
          text: I consent with all my heart! Charming girl, how can I ever thank you enough for restoring my dear son to his true form?
          emotion: happy
        - id: ch07-b03
          speaker: narrator
          text: The Queen embraced Beauty and the Prince tenderly. Meanwhile, the Prince greeted the Fairy and received her congratulations.
        - id: ch07-b04
          speaker: fairy
          text: Beauty, shall I send for all your brothers and sisters so they can dance at your wedding?
        - id: ch07-b05
          speaker: narrator
          text: And so she did. The wedding was celebrated the very next day with the greatest splendor, and Beauty and the Prince lived happily ever after.
