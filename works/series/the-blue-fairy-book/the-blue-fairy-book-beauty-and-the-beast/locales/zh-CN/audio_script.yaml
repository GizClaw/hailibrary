audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    merchant:
      display_name: 商人
      tts: {delivery: 温和诚恳而略带忧虑, timbre: 成熟温暖, pace: 中等, pitch: 中低音}
    beauty:
      display_name: 美人
      tts: {delivery: 真挚勇敢而温柔, timbre: 年轻清亮, pace: 从容有变化, pitch: 中高音}
    beast:
      display_name: 野兽
      tts: {delivery: 粗犷威严却感情深厚, timbre: 低沉浑厚, pace: 缓慢郑重, pitch: 低音}
    prince:
      display_name: 王子
      tts: {delivery: 温柔深情而略带忧伤, timbre: 年轻醇厚, pace: 舒缓, pitch: 中音}
    fairy:
      display_name: 仙女
      tts: {delivery: 端庄笃定而富有智慧, timbre: 清澈明亮, pace: 从容, pitch: 中音}
    queen:
      display_name: 王后
      tts: {delivery: 高贵慈爱而情感真挚, timbre: 成熟温暖, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 从富贵到贫困
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，遥远的国度里有一位商人。他做什么买卖都顺利，积下了万贯家财。不过，他有六个儿子和六个女儿，孩子们又一向想要什么便有什么。再大的家业，也经不起这样花用。
        - id: ch01-b02
          speaker: narrator
          text: 一天，灾难突然降临。他们的房子失火了，家具、书画、金银和贵重货物转眼全成了灰。可这还只是开头。商人的船有的遇上海盗，有的沉没，有的毁于大火，竟一艘也没剩下。就连他最信任的海外管事也背叛了他。偌大的家业就这样散得一干二净。
        - id: ch01-b03
          speaker: narrator
          text: 商人只剩下一幢偏僻的小屋，离他们原先住的城足有一百里格。他只能带着孩子们搬到那里。女儿们想到生活将与从前天差地别，全都绝望极了。她们本以为那些富贵时来往的朋友会挽留自己，毕竟如今连房子也没有了。谁知那些人不但不肯收留她们，还说这场灾祸全怪他们过去太挥霍。全家只得走进幽暗的森林，住进那幢仿佛世上最凄凉的小屋。
        - id: ch01-b04
          speaker: narrator
          text: 家里再也雇不起仆人。儿子们下田种地，靠收成谋生，女儿们也得像农家姑娘一样辛苦劳作。姐姐们穿着粗衣、过着最简单的日子，却从早到晚都在怀念从前的奢华和玩乐。只有最小的女儿慢慢振作起来。灾难刚发生时，她和谁都一样悲伤，可她天性开朗，很快便认真干活，尽力把眼前的日子过好。她逗父亲和哥哥们开心，还请姐姐们一起唱歌跳舞。姐姐们不肯，反而因为她没有整天愁眉苦脸，就说这种苦日子才配得上她。
        - id: ch01-b05
          speaker: narrator
          text: 其实，小女儿比姐姐们更聪明，也远比她们美丽。因为她生得实在动人，大家都叫她“美人”。两年后，一家人刚习惯新生活，商人忽然得到消息，说一艘早已被认定失踪的船载着贵重货物进港了。
        - id: ch01-b06
          speaker: narrator
          text: 孩子们认定苦日子已经结束，恨不得立刻回城。父亲却比他们谨慎，叫大家耐心等待。虽然正值收获时节，家里少不了他，他还是决定先独自去探听虚实。除了美人，其他孩子都相信自己很快就会恢复从前的富贵，至少也能搬回城里，重新过上有玩乐、有朋友的舒适生活。于是，他们托父亲购买昂贵的衣裳和珠宝，那些要求加起来足以花掉一大笔财产。只有美人知道希望渺茫，什么也没要。
        - id: ch01-b07
          speaker: merchant
          text: 美人，你希望我给你带什么回来？
        - id: ch01-b08
          speaker: beauty
          text: 我什么礼物都不要，只想看见您平安回家。
        - id: ch01-b09
          speaker: narrator
          text: 姐姐们听了很生气，以为她是在责备自己贪心。父亲却十分欣慰，不过，他觉得女儿这个年纪总该喜欢漂亮东西，还是让她选一样。
        - id: ch01-b10
          speaker: beauty
          text: 好吧，亲爱的父亲。既然您一定要带礼物，就请给我一朵玫瑰。我搬来以后再没见过玫瑰，可我真的很喜欢它们。
    - id: ch02
      title: 城堡里的一朵玫瑰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 商人启程以后，尽快赶到了城里。他原以为那艘船会带来转机，谁知昔日的伙伴以为他已经死了，早把船上的货物分得一干二净。商人为了讨回自己的财产，足足奔波了六个月，惹来无数麻烦，也花了不少钱。到最后，他只追回刚够支付这趟旅费的一点财物，离城时依旧和出门时一样贫穷。孩子们盼望的珠宝和衣裳，自然一件也买不成。
        - id: ch02-b02
          speaker: narrator
          text: 更糟的是，他离城时又遇上可怕的风雪。离家还有几里格，商人已经冻得精疲力尽。他明知穿过森林还要几个钟头，只因急着赶完路程，仍旧继续前行。可黑夜很快追上来，积雪太深，寒气太重，马再也驮不动他。四下连一幢房屋也看不见，他唯一能找到的藏身处，是一棵中空的大树。商人蜷缩在里面，觉得这一夜比一生中任何一夜都漫长。狼嗥声始终在林中回荡，他再累也没能合眼。等到天亮，处境仍没好转。大雪埋住每条道路，他根本不知道该往哪里走。
        - id: ch02-b03
          speaker: narrator
          text: 好不容易，他找到一条又陡又滑的小径，接连摔了几跤。前方的路渐渐平坦，最后通向一条林荫大道，尽头是一座华美的城堡。奇怪的是，这里没有一点雪。路旁的橘树还开着花，结着果。
        - id: ch02-b04
          speaker: narrator
          text: 商人来到城堡第一重庭院，登上玛瑙台阶，穿过一间又一间陈设华美的屋子。温暖的空气使他恢复精神，肚子却饿得难受。这样辽阔壮丽的宫殿，竟连个人影也没有，他想讨些食物都找不到对象。四下一片死寂。商人在空房间和长廊里转了许久，终于累得走不动。他在一间较小的屋里看见明亮的炉火，长榻就挨着火炉。他以为这是给某位即将到来的客人准备的，便坐下来等候，不知不觉香甜地睡着了。
        - id: ch02-b05
          speaker: narrator
          text: 几个钟头后，剧烈的饥饿把他唤醒。他仍是独自一人，身旁却不知何时移来一张小桌，上面摆着丰盛的饭菜。商人已经整整二十四个钟头没吃东西，立刻动手大吃，只盼体贴的神秘主人早点现身，好让自己当面道谢。可是直到用餐结束，也没有人来。他后来又沉沉睡了一觉，醒来后精神全恢复了，手边的桌上也换成新鲜的糕点和水果，宫里仍旧不见半个人影，听不到一点声响。
        - id: ch02-b06
          speaker: narrator
          text: 商人胆子不大，这样的寂静叫他越来越害怕。他再次搜遍所有房间，还是连一个仆人也找不到，整座宫殿没有一点生命的迹象。他不知道还能做什么。为了给自己解闷，他索性假装眼前的宝物全归自己所有，还认真盘算起该怎样把它们分给儿女。随后，他走进花园。外面明明是严冬，这里却阳光温暖、百花盛开，鸟儿唱着歌，空气又柔和又芬芳。所见所闻使他陶醉不已。
        - id: ch02-b07
          speaker: merchant
          text: 这些美好的东西一定是给我的！我这就回家，把孩子们接来一起享用。
        - id: ch02-b08
          speaker: narrator
          text: 商人来时已经把马安顿在马厩里。现在，他沿着小路去备马回家。路两旁开满玫瑰，比他见过的任何花都娇艳芬芳。他想起对美人的承诺，刚摘下一朵，背后突然传来怪响。他回头一看，一头面目可怕的野兽正怒气冲冲地盯着他。
        - id: ch02-b09
          speaker: beast
          text: 谁准你摘我的玫瑰？我让你住进宫殿，好好款待你，你却偷走我的花来报答我！你这样放肆，休想逃过惩罚！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 商人吓得扔掉玫瑰，扑通跪在地上。
        - id: ch02-b11
          speaker: merchant
          text: 高贵的先生，请饶了我吧！您如此慷慨地招待我，我感激还来不及。我真没想到，拿一朵小小的玫瑰也会冒犯您。
          emotion: fearful
        - id: ch02-b12
          speaker: beast
          text: 你倒很会找借口、说好话。可这些救不了你，你犯下的罪，理当拿命来偿！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 商人心想，美人哪里知道，她要的玫瑰竟让父亲陷入死境！绝望之中，他把家里遭遇的灾难、自己出门的原因，还有美人的请求，全都讲给野兽听。
        - id: ch02-b14
          speaker: merchant
          text: 我其他几个女儿要的东西，恐怕拿一位国王的赎金也买不齐。我只是想，至少能给美人带回一朵玫瑰。求您原谅，我真的没有恶意。
        - id: ch02-b15
          speaker: narrator
          text: 野兽想了一会儿，怒气稍稍平息。
        - id: ch02-b16
          speaker: beast
          text: 我可以饶你，不过有个条件。你得把一个女儿交给我。
        - id: ch02-b17
          speaker: merchant
          text: 我若拿亲生孩子的性命换自己的命，岂不是太残忍了？我又能编出什么借口，把她骗到这里来？
        - id: ch02-b18
          speaker: beast
          text: 不准骗她。她若来，必须完全出于自愿。你去看看，哪个女儿既勇敢，又足够爱你，肯留下来救你的命。我看你还算诚实，就放你回家。一个月之内，你带一个自愿的女儿回来，我便让你自由。若是谁也不肯，你就向她们永远告别，然后独自回来，因为那时你便属于我了。不要妄想躲藏。你敢失信，我会亲自把你抓来！
        - id: ch02-b19
          speaker: narrator
          text: 商人只好接受这个条件，心里却根本不相信会有女儿愿意来。他答应在约定的日期返回，只想尽快离开野兽面前，便请求马上启程。可野兽不准，说他必须留到第二天。
        - id: ch02-b20
          speaker: beast
          text: 明天会有马为你备好。现在回去吃晚饭，等我的吩咐。
        - id: ch02-b21
          speaker: narrator
          text: 商人半死不活地回到房里。熊熊炉火前已经摆好一桌最美味的晚餐，他怕得吃不下，却担心违抗命令惹怒野兽，只得勉强尝了几样。吃完以后，隔壁传来一阵巨响。他知道野兽又来了，却没有任何办法逃避，只好尽力藏起恐惧。野兽现身后，粗声问他晚餐吃得好不好。商人谦恭地回答，说自己多谢主人的盛情。野兽又命他牢牢记住两人的约定，把女儿将要面对的一切如实告诉她。
        - id: ch02-b22
          speaker: beast
          text: 明早看见太阳、听到金钟以前，不要起床。钟响以后，这里会有早餐，庭院里也会有马。一个月后，你带女儿回来，还是由它送你们。再见。给美人带一朵玫瑰，千万记住承诺！
        - id: ch02-b23
          speaker: narrator
          text: 野兽一走，商人才松了口气。他悲伤得彻夜难眠，直到太阳升起才匆匆吃过早餐，摘下给美人的玫瑰，跨上马背。那马疾驰如飞，转眼便把城堡甩得无影无踪。商人还陷在阴郁的思绪里，马已经停在小屋门前。
    - id: ch03
      title: 美人的选择
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 商人久久没有回家，儿女们一直担心得不得了，一见他便全都冲出来迎接，急着追问这趟旅程的结果。他们看见父亲骑着一匹神骏的马，身上还披着华贵斗篷，便以为事情一定十分顺利。商人起先不肯说出实情，只是神色悲伤地走到美人面前，把那朵玫瑰交给她。
        - id: ch03-b02
          speaker: merchant
          text: 这是你要的礼物。你根本想不到，我为这朵花付出了怎样的代价。
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 这句话让大家的好奇心越发强烈，商人只好把路上的经历从头到尾全讲出来。听完以后，每个人都难过起来。女儿们为破灭的富贵梦高声哀叹，儿子们坚决不许父亲回那座可怕的城堡，还商量着等野兽来抓人时怎样杀掉它。商人却提醒他们，自己已经许下承诺，不能违背。姐姐们便把怒气全撒在美人身上，说她若讨一件正经礼物，哪会惹出这种灾祸，还埋怨全家竟得为她的愚蠢受苦。
        - id: ch03-b04
          speaker: beauty
          text: 这场祸的确因我而起，可我绝不是故意的。谁能想到，大夏天要一朵玫瑰也会招来苦难？既然是我惹的祸，就该由我承受。我会陪父亲回去，让他履行诺言。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 起初，谁也不肯听从这个安排。父亲和深爱她的哥哥们坚决不许她去，美人却心意已定。约定的日子渐渐临近，她把自己仅有的一点东西分给姐姐，又向心爱的一切一一告别。那致命的一天终于到了，她和父亲共骑那匹神奇的马，还反过来一路鼓励、安慰他。马不像在地上奔驰，倒像平稳地飞翔，美人一点也不害怕。若不是担忧旅程尽头等待自己的命运，她简直会喜欢这段骑行。父亲仍在劝她回去，可她始终不肯。
        - id: ch03-b06
          speaker: narrator
          text: 夜色降临，五彩光芒忽然从四周亮起，绚丽的焰火照亮森林，刺骨的寒气也变得温暖。橘树林荫道旁，一尊尊雕像举着火炬。宫殿从屋顶到地面灯火通明，庭院里还飘出柔和的音乐。
        - id: ch03-b07
          speaker: beauty
          text: 野兽一定饿坏了。要不然，怎么会为了迎接送上门的猎物，摆出这么大的庆典呢？
        - id: ch03-b08
          speaker: narrator
          text: 美人勉强说着笑话，心里虽然不安，却仍忍不住赞叹眼前的奇景。马停在通往露台的台阶下。父女下马以后，父亲领她走过宫殿，来到自己上次住过的小房间。炉火正旺，餐桌也已精心摆好，上面尽是美味佳肴。美人穿过这么多房间都没看见野兽，恐惧稍稍减轻。长途骑行又让她十分饥饿，她便愿意和父亲一起用餐。
        - id: ch03-b09
          speaker: narrator
          text: 两人刚吃完，沉重的脚步声便渐渐逼近。美人吓得抓紧父亲，看见父亲怕成那副模样，自己更觉恐惧。野兽真的出现时，她浑身发抖，却竭力藏住害怕，恭恭敬敬地行了一礼。野兽似乎很满意。它打量着美人，声音虽然没有怒气，依旧足以吓破大胆之人的心。
        - id: ch03-b10
          speaker: beast
          text: 晚上好，老人家。晚上好，美人。
        - id: ch03-b11
          speaker: narrator
          text: 商人吓得说不出话。
        - id: ch03-b12
          speaker: beauty
          text: 晚上好，野兽。
        - id: ch03-b13
          speaker: beast
          text: 你真是自愿来的吗？父亲走后，你甘愿独自留在这里？
        - id: ch03-b14
          speaker: beauty
          text: 是的。我已经准备好留下了。
        - id: ch03-b15
          speaker: beast
          text: 你既然自愿前来，我很满意。美人，你可以留下。老人家，明早太阳一升起，你就离开。听见钟响，立刻起床吃早餐，那匹马会送你回去。记住，从此以后，你永远别想再见到我的宫殿。
        - id: ch03-b16
          speaker: beast
          text: 美人，带父亲去隔壁房间。那里有两只旅行箱，你认为哥哥姐姐会喜欢什么，就尽管装进去。你要留在这里，应该送些珍贵的东西给他们留作纪念。
        - id: ch03-b17
          speaker: narrator
          text: 野兽向美人和老人分别道别，这才离开。美人想到父亲就要走，心里十分不安，却不敢违抗命令。隔壁房间四面全是架子和橱柜，里面的财富让父女俩惊讶万分。有王后才配穿的华美衣裙，也有和每套衣裙相配的全副首饰。美人一打开橱柜，就被架子上成堆的珠宝耀得几乎睁不开眼。她先给每个姐姐分好衣裙和首饰，随后又打开最后一只箱子，看见里面全是黄金。她觉得黄金对父亲更有用，便把那些东西取出来，改装金子。
        - id: ch03-b18
          speaker: narrator
          text: 奇怪的是，放进去的金子越多，箱子里的空处也越多。他们只好把衣裙和珠宝全放回去，美人还添了更多首饰。最后，箱子仍没装满，却重得连大象也驮不动。
        - id: ch03-b19
          speaker: merchant
          text: 野兽是在戏弄我们！它明知我搬不动，才故意说要把这些全送给我们。
        - id: ch03-b20
          speaker: beauty
          text: 先扣好箱子，放在这里等等看吧。我不相信它有意欺骗我们。
        - id: ch03-b21
          speaker: narrator
          text: 两人扣好箱子，回到小房间，惊讶地看见早餐已经备好。野兽这样慷慨，商人觉得自己或许还能回来探望女儿，因此吃得很有胃口。美人却相信父亲这次离开以后，自己便永远见不到他了。金钟第二次尖锐地响起，提醒他们分别的时刻已到。庭院里两匹马已经等得直刨地面，一匹供商人骑，一匹驮着两只沉重的箱子。它们急不可耐地要出发，商人只来得及匆匆告别。刚一上马，他就被飞驰的坐骑带得无影无踪。美人哭了起来，独自悲伤地走回房间。
        - id: ch03-b22
          speaker: narrator
          text: 美人哭着回到房间。她哭累以后觉得困倦，左右也没有别的事情可做，便躺下身，很快睡着了。梦里，她沿着一条林木环绕的小溪行走，一边走，一边为自己的悲惨命运叹息。就在这时，一位从未见过的年轻王子来到她面前。他比美人见过的任何人都俊美，开口说话时，那温柔的声音仿佛一直抵达她的心底。
        - id: ch03-b23
          speaker: prince
          text: 美人，你并没有自己想的那样不幸。过去受过的苦，都会在这里得到补偿，你的每个愿望也会实现。只求你认出我，不管我藏在怎样的外表下。我深深地爱着你。你让我幸福，也就能找到自己的幸福。只要你的心和容貌一样真诚，我们便再没有什么可求了。
        - id: ch03-b24
          speaker: beauty
          text: 王子，我要怎样做，才能使你幸福？
        - id: ch03-b25
          speaker: prince
          text: 懂得感激就好，也不要太相信自己的眼睛。最要紧的是，在你救我摆脱苦难以前，千万不要抛下我。
        - id: ch03-b26
          speaker: narrator
          text: 梦境一转，美人来到一位端庄美丽的夫人面前。
        - id: ch03-b27
          speaker: fairy
          text: 亲爱的美人，不要留恋你抛在身后的一切。命运已经为你安排了更好的生活，只是别让外表蒙骗了你。
    - id: ch04
      title: 宫殿里的日子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 梦境太迷人，美人一点也不急着醒来。后来，时钟用柔和的声音接连叫了十二遍她的名字，这才把她唤醒。美人起床一看，梳妆台上已经备齐她可能需要的一切。梳洗完毕，隔壁房间又有午餐等着她。独自吃饭毕竟花不了多少时间，她很快便舒舒服服地坐到长沙发一角，又想起梦中那位迷人的王子。
        - id: ch04-b02
          speaker: beauty
          text: 王子说我能使他幸福。难道是野兽把他囚禁在这里？我该怎么救他？他们为什么都叫我别相信外表？唉，那毕竟只是一场梦。我还是找点事情做吧。
        - id: ch04-b03
          speaker: narrator
          text: 美人起身探索宫殿。第一间房四壁全是镜子，她从各个方向都看见自己的身影，觉得自己从没见过这样迷人的屋子。枝形吊灯上挂着一只手镯，忽然吸引了她。她取下来一看，上面竟嵌着梦中那位陌生爱慕者的肖像，模样一模一样。她欢喜地把手镯戴上，又在画廊里找到一幅真人大小的王子画像。那幅画栩栩如生，她细看时，王子仿佛正在向她温柔微笑。美人好不容易才舍得离开。
        - id: ch04-b04
          speaker: narrator
          text: 下一间屋子收藏着世间所有乐器，美人在那里一件件尝试，又唱了很久，直到疲倦才停下。再下一间是图书室。她从前想读的每一本书，还有已经读过的每一本，竟然全都能找到。藏书多得不可胜数，她觉得就算花上一辈子，恐怕连书名也看不完。等她看到这里，天色已经渐渐暗了。每个房间里，镶着钻石和红宝石的烛台开始自行点亮，照得宫殿处处明亮。
        - id: ch04-b05
          speaker: narrator
          text: 晚餐在美人最喜欢的时辰摆好，可周围既没人影，也没声音。父亲虽说过她会独自生活，美人还是觉得有些无聊。没多久，她听见野兽走来，心里发颤，不知它是不是现在就要吃掉自己。
        - id: ch04-b06
          speaker: beast
          text: 晚上好，美人。
        - id: ch04-b07
          speaker: narrator
          text: 野兽看起来并不凶恶。美人快活地问候它，设法不让恐惧露出来。野兽问她怎样度过这一天，她便讲起自己看过的房间。野兽又问，她能不能在这座宫殿里过得幸福。
        - id: ch04-b08
          speaker: beauty
          text: 这里的一切都这样美好。要是我还不能幸福，那我也太难取悦了。
        - id: ch04-b09
          speaker: narrator
          text: 两人谈了约一个钟头，美人觉得野兽并没有自己原先以为的那么可怕。临走时，它用粗哑的声音问她。
        - id: ch04-b10
          speaker: beast
          text: 美人，你爱我吗？愿意嫁给我吗？
        - id: ch04-b11
          speaker: beauty
          text: 我该怎么说呢？我怕拒绝会惹你生气。
          emotion: fearful
        - id: ch04-b12
          speaker: beast
          text: 不用害怕，只要告诉我愿意，还是不愿意。
        - id: ch04-b13
          speaker: beauty
          text: 不，我不愿意，野兽。
        - id: ch04-b14
          speaker: beast
          text: 既然如此，晚安，美人。
        - id: ch04-b15
          speaker: beauty
          text: 晚安，野兽。
        - id: ch04-b16
          speaker: narrator
          text: 美人发现拒绝并没有惹怒它，心里十分庆幸。那一夜，她又梦见了陌生王子。
        - id: ch04-b17
          speaker: prince
          text: 美人，你为什么这样狠心？看来我还要受苦很久很久。
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: 后来梦境不断变换，那位迷人的王子却总在其中。天一亮，美人立刻去看他的肖像，发现画中人确实和梦里一模一样。
        - id: ch04-b19
          speaker: narrator
          text: 第二天阳光灿烂，花园里所有喷泉都在涌动，美人便去那里散心。令她惊奇的是，自己走到哪里都觉得熟悉，仿佛早已来过。不久，她来到一条小溪边，两岸生着香桃木，正是梦中第一次遇见王子的地方。眼前的一切使她越发相信，那位王子一定被野兽囚禁在宫殿某处。美人走了许久，感到疲倦，这才返回宫殿，继续寻找新的消遣。
        - id: ch04-b20
          speaker: narrator
          text: 回到宫殿，她又找到一间装满手工材料的屋子。无论想做哪一种手工，那里都有合适的材料，有可以扎成蝴蝶结的丝带，也有能够绣成花朵的丝线。附近还有一座鸟舍，养着各种稀有的鸟儿。它们十分驯顺，一见美人就从笼中飞来，有的停在她的肩头，有的落在她的头顶，一点也不怕她。
        - id: ch04-b21
          speaker: beauty
          text: 漂亮的小家伙们，要是你们的笼子离我房间近些就好了。那样，我就能常常听你们唱歌。
        - id: ch04-b22
          speaker: narrator
          text: 她说着推开一扇门，门后竟正是自己的房间，尽管她原以为这里远在宫殿另一头。再往前的一间屋里还有更多鸟儿，会说话的鹦鹉和凤头鹦鹉也在其中。它们叫着美人的名字问候，实在有趣。她带了一两只回房，让它们在自己吃晚餐时陪着说话。饭后，野兽照常来访，问了和前一晚相同的问题，最后粗声道了晚安才离开。美人上床以后，也照旧梦见那位神秘王子。
        - id: ch04-b23
          speaker: narrator
          text: 日子在各种消遣中过得飞快。后来，美人发现一个从前没留意的房间。那里空荡荡的，只有每扇窗下各摆着一把十分舒适的椅子。她第一次朝外看时，只见黑幕挡住了全部景象。第二次进来，美人正好走累了，便在一把椅子上坐下。黑幕立刻自行卷起，窗前演出一场妙趣横生的哑剧。舞蹈、彩灯、音乐和漂亮衣裳轮番出现，一切都那么欢快，看得她心醉神迷。
        - id: ch04-b24
          speaker: narrator
          text: 美人依次坐到另外七扇窗边，发现每一扇窗外都有一种新的、出人意料的娱乐。从此，她再不会感到孤单。每天晚饭以后，野兽都来看她，陪她说话，告辞以前总要用那可怕的声音问她愿不愿嫁给自己。如今，美人已经更了解野兽了。她渐渐看出，每次自己回答“不愿意，野兽”，它离开时其实都十分悲伤。
        - id: ch04-b25
          speaker: narrator
          text: 可一场又一场关于俊美王子的幸福梦境，很快就让她忘记了可怜的野兽。只有梦里的警告一直困扰着她。为什么大家总让她不要相信外表，要听心的话，别听眼睛的话？无论美人怎样想，也弄不明白。
    - id: ch05
      title: 两个月的归期
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这样的生活持续了很久。美人虽然快乐，还是渐渐思念起父亲和哥哥姐姐。一天晚上，野兽见她神情忧郁，便问出了什么事。美人已经不怕它了。她知道，野兽虽然长相凶猛，声音骇人，心地却十分温柔，便说自己渴望再见家人。
        - id: ch05-b02
          speaker: beast
          text: 美人，你忍心抛下这样不幸的我吗？我还有什么没给你，为什么仍不能让你幸福？你想逃走，是因为恨我吗？
          emotion: sad
        - id: ch05-b03
          speaker: beauty
          text: 不，亲爱的野兽，我不恨你。若是以后再也见不到你，我也会很难过。可我实在想再见父亲一面。请让我回去两个月吧。我保证一定回来，往后一生都陪着你。
        - id: ch05-b04
          speaker: narrator
          text: 美人说话时，野兽一直悲伤地叹息。
        - id: ch05-b05
          speaker: beast
          text: 不管你求什么，我都无法拒绝，哪怕这会要了我的命。隔壁有四只箱子，你想带什么就装什么。但要记住，两个月以后一定回来。若是迟了，你会发现忠诚的野兽已经死去。回来不需要马车。离开的前一晚，向哥哥姐姐们告别，上床后转动手上的戒指，坚定地说：“我想回到我的宫殿，再见我的野兽。”晚安，美人。什么也别怕，安心睡吧，你很快就会见到父亲。
        - id: ch05-b06
          speaker: narrator
          text: 美人独自留下后，立刻把四周看得见的稀世珍宝往箱子里装。那些箱子仿佛永远填不满。她不停地堆，直到自己累得再也拿不动，它们才总算装满。随后，美人上床睡觉，却因为很快就能见到父亲，欢喜得久久不能入眠。终于，她睡着了，又梦见心爱的王子。可是这一回，王子躺在一片草坡上，满脸忧伤，疲惫不堪，几乎已经不像从前的模样。
        - id: ch05-b07
          speaker: beauty
          text: 你怎么了？
        - id: ch05-b08
          speaker: prince
          text: 狠心的人，你怎么还问我？你这一走，也许就是把我留下等死。
          emotion: sad
        - id: ch05-b09
          speaker: beauty
          text: 别这样难过！我只是回去告诉父亲，我平安又幸福。我郑重答应野兽一定回来。若是我不守信用，它会伤心而死的。
        - id: ch05-b10
          speaker: prince
          text: 它死不死，和你有什么关系？你真的会在意吗？
        - id: ch05-b11
          speaker: beauty
          text: 我当然在意！它对我这么善良，我若毫不在乎，岂不是忘恩负义？为了不让它受苦，我情愿去死。它长得丑，又不是它的错。
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: 一阵奇怪的说话声把美人惊醒。她睁开眼，发现自己身在陌生的房间，远不如宫殿华丽。昨夜装好的箱子全在旁边。她正猜测野兽用了什么魔法，忽然听见父亲的声音，便冲出去，欢喜地拥抱他。
        - id: ch05-b13
          speaker: narrator
          text: 哥哥姐姐们从没料到她还能回来，见到她都惊讶极了，围着问个不停。美人也有许多事情想知道。她听家人讲起分别后的生活，还听父亲说，那匹马当初怎样把他和两箱财宝送回家。可得知美人只能停留两个月，之后还得永远回到野兽身边，他们便高声哀叹。美人又请父亲解释那些古怪的梦，问王子为何总叫她不要相信外表。父亲听完，认真思索了很久。
        - id: ch05-b14
          speaker: merchant
          text: 你说过，野兽虽然模样可怕，却深深地爱你。它对你既温柔又善良，理应得到你的爱和感激。我想，王子是要你明白，哪怕野兽长得丑，你也应该依从它的愿望，给它应得的回报。
        - id: ch05-b15
          speaker: narrator
          text: 美人不得不承认，这番话听起来很有道理。可是每当想到自己深爱的王子那样英俊，她还是一点也不想嫁给野兽。反正两个月内不必作出决定，她便打算和姐姐们一起好好消遣。家里如今已经重新富有，大家又搬回城中，也有许多相识的人可以来往，日子看起来和从前一样热闹。可美人发现，没有什么真能使她快乐。她总是想起那座宫殿，想起自己在那里过得多么幸福。更叫她难过的是，回家以后，她竟一次也没有梦见心爱的王子，仿佛连他也离自己远去了。
        - id: ch05-b16
          speaker: narrator
          text: 姐姐们已经习惯了没有她的生活，甚至觉得她在家有些碍事。因此，两个月期满时，美人原本不会舍不得离开。可是父亲和哥哥们一再挽留，想到她将要回到野兽身边，便显得万分悲痛。为了他们，美人始终没有勇气说出告别的话。每天早晨醒来，她都下定决心，今晚一定开口。可每到夜晚，看见亲人的模样，她又把归期推迟一天。就这样，她一日又一日地违背着承诺。
        - id: ch05-b17
          speaker: narrator
          text: 最后，一场可怕的梦替她下了决心。梦里，美人在宫殿花园一条荒僻的小路上徘徊，忽然听见阵阵呻吟，声音像是从一片灌木丛后传来。灌木遮住了一个洞口。她赶紧跑过去查看，只见野兽侧卧在洞里，已经奄奄一息。它用极其微弱的声音责怪美人，说自己的痛苦全是她造成的。就在这一刻，那位端庄的夫人也出现了，神情十分严肃。
        - id: ch05-b18
          speaker: fairy
          text: 美人，你赶得正好，还能救它一命。现在你看见了吧，人不守承诺会有什么后果！你若再迟一天，见到的就是它的尸体。
        - id: ch05-b19
          speaker: narrator
          text: 美人被这场梦吓坏了。第二天一早，她便告诉大家，自己必须立刻回到宫殿。那天晚上，她终于向父亲和所有哥哥姐姐告别。等到独自上床以后，她按照野兽先前的嘱咐，转动指间那枚神奇的戒指，坚定地说出回去的愿望。
        - id: ch05-b20
          speaker: beauty
          text: 我想回到我的宫殿，再见我的野兽。
        - id: ch05-b21
          speaker: narrator
          text: 愿望说出口以后，她立刻睡着了。醒来时，时钟正用悦耳的声音连叫十二遍“美人”。她马上明白，自己真的回到了宫殿。一切都和从前一样，房间没有丝毫变化，鸟儿们见到她也欢喜极了。可是美人从没觉得一天这样漫长。她急着再见野兽，等待中每个钟头都像没有尽头，只觉晚餐时刻永远也不会到来。
    - id: ch06
      title: 奄奄一息的野兽
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 晚餐终于摆上，野兽却没有出现。美人真的害怕了。她听了又听，等了又等，始终听不见熟悉的脚步声，最后再也坐不住，冲进花园寻找。可怜的美人在一条条小路和林荫道之间来回奔跑，一遍遍呼唤野兽的名字。没有任何回答，也找不到它留下的一丝踪影。
        - id: ch06-b02
          speaker: narrator
          text: 美人跑得筋疲力尽，只好停下来稍歇一会儿。她抬头一看，忽然发现自己正站在梦里那条幽暗小路对面。美人立刻飞奔过去，沿着小路一直跑到尽头。果然，梦里的山洞就在那里，野兽也躺在洞中，看起来像是睡着了。美人庆幸终于找到它，连忙跑上前，伸手轻轻抚摸它的头。可是野兽既不动，也不睁开眼睛。
        - id: ch06-b03
          speaker: beauty
          text: 它死了！全是我的错！
          emotion: sad
        - id: ch06-b04
          speaker: narrator
          text: 美人伤心地哭了起来。她仔细再看，觉得野兽似乎还有一丝呼吸，连忙从最近的喷泉取来水，洒在它脸上。野兽慢慢苏醒了。
        - id: ch06-b05
          speaker: beauty
          text: 野兽，你把我吓坏了！刚才，我以为自己回来得太迟，再也救不了你。直到这一刻，我才知道原来我这样爱你。
        - id: ch06-b06
          speaker: beast
          text: 你真的会爱我这样丑陋的怪物吗？美人，你刚好及时赶到。我以为你忘了承诺，便要死了。现在回去休息吧，过一会儿我会再去见你。
        - id: ch06-b07
          speaker: narrator
          text: 美人原先还有几分担心，怕野兽会因为她迟归而发怒。听见它温柔的声音，她终于放下心来，依言回到宫殿休息。晚餐已经在那里等候她。饭后，野兽又像平常一样走进来，谈起她回家的那段日子，问她是否过得快乐，家人见到她是不是都很欢喜。美人客气地一一回答，也很喜欢把自己回家以后发生的每件事讲给它听。
        - id: ch06-b08
          speaker: narrator
          text: 到了告辞的时候，野兽又问出那个已经问过无数次的问题。
        - id: ch06-b09
          speaker: beast
          text: 美人，你愿意嫁给我吗？
        - id: ch06-b10
          speaker: beauty
          text: 我愿意，亲爱的野兽。
        - id: ch06-b11
          speaker: narrator
          text: 美人话音刚落，宫殿窗外骤然亮起耀眼的光芒。焰火噼啪作响，在夜空中一朵接一朵地绽放，礼炮也轰然鸣响。美人朝橘树林荫道望去，只见无数萤火虫聚在一起，用闪烁的火光组成一行明亮的大字：“王子和他的新娘万岁！”
        - id: ch06-b12
          speaker: narrator
          text: 美人转身想问野兽这一切是什么意思，却发现它已经不见了。站在原地的，竟是她长久爱慕的王子！就在这时，露台上传来马车轮声，两位雍容华贵的夫人走进房间。其中一位正是她梦中见过的仙女，另一位也高贵得仿佛天生便是一位王后。美人又惊又喜，一时间简直不知道该先向谁问候。
        - id: ch06-b13
          speaker: fairy
          text: 王后，这就是美人。她有勇气把您的儿子从可怕的魔法中救出来。他们彼此相爱，现在只差您答应这桩婚事，他们便能得到圆满的幸福。
        - id: ch06-b14
          speaker: queen
          text: 我当然愿意！迷人的姑娘，你使我亲爱的儿子恢复原貌，我真不知道该怎样感谢你才好！
          emotion: happy
        - id: ch06-b15
          speaker: narrator
          text: 王后亲切地拥抱美人和王子。王子也向仙女问候，接受她的祝福。
        - id: ch06-b16
          speaker: fairy
          text: 美人，现在要不要让我把你的哥哥姐姐们全接来，请他们参加婚礼舞会？
        - id: ch06-b17
          speaker: narrator
          text: 仙女果然把他们接来了。第二天，婚礼以无比隆重的排场举行。从此，美人与王子永远幸福地生活在一起。
