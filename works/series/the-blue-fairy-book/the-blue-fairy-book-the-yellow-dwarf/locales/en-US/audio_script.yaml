  chapters:
    - id: ch01
      title: The Proud Princess
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, there was a queen who had lost all but one of her many children. The daughter who remained seemed worth a thousand children to her. Since the death of the Princess's father, the Queen had cared for nothing in the world so much as this one child. She feared losing her so terribly that she spoiled her and never corrected a single fault.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Princess was as pretty as anyone could be, and one day she would wear a crown. But the Queen's fear shaped the way the child grew. Whenever Bellissima behaved badly, her mother excused her. Whenever she showed a fault, no one dared correct it. She heard praise from morning until night and received everything she wanted almost before she could ask. So she grew proud and fell deeply in love with her own beauty. The people around her became less important in her eyes with every passing year, until at last she looked down on everyone else in the world. Her mother made matters worse with endless kisses and flattery. Soon the girl believed there was no honor, treasure, or person too good for her.
        - id: ch01-b03
          speaker: narrator
          text: >-
            She almost always wore the prettiest costumes. Sometimes she dressed as a fairy, and sometimes as a queen riding out to hunt, with the ladies of the Court following her as forest fairies. Then the Queen asked the cleverest painters to make her daughter's portrait. She sent it to several neighboring kings who were her friends, and made the Princess vainer than ever.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Every king who saw the portrait fell in love. One became ill. Another went quite mad. A few lucky ones hurried away to see the Princess for themselves, only to become her slaves the moment they saw her. Before long, twenty charming kings filled the gayest Court anyone had ever known. Each tried to please her. A king might spend a fortune on one entertainment and still feel richly rewarded if she glanced at it and said, "That's pretty."
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Queen loved all this admiration. Every day brought seven or eight thousand sonnets and just as many elegies, madrigals, and songs from poets everywhere. At that time, all prose and poetry seemed to be about the Princess, whose name was Bellissima. There were so many verses that people burned them in bonfires, where they crackled and sparkled better than any wood.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Bellissima was fifteen now, and every prince at Court wanted to marry her. Yet not one dared ask. They had watched her receive their finest gifts and most costly entertainments with barely a word. Any of them would gladly have had his head cut off five or six times a day to please her, while she would have considered the sacrifice a mere trifle. That was how little she cared for them. Her lovers thought her terribly hard-hearted, though none loved her any less for it. The Queen wanted to see her daughter safely married and surrounded by a family of her own. But every gentle hint and every serious conversation ended in the same refusal. She did not know how to make Bellissima think about marriage at all.
        - id: ch01-b07
          speaker: queen
          text: >-
            Bellissima, I wish you would stop being so proud. Why do you despise all these fine kings? I want you to marry one of them, yet you make no effort to please me.
        - id: ch01-b08
          speaker: bellissima
          text: >-
            I am perfectly happy as I am, madam. Please leave me in peace. I do not want to care for anyone.
        - id: ch01-b09
          speaker: queen
          text: >-
            You could be very happy with any one of these princes. And if you ever fall in love with someone unworthy of you, I shall be very angry.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Bellissima thought so highly of herself that none of her suitors seemed clever or handsome enough. Her mother grew truly angry at her refusal to marry. For the first time, the Queen began to wish she had not always let her daughter have her own way.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At last the Queen decided to seek advice from a witch called the Fairy of the Desert. Reaching her would be dangerous, for terrible lions guarded her. Long before, however, the Queen had heard the secret of passing them safely. She must throw them a cake made with millet flour, sugar candy, and crocodile eggs.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The Queen made the cake herself, placed it in a little basket, and set out. She was not used to long walks. Soon she grew tired, sat beneath a tree, and fell fast asleep. When she woke, the basket was empty. The whole cake had vanished. Then came the roar of the great lions. They knew she was near, and they were coming to find her.
        - id: ch01-b13
          speaker: queen
          text: >-
            What can I do? They will eat me!
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            She was too frightened to run even one step. She wept against the tree where she had slept. Just then, someone above her cleared his throat. The Queen searched all around, then looked up. A tiny man sat in the branches, eating oranges.
        - id: ch01-b15
          speaker: yellow_dwarf
          text: >-
            Oh, Queen, I know you very well. I also know how frightened you are of those lions. You have good reason to be. They have eaten many people before you, and now you have no cake to give them.
        - id: ch01-b16
          speaker: queen
          text: >-
            Then I must prepare to die. If only my dear daughter were married, I would not mind so much.
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: >-
            The tiny man was called the Yellow Dwarf because he was a dwarf, his face was yellow, and he lived in the orange tree.
        - id: ch01-b18
          speaker: yellow_dwarf
          text: >-
            You have a daughter? That is excellent news. I have searched the whole world for a wife. Promise that she will marry me, and no lion, tiger, or bear will touch you.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The Queen stared at his ugly little face. It frightened her almost as much as the lions, and she could not say a word.
        - id: ch01-b20
          speaker: yellow_dwarf
          text: >-
            What is this, madam? You hesitate? You must be very eager to be eaten alive.
        - id: ch01-b21
          speaker: narrator
          text: >-
            As he spoke, the lions came racing down a hill. Each had two heads, eight feet, and four rows of teeth. Their bright red skins were as hard as turtle shells. The Queen trembled like a dove beneath a hawk.
        - id: ch01-b22
          speaker: queen
          text: >-
            Dear Mr. Dwarf, Bellissima shall marry you!
          emotion: fearful
        - id: ch01-b23
          speaker: yellow_dwarf
          text: >-
            Oh, indeed? Bellissima may be pretty enough, but I am not especially eager to marry her. You may keep her.
        - id: ch01-b24
          speaker: queen
          text: >-
            Noble sir, please do not refuse her. She is the most charming princess in the world.
          emotion: fearful
        - id: ch01-b25
          speaker: yellow_dwarf
          text: >-
            Very well. Out of charity, I will take her. But remember this. She belongs to me.
        - id: ch01-b26
          speaker: narrator
          text: >-
            A little door opened in the trunk of the orange tree. The Queen rushed through just in time, and it slammed with a bang in the lions' faces. She stood there so confused that she did not notice the second little door at first. When it opened, she stepped out into a field of thistles and stinging nettles. A muddy ditch circled the whole place, cutting it off from everything beyond. Farther on stood a tiny cottage under a roof of thatch. The Yellow Dwarf came out to meet her with a jaunty, self-satisfied air. He clattered along in wooden shoes and wore a little yellow coat. There was not one hair on his head, while his ears were remarkably long. The Queen had never seen a more shocking little figure, and the miserable field around him made the promise she had just given seem more dreadful with every moment.
        - id: ch01-b27
          speaker: yellow_dwarf
          text: >-
            Since you will be my mother-in-law, I am delighted to show you the little home where Bellissima and I shall live. These thistles and nettles will feed a donkey for her to ride. This humble roof will shelter her in any weather. She can drink from the brook and eat the frogs, which grow wonderfully fat here. Best of all, she will always have me, as handsome, agreeable, and merry as you see me now. I shall stay so close that even her shadow will struggle to keep up.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The Queen suddenly understood what a miserable life her daughter would have with him. She could not bear the thought and fainted without a word.
    - id: ch02
      title: The Ring of Red Hair
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            When the Queen opened her eyes, she was lying in her own bed at home. On her head was the loveliest lace nightcap she had ever seen. At first, she thought the lions, the Dwarf, and her promise must all have been a dream. But the new cap, with its beautiful ribbon and lace, proved that every bit was true. The thought made her so unhappy that she could neither eat, drink, nor sleep.
        - id: ch02-b02
          speaker: narrator
          text: >-
            For all her willfulness, Bellissima loved her mother with her whole heart. She was grieved to see the Queen so sad and often asked what troubled her. The Queen would only say she was ill, or that a neighboring ruler was threatening war. Bellissima knew that neither answer was true and that her mother was hiding something.
        - id: ch02-b03
          speaker: narrator
          text: >-
            So the Princess decided to consult the Fairy of the Desert herself. Everyone said the Fairy was wise. Bellissima could ask what had saddened the Queen and, at the same time, ask whether she ought to marry. She carefully made the proper cake for the lions. One night, she went to her room early and pretended to go to bed. Instead, she wrapped herself in a long white veil, slipped down a secret staircase, and set out alone.
        - id: ch02-b04
          speaker: narrator
          text: >-
            She reached the same fatal orange tree and saw it covered in flowers and fruit. Bellissima stopped to gather oranges. She set down her basket and sat to eat. When she rose to continue, the basket was gone. She searched everywhere without finding a trace. The longer she looked, the more frightened she became, until at last she began to cry. Then the Yellow Dwarf suddenly stood before her.
        - id: ch02-b05
          speaker: yellow_dwarf
          text: >-
            What troubles you, my pretty one? Why are you crying?
        - id: ch02-b06
          speaker: bellissima
          text: >-
            I have every reason to cry. I lost the basket of cake that would have taken me safely past the lions to the Fairy of the Desert's cave.
          emotion: sad
        - id: ch02-b07
          speaker: yellow_dwarf
          text: >-
            And what do you want with her? She is my friend, and I am every bit as clever as she is.
        - id: ch02-b08
          speaker: bellissima
          text: >-
            My mother, the Queen, has fallen into such sorrow that I fear she may die. I worry that I caused it. She wants me to marry, but I have not yet found anyone worthy to be my husband. I hoped the Fairy could advise me about both things.
        - id: ch02-b09
          speaker: yellow_dwarf
          text: >-
            Then trouble yourself no more, Princess. I can answer better than she can. Your mother has already promised you in marriage—
        - id: ch02-b10
          speaker: bellissima
          text: >-
            Promised me? No, I am certain she has not. She would have told me. This concerns me too closely for her to promise anything without my consent. You must be mistaken.
          emotion: surprised
        - id: ch02-b11
          speaker: narrator
          text: >-
            The Dwarf suddenly dropped to his knees before her.
        - id: ch02-b12
          speaker: yellow_dwarf
          text: >-
            Beautiful Princess, perhaps her choice will please you after all. She promised the happiness of marrying you to me.
        - id: ch02-b13
          speaker: bellissima
          text: >-
            You? My mother wants me to marry you? How can you imagine anything so foolish?
          emotion: surprised
        - id: ch02-b14
          speaker: yellow_dwarf
          text: >-
            It is not that I care greatly for the honor. But the lions are coming. They will swallow you in three mouthfuls, and that will be the end of you and your pride.
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: >-
            Their dreadful howls were already drawing nearer.
        - id: ch02-b16
          speaker: bellissima
          text: >-
            What can I do? Must all my happy days end like this?
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: >-
            The spiteful Dwarf laughed at her.
        - id: ch02-b18
          speaker: yellow_dwarf
          text: >-
            At least you will have the pleasure of dying unmarried. Surely a lovely princess like you would rather die than become the wife of a poor little dwarf.
        - id: ch02-b19
          speaker: bellissima
          text: >-
            Please do not be angry. I would rather marry every dwarf in the world than die in such a horrible way.
          emotion: fearful
        - id: ch02-b20
          speaker: yellow_dwarf
          text: >-
            Look at me carefully before you give your word. I would not want you to promise in haste.
        - id: ch02-b21
          speaker: bellissima
          text: >-
            The lions are coming! I have looked long enough. I am terrified. Save me now, or the fear itself will kill me!
          emotion: fearful
        - id: ch02-b22
          speaker: narrator
          text: >-
            Bellissima fainted as she spoke. When she recovered, she was back in her own little bed. She had no idea how she had returned. Beautiful lace and ribbons covered her, and a little ring made from one red hair circled her finger. It fitted so tightly that no matter how she tried, she could not pull it off.
        - id: ch02-b23
          speaker: narrator
          text: >-
            The lace, the ribbons, and that strange tight ring brought back everything that had happened. Bellissima remembered her terror beneath the orange tree and the promise she had made to escape the lions. She sank into the deepest sadness. The change in her astonished the whole Court. A princess who had once cared so much for admiration now moved through the palace in silence. Everyone was alarmed, but the Queen was more frightened than anyone. She recognized too well the kind of grief that follows a meeting with the Yellow Dwarf. A hundred times she asked Bellissima whether something had happened, and a hundred times the Princess insisted that nothing was wrong. Neither mother nor daughter could bring herself to confess the promise she had made.
        - id: ch02-b24
          speaker: narrator
          text: >-
            At last, the chief men of the kingdom begged the Queen to choose a husband for her daughter as soon as possible. The Queen said nothing would please her more, but Bellissima seemed unwilling. She told them to speak with the Princess themselves, and they went at once.
        - id: ch02-b25
          speaker: narrator
          text: >-
            Since meeting the Yellow Dwarf, Bellissima was not quite so proud. She could think of no better way to escape the little monster than to marry a powerful king. The chief men found her far more willing than they had expected.
        - id: ch02-b26
          speaker: bellissima
          text: >-
            I am happy as I am. Still, to please you, I will marry the King of the Gold Mines.
        - id: ch02-b27
          speaker: narrator
          text: >-
            The King of the Gold Mines was both handsome and powerful. He had loved Bellissima for years, but her coldness had kept him from believing she might ever care for him. When word of her choice reached him, his delight was greater than anyone could describe. The news traveled just as quickly to all the other kings who had filled her Court. They understood that their hopes were gone forever, and anger joined their disappointment. Still, Bellissima could not possibly have married twenty kings. Choosing even one had been difficult enough. Fear of the Yellow Dwarf had made her less proud, but it had not cured her vanity. A part of her still believed there was no man in the world quite worthy of becoming her husband.
        - id: ch02-b28
          speaker: narrator
          text: >-
            Preparations began at once for the grandest wedding ever held at the palace. The King of the Gold Mines sent such immense sums of money that the sea seemed covered from shore to shore by the ships carrying it. Messengers traveled to the gayest and most elegant courts, and especially to the Court of France. Their orders were to find every rare cloth, jewel, ornament, and precious object that might adorn the Princess. Craftspeople worked without rest, servants filled the palace, and each new arrival brought some marvel more costly than the last. Yet the King himself believed Bellissima's beauty was already perfect. No jewel could brighten it, and no dress could improve it. He was never truly happy unless he was beside her.
        - id: ch02-b29
          speaker: narrator
          text: >-
            Bellissima had chosen the King first because his strength might protect her from the Dwarf. But the more she saw of him, the more sincerely she liked him. He was generous without boasting, handsome without vanity, and clever enough to delight her. Little by little, fear gave way to affection. At last she loved him almost as much as he loved her. They spent long, happy hours wandering through the palace gardens together. Sometimes musicians played nearby while the two of them walked beneath the trees. The King also wrote songs for Bellissima. He filled them with flowers, birds, and all the happiness he imagined sharing with her. Of all his songs, one pleased the Princess most.
        - id: ch02-b30
          speaker: gold_mines_king
          text: >-
            The forest turns joyful whenever my Princess walks there. Blossoms flutter down, hoping she will step on them. Bright flowers lift their faces as she brushes through the grass. Birds overhead answer our songs of love while we wander hand in hand through this enchanted land.
        - id: ch02-b31
          speaker: narrator
          text: >-
            They were as happy as the day was long. Bellissima's disappointed suitors went home in despair. Their farewells were so sorrowful that she could not help pitying them.
        - id: ch02-b32
          speaker: gold_mines_king
          text: >-
            Madam, why spend your pity on these princes? They love you so much that one smile from you would repay every sorrow.
        - id: ch02-b33
          speaker: bellissima
          text: >-
            I would be sorry if you had failed to notice my pity. You have every reason to be pleased with me, sire, but they are leaving in sadness. Please do not begrudge them a little compassion.
        - id: ch02-b34
          speaker: narrator
          text: >-
            Her gentle answer overcame him. He fell at her feet, kissed her hand again and again, and begged her forgiveness.
    - id: ch03
      title: The Broken Wedding
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last the long-awaited wedding day arrived. Trumpets sounded through the city. Flags hung over every street, flowers covered the ground, and crowds poured toward the great square before the palace. People pressed together for a glimpse of the Princess and the King she had chosen. Inside, servants hurried from room to room as the final preparations were completed. The Queen was so joyful that she had barely slept. She rose before dawn to give every necessary order herself and to choose the jewels her daughter would wear. After so many anxious days, she believed Bellissima would finally be safe and happy.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Even Bellissima's shoes were covered in diamonds. Her silver brocade gown was embroidered with twelve rays of the sun. Nothing could have shone more brightly except the Princess herself. A splendid crown rested on her head, and her beautiful hair fell nearly to her feet. Among all the ladies attending her, no one could mistake her stately figure.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The King of the Gold Mines looked just as noble and magnificent as his bride. Anyone could see his happiness in his face. He wanted the whole kingdom to share his joy, and everyone who came near him left carrying gifts. A thousand barrels filled with gold stood all around the great banqueting hall. Beside them lay countless velvet bags embroidered with pearls and packed with money. Each bag held at least a hundred thousand gold pieces. Courtiers, servants, and visitors had only to hold out a hand, and one of those fortunes was placed in it. Hands appeared everywhere. Many guests decided that receiving the King's gold was by far the most entertaining part of the wedding festivities.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The Queen, the Princess, and the King were ready to leave when two enormous basilisks entered at the far end of the long gallery. They dragged a badly made box behind them. Then came a tall old woman, astonishingly ancient and ugly. A black taffeta ruff circled her neck. She wore a red velvet hood and a ragged farthingale, and she leaned heavily on a crutch.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Without speaking, the old woman hobbled three times around the gallery while the basilisks followed. At last she stopped in the center and waved her crutch like a threat.
        - id: ch03-b06
          speaker: desert_fairy
          text: >-
            Ho, Queen! Ho, Princess! Did you think you could break your promise to my friend the Yellow Dwarf and suffer no punishment? I am the Fairy of the Desert. Without the Dwarf and his orange tree, my lions would have eaten you both. We do not accept such insults in Fairyland. Decide at once. Bellissima will marry the Yellow Dwarf, or may my own crutch burn!
          emotion: angry
        - id: ch03-b07
          speaker: queen
          text: >-
            Princess, what am I hearing? What did you promise?
          emotion: sad
        - id: ch03-b08
          speaker: bellissima
          text: >-
            Mother, what did you promise yourself?
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: >-
            The King of the Gold Mines could not bear to have this wicked old woman keep him from his happiness. He drew his sword and advanced on her.
        - id: ch03-b10
          speaker: gold_mines_king
          text: >-
            Leave my country now and never return, miserable creature, or I will take your life and end your malice with it.
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: >-
            The lid of the box crashed to the floor. Out sprang the Yellow Dwarf, riding a huge Spanish cat. He rushed between the Fairy and the King.
        - id: ch03-b12
          speaker: yellow_dwarf
          text: >-
            Reckless boy! You dare threaten this great Fairy? Your quarrel is with me. I am your enemy and your rival. That faithless Princess was promised to me, though she meant to marry you. Look at her finger. The ring is made from one of my hairs. Try to remove it, and you will learn which of us has greater power.
          emotion: angry
        - id: ch03-b13
          speaker: gold_mines_king
          text: >-
            Wretched little monster! You call yourself Bellissima's lover and claim such a treasure? You are an ugly dwarf whom no one can bear to look at. I would have killed you long ago if you were worthy of so glorious a death.
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: >-
            The insult threw the Dwarf into a rage. He drove his spurs into the Spanish cat. It gave a horrible yell and sprang from side to side, terrifying everyone in its path. Courtiers scattered, but the brave King held his ground and pursued the Dwarf closely through the gallery. At last the little creature drew the great knife he carried as a weapon and challenged his rival to meet him alone in combat. Then cat and rider clattered down toward the palace courtyard. The angry King followed at once. The entire Court rushed onto the balconies, eager and afraid to see what would happen when the two rivals faced each other.
        - id: ch03-b15
          speaker: narrator
          text: >-
            They had barely faced each other when the Court crowded onto the balconies to watch. Suddenly the sun turned blood red, and darkness fell until people could hardly see. Thunder crashed. Lightning threatened to burn everything. The two basilisks rose on either side of the Dwarf, huge as mountains, with fire pouring from their mouths and ears like blazing furnaces.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The young King did not flinch before the darkness, the thunder, or the enormous flaming creatures. Every look and movement showed his courage. The people on the balconies took heart from him, and even the Yellow Dwarf seemed troubled by such boldness. Then the King looked up and saw what was happening to Bellissima. The Fairy of the Desert had become more terrible than before. She was mounted on a winged griffin, with long snakes coiled around her neck. Before anyone could protect the Princess, the Fairy drove forward and struck her with the lance in her hand. Bellissima fell bleeding and senseless into her mother's arms.
        - id: ch03-b17
          speaker: narrator
          text: >-
            The Queen felt the blow as if it had struck her own body. Her cries were so piercing that the King lost all thought of the fight. He ran toward Bellissima, ready to save her or die beside her. The Yellow Dwarf moved first. His Spanish cat sprang onto the balcony. The Dwarf tore Bellissima from the Queen's arms, bounded onto the palace roof, and vanished with his prize before the ladies could stop him.
        - id: ch03-b18
          speaker: narrator
          text: >-
            The King stood frozen with horror. He could do nothing to prevent the disaster. Then his sight failed, all became dark, and a powerful hand carried him through the air.
        - id: ch03-b19
          speaker: narrator
          text: >-
            The Fairy of the Desert had caused this new misfortune. She had come to the palace only to help the Yellow Dwarf steal Bellissima, but her plans changed the moment she saw the handsome young King. She fell in love with him at once. Once the Dwarf escaped with the Princess, the Fairy robbed the King of sight and carried him through the air. Her destination was a dreadful cavern far from every friend who might help him. There she fastened him to a rock with chains. She believed loneliness and the fear of death would break his devotion to Bellissima. In time, she thought, he would forget the Princess and gladly become the Fairy's slave.
        - id: ch03-b20
          speaker: narrator
          text: >-
            In the cavern, the Fairy restored his sight but left him chained. Then she used magic to appear young and beautiful. Pretending she had come there by chance, she approached him.
        - id: ch03-b21
          speaker: desert_fairy
          text: >-
            What do I see? Is that truly you, dear Prince? What terrible misfortune brought you to this gloomy place?
          emotion: surprised
        - id: ch03-b22
          speaker: gold_mines_king
          text: >-
            Beautiful Fairy, the creature who brought me here first took away my sight. I knew the Fairy of the Desert by her voice, though I cannot guess why she carried me off.
        - id: ch03-b23
          speaker: desert_fairy
          text: >-
            If you are in her hands, you will never escape unless you marry her. She has taken more than one prince this way, and whenever she desires something, she means to have it.
        - id: ch03-b24
          speaker: narrator
          text: >-
            While the false beauty pretended to pity him, the King noticed her feet. They were the feet of a griffin. He understood at once that she was the Fairy of the Desert, for no matter how lovely she made her face, her magic could not change her feet. He hid what he knew and spoke as though sharing a secret.
        - id: ch03-b25
          speaker: gold_mines_king
          text: >-
            I do not dislike the Fairy of the Desert. What I cannot bear is that she protects the Yellow Dwarf and chains me here like a criminal. Yes, I love a charming princess. But if the Fairy freed me, gratitude would bind me to love her alone.
        - id: ch03-b26
          speaker: desert_fairy
          text: >-
            Do you truly mean that, Prince?
          emotion: surprised
        - id: ch03-b27
          speaker: gold_mines_king
          text: >-
            Certainly. How could I deceive you? Being loved by a fairy would flatter my pride far more than being loved by an ordinary princess. But even if I were dying of love for the Fairy, I would pretend to hate her until she set me free.
        - id: ch03-b28
          speaker: narrator
          text: >-
            The Fairy believed every word. She decided to move him somewhere pleasant. Her usual chariot was drawn by bats, but now she harnessed swans to it, seated the King beside her, and flew away.
        - id: ch03-b29
          speaker: narrator
          text: >-
            High in the air, the King looked down and saw Bellissima inside a castle of polished steel. Its walls threw back the sun so fiercely that anyone approaching them would burn to ashes. The Princess sat in a little grove beside a brook, her head resting on one hand as she wept. She looked up and saw the King beside the Fairy. The disguise was so perfect that Bellissima, too, thought the Fairy was the loveliest being she had ever seen.
        - id: ch03-b30
          speaker: bellissima
          text: >-
            Was it not enough to be imprisoned in this lonely castle by that horrible Dwarf? Must I also learn that the King of the Gold Mines stopped loving me as soon as I was out of sight? Who is this rival whose fatal beauty is greater than mine?
          emotion: sad
    - id: ch04
      title: The Emerald Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The King loved Bellissima as much as ever. Being swept away from her filled him with misery. Yet he knew the Fairy was too powerful for him to escape without patience and cunning. The Fairy had seen Bellissima too, and she watched his eyes closely, trying to discover what the sight had done to him.
        - id: ch04-b02
          speaker: gold_mines_king
          text: >-
            No one can answer your question better than I can. That unhappy princess once caught my fancy, before I had the good fortune to meet you. Seeing her again moved me a little, I admit. But you mean so much more to me that I would rather die than leave you.
        - id: ch04-b03
          speaker: desert_fairy
          text: >-
            Prince, can I believe that you truly love me so much?
        - id: ch04-b04
          speaker: gold_mines_king
          text: >-
            Time will prove it, madam. But if you want me to believe that you care for me, please help Bellissima.
        - id: ch04-b05
          speaker: desert_fairy
          text: >-
            Do you understand what you ask? You want me to use my magic against the Yellow Dwarf, my dearest friend, and take from him a proud princess who is also my rival?
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            The King sighed and said nothing. No answer could fool someone so watchful, and pressing her further might reveal his deception. At last the flying chariot began to descend. Beneath it spread a vast meadow filled with every kind of flower. A deep river circled the whole place like a boundary, while many little streams wound through the grass and murmured beneath shady trees. It was always cool and fresh there, untouched by the heat outside. A short distance away stood a splendid palace. Its walls were built from transparent emeralds, so light seemed to pass through the building itself.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The swans landed beneath a porch paved with diamonds and arched with rubies. Thousands of beautiful beings hurried joyfully to greet the Fairy and the King. They sang together.
        - id: ch04-b08
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: >-
            When love would rule a heart, resistance is no use. The proud suffer more sharply, and love wins a greater victory over them.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The song about her triumph delighted the Fairy. She led the King into a room more magnificent than words could tell, then left him alone for a while so he would not feel like a prisoner. The King was sure she had not truly gone. He believed she was watching from some secret place. He walked to a great mirror and spoke to it.
        - id: ch04-b10
          speaker: gold_mines_king
          text: >-
            My trusty counselor, show me how to please the charming Fairy of the Desert. I can think of nothing else.
        - id: ch04-b11
          speaker: narrator
          text: >-
            He began curling his hair. Then he found a coat grander than his own on a table and carefully put it on. The Fairy returned, unable to hide her joy.
        - id: ch04-b12
          speaker: desert_fairy
          text: >-
            I know exactly how much trouble you have taken to please me, and you have already succeeded perfectly. You see how easy it is when you truly care.
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: >-
            The King had good reason to keep the old Fairy pleased, so he gave her no shortage of charming words. He continued acting as though her palace, her attention, and her love had won him completely. In time, she trusted him enough to allow him to walk alone along the seashore. Even then, she believed she had made escape impossible. By magic she had raised a storm so violent that the boldest pilot in the world would not have launched a boat into it. Waves towered along the coast, and wild winds drove them against the land. Certain that no prisoner could cross such a sea, the Fairy no longer feared letting him out of her sight.
        - id: ch04-b14
          speaker: narrator
          text: >-
            The lonely shore gave the King a little relief. He could think about his terrible position without his cruel captor interrupting. He paced wildly beside the sea. Then he took his stick and wrote his sorrow in the sand.
        - id: ch04-b15
          speaker: gold_mines_king
          text: >-
            Here on this shore, perhaps my tears can lighten my grief. I can no longer see my love, though thoughts of her still comfort me. The storm drives the sea from its depths to the sky, and its raging waters keep her far away. Yet my heart is wilder still, for fate has made me an exile and torn my Princess from me. Kind nymphs beneath the waves, if you know the sweetness of true love, calm this furious sea and set one desperate lover free.
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: >-
            While he was still writing, a voice caught his attention. The waves rolled higher than ever. He searched the water and saw a lovely lady gliding toward him on the crest of a great wave. Her long hair spread around her. She carried a mirror in one hand and a comb in the other. Instead of feet, she had the beautiful tail of a fish.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Astonishment left the King unable to speak. When the Mermaid came close enough, she called to him.
        - id: ch04-b18
          speaker: mermaid
          text: >-
            I know how deeply you grieve for your Princess and how the Fairy of the Desert holds you prisoner. If you wish, I will help you escape this deadly place. Without help, you might remain here for thirty years or longer.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The King wanted desperately to escape, but he hesitated. Perhaps the Mermaid was only another disguise the Fairy had made to test him. She guessed his fear.
        - id: ch04-b20
          speaker: mermaid
          text: >-
            You can trust me. This is no trap. I am far too angry with the Yellow Dwarf and the Fairy of the Desert to help them. I often see your poor Princess. Her beauty and goodness make me pity her. Put your faith in me, and I will take you away.
        - id: ch04-b21
          speaker: gold_mines_king
          text: >-
            I trust you completely and will obey you. But if you have seen Bellissima, please tell me how she is and what they are doing to her.
        - id: ch04-b22
          speaker: mermaid
          text: >-
            We cannot spend time talking now. Come with me. I will carry you to the Castle of Steel, and we will leave a figure on this shore so like you that even the Fairy will believe it is real.
        - id: ch04-b23
          speaker: narrator
          text: >-
            The Mermaid quickly gathered a bundle of seaweed and blew upon it three times.
        - id: ch04-b24
          speaker: mermaid
          text: >-
            Friendly seaweeds, lie here upon the sand until the Fairy of the Desert comes to carry you away.
        - id: ch04-b25
          speaker: narrator
          text: >-
            At once, the seaweed took the King's shape. Even its coat matched his. The figure lay pale and still, just as the King might have looked if a wave had caught him and thrown him senseless onto the shore. He stared in amazement. Then the Mermaid lifted him, and they swam joyfully away together.
    - id: ch05
      title: The Mermaid's Sword
      blocks:
        - id: ch05-b01
          speaker: mermaid
          text: >-
            Now there is time to tell you about Bellissima. Though the Fairy wounded her, the Yellow Dwarf forced her to ride behind him on his terrible Spanish cat. Pain and fear soon made her faint, and she did not wake until they were inside his dreadful Castle of Steel.
        - id: ch05-b02
          speaker: mermaid
          text: >-
            The prettiest girls anyone could find received her there. The Dwarf had carried them all to the castle. He hurried to serve Bellissima and showed her every attention he could. They laid her on a couch covered in cloth of gold, embroidered with pearls as large as nuts.
        - id: ch05-b03
          speaker: gold_mines_king
          text: >-
            If Bellissima forgets me and agrees to marry him, my heart will break.
          emotion: sad
        - id: ch05-b04
          speaker: mermaid
          text: >-
            You need not fear that. The Princess thinks only of you. The horrible Dwarf cannot even persuade her to look at him.
        - id: ch05-b05
          speaker: gold_mines_king
          text: >-
            Please, continue.
        - id: ch05-b06
          speaker: mermaid
          text: >-
            There is little more to tell. Bellissima was sitting in the grove when you flew past with the Fairy. The disguise was so clever that the Princess believed the Fairy more beautiful than herself. She fell into despair because she thought you had fallen in love with your companion.
        - id: ch05-b07
          speaker: gold_mines_king
          text: >-
            She thinks I love the Fairy? What a terrible mistake! How can I convince her of the truth?
          emotion: surprised
        - id: ch05-b08
          speaker: mermaid
          text: >-
            You will know best. When two people love each other as deeply as you do, they need no advice from anyone else.
        - id: ch05-b09
          speaker: narrator
          text: >-
            They reached the Castle of Steel. The Yellow Dwarf had left only the seaward side unguarded by the burning walls.
        - id: ch05-b10
          speaker: mermaid
          text: >-
            The Princess is beside the brook, exactly where you saw her. You will face many enemies before you reach her, so take this sword. With it in your hand, you may challenge any danger and overcome the greatest obstacles. But remember one warning. Never let it fall from your hand.
        - id: ch05-b11
          speaker: mermaid
          text: >-
            Farewell. I will wait beside that rock. If you need help carrying Bellissima away, I will be here. Her mother, the Queen, is my dearest friend, and I rescued you for her sake.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The Mermaid gave him a sword made from one perfect diamond, brighter than the sun. The King could not find enough words to thank her. He assured her that he understood the gift's importance and would never forget her kindness.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Meanwhile, the Fairy of the Desert noticed that the King had not returned from his walk. She hurried toward the shore with one hundred ladies from her court, intending to surprise him with splendid gifts. The procession glittered as it moved. Some ladies held baskets filled with diamonds. Others carried golden cups made with marvelous skill, along with amber, coral, and pearls. More balanced bales of the richest and most beautiful cloth on their heads. The rest brought fruit, fresh flowers, and even living birds. The Fairy followed this joyful company, expecting to find the Prince waiting beside the sea and to overwhelm him with signs of her love.
        - id: ch05-b14
          speaker: narrator
          text: >-
            Then the Fairy saw the King's seaweed image stretched across the sand. She gave a terrible cry and threw herself beside it, weeping, howling, and calling for her eleven sisters, who were fairies too. They came to help her, but even they believed the false body was real. The Mermaid's magic was cleverer than theirs.
        - id: ch05-b15
          speaker: narrator
          text: >-
            The sisters could do nothing except help build a magnificent monument over what they thought was the King of the Gold Mines' grave. They gathered jasper, porphyry, agate, marble, gold, bronze, statues, and emblems to make his memory last forever.
        - id: ch05-b16
          speaker: narrator
          text: >-
            While the fairies labored over the false grave, the living King stood with the Mermaid near the Castle of Steel. He thanked her again and begged her not to abandon him before Bellissima was safe. She graciously promised to give whatever further help he needed, then disappeared into the sea. The King set out alone. He walked quickly, gripping the diamond sword and searching anxiously in every direction. After the cavern, the emerald palace, and the stormy voyage, he was at last close to Bellissima. The thought drove him forward, and he longed for the moment when he could see her, explain the Fairy's deception, and lead her away from the Dwarf.
        - id: ch05-b17
          speaker: narrator
          text: >-
            He had not gone far when four terrible sphinxes surrounded him. Their sharp claws would soon have torn him apart, but he flashed the diamond sword before their eyes. All four fell helpless at his feet, and one blow killed them.
        - id: ch05-b18
          speaker: narrator
          text: >-
            The King had barely turned away when six dragons attacked. Their scales were harder than iron. Even this dreadful sight could not shake his courage. With the wonderful sword, he cut them down one after another.
        - id: ch05-b19
          speaker: narrator
          text: >-
            He hoped the dangers were finished. Instead, the next turn brought an enemy he did not know how to defeat. Twenty-four beautiful, graceful nymphs came forward. They stretched garlands of flowers across his path.
        - id: ch05-b20
          speakers: [nymph_1, nymph_2, nymph_3]
          ensemble: chorus
          text: >-
            Where are you going, Prince? We guard this place. If we let you pass, terrible misfortunes will fall on you and on us. Please do not force your way through. Would you kill twenty-four girls who have never harmed you?
        - id: ch05-b21
          speaker: narrator
          text: >-
            The King did not know what to say or do. As a knight, he could hardly refuse when a lady begged him. While he hesitated, a voice spoke close to his ear.
        - id: ch05-b22
          speaker: hidden_voice
          text: >-
            Strike now! Show no mercy, or your Princess will be lost forever!
        - id: ch05-b23
          speaker: narrator
          text: >-
            The King gave the nymphs no answer. He rushed ahead, broke their garlands, and scattered them in every direction. Nothing else blocked him. Soon he reached the little grove where he had seen Bellissima.
    - id: ch06
      title: The Castle of Steel
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Bellissima sat beside the brook, pale and weary. The King would have fallen at her feet, but she pulled away with as much anger as if he had been the Yellow Dwarf.
        - id: ch06-b02
          speaker: gold_mines_king
          text: >-
            Princess, please do not be angry. Let me tell you what happened. I was never faithless. I have hurt you without choosing or even being able to prevent it.
          emotion: sad
        - id: ch06-b03
          speaker: bellissima
          text: >-
            Did I not see you flying through the air beside the loveliest creature imaginable? Was that against your will too?
          emotion: angry
        - id: ch06-b04
          speaker: gold_mines_king
          text: >-
            It was entirely against my will. The Fairy of the Desert chained me to a rock, then carried me in her chariot to the other end of the earth. I would still be her prisoner if a friendly mermaid had not helped me escape and brought me here. I came to rescue you from the unworthy hands holding you. Please accept the help of the lover who has always been faithful.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The King dropped to his knees and caught the edge of Bellissima's robe. In that moment, he let the magic sword slip from his hand. The Yellow Dwarf had been crouching behind a lettuce, watching them. The instant the sword fell, he sprang out and seized it. He knew exactly how much power it held.
        - id: ch06-b06
          speaker: narrator
          text: >-
            Bellissima screamed when she saw him. Her fear only made the little monster angrier. He muttered a few words of magic, and two giants appeared. They wrapped the King in great iron chains.
        - id: ch06-b07
          speaker: yellow_dwarf
          text: >-
            Now your lover's fate belongs to me. Princess, I will spare his life and let him leave unharmed if you agree to marry me.
        - id: ch06-b08
          speaker: gold_mines_king
          text: >-
            I would rather die a thousand deaths!
          emotion: angry
        - id: ch06-b09
          speaker: bellissima
          text: >-
            Must you die? Could anything in the world be more terrible?
          emotion: sad
        - id: ch06-b10
          speaker: gold_mines_king
          text: >-
            It would be far worse to see you marry that little wretch.
        - id: ch06-b11
          speaker: bellissima
          text: >-
            Then at least let us die together.
          emotion: sad
        - id: ch06-b12
          speaker: gold_mines_king
          text: >-
            No. Let me have the comfort of dying for you, my Princess.
          emotion: sad
        - id: ch06-b13
          speaker: bellissima
          text: >-
            No, no! Dwarf, I will do as you demand. Only spare him.
          emotion: fearful
        - id: ch06-b14
          speaker: gold_mines_king
          text: >-
            Cruel Princess, would you make my life unbearable by marrying another before my eyes?
          emotion: sad
        - id: ch06-b15
          speaker: yellow_dwarf
          text: >-
            You will not see our marriage. I fear you far too much to leave a rival alive.
        - id: ch06-b16
          speaker: narrator
          text: >-
            Bellissima wept and cried out, but the Dwarf paid no attention. He drove the diamond sword into the King's heart.
        - id: ch06-b17
          speaker: narrator
          text: >-
            The Princess saw her lover lying dead at her feet. She could not go on living without him. She sank beside him and died of a broken heart.
        - id: ch06-b18
          speaker: narrator
          text: >-
            So the two unhappy lovers came to their end. Even the Mermaid could not save them, for all the magic power had been lost with the diamond sword.
        - id: ch06-b19
          speaker: narrator
          text: >-
            The wicked Yellow Dwarf had preferred to see Bellissima dead rather than married to the King of the Gold Mines. When the Fairy of the Desert learned what had happened to the King, she tore down the grand monument she had built. She was so furious that he had tricked her that she hated him as fiercely as she had once loved him.
        - id: ch06-b20
          speaker: narrator
          text: >-
            The kind Mermaid grieved over the lovers' fate. She changed them into two tall palm trees. They stand forever side by side, whispering of their faithful love and caressing each other with their intertwined branches.
