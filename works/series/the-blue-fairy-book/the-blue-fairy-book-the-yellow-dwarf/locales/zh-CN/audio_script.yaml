    palace_spirit_2:
      display_name: 宫殿精灵乙
      tts: {delivery: 欢悦而轻盈, timbre: 柔亮清澈, pace: 中等, pitch: 中高音}
    palace_spirit_3:
      display_name: 宫殿精灵丙
      tts: {delivery: 欢悦而轻盈, timbre: 温暖明净, pace: 中等, pitch: 中音}
    palace_spirit_4:
      display_name: 宫殿精灵丁
      tts: {delivery: 欢悦而轻盈, timbre: 清朗圆润, pace: 中等, pitch: 中高音}
    guardian_nymph_1:
