      tts: {delivery: 恳切而警觉, timbre: 年轻清亮, pace: 中等, pitch: 中高音}
    guardian_nymph_2:
      display_name: 守卫仙女乙
      tts: {delivery: 恳切而警觉, timbre: 年轻柔和, pace: 中等, pitch: 中音}
    guardian_nymph_3:
      display_name: 守卫仙女丙
      tts: {delivery: 恳切而警觉, timbre: 清澈沉静, pace: 中等, pitch: 中高音}
    guardian_nymph_4:
      display_name: 守卫仙女丁
      tts: {delivery: 恳切而警觉, timbre: 明净温和, pace: 中等, pitch: 中音}
    warning_voice:
      display_name: 神秘声音
      tts: {delivery: 急迫而坚定, timbre: 遥远清晰, pace: 快, pitch: 中音}
  chapters:
    - id: ch01
      title: 橙树上的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位王后。她生过许多孩子，最后却只剩下一个女儿。可在王后眼里，这一个女儿抵得上一千个。国王去世以后，她把全部心思都放在小公主身上，生怕再失去她，便事事纵容，从不肯纠正她的过错。
        - id: ch01-b02
          speaker: narrator
          text: 小公主名叫贝利西玛，生得美丽无比，将来还要戴上王冠。可她就在母亲的宠爱和夸奖里长大，越来越骄傲，只爱自己的美貌，世上谁也瞧不起。她穿尽最漂亮的衣裳，有时像仙女，有时像出猎的女王，宫廷贵妇便扮成森林仙女跟在身后。
        - id: ch01-b03
          speaker: narrator
          text: 王后还请最好的画师为她画像，把画像送给邻近的国王。那些国王一见便全都爱上了她。有人害病，有人发疯，几个立刻赶来看她的幸运儿，也在见面的一刻成了她的奴仆。
        - id: ch01-b04
          speaker: narrator
          text: 宫廷里从此热闹非凡。二十位国王争着讨她喜欢，为一场宴会花掉无数钱财，只换来一句“还挺漂亮”，也觉得自己走了好运。每天还有七八千首十四行诗送进宫，哀歌、情诗和歌曲也堆积如山。所有文章都在写贝利西玛，连宫里的篝火都烧着这些诗稿，火星噼啪，比木柴烧得还旺。
        - id: ch01-b05
          speaker: narrator
          text: 贝利西玛十五岁时，王子们个个想娶她，却谁也不敢开口。他们肯为她一天掉五六次脑袋，她也只会觉得无所谓。王后盼着女儿出嫁，只好劝她认真选一位丈夫。
        - id: ch01-b06
          speaker: queen
          text: 贝利西玛，别再这样骄傲了。这些国王都很出色，你为什么一个也看不上？我只盼你选一个成婚，你却一点也不肯让我称心。
        - id: ch01-b07
          speaker: bellissima
          text: 我现在快活得很。母后，就让我清静地过日子吧，我不想爱上任何人。
        - id: ch01-b08
          speaker: queen
          text: 无论嫁给哪一位王子，你都会幸福。可你将来若偏偏爱上一个配不上你的人，我一定会生气。
        - id: ch01-b09
          speaker: narrator
          text: 公主觉得所有求婚者都不够聪明，也不够英俊。王后终于后悔从前太由着她，却再想不出别的办法，只得去请教荒漠仙女。那位仙女由可怕的狮子守护。想平安经过，必须送上一块用小米面、冰糖和鳄鱼蛋做的糕饼。
        - id: ch01-b10
          speaker: narrator
          text: 王后亲手做好糕饼，装进篮子，独自上路。她走得太累，便在树下睡着了。醒来一看，篮子已经空了，远处还传来狮吼。狮群发现了她，正朝这里赶来。
        - id: ch01-b11
          speaker: queen
          text: 我该怎么办？它们会吃掉我的！
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 她吓得一步也跑不动，只能倚着树哭。头顶忽然传来两声轻哼。王后抬头一看，一个小得出奇的男人坐在橙树上，正吃着橙子。
        - id: ch01-b13
          speaker: yellow_dwarf
          text: 王后，我认识你，也知道你怕那些狮子。你怕得没错，它们已经吃了不少人。如今你连糕饼也没有，还能怎么办呢？
        - id: ch01-b14
          speaker: queen
          text: 看来我只好等死了。唉，要是我亲爱的女儿已经出嫁，我也不会这样舍不得死。
          emotion: sad
        - id: ch01-b15
          speaker: yellow_dwarf
          text: 原来你有个女儿！那可太好了。我走遍世界，正想找个妻子。你答应让她嫁给我，狮子、老虎和熊就没有一只能碰你。
        - id: ch01-b16
          speaker: narrator
          text: 这人就是黄矮人。他既是矮人，又长着一张蜡黄的脸，还住在橙树上。王后看见那张丑陋的小脸，几乎同见了狮子一样害怕，一句话也说不出来。
        - id: ch01-b17
          speaker: yellow_dwarf
          text: 怎么还在犹豫？看来你很想被活活吃掉。
        - id: ch01-b18
          speaker: narrator
          text: 狮群已经从山坡上奔来。每头狮子都有两个脑袋、八只脚和四排牙齿，通红的皮比龟甲还硬。王后像鸽子见了鹰，浑身发抖。
        - id: ch01-b19
          speaker: queen
          text: 亲爱的矮人先生，贝利西玛会嫁给你！
          emotion: fearful
        - id: ch01-b20
          speaker: yellow_dwarf
          text: 是吗？她虽说还算漂亮，我却没有多想娶她。你还是自己留着吧。
        - id: ch01-b21
          speaker: queen
          text: 尊贵的先生，请别拒绝她。她是世上最迷人的公主。
        - id: ch01-b22
          speaker: yellow_dwarf
          text: 那好，我就发发善心，收下她吧。不过你别忘了，她是我的。
        - id: ch01-b23
          speaker: narrator
          text: 橙树树干上立刻打开一扇小门。王后刚冲进去，门就在狮子面前砰然关上。树里另一扇门随后开启，她走进一片蓟草和荨麻地，四周围着泥沟，前方只有一间小茅屋。
        - id: ch01-b24
          speaker: narrator
          text: 黄矮人穿着木鞋和黄色小外套，神气十足地走出屋子。他秃着脑袋，两只耳朵却长得吓人。
        - id: ch01-b25
          speaker: yellow_dwarf
          text: 你要做我的岳母，正该看看贝利西玛将来的家。蓟草和荨麻能喂驴，她想骑就骑。小屋能挡风雨，溪水可以喝，附近还有肥青蛙可以吃。再说，她会一直有我陪着。你瞧，我英俊、讨人喜欢，又快活。要是她的影子跟得比我还紧，我才会吃惊。
        - id: ch01-b26
          speaker: narrator
          text: 王后一想到女儿要过这样的生活，什么也没说便昏了过去。再醒来时，她已经躺在宫中的床上，头戴一顶精美绝伦的蕾丝睡帽。她本想把狮子和婚约都当成梦，可那顶缀着缎带和花边的新睡帽，明明白白告诉她，一切都是真的。从此她吃不下、喝不下，也睡不着。

    - id: ch02
      title: 公主的戒指与婚约
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 贝利西玛虽然任性，却真心爱着母亲。她一遍遍追问王后为什么忧愁，王后只说自己病了，或说邻国要来开战。公主知道那都不是真话，便决定亲自去找智慧过人的荒漠仙女，也顺便问问自己到底该不该嫁人。
        - id: ch02-b02
          speaker: narrator
          text: 她做好安抚狮子的糕饼，夜里假装早早上床，却裹着白纱，从秘密楼梯溜出宫去。走到那棵橙树下，她见花果满枝，忍不住放下篮子，摘橙子来吃。等她要继续赶路，篮子已经不见了。她越找越害怕，终于哭了起来。黄矮人忽然站在了面前。
        - id: ch02-b03
          speaker: yellow_dwarf
          text: 小美人，出了什么事？你哭什么呀？
        - id: ch02-b04
          speaker: bellissima
          text: 我的糕饼丢了。没有它，我就不能平安走到荒漠仙女的洞穴，怎么会不哭呢？
        - id: ch02-b05
          speaker: yellow_dwarf
          text: 你找她做什么？我是她的朋友，论本领，我和她一样高明。
        - id: ch02-b06
          speaker: bellissima
          text: 母后近来忧愁得厉害，我怕她会死，也怕她的忧愁是因我而起。她盼我嫁人，可直到现在，我还没见过一个配做我丈夫的人。所以我想去问问仙女。
        - id: ch02-b07
          speaker: yellow_dwarf
          text: 那就不用再费事了。你想知道的，我比她更清楚。你的母后已经答应把你嫁给——
        - id: ch02-b08
          speaker: bellissima
          text: 把我嫁出去？不可能。母后若答应过谁，一定会告诉我。婚姻是我的大事，她怎么会不问我就作主？一定是你弄错了。
        - id: ch02-b09
          speaker: narrator
          text: 矮人忽然跪在公主面前。
        - id: ch02-b10
          speaker: yellow_dwarf
          text: 美丽的公主，等你知道王后选了谁，准不会不高兴。她答应让我得到娶你的幸福。
        - id: ch02-b11
          speaker: bellissima
          text: 你？母后要我嫁给你？你怎么会蠢到这样想！
          emotion: surprised
        - id: ch02-b12
          speaker: yellow_dwarf
          text: 好像我多稀罕这份荣耀似的！狮子已经来了，它们三口就能吞掉你，到时你和你的骄傲一起完蛋。
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 可怕的狮吼越来越近。公主顿时慌了。
        - id: ch02-b14
          speaker: bellissima
          text: 我该怎么办？难道我所有幸福的日子都要这样结束？
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 矮人恶意地笑起来。
        - id: ch02-b16
          speaker: yellow_dwarf
          text: 至少你能如愿，一辈子也没嫁人。像你这样美丽的公主，当然宁可死，也不肯做一个可怜小矮人的妻子。
        - id: ch02-b17
          speaker: bellissima
          text: 别生我的气！只要别这样可怕地死去，我宁愿嫁给全世界所有的矮人。
        - id: ch02-b18
          speaker: yellow_dwarf
          text: 许诺以前先看清楚我。我不想叫你答应得太匆忙。
        - id: ch02-b19
          speaker: bellissima
          text: 狮子马上就到，我已经看得够清楚了！快救我，不然我会吓死的！
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: 公主当场昏倒。醒来时，她已经回到宫中的小床上，身穿最美的蕾丝和缎带，手指上还箍着一枚用一根红头发编成的戒指，怎么也摘不下来。她想起方才的事，也陷入忧愁，却始终不肯对母亲说出原因。
        - id: ch02-b21
          speaker: narrator
          text: 大臣们盼着公主成婚，恳求王后尽快为她选择丈夫。王后叫他们亲自去劝。经历了黄矮人的事以后，贝利西玛已没那么骄傲，又觉得嫁给一个强大的国王，正好能摆脱那个怪物，便答应嫁给金矿国王。
        - id: ch02-b22
          speaker: narrator
          text: 金矿国王英俊又强大，爱慕公主多年，从没想过她会接受自己。他欣喜若狂，其他十九位国王却从此绝了希望。可贝利西玛毕竟不能嫁给二十个人。她能挑出一个已十分不易，因为她始终觉得，世上没有谁真正配得上她。
        - id: ch02-b23
          speaker: narrator
          text: 宫里立刻筹备起空前盛大的婚礼。金矿国王送来的钱财由无数船只运来，铺满了海面。使者又前往最繁华高雅的宫廷，尤其是法国宫廷，搜罗珍宝装扮公主。其实在国王眼里，她已经完美得无法更美，只有陪在她身边，他才快活。
        - id: ch02-b24
          speaker: narrator
          text: 公主同国王相处得越久，越喜欢他的慷慨、英俊和聪明。到后来，她爱他几乎同他爱她一样深。两人常在花园里携手漫步，听着甜美的音乐。国王还为她写歌，其中一首是这样唱的。
        - id: ch02-b25
          speaker: gold_mines_king
          text: 公主缓步林间过，满林欢悦满林歌。枝头花瓣纷纷落，只盼铺成脚下坡。细茎鲜花齐仰望，看她轻拂青青草。我的公主啊，鸟儿在天上，也把爱的歌声声回响。你我携手同游仙境，一路欢欣，一路徜徉。
          emotion: happy
        - id: ch02-b26
          speaker: narrator
          text: 求婚失败的国王们绝望地回国，临别时个个伤心。贝利西玛也忍不住同情他们。金矿国王见了，心里有些不快。
        - id: ch02-b27
          speaker: gold_mines_king
          text: 公主，他们这样爱你，只要得到一个微笑，所有痛苦也算有了报偿。你何必再为他们难过？
        - id: ch02-b28
          speaker: bellissima
          text: 要是你没看出我同情这些永远离开我的王子，我反倒会难过。你有充分的理由对我满意，他们却只能悲伤地回去。请别舍不得我分给他们一点怜悯。
        - id: ch02-b29
          speaker: narrator
          text: 公主温厚的回答叫国王又惭愧又感动。他跪在她脚边，把她的手亲了上千次，一再请求原谅。

    - id: ch03
      title: 被打断的婚礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 婚礼的日子终于到了。号角响彻全城，街道挂满旗帜，地上铺着鲜花，人群涌向王宫前的广场。王后高兴得一夜没睡，天不亮便起来安排一切，还亲自挑选女儿的珠宝。
        - id: ch03-b02
          speaker: narrator
          text: 贝利西玛从头到脚都闪着钻石，鞋上也缀满宝石。银锦礼服绣着十二道太阳的光芒，华贵得难以想象，可最耀眼的仍是公主自己。她戴着王冠，长发如波浪般垂到脚边，身旁再多贵妇，也遮不住她端庄高挑的身影。
        - id: ch03-b03
          speaker: narrator
          text: 金矿国王也无比华美，脸上的幸福谁都看得见。他在宴会厅四周摆了一千桶黄金，还有数不清的天鹅绒钱袋。每袋装着至少十万枚金币，谁伸手就送给谁。人们争先恐后，有些人甚至觉得，这才是婚礼最有趣的部分。
        - id: ch03-b04
          speaker: narrator
          text: 王后和公主正要同国王出发，长廊尽头忽然来了两只巨大的蛇怪，拖着一口做工粗劣的箱子。后面跟着一个年纪惊人、也丑得惊人的高大老妇人。她戴黑色皱领和红丝绒兜帽，破烂裙撑拖在身上，拄着拐杖走得摇摇晃晃。
        - id: ch03-b05
          speaker: narrator
          text: 老妇人一言不发，带着蛇怪绕长廊走了三圈。她停在正中，威胁似的举起拐杖。
        - id: ch03-b06
          speaker: desert_fairy
          text: 呵，王后！呵，公主！你们真以为，答应过我朋友黄矮人的事，可以随便反悔吗？我就是荒漠仙女。若没有黄矮人和橙树，我的狮子早把你们吃了。在仙境里，谁也不能这样羞辱我们。马上作出选择吧！我发誓，公主必须嫁给黄矮人。她若不嫁，就让我烧掉这根拐杖！
          emotion: angry
        - id: ch03-b07
          speaker: queen
          text: 公主，我听见了什么？你究竟答应过什么？
          emotion: surprised
        - id: ch03-b08
          speaker: bellissima
          text: 母后，那您自己又答应过什么？
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 金矿国王见这个邪恶老妇人挡住自己的幸福，立刻拔剑走到她面前。
        - id: ch03-b10
          speaker: gold_mines_king
          text: 立刻滚出我的国家，永远别回来！否则我就取你性命，彻底摆脱你的恶毒。
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 箱盖突然轰然落地。黄矮人骑着一只巨大的西班牙猫，从箱中跃了出来，横在仙女和国王之间。
        - id: ch03-b12
          speaker: yellow_dwarf
          text: 鲁莽的小子，你敢碰这位尊贵的仙女！你的敌人和情敌都是我。那个背信弃义、险些嫁给你的公主早就许配给我。看她手上那枚戒指，就是用我的头发编的。你只管试着摘下来，马上就知道谁更强大！
          emotion: angry
        - id: ch03-b13
          speaker: gold_mines_king
          text: 可恶的小怪物，你也敢自称公主的爱人，妄想得到这样的珍宝？你只是个丑得不忍直视的矮人。若不是你根本配不上那样光荣的死法，我早就亲手杀了你！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 黄矮人气得发狂，猛踢胯下的猫。那猫嚎叫着四处乱蹿，吓坏了众人，只有国王紧追不放。矮人拔出大刀，挑战国王单独决斗，又冲进庭院。国王立刻追了下去。
        - id: ch03-b15
          speaker: narrator
          text: 两人才站定，宫廷众人也刚涌上阳台，太阳就变得血一样红。黑暗笼罩四周，雷声炸响，闪电仿佛要烧尽一切。两只蛇怪守在矮人左右，忽然长得像山一样高，口中和耳中烈火喷涌，活像两座熔炉。
        - id: ch03-b16
          speaker: narrator
          text: 年轻的国王丝毫不怕。他的勇气让围观者安下心来，也叫黄矮人有些慌乱。可就在这时，荒漠仙女骑着带翼狮鹫飞来，脖子上缠满长蛇。她用长矛狠狠刺中贝利西玛。公主流着血，昏倒在王后怀中。
        - id: ch03-b17
          speaker: narrator
          text: 王后像自己也中了长矛，发出撕心裂肺的哭喊。国王听见以后，顿时顾不得决斗，只想赶到公主身边，救她，或同她一起死。黄矮人却抢先骑猫跃上阳台，从王后怀里夺走贝利西玛。贵妇们还没来得及阻拦，他已经跳上屋顶，带着公主消失了。
        - id: ch03-b18
          speaker: narrator
          text: 国王惊恐地僵在原地，眼睁睁看着悲剧发生，却无力阻止。接着，他忽然失去了视力，四周陷入黑暗，一只强有力的手托起他，带着他飞过天空。

    - id: ch04
      title: 荒漠仙女的囚徒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 原来荒漠仙女本想帮黄矮人掳走公主，却在第一眼看见金矿国王时爱上了他。她打算把国王锁在可怕的洞穴里，让死亡的威胁逼他忘记贝利西玛，做自己的奴仆。
        - id: ch04-b02
          speaker: narrator
          text: 到了洞中，仙女恢复了国王的视力，却没有解开铁链。她又施展魔法，把自己变成一位年轻美丽的仙女，假装偶然来到了这里。
        - id: ch04-b03
          speaker: desert_fairy
          text: 我看见的是谁？亲爱的王子，真的是您吗？什么灾祸把您带到这样凄凉的地方？
          emotion: surprised
        - id: ch04-b04
          speaker: gold_mines_king
          text: 美丽的仙女，抓我来的人先夺走了我的视力。不过我听得出声音，她就是荒漠仙女。至于她为什么掳走我，我也不知道。
        - id: ch04-b05
          speaker: desert_fairy
          text: 要是落进她手里，除非答应娶她，不然休想逃出去。她已经这样抓过不止一位王子。凡是她看中的，她总要弄到手。
        - id: ch04-b06
          speaker: narrator
          text: 她装作替国王难过，国王却看见她有一双狮鹫的脚，立刻认出了荒漠仙女。无论她把脸变得多美，唯独双脚无法改变。国王没有露出破绽，只装作信任她。
        - id: ch04-b07
          speaker: gold_mines_king
          text: 我并不厌恶荒漠仙女，只是不能忍受她袒护黄矮人，还像锁罪犯一样锁着我。不错，我爱过一位迷人的公主。可仙女若放我自由，我自然会因感激而只爱她一个。
        - id: ch04-b08
          speaker: desert_fairy
          text: 王子，您真是这样想的吗？
        - id: ch04-b09
          speaker: gold_mines_king
          text: 当然。我怎么会骗您？被仙女爱上，可比被普通公主爱上更能满足我的虚荣。即使我为她爱得快死了，得到自由以前，我也只会装作讨厌她。
        - id: ch04-b10
          speaker: narrator
          text: 荒漠仙女完全相信了他。她把平日拉车的蝙蝠换成天鹅，让国王登上车驾，带他飞往一处更舒适的地方。
        - id: ch04-b11
          speaker: narrator
          text: 车驾从高空疾驰时，国王忽然看见，贝利西玛被关在一座磨光的钢铁城堡里。城墙反射着炽烈阳光，任何人走近都会烧成灰烬。公主独自坐在溪边树丛里，手托着头，伤心地哭泣。
        - id: ch04-b12
          speaker: narrator
          text: 贝利西玛恰好抬起头，也看见了国王和仙女。荒漠仙女的伪装那样高明，不只骗过国王，就连公主也觉得，她是自己见过最美的人。
        - id: ch04-b13
          speaker: bellissima
          text: 黄矮人把我囚禁在这座孤零零的城堡里，难道还不够吗？为什么还要让我亲眼看见，金矿国王一离开我就不再爱我？这个情敌究竟是谁？她竟然比我更美！
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: 国王依然深深爱着公主。眼看自己被飞快带离她身边，他痛苦极了，却知道仙女法力强大，只有耐心周旋、设法智取，才可能逃脱。仙女也看见了贝利西玛，正盯着国王的眼睛，想看出这场相逢对他有什么影响。
        - id: ch04-b15
          speaker: gold_mines_king
          text: 您想知道什么，我正好可以告诉您。偶然看见这个不幸的公主，的确让我有一点触动。遇见您以前，我曾经一时迷恋过她。可您在我心里远比她重要，我宁愿死也不会离开您。
        - id: ch04-b16
          speaker: desert_fairy
          text: 王子，我真能相信您这样爱我吗？
        - id: ch04-b17
          speaker: gold_mines_king
          text: 时间会证明一切。不过，您若也在意我，就请帮一帮贝利西玛吧。
        - id: ch04-b18
          speaker: desert_fairy
          text: 您知道自己在求什么吗？黄矮人是我最好的朋友，您却要我用法术对付他，夺走那个骄傲的公主。可她在我眼里，只是个情敌！
          emotion: angry
        - id: ch04-b19
          speaker: narrator
          text: 国王只能叹气。车驾最后落在一片花海般的草地上。深河环绕四周，小溪从浓荫下流过，处处清凉。附近有一座透明祖母绿砌成的宫殿，钻石铺地，红宝石搭成拱门。成千上万的美丽精灵从四面迎来，高声歌唱。
        - id: ch04-b20
          speakers: [palace_spirit_1, palace_spirit_2, palace_spirit_3, palace_spirit_4]
          ensemble: chorus
          text: 爱若要在人心称王，再多抗拒也是徒劳。骄傲的人只会痛得更深，让爱赢得更加荣耀。
        - id: ch04-b21
          speaker: narrator
          text: 仙女听见歌声赞颂自己的胜利，得意极了。她把国王领进最华丽的房间，又故意离开片刻，好让他不觉得自己是囚犯。国王猜到她仍躲在暗处监视，便走向一面大镜子。
        - id: ch04-b22
          speaker: gold_mines_king
          text: 可靠的顾问，请告诉我，怎样才能讨荒漠仙女喜欢？我现在只想让她高兴。
        - id: ch04-b23
          speaker: narrator
          text: 他马上卷起头发，又穿上桌边一件比自己衣裳更华贵的外套。仙女回来一看，喜悦再也藏不住。
        - id: ch04-b24
          speaker: desert_fairy
          text: 您为了取悦我花了多少心思，我全知道，而且您已经做得再好不过。只要真正在意我，这并不难。
          emotion: happy
        - id: ch04-b25
          speaker: narrator
          text: 国王为了稳住老仙女，说了许多动听的话。过了一阵，她准许他独自在海边散步。她早已用魔法掀起可怕的风暴，连最大胆的舵手也不敢出海，所以一点也不担心囚徒逃走。
        - id: ch04-b26
          speaker: narrator
          text: 国王终于能独自思量自己的处境。他心乱如麻，在岸边来回走着，又用手杖把心事写进沙里。
        - id: ch04-b27
          speaker: gold_mines_king
          text: 终于，我能在这片岸上，以温柔泪水减轻悲伤。唉，再也看不见爱人，可她仍在愁苦中给我希望。狂怒的大海，野风把你从深处搅向高空。你将我的爱人远远隔开，我只能受制于你的威风。我的心比你更加狂乱，只因命运待我太残忍。为何让我在流放中憔悴？为何夺走我的公主？海底洞府里美丽的仙女，你们深知真爱多么甜美。请浮上海面，平息怒涛，放绝望的爱人重获自由！
          emotion: sad

    - id: ch05
      title: 美人鱼的钻石宝剑
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王还在沙上书写，忽然听见一个声音。海浪越涌越高，一位美丽女子乘着浪尖轻轻漂来。她长发铺在水面，一手拿镜子，一手拿梳子。她没有双脚，下身是一条美丽的鱼尾。
        - id: ch05-b02
          speaker: mermaid
          text: 我知道你失去公主，又被荒漠仙女囚禁，心里有多痛苦。你若愿意，我可以帮你离开这里。不然，你还要苦熬三十年，甚至更久。
        - id: ch05-b03
          speaker: narrator
          text: 国王很想逃走，却担心这又是荒漠仙女设下的骗局。美人鱼看出他的迟疑。
        - id: ch05-b04
          speaker: mermaid
          text: 相信我，我不是来骗你的。我恨透了黄矮人和荒漠仙女，绝不会帮他们。我也常常看见你那位可怜的公主。她美丽又善良，叫我十分怜惜。只要你肯信我，我一定带你逃走。
        - id: ch05-b05
          speaker: gold_mines_king
          text: 我完全相信你，无论你吩咐什么，我都照办。可你既然见过我的公主，请告诉我，她如今怎么样，又遭遇了什么。
        - id: ch05-b06
          speaker: mermaid
          text: 没时间再谈了。跟我来，我带你去钢铁城堡。我们在岸上留下一个同你一模一样的替身，就连仙女也会被骗。
        - id: ch05-b07
          speaker: narrator
          text: 她迅速收起一束海草，对它吹了三口气。
        - id: ch05-b08
          speaker: mermaid
          text: 海草朋友，伸展身体，留在沙滩上，直到荒漠仙女来把你们带走。
        - id: ch05-b09
          speaker: narrator
          text: 海草立刻变成国王的模样，连外套也一模一样，只是苍白地躺在岸边，仿佛被巨浪打昏了。国王看得目瞪口呆。美人鱼抱起他，两人快活地游向远方。
        - id: ch05-b10
          speaker: mermaid
          text: 现在可以告诉你公主的事了。荒漠仙女刺伤她以后，黄矮人强迫她骑在西班牙猫背后。她又痛又怕，很快昏过去，直到被带进钢铁城堡才醒。那里有一群世上最漂亮的姑娘，也是矮人掳来的。她们争着照顾公主，让她躺在铺着金线织物的卧榻上，布面还绣着核桃般大的珍珠。
        - id: ch05-b11
          speaker: gold_mines_king
          text: 要是贝利西玛忘记我，答应嫁给黄矮人，我一定会心碎而死！
          emotion: fearful
        - id: ch05-b12
          speaker: mermaid
          text: 不用怕，公主心里只有你。那个可怕的矮人无论怎么劝，她连看也不肯看他。
        - id: ch05-b13
          speaker: gold_mines_king
          text: 请继续说吧。
        - id: ch05-b14
          speaker: mermaid
          text: 还有什么呢？你们从空中经过时，她正坐在林中。仙女伪装得太好，公主以为她比自己还美，所以认定你已经爱上了那个女人。你能想象她有多绝望。
        - id: ch05-b15
          speaker: gold_mines_king
          text: 她竟以为我爱上了仙女！这个误会会害死我们。我该怎样解释清楚？
          emotion: surprised
        - id: ch05-b16
          speaker: mermaid
          text: 这件事，你自己最清楚。两个人像你们这样彼此深爱，就不需要别人指点了。
        - id: ch05-b17
          speaker: narrator
          text: 他们抵达钢铁城堡临海的一面，只有这里没有炽热的城墙守卫。
        - id: ch05-b18
          speaker: mermaid
          text: 公主还在溪边，就是你看见她的地方。你要战胜许多敌人，才能走到她身旁。拿着这把剑吧，有它在，任何危险都不必怕，再大的困难也能克服。可一定记住，绝不能让剑离开你的手。我会在那块岩石旁等候。若你需要我帮忙带走公主，我一定会来。她的母后是我最好的朋友，我正是为了王后才去救你。
        - id: ch05-b19
          speaker: narrator
          text: 美人鱼交给他一柄由整块钻石制成的宝剑，光芒胜过太阳。国王一时找不到足以道谢的话，只能请她相信，自己明白这份礼物有多重要，永远不会忘记她的帮助。
        - id: ch05-b20
          speaker: narrator
          text: 与此同时，荒漠仙女见国王迟迟不归，带着一百名侍女赶到海边。她们为国王送来成篮钻石、精美金杯、琥珀、珊瑚和珍珠，还有华服、水果、鲜花，甚至鸟儿。
        - id: ch05-b21
          speaker: narrator
          text: 仙女一看见海草变成的国王躺在沙滩上，便尖叫着扑倒在他身旁，又哭又叫，还召来了自己的十一个仙女姐妹。她们本领虽大，却全被美人鱼的替身骗了，只能帮荒漠仙女为国王建造纪念碑。她们搬来碧玉、斑岩、玛瑙、大理石、黄金与青铜，还有雕像和纹章，要让他的名字永远流传。
        - id: ch05-b22
          speaker: narrator
          text: 真正的国王告别美人鱼，独自走向钢铁城堡。他一心想见到贝利西玛，脚步飞快，却很快被四头斯芬克斯围住。利爪眼看就要撕碎他，钻石宝剑忽然亮起。怪物立刻无力倒地，被他一剑斩杀。
        - id: ch05-b23
          speaker: narrator
          text: 接着，六条鳞片比铁还硬的巨龙挡住去路。国王毫不畏惧，挥动神剑，把它们一条接一条斩成碎块。他刚以为难关已经结束，转过弯又看见二十四位美丽优雅的仙女。她们举着花环，封住了道路。
        - id: ch05-b24
          speakers: [guardian_nymph_1, guardian_nymph_2, guardian_nymph_3, guardian_nymph_4]
          ensemble: chorus
          text: 王子，请停下。守住这里是我们的职责。放您过去，您和我们都会遭遇大祸。求您不要再向前，难道您真要杀死二十四个从未冒犯过您的姑娘吗？
        - id: ch05-b25
          speaker: narrator
          text: 国王不知怎样回答。一个骑士本不该拒绝女士的请求。就在他迟疑时，耳边响起一个神秘声音。
        - id: ch05-b26
          speaker: warning_voice
          text: 动手！快动手，一个也别饶，否则你的公主将永远失去！
        - id: ch05-b27
          speaker: narrator
          text: 国王立刻冲上前，撞断花环，把姑娘们赶得四散奔逃。此后再无阻碍，他终于来到溪边的小树林。

    - id: ch06
      title: 两棵相依的棕榈树
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 贝利西玛仍坐在水边，脸色苍白，满面倦容。国王快步走近，正要跪在她脚边，她却愤怒地退开，仿佛来的人是黄矮人。
        - id: ch06-b02
          speaker: gold_mines_king
          text: 公主，请别生我的气，让我解释。我没有变心，也不是有意伤害您。我只是身不由己，才让您这样难过。
        - id: ch06-b03
          speaker: bellissima
          text: 我明明看见你同世上最美的女子飞过天空。难道那也不是你自愿的吗？
          emotion: angry
        - id: ch06-b04
          speaker: gold_mines_king
          text: 真的不是。荒漠仙女把我锁在岩石上还不够，又用车把我带到大地另一端。若没有一位友善的美人鱼相救，我现在还是她的囚徒。美人鱼送我来这里，就是为了从卑劣的敌人手里救出您。我的公主，请接受最忠诚的爱人前来帮助您。
        - id: ch06-b05
          speaker: narrator
          text: 国王跪在她脚边，抓住她的裙摆。可就在这一刻，神剑从手中滑落。黄矮人一直蹲在一棵莴苣后面，一见宝剑落地，马上跳出来抢到手里。他很清楚这把剑有多大的力量。
        - id: ch06-b06
          speaker: narrator
          text: 公主看见矮人，吓得尖叫。这声音反而激怒了小怪物。他念出咒语，召来两个巨人，用粗大的铁链把国王牢牢捆住。
        - id: ch06-b07
          speaker: yellow_dwarf
          text: 现在，我的情敌是死是活，全由我决定。公主，只要你答应嫁给我，我就饶他一命，让他平安离开。
        - id: ch06-b08
          speaker: gold_mines_king
          text: 我宁可死上一千次！
          emotion: angry
        - id: ch06-b09
          speaker: bellissima
          text: 你非死不可吗？世上还有比这更可怕的事吗？
          emotion: fearful
        - id: ch06-b10
          speaker: gold_mines_king
          text: 你若嫁给这个小恶棍，那才更加可怕。
        - id: ch06-b11
          speaker: bellissima
          text: 那么，至少让我们一起死吧。
          emotion: sad
        - id: ch06-b12
          speaker: gold_mines_king
          text: 我的公主，请让我为您而死。至少让我得到这份安慰。
          emotion: sad
        - id: ch06-b13
          speaker: bellissima
          text: 不，不！黄矮人，别杀他。我宁愿照你的意思做。
          emotion: fearful
        - id: ch06-b14
          speaker: gold_mines_king
          text: 残忍的公主，难道你要当着我的面嫁给别人，让我的余生只剩痛苦吗？
          emotion: sad
        - id: ch06-b15
          speaker: yellow_dwarf
          text: 不会的。你这个情敌太让我害怕，所以你不会亲眼看到我们的婚礼。
        - id: ch06-b16
          speaker: narrator
          text: 贝利西玛哭喊着哀求，黄矮人却举起钻石宝剑，刺穿了国王的心。公主看见爱人死在脚边，再也无法独自活下去。她倒在国王身旁，心碎而死。
        - id: ch06-b17
          speaker: narrator
          text: 这对不幸的爱人就这样走到了生命尽头。就连美人鱼也来不及相救，因为钻石宝剑落入敌手，所有魔力也随之失去了。
        - id: ch06-b18
          speaker: narrator
          text: 邪恶的黄矮人宁可看见公主死去，也不愿她嫁给金矿国王。荒漠仙女后来听说国王的经历，推倒了为他建造的宏伟纪念碑。她恨自己遭人戏弄，从此恨国王有多深，就像从前爱他有多深。
        - id: ch06-b19
          speaker: narrator
          text: 善良的美人鱼为两人的命运悲伤，便把他们变成两棵高高的棕榈树。从此，两棵树永远并肩而立。交缠的枝叶轻轻抚摸彼此，低声诉说着他们忠贞的爱情。
