audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    father:
      display_name: 父亲
      tts: {delivery: 务实坚定，说话不容含糊, timbre: 结实成熟, pace: 中等, pitch: 中低音}
    eldest_brother:
      display_name: 大哥
      tts: {delivery: 爱夸口又刻薄，嘲弄时毫不客气, timbre: 强健年轻, pace: 稍快, pitch: 中音}
    second_brother:
      display_name: 二哥
      tts: {delivery: 自负讥诮，喜欢随声附和, timbre: 清晰年轻, pace: 稍快, pitch: 中音}
    cinderlad:
      display_name: 灰小子
      tts: {delivery: 安静坚韧，遇事从容机敏, timbre: 温暖年轻, pace: 平稳, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严多疑，常压着不情愿, timbre: 饱满成熟, pace: 中等, pitch: 中低音}
    knight_one:
      display_name: 骑士甲
      tts: {delivery: 骄傲强势，嗓音响亮, timbre: 明亮成熟, pace: 稍快, pitch: 中低音}
    knight_two:
      display_name: 骑士乙
      tts: {delivery: 自信直率，说话利落, timbre: 清晰成熟, pace: 稍快, pitch: 中音}
    knight_three:
      display_name: 骑士丙
      tts: {delivery: 好胜而急切, timbre: 浑厚成熟, pace: 稍快, pitch: 中低音}
  chapters:
    - id: ch01
      title: 草地上的守夜人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个人在山坡上有一片草地，草地里立着一座存放干草的谷仓。可一连两年，每到圣约翰节前夜，长得正旺的青草都会在一夜之间被吃光，像是让一大群羊连叶带茎啃到了根。
        - id: ch01-b02
          speaker: narrator
          text: 头一年如此，第二年还是如此。父亲受够了眼看庄稼遭殃，便把三个儿子叫来。他说，前两年，草叶草茎全让东西吃光，今年绝不能再由着这种荒唐事发生。圣约翰节那晚，必须有一个人睡进谷仓，睁大眼睛守住草地。三个儿子中，老三名叫灰小子。
        - id: ch01-b03
          speaker: eldest_brother
          text: 我去！我一定守得严严实实。管他是人，是野兽，就算魔鬼亲自来，也别想吃上一口。
        - id: ch01-b04
          speaker: narrator
          text: 傍晚，大儿子来到谷仓，躺下睡觉。天刚要黑，四周忽然传来可怕的轰隆声，大地跟着震动，连墙壁和屋顶也在他身边摇晃起来。大儿子忘了先前的豪言壮语，一跃而起，撒腿就逃。他使出全身力气向家里跑，连头也没敢回。没人再留在那里守护草地，那一年的谷仓仍和前两年一样，空空如也。
        - id: ch01-b05
          speaker: narrator
          text: 第二年的圣约翰节前夜，父亲又提起守夜的事。他说，不能再这样年复一年，看着远处草地里的青草全部损失掉。几个儿子总得有一个去守着，而且这一次非得看守好不可。二儿子听了，自告奋勇要让大家看看自己的本事，也像哥哥那样走进谷仓躺下。
        - id: ch01-b06
          speaker: narrator
          text: 天色将暗，一阵巨响滚来，地面随即猛烈摇晃，比上一年还要可怕。二儿子吓破了胆，转身飞奔而去，跑得像在争夺头名。
        - id: ch01-b07
          speaker: narrator
          text: 又过了一年，轮到灰小子守夜。他刚要动身，两个哥哥就笑起来。
        - id: ch01-b08
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 对，看守干草就该派你！你除了蹲在灰堆里烤自己，还会什么呀？
        - id: ch01-b09
          speaker: narrator
          text: 灰小子没把嘲笑放在心上。傍晚，他慢悠悠地走到草地，进谷仓躺下。大约一个钟头后，轰鸣声和嘎吱声一齐响起，听着十分吓人。
        - id: ch01-b10
          speaker: cinderlad
          text: 只要不比这更厉害，我就受得住。
        - id: ch01-b11
          speaker: narrator
          text: 没多久，嘎吱声再次响起。大地震得干草四处乱飞，全落在灰小子身上。
        - id: ch01-b12
          speaker: cinderlad
          text: 嗬，要是最厉害也不过如此，我还是受得住。
        - id: ch01-b13
          speaker: narrator
          text: 第三阵轰鸣紧接着来了。地震凶猛极了，灰小子还以为墙壁和屋顶全都塌了。可震动一停，周围忽然变得死一般寂静。
        - id: ch01-b14
          speaker: cinderlad
          text: 我看它准会再来。
        - id: ch01-b15
          speaker: narrator
          text: 可它没有再来。四周一直很安静。灰小子静静躺了一会儿，听见半掩的谷仓门外传来嚼草声，像是有匹马正站在那里。他悄悄走过去，从门缝向外看，果然见到一匹从未见过的骏马。那马又高大，又肥壮，又漂亮，背上备着马鞍、辔头和一整套骑士铠甲，样样都是黄铜制成，擦得亮闪闪的。
        - id: ch01-b16
          speaker: cinderlad
          text: 哈，原来是你吃了我家的干草。这回可得叫你住嘴。
        - id: ch01-b17
          speaker: narrator
          text: 他赶紧取出火镰，朝马身上一扔。骏马立刻挪不开脚，还变得无比温顺，任由他摆布。灰小子骑上马，把它带到一个只有自己知道的地方拴好，这才回家。
        - id: ch01-b18
          speaker: narrator
          text: 两个哥哥见他回来，笑着问他守得怎么样。
        - id: ch01-b19
          speaker: eldest_brother
          text: 你要是真走到了草地，怎么会这么快就回来？你在谷仓里准没躺多久！
        - id: ch01-b20
          speaker: cinderlad
          text: 我一直躺到太阳升起来，什么也没看见，什么也没听见。天知道你们俩到底怕什么。
        - id: ch01-b21
          speaker: second_brother
          text: 你到底守没守住，我们去看一眼就知道了。
        - id: ch01-b22
          speaker: narrator
          text: 他们来到草地，只见每一根青草都和前一晚一样，又高又密。
    - id: ch02
      title: 白银骏马与黄金骏马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 下一个圣约翰节前夜，同样的问题又来了。两个哥哥谁也不敢再去远处的草地守庄稼，灰小子便去了。他在谷仓里躺下，一切和上一年一样。轰鸣与地震先来一次，又来一次，接着是第三次，而且三次都比他先前受过的猛烈得多。震动过后，四周又静得像死了一样。
        - id: ch02-b02
          speaker: narrator
          text: 寂静中，谷仓外又响起嚼草声。灰小子轻轻走到门边，看见墙旁站着第二匹马。它比头一匹更高大、更肥壮，背上备着鞍和辔头，还驮着一整套骑士铠甲。样样都是明亮的白银制成，美得任谁看了都会称心。
        - id: ch02-b03
          speaker: cinderlad
          text: 嘿，今晚偷吃干草的是你呀。这就叫你停下来。
        - id: ch02-b04
          speaker: narrator
          text: 灰小子取出火镰，从马鬃上方扔了过去。那匹高大的马马上停在原地，温顺得像只羔羊。他跨上银马，骑到只有自己知道的地方，把它和黄铜骏马拴在一起，然后才回家。
        - id: ch02-b05
          speaker: eldest_brother
          text: 这一次，你大概又要说自己守得很好吧？
        - id: ch02-b06
          speaker: cinderlad
          text: 是啊，我确实守得很好。
        - id: ch02-b07
          speaker: narrator
          text: 兄弟俩又去草地查看，只见青草仍旧和从前一样，又高又密，一根也没少。不过，亲眼见到灰小子再次守住草地，也没有让他们对弟弟好一点儿。
        - id: ch02-b08
          speaker: narrator
          text: 第三个圣约翰节之夜到了。两个哥哥想起自己在谷仓过夜时受到的惊吓，至今还没有缓过来，谁也不敢再去。灰小子却照样走进谷仓。地面又震动三次，一次比一次厉害。最后一下竟把他从这面墙甩到那面墙。随后，黑夜忽然安静下来，四周静得像死了一样。
        - id: ch02-b09
          speaker: narrator
          text: 灰小子躺了一会儿，又听见门外传来嚼草声。他悄悄望出去，看见第三匹马站在那里。这匹马比前两匹还要高大肥壮。
        - id: ch02-b10
          speaker: cinderlad
          text: 嘿，这回偷吃我家干草的就是你。到此为止吧。
        - id: ch02-b11
          speaker: narrator
          text: 火镰一扔过去，那匹马就像被钉在草地上一样，一动也不能动。灰小子骑着它去见另外两匹马，安顿好以后才回家。
        - id: ch02-b12
          speaker: narrator
          text: 灰小子回到家，哥哥们像往常一样取笑他。他们说，看他那副走路像在梦游的模样，就知道夜里一定守得格外用心。灰小子懒得争辩，只叫他们去草地亲眼看看。两人去了，青草果然一根也没少，而且和从前一样繁茂浓密。
    - id: ch03
      title: 黄铜骑士
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 灰小子一家所住的国家里，有位国王。王宫旁边耸立着一座高高的玻璃山，山坡陡得像房子的侧墙，山面又像冰一样滑。国王不肯把女儿嫁给任何一个骑不到山顶的人。他宣布，比试时公主要坐在山巅，膝上放着三只金苹果。谁能骑到顶上取走这三只苹果，谁就可以娶她，还能得到半个王国。
        - id: ch03-b02
          speaker: narrator
          text: 国王命人在全国每一座教堂宣布这件事，消息还传到了许多别的王国。公主美丽非凡，见过她的人哪怕不愿意，也会不由自主地深深爱上她。王子和骑士们都想赢得公主，顺带得到半个王国，于是从世界尽头策马赶来。他们衣着华美，阳光一照便闪闪发亮，胯下的马仿佛一路跳着舞。每个人都认定公主一定属于自己。
        - id: ch03-b03
          speaker: narrator
          text: 国王指定的比试日终于到了。玻璃山下挤满了王子和骑士，密密麻麻，仿佛成群涌来。凡是会走路的，甚至只会爬的，也都赶来观看，要亲眼看看谁会赢得国王的女儿。灰小子的两个哥哥也去了，却不肯带上他。他们嫌灰小子成天在灰堆里睡觉翻扒，身上又脏又黑，怕别人看见他们和这样的蠢货在一起，会笑话他们。
        - id: ch03-b04
          speaker: cinderlad
          text: 那好，我就一个人去。
        - id: ch03-b05
          speaker: narrator
          text: 山下的王子和骑士一个接一个纵马上前，马身上全冒出了白沫。可马蹄刚碰到玻璃，就会立刻滑下来，没有一匹能向上走出两码。这也难怪，山面像窗玻璃一样光滑，又像房子的墙壁一样陡峭。尽管如此，为了公主和半个王国，人人还是冲了又滑，滑了又冲，不肯罢休。最后，马匹又热又累，再也走不动，身上的白沫直往下滴，骑手们只好放弃。
        - id: ch03-b06
          speaker: narrator
          text: 国王正要宣布第二天重新比试，一位陌生骑士忽然赶来。他骑着众人从未见过的骏马，身披黄铜铠甲，手中的辔头和全身装束也都是黄铜的，擦得耀眼发亮。
        - id: ch03-b07
          speakers: [knight_one, knight_two, knight_three]
          ensemble: chorus
          text: 别白费力气了！这座山根本骑不上去！
        - id: ch03-b08
          speaker: narrator
          text: 黄铜骑士理也不理，径直冲上玻璃山，轻松得像脚下根本没有斜坡。他向上骑了很远，大约走完三分之一，才拨转马头。公主觉得自己从未见过这样英俊的骑士。他上山时，她一直坐在山顶，盼着他能来到自己身边。见他掉头向下，公主便把一只金苹果扔到他身后。苹果顺着山坡滚下，正好落进骑士的鞋里。
        - id: ch03-b09
          speaker: narrator
          text: 黄铜骑士一下山便飞驰而去，谁也不知道他去了哪里。当晚，国王召来所有王子和骑士，要那位神秘骑手拿出公主扔下的金苹果。众人逐一上前，却没有一个拿得出来。
        - id: ch03-b10
          speaker: narrator
          text: 两个哥哥回到家，滔滔不绝地说起白天的盛况。起初，没有一个人能朝山上迈出哪怕一步。后来，那位黄铜骑士来了，铠甲和辔头全是黄铜的，连其他马具也远远看去都在发亮。他骑马的模样实在精彩，一直来到三分之一高的地方才回来。哥哥们认定，只要他愿意，准能一口气骑到山顶，不过是自己觉得头一次走这么远已经够了。
        - id: ch03-b11
          speaker: cinderlad
          text: 唉，我也真想看看他！
        - id: ch03-b12
          speaker: eldest_brother
          text: 就凭你？你这只蹲在灰里的脏东西，也配和那样的大人物待在一起？
    - id: ch04
      title: 白银骑士与黄金骑士
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，哥哥们又要出门。灰小子求他们带自己去看比试，他们还是嫌他又丑又脏。
        - id: ch04-b02
          speaker: cinderlad
          text: 好吧，那我还是一个人去。
        - id: ch04-b03
          speaker: narrator
          text: 这一次，王子和骑士们特意把马蹄铁打得粗糙不平，以为这样就不会打滑。可还是没有用。马匹一踏上山坡便滑下来，连一码也走不出。骑手们反复尝试，直到马匹全都累坏，再也不能前进一步。国王本想宣布第二天举行最后一次比试，再给众人一个机会，却又决定多等片刻，看看黄铜骑士今天会不会回来。
        - id: ch04-b04
          speaker: narrator
          text: 黄铜骑士没有出现，众人还在四处寻望，远处却来了一位白银骑士。他的坐骑比前一天那匹更加神骏，铠甲、马鞍和辔头全是白银制成，离得很远也在闪烁。其他骑士又朝他喊，劝他别白费力气。他却充耳不闻，径直骑上玻璃山。这一次，他越过三分之一处，一直来到三分之二高的地方才掉头下山。
        - id: ch04-b05
          speaker: narrator
          text: 公主比喜欢黄铜骑士还要喜欢这位白银骑士。她坐在山顶，一心盼着他能越骑越高，来到自己面前。可见他转身下山，公主便把第二只金苹果朝他身后扔去。苹果沿着玻璃山滚下来，又落进骑士的鞋里。他一下山就飞马离去，跑得谁也看不清去向，转眼便没了踪影。
        - id: ch04-b06
          speaker: narrator
          text: 傍晚，所有人都要来到国王和公主面前。骑士们一个接一个走进去，可谁也拿不出金苹果。夜里，两个哥哥回家，把众人怎样骑马、又怎样一次次滑下来全讲了一遍。他们最后才说起白银骑士，说他的银鞍银辔闪闪发亮，纵马登山的本领实在了不起。他到了三分之二处才掉头，公主还把第二只金苹果扔给了他。
        - id: ch04-b07
          speaker: cinderlad
          text: 唉，我也真想看看他！
        - id: ch04-b08
          speaker: second_brother
          text: 哟，就凭你？他可比你成天翻扒的灰堆亮多了，你这又脏又黑的东西！
        - id: ch04-b09
          speaker: narrator
          text: 第三天，灰小子还想跟哥哥们一起去，两人照旧不肯。玻璃山下，还是没有谁能向上骑出一码。大家等着白银骑士，可他既不露面，也没有消息。
        - id: ch04-b10
          speaker: narrator
          text: 等了很久，一位黄金骑士终于策马而来。他的坐骑好得世上再也找不到第二匹，铠甲、马鞍和辔头全是黄金制成。人还远在天边，那片光芒就已经照得耀眼，晃得众人睁不开眼。王子和骑士们被这华美的景象惊呆了，连劝他别费力气的话都忘了喊。
        - id: ch04-b11
          speaker: narrator
          text: 黄金骑士径直奔向山脚，纵马而上，仿佛眼前根本没有山坡。他冲得实在太快，公主还来不及盼他登顶，他便已经来到她面前，从她膝上取走了第三只金苹果。他随即拨转马头，冲下玻璃山。山下的人还没从惊讶中回过神，更没能和他说上一句话，他就消失得无影无踪。
        - id: ch04-b12
          speaker: narrator
          text: 夜里，哥哥们回到家，有说不完的话，要讲当天的比试。最后，他们提起黄金骑士，称赞他威风极了，说天底下再也找不到第二个如此光彩夺目的骑士。
        - id: ch04-b13
          speaker: cinderlad
          text: 唉，我也真想看看他！
        - id: ch04-b14
          speaker: eldest_brother
          text: 哼，他也就比你成天乱扒的煤灰堆亮一点儿。你这又脏又黑的东西！
    - id: ch05
      title: 三只金苹果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 到了第二天，所有王子和骑士都要去见国王和公主。前一晚天色太迟，已经来不及逐个查验。今天，那位骑上山顶、得到金苹果的人必须把它拿出来。他们依次走到国王面前，先是王子，随后是骑士，可每个人都是空手而来，谁也没有苹果。
        - id: ch05-b02
          speaker: king
          text: 苹果一定在某个人手里。我们全都亲眼看见，有个人骑到山顶，把它取走了。
        - id: ch05-b03
          speaker: narrator
          text: 国王随即下令，全国每一个人都必须来到王宫，看看究竟是谁拿着苹果。人们一个接一个地赶来，又一个接一个地空手退下，仍旧没有谁拿得出金苹果。等了好久好久，灰小子的两个哥哥最后才到。国王见他们已经排在所有人后面，便问国内是不是还有谁没来。
        - id: ch05-b04
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 啊，我们还有个弟弟。可苹果绝不会在他手里！这三天，他一步也没离开过灰堆。
        - id: ch05-b05
          speaker: king
          text: 那也不要紧。既然其他人都来了，也叫他来吧。
        - id: ch05-b06
          speaker: narrator
          text: 灰小子只得来到王宫。
        - id: ch05-b07
          speaker: king
          text: 金苹果在你手里吗？
        - id: ch05-b08
          speaker: cinderlad
          text: 在。瞧，这是第一只，这是第二只，第三只也在这里。
        - id: ch05-b09
          speaker: narrator
          text: 灰小子说着，从口袋里一只接一只地掏出三只苹果，摆在大家眼前。接着，他脱下沾满煤灰的破衣裳，里面明亮的黄金铠甲一下子全露了出来。他站在国王和众人面前，浑身熠熠生辉。
        - id: ch05-b10
          speaker: king
          text: 我的女儿和半个王国都归你。这两样奖赏，你都当之无愧！
        - id: ch05-b11
          speaker: narrator
          text: 于是，一场婚礼热热闹闹地举行了，灰小子娶到了国王的女儿。参加婚礼的人全都尽情欢乐，因为他们虽然没有本事骑上玻璃山，欢乐起来却个个在行。要是直到今天还没有停下，他们想必仍在那里欢庆呢。
        - id: ch05-b12
          speaker: narrator
          text: 这个故事由阿斯比约恩森与穆记录下来。
