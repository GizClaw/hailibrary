  chapters:
    - id: ch01
      title: The Hayfield Watch
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man had a meadow on the side of a mountain. In that meadow stood a barn where he stored his hay. But for two years there had been very little hay to store. Every St. John's Eve, when the grass was at its strongest, something ate it clean to the ground overnight. It looked as though a whole flock of sheep had gnawed away every blade and stalk.
        - id: ch01-b02
          speaker: narrator
          text: The strange thing happened once, and then it happened a second time. After losing the crop twice, the man had had enough. He had three sons, and the youngest was called Cinderlad. Their father told them it was absurd to let every blade and stalk be eaten for a third year. On St. John's night, one of the sons must sleep in the barn. Whoever went was to keep a sharp watch and discover what was stripping the meadow bare.
        - id: ch01-b03
          speaker: eldest_brother
          text: I'll go. I'll guard that grass so well that no man, no beast, not even the devil himself will get a mouthful.
        - id: ch01-b04
          speaker: narrator
          text: That evening the eldest son went out to the meadow. He entered the barn and lay down to sleep. As night drew near, a terrible rumbling began, followed by an earthquake. The ground shook so hard that the walls and roof trembled around him. All his brave promises were forgotten. The young man leaped up and ran as fast as his legs could carry him, without once daring to look back. With no one left to guard the field, the barn was empty that year just as it had been in the two years before.
        - id: ch01-b05
          speaker: narrator
          text: On the next St. John's Eve, the father raised the matter again. He said they could not go on losing all the grass in that distant field year after year. One of his sons must go there and watch it, and this time he must watch it well. The second son was ready to show what he could do. He went to the barn and lay down to sleep, just as his elder brother had done.
        - id: ch01-b06
          speaker: narrator
          text: Near nightfall came a deep rumble, followed by an earthquake even worse than the one the year before. The moment the second son heard it, terror seized him. He raced away as though he were running for a prize.
        - id: ch01-b07
          speaker: narrator
          text: The following year it was Cinderlad's turn. As he prepared to leave, his brothers laughed and jeered at him.
        - id: ch01-b08
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: Oh, you're just the right man to guard the hay! You've never learned to do anything but sit in the ashes and warm yourself.
        - id: ch01-b09
          speaker: narrator
          text: Cinderlad paid no attention. Toward evening he wandered out to the meadow, went into the barn, and lay down. About an hour later, a dreadful rumbling and creaking filled the place.
        - id: ch01-b10
          speaker: cinderlad
          text: If it gets no worse than this, I can stand it.
        - id: ch01-b11
          speaker: narrator
          text: Soon the creaking started again. The earth heaved until hay flew all around him.
        - id: ch01-b12
          speaker: cinderlad
          text: If this is the worst of it, I can still stand it.
        - id: ch01-b13
          speaker: narrator
          text: Then came a third rumble and a third earthquake. It was so violent that Cinderlad thought the roof and walls had fallen in. The shaking ended, and suddenly everything around him became as still as death.
        - id: ch01-b14
          speaker: cinderlad
          text: I'm almost sure it will come again.
        - id: ch01-b15
          speaker: narrator
          text: But it did not. After Cinderlad had lain quietly for a while, he heard something outside the barn door. It sounded like a horse chewing. He crept to the half-open door and looked out. There stood the biggest, fattest, finest horse he had ever seen, eating the grass. It carried a saddle and bridle, along with a complete suit of knight's armor. Everything was made of copper and shone brilliantly.
        - id: ch01-b16
          speaker: cinderlad
          text: Aha! So you're the one eating our hay. Well, I'll put an end to that.
        - id: ch01-b17
          speaker: narrator
          text: Cinderlad quickly took out his fire-striking steel and threw it over the horse. At once the animal lost the power to move away. It grew so tame that he could do whatever he wished with it. He mounted and rode to a place known only to him, tied the horse there, and returned home.
        - id: ch01-b18
          speaker: narrator
          text: His brothers laughed when they saw him and asked how his watch had gone.
        - id: ch01-b19
          speaker: eldest_brother
          text: You can't have stayed in the barn very long if you've already gone all the way to the meadow and back!
        - id: ch01-b20
          speaker: cinderlad
          text: I stayed there until sunrise. I didn't see or hear a thing. Only heaven knows what frightened you two so badly.
        - id: ch01-b21
          speaker: second_brother
          text: We'll soon find out whether you really watched the meadow.
        - id: ch01-b22
          speaker: narrator
          text: They went to look. Every blade of grass stood as long and thick as it had the night before.
    - id: ch02
      title: The Silver and Golden Horses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the next St. John's Eve, the same question arose again. Neither elder brother dared to return to the distant meadow and guard the crop, so Cinderlad went in their place. He lay down in the barn, and everything happened just as it had the year before. First came a rumbling and an earthquake. Then came another, and then a third. All three were far more violent than the ones he had already endured. Afterward, everything became as still as death.
        - id: ch02-b02
          speaker: narrator
          text: In that sudden silence, Cinderlad heard something chewing outside the barn door. He crept over as softly as he could and peered through the narrow opening. Close beside the wall stood another horse, eating and chewing. It was much larger and fatter than the first horse. A saddle rested on its back, a bridle was fitted to it, and it carried a complete suit of armor for a knight. Every piece was made of bright silver, as beautiful as anyone could wish to see.
        - id: ch02-b03
          speaker: cinderlad
          text: Ho! So you're the one eating our hay tonight. I'll stop you now.
        - id: ch02-b04
          speaker: narrator
          text: He threw his fire-striking steel over the horse's mane, and the great animal stood as quiet as a lamb. Cinderlad mounted it, rode it to the secret place where he kept the copper horse, and then went home.
        - id: ch02-b05
          speaker: eldest_brother
          text: I suppose you'll claim you kept a good watch again.
        - id: ch02-b06
          speaker: cinderlad
          text: I did keep a good watch.
        - id: ch02-b07
          speaker: narrator
          text: The brothers went to the meadow. Once more, the grass stood as high and thick as before. Even that did not make them treat Cinderlad any more kindly.
        - id: ch02-b08
          speaker: narrator
          text: When the third St. John's night came, the elder brothers still had not recovered from the nights they had spent in the barn. They remembered their fright too well, and neither one dared to guard the grass. Cinderlad dared. He went out, lay down in the barn, and waited. Once again there were three earthquakes, each worse than the one before. The last was so violent that it flung him from one wall of the barn to the other. Then, without warning, the night became as still as death.
        - id: ch02-b09
          speaker: narrator
          text: Cinderlad lay quietly for a short time. Then he heard something chewing just outside the door. Once more he stole toward the opening and looked through. There stood a third horse, larger and fatter than either of the two he had already caught. It was feeding on the grass beside the barn.
        - id: ch02-b10
          speaker: cinderlad
          text: Ho! So this time you're the one eating our hay. I'll put a stop to it.
        - id: ch02-b11
          speaker: narrator
          text: He tossed the steel over the horse, and it stood as still as if it had been nailed to the field. Cinderlad could do whatever he liked with it. He rode it to the secret place where the other two horses waited, then returned home.
        - id: ch02-b12
          speaker: narrator
          text: When Cinderlad reached home, his brothers mocked him just as they had before. They told him they could see how carefully he must have watched the grass, for he looked as though he were still walking in his sleep. Cinderlad did not trouble himself over their words. He simply told them to go out to the meadow and see for themselves. The brothers went, expecting to find the crop gone. Instead, the grass was still standing. This third time it looked just as fine and thick as it ever had.
    - id: ch03
      title: The Knight in Copper
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The King of the country where Cinderlad's father lived had a daughter. He would give her in marriage only to a man who could ride to the top of the glass hill. The hill stood close beside the royal palace. It rose high above the ground, and its steep glass surface was as slippery as ice. On the chosen days, the Princess would sit at the very top with three golden apples resting in her lap. The man who could ride all the way up and take those three apples would marry her. He would receive half the kingdom as well.
        - id: ch03-b02
          speaker: narrator
          text: The King had this challenge announced in every church throughout his kingdom, and the news went through many other kingdoms too. The Princess was very beautiful. Everyone who saw her fell deeply in love, whether he meant to or not. So princes and knights were eager to win her, along with half the kingdom. They came riding from the very ends of the world. Their splendid clothes flashed in the sunlight, their horses seemed to dance beneath them, and there was not one rider among them who doubted that he would win.
        - id: ch03-b03
          speaker: narrator
          text: When the day appointed by the King finally arrived, so many princes and knights gathered beneath the glass hill that they seemed to swarm over the ground. Everyone who could walk, or even creep, came out to watch and see who would win the King's daughter. Cinderlad's two brothers went as well, but they refused to take him with them. He was black and dirty from sleeping and grubbing among the ashes. They said everyone in the crowd would laugh at them if they were seen in the company of such an oaf.
        - id: ch03-b04
          speaker: cinderlad
          text: Then I'll go by myself.
        - id: ch03-b05
          speaker: narrator
          text: At the hill, every prince and knight tried to ride up. They urged their horses forward until the animals were covered in foam, but it did no good. The instant a horse set one hoof on the glass, it slid back down. Not one climbed even two yards. That was hardly surprising. The hill was as smooth as a windowpane and as steep as the side of a house. Still, every man wanted the Princess and half the kingdom. They rode, they slipped, and they tried again. At last the horses were so tired and hot that foam dripped from them, and their riders had to give up.
        - id: ch03-b06
          speaker: narrator
          text: The King was about to announce another attempt for the next day when a new knight appeared. He rode a horse finer than any the crowd had ever seen. His armor, bridle, and all his gear were made of copper, polished so brightly that they flashed.
        - id: ch03-b07
          speakers: [knight_one, knight_two, knight_three]
          ensemble: chorus
          text: Save yourself the trouble! No one can ride up that hill!
        - id: ch03-b08
          speaker: narrator
          text: The copper knight paid no attention to their calls. He rode straight onto the glass and climbed as though the hill were nothing at all. He went on for a long way, perhaps one-third of the distance to the top. Then he turned his horse and rode down again. The Princess thought she had never seen so handsome a knight. While he climbed, she sat hoping with all her heart that he would reach her. When she saw him turn back, she threw one of the golden apples down after him. It rolled along the glass and went straight into his shoe.
        - id: ch03-b09
          speaker: narrator
          text: Once the knight reached the foot of the hill, he galloped away so quickly that no one knew where he had gone. That night, the King ordered every prince and knight to appear before him. The mysterious rider who had climbed so far was to prove himself by showing the golden apple the Princess had thrown. One knight presented himself after another. Each came before the throne, and each left with nothing to show. Not one of them had the apple.
        - id: ch03-b10
          speaker: narrator
          text: When Cinderlad's brothers came home that night, they had a long tale to tell about the riding. At first, they said, nobody had managed even one step up the glass. Then a knight had appeared in copper armor, riding with a copper bridle. His armor and trappings had shone so brightly that their light could be seen from far away. The brothers said it had been a marvelous sight to watch him ride. He had gone one-third of the way up the glass hill and could easily have reached the top if he had wanted. In their opinion, he had simply decided that one-third was enough for his first attempt.
        - id: ch03-b11
          speaker: cinderlad
          text: Oh, I wish I could have seen him!
        - id: ch03-b12
          speaker: eldest_brother
          text: You? As if someone like you belonged among such great lords! Look at you, sitting there in the cinders, you filthy creature.
    - id: ch04
      title: The Knights in Silver and Gold
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the brothers set out for the glass hill again. Cinderlad asked to join them, but they said he was far too ugly and dirty to go.
        - id: ch04-b02
          speaker: cinderlad
          text: Very well. I'll go on my own again.
        - id: ch04-b03
          speaker: narrator
          text: The princes and knights had taken care to roughen their horses' shoes, hoping that this would give them a grip on the glass. It did not help at all. They rode forward and slid back exactly as they had the day before. Not one horse climbed even a yard. Again and again the riders tried, until they had worn out their horses and the animals could do no more. Then the whole contest had to stop.
        - id: ch04-b04
          speaker: narrator
          text: The King considered giving them one final chance the next day, but first he waited to see whether the copper knight would return. No copper armor appeared. Then, while everyone was still watching for him, another knight rode into sight. His horse was far finer than the copper knight's. His armor, saddle, and bridle were all silver, gleaming from a great distance.
        - id: ch04-b05
          speakers: [knight_one, knight_two, knight_three]
          ensemble: chorus
          text: Don't even try! Riding up that glass hill is impossible!
        - id: ch04-b06
          speaker: narrator
          text: The silver knight ignored every warning and rode straight toward the glass hill. His horse carried him upward with ease, and he climbed much farther than the copper knight had gone. When he had covered two-thirds of the distance, he turned the horse and rode down again. The Princess liked this knight even better than the first. As she watched him, she longed for him to reach the top. When she saw him turn away, she threw the second golden apple after him. It rolled down the shining slope and into his shoe.
        - id: ch04-b07
          speaker: narrator
          text: As soon as the silver knight reached the bottom, he raced away and vanished. That evening every rider appeared before the King and Princess. One after another they came in, but not one could show the second golden apple.
        - id: ch04-b08
          speaker: narrator
          text: That night the brothers came home and told Cinderlad everything that had happened. Every prince and knight had ridden at the hill, they said, but none of them had been able to climb it. Last of all came a man in silver armor. His horse had a silver bridle and a silver saddle, and what a rider that knight had been! He took his horse two-thirds of the way up the hill before turning back. When he rode down, the Princess threw her second golden apple after him.
        - id: ch04-b09
          speaker: second_brother
          text: What a rider he was! He was a splendid man.
        - id: ch04-b10
          speaker: cinderlad
          text: Oh, how I wish I could have seen him too!
        - id: ch04-b11
          speaker: eldest_brother
          text: Oh, really? He was a little brighter than the ashes you dig through, you dirty black creature.
        - id: ch04-b12
          speaker: narrator
          text: On the third day, Cinderlad again asked to go with his brothers. Again they refused to have him beside them. At the glass hill, no one could climb even a yard. The whole crowd waited for the silver knight, but there was no sign or sound of him.
        - id: ch04-b13
          speaker: narrator
          text: At last, after they had waited a long time, a third knight came riding toward them. His horse was finer than any horse anyone there had ever seen. The rider wore golden armor, and his horse carried a golden saddle and golden bridle. Armor, saddle, and bridle all shone so fiercely that the light dazzled the crowd while the knight was still far away. The other princes and knights stared at such magnificence. They were too amazed even to call out and tell him that climbing the hill was hopeless.
        - id: ch04-b14
          speaker: narrator
          text: The golden knight rode straight to the foot of the glass hill. Without slowing, he galloped upward as though there were no hill at all. He climbed so quickly that the Princess had no time even to wish that he might reach the top. In a moment he was beside her. He took the third golden apple from her lap, turned his horse, and rode down again. Before anyone could say a single word to him, he had vanished from sight.
        - id: ch04-b15
          speaker: narrator
          text: That night, the brothers returned home with more to tell than ever. They described how every other rider had failed, how the crowd had waited for the silver knight, and how no one had expected the stranger who finally appeared. At last they came to the golden armor, the dazzling horse, and the effortless ride all the way to the top.
        - id: ch04-b16
          speaker: second_brother
          text: Now that was a splendid man! There isn't another knight like him anywhere on earth!
        - id: ch04-b17
          speaker: cinderlad
          text: Oh, how I wish I could have seen him too!
        - id: ch04-b18
          speaker: eldest_brother
          text: He shone almost as brightly as those heaps of coal you're always scratching through, you filthy black creature.
    - id: ch05
      title: The Three Golden Apples
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, all the princes and knights were ordered to appear before the King and Princess. It had been too late to examine them the previous night. First came the princes, and then the knights. Each man had to produce the golden apple if he possessed it, but none of them did.
        - id: ch05-b02
          speaker: king
          text: Someone must have that apple. We all saw a man ride to the top and take it with our own eyes.
        - id: ch05-b03
          speaker: narrator
          text: The King commanded everyone in the kingdom to come to the palace, so each person could be asked whether he had the apple. One after another, people came before him. Still no one produced the golden apple. The search went on for a long, long time. At last Cinderlad's two brothers arrived. They were the final men left to question, so the King asked them whether there was anyone else in the whole kingdom who had not yet come.
        - id: ch05-b04
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: Yes, we have a brother. But he never got the golden apple. He never left the cinder heap on any of the three days.
        - id: ch05-b05
          speaker: king
          text: That makes no difference. Everyone else has come to the palace, so your brother must come as well.
        - id: ch05-b06
          speaker: narrator
          text: So Cinderlad was summoned from the cinder heap and brought before the King at the palace.
        - id: ch05-b07
          speaker: king
          text: Do you have the golden apple?
        - id: ch05-b08
          speaker: cinderlad
          text: Yes. Here is the first one, here is the second, and here is the third as well.
        - id: ch05-b09
          speaker: narrator
          text: Cinderlad drew all three apples from his pocket. Then he pulled away his sooty rags and stood before them in his bright golden armor, gleaming from head to foot.
        - id: ch05-b10
          speaker: king
          text: You shall marry my daughter and receive half my kingdom. You have earned them both!
        - id: ch05-b11
          speaker: narrator
          text: So a wedding was held, and Cinderlad married the King's daughter. He received the half of the kingdom that the King had promised as well. Everyone made merry at the wedding feast. All those people might have failed to ride up the glass hill themselves, but they certainly knew how to celebrate the man who had done it. They ate, drank, and rejoiced together. And if they have never stopped their merry-making, then they must still be at it today.
