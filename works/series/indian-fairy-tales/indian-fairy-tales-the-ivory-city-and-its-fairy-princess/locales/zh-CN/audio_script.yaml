audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 年轻坦率，重情而容易冲动
        timbre: 清朗明亮
        pace: 适中，激动时稍快
        pitch: 中
    vizier_son:
      display_name: 首相之子
      tts:
        delivery: 聪敏沉着，劝说时亲切笃定
        timbre: 温和清晰
        pace: 从容
        pitch: 中
    merchant:
      display_name: 商人
      tts:
        delivery: 朴实直接，惊慌时急切
        timbre: 厚实
        pace: 适中
        pitch: 中低
    merchant_wife:
      display_name: 商人的妻子
      tts:
        delivery: 直率肯定，受惊后仍带紧张
        timbre: 清亮
        pace: 适中
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严刚烈，发令时不容置疑
        timbre: 浑厚端正
        pace: 适中偏慢
        pitch: 低
    vizier:
      display_name: 首相
      tts:
        delivery: 谨慎持重，进谏时恭敬恳切
        timbre: 沉稳清晰
        pace: 稍缓
        pitch: 中低
    robber_1:
      display_name: 强盗甲
      tts:
        delivery: 表面客气，暗藏算计
        timbre: 粗哑
        pace: 适中
        pitch: 中低
    robber_2:
      display_name: 强盗乙
      tts:
        delivery: 表面热情，语气虚伪
        timbre: 干涩
        pace: 适中
        pitch: 中
    robber_woman:
      display_name: 强盗家的女人
      tts:
        delivery: 粗直急促，谈条件时坚决
        timbre: 低哑
        pace: 适中偏快
        pitch: 中低
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 絮叨直爽，爱说话又容易受骗
        timbre: 苍老而明亮
        pace: 稍快
        pitch: 中高
    old_woman_daughter:
      display_name: 老妇人的女儿
      tts:
        delivery: 年轻伶俐，装怒时语气鲜明
        timbre: 清脆
        pace: 适中
        pitch: 高
    gulizar:
      display_name: 古丽扎尔公主
      tts:
        delivery: 高贵含蓄，情深时柔和，决断时冷静
        timbre: 柔美清澈
        pace: 舒缓
        pitch: 中高
    maid:
      display_name: 侍女
      tts:
        delivery: 恭谨利落，禀报时清楚直接
        timbre: 轻柔清晰
        pace: 适中
        pitch: 中高
    goldsmith:
      display_name: 金匠
      tts:
        delivery: 精明克制，问价时不露声色
        timbre: 略显沙哑
        pace: 适中
        pitch: 中
    kotwal:
      display_name: 警察总管
      tts:
        delivery: 严厉审慎，盘问时简短有力
        timbre: 低沉硬朗
        pace: 适中
        pitch: 低
    courtier_1:
      display_name: 宫廷侍从甲
      tts:
        delivery: 恭敬急切，劝谏时谨慎
        timbre: 清晰稳重
        pace: 适中
        pitch: 中
    courtier_2:
      display_name: 宫廷侍从乙
      tts:
        delivery: 恭敬急切，随声进谏
        timbre: 温厚清楚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 一箭之祸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，年轻的王子和父王的首相之子正在练习射箭。附近一所房子的窗台上停着一只鸟，王子张弓瞄准，谁知一箭射偏，擦伤了正在楼上房间里走动的商人妻子。他根本不知道那里有人。要是知道，他绝不会朝那个方向放箭。王子也没发现自己闯了祸，就和朋友离开了。首相之子一路还在笑他没有射中那只鸟。
        - id: ch01-b02
          speaker: narrator
          text: 不久，商人进屋找妻子，原本只是想问她一点事情。谁知一进门，便看见妻子倒在房间中央，一动不动，像是已经死去。一支箭插在离她脑袋不到半码的地上。商人认定妻子遭人杀害，慌忙扑到窗前，朝外面放声呼喊。
        - id: ch01-b03
          speaker: merchant
          text: 有贼！快来人哪！他们杀了我的妻子！
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: 邻人很快聚了过来，仆人们也奔上楼，看看到底出了什么事。好在女人只是昏厥，胸前仅被箭擦出一点轻伤。她醒来以后，说有两个带弓箭的年轻人从屋外经过，其中一个趁她站在窗边，竟明目张胆地朝她放箭。商人听完立刻进宫，把事情从头到尾禀告国王。国王对这种胆大包天的恶行怒不可遏，发誓只要查出凶手便严惩不贷，又叫商人回去问妻子，再见那两个人时能不能认出来。
        - id: ch01-b05
          speaker: merchant_wife
          text: 我当然认得。就算他们混在全城百姓中间，我也能一眼找出来。
        - id: ch01-b06
          speaker: king
          text: 那么明天，我让全城男人都从你家门前经过。叫你妻子守在窗口，看清是谁无端害人。
        - id: ch01-b07
          speaker: narrator
          text: 王命很快传遍全城。第二天，凡是年满十岁的男子和男孩，全都列队走过商人家。王子和首相之子本来不用参加，却也混在人群中来看热闹。商人的妻子一见他们，马上认了出来。
        - id: ch01-b08
          speaker: king
          text: 一个是我的亲生儿子，一个是首相的儿子！他们给百姓作了什么榜样？把两个人都处死！
          emotion: angry
        - id: ch01-b09
          speaker: vizier
          text: 陛下，请先别下令。总要把前因后果查清楚。你们两个说，到底为什么做出这种残忍的事？
        - id: ch01-b10
          speaker: prince
          text: 我朝窗台上的鸟射箭，可惜射偏了，大概这才擦伤了商人的妻子。我根本不知道附近有人。要是知道，我绝不会放那一箭。
        - id: ch01-b11
          speaker: king
          text: 这件事容后再说。百姓已经没有必要留在这里，叫他们散去。
        - id: ch01-b12
          speaker: narrator
          text: 当晚，国王与首相为两个儿子的事郑重地谈了很久。国王仍坚持要把两人处死，首相却提出另一个办法，请他把王子逐出国境。两人反复商议，最后，国王答应了首相的主意。
        - id: ch01-b13
          speaker: narrator
          text: 次日清早，一队士兵押送王子出城。走到最后一道税关，首相之子飞奔着追来，还带来四匹驮着金币的马。他一把搂住王子的脖子。
        - id: ch01-b14
          speaker: vizier_son
          text: 我不能让你一个人走。我们一起长大，就一起流亡，哪怕死也死在一起。你若真把我当兄弟，就别赶我回去。
        - id: ch01-b15
          speaker: prince
          text: 你想清楚。前面也许全是磨难，你何必离开自己的家和国家，陪我去受苦？
        - id: ch01-b16
          speaker: vizier_son
          text: 因为我爱你。没有你，我永远不会快乐。
        - id: ch01-b17
          speaker: narrator
          text: 两位朋友便手牵着手，尽快赶向国境以外。士兵跟在后面，四匹马也驮着贵重的金币随行。到了王国边界，王子拿出一些金币分给士兵，命他们回去。士兵收下钱，走出不远便躲到岩石后面。他们暗中等了好一阵，直到确定王子绝不会折返，才真正离开。
    - id: ch02
      title: 湖中的仙女
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个流亡者走了又走，来到一座村庄，决定在村里一棵大树下过夜。王子生起火，把仅有的几件卧具铺好。首相之子则去找杂货商、面包师和屠夫，采买晚饭。也不知出了什么岔子，也许饼还没烤好，也许杂货商还没把香料配齐，他迟迟没有回来。王子足足等了半个小时，终于不耐烦了，便起身独自走动起来。
        - id: ch02-b02
          speaker: narrator
          text: 歇脚处不远有条清亮可爱的小溪。王子听说源头就在附近，便沿着溪水去找，来到一座美丽的湖泊。那时，湖面开满绚丽的莲花，还生着许多别的水草。王子坐在岸边，觉得口渴，便伸手掬水。幸好入口前，他先低头看了一眼，竟在掌心水面看见一位美丽仙女清清楚楚的全身倒影。第一次回头，他什么也没找到，于是喝掉手里的水，又掬起一捧。倒影再次出现。这回，他终于发现仙女正坐在湖对岸。王子只看了一眼，便爱得发狂，当场昏倒。
        - id: ch02-b03
          speaker: narrator
          text: 首相之子买食物回来，发现火已经生好，马匹牢牢拴着，几袋金币也整齐堆在一起，唯独王子没了踪影。他等了一会儿，又高声呼喊，却始终无人回答。走到溪边，他发现了朋友的脚印，便立刻折回去带上钱和马，循着足迹追到湖畔。王子躺在那里，仿佛已经死去。他急忙扶起王子，把水不断浇在他的头上和脸上。
        - id: ch02-b04
          speaker: vizier_son
          text: 兄弟，你这是怎么了？千万别死，别把我独自留下！快醒醒，跟我说句话！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 几分钟后，王子睁开眼睛，神色狂乱地四处看。
        - id: ch02-b06
          speaker: vizier_son
          text: 感谢上天，你总算醒了！兄弟，到底出了什么事？
          emotion: happy
        - id: ch02-b07
          speaker: prince
          text: 走开。我不想说话，也不想见你。你走吧。
        - id: ch02-b08
          speaker: vizier_son
          text: 我们先离开这里。我把吃的带来了，马匹和行李也都在。吃过饭，我们一起上路。
        - id: ch02-b09
          speaker: prince
          text: 你自己去。
        - id: ch02-b10
          speaker: vizier_son
          text: 我绝不走！刚才我们还亲如兄弟，怎么一转眼，你连看我一眼都不愿意了？究竟发生了什么？
        - id: ch02-b11
          speaker: prince
          text: 我见到了一位仙女。她发现我在看她，就用莲花瓣遮住脸。她美得让我无法移开眼睛。后来，她从怀里取出象牙盒，举给我看，我便昏了过去。你若能叫她嫁给我，从今以后，你带我去哪里都行。
        - id: ch02-b12
          speaker: vizier_son
          text: 兄弟，你见到的是仙女中的仙女。她正是象牙城的古丽扎尔。莲花瓣暗示她的名字，象牙盒则告诉我们她住在哪里。耐心等着吧，我一定替你促成这门婚事。
        - id: ch02-b13
          speaker: narrator
          text: 王子听了朋友这番肯定又鼓舞的话，心里终于好受起来。他从地上站起身，吃过首相之子带来的食物，恢复了精神，这才欢欢喜喜地和朋友一起离开湖畔，继续赶路。
        - id: ch02-b14
          speaker: narrator
          text: 路上，他们遇见两个男人。那两人来自一个强盗之家，全家一共十一口。大姐留在家中做饭，十个兄弟则两两结伴，在横穿这一带的四条道路上游荡。遇到无力反抗的旅人，他们当场抢劫。若对方太强，两个人对付不了，他们便客客气气地邀请旅人到家中过夜，再由全家一拥而上，夺走财物。强盗住在一座塔楼般的房子里，里面有好几间坚固的密室，楼下还有一座深坑，专门丢弃那些落入他们手中的可怜人的尸体。
        - id: ch02-b15
          speakers: [robber_1, robber_2]
          ensemble: duo
          text: 天已经晚了，几英里之内都没有别的村庄。二位不如到我们家里住一夜吧。
        - id: ch02-b16
          speaker: prince
          text: 兄弟，这两位好心相邀，我们答应吗？
        - id: ch02-b17
          speaker: narrator
          text: 首相之子微微皱眉，用神情表示自己并不赞成。可王子已经十分疲惫，只当朋友一时闹别扭，便向那两个男人道谢，接受了邀请。四个人一同来到强盗居住的塔楼。两个旅人进屋不久，房门便从外面锁死了。他们这才明白落入圈套，只能坐在那里哀叹自己的命运。
        - id: ch02-b18
          speaker: vizier_son
          text: 叹气救不了我们。我爬上窗口看看。啊，下面是条壕沟，外面还有高墙。我先跳下去探路，你留在这里等我回来。
        - id: ch02-b19
          speaker: narrator
          text: 不久，他回来告诉王子，自己见到一个奇丑的女人，大概是强盗家的管家。女人愿意放走他们，但王子必须娶她。她领着两人走到围墙暗门前。
        - id: ch02-b20
          speaker: vizier_son
          text: 我们的马和财物怎么办？
        - id: ch02-b21
          speaker: robber_woman
          text: 不能带。若走别的路，你们就是自己往坟墓里钻。
        - id: ch02-b22
          speaker: vizier_son
          text: 那就让它们也走暗门。我会一道咒，能叫马匹变瘦，也能让它们恢复原样。
        - id: ch02-b23
          speaker: narrator
          text: 首相之子趁别人没有察觉，偷偷牵来马匹。他念动咒语，把马变得薄如布片，一匹匹穿过狭窄的门洞，到了外面再恢复原样。接着，他翻身上马，手中还牵住另一匹马的笼头，又示意王子照着做。王子看准机会，带着那个女人策马追了上去。强盗听见疾驰的马蹄声，纷纷冲出来放箭。其中一箭射死了女人，两位朋友只得把她留在原地，继续向前奔驰。
    - id: ch03
      title: 象牙城的暗示
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人在一座村庄过夜，第二天一早又出发了。他们逢人便打听象牙城，终于来到这座闻名遐迩的城市。两人找到一个老妇人的小茅屋投宿。他们料想老妇人不会害人，住在这里可以安心。老妇人起先不愿收留陌生旅客。王子喝过她端来的水，却把一枚金币悄悄留在杯底，首相之子又送给她一枚。老妇人见了金币，马上改了主意，答应让两人住上几天。
        - id: ch03-b02
          speaker: narrator
          text: 做完家务，老妇人坐到房客身边。首相之子装作对这里一无所知。
        - id: ch03-b03
          speaker: vizier_son
          text: 这座城有名字吗？
        - id: ch03-b04
          speaker: old_woman
          text: 当然有，你这傻瓜！小村子尚且有名字，何况这样一座大城。
        - id: ch03-b05
          speaker: vizier_son
          text: 那它叫什么？
        - id: ch03-b06
          speaker: old_woman
          text: 象牙城。你连这个都不知道？我还以为全天下都听过呢。
        - id: ch03-b07
          speaker: narrator
          text: 王子听见“象牙城”，深深叹了一口气。首相之子用眼神提醒他，别泄露秘密，又接着套问。
        - id: ch03-b08
          speaker: vizier_son
          text: 这里有国王吗？
        - id: ch03-b09
          speaker: old_woman
          text: 当然有，还有王后和公主。
        - id: ch03-b10
          speaker: vizier_son
          text: 他们叫什么？
        - id: ch03-b11
          speaker: old_woman
          text: 公主名叫古丽扎尔，王后名叫——
        - id: ch03-b12
          speaker: narrator
          text: 老妇人正要说出王后的名字，首相之子却忽然转头看向王子，就这样打断了她的话。王子已经直瞪着眼，神情像发了疯。等老妇人不在跟前时，首相之子才告诉朋友，他们确实找对了国家，也找到了古丽扎尔的住处，一定能见到那位美丽的公主。
        - id: ch03-b13
          speaker: narrator
          text: 一天早晨，老妇人格外用心地梳好头发，又穿戴好头巾和衣裙。首相之子问她是不是有人要来。
        - id: ch03-b14
          speaker: old_woman
          text: 没人要来。
        - id: ch03-b15
          speaker: vizier_son
          text: 那你这是要去哪里？
        - id: ch03-b16
          speaker: old_woman
          text: 去看我女儿。她在古丽扎尔公主身边做侍女，我每天都去看她们。昨天要不是忙着照料你们，我早就去了。
        - id: ch03-b17
          speaker: vizier_son
          text: 那你可千万别在公主面前提起我们。
        - id: ch03-b18
          speaker: narrator
          text: 他故意这样叮嘱，因为料定越是不让老妇人说，她越会说出去。老妇人见到女儿，女儿故意装出生气的样子。
        - id: ch03-b19
          speaker: old_woman_daughter
          text: 你怎么整整两天没来？
        - id: ch03-b20
          speaker: old_woman
          text: 亲爱的，有两个年轻旅人住进了我的茅屋，一个是王子，一个是大首相的儿子。他们叫我从早忙到晚，不是做饭，就是打扫。其中一个还傻得厉害，连国家和国王叫什么都问。他们也不知从哪里来，不过身份尊贵，又很富有，每天早晚都各给我一枚金币。
        - id: ch03-b21
          speaker: narrator
          text: 老妇人随后又到公主面前，把差不多同样的话从头说了一遍。公主一听，狠狠打了她，还威胁说，若再敢在自己面前提起那两个陌生人，就要罚得更重。晚上，老妇人回到茅屋，满怀歉意地告诉首相之子，自己实在没忍住，破坏了不提他们的约定。她又把如何提到两人、如何挨公主责打的经过，一五一十说了出来。
        - id: ch03-b22
          speaker: prince
          text: 她光听见男人来了就这样生气，若是亲眼看见一个男人，那还得了！
        - id: ch03-b23
          speaker: vizier_son
          text: 生气？恰恰相反，她最想见的就是一个男人。她打老妇人，是在暗示你下一个黑月的半月里去见她。
        - id: ch03-b24
          speaker: prince
          text: 感谢上天！
          emotion: happy
        - id: ch03-b25
          speaker: narrator
          text: 老妇人再次进宫前，古丽扎尔早已定下计策。她吩咐一名侍女，等自己和老妇人说话时突然冲进房间。若老妇人追问，就谎称国王的大象全都发了狂，正在城里和集市上四处奔突，见什么毁什么。侍女依计行事。老妇人一听，生怕大象撞塌茅屋，害死王子和他的朋友，急忙恳求公主准她告辞。古丽扎尔便命人拿出一架施过魔法的秋千。人坐上去，只要心里想着目的地，秋千就会把人送到那里。
        - id: ch03-b26
          speaker: narrator
          text: 老妇人照公主说的坐进秋千，一心想着自己的茅屋。秋千立刻载着她飞上天空，又快又稳地把她送回家中。落地以后，她一眼看见两个房客平安无事，这才松了一口气。
        - id: ch03-b27
          speaker: old_woman
          text: 我还以为你们早被大象害死了！王家的大象正在到处乱跑。公主借我这架秋千赶回来。快出去吧，免得它们把屋子撞倒！
          emotion: fearful
        - id: ch03-b28
          speaker: vizier_son
          text: 别相信，那只是她们设下的骗局。她们在捉弄你。
        - id: ch03-b29
          speaker: vizier_son
          text: 兄弟，你的心愿很快会实现。这又是公主给你的暗示。
        - id: ch03-b30
          speaker: narrator
          text: 黑月的半月过去两天，两位朋友坐进魔法秋千，心中许愿前往王宫庭院。转眼间，他们便落在宫中。两人苦苦寻找的古丽扎尔就在一道宫门旁等候。她渴望见到王子的心，与王子渴望见到她一样迫切。啊，那真是一次无比幸福的相会。
        - id: ch03-b31
          speaker: gulizar
          text: 我终于见到你了，我的爱人，我的丈夫。
          emotion: happy
        - id: ch03-b32
          speaker: prince
          text: 万分感谢上天，让我来到你的身边。
          emotion: happy
        - id: ch03-b33
          speaker: narrator
          text: 王子和古丽扎尔当场向彼此许下婚约。随后，他们不得不暂时分别，一个乘秋千回到茅屋，一个仍留在王宫。虽然依依不舍，两个人心中却都充满欢喜，因为他们这一生还从未这样幸福过。
    - id: ch04
      title: 有毒的抓饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 此后，王子每天都进宫探望古丽扎尔，夜里仍回到茅屋。一天早晨，公主求他永远留下。她日夜担心王子遭遇不测，也许强盗会杀害他，也许疾病会袭击他，那样自己便永远失去了他。她实在不能忍受见不到王子。王子耐心告诉她，这些担心没有真正的缘由。他觉得自己夜里必须回到朋友身边。首相之子为了他离开故国，又一次次冒着生命危险。更何况，没有朋友相助，他根本不可能见到古丽扎尔。
        - id: ch04-b02
          speaker: narrator
          text: 古丽扎尔嘴上答应，心里却决定尽快除掉首相之子。几天后，她命侍女煮一锅抓饭，掺入毒药，饭一做好便盖紧锅盖，不许毒气散掉。她让仆人立即送去，并带上一句话。
        - id: ch04-b03
          speaker: maid
          text: 古丽扎尔公主以亡故叔父的名义，把这份供品送给您。
        - id: ch04-b04
          speaker: narrator
          text: 首相之子收到礼物，以为王子曾在公主面前满怀感激地说起自己，所以她才会如此惦念。他托来人向公主回礼问安，又表达了谢意。午饭时，他端着那锅抓饭来到溪边，准备在那里吃。他揭开锅盖，随手扔到草地上，然后去洗手。短短片刻，锅盖下面原本碧绿的青草竟全变黄了。他大吃一惊，怀疑饭里有毒，便抓起一点，扔给附近蹦跳的几只乌鸦。乌鸦刚吃下去，便一只只倒地死去。
        - id: ch04-b05
          speaker: vizier_son
          text: 感谢上天，在这一刻救我逃过死劫！
        - id: ch04-b06
          speaker: narrator
          text: 王子当天晚上从王宫回来，只见朋友一反常态，既沉默寡言，又满脸沮丧。他看出不对，便追问原因，还问首相之子是不是因为自己总待在王宫，心里才不高兴。首相之子从他的话里听出，王子对那锅抓饭毫不知情，这才把事情原原本本说出来。
        - id: ch04-b07
          speaker: vizier_son
          text: 看，这手帕里就是公主今早送来的抓饭。她说是以亡故叔父的名义送我，可饭里全是毒。幸亏上天让我及时发现。
        - id: ch04-b08
          speaker: prince
          text: 兄弟，谁会做出这样的事？你究竟和谁结了仇？
        - id: ch04-b09
          speaker: vizier_son
          text: 是古丽扎尔公主。下次去见她，你先带些雪，见面前放进双眼，催出眼泪。她问起，你就说朋友今早突然死了。再带上这瓶烈酒和这把铲子。请她喝酒，等她沉睡以后，把铲子烧热，在她背上留下印记。然后取走珍珠项链，带着铲子回来。只要照办，我就能让她的父王和满朝上下都接受这门婚事。你的前程和幸福，全在这个计策上。
        - id: ch04-b10
          speaker: narrator
          text: 王子答应照朋友的计策去做，也的确把每一件事都办成了。他带雪去见古丽扎尔，装作痛哭，请她喝下烈酒。等公主沉睡，他用烧热的铲子在她背上留下印记，又带走珍珠项链和铲子。第二天夜里，王子探望公主回来，便与朋友带着马匹和几袋金币，去了约一英里外的墓地。他们商定，由首相之子扮成苦行僧，王子扮成他的弟子和仆人。
        - id: ch04-b11
          speaker: narrator
          text: 第二天早晨，古丽扎尔恢复神志，只觉得后背一阵灼痛，又发现珍珠项链不见了。她立刻去见父王，只禀报项链失窃，却没有提背上的疼痛。国王听说有人偷了公主的项链，十分震怒，立即命人在全城和四周乡野发布告示，四处搜寻。
        - id: ch04-b12
          speaker: vizier_son
          text: 很好。兄弟，不用怕。你把项链带到集市，试着卖掉它。
        - id: ch04-b13
          speaker: narrator
          text: 王子拿着项链找到一个金匠。
        - id: ch04-b14
          speaker: goldsmith
          text: 这条项链，你要卖多少？
        - id: ch04-b15
          speaker: prince
          text: 五万卢比。
        - id: ch04-b16
          speaker: goldsmith
          text: 好，你在这里等着，我去取钱。
        - id: ch04-b17
          speaker: narrator
          text: 王子留在店中，等了又等。金匠终于回来时，手里没有带钱，身边却跟着警察总管。总管一看见那条项链，便以盗窃公主珠宝的罪名，当场把王子拘捕起来。
        - id: ch04-b18
          speaker: kotwal
          text: 说，这条项链从哪里来的？
        - id: ch04-b19
          speaker: prince
          text: 我的主人是一位苦行僧。他叫我把项链拿到集市卖掉。请准许我带你们去见他。
        - id: ch04-b20
          speaker: narrator
          text: 王子领着总管和差役来到墓地。首相之子闭着双眼，正在祈祷。等他祷告完，总管问起项链的来历。
        - id: ch04-b21
          speaker: vizier_son
          text: 把国王请来，我要亲口告诉陛下。
        - id: ch04-b22
          speaker: narrator
          text: 有人进宫，把苦行僧的话禀告国王。国王亲自赶到墓地。他见苦行僧祈祷时庄严虔诚，生怕贸然激怒对方，叫上天的惩罚落到自己头上。于是，他把双手合拢，摆出恳求的姿态，请苦行僧说出女儿项链的来历。
        - id: ch04-b23
          speaker: vizier_son
          text: 昨夜，我和弟子坐在这座坟旁敬拜真主。一个穿得像公主的食尸鬼忽然来到这里，挖出几天前下葬的尸体啃食。我气愤极了，就拿火上的铲子打她后背。她逃跑时，项链松脱掉了下来。陛下若不相信，只管检查公主的背，那里一定有烫伤。若果真如此，就把她送来，由我惩罚。
        - id: ch04-b24
          speaker: narrator
          text: 国王回宫，立即命人查看女儿的后背。
        - id: ch04-b25
          speaker: maid
          text: 确实有，烫伤就在她背上。
        - id: ch04-b26
          speaker: king
          text: 那就马上杀了她！
          emotion: angry
        - id: ch04-b27
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: 陛下，不可！还是把公主交给发现此事的苦行僧，由他处置吧。
        - id: ch04-b28
          speaker: narrator
          text: 国王接受了众人的劝告，不再命人当场杀死女儿。他下令把古丽扎尔交给那位揭穿食尸鬼的苦行僧，让对方自行处置。于是，宫中的人押着公主一路来到城外，把她送进了墓地。
        - id: ch04-b29
          speaker: vizier_son
          text: 把她关进笼子，放在她掘出尸体的那座坟旁。
    - id: ch05
      title: 墓地脱身
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 众人照办，很快便只剩苦行僧、他的弟子和公主留在墓地。夜色刚刚把昏暗的披风罩上四野，两位朋友就脱下伪装，牵着马匹，带着行李来到笼前。他们放出公主，在她背上的伤痕处仔细涂上药膏，再让她坐到王子身后的马背上。三人随即纵马离开，一路跑得又快又远。到了天明，他们才终于能在安全的地方停下来歇息，商量今后的打算。
        - id: ch05-b02
          speaker: narrator
          text: 首相之子拿出那份有毒的抓饭，问公主是否已经后悔自己的忘恩负义。古丽扎尔流着泪，承认他才是自己最大的恩人和朋友。
        - id: ch05-b03
          speaker: narrator
          text: 他们写信给故国的首相，把王子和首相之子离国以后经历的一切都讲清楚。首相读完来信，立刻进宫禀报国王。国王回信命两个流亡者暂时不要归国，而要另写一封信给古丽扎尔的父王，把所有事情如实相告。于是，首相之子逐句口述，王子亲手写下了那封信。
        - id: ch05-b04
          speaker: narrator
          text: 古丽扎尔的父王读过信，对手下的首相和其他官员大发雷霆。这样两位身份显赫的客人进入国中，他们竟然始终没有发现。而国王本来正一心想讨得王子和首相之子的欢心。盛怒之下，他定下一个日子，要处死其中几位首相，随后又亲自给首相之子写了回信。
        - id: ch05-b05
          speaker: king
          text: 请你们到王宫住下。只要王子愿意，我会尽快安排他和古丽扎尔成婚。
        - id: ch05-b06
          speaker: narrator
          text: 王子和首相之子欢欢喜喜地接受邀请，来到王宫，受到了国王极为隆重的迎接。王子和古丽扎尔的婚礼很快举行。又过了几个星期，国王赠给他们许多马匹、大象、珠宝与华贵衣料，吩咐他们启程返回故国。他相信，见到这一切以后，那里的国王如今一定会重新接纳自己的儿子。
        - id: ch05-b07
          speaker: narrator
          text: 出发前夜，那些等贵客一走便要遭处死的首相和官员，悄悄来见首相之子，苦苦恳求他向国王说情。为了保住性命，他们还答应每个人都把一个女儿嫁给他。首相之子答应了请求，果真去见国王，成功替这些人求得赦免。
    - id: ch06
      title: 荣归故国
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 王子带着美丽的新娘古丽扎尔，与首相之子一同踏上归途。一队士兵沿途护送，大群骆驼和马匹驮着数不清的珍宝。走到半路，他们又经过从前那座强盗的塔楼。王子一行借士兵之力攻下塔楼，把它彻底夷为平地，杀死里面所有的人，还夺走了强盗们多年来一点点积攒下的财宝。
        - id: ch06-b02
          speaker: narrator
          text: 漫长的旅程终于到了尽头，他们回到了自己的国家。国王亲眼见到儿子美丽的新娘，又看见那支气派非凡的随从队伍和满载财宝的牲畜，心里的怒气顿时消散。他立刻与王子和解，下令打开城门，让儿子进城定居。
        - id: ch06-b03
          speaker: narrator
          text: 从此以后，王子脚下的道路尽是阳光。他在宫廷和百姓中深受爱戴，成了人人喜爱的人。到了应有的时日，他继承父王的王位，治理这个国家许多年。那漫长的年月里，国中始终太平，王子也一直过着幸福的生活。
