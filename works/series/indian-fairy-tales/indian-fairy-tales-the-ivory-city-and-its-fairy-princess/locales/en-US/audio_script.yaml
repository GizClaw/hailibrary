  chapters:
    - id: ch01
      title: The Arrow at the Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, a young prince went out to practise archery with the son of his father's chief vizier. As the two friends passed a house, the prince saw a bird perched on the sill of an upper window. He raised his bow and aimed. There was no one in sight, and he had not the slightest idea that anyone was standing inside the room. If he had known, he would never have loosed an arrow in that direction. But he did loose it. The arrow missed the bird, flew through the window, and grazed the breast of a merchant's wife. Neither young man saw what had happened. They simply walked on, while the vizier's son laughed and teased the prince for missing the bird.
        - id: ch01-b02
          speaker: narrator
          text: >-
            A little later, the merchant came upstairs to ask his wife something. Instead, he found her stretched out in the middle of the room, looking quite dead. The arrow had struck the floor and stood fixed in the ground less than half a yard from her head. The merchant did not stop to examine her wound or see whether she breathed. Certain that she had been killed, he rushed straight to the open window and screamed into the street.
        - id: ch01-b03
          speaker: merchant
          text: Thieves! Thieves! They have killed my wife!
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: >-
            His cries brought the neighbours crowding around the house, while the servants came running up the stairs to discover what was wrong. Then they learned the truth. The merchant's wife was not dead at all. The shock had made her faint, and the arrow had done no more than graze her breast, leaving only a very slight wound. Before long, she opened her eyes and recovered her senses. Everyone wanted to know who had fired the arrow.
        - id: ch01-b05
          speaker: merchant_wife
          text: >-
            Two young men passed this house carrying bows and arrows. One of them stood there and deliberately aimed at me while I was at the window.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The merchant hurried to the palace and repeated her story to the king. His Majesty believed that someone had aimed at the woman on purpose. He was enraged by what seemed such bold and wicked behaviour, and he swore that, if the offender could be discovered, the most terrible punishment would fall upon him. First, however, the man had to be found. The king ordered the merchant to return home and ask whether his wife would recognize either young man if she saw him once more.
        - id: ch01-b07
          speaker: merchant_wife
          text: >-
            Oh, yes. I would know them among every person in the city.
        - id: ch01-b08
          speaker: king
          text: >-
            Then tomorrow, every man and boy in this city will pass before your house. Your wife will watch from the window and point out the man who committed this deed.
    - id: ch02
      title: The Prince Is Banished
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A royal proclamation carried the order through the city. The next day, every male inhabitant from ten years old upward had to assemble and march past the merchant's house. Men and boys filled the street while the merchant's wife watched from her upper window. The king's son and the vizier's son did not have to obey the order. By chance, though, they joined the company anyway. They wanted to see the tamasha, the great public spectacle. When the two friends reached the space beneath the merchant's window, the woman recognized them at once. Word was immediately carried to the king, who had watched the procession from its very beginning.
        - id: ch02-b02
          speaker: king
          text: >-
            My own son, and the son of my chief vizier! What kind of example is this for my people? They must both be executed.
          emotion: angry
        - id: ch02-b03
          speaker: vizier
          text: >-
            No, Your Majesty, I beg you. Let us first learn exactly what happened. Young men, why did you do such a cruel thing?
        - id: ch02-b04
          speaker: prince
          text: >-
            I shot at a bird on the sill of an open window, and I missed. The arrow must have struck the merchant's wife. If I had known anyone was nearby, I would never have fired that way.
        - id: ch02-b05
          speaker: king
          text: >-
            We will discuss this later. Send the people home. We have no further need of them.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Once the crowd had gone, the matter was put aside until evening. Then the king and his chief vizier sat together for a long, serious talk about the fate of their two sons. The king held fast to his first judgment. He wanted both young men put to death. The vizier pleaded against that punishment and proposed another course. Let the prince be driven out of the country instead. They argued over the matter until, at last, the king accepted the vizier's advice. The prince would not die, but he would lose his home and be sent into exile.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The decision was carried out the very next morning. A small company of soldiers led the prince through the city gates and along the road out of his father's kingdom. They had reached the final custom-house when hoofbeats sounded behind them. The vizier's son had ridden after the party as fast as he could. He had not come empty-handed. Four horses followed him, and each horse carried a bag filled with valuable gold muhrs. As soon as he reached the prince, he sprang forward and threw both arms around his friend's neck.
        - id: ch02-b08
          speaker: vizier_son
          text: >-
            I could not let you leave alone. We have lived together, so we will share this exile, and we will die together. If you love me, do not send me back.
        - id: ch02-b09
          speaker: prince
          text: >-
            Think about what you are doing. I may face every kind of hardship. Why should you abandon your home and your country for me?
        - id: ch02-b10
          speaker: vizier_son
          text: >-
            Because I love you, and without you I will never be happy.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The prince could not turn away such loyalty. So the two friends went on hand in hand, walking as quickly as they could to put the country behind them. The soldiers marched at their backs, and the four horses followed with their precious burdens. At last they reached a place right on the border of the king's lands. There the prince opened his money, gave some gold to the soldiers, and told them their duty was finished. They could return. The men took the coins and marched away, but they did not go far. They concealed themselves behind rocks and stones and watched the road. Only when they felt entirely sure that the banished prince did not mean to turn back did they finally start for home.
    - id: ch03
      title: The Fairy by the Lake
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The two exiles went on and on until they came to a village. They decided not to seek a house, but to spend the night beneath one of the great trees growing there. While the prince gathered what was needed for a fire and arranged the few articles of bedding they had brought, the vizier's son went into the village for supper. He had to visit the baniya, the baker, and the butcher before the meal was complete. For some reason, the errands took longer than expected. Perhaps the tsut had not yet been made ready. Perhaps the baniya had not finished preparing all his spices. Whatever the cause, half an hour passed with no sign of him. The prince became impatient. He rose from the resting-place and walked about to occupy himself.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Not far from the tree, a pretty little brook ran through the village. Its water was so clear that the prince stopped to look at it. Someone told him the brook began only a short distance away, and he decided to find its source. The stream led him to a beautiful lake. At that season its surface was covered with magnificent lotus flowers and many other water plants. The walk had made him thirsty, so he sat on the bank, bent down, and lifted some lake water in the hollow of his hand. Fortunately, before he brought it to his lips, he glanced into his palm. He expected to see nothing but water. Instead, to his utter astonishment, he saw the whole clear image of a beautiful fairy reflected there.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The prince spun around, hoping the real fairy must be standing behind him. No one was there. Puzzled, he drank the water and reached down for another handful. Once again, the beautiful face appeared in his palm. This time he searched more carefully. He looked across the flowers and around the whole edge of the water. At last he discovered her. A fairy was seated on the bank at the opposite side of the lake. The sight of her struck him with such force that he fell madly in love in that very moment. Then all sense left him, and he dropped to the ground in a swoon.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Meanwhile, the vizier's son came back with the food. The fire had been lighted. The horses were still securely tied, and the four bags of muhrs lay together in a heap. Yet there was no prince. He could not imagine why his friend would leave everything unattended. At first he waited, thinking the prince would soon return. Then he shouted his name, but no answer came. He searched until he reached the brook and noticed footprints beside it. They were his friend's. The vizier's son would not leave the money and horses behind, so he ran back, gathered them all, and brought them with him. Following the tracks beside the water, he reached the lake. There he found the prince lying motionless on the bank, looking every bit as dead as the merchant's wife had looked before.
        - id: ch03-b05
          speaker: vizier_son
          text: >-
            Alas, my brother! What has happened? Do not die and leave me like this. Please, speak! I cannot bear it!
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            He lifted the prince and poured water over his head and face. Within minutes, the prince opened his eyes and stared wildly around him.
        - id: ch03-b07
          speaker: vizier_son
          text: >-
            Thank God! Brother, tell me what is wrong.
        - id: ch03-b08
          speaker: prince
          text: >-
            Leave me. I do not want to speak to you or even see you. Just go.
        - id: ch03-b09
          speaker: vizier_son
          text: >-
            Come, we should leave this place. I brought food, and the horses are here with everything else. Let us eat and go.
        - id: ch03-b10
          speaker: prince
          text: Go without me.
        - id: ch03-b11
          speaker: vizier_son
          text: >-
            Never. What happened to turn you against me so suddenly? A short while ago we were brothers. Now you cannot bear to look at me.
        - id: ch03-b12
          speaker: prince
          text: >-
            I saw a fairy. I glimpsed her face for only a moment. When she noticed me watching, she hid it behind lotus petals. Oh, she was beautiful! Then she drew an ivory box from her clothes and held it up to me. That was when I fainted. If you can make that fairy my wife, I will go anywhere with you.
        - id: ch03-b13
          speaker: vizier_son
          text: >-
            Brother, you truly have seen a fairy among fairies. She can only be Gulizar of the Ivory City. Her signs tell me so. The lotus petals reveal her name, and the ivory box reveals her home. Be patient. You may trust me to arrange the marriage.
        - id: ch03-b14
          speaker: narrator
          text: >-
            These words comforted the prince. He rose, ate some food, and gladly continued the journey with his friend.
    - id: ch04
      title: The Robbers' Tower
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            On the road, they met two men from a family of eleven robbers. The eldest was a sister who stayed home and cooked. Her ten brothers travelled in pairs along the four roads nearby. They robbed travellers who could not resist them. Anyone too strong for two robbers was politely invited to their home, where the whole family attacked and stole everything. Their home was a tower with strong-rooms inside and a great pit below, where they threw their victims' bodies.
        - id: ch04-b02
          speakers: [robber_1, robber_2]
          ensemble: duo
          text: >-
            It is late, and the next village is miles away. Please, come spend the night at our house.
        - id: ch04-b03
          speaker: prince
          text: >-
            Brother, shall we accept these good men's invitation?
        - id: ch04-b04
          speaker: narrator
          text: >-
            The vizier's son frowned slightly to warn him against it. But the prince was tired and thought his friend was merely being difficult.
        - id: ch04-b05
          speaker: prince
          text: >-
            Very well. It is kind of you to invite us.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The four went to the robbers' tower. Soon the travellers sat grieving in a room whose door had been locked from outside.
        - id: ch04-b07
          speaker: vizier_son
          text: >-
            Groaning will not help us. I will climb to the window and look for a way out.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He reached the window-hole and looked below.
        - id: ch04-b09
          speaker: vizier_son
          text: >-
            Yes, there is a ditch below, with a high wall around it. I will jump down and search. Stay here until I return.
        - id: ch04-b10
          speaker: narrator
          text: >-
            When he came back, he said he had found a very ugly woman, whom he took to be the robbers' housekeeper. She had promised to free them if the prince would marry her. The woman then led them toward a secret door out of the enclosure.
        - id: ch04-b11
          speaker: vizier_son
          text: >-
            What about our horses and our goods?
        - id: ch04-b12
          speaker: robber_sister
          text: >-
            You cannot take them. If you try another way out, you will be walking straight into your grave.
        - id: ch04-b13
          speaker: vizier_son
          text: >-
            Then they will use this door too. I know a charm that can make them thin or fat.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Without anyone noticing, he fetched the horses. He spoke his charm, and they slipped through the narrow doorway as flat as pieces of cloth. Outside, he restored them to their proper shape. He mounted, caught the halter of another horse, and signalled the prince to do the same. The prince seized his chance and rode after him with the woman seated behind.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The robbers heard the horses galloping away. They ran out and fired arrows after the fugitives. One arrow killed the woman, so the friends had to leave her behind.
    - id: ch05
      title: The Hut in Ivory City
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            They rode on until they reached a village and stopped there for the night. In the morning they set off again, asking every passer-by the way to Ivory City. At last they arrived at the famous place. They chose to lodge in a little hut owned by an old woman, for they expected no danger from her and thought they could live there quietly.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At first, the old woman disliked the thought of strangers staying in her home. Then the prince dropped a gold muhr into the bottom of the cup from which he had drunk. The vizier's son gave her another. Her opinion changed at once, and she agreed to keep them for several days.
        - id: ch05-b03
          speaker: narrator
          text: >-
            When her work was done, the old woman sat with her lodgers. The vizier's son pretended he knew nothing about the place or its people.
        - id: ch05-b04
          speaker: vizier_son
          text: Does this city have a name?
        - id: ch05-b05
          speaker: old_woman
          text: >-
            Of course it does, you stupid boy. Every tiny village has a name, never mind a city like this one.
        - id: ch05-b06
          speaker: vizier_son
          text: Then what is it called?
        - id: ch05-b07
          speaker: old_woman
          text: >-
            Ivory City! How can you not know that? I thought its name was famous throughout the world.
        - id: ch05-b08
          speaker: narrator
          text: >-
            At the words Ivory City, the prince gave a deep sigh. His friend shot him a look that plainly warned him to be quiet or betray their secret.
        - id: ch05-b09
          speaker: vizier_son
          text: Does this country have a king?
        - id: ch05-b10
          speaker: old_woman
          text: >-
            Naturally. It has a king, a queen, and a princess too.
        - id: ch05-b11
          speaker: vizier_son
          text: What are their names?
        - id: ch05-b12
          speaker: old_woman
          text: >-
            The princess is called Gulizar, and the queen is called—
        - id: ch05-b13
          speaker: narrator
          text: >-
            The vizier's son cut her off by turning toward the prince, who was staring like a madman. Later, when they were alone, he spoke to his friend.
        - id: ch05-b14
          speaker: vizier_son
          text: >-
            Yes, this is the right country. We will see the beautiful princess.
    - id: ch06
      title: The Old Woman's Promise
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            One morning, the travellers saw the old woman dressing with unusual care. She arranged her hair precisely and paid close attention to the way her kasabah and puts were set.
        - id: ch06-b02
          speaker: vizier_son
          text: Who is coming to visit?
        - id: ch06-b03
          speaker: old_woman
          text: Nobody.
        - id: ch06-b04
          speaker: vizier_son
          text: Then where are you going?
        - id: ch06-b05
          speaker: old_woman
          text: >-
            I am going to see my daughter. She serves Princess Gulizar, and I visit them both every day. I would have gone yesterday if you two had not taken up all my time.
        - id: ch06-b06
          speaker: vizier_son
          text: >-
            Ah, then be very careful. Do not mention us where the princess can hear you.
        - id: ch06-b07
          speaker: narrator
          text: >-
            He asked her to keep silent because he hoped the order would make her do exactly the opposite. Then the princess would hear that they had arrived.
        - id: ch06-b08
          speaker: old_woman_daughter
          text: >-
            Why have you stayed away for two whole days?
          emotion: angry
        - id: ch06-b09
          speaker: old_woman
          text: >-
            My dear, two young travellers have moved into my hut. One is a prince, and the other is the son of some great vizier. They demand so much attention that I spend the whole day cooking and cleaning, then cleaning and cooking. I cannot understand them. One, especially, seems very stupid. He asked the name of this country and even the king's name. Where could they have come from if they know none of that? Still, they are important men, and very rich. Each gives me a muhr every morning and another every evening.
        - id: ch06-b10
          speaker: narrator
          text: >-
            After telling her daughter, the old woman went to the princess and repeated almost the same story. Princess Gulizar beat her severely for speaking about the strangers. She threatened an even harsher punishment if the old woman ever mentioned them before her again.
    - id: ch07
      title: The Princess and the Homecoming
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            That evening, the old woman returned to her hut. She confessed to the vizier's son that she had broken her promise, and told him how the princess had struck her for talking about the two travellers and their arrival. The prince listened eagerly to every word.
        - id: ch07-b02
          speaker: prince
          text: >-
            Alas! If the mere mention of us made her so angry, what will she do when she actually sees a man?
        - id: ch07-b03
          speaker: vizier_son
          text: >-
            Angry? No. There is one man she would be exceedingly glad to see. Her treatment of the old woman tells me exactly what she wants. You are to visit her during the coming dark fortnight.
        - id: ch07-b04
          speaker: prince
          text: Heaven be praised!
          emotion: happy
        - id: ch07-b05
          speaker: narrator
          text: >-
            On the old woman's next visit, Gulizar had a servant burst into the room with a warning. The king's elephants, she said, had gone mad. They were charging through the city and bazaar, destroying everything in their path. The old woman feared they would knock down her hut and kill her lodgers, so she begged to leave. Gulizar had a charmed swing that could carry its rider wherever that person wished to go. She ordered a servant to bring it and told the old woman to sit in it and wish herself home.
        - id: ch07-b06
          speaker: narrator
          text: >-
            The swing carried the old woman swiftly and safely through the air. In an instant she was back at her hut, where both young men were safe.
        - id: ch07-b07
          speaker: old_woman
          text: >-
            Oh, I was sure you would both be dead by now! The royal elephants are loose and running wild. I was so afraid for you that the princess sent me home in this enchanted swing. Come outside quickly, before the elephants reach us and smash the hut!
          emotion: fearful
        - id: ch07-b08
          speaker: vizier_son
          text: >-
            Do not believe it. The whole thing is a trick they played on you.
        - id: ch07-b09
          speaker: narrator
          text: The vizier's son drew the prince aside and whispered to him.
        - id: ch07-b10
          speaker: vizier_son
          text: >-
            Your heart's desire is close now. These are signs.
        - id: ch07-b11
          speaker: narrator
          text: >-
            When two days of the dark fortnight had passed, the prince and the vizier's son sat in the swing and wished themselves inside the palace grounds. A moment later, they stood there. Gulizar was waiting by one of the palace gates, longing to see the prince just as deeply as he longed to see her. Their meeting was full of joy.
        - id: ch07-b12
          speaker: gulizar
          text: >-
            At last I have seen the man I love, the man who will be my husband.
          emotion: happy
        - id: ch07-b13
          speaker: prince
          text: >-
            A thousand thanks to Heaven for bringing me to you.
          emotion: happy
        - id: ch07-b14
          speaker: narrator
          text: >-
            The prince and Gulizar promised themselves to each other. Then they parted, one returning to the hut and the other to the palace. Neither had ever felt so happy.
        - id: ch07-b15
          speaker: narrator
          text: >-
            From then on, the prince visited Gulizar each day and went back to the hut each night. One morning, she begged him to remain with her forever. She was always afraid that robbers might kill him or sickness might carry him away. She could not bear the thought of losing him.
        - id: ch07-b16
          speaker: prince
          text: >-
            There is no true reason to fear for me. I must return to my friend at night. He left his home and country for my sake, and he has risked his life for me. Without his help, I would never have found you.
        - id: ch07-b17
          speaker: narrator
          text: >-
            Gulizar agreed for the moment, but secretly decided to be rid of the vizier's son. A few days later, she told a maid to cook a pilaw with poison mixed into it. The maid was to cover the pan the instant it was ready, so none of the poisonous steam could escape. Gulizar sent the covered dish to the vizier's son with a message.
        - id: ch07-b18
          speaker: princess_servant
          text: >-
            Princess Gulizar sends you this offering in the name of her dead uncle.
        - id: ch07-b19
          speaker: narrator
          text: >-
            The vizier's son thought the prince must have praised him to Gulizar and that she had remembered him kindly. He sent back his greetings and thanks. At dinner, he carried the pilaw to the stream. He set the lid on the grass and washed his hands. In that brief time, the green grass beneath the lid turned yellow. Suspecting poison, he threw a little rice to some nearby crows. The moment they ate it, they fell dead.
        - id: ch07-b20
          speaker: vizier_son
          text: >-
            Heaven be praised for saving me from death today!
        - id: ch07-b21
          speaker: narrator
          text: >-
            That evening, the prince found his friend silent and downcast. He asked whether the long hours at the palace had caused it. Then the vizier's son understood that the prince knew nothing about the dish, so he explained what had happened and showed him some pilaw wrapped in a handkerchief.
        - id: ch07-b22
          speaker: vizier_son
          text: >-
            Look at this. The princess sent me this pilaw in her dead uncle's name, and it is filled with poison. Thank Heaven I discovered it before I ate.
        - id: ch07-b23
          speaker: prince
          text: >-
            Brother, who could have done such a thing? Who could possibly hate you?
          emotion: surprised
        - id: ch07-b24
          speaker: vizier_son
          text: >-
            Princess Gulizar did it. Listen carefully. Next time you visit her, take some snow. Just before you see her, put a little in both eyes to bring tears. When she asks why you are crying, say your friend died suddenly that morning. Take this strong wine and this shovel too. After you have pretended to grieve, ask her to drink the wine. It will put her into a deep sleep. Heat the shovel, mark her back with it, and take her pearl necklace. Bring the shovel and necklace back to me. Do not be afraid. If you follow these instructions, I can make her father and the whole court accept your marriage.
        - id: ch07-b25
          speaker: narrator
          text: >-
            The prince promised to do everything exactly as his friend had advised, and he kept that promise.
        - id: ch07-b26
          speaker: narrator
          text: >-
            The next night, after the prince returned from Gulizar, the two friends took their horses and bags of muhrs to a graveyard about a mile away. The vizier's son dressed as a fakir, and the prince became his disciple and servant.
        - id: ch07-b27
          speaker: narrator
          text: >-
            When Gulizar woke the following morning, her back stung and her pearl necklace was gone. She reported the stolen necklace to her father but said nothing about the pain. The king angrily ordered a proclamation throughout the city and nearby country.
        - id: ch07-b28
          speaker: vizier_son
          text: >-
            Good. There is nothing to fear. Take the necklace into the bazaar and offer it for sale.
        - id: ch07-b29
          speaker: narrator
          text: The prince carried the necklace to a goldsmith.
        - id: ch07-b30
          speaker: goldsmith
          text: How much do you want for it?
        - id: ch07-b31
          speaker: prince
          text: Fifty thousand rupees.
        - id: ch07-b32
          speaker: goldsmith
          text: Very well. Wait here while I fetch the money.
        - id: ch07-b33
          speaker: narrator
          text: >-
            The prince waited a long time. At last the goldsmith returned with the kotwal, who arrested the prince for stealing the princess's necklace.
        - id: ch07-b34
          speaker: kotwal
          text: Where did you get this necklace?
        - id: ch07-b35
          speaker: prince
          text: >-
            A fakir gave it to me to sell. I am his servant. Let me show you where he is.
        - id: ch07-b36
          speaker: narrator
          text: >-
            The prince led the kotwal and a policeman to the graveyard. They found the disguised vizier's son sitting with closed eyes in prayer. When he finished, the kotwal asked how the princess's necklace had come into his hands.
        - id: ch07-b37
          speaker: vizier_son
          text: >-
            Bring the king here, and I will tell him face to face.
        - id: ch07-b38
          speaker: narrator
          text: >-
            Messengers carried the answer to the king. He came to the graveyard and saw the fakir deep in solemn devotion. Afraid that Heaven might punish him if he angered such a holy man, the king folded his hands and spoke humbly.
        - id: ch07-b39
          speaker: ivory_king
          text: How did you come by my daughter's necklace?
        - id: ch07-b40
          speaker: vizier_son
          text: >-
            Last night, my disciple and I were worshipping Khuda beside this tomb. A ghoul dressed like a princess came here, dug up a body buried only days ago, and began to eat it. I grew angry. A shovel lay heating in the fire, so I struck her back with it. As she fled, her necklace came loose and fell. You can test every word. Examine your daughter's back, and you will find the burn. If the mark is there, send her to me for punishment.
        - id: ch07-b41
          speaker: narrator
          text: >-
            The king returned to the palace and ordered a maid to examine Gulizar's back.
        - id: ch07-b42
          speaker: princess_servant
          text: The fakir spoke the truth. The burn is there.
        - id: ch07-b43
          speaker: ivory_king
          text: Then kill the girl at once!
          emotion: angry
        - id: ch07-b44
          speakers: [palace_attendant_1, palace_attendant_2]
          ensemble: duo
          text: >-
            No, Your Majesty. Send her to the fakir who discovered her, and let him decide her punishment.
        - id: ch07-b45
          speaker: narrator
          text: >-
            The king agreed, and Gulizar was taken to the graveyard.
        - id: ch07-b46
          speaker: vizier_son
          text: >-
            Lock her in a cage beside the grave where she took out the body.
        - id: ch07-b47
          speaker: narrator
          text: >-
            The order was obeyed. Soon the fakir, his disciple, and the princess were alone. Not long after darkness covered the graveyard, the friends threw off their disguises and brought their horses and luggage to the cage. They freed Gulizar, rubbed ointment over the marks on her back, and seated her behind the prince. Then they rode hard through the night. By morning they were safe enough to stop and decide what to do next.
        - id: ch07-b48
          speaker: narrator
          text: >-
            The vizier's son showed Gulizar some of the poisoned pilaw and asked whether she now regretted her ingratitude. Gulizar wept. She admitted that he was her greatest helper and friend.
        - id: ch07-b49
          speaker: narrator
          text: >-
            The friends sent a letter to the chief vizier, telling him everything that had happened since they left their country. After reading it, he went straight to the king and told him the news. The king sent an answer to the two exiles, but he did not allow them to come home yet. Instead, they were to write to Gulizar's father and explain the whole affair. They obeyed. The prince held the pen while the vizier's son told him what to say.
        - id: ch07-b50
          speaker: narrator
          text: >-
            When Gulizar's father read the letter, he was furious with his viziers and other officials. These distinguished visitors had lived in his country, yet none of them had discovered it. The king had been especially anxious to win the favor of the prince and the vizier's son. In his anger, he ordered several viziers to be executed on a certain day. Then he wrote back to the exiles himself.
        - id: ch07-b51
          speaker: ivory_king
          text: >-
            Come and stay in my palace. If the prince still wishes it, I will arrange his marriage to Gulizar without delay.
        - id: ch07-b52
          speaker: narrator
          text: >-
            The prince and the vizier's son gladly accepted the invitation and came to stay at the palace. The king welcomed them with great honor, and the marriage of the prince and Gulizar soon took place. Several weeks later, he prepared them for the journey home. He gave them horses and elephants, jewels and costly cloth, and told them it was time to leave. After all that had happened, he felt sure the prince's father would receive them kindly.
        - id: ch07-b53
          speaker: narrator
          text: >-
            On the night before their departure, the viziers and other officials who were to be executed after the visitors left came to plead with the vizier's son. Each man promised to give him a daughter in marriage if he would speak to the king for them. He agreed to help. His plea succeeded, and the king pardoned them all.
        - id: ch07-b54
          speaker: narrator
          text: >-
            Then the prince set out for his own land with his beautiful bride, Gulizar, and the faithful vizier's son. A troop of soldiers travelled with them, while a great number of camels and horses carried their treasure. In the middle of the journey, they came again to the robbers' tower. This time they had soldiers at their side. Together they pulled the tower to the ground, killed everyone inside, and seized the riches the robbers had been gathering there for many years.
        - id: ch07-b55
          speaker: narrator
          text: >-
            At last they reached their own country. When the king saw his son's beautiful wife and magnificent company, his anger vanished. He welcomed the prince back into the city and gave him a home there.
        - id: ch07-b56
          speaker: narrator
          text: >-
            From that time on, sunshine lay across the prince's path. He became greatly beloved. In due course he succeeded to the throne, and for many, many years he ruled his country in peace and happiness.
