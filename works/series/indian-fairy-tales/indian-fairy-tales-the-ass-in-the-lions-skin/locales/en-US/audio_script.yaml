audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    future_buddha:
      display_name: The Future Buddha
      tts:
        delivery: perceptive and composed
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    hawker:
      display_name: Hawker
      tts:
        delivery: practical and rueful
        timbre: earthy and clear
        pace: measured
        pitch: medium-low
    ass:
      display_name: Ass
      tts:
        delivery: startled and unguarded
        timbre: rough and nasal
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Lion's Skin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, while Brahma-datta ruled in Benares, the future Buddha was born into a peasant family. When he grew up, he made his living by farming the land.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In those days, a hawker traveled from place to place with his goods loaded on an ass. Whenever he stopped and lifted the pack from the animal's back, he covered the ass with a lion's skin. Then he let him loose among the rice and barley. The field watchmen saw what looked like a lion, and none of them dared come near.
    - id: ch02
      title: The Villagers Gather
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, the hawker stopped at a village. While his breakfast was being cooked, he dressed the ass in the lion's skin and turned him into a barley field.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Once again, the watchmen were too frightened to approach. They hurried home and spread the news. Soon all the villagers came out carrying weapons. They blew their chanks, beat their drums, moved toward the field, and shouted.
    - id: ch03
      title: The Ass Gives Himself Away
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The ass thought he was about to die. Terror overcame him, and he let out his own cry.
        - id: ch03-b02
          speaker: ass
          text: Hee-haw! Hee-haw!
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: >-
            It was the bray of an ass. As soon as the future Buddha heard it, he knew the creature was no lion. Then he spoke this verse.
        - id: ch03-b04
          speaker: future_buddha
          text: >-
            That is no lion roaring. It is no tiger or panther. A wretched ass is dressed in a lion's skin, and the sound he makes is still an ass's bray.
    - id: ch04
      title: The End of the Disguise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Now the villagers knew what the creature really was. They beat the ass until his bones broke, took away the lion's skin, and left him there.
        - id: ch04-b02
          speaker: narrator
          text: >-
            When the hawker returned, he found the ass lying in a terrible state. At the sight of him, the hawker spoke another verse.
        - id: ch04-b03
          speaker: hawker
          text: >-
            Wearing that lion's skin, you might have gone on eating green barley for a long time. But you brayed, and in that very moment you brought yourself to ruin.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Before the hawker had even finished speaking, the ass died there on the spot.
