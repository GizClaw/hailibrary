audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    friend:
      display_name: 老人的朋友
      tts:
        delivery: 体贴而机敏，说话胸有成竹
        timbre: 温厚沉稳
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 分尽家产
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位家财万贯的老人，以为自己快要离开人世了。他把几个儿子叫来，将家产分给了他们。可老人并没有死，此后又活了好几年，而这几年大多苦不堪言。
        - id: ch01-b02
          speaker: narrator
          text: 年老体衰已经够折磨人，那几个儿子偏偏还虐待父亲，处处给他苦头吃。真是一群自私又忘恩负义的东西！以前，他们为了多分些钱，个个抢着讨父亲欢心。如今遗产已经拿到手，父亲越早离世，他们越高兴。在他们眼里，老人活着只会添麻烦、费钱。他们连这份心思都不肯遮掩，让可怜的父亲看得明明白白。
    - id: ch02
      title: 四只袋子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，老人遇到一位朋友，就把自己的苦楚全说了出来。朋友很同情他，答应想个办法，过些日子再来。几天后，朋友果然登门，还带来四只装满石块和砂砾的袋子，放在老人面前。
        - id: ch02-b02
          speaker: friend
          text: 听我说，老朋友。你儿子们知道我今天来过，一定会追问。你就说，我欠了你许多年的债，今天特地来还。这样，他们会以为你平白多了几千卢比。
        - id: ch02-b03
          speaker: friend
          text: 这些袋子一定要由你亲自保管。只要你还活着，无论如何都不能让儿子们拿到。很快你就会看到，他们待你的样子全变了。再会吧，过些日子我再来看看你过得如何。
    - id: ch03
      title: 袋中的财富
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 几个年轻人听说父亲又添了这么一大笔钱，马上比从前更加殷勤，想尽办法讨他欢心。就这样，他们一直侍奉父亲，直到老人去世。
        - id: ch03-b02
          speaker: narrator
          text: 老人刚一咽气，儿子们就贪婪地打开那四只袋子。可是里面哪有什么财富，装的只有石块和砂砾！
