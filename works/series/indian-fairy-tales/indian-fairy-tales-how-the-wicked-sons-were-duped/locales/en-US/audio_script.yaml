audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    friend:
      display_name: Friend
      tts:
        delivery: sympathetic and shrewd
        timbre: warm and steady
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Bitter Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A very wealthy old man believed he was close to death. He called for his sons and divided all his property among them. But he did not die. He lived on for several more years, and they were miserable years.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Old age had already made him weary. Now he also had to endure his sons' cruelty and abuse. Before they got their inheritance, each son had tried harder than the others to please him, hoping for a larger share.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once the money was theirs, they no longer cared how soon their father died. The sooner the better, they thought, for now he seemed like nothing but trouble and expense. They made sure the poor old man knew exactly how they felt.
    - id: ch02
      title: A Friend's Advice
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, the old man met a friend and told him about all his troubles. His friend felt deeply sorry for him. He promised to think the matter over and return soon with some advice.
        - id: ch02-b02
          speaker: narrator
          text: >-
            A few days later, the friend came back. He set four bags in front of the old man. They were filled with stones and gravel.
        - id: ch02-b03
          speaker: friend
          text: >-
            Listen, my friend. Your sons will hear that I came today, and they will ask why. Tell them I was paying back an old debt. Let them believe you have several thousand more rupees than you knew about.
        - id: ch02-b04
          speaker: friend
          text: >-
            Keep these bags in your own hands. As long as you live, do not let your sons get near them. You will soon see their behavior change. Salaam. I will come back before long and see how you are doing.
    - id: ch03
      title: The Hidden Fortune
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The young men soon heard that their father's wealth had grown. At once, they became more attentive and tried harder than ever to please him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            From that day on, they kept treating him well. They continued right up to the day the old man died.
    - id: ch04
      title: Stones and Gravel
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After their father's death, the sons eagerly opened the four bags. Inside, they found no rupees at all. There were only stones and gravel.
