  chapters:
    - id: ch01
      title: Preface
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            This year, we travel from one far end of the Indo-European world to the other. We leave the soft rain and green turf of the Gaelic lands and enter the bright sun and dry soil of India. In Ireland, belief in fairies, gnomes, ogres, and monsters has almost died away. In India, it still lives with all the strength of a world where spirits fill nature.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Lands differ, and so do the people who live in them. Yet their fairy tales often share the same plots and events, even when they are told in different ways. Most of the tales in this book have also been known in the West in one form or another. So how did the same stories come to exist at the farthest edges of both East and West? Scholars including Benfey in Germany, Monsieur Cosquin in France, and Mister Clouston in England have said that India is the home of the fairy tale. In their view, European tales were carried from India by Crusaders, Mongol missionaries, Gypsies, Jews, traders, and travelers. The question has not been settled, so anyone discussing it can only argue one side of the case. Within limits, I am ready to argue for India. More than a third of the fairy stories shared by the children of Europe seem to have come from there. Most of all, many comic tales and jingles can be followed back to the Indian peninsula without much trouble.
        - id: ch01-b03
          speaker: narrator
          text: >-
            There is certainly plenty of evidence that many comic tales and folk tales traveled from India through books around the time of the Crusades. During the Middle Ages, several collections became extremely popular in Europe. They were known as The Fables of Bidpai, The Seven Wise Masters, Gesta Romanorum, and Barlaam and Josaphat. Their stories found their way into the examples used by preaching monks. They also entered the Italian novelle, and much later gave their share to Elizabethan drama. Perhaps almost one tenth of the chief events found in European folk tales can be traced to this source.
        - id: ch01-b04
          speaker: narrator
          text: >-
            One kind of folk tale, the fable or animal comedy, even gives us signs of an earlier meeting between the literature of Europe and India. After studying the question at some length, I concluded that quite a few fables credited to Aesop, the slave from Samos, came from India. They probably came from the same source as tales used in the Jatakas, the stories of the Buddha's earlier births. I set out that discussion in “History of the Aesopic Fable,” the introductory volume to my edition of Caxton's Fables of Esope, published in London by Nutt in 1889.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Jatakas preserve a great many genuine folk tales from early India. Together, they form the oldest collection of folk tales in the world. You might call them an Indian Grimm, gathered more than two thousand years before the good German brothers went among ordinary people in search of stories, with such delightful results. That is why I have included so many Jatakas in this book. These tales have made devout Buddhists laugh and wonder for two thousand years, and I would be surprised if they could not do the same for English children. The Jatakas have also been fortunate in their English translators, who tell them with strength and spirit. I am delighted to publish two newly translated Jatakas in this volume. Mister W. H. D. Rouse of Christ's College, Cambridge, kindly translated them into English for the book. In one of the two, I believe I have found the source of the Tar Baby incident in Uncle Remus.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Indian fairy tales may be the oldest we have, but in another sense they are also the youngest. The modern work of collecting them began only about twenty-five years ago, when Miss Frere published her charming Old Deccan Days. It appeared in London through John Murray in 1868, and reached a fourth edition in 1889. Others followed her example. They included Miss Stokes, Mrs. Steel, Captain Temple, who is now Major Temple, Pandit Natesa Sastri, Mister Knowles, and Mister Campbell. Still more collectors published folk tales in journals such as the Indian Antiquary and The Orientalist. Over the last quarter century, they have drawn deeply from modern India's store of stories. But the country is so vast that there is room for any number of new collectors and collections. Even in the material already gathered, researchers have found many of the events most familiar from European folk tales. We have hardly any sure way to decide whether those tales were carried into India or first arose there. Still, some remain alive among Indian storytellers and can be traced back for more than a thousand years. That makes an Indian origin more likely.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I chose the stories in this volume from all those sources, from the Jatakas and the Bidpai tales to the newer collections. I selected the ones that shed the most light on where fables and folk tales came from, while also being most likely to appeal to English children. I did not include too many stories of the types collected by the Grimms, because I did not want to repeat the contents of the two earlier books in this series. That choice has made the case for India in this book somewhat weaker. Writing for young readers also limited what I could take from Somadeva's wonderfully named Ocean of the Streams of Story, the Katha-Sarit Sagara. For tales preserved in Pali and Sanskrit, I worked from translations. Most came from Benfey's German or from the lively English of Professor Rhys-Davids, whom I thank for allowing me to use his versions of the Jatakas.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The generosity of the first collectors and their publishers has allowed me to make this a representative collection of the fairy tales of India. I owe special thanks to Miss Frere. She kindly made an exception for me and let me use the fine story “Punchkin” and the curious myth “How Sun, Moon, and Wind Went Out to Dinner.” Miss Stokes was just as gracious in allowing me to choose characteristic pieces from her Indian Fairy Tales. Major Temple let me select from his excellent Wideawake Stories. Messrs. Kegan Paul, Trench and Company permitted me to use Mister Knowles's Folk-Tales of Kashmir from their Oriental Library. Messrs. W. H. Allen were equally helpful with Mrs. Kingscote's Tales of the Sun. And Mister M. L. Dames added something new to India's published store of stories by letting me use a tale from his unpublished collection of Baluchi folk tales.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Once again, I have reason to be pleased that my friend Mister J. D. Batten has worked with me. He has given beautiful or amusing shapes to the creations of Indian folk imagination. It is no small achievement to embody both the enchantment and the humor of the Celt and of the Indian. This only offers one more proof that fairy tales are more than Celtic or Indian. They are human.
        - id: ch01-b10
          speaker: narrator
          text: I am Joseph Jacobs.
