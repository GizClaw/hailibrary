audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
  chapters:
    - id: ch01
      title: 从极西到极东
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            今年，我们要从印欧世界最西边走到最东边。离开盖尔人的土地，告别绵绵细雨和青青草地，去往印度，迎着耀眼的烈日，踏上干燥的泥土。在爱尔兰，仙子、地精、食人魔和怪物的信仰快要消失了。可是在印度，这些信仰仍充满生机，万物有灵的古老观念也依旧兴盛。
        - id: ch01-b02
          speaker: narrator
          text: |-
            土地不同，民族的性情也不同。不过，各地童话的讲法虽有差别，情节和事件却常常相同。这本书收录的故事，大部分也以某种形式在西方出现过。那么，远隔万里的东方和西方，为什么会同时流传着这些故事呢？德国的本费、法国的科斯坎先生，还有英国的克劳斯顿先生，都给出同一个答案。他们认为，印度就是童话的故乡。欧洲所有的童话，都是十字军、蒙古传教士、吉卜赛人、犹太人、商贩和旅人从印度带回去的。
        - id: ch01-b03
          speaker: narrator
          text: |-
            这桩公案还没有定论，我们只能各自站在一边，像辩护人那样陈述理由。按照我掌握的材料，在一定范围内，我愿意为印度辩护。欧洲孩子共同拥有的童话，占全部童话的三分之一以上，而这些故事都源自印度。尤其是大多数诙谐故事、滑稽小品和顺口溜，要追溯到印度半岛，并不太难。
    - id: ch02
      title: 故事怎样传到西方
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            大约在十字军东征的时候，相当多的印度诙谐故事和民间故事，确实已经通过文字传到欧洲，这一点有充分的证据。中世纪时，有几部故事集在欧洲非常流行，书名是《毕德帕寓言》《七贤人》《罗马人事迹》和《巴兰与约沙法》。里面的故事走上了两条路。一条路通向修士传教时所用的《训诫故事》，另一条路通向意大利的短篇小说。许多年过去，它们又为伊丽莎白时代的戏剧提供了不少材料。欧洲民间故事的主要情节，或许有将近十分之一，都能顺着这条路找到源头。
        - id: ch02-b02
          speaker: narrator
          text: |-
            在寓言和动物笑话这一类民间故事中，欧洲与印度的文字接触，似乎还要更早。我详细考证过这个问题，最后认为，许多托名于萨摩斯奴隶伊索的寓言，其实来自印度。它们很可能还有一个共同的源头，而《本生经》也采用了从那里流传下来的同类故事。《本生经》讲的是佛陀前世的生涯，里面保存着许多真正的早期印度民间故事。它是世界上最早的民间故事集，简直就是一部印度的《格林童话》。两千多年以后，善良的格林兄弟才走进民间，开始搜寻故事，并取得了令人欣喜的成果。
        - id: ch02-b03
          speaker: narrator
          text: |-
            所以，我在本书里选入了不少《本生经》故事。过去两千年间，它们曾让虔诚的佛教徒发笑，也让他们惊叹。我想，它们若不能让英国孩子产生同样的感受，反倒会叫我吃惊。《本生经》遇到了几位出色的英译者，他们的文字有力量，也有锋芒。剑桥大学基督学院的 W. H. D. 劳斯先生特意为本书新译了两篇，我很高兴能把它们刊布出来。其中一篇，我相信自己从里面找到了《雷摩大叔》中“柏油娃娃”情节的源头。
        - id: ch02-b04
          speaker: narrator
          text: |-
            这里所依据的第一条注释，指的是《伊索寓言史》。这篇著作收入我编订的卡克斯顿《伊索寓言》，作为导论卷出版。一八八九年，由伦敦的纳特出版社发行。
    - id: ch03
      title: 古老而年轻的印度童话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            印度童话是现存最古老的童话。可是换一个角度看，它们又是最年轻的。因为近代搜集印度民间故事的工作，直到大约二十五年前才真正开始。弗里尔小姐用她那部迷人的《古老的德干岁月》开了先河。此书一八六八年由伦敦的约翰·默里出版社出版，到一八八九年已出到第四版。随后，斯托克斯小姐、斯蒂尔夫人、坦普尔上尉，也就是后来的坦普尔少校，以及学者纳特萨·萨斯特里、诺尔斯先生和坎贝尔先生，都继续做起了这项工作。还有一些搜集者，把民间故事发表在《印度古物研究》和《东方学家》等期刊上。
        - id: ch03-b02
          speaker: narrator
          text: |-
            在过去四分之一个世纪里，人们已经从近代印度的故事宝库中取出了许多珍藏。可是印度实在太辽阔了，再多一些人前去搜集，再编出许多部故事集，也仍然大有可为。单看已经收集到的材料，欧洲民间故事里许多最常见的情节，在印度都能找到。它们是从别处传进印度的，还是原本就诞生在那里，我们几乎没有办法判断。不过，其中一些故事至今仍在印度民间流传，而且可以向前追溯一千多年。这样看来，认为它们起源于印度，自然更有道理。
        - id: ch03-b03
          speaker: narrator
          text: |-
            我从《本生经》《毕德帕寓言》和年代较近的故事集中挑选篇目。这些故事一方面最能帮助我们了解寓言和民间故事的起源，另一方面也最可能吸引英国孩子。不过，我没有选入太多格林童话类型的故事，因为不想重复这个系列前两卷的内容。这样一来，本书替印度提出的论据多少也弱了一些。为了照顾年幼的读者，我从苏摩提婆的《故事海》中选故事时，也只好有所取舍。那部书被称作“故事河流之海”，的确名副其实。
        - id: ch03-b04
          speaker: narrator
          text: |-
            至于用巴利文和梵文写下的故事，我采用的是已有译本，主要是本费的德译，还有里斯-戴维兹教授那刚健有力的英译。他允许我采用自己翻译的《本生经》故事，我也要在这里向他致谢。
    - id: ch04
      title: 致谢与童话的归属
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            最初采集这些故事的人，还有出版这些故事的出版商，都慷慨地帮助了我。因为他们的好意，我才能把这本书编成一部足以代表印度童话的选集。我要特别感谢弗里尔小姐。她特意为我破了一次例，允许我采用出色的《潘奇金》，还有那篇别有趣味的神话《太阳、月亮和风怎样出去赴宴》。斯托克斯小姐也同样宽厚，让我从她的《印度童话》中选用了几篇很有特色的作品。
        - id: ch04-b02
          speaker: narrator
          text: |-
            坦普尔少校也帮了我，使我能从他那部精彩的《清醒故事集》中挑选篇目。基根·保罗、特伦奇公司准许我采用他们“东方丛书”中诺尔斯先生的《克什米尔民间故事》。W. H. 艾伦公司对金斯科特夫人的《太阳的故事》也一样慷慨。M. L. 戴姆斯先生则允许我从他尚未出版的俾路支民间故事集中选出一篇。这样一来，我也能为已经刊行的印度故事宝库再添一篇作品。
        - id: ch04-b03
          speaker: narrator
          text: |-
            最后，我还要庆幸，朋友 J. D. 巴顿先生再次和我合作。印度民众用想象创造出的种种形象，经他画来，有的优美，有的诙谐。他既能表现凯尔特想象中的魔力，又能传达印度想象里的幽默，这可不是一件小事。它再一次证明，童话所包含的，远不只是凯尔特或印度的民族性。童话属于全人类。
        - id: ch04-b04
          speaker: narrator
          text: 这篇序言的署名是约瑟夫·雅各布斯。
