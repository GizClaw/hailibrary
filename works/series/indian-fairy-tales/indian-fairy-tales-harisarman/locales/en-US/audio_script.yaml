  chapters:
    - id: ch01
      title: The Forgotten Servant
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In a certain village lived a Brahman named Harisarman. He was poor, foolish, and unable to find work. He also had a great many children. People said this was the result of wrongs he had committed in an earlier life.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Harisarman wandered from place to place, begging with his family, until they reached a city. There he entered the service of a rich householder named Sthuladatta. His sons looked after Sthuladatta's cows and other possessions. His wife became a household servant, while Harisarman lived nearby and worked as an attendant.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One day, Sthuladatta held a feast for his daughter's wedding. Many friends of the bridegroom came, along with crowds of merry guests. Harisarman eagerly imagined eating his fill of ghee, meat, and every other delicacy. He hoped to carry some home to his family as well. But as he waited to be fed, nobody gave him a thought.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Night came, and Harisarman was miserable because he had received nothing to eat. He spoke to his wife.
        - id: ch01-b05
          speaker: harisarman
          text: >-
            They treat me with no respect because I am poor and foolish. So I have a plan. I will pretend that I know magic, and then Sthuladatta will have to respect me. When you get the chance, tell him your husband has magical knowledge.
        - id: ch01-b06
          speaker: narrator
          text: >-
            After saying this, Harisarman turned the plan over in his mind. When everyone was asleep, he stole the horse ridden by Sthuladatta's son-in-law. He led it some distance away and hid it.
        - id: ch01-b07
          speaker: narrator
          text: >-
            In the morning, the bridegroom's friends searched in every direction, but the horse was nowhere to be found. Sthuladatta feared that its loss was an evil omen. While he looked for the thieves who had taken it, Harisarman's wife approached him.
        - id: ch01-b08
          speaker: harisarman_wife
          text: >-
            My husband is a wise man. He understands astrology and the magical sciences, so he can recover your horse. Why not ask him for help?
        - id: ch01-b09
          speaker: narrator
          text: >-
            As soon as Sthuladatta heard this, he sent for Harisarman.
        - id: ch01-b10
          speaker: harisarman
          text: >-
            Yesterday everyone forgot about me. Today the horse is missing, and suddenly you remember me.
        - id: ch01-b11
          speaker: sthuladatta
          text: I did forget you. Please forgive me.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Sthuladatta did his best to win the Brahman over. Then he asked Harisarman to reveal who had taken the horse.
    - id: ch02
      title: The Pretended Magician
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Harisarman drew all sorts of diagrams, pretending to read the answer in them. At last he spoke.
        - id: ch02-b02
          speaker: harisarman
          text: >-
            Thieves have left the horse on the boundary south of here. It is hidden there now, but they will take it far away by nightfall. Hurry, and bring it back before they do.
        - id: ch02-b03
          speaker: narrator
          text: >-
            On hearing this, a band of men ran south. They quickly found the horse and brought it home, praising Harisarman for seeing what no one else could see.
        - id: ch02-b04
          speaker: narrator
          text: >-
            From then on, everyone honored Harisarman as a sage. Sthuladatta treated him with respect, and he lived there happily.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Some time later, a thief stole a great treasure of gold and jewels from the king's palace. No one knew who the thief was. Because Harisarman was now famous for his magical knowledge, the king quickly summoned him.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Harisarman needed time to think of some way out.
        - id: ch02-b07
          speaker: harisarman
          text: I will give you the answer tomorrow.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The king placed him in a chamber under careful guard. Left alone, Harisarman grieved over his foolish claim to knowledge.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Now, a palace maid named Jihva had stolen the treasure with her brother's help. Her name meant “Tongue.” Afraid that Harisarman's powers would expose her, she went to his chamber that night. She pressed her ear against the door to hear what he was doing inside.
        - id: ch02-b10
          speaker: narrator
          text: >-
            At that very moment, Harisarman was blaming his own tongue for boasting that he had magical knowledge.
        - id: ch02-b11
          speaker: harisarman
          text: >-
            Oh, Tongue, look what your greed has done! You wicked thing, you will soon be punished in full.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Jihva heard her own name and trembled. She was certain the wise man had discovered everything. Somehow she found a way into the guarded chamber, fell at Harisarman's feet, and confessed.
        - id: ch02-b13
          speaker: jihva
          text: >-
            Brahman, I am Jihva, the thief you have discovered. After taking the treasure, I buried it in the palace garden beneath a pomegranate tree. Please spare me. I will also give you the little gold I still have with me.
          emotion: fearful
    - id: ch03
      title: Jihva's Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Harisarman heard her confession and answered proudly.
        - id: ch03-b02
          speaker: harisarman
          text: >-
            Go. I know all of this already. I know the past, the present, and the future. You are a wretched creature who has begged for my protection, so I will not accuse you. But you must give me all the gold you still possess.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Jihva agreed and hurried away. Harisarman could hardly believe what had happened.
        - id: ch03-b04
          speaker: harisarman
          text: >-
            Fate plays games and makes impossible things happen. Disaster was so close. Who could have dreamed that chance would save us? I blamed my jihva, and the thief Jihva threw herself at my feet! Fear has a way of bringing hidden crimes into the open.
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: >-
            With these thoughts, Harisarman passed the rest of the night happily in the chamber.
        - id: ch03-b06
          speaker: narrator
          text: >-
            In the morning, he made a skillful show of his supposed knowledge. He brought the king into the garden and led him to the pomegranate tree. There they uncovered the buried treasure. Harisarman explained that the thief had escaped with one part of it.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The king was delighted. As Harisarman's reward, he gave him the revenue from many villages.
    - id: ch04
      title: The Minister's Test
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            But the king had a minister named Devajnanin, and the minister was not convinced. He leaned close and whispered in the king's ear.
        - id: ch04-b02
          speaker: devajnanin
          text: >-
            How could any man gain such extraordinary knowledge without studying the books of magic? You may be sure this is how he earns his living dishonestly. He must be secretly working with thieves. We should test him with a new trick.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The king decided to conduct the test himself. He put a frog inside a pitcher, covered the opening, and carried it to Harisarman.
        - id: ch04-b04
          speaker: king
          text: >-
            Brahman, tell me what is inside this pitcher. If you can guess correctly, I will bestow a great honor on you today.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Harisarman heard the challenge and thought his final hour had come. Then he remembered a name from childhood. His father had playfully called him “Froggie.” Driven by sheer luck, Harisarman used that pet name as he mourned his own hard fate.
        - id: ch04-b06
          speaker: harisarman
          text: >-
            Well, Froggie, this is a fine pitcher for you. It will soon bring your helpless life to a swift end!
          emotion: sad
    - id: ch05
      title: Froggie and the Pitcher
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The people in the court heard the word “Froggie” and burst into applause. Harisarman's cry matched the hidden creature perfectly.
        - id: ch05-b02
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: >-
            Ah, what a great sage! He even knows about the frog!
        - id: ch05-b03
          speaker: narrator
          text: >-
            The king believed that Harisarman had discovered the frog through divination, and he was overjoyed. He granted him the revenue from still more villages. He also gave him gold, a royal umbrella, and state carriages of every kind.
        - id: ch05-b04
          speaker: narrator
          text: >-
            And so Harisarman prospered in the world.
