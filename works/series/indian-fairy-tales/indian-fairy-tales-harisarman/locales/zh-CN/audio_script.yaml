audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    harisarman:
      display_name: 哈里萨曼
      tts:
        delivery: 窘迫时自怨机敏，得势后故作高深
        timbre: 略显单薄，语气灵活
        pace: 适中，盘算时稍慢
        pitch: 中
    wife:
      display_name: 哈里萨曼的妻子
      tts:
        delivery: 朴实顺从，替丈夫说话时十分笃定
        timbre: 温和清楚
        pace: 适中
        pitch: 中
    sthuladatta:
      display_name: 斯图拉达塔
      tts:
        delivery: 富户的端重口吻，忧急时坦率直接
        timbre: 浑厚清晰
        pace: 适中
        pitch: 中低
    jihva:
      display_name: 吉赫瓦
      tts:
        delivery: 做事谨慎，秘密败露时惊惧哀求
        timbre: 清亮而微颤
        pace: 适中偏快
        pitch: 中高
    devajnanin:
      display_name: 德瓦吉尼亚宁
      tts:
        delivery: 冷静多疑，进谏时压低声音而条理分明
        timbre: 干净偏冷
        pace: 适中
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严果断，奖赏贤能时爽快
        timbre: 洪亮端正
        pace: 适中
        pitch: 中低
    onlooker_1:
      display_name: 在场者甲
      tts:
        delivery: 由衷惊叹，语气热烈
        timbre: 明亮朴实
        pace: 适中偏快
        pitch: 中
    onlooker_2:
      display_name: 在场者乙
      tts:
        delivery: 由衷惊叹，语气热烈
        timbre: 清楚有力
        pace: 适中偏快
        pitch: 中
    onlooker_3:
      display_name: 在场者丙
      tts:
        delivery: 由衷惊叹，语气热烈
        timbre: 略显高亢
        pace: 适中偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 婚宴与失马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个村庄里住着一位婆罗门，名叫哈里萨曼。他又穷又糊涂，总也找不到差事。家里的孩子偏偏又多，仿佛他前世做下的坏事，都化成果报找上门来了。
        - id: ch01-b02
          speaker: narrator
          text: 哈里萨曼带着全家四处讨饭，后来走进一座城，投到富户斯图拉达塔门下。几个儿子替主人看守牛群和其他财物，妻子进宅做女仆，他自己住在附近，听候主人使唤。
        - id: ch01-b03
          speaker: narrator
          text: 有一天，斯图拉达塔的女儿成婚。新郎的亲友来了许多，助兴的宾客也挤满了宅院。哈里萨曼满心等着那顿喜宴。他想把酥油、肉和各种美食一直吃到嗓子眼，还要替妻儿带些回去。可是他眼巴巴等了又等，谁也没想起他。
        - id: ch01-b04
          speaker: narrator
          text: 到了夜里，他什么也没吃到，心里又委屈又恼火，便跟妻子商量起来。
        - id: ch01-b05
          speaker: harisarman
          text: 我又穷又笨，他们才这样瞧不起我。我要想个办法，装成懂法术的人，让斯图拉达塔也敬我几分。你找个机会告诉他，就说我精通法术。
        - id: ch01-b06
          speaker: narrator
          text: 话说完，哈里萨曼又暗暗盘算了一阵。等所有人睡熟，他溜进主人家，把主人女婿骑来的马偷偷牵走，藏在远处。第二天一早，新郎的亲友四处寻找，始终不见马的踪影。斯图拉达塔觉得新婚时丢马很不吉利，一面发愁，一面派人追查盗贼。
        - id: ch01-b07
          speaker: narrator
          text: 哈里萨曼的妻子见机会来了，便走到主人跟前。
        - id: ch01-b08
          speaker: wife
          text: 我丈夫很有智慧，占星和法术都精通。他一定能替您找回那匹马，您何不请他来问问？
        - id: ch01-b09
          speaker: narrator
          text: 斯图拉达塔马上叫来哈里萨曼。谁知哈里萨曼还先摆起了架子。
        - id: ch01-b10
          speaker: harisarman
          text: 昨天你们把我忘得干干净净。今天马丢了，倒记起我来了。
        - id: ch01-b11
          speaker: sthuladatta
          text: 是我疏忽，把你忘了，请你原谅。快告诉我，究竟是谁牵走了我们的马？
        - id: ch01-b12
          speaker: narrator
          text: 哈里萨曼装模作样，在地上画出许多古怪图形，这才开口。
        - id: ch01-b13
          speaker: harisarman
          text: 贼把马藏在南边的地界上。它现在还在那里，可一到傍晚就会被带去远方。你们赶紧去，马上把它牵回来。
        - id: ch01-b14
          speaker: narrator
          text: 众人照他说的方向跑去，果然很快找回了马。他们都夸哈里萨曼看得准。从那以后，人人都把他当成有大智慧的人，斯图拉达塔也对他十分敬重。哈里萨曼就这样过上了安稳快活的日子。
    - id: ch02
      title: 王宫盗宝
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，王宫失窃，大批金银珠宝不见了。盗贼是谁，始终查不出来。国王听说哈里萨曼法术高明，立刻召他进宫。哈里萨曼哪里知道答案，只能先拖上一天。
        - id: ch02-b02
          speaker: harisarman
          text: 请陛下等到明天，那时我再来禀告。
        - id: ch02-b03
          speaker: narrator
          text: 国王把他留在一间屋里，还派人严密看守。哈里萨曼想起自己根本没有真本领，越想越发愁。
        - id: ch02-b04
          speaker: narrator
          text: 宫里有个侍女名叫吉赫瓦。这个名字的意思，正是“舌头”。宝物就是她和哥哥合伙从王宫深处偷走的。吉赫瓦害怕哈里萨曼真能算出盗贼，到了夜里，便悄悄把耳朵贴在那间屋的门上，想听听里面有什么动静。
        - id: ch02-b05
          speaker: narrator
          text: 屋里的哈里萨曼正独自懊悔。他怪自己的舌头贪吃，害他吹嘘什么法术，如今再也收不了场。
        - id: ch02-b06
          speaker: harisarman
          text: 舌头啊舌头，你为了贪吃，怎么给我惹来这样的祸？你这害人的东西，眼看就要受尽惩罚了！
        - id: ch02-b07
          speaker: narrator
          text: 门外的吉赫瓦听得魂飞魄散。她以为这位智者连自己的名字和罪行都算了出来，便设法溜进屋里，扑倒在他脚下。
        - id: ch02-b08
          speaker: jihva
          text: 婆罗门大人，我就是吉赫瓦。您已经知道宝物是我偷的了。我把它们埋在王宫后面花园的石榴树下。求您饶过我吧！我身边还留着一点金子，也全都交给您。
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: 哈里萨曼听得又惊又喜，脸上却摆出高深莫测的神气。
        - id: ch02-b10
          speaker: harisarman
          text: 走吧，这些事我全知道。过去、现在和未来，都瞒不过我。你既然这样可怜，又来求我保护，我不会告发你。不过，你手里的金子必须一件不少地交给我。
        - id: ch02-b11
          speaker: narrator
          text: 吉赫瓦一口答应，很快走了。哈里萨曼这才暗自惊叹，命运真像闹着玩一样，竟能让不可能的事成真。大难已经逼近，偏偏一个巧合救了他。他责骂自己的“吉赫瓦”，那个名叫吉赫瓦的盗贼竟扑到了脚下。可见人藏得住罪行，却藏不住心里的恐惧。
        - id: ch02-b12
          speaker: narrator
          text: 哈里萨曼放下心来，在屋里舒舒服服过了一夜。第二天早晨，他又摆出一副施展法术的样子，把国王一路领到花园，找出石榴树下埋着的宝物。他还说，盗贼已经带着一部分财宝逃走了。国王大为满意，便把许多村庄的赋税赏给他。
    - id: ch03
      title: 罐中的青蛙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王的大臣德瓦吉尼亚宁却不肯相信。他凑近国王，压低声音进谏。
        - id: ch03-b02
          speaker: devajnanin
          text: 他从没读过法术典籍，怎么会懂凡人学不到的本领？依我看，他是暗中跟盗贼通消息，靠这套把戏赚取不义之财。陛下最好另想一个办法，当面试试他。
        - id: ch03-b03
          speaker: narrator
          text: 国王便亲手拿来一只带盖的陶罐，事先把一只青蛙放在里面。
        - id: ch03-b04
          speaker: king
          text: 婆罗门，你若猜得出罐里是什么，今天我一定重重赏你。
        - id: ch03-b05
          speaker: narrator
          text: 哈里萨曼一听，只觉得末日到了。小时候，父亲曾开玩笑给他取了个乳名，叫“小青蛙”。他想起这个名字，也想起自己眼下的苦命。可好运又推了他一把，让他忽然对自己喊出一句话来。
        - id: ch03-b06
          speaker: harisarman
          text: 小青蛙呀小青蛙，这只罐子正适合你！你孤零零的，毫无办法，它马上就要送你上路了！
        - id: ch03-b07
          speaker: narrator
          text: 在场的人听见这话，顿时高声喝彩。哈里萨曼说的“小青蛙”，竟和罐里装的东西正好对上了。大家越想越佩服，纷纷低声惊叹。
        - id: ch03-b08
          speakers: [onlooker_1, onlooker_2, onlooker_3]
          ensemble: chorus
          text: 真是了不起的智者！连罐里的青蛙，他都知道！
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: 国王也认定这是占卜的神通，欢喜得不得了。他又把更多村庄的赋税赐给哈里萨曼，还赏下黄金、华盖和各式各样的仪仗车驾。就这样，哈里萨曼凭着一次又一次的巧合，从此在世间发达起来。
