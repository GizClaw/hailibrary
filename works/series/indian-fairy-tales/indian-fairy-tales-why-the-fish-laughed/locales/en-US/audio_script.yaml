  chapters:
  - id: ch01
    title: The Fish at the Palace Window
    blocks:
    - id: ch01-b01
      speaker: narrator
      text: >-
        One day, a fisherwoman passed a palace, calling out that she had fish to sell. The queen appeared at a window and beckoned her closer so she could see the catch. Just then, a very large fish began jumping about at the bottom of the basket.
    - id: ch01-b02
      speaker: queen
      text: >-
        Is that fish male or female? I want to buy a female one.
    - id: ch01-b03
      speaker: narrator
      text: >-
        When the fish heard her question, it laughed aloud.
    - id: ch01-b04
      speaker: fish
      text: Ha, ha, ha!
    - id: ch01-b05
      speaker: fisherwoman
      text: That one is male, Your Majesty.
    - id: ch01-b06
      speaker: narrator
      text: >-
        The fisherwoman went on with her rounds. The queen returned to her room in a fury. When the king came to see her that evening, he could tell that something had upset her.
    - id: ch01-b07
      speaker: king
      text: Are you unwell?
    - id: ch01-b08
      speaker: queen
      text: >-
        No, but I am deeply offended by the strange way a fish behaved. A woman brought it here today. I asked if it was male or female, and the fish laughed at me most rudely.
      emotion: angry
    - id: ch01-b09
      speaker: king
      text: >-
        A fish laughed? That cannot be true. You must have dreamed it.
      emotion: surprised
    - id: ch01-b10
      speaker: queen
      text: >-
        I am no fool. I saw it with my own eyes, and I heard it with my own ears.
      emotion: angry
    - id: ch01-b11
      speaker: king
      text: >-
        Very strange indeed. So be it. I will have the matter investigated.
    - id: ch01-b12
      speaker: narrator
      text: >-
        The next morning, the king told his vizier what the queen had said. He ordered him to discover why the fish had laughed and bring back a satisfactory answer within six months. If he failed, he would die. The vizier promised to do all he could, though he was almost sure he would fail.
    - id: ch01-b13
      speaker: narrator
      text: >-
        For five months he worked without rest, trying to discover why the fish had laughed. He searched everywhere and questioned everyone he could find. He consulted wise and learned people. He also went to those who understood magic and every sort of trickery. Still, not one of them could explain the mystery.
    - id: ch01-b14
      speaker: narrator
      text: >-
        Brokenhearted, the vizier went home and began putting all his affairs in order before his certain death. He had served the king long enough to know that His Majesty would not take back the threat. Among the instructions he gave, he advised his son to travel for a while, until the king's anger had cooled.
  - id: ch02
    title: A Puzzling Companion
    blocks:
    - id: ch02-b01
      speaker: narrator
      text: >-
        The vizier's son was clever and handsome. He set off, ready to go wherever fate might lead him. After several days, he met an old farmer who was traveling to a certain village. The farmer seemed pleasant, so the young man asked to join him and said he was headed to the same place. The farmer agreed, and they walked on together. The day was hot, and the road was long and tiring.
    - id: ch02-b02
      speaker: vizier_son
      text: >-
        Wouldn't the journey be easier if we took turns carrying each other?
    - id: ch02-b03
      speaker: narrator
      text: >-
        The farmer thought the young man must be a fool.
    - id: ch02-b04
      speaker: narrator
      text: >-
        Soon they passed a field of ripe corn. It waved in the breeze like a golden sea, ready to be cut.
    - id: ch02-b05
      speaker: vizier_son
      text: Has this crop already been eaten, or not?
    - id: ch02-b06
      speaker: farmer
      text: I don't know.
    - id: ch02-b07
      speaker: narrator
      text: >-
        The old man had no idea what his companion meant. A little later, they reached a large village. The young man held out a clasp knife.
    - id: ch02-b08
      speaker: vizier_son
      text: >-
        Here, friend. Please use this to get us two horses. Be sure to bring the knife back, because it is very precious.
    - id: ch02-b09
      speaker: narrator
      text: >-
        Half amused and half annoyed, the farmer pushed the knife away. He muttered that the stranger was either a fool or was making a fool of him. The young man acted as if he had not heard. After that, he said almost nothing until they reached the city. The farmer's house stood a short distance beyond it.
    - id: ch02-b10
      speaker: narrator
      text: >-
        They walked through the bazaar and visited the mosque. No one greeted them, and no one invited them inside to rest.
    - id: ch02-b11
      speaker: vizier_son
      text: What a large cemetery this is!
    - id: ch02-b12
      speaker: narrator
      text: >-
        The farmer wondered why anyone would call such a crowded city a cemetery.
    - id: ch02-b13
      speaker: narrator
      text: >-
        Outside the city, the road crossed a cemetery. A few people were praying beside a grave and giving chapatis and kulchas to passers-by in memory of someone they loved. They beckoned to the travelers and gave them all they wanted.
    - id: ch02-b14
      speaker: vizier_son
      text: What a splendid city this is!
    - id: ch02-b15
      speaker: narrator
      text: >-
        Now the farmer was sure the young man had lost his senses. He wondered what the fellow might do next. Perhaps he would call land water and water land. Perhaps he would speak of light in darkness and darkness in daylight. Still, the farmer kept all these thoughts to himself.
    - id: ch02-b16
      speaker: narrator
      text: >-
        Soon they had to wade through a stream that ran beside the cemetery. The water was fairly deep. The farmer took off his shoes and paijamas, then made his way across. The young man did the opposite. He walked straight through the water with his shoes and paijamas still on.
    - id: ch02-b17
      speaker: farmer
      text: >-
        I have never seen such a complete fool, in his words or in his actions.
    - id: ch02-b18
      speaker: narrator
      text: >-
        Even so, the farmer liked him. He thought the stranger might amuse his wife and daughter, so he invited him to stay at the house for as long as he needed.
    - id: ch02-b19
      speaker: vizier_son
      text: >-
        Thank you kindly. But first, may I ask whether the beam of your house is strong?
    - id: ch02-b20
      speaker: narrator
      text: >-
        The farmer gave up in despair. He left the young man outside and went into his house laughing.
  - id: ch03
    title: The Farmer's Daughter Understands
    blocks:
    - id: ch03-b01
      speaker: farmer
      text: >-
        There is a man in the field over there. He traveled most of the way with me, and I invited him to stay here while he is in the village. But he talks such nonsense that I cannot understand him at all. Now he wants to know whether the beam of our house is sound. He must be mad!
    - id: ch03-b02
      speaker: narrator
      text: >-
        With that, the farmer burst out laughing. His daughter was a remarkably sharp and wise young woman.
    - id: ch03-b03
      speaker: farmer_daughter
      text: >-
        Father, whoever he is, he is not the fool you think he is. He only wants to know whether you can afford to keep him as a guest.
    - id: ch03-b04
      speaker: farmer
      text: >-
        Oh, of course! Perhaps you can explain his other riddles too. While we walked, he asked whether he should carry me or I should carry him. He said it would make the journey more pleasant.
    - id: ch03-b05
      speaker: farmer_daughter
      text: >-
        Certainly. He meant that one of you should tell a story to make the time pass more easily.
    - id: ch03-b06
      speaker: farmer
      text: >-
        Yes, I see! Then we passed a cornfield, and he asked whether the crop had been eaten already.
    - id: ch03-b07
      speaker: farmer_daughter
      text: >-
        Didn't you understand that, Father? He wanted to know whether the owner was in debt. If he owed money, the whole crop was as good as eaten, because it would all go to his creditors.
    - id: ch03-b08
      speaker: farmer
      text: >-
        Yes, yes, of course! Then, when we entered a village, he handed me his clasp knife. He told me to get two horses with it and bring the knife back.
    - id: ch03-b09
      speaker: farmer_daughter
      text: >-
        Two sturdy walking sticks can carry you along almost as well as two horses. He was asking you to cut a pair of sticks without losing his knife.
    - id: ch03-b10
      speaker: farmer
      text: >-
        Now I understand. In the city, we knew no one, and not one person offered us even a scrap to eat. But by the cemetery, some people called us over and gave us chapatis and kulchas. My companion called the city a cemetery and the cemetery a city.
    - id: ch03-b11
      speaker: farmer_daughter
      text: >-
        That makes sense too, Father. Think of a city as a place where a traveler should be able to find whatever he needs. People who offer no welcome are worse than the dead. The city was crowded with living people, but it was as good as dead to you. The cemetery was crowded with the dead, yet kind people greeted you there and gave you bread.
    - id: ch03-b12
      speaker: farmer
      text: >-
        True, true! And when we crossed the stream just now, he kept his shoes and paijamas on.
    - id: ch03-b13
      speaker: farmer_daughter
      text: >-
        That was wise. I have often wondered why people dare to walk barefoot into that swift stream, over all those sharp stones. One small stumble could make a person fall and get soaked from head to foot. Shoes protect the feet, and the clothing may get wet either way. Your friend is a very wise man. I would like to meet him and speak with him.
    - id: ch03-b14
      speaker: farmer
      text: Very well. I will find him and bring him inside.
    - id: ch03-b15
      speaker: farmer_daughter
      text: >-
        Tell him our beams are strong enough, and then he will come. I will send him a gift first, so he knows we can afford to welcome him.
  - id: ch04
    title: The Message in the Gift
    blocks:
    - id: ch04-b01
      speaker: narrator
      text: >-
        The farmer's daughter called a servant. She gave him a basin of ghee, twelve chapatis, and a jar of milk to take to the young man, along with a message.
    - id: ch04-b02
      speaker: farmer_daughter
      text: >-
        Tell our friend this. The moon is full, twelve months make a year, and the sea is overflowing with water.
    - id: ch04-b03
      speaker: narrator
      text: >-
        Halfway there, the servant met his little son. When the boy saw the food in the basket, he begged his father for some.
    - id: ch04-b04
      speaker: servant_son
      text: Please, Father, may I have some of that food?
    - id: ch04-b05
      speaker: narrator
      text: >-
        The servant foolishly gave him some. Then he found the young man and delivered what remained, together with his mistress's message.
    - id: ch04-b06
      speaker: vizier_son
      text: >-
        Give your mistress my greetings. Tell her the moon is new, the year has only eleven months, and the sea is nowhere near full.
    - id: ch04-b07
      speaker: narrator
      text: >-
        The servant did not understand. He repeated the reply word for word, and in that way his theft was discovered. He was severely punished.
    - id: ch04-b08
      speaker: narrator
      text: >-
        Before long, the young man arrived with the farmer. The family treated him with great care, as though he were the son of an important man, though they still knew nothing about him.
    - id: ch04-b09
      speaker: narrator
      text: >-
        At last, he told them everything. He explained how the fish had laughed at the queen's question. He told them that the king had threatened to execute his father unless he solved the mystery, and that his father had sent him away until the king's anger cooled. Then he asked what he ought to do.
    - id: ch04-b10
      speaker: farmer_daughter
      text: >-
        That fish's laughter has caused all this trouble, and I believe I know what it meant. There is a man hidden among the women of the palace, and he is plotting to kill the king.
    - id: ch04-b11
      speaker: vizier_son
      text: >-
        What joy! There is still time. I can save my father from a shameful and unjust death, and I can save the king from danger!
      emotion: happy
    - id: ch04-b12
      speaker: narrator
      text: >-
        The next day, the vizier's son hurried home and took the farmer's daughter with him.
  - id: ch05
    title: Why the Fish Laughed
    blocks:
    - id: ch05-b01
      speaker: narrator
      text: >-
        As soon as they reached his country, the young man ran to the palace and told his father what he had learned. By then, the poor vizier had lived so long under the expectation of death that he was nearly dead already. He was carried at once before the king, where he repeated the news his son had just brought.
    - id: ch05-b02
      speaker: king
      text: Never! I cannot believe it.
      emotion: surprised
    - id: ch05-b03
      speaker: vizier
      text: >-
        It must be true, Your Majesty. To prove it, please gather every palace maid and order each one to jump across a pit. Have the pit dug, and we will soon learn whether a man is hiding among them.
    - id: ch05-b04
      speaker: narrator
      text: >-
        The king had a pit dug. Then he commanded every maid in the palace to try to jump over it. They all made the attempt, but only one succeeded. And that one was found to be a man.
    - id: ch05-b05
      speaker: narrator
      text: >-
        So the queen was satisfied, and the faithful old vizier was saved.
    - id: ch05-b06
      speaker: narrator
      text: >-
        Soon afterward, the vizier's son married the old farmer's daughter. Their marriage was a very happy one.
