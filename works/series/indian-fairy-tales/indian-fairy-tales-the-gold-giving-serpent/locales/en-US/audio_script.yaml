  chapters:
    - id: ch01
      title: The Guardian of the Field
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In a certain place lived a Brahman named Haridatta. He worked as a farmer, but all his labor brought him very little in return.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, when the hottest hours were over, Haridatta lay down to doze in the shade of a tree. Then he suddenly saw a great hooded snake crawl from an ant-hill nearby.
        - id: ch01-b03
          speaker: haridatta
          text: >-
            This must be the guardian deity of my field. I have never worshipped it. That must be why my farming brings me nothing. I will go and pay my respects at once.
        - id: ch01-b04
          speaker: narrator
          text: >-
            With his mind made up, Haridatta fetched some milk and poured it into a bowl. He carried the bowl to the ant-hill and called out.
        - id: ch01-b05
          speaker: haridatta
          text: >-
            O Guardian of this Field, I never knew you lived here. That is why I have never paid my respects to you. Please forgive me.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Haridatta set down the milk and went home. When he returned the next morning, a gold denar lay in the bowl.
    - id: ch02
      title: A Gold Denar Each Day
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            From that day on, the same thing happened every morning. Haridatta left milk for the serpent, and each time he came back, he found a gold denar.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One day, Haridatta had to go to the village. He told his son to carry the milk to the ant-hill in his place. The young man took the bowl there, set it down, and returned home.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The next day, Haridatta's son went back and found a denar in the bowl. At once, a greedy thought came to him.
        - id: ch02-b04
          speaker: haridatta_son
          text: >-
            That ant-hill must be full of gold denars. If I kill the serpent, I can take every one of them for myself.
    - id: ch03
      title: The Son's Greed
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The following day, the son brought the serpent its milk again. This time, he carried a cudgel. As he gave the milk to the serpent, he struck it on the head.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Fate spared the serpent from death. Enraged by the blow, it sank its sharp fangs into the young man. He fell dead at once.
        - id: ch03-b03
          speaker: narrator
          text: >-
            His people built a funeral pyre not far from the field. There they burned his body to ashes.
    - id: ch04
      title: Friendship at an End
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Two days later, Haridatta returned. When he learned what had happened to his son, he was overcome with grief and mourned for him.
        - id: ch04-b02
          speaker: narrator
          text: >-
            After some time had passed, Haridatta took a bowl of milk to the ant-hill once more. He stood outside and praised the serpent in a loud voice.
        - id: ch04-b03
          speaker: narrator
          text: >-
            A long, long time went by before the serpent appeared. Even then, it showed only its head at the mouth of the ant-hill.
        - id: ch04-b04
          speaker: serpent
          text: >-
            Greed is what brought you back. It has even made you forget the loss of your son. There can be no friendship between us now.
        - id: ch04-b05
          speaker: serpent
          text: >-
            Your son was young and ignorant when he struck me, and I bit him to death. How can I forget the blow from his cudgel? And how can you forget the pain and grief of losing your son?
        - id: ch04-b06
          speaker: narrator
          text: >-
            The serpent gave Haridatta a costly pearl. Then, before disappearing into the ant-hill, it spoke one last time.
        - id: ch04-b07
          speaker: serpent
          text: Do not come back again.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Haridatta took the pearl and went home, cursing his son's foolishness.
