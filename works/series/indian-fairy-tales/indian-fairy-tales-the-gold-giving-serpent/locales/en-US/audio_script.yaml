  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    haridatta:
      display_name: Haridatta
      tts:
        delivery: humble and earnest
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    haridatta_son:
      display_name: Haridatta's Son
      tts:
        delivery: youthful and impulsive
        timbre: clear and lean
