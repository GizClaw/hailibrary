audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    brahman:
      display_name: 婆罗门
      tts:
        delivery: 质朴勤恳，忧虑家人时急切直率
        timbre: 清瘦温和
        pace: 适中
        pitch: 中
    son:
      display_name: 婆罗门的儿子
      tts:
        delivery: 年轻急躁，起了贪念后显得狠决
        timbre: 清亮而略显单薄
        pace: 适中偏快
        pitch: 中
    serpent:
      display_name: 蛇
      tts:
        delivery: 古老威严，话语冷静而不容辩驳
        timbre: 低沉幽远
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 田地的守护神
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个叫哈利达塔的婆罗门，以种田为生。可他再怎么辛苦，地里的收成还是少得可怜。一天，最热的时辰刚过去，他实在又热又累，就躺在树荫下打起盹来。
        - id: ch01-b02
          speaker: narrator
          text: 忽然，一条头颈宽扁的大蛇从附近的蚁丘里爬了出来。哈利达塔看见它，心里顿时有了一个念头。
        - id: ch01-b03
          speaker: brahman
          text: 这一定是守护田地的神灵。我从来没有供奉过它，难怪种什么都没有好收成。我得马上去向它敬献供物。
        - id: ch01-b04
          speaker: narrator
          text: 他取来牛奶，倒进碗里，又把碗端到蚁丘前。
        - id: ch01-b05
          speaker: brahman
          text: 田地的守护神啊，我一直不知道您住在这里，所以从没来供奉过您。请您原谅我。
        - id: ch01-b06
          speaker: narrator
          text: 哈利达塔放下牛奶，转身回家。第二天清早，他再来时，竟在碗里看见一枚第纳尔金币。从此，他每天献上一碗牛奶，每天都能在碗里找到一枚金币。
    - id: ch02
      title: 蚁丘里的金币
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，哈利达塔要进村办事，就叫儿子替他把牛奶送到蚁丘。儿子照办以后回了家。第二天再去，他也在碗里发现了一枚第纳尔金币。
        - id: ch02-b02
          speaker: son
          text: 蚁丘里面准是堆满了这种金币。只要杀掉那条蛇，所有金币就全归我了。
        - id: ch02-b03
          speaker: narrator
          text: 又过一天，儿子送牛奶时，举起木棍，朝蛇头狠狠打了下去。可这一棍没能要了蛇的命。蛇怒火冲天，张开尖利的毒牙，一口咬中了年轻人。婆罗门的儿子当场倒下，再也没有起来。
        - id: ch02-b04
          speaker: narrator
          text: 家人在田地附近架起火葬柴堆，把他的遗体烧成了灰烬。
    - id: ch03
      title: 再也无法挽回的友谊
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两天以后，哈利达塔回来了。他得知儿子的死讯，悲痛地哀悼了一阵。过些时候，他却又端起一碗牛奶，来到蚁丘前，高声赞颂那条蛇。
        - id: ch03-b02
          speaker: narrator
          text: 他等了很久很久，蛇才露面，而且只把头探出洞口。
        - id: ch03-b03
          speaker: serpent
          text: 是贪欲把你带回这里的。为了它，你连失去儿子的痛苦都忘了。从现在起，我们不可能再做朋友。
        - id: ch03-b04
          speaker: serpent
          text: 你的儿子年轻无知，举棍打我，我也咬死了他。我怎么忘得了那一棍？你又怎么忘得了丧子的悲痛？
        - id: ch03-b05
          speaker: narrator
          text: 说完，蛇送给哈利达塔一颗价值连城的珍珠，随后便隐入蚁丘。消失以前，它留下最后一句话。
        - id: ch03-b06
          speaker: serpent
          text: 不要再回来了。
        - id: ch03-b07
          speaker: narrator
          text: 哈利达塔拿起珍珠，回家去了。一路上，他不停咒骂儿子的愚蠢。
