  chapters:
    - id: ch01
      title: A Prince and Five Weapons
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Teacher told this story at Jetavana because one of the Brothers had stopped striving to live righteously. He called the Brother to him and asked whether it was true.
        - id: ch01-b02
          speaker: teacher
          text: Have you truly given up all effort?
        - id: ch01-b03
          speaker: brother
          text: Yes, Blessed One.
        - id: ch01-b04
          speaker: teacher
          text: >-
            Brother, long ago, wise men made an effort when effort was needed. By doing so, they gained royal power.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Then the Teacher told him a tale from long ago. Brahmadatta was King of Benares, and the Bodhisatta was born as the son of his chief queen. On the child's name-day, the king satisfied every wish of eight hundred Brahmans. Then he asked them to read the prince's lucky marks. The Brahmans were skilled in such things, and they saw that the child was extraordinary.
        - id: ch01-b06
          speaker: brahman
          text: >-
            Great King, your son is filled with goodness. After your death, he will become king. All India will know him as its greatest master of the five weapons.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Those weapons were the sword, the spear, the bow, the battle-axe, and the shield. Because of the prophecy, the child was named the Prince of the Five Weapons.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The prince grew until he was sixteen, old enough to learn the knowledge he would need. One day, his father sent for him.
        - id: ch01-b09
          speaker: king
          text: My son, it is time for you to complete your education.
        - id: ch01-b10
          speaker: prince
          text: Who will teach me, Father?
        - id: ch01-b11
          speaker: king
          text: >-
            Go to the city of Takkasila, in the kingdom of Candahar. A famous teacher lives there, and I want you to study with him. Take these thousand pieces of money as his fee.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The prince left home and studied under that teacher. When his education was finished, the teacher gave him the Five Weapons as a gift. The prince said farewell and set out for Benares, carrying all five with him.
    - id: ch02
      title: The Forest of the Demon
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On the way, the prince reached a forest where the Demon with the Matted Hair lived. Some men near the entrance saw the young traveler approaching and tried to stop him.
        - id: ch02-b02
          speaker: traveler
          text: >-
            Ho there, young sir! Stay out of those woods. The Demon with the Matted Hair lives inside, and he kills every man he sees!
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: >-
            But the prince trusted in his own strength. He walked straight into the forest, as fearless as a lion with a mane.
        - id: ch02-b04
          speaker: narrator
          text: >-
            In the middle of the forest, the Demon appeared. He stood as tall as a palm tree. His head was as large as a pagoda, and his eyes were the size of saucers. Knobs and bulbs covered his two tusks. He had a hawk's face, a belly marked with many colors, and blue hands and feet.
        - id: ch02-b05
          speaker: demon
          text: Where do you think you are going? Stop! You will be my meal!
          emotion: angry
        - id: ch02-b06
          speaker: prince
          text: >-
            Demon, I entered this forest because I trust myself. You had better be careful before you come any closer. This arrow is tipped with deadly poison. I will shoot you down with it!
        - id: ch02-b07
          speaker: narrator
          text: >-
            The prince fitted the poisoned arrow to his bow and fired. It buried itself in the Demon's matted hair. He fired again and again until all fifty of his arrows were gone. Every one lodged in that thick hair.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The Demon snapped the arrows short, dropped them at his feet, and came toward the prince. The prince drew his sword and struck, calling out another warning. The sword was thirty-three inches long, but it, too, caught fast in the Demon's hair. Next the prince drove in his spear. It stuck. He swung his club. That stuck as well.
    - id: ch03
      title: Caught in Five Places
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When the last weapon held fast, the prince faced the Demon and spoke.
        - id: ch03-b02
          speaker: prince
          text: >-
            Demon! Have you never heard of me, the Prince of the Five Weapons? I did not enter your forest because I trusted my bow or any other weapon. Today I will pound you and grind you into powder!
        - id: ch03-b03
          speaker: narrator
          text: >-
            He shouted and struck the Demon with his right hand. His hand stuck in the matted hair. He struck with his left, and that hand stuck too. He kicked with his right foot, then his left, but both feet were trapped. At last, he drove his head against the Demon.
        - id: ch03-b04
          speaker: prince
          text: I will pound you into powder!
        - id: ch03-b05
          speaker: narrator
          text: >-
            His head caught fast like everything else. Now the prince hung from the Demon, trapped in five places. Still, he was not frightened. He was not even nervous.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The Demon looked at his prisoner and wondered. This was a lion of a man, a noble man, perhaps more than a man. Though a Demon had caught him, he showed no fear at all. In all the time the Demon had hunted along that road, he had never met anyone like him. The Demon found himself unable to eat the prince. Instead, he asked a question.
        - id: ch03-b07
          speaker: demon
          text: Young sir, why are you not frightened to death?
          emotion: surprised
        - id: ch03-b08
          speaker: prince
          text: >-
            Why should I be afraid, Demon? A man can die only once in a single life. Besides, there is a thunderbolt inside my belly. If you eat me, you will never digest it. It will tear your insides to pieces and kill you. Then both of us will perish. That is why I fear nothing.
        - id: ch03-b09
          speaker: narrator
          text: >-
            By the thunderbolt, the prince meant the weapon of knowledge within him.
    - id: ch04
      title: The Thunderbolt Within
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Demon's courage failed when he heard those words. He believed the young man was telling the truth. Even a morsel of flesh from such a lion of a man, he thought, would be too much to digest, though it were no larger than a kidney bean. Fearful for his own life, he released the prince.
        - id: ch04-b02
          speaker: demon
          text: >-
            Young sir, you truly are a lion of a man. I will not eat you. I set you free from my hands, just as the moon comes free from the jaws of Rahu after an eclipse. Go back to your family and friends!
          emotion: fearful
        - id: ch04-b03
          speaker: prince
          text: >-
            Demon, I will leave as you ask. But listen to me. You were born as a cruel Demon who drinks blood and feeds on the flesh of others because you did evil in former lives. If you continue doing evil, you will pass from darkness into deeper darkness.
        - id: ch04-b04
          speaker: prince
          text: >-
            Now that you have met me, you cannot keep living in wickedness. When someone takes the life of a living creature, that deed may lead to birth as an animal, a Peta, or an Asura. Even if that person is born human again, the life will be short.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The prince went on teaching him. He explained the harm that comes from the five kinds of wickedness and the good that comes from the five kinds of virtue. In many ways, he made the Demon fear the results of evil. He kept speaking until he had subdued the Demon, taught him self-denial, and established him in the five virtues.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Then the prince taught him to worship the deity who received offerings in that wood. After one final, careful warning, the prince left the forest.
        - id: ch04-b07
          speaker: narrator
          text: >-
            At the forest entrance, he told the people nearby everything that had happened. Then he continued to Benares, still armed with his five weapons. In time he became king and ruled with righteousness. He gave alms, did good, and at last passed away according to his deeds.
    - id: ch05
      title: The Teacher's Lesson
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When the tale was over, the Teacher reached perfect enlightenment and spoke this verse.
        - id: ch05-b02
          speaker: teacher
          text: >-
            The one whose mind and heart are free from every desire, who seeks peace by living virtuously, will in time break every bond that holds him fast to life, and cease to be.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Through sainthood and the teaching of the law, the Teacher reached the summit. Then he declared the Four Truths. By the time he finished declaring them, the Brother who had stopped striving had attained sainthood too.
        - id: ch05-b04
          speaker: narrator
          text: >-
            At last, the Teacher explained how the people in the old tale were connected to those of his own time.
        - id: ch05-b05
          speaker: teacher
          text: >-
            In those days, Angulimala was the Demon with the Matted Hair. I myself was the Prince of the Five Weapons.
