audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    sun:
      display_name: Sun
      tts:
        delivery: proud and blunt
        timbre: bright and forceful
        pace: measured
        pitch: medium
    moon:
      display_name: Moon
      tts:
        delivery: gentle and considerate
        timbre: soft and luminous
        pace: unhurried
        pitch: medium-high
    wind:
      display_name: Wind
      tts:
        delivery: breezy and self-assured
        timbre: airy and restless
        pace: brisk
