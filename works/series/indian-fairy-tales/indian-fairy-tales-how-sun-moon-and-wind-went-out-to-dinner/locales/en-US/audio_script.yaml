        pitch: medium-high
  chapters:
    - id: ch01
      title: The Feast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, Sun, Moon, and Wind went to dinner with their uncle and aunts, Thunder and Lightning. Far away, high in the sky, their mother Star stayed home alone and waited for her children to return.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Sun and Wind were both greedy and selfish. They ate their fill of the wonderful feast without once thinking of taking anything home to their mother. But gentle Moon remembered her. Whenever a fine new dish came around, Moon tucked a little of it beneath one of her beautiful long fingernails. That way, Star could share in the treat.
    - id: ch02
      title: What They Brought Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Star kept watch all night with her one little bright eye. When her children finally came home, she asked them a question.
        - id: ch02-b02
          speaker: star
          text: Well, children, did you bring anything back for me?
        - id: ch02-b03
          speaker: narrator
          text: Sun, the eldest, answered first.
        - id: ch02-b04
          speaker: sun
          text: >-
            I brought you nothing. I went out to have a good time with my friends, not to carry dinner home for my mother!
        - id: ch02-b05
          speaker: wind
          text: >-
            I did not bring you anything either, Mother. I only went out for my own enjoyment. You could hardly expect me to gather up good things for you.
        - id: ch02-b06
          speaker: moon
          text: Mother, bring a plate and see what I saved for you.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Moon shook her hands over the plate. Down came a dinner more delicious than any that had ever been seen before.
    - id: ch03
      title: Star's Judgment
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Star turned to Sun.
        - id: ch03-b02
          speaker: star
          text: >-
            You went out with your friends and feasted for your own pleasure. You never once thought of your mother waiting at home, so you will be cursed. From now on, your rays will be burning hot. They will scorch everything they touch. People will hate you and cover their heads whenever you appear.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: That is why Sun has been so hot ever since.
        - id: ch03-b04
          speaker: narrator
          text: Then Star faced Wind.
        - id: ch03-b05
          speaker: star
          text: >-
            You forgot your mother too, while you were busy with your own selfish pleasure. Now hear what will happen to you. You will always blow when the weather is hot and dry. You will dry up and shrivel every living thing. From this moment on, people will hate you and keep away from you.
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: That is why Wind is still so unpleasant in hot weather.
    - id: ch04
      title: Moon's Blessing
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: But when Star turned to Moon, she spoke differently.
        - id: ch04-b02
          speaker: star
          text: >-
            Daughter, you remembered your mother and saved a share of your own pleasure for me. From now on, you will always be cool, calm, and bright. Your pure rays will never carry a harmful glare, and people will always call you blessed.
        - id: ch04-b03
          speaker: narrator
          text: >-
            That is why Moon's light remains so soft, so cool, and so beautiful, even to this day.
