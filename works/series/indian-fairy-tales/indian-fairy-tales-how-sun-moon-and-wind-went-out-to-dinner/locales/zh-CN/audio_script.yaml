audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    sun:
      display_name: 太阳
      tts:
        delivery: 骄傲直率，话里透着自私和不耐烦
        timbre: 明亮有力
        pace: 适中
        pitch: 中
    moon:
      display_name: 月亮
      tts:
        delivery: 温柔体贴，说话真诚而轻缓
        timbre: 柔和清亮
        pace: 舒缓
        pitch: 中高
    wind:
      display_name: 风
      tts:
        delivery: 自以为是，语气轻快又满不在乎
        timbre: 飘忽清晰
        pace: 稍快
        pitch: 中
    star:
      display_name: 星星
      tts:
        delivery: 慈爱而威严，责备时坚定有分量
        timbre: 清澈沉稳
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 天上的宴席
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，太阳、月亮和风去雷叔叔和闪电姑姑家赴宴。母亲星星独自留在高高的天空中。她离我们非常遥远，只用一只明亮的小眼睛，等着三个孩子回家。
        - id: ch01-b02
          speaker: narrator
          text: 主人备下了丰盛的饭菜。太阳和风又贪吃又自私，只管自己吃得痛快，从没想过给母亲留下一口。温柔的月亮却一直惦记着她。每送来一道美味，月亮就取一点，悄悄藏在美丽的长指甲下面。这样一来，母亲也能尝到宴席的滋味了。
    - id: ch02
      title: 带回家的晚饭
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 星星守望了整整一夜。孩子们终于回来时，她便问道。
        - id: ch02-b02
          speaker: star
          text: 孩子们，你们给我带什么回来啦？
        - id: ch02-b03
          speaker: narrator
          text: 年纪最大的太阳先开了口。
        - id: ch02-b04
          speaker: sun
          text: 我可什么都没带。我是去和朋友们快活的，又不是专程替母亲带晚饭！
        - id: ch02-b05
          speaker: wind
          text: 母亲，我也没带东西。我只是出去找乐子，你怎么能指望我还替你收集一堆好吃的呢？
        - id: ch02-b06
          speaker: moon
          text: 母亲，拿一只盘子来吧，看看我给你留了什么。
        - id: ch02-b07
          speaker: narrator
          text: 月亮把双手放在盘子上方，轻轻一抖。美味的饭菜纷纷落下，摆成了一席前所未见的佳肴。
    - id: ch03
      title: 太阳和风的惩罚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 星星先转身面对太阳。
        - id: ch03-b02
          speaker: star
          text: 你跟朋友出去游玩，自己吃喝快活，却一次也没想起守在家里的母亲。我要惩罚你。从今以后，你的光芒会永远炽热灼人，碰到什么，就把什么烧得滚烫。人们会讨厌你。每当你出现，他们就要把脑袋蒙起来。
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 所以直到今天，太阳还是那么炎热。
        - id: ch03-b04
          speaker: narrator
          text: 星星随后转向风。
        - id: ch03-b05
          speaker: star
          text: 你只想着自己的乐趣，也把母亲忘得一干二净。现在听好你的惩罚。天气又热又干时，你总会不停地刮，把所有有生命的东西吹得干枯萎缩。从这一刻起，人们都会厌恶你，远远躲开你。
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 所以直到今天，热天里的风还是那么叫人难受。
    - id: ch04
      title: 月亮的祝福
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可星星转向月亮时，说话的语气完全不同。
        - id: ch04-b02
          speaker: star
          text: 女儿，你没有忘记母亲，还从自己享用的美食里给我留了一份。从今以后，你会永远清凉、宁静而明亮。你纯净的光辉绝不会灼伤谁，人们也会永远称颂你有福。
        - id: ch04-b03
          speaker: narrator
          text: 所以直到今天，月光依然那么柔和，那么清凉，也那么美丽。
