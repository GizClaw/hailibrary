        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    young_yogi:
      display_name: 年轻的修行者
      tts:
        delivery: 神秘而郑重，预言时字字清楚
        timbre: 清瘦沉静
        pace: 舒缓
        pitch: 中
    rasalu:
      display_name: 拉萨鲁王
      tts:
        delivery: 英武爽朗，意气昂扬，动怒时刚烈有力
        timbre: 明亮坚实
        pace: 适中偏快
        pitch: 中
    lona:
      display_name: 洛娜王后
      tts:
        delivery: 慈爱克制，悲伤中仍带王后的端庄
        timbre: 柔和丰润
        pace: 舒缓
        pitch: 中
    headless_corpse:
      display_name: 无头尸首
      tts:
        delivery: 阴郁坦率，像从坟墓深处讲述往事
        timbre: 干涩低沉
        pace: 缓慢
        pitch: 低
    cricket:
      display_name: 蟋蟀
      tts:
        delivery: 机灵爽快，答话带一点自信的诙谐
        timbre: 轻细清脆
        pace: 轻快
        pitch: 高
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 善良真挚，焦急时语速急促
        timbre: 清亮柔美
        pace: 适中偏快
        pitch: 中高
    princess_sister_1:
      display_name: 公主姐姐甲
      tts:
        delivery: 骄傲而带嘲弄
        timbre: 清亮
        pace: 适中
        pitch: 中高
    princess_sister_2:
      display_name: 公主姐姐乙
      tts:
        delivery: 轻慢而爱起哄
        timbre: 明快
        pace: 适中
        pitch: 中
    princess_sister_3:
      display_name: 公主姐姐丙
      tts:
        delivery: 挑剔而自负
        timbre: 清脆
        pace: 适中
        pitch: 中高
    sarkap:
      display_name: 萨尔卡普王
      tts:
        delivery: 狂妄阴狠，心虚时仍强作威严
        timbre: 粗重有压迫感
        pace: 适中
        pitch: 低
    mother_cat:
      display_name: 母猫
      tts:
        delivery: 焦急恳切，得救后真诚感激
        timbre: 柔细微颤
        pace: 适中偏快
        pitch: 中高
    bhaunr:
      display_name: 巴翁尔
