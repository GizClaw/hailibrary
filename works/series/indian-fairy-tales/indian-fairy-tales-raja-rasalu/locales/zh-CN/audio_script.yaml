    prisoner_1:
      display_name: 囚徒甲
      tts:
        delivery: 热切恭敬，带着获救的盼望
        timbre: 粗粝
        pace: 适中
        pitch: 中低
    prisoner_2:
      display_name: 囚徒乙
      tts:
        delivery: 热切恭敬，带着获救的盼望
        timbre: 清瘦
        pace: 适中
        pitch: 中
    prisoner_3:
      display_name: 囚徒丙
      tts:
        delivery: 热切恭敬，带着获救的盼望
        timbre: 沙哑
        pace: 适中
        pitch: 低
  chapters:
    - id: ch01
      title: 不见天日的王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位伟大的萨拉班王。他的王后名叫洛娜。王后去过许多圣祠，流着泪一次次祈求，只盼能有个孩子，可这个心愿始终没有实现。过了许久，神明终于答应赐给她一个儿子。
        - id: ch01-b02
          speaker: narrator
          text: 洛娜回到宫中。临近生产时，三位瑜伽修行者来到宫门前化缘，她便请他们说说孩子的命运。最年轻的修行者回答了她。
        - id: ch01-b03
          speaker: young_yogi
          text: 王后，这孩子是个男孩，长大后一定会成为大人物。可在十二年里，你绝不能看他的脸，他父亲也不能。期限未满，你们谁见了他，谁就会死。孩子一出生，马上把他送进地下密室，十二年不许见天日。等十二年过去，他可以出来，到河里沐浴，换上新衣，再来见你。他将名叫拉萨鲁王，声名传遍四方。
        - id: ch01-b04
          speaker: narrator
          text: 到了时候，一位俊美的小王子果然降生。父母把他藏进地下宫殿，安排乳母和仆从服侍，王子想要什么，那里都有。他们还送去一匹和王子同日出生的小马驹，以及宝剑、长矛和盾牌。这些兵器一直陪他等着，只为他将来走进人世的那一天。
        - id: ch01-b05
          speaker: narrator
          text: 拉萨鲁就在地下长大。他陪小马玩，跟鹦鹉说话，乳母们教给他王子该懂的一切。整整十一年，他没有见过阳光，却越长越高，越来越强壮，也一直安心过着这样的日子。可是第十二个年头刚开始，外面世界的声音传进这座宫殿般的牢笼，他听着听着，心里忽然再也待不住了。
        - id: ch01-b06
          speaker: rasalu
          text: 我非得出去看看，那些声音到底是从哪里来的！
        - id: ch01-b07
          speaker: narrator
          text: 乳母们劝他再等一年，他却大笑起来。
        - id: ch01-b08
          speaker: rasalu
          text: 不等了！谁来劝也别想让我继续留在这里！
        - id: ch01-b09
          speaker: narrator
          text: 他给阿拉伯骏马巴翁尔配好鞍辔，穿上亮闪闪的铠甲，骑马来到世上。乳母的话他倒还记得。走到河边，他下马进水，把自己和衣裳都洗得干干净净。
        - id: ch01-b10
          speaker: narrator
          text: 他衣衫整洁，容貌俊美，一颗心更是无所畏惧。一路骑到父亲的城中，他在井边坐下歇息。女人们正从井里汲水，再把盛满水的陶罐稳稳顶在头上，从他身旁走过。年轻王子一时兴起，捡起石子，把水罐一个个全打碎了。女人们浑身湿透，哭哭啼啼地跑进王宫告状，说井边坐着一位身披亮甲的威武少年，手腕上停着鹦鹉，身旁还有一匹神气的骏马。
        - id: ch01-b11
          speaker: narrator
          text: 萨拉班王马上猜到，是儿子提前出来了。他怕预言应验，不敢派卫兵把少年捉来，只安慰那些女人，让她们改用铁罐或铜罐。谁家没有，就去王库领一只新的。
        - id: ch01-b12
          speaker: narrator
          text: 女人们带着金属水罐回到井边。拉萨鲁看见了，暗自一笑，拉开强弓。尖箭穿过铁罐铜罐，竟像穿过陶罐一样容易。国王还是不肯召见他。拉萨鲁便跨上马，仗着青春与力量，直奔王宫。
        - id: ch01-b13
          speaker: narrator
          text: 他大步走进朝堂，恭恭敬敬地向父亲行礼。萨拉班王却吓得浑身发抖，连忙背过身，一句话也不回答。拉萨鲁隔着大殿，轻蔑地高声说道。
        - id: ch01-b14
          speaker: rasalu
          text: 我来向国王致意，并不是要伤害你！我到底做错了什么，竟叫你转身躲避？权杖和江山从来迷不住我。我要去找比它们更可贵的珍宝！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 他满怀辛酸和怒火，大步离去。经过王宫窗下时，母亲的哭声传了出来。那哭声叫他心软了，怒气也渐渐散去。父母都不肯见他，一阵深重的孤独压上心头。他悲伤地朝窗口呼唤。
        - id: ch01-b16
          speaker: rasalu
          text: 满怀忧愁的心啊，难道你给儿子的只有眼泪？你真是我的母亲吗？请为我刚刚开始的人生，也挂念一回吧！
          emotion: sad
        - id: ch01-b17
          speaker: lona
          text: 是的，我正是你母亲，虽然只能在这里流泪。请记住我的话。去做天下人的王吧，只愿你的心永远善良纯粹！
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 拉萨鲁得到了安慰，便去迎接自己的命运。骏马巴翁尔和鹦鹉从他出生起就陪着他，如今也一同出发。他们渐渐远去，洛娜王后一直在窗口望着，直到天边只剩一团尘烟。她把头伏在双手上，哭着说。
        - id: ch01-b19
          speaker: lona
          text: 我从未能亲眼为你欢喜的儿子啊！愿你远去扬起的尘烟遮住阳光，让白昼也暗下来。因为儿子离家的母亲，也不过是尘土！
          emotion: sad
    - id: ch02
      title: 墓地与烈火中的朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 拉萨鲁要去找萨尔卡普王下乔普尔棋。路上忽然雷电交加，风暴猛烈。他找不到别的藏身处，只好走进一片古老墓地。地上躺着一具无头尸首。四周太孤单了，连尸首都像个伴。拉萨鲁在它旁边坐下。
        - id: ch02-b02
          speaker: rasalu
          text: 近处没人，远方也没人，只有这具冰冷可怕的尸身。要是上天能叫他活过来，同他说说话，也比独自待着好。
        - id: ch02-b03
          speaker: narrator
          text: 无头尸首立刻坐了起来。拉萨鲁一点也不惊讶，又问它。
        - id: ch02-b04
          speaker: rasalu
          text: 风暴这样凶，西边又升起层层黑云。尸首啊，你的坟墓和裹尸布出了什么事，为什么死后也不能安息？
        - id: ch02-b05
          speaker: headless_corpse
          text: 我活着时也像你这样，歪戴头巾，摆出国王的模样。我自以为高人一等，只顾享乐，勇猛地打仗，恣意过完一生。如今我死了，罪孽重得像铅，压得我在墓中永远不得安宁！
        - id: ch02-b06
          speaker: narrator
          text: 黑暗凄凉的一夜慢慢过去，拉萨鲁一直坐在墓地中，和无头尸首说了整整一夜的话。清晨到来，他说自己该继续赶路了。尸首问他要去哪里，听说他要找萨尔卡普王下乔普尔棋，马上苦苦劝他别去。
        - id: ch02-b07
          speaker: headless_corpse
          text: 我是萨尔卡普的兄弟，最清楚他是什么人。他每天早饭前都要砍掉两三个人的脑袋，只为了取乐。有一天找不到别人，他就砍了我的头。他也一定会寻个借口砍你的。你若非去不可，就捡些墓地里的骨头做成骰子。这样，我兄弟那副魔骰才会失灵。不然每一局都是他赢。
        - id: ch02-b08
          speaker: narrator
          text: 拉萨鲁照它的话捡起几块骨头，削成骰子，放进口袋。告别尸首以后，他继续赶路。没多久，前方出现一片燃烧的森林，烈火中有人大声求救。
        - id: ch02-b09
          speaker: cricket
          text: 过路人，看在上天的分上，快救我离开火海！
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: 拉萨鲁走近一看，呼救的竟是一只小蟋蟀。他心地柔软，身体又强壮，立刻把它从火里救了出来。蟋蟀感激不尽，拔下一根触须交给恩人。
        - id: ch02-b11
          speaker: cricket
          text: 请收好这根触须。以后你遇到困难，只要把它投入火中，我马上就来帮你。
        - id: ch02-b12
          speaker: rasalu
          text: 你这么小，又能帮我什么忙？
        - id: ch02-b13
          speaker: narrator
          text: 拉萨鲁嘴上这样说，还是收好触须，继续上路。
    - id: ch03
      title: 七十位公主的难题
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 拉萨鲁来到萨尔卡普的城中。国王的七十个女儿一起出城迎接。七十位年轻美丽的姑娘无忧无虑，脸上全是笑容，一路欢声笑语。只有最小的公主看见拉萨鲁骑着伊拉克骏马巴翁尔，兴高采烈地奔向死亡，心中生出怜悯，连忙叫住他。
        - id: ch03-b02
          speaker: youngest_princess
          text: 骑灰马的俊美王子，快回头！不然就放低长矛，准备迎战。今天你会赔上脑袋！陌生人，如果你珍惜性命，我求你快回头！
        - id: ch03-b03
          speaker: rasalu
          text: 美丽的姑娘，我从远方而来，发誓要在爱情和战争中都得胜！萨尔卡普会后悔等到我。我会把他的头劈成四块，再做你的新郎，带你一同骑马离开！
        - id: ch03-b04
          speaker: narrator
          text: 小公主望着他的脸，见他俊美、勇敢又强壮，一下便爱上了他，情愿跟他走遍世界。其余六十九位公主嫉妒起来，一同嘲笑妹妹，又向拉萨鲁提出条件。
        - id: ch03-b05
          speakers: [princess_sister_1, princess_sister_2, princess_sister_3]
          ensemble: chorus
          text: 英勇的武士，别这么着急！你想娶我们的妹妹，就先照我们的吩咐办事。往后你可就是我们的妹夫了。
        - id: ch03-b06
          speaker: rasalu
          text: 美丽的姐姐们，只管说吧。什么差事我都能办到。
        - id: ch03-b07
          speaker: narrator
          text: 六十九位公主把一英担小米和一英担沙子混在一起，要他把两样东西分开。拉萨鲁想起蟋蟀，取出触须投入火中。空中立刻响起振翅的嗡鸣，一大群蟋蟀落到身旁，他救过的那只也在其中。
        - id: ch03-b08
          speaker: rasalu
          text: 请把小米和沙子分开。
        - id: ch03-b09
          speaker: cricket
          text: 就这点事？早知道活儿这么小，我何必叫来这么多弟兄！
        - id: ch03-b10
          speaker: narrator
          text: 蟋蟀大军马上动手，一夜之间就把小米和沙子分得清清楚楚。六十九位公主见难题已经解决，又叫拉萨鲁一个接一个替她们推秋千，非要让每个人都玩累才行。
        - id: ch03-b11
          speaker: rasalu
          text: 算上那边的小新娘，你们足有七十个人。我可不想一辈子都替姑娘推秋千！等最后一个推完，第一个早就又想玩了。不成。你们真想荡秋千，就七十个人全坐进一架秋千，让我一次推个够。
        - id: ch03-b12
          speaker: narrator
          text: 七十位公主果真挤进同一架秋千。拉萨鲁站在那里，身上的铠甲闪闪发亮。他把秋千绳系在自己的强弓上，将弓拉到极限，再猛然松手。秋千载着七十位无忧无虑、满脸笑容的姑娘，像一支箭一样直射空中。等它荡回来，拉萨鲁拔出利剑，一剑斩断绳索。七十个人全都一头栽下，有的碰得青肿，有的摔断了骨头。只有爱他的那位公主毫发无伤。她最后一个落下，正好跌在姐姐们身上。
        - id: ch03-b13
          speaker: narrator
          text: 拉萨鲁再向前走十五步，看见七十面鼓。每个来找国王下棋的人，都得依次敲响它们。他把鼓敲得震天动地，七十面鼓全破了。接着，他又把排成一行的七十面铜锣砸得粉碎。最小的公主是姐妹中唯一还能奔跑的人。她吓坏了，连忙逃去告诉父王。
        - id: ch03-b14
          speaker: youngest_princess
          text: 萨尔卡普，一位威猛的王子一路杀来，到处破坏！他把七十个姑娘一起荡上半空，又摔得我们东倒西歪。他打破所有鼓，也砸碎了铜锣。父亲，他一定会杀了你，再娶我做新娘！
          emotion: fearful
        - id: ch03-b15
          speaker: sarkap
          text: 傻姑娘，一点小事也值得你这样夸大？他见识我的勇武，铠甲都会吓得叮当乱响。等我吃完面包，就出去砍掉他的脑袋！
        - id: ch03-b16
          speaker: narrator
          text: 萨尔卡普嘴上说得勇猛又自负，其实早听过拉萨鲁的威名，心里十分害怕。他打听到拉萨鲁正在城中一位老妇人家歇脚，等候下乔普尔棋的时辰，便派奴仆送去一盘盘蜜饯和水果，装作盛情款待一位尊贵客人。可是那些食物里早已下了毒。
        - id: ch03-b17
          speaker: narrator
          text: 奴仆送来托盘，拉萨鲁傲然站起。
        - id: ch03-b18
          speaker: rasalu
          text: 回去告诉你们的主人，我和他没有交情。我是他誓不两立的仇敌，绝不会吃他的盐！
        - id: ch03-b19
          speaker: narrator
          text: 他把蜜饯扔给跟来的狗。那是萨尔卡普的狗，刚吃下食物便倒地死了。拉萨鲁顿时怒火中烧。
        - id: ch03-b20
          speaker: rasalu
          text: 回去告诉萨尔卡普！就算要杀仇敌，也不该暗中使诈。这绝不是勇士的作为！
          emotion: angry
    - id: ch04
      title: 三局乔普尔棋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 傍晚，拉萨鲁出门去同萨尔卡普下棋。经过陶窑时，他看见一只母猫焦躁地来回走动，怎么也停不下来，便问它出了什么事。
        - id: ch04-b02
          speaker: mother_cat
          text: 我的孩子在窑里一只没烧过的陶罐中。窑火刚点起来，它们就要被活活烤死了，我怎么可能安下心来！
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: 母猫的话打动了拉萨鲁。他找到陶匠，要把刚点起火的整座窑照原样买下。陶匠说，罐子没有烧完，就不知道能有多少完好出窑，价钱自然定不准。两人来回讨价还价，谈了很久，陶匠终于答应。拉萨鲁一个陶罐一个陶罐地搜过去，终于找到幼崽，把它们全送回母亲身边。母猫为了报答他的仁慈，送给他一只小猫。
        - id: ch04-b04
          speaker: mother_cat
          text: 把它放进口袋吧。以后遇到难处，它会帮你的忙。
        - id: ch04-b05
          speaker: narrator
          text: 拉萨鲁把小猫放进口袋，继续赴约。两个人坐下开棋以前，先一局一局定好赌注。萨尔卡普第一局押上自己的王国，第二局押上全天下的财富，第三局押上自己的头。拉萨鲁也照样定下三份赌注，第一局是他的全部武器，第二局是忠诚的骏马，第三局同样是自己的头。
        - id: ch04-b06
          speaker: narrator
          text: 拉萨鲁抽中先行，却忘了尸首的警告，用了萨尔卡普给的骰子。萨尔卡普还放出一只著名的老鼠，名叫多尔王。它绕着棋盘乱跑，偷偷撞乱棋子。拉萨鲁输掉第一局，交出了闪亮的铠甲。
        - id: ch04-b07
          speaker: narrator
          text: 第二局开始，多尔王又撞乱棋子。拉萨鲁再次落败，只得交出忠诚的坐骑。守在旁边的巴翁尔忽然开口，向主人喊道。
        - id: ch04-b08
          speaker: bhaunr
          text: 我生于海中，是用重金买来的。亲爱的王子，还请像从前一样信我！我能带你逃出这些诡计，不用马刺催促，也会像飞鸟一样越过千万里。若你一定要留下，下一局开始前，请把手伸进口袋！
        - id: ch04-b09
          speaker: narrator
          text: 萨尔卡普听见骏马给建议，皱起眉头，命奴仆把它牵走。拉萨鲁想起巴翁尔陪伴自己的漫长岁月，忍不住落下泪来。骏马再次高声劝他。
        - id: ch04-b10
          speaker: bhaunr
          text: 亲爱的王子，别哭！我不会吃陌生人给的粮，也不会跟他们走进陌生的马房。照我说的，把右手伸进口袋！
        - id: ch04-b11
          speaker: narrator
          text: 这句话唤醒了拉萨鲁的记忆。恰好口袋里的小猫也挣动起来，他终于想起尸首的警告和那副骨骰。勇气重新回到心中，他大胆地叫住萨尔卡普。
        - id: ch04-b12
          speaker: rasalu
          text: 我的马和武器暂时留在这里。等你连我的脑袋也赢走，再拿走它们不迟！
        - id: ch04-b13
          speaker: narrator
          text: 萨尔卡普见他忽然如此自信，心里更怕了。他叫宫中女子都换上最艳丽的衣裳，站在拉萨鲁面前，好让他在棋局中分心。拉萨鲁一眼也不看，只从口袋里掏出自己的骰子。
        - id: ch04-b14
          speaker: rasalu
          text: 前面一直用你的骰子。现在，该用我的了。
        - id: ch04-b15
          speaker: narrator
          text: 小猫走到窗口坐下，多尔王以往总从那里钻进来。棋局一开，拉萨鲁渐渐占了上风。萨尔卡普呼唤老鼠，可多尔王看见小猫，吓得一步也不敢向前。拉萨鲁赢回武器。下一局，萨尔卡普又叫多尔王捣乱，可小猫还守在那里。拉萨鲁再次取胜，夺回了骏马巴翁尔。
    - id: ch05
      title: 芒果树开花之时
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三局，也是最后一局，萨尔卡普使出了全部本领。他盯着骰子，开口念道。
        - id: ch05-b02
          speaker: sarkap
          text: 骰子啊，今天请助我一臂之力！和我对弈的确是个真正的男儿。赌注不是小事，生死都在这一局。看萨尔卡普怎样做，你们就为萨尔卡普怎样做！
        - id: ch05-b03
          speaker: rasalu
          text: 骰子啊，今天请助我一臂之力！和我对弈的确是个真正的男儿。赌注不是小事，生死都在这一局。看上天怎样做，你们就为上天怎样做！
        - id: ch05-b04
          speaker: narrator
          text: 宫中女子围成一圈，小猫守在窗口盯住多尔王。两人开始对弈。萨尔卡普先输掉王国，又输掉全天下的财富，最后连自己的头也输掉了。
        - id: ch05-b05
          speaker: narrator
          text: 就在这时，一名仆人进来禀报。
        - id: ch05-b06
          speaker: servant
          text: 陛下，宫里刚刚生下一位小公主。
        - id: ch05-b07
          speaker: narrator
          text: 接连遭受打击的萨尔卡普，把厄运怪在了刚出生的女儿身上。
        - id: ch05-b08
          speaker: sarkap
          text: 马上杀了她！她偏在这么凶恶的时辰出生，给父亲带来了厄运！
        - id: ch05-b09
          speaker: narrator
          text: 心地柔软而体魄强健的拉萨鲁，穿着闪亮的铠甲站了起来。
        - id: ch05-b10
          speaker: rasalu
          text: 不行，国王！这个孩子什么坏事也没做。把她许配给我吧。只要你凭自己珍视的一切发誓，再也不拿别人的脑袋作乔普尔棋的赌注，我现在就饶你一命！
        - id: ch05-b11
          speaker: narrator
          text: 萨尔卡普凭自己珍视的一切郑重起誓，今后再也不拿别人的头颅下棋。随后，他取来一根新折下的鲜嫩芒果树枝，又抱来刚刚出生的女婴，把树枝和孩子一起放在一只金盘上，郑重交给拉萨鲁。
        - id: ch05-b12
          speaker: narrator
          text: 拉萨鲁带着婴儿和芒果树枝离开王宫，途中遇见一群囚徒。他们一同向他呼喊。
        - id: ch05-b13
          speakers: [prisoner_1, prisoner_2, prisoner_3]
          ensemble: chorus
          text: 国王啊，你是高贵的猎鹰，旁人只是胆小的野禽。求你答应我们的请求，解开这些锁链。愿你永远享有福泽！
        - id: ch05-b14
          speaker: narrator
          text: 拉萨鲁听见了囚徒们的请求，也愿意帮助他们，便当场命令萨尔卡普解开锁链，释放所有囚徒。随后，他带着新生的柯基兰前往穆尔蒂丘陵，把孩子安置在一座地下宫殿里，又亲手将那根芒果树枝种在宫殿门前。
        - id: ch05-b15
          speaker: rasalu
          text: 十二年以后，芒果树会开花。到那时，我就回来迎娶柯基兰。
        - id: ch05-b16
          speaker: narrator
          text: 整整十二年过去，门前的芒果树终于绽放了花朵。拉萨鲁王如约回来，迎娶已经长大的柯基兰公主。她正是他同萨尔卡普王下乔普尔棋时赢来的新娘。
