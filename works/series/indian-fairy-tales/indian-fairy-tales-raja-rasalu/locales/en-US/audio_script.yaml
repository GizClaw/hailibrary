  chapters:
    - id: ch01
      title: The Prince Beneath the Ground
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago there lived a great ruler named Raja Salabhan. His queen was Lona. She had wept and prayed at many shrines because she had no child to bring joy to her eyes. At last, she was promised a son.
        - id: ch01-b02
          speaker: narrator
          text: >-
            As the time for the child's birth drew near, three Jogis came begging at the palace gate. Queen Lona asked what fate awaited her child, and the youngest Jogi gave his answer.
        - id: ch01-b03
          speaker: young_jogi
          text: >-
            Your child will be a boy, my Queen, and he will grow into a great man. But neither you nor his father must look upon his face for twelve years. If either of you sees him before those years have passed, you will surely die. As soon as he is born, send him to a cellar beneath the ground. He must not see daylight for twelve years. When the time is over, he may come out, bathe in the river, dress in new clothes, and visit you. His name will be Raja Rasalu, and people far and wide will know it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In time, a beautiful young prince was born. His parents hid him in an underground palace, where nurses and servants attended him and he had everything a king's son could want. They also sent him a newborn colt, along with a sword, a spear, and a shield for the day when he would go out into the world.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The boy played with his colt and talked to his parrot. His nurses taught him all that a king's son needed to know. For eleven long years, he lived far from daylight. He grew tall and strong, yet stayed content with his horse and his bird.
        - id: ch01-b06
          speaker: narrator
          text: >-
            But when his twelfth year began, Rasalu longed for a change. Sounds from the world outside reached his underground prison, and he loved to listen to them.
        - id: ch01-b07
          speaker: rasalu
          text: I have to go out and see where those voices come from!
        - id: ch01-b08
          speaker: nurse
          text: You must wait one more year. You cannot leave yet.
        - id: ch01-b09
          speaker: narrator
          text: Rasalu only laughed.
        - id: ch01-b10
          speaker: rasalu
          text: No! No man will keep me here any longer!
        - id: ch01-b11
          speaker: narrator
          text: >-
            He saddled his Arab horse, Bhaunr, put on his shining armor, and rode out into the world. Still, he remembered what his nurses had often told him. When he reached the river, he climbed down, entered the water, and washed himself and his clothes.
        - id: ch01-b12
          speaker: narrator
          text: >-
            With clean clothes, a fair face, and a brave heart, he rode on until he reached his father's city. He stopped to rest beside a well, where women were filling earthen pitchers. As they passed with the full vessels balanced on their heads, the high-spirited prince threw stones and smashed every pitcher.
        - id: ch01-b13
          speakers: [well_woman_1, well_woman_2, well_woman_3]
          ensemble: chorus
          text: >-
            A mighty young prince has drenched us and broken all our pitchers! He sits by the well in shining armor, with a parrot on his wrist and a splendid horse beside him. We were carrying full earthen vessels on our heads, and he shattered every one!
        - id: ch01-b14
          speaker: narrator
          text: >-
            The women went weeping to the palace with their complaint. Salabhan guessed at once that Rasalu had come out too soon. The Jogi had warned that he would die if he saw his son's face before twelve years had passed, so the king dared not send guards to seize the young offender and bring him to judgment.
        - id: ch01-b15
          speaker: salabhan
          text: >-
            Take comfort. Those who have no metal pitchers shall receive new ones from my treasury. Go back with vessels of iron and brass.
        - id: ch01-b16
          speaker: narrator
          text: >-
            When Rasalu saw them return with iron and brass pitchers, he laughed to himself. He bent his mighty bow, and his sharp arrows pierced the metal vessels as easily as clay.
    - id: ch02
      title: A Son Rides Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Still the king did not send for him. Proud of his youth and strength, Rasalu mounted Bhaunr and rode straight to the palace. He entered the audience hall, where his father sat trembling, and greeted him with every sign of respect. But Salabhan feared for his life. He quickly turned his back and gave no answer.
        - id: ch02-b02
          speaker: rasalu
          text: >-
            I came to greet you, King, not to hurt you. What have I done to make you turn away? Your throne and empire hold no charm for me. I will go and seek a prize more worthy than those!
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            Rasalu strode away, bitter and angry. As he passed beneath the palace windows, he heard his mother crying. The sound softened his heart, and his anger faded. Father and mother had both rejected him, and a deep loneliness came over him.
        - id: ch02-b04
          speaker: rasalu
          text: >-
            Is your heart crowned only with grief? Have you nothing but tears for your son? Are you truly my mother? Spare one thought for the life I have just begun!
          emotion: sad
        - id: ch02-b05
          speaker: lona
          text: >-
            Yes, I am your mother, though I weep. Hold fast to these words. Go and reign as king of all men, but keep your heart good and pure.
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: >-
            Her answer comforted Rasalu, and he prepared to seek his fortune in the world. He took Bhaunr and his parrot, the companions who had lived beside him since the day of his birth. Together, the three made a fine company as they set out.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Queen Lona watched them leave from her window. She kept watching until only a cloud of dust remained on the horizon. Then she bowed her head into her hands and wept.
        - id: ch02-b08
          speaker: lona
          text: >-
            Oh, my son, who never brought joy to my eyes, let the dust of your going rise and dim the sunlight. Let it darken the day, for a mother whose son is far away is no more than dust.
          emotion: sad
    - id: ch03
      title: Counsel from the Graveyard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Rasalu had set out to play chaupur with King Sarkap. During his journey, a fierce storm broke over him. Thunder rolled and lightning flashed, but he could find no shelter except an old graveyard. A headless corpse lay there on the ground. The place was so lonely that even the corpse felt like company, and Rasalu sat beside it.
        - id: ch03-b02
          speaker: rasalu
          text: >-
            There is no one near or far, only this cold and breathless corpse. If God would bring him back to life, at least I would have someone to talk to.
        - id: ch03-b03
          speaker: narrator
          text: >-
            At once, the headless corpse rose and sat beside him. Rasalu showed no surprise.
        - id: ch03-b04
          speaker: rasalu
          text: >-
            The storm is beating hard, and thick clouds are rising in the west. What troubles your grave and shroud, corpse? Why can you not rest?
        - id: ch03-b05
          speaker: headless_corpse
          text: >-
            When I lived, I was much like you. I wore my turban crooked like a king and held my head as high as any man. I enjoyed myself, fought my enemies bravely, and lived with a swagger. Now I am dead, but my sins weigh on me like lead. They will not let me rest in my grave.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The dark, dreary night passed while Rasalu talked with the headless corpse. At daybreak, Rasalu said he must continue his journey. The corpse asked where he was going.
        - id: ch03-b07
          speaker: rasalu
          text: I am going to play chaupur with King Sarkap.
        - id: ch03-b08
          speaker: headless_corpse
          text: >-
            Give up that plan. I am Sarkap's brother, and I know his ways. Every morning before breakfast, he cuts off the heads of two or three men for his own amusement. One day, when no one else was nearby, he cut off mine. He will find some excuse to take yours too. But if you are determined to play, gather bones from this graveyard and make dice from them. Those dice will rob my brother's enchanted dice of their power. Without them, he will always win.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Rasalu gathered some bones that lay around the graveyard and shaped them into dice, just as the corpse had advised. He slipped them safely into his pocket, said farewell to his strange companion, and continued on his way to play chaupur with King Sarkap.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Farther on, the tenderhearted and powerful prince came to a forest in flames. A voice called to him from the fire.
        - id: ch03-b11
          speaker: cricket
          text: Traveller, for God's sake, save me from the fire!
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: >-
            Rasalu turned toward the burning woods and discovered that the voice belonged to a tiny cricket. Small as it was, he snatched it from the flames and set it free. The grateful creature pulled out one of its feelers and offered it to him.
        - id: ch03-b13
          speaker: cricket
          text: >-
            Keep this feeler. If trouble ever finds you, put it into a fire. I will come at once to help you.
        - id: ch03-b14
          speaker: rasalu
          text: What help could a tiny creature like you give me?
        - id: ch03-b15
          speaker: narrator
          text: >-
            Rasalu smiled as he spoke, but he kept the feeler and went on his way.
    - id: ch04
      title: The Seventy Maidens
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When Rasalu reached King Sarkap's city, the king's seventy daughters came out to meet him. They were fair, merry, and careless, all smiles and laughter. But the youngest saw the gallant prince riding Bhaunr Iraqi gaily toward his death, and pity filled her heart.
        - id: ch04-b02
          speaker: youngest_princess
          text: >-
            Fair prince on the gray horse, turn back! Turn back, or lower your lance and prepare to fight. Your head will be the price today. If you love your life, stranger, please turn back!
        - id: ch04-b03
          speaker: narrator
          text: Rasalu smiled at her and answered lightly.
        - id: ch04-b04
          speaker: rasalu
          text: >-
            Fair maiden, I have traveled far, sworn to conquer in love and war. Sarkap will regret that I came. I will cut his head into four pieces, then ride away as a bridegroom with you beside me as my bride!
        - id: ch04-b05
          speaker: narrator
          text: >-
            The maiden looked into his face. He was so handsome, brave, and strong that she fell in love with him at once. She would gladly have followed him anywhere in the world. Her sixty-nine sisters grew jealous and laughed at her scornfully.
        - id: ch04-b06
          speakers: [maiden_1, maiden_2, maiden_3]
          ensemble: chorus
          text: >-
            Not so quickly, gallant warrior! If you mean to marry our sister, you must first do what we ask. After all, you will be our younger brother.
        - id: ch04-b07
          speaker: rasalu
          text: Fair sisters, give me your task. I will do it.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The sixty-nine maidens mixed a hundredweight of millet seed with the same weight of sand. They gave the heap to Rasalu and ordered him to separate every seed from the sand.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Rasalu remembered the cricket. He took the feeler from his pocket and pushed it into the fire. A great whirring filled the air. A vast flight of crickets landed around him, and among them was the little creature whose life he had saved.
        - id: ch04-b10
          speaker: rasalu
          text: Separate the millet seed from the sand.
        - id: ch04-b11
          speaker: cricket
          text: >-
            Is that all? If I had known the job was so small, I would never have gathered so many of my brothers!
        - id: ch04-b12
          speaker: narrator
          text: >-
            The whole flight of crickets went to work beside him. Before the night was over, they had separated every grain of millet from the great heap of sand.
        - id: ch04-b13
          speaker: narrator
          text: >-
            When the sixty-nine maidens saw that Rasalu had completed the task, they gave him another. He must swing each of them, one at a time, until every maiden was tired.
        - id: ch04-b14
          speaker: rasalu
          text: >-
            There are seventy of you if I count my little bride over there. I will not spend my whole life pushing girls on swings! By the time the last one has had a turn, the first will want another. No. If you want to swing, all seventy of you must climb onto one swing. Then I will see what I can do.
        - id: ch04-b15
          speaker: narrator
          text: >-
            All seventy maidens crowded onto a single swing. Rasalu stood in his shining armor and tied its ropes to his mighty bow. He pulled the bow to its fullest bend and released it. Like an arrow, the swing shot into the air, carrying the seventy laughing, careless maidens.
        - id: ch04-b16
          speaker: narrator
          text: >-
            As the swing came back, Rasalu drew his sharp sword and cut the ropes. All seventy maidens plunged headfirst to the ground. Some were bruised and some had broken bones. Only the maiden who loved Rasalu escaped without injury. She fell last, landed on top of her sisters, and came to no harm.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Rasalu strode fifteen paces farther and reached seventy drums. Every visitor who came to play chaupur with Sarkap had to beat them in turn. Rasalu struck them so loudly that every drum broke. Then he reached seventy gongs standing in a row, and hammered them until they cracked to pieces.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The youngest princess was the only sister still able to run. Terrified, she fled to her father.
        - id: ch04-b19
          speaker: youngest_princess
          text: >-
            Father, a mighty prince is riding this way and wrecking everything! He swung all seventy of us and threw us headfirst to the ground. He smashed your drums and broke your gongs. He will surely kill you and take me for his bride!
          emotion: fearful
        - id: ch04-b20
          speaker: sarkap
          text: >-
            Foolish girl, you make a great trouble out of a tiny thing. My courage will make his armor rattle with fear. As soon as I finish my meal, I will go out and cut off his head!
        - id: ch04-b21
          speaker: narrator
          text: >-
            Sarkap spoke boldly, but he had heard of Rasalu's fame and was truly very afraid. He learned that the prince was waiting at an old woman's house until the hour for chaupur. So he sent slaves there with trays of fruit and sweetmeats, treating Rasalu like an honored guest. The food was poisoned.
        - id: ch04-b22
          speaker: narrator
          text: Rasalu rose proudly when the slaves arrived.
        - id: ch04-b23
          speaker: rasalu
          text: >-
            Tell your master I want no friendship with him. He is my sworn enemy, and I will not eat his salt!
        - id: ch04-b24
          speaker: narrator
          text: >-
            Rasalu threw the sweetmeats to Sarkap's dog, which had followed the slaves. The dog ate them and died. Rasalu's anger flared.
        - id: ch04-b25
          speaker: rasalu
          text: >-
            Go back to Sarkap. Tell him Rasalu says there is no bravery in killing even an enemy through treachery.
          emotion: angry
    - id: ch05
      title: The Cat at the Kiln
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Evening came, and Rasalu set out to play chaupur with King Sarkap. On his way past the potters' kilns, he noticed a cat wandering back and forth. She could not keep still, so he asked what troubled her.
        - id: ch05-b02
          speaker: cat
          text: >-
            My kittens are inside an unbaked pot in that kiln. The fire has just been lit, and my children will be baked alive. How could I possibly rest?
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: >-
            Her words touched Rasalu's heart. He went straight to the potter and asked to buy the kiln exactly as it stood, with the fire already burning. The potter said he could not name a fair price until the firing was over, because he did not know how many pots would come out whole and how many would be broken. Rasalu kept bargaining with him until at last the potter agreed to sell.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Rasalu searched through the pots and returned the kittens to their mother. Grateful for his mercy, the cat gave him one of them.
        - id: ch05-b05
          speaker: cat
          text: >-
            Put this kitten in your pocket. When you are in difficulty, it will help you.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Rasalu tucked the kitten into his pocket and continued to the game.
        - id: ch05-b07
          speaker: narrator
          text: >-
            When Rasalu reached Sarkap and they were ready to sit down together, the king named his stakes. In the first game, he would risk his kingdom. In the second, all the wealth in the world. In the third, his own head. Rasalu matched him stake for stake. He put up his weapons first, his faithful horse second, and his own head last.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Rasalu had the first move. But he forgot the dead man's warning and played with dice supplied by Sarkap. The king also released his famous rat, Dhol Raja. It darted around the board and secretly knocked the chaupur pieces out of place. Rasalu lost the first game and surrendered his shining armor.
        - id: ch05-b09
          speaker: narrator
          text: >-
            They began the second game. Again Dhol Raja slipped around the board and upset the pieces. Rasalu lost once more and had to give up his faithful horse. Bhaunr stood nearby, and suddenly he found a voice.
        - id: ch05-b10
          speaker: bhaunr
          text: >-
            I was born of the sea and bought for a great price. Dear prince, trust me now as you always have. I can carry you far from these tricks, swift as a bird, for thousands upon thousands of miles. But if you must stay, put your hand into your pocket before you play again!
        - id: ch05-b11
          speaker: narrator
          text: >-
            Sarkap frowned when he heard the horse advising his master. He ordered his slaves to take Bhaunr away. As they came to lead off the faithful steed, Rasalu remembered all the years Bhaunr had spent beside him, and he could not hold back his tears.
        - id: ch05-b12
          speaker: bhaunr
          text: >-
            Do not weep, dear prince. I will not eat bread from a stranger's hand or be led into a stranger's stall. Take your right hand and put it where I told you.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Bhaunr's words stirred a memory. At that very moment, the kitten began to struggle inside Rasalu's pocket. Then he remembered everything: the corpse's warning and the dice made from dead men's bones. His courage rose again, and he called boldly to Sarkap.
        - id: ch05-b14
          speaker: rasalu
          text: >-
            Leave my horse and weapons here for now. You will have plenty of time to take them away after you win my head!
        - id: ch05-b15
          speaker: narrator
          text: >-
            Rasalu's confidence frightened Sarkap. Hoping to distract him from the board, the king ordered every woman in his palace to dress in her brightest clothes and stand before the prince. Rasalu did not even glance at them. He drew the bone dice from his pocket.
        - id: ch05-b16
          speaker: rasalu
          text: >-
            Until now, we have used your dice. This time, we will play with mine.
        - id: ch05-b17
          speaker: narrator
          text: >-
            The kitten took its place at the window where Dhol Raja usually entered, and the next game began. After a while, Sarkap saw Rasalu winning and called for his rat. Dhol Raja came to the window, spotted the kitten standing guard, and was too frightened to go any farther.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Rasalu won and reclaimed his weapons. They played next for Bhaunr. Once more Sarkap called the rat, and once more Dhol Raja stopped at the sight of the watchful kitten. Rasalu won the second stake and took back his Arab horse.
    - id: ch06
      title: The Last Game
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            For the third and final game, Sarkap called on every bit of skill he possessed.
        - id: ch06-b02
          speaker: sarkap
          text: >-
            Oh, molded pieces, favor me today! This is a true man I face, and the risk is no small thing. Life and death are at stake. Do what Sarkap does, for Sarkap's sake!
        - id: ch06-b03
          speaker: rasalu
          text: >-
            Oh, molded pieces, favor me today! This is a true man I face, and the risk is no small thing. Life and death are at stake. Do what Heaven does, for Heaven's sake!
        - id: ch06-b04
          speaker: narrator
          text: >-
            The game began. The palace women stood in a circle around the players, while the kitten watched Dhol Raja from the window. Sarkap lost first his kingdom, then the wealth of the whole world, and finally his head.
        - id: ch06-b05
          speaker: narrator
          text: >-
            At that moment, a servant entered with news.
        - id: ch06-b06
          speaker: servant
          text: A daughter has just been born to you, King Sarkap.
        - id: ch06-b07
          speaker: narrator
          text: Misfortune had overwhelmed Sarkap, and he answered bitterly.
        - id: ch06-b08
          speaker: sarkap
          text: >-
            Kill her at once! She was born at an evil moment, and she has brought her father bad luck!
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: Tenderhearted and strong, Rasalu rose in his shining armor.
        - id: ch06-b10
          speaker: rasalu
          text: >-
            No, King. The child has done nothing wrong. Give her to me as my future wife. Swear by everything you hold sacred that you will never again play chaupur for another man's head, and I will spare your life.
        - id: ch06-b11
          speaker: narrator
          text: >-
            Sarkap made a solemn vow never again to gamble for another person's head. Then he took a fresh mango branch and the newborn baby, placed them together on a golden dish, and gave them to Rasalu.
        - id: ch06-b12
          speaker: narrator
          text: >-
            Rasalu left the palace carrying the baby and the mango branch. On his way out, he met a band of prisoners, and they called to him together.
        - id: ch06-b13
          speakers: [prisoner_1, prisoner_2, prisoner_3]
          ensemble: chorus
          text: >-
            You are a royal hawk, great king, while all others are timid wild birds. Grant our request and break these chains. May you live forever blessed!
        - id: ch06-b14
          speaker: narrator
          text: >-
            Rasalu listened to their plea and ordered Sarkap to set them free.
        - id: ch06-b15
          speaker: narrator
          text: >-
            Then Rasalu traveled to the Murti Hills. He placed the newborn princess, Kokilan, in an underground palace and planted the mango branch beside its door.
        - id: ch06-b16
          speaker: rasalu
          text: >-
            In twelve years, this mango tree will blossom. Then I will return and marry Kokilan.
        - id: ch06-b17
          speaker: narrator
          text: >-
            Twelve years passed, and the mango tree began to flower. Raja Rasalu returned and married Princess Kokilan, the child he had won from Sarkap in their game of chaupur.
