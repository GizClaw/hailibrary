audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    dantal:
      display_name: 丹塔尔国王
      tts:
        delivery: 威严直率，对儿子既疼爱又不失长者的严厉
        timbre: 浑厚沉稳
        pace: 适中，训诫时短促有力
        pitch: 低
    majnun:
      display_name: 马杰农王子
      tts:
        delivery: 真诚率直，年轻时自信，受惊时慌张急促
        timbre: 清朗明亮
        pace: 适中，激动时加快
        pitch: 中
    husain:
      display_name: 侯赛因·马哈马特
      tts:
        delivery: 可靠坦率，说话自然利落
        timbre: 温和清晰
        pace: 适中
        pitch: 中低
    mansukh:
      display_name: 蒙苏克国王
      tts:
        delivery: 关切而务实，困惑时带着父亲的焦躁
        timbre: 厚实温和
        pace: 适中
        pitch: 中低
    laili:
      display_name: 莱莉
      tts:
        delivery: 执着深情，劝告时急切坚定，临危时果断勇敢
        timbre: 清澈柔韧
        pace: 适中，哀求时稍快
        pitch: 中高
    fakir:
      display_name: 法基尔
      tts:
        delivery: 神秘平静，指点时清楚而不疾不徐
        timbre: 空灵柔和
        pace: 舒缓
        pitch: 中
    rohu:
      display_name: 罗胡鱼
      tts:
        delivery: 老实敏感，受惊后慌乱不安
        timbre: 低柔略显笨重
        pace: 适中，惊慌时加快
        pitch: 中低
    crow:
      display_name: 乌鸦
      tts:
        delivery: 机警干脆，受惊时尖促
        timbre: 清亮略沙哑
        pace: 偏快
        pitch: 中高
    jackal:
      display_name: 胡狼
      tts:
        delivery: 谨慎多疑，逃走时惊恐急切
        timbre: 粗哑紧绷
        pace: 偏快
        pitch: 中
    snake:
      display_name: 巨蛇
      tts:
        delivery: 冷静笃定，说话简洁直接
        timbre: 低沉平滑
        pace: 舒缓
        pitch: 低
    attendant:
      display_name: 宫廷侍从
      tts:
        delivery: 恭敬清楚，禀告时简洁
        timbre: 清晰平稳
        pace: 适中
        pitch: 中
    khuda:
      display_name: 胡达
      tts:
        delivery: 庄严平静，话语简明而不可违逆
        timbre: 深远浑厚
        pace: 舒缓
        pitch: 低
    chumun:
      display_name: 楚曼·巴萨
      tts:
        delivery: 表面和善，真实意图冷酷傲慢
        timbre: 沉厚带冷意
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 梦中的名字
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位丹塔尔国王，拥有数不清的卢比、士兵和骏马。他只有一个儿子，名叫马杰农。王子俊秀极了，牙齿洁白，嘴唇鲜红，蓝眼睛，红润的脸颊，还有一头红发和白皙的皮肤。
        - id: ch01-b02
          speaker: narrator
          text: 马杰农最喜欢跟宰相的儿子侯赛因·马哈马特玩。丹塔尔国王的花园广阔得仿佛没有尽头，里面长满各种树木，鲜花处处开放，枝头结着甜美的果实。两个孩子常常带着小刀在园中跑来跑去，想吃什么果子，就亲手割下来。国王还专门请了老师，教他们读书写字。
        - id: ch01-b03
          speaker: narrator
          text: 后来，他们都长成了英俊的青年。有一天，王子去请示父亲。
        - id: ch01-b04
          speaker: majnun
          text: 父王，我想和侯赛因·马哈马特出门打猎。
        - id: ch01-b05
          speaker: narrator
          text: 丹塔尔国王答应了。两人备好坐骑，也带齐打猎要用的一切，便离开王宫，一路追逐猎物。他们走了很远，最后来到法拉纳国。可这一路并没有多少收获，只猎到几只胡狼和飞鸟。
        - id: ch01-b06
          speaker: narrator
          text: 法拉纳国的蒙苏克国王有个女儿，名叫莱莉。她有一双褐色眼睛，乌黑的长发，生得非常美丽。
        - id: ch01-b07
          speaker: narrator
          text: 就在马杰农到来前不久，莱莉熟睡时，胡达派来一位天使。天使化成男子，在梦里告诉她，她应当嫁给马杰农王子，不能嫁给别人，这是胡达的旨意。
        - id: ch01-b08
          speaker: narrator
          text: 莱莉醒来，把梦里天使说的话告诉了父亲。父亲根本没放在心上。可从此以后，她翻来覆去只念着同一句话。
        - id: ch01-b09
          speaker: laili
          text: 马杰农，马杰农，我要马杰农。
        - id: ch01-b10
          speaker: narrator
          text: 哪怕坐下吃饭，她也不停地念。父亲听得越来越烦恼。
        - id: ch01-b11
          speaker: mansukh
          text: 这个马杰农到底是谁？从来没人听说过他呀！
        - id: ch01-b12
          speaker: laili
          text: 他就是我要嫁的人。胡达命我只能嫁给马杰农，谁也不能替代他。
        - id: ch01-b13
          speaker: narrator
          text: 莱莉已经有些疯疯癫癫了。这时，马杰农和侯赛因正好来到法拉纳国。两人骑马游猎，莱莉也骑马出来兜风，跟在他们身后，嘴里还是不停地念着那个名字。
        - id: ch01-b14
          speaker: laili
          text: 马杰农，马杰农，我要马杰农。
        - id: ch01-b15
          speaker: majnun
          text: 是谁在叫我？
        - id: ch01-b16
          speaker: narrator
          text: 莱莉抬起眼，只看了王子一眼，就深深爱上了他。她心里明白，这一定就是胡达说她应当嫁的马杰农。她赶紧回去告诉父亲。
        - id: ch01-b17
          speaker: laili
          text: 父王，我要嫁给刚到您国中的那位王子。我知道，他就是马杰农。
        - id: ch01-b18
          speaker: mansukh
          text: 好，那就让他做你的丈夫。明天我们去问他。
        - id: ch01-b19
          speaker: narrator
          text: 莱莉心急如焚，也只好等到第二天。谁知就在那天夜里，王子离开了法拉纳国。
    - id: ch02
      title: 穿过鱼腹的旅程
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 莱莉听说马杰农走了，彻底发了疯。父亲、母亲和仆人说什么，她都不听。她独自走进丛林，从一片树林流浪到另一片树林，离故乡越来越远。整整十二年，她始终只念着一句话。
        - id: ch02-b02
          speaker: laili
          text: 马杰农，马杰农，我要马杰农。
        - id: ch02-b03
          speaker: narrator
          text: 十二年后，莱莉遇见一个法基尔。那其实是一位天使，她却不知道。
        - id: ch02-b04
          speaker: fakir
          text: 你为什么总念着马杰农，说你一定要他？
        - id: ch02-b05
          speaker: laili
          text: 我是法拉纳国王的女儿。我一定要找到马杰农王子。请告诉我，他的国家在哪里？
        - id: ch02-b06
          speaker: fakir
          text: 我看你永远也走不到。那里离得太远，路上还隔着许多河流。
        - id: ch02-b07
          speaker: narrator
          text: 莱莉说，无论多远，她都不在乎，她非见到马杰农不可。法基尔这才为她指路。
        - id: ch02-b08
          speaker: fakir
          text: 走到婆吉勒提河边，你会看见一条罗胡大鱼。求它带你去马杰农的国家，不然你永远也到不了。
        - id: ch02-b09
          speaker: narrator
          text: 莱莉一直走，终于到了婆吉勒提河。河里果然有一条巨大的罗胡鱼。她刚走近，鱼正好张嘴打哈欠。莱莉立刻跳进去，顺着喉咙落进鱼腹。她在那片黑暗里生活下来，嘴里仍然不停地念着马杰农。日子一年年过去，竟又过了整整十二年。
        - id: ch02-b10
          speaker: narrator
          text: 罗胡鱼听见肚子里响个不停，吓得魂都快没了。它不知道自己吞下了什么，只能拼命顺流而下，一刻也不敢停。游着游着，它渐渐累了，速度越来越慢。一只乌鸦正好飞来，落在鱼背上，哇哇叫了两声。
        - id: ch02-b11
          speaker: rohu
          text: 乌鸦先生，劳驾你替我看看，我肚子里究竟有什么？里面闹得太厉害了。
        - id: ch02-b12
          speaker: crow
          text: 好，你把嘴张到最大，我飞进去瞧一眼。
        - id: ch02-b13
          speaker: narrator
          text: 鱼张开大嘴。乌鸦飞进去，转眼又冲了出来。
        - id: ch02-b14
          speaker: crow
          text: 你肚子里藏着一个罗刹！
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: 乌鸦说完便飞走了，罗胡鱼一点也没得到安慰。它继续往前游，终于进入马杰农王子的国土，停了下来。一只胡狼走到河边喝水。
        - id: ch02-b16
          speaker: rohu
          text: 胡狼，请你告诉我，我肚子里到底藏着什么？
        - id: ch02-b17
          speaker: jackal
          text: 不钻进去看看，我怎么会知道？
        - id: ch02-b18
          speaker: narrator
          text: 罗胡鱼又把嘴张大。胡狼跳进它的喉咙，很快就蹿了出来，脸上全是恐惧。
        - id: ch02-b19
          speaker: jackal
          text: 里面是个罗刹！我再不逃，它恐怕就要吃掉我了！
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: 胡狼拔腿跑了。接着，一条巨蛇来到河边。
        - id: ch02-b21
          speaker: rohu
          text: 蛇啊，求你看看我肚子里是什么。那东西一直哗啦乱响，还不停念着马杰农，说她要马杰农。
        - id: ch02-b22
          speaker: snake
          text: 把嘴张开，我下去看个明白。
        - id: ch02-b23
          speaker: narrator
          text: 蛇钻进去，出来后告诉罗胡鱼，里面有个罗刹。
        - id: ch02-b24
          speaker: snake
          text: 让我剖开你的肚子，它就能出来。
        - id: ch02-b25
          speaker: rohu
          text: 可那样我会死啊！
        - id: ch02-b26
          speaker: snake
          text: 不会。我有一种药，能让你好起来。
        - id: ch02-b27
          speaker: narrator
          text: 罗胡鱼这才同意。蛇找来一把刀，剖开鱼腹，莱莉一下跳了出来。
    - id: ch03
      title: 二十四年后的婚礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时的莱莉已经非常衰老。她在丛林里走了十二年，又在罗胡鱼腹中生活了十二年。她早已失去美貌，连牙齿也全掉光了。
        - id: ch03-b02
          speaker: narrator
          text: 巨蛇让莱莉坐到自己背上，把她驮进这个国家，放在地上。她继续不停地走，一路还是念着马杰农。最后，她终于到了马杰农的宫廷。这时，马杰农已经做了国王。几个人听见这个陌生的老妇人一遍遍呼喊国王的名字，便上前问她究竟要什么。
        - id: ch03-b03
          speaker: laili
          text: 我要见马杰农国王。
        - id: ch03-b04
          speaker: attendant
          text: 外面有个老妇人，说一定要见您。
        - id: ch03-b05
          speaker: majnun
          text: 我不能离开这里，把她领进来吧。
        - id: ch03-b06
          speaker: narrator
          text: 侍从把莱莉带了进来。王子问她有什么心愿。
        - id: ch03-b07
          speaker: laili
          text: 我要嫁给你。二十四年前，你到过我父王的法拉纳国。我那时就想嫁给你，你却走了。后来我发了疯，四处流浪了这么多年，只为了找到你。
        - id: ch03-b08
          speaker: majnun
          text: 好。
        - id: ch03-b09
          speaker: laili
          text: 请你向胡达祈祷，求他让我们重新年轻。等恢复青春，我们就成婚。
        - id: ch03-b10
          speaker: narrator
          text: 王子照她的话向胡达祈祷。胡达回答了他。
        - id: ch03-b11
          speaker: khuda
          text: 去碰莱莉的衣裳。衣裳会烧起来。火一燃起，你们两人就会重新年轻。
        - id: ch03-b12
          speaker: narrator
          text: 王子伸手一碰，莱莉的衣裳果真燃起火来。两个人也一同恢复了青春。人们摆下盛大的筵席，为他们举行婚礼。婚后，夫妻俩前往法拉纳国看望莱莉的父母。
        - id: ch03-b13
          speaker: narrator
          text: 蒙苏克国王和王后太思念女儿，流了无数眼泪，双双哭瞎了眼睛。她的父亲也像女儿从前呼唤马杰农那样，一遍遍念着莱莉的名字。莱莉回到家，看见父母已经失明，便向胡达祈祷，求他让二老重新看见。胡达答应了她。
        - id: ch03-b14
          speaker: narrator
          text: 父母的眼睛重新看见了。两人一认出莱莉，便紧紧抱住女儿，亲了又亲。宫中再次为她和马杰农举行婚礼，人人欢天喜地。夫妻俩没有马上离开。他们陪伴蒙苏克国王夫妇住了整整三年，才回到丹塔尔国王身边，又幸福地生活了一段时日。
        - id: ch03-b15
          speaker: narrator
          text: 夫妻俩常常出门打猎，也经常从一个国家游历到另一个国家，骑马兜风散心。
    - id: ch04
      title: 灰烬与白色小狗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 有一天，他们来到一片丛林前。
        - id: ch04-b02
          speaker: majnun
          text: 我们从这片林子穿过去吧。
        - id: ch04-b03
          speaker: laili
          text: 不，别进去。只要穿过这片丛林，我一定会遇到不幸。
        - id: ch04-b04
          speaker: narrator
          text: 马杰农笑了笑，还是走进了丛林。两人在林中前行时，胡达想试一试王子到底有多爱妻子。若是莱莉死去，他会不会悲痛，又会不会另娶别人？
        - id: ch04-b05
          speaker: narrator
          text: 胡达派一位天使化成法基尔。天使走到莱莉面前，把粉末撒在她脸上。刹那间，她倒在地上，化成一小堆灰烬。
        - id: ch04-b06
          speaker: narrator
          text: 马杰农亲眼看着心爱的莱莉变成一小堆灰烬，悲痛欲绝。他没有留在林中，径直回到父亲身边。此后很久很久，无论父亲还是别人怎样劝慰，他一句也听不进去。许多年过去，他才渐渐振作，又和侯赛因到父亲那座美丽的花园里散步。
        - id: ch04-b07
          speaker: narrator
          text: 丹塔尔国王希望儿子再娶一位妻子，马杰农却不肯。
        - id: ch04-b08
          speaker: majnun
          text: 我只认莱莉是我的妻子，别的女人，我一个也不会娶。
          emotion: sad
        - id: ch04-b09
          speaker: dantal
          text: 你怎么还能娶莱莉？她已经死了，再也回不到你身边了。
        - id: ch04-b10
          speaker: majnun
          text: 那我就永远不娶。
        - id: ch04-b11
          speaker: narrator
          text: 其实，莱莉仍活在丈夫留下她的那片丛林里。马杰农刚刚离开，法基尔便把她的骨灰一点点收拢起来，仔细清理干净。他又把泥土和水混进灰里，用双手捏出一个女人的形体。随后，胡达把生命送进这具身体，莱莉就这样恢复了人形。
        - id: ch04-b12
          speaker: narrator
          text: 可她又成了一个丑陋的老妇人，鼻子长得吓人，牙齿像獠牙。除了这口牙，她跟当年从鱼腹里出来时一模一样。她住在丛林里，不吃不喝，只是不停地哭喊马杰农的名字。
        - id: ch04-b13
          speaker: narrator
          text: 终于，化作法基尔的天使向胡达请求。
        - id: ch04-b14
          speaker: fakir
          text: 她一直坐在林中，不吃不喝，永远哭喊着要马杰农。这样下去有什么用呢？让我带她去见王子吧。
        - id: ch04-b15
          speaker: khuda
          text: 可以。但你要告诉她，马杰农若见了她害怕，她就不能开口。只要他害怕，第二天她会变成一只白色小狗。她必须进王宫，等到马杰农爱上她，分食物给她，还让她睡在床上，她才能恢复人形。
        - id: ch04-b16
          speaker: narrator
          text: 天使再次化成法基尔，把莱莉带到丹塔尔国王的花园，把胡达的命令全告诉了她。
        - id: ch04-b17
          speaker: fakir
          text: 留在这里，等马杰农来散步，你就现身。可他若怕你，千万别同他说话。第二天你会变成白色小狗，照我刚才说的做，才能恢复人形。
        - id: ch04-b18
          speaker: narrator
          text: 莱莉躲进花园的高草里，等着马杰农和侯赛因进园。这时丹塔尔国王已经年迈。侯赛因本来和王子同岁，看起来却苍老得多，因为马杰农成婚时曾恢复过青春。
        - id: ch04-b19
          speaker: narrator
          text: 两个朋友像小时候一样摘果子吃，只是如今直接用牙咬，不再拿小刀割。马杰农一边咬果子，一边和侯赛因说话。他转脸看向朋友，忽然发现莱莉正跟在侯赛因身后。
        - id: ch04-b20
          speaker: majnun
          text: 啊，快看！你身后跟着什么东西？那一定是罗刹，或者是恶魔，它要吃掉我们！
          emotion: fearful
        - id: ch04-b21
          speaker: narrator
          text: 莱莉睁大眼睛，像在苦苦哀求，年迈而急切的身体不停发抖。这反倒让马杰农更害怕。
        - id: ch04-b22
          speaker: majnun
          text: 是罗刹！真的是罗刹！
          emotion: fearful
        - id: ch04-b23
          speaker: narrator
          text: 他和侯赛因飞快逃回王宫，莱莉也消失在林中。马杰农告诉父亲，花园里来了个罗刹或恶魔，想吃掉他们。
        - id: ch04-b24
          speaker: dantal
          text: 胡说！两个成年男子，竟让一个老乳母或者老法基尔吓成这样。就算她真是罗刹，也不会吃你们。
        - id: ch04-b25
          speaker: narrator
          text: 丹塔尔国王原本一点也不信，以为儿子只是看错了。直到侯赛因作证，说王子讲的句句属实，他才命人搜遍花园，寻找那个可怕的老妇人。可大家从高草到树丛都找过了，还是什么也没找到。国王说儿子被吓成这样实在愚蠢。从那以后，马杰农再也不肯去花园散步。
        - id: ch04-b26
          speaker: narrator
          text: 第二天，莱莉变成一只漂亮的小狗，独自走进王宫。马杰农很快就喜欢上了她。从那以后，她无论到哪里都跟着王子。王子出门打猎，她也一路随行，还会替他追赶和捕捉猎物。马杰农吃牛奶、面包或其他食物时，总会分一份给她。到了夜里，小狗便睡在他的床上。
    - id: ch05
      title: 红果中的莱莉
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 有一天夜里，小狗突然不见了。躺在原处的，竟是花园里那个吓坏马杰农的小老太婆。王子认定她是罗刹、恶魔，或是什么要吃他的怪物。
        - id: ch05-b02
          speaker: majnun
          text: 你到底想要什么？别吃我，求你别吃我！
          emotion: fearful
        - id: ch05-b03
          speaker: laili
          text: 你不认得我了吗？我是你的妻子莱莉，我只想嫁给你。你还记得那片丛林吗？我求你别进去，还说自己会遭遇不幸。后来一个法基尔往我脸上撒了粉末，我就化成了灰烬。
        - id: ch05-b04
          speaker: laili
          text: 是胡达重新赐给我生命，又把我带到这里。在那以前，我在林中待了很久，每天哭着找你。如今我不得不变成小狗。只要你愿意娶我，我就不会再做小狗了。
        - id: ch05-b05
          speaker: majnun
          text: 我怎么能娶你这样一个老太婆？你不可能是莱莉。你一定是来吃我的罗刹或恶魔！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 马杰农怕得要命。天一亮，老妇人又变回小狗。王子赶紧去找父亲，把昨夜的一切说了出来。
        - id: ch05-b07
          speaker: dantal
          text: 老妇人，又是老妇人！你整天只想着老妇人。你这样强壮，怎么这么容易受惊？
        - id: ch05-b08
          speaker: narrator
          text: 不过，国王看出儿子确实惊恐万分，也深信老妇人还会回来，便教他该怎样回答。
        - id: ch05-b09
          speaker: dantal
          text: 你就告诉她，只要她能重新变成年轻姑娘，你便娶她。她现在是老太婆，你当然没法娶。
        - id: ch05-b10
          speaker: narrator
          text: 当天夜里，马杰农浑身发抖地躺在床上。小狗消失了，小老太婆再次躺在那里哭喊。
        - id: ch05-b11
          speaker: laili
          text: 马杰农，我要嫁给你。这么多年，我一直爱着你。我还在父王身边做少女时，就已经知道你了，可你那时根本不认识我。要不是你忽然离开，我们早该成婚。为了找到你，我走过了漫长的岁月。
          emotion: sad
        - id: ch05-b12
          speaker: majnun
          text: 好。只要你能重新变成年轻姑娘，我就娶你。
        - id: ch05-b13
          speaker: laili
          text: 这很容易，胡达会让我恢复青春。两天以后，你去花园，会看见一枚美丽的果子。把它摘下来，带进房间，亲手轻轻切开。一定要独自打开，不能让父亲或任何人留在身边，因为我会赤身裸体地待在果子里面，没有衣服可穿。
        - id: ch05-b14
          speaker: narrator
          text: 第二天早晨，莱莉又化成小狗，消失在花园里。马杰农把她说的话全部告诉父亲。国王叫他照办。
        - id: ch05-b15
          speaker: narrator
          text: 两天后，王子和侯赛因走进花园，果然看见一枚又大又美的红果子。
        - id: ch05-b16
          speaker: majnun
          text: 啊，不知道我的妻子是不是真的在这枚果子里。
        - id: ch05-b17
          speaker: narrator
          text: 侯赛因催他摘下来看看，王子却坚持先告诉父亲。
        - id: ch05-b18
          speaker: dantal
          text: 一定就是这枚果子，去把它摘下来。
        - id: ch05-b19
          speaker: narrator
          text: 马杰农回到园里，从果梗上折下红果，又来央求父亲。
        - id: ch05-b20
          speaker: majnun
          text: 请您陪我进房间，看着我切开它吧。我不敢一个人打开，万一里面藏着要吃我的罗刹呢？
          emotion: fearful
        - id: ch05-b21
          speaker: dantal
          text: 不行。记住，莱莉会赤身裸体，你必须独自进去。就算果子里真有罗刹，也不要怕。我守在门外，你只要大声叫我，我立刻进来，它就吃不了你。
        - id: ch05-b22
          speaker: narrator
          text: 马杰农独自进了房间，双手捧着果子，吓得浑身发抖。他还是拿起刀，小心翼翼地切了下去。果子刚一裂开，莱莉便从里面走了出来。她不但恢复了青春，而且比从前任何时候都更加美丽。王子看见她美得惊人，整个人向后一仰，当场昏倒在地。
        - id: ch05-b23
          speaker: narrator
          text: 莱莉摘下他的头巾，像裹纱丽一样缠在自己身上，因为她确实一丝不挂。随后，她叫来丹塔尔国王，伤心地问他。
        - id: ch05-b24
          speaker: laili
          text: 马杰农为什么倒下了？为什么不和我说话？过去他从来不怕我，也已经见过我许多次了。
          emotion: sad
        - id: ch05-b25
          speaker: dantal
          text: 是因为你太美了。你比从前美丽得多，他才会昏倒。不过，他很快就会醒来，而且一定会很高兴。
        - id: ch05-b26
          speaker: narrator
          text: 国王取来清水，和莱莉一起替马杰农洗脸，又喂他喝了几口。王子终于坐了起来。
        - id: ch05-b27
          speaker: laili
          text: 你为什么会昏倒？难道没看出我是莱莉吗？
        - id: ch05-b28
          speaker: majnun
          text: 啊，我认出来了，你就是回到我身边的莱莉。可你的眼睛变得美丽极了，我一看见就昏了过去。
        - id: ch05-b29
          speaker: narrator
          text: 大家欢喜极了。丹塔尔国王命人敲响全国所有的鼓，奏起所有的乐器，又摆下盛大的婚宴。他赏赐仆人，还送给法基尔们许多大米和数不清的卢比。
    - id: ch06
      title: 邪恶国王的花园
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 两人幸福地生活了一段时间。一天，他们同骑一匹马出门兜风，只带着一个马夫。走着走着，他们来到另一个王国，看见一座美丽的花园。
        - id: ch06-b02
          speaker: majnun
          text: 我们一定要进去看看。
        - id: ch06-b03
          speaker: laili
          text: 不，不能进去。那是楚曼·巴萨的花园，他是个邪恶透顶的国王。
        - id: ch06-b04
          speaker: narrator
          text: 马杰农执意要进去。无论莱莉怎样劝，他还是下马看花。这时，莱莉看见楚曼·巴萨迎面走来。从那人的眼神里，她看出他想杀死马杰农，再把自己抢走。
        - id: ch06-b05
          speaker: laili
          text: 快走，我们快离开！不要靠近那个坏人。我看得出，也感觉得到，他会杀死你，再把我抢走。
        - id: ch06-b06
          speaker: majnun
          text: 别胡说。我倒觉得他是个好国王。何况他已经走得这么近，我现在也走不掉了。
        - id: ch06-b07
          speaker: laili
          text: 那么，宁可死的是你，也不能是我。我要是第二次被杀，胡达不会再赐我生命。可你若被杀，我还能让你活过来。
        - id: ch06-b08
          speaker: narrator
          text: 楚曼·巴萨已经来到跟前。在马杰农眼中，他的神情十分和善。可他一边和王子说话，一边突然拔出弯刀，一刀砍下了马杰农的头。
        - id: ch06-b09
          speaker: narrator
          text: 莱莉一动不动地坐在马上。邪恶的国王向她走来。
        - id: ch06-b10
          speaker: laili
          text: 你为什么杀死我的丈夫？
        - id: ch06-b11
          speaker: chumun
          text: 因为我要把你带走。
        - id: ch06-b12
          speaker: laili
          text: 你办不到。
        - id: ch06-b13
          speaker: chumun
          text: 我当然办得到。
        - id: ch06-b14
          speaker: laili
          text: 那你就来带我走吧。
        - id: ch06-b15
          speaker: narrator
          text: 楚曼·巴萨凑到马前，伸手想抓住莱莉，把她抱下来。莱莉却从口袋里抽出一把小刀。刀身原来只有手掌那么宽，刹那间自行展开，变得很长。她挥臂一扫，刀锋刚碰到楚曼·巴萨，他的头便滚落在地。
        - id: ch06-b16
          speaker: narrator
          text: 莱莉滑下马，走到丈夫的尸身旁。她从小指内侧的指甲尖一直割到掌心，鲜血立刻涌出，像能治百病的药。她把马杰农的头安回肩上，又把疗伤的血涂满断口。
        - id: ch06-b17
          speaker: narrator
          text: 马杰农醒了过来。
        - id: ch06-b18
          speaker: majnun
          text: 这一觉睡得真舒服，怎么像是睡了好几年？
        - id: ch06-b19
          speaker: narrator
          text: 他站起身，看见莱莉的坐骑旁躺着国王的尸体。
        - id: ch06-b20
          speaker: majnun
          text: 那是什么？
        - id: ch06-b21
          speaker: laili
          text: 那就是杀了你、还想抢走我的邪恶国王。事情全像我事先说的一样。
        - id: ch06-b22
          speaker: majnun
          text: 是谁杀了他？
        - id: ch06-b23
          speaker: laili
          text: 是我。让你重新活过来的人，也是我。
        - id: ch06-b24
          speaker: majnun
          text: 既然你会救人，也把这个可怜的人救活吧。
        - id: ch06-b25
          speaker: laili
          text: 不行。他是个恶人，活过来还会设法害你。
        - id: ch06-b26
          speaker: narrator
          text: 马杰农还是不停请求。他明明刚被楚曼·巴萨杀死，却一再为这个邪恶的国王求情，诚恳地求了很久。莱莉始终不愿让仇人复活，可丈夫不肯放弃，她最后只得答应。
        - id: ch06-b27
          speaker: laili
          text: 那好。你骑上马，和马夫一起走得远远的。
        - id: ch06-b28
          speaker: majnun
          text: 我离开以后，你怎么办？我不能把你一个人留在这里。
        - id: ch06-b29
          speaker: laili
          text: 我能照顾自己。可这个人太邪恶，你留在附近，他说不定还会再杀你一次。
        - id: ch06-b30
          speaker: narrator
          text: 马杰农这才和马夫骑马走到很远的地方，停下来等她。莱莉独自留在尸身旁，把邪恶国王的头端端正正安回肩上。她再次挤压手指上的伤口，让几滴药一般的鲜血流出来，仔细涂在刀锋斩过的地方。
        - id: ch06-b31
          speaker: narrator
          text: 她刚看见国王睁眼，立刻转身飞奔。楚曼·巴萨在后面追，却怎么也追不上。莱莉跑到丈夫身边，纵身跃上马背，坐在他身后。三个人策马疾驰，飞快赶回丹塔尔国王的宫殿。
    - id: ch07
      title: 最珍贵的妻子
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 回到宫中，马杰农把发生的一切告诉父亲。丹塔尔国王又惊恐又愤怒。
        - id: ch07-b02
          speaker: dantal
          text: 幸亏你有这样一位妻子！你为什么不肯听她的话？要不是莱莉，你现在已经死了。
          emotion: angry
        - id: ch07-b03
          speaker: narrator
          text: 国王为庆贺儿子和莱莉终于平安归来，再次摆下盛大的筵席，请宫中所有人都来一同欢庆。他又拿出许许多多卢比，赏给各处的法基尔们。
        - id: ch07-b04
          speaker: narrator
          text: 从此以后，丹塔尔国王把莱莉看得无比珍贵，真心疼爱她，恨不得把世上所有好东西都送给她。他为莱莉和儿子修建了一座富丽堂皇的宫殿。宫殿周围有大片土地和美丽的花园，园里的一切都只供他们享用。国王又赐给两人巨额财富和成群的仆人，让他们什么也不缺。
        - id: ch07-b05
          speaker: narrator
          text: 不过，国王也定下了严格的规矩。除了马杰农和莱莉自己的仆人，任何外人都不准踏进那座宫殿和花园。马杰农和莱莉也不能离开，只能住在国王为他们建造的地方。
        - id: ch07-b06
          speaker: dantal
          text: 莱莉实在太美了，说不定还会有人为了抢走她，再来杀死我的儿子。
