  chapters:
    - id: ch01
      title: Laili's Long Search
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king named Dantal. He possessed a great many rupees, soldiers, and horses. His only son was Prince Majnun, a handsome boy with white teeth, red lips, blue eyes, red cheeks, red hair, and fair skin. Majnun's dearest playmate was Husain Mahamat, the Wazir's son. King Dantal's garden was enormous and filled with delicious fruit, flowers, and trees. The boys carried little knives there, cut the ripe fruit, and ate it together. The king also gave them a teacher, who taught them both to read and write.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When the boys had grown into fine young men, Majnun went to his father.
        - id: ch01-b03
          speaker: majnun
          text: Husain Mahamat and I want to go hunting.
        - id: ch01-b04
          speaker: narrator
          text: >-
            King Dantal gave them permission. The two young men prepared their horses and everything else they needed for the hunt. They hunted all the way to the Phalana country, but for all their searching, they found only jackals and birds.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Phalana was ruled by Munsuk Raja. His daughter, Laili, was beautiful, with brown eyes and black hair. Some time before Majnun arrived, Khuda sent an angel to her in a dream. The angel appeared as a man and told her that Khuda commanded her to marry Prince Majnun and no one else.
        - id: ch01-b06
          speaker: narrator
          text: >-
            When Laili woke, she told her father about the angel who had visited in her sleep. Munsuk Raja paid no attention to the story. From that time onward, she repeated only one thing. Even when she sat down to eat, the same words came from her lips.
        - id: ch01-b07
          speaker: laili
          text: Majnun, Majnun. I want Majnun.
        - id: ch01-b08
          speaker: narrator
          text: Her father grew thoroughly vexed.
        - id: ch01-b09
          speaker: munsuk_raja
          text: Who is this Majnun? I have never even heard of him!
        - id: ch01-b10
          speaker: laili
          text: >-
            He is the man I must marry. Khuda told me I may marry no one else.
        - id: ch01-b11
          speaker: narrator
          text: By then, Laili was half mad.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Meanwhile, Majnun and Husain Mahamat reached Phalana and rode through the country hunting. Laili also came out on horseback to enjoy the air. She happened to ride behind the two friends, repeating her endless call as she went. Prince Majnun heard his name and turned around.
        - id: ch01-b13
          speaker: majnun
          text: Who keeps calling me?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Laili looked at him, and the moment she saw him, she fell deeply in love. She told herself that this must be the Prince Majnun whom Khuda had commanded her to marry. Then she rode home to her father.
        - id: ch01-b15
          speaker: laili
          text: >-
            Father, I want to marry the prince who has come here. I know he is my Prince Majnun.
        - id: ch01-b16
          speaker: munsuk_raja
          text: Very well. You shall marry him. We will ask him tomorrow.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Laili was terribly impatient, but she agreed to wait until the next day. As it happened, Majnun left Phalana that very night. When Laili heard he was gone, she went completely mad. Nothing her father, mother, or servants said could reach her. She left them all and went into the jungle. From one jungle she wandered into another, traveling farther and farther from her own country. For twelve years she roamed, always calling for Majnun.
        - id: ch01-b18
          speaker: narrator
          text: >-
            At last she met a fakir. He was really an angel, though she did not know it.
        - id: ch01-b19
          speaker: angel
          text: Why do you keep calling, “Majnun, Majnun. I want Majnun”?
        - id: ch01-b20
          speaker: laili
          text: >-
            I am the daughter of Phalana's king, and I am searching for Prince Majnun. Please tell me where his kingdom lies.
        - id: ch01-b21
          speaker: angel
          text: >-
            I doubt you will ever reach it. It is very far away, and many rivers stand between you and his country.
        - id: ch01-b22
          speaker: narrator
          text: Laili said the distance did not matter. She had to see Majnun.
        - id: ch01-b23
          speaker: angel
          text: >-
            Then listen. At the Bhagirathi River, you will find a great Rohu fish. You must get that fish to carry you, or you will never arrive.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Laili walked on and on until at last she reached the Bhagirathi River. A huge Rohu fish was there, yawning just as she arrived. Without waiting, Laili jumped down his open throat and landed in his stomach. Even inside the fish, she kept calling, “Majnun, Majnun.” The Rohu was so alarmed that he swam downriver as fast as he could. Little by little he grew tired and slowed down. Then a crow flew over, perched on his back, and called, “Caw, caw.”
        - id: ch01-b25
          speaker: rohu
          text: Oh, Mr. Crow, please look inside me and find out what is making that noise.
        - id: ch01-b26
          speaker: crow
          text: Open your mouth wide, then. I will fly down and see.
        - id: ch01-b27
          speaker: narrator
          text: The crow flew inside, then darted out again.
        - id: ch01-b28
          speaker: crow
          text: There is a Rakshas in your stomach!
        - id: ch01-b29
          speaker: narrator
          text: >-
            The crow flew away, and his news did nothing to comfort the poor Rohu. The fish swam on and on until he finally reached Prince Majnun's country. There he stopped. A jackal came down to drink, and the Rohu begged him to discover what was rattling about inside and making such a noise.
        - id: ch01-b30
          speaker: jackal
          text: How could I know without going in to look?
        - id: ch01-b31
          speaker: narrator
          text: The Rohu opened wide, and the jackal jumped down his throat. He soon sprang out, badly frightened.
        - id: ch01-b32
          speaker: jackal
          text: >-
            You have a Rakshas in there! I must run before it eats me too.
          emotion: fearful
        - id: ch01-b33
          speaker: narrator
          text: >-
            The jackal fled. Next came an enormous snake, and the fish told him about the rattling voice that kept calling for Majnun.
        - id: ch01-b34
          speaker: snake
          text: Open wide. I will go down and find out what it is.
        - id: ch01-b35
          speaker: narrator
          text: The snake went inside and returned.
        - id: ch01-b36
          speaker: snake
          text: >-
            There is a Rakshas in your stomach. Let me cut you open, and it will come out.
        - id: ch01-b37
          speaker: rohu
          text: But if you cut me open, I will die!
          emotion: fearful
        - id: ch01-b38
          speaker: snake
          text: >-
            No, you will not. I have medicine that will make you well again.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Trusting the snake's promise, the Rohu agreed. The snake fetched a knife and cut the fish open, and out jumped Laili. As promised, the snake had medicine to make the Rohu well again.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Laili was an old woman now. She had wandered through the jungles for twelve years, then spent another twelve years living inside the Rohu. She was no longer beautiful, and she had lost her teeth. The snake took her on his back, carried her into the country, and put her down. Laili went on alone until she reached Majnun's courthouse. Majnun was sitting there as king. Some men heard the old woman crying his name and came to ask what she wanted.
        - id: ch01-b41
          speaker: laili
          text: I want King Majnun.
        - id: ch01-b42
          speaker: courtier
          text: There is an old woman outside asking for you.
        - id: ch01-b43
          speaker: majnun
          text: I cannot leave this place. Bring her in.
        - id: ch01-b44
          speaker: narrator
          text: They brought Laili before him, and he asked what she wanted.
        - id: ch01-b45
          speaker: laili
          text: >-
            I want to marry you. Twenty-four years ago, you came to my father's country, Phalana. I wanted to marry you then, but you left. I went mad and have wandered all these years searching for you.
        - id: ch01-b46
          speaker: majnun
          text: Very well.
        - id: ch01-b47
          speaker: laili
          text: >-
            Pray to Khuda to make us young again. Then we can be married.
        - id: ch01-b48
          speaker: narrator
          text: Majnun then prayed, and Khuda answered him.
        - id: ch01-b49
          speaker: khuda
          text: >-
            Touch Laili's clothes. They will catch fire, and while they burn, both of you will become young again.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Majnun touched Laili's clothes, and flames sprang up around them. While the clothes burned, both Laili and Majnun became young again. Great feasts were held, and at last they were married. Afterward, they traveled together to the Phalana country to see Laili's father and mother.
    - id: ch02
      title: The Test in the Jungle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Laili's father and mother had wept so much for their missing daughter that both had become blind. Her father spent his days repeating, “Laili, Laili, Laili.” When she came home and saw their blindness, she prayed for Khuda to give them back their sight. Khuda answered her prayer. The moment her parents could see Laili, they wrapped their arms around her and kissed her. Then the whole wedding was celebrated again amid great rejoicing.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Majnun and Laili stayed with Munsuk Raja and his wife for three full years. Then they returned to King Dantal and lived very happily with him for some time. They went out hunting together and often traveled from one country to another to enjoy the fresh air and amuse themselves along the way.
        - id: ch02-b03
          speaker: narrator
          text: One day Majnun pointed toward a jungle.
        - id: ch02-b04
          speaker: majnun
          text: Let us ride through there.
        - id: ch02-b05
          speaker: laili
          text: No, please. If we enter that jungle, something bad will happen to me.
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: >-
            Majnun only laughed at the warning and entered the jungle. As the couple traveled through it, Khuda decided to test how deeply Majnun loved his wife. Would he be very sorry if Laili died? Would he choose another wife? To find out, Khuda sent one of his angels into the jungle in the shape of a fakir. The angel approached Laili and threw powder into her face. In an instant she fell to the ground as a little heap of ashes.
        - id: ch02-b07
          speaker: narrator
          text: >-
            When Majnun saw his beloved Laili turned to ashes, sorrow and grief overwhelmed him. He went straight home to his father, and for a long, long time no one could comfort him. A great many years passed before he grew more cheerful and happy. At last, he began walking again with Husain Mahamat in his father's beautiful garden. King Dantal thought it was time for his son to take another wife.
        - id: ch02-b08
          speaker: majnun
          text: Laili is the only wife I will ever have. I will marry no other woman.
        - id: ch02-b09
          speaker: king_dantal
          text: How could you marry Laili? She is dead, and she will never return.
        - id: ch02-b10
          speaker: majnun
          text: Then I will have no wife at all.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Meanwhile, Laili was alive in the very jungle where Majnun had left her ashes. As soon as he was gone, the fakir gathered those ashes and cleaned them carefully. He mixed clay and water into them and shaped the mixture into the figure of a woman. Khuda sent life into that figure, and Laili had a human body once more. But now she was a hideous old woman, with a long, long nose and teeth like tusks. She stayed in the jungle without eating or drinking and called endlessly for Majnun.
        - id: ch02-b12
          speaker: narrator
          text: At last the angel appealed to Khuda.
        - id: ch02-b13
          speaker: angel
          text: >-
            What good is there in leaving her here forever, crying for Majnun without food or drink? Let me take her to him.
        - id: ch02-b14
          speaker: khuda
          text: >-
            You may take her. But if Majnun is frightened when he sees her, she must not speak to him. The next day she will become a little white dog. She must go to the palace. She will regain her human form only when Majnun loves her, feeds her from his own food, and lets her sleep in his bed.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The angel returned in the fakir's shape and carried Laili all the way to King Dantal's garden. He told her this was Khuda's command. She must stay hidden until Majnun came walking there, then show herself to him. If he was afraid, she must not speak. On the following day she would become a little white dog. The fakir also told her exactly what she must do in that shape to become human again.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Laili hid in the tall grass until Majnun and Husain Mahamat came walking. King Dantal was very old now. Husain was Majnun's age, but he looked much older because Majnun had been made young again. The two friends picked fruit as they had in childhood, though now they bit into it instead of using little knives.
        - id: ch02-b17
          speaker: narrator
          text: >-
            As Majnun ate and talked with his friend, he turned and saw Laili walking behind Husain.
        - id: ch02-b18
          speaker: majnun
          text: Look behind you! A Rakshas is following us. It must mean to eat us!
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: >-
            Laili looked at him beseechingly and trembled with age and eagerness. That only terrified him more.
        - id: ch02-b20
          speaker: majnun
          text: It is a Rakshas! A Rakshas!
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: >-
            Majnun and Husain raced away toward the palace. As they fled, Laili disappeared into the jungle. The two men ran straight to King Dantal, and Majnun told his father that a Rakshas or demon had entered the garden to eat them.
        - id: ch02-b22
          speaker: king_dantal
          text: >-
            Nonsense! Two grown men frightened by an old nurse or a fakir? Even if it had been a Rakshas, it would not have eaten you.
        - id: ch02-b23
          speaker: narrator
          text: >-
            King Dantal did not believe his son had seen anything at all. Only when Husain said Majnun had told the exact truth did the king agree to have the garden searched. The searchers looked everywhere but found no terrible old woman. King Dantal told his son he had been very silly to show so much fear. Even so, Prince Majnun refused ever to walk in the garden again.
        - id: ch02-b24
          speaker: narrator
          text: >-
            The next day Laili became a pretty little white dog. In that shape, she entered the palace, and Majnun soon grew very fond of her. The little dog followed him everywhere. She went hunting with him and helped him catch his game. Majnun fed her milk, bread, and whatever else he happened to be eating. Each night, she slept beside him in his bed.
    - id: ch03
      title: The Fruit in the Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            One night, the little dog vanished. In her place lay the old woman who had frightened Majnun in the garden. Certain that some dreadful demon had come to eat him, he cried out in terror.
        - id: ch03-b02
          speaker: majnun
          text: What do you want? Please, do not eat me!
          emotion: fearful
        - id: ch03-b03
          speaker: laili
          text: >-
            Do you not know me? I am your wife, Laili. I want to marry you again. You insisted on entering that jungle after I begged you not to go and warned you I would be harmed. A fakir threw powder in my face, and I became ashes. Khuda restored my life and brought me here after I spent so long in the jungle crying for you. Now I must be a little dog, but if you marry me, I will no longer have that shape.
        - id: ch03-b04
          speaker: majnun
          text: >-
            How could I marry an old woman? How could you possibly be Laili? You are a Rakshas that has come to eat me!
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: >-
            In the morning, the old woman had changed back into the little dog. Majnun went straight to his father and told him everything that had happened during the night.
        - id: ch03-b06
          speaker: king_dantal
          text: >-
            An old woman again! You think of nothing else. How can a strong man be frightened so easily?
        - id: ch03-b07
          speaker: narrator
          text: >-
            King Dantal could see that his son was truly terrified and fully expected the old woman to return that night. So he gave Majnun some advice. If she came back, he should say that he would marry her only if she could make herself a young woman again. How could he marry her while she looked so old?
        - id: ch03-b08
          speaker: narrator
          text: >-
            That night, Majnun lay trembling. Once more the old woman appeared where the dog had been.
        - id: ch03-b09
          speaker: laili
          text: >-
            Majnun, Majnun, I want to marry you. I have loved you through all these long years. I knew of you when I was still a young girl in my father's kingdom, though you knew nothing of me. We would have married then if you had not left so suddenly. I have followed you ever since.
        - id: ch03-b10
          speaker: majnun
          text: If you can become a young woman again, then I will marry you.
        - id: ch03-b11
          speaker: laili
          text: >-
            That is easy. Khuda will make me young again. In two days, go into the garden. You will find a beautiful fruit there. Pick it, carry it to your room, and cut it open very gently with your own hands. You must be entirely alone. Do not open it near your father or anyone else, because I will be inside with no clothes on.
        - id: ch03-b12
          speaker: narrator
          text: >-
            When morning came, Laili took the little dog's form once more and disappeared into the garden. Majnun repeated every word to his father. King Dantal told him to do everything the old woman had commanded. Two days later, Majnun walked in the garden with Husain Mahamat. There, just as Laili had promised, they found a large and lovely red fruit.
        - id: ch03-b13
          speaker: majnun
          text: I wonder whether my wife is really inside that fruit.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Husain wanted Majnun to gather the fruit at once and see what was inside. Majnun refused to touch it until he had spoken with his father.
        - id: ch03-b15
          speaker: king_dantal
          text: That must be the fruit. Go and gather it.
        - id: ch03-b16
          speaker: narrator
          text: Majnun broke the fruit from its stalk, then asked his father to come to his room.
        - id: ch03-b17
          speaker: majnun
          text: >-
            I am afraid to open it alone. What if a Rakshas comes out and eats me?
          emotion: fearful
        - id: ch03-b18
          speaker: king_dantal
          text: >-
            No. Remember, Laili will have no clothes. You must go in alone. I will wait outside the door. If a Rakshas appears, call loudly, and I will come before it can eat you.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Majnun carried the fruit into his room and began cutting it open very gently. His hands trembled, and his whole body shook with fear. As soon as the fruit opened, Laili stepped out. She was young again, and far more beautiful than she had ever been. Her beauty was so great that Majnun fell backward and fainted on the floor.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Laili removed his turban and wrapped it around herself like a sari. Then she called King Dantal.
        - id: ch03-b21
          speaker: laili
          text: >-
            Why has Majnun fallen like this? Why will he not answer me? He was never afraid of me before, and he has seen me so many times.
          emotion: sad
        - id: ch03-b22
          speaker: king_dantal
          text: >-
            You are far more beautiful than you ever were. That is why he fainted. He will be happy again in a moment.
        - id: ch03-b23
          speaker: narrator
          text: >-
            King Dantal fetched some water. He and Laili bathed Majnun's face with it, then gave him some to drink. Little by little, the prince recovered, opened his eyes, and sat up again.
        - id: ch03-b24
          speaker: laili
          text: Why did you faint? Could you not see that I am Laili?
        - id: ch03-b25
          speaker: majnun
          text: >-
            I do see. You are my Laili, returned to me. But your eyes have become so wonderfully beautiful that I fainted when I saw them.
        - id: ch03-b26
          speaker: narrator
          text: >-
            Everyone rejoiced together. King Dantal ordered every drum in the place to be beaten and all the other musical instruments to be played. A grand wedding feast was held. The king gave presents to the servants, and he gave rice and great quantities of rupees to the fakirs.
    - id: ch04
      title: The Wicked Raja
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After they had lived happily for some time, Majnun and Laili went out together to enjoy the fresh air. They rode on the same horse and took only one groom with them. Their journey brought them into another kingdom, where they came upon a beautiful garden.
        - id: ch04-b02
          speaker: majnun
          text: We must go in and see that garden.
        - id: ch04-b03
          speaker: laili
          text: >-
            No, we must not. It belongs to Raja Chumman Basa, and he is a wicked man.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Majnun insisted on going inside. Laili tried every argument she could, but he would not listen. He got down from the horse and began looking at the flowers. While he was admiring them, Laili saw Raja Chumman Basa coming toward them. One look into his eyes told her what he intended to do. He meant to kill her husband and seize her.
        - id: ch04-b05
          speaker: laili
          text: >-
            Come away now. Do not go near that man. I see it in his eyes and feel it in my heart. He will kill you so he can take me.
          emotion: fearful
        - id: ch04-b06
          speaker: majnun
          text: >-
            That is nonsense. I believe he is a good Raja. Besides, he is already too close for me to escape.
        - id: ch04-b07
          speaker: laili
          text: >-
            Then it is better for you to be killed than me. If I die a second time, Khuda will not restore my life. But if you are killed, I can bring you back.
        - id: ch04-b08
          speaker: narrator
          text: >-
            By then, Chumman Basa had come very near. He seemed pleasant enough to Majnun, just as the prince had expected. The Raja spoke with him for a moment. Then, without warning, he drew his scimitar and cut off Majnun's head with a single blow.
        - id: ch04-b09
          speaker: narrator
          text: Laili stayed perfectly still on the horse as the Raja approached her.
        - id: ch04-b10
          speaker: laili
          text: Why did you kill my husband?
        - id: ch04-b11
          speaker: chumman_basa
          text: Because I intend to take you.
        - id: ch04-b12
          speaker: laili
          text: You cannot take me.
        - id: ch04-b13
          speaker: chumman_basa
          text: Yes, I can.
        - id: ch04-b14
          speaker: laili
          text: Then come and take me.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Chumman Basa stepped right up to the horse and held out his hand. He meant to take Laili's hand and lift her down. But Laili reached into her pocket first. She drew out a tiny knife, no longer than the width of her hand. In one instant, the little blade unfolded until it was astonishingly long. Laili made one great sweep with her arm. The long knife touched Chumman Basa, and his head came off.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Laili slipped down from the horse and hurried to Majnun's body. On the inside of her hand, she cut her little finger in a straight line from the top of the nail to her palm. Blood gushed from the cut like healing medicine. Laili carefully set Majnun's head back on his shoulders. Then she smeared her healing blood all over the wound, and Majnun opened his eyes.
        - id: ch04-b17
          speaker: majnun
          text: >-
            What a wonderful sleep! I feel as though I have slept for years.
        - id: ch04-b18
          speaker: narrator
          text: He rose and noticed the Raja's body beside Laili's horse.
        - id: ch04-b19
          speaker: majnun
          text: What is that?
        - id: ch04-b20
          speaker: laili
          text: >-
            That is the wicked Raja who killed you so he could seize me, exactly as I warned you.
        - id: ch04-b21
          speaker: majnun
          text: Who killed him?
        - id: ch04-b22
          speaker: laili
          text: I did. I am also the one who restored your life.
        - id: ch04-b23
          speaker: majnun
          text: If you know how, please bring the poor man back to life.
        - id: ch04-b24
          speaker: laili
          text: No. He is wicked, and he will try to harm you again.
        - id: ch04-b25
          speaker: narrator
          text: >-
            Majnun kept asking her to restore the wicked Raja. He pleaded for such a long time and so earnestly that, at last, Laili agreed to do it.
        - id: ch04-b26
          speaker: laili
          text: Get on the horse and ride far away with the groom.
        - id: ch04-b27
          speaker: majnun
          text: What will happen to you if I leave? I cannot go without you.
        - id: ch04-b28
          speaker: laili
          text: >-
            I can protect myself. But that man may kill you again if you stay nearby.
        - id: ch04-b29
          speaker: narrator
          text: >-
            Majnun mounted the horse. He and the groom rode a long way off, then stopped to wait for Laili. She set the wicked Raja's head straight upon his shoulders. Next, she squeezed the wound in her little finger until a small amount of the blood medicine came out. She carefully spread it across the place where her knife had passed.
        - id: ch04-b30
          speaker: narrator
          text: >-
            The moment Laili saw Chumman Basa opening his eyes, she began to run. The Raja jumped up and chased her. Laili ran and ran so swiftly that he could not catch her. She reached Majnun's horse, sprang up behind her husband, and held on. Then Majnun, Laili, and the groom rode faster and faster until they were safely inside King Dantal's palace.
    - id: ch05
      title: Safe at Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At the palace, Majnun told his father everything. King Dantal was horrified and angry.
        - id: ch05-b02
          speaker: king_dantal
          text: >-
            How fortunate you are to have such a wife! Why did you refuse to listen to her? Without Laili, you would be dead now.
        - id: ch05-b03
          speaker: narrator
          text: >-
            In gratitude for his son's safety, the king held a great feast and gave many, many rupees to the fakirs. After that, he made much of Laili. He loved her dearly and felt he could never do enough for her. He built a splendid palace for Laili and Majnun, surrounded by a great stretch of land and lovely gardens. He gave the couple great wealth and a host of servants to wait upon them.
        - id: ch05-b04
          speaker: narrator
          text: >-
            But King Dantal allowed no one except their own servants to enter the palace or its gardens. He would not permit Majnun to go outside, and he would not permit Laili to leave either.
        - id: ch05-b05
          speaker: king_dantal
          text: >-
            Laili is so beautiful that someone might kill my son to carry her away.
