audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    pigeon:
      display_name: The Pigeon
      tts:
        delivery: sensible and good-natured
        timbre: soft and clear
        pace: measured
        pitch: medium-high
    crow:
      display_name: The Crow
      tts:
        delivery: sly and restless
        timbre: raspy and bright
        pace: brisk
        pitch: medium
    cook:
      display_name: The Cook
      tts:
        delivery: practical and stern
        timbre: full and textured
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Crow's Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, the Bodhisatta was a pigeon. A rich man's cook hung a nest basket for him in the kitchen to earn merit.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, a greedy crow flew by. He saw all kinds of fine food lying around the kitchen and longed for some. He wondered how in the world he could get it. At last, he had a plan.
        - id: ch01-b03
          speaker: narrator
          text: >-
            When the pigeon flew out to find food, the crow followed close behind.
        - id: ch01-b04
          speaker: pigeon
          text: >-
            What do you want, Mr. Crow? You and I don't eat the same kind of food.
        - id: ch01-b05
          speaker: crow
          text: >-
            But I like you and your ways! Let me be your friend, and we'll eat together.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The pigeon agreed, and they went on together. The crow pretended to eat beside him, but now and then he turned back, pecked apart a heap of cow dung, and swallowed a fat worm.
        - id: ch01-b07
          speaker: narrator
          text: >-
            When his belly was full, the crow flew up and called boldly.
        - id: ch01-b08
          speaker: crow
          text: >-
            Mr. Pigeon, what a long meal! You must stop sometime. Let's go home before it's too late.
        - id: ch01-b09
          speaker: narrator
          text: >-
            They went home together. When the cook saw that his pigeon had brought a friend, he hung up another basket for the crow.
    - id: ch02
      title: The Fish in the Kitchen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A few days later, a great supply of fish came to the rich man's kitchen. How the crow longed for a taste! From early morning, he lay there in his basket, groaning loudly and making a great noise.
        - id: ch02-b02
          speaker: pigeon
          text: Come, Sir Crow. Let's get our breakfast.
        - id: ch02-b03
          speaker: crow
          text: >-
            Oh dear! My stomach! I have terrible indigestion.
        - id: ch02-b04
          speaker: pigeon
          text: >-
            Nonsense. Crows don't get indigestion. A lamp wick may stay in your stomach awhile, but you digest anything else at once. Do as I say. Don't act this way just because you saw a little fish.
        - id: ch02-b05
          speaker: crow
          text: >-
            Why say that, master? I do have indigestion.
        - id: ch02-b06
          speaker: pigeon
          text: Very well. Just be careful.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The pigeon flew away, leaving the crow behind.
    - id: ch03
      title: The Crow Is Caught
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The cook prepared every dish, then stood in the kitchen doorway wiping the sweat from his body. The crow watched and waited.
        - id: ch03-b02
          speaker: crow
          text: Now is my chance!
        - id: ch03-b03
          speaker: narrator
          text: >-
            He landed on a dish of dainty food. Click! The cook heard it and turned. He caught the crow and plucked his head bare except for one tuft.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The cook ground ginger and cumin into powder, mixed them with buttermilk, and rubbed the mixture well all over the crow's body.
        - id: ch03-b05
          speaker: cook
          emotion: angry
          text: >-
            That's for spoiling my master's dinner and making me throw it away!
        - id: ch03-b06
          speaker: narrator
          text: >-
            The cook threw him into his basket. Oh, how it hurt!
    - id: ch04
      title: The Tufted Crane
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Later, the pigeon came home and found the crow groaning in his basket. He teased him with a verse.
        - id: ch04-b02
          speaker: pigeon
          text: >-
            Who is this tufted crane I see, lying where he has no right to be? Come out, my friend! The crow is near, and he may do you harm, I fear!
        - id: ch04-b03
          speaker: narrator
          text: >-
            The crow answered in verse.
        - id: ch04-b04
          speaker: crow
          text: >-
            No tufted crane am I, oh no! I'm nothing but a greedy crow. I would not do as I was told, so now I'm plucked, as you behold.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The pigeon replied with one last verse.
        - id: ch04-b06
          speaker: pigeon
          text: >-
            You'll come to grief again, I know. It is your nature to do so. When people make a dish of meat, it isn't meant for little birds to eat.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The pigeon turned and flew away.
        - id: ch04-b08
          speaker: pigeon
          text: I can't live with him any longer.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The crow stayed in the basket, groaning until he died.
