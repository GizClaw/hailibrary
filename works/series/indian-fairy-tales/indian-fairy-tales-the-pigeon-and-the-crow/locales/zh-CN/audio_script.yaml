audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    pigeon:
      display_name: 鸽子
      tts:
        delivery: 厚道而明理，劝告时直截了当
        timbre: 清朗温和
        pace: 从容
        pitch: 中
    crow:
      display_name: 乌鸦
      tts:
        delivery: 油滑贪嘴，得意时轻佻，受苦时虚弱
        timbre: 略显尖细而富有变化
        pace: 稍快
        pitch: 中高
    cook:
      display_name: 厨子
      tts:
        delivery: 勤快爽利，发怒时干脆严厉
        timbre: 粗实有力
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 乌鸦来做伴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，菩萨化身成一只鸽子，住在富翁家的厨房里。厨子为了积德，特地挂了一只篮子给它做窝。一天，一只贪嘴的乌鸦飞过厨房，看见里面摆着各样美食，顿时馋了起来。它左思右想，总算有了主意。
        - id: ch01-b02
          speaker: narrator
          text: 鸽子出门觅食，乌鸦就在后面一路跟着。
        - id: ch01-b03
          speaker: pigeon
          text: 乌鸦先生，你跟着我做什么？你我吃的东西可不一样。
        - id: ch01-b04
          speaker: crow
          text: 可我喜欢你，也喜欢你的生活方式呀！让我做你的朋友，往后咱们一起找东西吃吧。
        - id: ch01-b05
          speaker: narrator
          text: 鸽子答应了。它们结伴往前走，乌鸦假装也在觅食，却总趁机落到后面，啄开一堆牛粪，吞下一条肥虫。等虫子填满肚皮，它又神气活现地飞到鸽子身旁。
        - id: ch01-b06
          speaker: crow
          text: 喂，鸽子先生，你这顿饭怎么吃了这么久？凡事得有个限度。趁天还不晚，咱们回家吧。
        - id: ch01-b07
          speaker: narrator
          text: 它们就这样回去了。厨子见鸽子带来一个朋友，也挂起一只篮子，给乌鸦做窝。
    - id: ch02
      title: 看见了鱼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 几天后，富翁家买来许多鱼，送进厨房。乌鸦馋得真想吃上一口。从天刚亮起，它就躺在窝里哼哼唧唧，大声叫苦。鸽子来叫它了。
        - id: ch02-b02
          speaker: pigeon
          text: 乌鸦先生，走吧，咱们吃早饭去！
        - id: ch02-b03
          speaker: crow
          text: 哎哟，哎哟！我积食了，难受得很！
        - id: ch02-b04
          speaker: pigeon
          text: 别胡说，乌鸦根本不会积食。除非你吞下一截灯芯，它才会在肚里停一会儿。别的东西一进肚，转眼就消化了。听我的，别因为看见几条鱼，就装出这副样子。
        - id: ch02-b05
          speaker: crow
          text: 师父怎么能这么说？我是真的积食了。
        - id: ch02-b06
          speaker: pigeon
          text: 那好，你自己多加小心。
        - id: ch02-b07
          speaker: narrator
          text: 鸽子说完，独自飞走了。
    - id: ch03
      title: 贪嘴的代价
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 厨子把一道道菜都做好，便站到厨房门口擦汗。乌鸦一看，心里暗叫机会来了，立刻落到一盘佳肴上。只听咔嗒一声，厨子转头瞧见了它，一把就将它抓住。
        - id: ch03-b02
          speaker: narrator
          text: 厨子拔光乌鸦头上的羽毛，只留下一撮。接着，他把姜和孜然磨成粉，拌上酪乳，给乌鸦浑身涂了个遍。
        - id: ch03-b03
          speaker: cook
          text: 你糟蹋了我家主人的晚饭，害得我只能把菜倒掉。这就是给你的教训！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 厨子说罢，把乌鸦扔回篮子。那滋味疼得它直叫唤。
    - id: ch04
      title: 三首诗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了一阵，鸽子回到厨房，看见乌鸦躺在那里大声呻吟，忍不住狠狠取笑它，还念起一首诗。
        - id: ch04-b02
          speaker: pigeon
          text: 哪里来的冠毛鹤，不该躺这偏躺着？快快出来吧，朋友，乌鸦将至，怕伤你！
        - id: ch04-b03
          speaker: narrator
          text: 乌鸦听了，也用一首诗回答。
        - id: ch04-b04
          speaker: crow
          text: 我非什么冠毛鹤，只是一只馋乌鸦。不肯听从良言劝，如今拔毛成这般。
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 鸽子便回了第三首诗。
        - id: ch04-b06
          speaker: pigeon
          text: 我知你还会遭殃，本性如此总难改。人家烹成肉佳肴，岂是小鸟能来吃。
        - id: ch04-b07
          speaker: pigeon
          text: 我再也不能跟这家伙住在一起了。
        - id: ch04-b08
          speaker: narrator
          text: 鸽子说完便飞走了。乌鸦留在篮子里，一直呻吟到断气。
