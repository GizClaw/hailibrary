audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    brahman:
      display_name: 婆罗门
      tts:
        delivery: 精于盘算，越想越兴奋，得意中透着可笑
        timbre: 清亮而略显干瘦
        pace: 适中，盘算财富时逐渐加快
        pitch: 中高
  chapters:
    - id: ch01
      title: 一罐剩米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个名叫斯瓦巴瓦克里帕纳的婆罗门。这名字的意思，就是“天生的吝啬鬼”。他靠乞讨攒下一些米，吃饱以后，把剩下的全装进罐子，挂到墙上的木钉上。床铺正好安在罐子下面。那一夜，他一直盯着它，越看，心里的算盘打得越响。
        - id: ch01-b02
          speaker: brahman
          text: “这么满的一罐米，要是碰上饥荒，少说也能卖一百卢比。拿钱买两只山羊，每半年就添一批小羊，很快便是一大群。再拿羊换母牛，等母牛生下牛犊，就把牛犊卖掉，换成水牛。水牛又能换来母马。母马生了小马，我的马越来越多，卖出去可就是一大堆金子！”
    - id: ch02
      title: 越做越大的美梦
      blocks:
        - id: ch02-b01
          speaker: brahman
          text: “有了金子，我就盖一座四面都有侧屋的大宅。到时，会有一位婆罗门把美丽的女儿嫁给我，还送来丰厚的嫁妆。她会给我生个儿子，我就叫他索玛萨尔曼。”
        - id: ch02-b02
          speaker: narrator
          text: 婆罗门的念头越飘越远，连这个还没影子的孩子怎样跑来找他，都想得清清楚楚。
        - id: ch02-b03
          speaker: brahman
          text: “等他能坐在父亲膝上颠着玩，我会拿着书，坐在马厩后面。他一看见我，就从母亲怀里跳下来，跑来要我抱。可他跑得离马蹄太近了！我会生气地喊妻子：‘快把孩子抱走！快点！’她正忙着家务，根本听不见。”
    - id: ch03
      title: 破罐子
      blocks:
        - id: ch03-b01
          speaker: brahman
          text: “那我只好站起来，抬脚狠狠踢她一下，就像这样！”
        - id: ch03-b02
          speaker: narrator
          text: 他想到这里，真的一脚踢了出去。只听一声响，墙上的罐子破了，米全落到他身上，把他从头到脚染得雪白。所以我要说，谁为将来作这种糊涂打算，谁就会像索玛萨尔曼的父亲一样，落得一身白。
