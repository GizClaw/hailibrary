audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    brahman:
      display_name: Svabhavakripana
      tts:
        delivery: calculating and increasingly carried away
        timbre: dry and narrow
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Pot Full of Rice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In a certain place lived a Brahman named Svabhavakripana, whose name meant “a born miser.” He had gathered some rice by begging. After eating his meal, he put all the rice that remained into a pot.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He hung the pot from a peg on the wall and set his couch beneath it. All night long, he stared up at that pot and thought.
        - id: ch01-b03
          speaker: brahman
          text: >-
            Ah, that pot is filled to the brim with rice. If a famine comes, I can surely sell it for a hundred rupees.
        - id: ch01-b04
          speaker: brahman
          text: >-
            With that money, I will buy two goats. Every six months, they will have young ones. Before long, I will own a whole herd.
        - id: ch01-b05
          speaker: brahman
          text: >-
            Then I will trade the goats for cows. Once the cows have calved, I will sell their calves and buy buffaloes. After that, I will trade the buffaloes for mares.
        - id: ch01-b06
          speaker: brahman
          text: >-
            The mares will have foals, and soon I will have plenty of horses. I will sell those horses for a great deal of gold.
        - id: ch01-b07
          speaker: brahman
          text: >-
            With all that gold, I will build a house with four wings. Then another Brahman will come to my house and offer me his beautiful daughter, along with a large dowry.
    - id: ch02
      title: The Father of Somasarman
      blocks:
        - id: ch02-b01
          speaker: brahman
          text: >-
            She will bear me a son, and I will name him Somasarman.
        - id: ch02-b02
          speaker: brahman
          text: >-
            When he is old enough to bounce on his father's knee, I will sit behind the stable with a book. As I read, the boy will see me. He will leap down from his mother's lap and run over, wanting me to bounce him on my knee.
        - id: ch02-b03
          speaker: brahman
          text: >-
            He will run too close to a horse's hoof. I will be furious, and I will shout to my wife.
          emotion: angry
        - id: ch02-b04
          speaker: brahman
          text: Take the baby! Take him!
          emotion: angry
        - id: ch02-b05
          speaker: brahman
          text: >-
            But she will be busy with some household task and will not hear me. Then I will get up and give her a kick with my foot, just like this!
          emotion: angry
    - id: ch03
      title: The Broken Pot
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Lost in his thoughts, the Brahman kicked out his foot. He struck the pot and broke it. Every grain of rice tumbled down over him until he was white all over.
        - id: ch03-b02
          speaker: narrator
          text: >-
            And so it is said: Anyone who makes foolish plans for the future will end up white all over, like the father of Somasarman.
