  chapters:
    - id: ch01
      title: The Woman at the Hearth
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a Raja with seven beautiful daughters. They were all good, but the youngest, Balna, was the cleverest. Their mother had died when they were small, so there was no mother to care for them. Each day, while the Raja met with his ministers to settle the affairs of the kingdom, his daughters took turns cooking his dinner.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Around that time, the Raja's chief minister died and left behind his wife and daughter. Whenever the Princesses began preparing dinner, the widow came to their hearth and begged for a little fire.
        - id: ch01-b03
          speaker: balna
          text: >-
            Send her away, sisters. She can get fire at her own house. Why does she always need ours? If we keep letting her come in, one day we will suffer for it.
        - id: ch01-b04
          speaker: eldest_princess
          text: >-
            Oh, Balna, stop quarreling with the poor woman. If she needs a little fire, let her have it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The widow would take a few burning sticks. Then, while no one watched, she would quickly toss mud into the dishes meant for the Raja.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The Raja dearly loved his daughters. Since their mother's death, they had cooked for him themselves so that his enemies could not poison him. When he found mud in his meal, he blamed carelessness. He could not imagine anyone doing it on purpose, and he was too kind to scold the girls. Yet day after day, the curry was spoiled.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At last, the Raja hid in the next room and watched through a hole in the wall. He saw his daughters wash the rice with care, prepare the curry, and place each finished dish beside the fire. Then the widow appeared and asked for sticks to cook her own dinner.
        - id: ch01-b08
          speaker: balna
          text: >-
            Why don't you keep fuel at home instead of taking ours every day? Sisters, give her no more wood. She should buy her own.
          emotion: angry
        - id: ch01-b09
          speaker: eldest_princess
          text: >-
            Let the poor woman take some wood and fire, Balna. She has never harmed us.
        - id: ch01-b10
          speaker: balna
          text: >-
            If you keep allowing her in, she may harm us yet. Someday, we may be sorry.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The Raja watched the widow reach the prepared food. As she gathered the wood, she dropped mud into every dish. Furious, he ordered that she be seized and brought before him.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The widow admitted the trick, but claimed she had done it only to win an audience with him. Her clever words pleased the Raja so much that he did not punish her. Instead, he married her and made her his Ranee. She and her daughter moved into the palace.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The new Ranee hated the seven Princesses. She wanted to get them out of the way so that her own daughter could claim all their riches and take their place as the Princess of the palace. The sisters had shown her kindness when she was a poor widow, but she gave them none in return. She did everything she could to make them miserable. She allowed them nothing to eat except bread, and gave them very little of that. She allowed them hardly any water to drink. All their lives, the seven girls had enjoyed comfort, good food, and good clothes. Now they were hungry and deeply unhappy. Day after day, they left the palace, sat beside their dead mother's tomb, and cried for her.
        - id: ch01-b14
          speakers: [eldest_princess, princess_two, princess_three, balna]
          ensemble: chorus
          text: >-
            Mother, can you see your poor children? Our cruel stepmother is starving us. We are so unhappy.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: >-
            One day, while they sobbed there, a beautiful pomelo tree sprang from the grave. Its branches were covered with fresh, ripe fruit. The children ate until their hunger was gone. From then on, they left the bad dinner their stepmother served and went to their mother's grave to eat the pomeloes.
        - id: ch01-b16
          speaker: widow
          text: >-
            I do not understand it. Those seven girls refuse their dinner every day, yet they never grow thin or sick. They look healthier than you. Watch them and find out who is feeding them.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The next day, the widow's daughter followed the Princesses and saw them gathering pomeloes at the grave.
        - id: ch01-b18
          speaker: balna
          text: >-
            That girl is watching us. Drive her away, or hide the fruit. If she tells her mother, it will go badly for us.
        - id: ch01-b19
          speaker: eldest_princess
          text: >-
            Do not be unkind, Balna. Surely she would not be cruel enough to tell. Let us invite her to share the fruit.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The sisters called the girl over and gave her a pomelo. As soon as she had eaten it, she hurried home.
        - id: ch01-b21
          speaker: widows_daughter
          text: >-
            Now I know why the seven Princesses refuse your food. A beautiful pomelo tree grows beside their mother's grave, and they eat its fruit every day. I tried one. It was the finest pomelo I have ever tasted.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The Ranee was furious. The next day she stayed in her room and told the Raja that her head ached terribly. He was deeply troubled.
        - id: ch01-b23
          speaker: raja
          text: What can I do to help you?
        - id: ch01-b24
          speaker: widow
          text: >-
            Only one thing can cure me. A fine pomelo tree grows by your dead wife's tomb. Have it pulled up and boiled, roots, branches, and all. Put some of that water on my forehead, and my pain will leave me.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The Raja sent his servants to tear up the beautiful tree and boil it. When its water touched the Ranee's forehead, she declared that the headache was gone.
    - id: ch02
      title: The Grave, the Jungle, and Seven Weddings
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next morning, the seven Princesses went to their mother's grave as usual, only to find that the pomelo tree had vanished. Once again, they all began to cry bitterly. A small tank stood close beside the old Ranee's tomb. While the sisters wept, they saw the tank fill with a rich substance that looked like cream. It quickly hardened until it became a thick white cake. The Princesses were delighted by the sight. They tasted the cake, liked it, and ate enough to satisfy their hunger. The next day, the same wonder happened again. It went on for many days. Each morning, the sisters returned to the grave and found the little tank filled with the nourishing, cream-like cake.
        - id: ch02-b02
          speaker: widow
          text: >-
            I destroyed the pomelo tree by the old Ranee's grave, but still those girls do not grow thin or sad. They never touch the meals I give them. How can this be?
        - id: ch02-b03
          speaker: widows_daughter
          text: I will follow them and see.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The next day, the girl came by while the Princesses ate the cream cake. Balna noticed her first.
        - id: ch02-b05
          speaker: balna
          text: >-
            Sisters, there she is again. Sit around the tank so she cannot see it. If we give her cake, she will tell her mother, and we will suffer for it.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The others thought Balna was too suspicious. They shared the cake with the girl, and once again she went straight home and told her mother everything.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The Ranee flew into a rage. She ordered her servants to pull down the dead Ranee's tomb and fill the little tank with its ruins. Still unsatisfied, she pretended the next day to be so ill that she was near death. The grieving Raja asked whether any remedy could save her.
        - id: ch02-b08
          speaker: widow
          text: >-
            There is one cure, but I know you will refuse it.
        - id: ch02-b09
          speaker: raja
          text: Whatever it may be, I will do it.
        - id: ch02-b10
          speaker: widow
          text: >-
            Then kill the seven daughters of your first wife. Put their blood on my forehead and on my palms. Their death will give me life.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The Raja was filled with sorrow when he heard those words. He had promised to do whatever would save the Ranee, and he feared breaking that promise. With a heavy heart, he went out to find his daughters. He discovered all seven crying beside the broken stones and earth that were left of their mother's grave. When he looked at them, he knew he could never kill them. Instead, he spoke kindly and asked them to come into the jungle with him. The girls followed their father deep among the trees. There he gathered fuel, made a fire, cooked rice, and gave them a meal.
        - id: ch02-b12
          speaker: narrator
          text: >-
            By afternoon, the heat had grown very strong. One after another, all seven Princesses fell asleep. The Raja waited until he was sure they were sleeping soundly. Then their own father stole away and left them there. He did it because he feared his wife and the dreadful thing she had demanded. As he went, he tried to comfort himself with one thought. It was better, he believed, for his poor daughters to die there in the jungle than to be killed by their cruel stepmother.
        - id: ch02-b13
          speaker: narrator
          text: >-
            He shot a deer and carried its blood home. He rubbed it on the Ranee's forehead and hands. Believing he had killed the Princesses, she announced that she was well again.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Meanwhile, the seven sisters woke in the thick jungle and found themselves alone. Terrified, they called for their father as loudly as they could. By then he was far away. Even voices as loud as thunder could not have reached him.
        - id: ch02-b15
          speaker: narrator
          text: >-
            That very day, the seven young sons of a neighboring Raja were hunting in the same jungle. As they headed home, the youngest Prince stopped his brothers.
        - id: ch02-b16
          speaker: youngest_prince
          text: >-
            Wait. I hear someone crying and calling. Can you hear those voices? Let us follow the sound and find out who is there.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The seven Princes turned their horses toward the sound and rode on through the wood. At last they reached the place where the seven Princesses sat, crying and wringing their hands. The young men were amazed to find seven royal sisters alone in such a wilderness. Their amazement grew when the girls explained everything that had happened to them, from their stepmother's cruelty to their father's abandonment. The Princes took pity on these poor, forsaken ladies. After speaking together, the brothers settled on a plan. Each Prince would take one Princess home and make her his wife.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The first and eldest Prince took the eldest Princess home and married her. The second Prince chose the second Princess, and the third chose the third. The fourth, fifth, and sixth brothers each married the fourth, fifth, and sixth sisters. Last of all, the seventh Prince, who was the handsomest brother, took beautiful Balna for his wife. The seven couples traveled together to the Princes' own land. When they arrived, news of the marriages spread everywhere. There was great rejoicing throughout the kingdom because all seven young Princes had returned with seven beautiful Princesses as their brides.
        - id: ch02-b19
          speaker: narrator
          text: >-
            About a year later, Balna had a son. His aunts and uncles loved him so dearly that he seemed to have seven fathers and seven mothers. None of the other couples had a child, so they all accepted Balna's son as their heir.
    - id: ch03
      title: Punchkin Comes to the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            For a long while, the whole family lived together in great happiness. Then, on one fine day, the seventh Prince, Balna's husband, announced that he was going out to hunt. He rode away, and those at home waited for his return. They waited a long time, but he never came back. At last, his six brothers decided to search for him and discover what had become of him. They too left the palace. The days passed, and not one of the six returned. The seven Princesses grieved deeply. With every husband now missing, they feared that all seven kind Princes must have been killed.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Not long afterward, Balna was upstairs rocking her baby's cradle while her sisters worked below. A man in a long black robe appeared at the palace gate. He called himself a Fakir and begged to enter.
        - id: ch03-b03
          speakers: [servant_one, servant_two]
          ensemble: duo
          text: >-
            You cannot enter the palace. The Raja's sons went away and may be dead. Their widows must not be troubled by beggars.
        - id: ch03-b04
          speaker: punchkin
          text: >-
            I am a holy man. You must allow me inside.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The foolish servants let him pass. They did not know that he was no Fakir at all, but a wicked Magician named Punchkin. He wandered through the palace, admiring its beautiful things, until he reached Balna's room. She sat there singing beside her little son's cradle. To Punchkin, she was lovelier than everything else he had seen. He asked her to leave with him and become his wife.
        - id: ch03-b06
          speaker: balna
          text: >-
            I fear my husband is dead, but my little boy is still very young. I will remain here and teach him to grow into a clever man. When he is older, he will travel through the world and seek news of his father. Heaven forbid that I should abandon my child or marry you.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Punchkin was enraged. He turned Balna into a little black dog and dragged her away.
        - id: ch03-b08
          speaker: punchkin
          text: >-
            If you refuse to come willingly, I will make you come.
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            The poor Princess had no power to escape or tell her sisters what had happened. At the palace gate, the servants noticed the dog.
        - id: ch03-b10
          speaker: servant_one
          text: Where did you find that pretty little dog?
        - id: ch03-b11
          speaker: punchkin
          text: One of the Princesses gave her to me as a gift.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Hearing that answer, the servants asked no more questions and allowed Punchkin to pass through the gate. Soon afterward, the six elder Princesses heard their little nephew begin to cry upstairs. They hurried to the room and were astonished to find the baby all alone in his cradle. Balna was nowhere to be seen. The sisters searched and then questioned everyone who had been at the palace. The servants told them of the Fakir who had insisted on entering and of the little black dog he had carried away. At once, the women guessed what had happened to their sister. They sent people along every road and in every direction to search, but neither the strange Fakir nor the black dog could be found.
        - id: ch03-b13
          speaker: narrator
          text: >-
            What could the six women do? They lost hope of seeing their husbands, Balna, or Balna's husband again. From then on, they gave all their care to teaching and raising their little nephew.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Time went on under the loving care of the six aunts until Balna's son was fourteen years old. Then, one day, they told him the history of his family. He learned how his father had ridden out hunting and disappeared, how the six uncles who searched for him had vanished too, and how a false Fakir had carried his mother away as a black dog. The boy had no sooner heard the story than a powerful wish seized him. He would go out into the world and search for them all. If his father, mother, and uncles were still alive, he would bring them safely home. When his aunts heard how firmly he had decided, they became greatly alarmed and tried to persuade him to stay.
        - id: ch03-b15
          speakers: [eldest_princess, princess_two, princess_three]
          ensemble: chorus
          text: >-
            We have already lost our husbands, our sister, and her husband. You are our only hope now. If you leave us too, what will we do?
          emotion: fearful
        - id: ch03-b16
          speaker: balnas_son
          text: >-
            Please do not lose heart. I will come back soon, and if I can, I will bring my mother, my father, and my uncles with me.
        - id: ch03-b17
          speaker: narrator
          text: >-
            So the young Prince began his journey. For months, he found nothing that could guide his search. He traveled hundreds of weary miles and nearly gave up hope of learning anything about his parents. Then one day he entered a land that seemed filled with stones, rocks, and trees. A great palace with a high tower stood there, and nearby was the little house of a gardener, or Malee.
    - id: ch04
      title: The Boy in Disguise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Malee's wife saw the boy looking around. She hurried from her house to meet him.
        - id: ch04-b02
          speaker: malees_wife
          text: >-
            Dear boy, who are you? How dare you come to such a dangerous place?
        - id: ch04-b03
          speaker: balnas_son
          text: >-
            I am a Raja's son. I am searching for my father and my uncles, and for my mother, whom a wicked enchanter bewitched.
        - id: ch04-b04
          speaker: malees_wife
          text: >-
            This land and that palace belong to a mighty enchanter. If anyone displeases him, he can turn that person into stone or wood. Every rock and tree you see was once alive. Some years ago, one Raja's son came here. His six brothers followed him, and all seven became rocks and trees. Many others met the same fate. And in the tower, a beautiful Princess has been held for twelve years. The Magician keeps her there because she hates him and refuses to marry him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            As the Prince listened, one thought filled his mind. The prisoners must be his parents and his uncles. After all his wandering, he had found the people he was seeking at last. He told the Malee's wife his full story. Then he begged her to let him remain near the palace while he asked more about the unhappy people she had described. The kind woman promised to befriend him. Still, she warned that he must not let the Magician see who he really was. Punchkin might turn him into stone just as he had transformed so many others. The Prince agreed to disguise himself. The Malee's wife dressed him in a saree and told everyone that the newcomer was her daughter.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Not long afterward, Punchkin walked through his garden and noticed the child he took for a little girl. He asked who she was, and the disguised Prince said he was the Malee's daughter.
        - id: ch04-b07
          speaker: punchkin
          text: >-
            You are a pretty little girl. Tomorrow, you may carry a gift of flowers from me to the beautiful lady in the tower.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The Prince was delighted. He hurried to tell the Malee's wife. Together they decided it was safest to keep up the disguise and wait for a chance to communicate with the prisoner, if she truly was his mother.
        - id: ch04-b09
          speaker: narrator
          text: >-
            When Balna married, her husband had given her a small gold ring engraved with her name. She placed it on her son's finger when he was a baby. As he grew, his aunts had it made larger, so he still wore it. The Malee's wife advised him to tie this familiar treasure to one of the bouquets and trust Balna to recognize it.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Carrying out the plan was difficult. Punchkin was afraid that Balna might somehow reach her friends, so he kept a strict watch on her. The supposed gardener's daughter was allowed to bring fresh flowers to the tower each day. Yet every time the boy entered Balna's chamber, Punchkin or one of his slaves stayed there too. The Prince waited patiently for a moment when he could act unseen. At last, that moment came. He fastened the little gold ring to one of the nosegays he had brought. When every watching eye was turned away, he threw the flowers at Balna's feet. The ring hit the floor with a clear clang, a strange sound among the soft falling blossoms.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Balna looked down to discover what had made the unexpected sound. There among the flowers lay her own little ring. She recognized it at once, and she listened as the disguised boy told her about his long search. The ring proved that he truly was her son. Balna asked him what he thought she should do, but she begged him not to endanger his life by attempting a rescue. For twelve long years, Punchkin had shut her inside that tower because she hated him and would not consent to marry him. Guards watched her so closely that she could see no hope of escaping by herself.
        - id: ch04-b12
          speaker: balnas_son
          text: >-
            Do not be afraid, Mother. First we must learn how far the Magician's power reaches. Then we may free Father and my uncles from the rocks and trees that hold them. You have answered him angrily for twelve years. Now speak kindly. Tell him you have lost hope of seeing the husband you mourn and that you will marry him. Find out where his power lies. Learn whether he is immortal or whether he can die.
    - id: ch05
      title: The Secret of Punchkin's Life
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Balna decided to follow her son's plan. The next day, she sent for Punchkin and spoke to him as the boy had advised. The delighted Magician begged her to let the wedding take place at once.
        - id: ch05-b02
          speaker: balna
          text: >-
            Before I marry you, give me a little time to know you better. We have been enemies for so long that our friendship can only grow slowly. Tell me, are you truly immortal? Can death never reach you? Are you so great an enchanter that you can never suffer as human beings do?
        - id: ch05-b03
          speaker: punchkin
          text: Why do you want to know?
        - id: ch05-b04
          speaker: balna
          text: >-
            If I am to be your wife, I want to know everything about you. Then, if danger ever threatens you, I may overcome it or keep it away.
        - id: ch05-b05
          speaker: punchkin
          text: >-
            It is true that I am not like other men. Far from here, hundreds of thousands of miles away, lies a lonely country covered in thick jungle. A ring of palm trees grows at its heart. Inside that ring are six water jars, stacked one upon another. Beneath the sixth jar is a small cage, and in that cage lives a little green parrot. My life depends upon the parrot's life. If it is killed, I must die. But the bird can never be harmed. The country is almost impossible to reach, and thousands of genii guard the palms. They kill anyone who approaches.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Balna repeated Punchkin's secret to her son. At the same time, she pleaded with him to abandon any thought of seeking the parrot.
        - id: ch05-b07
          speaker: balnas_son
          text: >-
            Mother, unless I capture that parrot, you, Father, and my uncles can never be free. Do not fear. I will return soon. Keep Punchkin pleased while I am gone, but delay the wedding with one excuse after another. I will be back before he discovers why you are waiting.
        - id: ch05-b08
          speaker: narrator
          text: >-
            With those words, the Prince set out once more. He traveled mile after weary mile, continuing until he had crossed a vast distance. At last he entered a jungle where the growth was thick all around him. He was so tired that he sat down beneath a tree and fell asleep where he rested. After some time, a soft rustling sound woke him. He looked around for its source and saw a great serpent moving up the very tree beneath which he had slept. High among its branches was an eagle's nest. Two young eagles were inside, and the serpent was making its way directly toward them.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The Prince understood the young birds' danger at once. He drew his sword before the serpent could reach the nest and killed it. At that same moment, he heard a rushing sound overhead. The two old eagles were coming home after hunting for food for their children. When they landed, they quickly took in the scene. Their two little ones were alive in the nest, the serpent lay dead below, and the young Prince stood over it with his sword. Then the mother eagle addressed the boy who had saved them.
        - id: ch05-b10
          speaker: mother_eagle
          text: >-
            Dear boy, for years that cruel serpent has devoured every one of our young. Today you saved our children's lives. Whenever you need us, send word, and we will help you. Take these two young eagles with you now. Let them serve you.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The Prince was overjoyed. The two eaglets crossed their wings, and he climbed onto them. They carried him far above the thick jungle until he reached the circle of palm trees and the six jars of water.
        - id: ch05-b12
          speaker: narrator
          text: >-
            It was the middle of the day when they arrived, and the heat was fierce. All around the circle of palms, the thousands upon thousands of genii lay asleep. Their ranks were so deep and so tightly spread across the ground that no traveler could possibly have walked between them to reach the center. The Prince did not need to cross the ground. The strong-winged young eagles swooped straight down from above and landed beside the six water jars. The Prince sprang from their backs. In a single instant, he overturned all six jars and found the cage beneath the lowest one. He seized the little green parrot, rolled it securely inside his cloak, and climbed back onto the eagles.
        - id: ch05-b13
          speaker: narrator
          text: >-
            The genii awoke below. When they saw that their treasure was gone, they raised a wild and mournful howl. But the little eagles were already flying away. They carried the Prince safely back to their great tree.
        - id: ch05-b14
          speaker: balnas_son
          text: >-
            Take your children back. They have served me well. If I ever need your help again, I will come to you.
        - id: ch05-b15
          speaker: narrator
          text: >-
            Then the Prince continued on foot until he reached Punchkin's palace once more. He sat beside the door and began to play with the parrot. Punchkin saw him and rushed over.
    - id: ch06
      title: The Parrot and the Magician
      blocks:
        - id: ch06-b01
          speaker: punchkin
          text: >-
            Boy, where did you get that parrot? Please, give it to me.
        - id: ch06-b02
          speaker: balnas_son
          text: >-
            Oh no. I cannot give my parrot away. He is a dear pet, and I have had him for years.
        - id: ch06-b03
          speaker: punchkin
          text: >-
            If he is such an old favorite, I understand why you will not give him away. But tell me, what price would make you sell him?
        - id: ch06-b04
          speaker: balnas_son
          text: Sir, my parrot is not for sale.
        - id: ch06-b05
          speaker: narrator
          text: >-
            Punchkin grew frightened. He offered anything the boy cared to name.
        - id: ch06-b06
          speaker: punchkin
          text: >-
            Anything at all. Name your price, and you shall have it.
          emotion: fearful
        - id: ch06-b07
          speaker: balnas_son
          text: >-
            Then free the seven sons of the Raja whom you turned into rocks and trees. Restore them this instant.
        - id: ch06-b08
          speaker: punchkin
          text: >-
            It is done, just as you ask. Now give me my parrot.
        - id: ch06-b09
          speaker: narrator
          text: >-
            Punchkin struck with his wand, and Balna's husband and his six brothers returned at once to their human forms.
        - id: ch06-b10
          speaker: punchkin
          text: Now give me my parrot.
        - id: ch06-b11
          speaker: balnas_son
          text: >-
            Not so quickly, master. First, bring back every person you have imprisoned in this way.
        - id: ch06-b12
          speaker: narrator
          text: >-
            Punchkin obeyed at once and waved his wand a second time. Even while the spell was working, he pleaded with the boy to hand over the bird. In a moment, the entire garden changed and came alive. The rocks and stones were gone. The silent trees were gone too. In their places stood all the people whom the Magician had imprisoned. There were Rajas, princes, chiefs, and other mighty men. Some sat once more upon prancing horses. Jeweled pages appeared beside them, and whole troops of armed attendants filled the grounds. Every victim of Punchkin's enchantment had been restored to life.
        - id: ch06-b13
          speaker: punchkin
          text: Give me my parrot!
          emotion: fearful
        - id: ch06-b14
          speaker: narrator
          text: >-
            The boy gripped the parrot and tore off one wing. At the same moment, Punchkin's right arm fell from his body.
        - id: ch06-b15
          speaker: narrator
          text: >-
            Punchkin reached out with his left arm and cried again.
        - id: ch06-b16
          speaker: punchkin
          text: Give me my parrot!
          emotion: fearful
        - id: ch06-b17
          speaker: narrator
          text: >-
            The Prince tore off the bird's second wing, and Punchkin's left arm fell. Still the Magician demanded the parrot and dropped to his knees. The Prince pulled off the parrot's right leg, and Punchkin's right leg fell away. He pulled off its left leg, and the Magician's left leg fell too.
        - id: ch06-b18
          speaker: narrator
          text: >-
            Only Punchkin's body and head remained. His eyes still rolled as he cried out once more.
        - id: ch06-b19
          speaker: punchkin
          text: Give me my parrot!
          emotion: fearful
        - id: ch06-b20
          speaker: balnas_son
          text: Then take your parrot!
        - id: ch06-b21
          speaker: narrator
          text: >-
            The boy wrung the bird's neck and threw it at the Magician. Punchkin's head twisted around. With a fearful groan, he died.
        - id: ch06-b22
          speaker: narrator
          text: >-
            At last, they opened the tower and set Balna free. She was reunited with her son and with the seven Princes, including the husband she had mourned for so many years. Together, they all returned to their own country, where they lived very happily ever afterward.
        - id: ch06-b23
          speaker: narrator
          text: >-
            And as for the rest of the world, everyone went home.
