  chapters:
    - id: ch01
      title: The Promise and the Drum
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In one country, seven poor sisters often played beneath the shady trees in the King's garden with the gardener's daughter. Every day, that girl told them what would happen when she married.
        - id: ch01-b02
          speaker: gardener_daughter
          text: >-
            I shall have a son more beautiful than any boy ever seen. He will have a moon on his forehead and a star on his chin.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Her friends laughed and mocked her. One day the King overheard her. Though he already had four Queens, he had no child, and he longed for such a son. He asked the gardener for his daughter's hand. Her delighted parents agreed, and after a splendid wedding, the gardener's daughter became the King's youngest wife.
        - id: ch01-b04
          speaker: narrator
          text: >-
            A year later, as the child's birth drew near, the four other Queens began visiting her constantly. They reminded her that the King hunted every day and asked how she would call him if she became ill while he was away.
        - id: ch01-b05
          speaker: gardener_daughter
          text: >-
            You go hunting each day. If I were sick or in trouble while you were gone, how could I send for you?
        - id: ch01-b06
          speaker: narrator
          text: >-
            The King placed a kettle-drum beside her door.
        - id: ch01-b07
          speaker: king
          text: >-
            Beat this drum whenever you need me. However far away I am, I will hear it and come at once.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The next morning, the four Queens returned and urged her to test the drum.
        - id: ch01-b09
          speakers: [queen_1, queen_2, queen_3, queen_4]
          ensemble: chorus
          text: >-
            Beat it once. Let us see whether the King truly comes.
        - id: ch01-b10
          speaker: gardener_daughter
          text: >-
            No. I do not need him, so why should I call him away from the hunt?
        - id: ch01-b11
          speaker: narrator
          text: >-
            They kept coaxing until she gave in. She struck the drum, and the King appeared before her.
        - id: ch01-b12
          speaker: king
          text: >-
            Why did you summon me? I left the hunt to come here.
        - id: ch01-b13
          speaker: gardener_daughter
          text: >-
            Nothing is wrong. I only wanted to be certain you would come when I beat the drum.
        - id: ch01-b14
          speaker: king
          text: >-
            Very well, but do not call again unless you truly need me.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The following day, the Queens begged her to test him once more. Again she refused at first, and again they wore her down. When the King arrived and found her safe, anger seized him.
        - id: ch01-b16
          speaker: king
          emotion: angry
          text: >-
            Twice I have abandoned my hunt and lost my game when you needed nothing. Beat the drum as often as you please now. I will not come.
        - id: ch01-b17
          speaker: narrator
          text: >-
            On the third day, the gardener's daughter really did fall ill. She beat the drum again and again, but the King never came. He heard every stroke while he hunted. Still, he remembered the two false alarms and told himself that she did not truly need him. He believed she only wanted to discover whether he would return yet again, so he stayed away when she needed him most.
    - id: ch02
      title: The Child in the Box
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The four Queens told the young mother that custom required a cloth over her eyes before the birth. She trusted them and let them bind it there. Soon she bore a beautiful son with a moon on his forehead and a star on his chin. Before she could see him, the Queens carried him to the nurse.
        - id: ch02-b02
          speakers: [queen_1, queen_2, queen_3, queen_4]
          ensemble: chorus
          text: >-
            Keep him silent so his mother cannot hear. Tonight, kill him or carry him away forever. Obey us, and you will receive many rupees.
        - id: ch02-b03
          speaker: narrator
          text: >-
            They acted from spite. The nurse put the living child in a box while the four Queens went back to his mother. They laid a stone in the baby's little bed, uncovered her eyes, and told her to look at her son. The poor woman saw only the stone. She wept bitterly and wondered what the King would say when he found no child. Yet she was weak, alone, and unable to stop them.
        - id: ch02-b04
          speaker: narrator
          text: >-
            When the King returned, he flew into a fury because his youngest wife had given him a stone instead of the promised boy. He made her a palace servant and never spoke to her again.
        - id: ch02-b05
          speaker: narrator
          text: >-
            In the middle of the night, the nurse carried the box far out to a broad plain in the jungle. She dug a hole, checked every fastening, and lowered the closed box into the earth although the baby was still alive. Shankar, the King's dog, had followed quietly and watched her. The nurse returned to the Queens and received her many rupees. As soon as she was gone, Shankar hurried to the hole, pulled out the box, and forced it open.
        - id: ch02-b06
          speaker: shankar
          text: >-
            If Khuda wills this child to live, I will not harm or eat him. I will swallow him whole and hide him safely in my stomach.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The child remained safe inside Shankar for six months. Then, one night, the dog went back to the jungle and wondered whether the boy was alive or dead. He brought him out and found a beautiful six-month-old baby. Shankar caressed and loved him before swallowing him again. Six more months passed. Once again the dog went by night to the broad plain and brought up the child. The boy was now a year old, and Shankar petted him for a long time, made joyful by the child's extraordinary beauty.
        - id: ch02-b08
          speaker: narrator
          text: >-
            This time Shankar's keeper had followed. He saw everything, then hurried to the four Queens.
        - id: ch02-b09
          speaker: dog_keeper
          emotion: surprised
          text: >-
            There is a child inside the King's dog, the loveliest child ever seen! He has a moon on his forehead and a star on his chin.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Terrified, the Queens waited for the King to return from hunting. Then they accused Shankar of tearing their clothes and wrecking their rooms, and said they feared he would kill them.
        - id: ch02-b11
          speaker: king
          text: >-
            Do not be frightened. Eat your dinner and be happy. I will have the dog shot at dawn.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Shankar overheard. He did not fear for himself, but he knew the child would die with him. That night he went to Suri, the King's cow.
        - id: ch02-b13
          speaker: shankar
          text: >-
            Suri, the King has ordered my death tomorrow. Will you guard something precious for me?
        - id: ch02-b14
          speaker: suri
          text: >-
            Show it to me. If I can care for it, I will.
        - id: ch02-b15
          speaker: narrator
          text: >-
            On the plain, Shankar brought up the boy. Suri was enchanted.
        - id: ch02-b16
          speaker: suri
          text: >-
            Never have I seen such a beautiful child. A moon shines on his forehead and a star on his chin. I will guard him with all my care.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Suri swallowed the prince. Shankar bowed to her again and again, said he would die the next day, and watched her return to the stable. At dawn, he was taken into the jungle and shot.
    - id: ch03
      title: Suri and Katar
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The boy lived safely within Suri for a whole year. When he was two, she went out alone to the plain. She knew she had never harmed him, but she still wondered whether he was alive. She brought him up and watched him play. Delighted, she talked to him, loved him, and caressed him before swallowing him again and returning to her stable. Another year passed. Suri brought him out once more, and the three-year-old ran and played around her for an hour. His beauty filled her with happiness. After speaking to him and petting him, she hid him inside herself again.
        - id: ch03-b02
          speaker: narrator
          text: >-
            But Suri's cowherd had followed her. He ran straight to the Queens.
        - id: ch03-b03
          speaker: cowherd
          emotion: surprised
          text: >-
            The King's cow carries a beautiful boy inside her! He has a moon on his forehead and a star on his chin. No child like him has ever been seen.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The Queens tore their hair and clothes and wept. That evening, they claimed Suri had tried to kill them and had torn their hair and clothing.
        - id: ch03-b05
          speaker: king
          text: >-
            Never mind. Eat and be content. The cow will be killed tomorrow morning.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Suri heard the order. At midnight, she went to Katar, the King's savage, untamable horse. No one had ever ridden him or could safely approach him.
        - id: ch03-b07
          speaker: suri
          text: >-
            Katar, the King means to kill me tomorrow. Will you care for something I must give you?
        - id: ch03-b08
          speaker: katar
          text: Show me what it is.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Suri brought up the child, and Katar delighted in him.
        - id: ch03-b10
          speaker: katar
          text: >-
            I will protect him with the greatest care. No one has ever ridden me, but this child shall.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Katar swallowed the boy. Suri bowed many times and said she would die for his sake. The next morning, she was killed in the jungle.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The prince lived inside Katar for one full year. Then the horse wondered whether the child was alive and brought him up. Katar loved and petted the four-year-old while the boy played all around the stable, the only place the savage horse was allowed to be. Seeing him alive made Katar very glad. After a time, he swallowed the child again. At the end of another year, Katar brought out the five-year-old boy, caressed him, and let him play around the stable just as he had done before. Then he swallowed him once more.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The second time, the groom saw it all. While the King was hunting, he told the Queens about the wonderful child inside Katar. Once again they wept, tore their clothes, and refused food. When the King came home, they accused the horse of wrecking their rooms and threatening their lives.
        - id: ch03-b14
          speaker: king
          text: >-
            Eat your dinner and be happy. Tomorrow my sepoys will shoot Katar.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The next day, the King surrounded the stable with soldiers and threatened to shoot anyone who let the horse escape. Katar had heard the order. He brought up the child.
        - id: ch03-b16
          speaker: katar
          text: >-
            In the little room beside the stable, you will find my saddle and bridle. Put them on me. Dress yourself in the prince's clothes there, and take the sword and gun. Then climb onto my back.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Katar was a fairy-horse from the fairies' country, though neither the King nor his people knew it. That was why he could provide everything the child needed. Once the prince was dressed and armed, Katar burst through the stable with the boy upon his back. He rushed past the King before the King could raise his gun, then flew onto the great jungle plain. The sepoys fired after him, but Katar galloped far too fast. He swept back and forth until the soldiers were scattered across the plain and could do nothing more. At last the King abandoned the chase and went home. The sepoys also returned. The King could not shoot any man for letting the horse escape, because Katar had escaped past the King himself.
    - id: ch04
      title: The Singer in the Garden
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Katar galloped on until night. He and the prince slept beneath a tree, the horse eating grass and the boy eating wild fruit. The next day they traveled far into another king's country. There Katar told the boy to dismount, remove the saddle and bridle, and bundle his fine clothes with his sword and gun. He gave him poor clothes instead.
        - id: ch04-b02
          speaker: katar
          text: >-
            Hide the bundle in this grass. I will guard it and remain on this plain whenever you need me. Now go into this country and find someone to serve.
        - id: ch04-b03
          speaker: prince
          emotion: sad
          text: >-
            I know nothing of the world. What can I do alone in a strange country?
        - id: ch04-b04
          speaker: katar
          text: >-
            Have no fear. You will find work, and I will be here whenever you need help. Before you leave, twist my right ear.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The boy obeyed, and Katar became a donkey. Then the horse told him to twist his own right ear. At once the handsome prince looked like a poor, ugly common man, and the moon and star disappeared.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Farther into the country, a grain merchant asked who he was.
        - id: ch04-b07
          speaker: prince
          text: I am a poor man looking for service.
        - id: ch04-b08
          speaker: grain_merchant
          text: Good. You may serve me.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The merchant lived near the palace. One hot midnight, the boy went into the King's cool garden and sang a lovely song. The King's seventh and youngest daughter heard him. She dressed, pinned up her hair, and came down to the man who seemed so poor.
        - id: ch04-b10
          speaker: youngest_princess
          text: Who are you, and where have you come from?
        - id: ch04-b11
          speaker: narrator
          text: >-
            He said nothing. She wondered at his silence and left. The same thing happened on the second night. On the third, she questioned him again.
        - id: ch04-b12
          speaker: youngest_princess
          text: >-
            What a strange man you are. Why will you not answer me when I speak to you?
        - id: ch04-b13
          speaker: narrator
          text: >-
            Still he was silent. The next day, after work, he visited Katar and told him about the princess's three visits.
        - id: ch04-b14
          speaker: katar
          text: >-
            When she asks again, say that you are a very poor man who came from your own country to find service here.
        - id: ch04-b15
          speaker: narrator
          text: >-
            That night the princess returned when she heard his song.
        - id: ch04-b16
          speaker: prince
          text: >-
            I am a very poor man. I left my country to seek work here, and now I serve the grain merchant.
        - id: ch04-b17
          speaker: narrator
          text: >-
            For three more nights she came, asked the same questions, and heard the same reply. Then she went to her father.
        - id: ch04-b18
          speaker: youngest_princess
          text: Father, I wish to marry, but I must choose my husband myself.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The King agreed. He invited every King, Raja, and royal son in the land to gather in his great garden, so his daughter could choose among them.
        - id: ch04-b20
          speaker: second_king
          text: >-
            Tomorrow morning, sit together in my garden. My youngest daughter will look upon you all and choose her husband. I do not know whom she will choose.
        - id: ch04-b21
          speaker: narrator
          text: >-
            The youngest princess ordered a grand elephant prepared for morning. When the day came, she put on her loveliest clothes and beautiful jewels, then climbed onto the elephant, whose body had been painted blue. She carried a gold necklace in her hand. All the visiting Kings, Rajas, and their sons sat together in the huge garden and waited. She rode slowly around them, looking at every royal face. The grain merchant's servant was also there, but not as a suitor. In his poor clothes, he stood among the servants and watched.
        - id: ch04-b22
          speaker: narrator
          text: >-
            After passing every royal suitor, the princess went straight to the grain merchant's servant and hung the gold necklace around his neck. Laughter broke out across the garden, and the visiting rulers stared in astonishment. They demanded to know what foolish game she was playing. Then they pushed the supposed poor man away, pulled the necklace from him, and told him his filthy clothes made him unfit even to stand near them. The boy obeyed and went a long way off, but remained in the garden to see what would happen.
        - id: ch04-b23
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: >-
            What foolishness is this? Get away from us, you dirty beggar!
        - id: ch04-b24
          speaker: narrator
          text: >-
            She circled the garden again and placed the necklace on him a second time. When the suitors tried to drive him out, she stopped them.
        - id: ch04-b25
          speaker: youngest_princess
          text: >-
            Take care! You must not send him away. Leave him alone.
        - id: ch04-b26
          speaker: narrator
          text: >-
            She lifted him onto her elephant and took him to the palace. The astonished guests could not understand why she preferred a poor man to any of them.
        - id: ch04-b27
          speaker: second_king
          text: >-
            I promised that my daughter might marry whomever she pleased. She has chosen this man twice, so he shall be her husband.
        - id: ch04-b28
          speaker: narrator
          text: >-
            They married with great splendor. Her parents accepted her choice, and the royal suitors returned home.
    - id: ch05
      title: The Prince Revealed
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The princess's six older sisters had married rich princes, and they mocked her poor, ugly-looking husband. Their husbands hunted every day and brought home plenty of game, while he always remained at the palace. This saddened his wife.
        - id: ch05-b02
          speaker: youngest_princess
          text: >-
            My sisters' husbands hunt each day and return with all kinds of game. Why do you never go with them? Why must you always stay home?
        - id: ch05-b03
          speaker: prince
          text: Today I am going out to take the air.
        - id: ch05-b04
          speaker: youngest_princess
          text: Then take one of the horses.
        - id: ch05-b05
          speaker: prince
          text: No, I will walk.
        - id: ch05-b06
          speaker: narrator
          text: >-
            He walked to the jungle plain where Katar still appeared to be a donkey. He told his friend everything. The youngest princess had chosen him, but everyone had laughed at her for marrying a poor common man. Her six sisters boasted because their husbands brought home game each day, while she grieved because he never hunted. Today, he said, he wished to hunt very much. Katar told him to twist the horse's left ear. At once the donkey became the great horse again. Then the boy twisted his own left ear. His ugly disguise vanished, and there stood a splendid young prince with a moon on his forehead and a star on his chin. He put on his rich clothes, saddled and bridled Katar, took his sword and gun, and rode away.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The prince rode far and shot many birds and deer. Because he had taken all the game, his six brothers-in-law wandered for nearly the whole day without finding anything. They had brought no food, could find no water, and grew painfully hungry and thirsty. Meanwhile, the young prince sat beneath a tree to dine and rest. Beside him were sweet water and roasted meat. His brothers-in-law found him there but did not recognize him at all. They whispered that this handsome prince, with a moon on his forehead and a star on his chin, must have come from another country. Then they approached, bowed many times, and begged for food and drink.
        - id: ch05-b08
          speaker: prince
          text: Who are you?
        - id: ch05-b09
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: >-
            We married the six elder daughters of this country's King. We have hunted all day and are dying of thirst and hunger.
        - id: ch05-b10
          speaker: prince
          text: >-
            I will feed you if you accept my condition. Each of you must let me press a red-hot pice against his back.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The six men agreed because they feared they would die without water. They also reasoned that no one would ever see the marks beneath their clothes. The young prince placed six pice in the fire until they glowed red. He pressed one hot coin against the back of each brother-in-law. Only after all six carried the hidden mark did he give them the good food and cool water. They ate and drank their fill, bowed to the unknown prince many times, and started home.
        - id: ch05-b12
          speaker: narrator
          text: >-
            At evening, the prince rode toward the palace. People marveled at the beautiful stranger with the moon and star, but the gatekeepers refused him entry.
        - id: ch05-b13
          speaker: prince
          text: I am the husband of your youngest princess.
        - id: ch05-b14
          speaker: narrator
          text: >-
            The servants insisted her husband was poor and ugly. When he repeated the truth, they called the princess.
        - id: ch05-b15
          speaker: youngest_princess
          text: >-
            This cannot be my husband. Mine is not nearly so handsome. You must be a prince from another land. Why do you make such a claim?
        - id: ch05-b16
          speaker: prince
          text: >-
            Because it is true. I was the grain merchant's servant who sang in your garden. For three nights I would not answer you. On the fourth, I told you where I came from and whom I served. Later you rode the blue elephant past all those kings and chose me twice with your gold necklace. Here is that necklace, with the ring and handkerchief you gave me on our wedding day.
        - id: ch05-b17
          speaker: narrator
          text: >-
            Then she knew him and rejoiced.
        - id: ch05-b18
          speaker: youngest_princess
          emotion: happy
          text: >-
            How strange you are! Until now you looked poor and ugly, but today you are the handsomest prince I have ever seen. Still, I know you are truly my husband.
        - id: ch05-b19
          speaker: narrator
          text: >-
            She worshipped God and gave thanks for such a husband. No one else in the country, she said, had his beauty, his moon, or his star. Then she led him into the palace and presented him to her father, her mother, and everyone there. They had never seen anyone like him and were all filled with happiness. The prince continued living with his wife in the King's palace, just as before, but now everyone knew his true appearance. Katar left the jungle plain and lived in the royal stables.
        - id: ch05-b20
          speaker: narrator
          text: >-
            One day, before a crowded court, the prince declared that six thieves stood among them. When the King demanded to see them, he pointed to his brothers-in-law.
        - id: ch05-b21
          speaker: prince
          text: >-
            Remove their coats. Each man bears a thief's mark on his back, and then you will see the truth.
        - id: ch05-b22
          speaker: narrator
          text: >-
            The marks of the red-hot coins were uncovered before everyone. The six princes burned with shame, while the young prince rejoiced. He had not forgotten how they mocked him when he seemed poor and common.
    - id: ch06
      title: The Feast on the Plain
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Before the prince married, Katar had told him the whole story of his birth and his mother's suffering. He had promised to take the boy back to his father's country afterward. Two months after the scene in court, Katar said the time had come.
        - id: ch06-b02
          speaker: katar
          text: >-
            Ask the King to let you return to your own country. Once we arrive, I will tell you what to do.
        - id: ch06-b03
          speaker: prince
          text: >-
            I long to visit my own country and see my father and mother.
        - id: ch06-b04
          speaker: youngest_princess
          text: >-
            Very well. I will ask my parents to allow us to go.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The princess told her father and mother, and they consented to the journey. Her father gave the couple many horses and elephants, all kinds of presents, and a large guard of sepoys. They traveled in grand state to the prince's country, which was not very many miles away. There they raised their tents on the same broad plain where the nurse had once buried the baby in his box. It was also the place where Shankar and Suri had so often brought him out after hiding him safely inside themselves.
        - id: ch06-b06
          speaker: narrator
          text: >-
            His father saw the great camp and feared that a mighty king had come to wage war. He sent a servant to ask whose camp it was. The prince answered in a letter.
        - id: ch06-b07
          speaker: prince
          text: >-
            Great King, do not fear. I have not come to fight you. Think of me as a son who has come to see your land and speak with you. I wish to feast everyone in your country for one week. Bring men and women, old and young, rich and poor, every caste, every child, fakir, and sepoy.
        - id: ch06-b08
          speaker: narrator
          text: >-
            Delighted, the King commanded everyone to attend. He came with his four Queens. Only the gardener's daughter was missing. No one had remembered the palace servant she had become.
        - id: ch06-b09
          speaker: prince
          text: Has every person in your country come to my feast?
        - id: ch06-b10
          speaker: king
          text: Yes, everyone is here.
        - id: ch06-b11
          speaker: prince
          text: Are you certain?
        - id: ch06-b12
          speaker: king
          text: Completely certain.
        - id: ch06-b13
          speaker: prince
          text: >-
            One woman is absent. She is the gardener's daughter, once your wife and now a servant in your palace.
        - id: ch06-b14
          speaker: king
          text: That is true. I had forgotten her.
        - id: ch06-b15
          speaker: narrator
          text: >-
            The prince sent his finest palanquin for her. His servants bathed her, dressed her in beautiful clothes and jewels, and carried her to the camp. While they were gone, the King studied the moon and star on the handsome stranger's face and wondered where he had been born.
        - id: ch06-b16
          speaker: narrator
          text: >-
            When the palanquin arrived, the prince himself helped the gardener's daughter out. He bowed to her many times and led her into his tent. The four Queens watched in surprise and anger. He had never bowed to them or shown them any attention.
        - id: ch06-b17
          speaker: narrator
          text: >-
            At dinner, he bowed to his mother again and served her food from the finest dishes. She could not understand his kindness. She had never seen anyone so beautiful, and she wondered which country had sent this prince with a moon on his forehead and a star on his chin. The feast lasted for two or three days. Throughout that time, the King and all his people spoke constantly about the stranger's beauty and tried to guess who he might be.
    - id: ch07
      title: The Prince Comes Home
      blocks:
        - id: ch07-b01
          speaker: prince
          text: Do you have any children?
        - id: ch07-b02
          speaker: king
          text: None.
        - id: ch07-b03
          speaker: prince
          text: Do you know who I am?
        - id: ch07-b04
          speaker: king
          text: No. Tell me.
        - id: ch07-b05
          speaker: prince
          text: I am your son, and the gardener's daughter is my mother.
        - id: ch07-b06
          speaker: king
          emotion: sad
          text: >-
            How could you be my son? I have never had a child.
        - id: ch07-b07
          speaker: prince
          text: >-
            I am your son. Your four wicked Queens claimed my mother bore a stone, but they placed that stone in my bed and tried to kill me.
        - id: ch07-b08
          speaker: narrator
          text: >-
            The King could not believe him, though he wished it were true.
        - id: ch07-b09
          speaker: prince
          text: >-
            Do you remember Shankar, the dog you ordered killed? Do you remember Suri, the cow you also killed? Your wives brought about their deaths because they protected me. And now, look at this horse. Do you know him?
        - id: ch07-b10
          speaker: king
          text: That is my horse Katar.
        - id: ch07-b11
          speaker: prince
          text: >-
            Yes. Do you remember him rushing from the stable with me on his back?
        - id: ch07-b12
          speaker: narrator
          text: >-
            Then Katar spoke. The horse declared that the young man truly was the King's son and told the entire story. He described the birth, the Queens' trick, the nurse and the buried box, and the years when Shankar, Suri, and Katar had kept the child alive. He told how the boy escaped on his back and grew into the prince standing there. At last the King understood that the impossible tale was true. Joy overcame him. He threw his arms around his son, kissed him, and wept.
        - id: ch07-b13
          speaker: king
          emotion: happy
          text: >-
            Come home to my palace now. You must live with me always.
        - id: ch07-b14
          speaker: prince
          text: >-
            I cannot. I came only to find my mother, and now I will take her to my father-in-law's palace. I married a King's daughter, and we live with her father.
        - id: ch07-b15
          speaker: king
          text: >-
            I have found you at last, and I cannot let you leave. You and your wife must live in my palace with your mother and me.
        - id: ch07-b16
          speaker: prince
          text: >-
            We will never do that unless you kill your four wicked Queens with your own hand. If you do it, then we will stay.
        - id: ch07-b17
          speaker: narrator
          text: >-
            So the King killed the four Queens. Then he returned to the palace with the gardener's daughter, his son, and his son's wife. They lived there happily ever after. The King thanked God for his beautiful son and for freeing him from his wicked wives.
        - id: ch07-b18
          speaker: narrator
          text: >-
            Katar never went back to the fairies' country. He stayed beside the young prince and never left him.
