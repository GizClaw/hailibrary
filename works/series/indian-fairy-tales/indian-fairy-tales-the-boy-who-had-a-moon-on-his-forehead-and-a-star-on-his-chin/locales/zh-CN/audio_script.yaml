        delivery: 善良温顺，受苦时哀伤却不失柔韧
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严直率，动怒时严厉，动情时深沉
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
    queen_1:
      display_name: 大王后
      tts:
        delivery: 表面亲热，暗藏嫉妒与算计
        timbre: 清晰偏冷
        pace: 稍缓
        pitch: 中
    queen_2:
      display_name: 二王后
      tts:
        delivery: 附和而阴险，慌乱时尖促
        timbre: 略显干冷
        pace: 适中
        pitch: 中高
    queen_3:
      display_name: 三王后
      tts:
        delivery: 虚假殷勤，言语里带着催逼
        timbre: 轻细偏冷
        pace: 稍快
        pitch: 中高
    queen_4:
      display_name: 四王后
      tts:
        delivery: 随声附和，狠毒而急切
        timbre: 尖细清楚
        pace: 稍快
        pitch: 高
    nurse:
      display_name: 乳母
      tts:
        delivery: 谨慎低声，服从中带着畏缩
        timbre: 低柔朴素
        pace: 适中
        pitch: 中
    shankar:
      display_name: 香卡尔
      tts:
