    suitor_1:
      display_name: 求婚者甲
      tts:
        delivery: 傲慢刻薄，受挫时气急
        timbre: 清亮偏硬
        pace: 稍快
        pitch: 中
    suitor_2:
      display_name: 求婚者乙
      tts:
        delivery: 自负轻蔑，跟随众人起哄
        timbre: 偏高而硬
        pace: 稍快
        pitch: 中高
    suitor_3:
      display_name: 求婚者丙
      tts:
        delivery: 盛气凌人，嘲笑时夸张
        timbre: 厚而发亮
        pace: 适中
        pitch: 中低
    brother_in_law_1:
      display_name: 大姐夫
      tts:
