        pace: 舒缓
        pitch: 中低
    cowherd:
      display_name: 牧牛人
      tts:
        delivery: 惊奇急切，禀报时一口气说完
        timbre: 朴实明亮
        pace: 稍快
        pitch: 中
    qatar:
      display_name: 卡塔尔
      tts:
        delivery: 沉着果断，关爱中带着仙马的威仪
        timbre: 深厚清朗
        pace: 适中
        pitch: 中低
    prince:
      display_name: 年轻王子
