  chapters:
    - id: ch01
      title: Three Creatures Saved
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A merchant gave his son three hundred rupees and sent him to another country to try his luck in trade. Before the young man had gone far, he found some herdsmen arguing over a dog. Several of them wanted to kill it.
        - id: ch01-b02
          speaker: merchant_son
          text: >-
            Please spare the dog. I will pay you one hundred rupees for it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The herdsmen accepted at once. The tender-hearted young man took the dog and went on. Soon he met another group fighting over a cat, and again some wished to kill the animal.
        - id: ch01-b04
          speaker: merchant_son
          text: >-
            Oh, please let the cat live. I will give you one hundred rupees for it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They gladly made the bargain. Farther on, in a village, some people were quarreling over a snake they had caught. When the young man heard that some meant to kill it, he made the same offer.
        - id: ch01-b06
          speaker: merchant_son
          text: >-
            Do not kill the snake. Take my last one hundred rupees and give it to me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The villagers were delighted. But now all three hundred rupees were gone. The young man had nothing left for trade, so he returned home with the dog, the cat, and the snake.
        - id: ch01-b08
          speaker: merchant
          text: >-
            You fool! You scamp! You have wasted every rupee I gave you. Go live in the stables and think about what you have done. You will never enter my house again!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            The son obeyed. He slept on the grass spread for the cattle, with the three creatures he had bought so dearly. They grew very fond of him. They followed him all day and slept beside him at night. The cat curled at his feet, the dog lay by his head, and the snake rested across his body, its head on one side and its tail on the other.
    - id: ch02
      title: Beneath the Sacred Spring
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, as the young man and the snake talked, the snake told him its secret.
        - id: ch02-b02
          speaker: snake
          text: >-
            I am the son of Raja Indrasha. I had come out of the ground to breathe the air when those people caught me. They would have killed me if you had not arrived. I can never repay such kindness. If only you knew my father! He would be so glad to meet the man who saved his son.
        - id: ch02-b03
          speaker: merchant_son
          text: Where does your father live? If I can, I would like to meet him.
        - id: ch02-b04
          speaker: snake
          text: >-
            Good! Do you see that mountain? A sacred spring lies at its foot. Dive into the spring with me, and we will reach my father's country. He will want to reward you. If he asks what you desire, request the ring from his right hand and his famous pot and spoon. Speak to the ring, and a beautiful furnished house will appear. The pot and spoon will give you every kind of rare and delicious food. With those treasures, you will never be in need.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The young man set out with all three companions. At the spring, he prepared to jump in. The cat and dog saw what he meant to do and cried out together.
        - id: ch02-b06
          speakers: [cat, dog]
          ensemble: duo
          text: Master, what will happen to us? Where are we supposed to go?
        - id: ch02-b07
          speaker: merchant_son
          text: >-
            Wait here for me. I am not going far, and I will be back soon.
        - id: ch02-b08
          speaker: narrator
          text: He dived beneath the water and vanished.
        - id: ch02-b09
          speaker: dog
          text: What do we do now?
        - id: ch02-b10
          speaker: cat
          text: >-
            We stay here, just as our master told us. Do not worry about food. I will visit the houses nearby and find enough for both of us.
        - id: ch02-b11
          speaker: narrator
          text: >-
            And that was what the cat did. The two waited quite comfortably until their master returned.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Meanwhile, the young man and the snake reached Raja Indrasha's country safely. Word of their arrival went to the Raja, who ordered his son and the stranger to appear before him. The snake refused to come. It said the stranger had saved it from a terrible death, so it was now his slave and could not return to its father until it was released.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Raja Indrasha went to them himself. He embraced his son, greeted the young man with respect, and welcomed him throughout the kingdom. The guest stayed there for several days. The Raja wanted to show how grateful he was to the man who had delivered his son from death. So he gave the young man the ring from his right hand, along with the famous pot and spoon.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The young man traveled back through the spring. At the surface, the dog and cat were still waiting faithfully for him. The friends told one another everything they had experienced while they were apart, and all of them rejoiced to be together again. Afterward, they walked side by side to the riverbank. There they decided to test the powers of the charmed ring, pot, and spoon.
    - id: ch03
      title: The Golden Hair
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The merchant's son spoke to the ring. At once, a beautiful house appeared, and with it came a lovely princess whose hair was golden. He spoke to the pot and spoon, and the finest dishes appeared before them. The young man married the princess, and for several years they lived very happily.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Then one morning, as the princess arranged her hair, she placed the loose strands inside a hollow piece of reed. She threw it into the river beneath her window. The reed floated for many miles until the prince of that country found it. He opened it out of curiosity and saw the golden hair.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The prince hurried back to the palace, locked himself in his room, and refused to come out. The sight of that golden hair had made him fall desperately in love with the woman it belonged to, though he had never seen her. He would not eat or drink. He would not sleep or stir from his room. He swore he would remain there until someone brought the woman to him.
        - id: ch03-b04
          speaker: narrator
          text: >-
            His father, the king, was deeply troubled and had no idea what to do. Each day he feared that his son would die and leave the kingdom without an heir. At last, the king decided to seek advice from his aunt, who was an ogress. The old woman listened to his trouble and agreed to help. She told him not to be anxious. She was certain she could find the beautiful woman and bring her back to become his son's wife.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The ogress changed herself into a bee and flew away, buzzing and buzzing. Her sharp sense of smell led her to the princess. There she took the shape of an old woman leaning on a stick.
        - id: ch03-b06
          speaker: ogress
          text: >-
            I am your aunt. You have never met me because I left this country just after you were born.
        - id: ch03-b07
          speaker: narrator
          text: >-
            To make the lie seem true, the ogress hugged and kissed her like a loving relative. The princess was completely deceived. She embraced the old woman in return and invited her into the house. She begged her supposed aunt to remain for as long as she could. Then she treated her guest with so much honor and care that the ogress believed her errand would soon be done.
        - id: ch03-b08
          speaker: narrator
          text: >-
            For three days, the ogress said nothing about her real purpose. Then she carefully turned the talk toward the charmed ring. She advised the princess to keep such a treasure herself instead of leaving it with her husband. After all, the young man was often away hunting or traveling on other expeditions. He might easily lose it. The princess trusted this advice. She asked her husband for the ring, and he readily placed it in her hands.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The ogress waited one more day before asking to see the precious ring. The princess suspected nothing and showed it to her. In an instant, the ogress snatched the ring, changed back into a bee, and flew to the palace. The prince was now close to death.
        - id: ch03-b10
          speaker: ogress
          text: >-
            Get up and be happy. You need not grieve any longer. The woman you long for will come when you call her. Here is the charm that can bring her to you.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The prince was nearly mad with joy. He wanted to see the princess so badly that he spoke to the ring at once. The house, with the princess inside it, came down in the middle of the palace garden. The prince entered and told her how deeply he loved her. He begged her to become his wife.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The princess saw no way to escape. She agreed, but only on the condition that he wait for one month.
    - id: ch04
      title: A Month to Bring Them Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            While this was happening, the merchant's son returned from hunting. He looked for his wife and house, but both had vanished. Nothing remained. The empty spot looked exactly as it had before he first tried Raja Indrasha's charmed ring. The sight filled him with terrible distress. He sat down alone and decided there was nothing left to do but end his life.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Soon the cat and dog returned. They had hidden when they saw the house and everything in it disappear.
        - id: ch04-b03
          speakers: [cat, dog]
          ensemble: duo
          text: >-
            Master, stop! This is a terrible trial, but it can still be put right. Give us one month. We will go and try to bring back your wife and your house.
        - id: ch04-b04
          speaker: merchant_son
          text: >-
            Go, and may the great God help you. Bring my wife back to me, and I will live.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The cat and dog raced away. They did not stop until they reached the place where the house and their mistress had been taken.
        - id: ch04-b06
          speaker: cat
          text: >-
            This may be difficult. Look, the king has taken our master's wife and house. Wait here while I climb up and try to see her.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The dog sat down. The cat climbed the wall, slipped through the window, and entered the room where the princess was sitting. The princess recognized her and explained everything that had happened since the house vanished.
        - id: ch04-b08
          speaker: princess
          text: Is there any way for me to escape these people?
        - id: ch04-b09
          speaker: cat
          text: Yes, if you can tell me where they keep the charmed ring.
        - id: ch04-b10
          speaker: princess
          text: The ogress swallowed it. The ring is in her stomach.
        - id: ch04-b11
          speaker: cat
          text: >-
            Then I will get it back. Once we have that ring, everything will belong to us again.
    - id: ch05
      title: The Wedding of the Rats
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The cat climbed down and stretched out beside a rat hole, pretending to be dead. By chance, a great wedding was taking place among the rats. Rats from all around had gathered inside that very hole, for the eldest son of the rat king was about to be married.
        - id: ch05-b02
          speaker: narrator
          text: >-
            When the cat discovered what was happening underground, she formed a plan. She would seize the bridegroom and make him provide the help she needed. Soon the whole wedding procession poured from the hole. The rats squealed and leaped in celebration as they followed their prince. The cat watched until she recognized the bridegroom among them. Then she sprang up and pinned him beneath her paws.
        - id: ch05-b03
          speaker: rat_bridegroom
          text: Oh, let me go! Please let me go!
          emotion: fearful
        - id: ch05-b04
          speakers: [rat_1, rat_2]
          ensemble: duo
          text: Please release him! Today is his wedding day!
        - id: ch05-b05
          speaker: cat
          text: >-
            No. I will not let him go unless you help me. The ogress in that house has swallowed a ring that I need. Bring it to me, and your prince may leave unharmed. Refuse, and he will die beneath my paws.
        - id: ch05-b06
          speakers: [rat_king, rat_1, rat_2]
          ensemble: chorus
          text: >-
            We agree. We will bring you the ring. If we fail, you may devour us all.
        - id: ch05-b07
          speaker: narrator
          text: >-
            It was a bold promise, but the rats found a way to keep it. They waited until midnight, when the ogress was sound asleep. One of them crept into her room, reached her bedside, and climbed up onto her face. The rat pushed its tail down her throat. The sleeping ogress began to cough violently. At last, the ring came out of her stomach and rolled across the floor.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The rat seized it and hurried to the rat king. Delighted, the king took the ring straight to the cat, and his son was set free.
    - id: ch06
      title: The Ring in the Stream
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            As soon as the cat received the ring, she and the dog started home to tell their master the good news. Everything seemed safe now. They only had to place the charm in his hands. He would speak to it, the house and beautiful princess would return, and life could go on as happily as before. The companions kept thinking of how glad their master would be, and they ran as fast as their legs could carry them.
        - id: ch06-b02
          speaker: narrator
          text: >-
            On the way, they had to cross a stream. The dog swam while the cat rode on his back. But the dog was jealous. He demanded the ring and threatened to throw the cat into the water unless she gave it to him. The cat had no choice. She handed it over, and the dog promptly dropped it. A fish swallowed it.
        - id: ch06-b03
          speaker: dog
          text: Oh, what am I going to do? What can I possibly do?
        - id: ch06-b04
          speaker: cat
          text: >-
            What is done cannot be undone. We must get the ring back. If we fail, we may as well drown ourselves in this stream. I have a plan. Go kill a small lamb and bring it here.
        - id: ch06-b05
          speaker: dog
          text: All right. I will go now.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The dog soon returned with a dead lamb. The cat crawled inside it and told the dog to move away and remain quiet. Before long, a nadhar appeared overhead. This bird could break a fish's bones with a look. It circled the lamb, then swooped down to carry it off.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Just as the bird came down on the lamb, the cat burst out and leaped onto it. She held the nadhar fast and threatened to kill it unless it recovered the lost ring. The bird readily promised to help. It flew straight to the king of the fishes and ordered him to question every fish until the ring was found. The fish king did as he was told. The fish that had swallowed the ring was discovered, and the precious thing was carried back to the waiting cat.
        - id: ch06-b08
          speaker: cat
          text: Come on. I have the ring again.
        - id: ch06-b09
          speaker: dog
          text: >-
            No, I will not come unless you give it to me. I can carry it as well as you can. Hand it over, or I will kill you.
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: >-
            Once more, the cat was forced to obey. And once more, the careless dog soon dropped the ring. This time, a kite swooped down, picked it up, and carried it away.
        - id: ch06-b11
          speaker: cat
          text: Look! There it goes, heading for that great tree!
          emotion: surprised
        - id: ch06-b12
          speaker: dog
          text: Oh, what have I done now?
        - id: ch06-b13
          speaker: cat
          text: >-
            You foolish creature! I knew this would happen. Now stop barking, or you will scare the bird away. If it flies somewhere else, we may never find it.
          emotion: angry
        - id: ch06-b14
          speaker: narrator
          text: >-
            The cat waited until darkness fell. Then she climbed the tree, killed the kite, and took back the ring. When she reached the ground, she called to the dog.
        - id: ch06-b15
          speaker: cat
          text: >-
            Come on. We must hurry. We have lost too much time already, and our master may die from grief while he waits for us.
    - id: ch07
      title: Sorrow Turned to Joy
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The dog was thoroughly ashamed. He begged the cat to forgive all the trouble he had caused. He did not dare ask for the ring a third time.
        - id: ch07-b02
          speaker: narrator
          text: >-
            At last, the two companions reached their sorrowing master safely and gave him the precious charm. In one moment, his grief turned to joy. He spoke to the ring, and his beautiful wife and house appeared again.
        - id: ch07-b03
          speaker: narrator
          text: >-
            The merchant's son, the princess, and all their faithful companions were as happy as they could ever be.
