  chapters:
    - id: ch01
      title: The Crane's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, the Bodisat was born into the forest as the Genius of a tree beside a lotus pond.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Not far away was a smaller pond where many fish lived. When the dry season came, its water began to run low. A crane saw the fish and thought, “Somehow, I must trick these fish and make a meal of them.” He settled at the water's edge and began planning how to do it.
        - id: ch01-b03
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: >-
            Why are you sitting there so deep in thought?
        - id: ch01-b04
          speaker: crane
          text: I was thinking about all of you.
        - id: ch01-b05
          speaker: fish_1
          text: About us? What were you thinking, sir?
        - id: ch01-b06
          speaker: crane
          text: >-
            There is hardly any water left in this pond, and you have very little food. The heat is fierce, too. I was wondering what will become of you now.
        - id: ch01-b07
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: Then what can we do, sir?
        - id: ch01-b08
          speaker: crane
          text: >-
            Do as I say, and I will carry you in my beak to a fine, large pond covered with every kind of lotus. I will set you down in its water.
        - id: ch01-b09
          speaker: fish_2
          text: >-
            A crane caring about fish? No one has ever heard of such a thing. You mean to eat us one at a time.
        - id: ch01-b10
          speaker: crane
          text: >-
            No, I do not. As long as you trust me, I will not eat you. If you doubt that the pond exists, send one fish with me to see it.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The fish began to trust him. They chose a large fish who was blind in one eye, because they thought he could handle any danger, in the water or on land.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The crane carried him to the other pond and let him swim in its water. He showed the fish the whole pond, with all its lotuses, then carried him back and released him beside the others. The one-eyed fish told them about everything he had seen and how splendid the pond was.
        - id: ch01-b13
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: All right, sir. You may carry us there.
    - id: ch02
      title: The Fish-Bones Under the Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The crane took the old, one-eyed fish first. He flew to the bank of the other pond and landed in a Varana-tree. But instead of placing the fish in the pond, he threw him into a fork in the tree. He struck him with his beak, killed him, and ate his flesh. Then he dropped the bones at the foot of the tree.
        - id: ch02-b02
          speaker: narrator
          text: The crane returned to the little pond and called out.
        - id: ch02-b03
          speaker: crane
          text: That fish is safely in the pond. Send the next one.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The crane did the same thing again and again. Each time, he carried one fish away to the Varana-tree, killed it, and ate it. Then he returned for another. At last, after taking the fish one by one, he came back to the little pond and found that no fish remained.
        - id: ch02-b05
          speaker: narrator
          text: >-
            A crab was still there. The crane decided to eat him as well.
        - id: ch02-b06
          speaker: crane
          text: >-
            Good crab, I have carried all the fish to a fine, large pond. Come with me, and I will take you there too.
        - id: ch02-b07
          speaker: crab
          text: How will you hold me while you carry me?
        - id: ch02-b08
          speaker: crane
          text: I will grip you with my beak.
        - id: ch02-b09
          speaker: crab
          text: >-
            If you carry me that way, you will drop me. I will not go.
        - id: ch02-b10
          speaker: crane
          text: Do not worry. I will keep a tight hold on you the whole way.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The crab thought, “If this fellow caught a fish, he would never release it into a pond. Still, if he truly puts me in the water, that will be excellent. If he does not, I will cut his throat and kill him.”
        - id: ch02-b12
          speaker: crab
          text: >-
            Listen, friend. You cannot hold me tightly enough. But we crabs have a powerful grip. Let me fasten my claws around your neck, and I will gladly go with you.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The crane did not realize that the crab was tricking him, so he agreed. The crab locked his claws around the crane's neck as firmly as a blacksmith's pincers.
        - id: ch02-b14
          speaker: crab
          text: Now, off we go!
    - id: ch03
      title: The Crab Sees the Bones
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The crane flew away with the crab. He showed him the large pond, but then he turned toward the Varana-tree.
        - id: ch03-b02
          speaker: crab
          text: >-
            Uncle! The pond is over there, but you are carrying me this way!
          emotion: surprised
        - id: ch03-b03
          speaker: crane
          text: >-
            Oh, so that is how it is? You call me your dear uncle and make yourself my sweet little nephew. Do you expect me to believe that? Do you think I am your servant, here to lift you up and carry you wherever you please? Look closely at the pile of fish-bones beneath that Varana-tree. I ate every one of those fish, and I will devour you just as I devoured them!
        - id: ch03-b04
          speaker: crab
          text: >-
            Those fish were eaten because they were foolish. But you will not eat me. I am the one who will destroy you. You were too foolish to see that I was tricking you. If I die, we will die together. I will cut off your head and throw it to the ground!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: >-
            With that, the crab clamped his claws around the crane's neck like a vise.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The crane gasped. Tears ran from his eyes, and he trembled in fear of death. He begged the crab for mercy.
        - id: ch03-b07
          speaker: crane
          text: >-
            My lord, I truly did not mean to eat you. Please spare my life!
          emotion: fearful
        - id: ch03-b08
          speaker: crab
          text: >-
            Very well. Go down to the pond and put me in the water.
    - id: ch04
      title: The Crane Outwitted
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The crane turned back, descended to the pond, and placed the crab on the mud at the water's edge.
        - id: ch04-b02
          speaker: narrator
          text: >-
            But before entering the water, the crab sliced clean through the crane's neck, as easily as a hunting knife cuts a lotus stalk. Only then did he go into the pond.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Genius in the Varana-tree had watched this strange affair. He filled the forest with applause, then spoke these words in a pleasant voice.
        - id: ch04-b04
          speaker: tree_genius
          text: >-
            A villain may be very clever, but he will not prosper through his villainy. With a sharp mind and deceit, he may win for a time. But his victory will end just as the crane's did when he tried to trick the crab.
