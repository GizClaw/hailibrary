cover_prompt: |-
  A wordless cover scene in a moonlit palace garden in late nineteenth-century India shows a young royal traveler seeing a radiant princess on a high roof for the first time. The traveler wears fine traditional court clothes and stands beside his saddled horse beneath a broad tree, while green parrots cluster among the branches above him. The princess wears rich garments and jewels, her hair rolled up beneath a band of diamonds and pearls that casts a gentle light across the palace walls. Their distant meeting is the focal action, with the traveler looking upward and the princess seated calmly against the night sky. Use a wide child-height composition framed by garden foliage and palace arches, with calm open sky above the roof for title placement. Keep the architecture, clothing, animals, and objects grounded in the book's premodern Indian settings, with warm expressions and no frightening imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
