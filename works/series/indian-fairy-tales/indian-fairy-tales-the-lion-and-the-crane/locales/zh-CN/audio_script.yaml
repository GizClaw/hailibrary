audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    crane:
      display_name: 白鹤
      tts:
        delivery: 谨慎而明理，言语清楚，诗句中带着克制的锋芒
        timbre: 清亮轻盈，干净而不稚嫩
        pace: 适中，思量和劝诫处略缓
        pitch: 中高
    lion:
      display_name: 狮子
      tts:
        delivery: 强硬而自负，求救时因痛苦稍显急迫
        timbre: 低沉粗粝，带有兽王的压迫感
        pace: 稍慢，短句落得有力
        pitch: 低
    buddha:
      display_name: 乔达摩佛陀
      tts:
        delivery: 平静庄重，点明前世时清楚而笃定
        timbre: 温厚深沉，安定而通透
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 白鹤救狮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            从前，菩萨转生在喜马梵一带，成了一只白鹤。那时候，梵授王统治着波罗奈。一头狮子吃肉时，骨头卡进喉咙。他的喉头肿了起来，什么也咽不下去，疼得厉害。
        - id: ch01-b02
          speaker: narrator
          text: |-
            白鹤停在树上找食物，看见狮子痛苦的模样，便问。
        - id: ch01-b03
          speaker: crane
          text: “朋友，你这是怎么了？”
        - id: ch01-b04
          speaker: narrator
          text: 狮子说出了骨头卡喉的缘由。
        - id: ch01-b05
          speaker: crane
          text: “朋友，那根骨头我能取出来。可我不敢把头伸进你嘴里，万一你把我吃了呢？”
        - id: ch01-b06
          speaker: lion
          text: “你别怕，我绝不会吃你。快救救我的命吧。”
        - id: ch01-b07
          speaker: crane
          text: “好吧，我救你。”
        - id: ch01-b08
          speaker: narrator
          text: |-
            白鹤让狮子向左侧躺好，心里仍不放心。谁知道这家伙会做出什么事？他先找来一根小木棍，直直撑住狮子的上下颚，让那张大嘴合不起来。接着，他才把头伸进狮口，用长喙猛敲骨头的一端。骨头松了，掉了出来。
        - id: ch01-b09
          speaker: narrator
          text: |-
            白鹤抽回脑袋，又用长喙一击，把撑嘴的木棍也打落了，这才飞到树枝上。狮子的病就这样好了。
    - id: ch02
      title: 向狮子索报
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            一天，狮子捕杀了一头水牛，正在吃肉。白鹤想试一试，看这头狮子会怎样对待自己。他落到狮子正上方的树枝上，朝下面念出了第一首诗。
        - id: ch02-b02
          speaker: crane
          text: |-
            “我们曾经帮助过你，也已经尽了全力。百兽之王，尊贵的陛下，你要怎样回报我们的善意？”
        - id: ch02-b03
          speaker: narrator
          text: 狮子听了，用第二首诗作答。
        - id: ch02-b04
          speaker: lion
          text: |-
            “我饮血为生，每天都在追捕猎物。你曾经进过我的牙齿之间，如今还能活着，就已经够幸运了。”
    - id: ch03
      title: 白鹤离去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 白鹤便用最后两首诗回答狮子。
        - id: ch03-b02
          speaker: crane
          text: |-
            “忘恩负义的人不肯行善。他希望别人善待自己，却不肯照样善待别人。他心里没有一点感激，为这样的人效劳，全是徒然。

            “再明白不过的善行，也换不来他的友情。最好安安静静地离开他，不必羡慕，也不必辱骂。”
        - id: ch03-b03
          speaker: narrator
          text: 白鹤说完，便展翅飞走了。
        - id: ch03-b04
          speaker: narrator
          text: 伟大的导师乔达摩佛陀每次讲完这个故事，总会再补上一句。
        - id: ch03-b05
          speaker: buddha
          text: “那时候的狮子，就是叛徒提婆达多。那只白鹤，正是我自己。”
