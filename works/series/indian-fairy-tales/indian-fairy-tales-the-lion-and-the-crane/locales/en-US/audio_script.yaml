audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    crane:
      display_name: White Crane
      tts:
        delivery: careful and plainspoken
        timbre: light and clear
        pace: measured
        pitch: medium-high
    lion:
      display_name: Lion
      tts:
        delivery: forceful and self-assured
        timbre: deep and rough
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Bone in the Lion's Throat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, the Bodhisatta was born as a white crane in the Himavanta region. At that time, Brahmadatta ruled in Benares. One day, a lion was eating meat when a bone lodged in his throat. His throat swelled up. He could not eat, and the pain was terrible.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The crane was perched in a tree, looking for food, when he saw the suffering lion. He called down to him.
        - id: ch01-b03
          speaker: crane
          text: What is wrong, my friend?
        - id: ch01-b04
          speaker: narrator
          text: The lion told him about the bone. The crane considered what he could do.
        - id: ch01-b05
          speaker: crane
          text: >-
            I could get that bone out for you. But I am afraid to put my head into your mouth. You might eat me.
        - id: ch01-b06
          speaker: lion
          text: >-
            Do not be afraid, friend. I will not eat you. Just save my life.
        - id: ch01-b07
          speaker: crane
          text: All right. I will help you.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The crane had the lion lie on his left side. Still, he thought, “Who knows what this fellow might do?” So he stood a small stick upright between the lion's jaws, where it would keep his mouth from closing. Then the crane put his head inside and struck one end of the bone with his beak. The bone dropped out.
        - id: ch01-b09
          speaker: narrator
          text: >-
            At once, the crane drew his head out of the lion's mouth. He knocked the stick away with his beak and flew up to a branch.
    - id: ch02
      title: The Crane Asks for a Return
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The lion recovered. One day, the crane found him eating a buffalo he had killed. “I will test him,” thought the crane. He settled on a branch just above the lion and spoke to him.
        - id: ch02-b02
          speaker: crane
          text: >-
            I served you as well as I could, O King of Beasts. Your Majesty, what will you give me in return?
        - id: ch02-b03
          speaker: lion
          text: >-
            I live on blood, and I am always hunting prey. You once stood between my teeth, and you are still alive. That is reward enough.
    - id: ch03
      title: The Crane Flies Away
      blocks:
        - id: ch03-b01
          speaker: crane
          text: >-
            An ungrateful creature does no good and will not treat others as he wishes to be treated. There is no gratitude in him. Serving him is useless.
        - id: ch03-b02
          speaker: crane
          text: >-
            Even the clearest good deed will not win his friendship. It is better to leave him quietly, without envy and without abuse.
        - id: ch03-b03
          speaker: narrator
          text: With those words, the crane flew away.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When the great Teacher, Gautama the Buddha, told this tale, he would add, “The lion of that time was Devadatta the Traitor. The white crane was I myself.”
