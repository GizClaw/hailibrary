  chapters:
    - id: ch01
      title: The Road to Granny's House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, there was a wee little Lambikin. He frisked about on his tottery legs and had a wonderful time.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, he set off to visit his Granny. He skipped along, thinking happily of all the good things she would give him. Then a Jackal saw the tender young morsel coming down the road.
        - id: ch01-b03
          speaker: jackal
          text: Lambikin! Lambikin! I'm going to eat you!
        - id: ch01-b04
          speaker: narrator
          text: Lambikin only gave a little frisk.
        - id: ch01-b05
          speaker: lambikin
          text: >-
            To Granny's house I go, where I shall fatter grow. Then you can eat me so.
        - id: ch01-b06
          speaker: narrator
          text: The Jackal decided that sounded reasonable, so he let Lambikin pass.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Before long, Lambikin met a Vulture. The hungry bird looked down at the tender morsel before him.
        - id: ch01-b08
          speaker: vulture
          text: Lambikin! Lambikin! I'm going to eat you!
        - id: ch01-b09
          speaker: narrator
          text: Once again, Lambikin gave a little frisk.
        - id: ch01-b10
          speaker: lambikin
          text: >-
            To Granny's house I go, where I shall fatter grow. Then you can eat me so.
        - id: ch01-b11
          speaker: narrator
          text: The Vulture thought that was reasonable too, and let him go on.
    - id: ch02
      title: Lambikin Grows Fat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Farther along, Lambikin met a Tiger, then a Wolf, a Dog, and an Eagle. Each one looked at the tender little morsel and called to him.
        - id: ch02-b02
          speakers: [tiger, wolf, dog, eagle]
          ensemble: chorus
          text: Lambikin! Lambikin! I'm going to eat you!
        - id: ch02-b03
          speaker: narrator
          text: Each time, Lambikin answered with a little frisk.
        - id: ch02-b04
          speaker: lambikin
          text: >-
            To Granny's house I go, where I shall fatter grow. Then you can eat me so.
        - id: ch02-b05
          speaker: narrator
          text: And each of them let him pass.
        - id: ch02-b06
          speaker: narrator
          text: At last, Lambikin reached his Granny's house. He spoke in a great hurry.
        - id: ch02-b07
          speaker: lambikin
          text: >-
            Granny dear, I promised to get very fat, and people ought to keep their promises. Please put me in the corn bin right away!
        - id: ch02-b08
          speaker: narrator
          text: >-
            Granny called him a good boy and put him into the corn bin. Greedy little Lambikin stayed there for seven days. He ate and ate and ate, until he could hardly waddle.
        - id: ch02-b09
          speaker: narrator
          text: At last, Granny said he was fat enough for anything and had to go home.
        - id: ch02-b10
          speaker: narrator
          text: >-
            But cunning little Lambikin said that would never do. He was so plump and tender now that some animal would surely eat him on the way back.
        - id: ch02-b11
          speaker: lambikin
          text: >-
            I know what you must do. Make a little drumikin from the skin of my little brother who died. I can curl up inside and roll along nicely, because I'm as tight as a drum myself.
        - id: ch02-b12
          speaker: narrator
          text: >-
            So Granny made a fine little drumikin from his brother's skin, with the wool turned inward. Lambikin curled up in the middle, snug and warm, and rolled away merrily.
    - id: ch03
      title: The Little Drumikin
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon the rolling drumikin met the Eagle.
        - id: ch03-b02
          speaker: eagle
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch03-b03
          speaker: narrator
          text: From his soft, warm nest inside, Lambikin answered.
        - id: ch03-b04
          speaker: lambikin
          text: >-
            Fallen into the fire, and so will you. On, little Drumikin! Tum-pa, tum-too!
        - id: ch03-b05
          speaker: eagle
          text: How very annoying!
        - id: ch03-b06
          speaker: narrator
          text: The Eagle sighed and thought sadly of the tender morsel he had allowed to get away.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Lambikin rolled on, laughing to himself and singing as he went.
        - id: ch03-b08
          speaker: lambikin
          text: Tum-pa, tum-too! Tum-pa, tum-too!
        - id: ch03-b09
          speaker: vulture
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch03-b10
          speaker: tiger
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch03-b11
          speaker: wolf
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch03-b12
          speaker: dog
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch03-b13
          speaker: narrator
          text: Each time, the sly little fellow called back from inside.
        - id: ch03-b14
          speaker: lambikin
          text: >-
            Fallen into the fire, and so will you. On, little Drumikin! Tum-pa, tum-too! Tum-pa, tum-too! Tum-pa, tum-too!
        - id: ch03-b15
          speaker: narrator
          text: >-
            One after another, they sighed over the tender little morsel they had let slip away.
    - id: ch04
      title: The Jackal Knows the Voice
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last, the Jackal came limping along. He looked sorry enough, but he was still as sharp as a needle. He called out to the little drum.
        - id: ch04-b02
          speaker: jackal
          text: Drumikin! Drumikin! Have you seen Lambikin?
        - id: ch04-b03
          speaker: narrator
          text: Curled up in his snug little nest, Lambikin answered cheerfully.
        - id: ch04-b04
          speaker: lambikin
          text: >-
            Fallen into the fire, and so will you. On, little Drumikin! Tum-pa—
        - id: ch04-b05
          speaker: narrator
          text: >-
            He never finished. The Jackal knew Lambikin's voice at once.
        - id: ch04-b06
          speaker: jackal
          text: >-
            Hello! So you've turned yourself inside out, have you? Come out of there!
        - id: ch04-b07
          speaker: narrator
          text: Then the Jackal tore open the drumikin and gobbled up Lambikin.
