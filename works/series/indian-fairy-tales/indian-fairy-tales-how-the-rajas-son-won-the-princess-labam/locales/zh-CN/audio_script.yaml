audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 真诚坚定，年轻而勇敢，遇险时仍有温和善意
        timbre: 清朗明亮，富有朝气
        pace: 适中，决意行动时稍快
        pitch: 中
    rani:
      display_name: 王后
      tts:
        delivery: 慈爱端庄，劝阻儿子时忧心而恳切
        timbre: 柔和温润，成熟稳重
        pace: 舒缓
        pitch: 中
    father_raja:
      display_name: 父王
      tts:
        delivery: 沉稳慈爱，言语中带着父亲的牵挂
        timbre: 浑厚温暖
        pace: 适中偏慢
        pitch: 中低
    hiraman:
      display_name: 希拉曼鹦鹉
      tts:
        delivery: 机敏威严，受惊时仍像一位发号施令的首领
        timbre: 清脆响亮
        pace: 稍快
        pitch: 高
    parrot_1:
      display_name: 鹦鹉甲
      tts:
        delivery: 机警直率，带着鸟儿般的轻快
        timbre: 清脆轻盈
        pace: 稍快
        pitch: 高
    parrot_2:
      display_name: 鹦鹉乙
      tts:
        delivery: 机警直率，语气谨慎
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高
    ant_raja:
      display_name: 蚁王
      tts:
        delivery: 诚恳可靠，说话简短而笃定
        timbre: 细而清楚
        pace: 适中
        pitch: 中高
    tiger:
      display_name: 老虎
      tts:
        delivery: 粗犷直率，疼痛时急促，报恩时坚定
        timbre: 低沉粗粝
        pace: 稍慢
        pitch: 低
    tigress:
      display_name: 虎妻
      tts:
        delivery: 警觉有力，弄清缘由后坦率友善
        timbre: 厚实清晰
        pace: 适中
        pitch: 中低
    fakir_1:
      display_name: 苦行僧甲
      tts:
        delivery: 固执急切，争执时毫不退让
        timbre: 干涩清楚
        pace: 稍快
        pitch: 中
    fakir_2:
      display_name: 苦行僧乙
      tts:
        delivery: 固执强硬，反驳时干脆直接
        timbre: 略低而沙哑
        pace: 稍快
        pitch: 中低
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 善良谨慎，担忧国王时语气急切
        timbre: 苍老温和
        pace: 适中偏慢
        pitch: 中
    man_1:
      display_name: 路人甲
      tts:
        delivery: 平实直接
        timbre: 清楚朴素
        pace: 适中
        pitch: 中
    princess:
      display_name: 拉巴姆公主
      tts:
        delivery: 端庄清醒，惊惧时急促，决断时坚定
        timbre: 清澈明亮，带有从容贵气
        pace: 适中
        pitch: 中高
    servant_1:
      display_name: 侍女甲
      tts:
        delivery: 恭敬自然
        timbre: 轻柔清晰
        pace: 适中
        pitch: 中高
    servant_2:
      display_name: 侍女乙
      tts:
        delivery: 恭敬自然
        timbre: 明亮柔和
        pace: 适中
        pitch: 中
    queen_mother:
      display_name: 公主的母后
      tts:
        delivery: 慈爱端庄，对女儿温柔而笃定
        timbre: 温润成熟
        pace: 舒缓
        pitch: 中
    princess_raja:
      display_name: 公主的父王
      tts:
        delivery: 冷峻威严，提出考验时不容置疑
        timbre: 低沉坚硬
        pace: 稍慢
        pitch: 低
  chapters:
    - id: ch01
      title: 禁猎之地
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王，膝下只有一个儿子。王子天天出门打猎。有一天，母亲把他叫来，特意叮嘱他。
        - id: ch01-b02
          speaker: rani
          text: “三面的猎场都由你去，只有第四面，千万不能踏进去。”
        - id: ch01-b03
          speaker: narrator
          text: 王后之所以这样告诫儿子，是因为她知道，他只要去了那边，就会听见美丽的拉巴姆公主之名。到那时，他必会离开父母，动身去寻找公主。王子起初听从母命，安分了一阵。可有一天，他正在获准去的三面打猎，偏偏又想起那第四面。他越想越好奇，终于决定亲自看看，母亲为什么不许他去那里打猎。
        - id: ch01-b04
          speaker: narrator
          text: 那边是一片丛林，林中不见别的动物，只住着许多鹦鹉。王子向鸟群开了一枪，鹦鹉们顿时全飞上天，只把它们的王希拉曼留在原地。
        - id: ch01-b05
          speaker: hiraman
          text: “王子一开枪，你们就飞走，怎么能把我独自留下？再这样抛下我，我可要去告诉拉巴姆公主了！”
        - id: ch01-b06
          speaker: narrator
          text: 鸟群听见这话，叽叽喳喳地飞了回来。王子惊奇极了。
        - id: ch01-b07
          speaker: prince
          text: “原来这些鸟会说话！告诉我，拉巴姆公主是谁？她住在哪里？”
        - id: ch01-b08
          speakers: [parrot_1, parrot_2]
          ensemble: duo
          text: “你永远也到不了拉巴姆公主的国度。”
        - id: ch01-b09
          speaker: narrator
          text: 鹦鹉只肯说这一句。王子再也问不出别的，伤心地扔下猎枪，回了家。他不吃不喝，也不讲话，在床上一躺就是四五天，看起来病得很重。最后，他终于向父母说出心事。
        - id: ch01-b10
          speaker: prince
          text: “我非去见拉巴姆公主不可。我一定要看看她是什么模样。请告诉我，她的国家在哪里。”
        - id: ch01-b11
          speakers: [father_raja, rani]
          ensemble: duo
          text: “我们也不知道她的国家在哪里。”
        - id: ch01-b12
          speaker: prince
          text: “那我就自己去找。”
        - id: ch01-b13
          speakers: [father_raja, rani]
          ensemble: duo
          text: “不，你不能离开我们。我们只有你这一个儿子。留下来吧，你永远找不到她的。”
        - id: ch01-b14
          speaker: prince
          text: “无论如何，我都得试着找到她。也许上天会给我指路。我若活着找到她，就会回来。也许我会死，再也见不到你们，可我还是要去。”
        - id: ch01-b15
          speaker: narrator
          text: 父母虽然万分不舍，最后还是只得答应。分别时，他们哭得十分伤心。父王送给王子华美的衣裳、一匹骏马和许多卢比。王子又带上猎枪、弓箭和许多别的兵器，心想路上说不定会用得着。他亲手备好远行的马匹，向父王母后告别。母亲拿出自己的手帕，包起一些甜点，交到儿子手里。
        - id: ch01-b16
          speaker: rani
          text: “孩子，路上饿了，就吃这些甜点。”
    - id: ch02
      title: 善意换来的帮助
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子上路以后，不停地向前骑，走了很久，来到一片丛林。林中有一座水池，池边的树木投下浓荫。他先让自己和马都在池里洗过澡，随后坐到树下休息，打算吃几块母亲送的甜点，再喝些水，然后继续赶路。
        - id: ch02-b02
          speaker: narrator
          text: 可他拿出第一块甜点，里面有只蚂蚁。第二块也有。他一块接一块地取出来，每块里面都有蚂蚁。
        - id: ch02-b03
          speaker: prince
          text: “没关系，我不吃了，就把甜点都留给蚂蚁吧。”
        - id: ch02-b04
          speaker: narrator
          text: 蚁王来到王子面前。
        - id: ch02-b05
          speaker: ant_raja
          text: “你这样善待我们。以后若遇到难处，只要想起我，我们就会赶来。”
        - id: ch02-b06
          speaker: narrator
          text: 王子谢过蚁王，跨上马继续赶路。他走啊走，一直骑到另一片丛林。在那里，他看见一只老虎。老虎的脚里扎着一根刺，疼得受不了，正在高声咆哮。
        - id: ch02-b07
          speaker: prince
          text: “你为什么吼得这样响？出了什么事？”
        - id: ch02-b08
          speaker: tiger
          text: “一根刺在我脚里扎了十二年，实在太疼，我才一直这样吼。”
        - id: ch02-b09
          speaker: prince
          text: “我可以替你取出来。可你毕竟是老虎，万一伤好了，转头把我吃掉怎么办？”
        - id: ch02-b10
          speaker: tiger
          text: “不会，我绝不吃你。快替我治好这只脚吧。”
        - id: ch02-b11
          speaker: narrator
          text: 王子掏出小刀，割开虎脚，取出那根刺。刀一落下，老虎吼得比先前还响。住在隔壁丛林里的虎妻听见了，立刻飞奔过来。老虎怕她看见王子，赶忙把他藏进林中。
        - id: ch02-b12
          speaker: tigress
          text: “是谁伤了你，害你叫得这么响？”
        - id: ch02-b13
          speaker: tiger
          text: “没人伤我。来了一位王子，是他取出了我脚里的刺。”
        - id: ch02-b14
          speaker: tigress
          text: “他在哪里？叫他出来让我看看。”
        - id: ch02-b15
          speaker: tiger
          text: “你先答应不杀他，我才叫他出来。”
        - id: ch02-b16
          speaker: tigress
          text: “我不会杀他，只想见见他。”
        - id: ch02-b17
          speaker: narrator
          text: 老虎这才把王子从林中唤出来。虎夫妻一见他，便向他连连行礼，又摆出一顿丰盛的饭菜招待他。它们留王子住了整整三天。王子每天都仔细查看老虎的脚。到了第三天，伤口已经完全愈合，他这才向虎夫妻告别。
        - id: ch02-b18
          speaker: tiger
          text: “往后有了麻烦，只管想起我，我们就会来帮你。”
        - id: ch02-b19
          speaker: narrator
          text: 王子继续赶路，走到第三片丛林。他遇见四个苦行僧。四人的师父死后，留下了四样宝物。第一样是一张床，无论谁坐上去，它都能载着那人去任何想去的地方。第二样是一只袋子，主人要珠宝、食物或衣裳，它都能立刻送出来。第三样是一只石碗，不管离水池多远，主人想要多少水，它就给多少。最后是棍子和绳子。敌人若来攻打，只须一声命令，棍子便会痛打他们，绳子会把他们全捆起来。
        - id: ch02-b20
          speaker: narrator
          text: 四人为这些宝物争得不可开交。
        - id: ch02-b21
          speaker: fakir_1
          text: “这个归我！”
        - id: ch02-b22
          speaker: fakir_2
          text: “不能给你，我也要它！”
        - id: ch02-b23
          speaker: prince
          text: “都别争了。我会朝四个方向各射一箭。先找到第一支箭的人拿飞床，找到第二支箭的拿袋子，找到第三支箭的拿石碗，找到第四支箭的拿棍子和绳子。”
        - id: ch02-b24
          speaker: narrator
          text: 四人都同意了。王子射出第一支箭，他们便一齐跑去寻找，王子就在原地等他们回来。等四人把箭送回来，他才射出第二支。第二支箭找回来后，他再射第三支。第三支也送回来后，他终于射出了第四支。趁四人跑远，忙着寻找最后一支箭，王子放开自己的马，让它进入丛林。他拿起石碗、棍子、绳子和袋子，带着所有宝物坐上飞床。
        - id: ch02-b25
          speaker: prince
          text: “床啊，带我去拉巴姆公主的国度。”
        - id: ch02-b26
          speaker: narrator
          text: 小床立刻从地面升上天空，载着王子一路飞去。它飞了又飞，终于来到拉巴姆公主的国土，稳稳落在地上。王子离开小床向前走，看见几个男子，便拦住他们，询问脚下这片土地属于谁。
        - id: ch02-b27
          speaker: man_1
          text: “这里就是拉巴姆公主的国度。”
    - id: ch03
      title: 黑夜中的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子往前走，来到一间屋子，看见一位老妇人。
        - id: ch03-b02
          speaker: old_woman
          text: “你是谁？从什么地方来的？”
        - id: ch03-b03
          speaker: prince
          text: “我从很远的国家来。请您让我在这里住一夜吧。”
        - id: ch03-b04
          speaker: old_woman
          text: “这可不行。国王不许外国男子在这里留宿，我不能让你住进家里。”
        - id: ch03-b05
          speaker: prince
          text: “您就像我的姨母一样，只留我一晚吧。天已经黑了，我若回到丛林，会被野兽吃掉的。”
        - id: ch03-b06
          speaker: old_woman
          text: “好吧，今晚你可以留下。可明早必须离开。国王若知道这件事，会把我抓去坐牢。”
        - id: ch03-b07
          speaker: narrator
          text: 老妇人把王子领进屋，他心里高兴极了。她随即动手准备晚饭，王子却请她停下来。
        - id: ch03-b08
          speaker: prince
          text: “姨母，饭由我来拿。袋子，请给我一顿晚饭。”
        - id: ch03-b09
          speaker: narrator
          text: 袋子马上送出一顿美味的晚饭，分别盛在两只金盘子里。老妇人和王子坐下来，一同吃完了盘里的饭菜。刚收拾好，老妇人便起身，说自己要出去打些水来。
        - id: ch03-b10
          speaker: prince
          text: “不用去，水马上就有。碗啊，请给我一些水。”
        - id: ch03-b11
          speaker: narrator
          text: 清水立刻在石碗中涌了出来，越升越高。眼看整只碗都盛满了，王子连忙喊了一声“停下，碗”，水这才不再往外涌。
        - id: ch03-b12
          speaker: prince
          text: “您瞧，有了这只碗，我随时想要多少水，就能有多少。”
        - id: ch03-b13
          speaker: narrator
          text: 夜色已经降下，王子发现屋里没有点灯。
        - id: ch03-b14
          speaker: prince
          text: “姨母，您为什么不点一盏灯？”
        - id: ch03-b15
          speaker: old_woman
          text: “不需要。国王不许百姓点灯。天一黑，拉巴姆公主就会坐到屋顶上。她身上的光能照亮全国，也照亮家家户户，我们做事看得和白天一样清楚。”
        - id: ch03-b16
          speaker: narrator
          text: 夜彻底黑了，公主才起身。她换上华服，戴好珠宝，盘起长发，又把镶着珍珠和钻石的发带横在头上。她像月亮一样明亮，她的美把黑夜照成了白昼。公主走出房间，坐到王宫屋顶。她白天从不露面，只在夜里出来。全国百姓借着她的光，各自忙完手中的活。
        - id: ch03-b17
          speaker: narrator
          text: 王子没有惊动任何人，只在远处静静望着屋顶上的公主。亲眼见到自己远道寻来的姑娘，他心中无比欢喜。
        - id: ch03-b18
          speaker: prince
          text: “她真美啊！”
        - id: ch03-b19
          speaker: narrator
          text: 到了午夜，家家户户的人都已经上床。公主从屋顶走下来，回到自己的房间，也在床上沉沉睡去。王子一直等到这时候，才轻轻起身，坐上那张神奇的小床。
        - id: ch03-b20
          speaker: prince
          text: “床啊，带我去拉巴姆公主的卧房。”
        - id: ch03-b21
          speaker: narrator
          text: 小床穿过黑夜，把王子送到公主沉睡的房间。王子拿出袋子，要它送来许多槟榔叶。袋子立刻给了他一大堆。他把叶子全放在公主床边，这才重新坐上小床，回到老妇人家里。
        - id: ch03-b22
          speaker: narrator
          text: 第二天，侍女们发现槟榔叶，都拿来吃。公主见了，问她们从哪里得来。
        - id: ch03-b23
          speakers: [servant_1, servant_2]
          ensemble: duo
          text: “我们是在您的床边找到的。”
        - id: ch03-b24
          speaker: narrator
          text: 侍女们只知道槟榔叶出现在床边，谁也没有想到，王子曾在深夜乘着飞床进来，又亲手把叶子放在那里。早晨，老妇人来找王子，又催他赶快离开。
        - id: ch03-b25
          speaker: old_woman
          text: “天亮了，你得走了。国王若发现我收留了你，一定会抓我。”
        - id: ch03-b26
          speaker: prince
          text: “亲爱的姨母，我今天病了。请让我再住一夜吧。”
        - id: ch03-b27
          speaker: old_woman
          text: “那就再住一天吧。”
        - id: ch03-b28
          speaker: narrator
          text: 王子就这样又住了一天。他和老妇人从袋里取出饭菜，再让石碗送来清水。夜里，公主仍旧穿戴整齐，坐到屋顶，用身上的光照亮全国。十二点时，人人都已入睡。她回到卧房，很快睡熟，王子再度乘着小床来到她身边。
        - id: ch03-b29
          speaker: prince
          text: “袋子，给我一条世上最美的披肩。”
        - id: ch03-b30
          speaker: narrator
          text: 袋子立刻送出一条华美无比的披肩。王子走到床边，把它轻轻盖在熟睡的公主身上，随后乘小床回到老妇人家，一直睡到天明。第二天早晨，公主睁眼看见身上的披肩，高兴得不得了。
        - id: ch03-b31
          speaker: princess
          text: “母亲，您看！这么美的披肩，一定是胡达赐给我的。”
        - id: ch03-b32
          speaker: queen_mother
          text: “是啊，孩子，这样华美的披肩，一定是胡达的恩赐。”
        - id: ch03-b33
          speaker: narrator
          text: 老妇人再次要王子离开。
        - id: ch03-b34
          speaker: old_woman
          text: “这回你真的非走不可了。”
        - id: ch03-b35
          speaker: prince
          text: “姨母，我的病还没好。再让我留几天吧。我会一直躲在屋里，绝不让人看见。”
        - id: ch03-b36
          speaker: narrator
          text: 老妇人只好答应。第三个夜晚，公主身着华服，戴着珠宝，又坐到了屋顶。等到漆黑的午夜，她回到房中睡下。王子乘飞床进入她的卧房，对袋子说，自己想要一枚非常、非常漂亮的戒指。袋子果然送出一枚光彩夺目的戒指。他轻轻拉过公主的手，正要替她戴上，公主突然惊醒，吓得不轻。
        - id: ch03-b37
          speaker: princess
          text: “你是谁？从哪里来的？为什么闯进我的房间？”
          emotion: fearful
        - id: ch03-b38
          speaker: prince
          text: “公主，请别害怕，我不是贼。我是一位大国王的儿子。我去丛林打猎时，希拉曼鹦鹉说出了您的名字。我于是离开父母，专程来见您。”
        - id: ch03-b39
          speaker: princess
          text: “既然你是大国王的儿子，我不会叫人杀你。我会告诉父王母后，我愿意嫁给你。”
    - id: ch04
      title: 国王的考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子回到老妇人家。天亮后，公主把自己的决定告诉母亲。
        - id: ch04-b02
          speaker: princess
          text: “一位大国王的儿子来到了这里，我愿意嫁给他。”
        - id: ch04-b03
          speaker: narrator
          text: 母后把话转告国王。国王却提出了条件。
        - id: ch04-b04
          speaker: princess_raja
          text: “他若想娶我的女儿，必须先办成我吩咐的事。我要给他八十磅芥菜籽，他得在一天之内把油全榨出来。办不到，我就杀了他。”
        - id: ch04-b05
          speaker: narrator
          text: 第二天一早，王子告诉老妇人，他已经决定迎娶拉巴姆公主。老妇人听完，大惊失色，连忙劝他打消这个念头。
        - id: ch04-b06
          speaker: old_woman
          text: “快离开这里，别再想娶她了！许多国王和王子都来求过婚，她父亲却把他们全杀了。求婚的人得完成国王所有的命令，可那些事谁也办不到。办不到就要送命，你也会被杀的。快走吧！”
        - id: ch04-b07
          speaker: narrator
          text: 不管老妇人怎样劝说，王子都不肯听。国王很快派仆从来到老妇人家，正式传唤这位求婚者。仆从把王子带进国王的公堂。国王当面交给他足足八十磅芥菜籽。
        - id: ch04-b08
          speaker: princess_raja
          text: “今天把这些籽里的油全部榨出来，明早送到这里。想娶我的女儿，就得办到我的每一道命令。榨不出油，你就得死。”
        - id: ch04-b09
          speaker: narrator
          text: 王子听见这道命令，心中十分难过。他抱着沉重的芥菜籽回到老妇人家，想来想去，也不知道怎样才能在一天内榨尽其中的油。
        - id: ch04-b10
          speaker: prince
          text: “一天之内，我怎么榨得完这么多芥菜籽？明早交不出油，国王就会杀我。”
        - id: ch04-b11
          speaker: narrator
          text: 这时，他终于想起了蚁王。念头刚动，蚁王就带着群蚁来到面前。
        - id: ch04-b12
          speaker: ant_raja
          text: “你为什么这样难过？”
        - id: ch04-b13
          speaker: prince
          text: “国王给了我这些芥菜籽，要我一天内把油全榨出来。明早交不出，他就会杀了我。”
        - id: ch04-b14
          speaker: ant_raja
          text: “别发愁，躺下睡吧。今天我们会替你榨完，明早你只管把油交给国王。”
        - id: ch04-b15
          speaker: narrator
          text: 王子听从蚁王的话，安心躺下睡了。蚂蚁们一刻不停地忙了一整天，果真把八十磅芥菜籽里的油全榨了出来。王子醒来见到那些油，欢喜万分。第二天一早，他如期把油送进公堂，交到国王面前。国王却不肯让他迎娶公主。
        - id: ch04-b16
          speaker: princess_raja
          text: “你还得和我的两个恶魔搏斗，把它们杀死。做完这件事，才有资格娶我的女儿。”
        - id: ch04-b17
          speaker: narrator
          text: 原来国王早在许多年前就捉到了两个恶魔。他不知道该怎么处置，只好把它们关进笼子。他不敢放走它们，生怕恶魔吃光全国百姓，自己却又想不出杀死它们的办法。于是，每个想娶拉巴姆公主的国王和王子，都得去同恶魔搏斗。国王暗自盼着，或许真有人能把它们杀掉，让自己从此摆脱这两个祸害。
        - id: ch04-b18
          speaker: prince
          text: “我该怎么办？凭我自己，怎么打得过两个恶魔？”
        - id: ch04-b19
          speaker: narrator
          text: 王子想起了老虎，虎夫妻立刻赶来。
        - id: ch04-b20
          speaker: tiger
          text: “你为什么又这样难过？”
        - id: ch04-b21
          speaker: prince
          text: “国王命我杀死他的两个恶魔。我怎么可能办到？”
        - id: ch04-b22
          speaker: tiger
          text: “别害怕，也别发愁。我和妻子替你去对付它们。”
    - id: ch05
      title: 恶魔与铜鼓
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子从神奇的袋子里取出两件华美的外衣。衣裳全由金银制成，上面缀满珍珠和钻石。他把外衣分别穿在老虎夫妇身上，将它们打扮得威风又美丽，然后带着两只老虎去见国王。
        - id: ch05-b02
          speaker: prince
          text: “可以让这两只老虎替我同恶魔搏斗吗？”
        - id: ch05-b03
          speaker: princess_raja
          text: “可以。”
        - id: ch05-b04
          speaker: narrator
          text: 国王根本不在乎是谁动手，只要恶魔死掉就好。
        - id: ch05-b05
          speaker: prince
          text: “那么，请放出恶魔，让这两只老虎与它们交战。”
        - id: ch05-b06
          speaker: narrator
          text: 国王立刻照做，打开笼子，放出两个恶魔。老虎与恶魔迎面交锋，一次又一次地厮杀，谁也不肯退让。它们一直斗到最后，虎夫妻终于把两个恶魔全都杀死。国王看过结果，却又提出了新的要求。
        - id: ch05-b07
          speaker: princess_raja
          text: “这件事办得不错。不过我还不能把女儿嫁给你。高高的天空中有一面我的铜鼓，你必须飞上去敲响它。办不到，你仍然得死。”
        - id: ch05-b08
          speaker: narrator
          text: 王子回到老妇人家，坐上那张小床。
        - id: ch05-b09
          speaker: prince
          text: “小床，国王的铜鼓在天空中，请带我到那里。”
        - id: ch05-b10
          speaker: narrator
          text: 飞床立刻载着王子升上天空，把他送到那面高悬的铜鼓旁。王子伸手敲响铜鼓，鼓声从高空传到地面，连国王也清清楚楚地听见了。可等王子乘床落回地面，国王还是不肯履行诺言，不肯把女儿嫁给他。
        - id: ch05-b11
          speaker: princess_raja
          text: “我交代的三件事，你都做到了。不过，你还得再完成一件。”
        - id: ch05-b12
          speaker: prince
          text: “只要我能办到，我就去做。”
        - id: ch05-b13
          speaker: narrator
          text: 国王领王子来到公堂附近，指给他看一截横卧在地的树干。那树干非常、非常粗，绝不是普通斧头能轻易劈开的。可国王交到王子手里的，偏偏是一把蜡做的斧头。
        - id: ch05-b14
          speaker: princess_raja
          text: “明天早晨，用这把蜡斧把树干劈成两半。”
        - id: ch05-b15
          speaker: narrator
          text: 王子拿着蜡斧回到老妇人家。他越想越悲伤，觉得前面的帮助如今都派不上用场，这一回国王一定会杀掉自己。
        - id: ch05-b16
          speaker: prince
          text: “蚂蚁替我榨了油，老虎替我杀死恶魔，小床帮我敲响铜鼓。可现在怎么办？蜡做的斧头，怎么可能劈开那么粗的树干？”
        - id: ch05-b17
          speaker: narrator
          text: 到了夜里，王子乘飞床去见公主。
        - id: ch05-b18
          speaker: prince
          text: “明天，你父亲就会杀了我。”
        - id: ch05-b19
          speaker: princess
          text: “为什么？”
        - id: ch05-b20
          speaker: prince
          text: “他给我一把蜡斧，要我把一截粗大的树干劈成两半。我怎么做得到？”
        - id: ch05-b21
          speaker: princess
          text: “别害怕。照我说的做，你会很容易把它劈开。”
        - id: ch05-b22
          speaker: narrator
          text: 公主从自己头上拔下一根头发，交给王子。
        - id: ch05-b23
          speaker: princess
          text: “明天，等身边没有人时，对树干说，拉巴姆公主命你让这根头发把你劈成两半。说完以后，把头发沿着蜡斧的刃口绷紧。”
    - id: ch06
      title: 王子赢得公主
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第二天，王子完全照着公主的话去做。他等到周围没有人，先把那句话告诉树干，再将公主的头发沿着蜡斧刃口绷紧。头发刚一碰到树干，粗大的树干便应声裂开，整整齐齐地分成了两半。
        - id: ch06-b02
          speaker: princess_raja
          text: “现在，你可以娶我的女儿了。”
        - id: ch06-b03
          speaker: narrator
          text: 婚礼很快举行。周围各国的国王和王公都收到了邀请，纷纷赶来赴宴。到处都是欢庆的人群。盛大的婚礼过去几天以后，王子想起远方的父母，便对新婚妻子说起回家的事。
        - id: ch06-b04
          speaker: prince
          text: “我们一起回我父亲的国家吧。”
        - id: ch06-b05
          speaker: narrator
          text: 拉巴姆公主的父亲为他们准备了许多骆驼、马匹和卢比，还派出大批仆从随行。王子和公主带着浩浩荡荡的队伍，一路回到王子父亲的国家。从那以后，他们便在那里幸福地生活。
        - id: ch06-b06
          speaker: narrator
          text: 王子一直保留着那只袋子、石碗、飞床和棍子。后来再也没人来攻打他，那根棍子也就始终没有派上用场。
