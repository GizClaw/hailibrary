  chapters:
    - id: ch01
      title: The Promise at the Crossroads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king who had no children. He went to a place where four roads met and lay down to rest right in the crossing. Everyone who came along one of those roads had to step over him before going on.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At last, a fakir came along and stopped before him.
        - id: ch01-b03
          speaker: fakir
          text: Why are you lying here, man?
        - id: ch01-b04
          speaker: old_king
          text: >-
            A thousand men have already passed over me, Fakir. You should go on too.
        - id: ch01-b05
          speaker: fakir
          text: But who are you?
        - id: ch01-b06
          speaker: old_king
          text: >-
            I am a king. I have all the goods and gold I need, but I have grown old without a child. I have committed many sins and offenses, so I came to this crossroads and lay down. Perhaps, if people pass over me, my sins will be forgiven. Perhaps God will show me mercy and give me a son.
        - id: ch01-b07
          speaker: fakir
          text: If you have children, what will you give me?
        - id: ch01-b08
          speaker: old_king
          text: Whatever you ask for.
        - id: ch01-b09
          speaker: fakir
          text: >-
            I have no need of goods or gold. I will pray for you, and you will have two sons. One of them will belong to me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The fakir took out two sweetmeats and handed them to the king.
        - id: ch01-b11
          speaker: fakir
          text: >-
            Give these to your wives, one sweetmeat to each of the wives you love best. I will return in a year. Of the two sons born to you, one will be mine and the other will be yours.
        - id: ch01-b12
          speaker: old_king
          text: Very well. I agree.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The fakir went on his way. The king returned home with the sweetmeats tucked inside his robe. He gave one to each of two wives. After some time, each wife gave birth to a son. The king then had a room built under the earth and placed both boys there.
    - id: ch02
      title: The Son the Fakir Chose
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Some time later, the fakir appeared before the king.
        - id: ch02-b02
          speaker: fakir
          text: King, bring me your son.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Instead of obeying, the king brought out the sons of two slave girls and presented them as his own. As the fakir sat there, the king's true sons were down in the cellar eating their meal. A hungry ant found one grain of rice among their food. She picked it up and started carrying it home to her children. Along the way, a stronger ant attacked her and tried to drag the grain away.
        - id: ch02-b04
          speaker: first_ant
          text: >-
            Why are you pulling my grain away? My feet have been lame for a long time. I found just this one grain, and I am taking it to my children. The king's sons are eating in the cellar. Go and fetch a grain from them. Why take mine?
        - id: ch02-b05
          speaker: narrator
          text: >-
            The stronger ant released the grain and went toward the cellar instead. The fakir heard what the lame ant had said.
        - id: ch02-b06
          speaker: fakir
          text: >-
            King, these boys are not your sons. Bring me the children who are eating in the cellar.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The king could hide the truth no longer. He went down to the underground room and brought out his own two sons. The fakir looked at them, chose the elder boy, and took him away on his journey. When they reached the fakir's home, he ordered the prince to go out and gather fuel. The boy went out, collected cow dung, and carried it back inside.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The fakir set a huge pot over a fire. Then he looked toward the prince.
        - id: ch02-b09
          speaker: fakir
          text: Come around here, my pupil.
        - id: ch02-b10
          speaker: prince
          text: The master goes first. The pupil follows.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The fakir ordered him over a second time, then a third. Each time, the prince gave the same answer.
        - id: ch02-b12
          speaker: prince
          text: The master goes first. The pupil follows.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Then the fakir suddenly rushed at him. He meant to catch the prince and throw him into the great pot. A fire blazed beneath it, heating about a hundred gallons of oil. But before the fakir could seize him, the prince lifted his master, gave him a sharp jerk, and hurled him into the boiling oil. There the fakir burned until he was roasted.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Afterward, the prince saw one of the fakir's keys lying nearby. He picked it up and unlocked the door of the house. Many men had been shut away inside. He also found two horses standing in a hut, two greyhounds tied up, two simurgs held captive, and two tigers confined there. The prince set every creature free and led them out of the house. They all gave thanks to God. Then he opened the way for all the imprisoned men and released them too.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Taking the horses, tigers, hounds, and simurgs with him, the prince set off for another country.
    - id: ch03
      title: The Stranger in Fakir's Clothes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Along the road, the prince saw a bald man grazing a herd of calves. The man called down to him.
        - id: ch03-b02
          speaker: bald_man
          text: Fellow, can you fight?
        - id: ch03-b03
          speaker: prince
          text: >-
            I could fight a little when I was young. Now, if someone challenges me, I am not the kind of man who turns his back. Come and fight me.
        - id: ch03-b04
          speaker: bald_man
          text: >-
            If I throw you down, you will be my slave. If you throw me, I will be yours.
        - id: ch03-b05
          speaker: narrator
          text: >-
            They made ready, faced each other, and began to wrestle. The bald man tried to bring the prince down, but the prince threw him instead and won the match.
        - id: ch03-b06
          speaker: prince
          text: >-
            I am leaving my simurgs, tigers, dogs, and horses here while I go see the city. The tiger will guard everything. You are my slave now, so you must stay here with them too.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The prince went on to the city and reached a pleasant pool. He decided to bathe and began taking off his clothes.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The king's daughter was sitting on the palace roof. She saw the royal marks on him and knew he was a king.
        - id: ch03-b09
          speaker: princess
          text: When I marry, I will marry that man and no one else.
        - id: ch03-b10
          speaker: narrator
          text: Then she went to her father.
        - id: ch03-b11
          speaker: princess
          text: Father, I want to marry.
        - id: ch03-b12
          speaker: city_king
          text: Good.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The king sent a proclamation through the land. Every man, great or small, was to come to the hall of audience that very day, for the king's daughter would choose her husband there. Men from all across the country gathered in the hall. The traveling prince heard what was happening and decided that he must see the ceremony. Still dressed in the fakir's clothes, he entered with the rest and sat among them.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The princess appeared on the balcony and looked over the whole assembly. She spotted the traveler sitting there in fakir's clothing.
        - id: ch03-b15
          speaker: princess
          text: >-
            Take this dish of henna to that traveler dressed as a fakir, and sprinkle him with its scent.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Her handmaiden carried out the order and sprinkled the scent over him.
        - id: ch03-b17
          speakers: [townsman_one, townsman_two, townsman_three]
          ensemble: chorus
          text: The slave girl chose the wrong man!
        - id: ch03-b18
          speaker: handmaiden
          text: >-
            The slave girl made no mistake. If there is a mistake, it belongs to her mistress.
        - id: ch03-b19
          speaker: narrator
          text: >-
            So the king married his daughter to the man everyone thought was a fakir, though he was truly a prince. What fate had decreed came to pass, and the two were married.
        - id: ch03-b20
          speaker: narrator
          text: >-
            The city king was deeply troubled. With so many chiefs and nobles present, his daughter had passed over them all and chosen a fakir. Still, he hid those thoughts in his heart.
    - id: ch04
      title: The Hunt
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, the traveling prince made a request.
        - id: ch04-b02
          speaker: prince
          text: Let all the king's sons-in-law come hunting with me today.
        - id: ch04-b03
          speakers: [townsman_one, townsman_two, townsman_three]
          ensemble: chorus
          text: Why should a fakir go hunting?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Even so, all the king's sons-in-law set out for the hunt. Before they separated, they chose a certain pool as the place where they would meet again. The newly married prince returned to the tigers and hounds he had left outside the city. He ordered them to hunt down and bring him large numbers of gazelles, hog deer, and markhor. The animals obeyed at once, killed a great many, and brought the game back to him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The prince gathered up the spoils of the hunt and carried them to the pool they had chosen. The city's other princes arrived there too. They were also sons-in-law of the king, but not one of them had brought back any game. The new prince, whom they had taken for a fakir, had more than all of them. From the pool, they returned together to the town and went before their father-in-law to present the results of the hunt.
    - id: ch05
      title: The Prince Revealed
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The city king had no son. Now the new husband told him the truth. He too was a prince.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The king was overjoyed. He took his son-in-law by the hand, embraced him, and seated him apart from the others.
        - id: ch05-b03
          speaker: city_king
          emotion: happy
          text: >-
            Prince, I give thanks that you came here and became my son-in-law. This makes me very happy, and I place my kingdom in your hands.
