        pitch: medium
    brahma_datta:
      display_name: King Brahma-datta
      tts:
        delivery: reflective and principled
        timbre: rich and clear
        pace: deliberate
        pitch: low
    benares_charioteer:
      display_name: Brahma-datta's Charioteer
      tts:
        delivery: discerning and assured
        timbre: warm and firm
        pace: measured
        pitch: medium-low
    mallika_charioteer:
      display_name: Mallika's Charioteer
      tts:
        delivery: proud and insistent
        timbre: strong and clear
