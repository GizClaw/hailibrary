  chapters:
    - id: ch01
      title: A Kingdom Ruled Justly
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, while Brahma-datta reigned in Benares, the future Buddha was born again as the king's son and heir. The prince was also named Brahma-datta. When he reached sixteen, he went to Takkasila and mastered every art taught there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After his father died, Brahma-datta took the throne. He ruled with fairness and gave judgment without favor, hatred, ignorance, or fear. His ministers followed his example and administered the law justly too.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Because every case was decided fairly, people stopped bringing false claims. Soon the usual noise of lawsuits disappeared from the royal court. The judges sat there all day, but no one came before them. Before long, it seemed the Hall of Justice might have to close.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The king began to wonder whether his own rule could truly explain the empty hall.
        - id: ch01-b05
          speaker: brahma_datta
          text: >-
            Surely people have not stopped coming simply because I rule justly. The court is silent, and the Hall of Justice may close. I must look for faults in myself. If I find anything wrong, I will put it aside and practice only what is good.
    - id: ch02
      title: Searching for a Fault
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            From that time on, Brahma-datta searched for someone willing to point out his faults. But everyone near him spoke only of his virtues. Not one person would name a fault.
        - id: ch02-b02
          speaker: brahma_datta
          text: >-
            These people must be afraid of me. That is why they tell me only what is good and keep silent about what is bad.
        - id: ch02-b03
          speaker: narrator
          text: >-
            So he questioned people outside the palace. When no one there could criticize him, he went farther, to the suburbs beyond each of the city's four gates. Yet once again, he heard nothing but praise. At last, he decided to search throughout the countryside.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Brahma-datta placed the kingdom in his ministers' care. Then he put on a disguise, climbed into his chariot, and left the city with only his charioteer beside him.
        - id: ch02-b05
          speaker: narrator
          text: >-
            They traveled across the country, all the way to its farthest boundary. Still, the king found no one who could name a fault in him. Everywhere he went, people praised his virtue. So he turned back and followed the high road toward Benares.
    - id: ch03
      title: Two Chariots on a Narrow Road
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At that same time, a king named Mallika ruled Kosala with justice. He too had searched for a fault in himself. In his palace he found no critic, only people praising his virtues. So Mallika also went out among the country people, looking for someone who would speak honestly.
        - id: ch03-b02
          speaker: narrator
          text: >-
            His search brought him to the very road where Brahma-datta was traveling. The two chariots met face-to-face in a sunken cart track with steep sides. The passage was so tight that neither chariot could move around the other.
        - id: ch03-b03
          speaker: mallika_charioteer
          text: Move your chariot out of our way.
        - id: ch03-b04
          speaker: benares_charioteer
          text: >-
            No, you must move yours. The ruler of Benares, the great King Brahma-datta, is seated in this chariot.
        - id: ch03-b05
          speaker: mallika_charioteer
          text: >-
            And the ruler of Kosala, the great King Mallika, is seated in this one. Take your carriage aside and clear the road for our king.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Brahma-datta's charioteer realized that the traveler before him was also a king. For a moment, he did not know what to do. Then a solution came to him.
        - id: ch03-b07
          speaker: benares_charioteer
          text: >-
            I will ask his age. The younger king's chariot can move aside for the elder.
    - id: ch04
      title: Equal in Every Measure
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            He asked the other charioteer how old King Mallika was. The answer showed that the two kings were the same age.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Then he asked about the size of Mallika's kingdom, his army, his wealth, and his fame. He asked about the land Mallika ruled, and about his caste, tribe, and family.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Each answer matched Brahma-datta exactly. Both kings ruled a country three hundred leagues across. Their armies, wealth, and fame were equal. So were their lands, their caste and tribe, and their families. By every one of those measures, neither king stood above the other.
        - id: ch04-b04
          speaker: benares_charioteer
          text: >-
            Then I will yield the road to whichever king is more righteous. Tell me, what kind of righteousness does your king possess?
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mallika's charioteer answered by praising qualities that were really his king's faults.
        - id: ch04-b06
          speaker: mallika_charioteer
          text: >-
            Mallika meets the strong with strength and the gentle with gentleness. He wins over good people with goodness, and wicked people with wickedness. That is the nature of our king. Now move aside, charioteer.
        - id: ch04-b07
          speaker: benares_charioteer
          text: Is that everything you call virtuous in your king?
        - id: ch04-b08
          speaker: mallika_charioteer
          text: Yes, that is all.
        - id: ch04-b09
          speaker: benares_charioteer
          text: If those are his virtues, then what could his faults possibly be?
        - id: ch04-b10
          speaker: mallika_charioteer
          text: >-
            Very well. For now, call them faults if you wish. But tell me this. What kind of goodness does your king possess?
    - id: ch05
      title: The Better Kind of Strength
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Brahma-datta's charioteer called on the other man to listen. Then he described the way his own king ruled.
        - id: ch05-b02
          speaker: benares_charioteer
          text: >-
            He conquers anger with calmness and wickedness with goodness. He wins over the stingy by giving, and the liar by speaking truth. That is the nature of our king. Now move aside, charioteer.
        - id: ch05-b03
          speaker: narrator
          text: >-
            When he heard those words, King Mallika climbed down from his chariot. His charioteer did the same. Together they unharnessed their horses, moved their chariot out of the narrow track, and made way for the king of Benares.
