audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    brahmadatta:
      display_name: 梵授王
      tts:
        delivery: 正直自省，思考时坦诚而坚定
        timbre: 沉稳清朗
        pace: 适中
        pitch: 中低
    kosala_charioteer:
      display_name: 憍萨罗王的御者
      tts:
        delivery: 骄傲强硬，维护君王时毫不退让
        timbre: 粗犷洪亮
        pace: 适中偏快
        pitch: 中低
    benares_charioteer:
      display_name: 贝拿勒斯王的御者
      tts:
        delivery: 沉着机敏，言语直率而有分寸
        timbre: 清晰厚实
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 无人指摘的国王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，梵授王统治贝拿勒斯时，未来的佛陀转生为他的儿子和王位继承人。取名那天，大家也叫他梵授。王子渐渐长大，十六岁时前往呾叉始罗，学会了各种技艺。父王去世后，他登上王位，以正直公平之心治理国家。判案时，他不偏私，不怀恨，不受蒙蔽，也不向恐惧屈服。君王公正，大臣们执法也公正。官司都判得公平，谁也不再捏造案情。法庭里的争吵喧嚷随之消失了。法官从早到晚坐在那里，却连一个申冤的人都等不到，最后只能空手离开。眼看审判厅竟要关门了。
        - id: ch01-b02
          speaker: brahmadatta
          text: 没有人来求我判案，未必只是因为我治国公正。如今法庭冷冷清清，审判厅都快关门了。我得查查自己有什么过错。只要发现不对，我就立刻改掉，从此只做正直的事。
        - id: ch01-b03
          speaker: narrator
          text: 从此，梵授王四处寻找肯指出自己过错的人。他问遍身边的人，可谁也不说他一句不是，传进耳中的，只有一声又一声对自己的赞美。
        - id: ch01-b04
          speaker: brahmadatta
          text: 他们一定是怕我，才只说好话，不说坏话。
        - id: ch01-b05
          speaker: narrator
          text: 他便走出王宫，去问宫外的百姓。那里没人指责他，他又来到城外，一座城门一座城门地找遍四周郊野。可是无论走到哪里，仍没人说他不好，听见的还是赞美。他只好决定再往更远的乡间去找。
        - id: ch01-b06
          speaker: narrator
          text: 梵授王把国事交给大臣，乔装登车，只带一名御者出了城。主仆二人走遍乡野，一直寻到最远的国界，依然无人肯挑出国王的过错，听不到半句指责，沿途尽是对他德行的称颂。于是，他们从边界折返，沿大路回城。
    - id: ch02
      title: 狭路相逢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那时候，憍萨罗国的末利迦王也以正直之道治理国家。他同样想查清自己有什么过错，可宫里无人肯说他的不是，听到的也只有对自己德行的赞美。于是，他也一路寻访到乡间，恰好来到了同一个地方。
        - id: ch02-b02
          speaker: narrator
          text: 两位国王的车，在一条低陷的车道上迎面撞见。两旁都是陡壁，道路窄得连一辆马车也无法避让。
        - id: ch02-b03
          speaker: kosala_charioteer
          text: 把你的车让开！
        - id: ch02-b04
          speaker: benares_charioteer
          text: 该让路的是你！我车上坐着贝拿勒斯国的君主，伟大的梵授王。
        - id: ch02-b05
          speaker: kosala_charioteer
          text: 我车上坐的可是憍萨罗国的君主，伟大的末利迦王。快把车赶开，给我王让路！
        - id: ch02-b06
          speaker: narrator
          text: 贝拿勒斯王的御者这才知道，对面坐的也是国王。他一时不知该怎么办，仔细想了一阵，终于有了主意。先问清两位国王的年纪，再让年轻那位把车退出去，给年长那位让路。
        - id: ch02-b07
          speaker: narrator
          text: 可一问才知道，两位国王竟然同岁。他又接着问，对方疆土有多大，军队有多强，财富有多少，声望又如何。随后，他连两人居住的国家、种姓、部族和家世也一一比较。结果，两位国王统治的疆域都绵延三百由旬，其余各样也都不相上下。
        - id: ch02-b08
          speaker: benares_charioteer
          text: 既然如此，就该给品德更高尚的国王让路。请问，你们国王行的是怎样的正道？
    - id: ch03
      title: 真正的德行
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 憍萨罗王的御者把国王的恶行当成美德，开口吟诵起来。
        - id: ch03-b02
          speaker: kosala_charioteer
          text: 强者面前，我王就用强力压倒他。遇上温良的人，我王也温和相待。善人以善来降服，恶人便用恶来对付。这就是末利迦王的性情。御者，快给我们让路！
        - id: ch03-b03
          speaker: benares_charioteer
          text: 怎么，你们国王的美德全都说完了吗？
        - id: ch03-b04
          speaker: kosala_charioteer
          text: 全都说完了。
        - id: ch03-b05
          speaker: benares_charioteer
          text: 这些若算美德，那他的过错又在哪里？
        - id: ch03-b06
          speaker: kosala_charioteer
          text: 好吧，你若愿意，现在就把这些算成过错。可你也得说说，你们国王有什么美德？
        - id: ch03-b07
          speaker: narrator
          text: 贝拿勒斯王的御者请对方仔细听好，也吟出一首偈颂。
        - id: ch03-b08
          speaker: benares_charioteer
          text: 面对怒火，我王用平静使它止息。面对恶人，我王用善行使他折服。他用施舍改变悭吝的人，用真话战胜说谎的人。这就是梵授王的性情。御者，该给我们让路了！
        - id: ch03-b09
          speaker: narrator
          text: 这首偈颂刚刚吟完，末利迦王和他的御者便双双下了车。他们把拉车的马卸下来，又将自己的马车挪到一旁，终于腾出地方，让贝拿勒斯王的车先走。
