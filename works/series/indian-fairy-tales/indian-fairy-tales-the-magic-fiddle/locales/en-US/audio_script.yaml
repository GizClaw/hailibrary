  chapters:
    - id: ch01
      title: The Water Rises
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, seven brothers lived with their sister. The brothers were married, but their wives did not cook for the family. Their sister stayed home and did all the cooking. Because of this, the wives came to resent their sister-in-law. At last, they agreed to push her out of her place as cook and provider so that one of them could take it.
        - id: ch01-b02
          speakers: [wife_1, wife_2, wife_3, wife_4]
          ensemble: chorus
          text: >-
            She never goes to work in the fields. She stays quietly at home, and still she cannot have our meals ready on time.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The wives called upon their Bonga. They made vows to him and won his help. Then they told him what they wanted.
        - id: ch01-b04
          speakers: [wife_1, wife_2, wife_3, wife_4]
          ensemble: chorus
          text: >-
            At midday, our sister-in-law will go for water. When she sees it, make the water disappear, then let it slowly return. Do not let any water enter her pitcher. That will keep her there, and you may take the maiden for yourself.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At noon, the sister went to fetch water. The water suddenly dried up before her, and she began to weep. After a while, it slowly rose again. When it reached her ankles, she tried to fill her pitcher, but the pitcher would not dip beneath the surface. Fear took hold of her, and she cried out to her brother.
        - id: ch01-b06
          speaker: sister
          text: >-
            Oh, my brother, the water is at my ankles, but my pitcher still will not dip!
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: The water climbed to her knees, and once more she wailed.
        - id: ch01-b08
          speaker: sister
          text: >-
            Oh, my brother, the water is at my knees, but my pitcher still will not dip!
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: It rose as high as her waist, and she called again.
        - id: ch01-b10
          speaker: sister
          text: >-
            Oh, my brother, the water is at my waist, but my pitcher still will not dip!
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: Still the water rose. When it reached her neck, she kept crying.
        - id: ch01-b12
          speaker: sister
          text: >-
            Oh, my brother, the water is at my neck, but my pitcher still will not dip!
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            At last, the water grew so deep that she felt herself drowning. She gave one final cry.
        - id: ch01-b14
          speaker: sister
          text: >-
            Oh, my brother, the water is as deep as a man is tall! Oh, my brother, now the pitcher is filling!
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: >-
            The pitcher filled, and the sister sank with it and drowned. Then the Bonga changed her into a Bonga like himself and carried her away.
    - id: ch02
      title: The Bamboo Fiddle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Some time later, the sister appeared again as a bamboo growing on the bank of the same tank. The bamboo grew to an enormous size. A Jogi often passed that way, and when he saw it, he had an idea.
        - id: ch02-b02
          speaker: jogi
          text: That bamboo would make a splendid fiddle.
        - id: ch02-b03
          speaker: narrator
          text: >-
            One day, he came back with an axe. Just as he was about to chop the bamboo down, a voice came from its stem.
        - id: ch02-b04
          speaker: sister
          text: Do not cut me at the root. Cut higher up.
        - id: ch02-b05
          speaker: narrator
          text: The Jogi raised his axe toward the upper part of the stem. The bamboo called out again.
        - id: ch02-b06
          speaker: sister
          text: No, do not cut near the top. Cut me at the root.
        - id: ch02-b07
          speaker: narrator
          text: He moved his axe back to the root, as the voice had asked.
        - id: ch02-b08
          speaker: sister
          text: Do not cut at the root. Cut higher up.
        - id: ch02-b09
          speaker: narrator
          text: But when he prepared to cut higher, the bamboo changed its command once more.
        - id: ch02-b10
          speaker: sister
          text: Do not cut up there. Cut me at the root.
        - id: ch02-b11
          speaker: narrator
          text: >-
            By then, the Jogi felt certain that a Bonga was trying to frighten him. He grew angry and cut the bamboo down at the root. He took it away and made a fiddle from it. The fiddle had a richer tone than other instruments, and everyone who heard it was delighted. The Jogi carried it as he went from place to place begging. Its sweet music brought him home each evening with his wallet full.
        - id: ch02-b12
          speaker: narrator
          text: >-
            From time to time, his rounds took him to the home of the girl's brothers. The fiddle's music moved them deeply. Some even wept, because its voice seemed to wail in bitter pain. The eldest brother longed to own it and made the Jogi an offer.
        - id: ch02-b13
          speaker: elder_brother
          text: >-
            Give me this wonderful fiddle, and I will provide for you for a whole year.
        - id: ch02-b14
          speaker: narrator
          text: But the Jogi knew how precious the fiddle was, and he would not sell it.
    - id: ch03
      title: The Stolen Fiddle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After some time, the Jogi came to the house of a village chief. He played a tune or two, then asked for something to eat. The people there offered him a high price for the fiddle.
        - id: ch03-b02
          speaker: chief_householder
          text: Sell us your fiddle. We will pay you very well for it.
        - id: ch03-b03
          speaker: jogi
          text: >-
            I cannot sell it. This fiddle is how I earn my living.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When they saw that they could not persuade him, they gave him food and plenty of liquor. He drank so much that he soon became intoxicated. While he was in that state, they took his fiddle and put their own old one in its place.
        - id: ch03-b05
          speaker: narrator
          text: >-
            When the Jogi recovered, he knew his instrument was gone. He suspected that the household had stolen it, and he demanded its return.
        - id: ch03-b06
          speaker: jogi
          text: This is not my fiddle. Give mine back to me.
        - id: ch03-b07
          speaker: narrator
          text: >-
            They denied taking it. The Jogi could do nothing but leave his fiddle behind. The chief's son was a musician, and he often played the stolen instrument. In his hands, its music delighted everyone who heard it.
    - id: ch04
      title: The Girl Inside the Fiddle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Whenever the whole household went out to work in the fields, the Bonga girl came out of the bamboo fiddle and cooked the family meal. She ate her own share, then put the chief's son's portion beneath his bed and covered it to protect it from dust. After that, she went back inside the fiddle.
        - id: ch04-b02
          speaker: narrator
          text: >-
            This happened every day. The rest of the household assumed that one of the young man's female friends was looking after him, so they made no effort to learn the truth. But the young chief was determined to discover which friend was being so attentive.
        - id: ch04-b03
          speaker: chief_son
          text: >-
            Today I will catch her and give her a good beating. She is making me feel ashamed in front of everyone else.
        - id: ch04-b04
          speaker: narrator
          text: >-
            He hid in a corner beneath a pile of firewood. Before long, the girl stepped out of the bamboo fiddle and began arranging her hair. Once she had finished dressing, she cooked the rice as usual. She ate some, set the young man's share beneath his bed, and started back toward the fiddle.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The chief's son rushed from his hiding place and caught her in his arms. The Bonga girl cried out.
        - id: ch04-b06
          speaker: sister
          text: >-
            Shame! You may be a Dom, or perhaps a Hadi, or someone of another caste whom I cannot marry.
        - id: ch04-b07
          speaker: chief_son
          text: >-
            No, I am not. From this day on, you and I are one.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Then they spoke together with affection. When the others came home that evening, they saw that she was both human and Bonga, and they were filled with joy.
    - id: ch05
      title: The Sister's Only Revenge
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            In time, the Bonga girl's family became very poor. One day, her brothers came to visit the chief's house.
        - id: ch05-b02
          speaker: narrator
          text: >-
            She knew them at once, but they did not recognize her. She brought them water when they arrived, and later she placed cooked rice before them. Then she sat nearby and spoke in a sorrowful, wailing voice. She reproached them for the way their wives had treated her and told them everything that had happened.
        - id: ch05-b03
          speaker: sister
          text: >-
            You must have known what they were doing to me, yet you did nothing to step in and save me.
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: And that was all the revenge she took.
