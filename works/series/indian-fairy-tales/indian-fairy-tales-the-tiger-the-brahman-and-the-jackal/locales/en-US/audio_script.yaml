        pitch: medium
    tiger:
      display_name: Tiger
      tts:
        delivery: forceful and cunning
        timbre: deep and rough
        pace: deliberate
        pitch: low
    brahman:
      display_name: Brahman
      tts:
        delivery: gentle and earnest
        timbre: soft and clear
        pace: measured
