  chapters:
    - id: ch01
      title: The Tiger in the Cage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, a tiger was caught in a cage. He pushed against the bars, rolled about, and bit at them. But nothing worked, and he was wild with rage and misery.
        - id: ch01-b02
          speaker: narrator
          text: One day, a poor Brahman happened to pass that way. The tiger called to him.
        - id: ch01-b03
          speaker: tiger
          text: Please let me out of this cage, holy sir!
        - id: ch01-b04
          speaker: brahman
          text: No, my friend. If I set you free, you would probably eat me.
        - id: ch01-b05
          speaker: tiger
          text: >-
            Never! I swear I would always be grateful. Why, I would serve you like a slave!
        - id: ch01-b06
          speaker: narrator
          text: >-
            The tiger sobbed and sighed. He wept and made promise after promise until the kind Brahman's heart grew soft. At last, the Brahman opened the cage.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The tiger sprang out and seized him. Then the beast spoke again.
        - id: ch01-b08
          speaker: tiger
          text: >-
            What a fool you are! Nothing can stop me from eating you now. I have been shut up for so long, and I am terribly hungry!
        - id: ch01-b09
          speaker: narrator
          text: >-
            The Brahman begged for his life, but the tiger would offer only one small chance. He agreed to let the first three things the Brahman questioned decide whether it was just for the tiger to eat him.
    - id: ch02
      title: Three Bitter Answers
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The Brahman first told a pipal tree what the tiger meant to do. Then he asked whether the tiger's actions were just.
        - id: ch02-b02
          speaker: pipal_tree
          text: >-
            What do you have to complain about? I give shade and shelter to everyone who passes. How do they repay me? They tear down my branches to feed their cattle. Stop whimpering and face your trouble like a man!
        - id: ch02-b03
          speaker: narrator
          text: >-
            The answer left the Brahman heavy-hearted. He walked farther and found a buffalo turning the wheel of a well. The buffalo gave him no comfort either.
        - id: ch02-b04
          speaker: buffalo
          text: >-
            You are a fool if you expect gratitude. Look at me. While I gave milk, they fed me cottonseed and oil cake. Now I have no milk, so they tie me to this wheel and give me scraps to eat!
        - id: ch02-b05
          speaker: narrator
          text: Sadder still, the Brahman asked the road for its judgment.
        - id: ch02-b06
          speaker: road
          text: >-
            My dear sir, what else did you expect? I am useful to everyone. Yet rich and poor, great and small, all tread on me as they pass. They leave me nothing but pipe ashes and grain husks!
        - id: ch02-b07
          speaker: narrator
          text: With that, the Brahman turned back in sorrow.
    - id: ch03
      title: The Jackal Hears the Story
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On his way back, the Brahman met a jackal, who called out to him.
        - id: ch03-b02
          speaker: jackal
          text: >-
            Why, what is wrong, Mr. Brahman? You look as miserable as a fish out of water!
        - id: ch03-b03
          speaker: narrator
          text: The Brahman told him everything that had happened. When he finished, the jackal looked puzzled.
        - id: ch03-b04
          speaker: jackal
          text: >-
            How confusing! Would you tell me the whole thing once more? It has all become mixed up in my head.
        - id: ch03-b05
          speaker: narrator
          text: >-
            So the Brahman told the story again. The jackal shook his head as though he still could not make sense of it.
        - id: ch03-b06
          speaker: jackal
          text: >-
            How strange. It goes into one ear and straight out of the other! I had better see the place where it happened. Perhaps then I can give you my judgment.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Together they returned to the cage. The tiger was waiting there, sharpening his teeth and claws.
    - id: ch04
      title: Back Into the Cage
      blocks:
        - id: ch04-b01
          speaker: tiger
          text: You have been gone a long time! Now let us begin our dinner.
        - id: ch04-b02
          speaker: narrator
          text: >-
            “Our dinner!” thought the miserable Brahman. His knees knocked with fear. It was a remarkably delicate way for the tiger to put it.
        - id: ch04-b03
          speaker: brahman
          text: >-
            Give me five minutes, my lord. I need to explain everything to this jackal. He is a little slow to understand.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The tiger agreed. The Brahman began the whole tale again. He left out nothing and made it last as long as he possibly could.
        - id: ch04-b05
          speaker: jackal
          text: >-
            Oh, my poor brain! Let me think. How did this begin? You were inside the cage, and the tiger came walking past—
        - id: ch04-b06
          speaker: tiger
          text: Nonsense! What a fool you are! I was in the cage.
          emotion: angry
        - id: ch04-b07
          speaker: jackal
          text: >-
            Of course! Yes, I was in the cage. No, I was not. Oh dear, where have my wits gone? The tiger was inside the Brahman, and the cage came walking past—no, that cannot be right. Never mind me. You may as well begin your dinner. I shall never understand.
        - id: ch04-b08
          speaker: tiger
          text: >-
            You will understand! I will make you understand! Look here. I am the tiger.
          emotion: angry
        - id: ch04-b09
          speaker: jackal
          text: Yes, my lord.
        - id: ch04-b10
          speaker: tiger
          text: And that is the Brahman.
        - id: ch04-b11
          speaker: jackal
          text: Yes, my lord.
        - id: ch04-b12
          speaker: tiger
          text: And that is the cage.
        - id: ch04-b13
          speaker: jackal
          text: Yes, my lord.
        - id: ch04-b14
          speaker: tiger
          text: I was inside the cage. Do you understand now?
        - id: ch04-b15
          speaker: jackal
          text: Yes—no. Please, my lord, I still cannot understand it.
        - id: ch04-b16
          speaker: tiger
          text: Well?
        - id: ch04-b17
          speaker: narrator
          text: The tiger's patience was nearly gone.
        - id: ch04-b18
          speaker: jackal
          text: Please, my lord, how did you get inside?
        - id: ch04-b19
          speaker: tiger
          text: How? In the usual way, of course!
        - id: ch04-b20
          speaker: jackal
          text: >-
            Oh dear, my head is spinning again! Please do not be angry, my lord, but what is the usual way?
        - id: ch04-b21
          speaker: narrator
          text: At last, the tiger lost all patience. He jumped into the cage and shouted.
        - id: ch04-b22
          speaker: tiger
          text: This way! Now do you understand how it happened?
          emotion: angry
        - id: ch04-b23
          speaker: jackal
          text: >-
            Perfectly! And if you will allow me to say so, I think things should stay just as they were.
        - id: ch04-b24
          speaker: narrator
          text: The jackal grinned and neatly shut the cage door.
