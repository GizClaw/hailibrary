audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    brahman:
      display_name: 婆罗门
      tts:
        delivery: 质朴勤恳，忧虑家人时急切直率
        timbre: 清瘦温和
        pace: 适中
        pitch: 中
    brahmani:
      display_name: 婆罗门妻子
      tts:
        delivery: 坚忍务实，说到家中困境时坦率坚定
        timbre: 柔和朴实
        pace: 适中
        pitch: 中
    merchant:
      display_name: 商人
      tts:
        delivery: 仁厚沉着，问话清楚而有分寸
        timbre: 温厚明朗
        pace: 适中
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 勇敢机敏，历险中沉着而果断
        timbre: 清朗坚定
        pace: 适中
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 平日健谈直率，受到点醒时略带迟疑
        timbre: 洪亮饱满
        pace: 适中偏快
        pitch: 中低
    host:
      display_name: 留宿人
      tts:
        delivery: 表面殷勤，行凶受阻后惊疑不定
        timbre: 低沉粗粝
        pace: 适中
        pitch: 低
    dog_owner:
      display_name: 狗的旧主人
      tts:
        delivery: 困窘多疑，仓促盘算时焦躁慌乱
        timbre: 沙哑疲惫
        pace: 偏快
        pitch: 中低
    brother_in_law:
      display_name: 姐夫国王
      tts:
        delivery: 身居高位而急躁，前倨后恭
        timbre: 浑厚威严
        pace: 适中
        pitch: 低
    potter:
      display_name: 陶工
      tts:
        delivery: 劳苦直率，悲喜交加时语气沉重
        timbre: 粗厚朴实
        pace: 适中
        pitch: 中低
    princess_king:
      display_name: 公主的父王
      tts:
        delivery: 忧心女儿，转忧为喜后爽朗庄重
        timbre: 洪亮稳重
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 十万卢比的忠告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对贫苦的婆罗门夫妇。丈夫双目失明，两位老人全靠儿子养活。儿子每天出门乞讨，讨来多少，全家就吃多少。时间一久，年轻人实在受不了这种日子，决定去别的国家碰碰运气。
        - id: ch01-b02
          speaker: narrator
          text: 临行前，他把打算告诉妻子，嘱咐她在自己离开的几个月里，无论如何也要照料好父母，一定要勤快，免得老人动怒，诅咒远行的儿子。第二天一早，他带上一包食物出发，一天又一天不停赶路，终于来到邻国都城。他在一家商人的店铺旁坐下，开口讨些施舍。
        - id: ch01-b03
          speaker: merchant
          text: 你从哪里来？为什么走到这里？你是什么种姓？
        - id: ch01-b04
          speaker: brahman
          text: 我是婆罗门。家中还有妻子和年迈的父母，我四处乞讨，只为养活他们和自己。
        - id: ch01-b05
          speaker: narrator
          text: 商人听了很同情他，劝他拜见本国仁慈慷慨的国王，还答应陪他一同进宫。当时，国王刚建好一座黄金神庙，正想找个婆罗门照管。见到这个年轻人，又听说他品行端正、为人诚实，国王十分高兴，立刻把神庙托付给他，每年给他五十哈瓦尔大米和一百卢比作酬劳。
        - id: ch01-b06
          speaker: narrator
          text: 两个月过去，妻子一直没有丈夫的消息，便动身寻找。她恰好来到同一座都城，又听说每天早晨，去黄金神庙乞讨的人都能以国王的名义领到一枚金卢比。第二天，她赶到神庙，终于见到了丈夫。
        - id: ch01-b07
          speaker: brahman
          text: 你为什么跑到这里来？怎么能把我的父母丢在家中？你就不怕他们诅咒我，叫我送了命吗？马上回去，等我回家。
        - id: ch01-b08
          speaker: brahmani
          text: 不，我不能回去挨饿，更不能眼看着你年迈的父母饿死。家里连一粒米也没有了。
        - id: ch01-b09
          speaker: narrator
          text: 婆罗门惊呼一声“天神啊”，随手在纸上写了几行，递给妻子。
        - id: ch01-b10
          speaker: brahman
          text: 把这张纸交给国王吧。他会为它付给你十万卢比。
        - id: ch01-b11
          speaker: narrator
          text: 纸上共有三条忠告。第一，夜里到了陌生地方，投宿一定要谨慎，千万别闭眼入睡，否则这一闭眼，也许再不会醒来。第二，出嫁的姐妹见兄弟衣着体面地来，会为了好处热情相迎。若兄弟穷困登门，她便可能皱眉不认。第三，有事必须亲自动手，使出全力，什么也别怕。
        - id: ch01-b12
          speaker: narrator
          text: 妻子回家后，把遇见丈夫的经过告诉父母，又说丈夫给了她一张多么值钱的纸。她不敢面见国王，先托一个亲戚送纸。国王读完，却叫人把亲戚鞭打一顿，赶了出去。第二天，她只得亲自拿着纸去王宫。路上，王子见她边走边读，便问纸上写了什么，又问她要到哪里去。
        - id: ch01-b13
          speaker: brahmani
          text: 这里有几条忠告，我要卖十万卢比。
        - id: ch01-b14
          speaker: narrator
          text: 王子让她把纸拿来，读过以后，当场给她一张领取十万卢比的凭单，随后骑马走了。这个贫苦的女人感激不尽，当天便买下大批粮食，足够全家吃上很久。傍晚，王子把遇见她、买下纸条的事告诉父亲，以为会得到称赞。不料事情恰恰相反。国王比先前更加愤怒，竟把儿子逐出国境。
    - id: ch02
      title: 陌生人家的一夜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子告别母亲、亲友，骑马离开，连自己要去哪里也不知道。天黑时，一个陌生男人请他到家中留宿，铺席让他坐，又端出最好的食物，待他真像一位王子。
        - id: ch02-b02
          speaker: prince
          text: 这正是第一条忠告说的情形。今晚我不能睡。
        - id: ch02-b03
          speaker: narrator
          text: 这个决定救了他。半夜，主人拿着剑猛扑过来。王子立即起身，叫住了他。
        - id: ch02-b04
          speaker: prince
          text: 别杀我。我死了，你能得到什么？你要是真动手，日后一定会后悔，就像那个亲手杀死爱犬的人。
        - id: ch02-b05
          speaker: host
          text: 什么人？什么狗？
        - id: ch02-b06
          speaker: prince
          text: 先把剑交给我，我就把故事讲给你听。
        - id: ch02-b07
          speaker: narrator
          text: 男人果然交出了剑。王子说，从前有个富商养着一条爱犬。后来他突然破产，只得向另一位商人借五千卢比，把狗抵押给债主，再用借款重新做生意。
        - id: ch02-b08
          speaker: narrator
          text: 不久，债主的店铺遭贼洗劫，货物几乎被搬得一干二净，剩下的东西连十卢比也不值。忠犬知道出了事，一路跟踪盗贼，亲眼看见他们把赃物藏在哪里，才跑回主人家。天亮后，众人知道发生了什么，屋里顿时哭声不断，商人本人几乎急疯了。狗一次次跑到门口，又扯住主人的上衣和裤子，仿佛非要带他出去不可。
        - id: ch02-b09
          speaker: narrator
          text: 最后，一位朋友猜到狗也许知道货物在哪里，劝商人跟着它走。商人答应了。狗一路把他和朋友们领到盗贼藏东西的地方，在地上又刨又叫，用种种举动告诉他们，货物就在下面。大家动手挖开泥土，很快便找回了所有失物，一件也没少。盗贼搬走时是什么样，找回来时仍是什么样。
        - id: ch02-b10
          speaker: narrator
          text: 商人高兴极了。回到家，他马上把狗送还旧主人，还把一封信卷起来，塞在项圈下面。信中详细讲了这条狗怎样聪明地追回货物，请朋友忘掉原先那五千卢比的债，并另外收下五千卢比作谢礼。
        - id: ch02-b11
          speaker: dog_owner
          text: 糟了，朋友一定来讨债了！我还没从损失中缓过来，拿什么还钱？不如赶在狗进门前杀了它，就说是别人下的手。狗没了，这笔债也就没了。
        - id: ch02-b12
          speaker: narrator
          text: 他照着自己的盘算冲出去，赶在狗踏进门槛以前，杀死了这只可怜的动物。就在这时，藏在项圈里的信掉了出来。他拾起信读了一遍，才明白整件事情的真相。他刚刚杀死的，竟是一条为自己免去债务、还带回丰厚谢礼的忠犬。此刻的悲痛和失望，真是难以形容。
        - id: ch02-b13
          speaker: prince
          text: 所以你要当心。别做出一件事，等到以后，宁可拿自己的命去换，也恨不得从来没有做过。
        - id: ch02-b14
          speaker: narrator
          text: 故事讲完，天已经快亮。王子赏了主人一些钱，随后离开。
    - id: ch03
      title: 穷困与显贵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子接着来到姐夫统治的国家。他装成苦行者，坐在王宫附近的一棵树下，假装全心沉浸在修行之中。这个人的消息传进王宫，人人都说他修为高深。姐夫听了立刻动了心。王后病得很重，他请过许多医师，却始终治不好，也许这位圣人能想出办法。
        - id: ch03-b02
          speaker: narrator
          text: 国王派人去请，苦行者却说，露天之下才是自己的居所，绝不会走进国王的殿堂。陛下若想见他，必须亲自带妻子来。国王照办了。苦行者让王后伏地跪拜，过了约莫三个小时，才叫她起来，说病已经治好。
        - id: ch03-b03
          speaker: narrator
          text: 当天傍晚，宫里突然乱成一团。王后的珍珠念珠不见了，谁也不知道下落。最后，有人来到树下寻找苦行者，竟在王后先前伏地跪拜的地方发现念珠。姐夫听到消息后勃然大怒，下了一道严厉的命令，要把苦行者处死。
        - id: ch03-b04
          speaker: narrator
          text: 王子暗中买通行刑的人，逃出这个国家。他这才知道，第二条忠告也说中了。穷困潦倒地来到姐姐面前，得到的不是亲情，而是死刑。
    - id: ch04
      title: 公主寝宫里的沙赫马尔蛇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子换回自己的衣裳继续赶路。一天，他看见一个陶工守着妻儿，一会儿哭，一会儿笑，便走上前去询问。
        - id: ch04-b02
          speaker: prince
          text: 你究竟遇到了什么事？既然在笑，为什么又哭？既然在哭，怎么又笑起来？
        - id: ch04-b03
          speaker: potter
          text: 别来烦我。这件事跟你有什么关系？
        - id: ch04-b04
          speaker: prince
          text: 请原谅，可我实在想知道其中的缘故。
        - id: ch04-b05
          speaker: potter
          text: 本国国王有个女儿，每天都得嫁一个丈夫，因为娶她的人都活不过新婚第一夜。这里的年轻人几乎全死光了，很快就要轮到我儿子。陶工的儿子竟能娶公主，荒唐得叫人想笑。可他一成婚就会丧命，我们又怎能不哭？
          emotion: sad
        - id: ch04-b06
          speaker: prince
          text: 这确实让人又想笑又想哭。不过，你们不用再哭。我代替你们的儿子去娶公主。只要给我合适的衣裳，再替我准备成婚就好。
        - id: ch04-b07
          speaker: narrator
          text: 陶工拿出华美的衣裳和首饰，替王子穿戴整齐，送他进宫。夜里，人们把王子领进公主的寝宫。这个时刻终于到了。他想到前面几十个年轻人全都死在这里，不知道自己是否也会送命。王子紧紧握住剑柄，在床上躺下，决心整夜不睡，亲眼看清危险到底来自哪里。
        - id: ch04-b08
          speaker: narrator
          text: 到了半夜，王子看见两条沙赫马尔蛇竟从公主的鼻孔里钻出来。它们悄无声息地朝他爬去，想像杀死先前那些新郎一样杀死他。王子没有合眼，早已有了准备。等两条蛇爬到床边，他一把拔出紧握的剑，迎面劈去，把它们全都杀死了。
        - id: ch04-b09
          speaker: narrator
          text: 第二天一早，国王照例前来察看，没想到女儿正和王子快活地交谈。他又惊又喜。
        - id: ch04-b10
          speaker: princess_king
          text: 这个人一定是她真正的丈夫，因为只有他能和她一起活下来。年轻人，你从哪里来？你究竟是谁？
          emotion: surprised
        - id: ch04-b11
          speaker: prince
          text: 大王，我也是一位国王的儿子，来自另一个国家。
        - id: ch04-b12
          speaker: narrator
          text: 国王知道他的身份后十分欢喜，把王子留在宫里，还立他为王位继承人。王子在那里住了一年多，后来请求回自己的国家探望，国王答应了。临行时，他送给王子许多大象、骏马、珠宝和钱财，一部分供沿途花用，一部分作为送给王子父亲的礼物。王子带上这一切，踏上归途。
    - id: ch05
      title: 回到父母身边
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 回国途中，王子再次经过姐夫的国家。姐夫听说他带着浩荡的队伍到来，竟把双手捆住，脖子套上绳索，亲自前来行礼，还低声下气地求他住进宫里，接受那一点微薄的款待。
        - id: ch05-b02
          speaker: narrator
          text: 王子住在宫中时，终于见到自己的姐姐。姐姐又是微笑，又是亲吻，热情地迎接弟弟。临走时，王子告诉她，当初自己装成穷苦行者前来，她和丈夫怎样对待他，他又怎样买通行刑的人，死里逃生。尽管如此，王子仍送给夫妻二人两头大象、两匹骏马、十五名士兵，还有价值一百万卢比的珠宝。
        - id: ch05-b03
          speaker: narrator
          text: 随后，王子回到自己的国家，派人禀告父母。可怜的父王母后因为思念失踪的儿子，天天流泪，双眼都已经哭瞎了。
        - id: ch05-b04
          speaker: king
          text: 让他进来。只要他把双手放在我们的眼睛上，我们一定能重新看见。
        - id: ch05-b05
          speaker: narrator
          text: 王子走进宫中，年迈的父母满怀疼爱地迎接他。他把手放到两人眼上，父母果然重见光明。
        - id: ch05-b06
          speaker: narrator
          text: 王子把离家以后经历的一切全都告诉父亲，又讲起那张从婆罗门妻子手里买来的纸。正因为听从纸上的忠告，他在陌生人家躲过一劫，看清姐姐如何对待穷困的兄弟，也在公主的寝宫里亲手杀死沙赫马尔蛇，一次又一次保住性命。国王听完，深深懊悔当初把儿子赶走。从此，一家人又生活在欢乐与安宁之中。
