  chapters:
    - id: ch01
      title: The Golden Temple
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A poor blind Brahman and his wife depended on their son for everything they had. Each day, the young Brahman went out to beg for whatever food he could find. After living this way for a long while, he could bear it no longer. He decided to seek his fortune in another country.
        - id: ch01-b02
          speaker: brahman
          text: >-
            I will be gone for several months. Please find some way to care for my parents while I am away. Work hard, so they will have no reason to be angry and curse me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One morning, he tied up a little food in a bundle and set out. He walked day after day until he reached the chief city of the neighboring country. There he sat beside a merchant's shop and asked for alms. The merchant wanted to know where he had come from, why he was there, and what caste he belonged to.
        - id: ch01-b04
          speaker: brahman
          text: >-
            I am a Brahman. I wander from place to place, begging enough to support my wife, my parents, and myself.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The merchant pitied him. He advised the Brahman to visit the country's kind and generous king, and he offered to take him to court himself. Just then, the king needed a Brahman to care for a golden temple he had recently built. His Majesty was pleased to find the young man was honest and good. He put the temple in the Brahman's charge at once. Each year, the Brahman would receive fifty kharwars of rice and one hundred rupees as his wages.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Two months passed with no word from him. His wife finally left home to search for him. By good fortune, she came to the same city. There she learned that every morning, at the golden temple, any beggar could receive a golden rupee in the king's name. She went the next morning and found her husband.
        - id: ch01-b07
          speaker: brahman
          text: >-
            Why are you here? Why did you leave my parents? Do you not care if they curse me and I die? Go home at once and wait until I return.
        - id: ch01-b08
          speaker: brahmani
          text: >-
            No, I will not go back to starve while your old father and mother die beside me. There is not one grain of rice left in the house.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The Brahman cried out to Bhagawant. Then he scribbled a few lines on a scrap of paper and handed it to her.
        - id: ch01-b10
          speaker: brahman
          text: >-
            Take this to the king. You will see. He will pay you a lac of rupees for it.
        - id: ch01-b11
          speaker: narrator
          text: With that, he sent her away.
    - id: ch02
      title: Three Pieces of Advice
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The scrap of paper held three pieces of advice. First, when you reach a strange place at night, take care where you stay. Do not close your eyes in sleep, or you may close them in death.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Second, if you visit a married sister in great splendor, she will welcome you for what she may gain. Come to her in poverty, and she will frown on you and deny you.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Third, when a task must be done, do it yourself. Put all your strength into it, and do not be afraid.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Back home, the Brahmani told her parents about meeting her husband and about the valuable paper he had given her. She did not want to appear before the king herself, so she sent one of her relatives in her place. The king read the paper, ordered the unfortunate man flogged, and dismissed him without paying anything.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The next morning, the Brahmani carried the paper toward the royal court, reading as she walked. The king's son met her on the road and asked what she had in her hands.
        - id: ch02-b06
          speaker: brahmani
          text: >-
            This paper contains several pieces of advice, and I mean to sell it for a lac of rupees.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The prince asked to see it. After reading the advice, he gave her an order for the full amount and rode on. The grateful Brahmani bought a great store of provisions that very day, enough to support the family for a long time.
        - id: ch02-b08
          speaker: narrator
          text: >-
            That evening, the prince told his father about the woman and the paper he had bought. He expected praise. Instead, the king grew angrier than before and banished him from the country.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The prince said farewell to his mother, his relatives, and his friends. Then he mounted his horse and rode away, with no idea where he was going.
    - id: ch03
      title: The Wakeful Guest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At nightfall, the prince reached a settlement. A man met him and invited him to stay in his house. The prince accepted. His host treated him royally, spreading matting for him to sit on and serving him the best food in the house.
        - id: ch03-b02
          speaker: prince
          text: >-
            This is just what the first piece of advice warned me about. I will not sleep tonight.
        - id: ch03-b03
          speaker: narrator
          text: >-
            That choice saved him. In the middle of the night, his host rose, took up a sword, and rushed at the prince, meaning to kill him. The prince sprang to his feet and spoke.
        - id: ch03-b04
          speaker: prince
          text: >-
            Do not kill me. What would you gain from my death? You would only regret it afterward, like the man who killed his dog.
        - id: ch03-b05
          speaker: host
          text: What man? What dog?
        - id: ch03-b06
          speaker: prince
          text: Give me the sword, and I will tell you the story.
        - id: ch03-b07
          speaker: narrator
          text: The man handed over the sword, and the prince began.
    - id: ch04
      title: The Faithful Dog
      blocks:
        - id: ch04-b01
          speaker: prince
          text: >-
            Once, a wealthy merchant had a pet dog. The merchant suddenly became poor and had to part with the animal. Another merchant lent him five thousand rupees and kept the dog as a pledge. With that money, the first merchant began his business again.
        - id: ch04-b02
          speaker: prince
          text: >-
            Not long afterward, thieves broke into the second merchant's shop and carried away nearly everything. They left goods worth scarcely ten rupees. But the faithful dog knew something was wrong. It followed the thieves, watched where they hid the stolen things, and then came back.
        - id: ch04-b03
          speaker: prince
          text: >-
            In the morning, the merchant's household wept and cried when they saw the empty shop. The merchant himself nearly lost his senses. All the while, the dog ran to the door, tugged at his master's shirt and paijamas, and tried to draw him outside.
        - id: ch04-b04
          speaker: prince
          text: >-
            At last, a friend said the dog might know where the stolen goods were. The merchant agreed to follow it. The dog led him straight to the hiding place. There it scratched the ground, barked, and showed him that something lay below.
        - id: ch04-b05
          speaker: prince
          text: >-
            The merchant and his friends dug there and found every piece of the stolen property. Nothing at all was missing.
        - id: ch04-b06
          speaker: prince
          text: >-
            The merchant was overjoyed. When he reached home, he sent the dog back to its old master. Under its collar, he tucked a letter describing the animal's wisdom. He asked his friend to forget the loan and accept another five thousand rupees as a gift.
        - id: ch04-b07
          speaker: prince
          text: >-
            But when the first merchant saw his dog returning, he thought his friend must be demanding repayment. He had not yet recovered from his losses and could not pay. So he decided to kill the dog before it crossed his threshold. Then he could claim that someone else had killed it and that the debt should end with the dog.
        - id: ch04-b08
          speaker: prince
          text: >-
            He ran out and killed the poor animal. The letter fell from its collar. He picked it up and read the truth. Then grief and disappointment overwhelmed him.
        - id: ch04-b09
          speaker: prince
          text: >-
            Take care that you do not act today in a way you would later give your life to undo.
        - id: ch04-b10
          speaker: narrator
          text: >-
            By the time the prince finished his story, the long night was almost over and morning was near. The danger had passed. Before going on his way, the prince rewarded the man who had meant to kill him.
    - id: ch05
      title: The Prince in Disguise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The prince next entered the country ruled by his brother-in-law. He disguised himself as a jogi, sat beneath a tree near the palace, and seemed lost in worship. Word soon reached the king that a wonderfully holy man had appeared.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The king was eager to meet him because his wife was very ill. He had called hakim after hakim, but none had cured her. Perhaps, he thought, this holy man could help. He sent for the jogi, but the prince refused to enter the palace.
        - id: ch05-b03
          speaker: prince
          text: >-
            A king's halls are no home for me. I live beneath the open sky. If His Majesty wishes to see me, he must come here himself and bring his wife.
        - id: ch05-b04
          speaker: narrator
          text: >-
            So the king brought his wife to the tree. The jogi told her to lie face down before him. She remained there for about three hours. Then he told her to rise and leave, for she was cured.
        - id: ch05-b05
          speaker: narrator
          text: >-
            That evening, the palace was thrown into confusion. The queen's pearl rosary was missing, and no one knew where it had gone. At last, someone returned to the tree and found it on the ground where the queen had lain.
        - id: ch05-b06
          speaker: narrator
          text: >-
            When the king heard, he flew into a rage and ordered the jogi put to death. The order was never carried out. The prince bribed the men sent to kill him and escaped from the country. Now he knew the second piece of advice was true.
        - id: ch05-b07
          speaker: narrator
          text: >-
            One day, dressed in his own clothes again, the prince saw a potter with his wife and children. One moment the family laughed, and the next they cried.
        - id: ch05-b08
          speaker: prince
          text: >-
            What is the matter with you? If you are happy enough to laugh, why are you crying? And if you are grieving, why do you laugh?
        - id: ch05-b09
          speaker: potter
          text: Leave me alone. Why should any of this matter to you?
        - id: ch05-b10
          speaker: prince
          text: Forgive me, but I truly want to understand.
        - id: ch05-b11
          speaker: potter
          text: >-
            Then listen. Our king has a daughter who must marry a new man every day, because every husband dies on his first night with her. Almost all the young men here are dead, and soon they will call for our son. We laugh because a potter's son marrying a princess is so absurd. Then we cry because we know what the marriage will cost him. What can we possibly do?
        - id: ch05-b12
          speaker: prince
          text: >-
            That is indeed a reason both to laugh and to weep. But you need not cry anymore. I will take your son's place and marry the princess. Give me clothes fit for the wedding and help me prepare.
    - id: ch06
      title: The Princess and the Shahmars
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The potter dressed the prince in beautiful clothes and ornaments, and the prince went to the palace. That night, attendants led him to the princess's room.
        - id: ch06-b02
          speaker: prince
          text: >-
            Is this the terrible hour? Am I going to die like all those young men before me?
          emotion: fearful
        - id: ch06-b03
          speaker: narrator
          text: >-
            He gripped his sword, lay down, and meant to stay awake until morning so he could see what happened. In the middle of the night, two Shahmars came out of the princess's nostrils. They crept toward him, ready to kill him as they had killed the others.
        - id: ch06-b04
          speaker: narrator
          text: >-
            The prince was ready. As the snakes reached his bed, he seized his sword, struck them, and killed them both.
        - id: ch06-b05
          speaker: narrator
          text: >-
            In the morning, the king came as he always did to ask what had happened. He expected another husband to be dead. Instead, he was amazed to hear his daughter and the prince talking happily together.
        - id: ch06-b06
          speaker: king
          text: >-
            This man must truly be her husband. He is the only one who has stayed alive beside her.
        - id: ch06-b07
          speaker: narrator
          text: The king entered the room and questioned him.
        - id: ch06-b08
          speaker: king
          text: Who are you, and where have you come from?
        - id: ch06-b09
          speaker: prince
          text: >-
            Your Majesty, I am the son of the king who rules the country of such-and-such.
        - id: ch06-b10
          speaker: narrator
          text: >-
            The king was delighted. He asked the prince to remain in the palace and named him heir to the throne. The prince lived there for more than a year. Then he requested permission to visit his own country, and the king agreed.
        - id: ch06-b11
          speaker: narrator
          text: >-
            For the journey, the king gave him elephants, horses, jewels, and a great sum of money. Some paid his expenses, and the rest was to be presented to his father. With this grand company, the prince set out for home.
    - id: ch07
      title: Home Again
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            His road passed through his brother-in-law's country, the very place where he had once appeared as a poor jogi. When news of the prince's splendid arrival reached the king, the man came to honor him with his hands tied by rope and a halter around his neck. Bowing most humbly, he begged the prince to stay at the palace and accept whatever little hospitality he could offer.
        - id: ch07-b02
          speaker: narrator
          text: >-
            During the visit, the prince saw his sister. This time, she greeted him with smiles and kisses. Before leaving, he told her how she and her husband had treated him when he first came in disguise, and how he had escaped.
        - id: ch07-b03
          speaker: narrator
          text: >-
            Even so, he gave them two elephants, two fine horses, fifteen soldiers, and jewels worth ten lacs of rupees.
        - id: ch07-b04
          speaker: narrator
          text: >-
            At last, he reached his own land and sent word of his arrival to his mother and father. Alas, both parents had gone blind from weeping over their lost son.
        - id: ch07-b05
          speaker: king
          text: >-
            Let him come in and place his hands over our eyes. Then we will be able to see again.
        - id: ch07-b06
          speaker: narrator
          text: >-
            The prince entered, and his old parents welcomed him with great affection. He laid his hands upon their eyes, and their sight returned.
        - id: ch07-b07
          speaker: narrator
          text: >-
            Then the prince told his father everything that had happened. Again and again, the advice he bought from the Brahmani had saved him.
        - id: ch07-b08
          speaker: narrator
          text: >-
            The king was sorry that he had driven his son away. And so, after all their sorrow, joy and peace returned to them.
