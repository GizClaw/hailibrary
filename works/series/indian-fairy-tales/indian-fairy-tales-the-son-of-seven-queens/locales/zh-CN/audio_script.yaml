audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严自信，受迷惑时流露痴狂
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
    fakir:
      display_name: 老苦行僧
      tts:
        delivery: 神秘笃定，言语简短有分量
        timbre: 苍老清瘦
        pace: 缓慢
        pitch: 低
    queen_elder_1:
      display_name: 大王后
      tts:
        delivery: 端庄忧虑，语气恳切
        timbre: 成熟柔和
        pace: 适中
        pitch: 中
    queen_elder_2:
      display_name: 二王后
      tts:
        delivery: 温和持重，忧心时略显急切
        timbre: 柔润清晰
        pace: 适中
        pitch: 中
    queen_elder_3:
      display_name: 三王后
      tts:
        delivery: 端庄克制，语气真诚
        timbre: 明净温暖
        pace: 适中
        pitch: 中
    youngest_queen:
      display_name: 小王后
      tts:
        delivery: 慈爱坚韧，面对儿子时温柔亲近
        timbre: 柔和清亮
        pace: 舒缓
        pitch: 中高
    white_queen:
      display_name: 白王后
      tts:
        delivery: 甜美诱人，恶意藏在轻柔话语之下
        timbre: 清冷华丽
        pace: 从容
        pitch: 中高
    son:
      display_name: 七位王后之子
      tts:
        delivery: 明朗勇敢，待母亲真挚，遇险时坚定
        timbre: 年轻清亮
        pace: 适中偏快
        pitch: 中
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧镇定，决断干脆而不失温柔
        timbre: 清澈端庄
        pace: 适中
        pitch: 中高
    old_witch:
      display_name: 老巫婆
      tts:
        delivery: 粗声抱怨，畏惧女儿时强压怒气
        timbre: 苍老沙哑
        pace: 偏慢
        pitch: 低
    jogi:
      display_name: 瑜伽士
      tts:
        delivery: 起初凶狠威严，受惊后慌乱哀求
        timbre: 粗重低沉
        pace: 适中
        pitch: 低
    field_voice_1:
      display_name: 稻田之声一
      tts:
        delivery: 温柔甜美，带着不可抗拒的诱惑
        timbre: 轻柔清亮
        pace: 舒缓
        pitch: 高
    field_voice_2:
      display_name: 稻田之声二
      tts:
        delivery: 温柔甜美，带着不可抗拒的诱惑
        timbre: 柔润明净
        pace: 舒缓
        pitch: 中高
    field_voice_3:
      display_name: 稻田之声三
      tts:
        delivery: 温柔甜美，带着不可抗拒的诱惑
        timbre: 轻盈空灵
        pace: 舒缓
        pitch: 高
    field_voice_4:
      display_name: 稻田之声四
      tts:
        delivery: 温柔甜美，带着不可抗拒的诱惑
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 金角银蹄的白鹿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王娶了七位王后，却始终没有孩子。他一想到自己死后连个继承王位的人都没有，就十分悲伤。
        - id: ch01-b02
          speaker: narrator
          text: 一天，一个贫穷的老苦行僧前来见他。
        - id: ch01-b03
          speaker: fakir
          text: 你的祈祷已经得到回应。七位王后当中，会有一位替你生下王子。
        - id: ch01-b04
          speaker: narrator
          text: 国王听见这个许诺，高兴得不得了，立刻命令全国各地为王子的降生准备庆典。这时候，七位王后仍住在富丽堂皇的宫殿里，过着奢华的日子。几百名女奴服侍着她们，甜糕和蜜饯更是想吃多少就有多少。
        - id: ch01-b05
          speaker: narrator
          text: 国王酷爱打猎。有一天，他刚要出发，七位王后便派人送来一句话。
        - id: ch01-b06
          speakers: [queen_elder_1, queen_elder_2, queen_elder_3, youngest_queen]
          ensemble: chorus
          text: 求陛下今天别去北边打猎。我们都做了噩梦，实在怕您遇上灾祸。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 国王为了让她们安心，答应听从劝告，先往南走。可他认真搜寻了半天，连一只猎物也没有。东边、西边也同样空空荡荡。他不肯空手回宫，早把自己的诺言忘得一干二净，终于转向北方。起初，那里依旧毫无收获。就在他准备放弃时，一头金角银蹄的白鹿忽然从眼前闪过，钻进灌木丛。它快得几乎看不清，可国王心里已经燃起一股欲望，非要把这奇异的美物据为己有。他命随从围住灌木，再一点点收紧圈子。白鹿困在中央，累得直喘气。国王步步逼近，眼看就要抓住它，白鹿却猛地一跃，从他头顶越过，直奔群山。
        - id: ch01-b08
          speaker: narrator
          text: 国王把其他一切都抛在脑后，猛踢马腹，全速追去。他一路盯着白鹿，片刻不曾松开缰绳，把所有随从都远远甩在身后，最后进了一道没有出口的狭谷，只得勒住坐骑。那里只有一间破得可怜的茅屋。他追了这么久，疲惫不堪，又一无所获，便进去讨水。屋中坐着一个纺线的老妇人。她叫了一声女儿，内室便走出一位肌肤洁白、头发金黄的绝色少女。国王看呆了，怎么也想不到，这样的美人竟会住在破屋里。
        - id: ch01-b09
          speaker: narrator
          text: 少女把水举到他唇边。国王喝着水，望进她的眼睛，忽然明白，她就是自己追赶的金角银蹄的白鹿。
        - id: ch01-b10
          speaker: narrator
          text: 他被少女的美貌迷住，跪下来求她跟自己回宫，做自己的新娘。少女只管笑，说就算是国王，要应付七位王后也已经够多了。可国王不肯听她拒绝，还是苦苦哀求，要她可怜自己，还答应她无论想要什么都会得到。
        - id: ch01-b11
          speaker: white_queen
          text: 那就把七位王后的眼睛送给我。这样，我或许会相信你是真心的。
        - id: ch01-b12
          speaker: narrator
          text: 国王中了美色的魔障，立刻赶回宫去，命人挖出七位王后的眼睛。他又把这些可怜的盲眼女人扔进恶臭的地牢，让她们无处可逃。接着，他带着这份可怕的礼物返回茅屋。白鹿看见十四只眼睛，只是残忍地笑了笑，把它们一只只串成项链，戴到母亲颈上。
        - id: ch01-b13
          speaker: white_queen
          text: 小妈妈，我去王宫以后，你就戴着它作纪念吧。
        - id: ch01-b14
          speaker: narrator
          text: 白鹿跟随那个中了魔的国王回宫，成了他的新娘，也成了白王后。国王把七位王后的华服珠宝全送给她，让她住进七位王后的宫殿，又叫七位王后的奴仆来侍候她。这样一来，哪怕是一个女巫所能贪求的一切，她也当真全得到了。
    - id: ch02
      title: 地牢里的王子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 七位王后被挖去眼睛、投入地牢后不久，最年轻的王后生下一个俊俏的男孩。其他王后见最小的妹妹有这样的福气，起初十分嫉妒，也不喜欢这个孩子。可男孩很快帮了她们许多忙，成了所有人的依靠。没过多久，她们也都把他当成了自己的儿子。
        - id: ch02-b02
          speaker: narrator
          text: 他几乎刚会走路，就开始用手刮挖地牢的泥墙。谁也没想到，没过多久，他竟挖出一个足够自己爬出去的洞。他从洞里消失，大约一个时辰后又钻回来，怀里装满甜食，再一份不差地平均分给七位妈妈。
        - id: ch02-b03
          speaker: narrator
          text: 男孩一天天长大，又把洞挖得更宽。每天，他都要溜出去两三次，和城里的贵族孩子玩。没人知道这个小不点是谁，可人人都喜欢他。他总有滑稽的把戏，整天快活明亮，所以人们常常奖给他腰带形的烤饼、一把炒谷子，或是一些甜食。他把所得全带回地牢，送给自己最爱称作“七位妈妈”的王后们。世人都以为她们早已饿死，她们却靠着儿子一直活了下来。
        - id: ch02-b04
          speaker: narrator
          text: 男孩终于长成高大的少年。一天，他带着弓箭外出打猎，恰好经过白鹿住着的豪华宫殿。几只鸽子正在白色大理石的塔楼四周扑翅飞翔。他仔细瞄准，一箭射死一只。鸽子从白王后的窗口前直坠下去。她起身探头查看，只看了一眼，就凭巫术认出这个手握弓箭的俊俏少年正是国王的儿子。
        - id: ch02-b05
          speaker: narrator
          text: 她又嫉妒又怨恨，几乎要气死了，当即决定不能让少年活下去。可她先装作若无其事，派仆人把少年带到面前，问他肯不肯卖掉刚射下来的鸽子。
        - id: ch02-b06
          speaker: son
          text: 不卖。这是给我七位失明的妈妈吃的。她们被关在恶臭的地牢里，没有我带食物回去，就会饿死。
        - id: ch02-b07
          speaker: white_queen
          text: 她们真可怜。你一定想替她们找回眼睛吧？把鸽子给我，我就告诉你眼睛在哪里。
        - id: ch02-b08
          speaker: narrator
          text: 少年喜出望外，马上交出鸽子。白王后叫他去找自己的母亲，索要那条眼睛项链。
        - id: ch02-b09
          speaker: white_queen
          text: 带上我的信物。她看了上面的吩咐，一定会把眼睛给你。
        - id: ch02-b10
          speaker: narrator
          text: 白王后说完，递给他一块破陶片。那上面其实写着，立刻杀掉来人，把他的血像水一样泼出去。七位王后之子根本不识字，不知道自己拿着怎样可怕的命令，竟高高兴兴地带着这道催命口信上路，去寻找白王后的母亲。
        - id: ch02-b11
          speaker: narrator
          text: 途中，他来到一座人人愁眉不展的城，忍不住询问缘由。百姓告诉他，国王唯一的女儿拒绝出嫁，等父王死后，王位就无人继承。全国所有英俊青年都已经去见过公主，可她坚持只嫁给一个有七位母亲的儿子。大家从没听过这样的人，都怕公主是不是疯了。绝望的国王只好下令，把每一个走进城门的男子都带到女儿面前。
        - id: ch02-b12
          speaker: narrator
          text: 少年急着寻找母亲们的眼睛，却还是被拖进大殿。公主一看见他就红了脸，转身告诉父王。
        - id: ch02-b13
          speaker: princess
          text: 父王，我选的就是他。
          emotion: happy
        - id: ch02-b14
          speaker: narrator
          text: 就这几句话，让全城顿时欢声雷动，百姓高兴得几乎发狂。可少年说，必须先找回七位母亲的眼睛，才肯成婚。聪明又有学问的公主听完他的故事，要来陶片看了看。她一眼就看穿了上面的恶毒口信，却没有声张，只取来一块形状相同的陶片，写着要好好照顾少年，满足他的一切要求，再若无其事地交还给他。
        - id: ch02-b15
          speaker: narrator
          text: 少年毫不知情，继续赶路，很快来到山谷中的茅屋。面目可憎的老巫婆读完口信，气得抱怨不休。等少年开口索要眼睛项链，她更是满腹怒火。尽管如此，她还是把项链从颈上摘了下来。
        - id: ch02-b16
          speaker: old_witch
          text: 现在只剩十三只了。上个星期，我弄丢了一只。
        - id: ch02-b17
          speaker: narrator
          text: 少年能拿到十三只眼睛已经十分欢喜，立刻以最快的速度赶回地牢。他给六位年长的王后每人两只眼睛，最后只剩一只，便交给了最年轻的亲生母亲。
        - id: ch02-b18
          speaker: son
          text: 最亲爱的小妈妈，我会永远做你的另一只眼睛。
    - id: ch03
      title: 瑜伽士的神牛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 少年履行婚约，动身去迎娶公主。路过白王后的宫殿，他又看见屋顶上的鸽子，拉弓射下一只。鸽子扑腾着从窗口落下。白王后探头一看，国王的儿子竟然安然无恙地站在那里。她又恨又厌，尖叫起来，却仍把他叫到面前，问他为什么这么快就回来了。
        - id: ch03-b02
          speaker: narrator
          text: 少年把自己怎样带回十三只眼睛、怎样分给七位母亲，全都告诉了她。白王后听得几乎压不住怒火，表面却装作十分欣赏他的成功，还说只要再得到这只鸽子，便拿另一件宝物奖赏他。那是瑜伽士的神牛，乳汁整天流个不停，能汇成一座王国那么大的池塘。
        - id: ch03-b03
          speaker: white_queen
          text: 把这只鸽子也给我，我就把那头神牛送给你。
        - id: ch03-b04
          speaker: narrator
          text: 少年一听说有这样的神牛，当然十分高兴，痛痛快快地把鸽子交了出去。白王后照旧叫他去找自己的母亲，向她索要神牛。她又交给少年一块陶片，上面写得清清楚楚，这次务必杀死少年，再把他的血像水一样泼出去。
        - id: ch03-b05
          speaker: narrator
          text: 少年在路上先去看望公主，只想说明自己为什么耽搁。公主读过陶片，又悄悄换了一块。少年到达茅屋，向老巫婆索要神牛，她无法拒绝，只得告诉他该往哪里走。她还反复叮嘱，千万别害怕守护宝物的一万八千个恶魔。随后，她催少年快走，免得自己想到女儿送掉这么多宝物，越想越生气。
        - id: ch03-b06
          speaker: narrator
          text: 少年勇敢地照着她的话去做。他走啊走，终于来到一座乳白色的池塘。一万八千个恶魔守在四周，个个面目可怕。他鼓起勇气，一边吹着小曲，一边从他们中间走过，不往右看，也不往左看。走了一阵，他看见一头高大、美丽、通体雪白的牛。统领所有恶魔的瑜伽士正坐在那里，不分昼夜地挤奶，乳汁从牛乳中汩汩流出，把乳白色的池塘注得满满的。
        - id: ch03-b07
          speaker: jogi
          text: 你到这里来干什么？
          emotion: angry
        - id: ch03-b08
          speaker: son
          text: 我要你的皮。因陀罗王要做一面新的定音鼓，说你的皮又好又结实。
        - id: ch03-b09
          speaker: narrator
          text: 精灵和瑜伽士谁都不敢违抗因陀罗王。瑜伽士吓得浑身发抖，扑倒在少年脚边。
        - id: ch03-b10
          speaker: jogi
          text: 求你饶我一命！我什么都能给你，连那头美丽的白牛也可以！
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 少年故意迟疑片刻，才答应放过他，又说别处应该也能找到同样漂亮结实的皮。接着，他赶着神牛踏上归途。七位王后得到这样神奇的动物，欣喜万分。她们从早忙到晚，做凝乳、滤乳清，还把牛奶卖给糖果商，却连神牛产下的一半乳汁也用不完。她们就这样一天比一天富有。
    - id: ch04
      title: 千万倍的稻谷
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 眼看母亲们生活舒适，少年放下心来，再次动身去迎娶公主。可他经过白鹿的宫殿，听见几只鸽子在栏杆上咕咕叫，又忍不住射出一箭。一只鸽子恰好死在白王后的窗下。她探头望去，只见少年身体强健、精神十足地站在宫殿前，顿时气恨交加，脸色变得比从前更白了。
        - id: ch04-b02
          speaker: narrator
          text: 她听说自己的母亲竟然善待少年，差点当场发作，却还是甜甜地笑着，说自己很高兴兑现了承诺。
        - id: ch04-b03
          speaker: white_queen
          text: 把第三只鸽子给我吧。这一次，我送你一夜就能成熟、收获千万倍的稻谷。
        - id: ch04-b04
          speaker: narrator
          text: 少年一想到那神奇的稻谷，自然高兴极了。他交出鸽子，又像前两次一样带走一块陶片。白王后在上面写道，这次绝不能再失手，一定要杀死他，把他的血像水一样泼掉。少年先去探望公主，只为免得她替自己担心。公主照旧看过陶片，再换上一块相同的，写明这一次也要满足少年的所有要求，因为他的血就是老巫婆的血。
        - id: ch04-b05
          speaker: narrator
          text: 老巫婆读完口信，又得知少年要那种一夜成熟、收获千万倍的稻谷，顿时暴跳如雷。可她怕极了自己的女儿，只能强忍怒火，指点少年去找那片由一千八百万个恶魔看守的稻田。最高的一穗稻谷，就长在田地正中央。
        - id: ch04-b06
          speaker: old_witch
          text: 到田中央，拔下最高的那穗稻谷。记住，往回走时绝对不能回头。
        - id: ch04-b07
          speaker: narrator
          text: 少年出发后，很快来到生长着千万倍稻谷的田地。一千八百万个恶魔守在四周。他勇敢地穿过恶魔群，既不看右边，也不看左边，一直来到田中央，拔下最高的稻穗。可他转身往回走时，背后忽然响起一千个甜美的声音，用最温柔的语气呼唤他。
        - id: ch04-b08
          speakers: [field_voice_1, field_voice_2, field_voice_3, field_voice_4]
          ensemble: chorus
          text: 也拔下我吧！求求你，也把我拔下来吧！
        - id: ch04-b09
          speaker: narrator
          text: 少年回头一看，整个人立刻化为一小堆灰烬。
        - id: ch04-b10
          speaker: narrator
          text: 时间一点点过去，少年始终没有回来。老巫婆想起陶片上那句“他的血就是你的血”，心里越来越不安，便亲自赶去查看。她很快找到那堆灰烬，凭法术认出那正是少年。她取来一点水，把灰烬揉成糊，再捏成人的模样。随后，她刺破小指，把一滴血送进泥人的嘴里，又朝他吹了一口气。少年马上站了起来，仍和从前一样健康。
        - id: ch04-b11
          speaker: old_witch
          text: 下次不许再违背吩咐！不然我可把你扔下不管。赶快走，别等我后悔救你！
          emotion: angry
    - id: ch05
      title: 父子相认
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 少年欢欢喜喜地回到七位母亲身边。有了那种一夜成熟、收获千万倍的稻谷，她们很快成了整个王国最富有的人。随后，王后们为儿子和聪慧的公主举行婚礼。那场婚礼排场之盛大，简直超出了所有人的想象。
        - id: ch05-b02
          speaker: narrator
          text: 聪明的新娘却没有就此罢休。她一定要让丈夫与亲生父亲相认，也一定要惩罚邪恶的白女巫。于是，她叫丈夫建起一座宫殿。那座宫殿里里外外，都和七位王后从前居住、如今被白女巫占据的宫殿一模一样。一切准备妥当以后，她又让丈夫摆下一场盛宴，邀请国王前来做客。
        - id: ch05-b03
          speaker: narrator
          text: 国王早已听过那位神秘的七位王后之子，也听过他的惊人财富，于是欣然赴宴。一进宫殿，他发现这里每个地方都和自己的宫殿一模一样，心中的惊讶简直无法形容。衣着华贵的主人迎上前，径直把他领进内殿。七位王后穿着国王最后一次见到她们时的衣裳，端端正正地坐在王座上。国王看得目瞪口呆，一句话也说不出来。
        - id: ch05-b04
          speaker: narrator
          text: 这时，公主走上前，伏在国王脚边，把整个故事从头到尾说了一遍。国王终于从魔障中清醒过来。他想起邪恶的白鹿用巫术迷惑了自己这么多年，心中的怒火越烧越旺，再也压不住了。
        - id: ch05-b05
          speaker: narrator
          text: 人们处死了白女巫。她下葬以后，就连坟墓也被犁头翻了个遍。七位王后终于离开地牢，回到自己那座富丽堂皇的宫殿。从此以后，所有人都过上了幸福的生活。
