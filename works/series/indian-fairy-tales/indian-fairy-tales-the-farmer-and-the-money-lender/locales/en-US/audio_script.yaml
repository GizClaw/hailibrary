audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and inviting
        timbre: warm and clear
        pace: measured
        pitch: medium
    farmer:
      display_name: Farmer
      tts:
        delivery: plainspoken and earnest
        timbre: warm and rustic
        pace: measured
        pitch: medium
    money_lender:
      display_name: Money-lender
      tts:
        delivery: smooth and calculating
        timbre: dry and polished
        pace: deliberate
        pitch: medium-low
    ram:
      display_name: Ram
      tts:
        delivery: gentle and knowing
        timbre: calm and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Road to Ram
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a farmer who suffered greatly at the hands of a money-lender. Whether the harvest was good or bad, the farmer stayed poor while the money-lender grew rich. At last, the farmer had not a farthing left. He went to the money-lender's house.
        - id: ch01-b02
          speaker: farmer
          text: >-
            You cannot squeeze water from a stone. There is nothing more for you to take from me, so you might as well tell me the secret of getting rich.
        - id: ch01-b03
          speaker: money_lender
          text: My friend, riches come from Ram. You should ask him.
        - id: ch01-b04
          speaker: farmer
          text: Thank you. I will!
        - id: ch01-b05
          speaker: narrator
          text: >-
            The simple farmer made three girdle-cakes for the journey and set out to find Ram. First he met a Brahman. The farmer gave him one cake and asked which road led to Ram, but the Brahman took the cake and walked on without saying a word.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Next he met a Jogi, a holy devotee. He gave the Jogi another cake, but got no help from him either. At last, the farmer found a poor man sitting beneath a tree. When he learned that the man was hungry, he kindly gave away his final cake. Then he sat beside him to rest, and they began to talk.
    - id: ch02
      title: The Gift of the Conch
      blocks:
        - id: ch02-b01
          speaker: ram
          text: Where are you going?
        - id: ch02-b02
          speaker: farmer
          text: >-
            Oh, I have a long way to go. I am looking for Ram! I suppose you cannot tell me which road to take?
        - id: ch02-b03
          speaker: ram
          text: >-
            Perhaps I can. You see, I am Ram. What is it you want from me?
        - id: ch02-b04
          speaker: narrator
          text: >-
            The farmer told him everything. Ram took pity on him and gave him a conch shell. He taught the farmer a special way to blow it.
        - id: ch02-b05
          speaker: ram
          text: >-
            Remember this. Whenever you want something, blow the conch in that way, and your wish will come true. But watch out for that money-lender. Even magic may not be safe from his tricks!
    - id: ch03
      title: The Stolen Conch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The farmer returned to his village full of joy. The money-lender noticed his cheerful manner at once.
        - id: ch03-b02
          speaker: money_lender
          text: >-
            Something fortunate must have happened to that fool. Why else would he be carrying his head so proudly?
        - id: ch03-b03
          speaker: narrator
          text: >-
            The money-lender visited the farmer and congratulated him. He spoke so cleverly, pretending that he already knew all about the good fortune, that soon the farmer was telling him the whole tale. But he kept back the secret way of blowing the conch. Simple as he was, he was not foolish enough to reveal that.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Still, the money-lender meant to get the conch one way or another. He was wicked enough to let nothing stop him. He waited until a favorable opportunity came, then stole the conch from the farmer.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He blew the conch in every way he could think of and nearly burst himself trying. Nothing happened, and at last he had to admit that he could not discover the secret. Yet he would not give up. He went back to the farmer and spoke as coolly as if he had done nothing wrong.
        - id: ch03-b06
          speaker: money_lender
          text: >-
            Listen. I have your conch, but I cannot use it. You do not have it, so you cannot use it either. Nothing can move until we make a bargain. I will return the conch and never stop you from using it, but only on one condition. Whatever it gives you, it must give me twice as much.
        - id: ch03-b07
          speaker: farmer
          text: >-
            Never! That would put us right back where we started!
        - id: ch03-b08
          speaker: money_lender
          text: >-
            Not at all. You will still get your share! Do not be a dog in the manger. If you receive everything you want, why should you care whether I am rich or poor?
    - id: ch04
      title: Twice as Much
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The farmer hated the thought of doing the money-lender any good, but in the end he had no choice and gave in. From then on, whenever the conch gave the farmer something, the money-lender received twice as much. Knowing that troubled the farmer day and night. He could take no pleasure in anything he gained.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Then a season came with so little rain that the farmer's crops began to wither. He blew the conch and wished for a well to water them. At once, a well appeared. But the money-lender got two beautiful new wells.
        - id: ch04-b03
          speaker: narrator
          text: >-
            That was more than the farmer could bear. He brooded and brooded, until at last a bright idea came to him. He snatched up the conch and blew it loudly.
        - id: ch04-b04
          speaker: farmer
          text: Oh, Ram! I wish to be blind in one eye!
    - id: ch05
      title: The Farmer's Victory
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            In a twinkling, the farmer lost the sight of one eye. The money-lender, of course, became blind in both. As he tried to find his way between his two new wells, he fell into one and drowned.
        - id: ch05-b02
          speaker: narrator
          text: >-
            And so, as this true story tells us, a farmer once got the better of a money-lender. But he could do it only by losing one of his eyes.
