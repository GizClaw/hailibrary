  chapters:
    - id: ch01
      title: The Horoscope and the Ruined Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            As a soothsayer lay dying, he wrote out the horoscope of his second son, Gangazara. He left the horoscope to the young man as his only property, while the eldest son received the whole estate. Gangazara studied what his father had written.
        - id: ch01-b02
          speaker: gangazara
          text: >-
            Is this all I was born to have? My father's predictions never failed while he lived. Every last word came true. And now he has written, “Poverty from birth.” That is not the worst of it. “Ten years in prison.” Then comes, “Death on the seashore.” I must die far from home, away from my friends and family. But the strangest line says, “Some happiness afterward.” How can there be happiness after death? I cannot understand it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After his father's funeral rites were finished, Gangazara said farewell to his elder brother and set out for Benares. He traveled through the middle of the Deccan so that he would stay far from either coast. Weeks and then months passed before he reached the Vindhya mountains.
        - id: ch01-b04
          speaker: narrator
          text: >-
            There he had to cross a sandy plain. For two days he saw no living thing and no growing plant. He had brought just enough food for that crossing, but now the last of it was gone. He also carried a chombu, which he kept full whenever he found a flowing stream or a broad tank. The desert heat had emptied it. Now there was not a morsel in his hand and not a drop to drink. He turned in every direction, but the desert stretched on without any sign of escape.
        - id: ch01-b05
          speaker: gangazara
          text: >-
            My father's prophecy has never been wrong. I am meant to survive this and die beside the sea. So I will keep walking until I find water for my dry throat.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That thought gave him strength to hurry on. At last, a ruined well appeared in his path. Gangazara tied his usual string to the neck of his chombu and lowered it, hoping to gather a little water. The vessel went partway down and stopped. A voice rose from the well.
        - id: ch01-b07
          speaker: tiger_king
          text: >-
            Please save me! I am the king of tigers, and I am starving down here. I have eaten nothing for three days. Fortune has brought you to me. Help me now, and you will have my help for the rest of your life. Do not fear me because I hunt for prey. Once you have saved me, I will never touch you. Please pull me out.
        - id: ch01-b08
          speaker: gangazara
          text: >-
            Should I lift him out? He is hungry enough to make me his first mouthful. No, he cannot. My father's prophecy cannot fail. I must die on a seashore, not in a tiger's jaws.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Gangazara decided to trust the prophecy. He told the Tiger King to grip the vessel tightly, and the tiger did so. Then Gangazara drew him up little by little. When the tiger reached the top of the well and felt firm ground beneath him, he kept his promise and did Gangazara no harm. Instead, he walked around his rescuer three times. Then he stood humbly before him.
        - id: ch01-b10
          speaker: tiger_king
          text: >-
            You gave me back my life. I will never forget this day or the kindness of your hands. I swear that I will stand beside you in every calamity. Whenever trouble comes, think of me. I will be there and do everything I can for you.
        - id: ch01-b11
          speaker: tiger_king
          text: >-
            Let me tell you briefly how I fell in. Three days ago, I was roaming in that forest when I saw a goldsmith. I chased him, and when he knew he could not escape my claws, he jumped into this well. I followed. I landed on the first ledge, but he fell to the fourth and lowest one. A starving serpent lives on the second ledge, and a starving rat is on the third.
        - id: ch01-b12
          speaker: tiger_king
          text: >-
            When you lower your vessel again, the serpent and rat may beg you to release them. The goldsmith may ask as well. Listen to me as you would to your closest friend. Never help that miserable man, even though he is human like you. Goldsmiths cannot be trusted. You may put more faith in a tiger who sometimes eats men, a serpent whose bite can turn your blood cold, or a rat who causes endless trouble in a house. Do not free the goldsmith. If you do, one day you will regret it.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The hungry Tiger King left without waiting for an answer. Gangazara thought again and again about the tiger's eloquent speech and marveled at how fluently he had spoken. But Gangazara was still desperately thirsty, so he lowered the vessel once more. This time the serpent caught it.
        - id: ch01-b14
          speaker: serpent_king
          text: >-
            Protector, please lift me out. I am the king of serpents and the son of Adisesha. My father is in agony because I have disappeared. Set me free, and I will always remember what you did. I will remain your servant and help you in every way I can throughout your life. Please help me. I am dying here.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Gangazara remembered again that he was fated to die on the seashore, and he pulled the serpent up. Like the tiger, the Serpent King went around him three times. Then he bowed low before him.
        - id: ch01-b16
          speaker: serpent_king
          text: >-
            You are my life-giver. I must call you my father, because you have given me a second birth. Three days ago, I was warming myself in the morning sun when a rat ran past me. I chased him, and he fell into this well. I followed, but the rat landed on the third ledge while I fell onto the second. Now I am going to see my father. Whenever you face trouble, think of me. I will come to your side and help in every way I can.
        - id: ch01-b17
          speaker: narrator
          text: >-
            With that, the serpent glided away in a zigzag and vanished. By now, the soothsayer's poor son was nearly dead from thirst. He lowered the vessel a third time. The rat seized it, and Gangazara pulled the little animal up at once, without stopping to consider.
        - id: ch01-b18
          speaker: rat_king
          text: >-
            You saved my life, my benefactor! I am the king of rats. Whenever calamity comes, think of me, and I will hurry to help you. My sharp ears heard everything the Tiger King said about the goldsmith on the fourth ledge. Sadly, it is all true. You must never trust a goldsmith. Do not save that man as you saved us, or you will suffer for it. I am hungry now, so let me go.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The Rat King said farewell and ran away. Gangazara considered the warning that all three animals had given him.
        - id: ch01-b20
          speaker: gangazara
          text: >-
            What harm can there be in helping him? Why should I not set him free too?
        - id: ch01-b21
          speaker: narrator
          text: >-
            He lowered the vessel again. The goldsmith caught it and called for help. Gangazara had no time to waste, for thirst was overcoming him. He pulled the man out, and the goldsmith immediately began to tell his story.
        - id: ch01-b22
          speaker: gangazara
          text: Wait a moment.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Gangazara lowered the vessel for the fifth time and finally drank. Even then, he feared that someone else might still be trapped below and might call for his help. Once his thirst was quenched, he listened to the goldsmith.
        - id: ch01-b24
          speaker: manikkasari
          text: >-
            My friend and protector, those animals told you a great deal of nonsense about me. I am glad you ignored them. I am starving, so please let me leave. My name is Manikkasari. I live on East Main Street in Ujjaini, twenty kas south of here. You will pass that way when you return from Benares. Do not forget to visit me on your journey home, so that I may show you how gratefully I remember your help.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Manikkasari took his leave, and Gangazara continued north after his strange adventures at the well.
    - id: ch02
      title: The Crown and the Betrayal
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Gangazara reached Benares and lived there for more than ten years. In all that time, he forgot the tiger, serpent, rat, and goldsmith. Then thoughts of home and his brother suddenly filled his mind.
        - id: ch02-b02
          speaker: gangazara
          text: >-
            I have gained enough merit through my religious observances. It is time to go home.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He soon began his return journey. Mindful of his father's prophecy, he followed the same inland road he had taken ten years before. When he reached the ruined well, the memories came rushing back. He thought of the Tiger King, meaning to test whether the animal had kept faith with him.
        - id: ch02-b04
          speaker: narrator
          text: >-
            In a moment, the Tiger King came running. He carried a great crown in his mouth, and its diamonds glittered more brightly than the rays of the sun. The tiger laid it at his life-giver's feet. He put aside all his pride and bent before Gangazara like a pet cat beneath his hand.
        - id: ch02-b05
          speaker: tiger_king
          text: >-
            My life-giver, why did you forget your poor servant for so many years? I am glad there is still a place for me in your thoughts. I can never forget the day your kind hands saved my life. I own several jewels of smaller worth, but this crown is the finest of them all. I brought you one precious thing that you can carry away and sell in your own country.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Gangazara turned the crown over and over, studying it from every side. He counted the gems, then counted them again. If he separated the diamonds from the gold and sold them at home, he thought, he would become one of the richest men alive. He said farewell to the Tiger King. After the tiger vanished, Gangazara thought of the Serpent King and the Rat King. Each appeared in turn, bringing a present for the man who had saved him. They greeted Gangazara, exchanged a few words with him, and took their leave.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Gangazara was overjoyed by the faithfulness of the animals. As he continued south, another thought came to him.
        - id: ch02-b08
          speaker: gangazara
          text: >-
            These beasts have helped me faithfully, so Manikkasari should be even more faithful. I need no gift from him. But this crown fills too much of my bundle, and robbers may notice it on the road. Ujjaini lies on my way, and Manikkasari asked me to visit him when I returned. I will ask him to melt the crown and separate its diamonds from the gold. Surely he can do that much for me. Then I can wrap the stones and the ball of gold in my rags and continue home.
        - id: ch02-b09
          speaker: narrator
          text: >-
            With those thoughts, he reached Ujjaini. He asked where the goldsmith lived and found the house easily. Manikkasari seemed delighted to see the man who had saved him from the pit of death ten years earlier, despite every warning from the tiger, serpent, and rat.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Gangazara showed him the crown, explained how the Tiger King had given it to him, and asked him to separate the gold and diamonds. Manikkasari agreed. He invited his friend to rest, bathe, and eat while the work was done. Gangazara always observed his religious ceremonies carefully, so he went straight to the river to bathe.
        - id: ch02-b11
          speaker: narrator
          text: >-
            But how had the crown reached the tiger's jaws? A week earlier, the king of Ujjaini had gone hunting with all his attendants. Without warning, the Tiger King sprang from the woods, seized the king, and disappeared.
        - id: ch02-b12
          speaker: narrator
          text: >-
            When the attendants told the prince that his father was dead, the prince wept and wailed. He announced that anyone who brought him news of his father's killer would receive half the kingdom.
        - id: ch02-b13
          speaker: narrator
          text: >-
            From Gangazara's story, Manikkasari knew perfectly well that a tiger had killed the king, not any human hunter. Even so, he decided to accuse Gangazara of the murder. He hid the crown under his clothes and hurried to the palace. There he placed it before the prince and claimed that the killer had been found.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The prince examined the crown and immediately gave Manikkasari half the kingdom. Then he asked where the murderer was.
        - id: ch02-b15
          speaker: manikkasari
          text: >-
            He is bathing in the river. I can tell your soldiers exactly what he looks like.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Four armed soldiers rushed to the river. Gangazara sat there in meditation, unaware of the fate closing around him. They bound his hands and feet and carried him before the prince. The prince turned his face away from the man he believed had murdered his father and ordered the soldiers to cast him into a dungeon. Within moments, poor Gangazara was shut in darkness without even knowing why.
    - id: ch03
      title: Ten Years in the Dungeon
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The dungeon was a cellar deep underground, enclosed by massive stone walls. Anyone accused of a crime worthy of death was left there to breathe their last without food or water. Gangazara understood what kind of place it was.
        - id: ch03-b02
          speaker: gangazara
          text: >-
            Blaming the goldsmith or the prince will do nothing now. We are all children of fate, and we must obey her commands. This is only the first day of my father's prophecy, and so far it is true. But how can I spend ten years here? With nothing to keep me alive, I may last a day or two. Ten years is impossible. I must die. Before death comes, I will think of my faithful animal friends.
        - id: ch03-b03
          speaker: narrator
          text: >-
            In that dark underground cell, he called the three friends to mind. At once, the Tiger King, Serpent King, and Rat King gathered with their armies in a garden near the prison. At first they did not know how to reach him. After taking counsel, they decided to dig a passage from a ruined well into the dungeon.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The Rat King gave the order, and his whole army set to work. With their teeth, they bored through the earth for a long distance, all the way from the ruined well to the prison wall. There they had to stop. Ordinary rat teeth could make no mark on those hard stones. The bandicoots were specially summoned for the task. Their stronger teeth cut a narrow opening in the wall, just wide enough for a rat to pass in and out without trouble. At last, the way into the cell was open.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The Rat King entered first. He mourned the misfortune of his protector and promised to keep him supplied with food.
        - id: ch03-b06
          speaker: rat_king
          text: >-
            Whenever you find bread or sweetmeats in a house, each of you must carry whatever you can to our benefactor. If clothes are hanging there, cut off pieces and soak them in water. Bring him the wet cloth, and he can squeeze out water to drink. The bread and sweets will be his food.
        - id: ch03-b07
          speaker: narrator
          text: >-
            When he had given these orders, the Rat King left Gangazara. His subjects obeyed, and from then on they brought the prisoner food and water.
        - id: ch03-b08
          speaker: serpent_king
          text: >-
            I grieve to see you in such trouble. The Tiger King feels the same, but his body is too large to pass through the tunnel as we did. The Rat King has promised to feed you. Now we will do what we can to win your freedom.
        - id: ch03-b09
          speaker: serpent_king
          text: >-
            From this day, we will command our armies to torment this kingdom. Deaths from tigers and snakebites will increase a hundredfold, and they will keep increasing until you are released. Whenever you hear people nearby, shout loudly enough for them to hear you.
        - id: ch03-b10
          speaker: serpent_king
          text: >-
            Tell them, “The wretched prince imprisoned me on a false charge of killing his father. A tiger killed him. Since the day I was locked away, these disasters have struck the kingdom. If I am freed, I can save everyone with my power to heal poisoned wounds and with my incantations.” Someone may carry those words to the king. Once he hears, you may gain your liberty. Keep your courage.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The Serpent King comforted his protector, gave that advice, and departed. From then on, the tigers and serpents obeyed their kings. Together they killed as many people and cattle as they could. Each day, someone was carried off by a tiger or bitten by a snake.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Months passed, and then years. All that time, Gangazara remained in the black cellar, never once feeling the light of the sun. The rats kept coming through their secret passage. They faithfully fed him with the bread and sweetmeats they gathered from the houses, and they brought wet scraps of cloth so that he could squeeze out water. Those rich morsels changed his body until it became red, stout, huge, and heavy. In this way, the full ten years foretold in his horoscope passed away.
    - id: ch04
      title: The Kingdom Set Right
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            On the final evening of the tenth year, a serpent entered the princess's bedchamber and sucked away her life. She died, and she was the king's only daughter. The king summoned every healer of snakebite. He promised half his kingdom and the princess's hand to anyone who could restore her to life.
        - id: ch04-b02
          speaker: narrator
          text: >-
            One royal servant had heard Gangazara calling from the dungeon several times. Now he reported those cries to the king.
        - id: ch04-b03
          speaker: royal_servant
          text: >-
            Your Majesty, a prisoner in the underground cell has been shouting that he can heal poisoned wounds and save your people if he is released.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The king immediately ordered his servants to examine the cell. When they opened it, there was Gangazara, still sitting inside after ten complete years. The onlookers could not understand how a man left in that place without food or drink had remained alive so long. They whispered to one another that he must be some kind of divine being. Still wondering and talking among themselves, they led him out of the dungeon and brought him before the king.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The moment the king saw Gangazara, he fell to the ground. The prisoner's appearance had such majesty and grandeur that it overwhelmed him. Ten years in the deep underground cell had left a strange brightness upon Gangazara's body. His hair had to be cut away before anyone could even see his face. The king begged forgiveness for his old wrong and pleaded with him to revive the princess.
        - id: ch04-b06
          speaker: gangazara
          text: >-
            Within one hour, bring me every body of every person and animal in your kingdom that has not yet been burned or buried. I will bring them all back to life.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Those were the only words Gangazara spoke. Every minute, carts arrived loaded with the bodies of people and cattle. The story says that graves were even opened and those buried one or two days earlier were carried in to be restored.
        - id: ch04-b08
          speaker: narrator
          text: >-
            When all were gathered, Gangazara filled a vessel with water. He thought only of the Serpent King and Tiger King as he sprinkled the water over every body. They all rose as if waking from deep sleep and returned to their own homes. The princess also came back to life.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The king's joy had no limit. He cursed the day he had imprisoned Gangazara and blamed himself for trusting a goldsmith. Instead of the half he had promised, he offered Gangazara his daughter's hand and the whole kingdom. Gangazara refused them both. He asked the king to gather every subject in a wood near the town.
        - id: ch04-b10
          speaker: gangazara
          text: >-
            There I will summon all the tigers and serpents and give them one command.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The king obeyed, and at dusk the people of the whole town assembled in the wood. Gangazara sat without speaking for a moment. Then he called the Tiger King and Serpent King to mind. Both kings came before him with all their armies behind them. As soon as the people saw the tigers, fear swept through the gathering and they began to run. Gangazara called them back, assured them that no harm would come to them, and made them stop.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Evening cast a gray light over them. Gangazara's body had the color of a pumpkin, and holy ashes covered him. Tigers and snakes bowed at his feet. To the watching people, he had the true majesty of the god Gangazara. Some wondered who else could command such vast armies of tigers and serpents with one word.
        - id: ch04-b13
          speaker: townsman_1
          text: Perhaps it is only magic. Commanding them is not such a great wonder.
        - id: ch04-b14
          speaker: townsman_2
          text: >-
            But he restored cartloads of dead bodies to life. That proves he truly is Gangazara.
        - id: ch04-b15
          speaker: gangazara
          text: >-
            My children, why have you brought such suffering upon the poor people of Ujjaini? Tell me why. From this day on, you must end your attacks.
        - id: ch04-b16
          speaker: tiger_king
          text: >-
            Why did this base king imprison your honor merely because a goldsmith accused you of killing his father? Every hunter told him that a tiger carried his father away. I was death's messenger. I struck the blow, and afterward I gave the crown to you. The prince made no inquiry at all before he locked you up. How can anyone expect justice from such a foolish king? Unless he rules by a better standard of justice, our destruction will continue.
        - id: ch04-b17
          speaker: narrator
          text: >-
            The king heard everything. He cursed the day he had believed the goldsmith. He struck his head, tore his hair, wept over his crime, and begged pardon a thousand times. He swore that from that day forward he would rule justly. The Tiger King and Serpent King promised that their armies would keep peace as long as justice prevailed. Then they departed.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Manikkasari fled for his life, but the king's soldiers caught him. Gangazara, in his generosity, pardoned the goldsmith. By then, Gangazara's word ruled over everyone, and all the people returned home.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The king again urged Gangazara to marry his daughter. This time Gangazara agreed, but he would not marry her yet. First, he wished to see his elder brother. After that, he would return for the princess. The king consented, and Gangazara left the city that same day to journey home.
    - id: ch05
      title: Happiness Afterward
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Without realizing it, Gangazara took the wrong road. It led him close to the seashore. By chance, his elder brother was traveling toward Benares along that very route. The brothers recognized one another while they were still far apart. They ran into each other's arms and stood there for a time, almost senseless with joy.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Gangazara's happiness was so great that he died from joy.
        - id: ch05-b03
          speaker: narrator
          text: >-
            His elder brother was a devoted worshipper of Ganesa. That day was Friday, which was sacred to the god. He carried Gangazara's body to the nearest temple of Ganesa and called upon the deity. Ganesa appeared and asked what he wanted.
        - id: ch05-b04
          speaker: ganesa
          text: What do you ask of me?
        - id: ch05-b05
          speaker: elder_brother
          text: >-
            My poor brother has died, and here is his body. Please guard it while I worship you. If I leave him anywhere else, devils may steal the body while I am away. When I finish the rites, I will burn him.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The elder brother entrusted the body to Ganesa and went away to prepare the ceremonies. Ganesa placed it in the care of his Ganas and ordered them to watch it closely. Instead, they devoured it.
        - id: ch05-b07
          speaker: narrator
          text: >-
            When the elder brother finished his worship, he asked the god to return Gangazara's body. Ganesa summoned the Ganas. They came forward blinking, afraid of their master's anger. The god was furious, and the elder brother was angry too. When the body could not be produced, he spoke bitterly to Ganesa.
        - id: ch05-b08
          speaker: elder_brother
          text: >-
            Is this what I receive for believing in you so deeply? You cannot even give me back my brother's body.
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: >-
            Ganesa was deeply ashamed by those words. Through his divine power, he gave the elder brother a living Gangazara in place of the dead body. In this way, the soothsayer's second son returned to life.
        - id: ch05-b10
          speaker: narrator
          text: >-
            The brothers talked for a long time about everything that had happened to each of them. Then they traveled together to Ujjaini. Gangazara married the princess and later succeeded to the throne. He ruled for many years and bestowed many benefits upon his elder brother.
        - id: ch05-b11
          speaker: narrator
          text: >-
            And so the horoscope was fulfilled in every part.
