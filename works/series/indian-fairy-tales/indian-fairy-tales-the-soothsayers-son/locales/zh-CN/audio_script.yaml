audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    gangazara:
      display_name: 恒伽扎拉
      tts:
        delivery: 善良虔诚，身处险境仍沉着笃定
        timbre: 清朗温厚，成熟稳重
        pace: 适中，思索时稍慢
        pitch: 中
    tiger_king:
      display_name: 虎王
      tts:
        delivery: 威严豪迈，对恩人谦恭而忠诚
        timbre: 粗沉有力，带着低吼般的共鸣
        pace: 适中
        pitch: 低
    serpent_king:
      display_name: 蛇王
      tts:
        delivery: 恭谨冷静，谋划时清楚果断
        timbre: 低柔清晰，略带冷冽感
        pace: 舒缓
        pitch: 中低
    rat_king:
      display_name: 鼠王
      tts:
        delivery: 机敏热诚，说话直接而利落
        timbre: 轻细明亮，富有活力
        pace: 适中偏快
        pitch: 中高
    manikkasari:
      display_name: 摩尼迦萨里
      tts:
        delivery: 表面殷勤圆滑，言语中藏着算计
        timbre: 清楚偏薄，略显油滑
        pace: 适中偏快
        pitch: 中
    king:
      display_name: 乌贾因国王
      tts:
        delivery: 年轻威严，悔恨时激动而诚恳
        timbre: 洪亮端正
        pace: 适中
        pitch: 中低
    servant:
      display_name: 王宫仆人
      tts:
        delivery: 恭敬谨慎，禀报时简明
        timbre: 朴实清楚
        pace: 适中
        pitch: 中
    townsman_1:
      display_name: 百姓甲
      tts:
        delivery: 敬畏惊叹，语气笃信
        timbre: 平实明亮
        pace: 适中
        pitch: 中
    townsman_2:
      display_name: 百姓乙
      tts:
        delivery: 谨慎怀疑，说到证据时十分肯定
        timbre: 平稳清晰
        pace: 适中
        pitch: 中
    elder_brother:
      display_name: 兄长
      tts:
        delivery: 虔诚重情，悲痛时仍不失直率
        timbre: 温厚沉稳
        pace: 舒缓
        pitch: 中低
    ganesa:
      display_name: 象头神
      tts:
        delivery: 庄严沉着，羞愧后果断补救
        timbre: 深厚宏亮
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 命盘与废井
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一位占卜师临终前，为次子恒伽扎拉写下一张命盘。这就是留给他的全部财产，家业则尽数归了长子。恒伽扎拉看着命盘，心里怎么也平静不下来。
        - id: ch01-b02
          speaker: gangazara
          text: 难道我来到世上，只能受这样的命吗？父亲的预言一向字字应验。可我的命盘先说“生来贫穷”，再说“身陷囹圄十年”，还说我会远离亲友，“死于海岸”。最奇怪的是，最后竟还有一句：“此后还会享福。”死后又能享什么福？我真是猜不透。
        - id: ch01-b03
          speaker: narrator
          text: 父亲的丧礼全部办完以后，他辞别兄长，动身去贝拿勒斯。为了远离两边海岸，他特意从德干高原中部穿过。一星期又一星期，一个月又一个月，他不停地走，终于来到温迪亚山脉。穿过那片荒野时，前面又是一望无际的沙原，既不见生灵，也没有草木。他得在里面走上两天。随身的一点干粮吃尽了，遇到溪流和池塘总会装满的铜壶，如今也被沙漠的酷热耗空。手里没有一口食物，壶里没有一滴水。无论望向哪里，四周都只有沙，他看不见任何出路。
        - id: ch01-b04
          speaker: gangazara
          text: 父亲的话从没落空。我既然注定死在海边，就不会死在这里。我一定能熬过去。
        - id: ch01-b05
          speaker: narrator
          text: 这个念头让他重新振作。他加快脚步，只想在什么地方找到一点水，润一润干得冒火的喉咙。终于，上天在路上送来一口废井。他想着井里也许还能汲到水，就解下那根一直系在铜壶颈上的长绳，把壶慢慢放了下去。铜壶降到半途忽然停住，井里也传来一个声音。
        - id: ch01-b06
          speaker: tiger_king
          text: 救救我吧！我是虎王，已经饿了三天，眼看要死了。是命运把您送来的。只要您今天救我，我一生都会帮助您。别怕我这头猛兽。您给我第二次生命，我绝不会伤害您。请把我拉上去吧！
        - id: ch01-b07
          speaker: narrator
          text: 恒伽扎拉犹豫起来。若把饿极了的老虎拉上来，它会不会张开大嘴，先拿自己充饥？可他转念又想，父亲的预言从未失准，自己该死在海岸，不会葬身虎口。于是他让虎王紧紧抱住铜壶，一点点将它拉出井来。虎王双脚重新踏上安稳的地面，果然信守诺言，没有伤他。它绕着恩人走了三圈，收起全部威风，恭敬地站到他面前。
        - id: ch01-b08
          speaker: tiger_king
          text: 赐我性命的恩人，我永远忘不了今天。以后您遇见任何灾难，只要想起我，我一定赶来尽力相助。三天前，我在林中追一个金匠。他逃不掉，便跳进这口井，我也跟着跳了下来。我落在第一层，他却在最下面的第四层。第二层有一条快饿死的蛇，第三层还有一只老鼠。您再放铜壶，它们和金匠都会求救。蛇和老鼠都可以救，那个金匠却万万救不得。哪怕相信吃人的老虎、咬人的毒蛇和闯祸的老鼠，也别相信金匠。您若放他出来，早晚会后悔。
        - id: ch01-b09
          speaker: narrator
          text: 饥饿的虎王把话说完，不等恒伽扎拉回答便走了。恒伽扎拉一遍遍回想它那番滔滔不绝的劝告，很佩服这头老虎的口才。可赞叹归赞叹，他的干渴仍没有解除，只好又把铜壶放进井中。
        - id: ch01-b10
          speaker: serpent_king
          text: 我的救命恩人，请拉我上去！我是蛇王，也是阿底舍沙的儿子。父亲正为我的失踪痛苦不已。您若救我，我愿永远做您的仆人，记住这份恩情，一生竭力帮助您。我快死了，请发发慈悲吧！
        - id: ch01-b11
          speaker: narrator
          text: 恒伽扎拉再次想起命盘所说的海岸之死，便放心把蛇王拉了上来。蛇王也像虎王一样绕他走了三圈，又伏在地上向他致谢。
        - id: ch01-b12
          speaker: serpent_king
          text: 您让我重获生命，我该称您为父亲。三天前，我晒着晨光，看见一只老鼠跑过，就追了上去。它掉在井的第三层，我却摔在第二层。现在我要回去见父亲了。以后无论您遇到什么难处，只要想起我，我便会来到身边。
        - id: ch01-b13
          speaker: narrator
          text: 蛇王扭着弯弯曲曲的身子滑走，转眼便没了踪影。占卜师这个可怜的儿子已经渴得快要断气，又第三次放下铜壶。这次是老鼠紧紧抱住了壶。他连一句话也来不及多问，立刻把这只可怜的小动物救了上来。
        - id: ch01-b14
          speaker: rat_king
          text: 您是我的再生父母！我是鼠王。往后您若遭难，只要想起我，我就来相助。我的耳朵很灵，虎王说的话我全听见了。金匠确实不可信，您千万别救他，不然一定会吃苦头。现在我饿得厉害，先告辞了。
        - id: ch01-b15
          speaker: narrator
          text: 鼠王也跑走了。三位兽王一再警告他不要放出金匠，恒伽扎拉却反复想着，帮助这个人究竟有什么错？同是落难，自己为什么不能救他？于是他第四次放下铜壶，把开口求救的金匠拉了上来。可他自己已经渴得受不了，片刻也耽搁不起，只让对方稍等。第五次放下铜壶以后，他终于喝足了水。他还担心井底留着别的人，又等了一会儿，确认再没有求救声，这才坐下来听金匠说话。
        - id: ch01-b16
          speaker: manikkasari
          text: 亲爱的朋友，那些畜生说了我多少坏话！幸好您没听它们的。我叫摩尼迦萨里，住在乌贾因城东大街。从这里往南二十卡斯，正好是您从贝拿勒斯返乡的路线。回去时请一定来找我，让我报答您的救命之恩。眼下我快饿死了，请让我先走吧。
        - id: ch01-b17
          speaker: narrator
          text: 金匠说完便匆匆告辞离开。经历了井边这些奇事，恒伽扎拉也重新收拾行装。他没有忘记原来的目的地，又独自踏上漫长的道路，继续朝北方的贝拿勒斯走去。
    - id: ch02
      title: 忠诚的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 恒伽扎拉终于来到贝拿勒斯，一住就是十多年，渐渐把老虎、蛇、老鼠和金匠都忘得干干净净。十年清修以后，故乡和兄长的模样忽然一齐涌上他的心头。
        - id: ch02-b02
          speaker: gangazara
          text: 我已经靠这些年的修行积下功德。现在该回家了。
        - id: ch02-b03
          speaker: narrator
          text: 他仍照原路返回，好避开父亲预言中的海岸。来到废井旁，旧事一下全想起来了。他先在心中呼唤虎王，想看看这位朋友还记不记得自己。片刻以后，虎王飞奔而来，嘴里衔着一顶硕大的王冠。冠上钻石闪耀，连日光都仿佛暗了。它把王冠放在恩人脚边，像家猫一样温顺地让他抚摸。
        - id: ch02-b04
          speaker: tiger_king
          text: 恩人啊，这么多年，您怎么把可怜的仆人忘了？好在心里还留着我的位置。您的莲花妙手救我的那一天，我永远记得。我有几件不值钱的珠宝，这顶王冠是其中最好的，便拿来送您。它既贵重又好携带，您带回故乡处置吧。
        - id: ch02-b05
          speaker: narrator
          text: 恒伽扎拉拿起王冠，翻过来又翻过去，把宝石数了一遍又一遍。只要拆开上面的黄金和钻石，带回故乡卖掉，他就会成为天下最富有的人。他辞别虎王。等虎王走远，又在心中呼唤蛇王和鼠王。它们也先后带着各自的礼物赶来，照例问候恩人，交谈一番以后才离去。三只兽类都这样忠诚，恒伽扎拉满心欢喜，带着礼物继续向南走。
        - id: ch02-b06
          speaker: gangazara
          text: 野兽尚且知恩图报，摩尼迦萨里更不会忘恩。我不需要他的礼物，只是整顶王冠放在包袱里太占地方，也容易招来强盗。乌贾因正好顺路，我请他熔开王冠，分出钻石和黄金。这样裹进破布，带回家就方便了。
        - id: ch02-b07
          speaker: narrator
          text: 他一路盘算着来到乌贾因，马上打听金匠的住处，很快就找到了。十年前，三位兽王轮番阻止，恒伽扎拉仍把摩尼迦萨里从死亡之井里拉了出来。如今见这位恩人站在自家门口，金匠显得高兴极了。恒伽扎拉拿出虎王所赠的王冠，讲清楚它的来历，请他帮忙分开黄金和钻石。摩尼迦萨里爽快答应，又让朋友先休息片刻，去沐浴、进餐。恒伽扎拉一向严守宗教礼仪，听完便径直去了河边。
        - id: ch02-b08
          speaker: narrator
          text: 那么，虎王从哪里得来这顶王冠呢？原来一星期前，乌贾因国王带着所有猎人出外狩猎。虎王突然冲出树林，一口叼住国王，转眼消失了。侍从回去告诉王子，他的父亲已经身亡。王子悲痛得又哭又喊，随后向全国宣布，无论是谁，只要能带来杀父凶手的消息，他就把半个王国作为赏赐。
        - id: ch02-b09
          speaker: narrator
          text: 摩尼迦萨里听过王冠的来历，明明知道国王死于虎口，不是哪个猎人下的手，却还是决定把恒伽扎拉诬作凶手。他把王冠藏进衣服底下，飞奔到王宫，来到王子面前，说凶手已经抓住，又把王冠摆在他眼前。王子拿起来仔细察看，当场把半个王国赏给金匠，随后追问凶手在哪里。
        - id: ch02-b10
          speaker: manikkasari
          text: 他正在河里沐浴。那个人的模样是这样的……
        - id: ch02-b11
          speaker: narrator
          text: 四名全副武装的士兵马上赶到河边。恒伽扎拉正坐在那里冥想，对悬在头顶的灾祸毫不知情，转眼便被捆住手脚，押到王子面前。王子认定眼前站着杀父仇人，厌恶地转开脸，看也不肯看他一眼，便命令士兵把人投入地牢。可怜的婆罗门直到被推进黑暗的牢狱，仍不知道这一切究竟是为了什么。
    - id: ch03
      title: 黑牢里的十年
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那是一间深埋地下的黑暗石室，四面全用坚硬的石块砌成。犯了死罪的人一旦被推进去，再也得不到食物和水，只能在里面咽下最后一口气。恒伽扎拉莫名其妙地落到这样的地方，想起自己的遭遇，心里却没有责怪谁。
        - id: ch03-b02
          speaker: gangazara
          text: 现在怪金匠或王子都没有用。我们都是命运的儿女，只能听她号令。父亲预言的牢狱之灾，从今天开始应验了。可是没有水和食物，我顶多活一两天，怎能撑过十年？死亡来到以前，让我想一想忠诚的朋友吧。
        - id: ch03-b03
          speaker: narrator
          text: 他刚想起三位兽王，虎王、蛇王和鼠王便带着各自的军队，聚到地牢附近的一座花园。它们一时也不知该怎么办，商量了一阵，才决定从一口废井的内侧挖出地道，一直通往牢房。鼠王马上下令。鼠群用牙齿不停刨土，挖过很长一段，终于碰到监牢外墙，却怎么也咬不动坚硬的石块。鼠王只好专门调来牙齿更硬的印度大鼠。它们在石墙上咬开一道小缝，刚好够普通老鼠轻松来去，地道这才完全打通。
        - id: ch03-b04
          speaker: narrator
          text: 鼠王第一个钻进牢房，先安慰受难的恩人，又转身向群鼠下令。
        - id: ch03-b05
          speaker: rat_king
          text: 无论哪家做了甜点或面饼，你们都要尽力拿些来送给恩人。看见挂着的衣服，就咬下一片，浸湿以后带过来。恩人可以挤出水喝，面饼和甜点可以充饥。
        - id: ch03-b06
          speaker: narrator
          text: 鼠王交代完毕，便辞别恒伽扎拉。群鼠服从命令，从此不断把面饼、甜点和浸湿的布片送进地牢，让恩人有饭可吃，也能挤出水来喝。蛇王随后也钻进牢房看望他。
        - id: ch03-b07
          speaker: serpent_king
          text: 您遭逢灾难，我十分难过。虎王也很同情您，只是身躯太大，不能钻进来，才托我转告。鼠王负责食物，我们要设法救您。今天起，我和虎王会命令军队袭扰这个国家。死于毒蛇和老虎的人畜，会一天天增加，直到您获释。听见附近有人时，您就高声告诉他们，王子听信诬告，把您当成弑君凶手，其实老国王死于虎口。这些灾祸也从您入狱那天开始。只要放您出去，您便能凭医治毒伤的本领和咒语救下众人。消息传到国王耳中，您就有机会重获自由。请一定振作起来。
        - id: ch03-b08
          speaker: narrator
          text: 蛇王安慰恩人，叫他鼓起勇气，这才告辞。随后，虎蛇大军果然奉两位兽王的命令联手行动，尽可能多地杀死人畜。每天都有人被老虎叼走，也有人遭毒蛇咬死。几个月过去了，几年也过去了。恒伽扎拉独自坐在黑暗石室里，一丝阳光也照不到身上，全靠老鼠送来的面包屑、甜点和水活着。日复一日，这些食物竟把他养得皮肤红润、身躯肥硕，走动都很困难。命盘说的整整十年，就这样一天不差地过去了。
        - id: ch03-b09
          speaker: narrator
          text: 第十年最后一天的傍晚，一条蛇钻进公主寝宫，吸走她的生命。公主咽下最后一口气。她是国王唯一的女儿，国王立刻召来所有能够医治蛇伤的人。他许下半个王国和公主的婚约，要奖给能使女儿复生的人。一名王宫仆人曾好几次听到恒伽扎拉在地牢里的呼喊，这时便想起那番话，赶来向国王禀报。
        - id: ch03-b10
          speaker: servant
          text: 陛下，地牢里那个人曾说，只要放他出来，他就能医治毒伤，也能用咒语救人。
        - id: ch03-b11
          speaker: narrator
          text: 国王立刻命人打开牢门查看。恒伽扎拉果然还坐在黑牢里。众人不明白一个没有水和食物的囚犯怎样活过十年，低声猜测他一定是神明。他们一路议论着，把人带到国王面前。国王一见恒伽扎拉，立刻俯伏在地，被他庄严的气象震慑住了。十年囚禁非但没有毁掉他，反而给他的身躯添上异样的光彩。他的头发长得遮住整张脸，人们得先替他剪掉，才看得清面容。国王恳求他宽恕从前的过错，又求他救活公主。
        - id: ch03-b12
          speaker: gangazara
          text: 一个时辰之内，把国内所有将死和已死、还没火化或下葬的人畜尸身，全都送来。我会让他们复生。
    - id: ch04
      title: 群尸复生
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一车又一车的人畜尸身接连运来，每隔片刻便到一批。据说人们甚至掘开坟墓，把一两天前埋下的死者也挖出来，送来等待复生。等所有尸身备齐，恒伽扎拉端起一壶清水，心中只想着蛇王和虎王，把水洒遍群尸。死去的人畜纷纷站起，仿佛刚从一场沉睡里醒来，随后各自走回家去。公主也恢复了生命。
        - id: ch04-b02
          speaker: narrator
          text: 国王欢喜得无法形容。他诅咒自己当初下令囚禁恒伽扎拉的那一天，也痛恨自己竟会轻信一个金匠。他愿把女儿嫁给恩人，还要献出整个王国，不再只是先前答应的一半。恒伽扎拉既不接受婚约，也不接受王国，只请国王先把所有臣民召集到城外一片树林里。
        - id: ch04-b03
          speaker: gangazara
          text: 到了那里，我会召来所有老虎和毒蛇，向它们下一道总令。
        - id: ch04-b04
          speaker: narrator
          text: 黄昏时，全城百姓都聚到了树林。恒伽扎拉默默静坐片刻，在心中呼唤虎王和蛇王。两位兽王听见召唤，立即率领各自的大军赶来。树林里顿时布满老虎和毒蛇。人们一看见成群的猛兽，吓得转身便逃。恒伽扎拉连忙告诉大家，它们不会伤人，这才把四散的人群留了下来。
        - id: ch04-b05
          speaker: narrator
          text: 暮色灰蒙蒙的。恒伽扎拉被十年牢狱养得皮肤红润，远远看去像南瓜的颜色，浑身又厚厚洒满圣灰。庞大的虎群和蛇群全都匍匐在他脚下。这一切使他显出恒伽扎拉神一般的威严。百姓望着眼前的情景，悄声议论起来。
        - id: ch04-b06
          speaker: townsman_1
          text: 除了恒伽扎拉神，还有谁一句话就能号令这么庞大的虎蛇之军？
        - id: ch04-b07
          speaker: townsman_2
          text: 这也可能是魔法，不算什么。真正能证明他是神明的，是他救活了整车整车的尸体。
        - id: ch04-b08
          speaker: gangazara
          text: 我的孩子们，你们为什么折磨乌贾因这些可怜的百姓？告诉我原因，从今以后不要再伤害他们。
        - id: ch04-b09
          speaker: tiger_king
          text: 这个卑劣的国王只凭金匠一句话，就认定尊驾杀了他的父亲，还把您关进牢里，凭什么？所有猎人都说过，老国王是被老虎叼走的。我就是奉命带给他死亡的使者，是我咬断他的脖子，也是我把王冠献给您。王子不作任何查问，立刻将您下狱。这样愚蠢的国王，怎么主持公道？除非他从此公正治国，否则我们不会停止毁灭。
        - id: ch04-b10
          speaker: narrator
          text: 国王听完，又一次诅咒自己轻信金匠的那一天。他捶打脑袋，撕扯头发，为自己的罪过痛哭哀号。他一千次请求宽恕，发誓从这天起一定秉公治国。虎王和蛇王也立下誓言，只要这个国家还有公道，它们便不再伤害百姓，随后带着军队离去。摩尼迦萨里见势不妙，转身逃命，却被国王的士兵抓住。如今恒伽扎拉的话最有分量，他仍宽厚地饶恕了金匠。风波平息，众人这才各自回家。
    - id: ch05
      title: 海岸上的死亡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王再次恳求恒伽扎拉迎娶公主。恒伽扎拉终于答应，却不愿马上成婚。他想先回故乡看望兄长，之后再来乌贾因迎娶公主。国王同意了这个安排，他便在当天离开城池，踏上归乡之路。
        - id: ch05-b02
          speaker: narrator
          text: 不料恒伽扎拉无意间走错道路，不得不经过一片海岸。他的兄长也恰好沿着这条路前往贝拿勒斯。兄弟二人远远望见彼此，马上认了出来。他们飞奔上前，紧紧拥抱在一起。两人欢喜得几乎失去知觉，相拥着久久一动不动。可恒伽扎拉心中的喜悦实在太强烈，竟因此死在兄长怀里。命盘中“死于海岸”的话，就这样应验了。
        - id: ch05-b03
          speaker: narrator
          text: 兄长是象头神虔诚的信徒。那天正好是星期五，是象头神格外神圣的日子。他把弟弟的尸身带到最近的一座象头神庙，向神明大声呼求。象头神果然现身，问他想要什么。
        - id: ch05-b04
          speaker: elder_brother
          text: 我可怜的弟弟死了，这就是他的尸身。请您替我保管片刻，让我先完成对您的礼拜。若把他留在别处，我离开时恶魔也许会抢走尸体。等仪式结束，我便来火化他。
        - id: ch05-b05
          speaker: narrator
          text: 兄长说完，把弟弟的尸身交给象头神，自己去准备敬奉神明的礼仪。象头神又把尸身托付给手下的伽那众，吩咐它们务必仔细看守。谁知伽那众不但没有照看，反而把尸体吃得干干净净。
        - id: ch05-b06
          speaker: narrator
          text: 兄长做完礼拜，回来向象头神讨要弟弟的尸身。象头神这才召来伽那众。它们站到主人面前，一个个不住眨眼，生怕主人发怒。尸身却始终交不出来。象头神勃然大怒，兄长也气愤极了，终于忍不住尖刻地责问神明。
        - id: ch05-b07
          speaker: elder_brother
          text: 我这样虔诚信奉您，换来的就是这种回报吗？您竟然连我弟弟的尸身都还不了！
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: 这句责问使象头神惭愧万分。既然手下再也交不出原来的尸体，神明便施展神力，把一个活生生的恒伽扎拉交到兄长面前，代替那具已经被吃掉的尸身。于是，占卜师的次子又从死亡中回来了。
    - id: ch06
      title: 预言全部应验
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 恒伽扎拉复活以后，兄弟二人长谈了许久，互相讲述分别以后各自经历的奇事。随后，他们并肩上路，一同回到乌贾因。恒伽扎拉在那里迎娶公主，后来继承了这个王国的王位。他统治了很长时间，不但施行善政，也给兄长许多恩惠。于是，命盘上最后那句“此后还会享福”，连同生来贫穷、入狱十年和死于海岸的预言，全都一一应验了。
