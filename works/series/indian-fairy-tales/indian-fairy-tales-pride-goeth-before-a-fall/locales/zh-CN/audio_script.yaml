audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 郑重而亲切，带着学者讲述旧日故事的从容
        timbre: 温暖清晰，沉稳而有书卷气
        pace: 舒缓，论述转折处稍作停顿
        pitch: 中低
    merchant_leader:
      display_name: 聪明的布商
      tts:
        delivery: 机敏沉着，唱暗语时自然从容
        timbre: 清朗结实
        pace: 适中
        pitch: 中
    merchant_one:
      display_name: 布商甲
      tts:
        delivery: 平实自然，像在日常谈生意
        timbre: 温和清晰
        pace: 适中
        pitch: 中
    merchant_two:
      display_name: 布商乙
      tts:
        delivery: 简洁利落，回答时不露声色
        timbre: 稳实清晰
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 林中的三个强盗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个村子里住着十个布商。他们不管去哪里做生意，总是十个人结伴同行。有一回，他们到远方卖货，赚了许多钱，正往家赶。村子附近有一片浓密的森林。清早，他们走进林子，却不知道那里住着三个恶名昭彰的强盗。
        - id: ch01-b02
          speaker: narrator
          text: 等布商们走到森林深处，三个强盗突然拦在前面。他们手里拿着刀剑和棍棒，逼布商交出全部财物。十个布商虽然人多，却都没有兵器，只好任由强盗摆布。强盗把钱财拿得干干净净，连他们身上的衣裳也剥走了，每人只留下一块遮身布，不过一拃宽、一肘长。
        - id: ch01-b03
          speaker: narrator
          text: 三个强盗觉得，自己用三个人制服了十个人，还抢走了所有东西，实在威风。他们像三位君王一样坐在布商面前，又下了一道命令，要众人跳完舞才准回家。布商们已经只剩一小块遮身布，强盗却还不肯放过他们。他们想到自己的命运，不由得暗自悲叹。
    - id: ch02
      title: 歌中的暗语
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 十个布商里，有一个人十分聪明。他想着大家遭的灾祸，也想着眼下非跳不可的舞，再看看那三个强盗坐在草地上神气十足的样子，渐渐有了主意。强盗认定布商早就吓破了胆，竟把兵器全放在地上。众人开始起舞，聪明的布商便领头跳了起来。照这种舞的规矩，领舞的人要唱歌，其余的人跟着拍手踏脚。于是，他开口唱道。
        - id: ch02-b02
          speaker: merchant_leader
          text: 我们是恩蒂人，他们是埃里思人。每个埃里思人，若围上埃诺人，还剩一个人。嗒，嗒伊，咚，嗒丁嘎纳。
        - id: ch02-b03
          speaker: narrator
          text: 三个强盗都没念过书，只当他唱的是平常舞曲。从表面听来，这确实就是一首舞曲。领舞人起初离他们很远。他把歌唱了两遍，布商们才一边跳，一边慢慢靠近。可这些人都受过行商的训练，听懂了歌里的意思。
        - id: ch02-b04
          speaker: narrator
          text: 原来，商人在顾客面前商量价钱时，会说一种谜语似的暗语。比如，一个商人会这样问同伴。
        - id: ch02-b05
          speaker: merchant_one
          text: 这块布卖多少钱？
        - id: ch02-b06
          speaker: merchant_two
          text: 这块布卖恩蒂卢比。
        - id: ch02-b07
          speaker: narrator
          text: “恩蒂卢比”其实就是十卢比。顾客若没学过这种行话，根本听不懂他们在说什么。在商人的暗语里，“埃里思”是三，“恩蒂”是十，“埃诺”是一。那首歌是在提醒大家，他们有十个人，强盗只有三个。每三个布商围住一个强盗，九个人就能把他们按倒，最后一个人正好腾出手来，捆住强盗的手脚。
    - id: ch03
      title: 三袋大米
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三个强盗还沉浸在胜利里，嘴里嚼着蒌叶和烟草，得意地坐在那里。他们既不懂歌里的秘密，也没看穿舞者的打算。这时，领舞人第三次唱起那首歌。
        - id: ch03-b02
          speaker: merchant_leader
          text: 我们是恩蒂人，他们是埃里思人。每个埃里思人，若围上埃诺人，还剩一个人。嗒，嗒伊，咚，嗒丁嘎纳。
        - id: ch03-b03
          speaker: narrator
          text: “嗒，嗒伊，咚”才刚唱出口，还没等最后的“嗒丁嘎纳”落下，布商们便分成三组，每组三个人，一起扑向一个强盗。剩下的正是领舞人。他抓起一大块六肘长的布，撕成长长的窄条，把三个强盗的手脚全捆了起来。刚才还像君王一样威风的强盗，这下彻底服软，只能像三袋大米似的在地上滚来滚去！
        - id: ch03-b04
          speaker: narrator
          text: 十个布商拿回了自己的全部财物，又拿起强盗的刀剑和棍棒防身。等他们回到村里，便常把这场奇遇讲给亲朋好友听，逗得大家开心不已。
