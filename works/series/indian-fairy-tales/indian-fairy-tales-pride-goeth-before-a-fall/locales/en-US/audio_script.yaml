  chapters:
    - id: ch01
      title: Robbers in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In a certain village lived ten cloth merchants who always traveled together. Once, after a long journey, they started home with a great deal of money from selling their goods.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Near their village stood a thick forest. The merchants reached it early one morning, never knowing that three notorious robbers lived there.
        - id: ch01-b03
          speaker: narrator
          text: >-
            While the merchants were still deep among the trees, the robbers blocked their path. They held swords and heavy clubs and ordered the travelers to put down everything they had.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The merchants carried no weapons. Though there were ten of them against only three robbers, they had no choice but to obey. The robbers took their money, their goods, and even the clothes they wore. Each merchant was left with only a tiny loincloth, a span wide and a cubit long.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The robbers could think of nothing but their triumph. They had defeated ten men and taken everything from them. So they sat on the grass like three kings and commanded the merchants to dance before going home.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The merchants grieved over their bad fortune. Everything was gone except those scraps of cloth, yet even that did not satisfy the robbers. Now their victims had to dance for them as well.
    - id: ch02
      title: A Song in Secret Words
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One of the ten merchants was very clever. He thought about the disaster that had overtaken them, the dance they were being forced to perform, and the grand way the three robbers sat before them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Then he noticed something important. Certain that the merchants were too frightened to resist, the robbers had laid their weapons on the ground.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The merchants began to dance, and the clever man took the lead. In such a dance, the leader sings while the others keep time with their hands and feet. This was the song he gave them.
        - id: ch02-b04
          speaker: clever_merchant
          text: |-
            We are enty men,
            They are erith men.
            If each erith man
            Surround eno man,
            Eno man remains.
            Tâ, tai, tôm, tadingana.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The robbers had no education, so they heard nothing more than an ordinary dance song. And in one way, that was exactly what it was.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The leader began some distance away. He sang the song twice before the dancers started moving toward the robbers. His companions had understood him at once, because their work as traders had taught them the secret meaning of his words.
    - id: ch03
      title: The Traders' Hidden Meaning
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            You see, when two traders talked about the price of something in front of a customer, they used a kind of riddle language.
        - id: ch03-b02
          speaker: first_trader
          text: How much does this cloth cost?
        - id: ch03-b03
          speaker: second_trader
          text: It costs enty rupees.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Enty meant ten. Unless the customer knew the traders' language, there was no way to understand the real price.
        - id: ch03-b05
          speaker: narrator
          text: >-
            In that secret language, erith meant three, enty meant ten, and eno meant one. So the clever merchant's song carried a plan. There were ten merchants and only three robbers. Three merchants could leap on each robber, making nine men in all, while the one who remained tied the robbers' hands and feet.
    - id: ch04
      title: The Robbers Brought Low
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The three thieves were still glorying in their victory. They understood neither the song nor the dancers' purpose and sat there proudly, chewing betel and tobacco.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Meanwhile, the leader began the song a third time. The words “Tâ, tai, tôm” had just left his lips. Before he could finish “tadingana,” the merchants split into groups of three, and each group sprang upon one thief.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The one man left over was the leader himself. He tore a large piece of cloth, six cubits long, into narrow strips and used them to bind the robbers' hands and feet.
        - id: ch04-b04
          speaker: narrator
          text: >-
            How completely the robbers were humbled then! They rolled on the ground like three sacks of rice.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The ten merchants took back everything that belonged to them. Then they armed themselves with their enemies' swords and clubs and continued home.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Once they reached their village, the merchants often entertained their friends and relatives by telling the story of their adventure.
