  chapters:
    - id: ch01
      title: A NEGLECTED STABLE
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I had been on the ground only a few seconds when the log hut pulled my attention away from Miss Laura. No sound came from it. Still, strange smells filled the air, and I was too uneasy to lie still. Fleetfoot felt it too. He pawed and whinnied, staring toward the hut instead of after Mr. Harry.
        - id: ch01-b02
          speaker: miss_laura
          text: >-
            Joe, what's troubling you and Fleetfoot? Why can't you stand still? Is there a stranger nearby?
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            She peered out of the buggy as she spoke. I knew something was wrong somewhere, though I couldn't tell what it was. I stretched up against the buggy step and licked her hand. Then I barked as if asking her pardon and ran around to the other side of the hut. I found a door there, but it was tightly closed. A plank propped it so firmly that all my scratching did no good. I was determined to get inside. I leaped against the door, tore at the wood, and bit the plank until Miss Laura came to help.
        - id: ch01-b04
          speaker: miss_laura
          text: >-
            You'll only find rats in that tumbledown place, Beautiful Joe. You never hurt rats, so I can't imagine why you want to go in. But you're a sensible dog, and you usually have a reason for insisting. I'll let you have your way.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            She pulled the plank away, opened the rough door, and looked inside. There were no windows. For a moment, the daylight through the doorway showed her nothing.
        - id: ch01-b06
          speaker: miss_laura
          text: Is anyone in here?
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            A low moan was the only answer.
        - id: ch01-b08
          speaker: miss_laura
          text: >-
            Oh, Joe, some poor creature is suffering. Let's find it.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            She stepped into that wet, filthy hut, holding her white dress up in both hands. I will never forget the pain and horror on her face. There were two rough stalls. In the first, a cow stood tied to the manger, with her calf lying beside her. If I hadn't seen that cow myself, I could never have believed an animal could become so thin. Her backbone stood up sharp and high. Her hip bones pushed far out, and her whole body had wasted away. Sores covered her sides, and the smell from the stall was terrible.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Miss Laura cried out in pity. Her face went pale. She dropped her dress, took a little penknife from her pocket, and hacked at the rope tying the cow to the manger until the poor creature could lie down. The very first thing the cow did was lick her calf, but the calf was dead. I had always thought Jenkins's cows were thin enough. Yet even he had never owned one that looked like this. Her head was the head of a skeleton, and her eyes had such a famished look that I turned away. I felt sick at heart when I thought how much she had suffered.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Once the cow lay down, the moaning stopped. It had come from her. Miss Laura dashed outside, gathered some grass, and carried it in. The cow ate gratefully, but very slowly. Almost all her strength was gone.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Miss Laura went into the second stall to see whether another creature was there. A horse had once lived in it. Now a lean, gaunt animal lay on the ground so still that he seemed dead. A heavy rope was knotted around his neck and fastened to the empty rack. Miss Laura stepped carefully between his feet and cut him loose. Then she went outside and called to him kindly. His ears moved a little. He lifted his head and tried to rise, but fell back. He tried once more, managed to stand, and staggered outside after her as she encouraged him. Then he collapsed on the grass.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            Fleetfoot stared as though he could hardly recognize the miserable creature as a horse. He had no sores like the cow, and he wasn't quite as thin. Yet I had never seen any animal look weaker or more distressed. Flies settled all over him, and Miss Laura had to keep driving them away. He was a white horse with strange, pale-colored eyes. Whenever he turned those eyes toward Miss Laura, she had to look away.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Miss Laura often cried when she saw sick and suffering animals, but this was too dreadful for tears. She simply hovered beside that poor horse, her face as white as her dress and an expression of fear in her eyes. And oh, how dirty he was. Until that moment, I would never have imagined that any horse could be allowed to come to such a condition.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Only a few minutes had passed when Mr. Harry came out of the house. He walked slowly at first, then ran when he saw Miss Laura.
        - id: ch01-b16
          speaker: mr_harry
          text: Laura! What are you doing?
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            He stopped beside the horse. He looked deeply sorrowful, but not surprised. He crushed a piece of paper in his hand and slipped it into his pocket.
        - id: ch01-b18
          speaker: mr_harry
          text: >-
            Barron has gone. What can we do for these animals? There's a cow in there too, isn't there?
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            He glanced through the hut door, then turned quickly back to her.
        - id: ch01-b20
          speaker: mr_harry
          text: Can you manage the drive home?
        - id: ch01-b21
          speaker: miss_laura
          text: Yes.
        - id: ch01-b22
          speaker: mr_harry
          text: Are you certain?
        - id: ch01-b23
          speaker: beautiful_joe
          text: He watched her anxiously.
        - id: ch01-b24
          speaker: miss_laura
          text: Yes, truly. What should I bring back?
        - id: ch01-b25
          speaker: mr_harry
          text: >-
            Tell Father that Barron ran away and left a pig, a cow, and a horse starving. There isn't a scrap of food here. Father will know what they need. I'll take you as far as the road.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Mr. Harry climbed into the buggy beside her. At the road, he lowered the bars.
        - id: ch01-b27
          speaker: mr_harry
          text: >-
            Keep straight ahead. You'll reach the open road soon, and nothing will hurt you. Joe will take care of you. I'll go back and heat some water.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            Miss Laura let Fleetfoot run as fast as he wished. We seemed to reach the yard within minutes, and Adele came out to meet us.
        - id: ch01-b29
          speaker: miss_laura
          text: Where is Uncle?
        - id: ch01-b30
          speaker: adele
          text: He has gone to the big meadow.
        - id: ch01-b31
          speaker: miss_laura
          text: And Auntie?
        - id: ch01-b32
          speaker: adele
          text: >-
            She had chills and a cold, so she went to bed to warm herself. She's asleep now. You mustn't go near her.
        - id: ch01-b33
          speaker: miss_laura
          text: Aren't any of the men nearby?
        - id: ch01-b34
          speaker: adele
          text: No, mademoiselle. They're all busy far away.
        - id: ch01-b35
          speaker: miss_laura
          text: >-
            Then please help me, Adele. We found a sick horse and cow. What can I take them?
        - id: ch01-b36
          speaker: beautiful_joe
          text: Miss Laura hurried into the house as she spoke.
        - id: ch01-b37
          speaker: adele
          text: Almost every animal likes bran mash.
        - id: ch01-b38
          speaker: miss_laura
          text: >-
            Good! That's exactly what they need. Please pack everything for the mash. I'd like vegetables for the cow too. Bring carrots, turnips, anything you have, even some you've prepared for tomorrow's dinner. Then run to the barn for a little hay, corn, and oats. We'll return again, so we don't need much now. But hurry. Those poor animals are starving. Do you have milk for the pig? Put some in a covered tin kettle.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            For the next few minutes, Miss Laura and Adele flew around the kitchen. Then we started back. I was wheezing badly and completely out of breath, so Miss Laura took me into the buggy. I had to sit on the seat beside her. The bottom and the whole back of the buggy were packed with food for the poor sick animals.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            As we entered the road, we met Mr. Wood. He laughed at the carrot tops waving above the dashboard.
        - id: ch01-b41
          speaker: mr_wood
          text: Are you carrying off the whole farm?
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            Miss Laura told him what had happened. His face became very grave, and he climbed in beside her. Soon we reached the lonely road again. Mr. Harry was waiting by the gate.
        - id: ch01-b43
          speaker: mr_harry
          text: >-
            Why did you come back, Laura? You'll wear yourself out. This is no place for someone as sensitive as you.
        - id: ch01-b44
          speaker: miss_laura
          text: I hoped I could help somehow.
        - id: ch01-b45
          speaker: mr_wood
          text: >-
            You can. Go sit inside, and Harry and I will come to you when we need cheering. Harry, what have you done so far?
        - id: ch01-b46
          speaker: mr_harry
          text: >-
            I gave them a little water and built a good fire. I doubt the cow will survive, but I think we can save the horse. I tried to move the cow outside. She can't get up.
        - id: ch01-b47
          speaker: mr_wood
          text: >-
            Leave her where she is. Once she has food, her strength may return. Now, what did you bring? Why, bless you, child, you remembered everything, even salt. Harry, carry it into the house. We'll make the bran mash there.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            For more than an hour, they busied themselves over the animals. Afterward, they came inside and sat down. The Englishman's house was as untidy within as it was outside. It had no upstairs, only one large room divided by a dirty curtain. On one side stood a low bed heaped with clothes, along with a chair and washstand. On the other side were a stove and table. Miss Laura sat in a shaky rocking chair near a few hanging shelves that held dishes and books. Two or three small boxes had plainly been used as seats.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Pictures of grand houses and finely dressed ladies and gentlemen were pinned to the walls. Miss Laura said some of them showed noble people. Mr. Wood lowered himself onto a box.
        - id: ch01-b50
          speaker: mr_wood
          text: >-
            Well, I'm glad this particular nobleman is gone, if he really is one. In plain English, I'd call him a scoundrel. Did Harry show you the note he left?
        - id: ch01-b51
          speaker: miss_laura
          text: No, Uncle.
        - id: ch01-b52
          speaker: mr_wood
          text: Read it aloud. I want to hear it once more.
        - id: ch01-b53
          speaker: beautiful_joe
          text: Miss Laura began to read.
        - id: ch01-b54
          speaker: miss_laura
          text: >-
            Dear Mr. Wood, I greatly regret that I have suddenly been called away from Penhollow. I will therefore miss the pleasure of visiting you and settling my small account. I sincerely hope that my livestock, which I now turn over entirely to you, will repay you for any trifling expense you have had on my behalf. Perhaps it will please you to know that you have given some slight help to the son of one of England's noblest noblemen. With deepest respect, and with the hope that my livestock will be in good condition when you take possession, I remain devotedly yours, Howard Algernon Leduc Barron.
        - id: ch01-b55
          speaker: beautiful_joe
          text: Miss Laura let the paper fall.
        - id: ch01-b56
          speaker: miss_laura
          text: Uncle, did he mean to leave those animals to starve?
        - id: ch01-b57
          speaker: mr_wood
          text: >-
            Didn't you see there wasn't one wisp of hay in that shed? Those poor beasts were so tortured by hunger that they gnawed the wood where they stood tied. If he wanted me to know, he would have sent this note instead of leaving it on his table. It has no date, but I believe he's been gone five or six days.
        - id: ch01-b58
          speaker: mr_wood
          text: >-
            He's held a grudge against me ever since I lent him a hundred dollars. I don't know why. I defended him when other people wanted to drive him away. He meant for me to arrive and find every animal dead. He even tied a rope around the pig's neck. Harry, let's see to them again. I love animals too much to let any suffer. In this case, I'd pay another two hundred dollars to keep them alive and make Barron know it.
          emotion: angry
        - id: ch01-b59
          speaker: beautiful_joe
          text: >-
            Mr. Wood and Mr. Harry went back outside. Miss Laura remained in the room, turning the sheet over and over with horror on her face. The paper was filthy. After a while, she noticed something and carried it outdoors.
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            The poor horse was still lying on the grass, and I am sure he recognized her. He lifted his head to her. Now that part of his hunger had been satisfied, his face wore a completely different expression. Miss Laura stroked him and patted him for a while. Then she called her cousin over.
        - id: ch01-b61
          speaker: miss_laura
          text: Harry, please look at this.
        - id: ch01-b62
          speaker: mr_harry
          text: >-
            There's a crest showing through all these layers of dirt. It probably belongs to his family. We'll have the paper cleaned, and the crest may help us track down the villain. You want him punished, don't you?
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            Mr. Harry gave Miss Laura a sly little laugh. She pointed toward the suffering horse and answered frankly.
        - id: ch01-b64
          speaker: miss_laura
          text: Yes, I do.
        - id: ch01-b65
          speaker: mr_harry
          text: >-
            Then Father and I agree with you, my dear girl. If we can hunt Barron down, we will.
        - id: ch01-b66
          speaker: beautiful_joe
          text: As she turned away, he murmured to himself.
        - id: ch01-b67
          speaker: mr_harry
          text: >-
            She's a true Puritan. Gentle, sweet, and good, but stern too. The virtuous get their reward, and the wicked get their punishment. She was so charitable and so full of pity that she would weep if she saw a mouse caught in a trap, whether it was dead or bleeding.
        - id: ch01-b68
          speaker: beautiful_joe
          text: >-
            Miss Laura saw that Mr. Wood and Mr. Harry were doing everything possible for the cow and horse. She wandered down into a hollow behind the house, where the Englishman had kept his pig. Just then, that animal looked more like a greyhound than a pig. His legs seemed terribly long, and his nose had grown sharp. Hunger had made the horse and cow dull, but it had made the pig more lively. I thought perhaps he hadn't suffered as long as they had. Or perhaps he had begun with a greater store of fat to live on.
        - id: ch01-b69
          speaker: beautiful_joe
          text: >-
            Mr. Harry said that if he had been a girl, discovering that pig would have made him laugh and cry at once. The animal must have been asleep or worn out when we arrived, because he didn't make a sound at first. Soon afterward, he began yelling so loudly that Mr. Harry heard him and ran down to the pen. The pig was raging about, digging the earth with his snout, falling down, and struggling up again. A rope was tied around his neck, yet by some miracle he had escaped choking himself to death.
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            With his hunger eased, he stood gazing contentedly at his little trough, which was still half full of good, sweet milk. Mr. Harry explained that a starving animal must be fed like a starving person, only a little at a time. The Englishman's animals had always been poorly fed. Their stomachs had shrunk so much that they could not eat very much at once.
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            Miss Laura used a stick to scratch the poor pig's back, then returned to the house. Before long, Mr. Wood took us home. Mr. Harry stayed behind for the night with the sick animals, while his mother promised to send what he needed.
        - id: ch01-b72
          speaker: beautiful_joe
          text: >-
            Mrs. Wood felt better by the time we arrived, and the story of Barron's neglect horrified her. Later that evening, she sent one of the farmhands over with a whole box of things to make her darling boy comfortable. She also packed him some nice hot tea in a covered dish.
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            When the man returned, he told us that Mr. Harry refused to sleep in the Englishman's dirty house. Instead, he had hung a hammock beneath the trees. Even there, he would get very little rest. His lantern stood ready at his side, so he could jump up whenever the horse or cow needed him. It was a terribly lonely place for him, all alone out there among the woods. His mother said she would be glad when the sick animals were well enough to be driven to their own farm.
