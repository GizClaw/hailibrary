audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
    adele:
      display_name: 阿黛尔
      tts:
        delivery: 朴实热心，带着轻微的外乡口音
        timbre: 柔和明亮
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二十七章　被遗弃的马厩
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我落地才几秒钟，目光就从劳拉小姐身上转到了那间小木屋。屋里静得像死了一样，没有半点声音，空气中却满是古怪的气味。我心里越来越不安，怎么也趴不住。疾蹄也不对劲。它一边刨地，一边嘶鸣，眼睛没有追着哈里先生，反而一直盯着那座木头房子。
        - id: ch01-b02
          speaker: miss_laura
          text: >-
            乔，你和疾蹄怎么了？为什么都不能安静待着？附近是不是来了陌生人？
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            她从马车里探头张望。我知道一定出了问题，却不知道问题在哪儿。我把前爪搭上踏板，舔舔她的手，又叫了几声，算是请她原谅，随后跑到木屋另一边。那里有扇门，用一块木板牢牢顶着。我拼命抓挠，也推不动。可我非进去不可，于是朝门上撞，又撕又咬那块木板，直到劳拉小姐赶来帮我。
        - id: ch01-b04
          speaker: miss_laura
          text: >-
            美丽的乔，这座破屋里除了老鼠，什么也不会有。你又从来不伤老鼠，我真不知道你为什么非进去不可。不过，你一向是条懂事的狗，这么坚持总有道理。好吧，这次就依你。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            她挪开木板，拉开粗糙的门。屋里没有窗户，只有门口透进去的一点光，她一时什么也看不见。
        - id: ch01-b06
          speaker: miss_laura
          text: 有人在里面吗？
        - id: ch01-b07
          speaker: beautiful_joe
          text: 没有人回答，黑暗里只传出低低的呻吟。
        - id: ch01-b08
          speaker: miss_laura
          text: >-
            乔，里面有个可怜的生命正在受苦。咱们进去看看是谁。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            她双手提起白裙子，走进潮湿肮脏的木屋。我永远忘不了她当时的模样。那张脸上，全是痛苦和惊骇。屋里有两间粗陋的畜栏。第一间拴着一头母牛，身旁还躺着一头小牛。若不是亲眼见到，我绝不会相信一头牲口能瘦成这样。它的脊骨又高又尖，胯骨朝两旁突出，整个身子像是干瘪了。身侧长着疮，栏里的气味难闻极了。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            劳拉小姐怜惜地叫了一声，脸色一下变得惨白。她顾不上提裙子，从口袋里抓出小折刀，拼命割那根把母牛拴在食槽上的绳子。绳子终于断了，母牛总算能够卧下。它一躺下，先去舔身旁的小牛，可小牛早就死了。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            我从前觉得，詹金斯家的牛已经够瘦了，他却从没养出过这样一头。它的脑袋活像骷髅，眼睛里全是饥饿。我想到它受过的折磨，难受得转开了头。母牛卧下以后，呻吟声也停了，刚才原来一直是它在呻吟。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            劳拉小姐跑出去，抓了一把草送到它嘴边。母牛像是在谢她，慢慢吃了起来。它的力气似乎已经耗尽了。接着，劳拉小姐又去查看另一间畜栏。那里原本关着一匹马，如今地上只躺着一个瘦骨嶙峋的庞大身躯，看上去像是死了。它脖子上套着打了结的粗绳，绳子拴在空空的草架上。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            她小心地从马腿之间迈过去，割断绳子，又退出畜栏，柔声唤它。马的耳朵轻轻动了一下。它抬起头，想站起来，却又摔了回去。它再试一次，这才摇摇晃晃地站起身，跟着不断鼓励它的劳拉小姐走到外面。刚踏上草地，它便倒了下去。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            疾蹄瞪着这个凄惨的生灵，仿佛已经认不出它是什么。白马身上没有母牛那样的疮，也没有它那么瘦，可我从没见过哪只动物这样虚弱、这样痛苦。苍蝇不停落在它身上，劳拉小姐只好一次次赶走。它有一双颜色很浅的眼睛，每逢它望向劳拉小姐，她都会把脸转开。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            她平常看见动物生病受苦，总会掉眼泪，这回却没有哭。眼前的一切太可怕，连眼泪也不够用了。她只在那匹可怜的马身边来回照料，脸和白裙子一样苍白，眼里全是惊恐。那匹马实在太脏了。我从不知道，一匹马会落到这样的境地。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            这一切只用了几分钟。劳拉小姐刚把马带出来，哈里先生便从屋里走出来。他先走得很慢，一看见她，立刻跑了起来。
        - id: ch01-b17
          speaker: mr_harry
          text: 劳拉！你在做什么？
          emotion: surprised
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            他看见那匹马，停住了。脸上没有惊讶，只有深深的悲伤。他把手里的一张纸揉成一团，塞进口袋。
        - id: ch01-b19
          speaker: mr_harry
          text: >-
            巴伦已经走了。这些牲口该怎么办？里面还有一头牛，是不是？
        - id: ch01-b20
          speaker: beautiful_joe
          text: 哈里先生走到木屋门口，朝里面看了一眼，马上回过头。
        - id: ch01-b21
          speaker: mr_harry
          text: 你还能驾车回家吗？
        - id: ch01-b22
          speaker: miss_laura
          text: 能。
        - id: ch01-b23
          speaker: mr_harry
          text: 你确定？
        - id: ch01-b24
          speaker: beautiful_joe
          text: 他担心地看着她。
        - id: ch01-b25
          speaker: miss_laura
          text: 能，真的能。我要带什么回来？
        - id: ch01-b26
          speaker: mr_harry
          text: >-
            告诉父亲，巴伦逃走了，丢下一头快饿死的猪、一头牛和一匹马。这里一点食物也没有。父亲会知道该怎么办。我先送你到大路上。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            劳拉小姐坐上马车，哈里先生随后跳了上去。他送她到大路边，放下拦路的木杆。
        - id: ch01-b28
          speaker: mr_harry
          text: >-
            一直往前走，很快就到宽阔的大路了。那里没什么能伤害你，乔也会照看你。我先回去烧些热水。
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            回家路上，劳拉小姐任凭疾蹄想跑多快就跑多快。仿佛才过了几分钟，我们就进了院子。阿黛尔出来迎接。
        - id: ch01-b30
          speaker: miss_laura
          text: 姨父在哪儿？
        - id: ch01-b31
          speaker: adele
          text: 他去大草场了。
        - id: ch01-b32
          speaker: miss_laura
          text: 姨母呢？
        - id: ch01-b33
          speaker: adele
          text: >-
            她又冷又打寒战，上床取暖去了。现在已经睡着了，您可别去打扰她。
        - id: ch01-b34
          speaker: miss_laura
          text: 附近连一个男工也没有吗？
        - id: ch01-b35
          speaker: adele
          text: 没有，小姐。他们全在很远的地方忙活。
        - id: ch01-b36
          speaker: miss_laura
          text: >-
            那你来帮帮我吧，阿黛尔。我们发现了一匹病马和一头病牛。该给它们带些什么？
        - id: ch01-b37
          speaker: adele
          text: 差不多所有牲口都爱吃麸皮糊。
        - id: ch01-b38
          speaker: miss_laura
          text: >-
            太好了，正需要这个！请你装好做麸皮糊的材料，再给母牛拿些蔬菜。胡萝卜、芜菁，家里有什么就拿什么，明天晚餐预备的那些也拿一点。再跑一趟谷仓，取些干草、玉米和燕麦。不必太多，我们还会回来取。可得快些，那些可怜的牲口快饿死了。有没有给猪喝的牛奶？装进有盖的铁壶里。
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            接下来几分钟，劳拉小姐和阿黛尔在厨房里忙得团团转，随后我们再次出发。我已经跑得上气不接下气，喘得厉害，劳拉小姐便让我上车。车厢底下和后面全堆着食物，我只好坐在她身旁。马车刚上大路，我们便遇见伍德先生。他指着越过挡板、不住摇晃的胡萝卜缨，笑了起来。
        - id: ch01-b40
          speaker: mr_wood
          text: 你这是要把整座农庄都搬走吗？
          emotion: happy
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            劳拉小姐只说了几句话，他的脸立刻沉下来，坐到了她身旁。没多久，我们又回到那条偏僻的小路。哈里先生正在门口等着。
        - id: ch01-b42
          speaker: mr_harry
          text: >-
            你怎么又回来了？这样会把你累垮的。这种地方不适合你这样心思细腻的姑娘。
        - id: ch01-b43
          speaker: miss_laura
          text: 我想自己也许能帮上一点忙。
        - id: ch01-b44
          speaker: mr_wood
          text: >-
            当然能。你先进屋坐着。等哈里和我需要有人给我们打气，就去找你。哈里，你已经做了什么？
        - id: ch01-b45
          speaker: mr_harry
          text: >-
            我给它们喂了一点水，又生起一炉旺火。母牛恐怕很难熬过去，马应该救得活。我试着把母牛弄到外面，可它根本动不了。
        - id: ch01-b46
          speaker: mr_wood
          text: >-
            别再折腾它。先给它一点食物，力气会慢慢回来的。你们都带了什么？
        - id: ch01-b47
          speaker: beautiful_joe
          text: 伍德先生开始从马车上往下搬东西。
        - id: ch01-b48
          speaker: mr_wood
          text: >-
            这孩子真周到，什么都想到了，连盐也没忘。哈里，把东西拿进屋，我们来做麸皮糊。
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            他们忙着照料牲口，过了一个多小时才进屋坐下。英国人的屋里和屋外一样乱。房子没有楼上，只有一间大屋，中间扯着一道脏帘子，把屋子隔成两半。一边放着低矮的床，床上堆满衣服，旁边是椅子和盥洗架。另一边有炉子、桌子，还有劳拉小姐坐着的一把摇摇晃晃的摇椅。墙上挂着几块搁板，摆了些碗碟和书。地上还有两三个小木箱，显然一直被人当凳子坐。
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            墙上钉着几幅画，画里有宏伟的宅邸，也有穿华服的绅士淑女。劳拉小姐说，其中有些人是贵族。伍德先生在一个木箱上坐下来。
        - id: ch01-b51
          speaker: mr_wood
          text: >-
            这位特别的贵族走了，我倒很高兴，前提是他真算贵族。要用老实话说，我只会叫他恶棍。哈里把他的信给你看了吗？
        - id: ch01-b52
          speaker: miss_laura
          text: 没有，姨父。
        - id: ch01-b53
          speaker: mr_wood
          text: 大声念出来吧，我想再听一遍。
        - id: ch01-b54
          speaker: beautiful_joe
          text: 劳拉小姐展开信，念了起来。
        - id: ch01-b55
          speaker: miss_laura
          text: >-
            尊敬的伍德先生，鄙人深感遗憾，因突然有事，必须离开彭霍洛的住所，因此无法有幸登门，与您结清区区账目。鄙人谨将名下牲畜悉数转赠于您，衷心希望它们足以补偿您为鄙人承担的任何微薄开销。倘若得知自己曾为英国最高贵的贵族之一的后裔略尽绵力，能给您一丝宽慰，那么这份宽慰已经属于您。谨致最深切的敬意，并盼您接收牲畜时，它们仍然状况良好。亲爱的先生，鄙人永远忠诚于您。霍华德·阿尔杰农·勒迪克·巴伦。
        - id: ch01-b56
          speaker: beautiful_joe
          text: 劳拉小姐手里的信落了下来。
        - id: ch01-b57
          speaker: miss_laura
          text: 姨父，他就这样把那些牲口留下来活活挨饿吗？
          emotion: surprised
        - id: ch01-b58
          speaker: mr_wood
          text: >-
            你没看见吗？那破棚子里连一茎干草也没有。那些可怜的牲口饿得受尽折磨，连拴着它们的木头都让它们啃得伤痕累累。要是他真想让我知道，为什么不把信寄来，却把它留在桌上？信上没写日期，我看他已经走了五六天。
          emotion: angry
        - id: ch01-b59
          speaker: mr_wood
          text: >-
            自从我借给他一百美元，他就一直恨我。我也不知道为什么。别人要把他赶走时，还是我替他说话。他分明想让我来到这里，看到每一只牲口都已经死了。他甚至给猪的脖子也套了绳子。哈里，咱们再去看看它们。我太爱这些不会说话的牲口，不能让它们受苦。这一次，就算再花两百美元，只要能把它们救活，再叫巴伦知道，我也愿意。
          emotion: angry
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            他们走出屋子。劳拉小姐坐在那里，把那张纸翻来覆去地看，脸上带着恐惧。纸脏得厉害，可过了一会儿，她发现了什么，便拿着纸走到外面。躺在草地上的白马一定认出了她。它抬起头来。饥饿只得到一点缓解，它的眼神却已经大不相同。劳拉小姐摸摸它，又轻轻拍了拍。
        - id: ch01-b61
          speaker: miss_laura
          text: 哈里，请你看看这个，好吗？
        - id: ch01-b62
          speaker: mr_harry
          text: >-
            这是个纹章。隔着一层又一层的尘土和污垢，它还在发亮，大概是巴伦自己家族的。把它清理干净，我们就能凭它追查那个恶棍。你也想让他受罚，对不对？
        - id: ch01-b63
          speaker: beautiful_joe
          text: 哈里先生带着一点狡黠的笑看她。劳拉小姐朝受苦的白马做了个手势，坦率地回答。
        - id: ch01-b64
          speaker: miss_laura
          text: 是的，我想。
        - id: ch01-b65
          speaker: mr_harry
          text: >-
            好吧，亲爱的姑娘，父亲和我都站在你这边。只要能追到巴伦，我们一定去追。
        - id: ch01-b66
          speaker: beautiful_joe
          text: 劳拉小姐转身走开，哈里先生低声自语起来。
        - id: ch01-b67
          speaker: mr_harry
          text: >-
            她真是个清教徒。温柔、甜美、善良，却又严厉。善人应当得奖赏，恶人应当受惩罚。她的心多么仁慈，多么怜悯。只要看见一只老鼠困在夹子里，无论已死，还是流血，她都会落泪。
        - id: ch01-b68
          speaker: beautiful_joe
          text: >-
            劳拉小姐见伍德先生和哈里先生已经尽力照料牛和马，便走到屋后的一处洼地。英国人的猪就养在那里。眼前这头猪，与其说像猪，不如说像灵缇。它腿长嘴尖。饥饿让马和牛变得迟钝，却让它越发躁动。也许它受的苦没有那两个可怜的家伙多，也许只是因为原先更肥，身上的脂肪还能支撑它。
        - id: ch01-b69
          speaker: beautiful_joe
          text: >-
            哈里先生说，找到这头猪时，要是他是个姑娘，准会又哭又笑。我们刚来时，它不是睡着了，就是已经累瘫了，所以一点声音也没有。不久，它忽然尖叫起来。哈里先生跑过去，看见它在圈里发疯似的冲来冲去，用鼻子拱地，一会儿跌倒，一会儿又爬起来。脖子上还系着绳子，它竟没被勒死，简直是个奇迹。
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            现在它吃了些东西，正心满意足地望着小食槽，槽里还有半槽香甜的牛奶。哈里先生说，饿坏的牲口和饿坏的人一样，一次只能吃一点。不过，英国人的牲口一向吃得很差，胃已经缩小，本来也吃不了多少。
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            劳拉小姐找来一根小棍，替那头可怜的猪搔了一会儿背，随后回到屋里。没过多久，我们便和伍德先生一起回家。哈里先生留在那里，整夜守着生病的牲口。他母亲会给他送些东西，好让他舒服一些。
        - id: ch01-b72
          speaker: beautiful_joe
          text: >-
            我们到家时，伍德太太的病已经好了些。她听说巴伦怎样虐待那些牲口，吓得不得了。傍晚晚些时候，她让一个男工送去满满一箱东西，给她心爱的儿子使用，还用有盖的碟子装了热腾腾的好茶。
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            男工回来后说，哈里先生不肯睡在英国人的脏屋里，而是在树下吊起一张吊床。不过，他大概也睡不了多久。灯笼就放在身边，他随时准备跳起来照料马和牛。那片树林里只有他一个人，实在太僻静了。伍德太太说，等这些病畜能够赶回自家农庄，她才会放心。
