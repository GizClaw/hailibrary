  chapters:
    - id: ch01
      title: MRS. WOOD'S POULTRY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            After breakfast, Mrs. Wood tied on a large apron and went into the kitchen. She asked Adele for any scraps she had for the hens, but warned her not to give them anything salty. Adele handed her a dish of food. Then Mrs. Wood invited Miss Laura to see her chickens, and away we went toward the poultry house.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            On the way, we found Mr. Wood sitting on the tool-shed step, cleaning his gun. Miss Laura asked whether the dog was dead.
        - id: ch01-b03
          speaker: mr_wood
          text: Yes, he is.
        - id: ch01-b04
          speaker: beautiful_joe
          text: Miss Laura sighed.
        - id: ch01-b05
          speaker: miss_laura
          text: >-
            Poor creature. I'm sorry he had to die. Uncle, what is the kindest way to kill a dog? Sometimes an old dog has to be put out of the way.
          emotion: sad
        - id: ch01-b06
          speaker: mr_wood
          text: >-
            You can shoot a dog, or use poison. I shot Bruno from the head down into the neck. You have to aim just to one side of the top of the skull. Remind me later, and I'll show you a circular in the house. The American Humane Education Society in Boston publishes it to explain the proper, merciful way to kill animals.
        - id: ch01-b07
          speaker: mr_wood
          text: >-
            You know nothing about slaughtering animals, Laura, and I'm glad of it. A terrible amount of cruelty goes on, even among people who believe they're good. No kingdom could persuade me to have my lambs killed the way my father had his killed. The first time I saw it, I felt so dreadful that even a hanging couldn't make me feel worse now.
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            Hattie, you remember the white ox I told you about. When he had to be killed, Father sent for the butcher. I was only a boy, and I trembled at the thought of an animal I knew losing his life. That foolish butcher struck him eight times before he found the right spot. The ox bellowed and looked at my father with his great black eyes. I fainted.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Miss Laura turned away. Mrs. Wood followed her and began explaining what to do if she ever had to kill a cat.
        - id: ch01-b10
          speaker: mrs_wood
          text: >-
            Use cyanide of potassium, Laura. The other day, I had to kill a poor old sick cat for Mrs. Windham. We put half a teaspoon of pure cyanide in a long-handled wooden spoon and dropped it on the cat's tongue, as near her throat as we could. Poor pussy died within seconds.
        - id: ch01-b11
          speaker: mrs_wood
          text: >-
            I read something amusing about giving medicine to cats. They hate it, and those sharp teeth make it nearly impossible to force anything into their mouths. Instead, smear the medicine on a cat's sides. She'll lick it off herself. Isn't that clever? Well, here we are at one of the henhouses.
        - id: ch01-b12
          speaker: miss_laura
          text: Don't you keep all your hens together?
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            Only in winter. In spring, I split the flock. Some hens stay here, while the others live in little movable houses around the orchard. I carry food to each flock's own house every morning and evening. Even if the hens come all the way to my house, they know I won't feed them there. They also know there is no food between meals, so they stay where they belong. All day, they scratch and peck through the orchard. They destroy so many bugs and insects that keeping them there is well worth the trouble.
        - id: ch01-b14
          speaker: miss_laura
          text: Doesn't this flock try to join the other one?
        - id: ch01-b15
          speaker: beautiful_joe
          text: Miss Laura asked the question as she stepped inside the little wooden house.
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            No, they seem to understand. At first, I watch them closely. Soon they learn not to fly over either the garden fence or the orchard fence. They wander around the farm and find what they can. Hens have plenty of sense when you manage them properly. And I love them because they're such good mothers.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            I looked around the little house in surprise. It was better than some homes where poor people lived in Fairport. The walls were white and clean. So were the little ladders leading to the different roosts where the birds slept at night. Some roosts were narrow and round. Others were wide and flat. Mrs. Wood explained that the wide ones were for heavy birds called Brahmas. Large windows made nearly every part of the house as bright as the outdoors.
        - id: ch01-b18
          speaker: miss_laura
          text: Why, Auntie, I've never seen such a bright henhouse!
          emotion: surprised
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Mrs. Wood had been reaching into the darker, partly enclosed nesting area. She stood up, redder in the face than ever, and smiled proudly at the windows.
        - id: ch01-b20
          speaker: mrs_wood
          text: >-
            You won't find another henhouse in New Hampshire with windows this big. They always make me think of my mother's hens. How they would have loved a place like this! To them, it would have been a hen's paradise.
        - id: ch01-b21
          speaker: mrs_wood
          text: >-
            When I was a girl, we didn't understand that hens liked warmth and light. All winter, they sat in a dark coop. It got so cold that their combs froze stiff and the tops fell off, but we never stopped to think about it. If we'd had any sense, we would have noticed them sunning themselves on the compost heap on fine days. Then we'd have known they wanted light and warmth indoors, too. Those poor biddies were too cold to lay eggs all winter.
        - id: ch01-b22
          speaker: miss_laura
          text: You care a great deal about your poultry, don't you, Auntie?
        - id: ch01-b23
          speaker: mrs_wood
          text: >-
            I certainly do, and I have good reason. I'll show you Jenny, my brown Leghorn. In one year, she lays enough eggs to pay for all the newspapers I read to keep up with poultry matters. My hen money buys every bit of my clothing. Lately, I've even begun a bank account. I want to save enough to start a few stands of bees. So even if kindness didn't matter to me, treating my hens well would still pay because of the profit they bring.
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            Of course, they take plenty of work. Sometimes they get vermin. Then I grease them, dust them with carbolic acid, and try one of my many cures. I always keep ashes and dust wallows ready for them. When hens are sitting, I have to be very particular about their eggs. I also make sure each hen comes off her nest regularly for food and exercise.
        - id: ch01-b25
          speaker: mrs_wood
          text: >-
            There must be a hundred things to remember. But I always tell anyone who plans to raise poultry for money that proper care pays.
        - id: ch01-b26
          speaker: miss_laura
          text: >-
            I've noticed one thing. Your drinking fountains must be much better than the shallow water pans some people give their hens.
        - id: ch01-b27
          speaker: mrs_wood
          text: >-
            Those pans are filthy things. I would never use one. Dirty drinking water is one of the worst things for hens. Mine get water as clean as the water I drink. In winter, I heat it for them. If I pour it boiling into their fountains in the morning, it stays warm until night.
        - id: ch01-b28
          speaker: mrs_wood
          text: >-
            Even before I knew about drinking fountains, I wouldn't use shallow dishes. John made a better sort after we read about it. He bored a small hole in the side of a powder keg, about an inch below the top. Then he filled the keg with water and covered it with a round pan that was a little wider than the keg. Without moving the pan away, he turned the whole thing upside down.
        - id: ch01-b29
          speaker: mrs_wood
          text: >-
            Water flowed into the pan only until it reached the hole. No more came out until the hens drank some. Now let's go see my beautiful bronze turkeys. They need no houses at all. They sleep in the trees throughout the year.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            We found the flock, and Miss Laura admired the way their colors seemed to change. Some of the turkeys were very large, and I did not like them. The gobblers charged at me, making a dreadful sound deep in their throats.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Next, Mrs. Wood showed us some ducks she kept inside a yard. She was feeding them vegetables so their meat would have a clean flavor. Later, she planned to send them to market for a high price.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Every place she showed us was spotless.
        - id: ch01-b33
          speaker: mrs_wood
          text: >-
            No one can raise a large number of birds successfully without keeping their living places clean and comfortable.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            So far, we had seen only a few hens sitting on their nests.
        - id: ch01-b35
          speaker: miss_laura
          text: Where are all the hens? I'd like to see them.
        - id: ch01-b36
          speaker: mrs_wood
          text: >-
            They're on their way. Breakfast time has come, and my hens are as punctual as a clock. They always go out early and scratch around for a little food of their own first.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            As she spoke, Mrs. Wood stepped off the plank walk and looked toward the fields. Miss Laura burst out laughing. Far beyond the barns, the hens were coming. They saw Mrs. Wood waiting and must have thought they were late. They began running and flying, leaping over one another and stretching out their necks in great excitement. Some had their legs sticking straight out behind them. They looked very funny.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            They were a fine flock, mostly white, with shining feathers and bright eyes. They gobbled up the food Mrs. Wood scattered for them.
        - id: ch01-b39
          speaker: mrs_wood
          text: >-
            They think I've moved breakfast earlier. Tomorrow, they'll arrive much sooner. And some people still claim hens have no sense!
