audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 豪爽直率，说起农场轶事时生动风趣
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十八章　伍德太太的家禽
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            早餐一吃完，伍德太太便系上大围裙，走进了厨房。
        - id: ch01-b02
          speaker: mrs_wood
          text: 阿黛尔，有剩下的饭菜可以喂鸡吗？可别拿咸的东西给我。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            阿黛尔把一盘食物交给她。伍德太太又叫上劳拉小姐，要带她去看看鸡，我也跟着她们朝鸡舍走去。路上，我们遇见了伍德先生。他坐在工具房的台阶上，正在擦枪。
        - id: ch01-b04
          speaker: miss_laura
          text: 那条狗已经死了吗？
          emotion: sad
        - id: ch01-b05
          speaker: mr_wood
          text: 已经死了。
        - id: ch01-b06
          speaker: beautiful_joe
          text: 劳拉小姐叹了一口气。
        - id: ch01-b07
          speaker: miss_laura
          text: >-
            可怜的家伙，想到非杀掉它不可，我真难过。姨父，要杀死一条狗，怎样做最仁慈呢？有些狗年纪太大了，也该让它少受点苦，安静地死去。
          emotion: sad
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            可以开枪，也可以用毒药。我那一枪打在布鲁诺头和颈部相接的地方。开枪有一个准位置，就在头盖骨顶端稍偏一点儿。回头你提醒我，我拿家里那份说明给你看。那是波士顿的美国人道教育协会印的，专门教人怎样用仁慈的办法结束动物的生命。
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            劳拉，你没见过人们怎样屠宰动物，这反倒是好事。那里面的残忍实在太多了，偏偏有些动手的人还觉得自己挺善良。就算给我一个王国，我也不肯让人照我父亲从前的法子杀羊。我第一次看见羊被宰，这辈子都忘不掉。如今让我去看绞刑，恐怕也不会比那更难受。
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            哈蒂，你还记得我讲过那头白牛吧？它非死不可，父亲便请来了屠夫。那时我还小，一想到这头熟悉的牲口就要没命，浑身直发抖。那个蠢屠夫足足打了八下，才打中该打的地方。白牛痛得大叫，又转过那双乌黑的大眼睛望着我父亲。我看到这里，当场便昏了过去。
        - id: ch01-b11
          speaker: beautiful_joe
          text: 劳拉小姐不忍再听，转过身去。伍德太太跟着她往前走。
        - id: ch01-b12
          speaker: mrs_wood
          text: >-
            劳拉，往后若是不得不杀死一只猫，可以给它氰化钾。前几天，温德姆太太有只猫又老又病，我替她把那可怜的小东西送走了。我们把半茶匙纯氰化钾装进长柄木勺，尽量靠近喉咙，倒在猫舌头上。几秒钟以后，它就死了。
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            说到给猫喂药，我前些天读到一个很有意思的办法。猫不肯吃药，牙齿又尖，几乎没法硬塞进嘴里。可只要把药抹在它身体两边，它自己就会舔掉。这个主意不错吧？你瞧，我们到鸡舍了。准确些说，是到了其中一间。
        - id: ch01-b14
          speaker: miss_laura
          text: 姨母，您的鸡不是都养在一起吗？
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            只有冬天才把它们合在一起。到了春天，我就把鸡群分开。一群留在这里，另一群去果园，住在几间可以到处挪动的小鸡舍里。每天早晚，我都到各自的鸡舍喂食。它们知道，跑到我家也要不到吃的，便会留在自己的地盘。它们也明白，两顿饭之间没有加餐，所以一整天都在果园里啄啄刨刨。它们消灭的甲虫和虫子多得很，早把照料它们的工夫抵回来了。
        - id: ch01-b16
          speaker: miss_laura
          text: 这一群不会跑去跟另一群混在一起吗？
        - id: ch01-b17
          speaker: mrs_wood
          text: >-
            不会，它们像是都懂。刚分群时，我看紧一点儿。过不了多久，它们便知道，菜园的篱笆和果园的围栏都不能飞过去。它们可以在农场四处走，自己找东西吃。只要人照料得对，鸡很有头脑。我也喜欢它们做母亲的样子，个个都很尽心。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            说话间，我们已经走进小木屋。我四下一看，吃了一惊。这座鸡舍甚至比费尔波特一些穷人住的房子还好。墙壁又白又干净，通往栖架的小梯子也一样洁净。那些栖架形状各异，鸡到了晚上就睡在上面。有的细而圆，有的宽而平。伍德太太告诉我们，宽的那种是为身体沉重的婆罗门鸡准备的。大窗户把整间小屋照得透亮，几乎跟外面一样。
        - id: ch01-b19
          speaker: miss_laura
          text: 姨母，这鸡舍可真亮堂。我从来没见过这样的。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            伍德太太那时正俯身钻进半封闭的小隔间，鸡窝都在那里，光线比外面暗些。她直起身来，脸越发红润，望着窗户满意地笑了。
        - id: ch01-b21
          speaker: mrs_wood
          text: >-
            新罕布什尔州找不出第二座鸡舍，有这样大的窗户。每次看见它们，我都会想起母亲从前养的鸡，真希望那些鸡也住过这样的屋子。它们准会觉得自己到了鸡的天堂。我小时候，谁也不懂鸡喜欢光亮和暖和。整个冬天，它们都缩在黑洞洞的鸡笼里。天冷得鸡冠都冻硬了，冠尖还会脱落，可我们竟然从没细想过。
        - id: ch01-b22
          speaker: mrs_wood
          text: >-
            我们若是稍微用点心，就会发现晴天时鸡总爱站在堆肥堆上晒太阳。既然在外面喜欢阳光和热气，住在屋里当然也会喜欢。可怜的鸡冻成那样，冬天哪还肯给我们下蛋呢？
        - id: ch01-b23
          speaker: miss_laura
          text: 姨母，您对这些家禽真是上心，对吧？
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            那当然，我也应该上心。等会儿给你看看那只棕色来航鸡珍妮。它一年下蛋赚的钱，足够我订阅那些讲家禽饲养的报纸，学到最新的法子。我自己的衣服，全靠卖鸡蛋的钱来买。最近我还开了一个银行户头，想多攒些钱，往后置办几箱蜜蜂。就算不是出于爱护，为了这些鸡带来的收益，善待它们也划算。
        - id: ch01-b25
          speaker: mrs_wood
          text: >-
            当然，养鸡要费不少心。有时它们身上长寄生虫，我得给它们涂油、撒石炭酸粉，再试试我知道的各种办法。我还得预备草木灰和干土，让鸡在里面打滚洗澡。母鸡开始孵蛋，我就要仔细照看那些蛋，还得让母鸡按时离窝，出来吃食、活动。要操心的事，足足有一百样。所以有人想靠养家禽挣钱时，我总告诉他，好好照料这些鸡，你花的工夫一定值得。
        - id: ch01-b26
          speaker: miss_laura
          text: 我还发现，您用的饮水器一定比那些给鸡盛水的浅盘好得多。
        - id: ch01-b27
          speaker: mrs_wood
          text: >-
            浅盘脏得很，我才不用。鸡喝脏水，最伤身体。我的鸡必须喝跟我一样干净的水。到了冬天，我还给它们喝热水。早晨把滚水倒进饮水器，一直到晚上都能保着温。其实，在听说这种饮水器以前，我就不肯用浅盘。约翰照着我们读来的法子，给我做过一个。
        - id: ch01-b28
          speaker: mrs_wood
          text: >-
            他找来一只火药桶，在离桶顶约一英寸的地方钻个小孔。桶里装满水，再盖上一只比桶身稍宽的盘子。他按住盘子，把盘和桶一起翻过来。水流进盘里，到了小孔那么高便会停住。盘里的水喝掉一些，桶中才再流出一些。好了，现在去看我的青铜色火鸡吧。它们很漂亮，也不用房子，一年四季都睡在树上。
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            我们找到了那群火鸡。它们的羽毛会变换颜色，劳拉小姐看得很喜欢。有几只个头大得吓人，我可不喜欢。那些雄火鸡会直冲我跑来，喉咙里还发出一阵阵可怕的声音。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            接着，伍德太太带我们去看围栏里的几只鸭。她只给鸭子吃植物做的饲料，好让肉的味道更加纯净。再养些日子，她就会把鸭子送去市场，卖出好价钱。一路看下来，每个地方都收拾得干干净净。
        - id: ch01-b31
          speaker: mrs_wood
          text: 要大群地养家禽，就得让它们住得又干净又舒服。做不到这一点，谁也养不成功。
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            可我们一路走来，除了几只伏在窝里的母鸡，还没见到别的鸡。
        - id: ch01-b33
          speaker: miss_laura
          text: 姨母，它们都去哪儿了？我很想看看呢。
        - id: ch01-b34
          speaker: mrs_wood
          text: >-
            它们正往回赶。现在刚好是吃早饭的钟点，这些鸡准时得跟钟表一样。它们一早先出去，自己刨刨土，找点吃的，然后才回来。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            她说着走下木板路，朝田野望去。劳拉小姐忽然笑出了声。谷仓后面很远的地方，鸡群正往这边赶。它们瞧见伍德太太站在那里，大概以为自己迟到了，立刻又跑又飞。它们互相从背上跳过去，一个个伸长脖子，急得不得了。有几只跑起来时，两条腿像是直直甩在身后，模样实在滑稽。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            这群鸡长得真漂亮。大部分通体雪白，羽毛油亮，眼睛也很有神。食物一撒到地上，它们便贪婪地啄起来。
        - id: ch01-b37
          speaker: mrs_wood
          text: >-
            它们一定以为我改了早饭时间。等到明天，准会早早赶来。可有些人还说鸡没有脑子呢。
