audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，关切中自有力量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快顽皮，爱开玩笑
        timbre: 明亮的少年嗓音
        pace: 稍快
        pitch: 中
    tom:
      display_name: 汤姆
      tts:
        delivery: 直率活泼，少年气十足
        timbre: 清亮结实
        pace: 稍快
        pitch: 中
    ned:
      display_name: 内德
      tts:
        delivery: 爱笑淘气，语气轻松
        timbre: 圆润清脆
        pace: 明快
        pitch: 中高
    boy:
      display_name: 男孩
      tts:
        delivery: 活泼好奇，童真自然
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 中高
    second_boy:
      display_name: 另一个男孩
      tts:
        delivery: 随意爽朗，语气自然
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 中高
    mary:
      display_name: 玛丽
      tts:
        delivery: 朴实爽利，心地热诚
        timbre: 温厚自然
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 第四章　莫里斯家的男孩们给我的名字添了两个字
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: 男孩们一直望着劳拉小姐和哈里表哥，直到再也看不见他们。后来我才知道，那个吹了声口哨的男孩叫杰克，年纪只比劳拉小姐小。
        - id: ch01-b02
          speaker: jack
          text: >-
            只要有人受欺负，哪怕是只动物，母亲发起威来可真够厉害！有一回，她看见我让吉姆去追威尔逊家的黑猫，先狠狠骂了我，又哭了起来，弄得我都不知道往哪儿躲。真倒霉，我哪知道吉姆会把那只老猫咬死？我只是想赶它出院子。走，咱们看看这条狗。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            他们全围到我身边，弯下腰看着缩在角落地板上的我。我从没怎么接触过男孩，不知道会受到怎样的对待。可他们抱我的动作很轻，说话也很和气，一看就懂得不少关于狗的事，平日也总是善待它们。他们一个个拍着我，还叫我乖狗狗。那感觉真奇怪，因为在这一天以前，从没有人这样称赞过我。
        - id: ch01-b04
          speaker: tom
          text: 这条狗可说不上好看，对吧？
        - id: ch01-b05
          speaker: jack
          text: 差得远呢。不过汤姆，它离漂亮总比你近一点。
        - id: ch01-b06
          speaker: beautiful_joe
          text: 杰克笑了，汤姆立刻朝他扑过去，两个人扭打起来。其他男孩连头也没回，还在看我。一个眼睛很像劳拉小姐的小男孩问大家。
        - id: ch01-b07
          speaker: boy
          text: 哈里表哥说，这条狗叫什么名字？
        - id: ch01-b08
          speaker: second_boy
          text: 叫乔。抱它回来的那个小家伙说的。
        - id: ch01-b09
          speaker: ned
          text: 那干脆叫它丑乔吧。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            说话的男孩长着一张圆圆的胖脸，眼睛总带着笑。后来我才知道，他叫内德，也是劳拉小姐的弟弟。莫里斯家的男孩好像怎么数也数不完。
        - id: ch01-b11
          speaker: jack
          text: 劳拉肯定不喜欢这个名字。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            杰克忽然从内德身后冒出来。他满脸通红，喘得厉害，神情却像从没离开过似的。原来他已经打赢了。汤姆坐在箱子上，正发愁地看着外套上的破洞。杰克喘着气，又说了下去。
        - id: ch01-b13
          speaker: jack
          text: 你要是叫它丑乔，那位大小姐准会说，你伤了这条可怜小狗的心。照她的意思，得叫美丽的乔才合适。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            男孩们全都笑出了声。我不怪他们。我本来就长得普通，再缠上这一身绷带，样子一定难看得吓人。
        - id: ch01-b15
          speakers: [jack, tom, ned, boy]
          ensemble: chorus
          text: 好，那就叫美丽的乔！咱们去告诉母亲，再给这位美人要点吃的！
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            他们一窝蜂跑出马厩，我真舍不得他们走。有他们在，我就不太觉得耳朵里刺痛，也能少想一些背上的剧痛。没多久，他们送来了好吃的东西，可我一点也吃不下。他们只好接着去玩。我躺在箱子里，疼得直发抖，只盼那位美丽的小姐回来，用温柔的手指摸摸我。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            后来天黑了。男孩们玩够以后回到屋里，窗中亮起点点灯光。我独自留在这个陌生的地方，又孤单，又难受。无论如何，我都不会回詹金斯家，可那毕竟是我唯一熟悉的家。虽然我觉得自己以后会在这里过得幸福，眼下却还不习惯这场突然的变化。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            我身上每一处都在疼。脑袋像着了火，尖锐的疼痛顺着脊背来回乱窜。我连号叫也不敢，生怕惊动院子里那条叫吉姆的大狗。它正在狗窝里睡觉。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            马厩里安静极了。阁楼上那些先前跑来跑去的兔子，这时也都睡着了。天竺鼠紧紧蜷在自己箱子的一角，猫和那只驯熟的小白鼠更是早早就跑进屋里去了。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            到了最后，我再也忍不住，只好从箱子里坐起来，朝四周望了望。我觉得自己就要死了。虽然身子虚弱得厉害，心里却有一股力量催着我，要我爬去一个谁也看不见的地方。我悄悄溜进院子，贴着马厩外墙往前挪。墙边长着一大片茂密的覆盆子灌木，我钻进枝叶深处，伏在湿冷的泥土上。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            我想挠掉绷带，可它们扎得太紧，怎么也弄不下来。我想起了可怜的母亲，多希望她能来舔舔我疼痛的耳朵。她自己过得那么不幸，却从不愿看我受苦。要是我听她的话，不冲詹金斯龇牙，就不会落到这个地步。她早就一次次告诫过我，那样做只会让詹金斯更加凶狠。
        - id: ch01-b22
          speaker: beautiful_joe
          text: 我正痛苦地伏在那里，忽然听见一个轻柔的声音。是劳拉小姐在叫我。可我的爪子像压着重物，根本走不动。
        - id: ch01-b23
          speaker: miss_laura
          text: 乔！乔！
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            她举着一盏点亮的灯，沿小路走向马厩，身上穿着白裙子。我一直望着她，直到她走进去。她很快又出来，站在碎石路上呼唤。
        - id: ch01-b25
          speaker: miss_laura
          text: 乔，乔，美丽的乔，你在哪儿？你一定躲起来了，不过我会找到你的。
        - id: ch01-b26
          speaker: beautiful_joe
          text: 她径直走到我藏身的地方，俯下身，轻轻拍着我。
        - id: ch01-b27
          speaker: miss_laura
          text: 可怜的小狗，你是不是难受得受不了，才爬到这里来等死？我以前见过狗这样做。可我不会让你死的，乔。
          emotion: sad
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            她把灯放在地上，将我抱进怀里。那时我瘦得很，不像现在这样胖，可在她臂弯里还是沉甸甸的一大团。劳拉小姐却像一点也不觉得重。她一直抱着我，从后门走进屋，走下一长段楼梯，又穿过一条过道，最后来到温暖舒适的厨房。
        - id: ch01-b29
          speaker: mary
          text: 天哪，劳拉小姐，您抱回来的是什么呀？
          emotion: surprised
        - id: ch01-b30
          speaker: beautiful_joe
          text: 说话的女人正弯腰守在炉子前。劳拉小姐抱着我，在椅子上坐了下来。
        - id: ch01-b31
          speaker: miss_laura
          text: 是一条生病的可怜小狗，玛丽。请你替它热一点牛奶，好吗？楼下有没有箱子或篮子，能让它躺一躺？
        - id: ch01-b32
          speaker: mary
          text: 应该有。可它实在太脏了，您不会要让它睡在屋里吧？
        - id: ch01-b33
          speaker: miss_laura
          text: 只让它睡今晚。它病得很重。玛丽，它遇上了一件可怕的事。
        - id: ch01-b34
          speaker: beautiful_joe
          text: 劳拉小姐把我的耳朵怎样被割掉的事告诉了她。
        - id: ch01-b35
          speaker: mary
          text: 原来男孩们说的就是它。可怜的小东西，只要我能帮忙，做什么都行。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            玛丽打开壁橱门，从里面拿出一只箱子，又把一块毯子叠好，铺在箱子里给我躺。她用小锅热了牛奶，倒进浅碟。接着她守在我身边，劳拉小姐上楼去取一小瓶能让我睡觉的药。她们往牛奶中滴了几滴，再把碟子送到我面前。
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            我只舔了几口，实在喝不完。劳拉小姐温柔地哄我，还是没有用。她把手指蘸进牛奶，递到我嘴边。其实我一点也不想喝，可我不能那样忘恩负义。她每递一次，我就舔一次。等牛奶没有了，玛丽抬起箱子，把我搬进厨房旁边的洗衣间。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            我很快沉沉睡着，一整夜都没能醒来。不过，我闻得到，也听得见，有个人好几次走到我身边。第二天早晨我才知道，那是劳拉小姐。家里只要有动物生病，哪怕只是那只驯熟的小白鼠，她夜里也会起来两三次，看看能不能让它舒服一点。
