  chapters:
    - id: ch01
      title: THE MORRIS BOYS ADD TO MY NAME
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            The boys watched Laura and Cousin Harry until they were out of sight. Then Jack, the brother just younger than Laura, gave a low whistle.
        - id: ch01-b02
          speaker: jack
          text: >-
            Doesn't she speak up when she sees someone or some animal being hurt? I'll never forget when she caught me setting Jim on the Wilsons' black cat. First she scolded me, and then she cried until I didn't know where to look. How was I supposed to know Jim would kill the old cat? I only meant to chase it out of our yard. Come on. Let's have a look at this dog.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            They gathered around and leaned over me where I lay in the corner. I knew very little about boys, so I had no idea what they might do to me. But as they touched me and talked to me, I soon understood. They knew dogs, and they treated them kindly. They patted me and called me a good dog. That felt very strange. Until that day, no one had ever called me good.
        - id: ch01-b04
          speaker: tom
          text: He isn't much to look at, is he?
        - id: ch01-b05
          speaker: jack
          text: No, and neither are you, Tom.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Jack laughed, and Tom sprang at him. The two began to wrestle. The other boys hardly noticed. They kept studying me. One small boy had eyes like Laura's.
        - id: ch01-b07
          speaker: boy_2
          text: What did Cousin Harry say his name was?
        - id: ch01-b08
          speaker: boy_1
          text: >-
            Joe. The boy who carried him here told Cousin Harry.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            A boy with a round, plump face and laughing eyes offered an idea. I wondered who he was. Later I learned that he was another of Laura's brothers, named Ned. The Morris boys seemed endless.
        - id: ch01-b10
          speaker: ned
          text: Then why don't we call him Ugly Joe?
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Jack suddenly came up behind him. He was hot and breathing hard, though he acted as cool as if he had never left us. Jack had won the scuffle. Tom sat on a box, sadly examining a hole in his jacket.
        - id: ch01-b12
          speaker: jack
          text: >-
            Laura wouldn't like that. If you call him Ugly Joe, she'll say you've hurt the poor dog's feelings. Beautiful Joe would suit her much better.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            All the boys shouted with laughter. I could hardly blame them. I was plain-looking even at my best, and those bandages must have made me look hideous.
        - id: ch01-b14
          speakers: [jack, boy_1, boy_2, ned]
          ensemble: chorus
          text: >-
            Beautiful Joe it is! Let's tell Mother and ask her for something to feed our beauty.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            They all rushed out of the stable. I was sorry to see them go. While they were near me, I noticed the tingling in my ears and the terrible pain in my back a little less. Before long, they returned with some good food. I could not eat any of it. At last they went back to their games, and I lay trembling in the box they had given me. I wished the pretty young lady would come and stroke me with her gentle fingers.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            After a while, darkness fell. The boys finished their games and went inside, and I saw lights shining in the windows. I was lonely and miserable in that strange place. I would not have returned to Jenkins for anything in the world. Still, his house was the only home I had ever known. I felt that I would be happy here in time, but everything had changed so quickly, and I was not used to my new home yet.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            The pain through my whole body was dreadful. My head felt as if it were on fire, and sharp pains kept darting up and down my backbone. I wanted to howl, but I did not dare. The big dog, Jim, was sleeping in a kennel out in the yard, and I was afraid the noise might make him angry.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Everything in the stable had gone quiet. Earlier, I had heard rabbits running about in the loft overhead. Now they too had settled down to sleep. The guinea pig was nestled in a corner of his box, and the cat and the tame rat had scampered into the house long before.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            At last, I could stand the pain no longer. I sat up in my box and looked around. I felt as though I were going to die. Though I was terribly weak, something inside me urged me to crawl away and hide where no one could see me. I slipped out into the yard, crept along the stable wall, and pushed into a thick patch of raspberry bushes. There I lay down on the cool, damp earth.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            I tried to tear off my bandages, but they were tied too tightly. Then I thought of my poor mother and wished she were there to lick my wounded ears. Miserable as she had been, she never wanted me to suffer. If only I had obeyed her, I would not have been in such pain. Again and again, she had warned me not to snap at Jenkins because it only made him worse.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            In the middle of my misery, I heard a soft voice calling my name. It was Laura. My paws felt weighted down, and I could not go to her.
        - id: ch01-b22
          speaker: laura
          text: Joe! Joe!
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            She walked toward the stable with a lighted lamp held high. Her dress was white. I watched until she disappeared inside. She came out again almost at once and stood on the gravel.
        - id: ch01-b24
          speaker: laura
          text: >-
            Joe! Beautiful Joe, where are you? I know you're hiding, but I'll find you.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            She came straight to the place where I lay. She bent down and patted me.
        - id: ch01-b26
          speaker: laura
          text: >-
            Poor dog. Are you feeling so awful that you crawled away to die? I've known dogs to do that before. But I won't let you die, Joe.
          emotion: sad
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Laura set the lamp on the ground and gathered me into her arms. I was very thin then, not nearly as well fed as I am now, but I was still quite an armful. She never seemed to find me heavy. She carried me straight into the house through the back door, down a long flight of steps, across a hall, and into a snug, warm kitchen.
        - id: ch01-b28
          speaker: mary
          text: Good gracious, Miss Laura! What are you carrying?
          emotion: surprised
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            A woman was leaning over the stove. Laura sat down in a chair with me.
        - id: ch01-b30
          speaker: laura
          text: >-
            It's a poor, sick dog, Mary. Would you warm a little milk for him? And is there a box or basket down here where he can rest?
        - id: ch01-b31
          speaker: mary
          text: >-
            I think so. But he's terribly dirty. You aren't planning to let him sleep inside, are you?
        - id: ch01-b32
          speaker: laura
          text: >-
            Only tonight. He's very ill. Something dreadful happened to him, Mary.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            Laura told her how my ears had been cut off.
        - id: ch01-b34
          speaker: mary
          text: >-
            Oh, this must be the dog the boys were talking about. Poor thing. I'll do whatever I can for him.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Mary opened a closet door and brought out a box. She folded a piece of blanket and laid it inside to make me a bed. Then she heated some milk in a saucepan and poured it into a saucer. Mary watched over me while Laura went upstairs to fetch a small bottle of medicine that would help me sleep.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            They mixed a few drops into the milk and offered it to me. I lapped a little, but even Laura's gentle coaxing could not make me finish. She dipped one finger into the milk and held it out. I did not want any more, yet I could not be so ungrateful as to refuse her. Each time she offered her finger, I licked it.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            When the milk was gone, Mary picked up my box and carried me into the washroom beside the kitchen.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            I soon fell sound asleep, and nothing could rouse me for the rest of the night. Even so, several times I smelled someone nearby and heard someone come close to my bed. The next morning, I found out it had been Laura. Whenever there was a sick animal in the house, even if it was only the tame rat, she would get up two or three times in the night. Each time, she came to see whether there was anything she could do to make the animal more comfortable.
