audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    davidson:
      display_name: 戴维森
      tts:
        delivery: 诚恳郑重，回答时朴实直接
        timbre: 低沉稳重
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十九章　谈谈羊
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            劳拉小姐很喜欢丁格利农庄的羊。屋旁的果园里养着一群，她常带块根和蔬菜去看它们，带得最多的是羊最爱吃的芜菁。可羊听不熟她的声音。她一叫，它们只抬起头，直愣愣地望着，并不肯过来。伍德先生一开口，它们却欢叫着奔到篱笆边，把鼻子拼命往外挤，争着接他递来的胡萝卜、芜菁和别的食物。他叫它们“小南丘羊”，还说这些羊性情最温顺，从不伤人，所以自己很爱它们。
        - id: ch01-b02
          speaker: beautiful_joe
          text: 一天，伍德先生走进厨房找盐。劳拉小姐见了，马上问他。
        - id: ch01-b03
          speaker: miss_laura
          text: 这些盐是给羊吃的吗？
        - id: ch01-b04
          speaker: mr_wood
          text: 是啊。我要去林边牧场，看看我的什罗普郡羊。
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            劳拉，你也想去吧？快把手从蛋糕上拿开，剩下的糖霜我替你抹。去拿宽边帽，外面热得很。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            劳拉小姐高兴地跑进门厅，很快又奔了回来。没过多久，我们就从屋后出发，沿着穿过田野的小路往牧场走。她看着舅舅手里的东西，忍不住问起来。
        - id: ch01-b07
          speaker: miss_laura
          text: 舅舅，你要去做什么？手里那两样怪东西又是什么？
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            这是修蹄剪，我要检查羊蹄。整个七月又暖又潮，我怕它们烂蹄。有时羊的蹄甲也会长得太长。
        - id: ch01-b09
          speaker: miss_laura
          text: 要是羊真的烂蹄了，你怎么治呢？
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            办法有好几种。先削掉坏的地方，把羊蹄修整齐，再泡进蓝矾和醋调成的药水里。也可以学英国牧羊人，直接把药擦上去。这样能除掉患病的部分，又不会伤着好肉。
        - id: ch01-b11
          speaker: miss_laura
          text: 羊会生很多种病吗？我只知道一种，叫羊疥癣。
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            那病可讨厌得很。谁从牲畜市场买羊回来扩充羊群，常常要吃过亏，才知道它有多厉害。
        - id: ch01-b13
          speaker: miss_laura
          text: 得了羊疥癣，会是什么样子？
        - id: ch01-b14
          speaker: mr_wood
          text: 羊皮底下生了微生物，皮肤就会结痂，痒得厉害，连羊毛也会掉。
        - id: ch01-b15
          speaker: miss_laura
          text: 难道治不好吗？
        - id: ch01-b16
          speaker: mr_wood
          text: 当然治得好！只要肯花时间，仔细照料就行。治法不少，我觉得煤油最好用。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            他们边走边说，来到牧场入口那道宽阔的大门前。伍德先生让劳拉小姐先进去，自己随后关好门。他见劳拉一直瞧着那道门，便问她。
        - id: ch01-b18
          speaker: mr_wood
          text: 你一直在看这道门。是不是想知道，我为什么把它造得这么宽？
        - id: ch01-b19
          speaker: miss_laura
          text: 是的，舅舅。可是我怕自己问个不停，会让你厌烦。
        - id: ch01-b20
          speaker: mr_wood
          text: 你想问多少都行，我不嫌麻烦。你见过羊从门口经过吧？
        - id: ch01-b21
          speaker: miss_laura
          text: 当然见过，还见过好多次呢。
        - id: ch01-b22
          speaker: mr_wood
          text: 那它们是怎么走的？
        - id: ch01-b23
          speaker: miss_laura
          text: >-
            傻乎乎的。它们先往后缩，一个等着另一个，到了最后，又忽然全挤进门里。
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            说得一点不错。只要一只羊往前走，别的就全跟上。哪怕前面是无底深渊，它们也会往下跳。许多羊就是这样挤在一起受了伤，所以我的门都造得很宽。来，现在把它们叫过来。咔——南，南，南！
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            刚才附近还一只羊也看不见，这声呼唤一响，灌木丛里立刻探出一张张黑脸。黑色的小腿驮着雪白的身子，从阴凉处沿石子路急匆匆地跑来。它们吃到盐，高兴极了。伍德先生让劳拉小姐把盐撒在几块平石上，两人坐到树下的圆木上，看羊吃完盐，又把石头舔个不停。劳拉小姐用帽子扇着风，笑眯眯地望着它们。
        - id: ch01-b26
          speaker: miss_laura
          text: >-
            你们这些好笑的毛团儿，才不像有些人说的那么笨呢。乔，趴着别动。让它们看见你，也许会把它们吓跑。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            我伏在圆木后面，只偶尔抬头看看羊在做什么。光秃秃的牧场实在太热，几只羊已经回到林子里。大多数却舍不得离开伍德先生，仍站在那里盯着他。劳拉小姐指着近旁一只脸最黑、腿最黑、个头也最大的羊。
        - id: ch01-b28
          speaker: miss_laura
          text: 那只羊真漂亮，是不是？
        - id: ch01-b29
          speaker: mr_wood
          text: 是啊，那是老杰西卡。你有没有发现，它一直把头贴近地面？
        - id: ch01-b30
          speaker: miss_laura
          text: 我看见了。它为什么要这样？
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            当然有原因。它怕羊鼻蝇。夏天里，羊常把鼻子压得很低，不让鼻蝇钻进鼻孔产卵。那些卵孵成蛆，能把羊折磨得不得安宁。鼻蝇一靠近，羊就喷一口气，发疯似的逃跑，可鼻子还是贴着地。我小时候看羊这样，还以为它们伤风鼻塞，总往它们鼻头上抹焦油。那时我们不懂鼻蝇是怎么回事，不过焦油确实管用，所以我现在还在用。天气一热，每个月都要给每只羊的鼻子滴两三次，一次几滴。
        - id: ch01-b32
          speaker: miss_laura
          text: 农夫也和别人一样，总会找到更好的办法做自己的事，对不对，舅舅？
        - id: ch01-b33
          speaker: mr_wood
          text: >-
            对啊，孩子。我年纪越大，懂的越多，照料牲口也越仔细。我祖父要是还活着，看见我这样养羊，准会瞪大眼睛，问我是不是个专会娇养猫儿的老太婆。他从前把羊留在地里，直到田野盖满积雪。羊要把草啃到多低都随它们，非得吃光最后一点饲草，他才让羊进一座四面透风的棚子。干草扔在棚外，谷物几乎从来没有。羊一只只瘦下去，到了春天，一半母羊都保不住肚里的羊羔，大家还觉得这很平常。
        - id: ch01-b34
          speaker: mr_wood
          text: >-
            他要是看见我那些封得严严实实、窗户朝着太阳的大羊棚，看到羊整个冬天住在里面，准会说我把羊关进了狗舍。秋天碰上坏风暴，我也会赶它们进棚，不过它们随时都能出去。我喜欢让它们早点进棚，先吃一点干饲料，慢慢习惯。整个冬天，它们就这样进进出出。劳拉，你一定得去看看那些会自动添料的草架。晴朗的冬日里，羊还能去玉米地跑一跑。冷并不伤羊，真正麻烦的是大雨，会把它们一身羊毛全淋透。
        - id: ch01-b35
          speaker: mr_wood
          text: >-
            用我的办法养羊，我很少损失一只。它们也是农庄里最赚钱的牲口。要是不准我养羊，我连农夫都不想做了。去年每只羊羔给我净赚八美元，每只母羊平均能剪八磅毛，卖两美元。现在这么多人都不养羊了，我这份成绩确实值得夸一夸。
        - id: ch01-b36
          speaker: miss_laura
          text: 舅舅，你一共有多少只羊？
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            现在只有五十只。这边牧场二十五只，下面果园里二十五只。今年春天，我已经卖了不少。
        - id: ch01-b38
          speaker: miss_laura
          text: 这里的羊比果园里的大，对吧？
        - id: ch01-b39
          speaker: mr_wood
          text: >-
            对。果园里的南丘羊，我看中的是它们的好性情，可它们没有这些什罗普郡羊赚钱。要说样样都好，我还是喜欢什罗普郡羊。它们的肉好，毛好，也会养羊羔。现在东部各城都很需要羊肉，人人都想多吃一些。羊肉又得鲜嫩多汁，味道好，所以羊吃什么，人也必须格外用心。
        - id: ch01-b40
          speaker: beautiful_joe
          text: 劳拉小姐听了，轻轻打了个寒战。
        - id: ch01-b41
          speaker: miss_laura
          text: >-
            这些牲口都是你亲手养大，又仔细照料的。真要把它们杀掉，你心里不会难受吗？
          emotion: sad
        - id: ch01-b42
          speaker: mr_wood
          text: >-
            当然难受。可是从我这里送走的牲口，我一定要弄清楚它会怎样死。谁也别想捆住羊腿，把它们硬塞进车里，叫它们热得浑身是汗，一路受罪地送去市场。它们必须舒舒服服地站着走，不然就哪儿也不去。要杀这些被我当孩子宠大的牲口，那个屠夫我也非认识不可。
        - id: ch01-b43
          speaker: mr_wood
          text: >-
            我对霍伊特维尔的戴维森说过，要是让我知道，他把我的羊、羊羔和牛犊全赶在一起，当着其他牲口的面，一只只拖出去，不是拿刀捅，就是先打昏，叫留下的牛和羊吓得又叫又哀号，他就再也别想从我这里收到一只牲口。
        - id: ch01-b44
          speaker: davidson
          text: >-
            伍德，我不喜欢自己干的这一行。不过我以一个老实人的名义担保，已经尽力把屠宰办得妥当了。你亲自来看看吧。
        - id: ch01-b45
          speaker: mr_wood
          text: >-
            他带我进了屠宰场。我没有待多久，可看到的已经足够证明他没说假话。那里有分开的围栏和棚子，宰杀也尽量安静。牲口每次只带进去一只，其他牲口虽然猜得到发生了什么，却看不见。
        - id: ch01-b46
          speaker: miss_laura
          text: 这些羊离屋子这么远，你先前说的那些狗不会来咬它们吗？
        - id: ch01-b47
          speaker: mr_wood
          text: >-
            不会。自从我跟温德姆家的狗较量过一回，就训练羊和牛一起行动。说来真怪，一头牛单独在外面，看见狗也会逃。可狗要碰它的小牛或羊，它就会冲上去打。附近没有一条狗敢进这片牧场。它们知道，牛会低下角追过来，那双眼睛里的神气可不是闹着玩的。
        - id: ch01-b48
          speaker: mr_wood
          text: >-
            果园里的羊也很安全，那里离屋子近。要是有陌生的狗跑来，乔会收拾它。是不是，乔？
        - id: ch01-b49
          speaker: beautiful_joe
          text: 我从圆木后面站起来，把头搁在伍德先生的手臂上。他接着说起果园里的羊。
        - id: ch01-b50
          speaker: mr_wood
          text: >-
            再过一阵，南丘羊会换到这里，什罗普郡羊会去下面的果园。我喜欢让羊待在果树底下。老话说得好，“羊蹄是金的”。有了它们，我连犁地的工夫都省了。果园已经十年没犁过，往后十年我也不打算犁。你哈蒂姑妈的母鸡也很肯帮忙。鸡一年到头都在羊群里跑，看到一只蜱虫就捉一只，害我剪羊毛时连一只都找不到。
        - id: ch01-b51
          speaker: miss_laura
          text: 羊把草啃得真低！
          emotion: surprised
        - id: ch01-b52
          speaker: beautiful_joe
          text: 她指着一只羊。那只羊几乎就在主人脚边吃草。
        - id: ch01-b53
          speaker: mr_wood
          text: >-
            是啃得很低。牛不爱吃的许多东西，羊也吃。苦味的野草、荆棘、灌木，还有春天刚长出来的嫩蕨，它们都吃。
        - id: ch01-b54
          speaker: miss_laura
          text: >-
            真想抱一抱那些可爱的小羊羔。瞧，桤木丛后面那只小黑羊多招人喜欢。你能把它哄过来吗？
        - id: ch01-b55
          speaker: mr_wood
          text: 它不会自己过来，不过我可以试试，替你把它捉来。
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            伍德先生站起身，试了好几次，终于捉住那个黑脸的小家伙，把它抱到圆木旁。小羊很怕劳拉小姐，他便牢牢抱着，让劳拉尽情抚摸它的脑袋。
        - id: ch01-b57
          speaker: mr_wood
          text: >-
            你叫它小羊，可伸手搂一搂，就知道它的身子有多结实。它三月出生，现在已经是七月底。等下个月中旬剪了毛，它大概就觉得自己完全长大了。可怜的小家伙，它能活下来真不容易。
        - id: ch01-b58
          speaker: mr_wood
          text: >-
            四月里，羊群就放出去了。羊不像牛那么受得住圈养，草又能啃得更低，所以可以早点放牧。初春的草又稀又瘦，不过只要另外喂足玉米，羊照样能长得很好。那时这个小家伙跟在母羊身边，两条腿软弱无力，又瘦又差。每天晚上，我们都把羊赶进棚里。地面太冷，成年羊也许能在外面过夜，羊羔却会冻坏。
        - id: ch01-b59
          speaker: mr_wood
          text: >-
            有一天夜里，它的母亲走失了，偏偏本忘了数羊，大家都没有发现。春天里，我总放心不下羊羔，常常半夜起来看看。那天夜里大约两点，我也说不清为什么，忽然想把羊数一遍。发现少了一只母羊和一只羊羔，我就提上灯笼，带着很会追羊踪的布鲁诺出发了。
        - id: ch01-b60
          speaker: mr_wood
          text: >-
            布鲁诺叫起来，我也跟着呼唤。那只傻母羊终于走到我面前，小羊在后面跌跌撞撞地跟着。我用外套裹住羊羔，把它抱回屋里，生起火，又热了些牛奶。你哈蒂姑妈听见动静，也起了床。她连不会说话的牲口也不许我喂白兰地，我只好往牛奶里放些糖粉，反正效用也一样，再硬把奶灌进小羊喉咙。
        - id: ch01-b61
          speaker: mr_wood
          text: >-
            后来，我们拿旧毯子包住它，放到炉子旁。第二天傍晚，它已经能回母亲身边了。整个四月，我一直把它当宝贝照料，另外喂各种磨碎的谷物，直到找出它最喜欢的一种。看看它现在的样子，真给我长脸。
        - id: ch01-b62
          speaker: miss_laura
          text: 亲爱的小羊羔。舅舅，这么多羊，你怎么认得出它？
        - id: ch01-b63
          speaker: mr_wood
          text: >-
            每一张脸我都认得，劳拉。一群羊就跟一群人一样，各有各的神情，也各有各的脾气。
        - id: ch01-b64
          speaker: miss_laura
          text: 可是在我眼里，它们全长得一样。
        - id: ch01-b65
          speaker: mr_wood
          text: 那是因为你还不熟悉它们。你知道怎么看羊的年纪吗？
        - id: ch01-b66
          speaker: miss_laura
          text: 不知道，舅舅。
        - id: ch01-b67
          speaker: mr_wood
          text: >-
            来，科赛特，把嘴张开。羊长到一岁，下颌正中会长出两颗牙。以后每年再多两颗，一直长到五岁。到那时，我们就说它“满口牙”了。再往后，就不能靠牙齿准确判断年纪。好了，回你妈妈身边去吧。
        - id: ch01-b68
          speaker: beautiful_joe
          text: 伍德先生说完，放开了小羊。
        - id: ch01-b69
          speaker: miss_laura
          text: 羊羔总能认出自己的妈妈吗？
        - id: ch01-b70
          speaker: mr_wood
          text: >-
            通常能。有时母羊不肯认自己的羊羔，我们就把母子俩单独拴在一个栏里，等母羊认下它。你看见蓝莓丛旁边那只尖耳朵的羊了吗？
        - id: ch01-b71
          speaker: miss_laura
          text: 看见了，舅舅。
        - id: ch01-b72
          speaker: mr_wood
          text: >-
            它身边的羊羔不是它亲生的。它自己的羊羔死了，我们剥下那只小羊的皮，裹在另一只母羊生的一对双胞胎中的一只身上，再把那只羊羔交给它。没过多久，它就认下这个孩子了。来，往这边走，我带你看看能搬动的饲料槽。
        - id: ch01-b73
          speaker: beautiful_joe
          text: 伍德先生从圆木上站起来，劳拉小姐跟他走到篱笆边。
        - id: ch01-b74
          speaker: mr_wood
          text: >-
            这些大槽给成年羊用，围栏里面的浅槽给羊羔用。你瞧，篱笆下面的空隙正好够小羊钻进去。每次我们带着燕麦、小麦、麦麸或别的饲料过来，你真该看看这些小家伙怎样飞奔到槽边。准备送去宰杀的羊，还要喂玉米粉和油粕。不管喂什么，它们都吃得干干净净。
        - id: ch01-b75
          speaker: mr_wood
          text: >-
            我不赞成把牲口硬塞得过饱。对它们有好处的东西，就喂足。再多可不行。好了，你和乔去那边灌木后坐着吧，我得办正事了。
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            劳拉小姐找到一片阴凉地，我蜷在她身旁。我们坐了很久，一点也不觉得厌倦，因为看羊和羊羔实在有意思。过了一阵，伍德先生也过来坐在我们身边，又讲了一会儿该怎样养羊。
        - id: ch01-b77
          speaker: mr_wood
          text: 你想再待一会儿也行，可我得回屋那边去了。天气再热，该干的活儿也总得干。
        - id: ch01-b78
          speaker: beautiful_joe
          text: 劳拉小姐一下跳了起来。
        - id: ch01-b79
          speaker: miss_laura
          text: 你现在又要去做什么？
        - id: ch01-b80
          speaker: mr_wood
          text: >-
            还是羊的事。我在果园里种了几棵小树。再不赶紧围上铁丝网，羊就要替我把树皮剥掉了。
        - id: ch01-b81
          speaker: miss_laura
          text: >-
            我见过它们那样做。它们用后腿站起来啃树，凡是够得着的嫩芽，一个也不留下。
        - id: ch01-b82
          speaker: mr_wood
          text: >-
            老树不怕它们，小树却非保护不可。把果树照料好很值得。多亏这些羊，我每年都能收获上好的果子。
        - id: ch01-b83
          speaker: beautiful_joe
          text: 伍德先生打开牧场大门，让劳拉小姐先出去。她回头向羊群告别。
        - id: ch01-b84
          speaker: miss_laura
          text: >-
            再见，小羊羔。再见，亲爱的老羊。我以后还会来看你们。现在最好去谷地的小溪边喝点水吧。一身暖和的羊毛，瞧你们热成什么样了。
        - id: ch01-b85
          speaker: beautiful_joe
          text: 伍德先生慢慢走在外甥女身旁，把养羊的窍门告诉她。
        - id: ch01-b86
          speaker: mr_wood
          text: >-
            怎样养出健康的羊，你已经学会一条了。一定要让它们随时喝得到干净的水。给它们好水、好饲料，食物还要常换换花样。住处也要好，夏天凉爽，冬天舒服，再让它们安安静静地生活。这样一来，羊会快活，你也能赚到钱。
        - id: ch01-b87
          speaker: miss_laura
          text: 我想我会喜欢养羊的。舅舅，把羊群交给我照管，好不好？
        - id: ch01-b88
          speaker: beautiful_joe
          text: >-
            伍德先生笑了起来，说这恐怕不成。因为劳拉照管的羊每送一只去屠夫那里，她都要哭上一场。
        - id: ch01-b89
          speaker: beautiful_joe
          text: >-
            从那以后，劳拉小姐和我常到牧场看羊和羊羔。我们总找一处羊看不见的阴凉地方，悄悄观察它们。有一天，它们的举动真叫我吃惊。我听惯了人们说羊温顺，从没想过羊也会打架。谁知道它们不但会打，还打得一本正经，害我忍不住发笑。我想，它们跟大多数动物一样，性子里总藏着一点坏脾气。
        - id: ch01-b90
          speaker: beautiful_joe
          text: >-
            那天，两只羊起了争执。它们不像两条狗那样立刻扑上去，而是先远远分开，再低下头，朝对方猛冲过去，看样子非要撞碎彼此的脑壳不可。劳拉小姐很快高声喝止，把它们吓开了。
        - id: ch01-b91
          speaker: beautiful_joe
          text: >-
            我觉得，羊羔比成年羊更有意思。有时，它们安安静静地在母亲身旁吃草。有时，它们又全挤到一块平坦的岩石顶上，或一小片光秃秃的地面上，脑袋紧紧凑在一起，像是在彼此说话。忽然有一只羊羔跳下来，朝灌木丛或牧场另一头跑去，其他羊羔就不管不顾地跟着飞奔。过不了几分钟，它们又会成群结队地冲回来。
        - id: ch01-b92
          speaker: beautiful_joe
          text: >-
            在悲伤的死亡之日到来以前，它们就这样一同嬉戏，尽情享受快乐。那真是一幅美丽的景象。
