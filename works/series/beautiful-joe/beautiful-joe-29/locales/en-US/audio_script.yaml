  chapters:
    - id: ch01
      title: A TALK ABOUT SHEEP
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Miss Laura took a great interest in the sheep at Dingley Farm. She often visited the flock in the orchard near the house, carrying roots and vegetables. Turnips were their special favorite. The sheep loved her treats, but they did not know her voice. When she called, they only raised their heads and stared. The moment they heard Mr. Wood, though, they ran bleating to the fence and pushed their noses through for whatever carrot or turnip he held out. He called them his little Southdowns. Of all his farm animals, he said, the sheep were the gentlest and least likely to hurt anyone.
        - id: ch01-b02
          speaker: beautiful_joe
          text: One day Mr. Wood came into the kitchen looking for salt.
        - id: ch01-b03
          speaker: miss_laura
          text: Is that salt for the sheep?
        - id: ch01-b04
          speaker: mr_wood
          text: Yes. I'm going up to the woods pasture to look over my Shropshires.
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            I know you'd like to go, Laura. Take your hands off that cake, and I'll finish the frosting. Go fetch your broad-brimmed hat. It's very hot outside.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Miss Laura danced into the hall and back. Soon we were behind the house, following a path through the fields toward the pasture.
        - id: ch01-b07
          speaker: miss_laura
          text: What are you going to do, Uncle? And what are those funny things you're carrying?
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            They're toe clippers. I'm going to check the sheep's hoofs. July has been warm and damp, so I'm worried about foot rot. Their hoofs can grow too long as well.
        - id: ch01-b09
          speaker: miss_laura
          text: What do you do when a sheep gets foot rot?
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            There are several treatments. I can pare and clip the hoof, then dip it in blue vitriol and vinegar, or rub that mixture on the way English shepherds do. It destroys the diseased part without harming the healthy hoof.
        - id: ch01-b11
          speaker: miss_laura
          text: Do sheep get many diseases? I know about one called scab.
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            That's a nasty one. A man who builds his flock from stockyard sheep may learn how costly it is.
        - id: ch01-b13
          speaker: miss_laura
          text: What happens to them?
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            A microbe gets under the skin. The sheep itch terribly, their skin turns scabby, and their wool falls out.
        - id: ch01-b15
          speaker: miss_laura
          text: Can't you cure it?
        - id: ch01-b16
          speaker: mr_wood
          text: >-
            Oh, yes, but it takes time and care. There are different remedies. I think petroleum works best.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            We had reached the wide gate into the pasture. Mr. Wood let Miss Laura pass, closed it behind her, and noticed her looking at it.
        - id: ch01-b18
          speaker: mr_wood
          text: You're wondering why that gate is so wide, aren't you?
        - id: ch01-b19
          speaker: miss_laura
          text: Yes, Uncle, but I hate asking you question after question.
        - id: ch01-b20
          speaker: mr_wood
          text: >-
            Ask all you like. I'm happy to answer. Have you ever watched sheep going through a gate or a doorway?
        - id: ch01-b21
          speaker: miss_laura
          text: Oh, yes, many times.
        - id: ch01-b22
          speaker: mr_wood
          text: And what do they do?
        - id: ch01-b23
          speaker: miss_laura
          text: >-
            They act so foolishly. First they hang back, and each one waits for another. Then they all try to squeeze through together.
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            Exactly. Once one sheep moves, every sheep wants to follow, even into a bottomless pit. Crowding can injure them, so I make my gates and doors very wide. Now let's call them. Ca nan, nan, nan!
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            At first, not one sheep was in sight. Then black faces peeped from the bushes. Little black legs carrying white bodies hurried along the stony paths from the cooler parts of the pasture. How glad they were to get that salt! Mr. Wood let Miss Laura spread it over several flat rocks. Then they sat on a log beneath a tree and watched the sheep eat every grain. Even when the salt was gone, the sheep kept licking the bare rocks. Miss Laura sat smiling at them and fanning herself with her broad hat.
        - id: ch01-b26
          speaker: miss_laura
          text: >-
            You funny, woolly things. You aren't as stupid as some people say. Stay down, Joe. They may run if they see you.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            I crouched behind the log and only raised my head now and then to look. A few sheep went back to the woods because the open pasture was so hot. Most stayed beside Mr. Wood, staring at him. Miss Laura pointed to the largest sheep nearby, with the blackest face and legs.
        - id: ch01-b28
          speaker: miss_laura
          text: That's a splendid sheep, isn't she?
        - id: ch01-b29
          speaker: mr_wood
          text: Yes, that's old Jessica. See how she keeps her head close to the ground?
        - id: ch01-b30
          speaker: miss_laura
          text: I see. Why does she do that?
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            She's afraid of the grub fly. Sheep often hold their noses down in summer to keep that fly from entering their nostrils and laying an egg. The egg turns into a grub that worries and torments them. When a fly comes near, they give a sharp sniff and run as if they've gone crazy, but they still keep their noses close to the earth. When I was a boy, we thought sheep doing that had colds in their heads, so we rubbed tar on their noses. We knew nothing about the fly, but the tar cured them. I still use it now. Two or three times a month in hot weather, we put a few drops on the nose of every sheep in the flock.
        - id: ch01-b32
          speaker: miss_laura
          text: Farmers keep discovering better ways to do their work, just like everyone else, don't they?
        - id: ch01-b33
          speaker: mr_wood
          text: >-
            Yes, my child. The older I get, the more I learn, and the better care I give my animals. If my grandfather saw how I treat these sheep, he'd stare and ask whether I was an old woman fussing over her cats. He left his flock outside until snow covered the fields and they had eaten every scrap. Their only shelter was an open shed, and he threw their hay outdoors. They hardly tasted grain. Everyone expected them to lose weight and half their lambs in spring.
        - id: ch01-b34
          speaker: mr_wood
          text: >-
            He'd say I kept sheep in kennels if he saw my large closed sheds with sunny windows. My flock spends winter there, and I even bring them in during the worst autumn storms. They can go out again as soon as the storm passes. I like bringing them inside for a little dry food because it gets them used to eating it before winter. Then, throughout the cold months, they move in and out of the sheds. You must go inside sometime and see the racks that feed them by themselves. On bright winter days, the sheep get a run through the cornfields. Cold weather does not hurt them. What hurts is heavy rain that soaks right through their fleeces.
        - id: ch01-b35
          speaker: mr_wood
          text: >-
            With my methods, I rarely lose one, and sheep are my most profitable animals. If I couldn't keep them, I believe I'd stop farming. Last year each lamb earned me eight dollars. A ewe's fleece averages eight pounds and sells for two dollars. That's worth boasting about when so many farmers are leaving the sheep business.
        - id: ch01-b36
          speaker: miss_laura
          text: How many sheep do you have, Uncle?
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            Only fifty now. Twenty-five are here, and twenty-five are in the orchard below. I sold quite a few this spring.
        - id: ch01-b38
          speaker: miss_laura
          text: These sheep are bigger than the orchard flock, aren't they?
        - id: ch01-b39
          speaker: mr_wood
          text: >-
            Yes. I keep a few Southdowns for their fine quality, but the Shropshires earn me more. For an all-purpose sheep, I prefer a Shropshire. It's good for meat, wool, and raising lambs. People in eastern cities want more and more mutton now. They expect it to be tender, juicy, and finely flavored, so the farmer must choose the sheep's feed carefully.
        - id: ch01-b40
          speaker: miss_laura
          text: >-
            After raising them and caring for them so well, don't you hate having them killed?
        - id: ch01-b41
          speaker: beautiful_joe
          text: Miss Laura gave a little shudder as she asked.
        - id: ch01-b42
          speaker: mr_wood
          text: >-
            I do. But no animal leaves my farm unless I know exactly how it will be killed. I won't have sheep sent to market with their legs tied, jammed into a cart, sweating and suffering. They travel standing comfortably, or they don't go. And I must know the butcher who kills animals I've petted like children.
        - id: ch01-b43
          speaker: mr_wood
          text: >-
            I spoke plainly to Davidson over in Hoytville. I told him that if he herded my sheep, lambs, and calves together, then took them away one by one and killed them where the others could watch, that would be his last consignment from me. I would not have the remaining animals lowing, bleating, and crying in misery while they saw the knife or the blow. Davidson told me he did not like his business. But he gave me his word as an honest man that his butchering was done as well as it could be, and he invited me to come see for myself.
        - id: ch01-b44
          speaker: mr_wood
          text: >-
            He took me to his slaughterhouse. I did not stay long, but I saw enough to know he'd spoken truthfully. He keeps separate pens and sheds and does the killing as quietly as possible. The animals go in one at a time. The others may suspect what is happening, but they cannot see it.
        - id: ch01-b45
          speaker: miss_laura
          text: >-
            These sheep are a long way from the house. Don't the dogs you told me about attack them?
        - id: ch01-b46
          speaker: mr_wood
          text: >-
            No. Since my trouble with Windham's dog, I've trained the sheep to come and go with the cows. It's a curious thing. A cow may run from a dog when she's alone, but she'll turn and fight if he bothers her calf or the sheep. No dog around here dares enter this pasture. He knows those cows would come after him with their horns lowered and a businesslike look in their eyes.
        - id: ch01-b47
          speaker: mr_wood
          text: >-
            The orchard sheep are safe enough because they stay close to the house, where we'd soon notice any trouble. And if a strange dog did come prowling around them, Joe would settle matters for us. Wouldn't you, Joe?
        - id: ch01-b48
          speaker: beautiful_joe
          text: Mr. Wood looked behind the log. I stood up and laid my head on his arm before he continued.
        - id: ch01-b49
          speaker: mr_wood
          text: >-
            Before long, the Southdowns will come up here and the Shropshires will move down to the orchard. I always keep one flock beneath the fruit trees. An old proverb says, “The sheep has a golden hoof.” They save me from plowing. I haven't plowed that orchard for ten years, and I don't expect to for another ten. Your Aunt Hattie's hens help too. They roam among the sheep all year and catch every tick they find, so I don't have to worry about ticks at shearing time.
        - id: ch01-b50
          speaker: miss_laura
          text: Look how close to the ground that sheep bites!
        - id: ch01-b51
          speaker: mr_wood
          text: >-
            Sheep crop the grass very close. They also eat plenty that cows dislike, including bitter weeds, briars, shrubs, and the young ferns that appear in spring.
        - id: ch01-b52
          speaker: miss_laura
          text: >-
            I wish I could hold one of those dear lambs. Look at that sweet little black one among the alders. Couldn't you coax him over?
        - id: ch01-b53
          speaker: mr_wood
          text: He won't come to us, but I'll try to catch him for you.
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            Mr. Wood got up. It took several tries, but at last he caught the black-faced lamb and carried him to the log. The little creature was very shy of Miss Laura. Mr. Wood held him firmly while she stroked his head as long as she pleased.
        - id: ch01-b55
          speaker: mr_wood
          text: >-
            You call him little, but put your arm around him and you'll feel how solid he is. He was born in March, and now it's late July. He'll be shorn in the middle of next month, and he'll think himself quite grown. Poor fellow, he had a hard fight to live.
        - id: ch01-b56
          speaker: mr_wood
          text: >-
            We turned the sheep out to pasture in April. They cannot stand being shut in as well as cows can. And because they crop the grass so closely, they can go outside earlier and still find enough to eat. The grass is thin and poor so early in spring, of course, so we give them good portions of corn as well. This lamb followed beside his mother on weak legs and looked like a poor little specimen. Every night we brought the whole flock under shelter because the earth was still cold. The grown sheep might have managed outdoors, but the young lambs would have become chilled.
        - id: ch01-b57
          speaker: mr_wood
          text: >-
            One night his mother wandered away. Ben failed to count the flock, so no one missed her. I worry about my lambs in spring and often get up at night to check them. That night, for some reason, I counted them at about two o'clock. When I found a ewe and lamb missing, I took my lantern and Bruno, who was fairly good at tracking sheep, and went looking.
        - id: ch01-b58
          speaker: mr_wood
          text: >-
            Bruno barked, and I called. The foolish ewe came toward me with her lamb staggering behind. I wrapped him in my coat, carried him home, made a fire, and warmed some milk. Your Aunt Hattie heard me and got up. She won't let me give brandy even to an animal, so I mixed ground sugar into the milk instead and made the lamb swallow it.
        - id: ch01-b59
          speaker: mr_wood
          text: >-
            We wrapped him in an old blanket and placed him near the warm stove. By the next evening, he was strong enough to return to his mother. I kept petting him throughout April and brought him extra food. I tried several different kinds of meal until I discovered the one that suited him best. Just look at him now. He does me credit.
        - id: ch01-b60
          speaker: miss_laura
          text: Dear little lamb! How can you tell him from all the others, Uncle?
        - id: ch01-b61
          speaker: mr_wood
          text: >-
            I know every face, Laura. A flock of sheep is like a crowd of people. Each one has a different expression and a different nature.
        - id: ch01-b62
          speaker: miss_laura
          text: They all look the same to me.
        - id: ch01-b63
          speaker: mr_wood
          text: >-
            That's because you aren't used to them. Do you know how to tell a sheep's age?
        - id: ch01-b64
          speaker: miss_laura
          text: No, Uncle.
        - id: ch01-b65
          speaker: mr_wood
          text: >-
            Open your mouth, Cosset. At one year old, a sheep has two teeth in the center of its jaw. Two more appear each year until the sheep is five. Then we say it has a full mouth. After that, the teeth don't tell us its exact age. All right, Cosset. Run back to your mother.
        - id: ch01-b66
          speaker: beautiful_joe
          text: Mr. Wood released the lamb.
        - id: ch01-b67
          speaker: miss_laura
          text: Do lambs always know their own mothers?
        - id: ch01-b68
          speaker: mr_wood
          text: >-
            Usually. Sometimes a ewe refuses to accept her lamb. Then we put the two alone in a stall until she recognizes it. See that sheep near the blueberry bushes, the one with sharply pointed ears?
        - id: ch01-b69
          speaker: miss_laura
          text: Yes, Uncle.
        - id: ch01-b70
          speaker: mr_wood
          text: >-
            The lamb beside her isn't her own. Her lamb died. We took its fleece and wrapped it around a twin lamb from another ewe, then gave that lamb to her. She soon accepted it. Come along now, and I'll show you the movable feeding troughs.
        - id: ch01-b71
          speaker: beautiful_joe
          text: Mr. Wood rose from the log, and Miss Laura followed him over to the fence.
        - id: ch01-b72
          speaker: mr_wood
          text: >-
            These large troughs belong to the sheep. The shallow ones inside that enclosure are for the lambs. There's just enough space beneath the fence for the little ones to slip through. You should see them rush toward those troughs whenever we appear with oats, wheat, bran, or whatever else we're feeding that day. Sheep being prepared for the butcher get corn meal and oil meal. No matter what we serve, they eat every bit. I don't believe in cramming animals with food. I give them as much as is good for them and not a mouthful more. Now go sit in the shade behind those bushes with Joe while I attend to business.
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            Miss Laura found a shady spot, and I curled up beside her. We stayed there a long time without growing tired. Watching the sheep and lambs was too amusing. At last Mr. Wood came and sat beside us. After talking a little longer about raising sheep, he said he had to leave.
        - id: ch01-b74
          speaker: mr_wood
          text: >-
            You may stay here if you like, but I must go down to the house. Hot weather doesn't stop the work from needing to be done.
        - id: ch01-b75
          speaker: beautiful_joe
          text: Miss Laura sprang to her feet.
        - id: ch01-b76
          speaker: miss_laura
          text: What are you going to do now?
        - id: ch01-b77
          speaker: mr_wood
          text: >-
            More sheep work. I planted some young trees in the orchard. If I don't wrap chicken wire around them, the sheep will strip off the bark for me.
        - id: ch01-b78
          speaker: miss_laura
          text: >-
            I've watched them stand on their hind legs and nibble the trees. They take every shoot they can reach.
        - id: ch01-b79
          speaker: mr_wood
          text: >-
            They don't damage the old trees, but the young ones need protection. Caring for my fruit trees pays well. Thanks to the sheep, I get an excellent crop.
        - id: ch01-b80
          speaker: beautiful_joe
          text: Mr. Wood opened the gate so Miss Laura could leave the pasture.
        - id: ch01-b81
          speaker: miss_laura
          text: >-
            Good-bye, little lambs and dear old sheep. I'll visit you again. You should go drink from the brook down in the dingle now. You look so hot in those warm coats.
        - id: ch01-b82
          speaker: mr_wood
          text: >-
            You've learned one part of keeping sheep. Healthy sheep need pure water they can reach whenever they please. Give them good food and plenty of variety. Give them cool shelter in summer and comfortable shelter in winter. Keep them quiet. Then you'll have happy sheep and earn money from them too.
        - id: ch01-b83
          speaker: miss_laura
          text: >-
            I think I'd enjoy raising sheep. Won't you make me the mistress of your flock, Uncle?
        - id: ch01-b84
          speaker: beautiful_joe
          text: >-
            Mr. Wood laughed. He said that would never do, because Miss Laura would cry whenever one of her sheep was sent to the butcher.
        - id: ch01-b85
          speaker: beautiful_joe
          text: >-
            After that day, Miss Laura and I often visited the sheep and lambs. We would settle somewhere shady where they could not see us and watch them. One day the sheep gave me a great surprise. I had heard so much about their meekness that I never imagined they fought. But they did, and they went about it so seriously that I could not help smiling. Like most animals, I suppose, they had a little wickedness in them.
        - id: ch01-b86
          speaker: beautiful_joe
          text: >-
            Two sheep quarreled that day. Instead of rushing together like dogs, they moved far apart. Then both raced forward with lowered heads as if each meant to crack the other's skull. Miss Laura quickly stopped them by calling out and frightening them away from each other.
        - id: ch01-b87
          speaker: beautiful_joe
          text: >-
            I found the lambs more interesting than the grown sheep. Sometimes they fed quietly at their mothers' sides. At other times they all crowded together on top of a flat rock or in a bare place. They held their heads close, as though they were talking over some important matter. Without warning, one lamb would jump down and start for the bushes or the far side of the pasture. Every other lamb followed in a wild rush. Then, only a few minutes later, the whole lively company came racing back again.
        - id: ch01-b88
          speaker: beautiful_joe
          text: >-
            It was lovely to watch the lambs play together and enjoy their lives before the sorrowful day of their death arrived.
