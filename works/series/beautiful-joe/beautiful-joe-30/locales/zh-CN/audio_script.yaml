audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 亲切活泼，提问时好奇而真诚
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 温和爽利，关照人时自然亲切
        timbre: 温暖清晰
        pace: 适中
        pitch: 中
    bessie_drury:
      display_name: 贝茜·德鲁里
      tts:
        delivery: 直率随意，带一点不解的打趣
        timbre: 清脆自然
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三十章　嫉妒的公牛
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            伍德先生养着十二头小牛。劳拉小姐有时会到牛棚去看它们。每头小牛都住在自己的小栏里，靠牛奶喂养。它们有温顺而耐心的脸，还有一双双漂亮的眼睛。无论静静站着四下张望，还是一心吮奶，看起来都老实极了，叫我想起那些温顺的大狗。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            小牛关在栏里时，我总看不真切。后来它们长大一些，可以出栏了，我便跟劳拉小姐来到圈养它们的院子。那些家伙骨架很大，动作又笨拙，模样怪有趣的。它们跑来跑去，一会儿蹦跳，一会儿扬起后蹄，玩得可快活了。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            伍德太太也来了。她说，小牛过了几星期，就不该一直关在窄栏里。放出来活动、嬉闹，身体会更好。她站在劳拉小姐身旁，看了很久，也笑了很久。小牛明明想玩，却像是还不知道该怎样使唤自己的四条腿。
        - id: ch01-b04
          speaker: beautiful_joe
          text: 小牛全都瘦骨棱棱。劳拉小姐看着很不明白，便问舅妈，它们明明已经喝下那么多好奶，怎么还是没有长胖。
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            到该胖的时候，自然会胖起来。小牛太胖，长大了反倒成不了好母牛。又小又胖的小牛，养来送给屠夫也不划算。还是骨架大些好，以后再慢慢催肥。你明年夏天再来，就能看到一群漂亮的小牛了。到那时，它们腰身肥壮，牛角宽宽张开，皮毛也会油光水滑。
        - id: ch01-b06
          speaker: beautiful_joe
          text: 说到这里，伍德太太忽然气愤起来。
        - id: ch01-b07
          speaker: mrs_wood
          text: 这样不伤人的小牛，竟有人忍心折磨它们。你能想象吗？
          emotion: angry
        - id: ch01-b08
          speaker: miss_laura
          text: 当然不能。是谁这样做？
        - id: ch01-b09
          speaker: mrs_wood
          text: >-
            是谁？他们一直都在这样做。你知道大城市里那种雪白好看的牛犊肉是怎么来的吗？人们把小牛的血一点点放干。它们要熬上好几个钟头，在呻吟里耗尽生命。我头一次听说时，气得哭了一整天，还叫约翰答应我，再也不把自家的牲口送到大城市去宰。所以我们的牲口只送到霍伊特维尔和乡下的小地方。
          emotion: angry
        - id: ch01-b10
          speaker: mrs_wood
          text: >-
            劳拉，大城市实在可怕。人挤在一起，心好像也会变坏。我宁愿住在荒漠，也不愿住在城里。就说芝加哥吧。自从在那里住过以后，我每天晚上都祈求上帝，要么改变城里一些恶人的心，要么把他们从世上除掉。
        - id: ch01-b11
          speaker: mrs_wood
          text: >-
            三年前我累垮了，你舅舅说我非换个环境不可，就送我去芝加哥的兄弟家。那是一座了不起的城市，我起初住得还算愉快。后来，几位从西部来的客人登门，他们刚去过城外的屠宰场。我听他们谈起里面的事，简直像在听一场大战。这些人都是牲畜商，常把牲口送到芝加哥。他们气坏了。那里的人为了发财，竟把一切体面和仁慈的感情全踩在脚下，用尽残酷手段折磨动物。
          emotion: angry
        - id: ch01-b12
          speaker: mrs_wood
          text: >-
            他们看到的情形太可怕，我实在说不出口。听到他们讲得克萨斯阉牛怎样受尽折磨，痛得乱踢乱蹬，我尖叫一声，当场昏倒了。人们只好去叫你舅舅，他赶来把我带回家。此后一连好多天，我什么也听不见，只有吼叫和咒骂。眼前也尽是鲜血淋漓的动物，它们在痛苦中哭号呻吟。
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            劳拉，现在就算把一块芝加哥来的肉摆在我面前，再用金子严严实实地盖住，我也会厌恶地一脚踢开。可是，我都在说些什么？你的脸白得像纸。来，去看看牛棚吧。约翰刚叫人刷过石灰。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            劳拉小姐挽住舅妈，我慢慢跟在她们后面。牛棚是一座长长的房子，造得很结实，墙上没有詹金斯家牛棚那样的缝。午后的阳光从一扇扇大窗户里照进来，棚里还有好几个通风口和许多隔栏。一根水管穿过所有隔栏，从牛棚这头一直通到那头。地面铺着锯末和树叶，天花板与墙壁上部刷得雪白。伍德先生怕刺眼的白色伤害牲口眼睛，不让人一直刷到地面，所以墙壁下半截漆成了深棕色。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            牛棚两头都有门。那天两扇门都开着，一阵柔和的风从里面吹过。可牛站在栏里时，两扇门绝不能同时打开。伍德先生不许穿堂风吹到它们，也不肯让它们太冷或太热，因为两样都一样有害。冬天，牛也不喝冰水。他会先把水的寒气去掉，就像伍德太太给母鸡预备饮水那样。
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            劳拉，母牛住得干燥暖和，吃的饲料反而比又冷又湿时少。它们是热血动物，一觉得冷，就得吃下许多东西，才能维持身体的热气。所以给它们好住处、好饲料，其实更划算。它们也喜欢安静。我嫁给你舅舅以前还不知道。我们家的男孩子赶牛时，总是大喊大叫，有时还逼牛奔跑。在这里，这些事全不许做。
        - id: ch01-b17
          speaker: miss_laura
          text: 我早就发现农庄很安静。这里明明有这么多工人，却几乎听不见喧闹声。
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            你舅舅常吹口哨，你注意到了吗？他干活时会吹，还有一种专门招呼人的哨声。几乎所有牲口都听得懂，工人听见也会跑过去。他要是在牛棚外用特定的调子一吹，这里的每头母牛都会回头。
        - id: ch01-b19
          speaker: mrs_wood
          text: >-
            那是他小时候替父亲赶牛时养成的习惯。他把牛训练好，只要站在牧场里吹声口哨，牛群就会走过来。我最初对他动心，大概就是因为那清亮快活的哨声。我在家里，远远就能听见他沿路赶着马车慢慢走来，或驾着轻便马车经过。
        - id: ch01-b20
          speaker: mrs_wood
          text: >-
            他说，根本不用对动物喊叫，那只会让它们害怕、生气。把话说得清清楚楚，它们反而更听话。动物最恨挨人吼，更恨有人偷偷摸摸靠近，冷不防吓它一跳。约翰说，许多人挨马踢，就是因为像贼一样走到马跟前。动物受惊后，第一个念头是保护自己。狗会扑上来，马会扬起后蹄。约翰每次走近牲口，总先说句话或吹声口哨，让它们知道他来了。
        - id: ch01-b21
          speaker: miss_laura
          text: 舅舅今天下午在哪里？
        - id: ch01-b22
          speaker: mrs_wood
          text: 他埋在干草堆里，忙得只露两只眼睛呢。连一头公牛都套上了，在替他拉运草车。
        - id: ch01-b23
          speaker: miss_laura
          text: 不知道是不是公爵？
        - id: ch01-b24
          speaker: mrs_wood
          text: 就是它。我看见它额头上的星形白斑了。
        - id: ch01-b25
          speaker: miss_laura
          text: >-
            那天它真把我笑坏了。舅舅问我，听没听说过会嫉妒的公牛。我说没有，他便叫我到谷仓院子里去看。两头公牛都在那里。公爵长着一张宽脸，亮亮的脸尖得多，看起来也机灵得多。公爵当时正在水槽里喝水。
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            你瞧它，又肥又大，还那么自鸣得意。它那副样子，像不像觉得全世界都欠它一份吃喝，而且它就该拿到手？
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            伍德先生拿来刮毛梳，走到亮亮身边替它刷毛。公爵从水槽里抬起头，直盯着他。他故意不理，只管给亮亮梳毛、抚摸它、哄它。公爵气坏了。它离开水槽，嘴边还淌着水，走上去用角顶了伍德先生一下。伍德先生还是不理，它便险些把他顶翻。
        - id: ch01-b28
          speaker: miss_laura
          text: >-
            舅舅这才不再疼亮亮，转过身去照料公爵。他说，要是继续不理，公爵准会粗暴地对付他。舅舅一替它梳毛，它马上心满意足。我从没见过哪只牲口能得意成那样。亮亮却一点也不在乎，只在旁边安静地看着他们。
        - id: ch01-b29
          speaker: mrs_wood
          text: >-
            公爵这样闹，我见过好多回。它是我们这里嫉妒心最重的牲口。只要你舅舅疼别的动物，不疼它，它就难受得不得了。这些不会说话的牲口真奇妙，许多地方都和人差不多。它们会嫉妒，会怨恨，能爱，能恨，也懂得原谅。它们还那么能忍受痛苦，又忍得那么有耐心。哪个人受了动物所受的折磨以后，还能这样耐心呢？
        - id: ch01-b30
          speaker: miss_laura
          text: 一个也没有。我们做不到。
        - id: ch01-b31
          speaker: mrs_wood
          text: >-
            不管一种动物长得多丑、多讨人嫌，身上似乎总有值得人爱的地方。我刚读到一群下水道里的老鼠，是路易丝·米歇尔养过的老鼠。
        - id: ch01-b32
          speaker: miss_laura
          text: 她是谁？
        - id: ch01-b33
          speaker: mrs_wood
          text: >-
            一位有名的法国女人。斯特德先生称她为“怜悯与复仇的女祭司”。你年纪还小，不会知道她。可我记得，一八七二年法国公社发生动乱时，我就读到过她的消息。她是无政府主义者，曾穿制服、扛步枪，还帮人修筑街垒。后来她被捕了，又作为罪犯流放到法国的一处殖民地。
        - id: ch01-b34
          speaker: mrs_wood
          text: >-
            她真心爱着动物。回国时，她带了四只猫。后来她在法国再次入狱，也把猫带在身边。老鼠常到牢房附近来，她会抚摸它们，还教自己的猫善待它们。猫还没完全学会规矩时，有一只咬伤了老鼠的爪子。路易丝一直照料那只老鼠，等伤好了，才用绳子从窗口把它放下去。
        - id: ch01-b35
          speaker: mrs_wood
          text: >-
            那只老鼠回到下水道，大概把路易丝怎样善待它告诉了同伴。从此，老鼠不再害怕，都来到她的牢房。母鼠还会把幼崽带来，放在她脚边，像是请她保护自己的孩子。最出奇的是，它们彼此很有感情。年轻的老鼠会把人们扔给老老鼠的硬面包皮嚼软，让没有牙的老鼠更容易吃下去。哪只小老鼠要是敢抢在老老鼠前头先吃，其他老鼠还会惩罚它。
        - id: ch01-b36
          speaker: miss_laura
          text: 听起来真有意思，舅妈。你从哪里读到的？
        - id: ch01-b37
          speaker: mrs_wood
          text: 我刚拿到那本杂志。等你进屋，我就给你。
        - id: ch01-b38
          speaker: miss_laura
          text: >-
            亲爱的舅妈，我真喜欢和你待在一起。因为我说起动物时，你总能明白我的心。我也说不清自己对它们到底怀着什么感情。我就是爱这些不会说话的生命，每看见一个，都想停下来同它说说话。有时我会惹得可怜的贝茜·德鲁里不耐烦，自己也很过意不去，可我忍不住。
        - id: ch01-b39
          speaker: bessie_drury
          text: 劳拉，你怎么这么傻呀？
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            劳拉小姐说着，把手放在胸口。她恰好站在阳光照进来的地方。光穿过浅棕色的头发，把她的脸映得亮亮的。我觉得，她从来没有这样美过。伍德太太大概也这样想。她转过身，双手放到劳拉小姐肩上，很认真地望着她。
        - id: ch01-b41
          speaker: mrs_wood
          text: >-
            劳拉，世上的冷心肠已经够多了。你对不会说话的生命有一颗温暖柔软的心，千万别把它压下去。孩子，你最可爱的地方，就是爱一切会呼吸、会活动的生命。心里若有自私，就把它拔掉。爱和怜悯却一定要留下。
        - id: ch01-b42
          speaker: mrs_wood
          text: >-
            好了，我再给你讲讲母牛吧，也想让你对挤奶养牛的事生出兴趣。这座牛棚是你上次来过以后新建的，我们添了不少新东西。看见每个栏里的岩盐了吗？母牛什么时候想舔都行。来，我带你看看我们所说的“黑洞”。
        - id: ch01-b43
          speaker: beautiful_joe
          text: 那是主牛棚旁一间很小的棚子，里面又暗又凉。劳拉小姐看了十分惊讶。
        - id: ch01-b44
          speaker: miss_laura
          text: 这是关牛受罚的地方吗？
          emotion: surprised
        - id: ch01-b45
          speaker: beautiful_joe
          text: 伍德太太放声笑了。
        - id: ch01-b46
          speaker: mrs_wood
          text: >-
            不，不，这是让它们享福的地方。苍蝇闹得太凶时，母牛赶到院里挤奶，身上又会落满一群新飞来的苍蝇，急得它们简直要发疯。就算是新罕布什尔最好的母牛，也免不了踢上几脚。哪头闹得最厉害，就带到这里挤奶，因为里面没有苍蝇。
        - id: ch01-b47
          speaker: mrs_wood
          text: >-
            其余的牛背上会盖一大片棉布，再从肚子底下系好。工人还会用艾菊茶，或掺了一点石炭酸的水，刷洗牛腿。这样，苍蝇就不来骚扰了。母牛知道这些都是为了让它们舒服，会安静地站着，直到挤完奶。
        - id: ch01-b48
          speaker: mrs_wood
          text: >-
            哪天我一定叫约翰给它们穿上“睡衣”，让你看看。哈里管它们叫“蒙着床单的鬼”。一头头牛披着白布，在谷仓院子里到处走，那模样真是怪极了。
