  chapters:
    - id: ch01
      title: The Calves at Play
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Mr. Wood was raising a dozen calves, and Miss Laura sometimes visited them in the stable. Each one stood in a crib and drank milk. They had patient, gentle faces and beautiful eyes. As they quietly looked around or drank, they reminded me of big, gentle dogs.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            I could never see them very well inside their cribs. Then one day, when they were old enough to go outdoors, I followed Miss Laura to their yard. What awkward, large-boned creatures they were! They ran, jumped, and kicked up their heels as if they were having the finest time in the world.
        - id: ch01-b03
          speaker: mrs_wood
          text: >-
            Once calves are a few weeks old, it isn't good to keep them shut in so closely. Going outside for a good frolic does them good.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Mrs. Wood stood beside Miss Laura for a long while. She laughed at their clumsy games. The calves plainly wanted to play, but they had not yet learned what to do with their long legs.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            They were all very lean. Miss Laura wondered why so much good milk had not made them fat.
        - id: ch01-b06
          speaker: miss_laura
          text: Auntie, why are they still so thin after drinking all that lovely milk?
        - id: ch01-b07
          speaker: mrs_wood
          text: >-
            They'll grow fat when the time comes. A fat calf won't make a good cow. And if a calf is small, it doesn't pay to prepare it for the butcher while it's fat. A bony calf can be fattened later. Come back next summer, and you'll see splendid young cattle with round sides, wide horns, and fine coats.
        - id: ch01-b08
          speaker: mrs_wood
          text: >-
            And Laura, can you imagine anyone being cruel enough to torture a harmless calf?
          emotion: angry
        - id: ch01-b09
          speaker: miss_laura
          text: No, I truly can't. Who would do such a thing?
        - id: ch01-b10
          speaker: mrs_wood
          text: >-
            Who would? It happens all the time. Do you know how they get the pale veal sold in big cities? They slowly bleed the calves to death. The poor things suffer for hours, moaning as they die. When I first heard about it, I was so furious that I cried all day. I made John promise never to send another one of his animals to a big city for slaughter. That is why all our stock goes to Hoytville and other small country places.
          emotion: angry
        - id: ch01-b11
          speaker: mrs_wood
          text: >-
            Oh, Laura, those great cities can be dreadful. Crowding people together seems to bring out wickedness in them. I would sooner live in a desert. Every night since I visited Ch o, I've prayed that the Lord would change the hearts of some wicked people there, or sweep them from the earth.
          emotion: angry
        - id: ch01-b12
          speaker: mrs_wood
          text: >-
            Three years ago, I was worn down, and your uncle insisted that I needed a change. He sent me to stay with my brother in Ch o. I enjoyed the visit at first, because it is a marvelous city. Then some cattle dealers from the West came in after touring the slaughterhouses outside town. Their talk sounded like a description of a terrible battle. They had sent livestock to Ch o themselves, and they were furious. In the rush to get rich, the slaughterhouse men had trampled every decent and humane feeling and tortured the animals.
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            What those visitors saw was too dreadful to repeat. They began describing Texan steers kicking in agony under the torture. I screamed and fainted. They had to send for your uncle, and he brought me home. For days afterward, I heard shouting and swearing in my mind. I saw bleeding animals crying out in pain. Laura, you could lay a piece of Ch o meat before me and cover it in gold, and I would push it away.
          emotion: disgusted
        - id: ch01-b14
          speaker: mrs_wood
          text: >-
            But listen to me carrying on. Your face has gone as white as a sheet. Come along and see the cow stable. John has just had it whitewashed.
    - id: ch02
      title: A Quiet Stable
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            Miss Laura took her aunt's arm, and I followed slowly behind them. The cow stable was a long, solid building. Its walls had no cracks like the walls in Jenkins's stable. Afternoon sunlight poured through the large windows, and there were plenty of ventilators and stalls. A water pipe ran through the stalls from one end of the building to the other.
        - id: ch02-b02
          speaker: beautiful_joe
          text: >-
            Sawdust and leaves covered the floor. The ceiling and the upper walls gleamed with fresh whitewash, but the lower walls were stained dark brown. Mrs. Wood explained that her husband thought bright white walls all the way to the floor might hurt the animals' eyes.
        - id: ch02-b03
          speaker: beautiful_joe
          text: >-
            A door stood at each end of the stable, and both were open that afternoon, letting a soft breeze pass through. When the cattle were in their stalls, though, the Woods never opened both doors at once. Mr. Wood carefully protected his cattle from drafts. He would not let them get chilled, but he would not let them grow overheated either. Both were harmful.
        - id: ch02-b04
          speaker: beautiful_joe
          text: >-
            In winter, the cows were never given icy water. Mr. Wood warmed it enough to take off the chill, just as Mrs. Wood did for her hens.
        - id: ch02-b05
          speaker: mrs_wood
          text: >-
            You see, Laura, cows eat less when they're warm and dry than they do when they're cold and wet. Their blood is warm. If they get cold, they must eat much more just to keep their bodies warm. So it costs less to give them good food and a proper shelter.
        - id: ch02-b06
          speaker: mrs_wood
          text: >-
            Cows like peace and quiet, too. I never understood that until I married your uncle. On the farm where I grew up, the boys yelled and shrieked whenever they drove the cows. Sometimes they even made the animals run. No one is allowed to do that here.
        - id: ch02-b07
          speaker: miss_laura
          text: >-
            I have noticed how peaceful the farm is. There are so many men working here, but you hardly hear any noise.
        - id: ch02-b08
          speaker: mrs_wood
          text: >-
            Your uncle whistles quite a lot. Have you heard him? He whistles while he works, and he has one special call that nearly every animal knows. The men hurry over when they hear it, too. If he gave a certain whistle outside right now, every cow in this stable would turn her head.
        - id: ch02-b09
          speaker: mrs_wood
          text: >-
            He began doing it as a boy, when he went to fetch his father's cows. He taught them to come while he stood in the pasture and whistled. I believe his clear, cheerful whistle was one of the first things that drew me to him. From our house, I would hear him far down the road, driving his cart or riding in his buggy.
        - id: ch02-b10
          speaker: mrs_wood
          text: >-
            John says there is never any reason to scream at an animal. It only frightens the creature and makes it angry. Animals obey much better when you speak clearly to them. And there is just one thing they hate even more than shouting. They hate it when a person creeps up and gives them a fright.
        - id: ch02-b11
          speaker: mrs_wood
          text: >-
            John says many men get kicked because they approach a horse like thieves. A startled animal's first thought is to protect itself. A dog may leap at you, and a horse may kick. John always speaks or whistles as he comes near, so every animal knows he is there.
        - id: ch02-b12
          speaker: miss_laura
          text: Where is Uncle John this afternoon?
        - id: ch02-b13
          speaker: mrs_wood
          text: >-
            He is buried in hay work. He even harnessed one of the oxen to a hay cart.
        - id: ch02-b14
          speaker: miss_laura
          text: Do you suppose it's Duke?
        - id: ch02-b15
          speaker: mrs_wood
          text: Yes, it is. I recognized the star on his forehead.
    - id: ch03
      title: The Jealous Ox
      blocks:
        - id: ch03-b01
          speaker: miss_laura
          text: >-
            I haven't laughed so hard in ages as I did over Duke the other day. Uncle asked whether I had ever heard of a jealous ox. When I said no, he took me to the barnyard to show me one.
        - id: ch03-b02
          speaker: miss_laura
          text: >-
            Both oxen were there. Duke had his broad face, while Bright looked much sharper and more intelligent. Duke was drinking from the trough.
        - id: ch03-b03
          speaker: mr_wood
          text: >-
            Take a good look at Duke. Isn't he a great fat fellow, pleased with himself? He looks as though the whole world owes him a living and had better provide it.
        - id: ch03-b04
          speaker: miss_laura
          text: >-
            Then Uncle picked up the grooming card and began scratching Bright with it. Duke raised his head from the water and stared. Uncle acted as though he hadn't noticed and kept carding, stroking, and petting Bright.
        - id: ch03-b05
          speaker: miss_laura
          text: >-
            Duke looked furious. Water dripped from his mouth as he left the trough and walked over. First he nudged Uncle with his horns. Uncle still ignored him, so Duke pushed harder and nearly knocked him down. At last Uncle stopped petting Bright and turned to Duke. He said Duke might have handled him roughly if he had waited any longer.
        - id: ch03-b06
          speaker: miss_laura
          text: >-
            The moment Uncle began carding him, Duke looked more satisfied than any creature I had ever seen. Bright did not mind at all. He only stood there and calmly watched them.
        - id: ch03-b07
          speaker: mrs_wood
          text: >-
            I've watched Duke do that many times. He is the most jealous animal we own. If your uncle pays attention to any other creature, Duke makes himself perfectly miserable.
        - id: ch03-b08
          speaker: mrs_wood
          text: >-
            Animals are strange beings, aren't they? In so many ways, they're like us. They feel jealousy and resentment. They can love, hate, and forgive. And oh, how they can suffer, so patiently! What human being could bear the tortures animals endure and still remain so patient?
          emotion: sad
        - id: ch03-b09
          speaker: miss_laura
          text: No one could. We would never bear it as they do.
          emotion: sad
    - id: ch04
      title: Warm Hearts
      blocks:
        - id: ch04-b01
          speaker: mrs_wood
          text: >-
            Even the ugliest, most unpleasant-looking animal seems to have something lovable about it. I was just reading about sewer rats. They were Louise Michel's rats.
        - id: ch04-b02
          speaker: miss_laura
          text: Who is Louise Michel?
        - id: ch04-b03
          speaker: mrs_wood
          text: >-
            She is a famous Frenchwoman, my dear. Mr. Stead calls her the priestess of pity and vengeance. You're too young to have heard much about her, but I remember reading about her in 1872, during the troubles of the Commune in France.
        - id: ch04-b04
          speaker: mrs_wood
          text: >-
            She is an anarchist. She used to put on a uniform, carry a rifle, and help build barricades. She was arrested and sent away as a prisoner to a French penal colony. Yet she carried an extraordinary love for animals in her heart. When she returned home, she brought four cats with her.
        - id: ch04-b05
          speaker: mrs_wood
          text: >-
            Later she was imprisoned in France again, and the cats went with her. Rats began visiting her cell. Louise petted them and taught her cats not to hurt them. Before the cats were fully trained, one bit a rat on the paw. Louise cared for the little animal until it healed. Then she lowered it from her window on a string so it could return to the sewer.
        - id: ch04-b06
          speaker: mrs_wood
          text: >-
            I suppose that rat told all the others how kindly Louise had treated it, because after that, they came into her cell without fear. Mother rats laid their babies at her feet as if they were asking her to protect them.
        - id: ch04-b07
          speaker: mrs_wood
          text: >-
            Their devotion to one another was the most remarkable part. Young rats chewed hard crusts for the old rats who had no teeth, making the food easier for them to eat. And if a young rat tried to take food before an old one, the rest punished it.
        - id: ch04-b08
          speaker: miss_laura
          text: That sounds fascinating, Auntie. Where did you read it?
        - id: ch04-b09
          speaker: mrs_wood
          text: >-
            I have the magazine in the house. You may read it as soon as we go in.
        - id: ch04-b10
          speaker: miss_laura
          text: >-
            Dear Auntie, I love being with you because you understand me when I talk about animals. I can't really explain this feeling in my heart. I simply love every quiet creature. Whenever I see one, I want to stop and speak to it.
          emotion: happy
        - id: ch04-b11
          speaker: miss_laura
          text: >-
            Sometimes I bother poor Bessie Drury, and then I feel sorry. But I can't help myself. She always asks why I must be so silly about animals.
        - id: ch04-b12
          speaker: beautiful_joe
          text: >-
            Miss Laura put one arm lovingly around her aunt as they stood in the doorway. Sunlight passed through her light-brown hair and filled her face with a glow. I thought she had never looked more beautiful. Mrs. Wood seemed to think so, too. She turned and placed both hands on Miss Laura's shoulders.
        - id: ch04-b13
          speaker: mrs_wood
          text: >-
            Laura, this world already has enough cold hearts. Never crush a warm or tender feeling for an animal. Your love for every living, breathing creature is the loveliest thing about you. Pull any selfishness out of your heart, if you find it there. But hold on to your love and pity.
        - id: ch04-b14
          speaker: mrs_wood
          text: >-
            Now let me tell you a little more about the cows. I want you to take an interest in dairy work. This stable was built after your last visit, and we've improved many things. See the pieces of rock salt in every stall? The cows can lick them whenever they please. Come with me, and I'll show you the place we call the Black Hole.
    - id: ch05
      title: The Black Hole
      blocks:
        - id: ch05-b01
          speaker: beautiful_joe
          text: >-
            The Black Hole was a tiny stable beside the main one. Inside, it was dark and cool.
        - id: ch05-b02
          speaker: miss_laura
          text: Is this where you punish the cows?
          emotion: surprised
        - id: ch05-b03
          speaker: beautiful_joe
          text: Mrs. Wood burst out laughing.
        - id: ch05-b04
          speaker: mrs_wood
          text: >-
            Oh, no! This is a place for comfort. Sometimes the flies are terrible. When the cows come into the yard for milking, a fresh swarm may settle all over them. It nearly drives them wild. Even though they are the finest cows in New Hampshire, they may kick a little.
        - id: ch05-b05
          speaker: mrs_wood
          text: >-
            We bring the worst sufferers in here to be milked, where no flies can trouble them. The other cows have broad cotton strips laid across their backs and tied underneath. The men brush their legs with tansy tea, or with water mixed with a little carbolic acid. That keeps the flies away.
        - id: ch05-b06
          speaker: mrs_wood
          text: >-
            The cows understand perfectly well that we're helping them. They stand quietly until the milking is finished. I must ask John to put on their nightdresses one evening so you can see them. Harry calls them sheeted ghosts. They certainly look odd, wandering around the barnyard dressed in white.
