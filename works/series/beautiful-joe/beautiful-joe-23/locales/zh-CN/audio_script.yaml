audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    maxwell:
      display_name: 马克斯韦尔先生
      tts:
        delivery: 温和风趣，叙事时从容可信
        timbre: 温润清朗
        pace: 适中
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十三章　捕捉野生动物
      blocks:
        - id: ch01-b01
          speaker: mr_wood
          text: >-
            你们都知道，我是在缅因州东部长大的。那时候，我们常越过边界，到新不伦瑞克去打猎。最好的猎物就是驼鹿。劳拉，你见过驼鹿吗？
        - id: ch01-b02
          speaker: miss_laura
          text: >-
            没见过，叔叔。
        - id: ch01-b03
          speaker: mr_wood
          text: >-
            我小时候觉得，世上没有什么比驼鹿更好看。它一身暗褐色的皮毛，腿又细又长，鹿角伸出许多枝杈，肩头比马背还高。那副模样，我怎么也看不够。因为腿太长，它够不着贴地的草，只吃植物顶端和树上的嫩枝嫩叶。
        - id: ch01-b04
          speaker: mr_wood
          text: >-
            它走进茂密的灌木丛，会灵巧地转动鹿角，不让角杈钩住树枝。脚步也落得又稳又准。它从林中走过去，你几乎听不见一根细枝落地。
        - id: ch01-b05
          speaker: mr_wood
          text: >-
            驼鹿平常胆小，有时却会用蹄子和鹿角攻击挡路的东西。它们最恨蚊子。要是正被蚊子叮得难受，走近它们可得小心。主也给了这些动物许多聪明才智。母驼鹿有了一两只小鹿，就会躲进森林最深处，或者游到大湖里的岛上，等孩子能够照顾自己再出来。
        - id: ch01-b06
          speaker: mr_wood
          text: >-
            我们当年喜欢捉驼鹿，办法有好几种。可以把绳子结成套，藏在驼鹿走的小径上，再盖上枯叶。绳子连着一棵弯下树梢的小树。驼鹿一脚踩进套里，小树猛地弹起，绳子便勒住它的腿。
        - id: ch01-b07
          speaker: mr_wood
          text: >-
            陷阱都设在密林深处，我们没法常去查看。有些驼鹿困在那里好几天，发狂地挣扎乱撞，腿上的皮全磨掉了。那很残忍。现在就算有人给我一百美元，我也不会再这样捉驼鹿。
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            另一种办法，是穿雪鞋，带着狗追猎。二三月的雪很深，雪面却能托住人和狗。驼鹿不成群生活。夏天，它们在森林里四处游荡。秋天才聚成一小群，选一两百英亩灌木茂盛的地方，平常不再走远。这样，脚印集中在一处，不会一路把藏身处告诉天敌。
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            有几头驼鹿住在一起的地方，我们叫它“驼鹿场”。我们在林中找到驼鹿的踪迹，狗闻到气味，便冲到前面把它们赶出来。现在只要闭上眼，我还能看见那些场面。
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            驼鹿在结壳的雪地上奔跑、纵跃，狗紧紧咬住它流血的腰腹和腿。它不时直立起来，狠狠踢打。猎人的枪砰、砰、砰地响，有时打死打伤驼鹿，也打中猎狗。那也很残忍。
        - id: ch01-b11
          speaker: mr_wood
          text: >-
            还有两种办法，一个叫诱叫，一个叫潜猎。诱叫时，我们把桦树皮卷成号角，在明亮的月夜、傍晚或清早带出去。拿号角的人藏起来，学母驼鹿低声叫唤。必须学得很像，才能骗过它们。
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            远处的驼鹿听见了，会一面低声回应，一面朝这边赶来。年轻的公鹿怕老公鹿，每一步都会走得小心翼翼。老家伙可不一样。一路都能听见它大步走来，鹿角敲着树干，遇到水也毫不迟疑地闯过去。
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            快走近时，它会停下来听。诱叫的人这时得格外小心，把号角贴近地面，让声音更低。驼鹿要是怀疑，就转身走了。要是继续过来，那就倒霉啦。我们拿着步枪，埋伏在诱叫的人身边，会好好“招待”它。还有几个人守在远处，也等着朝它开火。
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            潜猎呢，就是像猫靠近老鼠那样，悄悄接近驼鹿。白天它们常卧在地上。我们找到足迹，还有枝梢被咬断的地方，就一路追下去。驼鹿很容易闻到人的气味，我们只能待在下风处。
        - id: ch01-b15
          speaker: mr_wood
          text: >-
            有时我们会撞见它们正躺着。可走路时只要踩断一根树枝，或发出哪怕一点点声音，它们就以为天敌熊正偷偷摸过来了，马上起身逃走。驼鹿耳朵很灵，眼睛却没那么好。狐狸也一样，眼睛远远比不上鼻子。
        - id: ch01-b16
          speaker: mr_wood
          text: >-
            要杀驼鹿的话，潜猎还算最仁慈。它们不必在林中一路逃命，也不用受追赶的惊吓和痛苦。
        - id: ch01-b17
          speaker: mrs_wood
          text: >-
            我就不明白，为什么一定要杀它们。要是山后面的森林里住满野生动物，我只会觉得高兴，根本不想去猎杀。只要它们像鹿一样无害又美丽，我就希望它们留在那里。
        - id: ch01-b18
          speaker: mr_wood
          text: >-
            因为你是女人。女人比男人仁慈，男人却总想杀这杀那。就像那个英国人说的：“天气真好，我们出去杀点什么吧。”
        - id: ch01-b19
          speaker: miss_laura
          text: >-
            叔叔，再讲讲那些帮你们捕捉驼鹿的狗吧。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            我端端正正坐在劳拉小姐身边，一字不漏地听伍德先生讲话。劳拉小姐一面听，一面抚摸我的脑袋。
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            我们追驼鹿时，会在雪地里宿营，睡在云杉枝上。那些狗睡在脚边，替我们取暖，给了我们不少安慰。可怜的家伙，它们也吃尽苦头。奔跑追赶的时候，它们和我们一样兴奋。可肋骨折了、脑袋受伤了，就完全是另一回事。
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            豪猪也常害它们受伤。这些狗总学不会躲开豪猪。在没有驼鹿踪迹的林子里发现一只，它们就会冲上去咬死。结果，豪猪刺扎进它们嘴里、脖子和胸口。我们只好把狗嘴撑开，用铸子弹的模具、钳子、折刀，或手边能找到的东西，一根一根拔出那些讨厌的刺。
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            要是马上抓住狗，还能直接用手指拔刺。有些刺却会一直往肉里钻。狗回到家，只能趴在炉边，伤口不停流脓，直到刺慢慢穿出来。我亲眼见过豪猪刺穿过一条狗，从身体这边扎进去，最后又从另一边冒出来。
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            可怜的家伙。真不明白你怎么还忍心带它们去。
        - id: ch01-b25
          speaker: mr_wood
          text: >-
            有一回猎驼鹿，我们差点失去一条珍贵的猎犬。驼鹿一蹄子把它踢成重伤。它在林里躺了好几天，后来一位邻居进山找木料，才发现它，把它扛在肩上带回家。
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            看见老莱恩回来，我们这些男孩子不知有多高兴。大家照顾它，它后来完全好了。
        - id: ch01-b27
          speaker: mr_wood
          text: >-
            带狗猎熊时，双方混战的场面很有意思。熊跑得快，狗在后面咬它。熊一转身，狗就拼命逃。被熊抱住，狗一定会死。挨上一巴掌，也会当场被掀翻。刚学猎熊的狗，常死在熊掌下。
        - id: ch01-b28
          speaker: maxwell
          text: >-
            伍德先生，您家附近的熊很多吗？
        - id: ch01-b29
          speaker: mr_wood
          text: >-
            多得很，比我们想要的多。它们常来祸害牛羊，叫我们头疼透了。我经常半夜起床，跑出去照看牲口。熊从树林出来，扑到年轻母牛和母牛身上，又抓又打，把牛按倒。牛叫得像落在恶魔手里。要是离屋子太远，我们听不见，熊会一直撕咬折磨，直到把牛弄死。
        - id: ch01-b30
          speaker: mr_wood
          text: >-
            羊从来不反抗。看见熊，它们就乖乖逃到角落，挤成一团。熊挥爪乱抓，往往先伤十来只，才能牢牢抓住一只。然后，它用前爪抱着羊直起身，靠两条后腿走路，越过围栏，也跨过路上的一切东西。找到一处僻静的好地方，它才像屠夫一样剥下羊皮，坐在那里饱餐一顿。
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            第二天早上，我们看见其他受伤的羊，就发誓要找那头熊报仇。它多半还会回来。接下来一阵子，我们每晚把羊关进牲口棚，又在那只羊的残骸旁设下陷阱。
        - id: ch01-b32
          speaker: mr_wood
          text: >-
            大家都恨熊，几乎没人可怜它们。可说到底，它们不过像其他野兽一样寻找食物，我们没权使用那么残酷的钢夹。钢夹后面拖着沉重的坠木，夹口上长着又长又尖的铁齿。我们把它放在地上，用树叶遮住，再把熊吃剩的肉挂在附近，引它回来。
        - id: ch01-b33
          speaker: mr_wood
          text: >-
            熊来拿肉，一脚踩上机关，铁齿就猛地咬住它的腿。熊总会拼命挣脱。我见过一头熊，它的腿断了，皮肉全被撕掉，只剩筋腱还夹在里面。被夹住的是前腿。它用后脚抵住夹口，使劲蹬、使劲拉，把筋腱绷到了极限。
        - id: ch01-b34
          speaker: mr_wood
          text: >-
            有些熊会一直挣扎，最后真的把筋腱从脚里整个扯出来，这才逃掉。我们那里只要捕到一头熊，就是一件大事。捕熊的人吹响号角，男人和男孩便成群赶来看热闹。有人星期天早上也照样吹号。我亲眼见过那些男人背过礼拜堂，转身走开，宁愿去看那头熊。
        - id: ch01-b35
          speaker: miss_laura
          text: >-
            除了这种钢夹，就没有仁慈一点的办法吗？
        - id: ch01-b36
          speaker: mr_wood
          text: >-
            有，可以用落木陷阱。先把沉重的木桩打进地里，围成一个一面开口的箱子，再架好两根原木，上面压上别的重木。熊一叼诱饵，上面的原木就砸下来，把它压死。
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            也可以把诱饵放好，系上几根绳子，再把绳子连到远处几支枪的扳机上。熊拿走诱饵，枪就开火。这样，它等于开枪打死了自己。
        - id: ch01-b38
          speaker: mr_wood
          text: >-
            有的熊要挨许多枪才会死。我记得一头老熊，我们打进十一颗子弹，它才倒下。那年秋天，派克山的雪来得特别早。老熊还没来得及进洞冬眠。山上全是山毛榉，它吃了一秋天的榉果，整个身子肥得像黄油。
        - id: ch01-b39
          speaker: mr_wood
          text: >-
            我们一大群人带着狗追它。狗一路纠缠，我们把它从这儿赶到那儿，又一枪接一枪地打，最后它终于倒下了。我们把熊肉带回家，又把那张熊皮硝好，做成铺在雪橇上的毯子。
        - id: ch01-b40
          speaker: mr_wood
          text: >-
            有一天，我在树林里透过树木看见一头熊。它用后腿站在那里，鼻子朝四面八方嗅个不停。差不多就在我发现它的时候，它也发现了我。我没带狗，也没带枪，心想还是赶快回家吃饭为妙。
        - id: ch01-b41
          speaker: mr_wood
          text: >-
            那时我还是个小男孩。熊大概觉得，我怎么也够它吃上一口，就慢悠悠地追来。现在我还能看见自己逃跑的样子。帽子早不知飞到哪里去了，外套下摆在身后乱飘，两条胳膊伸在外面。每跑几步，我就越过肩头回望，瞪大眼睛，看它是不是又追近了。
        - id: ch01-b42
          speaker: mr_wood
          text: >-
            那老家伙看起来倒很慈祥，脸上仿佛写着：“别急呀，小男孩。”它根本没有拿出最快的速度，我很快就逃掉了。可那次以后我明白了，做追赶的那个，可比做被追的那个有趣多了。
        - id: ch01-b43
          speaker: mr_wood
          text: >-
            还有一回，我在自家玉米地里听见沙沙声。透过玉米秆一看，是一头棕熊带着两只幼崽。它用爪子推倒玉米秆，好吃上面的玉米棒。它闻见我，吓得转身就跑。
        - id: ch01-b44
          speaker: mr_wood
          text: >-
            这次我带着狗。我又喊又敲篱笆，叫狗去追。狗跳起来咬母熊的腰腹。每隔一会儿，母熊就回身一巴掌，把狗打出几码远。我一路追到农场后面，母熊和两只幼崽爬上了一棵树。
        - id: ch01-b45
          speaker: mr_wood
          text: >-
            我把狗打发回家，父亲和几位邻居赶来了。天已经黑了，我们就在树下生起一堆火，守了一整夜。大家轮流讲故事，靠这些故事让彼此保持清醒。
        - id: ch01-b46
          speaker: mr_wood
          text: >-
            快天亮时，我们还是犯困了，火也越来越小。没想到母熊和一只幼崽突然从树上落下来，正好掉到人群中间，接着拔腿跑进树林！这一下，我们顿时全醒了。大家赶紧把火烧旺，继续盯着树上剩下的幼崽，不让它趁机逃走。
        - id: ch01-b47
          speaker: mr_wood
          text: >-
            一直到天亮，母熊还在附近徘徊，不停呼唤树上的孩子下来。
        - id: ch01-b48
          speaker: miss_laura
          text: >-
            叔叔，你们让那只幼崽走了吗？
        - id: ch01-b49
          speaker: mr_wood
          text: >-
            没有，亲爱的。我们开枪打死了它。
        - id: ch01-b50
          speaker: mrs_wood
          text: >-
            太残忍了！
        - id: ch01-b51
          speaker: mr_wood
          text: >-
            是啊，我们那时候真是一群野蛮人。不过哈蒂，我们也不是毫无理由。那些熊会毁掉我们的农场。为了保护农场去猎熊，和只为了享受杀戮而追逐动物，完全不是一回事。
        - id: ch01-b52
          speaker: mr_wood
          text: >-
            我最不能忍受的，是那些英国人盛装打扮，骑着好马，带着一大群狗，跑遍乡野，只为追一只小狐狸或兔子。呸，真可鄙！要是他们追的是吃人的猛虎，或毁坏财产的野兽，那才另当别论。
