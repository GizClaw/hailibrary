  chapters:
    - id: ch01
      title: TRAPPING WILD ANIMALS
      blocks:
        - id: ch01-b01
          speaker: mr_wood
          text: >-
            Well, as you all know, I grew up in eastern Maine. We often crossed into New Brunswick for our sport, and moose were the finest game we had. Laura, have you ever seen one?
        - id: ch01-b02
          speaker: miss_laura
          text: No, Uncle, I haven't.
        - id: ch01-b03
          speaker: mr_wood
          text: >-
            When I was a boy, nothing in the world looked more beautiful to me than a moose. It had a dark hide, long legs, branching antlers, and shoulders higher than a horse's. Those legs are too long for grazing close to the ground, so moose feed on plant tops and the tender shoots and leaves of trees. They walk right through thick brush, turning their antlers skillfully so they won't catch on the branches. Each hoof comes down in just the right place. They step so surely and quietly that you can hardly hear a twig fall as they pass.
        - id: ch01-b04
          speaker: mr_wood
          text: >-
            Moose are timid most of the time, but not always. At certain times they'll attack anything in their way with their hoofs and antlers. They hate mosquitoes. When those insects are tormenting them, it's wise to be careful about going near. Like every creature, they have a wonderful amount of sense. A female may have one or two fawns. She takes them into the deepest part of the forest, or swims with them to islands in large lakes, and keeps them there until they can look after themselves.
        - id: ch01-b05
          speaker: mr_wood
          text: >-
            We liked catching moose, and we had several ways to do it. One was a snare. We'd make a loop in a rope and hide it under dead leaves on a path the moose used. The rope was attached to a young sapling with its top bent all the way down. When a moose stepped into the loop, it released the tree. The sapling sprang upright and tightened the rope around the animal's leg.
        - id: ch01-b06
          speaker: mr_wood
          text: >-
            We always set those snares deep in the woods, where we couldn't visit them very often. A moose might be trapped there for days. It would rage, tear around, and fight the rope until the skin was scraped from its leg. That was cruel. Today, even if someone offered me a hundred dollars, I wouldn't catch a moose in such a way.
        - id: ch01-b07
          speaker: mr_wood
          text: >-
            Another way was hunting them with dogs while we wore snowshoes. In February and March, the snow lay deep, with a crust that could carry the men and dogs. Moose don't live in herds. They wander across the forest in summer. When autumn comes, they gather in small groups. They choose one or two hundred acres where the undergrowth is thick and food is plentiful, and they usually stay inside that area. By keeping their tracks together there, they make it harder for enemies to discover where they are.
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            We called such a place a moose yard. We'd search the woods until we found tracks from one of its animals. Then the dogs caught the scent and ran ahead to drive the moose out. Even now, I can shut my eyes and see one of those hunts. A moose plunges through the crusted snow. Now and then it rises and strikes at the dogs clinging to its bleeding sides and legs. The hunters' rifles crack again and again, sometimes wounding or killing dogs as well as moose. That was cruel, too.
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            We also hunted moose by calling and by stalking. To call one, we rolled birch bark into a horn. We went out by bright moonlight, at evening, or early in the morning. The caller hid and made the low sound of a female moose. He had to imitate her well enough to fool the animals.
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            Somewhere in the distance, a moose heard the call. It answered with grunts and began coming toward us. A young male watched every step because he was afraid of the older ones. But an old male came on boldly. You could hear him striding through the woods, knocking his antlers against the trees and plunging straight into any water in his path.
        - id: ch01-b11
          speaker: mr_wood
          text: >-
            When he drew near, he'd stop and listen. The caller had to lower the birch horn close to the ground to make a deeper sound. If the moose became suspicious, he turned away. If he kept coming, he met our rifles. Some of us hid beside the caller, and others waited farther off.
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            When we stalked a moose, we crept after it like a cat after a mouse. Moose usually lie down during the day. We'd find their tracks and the places where they'd bitten the tips from branches and twigs, then follow the trail. They catch a person's scent easily, so we had to stay downwind.
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            Sometimes we found them lying down. But if we snapped a twig or made the least sound on the way, they thought a bear was creeping toward them. In a moment they were up and gone. Their hearing is very sharp, though their sight isn't as quick. Foxes are like that. A fox's eyes aren't as good as its nose.
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            Stalking is the most merciful way to kill a moose. The animal is spared the terror and pain of a chase.
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            I don't see why anyone needs to kill them. If the forest beyond the mountains were full of wild creatures, I'd be glad they were there. I wouldn't want to hunt harmless, beautiful animals like deer.
        - id: ch01-b16
          speaker: mr_wood
          text: >-
            You're a woman, and women are more merciful than men. Men always want to kill something. They're like the Englishman who looked at a fine day and decided it was time to go out and kill.
        - id: ch01-b17
          speaker: miss_laura
          text: Uncle, please tell us more about the dogs that helped you catch the moose.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            I sat very straight beside Miss Laura, listening to every word Mr. Wood said while she stroked my head.
        - id: ch01-b19
          speaker: mr_wood
          text: >-
            When we camped in the snow during a moose hunt, we slept on spruce boughs. The dogs curled up at our feet and kept us warm. The poor creatures had a hard time of it. They enjoyed the running and chasing as much as we did, but broken ribs and battered heads were another matter.
        - id: ch01-b20
          speaker: mr_wood
          text: >-
            Porcupines caused trouble, too. Our dogs never learned to leave them alone. If we crossed a part of the woods with no sign of moose and they found a porcupine, they'd kill it. Then quills stuck all through their mouths, necks, and chests. We had to gag the dogs to hold their mouths open. We pulled the nasty quills with bullet molds, nippers, jackknives, or whatever else we happened to have with us.
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            If we reached a dog at once, we could pull the quills out with our fingers. Otherwise, they worked farther in. A dog might go home and lie beside the fire with running sores until the quills finally came through. I've seen them pass right through a dog's body, entering on one side and coming out the other.
        - id: ch01-b22
          speaker: mrs_wood
          text: I feel sorry for those poor dogs. I wonder that you took them at all.
          emotion: sad
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            Once, on a moose hunt, we lost a valuable hound. A moose struck him with its hoof and hurt him terribly. He lay in the woods for days. Then a neighbor who was searching for timber found him and carried him home on his shoulders. How we boys rejoiced when old Lion came back! We cared for him, and he recovered.
          emotion: happy
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            Watching the dogs hunt a bear was exciting. Bears are strong runners, so there was plenty of dodging and fighting. The dogs raced up and nipped at the bear from behind. The moment it turned, they ran for their lives. If a bear caught a dog in a hug, that dog was sure to die. Even a slap from one of those great paws sent a dog tumbling. Bears often killed dogs that were new to the hunt and hadn't learned when to jump away.
        - id: ch01-b25
          speaker: mr_maxwell
          text: Were there many bears near your home, Mr. Wood?
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            More than we wanted. They caused dreadful trouble among our sheep and cattle. Many nights I had to jump up and run out to the herd. Bears came from the woods, leaped onto young heifers and cows, struck them, and beat them down. The cattle roared terribly. If they were too far from the house for us to hear, the bears worried them until they died.
        - id: ch01-b27
          speaker: mr_wood
          text: >-
            The sheep didn't resist. When a bear came, they ran meekly into a corner and crowded together. It struck and clawed them, sometimes wounding a dozen before it got a firm hold on one. Then it gripped that sheep in its paws, rose onto its hind legs, and walked over fences and anything else in the way until it found a quiet place.
        - id: ch01-b28
          speaker: mr_wood
          text: >-
            There the bear sat down, skinned the sheep like a butcher, and ate its fill. In the morning, we found the other injured sheep and swore we'd take revenge. The bear nearly always came back for more. For a while after an attack, we put the sheep in the barn at night and set a trap beside what remained of the one it had eaten.
        - id: ch01-b29
          speaker: mr_wood
          text: >-
            Everyone hated bears and felt little pity for them. Still, they were only finding meat the way other wild animals do. We had no right to use such cruel steel traps. Each one had long, sharp teeth and a heavy piece called a clog attached to it. We laid it on the ground, covered it with leaves, and hung some of the bear's leftover meat nearby.
        - id: ch01-b30
          speaker: mr_wood
          text: >-
            When the bear stepped toward the meat, the teeth sprang shut around its leg. The trapped animal always fought to escape. I once saw a bear after a desperate struggle. Its leg was broken. The skin and flesh had been torn away, and only the tendons held it. The trap had caught a front leg, so the bear braced its hind feet against the jaws and pulled until those tendons stretched as far as they could.
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            I've known bears to keep working and pulling until the tendons came right out of the trapped foot. That was how badly they fought to get free. Whenever someone caught a bear, it became a great event in our neighborhood. The person who set the trap blew a horn, and men and boys came hurrying from every direction to see. I've heard that horn sound on a Sunday morning. I've watched men turn their backs on the meetinghouse and go look at the bear instead.
        - id: ch01-b32
          speaker: miss_laura
          text: Wasn't there a kinder way to catch them than that trap?
        - id: ch01-b33
          speaker: mr_wood
          text: >-
            Oh, yes. There was the deadfall. We drove heavy stakes into the earth to make a boxlike space, open on one side. Two logs were arranged with more heavy logs above them. When the bear took the bait, the upper log dropped and crushed it to death.
        - id: ch01-b34
          speaker: mr_wood
          text: >-
            Another method used bait with cords tied to it. The cords ran to the triggers of guns set some distance away. When the bear pulled at the bait, the guns fired, and the bear shot itself.
        - id: ch01-b35
          speaker: mr_wood
          text: >-
            Sometimes a bear took many bullets to kill. I remember an old one that needed eleven before it fell. That happened one autumn on Pike's Hill. Snow had arrived early, and the bear hadn't gone into its den for the winter. The hill was full of beech trees. It had eaten nuts there all fall and grown as fat as butter.
        - id: ch01-b36
          speaker: mr_wood
          text: >-
            A group of us went after it with dogs. We harried the bear, drove it from place to place, and kept shooting until at last it dropped. We brought the meat home and had the hide tanned for a sleigh robe.
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            One day, while I was in the woods, I spotted a bear through the trees. It stood on its hind legs, sniffing in every direction. Just as I noticed it, it noticed me. I had no dog and no gun, so I decided it was time to go home for dinner.
        - id: ch01-b38
          speaker: mr_wood
          text: >-
            I was only a small boy. The bear probably thought I'd make a mouthful for him, so it began coming after me at an easy pace. I can still see myself racing through those woods. My hat had flown off, my jacket streamed behind me, and my arms stuck out as I ran. Every few moments, I rolled my eyes over my shoulder to see whether the bear was gaining.
        - id: ch01-b39
          speaker: mr_wood
          text: >-
            It looked like a kindly old fellow. Its face seemed to tell me not to hurry. The bear wasn't running its fastest, and I soon escaped. But that day I decided it was much more fun to chase than to be chased.
        - id: ch01-b40
          speaker: mr_wood
          text: >-
            Another time, I heard rustling in our cornfield. Through the stalks, I saw a brown bear with two cubs. She was knocking down corn with her paws to reach the ears. Then she smelled me, became frightened, and ran. This time I had a dog. I shouted, struck the fence, and sent him after her.
        - id: ch01-b41
          speaker: mr_wood
          text: >-
            The dog leaped and snapped at her sides. Every few moments, she turned and struck him with a paw, sending him yards away. I followed. Just behind the farm, the mother and both cubs climbed a tree. I sent the dog home, and my father and some neighbors came to join me.
        - id: ch01-b42
          speaker: mr_wood
          text: >-
            By then it was dark, so we built a fire beneath the tree. We settled down to watch all night and told stories to keep one another awake. Toward morning, we grew sleepy. The fire burned lower and lower. Then the old bear and one cub dropped from the tree right into the middle of us and dashed away toward the woods. That woke every one of us in a hurry.
        - id: ch01-b43
          speaker: mr_wood
          text: >-
            We rebuilt the fire and kept watch so the other cub couldn't escape. Until daylight, the mother stayed nearby, calling for it to climb down.
        - id: ch01-b44
          speaker: miss_laura
          text: Did you let the cub go, Uncle?
        - id: ch01-b45
          speaker: mr_wood
          text: No, my dear. We shot it.
        - id: ch01-b46
          speaker: mrs_wood
          text: How cruel!
          emotion: angry
        - id: ch01-b47
          speaker: mr_wood
          text: >-
            Yes, we were brutes, weren't we? But Hattie, we did have some excuse. The bears destroyed our farms. That's very different from hunting and killing only for the pleasure of slaughter.
        - id: ch01-b48
          speaker: mr_wood
          text: >-
            I have no patience with English people who dress in fine clothes, mount fine horses, and race across the countryside with packs of dogs after one little fox or rabbit. Bah! It's shameful. Hunting cruel, man-eating tigers or animals that destroy property would be another matter.
