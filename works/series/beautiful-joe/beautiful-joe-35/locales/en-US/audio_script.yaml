  chapters:
    - id: ch01
      title: BILLY AND THE ITALIAN
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Mr. Morris did not stay at the fire. He followed Mr. Montague for a little way, spoke quickly to some men nearby, and hurried home. After the great blaze, the streets seemed dark and dreary. It was still the middle of the night, but Mrs. Morris was dressed and waiting. She opened the door with a candle in one hand. I was frightened and miserable, and I could not bear to leave Mr. Morris, so I slipped inside behind him.
        - id: ch01-b02
          speaker: mrs_morris
          text: >-
            Please be quiet. Laura and the boys are asleep, and I thought it best not to wake them. What a terrible fire! Was it the hotel?
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Mr. Morris sank into a chair and hid his face in his hands.
        - id: ch01-b04
          speaker: mrs_morris
          text: >-
            William, answer me! You haven't been hurt, have you?
          emotion: fearful
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            She set down the candle and sat beside him. When he lowered his hands, tears were streaming down his cheeks.
        - id: ch01-b06
          speaker: mr_morris
          text: >-
            Ten people are dead. Mrs. Montague was one of them.
          emotion: sad
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Mrs. Morris stared at him in horror and gave a little cry.
        - id: ch01-b08
          speaker: mrs_morris
          text: >-
            William, no! That can't be true!
          emotion: surprised
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Mr. Morris could not keep still. He rose and paced across the room.
        - id: ch01-b10
          speaker: mr_morris
          text: >-
            Margaret, it was dreadful. I never want to see such a sight again. Remember how I argued against building that deathtrap? It stood among wide, open streets, yet they kept raising it higher and higher. The men who built it will have to answer to God for those deaths. Human life means so little to them. And that frail woman, suffering as she died...
          emotion: angry
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            He fell back into the chair and covered his face once more.
        - id: ch01-b12
          speaker: mrs_morris
          text: >-
            Where was she? What happened? Did her husband get out? And what about Charlie?
          emotion: fearful
        - id: ch01-b13
          speaker: mr_morris
          text: >-
            Charlie and Mr. Montague are safe. Charlie will get over it, but Montague's life is finished. You know how dearly he loved his wife. Oh, Margaret, when will men stop being fools? What must the Lord think when they ask, “Am I my brother's keeper?” And all the other poor souls who burned to death were just as precious to Him as Mrs. Montague was.
          emotion: sad
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Mr. Morris looked so weak and ill that Mrs. Morris asked no more questions. She built a fire, made hot tea, and had him lie on the sofa. She stayed beside him until daybreak. Then she persuaded him to go to bed. I followed her everywhere, touching her dress with my nose. After all the misery of that night, this kindly home felt very good to me. Once she stopped and held my head between her hands.
        - id: ch01-b15
          speaker: mrs_morris
          text: >-
            Dear old Joe, there is so much suffering in this world. Thank goodness there is a better world beyond it.
          emotion: sad
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Before breakfast, the boys went downtown and learned all they could about the fire. It began in a room on the hotel's top floor. Some reckless young men had stayed up late there, playing cards. They had smuggled in wine and drunk until they were senseless. One of them knocked over a lamp. The flames began to spread, and the young men could not put them out. But instead of waking anyone nearby, they ran downstairs to find people who could come up and help.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            By the time they returned with some hotel workers, the fire had raced from their room in an L-shaped wing at the back to the front of the building. That was where Mrs. Montague had her room, and where the housemaids who worked at the hotel had their sleeping rooms. Mr. Montague reached the upper floor, but flames and smoke filled the passage to his wife. Again and again he tried to force his way through. He could not reach her.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            For a while, Mr. Montague disappeared. Then he came to Mr. Morris, took Charlie, and carried him to some rooms above his bank. He shut himself away there with the boy and would let no one enter for several days. When he finally came out, he had the face of an old man, and his hair was white as snow. He went to his beautiful home beyond the town.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Nearly all the hotel's horses died in the fire. A few were led out under blankets that covered their heads. Most were so terrified that they refused to move.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            The Morris boys found the Italian sitting on an empty box, staring at the smoking hotel ruins. His head drooped against his chest, and tears filled his eyes.
        - id: ch01-b21
          speaker: italian
          text: >-
            My ponies are gone. So are my gander, my monkeys, my goat, and all my wonderful performing dogs. Only the birds are left. I worked my whole life to bring that trained troupe together, and now the fire has taken them all. It is cruel and wicked. I wish I could die.
          emotion: sad
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            The hotel staff had allowed him to keep the canaries, pigeons, and doves in his room, so those birds were safe. But his parrot was missing. It was an educated bird that could answer forty questions. It could even take a watch and tell the time.
        - id: ch01-b23
          speaker: jack_morris
          text: >-
            Your parrot is safe at our house, and it's certainly alive. It's been having a furious quarrel with our parrot, Bella.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            The old man's face brightened when he heard that. Then Jack and Carl found out that he had eaten no breakfast. They hurried to a nearby restaurant and brought him some steak and coffee. He thanked them over and over. As he ate, Jack said his tears fell right into his coffee cup.
        - id: ch01-b25
          speaker: italian
          text: >-
            I loved my animals so much. It made my heart bitter to hear them calling for me to save them from that raging fire.
          emotion: sad
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            The boys came home for breakfast and then went to school. Miss Laura stayed in all day. Her face was quiet and full of pain, and she could neither read nor sew. Mr. and Mrs. Morris were just as restless. They spoke softly about the fire. I could tell that the dreadful way Mrs. Montague died made them grieve even more than an ordinary death would have.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Her dear little canary, Barry, died with her. She never liked to be parted from him, so his cage had gone with her to the hotel's top floor. He probably died more easily than his poor mistress did. Charlie's dog escaped, but the fire frightened him so badly that he ran all the way to their home outside town.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            At teatime, Mr. Morris went downtown to make sure the Italian had a comfortable place to sleep. He returned with better news. The Italian was not nearly as old as he appeared. Mr. Morris had spoken of collecting money for him from the people of Fairport, and that hope had cheered him.
        - id: ch01-b29
          speaker: italian
          text: >-
            If you can help me in that way, I will try to gather another troupe of animals and train them.
        - id: ch01-b30
          speaker: mrs_morris
          text: >-
            What can we do for him? We can't offer much money, but perhaps we could give him one or two of our pets. Billy is clever, and he isn't even two years old. That man could teach him anything.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Every Morris child fell silent. Billy was such a gentle, lovable little dog that the whole family adored him.
        - id: ch01-b32
          speaker: miss_laura
          text: >-
            I suppose giving him away is the right thing to do. But how can we bear to lose him?
          emotion: sad
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            The family discussed it for a long time. In the end, they decided to give Billy to the Italian. When the man came to take him, he held his hat in his hand. He thanked them warmly and bowed again and again. Billy liked him at once. The Italian spoke to the little dog so gently that we knew he would have a kind master.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Mr. Morris collected a good deal of money for the Italian. When he handed it over, the poor man was so grateful that he kissed Mr. Morris's hand. He promised to send news often and tell the family how Billy was learning and how he was doing.
