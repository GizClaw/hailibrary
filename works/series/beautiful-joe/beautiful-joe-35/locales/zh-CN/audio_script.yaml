audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 正直沉稳，危急时焦灼而果断
        timbre: 温厚结实
        pace: 适中
        pitch: 中低
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 温柔明理，忧虑时仍镇定体贴
        timbre: 柔和清润
        pace: 适中
        pitch: 中
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 善良真挚，语气温柔而有分寸
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三十五章　比利和意大利人
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            莫里斯先生没有多停留。他沿着人行道跟着蒙塔古先生走了一小段，又匆匆同站在附近的几个人说了几句话，就赶回家去。看过那场大火的辉煌景象，沿途的街道显得又暗又冷清。虽说还是半夜，莫里斯太太已经穿好衣服，一手开门，一手举着蜡烛等他。我心里害怕，也很难过，不想离开莫里斯先生，就悄悄跟进了屋。
        - id: ch01-b02
          speaker: mrs_morris
          text: >-
            小声些。劳拉和男孩们都睡着了，我想还是别惊醒他们。那场火真吓人，是不是？烧的是旅馆吗？
          emotion: fearful
        - id: ch01-b03
          speaker: beautiful_joe
          text: 莫里斯先生一下坐进椅子，双手蒙住了脸。
        - id: ch01-b04
          speaker: mrs_morris
          text: 威廉，跟我说句话！你没有受伤吧？
          emotion: fearful
        - id: ch01-b05
          speaker: beautiful_joe
          text: 莫里斯太太把蜡烛放到桌上，挨着他坐下。莫里斯先生放下手，脸上全是泪。
        - id: ch01-b06
          speaker: mr_morris
          text: 死了十个人。蒙塔古太太也死了。
          emotion: sad
        - id: ch01-b07
          speaker: mrs_morris
          text: 威廉，这不可能！
          emotion: surprised
        - id: ch01-b08
          speaker: beautiful_joe
          text: 莫里斯太太惊骇地轻叫了一声。莫里斯先生根本坐不住，起身在屋里来回走。
        - id: ch01-b09
          speaker: mr_morris
          text: >-
            玛格丽特，那场面太可怕了，我再也不想见第二次。你记得我怎样反对盖那个死亡陷阱吧？周围的街道又宽又空，他们偏把楼一直盖到天上。造楼的人害死了这些人，上帝一定会向他们追问。怎么能这样不把人的命当回事？那个柔弱的女人临死时，不知道受了多少苦……
          emotion: angry
        - id: ch01-b10
          speaker: beautiful_joe
          text: 他说不下去了，又跌坐在椅子里，把脸埋进手中。
        - id: ch01-b11
          speaker: mrs_morris
          text: 她当时在哪儿？到底怎么出的事？她丈夫得救了吗？查理呢？
          emotion: fearful
        - id: ch01-b12
          speaker: mr_morris
          text: >-
            查理和蒙塔古都平安。查理会缓过来，可蒙塔古这一辈子算完了。你知道他多爱妻子。玛格丽特，男人们什么时候才不再做傻事？他们还问：“难道我是看守我兄弟的吗？”主会怎样看他们？还有那些被烧死的可怜人，在主眼里，他们的性命和蒙塔古太太的一样宝贵。
          emotion: sad
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            莫里斯先生又虚弱又憔悴。莫里斯太太明白丈夫再也经不起追问。她生起火，沏来热茶，让丈夫躺在沙发上，自己守到天亮，才劝他上床。我一直跟在她身边，不时用鼻子碰碰她的裙子。经历过那一夜的种种惨状，再回到这个温暖安宁的家，真叫我安心。她有一回停下来，双手捧住我的头，眼里含着泪。
        - id: ch01-b14
          speaker: mrs_morris
          text: 亲爱的老乔，这个世界有太多苦难。幸好离开这里以后，还有一个更好的世界。
          emotion: sad
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            第二天一早，男孩们没吃早餐就去了镇上。他们打听到，火是从旅馆顶层烧起来的。几个放荡的年轻人熬夜打牌，还偷偷带了酒，喝得昏昏沉沉。有人碰倒油灯，火很快蔓延开，他们已经扑不灭了。可他们没有叫醒附近的人，反倒跑到楼下找人上来帮忙。等他们带着旅馆里的人回来，火已经从后楼侧翼的房间烧到了前面。蒙塔古太太的房间和女佣们睡的地方，都在那里。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            蒙塔古先生已经赶上了楼，可通往妻子房间的走廊塞满浓烟和火焰。他一次次想硬闯过去，始终过不去。他一度不见踪影，后来又找到莫里斯先生，接走查理，把孩子带进银行楼上的房间，从此闭门不见人。几天后，他终于出来了。那张脸已经像个老人，头发白得像雪。他就这样回到镇外那座美丽的家。
        - id: ch01-b17
          speaker: beautiful_joe
          text: 旅馆里的马也几乎全被烧死了。人们用毯子蒙住几匹马的头，才把它们牵出来。大多数马却吓坏了，无论怎样也不肯挪动一步。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            男孩们还看见贝利尼坐在一只空箱子上，头垂在胸前，望着旅馆冒烟的废墟，眼里都是泪。他的小马、公鹅、猴子、山羊，还有那些会精彩表演的狗，全被烧死了，只剩下鸟儿。他辛苦一辈子才凑齐这支训练有素的动物表演队，如今一下子全没了。他觉得这件事又残酷又邪恶，甚至不想活了。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            旅馆的人先前准许他把金丝雀、鸽子和斑鸠带到自己的房间里，所以这些鸟都逃过一劫。那只受过训练的鹦鹉却丢了。它能回答四十个问题，还会接过一只表，告诉人们当时是几点钟。杰克说，那只鹦鹉正在莫里斯家里，活得好好的，还跟贝拉吵得不可开交。贝利尼一听，脸上立刻有了光彩。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            杰克和卡尔发现他没吃早饭，就去附近的餐馆买来牛排和咖啡。贝利尼感激极了。一边吃，眼泪一边掉进咖啡杯。他告诉男孩们，自己有多爱那些动物。听见它们在烈火里哭叫着，要他去救，他的心都苦透了。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            男孩们回家吃过早餐，照常去上学。劳拉小姐却整天没有出门。她一直安静地坐着，脸上满是痛苦，既看不进书，也做不了针线。莫里斯先生和太太同样心神不宁，只低声谈着火灾。我看得出来，蒙塔古太太以这种方式死去，比平常离世更让他们悲伤。
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            她心爱的小金丝雀巴里也和她一起死了。她从不肯同它分开，连鸟笼也带到了旅馆顶层。巴里大概比可怜的女主人少受了些苦。查理的狗倒逃了出来，可它吓坏了，一口气跑回镇外的家。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            到了喝茶的时候，莫里斯先生进城去，想替贝利尼找个舒服的地方过夜。回来后他说，贝利尼其实远没有看上去那么老。他同贝利尼谈起，可以在费尔波特居民中间为他募一笔钱。这个主意让贝利尼渐渐振作起来。他说，要是莫里斯先生肯帮忙，他就重新凑齐一支动物表演队，再把它们好好训练起来。
        - id: ch01-b24
          speaker: mrs_morris
          text: >-
            我们能为贝利尼做点什么呢？钱是拿不出多少，不过可以送他一两只宠物。比利就很合适。他那么聪明，还不到两岁，不管贝利尼想教什么，他都学得会。
        - id: ch01-b25
          speaker: beautiful_joe
          text: 孩子们一下全不说话了。比利温顺又可爱，全家没有一个人不喜欢他。过了好一会儿，劳拉小姐才开口。
        - id: ch01-b26
          speaker: miss_laura
          text: 我想，我们是应该把比利送给他。可是，我们怎么舍得呢？
          emotion: sad
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            大家商量了很久，最后还是决定把比利送给贝利尼。贝利尼上门来接它时，把帽子拿在手里，一次又一次鞠躬道谢。比利一见他就很亲近，贝利尼对它说话也十分温柔。我们都知道，比利会有一个好主人。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            莫里斯先生还替贝利尼募到了相当大的一笔钱。钱交到手里，这个可怜人欢喜极了，竟亲吻莫里斯先生的手，又答应常常捎来消息，让大家知道比利训练得怎样，日子过得好不好。
