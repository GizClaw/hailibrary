audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    jenkins:
      display_name: 詹金斯
      tts:
        delivery: 粗暴冷酷，话语短促
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    boy:
      display_name: 男孩
      tts:
        delivery: 活泼好奇，童真自然
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 中高
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，关切中自有力量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三章　善良的救命恩人与劳拉小姐
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            那时，一个年轻人正骑着自行车从大路上经过。他听到了我的惨叫，马上跳下车，沿着小路飞奔过来。詹金斯还没看见他，他已经冲到了我们中间。
        - id: ch01-b02
          speaker: mr_harry
          text: 你把这条狗怎么了？
          emotion: angry
        - id: ch01-b03
          speaker: beautiful_joe
          text: 我浑身疼得厉害，却听得出他的声音里满是怒火。
        - id: ch01-b04
          speaker: jenkins
          text: 我在给它剪耳朵，好让它去斗狗，年轻的先生。法律又没说不许我这么干。
        - id: ch01-b05
          speaker: mr_harry
          text: 法律也没说不许我揍你。
          emotion: angry
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            年轻人一把掐住詹金斯的喉咙，使出全身力气打他。詹金斯太太站到门口哭喊，却没有上前帮自己的丈夫。没过多久，詹金斯就浑身是伤，吓得不轻，直挺挺躺在了地上。
        - id: ch01-b07
          speaker: mr_harry
          text: 给我拿条毛巾来！
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            詹金斯太太扯下围裙，跑过来交给他。年轻人拿围裙裹住我，小心地抱着我往大门走。几个小男孩站在那里看，惊讶得嘴都合不上。他叫住了个头最大的那个。
        - id: ch01-b09
          speaker: mr_harry
          text: 小家伙，你跟在后面抱着这条狗，我给你二角五分钱。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            男孩接过我，我们就上路了。布把我裹得严严实实，我疼得一直呻吟，还是忍不住偶尔向外张望，想知道要去哪里。我们沿着进镇的路走，停在华盛顿街一所房子前。年轻人把自行车靠在屋边，掏出二角五分钱放进男孩手里，又轻轻抱起我，沿小径走到屋后。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            那里有一间小马厩。他进去把我放到地上，揭开了布。几个男孩正在附近玩，一看见我，声音都吓变了。
        - id: ch01-b12
          speaker: boy
          text: 啊，哈里表哥，这条狗怎么了？
          emotion: fearful
        - id: ch01-b13
          speaker: mr_harry
          text: 嘘，别嚷。杰克，你去厨房找玛丽，要一盆温水和一块海绵。别让你母亲和劳拉听见。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            几分钟以后，他已经洗净了我流血的耳朵和尾巴，又涂上一种清清凉凉的药，最后用棉布条扎紧。疼痛缓和了不少，我也终于有力气看看四周。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            这地方说是小马厩，其实更像男孩们的游戏室。玩具散得到处都是，两个角落还装着秋千和单杠，供他们攀着翻转。墙边的箱子里有只天竺鼠，正很感兴趣地看着我。它叫杰夫，后来和我成了好朋友。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            一只长毛法国兔在旁边蹦来蹦去。一个男孩肩上蹲着驯熟的小白鼠，不管男孩突然怎么动，它都抓得牢牢的。我想，马厩这么小，男孩又这么多，它大概怕下了地会被人踩到。它用红色的小眼睛使劲盯着我，看也不看空马栏深处那只模样古怪的灰猫。灰猫也从窝里望着我。外面阳光照着院子，鸽子在啄谷粒，一条西班牙猎犬躺在角落睡觉。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            我从没见过这么多动物安安静静待在一起，惊奇得差点忘了疼。过去，母亲和我见到老鼠和鸟总会追，有一次还咬死过一只小猫。我怎么也想不明白眼前这一切。就在这时，一个男孩喊了起来。
        - id: ch01-b18
          speaker: boy
          text: 劳拉来了！
        - id: ch01-b19
          speaker: mr_harry
          text: 快把那块破布收起来。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            哈里先生一脚踢开那条染满我鲜血的旧围裙。一个男孩赶紧把它塞进木桶，所有人都朝房子望去。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            一位年轻姑娘正从房子那边走来。她抬起一只手，挡着照进眼睛的阳光。那一刻，我觉得自己从没见过这么美丽的姑娘。直到今天，我还是这样想。她高挑纤细，有棕色的头发和棕色的眼睛，笑容甜美极了。只要看她一眼，便会喜欢上她。我站在马厩门口，目不转睛地望着她。
        - id: ch01-b22
          speaker: miss_laura
          text: 咦，这条狗的样子真有趣。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            她忽然停下来看我。我这才意识到，自己的模样一定很古怪。我回头看见尾巴上缠着白绷带，觉得不该让这么美丽的小姐看到自己这副样子，就悄悄躲进角落。
        - id: ch01-b24
          speaker: miss_laura
          text: 可怜的小狗，是我让你难过了吗？乖狗狗，你的头怎么了？
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            她朝男孩们甜甜一笑，从他们身边走过，来到天竺鼠的箱子前，弯下身看躲在后面的我。
        - id: ch01-b26
          speaker: boy
          text: 它的脑袋着凉了，我们就给它戴了一顶睡帽。
          emotion: happy
        - id: ch01-b27
          speaker: beautiful_joe
          text: 劳拉小姐猛地退了一步，脸色一下变得惨白。她看见了棉布上的血。
        - id: ch01-b28
          speaker: miss_laura
          text: 哈里表哥，是谁伤了这条狗？
        - id: ch01-b29
          speaker: mr_harry
          text: 亲爱的劳拉，它受伤了，我刚刚替它包扎好。
        - id: ch01-b30
          speaker: miss_laura
          text: 到底是谁伤了它？
        - id: ch01-b31
          speaker: mr_harry
          text: 我不想告诉你。
        - id: ch01-b32
          speaker: miss_laura
          text: 可我一定要知道。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            她的声音还是很温柔，态度却坚定得让哈里先生无法推托。他只好把事情从头说起。劳拉小姐听着，一直用手指轻轻抚摸我。等他说完怎样从詹金斯手中救下我，她平静地问他。
        - id: ch01-b34
          speaker: miss_laura
          text: 你会让那个人受到惩罚，对吗？
        - id: ch01-b35
          speaker: mr_harry
          text: 有什么用呢？就算罚了他，他还是会那么残忍。
        - id: ch01-b36
          speaker: miss_laura
          text: 可这样至少能管住他的残忍行为。
        - id: ch01-b37
          speaker: mr_harry
          text: 我不觉得这么做会有用。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            哈里先生还是不肯答应。劳拉小姐立刻挺直了身子。她的棕色眼睛闪着光，一只手指向我。
        - id: ch01-b39
          speaker: miss_laura
          text: >-
            哈里表哥！你真的要让这件事就这么过去吗？这只动物受了欺负，只能靠你替它讨回公道。那个胆小鬼害得它一辈子残缺，应该受到惩罚。孩子受了委屈，还能开口说出来。可怜的动物不会说话，只能默默忍着，忍着那么深的痛苦。
        - id: ch01-b40
          speaker: beautiful_joe
          text: 哈里先生想打断她，劳拉小姐却急切地说了下去。
        - id: ch01-b41
          speaker: miss_laura
          text: >-
            而且，你这样放过他，对他自己也不公平。他能狠心虐待自己的狗，也会虐待妻子和孩子。要是现在有人制止他，惩罚他的残忍，他也许还能改好。就算他的坏心肠改不了，他也会因为怕受罚，不得不在表面上善待家人。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            哈里先生被说服了。他羞愧得就像我的耳朵是他亲手剪掉的一样。他慢慢开口，又难为情地看了看周围的男孩。他们全都张着嘴，望着他和劳拉小姐。
        - id: ch01-b43
          speaker: mr_harry
          text: 那你想让我怎么做？
        - id: ch01-b44
          speaker: beautiful_joe
          text: 劳拉小姐从腰带上取下小怀表。
        - id: ch01-b45
          speaker: miss_laura
          text: 你现在就去告发那个人。已经五点了。你愿意的话，我陪你一起去警察局。
        - id: ch01-b46
          speaker: mr_harry
          text: 好吧。
        - id: ch01-b47
          speaker: beautiful_joe
          text: 哈里先生的脸顿时亮了起来。他和劳拉小姐一起朝房子走去。
