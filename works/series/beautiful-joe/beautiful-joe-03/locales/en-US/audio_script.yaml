  chapters:
    - id: ch01
      title: MY KIND DELIVERER AND MISS LAURA
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            A young man happened to be riding past on a bicycle. He heard me screaming, jumped off, and hurried up the path. He was standing among us before Jenkins even noticed him.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Even through my pain, I heard the young man demand an answer.
        - id: ch01-b03
          speaker: harry
          text: What have you done to that dog?
          emotion: angry
        - id: ch01-b04
          speaker: jenkins
          text: >-
            I've been cutting his ears so he'll fight. There's no law against that, is there, young gentleman?
        - id: ch01-b05
          speaker: harry
          text: Then there's no law against my giving you a beating.
          emotion: angry
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            In an instant, the young man had Jenkins by the throat. He struck him with all his strength. Mrs. Jenkins came to the doorway and cried, but she made no move to help her husband. Soon Jenkins lay on the ground, bruised and frightened.
        - id: ch01-b07
          speaker: harry
          text: Bring me a towel!
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            Mrs. Jenkins tore off her apron and ran down with it. The young man wrapped me in the apron, lifted me carefully, and carried me along the path to the gate. Several little boys stood there watching, their mouths open in surprise. He spoke to the largest one.
        - id: ch01-b09
          speaker: harry
          text: >-
            Sonny, follow me and carry this dog. I'll give you a quarter.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            The boy took me, and off we went. The cloth nearly covered me, and I moaned from the pain. Still, now and then I peeped out to see where they were taking me. We followed the road into town and stopped at a house on Washington Street.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            The young man rested his bicycle against the house and put a quarter into the boy's hand. Then he gently took me back into his own arms. He carried me up a lane that ran behind the house, where there was a small stable.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Inside, he set me on the floor and pulled away the cloth. Some boys were playing around the stable. The sight of me horrified them.
        - id: ch01-b13
          speakers: [jack, boy_1, boy_2]
          ensemble: chorus
          text: Oh, Cousin Harry! What happened to that dog?
          emotion: fearful
        - id: ch01-b14
          speaker: harry
          text: >-
            Hush. Don't make such a fuss. Jack, go to the kitchen and ask Mary for warm water and a sponge. Don't let your mother or Laura hear you.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            A few minutes later, Harry washed the blood from my ears and tail. He rubbed something cool and soothing on the wounds, then bound them firmly with strips of cotton. The pain eased enough for me to look around.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            It was a small stable, though no horse seemed to use it. The boys had turned it into a playroom. Toys lay here and there. In two corners stood a swing and an exercise bar, just the sort boys love to twist and tumble on.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            A guinea pig watched me with great interest from a box by the wall. His name was Jeff, and later we became good friends. A long-haired French rabbit hopped about nearby. A tame white rat sat on one boy's shoulder and held on, however suddenly the boy moved.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            With so many boys crowded into such a little stable, perhaps the rat feared being stepped on if he went down. He stared straight at me with his tiny red eyes. He never once looked toward the strange gray cat who was also watching me from her bed at the back of an empty stall.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Outside in the sunny yard, pigeons pecked at grain while a spaniel slept in a corner. I had never seen animals living together this way. Wondering at them almost made me forget my pain. My mother and I had always chased birds and rats, and once we had killed a kitten. I could not understand it at all.
        - id: ch01-b20
          speaker: boy_2
          text: Laura's coming!
        - id: ch01-b21
          speaker: harry
          text: Get that rag out of sight.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Harry kicked aside the old bloodstained apron that had covered me. One boy pushed it into a barrel. Then everyone turned toward the house.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            A young girl came up the walk from the house, shading her eyes from the sun with one hand. I thought I had never seen anyone so beautiful. I still think so. She was tall and slender, with lovely brown eyes, brown hair, and a sweet smile. One look at her made you love her. I stood in the stable doorway and stared as hard as I could.
        - id: ch01-b24
          speaker: laura
          text: Why, what an odd-looking dog!
          emotion: surprised
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            She stopped and looked at me. Until then, I had not wondered how strange I must appear. I turned my head and caught sight of the white bandage around my tail. I felt I was no sight for such a pretty young lady, so I crept into a corner.
        - id: ch01-b26
          speaker: laura
          text: >-
            Poor doggie, did I hurt your feelings? What's wrong with your head, good dog?
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            She smiled sweetly at the boys, passed them, and came to the guinea pig's box where I was hiding. She bent over me with a curious look.
        - id: ch01-b28
          speaker: boy_1
          text: >-
            His head caught a cold, so we gave him a nightcap.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            The boy laughed, but Laura drew back and turned very pale.
        - id: ch01-b30
          speaker: laura
          text: >-
            Cousin Harry, there's blood on this cotton. Who did this to the dog?
          emotion: surprised
        - id: ch01-b31
          speaker: harry
          text: >-
            Dear Laura, he was hurt. I've been putting bandages on him.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Harry came over and rested a hand on her shoulder.
        - id: ch01-b33
          speaker: laura
          text: But who hurt him?
        - id: ch01-b34
          speaker: harry
          text: I'd rather not tell you.
        - id: ch01-b35
          speaker: laura
          text: I want to know.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Laura's voice stayed gentle, but there was such decision in it that Harry had to tell her the whole story. As he described finding me and rescuing me from Jenkins, she kept softly touching me with her fingers. When he finished, she spoke quietly.
        - id: ch01-b37
          speaker: laura
          text: You'll have that man punished, won't you?
        - id: ch01-b38
          speaker: harry
          text: What good would that do? It wouldn't keep him from being cruel.
        - id: ch01-b39
          speaker: laura
          text: It would hold back some of his cruelty.
        - id: ch01-b40
          speaker: harry
          text: I don't believe it would help.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Harry answered stubbornly. At that, Laura stood very straight and tall. Her brown eyes flashed, and she pointed one hand toward me.
        - id: ch01-b42
          speaker: laura
          text: >-
            Cousin Harry! Are you really going to let this pass? This animal was wronged, and he must depend on you to make it right. The coward who has maimed him for life ought to be punished.
          emotion: angry
        - id: ch01-b43
          speaker: laura
          text: >-
            A child can speak and tell someone what has been done. A poor animal has no voice. It can only suffer in silence, in bitter, bitter silence.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            Harry tried to interrupt, but Laura pressed on eagerly.
        - id: ch01-b45
          speaker: laura
          text: >-
            And you're being unfair to the man himself. If he can treat his dog this badly, he'll treat his wife and children badly too. Punishment now might stop him and help him change. Even if his wicked heart stays the same, fear of punishment will make him behave kindly toward them.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            Harry looked convinced. He seemed almost as ashamed as if he had cut my ears himself. The boys were staring at him and Laura with their mouths open, and he glanced at them rather sheepishly.
        - id: ch01-b47
          speaker: harry
          text: What would you have me do?
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            He asked it slowly. Laura pulled a little watch from her belt.
        - id: ch01-b49
          speaker: laura
          text: >-
            Report him at once. It's five o'clock now. I'll go to the police station with you if you want me to.
        - id: ch01-b50
          speaker: harry
          text: Very well.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            Harry's face brightened, and he and Laura went away together toward the house.
