audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    harry:
      display_name: Cousin Harry
      tts:
        delivery: direct and energetic
        timbre: clear and youthful
        pace: brisk
        pitch: medium
    jenkins:
      display_name: Jenkins
      tts:
        delivery: rough and defiant
        timbre: coarse and heavy
        pace: deliberate
        pitch: low
    jack:
      display_name: Jack
      tts:
        delivery: lively and curious
        timbre: bright and youthful
        pace: quick
        pitch: high
    boy_1:
      display_name: First Boy
      tts:
        delivery: playful and outspoken
        timbre: light and youthful
        pace: quick
        pitch: high
    boy_2:
      display_name: Second Boy
      tts:
        delivery: eager and observant
        timbre: clear and youthful
