  chapters:
    - id: ch01
      title: CHAPTER XXXVI DANDY THE TRAMP
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            About a week after Billy left, the Morris family unexpectedly found themselves with a new dog. One cold winter afternoon, he walked straight into the house and calmly lay down by the fire. He was a brindled bull terrier with a silver-plated collar engraved with the name Dandy. He stayed by the fire all evening. Whenever anyone spoke to him, he wagged his tail and looked pleased. At first I growled at him a little. He paid no attention and simply fell asleep, so before long I stopped.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Dandy was so handsome and well bred that the Morrises feared someone had lost him. The next day, they asked around and learned that he belonged to a New York gentleman who had sailed to Fairport that summer in a yacht. Dandy hated the yacht. Whenever he could, he came ashore in a boat. If no boat would take him, he swam. His master called him a tramp who never stayed anywhere long. His boldness amused the Morrises. Instead of sending him away, they said each day that surely he would leave tomorrow.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            But Mr. Dandy had found comfortable lodgings and meant to keep them for a while. He was handsome and charming, and the family could not help liking him. I never did. He would fawn over the Morrises and pretend to love them, then turn away and laugh at them with a sneer that made me angry. Sometimes I lectured him or complained about him to Jim.
        - id: ch01-b04
          speaker: jim
          text: >-
            Leave him be. You won't make him any better. He was born bad, and so was his mother. Dandy says every dog in her neighborhood knew her as a thief and a runaway.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            Still, no matter how often Dandy annoyed me, some of his stories were so funny that I had to laugh. One day, we were lying in the sun on the platform behind the house. He had been especially provoking, and I rose to leave. Dandy stepped in front of me and coaxed me to stay.
        - id: ch01-b06
          speaker: dandy
          text: >-
            Oh, don't be cross, old fellow. Stay here, and I'll amuse you with a few stories. What would you like to hear about?
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            You could tell me the story of your life. That ought to be as interesting as anything you might invent.
        - id: ch01-b08
          speaker: dandy
          text: >-
            Very well. Fact or fiction, whichever you prefer. We'll begin with the plain facts. I was born and raised in New York, in a fashionable stable, with a fashionable coachman and master. My first memory is of ladies with jeweled fingers poking at me. My first painful memory is being sent to the vet to have my ears cut.
        - id: ch01-b09
          speaker: beautiful_joe
          text: What's a vet?
        - id: ch01-b10
          speaker: dandy
          text: >-
            An animal doctor. The first one didn't cut my ears short enough, so my master sent me back and had them cut again. It was summer, and the flies were terrible. My ears became sore and infected, and the flies never left them alone. The coachman told a little boy to brush the flies away, but the boy would run into the yard and leave me. I thought those flies would eat me alive, unless I shook my brains out first. My mother should have stayed home to lick my ears, but she was roaming through the neighborhood. At last the coachman shut me in a dark place and powdered my ears. Then they healed.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Why didn't they cut your tail as well? I looked at his long, thin tail, which reminded me of a sewer rat's.
        - id: ch01-b12
          speaker: dandy
          text: >-
            It wasn't the fashion, Mr. Behind-the-Times. People clip a bull terrier's ears so they won't be torn in a fight.
        - id: ch01-b13
          speaker: beautiful_joe
          text: But you're no fighting dog.
        - id: ch01-b14
          speaker: dandy
          text: Not me. Fighting is far too much trouble. I prefer an easy life.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            That sounds like you. I've noticed you never trouble yourself for anyone. But what do you really think about cutting dogs' ears?
        - id: ch01-b16
          speaker: dandy
          text: >-
            Well, it isn't pleasant. Still, you might as well leave the world as fall out of fashion. My ears are finished now, so I don't care.
        - id: ch01-b17
          speaker: beautiful_joe
          text: What about all the poor dogs that will come after you?
        - id: ch01-b18
          speaker: dandy
          text: >-
            Why should that matter to me? I'll be dead and gone. Men may cut off their ears, tails, and legs too, if that pleases them.
        - id: ch01-b19
          speaker: beautiful_joe
          text: Dandy, you are the most selfish dog I have ever met.
          emotion: angry
        - id: ch01-b20
          speaker: dandy
          text: >-
            Don't get excited. Let me continue. When I was a few months old, the stable yard began to feel too small, and I wondered what lay beyond it. I found a hole in the garden wall and started slipping out at night. What fun we had! I met plenty of street dogs. We barked beneath people's windows until they were furious, crept into backyards, and chased cats. We killed nearly one cat every night. Policemen chased us, and we ran until water streamed from our tongues and we could hardly breathe. Then I slept all day and went out again the next night.
        - id: ch01-b21
          speaker: dandy
          text: >-
            By the time I was about a year old, I stayed out by day as well as by night. No one could keep me home. Once I ran away for three months and lived with an old lady on Fifth Avenue who adored dogs. She owned four white poodles. Her servants washed them and tied their hair with blue ribbons. She drove them through the park in her phaeton, all wearing gold or silver collars. The largest poodle had a ruby in his collar worth five hundred dollars. I went driving too. Sometimes we passed my master. He would smile and shake his head. One day I heard him tell the coachman that I was a little blackguard and could come and go as I pleased.
        - id: ch01-b22
          speaker: beautiful_joe
          text: A sound whipping might have taught you to be a good dog.
        - id: ch01-b23
          speaker: dandy
          text: >-
            I'm good enough already. The young ladies who drove with my master said that being too good was tiresome and proper. Anyway, I stayed with Mrs. Judge Tibbett until her fussing wore me out. She made a perfect fool of herself over those poodles. Each had a high chair and a plate at her table. The servants called them Master Bijou, Master Tot, Miss Tiny, and Miss Fluff. One day they tried to put me in a chair. I became cross and bit Mrs. Tibbett. She beat me cruelly, and her servants drove me away with stones.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            Since we're speaking of fools, Dandy, and if it is polite to call a lady one, I think she was foolish. Dogs shouldn't be raised above their proper place. Why didn't she invite poor children to her table and into her carriage, then let the dogs run behind?
        - id: ch01-b25
          speaker: dandy
          text: >-
            You clearly don't know New York. Rich old ladies don't live with poor children. Besides, Mrs. Tibbett hated children. Poodles would disappear into the mud or be crushed in the crowd if they ran behind a carriage. Only clever dogs like me know how to get around.
        - id: ch01-b26
          speaker: beautiful_joe
          text: I doubted that, but I said nothing. Dandy went on in his superior way.
        - id: ch01-b27
          speaker: dandy
          text: >-
            Still, Joe, you have a point, as the French say. Mrs. Judge Tibbett didn't give those dogs enough exercise. Their claws grew as long as a Chinaman's nails, and hair covered the pads of their feet. Their eyes were red, and they were always ill. She kept dosing them with medicine and calling them her poor little sick doggies. Bah! I grew disgusted and ran away to her niece, Miss Ball. She was a sensible young woman who scolded her aunt for spoiling the poodles.
        - id: ch01-b28
          speaker: dandy
          text: >-
            In fact, Miss Ball was almost too sensible. Her pug and I were rubbed and scrubbed until we could hardly stand it, then sent on walks so long that I soon hated them. Every morning, a woman the servants called Trotsey fastened chains to us, and sometimes to one or two other dogs, and marched us through quiet streets. Walking dogs was her business. Miss Ball persuaded many fashionable young women who could not exercise their pets to hire her. They said the walks greatly improved the dogs' health and appearance. Trotsey earned fifteen cents an hour for each dog. Those walks gave us enormous appetites, and the dog biscuits vanished quickly.
        - id: ch01-b29
          speaker: dandy
          text: >-
            But life at Miss Ball's was slow. We saw her only briefly each day. She slept until noon, played with us in the greenhouse for a little while after lunch, then left to drive or visit. In the evening, she either entertained company or went to a dance or the theater. I decided to run away. One fine morning, I jumped through a window and went home. I stayed there quite a while. My mother had been killed beneath a cart, and I wasn't sorry. My master never concerned himself with me, so I did whatever I liked.
        - id: ch01-b30
          speaker: dandy
          text: >-
            Then one day, while I was out walking and greeting dogs I knew, a little boy came up behind me. Before I understood what was happening, he grabbed me and ran. I couldn't bite because he had stuffed part of his ragged clothes into my mouth. He carried me to a tenement in a part of the city I had never seen. His family was terribly poor. Six children and their parents lived in two tiny rooms. I hardly smelled a scrap of meat the whole time. I hated their bread and molasses, and the place smelled so foul that I thought I would choke.
        - id: ch01-b31
          speaker: dandy
          text: >-
            They shut me in those dirty rooms for days, and the brat who caught me slept with his arm around me. The weather was hot. Sometimes no one could sleep, and we all had to go onto the roof. Later they chained me in a filthy yard behind the house. I thought I would lose my mind. I wanted to bite every one of them, though I never dared. Being chained is dreadful, especially for a dog like me who loves freedom. Flies tormented me, noise drove me wild, and my whole body crawled from getting no exercise.
        - id: ch01-b32
          speaker: dandy
          text: >-
            I stayed there almost a month while they waited for someone to offer a reward. No one did. At last the boy's father, a street peddler, led me through the streets by my chain until he sold me. A gentleman bought me for his little boy, but I disliked his looks. I leaped up and bit his hand. He dropped the chain, and I dodged boys and policemen until I finally reached home, more dead than alive and thin as a skeleton. I enjoyed myself for several weeks, then grew restless and ran away again. But I'm tired now. I want to sleep.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            That's hardly polite. You offered to tell me a story, and now you mean to sleep before you've finished it.
        - id: ch01-b34
          speaker: dandy
          text: >-
            Look out for number one, my boy. If you don't, no one else will.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Dandy yawned, closed his eyes, and within minutes he was fast asleep. I sat looking at him. He was handsome and good-natured, and utterly worthless. A few days later, he finished his history. After many more wanderings, he happened to return home just as his master's yacht was about to sail. They chained him until he was aboard so he could entertain them on the voyage to Fairport.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Dandy arrived at our house in November and stayed all winter. He mocked the Morrises constantly. He called their home a dull, poky old place and claimed he remained only because Miss Laura was nursing him. She had discovered that a small sore on his back was mange. Her father said it was a serious disease and that Dandy ought to be shot. But Miss Laura begged for his life and promised to cure him within a few weeks, so she was allowed to keep him.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            Dandy was not capable of true anger, but the disease upset him as much as anything could. He said he had caught it from a little mangy dog he had played with several weeks earlier. They had been together only a short time, and Dandy had not expected to catch it. Still, he seemed to know how easily mange could spread.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Until he recovered, Miss Laura kept him apart from us in the loft with the rabbits, where we could not go. The boys ran him around the garden for exercise. Miss Laura tried many cures. Though mange was a skin disease, I heard her say that his blood must be purified. She gave him some of the pills she made from sulfur and butter for Jim, Billy, and me, the ones meant to keep our coats smooth and silky. When those failed, she gave him a few drops of arsenic each day. She washed the sore, and then his whole body, with either tobacco water or carbolic soap. The tobacco water finally cured him.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Miss Laura always wore gloves near Dandy and washed him with a brush. A person who catches mange from a dog may lose both hair and eyelashes. But careful nursing prevents harm, and I have never known anyone to catch it.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            At last Dandy's sore healed, and he was released. He said he was very glad because he was thoroughly tired of the rabbits. He used to bark at them until they became angry. Then they raced around the loft, stamping their hind feet in the funny way rabbits do. I believe they disliked him as much as he disliked them. Jim and I never caught the mange.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Dandy was not a strong dog. I thought his irregular life made him quick to catch diseases. When he was hungry, he stuffed himself, and he always craved rich food. If the Morrises would not give him what he wanted, he stole it elsewhere or searched the dumps behind the town.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            Once he became ill, he was more foolish about treating himself than any dog I knew. He never seemed to understand when grass, herbs, or a little earth would keep him well. A dog should always have grass. Dandy simply suffered through small ailments until he recovered and did nothing to help himself. Some dogs even know how to remove a useless limb. Jim told me about a dog the Morrises once owned named Gyp. A horse's kick had paralyzed Gyp's leg. He knew it was dead and gnawed it off almost to the shoulder. He was very sick for a time, but eventually recovered.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            As for Dandy, I knew he was waiting for spring so he could leave us, and I was not sorry. On the first fine day, he disappeared. Through the rest of spring and summer, we sometimes met him racing around town with a wild set of dogs. One day I stopped him and asked how he could bear to remain in a place as quiet as Fairport.
        - id: ch01-b44
          speaker: dandy
          text: >-
            I'm simply dying to return to New York. I keep hoping my master's yacht will come and carry me away.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            Poor Dandy never left Fairport. After all, he was not truly a bad dog. There was nothing vicious in him, and I hate telling how his life ended. His master's yacht never returned. Summer passed, winter drew near, and no one would take Dandy because his reputation was so poor. He became cold and hungry. One day, he sprang at a little girl to snatch the bread and butter she was eating. He had not noticed the large house dog lying on the doorstep. Before Dandy could escape, that dog seized him, bit him, and shook him until he was almost dead.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            When the house dog tossed him aside, Dandy crawled back to the Morrises. Miss Laura bandaged his wounds and made him a bed in the stable. One Sunday morning, she washed him and fed him with great tenderness, for she knew he could not live much longer. He was so weak that he could barely eat what she placed in his mouth. At last she let him lick a little milk from her finger.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            Miss Laura was leaving for church. I could not go with her, but I ran down the lane and watched until she disappeared. When I returned, Dandy was gone. I searched until I found him. He had crawled into the darkest corner of the stable to die. Though he suffered terribly, he never made a sound.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            I sat beside him and thought about his master in New York. If that man had trained Dandy properly, he might not have ended in this silent agony. A young puppy needs training just as a child does and must be corrected when he does wrong. Dandy had begun badly. No one stopped his harmful ways, and they had brought him here.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Poor Dandy. Poor, handsome dog of a rich master. He opened his dim eyes and looked at me once more. Then his torn body shuddered, and his limbs became still. He would never suffer again.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            When Miss Laura came home and learned that Dandy was dead, she cried bitterly. The boys carried him away from her and buried him in a corner of the garden.
