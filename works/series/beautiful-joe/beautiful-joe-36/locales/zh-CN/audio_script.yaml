audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    dandy:
      display_name: 丹迪
      tts:
        delivery: 油滑自得，爱挖苦人又漫不经心
        timbre: 明亮而圆润
        pace: 稍快
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 老练直率，判断事情干脆利落
        timbre: 厚实沉稳
        pace: 适中
        pitch: 低
  chapters:
    - id: ch01
      title: 第三十六章　流浪汉丹迪
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            比利走后大约一个星期，莫里斯一家怎么也没料到，家里又会多出一只狗。那是个寒冷的冬日下午。他径直进了屋，在炉火边安安稳稳地躺下。这是一只虎斑牛头㹴，脖子上戴着镀银项圈，上面刻着“丹迪”。整整一晚，他始终卧在火边。家里谁跟他说话，他就高兴地摇摇尾巴。我起初朝他低吼，他根本不理，只管打瞌睡，我也就不再吭声了。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            丹迪看起来很有教养，莫里斯一家怕是谁丢了狗，第二天便去打听。原来他的主人是一位纽约绅士，夏天乘游艇来了费尔波特。丹迪不喜欢待在游艇上，有小艇就坐小艇上岸，没有小艇就自己游。他的主人说，这狗是个流浪汉，到哪儿都住不长。莫里斯一家觉得他厚着脸皮住下的样子很好笑，没有赶他，只是天天说：“他明天一定会走。”
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            可丹迪先生找到了这么舒服的住处，眼下哪肯离开？他长得漂亮，又很会讨人喜欢，全家不由得喜欢上了他。我却一直不喜欢他。他当着莫里斯一家百般亲热，仿佛爱他们得不得了，背过身却又讥笑嘲弄他们，常把我气坏。我有时教训他，也对吉姆抱怨。
        - id: ch01-b04
          speaker: jim
          text: >-
            别管他。你教不好这只狗。他生来就坏，他母亲也不是好东西。听他说，那母狗在附近的狗群里名声糟透了，既偷东西，又总逃跑。
        - id: ch01-b05
          speaker: beautiful_joe
          text: 丹迪虽然老惹我生气，有些故事却实在滑稽，我听了也忍不住笑。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            一天，我们躺在屋后平台上晒太阳。他那天格外招人烦，我起身想走，他却拦在前面，哄着我开口。
        - id: ch01-b07
          speaker: dandy
          text: 老伙计，别生气嘛。我讲几个故事给你解闷。你想听什么？
        - id: ch01-b08
          speaker: beautiful_joe
          text: 你就讲自己这一辈子吧。大概不会比你编的故事差。
        - id: ch01-b09
          speaker: dandy
          text: >-
            行，真的编的都随你。先讲一段原原本本的真事。我在纽约出生，也在纽约长大。上等马房，上等马车夫，上等主人。我记得最早的事，就是太太小姐们拿戴满珠宝的手指戳我。第一次吃苦，是被送去剪耳朵。
        - id: ch01-b10
          speaker: beautiful_joe
          text: 送到哪里？
        - id: ch01-b11
          speaker: dandy
          text: >-
            兽医那里，就是给动物看病的医生。那兽医第一次剪得不够，主人又把我送回去，重新剪了一遍。偏偏赶上夏天，苍蝇多得吓人。耳朵疼，还化了脓，苍蝇全围着我转。马车夫叫一个小男孩赶苍蝇，那孩子却总跑到院子里，把我扔下。我真怕被苍蝇吃掉，又怕自己不停摇头，会把脑浆摇出来。母亲本该在家替我舔耳朵，可她正在外面四处游荡。后来马车夫把我关进一间黑屋，在耳朵上扑药粉，这才治好。
        - id: ch01-b12
          speaker: beautiful_joe
          text: 那他们为什么没把你的尾巴也剪掉？你这条细长尾巴，简直像阴沟里的老鼠尾巴。
        - id: ch01-b13
          speaker: dandy
          text: 那时候不时兴，老古董先生。牛头㹴只剪耳朵，免得打架时让别的狗撕破。
        - id: ch01-b14
          speaker: beautiful_joe
          text: 可你又不打架。
        - id: ch01-b15
          speaker: dandy
          text: 我才不打，太费事。我喜欢什么事都轻轻松松的。
        - id: ch01-b16
          speaker: beautiful_joe
          text: 这倒看得出来。你从来不肯替谁多费一点力气。那么，你觉得剪耳朵怎么样？我问完，丹迪狡黠地瞟了一眼我的头。
        - id: ch01-b17
          speaker: dandy
          text: >-
            剪耳朵当然不好受。不过嘛，赶不上时髦，活着也像不在世上一样。我的耳朵反正剪完了，如今我才不在乎。
        - id: ch01-b18
          speaker: beautiful_joe
          text: 那些后来还要挨这一刀的可怜狗呢？
        - id: ch01-b19
          speaker: dandy
          text: >-
            跟我有什么关系？那时候我早死了。人要是愿意，尽管把它们的耳朵、尾巴，连腿也一起砍掉。
        - id: ch01-b20
          speaker: beautiful_joe
          text: 丹迪，你是我见过最自私的狗。
          emotion: angry
        - id: ch01-b21
          speaker: dandy
          text: >-
            别激动，听我接着说。我才几个月大，就嫌马房的院子太小，总想看看外面。发现花园墙上有个洞以后，我常在夜里溜出去。那才叫痛快！我认识了一大群流浪狗。我们在人家窗下乱叫，把屋里的人气坏，再钻进后院追猫，差不多每晚都要咬死一只。警察一追，我们就拼命地跑，跑得舌头淌水，连气都喘不上来。然后我回家睡一整天，第二天夜里再出去。
        - id: ch01-b22
          speaker: dandy
          text: >-
            大约一岁的时候，我连白天也不肯回家了，谁也关不住我。有一次，我整整跑了三个月，住在第五大道一位爱狗的老太太家。她有四只白卷毛狗。仆人替它们洗澡，用蓝丝带扎起毛来。老太太坐轻便马车去公园，也带着它们。每只狗都戴金项圈或银项圈，最大那只的项圈上还有颗红宝石，值五百美元。我也跟着坐车，路上偶尔碰到原来的主人。他只看着我笑，摇摇头。我还听见他告诉马车夫，说我是个小无赖，往后爱来爱走都随我。
        - id: ch01-b23
          speaker: beautiful_joe
          text: 要是他们狠狠揍你一次，也许还能把你教好。
        - id: ch01-b24
          speaker: dandy
          text: >-
            我现在就够好。跟主人坐车的年轻小姐常说，一个人太规矩，只会自命不凡，叫人厌烦。好，继续讲。我受不了蒂贝特法官太太那些瞎忙活的规矩，最后离开了她。她宠那四只卷毛狗，简直把自己弄成傻瓜。每只狗在饭桌旁都有一把高脚椅和一只盘子，天天坐着陪她吃饭。仆人们还管它们叫比茹少爷、托特少爷、蒂妮小姐和弗拉夫小姐。有一天，他们逼我坐椅子，我一生气就咬了蒂贝特太太。她把我狠揍一顿，仆人们又扔石头，把我赶走了。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            丹迪，要是称一位太太为傻瓜不算失礼，我也要说她是个傻瓜。狗就该待在狗的位置。她为什么不请几个穷孩子坐她的餐桌和马车，再让狗跟在车后面跑？
        - id: ch01-b26
          speaker: dandy
          text: >-
            一听就知道你不了解纽约。穷孩子不会和有钱的老太太一起过日子，蒂贝特太太本来也讨厌孩子。再说，卷毛狗要是跟在车后，不是陷在泥里走丢，就是在人群中被踩死。只有我这种见过世面的狗，才知道怎么闯荡。
        - id: ch01-b27
          speaker: beautiful_joe
          text: 我不大相信，却没有开口。丹迪摆出高人一等的口气，又讲了下去。
        - id: ch01-b28
          speaker: dandy
          text: >-
            不过乔，用法国人的话说，你也有道理。蒂贝特法官太太没让狗好好活动。它们的爪子长得像中国人的指甲，脚垫上全是长毛，眼睛红红的，老是生病。她只好给它们灌药，还叫它们“我那可怜的小小乖乖病病狗儿”。呸，我真受不了她！我后来跑到她外甥女鲍尔小姐家。鲍尔小姐很明白事理，常责怪姨母不会养狗。可她差不多又明白过了头。她那只哈巴狗和我总被擦来洗去，皮都快给搓掉了，还每天走很远的路，走得我烦透了。
        - id: ch01-b29
          speaker: dandy
          text: >-
            每天早晨，一个叫特罗茜的女人会来，牵着我和哈巴狗，有时再带一两只别的狗，到僻静街道上走一大圈。她就是靠遛狗挣钱。鲍尔小姐还替她找来许多时髦小姐的狗。那些小姐没空遛狗，都说交给特罗茜以后，宠物看着精神多了，身体也好多了。她遛一只狗，每小时收十五美分。那些长路真叫我们胃口大开，狗饼干一转眼就没了！
        - id: ch01-b30
          speaker: dandy
          text: >-
            可鲍尔小姐家的日子太闷。我们一天只能见她一小会儿。她睡到中午，午饭后在温室里陪我们玩片刻，接着便坐车出门或去拜访别人。晚上，她不是在家待客，就是出去跳舞、看戏。我很快决定逃走。一个晴朗的早晨，我跳出窗子，跑回家去。这一次，我在家住了很久。母亲已经被马车轧死了，我一点也不难过。主人从不操心我，我爱怎样就怎样。
        - id: ch01-b31
          speaker: dandy
          text: >-
            有一天，我散步时遇见许多熟狗。一个小男孩从背后摸过来，我还没明白怎么回事，就被他抱起来带走了。我没法咬他，他把一块破布塞进了我的嘴。那孩子带我去了陌生城区的一栋公寓楼。他们家穷极了，父母加六个孩子，全挤在两间小屋里。我在那里几乎闻不到肉味，又讨厌他们的面包蘸糖蜜。屋里还臭得厉害，我都快喘不上气了。
        - id: ch01-b32
          speaker: dandy
          text: >-
            他们把我锁在脏屋里好几天。夜里，抓我的小鬼还搂着我睡。天气很热，大家有时睡不着，只好上屋顶。后来，他们把我拴在后院里。那院子又脏又臭，我快发疯了。要是我敢，真想把他们全咬死。被链子拴着太可怕，何况我这样爱自由。苍蝇不停地叮，四周吵个没完。我不能活动，浑身的肉都像爬着虫。他们等了快一个月，指望主人拿出赏金，却一直没有等到。
        - id: ch01-b33
          speaker: dandy
          text: >-
            最后，孩子的父亲牵我到街上去卖。他是个街头小贩。有位绅士买下我，要送给自己的小儿子。我不喜欢他的模样，跳起来咬了他的手。他松开链子，我躲过男孩和警察的追赶，终于逃回家。到家时，我瘦得只剩骨头，也累得只剩半条命。接下来几星期，我过得很痛快，可不久又待不住，再次跑了。好了，我讲累了，要睡觉。
        - id: ch01-b34
          speaker: beautiful_joe
          text: 是你自己说要讲故事的。现在还没讲完就睡，未免太没礼貌。
        - id: ch01-b35
          speaker: dandy
          text: 孩子，先顾好自己。你若不顾自己，谁也不会来顾你。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            丹迪打了个哈欠，闭上眼睛，没几分钟就睡熟了。我坐在旁边望着他。这只狗长得漂亮，性情随和，却一无是处。几天后，他才告诉我后来的经历。他离开家后又四处漂泊了很久。有一天，他碰巧回去，正赶上主人的游艇要启航。大家便把他牢牢拴住，一直带到船上。他们要让丹迪在前往费尔波特的航程中给大家解闷。
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            丹迪在十一月来到我们家，住了整整一个冬天。他一直拿莫里斯一家取笑，说那座老房子又闷又古板，自己肯留下来，只是因为劳拉小姐在照料他。他背上有一小块疮，劳拉小姐很快看出那是疥癣。她父亲说，这种病对狗很麻烦，最好把丹迪打死。劳拉小姐苦苦求情，说只要几星期就能治好，家里这才答应留下他。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            丹迪不会真的发怒，可这场病已经让他烦恼到了极点。他说，自己几星期前跟一只长疥癣的小狗玩过。明明只待了一小会儿，他以为不会传染，没想到这种病那么容易染上。
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            没治好以前，丹迪跟我们隔离开来。劳拉小姐把他安置在兔子住的阁楼，谁也不让我们进去。男孩们每天带他到花园跑一跑。劳拉小姐试了各种办法。她说，疥癣虽然长在皮肤上，也得把血净化。她先拿硫黄和黄油做的药丸喂丹迪。吉姆、比利和我平常也吃这种药，好让皮毛光滑。药丸没有治好他，她便每天喂几滴砒霜，又拿烟草水或石炭酸皂洗那块疮，后来干脆替他洗遍全身。最终是烟草水治好了他。
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            劳拉小姐每次靠近他都戴手套，清洗时也用刷子。因为人若从狗身上染到疥癣，头发和睫毛可能会脱落。不过只要处处小心，照顾一只患疥癣的狗并不会给人带来伤害。我也从没听说有谁真的从狗身上染过这种病。
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            过些日子，丹迪的疮愈合了，他也重获自由。他说自己早就受够了兔子，如今真是痛快。先前他总朝兔子叫，把它们惹火。兔子就在阁楼里乱跑，还用后脚砰砰跺地，那样子十分滑稽。我想，它们讨厌丹迪，正像丹迪讨厌它们一样。吉姆和我都没有染病。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            丹迪身体不强。我想，他那种没有规律的生活，使他特别容易生病。他饿了就拼命往肚里塞，又总想吃油腻丰盛的东西。在莫里斯家吃不到想要的，他就出去偷，或到镇后面的垃圾堆找食。
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            真病起来，他又比我见过的任何狗都不会照顾自己。他不知道什么时候该吃点草、药草或泥土，让身体恢复正常。狗的身边绝不能没有青草。丹迪只会忍着，等病自己过去，从不设法治好那些小毛病。有些狗甚至知道替自己截肢。吉姆讲过一只叫吉普的狗，也是莫里斯家从前养的。吉普被马踢了一脚，一条腿瘫痪了。他知道那条腿已经坏死，就把它一直啃到接近肩膀。后来虽然病了很久，最终还是活了下来。
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            再说丹迪。我知道他只是在等春天，好离开我们。我并不舍不得他。春天第一个晴朗的日子，他就走了。接下来的整个春天和夏天里，我们偶尔会碰见他跟一群放荡的狗在镇上乱跑。有一天，我拦住他，问他怎么受得了费尔波特这么安静的地方。他说自己想回纽约想得要命，正盼主人的游艇来接他。
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            可怜的丹迪再也没离开费尔波特。说到底，他不算那么坏，心里也没有真正的凶恶。我不愿意在他死后只说坏话。主人的游艇始终没有来。夏天过去，冬天又快到了。丹迪名声太坏，镇上没有人愿意收留他，只能在外面又冷又饿地挨日子。有一天，他扑向一个小女孩，想抢走她正在吃的那片黄油面包，却没看见门槛上趴着一只大看家狗。
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            丹迪还没来得及逃，那狗便咬住他，狠狠撕咬甩打，直到他快死了，才把他丢开。丹迪一点点爬回莫里斯家。劳拉小姐替他包好伤口，在马房里给他铺了床。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            一个星期日的早晨，劳拉小姐格外温柔地替丹迪清洗，又喂他吃东西。她知道他活不了多久了。丹迪虚弱得几乎咽不下送到嘴边的食物，她便让他舔自己手指上的一点牛奶。后来她去教堂，我不能跟着，就沿小路跑下去，一直望着她走远。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            等我回来，丹迪不见了。我到处寻找，最后发现他爬进马房最黑暗的角落，准备在那里死去。他痛苦极了，却没有发出一点声音。我坐在他身边，想起他在纽约的主人。若是主人从小好好教他，丹迪如今也许不会躺在这里，默默忍受临死的痛苦。幼犬和孩子一样，需要训练，做错事也该受管教。丹迪从一开始就走错了路，坏习惯又没人制止，最后才落到这里。
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            可怜的丹迪！富有主人家那只可怜而漂亮的狗！他睁开暗淡的眼睛，最后看了我一眼。接着，他抽搐着颤了一下，那些伤痕累累的腿便再也不动了。他再也不会受苦。
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            劳拉小姐从教堂回来，得知丹迪死了，伤心得放声痛哭。男孩们把丹迪从她身边抱走，在花园一角给他挖了一座坟。
