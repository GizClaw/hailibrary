audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    miss_laura:
      display_name: Miss Laura
      tts:
        delivery: gentle and quietly confident
        timbre: warm and clear
        pace: measured
        pitch: medium
    malta:
      display_name: Malta
      tts:
        delivery: affectionate and expressive
        timbre: soft and feline
        pace: lively
        pitch: high
    mr_morris:
      display_name: Mr. Morris
      tts:
        delivery: thoughtful and principled
        timbre: deep and steady
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: MALTA THE CAT
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            The first time I got a good look at the Morris family's cat, I thought she was the strangest animal I had ever seen. She was dark gray, just like a mouse, with yellow-green eyes. For my first few days in the house, those eyes looked very unfriendly whenever they turned toward me.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Before long, she stopped disliking me, and we became close friends. She was beautiful, gentle, and loving, and everyone in the family adored her.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Her name was Malta. She was three years old, and sailors had brought her to Fairport on a ship after finding her in a faraway place. People called her a Maltese cat.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            I have met many cats, but never one as kind as Malta. Once, all her little kittens died. She was heartbroken and wandered through the house crying until anyone who heard her felt sad too.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            Then she disappeared into the woods. When she returned, she carried a tiny squirrel in her mouth. She put it in her basket and cared for it like a mother until it was old enough to run away.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Malta was clever and always came when someone called her. Miss Laura wore a small silver whistle for calling her pets. Its sharp note carried a long way from the house.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Sometimes Miss Laura stood at the back door and whistled for Malta. Soon a pretty gray head appeared somewhere high above the ground, because Malta loved to climb. She came racing along the fence and called out in her own short, funny way.
        - id: ch01-b08
          speaker: malta
          text: Meow, meow!
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Miss Laura might pet her, feed her, or carry her around the garden on one shoulder. Malta was so affectionate that if she could not lick Miss Laura's face, she licked her hair with her small, rough tongue. By the fire, she often licked my coat or little Billy's to show that she loved us too.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Mary, the cook, loved cats and kept Malta in the kitchen whenever she could. But no one could make Malta stay downstairs when music began above. Every Morris pet loved music.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            As soon as Miss Laura sat at the piano to sing or play, we came from every part of the house. Malta cried to be let upstairs. Davy raced through the hall, with Bella close behind. If I was outside, I ran in, while Jim climbed onto a box and watched through the window.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Davy settled on Miss Laura's shoulder and tucked his pink nose into the curls at the back of her neck. Malta, Bella, and I sat together under the piano. None of us moved until the music ended. Then we quietly went our separate ways.
    - id: ch02
      title: MALTA FACES THE DOGS
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            There was no question that Malta was a beautiful cat. When I lived with Jenkins, I thought cats were pests, no better than rats, and I chased every one I could. Mrs. Jenkins owned a thin, long-legged yellow cat that ran whenever one of us so much as looked at it.
        - id: ch02-b02
          speaker: beautiful_joe
          text: >-
            Malta had always been treated kindly, so she never ran from people. She did avoid strange dogs, because she knew they might hurt her. If one surprised her, though, she stood her ground. I once watched her frighten a big mastiff that lived a few blocks away, and he deserved every bit of it.
        - id: ch02-b03
          speaker: beautiful_joe
          text: >-
            That day, someone had shut me in the parlor, and I could not get out. From the window, I watched Malta step carefully across the muddy street. She looked soft, lovely, and sweet-tempered. Then the mastiff charged at her from an alley, and she did not look sweet anymore.
        - id: ch02-b04
          speaker: beautiful_joe
          text: >-
            Malta sprang backward and glared at him like a small, fierce tiger. Her tail puffed up until it looked enormous. Her eyes seemed to burn like balls of fire. She spat and snarled as if she meant to tear him apart if he touched her.
        - id: ch02-b05
          speaker: beautiful_joe
          text: >-
            For all his size, the mastiff did not dare attack. He circled her like a great clumsy elephant. Malta turned whenever he turned, always facing him, and never stopped her terrible hissing and spitting.
        - id: ch02-b06
          speaker: beautiful_joe
          text: >-
            Then I saw a Spitz hurrying down the street to help the mastiff. Two dogs could badly hurt Malta. I had barked, but no one came to open the door, so I hurled myself through the window.
        - id: ch02-b07
          speaker: beautiful_joe
          text: >-
            Just then, Malta spotted the second dog and knew she had to get rid of the first one. In one quick leap, she landed on the mastiff's back and dug in her sharp claws. He tucked his tail between his legs and ran up the street, howling in pain. Malta rode him for a short distance, jumped off, and dashed up the lane toward the stable.
        - id: ch02-b08
          speaker: beautiful_joe
          text: >-
            I was furious and wanted something to fight, so I threw myself at the Spitz. He was a snarling, bad-tempered dog and no friend of Jim or me. He would have been glad to help kill Malta.
        - id: ch02-b09
          speaker: beautiful_joe
          text: >-
            I gave him one of the worst beatings he had ever had. Perhaps I should not have done it, because Miss Laura said dogs must never fight. Still, he had tormented Malta before, and she belonged to our family. Jim and I had never bothered his cat.
        - id: ch02-b10
          speaker: beautiful_joe
          text: >-
            I had wanted to shake him for a long time. Now I found his throat beneath his thick fur and dragged him all over the street. When I finally let him go, he had learned to behave civilly, and he never troubled us again.
        - id: ch02-b11
          speaker: beautiful_joe
          text: >-
            Malta thanked me by licking the little place where the Spitz had bitten me. No one scolded me for breaking the window. Mary had watched from the kitchen and told Mrs. Morris that I had gone out to help Malta.
    - id: ch03
      title: MALTA LEARNS TO SPARE THE BIRDS
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            Malta was a very wise cat. She understood that the parrot and the canaries must never be harmed. Even when no one else was in the room, she made no attempt to catch them.
        - id: ch03-b02
          speaker: beautiful_joe
          text: >-
            I often saw her stretched in the sunshine, blinking sleepily while she listened with great pleasure to Dick singing. Miss Laura even taught Malta to leave the outdoor birds alone.
        - id: ch03-b03
          speaker: beautiful_joe
          text: >-
            For a long time, Miss Laura tried to make her understand that catching the little sparrows near the door was cruel. Soon after I arrived, the lesson finally took hold.
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            Malta loved Miss Laura so much that whenever she caught a bird, she carried it home and laid it at her feet. Miss Laura picked up the small dead creature, stroked it with pity, and scolded Malta until the cat crept into a corner. Then she placed the bird on a tree branch while Malta watched closely from her corner.
        - id: ch03-b05
          speaker: beautiful_joe
          text: >-
            One day, Miss Laura stood at a window looking into the garden. Malta lay on the platform, staring at sparrows as they pecked crumbs from the ground. Every few minutes, the cat trembled and started to rise. Then she settled down again. She was struggling with all her might not to stalk them.
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            Soon a neighbor's cat crept along the fence, watching Malta with one eye and the sparrows with the other. Malta flew into a rage. She jumped up and chased the other cat away.
        - id: ch03-b07
          speaker: beautiful_joe
          text: >-
            Afterward, Malta returned to the platform and lay down to wait for the sparrows. She stayed there a long time. Not once did she try to catch them.
        - id: ch03-b08
          speaker: beautiful_joe
          text: >-
            Miss Laura was delighted. She went to the door and called very softly.
        - id: ch03-b09
          speaker: miss_laura
          text: Come to me, Malta.
          emotion: happy
        - id: ch03-b10
          speaker: beautiful_joe
          text: >-
            Malta lifted her tail and came inside with a gentle meow. Miss Laura gathered her into her arms and carried her down to the kitchen.
        - id: ch03-b11
          speaker: miss_laura
          text: >-
            Mary, please give the best cat in the United States of America a saucer of your very sweetest milk.
          emotion: happy
        - id: ch03-b12
          speaker: beautiful_joe
          text: >-
            Everyone praised Malta, and I never knew her to catch another bird. She had plenty to eat at home and no need to hurt such harmless little creatures.
    - id: ch04
      title: THE ROAD HOME
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            Malta loved her home and never wandered far the way Jim and I did. Once, Willie planned to spend several weeks with a young friend who lived fifty miles from Fairport. He decided Malta ought to come with him.
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            His mother warned him that cats did not enjoy leaving home. Willie promised to take good care of Malta and begged so earnestly that she finally let him take her.
        - id: ch04-b03
          speaker: beautiful_joe
          text: >-
            A few days after he arrived, Willie wrote to say Malta had run away. She had been miserable there. Though he kept her beside him all the time, she always acted as if she wanted to escape.
        - id: ch04-b04
          speaker: beautiful_joe
          text: >-
            When Mr. Morris heard the letter, he understood at once.
        - id: ch04-b05
          speaker: mr_morris
          text: >-
            Malta is heading home. Cats are wonderfully clever at finding their way back to the place where they live. She must be exhausted. We should go and meet her.
        - id: ch04-b06
          speaker: beautiful_joe
          text: >-
            Willie had made the trip by coach. Mr. Morris hitched up a buggy, took Miss Laura and me, and drove out to search for Malta. We traveled slowly along the road. Every little while, Miss Laura blew her whistle and called her name, while I barked as loudly as I could.
        - id: ch04-b07
          speaker: miss_laura
          text: Malta! Malta!
        - id: ch04-b08
          speaker: beautiful_joe
          text: >-
            Mr. Morris drove for several hours. We stopped at a house to eat dinner and then set out once more. In a thick wood, the road ran fairly straight ahead. Far down it, I noticed a small dark creature trotting toward us. It was Malta.
        - id: ch04-b09
          speaker: beautiful_joe
          text: >-
            I barked with joy, but she did not recognize me and plunged into the trees. I raced after her, barking and yelping, while Miss Laura blew her whistle with all her strength.
        - id: ch04-b10
          speaker: beautiful_joe
          text: >-
            Soon a little gray head peered from the bushes. Malta bounded out, stared at me in surprise, and leaped into the buggy, straight onto Miss Laura's lap.
        - id: ch04-b11
          speaker: beautiful_joe
          text: >-
            How happy she was! She purred with delight and licked Miss Laura's gloves again and again. Then she ate the food they had brought and fell sound asleep. She was terribly thin, and once she was home, she spent most of the next several days sleeping.
    - id: ch05
      title: MALTA HELPS ANOTHER CAT
      blocks:
        - id: ch05-b01
          speaker: beautiful_joe
          text: >-
            Malta did not care for dogs, but she was very kind to other cats. One quiet day, when no one else was nearby, I saw her slip into the stable. She came out again with a sick, starving cat behind her. The poor animal's eyes were sore. People from the next street had abandoned her.
        - id: ch05-b02
          speaker: beautiful_joe
          text: >-
            Malta led the cat to her bed of catnip and watched kindly as her guest rolled and rubbed against the plants. Then Malta took a turn herself, and together they went back into the stable.
        - id: ch05-b03
          speaker: beautiful_joe
          text: >-
            Cats love catnip, so Miss Laura always kept some growing for Malta.
        - id: ch05-b04
          speaker: beautiful_joe
          text: >-
            The sick cat lived in the stable for a long time. Malta carried food to her every day. At last, Miss Laura discovered her and did everything she could to help her recover.
        - id: ch05-b05
          speaker: beautiful_joe
          text: >-
            In time, the frail animal became a strong, sturdy-looking cat. Miss Laura found her a new home with a lady who was ill.
        - id: ch05-b06
          speaker: beautiful_joe
          text: >-
            Feeding abandoned cats was nothing unusual for the Morrises. Mrs. Morris said that in some summers she cared for a dozen of them. Careless, cruel people left town for the season and shut up their houses without making any arrangements for the cats that had rested comfortably beside their fires all winter.
        - id: ch05-b07
          speaker: beautiful_joe
          text: >-
            At last, Mrs. Morris began placing a small notice in the Fairport newspaper. It asked everyone leaving for the summer to make sure their cats would be cared for while they were gone.
