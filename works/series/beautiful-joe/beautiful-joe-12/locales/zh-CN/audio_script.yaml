audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 温厚稳重，言语清楚有分寸
        timbre: 醇厚温和
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十二章　猫咪玛尔塔
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我头一回仔细看莫里斯家的猫，觉得她是我见过模样最古怪的动物。她一身深灰，跟老鼠的颜色一模一样，一双眼睛黄里带绿。我刚到莫里斯家的那几天，她看我的眼神很不友好。后来，她不再讨厌我，我们成了很好的朋友。其实，她长得很漂亮，性情温顺，又爱亲近人，全家都很疼她。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            她三岁，名叫玛尔塔，是一只马耳他猫。几个水手从一个遥远的地方得到了她，又坐船把她带到费尔波特。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            我见过很多猫，却没见过哪只像玛尔塔这么仁慈。她生过几只小猫，可小猫全死了，她伤心得心都快碎了。她整天在屋里哀叫，听得人也跟着难过。后来，她跑进树林，回来时嘴里衔着一只小松鼠。她把小松鼠放进自己的篮子，像母亲那样喂养它，直到它长大，能离开她独自跑掉。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            玛尔塔很聪明，一叫就来。劳拉小姐常戴着一只小银哨，想叫宠物时就吹响它。那哨声又尖又亮，我们离家很远也能听见。我常看见劳拉小姐站在后门吹哨，叫玛尔塔回来。没多久，这个漂亮的小家伙就会从某个高处探出脑袋。她最会爬了，总是沿着篱笆顶跑过来，嘴里短短地叫着“喵，喵”，声音有趣极了。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            劳拉小姐有时摸摸她，有时给她东西吃，也会让她趴在肩上，带她绕着花园散步。玛尔塔特别爱亲近人。劳拉小姐不让她舔脸，她就用粗糙的小舌头去舔小姐的头发。她还常躺在炉火边，替我或小比利舔毛，让我们知道她有多喜欢我们。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            厨娘玛丽喜欢猫，总想把玛尔塔留在厨房。可只要楼上有音乐，谁也留不住她。莫里斯家的宠物都爱听音乐。劳拉小姐一坐到钢琴前唱歌或弹琴，我们就从屋子各处赶来。玛尔塔叫着要上楼，戴维飞快地穿过门厅，贝拉紧紧跟在后面。我若在外面，也会马上跑进屋。吉姆则跳上一只箱子，隔着窗户听。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            戴维总待在劳拉小姐肩头，把粉红的小鼻子埋进她后颈的卷发里。我和玛尔塔、贝拉一起坐在钢琴下面。音乐不停，我们谁也不动。等最后一个音落下，大家才安安静静地走开。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            玛尔塔的确漂亮。从前跟着詹金斯时，我可不懂这个。我以为猫和老鼠一样，都是害人的东西，一有机会就追。詹金斯太太养过一只黄猫，腿长，瘦得只剩骨头。我们朝它看一眼，它就吓得逃跑。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            玛尔塔一直受到善待，所以见了谁也不逃，陌生的狗除外。她知道，那些狗很可能伤害她。要是突然撞上了，她会转身迎战。真被逼急时，她很会打架。我就见过她和住在几条街外的一只大獒犬交手，还把对方吓得不轻。那家伙纯粹活该。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            那天，我被人关在客厅里，门打不开，只能隔着窗户看玛尔塔。她正小心挑着落脚的地方，轻巧地穿过泥泞的街道。她毛茸茸的，又漂亮又温顺。可那只獒犬突然从巷子里冲出来时，她一下就变了模样。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            玛尔塔猛地往后一跳，瞪住獒犬，活像一只凶猛的小老虎。她的尾巴蓬得大极了，眼睛像两团火。她朝对方喷气低吼，仿佛在警告它，你敢碰我，我就把你撕碎！
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            獒犬身子虽大，却不敢扑过去。它像一头笨重的大象，绕着玛尔塔转了一圈又一圈。玛尔塔也随着它转动小小的身体，一刻不停地嘶叫、喷气。忽然，我看见一只斯皮茨犬沿街赶来。它要去帮獒犬，玛尔塔这下要受重伤了。我叫了半天，没人来放我出去，只好纵身撞破窗户，跳到外面。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            就在这时候，情势变了。玛尔塔也看见了第二条狗，知道得先摆脱獒犬。她敏捷地跳上獒犬的背，把尖爪深深扎进去。獒犬疼得夹起尾巴，沿街狂奔，一路哀号。玛尔塔骑着它跑了一小段，便跳下来，沿小巷逃进马厩。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            我气坏了，只想找个东西狠狠干上一架，便朝那只斯皮茨犬扑过去。那家伙凶巴巴的，脾气又坏，从来不是我和吉姆的朋友。要是能帮着杀死玛尔塔，它一定巴不得呢。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            我狠狠揍了它一顿，那大概是它这辈子挨过最厉害的痛打之一。我知道自己这么做也不完全对，劳拉小姐说过，狗不该打架。可它以前就欺负过玛尔塔，实在不该那么做。玛尔塔是我们家的一员，我和吉姆从没欺负过它家的猫。我早就想狠狠摇晃它一次了。这回，我隔着厚毛咬住它的喉咙，把它拖得满街乱转，最后才松开。打那以后，它见了我们总算规矩起来。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            玛尔塔很感激我，替我舔了舔被斯皮茨犬咬伤的地方。我撞坏窗户也没有挨骂。玛丽从厨房窗口看见了一切，告诉莫里斯太太，我是为了帮助玛尔塔才冲出来的。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            玛尔塔非常懂事。她知道不能伤害鹦鹉和金丝雀。就算屋里只留下她和这些鸟，她也从来不去捉。我还见过她躺在阳光里，困倦地眨着眼，听迪克唱歌，听得满心欢喜。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            劳拉小姐甚至教会她，不去捕捉屋外的鸟。小姐花了很长时间，才让她明白，门前的小麻雀不能捉，伤害它们太残忍。我来到这个家不久以后，玛尔塔终于学会了。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            玛尔塔太爱劳拉小姐了。每次捉到鸟，她都会衔来放在小姐脚边。劳拉小姐就捧起死去的小东西，怜惜地摸几下，再责备玛尔塔，直到她悄悄躲进墙角。然后，小姐把小鸟放到树枝上。玛尔塔待在角落里，目不转睛地看完这一切。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            有一天，劳拉小姐站在窗前看花园。玛尔塔趴在门外的平台上，盯着那些在地面啄面包屑的麻雀。她浑身发颤，隔一会儿就半站起来，像是要扑过去，可随后又重新卧下。她拼命忍着，不肯偷偷靠近麻雀。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            过了一会儿，邻居家的猫沿篱笆悄悄走来，一只眼看玛尔塔，另一只眼盯着麻雀。玛尔塔气坏了。她猛地跳起来，把那只猫赶走，然后又回到平台上卧下，等麻雀飞回来。她在那里待了很久，一次也没有试着捉它们。
        - id: ch01-b22
          speaker: beautiful_joe
          text: 劳拉小姐高兴极了。她走到门口，轻声唤她。
        - id: ch01-b23
          speaker: miss_laura
          text: 玛尔塔，到这儿来。
          emotion: happy
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            玛尔塔竖起尾巴，轻轻喵了一声，走进屋里。劳拉小姐抱起她，来到厨房，请玛丽给这只全美利坚合众国最乖的猫一碟最甜美的牛奶。大家大大夸了玛尔塔一番。从那以后，我再没听说她捉过鸟。她在家里吃得很好，也根本不需要伤害那些无辜的小生命。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            玛尔塔很依恋自己的家，从不像我和吉姆那样跑到远处。有一次，威利要去小朋友家住几个星期。那孩子住在离费尔波特五十英里的地方。威利心血来潮，非要带玛尔塔一起走。母亲告诉他，猫不喜欢离开家。威利却保证会好好待她，又苦苦央求，母亲最后只得答应。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            威利在那里住了几天，就写信回家，说玛尔塔逃走了。她一直闷闷不乐。尽管威利始终把她留在身边，她还是总想逃开。
        - id: ch01-b27
          speaker: beautiful_joe
          text: 信念给莫里斯先生听后，他马上明白了。
        - id: ch01-b28
          speaker: mr_morris
          text: >-
            玛尔塔正在回家的路上。猫很会寻找自己的住处，总能找到回家的路。她一定累坏了，我们出去迎迎她吧。
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            威利去朋友家时坐的是马车。莫里斯先生套上一辆轻便马车，带着劳拉小姐和我出发。我们沿路慢慢走。每隔一会儿，劳拉小姐便吹响哨子，呼唤玛尔塔，我也用尽力气大声叫。莫里斯先生赶了几个钟头的车，我们在一户人家停下来吃午饭，随后又上路。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            后来，我们穿过一片茂密的树林，林中有一条很直的路。我忽然看见远处有个深色的小东西，正朝我们跑来。那就是玛尔塔。我欢喜地叫了一声，可她没认出我，一头钻进树林。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            我立刻追进去，又叫又喊。劳拉小姐也使足力气吹哨。不久，一个灰色的小脑袋从灌木丛里探出来，偷偷看着我们。玛尔塔猛地蹿出来，惊讶地看我一眼，随即跳上马车，扑进劳拉小姐怀里。
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            她快活得不得了，呼噜声响个不停，一遍又一遍地舔劳拉小姐的手套。接着，她吃完大家带来的食物，沉沉睡去。她瘦得厉害。回到家后的头几天，她大部分时候都在睡觉。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            玛尔塔不喜欢狗，对猫却很好。一天，四下无人，花园里很安静。我看见她悄悄走进马厩，出来时身后跟着一只眼睛红肿、饿得皮包骨头的猫。住在隔壁街的一户人家把它抛弃了。玛尔塔把它领到自己的猫薄荷花坛，亲切地看着它在里面翻滚、摩擦身体。然后，玛尔塔自己也滚了一会儿，两只猫才一起回到马厩。
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            猫最喜欢猫薄荷，劳拉小姐总会种上一些，专门留给玛尔塔。那只病猫也在马厩里住了很久，玛尔塔每天都给它送食物。过了一阵，劳拉小姐发现了它，便尽力照料，想让它恢复健康。后来，它真的长成一只强壮结实的猫。劳拉小姐又替它找了一个家，让它去陪伴一位体弱多病的太太。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            莫里斯一家收留被人遗弃的猫，早就不是什么新鲜事了。莫里斯太太说，有几个夏天，她要照料的猫足足有十二只。那些粗心又残忍的人出门避暑，把房子锁得严严实实，却不管可怜的猫怎么办。这些猫整个冬天还舒舒服服地依偎在炉边呢。后来，莫里斯太太养成了一个习惯。她会在费尔波特的报纸上登一则小启事，请那些夏天要出门的人，在离开期间安顿好自己的猫。
