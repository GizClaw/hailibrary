audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，关切中自有力量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快顽皮，爱开玩笑
        timbre: 明亮的少年嗓音
        pace: 稍快
        pitch: 中
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 温和明理，平静中带着坚定
        timbre: 温暖清晰
        pace: 从容
        pitch: 中
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 稳重温厚，说话直截了当
        timbre: 沉稳清晰
        pace: 从容
        pitch: 中低
    billy:
      display_name: 比利
      tts:
        delivery: 天真活泼，满是淘气劲儿
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 高
    james_dobson:
      display_name: 詹姆斯·多布森
      tts:
        delivery: 直率稚气，情绪来得快
        timbre: 结实的少年嗓音
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 第六章　猎狐梗比利
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我刚到莫里斯家时，根本不懂小狗该怎么养。听说有个男孩老挨姐姐的打，就说自己是“一手打大”的。照这个说法，詹金斯总用脚踢我，那我就是“一脚踢大”的。搬进新家没多久，我便亲眼看见，一只小狗究竟该怎样长大。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            一天，我正陪劳拉小姐坐在客厅里。门一开，杰克走了进来，一只手严严实实地盖着另一只手。他叫姐姐猜猜，自己手里藏了什么。
        - id: ch01-b03
          speaker: miss_laura
          text: 是一只鸟吗？
        - id: ch01-b04
          speaker: jack
          text: 猜错了。
        - id: ch01-b05
          speaker: miss_laura
          text: 那是一只大老鼠？
        - id: ch01-b06
          speaker: jack
          text: 也不对。
        - id: ch01-b07
          speaker: miss_laura
          text: 一只小老鼠？
        - id: ch01-b08
          speaker: jack
          text: 还不对，是一条小狗。
        - id: ch01-b09
          speaker: miss_laura
          text: 哎呀，杰克，你别又编故事！
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            杰克摊开双手。掌心里躺着一丁点儿猎狐梗幼犬，是我见过最小的狗。他雪白的身上带着黑色和棕黄色花纹。身子纯白，黑尾巴上抹着一笔棕黄，两只耳朵也是黑的，脸上的花纹左右匀称。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            那时，他的眼睛还没睁开。后来我们才看见，那是一双漂亮的棕色眼睛。他起初长着淡粉色的鼻头，长大后，鼻头就变得乌黑发亮。
        - id: ch01-b12
          speaker: miss_laura
          text: 他的眼睛都没睁开呢！杰克，你怎么能把他从妈妈身边抱走？
          emotion: surprised
        - id: ch01-b13
          speaker: jack
          text: >-
            他妈妈死了。她带着小狗到院子里活动了一会儿，不知哪个恶棍从外面扔进来一块毒肉，她吃了就死了。四只小狗也没活下来，只剩这一只。鲁滨逊先生要出门，佣人又不会喂没了妈妈的小狗，就想把他交给我们。咱们不是最会照顾生病的动物吗？
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            鲁滨逊先生是莫里斯家的朋友。他喜欢名贵的牲畜，还从英国进口过不少，是个十分讲究的绅士。这只幼犬既然来自他家，品种自然不会差。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            劳拉小姐接过小家伙，想了想，便带着他上楼。我跟在她身后。她找来一只小篮子，铺好棉絮，把幼犬放进去，仔细看着他。那正是盛夏，连我都嫌屋里热，他却还在发抖，低声呜咽。劳拉小姐用棉絮盖住他，关上窗，又把篮子挪到阳光里。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            接着，她从厨房拿来温牛奶，把蘸了奶的手指送到小狗嘴边。小家伙只会傻乎乎地拿鼻子乱拱，怎么也不肯舔。
        - id: ch01-b17
          speaker: miss_laura
          text: 他实在太小了。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            她便用一小块细棉布包住面包，拿线扎好，再泡进牛奶里。布包刚挨到嘴边，小狗便饿极了似的拼命吮吸。劳拉小姐却只喂了他一点。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            那天剩下的时间里，她隔几个小时就喂一次。后来一连许多个夜晚，她还得起来一两次，在灯上为他热奶。有一晚，奶还没喝就凉了，小狗喝下去以后肚子发胀，病得很重。劳拉小姐赶紧叫醒母亲，弄来热水，把他整个泡进去，他这才缓过来。
        - id: ch01-b20
          speaker: beautiful_joe
          text: 为了救一条小小的狗命，要费这么多心力，可这个家里谁也不觉得不值得。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            后来，这只小狗长成了我见过最漂亮、最讨人喜欢的狗之一，一点儿也没有辜负大家的照料。他们给他取名叫比利。他小时候有两件大事，一件是终于睁开眼睛，另一件是把喂奶用的细棉布吞进了肚子。那块布好像没伤着他，不过劳拉小姐认为，他已经壮实了，胃口也大了，该学着像别的狗一样吃东西了。
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            小时候的比利特别有趣，满脑子都是淘气点子。他总趁人没留意，悄悄爬到近旁。六星期大的时候，他小得能钻进劳拉小姐紧身毛衣的袖子，一路爬到她肩头。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            一天，全家人都在客厅。莫里斯先生忽然丢开报纸，又蹦又跳。莫里斯太太吓了一大跳。
        - id: ch01-b24
          speaker: mrs_morris
          text: 亲爱的威廉，你这是怎么了？
          emotion: surprised
        - id: ch01-b25
          speaker: mr_morris
          text: 有只老鼠钻进我的裤腿了！
          emotion: surprised
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            他一边喊，一边使劲抖腿。小比利一下从裤腿里掉到地板上，四脚朝天，还满脸惊讶地望着莫里斯先生。原来他觉得冷，以为裤腿里一定很暖和。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            好在劳拉小姐管教得认真，比利从没惹出真正的大祸。他刚开始撕咬东西，她就立刻纠正。第一个遭殃的是莫里斯先生的毡帽。一天，风把帽子吹到走廊上，比利恰好路过，便拿牙试着咬了起来。那滋味准很对他的牙口，因为小狗就像婴儿，总想找东西咬。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            劳拉小姐发现时，比利一脸无辜，转着眼珠，完全不知道自己错了。她拿走帽子，先指指帽子，再指向他。
        - id: ch01-b29
          speaker: miss_laura
          text: 坏比利！这个不能咬。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            她用靴带轻轻抽了他两三下。她从不用手或棍子打小狗。她说，真要动手，大狗才用粗棍，小狗只能用细枝。可最好的办法还是责骂。一条好狗挨了严厉的责骂，心里会像挨鞭子一样难受。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            比利羞愧极了，从此连帽子看也不看。不过，他还以为别的东西可以撕，于是又一样样进攻地毯、窗帘，还有所有会飘会动的东西。劳拉小姐逮到一次，就耐心责备一次。比利终于明白，除了骨头，什么都不能乱咬。从那以后，他就成了一条乖狗。
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            劳拉小姐还有一件格外认真的事，那就是一定按时喂比利。我和他每天都吃三顿，却从不准进餐厅。一家人吃饭时，我们便卧在外面的走廊里，望着里面。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            狗总想知道别人吃些什么。莫里斯一家把一道道菜传来传去，热饭菜的香气也一阵阵飘出来，真叫我们兴奋。比利常盼着自己能跳上餐桌。
        - id: ch01-b34
          speaker: billy
          text: 我要是跳上去了，准能让整桌东西全飞起来！
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            他正在长身体，几乎从来没有吃饱的时候。我常劝他，要是想吃多少就吃多少，他一定会把自己撑死。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            一家人刚吃完饭，我和比利就跟着劳拉小姐，飞快地奔向厨房。我们各有一只食盘。厨娘玛丽常笑劳拉小姐，不明白她为什么不让两条狗同盘吃饭。
        - id: ch01-b37
          speaker: miss_laura
          text: >-
            那可不行。让他们同盘吃，大狗会抢走不属于他的那一份，小狗就只能饿肚子了。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            看比利吃饭也很有意思。他把四条腿远远叉开，让自己站稳，然后像鸭子一样狼吞虎咽。每次吃光，他都抬起头，还想再要一点。劳拉小姐总是摇头。
        - id: ch01-b39
          speaker: miss_laura
          text: >-
            不行，比利。让你吃完还想再来一点，总比让你一看见食物就厌烦好。我看许多小狗就是吃得太多，才丢了命。
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            我常听莫里斯一家说，有些人不管不顾地往宠物嘴里塞食物，不是把它们撑死，就是害得它们常年生病。比利还小的时候，邻近就发生过这样的事。
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            离我们几户远，住着多布森一家。他们有一匹漂亮的枣红母马，还有一匹叫山姆的小马驹。全家都为这匹小马自豪，多布森先生已经答应将来把它送给儿子詹姆斯。一天，他请莫里斯先生去看看山姆，我也跟着去了。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            莫里斯先生检查小马时，我一直在旁边瞧。山姆的确是个漂亮的小家伙，难怪一家人把它当宝贝。莫里斯先生回家后，太太问他觉得小马怎么样。
        - id: ch01-b43
          speaker: mr_morris
          text: 依我看，它恐怕活不了多久了。
        - id: ch01-b44
          speaker: jack
          text: 怎么会呢，爸爸！它胖得简直像一只海豹。
          emotion: surprised
        - id: ch01-b45
          speaker: mr_morris
          text: >-
            要是它瘦得皮包骨，活下去的希望倒还大些。他们实在喂得太多了。我已经提醒过多布森先生，可他不太相信。
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            莫里斯先生从小在乡下长大，很懂动物，所以我觉得他的判断多半没错。果然，没过几天，我们便听说小马死了。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            可怜的詹姆斯·多布森伤心极了。邻居家的几个男孩都去看他。他站在那里，望着死去的小马，眼看就要哭出来。杰克也去了，我紧紧跟在他脚边。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            杰克起先一声不响。我却知道，他很气多布森一家乱喂东西，白白害死了小马。过了一会儿，他终于开口。
        - id: ch01-b49
          speaker: jack
          text: 多布森，现在小马死了，你倒不用再把它做成填充标本了。
        - id: ch01-b50
          speaker: james_dobson
          text: 你这是什么意思？为什么要这么说？
          emotion: angry
        - id: ch01-b51
          speaker: jack
          text: 因为它活着的时候，你们就已经把它填得满满的啦。
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            杰克这句淘气话一出口，我们只好拼命逃跑。多布森家的男孩在后面追个不停。他块头很大，要是真追上杰克，准会狠狠揍他一顿。
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            还有一件事不能漏掉。比利每星期都用香喷喷的肥皂洗一次澡，每个月还要用一次气味又强又难闻的石炭酸皂。他有自己的毛巾和洗澡巾。每次洗干净，人们便用毯子把他裹好，放在炉火旁烘干。
        - id: ch01-b54
          speaker: miss_laura
          text: >-
            一直养在屋里、又常受宠爱的小狗，身子已经娇弱了。洗完澡，绝不能让他湿着毛四处乱跑。除非天气非常暖和，不然他一定会着凉。
        - id: ch01-b55
          speaker: beautiful_joe
          text: >-
            吉姆和我都比比利强健，所以我们是在海里洗澡。每隔几天，男孩们就带我们去海边，我们也会跟他们一起游泳。
