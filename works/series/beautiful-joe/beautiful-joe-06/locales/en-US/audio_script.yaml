  chapters:
    - id: ch01
      title: THE FOX TERRIER BILLY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            When I came to the Morrises, I knew nothing about raising a puppy. I once heard of a boy whose sister beat him so often that he said he was brought up by hand. Since Jenkins kicked me so often, I suppose I was brought up by foot.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Soon afterward, I saw how a puppy ought to be raised. I was beside Laura in the parlor when Jack came in, holding one hand over the other.
        - id: ch01-b03
          speaker: jack
          text: Guess what I'm holding.
        - id: ch01-b04
          speaker: laura
          text: Is it a bird?
        - id: ch01-b05
          speaker: jack
          text: No.
        - id: ch01-b06
          speaker: laura
          text: A rat?
        - id: ch01-b07
          speaker: jack
          text: No.
        - id: ch01-b08
          speaker: laura
          text: Then is it a mouse?
        - id: ch01-b09
          speaker: jack
          text: No, it's a puppy.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Laura scolded him because she thought he was making it up. Then Jack opened his hands. Inside lay the tiniest fox terrier puppy I had ever seen.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            His body was pure white. His black tail had a streak of tan, his ears were black, and black and tan lay evenly across his face. His closed eyes later proved to be pretty brown. His pale pink nose turned jet black as he grew.
        - id: ch01-b12
          speaker: laura
          text: >-
            Jack, his eyes aren't even open! Why did you take him away from his mother?
          emotion: surprised
        - id: ch01-b13
          speaker: jack
          text: >-
            She's dead. Poisoned let her puppies run around the yard for some exercise, and some brute had thrown poisoned meat over the fence. She ate it. Four puppies died, and this is the only one left. Mr. Robinson is going away, and his man doesn't know how to raise a puppy without its mother. He wants us to take him because we've always been good at nursing sick animals.
          emotion: sad
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Mr. Robinson was a family friend who was very fond of fine stock and brought many animals from England. A puppy from him was sure to be a good one.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Laura carried him upstairs, and I followed. She lined a basket with cotton wool and laid him inside. Though it was midsummer and the house felt warm to me, he shivered and murmured. Laura covered him in wool, closed the window, and set the basket in the sun.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Next she brought warm milk from the kitchen. She dipped in one finger and offered it to him, but the puppy only nosed around without drinking.
        - id: ch01-b17
          speaker: laura
          text: He's too young for that.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            She tied bread inside a piece of muslin and dipped it in the milk. The puppy sucked greedily, as though starving, but Laura gave him only a little.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            She fed him every few hours for the rest of that day. For many nights, she got up once or twice to warm milk over a lamp. One night it cooled before he drank it, and he swelled up and grew terribly ill. Laura woke her mother and plunged him into hot water. That made him well again. No one thought such care was too much trouble for a creature who was only a dog.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            He repaid their care by growing into one of the prettiest, most lovable dogs I ever knew. They named him Billy. The two great events of his early life were opening his eyes and swallowing the muslin rag.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            The rag did not seem to harm him. Still, Laura decided that a puppy who had grown so strong and greedy must learn to eat the way other dogs did.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Billy was full of tricks and crept around without anyone knowing he was near. At six weeks, he was small enough to climb inside the sleeve of Laura's Jersey, all the way to her shoulder.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            One day, with the whole family in the parlor, Mr. Morris threw down his newspaper and began jumping. Mrs. Morris was alarmed.
        - id: ch01-b24
          speaker: mrs_morris
          text: William, dear, what's the matter?
          emotion: fearful
        - id: ch01-b25
          speaker: mr_morris
          text: There's a rat inside my trouser leg!
          emotion: surprised
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Mr. Morris shook his leg, and little Billy tumbled out. He lay on his back, staring up in surprise. He had been cold and thought Mr. Morris's trouser leg would be warm.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            For all his tricks, Billy never caused any real damage. Laura's training saw to that. She began correcting him as soon as he started tearing and worrying things. His first target was Mr. Morris's felt hat. One day the wind blew it down the hall, and Billy came along and tested it with his teeth. It probably felt good. Puppies are much like babies and love having something to bite.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            Laura found him chewing it. He rolled his eyes at her innocently, with no idea that he had done wrong. She took the hat away and pointed first at it, then at Billy.
        - id: ch01-b29
          speaker: laura
          text: Bad Billy!
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            Then she gave him two or three slaps with a bootlace. She never struck a small dog with her hand or with a stick. She said that clubs were for large dogs and switches for little ones, if a person had to use either. Scolding was best, because a good dog felt a stern scolding as sharply as a whipping.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Billy was deeply ashamed. After that, nothing could make him so much as look at a hat. But he still believed other things were safe to worry. He went after one thing after another. He tried the rugs, the curtains, and anything else that flew or fluttered.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Laura patiently scolded him for every one. At last Billy understood that the only thing he was allowed to worry was a bone. From then on, he became a very good dog.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            Laura was especially careful to feed him at regular times. Billy and I each had three meals a day. We were never allowed in the dining room. While the family ate, we lay in the hall outside and watched everything that happened.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Dogs are very interested in what people eat. It was exciting to watch the Morrises pass different dishes and to smell all that good hot food. Billy often wished he could climb onto the table.
        - id: ch01-b35
          speaker: billy
          text: If I ever got up there, I'd send everything flying!
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            While Billy was growing, he almost never felt that he had eaten enough. I used to warn him that if he could eat all he wanted, he would eat himself to death.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            The moment a meal ended, Billy and I raced after Laura to the kitchen. Each of us had his own plate. Mary the cook often laughed at Laura for making us eat separately instead of letting the two dogs share one dish, as people often did.
        - id: ch01-b38
          speaker: mary
          text: Why not let the two dogs eat together?
        - id: ch01-b39
          speaker: laura
          text: >-
            Because the bigger dog would take more than his share, and the little one would go hungry.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            Watching Billy eat was quite a sight. He planted his legs wide to hold himself steady and gobbled like a duck. When his plate was empty, he always looked up and asked for more. Laura would shake her head.
        - id: ch01-b41
          speaker: laura
          text: >-
            No, Billy. It is better to want a little more than to grow sick of food. I believe many small dogs die because people feed them too much.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            I often heard the Morrises talk about people who foolishly stuffed their pets. They either killed the animals that way or kept them sick all the time. While Billy was a puppy, something happened nearby that showed how true this was.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            A family named Dobson lived only a few doors away. They owned a handsome bay mare and a little colt called Sam. They were very proud of the colt, and Mr. Dobson had promised him to his son, James.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            One day Mr. Dobson invited Mr. Morris to come and see Sam, and I went along. The colt was a pretty little creature. As I watched Mr. Morris examine him, I could understand why the Dobsons thought so much of him.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            When we returned home, Mrs. Morris asked her husband what he thought of the colt.
        - id: ch01-b46
          speaker: mrs_morris
          text: Well, what do you think of him?
        - id: ch01-b47
          speaker: mr_morris
          text: I don't think he'll live very long.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            Jack overheard him and cried out in surprise.
        - id: ch01-b49
          speaker: jack
          text: But Papa, he's as fat as a seal!
          emotion: surprised
        - id: ch01-b50
          speaker: mr_morris
          text: >-
            He'd have a better chance of living if he were lean and scrawny. They're feeding him too much. I told Mr. Dobson, but he didn't want to believe me.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            Mr. Morris had grown up in the country and knew a great deal about animals, so I believed he was probably right. Sure enough, only a few days later, we heard that the colt had died.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            Poor James Dobson took it very hard. Several neighborhood boys went to see him. He stood staring at the dead colt, looking as if he wanted to cry. Jack was there, and I stayed close at his heels.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            Jack said nothing at first, but I knew he was angry with the Dobsons for sacrificing the colt's life. After a while, he spoke.
        - id: ch01-b54
          speaker: jack
          text: You won't have to get the colt stuffed now that he's dead, Dobson.
        - id: ch01-b55
          speaker: james_dobson
          text: What are you talking about? Why would you say that?
          emotion: angry
        - id: ch01-b56
          speaker: jack
          text: Because you already stuffed him when he was alive.
          emotion: angry
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            Then Jack and I had to run as fast as we could. James Dobson chased us, and he was such a big boy that he would have given Jack a sound whipping if he had caught him.
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            I must also tell you that Billy was washed regularly. Once a week he had a bath with pleasant-smelling soap. Once a month they used strong, disagreeable carbolic soap. He had towels and washcloths of his own, and they rubbed and scrubbed him thoroughly.
        - id: ch01-b59
          speaker: beautiful_joe
          text: >-
            After he had been rubbed and scrubbed, they wrapped him in a blanket and set him beside the fire to dry. Laura said that a little house dog who had been petted and had grown tender should never be washed and then allowed to run about with a wet coat, unless the weather was very warm. Otherwise, he would be sure to catch cold.
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            Jim and I were hardier than Billy, and we bathed in the sea. Every few days, the boys took us down to the shore, and we swam with them.
