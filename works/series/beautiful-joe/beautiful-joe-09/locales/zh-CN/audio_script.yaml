audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    bella:
      display_name: 贝拉
      tts:
        delivery: 顽皮机敏，善于模仿人声
        timbre: 尖细而略带沙哑
        pace: 明快
        pitch: 高
    henry_smith:
      display_name: 亨利·史密斯
      tts:
        delivery: 腼腆朴实，带着水手少年的直率
        timbre: 清亮而粗朴
        pace: 稍慢
        pitch: 中
    ned:
      display_name: 内德
      tts:
        delivery: 活泼爽快，笑意藏不住
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    jack:
      display_name: 杰克
      tts:
        delivery: 聪敏有礼，反应敏捷
        timbre: 清朗
        pace: 适中
        pitch: 中
    carl:
      display_name: 卡尔
      tts:
        delivery: 天真随和，语气直爽
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 温厚稳重，言语清楚有分寸
        timbre: 醇厚温和
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 会说话的礼物
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我常听莫里斯一家谈起那些往返于费尔波特和西印度群岛的船。船把一船船木材和鱼运走，再载回糖蜜、香料、水果，还有别的货物。其中有一艘叫“玛丽·简号”，船上的小听差是莫里斯家男孩子们的朋友，每次来都爱给他们捎礼物。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            我到莫里斯家几个月后的一天，他又来了。一只手拎着一串青香蕉，另一只手提着一只鹦鹉。男孩子们高兴极了，赶紧叫母亲来看这只漂亮的鸟。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            莫里斯太太见他从那么远的地方还惦记着自己的孩子，很受感动，热情地向他道谢。小听差一下害羞起来，局促地反复说着同一句话。
        - id: ch01-b04
          speaker: henry_smith
          text: 别这样！别这样！
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            莫里斯太太笑了笑，把他留给男孩子们。我想，她知道他和同伴在一起会自在些。杰克把我抱到桌上看鹦鹉。她的一条腿上拴着细绳，男孩牵着绳子。她一身灰羽毛，尾巴上点着几根红羽，眼睛明亮，神气机灵。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            男孩特意买了只还不会讲话的小鹦鹉。他知道，莫里斯家的孩子不会喜欢满口外国胡话，或是会骂人的鸟。一路上，他把她养在自己的铺位里，一有空就教她开口。这时，他不安地看着她。
        - id: ch01-b07
          speaker: henry_smith
          text: 现在给大家露一手，好不好？
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            我当时根本听不懂男孩的话，过后才明白，因为我从不知道鸟还能讲话。我在桌上盯着鹦鹉，她也一动不动地盯着我。我正想着，可千万别让那张尖尖的小嘴咬住自己的皮肉，忽然有个陌生声音叫了我的名字。
        - id: ch01-b09
          speaker: bella
          text: 美丽的乔。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            声音像是从屋里传来的，可屋里每个人的声音我都认得，只有这个声音从没听过。我想自己一定弄错了，说话的人也许在门厅里，便挣扎着要从杰克怀里出去看个究竟。杰克却把我紧紧抱住，笑得前仰后合，别的男孩子也笑个不停。没过多久，那个声音又贴着我响起来。
        - id: ch01-b11
          speaker: bella
          text: 美丽的乔，美丽的乔。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            小听差早已笑弯了腰，脸红得像甜菜根，声音当然不是他发出的。
        - id: ch01-b13
          speaker: ned
          text: 是鹦鹉呀，乔！看着她，你这个傻瓜。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            我转头一看，她正歪着脑袋，摆出天底下最顽皮的神气，一字一顿地叫着。
        - id: ch01-b15
          speaker: bella
          text: 美——丽——的乔，美——丽——的乔！
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            我第一次听见鸟讲话，窘得只想跳下去躲到桌底。她竟然还笑我。
        - id: ch01-b17
          speaker: bella
          text: 哈，哈，哈！好狗，咬它，小子。老鼠，老鼠！美——丽——的乔，美——丽——的乔！
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            她越说越快。男孩子们看着我迷惑的样子，笑得直不起腰。接着，她又喊起吉姆。
        - id: ch01-b19
          speaker: bella
          text: 吉姆在哪儿？忠厚的老吉姆呢？可怜的老狗。给它一根骨头。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            男孩子们把吉姆带进客厅。他听见那细小、沙哑又滑稽的声音叫自己，简直快疯了。
        - id: ch01-b21
          speaker: bella
          text: 吉米，吉米，詹姆斯·奥古斯塔斯！
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            那正是吉姆的全名。他猛地冲出房间，男孩子们又笑又叫，连书房里的莫里斯先生都被惊动了。可鹦鹉一看见他，立刻闭紧嘴巴。孩子们把刚才的事讲给父亲听。莫里斯先生想到小听差记住了他们常说的话，又一句句教给鹦鹉，觉得很有意思。
        - id: ch01-b23
          speaker: mr_morris
          text: 聪明的波莉，好波莉。
    - id: ch02
      title: 贝拉的名字
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: 小听差害羞地望着莫里斯先生。杰克反应很快，马上问他。
        - id: ch02-b02
          speaker: jack
          text: 亨利，你平常不是这样叫她的吗？
        - id: ch02-b03
          speaker: henry_smith
          text: 不是。我叫她贝尔，是贝尔西卜的简称。
        - id: ch02-b04
          speaker: jack
          text: 对不起。
        - id: ch02-b05
          speaker: beautiful_joe
          text: 杰克说得非常客气。男孩又认真解释起来。
        - id: ch02-b06
          speaker: henry_smith
          text: >-
            贝尔就是贝尔西卜的简称。你们是牧师的儿子，我想着，你们一定喜欢《圣经》里的名字。这趟出海我没带《圣经》，可别见怪。我只想得起夏娃和示巴女王，又觉得都不适合她。
        - id: ch02-b07
          speaker: henry_smith
          text: >-
            我就去问一个同伴。他说，贝尔西卜跟哪个姑娘的名字一样好听，我便用了这个名字。原该让你们自己取的。可我天天教她讲话，总得有个名字叫她呀。
        - id: ch02-b08
          speaker: beautiful_joe
          text: 杰克转身走到窗前，脸涨得通红。我听见他低声念叨。
        - id: ch02-b09
          speaker: jack
          text: 别西卜，魔鬼之王。
        - id: ch02-b10
          speaker: beautiful_joe
          text: 看来，小听差给自己的鸟取了个坏名字。莫里斯先生仍旧和善地问他。
        - id: ch02-b11
          speaker: mr_morris
          text: 你会用全名称呼这只鹦鹉吗？
        - id: ch02-b12
          speaker: henry_smith
          text: 不会，先生。我总叫她贝尔，可她管自己叫贝拉。
        - id: ch02-b13
          speaker: mr_morris
          text: >-
            贝拉，这名字很漂亮。孩子们，如果你们要留下她，以后就一直叫她贝拉吧。
        - id: ch02-b14
          speakers: [jack, ned, carl]
          ensemble: chorus
          text: 好的，爸爸。
        - id: ch02-b15
          speaker: beautiful_joe
          text: >-
            莫里斯先生正要回书房，走到门槛又停下来，问亨利的船何时启航。听说再过几天就要走，他取出袖珍记事本，写了几笔。第二天，他带杰克进了城。回来以后，杰克说，父亲给亨利·史密斯买了一件油布雨衣，还有一本精美的《圣经》，要全家人都在上面签名。
    - id: ch03
      title: 家里的新成员
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            莫里斯先生走后，劳拉小姐进了房间。她不知道鹦鹉来了，一见她十分惊讶。劳拉坐到桌边，慢慢伸出双手。她喜欢所有宠物，从来不怕它们，也从不会突然伸手去抓。她只把手指伸过去，轻声说话，让鹦鹉自己决定来不来。
        - id: ch03-b02
          speaker: beautiful_joe
          text: >-
            劳拉望着她，眼里全是喜爱。这个古怪的小家伙径直走过去，把头偎在劳拉胸前的花边上，然后用沙哑的小嗓子低声说话。
        - id: ch03-b03
          speaker: bella
          text: 漂亮姑娘，亲亲贝拉。
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            男孩子们高兴得大声欢呼，把母亲都引来了。她叫他们最好把鹦鹉带到马厩去。贝拉倒很喜欢这场热闹。亨利把她托到手指上，她便尖声招呼起来。
        - id: ch03-b05
          speaker: bella
          text: >-
            来呀，男孩子们！哈，哈，哈，来找点乐子。豚鼠在哪儿？老鼠戴维呢？猫咪呢？猫咪，猫咪，过来。亲爱的漂亮猫咪。
          emotion: happy
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            她的声音又尖又清楚，很像那个常来收破布和骨头的老太太。我跟着她去了马厩。她发现我以后，马上叫起来。
        - id: ch03-b07
          speaker: bella
          text: 哈，乔，美丽的乔！你的尾巴呢？谁割掉了你的耳朵？
        - id: ch03-b08
          speaker: beautiful_joe
          text: >-
            我觉得亨利教她这些话很不厚道。她似乎也知道我不爱听，偏偏一遍遍地说，还高兴得又笑又咯咯叫。我只好离开她。第二天再见时，男孩子们已经给她找来一只又大又漂亮的笼子。
        - id: ch03-b09
          speaker: beautiful_joe
          text: >-
            笼子起初放在门厅的一扇窗边。可一家人越来越喜欢她，大家走到哪个房间，就把她从这间屋搬到那间屋。贝拉自己却很讨厌笼子，常把头贴近栏杆，眼巴巴地求大家放她出去。
        - id: ch03-b10
          speaker: bella
          text: 放贝拉出去吧。贝拉会乖乖的，绝不会逃走。
        - id: ch03-b11
          speaker: beautiful_joe
          text: >-
            后来，莫里斯一家真的放她出来。她也说到做到，从没想过逃跑。杰克在笼门上装了个小把手，让她能自己开门关门。每天早晨，她都会先喊上一句，再用爪子转动把手，走进房间。
        - id: ch03-b12
          speaker: bella
          text: 孩子们，让开路！贝拉要出去散步啦！
        - id: ch03-b13
          speaker: beautiful_joe
          text: >-
            她实在聪明。除了人，我从没见过哪种生灵能像她那样思考。大家宠她，也总和她说话，她会的词句越来越多。有一回，她甚至让莫里斯一家躲过了一场偷窃。
    - id: ch04
      title: 贝拉捉贼
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            那是一个冬日。全家人在房子后面的餐厅喝茶，我和比利躺在门厅，一面看着餐厅里的动静，一面留心周围。房子前面一个人也没有。门厅的灯亮着，大门虽关了，却没上锁。近来，几个偷偷摸摸的窃贼在费尔波特惹了不少麻烦。这天，他们溜上门前的台阶，悄悄潜进屋，打开门厅的壁橱，伸手就拿男孩子们的冬大衣。
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            他们以为没人看见，可他们错了。贝拉刚才在楼上午睡，茶铃响时还没下来。现在她正一蹦一跳地去餐厅，听见楼下有轻微的响声，便停在栏杆边往下看。住在好人家的宠物都不喜欢又脏又邋遢的人。贝拉知道，那两个乞丐似的男孩不该待在壁橱旁边。
        - id: ch04-b03
          speaker: bella
          text: >-
            坏孩子！出去，出去！乔，乔，美丽的乔，快来！比利，比利，老鼠！出去！吉姆，咬他们！警察在哪儿？快叫警察！
          emotion: angry
        - id: ch04-b04
          speaker: beautiful_joe
          text: >-
            我和比利立刻跳起来，顶开通往前厅的门。两个贼吓坏了，正沿着门外台阶往下逃。一个跑掉了，另一个摔倒在地。我咬住他的外衣，直到莫里斯先生赶来，把手按在他的肩上。
        - id: ch04-b05
          speaker: beautiful_joe
          text: >-
            他年纪和杰克差不多，却连杰克一半的男子气概也没有。他抽着鼻子，不住抱怨那只讨厌的鹦鹉。莫里斯先生让他回到屋里，仔细问了问。原来，这是个贫穷无知的少年，父亲酗酒，几乎把他饿死。他和弟弟偷来衣服，寄给波士顿的姐姐。姐姐卖掉以后，再寄回一部分钱。
        - id: ch04-b06
          speaker: beautiful_joe
          text: >-
            莫里斯先生问他，愿不愿意靠诚实的办法生活。少年说自己试过，可谁也不肯雇他。莫里斯先生叫他回家向父亲告别，再带上弟弟，第二天到华盛顿街来。他也说得很明白，如果少年不来，就会派警察去找。
        - id: ch04-b07
          speaker: beautiful_joe
          text: >-
            少年连声求他别叫警察。第二天一早，他果然带着弟弟来了。莫里斯太太让他们吃了一顿饱饭，又给他们换上合适的衣服。之后，他们坐火车去了乡下，投奔莫里斯太太的一位兄弟。
        - id: ch04-b08
          speaker: beautiful_joe
          text: >-
            那位兄弟是个善良的农场主，已经收到电报，知道两个男孩要来，也知道他们想找一份活儿，好有机会堂堂正正地做人。
