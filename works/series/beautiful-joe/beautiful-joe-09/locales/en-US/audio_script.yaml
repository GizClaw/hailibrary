  chapters:
    - id: ch01
      title: A Gift from the Mary Jane
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I often heard the Morrises talk about ships sailing between Fairport and the West Indies. They carried out lumber and fish, then came home with molasses, spices, fruit, and other goods. A cabin boy on one of those ships, the Mary Jane, was friendly with the Morris boys and often brought them presents.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            I had lived with the family for several months when he came to the house one day. He had green bananas in one hand and a parrot in the other. The boys were delighted and called their mother to see the pretty bird.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Mrs. Morris was deeply touched by his thoughtfulness. He had remembered her boys and carried their gift all the way home from the West Indies. She thanked him warmly, and that made the cabin boy terribly shy.
        - id: ch01-b04
          speaker: henry
          text: Go away! Go away!
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            It was all he could manage, and he said it very awkwardly. Mrs. Morris smiled and left him with the boys, where she thought he would feel more at ease.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Jack set me on the table so I could see the parrot. The cabin boy held her by a string around one leg. She was gray, with a few red tail feathers, bright eyes, and a very knowing look.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            He explained that he had chosen a young bird that could not talk. The boys would not want one speaking foreign gibberish or swearing. He had kept her in his bunk aboard ship and spent all his free time teaching her words. Then he watched her anxiously.
        - id: ch01-b08
          speaker: henry
          text: Come on now. Show them what you can do.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            I did not understand him. I had never heard of a bird that could talk. The parrot and I stared at each other. I was thinking how little I would like that sharp beak fastened in my skin when an unfamiliar voice spoke my name: Beautiful Joe.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            It sounded as if someone in the room had spoken, but I knew every voice there, and this one was new. At first I thought I must be mistaken. Perhaps someone had called from the hall. I struggled against Jack so I could run and look. He held me tight and laughed with all his might, and all the other boys laughed too. Then the strange voice came again, very close by. It could not be the cabin boy, because he was bent double with laughter and red in the face.
        - id: ch01-b11
          speaker: bella
          text: Beautiful Joe is here! Beautiful Joe is here!
        - id: ch01-b12
          speaker: ned
          text: Joe, it's the parrot! Look at her, you silly dog!
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            I looked. She cocked her head to one side with the sauciest air in the world.
        - id: ch01-b14
          speaker: bella
          text: You are Beau-ti-ful Joe! You are Beau-ti-ful Joe!
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            I had never heard a bird speak. I felt so foolish that I tried to climb down and hide under the table. She laughed at me instead.
        - id: ch01-b16
          speaker: bella
          text: Ha, ha, ha! Good dog! Get them, boy! Rats, rats! Beau-ti-ful Joe! Beau-ti-ful Joe!
          emotion: happy
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            She fired the words out as fast as she could. I had never felt so strange, and the boys roared at my puzzled face. Then she started calling for Jim.
        - id: ch01-b18
          speaker: bella
          text: Where's Jim? Where's good old Jim? Poor old dog. Give him a bone!
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            The boys brought Jim into the parlor. Her funny little cracked voice nearly drove him wild.
        - id: ch01-b20
          speaker: bella
          text: Where is Jimmy? Jimmy, James Augustus!
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            That was Jim's full name. He dashed out of the room, and the boys shouted so loudly that Mr. Morris came down from his study to find out what was happening. The moment Bella saw him, she fell silent. The boys told him everything she had said. He was amused that the cabin boy had remembered so many of their favorite sayings and taught them to the bird.
        - id: ch01-b22
          speaker: mr_morris
          text: You are a clever parrot, Polly. You are a good bird.
    - id: ch02
      title: Bella Gets Her Name
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            The cabin boy glanced shyly at Mr. Morris. Jack was quick to notice something.
        - id: ch02-b02
          speaker: jack
          text: Henry, isn't Polly what you call her?
        - id: ch02-b03
          speaker: henry
          text: No. I call her Bell. That's short for Bellzebub.
        - id: ch02-b04
          speaker: jack
          text: Oh. I beg your pardon.
        - id: ch02-b05
          speaker: beautiful_joe
          text: >-
            Jack was very polite, but Henry went on explaining.
        - id: ch02-b06
          speaker: henry
          text: >-
            Bell is short for Bellzebub. See, I thought a Bible name would suit a minister's sons. I didn't have my Bible on this trip, begging your pardon. The only girls' names I could remember were Eve and the Queen of Sheba, and neither one seemed right. So I asked a shipmate. He said Bellzebub sounded as pretty as any girl's name, so that's what I gave her. I suppose you should've named her yourselves, but I had to call her something while I was teaching her every day.
        - id: ch02-b07
          speaker: beautiful_joe
          text: >-
            Jack turned toward the window with a deep red face. I heard him mutter something.
        - id: ch02-b08
          speaker: jack
          text: Beelzebub is the prince of devils.
        - id: ch02-b09
          speaker: beautiful_joe
          text: >-
            So I gathered that the cabin boy had given his bird a bad name. Mr. Morris looked kindly at Henry.
        - id: ch02-b10
          speaker: mr_morris
          text: Do you ever use the parrot's whole name?
        - id: ch02-b11
          speaker: henry
          text: No, sir. I always call her Bell, but she calls herself Bella.
        - id: ch02-b12
          speaker: mr_morris
          text: >-
            Bella is a very pretty name. Boys, if you keep her, I think that is the name you should use.
        - id: ch02-b13
          speakers: [jack, ned]
          ensemble: duo
          text: Yes, Father.
        - id: ch02-b14
          speaker: beautiful_joe
          text: >-
            Mr. Morris started back toward his study. At the door, he stopped to ask when Henry's ship would sail. It was leaving in a few days, so Mr. Morris took out his pocketbook and wrote something down. The next day he took Jack into town. When they returned, Jack said his father had bought Henry Smith an oilskin coat and a handsome Bible. The whole family would write their names in it.
        - id: ch02-b15
          speaker: beautiful_joe
          text: >-
            After Mr. Morris left the room, Miss Laura came in. She knew nothing about the parrot, and the sight of it surprised her. She sat at the table and held out her hands. Laura loved every kind of pet and was never afraid of them, but she never grabbed at an animal. She offered her fingers and spoke gently, leaving the bird free to come or stay away.
        - id: ch02-b16
          speaker: beautiful_joe
          text: >-
            Laura looked at the parrot with love. The queer little bird walked straight to her and tucked her head against the lace on Laura's dress.
        - id: ch02-b17
          speaker: bella
          text: Pretty lady. Give Bella a kiss.
        - id: ch02-b18
          speaker: beautiful_joe
          text: >-
            The boys were so pleased that they raised a shout. Mrs. Morris came in and told them they had better take the parrot out to the stable. Bella seemed to enjoy all the excitement. Henry lifted her onto his finger.
        - id: ch02-b19
          speaker: bella
          text: >-
            Come on, boys! Ha, ha, ha! Come on, let's have some fun! Where's the guinea pig? Where's Davy the rat? Where's pussy? Pussy, pussy, come here! Dear pussy, pretty puss!
          emotion: happy
        - id: ch02-b20
          speaker: beautiful_joe
          text: >-
            Her voice was shrill and clear, just like an old woman who visited the house to collect rags and bones. I followed Bella to the stable and stayed until she noticed me.
        - id: ch02-b21
          speaker: bella
          text: Ha, Joe! Beautiful Joe! Where's your tail? Who cut off your ears?
        - id: ch02-b22
          speaker: beautiful_joe
          text: >-
            I did not think it was kind of Henry to teach her that. Bella seemed to know it bothered me, because she repeated it again and again while laughing and chuckling. I went away. The next time I saw her was the following day, when the boys had found her a fine large cage.
    - id: ch03
      title: Bella Takes a Walk
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            Bella's cage belonged beside a hall window. But everyone in the house grew so fond of her that they carried her from room to room.
        - id: ch03-b02
          speaker: beautiful_joe
          text: >-
            She hated being shut inside it. She would press her head close to the bars and beg.
        - id: ch03-b03
          speaker: bella
          text: Let Bella out. Bella will be a good girl. Bella won't run away.
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            In time, the Morrises let her out. She kept her promise and never tried to escape. Jack fixed a little handle to the cage door so she could open and close it herself. In the morning, it was very funny to hear her announce her plans. Then she would turn the handle with one claw and step into the room.
        - id: ch03-b05
          speaker: bella
          text: Clear the way, children! Bella is going for a walk!
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            Bella was a remarkably clever bird. I have never known any creature except a human being who could reason the way she did. Everyone petted her and talked to her, so she learned more and more words. Once, she even saved the Morrises from being robbed.
    - id: ch04
      title: Bella Calls the Police
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            It happened in winter. The family was having tea in the dining room at the back of the house. Billy and I lay in the hall, watching them. No one was in the front rooms. The hall lamp was burning, and the front door was closed but not locked.
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            Some sneak thieves had been causing a great deal of trouble in Fairport. They crept up the steps and into the house. Then they opened the hall closet and took hold of the boys' winter coats.
        - id: ch04-b03
          speaker: beautiful_joe
          text: >-
            They thought no one had seen them, but they were wrong. Bella had been asleep upstairs and had not come down when the tea bell rang. Now she was hopping toward the dining room. She heard a faint sound below, stopped, and peered through the railing. A pet that lives with a kind family dislikes a dirty, shabby stranger. Bella knew those boys had no business in that closet.
        - id: ch04-b04
          speaker: bella
          text: >-
            Bad boys! Get out! Get out! Joe, Joe, Beautiful Joe, come quick! Billy, Billy! Rats! Chase them, Jim! Get them, boys! Where are the police? Call the police!
          emotion: angry
        - id: ch04-b05
          speaker: beautiful_joe
          text: >-
            Billy and I leaped up and pushed through the door to the front hall. The terrified thieves were already racing down the front steps. One escaped, but the other fell. I caught his coat and held on until Mr. Morris ran up and put a hand on his shoulder.
        - id: ch04-b06
          speaker: beautiful_joe
          text: >-
            The thief was a young fellow about Jack's age, but he was not half so manly. He stood there sniffling and scolding about the troublesome parrot. Mr. Morris brought him back inside and sat down to talk with him.
        - id: ch04-b07
          speaker: thief
          text: It was that pesky parrot!
        - id: ch04-b08
          speaker: beautiful_joe
          text: >-
            Mr. Morris learned that the boy was poor and ignorant. His drunken father left him half starved. He and his brother stole clothes and sent them to their sister in Boston. She sold the clothes and returned some of the money.
        - id: ch04-b09
          speaker: mr_morris
          text: Wouldn't you rather earn your living honestly?
        - id: ch04-b10
          speaker: thief
          text: I tried, sir, but nobody would hire me.
        - id: ch04-b11
          speaker: beautiful_joe
          text: >-
            Mr. Morris told him to go home, say goodbye to his father, fetch his brother, and bring him to Washington Street the next day. He warned the boy plainly that a policeman would come after him if he failed to return.
        - id: ch04-b12
          speaker: thief
          text: Please, sir, don't send the police after me.
        - id: ch04-b13
          speaker: beautiful_joe
          text: >-
            Early the next morning, the boy came back with his brother. Mrs. Morris gave them a good breakfast and found clothes for them. Then the two boys went by train to live near one of her brothers, a kind farmer in the country. He had received a telegram explaining that they were coming and needed work that would give them a chance to become honest men.
