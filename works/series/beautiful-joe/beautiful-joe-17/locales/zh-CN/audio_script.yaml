audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 豪爽直率，说起农场轶事时生动风趣
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十七章　伍德先生和他的马
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            到河谷的第二天，我一大早就醒了。我睡在屋后的柴房里，想出门时随时都能出去。柴房旁边是工具房，再过去还有车房。一条木板路从那里一直铺到牲口院。我沿路跑去，探头看进遇见的第一间屋子，原来那就是马厩。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            马厩门敞开着，晨光正照进来。里面有好几匹马，有的头朝着我，有的尾巴朝着我。它们没有像别处的马那样被绳子拴住。马栏外只挡着栅门，所以站着时很自在，想朝哪边都行。马厩另一头有个人在忙碌。他还没瞧见我，我已经认出那是伍德先生。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            那马厩真是又干净又舒服。詹金斯家的马厩总往外冒出一股臭气，这里面的空气却和外面一样清新。墙上开了许多小通风格，既能不停送进新鲜空气，位置又安排得很好，不会让穿堂风直吹到马身上。伍德先生从一匹马走到另一匹马跟前，挨个儿给它们添草，还一直快活地同它们讲话。终于，他发现了我。
        - id: ch01-b04
          speaker: mr_wood
          text: >-
            早上好啊，乔！你起得真早。好狗儿，别凑得太近。它们没准会把你当成布鲁诺，冷不防咬你一口，或者踢你一下。那条狗我早该开枪打死了。为了一条坏狗，倒让一条好狗跟着受罪，的确不公平，可世道就是这样。怎么样，老伙计？我的马厩还不错吧？
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            他一边喂马、刷马，一边不停同我说话。我很快就看出来，这些马是他最得意的宝贝。我喜欢听人同我讲话。莫里斯先生常把讲道词念给我听，劳拉小姐也会把那些不肯告诉别人的秘密说给我听。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            伍德先生开始刷一匹灰色的大挽马，它叫杜奇曼。他右手拿刷子，左手拿马梳，把全身的皮毛仔细梳过、刷过，最后又拿布擦了一遍。
        - id: ch01-b07
          speaker: mr_wood
          text: 好好刷一回，抵得上两夸脱燕麦呢，乔。
        - id: ch01-b08
          speaker: beautiful_joe
          text: 接着，他弯腰检查杜奇曼的马蹄。
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            杜奇曼，你的蹄铁太重了。那个死脑筋的铁匠还以为自己比我懂马。我告诉他，别削蹄底和蹄叉，别把马蹄修掉那么多，也别拿锉刀乱锉。蹄铁得照着马蹄配，不能倒过来削马蹄迁就蹄铁。他那张脸，简直只差叫我少管闲事。咱们以后不找他了。真是老狗学不会新把戏。我让你替我干活，可不是叫你把力气全耗在抬这些沉蹄铁上。
        - id: ch01-b10
          speaker: beautiful_joe
          text: 伍德先生安静了一会儿，吹了几声曲子，随后又打开了话匣子。
        - id: ch01-b11
          speaker: mr_wood
          text: >-
            乔，我研究马有四十多年了。依我看，寻常的马常常比驾驭它的寻常人聪明。那些蠢人赶着温顺的马到处跑，拿刺棒戳它们，拿鞭子打它们，又从来不肯理解它们，只当马是稍微有点活气的土块。我真想把马从车辕里卸下来，再把那帮人套进去，赶着他们飞跑，一路抽打，一路猛扯缰绳。到那时，他们的耐性准不如马。
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            再看看杜奇曼这副大块头。你也许会觉得，它的神经跟花岗岩一样粗，其实它的皮肤像姑娘的一样敏感。我拿马梳稍微重一点，它就会发颤。从前的主人不懂，还奇怪这匹本该靠得住的马为什么见了马童就又踢又跺。我一听便知道，是那马童下手太重。四条腿的动物做什么事都有缘故，不像有些两条腿的家伙。
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            琼斯执事还说，它只不过是匹拉车的马。我告诉他，不管拉不拉车，这就是一匹皮肤娇嫩的马，哪怕它长得像大象也一样。那老头嘟囔着，说他的马厩容不下纯种马的娇气，所以我便把你买来了，对不对，杜奇曼？
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            他亲切地摸摸杜奇曼，又走到下一处马栏。每处栏里都有一个小水槽，上面的盖子可以推开，也可以合上。后来我才弄明白，马要是刚刚跑回来，浑身热得厉害，水槽便会暂时盖住，不让它马上喝水。其他时候，它想喝多少都行。伍德先生觉得所有动物都该有充足的清水，而且每一只都该有自己固定的饮水处。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            就连我的柴房里也放着一只小水碗。其实我口渴时，完全可以跑到牲口院去喝。可我才到这里，伍德太太便吩咐阿黛尔一直把碗放在那里。我感激地抬头望着她。
        - id: ch01-b16
          speaker: mrs_wood
          text: 每只动物都该有自己吃东西的地方，也该有自己睡觉的地方，乔。这样才公平。
          emotion: calm
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            接下来轮到两匹黑马，克利夫和佩瑟。佩瑟嘴里有点毛病，伍德先生便翻开它的嘴唇，仔仔细细地查看。马厩开着几扇很大的窗户，里面亮得跟伍德先生的住房一样，因此连嘴里的伤处也能看清。他走出马栏，从我旁边经过，要去架子上拿一只瓶子。
        - id: ch01-b18
          speaker: mr_wood
          text: >-
            这里没有黑乎乎的角落，对吧，乔？盖马厩时我就说，绝不能留下让粗心人藏污纳垢的暗洞。阳光得照进每个角落。马讨厌臭味，我不让它们闻。我也不想让它们总关在黑洞里，一走进大白天便受惊。到现在，我还没有一匹马生过病呢。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            他往碟里倒了点药水，回去清洗佩瑟嘴里的伤口。我跟过去，站在马栏外。佩瑟微微缩了一下。
        - id: ch01-b20
          speaker: mr_wood
          text: 稳住，稳住，我的漂亮宝贝。很快就好了。
          emotion: calm
        - id: ch01-b21
          speaker: beautiful_joe
          text: 佩瑟用聪慧的眼睛望着主人，仿佛明白主人是在替它治病。
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            乔，瞧瞧这嘴唇，跟我们的嘴唇一样细嫩。可有些畜生般的人偏要用力猛扯，好像它们是铁打的。我真希望上帝能让马开口说一个星期的话。到时候，我们当中准有人会吓坏。好了，佩瑟，已经弄完了。我不会灌你太多药。得了重病，就该请好兽医。只是小毛病，简单治治便好。不知多少好马是被人下药灌药，活活治死的。斯坎普，我的漂亮宝贝，今早怎么样？
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            佩瑟隔壁住着一匹乌黑发亮的小母马。它头形瘦削，四条腿又细又长，总是显得有些不安分，简直像马群里的一条灵缇犬。它身上没有一点多余的肉，却筋骨结实，能做许多活。那小家伙看上去脾气很坏，我觉得还是离它的后蹄远些为妙。伍德先生却百般疼爱它。我看得出，斯坎普是他最喜欢的一匹马。它装作要咬他，他便同它说起话来。
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            淘气包！你知道的，你咬我，我也会咬回去。我想我总算把你驯服了，可你当初真把我折腾得够呛。还记得吗？不管前面什么东西把你吓着，你都会闪电般转过身，朝相反方向逃跑。正因为这个坏习惯，我才没花几个钱便买下了你。后来我是怎么治好你的？我有没有打你，把你打得越来越犟？我才不呢。你想转，我就让你一圈圈地转个够。你想扭，我也由着你扭。你转得越多，我越高兴。后来你那颗漂亮脑袋终于明白，再这样转来扭去，只会把自己的脑子搅糊涂，还是让我做主的好。
        - id: ch01-b25
          speaker: mr_wood
          text: >-
            从那天起，你一直听我的话，是不是？不管马、人还是狗，不学会服从，就成不了什么好样子。我已经把你摔倒过了。你若咬我，我还会再来一次，所以小心点。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            斯坎普甩着漂亮的脑袋，用嘴衔住伍德先生的一小片衬衫袖子。那双机灵的褐眼睛始终瞧着他，像是在试探自己能胡闹到什么地步，可它并没真咬。我想它是爱他的。他一离开，它就尖声嘶鸣，伍德先生只好回头再抚摸它，哄一哄它。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            后来，我常看斯坎普在农场干活。它拉着东西，总是拼命使劲，还一心想走得更快，多做些事。赶它的通常是伍德先生。雇工们不喜欢它，也驾驭不了它，因为它从前没有被好好驯过。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            等活儿全忙完了，伍德先生走到马厩门口站住。那里一共有六匹马，灰色的大挽马杜奇曼，两匹黑马克利夫和佩瑟，乌黑的小母马斯坎普，还有一匹名叫鲁比的枣红母马。最后一匹是哈里先生的年轻马，名叫飞毛腿。伍德先生低下头，问我怎么看这些马。
        - id: ch01-b29
          speaker: mr_wood
          text: >-
            它们个个都很漂亮，对不对？这里没有纯种马，可在我心里，每一匹都不比那些血统谱长得铺满木板路的马便宜。拿血统说事，多半是骗人的花样。我的马至少都留着鬃毛和尾巴，也能好好使用眼睛。有些纯种马享到的自由，还没有它们多呢。
        - id: ch01-b30
          speaker: mr_wood
          text: >-
            谁也别想说服我给马戴眼罩、缚仰缰，或套上别的刑具。那些傻瓜难道不知道，眼罩害出了多少事故吗？我还是别说数目了，免得你觉得我夸张。仰缰更会把马头从自然的弧度里硬扯起来，让筋、骨头和关节紧紧挤在一起，简直能把马逼疯。唉，乔，这世界对人和牲畜都很残酷。你没了耳朵和尾巴，便是活生生的证据。
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            现在我也得残酷一回，去开枪打死那条狗了。得赶在别人起床前把它处理掉。夺走一条性命，我真厌恶。
          emotion: sad
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            他沿木板路慢慢走到工具房，不久便用链子牵出一条棕色的大狗。那正是布鲁诺。它一路又狂吠又咆哮，还不停啃咬链子，伍德先生仍旧很温和地牵着它。它一看见我，那副凶狠模样简直像要把我撕成碎片。伍德先生先把它带到谷仓后面，随后又独自回来拿枪。我赶紧跑得远远的，不愿听见枪声。我知道它很坏，却还是忍不住替布鲁诺难过。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            劳拉小姐的房间在房子一侧的二楼，外面有个小阳台。我走近时，她裹着披肩站在那里，长发披在肩头，正低头看着开满白花和黄花的园子。我叫了一声，她便望向我。
        - id: ch01-b34
          speaker: miss_laura
          text: 亲爱的老乔，我穿好衣服就下来。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            她说完便匆匆回到房里。我趴在游廊上等着，直到听见她走来的脚步声，才立刻跳起来。她打开前门，我们一起沿着小路散步，一直走到通往外面的大路边。后来早餐铃响了，我们听见铃声，马上转身跑回屋里。劳拉小姐吃早餐时胃口好极了，姨母看见后便说，乡下的生活已经让她精神好多了。
