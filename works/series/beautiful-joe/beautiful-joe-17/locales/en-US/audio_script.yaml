  chapters:
    - id: ch01
      title: MR. WOOD AND HIS HORSES
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Early on our first morning in Riverdale, I got up and wandered around the house. I slept in the woodshed, so I could run outside whenever I pleased. The tool shed stood nearby. Beyond that were a carriage house and a plank walk that led to the barnyard.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            I followed the walk to the first building and peered inside. It was the horse stable. The door was open, and morning sunlight streamed in. Several horses stood in their stalls. Some faced me, and some had their tails toward me. Gates closed the stalls instead of ropes, so each horse could turn whichever way it liked.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            A man was working at the far end. I knew it was Mr. Wood long before he noticed me. His stable was wonderfully clean. Jenkins's stable had always sent out a foul smell, but the air here seemed as fresh indoors as it was outside. Small gratings let air through the walls without sending drafts over the horses.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Mr. Wood moved from horse to horse with their hay, talking cheerfully as he went. At last, he caught sight of me.
        - id: ch01-b05
          speaker: mr_wood
          text: >-
            A fine good morning to you, Joe! You're up early. Don't get too close to the horses, good dog. They may take you for another Bruno and slip you a bite or a kick. I should have shot him long ago. It's a hard thing when a good dog must suffer because of a bad one, but that's the way of the world. Well, old fellow, how do you like my stable? It's a decent one, isn't it?
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            He kept talking to me while he fed and groomed his horses. It did not take long to see that they were his greatest pride. I enjoy having people talk to me. Mr. Morris often reads his sermons aloud to me, and Miss Laura trusts me with secrets I don't believe she tells anyone else.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            I watched closely as Mr. Wood groomed a huge gray cart horse named Dutchman. He held a brush in his right hand and a currycomb in his left. He worked over every part of Dutchman's skin, then wiped him with a cloth.
        - id: ch01-b08
          speaker: mr_wood
          text: A thorough grooming does as much good as two quarts of oats, Joe.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Next, he bent down to inspect Dutchman's hooves.
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            Those shoes are too heavy, Dutchman. That pigheaded blacksmith believes he knows more about horses than I do. I tell him not to cut the sole or the frog, not to pare the hoof so far, and not to rasp it. I tell him to shape the shoe for the foot, instead of shaping the foot for the shoe. Then he looks at me as though he'd like to say, “Mind your own business.” We won't use him again. It's hard to teach an old dog new tricks. I hired you to work for me, not to waste your strength lifting his heavy shoes.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Mr. Wood fell quiet for a few minutes and whistled a tune. Then he started talking again.
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            I've studied horses for more than forty years, Joe. In my opinion, the average horse knows more than the average man who drives him. Think of all the fools who prod patient horses, beat them, and misunderstand them. They act as if a horse were a clod of earth with just a spark of life inside. I'd like to take those drivers out of the shafts and harness the men in their place. I'd trot them hard, whip them, and jerk them about. I doubt they'd keep their patience as long as the horses do.
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            Now look at Dutchman. Just see how big he is. You might think he has no more feeling than a piece of granite, but his skin is as sensitive as a girl's. Watch him quiver if I bear down too hard with the currycomb.
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            The fool who owned him before me couldn't understand why Dutchman kicked and stamped whenever the stable boy came near. “Your boy's hand is too heavy, Deacon Jones,” I told him. “You can depend on this. A four-legged creature, unlike a two-legged one, has a reason for everything he does.”
        - id: ch01-b15
          speaker: mr_wood
          text: >-
            Deacon Jones answered, “But he's only a draft horse.” I told him, “Draft horse or not, you're describing a tender-skinned horse. I wouldn't care if he were as big as an elephant.” The old man grumbled that he wanted no thoroughbred airs in his stable. So I bought you, didn't I, Dutchman?
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Mr. Wood gave Dutchman a gentle stroke and moved on to the next stall.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Every stall had a small water tank with a sliding cover. I learned later that the cover was closed when a horse came in too hot to drink safely. At all other times, the horse could drink as much as it wished. Mr. Wood wanted every animal to have plenty of pure water and a drinking place of its own.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Even I had my own little bowl in the woodshed, though the barnyard was close enough for me to run there. As soon as I arrived, Mrs. Wood asked Adele to keep the bowl filled. I looked up at her gratefully.
        - id: ch01-b19
          speaker: mrs_wood
          text: >-
            Every animal ought to have a feeding place and a sleeping place of its own, Joe. That's only fair.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            Mr. Wood groomed the two black horses next, Cleve and Pacer. Something was wrong with Pacer's mouth, so he turned back the horse's lips and examined it. The stable had large windows and was as bright as the house, which made the task easy.
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            No dark corners in here, eh, Joe? When I had this stable built, I said there would be no filthy holes where careless men could hide their dirt. I want sunlight in every corner. I don't want my horses breathing foul smells, because they hate them. And I don't want them shying when they step into daylight after being shut in a black stable. I've never had a sick horse yet.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            He had come out of the stall and passed me on his way to a shelf. He took down a bottle, poured some liquid into a saucer, and returned to Pacer. I followed but waited outside. Mr. Wood washed a sore place in the horse's mouth. Pacer flinched a little.
        - id: ch01-b23
          speaker: mr_wood
          text: Easy now, my beauty. It will soon be finished.
          emotion: calm
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            Pacer fixed his intelligent eyes on Mr. Wood. He seemed to understand that his master was trying to help him.
        - id: ch01-b25
          speaker: mr_wood
          text: >-
            Look at these lips, Joe. They're as fine and delicate as ours, yet some brutes jerk them about as if they were iron. I wish the Lord would give horses voices for one week. They would frighten some people, I can tell you.
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            There, Pacer, it's done. I won't give you much medicine. I don't believe in that. For serious trouble, call a good horse doctor. For something simple, use a simple remedy. Many a fine horse has been drugged and dosed to death. Well, Scamp, my beauty, how are you this morning?
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            The next stall held a small jet-black mare. She had a lean head, slender legs, and a restless way about her. She was built like a greyhound, with no extra flesh, but she was wiry and capable of a great deal of work. She looked wicked to me, so I stayed well away from her heels.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            Mr. Wood petted her more than the others, and I could see she was his favorite. She made believe she would bite him.
        - id: ch01-b29
          speaker: mr_wood
          text: >-
            You little saucebox! You know that if you bite me, I'll bite you back. I believe I've mastered you now, though you certainly led me a dance.
        - id: ch01-b30
          speaker: mr_wood
          text: >-
            Do you remember how cheaply I bought you? Whenever anything frightened you, you had a bad habit of spinning around in a flash and bolting the other way. And how did I cure you, my beauty? Did I beat you and make you stubborn? Not I. I let you turn. I turned you around and around, and the more often you did it, the better it suited me. At last, I got it into that pretty head of yours that all the turning and twisting only muddled your brains, and you might as well let me be master.
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            You've obeyed me ever since, haven't you? A horse, a man, or a dog isn't much use until it learns to obey. I've thrown you down before, and I'll do it again if you bite me, so mind yourself.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Scamp tossed her pretty head. She took little pieces of his shirtsleeve between her teeth and watched him with one cunning brown eye, testing how far she could go. But she never bit him. I think she loved him. When he walked away, she gave a sharp whinny, and he had to return to stroke and caress her.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            In the days that followed, I often watched Scamp working around the farm. She always strained at her load and tried to step quickly, as if she wanted to accomplish a great deal. Mr. Wood usually drove her. The other men disliked her and could not manage her because she had never been properly broken in.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            When his work was done, Mr. Wood stood in the stable doorway. There were six horses in all. Dutchman, Cleve, Pacer, Scamp, a bay mare named Ruby, and Fleetfoot, a young horse who belonged to Mr. Harry.
        - id: ch01-b35
          speaker: mr_wood
          text: >-
            Well, what do you think of the lot, Joe? They're a fine-looking set, aren't they? Not one is a thoroughbred, but each is worth as much to me as if its pedigree stretched the whole length of this plank walk.
        - id: ch01-b36
          speaker: mr_wood
          text: >-
            There's a great deal of nonsense in this pedigree business. My horses still have their manes and tails, and they can use their eyes properly. That's more freedom than some thoroughbreds are given.
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            I'd like to meet the man who thinks he can persuade me to put blinders, checkreins, or any other torture on my horses. Don't those simpletons know how many accidents blinders cause? I won't say the number, Joe, or you may think I'm stretching the truth. A checkrein pulls a horse's head out of its fine natural curve. It crushes sinews, bones, and joints together until the poor horse is nearly mad.
        - id: ch01-b38
          speaker: mr_wood
          text: >-
            Ah, Joe, this is a cruel world for people and animals alike. You stand there as proof of it, without your ears or your tail. And now I must do something cruel myself. I have to shoot that dog before anyone else is awake. How I hate taking a life.
          emotion: sad
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Mr. Wood walked slowly down to the tool shed. Soon he came out leading Bruno, a large brown dog, by a chain. Bruno snapped and snarled and bit at the chain, though Mr. Wood handled him kindly. When he saw me, he acted as though he wanted to tear me apart.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            Mr. Wood took Bruno behind the barn, then came back for his gun. I ran away because I could not bear to hear the shot. I could not help feeling sorry for Bruno.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Miss Laura's room was on the second floor at one side of the house. It had a little balcony. When I drew near, I saw her standing there wrapped in a shawl, with her hair flowing over her shoulders. She was looking into the garden, where many white and yellow flowers were blooming.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            I barked, and she looked down at me.
        - id: ch01-b43
          speaker: miss_laura
          text: Dear old Joe, I'll dress and come down.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            She hurried back into her room. I lay on the veranda until I heard her footsteps. Then I sprang up. She unlocked the front door, and we walked down the lane toward the road. When the breakfast bell rang, we ran back to the house. Miss Laura ate so heartily that her aunt said the country had already done her good.
