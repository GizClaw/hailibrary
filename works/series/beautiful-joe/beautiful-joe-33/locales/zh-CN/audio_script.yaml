audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快利落，充满少年人的朝气
        timbre: 清亮结实
        pace: 稍快
        pitch: 中
    bellini:
      display_name: 贝利尼
      tts:
        delivery: 热情自信，带着意大利口音和舞台上的夸张礼貌
        timbre: 苍老洪亮
        pace: 适中
        pitch: 中
    audience_boy:
      display_name: 看演出的男孩
      tts:
        delivery: 直率冒失，起哄时毫不客气
        timbre: 明亮稚嫩
        pace: 快
        pitch: 中高
    poor_woman:
      display_name: 穷苦女人
      tts:
        delivery: 苦涩悲悯，话语沉重而克制
        timbre: 粗哑疲惫
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十三章　会表演的动物
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我们回家一两个星期以后，莫里斯家的男孩们常谈起一个意大利人。他要带一班训练有素的动物来费尔波特。每逢进城，我也能看见篱笆上那些鲜艳的大海报。画里的猴子坐在桌边，狗、小马和山羊爬梯子、滚球，还会许多把戏。我一直好奇，它们真有那么大的本领吗？后来才知道，海报没有骗人。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            那个意大利人叫贝利尼。一天下午，莫里斯全家都去看了他和那些动物。回来以后，大家还在谈论那场演出。杰克把我的两只前爪拉起来，搁在自己膝上，要把见到的一切从头讲给我听。
        - id: ch01-b03
          speaker: jack
          text: >-
            乔，你当时要是在场就好了。听我说，老伙计。镇公所里挤得动都动不了。我和一群伙伴坐在前排，什么都看得清。老意大利人穿着最好的黑呢礼服，纽扣眼里还插着花。他走出来，先规规矩矩地鞠了一躬。
        - id: ch01-b04
          speaker: bellini
          text: >-
            见到各位尊贵的观众，我非常高兴。今天，我要请大家看看出色的动物，世上最最出色的动物。这根小鞭子可不表示我残忍。我把它甩响，只是告诉动物什么时候开始，什么时候结束，什么时候换一个把戏。
        - id: ch01-b05
          speaker: audience_boy
          text: 胡说！你有时候就是会抽它们。
        - id: ch01-b06
          speaker: jack
          text: >-
            老人又鞠了一躬。大家听了他的回答，全都笑那个男孩。
        - id: ch01-b07
          speaker: bellini
          text: >-
            那当然。我会抽它们，就像妈妈教训淘气的孩子。它们吵闹或者犯倔的时候，得叫它们安静下来。
        - id: ch01-b08
          speaker: jack
          text: >-
            贝利尼请一位女士弹首进行曲，让全体动物列队登场。妮娜·史密斯走到钢琴前，就是那个住在街角、眼睛乌黑、系蓝丝带的姑娘。她铿铿锵锵地弹起来，台侧的门也开了。动物们一对一对往外走，简直就是诺亚方舟里的队伍。
        - id: ch01-b09
          speaker: jack
          text: >-
            一只猴子抓着马鬃，走在一匹小马身旁。另一只骑在马背上，还有两只手拉着手。一条狗驮着鹦鹉，一只山羊拉着小车，另一只嘴里衔着鸟笼，笼中还有两只金丝雀。后面跟着各色的猫、斑鸠和鸽子。六只套着红挽具的白老鼠拖来一辆小战车，车上也坐着猴子。最后是一只普通的白公鹅。它什么也不做，只跟着一匹小马走。
        - id: ch01-b10
          speaker: jack
          text: >-
            贝利尼说，那只公鹅很笨，学不会把戏。他还肯养着它，只是因为它离不开那匹小马。他去佛蒙特州寻找能登台的动物时，在一座农场发现了它们。小马原来的主人把它当宠物，一吹口哨，它就会跑过去。它血统普通，性情却温和，全农场的动物都喜欢它，公鹅尤其喜欢。
        - id: ch01-b11
          speaker: jack
          text: >-
            小马走到哪里，公鹅就跟到哪里。偶尔找不见了，它便登上小丘，伸长脖子四下寻找。一瞧见朋友，它马上欢喜地叫着奔过去，摇摇摆摆地陪在旁边。小马常低下鼻子，像是在同它说话。农夫若吹口哨叫走小马，公鹅追不上，就一口叼住马尾，拍着翅膀跟它一起跑。小马从不踢它。贝利尼看出这匹马适合登台，便出了一大笔钱买下它。
        - id: ch01-b12
          speaker: jack
          text: >-
            对了，乔，我刚才忘了说。讲到这里时，别的动物都已经退场，台上只留下小马和公鹅。贝利尼说话，它们就站在那里望着他。我从没见过哪只不会说话的动物，脸上能像那匹马一样通人性。它仿佛连主人说的每一个字都听得懂。故事讲完，贝利尼鞠躬，又叫小马也行礼。小马向观众点头，逗得人人发笑。他再请小马跳一支华尔兹，小马就用后腿站起来舞动。公鹅为了挨近它，又得避开它的蹄子，在四周忙乱地跑来跑去，那模样真该让你亲眼看看。我们这群男孩全都笑得震天响。
        - id: ch01-b13
          speaker: bellini
          text: >-
            各位小先生，请不要再这样吵了。让小马把其余的本领也演完吧。
        - id: ch01-b14
          speaker: jack
          text: >-
            要不是他央求，我们真能让小马跳上一下午。第二匹小马登台后，两匹马做出的事古怪得叫人不敢相信。它们帮贝利尼穿上外套，脱掉套鞋，又把外套拿走。接着，它们给他搬来椅子，把一张桌子拖到椅子跟前。它们会取信件和报纸，会摇铃、滚木桶，还把贝利尼推在一架大秋千上荡来荡去。它们也会跳绳，上下台阶。两匹马只凭牙齿就在台上跑前跑后，灵便得像两个用双手干活的男孩。主人说的每一句话，它们仿佛全都听得懂。
        - id: ch01-b15
          speaker: jack
          text: >-
            最精彩的是报时和算术。贝利尼把怀表给一匹叫钻石的小马看，问它几点。钻石用前蹄刨了四下。贝利尼说是四点，又问过了几分钟，钻石再刨五下。他给观众看表，果然是四点零五分。他问钻石几岁，它刨四下，表示四岁。一星期有几天，一年有几个月，还有加减法，钻石一道也没答错。贝利尼当然给了暗号，可我们盯得再紧，也没看出来。
        - id: ch01-b16
          speaker: bellini
          text: >-
            你今天很乖，功课也做得好。要是调皮一阵能让你歇一歇，你现在可以淘气了。
        - id: ch01-b17
          speaker: jack
          text: >-
            钻石的眼神一下变坏了。它转身朝主人尥蹄子，又掀翻桌椅，撞倒那块写算术的黑板。刚才，它还衔着海绵擦上面的数字呢。贝利尼装出生气的样子，把另一匹小马叫过来。
        - id: ch01-b18
          speaker: bellini
          text: 行啦，行啦，这可不成。快把这个捣蛋鬼带下台去。
        - id: ch01-b19
          speaker: jack
          text: >-
            第二匹马先用鼻子拱钻石，把它推来推去，最后咬住它的耳朵。钻石尖叫着给领下了台。那只公鹅紧跟在后面，嘴里嘎嘎叫个不停。观众的掌声都快把屋顶掀了。
        - id: ch01-b20
          speaker: jack
          text: >-
            后来有人搬来梯子，一群和你有些相像的杂种狗上了台。贝利尼说，纯种动物反而没有杂种动物好教。那些狗有的跳过梯子，有的爬上去，还有的从梯档中钻过去，各种动作都会做。鞭子响一下，它们开始表演。响两下，它们就把刚才向前做过的动作倒着来一遍。响三下，它们马上停住。每一只动物，不管是狗、山羊、小马还是猴子，做完把戏都会跑到主人身边，由他赏一块糖。它们显然很喜欢他。哪怕不在表演，也常常凑过去，舔他的手或衣袖。
        - id: ch01-b21
          speaker: jack
          text: >-
            领头的狗叫鲍勃，脑袋长得很像你。它的把戏全都独自完成。贝利尼先退下台，鲍勃再自己登场行礼，爬过梯子，跳过栏杆，然后退场。观众扯着嗓子要求再看一次，它当真独自回来，又郑重鞠了一躬才走。老布朗法官笑得眼泪直流，得不停拿手去擦。靠近结尾时，还有一只山羊站上大球，踩着球从舞台一头滚到另一头，一次也没掉下来。贝利尼说，山羊最难训练，所以这才是最厉害的把戏。那只羊紧张得像猫，老胡子不住发颤，四只蹄子拼命凑在一起，好让自己别从球上摔下去。
        - id: ch01-b22
          speaker: jack
          text: >-
            演出最后还有一出滑稽戏。一只猴子扮成格林小姐，穿白缎衣服，戴着垂白面纱的帽子。鲍勃成了要同她私奔的史密斯先生。它一身浅色衣裳，高帽歪戴在头上，高衣领、长袖口，手里还有手杖，真是十足的花花公子。它用后腿走到格林小姐面前，扶她骑上小马。小马载着她飞奔下台。
        - id: ch01-b23
          speaker: jack
          text: >-
            一大群猴子立刻跑出来，又叫又嚷，还不停搓手。史密斯先生拐走了他们家的孩子。父母戴着灰假发，穿黑衣服，小孩子们系着围嘴，也都打扮得古里古怪。小马一回来，他们便扑上去扯下格林小姐，一边叽叽喳喳地数落，一边打她耳光。他们摘掉白面纱，脱下白缎衣，给她换上破旧的褐衣服。另几只猴子抓住鲍勃，踢掉帽子，折断手杖，把衣服剥下来扔到角落，又拿绳子捆住它的腿。
        - id: ch01-b24
          speaker: jack
          text: >-
            一只山羊拉着小车上来。猴子们把鲍勃丢进车里，推着绕台几圈，又把它拖出来，绑到墙上的钩子上。山羊退场以后，猴子们躲到一旁。其中一只掏出小手枪，对准鲍勃开了一枪。鲍勃倒下去，装成死了。
        - id: ch01-b25
          speaker: jack
          text: >-
            猴子们站在那里盯着它。忽然，台上爆发出你从没听过的可怕喧闹声，到处都是狂吠和尖叫。六条狗一齐冲出来，把猴子撞得东倒西歪。它们用鼻子拱，用身子推，还咬住猴子使劲摇，直到猴子们全都逃走。只有格林小姐留在角落里，缩成一团，不住发抖。过了一会儿，她慢慢爬到那条死狗身边，伸出爪子轻轻碰了碰它。鲍勃猛地跳起来，原来活得好好的，一点也不比别的动物差！满屋的人都在鼓掌欢呼，幕布这才落下，演出也结束了。真希望贝利尼再演一次，可他第二天一早就得去波士顿。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            杰克讲完，把我的前爪推下膝头，出门去了。我也很想见见那些动物。离晚茶还有不少时间，足够我跑到它们住的旅馆去，于是我立刻动身。那天傍晚很暖，夕阳正沉入薄雾。莫里斯先生白天说过，这就是这里的小阳春，寒冷的天气很快会来。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            费尔波特是一座美丽的小镇。站在主街上，可以望见海湾的蓝色水面和对岸的岛。夏天的游客已经回家，岛屿旅馆也关了门，如今岛上空空荡荡。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            我沿一条陡峭的侧街往海边跑，迎面来了一辆满载的大车。车上尽是古怪的箱子和包裹，想必刚从某条船上运下来。拉车的是一匹漂亮又敏感的马。为了把沉重的车拖上陡坡，它浑身每一处都在用力。那个身材粗壮、面目冷硬的车夫不肯让它停下来喘一口气，只顾逼它继续往前。可怜的马不断回头看主人，眼珠都快吓得突出来了。它知道，鞭子马上就要落到自己颤抖的身上。
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            鞭子真的落下来了。附近没有能出面阻拦的人，只有一个披着破旧披肩的女人，可她说的话对车夫不会有半点分量。费尔波特的仁慈会办得很好，只要会员在场，没有哪个赶车人敢虐待自己的马。但这里偏僻又冷清，街旁全是穷人的房子。那男人多半知道，仁慈会会员不大可能住在这里。他一鞭接一鞭地抽，鞭鞭都落在马身上，每一下都打得我心里发疼。我要是敢扑上去，真想狠狠咬他一口。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            街上忽然传来一声闷响。马倒下了。车夫跑到它头前，可它已经死去。
        - id: ch01-b31
          speaker: poor_woman
          text: 感谢上帝！这个苦难的世界里，又少了一个受罪的生命。
          emotion: sad
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            女人说得悲苦，随后转身走下街去。我倒替那匹马庆幸。它以后再也不会害怕，也不会受苦。我慢慢往前走，心里想着，对那些受尽折磨的动物来说，死亡也许就是它们所能遇到的最好结局。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            费尔波特大旅馆是一座高高的砖楼，正好建在镇中心，商店和住宅紧紧围在四周。我沿人行道跑过去，忽然听见有人叫我。抬头一看，原来是查理·蒙塔古。我听莫里斯一家说过，他家的房子正在修，所以父母要在旅馆住几个星期。他身边带着自己的爱尔兰雪达犬布里斯克。那条狗站在阳光里，摇着丝绸般的尾巴，模样十分英俊。查理拍了拍我，就和布里斯克一起走进旅馆。
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            我转进马厩院子。地方又小又拥挤，出租马车和货车塞得到处都是。我从这些车子下面小心地穿过去，忍不住纳闷，旅馆为什么不买下附近几所旧房子，把它们拆掉，再扩出一座配得上这栋漂亮建筑的马厩院。旅馆的马做完一天的活，正在让人刷洗，别的马也陆续从外面回来。马夫们说说笑笑，四周却看不见外来的动物，我只好绕到院子后面去找。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            它们原来都住在干草阁下面的一间空牛棚里。两匹小马拴在一处栏位中，后面还有两只山羊，狗和猴子则关在结实的旅行笼里。我停在牛棚门口，把这些动物仔细看了一遍。这样美好的傍晚，狗儿却不能出来走动，我真替它们难过。不过我也猜得到，它们的主人若放它们出来，一定会担心它们走失，或者被人偷去。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            这些动物都很友善。小马回头用温和的眼睛看我，又低头嚼草。我往里面走了几步，寻找那只公鹅。一个白色的东西从褐色小马的食槽里抬起来，正是公鹅。它紧挨着朋友张开的嘴。猴子用黑色的小手抓住笼栏，叽叽喳喳地打量我。狗儿们嗅着空气，摇着尾巴，努力把口鼻伸出栏杆。
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            我最喜欢的还是狗，也想亲眼看看鲍勃，便走到笼边。里面有两条像小比利的白狗、两条杂种猎鹬犬、一条爱尔兰梗，还有一条褐色的狗在角落睡觉。那一定是鲍勃。它确实有些像我，不过没有我这么丑，因为它的耳朵和尾巴都还在。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            我正隔着栏杆看鲍勃，一个男人走进马厩。他第一眼就注意到我，却没有把我赶走，反而用一种我听不懂的语言亲切地同我说话。我立刻知道，他就是贝利尼。动物们一见他，全都高兴极了。公鹅扑扇着翅膀跳出窝，小马用力拉扯缰绳，狗呜呜叫着，拼命想凑过去舔他的手，猴子也欢快地叫个不停。他笑着回答它们，说的是一串柔和而奇异的话。
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            贝利尼从挎在胳膊上的袋子里取出食物。他把骨头分给狗，把坚果和糕饼给猴子，把鲜嫩多汁的胡萝卜给小马，又拿出青菜喂山羊，拿玉米粒喂公鹅。看着这位老人亲手给宠物们喂食，实在是一幅动人的景象。我看着看着，自己也觉得很饿，便小跑着回家去了。
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            当天晚上，我又陪莫里斯先生进了一趟城。他要去商店替太太买点东西。晚茶以后，他从不准男孩们再往城里跑，所以一有差事，总是他自己或莫里斯太太亲自去办。那晚镇上灯火通明，街道显得又明亮又热闹。许多人正在外面散步，还不时停下来，看看商店橱窗里陈列的东西。
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            回家以后，我和吉姆钻进狗舍，一直睡到半夜。忽然，我惊醒了，赶紧跑到外面。远处有钟声响起。我们在费尔波特常听到这种钟声，而它每一次响，都表示什么地方失火了。
