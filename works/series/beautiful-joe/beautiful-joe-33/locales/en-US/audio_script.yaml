  chapters:
    - id: ch01
      title: PERFORMING ANIMALS
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            A week or two after we came home, I heard the Morris boys talking about an Italian who was bringing trained animals to Fairport. Whenever I went into town, I saw bright posters covering the fences. They showed monkeys at tables, dogs and ponies doing tricks, and goats climbing ladders and rolling balls. I wondered whether animals could truly do such amazing things. As it turned out, they could.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            The Italian was named Bellini. One afternoon, the whole Morris family went to see his show. When they came back, Jack lifted my front paws onto his knees and began telling me everything.
        - id: ch01-b03
          speaker: jack
          text: >-
            Oh, Joe, I wish you'd been there! Listen, old fellow, and I'll tell you all about it. The town hall was packed so tightly that you could hardly move. I sat right at the front with a crowd of other boys, so I could see perfectly. Bellini came out in his best black broadcloth suit, with a flower in his buttonhole. He bowed grandly, said how pleased he was to see such a fine audience, and promised to show us the finest animals in the world.
        - id: ch01-b04
          speaker: jack
          text: >-
            He carried a little whip. He shook it and explained that it wasn't there for cruelty. A crack told the animals when to start a trick, stop one, or change to another.
        - id: ch01-b05
          speaker: boy
          text: You do whip them sometimes!
        - id: ch01-b06
          speaker: beautiful_joe
          text: Bellini bowed again before he answered the boy.
        - id: ch01-b07
          speaker: bellini
          text: >-
            Certainly. I whip them as mothers whip naughty boys, when they are noisy or stubborn and must be kept still.
        - id: ch01-b08
          speaker: jack
          text: >-
            Everyone laughed at that boy. Then Bellini asked a lady to play a march so all the animals could parade. Nina Smith went to the piano. You know Nina, Joe. She has black eyes, wears blue ribbons, and lives around the corner. She struck up a fine, loud march, and the side doors opened.
        - id: ch01-b09
          speaker: jack
          text: >-
            The animals marched out two by two, like Noah's ark. A monkey walked beside one pony, holding its mane, while another monkey rode on a pony's back. Two more monkeys held hands. A parrot rode on a dog. One goat pulled a tiny carriage, and another carried a birdcage in its mouth with two canaries inside. There were cats of several kinds, doves and pigeons, and six white rats in red harness pulling a little chariot with a monkey aboard. Last came an ordinary white gander. He did no trick at all. He simply followed one pony wherever it went.
        - id: ch01-b10
          speaker: jack
          text: >-
            Bellini said the gander could learn nothing, but he kept the bird because it loved that pony. He had found them both on a farm in Vermont while searching for animals for his show. The farmer had treated the pony as a pet and taught him to come at a whistle. The pony was plain, but so gentle that every animal on the farm liked him best.
        - id: ch01-b11
          speaker: jack
          text: >-
            The gander especially adored him. It followed the pony everywhere. If they were separated, the gander climbed a little hill, stretched its neck, and searched until it saw its friend. Then it gabbled for joy and hurried over to waddle beside him. The pony often lowered his nose as if the two were having a talk. When the farmer whistled and the pony ran to him, the gander knew it could not keep pace. It caught the pony's tail in its beak and flapped along behind. The pony never kicked it.
        - id: ch01-b12
          speaker: jack
          text: >-
            Bellini knew the pony could be trained for the stage, so he paid the farmer a large price and took him away. By then, all the other animals had left the stage. Only the pony and gander remained, watching Bellini as he spoke. Joe, that pony's face looked almost human. He seemed to understand every word.
        - id: ch01-b13
          speaker: jack
          text: >-
            When Bellini finished the story, he bowed once more and asked the pony to bow too. The pony nodded his head at us, and everybody laughed. Then Bellini invited him to dance a waltz. Up rose the pony on his hind legs, and away he went. The gander darted all around him, trying to stay close to his friend without getting under those dancing heels. We boys roared and would have kept him dancing all afternoon. Bellini finally had to beg the young gentlemen to make less noise and let the pony finish the rest of his tricks.
        - id: ch01-b14
          speaker: jack
          text: >-
            A second pony joined him, and you never saw anything stranger than those two at work. They helped Bellini put on his coat and pulled off his rubber shoes. They carried away the coat, fetched a chair, and dragged over a table. They brought letters and papers, rang bells, rolled barrels, swung Bellini in a great swing, skipped rope, and climbed up and down steps. Their teeth served them as neatly as hands serve two boys. They seemed to understand everything their master said.
        - id: ch01-b15
          speaker: jack
          text: >-
            Best of all, the ponies could tell the time and answer arithmetic questions. Bellini took out his watch and showed it to the first pony, whose name was Diamond.
        - id: ch01-b16
          speaker: bellini
          text: What time is it, Diamond?
        - id: ch01-b17
          speaker: jack
          text: >-
            Diamond studied the watch, then scratched the platform four times with one front hoof.
        - id: ch01-b18
          speaker: bellini
          text: >-
            Good. Four o'clock. But it is a few minutes past four. How many minutes?
        - id: ch01-b19
          speaker: jack
          text: >-
            Diamond scratched five more times. Bellini held up the watch for us, and it really was five minutes past four. Next he asked Diamond's age, and the pony scratched four times because he was four years old. He gave the right number of days in a week and months in a year, then solved addition and subtraction problems. Bellini must have been signaling him somehow, but we watched closely and never discovered how.
        - id: ch01-b20
          speaker: bellini
          text: >-
            You have behaved very well and learned your lessons. If it will rest you, Diamond, you may be naughty for a little while.
        - id: ch01-b21
          speaker: jack
          text: >-
            At once, Diamond got a wicked look in his eyes. He spun around and kicked up his heels at Bellini. Then he shoved over the table and chairs and knocked down the blackboard where he had been wiping away figures with a sponge in his mouth. Bellini pretended to be cross.
        - id: ch01-b22
          speaker: bellini
          text: >-
            Come, come, Diamond. That will not do. You there, take this troublesome fellow off the stage.
        - id: ch01-b23
          speaker: jack
          text: >-
            The second pony nudged Diamond and pushed him along. At last he caught Diamond by the ear and led him away squealing. The gander hurried after them, gabbling as fast as he could, while the audience burst into applause.
        - id: ch01-b24
          speaker: jack
          text: >-
            After that, men carried ladders onto the stage, and out came the dogs. They weren't thoroughbreds. They were common dogs rather like you, Joe. Bellini said he could not teach tricks to pedigreed animals as well as he could to ordinary ones. Those dogs leaped over the ladders, climbed up them, passed through them, and performed in every way you could imagine. One crack of the whip made them begin. Two cracks sent them backward through everything they had just done going forward. Three cracks brought every dog to a stop.
        - id: ch01-b25
          speaker: jack
          text: >-
            Whenever any of the dogs, goats, ponies, or monkeys finished a trick, it ran straight to Bellini, and he rewarded it with a lump of sugar. They all seemed very fond of him. Even when it was not their turn to perform, they often wandered over to their master and licked his hands or the sleeve of his coat.
        - id: ch01-b26
          speaker: jack
          text: >-
            One dog was the leader, and his head looked like yours. His name was Bob, and he performed alone. Bellini left the stage. Bob walked on by himself, bowed, climbed his ladders, jumped his hurdles, and went off. We shouted for an encore. Back he came alone, gave one more bow, and retired. Old Judge Brown laughed until he had to wipe tears from his eyes.
        - id: ch01-b27
          speaker: jack
          text: >-
            Near the end, a goat performed what Bellini called the best trick, because goats are so difficult to teach. The goat climbed onto a large ball and rolled it clear across the stage without falling off. He looked as nervous as a cat. His old beard shook while he struggled to keep all four hoofs close together on the ball.
        - id: ch01-b28
          speaker: jack
          text: >-
            The show ended with a funny little play. A monkey came out dressed as a lady in white satin, with a bonnet and white veil. She was Miss Green, and Bob was Mr. Smith, the dog who meant to run away with her. He wore a light suit, a tall hat tipped to one side, a high collar, long cuffs, and he carried a cane. He looked like a perfect young dandy.
        - id: ch01-b29
          speaker: jack
          text: >-
            Bob walked up on his hind legs and helped Miss Green onto a pony. The pony galloped away with her. Then a whole family of monkeys rushed in, chattering and wringing their hands because Mr. Smith had stolen their daughter. The father and mother wore gray wigs and black clothes. The young Greens wore children's bibs and best clothes. What a strange-looking family they were!
        - id: ch01-b30
          speaker: jack
          text: >-
            While the monkey family was carrying on, the pony trotted back onto the stage. They all flew at him and pulled their daughter from his back. Laughing and chattering, they boxed her ears, took away her white veil and satin dress, and put her into an old brown garment. Some of them seized Bob as well. They kicked his tall hat aside, snapped his cane, stripped off his fine clothes, tossed everything into a corner, and bound his legs tightly with cords.
        - id: ch01-b31
          speaker: jack
          text: >-
            A goat arrived pulling a little cart. The monkeys tossed Bob into it and wheeled him around the stage several times. Then they took him out, tied him to a hook on the wall, and drew back. One monkey pulled out a tiny revolver, aimed at Bob, and fired. Bob fell as though he were dead.
        - id: ch01-b32
          speaker: jack
          text: >-
            The monkeys stared at him. Suddenly, the most dreadful barking and yelping broke out, and six dogs charged onto the stage. How they knocked those monkeys about! They nosed them, shoved them, and shook them until every monkey fled except Miss Green, who sat trembling in a corner.
        - id: ch01-b33
          speaker: jack
          text: >-
            After a while, Miss Green crept over and touched the dead dog with her paw. Up jumped Bob, as alive as ever! The whole room clapped and shouted. Then the curtain fell, and the show was over. I hope Bellini gives another performance, but he has to leave for Boston early tomorrow morning.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Jack lowered my paws and went outside. I began wishing that I could see those performing animals myself. It was not yet time for tea, so I had plenty of time to run down to their hotel. The autumn evening was lovely and warm, with the sun sinking into a haze. Earlier, Mr. Morris had called it our Indian summer and said the cold weather would soon begin.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Fairport was a pretty little town. From its main street, I could look across the blue bay toward the island. It lay deserted now. The summer visitors had all gone home, and the Island House was closed.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            I was running down one of the steep side streets toward the water when a heavily loaded cart came climbing toward me. It must have come from one of the ships, for it was piled with boxes and packages of strange shapes. A fine-looking but nervous horse pulled it. The poor animal strained every nerve to drag that great weight up the hill. His driver was a large, hard-faced man. Instead of allowing the horse even one moment to stand and catch his breath, he kept urging him forward.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            The poor horse looked again and again at the man. His eyes were wide with terror because he knew the whip was coming down on his trembling body. It did, and no one was there to stop it. Only a woman in a ragged shawl stood nearby, and the driver would not listen to someone as poor as she was.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Fairport had a good humane society. Teamsters never dared mistreat a horse when one of its members might see. But this was a quiet back street lined with poor houses. The driver probably knew no society member was likely to live there. He whipped the horse over and over. Every blow hurt my heart. If I had dared, I would have bitten that man hard.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Then came a dull thud in the street. The horse had fallen. The driver ran to his head, but the animal was dead.
        - id: ch01-b40
          speaker: poor_woman
          text: Thank God. One more is out of this world of misery.
          emotion: angry
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Her words were bitter. She turned and walked down the street. I was glad for the horse. He would never be terrified or suffer again. I went on slowly, thinking that for an animal under torture, death can be the best thing that happens.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            The Fairport House stood in the very center of town, crowded closely by shops and houses. It was a tall brick hotel. As I ran along the sidewalk, someone called to me. I looked up and saw Charlie Montague. His family was staying at the hotel while their house was repaired. Charlie had his Irish setter, Brisk, beside him. The handsome dog stood in the sunlight, waving his silky tail. Charlie patted me, then went into the hotel with Brisk.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            I turned into the stable yard. It was a small, crowded place, jammed with cabs and wagons. As I picked my way underneath them, I wondered why the hotel owners did not buy a few old houses nearby, tear them down, and give such a fine hotel the kind of stable yard it deserved. Some of the hotel horses were being rubbed down after their day's work, while others were just coming in. The stablemen talked and laughed around them, but nowhere could I see the strange animals from the show.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            At the back of the yard, I found them in an empty cow stable beneath a hayloft. Two small ponies stood tied in one stall, with two goats beyond them. Dogs and monkeys waited in strong traveling cages. I stopped in the doorway and stared. It seemed a shame to cage the dogs on such a beautiful evening, though Bellini probably feared they might get lost or be stolen if he let them out.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            All the animals looked friendly. The ponies turned their gentle eyes toward me, then went back to eating hay. I stepped farther inside, wondering where the gander might be. Something white rose from the brown pony's manger. There was the bird, nestled close beside his friend's open mouth.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            The monkeys made a jabbering noise and held the cage bars with their little black hands while they watched me. The dogs sniffed the air, wagged their tails, and tried to push their muzzles between the bars. I liked the dogs best of all, and I especially wanted to see the one Jack had called Bob, so I went very close. There were two little white dogs rather like Billy, two mixed-breed spaniels, and an Irish terrier. A brown dog slept alone in the corner. I knew that one must be Bob. He did resemble me, though he was not quite so ugly. Unlike me, he still had both his ears and his tail.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            While I peered at him, a man entered the stable. He noticed me at once. Instead of chasing me away, he spoke kindly in words I could not understand. Then I knew he was the Italian. His animals were delighted to see him. The gander fluttered from its nest. The ponies tugged at their halters. The dogs whined and reached out, trying to lick his hands. The monkeys chattered with joy.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            Bellini laughed and answered his animals in soft, strange-sounding words. Then he reached into a bag hanging from his arm. He brought out bones for the dogs, nuts and little cakes for the monkeys, fresh juicy carrots for the ponies, green food for the goats, and corn for the gander. The old man moved among them, feeding each of his pets. It was a lovely sight to watch. Before long, the sight of all that food made me quite hungry too, so I turned around and trotted home.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            That evening, I went downtown once more with Mr. Morris. He needed something from a shop for his wife. He never allowed the boys in town after tea, so he or Mrs. Morris handled any evening errand. Fairport looked bright and lively. Crowds walked along the streets and gazed into the shop windows.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            When we returned, I went into the kennel with Jim and slept until the middle of the night. Then I sprang up and ran outside. Far away, a bell was ringing. We often heard that bell in Fairport, and it always meant fire.
