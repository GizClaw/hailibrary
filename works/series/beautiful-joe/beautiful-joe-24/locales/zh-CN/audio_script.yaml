audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    maxwell:
      display_name: 马克斯韦尔先生
      tts:
        delivery: 温和风趣，叙事时从容可信
        timbre: 温润清朗
        pace: 适中
        pitch: 中
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十四章　兔子和母鸡
      blocks:
        - id: ch01-b01
          speaker: maxwell
          text: >-
            伍德先生，我想缅因州那边也有狐狸吧？
        - id: ch01-b02
          speaker: mr_wood
          text: >-
            多得很。想起那些狐狸，我总要笑，它们实在太机灵。我下过许多夹子，却一只也没捉到。我会把死羊之类的牲畜放在林边田里，让狐狸来吃。它们吃惯了，又一直平安无事，戒心也就放下了。
        - id: ch01-b03
          speaker: mr_wood
          text: >-
            等暴风雪快来时，我就在原处设下捕兽夹。碰夹子要戴手套，还得用烟熏，再拿冷杉枝仔细擦掉人的气味。雪落下来，把夹子全盖住了，可狐狸还是知道那里有危险，只肯绕着走。动物辨认气味的本领真奇妙。说不定，那还不只是我们所谓的嗅觉。咱们的乔也很有这份本事。
        - id: ch01-b04
          speaker: mr_harry
          text: >-
            父亲，您用的是什么夹子？
        - id: ch01-b05
          speaker: mr_wood
          text: >-
            是残忍的钢夹。它夹住动物的腿，有时连骨头也夹断。腿上的伤口流着血，夹口以下却因为血流不过去而冻僵。附近的人捕老鼠也用同样原理的夹子。那东西可恶透顶，给我多少钱，我也不许庄园里有。我相信，动物无端受过的每一分痛苦，我们将来都得交代。
        - id: ch01-b06
          speaker: mrs_wood
          text: >-
            约翰，照你讲的这些往事，你要交代的可不少。
        - id: ch01-b07
          speaker: mr_wood
          text: >-
            我已经受过惩罚了。多少个夜晚，我躺在床上，一想起自己年少无知时怎样残酷地对待动物，就难过得直呻吟。按那个年代的见识，我也算受过用心的教导了。
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            我常常想，我明明听过那么多要仁慈待人的道理，还是做过那些事。那些从小一句好教导也没听过的孩子，又能指望他们怎样呢？
        - id: ch01-b09
          speaker: maxwell
          text: >-
            再讲些狐狸的事吧，伍德先生。
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            我们以前带猎狐犬追狐狸，那可是难得的消遣。我常领着狗出去一整天。清早，它们有时会在雪地里找到足迹。领头辨味的那条狗来回嗅着，判断狐狸往哪边去了。它沿着踪迹左跑右跑，一声不出，只高举尾巴不停摆动，给后面的狗传信。
        - id: ch01-b11
          speaker: mr_wood
          text: >-
            它辨味最强，却不喜欢血淋淋的恶斗。等它终于认准方向，尾巴便摇得更起劲。其余猎犬排成一列，慢慢跟上，好让我们不至于落后。到了狐狸白天睡觉的地方，狐狸受惊，从贴着地面的冷杉或云杉密枝下钻出来，刚留下的气味一下散进空气。
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            猎犬一闻见，马上放声大叫。许多道低沉的叫声混在一起，听得我血都热了。狐狸刚从睡处惊起，心里正慌，会一口气飞奔一两英里。可跑过这一段，它便明白，只要保持距离，猎犬不容易追上。于是这个狡猾的家伙不再只顾逃命，反倒开始想办法捉弄它们。
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            狐狸会跳上分隔田野和树林的蛇形木篱，沿着最上面的横杆小跑一大段，再使劲一跃，跳进树林深处。猎犬追到篱笆前，不能像它那样踩着横杆走，也不知道它究竟从哪里离开。到了这一步，就能看出猎犬的谋略。它们四散开来，有的绕进树林，有的绕到田野，从不同方向走很长的弯路去找。踪迹一断，叫声也停了。哪条狗重新闻到气味，就立刻叫同伴过来，随后大家聚到那一点，又一路叫着追下去。
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            狐狸先生接着还会换花样。它爬上倾斜的树，再跳到地上。不过这招很快就会露馅。于是它绕出一个周长四分之一英里的圈，从自己的路线后面折回来，跑到猎犬背后。先后两道气味搅在一起，就能把狗弄糊涂。
        - id: ch01-b15
          speaker: mr_wood
          text: >-
            雪深时，猎犬已经替狐狸踩出一条好路。狐狸能沿着它轻松奔跑，猎犬却得慢慢辨认。狐狸在圈里兜过几回，会看准机会，从踩实的路上尽力跳得远远的，落到没有脚印的雪地，再笔直奔向另一处掩蔽物。在它跳出圆圈以前，我会设法靠近，并且一定从下风处过去。要是狐狸先闻见人味，它马上放弃兜圈，飞快逃出危险。
        - id: ch01-b16
          speaker: mr_wood
          text: >-
            猎犬一面绕圈追，一面不停叫，我听声音就能判断这个圈在哪里。要跑近到足以开枪，得等叫声来到离我最近的一边。猎犬既然在这边，狐狸就在离我最远的对面，我可以趁机向前跑。等我到了能看清猎犬从眼前经过的地方，就停住不动。猎犬再转到对面时，我便睁大眼睛等狐狸。灌木密的时候，它一闪就过去了，只能看见模糊的影子，所以开枪必须又准又快。
        - id: ch01-b17
          speaker: mr_wood
          text: >-
            枪一响，猎犬便闭上嘴，一齐直奔枪响的地方。狐狸若死了，它们会围着尸体，兴奋地嗅它的血。狐狸若只是受伤，它们便使出全身力气追去。有时猎犬赶上狐狸，当场把它咬死。有时狐狸还能抢先一步，逃进地下的洞穴、林中的空心木头，或乱石之间的缝隙里。
        - id: ch01-b18
          speaker: mr_wood
          text: >-
            我记得有一天，我守在圆圈外，狐狸刚一露面，我就开枪了。它尖叫一声，朝我奔来，随后停在雪地里，当场倒下。那个时候，我的枪法相当不错。
        - id: ch01-b19
          speaker: miss_laura
          text: >-
            可怜的小狐狸。真希望您让它逃掉。
          emotion: sad
        - id: ch01-b20
          speaker: mr_wood
          text: >-
            还有一只差点就逃了。一个冬日，我带猎犬追它。雪面结着硬壳，狐狸轻，狗却重。狐狸灵巧地踩在硬壳上，狗每跑一步都陷进雪里。那只狐狸隔几分钟就停下，坐在那里瞧瞧狗。狗气得发狂，它还偏要逗它们，惹得我笑个不停，简直不愿朝它开枪。
        - id: ch01-b21
          speaker: miss_laura
          text: >-
            叔叔，您说钢夹很残忍。既然捕熊能用落木陷阱，为什么不也用来捕狐狸？
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            狐狸太聪明，不肯走进那种陷阱。不过还有个更有效的办法。狐狸讨厌水，不得已才会下水。我们找到横跨河面的倒木，那就是狐狸来回过河的桥。再在上面设套索，连一根有弹力的长杆。狐狸被套住后一挣扎，长杆便把它甩进河里淹死。
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            劳拉，你听过那只想过河的狐狸吗？它躺在岸边装死。一个乡下人路过，以为捡了便宜，便把它扔进船里。船一到对岸，狐狸爬起来就跑了。
        - id: ch01-b24
          speaker: miss_laura
          text: >-
            得了吧，叔叔，您又拿我寻开心。这不可能是真的。
        - id: ch01-b25
          speaker: mr_wood
          text: >-
            不，不。不过狐狸真会装死，而且装得像极了。有一回，我清早打中一只，把它扛在肩上走了很远。下午正要剥皮，它忽然回头咬我，咬得都出血了。
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            还有一次，我从地洞里挖出一只装死的狐狸。我提起它，扔到远处，它却跳起来，一溜烟跑进树林。
        - id: ch01-b27
          speaker: maxwell
          text: >-
            您小时候还捕过什么动物？
        - id: ch01-b28
          speaker: mr_wood
          text: >-
            多着呢。水獭和海狸，我们有时用落木陷阱，有时用钢夹。水貂通常也进落木陷阱，当然，那种陷阱比捕熊的要小。麝鼠用箱式陷阱来捉，样子像捕老鼠的笼子。至于野猫，我们会带狗一路追赶，就像追加拿大猞猁一样。
        - id: ch01-b29
          speaker: maxwell
          text: >-
            加拿大猞猁是什么动物？
        - id: ch01-b30
          speaker: mr_wood
          text: >-
            它是猫科的猞猁。从前常在乡间游荡，咬死母鸡、鹅，有时也咬羊。它把尖牙扎进羊的脖子吸血，却不大爱吃羊肉。我们让狗追它。它逃上树，我们就在下面开枪。
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            兔子大多用套索捕。捕麝鼠时，我们会在箱式陷阱的转轴上放一根欧洲防风或一个苹果当诱饵。套兔子时，我总盼着绳套恰好勒住脖子，让它很快窒息而死。要是兔子只钻过去一半，套索勒住身子，或者只缠住两条后腿，它会在那里活上好一阵。那时，它会不停哭叫，声音听起来简直和孩子一样。
        - id: ch01-b32
          speaker: mr_wood
          text: >-
            我宁愿开枪打兔子，就是受不了那凄惨的哭声。杀这些不会说话的生灵，终究不是好事。我年纪越大，心也越软了。
        - id: ch01-b33
          speaker: mrs_wood
          text: >-
            你确实是胆小如鸡。劳拉，你知道吗？现在他连晚餐要吃的家禽也不肯杀，总要交给工人动手。
        - id: ch01-b34
          speaker: miss_laura
          text: >-
            “怜悯人的人有福了。”亲爱的约翰叔叔，我爱您，因为您对每一个活物都这么仁慈。
          emotion: happy
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            劳拉小姐说着，伸手搂住叔叔的肩膀。
        - id: ch01-b36
          speaker: mr_wood
          text: >-
            现在，我也要对你好一点，送你去睡觉。你看起来累了。
        - id: ch01-b37
          speaker: miss_laura
          text: >-
            好吧。大家晚安。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            劳拉小姐微笑着向大家道晚安，上楼去了。伍德先生转向马克斯韦尔先生。
        - id: ch01-b39
          speaker: mr_wood
          text: >-
            你今晚会住下来吧？
        - id: ch01-b40
          speaker: maxwell
          text: >-
            伍德太太是这么说的。
        - id: ch01-b41
          speaker: mrs_wood
          text: >-
            当然要留下。雨下得这么大，我可不能让你回村。外面简直在下猫下狗。哎呀，这话可不能说，要不就留不住你啦。我去收拾你从前住的房间，就在哈里的隔壁。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            伍德太太风风火火地走了。两位年轻人去食品储藏室吃炸面包圈、喝牛奶。伍德先生站在我面前，低头看着我。
        - id: ch01-b43
          speaker: mr_wood
          text: >-
            好狗，今晚的话你好像全听懂了。来，拿根骨头，然后睡觉去吧。
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            他给了我一根很大的羊骨头。我把它衔在嘴里，看他打开木柴房的门。我爱人类。一天里最难过的时刻，就是他们睡下以后，我不得不和他们分开。
        - id: ch01-b45
          speaker: mr_wood
          text: >-
            去睡吧，美丽的乔，好好休息。要是听见陌生人在房子周围走动，就跑出去叫。可别在梦里追野兽。他们说狗是唯一会做梦的动物，不知道是不是真的？
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            伍德先生回到屋里，关上门。我有一张羊皮可以躺，睡在上面舒服极了。我沉沉睡了很久。醒来时，雨点已经不再噼啪敲打屋顶，四周也不再漆黑。雨停了，月亮明亮又美丽，屋外几乎像白天。月光照遍房子和农场里的建筑，我朝四面看了又看，没有一个人走动。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            我先在院子里转了一圈，又绕到房子侧面，抬头看劳拉小姐的窗户。每个夜里，我总要这样看上几回，只为了确定她平安无事。我正往自己的床边走，忽然看见两团白色的小东西沿着小路朝农庄过来。我站在游廊上等着。它们走近以后，我才看清，前面是一只蹦蹦跳跳的白兔，后面跟着一只白母鸡。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            这么晚，它们怎么还在外面？这里又不是它们的家，为什么要来丁利农庄？我跑到路上，拦在它们面前。母鸡一见我，马上扑扇着挡到兔子前面。它张开翅膀，气愤地咯咯叫，那架势像是我再靠近，它就要啄我的眼睛。
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            我看出它们不会伤人，又想起自己遇到蛇的那一次，便退到旁边。从气味里，我知道它们曾在马克斯韦尔先生身边待过，也许就是来找他的。它们明白我没有恶意，便从我身边走过。兔子重新走在前面，母鸡落在后头。
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            在我看来，那只母鸡已经困得厉害，也根本不愿深更半夜还在外面奔波。它只觉得跟随、照顾兔子是自己的责任，才勉强一路赶来。兔子走路的模样却很古怪。它走几步就把鼻子贴到地面，又不时用两条后腿站起身，先向这一边嗅嗅空气，再转到另一边。那只小鼻子从头到尾动个不停。
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            它绕着房子闻了一圈，找到屋后马克斯韦尔先生的房间。房间的玻璃门通向游廊，正虚掩着。兔子挤了进去，母鸡留在外面。它等了许久，兔子还没回来，便飞到门边一把椅子的椅背上，把头藏进翅膀。
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            我知道它们不会闯祸，就回去睡了。第二天一早，我照常绕着房子巡视，马克斯韦尔先生房里忽然传来响亮的叫喊和笑声。他和哈里先生刚发现母鸡和兔子。哈里先生大声叫母亲快来瞧瞧。原来兔子在床脚安安稳稳地睡了一夜。
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            哈里先生使劲打趣马克斯韦尔先生，说谁招待他，谁就得接待一座旅行动物园。大家笑闹了好久。马克斯韦尔先生告诉他们，那只漂亮的白母鸡是他在波士顿养了很久的宠物。
        - id: ch01-b54
          speaker: maxwell
          text: >-
            有一次，它正带着一窝小鸡，一只被狗追赶的兔子吓坏了，跑进院子，一头钻到母鸡翅膀下面。母鸡护住兔子，不断去啄那条狗的眼睛，把狗挡开，直到有人赶来。兔子原本是邻居家男孩的，我把它买了下来。从母鸡保护它的那天起，它就把母鸡当成朋友，母鸡走到哪儿，它便跟到哪儿。
        - id: ch01-b55
          speaker: beautiful_joe
          text: >-
            兔子想来看主人，我并不奇怪。那位年轻人身上仿佛有一种力量，不会说话的动物见了他，就满心欢喜。伍德太太把这件事说给他听。
        - id: ch01-b56
          speaker: maxwell
          text: >-
            我真的不知道它们为什么喜欢我。我从没做过什么来讨它们喜欢。
        - id: ch01-b57
          speaker: mrs_wood
          text: >-
            你爱它们，它们知道。原因就在这里。
