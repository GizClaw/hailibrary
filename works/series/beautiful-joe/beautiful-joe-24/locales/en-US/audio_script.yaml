  chapters:
    - id: ch01
      title: THE RABBIT AND THE HEN
      blocks:
        - id: ch01-b01
          speaker: mr_maxwell
          text: You had plenty of foxes up in Maine, didn't you, Mr. Wood?
        - id: ch01-b02
          speaker: mr_wood
          text: >-
            Heaps of them. Those clever foxes still make me laugh. I set many traps, but I never caught one that way. I would leave the carcass of a sheep or some other dead animal in a field beside the woods. The foxes came to feed on it again and again. Nothing harmed them, so after a while they stopped expecting danger there. Then, just before a snowstorm, I would set a trap on that very spot. I wore gloves, smoked the trap, and rubbed it with fir branches to hide my scent. Snow covered it completely, but the foxes always knew. They walked all around it without stepping near the jaws. Whatever that sense is, animals have a marvelous power of smell. Joe has plenty of it himself.
        - id: ch01-b03
          speaker: mr_harry
          text: What sort of traps did you use, Father?
        - id: ch01-b04
          speaker: mr_wood
          text: >-
            Cruel steel traps. The jaws caught an animal by the leg and sometimes broke the bone. The wound bled, and the part below the trap could freeze because the blood no longer reached it. Those traps are hateful things. People here use the same kind for rats, but I would not allow one on my farm for any price. I believe we must answer for every bit of needless suffering we cause an animal.
        - id: ch01-b05
          speaker: mrs_wood
          text: By your own account, John, you'll have a few things to answer for.
        - id: ch01-b06
          speaker: mr_wood
          text: >-
            I've suffered for them already. Many nights I've lain awake and groaned over the needless cruelty I showed animals when I was a thoughtless boy. And I was raised with as much care as people understood in those days. If I could be cruel after being taught mercy, what can we expect from children who receive no good teaching at all?
          emotion: sad
        - id: ch01-b07
          speaker: mr_maxwell
          text: Tell us more about those foxes, Mr. Wood.
        - id: ch01-b08
          speaker: mr_wood
          text: >-
            We thought hunting them with foxhounds was fine sport. I often spent a whole day out with my dogs. Early in the morning, they might find tracks in the snow. The hound with the best nose would run one way and then the other to learn which way the fox had gone. I can still see him working. He never made a sound. He simply held his tail high and wagged it as a signal to the dogs waiting behind him. Though he led them by scent, he wanted no part of a bloody, dangerous fight. At last, he would settle on the fox's direction, and his raised tail would wag much harder. The other hounds fell into single file behind him. They went slowly enough for us hunters to keep pace.
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            At last they would reach the place where the fox slept during the day. His bed lay under thick fir or spruce branches close to the ground. The startled fox sprang out, and his fresh scent filled the air. The hounds caught it at once. Then they broke into a deep, mingled bay that set my blood racing. In his first fright, the fox dashed away for a mile or two. Soon he found it easy to stay ahead, and that was when the clever creature began playing tricks. He climbed onto the top pole of the zigzag fence between the fields and woods. He could trot along that narrow pole for quite a distance, then make a long leap into the trees. The hounds reached the fence but could not walk along it, and they struggled to discover where the fox had left it.
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            Then the dogs showed their own skill. They scattered in every direction and made wide sweeps through the woods and fields. While the trail was lost, every one of them fell silent. The instant a single hound found it again, he bayed to call the others. They all rushed to that spot and raced away together, baying as they went. Next Mr. Fox might climb a leaning tree and jump from it to the ground. The hounds soon solved that trick, so he tried another. He ran in a circle about a quarter of a mile around. By looping back behind the dogs, he crossed his later trail over his first one and left them puzzling between the two scents.
        - id: ch01-b11
          speaker: mr_wood
          text: >-
            Deep snow helped him. The hounds had beaten a good path, and he could run easily over it while they had to feel their way along by scent. After going around the circle several times, he would leap as far as possible from the packed trail and run in a straight line toward fresh cover. Before he did that, I tried to get close to the circle. I always approached from the downwind side. If the fox caught one breath of human scent, he would leave his circle quickly and race away from danger. The hounds' voices made it easy to tell where the chase was moving. I waited to make my last runs forward until their baying came from the side nearest me. At that moment, the fox would be across the circle on the side farthest away.
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            Once I was near enough to see the hounds as they passed, I stopped. When they reached the opposite side, I watched sharply for the fox. In thick brush, I might see him only dimly, so the shot had to be quick. The instant the gun went off, the dogs stopped baying and rushed to the spot. If the fox lay dead, they enjoyed the scent of his blood. If he was only wounded, they followed him at full speed. Sometimes they overtook and killed him. At other times, he reached safety in a burrow in the earth, inside a hollow log, or among the rocks.
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            I remember one day when I waited outside the circle and the fox appeared. I fired. He gave a sharp bark and ran toward me, then stopped in the snow and dropped dead. I was a good shot in those days.
        - id: ch01-b14
          speaker: miss_laura
          text: Poor little fox. I wish you had allowed him to escape.
          emotion: sad
        - id: ch01-b15
          speaker: mr_wood
          text: >-
            Let me tell you about one that nearly did. We were chasing him on a winter day when a hard crust covered the snow. The light fox trotted neatly across the top, but the heavy dogs kept breaking through. Every few minutes, he sat down and looked back at them. The dogs were furious. That wicked little fox teased them so well that I laughed and could hardly bring myself to shoot him.
        - id: ch01-b16
          speaker: miss_laura
          text: If steel traps were so cruel, Uncle, why didn't you use a deadfall like the ones you used for bears?
        - id: ch01-b17
          speaker: mr_wood
          text: >-
            Foxes were too clever to enter deadfalls. We had another way to catch them. They hate water and never enter it unless they must. We looked for a place where a fallen tree crossed a river and served as their bridge from bank to bank. There we set snares attached to spring poles. When a caught fox struggled to escape, the pole threw him into the river and drowned him. Laura, did you ever hear about the fox who wanted to cross a river? He lay down on the bank and pretended to be dead. A countryman came along, thought he had found a prize, tossed the fox into his boat, and rowed across. As soon as they reached the other side, the fox jumped up and ran away.
        - id: ch01-b18
          speaker: miss_laura
          text: Oh, Uncle, you're teasing me. That story can't be true.
        - id: ch01-b19
          speaker: mr_wood
          text: >-
            No, it isn't. But foxes are wonderfully good at pretending to be dead. I once shot one in the morning and carried him a long way on my shoulders. That afternoon, just as I began to skin him, he turned and bit me hard enough to draw blood. Another time I dug a fox from a hole. He played dead, so I picked him up and threw him some distance away. He sprang to his feet and ran into the woods.
        - id: ch01-b20
          speaker: mr_maxwell
          text: What other animals did you catch as a boy?
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            Quite a few. We caught otters and beavers in deadfalls and steel traps. Mink went into smaller deadfalls, and muskrats into box traps like mousetraps. We chased wildcats down the same way we chased the loup cervier.
        - id: ch01-b22
          speaker: mr_maxwell
          text: What animal is that?
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            A lynx, one of the cat family. They prowled through the country and killed hens, geese, and sometimes sheep. They sank their teeth into a sheep's neck and drank the blood without caring much for the meat. We hunted them down with dogs. They often climbed trees, and then we shot them. Rabbits were another matter. We caught most of them in snares. For muskrats, we put a parsnip or an apple on the spindle inside a box trap, much like baiting a mousetrap.
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            With a snared rabbit, I always hoped the loop had caught its neck and killed it quickly. If it caught the body or hind legs, the rabbit lived for a while and cried like a child. I preferred shooting them because I could not bear those pitiful cries. Killing helpless creatures is bad work. The older I grow, the more chicken-hearted I become.
          emotion: sad
        - id: ch01-b25
          speaker: mrs_wood
          text: >-
            Chicken-hearted is right. Laura, would you believe he won't even kill a fowl for dinner? He makes one of the men do it.
        - id: ch01-b26
          speaker: miss_laura
          text: Blessed are the merciful. Dear Uncle John, I love you because you're so kind to every living creature.
        - id: ch01-b27
          speaker: beautiful_joe
          text: Miss Laura put her arm around her uncle's shoulder.
        - id: ch01-b28
          speaker: mr_wood
          text: I'll be kind to you now and send you to bed. You look tired.
        - id: ch01-b29
          speaker: miss_laura
          text: All right. Good night, everyone.
        - id: ch01-b30
          speaker: beautiful_joe
          text: She smiled, said good night, and went upstairs. Mr. Wood turned to Mr. Maxwell.
        - id: ch01-b31
          speaker: mr_wood
          text: You're staying here tonight, aren't you?
        - id: ch01-b32
          speaker: mr_maxwell
          text: Mrs. Wood says I am.
        - id: ch01-b33
          speaker: mrs_wood
          text: >-
            Of course you are. I won't let you go back to the village in weather like this. It's raining cats and dogs. Though perhaps I shouldn't say that, or we'll never persuade you to stay. I'll get your old room ready beside Harry's.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Mrs. Wood hurried away, and the two young men went to the pantry for milk and doughnuts. Mr. Wood stood looking down at me.
        - id: ch01-b35
          speaker: mr_wood
          text: Good dog. You look as if you understood all our talk tonight. Come and get a bone, and then off to bed.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            He gave me a very large mutton bone. I held it in my mouth and watched him open the woodshed door. I love human beings, and the saddest part of my day is leaving them when they go to sleep.
        - id: ch01-b37
          speaker: mr_wood
          text: >-
            Go to bed now and rest well, Beautiful Joe. If you hear a stranger near the house, run out and bark. But don't chase wild animals in your sleep. They say dogs are the only animals that dream. I wonder if that's true.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            He went inside and shut the door. I curled up on my sheepskin, which made a very good bed, and slept soundly for a long time. When I woke, everything had changed. The rain no longer tapped against the roof, and darkness no longer covered the farm. The storm was over. The moon shone beautifully, and its light filled the yard.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            I ran to the door and looked outside. It was almost as bright as day around the house and all the farm buildings. I could see across the whole place, and no one was stirring. I made a round of the yard, then walked to the side of the house and looked up at Miss Laura's window. I always did that several times during the night, just to see that she was quite safe.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            On my way back to bed, I noticed two small white shapes moving along the lane. I watched from the veranda until they came closer. One was a white rabbit hopping up the road. A white hen followed behind him.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            It was strange to see them out so late. Dingley Farm was not their home, so why were they coming here? I ran into the road and stood in their way.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            The moment the hen saw me, she fluttered directly in front of the rabbit and placed herself between us. She spread both wings wide and clucked furiously. Every movement warned me that she would peck out my eyes if I took one step closer.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            I saw that neither creature meant harm. Remembering what had happened with the snake, I moved aside. Their scent also told me they had been near Mr. Maxwell, and perhaps they had come looking for him.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            They understood that I would not hurt them and went past. The rabbit led the way again, with the hen trailing behind. She looked sleepy and unhappy to be out so late. It seemed to me that she followed only because she believed it was her duty.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            The rabbit traveled in a very odd way. He pressed his nose to the ground, then rose on his hind legs and sniffed first to one side and then the other. His nose never stopped moving.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            He sniffed his way all around the house until he reached Mr. Maxwell's room at the back. A glass door led from that room onto the veranda, and someone had left it slightly open. The rabbit squeezed through the narrow space and disappeared inside. The hen stayed on the veranda. She watched the doorway for a while, waiting for him to come back. When he did not return, she flew onto the back of a chair beside the door and tucked her head beneath her wing to sleep.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            I knew they would do no damage, so I went back to bed. Early the next morning, while I was making my rounds around the house, loud shouts and laughter came from Mr. Maxwell's room. He and Mr. Harry had just discovered both visitors. Mr. Harry called through the house for his mother to come and look at them. The rabbit had spent the night at the foot of Mr. Maxwell's bed.
        - id: ch01-b48
          speaker: beautiful_joe
          text: Mr. Harry teased Mr. Maxwell while everyone laughed.
        - id: ch01-b49
          speaker: mr_harry
          text: Anyone who lets you stay overnight had better expect a traveling menagerie.
        - id: ch01-b50
          speaker: beautiful_joe
          text: Then Mr. Maxwell explained how the white hen and rabbit had become friends.
        - id: ch01-b51
          speaker: mr_maxwell
          text: >-
            I've kept that pretty white hen as a pet in Boston for a long time. Once, when she had a brood of little chicks, a dog chased a frightened rabbit into our yard. The rabbit was terrified and ran straight under her wings. She sheltered him there, pecking at the dog's eyes and holding him off until help arrived.
        - id: ch01-b52
          speaker: mr_maxwell
          text: >-
            The rabbit belonged to a neighbor's boy, and I bought him from the boy afterward. From the day the hen protected him, she was his friend. He followed her everywhere.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            I could understand why the rabbit wanted to see his master. There was something about Mr. Maxwell that made animals delight in him. Mrs. Wood said so, too.
        - id: ch01-b54
          speaker: mr_maxwell
          text: I don't know why they should. I never do anything to charm them.
        - id: ch01-b55
          speaker: mrs_wood
          text: You love them, and they know it. That's why.
