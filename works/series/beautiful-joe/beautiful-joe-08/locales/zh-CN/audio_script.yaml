audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    jim:
      display_name: 吉姆
      tts:
        delivery: 稳重诚实，话语沉着
        timbre: 浑厚温和
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 从前的猎犬
      blocks:
        - id: ch01-b01
          speaker: jim
          text: >-
            我头三年是一条猎犬。那时候，我的主人在费尔波特开马车行。他常把我租给出门打猎的人。
        - id: ch01-b02
          speaker: beautiful_joe
          text: 吉姆说起从前，声音里满是苦涩。
        - id: ch01-b03
          speaker: jim
          text: >-
            那些先生都喜欢我。我一看见他们拿枪出来，就欢喜得不得了，跳起来直往枪上扑。我爱追鸟，也爱追兔子。直到现在，鸽子一走近，我还是会浑身发抖。我得赶紧转开头，不然真怕自己忍不住去抓它们。
        - id: ch01-b04
          speaker: jim
          text: >-
            从前，我常常天一亮就进树林，直到天黑才回来。鸟被打中以后，我最喜欢下力气去找。等我把鸟好好衔回来，既没咬伤，也没弄坏，人们就会夸奖我。那是我最高兴的时候。
        - id: ch01-b05
          speaker: jim
          text: >-
            我也从不会迷路。有些狗无论走出多远，都知道人在哪里，我就是这样。那不是用鼻子闻的，离得那么远，气味早没了。可只要主人站在树林里的某个地方，哪怕我绕了好大一圈，也能准确找到他。我不用沿原路退回去，抄近路就能赶到他身边。
        - id: ch01-b06
          speaker: jim
          text: >-
            不过，我该告诉你那场祸事了。一个星期六的下午，几个年轻人来领我。他们已经带了一条叫鲍勃的可卡犬，还想多带一条。主人不知为什么，很不情愿让我走，可最后还是答应了。他们把我放在马车后面，旁边是鲍勃和午餐篮子，就这么驾车去了乡下。
        - id: ch01-b07
          speaker: jim
          text: >-
            鲍勃看起来快活极了。他一路跟我说，第二天准会玩得痛快。年轻人先开几枪，再从篮子里拿出吃的喝的，接着打打牌，躺在树下睡觉。这样一来，我们就能自己翻篮子，鸡腿也好，鸡翅也好，爱吃什么就拿什么。
        - id: ch01-b08
          speaker: jim
          text: >-
            可我不喜欢这种玩法。我已经辛苦工作了一星期，到了星期日，只想安静留在家里。我心里虽然不愿意，却一句话也没说。
    - id: ch02
      title: 湖边的枪声
      blocks:
        - id: ch02-b01
          speaker: jim
          text: >-
            当晚，我们住在一家乡间旅店。第二天早上，马车把我们拉到一座小湖边。年轻人听说那里野鸭很多，却不急着打猎。他们坐上水边的平石，说动手前先喝一点，于是从车里拿出瓶子，大口大口地灌下去。
        - id: ch02-b02
          speaker: jim
          text: >-
            没过多久，他们便又吵又闹，完全忘了打猎。有人说，不如拿我们两条狗找点乐子。他们把我和鲍勃拴在树上，又把一根木棍扔进水里，命令我们去捡。我们哪里够得着，只能拼命挣扎，想挣开绳子，脖子都磨破了。
        - id: ch02-b03
          speaker: jim
          text: >-
            后来，有个人冲着我骂起来，说我肯定怕枪声。他摇摇晃晃走到马车边，取出猎枪，要当场试我。他装上子弹，退开一段距离，举起了枪。
        - id: ch02-b04
          speaker: jim
          text: >-
            鲍勃的主人这才说，他可不许人打断自己狗的腿。他走过来，只解开了鲍勃，把它带到一旁。可我还拴在树上，那个陌生人的枪口正对着我。
          emotion: fearful
        - id: ch02-b05
          speaker: jim
          text: >-
            他贴着我开了一枪，又开一枪。子弹从我头顶飞过，也从我肚子底下穿过，四周的泥土被打得乱飞。我吓坏了，只能不停哀号，求他们放开我。
          emotion: fearful
        - id: ch02-b06
          speaker: jim
          text: >-
            旁边的人看着我发笑，觉得有趣，也把各自的枪拿了出来。那一个钟头太可怕了，我再也不愿经历第二回。我以为自己一定会死。那时他们全都醉得厉害，要不是突然出了事，我想，他们真会把我杀掉。
          emotion: fearful
        - id: ch02-b07
          speaker: jim
          text: >-
            可怜的鲍勃也吓得发抖，一直缩在马车底下。偏偏它的主人手最不稳。一声枪响，子弹打中了鲍勃。它大叫一声，四条腿抽动了几下，侧身倒下，就再也不动了。
          emotion: sad
        - id: ch02-b08
          speaker: jim
          text: >-
            这一下，所有人都醒了酒。他们跑到鲍勃身边，可它已经死了。大家一句话也不说，默默坐了一会儿。后来，他们把剩下的瓶子扔进湖里，挖了一个浅坑埋掉鲍勃，再把我放上马车，慢慢回了城。
        - id: ch02-b09
          speaker: jim
          text: >-
            那些年轻人并不坏。我不相信他们原本想伤害我，更不相信他们有意杀死鲍勃。是瓶子里那种讨厌的东西，叫他们失去了理智。
    - id: ch03
      title: 再也不是从前的我
      blocks:
        - id: ch03-b01
          speaker: jim
          text: >-
            从那以后，我再也没有变回从前那条狗。我的右耳全聋了。我一次次逼自己别怕，可只要眼前出现一把枪，我还是吓得转身就逃，非找个地方躲起来不可。
        - id: ch03-b02
          speaker: jim
          text: >-
            主人气坏了，狠狠责怪那些年轻人。可每次看见我，他似乎也很难受。有一天，他温和地把我带到这里，问莫里斯先生，愿不愿意收下一条性情温顺、能陪孩子们玩的狗。
        - id: ch03-b03
          speaker: jim
          text: >-
            现在，我有一个幸福的家，也很爱莫里斯家的男孩子们。可每逢听到枪响，我还是会夹着尾巴逃回家。我常想，要是我能管住自己，不再逃跑，那该多好。
          emotion: sad
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            吉姆，别再为这件事责怪自己了。那不是你的错。何况离开以前的日子，也有一件事值得庆幸。
        - id: ch03-b05
          speaker: jim
          text: 什么事？
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            那些鸟啊。你知道，劳拉小姐不赞成杀害树林里那些美丽的小鸟。
        - id: ch03-b07
          speaker: jim
          text: >-
            她说得对。除非一枪就让鸟死去，否则真不该开枪。有人只把鸟打成重伤，我一见到就生气。我不愿衔起那具还温热的小身体，看着它明亮的眼睛责备我，更不愿感觉那一点生命还在手里扑腾。
        - id: ch03-b08
          speaker: jim
          text: >-
            我们动物，至少我们大多数动物，杀死猎物时，不会故意让它多受罪。只有人类会把猎物折磨得不成样子，有些人甚至像是在拿猎物的痛苦取乐。我从前的确急着追杀鸟和兔子，可它们死了以后，我也不愿一直看着尸体。
        - id: ch03-b09
          speaker: jim
          text: >-
            我在街上常会停住，抬头看看贵妇人的帽子。我总想不通，她们为什么肯戴着那些死去的小鸟。鸟的身体被摆成吓人的样子，有的脑袋塞在翅膀下面，有的脖子扭过肩头，眼睛直朝尾巴望去。特别是那双眼睛，真叫人不敢看。
        - id: ch03-b10
          speaker: jim
          text: >-
            我真想把那些太太带到树林里，让她们亲眼看看，活着的小鸟有多轻盈、多漂亮。那和帽子上塞满填料的死鸟，完全不是一回事。乔，你有没有在树林里痛痛快快跑过一回？
        - id: ch03-b11
          speaker: beautiful_joe
          text: 没有，一次也没有。
        - id: ch03-b12
          speaker: jim
          text: >-
            那改天我带你去。时候不早了，我得睡觉。你今晚跟我睡狗窝，还是去马厩？
        - id: ch03-b13
          speaker: beautiful_joe
          text: >-
            我跟你睡吧，吉姆。狗也和人一样，身边有个伴才好。
        - id: ch03-b14
          speaker: beautiful_joe
          text: 我挨着吉姆，在干草上蜷起身子。没过多久，我们就一同睡熟了。
    - id: ch04
      title: 吉姆的好心肠
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            后来，我认识过许多狗，可我觉得，没有哪一条比吉姆更好。他温柔，善良，心思也细。一句重话落在他心上，比挨一下打还疼。莫里斯太太非常宠爱他。他受过很好的训练，家里有不少事情，他都帮得上忙。
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            莫里斯太太出门买东西时，常让吉姆替她衔着包裹。无论走多远，他都不会把东西弄掉，更不会丢在路上。
        - id: ch04-b03
          speaker: beautiful_joe
          text: >-
            有一天，莫里斯太太不小心掉了钱包，自己一点也没察觉。吉姆发现以后，立刻捡起来，一路衔回家。他平常总走在她身后，所以她没有留意。直到走到家门口，她才发现钱包不见了。她一回头，钱包正好好地衔在吉姆嘴里。
        - id: ch04-b04
          speaker: beautiful_joe
          text: >-
            还有一次，一位太太送给杰克·莫里斯一只金丝雀鸟笼，让他带给卡尔。杰克走在回家的路上，笼子上一个装鸟食的小盒子掉了出来。吉姆捡起小盒子，跟着走了很远，杰克才发现，是他替自己把东西带了回来。
