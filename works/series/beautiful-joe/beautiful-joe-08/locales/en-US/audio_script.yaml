audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    jim:
      display_name: Jim
      tts:
        delivery: gentle and earnest
        timbre: mellow and mature
        pace: measured
        pitch: medium-low
    bob:
      display_name: Bob
      tts:
        delivery: cheerful and easygoing
        timbre: bright and friendly
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: A RUINED DOG
      blocks:
        - id: ch01-b01
          speaker: jim
          text: >-
            For the first three years of my life, I was a sporting dog. I belonged to a man who kept a livery stable here in Fairport. He hired me out to shooting parties.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Jim spoke bitterly as he began his story.
        - id: ch01-b03
          speaker: jim
          text: >-
            All the gentlemen liked me. The moment I saw the guns come out, I could hardly contain myself. I would leap up and snap at them because I was so eager to go. I loved chasing birds and rabbits. Even now, when pigeons come close, I shake all over. I have to turn my head away so I won't grab one.
        - id: ch01-b04
          speaker: jim
          text: >-
            Back then, I often spent the whole day in the woods. If a wounded bird was hard to find, I enjoyed searching until I found it. Then I would carry it back without biting or hurting it, and my master would praise me.
        - id: ch01-b05
          speaker: jim
          text: >-
            I never lost my way. Some dogs always know where people are, and I was one of them. It wasn't their scent. I could be much too far away to smell anyone. But after making a wide circle through the woods, I still knew exactly where my master stood. I could cut straight back to him without following my own trail.
        - id: ch01-b06
          speaker: jim
          text: >-
            But now I must tell you what went wrong. One Saturday afternoon, some young men came to borrow me. They already had a cocker spaniel named Bob, but they wanted a second dog. My master did not want to let me go, though I never knew why. In the end, he agreed. They put Bob and me in the back of their wagon beside the lunch baskets, and we rode out into the country.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Bob looked merry and carefree. As the wagon rolled along, he told Jim what a fine Sunday they would have.
        - id: ch01-b08
          speaker: bob
          text: >-
            They'll do a little shooting first. Then they'll open those baskets, eat and drink, play cards, and fall asleep under the trees. While they're sleeping, we can take all the chicken legs and wings we want.
        - id: ch01-b09
          speaker: jim
          text: >-
            I didn't like the sound of that at all. I worked hard every weekday, and on Sundays I preferred a quiet day at home. Still, I kept my thoughts to myself.
        - id: ch01-b10
          speaker: jim
          text: >-
            We spent that night at a country hotel. The next morning, the wagon took us to a little lake where the young men had heard there were plenty of wild ducks. But they were in no hurry to start hunting. They settled on some flat rocks by the water and decided to drink first.
        - id: ch01-b11
          speaker: jim
          text: >-
            They pulled bottles from the wagon and took long swallows. Before long, they were picking quarrels and looking for mischief. They seemed to forget all about the ducks. Then one of them suggested having some fun with us.
        - id: ch01-b12
          speaker: jim
          text: >-
            They tied Bob and me to a tree. Then they threw a stick into the lake and ordered us to fetch it. Of course, we lunged toward the water and fought to get loose. The ropes scraped our necks, but we could not break free.
        - id: ch01-b13
          speaker: jim
          text: >-
            After a while, one young man began swearing at me. He claimed I must be afraid of guns. Then he stumbled over to the wagon, pulled out his fowling piece, and said he would put me to the test.
        - id: ch01-b14
          speaker: jim
          text: >-
            He loaded the gun and backed away from me. Just as he was about to fire, Bob's owner objected. He said he would not let anyone shoot his dog's legs off. He untied Bob and led him away, but he left me fastened to the tree.
        - id: ch01-b15
          speaker: jim
          text: >-
            Imagine standing helpless while a stranger points a gun straight at you. He fired close beside me again and again. Some shots passed over my head, and some went under my body. The ground burst apart all around my feet. I was terrified. I howled and begged them to let me go.
          emotion: fearful
        - id: ch01-b16
          speaker: jim
          text: >-
            The others sat there laughing. They thought my terror was great fun, so they brought out their guns too. I never want to live through another hour like that one. I felt certain they would kill me. By then they were all so drunk that I believe they might have done it, if something else had not happened first.
          emotion: fearful
        - id: ch01-b17
          speaker: jim
          text: >-
            Poor Bob was nearly as frightened as I was. He lay trembling beneath the wagon. Then his own master fired. His hand was the least steady of them all, and the shot struck Bob.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Bob gave one loud howl. His body jerked, and then he rolled onto his side and did not move again.
        - id: ch01-b19
          speaker: jim
          text: >-
            That brought the young men to their senses. They rushed to Bob, but he was dead. For a while, they sat without saying a word. Then they threw every bottle that remained into the lake and dug Bob a shallow grave. They lifted me into the wagon and drove slowly back to town.
        - id: ch01-b20
          speaker: jim
          text: >-
            Those young men were not bad at heart. I don't believe they meant to hurt me or kill Bob. The foul drink in those bottles had taken away their reason.
        - id: ch01-b21
          speaker: jim
          text: >-
            After that day, I was never the same dog. I had gone deaf in my right ear. Worse still, no matter how hard I fought it, the very sight of a gun filled me with terror. Whenever one appeared, I ran away and hid.
        - id: ch01-b22
          speaker: jim
          text: >-
            My master was furious with those young men. But after what happened, he seemed unable to bear looking at me. One day he treated me very kindly and brought me here. He asked Mr. Morris if he would like a good-natured dog for the children to play with.
        - id: ch01-b23
          speaker: jim
          text: >-
            I have a happy home now, and I love the Morris boys. Still, I wish I could stop tucking my tail between my legs and racing home whenever I hear a gun.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            Don't trouble yourself over that, Jim. It isn't your fault. And there must be one reason you're glad you left your former life.
        - id: ch01-b25
          speaker: jim
          text: What reason is that?
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            The birds. Miss Laura believes it is wrong to kill those pretty creatures that fly through the woods.
        - id: ch01-b27
          speaker: jim
          text: >-
            She is right, unless a bird is killed at once. It used to make me angry when a man only wounded one. I hated picking up that small, warm body. Its bright eye would look at me as if asking why, and I could feel the last bit of life fluttering inside it.
        - id: ch01-b28
          speaker: jim
          text: >-
            Most animals kill quickly and mercifully. Human beings are the ones who sometimes butcher what they hunt and take pleasure in its suffering. I used to be eager to chase birds and rabbits, but once they were dead, I did not want them lying in front of me.
        - id: ch01-b29
          speaker: jim
          text: >-
            Sometimes I stop in the street and stare up at the bonnets worn by fashionable ladies. I wonder how anyone can wear a little dead bird twisted into such a dreadful pose. Its head may be bent under a wing, turned over its shoulder, or pointing back toward its tail. Even its eyes look horrible.
        - id: ch01-b30
          speaker: jim
          text: >-
            I wish I could take those ladies into the woods. Then they could see how light and lovely a living bird is, and how little it resembles the stuffed thing on a hat. Joe, have you ever had a good run through the woods?
        - id: ch01-b31
          speaker: beautiful_joe
          text: No, I never have.
        - id: ch01-b32
          speaker: jim
          text: >-
            Then one day I'll take you. But it's late now, and I must go to sleep. Will you stay here in the kennel with me, or sleep in the stable?
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            I'll stay with you, Jim. Dogs enjoy company just as much as people do.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            I curled up in the straw beside him, and it was not long before we were both sound asleep.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            I have known many dogs, but I don't think I ever met a better one than Jim. He was gentle and kind. He was also so sensitive that a harsh word hurt him more than a blow. Mrs. Morris loved him dearly, and because he had been trained so well, he could help her in many ways.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            When Mrs. Morris went shopping, Jim often carried a parcel in his mouth. He never dropped one or left it behind. Once, she lost her purse without noticing. Jim found it, picked it up, and carried it all the way home.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            Mrs. Morris did not see the purse because Jim always walked behind her. Only when she reached her own door did she realize it was missing. She turned around and found Jim standing there with the purse safe in his mouth.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Another day, a lady gave Jack Morris a canary cage for Carl. Jack was carrying it home when one of the little seed boxes fell out. Jim picked it up and followed him for a long way before Jack discovered what had happened.
