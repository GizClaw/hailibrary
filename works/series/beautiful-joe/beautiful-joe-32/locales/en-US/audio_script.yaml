  chapters:
    - id: ch01
      title: OUR RETURN HOME
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            October came, the loveliest month of all, and we were obliged to return to Fairport. Miss Laura could hardly bear to leave the farm. Whenever anyone mentioned our going away, her face grew sorrowful. Still, she had grown well and strong, and she was as brown as a berry after her summer outdoors. She said she knew that she ought to go home and get back to her lessons.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Mr. Wood called October the golden month. Everything on the farm seemed quiet and still. In the early morning and again at night, the sun had a yellow, misty look. The orchard trees were loaded with fruit. Now and then, leaves floated down and settled into a soft covering over the ground.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            A great many flowers were still blooming in the garden, all in flaming reds and yellows. Every day, Miss Laura gathered them into bunches and carried them inside to brighten the parlor. One day, while she stood arranging a fresh bunch, she looked at the flowers regretfully.
        - id: ch01-b04
          speaker: miss_laura
          text: They will all be gone soon. I wish summer could last forever.
          emotion: sad
        - id: ch01-b05
          speaker: beautiful_joe
          text: Mr. Harry had come quietly up behind her.
        - id: ch01-b06
          speaker: mr_harry
          text: >-
            You would grow tired of it. There's only one place where we could bear a summer that never ends, and that's heaven.
        - id: ch01-b07
          speaker: miss_laura
          text: Do you think it is always summer there?
        - id: ch01-b08
          speaker: mr_harry
          text: >-
            I don't know. I like to imagine it that way, but I don't think anyone knows very much about it. We will have to wait.
        - id: ch01-b09
          speaker: beautiful_joe
          text: Miss Laura turned her eyes toward me.
        - id: ch01-b10
          speaker: miss_laura
          text: Harry, do you think animals go to heaven?
        - id: ch01-b11
          speaker: mr_harry
          text: >-
            Again, I have to say I don't know. Some people believe they do. I read an article in a Michigan paper the other day. It said that some of the finest people in every age have believed animals will live again.
        - id: ch01-b12
          speaker: mr_harry
          text: >-
            Homer and the later Greeks believed it. So did some Romans and early Christians. Those Christians believed God sent angels in the shape of birds to comfort people who suffered for their faith. Saint Francis called the birds and beasts his brothers. Dr. Johnson believed animals had a future life. Wordsworth, Shelley, Coleridge, Jeremy Taylor, Agassiz, Lamartine, and many Christian scholars believed it too.
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            It seems animals ought to receive some compensation for all the terrible suffering they endure in this world. If they went to heaven, they would only have to take up the thread of the lives they began here. Human beings are like gods to the lower creatures. Joe worships you much as you worship your Maker. Animals live in their masters and for their masters. They hang upon our words and looks, and they depend on us in almost every way.
        - id: ch01-b14
          speaker: mr_harry
          text: >-
            That's only how it looks to me here on earth. But with all my heart, I hope we find our animal friends in paradise.
        - id: ch01-b15
          speaker: miss_laura
          text: >-
            The Bible often speaks about animals too. There are the dove and the raven, the wolf and the lamb, the leopard, and the cattle God calls his own. Even a little sparrow cannot fall without our Father knowing.
        - id: ch01-b16
          speaker: mr_harry
          text: >-
            Still, it never tells us plainly whether animals are immortal. But that question is not ours to settle. If it is right for them to be in heaven, we will find them there. What we must deal with is the present. The Bible tells us plainly that a righteous man regards the life of his beast.
        - id: ch01-b17
          speaker: miss_laura
          text: >-
            I think heaven would be happier for me if dear old Joe were there. He has been such a good dog. Think how much he has loved me and protected me. I believe I would be lonely without him.
          emotion: sad
        - id: ch01-b18
          speaker: mr_harry
          text: >-
            That reminds me of some verses, though perhaps they are only doggerel. I clipped them from a newspaper for you yesterday.
        - id: ch01-b19
          speaker: beautiful_joe
          text: He took a small piece of paper from his pocket and read a child's question in Scots.
        - id: ch01-b20
          speaker: mr_harry
          text: >-
            Do doggies gang to heaven, Dad? Will oor auld Donald gang? For noo to tak' him, faither, wi' us, wad be maist awfu' wrang. Withoot oor dogs, eh, faither, man, 'twould be an awfu' sin to leave oor faithful doggie there. He's certain to win in. Oor Donald's no like ither dogs. He'll no be lockit oot. If Donald's no let into heaven, I'll no gang there one foot.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            More verses told of all the kind things old Donald had done for his master's family. Then the poem ended in the child's own words.
        - id: ch01-b22
          speaker: mr_maxwell
          text: Those are exactly my feelings.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            The merry voice came from behind Miss Laura and Mr. Harry. When they looked up, they saw Mr. Maxwell. He held out one hand to greet them. With his other hand, he was trying to keep a basket of large pears behind his back. Mr. Harry promptly took the basket away from him and offered it to Miss Laura.
        - id: ch01-b24
          speaker: mr_maxwell
          text: >-
            I have depended on animals for most of the comfort I've had in this life, and I won't be happy without them in heaven. Miss Morris, I don't see how you could possibly manage there without Joe. As for me, I want my birds, my snake, and my horse. How could I live without all of them? Here in this world, they are almost my whole life.
        - id: ch01-b25
          speaker: miss_laura
          text: >-
            If some animals enter heaven and others do not, I think dogs have the strongest claim. The dog is the oldest and best friend human beings have. Have you heard the legend about a dog and Adam?
        - id: ch01-b26
          speaker: mr_maxwell
          text: No, I haven't.
        - id: ch01-b27
          speaker: miss_laura
          text: >-
            When Adam was driven out of paradise, all the animals turned away from him. He sat there weeping bitterly, with his head bowed between his hands. Then he felt some creature's soft tongue gently touching him. He took his hands from his face and looked up. A dog stood there. The dog had separated himself from every other animal and had come to comfort Adam. From that time on, the dog became Adam's chosen friend and companion, and afterward the friend of all people.
        - id: ch01-b28
          speaker: mr_harry
          text: >-
            There is another legend about our Saviour and a dog. Have you heard that one?
        - id: ch01-b29
          speaker: mr_maxwell
          text: Tell us later, once we know what it is.
        - id: ch01-b30
          speaker: beautiful_joe
          text: Mr. Harry showed his white teeth in an amused smile and began the story.
        - id: ch01-b31
          speaker: mr_harry
          text: >-
            Once upon a time, our Lord was passing through a town with his disciples. A dead dog lay beside the road. Everyone who passed threw some hateful name at it. Dogs in the East are not like the dogs we know, and there seemed to be nothing good in that loathsome creature. Yet when our Saviour came by, he looked at it and spoke gently. He said, “Pearls cannot equal the whiteness of his teeth.”
        - id: ch01-b32
          speaker: mr_maxwell
          text: >-
            What was the name of that old fellow with the beautiful swan? For fifteen years, the bird came to him every day. It would bury its head against his chest and eat from his hand, but it would not go near any other human being. What was the man's name?
        - id: ch01-b33
          speaker: miss_laura
          text: >-
            Saint Hugh of Lincoln. We heard about him at the Band of Mercy the other day.
        - id: ch01-b34
          speaker: mr_maxwell
          text: >-
            Surely Saint Hugh would have wanted that swan with him in heaven. What a beautiful creature it must have been. Though when I think about animals going there, I dare say some might object because of the company they would meet. Think of a dog kicked to death by its master, a horse driven into its grave, and thousands of cattle starved to death on the plains. Would any of them want to meet their owners in heaven?
        - id: ch01-b35
          speaker: mr_harry
          text: >-
            By my reckoning, those owners won't be there. I firmly believe the Lord will punish every man or woman who mistreats a helpless creature, just as surely as he punishes those who mistreat other people. Suppose a man's whole life has been one long course of cruelty toward animals. Do you think he could enjoy heaven, where everyone will be treated with kindness? Not he. He would rather be in the other place, and I fully believe that is where he will go.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Mrs. Wood joined Miss Laura and the two young men. Her eyes sparkled with amusement.
        - id: ch01-b37
          speaker: mrs_wood
          text: >-
            Harry, when you've finished deciding the fate of every person and every animal, perhaps you'll be kind enough to visit the orchard and see how your father is doing with the apples.
        - id: ch01-b38
          speaker: beautiful_joe
          text: Mr. Harry put an arm around his mother.
        - id: ch01-b39
          speaker: mr_harry
          text: >-
            The apples can wait, Mother. I only came inside for Laura. Come along, Maxwell. We can all go together.
        - id: ch01-b40
          speaker: mrs_wood
          text: >-
            And no more talk about animals. If someone doesn't stop Laura from thinking about all their suffering, she will drive herself mad one day.
        - id: ch01-b41
          speaker: beautiful_joe
          text: Miss Laura turned around at once.
        - id: ch01-b42
          speaker: miss_laura
          text: >-
            Dear Aunt Hattie, you must not say that. I know I am a coward when I hear about the pain animals suffer, but I must get over it. I want to know how they suffer, even when hearing it hurts me. I ought to know. When I grow into a woman, I mean to do everything I possibly can to help them.
        - id: ch01-b43
          speaker: mr_maxwell
          text: Then I will join you.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell held out his hand. Miss Laura did not smile. She looked at him very earnestly and clasped his hand in both of hers.
        - id: ch01-b45
          speaker: miss_laura
          text: You will help me care for them, won't you?
        - id: ch01-b46
          speaker: mr_maxwell
          text: >-
            Yes, I promise. If you will do it too, I will give myself to serving animals.
        - id: ch01-b47
          speaker: beautiful_joe
          text: Mr. Harry laid his hand across theirs.
        - id: ch01-b48
          speaker: mr_harry
          text: And so will I.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Mrs. Wood stood watching their three fresh, eager young faces, and tears came into her eyes. For one moment, all three of them were silent. Just then, the old village clergyman entered the room from the hall. He must have heard the promise they had made. Before any of them could move, he came forward and laid his hands upon their three brown heads.
        - id: ch01-b50
          speaker: clergyman
          text: >-
            Bless you, my children. God will lift up the light of his countenance upon you, because you have given yourselves to noble work. By serving creatures that cannot speak for themselves, you are making the whole human race nobler.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            Then the clergyman sat in a chair and looked at them. He was a venerable old man with long white hair, and the Wood family thought a great deal of him. He had come because a woman in the village was sick. He wanted Mrs. Wood to make some nourishing dishes for her. While he talked with Mrs. Wood about it, Miss Laura and the two young men went out of the house.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            They hurried across the veranda and then over the lawn, talking and laughing together. They enjoyed themselves in the wholehearted way that only happy young people can. Not a trace of the deep seriousness they had shown only a few moments earlier remained on any of their faces.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            They were going so fast that they ran straight into a flock of geese coming up the lane. A small boy named Tommy was driving them. He was the son of one of Mr. Wood's farm laborers. The geese chattered and gabbed all around him. They sounded very angry about something.
        - id: ch01-b54
          speaker: mr_harry
          text: >-
            What is all this about, Tommy? What has upset your feathered charges?
        - id: ch01-b55
          speaker: beautiful_joe
          text: Tommy looked miserable and nearly ready to cry.
        - id: ch01-b56
          speaker: tommy
          text: >-
            If you mean the geese, it's those nasty potatoes. The geese just won't leave them alone.
          emotion: sad
        - id: ch01-b57
          speaker: mr_maxwell
          text: Oh, so the potatoes are chasing the geese, are they?
        - id: ch01-b58
          speaker: tommy
          text: >-
            No, no! Mr. Wood sets me to watch the geese. Then they run in among the buckwheat and the potatoes. I try and try to drive them out, but they don't want to come. So I have to switch their feet. I hate doing that, because I'm a Band of Mercy boy.
          emotion: angry
        - id: ch01-b59
          speaker: mr_maxwell
          text: >-
            Tommy, my boy, you will go straight to heaven when you die, and your geese will all go with you.
        - id: ch01-b60
          speaker: miss_laura
          text: Hush, Maxwell. Don't tease him.
        - id: ch01-b61
          speaker: beautiful_joe
          text: Miss Laura put her arm around the child's shoulder.
        - id: ch01-b62
          speaker: miss_laura
          text: >-
            You are a good boy, Tommy, because you don't want to hurt the geese. Let me see your switch, dear.
        - id: ch01-b63
          speaker: beautiful_joe
          text: He showed her the little stick in his hand.
        - id: ch01-b64
          speaker: miss_laura
          text: >-
            I don't think you could hurt them very much with such a little stick. And if they insist on being naughty and stealing the potatoes, you have to drive them out somehow. Take some of my pears and eat them. Before long, you will forget all about your trouble.
        - id: ch01-b65
          speaker: beautiful_joe
          text: >-
            Tommy took the fruit, and the three young people went on their way. They smiled and looked back over their shoulders. Tommy stood in the lane, devouring his pears while keeping one eye on the geese. They had gathered a little way in front of him and were gabbling noisily. It sounded as if they were holding a meeting to express their indignation at being driven out of the potato field.
        - id: ch01-b66
          speaker: beautiful_joe
          text: >-
            Tommy's father and mother lived in a small house down near the road. Mr. Wood never asked his hired men to live in the farmhouse with his family. He had built two small houses for his workers, and he required them to keep those homes just as neat as he kept his own house.
        - id: ch01-b67
          speaker: beautiful_joe
          text: >-
            Mr. Wood said he could see no reason why being a farmer meant he should keep a boardinghouse. Nor could he see why his wife should wear herself out waiting on strong, healthy men who were just as able to care for themselves. In his own home, he wanted his family around him. He believed it was better for his workers to have some kind of family life of their own as well. If one of them was unmarried, he took his meals with a married worker, but slept in his own little house.
        - id: ch01-b68
          speaker: beautiful_joe
          text: >-
            On that October day, we found Mr. Wood hard at work beneath the fruit trees. He grew a great many kinds of apples. There were enormous red ones and long yellow ones called pippins. There were little brown apples, smooth-coated sweet ones, bright red ones, and still more kinds than I could mention.
        - id: ch01-b69
          speaker: beautiful_joe
          text: >-
            Miss Laura often peeled one of the apples and cut off little pieces for me to eat. I always wanted a taste of whatever I saw her eating, and apples were no exception.
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            Only a few days after our walk to the orchard, Miss Laura and I returned to Fairport. Some of Mr. Wood's apples traveled on the train with us, because he sent a great many of them to the Boston market. Mr. and Mrs. Wood came all the way to the station to see us off. Mr. Harry could not come. He had left Riverdale the day before to go back to his college.
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            Mrs. Wood said the farm would feel very lonely without her two young people, Laura and Harry. At the station, she kissed Miss Laura over and over. Before we left, she made Laura promise that she would come back to the farm again the next summer.
