audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 亲切活泼，提问时好奇而真诚
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 温和爽利，关照人时自然亲切
        timbre: 温暖清晰
        pace: 适中
        pitch: 中
    maxwell:
      display_name: 马克斯韦尔先生
      tts:
        delivery: 温和风趣，叙事时从容可信
        timbre: 温润清朗
        pace: 适中
        pitch: 中
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    village_clergyman:
      display_name: 老牧师
      tts:
        delivery: 慈爱庄重，祝福时真挚有力量
        timbre: 苍老而浑厚
        pace: 舒缓
        pitch: 低
    tommy:
      display_name: 汤米
      tts:
        delivery: 老实稚气，受委屈时急切又倔强
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 高
    bella:
      display_name: 贝拉
      tts:
        delivery: 顽皮机敏，善于模仿人声
        timbre: 尖细而略带沙哑
        pace: 明快
        pitch: 高
  chapters:
    - id: ch01
      title: 第三十二章　我们回家
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            十月是一年中最美的月份，可我们不得不回费尔波特了。劳拉小姐实在舍不得农庄。谁一提她要走，她脸上就满是愁色。不过，她已经恢复了健康，身子也强壮起来，皮肤晒得像浆果一样褐。她自己也知道，该回家重新上课了。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            伍德先生把十月叫作金色的月份。一切都静了下来，四下安安宁宁。夜里和清晨，太阳都蒙着一层金黄的薄雾。果园里的树上压满了果实，有些叶子悠悠落下来，在地上铺出柔软的一层。花园里还有许多花，红得似火，黄得耀眼。劳拉小姐每天都采一束，带回客厅插起来。
        - id: ch01-b03
          speaker: miss_laura
          text: >-
            这些花很快就要谢了。要是永远都是夏天，那该多好。
          emotion: sad
        - id: ch01-b04
          speaker: beautiful_joe
          text: 哈里先生悄悄来到她身后。
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            真让你永远过夏天，你也会厌倦的。只有一个地方的夏天可以永不消逝，那就是天堂。
        - id: ch01-b06
          speaker: miss_laura
          text: 你觉得天堂里永远都是夏天吗？
        - id: ch01-b07
          speaker: mr_harry
          text: >-
            我不知道。我猜大概是吧，可这件事恐怕谁也说不准。我们只能等着瞧。
        - id: ch01-b08
          speaker: beautiful_joe
          text: 劳拉小姐转过身，目光落在我身上。
        - id: ch01-b09
          speaker: miss_laura
          text: 哈里，你说，不会说话的动物也能上天堂吗？
        - id: ch01-b10
          speaker: mr_harry
          text: >-
            我还是只能说不知道。不过，有些人相信它们会去。前几天，我在一份密歇根州的报纸上读到一篇文章。作者说，古往今来，有许多杰出的人相信动物有来世。荷马、后来的希腊人、一些罗马人和早期基督徒都这样想。早期基督徒还相信，上帝会把天使化成鸟儿，去安慰那些为了信仰而受苦的人。圣方济各把飞禽走兽称作自己的兄弟。约翰逊博士相信动物有来生。华兹华斯、雪莱、柯勒律治、杰里米·泰勒、阿加西、拉马丁，还有许多基督教学者也相信。
        - id: ch01-b11
          speaker: mr_harry
          text: >-
            动物在这个世界受了那么多可怕的苦，似乎也该得到一点补偿。它们若去了天堂，只要接着过尘世的生命就行。对低等生灵来说，人就像神。乔崇敬你，就像你敬奉造物主。动物靠主人活着，也是为主人活着。主人的一句话、一个眼神都牵动着它们，它们几乎什么事都得依靠我们。只说我自己的心愿吧，我真盼望到了乐园，还能见到这些不会说话的朋友。
        - id: ch01-b12
          speaker: miss_laura
          text: >-
            《圣经》里也常常说起动物。鸽子和乌鸦，狼和羔羊，豹子，还有上帝说属于他的牛群。就连一只小麻雀落到地上，天父也知道。
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            可书里到底没有明说，动物会不会永生。其实那也不用我们操心。它们若理应进天堂，我们自然会在那里见到它们。眼下，我们只要把今生的事做好。《圣经》说得明明白白：“义人顾惜他牲畜的命。”
        - id: ch01-b14
          speaker: miss_laura
          text: >-
            要是亲爱的老乔也在那里，我在天堂一定会更快乐。他一直是条那么好的狗。想想看，他多么爱我，又怎样保护我。没有他，我大概会觉得孤单。
          emotion: sad
        - id: ch01-b15
          speaker: mr_harry
          text: >-
            这让我想起几句诗，说是打油诗更合适。昨天我特意从报纸上剪下来给你看的。
        - id: ch01-b16
          speaker: beautiful_joe
          text: 他从口袋里掏出一小条纸，念了起来。
        - id: ch01-b17
          speaker: mr_harry
          text: >-
            爸爸，小狗也上天堂吗？咱家老唐纳德也能去吗？如今若把它从身边带走，爸爸，那可真是大错呀。
        - id: ch01-b18
          speaker: beautiful_joe
          text: 后面还有好几节，讲老狗唐纳德为主人一家做过多少好事。最后，诗里这样说。
        - id: ch01-b19
          speaker: mr_harry
          text: >-
            若不带狗儿，爸爸呀，那可真是罪过。忠心的狗儿不能丢下，它准能把门儿过。咱家唐纳德不同别的狗，天堂不会把它关在外头。唐纳德若进不了天堂，我也一步不往那里走。
        - id: ch01-b20
          speaker: maxwell
          text: 这话说到我心里去了。
          emotion: happy
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            一个快活的声音从他们身后传来，原来是马克斯韦尔先生。他向两人伸出一只手，另一只手却把一篮硕大的梨藏在背后。哈里先生马上接过篮子，把梨递给劳拉小姐。
        - id: ch01-b22
          speaker: maxwell
          text: >-
            我这一生大半的安慰都来自动物。天堂里若没有它们，我也不会快乐。莫里斯小姐，我不知道没有乔，你要怎么过日子。可我还想要我的鸟、我的蛇和我的马。少了它们，我怎么活呢？我在世上的生活，几乎全是它们给的。
        - id: ch01-b23
          speaker: miss_laura
          text: >-
            要是有些动物能上天堂，有些不能，我想狗最有资格先进去。狗是人类最古老、最好的朋友。你们听过狗和亚当的传说吗？
        - id: ch01-b24
          speaker: maxwell
          text: 没听过。
        - id: ch01-b25
          speaker: miss_laura
          text: >-
            亚当被逐出乐园以后，所有动物都躲开了他。他双手掩面坐在那里，伤心地哭着。忽然，有个生灵用柔软的舌头轻轻舔他。他把手放下来，看见一条狗离开了别的动物，独自来安慰他。从此，狗成了亚当最亲近的朋友和伙伴，后来也成了全人类的朋友和伙伴。
        - id: ch01-b26
          speaker: mr_harry
          text: 还有一个救世主和狗的传说。你们听过吗？
        - id: ch01-b27
          speaker: maxwell
          text: 等我们知道是怎么回事以后，再讲给你听吧。
        - id: ch01-b28
          speaker: beautiful_joe
          text: 哈里先生听了，露出洁白的牙齿笑起来，接着讲了这个故事。
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            从前，我们的主和门徒经过一座城。路边躺着一条死狗，每个走过的人都用难听的话辱骂它。东方的狗不像我们的狗。那具让人厌恶的尸体，看起来一点可取之处也没有。可救世主走过时，却温和地说：“珍珠也比不上它牙齿的洁白。”
        - id: ch01-b30
          speaker: maxwell
          text: >-
            那个老人叫什么名字来着？他有一只美丽的天鹅，十五年里每天都来，把头埋在他怀里，吃他手上的东西，却不肯靠近别的人。
        - id: ch01-b31
          speaker: miss_laura
          text: >-
            是林肯的圣休。前几天，我们在仁慈会上听过他的故事。
        - id: ch01-b32
          speaker: maxwell
          text: >-
            我想，他一定希望那只天鹅能和自己一起去天堂。它该有多美啊。说到动物上天堂，我敢说，有些动物反倒不愿意去，因为它们不想在那里碰见某些人。想想被主人踢死的狗，被驱使到累死的马，还有平原上活活饿死的成千上万头牛。它们会愿意在天堂遇见自己的主人吗？
        - id: ch01-b33
          speaker: mr_harry
          text: >-
            照我的推断，那些主人根本不会在那里。我坚信，谁虐待不会说话的生灵，上帝就一定会惩罚他，就像惩罚虐待同类的人一样。一个人要是一辈子都在残酷折磨动物，他到了处处充满仁爱的天国，还能过得快活吗？绝不可能。他宁愿去另一个地方。我深信，他也一定会到那里去。
        - id: ch01-b34
          speaker: mrs_wood
          text: >-
            哈里，等你把人类和不会说话的众生都安置妥当以后，也许肯屈尊到果园里看看，你父亲的苹果摘得怎么样了吧？
        - id: ch01-b35
          speaker: beautiful_joe
          text: 伍德太太走到他们身边，眼里闪着逗趣的光。哈里先生伸手搂住了她。
        - id: ch01-b36
          speaker: mr_harry
          text: >-
            苹果又不会跑，母亲。我只是进屋待一会儿，顺便叫上劳拉。走吧，马克斯韦尔，我们一起去。
        - id: ch01-b37
          speaker: mrs_wood
          text: >-
            不许再谈动物啦！要是没人设法拦着劳拉，她总想着动物受的苦，迟早会发疯的。
        - id: ch01-b38
          speaker: beautiful_joe
          text: 劳拉小姐猛地转过身。
        - id: ch01-b39
          speaker: miss_laura
          text: >-
            亲爱的哈蒂舅妈，你千万别这么说。我知道，听见动物受苦，我就会害怕，是个胆小鬼。可我必须改掉这个毛病。我想知道它们怎样受苦，我也应该知道。等我长大成人，一定要尽我所能地帮助它们。
        - id: ch01-b40
          speaker: maxwell
          text: 那我也加入你。
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生向劳拉小姐伸出手。她没有笑，只是认真地望着他，把他的手紧紧握住。
        - id: ch01-b42
          speaker: miss_laura
          text: 你愿意帮我照料它们，是吗？
        - id: ch01-b43
          speaker: maxwell
          text: >-
            愿意，我保证。只要你愿意，我也会献身去为不会说话的动物服务。
        - id: ch01-b44
          speaker: mr_harry
          text: 还有我。
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            哈里先生用低沉的声音说着，把手覆在他们的手上。伍德太太望着三张年轻、红润而热切的脸，眼里涌出了泪水。大家默默站了一会儿，村里的老牧师恰好从门厅走进来。他一定听见了这些话。三个人还没来得及动，他已经把双手按在三颗晒得褐亮的头上。
        - id: ch01-b46
          speaker: village_clergyman
          text: >-
            上帝保佑你们，我的孩子。上帝一定会让他的荣光照耀你们，因为你们已经献身于一项高尚的事业。你们为不会说话的生灵服务，也是在让人类变得更加高尚。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            牧师坐下来望着他们。他是一位德高望重的老人，留着长长的白发，伍德一家十分敬爱他。他来找伍德太太，是想请她为村里一个生病的女人做几样滋补的食物。趁他们谈话时，劳拉小姐和两个年轻人出了屋。他们匆匆穿过游廊，跑过草坪，一路说着笑着，快活得只有幸福的年轻人才会这样。几分钟前那副郑重的神情，如今在三张脸上一点也看不见了。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            他们跑得太快，一头撞进了沿小路赶来的一群鹅中。赶鹅的是个小男孩，名叫汤米，是伍德先生家一个农工的儿子。鹅群嘎嘎乱叫，看起来气愤极了。哈里先生停下来望着男孩。
        - id: ch01-b49
          speaker: mr_harry
          text: >-
            这是怎么回事？汤米，小伙子，你照看的这些长羽毛的家伙怎么啦？
        - id: ch01-b50
          speaker: tommy
          text: >-
            您要是问鹅，都怪那些讨厌的土豆。它们就是不肯离土豆远点儿。
          emotion: sad
        - id: ch01-b51
          speaker: maxwell
          text: 这么说，是土豆在追鹅啰？
        - id: ch01-b52
          speaker: tommy
          text: >-
            不，不是！伍德先生叫我看着鹅，可它们总往荞麦地和土豆地里跑。我想把它们赶出来，它们就是不肯走。后来……我只好用细枝抽它们的脚。可我讨厌这样做，因为我是仁慈会的男孩。
          emotion: angry
        - id: ch01-b53
          speaker: maxwell
          text: >-
            汤米，我的孩子，你死后一定会直接上天堂，你的鹅也会跟你一起去。
        - id: ch01-b54
          speaker: miss_laura
          text: >-
            嘘，别说了，不要逗他。汤米，你不愿意伤害鹅，真是个好孩子。亲爱的，让我看看你的细枝。
        - id: ch01-b55
          speaker: beautiful_joe
          text: 汤米把手里那根小棍递给她。
        - id: ch01-b56
          speaker: miss_laura
          text: >-
            我想，这么细的小棍不会把它们打得多疼。它们要是淘气，非去偷吃土豆，你也只能把它们赶出来。拿几个我的梨吃吧。吃完，你就会忘掉这些烦恼了。
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            汤米接过梨，劳拉小姐和两个年轻人笑着继续赶路，还不时回头望望他。汤米站在小路上大嚼着梨，一只眼睛仍盯着聚在前方不远处的鹅。那群鹅吵吵嚷嚷，像是在召开一场愤怒的大会，抗议人们把它们赶出土豆地。
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            汤米的父母住在靠近大路的一所小房子里。伍德先生从不让雇工住进自己家。他另有两所小屋给他们居住，还要求他们把屋子收拾得和伍德家的房子一样整洁。他说，自己既然是个农夫，就没必要兼开寄宿公寓。他也不该让妻子伺候一群身强体壮、完全能照顾自己的男人，把身体都累垮。他只想让自家人围在身边。雇工们各自过一点家庭生活，对他们也更好。谁要是还没成家，就在已婚的那一家搭伙吃饭，晚上仍回自己的屋子睡觉。
        - id: ch01-b59
          speaker: beautiful_joe
          text: >-
            那个十月的日子里，我们在果树下找到了伍德先生。他正忙得不可开交。他种着好多种苹果，有硕大鲜红的，有细长金黄、被人叫作皮平苹果的，有小小的褐色苹果，也有表皮光滑的甜苹果和亮红的苹果。种类太多，我简直说也说不完。劳拉小姐常常削一只，切下小块给我吃。她吃什么，我看见了就总想尝尝。
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            几天以后，劳拉小姐和我回费尔波特去了。伍德先生的苹果也有一些和我们同行，因为他送了许多去波士顿的市场。伍德先生和太太到车站为我们送行。哈里先生前一天已经离开里弗代尔，回大学去了，没能来。伍德太太说，两个年轻人都走了，家里一定会很寂寞。她一遍又一遍地吻劳拉小姐，还要她答应明年夏天再回来。
        - id: ch01-b61
          speaker: beautiful_joe
          text: >-
            我被装进一只箱子，放在快运车厢里。伍德先生还特意嘱咐押运员。
        - id: ch01-b62
          speaker: mr_wood
          text: >-
            你要是聪明，就时不时同乔说说话。它可是一条极通人性的狗。你若不好好待它，它说不定会把你的事写到报纸上去。
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            押运员笑了。一路上，他常常来到箱子旁，亲切地同我说话。这一次，我不像来里弗代尔时那么孤单，也没那么害怕。
        - id: ch01-b64
          speaker: beautiful_joe
          text: >-
            莫里斯一家看见我们回来，不知有多高兴！几个男孩都先到家了。他们围着姐姐又叫又嚷，闹得可热闹了。他们深深爱着她，一点也不愿意让她长久离家。我也给他们摸了又摸，还得跑来跑去，向每个人伸出爪子。吉姆和小比利舔我的脸，贝拉则粗声粗气地叫起来。
        - id: ch01-b65
          speaker: bella
          text: 见到你真高兴，乔。玩得开心吗？身体怎么样？
          emotion: happy
        - id: ch01-b66
          speaker: beautiful_joe
          text: >-
            不久，我们便安顿下来过冬。劳拉小姐重新上学，每天回家时，胳膊下都夹着一摞书。乡下这个夏天让她的身体好了许多。母亲常疼爱地望着她，说当初送走的是个脸色苍白的孩子，如今回来的，却是一位晒得栗色的姑娘。
