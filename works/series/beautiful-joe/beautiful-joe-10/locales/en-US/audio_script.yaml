  chapters:
    - id: ch01
      title: BILLY'S TRAINING CONTINUED
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Billy went into the street for the first time when he was five months old. Miss Laura knew he had been trained well, so she was happy to take him into town. She would never walk out with a dog who misbehaved, and she did not like drawing attention by shouting orders at her pets.
        - id: ch01-b02
          speaker: miss_laura
          text: Stay close, Billy.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            She spoke quietly as soon as we came down the front steps. Staying beside her was hard for playful little Billy. He knew every corner of the house and garden, but the world outside was full of new things to see and smell. Pretty dogs were running about, and he longed to play with them. Even so, he obeyed.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            We soon reached a shop where Miss Laura wanted to buy ribbons. She left me outside but took Billy in. Through the glass door, I watched her sit at a counter. Billy waited behind her until she told him to lie down, and then he curled up at her feet.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            He stayed there quietly when she walked to another counter, though he watched her anxiously until she returned and told him to get up. He sprang to his feet and followed her outside. In the doorway, she looked down fondly while we pressed close around her.
        - id: ch01-b06
          speaker: miss_laura
          text: You have both been good. I think you deserve a present.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            We followed her to another shop and lay beside the counter. Then we heard her ask the clerk for solid rubber balls. It was almost impossible to keep still. Both of us knew exactly what the word “ball” meant.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            Miss Laura carried the parcel outside and turned toward the sea instead of doing more shopping. She meant to give us a good walk on the beach, though the day was dark, cloudy, and unpleasant. Most young ladies would have stayed indoors, but the Morris children never cared about bad weather. The boys even went out in pouring rain with rubber boots and coats.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            A high wind tossed Miss Laura's cloak and dress as she walked. Once we had passed the houses, she ran with us for a while. Billy and I jumped, raced about, and barked until we were tired. Then we settled down and walked quietly.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Up ahead, some boys were throwing sticks into the water for two Newfoundland dogs. Without warning, the dogs began to fight. They were both big and powerful, and neither had an advantage in size. Their growls were dreadful, and they tore at each other's throats.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            I looked to Miss Laura. One word from her, and I would have gone in to help the dog who was losing. Instead, she ordered me to stay back and ran toward them herself.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            The boys tried everything. They splashed the dogs with water, pulled their tails, and threw stones. Still the dogs would not separate. Their heads seemed locked together as they struggled back and forth across the stones. The boys crowded around them, shouting, striking, and kicking, but nothing made those powerful dogs let go.
        - id: ch01-b13
          speaker: miss_laura
          text: Move back, boys. I'll separate them.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            She took a small packet from her purse, bent over the dogs, and shook powder across their noses. In the next instant, they sprang yards apart and sneezed as if their heads might come off.
        - id: ch01-b15
          speakers: [boy_1, boy_2, boy_3]
          ensemble: chorus
          text: What did you do, miss? What is that stuff? Whew, it's pepper!
          emotion: surprised
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Miss Laura sat on a flat rock. Her face had gone very pale.
        - id: ch01-b17
          speaker: miss_laura
          text: >-
            Oh, boys, why did you set those dogs fighting? It's terribly cruel. They were playing together happily before you turned them against each other. Look at their beautiful coats now. They are torn, and blood is dripping from them.
        - id: ch01-b18
          speaker: boy_1
          text: >-
            It wasn't my fault. Jim Jones said his dog could beat mine. I told him he couldn't, and he didn't, either.
          emotion: angry
        - id: ch01-b19
          speaker: boy_2
          text: His dog could beat yours! Say he couldn't again, and I'll smash your head.
          emotion: angry
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            The two boys edged toward each other with their fists clenched. Then the mischievous third boy grabbed the pepper paper, ran up, and shook what remained into their faces.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            That ended every thought of fighting. The two boys coughed, choked, and spluttered until they stumbled over beside the dogs. All four sneezers had a lively time together.
        - id: ch01-b22
          speakers: [boy_4, boy_5]
          ensemble: duo
          text: A sneezing concert! Thank you, gentlemen. Encore! Encore!
          emotion: happy
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            The other boys shouted with delight and pointed. Miss Laura could not help laughing, and even Billy and I curled our lips. After a while, everyone grew serious again. None of the boys had a handkerchief, so Miss Laura dipped her own soft one in a nearby spring and wiped the sneezers' red eyes.
        - id: ch01-b24
          speaker: miss_laura
          text: You won't set those dogs fighting again, will you?
        - id: ch01-b25
          speakers: [boy_1, boy_2, boy_3]
          ensemble: chorus
          text: No, sirree, Bob!
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Their bad temper was gone. Miss Laura left them and walked slowly home. From that day on, whenever those boys saw her, they called her “Miss Pepper.”
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            When we reached home, Willie was curled beside the hall window with a book. He read too much, and his mother often told him to put the book away and run around with the other boys. That afternoon, Miss Laura rested a hand on his shoulder.
        - id: ch01-b28
          speaker: miss_laura
          text: I meant to play ball with the dogs, but I'm feeling rather tired.
        - id: ch01-b29
          speaker: willie
          text: Oh, nonsense. You're tired all the time.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            He shook her hand away. Miss Laura sat in a hall chair and told him about the dogfight. Willie became so interested that his book slipped to the floor. When she finished, he spoke quite differently.
        - id: ch01-b31
          speaker: willie
          text: You're wonderful every day. Go and get some rest now.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            He snatched up the balls, called us, and ran toward the basement. But he was not fast enough to escape Miss Laura. She caught him in her arms and kissed him again and again. Willie was the youngest and the pet of the family. He loved her dearly, though he spoke impatiently to her more often than his brothers did.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            We had a splendid game with Willie. Miss Laura had taught us all kinds of ball games. We jumped for the balls, played hide-and-seek with them, and caught them.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Billy knew more games than I did, and one of them seemed very clever to me. He played ball all by himself. He loved it so much that he never seemed to have enough. Miss Laura played whenever she could, but she also helped her mother sew and do housework. She studied with her father too, because she was only seventeen and had not finished her lessons.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            So Billy would carry his ball away and make his own game. Sometimes he rolled it across the floor. Sometimes he tossed it up or pushed it between the staircase rails so it fell into the hall below. He listened for it to land, raced downstairs to fetch it, and pushed it through again. When he finally grew tired, he brought the ball back and laid it at Miss Laura's feet.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Both of us had learned many tricks. We could pretend to sneeze or cough, play dead, say our prayers, stand on our heads, and climb a ladder. We could even say the alphabet. That was the hardest trick, and teaching it took Miss Laura a long time.
        - id: ch01-b37
          speaker: miss_laura
          text: Begin now. Joe and Billy, say A.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            We never began until a book was open in front of us. We stared at it and waited for Miss Laura to begin. For A, we made a small squeal. B was louder, and C louder still. Some letters were barks and others were growls. At S, we always turned a somersault. When we reached Z, we shoved the book away and romped around the room.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Whenever a visitor came in and Miss Laura had us perform, the person always said we were clever dogs, unlike other dogs. But that was wrong. Billy and I were no brighter than many poor curs skulking through Fairport's streets. Kindness and patience had taught us everything.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            Jenkins had thought I was very stupid. He would have laughed if anyone suggested teaching me. The truth was that so much kicking had made me stubborn and sullen. If he had treated me kindly, I would have done anything for him.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            I loved helping Miss Laura and Mrs. Morris. They taught Billy and me to be useful around the house. Mrs. Morris disliked climbing the three long staircases, so we sometimes raced up and down to bring her what she needed.
        - id: ch01-b42
          speaker: mrs_morris
          text: Laura, please send down a clean duster. Joe, you can fetch it.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            I would run happily upstairs. Then it would be Billy's turn.
        - id: ch01-b44
          speaker: mrs_morris
          text: Billy, I left my keys upstairs. Please bring them to me.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            Before long, we learned the names of different objects and knew where they belonged. We could fetch them without help. Sweeping days kept us very busy, and we enjoyed the fun. When Mrs. Morris was too far away to call Mary, she wrote down the thing she wanted and sent one of us to carry the note.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            Billy always took the letters from the postman and brought the morning paper to Mr. Morris's study. My special work was putting away clean clothes. After Mrs. Morris mended and folded each piece, she handed it to me and named its owner. I carried it to the right bed.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            She did not really need to tell me the names. I knew each person's clothes by smell. Every human being has a strong scent to a dog, even if people cannot notice it themselves.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            Mrs. Morris never realized how much she confused me when she gave Miss Laura's clothes to poor people. Once I followed Laura's scent all across town, only to find a ragged child sitting in the gutter with a pair of her boots.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Before I finish this chapter, I must tell you about Billy's tail. People usually cut off the ends of fox terriers' tails but leave their ears alone. Billy came to Miss Laura before anyone had cut his tail, and she refused to have it done.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            One day, Mr. Robinson came to see Billy.
        - id: ch01-b51
          speaker: mr_robinson
          text: >-
            You have turned him into a fine-looking dog, but that long tail spoils his appearance.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            Mrs. Morris patted little Billy as he lay in her lap.
        - id: ch01-b53
          speaker: mrs_morris
          text: Mr. Robinson, wouldn't you say this little dog's body is beautifully proportioned?
        - id: ch01-b54
          speaker: mr_robinson
          text: Yes. Every point is correct except for his tail.
        - id: ch01-b55
          speaker: mrs_morris
          text: >-
            But if our Creator made that beautiful little body, isn't he wise enough to know how long its tail should be?
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            Mr. Robinson gave her no answer. He only laughed and said that Mrs. Morris and Miss Laura were both cranks.
