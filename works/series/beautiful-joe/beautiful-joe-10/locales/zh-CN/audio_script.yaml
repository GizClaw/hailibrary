audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    boy_1:
      display_name: 养狗的男孩
      tts:
        delivery: 好强倔强，说话直冲冲的
        timbre: 年轻而略显粗哑
        pace: 稍快
        pitch: 中高
    jim_jones:
      display_name: 吉姆·琼斯
      tts:
        delivery: 争强好胜，激动时咄咄逼人
        timbre: 响亮年轻
        pace: 快
        pitch: 中高
    boy_3:
      display_name: 淘气男孩
      tts:
        delivery: 顽皮大胆，爱看热闹
        timbre: 清亮活泼
        pace: 轻快
        pitch: 高
    boy_4:
      display_name: 围观男孩
      tts:
        delivery: 爱起哄，笑声爽朗
        timbre: 明亮
        pace: 轻快
        pitch: 中高
    willie:
      display_name: 威利
      tts:
        delivery: 聪明淘气，嘴上不耐烦却很亲热
        timbre: 稚嫩清朗
        pace: 明快
        pitch: 中高
    visitor:
      display_name: 来访客人
      tts:
        delivery: 由衷赞叹，语气自然
        timbre: 清晰温和
        pace: 适中
        pitch: 中
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 慈爱从容，讲道理时温和而坚定
        timbre: 温润沉稳
        pace: 不疾不徐
        pitch: 中
    mr_robinson:
      display_name: 罗宾逊先生
      tts:
        delivery: 自信随意，带着旧习惯里的固执
        timbre: 成熟洪亮
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 比利第一次上街
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            比利五个月大时，第一次上街散步。他已经受过很好的训练，劳拉小姐放心地带他进了城。她绝不会牵一只不守规矩的狗上街，更不愿一路高声发号施令，引得别人都来看她。
        - id: ch01-b02
          speaker: miss_laura
          text: 比利，跟紧我。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            我们才走下门前的台阶，她就轻声吩咐了比利。外面的世界和屋里、花园里完全不同。四处都有他没见过的东西，等着他去看一看、闻一闻，还有漂亮的狗在街上跑，他真想冲过去一起玩。要这么一只贪玩的小狗紧跟主人，太不容易了，可他还是乖乖照做。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            不久，劳拉小姐走进一家店买丝带。她让我留在门外，却把比利带了进去。我从玻璃门外望着。她在柜台前坐下，比利一直站在身后，等她开口。
        - id: ch01-b05
          speaker: miss_laura
          text: 比利，趴下。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            比利立刻蜷在她脚边。后来她走到另一处柜台，他仍旧安静地趴着，只是目光焦急，一直追着她。等她回来叫他起身，他才跳起来，跟她走出店门。
        - id: ch01-b07
          speaker: miss_laura
          text: 你们都是好狗狗，我给你们买件礼物。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            她满怀爱意地低头看着我们，我们也亲热地往她身上蹭。随后，她带我们进了另一家店。我和比利一起趴在柜台旁，听见她向店员要实心橡皮球，简直快趴不住了，因为我们都明白“球”是什么。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            劳拉小姐拿着纸包出来，不再逛店，径直朝海边走。她要带我们沿着海滩好好散步。那天阴沉昏暗，云层密布，风又大，大多数姑娘都会留在家里。莫里斯家的孩子却从不怕坏天气，连倾盆大雨也挡不住男孩子们穿上胶靴和雨衣出去玩。大风吹得劳拉小姐的斗篷和裙子上下翻飞。出了房舍，她带我们跑了一阵。我们又蹦又跳，又叫又闹，累了才安安静静地往前走。
    - id: ch02
      title: 胡椒止住的争斗
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            前面不远处有几个男孩，把木棍扔进水里，叫两只纽芬兰犬去捡。两只狗忽然打了起来。它们都是有力气的大狗，身量也不相上下。那凶狠的低吼听得人害怕，它们还死死撕咬着对方的喉咙。我望着劳拉小姐，只要她开口，我就会冲进去帮那只落在下风的狗。可她叫我退后，自己跑了过去。
        - id: ch02-b02
          speaker: beautiful_joe
          text: >-
            男孩们朝狗泼水、扯尾巴、扔石头，怎么也分不开它们。两颗脑袋仿佛锁在了一起，两只狗在石滩上前后来回地扭打。男孩们紧紧围住它们，不停地喊叫，又朝它们身上打、踢，场面乱成一团。
        - id: ch02-b03
          speaker: miss_laura
          text: 男孩们，都退后，我来让它们停下。
        - id: ch02-b04
          speaker: beautiful_joe
          text: >-
            劳拉小姐从手提包里拿出一个小纸包，弯腰把粉末撒在两只狗的鼻子上。下一刻，它们已经分开好几码，喷嚏一个接一个，脑袋都快打掉了。
        - id: ch02-b05
          speakers: [boy_1, jim_jones, boy_3, boy_4]
          ensemble: chorus
          text: 小姐，你对它们做了什么？那是什么？哎哟，是胡椒！
        - id: ch02-b06
          speaker: beautiful_joe
          text: 劳拉小姐脸色苍白，在一块平坦的岩石上坐下，望着他们。
        - id: ch02-b07
          speaker: miss_laura
          text: >-
            你们为什么要让它们打架呢？这太残忍了。它们原来玩得好好的，是你们故意让它们互相撕咬。看看它们漂亮的毛被扯坏了，身上还在流血。
        - id: ch02-b08
          speaker: boy_1
          text: 这可不怪我。是吉姆·琼斯先说他的狗能打赢我的狗。我说不能，它本来就打不赢。
        - id: ch02-b09
          speaker: jim_jones
          text: 我的狗就是能赢！你再说不能，我就砸烂你的脑袋！
          emotion: angry
        - id: ch02-b10
          speaker: beautiful_joe
          text: >-
            两个人握着拳头，侧着身子往对方跟前挪。那个长着一张淘气脸的男孩捡起装过胡椒的纸，跑过去，对准他们的脸使劲一抖。
        - id: ch02-b11
          speaker: beautiful_joe
          text: >-
            剩下的胡椒足够让他们忘掉打架。两人又咳又呛，嘴里噗噗乱喷，最后和两只狗挤在一起。两个人，两只狗，闹成了一团。
        - id: ch02-b12
          speakers: [boy_3, boy_4]
          ensemble: duo
          text: 喷嚏音乐会！谢谢各位先生。再来一个，再来一个！
          emotion: happy
        - id: ch02-b13
          speaker: beautiful_joe
          text: >-
            其他男孩指着他们大笑。劳拉小姐也没忍住，连我和比利都卷起嘴唇，像是跟着笑了。等他们终于安静下来，她发现所有男孩凑不出一块手帕，便拿出自己柔软的手帕，放进附近一眼清泉里蘸湿，再替这些打喷嚏的家伙一个个擦去眼泪，擦净红肿的眼睛。
        - id: ch02-b14
          speaker: beautiful_joe
          text: 这时，他们心里的火气已经全消了。劳拉小姐要走时，又柔声问他们。
        - id: ch02-b15
          speaker: miss_laura
          text: 以后别再让这两只狗打架了，好吗？
          emotion: calm
        - id: ch02-b16
          speakers: [boy_1, jim_jones]
          ensemble: duo
          text: 当然不会，我们绝对不干了。
        - id: ch02-b17
          speaker: beautiful_joe
          text: >-
            劳拉小姐慢慢走回家。打那以后，这些男孩每次碰见她，都喊她“胡椒小姐”。
    - id: ch03
      title: 威利和两只球
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            到家时，威利正蜷在门厅的窗边看书。他太喜欢读书了，母亲常催他把书放下，跟哥哥们一起出去跑跑。劳拉小姐把手搭在他肩上。
        - id: ch03-b02
          speaker: miss_laura
          text: 我本来还想陪狗狗们玩一会儿球，可现在有点累了。
        - id: ch03-b03
          speaker: willie
          text: 胡说八道，你哪天不说自己累呀。
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            他把她的手甩开。劳拉小姐坐到门厅的椅子上，讲起刚才那场狗斗。威利越听越专心，书也滑到了地板上。等故事讲完，他的口气立刻变了。
        - id: ch03-b05
          speaker: willie
          text: 你每天都这么棒。快去休息吧。
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            威利一把抢过球，叫上我们就往地下室跑，还是没快过劳拉小姐的手臂。她把他搂进怀里，接连亲了好多下。威利是家里最小的孩子，也是全家宠爱的宝贝。他非常爱劳拉小姐，只是跟她说话时，常常比两个哥哥更不耐烦。
        - id: ch03-b07
          speaker: beautiful_joe
          text: >-
            我和威利痛痛快快地玩了一场。劳拉小姐早已用球教会我们各种游戏。她把球抛起来时，我们会跳起去接；我们也会拿球玩捉迷藏，还能追上球，把它稳稳接住。比利会的花样比我更多，最聪明的一样，是独自玩球。
        - id: ch03-b08
          speaker: beautiful_joe
          text: >-
            比利迷球迷得怎么玩都不够。劳拉小姐能陪就陪，可她还要帮母亲做针线活和家务，也要跟父亲上课。她只有十七岁，还在学习。于是，比利会叼着球独自离开。他有时让球在地板上滚，有时把球抛起来，再从楼梯栏杆中间推到下面的门厅。他听见球落地，便跑下去叼回来，再推一次。等他终于玩累了，就把球放到劳拉小姐脚边。
    - id: ch04
      title: 聪明来自慈爱和耐心
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            我和比利还会很多把戏。我们能打喷嚏，能咳嗽，会装死、祷告、倒立、爬梯子，也会念字母表。最后这一样最难，劳拉小姐教了很久。我们面前若没有摆一本书，就绝不开始。等我们盯住书，她才会发出口令。
        - id: ch04-b02
          speaker: miss_laura
          text: 乔，比利，开始念。先念A。
        - id: ch04-b03
          speaker: beautiful_joe
          text: >-
            A是一声细细的尖叫，B响一些，C又更响。有些字母，我们用吠声来念，另一些用低吼。碰到S，我们一定会翻个筋斗。念完Z，就把书推开，在房间里痛痛快快地嬉闹。
        - id: ch04-b04
          speaker: beautiful_joe
          text: 每次有客人来，劳拉小姐让我们表演，他们总会这样夸奖。
        - id: ch04-b05
          speaker: visitor
          text: 这两只狗真聪明，跟别的狗完全不一样。
        - id: ch04-b06
          speaker: beautiful_joe
          text: >-
            其实他们错了。我和比利不比费尔波特街头那些躲躲闪闪、日子悲惨的杂种狗聪明。让我们学会这一切的，全是慈爱和耐心。以前跟着杰金斯时，他认定我是条笨得不得了的狗。要是有人说能教会我东西，他一定会放声嘲笑。那时我阴沉又倔强，只因为挨过太多踢打。只要他肯善待我，我什么都会替他做。
        - id: ch04-b07
          speaker: beautiful_joe
          text: >-
            我喜欢为劳拉小姐和莫里斯太太跑腿，她们也教我和比利在家里帮忙。莫里斯太太不爱爬那三道长楼梯，我们有时便争着替她上楼下楼。
        - id: ch04-b08
          speaker: mrs_morris
          text: 劳拉，请送一块干净抹布下来。乔，你去拿。
        - id: ch04-b09
          speaker: beautiful_joe
          text: 我会高高兴兴地跑上楼。下一件差事就轮到比利。
        - id: ch04-b10
          speaker: mrs_morris
          text: 比利，我把钥匙忘了。去替我拿来。
        - id: ch04-b11
          speaker: beautiful_joe
          text: >-
            后来，我们渐渐记住了各种物品叫什么，也知道它们各自放在哪儿，不等别人领路就能取来。大扫除的日子，我们干得格外卖力，楼上楼下地奔忙，还觉得这是很好玩的游戏。莫里斯太太要是离玛丽太远，没法直接喊她送东西，就把需要的物品名称写在小纸条上，让我们把纸条送过去。
        - id: ch04-b12
          speaker: beautiful_joe
          text: >-
            比利总是负责从邮差手里接过信件，再把每天的晨报送进莫里斯先生楼上的书房。我负责收放洗净的衣服。衣服补好后，莫里斯太太把它们一件件叠好交给我，说出主人是谁，让我分别送到那个人的床上。其实不必说，我凭气味就知道。在狗鼻子里，每个人都有很浓的气味，只是人自己闻不出来。
        - id: ch04-b13
          speaker: beautiful_joe
          text: >-
            莫里斯太太从来不知道，她把劳拉小姐的衣服送给穷人，会给我添多少麻烦。有一次，我沿着劳拉小姐的气味跑遍全城，最后只找到她的一双靴子。靴子已经穿在一个衣衫破烂、坐在街沟里的孩子脚上。
    - id: ch05
      title: 比利的尾巴
      blocks:
        - id: ch05-b01
          speaker: beautiful_joe
          text: >-
            这一章结束前，我还得说说比利的尾巴。人们习惯把猎狐梗的尾巴截短，却不动它们的耳朵。比利来到劳拉小姐身边时还很小，尾巴尚未截过，劳拉小姐也不许别人去截。
        - id: ch05-b02
          speaker: beautiful_joe
          text: 有一天，罗宾逊先生来看比利，一见面就评论起它的模样。
        - id: ch05-b03
          speaker: mr_robinson
          text: 你把它养得很漂亮，可这条尾巴实在太长，把它的样子全毁了。
        - id: ch05-b04
          speaker: beautiful_joe
          text: 小比利正躺在莫里斯太太腿上。她轻轻拍着它，问罗宾逊先生。
        - id: ch05-b05
          speaker: mrs_morris
          text: 你不觉得这只小狗的身体长得很匀称吗？
        - id: ch05-b06
          speaker: mr_robinson
          text: 的确匀称。除了尾巴，它每一处都合乎标准。
        - id: ch05-b07
          speaker: mrs_morris
          text: >-
            既然造物主造出了这么漂亮的小身体，你不觉得他也足够聪明，知道多长的尾巴才和它相称吗？
        - id: ch05-b08
          speaker: beautiful_joe
          text: >-
            罗宾逊先生没有回答。他只是笑着说，莫里斯太太和劳拉小姐都是“怪人”。
