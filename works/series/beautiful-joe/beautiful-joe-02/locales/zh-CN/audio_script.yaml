audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔忠诚，语气轻缓
        timbre: 柔和成熟
        pace: 舒缓
        pitch: 中
    jenkins:
      display_name: 詹金斯
      tts:
        delivery: 粗暴冷酷，话语短促
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二章　残忍的送奶人
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我说过，詹金斯大部分日子都闲着。可为了让客人吃早饭时有牛奶，他得在天还没亮的时候出门。冬天一早，他走进马厩，那副样子总是凶得吓人。他先挂好提灯，拿来挤奶凳。奶牛没有正好照他的意思让路，他就抓起扫帚或草叉，狠狠地打。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            我和母亲睡在马厩角落的草堆上。她每天一听见詹金斯的脚步，就马上叫醒我。等门一开，我们便赶紧往外跑。他总要朝我们踢一脚，好在母亲早已教会我怎么闪开。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            牛奶挤好以后，他把一桶桶奶送进屋，让詹金斯太太滤过，再灌进奶罐。接着，他回来把马套上车。那匹马叫托比，已经被折磨得不成样子了。它的膝腿没有力气，腰背也没有力气，浑身都很虚弱。詹金斯得一路打它，才能逼它走下去。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            托比从前拉过出租马车。缰绳在它嘴里猛扯、扭绞、来回磨，换作别的马，嘴巴大概早就没有知觉了。可冬天早晨，詹金斯把冻得冰冷的嚼子塞进去，我还是会看见托比疼得缩起来，连嘴唇都卷着。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            可怜的老托比！我躺在稻草上时常常想，它怎么能忍住不叫呢？整个冬天，它又冷又饿，身上还常有裂开的伤口。詹金斯会往挽具下面塞几块布，把伤遮住。托比却从来不出声，更不会踢人咬人。詹金斯刚说一个字，它就照办。他一骂，托比便赶紧退后，或是马上往前走。它太想让主人满意了。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            套好车，装上奶罐，詹金斯就去送奶。母亲名叫杰丝，她每次都会跟去。我总问她，为什么要跟着这么一个残忍的人。
        - id: ch01-b07
          speaker: mother
          text: 我们停在别人家门口时，我有时候能得到一根骨头。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            她说完总会低下头。可我知道，骨头不是全部的原因。她很喜欢詹金斯，只想陪在他身边。我没有母亲那样温柔又能忍耐，怎么也不肯跟着去。我看她走到再也望不见了，才跑去屋前，看看詹金斯太太能不能给我一点剩饭。她可怜我，差不多总会扔些食物给我，也常给我一句温和的话，或是一个亲切的眼神。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            詹金斯回来后，我常请母亲陪我出去转转，见见邻居家的狗。她不肯走，我也不愿丢下她。我们只好从早到晚悄悄躲着詹金斯，尽量不让他碰见，又不敢让他离开视线。他总叼着烟斗，双手插在口袋里，慢吞吞地四处晃。骂完妻子和孩子，又来骂那些不会说话的动物。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            还有一件事，我一直没有说。那就是我的兄弟姐妹后来怎么了。我们刚满八个星期时，有一天下着雨。詹金斯带着两三个衣服破烂、身上肮脏的孩子走进马厩，盯着我们看。他嫌我们太丑，边骂边说，要是长得好看些，说不定还能卖掉几只。母亲不安地看着他。她怕孩子们要出事，立刻跳到我们中间，抬起头求他放过我们。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            可她的哀求只让詹金斯骂得更凶。他一只只抓起小狗，当着自己孩子和母亲的面，把它们全杀了。他抓住几只小狗的腿，把它们往厩栏上猛撞，直到脑浆迸出来。剩下的，他用草叉杀死。母亲痛苦地尖叫，在马厩里跑来跑去。我软弱地趴着，浑身发抖，时时刻刻都以为下一个就是我。我不知道他为什么没有杀我。兄弟姐妹中，只有我活了下来。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            詹金斯的孩子哭了。他把孩子们赶出去，自己也离开了。母亲叼回每一只小狗，把它们放进我们的草窝。她不停地舔，想叫它们重新活过来，可怎么也没有用，它们已经死了。母亲让它们在角落里躺了好几天。后来詹金斯发现了，又恶狠狠地咒骂我们。他用草叉把小狗的尸体挑到院子里，只往上盖了一点土。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            从此，母亲完全变了。她身体虚弱，活得痛苦。明明才四岁，看起来却已经老了。她一直没有吃过像样的食物，再也跑不动，也不能跟着詹金斯去送奶。她只躺在我们的草堆上。我带回吃的，她也只是用鼻子翻一翻。有一天，她轻轻地舔了我一下，摇摇尾巴，就死了。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            我守在她身边，又孤单，又难过。这时候，詹金斯进了马厩。我不愿看他。母亲就是被他害死的。她瘦小的身体躺在那里，只剩下一把骨头，身上全是伤疤。她受尽折磨，又活活挨饿，终于死了。她半张着嘴，眼睛直直地望着前面。从今以后，她不会再温柔地看我，也不会在夜里蜷到我身旁，为我取暖了。我恨透了这个杀死她的人。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            可我仍旧安静地坐着。詹金斯走过去，用脚把母亲翻过来，看看她是不是真的死了。我还是没动。他大概有一点点难过吧，因为他转过来，轻蔑地看着我。
        - id: ch01-b16
          speaker: jenkins
          text: 她一条抵得上你两条。怎么死的偏偏不是你？
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            我继续忍着。可他走到我面前，又抬脚来踢。我的心已经快碎了，再也忍不下去。我扑向他，死死咬住他的脚踝。
        - id: ch01-b18
          speaker: jenkins
          text: 哈！你还敢跟我斗，是不是？看我怎么收拾你。
          emotion: angry
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            他气得满脸通红，一把揪住我的后颈，把我提到院子里。地上放着一截木头。
        - id: ch01-b20
          speaker: jenkins
          text: 比尔，把斧头拿来。
          emotion: angry
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            他把我的头按在木头上，另一只手死死压住我。我拼命挣扎，可那时已经一岁，是一条长成的大狗了。忽然，一阵尖锐又可怕的疼痛穿过身体。他砍掉了我的一只耳朵。那不是给小狗剪耳朵的做法。他贴着我的头下手，连耳朵外面的一块皮都砍了下来。接着是另一只耳朵。然后，他猛地转过我的身体，紧贴着身子砍掉了我的尾巴。
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            这才放开我。他站在旁边，看着我在地上翻滚，看着我疼得不停惨叫。他正怒得发狂，根本没有想到，走在大路上的人也许会听见我的声音。
