audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    mother:
      display_name: Mother
      tts:
        delivery: gentle and devoted
        timbre: soft and mature
        pace: unhurried
        pitch: medium
    jenkins:
      display_name: Jenkins
      tts:
        delivery: harsh and bullying
        timbre: rough and heavy
        pace: abrupt
        pitch: low
  chapters:
    - id: ch01
      title: THE CRUEL MILKMAN
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I have said that Jenkins spent most of each day doing nothing. Still, he had to rise very early so his customers could have milk with breakfast. On cold winter mornings, before sunrise, he would come into the stable in an ugly temper. He hung up his lantern and fetched his milking stool. If the cows did not move exactly where he wanted them, he grabbed a broom or a fork and beat them cruelly.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Mother and I slept on a pile of straw in one corner. Whenever she heard Jenkins coming, she woke me. The moment he opened the stable door, we ran outside. He always tried to kick us as we passed, but Mother had taught me how to jump out of his way.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            When the milking was done, Jenkins carried the pails to the house. Mrs. Jenkins strained the milk and poured it into the cans. Then he returned to harness his horse to the cart.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            The horse was named Toby. Poor Toby was worn out and miserable. His knees were weak, his back was weak, and there seemed to be no strength anywhere in him. Jenkins beat him constantly to make him move. Toby had once pulled a cab. People had yanked and twisted the bit in his mouth so much that you might think he could no longer feel it. But I saw him flinch and draw back his lip when Jenkins pushed the icy bit into his mouth on a winter morning.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            Poor old Toby. Sometimes I lay on my straw wondering why he did not cry out. All winter, he was cold and half starved. Raw sores often covered his body, and Jenkins tried to hide them by slipping pieces of cloth beneath the harness. Yet Toby never complained. He never kicked or bit. He obeyed the smallest command. If Jenkins cursed him, Toby stepped back or hurried forward at once, because he wanted so badly to please.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Once Toby was hitched up and the cans were loaded, Jenkins started his route. My mother's name was Jess, and she always followed him. I used to ask why she went with such a brutal man.
        - id: ch01-b07
          speaker: mother
          text: Sometimes one of the houses gives me a bone.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            She would lower her head when she answered, because that was not the whole reason. She loved Jenkins and wanted to stay near him.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            I was not as sweet or patient as Mother, so I refused to go. After watching her disappear down the road, I ran to the house to see whether Mrs. Jenkins had saved me any scraps. She usually had. She pitied me, and along with the food she tossed my way, she often gave me a kind look or a gentle word.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            When Jenkins returned, I often tried to persuade Mother to come meet the neighbors' dogs with me. She never would, and I would not leave her. From morning until night, we crept around trying to stay out of Jenkins's way while still keeping him where we could see him. He wandered about with a pipe between his lips and his hands in his pockets. First he growled at his wife and children, then at the animals that could not answer him.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            I have not yet told you what happened to my brothers and sisters. We were eight weeks old when Jenkins came into the stable on a rainy day. Two or three of his ragged, dirty children trailed after him. He looked us over, then began to curse because we were so ugly.
        - id: ch01-b12
          speaker: jenkins
          text: If those pups had been good-looking, I might have sold a few of them.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            Mother knew her puppies were in danger. She rushed into the middle of us and looked up at him, begging with her eyes. That only made him curse harder.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Right there in front of his children and my frantic mother, Jenkins killed my brothers and sisters one after another. He caught some by the legs and struck them against the stalls until their brains were dashed out. He killed the others with a fork. It was terrible. Mother raced back and forth through the stable, screaming in pain. I lay there weak and shaking, certain that I would be next. I do not know why he spared me. When it was over, I was the only puppy left alive.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            His children cried. Jenkins ordered them out, then left the stable himself. Mother gathered up every puppy and carried them back to our nest in the straw. She licked them and tried to make them live again, but nothing could help them. They were dead.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            For several days, she kept them with us in our corner. Then Jenkins found them. He cursed us horribly, lifted them with his stable fork, and threw them into the yard. He covered them with a little earth.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Mother was never the same afterward. She became weak and wretched. Though she was only four years old, she looked like an old dog because she had been fed so poorly. She no longer had the strength to follow Jenkins. She stayed on our straw and merely pushed the scraps I brought her with her nose. Then, one day, she licked me softly, wagged her tail, and died.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            I sat beside her, lonely and miserable, when Jenkins entered the stable. I could not bear to look at him. He had killed my mother. Her small, thin body lay there, covered in scars. He had starved and tormented her until she died. Her mouth hung partly open, and her eyes stared ahead. She would never look kindly at me again. She would never curl around me at night and keep me warm. How I hated the man who had murdered her.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Even so, I sat without moving as Jenkins walked over and rolled her with his foot to make sure she was dead. I think he felt a little sorry, though he only turned toward me with a scornful look.
        - id: ch01-b20
          speaker: jenkins
          text: She was worth twice what you are. Why couldn't you have died instead?
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            I still held myself quiet. Then he came closer and kicked at me. My heart was nearly broken, and I could endure no more. I sprang at him and bit his ankle as hard as I could.
        - id: ch01-b22
          speaker: jenkins
          text: >-
            Oh, so you mean to fight me, do you? I'll take care of that.
          emotion: angry
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            His face burned red with fury. He grabbed the back of my neck and carried me into the yard, where a log lay on the ground.
        - id: ch01-b24
          speaker: jenkins
          text: Bill, bring me the hatchet.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            Jenkins forced my head onto the log and held my struggling body down with one hand. By then, I was a year old and fully grown. A quick, dreadful pain tore through me as he cut off one ear. This was not the way people cropped a puppy's ears. He cut close against my head and took some skin with it. Then he cut off my other ear. He spun me around and cut my tail off close to my body.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            At last, he released me. I rolled across the ground, yelping in agony, while he stood and watched. His rage was so great that he never thought about the people passing on the road who might hear my cries.
