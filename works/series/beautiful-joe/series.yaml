cover_prompt: |-
  A wordless cover scene in a leafy Maine garden in the 1890s shows a medium-sized brown dog, visibly missing his ears and tail but healthy and alert, standing close beside a compassionate teenage girl. The girl has a gentle face, practical brown hair, and a modest cream blouse with a long blue skirt, and she bends to rest one reassuring hand on the dog's shoulder. Around them, a dignified large dog, a tiny fox terrier, a queer-looking gray cat, and a gray parrot with a few red tail feathers gather peacefully near the veranda of a welcoming wooden family home. The brown dog lifts one paw toward the girl, making their bond and his trust the clear focal action. Use a calm, child-height three-quarter view with the pair large in the lower center, the animals forming a loose arc, and broad uncluttered room among sunlit leaves and pale sky at the top. Keep the animals anatomically believable, the clothing and house faithful to late-nineteenth-century New England, and the mood warm, hopeful, and entirely non-frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
