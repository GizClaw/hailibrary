  chapters:
    - id: ch01
      title: OUR JOURNEY TO RIVERDALE
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Every other summer, the Morris children went away to the country for fresh air and a chance to learn what country life was like. There were so many children in the family that they usually scattered in different directions. The summer after I joined them, Jack and Carl went to stay with an uncle in Vermont. Ned and Willie visited an unmarried aunt who lived in the White Mountains, and Miss Laura was bound for another uncle's home in New Hampshire. Mr. and Mrs. Morris stayed behind in Fairport. It was a lovely place in summer, and many people came there to visit.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            The children took some pets along and left the others with their mother. Mrs. Morris only let an animal go where she knew it would be truly welcome.
        - id: ch01-b03
          speaker: mrs_morris
          text: >-
            Never let your pets become a burden to other people. If you do, they may come to dislike both the animals and you.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Miss Laura left before the others because the spring had worn her down. She looked pale and thin when we set out early in June. I say “we” because after my trouble with Jenkins, she had promised never to be parted from me. If someone invited her but would not welcome me, she would stay home.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The whole family came to the station. A chain was fastened to my collar, and two tickets were bought for me. One hung from my collar while Miss Laura kept the other in her purse. Then I was chained in a corner of the baggage car. Mr. Morris said the journey was too short to make an express ticket worthwhile.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            The station was full of whistles, rushing feet, and terrible confusion. Men flung baggage into my car so quickly that I feared a box or trunk would fall on me. Miss Laura stood at the door watching me for a few minutes. Soon the men piled the luggage so high that she could no longer see me, and she had to go. Before Mr. Morris left, he asked one of the men to keep me from getting hurt. I heard money rattle as he spoke.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            It was only the beginning of June, but the weather had turned suddenly hot after a long, cold spring. None of us had grown used to the heat, and I found it very hard to bear. Before the train started, the baggage-car doors were closed, shutting me into darkness. Then we began rushing along. The heat, the stale smell of the closed car, the noise, and the blackness together made me sick with fear. I did not dare lie down. I stayed sitting upright, trembling and wishing with all my heart that we would soon reach Riverdale Station.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            My thoughts went to other animals who had traveled by train. In February, the Drurys' Newfoundland watchdog, Pluto, had come from New York. He told Jim and me how miserable the journey had been. Mr. Drury's friend had seen Pluto chained in the baggage car, then tipped the baggage master well and gone back to his own Pullman car.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            According to Pluto, that baggage master had a very red nose. At every station he found a drink for himself, but he never once brought Pluto food or water. That went on from New York all the way to Fairport. The instant Pluto's chain was unfastened, he sprang onto the platform and nearly knocked Mr. Drury over. Then he saw some snow that had sifted through the station roof. He was so thirsty that he licked up every bit. When the snow was gone, he jumped up and licked the frost from the windows.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Mr. Drury's friend was furious when he found the baggage master.
        - id: ch01-b11
          speaker: drury_friend
          text: >-
            Why did you keep coming into my car and telling me the dog had been fed, watered, and kept comfortable? I am going to report you.
          emotion: angry
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            He complained at the station office and learned that the man drank too much and was going to be dismissed.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            Our own trip would take only a few hours, so I did not expect to suffer as Pluto had. I noticed that the train slowed before each station. When it slowed again, I thought we had finally reached Riverdale. We had not. The car jolted, a crash sounded ahead, and the train stopped.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Men shouted and ran back and forth outside while my car stayed dark and still. No one came in to tell me what had happened. As the noise continued, I knew something had gone wrong with the train. Then a worse thought came to me. Perhaps Miss Laura had been hurt. Something must have happened to her, or surely she would have come to find me.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            I barked again and again. I pulled so hard at my chain that my collar made my neck sore. Still no one opened the door. The men running around outside must have heard me, yet I remained alone for such a long time that it seemed the middle of the night must have come. I could not understand them. Whenever I hear a man in trouble and crying for help, I go to him and find out what he needs.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            At last, the far door opened and a man peered inside.
        - id: ch01-b17
          speaker: baggage_man
          text: >-
            This baggage is all going through to New York, miss. They would never have put your dog in here.
        - id: ch01-b18
          speaker: miss_laura
          text: >-
            But they did. I know this is the car. Please get him out. He must be terribly frightened.
          emotion: fearful
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            The man bent down and freed me, grumbling that I should have been in another car. Then he gave me a kindly pat.
        - id: ch01-b20
          speaker: baggage_man
          text: Some people toss a dog around as if he were a lump of coal.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            I was nearly wild with joy at finding Miss Laura. But all that barking and pulling against my collar had taken away my voice. I pressed close, wagged my whole body, and opened my mouth again and again. No sound came. Miss Laura tried to laugh and cry at once. Then she bit her lip.
        - id: ch01-b22
          speaker: miss_laura
          text: Oh, Joe, please don't.
        - id: ch01-b23
          speaker: baggage_man
          text: Has he lost his bark?
          emotion: surprised
        - id: ch01-b24
          speaker: miss_laura
          text: >-
            It is wicked to shut an animal inside a dark, closed car.
          emotion: angry
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            Through her tears, she struggled to find the steps. The man reached out to help her down.
        - id: ch01-b26
          speaker: baggage_man
          text: >-
            He has not suffered too badly, miss, so try not to upset yourself. I used to be a brakeman on a Chicago train. If you had seen the animals brought in for the stockyards, then you could talk about cruelty. Cars meant for a certain number of pigs, sheep, or cattle were packed with twice that many. When they were unloaded, half might be choked or smothered to death. Once I saw a man running up and down, raging and swearing because the railway workers had refused to let him get into the car and tend his pigs along the way.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Miss Laura turned very pale.
        - id: ch01-b28
          speaker: miss_laura
          text: Does that still happen now?
          emotion: fearful
        - id: ch01-b29
          speaker: baggage_man
          text: >-
            No, no. Things are better now. There are new rules about caring for livestock while it is being transported. But remember, miss, the railways are not the only place where animals are treated cruelly. A great many silent creatures are suffering all around us, everywhere. If they could speak and tell what had happened to them, plenty of people besides railway men would have to answer for their conduct.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            He lifted his cap and hurried away. Looking deeply troubled, Miss Laura picked her way past scraps of coal and wood into the little station's waiting room. She held water from the filter in her hand so I could lap it. Then she sat down. I rested my head against her knees while she gently stroked my throat.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Several people sat around the waiting room, and their talk told me what had happened. A freight train had waited on a side track for us to pass. After it moved on, the switchman carelessly left the switch open. When our train arrived, it followed the wrong track and crashed into the freight train instead of pulling up beside the platform. If we had been traveling quickly, the damage could have been terrible. Because we were moving slowly, no such disaster followed. Even so, our engine was smashed too badly to continue, the passengers had been frightened, and we faced a tiresome wait for another engine to take us to Riverdale. Right after the crash, the trainmen were so busy that Miss Laura could find no one willing to release me.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            An old gentleman across the room kept staring at us. He reminded me of a poodle, with bright brown eyes, a pointed face, and a shock of white hair that he shook every few minutes. His hands rested on top of his cane. At last, he jumped up, sat beside Miss Laura, and pointed at me.
        - id: ch01-b33
          speaker: old_gentleman
          text: That is an ugly dog.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Many young ladies would have taken offense, but Miss Laura only looked amused.
        - id: ch01-b35
          speaker: miss_laura
          text: He looks beautiful to me.
        - id: ch01-b36
          speaker: old_gentleman
          text: >-
            Hmm. That is because he belongs to you. What is wrong with him?
        - id: ch01-b37
          speaker: miss_laura
          text: >-
            This is his first train journey, and he is a little frightened.
        - id: ch01-b38
          speaker: old_gentleman
          text: >-
            No wonder. Only the Lord knows how much animals suffer while being transported. My dear young lady, if you had seen what I have seen, you would never eat another piece of meat.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Miss Laura frowned uncertainly.
        - id: ch01-b40
          speaker: miss_laura
          text: I have heard something about it. It must be terrible.
        - id: ch01-b41
          speaker: old_gentleman
          text: >-
            Terrible? It is awful. Think of cattle on the western plains, choking with thirst in summer and starving or freezing in winter. Their horns are cut off, and they are goaded onto trains and steamers. During voyages they are tossed around, wounded, and left to suffer. Many die and are thrown into the sea. Others reach land sick and terrified. Some are slaughtered right on the docks so they will not drop dead where they stand. What sort of food can their flesh make after all that? It is poison. Three people in my family have died of cancer. I am a vegetarian.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            He sprang up and paced the room. I was glad he moved away, because Miss Laura could not bear stories of cruelty. Her tears fell thickly onto my brown coat. The old gentleman had spoken so loudly that everyone had listened. A very young man with a cold, handsome face seemed annoyed that he had made her cry.
        - id: ch01-b43
          speaker: young_man
          text: >-
            Sir, don't you think there is a great deal of false feeling in all this concern for animals? They were made for us. They must suffer and die to meet our needs. If we did not kill cattle, sheep, and other animals, they would cover the earth.
        - id: ch01-b44
          speaker: old_gentleman
          text: >-
            I will grant your point if you remove the word “suffer.” The Lord made sheep, cattle, and pigs. They are his creatures as surely as we are. We may kill them, but we have no right to make them suffer.
        - id: ch01-b45
          speaker: young_man
          text: But we cannot prevent it, sir.
        - id: ch01-b46
          speaker: old_gentleman
          text: >-
            Yes, we can. People can raise healthy animals, treat them kindly, kill them mercifully, and eat them properly. When people do that, I will stop being a vegetarian. You are only a boy, and you have not traveled as I have. I have gone from one end of this country to the other. I have traveled north, south, and out west. Wherever I went, I saw things that made me shudder. I tell you, if this great nation does not change the way it treats the helpless animals placed in its care, the Lord will punish it.
          emotion: angry
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            The young man fell silent and looked thoughtful. Then a sweet-faced old lady nearby answered. I had never seen a finer-looking old lady. Her hair was snowy white and her face deeply wrinkled, but she was tall and stately, with an expression as pleasant as Miss Laura's.
        - id: ch01-b48
          speaker: old_lady
          text: >-
            I do not believe ours is a wicked nation. We are younger than many nations, and I think a great many of our sins come from ignorance and thoughtlessness.
        - id: ch01-b49
          speaker: old_gentleman
          text: Yes, madam. On that point, I agree with you.
        - id: ch01-b50
          speaker: old_lady
          text: >-
            I have traveled too, and I have spoken with many wise and good people about the cruel treatment of animals. I have found that many of them had never considered it at all. They would never knowingly harm a helpless creature themselves. When someone tells them stories of inhuman conduct, they are astonished. They say such things surely cannot exist. You see, they have never come face to face with them. But as soon as they learn the truth, they begin to protest. They insist that the cruelty must stop, and then they ask where the remedy lies.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            The impatient old gentleman scraped his foot against the floor.
        - id: ch01-b52
          speaker: old_gentleman
          text: And what remedy would you suggest, madam?
        - id: ch01-b53
          speaker: old_lady
          text: >-
            I would offer the same remedy that I propose for the great evil of drunkenness. Laws and education. We need laws for those who are old and hardened, and education for those who are young and tender. I would tell schoolboys and schoolgirls that alcohol can destroy the very framework of their beautiful bodies. And I would teach them that cruelty toward any one of God's living creatures can blight and destroy their innocent young souls.
        - id: ch01-b54
          speaker: young_man
          text: >-
            Don't temperance workers and humane people expect too much from teaching children noble ideas? The human heart will always be wicked. Your Bible says so, does it not? Education cannot drive every bit of badness from a child.
        - id: ch01-b55
          speaker: old_lady
          text: >-
            We do not expect to drive out every bit of badness. But if the human heart is so desperately wicked, shouldn't that make us even more eager to educate it, lift it up, and hold it back from evil? I can only speak from my own experience, and I have lived in this wicked world for seventy-five years. The human heart may be cruel and wicked, as you say, but it still has soft and tender places. The impressions made upon it in childhood are never erased. Tell me, what do you remember better than anything else? Standing at your mother's knee, feeling the pressure of her hand, and her kiss upon your forehead?
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            Just then, our new engine arrived. A whistle blew, and nearly everyone rushed from the room. The impatient old gentleman was among the first. Miss Laura struggled with the strap around her shawl while I stood wishing I could help. Only the old lady and young man remained nearby, and we could not help hearing them.
        - id: ch01-b57
          speaker: young_man
          text: >-
            Yes, I remember. My mother is dead now. I have no mother.
          emotion: sad
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            His voice thickened and his face turned red. The old lady rose beside him. She was taller than he was, and she placed one hand on his shoulder.
        - id: ch01-b59
          speaker: old_lady
          text: >-
            Poor boy. May God bless you. I know your heart is kind. I have four strong sons, and you remind me of the youngest. If you ever come to Washington, please visit me.
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            She told him her name and invited him to call on her if he ever came to Washington. The young man lifted his hat and looked astonished when he discovered who she was. Then he went away too. The old lady turned at once to Miss Laura, who was still struggling with the shawl strap.
        - id: ch01-b61
          speaker: old_lady
          text: May I help you, my dear?
        - id: ch01-b62
          speaker: miss_laura
          text: Yes, please. I cannot fasten this strap.
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            The old lady secured the bundle in moments, and we hurried happily to the train. Riverdale was only a few miles away, so the conductor let me ride in the passenger car with Miss Laura. She spread her coat over the seat across from her. I sat on it and watched a lovely country sweep past the window, green and fresh in the June sunshine. This car was bright, airy, and pleasant. It was nothing like that closed baggage car. Nothing frightens an animal more than being unable to see where it is going or know what will happen next. In that way, I think animals are very much like people.
        - id: ch01-b64
          speaker: beautiful_joe
          text: >-
            The old lady sat beside Miss Laura and gazed through the window. Then she softly recited two lines.
        - id: ch01-b65
          speaker: old_lady
          text: >-
            What is so rare as a day in June? Then, if ever, come perfect days.
        - id: ch01-b66
          speaker: miss_laura
          text: >-
            That is very true. It seems sad that autumn and the cold winter must come.
          emotion: sad
        - id: ch01-b67
          speaker: old_lady
          text: >-
            No, my dear, it is not sad. They are only preparing the way for another summer.
          emotion: calm
        - id: ch01-b68
          speaker: miss_laura
          text: >-
            Yes, I suppose they are. You seem to love animals very much.
        - id: ch01-b69
          speaker: old_lady
          text: >-
            I do, my dear. I have four horses, two cows, a tame squirrel, three dogs, and a cat.
        - id: ch01-b70
          speaker: miss_laura
          text: You must be a happy woman.
          emotion: happy
        - id: ch01-b71
          speaker: old_lady
          text: >-
            I believe I am. And I must not forget Diego, my horned toad from California. He lives in the greenhouse, where he happily catches flies. Whenever anyone comes near, he holds up his horned head to be scratched.
        - id: ch01-b72
          speaker: miss_laura
          text: I cannot understand how anyone can be cruel to animals.
        - id: ch01-b73
          speaker: old_lady
          text: >-
            Neither can I, my dear child. Seeing a helpless animal tortured has always caused me terrible pain. Nearly seventy years ago, when I was a little girl walking through the streets of Boston, I would tremble and grow faint when drivers abused overloaded horses. I was timid then, and I did not dare speak to those men. Again and again, I ran home in tears and threw myself into my mother's arms. I begged her to tell me whether nothing could be done to help those poor animals.
        - id: ch01-b74
          speaker: old_lady
          text: >-
            My mother meant to be kind, so she tried to put the whole subject out of my mind. She carefully guarded me from every sight and story of cruelty. But hiding the truth from me did nothing for the animals. They continued to suffer just the same. When I grew into a woman, I looked back and understood my own cowardice. I began raising the matter among my friends. I told them that helpless creatures everywhere were groaning together in pain, and that they would continue to groan unless merciful people were willing to step forward and help them.
        - id: ch01-b75
          speaker: old_lady
          text: >-
            I was able to help form several societies for the prevention of cruelty to animals, and they have done good work. They have served the horses and cows, but they have also served the nobler animal, man. Suppose we tell a cruel man that he may not overwork, torture, injure, or kill his animal. Suppose we insist that he provide proper food and shelter. By doing that, I believe we bring him a little nearer to the kingdom of heaven than he was before.
        - id: ch01-b76
          speaker: old_lady
          text: >-
            A person reaps what he sows. If he plants seeds of cruelty toward people and animals, no one knows how dark the harvest may become. The poor horse that trembles beneath a blow is not the only one who suffers. The person who strikes it is harming himself as well. If only people understood that their own unkind deeds return upon their heads with ten times the force. But listen to me, my dear child. I have begun talking as though I were addressing a drawing-room meeting, and here we are at your station. Goodbye. Keep your happy face and your gentle ways. I hope we meet again someday.
        - id: ch01-b77
          speaker: beautiful_joe
          text: >-
            She pressed Miss Laura's hand and gave me a final pat. A moment later, we stood on the Riverdale platform while she smiled at us through the train window.
