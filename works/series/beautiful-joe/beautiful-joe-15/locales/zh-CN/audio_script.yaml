audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 慈爱持重，管教孩子时干脆明白
        timbre: 温和饱满
        pace: 适中
        pitch: 中
    drury_friend:
      display_name: 德鲁里先生的朋友
      tts:
        delivery: 正直爽快，动怒时严厉有力
        timbre: 成熟清朗
        pace: 适中
        pitch: 中
    baggage_man:
      display_name: 行李员
      tts:
        delivery: 阅历丰富，言语直率而不失善意
        timbre: 粗厚朴实
        pace: 适中
        pitch: 中低
    old_gentleman:
      display_name: 白发老先生
      tts:
        delivery: 激烈急切，谈起动物苦难时义愤难平
        timbre: 尖锐而有穿透力
        pace: 稍快
        pitch: 中高
    young_man:
      display_name: 年轻男子
      tts:
        delivery: 起初冷静质疑，后来流露压抑的柔软
        timbre: 清冷结实
        pace: 适中
        pitch: 中
    old_lady:
      display_name: 白发老太太
      tts:
        delivery: 慈祥庄重，劝说时温和而笃定
        timbre: 柔和醇厚
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 第十五章　我们的河谷之旅
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            每隔一年夏天，莫里斯家的孩子们都要去乡下换换空气，也看看乡间怎样生活。兄弟姐妹太多，他们通常分头去。我来到这个家的第二年夏天，杰克和卡尔去了佛蒙特州的一位叔叔家，劳拉小姐去新罕布什尔州拜访另一位叔叔，内德和威利则去怀特山看望一位没有结婚的姑妈。莫里斯夫妇留在了费尔波特。那里的夏天很美，来消夏的人也很多。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            孩子们随身带走几只宠物，其余的便留在家里，交给母亲照料。除非确定人家真心欢迎，莫里斯太太绝不许他们把宠物带去做客。
        - id: ch01-b03
          speaker: mrs_morris
          text: 别让宠物给人家添麻烦。要不然，人家会连它们带你们一起讨厌。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            劳拉小姐整个春天身体都不好，精神一天天衰弱，脸色苍白，人也瘦了，所以六月初便比其他人先出发。我当然和她一起走。自从詹金斯那件事以后，她说再也不跟我分开。谁请她去做客却不肯接纳我，她就宁愿留在家里。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            全家人都到车站送我们。他们在我的项圈上扣好链子，领我去行李房，又替我买了两张票。一张系在项圈上，另一张收进劳拉小姐的钱包。随后，我被送进行李车，锁在一个角落里。我听见莫里斯先生说，路程不远，不值得再替我买一张快运票。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            车站里又吵又乱，汽笛一声接一声，人群在站台上奔来奔去。几个男人飞快地往我待的车厢里扔行李，我生怕哪一件会砸到身上。劳拉小姐起先还站在门边看我，可箱笼和皮箱越堆越高，很快把我完全挡住了，她只能离开。莫里斯先生嘱咐一个人照看我，别让我受伤。我听见几声钱币叮当响。随后，他也走了。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            那年春天又长又冷，六月初却突然热起来。我们还没习惯这样的暑热，觉得格外难熬。火车出发以前，行李车的门便关上了，里面顿时黑得厉害。列车一路飞驰，黑暗、闷热和污浊的气味，再混着震耳的声响，弄得我又恶心又害怕。我不敢躺下，只坐在那里不停发抖，盼望快点到河谷车站。可河谷迟迟不到，还有一场更大的惊吓等着我。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            我想起自己听过的那些动物乘车的故事。二月里，德鲁里家的纽芬兰看门犬普鲁托从纽约来到费尔波特。他告诉我和吉姆，那一路苦极了。德鲁里先生的一位朋友把他从纽约带来，亲眼看着他被锁在行李车里，又给了行李员一笔可观的小费，请对方好好照料，这才回到自己的普尔曼客车。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            普鲁托说，那个行李员鼻子通红，每次停车都给自己弄酒喝，却从纽约到费尔波特都没给他一口水，也没给一点食物。到了费尔波特，链子刚解开，他便冲上站台，差点撞倒德鲁里先生。他看见车站屋顶缝隙漏下来一点雪，渴得立刻舔光了。雪没了，他又跳起来舔窗玻璃上的霜。
        - id: ch01-b10
          speaker: drury_friend
          text: >-
            你每隔几小时就来告诉我，狗吃过了、喝过了，待得很舒服。这算什么意思？我要告发你。
          emotion: angry
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            他到车站办事处投诉，那里的人告诉他，这个行李员酗酒，很快就会被开除。我倒不怕吃同样的苦，毕竟去河谷只要几个小时。我发现列车每次进站前都会慢下来。后来车速又渐渐放缓，我以为旅程终于到了尽头。不料那里并非河谷。车厢猛地一颠，前方轰然巨响，列车停住了。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            外面有人大喊，还有脚步来回奔跑。行李车里却黑沉沉、静悄悄的，一个人也不进来。我知道火车出了事。劳拉小姐也许受伤了。她若没事，一定会来找我。我拼命吠叫，一次次拉扯链子，直到脖子疼得受不了。很久很久，我始终独自待在那里。外面跑来跑去的人准能听见我。换作我听见谁遇险呼救，一定会过去看看他需要什么。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            时间长得叫我以为已经到了半夜。终于，车厢尽头的门打开了，一个男人探头进来，朝门外的劳拉小姐说话。
        - id: ch01-b14
          speaker: baggage_man
          text: 小姐，这里全是直运纽约的行李。他们不会把您的狗放在这儿。
        - id: ch01-b15
          speaker: miss_laura
          text: >-
            他们真的放进来了，我肯定就是这节车厢。请您把他放出来好吗？他一定吓坏了。
        - id: ch01-b16
          speaker: beautiful_joe
          text: 男人俯下身替我解开链子，嘴里还在嘟囔，埋怨他们没有把我放进另一节车厢。他又亲切地拍了拍我。
        - id: ch01-b17
          speaker: baggage_man
          text: 有些人搬弄一条狗，就跟扔一块煤似的。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            我终于又回到劳拉小姐身边，欢喜得快要发狂。可先前叫得太久，又把脖子使劲压在项圈上，嗓音已经完全消失。我依偎着她，浑身摆来摆去，嘴巴一张一合，却一点动静也没有。劳拉小姐见了越发慌乱。她又想笑又想哭，最后用力咬住嘴唇。
        - id: ch01-b19
          speaker: miss_laura
          text: 啊，乔，别这样。
        - id: ch01-b20
          speaker: baggage_man
          text: 他叫不出声了，是不是？
        - id: ch01-b21
          speaker: miss_laura
          text: 把动物关在又黑又封闭的车厢里，实在太狠心了。
        - id: ch01-b22
          speaker: beautiful_joe
          text: 她含着泪，摸索着往车厢的台阶下走。那个男人连忙伸出手扶住她。
        - id: ch01-b23
          speaker: baggage_man
          text: >-
            他没受多少苦，小姐，别太难过。几年前我在开往芝加哥的火车上当制动员，见过送往牲畜市场的动物，那才叫残忍。本来只能装一定数量猪、羊或牛的车厢，偏偏要硬塞进两倍。等到卸车，一半都活活挤死、闷死了。我还见过一个养猪人沿着列车来回奔跑，又急又气地大骂，因为铁路上的人不许他在路途中进去照料自己的猪。
        - id: ch01-b24
          speaker: miss_laura
          text: 如今还是这样吗？
        - id: ch01-b25
          speaker: baggage_man
          text: >-
            不，不，现在好多了，也有了照料牲畜的新规矩。不过虐待动物的事不只发生在铁路上。到处都有不会说话的生灵在受苦。它们要是能开口，除了铁路上的人，还有不少人的所作所为也会很不好看。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            他掀了掀帽子，匆匆沿站台走远。劳拉小姐满脸忧色，小心绕开散落在站台上的煤块和木片，领我进了小车站的候车室。她把我带到滤水器旁，让水流进自己手里，再捧给我舔。随后她坐下来，我把头靠在她膝上，她轻轻抚摸我的喉咙。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            听了屋里人的议论，我才知道，一列货车原先停在车站侧线上，等我们的火车通过。货车驶过以后，粗心的扳道工却把道岔留着没关。我们的火车随后到来，本该驶到站台旁边，结果一头撞上了货车。幸好当时车速不快，不然会酿成大祸。即便如此，机车也撞得再不能走，乘客都受了惊。大家只能苦等另一台机车来接我们去河谷。事故发生后，列车员忙得团团转，劳拉小姐才一直找不到人放我出去。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            我坐在劳拉小姐身边，注意到一位老先生不停盯着我们。他长得真怪，很像一只狮子狗。棕色眼睛亮晶晶，脸尖尖的，一头蓬乱白发每隔几分钟便甩一下。他双手交叠着按在手杖顶端，目光几乎没从劳拉小姐脸上移开。忽然，他一跃而起，走过来坐到她旁边，指着我开了口。
        - id: ch01-b29
          speaker: old_gentleman
          text: 这狗可真难看。
        - id: ch01-b30
          speaker: beautiful_joe
          text: 换作大多数年轻姑娘，听见这话一定会恼火，劳拉小姐却只是觉得有趣。
        - id: ch01-b31
          speaker: miss_laura
          text: 可在我眼里，他很美。
        - id: ch01-b32
          speaker: old_gentleman
          text: 嗯，那是因为他属于你。他这是怎么了？
        - id: ch01-b33
          speaker: miss_laura
          text: 他第一次坐火车，有一点害怕。
        - id: ch01-b34
          speaker: old_gentleman
          text: >-
            难怪。动物在运输途中要吃多少苦，只有上帝知道。亲爱的姑娘，你要是见过我见过的那些事，这一生恐怕再也不会吃一口肉。
        - id: ch01-b35
          speaker: miss_laura
          text: 我……我也听说过一些。那一定非常可怕。
        - id: ch01-b36
          speaker: old_gentleman
          text: >-
            不只是可怕，简直惨不忍睹。想想西部平原上的牛。夏天渴得喘不过气，冬天又挨饿受冻。人们锯掉它们的角，赶它们上火车、上轮船。航行途中，它们一路被抛来甩去，满身伤痕，忍受着痛苦。许多牛死去，被扔进海里。另一些带着病和恐惧，好不容易才上了岸。还有的眼看就要倒毙，人们干脆在码头上把它们宰掉。这样的肉能是什么食物？简直是毒药。我家里已有三个人死于癌症。我吃素。
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            这个古怪的老先生猛地从座位上弹起来，在屋里来回踱步。他走开，我反倒松了口气。劳拉小姐最听不得任何残酷的事，眼泪正一颗接一颗落在我的棕毛上。老先生方才说得很响，候车室里的每个人都听见了。其中有个十分年轻的男子，长着一张冷峻而英俊的脸。他好像很不满老人把劳拉小姐惹哭。
        - id: ch01-b38
          speaker: young_man
          text: >-
            先生，照料动物这件事里，是不是有太多虚假的多愁善感？动物本来就是为人而造。为了供给人的需要，它们得受苦，也得被杀。我们若不宰牛羊，动物会遍布大地。
        - id: ch01-b39
          speaker: old_gentleman
          text: >-
            我同意，年轻人，只要删掉“受苦”两个字。羊、牛和猪都是上帝创造的生灵，和我们一样。我们可以杀死它们，却没权让它们受苦。
        - id: ch01-b40
          speaker: young_man
          text: 可这避免不了，先生。
        - id: ch01-b41
          speaker: old_gentleman
          text: >-
            避免得了，年轻人。人可以养出健康的牲畜，好好待它们，仁慈地宰杀，再体面地食用。人们真能做到，我第一个不再吃素。你还只是个孩子，没走过我走的路。我从这个国家的一头走到另一头，去过北方、南方和西部。我见过的情形叫人发抖。这个伟大的美利坚民族若不改变对待托付给它的无言生灵的方式，上帝一定会惩罚它。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            年轻男子若有所思，没有回答。坐在附近的一位老太太接过了老先生的话。我想自己从没见过这样气度不凡的老太太。她白发如雪，脸上满是深深的皱纹，身材却高挑挺拔。那张慈祥的脸，和我亲爱的劳拉小姐一样叫人喜欢。
        - id: ch01-b43
          speaker: old_lady
          text: >-
            我不觉得我们是个邪恶的民族。比起世上许多民族，我们这个国家还很年轻。许多过错，我想都来自无知和疏忽。
        - id: ch01-b44
          speaker: old_gentleman
          text: 对，夫人，对，夫人。这一点我完全赞同您。
        - id: ch01-b45
          speaker: old_lady
          text: >-
            我也去过许多地方，同不少聪明善良的人谈过残酷对待动物的事。我发现，很多人根本没想过这个问题。他们自己绝不会有意伤害不会说话的生灵，听到那些不人道的行径时，还会惊讶地说：“什么，这种事怎么可能存在！”因为他们从来没有亲眼碰见过。一旦知道实情，他们马上就会奔走呼吁：“一定要制止这种事。有什么办法？”
        - id: ch01-b46
          speaker: old_gentleman
          text: 那么，依夫人看，办法是什么？究竟是什么？
        - id: ch01-b47
          speaker: old_lady
          text: >-
            就用我对付酗酒这项大恶的办法。立法，还有教育。用法律管束那些年长而顽固的人，用教育引导年幼而柔软的心。我要告诉学校里的男孩女孩，酒精会摧毁他们美好身体的骨架。要是残酷对待上帝创造的任何生灵，也会损害、毁掉他们纯洁稚嫩的灵魂。
        - id: ch01-b48
          speaker: young_man
          text: >-
            你们这些提倡禁酒、主张仁慈的人，是不是太看重用种种崇高高尚的情操教育年轻人了？人心永远是邪恶的，你们的《圣经》不也这样说吗？你们不可能把孩子身上的坏处全都教没。
        - id: ch01-b49
          speaker: old_lady
          text: >-
            我们并没指望那样做。可人心若真是邪恶透顶，不是更该让我们努力教导、提升并约束它吗？我在这个邪恶的世上活了七十五年。照我的见闻，人心就算像你说的那样邪恶残酷，也还留着一些柔软温存的地方。年少时留下的印记，永远、永远不会消失。你记得最清楚的，难道不是站在母亲膝前，感受她按在你身上的手，还有她落在你额头上的吻吗？
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            这时候，来接我们的机车已经到了。汽笛响起，几乎所有人都冲出候车室，那个急性子的老先生也跑在前面。劳拉小姐匆匆忙忙地系披肩带，我站在一旁，真想帮帮她。屋里只剩老太太和年轻男子，他们的话，我们自然全都听见了。
        - id: ch01-b51
          speaker: young_man
          text: 是的，我记得。她已经去世了。我没有母亲了。
          emotion: sad
        - id: ch01-b52
          speaker: beautiful_joe
          text: 他的嗓音发哽，脸也涨得通红。老太太站起身，把手轻轻放到他肩上。他们站在一起，她比年轻男子还高。
        - id: ch01-b53
          speaker: old_lady
          text: >-
            可怜的孩子。愿上帝保佑你。我知道你有一颗善良的心。我有四个身强力壮的儿子，你让我想起最小的那个。你若有机会到华盛顿来，一定要看看我。
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            她把自己的姓名告诉了年轻男子。他抬起帽子，一脸惊讶，似乎根本没想到她竟是那个人。随后他也走了，老太太这才转向劳拉小姐。
        - id: ch01-b55
          speaker: old_lady
          text: 亲爱的，要我帮忙吗？
        - id: ch01-b56
          speaker: miss_laura
          text: 那就麻烦您了。我系不上这根带子。
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            她几下便扎好包裹，我们欢欢喜喜赶向火车。离河谷只剩几英里，列车长准我同劳拉小姐一起坐客车。她把外套铺在对面的座位上，我坐在上面看向窗外。列车驶过美丽的乡野，六月的阳光下，满眼都清新翠绿。这里多么明亮，多么舒服，同那节行李车完全不同。动物最害怕的，就是看不见自己要去哪里，也不知道接下来会发生什么。我想这一点，我们和人真的很像。
        - id: ch01-b58
          speaker: beautiful_joe
          text: 老太太在劳拉小姐身边坐下。列车一路向前，她也望着车窗外的风景，低声吟起诗来。
        - id: ch01-b59
          speaker: old_lady
          text: >-
            世间哪有六月的一天这样难得，唯有此时，完美的日子才会来临。
        - id: ch01-b60
          speaker: miss_laura
          text: 说得真对。只是秋天终究会到来，寒冷的冬天也会跟着来，真叫人难过。
        - id: ch01-b61
          speaker: old_lady
          text: 不，亲爱的孩子，不必为此难过。秋天和冬天只是在为另一个夏天作准备。
          emotion: calm
        - id: ch01-b62
          speaker: beautiful_joe
          text: 老太太俯身抚摸我残缺的耳朵，劳拉小姐有点害羞地问她。
        - id: ch01-b63
          speaker: miss_laura
          text: 是啊，我想的确是这样。您好像非常喜欢动物。
        - id: ch01-b64
          speaker: old_lady
          text: 是的，亲爱的。我有四匹马、两头奶牛、一只驯养的松鼠、三条狗和一只猫。
        - id: ch01-b65
          speaker: miss_laura
          text: 那您一定过得很幸福。
        - id: ch01-b66
          speaker: old_lady
          text: >-
            我想是的。对了，可不能忘记我的角蜥迭戈，那是我从加利福尼亚带回来的。我把他养在温室里，他在那里捉苍蝇吃。只要有人靠近，他就把长着角的小脑袋伸过去让人挠，日子过得很快活。
        - id: ch01-b67
          speaker: miss_laura
          text: 我真不懂，怎么会有人忍心伤害动物。
        - id: ch01-b68
          speaker: old_lady
          text: >-
            我也不懂，亲爱的孩子。看到不会说话的动物受折磨，我总是痛苦极了。将近七十年前，我还是个小姑娘。在波士顿街头看见车夫残酷地鞭打负担过重的马，我会害怕得发抖，几乎晕倒。那时我太胆小，不敢出声制止，常常一路跑回家，一头扑进母亲怀里大哭，问她难道就没有办法救救那些可怜的动物。
        - id: ch01-b69
          speaker: old_lady
          text: >-
            母亲疼我，却疼错了地方。她小心保护我，不让我再看见或听见任何残酷的事。可是动物照样受苦。长大成人以后，我才看清自己的怯懦。我在朋友中四处奔走，告诉他们，所有不会说话的生灵都在痛苦中一同呻吟。要是仁慈的人不肯伸手帮忙，这呻吟永远不会停。
        - id: ch01-b70
          speaker: old_lady
          text: >-
            我尽力协助成立了几个防止虐待动物的团体，它们做了不少好事。不但帮助了马和牛，也帮助了更高贵的动物，也就是人。我们对一个残酷的人说：“你不可以让动物过度劳作，不可以折磨、残害或杀死它，也不能不给它足够的食物和安身的地方。”我相信，这样一来，我们也让他比从前更接近天国一步。
        - id: ch01-b71
          speaker: old_lady
          text: >-
            因为人种的是什么，收的也是什么。若把不仁和残酷的种子撒向人和兽，谁也不知道最后会收获怎样黑暗的果实。那匹挨打时浑身发抖的可怜马儿，还不是受害最深的一个。唉，人们若能明白，自己不仁的行为终会以十倍力量落回头上，该多好啊！
        - id: ch01-b72
          speaker: old_lady
          text: >-
            不过，亲爱的孩子，我怕是把这里当成客厅里的集会，竟讲起演说来了。瞧，你的车站已经到了。再见。愿你一直带着快乐的笑脸，永远保持这样温柔的性情。我希望我们有一天还能相见。
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            她握了握劳拉小姐的手，又拍拍我作别。转眼间，我们已经站在站台上，她隔着车窗朝我们微笑。
