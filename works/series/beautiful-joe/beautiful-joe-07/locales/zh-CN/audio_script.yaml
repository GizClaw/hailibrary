audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，关切中自有力量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 温和明理，平静中带着坚定
        timbre: 温暖清晰
        pace: 从容
        pitch: 中
    ned:
      display_name: 内德
      tts:
        delivery: 爱笑淘气，语气轻松
        timbre: 圆润清脆
        pace: 明快
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 稳重诚实，话语沉着
        timbre: 浑厚温和
        pace: 不疾不徐
        pitch: 中低
    lady:
      display_name: 来访的太太
      tts:
        delivery: 客气直率，语调自然
        timbre: 柔和清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 学会跟脚
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: 有一天，劳拉小姐想起比利已经四个月大，很快就该跟她上街了。她便把内德叫来。
        - id: ch01-b02
          speaker: miss_laura
          text: 内德，亲爱的，你教教比利吧。让他学会跟着人走，也学会把东西衔回来。
        - id: ch01-b03
          speaker: ned
          text: 好啊，姐姐。狗狗们，都跟我到园子里来！
        - id: ch01-b04
          speaker: beautiful_joe
          text: 内德顺手抄起一根棍子，挥得凶巴巴的。我一点也不怕，比利更不会怕，他喜欢内德得很。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            莫里斯家的花园其实只是一大片空地。草地被磨秃了好几块，只有几棵树散在四周，篱笆边长着覆盆子和醋栗。有位太太知道莫里斯先生薪水不高。有一天，她望着窗外这块地，向莫里斯太太提了个主意。
        - id: ch01-b06
          speaker: lady
          text: 亲爱的莫里斯太太，为什么不把园子翻一翻，自己种蔬菜呢？这样可比买菜省钱多了。
        - id: ch01-b07
          speaker: beautiful_joe
          text: 莫里斯太太听了，忍不住笑起来。
        - id: ch01-b08
          speaker: mrs_morris
          text: >-
            可你想想，我家有鸡，有猫，有狗，有兔子，最要紧的，还有一群男孩子。这样的园子还能种出什么来？再说，拿走他们玩耍的地方，公平吗？
        - id: ch01-b09
          speaker: lady
          text: 你说得对，那样确实不公平。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            我也想不出，要是少了这片空地，男孩们还能上哪儿嬉闹。这一天，内德把棍子往肩上一扛，绕着园子不停地走。我和比利慢悠悠地跟在后头。走着走着，比利瞧见一根骨头，忽然蹿到旁边去了。内德马上转身，声音又稳又有力。
        - id: ch01-b11
          speaker: ned
          text: 跟脚！
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            比利天真地望着他，根本不懂。内德又喊了一遍。比利还当他在逗自己玩，脑袋往前爪上一伏，汪汪叫了起来。内德笑了，却不肯换别的话，只把“跟脚”一遍遍说给他听。他知道，再添上“过来”“跟着我”或“到后面去”，只会让比利越听越迷糊。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            内德边说边指着我，比利这才慢慢明白，他该跟在内德身后。他走到我旁边，我们两个陪着内德，一圈又一圈地走。内德不时满意地回头看看。我觉得自己做得好，正得意呢，他忽然又换了命令。
        - id: ch01-b14
          speaker: ned
          text: 跑开！
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            这下我可糊涂透了。莫里斯一家训练狗，用的总是同一套口令。我以前听劳拉小姐说过“跑开”，却忘了该怎么做。内德转回来拍了拍我。
        - id: ch01-b16
          speaker: ned
          text: 好乔，你把口令忘啦。吉姆不知道在哪儿，他要是在，就能帮我们了。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            内德把手指放进嘴里，吹了一声尖亮的口哨。没多久，吉姆就从街上沿着小路跑来。他那双又大又聪明的眼睛望着我们，尾巴慢慢摆了两下，像在问我们找他做什么。
        - id: ch01-b18
          speaker: ned
          text: >-
            老古板，快来搭把手，教教这两个家伙。我一个人教得太慢了。好了，年轻的先生们，都注意！跟脚！
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            内德重新绕着园子走，吉姆和我紧贴在他脚后。小比利哄不动我们陪他玩，只好无精打采地落在后面。走了一阵，内德又叫我们跑开。老吉姆一下蹿到前头，像在追什么似的。我这才记起来，这道口令是让我们随意奔跑。比利可高兴了。我们东一头西一头地满园乱跑，内德看着我们的怪模样，笑个不停。
    - id: ch02
      title: 衔回皮带
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            喝过茶，内德又把我们带到园子里，说还有新本领要教。他把后门木台上的一只木盆翻过来，坐在上面，先叫吉姆过去。接着，他从口袋里拿出一条小皮带。那股浓浓的皮革味真好闻，我们三个都去舔它，谁都想把它叼走。
        - id: ch02-b02
          speaker: ned
          text: 乔，比利，不许抢。你们先等一等。吉姆，到这里来。
        - id: ch02-b03
          speaker: beautiful_joe
          text: 吉姆专心看着内德。内德把皮带扔到园子中间，才发出口令。
        - id: ch02-b04
          speaker: ned
          text: 去，把皮带衔回来！
        - id: ch02-b05
          speaker: beautiful_joe
          text: >-
            没听见那道口令时，吉姆一直站着不动。等内德一开口，他立刻飞奔过去，把皮带衔回来，稳稳放进内德手里。这样来回了两三次，内德才让他卧下，又叫我过去。
        - id: ch02-b06
          speaker: ned
          text: 来吧，乔，这回轮到你了。
        - id: ch02-b07
          speaker: beautiful_joe
          text: >-
            内德把皮带扔到覆盆子丛下面，让我去衔。我懂他的意思，欢欢喜喜地跑过去，闻着那股气味，很快就找到了。可皮带刚进嘴，我竟觉得它像个玩具，咬着咬着便玩了起来。内德叫我衔回去，我却丢下皮带，只顾自己跑到他面前。我不是故意淘气，实在是没弄明白。
        - id: ch02-b08
          speaker: beautiful_joe
          text: >-
            内德指指皮带，又摊开两只空手，我总算懂了，赶紧回去把它取来。他让我反复练习。有时我找不到，有时走到半路又弄丢了，他却始终坐在原地，耐心等到我把皮带交给他。
        - id: ch02-b09
          speaker: beautiful_joe
          text: 后来，内德又教了比利一阵。天很快就黑了，我们看不清东西，他只好带着比利回屋。
    - id: ch03
      title: 吉姆的秘密
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: 我还在外面陪着吉姆。过了一会儿，他问起刚才训练的事。
        - id: ch03-b02
          speaker: jim
          text: 乔，你知道内德为什么让我们衔皮带，不让我们衔骨头或别的硬东西吗？
        - id: ch03-b03
          speaker: beautiful_joe
          text: 我哪里知道呢？你快告诉我吧。
        - id: ch03-b04
          speaker: jim
          text: >-
            这是因为我。猎鸟犬不能随便衔硬东西，不然咬口会越来越重。跟着猎人出去时，我们得把打到的鸟送回来。嘴上要是没轻重，很可能会把鸟咬伤。我受过仔细训练，嘴里同时衔着三只鸡蛋，也不会把它们弄破。
        - id: ch03-b05
          speaker: beautiful_joe
          text: 我听完更觉得奇怪，便问起一件压在心里的事。
        - id: ch03-b06
          speaker: beautiful_joe
          text: 吉姆，大家都说你是猎犬，可你为什么从不出去打猎，总是留在家里呢？
        - id: ch03-b07
          speaker: beautiful_joe
          text: 吉姆微微低下了头。
        - id: ch03-b08
          speaker: jim
          text: 我只是不愿意去。
        - id: ch03-b09
          speaker: beautiful_joe
          text: 可吉姆是一条诚实的狗。停了一会儿，他还是把真正的缘故告诉了我。
