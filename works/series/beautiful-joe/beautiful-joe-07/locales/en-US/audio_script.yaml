  chapters:
    - id: ch01
      title: TRAINING A PUPPY
      blocks:
        - id: ch01-b01
          speaker: laura
          text: >-
            Ned, dear, I want you to teach Billy to follow properly and bring things back. He's four months old now, and soon I'll want to take him out on the street.
        - id: ch01-b02
          speaker: ned
          text: All right, Laura. Come on, dogs. Out to the garden!
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Mischievous Ned snatched up a stick and waved it as if he meant business. I wasn't afraid of him at all, and Billy simply loved him.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            The Morris garden wasn't much of a garden. It was a large patch of ground, with bare places worn into the grass, a few trees, and raspberry and currant bushes along the fence. Mr. Morris didn't earn a large salary, and one day a lady looked out through the dining-room window and offered Mrs. Morris some advice.
        - id: ch01-b05
          speaker: visiting_lady
          text: >-
            My dear Mrs. Morris, why don't you dig up this ground and grow your own vegetables? It would cost much less than buying them.
        - id: ch01-b06
          speaker: beautiful_joe
          text: Mrs. Morris laughed, greatly amused.
        - id: ch01-b07
          speaker: mrs_morris
          text: >-
            Just think of all my hens, cats, dogs, rabbits, and most of all, my boys. What kind of garden could survive them? And would it be fair to take away their playground?
        - id: ch01-b08
          speaker: visiting_lady
          text: No, I suppose that wouldn't be fair.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            I can't imagine what the boys would have done without that strip of ground. They had countless games and merry romps there. That day, Ned walked round and round with his stick across his shoulder while Billy and I wandered behind him.
        - id: ch01-b10
          speaker: beautiful_joe
          text: Before long, Billy darted away toward a bone. Ned turned sharply.
        - id: ch01-b11
          speaker: ned
          text: To heel!
        - id: ch01-b12
          speaker: beautiful_joe
          text: Billy gazed at him innocently. He had no idea what Ned meant.
        - id: ch01-b13
          speaker: ned
          text: To heel!
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Billy thought this must be a game. He put his head down on his paws and barked. Ned laughed, but he went on saying only, “To heel.” He knew that adding “Come here,” “Follow,” or “Go behind” would muddle the puppy even more.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Ned repeated the command and pointed toward me until at last Billy seemed to understand. He came to my side, and the two of us followed Ned around the garden again and again.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Ned often glanced back with a pleased look. I felt very proud of how well I was doing. Then he suddenly turned and gave another command, and I became terribly confused.
        - id: ch01-b17
          speaker: ned
          text: Hie out!
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Everyone in the Morris family used the same commands when training us. I had heard Laura say those words before, but I had forgotten what they meant. Ned turned back and patted me.
        - id: ch01-b19
          speaker: ned
          text: >-
            Good Joe. You've forgotten, haven't you? I wonder where Jim is. He could help us.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            Ned put his fingers in his mouth and gave a piercing whistle. Soon Jim came trotting up the lane from the street. He studied us with his large, clever eyes and slowly wagged his tail. His look seemed to ask what we wanted.
        - id: ch01-b21
          speaker: ned
          text: >-
            Come help me train these two, old Sobersides. Doing it alone takes forever. Now then, young gentlemen, pay attention. To heel!
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Ned set off around the garden once more. Jim and I stayed close behind his heels. Little Billy saw that none of us would play with him, so he trailed along at the back.
        - id: ch01-b23
          speaker: beautiful_joe
          text: Before long, Ned wheeled around.
        - id: ch01-b24
          speaker: ned
          text: Hie out!
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            Old Jim bounded ahead and raced off as though he were chasing something. At once I remembered. “Hie out” meant we could run wherever we pleased. Billy loved that. We tore all over the garden, darting this way and that, while Ned laughed at our antics.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            After tea, Ned called us back into the garden. He said there was something else for us to learn. At the wooden platform by the back door, he turned a tub upside down, sat on it, and called Jim over.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Ned drew a small leather strap from his pocket. It had a fine, strong smell. We all licked it, and every one of us wanted it. Ned caught Billy and me by our collars.
        - id: ch01-b28
          speaker: ned
          text: No, Joe. No, Billy. You two wait. Here, Jim.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            Jim watched him closely. Ned threw the strap halfway across the garden, then gave the command.
        - id: ch01-b30
          speaker: ned
          text: Fetch it.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Jim didn't move until he heard those words. Then he dashed across the ground, picked up the strap, and placed it in Ned's hand. Ned sent him for it two or three more times before telling him to lie down. Then he turned to me.
        - id: ch01-b32
          speaker: ned
          text: Here, Joe. Your turn now.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            Ned tossed the strap under the raspberry bushes and looked at me.
        - id: ch01-b34
          speaker: ned
          text: Fetch it.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            I understood him perfectly and ran after it with delight. The strong smell soon led me to it. But once I had the strap in my mouth, the strangest thing happened. I began chewing it and playing with it.
        - id: ch01-b36
          speaker: ned
          text: Fetch it, Joe!
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            I dropped the strap and ran straight back to him. I wasn't refusing to obey. I was simply being stupid.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Ned pointed to the place where I had left it and held out his empty hands. That made things clearer. I hurried back, picked it up, and brought it to him. He had me fetch it several times. Sometimes I lost the scent, and sometimes I let the strap fall, but Ned never came to get it. He stayed on the tub until I carried it all the way to him.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            After a while, Ned began working with Billy. Darkness soon settled over the garden, and none of us could see properly. So Ned took the puppy and went inside.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            I remained outside with Jim for a little longer. He asked whether I knew why Ned had used a leather strap instead of a bone or some other hard object.
        - id: ch01-b41
          speaker: beautiful_joe
          text: I told him I had no idea.
        - id: ch01-b42
          speaker: jim
          text: >-
            It was because of me. I'm a bird dog, so no one lets me carry hard things in my mouth. They could make my mouth too rough. Then I might bite the birds while bringing them back to whoever was shooting with me. My training was so careful that I can carry three eggs in my mouth at once.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            Jim, why don't you ever go shooting? I've always heard that you're meant for it, but you never leave home.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            Jim lowered his head a little and said he didn't wish to go. But he was an honest dog, and after that, he told me the real reason.
