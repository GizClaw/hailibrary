  chapters:
    - id: ch01
      title: CHAPTER XX STORIES ABOUT ANIMALS
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            A small girl with twinkling eyes and a merry face stood up just behind Miss Laura. She made her way to the front and began in a piping little voice.
        - id: ch01-b02
          speaker: little_girl
          text: >-
            My dranfadder says that when he was a little boy, his fadder brought him a little monkey from de West Indies. Naughty boys in de village teased de monkey, so one day he runned up a tree. Dey threw stones at him till a man painting a house drove dem away. Den de monkey came down and shook hands with de man. My dranfadder saw him himself!
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            She shook her head at the president as if she feared he might doubt her. Everyone laughed and clapped when she sat down. Then she suddenly hopped up and ran to the front again.
        - id: ch01-b04
          speaker: little_girl
          text: >-
            Oh, I fordot something! Afterward, de monkey tipped over de painter's oil, rolled all through it, and jumped into my dranfadder's flour barrel.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The president looked greatly amused. Once the laughter had settled, he turned the meeting back toward animals closer to home.
        - id: ch01-b06
          speaker: president
          text: >-
            Those were fine monkey stories. Now, who can tell us another story about a horse?
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Three or four boys sprang up, but the president said they must speak one at a time. The first boy told about something a Riverdale boy had seen beside a canal in Hoytville. Two horses were pulling a canal boat, and the first horse was moving slowly. The driver lost his temper and struck the horse over the head several times with his whip.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            The Riverdale boy called across the canal and begged him to stop, but the driver ignored him. Without warning, the horse turned, caught his tormentor by the shoulder, and shoved him into the canal. The water was shallow. After floundering for a few seconds, the boy climbed out, dripping with mud and filth. He sat on the towpath and stared at the horse with such a comical face that the Riverdale boy had to stuff a handkerchief into his mouth to keep from laughing.
        - id: ch01-b09
          speaker: president
          text: >-
            I hope that taught him to treat his horse more kindly. Bernard Howe, let us hear your story now.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Bernard was the little girl's brother, and he had clearly been talking with their grandfather too. He had two stories to tell, and both took place in Fairport. That made Miss Laura listen with special eagerness.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Bernard said his grandfather had lived in Fairport, Maine, as a young man. One day, he stood in the market square and watched the town's first stagecoach being assembled. It had arrived in pieces from Boston because no one in Fairport knew how to build one. The coach would leave for the country one day and return the next. At first, no one knew how to drive its horses properly. Day after day, the animals came back bleeding. The whiffletree swung around and struck them, and when their collars came off, their necks were raw and bloody. In time, the men learned how to handle the coach, and the horses suffered less.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            His second story was about a team boat, not a steamboat. More than seventy years earlier, no steamer ran between Fairport and the island where people spent the summer. Instead, a boat crossed by means of machinery worked by eight horses. The horses walked around and around to move it.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            One afternoon, two dancing masters boarded the boat. They were wicked fellows who played the fiddle and never attended church on Sundays. They sat where the horses had to pass them, and each time the animals went by, the men jabbed them with penknives. At last, the driver saw blood dripping from the horses, and the two men were found out. Some young men on board were furious. They whipped the dancing masters with the end of a rope, threw them overboard, and made them swim to the island.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            When Bernard sat down, a young girl stood and read some verses she had clipped from a newspaper.
        - id: ch01-b15
          speaker: young_reader
          text: >-
            Don't kill the toads, the ugly toads, that hop around your door. At every meal, a little toad eats a hundred bugs or more. He sits there looking meek until a bug comes near. Then out shoots his little tongue, as quick as lightning in high gear. He gives a sober wink and shuts his ugly mug, then patiently waits there until along comes one more bug.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell followed with a good dog story. He assured the president it was true because it had happened at his own boardinghouse, and he had seen it himself.
        - id: ch01-b17
          speaker: mr_maxwell
          text: >-
            Yesterday was Monday and washday. My landlady hung a great many clothes outside, including one of her husband's gray flannel shirts. The young dog at the house pulled that shirt down and tore it apart. She set the pieces aside and warned him that his master would beat him. When the man came home for dinner, he showed the dog the torn shirt and gave him a severe whipping.
        - id: ch01-b18
          speaker: mr_maxwell
          text: >-
            The dog ran away and searched the clotheslines all over the village. At last, he found a gray shirt that looked very much like his master's. He grabbed it, carried it home, and laid it at his master's feet, wagging his tail for joy.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            When Mr. Maxwell finished, a bright-faced boy named Simon Grey rose to speak.
        - id: ch01-b20
          speaker: simon_grey
          text: >-
            You all know our old gray horse, Ned. Father sold him to a man in Hoytville last week, and I went to the station when they shipped him. They put Ned in a boxcar. The main doors were locked with a small opening for air, but there was also a narrow sliding door about four feet above the floor. Somehow, Ned pushed that little door open. He crawled through it and tumbled to the ground.
        - id: ch01-b21
          speaker: simon_grey
          text: >-
            On my way home from school, I saw him walking beside the track. He had only a few cuts, and he was so glad to see me that he followed me home. The train must have been going at full speed when he escaped. No one saw him at any station. When the train reached Hoytville, the crew couldn't believe that the car was locked but empty. Father persuaded the buyer to give up the bargain. He says that if Ned loves Riverdale that much, Ned can stay here.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            The president asked the boys and girls to give three cheers for old Ned, and the whole room answered. After that, they sang some more. When everyone had settled into a seat again, the president asked the members to report what they had done for animals during the last two weeks.
        - id: ch01-b23
          speaker: owl_girl
          text: >-
            Two owls came around our barnyard, and I stopped my brother from shooting them. I told him they would eat the rats and mice that trouble him in the barn. If he hunted the owls, they would leave for the woods.
        - id: ch01-b24
          speaker: fishing_boy
          text: >-
            Some friends of mine were going fishing. I persuaded them to put their bait worms into boiling water so the worms would die before the trip. They also promised to kill each fish at once with a sharp blow behind the head. They agreed more readily when I explained that a fish tastes better cooked if it is killed as soon as it comes out of the water.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            A little girl had persuaded her mother never again to put lobsters into cold water and slowly boil them to death. She had also seen a man in the street carrying two fowls with their heads hanging down. She stopped him and politely asked him to turn the birds the other way. The man told her the fowls did not mind. She pursed her little mouth and showed the whole band exactly how she had answered him.
        - id: ch01-b26
          speaker: gentle_girl
          text: I would rather hear what the hens think about it.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            The man laughed, called her a little lady, and carried the birds the way she wanted. She had also reasoned with boys outside the village who threw stones at birds and frogs or stuck pins through butterflies. She invited them to join the Band of Mercy.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            This child seemed to have done more for helpless animals than anyone else. She carried a petition around to the village boys, asking them not to hunt for birds' eggs. She even asked her father to lift her up in his stable so she could look into the horses' mouths and see whether their teeth were decayed or needed filing. When he laughed, she told him that bad teeth can cause horses terrible pain. Sometimes a metal bit strikes an exposed nerve and drives a horse nearly frantic, causing it to run away.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            She was a very gentle girl. From the way she spoke, I thought her father loved her dearly. He had gone to much trouble to build tiny houses for the wrens around their farm. She said the little birds caught so many insects that they should be free to spend their time doing that, without worrying about making homes. Her father made the openings very small so English sparrows could not enter and push the wrens out.
        - id: ch01-b30
          speaker: farm_boy
          text: >-
            I got a pot of paint and wrote big words on all the fences around Father's farm. They say, “Spare the toads. Don't kill the birds. Every bird that dies is a loss to the country.”
        - id: ch01-b31
          speaker: president
          text: >-
            That reminds me. Girls, what have you done about feathers on hats?
        - id: ch01-b32
          speaker: serious_girl
          text: >-
            I told my mother that wearing bird feathers is wrong. She promised not to wear them anymore, except for ostrich plumes.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            At that point, Mrs. Wood asked if she might say a few words.
        - id: ch01-b34
          speaker: president
          text: Certainly. We are always glad to hear from you.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Mrs. Wood went up to the platform and faced the room full of children.
        - id: ch01-b36
          speaker: mrs_wood
          text: >-
            Dear boys and girls, some papers came to me from Boston with facts about the killing of birds. I want you to hear a few of them. Nearly every tree and plant is covered with insect life. Those plants could not grow if birds did not eat the insects that would strip away their leaves. Little beaks stay busy all day. Rose-breasted grosbeaks search potato plants for beetles. Martins destroy weevils. Quail and grouse eat chinch bugs, while woodpeckers pull worms from trees. Many other birds eat the flies, gnats, and mosquitoes that torment us. Their sharp little eyes miss almost nothing that flies or crawls.
        - id: ch01-b37
          speaker: mrs_wood
          text: >-
            A great Frenchman has said that without birds, human beings would disappear from the earth. Birds do all this for us, but how do we repay them? Across America, people hunt and kill them. Every year, five million birds are caught so American women can wear them on hats and bonnets. Think of that, girls. Five million innocent, beautiful, hard-working birds die so thoughtless women and girls can decorate themselves with the little bodies. In one month, one million bobolinks were killed near Philadelphia. One village on Long Island sent seventy songbirds to milliners in New York.
        - id: ch01-b38
          speaker: mrs_wood
          text: >-
            In Florida, cruel men shoot mother birds on their nests while they are raising their young because their feathers look finest then. Their little ones cry and starve. When someone kills one of the rarer birds, such as a hummingbird, an oriole, or a kingfisher, several more may die with it. Its young may starve. A wounded bird may fly away and die. Others are killed even though their damaged feathers cannot be sold for a fine bonnet. Some hunters want only a bird's bright wings. They tear the wings from the living bird and throw it away to die.
        - id: ch01-b39
          speaker: mrs_wood
          text: >-
            I am sorry to tell you things that hurt so much, but you need to know them. You will soon be grown men and women, and you must do what you can to end this horrible trade. Our beautiful birds are disappearing, while harmful insects increase. Massachusetts lost more than one hundred thousand dollars because it failed to protect its birds. Gypsy moths stripped the trees near Boston. The state spent all that money and still could not remove the moths. The birds could have done better, but they were gone. So these are my last words to you. Protect the birds.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            Mrs. Wood returned to her seat. The boys and girls had listened to every word, but this time no one cheered. Sadness showed in their faces, and the whole room stayed very quiet for several minutes. I saw one or two little girls wiping tears from their eyes. I think they felt deeply sorry for the birds.
        - id: ch01-b41
          speaker: president
          text: >-
            Has any boy done something about blinders and checkreins?
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            A brown-faced boy stood up.
        - id: ch01-b43
          speaker: brown_faced_boy
          text: >-
            I had a picnic last Monday. Father let me use my penknife to cut all the blinders from our horses' headstalls.
        - id: ch01-b44
          speaker: president
          text: How did you persuade him to allow that?
        - id: ch01-b45
          speaker: brown_faced_boy
          text: >-
            I told him I couldn't sleep because I kept thinking about him. He often drives late at night. Whenever he came home from Sudbury in the dark, I pictured the deep ditch beside the road and wished his horses could see without blinders. When he drove home from the Junction, he had to follow the riverbank. The water had washed away so much earth that the wagon wheels passed within a foot or two of the edge. Again, I wished the horses could see on both sides. I knew they would have sense enough to avoid danger if only they could see it.
        - id: ch01-b46
          speaker: brown_faced_boy
          text: >-
            Father said that might be true, but the horses had been trained with blinders. He asked if removing them might make the horses shy, and whether seeing the wagon wheels so close would frighten them. I told him that several accidents happen to blinded horses for every one that happens to a horse without blinders. Then I repeated what Mr. Wood of Dingley Farm says.
        - id: ch01-b47
          speaker: brown_faced_boy
          text: >-
            Mr. Wood says the worst thing about blinders is that a frightened horse cannot tell when it has passed whatever scared it. The horse still thinks the danger is behind him. He cannot see that it is gone or turn his head for a proper look, so he may keep racing wildly. Sometimes lives are lost because a little piece of leather covers a beautiful eye that ought to look freely out at the world.
        - id: ch01-b48
          speaker: brown_faced_boy
          text: >-
            That settled it. Father said he would remove the blinders, and if there was an accident, he would send Mr. Wood the bill. But we haven't had one. The horses acted a little strangely and startled at first. They soon got over it, and now they travel as steadily without blinders as they ever did with them.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            When the boy sat down, the president said it was time for the whole nation to give up the foolish habit of half covering horses' eyes. He asked every member of the band to put both hands beside their eyes and block half their view. They should notice how shut in they felt and how badly they wanted to know what was happening beside them. Suppose a girl saw a mouse while her eyes were half covered. Wouldn't she run? Everyone laughed.
        - id: ch01-b50
          speaker: president
          text: Who can tell me who invented blinders?
        - id: ch01-b51
          speaker: answering_boy
          text: >-
            An English nobleman with a wall-eyed horse! He wanted to hide the bad eye. It is a great shame that every American horse must suffer because that one English horse had an ugly eye.
        - id: ch01-b52
          speaker: president
          text: I agree. Boys, let us give three groans for blinders.
        - id: ch01-b53
          speakers: [child_1, child_2, child_3, child_4]
          ensemble: chorus
          text: Groan! Groan! Groan!
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            The children made three dreadful sounds deep in their throats, then enjoyed another good laugh. The president became serious once more.
        - id: ch01-b55
          speaker: president
          text: >-
            We have seven minutes left. This meeting must end at five o'clock sharp.
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            A tall girl at the back stood and said that her little cousin had two stories for the band. The president invited her forward. She led a tiny child to the front and placed her before the other children. The little one stared up at her cousin while twisting her white pinafore between her fingers. Each time the older girl freed the cloth from her hands, she caught it again.
        - id: ch01-b57
          speaker: eleanor
          text: You can begin now, Nannie.
        - id: ch01-b58
          speaker: nannie
          text: >-
            Well, Cousin Eleanor, you know Graham's pony, Topsy. She used to run away. A very big man came to Papa and said he could train her. He drove her every day and beat her and beat her until he was tired, but Topsy still ran away. Papa said the poor pony must not be whipped so much. Every day, he brought her a piece of bread and petted her. Now Topsy is very gentle, and she never runs away.
        - id: ch01-b59
          speaker: eleanor
          text: Now tell them about Tiger.
        - id: ch01-b60
          speaker: nannie
          text: >-
            Well, Cousin Eleanor, you know our big dog, Tiger. He used to behave badly. Whenever Dr. Fairchild drove up to the house, Tiger jumped at him and tried to bite him. The doctor always spoke kindly to Tiger and tossed him pieces of meat. Now, when the doctor comes, Tiger follows him and wags his tail. Now please give me a kiss.
        - id: ch01-b61
          speaker: beautiful_joe
          text: >-
            Eleanor had to give Nannie a kiss right there in front of everyone. The boys made a tremendous stamping with their feet. Eleanor blushed at all the attention and hurried back to her seat, while the tiny child clung tightly to her hand.
        - id: ch01-b62
          speaker: beautiful_joe
          text: >-
            One more story followed. It was about a brave Newfoundland dog that saved eight lives. The dog swam out to a wrecked sailing ship and carried a rope back, so the men could reach the shore.
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            Then a boy rose, and the room greeted him with cheers and cries of, “The Poet!” I did not understand what they meant until Mrs. Wood whispered to Miss Laura that he was a boy who made up rhymes. The children would rather hear him speak than anyone else in the room. He had freckles and a turned-up nose. I thought he was the plainest boy there, but looks did not matter when the other children loved him. With both hands behind his back and a very grand manner, he strolled slowly to the front.
        - id: ch01-b64
          speaker: poet
          text: >-
            The beautiful poetry we heard today has given me some verses that did not exist before I came to this meeting.
        - id: ch01-b65
          speaker: beautiful_joe
          text: >-
            Everyone cheered wildly. Then he began in a singsong voice.
        - id: ch01-b66
          speaker: poet
          text: >-
            I am a Band of Mercy boy. I would not hurt a fly. I always speak to dogs and cats whenever I pass by. I always let the birdies sing. I never throw a stone. I always give a hungry dog a nice, fat, meaty bone. I wouldn't drive a bob-tailed horse or hurry up a cow. I—
        - id: ch01-b67
          speaker: beautiful_joe
          text: >-
            He forgot the rest. The boys and girls were terribly sorry. They shouted every animal name they could think of, hoping to help, but none was right. Since the boy had only just invented the poem, no one else could know the next word. He stared at the ceiling for a long time.
        - id: ch01-b68
          speakers: [child_1, child_2, child_3, child_4]
          ensemble: chorus
          text: Pig! Goat! Calf! Sheep! Hens! Ducks!
        - id: ch01-b69
          speaker: poet
          text: I suppose I must give it up.
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            The children looked deeply disappointed.
        - id: ch01-b71
          speaker: president
          text: Perhaps you will remember it before our next meeting.
        - id: ch01-b72
          speaker: poet
          text: >-
            It is possible, but I doubt it. I think those words are gone forever.
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            He returned to his seat. Next came the call for new members. Miss Laura stood up.
        - id: ch01-b74
          speaker: miss_laura
          text: I would like to join the Band of Mercy.
        - id: ch01-b75
          speaker: beautiful_joe
          text: >-
            I followed her to the platform while they pinned a small badge on her, and everyone laughed at me. Then they sang “God Bless Our Native Land,” and the president dismissed the meeting.
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            It seemed to me a lovely thing for those children to gather in one place and talk together about kindness to animals. They all had bright, good faces. Many of them stopped on their way out to pat me, and one little girl reached into her schoolbag and gave me a biscuit.
        - id: ch01-b77
          speaker: beautiful_joe
          text: >-
            Mrs. Wood waited by the door until Mr. Maxwell came limping out on his crutches. She introduced him to Miss Laura and invited him to take tea with them. He said he would be very happy to come. Then Mrs. Wood laughed.
        - id: ch01-b78
          speaker: mrs_wood
          text: >-
            Perhaps you had better empty your pockets first. I don't want a little toad jumping across my tea table like the one you brought last time.
