  chapters:
    - id: ch01
      title: 第二十章　动物故事
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            劳拉小姐身后站起一个眼睛亮晶晶的小姑娘。她满脸喜气，一路走到前面，用尖尖的小嗓子讲起爷爷小时候的事。
        - id: ch01-b02
          speaker: little_girl
          text: >-
            我爷爷说，他小时候，他爸爸从西印度群岛带回一只小猴。村里的淘气男孩总欺负它。有一天，小猴爬上树，他们还拿石头扔。有个给房子刷漆的人把他们赶跑了，小猴马上跑下树，跟那个人握手。我爷爷亲眼看见的，你们可别不信。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            她坐下时，大家又笑又拍手。可她刚跑回去，忽然又蹦起来，急忙折回前面。
        - id: ch01-b04
          speaker: little_girl
          text: >-
            啊，我忘了一件事！爷爷说，后来小猴打翻了油漆匠的油罐，先在油里滚了一身，又跳进了爷爷家的面粉桶！
        - id: ch01-b05
          speaker: phil_dodge
          text: >-
            猴子的故事已经听了不少。现在说说我们身边的动物吧。谁还能讲一个马的故事？
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            三四个男孩一起跳起来，会长只好让他们一个个讲。第一个故事里，里弗代尔有个男孩沿霍伊特维尔的运河走，看见另一个男孩赶两匹马拉着运河船。头一匹马走得懒洋洋的，赶马的男孩发了火，拿鞭子连抽它的脑袋。里弗代尔的男孩隔岸大喊，求他别这样残忍，他却理都不理。那匹马突然转身，一口咬住折磨它的人的肩膀，把他推下运河。水并不深。他扑腾了好一会儿，才浑身泥水和脏东西地爬上岸。他坐在纤道上瞪着马，那副模样滑稽得让人忍不住笑。里弗代尔的男孩只好把手帕塞进嘴里，才没有当场笑出来。
        - id: ch01-b07
          speaker: phil_dodge
          text: >-
            但愿他记住这次教训，以后能对自己的马好一点。伯纳德·豪，现在轮到你了。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            伯纳德就是刚才那个小姑娘的哥哥。他显然也像妹妹一样，事先跟爷爷好好谈过。他一连带来两个发生在费尔波特的故事，劳拉小姐一听地点熟悉，马上专心听了起来。
        - id: ch01-b09
          speaker: bernard_howe
          text: >-
            爷爷年轻时住在缅因州费尔波特。镇上第一辆驿站马车，是拆成零件从波士顿运来的，因为本地没人会造。组装那天，爷爷就站在集市广场，从头看到尾。后来马车有一天驶进内地，第二天才回来。那时的人还不会好好驾车，马一天又一天地带着满身鲜血回来。横木会突然甩过来打伤它们，颈圈一摘，又能看见脖子磨得又生又烂。过了很久，车夫才真正学会怎样驾车，马匹受的苦也终于少了。
        - id: ch01-b10
          speaker: bernard_howe
          text: >-
            另一个故事说的是马力船，不是汽船。七十多年前，费尔波特到对面那座度假小岛没有汽船，只有装着机械、让八匹马不停绕圈驱动的船。一天下午，两个教舞蹈的坏家伙上了船。他们会拉小提琴，星期日从不去教堂，还故意坐在马匹必经的地方。马每走过一次，他们就用小折刀戳一下。赶马的人终于看见血在往下滴，大家才发现是谁干的。船上几个年轻人气极了，抄起绳头抽打他们，又把他们扔进水里，逼他们游到岛上。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            伯纳德坐下后，一个年轻姑娘念起从报纸上剪来的诗。诗里说，别杀门前那些蹦蹦跳跳的丑蛤蟆。小蛤蟆每吃一顿，就能吞掉一百只，甚至更多虫子。它神情温顺地坐在一旁，等虫儿慢慢靠近。时机一到，小舌头突然射出去，快得像加了两档的闪电。随后它一本正经地眨眨眼，合上那张丑嘴巴，又耐心守在那里，等下一只虫子过来。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            接着，马克斯韦尔先生讲了个狗故事。他说这件事就发生在自己寄宿的人家，是他亲眼见到的。
        - id: ch01-b13
          speaker: maxwell
          text: >-
            昨天是星期一，也是洗衣日。女房东洗了很大一堆衣服，晾在外面，其中有她丈夫的一件灰法兰绒衬衫。家里的小狗把衬衫从绳上扯下来，撕成碎片。女主人把碎布放到一旁，警告它说，男主人回来一定会揍它。男人回家吃午饭，看见衬衫碎片，果然狠狠打了狗。狗逃出去，把全村的晾衣绳一根接一根地找遍，终于发现一件跟主人那件很像的灰衬衫。它叼起衬衫一路跑回家，放到主人脚边，尾巴还高兴地摇个不停。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生讲完，面孔明亮的西蒙·格雷站了起来。
        - id: ch01-b15
          speaker: simon_grey
          text: >-
            你们都认识我家的老灰马奈德。上星期，爸爸把它卖给霍伊特维尔的一个人，我去车站送它。奈德被关进一节棚车。大门只留一条透气的小缝，随后就这样锁好。离车厢地板四英尺高的地方，还有扇窄窄的滑门。也不知道奈德怎么把那扇门顶开了。它从那么高的地方慢慢爬出去，又摔到地上。我放学回家时，看见它正沿着铁轨一步步走来。它除去几处擦伤，别的地方一点没伤着。它见到我特别高兴，一直跟着我回了家。
        - id: ch01-b16
          speaker: simon_grey
          text: >-
            沿途每一站都没人看见它，所以它准是在火车全速前进时跳下来的。列车员到了霍伊特维尔，发现车门还锁着，车厢却空了，惊讶得不得了。爸爸请买主取消了交易。他说，奈德既然这么舍不得里弗代尔，就让它留下吧。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            会长请大家为老奈德欢呼三声，接着又唱了几首歌。众人坐好以后，他问会员们，过去两个星期都为动物做过什么。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            一个女孩拦住弟弟，不让他射杀来到谷仓院子旁的两只猫头鹰。她告诉弟弟，谷仓里的老鼠正叫他头疼，猫头鹰会替他除掉它们。他要是追赶，猫头鹰就会飞进树林，不肯再来了。一个男孩劝去钓鱼的朋友们先把鱼饵蚯蚓放进一碗沸水里烫死，还请他们答应，鱼一出水，就朝后脑猛击一下，让它立刻死去。他又说，鱼从水里拿到空气中时马上死去，煮熟后味道也会更好。朋友们听见还有这个好处，就更愿意答应了。
        - id: ch01-b19
          speaker: helpful_girl
          text: >-
            我请妈妈答应，再也不把龙虾放进冷水里，让水一点点烧热，把它们慢慢煮死。有一次，我在街上看见一个男人倒提着两只鸡，就请他好心把鸡正过来。他说鸡根本不在乎。我抿起嘴告诉他：“我更愿意听母鸡自己的意见。”他笑了，叫我小淑女，真的照我说的做了。我还劝过村外那些拿石头扔鸟和青蛙、把蝴蝶钉起来的男孩，请他们也来参加仁慈会。
        - id: ch01-b20
          speaker: helpful_girl
          text: >-
            我还带着一份请愿书，挨个请村里的男孩签名，答应不再到处寻找鸟蛋。我甚至走进爸爸的马厩，请他把我高高抱起来，让我看看马嘴里的牙齿需不需要锉平，有没有已经蛀坏。爸爸笑我，我就告诉他，马也会因为牙齿受很大的苦。有时金属嚼子正好碰上坏牙露出的神经，马痛得几乎发疯，就会突然狂奔起来。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            她是个很温柔的姑娘。从她的话里，我听得出父亲十分疼爱她。她想给农场附近的鹪鹩几间小屋，父亲便花了许多心思替她造好。她告诉父亲，这些小鸟特别会捉虫，应该把时间全用来捉害虫，不必再为给自己造窝操心。父亲把小屋做得很小，入口也窄窄的。这样英国麻雀钻不进去，也就不能霸占屋子，把鹪鹩挤走。
        - id: ch01-b22
          speaker: boy_voice
          text: >-
            我弄来一罐油漆，在爸爸农场四周的篱笆上写了大字：“放过癞蛤蟆，别杀鸟。每杀死一只鸟，国家便多一份损失。”
        - id: ch01-b23
          speaker: phil_dodge
          text: >-
            这倒提醒了我。姑娘们，你们为帽饰这件事做过什么？
        - id: ch01-b24
          speaker: serious_girl
          text: >-
            我跟妈妈说，戴鸟羽是不对的。她已经答应我，除了鸵鸟羽毛，别的羽毛都不再戴。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            伍德太太请求讲几句话，会长说大家一直都很愿意听她发言。她走上讲台，面对满屋的孩子。
        - id: ch01-b26
          speaker: mrs_wood
          text: >-
            亲爱的男孩女孩们，波士顿有人寄给我一些资料，讲的是鸟儿遭到捕杀的事实，我想把其中几件告诉你们。你们都见过，几乎每棵树、每株植物上都有无数昆虫。要是鸟儿不去吃那些啃光枝叶的虫子，树木花草根本长不起来。鸟儿的小尖嘴从早到晚忙个不停。可爱的玫胸白斑翅雀一株株检查马铃薯，啄去甲虫。紫崖燕消灭象鼻虫，鹌鹑和松鸡一家吃麦长蝽，啄木鸟从树干里挖出虫子。折磨我们的苍蝇、小飞虫和蚊子，也有许多鸟来替我们消灭。不论会飞还是会爬，都逃不过那些敏锐的小眼睛。
        - id: ch01-b27
          speaker: mrs_wood
          text: >-
            一位伟大的法国人说过，没有鸟类，人就会从地球上灭绝。鸟儿做了这么多来帮助我们，我们却怎么回报它们？美国各地都有人追捕、杀害它们。美国女人每年戴在帽子和软帽上的鸟，足足有五百万只。姑娘们，好好想想吧，这多可怕。五百万只无辜、勤劳又美丽的鸟，只为让那些不肯多想的姑娘和女人拿小小的尸体装饰自己，就丢了性命。费城附近一个月内杀过一百万只食米鸟。长岛一个村子，也曾把七十只鸣禽送到纽约女帽商的手里。
        - id: ch01-b28
          speaker: mrs_wood
          text: >-
            在佛罗里达，残忍的人趁母鸟守在巢中、养育幼鸟时开枪，因为那时的羽毛最漂亮。失去母亲的小鸟凄惨地叫着，最后活活饿死。蜂鸟、黄鹂、翠鸟这些珍稀鸟，每打死一只，往往还会害死好几只。巢里的幼鸟会挨饿，受了枪伤却飞走的鸟会死在别处，还有一些鸟虽然被打中，羽毛却撕坏了，不能装上贵妇人的帽子，结果也白白送了命。有些鸟的翅膀颜色鲜艳，猎人只想要翅膀，不要其余的身体，竟从还活着的鸟身上把双翼生生扯下来，再把它扔掉等死。
          emotion: sad
        - id: ch01-b29
          speaker: mrs_wood
          text: >-
            告诉你们这些叫人痛苦的事，我心里很难过，可你们应该知道。你们很快就会长成男人和女人，请尽自己的力量，阻止这桩可怕的买卖。我们美丽的鸟儿正被人夺走，害虫却越来越多。马萨诸塞州没有保护鸟类，为此损失了十多万美元。舞毒蛾吃光波士顿附近树木的叶子，州政府付出这么多钱，仍没能消灭蛾子。鸟儿本来会比州政府做得更好，可那些鸟已经全不见了。最后，请你们记住一句话：保护鸟儿。
          emotion: sad
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            伍德太太说完，走回自己的座位。男孩女孩们从头到尾都听得十分专心，这一次却没有一个人为她喝彩。他们脸上全是悲伤，安安静静地坐了好几分钟。我还看见一两个小姑娘悄悄擦着眼泪。我想，她们一定是在为那些遭到杀害的鸟儿难过。
        - id: ch01-b31
          speaker: phil_dodge
          text: >-
            有没有哪个男孩，为马的眼罩和勒颈缰做过什么？
        - id: ch01-b32
          speaker: brown_boy
          text: >-
            上星期一，我可痛快了。爸爸准我拿小折刀，把家里马笼头上的眼罩全割掉。
        - id: ch01-b33
          speaker: phil_dodge
          text: 你是怎么让他同意的？
        - id: ch01-b34
          speaker: brown_boy
          text: >-
            我告诉爸爸，我一想到他夜里赶车，常常就睡不着。他经常深夜才回家。每逢漆黑的夜里，他从萨德伯里回来，我就会想起路旁那条深沟，盼着他的马没有眼罩。从交会站回来时，他又要沿着河岸赶车。河水把岸边的泥土冲掉了，车轮离边缘有时只有一两英尺。我总希望马能看见左右两边。它们只要看得见，就有足够的聪明避开危险。爸爸却担心，马从小戴着眼罩，突然摘掉会容易受惊。一转头看见车轮离自己那么近，它们也可能害怕。
        - id: ch01-b35
          speaker: brown_boy
          text: >-
            我告诉他，不戴眼罩的马出一次事故，戴眼罩的马就会出好几次。接着，我把丁格利农场伍德先生的看法也讲给爸爸听。伍德先生说，眼罩最坏的地方，是受惊的马永远不知道自己已经跑过了吓它的东西。皮革挡着视线，它看不见危险已被甩在后面，也不能回头仔细瞧一眼。它总以为可怕的东西还追在身后，只好继续发疯似的往前冲。有时闹出人命，竟只因为一小片皮革，遮住了那只本该自由望着整个世界的美丽眼睛。
        - id: ch01-b36
          speaker: brown_boy
          text: >-
            爸爸终于答应摘掉眼罩。他开玩笑说，要是出了事故，就把赔偿单寄给伍德先生。可我们没出事故。那些马起初有点不习惯，也受惊了几次，很快就适应了。现在不戴眼罩，它们还是走得一样稳。
        - id: ch01-b37
          speaker: phil_dodge
          text: >-
            我看，全国都该丢掉遮住马匹半边眼睛的蠢做法。各位把手放到眼睛旁，遮住一半试试。你们会觉得多憋闷，多想知道身旁有什么。要是一个姑娘半遮着眼睛看见老鼠，她会不会马上逃跑？
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            大家都笑了。会长又问是谁发明了眼罩。
        - id: ch01-b39
          speaker: boy_voice
          text: >-
            是个英国贵族！他的马有只斜眼，他想遮住那个缺陷。就因为一匹英国马的眼睛难看，所有美国马都要受苦，真不像话！
          emotion: angry
        - id: ch01-b40
          speaker: phil_dodge
          text: 我也这么想。男孩们，为眼罩喝三声倒彩！
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            孩子们从喉咙深处发出三声吓人的怪响，又痛快地笑了一阵。会长重新严肃起来，提醒他们只剩七分钟，这场会五点整必须散。后排一个高个子姑娘站起来，说小表妹有两个故事想讲给仁慈会听。会长马上答应，请她把孩子带到前面。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            大姑娘埃莉诺牵着一个小不点儿走到前面，让她站在所有男孩女孩面前。孩子一直仰头盯着表姐，两只小手不停拧着身上的白围裙。埃莉诺每次轻轻把围裙从她手里拿开，她马上又伸手抓回去，怎么也不肯松开。
        - id: ch01-b43
          speaker: eleanor
          text: 开始吧，南妮。
        - id: ch01-b44
          speaker: nannie
          text: >-
            好吧，埃莉诺表姐。你知道格雷厄姆的小马托普西，它以前总要逃跑。有个好高好高的男人来找爸爸，说自己能驯好托普西。他每天都赶着它走，又打又打，一直打到自己也累了，可托普西还是照样逃跑。后来爸爸说，不许再让可怜的小马挨这么多鞭子。他每天都带一片面包去看它，轻轻摸它，好好疼它。现在托普西变得很温顺，再也不逃跑了。
        - id: ch01-b45
          speaker: eleanor
          text: 再说说泰格吧。
        - id: ch01-b46
          speaker: nannie
          text: >-
            好吧，埃莉诺表姐。你知道我家的大狗泰格。它从前很坏，费尔柴尔德医生坐车到家里，它会蹿起来咬人。医生总是好好跟它说话，还扔肉给它吃。现在医生每次来，泰格都跟在后面摇尾巴。说完啦，你亲我一下吧。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            埃莉诺只好当着大家亲了她一下。男孩们把脚跺得震天响，埃莉诺红着脸，牵紧孩子的手，匆匆回到座位。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            又有人讲起一条勇敢的纽芬兰犬。它游向一艘失事的帆船，把绳索送过去，让船上的人顺着绳子安全上岸，一共救了八条命。随后，一个男孩站起来，所有人都欢呼着叫他诗人。我起初不明白这个称呼，伍德太太才悄悄告诉劳拉小姐，这男孩会编诗，屋里的孩子宁可听他说话，也不愿错过他去听别人。
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            他鼻子朝天，脸上满是雀斑，大概是那儿相貌最平常的男孩。不过大家都喜欢他，相貌又有什么要紧？他背着双手，慢悠悠走到前面，摆出十分神气的样子。他一开口，在场的人马上热烈欢呼起来。
        - id: ch01-b50
          speaker: poet
          text: >-
            今天在这里听到这么美的诗，我脑子里忽然也冒出几节来。今天走进这间屋子以前，我可从没想过这些句子。大家听好了。我是仁慈会的男孩，小小苍蝇我也不伤害。每逢猫儿狗儿身边过，我总会开口问声好。鸟儿要唱我让它唱，从来不把石子扬。饿狗来到我跟前，送它肥肥肉骨一大块。断尾的马我不会赶，走路的母牛也不催它快，我……
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            念到这里，他忽然忘了后面的诗。男孩女孩们都替他着急，争着喊猪、山羊、小牛、绵羊、母鸡、鸭子，把脑子里想得到的动物名字全喊了一遍，可没有一个是对的。这首诗是他当天走进会场后才编出来的，别人当然猜不到下一句。他站在那里很久，始终仰头盯着天花板，怎么也想不起来。
        - id: ch01-b52
          speaker: poet
          text: 我看，只能放弃了。
        - id: ch01-b53
          speaker: phil_dodge
          text: 也许下次聚会时，你会想起来吧？
        - id: ch01-b54
          speaker: poet
          text: >-
            也许。不过多半想不起来了。我看，那几句已经永远消失了。
        - id: ch01-b55
          speaker: beautiful_joe
          text: >-
            孩子们失望极了。小诗人回到座位，聚会便开始招收新会员。劳拉小姐站起来，说自己也想加入仁慈会。
        - id: ch01-b56
          speaker: miss_laura
          text: 我愿意加入你们的仁慈会。
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            我跟着劳拉小姐一起走上讲台。大家替她别好一枚小徽章，看见我也跟了上来，全都笑起来。随后，他们一同唱起《上帝保佑我们的祖国》。歌唱完，会长才宣布大家可以回家了。
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            这些孩子聚在一起，谈怎样善待动物，我觉得真好。他们的脸都明亮又善良。离开时，好些孩子停下来摸摸我，还有个小姑娘从书包里拿出饼干送给我。
        - id: ch01-b59
          speaker: beautiful_joe
          text: >-
            伍德太太一直在门口等着，直到马克斯韦尔先生拄着双拐，一瘸一拐地出来。她把他介绍给劳拉小姐，又请他到家里一起喝茶。马克斯韦尔先生说，自己非常乐意。伍德太太却笑着提醒他，出发以前最好先把口袋全掏空。上回他去家里做客，口袋里竟有一只小癞蛤蟆跳了出来。她可不想喝茶的时候，又看见小蛤蟆从他身上蹦上自家的茶桌。
