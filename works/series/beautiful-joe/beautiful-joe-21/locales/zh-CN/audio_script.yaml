audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    maxwell:
      display_name: 马克斯韦尔先生
      tts:
        delivery: 温和风趣，叙事时从容可信
        timbre: 温润清朗
        pace: 适中
        pitch: 中
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 第二十一章　马克斯韦尔先生与哈里先生
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生的外套上有几个松垮垮的大口袋。伍德太太还在说话，他就倚着双拐，抬手挨个拍了拍口袋。
        - id: ch01-b02
          speaker: maxwell
          text: >-
            今天什么也没有。我去参加聚会以前，应该把口袋都掏空了。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            他刚说完，口袋里忽然响起一声尖叫。马克斯韦尔先生这才想起自己的豚鼠，连忙把那只几英寸长、带着斑点的小动物掏出来。
        - id: ch01-b04
          speaker: maxwell
          text: >-
            哎呀，德里，我把你给忘了！可怜的小家伙，我刚才弄疼你了吗？
          emotion: surprised
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            他轻轻安抚着德里。我站在一旁看得出神，因为从没见过像他这样的人。他有一头浓密的鬈发，脸色白皙，简直像个姑娘。就在这时，另一个东西从他口袋里探出脑袋，飞快地冲我吐了一下舌头，又缩了回去。我惊呆了。那东西细长得像男孩子玩的手杖，浑身像青草一样鲜绿，还有一双古怪的亮眼睛。最吓人的是它的舌头，伸出来又收回去，快得像闪电。我心里发慌，忍不住叫起来。
        - id: ch01-b06
          speaker: mrs_wood
          text: >-
            乔，怎么啦？那只小猪不会伤着你的。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            我怕的根本不是豚鼠，所以还是叫个不停。那个绿东西一直探头朝我吐舌头，他们俩却谁也没瞧见。
        - id: ch01-b08
          speaker: mrs_wood
          text: >-
            快到六点了，咱们该回家啦。走吧，马克斯韦尔先生。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            年轻人把豚鼠装回口袋，拿起双拐，跟我们沿着洒满阳光的村街往回走。路过寄宿的人家时，他把豚鼠送了进去，对另一个东西却只字未提。看来，他根本不知道口袋里还藏着它。

            我很喜欢马克斯韦尔先生。虽然腿脚不便，不能像别的年轻人那样到处跑，他还是开朗又快活。他只比劳拉小姐大一点。过了一两个星期，我听他亲口说自己刚满十九岁。他还说，正因为跛了腿，他才格外喜爱动物。动物不会笑话他，不会轻视他，也不会因为他走得慢就失去耐心。它们待他一直很好，所以他爱所有动物，喜欢的人却没有几个。
        - id: ch01-b10
          speaker: maxwell
          text: >-
            我真是越来越健忘了。您听说我最近出的洋相了吗？
        - id: ch01-b11
          speaker: mrs_wood
          text: >-
            没有啊。
        - id: ch01-b12
          speaker: maxwell
          text: >-
            那就好，我还怕全村早传遍了呢。上星期日，我居然把豚鼠带进了教堂。它近来不舒服，去教堂前我正照顾它，就把它放进口袋里暖一暖，结果彻底忘了。那天我又迟到了，后排已经坐满，只能坐到比平常更靠前的地方。唱第一首赞美诗时，我不小心让小家伙撞上座椅。它叫得那个响啊，听着简直像我在杀它。所有人都盯着我，我窘得待不下去，只好离开教堂。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            伍德太太和劳拉小姐都笑了，接着又谈起一些我不感兴趣的事。我没有再听，却始终紧贴着劳拉小姐，生怕那个绿东西伤害她。我很想知道它到底是什么。要是知道它的名字，也许我就不会那么怕了。
        - id: ch01-b14
          speaker: miss_laura
          text: >-
            乔好像有心事。怎么了，我亲爱的老伙计？
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            她伸下小手，我舔了舔，真恨自己不会说话。有时我特别想得到说话的本领，可有时又觉得，那对我未必有多少好处。我恐怕会常常说出傻话来。而且，动物真会说话，人类大概也不会像现在这样喜欢我们了。

            回到屋子时，一桩喜事正在等着大家。游廊上放着一只衣箱，伍德太太一眼看见，轻轻叫出了声。
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            我亲爱的孩子！
          emotion: happy
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            哈里先生果然回来了。他从敞开的门里走出来，抱住母亲亲了亲，又同劳拉小姐和马克斯韦尔先生握手。看样子，两个年轻人早就是朋友。大家在游廊上坐下说话，我伏在劳拉小姐脚边，仔细望着哈里先生。他依旧英俊，面容高贵端正，只是比上次见面年长、沉稳了许多，唇上还多了一撇浅棕色的小胡子。我记得很清楚，他住在费尔波特时，嘴唇上还没有那撇胡子。

            哈里先生很爱母亲和劳拉小姐。他望着马克斯韦尔先生时，神情再严肃也好，只要一转向她们，脸上立刻就亮了。过了一会儿，他困惑地指着我。
        - id: ch01-b18
          speaker: mr_harry
          text: >-
            这是谁家的狗？
        - id: ch01-b19
          speaker: miss_laura
          text: >-
            哈里，你真不认识它了？这是美丽的乔呀，就是你从那个恶毒的送奶人手里救下来的那只狗！
          emotion: surprised
        - id: ch01-b20
          speaker: mr_harry
          text: >-
            真的吗？眼前这只结实健康的狗，竟然就是我们在费尔波特照料过的那团脏兮兮的皮包骨？来吧，伙计。你还记不记得我？
          emotion: surprised
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            我当然记得。我舔着他的手，满怀感激地抬头看他。哈里先生认出我以后，也用那只有力又亲切的手，慢慢抚摸着我。
        - id: ch01-b22
          speaker: mr_harry
          text: >-
            你现在都快算得上英俊了，身子也很壮实。看起来倒挺能打。不过就算它自己想打架，你也不会让它去吧，劳拉？
        - id: ch01-b23
          speaker: miss_laura
          text: >-
            我想我不会。不过真到了非打不可的时候，它可很有本事。
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            哈里先生说完，微笑着看了劳拉小姐一眼。她把我们同詹金斯度过的那个夜晚讲了一遍。哈里先生始终握着我的前爪，一遍遍抚摸我的身子。等劳拉小姐说完，他俯下身来，贴近我低声开口。那时，他的眼睛已经红了，里面闪着泪光。
        - id: ch01-b25
          speaker: mr_harry
          text: >-
            好狗。
          emotion: sad
        - id: ch01-b26
          speaker: maxwell
          text: >-
            这个故事真精彩。下次一定要拿到仁慈会上去讲。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            伍德太太去帮忙准备茶点了，两个年轻人便同劳拉小姐留在游廊上。他们谈完我的事，劳拉小姐又一连问了好些问题，想知道哈里先生的大学生活和纽约之行。他离家的那些日子，并不是一直都在读书。马克斯韦尔先生也有话要问。
        - id: ch01-b28
          speaker: maxwell
          text: >-
            格雷，大学读完以后，你想做什么？
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            我要回来，就在这里安顿下来。
        - id: ch01-b30
          speaker: maxwell
          text: >-
            怎么，你要当农夫？
        - id: ch01-b31
          speaker: mr_harry
          text: >-
            对呀，为什么不呢？
        - id: ch01-b32
          speaker: maxwell
          text: >-
            没什么。我只是一直以为，你会选个专门职业。
        - id: ch01-b33
          speaker: mr_harry
          text: >-
            各种专门职业早就挤满了人，国家需要的农夫却还不够。依我看，没有什么比务农更好，也没有哪种工作更能让人安稳过日子。我不喜欢城市。那里又热又脏，到处是人，高楼一幢压着一幢，人人都急匆匆地往前赶，叫我喘不过气。

            就算我真进了城，也得先卖掉自己在农场里的那份产业，手里不过多出几千美元。你知道，我又不是什么才智过人的巨人，无论干哪一行都不会出人头地。我只会变成一个蹩脚的律师或医生，一辈子住在偏僻的小街上。看不到树木花草慢慢长大，不能照料动物，就连乘车兜风都得花钱。这样的生活我可不要。

            我赞同哈佛大学的艾略特校长。他说，离开乡间的家、搬进城市的人，一万个里也难有一个能从此过得更好。百万富翁住在城里还算舒服，反正随时都能离开。可我越来越觉得，做百万富翁在许多方面都很危险。国家要想安稳，还得靠农夫。他们通常不会穷得一无所有，也不会富得惊人，正好站在两个危险的阶层中间，一边是富豪，一边是赤贫者。
        - id: ch01-b34
          speaker: maxwell
          text: >-
            可大多数农夫过的日子，简直牛马不如。
        - id: ch01-b35
          speaker: mr_harry
          text: >-
            的确是这样。务农生活本来可以很吸引人，现在却连应有的一半都没有做到。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生听了，笑了起来。
        - id: ch01-b37
          speaker: maxwell
          text: >-
            有吸引力的务农生活？格雷，那你给我描画一下吧。
        - id: ch01-b38
          speaker: mr_harry
          text: >-
            第一件事，是从农夫心里拔掉一样东西。它在乡下人心里扎得很深，在城里人心里也一样。普天之下，再没有什么比它更伤害我们的国家。
        - id: ch01-b39
          speaker: maxwell
          text: >-
            什么东西？
        - id: ch01-b40
          speaker: mr_harry
          text: >-
            对金钱的贪欲。农夫想发财，就拼命苦干，最后把身体和精神全都耗垮。身边的年轻人看腻了这种发财的办法，便跑去城市寻找别的出路，至少也要找点快乐。我不相信有多少年轻人活着只为积攒钱财。
        - id: ch01-b41
          speaker: maxwell
          text: >-
            乡下人的确正成群结队地涌进城市。你想用什么办法把他们留下？
        - id: ch01-b42
          speaker: mr_harry
          text: >-
            我要让农场变得特别快活，别人花钱请男孩女孩离开，他们都不肯走。他们当然要干活，还得认真干、卖力干。不过一天的活儿做完，也该痛痛快快玩一玩。他们进城就是为了这个。他们想找消遣，想有人来往，收工以后也想跟一群人聚在一起。年轻男子和年轻姑娘愿意见面，本来就很自然，乡间也完全能做到。

            农夫要是肯少赚一点，把农场置办得小一点，各家的房子便能挨得更近。孩子们有机会彼此来往，还能成立社团和俱乐部，书报也会跟着流传起来。每个农夫都应该订五六份报纸，再订两三种杂志。日子久了，他会明白这笔钱花得值得。最好再立一条法律，命令农夫每天都得去一趟邮局。
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生放声笑了起来。
        - id: ch01-b44
          speaker: maxwell
          text: >-
            那还得再立一条法律，叫他既要改过自新，也得把道路修好。格雷，那些烂路就足以叫你的好计划全部落空。你想想，春汛刚过，又是个漆黑的夜晚，农夫们还要彼此串门。我都看见他们陷在泥里动不了啦，要去的人家却还在一英里以外。
          emotion: happy
        - id: ch01-b45
          speaker: mr_harry
          text: >-
            你说得对，道路的确是个大问题。知道父亲和我是怎么解决的吗？
        - id: ch01-b46
          speaker: maxwell
          text: >-
            不知道。
        - id: ch01-b47
          speaker: mr_harry
          text: >-
            我们实在受够了。附近的农夫花了太多时间讨论修路。有人坚持该听工程师的，有人又说农夫的实际经验才管用。他们还没完没了地争论，到底需要多少台拔树桩的机器，得预备多少把铁锹、多少台碎石机和挖沟机，才能把路修好。最后，我们索性不再参与，自己照管挨着自家土地的道路。

            父亲每年都会雇一队人，把那些路一段一段整修好，所以这里数我们的路最好。我真希望政府能接过修路的事，一次把问题解决。要是乡间也有欧洲某些地方那样平坦顺畅的道路，我们一年到头都能舒舒服服地出门。拉车的牲畜也能多活些年，因为它们不用再费那么大的力气拖动载重了。
