  chapters:
    - id: ch01
      title: MR. MAXWELL AND MR. HARRY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell wore a coat with loose pockets. As Mrs. Wood spoke, he leaned on his crutches and slapped at those pockets with his hands.
        - id: ch01-b02
          speaker: mr_maxwell
          text: >-
            No, I haven't got anything today. I thought I emptied my pockets before I went to the meeting.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Just then, a loud squeal came from his coat.
        - id: ch01-b04
          speaker: mr_maxwell
          text: >-
            Oh, my guinea pig! I forgot all about him. Poor Derry, did I hurt you?
          emotion: surprised
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            He pulled out a little spotted creature only a few inches long and soothed it very tenderly. I stood staring at Mr. Maxwell, because I had never met anyone like him. He had thick, curly hair and a white face, and he looked just like a girl.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            While I watched him, something else peeped out of one pocket. It flicked its tongue at me so quickly that I could hardly see it, then vanished again. I was thunderstruck. I had never seen such a creature. It was long and thin like a boy's cane, bright green like grass, with strange, shining eyes. Its tongue was the strangest thing of all. It flashed in and out like lightning. I felt uneasy, and I began to bark.
        - id: ch01-b07
          speaker: mrs_wood
          text: What's wrong, Joe? That little pig won't hurt you.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            But I was not afraid of the guinea pig, so I kept barking. All the while, that strange living thing raised its head and darted its tongue at me. Neither Mrs. Wood nor Mr. Maxwell noticed it.
        - id: ch01-b09
          speaker: mrs_wood
          text: It's nearly six. We should go home now. Come along, Mr. Maxwell.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            The young man put the guinea pig back in his pocket, picked up his crutches, and set off with us down the sunny village street. When we passed his boardinghouse, he left the guinea pig there. He said nothing about the other creature. I knew he had no idea it was hiding in his coat.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            I liked Mr. Maxwell very much. His lameness kept him from running around like other young men, but he was still cheerful and full of life. He seemed a little older than Miss Laura. A week or two later, I heard him tell her on the veranda that he was only nineteen. He also said being lame had taught him to love animals. They never laughed at him, ignored him, or lost patience when he could not walk quickly. Animals were always kind to him. He loved them all, though he liked very few people.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            As he limped along that day, he turned to Mrs. Wood.
        - id: ch01-b13
          speaker: mr_maxwell
          text: >-
            I'm growing more absent-minded every day. Have you heard what I did most recently?
        - id: ch01-b14
          speaker: mrs_wood
          text: No, I haven't.
        - id: ch01-b15
          speaker: mr_maxwell
          text: >-
            Good. I was afraid the whole village would know by now. Last Sunday, I went to church with my poor guinea pig in my pocket. He had been ill, and I was caring for him before church. I tucked him in there to keep him warm, then completely forgot him.
        - id: ch01-b16
          speaker: mr_maxwell
          text: >-
            I arrived late, and all the back seats were taken, so I had to sit farther forward than usual. During the first hymn, I accidentally bumped Piggy against the side of the seat. What a terrible squeal he gave! Anyone would have thought I was murdering him. Everyone stared at me, and I had to leave the church in dreadful embarrassment.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Mrs. Wood and Miss Laura laughed. Then the others began discussing things that did not interest me, so I stopped listening. Still, I stayed close beside Miss Laura. I was afraid the green creature might hurt her, and I kept wondering what it was called. Perhaps I would not have feared it so much if I had known what it was.
        - id: ch01-b18
          speaker: miss_laura
          text: >-
            Something is troubling Joe. What is it, dear old fellow?
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            We had reached the lane. Miss Laura lowered her little hand, and I licked it. How I wished I could speak! Sometimes I long for the gift of speech. Then I think how little good it might do me, and how many foolish things I would probably say. I do not believe people would love animals quite as much if we could talk.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            When we came to the house, a happy surprise was waiting. A trunk stood on the veranda. The moment Mrs. Wood saw it, she gave a little cry.
        - id: ch01-b21
          speaker: mrs_wood
          text: My dear boy!
          emotion: happy
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Mr. Harry was truly there. He stepped through the open door, took his mother in his arms, and kissed her. Then he shook hands with Miss Laura and Mr. Maxwell, who was clearly an old friend. They all sat on the veranda. I lay at Miss Laura's feet and studied Mr. Harry.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            He was a handsome young man with a noble face. He looked older and more serious than when I had last seen him. Now he had a light brown mustache that had not been there in Fairport. He was very fond of his mother and Miss Laura. His face might look grave when he spoke to Mr. Maxwell, but it always brightened when he turned toward them.
        - id: ch01-b24
          speaker: mr_harry
          text: What dog is that?
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            He pointed at me with a puzzled look.
        - id: ch01-b26
          speaker: miss_laura
          text: >-
            Why, Harry! Don't you recognize Beautiful Joe? You rescued him from that horrible milkman.
          emotion: surprised
        - id: ch01-b27
          speaker: mr_harry
          text: >-
            Can this healthy fellow really be that filthy bundle of skin and bones we cared for in Fairport? Come here, sir. Do you remember me?
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            Indeed I did. I licked his hands and looked gratefully into his face.
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            You're almost handsome now, and you're solidly built, too. You look like a fighter. But I suppose you wouldn't allow him to fight, even if he wanted to, Laura.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            He stroked me with a firm, kind hand, then smiled at Miss Laura.
        - id: ch01-b31
          speaker: miss_laura
          text: >-
            No, I don't think I would. But he can fight when he truly needs to.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            She told him about our night with Jenkins. While she spoke, Mr. Harry held my paws and stroked me again and again. When the story was over, he lowered his head toward me. His eyes were red and shining.
        - id: ch01-b33
          speaker: mr_harry
          text: Good dog.
          emotion: sad
        - id: ch01-b34
          speaker: mr_maxwell
          text: >-
            That's a splendid story. We must tell it at the Band of Mercy.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Mrs. Wood had gone inside to help prepare tea, leaving the two young men with Miss Laura. Once they had finished talking about me, Miss Laura asked Mr. Harry many questions about college and his trip to New York. He had not spent all his time away studying.
        - id: ch01-b36
          speaker: mr_maxwell
          text: >-
            What will you do with yourself, Gray, when you finish college?
        - id: ch01-b37
          speaker: mr_harry
          text: I'm coming straight back here to stay.
        - id: ch01-b38
          speaker: mr_maxwell
          text: What, to become a farmer?
        - id: ch01-b39
          speaker: mr_harry
          text: Yes. Why shouldn't I?
        - id: ch01-b40
          speaker: mr_maxwell
          text: No reason. I only thought you would enter a profession.
        - id: ch01-b41
          speaker: mr_harry
          text: >-
            There are already too many people in the professions, and the country needs more farmers. To my mind, nothing compares with farming. No other work gives you a more dependable living. And I dislike cities. The heat, dust, crowds, towering buildings, and endless rush leave me gasping for breath.
        - id: ch01-b42
          speaker: mr_harry
          text: >-
            Suppose I did move to a city. I would sell my share of the farm and have a few thousand dollars. You know I'm no great scholar. I would never become important in any profession. I would end up as a poor lawyer or doctor on some back street. I would spend my whole life without watching a tree or flower grow, caring for an animal, or even taking a drive unless I paid for it. No, thank you.
        - id: ch01-b43
          speaker: mr_harry
          text: >-
            President Eliot of Harvard says that hardly one person in ten thousand truly improves his life by leaving a country home for the city. I agree with him. A millionaire may enjoy city life, because he can always escape it. But I'm beginning to think being a millionaire is dangerous in more ways than one.
        - id: ch01-b44
          speaker: mr_harry
          text: >-
            I believe farmers hold the safety of the country in their hands. They are rarely extremely poor or extremely rich. We stand between those two dangerous groups, the wealthy and the paupers.
        - id: ch01-b45
          speaker: mr_maxwell
          text: But most farmers live terribly hard lives.
        - id: ch01-b46
          speaker: mr_harry
          text: >-
            They do. Farming isn't made half as pleasant as it ought to be.
        - id: ch01-b47
          speaker: beautiful_joe
          text: Mr. Maxwell smiled.
        - id: ch01-b48
          speaker: mr_maxwell
          text: Pleasant farming? Give me an outline of that, Gray.
        - id: ch01-b49
          speaker: mr_harry
          text: >-
            First, I would pull one thing out of the farmer's heart. It is planted just as firmly in him as it is in his brother from the city, and it harms our nation more than anything else under the sun.
        - id: ch01-b50
          speaker: mr_maxwell
          text: And what is it?
        - id: ch01-b51
          speaker: mr_harry
          text: >-
            The thirst for gold. A farmer wants to grow rich, so he works until he wears out both body and soul. The young people around him become disgusted with that way of making money. They leave for the cities to find another way, or at least to enjoy themselves. I don't believe many young people are driven by a wish to pile up money.
        - id: ch01-b52
          speaker: beautiful_joe
          text: Mr. Maxwell looked amused.
        - id: ch01-b53
          speaker: mr_maxwell
          text: >-
            People certainly are pouring out of the countryside and into the cities. How would you stop them?
        - id: ch01-b54
          speaker: mr_harry
          text: >-
            I would make the farm so pleasant that no amount of money could persuade the boys and girls to leave. They would work, and work hard. But when the work was done, I would let them enjoy themselves. That is what draws them to the city. After working, they want amusement, company, and a crowd to join. Young men and women naturally want to spend time together, and they could do that in the country.
        - id: ch01-b55
          speaker: mr_harry
          text: >-
            If farmers accepted smaller profits and smaller farms, their homes could stand closer together. Their children would have more chances to meet. They could form societies and clubs, and books and other reading would spread among them. A farmer ought to receive five or six newspapers and two or three magazines. In the end, the cost would repay him. There ought to be a law that makes him visit the post office every day.
        - id: ch01-b56
          speaker: beautiful_joe
          text: Mr. Maxwell burst out laughing.
        - id: ch01-b57
          speaker: mr_maxwell
          text: >-
            Then make another law that forces him to repair his roads while he reforms his habits. Gray, bad roads would finish every fine plan you've described. Just imagine farmers trying to visit one another on a dark evening after a spring flood. I can see them stuck deep in the mud, with the house still a mile away.
          emotion: happy
        - id: ch01-b58
          speaker: mr_harry
          text: >-
            That's true. Roads are a serious problem. Do you know how Father and I handle ours?
        - id: ch01-b59
          speaker: mr_maxwell
          text: No. How do you do it?
        - id: ch01-b60
          speaker: mr_harry
          text: >-
            We became tired of the whole business. The farmers here spent endless hours debating the art of road building. Should engineers decide how to do it, or should practical farmers? How many stump pullers would we need? How many shovels, stone crushers, and ditching machines would keep the roads in order? They even argued over exactly how many of each machine the work would require. They went on and on, so Father and I simply withdrew from it all.
        - id: ch01-b61
          speaker: mr_harry
          text: >-
            Now we maintain our own roads. Once a year, Father hires a group of men and repairs every part of the road beside our land. Our roads are the best roads anywhere around here. I wish the government would take charge of road building and settle the matter.
        - id: ch01-b62
          speaker: mr_harry
          text: >-
            If we had good, smooth country roads like the ones in some parts of Europe, we could travel comfortably all year. Our draft animals would last longer, too, because pulling their loads would not demand so much strength.
