audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，关切中自有力量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快顽皮，爱开玩笑
        timbre: 明亮的少年嗓音
        pace: 稍快
        pitch: 中
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 温和明理，平静中带着坚定
        timbre: 温暖清晰
        pace: 从容
        pitch: 中
    mrs_montague:
      display_name: 蒙塔古太太
      tts:
        delivery: 文雅娇柔，情绪流露自然
        timbre: 轻柔纤细
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 第五章　我的新家和一位自私的太太
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我想，再没有哪条狗能找到比我更幸福、更温暖的新家了。有人细心照料，给我可口又充足的食物，还有一句句温柔亲切的话。只过了一个星期，我的伤就差不多好了。哈里先生回去以前，每天都替我清洗疼痛的耳朵和尾巴，再仔细把伤口包好。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            有一天，哈里先生和男孩们在马厩里给我洗澡。他们搬来一盆温水，把我抱进去，让我站在里面。我一生从没洗过澡，水一道道淌过全身，那滋味古怪极了。劳拉小姐站在一旁笑，不住鼓励我，叫我别害怕那些水。我却一直在想，要是詹金斯看见我站在澡盆里，会说什么呢？
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            来到莫里斯家的第二天，杰克领着其他男孩跑进马厩。他拿着一张报纸，大家又笑又闹，他便念起了六月三日的《费尔波特日报》。报上说，詹姆斯·詹金斯因为残忍折磨并伤害一条狗，当天早晨在警察法庭受审，被罚十美元，还得付诉讼费。
        - id: ch01-b04
          speaker: jack
          text: >-
            乔，你觉得怎么样？两只耳朵一只值五美元，尾巴白送。法律就觉得它们值这么点儿钱。詹金斯痛快过了，你却要顶着四分之三条狗的模样过一辈子。换成我，就把这种恶棍捆起来，用鞭子抽，让他们自己也留下些伤疤。等我当上总统吧！
          emotion: angry
        - id: ch01-b05
          speaker: jack
          text: >-
            老伙计，后面还有，你听。记者去了詹金斯家，发现房子、院子和马厩脏得没法形容。他的马瘦得只剩骨头，身上还有挨打的伤。母牛裹满泥污，浑身生虫。报纸还问，卫生巡视员跑到哪里去了，怎么不严加看管这种地方？让这样一个脏地方出产的牛奶在镇上卖，所有人的健康都会受到威胁。
        - id: ch01-b06
          speaker: jack
          text: 记者还查出，詹金斯的名声坏透了。已经有人想办法，要让他的妻子和孩子离开他。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            杰克把报纸扔进我的箱子。男孩们一起为《费尔波特日报》欢呼了三声，接着全跑了。我真高兴。我已经从詹金斯手里逃出来了，这件事对我倒不那么要紧。可现在，他那些残忍的行径全被人发现，往后总会有人约束他。可怜的托比和母牛们，也能过上更好、更安稳的日子。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            现在该说说莫里斯一家了。莫里斯先生是牧师，在费尔波特的一座教堂里讲道。家里还有他的妻子莫里斯太太、长女劳拉，以及杰克、内德、卡尔和威利。我觉得，这家人能这样好，很大一部分是因为莫里斯太太本身就是一位好太太。她爱丈夫，也爱孩子，总是尽力让他们过得幸福。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            莫里斯先生非常忙，很少过问家务。家里该做什么，不该做什么，都由太太决定。那时我还年轻，却已经觉得她十分聪明。这个家从不吵闹，也不混乱。每天要做的事情虽然很多，一切却总能顺顺当当、和和气气地办完。更不会像詹金斯家那样，动不动就有人发火责骂。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            莫里斯太太花钱很谨慎。男孩们想买糖果、冰激凌、贵重的玩具，或者别的馋人东西，就得先告诉她为什么要买。要是只为满足自己，她的回答很坚决。
        - id: ch01-b11
          speaker: mrs_morris
          text: 孩子们，不行。我们家不富裕，钱要留着供你们读书，不能拿来买这些没用的东西。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            可他们要买书，要添置东西让宠物过得舒服些，或者需要户外游戏用的东西，她总愿意给钱。她并不是舍不得花钱，而是要看钱花在什么地方。至于她怎样教养孩子，我说不出她自己说得那么清楚。还是让我讲一段谈话吧。那是我刚搬到华盛顿街不久，她和一位来访的太太说过的话。
        - id: ch01-b13
          speaker: beautiful_joe
          text: 我正好也在屋里。其实，我大半时间都待在屋里。有一天，杰克看见我跟完这个又跟那个，还总是严肃地望着他们，忍不住问起来。
        - id: ch01-b14
          speaker: jack
          text: 这条狗怎么到处慢吞吞地转悠，一会儿跟着这个，一会儿跟着那个，还一直那么认真地盯着我们？
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            我真想告诉他，我看惯了动物挨踢受踩，一时适应不了这样的变化。这里的一切好得不像真的。我甚至不敢相信，不会说话的动物也能有自己的权利。只要人们还这样善待我，我就想一直陪在他们身边。劳拉小姐明白。她把我的头拉到膝上，俯下脸来。
        - id: ch01-b16
          speaker: miss_laura
          text: >-
            你喜欢跟我们待在一起，对不对，乔？那就在屋里待着，想待多久都行。杰克只是说话冲，他并不介意。等你跟我们待腻了，就去花园找吉姆，好好玩一场。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            现在回到那段谈话。六月里一个晴朗的日子，莫里斯太太坐在窗边的摇椅上做针线。我坐在她身旁的矮凳上，正好可以望见街道。狗和人一样，也喜欢变化和热闹，也爱看看屋外正在发生什么。这时，一辆马车驶到门前停下，一位衣着华贵的太太下了车，沿着台阶走上来。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            莫里斯太太很高兴地招呼她，称她为蒙塔古太太。客人身上带着一股好闻的香气，我立刻有了好感，便坐到她附近的壁炉地毯上。她们先聊了些我听不懂的事，后来，她注意到了我。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            她举起挂在颈间的镜片，隔着它打量我，还把漂亮的裙子收到一旁，怕我碰着。我马上不再喜欢那股香气，走回莫里斯太太脚边，把身体挺得笔直。可客人的目光还跟着我。
        - id: ch01-b20
          speaker: mrs_montague
          text: 请原谅，莫里斯太太。您这条狗的模样，实在有点奇怪。
        - id: ch01-b21
          speaker: mrs_morris
          text: 是的，他确实算不上一条漂亮的狗。
        - id: ch01-b22
          speaker: mrs_montague
          text: 他是新来的，对吗？那这样一算，您家里就有……
        - id: ch01-b23
          speaker: mrs_morris
          text: >-
            两条狗、一只猫、十五到二十只兔子、一只白鼠、十来只金丝雀、二十四条金鱼，不知道多少只鸽子，再加上几只矮脚鸡和一只天竺鼠。嗯，我想应该没有别的了。
        - id: ch01-b24
          speaker: beautiful_joe
          text: 两个人都笑了。
        - id: ch01-b25
          speaker: mrs_montague
          text: >-
            您这里都快成动物园了。我父亲从不许孩子养宠物。他说，女孩子在屋里跟猫追来跑去，会变得粗野吵闹。男孩子要是走到哪儿都带着狗，也会像一群小流氓。
        - id: ch01-b26
          speaker: mrs_morris
          text: 我的孩子跟宠物一起玩，我倒没见他们因此变得更加粗野。
        - id: ch01-b27
          speaker: mrs_montague
          text: >-
            我想也是。您的儿子们是费尔波特最有教养的少年，劳拉更是个十足的小淑女。我很喜欢他们去看查理。他们能让查理活泼起来，又不会把他带坏。
        - id: ch01-b28
          speaker: mrs_morris
          text: 上次去您家，他们也玩得很开心。说起来，我听他们商量过，想给查理弄一条狗。
        - id: ch01-b29
          speaker: mrs_montague
          text: 哎呀，请您劝他们别这么做。我不能答应。我讨厌狗。
          emotion: disgusted
        - id: ch01-b30
          speaker: mrs_morris
          text: 您为什么讨厌狗呢？
        - id: ch01-b31
          speaker: mrs_montague
          text: 狗太脏了，总有一股味道，身上还生虫子。
          emotion: disgusted
        - id: ch01-b32
          speaker: mrs_morris
          text: >-
            狗和孩子有点相像。想让他干净讨人喜欢，就要好好照料他。这条狗的皮肤和你我的一样干净。乔，别动。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            莫里斯太太把我背上的毛逆着拨开，让蒙塔古太太看清楚。我的皮肤是粉红色的，干干净净，没有一点尘土。客人看我的眼神亲切了些，甚至把几根指尖伸到我面前。我没有舔她，只凑过去闻了闻。她随即又把手收了回去。
        - id: ch01-b34
          speaker: mrs_morris
          text: >-
            您不像我这样接触过这些地位比我们低微的生灵。我简单说说吧。教养孩子，特别是几个儿子的时候，这些不会说话的动物帮了我很大的忙。刚结婚那几年，我常和丈夫走访纽约的贫民窟。每次回家，看见两个小宝贝躺在床上，我都会问他，我们怎样才能不让孩子染上自私这种世间的祸害？
        - id: ch01-b35
          speaker: mrs_morris
          text: >-
            他总说，让孩子为自己以外的人做些事情。我一直照这个道理去做。劳拉天性无私。她还很小的时候，要是我们不留心，会把食物从自己嘴里拿出来，塞进杰克嘴里。她从不让我操心。可男孩们生来就自私，自私得让人厌烦，甚至让人恶心。
        - id: ch01-b36
          speaker: mrs_morris
          text: >-
            他们在许多方面都是好孩子。长大一些以后，待人有礼，服从管教，东西收拾得不算乱，也不特别粗野。可他们心里只有自己，个个只替自己打算，还常为了各自的权益争吵。那时我们住在纽约，只有一个小后院。搬到这里以后，我决定试一个办法。
        - id: ch01-b37
          speaker: mrs_morris
          text: >-
            我们选这所房子，就是因为它有大花园，还有一间能让男孩们玩耍的马厩。我把他们叫到一起，认真谈了一次。我告诉他们，我不喜欢他们那种生活。他们从早到晚只顾自己，从不为别人做事。就连我请他们跑个腿，他们也很不情愿。
        - id: ch01-b38
          speaker: mrs_morris
          text: >-
            我知道他们每天要上学，可课外还有很多时间，可以拿来帮助别人。我问，照这样下去，他们能不能长成真正勇敢、有基督信仰的男子汉。他们说不能。我又问该怎么办，他们便回答，母亲，您告诉我们吧，我们照着做。
        - id: ch01-b39
          speaker: mrs_morris
          text: >-
            于是我定下一些任务。一辈子里的每一天，每个人都要为自己以外的人做一件事。他们全答应了，请我分派。要是买得起，我会买一匹马和一头牛，让他们照料。可家里负担不起，我只好给杰克买一对兔子，给卡尔买一对金丝雀，给内德买鸽子，给威利买几只矮脚鸡。
        - id: ch01-b40
          speaker: mrs_morris
          text: >-
            我把这些小生命带回家，交给男孩们供养。他们高兴极了，四处忙着给宠物找食物、搭住处，还去跟别的男孩商量办法。那副模样真有趣。最后，我对这个尝试非常满意。照料这些不会说话的生灵，让我的儿子们懂得无私，也学会了体贴。
        - id: ch01-b41
          speaker: mrs_morris
          text: >-
            他们宁可自己不吃早饭去上学，也不让马厩里的动物挨饿。学校给他们知识，照料动物又教给他们仁爱，也教育了他们的心。这些事还让他们愿意留在家里。以前，他们总在街角流连，跟别的男孩闲晃，说些无聊的话，有时甚至比无聊更糟，我一直很担心。
        - id: ch01-b42
          speaker: mrs_morris
          text: >-
            现在他们有事做了，一个个成了忙碌的小管事。他们在马厩里敲敲打打，修箱子、修隔板，或者动手清扫。派他们出去办事，他们办完就直接回家。当然，我们没有夺走他们的自由。他们仍会打棒球、踢橄榄球，也会去树林远足。只是家里有许多事，除非有明确的目的，他们不会随意跑出去。
        - id: ch01-b43
          speaker: beautiful_joe
          text: 蒙塔古太太一直向前探着身子，专心听她说话。等莫里斯太太讲完，她轻声开了口。
        - id: ch01-b44
          speaker: mrs_montague
          text: 谢谢你告诉我这些。我要给查理买一条狗。
        - id: ch01-b45
          speaker: mrs_morris
          text: >-
            听见您这样说，我很高兴。这对查理会有好处。我不愿自己的儿子身边没有一条忠实的好狗。孩子能从狗身上学到许多东西。这一条就能给许多人做榜样。他耐心、安静，又听话。我丈夫说，他叫人想起《圣经》里的三个词，历尽许多患难。
        - id: ch01-b46
          speaker: mrs_montague
          text: 他为什么这样说？
        - id: ch01-b47
          speaker: mrs_morris
          text: 因为他是从一个非常不幸的家里来到我们身边的。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            接着，莫里斯太太把她所知道的、我早年那些不幸的遭遇，一件件讲给朋友听。等她停下来，蒙塔古太太满脸震惊，也满脸痛苦。
        - id: ch01-b49
          speaker: mrs_montague
          text: >-
            世上竟然有詹金斯那样的人，想起来真可怕。您还说他有妻子和孩子。莫里斯太太，请坦白告诉我，费尔波特有很多这样不幸的家庭吗？
          emotion: sad
        - id: ch01-b50
          speaker: beautiful_joe
          text: 莫里斯太太迟疑了一会儿，才郑重地回答。
        - id: ch01-b51
          speaker: mrs_morris
          text: >-
            我亲爱的朋友，我们这座小镇一个夜晚会发生多少邪恶、残忍和卑劣的事。要是您全看见了，躺在床上也无法安睡。
        - id: ch01-b52
          speaker: mrs_montague
          text: 我做梦也没想到，事情会糟到这种地步。我们比别的城镇更坏吗？
          emotion: surprised
        - id: ch01-b53
          speaker: mrs_morris
          text: >-
            不，并不更坏，可也已经够糟了。世上一半的人不知道另一半怎样生活，这句话总是真的。那些苦难怎么能触到您呢？您住在镇外漂亮的宅子里。进城以后，只是坐车四处走走，买东西，拜访朋友，然后回家。您不到最贫困的街道去，那里的人也不会来见您。您有钱，祖辈也有钱，一直过着与他们隔绝的生活。
        - id: ch01-b54
          speaker: mrs_montague
          text: >-
            可那不对呀。最近我一直在想这件事。报纸上常写下层穷人的苦难，我读过很多。我觉得，我们这些富裕的人应该帮帮他们。莫里斯太太，我能做什么呢？
          emotion: sad
        - id: ch01-b55
          speaker: beautiful_joe
          text: 莫里斯太太眼里涌出泪水。她看着面前这位瘦弱娇小的太太，朴实地说了下去。
        - id: ch01-b56
          speaker: mrs_morris
          text: >-
            亲爱的蒙塔古太太，一切的根本就在这里。主让我们成为一家人，我们都是兄弟姐妹。地位最低微的女人，也是你我的姐妹。躺在水沟里的男人，也是我们的兄弟。这个大家庭里，有些人过得不如我们，我们该怎样帮他们呢？哪怕只剩最后一块面包，也该分给他们。
        - id: ch01-b57
          speaker: mrs_morris
          text: >-
            你我只是蒙了上帝的恩典，才被安放在不同的境遇里。不然，我们也可能处在他们的位置。要是无视这一点，我们就是在恶意失职，甚至是在犯罪。
        - id: ch01-b58
          speaker: mrs_montague
          text: 是的，是的。我不能不这样想。请告诉我一件能做的事，让我去帮助一个人吧。
          emotion: sad
        - id: ch01-b59
          speaker: beautiful_joe
          text: 莫里斯太太靠回椅背，神情十分悲伤。可她望着客人时，眼里又有几分欣慰。
        - id: ch01-b60
          speaker: mrs_morris
          text: >-
            替您洗衣服的女人，丈夫酗酒，还有一个残疾的儿子。我常看见她站在洗衣盆前，替您洗那些精致的薄棉布和花边，眼泪一滴滴落进水里。
        - id: ch01-b61
          speaker: mrs_montague
          text: 那我再也不送衣物给她洗了，免得她受累。
        - id: ch01-b62
          speaker: beautiful_joe
          text: 莫里斯太太忍不住笑了。
        - id: ch01-b63
          speaker: mrs_morris
          text: >-
            是我没说清楚。让她痛苦的不是洗衣服，是那个会打她的丈夫，还有让她忧心的儿子。要是你我不再把活交给她，她赖以生活的钱便少了一份，反而会受更多苦。她勤劳能干，靠自己的本事挣得一份还过得去的收入。
        - id: ch01-b64
          speaker: mrs_morris
          text: >-
            我也不建议您直接给钱。她丈夫一旦发现，就会把钱抢走。她真正需要的是同情。您可以偶尔去看看她，陪她说话，给那个可怜又愚钝的孩子念点东西，或者让他看看图画书。只要让她知道您关心她，她就会十分感激，也能多一份力量，走过那条凄苦的路。
        - id: ch01-b65
          speaker: mrs_montague
          text: 我明天就去看她。您还能想到别的人，让我去探望吗？
        - id: ch01-b66
          speaker: mrs_morris
          text: >-
            能想到很多，不过您最好别一下子做得太多。我会给您三四户穷苦人家的地址。偶尔去探望一次，就能带去很大的帮助。但您要像对待富裕的朋友那样对待他们。弄清他们需要什么以前，不要给太多钱，也不要送太多东西。
        - id: ch01-b67
          speaker: mrs_morris
          text: >-
            您要真心关怀他们，了解他们怎样生活，准备怎样安排孩子。要是能帮孩子找到工作，就帮上一把。还有一件事一定要记住，贫穷并不一定会夺走一个人的自尊。
        - id: ch01-b68
          speaker: mrs_montague
          text: 我会的，我一定会的。您什么时候能把地址给我？
        - id: ch01-b69
          speaker: beautiful_joe
          text: 莫里斯太太又笑了。她从针线篮里取出纸笔，写下几行字，递给蒙塔古太太。客人站起身，准备告辞。莫里斯太太陪她走向门口。
        - id: ch01-b70
          speaker: mrs_morris
          text: >-
            还有狗的事。要是您决定让查理养一条，最好叫他过来，和我家的男孩们商量一下。镇上有哪些狗正在出售，他们好像全知道。
        - id: ch01-b71
          speaker: mrs_montague
          text: 谢谢您，我很乐意。他会有自己的狗。什么时候让他过来合适？
        - id: ch01-b72
          speaker: mrs_morris
          text: 明天、后天，哪一天都行。只要您不反对，就让他跟男孩们过一个下午，再一起吃过晚饭吧。
        - id: ch01-b73
          speaker: mrs_montague
          text: 那再好不过了。
        - id: ch01-b74
          speaker: beautiful_joe
          text: >-
            这位娇小的太太笑着欠了欠身，又俯下来拍了拍我，随后轻快地走下台阶，坐上马车离开了。莫里斯太太站在门前，一直望着马车远去，脸上容光焕发。我开始觉得，只要和蒙塔古太太多相处些时候，多了解她一点，我也会喜欢她。
        - id: ch01-b75
          speaker: beautiful_joe
          text: >-
            两天以后，我就完全确定了，因为她真的送来了一份喜欢我的证明。她的小儿子查理到家里来，特意给我带了一个用白纸包好的东西。莫里斯太太替我打开，里面是一条漂亮的镀镍项圈，上面还刻着我的名字，美丽的乔。我看见以后，真是高兴极了！
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            男孩们解下我刚来时给我系上的那根破旧小皮带，换上了新项圈。莫里斯太太又把我抱到镜子前，让我好好看看自己的样子。我觉得幸福极了。以前，我总有点羞于自己被割掉的耳朵和尾巴。可如今戴上这条漂亮的新项圈，我在任何一条狗面前都能昂起头来。
        - id: ch01-b77
          speaker: mrs_morris
          text: 老乔，前几天你帮了我的忙，让那位娇小的太太开始走出自私的生活。你做了一件好事。
        - id: ch01-b78
          speaker: beautiful_joe
          text: >-
            她用双手紧紧捧住我的头。我倒不明白自己帮了什么忙，只知道蒙塔古太太送了我新项圈，我非常感激她。从那以后，在街上遇见她，我总会停下来望着她。有时她看见我，会叫马车停下，跟我说几句话。
        - id: ch01-b79
          speaker: beautiful_joe
          text: >-
            可不管她有没有看见，只要我见到她，就会摇起尾巴。说准确些，是摇起身子，因为我已经没有尾巴可摇了。她的儿子后来养了一条漂亮的爱尔兰塞特犬，名叫布里斯克。它有绸缎般的毛和温柔的棕色眼睛，小主人似乎非常疼爱它。
