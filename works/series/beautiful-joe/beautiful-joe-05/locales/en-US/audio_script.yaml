  chapters:
    - id: ch01
      title: MY NEW HOME AND A SELFISH LADY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I don't believe any dog could have found a happier home than I did. After a week of careful nursing, good food, and kind voices, I was nearly well. My wounds still needed attention, but every day I grew stronger. Until Harry went home, he washed my sore ears and tail and dressed them carefully each day.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            One day, Harry and the boys bathed me in the stable. They brought out a tub of warm water and stood me in it. I had never had a bath before, and the water running all over me felt very strange. Laura stood nearby, laughing and telling me not to mind. I couldn't help wondering what Jenkins would have said if he had seen me in that tub.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Two days after I came to the Morrises, Jack rushed into the stable with all the other boys behind him. He carried a newspaper, and amid much laughter and joking, he read me a report from the Fairport Daily News dated June third. It said that James Jenkins had appeared in police court that morning for cruelly torturing and mutilating a dog. His punishment was a ten-dollar fine, plus court costs.
        - id: ch01-b04
          speaker: jack
          text: >-
            What do you think of that, Joe? Five dollars for each ear, and your tail counts for nothing. That's all the law thinks they're worth. Jenkins had his fun, and now you'll spend your life looking like three quarters of a dog. If I made the law, I'd tie men like him up and whip them until they carried a few scars themselves. Just wait until I'm president!
          emotion: angry
        - id: ch01-b05
          speaker: jack
          text: >-
            But listen, old fellow. There's more. A reporter went to Jenkins's place and found the house, yard, and stable filthy beyond description. His horse was thin and bore the marks of abuse. His cows were caked with mud and dirt and covered in vermin. The paper asked where the health inspector was and why he had not watched places like this more carefully. Letting milk from such a dirty farm be sold in town was putting everyone's health at risk.
        - id: ch01-b06
          speaker: jack
          text: >-
            The reporter also learned that Jenkins had a very bad reputation. People were already taking steps to remove his wife and children from him.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Jack tossed the paper into my box. Then he and the boys gave three cheers for the Daily News and ran off. I was so glad. I had escaped Jenkins, so the news mattered less for me. But now everyone knew what a cruel man he was. Someone would hold him back, and poor Toby and the cows would have a happier life.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            Now I should tell you about the Morris family. Mr. Morris was a clergyman who preached at a church in Fairport. There was his wife, Mrs. Morris, then Laura, the eldest child, and the boys, Jack, Ned, Carl, and Willie. It was a full household. I think they were such a good family largely because Mrs. Morris was such a good woman. She loved her husband and children and did everything she could to make them happy.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Mr. Morris was very busy and seldom took part in household matters. Mrs. Morris decided what should and should not be done. Even as a young dog, I thought she was very wise. The house was never noisy or confused. There was plenty of work, but it all moved along smoothly and pleasantly. No one flew into angry scolding fits as people had at the Jenkins home.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Mrs. Morris was careful with money. When the boys wanted coins for candy, ice cream, costly toys, or other things boys often long for, she asked why they wanted them. If their reason was selfish, her answer was firm.
        - id: ch01-b11
          speaker: mrs_morris
          text: >-
            No, children. We aren't rich, and we must save for your education. I can't buy you foolish things.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            But when they asked for books, she willingly found the money. She did the same when they wanted to make their pets more comfortable or needed something for an outdoor game. She was not against spending. She wanted their money to serve a worthwhile purpose. I cannot explain her ideas about raising children as clearly as she could, so I will tell you about a conversation she had with a visitor soon after I came to Washington Street.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            I happened to be inside that day. In fact, I spent most of my time in the house. Once Jack watched me following one person and then another, looking at everyone with solemn eyes.
        - id: ch01-b14
          speaker: jack
          text: >-
            Why does that dog keep stalking around after us and staring at us so seriously?
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            I wished I could explain. For so long, I had seen animals kicked and trampled that I could not grow used to this change. Such kindness seemed too good to be true. I could hardly believe that animals had any rights. Yet while people treated me kindly, I wanted to stay close to them every moment. Laura understood. She drew my head into her lap and bent her face toward mine.
        - id: ch01-b16
          speaker: laura
          text: >-
            You like being with us, don't you, Joe? Stay indoors as much as you want. Jack doesn't mind, even if he sounds sharp. When you grow tired of us, go play with Jim in the garden.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            But let me return to that visit. On a fine June day, Mrs. Morris sat sewing in a rocking chair by the window. I sat beside her on a hassock where I could watch the street. Dogs enjoy variety and excitement, and we like seeing what happens outdoors just as people do. From my seat I could follow all the movement beyond the window. A carriage stopped at the door. A finely dressed lady stepped out and came up the stairs.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Mrs. Morris welcomed her warmly and called her Mrs. Montague. At first, I liked the visitor because she wore a perfume that smelled pleasant to me. I settled on the hearth rug close beside her. The women talked about things I did not understand. Then Mrs. Montague noticed me.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            She peered at me through a little glass hanging from a chain around her neck. Then she pulled her beautiful dress aside so I could not touch it. I stopped caring about her perfume. I moved away and sat very straight and stiff at Mrs. Morris's feet, while the lady kept watching me.
        - id: ch01-b20
          speaker: mrs_montague
          text: >-
            Forgive me, Mrs. Morris, but that is a very odd-looking dog.
        - id: ch01-b21
          speaker: mrs_morris
          text: He certainly isn't handsome.
        - id: ch01-b22
          speaker: mrs_montague
          text: And he's new, isn't he?
        - id: ch01-b23
          speaker: mrs_morris
          text: Yes.
        - id: ch01-b24
          speaker: mrs_montague
          text: So that makes how many animals?
        - id: ch01-b25
          speaker: mrs_morris
          text: >-
            Two dogs, a cat, fifteen or twenty rabbits, a rat, around twelve canaries, two dozen goldfish, more pigeons than I can count, a few bantams, and a guinea pig. I think that's everything.
        - id: ch01-b26
          speaker: beautiful_joe
          text: Both women laughed.
        - id: ch01-b27
          speaker: mrs_montague
          text: >-
            You have a whole menagerie! My father never let any of us keep a pet. He said playing around the house with cats would make his daughters rough and noisy. If his sons walked about with dogs behind them, he thought they would look like rowdies.
        - id: ch01-b28
          speaker: mrs_morris
          text: I've never found that playing with pets makes my children rougher.
        - id: ch01-b29
          speaker: mrs_montague
          text: >-
            No, of course it hasn't. Your boys are the best-mannered lads in Fairport, and Laura is a perfect young lady. I love having them visit Charlie. They bring him to life without making him misbehave.
        - id: ch01-b30
          speaker: mrs_morris
          text: >-
            They enjoyed their last visit very much. By the way, I've heard them talking about finding a dog for Charlie.
        - id: ch01-b31
          speaker: beautiful_joe
          text: Mrs. Montague gave a little shudder.
        - id: ch01-b32
          speaker: mrs_montague
          text: Oh, please tell them not to! I couldn't allow it. I hate dogs.
          emotion: disgusted
        - id: ch01-b33
          speaker: mrs_morris
          text: Why do you hate them?
        - id: ch01-b34
          speaker: mrs_montague
          text: They're filthy. They always smell, and they're covered in vermin.
          emotion: disgusted
        - id: ch01-b35
          speaker: mrs_morris
          text: >-
            A dog is rather like a child. If you want one to be clean and pleasant, you must keep it that way. Joe's skin is as clean as yours or mine. Hold still, Joe.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Mrs. Morris brushed my fur backward and showed her visitor that the skin underneath was pink and free of dust. Mrs. Montague looked at me more kindly. She even offered me the tips of her fingers. I did not lick them. I only sniffed, and she pulled her hand away again.
        - id: ch01-b37
          speaker: mrs_morris
          text: >-
            You haven't lived as closely with animals as I have. Let me tell you how much they have helped me raise my children, especially my boys. When I was newly married, my husband and I worked among the poor neighborhoods of New York. I would come home, look at our two babies in their little beds, and ask him how we could protect them from selfishness, the curse of the world.
        - id: ch01-b38
          speaker: mrs_morris
          text: >-
            He always gave me the same answer: teach them to do something for someone besides themselves. I have tried to live by that advice. Laura was unselfish by nature. Even as a tiny baby, she would take food from her own mouth and put it into Jack's if we did not stop her. I never had to struggle with selfishness in her.
        - id: ch01-b39
          speaker: mrs_morris
          text: >-
            The boys were different. They were born selfish, terribly and tiresomely selfish. They had many good qualities. As they grew, they were respectful and obedient. They weren't messy or especially rough. But each boy thought first of himself, and they quarreled over what each one believed belonged to him.
        - id: ch01-b40
          speaker: mrs_morris
          text: >-
            In New York, we had only a small backyard. When we moved here, I decided to try an experiment. We chose this house partly for its large garden and for the stable, where the boys could play. Then I gathered them for a serious talk.
        - id: ch01-b41
          speaker: mrs_morris
          text: >-
            I told them I was unhappy with the way they lived. From morning until night, they did nothing for anyone but themselves. Even a simple errand for me was done unwillingly. School took part of their day, of course, but they still had plenty of free time. They could use some of it to help somebody else.
        - id: ch01-b42
          speaker: mrs_morris
          text: >-
            I asked whether they thought they could grow into truly good, manly Christian boys while living that way. They admitted they could not. Then I asked what we should do about it. Every one of them answered that I should tell them, and they would do as I said. They were ready to let me choose the plan.
        - id: ch01-b43
          speaker: mrs_morris
          text: >-
            So I gave them a set of duties. Every boy had to do something for another living creature, outside himself, every day of his life. They agreed and asked me to choose the tasks. I could not afford a horse and cow for them to care for. Instead, I bought two rabbits for Jack, two canaries for Carl, pigeons for Ned, and bantams for Willie.
        - id: ch01-b44
          speaker: mrs_morris
          text: >-
            I brought the animals home, placed them in the boys' hands, and told each boy that his creatures depended on him for everything they needed. They were delighted with my choices. It was amusing to watch them hurry about finding food and making shelter for their pets. They held serious discussions among themselves and went to other boys for advice.
        - id: ch01-b45
          speaker: mrs_morris
          text: >-
            In the end, my experiment satisfied me completely. Caring for helpless creatures made my boys thoughtful and unselfish. They would rather go to school without their own breakfast than let any animal in the stable go hungry. School gives them an education of the mind. Their animals add a humane education, an education of the heart.
        - id: ch01-b46
          speaker: mrs_morris
          text: >-
            Their animals also keep them at home. I used to worry when the boys lingered on street corners, dawdled with other boys, and joined in idle talk that was sometimes worse than idle. Now they have something useful to do. Their work matters to living creatures, and they take it seriously. They are little men of business.
        - id: ch01-b47
          speaker: mrs_morris
          text: >-
            They're always building boxes and partitions in the stable or cleaning something. When I send them on an errand, they finish it and come straight home. We haven't taken away their freedom. They still have days for baseball, football, and trips to the woods. But home keeps them busy enough that they leave it only when they have a reason.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            As Mrs. Morris spoke, her visitor leaned forward and listened closely. When the story ended, Mrs. Montague answered in a quiet voice.
        - id: ch01-b49
          speaker: mrs_montague
          text: >-
            Thank you for telling me. I am going to get Charlie a dog.
        - id: ch01-b50
          speaker: mrs_morris
          text: >-
            I'm glad. A dog will be good for your little boy. I would not want my sons to grow up without a faithful dog. Children can learn many lessons from one. Joe here could be an example to plenty of people. He is patient, quiet, and obedient. My husband says Joe reminds him of three words from the Bible: through much tribulation.
        - id: ch01-b51
          speaker: mrs_montague
          text: Why does Joe remind him of that?
        - id: ch01-b52
          speaker: mrs_morris
          text: Because he came to us from a very unhappy home.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            Mrs. Morris told her friend what she knew about my early life. When she finished, Mrs. Montague looked shocked and distressed.
        - id: ch01-b54
          speaker: mrs_montague
          text: >-
            How dreadful that a man like Jenkins can exist! And he has a wife and children. Please tell me honestly, Mrs. Morris. Are there many homes this unhappy in Fairport?
          emotion: sad
        - id: ch01-b55
          speaker: beautiful_joe
          text: Mrs. Morris hesitated for a moment, then answered earnestly.
        - id: ch01-b56
          speaker: mrs_morris
          text: >-
            My dear friend, if you could see all the wickedness, cruelty, and vileness practiced in our little town during a single night, you could not rest in your bed.
          emotion: sad
        - id: ch01-b57
          speaker: beautiful_joe
          text: Mrs. Montague looked dazed.
        - id: ch01-b58
          speaker: mrs_montague
          text: >-
            I never dreamed it was so bad. Is Fairport worse than other towns?
          emotion: surprised
        - id: ch01-b59
          speaker: mrs_morris
          text: >-
            No, it isn't worse than other towns, but it is bad enough. Again and again, one half of the world has no idea how the other half lives. How could their misery reach you? You live in your lovely house outside town. When you come here, you ride through the streets, shop, visit friends, and go home. You never enter the poorest neighborhoods, and the people there never come to you. Your family was rich before you, and you are rich now. Your whole life keeps you apart from them.
        - id: ch01-b60
          speaker: mrs_montague
          text: >-
            But that isn't right. I've been thinking about this lately. The newspapers say so much about the suffering of poor people, and I believe those of us with money should help. What can I do, Mrs. Morris?
          emotion: sad
        - id: ch01-b61
          speaker: beautiful_joe
          text: >-
            Tears rose in Mrs. Morris's eyes. She looked at the small, delicate woman and answered simply.
        - id: ch01-b62
          speaker: mrs_morris
          text: >-
            Dear Mrs. Montague, I believe the heart of it is this. The Lord made us one family. We are all brothers and sisters. The poorest woman is your sister and mine. The man lying in the gutter is our brother. How should we help members of our family who have less than we do? We should share even our last crust of bread.
        - id: ch01-b63
          speaker: mrs_morris
          text: >-
            You and I might have lived in their places if God's grace had not put us in different surroundings. When we ignore that truth, our neglect is not only wrong. It is criminal.
        - id: ch01-b64
          speaker: mrs_montague
          text: >-
            It is. I feel that it is. Please tell me one thing I can do to help someone.
          emotion: sad
        - id: ch01-b65
          speaker: beautiful_joe
          text: >-
            Mrs. Morris leaned back. Her face was very sad, yet there was something like pleasure in her eyes as she looked at her visitor.
        - id: ch01-b66
          speaker: mrs_morris
          text: >-
            Your washerwoman has a drunken husband and a disabled son. I have often seen her standing over her washtub, cleaning your fine muslins and lace while her tears fell into the water.
          emotion: sad
        - id: ch01-b67
          speaker: mrs_montague
          text: >-
            Then I will never send her another thing to wash. She won't have that burden again.
        - id: ch01-b68
          speaker: beautiful_joe
          text: Mrs. Morris could not help smiling.
        - id: ch01-b69
          speaker: mrs_morris
          text: >-
            I didn't make myself clear. Her washing does not trouble her. Her husband beats her, and she worries about her son. If you and I stop giving her work, she will have less money and suffer more. She works hard, she is capable, and she earns a fair living.
        - id: ch01-b70
          speaker: mrs_morris
          text: >-
            I would not give her money, either. Her husband would discover it and take it away. What she needs is sympathy. Visit her now and then and let her see that her life matters to you. Talk to her poor, foolish boy. Read to him, or sit beside him with a picture book. You cannot imagine how grateful she would be. A little personal kindness would give her courage as she goes on along her difficult path.
        - id: ch01-b71
          speaker: mrs_montague
          text: >-
            I will visit her tomorrow. Is there anyone else I could see?
        - id: ch01-b72
          speaker: mrs_morris
          text: >-
            There are many, but you shouldn't begin with too much. I'll give you the addresses of three or four poor families who would benefit greatly from an occasional visit. It will help only if you treat them as you treat your wealthier friends.
        - id: ch01-b73
          speaker: mrs_morris
          text: >-
            Don't rush to give them money or piles of presents before you learn what they truly need. Take a real interest in them. Learn how they live and what they hope to do for their children. If you can help those children find suitable positions, do it. Speak to these families with the same respect you show your richer friends. And always remember that poverty does not necessarily destroy a person's self-respect.
        - id: ch01-b74
          speaker: mrs_montague
          text: >-
            I will remember. When can you give me the addresses?
        - id: ch01-b75
          speaker: beautiful_joe
          text: >-
            Mrs. Morris smiled. She took paper and a pencil from her sewing basket, wrote several lines, and handed the list to Mrs. Montague. The visitor rose to leave.
        - id: ch01-b76
          speaker: mrs_morris
          text: >-
            One more thing about the dog. If you let Charlie have one, send him over to talk with my boys. They seem to know every dog for sale in town.
        - id: ch01-b77
          speaker: mrs_montague
          text: >-
            Thank you. I would be delighted. He shall have his dog. When may Charlie come?
        - id: ch01-b78
          speaker: mrs_morris
          text: >-
            Tomorrow, the next day, or any day you like. It makes no difference to me. Let him spend the afternoon and evening with the boys, unless you object.
        - id: ch01-b79
          speaker: mrs_montague
          text: >-
            I would be very pleased.
        - id: ch01-b80
          speaker: beautiful_joe
          text: >-
            The little lady bowed and smiled. Before leaving, she bent down and patted me. Then she hurried down the steps, climbed into her carriage, and drove away. Mrs. Morris remained at the door and watched her go with a shining face. I began to think I might like Mrs. Montague too, if I knew her long enough.
        - id: ch01-b81
          speaker: beautiful_joe
          text: >-
            Two days later, I knew for certain that she liked me. When her little boy Charlie came to the house, he brought me a package wrapped in white paper. Mrs. Morris opened it. Inside was a handsome nickel-plated collar with my name on it: Beautiful Joe.
        - id: ch01-b82
          speaker: beautiful_joe
          text: >-
            How pleased I was! They removed the shabby leather strap the boys had given me when I arrived and fastened my new collar around my neck. Then Mrs. Morris held me up to a mirror. Until that moment, I had felt a little ashamed of my cropped ears and shortened tail. With that fine collar on, I felt I could hold up my head beside any dog.
        - id: ch01-b83
          speaker: beautiful_joe
          text: Mrs. Morris held my head firmly between her hands.
        - id: ch01-b84
          speaker: mrs_morris
          text: >-
            Dear old Joe, you did something good the other day. You helped me start that little woman on her way out of a selfish life.
        - id: ch01-b85
          speaker: beautiful_joe
          text: >-
            I did not know whether that was true. I only knew I was very grateful to Mrs. Montague for my collar. After that, whenever I met her in the street, I stopped and looked at her. Sometimes she noticed me and stopped her carriage to speak. But whether she saw me or not, I always wagged my tail, or rather my whole body, since I had no tail to wag.
        - id: ch01-b86
          speaker: beautiful_joe
          text: >-
            Her son received a beautiful Irish setter named Brisk. He had a silky coat and soft brown eyes, and his young master seemed very fond of him.
