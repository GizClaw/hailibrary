  chapters:
    - id: ch01
      title: A BAND OF MERCY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            A few evenings after we reached Dingley Farm, Mrs. Wood and Miss Laura sat on the veranda. I lay at their feet.
        - id: ch01-b02
          speaker: miss_laura
          text: >-
            Auntie, what do the letters mean on that silver pin you wear with your ribbon?
        - id: ch01-b03
          speaker: mrs_wood
          text: You know what the white ribbon stands for, don't you?
        - id: ch01-b04
          speaker: miss_laura
          text: It means you're a temperance woman, doesn't it?
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            Yes. And the star pin shows that I belong to a Band of Mercy. Do you know what that is?
        - id: ch01-b06
          speaker: miss_laura
          text: No, I don't.
        - id: ch01-b07
          speaker: mrs_wood
          text: >-
            How strange. I would have expected several bands in Fairport. A boy with a disability started ours. He is the son of an artist in Boston, and the band has done a great deal of good. We have a meeting tomorrow. You may come with me if you like.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            That conversation took place on Monday. The next afternoon, when all the work was finished, they got ready to walk to the village.
        - id: ch01-b09
          speaker: miss_laura
          text: May Joe come too?
        - id: ch01-b10
          speaker: mrs_wood
          text: Of course. He's such a good dog that he won't cause any trouble.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            I was delighted to hear that. I trotted beside them down the lane toward the road. It was a cool, pleasant place, with tall trees growing on both sides. Under the trees, pretty wildflowers peeped through the grass as if they were watching us pass.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Mrs. Wood and Miss Laura talked about the Band of Mercy all the way. Miss Laura listened with great interest. She said she wanted to begin a band in Fairport.
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            It's quite simple. At the top of a sheet of paper, write this promise. “I will try to be kind to all harmless living creatures, and try to protect them from cruel usage.” Then have thirty people sign it, and you have a band.
        - id: ch01-b14
          speaker: mrs_wood
          text: >-
            I've started two or three by keeping papers ready for visitors to sign. I call them Corresponding Bands because the members live too far apart to meet. I send them Band of Mercy papers, and they write such lovely letters to me about the kind things they do for animals.
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            A local Band of Mercy can make a wonderful difference. Riverdale has changed completely since this one began. A few years ago, if a man beat or raced his horse and someone objected, he would say, “The horse belongs to me. I'll treat him as I please.” Most people agreed with him then. Now everyone takes the poor horse's side. No man nearby would dare mistreat an animal.
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            The children have done it. They're doing splendid work, and it does them good too. What we've read about American boys and girls is frightening. We boast about our excellent schools and colleges, yet except for Spain and Italy, we produce more criminals than any other civilized country. People say our young people aren't being trained properly. Immigration plays a part as well.
        - id: ch01-b17
          speaker: mrs_wood
          text: >-
            We think too much about educating the mind and forget the heart and soul. Right now, all our future citizens are in school, the good and the bad together. Between geography, history, and grammar, we should teach something deeper. Then when those children grow up and enter the world, they will carry lessons of love and goodwill with them.
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            A young child is tender and can be guided in any direction. Many teachers say the best education for the heart is teaching kindness to animals. Children who learn to love and protect creatures that cannot speak will grow up to be kind to other people.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            I was very pleased by their conversation. I stayed close so I wouldn't miss a word.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            As we went on, houses began to appear here and there among the trees. Soon they stood close together, and shops came into view. We had reached the village of Riverdale. Nearly every building lay along its winding main street. The river ran behind the village, and we had already driven there several times.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            We passed the school, a square white building in a large yard. Boys and girls hurried down the steps with armfuls of books. Two older boys came up behind us, and Mrs. Wood turned to them.
        - id: ch01-b22
          speaker: mrs_wood
          text: Are you boys going to the Band of Mercy meeting?
        - id: ch01-b23
          speaker: john_turner
          text: Oh, yes, ma'am. I'm giving a recitation, remember?
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            Yes, of course! Forgive me for forgetting. And here come Dolly, Jennie, and Martha.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            Mrs. Wood laughed her jolly laugh as three little girls ran from a house and joined us. They stared so hard at my head, the stump of my tail, and my fine collar that I grew shy. I pressed my head against Miss Laura's dress.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            She bent down and patted me, and then I no longer cared how much they stared. Miss Laura never forgot me. However deeply she was talking, playing, or working, she would pause now and then. A word or a look always told me that she knew I was there.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Mrs. Wood stopped outside a building on the main street. A great many boys and girls were going in, and we joined them. Inside was a large room with a platform at one end. Several chairs stood on the platform, along with a small table.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            A boy stood beside the table with one hand on a bell. Soon he rang it, and everyone became quiet. Mrs. Wood whispered that he was Phil Dodge, the president of the band. The pale young man with curly hair seated before him was Mr. Maxwell, the artist's son who had founded this Band of Mercy.
        - id: ch01-b29
          speaker: phil_dodge
          text: We will begin our meeting by singing a hymn.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            Phil's pleasant voice rang through the room. An organ stood near the platform, and a young girl began to play it. All the other boys and girls rose to their feet and sang the hymn clearly and sweetly. When the song ended, Phil asked for the report from their last meeting.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            A little girl came forward, blushing and hanging her head. She held a sheet of paper and read aloud what was written there. When she finished, Phil made a few remarks about the report. Then everyone had to vote.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            It was just like a meeting held by grown people, and I was surprised by how well the children behaved. No one played around or laughed. They all looked serious and listened closely to what was said.
        - id: ch01-b33
          speaker: phil_dodge
          text: John Turner will now give his recitation.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            This was the younger boy we had met on the road. John stepped onto the platform and bowed.
        - id: ch01-b35
          speaker: john_turner
          text: >-
            I learned two stories from the paper called “Dumb Animals.” One is about a horse, and the other is about a dog. I think they are two of the finest animal stories ever recorded. I'll tell you the horse story first.
        - id: ch01-b36
          speaker: john_turner
          text: >-
            A man from Missouri had to travel to Nebraska to take care of some business about land. He went on horseback. He had trained the horse himself, and it came whenever he whistled, just like a dog. After entering Nebraska, the man reached a place where the road divided. He could see that travelers used the road over the hill, but he decided to follow the road beside the river.
        - id: ch01-b37
          speaker: john_turner
          text: >-
            What he didn't know was that quicksand lay across the river road. People couldn't use that road in spring or summer. There used to be a sign warning strangers, but it had been taken away. The man got off his horse and let it graze while he walked ahead. After a while, he had gone so far that he sat down to wait for the horse to catch up.
        - id: ch01-b38
          speaker: john_turner
          text: >-
            Suddenly, he discovered that he was on quicksand. His feet had sunk into it, and no matter how he tried, he couldn't pull them out. He threw himself flat, whistled for his horse, and shouted for someone to help him. He could hear some young people singing out on the river, but his cries never reached them.
        - id: ch01-b39
          speaker: john_turner
          text: >-
            The terrible sand kept drawing him down until it nearly reached his shoulders. He believed he was lost. At that moment, his horse came running up and stood beside its master. The man had sunk too low to reach the saddle or even the bridle. He could only catch hold of the horse's tail and tell him to go. The horse gave one tremendous pull and landed his master safely on firm ground.
        - id: ch01-b40
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: Tell us the dog story! The dog story!
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Everyone clapped and stamped, calling for the second story. John bowed, smiled, and began again.
        - id: ch01-b42
          speaker: john_turner
          text: >-
            You all know what a cattle roundup is, so I won't explain it. A man down south was planning one with his sons and friends. There was a fierce black steer in the herd, and they wondered whether their old yellow dog could handle him. The dog's name was Tige. He lay nearby and seemed to listen wisely to every word.
        - id: ch01-b43
          speaker: john_turner
          text: >-
            The next day brought a scene of great confusion. The steer raged and tore about, refusing to let anyone come close enough to touch him with a whip. Tige had always been brave, but for a while he kept out of the way. Then, as if he had finally gathered a little courage, he made a run at the steer.
        - id: ch01-b44
          speaker: john_turner
          text: >-
            The steer spotted him, gave a bellow, lowered his horns, and charged. Tige turned tail and ran. The young men who owned him were frantic. They had been praising their dog, and now it seemed all that praise would be proved false. Their father called, “Don't shoot Tige yet. Wait and see where he's running.”
        - id: ch01-b45
          speaker: john_turner
          text: >-
            Tige raced straight toward the cattle pen. The steer was so furious that he never noticed where the dog was leading him, and he dashed right into the pen after Tige. The dog leaped over the wall and came back around to the gate. He barked and yelped for the men to hurry over and shut the steer in. They closed the gate, praised and petted Tige, and bought him a collar with a silver plate.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            The children cheered John loudly all around the room as he returned to his seat. Phil asked them to comment on the two stories.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            Several children raised their hands, and Phil called on them one at a time.
        - id: ch01-b48
          speaker: child_1
          text: >-
            If that horse's tail had been cut short, his master couldn't have reached it. The man would have died in the quicksand.
        - id: ch01-b49
          speaker: child_2
          text: >-
            And if the man hadn't been kind to his horse, the horse would never have come when he whistled or stood there trying to help him.
        - id: ch01-b50
          speaker: child_3
          text: >-
            The horse heard the man in trouble faster than the people out on the river did.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            When the discussion ended, Phil asked for stories about animals in other countries.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            Another boy came forward and bowed. Then he spoke in short, abrupt sentences.
        - id: ch01-b53
          speaker: ronald
          text: >-
            My uncle is Henry Worthington. He's an Englishman, and he used to be a soldier in India. One day, while he was hunting in the Punjab, he saw a mother monkey carrying her dead baby. Six months later, he went through the same jungle. He saw the same monkey, still carrying the little body, though it had dried and shriveled. The mother loved her baby and wouldn't give it up.
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            Ronald returned to his seat. Phil gave him an odd look.
        - id: ch01-b55
          speaker: phil_dodge
          text: That's a very good story, Ronald, if it's true.
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            None of the children laughed. But Mrs. Wood's face turned as red as a poppy, Miss Laura bit her lip, and Mr. Maxwell hid his face in his arms while his whole body shook.
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            Ronald looked furious. He jumped to his feet again.
        - id: ch01-b58
          speaker: ronald
          text: >-
            My uncle tells the truth, Phil Dodge. He has never told a lie in his life!
          emotion: angry
        - id: ch01-b59
          speaker: beautiful_joe
          text: >-
            Phil stayed on his feet, and his face turned deep scarlet. Then a tall boy at the back of the room stood up.
        - id: ch01-b60
          speaker: tall_boy
          text: >-
            Mr. President, something that couldn't happen in our climate might happen in a hot country like India. Doesn't heat sometimes dry things out and preserve them?
        - id: ch01-b61
          speaker: beautiful_joe
          text: Phil's face cleared.
        - id: ch01-b62
          speaker: phil_dodge
          text: >-
            Thank you. I don't want to hurt anyone's feelings. But our band has a rule that every story told here must be true. We have five minutes left for stories about foreign animals. Does anyone else have one?
