  chapters:
    - id: ch01
      title: 第十九章　仁慈会
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            到丁格利农场几天后的一个晚上，伍德太太和劳拉小姐坐在门廊上，我伏在她们脚边。
        - id: ch01-b02
          speaker: miss_laura
          text: 姨母，您那条缎带上别着银别针，别针上的几个字母是什么意思？
        - id: ch01-b03
          speaker: mrs_wood
          text: 白缎带的意思，你总知道吧？
        - id: ch01-b04
          speaker: miss_laura
          text: 知道，是说您主张禁酒，对吗？
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            对。那枚星形别针呢，是说我加入了仁慈会。你听说过仁慈会吗？
        - id: ch01-b06
          speaker: miss_laura
          text: 没听说过。
        - id: ch01-b07
          speaker: mrs_wood
          text: >-
            这倒奇怪，我以为费尔波特会有好几个呢。这里这个会，是一位波士顿画家的儿子创办的。那孩子身有残疾，可仁慈会已经做了不少好事。明天正好聚会，你愿意，我就带你去。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            她们说这番话是在星期一。第二天下午，活儿一做完，两人便收拾好，准备进村。
        - id: ch01-b09
          speaker: miss_laura
          text: 乔也能去吗？
        - id: ch01-b10
          speaker: mrs_wood
          text: 当然能。它这么乖，不会给我们添麻烦。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            我听了好高兴，跟着她们沿小路跑向大路。那里又凉快又舒服，两边都长着高高的树。树下的草丛中，漂亮的野花探着头，看我们从面前经过。我一路跑在她们身边。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            一路上，她们都在谈仁慈会。劳拉小姐越听越有兴趣，也想在费尔波特办一个。
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            这事很简单。你在纸上写下誓言：“我愿尽力善待一切无害的生灵，并保护它们不受残酷虐待。”再请三十个人签名，一个仁慈会就有了。
        - id: ch01-b14
          speaker: mrs_wood
          text: >-
            我平常总备着纸条，请来做客的人签名，这样已经办起两三个会。我叫它们“通信仁慈会”，因为那些会员彼此住得太远，没法聚在一起。我给他们寄《仁慈会报》，他们也会写来很好的信，告诉我自己为动物做过哪些好事。
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            一个地方有仁慈会，真的很有用。自从这里办了会，里弗代尔完全变了。几年前，有人抽打马匹，或是赶马飞跑，旁人一阻拦，他就说：“马是我的，我想怎么处置都行。”那时多数人还觉得他有理。如今人人都护着可怜的马，附近再没人敢虐待动物。
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            这都是孩子们的功劳。他们做了件大好事，自己也能从中受益。我们研究这个问题以后，读到别人寄来的美国孩子的情况，真叫人害怕。劳拉，我们的学校和学院确实出色，也总拿来夸耀。可除了西班牙和意大利，我们培养出的罪犯竟比任何文明国家都多。有人说，是因为年轻人没有受到恰当教导，移民也有些影响。我们只顾训练头脑，却忘了心灵。
        - id: ch01-b17
          speaker: mrs_wood
          text: >-
            所以我想，趁我国未来的人民都还在学校里，不管他们以后会成为圣徒还是罪人、好人还是坏人，都该在地理、历史和语法中间，放进一点能深入心灵的东西，让他们真正受到触动。等他们长大成人，走入社会，心里会一直带着爱人与善待别人的教诲。
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            小孩子是多么柔嫩啊，你想把他往哪里引，他就会往哪里成长。我们总说心灵教育不能只有知识教育。许多教师都说，要教好孩子的心，没有什么比教他们善待动物更好。孩子学会爱护不会说话的生灵，长大以后也会善待自己的同胞。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            这些话我听得很喜欢，一直紧紧跟着她们，生怕漏掉一个字。再往前走，路边的树木之间渐渐出现了房子。那些房子都离大路有一段距离。后来房屋越来越密，我也看见了几家店铺。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            这里就是里弗代尔村。村里的房屋几乎全都沿着这条弯弯曲曲的街道而建，河流远在村子后面。我们已经坐车去过那里好几回。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            我们经过一所学校。白色校舍方方正正，立在一大片院子中央。男孩女孩抱着满怀的书，匆匆跑下台阶，来到街上。两个年纪颇大的男孩从后面走来。伍德太太回头跟他们打招呼，问他们是不是也去参加仁慈会。
        - id: ch01-b22
          speaker: john_turner
          text: 是啊，太太。今天轮到我朗诵，您忘了吗？
        - id: ch01-b23
          speaker: mrs_wood
          text: >-
            对，对，瞧我怎么忘了。多莉、珍妮和玛莎也来了。
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            她爽朗地笑着。我们经过一户人家，三个小姑娘正从里面跑出来。她们加入我们，一直盯着我的脑袋、短尾巴和漂亮项圈。我害羞起来，只好把头贴着劳拉小姐的裙子走。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            她弯下腰摸了摸我，我马上不在乎那些小姑娘还要盯着我看多久了。劳拉小姐从不会把我忘在一边。无论她正专心谈话、跟人玩游戏，还是忙着做别的事，总会偶尔停一停，对我说句话，或看我一眼，让我知道她记得我就在身旁。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            伍德太太在大街的一幢房子前停下。许多男孩女孩正往里走，我们也跟着他们进去。里面是一间宽敞的大厅，一头有座讲台，台上摆着几把椅子和一张小桌子。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            一个男孩站在小桌旁，手按着铃铛。过了一会儿，他把铃摇响，大家全静了下来。伍德太太悄悄告诉劳拉小姐，这男孩就是会长。坐在他前面那位脸色苍白、头发卷曲的青年，是画家的儿子马克斯韦尔先生。这个仁慈会正是他创办的。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            会长的嗓音洪亮悦耳。他宣布聚会先从唱赞美诗开始。讲台边有架风琴，一位年轻姑娘弹奏起来，其他男孩女孩全都站起身，歌声清亮又甜美。
        - id: ch01-b29
          speaker: phil_dodge
          text: 赞美诗已经唱完了。下面请宣读上次聚会的记录。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            一个小姑娘红着脸，低着头走到前面，照着手里那张纸念起会议记录。她念完，会长说了几句话，随后每个人都要投票表决。那场面和大人的会议一模一样。这些孩子既不打闹，也不嬉笑，个个神情严肃，认真听着，表现得真好，让我很惊讶。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            表决过后，会长请约翰·特纳上台朗诵。他就是我们路上遇到的男孩。约翰走上讲台，先鞠了一躬。他说自己从《不会说话的动物》报上学了两个故事，一个讲马，一个讲狗。他觉得这是有记载以来最好的两个动物故事，要先讲马的那一个。
        - id: ch01-b32
          speaker: john_turner
          text: >-
            密苏里州有个人，为了料理一块土地，要去内布拉斯加州。他骑着一匹亲手训练的马，只要一吹口哨，那马就会像狗一样跑到身边。到了内布拉斯加，他遇见一个岔路口。一条路沿河走，一条翻过山丘。那人看见大家都走山路，自己却选了河边那条。
        - id: ch01-b33
          speaker: john_turner
          text: >-
            他不知道路上横着一片流沙，春夏两季根本不能通行。那里以前有块告示牌，专门提醒外乡人，可后来被人拿走了。那人下马让马吃草，自己朝前走。走得离马太远，他只好坐下等它。谁知脚下就是流沙。他的双脚陷进沙里，怎么也拔不出来。
        - id: ch01-b34
          speaker: john_turner
          text: >-
            他赶紧伏下身，吹口哨唤马，又大声求救，可一个人也没来。他听得见河上有些年轻人在唱歌，那些人却完全听不见他的呼喊。可怕的流沙不停把他往下拖，眼看快没到肩膀了。他以为自己死定了，这时马飞奔过来，站在主人身边。
        - id: ch01-b35
          speaker: john_turner
          text: >-
            那人陷得太深，够不到马鞍，也抓不住缰绳，只能攥住马尾，叫马往前走。马拼命一拉，把主人拖到了安全的地面。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            故事讲完，大家使劲拍手、跺脚，欢呼起来。
        - id: ch01-b37
          speakers: [child_one, child_two, child_three]
          ensemble: chorus
          text: 讲狗的故事！讲狗的故事！
          emotion: happy
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            约翰笑着鞠了一躬，又开始讲第二个故事。
        - id: ch01-b39
          speaker: john_turner
          text: >-
            你们都知道怎样把散养的牛群赶拢，我就不解释了。从前，南方有个人要赶拢牛群，正和儿子、朋友商量这件事。牛群里有头凶恶的黑阉牛，大家都想知道家里的老黄狗能不能制服它。狗叫泰格，卧在旁边，像是听懂了一样，仔细听他们谈话。
        - id: ch01-b40
          speaker: john_turner
          text: >-
            第二天，那里乱成一团。黑牛发起狂来，四处横冲直撞，谁也不能靠近到鞭子够得着它的地方。泰格平常一直很勇敢，这时却躲躲闪闪了一阵。后来它像是终于鼓起一点勇气，朝黑牛冲去。黑牛一看见它，便大吼一声，低下双角迎面冲来。
        - id: ch01-b41
          speaker: john_turner
          text: >-
            泰格转身就逃。它的几个小主人急坏了，因为他们刚刚还夸过泰格，眼看那些称赞就要被证明全是假的。孩子们的父亲却喊：“先别开枪打泰格，看看它究竟要跑到哪里。”
        - id: ch01-b42
          speaker: john_turner
          text: >-
            泰格直奔牛栏。黑牛气昏了头，完全没有留意自己冲向哪里，一头跟着闯了进去。泰格跳过围墙，又跑回栏门前，汪汪叫着，催那些人赶快把牛关起来。大家关上栏门，把黑牛锁在里面，好好疼爱了泰格一番，还给它买了条镶银牌的项圈。
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            约翰赢得了大家响亮的喝彩，然后回到自己的座位。会长说，希望大家谈谈对这两个故事的看法。好几个孩子举起手，他便让他们依次发言。
        - id: ch01-b44
          speaker: child_one
          text: 那匹马的尾巴要是被截短了，主人就抓不到它，只能死在流沙里。
        - id: ch01-b45
          speaker: child_two
          text: >-
            那个人平时要是对马不好，马就不会一听口哨便跑来，也不会守着他，想办法帮忙。
        - id: ch01-b46
          speaker: child_three
          text: 河上那些人听见呼救声，还没有那匹马快呢。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            大家说完，会长又请人讲外国动物的故事。另一个男孩走上前，鞠了一躬，开口又短又硬。
        - id: ch01-b48
          speaker: ronald
          text: >-
            我舅舅叫亨利·沃辛顿，是英国人，以前在印度当兵。有一天，他在旁遮普打猎，看见一只母猴抱着死去的小猴。六个月后，他又去那片丛林。还是那只母猴，还抱着那只小猴，小猴已经干瘪了。母猴爱自己的孩子，不肯丢下它。
        - id: ch01-b49
          speaker: beautiful_joe
          text: 男孩说完便回到座位。会长脸上露出一种古怪的神情。
        - id: ch01-b50
          speaker: phil_dodge
          text: 罗纳德，这故事要是真的，那可真不错。
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            孩子们谁也没笑。伍德太太的脸却红得像朵罂粟花，劳拉小姐咬住嘴唇，马克斯韦尔先生把头埋进双臂，浑身抖个不停。罗纳德气坏了，一下子跳起来。
        - id: ch01-b52
          speaker: ronald
          text: 我舅舅是个老实人，菲尔·道奇。他一辈子从没说过谎！
          emotion: angry
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            会长还站在那里，脸涨得通红。大厅后面一个高个子男孩站起身来。
        - id: ch01-b54
          speaker: tall_boy
          text: >-
            会长先生，在我们这里不可能的事，到了印度那么热的地方，也许就能发生。炎热的天气不是有时会把东西烘干，保存下来吗？
        - id: ch01-b55
          speaker: beautiful_joe
          text: 会长听了，脸色轻松下来。
        - id: ch01-b56
          speaker: phil_dodge
          text: >-
            谢谢你提醒我。我不想伤谁的感情，不过大家知道，会里有条规矩，在这里讲的必须是真事。讲外国动物的时间还剩五分钟。还有谁愿意讲一个？
