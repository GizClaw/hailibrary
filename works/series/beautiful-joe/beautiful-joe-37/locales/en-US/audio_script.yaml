  chapters:
    - id: ch01
      title: THE END OF MY STORY
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I have reached the last chapter of my story. When I began, I meant to tell what happened in every year of my life. But that would make the story far too long, and I fear Miss Laura and the boys and girls would grow tired of reading it. So I will stop here, though I would gladly keep going. Talking over the old days has given me so much pleasure that I am sorry to leave them.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Something pleasant has happened in every year I have spent with the Morrises. I cannot tell it all. Nor can I follow Miss Laura and the boys through every year as they grew and changed, until they were quite grown up. I will only bring my tale to the present. Then I shall stop talking and lie down in my basket. I am an old dog now, and I tire very easily.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            I was one year old when I came to the Morrises, and I have lived with them for twelve years. I no longer share a house with Mr. and Mrs. Morris. I live with my dear Miss Laura. She is not Miss Laura now, but Mrs. Gray. Four years ago she married Mr. Harry. They live at Dingley Farm with Mr. and Mrs. Wood, while Mr. and Mrs. Morris have a cottage close by. Mr. Morris is not strong enough to preach anymore.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            The boys have all gone their different ways. Jack married pretty Miss Bessie Drury, and they have a large farm near us. Miss Bessie says she hates being a farmer's wife. Yet she always looks happy and contented, so I think she must be mistaken. Carl is a merchant in New York. Ned works as a bank clerk, and Willie is studying at a place called Harvard. When his studies are done, Willie says he will go and live with his father and mother.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The Morrises' old friends still visit them. Mrs. Drury stops every summer on her way to Newport. Mr. Montague and Charlie come every other summer, and Charlie always brings his old dog Brisk. Brisk is growing feeble, just as I am. We lie together in the sunshine on the veranda while the Morrises talk about former days. Sometimes, as we listen, we almost feel young again.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            Besides Brisk, we have a handsome Scotch collie who follows Miss Laura everywhere. He and I are great friends, though he can move about far better than I can. Once, a friend of Miss Laura came with a little boy and girl. The collie sat between the children while their father took a picture with a kodak. I like that dog so well that I told him I would have his picture put into my book.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Summer is a merry time when all the Morris boys are here. Through the winter, we look forward to their return because they fill the old farmhouse with life. Mr. Maxwell comes to Riverdale every summer too. By now he has so many dumb animals following him that he says he cannot take them any farther from Boston. Unless he opens a menagerie, he does not know what he will do with them all. The other day, he asked Miss Laura whether the old Italian might take him as a partner. He had never heard what became of poor Bellini, so she told him.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            A few years ago, the Italian came to Riverdale with a new company of performing animals. They were nearly as clever as the old ones, though there were fewer of them. The Morrises and many of their friends attended the show. Afterward, Miss Laura said she had almost gone into hysterics when clever little Billy walked onstage. He bowed, jumped through hoops, caught balls, and performed all his tricks.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            For the Morrises' sake, the Italian had made a special pet of Billy and treated him more like a person than a dog. When Billy visited us at the farm, he did put on airs. Still, even though his master had nearly spoiled him, he was such a dear little dog that Jim and I could not be angry with him. A few days later, the show left town. For some time, every bit of news we heard about them was good.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Then, last winter, a nurse at a New York hospital wrote to Miss Laura. Bellini was very near death, and he wanted the nurse to tell Mrs. Gray that he had sold every animal except the little dog she had once given him. He was sending Billy home to her. With his last breath, he would pray for heaven to bless the kind lady and her family, who had befriended him in his trouble.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Billy arrived the next day, thin and white as a scarecrow. He was ill and miserable. He would not eat, and the smallest noise made him start. He kept listening for the Italian's footsteps, but those footsteps never came.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            One day, Mr. Harry looked up from his newspaper.
        - id: ch01-b13
          speaker: mr_harry
          text: Laura, Bellini has died.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Tears filled Miss Laura's eyes. At the sound of his master's name, Billy had jumped up. Now he sank down again. He understood what they meant. From that moment, he stopped listening for footsteps and lay still until he died. Miss Laura placed him in a little wooden box and buried him in a corner of the garden. When she works among her flowers, she often speaks sadly of Billy and of poor Dandy, who lies in the garden at Fairport.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Bella the parrot lives with Mrs. Morris and is as clever as ever. I have heard that parrots can reach a very great age. Some even live to be a hundred. If that is true, Bella will outlive every one of us. She sees that I am growing blind and weak. Whenever I go to call on Mrs. Morris, she shouts encouragement at me.
        - id: ch01-b16
          speaker: bella
          text: >-
            Keep a stiff upper lip, Beautiful Joe! Never say die! Keep the game going, Beautiful Joe!
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Mrs. Morris cannot imagine where Bella learns such slang. I suspect Mr. Ned. When he comes home for the summer, a sly light appears in his eyes and he calls to her.
        - id: ch01-b18
          speaker: ned_morris
          text: Come out to the garden with me, Bella.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Ned stretches out in a hammock beneath the trees. Bella settles on a branch nearby, and he talks to her for hours. At any rate, it is always in autumn, after Ned has left Riverdale, that Bella shocks Mrs. Morris with her slang.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            I am glad I shall spend my last days in Riverdale. Fairport was a fine place, but it did not have the open freedom of this farm. On every sunny morning, I take a walk among the horses and cows, then stop to watch the hens peck at their food. It is a happy place. I hope my dear Miss Laura will enjoy it for many years after I am gone.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            Very little troubles me. In spring, the pigs sometimes dig up the bones I buried in the fields the autumn before. That is a small matter, and I try not to mind. There are plenty of bones here. I only wish some poor city dogs could help me eat them. I do not believe bones are good for pigs.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Mr. Harry also keeps a tame squirrel in one of the barns, and that creature teases me a good deal. He knows the rheumatism has made my legs too stiff to chase him. So he darts around me, flicks his tail almost into my face, and tries to make me run after him, just so he can laugh. He is not a very thoughtful squirrel, but I do my best to ignore him.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            The sailor boy who once gave Bella to the Morrises has grown into a large, stout man. He is now the first mate of a ship. He visits us sometimes and always brings the Morrises foreign fruits and curious things from distant places.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            Malta the cat is still alive and lives with Mrs. Morris. Davy the rat is gone, and so is poor old Jim. One day last summer, Jim went away. No one ever learned what became of him. The Morrises searched everywhere and offered a large reward, but he never returned.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            I believe Jim knew he was going to die and found some hidden place by himself. He remembered Miss Laura's grief when Dandy died, and he wanted to spare her the deeper pain of watching him die. Jim was always thoughtful and never wanted to cause trouble. I am more selfish. Even at the end, I could not leave Miss Laura. When my last hour comes, I want her gentle face above me. If I can see her, I will not care how much I suffer.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Miss Laura is as tenderhearted as she has always been. But she tries not to let all the pain and suffering in the world weigh too heavily on her. She says grief would weaken her, and she needs every bit of strength to put an end to some of that suffering. She does a great deal of good in Riverdale. I do not think anyone in the whole countryside is loved more than she is.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Years ago, she resolved to do everything she could to protect dumb creatures, and she has never forgotten that promise. Mr. Harry and Mr. Maxwell have helped her nobly. Mr. Maxwell does most of his work in Boston. Here in Riverdale, Miss Laura and Mr. Harry work mostly through their writing. They mean to make Riverdale a model village in the way it treats every kind of animal.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            The village has become a model in other ways too. It seems that every improvement has gone hand in hand with humane treatment of animals. As the people learned to think about the lower creatures, they became more thoughtful toward one another. Across the state, this little town is gaining a name for good schools, good company, sound business, and religious life. Many families move here to educate their children, and the people of Riverdale take great care over who comes to live among them.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            Two years ago, a man moved here and opened a shop. Someone saw him kick a small kitten out of his house. The very next day, a committee of Riverdale citizens went to see him.
        - id: ch01-b30
          speakers: [citizen_1, citizen_2]
          ensemble: duo
          text: >-
            We have worked hard to drive cruelty out of our village. We do not want anyone bringing it back. Perhaps you had better move somewhere else.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            The shopkeeper was completely astonished.
        - id: ch01-b32
          speaker: shopkeeper
          text: >-
            I have never met such particular people! I wasn't trying to be cruel. I didn't think the kitten cared. But now that I consider it, I suppose cats dislike being kicked just as much as I would. I promise I will treat them kindly from now on. And if you don't object, I would rather stay. People who show such care for dumb animals must treat human beings even better. This sounds like a good place to raise my children.
          emotion: surprised
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            Of course, the committee allowed him to remain. Today he is known for kindness to every living thing. Whenever Miss Laura asks him for money to support one of her humane plans, he never refuses to help.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Before I finish, I must share the most important lesson Miss Laura has learned from her years of serving dumb animals. She believes cruel and vicious owners should be punished. But when people are merely thoughtless, she says we should not spend all our time telling them what not to do.
        - id: ch01-b35
          speaker: mrs_gray
          text: >-
            Don't go to people with a whole list of warnings. Don't only tell them not to overfeed an animal, or starve it, or work it too hard, or beat it. Tell them something simpler. Be kind.
        - id: ch01-b36
          speaker: mrs_gray
          text: >-
            Learn what your own animals need, and make sure those needs are met. No one should understand how to care for your animal better than you do. You are with it all the time. You know its nature, how much work it can bear, and how much food and rest it needs. You know how it differs from every other animal.
        - id: ch01-b37
          speaker: mrs_gray
          text: >-
            When your animal is sick or unhappy, you should be the one to care for it. Nearly every animal loves its own master more than it loves a stranger, and it will recover more quickly under that master's care.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Miss Laura also says that men and women who are kind in every way to the dumb creatures that serve them will be amazed by the happiness those animals bring into their lives, and by how faithful and grateful they can be.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            And now I truly must close my story. Good-bye to every boy and girl who may read it. If a dog may say such a thing, I would like to add, God bless you all.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            Perhaps my small efforts have helped you understand that dogs and many other animals love their masters and mistresses and live only to please them. If so, my little story has not been written in vain.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            These are my last words. Boys and girls, be kind to dumb animals. Be kind not only because it will cost you nothing, but because it is right. They were placed on this earth by the same Kind Hand that made every living creature.
