audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    bella:
      display_name: 贝拉
      tts:
        delivery: 顽皮机敏，善于模仿人声
        timbre: 尖细而略带沙哑
        pace: 明快
        pitch: 高
    ned:
      display_name: 内德
      tts:
        delivery: 活泼爽快，笑意藏不住
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    shopkeeper:
      display_name: 店主
      tts:
        delivery: 直爽务实，知错后说得诚恳
        timbre: 朴实清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 故事讲到这里
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我的故事终于讲到最后一章了。刚开始写的时候，我还想把一辈子每一年的事都写下来。可真要那样写，故事就太长了，劳拉小姐不爱看，男孩女孩们大概也不爱看。那就讲到这里吧。其实我很想继续讲。那些往事给了我许多快乐，现在要停下来，我真舍不得。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            我住在莫里斯家的这些年，年年都有开心的事。可我没法把它们全说完，也不能一件件讲劳拉小姐和男孩们怎样长大、改变，直到都成了大人。眼下的事讲完，我就不说了。我得回篮子里躺下歇一歇。我已经老了，很容易累。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            我一岁来到莫里斯家，同他们一起过了十二年。现在我虽然不再和莫里斯先生、太太住在一所屋子里，仍旧陪着亲爱的劳拉小姐。她已经嫁给哈里先生四年了，现在该叫格雷太太。两人同伍德先生和太太住在丁格利农场。莫里斯先生和太太住在附近的小屋里。莫里斯先生身体不太好，已经不能讲道了。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            男孩们也各自有了去处。杰克娶了漂亮的贝茜·德鲁里小姐，住在不远的一座大农场。贝茜总说自己讨厌当农场主的妻子，可她看上去一直快活又知足。我想，她一定没弄明白自己的心意。卡尔在纽约做生意，内德在银行工作，威利在一个叫哈佛的地方读书。他说，读完书就回来陪父亲母亲住。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            莫里斯家的老朋友还常来探望。德鲁里太太每年夏天去纽波特时，都会顺路来一趟。蒙塔古先生和查理隔年夏天来一次，查理总带着老狗布里斯克。他也像我一样，越来越衰弱。我们卧在洒满阳光的门廊上，听莫里斯一家说起从前，有时觉得自己仿佛也年轻了。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            家里还有一只很漂亮的苏格兰牧羊犬，总陪在劳拉小姐身边。我和他是好朋友，只是他的腿脚比我灵便得多。有一天，劳拉小姐的朋友带着一个小男孩和一个小女孩来。他们让牧羊犬坐在两个孩子中间，孩子的父亲用一架“柯达”相机给他们照了相。我很喜欢这只狗，还告诉他，我会请人把他的照片放进我的书里。
    - id: ch02
      title: 比利最后一次归来
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            夏天，莫里斯家的男孩们全回来，农场可热闹了。我们整个冬天都盼着这一天，因为他们一进门，古老的农舍便有了生气。马克斯韦尔先生每年夏天也一定来里弗代尔。他身边的动物太多，已经没法把它们带到比波士顿更远的地方。他还说，除了开一座动物园，真不知道该怎么办。
        - id: ch02-b02
          speaker: beautiful_joe
          text: >-
            前几天，他还问劳拉小姐，那个意大利人肯不肯收他做合伙人。他不知道可怜的贝利尼后来出了什么事，劳拉小姐便讲给他听。
        - id: ch02-b03
          speaker: beautiful_joe
          text: >-
            几年前，贝利尼带着新训练的一批动物来到里弗代尔。它们几乎和从前那批一样出色，只是少了些。莫里斯一家和许多朋友都去看表演。后来劳拉小姐告诉我们，小比利上台先鞠躬，再钻圈、接球，一样样表演把戏。她看得太激动，几乎控制不住自己。
        - id: ch02-b04
          speaker: beautiful_joe
          text: >-
            因为莫里斯一家，贝利尼格外疼爱比利。他不像在对待一只狗，倒像在对待一个人。比利来农场时有点神气，可他实在讨人喜欢。就算主人快把他宠坏了，我和吉姆也没法生他的气。过了几天，他们离开这里。此后传来的都是好消息，直到去年冬天。
        - id: ch02-b05
          speaker: beautiful_joe
          text: >-
            那时，劳拉小姐收到纽约一家医院的护士来信。贝利尼已经快要死了。他卖掉了所有动物，只留下劳拉小姐从前好心送他的那只小狗。如今，他要把比利送还给她。他还说，直到咽下最后一口气，都会祈求上天赐福给这位善良的太太和她的家人，因为自己落难时，是他们帮助了他。
        - id: ch02-b06
          speaker: beautiful_joe
          text: >-
            第二天，比利到了。他瘦得只剩一副白色的骨架，病着，心里也很痛苦，什么都不肯吃。一有声音，他就猛地惊起。他一直在等贝利尼的脚步，可那熟悉的脚步再也没有响起来。
        - id: ch02-b07
          speaker: beautiful_joe
          text: 有一天，哈里先生看着报纸，忽然抬起头来。
        - id: ch02-b08
          speaker: mr_harry
          text: 劳拉，贝利尼去世了。
        - id: ch02-b09
          speaker: beautiful_joe
          text: >-
            劳拉小姐的眼睛顿时含满泪水。比利听到主人的名字，本来已经站了起来，这时又倒了下去。他听懂了。从那一刻起，他不再等脚步声，只是一动不动地躺着，直到死去。
        - id: ch02-b10
          speaker: beautiful_joe
          text: >-
            劳拉小姐把比利放进一只小木箱，埋在花园一角。她在花丛间干活时，常惋惜地提起他，也提起可怜的丹迪。丹迪还长眠在费尔波特的花园里。
        - id: ch02-b11
          speaker: beautiful_joe
          text: >-
            鹦鹉贝拉仍同莫里斯太太住在一起，还是那么聪明。听说有的鹦鹉能活到一百岁。若是真的，贝拉会比我们都活得长。她看出我的眼睛越来越模糊，身体也越来越弱。每次我去看莫里斯太太，她都会冲我大喊。
        - id: ch02-b12
          speaker: bella
          text: 挺起胸膛来，美丽的乔！永远别服输，美丽的乔！坚持到底，美丽的乔！
        - id: ch02-b13
          speaker: beautiful_joe
          text: >-
            莫里斯太太不知道贝拉从哪儿学来这些俚语。我猜是内德先生教的。他夏天回来时，总会眼里闪着顽皮的光，对贝拉招招手。
        - id: ch02-b14
          speaker: ned
          text: 贝拉，来，跟我到花园里去。
        - id: ch02-b15
          speaker: beautiful_joe
          text: >-
            内德随后躺到树下的吊床上，贝拉停在附近的枝头，他一说就是几个钟头。不管是不是他教的，内德离开里弗代尔以后，贝拉总会在秋天冒出几句俚语，把莫里斯太太吓一跳。
    - id: ch03
      title: 在里弗代尔的晚年
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            我很高兴能在里弗代尔过完这一生。费尔波特也很好，却没有这座农场这样开阔自在。只要早晨出了太阳，我总会出去走走。我走到马群和牛群中间，也停下来看母鸡啄食。这里是个幸福的地方。我只盼亲爱的劳拉小姐在我离开以后，还能在这里长久地生活。
        - id: ch03-b02
          speaker: beautiful_joe
          text: >-
            我几乎没有烦恼。到了春天，猪会把我秋天埋在田里的骨头拱出来，多少有点麻烦。不过这只是小事，我尽量不放在心上。这里的骨头多得很。要是能来几只城里的穷狗，帮我一起吃，我会很高兴。反正我想不出骨头对猪有什么好处。
        - id: ch03-b03
          speaker: beautiful_joe
          text: >-
            哈里先生养在谷仓里的驯服松鼠也爱捉弄我。我的腿得了风湿，僵硬得追不上他，他明明知道，还偏要显摆自己的敏捷。他围着我飞跑，尾巴几乎扫到我的脸，又故意逗我去追，好嘲笑我。我看他不大懂得体贴别人，不过我还是尽量不理他。
        - id: ch03-b04
          speaker: beautiful_joe
          text: >-
            当年把贝拉送给莫里斯一家的水手少年，如今已经是个高大强壮的男人，在船上做大副。他偶尔会来，每次都给莫里斯一家带些外国水果和新奇东西。
        - id: ch03-b05
          speaker: beautiful_joe
          text: >-
            猫咪马耳他还活着，也陪着莫里斯太太。老鼠戴维已经不在了，可怜的老吉姆也不在了。去年夏天有一天，他独自走出去，从此再没回来。莫里斯一家到处寻找，还拿出一大笔赏金，可谁也没有找到他。
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            我想，吉姆是知道自己快死了，便躲到一个偏僻的地方。他记得丹迪死时劳拉小姐有多难过，不愿自己的死再叫她伤心。他一直那么体贴，从不肯给别人添麻烦。
        - id: ch03-b07
          speaker: beautiful_joe
          text: >-
            我比吉姆自私。我离不开劳拉小姐，就算是为了独自死去，我也做不到。生命最后一刻来到时，我想看见她温柔的脸俯在我上方。只要她在身边，不论有多痛苦，我都不在意。
        - id: ch03-b08
          speaker: beautiful_joe
          text: >-
            她还是从前那个心肠柔软的人，只是努力不让世上的悲伤和苦难压垮自己。她说，那样会叫人软弱，而她需要拿出全部力量，去阻止其中一些苦难。她在里弗代尔做了许多好事。我想，这附近再没有谁比她更受人爱戴了。
    - id: ch04
      title: 一座善待生命的村庄
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            很多年前，劳拉小姐就下定决心，要尽一切力量保护不会说话的动物。她从来没有忘记。哈里先生和马克斯韦尔先生也一心帮助她。马克斯韦尔先生主要在波士顿工作，劳拉小姐和哈里先生则多半靠写作。他们决心把里弗代尔变成一座善待各种动物的模范村庄。
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            里弗代尔不只在这件事上做得好。每一种进步，仿佛都同善待动物一起到来。人们懂得体恤比自己弱小的生命，也越来越会体谅彼此。这里有好学校，邻里和睦，生意兴旺，人们也虔诚信仰。小镇渐渐在全州有了名声。许多人为了让孩子来这里上学，干脆搬了过来。不过，里弗代尔人对什么样的外乡人可以留下，十分挑剔。
        - id: ch04-b03
          speaker: beautiful_joe
          text: >-
            两年前，一个男人来到这里开店。有人看见他一脚把小猫踢出门外。第二天，几位居民一起登门。他们告诉那男人，村里费了很大力气，才清除虐待动物的行为，不能让新搬来的人又把这种恶习带回来。他最好搬到别处去。
        - id: ch04-b04
          speaker: shopkeeper
          text: >-
            我从没见过这么挑剔的居民！我根本没想过那也算残忍，还以为小猫不会在意。可现在认真一想，猫大概也不喜欢挨踢，就跟我不喜欢挨踢一样。往后我一定好好对待它们。
        - id: ch04-b05
          speaker: shopkeeper
          text: >-
            要是大家不反对，我还是想留下。你们对不会说话的动物都这么体贴，对人肯定会更友善。这里是个养育孩子的好地方。
        - id: ch04-b06
          speaker: beautiful_joe
          text: >-
            村民当然让他留了下来。如今，他因为善待每一个生命，已经远近闻名。劳拉小姐为了保护动物的计划向他募捐时，他也从来不拒绝帮忙。
    - id: ch05
      title: 请善待不会说话的动物
      blocks:
        - id: ch05-b01
          speaker: beautiful_joe
          text: >-
            在故事结束以前，我一定得讲一段劳拉小姐说过的话。这很重要，是她多年为不会说话的动物奔走以后，慢慢明白的道理。
        - id: ch05-b02
          speaker: miss_laura
          text: >-
            主人要是残酷凶恶地对待动物，当然应当受罚。可有些人只是疏忽，才做错了事。面对他们，不要总是一句接一句地说“不许这样”。不要光告诉他们，别把动物喂得太饱，别让它挨饿，别让它干太多活，也别打它。动物可能受的苦太多了，一件件说，怎么也说不完。
        - id: ch05-b03
          speaker: miss_laura
          text: >-
            不如只告诉大家，要有善意。你要用心弄明白自己的动物需要什么，再把这些需要照顾好。没有谁比你更清楚该怎样照料它，因为你天天同它相处。你知道它的性情，知道它能做多少活，要休息多久、吃多少东西，也知道它跟别的动物有什么不同。
        - id: ch05-b04
          speaker: miss_laura
          text: >-
            它生病了，或是不快活了，本来就该由你照顾。几乎每一只动物爱主人都胜过爱陌生人。主人亲自照料，它也会好得更快。
        - id: ch05-b05
          speaker: beautiful_joe
          text: >-
            劳拉小姐还说，人们若能在每一件事上善待这些不会说话、又为人效劳的伙伴，一定会惊喜地发现，动物能给生活带来那么多幸福。它们又会那么忠诚，那么懂得感恩。
        - id: ch05-b06
          speaker: beautiful_joe
          text: >-
            现在，我真的得把故事讲完了。读到这个故事的男孩女孩们，再见。要是一只狗说这样的话没有错，我还想说一句，愿上帝赐福给你们每一个人。
        - id: ch05-b07
          speaker: beautiful_joe
          text: >-
            狗和许多别的动物都爱自己的男女主人。它们活着，只想让主人高兴。如果我凭着这点微薄的力量，能让你们明白这件事，我的小故事就没有白写。
        - id: ch05-b08
          speaker: beautiful_joe
          text: >-
            最后，我只想说，男孩女孩们，请善待不会说话的动物。这样做，不只是因为你们不会失去什么，更因为这本来就是你们应该做的。那只仁慈的手把所有生命带到世间，也把它们安置在了这片大地上。
