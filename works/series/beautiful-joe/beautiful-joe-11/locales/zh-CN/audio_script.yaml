audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 慈爱从容，讲道理时温和而坚定
        timbre: 温润沉稳
        pace: 不疾不徐
        pitch: 中
    carl:
      display_name: 卡尔
      tts:
        delivery: 精明爽快，谈起鸟儿时认真投入
        timbre: 清亮的少年声
        pace: 明快
        pitch: 中高
    bella:
      display_name: 贝拉
      tts:
        delivery: 爱撒娇又神气，激动时尖声嚷嚷
        timbre: 尖细活泼
        pace: 稍快
        pitch: 高
    jack:
      display_name: 杰克
      tts:
        delivery: 聪明机灵，玩笑说得一本正经
        timbre: 清朗年轻
        pace: 明快
        pitch: 中高
    mrs_montague:
      display_name: 蒙塔古太太
      tts:
        delivery: 热情直率，对宠物满怀疼爱
        timbre: 成熟明亮
        pace: 适中
        pitch: 中
    dick:
      display_name: 迪克
      tts:
        delivery: 轻巧机灵，模仿人声时清脆短促
        timbre: 细亮的鸟鸣般声音
        pace: 稍快
        pitch: 高
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 理性温厚，说理简洁沉着
        timbre: 浑厚稳重
        pace: 从容
        pitch: 中低
    mr_montague:
      display_name: 蒙塔古先生
      tts:
        delivery: 随和沉稳，观察细致
        timbre: 成熟温和
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 卡尔的鸟房
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            莫里斯家的几个男孩，各有各的性情。杰克机灵，内德爱说笑也爱闹，威利整天捧着书，卡尔却天生就会做买卖。他常拿玩具和书跟同学交换，讲价时谁也占不到他的便宜。他说自己长大要当商人，现在已经买卖起金丝雀和金鱼了。他很爱那些被他叫作“黄色宠儿”的小鸟，可价钱合适，不管是哪一对鸟、哪一尾鱼，他都肯卖。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            卡尔独自睡在顶楼一间宽敞明亮的屋子里。房里照他的意思，几乎不放家具，全留给金丝雀繁育，也用来养金鱼。他不愿别人进去，说生人会吓着鸟儿。每天早晨，莫里斯太太铺好床，门就一直关到他放学回来。有一回，比利和我偷偷跟他上楼，他发现以后，马上把我们赶了下来。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            一天，贝拉想看金丝雀，自己走进了房间。她那时已经被宠得有些骄纵。卡尔后来告诉全家，贝拉小姐挺着胸脯走进来，神气活现，像在演戏。她还扯着尖嗓子招呼他们。
        - id: ch01-b04
          speaker: bella
          text: 早上好呀，小鸟们！卡尔，你好吗？见到你真高兴，小伙子！
          emotion: happy
        - id: ch01-b05
          speaker: carl
          text: 我见到你可一点也不高兴。以后不许再进来了，你会把我的金丝雀吓死的。
          emotion: angry
        - id: ch01-b06
          speaker: beautiful_joe
          text: 卡尔说得毫不含糊，随即把她赶下了楼。贝拉气坏了，一路尖叫着去找劳拉小姐。
        - id: ch01-b07
          speaker: bella
          text: 贝拉喜欢小鸟！贝拉不会伤害小鸟！卡尔是坏孩子！
          emotion: angry
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            劳拉小姐轻轻抚摸她，柔声哄她去找戴维玩。贝拉和那只老鼠是极好的朋友。他们两个结伴在屋里到处走，很是有趣。贝拉一开始就喜欢戴维，还把他哄进自己的笼子。没多久，戴维在那里就像在自己家里一样自在，夜里也睡在笼中。每天晚上九点左右，要是戴维不在身边，贝拉就会满屋找他。
        - id: ch01-b09
          speaker: bella
          text: 戴维！戴维！该睡觉啦。快到贝拉的笼子里来睡！
        - id: ch01-b10
          speaker: beautiful_joe
          text: 戴维很爱吃贝拉分到的甜糕点。不过，贝拉最喜欢的咖啡渣，他怎么也不肯吃。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            劳拉小姐为了贝拉去找卡尔，说他伤了她的心。卡尔便摸了贝拉几下，当作赔不是。接着，母亲告诉他，把金丝雀这样隔绝起来，也许并不对。现在鸟儿胆子小得很，她一进屋就不安，要等她离开才平静。受人宠爱的鸟兽本来喜欢交伴，也愿意有人陪，只有总被单独关着，才会怕生。她劝卡尔让兄弟们进鸟房，也偶尔把几位漂亮的小歌手带下楼，让全家听它们唱，看它们玩，也让它们习惯别的人。
        - id: ch01-b12
          speaker: beautiful_joe
          text: 卡尔听了，露出认真思量的样子。母亲又告诉他，家里谁也不会伤害这些鸟，连猫都不会。
        - id: ch01-b13
          speaker: jack
          text: 你还可以卖上一两天门票，带我们认识这些鸟，顺便挣点钱。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            杰克说得一本正经，卡尔却不大高兴。母亲拿出刚收到的一封信，他的气这才消了。信是她一个兄弟寄来的，想请她的一个儿子去乡下，在他家过圣诞假期。
        - id: ch01-b15
          speaker: mrs_morris
          text: 卡尔，我想让你去。
        - id: ch01-b16
          speaker: beautiful_joe
          text: 卡尔先是高兴极了，随即想起自己的宠物，神情又严肃起来。
        - id: ch01-b17
          speaker: mrs_morris
          text: 我和劳拉会好好照料它们，也会让它们换一种生活。
        - id: ch01-b18
          speaker: carl
          text: 那我就去吧。现在没有刚孵出来的小鸟，照料起来应该不会太麻烦。
    - id: ch02
      title: 圣诞假期里的照料
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: >-
            我却觉得，这些宠物照料起来麻烦得很。卡尔走后的第一个早晨，比利、贝拉、戴维和我跟着劳拉小姐上楼。她怕我们惊动鸟儿，叫我们在门边排成一行坐好。第一件事是给金丝雀洗澡，而且每天都要在同一个时辰洗。
        - id: ch02-b02
          speaker: beautiful_joe
          text: >-
            劳拉小姐把清水倒进一只只白色小碟，再放进鸟笼。然后她回到门边，在凳子上坐下。贝拉、比利和戴维都爬到她腿上，我就站在她身边。金丝雀歪着脑袋，一会儿瞧小浴盆，一会儿打量我们。它们知道我们都是生客。见我们一直安安静静，才终于跳进水里，扑扇着翅膀把水花溅得到处都是。它们洗得干干净净，玩得痛快极了。
        - id: ch02-b03
          speaker: beautiful_joe
          text: >-
            洗完以后，鸟儿跳上栖木，在阳光里抖掉水珠，仔细梳理羽毛。劳拉小姐清扫每只笼子，再喂油菜籽和金丝雀草籽混成的饲料。卡尔走前还特意叮嘱她，大麻籽不能喂太多，那东西很容易把鸟儿喂胖。他对鸟食讲究得很。夏天，我常看见他把新鲜的青绿食物拿上楼，有芹菜、繁缕、嫩卷心菜，还有桃子、苹果、梨和香蕉。如今是圣诞节，他就在窗台的花盆里种青菜。
        - id: ch02-b04
          speaker: beautiful_joe
          text: >-
            他还会喂粗面包屑、饼干和糖块，让鸟儿啄墨鱼骨，也准备许多别的食物。劳拉小姐处处照着他的吩咐做，只是她跟鸟儿说的话大概更多。饮水更是一点不马虎，每只盛水的小玻璃杯都洗得干干净净。
        - id: ch02-b05
          speaker: beautiful_joe
          text: >-
            鸟儿洗净安顿好，她把笼子放到阳光下，又去照料金鱼。那些鱼住在窗座上的大圆玻璃缸里。她用长柄锡杯把鱼舀进水盆，彻底洗净鱼缸，再把鱼放回去，在水面撒几片鱼食。金鱼一条条浮上来抢着吃，显然很满意。她把每一个鱼缸都这样仔细收拾一遍，一早晨的活才做完。
        - id: ch02-b06
          speaker: beautiful_joe
          text: >-
            劳拉小姐会离开一会儿，但白天每隔几小时就上楼看看，瞧瞧金鱼和金丝雀过得怎么样。屋里冷了，她把暖气开大些，也不让房间过热，免得鸟儿变得娇弱。过些日子，金丝雀都认得她了。一见她来，便在笼里欢快地跳，又啁啾，又唱歌。
        - id: ch02-b07
          speaker: beautiful_joe
          text: >-
            后来，她每天带几只鸟下楼，放出笼子一两个小时。小家伙们快活地在房里互相追逐。劳拉小姐坐着做针线，也守着它们。它们飞到她头上，还淘气地啄她的脸。鸟儿一点也不怕我和比利。最有趣的是，它们蹦到贝拉面前时，贝拉和这些小鸟一比，简直大得惊人。
        - id: ch02-b08
          speaker: beautiful_joe
          text: >-
            卡尔不在家时，有一只小鸟病了。劳拉小姐费尽心思照顾它，多喂大麻籽让它长胖，也常给它煮熟的蛋黄。饮水里放一枚钉子，早晨的浴水里滴几滴酒精，免得它着凉。鸟儿一洗完，她立刻拿走水碟，因为掺了酒精的水有毒。
        - id: ch02-b09
          speaker: beautiful_joe
          text: >-
            后来，小鸟身上又有了寄生虫。劳拉小姐写信问卡尔。卡尔叫她在秋千架上挂一个装满硫黄粉的细棉布袋，让鸟儿把粉末蹭到羽毛上。这个办法治好了它。卡尔回家时，小家伙已经完全康复。
    - id: ch03
      title: 跛脚的迪克
      blocks:
        - id: ch03-b01
          speaker: beautiful_joe
          text: >-
            卡尔回来后不久的一天，蒙塔古太太乘车到了门前。她带着一只金丝雀笼，外面仔细裹着披肩。她说，那个坏脾气的女佣早晨清理鸟笼时朝小鸟发火，竟然动手打它，打断了它一条腿。蒙塔古太太气愤极了，已经辞退了那个残忍的女佣。她自己不懂得照料金丝雀，只好请卡尔收下小鸟，替它治伤。
        - id: ch03-b02
          speaker: beautiful_joe
          text: >-
            卡尔刚刚放学回来。他扔下书，揭开笼上的披肩往里看。可怜的小鸟缩在角落，眼睛半闭着，一条腿软软地垂下来，嘴里还不时发出痛苦的轻鸣。
        - id: ch03-b03
          speaker: beautiful_joe
          text: >-
            卡尔一心要救它。他请蒙塔古太太一起动手，把火柴劈成细片，又撕出几条细棉布，为断腿包扎。小鸟被放回笼里以后，看起来舒服了一点。
        - id: ch03-b04
          speaker: carl
          text: 现在大概没事了。不过，您最好把它留在我这里几天，好吗？
        - id: ch03-b05
          speaker: beautiful_joe
          text: 蒙塔古太太高兴地答应了。临走时，她告诉卡尔，这只鸟叫迪克。
        - id: ch03-b06
          speaker: beautiful_joe
          text: >-
            第二天吃早饭，卡尔告诉母亲，他清早一醒就跳下床去看迪克。可是，这只可怜又糊涂的小鸟在夜里啄掉了夹板，伤势又跟原来一样糟。
        - id: ch03-b07
          speaker: carl
          text: 看来，我得给它做个外科手术了。
        - id: ch03-b08
          speaker: beautiful_joe
          text: >-
            我不明白这句话是什么意思。早饭后，卡尔把鸟带到母亲房里，我一直在旁边看。莫里斯太太捧着小鸟，卡尔拿起锋利的剪刀，在断处稍高一点的地方，干脆地剪下了那条腿。他在小小的残肢上涂好凡士林，仔细包扎，再把迪克交给母亲。整个上午，莫里斯太太一边做针线，一边留神看着它，不让它再啄掉绷带。
        - id: ch03-b09
          speaker: beautiful_joe
          text: 卡尔回家时，迪克好多了，甚至已经飞上栖木，兴高采烈地吃种子。
        - id: ch03-b10
          speaker: carl
          text: 可怜的迪克！一条腿，一截桩！
        - id: ch03-b11
          speaker: dick
          text: 一条腿，一截桩！
        - id: ch03-b12
          speaker: carl
          text: 嘿，它也跟着我说呢！
          emotion: surprised
        - id: ch03-b13
          speaker: beautiful_joe
          text: >-
            卡尔惊叫一声，随即放声大笑。迪克自己看起来很快活，可它拖着小小的残肢在笼里挪动，还得把残肢抵住栖木才不会跌下去，实在让人心酸。第二天，蒙塔古太太来了。她只看了一眼，就不忍再看下去。
        - id: ch03-b14
          speaker: mrs_montague
          text: 哎呀，它已经残缺成这样，我不能把它带回家。
          emotion: sad
        - id: ch03-b15
          speaker: beautiful_joe
          text: >-
            我忍不住想，她和劳拉小姐真不一样。动物若有什么缺陷，劳拉小姐只会更疼爱它。
        - id: ch03-b16
          speaker: mrs_montague
          text: 那我该怎么办呢？我太想念自己的小鸟了，只好再养一只。卡尔，你能卖给我一只吗？
          emotion: sad
        - id: ch03-b17
          speaker: carl
          text: 蒙塔古太太，我送您一只。我很愿意送给您。
        - id: ch03-b18
          speaker: beautiful_joe
          text: >-
            卡尔答得很急切。莫里斯太太听见以后，脸上露出了欣慰的神色。她有时担心，卡尔太爱赚钱，长大以后会变得自私。蒙塔古太太一直对莫里斯一家很好，卡尔似乎也很高兴能为她做件事。
    - id: ch04
      title: 巴里和十五美元
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            卡尔带蒙塔古太太上楼，请她挑最喜欢的鸟。她选中一只漂亮的黄色金丝雀，名叫巴里。巴里歌唱得很好，也是卡尔最心爱的鸟之一。卡尔把它放进笼子。那天又冷又下雪，他把笼子裹得严严实实，再提到门外，放上蒙塔古太太的雪橇。
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            蒙塔古太太高兴地朝他一笑，乘车走了。莫里斯太太还站在那里等。卡尔跑上台阶，一进屋就结结实实地亲了母亲一口，又变回一个无忧无虑的男孩子。
        - id: ch04-b03
          speaker: carl
          text: 没事的，妈妈。我把巴里送给她，一点也不舍不得。
        - id: ch04-b04
          speaker: mrs_morris
          text: 可你原来是准备卖掉它的，对吗？
        - id: ch04-b05
          speaker: carl
          text: 史密斯太太说过，从波士顿回来也许会买。不过我想，她会在那边直接买一只。
        - id: ch04-b06
          speaker: mrs_morris
          text: 你原来准备卖多少钱？
        - id: ch04-b07
          speaker: carl
          text: 嗯，要是少于十美元，我绝不会卖巴里。应该说，我本来绝不会卖。
        - id: ch04-b08
          speaker: beautiful_joe
          text: >-
            说完，卡尔跑去了马厩。莫里斯太太坐在门厅的椅子上。我在她身边蹭来蹭去，她有些心不在焉，只随手轻拍着我。过了一会儿，她起身走进丈夫的书房，把卡尔做的事告诉了他。莫里斯先生听后十分高兴。妻子又问，要不要为孩子做点什么，补偿他的损失。
        - id: ch04-b09
          speaker: mr_morris
          text: 我看还是不要。孩子做了一件善事，我们若随后奖赏他，并不一定妥当。
        - id: ch04-b10
          speaker: beautiful_joe
          text: >-
            不过，卡尔也并非没有得到回报。当天晚上，蒙塔古太太的车夫送来一封信，信封上写着“卡尔·莫里斯先生亲启”。卡尔当着全家人的面念了出来。
        - id: ch04-b11
          speaker: carl
          text: >-
            亲爱的卡尔，我太喜欢这只小鸟了。它还悄悄告诉我，你房间里藏着一个秘密。你很想要十五美元，给房间添置一样东西。我想，一位老朋友替你准备好买它的钱，你不会生她的气吧。艾达·蒙塔古。
        - id: ch04-b12
          speaker: carl
          text: >-
            这笔钱正好能买一只固定式水族箱养金鱼！我早就想要一个了，圆缸对鱼不好。可是她怎么会知道？我从没告诉过任何人。
          emotion: surprised
        - id: ch04-b13
          speaker: mrs_morris
          text: 一定是巴里告诉她的。
        - id: ch04-b14
          speaker: beautiful_joe
          text: 莫里斯太太微笑着接过钱，替卡尔收了起来。
    - id: ch05
      title: 两只快乐的金丝雀
      blocks:
        - id: ch05-b01
          speaker: beautiful_joe
          text: >-
            蒙塔古太太越来越喜欢巴里，什么事都亲自照料。我听她对莫里斯太太讲过许多巴里的奇事。那些故事奇妙得很，几乎让人难以相信。可是我知道，不会说话的动物受到善待以后，能变得多么聪明，所以我不会说那些事是假的。
        - id: ch05-b02
          speaker: beautiful_joe
          text: >-
            她只在夜里把巴里关进笼子。每到睡觉的时候，她开始找它，想送它回笼，巴里就藏起来。她找一会儿，坐下不找了，巴里马上从藏身处钻出来，顽皮地啾啾叫，故意让她看见。
        - id: ch05-b03
          speaker: beautiful_joe
          text: >-
            她说，巴里仿佛很喜欢捉弄她。有一次，巴里陪她待在客厅，她被人叫去接电话。等她回来，才发现仆人进过房间，还把通往游廊的门敞开了。外面的树上停满黄色的鸟。她以为巴里跟着它们飞走了，心里一下子绝望起来。
        - id: ch05-b04
          speaker: beautiful_joe
          text: >-
            她朝外张望，怎么也看不到巴里。又怕它仍在屋里，她便搬着一把椅子四处走，站上去查看墙壁，搜寻画框和小摆设之间。可哪里都没有。最后，她累得瘫坐在沙发上。就在这时，一声使坏似的轻啾传进耳朵。她抬头一看，巴里竟坐在那把椅子的一根横档上，正是她刚才搬来搬去的那把椅子。原来它一直待在那里。她重新见到巴里，高兴得根本想不起责骂它。
        - id: ch05-b05
          speaker: beautiful_joe
          text: >-
            吃饭时，巴里不许在餐厅里飞。女侍者摆桌前总要把它赶出去，这每次都会惹它生气。它停在楼梯上，隔着栏杆盯着餐厅门。门只要开一会儿，它就立刻飞进去。一天傍晚，下午茶前，它又溜进餐厅，看见餐具柜上有一块巧克力蛋糕，便凑过去啄个不停。蒙塔古太太刚好进来，又把它赶回门厅。
        - id: ch05-b06
          speaker: beautiful_joe
          text: 那天傍晚，蒙塔古太太和丈夫、年幼的儿子一起用茶，巴里又飞进了餐厅。她叫查理把它赶出去，蒙塔古先生却拦住了她。
        - id: ch05-b07
          speaker: mr_montague
          text: 等等，它像是在找什么东西。
        - id: ch05-b08
          speaker: beautiful_joe
          text: 巴里站在餐具柜上，一只碟子一只碟子地看，还想往盖子底下瞧。蒙塔古太太一下明白了。
        - id: ch05-b09
          speaker: mrs_montague
          text: 它在找巧克力蛋糕！来，查理，把这一小块拿到楼梯上给它。
          emotion: surprised
        - id: ch05-b10
          speaker: beautiful_joe
          text: 她切下一小片。查理拿着蛋糕走进门厅，巴里追着他飞出去，把那一小片吃得干干净净。
        - id: ch05-b11
          speaker: beautiful_joe
          text: >-
            至于可怜的跛脚迪克，卡尔始终没有卖掉它。它成了全家人的宠儿，鸟笼就挂在客厅里。从早到晚，大家都能听见它快活的声音。它又啾啾，又唱歌，仿佛这一生从来没有过烦恼。
        - id: ch05-b12
          speaker: beautiful_joe
          text: >-
            大家细心照顾迪克，既不让它太热，也不叫它受冻。谁经过鸟笼，都会高高兴兴地跟它说句话。要是它唱得太响，大家便给它一面小镜子，让它看看自己。迪克爱极了那面镜子，常常一站在镜前，就是整整一个小时。
