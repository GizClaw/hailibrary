  chapters:
    - id: ch01
      title: GOLDFISH AND CANARIES
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            The Morris boys were very different from one another. Jack was quick and clever. Ned loved a joke. Willie always had his nose in a book. And Carl had been born with a talent for trading.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Carl was forever swapping toys and books with his schoolmates, and no one ever beat him in a bargain. He meant to become a merchant when he grew up. In fact, he had already started a little business with canaries and goldfish. He dearly loved his “yellow pets,” as he called them, but a good offer could still persuade him to part with any bird or fish.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            He had a large sunny bedroom to himself at the top of the house. At his own request, it held very little furniture. That was where he raised the canaries and kept the goldfish.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Visitors were not welcome because Carl said they frightened his birds. Once Mrs. Morris had made his bed each morning, the door stayed shut until he came home from school. Billy and I followed him upstairs one day without being noticed. The moment he saw us, he hurried us straight back down.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            Bella ignored that rule one day and marched in to inspect the canaries. She had grown quite spoiled. Later, Carl told the family that watching her was as good as seeing a play. She strutted in with her chest thrust forward and spoke in her shrill, self-important way.
        - id: ch01-b06
          speaker: bella
          text: Good morning, birds! Good morning! And how are you, Carl? Bella is glad to see you, boy.
        - id: ch01-b07
          speaker: carl
          text: >-
            Well, I am not glad to see you. Don't come up here again. You'll scare my canaries half to death.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            He sent her flying downstairs. Bella was furious. She rushed to Miss Laura, shrieking her complaint.
        - id: ch01-b09
          speaker: bella
          text: Bella loves birds! Bella would never hurt birds! Carl is a bad boy!
          emotion: angry
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Miss Laura stroked and comforted her, then told her to find Davy and play with him. Bella and the rat were great friends. From the first, she had liked him. She coaxed him into her cage, and before long he felt so much at home there that he slept in it every night.
        - id: ch01-b11
          speaker: bella
          text: Davy! Davy! It's bedtime. Come and sleep in Bella's cage!
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            If he was not with her by nine o'clock, she searched the whole house and called until he came. Davy loved the sweet cakes she was given. But Bella never managed to persuade him to eat her favorite treat, coffee grounds.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            Miss Laura spoke to Carl and explained that he had hurt Bella's feelings. He petted her for a while to make peace. Then Mrs. Morris told him she thought he was making a mistake by keeping the canaries away from everyone.
        - id: ch01-b14
          speaker: mrs_morris
          text: >-
            They have become so timid that they stay uneasy whenever I enter the room. Pets enjoy company and become friendly when they have it. Keep them alone, and they grow shy. Let your brothers visit them sometimes. You could also bring a few of your pretty singers downstairs. Then we could all see and hear them, and they would learn to be comfortable with people besides you.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Carl considered what she had said. Mrs. Morris reminded him that no one in the house would hurt his birds, not even the cat.
        - id: ch01-b16
          speaker: jack
          text: >-
            You could charge us admission for a day or two. Introduce us to the birds and earn a little money from it.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Carl did not enjoy Jack's solemn suggestion. His mother settled him by showing him a letter from one of her brothers. The uncle wanted one of the boys to spend the Christmas holidays with him in the country.
        - id: ch01-b18
          speaker: mrs_morris
          text: I want you to be the one who goes, Carl.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            Carl was delighted. Then he remembered his pets and became serious.
        - id: ch01-b20
          speaker: mrs_morris
          text: Laura and I will care for them. We can begin their new routine while you're away.
        - id: ch01-b21
          speaker: carl
          text: >-
            All right, then I'll go. I don't have any young birds just now, so caring for them shouldn't be too much trouble.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            It seemed like a great deal of trouble to me. On the first morning after Carl left, Billy, Bella, Davy, and I followed Miss Laura upstairs. To keep us from startling the canaries, she made us sit in a row beside the door.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            Her first task was giving the canaries their baths at the usual morning hour. She filled their little white dishes with water and placed them inside the cages. Then she sat on a stool near us. Bella, Billy, and Davy climbed into her lap, while I stood close beside her.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            The birds tilted their heads. They looked at the baths, then at us, and knew we were strangers. At last, when they saw how quiet we were, they hopped into the water. They had a wonderful time fluttering their wings, splashing, and washing every feather.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            Afterward, they perched in the sunshine. They shook off the water and carefully picked through their feathers. Miss Laura cleaned every cage and gave each bird a mixture of rape seed and canary seed. Carl had warned her not to offer much hemp seed because it would make them too fat.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            He took great care over their meals. In summer I had often watched him carry up celery, chickweed, young cabbage, peaches, apples, pears, and bananas. Now, at Christmas, he had fresh green plants growing in pots along the window ledge.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            The birds also received coarse bread crumbs, crackers, lumps of sugar, cuttlefish to peck, and many other things. Miss Laura followed every instruction, though I think she talked to them more than Carl did. She was especially careful with their drinking water and scrubbed its little glass cups thoroughly.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            Once the canaries were clean and comfortable, she set their cages in the sun and began on the goldfish. Their large glass globes stood on the window seat. With a long-handled tin cup, she moved the fish from one globe into a basin of water. She washed the globe well, returned the fish, and scattered food wafers across the surface. They darted up and snapped at the food as though they were glad to see it.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            She repeated the work for every globe, and that finished the morning's tasks. Still, she came back every few hours to check on both fish and birds. If the room felt chilly, she raised the heat. She never let it grow too warm, because that would leave the canaries delicate.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            In time, the canaries came to know her. They hopped cheerfully through their cages, chirping and singing whenever she appeared. Then she began carrying some downstairs and letting them fly free for an hour or two each day.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Those happy little creatures chased one another around the room. While Miss Laura sewed and watched them, they landed on her head and gave her face saucy little pecks. They had lost all fear of Billy and me. And when they hopped close to Bella, it was quite a sight. She looked enormous beside them.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            One small bird fell ill while Carl was away, and Miss Laura gave it constant care. To fatten it, she supplied plenty of hemp seed and frequent bits of hard-boiled egg yolk. She kept a nail in its drinking water and added a few drops of alcohol to its morning bath to guard against a chill. The instant the bath was over, she removed the dish because the alcohol made that water poisonous.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            Then the bird was troubled by vermin. Miss Laura wrote to Carl for advice. He told her to fill a muslin bag with sulphur and hang it above the swing, where the bird would shake the powder down over its own feathers. The remedy worked. By the time Carl returned, the little patient was well again.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Soon after Carl came home, Mrs. Montague arrived with a canary cage carefully wrapped in a shawl. That morning, her bad-tempered housemaid had become angry while cleaning the cage. She struck the bird and broke its leg. Mrs. Montague was disgusted by such cruelty and dismissed the girl. Since she knew nothing about canaries herself, she had brought the injured bird to Carl.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Carl had only just returned from school. He dropped his books, uncovered the cage, and looked inside. The poor canary huddled in a corner. Its eyes were half closed, one leg hung loosely, and faint cries of pain came from its beak.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            The case interested Carl at once. With Mrs. Montague's help, he split matches for splints and tore muslin into narrow strips. Together they bandaged the broken leg. When Carl put the bird back, it looked more comfortable.
        - id: ch01-b37
          speaker: carl
          text: >-
            I think that should hold. Wouldn't it be better to leave him here with me for a few days?
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Mrs. Montague gladly agreed. Before leaving, she told him the canary was named Dick.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            At breakfast the next morning, I heard Carl tell his mother that he had jumped out of bed the moment he woke and gone straight to Dick. During the night, the foolish little bird had picked away the splints. His leg was just as bad as before.
        - id: ch01-b40
          speaker: carl
          text: I will have to operate on him.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            I did not understand what that meant, so after breakfast I watched Carl bring Dick into his mother's room. Mrs. Morris held the bird. Carl took a pair of sharp scissors and cut off the leg a little above the break. He rubbed vaseline on the tiny stump, bandaged it, and left Dick with his mother. As she sewed all morning, she kept watch so he could not tear off this bandage too.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            By the time Carl returned, Dick had improved so much that he had flown up to his perch and was eating seed quite merrily.
        - id: ch01-b43
          speaker: carl
          text: Poor Dick! A leg and a stump!
        - id: ch01-b44
          speaker: dick
          text: A leg and a stump!
        - id: ch01-b45
          speaker: carl
          text: Why, he is saying it too!
          emotion: surprised
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            Carl burst out laughing. Dick himself seemed cheerful. Still, it was pitiful to watch him drag the little stump around his cage and brace it against the perch so he would not fall.
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            Mrs. Montague returned the following day, but the sight of Dick was too much for her.
        - id: ch01-b48
          speaker: mrs_montague
          text: Oh, dear! I simply cannot take home a bird who looks like that.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            I could not help thinking how unlike Miss Laura she was. Miss Laura loved a creature even more when it had some blemish.
        - id: ch01-b50
          speaker: mrs_montague
          text: >-
            But what am I going to do? I miss having my little bird. I suppose I must get another one. Carl, could you sell me a canary?
        - id: ch01-b51
          speaker: carl
          text: I would rather give you one, Mrs. Montague. I would truly like to.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            Mrs. Morris looked pleased. She had sometimes worried that Carl's love of profit might make him selfish. But Mrs. Montague had always been kind to the family, and he was happy to do her a favor.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            Carl took her upstairs and invited her to choose any bird she liked. She chose Barry, a handsome yellow canary with a fine song. He was one of Carl's favorites. Carl settled him in the cage, wrapped it warmly against the cold and snow, and carried it out to Mrs. Montague's sleigh.
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            She smiled at him and drove away. Carl bounded back up the steps. Mrs. Morris was waiting inside, and he gave her a hearty boyish kiss.
        - id: ch01-b55
          speaker: carl
          text: It's all right, Mother. I don't mind giving Barry to her.
        - id: ch01-b56
          speaker: mrs_morris
          text: But hadn't you been planning to sell him?
        - id: ch01-b57
          speaker: carl
          text: >-
            Mrs. Smith said she might take him after she returned from Boston. Still, she could easily change her mind and buy one there.
        - id: ch01-b58
          speaker: mrs_morris
          text: What price were you going to ask?
        - id: ch01-b59
          speaker: carl
          text: >-
            I wouldn't take less than ten dollars for Barry. Or rather, I wouldn't have taken less.
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            Then he ran out to the stable. Mrs. Morris sat in the hall and absently patted me while I rubbed against her. After a moment, she went into her husband's study and told him what Carl had done. Mr. Morris was very pleased. She asked whether they ought to make up the boy's loss, but he disagreed.
        - id: ch01-b61
          speaker: mr_morris
          text: >-
            I would rather not. When a child chooses to be kind, rewarding him afterward is not always a wise principle.
        - id: ch01-b62
          speaker: beautiful_joe
          text: >-
            Yet Carl did receive a reward. That evening, Mrs. Montague's coachman delivered a note addressed to Mr. Carl Morris. Carl read it aloud to everyone.
        - id: ch01-b63
          speaker: carl
          text: >-
            My dear Carl, I am delighted with my little bird. He has whispered one of your room's secrets to me. You badly want fifteen dollars to buy something for it. I hope you will not be offended if an old friend gives you the money you need. Ada Montague.
        - id: ch01-b64
          speaker: carl
          text: >-
            That's exactly what I need for a proper tank for the goldfish! I've wanted one for ages because globes aren't good for them. But how could she know? I have never told anybody.
          emotion: surprised
        - id: ch01-b65
          speaker: mrs_morris
          text: Barry must have told her.
        - id: ch01-b66
          speaker: beautiful_joe
          text: >-
            Mrs. Morris smiled as she took the money to keep it safe for him.
        - id: ch01-b67
          speaker: beautiful_joe
          text: >-
            Mrs. Montague grew very fond of Barry and cared for him herself. Later, I heard her tell Mrs. Morris astonishing stories about him. I might have doubted them if I had not known how intelligent animals become when people treat them kindly.
        - id: ch01-b68
          speaker: beautiful_joe
          text: >-
            Barry stayed in his cage only at night. Whenever Mrs. Montague began searching for him at bedtime, he hid. She would look for a little while and then sit down. At once, he would pop out and give a saucy chirp to make her notice him. Teasing her seemed to delight him.
        - id: ch01-b69
          speaker: beautiful_joe
          text: >-
            Once Barry was loose in the drawing room when Mrs. Montague was called to the telephone. While she was gone, a servant entered and left open the door to the veranda. Outside, the trees were full of yellow birds.
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            When Mrs. Montague returned, she despaired. She thought Barry had flown away with them. She searched outdoors but saw no sign of him. Then she wondered if he might still be inside. She carried a chair around the room and stood on it again and again, examining the walls, pictures, and ornaments.
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            Barry was nowhere to be seen. At last, exhausted, she dropped onto a sofa. A tiny, wicked peep sounded above her. She looked up. There sat Barry on one of the rungs of the very chair she had carried all around the room. He had been riding along the whole time. Mrs. Montague was so relieved that she forgot to scold him.
        - id: ch01-b72
          speaker: beautiful_joe
          text: >-
            During meals, Barry was never permitted to fly in the dining room. The maid put him out before setting the table. This always annoyed him. He perched on the staircase and watched the door between the railings, ready to dart through if anyone left it open for even a moment.
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            One evening before tea, he found his chance. A chocolate cake stood on the sideboard, and he liked its appearance so much that he began pecking it. Mrs. Montague came in and chased him back into the hall.
        - id: ch01-b74
          speaker: beautiful_joe
          text: >-
            During tea with her husband and little Charlie, Barry flew in once more.
        - id: ch01-b75
          speaker: mrs_montague
          text: Charlie, please put him out again.
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            But Mr. Montague stopped the boy.
        - id: ch01-b77
          speaker: mr_montague
          text: Wait a moment. He is searching for something.
        - id: ch01-b78
          speaker: beautiful_joe
          text: >-
            Barry stood on the sideboard, peering into every dish and trying to see beneath the covers.
        - id: ch01-b79
          speaker: mrs_montague
          text: >-
            He wants that chocolate cake. Here, Charlie. Take this little piece and put it on the staircase for him.
        - id: ch01-b80
          speaker: beautiful_joe
          text: >-
            She cut off a scrap. Charlie carried it into the hall, and Barry flew after him and ate every bit.
        - id: ch01-b81
          speaker: beautiful_joe
          text: >-
            Poor lame Dick was never sold. He became a pet of the whole Morris family, and his cage hung in the parlor. From morning until night, his cheerful voice filled the room with chirps and songs, as if he had no trouble in the world.
        - id: ch01-b82
          speaker: beautiful_joe
          text: >-
            Everyone took excellent care of him. They never let him become too hot or too cold, and each person offered a friendly word when passing his cage. If his singing grew too loud, they gave him a little mirror. Dick adored it and would often stand before his reflection for an hour at a time.
