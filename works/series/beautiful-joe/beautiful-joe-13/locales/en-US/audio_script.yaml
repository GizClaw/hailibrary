  chapters:
    - id: ch01
      title: THE BEGINNING OF AN ADVENTURE
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            My first winter with the Morrises brought me an adventure. It began a week before Christmas, during a spell of cold, frosty weather. There was little snow, but the ice was good. Every day the boys took their skates to a small lake near Fairport. Jim and I often went too. We scampered after them across the ice, slipping with nearly every step, and had great fun.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            One Saturday evening, we came home after dark. A cold wind was blowing outside. The red glow of the hall stove and the bright parlor fire looked wonderfully cheerful when we stepped through the front door.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            With all that warmth inside the house, I still felt sorry that Jim had to go back outdoors to his kennel.
        - id: ch01-b04
          speaker: jim
          text: I don't mind going out, Joe.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The boys carried him a plate of warm meat and a bowl of milk, and then he went to sleep. His kennel was snug and very roomy for a spaniel. Though Jim was not a large dog, he had as much room as a Great Dane. Mr. Morris and the boys had built it themselves. Jim liked being able to rise and stretch during the night whenever he grew tired of one position. The kennel stood a little above the ground, with a thick bed of straw across its floor. Higher up was a broad shelf, wide enough for Jim to lie on and covered with an old catskin sleigh robe. He always chose that shelf in cold weather because it kept him farther from the ground.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            That evening, I was so hungry I could hardly lie still while Miss Laura finished her tea. Mrs. Morris knew the boys would be hungry too. She had Mary broil beefsteak and roast potatoes for them, and the smell was delicious.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            The boys ate every bit of the steak and potatoes. That made no difference to me. Even if some had remained, Mrs. Morris could not afford to give us the good meat she bought for her children. She had the butcher send liver, bones, and tougher pieces for the dogs instead. Mary cooked those into soup or broth, then mixed them with our porridge.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            We only ate meat once a day. Miss Laura said rich meals might suit hunting dogs, but house dogs could become ill from too much food. At our other meals, we had bread and milk, porridge, or dog biscuits.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            I made a dreadful noise as I ate. Since Jenkins had cut off my ears, breathing had been hard for me. My earflaps had once kept wind and dust from getting inside. Without them, my head felt stuffed up all the time. Cold weather made it worse. Sometimes I struggled so much for breath that I thought I might choke. I had seen people open their mouths to breathe, and doing that would probably have made me more comfortable. But dogs always want to breathe through their noses.
        - id: ch01-b10
          speaker: miss_laura
          text: >-
            You've caught more cold, Joe. Finish your meat, and then come sit with me by the fire. Why, do you want another helping?
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            I gave a small bark, and she filled my plate again. Miss Laura never let anyone bother us while we ate. Once, she found Willie snatching at a bone I was chewing.
        - id: ch01-b12
          speaker: miss_laura
          text: >-
            Willie, suppose you were very hungry and had just started on your meat and potatoes. What would you do if I came by and snatched away your plate?
        - id: ch01-b13
          speaker: willie
          text: I don't know, but I'd want to give you a walloping.
          emotion: happy
        - id: ch01-b14
          speaker: miss_laura
          text: >-
            Then Joe may try to wallop you one day if you trouble him over his food. Even a gentle dog may snap when someone disturbs his meal. You had better not test his patience too far.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Willie never teased me at meals again. I was glad, because two or three times I had nearly snarled at him.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            After tea, I followed Miss Laura upstairs. She settled into a low chair with a book, and I lay beside her on the hearth rug.
        - id: ch01-b17
          speaker: miss_laura
          text: >-
            Joe, do you know why you scratch at the floor before lying down, as though you're making a little hollow? And why do you turn around so many times first?
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Of course I did not know. I only stared at her.
        - id: ch01-b19
          speaker: miss_laura
          text: >-
            Long, long ago, dogs didn't live in people's houses the way you do. They were wild and ran through the woods. They scratched among the leaves to make comfortable beds. You are descended from those dogs, Joe, so their old habit has come down to you.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            I found that very interesting. She might have told me more about my wild ancestors, but the rest of the family came in.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            That was always the coziest part of the day for me. The whole family gathered around the fire. Mrs. Morris sat sewing, while the boys read or studied. Mr. Morris had his head buried in a newspaper. Billy and I lay on the floor at their feet.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            I was nearly asleep when Ned nudged me with his foot. He loved teasing me into making a fool of myself. I tried to stare at the fire, but at last I had to look. Ned hid behind his book, opened his mouth wide, and tipped back his head as though he were howling.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            I could not help myself. I let out a loud howl.
        - id: ch01-b24
          speaker: mrs_morris
          text: Bad Joe. Be quiet.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            The boys all laughed behind their books because they knew exactly what Ned was doing. Soon he began his silent howling again. I was just opening my mouth to answer him, and that second howl might have gotten me sent out of the room. Before I could finish, the door opened. A young girl named Bessie Drury came in. She wore a cap and had a shawl thrown over her shoulders. She had run across the street from her father's house.
        - id: ch01-b26
          speaker: bessie
          text: >-
            Oh, Mrs. Morris, may Laura stay with me tonight? Mamma just received a telegram from Bangor. Her aunt, Mrs. Cole, is very ill and wants to see her. Papa is taking Mamma there on tonight's train, and she's worried I'll be lonely without Laura.
        - id: ch01-b27
          speaker: mrs_morris
          text: Couldn't you spend the night here instead?
        - id: ch01-b28
          speaker: bessie
          text: No, thank you. I think Mamma would rather have me stay at home.
        - id: ch01-b29
          speaker: mrs_morris
          text: All right. I think Laura would be glad to go.
        - id: ch01-b30
          speaker: miss_laura
          text: Of course I will. I'll come over in half an hour.
          emotion: happy
        - id: ch01-b31
          speaker: bessie
          text: Thank you so much.
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Bessie hurried away. Then Mr. Morris looked up from his newspaper.
        - id: ch01-b33
          speaker: mr_morris
          text: Will anyone else be in the house with those two girls?
        - id: ch01-b34
          speaker: mrs_morris
          text: >-
            Oh, yes. Mrs. Drury's old nurse has been with her for twenty years. There are two maids as well, and Donald, the coachman, sleeps above the stable. The girls will be well protected.
        - id: ch01-b35
          speaker: mr_morris
          text: Very good.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            He returned to his paper. Animals may not understand everything people talk about, but humans would be astonished by how much we gather from their faces and the sound of their voices. I knew Mr. Morris did not quite like the idea of Laura staying at the Drurys' while the master and mistress of the house were away. That was enough for me. I decided I would go with her.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            When Laura came downstairs with a small satchel on her arm, I stood beside her.
        - id: ch01-b38
          speaker: miss_laura
          text: Dear old Joe, you can't come with me.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            She kissed her parents and the boys. As she stepped through the door, I squeezed out beside her.
        - id: ch01-b40
          speaker: miss_laura
          text: Go back, Joe.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            Her voice was firm, so I had to step back inside. Still, I cried and whined instead of settling down. She stared at me in surprise because I had never acted that way before.
        - id: ch01-b42
          speaker: miss_laura
          text: I'll be home in the morning, Joe. Please don't squeal like that.
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            Then she shut the door and went out. I felt dreadful. I walked up and down the floor, rushed to the window, and howled without needing to watch Ned. Mrs. Morris peered at me over her glasses in complete surprise.
        - id: ch01-b44
          speaker: mrs_morris
          text: Boys, have you ever seen Joe behave this way before?
        - id: ch01-b45
          speakers: [ned, willie, jack]
          ensemble: chorus
          text: No, Mother.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            Mr. Morris watched me closely. He noticed me more than anyone else in the house did, and I was very fond of him. I ran over and put my paws on his knees.
        - id: ch01-b47
          speaker: mr_morris
          text: Mother, let the dog go.
        - id: ch01-b48
          speaker: mrs_morris
          text: >-
            Very well. Jack, take him across and tell Mrs. Drury how strangely he's acting. Ask her, please, to let him stay with Laura tonight.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Jack sprang up at once and seized his cap. Together we raced down the front steps, across the street, and through the Drurys' gate. Then we hurried up the gravel walk. The cold had frozen all the little stones so firmly that none of them shifted beneath our feet.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            The Drurys lived in a large white house surrounded by trees, with a garden behind it. They were rich and entertained many guests. All through the summer, I had often seen carriages waiting at their door. Ladies and gentlemen in light clothes walked across the lawn, and sometimes I caught the smell of the fine things they were eating. But the Drurys kept no dogs or pets of any kind. Jim and I had never found an excuse to call on them.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            At the front door, Jack rang the bell and handed me over to Susan, the maid who answered. She listened to his message for Mrs. Drury, then led me upstairs, smiling back at me.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            A trunk stood in the upper hall, where an elderly nurse was packing. Another lady watched her. The moment that lady saw me, she gave a little scream.
        - id: ch01-b53
          speaker: mrs_drury
          text: Oh, Nurse, look at that horrid dog! Where did he come from? Susan, put him out!
          emotion: surprised
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            I stood perfectly still while Susan repeated Jack's message.
        - id: ch01-b55
          speaker: mrs_drury
          text: >-
            Certainly. If he belongs to the Morrises, I'm sure he behaves well. Tell the little boy to thank his mother for letting Laura stay, and say we're pleased to keep the dog. Now, Nurse, we must hurry. The cab will be here in five minutes.
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            I walked softly into a front room and found my dear Miss Laura with Bessie. They were cramming things into a traveling bag. Both girls rushed into the hall to find out how I had come there. At that same moment, a gentleman hurried upstairs and announced that the cab had arrived.
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            For a few minutes, the whole house was confused and hurried. Then the cab rolled away, and everything became quiet. Bessie turned to the elderly woman while we stood together in the hall.
        - id: ch01-b58
          speaker: bessie
          text: >-
            Nurse, you must be tired. You should go to bed. Susan, please bring supper to the dining room for Miss Morris and me. Laura, what would you like?
        - id: ch01-b59
          speaker: miss_laura
          text: What are you having?
        - id: ch01-b60
          speaker: bessie
          text: Hot chocolate and tea biscuits.
        - id: ch01-b61
          speaker: miss_laura
          text: Then I'll have the same.
        - id: ch01-b62
          speaker: bessie
          text: >-
            Bring us some cake too, Susan, and something for the dog. He would probably enjoy the turkey left from dinner.
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            If I had possessed ears, I would have pricked them up. I loved fowl, but at the Morrises' I never got more than an odd bone or two.
        - id: ch01-b64
          speaker: beautiful_joe
          text: >-
            What fun we had over supper! The girls sat at the big dining table, sipping their hot chocolate as they laughed and talked. On the carpet, Susan spread out a newspaper for me and set down the skeleton of a whole turkey. I was very careful with it. I held the bones on the paper with my paws and never dragged my meal across the carpet. The sight made Bessie laugh until tears filled her eyes.
        - id: ch01-b65
          speaker: bessie
          text: >-
            That dog is a gentleman! Look at him holding the bones on the paper with his paws and pulling off the meat with his teeth. Oh, Joe, you're such a funny dog, and that's a funny supper. I've heard of quail on toast, but never turkey on newspaper.
          emotion: happy
        - id: ch01-b66
          speaker: beautiful_joe
          text: >-
            When the hall clock struck eleven, Laura spoke.
        - id: ch01-b67
          speaker: miss_laura
          text: Shouldn't we go to bed now?
        - id: ch01-b68
          speaker: bessie
          text: Yes, I suppose so. But where will this animal sleep?
        - id: ch01-b69
          speaker: miss_laura
          text: I don't know. At home, he sleeps in the stable or shares Jim's kennel.
        - id: ch01-b70
          speaker: bessie
          text: Susan could make him a comfortable bed beside the kitchen stove.
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            Susan made the bed beside the kitchen stove, but I was not willing to sleep in it. The moment they shut me in alone, I barked as loudly as I could. I kept it up until they had no choice but to open the door and let me follow the girls upstairs.
        - id: ch01-b72
          speaker: beautiful_joe
          text: >-
            Miss Laura was almost angry with me. I could not help it. I had come to protect her, and I would not leave her if I could prevent it.
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            Bessie's bedroom was handsomely furnished. A soft carpet covered the floor, and pretty curtains hung at the windows. There were two single beds. The girls dragged them close together so they could keep talking after they climbed in.
        - id: ch01-b74
          speaker: bessie
          text: >-
            Don't be frightened if you hear someone walking around tonight. Nurse is sleeping across the hall, and she'll probably come in once or twice to make sure we're comfortable.
        - id: ch01-b75
          speaker: beautiful_joe
          text: >-
            The girls went on talking for a long time. At last, they both fell asleep. Just before Laura drifted off, she forgave me for refusing the kitchen. I lay on a fur rug close beside her bed, and she lowered one hand for me to lick.
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            I was very tired, and the rug made a soft, pleasant bed, so I soon fell into a heavy sleep. Yet the smallest sound woke me. Once Laura turned in bed. Another time Bessie laughed in her sleep. Then the frost made the tree limbs outside crackle in a strange way, and I started up quickly once more.
        - id: ch01-b77
          speaker: beautiful_joe
          text: >-
            A large clock stood in the hall, and every time it struck, I woke. Once, just after it marked an hour, I jumped from a sound sleep. I had been dreaming about my first home. In the dream, Jenkins was after me with a whip. When I awoke, my legs were still quivering and trembling as though I had been struggling to escape him.
        - id: ch01-b78
          speaker: beautiful_joe
          text: >-
            I sprang up, shook myself, and made a circuit of the room. The two girls were breathing so gently that I could scarcely hear them. Then I walked to the door and looked into the hall, where a dim light was still burning. The nurse's door stood open across the way. I went quietly to it and looked inside. She was breathing heavily and muttering in her sleep.
        - id: ch01-b79
          speaker: beautiful_joe
          text: >-
            I returned to my rug and tried to sleep, but I could not. An uneasy feeling had come over me, and it kept me walking around the room. I went into the hall once more and stood at the top of the staircase. Perhaps a walk through the lower hall would settle me, and then I could come back to bed.
        - id: ch01-b80
          speaker: beautiful_joe
          text: >-
            The Drurys' carpets felt like velvet. My paws made none of the rattling sound they made on the Morrises' oilcloth. I crept down the stairs like a cat and moved along the lower hall. At every door, I smelled underneath it and listened before going on.
        - id: ch01-b81
          speaker: beautiful_joe
          text: >-
            There was no night-light burning downstairs, so the lower hall was quite dark. That did not trouble me. If any strange person had been hiding there, I knew my nose would have found him.
        - id: ch01-b82
          speaker: beautiful_joe
          text: >-
            Near the far end of the hall, something surprised me. A tiny gleam of light shone beneath the dining-room door. It lasted only an instant, and then it disappeared. The dining room was the place where people ate. Surely none of the people in that house could be there after the supper we had eaten.
        - id: ch01-b83
          speaker: beautiful_joe
          text: >-
            I went to the door and sniffed beneath it. A strong smell reached me, the smell of beggars and poor people. It smelled like Jenkins. It was.
