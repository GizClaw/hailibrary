audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 温厚稳重，言语清楚有分寸
        timbre: 醇厚温和
        pace: 不疾不徐
        pitch: 中低
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 慈爱持重，管教孩子时干脆明白
        timbre: 温和饱满
        pace: 适中
        pitch: 中
    willie:
      display_name: 威利
      tts:
        delivery: 活泼直率，带着孩子气的淘气
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快利落，充满少年人的朝气
        timbre: 清亮结实
        pace: 稍快
        pitch: 中
    ned:
      display_name: 内德
      tts:
        delivery: 顽皮机灵，笑意总藏在话音里
        timbre: 明亮轻快
        pace: 稍快
        pitch: 中高
    bessie_drury:
      display_name: 贝茜·德鲁里
      tts:
        delivery: 热情活泼，语气亲切自然
        timbre: 清甜明亮
        pace: 轻快
        pitch: 中高
    mrs_drury:
      display_name: 德鲁里太太
      tts:
        delivery: 忙碌讲究，惊讶过后仍不失礼貌
        timbre: 圆润清楚
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十三章　一次冒险的开端
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我在莫里斯家过第一个冬天时，遇上了一次冒险。那是圣诞节前一个星期，天气很冷，霜冻得厉害。雪没有下多少，冰却结得很好。男孩子们每天带着冰鞋，到费尔波特附近的小湖上去。吉姆和我也常跟着。我们追在他们身后，在冰面上东跑西跑，一步一滑，玩得特别痛快。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            这个星期六晚上，我们刚从湖上回来。外面已经黑了，冷风呼呼地吹。可一进前门，门厅的大火炉透着红光，客厅里的炉火烧得正旺，叫人一下子就暖和起来。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            吉姆还得回外面的狗屋，我真替他难过，他却说不要紧。男孩子们给他送去一盘热腾腾的肉和一碗牛奶，他吃完便睡了。吉姆是只不大的西班牙猎犬，狗屋却宽敞得像是给一只大丹犬住的。那是莫里斯先生和男孩子们亲手做的。吉姆很喜欢，因为夜里要是在一个姿势上躺累了，他还能站起来，好好伸一伸身子。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            狗屋稍稍离开地面，地板上铺着厚厚的干草。上面还有一块很宽的搁板，足够吉姆舒舒服服地躺下，板上还铺着一条旧猫皮雪橇毯。冷天里，吉姆总睡在那上面，因为那里离冰冷的地面更远。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            还是说回那个十二月的晚上吧。我至今记得自己有多饿，连一会儿也躺不住，只盼劳拉小姐快些喝完茶。莫里斯太太知道儿子们从冰湖回来一定饿坏了，让玛丽煎了牛排，又烤了土豆。那香味可真馋人！
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            他们把牛排和土豆全吃光了。就算有剩的，我也分不到。莫里斯太太没有那么多钱，不能拿孩子们吃的好肉喂狗。她常叫肉铺送来肝、骨头和硬肉，让玛丽煮熟，熬出汤汁，再拌上粥给我们吃。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            我们从来不是一天三顿都有肉。劳拉小姐说，猎犬吃肉很合适，可家养的狗吃得太好，反而会生病。所以其余两顿，我们吃面包泡牛奶、粥，或者狗饼干。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            我吃东西时，总会发出很难听的呼吸声。自从詹金斯割掉我的耳朵，我就一直喘不过气。原先垂下的耳朵能替耳道挡住风和尘土，如今耳朵没了，我的脑袋总是堵得难受。天一冷，情况就更糟。有时我费好大力气也吸不进一口气，像是马上就要窒息了。我见过有些人张着嘴呼吸，那样做本来会舒服些，可狗总喜欢用鼻子喘气。
        - id: ch01-b09
          speaker: miss_laura
          text: >-
            乔，你又着凉了。先把肉吃完，再来陪我坐在炉边。怎么，你还想再吃一点吗？
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            我轻轻叫了一声，她又给我盛满一盘。我们吃饭时，劳拉小姐从不许别人打扰。有一次，威利伸手抢我正在啃的骨头，她看见了，便问他，要是他饿着肚子刚开始吃牛肉和土豆，自己却过来把盘子抢走，他会怎么办。
        - id: ch01-b11
          speaker: willie
          text: 我也不知道。不过，我准会想揍你一顿。
        - id: ch01-b12
          speaker: miss_laura
          text: >-
            那你再这样打扰乔吃东西，没准哪天他也会“揍”你。再温顺的狗，吃饭时受了打扰，也可能会咬人一口。你可别把他的耐性逼得太过分。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            从此威利再也不那样逗我。我真庆幸，因为先前有两三次，我差点就忍不住朝他低吼了。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            吃完晚饭，我跟劳拉小姐上楼。她拿着一本书，在矮椅子上坐下。我就在她身边的炉前地毯上卧着。
        - id: ch01-b15
          speaker: miss_laura
          text: >-
            乔，你每次躺下以前，为什么总要用爪子抓几下，好像要刨出一个小窝？为什么还要转好多圈，才肯卧下来？
        - id: ch01-b16
          speaker: beautiful_joe
          text: 我当然不知道，只能望着她。她低头看着我，接着讲下去。
        - id: ch01-b17
          speaker: miss_laura
          text: >-
            很久很久以前，没有狗像你这样住在人家屋里。那时的狗都是野兽，在树林里四处奔跑。它们会扒开落叶，给自己弄一个舒服的窝。你是它们的后代，这个习惯也就一代一代传到了你身上。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            这件事听来真有趣。她大概还想再讲些我那些野生祖先的故事，可家里其余的人恰好进来了。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            我一直觉得，这是一整天里最安逸的时候。全家围着炉火坐在一起。莫里斯太太做针线，男孩子们看书或温习功课，莫里斯先生把头埋在报纸里，小比利和我躺在他们脚边。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            这天晚上，我困得眼皮直往下掉，差不多已经睡着了，内德却用脚推我。他最爱捉弄人，尤其喜欢哄我做傻事。我竭力让眼睛只盯着炉火，可怎么也做不到，最后还是忍不住转过头去。他把书举在自己和母亲中间，挡住她的视线，嘴巴张得老大，头向后仰，装出正在嚎叫的样子。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            我实在忍不住，也扯开嗓子叫了一声。莫里斯太太立刻抬起头。
        - id: ch01-b22
          speaker: mrs_morris
          text: 坏乔，安静点。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            男孩子们全躲在书后发笑，他们都知道内德在做什么。内德很快又来了一遍。我正要跟着再嚎一声，这回没准真会被莫里斯太太赶出去，门却突然开了，贝茜·德鲁里走进来。她戴着帽子，肩上披着披肩，是刚从街对面父亲家里一路跑来的。
        - id: ch01-b24
          speaker: bessie_drury
          text: >-
            莫里斯太太，今晚能让劳拉去陪我吗？妈妈刚收到班戈来的电报，说她的姨妈科尔太太病得很重，想见她一面。爸爸要带妈妈搭今晚的火车过去。妈妈怕没有劳拉陪着，我会觉得孤单。
        - id: ch01-b25
          speaker: mrs_morris
          text: 你不能到我们家来过夜吗？
        - id: ch01-b26
          speaker: bessie_drury
          text: 不用了，谢谢您。我想妈妈更愿意让我留在自己家里。
        - id: ch01-b27
          speaker: mrs_morris
          text: 那好吧。我想劳拉会愿意过去的。
        - id: ch01-b28
          speaker: miss_laura
          text: 我当然愿意。半个钟头以后我就过去。
        - id: ch01-b29
          speaker: bessie_drury
          text: 太谢谢你了。
        - id: ch01-b30
          speaker: beautiful_joe
          text: 贝茜说完就匆匆离开了。莫里斯先生从报纸上抬起头来。
        - id: ch01-b31
          speaker: mr_morris
          text: 屋里除了这两个姑娘，还有别人吧？
        - id: ch01-b32
          speaker: mrs_morris
          text: >-
            当然有。德鲁里太太的老保姆已经在她家做了二十年，此外还有两个女佣。马车夫唐纳德也睡在马厩楼上。她们有人照应，很安全。
        - id: ch01-b33
          speaker: mr_morris
          text: 那就好。
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            莫里斯先生又看起报纸。我们这些不会说话的动物，当然听不懂人谈论的每一件事。可是，我们能从他们的神情和声音里明白很多东西，人类知道了准会吃惊。我已经看出来，德鲁里家的主人和太太都不在时，莫里斯先生不大放心劳拉过去。于是我拿定主意，一定要跟她一起去。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            劳拉挽着小提包下楼，我立刻站到她身旁。
        - id: ch01-b36
          speaker: miss_laura
          text: 亲爱的老乔，你不能跟来。
        - id: ch01-b37
          speaker: beautiful_joe
          text: 她吻过父母和男孩子们以后，我挨着她从门缝里挤了出去。
        - id: ch01-b38
          speaker: miss_laura
          text: 回去，乔。
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            她说得很严肃，我只能退回来，可我又哭又呜咽。她惊讶地看着我，声音又温柔下来。
        - id: ch01-b40
          speaker: miss_laura
          text: 明早我就回来了，乔。别这样尖声叫唤。
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            她关上门走了。我难受极了，在地板上来回走，又跑到窗边。这一次不用看内德，我自己便嚎叫起来。莫里斯太太越过眼镜上沿，吃惊地望着我。
        - id: ch01-b42
          speaker: mrs_morris
          text: 孩子们，你们以前见过乔这样闹吗？
        - id: ch01-b43
          speakers: [willie, jack, ned]
          ensemble: chorus
          text: 没有，妈妈。
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            莫里斯先生一直盯着我看。家里所有人和动物中，他向来最留意我，我也很喜欢他。我跑过去，把两只前爪搭在他膝上。
        - id: ch01-b45
          speaker: mr_morris
          text: 孩子他妈，让这条狗去吧。
        - id: ch01-b46
          speaker: mrs_morris
          text: >-
            好吧。杰克，你带他过去，把他刚才的样子告诉德鲁里太太。再替我说一声，要是她肯让他陪劳拉住一夜，我会非常感激。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            杰克抓起帽子，冲下台阶，奔过街道，穿过大门，又跑上碎石小路。严霜把石子冻得硬邦邦的。
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            德鲁里家住在一幢白色的大房子里，四周长满了树，房子后面还有花园。他们很富有，客人也多。整个夏天，我常看见马车停在门前，穿浅色衣裳的先生和太太们在草坪上散步。有时，我还能闻到屋里美食的香味。他们不养狗，也不养别的宠物，所以吉姆和我一直找不到借口上门拜访。
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            杰克按响前门的门铃，把我交给开门的女佣。她听完杰克给德鲁里太太带的话，便领我上楼，还不时回过头来笑着看我。
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            楼上的门厅里放着旅行箱，一位老保姆正往里装东西。德鲁里太太站在旁边看她收拾，一见到我，便轻声尖叫起来。
        - id: ch01-b51
          speaker: mrs_drury
          text: 哎呀，保姆！快看这条吓人的狗！他是从哪儿来的？苏珊，把他赶出去。
          emotion: surprised
        - id: ch01-b52
          speaker: beautiful_joe
          text: 我一动不动地站着。女佣把杰克的话转告给她，她听完立刻改了主意。
        - id: ch01-b53
          speaker: mrs_drury
          text: >-
            当然可以。他既然是莫里斯家的狗，准是个懂规矩的。请那个小男孩替我谢谢他的妈妈，多谢她肯让劳拉过来。我们很乐意留下这条狗。保姆，咱们得快些，马车五分钟后就到。
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            我轻轻走进前面的房间，在那里找到了亲爱的劳拉小姐。贝茜和她正在拼命往旅行袋里塞东西。她们一看见我，都跑出来问我是怎么来的。一个先生恰好匆匆上楼，说马车已经到了。楼上楼下顿时忙乱成一团，可短短几分钟以后，一切就结束了。马车已经驶远，整幢房子也安静下来。
        - id: ch01-b55
          speaker: bessie_drury
          text: >-
            保姆，您一定累了，还是去睡吧。苏珊，请把我和莫里斯小姐的夜宵送到餐厅来。劳拉，你想吃什么？
        - id: ch01-b56
          speaker: miss_laura
          text: 你准备吃什么？
        - id: ch01-b57
          speaker: bessie_drury
          text: 热巧克力和茶点饼干。
        - id: ch01-b58
          speaker: miss_laura
          text: 那我也吃一样的。
        - id: ch01-b59
          speaker: bessie_drury
          text: >-
            苏珊，再拿些蛋糕来，也给这条狗找点吃的。我想，晚餐剩下的火鸡肉，他一定喜欢。
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            要是我还有耳朵，听见这话准会立刻竖起来。我最爱吃禽肉，可在莫里斯家，除了偶尔得到一两根没人要的骨头，从来吃不到这个。
        - id: ch01-b61
          speaker: beautiful_joe
          text: >-
            那顿夜宵吃得真快活。两个姑娘坐在大餐桌边，一小口一小口地喝着热巧克力，一直说说笑笑。苏珊在地毯上铺开一张报纸，我就在上面享用一整只火鸡剩下的骨架。我吃得很小心，用爪子把骨头按好，绝不把它拖到报纸外面。贝茜看着我，笑得眼泪都流了出来。
        - id: ch01-b62
          speaker: bessie_drury
          text: >-
            这条狗真像位绅士。你看，他用爪子把骨头按在报纸上，再用牙把肉剔下来。乔，你可真有趣，连吃的夜宵也这么有趣！我听说过吐司上的鹌鹑，可从没听说过报纸上的火鸡。
          emotion: happy
        - id: ch01-b63
          speaker: beautiful_joe
          text: 门厅里的钟敲了十一下。
        - id: ch01-b64
          speaker: miss_laura
          text: 咱们是不是该睡觉了？
        - id: ch01-b65
          speaker: bessie_drury
          text: 是啊，我想是该睡了。这只动物要睡在哪儿呢？
        - id: ch01-b66
          speaker: miss_laura
          text: 我也不知道。他在家里睡马厩，有时也和吉姆睡在狗屋里。
        - id: ch01-b67
          speaker: bessie_drury
          text: 让苏珊在厨房炉子旁边给他铺个舒服的窝，怎么样？
        - id: ch01-b68
          speaker: beautiful_joe
          text: >-
            苏珊铺好了窝，我却不肯睡。她们把我独自关起来时，我不停地大声吠叫，她们只好让我跟着上楼。劳拉小姐差点生我的气，可我没有办法。我来这里就是为了保护她。只要能做到，我就决不离开她。
        - id: ch01-b69
          speaker: beautiful_joe
          text: >-
            贝茜的卧室布置得很漂亮，地板上铺着柔软的地毯，窗上挂着好看的帘子。屋里有两张单人床，两个姑娘把床拖得紧挨在一起，这样钻进被窝以后，她们还能继续说话。
        - id: ch01-b70
          speaker: beautiful_joe
          text: >-
            熄灯前，贝茜告诉劳拉，夜里听见有人走动也不必害怕。保姆睡在门厅对面的房间，大概会过来一两次，看看她们睡得是否安稳。
        - id: ch01-b71
          speaker: beautiful_joe
          text: >-
            两个姑娘躺在挨得很近的床上谈了很久，后来才渐渐睡着。劳拉快要入睡时，终于不再生我的气了。我躺在她床边的毛皮毯上，她从床沿垂下一只手，让我舔了舔。
        - id: ch01-b72
          speaker: beautiful_joe
          text: >-
            我已经很累了，身下的毛皮毯又软又舒服，所以很快便睡沉了。可只要有一点响动，我就会醒。劳拉在床上翻身时，我醒了一次。贝茜在梦里发笑，我又醒了一次。后来，屋外结霜的树枝发出古怪的喀嚓声，我立刻从睡梦中惊跳起来。
        - id: ch01-b73
          speaker: beautiful_joe
          text: >-
            门厅里有一座大钟，每次报时，都会把我吵醒。有一回，钟刚敲过不知道几点，我又猛地从酣睡中跳起来。刚才我梦见了从前的家，詹金斯正挥着鞭子在后面追我。我的四条腿还一个劲儿地发抖，仿佛刚刚一直在拼命逃跑，想躲开他的鞭子。
        - id: ch01-b74
          speaker: beautiful_joe
          text: >-
            我一跃而起，用力抖了抖身子，又绕着房间走了一圈。两个姑娘呼吸得很轻，我几乎听不见。我走到门口，朝门厅里望去，那里亮着一盏昏暗的灯。保姆房间的门敞开着。我悄悄走到门边，探头往里一看，她正沉沉地喘着气，还在梦里含糊地说着什么。
        - id: ch01-b75
          speaker: beautiful_joe
          text: >-
            我回到毛皮毯上，想再睡一觉，却怎么也睡不着。心里有一股说不出的不安，逼得我只能不停地走来走去。我再次来到门厅，站在楼梯顶端。既然躺不住，我就想到楼下的门厅里走一圈，然后再回来睡觉。
        - id: ch01-b76
          speaker: beautiful_joe
          text: >-
            德鲁里家的地毯全都像天鹅绒一样柔软。我的爪子踩在上面，不会像踩在莫里斯家的油布地面上那样嗒嗒作响。我像猫似的悄悄走下楼梯，又沿着楼下的门厅慢慢往前走。每经过一扇门，我都从门缝下嗅一嗅，一路也留心听着动静。楼下没有夜灯，四周漆黑。可要是这里藏着陌生人，我一定闻得出来。
        - id: ch01-b77
          speaker: beautiful_joe
          text: >-
            我走近门厅最远的一头，忽然看见餐厅门下闪过一丝微光。那光只亮了一瞬，马上又消失了。我很吃惊。餐厅是吃饭的地方，我们才吃过那么丰盛的夜宵，屋里的人当然不会在这时候进去。
        - id: ch01-b78
          speaker: beautiful_joe
          text: >-
            我走到门边，从门缝下嗅了嗅。那里有一股浓重的气味，像乞丐和穷苦人身上的味道。那气味像詹金斯。就是他。
