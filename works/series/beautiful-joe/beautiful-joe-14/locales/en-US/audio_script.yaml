  chapters:
    - id: ch01
      title: HOW WE CAUGHT THE BURGLAR
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            What was that wretch doing inside the house with my dear Miss Laura? The thought nearly drove me wild. I scratched the dining-room door, barked, and yelped. I threw myself against it, and though I was a heavy dog by then, I felt as light as a feather.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Every few seconds I stopped and pressed my head to the doorsill. Someone was rushing around inside. A chair crashed over, and then it sounded as if a man were climbing through the window. I forgot that I was only a medium-sized dog and that Jenkins could kill me if he caught me. All I wanted was to get hold of him.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            My noise woke everyone upstairs. There were screams and running feet. I raced along the hall and halfway up the stairs, then back again. I wanted Miss Laura to stay where she was, but I had no way to tell her. She leaned over the railing in her white gown, holding back her long hair. Her face was full of surprise and fear.
        - id: ch01-b04
          speaker: bessie
          text: The dog has gone mad! Nurse, throw a pitcher of water over him!
          emotion: fearful
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The nurse understood better. She ran downstairs with her nightcap flying and a blanket trailing behind her.
        - id: ch01-b06
          speaker: nurse
          text: There are thieves in the house! The dog has found them!
          emotion: fearful
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            She kept away from the dining-room and flung open the front door.
        - id: ch01-b08
          speaker: nurse
          text: Policeman! Help! Thieves! Murder!
          emotion: fearful
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            That old woman screamed even louder than I did. I dashed past her, tore down to the gate, and heard someone running ahead. I yelped several times to call Jim, then leaped the gate just as the man had done.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            Something savage rose in me that night. Perhaps it was Jenkins's smell. I wanted to tear him apart. I have never felt so wicked since. Now I was hunting the man who had hunted my mother and me, and I was glad of it.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Old Jim soon caught me. I nudged him to show how glad I was that he had come, and we raced on together. At the corner, we caught up with the miserable man who was fleeing from us.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            I growled, sprang up, and snapped at his leg. He turned. The night was dim, but there was enough light for me to see the ugly face of my old master.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            He was furious that Jim and I dared attack him. Swearing at us, he scooped up a handful of stones and threw them. Then a strange whistle sounded ahead, followed by another behind us. Jenkins made a queer noise in his throat and ran toward a side street, away from both whistles.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            I feared he would escape. I was not strong enough to hold him, so I kept jumping at him, and once I tripped him. That made him wild with rage. He kicked me into a wall, struck me several times with a stick he had grabbed, and kept pelting me with stones.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Blood ran over my eyes until I could barely see, but I would not stop. Whenever Jenkins hurt me, old Jim became so angry that he darted in from behind and nipped the man's calves. That forced Jenkins to turn and fight him instead.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Soon Jenkins reached a high wall. He glanced back and hurried to climb it. I could not jump that high. He was getting away. I barked with all my strength for someone to come, then sprang up and fastened my teeth around his leg as he went over.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            My grip was so tight that I went over the wall with him, leaving Jim behind. Jenkins landed face-first in the earth. He jumped up and came at me with deadly hatred in his eyes. I believe he would have smashed my head against the wall, just as he had smashed my poor little brothers against the horse's stall.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            Then I heard running feet. Two men hurried down the street and climbed onto the wall where Jim was leaping and barking in distress. Their uniforms and clubs told me at once that they were policemen. In a moment, they had Jenkins.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            He stopped fighting, but he snarled at me like an ugly dog.
        - id: ch01-b20
          speaker: jenkins
          text: >-
            If that cur hadn't been there, you'd never have caught me. Why, that's my own dog!
          emotion: angry
        - id: ch01-b21
          speaker: policeman_1
          text: >-
            Then you ought to be ashamed. What have you done tonight to make your own dog and a quiet minister's spaniel chase you through the streets?
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            Jenkins only swore and refused to answer. There was a house in the garden, and just then a gentleman opened one of its windows.
        - id: ch01-b23
          speaker: gentleman
          text: Hello down there! What are you doing?
          emotion: surprised
        - id: ch01-b24
          speaker: policeman_2
          text: >-
            We're catching a thief, sir, or at least that seems to be his business. Could you throw us a piece of rope? We have no handcuffs. One of us must take him to the lockup, and the other must go to Washington Street, where a woman is screaming bloody murder. Please hurry.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            The gentleman dropped a rope from the window. Within two minutes, the policemen had Jenkins's wrists tied together. They took him out through the gate, and one officer started toward the lockup with him. Jenkins kept up a stream of bad words against the man who was leading him.
        - id: ch01-b26
          speaker: policeman_2
          text: Good dogs.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Then the other policeman ran up the street, and Jim and I followed him.
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            As we hurried along Washington Street toward home, lights shone through the darkness and people ran back and forth. The nurse's shrieks had roused the whole neighborhood. All the Morris boys stood in the road, only half dressed and shivering in the cold. The Drurys' coachman ran about with a lantern. He had rushed out without a hat, and his hair stuck up in every direction.
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            Lights burned in all the neighboring houses. People leaned from their windows, opened their front doors, and called back and forth across the street, asking what all the noise could mean. A crowd gathered around the policeman as soon as he arrived with Jim and me behind him, eager to hear his part of the story.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            Jim and I dropped to the ground, panting hard, with water streaming from our tongues. We were worn out. Stones had opened several wounds along Jim's back, and my whole body was bruised.
        - id: ch01-b31
          speakers: [neighbor_1, neighbor_2, neighbor_3]
          ensemble: chorus
          text: Brave dogs! Noble dogs!
          emotion: happy
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            Once people noticed us, they made a tremendous fuss. Everyone praised us and reached down to pat us. We felt proud and happy, so we struggled to our feet and wagged our tails. Jim wagged his, anyway, and I moved what little tail I had. Then the neighbors saw how badly we were hurt. Mrs. Morris began to cry. She gathered me into her arms and hurried into the house, while Jack followed with old Jim.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            We went into the parlor, where a good fire was burning. Miss Laura and Bessie had been sitting beside it. They jumped up when we entered. Right there on the parlor floor, they washed our wounds and settled us near the warmth.
        - id: ch01-b34
          speaker: bessie
          text: >-
            Brave Joe, you saved our silver. Just wait until Papa and Mamma come home and hear about you. Jack, what's the latest news?
          emotion: happy
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            The Morris boys came crowding into the room, and Jack answered excitedly.
        - id: ch01-b36
          speaker: jack
          text: >-
            The policeman questioned your nurse and searched the dining room. He's gone to the station to report what he found. Do you know what he discovered?
          emotion: surprised
        - id: ch01-b37
          speaker: bessie
          text: No. What was it?
        - id: ch01-b38
          speaker: jack
          text: That villain meant to burn your house down.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Bessie gave a little shriek.
        - id: ch01-b40
          speaker: bessie
          text: What do you mean?
          emotion: fearful
        - id: ch01-b41
          speaker: jack
          text: >-
            From what they found, they think he planned to fill his bag with silver and carry it away. Before leaving, he would pour oil around the room and set it on fire, so no one would discover the robbery.
        - id: ch01-b42
          speaker: bessie
          text: >-
            We might all have burned to death! A fire in the dining room would spread through the rest of the house.
          emotion: fearful
        - id: ch01-b43
          speaker: jack
          text: Of course it would. That shows what a villain he is.
        - id: ch01-b44
          speaker: miss_laura
          text: Are they certain, Jack?
        - id: ch01-b45
          speaker: jack
          text: >-
            They believe so. They found bottles of oil beside the bag he meant to use for the silver.
        - id: ch01-b46
          speaker: bessie
          text: >-
            How horrible! Dear old Joe, perhaps you saved our lives too.
          emotion: happy
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            Pretty Bessie kissed my swollen, ugly head. I could only lick her little hand, but from that night on, I thought a great deal of her.
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            Several years have passed since that night, so I may as well tell you how it all ended. The Drurys came home the next day, and little by little the whole truth about Jenkins came out. On the night they left Fairport, he had been hanging around the railway station and saw them go. He once delivered milk to their house, so he knew the family well. He knew the place too, and he knew exactly who had been left behind.
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            By then, Jenkins had no customers left. After Mr. Harry rescued me and the newspaper printed what Jenkins had done, people refused to buy his milk. Then his wife died. Some kind people placed his children in an asylum, and he was forced to sell Toby and all the cows. Yet none of that taught him to change his ways or lead a better life. He only sank lower.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            By then, he was ready for any wicked chance that came along. When he saw the Drurys leaving on the train, he formed his plan. He would take a bag of silver from the sideboard, set the house on fire, and run away with the silver hidden. After enough time had passed, he meant to carry it to another city and sell it.
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            Jenkins was made to confess the whole plan. For his wickedness, he was sentenced to ten years in prison. I hope he learned to be a better man while he was there, and that he stayed a better man after he came out.
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            I stayed sore and stiff for a long while. One day, Mrs. Drury came to see me. She did not love dogs as the Morrises did. She tried, but she simply could not.
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            Dogs can see the funny side of things just as people can. I pushed my muzzle into the hearth rug so she would not notice my lip curling into a smile.
        - id: ch01-b54
          speaker: mrs_drury
          text: You are a good dog. You are...
        - id: ch01-b55
          speaker: beautiful_joe
          text: >-
            She stopped because she could think of nothing more to say. I rose and stood before her. A well-bred dog should not lie down while a lady is speaking to him. I moved my body in a little wag and wished I could help her, but I could not. A pat might have made things easier, yet she did not want to touch me, and I knew she did not want me touching her. So I only looked at her.
        - id: ch01-b56
          speaker: mrs_drury
          text: >-
            Mrs. Morris, I don't like animals, and I can't pretend I do because they always know. But can you make that dog understand how deeply grateful I am? He saved our property, though that matters little. More than that, he saved my darling daughter from terror, perhaps from injury or even death.
        - id: ch01-b57
          speaker: mrs_morris
          text: I think he understands. He is a very wise dog.
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            Mrs. Morris smiled with great amusement, called me over, and placed my paws on her lap.
        - id: ch01-b59
          speaker: mrs_morris
          text: >-
            Look at that lady, Joe. She is pleased because you drove Jenkins away from her house. You remember Jenkins, don't you?
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            I barked angrily and limped toward the window.
        - id: ch01-b61
          speaker: mrs_drury
          text: >-
            How intelligent he is. My husband has ordered a watchdog from New York, and he says our house will never be without one again. I must go now. Your dog is happy, Mrs. Morris, so there is nothing I can do for him except promise never to forget him. I hope he will visit us sometimes, perhaps after our dog arrives. I will tell the cook to give him something to eat whenever she sees him.
        - id: ch01-b62
          speaker: mrs_drury
          text: >-
            This is a keepsake for Laura from that dreadful night. I owe you so much that I am sure you will let her accept it.
        - id: ch01-b63
          speaker: beautiful_joe
          text: >-
            She handed Mrs. Morris a small box and left. When Miss Laura came in, she opened it and found a handsome diamond ring. An inscription had been engraved inside. It named Laura, asked her to remember that December twentieth, and said the ring came from her grateful friend Bessie.
        - id: ch01-b64
          speaker: beautiful_joe
          text: >-
            The diamond was worth hundreds of dollars. Mrs. Morris told Miss Laura she would rather not have her wear it while she was still a young girl. A ring like that was not suitable for her then, and she felt sure Mrs. Drury had never expected Laura to put it on at once. Mrs. Drury had wanted to give her something truly valuable, and the diamond would keep its worth for years to come.
