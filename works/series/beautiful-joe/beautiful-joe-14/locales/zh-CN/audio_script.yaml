    policeman_2:
      display_name: 警察乙
      tts:
        delivery: 直截了当，语气爽快
        timbre: 清楚有力
        pace: 稍快
        pitch: 中
    householder:
      display_name: 楼上住户
      tts:
        delivery: 睡意未消，带着警觉和疑问
        timbre: 成熟清晰
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 第十四章　我们怎样捉住了窃贼
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            那个恶棍进了屋，我亲爱的劳拉小姐也在里面。他到底要干什么？我急得快疯了，不停地抓门，又吠又叫，一次次扑到门上。那时的我已经颇有分量，可那一刻，浑身却轻得像一根羽毛。我只觉得，再打不开这扇门，自己真会发疯。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            我隔几秒便伏到门槛边听一听。屋里脚步乱响，一把椅子倒了，接着像是有人正从窗户往外爬。我更狂躁了，根本顾不上自己只有中等个头，也没想詹金斯抓住我就可能要我的命。那一刻，我只想逮住他。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            我闹出这么大动静，楼上也传来尖叫和来回奔跑声。我在门厅里跑上跑下，冲到楼梯半腰又折回来。我不愿劳拉小姐下楼，却没法告诉她。她已经出现了，穿着白色睡袍，俯身靠在栏杆边，一手拢着长发，脸上又惊讶又害怕。
        - id: ch01-b04
          speaker: bessie_drury
          text: 这条狗疯了！保姆，快拿一罐水泼他！
          emotion: fearful
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            保姆比她明白。她飞奔下楼，睡帽在头上飘，床上抓来的毯子一路拖在身后。
        - id: ch01-b06
          speaker: nurse
          text: 屋里有贼！是狗发现了！
          emotion: fearful
        - id: ch01-b07
          speaker: beautiful_joe
          text: 她没敢靠近餐厅，只拉开前门，朝街上放声大喊。
        - id: ch01-b08
          speaker: nurse
          text: 警察！警察！快来救命！有贼！杀人啦！
          emotion: fearful
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            她喊得比我还厉害。我冲出门厅，直奔大门口，听见前面有人逃跑。我高声叫了几下，把吉姆唤来，也跟那人一样跃过大门。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            那晚，一股凶猛的野性从我心里冒出来。也许是詹金斯的气味唤醒了它。我恨不得把他撕碎，从此再没这样凶狠过。当初，他追猎我和母亲。如今，是我在追猎他。想到这里，我竟觉得痛快。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            老吉姆很快赶上来。我用鼻子推推他，让他知道我有多高兴。我们一同飞奔，在街角追上了那个正在逃命的恶棍。我愤怒地低吼一声，跳起来咬他的腿。他猛一回头。夜色虽然不亮，光线却足够让我看清旧主人那张丑脸。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            我们竟敢扑咬他，詹金斯气坏了。他抓起石头，一边咒骂，一边砸我们。忽然，前方远处响起一声怪哨，身后也传来一声。詹金斯喉咙里怪响了一下，拐进岔路，躲开哨声来的方向。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            我怕他逃掉。虽然制不住他，还是一次次往他身上扑，还把他绊倒了一回。他气得发了狂，一脚把我踢到墙边，又捡起一根棍子，狠狠打了我两三下，还不停扔石头。血流过双眼，我几乎看不见他了，却始终不肯放弃。詹金斯每碰我一下，老吉姆就气得从后面咬他的小腿，逼他回头对付自己。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            詹金斯逃到一堵高墙前，回头看了一眼，立刻往上爬。墙太高，我跳不过去。他就要逃了，我该怎么办？我拼命吠叫求援，在他翻墙时纵身扑起，一口咬住他的腿。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            我咬得太紧，竟跟着他翻过墙，把吉姆留在另一边。詹金斯脸朝下摔进泥里，爬起来便满脸杀意地扑向我。要是没人赶到，他准会像当年把我那些可怜的小弟弟摔死在马厩隔板上一样，把我的脑袋撞在墙上砸碎。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            就在这时，街上传来一阵奔跑声。两个男人沿街赶来，正从吉姆焦急蹦跳、狂吠不止的地方翻上墙头。我看见他们的制服和手里的警棍，立刻知道警察来了。只一眨眼，他们便抓住了詹金斯。他不再反抗，却仍像恶狗一样冲我咆哮。
        - id: ch01-b17
          speaker: jenkins
          text: 要不是那条杂种狗，我才不会被抓！嘿……那是我自己的狗！
          emotion: angry
        - id: ch01-b18
          speaker: beautiful_joe
          text: 他说着踉跄后退，又骂了一句脏话。一名警察严厉地盯住他。
        - id: ch01-b19
          speaker: policeman_1
          text: >-
            那你更该害臊。大半夜的，你究竟干了什么，竟惹得自己的狗，还有牧师家那只安分的西班牙猎犬，一起满街追你？
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            詹金斯只顾咒骂，什么也不肯说。花园里有一幢房子，楼上忽然有人推开窗户。
        - id: ch01-b21
          speaker: householder
          text: 喂！下面的人在干什么？
        - id: ch01-b22
          speaker: policeman_2
          text: >-
            我们在抓贼，先生，至少我看他干的就是这门勾当。能扔一截绳子下来吗？我们没带手铐，一个得去拘留所，另一个得赶到华盛顿街。那边有个女人喊得像出了人命。劳驾快一点！
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            那位先生扔下绳子。不到两分钟，詹金斯的两只手腕便被捆在一起。一个警察押着他穿过大门，他还一路不停地朝人家咒骂。另一名警察夸了我和吉姆一句，便沿街朝华盛顿街跑去，我们也紧紧跟在他身后。
        - id: ch01-b24
          speaker: policeman_1
          text: 好狗！
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            我们匆匆沿着华盛顿街往回赶。快到德鲁里家时，黑暗里到处闪着灯光，人们跑来跑去。保姆的尖叫惊动了整个街坊。莫里斯家的男孩子们衣服只穿了一半，站在街上冷得直发抖。德鲁里家的马车夫没戴帽子，头发根根乱翘，正提着灯笼到处奔走。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            邻居家全亮了灯。有人从窗户探出身子，有人打开房门，都在彼此询问出了什么事。警察出现时，我和吉姆紧跟在他脚边，人群马上围住他，要听事情的经过。我们瘫在地上拼命喘气，舌头淌下一缕缕口水，两个都筋疲力尽。吉姆背上被石头砸破了好几处，我更是浑身青肿。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            过了一会儿，大家才发现我们，立刻围过来忙乱起来。他们一边抚摸，一边夸奖，都说我们是勇敢又了不起的狗。我们又骄傲又高兴，站起身摇起尾巴。吉姆摇得很欢，我也尽力摇了摇自己剩下的那一点。可他们很快看清了我们的伤。莫里斯太太哭了，一把抱起我跑进屋，杰克也带着老吉姆跟了进来。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            我们全都进了客厅，那里的炉火烧得正旺。劳拉小姐和贝茜小姐正坐在火边，一见我们就从座位上跳起来。她们就在客厅里替我们清洗伤口，又让我们卧在温暖的炉火旁。
        - id: ch01-b29
          speaker: bessie_drury
          text: >-
            勇敢的乔，你保住了我们家的银器。等爸爸妈妈回来，看他们会怎么说！杰克，现在又有什么消息？
        - id: ch01-b30
          speaker: beautiful_joe
          text: 莫里斯家的男孩子们正好一个接一个涌进屋里。杰克兴冲冲地开了口。
        - id: ch01-b31
          speaker: jack
          text: >-
            警察问过你家的保姆，也检查了餐厅，现在已经去警署作报告了。你知道他发现了什么吗？
        - id: ch01-b32
          speaker: bessie_drury
          text: 不知道。发现了什么？
        - id: ch01-b33
          speaker: jack
          text: 那个恶棍原来打算烧掉你们的房子。
        - id: ch01-b34
          speaker: beautiful_joe
          text: 贝茜吓得轻轻叫了一声。
        - id: ch01-b35
          speaker: bessie_drury
          text: 什么？你这话是什么意思？
          emotion: surprised
        - id: ch01-b36
          speaker: jack
          text: >-
            照他们找到的东西看，那家伙想把银器装进口袋带走。临走前，他还要在餐厅四周浇油放火。这样，人们就不会发现他进来偷过东西。
        - id: ch01-b37
          speaker: bessie_drury
          text: >-
            那我们说不定全会被烧死！餐厅着了火，整幢房子怎么保得住？
          emotion: fearful
        - id: ch01-b38
          speaker: jack
          text: 当然保不住。这才显得他有多恶毒。
        - id: ch01-b39
          speaker: miss_laura
          text: 杰克，他们能肯定吗？
        - id: ch01-b40
          speaker: jack
          text: >-
            他们是这么推断的。那个准备用来装银器的袋子旁边，还放着几瓶油。
        - id: ch01-b41
          speaker: bessie_drury
          text: 太可怕了！亲爱的老乔，也许你救了我们的命。
          emotion: fearful
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            漂亮的贝茜俯下身，吻了吻我那颗又难看又肿胀的脑袋。我什么也做不了，只能舔舔她小巧的手。从那以后，我一直很喜欢她。
        - id: ch01-b43
          speaker: beautiful_joe
          text: >-
            这件事已经过去好几年，我不妨把结局也说完。第二天，德鲁里夫妇回来了，詹金斯的事也全都查清了。他们离开费尔波特的那天晚上，他一直在车站附近徘徊。他从前给德鲁里家送过牛奶，对这家人的情形十分熟悉，所以确切知道主人走后，屋里还留下了谁。
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            那时，他早已没有顾客。哈里先生救下我以后，报纸登出了他的恶行，再也没人肯买他的牛奶。他的妻子死了，几位好心人把他的孩子送进孤儿院，他也只好卖掉托比和那些奶牛。这一切没有给他一点教训，也没让他好好做人，他反而越陷越深。
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            到了这一步，无论碰上什么坏事，他都随时准备去做。所以，他一看见德鲁里夫妇坐火车离开，便动了坏念头。他打算从餐具柜里偷一袋银器，再放火烧掉房子，然后逃走，把银器藏起来。过些日子，他就会把赃物拿到某座城市卖掉。
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            人们最后逼他供出了这一切。因为这些恶行，他被送进监狱，判了整整十年。我希望他能在牢里变成一个好人，出狱以后也一直好好做人。
        - id: ch01-b47
          speaker: beautiful_joe
          text: >-
            我浑身酸痛，僵硬了很长一段日子。一天，德鲁里太太特意过来看我。她不像莫里斯一家那样喜欢狗。她努力想喜欢我们，却实在做不到。狗和人一样，也看得出事情里的可笑之处。我把口鼻埋进炉前地毯，不让她看见我正翘着嘴唇，偷偷冲她发笑。
        - id: ch01-b48
          speaker: mrs_drury
          text: 你是一条好狗。你真是……
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            她说到一半停住了，实在想不出还能对我讲什么。我便起身站到她面前。女士同一条有教养的狗说话时，狗可不该躺着。我轻轻摇摇身子，很想说点什么，帮她摆脱这场为难，可惜我不会说话。她若肯摸摸我，也许事情就容易些。可是她不愿碰我，我也知道她不想让我碰她，只好一动不动地站着望她。
        - id: ch01-b50
          speaker: mrs_drury
          text: >-
            莫里斯太太，我不喜欢动物，也装不出喜欢，因为它们总能看穿我。可是，您能让这条狗明白吗？我会永远感激他。他救下的不只是财物，那根本算不了什么。他还救了我最心爱的女儿，让她免受惊吓和烦扰，也免于受伤，甚至丧命。
        - id: ch01-b51
          speaker: mrs_morris
          text: 我想他明白。他是一条很聪明的狗。
        - id: ch01-b52
          speaker: beautiful_joe
          text: 莫里斯太太觉得十分有趣。她笑着把我叫过去，让我把前爪搭在她膝上。
        - id: ch01-b53
          speaker: mrs_morris
          text: >-
            乔，看看那位太太。你把詹金斯赶出了她家，她很喜欢你。还记得詹金斯吗？
        - id: ch01-b54
          speaker: beautiful_joe
          text: 我愤怒地吠了一声，一瘸一拐地走到窗边。
        - id: ch01-b55
          speaker: mrs_drury
          text: >-
            他真聪明。我丈夫已经派人去纽约买一条看门狗。他说，从今以后，家里再也不能没有狗。好了，我得走了。莫里斯太太，您的狗过得很幸福，我没什么能替他做。我只能告诉您，自己永远不会忘记他，也希望他偶尔来看看我们。等家里有了自己的狗，也许他就会来的。我会嘱咐厨娘，不管什么时候见到他，都拿些东西给他吃。
        - id: ch01-b56
          speaker: mrs_drury
          text: >-
            这个纪念品是送给劳拉的，让她记住那个可怕的夜晚。我欠您太多了，相信您会准许她收下。
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            她把一个小盒子交给莫里斯太太，便走了。劳拉小姐回来后打开盒子，里面是一枚漂亮的钻石戒指。戒指内侧刻着这样一句话：“赠劳拉，纪念十二月二十日，一八——年。感激你的朋友贝茜。”
        - id: ch01-b58
          speaker: beautiful_joe
          text: >-
            那颗钻石价值几百美元。莫里斯太太告诉劳拉，她现在还是个年轻姑娘，自己宁愿她先不要戴。这枚戒指不适合她这个年纪，德鲁里太太想必也没指望她立刻戴上。她只是想送劳拉一件贵重的礼物，而这枚戒指无论过多少年，都会很值钱。
