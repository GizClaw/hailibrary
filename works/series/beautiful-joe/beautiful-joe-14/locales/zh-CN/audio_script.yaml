audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_morris:
      display_name: 莫里斯太太
      tts:
        delivery: 慈爱持重，管教孩子时干脆明白
        timbre: 温和饱满
        pace: 适中
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 爽快利落，充满少年人的朝气
        timbre: 清亮结实
        pace: 稍快
        pitch: 中
    bessie_drury:
      display_name: 贝茜·德鲁里
      tts:
        delivery: 热情活泼，语气亲切自然
        timbre: 清甜明亮
        pace: 轻快
        pitch: 中高
    mrs_drury:
      display_name: 德鲁里太太
      tts:
        delivery: 忙碌讲究，惊讶过后仍不失礼貌
        timbre: 圆润清楚
        pace: 稍快
        pitch: 中高
    nurse:
      display_name: 保姆
      tts:
