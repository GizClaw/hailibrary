audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    maxwell:
      display_name: 马克斯韦尔先生
      tts:
        delivery: 温和风趣，叙事时从容可信
        timbre: 温润清朗
        pace: 适中
        pitch: 中
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十二章　茶桌上发生的事
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我伏在劳拉小姐的椅子底下，看得很清楚。哈里先生讲话时，马克斯韦尔先生嘴上像是在取笑他，眼睛里却一直带着钦佩。
        - id: ch01-b02
          speaker: maxwell
          text: >-
            你说得对，格雷，完全对。公路平平坦坦的，再多一些学校、教堂、图书馆，还有年轻人的聚会，乡下就会变成乐园。这样一来，城里的贫民窟也会空下来。穷人留在肮脏的小巷和公寓楼里，不只因为没钱，还因为乡下的生活太慢、太闷。他们辛苦一天以后，也想热闹热闹，找点乐子。要是乡下更有意思，我相信他们会愿意来。
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            这又牵出另一个问题了。劳工和资本的事，我一想起来，心里就安静不下来。马克斯韦尔，我在纽约进过一家医院，见到不少从前做日工的人。有些又老又弱，有些明明还年轻，身体却已经垮了。他们的手脚都萎缩蜷曲了。
        - id: ch01-b04
          speaker: mr_harry
          text: >-
            他们挖过土，在高楼上干过活，也在阴暗的地下室里关过许多年，替别人做尽了苦工。他们把一辈子和全身的力气都交出去，最后却穷困潦倒，没人照管，只能等死。我看着他们，简直像看见古时候受难的殉道者。
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            他们受尽压榨，勉强混一口饭吃，许多人还同家里分开，日子实在太苦。他们从没机会摆脱自己的命运，只能干到倒下。这里面一定出了问题。那些替我们卖命的人，我们为他们做得太少了。
        - id: ch01-b06
          speaker: mr_harry
          text: >-
            我们该好好照料他们，不能像圈牲口一样把他们挤在一处。我们发了财，也应该带着他们一起往前走，把赚到的钱分给他们一份。没有他们，我们也会和他们一样穷。
        - id: ch01-b07
          speaker: mr_wood
          text: >-
            说得好，哈里！这一点我赞成。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            声音从哈里先生身后传来。大家回头一看，伍德先生站在门口，正骄傲地望着自己的继子。哈里先生笑着站了起来。
        - id: ch01-b09
          speaker: mr_harry
          text: >-
            您要不要坐我的椅子？
        - id: ch01-b10
          speaker: mr_wood
          text: >-
            不用了，谢谢。你母亲叫我们去用茶点。今天有松饼，那东西放久了可不会更好吃。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            大家往餐厅走去，我也跟在后面。路上，伍德先生又对哈里先生开了口。
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            哈里，听你刚才说了那些话，我倒想起一件事。又有一个人要搬去波士顿了。
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            谁呀？
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            懒汉丹·威尔逊。我今天下午去看过他。他妻子病着，一家人都快饿死了。他说自己讨厌劈柴，也不愿干活，想到城里找个轻省的差事。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            哈里先生听了，脸色沉了下来。
        - id: ch01-b16
          speaker: maxwell
          text: >-
            他会饿死的。一定会落到这个下场。
        - id: ch01-b17
          speaker: mr_wood
          text: >-
            正是这样。如今的人真有本事，凡是要动手做的活，他们总能绕开。我也不明白这是为什么。他们肯把脑子用到脊梁骨都软得像毛毛虫，却觉得体力活早已过时了。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            伍德先生在桌边坐下，摊开自己那双粗硬、黝黑的手。
        - id: ch01-b19
          speaker: mr_wood
          text: >-
            要是从前那些清教徒也坐在石头上，把鼻子埋进书堆里，只盘算怎样少干活还能活下去，我真不知道这些农场怎么能从荒林里开出来。
        - id: ch01-b20
          speaker: mrs_wood
          text: >-
            好了，父亲。你分明是在暗示这一代人懒惰，我可不信。你看看哈里，他干起活来一点也不比你差。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            伍德先生好脾气地笑了。
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            这话多像女人说的！她嘴里的这一代，就是她儿子。过去那一代呢，就是她丈夫。哈蒂，我可没说年轻人个个都懒。可要是上帝不从天上给我们下几场农夫雨，谁来养活那么多年轻律师和医生？
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            人们说，这世道越来越安稳，人的身体也越来越好。那么，我们只好再多打几仗，多养出一些罪犯，早饭也重新吃馅饼和炸面圈。不然，从大学里冒出来的那些嫩苗儿，有些就得去讨饭啦。
        - id: ch01-b24
          speaker: maxwell
          text: >-
            伍德先生，您不会是觉得良好的教育没什么用吧？
        - id: ch01-b25
          speaker: mr_wood
          text: >-
            不，不。你看哈里，我不是一直打心眼里赞成他用功读书吗？可他以后只想当个普普通通的农夫。有了受过训练的头脑，他会比我干得更好。
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            他小时候还在村里上学，我就看出来了。他用几何安排自己的小花园，用代数来挖排水沟。教育对谁都有帮助。我真正想说的是，比起祖先来，我们越来越肯动脑子，却越来越不肯下苦力了。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            伍德先生边说边拿食指敲桌子，大家都笑了起来。
        - id: ch01-b28
          speaker: mrs_wood
          text: >-
            约翰，等你的演说彻底讲完，也许可以给大家分一分浆果，再把奶油和糖递过来。马克斯韦尔先生，你们村里的奶油也有这么黄吗？
        - id: ch01-b29
          speaker: maxwell
          text: >-
            没有，伍德太太。我们的奶油颜色淡得多。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            接着，桌上的瓷器叮叮当当地碰着，盘子来回传递，大家又说又笑。谁也没有发现，我没待在门厅里平常的位置。我一直害怕那个绿东西，所以钻到了桌子底下。它要是爬出来吓唬劳拉小姐，我就能马上扑过去捉住它。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            茶点吃到一半，劳拉小姐忽然轻叫了一声。我一下蹿到她膝上，看见那个模样凶恶的绿东西正沿着桌面朝她滑过去。我踏上桌子，没等它靠近劳拉小姐，就一口咬住它的腰身。
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            我的两条后腿掉进一碟果冻，两条前腿又踩进一盘蛋糕，别提多难受了。绿东西的尾巴垂在牛奶罐里，舌头还冲我一伸一缩。我牢牢咬住它，站在那里一动也不动。
        - id: ch01-b33
          speaker: miss_laura
          text: >-
            放下它！快放下！
          emotion: fearful
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生在我背上打了一下，我只好松口，难为情地站着四下张望。伍德先生仰靠在椅背上，笑得停不下来。伍德太太望着乱糟糟的桌子，脸拉得有些长。劳拉小姐叫我跳到地板上，又帮姑母把弄脏的东西撤走。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            我觉得自己闯了祸，灰溜溜地躲进门厅。马克斯韦尔先生坐在长沙发上，把手帕撕成细条，缠在小东西被我咬破的地方。我知道它是他的宠物，已经很小心，没让它伤得太重。可马克斯韦尔先生不知道，只是皱着眉责怪我。
        - id: ch01-b36
          speaker: maxwell
          text: >-
            你这个坏家伙！你把我可怜的蛇伤得太重了。
          emotion: angry
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            听到这句话，我难过得走到墙角，把脑袋对着墙。我几乎宁肯挨打，也不愿挨骂。过了一会儿，马克斯韦尔先生回到餐厅，大家继续用茶点。我听见伍德先生洪亮又快活的声音。
        - id: ch01-b38
          speaker: mr_wood
          text: >-
            这狗做得对。蛇大多有毒，它凭本能要保护自己的女主人。它在哪儿？乔！乔！
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            我还是不肯动，直到劳拉小姐走来同我说话。
        - id: ch01-b40
          speaker: miss_laura
          text: >-
            亲爱的老伙计，你一直知道那条蛇藏在那里，对不对？
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            她的话让我心里好受多了。我跟着她回到餐厅。伍德先生叫我坐在他身旁，整顿饭都从手里拿些零碎食物喂我。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生已经消了气，又活泼地聊起来。
        - id: ch01-b43
          speaker: maxwell
          text: >-
            好乔，我刚才不该冲你发火，请你原谅。我的宠物一受伤，我总会恼火。你不知道，我那可怜的蛇只是想找点吃的。伍德太太把它别在我的口袋里，这回它不会再爬出来了。伍德太太，您知道我从哪儿得到它的吗？
        - id: ch01-b44
          speaker: mrs_wood
          text: >-
            不知道。你从来没说过。
        - id: ch01-b45
          speaker: maxwell
          text: >-
            是在河对岸的蓝岭附近。去年夏天，有一天我划船出去，天气热得很，我就把船拴在一棵大树的阴影下。村里的几个男孩正在树林里，我听见他们那边吵得厉害，便过去看看。
        - id: ch01-b46
          speaker: maxwell
          text: >-
            那些孩子都是仁慈会的。他们碰见一个乡下男孩正要把一条蛇活活打死，就劝他不要这么残忍。他们还告诉他，有些蛇能吃掉大批田鼠和其他害兽，是农夫的帮手。
        - id: ch01-b47
          speaker: maxwell
          text: >-
            可那个男孩很固执。他说蛇是自己发现的，自己就有权杀死它。我赶到时，他们正吵得不可开交。我好说歹说，终于让他们把蛇交给了我。它看起来已经死了。我想它也许还能活过来，就把它放在船头的一片草上。
        - id: ch01-b48
          speaker: maxwell
          text: >-
            它很久都一动不动。后来我拿起船桨，开始往家划。船到了河中央，我回头一看，蛇竟然不见了。原来它刚掉进水里，正往我们离开的那一岸游。我马上掉转船头，跟了过去。
        - id: ch01-b49
          speaker: maxwell
          text: >-
            它游得很慢，显然疼得厉害。每隔几秒，它就把头高高探出水面，看看该往哪里游。到了岸边，它盘起身子，嘴里吐出血和水。我小心地捧起它，带回家照料。它很快就好了，从那以后一直跟着我。
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            茶点结束以后，伍德太太和劳拉小姐帮阿黛尔收拾完，大家一起去了客厅。白天还很暖和，这时却刮起凉风。伍德先生说，风把雨送来了。
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            伍德太太觉得生炉火会很舒服，于是他们点着敞口壁炉里的木柴，全都围着明亮的火焰坐下。
        - id: ch01-b52
          speaker: beautiful_joe
          text: >-
            马克斯韦尔先生把小蛇捧在手里，让它靠近火光取暖，还想让我跟它做朋友。现在我知道它不会伤人，已经不怕了。可它不喜欢我。只要我看它，它就会伸出那条滑稽的小舌头。
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            过了一会儿，雨点开始敲打窗户。
        - id: ch01-b54
          speaker: maxwell
          text: >-
            这样的夜晚，正适合听故事。伍德先生，给我们讲一件您亲身经历过的事，好吗？
        - id: ch01-b55
          speaker: mr_wood
          text: >-
            讲什么好呢？
        - id: ch01-b56
          speaker: beautiful_joe
          text: >-
            伍德先生和气地问着。他坐在妻子和哈里先生中间，一只手还搭在哈里先生的膝盖上。
        - id: ch01-b57
          speaker: maxwell
          text: >-
            就讲动物吧。我们今天好像一直都在谈动物。
        - id: ch01-b58
          speaker: mr_wood
          text: >-
            好吧。有件事在我心里放了很久，我就说说它。如今，人们常常谈起该善待家养的动物，却很少听人说，也该善待野生动物。它们都出自同一位造物主，为什么该保护这一种，却不保护另一种呢？我没有权利折磨一头牛，也同样没有权利折磨一头熊。
        - id: ch01-b59
          speaker: mr_wood
          text: >-
            我们这一带的野生动物差不多已经被杀光了，不过别处还有很多。我小时候很爱打猎，近些年却越来越厌恶杀戮。只要野兽没有跑到街上来，我就不会对它们动手。要不要听听我年轻时打猎的那些事？
        - id: ch01-b60
          speakers: [mrs_wood, mr_harry, miss_laura, maxwell]
          ensemble: chorus
          text: >-
            要！要！
