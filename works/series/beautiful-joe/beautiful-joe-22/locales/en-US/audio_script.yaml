  chapters:
    - id: ch01
      title: WHAT HAPPENED AT THE TEA TABLE
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            I lay under Miss Laura's chair while Mr. Harry talked. Mr. Maxwell sounded as though he were making fun of him now and then, but I saw the admiring looks he kept giving him.
        - id: ch01-b02
          speaker: mr_maxwell
          text: >-
            You're right, Gray. Give the country smooth roads, plenty of schools, churches and libraries, and gatherings for young people, and you could make country life a paradise. You might empty the city slums, too. Poverty isn't the only thing that keeps poor people in dirty lanes and crowded tenement houses. Country life can be slow and dull. Those poor souls want activity and amusement when their day's work is over, just like anyone else. Make the country more pleasant, and I believe they'd come.
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            That brings me to another question, Maxwell, one I can't stop thinking about. It's the question of labor and capital. In New York, I visited a hospital and saw men who had worked as day laborers. Some were old and weak. Others were young, yet already broken down, with their limbs wasted and drawn. They had dug in the ground, worked high on buildings, spent their days in gloomy basements, and done every kind of hard labor for other men.
        - id: ch01-b04
          speaker: mr_harry
          text: >-
            They had spent their lives and strength serving others, only to die poor and deserted. Looking at them, I thought of the martyrs of old. Many had lived from one day's wages to the next, ground down and separated from their families. Their lot had been bitter. They never had a chance to escape their fate. They simply worked until they dropped. Something is wrong with that. We don't do enough for the people who toil for us. We should care for them better instead of crowding them together like cattle. When their work makes us rich, we ought to bring them forward with us and share our gains. Without them, we'd be as poor as they are.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            A voice came from behind Mr. Harry. We turned and saw Mr. Wood in the doorway, looking proudly at his stepson.
        - id: ch01-b06
          speaker: mr_wood
          text: Good for you, Harry. I'm with you on that.
        - id: ch01-b07
          speaker: beautiful_joe
          text: Mr. Harry smiled and stood up.
        - id: ch01-b08
          speaker: mr_harry
          text: Would you like my chair, sir?
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            No, thank you. Your mother wants us to come to tea. There are muffins, and you know they won't get any better while they wait.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            They all went into the dining room, and I followed. On the way, Mr. Wood said he had news that fit neatly with Harry's talk.
        - id: ch01-b11
          speaker: mr_wood
          text: Another person is planning to move to Boston.
        - id: ch01-b12
          speaker: mr_harry
          text: Who is it?
        - id: ch01-b13
          speaker: mr_wood
          text: >-
            Lazy Dan Wilson. I went to see him this afternoon. His wife is sick, as you know, and the two of them are half starved. He hates chopping wood and working, so he says he'll go to the city and perhaps find an easy job there.
        - id: ch01-b14
          speaker: beautiful_joe
          text: Mr. Harry's face grew serious.
        - id: ch01-b15
          speaker: mr_maxwell
          text: He'll starve there. That's what will happen.
        - id: ch01-b16
          speaker: beautiful_joe
          text: Mr. Wood sat at the table and spread out his hard, brown hands.
        - id: ch01-b17
          speaker: mr_wood
          text: >-
            Exactly. I don't know why, but people these days have a wonderful talent for dodging any work done with their hands. They'll work their brains until their backbones are no stronger than a caterpillar's, but manual labor is old-fashioned now. Imagine if the old Puritans had sat on the rocks with their noses in books, trying to calculate how little work they could do and still live. How would these farms ever have been cut out of the backwoods?
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            Now, Father, you're suggesting that people today are lazy, and I'm sure they aren't. Just look at Harry. He works as hard as you do.
        - id: ch01-b19
          speaker: beautiful_joe
          text: Mr. Wood laughed good-naturedly.
        - id: ch01-b20
          speaker: mr_wood
          text: >-
            Isn't that just like a woman? To her, the present generation means her son, and the past generation means her husband. I don't think every young person is lazy, Hattie. But unless the Lord rains down a few farmers, how will we support all these young lawyers and doctors? People say the world is growing healthier and better. Well, we'll have to do more fighting, raise more criminals, and start eating pies and doughnuts for breakfast again, or some of our young college sprouts will have to beg.
        - id: ch01-b21
          speaker: mr_maxwell
          text: You don't mean that a good education has no value, do you, Mr. Wood?
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            No, no. Look at Harry. I'm glad he's working hard at his studies, though he plans to be nothing grander than a plain farmer. His trained mind will make him a better farmer than I've been. I learned that when he was a boy at the village school. He'd use geometry to plan his little garden and algebra to dig his ditches. Education helps any man. My point is only that we're turning more toward brainwork and less toward hard physical work than our forefathers did.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            Mr. Wood tapped the table with one finger as he spoke, while everyone laughed at him.
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            When you're done making speeches, John, perhaps you could serve the berries and pass the cream and sugar. Mr. Maxwell, is the cream in the village as yellow as this?
        - id: ch01-b25
          speaker: mr_maxwell
          text: No, Mrs. Wood. Ours is much paler.
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Then came the clink of china, dishes moving from hand to hand, and plenty of talk and laughter. No one noticed that I wasn't in my usual place in the hall. I still dreaded that green creature, so I had crept under the table. If it came out and frightened Miss Laura, I meant to catch it.
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            Halfway through tea, Miss Laura gave a little cry. I sprang onto her lap. The wicked-looking green thing was sliding across the table toward her. I stepped onto the table and caught it around the middle before it reached her. My back paws landed in a dish of jelly, my front paws in a plate of cake, and I was terribly uncomfortable. The creature's tail hung in the milk pitcher. Its tongue still flicked at me, but I held on and stood perfectly still.
        - id: ch01-b28
          speaker: miss_laura
          text: Drop it! Oh, Joe, drop it!
          emotion: fearful
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell struck me on the back, and I let the creature go. I stood there looking foolish. Mr. Wood leaned back and laughed with all his might. Mrs. Wood stared sadly at her ruined table. Miss Laura told me to get down, then helped her aunt carry away the spoiled food and dishes.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            I knew I had done wrong, so I crept into the hall. Mr. Maxwell sat on the lounge, tearing his handkerchief into strips. He wrapped them around the places where my teeth had caught the creature. I had tried not to hurt it much because I knew it was his pet, but he didn't know that. He scowled at me.
        - id: ch01-b31
          speaker: mr_maxwell
          text: You rascal! You've hurt my poor snake terribly.
          emotion: angry
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            His words made me feel so bad that I went and stood with my head in a corner. I would almost rather be whipped than scolded. After a while, Mr. Maxwell returned to the dining room, and they all went on with their tea. From the hall, I heard Mr. Wood's loud, cheerful voice.
        - id: ch01-b33
          speaker: mr_wood
          text: >-
            Joe did exactly the right thing. Most snakes are poisonous, and his instinct told him to protect his mistress. Where is he? Joe! Joe!
        - id: ch01-b34
          speaker: beautiful_joe
          text: I stayed where I was until Miss Laura came to me.
        - id: ch01-b35
          speaker: miss_laura
          text: Dear old Joe. You knew the snake was there all along, didn't you?
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            That made me feel better. I followed her back to the dining room, where Mr. Wood kept me beside him and fed me scraps from his hand for the rest of the meal.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell's bad temper had passed, and he was talking brightly again.
        - id: ch01-b38
          speaker: mr_maxwell
          text: >-
            Good Joe. I was cross with you, and I'm sorry. I always get upset when one of my pets is hurt. You couldn't know that my poor snake was only looking for food. Mrs. Wood has pinned him inside my pocket, so he can't escape again. Mrs. Wood, do you know where I found that snake?
        - id: ch01-b39
          speaker: mrs_wood
          text: No. You've never told me.
        - id: ch01-b40
          speaker: mr_maxwell
          text: >-
            It was across the river near Blue Ridge. One hot day last summer, I was rowing and tied my boat beneath a large shade tree. I heard a great noise from some village boys in the woods, so I went to see what was happening. They belonged to the Band of Mercy. They had found a country boy beating a snake to death and were arguing with him about his cruelty. They told him that some snakes help farmers by killing great numbers of field mice and other pests.
        - id: ch01-b41
          speaker: mr_maxwell
          text: >-
            The country boy wouldn't listen. He had found the snake, and he insisted that gave him the right to kill it. The argument was growing lively when I arrived. I persuaded the boys to hand the snake over to me. It looked dead already, but I thought it might recover, so I laid it on some grass in the bow of my boat.
        - id: ch01-b42
          speaker: mr_maxwell
          text: >-
            It didn't move for a long while. At last, I took up my oars and headed home. Halfway across the river, I turned and saw that the snake had vanished. It had just slipped into the water and was swimming back toward the shore we'd left, so I turned the boat and followed.
        - id: ch01-b43
          speaker: mr_maxwell
          text: >-
            The poor thing swam slowly and painfully. Every few seconds it raised its head high above the water to find its way. When it reached the bank, it coiled up and brought up blood and water. I lifted it carefully, carried it home, and nursed it. Before long it recovered, and it has been my pet ever since.
        - id: ch01-b44
          speaker: beautiful_joe
          text: >-
            After tea, Mrs. Wood and Miss Laura helped Adele finish the work. Then everyone gathered in the parlor. The day had been warm, but a cool wind had risen. Mr. Wood said rain was coming.
        - id: ch01-b45
          speaker: beautiful_joe
          text: >-
            Mrs. Wood thought a fire would feel pleasant, so they lit the wood in the open grate and all sat together around the bright flames.
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            Mr. Maxwell held the little snake toward the warmth and tried to make us friends. Now that I knew it was harmless, I wasn't afraid. The snake didn't like me, though. Whenever I looked at it, its funny little tongue came out.
        - id: ch01-b47
          speaker: beautiful_joe
          text: Soon the rain began tapping against the windows.
        - id: ch01-b48
          speaker: mr_maxwell
          text: >-
            This is the perfect night for a story. Mr. Wood, won't you tell us something you've lived through?
        - id: ch01-b49
          speaker: beautiful_joe
          text: >-
            Mr. Wood sat between his wife and Mr. Harry, with one hand resting on Mr. Harry's knee. He answered in his easy, cheerful way.
        - id: ch01-b50
          speaker: mr_wood
          text: What would you like to hear?
        - id: ch01-b51
          speaker: mr_maxwell
          text: Something about animals. We've been talking about them all day.
        - id: ch01-b52
          speaker: mr_wood
          text: >-
            Then I'll talk about an idea that's been on my mind for a long time. People say a great deal about being kind to domestic animals, but I hear very little about kindness to wild ones. The same Creator made them both, so why protect one and not the other? I have no more right to torture a bear than I do a cow.
        - id: ch01-b53
          speaker: mr_wood
          text: >-
            Most of the wild animals around here have been killed off, though other places still have plenty. I enjoyed hunting as a boy, but in recent years I've grown disgusted with killing. Unless wild creatures were running through our streets, I wouldn't raise a hand against them. Shall I tell you about some of the sport we had when I was young?
        - id: ch01-b54
          speakers: [miss_laura, mrs_wood, mr_harry, mr_maxwell]
          ensemble: chorus
          text: Yes! Please do!
