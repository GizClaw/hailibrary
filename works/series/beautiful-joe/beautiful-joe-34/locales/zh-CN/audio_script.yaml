audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 正直沉稳，危急时焦灼而果断
        timbre: 温厚结实
        pace: 适中
        pitch: 中低
    passerby_1:
      display_name: 路人甲
      tts:
        delivery: 匆忙紧张，话语短促
        timbre: 清晰粗实
        pace: 快
        pitch: 中
    passerby_2:
      display_name: 路人乙
      tts:
        delivery: 惊惶急切，边看火势边高声呼喊
        timbre: 明亮有力
        pace: 快
        pitch: 中高
    firefighter_watson:
      display_name: 消防员吉姆·沃森
      tts:
        delivery: 勇敢干练，危急中简短坚决
        timbre: 低沉有力
        pace: 稍快
        pitch: 中低
    charlie_montague:
      display_name: 查理·蒙塔古
      tts:
        delivery: 稚嫩敏感，受惊时气息不稳
        timbre: 清亮单薄
        pace: 适中
        pitch: 高
    bellini:
      display_name: 贝利尼
      tts:
        delivery: 热情自信，带着意大利口音和舞台上的夸张礼貌
        timbre: 苍老洪亮
        pace: 适中
        pitch: 中
    bystander_for_people:
      display_name: 主张先救人的路人
      tts:
        delivery: 急躁强硬，在混乱中扯着嗓子喊
        timbre: 粗厚
        pace: 快
        pitch: 中低
    bystander_for_horses:
      display_name: 主张救马的路人
      tts:
        delivery: 愤慨急迫，声音响亮
        timbre: 清脆有力
        pace: 快
        pitch: 中
    mr_montague:
      display_name: 蒙塔古先生
      tts:
        delivery: 极力克制，悲痛深沉而不外露
        timbre: 低哑疲惫
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第三十四章　费尔波特的一场大火
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我已经跟男孩们去看过几次火灾，知道那种时候总是又吵又乱。屋里一亮灯，我便明白有人起床了。那些男孩都是好孩子，绝不会盼着别人损失财物。不过，看见火烧起来，他们确实会兴奋。要是很久没有火灾，他们甚至会在花园里点一堆篝火，快活一番。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            吉姆和我绕到前门等着。没多久，门口一阵乱响。我还以为出来的是杰克，结果却是莫里斯先生。他一句话也没说，几乎一路跑向镇上，我们赶紧跟去。沿街不断有人冲出家门，有的加入我们，有的跑到了前头。大家显然起身起得很急，一边跑，一边把胳膊伸进外套，扣好纽扣。有人戴着帽子，也有人光着头，全都奔向前面那片越来越亮的红光。
        - id: ch01-b03
          speaker: passerby_1
          text: 哪儿着火了？
        - id: ch01-b04
          speaker: passerby_2
          text: >-
            不知道，怕是旅馆，要不就是镇公所。火这么大，但愿不是。现在的水够用吗？偏偏这时候着火，真糟糕。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            真的是旅馆。我们一到主街就看清了。四下挤满人群，到处是叫喊、混乱、浓烟和黑影。上面一条条明亮的火舌，正往夜空里蹿。莫里斯先生挤进人群，我和吉姆紧贴着他的脚跟。前面有人扛梯子和斧头，有人高声指挥，还有人抱着箱子、包袱和家具冲出旅馆。楼上的东西接连被扔进人群。一面镜子砸中莫里斯先生的胳膊，一大包衣服又落到他头上，险些把他闷住。他拨开衣服，几乎看都没看。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            从楼上扔下来的东西简直没有停过，像一道急流，全都落进下面的人群。我听得出，莫里斯先生同别人说话时十分焦急，便知道一定出了很严重的事。周围虽然被火照得像白天，我却看不见他的脸，因为人实在太挤了。要不是一直躲在他两脚之间，我非被踩死不可。吉姆个头大，已经同我们挤散了。
        - id: ch01-b07
          speaker: mr_morris
          text: 旅馆里的人全都出来了吗？
        - id: ch01-b08
          speaker: firefighter_watson
          text: 我正要上去查看！
        - id: ch01-b09
          speaker: passerby_2
          text: >-
            那是消防员吉姆·沃森！他冒着性命也要进火海。沃森，别去啊！他已经把梯子搭上三楼了，看来非去不可。可是，他最多也只能上到二楼。
          emotion: fearful
        - id: ch01-b10
          speaker: mr_morris
          text: 蒙塔古一家在哪里？有人见过他们吗？
        - id: ch01-b11
          speaker: charlie_montague
          text: 莫里斯先生！莫里斯先生！我爸爸在哪儿？
          emotion: fearful
        - id: ch01-b12
          speaker: mr_morris
          text: 我不知道。你最后在哪里见到他的？
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            莫里斯先生牵住查理，把他拉到身边。
        - id: ch01-b14
          speaker: charlie_montague
          text: >-
            我睡在爸爸房里。有人敲门说，旅馆着火了，只给五分钟穿衣服，必须马上出去。爸爸叫我穿好衣服下楼，自己跑上去找妈妈了。
        - id: ch01-b15
          speaker: mr_morris
          text: 她住在哪儿？
        - id: ch01-b16
          speaker: charlie_montague
          text: >-
            四楼。她和女仆布兰奇都在那里。妈妈身体不好，睡不着。我们的房间又太吵，她才搬到楼上安静的地方。这里热得我难受，声音也吓死人了。我要妈妈！
          emotion: fearful
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            莫里斯先生听完，发出一声像呻吟似的叹息。查理又哭了起来。莫里斯先生尽力安慰他，把他带到人群边上。就在这时，一声尖厉的呼喊刺破四周的喧闹。我看不见那个人，却知道是意大利人贝利尼。他用结结巴巴的英语喊着，火已经烧向马厩，他的动物就要被烧死了。
        - id: ch01-b18
          speaker: bellini
          text: 谁来帮帮我？求你们把我的动物放出来！
          emotion: fearful
        - id: ch01-b19
          speaker: bystander_for_people
          text: 先救人！动物别管了！
        - id: ch01-b20
          speaker: bystander_for_horses
          text: 说这种话不害臊吗？快去把马救出来！
          emotion: angry
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            人们喊成一片，有人坚持先救人，也有人催着大家去救马。可是，谁也没有真的动手，贝利尼仍在不断求救。附近又有人说，大家刚刚发现，几个睡在旅馆顶层的人还没逃出来。顶层的一扇窗后，还有个可怜的女佣正在尖叫求救。我们从街上望去，却什么人也看不见，只有浓烟不停地从那些窗户涌出来，把楼上的一切都遮住了。
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            空气又热又闷，查理难怪会撑不住。要不是莫里斯先生及时抱起他，他已经倒在地上了。莫里斯先生把他带出人群，放在砖铺的人行道上，解开小衬衫，叫我守在一旁。附近一条接在消防栓上的水龙带漏了水，他把双手伸到漏水处，好不容易接来一些，泼在查理的脸上和胸前。看见孩子渐渐醒过来，他才坐到路缘石上，把查理抱在膝头。查理躺在他怀里呻吟。他身体娇弱，禁不起这样的折腾，不像莫里斯家的男孩们那么结实。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            莫里斯先生急得面无人色。燃烧的楼里每传出一声呼喊，他就浑身一颤。他望着那一大片冲天的火焰，又低头把查理搂得更紧。
        - id: ch01-b24
          speaker: mr_morris
          text: 可怜的人们，愿上帝救救他们。这实在太可怕了。
          emotion: fearful
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            突然，一阵狂乱的惨叫传来，我马上听出那绝不是人的声音。火一定已经烧到马群了。莫里斯先生猛地站起，又无力地坐下。他很想赶去相救，可去了也帮不上忙。周围虽有几百个男人，火势却蔓延得太快，能用来灭火的水又太少，大家只能眼看着，谁也做不了多少事。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            我想，也许自己能帮帮那些可怜的动物。我不像多数狗那样怕火。莫里斯家的男孩教过我用爪子灭火，那还是他们教给我的一项把戏。他们把点燃的纸扔在地板上，我就用两只前爪把火踩灭。要是火焰大得踩不住，我会拖来一块旧地毯盖在上面，再跳上去压住。于是我离开莫里斯先生，绕过街角，跑到旅馆后面。那里烧得没有正面厉害。四周房屋里的人带着湿毯子爬上屋顶，还有人守在窗口看火，或是忙着收拾家当，预备火一蔓延过来就马上搬走。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            一条窄巷朝旅馆伸去。我刚要进去，前方便传来凄厉刺耳的哀号，吓得我浑身发抖，僵在原地。贝利尼的动物就要活活烧死了。它们正在呼唤主人来放它们出去，那声音就像孩子承受着致命的痛苦。我再也受不了。一股对大火的恐惧猛地攫住了我。我转身逃走，心里只庆幸自己没有困在火中。
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            刚回到街上，我就被一样东西绊住。那是一只大鸟，一只鹦鹉。起初我以为是贝拉，随后才想起杰克说过，贝利尼也养着一只鹦鹉。它没有死，只是让烟熏得昏昏沉沉。我用嘴衔起它，一路跑回莫里斯先生那里，放在他的脚边。他用手帕把鹦鹉包好，安置在自己身旁。
        - id: ch01-b29
          speaker: beautiful_joe
          text: >-
            我坐在那里不停发抖，再也不肯离开莫里斯先生。那个可怕的夜晚，我永远忘不了。我们仿佛在那里熬了几个钟头，其实只过了很短一阵。旅馆很快从上到下全成了赤红的火焰，烟反倒越来越少。原来楼房里面已经烧空，再也抢不出任何东西。消防员和围观的人全都向后退开，刚才震耳欲聋的喧闹声也停了。所有人都一声不响地站着，默默望着眼前的烈焰。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            一个男人静静走到莫里斯先生面前，原来是蒙塔古先生。他平日总是衣着考究，面容和善，头上长着浓密的灰褐色头发。此刻，他的脸让烟尘熏得乌黑，额前的头发已经烧掉，身上的衣服也撕破了大半，几乎挂不住了。莫里斯先生一见他，立刻站了起来。
        - id: ch01-b31
          speaker: mr_morris
          text: 你的妻子呢？
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            蒙塔古先生一句话也没有回答，只抬起手，指向仍在熊熊燃烧的旅馆。
        - id: ch01-b33
          speaker: mr_morris
          text: >-
            不可能！不会弄错了吗？蒙塔古，你那样年轻美丽的妻子……怎么会这样？
          emotion: surprised
        - id: ch01-b34
          speaker: beautiful_joe
          text: 莫里斯先生从头到脚都在发抖。
        - id: ch01-b35
          speaker: mr_montague
          text: 是真的。把孩子给我。
          emotion: sad
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            查理这时又昏了过去。父亲从莫里斯先生手中接过孩子，把他抱进怀里，转身要走。
        - id: ch01-b37
          speaker: mr_morris
          text: 蒙塔古，我真为你心痛。我什么也帮不了你吗？
          emotion: sad
        - id: ch01-b38
          speaker: mr_montague
          text: 不用了，谢谢。
          emotion: sad
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            他没有回头，声音里的痛苦却比莫里斯先生更深。尽管我只是一条狗，也听得出，他的心正在碎裂。
