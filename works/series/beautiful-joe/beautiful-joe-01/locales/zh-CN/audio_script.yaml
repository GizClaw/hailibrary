audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mother:
      display_name: 母亲
      tts:
        delivery: 温柔忠诚，语气轻缓
        timbre: 柔和成熟
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章　不过是一条杂种狗
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            我叫美丽的乔，是一条中等个头的棕毛狗。这个名字可不是在夸我好看。我在牧师莫里斯先生家住了十二年。他说，他祖父从前住在南方，曾把一个长得很丑的黑人小奴隶叫作丘比特，又把孩子的母亲叫作维纳斯。我的名字，大概也是这么来的。我听不懂这个玩笑，只知道每次莫里斯先生一说，大家就看着我笑。我知道自己不好看，也不是纯种狗。我不过是一条杂种狗。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            女主人每年都要去替我登记、缴税。办事处的人问起品种，她就回答，一半是猎狐㹴，一半是斗牛㹴。可那人每次都写下“杂种狗”。女主人似乎不爱听这个称呼，不过她也说过，自己更喜欢杂种狗，因为我们比纯种狗更有个性。她父亲拿这件事打趣，说某位国王宫廷里有个贵族，也专爱丑狗，理由只有一个：别人都不喜欢它们。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            如今我老了，想把自己的一生讲出来，请一位朋友替我写。我见过女主人读一本讲马的一生的小书。她读着读着，一会儿笑，一会儿哭。有时还会把书放到我鼻子前，让我看看图画。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            我爱亲爱的女主人，胜过世上的任何人。我的心意，再没有别的话能说清了。我想，一条狗的故事会让她高兴。她疼爱我们这些不会说话的动物，一看见动物遭到残酷对待，心里就很难过。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            她说过，要是全世界的男孩女孩都站出来，一起说不许再虐待动物，他们就能阻止这种事。也许我讲出自己的故事，也能帮上一点忙。我喜欢孩子。残忍的大人，我见过不少，残忍的孩子却很少。人们要是肯多写一些动物的故事，我们的日子也许就会好一点。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            那么，我就从头讲起，一直讲到最后。我出生在缅因州费尔波特小镇郊外的一间马厩里。最早记得的，是紧靠着母亲躺着，又舒服又暖和。再往后，记住的就是饿。我们一共有七只小狗，母亲的奶怎么也不够。她自己都常常饿得半死，当然没法把我们喂饱。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            我实在不愿多讲小时候的生活。后来，我在一个从不说刻薄话的家里住了太久。那里谁也不会伤害人，更不会伤害动物。现在就连回想有人欺负可怜的动物，我都觉得很不应该。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            母亲的主人是个送奶人，名叫詹金斯。他养了一匹马、三头奶牛，还有一辆装牛奶罐的破马车，走起来摇摇晃晃。我想不出世上还有谁能比他更坏。直到今天，一想到他，我仍会发抖。他残酷地对待动物，也残酷地对待人。我很庆幸，他现在正为这些事受惩罚。你要觉得我不该高兴，就请记住，我不过是一条狗。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            我还是一只刚能站稳的小狗时，詹金斯头一回注意到我，就是一脚把我踢进马厩角落。他总是毒打母亲，还不让她吃饱。我亲眼见过他用沉重的鞭子抽她，直到她浑身是血。后来我长大一些，问母亲为什么不逃走。
        - id: ch01-b10
          speaker: mother
          text: 我不想逃。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            我很快就明白了。她不是不能逃，她是爱詹金斯。那个男人那么凶狠，那么残暴，她还是爱他。我相信，她甚至愿意把命交给他。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            年纪大了以后，我才知道，世上不止詹金斯一个这样的人。他们没疯，也没喝醉，只是心里仿佛装满了邪恶。就连生活宽裕的人、富有的人，也可能残酷地折磨动物和年幼的孩子。有些事可怕得叫人连说都不忍心。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            詹金斯那么残酷，有一部分是因为懒。早晨送完牛奶，到傍晚以前，他只用照看马厩和院子。他要是肯收拾地方，给马刷毛，把奶牛洗干净，再翻翻菜园，一整天都会有事做。可他什么也不整理，东西扔在哪里，就留在哪里。后来院子和马厩堆得乱七八糟，连他自己都快走不过去了。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            他的房子和马厩在一大片田地中央，离大路很远，路人看不见里面有多乱。偶尔会有人来查看房屋和场地，可詹金斯总能提前知道日子，赶在那人来以前稍微收拾一下。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            我常盼着那些买牛奶的人能亲眼看看他的奶牛。春天和夏天，牛还能到外面吃草。一到冬天，它们就整日站在又脏又暗的马厩里。墙上的缝很宽，风雪从缝里直灌进来，地上几乎会积起雪堆。泥泞的地面一直湿漉漉的。北墙只有一扇小窗，下午的阳光也只能照进来一小会儿。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            那些奶牛很不快乐，却一直耐心地站着，从不抱怨。冬夜的寒风穿过马厩时，它们有时一定冻得快要僵了。它们个个又瘦又弱，身体从来没有好过。它们不但挨冻，吃到的饲料也差得很。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            几乎每天下午，詹金斯都会拉回一个大木桶，放在马车后面。他说桶里装的是“下脚料”。那都是厨房里的废物。他送牛奶时，请各家的厨子替他留下来。烂蔬菜、削掉的果皮、餐桌上的剩菜，都扔进桶里，过几天才交给他。那一桶东西又酸又臭，黏成一团，什么动物都不该吃。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            要是“下脚料”不够，他就进城拉一车腐烂的蔬菜。杂货商都巴不得他把这些东西带走。
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            奶牛靠这些东西和劣质干草充饥，挤出的奶自然也很差。于是，詹金斯往奶里掺白色粉末。他说，这样牛奶就显得“稠实”了。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            后来，这些牛奶害出了一件非常悲惨的事，知情的只有詹金斯和他的妻子。詹金斯太太是个可怜又不快活的女人。她怕丈夫怕得要命，连话也不敢多说。她不爱干净，家里收拾得一塌糊涂，是我见过最糟的房子。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            她常做些很古怪的事。现在我才知道，持家的人绝不该这么做。有一回，我看见她抓起扫帚去捣锅里的土豆。扫帚柄在锅里一下下地捣，扫帚头就在空中上下飞，把灰尘全抖进了锅。她还常把一盆稀面团敞着放在厨房里。有时候，母鸡会走进屋，直接坐到面团上。
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            孩子们总在门前的泥水坑里玩。一个早春，詹金斯还没把奶牛赶出去吃草，最小的孩子染上了热病，病得很重。詹金斯太太想请医生，丈夫却不准。她只好在厨房炉子旁搭一张床，一边照料孩子，一边在旁边做完所有家务。我好几次看见她用洗牛奶盘的抹布给孩子擦脸。
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            除了这家人，谁也不知道小女孩病了。詹金斯名声太坏，邻居都不肯上门。后来孩子康复了。又过了一两个星期，詹金斯回家时，脸上十分惊慌。他告诉妻子，有一位顾客家的男主人染上了严重的伤寒。
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            过了一阵，那位先生死了。那家的厨子告诉詹金斯，医生怎么也想不明白他为什么会得伤寒，因为镇上根本没有别的病例。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            从此，那位先生的妻子成了寡妇，三个孩子也失去了父亲。他们永远不会知道，夺走那个善良丈夫和父亲的，竟是一个肮脏又粗心的送奶人。
