audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    mother:
      display_name: Mother
      tts:
        delivery: gentle and devoted
        timbre: soft and mature
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: ONLY A CUR
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            My name is Beautiful Joe. I am a medium-sized brown dog, but no one gave me that name because I was handsome. Mr. Morris is the clergyman whose family I have lived with for twelve years. His grandfather lived down South. He called a very ugly enslaved boy Cupid and called the boy's mother Venus. Mr. Morris thinks my name must be the same sort of joke. I never quite understand him. Everyone looks at me and smiles when he says it, though. I know I am not beautiful, and I am certainly not a thoroughbred. I am only a cur.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Every year, my mistress went to register me and pay my tax. Whenever the man at the office asked my breed, she answered that I was part fox terrier and part bull terrier. The man always wrote down "cur." She did not seem to like that. Still, I heard her say she preferred curs because they had more character than well-bred dogs. Her father teased her about it. He compared her to a nobleman at the court of a certain king who liked ugly dogs for one reason. Nobody else would want them.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            I am an old dog now, and I am telling the story of my life with a friend's help. I have watched my mistress laugh and cry over a little book about the life of a horse. Sometimes she lays it near my nose so I can see the pictures.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            I love my dear mistress better than anyone else in the world. That is all I can say about how much I love her. I think a dog's story will please her, because she loves animals that cannot speak for themselves. It always hurts her to see one treated cruelly.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            I have heard her say that if all the boys and girls in the world stood up together and said there must be no more cruelty to animals, they could put an end to it. Perhaps telling my story will help a little. I am fond of children. I have met many cruel men and women, but very few cruel children. The more stories people tell about animals like us, the better our lives may become.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            I had better begin at the beginning and go straight through to the end. I was born in a stable outside a little town in Maine called Fairport. My first memory is of lying against my mother, snug and warm. My next memory is hunger. There were seven puppies in all, my six brothers and sisters and me. Our mother never had enough milk for us. She was half starved herself, so she could not feed us properly.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            I do not like to speak about those early days. For so long now, I have lived in a home where no one uses harsh words and no one would think of hurting a person or an animal. Even remembering cruelty to a helpless creature feels wrong.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            My mother's owner was a milkman named Jenkins. He had one horse, three cows, and a shaky old cart for his milk cans. I cannot imagine a worse man. Even now, the thought of him makes me shudder. He was cruel to animals and to people, and I am glad he is being punished for it. If you think I should not be glad, please remember that I am only a dog.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Jenkins first noticed me when I was a tiny puppy, barely able to stagger around. He kicked me so hard that I flew into a corner of the stable. He beat my mother and gave her too little food. I saw him strike her with his heavy whip until she was covered in blood. When I grew older, I asked why she never ran away.
        - id: ch01-b10
          speaker: mother
          text: I don't want to run away.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            Before long, I understood the real reason. She loved Jenkins. Cruel and savage as he was, she still loved him. I believe she would have given her life for him.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Now that I am old, I know Jenkins was not the only man like that. Such people are not necessarily mad or drunk. Some simply seem full of wickedness. Even comfortable and rich people can be terribly cruel to animals and little children. Some of what they do is too dreadful to describe.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            Jenkins was cruel partly because he was idle. He delivered his milk in the morning. Then, until late afternoon, he had nothing to do except care for his stable and yard. Keeping them neat, grooming his horse, cleaning the cows, and digging the garden could have filled that time. Instead, he let everything lie where he dropped it. Soon the yard and stable were so cluttered that he could hardly get through them.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            His house and stable stood in the middle of a large field, well back from the road, so people passing by could not see the mess. Now and then, a man came to inspect the property. Jenkins always knew when the man was coming, and he cleaned the place up a little beforehand.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            I often wished his milk customers would come and see the cows. In spring and summer, he drove them out to pasture. All winter, they stayed in that dark, filthy stable. The gaps in its walls were so wide that snow blew inside and almost formed drifts. The ground never stopped being wet and muddy. There was one small window on the north side, and afternoon sunlight came through it for only a short while.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            Those cows were miserable, yet they waited patiently and never complained. On bitter winter nights, the wind pouring through the stable must have nearly frozen them. They were thin, weak, and always unhealthy. They were cold, and the food Jenkins gave them was poor.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            Nearly every afternoon, Jenkins came home with a large tub in the back of his cart. He called what was inside "peelings." At the houses where he delivered milk, he asked the cooks to save their kitchen waste. For days, they tossed rotten vegetables, fruit skins, and table scraps into a tub. Then they gave the whole sour, nasty mess to him. It was not fit for any living creature to eat.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            When he could not collect enough peelings, he went into town for a load of spoiled vegetables. The grocers were happy to be rid of them.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            The cows had that rubbish and poor hay to live on, so their milk was poor as well. Jenkins mixed white powder into it to make it seem thicker. He said the powder gave the milk "body."
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            Once, something very sad happened because of that milk. Only Jenkins and his wife knew the truth. Mrs. Jenkins was a frightened, unhappy woman who hardly dared to speak to her husband. She did not keep herself clean, and her house looked worse than any house I had ever seen.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            She did things that I now know no one should do in a kitchen. I saw her pound potatoes in their pot with the handle of a broom. As the broom flew up and down, dust fell from it into the potatoes. She often left a pan of soft bread dough uncovered. Sometimes the hens wandered into the kitchen and sat right in it.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            The Jenkins children played in the muddy puddles outside the door. Early one spring, before the cows had been sent out to pasture, the youngest child came down with some kind of fever. She grew very ill. Mrs. Jenkins wanted to call a doctor, but her husband refused. They made the child a bed in the kitchen beside the stove. Mrs. Jenkins cared for her as well as she could while doing all her work nearby. More than once, I saw her wipe the child's face with the same cloth she used to wash the milk pans.
        - id: ch01-b23
          speaker: beautiful_joe
          text: >-
            No one outside the family knew the little girl was sick. Jenkins had such a bad name that the neighbors never visited. In time, the child recovered. A week or two later, Jenkins came home looking frightened. He told his wife that one of his customers had a husband who was gravely ill with typhoid fever.
        - id: ch01-b24
          speaker: beautiful_joe
          text: >-
            After a while, the man died. His cook told Jenkins that the doctor could not understand where the fever had come from, because there were no other cases in town.
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            The man's wife was left a widow with three children. None of them ever knew that a dirty, careless milkman had taken away their loving husband and father.
