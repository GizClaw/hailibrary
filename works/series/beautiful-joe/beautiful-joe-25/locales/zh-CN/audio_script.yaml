audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 第二十五章　幸福的马
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            刚到丁利农庄的那阵子，我总躲着马。我怕它们把我当成布鲁诺那样的坏狗，一脚踢过来。不过，它们的模样都很和善，看我的眼神也十分亲切。慢慢地，我就不怎么怕了。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            我最喜欢哈里先生的小马疾蹄。一天下午，哈里先生和劳拉小姐去看它，我也跟着去了。疾蹄正在树下的草地上翻滚玩耍。一看见哈里先生，它尖声叫起来，跑过去就拿鼻子探他的口袋。
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            别急。先见见这位年轻小姐，她叫劳拉·莫里斯。来，向她鞠个躬。
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            哈里先生揪着疾蹄额前的鬃毛，给它做了个手势。疾蹄马上用前蹄刨地，又摇起脑袋。
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            这是劳拉的狗乔，你也要和它好好相处。过来吧，乔。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            有哈里先生在，我知道疾蹄伤不了我，便站到它面前，头一回好好看了看它。大家虽说它是小马，其实它早已长大，也开始干活了。它全身深栗色，身材匀称，脑袋修长漂亮。我从没见过那么美的眼睛。那双又大又圆的褐色眼睛望着我，简直像人的眼睛。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            它把我从头看到脚，好像在问，我究竟是条会善待它的好狗，还是像布鲁诺那样追着它、咬它脚后跟，非逼得它踢我的坏狗。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            我认真望着它，使劲摇动身体，又用后腿站起来凑近它。疾蹄好像很满意，低下鼻子闻了闻我。我们就这样成了朋友，而且是极要好的朋友。除了吉姆和比利，我最爱的就是疾蹄。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            哈里先生拿出几块糖，让劳拉小姐摊开手掌，托到疾蹄面前。疾蹄一边吃，一边安静地打量她。那双眼睛像是什么都看得明白。
        - id: ch01-b10
          speaker: miss_laura
          text: >-
            这匹小马看起来真聪明！
          emotion: surprised
        - id: ch01-b11
          speaker: mr_harry
          text: >-
            它就像匹老马。突然听见响声，它不会乱跑，而是停下来四处看，非要找出原因。
        - id: ch01-b12
          speaker: miss_laura
          text: >-
            你把它训练得真好。
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            我从小就细心养它。与其说它是匹小马，不如说它像条狗。它整天跟着我在农庄里转，我碰过什么，它都要闻一闻，好像样样事情都想弄懂。
        - id: ch01-b14
          speaker: miss_laura
          text: >-
            你母亲说，去年夏天有一天，她发现你们俩都睡在草坪上，疾蹄的头还枕着你的胳膊。
        - id: ch01-b15
          speaker: mr_harry
          text: >-
            我们一直是伙伴，对吧，疾蹄？它实在太依恋我，有时弄得我都有些不好意思。它会跟我进村，我去钓鱼，它也想跟着。如今它四岁了，也该慢慢收起小马驹的性子。我已经常常驾它拉车。我们下午要坐轻便马车出去，你也来吗？
        - id: ch01-b16
          speaker: miss_laura
          text: >-
            你们要去哪里？
        - id: ch01-b17
          speaker: mr_harry
          text: >-
            去河那边走一小段路，替父亲收些钱。下午茶以前很早就能回来。
        - id: ch01-b18
          speaker: miss_laura
          text: >-
            好，我也去。我回屋换顶帽子。
        - id: ch01-b19
          speaker: mr_harry
          text: >-
            走吧，疾蹄。
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            哈里先生带我们走出牧场，我在游廊附近等着。不一会儿，他驾车来到前门。马车乌黑锃亮，疾蹄套着镶银的马具，神气极了。它温顺地站在那里，甩着长尾赶苍蝇，脑袋却转向一旁，等着看谁来上车。劳拉小姐和哈里先生刚一坐稳，它就摆出急着出发的样子。哈里先生招呼一声，它立刻跑了起来。
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            我沿着小路跑在疾蹄身边，想到它已经是我的朋友，心里别提多快活。它也喜欢我陪着，隔一会儿就低头看看我。动物不用说话也能互通心意。只要它用特别的姿势轻轻扬头，我就知道它想赛跑。它跑得又快又稳，哈里先生只好不断叫它收一收脚步。
        - id: ch01-b22
          speaker: miss_laura
          text: >-
            你不愿意让它跑得太快，是吗？
        - id: ch01-b23
          speaker: mr_harry
          text: >-
            是啊。我们真想那么做，大概能把它练成赛马，可父亲和我都不迷快马。如今人们谈论快步马和赛马，实在谈得太多了。附近有些农庄为了繁殖快马，简直着了魔。
        - id: ch01-b24
          speaker: mr_harry
          text: >-
            乡下有个老农夫，忽然发现自己那匹普普通通的拉车马跑得快，耐力也强，就高价卖给了一个投机商。这件事一下叫所有人都发了狂。那些把全部时间都花在这上面的人，尚且未必养得出快马，农夫又凭什么觉得自己一定行？农庄里有匹快马，对年轻人准是祸害，只会引得他们赛马下注。
        - id: ch01-b25
          speaker: mr_harry
          text: >-
            父亲倒想设个奖，奖给新罕布什尔州培育出的走路最快的马。我们的荷兰马虽然重，走起来还不错。克利夫和佩瑟每小时都能走四英里半。
        - id: ch01-b26
          speaker: miss_laura
          text: >-
            你们为什么这么看重马走路的速度？
        - id: ch01-b27
          speaker: mr_harry
          text: >-
            因为许多农活都得让马一步步走着干。犁地、拉货、把农产品送进市场，还有上下山坡，全是这样。就算在城里，马走得快也有好处。载重马在石路上小跑，对它们的腿伤害很大。要是准它们快步走，腿脚反而能强健得更久。
        - id: ch01-b28
          speaker: mr_harry
          text: >-
            大城市耗损马匹的办法真可耻。我们的路面太糟，出租马车的马三年就废了。生活在这个新国家，我们在许多方面都比欧洲人幸运，可城里的马却不是这样。伦敦和巴黎的马能用上五年。我在纽约亲眼见过马因为受尽劳役，当场倒下死去。
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            这些可怜的牲口，不过，它们的好日子快来了。等电力发展得更完备，我们一定会看到惊人的变化。单是去年，各地道路换用电力，就让大约三万匹马摆脱了那些可恶的马拉有轨车。怎么，疾蹄，还想再跑一阵？好，小伙子，跑吧！
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            我们又在一段平路上飞奔。疾蹄那漂亮的脖子上没有缚头缰，跑小步时，脑袋能摆得轻松自然。它有出众的眼睛、飘动的鬃毛和长尾，红褐色的身体油亮发光。在我看来，它是我见过的马里最英俊的一匹。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            疾蹄最爱快跑。哈里先生叫它慢下来，它虽不耐烦地甩头，还是乖乖照做。它的性子太温顺，不肯违抗主人。后来认识它那么多年，我从没见它拒绝过主人的一次吩咐。
        - id: ch01-b32
          speaker: miss_laura
          text: >-
            哈里，你是不是忘记带鞭子了？
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            那时马车走得很慢，我张着嘴吐出舌头，气喘吁吁地跟在旁边。
        - id: ch01-b34
          speaker: mr_harry
          text: >-
            我从来不用鞭子。谁敢拿鞭子抽疾蹄，我就把谁打倒。
          emotion: angry
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            他的声音忽然严厉起来，我抬头看向车里。他此刻的神情，正像当初把詹金斯摔在地上狠狠教训时一样。
        - id: ch01-b36
          speaker: miss_laura
          text: >-
            你不用鞭子，我真高兴。你很像俄国人，他们当中有许多人只凭自己的声音驾驭马匹，还会用那么好听的名字亲切地叫它们。不过，遇到有些马，还是非用鞭子不可，对吗，哈里表哥？
        - id: ch01-b37
          speaker: mr_harry
          text: >-
            对。有些马十分凶悍，不用鞭子根本控制不了。还有不少马，必要时也得用它催着往前。
        - id: ch01-b38
          speaker: miss_laura
          text: >-
            疾蹄一定从来不会赖着不走。
        - id: ch01-b39
          speaker: mr_harry
          text: >-
            它不会，荷兰马有时会。我们有两个办法，都很管用。先抬起它一只前脚，用石头在蹄铁上敲两三下。它总觉得这件事很有趣，通常马上就肯走。要是这样还不动，就用绳子绕过两条前腿的膝关节，再走到它前面拉那根绳子。除非实在没别的办法，父亲不许工人用鞭子。
        - id: ch01-b40
          speaker: miss_laura
          text: >-
            疾蹄的一生过得很幸福吧？哈里，它怎么会这样喜欢你？
        - id: ch01-b41
          speaker: mr_harry
          text: >-
            我照自己的办法驯它。父亲把它送给我。它刚能站起来时，我第一次走近它，只小心地把手放在它身上。我们买来它母亲还不久，母马有些怕我，它也跟着母亲害怕，我便很快走开了。下一次，我轻轻摸了摸它。再下一次，我把胳膊搂到它身上。没过多久，它就像条大狗。我用一根皮带便能牵着它到处走，还亲手给它做了小笼头和一套马勒。
        - id: ch01-b42
          speaker: mr_harry
          text: >-
            它那时年纪小，又容易管教，我想不出有什么理由不早点训练。任由小马一直长大，最后等到非用严厉手段才能制服，我觉得太残忍。当然，我没有让它干多少活。小马就和男孩一样，男孩不能去干成年人的重活。不过，它每天都要活动，我也一点点教它拉轻便小车。
        - id: ch01-b43
          speaker: mr_harry
          text: >-
            我常弄出各种声音，让它熟悉那些不寻常的响动。父亲给我讲过不少驯马大师雷利的事，也给了我许多启发。一次，他在波士顿看雷利带着一匹胆小的马上台，要让它习惯巨响。台上先吹号角，再换声音更大的乐器，一件接一件，最后整支铜管乐队一齐奏响。雷利一直安抚那匹马，它始终没有害怕。
        - id: ch01-b44
          speaker: miss_laura
          text: >-
            哈里，所有动物里，你最喜欢马吧？
        - id: ch01-b45
          speaker: mr_harry
          text: >-
            我想是的，不过我也很喜欢你的那条狗。只是说到底，我对马大概还是比对狗懂得更多。你有没有常常留意小淘气？
        - id: ch01-b46
          speaker: miss_laura
          text: >-
            当然，我经常看它。它真是个有趣的小家伙。
        - id: ch01-b47
          speaker: mr_harry
          text: >-
            除了疾蹄，就数小淘气最有意思。父亲从一个管不了它的人手里买来它，那时它的坏毛病多得数不清。父亲一项项替它改，倒从中得到了十足的乐趣。如今在我们养的牲口当中，它是父亲最宠爱的一个。马比别的动物更容易养成习惯，只要做过一次，以后就总想照样做。
        - id: ch01-b48
          speaker: mr_harry
          text: >-
            小淘气刚来时，谁给它喂燕麦，它就一定咬谁。父亲便在腋下夹根小棍，它每次咬人，就在它鼻子上敲一下。没过多久，它便厌烦了这种事，终于不再咬人。现在它偶尔还会朝父亲张嘴，装作要咬下去，接着却先看看他的腋下，瞧那根小棍到底在不在。
        - id: ch01-b49
          speaker: mr_harry
          text: >-
            它还有个严重的毛病。我们卸马具时，只要解开一条挽带，它就立刻往马厩冲。有一次，它把父亲拖倒了。另一次，它拉着双轮小车，把一根车辕直直戳穿谷仓门。父亲下次牵它回来，早就做好了准备。他把缰绳缠在手上。它刚要猛冲，父亲便使劲一扯，让它一下坐回后腿上，同时大喊一声“吁”。这就把它治好了。从那以后，没有命令，它再也不敢起步。如今卸马具时，它还常把头往后仰。父亲只管教过一次，它却一直记得。
        - id: ch01-b50
          speaker: mr_harry
          text: >-
            要是小淘气从小就由我们训练，它一定会是匹完全不同的马。小马长大后究竟凶恶还是温顺，差不多全看小时候受了怎样的教养。有人要是动手打疾蹄，它根本不会明白这是什么意思。它和小淘气从小受到的教养完全不一样。
        - id: ch01-b51
          speaker: mr_harry
          text: >-
            小淘气以前大概遇上了粗暴的驯马人，那个人让它从此不再信任人类。可它从来不咬别的动物，和其他马也十分亲近。它喜爱疾蹄、克利夫和佩瑟，这三匹马正是它最要好的伙伴。
        - id: ch01-b52
          speaker: miss_laura
          text: >-
            我最喜欢坐克利夫和佩瑟拉的车出去。它们那么稳当，又那么听话。叔叔说，那是他所有马里最信得过的两匹。他还给我讲过你们从前那个工人的话。那个人说，这两匹马比大多数“人”懂得还多。
        - id: ch01-b53
          speaker: mr_harry
          text: >-
            那人是老戴维兹。他在我们这里干活时，正追求霍伊特维尔的一个寡妇。差不多每两星期，他就向父亲借一匹马，去那边看她，而且总要待到很晚。回家的路上，他把缰绳系到鞭杆上，自己呼呼睡去。无论那天驾的是克利夫还是佩瑟，都要等马把车稳稳拉进谷仓前的院子，他才会醒过来。
        - id: ch01-b54
          speaker: mr_harry
          text: >-
            路上遇到车辆，它们会自己避让，经过行人也知道稍稍转开。戴维兹要是醒着，光听步子就知道它们遇见了什么。经过行人，它们很快走过。碰到马车，它们会慢下来，也让得更远。不过，父亲大概讲过这件事。他肚子里全是马的故事，我也快赶上他了。哪天我们把你说烦了，你一定得喊停。
        - id: ch01-b55
          speaker: miss_laura
          text: >-
            你们才不会让我厌烦，我最爱谈动物。克利夫和佩瑟最有趣的故事，是叔叔昨晚讲的那个。当时你好像不在。他说的是偷燕麦。
        - id: ch01-b56
          speaker: mr_harry
          text: >-
            克利夫和佩瑟从不偷东西。你说的不是小淘气吗？它才是小偷。
        - id: ch01-b57
          speaker: miss_laura
          text: >-
            不，偷东西的是佩瑟。叔叔说，它从自己的马栏里跑出来，在外面发现了两袋燕麦，就用牙叼起一袋，放到克利夫面前，自己吃另一袋。叔叔看见它还把一袋燕麦送到伙伴面前，觉得实在有趣，便饶有兴味地站在那里看着，任它们痛痛快快吃了好久。
        - id: ch01-b58
          speaker: mr_harry
          text: >-
            这可真聪明，父亲准忘了告诉我。打我记事起，它们俩就一直相伴。我相信真把它们分开，它们会因为思念对方而日渐消瘦，最后死去。你也看见了，马厩里各个马栏的隔板都很低。父亲说，人不会把一群人分别关进同一间屋里的小隔间，叫他们彼此看不见。马也和我们一样喜欢有伴。克利夫和佩瑟总爱用鼻子碰碰对方。
        - id: ch01-b59
          speaker: mr_harry
          text: >-
            马的记性很长。父亲曾和一些马分开整整二十年，再见面时，它们还是一眼认出了他。说到马的记性，我又想起一个关于佩瑟的好故事，还是昨天才第一次听说。这件事，我只会告诉你和母亲。父亲从来不肯写信提它，因为事情只要牵涉到别人的名声，他就绝不会在纸上写下一个字。
