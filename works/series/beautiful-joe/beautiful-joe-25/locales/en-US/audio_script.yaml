audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    miss_laura:
      display_name: Miss Laura
      tts:
        delivery: gentle and quietly confident
        timbre: warm and clear
        pace: measured
        pitch: medium
    mr_harry:
      display_name: Mr. Harry
      tts:
        delivery: friendly and earnest
        timbre: clear and youthful
        pace: easy
        pitch: medium
  chapters:
    - id: ch01
      title: A HAPPY HORSE
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            For quite a while after I came to Dingley Farm, I kept away from the horses. I was afraid they might mistake me for a bad dog like Bruno and kick me. But their faces were so gentle, and they always looked at me so kindly, that little by little I stopped being afraid.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            My favorite was Mr. Harry's colt, Fleetfoot. One afternoon, Mr. Harry and Miss Laura went out to see him, and I followed. Fleetfoot was rolling back and forth on the grass beneath a tree. The moment he saw Mr. Harry, he gave a sharp whinny, ran over, and began searching his pockets with his nose.
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            Hold on a moment. First I want you to meet this young lady, Miss Laura Morris. Now give her a bow.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Mr. Harry held Fleetfoot by the forelock and gave him a sign. At once, the colt pawed the ground and shook his head. Mr. Harry laughed.
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            And this is her dog, Joe. I want you to be friends with him too. Come over here, Joe.
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            I knew Mr. Harry would keep Fleetfoot from hurting me, so I wasn't frightened. I stood before him and got my first good look. They called him a colt, though he was already full-grown and had been put to work. His coat was dark chestnut. His body was beautifully shaped, and his head was long and handsome. But his large, deep brown eyes were finer than any eyes I had ever seen in a person or an animal. He turned them on me with such a human look.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Fleetfoot looked me over almost as a person would. His eyes seemed to ask whether I was kind, or whether I would chase him and snap at his heels like Bruno until he wanted to kick me. I gazed back at him, wagged my whole body, and rose toward him on my hind legs. He lowered his nose and sniffed me. That was how we became friends. And what good friends we were. After Jim and Billy, there was no one I loved more than Fleetfoot.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            Mr. Harry took some lumps of sugar from his pocket. He told Miss Laura to lay them on her open palm and hold her hand out flat. Fleetfoot ate the sugar while watching her with his quiet, thoughtful eyes.
        - id: ch01-b09
          speaker: miss_laura
          text: He looks so wise!
        - id: ch01-b10
          speaker: mr_harry
          text: >-
            He acts more like an old horse. If he hears a sudden sound, he stops and looks around until he understands what caused it.
        - id: ch01-b11
          speaker: miss_laura
          text: Someone has trained him very well.
        - id: ch01-b12
          speaker: mr_harry
          text: >-
            I've raised him carefully. To tell the truth, I've treated him more like a dog than a colt. He follows me around the farm, sniffs everything I touch, and always seems to be wondering why I'm doing it.
        - id: ch01-b13
          speaker: miss_laura
          text: >-
            Your mother told me she found the two of you asleep on the lawn last summer, with Fleetfoot's head resting on your arm.
        - id: ch01-b14
          speaker: beautiful_joe
          text: Mr. Harry smiled and put his arm around Fleetfoot's neck.
        - id: ch01-b15
          speaker: mr_harry
          text: >-
            We've always been comrades, haven't we, Fleetfoot? Sometimes I'm almost embarrassed by how devoted he is. He's followed me all the way to the village, and he always wants to come fishing. He is four now, so he ought to be leaving those coltish habits behind. I've driven him quite a bit. We're taking the buggy out this afternoon. Would you like to come?
        - id: ch01-b16
          speaker: miss_laura
          text: Where are you going?
        - id: ch01-b17
          speaker: mr_harry
          text: >-
            Only a short way beyond the river. I have to collect some money for Father, and we'll be back well before tea.
        - id: ch01-b18
          speaker: miss_laura
          text: I'd like that. I'll run to the house and change my hat.
        - id: ch01-b19
          speaker: mr_harry
          text: Come along, Fleetfoot.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            Mr. Harry led us out of the pasture, with Fleetfoot and me following him. I waited near the veranda. Before long, Mr. Harry drove up to the front door. The buggy was black and gleaming, and Fleetfoot looked splendid in a harness trimmed with silver. He gently swished his long tail at the flies and turned his head to see who would climb into the buggy.
        - id: ch01-b21
          speaker: beautiful_joe
          text: >-
            As soon as Miss Laura and Mr. Harry were seated, Fleetfoot was eager to start. Mr. Harry gave the word, and off he went. I raced beside him down the lane, delighted that this beautiful horse was my friend. He liked having me there. Every few moments, he dipped his head toward me. Animals can tell each other things without a word. One little toss of Fleetfoot's head told me he wanted to race.
        - id: ch01-b22
          speaker: beautiful_joe
          text: >-
            His stride was smooth and fast, and Mr. Harry kept asking him to slow down.
        - id: ch01-b23
          speaker: miss_laura
          text: You don't want him going too fast, do you?
        - id: ch01-b24
          speaker: mr_harry
          text: >-
            No. We could probably turn him into a racer, but Father and I have no interest in fast horses. People make far too much of trotters and racehorses. Some farmers around here have become wild about breeding for speed, all because a country farmer discovered that his ordinary cart horse could run fast and last a long time. He sold it to a dealer for a great deal of money, and that set everyone else dreaming of doing the same.
        - id: ch01-b25
          speaker: mr_harry
          text: >-
            If people who devote all their time to racing can't always breed fast horses, I don't know why farmers think they can. And a speedy horse can be the ruin of boys on a farm. It tempts them into racing and betting instead of doing their work. Father would rather offer a prize for the fastest walking horse bred in New Hampshire. Even our heavy Dutchman walks fairly well. Cleve and Pacer can each cover four and a half miles in an hour at a walk.
        - id: ch01-b26
          speaker: miss_laura
          text: Why does a fast walk matter so much?
        - id: ch01-b27
          speaker: mr_harry
          text: >-
            Because nearly all farm work has to be done at a walk. Horses walk while plowing, hauling loads, carrying produce to market, and climbing or descending hills. A quick walk is useful in cities too. Trotting over hard pavement is terrible for the big workhorses. Let them walk briskly, and their legs stay strong much longer.
        - id: ch01-b28
          speaker: mr_harry
          text: >-
            It is shameful how quickly cities wear horses out. Our roads are so bad that a cab horse may last only three years. London and Paris get five years from theirs. Our new country is ahead of Europe in many ways, but not in that one. I've seen horses in New York fall dead from overwork.
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            Still, better days are coming for them. As electricity develops, it will change many things. Just last year, electric power took the place of horses on roads in several places. About thirty thousand horses were freed from those dreadful horse cars. Well, Fleetfoot, are you ready for another run? All right, boy. Go on!
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            We flew down another stretch of level road. Fleetfoot wore no check-rein on his beautiful neck, so he could hold his head in a comfortable, natural way as he trotted. With those wonderful eyes, his flowing mane and tail, and his shining reddish-brown coat, he was the handsomest horse I had ever seen.
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            Fleetfoot loved speed. When Mr. Harry told him to slow down, he tossed his head impatiently, but his sweet nature would not let him disobey. In all the years I knew him, I never once saw him refuse an order from his master.
        - id: ch01-b32
          speaker: miss_laura
          text: Harry, did you forget your whip?
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            The buggy was moving slowly again, and I ran beside it, panting with my tongue out.
        - id: ch01-b34
          speaker: mr_harry
          text: >-
            I never carry one. If I ever saw a man strike Fleetfoot with a whip, I would knock him down.
          emotion: angry
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            His voice turned so stern that I looked up at him. He wore the same expression he had worn when he knocked Jenkins down and beat him.
        - id: ch01-b36
          speaker: miss_laura
          text: >-
            I'm very glad you don't whip him. You are like the Russians who guide their horses with their voices and call them lovely names. But some horses do need a whip, don't they, Cousin Harry?
        - id: ch01-b37
          speaker: mr_harry
          text: >-
            Yes, Laura. Some vicious horses can't be controlled any other way. And with many horses, you need to have a whip in case nothing else will make them move forward.
        - id: ch01-b38
          speaker: miss_laura
          text: Fleetfoot never refuses to move, does he?
        - id: ch01-b39
          speaker: mr_harry
          text: >-
            Never. Dutchman does sometimes, and we have two good ways of starting him. First, we lift one front foot and tap his shoe two or three times with a stone. That interests him so much that he usually moves. If it doesn't, we loop a line around his front legs at the knees, stand ahead of him, and pull. Father won't allow the men to use a whip unless they have no other choice.
        - id: ch01-b40
          speaker: miss_laura
          text: >-
            Fleetfoot has had such a happy life. How did you make him love you so much, Harry?
        - id: ch01-b41
          speaker: mr_harry
          text: >-
            I trained him in my own way. Father gave him to me. The first time I saw him standing, I went up slowly and laid my hand on him. His mother was nervous around me because she had not been with us long. Her fear made Fleetfoot nervous too, so I left him alone after a moment. The next time, I stroked him. The time after that, I put an arm around him. Before long, he behaved like a big dog.
        - id: ch01-b42
          speaker: mr_harry
          text: >-
            I could lead him around by a strap, and I made him a little halter and bridle. I saw no reason not to teach him while he was young and easy to handle. Letting a colt grow up untouched until you have to master him harshly is cruel.
        - id: ch01-b43
          speaker: mr_harry
          text: >-
            Of course, I never gave him heavy work. A colt is like a boy. A boy shouldn't have to do a man's work. But Fleetfoot exercised every day, and I taught him to pull a light cart. I also introduced him to all sorts of strange sounds.
        - id: ch01-b44
          speaker: mr_harry
          text: >-
            Father often told me about Rarey, the great horse trainer, and that gave me ideas. Once in Boston, Father saw Rarey bring a timid horse onto a stage to teach it not to fear loud noises. Someone blew a bugle first. Then came a louder instrument, and they kept adding more until a whole brass band was playing. All the while, Rarey reassured the horse, and it learned there was no need to be afraid.
        - id: ch01-b45
          speaker: miss_laura
          text: You like horses more than any other animal, don't you, Harry?
        - id: ch01-b46
          speaker: mr_harry
          text: >-
            I think I do, though I am very fond of your dog. I simply know more about horses than dogs. Have you paid much attention to Scamp?
        - id: ch01-b47
          speaker: miss_laura
          text: Oh, yes. I often watch her. She is such a funny little creature.
        - id: ch01-b48
          speaker: mr_harry
          text: >-
            After Fleetfoot, she's the most interesting horse we have. Father bought her from a man who couldn't control her, and she arrived with more bad habits than you could count. Father has taken real pleasure in finding a different way to cure each one. All that patient work has made her his favorite among our animals.
        - id: ch01-b49
          speaker: mr_harry
          text: >-
            Horses depend on habit more than almost any other animal. Once they do something, they tend to do it again. Scamp used to bite every person who brought her oats, and she never missed a chance. Father began carrying a small stick under his arm, and whenever she tried to bite, he tapped her nose. She soon tired of biting and gave up the habit. Even now, she sometimes starts to snap at Father, then checks under his arm to see whether the stick is there.
        - id: ch01-b50
          speaker: mr_harry
          text: >-
            He used a different cure for another dangerous trick. The moment someone unfastened one trace while unharnessing her, Scamp would bolt toward the stable. Once she dragged Father over. Another time, the shaft of the sulky went straight through the barn door.
        - id: ch01-b51
          speaker: mr_harry
          text: >-
            The next time Father brought her in, he was ready. He wrapped the reins around his hands. The instant she tried to rush away, he jerked her back onto her haunches and shouted, “Whoa!” He only had to do it once. She has never started during unharnessing without his word again, though she still throws her head back as if she remembers that lesson.
        - id: ch01-b52
          speaker: mr_harry
          text: >-
            Scamp would be a very different horse if we had raised her. Whether a colt grows vicious or gentle depends mostly on how it is brought up. If anyone struck Fleetfoot, he wouldn't even understand what the blow meant. His life has been nothing like Scamp's.
        - id: ch01-b53
          speaker: miss_laura
          text: >-
            I expect some cruel man trained her and taught her not to trust people. She never bites another animal, and she seems fond of all the horses. Fleetfoot, Cleve, and Pacer are the three she loves best.
        - id: ch01-b54
          speaker: miss_laura
          text: >-
            I love driving with Cleve and Pacer. They are so steady and good. Uncle says they are his most dependable horses. He once had a man who claimed those two knew more than most human beings.
        - id: ch01-b55
          speaker: mr_harry
          text: >-
            That was old Davids. While he worked for us, he was courting a widow who lived over in Hoytville. About every two weeks, he asked Father for one of the horses so he could go and see her. He always stayed rather late. On the way home, he tied the reins to the whip handle, fell asleep, and didn't wake until Cleve or Pacer stopped in the barnyard.
        - id: ch01-b56
          speaker: mr_harry
          text: >-
            Either horse could meet any carriage on the road safely and turn aside for a person on foot. When Davids stayed awake, he could tell from the horse's step what they were passing. Cleve or Pacer would go by a lone person quickly. For a team, the horse slowed down and moved much farther to the side of the road. Father has probably told you that one already. He has a great store of horse stories, and I am nearly as bad. You'll have to call a halt when we begin to bore you.
        - id: ch01-b57
          speaker: miss_laura
          text: >-
            You never bore me. I love talking about animals. My favorite story about Cleve and Pacer is the one Uncle told me last night, when you weren't there. It was about stealing oats.
        - id: ch01-b58
          speaker: mr_harry
          text: >-
            Cleve and Pacer don't steal. Are you sure he didn't mean Scamp? She is the thief.
        - id: ch01-b59
          speaker: miss_laura
          text: >-
            No, Pacer did it. Uncle said he escaped from his stall and found two bags of oats. He picked up one bag in his teeth and dropped it in front of Cleve, then kept the other for himself. Uncle found it so amusing that he stood watching and let them eat for a long time.
        - id: ch01-b60
          speaker: mr_harry
          text: >-
            That was clever. Father must have forgotten to tell me. Those two have been companions for as long as I can remember. I truly believe they would grieve, waste away, and die if anyone separated them.
        - id: ch01-b61
          speaker: mr_harry
          text: >-
            You have seen how low the walls are between the stalls in our stable. Father says we wouldn't shut a roomful of people in separate boxes where they couldn't see one another, and horses need company just as much as we do. Cleve and Pacer are forever touching noses across the low partition.
        - id: ch01-b62
          speaker: mr_harry
          text: >-
            Horses remember for a very long time. Father has been recognized by horses after twenty years apart. And that reminds me of another wonderful story about Pacer. I only heard it yesterday, and I wouldn't tell it to anyone except you and Mother. Father refused to write it to me because he will never put anything on paper that might harm another person's reputation.
