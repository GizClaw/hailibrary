  chapters:
    - id: ch01
      title: THE END OF THE ENGLISHMAN
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            After a few days of Mr. Harry's constant care, the horse and cow could walk again. They made a sad little procession into the yard at Dingley Farm. First came the hollow-eyed horse, then the lean cow, and then the funny, skinny little pig. All three staggered and shook as they went. Their diseased hoofs had partly rotted away, so they could not walk straight. Penhollow was only a mile or two from the farm, but the journey wore them out. As soon as they reached their comfortable beds, they dropped down exhausted.
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            Miss Laura could hardly contain her joy that every one of them had survived. Her eyes shone, and she went from one animal to the next with a bright, happy face. Mr. Harry had named the odd little pig Daddy Longlegs. Someone had washed him, and now he lay on a heap of straw in the corner of his tidy pen. He looked from his clean trough to all the food before him with the air of a prince.
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            Here he would stay clean and dry. At Penhollow, he had known nothing but damp and dirt, with trees hanging over his pen and his small feet buried in filth and dead leaves. The happy little fellow blinked his ugly eyes until they seemed to shine with gratitude. He knew Miss Laura and Mr. Harry just as well as I did.
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Daddy's tiny tail curled so tightly that it nearly made a knot. Mr. Wood said that showed the pig was healthy and happy. At Penhollow, he had seen that same tail hanging as limp and loose as a rat's. Now he leaned over the pen beside Miss Laura and talked with her about pigs.
        - id: ch01-b05
          speaker: mr_wood
          text: >-
            Pigs aren't nearly as stupid as some people think. I've owned pigs as clever as dogs. Once I sold a little black pig to a man far back in the country. That pig found his way home through the woods, across the river, and over every hill and valley. Mind you, he'd been taken away with a bag over his head. I kept him after that. A pig who knew so much deserved to stay.
        - id: ch01-b06
          speaker: mr_wood
          text: >-
            The cleverest pigs I ever saw were in Canada. I was traveling on a sailing ship, and we anchored in a long, narrow harbor. The incoming tide there had a front four or five feet high. They called it the bore. A village stood across from our ship. Every day at low tide, some pigs came down to hunt for shellfish. They sometimes wandered half a mile over the mud flats. But a few minutes before the tide rushed in, they always turned and hurried back to shore. Their instincts warned them that staying any longer would mean drowning.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Mr. Wood kept several pigs of his own, and before long Daddy joined them. He had a fine time making friends with all the other little grunters. They often went out into the pasture or orchard. I could always pick Daddy out from the rest because he was the smartest one there.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            Though his early life had been miserable, Daddy quickly learned to care for himself at Dingley Farm. Whenever a storm was coming, he rushed around in great excitement with small bundles of straw in his mouth, making himself a bed. He was a white pig, and the Woods always kept him very clean.
        - id: ch01-b09
          speaker: mr_wood
          text: >-
            Keeping pigs filthy is wrong. They like cleanliness as much as other animals do. And if people kept them clean, human beings wouldn't catch so many diseases from eating their flesh.
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            The cow was different. For the rest of her life at Dingley Farm, a strange sadness remained in her eyes. People say animals forget the unhappiness in their past. Perhaps some do. I know I never forgot my one miserable year with Jenkins. It made me a sober, thoughtful dog instead of a playful one like dogs who have never been truly unhappy.
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            It always seemed to me that the Englishman's cow was remembering her poor dead calf, which her cruel master had allowed to starve. She recovered and went about with the other cows, looking almost as contented as they were. Still, when she stood chewing her cud and gazing into the distance, I could see something in her face that was missing from the faces of cows who had always been happy at Dingley Farm.
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            Even the farmhands began calling her Old Melancholy, and soon everyone knew her by that name, or simply Mel. While she was recovering, she stayed in the cow stable. Mr. Wood's cows spent their nights there on raised beds of earth covered with straw. Mel wore a Dutch halter that let her lie down and sleep whenever she wished. Once she was well, she joined the other cows in the pasture.
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            They named the horse Scrub. No matter what anyone did for him, he would always be a broken-down, plain-looking animal. His stall stood beside Fleetfoot's, with a low partition between them so the horses could look at each other. After a long course of treatment, Scrub's hoofs grew clean and sound, and he became able to do some work.
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            Miss Laura made a great pet of him. She often carried apples out to the stable. Fleetfoot would lift his beautiful head and stare at her reproachfully over the partition. She always spent more time with Scrub, and Scrub always received the larger part of every treat.
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            Poor old Scrub! I believe he loved Miss Laura. He was not a clever horse, and he behaved as though he could hardly see. He ran his nose up and down the front of her dress, nipped at her buttons, and was perfectly happy whenever he caught a piece of her watch chain between his strong teeth. Out in the field, he never seemed to recognize her until she stood right beneath his pale eyes. Then he showed how delighted he was to see her.
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            He was not blind. Mr. Wood was certain of that. He thought Scrub had probably never been a very bright horse, and cruel treatment had made him duller still.
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            The master who had treated these animals so badly came to a terrible and very strange end, though no one learned what had happened for a long while. Mr. Wood and Mr. Harry were furious with the Englishman. They meant to do everything they could to have him punished, or at least to let people know what a villain he was.
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            They sent the paper bearing the crest to Boston. People there wrote to England and discovered that the crest belonged to a noble and highly respected family headed by an earl. The family members were honorable, all except one. He was the late earl's nephew, not his son, and the black sheep of the family.
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            As a young man, that nephew had lived wildly and wickedly. At last he forged a friend's name and had to flee England for America. The description convinced Mr. Wood that the man was Mr. Barron. So he wrote to the English family and told them how their relative had left his animals to starve.
        - id: ch01-b20
          speaker: beautiful_joe
          text: >-
            Their answer arrived before long. It was proud, but touching, too. Mr. Barron's cousin wrote that he knew his relative had evil habits, yet nothing seemed able to reform him. The family sent Barron an allowance every three months on the condition that he live quietly in some out-of-the-way place. But his latest payment was waiting unclaimed in Boston. They believed he might be dead and asked whether Mr. Wood knew anything about him.
        - id: ch01-b21
          speaker: beautiful_joe
          text: Mr. Wood looked very thoughtful after reading the letter.
        - id: ch01-b22
          speaker: mr_wood
          text: Harry, how long ago did Barron run away?
        - id: ch01-b23
          speaker: mr_harry
          text: About eight weeks ago.
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            That's odd. The money his English family sent would have reached Boston only a few days after he left. Barron isn't the sort of man who would leave money waiting there. Something must have happened. Where do you think he went when he left Penhollow?
        - id: ch01-b25
          speaker: mr_harry
          text: I couldn't say, sir.
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            And how did he travel? He couldn't have left from Riverdale Station. One of his creditors would have recognized him there.
        - id: ch01-b27
          speaker: mr_harry
          text: He may have gone through the woods to the Junction.
        - id: ch01-b28
          speaker: beautiful_joe
          text: Mr. Wood slapped his knee.
        - id: ch01-b29
          speaker: mr_wood
          text: >-
            That's exactly what he would do. I'm driving over tomorrow to see Thompson, so I'll ask around.
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            The next evening, when his father came home, Mr. Harry asked whether he had learned anything.
        - id: ch01-b31
          speaker: mr_wood
          text: >-
            Only this. No one matching Barron's description has left Riverdale Junction in the past year. He must have used another station. We may as well let him go. The Lord watches over fellows like that.
        - id: ch01-b32
          speaker: mr_harry
          text: If he ever comes back to Riverdale, we'll watch for him.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            By then, everyone in the village and throughout the countryside knew the cowardly thing the Englishman had done. If he had dared to return, the people would have treated him roughly. But months went by, and no one heard a word about him.
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            Late that autumn, after Miss Laura and I had returned to Fairport, Mrs. Wood wrote and told her how the Englishman's story had ended. Some Riverdale boys had been searching the woods for lost cattle. Their wandering brought them to an old stone quarry that no one had used for years. On one side, a smooth wall of rock dropped many feet. On the other, the earth and stone had broken away, making it easy to enter.
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            Somehow, one of the boys' cows had fallen over the quarry's steep side into the deep pit. The poor creature was dead, of course. Out of curiosity, the boys decided to climb down and look at her. They scrambled to the bottom and found the cow. Then, nearby, they saw something that filled them with horror and amazement. It was the skeleton of a man. Beside it lay a heavy walking stick they recognized as the Englishman's.
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            Mr. Barron was a drinking man. Perhaps he had swallowed something that morning because he thought it would strengthen him for his walk. Instead, it may have confused him, made him lose his way, and sent him over the quarry wall. Or perhaps he had set out before daybreak and slipped on the steep rock in the darkness.
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            One of his legs was folded beneath him. If the fall did not kill him at once, it must have injured him so badly that he could not move. No one would hear his calls for help in that lonely place. He may have died the terrible death of starvation, the very death he had meant for his suffering animals.
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            Mrs. Wood said that no sermon ever preached in Riverdale affected the people as deeply as this wicked man's death. It reminded her of a verse from the Bible. He made a pit, dug it, and fell into the ditch he had made.
        - id: ch01-b39
          speaker: beautiful_joe
          text: >-
            Her letter said that Mr. Wood had told Mr. Barron's English relatives about the body. Their reply made it seem that they were relieved to know he was dead. They thanked Mr. Wood for speaking plainly about Barron's wrongdoing. From everything they knew of his earlier conduct, they believed his influence would bring evil, not good, wherever he lived.
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            The family arranged for Barron's unclaimed money in Boston to be sent to Mr. Wood. They asked him to spend it in whatever way he thought would best undo some of the harm their relative had caused in Riverdale.
        - id: ch01-b41
          speaker: beautiful_joe
          text: >-
            When the money arrived, it came to several hundred dollars. Mr. Wood would not keep or manage it. He turned it over to the Band of Mercy. They created what they called the Barron Fund and used it whenever they needed money to buy and distribute writings about treating animals humanely.
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            Mrs. Wood said people were continuing to add money to the fund. The children sent leaflets and little books all over the State, spreading the message of kindness toward God's lower creatures. A stranger might pick up one of those publications and see the wicked Englishman's name printed on the title page. That stranger would think Barron had been a friend and benefactor to Riverdale, the very opposite of what he had taken pride in being.
