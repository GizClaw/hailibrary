audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十八章　那个英国人的结局
      blocks:
        - id: ch01-b01
          speaker: beautiful_joe
          text: >-
            过了几天，在哈里先生的细心照料下，那匹马和母牛终于能走路了。它们来到丁格利农庄时，真是一支叫人心酸的队伍。马的眼窝深深陷着，母牛瘦得只剩骨头，那头滑稽的小猪也又小又瘦。它们的蹄子病了，有些地方已经腐烂，每一步都走得摇摇晃晃。彭霍洛离农庄不过一两英里，它们却累得一点力气也没有，一挨到铺好的卧床，就倒了下去。
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            劳拉小姐见它们全都活了下来，欢喜得简直不知道该怎么办。她眼睛亮晶晶的，满脸笑容地从这个身边走到那个身边。小猪已经洗干净了，哈里先生给它起名叫“长腿爸爸”。它躺在整洁猪圈一角的草堆上，看看干净的食槽，再看看满满的食物，活像一位王子。过去在彭霍洛，它头顶总垂着树枝，脚下全是泥水和烂叶。如今它终于能住在干净干燥的地方了。它那双不大好看的眼睛不住眨动，透着感激。它认得劳拉小姐和哈里先生，就像认得我一样。
        - id: ch01-b03
          speaker: beautiful_joe
          text: >-
            它的小尾巴卷得特别紧，几乎打成了结。伍德先生说，这正是健康又快活的样子。在彭霍洛时，他见过长腿爸爸的尾巴，那时软软垂着，像一条老鼠尾巴。他和劳拉小姐靠在猪圈边看它，也谈起猪到底有多聪明。
        - id: ch01-b04
          speaker: mr_wood
          text: >-
            猪可不像有些人想的那么笨。我养过的猪，有些跟狗一样聪明。以前我把一头小黑猪卖到乡下很远的地方。送去的时候，它脑袋上还套着袋子，可它照样穿过树林，渡过河，又翻山越岭地找回了家。它这么有本事，我当然把它留下了。
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            伍德先生说，他见过最机灵的是加拿大的猪。有一回，他坐帆船旅行，船停在加拿大一座狭长的港湾里。那里涨潮时，前面会立起四五英尺高的水墙，叫作“涌潮”。船停泊处的对岸有个村子。村里的猪每天趁退潮到滩上找贝，有时会在泥滩上走到半英里外。可潮水冲来前几分钟，它们准会转身跑回岸边。本能知道，再不走就要淹死了。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            后来，长腿爸爸住进了伍德先生的猪群，很快就和那些哼哼叫的小伙伴混熟了。猪群放进牧场或果园时，我总能马上认出它，因为数它最伶俐。它从小过得那么苦，到了农庄，却很快学会照顾自己。暴风雨快来时，它会急急忙忙地跑来跑去，嘴里一趟趟衔着稻草，为自己铺一张床。那样子看着真有趣。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            长腿爸爸是一头白猪，人们一直把它养得很干净。伍德先生说，猪也和其他动物一样爱清洁，不该让它们待在污秽里。要是人们把猪养得干净些，吃猪肉染上的疾病也会少些。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            那头母牛却一直没有摆脱眼里的哀愁。只要它还住在丁格利农庄，那哀愁就在。我听人说，动物会忘掉从前的不幸，也许有的确实会忘。可是，我从来没有忘记在詹金斯手下度过的那一年。从那以后，我就成了一条严肃、爱思量的狗，不像那些从没真正受过苦的狗那么贪玩。
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            我总觉得，那头母牛还在想着被残忍主人饿死的小牛。它自己康复了，能和别的牛一同来去，看上去也一样快活。可我常看见它站着反刍，久久望向远处。那时，它的神情总和农庄里从小幸福的牛不一样。就连工人们也叫它“老忧郁”，后来大家都这样称呼它，或者干脆叫它“忧郁”。
        - id: ch01-b10
          speaker: beautiful_joe
          text: >-
            它还没养好身体时，夜里住在牛棚，和伍德先生的牛一样站在铺着稻草的高土台上。它被荷兰式笼头拴着，却仍能在想睡时自己卧下。等它完全康复，人们才把它放进牧场，和其他牛一起生活。
        - id: ch01-b11
          speaker: beautiful_joe
          text: >-
            那匹马叫“老破马”。不管怎样照料，它也只能是一匹衰弱又不起眼的马。它住在马厩里疾蹄旁边的隔栏，两边的隔板很矮，它们可以越过隔板互相看。经过很久的医治，老破马的蹄子终于干净结实，也能做一点活了。
        - id: ch01-b12
          speaker: beautiful_joe
          text: >-
            劳拉小姐格外宠它，常带着苹果去马厩。疾蹄会高高抬起漂亮的头，隔着栏板委屈地看她。因为她陪老破马的时间总是更长，带来的每一样好东西，也总给老破马更大的一份。
        - id: ch01-b13
          speaker: beautiful_joe
          text: >-
            可怜的老破马，我想它一定很爱劳拉小姐。它有点愚钝，做什么都像看不见。它会拿鼻子在她衣襟上拱来拱去，轻轻咬她的纽扣。要是能把一小截表链含进牙齿里，它就高兴极了。它在田野里时，劳拉小姐非得走到那双淡色眼睛跟前，它才认出她。等认出来，又欢喜得不得了。
        - id: ch01-b14
          speaker: beautiful_joe
          text: >-
            其实它并不瞎，伍德先生也说它看得见。它大概生来就不算机灵，后来又一直受虐待，才变得越来越迟钝。
        - id: ch01-b15
          speaker: beautiful_joe
          text: >-
            至于这些动物的主人，那个英国人后来遇上了一件离奇的事。他的结局很可怕，可很长一段时间里，谁也不知道他去了哪里。伍德先生和哈里先生恨透了他。他们说，一定要想尽办法叫他受罚，至少也得让别人都知道他是个恶棍。
        - id: ch01-b16
          speaker: beautiful_joe
          text: >-
            他们把印着纹章的那张纸送到波士顿。那里的人写信到英国查问，原来纹章属于一个高贵而受人敬重的家族，家族首领是一位伯爵。这家人都很正直，只有一个人例外。他是已故伯爵的侄子，并不是伯爵的儿子，也是全家唯一的败类。年轻时，他过着放荡邪恶的生活，最后还伪造一位朋友的签名，只好逃出英国，躲到美国。
        - id: ch01-b17
          speaker: beautiful_joe
          text: >-
            伍德先生一看对方描述的相貌，就知道那个人正是巴伦。他写信告诉巴伦在英国的亲属，这人丢下动物，任它们活活挨饿。不久，对方回了信。写信的是巴伦的一位堂兄，那封信既骄傲，又叫人感动。他坦率地承认，这位亲属恶习缠身，看来怎么也改不好。家里只能按季度给他生活费，条件是让他找个僻静地方安分过日子。
        - id: ch01-b18
          speaker: beautiful_joe
          text: >-
            可最近寄去的那笔钱，一直留在波士顿无人领取。他们因此猜想巴伦可能已经死了，便问伍德先生能不能告诉他们一点他的下落。伍德先生读完信，沉思了一阵。
        - id: ch01-b19
          speaker: mr_wood
          text: 哈里，巴伦逃走有多久了？
        - id: ch01-b20
          speaker: mr_harry
          text: 大约八个星期。
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            这可怪了。他离开几天以后，那家英国人寄的钱就该到波士顿了。他绝不会把钱留在那里，一直不去拿。他一定遇上了什么事。你觉得，他离开彭霍洛会去哪儿？
        - id: ch01-b22
          speaker: mr_harry
          text: 我一点也猜不出来，先生。
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            那他会怎么走？他肯定没从里弗代尔车站上车，不然哪个债主准会认出他。
        - id: ch01-b24
          speaker: mr_harry
          text: 也许他会穿过树林，走到枢纽站。
        - id: ch01-b25
          speaker: beautiful_joe
          text: 伍德先生一听，拍了拍膝盖。
        - id: ch01-b26
          speaker: mr_wood
          text: >-
            对，他一定会这么走。我明天正好要驾车去那边见汤普森，顺便问问。
        - id: ch01-b27
          speaker: beautiful_joe
          text: >-
            第二天晚上，伍德先生回到家，哈里先生问他打听到了什么。伍德先生说，过去整整十二个月，没有一个模样像巴伦的人从里弗代尔枢纽站离开。
        - id: ch01-b28
          speaker: mr_wood
          text: >-
            他准是去了别的车站。算了，随他去吧。上帝自会照看这种家伙。
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            他要是敢回里弗代尔，我们也会好好“照看”他。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            哈里先生说得很平静。这时，整个村子和周围乡下都知道那个英国人做了什么卑劣的事。他若真敢回来，肯定会吃足苦头。
        - id: ch01-b31
          speaker: beautiful_joe
          text: >-
            几个月过去，依旧没有他的消息。到了深秋，劳拉小姐和我已经回到费尔波特。伍德太太写信来，告诉她那个英国人的结局。几个里弗代尔的年轻人为了寻找走失的牛，在树林里四处搜寻，无意间来到一座荒废多年的老采石场。采石场一边是又深又陡的光滑石壁，另一边的泥土和岩石已经崩塌，从那里进去并不难。
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            他们家的一头牛不知怎么从陡峭那边摔进了深坑，当然早已死了。几个年轻人出于好奇，决定下去看看。他们一路攀到坑底，找到了牛，也在不远处看见一具人的骸骨，顿时又惊又怕。骸骨旁放着一根沉重的手杖，他们认得，那正是那个英国人用过的。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            巴伦嗜酒。也许那天早晨出发前，他喝了点什么，本以为这样能给早晨那段路添些力气，谁知反倒神志不清，迷失方向，跌进了采石场。也可能他天还没亮就动身，在黑暗里失足，从陡直的石壁上摔了下去。
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            他的一条腿折叠在身下。就算没有当场摔死，也一定伤得再也动不了。采石场孤零零地藏在那里，他再怎么呼救，也不会有人听见。也许他最终在那荒僻之地死于饥饿。那种可怕的死法，原本正是他想留给那些受苦动物的。
        - id: ch01-b35
          speaker: beautiful_joe
          text: >-
            伍德太太说，里弗代尔从没有哪场布道，像这个恶人的死一样震动人心。她想起《圣经》里的话：“他掘了坑，又挖深了，竟掉在自己所挖的阱里。”伍德先生把发现巴伦尸骨的消息写信告诉了他的英国亲属。那家人回信时，听上去反而松了一口气。他们还感谢伍德先生没有隐瞒，坦率说出了这位亲属的恶行。
        - id: ch01-b36
          speaker: beautiful_joe
          text: >-
            他们感谢伍德先生直说巴伦干过的坏事。他们知道巴伦过去的所作所为，也明白这种人住到哪里，带去的都只会是祸害。于是，他们把留在波士顿的那笔钱寄给伍德先生，请他用在最合适的地方，好抵消这个同姓人在里弗代尔造成的恶果。
        - id: ch01-b37
          speaker: beautiful_joe
          text: >-
            寄来的钱有几百美元。伍德先生不肯经手为自己使用，一分不留地交给了仁慈会。仁慈会设立了“巴伦基金”，每逢需要购买和散发教人善待动物的读物，就从基金里取钱。后来基金还在增加，孩子们把传单和小册子寄到全州各地，向人们传扬仁慈对待上帝所造低等生灵的道理。
        - id: ch01-b38
          speaker: beautiful_joe
          text: >-
            陌生人若在路上捡到一本，看见扉页上印着那个邪恶英国人的名字，一定会以为他是里弗代尔人的朋友和恩人。而这，恰好和他生前最得意的样子完全相反。
