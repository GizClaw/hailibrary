  chapters:
    - id: ch01
      title: THE BOX OF MONEY
      blocks:
        - id: ch01-b01
          speaker: mr_harry
          text: >-
            This story is about Jacobs, one of our hired men last winter. He was sly, with a guilty look about him, and he was very clever at stealing Father's farm produce and selling it without anyone seeing. Father knew exactly what was going on. He was still deciding how best to handle Jacobs when something happened that brought the whole business to a head.
        - id: ch01-b02
          speaker: mr_harry
          text: >-
            Father needed farming tools from Sudbury, so he took Pacer and the cutter. He could go by the Sudbury Road, or take the old Post Road, which was longer and hardly used. That day he chose the Post Road. The snow was not deep, and he wanted to ask after an old man who had been robbed and badly frightened a few days earlier.
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            The poor old fellow was called Miser Jerrold. He lived alone with his daughter and kept his small savings in a box under his bed. As Father came near the house, Pacer's behavior astonished him. The horse had been along that road before, and not long ago. Father understands horses so well that he always looks for the meaning in anything they do.
        - id: ch01-b04
          speaker: mr_harry
          text: >-
            Father loosened the reins a little and watched. With no direction from him, Pacer turned off the road into the lane leading to Jerrold's house. He stopped at the old red gate and waited for Father to get out. Once through the gate, he did not go toward the house. He turned around and stood facing the road, ready to leave.
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            Father said nothing, but he had plenty to think about. Inside, he found the old man hunched over the fire, rubbing his hands and half crying over the few poor dollars that had been stolen. Father had never met him. He knew people considered Jerrold a little simple, and no matter how many questions he asked, he could make nothing of the old man's answers.
        - id: ch01-b06
          speaker: mr_harry
          text: >-
            Jerrold's daughter explained what had happened. They had gone to bed at dark that night. She slept upstairs and her father below. At about ten, she heard him scream. She ran down and found him sitting upright in bed with the window wide open. He said a man had jumped in, shoved the bedclothes into his mouth, dragged the box from beneath the bed, and escaped with it.
        - id: ch01-b07
          speaker: mr_harry
          text: >-
            She ran to the door and looked outside, but no one was there. The night was dark, and a little snow was falling. By morning, there were no footprints to follow. Neighbors began coming in to keep the old man company, so Father continued on to Sudbury and returned home afterward.
        - id: ch01-b08
          speaker: mr_harry
          text: >-
            When Father reached home, Jacobs was hovering nervously around the stable. He said he wanted a word with him.
        - id: ch01-b09
          speaker: mr_morris
          text: Very well, but put the horse away first.
        - id: ch01-b10
          speaker: mr_harry
          text: >-
            Jacobs unharnessed Pacer while Father sat on a stable bench and watched. At last Jacobs lounged over with a straw in his mouth.
        - id: ch01-b11
          speaker: jacobs
          text: I've decided to go out West, sir. I'd like to leave right away.
        - id: ch01-b12
          speaker: mr_harry
          text: >-
            Father said that was all right, but there was an account to settle first. From his pocket he took a paper. On it, as nearly as he could manage, he had listed every quart of oats, every bag of grain, and every bit of market money that Jacobs had cheated him out of.
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            Jacobs changed color again and again. He had believed he had hidden his tracks so neatly that no one would ever discover them.
        - id: ch01-b14
          speaker: mr_morris
          text: Sit down, Jacobs. You and I need to have a long talk.
        - id: ch01-b15
          speaker: mr_harry
          text: >-
            Father kept him there for about an hour. By the end, Jacobs had completely broken down. Father told him a young man could take one of two paths through life, and Jacobs had chosen the wrong one. But he was young and clever. If he turned himself around now, he still had a chance.
        - id: ch01-b16
          speaker: mr_morris
          text: >-
            If you stay on this path, you'll end in State's prison. You can't go on fooling and cheating everyone forever without being caught. Give me your word that you'll try to live honestly, and I'll help you in every way I can.
        - id: ch01-b17
          speaker: mr_harry
          text: >-
            Then Father tore up the paper. He told Jacobs that his debt to him was finished. Jacobs was only about twenty-three, and Father said he sobbed like a baby.
        - id: ch01-b18
          speaker: mr_harry
          text: >-
            Without looking at him, Father began talking about his afternoon drive, almost as if he were speaking to himself. As far as he knew, Pacer had never traveled that road. Yet the horse knew it perfectly. At Jerrold's gate, he had turned around instead of approaching the house. The instant Father stepped back into the cutter, Pacer looked over his shoulder and raced down the lane.
        - id: ch01-b19
          speaker: mr_harry
          text: >-
            Father also happened to mention Monday night, when the robbery took place. Jacobs had borrowed Pacer to drive to the Junction. But when he returned, the horse was steaming, as though he had traveled much farther.
        - id: ch01-b20
          speaker: mr_harry
          text: >-
            When Father finished, Jacobs crumpled onto the stable floor and covered his face with both hands. Father left him there to wrestle with himself and went into the house.
        - id: ch01-b21
          speaker: mr_harry
          text: >-
            The next morning, Jacobs looked just as he usually did. He worked beside the other men and said nothing more about going West. Late that afternoon, a farmer passing by called to Father and asked whether he had heard the news. Sometime in the night, Miser Jerrold's box had been left on his doorstep. He found it there in the morning with every dollar still inside.
        - id: ch01-b22
          speaker: mr_harry
          text: >-
            The old man was shrewd enough not to tell anyone how much money the box held. His neighbors persuaded him to put it in the bank, and he planned to carry it into town the next morning. Until then, some of them would stand guard over it during the night.
        - id: ch01-b23
          speaker: mr_harry
          text: >-
            Father gave the news to the men at milking time. Jacobs looked as innocent as he possibly could. Still, from that day forward, he changed. He never told Father outright that he meant to become honest. His conduct said it for him. The sullen, unwilling worker became helpful and obliging, and Father was truly sorry when the time came to lose him.
        - id: ch01-b24
          speaker: beautiful_joe
          text: Miss Laura had listened to the story with intense interest.
        - id: ch01-b25
          speaker: miss_laura
          text: Where is Jacobs now, Cousin Harry? What happened to him?
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            Mr. Harry laughed so merrily that I stared up at him. Even Fleetfoot turned his head to see what the joke might be. We were climbing a long, steep hill very slowly, and the clear, still air carried every word spoken in the buggy.
        - id: ch01-b27
          speaker: mr_harry
          text: >-
            To my mind, the last part is the best. It's as romantic as any girl could wish. People all around Sudbury talked about the stolen box. Before long, some of the young men nearby began to think Miss Jerrold was quite a desirable young woman. Her hair was untidy, and she was not as neat in her dress as a young woman ought to be, but she had several suitors. Jacobs was one of them.
        - id: ch01-b28
          speaker: mr_harry
          text: >-
            He won her away from a blacksmith, a painter, and several young farmers. Father said he had never worked so hard to keep a straight face as he did this spring, when Jacobs came to say he was going to marry Miser Jerrold's daughter. Jacobs wanted to leave Father's employment, and he thanked Father in a fine, manly way for always treating him well.
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            After Jacobs left, Mother said Father would sit and wonder about him. Had he fallen in love with Eliza Jerrold? Was he determined to get the box after all, but honestly this time? Did he regret frightening the old man into an even more helpless state? Was he marrying Eliza so he could care for her father, or was there some other reason? Father came up with a dozen different explanations. He would go on and on about them. Then he would burst out laughing and call it one of the cleverest tricks he had ever heard of.
        - id: ch01-b30
          speaker: mr_harry
          text: >-
            In the end, Jacobs and Eliza married, and Father and Mother attended the wedding. Father gave the bridegroom a yoke of oxen, and Mother gave the bride plenty of household linen. I believe the two of them are as happy as the day is long. Jacobs sees that his wife combs her hair. He cares for the old man as if he were his own son, and he is restoring the farm that had nearly gone to ruin. I hear he plans to build a new house, too.
        - id: ch01-b31
          speaker: miss_laura
          text: Harry, could you take me to see them?
        - id: ch01-b32
          speaker: mr_harry
          text: >-
            I certainly can. Mother often drives over with little gifts for them, and we'll go sometime, too. I'd like to see Jacobs now that he's become a decent fellow. Oddly enough, though he once had a poor character, nobody has ever suspected him of the robbery, and he has been wise enough never to mention it.
        - id: ch01-b33
          speaker: mr_harry
          text: >-
            Father says Jacobs is like the rest of us. Good and evil are mixed together in him. Sometimes one is stronger, and sometimes the other. But we must keep moving instead of talking here all day. Get up, Fleetfoot.
        - id: ch01-b34
          speaker: beautiful_joe
          text: We crossed the bridge over the river.
        - id: ch01-b35
          speaker: miss_laura
          text: Where did you say we're going?
        - id: ch01-b36
          speaker: mr_harry
          text: >-
            We're going a little way back into the woods. An Englishman has a small clearing there called Penhollow. Father lent him money three years ago, and he won't pay the interest or return what he borrowed.
        - id: ch01-b37
          speaker: miss_laura
          text: I think I've heard of him. Isn't he the man the boys call Lord Chesterfield?
        - id: ch01-b38
          speaker: mr_harry
          text: >-
            That's the one. He's a peculiar man, but Father has always defended him. Father likes the English. He says we should be as willing to help an Englishman as an American, since both peoples came from the same stock.
        - id: ch01-b39
          speaker: miss_laura
          text: >-
            Not only Englishmen, Harry. We should help Chinese people, Black people, and everyone else. All nations ought to live like brothers.
        - id: ch01-b40
          speaker: mr_harry
          text: Yes, Miss Enthusiasm, I suppose they ought.
        - id: ch01-b41
          speaker: beautiful_joe
          text: I looked up and saw Mr. Harry gazing admiringly at his cousin.
        - id: ch01-b42
          speaker: miss_laura
          text: Please tell me more about this Englishman.
        - id: ch01-b43
          speaker: mr_harry
          text: >-
            There isn't much to tell. He lives alone and comes to the village only now and then for supplies. He's as poor as anyone could be, but he despises every person within ten miles. To him, we're nothing more than thrifty, well-trained animals of a lower order.
        - id: ch01-b44
          speaker: miss_laura
          text: Why does he think that?
          emotion: surprised
        - id: ch01-b45
          speaker: mr_harry
          text: >-
            Because he's a gentleman, Laura, while we're only common people. My father can't help a lady in and out of a carriage as gracefully as Lord Chesterfield. He can't bow as grandly. We don't dress for a late dinner, attend operas and theatres, or know anything about fashionable society. We can't even say exactly who our great-great-grandfather came from. Why, the gulf between us and this Englishman is wider than the one young Curtius leaped into.
        - id: ch01-b46
          speaker: beautiful_joe
          text: Miss Laura laughed merrily.
        - id: ch01-b47
          speaker: miss_laura
          text: How funny that sounds, Harry. So he despises you?
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            She glanced at her handsome cousin, his fine buggy, and his well-kept horse. Then she burst into laughter again, and Mr. Harry joined her.
        - id: ch01-b49
          speaker: mr_harry
          text: >-
            It does sound absurd. Sometimes I pass him on the road, jogging toward town in his rickety cart. I look at his pale, cruel face and remember that he's a ruined gambler and a man worn out by worldly living. Yet he believes he's infinitely above me, though I'm young, healthy, and looking forward to a happy future. I have to turn my face away to hide a smile.
        - id: ch01-b50
          speaker: beautiful_joe
          text: >-
            By then, the river and meadows lay far behind us. We were traveling through thick woods. The narrow road was badly broken, and Fleetfoot had to choose each step with care.
        - id: ch01-b51
          speaker: miss_laura
          text: If he loves city life so much, why does he live in such a lonely place?
        - id: ch01-b52
          speaker: mr_harry
          text: >-
            I don't know. Father fears he may have done something wrong and gone into hiding, but we say nothing about that. No one has seen him for several weeks. To tell you the truth, we're going as much to find out what has happened to him as to ask for Father's money. He lives alone. He could be lying there sick, and nobody would know.
        - id: ch01-b53
          speaker: mr_harry
          text: >-
            The last time we heard of him visiting the village, he withdrew a large sum from the bank. That annoyed Father. He thought the man might have used some of it to pay his debts. I suppose his relatives in England send him money. And here we are at the entrance to the mansion of Penhollow. I'll have to get out and open the gate to its winding avenue.
        - id: ch01-b54
          speaker: beautiful_joe
          text: >-
            Bars had been laid across an opening in the snake fence beside the road. I sat and looked around. It was a strange and lonely place. The trees nearly met above our heads, leaving the road dim and silent. Only a few thin rays of sunlight slipped between the branches.
        - id: ch01-b55
          speaker: beautiful_joe
          text: >-
            A muddy pool lay before the bars. Mr. Harry stepped into it while lowering them and soaked his feet.
        - id: ch01-b56
          speaker: mr_harry
          text: >-
            Confound that Englishman. He hasn't even the sense to put a load of stones down here. Drive through, Laura, and I'll replace the bars.
        - id: ch01-b57
          speaker: beautiful_joe
          text: >-
            He backed out of the water and wiped his boots on the grass. Fleetfoot took us through the opening. Then Mr. Harry climbed into the buggy and gathered the reins again. We crept along the narrow, rough road while bushes scratched and scraped the buggy. Mr. Harry looked thoroughly annoyed.
        - id: ch01-b58
          speaker: miss_laura
          text: >-
            No one lives only for himself. This man's carelessness is causing trouble for you. Why doesn't he cut back the branches hanging over the road?
        - id: ch01-b59
          speaker: mr_harry
          text: >-
            Because his dreadful laziness won't allow it. If I could stay behind him for a week, I'd make him move a little faster. Thank goodness, we've finally arrived.
        - id: ch01-b60
          speaker: beautiful_joe
          text: >-
            A small grassy clearing opened in the middle of the woods. Chips and scraps of wood lay everywhere. Across the clearing stood a roughly built house of bare, unpainted boards. A stick held the front door open, and several windowpanes were broken. The whole place looked mournful and ready to fall apart. I had never seen a sadder-looking home.
        - id: ch01-b61
          speaker: mr_harry
          text: >-
            It doesn't look as though anyone is here. Barron must be away. Laura, will you hold Fleetfoot while I go and look?
        - id: ch01-b62
          speaker: beautiful_joe
          text: >-
            He drew the buggy beside a small log building that had plainly served as a stable. I lay down next to it and watched Miss Laura.
