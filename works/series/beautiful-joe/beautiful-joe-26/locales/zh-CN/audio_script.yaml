audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mr_harry:
      display_name: 哈里先生
      tts:
        delivery: 正直果断，情绪来得直接
        timbre: 明亮有力
        pace: 明快
        pitch: 中
    mr_morris:
      display_name: 莫里斯先生
      tts:
        delivery: 温厚稳重，言语清楚有分寸
        timbre: 醇厚温和
        pace: 不疾不徐
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十六章　钱匣
      blocks:
        - id: ch01-b01
          speaker: mr_harry
          text: >-
            这个故事讲的是雅各布斯，他去年冬天在我们家做工。那人很狡猾，总显得做贼心虚。他常常背着父亲偷农庄的东西，再拿出去卖。父亲早就知道了，只是在想该怎样处置他。后来发生了一件事，终于逼得父亲不能再等。
        - id: ch01-b02
          speaker: mr_harry
          text: >-
            有一天，父亲要去萨德伯里买农具，就让佩瑟拉着雪橇出门。去那里有两条路。萨德伯里路近，旧驿道远，也很少有人走。那天雪不深，父亲便走了旧驿道。他还想顺路探望一位老人。几天前，那老人遭人抢劫，差点活活吓死。
        - id: ch01-b03
          speaker: mr_harry
          text: >-
            那老人很可怜，和女儿相依为命，大家都叫他守财奴杰罗尔德。他把省下的一点钱装进匣子，藏在床底下。快到他家时，父亲发现佩瑟的举动很奇怪，像是不久前才走过这条路。父亲最懂马，马的一举一动，他都要琢磨其中的意思。于是他松了松缰绳，只管看佩瑟怎么走。
        - id: ch01-b04
          speaker: mr_harry
          text: >-
            佩瑟沿着路走，见父亲始终不指方向，自己便拐进通往那所房子的小巷。巷子尽头有扇旧红门。它停在门前，耐心等父亲下车开门。进去以后，它没有朝屋子走，反而掉过头来，脑袋冲着大路站好，仿佛随时准备离开。
        - id: ch01-b05
          speaker: mr_harry
          text: >-
            父亲什么也没说，心里却已经想了很多。他进屋时，老人正坐在火边搓手，带着哭腔念叨自己“那几个可怜的钱”。父亲从前没见过他，只听人说他有些糊涂。无论怎么问，都问不出什么有用的话。
        - id: ch01-b06
          speaker: mr_harry
          text: >-
            老人的女儿说，出事那晚，天黑以后他们就睡了。她睡楼上，父亲睡楼下。大约十点，她听见一声尖叫，赶紧跑下楼。老人坐在床上，窗户大敞着。他说有个人从窗外扑进来，把被褥塞进他嘴里，又从床底拖出钱匣逃走了。女儿奔到门口，却连个人影也没看见。天很黑，还飘着小雪，第二天早晨也找不到脚印。
        - id: ch01-b07
          speaker: mr_harry
          text: >-
            邻居们陆续赶来陪着老人，父亲便继续去萨德伯里，办完事才回家。一到农庄，他就看见雅各布斯在马厩边不安地转来转去。雅各布斯走上来，说自己有话要讲。父亲答应了，却让他先把马安顿好再说。
        - id: ch01-b08
          speaker: mr_harry
          text: >-
            雅各布斯卸完马具，嘴里叼着一根稻草，懒洋洋地走过来。父亲一直坐在马厩的长凳上看着他。他说自己已经决定去西部，想立刻动身。父亲又说了一声好，不过在他走以前，两人还得算一笔账。
        - id: ch01-b09
          speaker: mr_harry
          text: >-
            父亲从口袋里拿出一张纸。雅各布斯骗走的每一夸脱燕麦、每一袋谷物，还有卖农产品少交的每二十五美分，他都尽可能记在了上面。那家伙的脸一会儿一个颜色，像道彩虹。他本以为自己把踪迹藏得极好，永远不会露馅。
        - id: ch01-b10
          speaker: mr_morris
          text: >-
            坐下吧，雅各布斯。我得跟你好好谈一谈。
        - id: ch01-b11
          speaker: mr_harry
          text: >-
            父亲跟他谈了足足一个钟头。等话说完，雅各布斯整个人都垮了。父亲告诉他，年轻人一生有两条路可走，他偏偏走上了错的那条。不过，他还年轻，也很聪明，只要现在立刻回头，就还有挽救自己的机会。要是不肯回头，前面等着他的只有州监狱。他不可能把天下人全都蒙骗一遍，却永远不被人识破。
        - id: ch01-b12
          speaker: mr_harry
          text: >-
            只要雅各布斯答应努力做个诚实人，父亲愿意尽力帮他。说完，父亲撕掉那张纸，告诉他，从前欠下的账一笔勾销。雅各布斯才二十三岁上下，听到这里，竟像个孩子似的哭了起来。
        - id: ch01-b13
          speaker: mr_harry
          text: >-
            父亲不去看他，只装作自言自语，讲起下午那趟路。照父亲所知，佩瑟从来没走过旧驿道，可它对那里熟得很。进了红门以后，它没有靠近房子，反而转身等着离开。父亲一踏回雪橇，它还回头望了一眼，接着便沿小巷飞奔起来。
        - id: ch01-b14
          speaker: mr_harry
          text: >-
            父亲又随口提起，抢劫发生在星期一晚上。那一晚，雅各布斯借走佩瑟，说要去枢纽站。可他回来时，马身上热气腾腾，显然跑了远得多的路。父亲说完，雅各布斯已经瘫坐在马厩地上，双手捂着脸。父亲没有再逼他，只留下他独自跟良心算账，自己回屋去了。
        - id: ch01-b15
          speaker: mr_harry
          text: >-
            第二天早晨，雅各布斯和平常一样，跟其他工人一起干活，再也不提去西部。傍晚，一个路过的农夫远远叫住父亲，问他听到新闻没有。昨夜不知什么时候，守财奴杰罗尔德的钱匣被送回了门阶。老人早晨发现时，里面的钱一分不少。
        - id: ch01-b16
          speaker: mr_harry
          text: >-
            老头很精明，不肯说匣子里到底有多少钱。邻居劝他把钱存进银行。他准备第二天一早带钱进城，当晚还会有几个邻居帮他守着钱匣。挤奶时，父亲把消息告诉工人们。雅各布斯把自己装得像是什么也不知道。
        - id: ch01-b17
          speaker: mr_harry
          text: >-
            可从那天起，雅各布斯真的变了。他没亲口说过自己要做诚实人，行动却把一切都说清楚了。他以前阴沉又懒散，后来既能干，又肯帮助别人。等到他要离开时，父亲还真舍不得他。
        - id: ch01-b18
          speaker: miss_laura
          text: >-
            哈里表哥，他现在在哪儿？后来又怎么样了？
        - id: ch01-b19
          speaker: beautiful_joe
          text: >-
            劳拉小姐听得入了神。哈里先生乐得笑出了声，我抬头盯着他，连疾蹄也回过头来，想知道有什么好笑。我们正在爬一道又长又陡的山坡，走得很慢。四周清澈寂静，马车里的每句话，我们都听得清清楚楚。
        - id: ch01-b20
          speaker: mr_harry
          text: >-
            我觉得故事后半截才最好，浪漫得连姑娘家也挑不出毛病。钱匣失窃的事在萨德伯里一带传开以后，附近有些年轻人竟觉得杰罗尔德小姐很值得追求。其实她的头发总是乱蓬蓬的，衣着也不像年轻姑娘该有的那么整洁。
        - id: ch01-b21
          speaker: mr_harry
          text: >-
            雅各布斯也是她的追求者。他胜过了一个铁匠、一个油漆匠，还有好几个年轻农夫。今年春天，他来告诉父亲，自己要娶守财奴杰罗尔德的女儿。父亲说，他这一生从没有哪一次忍笑忍得那么辛苦。雅各布斯要辞去农庄的工作，还堂堂正正地感谢父亲，说父亲一直待他很好。
        - id: ch01-b22
          speaker: mr_harry
          text: >-
            雅各布斯走后，父亲常坐在那里猜测。他究竟爱上了伊莱莎，还是仍想得到那只钱匣，只是这回打算用诚实的办法？又或许，他后悔把老人吓得更糊涂，想娶了女儿，好亲自照顾老人？父亲能想出十来种说法，然后忽然笑起来，说这是他听过最滑稽也最巧妙的一招。
        - id: ch01-b23
          speaker: mr_harry
          text: >-
            后来雅各布斯真的结了婚，父亲和母亲都去参加婚礼。父亲送给新郎一对牛，母亲送给新娘许多家用布品。我相信，他们从早到晚都过得快活极了。雅各布斯让妻子把头发梳整齐，照料老人就像亲儿子一样。他还在整治那座快要荒废的农庄，听说准备盖一所新房子。
        - id: ch01-b24
          speaker: miss_laura
          text: >-
            哈里，你能带我去看看他们吗？
        - id: ch01-b25
          speaker: mr_harry
          text: >-
            当然能。母亲常驾车去看望他们，还会送些小东西，我们改天也跟着去。我也想看看雅各布斯。他现在已经是个正派人了。奇怪的是，虽然他从前名声不好，却没人怀疑抢劫是他干的。他也一直聪明地守口如瓶，从没有提起过那件事。
        - id: ch01-b26
          speaker: mr_harry
          text: >-
            父亲说，雅各布斯和我们大家一样，心里既有善，也有恶，有时这一个占上风，有时另一个占上风。不过，我们不能整天停在这儿说话。走吧，疾蹄。
        - id: ch01-b27
          speaker: miss_laura
          text: >-
            你刚才说，我们要去哪里？
        - id: ch01-b28
          speaker: beautiful_joe
          text: >-
            这时，我们正从河上的桥走过去。
        - id: ch01-b29
          speaker: mr_harry
          text: >-
            就在后面这片树林里，不太远。有个英国人住在一块林间空地上，把那里叫作彭霍洛。三年前，父亲借钱给他，他却连利息和本金都不肯还。
        - id: ch01-b30
          speaker: miss_laura
          text: >-
            我好像听人说过他。他就是男孩子们叫作切斯特菲尔德勋爵的那个人吧？
        - id: ch01-b31
          speaker: mr_harry
          text: >-
            就是他。这人古怪得很，父亲却总替他说话。父亲很喜欢英国人，觉得我们帮助英国人，应当像帮助美国人一样热心，因为两国同出一源。
        - id: ch01-b32
          speaker: miss_laura
          text: >-
            不该只帮助英国人。中国人、黑人，所有人都该帮助。各个民族之间本来就该像兄弟一样。
        - id: ch01-b33
          speaker: mr_harry
          text: >-
            是啊，热心小姐，我想是该这样。
        - id: ch01-b34
          speaker: beautiful_joe
          text: >-
            我抬头一看，哈里先生正带着赞赏的神情望着表妹。
        - id: ch01-b35
          speaker: miss_laura
          text: >-
            再给我讲讲那个英国人吧。
        - id: ch01-b36
          speaker: mr_harry
          text: >-
            没多少可讲的。他独自生活，只偶尔进村买些日用品。明明穷得不能再穷，却瞧不起方圆十英里内的每个人。在他眼里，我们不过是一群勤劳、驯服的低等动物。
        - id: ch01-b37
          speaker: miss_laura
          text: >-
            他为什么会这样？
          emotion: surprised
        - id: ch01-b38
          speaker: mr_harry
          text: >-
            因为他是绅士，劳拉，我们只是平民。家父不懂得像切斯特菲尔德勋爵那样扶女士上下马车，也行不出那么气派的鞠躬。他不会为一顿很晚的正餐换上晚礼服。我们不去歌剧院或剧场，不懂上流社会的规矩，连自己的高祖是哪家后代都说不清。我们和那个英国人之间的鸿沟，比年轻的库尔提乌斯跳进去的那道还宽。
        - id: ch01-b39
          speaker: miss_laura
          text: >-
            这话听起来真有趣，哈里。原来他还瞧不起你。
          emotion: happy
        - id: ch01-b40
          speaker: beautiful_joe
          text: >-
            劳拉小姐笑得很快活。她看看英俊的表哥，又看看漂亮的马车和照料得极好的疾蹄，忍不住又笑了一阵。
        - id: ch01-b41
          speaker: mr_harry
          text: >-
            的确很荒唐。有时我遇见他坐着那辆摇摇晃晃的旧车，颠簸着进城。看看他苍白冷酷的脸，再想想他不过是个落魄的赌徒、一个败下阵来的老于世故之徒，却认定自己比我高贵无数倍。我还年轻，身体强健，前途也很好。每逢这时，我都得转过脸去，免得让他看见我在笑。
        - id: ch01-b42
          speaker: beautiful_joe
          text: >-
            我们早已把河流和草地远远抛在后面，走进茂密的树林。路又窄又崎岖，疾蹄只能小心挑着地方落脚。
        - id: ch01-b43
          speaker: miss_laura
          text: >-
            既然那个英国人那么喜欢城市生活，为什么要住在这样偏僻的地方？
        - id: ch01-b44
          speaker: mr_harry
          text: >-
            我也不知道。父亲担心他犯过什么错，才躲在这里，不过我们谁都不提。我们已经几星期没见到他了。说实话，这一趟不只是来讨债，也想看看他出了什么事。他独自住着，就算病倒，也不会有人知道。
        - id: ch01-b45
          speaker: mr_harry
          text: >-
            我们最后一次听说他进村，是去银行取了一大笔钱。父亲很不高兴，说他本可以拿出一点还债。我猜是英国的亲戚一直给他钱。到了，这就是彭霍洛府邸的入口。我得下车打开栅栏，让马车驶上那条弯弯曲曲的车道。
        - id: ch01-b46
          speaker: beautiful_joe
          text: >-
            路边的蛇形木栅栏开了个口子，几根木杆横在当中。我坐下来朝四周看。这里古怪又荒凉。头顶的树枝几乎连在一起，林中幽暗无声，阳光只能从叶缝间漏下几小束。木杆前还有一汪泥水。哈里先生放下木杆时，双脚踩进水里，连靴子都湿了。
        - id: ch01-b47
          speaker: mr_harry
          text: >-
            该死的英国佬！他连倒一车石头填填这里都想不到。劳拉，你先把车赶进去，我来放回木杆。
          emotion: angry
        - id: ch01-b48
          speaker: beautiful_joe
          text: >-
            哈里先生退出泥水，在草地上擦了擦靴子。疾蹄拉着我们穿过缺口，哈里先生把木杆放回原处，随后跳上马车，重新拿起缰绳。前面的路狭窄坎坷，我们只能慢慢走。灌木枝条不停刮擦车身，哈里先生越来越恼火。
        - id: ch01-b49
          speaker: miss_laura
          text: >-
            没有人只为自己活着。你看，他的疏忽已经给你添了麻烦。他为什么不把伸到路上的树枝砍掉呢？
        - id: ch01-b50
          speaker: mr_harry
          text: >-
            因为他那一身可恶的懒骨头不答应。真想跟在他身后一星期，让他手脚勤快一点。谢天谢地，总算到了。
        - id: ch01-b51
          speaker: beautiful_joe
          text: >-
            树林中央有一小片长草的空地，地上到处散着木屑和碎木片。空地另一头，有一所用没上漆的木板草草搭成的房子。前门拿木棍撑着，窗上几块玻璃也破了。整所房子又破败，又凄凉。我从没见过这么悲惨的住处。
        - id: ch01-b52
          speaker: mr_harry
          text: >-
            四周静悄悄的，好像没人。巴伦一定出去了。真叫人奇怪。劳拉，你替我牵着疾蹄，我过去看看好吗？
        - id: ch01-b53
          speaker: beautiful_joe
          text: >-
            哈里先生把马车赶到一间小木屋旁。那屋子显然从前做过马厩。我在屋旁卧下，望着劳拉小姐。
