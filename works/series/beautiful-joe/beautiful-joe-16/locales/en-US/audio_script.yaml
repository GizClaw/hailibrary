  chapters:
    - id: ch01
      title: A COUNTRY WELCOME
      blocks:
        - id: ch01-b01
          speaker: mrs_wood
          text: >-
            My dear niece! How glad I am to see you. And this must be the dog. Good Joe, I have a bone waiting for you. Here comes Uncle John.
          emotion: happy
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            A stout, middle-aged woman with a lively red face had wrapped both arms around Miss Laura. Then a tall, handsome man came over and held out one large hand. My mistress's little fingers disappeared inside it.
        - id: ch01-b03
          speaker: mr_wood
          text: >-
            I'm very glad you're here, Laura. And how are you, old Joe? I've heard all about you.
          emotion: happy
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            Their attention made me feel welcome. I was so happy to be off the train that I frisked around their feet all the way to the wagon. It was a large double wagon with an awning to keep off the sun. Two powerful black horses waited beneath a spreading tree.
        - id: ch01-b05
          speaker: beautiful_joe
          text: >-
            The horses wore no blinders, so they saw us coming. When Mr. Wood approached, their faces brightened. They moved their ears, pawed the ground, and whinnied. Both tried to rub their heads against him. Anyone could see how much they loved him.
        - id: ch01-b06
          speaker: mr_wood
          text: Steady, Cleve and Pacer. Now back up. Back you go.
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            Mrs. Wood, Miss Laura, and I climbed into the wagon. Mr. Wood jumped in after us, gathered the reins, and away we went. Those black horses flew along the road. I sat beside Mr. Wood, breathing in the wonderful smell of grass and flowers. How glad I was to be in the country! I imagined long runs across the green fields. I hoped Mr. Wood had another dog to run with me, and I knew Miss Laura would soon ask what animals lived on the farm.
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            We traveled a little more than a mile past scattered country houses. Miss Laura answered questions about her family and asked about Mr. Harry, who was still away at college. He was Mrs. Wood's son from before she married Mr. Wood. The Morrises called him their cousin, though he was not truly related to them.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            I was delighted to hear that Harry would be home soon. I had never forgotten that without him, I would never have met Miss Laura or found my happy home.
    - id: ch02
      title: MR. WOOD TALKS ABOUT DOGS
      blocks:
        - id: ch02-b01
          speaker: beautiful_joe
          text: After a while, Miss Laura asked the question I had been waiting for.
        - id: ch02-b02
          speaker: miss_laura
          text: Uncle John, do you have a dog?
        - id: ch02-b03
          speaker: mr_wood
          text: I have one today, Laura, but I won't have one tomorrow.
        - id: ch02-b04
          speaker: miss_laura
          text: Oh, Uncle! What do you mean?
          emotion: surprised
        - id: ch02-b05
          speaker: mr_wood
          text: >-
            Animals are much like people. Some are good, and some are bad. This dog is a snarling, ill-tempered brute. When I heard Joe was coming, I decided we would keep the good dog and be rid of the bad one. Bruno is tied up now, and tomorrow I mean to shoot him. If I do nothing, he'll bite someone.
        - id: ch02-b06
          speaker: miss_laura
          text: Uncle, a person doesn't always die from a dog's bite, does he?
        - id: ch02-b07
          speaker: mr_wood
          text: >-
            Certainly not. In my opinion, people talk a great deal of nonsense about poisoned bites and death from hydrophobia. Dogs have snapped at me and sunk their teeth into me all my life. I've never shown a sign of hydrophobia, and I don't intend to. I believe many people get bitten, frighten themselves into thinking they've been poisoned, and make themselves ill with fear.
        - id: ch02-b08
          speaker: mr_wood
          text: >-
            I recently read about policemen in a large English city. Their work is to catch strays, dogs thought to be mad, and every other kind of dog. They are bitten again and again, yet they don't worry over it. But when a lady or gentleman gets bitten in the street, they may worry until their blood is feverish. Then they rush to France for Pasteur to cure them. They imagine they have hydrophobia, and that very imagining makes it real to them.
        - id: ch02-b09
          speaker: mr_wood
          text: >-
            If I kept staring at my right thumb, told myself there was a sore on it, and picked and fretted at the spot, I expect a sore would soon appear. Then off I'd go to the doctor. Still, dogs have no right to bite, and I don't advise anyone to be bitten.
        - id: ch02-b10
          speaker: miss_laura
          text: But hydrophobia really does exist, doesn't it?
        - id: ch02-b11
          speaker: mr_wood
          text: >-
            Oh, yes, I suppose it does. A careful look at thirty-two years of Boston death records found two people who truly died of it. Dogs can fall sick like any other animal, so we must watch them. My horses would become ill if I starved them, stuffed them with food, worked them too hard, never worked them at all, left them filthy, or denied them water. One way or another, that sort of treatment would give them some disease.
        - id: ch02-b12
          speaker: mr_wood
          text: >-
            Anyone who owns an animal should care for it properly, and then things will be all right. When it shows signs of illness, shut it away and watch it. If it cannot be cured, kill it. To prevent hydrophobia, get rid of ownerless and vicious dogs. If that can't be done, at least leave plenty of water where dogs can reach it. A dog with all the water it needs will never go mad.
        - id: ch02-b13
          speaker: mr_wood
          text: >-
            Nothing is wrong with Bruno except pure ugliness. But if I let him run through the village with his tongue hanging out, people would certainly shout, “Mad dog!” I'm going to kill him because I have no use for a dangerous dog. Keep plenty of animals and be kind to them, I say. But if one is vicious, put it out of the way. As long as it remains, it is a constant danger to people and other animals.
        - id: ch02-b14
          speaker: mr_wood
          text: >-
            Some owners behave very badly about their dogs. They keep them even when the dogs torment other people or take food from their neighbors' mouths. That isn't the four-legged dog's fault. The human dog is the worst kind of all.
        - id: ch02-b15
          speaker: mr_wood
          text: >-
            Here in Riverdale, a band of dogs kills sheep because their owners can't or won't keep them out of trouble. Some of those dogs look perfectly meek. At night, the owners go to bed, and Rover or Fido pretends to settle down too. Once the house is quiet and everyone is asleep, off he goes to attack poor, defenseless creatures that cannot fight back. Sheep's blood draws those dogs the way liquor draws some men. They'll travel just as far for it, and once that taste is in them, you can't take it out.
    - id: ch03
      title: HOW DASH WAS CURED
      blocks:
        - id: ch03-b01
          speaker: mrs_wood
          text: Mr. Windham managed to cure his dog.
        - id: ch03-b02
          speaker: beautiful_joe
          text: Mr. Wood broke into a hearty laugh.
        - id: ch03-b03
          speaker: mr_wood
          text: >-
            Yes, he certainly did! I must tell Laura that story. Windham lives near us. Last summer, I kept warning him that his collie was attacking my Shropshire sheep. He refused to believe it, but I knew the dog was guilty. One night, while Harry was home, Harry waited for the collie and caught him with a rope. I tied the dog up and sent for Windham.
          emotion: happy
        - id: ch03-b04
          speaker: mr_wood
          text: >-
            You should have seen them when Windham arrived, both the man's face and the dog's face. Windham looked down at Dash and said only two words.
        - id: ch03-b05
          speaker: mr_windham
          text: You scoundrel!
          emotion: angry
        - id: ch03-b06
          speaker: mr_wood
          text: >-
            The dog crouched at his feet as if he had been shot. Dash was a fine dog, but wicked companions had led him astray. Windham asked where the sheep were, and I told him they were in the pasture. Then he asked whether I still had my old ram, Bolton. I said I did.
        - id: ch03-b07
          speaker: mr_wood
          text: >-
            Next, Windham asked me for eight or ten feet of rope. I gave it to him, wondering what in the world he planned to do. He tied one end to Dash's collar, held the other end, and set off for the pasture. He invited us along. Once we arrived, he asked Harry to catch Bolton for him.
        - id: ch03-b08
          speaker: mr_wood
          text: >-
            There was no need to chase the ram. Bolton came to us like a dog when Harry whistled. Windham tied the loose end of the rope around Bolton's horns and released him. The frightened ram took off, dragging Dash behind him.
        - id: ch03-b09
          speaker: mr_wood
          text: >-
            We let them out of the pasture and into an open field. For several minutes, they raced and chased across it in a way I had never seen before. Harry leaned against the bars and laughed until tears ran down his cheeks.
        - id: ch03-b10
          speaker: mr_wood
          text: >-
            Then Bolton lost his temper. He turned on Dash and struck at him with his horns. We soon put a stop to that, because every bit of fight had gone out of the dog. Windham untied the rope and ordered Dash home. I have never seen a dog run the way that one did.
        - id: ch03-b11
          speaker: mr_wood
          text: >-
            Mrs. Windham thought the world of Dash, so her husband did not want to kill him. But Windham made it plain that if Dash wanted to live, he had to stop killing sheep. The lesson worked. Dash has never troubled a sheep since that day. Offer him a little sheep's wool now, and he puts his tail between his legs and races home.
        - id: ch03-b12
          speaker: mr_wood
          text: >-
            That's enough talk from me, because the farm is in sight. Over there is our boundary, and there is the house. You'll notice how much the trees have changed since your last visit.
    - id: ch04
      title: DINGLEY FARM
      blocks:
        - id: ch04-b01
          speaker: beautiful_joe
          text: >-
            The road turned where the land began to slope gently upward. We passed through the gate and drove between rows of trees toward a long, low red house with a veranda around it. A broad lawn spread across the front. To our right stood the farm buildings, also painted red. Trees grew beside them, forming what Mr. Wood called his windbreak. In winter, they kept the snow from drifting.
        - id: ch04-b02
          speaker: beautiful_joe
          text: >-
            I thought the farm was beautiful. Miss Laura had visited before, but several years had passed, and she looked around as eagerly as I did.
        - id: ch04-b03
          speaker: mrs_wood
          text: >-
            Welcome to Dingley Farm, Joe! Come inside, and I'll introduce you to the cat.
          emotion: happy
        - id: ch04-b04
          speaker: beautiful_joe
          text: Mrs. Wood gave her merry laugh as she watched me jump from the wagon seat to the ground.
        - id: ch04-b05
          speaker: miss_laura
          text: Aunt Hattie, why do you call it Dingley Farm? Shouldn't it be Wood Farm?
        - id: ch04-b06
          speaker: mrs_wood
          text: >-
            The name comes from “dingle,” Laura. Remember that pretty hollow behind the pasture? A hollow like that is called a dingle. People first called this Dingle Farm, but the neighbors began saying “Dingley” instead. I suppose it came more easily to them. Why, here comes Lolo to meet Joe.
        - id: ch04-b07
          speaker: beautiful_joe
          text: >-
            A large tortoiseshell cat came along the wide hall that ran through the house. Her face had lovely markings, and she waved her great tail like a flag. She mewed a friendly greeting to Mrs. Wood. Then she saw me, and her whole expression changed.
        - id: ch04-b08
          speaker: beautiful_joe
          text: >-
            Lolo flew onto the hall table. She arched her back so high that her feet almost lifted from the wood. Her fur stood out, and she spat at me in a fury.
        - id: ch04-b09
          speaker: mrs_wood
          text: >-
            Poor Lolo. Joe is a good dog. He isn't like Bruno, and he won't hurt you.
          emotion: calm
        - id: ch04-b10
          speaker: beautiful_joe
          text: >-
            I wagged my whole body a little and gave her the kindest look I could. Lolo only answered with angry cat language. Weeks passed before we became friends. She was young and had known just one dog, the bad Bruno, so she thought every dog must be like him.
        - id: ch04-b11
          speaker: beautiful_joe
          text: >-
            Several rooms opened from the hall. One was the dining room, where the family had tea. I lay on a rug outside the doorway and watched them. A white cloth covered a small table set with pretty dishes and glassware, along with many different things to eat. A young French girl named Adele kept going back and forth from the kitchen, bringing hot cakes, fried eggs, and hot coffee.
        - id: ch04-b12
          speaker: beautiful_joe
          text: >-
            When their tea was over, Mrs. Wood served me one of the finest meals I had ever eaten.
