audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 温柔坚定，对人和动物都充满耐心
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 热情爽朗，言谈亲切明快
        timbre: 饱满温暖
        pace: 适中稍快
        pitch: 中
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 豪爽直率，说起农场轶事时生动风趣
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十六章　丁格利农场
      blocks:
        - id: ch01-b01
          speaker: mrs_wood
          text: >-
            我亲爱的外甥女！见到你真叫人高兴。这就是那条狗吧。好乔，我还给你留着一根骨头呢。瞧，约翰姨父来了。
          emotion: happy
        - id: ch01-b02
          speaker: beautiful_joe
          text: >-
            一位身材丰腴的中年妇人张开双臂，把劳拉小姐紧紧抱住。她面色红润，浑身都是活泼劲儿。接着，一个高大英俊的男人走上前，伸出宽厚的大手。我小主人的手被他一握，纤细的手指简直全看不见了。
        - id: ch01-b03
          speaker: mr_wood
          text: 劳拉，见到你真高兴。怎么样，乔，老伙计？你的事我都听说了。
          emotion: happy
        - id: ch01-b04
          speaker: beautiful_joe
          text: >-
            他们两人都留意到我，我觉得自己真受欢迎。能离开火车，我更是高兴极了，一路跟着他们走向马车，一路在他们脚边蹦跳。那辆双座马车又宽又大，上面支着遮阳篷，正好替车里的人挡住阳光。两匹健壮的黑马停在一棵枝叶舒展的大树下乘凉，没有戴眼罩，远远就能看见我们。伍德先生一走近，它们便来了精神，转着耳朵，刨着地，还轻声嘶鸣，争着拿头去蹭他。我一眼就看出来，它们很爱他。
        - id: ch01-b05
          speaker: mr_wood
          text: 站稳了，克利夫，佩瑟。往后，再往后退。
        - id: ch01-b06
          speaker: beautiful_joe
          text: >-
            伍德太太、劳拉小姐和我坐进车里，伍德先生也纵身上车，拿起缰绳。两匹黑马飞快地跑了起来。我坐在伍德先生身旁，尽情呼吸清甜的空气，闻着花草的香气。来到乡下真快活！一想到以后能在绿色田野上痛痛快快地长跑，我就满心欢喜。要是再有一条狗作伴就更好。我很想知道伍德先生家里养没养狗，反正答案很快就会揭晓。劳拉小姐每到一处，总要问清那里有什么动物。
        - id: ch01-b07
          speaker: beautiful_joe
          text: >-
            我们沿着乡间道路走了一英里多，路边稀稀落落地散着几户人家。劳拉小姐回答了姨父姨母许多关于家人的问题，又问起还在大学、尚未回家的哈里先生。我以前大概还没说过，哈里是伍德太太的儿子。她带着这个独生子守寡，后来才嫁给伍德先生。所以，莫里斯家的孩子虽然叫哈里表哥，他们其实没有血缘关系。
        - id: ch01-b08
          speaker: beautiful_joe
          text: >-
            听说哈里很快就回来，我高兴极了。我一直记得，要不是他，我不会认识劳拉小姐，也住不进如今这个温暖舒适的家。过了一会儿，劳拉小姐问起了狗。
        - id: ch01-b09
          speaker: miss_laura
          text: 约翰姨父，您养狗吗？
        - id: ch01-b10
          speaker: mr_wood
          text: 养啊，劳拉。今天还有一条，明天就没有了。
        - id: ch01-b11
          speaker: miss_laura
          text: 哎呀，姨父，您这是什么意思？
          emotion: surprised
        - id: ch01-b12
          speaker: mr_wood
          text: >-
            动物跟人差不多，有好的，也有坏的。我这条狗又爱咆哮，脾气又坏，性情还凶横。我听说乔要来，就想，家里总算要有好狗了，那条坏狗也该到头啦。所以我把布鲁诺拴了起来，明天就开枪打死他。非得处置不可，不然他迟早会咬伤人。
        - id: ch01-b13
          speaker: miss_laura
          text: 姨父，人被狗咬了，并不是每次都会死，对不对？
        - id: ch01-b14
          speaker: mr_wood
          text: >-
            那当然。依我看，什么狗牙有毒啦，人会死于恐水症啦，其中大半都是胡说。我从小到大，不知被多少狗扑咬过，牙齿也扎进过肉里。可我从没出现过恐水症，以后也不打算有。被狗咬的人里，恐怕有一半都是自己吓自己，认定中了致命的毒。前几天我还读到，英国一个大城市里的警察要抓流浪狗、疑似疯狗和各种各样的狗。他们一次又一次被咬，却从不当回事。可一位太太或先生走在街上被狗咬了，就会不停地担忧，愁得浑身发热，还要赶去法国请巴斯德治疗。他们认定自己得了恐水症，结果就因为胡思乱想，真弄出了病。我要是死死盯着右手拇指，认定那里生了疮，又不停去抠，不停为它操心，没准很快真会长出疮来，然后我也得找医生。不过，狗确实不该咬人，我也绝不劝谁去挨咬。
        - id: ch01-b15
          speaker: miss_laura
          text: 可是姨父，难道根本没有恐水症这种病吗？
        - id: ch01-b16
          speaker: mr_wood
          text: >-
            哦，有的，我想总是有的。听说有人仔细查过波士顿三十二年的死亡记录，真因恐水症丧命的共有两个人。狗跟其他动物一样，也会生病，必须有人照看。我要是饿着自己的马，或者喂得太饱，叫它们干活过度，成天闲站着，浑身脏兮兮的，又喝不够水，我想它们也会发疯。即使不发疯，也一定会生出什么病。人既然养了动物，就该好好照料，这样自然不会出事。动物有了病相，便关起来仔细观察。要是病治不好，就把它杀掉。想预防恐水症，有个稳妥的办法，那就是除掉所有无主的恶狗。办不到，至少得把水放在它们随时喝得到的地方。一条狗只要想喝多少水便有多少水，就绝不会发疯。
        - id: ch01-b17
          speaker: mr_wood
          text: >-
            我这条狗根本没病，只是天性恶劣。可我要是放开它，让它吐着舌头跑过村子，准会有人大喊疯狗。不管怎样，我要杀掉它。坏狗留着没有用。动物尽可以多养，也该仁慈地对待。可里面若有一只凶恶的，就得除掉，因为它时时刻刻都威胁着人和牲畜。有些人护起自己的狗来，真是不讲理。无论那狗怎样搅扰别人，他们都要留着，哪怕它正在夺走邻居赖以糊口的东西也不管。可那并不是四脚狗的错。人变成的狗，才是最坏的狗。
        - id: ch01-b18
          speaker: mr_wood
          text: >-
            河谷有一伙专咬羊的狗，它们的主人不是管不住，就是不肯管。有几条看着还挺温顺。夜里主人上床，它们也装作去睡。等屋里安静，一家人全睡着了，罗弗也好，菲多也好，便偷偷溜出去，折磨那些毫无抵抗之力的牲畜。狗一旦嗜上羊血，就像人嗜酒一样。人为了喝酒肯走多远，狗为了寻这种乐子也肯跑多远。那股嗜好钻进骨头里，就再也赶不出去了。
        - id: ch01-b19
          speaker: mrs_wood
          text: 温德姆先生就把他的狗治好了。
        - id: ch01-b20
          speaker: beautiful_joe
          text: 伍德先生听了，顿时爆发出一阵响亮而爽朗的大笑。
        - id: ch01-b21
          speaker: mr_wood
          text: >-
            不错，他治好了，真的治好了。我得讲给劳拉听。温德姆是我们的邻居。去年夏天，我一再告诉他，他那条牧羊犬总来糟蹋我的什罗普郡羊。他怎么都不肯相信，可我知道自己没弄错。有天晚上，哈里正好在家，便守着那条狗，用套索逮住了它。我把它拴好，又派人去请温德姆。你真该看看主人和狗当时的脸。温德姆只说了两个字，恶棍！那狗便蜷伏在他脚下，像是中了一枪。它本是条好狗，只是被坏伙伴带坏了。
        - id: ch01-b22
          speaker: mr_wood
          text: >-
            温德姆问我的羊在哪里，我说在牧场。他又问老公羊博尔顿还在不在。我说还在，他便要了一根八到十英尺长的绳子。我把绳子递给他，心想他究竟要干什么。他把一头系在狗项圈上，另一头拿在手里，向牧场走去，还叫我们跟上。到了那里，他让哈里把博尔顿叫来。其实根本用不着捉，那只羊像狗一样，一叫就来。哈里吹了声口哨，博尔顿走到跟前，温德姆便把绳子另一头系在羊角上，放开了它。
        - id: ch01-b23
          speaker: mr_wood
          text: >-
            公羊受了惊，拔腿就跑，拖着那条狗一路飞奔。我们把它们从牧场放进一片空地。接下来的几分钟，那一羊一狗在田里又奔又逐，我这辈子都没见过那样的场面。哈里靠着栅栏，笑得眼泪直流。后来博尔顿发火了，转身跟狗交战，一次次用羊角撞它。我们很快便拦住，因为达什已经吓破了胆。温德姆解开绳子，叫它回家。要说我见过哪条狗跑得快，那就是它了。
        - id: ch01-b24
          speaker: mr_wood
          text: >-
            温德姆太太把达什当宝贝，她丈夫也不愿杀它。不过他说，达什若想活命，就非戒掉咬羊不可。这一招真把它治好了。从那天到现在，它再没骚扰过一只羊。如今只要拿一小撮羊毛递给它，它便夹起尾巴往家逃。好啦，我不能再说个没完，我们已经看见农场了。那边就是我们的地界，那座是房子。你上次来过以后，这里的树可变了不少。
        - id: ch01-b25
          speaker: beautiful_joe
          text: >-
            道路到了转弯处，地面从那里缓缓向上。马车转进大门，沿着两排树之间驶去，前面是一幢长长的、低矮的红房子，四周环绕着游廊。门前铺开一片宽阔的草坪，右边远处是农场的屋舍，也都漆成红色。旁边还种着一排树。伍德先生管它们叫防风林，因为冬天有它们挡着，积雪便不会被风吹来堆在屋舍边。
        - id: ch01-b26
          speaker: beautiful_joe
          text: >-
            我觉得这里美极了。劳拉小姐从前来过，可那已经是好几年前的事，所以她也兴致勃勃地四处张望。我从车座跳到地上，伍德太太快活地笑起来。
        - id: ch01-b27
          speaker: mrs_wood
          text: 欢迎来到丁格利农场，乔。进来吧，我领你认识一下猫咪。
          emotion: happy
        - id: ch01-b28
          speaker: miss_laura
          text: 哈蒂姨母，为什么叫丁格利农场呢？不是应该叫伍德农场吗？
        - id: ch01-b29
          speaker: mrs_wood
          text: >-
            丁格利是从丁格尔变来的。你知道牧场后面那个漂亮的小山谷吧？那种山谷就叫丁格尔。所以这里原先叫丁格尔农场，后来附近的人叫着叫着，都叫成了丁格利。我想，他们大概觉得这样更顺口。哎呀，洛洛来见乔了。
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            一只硕大的玳瑁猫沿着贯穿屋子的宽阔门厅走来。她脸上的花纹很漂亮，大尾巴像旗帜一样挥动着，还亲热地喵喵叫，向女主人问好。可是一看见我，她的脸色立刻变了，方才的亲热劲儿一点也不剩。她一下蹿上门厅里的桌子，把背弓得高高的，几乎连脚都要离开桌面，一边冲我嘶叫，一边怒气冲冲地竖起全身的毛。
        - id: ch01-b31
          speaker: mrs_wood
          text: 可怜的洛洛。乔是一条好狗，不像布鲁诺。他不会伤害你。
          emotion: calm
        - id: ch01-b32
          speaker: beautiful_joe
          text: >-
            我轻轻摆着身子，友善地望着洛洛，她却只顾冲我骂个不停。过了好多好多星期，我才和她交上朋友。她还年轻，只认识过一条狗，偏偏那是一条坏狗，所以她以为所有的狗都一样。
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            门厅两旁开着许多房间，其中一间是餐厅，他们就在里面吃茶点。我趴在门外的小毯子上，一直看着他们。小桌铺着洁白的桌布，上面摆了精美的碗碟、玻璃器皿和各式各样的食物。一个叫阿黛尔的法国小姑娘不停地往返厨房和餐厅，给大家送来刚出锅的热饼、煎蛋和热咖啡。他们一吃完，伍德太太也给我端来一顿美餐。那是我这一生吃过的最好几顿饭之一。
