audio_script:
  language: zh-CN
  cast:
    beautiful_joe:
      display_name: 美丽的乔
      tts:
        delivery: 沉静坦诚，带着回望往事的克制
        timbre: 温暖而略显沧桑
        pace: 从容
        pitch: 中低
    mr_wood:
      display_name: 伍德先生
      tts:
        delivery: 爽直厚道，议论时诙谐而有力量
        timbre: 洪亮醇厚
        pace: 适中
        pitch: 中低
    miss_laura:
      display_name: 劳拉小姐
      tts:
        delivery: 亲切活泼，提问时好奇而真诚
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    mrs_wood:
      display_name: 伍德太太
      tts:
        delivery: 温和爽利，关照人时自然亲切
        timbre: 温暖清晰
        pace: 适中
        pitch: 中
    milkman:
      display_name: 送奶人
      tts:
        delivery: 世故敷衍，说话理直气壮
        timbre: 粗哑平常
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十一章　牛棚里
      blocks:
        - id: ch01-b01
          speaker: miss_laura
          text: >-
            舅妈，你说怪不怪？苍蝇那么小，却能给人和动物添那么大的麻烦。有时早晨我还想多睡一会儿，它们的小脚在身上爬，痒得我快发疯了，只好一下跳下床。
        - id: ch01-b02
          speaker: mrs_wood
          text: >-
            我给你找块纱帐罩住床。可你想想，劳拉，要是你没有手，赶不走苍蝇呢？要是它们爬满全身，你又被拴住，怎么也挣不开呢？没有什么折磨能比这更难受了。去年夏天，这里的苍蝇多得吓人。我看它们一年比一年厉害，牲口也越来越遭罪。大概是各地的鸟越来越少，没有足够的鸟来捉苍蝇。约翰说，农庄下次再改建，就给牛棚和马厩的窗户都装上铁丝纱，再安上纱门，把这些小害虫挡在牛马外面。
        - id: ch01-b03
          speaker: mrs_wood
          text: >-
            去年夏天有个下午，马克斯韦尔先生的母亲约我坐车出去。天气热得不得了。到了河边，她想下车去树下坐坐，看能不能凉快一点。她从村里旅店借来一匹杂色马，马毛剪短了，勒着抬头缰，尾巴也截掉了。如今我绝不会坐这样的马车，那时却还没有那么在意。不过，我还是坚持让她先把抬头缰解开，才肯上车。
        - id: ch01-b04
          speaker: mrs_wood
          text: >-
            那匹马简直要发疯了。它浑身颤抖，可怜巴巴地望着我们，苍蝇几乎要把它活活吃掉。它不时惊跳一下。马克斯韦尔太太把一个重物拴在它头前，可它真要跑，轻易就能拖走。它性情很好，并不想逃，只是根本站不住。我赶紧跳起来替它拍打、揉擦，弄得两只手湿淋淋的。那可怜的家伙感激极了，一次又一次用鼻子碰我的胳膊。
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            马克斯韦尔太太坐在树下，一边打扇，一边笑我。我才不在乎。一个不会说话的生命就在面前疼得扭来扭去，我怎么可能只顾自己享受？
        - id: ch01-b06
          speaker: mrs_wood
          text: >-
            苍蝇多的时候，截了尾巴的马吃不好，也睡不好。新英格兰有个村子挂着一块牌子，说代收马匹放牧，长尾马收一元五角，短尾马只收一元。短尾马为什么便宜？因为它们被苍蝇缠得吃不下多少草。长尾马能自己赶走苍蝇，安稳地吃东西。
        - id: ch01-b07
          speaker: mrs_wood
          text: >-
            前几天我还读到，布法罗一个煤商的马被苍蝇折磨得受不了，竟然自杀了。动物真的会这样，我也读过马和狗投水自尽的事。那匹马的毛剪短了，尾巴也截了，人们又把它放出去吃草。苍蝇叮得它几乎发狂。它冲到一道尖桩篱笆前，跳上那些利刺，挂在那里，根本不想下来。几个男人亲眼看见，都说那分明是自杀。
        - id: ch01-b08
          speaker: mrs_wood
          text: >-
            我真希望自己有权把每个截断马尾巴的人抓来，绑住他的手，让他只穿一点衣服，在烈日下的田野里待着，周围再放满苍蝇。那时倒要看看，他会不会同情可怜的哑巴牲口。截尾这种时尚，真是世上最荒唐的事。有人硬说马截了尾巴，腰背会像短尾羊一样更有力，我一个字也不信。马天生就有足够的力气做它该做的活儿，人不能把它改造得更好。截尾既残忍，又邪恶。
          emotion: angry
        - id: ch01-b09
          speaker: mrs_wood
          text: >-
            抬头缰在某些时候倒还有那么一点道理。烈性的年轻马勒着高高的抬头缰，就不能撒腿逃跑。赛马疾驰时，缰绳绷紧，让它昂着头，也能免得它噎住。可是我不赞成把小马养得性情暴烈，也恨不得世上没有一匹赛马。要是由我做主，各种抬头缰都得废掉。可惜我们女人不能投票，劳拉。不然，许多恶习早就能革除了。
        - id: ch01-b10
          speaker: beautiful_joe
          text: 劳拉小姐勉强笑了一下，笑容里几乎带着忧伤。伍德太太赶紧换了话题。
        - id: ch01-b11
          speaker: mrs_wood
          text: 你听说过吗？阴天的时候，母牛产的奶会比晴天少。
        - id: ch01-b12
          speaker: miss_laura
          text: 没有，我从来没听说过。
        - id: ch01-b13
          speaker: mrs_wood
          text: >-
            可这是真的。母牛非常敏感。只要肯用心研究，就能发现动物身上各种有意思的事。母牛尤其了不起。你待它们好，它们会把得到的每一分照料连本带利地还给你。劳拉，你听说过给牛去角吗？
        - id: ch01-b14
          speaker: miss_laura
          text: 只听过一点。舅舅赞成吗？
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            当然不赞成。他觉得，给牛去角和截掉它们的尾巴一样不可思议。他常说，造物主大概比他更清楚牛该怎样长。我有时会告诉约翰，这个道理并不处处说得通，因为人有时确实能改善自然的安排。照自然的情形，母牛得给小牛喂上半年奶。我们把小牛带走，一样能把它养好，还能从母牛那里多得到一些奶。
        - id: ch01-b16
          speaker: mrs_wood
          text: >-
            可我自己也拿不准该怎样看去角。温德姆先生的牛全都没有角，牛舍里也不设隔栏，只留一片开阔的地方。他说，这样牛更舒服，不那么受拘束。我想，牛要乘船出海，也许非去角不可。可只是放到草地上吃草，还把角去掉，就像是在残害它们。我们家的母牛若没有角，便不能替羊群赶狗。角是它们防身的东西。
        - id: ch01-b17
          speaker: miss_laura
          text: 你们的牛整个冬天都站在这些栏里吗？
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            是啊，只有放进谷仓院子时例外。那时约翰通常得派个人，让它们不停走动，不然就会着凉。天气特别好时，它们有时会在外面待上一整天。牛和马不一样。约翰说，它们像一架架巨大的产奶机器，得让它们安安静静，只做足够保持健康的活动。母牛若被催赶、惊扰，或是受冷受热，奶量都会减少。人要是虐待它，奶也会变坏。约翰说，你用棍子在母牛背上打一下，它的奶就会跟着坏上一分。母牛若没有收拾干净，产的奶还不如倒掉，直接去喝水。
        - id: ch01-b19
          speaker: mrs_wood
          text: >-
            我在芝加哥时，嫂嫂总向送奶人抱怨，说牛奶有股“牛腥味”。
        - id: ch01-b20
          speaker: milkman
          text: 太太，那是牲口本身的气味，没办法。所有牛奶都有那股味。
        - id: ch01-b21
          speaker: mrs_wood
          text: >-
            嫂嫂问我怎么看。我说，那是脏出来的。我敢拿自己最好的帽子打赌，那个人的牛一定养得很脏。牛皮上糊满污秽，体内的毒物不能从皮肤排出去，只好渗进奶里，而她还在帮忙把那些毒物喝掉。她听了大吃一惊，要来送奶人的地址，有一天突然找上门。牛棚还算干净，牛身上却果然脏得和我说的一样。她劝那个人每天给牛刮毛、刷洗，又叫他以后别再送奶了。
        - id: ch01-b22
          speaker: mrs_wood
          text: >-
            你看，你们城里人在牛奶上受了多少蒙骗。母牛受到那样的对待，我看你们早晚会中毒。就算检验牛奶，也未必能知道它纯不纯。纽约的法律只要求牛奶里有百分之十三的固形物。荒唐得很，因为拿泔水喂牛，产出的奶照样能有百分之十四的固形物。你们城里人啊，真是古怪。
        - id: ch01-b23
          speaker: beautiful_joe
          text: 劳拉小姐听得开怀大笑。
        - id: ch01-b24
          speaker: miss_laura
          text: 舅妈，你对大城市的成见可真深。
          emotion: happy
        - id: ch01-b25
          speaker: mrs_wood
          text: >-
            是啊，我承认。我常盼着能拆散几座城市，把里面的人分到乡下去。看看这一带漂亮的农庄，有些地方只剩一对老夫妇。男孩子全跑进城，在商店和办公室里苦干，一个个熬得又苍白又虚弱。哈里要是也染上城里人的习气，我会心碎的。我嫁给你舅舅时，曾认真问过他，孩子还只是个小娃娃，我想让他从小热爱乡村生活，我们该怎么做？
        - id: ch01-b26
          speaker: mrs_wood
          text: >-
            你舅舅看着我，眼里闪着狡黠的笑。他说，我这个乡下姑娘就养得相当不错，不如照我小时候的办法来养哈里。我明知道他在说笑，还是立刻激动起来。我说，好啊，就照我父母的办法办。
        - id: ch01-b27
          speaker: mrs_wood
          text: >-
            农庄一定要大到自己根本照料不过来，至少大上一倍。一个雇工也别请。每天黎明起床，一直苦干到天黑。假日一个也不过。女孩不但要做家务，还得喂鸡、摘水果。男孩就照看小马和小牛，挣来的钱全部存进银行。报纸也别订，免得孩子们读报浪费时间。反正邮局那么远，每星期去一次就够了。还有……后面我说了些什么，如今已经记不得啦。
        - id: ch01-b28
          speaker: beautiful_joe
          text: 伍德先生听完，放声大笑起来。
        - id: ch01-b29
          speaker: mr_wood
          text: 哈蒂，我的农庄太大了。我打算卖掉一部分，让自己也多享一点清福。
        - id: ch01-b30
          speaker: mrs_wood
          text: >-
            就在那一星期，他卖掉五十英亩地，多雇了一个帮工，又给我请来一个能干的姑娘。每星期有两个下午，他会放下活儿，驾车带我出去。小小的哈里用手指握着缰绳。约翰告诉他，我们驾的老母马多莉从此算他的。下一匹买来的马也归他，由他自己取名字。他还会给哈里五只羊，让孩子有自己的银行存折，自己记账。
        - id: ch01-b31
          speaker: mrs_wood
          text: >-
            哈里虽然还只是个小娃娃，却全听懂了。从那一天起，他便像爱亲生父亲一样爱约翰。要是我父亲也有约翰这样的见识，他的两个儿子就不会一个在这座城市当穷律师，一个在另一座城市当穷医生，我们家的农庄也不会落进陌生人手里。
        - id: ch01-b32
          speaker: mrs_wood
          text: >-
            每次回去，我都难受得要命。我总会想起可怜的母亲。她那双操劳得通红的手交叠在胸前，长眠在教堂墓地里。两个儿子却远在他乡。我还会想起父亲从前总是不住地催我们、逼我们。告诉你吧，劳拉，这件事两面都有苦衷。男孩子离开乡下，并不能全怪他们自己。
          emotion: sad
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            伍德太太说完，沉默了一会儿。劳拉小姐也没有出声。我在牛棚里来回走了两趟，心里想了许多。人不管看起来多么幸福，总会有烦恼压在心上。我替伍德太太难过，因为她脸上平日那种快乐的神情已经不见了。不过，她很快便抛开了愁绪。
        - id: ch01-b34
          speaker: mrs_wood
          text: 好了，我得去预备茶点。今天下午阿黛尔出门休息。
        - id: ch01-b35
          speaker: miss_laura
          text: 我也去。我答应过她，今天傍晚由我烤茶点吃的饼干，让你好好歇一歇。
        - id: ch01-b36
          speaker: beautiful_joe
          text: 她们沿着木板路慢慢向屋子走去，我跟在后面。
