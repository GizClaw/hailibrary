audio_script:
  language: en-US
  cast:
    beautiful_joe:
      display_name: Beautiful Joe
      tts:
        delivery: thoughtful and plainspoken
        timbre: warm and weathered
        pace: measured
        pitch: medium-low
    miss_laura:
      display_name: Miss Laura
      tts:
        delivery: gentle and quietly confident
        timbre: warm and clear
        pace: measured
        pitch: medium
    mrs_wood:
      display_name: Mrs. Wood
      tts:
        delivery: kind and practical
        timbre: warm and mature
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: IN THE COW STABLE
      blocks:
        - id: ch01-b01
          speaker: miss_laura
          text: >-
            Isn't it strange that something as small as a fly can bother animals and people so much? Sometimes I try to sleep a little longer in the morning, but their tiny feet tickle me until I nearly go wild and jump out of bed.
        - id: ch01-b02
          speaker: mrs_wood
          text: >-
            We'll get you some netting for your bed. But imagine having no hands to brush the flies away. Imagine them covering your whole body while you're tied where you can't escape. I can't think of worse torture. The flies were dreadful here last summer, and they seem to trouble the animals more every year. I believe that's because birds are being thinned out across the country. There simply aren't enough left to catch the flies. John says our next farm improvement will be wire gauze over every stable window and screen doors to protect the horses and cattle from those little pests.
        - id: ch01-b03
          speaker: mrs_wood
          text: >-
            One terribly hot afternoon last summer, Mr. Maxwell's mother took me driving. Down by the river, she suggested that we leave the phaeton and sit beneath the trees where it might be cooler. Her horse came from the village hotel. He was a roan, clipped close, checked up, and docked. I wouldn't ride behind a tailless horse now, though I wasn't so particular then. Even so, I refused to enter the carriage until she loosened his check-rein.
        - id: ch01-b04
          speaker: mrs_wood
          text: >-
            That poor horse almost went mad. He trembled and shivered, and his eyes begged us for help while the flies nearly ate him alive. Every so often he moved forward. Mrs. Maxwell had put a weight at his head, but he could easily have dragged it away. He was too good-natured to run. He simply couldn't stand still. I sprang up and slapped and rubbed him until my hands were dripping. He was so grateful that he kept touching my arm with his nose. Mrs. Maxwell sat in the shade, fanning herself and laughing at me. I didn't care. How could I enjoy myself while a helpless creature twisted in pain before me?
        - id: ch01-b05
          speaker: mrs_wood
          text: >-
            During fly season, a docked horse can't eat or sleep in comfort. One New England village has a sign offering pasture for horses. It charges a dollar and fifty cents for long-tailed horses, but only a dollar for short-tailed ones. The short-tailed horses cost less because flies trouble them so badly that they hardly eat. Horses with long tails can brush the flies away and graze peacefully.
        - id: ch01-b06
          speaker: mrs_wood
          text: >-
            The other day I read about a Buffalo coal dealer's horse driven to suicide by flies. Animals sometimes do kill themselves. I've read about horses and dogs drowning themselves. This horse had been clipped and docked before he was put out to graze. The flies stung him until he was nearly crazed. He ran at a picket fence and leaped onto its sharp spikes. He hung there without trying to free himself. The men who saw him said it was clearly suicide.
        - id: ch01-b07
          speaker: mrs_wood
          text: >-
            I'd like to take every man who cuts off a horse's tail and tie his hands. Then I'd dress him lightly and leave him in the hot sun, in a field full of flies. We would soon see whether he felt any sympathy for the poor, helpless animal. Docking is the most senseless fashion in the world. Its defenders make flimsy claims that a docked tail gives a horse a stronger back, as a short tail does for a sheep. I don't believe a word of it. A horse was made strong enough for the work it has to do. Human beings can't improve it by cutting pieces off. Docking is cruel and wicked.
        - id: ch01-b08
          speaker: mrs_wood
          text: >-
            There is at least the shadow of an argument for check-reins in certain cases. An overdrawn check can keep a fiery young horse from running away. When horses are racing at speed, a tight rein makes them hold up their heads so they won't choke. But I don't believe colts should be raised in a way that makes them fiery. I wish there were no racehorses anywhere. If the choice depended on me, every sort of check-rein would disappear. It's a pity women can't vote, Laura. We would put an end to many abuses.
        - id: ch01-b09
          speaker: beautiful_joe
          text: >-
            Miss Laura smiled, but it was a faint and almost unhappy smile. Mrs. Wood quickly changed the subject.
        - id: ch01-b10
          speaker: mrs_wood
          text: Have you ever heard that cows give less milk on a dark day than on a bright one?
        - id: ch01-b11
          speaker: miss_laura
          text: No, I haven't.
        - id: ch01-b12
          speaker: mrs_wood
          text: >-
            Well, they do. Cows are very sensitive. You learn all kinds of things when you study animals. I think cows are wonderful creatures. Treat them well, and they return every bit of care with interest. Have you heard much about removing their horns, Laura?
        - id: ch01-b13
          speaker: miss_laura
          text: Not much, Auntie. Does Uncle approve of it?
        - id: ch01-b14
          speaker: mrs_wood
          text: >-
            Certainly not. He might as well cut off their tails. He says the Creator knew how to make a cow better than he does. Sometimes I remind John that people can improve on nature in certain ways. A cow would naturally nurse her calf for six months. We take the calf away, raise it just as well as she could, and gain extra milk besides.
        - id: ch01-b15
          speaker: mrs_wood
          text: >-
            I don't quite know what to think about dehorning. All Mr. Windham's cattle have had their horns removed. He gives them an open part of the barn instead of confining them in stalls, and he says they're more comfortable that way. I suppose cattle sent across the sea must have their horns removed. But when cows are going to be turned out to pasture, taking off their horns seems like mutilation. Our cows couldn't drive dogs away from the sheep without theirs. Their horns are their means of defense.
        - id: ch01-b16
          speaker: miss_laura
          text: Do your cattle stay in these stalls all winter?
        - id: ch01-b17
          speaker: mrs_wood
          text: >-
            Yes, except when they go into the barnyard. Then John usually sends a man to keep them moving so they won't take cold. On a few especially fine days, they stay outside all day. Cows aren't like horses. John calls them great milk machines. They need peace and quiet, with only enough exercise to stay healthy. Hurry, frighten, chill, or overheat a cow, and she gives less milk.
        - id: ch01-b18
          speaker: mrs_wood
          text: >-
            Cruel treatment spoils the milk, too. John says that every blow from a stick across a cow's back makes her milk worse. And if a cow isn't kept clean, you'd be better off throwing her milk away and drinking water.
        - id: ch01-b19
          speaker: mrs_wood
          text: >-
            When I was in Chicago, my sister-in-law kept complaining that her milk had a cow-like smell. Her milkman told her it was the animal's natural odor and that all milk smelled that way. When she asked me, I said it was dirt. I offered to wager my best bonnet that his cows were filthy. Their skins would be plastered over, so what couldn't escape through the skin would come out in the milk, and she was helping to get rid of it.
        - id: ch01-b20
          speaker: mrs_wood
          text: >-
            She was astonished. She found the milkman's address and paid him a surprise visit. The stable was fairly clean, but the cows themselves were exactly as dirty as I'd described. She advised him to curry and brush them every day, and told him not to bring her any more milk.
        - id: ch01-b21
          speaker: mrs_wood
          text: >-
            That's how city people are cheated over milk. With the treatment those cows receive, I'm surprised you aren't poisoned. Even when someone examines your milk, the test can't show whether it is truly pure. New York law requires only thirteen percent solids in milk. That's absurd. A cow can be fed on swill and still produce milk with fourteen percent solids. The number may pass the law, but it tells you nothing about how the cow was treated. Oh, you city people are strange.
        - id: ch01-b22
          speaker: beautiful_joe
          text: Miss Laura laughed heartily.
        - id: ch01-b23
          speaker: miss_laura
          text: Auntie, you really are prejudiced against big towns.
        - id: ch01-b24
          speaker: mrs_wood
          text: >-
            Yes, I am. Sometimes I wish we could break up a few cities and spread their people through the country. Just look at these lovely farms around us. Some have only an old man and woman left on them. Their sons have gone to the cities to slave in shops and offices, growing pale and sickly. It would have broken my heart if Harry had chosen city life.
        - id: ch01-b25
          speaker: mrs_wood
          text: >-
            When I married your uncle, I spoke plainly to him. I said that my little boy was only a baby, but I wanted him raised to love country life. How were we going to do it? Your uncle's eyes twinkled. He called me a fine example of a country girl and suggested bringing Harry up exactly as I had been. I knew he was teasing, but I became quite worked up.
        - id: ch01-b26
          speaker: mrs_wood
          text: >-
            I told him to follow my parents' example. We should own a farm twice as large as we could manage and never hire a man. We should rise at daylight, work like slaves until dark, and never take a holiday. The girls could do all the housework, tend the hens, and help gather fruit. The boys could care for the colts and calves, while every penny they earned went straight into the bank. We shouldn't take any newspapers, because reading them would waste time. And since the post office was too far away, we should go there no more than once a week. I went on like that, though I don't remember everything else I said.
        - id: ch01-b27
          speaker: mrs_wood
          text: >-
            Your uncle roared with laughter. He said his farm was too large, and he meant to sell part of it and enjoy life a little more. That very week he sold fifty acres. He hired another man and found a good girl to help me. Twice a week, he stopped work in the afternoon and took me driving.
        - id: ch01-b28
          speaker: mrs_wood
          text: >-
            Little Harry held the reins in his tiny hands. John told him that Dolly, the old mare pulling us, belonged to him. The next horse John bought would be Harry's, too. Harry could name it and keep it as his own. He would also have five sheep, his own bankbook, and accounts to manage. Harry understood, though he was only a baby. From that day on, he loved John like his own father.
        - id: ch01-b29
          speaker: mrs_wood
          text: >-
            If my father had possessed John's wisdom, one of his sons wouldn't be a poor lawyer and the other a poor doctor, living in two different cities. Our old farm wouldn't be in the hands of strangers, either. Visiting it makes me sick. I picture my poor mother lying in the churchyard, her red hands folded over her. I think of the boys so far away, and of my father always rushing us and driving us to work. I can tell you, Laura, the fault lies on both sides. It isn't entirely the boys' fault when they leave the country.
          emotion: sad
        - id: ch01-b30
          speaker: beautiful_joe
          text: >-
            Mrs. Wood fell silent after that long speech, and Miss Laura said nothing. I walked once or twice along the stable, thinking. However happy people may seem, they always have something troubling them. I felt sorry for Mrs. Wood. Her usual cheerful look had left her face. Before long, though, she put her sorrow aside.
        - id: ch01-b31
          speaker: mrs_wood
          text: I must go and prepare tea now. Adele has the afternoon off.
        - id: ch01-b32
          speaker: miss_laura
          text: I'll come too. I promised Adele I'd make the biscuits for tea tonight and give you a rest.
        - id: ch01-b33
          speaker: beautiful_joe
          text: >-
            They strolled slowly down the plank walk toward the house, and I followed them.
