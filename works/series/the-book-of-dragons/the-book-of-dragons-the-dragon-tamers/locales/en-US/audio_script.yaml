  chapters:
    - id: ch01
      title: VI. The Dragon Tamers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was an ancient castle. Its walls, towers, gates, and arches had fallen into ruins, and only two little rooms remained. John the blacksmith made his home and forge there because he was poor, and the long-dead lords of the castle could ask no rent.
        - id: ch01-b02
          speaker: narrator
          text: >-
            John blew his bellows, hammered his iron, and took whatever work came his way. But not much came. The town mayor was also a blacksmith, and his business was very grand. His huge forge faced the town square. Twelve apprentices hammered there like a whole nest of woodpeckers, while twelve journeymen ordered them about. He even had a patent forge, a hammer that worked by itself, and electric bellows. Everything about the place looked handsome and important. Naturally, whenever anyone needed a horse shod or a broken shaft mended, they went to the mayor. John struggled along on a few odd jobs from travelers and strangers who had not heard how superior the mayor's forge was.
        - id: ch01-b03
          speaker: narrator
          text: >-
            John's two rooms were warm and kept out the weather, though they were very small. That was why he stored his scrap iron, odds and ends, bundles of firewood, and twopence worth of coal in the great dungeon beneath the castle. It was a splendid dungeon, with a high vaulted roof and huge iron rings fixed firmly into the walls, ready for tying up prisoners. At one end stood a broken flight of broad steps. No one knew where they went. Even the castle lords in the good old days had never known. Every so often, in a cheerful and hopeful spirit, they kicked a prisoner down to investigate. The prisoners never came back. John had never dared go beyond the seventh step. Neither have I, so I know no more about the bottom than he did.
        - id: ch01-b04
          speaker: narrator
          text: >-
            John lived with his wife and their little baby. When his wife was not cleaning or cooking, she nursed the child and cried. She remembered the happier days when she lived far out in the country with her father, who kept seventeen cows. In those days John came courting on summer evenings. He looked as smart as could be, with a little bunch of flowers in his buttonhole. Those evenings seemed far away now. John's hair was turning gray, work rarely came to the forge, and there was hardly ever enough food in the two little rooms.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The baby cried at all sorts of times. At night, as soon as its mother settled down, it always began again. The baby could sleep by day, but its poor mother still had work to do. She was worn out with work and worry, and whenever she had a free moment, she sat and cried.
        - id: ch01-b06
          speaker: narrator
          text: >-
            One evening John stood working at his forge. He was making a shoe for a very rich lady's goat. The lady wanted to discover two things before she ordered a whole set. First, would the goat enjoy being shod? Second, would a single shoe cost fivepence or sevenpence? This one doubtful goat shoe was the only order John had received all week. While he worked, his wife sat nursing the baby. For a wonder, the child was not crying. The bellows blew, the hammer struck, and the iron rang. Then, through all that familiar forge noise, another sound appeared. John stopped and looked at his wife. His wife looked back at him.
        - id: ch01-b07
          speaker: john
          text: >-
            I didn't hear anything.
        - id: ch01-b08
          speaker: wife
          text: >-
            Neither did I.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The sound grew louder. Neither of them wanted to admit it was real. John hammered that little goat shoe harder than he had ever hammered anything in his life. His wife began singing to the baby, though worry had kept her from singing for weeks. The bellows blew, the hammer clanged, and her song filled the room. Yet the other sound pushed through them all and grew louder still. Once they heard it clearly, they could no longer pretend. It sounded like some enormous creature purring, purring, purring. Worst of all, it came from the dungeon below, beside their iron, firewood, coal dust, and the broken steps that ended no one knew where.
        - id: ch01-b10
          speaker: john
          text: >-
            It can't be coming from the dungeon. I have to go down for coal in a minute.
        - id: ch01-b11
          speaker: wife
          text: >-
            Of course there's nothing there. How could there be?
        - id: ch01-b12
          speaker: narrator
          text: >-
            They tried so hard to believe that the dungeon was empty that they almost succeeded. Then John took a shovel, a riveting hammer, and the old stable lantern.
        - id: ch01-b13
          speaker: john
          text: >-
            I'm not carrying the hammer because I expect anything down there. It is useful for breaking big lumps of coal.
        - id: ch01-b14
          speaker: wife
          text: >-
            I understand perfectly.
        - id: ch01-b15
          speaker: narrator
          text: >-
            She had carried that coal home in her apron and knew it was nothing but dust. John went down the winding stairs and raised the lantern. Half the dungeon looked as it always did. The other half was completely full of Dragon.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The creature could only have climbed those dreadful broken steps from goodness knew where. John said this silently to himself because he did not care to discuss it with the Dragon. Every part of him trembled as he turned and tried to creep back up the winding staircase. He moved as softly as he could, one careful step at a time. But the Dragon was much quicker. A great claw flashed out across the dungeon and closed around John's leg. As the creature moved, its body rattled like an enormous bunch of keys, or like the sheets of iron used to make thunder in a stage play.
        - id: ch01-b17
          speaker: dragon
          text: >-
            Oh no, you don't.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Its voice spluttered like a damp firework.
        - id: ch01-b19
          speaker: john
          text: >-
            Dear, dear. What an end for a respectable blacksmith!
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: >-
            That remark caught the Dragon's attention.
        - id: ch01-b21
          speaker: dragon
          text: >-
            Would you mind saying that once more?
        - id: ch01-b22
          speaker: john
          text: >-
            Here is a nice end for a respectable blacksmith.
        - id: ch01-b23
          speaker: dragon
          text: >-
            I didn't realize. Well, imagine that! You are exactly the man I need.
        - id: ch01-b24
          speaker: john
          text: >-
            I thought that was what you meant the first time.
        - id: ch01-b25
          speaker: dragon
          text: >-
            No, no. I want you to do some work. A few rivets have fallen out of my wing, just above the joint. Can you repair it?
        - id: ch01-b26
          speaker: john
          text: >-
            I may be able to, sir.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Even with a Dragon, John knew he must be polite to a possible customer.
        - id: ch01-b28
          speaker: dragon
          text: >-
            A master craftsman can spot the trouble at once. You are a master, aren't you? Come around and feel the plates.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The Dragon took away its claw, and John timidly made his way around the enormous body. Sure enough, one wing hung loose. Several of the overlapping plates just above the joint had lost their rivets and were pulling apart. Almost the whole Dragon was covered in iron armor. The metal was a tawny, rusty red, probably from living so long in that damp place. Beneath the armor, John could just make out something that looked soft and furry. A moment before, he had seen only a monster. Now he saw loose plates, empty rivet holes, and a repair he understood. All the blacksmith in John rose into his heart, and his hands stopped shaking quite so badly.
        - id: ch01-b30
          speaker: john
          text: >-
            You certainly need rivets, sir. Quite a lot of them.
        - id: ch01-b31
          speaker: dragon
          text: >-
            Then begin. Mend my wing, and afterward I'll eat the whole town. If you do excellent work, I'll eat you last.
        - id: ch01-b32
          speaker: john
          text: >-
            I would rather not be eaten last, sir.
        - id: ch01-b33
          speaker: dragon
          text: >-
            Then I'll eat you first.
        - id: ch01-b34
          speaker: john
          text: >-
            I don't want that either.
        - id: ch01-b35
          speaker: dragon
          text: >-
            You foolish man, you don't know what you want. Get on with the work.
        - id: ch01-b36
          speaker: john
          text: >-
            The truth is, sir, I don't like this job. Accidents happen. Everything begins politely, but then a rivet pinches. A gentleman jumps and snorts, and one snort from you would finish me before apologies could help.
        - id: ch01-b37
          speaker: dragon
          text: >-
            You have my word of honor as a Dragon.
        - id: ch01-b38
          speaker: john
          text: >-
            I know you wouldn't mean to hurt me. Still, anyone jumps when pinched. Suppose you let me fasten you first?
        - id: ch01-b39
          speaker: dragon
          text: >-
            That would be terribly undignified.
        - id: ch01-b40
          speaker: john
          text: >-
            We always fasten a horse, and everyone calls the horse a noble animal.
        - id: ch01-b41
          speaker: dragon
          text: >-
            But how do I know you'll release me afterward? Leave something you value as a pledge. What matters most to you?
        - id: ch01-b42
          speaker: john
          text: >-
            My hammer. A blacksmith is nothing without one.
        - id: ch01-b43
          speaker: dragon
          text: >-
            You need that to mend me. Choose something else, quickly, or I'll eat you first.
        - id: ch01-b44
          speaker: narrator
          text: >-
            At that moment the baby began to scream upstairs. Its mother had been quiet, so the baby supposed she had gone to sleep and the proper crying time had arrived. The Dragon started, and every plate rattled.
        - id: ch01-b45
          speaker: dragon
          text: >-
            What in the world is that?
          emotion: surprised
        - id: ch01-b46
          speaker: john
          text: >-
            Only the baby.
        - id: ch01-b47
          speaker: dragon
          text: >-
            What is a baby? Do you value it?
        - id: ch01-b48
          speaker: john
          text: >-
            Yes, sir. Very much.
        - id: ch01-b49
          speaker: dragon
          text: >-
            Bring it down. I'll guard it while you rivet me, and then you may tie me up.
        - id: ch01-b50
          speaker: john
          text: >-
            Very well, but I must warn you. Babies are poisonous to Dragons. Touching is safe, but don't put it in your mouth. I wouldn't want harm to come to such a fine-looking gentleman.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The compliment made the Dragon purr.
        - id: ch01-b52
          speaker: dragon
          text: >-
            I'll be careful. Go and fetch the creature.
        - id: ch01-b53
          speaker: narrator
          text: >-
            John hurried up the winding stairs as quickly as his legs would carry him. He knew that he had to move before the Dragon became impatient. Though it was chained to nothing yet, the creature could lift its back once, heave up the dungeon roof, and kill the whole family beneath the falling ruins. Upstairs, John's exhausted wife had somehow fallen asleep in spite of the baby's cries. John gently lifted the screaming child without waking her. Then he carried the baby down through the forge, along the twisting stairs, and into the dungeon. He placed it carefully on the stone floor between the Dragon's two enormous front paws.
        - id: ch01-b54
          speaker: john
          text: >-
            Just purr to the baby, sir. Then it will behave beautifully.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The Dragon purred, and the delighted baby stopped crying. John searched the old iron and found heavy chains and a great collar. They had been made when craftsmen sang over their work and put their hearts into it, so they were strong enough to last a thousand years and hold a Dragon besides. John locked them safely around the Dragon, then counted the missing rivets.
        - id: ch01-b56
          speaker: john
          text: >-
            Six, eight, ten, twenty, forty. I haven't nearly enough. Excuse me while I borrow a few dozen from another forge. I won't be long.
        - id: ch01-b57
          speaker: narrator
          text: >-
            He left the baby crowing happily between the Dragon's paws and raced into town. He found the mayor and the corporation and told them he had chained a Dragon in his dungeon.
        - id: ch01-b58
          speaker: john
          text: >-
            Come and help me rescue my baby.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Every one of them happened to have plans that evening. They praised John's cleverness and said he could manage perfectly well.
        - id: ch01-b60
          speaker: john
          text: >-
            But what about my baby?
        - id: ch01-b61
          speaker: mayor
          text: >-
            If anything happens, you can always remember that your child died for a worthy cause.
        - id: ch01-b62
          speaker: narrator
          text: >-
            John returned and told his wife part of the story.
        - id: ch01-b63
          speaker: wife
          text: >-
            You gave our baby to a Dragon! What kind of father are you?
          emotion: angry
        - id: ch01-b64
          speaker: john
          text: >-
            Quiet. Listen to the rest. I'll go down first. Then you must go, keep your head, and the baby will be safe.
        - id: ch01-b65
          speaker: narrator
          text: >-
            In the dungeon, the Dragon was still purring with all its strength.
        - id: ch01-b66
          speaker: dragon
          text: >-
            Can't you hurry? I cannot make this noise all night.
        - id: ch01-b67
          speaker: john
          text: >-
            I'm sorry, sir, but the shops are closed. The repair must wait until morning. Remember your promise to mind the baby. It may be tiring. Good night.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The Dragon had purred until it was completely out of breath. As soon as John left, it stopped to rest. The dungeon became quiet. The baby took that silence to mean that everyone had settled down for the night, so naturally it was time to begin screaming. It opened its mouth and cried with all its strength. The sound bounced from the vaulted roof and echoed around the stone walls while the Dragon stared helplessly down at the tiny creature between its paws.
        - id: ch01-b69
          speaker: dragon
          text: >-
            Oh dear, this is dreadful. And I am so tired. I had hoped for a good night.
        - id: ch01-b70
          speaker: narrator
          text: >-
            It patted the baby with one claw, which only made the screams louder.
        - id: ch01-b71
          speaker: dragon
          text: >-
            I'll never have peace again. My nerves will be ruined. Hush now, little one. Hush-a-by, Dragon...
        - id: ch01-b72
          speaker: narrator
          text: >-
            The Dragon tried soothing it like a young Dragon, but the singing made the baby scream harder. Then it noticed a woman sitting on the steps.
        - id: ch01-b73
          speaker: dragon
          text: >-
            Do you understand babies at all?
        - id: ch01-b74
          speaker: wife
          text: >-
            A little.
        - id: ch01-b75
          speaker: dragon
          text: >-
            Please take this one so I can sleep. Bring it back before the blacksmith arrives in the morning.
        - id: ch01-b76
          speaker: narrator
          text: >-
            The mother came down from the steps, lifted her baby out from between the Dragon's claws, and carried it upstairs. She told John everything the Dragon had said. Their trick had worked exactly as John hoped. The ancient chains still held, the Dragon had willingly surrendered the child, and no one had been burned or eaten. For the first time that night, husband and wife could breathe easily. They put the baby safely to bed and went to sleep happy, because they had managed both things that mattered. They had caught the Dragon, and they had saved their child.
        - id: ch01-b77
          speaker: narrator
          text: >-
            The next day John carefully explained the situation to the Dragon. He fitted an iron gate across the foot of the stairs. The Dragon howled for days, but when that did no good, it became quiet. Then John went to the mayor.
        - id: ch01-b78
          speaker: john
          text: >-
            I caught the Dragon and saved the town.
        - id: ch01-b79
          speaker: mayor
          text: >-
            Our noble savior! We shall collect a reward for you and crown you in public with laurel leaves.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The mayor put his name down for five pounds. Each member of the corporation offered three, and the other townspeople gave guineas, half-guineas, half-crowns, and crowns. While they collected the money, the mayor paid the town poet to write three poems for the occasion. The poems delighted the mayor and the corporation. The first celebrated the mayor's noble conduct in arranging for the Dragon to be tied up. The second described all the splendid help the corporation had given. The third expressed the poet's pride in being allowed to sing of such glorious deeds. Beside those deeds, it said, even Saint George's adventures must seem ordinary to anyone with a feeling heart and a properly balanced brain.
        - id: ch01-b81
          speaker: narrator
          text: >-
            By the time the collection ended, it had reached a thousand pounds. A committee was formed to decide how the money should be used. One third paid for a banquet for the mayor and the corporation. Another third bought a gold collar decorated with a Dragon for the mayor, and gold Dragon medals for every corporation member. All the money left over went toward the committee's expenses. So John the blacksmith received none of the thousand pounds. He had only his laurel wreath and the private knowledge that he, and no one else, had truly saved the town.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Still, life slowly improved for the blacksmith. To begin with, the baby did not cry as much. Then the rich lady who owned the goat was so touched by John's courage that she ordered the complete set of shoes for two shillings and fourpence. In grateful recognition of his public spirit, she even made the payment up to two shillings and sixpence. Tourists began arriving in large horse-drawn parties from quite far away. Each paid twopence to walk down the steps and peer through the iron grating at the rusty Dragon. A whole party paid threepence extra if John lit some colored fire to see it by. The fire burned for very little time, so John cleared twopence-halfpenny on every display. His wife served the visitors tea for ninepence a head. Altogether, their life grew brighter week after week.
        - id: ch01-b83
          speaker: narrator
          text: >-
            The baby was named John after his father, though everyone called him Johnnie. Before long he began to grow up. His best friend was Tina, the daughter of the whitesmith who lived almost opposite the forge. She was a dear little girl with yellow pigtails and blue eyes. By then she had heard the story of how a real Dragon once minded Johnnie when he was a baby far too many times. The two children often went down together to peer through the iron grating. Sometimes they heard the lonely Dragon mewing pitifully in the dark. They would spend a halfpenny on colored fire, light it, and look at the great rusty creature by the strange glow. The years passed, and both children grew older and wiser.
        - id: ch01-b84
          speaker: narrator
          text: >-
            At last, one day, the mayor and all the corporation went out hunting a hare in their splendid gold robes. Before long they came screaming back toward the town gates. Behind them, far out on the marshes, a Giant was approaching. He limped on one leg and carried a great hump on his back. Even at a distance he looked as big as a church made of tin, and with every step he came nearer to the town.
        - id: ch01-b85
          speaker: mayor
          text: >-
            We are doomed! I can tell by his teeth what he eats. I'll pay a thousand pounds to anyone who keeps him out of town.
          emotion: fearful
        - id: ch01-b86
          speaker: narrator
          text: >-
            No one in the frightened crowd had the least idea what to do. Johnnie and Tina had heard the mayor's promise, and they were listening closely. They looked straight at each other. Neither child needed to explain the plan aloud. They turned together and ran as fast as their boots could carry them, through the streets, into John's forge, and down the familiar winding steps. At the bottom, the old iron gate still stood between the town and the prisoner it had almost forgotten. The children went up to the grating and knocked.
        - id: ch01-b87
          speaker: dragon
          text: >-
            Who is there?
        - id: ch01-b88
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            Only us.
        - id: ch01-b89
          speaker: narrator
          text: >-
            After ten lonely years, the Dragon was terribly bored.
        - id: ch01-b90
          speaker: dragon
          text: >-
            Come in, my dears.
        - id: ch01-b91
          speaker: tina
          text: >-
            You won't hurt us or breathe fire at us, will you?
        - id: ch01-b92
          speaker: dragon
          text: >-
            I would not dream of it.
        - id: ch01-b93
          speaker: narrator
          text: >-
            They entered and told the Dragon about the weather and the news.
        - id: ch01-b94
          speaker: johnnie
          text: >-
            There is a lame Giant in town. He is looking for you.
        - id: ch01-b95
          speaker: dragon
          text: >-
            Is he? If only I were free!
        - id: ch01-b96
          speaker: johnnie
          text: >-
            If we released you, perhaps you could escape before he caught you.
        - id: ch01-b97
          speaker: dragon
          text: >-
            Perhaps. Then again, perhaps not.
        - id: ch01-b98
          speaker: tina
          text: >-
            You wouldn't actually fight him, would you?
        - id: ch01-b99
          speaker: dragon
          text: >-
            Certainly not. I believe in peace. Let me out and you'll see.
        - id: ch01-b100
          speaker: narrator
          text: >-
            The children opened the padlocks and pulled away the chains that had held the Dragon for ten years. Then they unfastened the enormous iron collar. Once free, the Dragon stretched itself in the cramped dungeon. It could not fit up the winding staircase, so it simply broke down one end of the underground room and forced a new way into the open air. Before setting off, it paused at the forge door. Its wing still needed the repair that had started the whole adventure, and John the blacksmith finally put the missing rivets into place.
        - id: ch01-b101
          speaker: narrator
          text: >-
            The Dragon met the lame Giant at the town gate. The Giant brought down his club on the Dragon as if he were hammering an entire iron foundry. The Dragon behaved like a smelting works in return, pouring out fire and smoke. It was a fearful sight. Everyone kept well back while they watched. The shock of every blow knocked the spectators right off their legs. Every time they fell, they scrambled up again at once, because however frightening the battle was, they could not bear to miss what happened next.
        - id: ch01-b102
          speaker: narrator
          text: >-
            The battle went on until at last the Dragon won. The beaten Giant turned away from the gate and sneaked back across the marshes, still lame and humped, until he vanished into the distance. The Dragon was terribly tired after the fight. It announced what it meant to do next, then went home to sleep. Home, to the Dragon, still meant the old dungeon beneath John's forge. After ten years as a prisoner, it was a stranger everywhere else in town and did not know of another place that could be called respectable lodging.
        - id: ch01-b103
          speaker: dragon
          text: >-
            In the morning, I shall eat the town.
        - id: ch01-b104
          speaker: narrator
          text: >-
            Johnnie and Tina went to the mayor and corporation.
        - id: ch01-b105
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            The Giant is gone. Please give us the thousand-pound reward.
        - id: ch01-b106
          speaker: mayor
          text: >-
            No, my boy. The Dragon defeated the Giant, not you. I assume you chained it up again. When the Dragon asks for the reward, it may have it.
        - id: ch01-b107
          speaker: johnnie
          text: >-
            It isn't chained yet. Shall I send it here to collect the money?
        - id: ch01-b108
          speaker: narrator
          text: >-
            The mayor decided that would not be necessary. Instead, he offered a thousand pounds to anyone who chained the Dragon again.
        - id: ch01-b109
          speaker: johnnie
          text: >-
            I don't trust you. I remember how you rewarded my father when he caught it.
        - id: ch01-b110
          speaker: narrator
          text: >-
            People listening outside had long wanted a new mayor.
        - id: ch01-b111
          speakers: [citizen_1, citizen_2]
          ensemble: duo
          text: >-
            Chain the Dragon again, Johnnie, and we'll throw out the mayor and put you in his place.
        - id: ch01-b112
          speaker: johnnie
          text: >-
            Done.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Johnnie and Tina went hand in hand to every child they knew.
        - id: ch01-b114
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            Will you help us save the town?
        - id: ch01-b115
          speakers: [child_1, child_2]
          ensemble: duo
          text: >-
            Of course! What fun!
          emotion: happy
        - id: ch01-b116
          speaker: tina
          text: >-
            Bring your bowls of bread and milk to the forge tomorrow at breakfast time.
        - id: ch01-b117
          speaker: johnnie
          text: >-
            If I become mayor, I will give a banquet for all of you. Every course will be something sweet.
        - id: ch01-b118
          speaker: narrator
          text: >-
            The children promised. The next morning Johnnie and Tina rolled a large washing tub down the winding stairs.
        - id: ch01-b119
          speaker: dragon
          text: >-
            What is making that noise?
        - id: ch01-b120
          speaker: tina
          text: >-
            Only a huge Giant breathing. He has gone past now.
        - id: ch01-b121
          speaker: narrator
          text: >-
            The town children arrived with their breakfasts. Tina poured all the bread and milk into the tub. When it was full, she knocked on the dungeon gate.
        - id: ch01-b122
          speaker: tina
          text: >-
            May we come in?
        - id: ch01-b123
          speaker: dragon
          text: >-
            Yes, please. It is very dull in here.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Nine other children helped them carry the tub inside. Then those children left, while Johnnie and Tina sat beside the Dragon and began to cry.
        - id: ch01-b125
          speaker: dragon
          text: >-
            What is in the tub, and why are you crying?
        - id: ch01-b126
          speaker: johnnie
          text: >-
            It is bread and milk. All of our breakfast.
        - id: ch01-b127
          speaker: dragon
          text: >-
            You won't need breakfast. As soon as I have rested, I am going to eat everyone in town.
        - id: ch01-b128
          speaker: tina
          text: >-
            Dear Mr. Dragon, please don't eat us. How would you feel if someone ate you?
        - id: ch01-b129
          speaker: dragon
          text: >-
            I would dislike it very much. But no one is going to eat me.
        - id: ch01-b130
          speaker: johnnie
          text: >-
            There is a Giant.
        - id: ch01-b131
          speaker: dragon
          text: >-
            I know. I fought him and beat him.
        - id: ch01-b132
          speaker: johnnie
          text: >-
            Another Giant has come. The one you fought was only his little boy. This one is half again as big.
        - id: ch01-b133
          speaker: tina
          text: >-
            Seven times as big.
        - id: ch01-b134
          speaker: johnnie
          text: >-
            Nine times as big. Taller than the church steeple.
        - id: ch01-b135
          speaker: dragon
          text: >-
            Oh dear. I did not expect that.
          emotion: fearful
        - id: ch01-b136
          speaker: tina
          text: >-
            The mayor told him where to find you. The Giant is sharpening his enormous knife so he can eat you. The mayor warned him you were a wild Dragon, but that was exactly what he wanted, served with bread sauce.
        - id: ch01-b137
          speaker: dragon
          text: >-
            How tiresome. Is that wet white mixture the bread sauce?
        - id: ch01-b138
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            Yes. Giants serve bread sauce only with wild Dragons. They serve tame Dragons with apple sauce and onion stuffing.
        - id: ch01-b139
          speaker: tina
          text: >-
            What a shame you aren't tame. Then he would never touch you.
        - id: ch01-b140
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            Good-bye, poor Dragon. Now you will learn how it feels to be eaten.
        - id: ch01-b141
          speaker: narrator
          text: >-
            They began crying again.
        - id: ch01-b142
          speaker: dragon
          text: >-
            Wait. Couldn't you tell him I am a tame Dragon? Say I am your poor, timid pet.
        - id: ch01-b143
          speaker: johnnie
          text: >-
            He wouldn't believe us. If you were our tame Dragon, we would keep you tied up. We could never risk losing such a pretty, precious pet.
        - id: ch01-b144
          speaker: narrator
          text: >-
            The Dragon begged them to bind it immediately. Johnnie and Tina used the same ancient collar and chains, made strong enough to bear any strain. Then they told the townspeople what they had done.
        - id: ch01-b145
          speaker: narrator
          text: >-
            The townspeople kept their promise. They turned out the old mayor, put Johnnie in his place, and gave him the office of mayor. Then Johnnie held the glorious feast he had promised the children, with sweet things from the first bite to the last. It began with Turkish delight and halfpenny buns. After that came oranges, toffee, coconut ice, peppermints, jam puffs, raspberry cordial, ice creams, and meringues. At the very end, when no sensible feast could have held anything more, they finished with bull's-eyes, gingerbread, and sharp acid drops.
        - id: ch01-b146
          speaker: narrator
          text: >-
            All of that was very pleasant for Johnnie and Tina. But if you are kind children with feeling hearts, perhaps you are thinking about the poor Dragon. It had been deceived and deluded. Once more it was chained in the dull dungeon, and it had nothing to do but think over every shocking untruth Johnnie had told. As it remembered how completely the children had tricked it, the captive Dragon began to weep. Great tears rolled down over the rusty armor plates. After a while it felt weak and faint. That can happen when anyone cries for a long time, especially when that person has eaten nothing for ten years or so.
        - id: ch01-b147
          speaker: narrator
          text: >-
            The Dragon dried its eyes and saw the tub. It wondered whether it might enjoy the damp white food that Giants liked. One taste led to another, and soon the bread and milk was gone.
        - id: ch01-b148
          speaker: narrator
          text: >-
            When tourists next came and Johnnie lit the colored fire, the Dragon spoke shyly.
        - id: ch01-b149
          speaker: dragon
          text: >-
            Excuse me for troubling you, but could I have a little more bread and milk?
        - id: ch01-b150
          speaker: narrator
          text: >-
            Johnnie arranged the matter at once. Every day, carts went around town and collected the children's bowls of bread and milk for the Dragon. Since their breakfasts now belonged to the town's unusual prisoner, the children were fed at public expense. They could choose whatever they pleased. Naturally, they chose cake, buns, and sweet things, and nothing else. They were perfectly satisfied with the arrangement and said that the poor Dragon was more than welcome to every drop of their bread and milk.
        - id: ch01-b151
          speaker: narrator
          text: >-
            After Johnnie had been mayor for about ten years, he married Tina. On their wedding morning they visited the Dragon. It had become quite tame. Many rusty plates had fallen away, revealing soft fur beneath, and they stroked it.
        - id: ch01-b152
          speaker: dragon
          text: >-
            I cannot imagine why I ever ate anything except bread and milk. I truly am tame now, aren't I?
        - id: ch01-b153
          speakers: [johnnie, tina]
          ensemble: duo
          text: >-
            Yes, you are.
        - id: ch01-b154
          speaker: dragon
          text: >-
            Then, since I am so tame, will you unfasten me?
        - id: ch01-b155
          speaker: narrator
          text: >-
            Some people might not have trusted it. But Johnnie and Tina were so happy that day, they could believe no harm of anyone. They loosened the chains.
        - id: ch01-b156
          speaker: dragon
          text: >-
            Excuse me for a moment. There are one or two things I would like to fetch.
        - id: ch01-b157
          speaker: narrator
          text: >-
            The Dragon went down the mysterious steps and vanished into the darkness, shedding more rusty plates as it moved. Soon they heard it clanking back. It carried a bag of gold in its mouth.
        - id: ch01-b158
          speaker: dragon
          text: >-
            This is useless to me. Perhaps you can use it.
        - id: ch01-b159
          speaker: narrator
          text: >-
            They thanked the Dragon warmly.
        - id: ch01-b160
          speaker: dragon
          text: >-
            There is plenty more.
        - id: ch01-b161
          speaker: narrator
          text: >-
            The Dragon went down again and returned with more gold. Then it fetched more, and more, and still more, until at last Johnnie and Tina had to tell it to stop. They were rich now, and so were their fathers and mothers. Indeed, there was enough treasure for everyone. Before long, every person in the town was rich and not one poor person remained. Of course, they had all become wealthy without doing any work, and that is very wrong. The blame must rest with the Dragon. It had never been to school, as you have, so no one had taught it any better.
        - id: ch01-b162
          speaker: narrator
          text: >-
            The Dragon followed Johnnie and Tina out of the dungeon into the golden and blue light of their wedding day. It blinked like a cat in sunshine and shook itself. The last plates dropped away, and the wings fell with them. What remained looked like an extraordinarily enormous cat.
        - id: ch01-b163
          speaker: narrator
          text: >-
            From that day it grew furrier and furrier, and it became the beginning of all cats. Nothing Dragon-like remained but the claws, which every cat still has, as you can easily discover.
        - id: ch01-b164
          speaker: narrator
          text: >-
            So now I hope you understand how important it is to feed your cat bread and milk. If you let it eat nothing but mice and birds, just think what could happen. It might grow larger and fiercer. It might become scalier, grow more tail, and finally sprout wings. Before you knew it, your cat might turn into the beginning of Dragons. And then we would have all that trouble over again.
