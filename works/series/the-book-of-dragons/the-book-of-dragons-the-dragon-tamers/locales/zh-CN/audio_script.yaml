audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    john:
      display_name: 约翰
      tts:
        delivery: 谦和谨慎，朴实中藏着机智
        timbre: 温厚而略显劳顿
        pace: 平稳
        pitch: 中低音
    wife:
      display_name: 约翰的妻子
      tts:
        delivery: 疲惫慈爱，遇事实际而坚定
        timbre: 柔和朴实
        pace: 从容
        pitch: 中音
    dragon:
      display_name: 龙
      tts:
        delivery: 自负敏感，一本正经又容易上当
        timbre: 低沉粗粝而洪亮
        pace: 稍慢
        pitch: 低音
    mayor:
      display_name: 镇长
      tts:
        delivery: 官腔十足，推诿时仍显得冠冕堂皇
        timbre: 圆润洪亮
        pace: 不紧不慢
        pitch: 中低音
    johnnie:
      display_name: 约翰尼
      tts:
        delivery: 机灵大胆，快活中带着主见
        timbre: 明亮稚嫩
        pace: 明快
        pitch: 中高音
    tina:
      display_name: 蒂娜
      tts:
        delivery: 自信机敏，俏皮而有办法
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 热心兴奋，充满玩兴
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 热心兴奋，回答干脆
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 高音
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 热心兴奋，语气欢快
        timbre: 柔亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 地牢里的呼噜声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一座老得不能再老的城堡。围墙、塔楼、角楼、大门和拱廊全塌成了废墟，昔日的富丽堂皇只剩两间小屋。穷铁匠约翰住不起正经房子，便在这里支起铁炉。城堡的历代领主早在许多年前就死光了，倒也没人来向他收租。于是他每天拉风箱、打铁，什么活找上门就做什么。
        - id: ch01-b02
          speaker: narrator
          text: 约翰每天拉风箱、挥锤子，送上门的活不管大小，他什么都肯接，可生意还是少得可怜。镇长也开铁匠铺，而且买卖做得很大。铺面正对着镇中心广场，十二个学徒同时敲锤，响起来像一整窝啄木鸟，还有十二个熟练工专门指挥他们。专利锻炉、自动锤、电动风箱，镇长样样都有，身边也样样气派。镇民要给马钉掌，或是修理车轴，自然全去找他。约翰只能勉强支撑，偶尔接些过路客和外乡人的零活，因为这些人还不知道镇长的铺子有多么了不起。
        - id: ch01-b03
          speaker: narrator
          text: 两间小屋虽暖和，也能遮风挡雨，却实在太窄。约翰只好把废铁、零碎杂物、柴捆和两便士的煤堆进城堡下面的大地牢。那地牢可气派得很。头顶是漂亮的拱顶，墙上砌着结实的大铁环，用来拴俘虏再方便不过。尽头还有一段残破的宽石阶，一直伸向谁也不知道的地方。美好旧时代的领主也不知道它通往哪里，不过，他们偶尔会轻轻松松又满怀希望地把一名囚犯踹下去。那些人果然再没回来。约翰只敢走到第七级，我也一样，所以石阶底下有什么，我们谁都不知道。
        - id: ch01-b04
          speaker: narrator
          text: 约翰有妻子，还有一个小宝宝。妻子不做家务时，常常抱着孩子落泪。她想起从前跟父亲住在真正的乡下，家里养着十七头牛。那时每到夏日黄昏，约翰会打扮得神气极了，扣眼里插着一小束花，来向她求爱。可如今约翰头发渐白，一家人几乎总吃不饱。
        - id: ch01-b05
          speaker: narrator
          text: 至于宝宝，它白天时不时要哭一场，夜里更准。妈妈刚刚躺下，准备睡觉，它就像理所当然似的开哭，害得她几乎得不到一点休息。宝宝夜里没睡好，白天只要愿意，随时都能补眠，苦命的妈妈却不行。劳作和忧愁把她累垮了，所以一有空，她便坐在那里掉泪。
        - id: ch01-b06
          speaker: narrator
          text: 一天傍晚，约翰正在炉边忙活。他要替一位极有钱的太太的山羊打一只蹄铁。那太太得先看看山羊究竟喜不喜欢钉掌，还要弄清这一只蹄铁究竟值五便士还是七便士，才肯下单订一整套。这是约翰整个星期里唯一接到的生意。他挥锤干活时，妻子坐在旁边抱着宝宝。说来也怪，这一回宝宝竟然没有哭。
        - id: ch01-b07
          speaker: narrator
          text: 炉火旁，风箱一直呼呼地吹，铁器也在锤下叮当作响。过了一会儿，这两种声音里面忽然夹进了另一个声响。夫妻俩同时停了停，彼此对望了一眼。
        - id: ch01-b08
          speaker: john
          text: 我什么也没听见。
        - id: ch01-b09
          speaker: wife
          text: 我也什么都没听见。
        - id: ch01-b10
          speaker: narrator
          text: 那声音却越来越响。两个人一心不肯听见它。约翰便使出平生最大的力气敲蹄铁，妻子也唱歌哄起宝宝来，她已经几个星期没心情唱了。可风箱越吹，锤子越敲，歌声越响，那声音就越清楚，像一头巨兽在呼噜、呼噜、呼噜。他们不肯相信自己真的听见了，因为声音偏偏来自下面的地牢。那里放着废铁、木柴和那两便士的煤，残破的石阶也从那里伸进黑暗，谁都不知道尽头在哪儿。
        - id: ch01-b11
          speaker: john
          text: 地牢里不可能有东西。可我马上还得下去添煤呢。
        - id: ch01-b12
          speaker: wife
          text: 当然什么也没有。那里怎么会有东西？
        - id: ch01-b13
          speaker: narrator
          text: 两人拼命叫自己相信地牢里绝不可能有东西。努力了一阵，他们差一点真的相信了。约翰这才一手拿起铲子，一手拿起铆钉锤，又把那盏旧马灯挂在小指上，准备走进地牢取煤。
        - id: ch01-b14
          speaker: john
          text: 我带锤子不是因为下面有东西。碰到大块煤，拿它敲碎正方便。
        - id: ch01-b15
          speaker: wife
          text: 我完全明白。
        - id: ch01-b16
          speaker: narrator
          text: 当天下午，煤正是她用围裙兜回来的，她明明知道那全是煤末。约翰沿着旋转楼梯下到地牢，站在最后一级台阶下面。他把马灯高高举过头顶，只是想确认地牢确实还像平常一样空。半边的确跟平常一样，除了废铁、零碎杂物、木柴和煤，什么也没有。可是另一边一点都不空，已经被什么东西塞得满满当当。塞满那半座地牢的，正是一条龙。
        - id: ch01-b17
          speaker: john
          text: 它准是从破石阶下面爬上来的，天知道是从哪里。
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: 约翰浑身发抖，想悄悄退回楼梯。龙却伸出巨爪扣住他的腿，身上的铁甲哗啦作响，像一大串钥匙，又像哑剧里制造雷声的铁皮。
        - id: ch01-b19
          speaker: dragon
          text: 想跑？没门。
        - id: ch01-b20
          speaker: narrator
          text: 龙的嗓音噼啪作响，活像一支受潮的爆竹。
        - id: ch01-b21
          speaker: john
          text: 哎呀呀！我这么一个本分铁匠，竟落得这样一个好下场！
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: 这句话似乎把龙打动了。
        - id: ch01-b23
          speaker: dragon
          text: 劳驾，你能把刚才的话再说一遍吗？
        - id: ch01-b24
          speaker: john
          text: 我——这——么——一——个——本——分——铁——匠——竟——落——得——这——样——一——个——好——下——场。
        - id: ch01-b25
          speaker: dragon
          text: 我可不知道。真没想到！你正是我要找的人。
        - id: ch01-b26
          speaker: john
          text: 你刚才那句话，我也是这么听的。
        - id: ch01-b27
          speaker: dragon
          text: 我的意思和你想的不一样。我有件活想请你做。一只翅膀的关节上方掉了几颗铆钉，你能修好吗？手艺高明的大师傅一眼就能看出毛病。你当然是大师傅吧？来摸摸我的甲片。
        - id: ch01-b28
          speaker: john
          text: 也许能，先生。
        - id: ch01-b29
          speaker: narrator
          text: 面对一位可能的主顾，总该客气，就算主顾是龙也一样。龙松开爪子，约翰战战兢兢地绕过去一看，翅膀果真松松垂着，关节旁好几片铁甲都该重新铆牢。龙似乎差不多全身裹着铁甲。甲片锈成黄褐色，多半是受了潮，甲片底下似乎还长着一层毛。约翰心里那股铁匠劲儿全涌了上来，胆子也跟着回来了。
        - id: ch01-b30
          speaker: john
          text: 您这里确实该补铆钉，先生。而且绝不止一两颗。
        - id: ch01-b31
          speaker: dragon
          text: 那就开工。你修好我的翅膀，我就出去吃掉全镇。要是活儿做得漂亮，我最后再吃你！
        - id: ch01-b32
          speaker: john
          text: 先生，我可不想最后一个被吃。
        - id: ch01-b33
          speaker: dragon
          text: 那我第一个吃你。
        - id: ch01-b34
          speaker: john
          text: 这个我也不想，先生。
        - id: ch01-b35
          speaker: dragon
          text: 你这傻瓜，连自己想要什么都不知道。别磨蹭，开工吧。
        - id: ch01-b36
          speaker: john
          text: 先生，我不愿接这活。万一铆钉底下夹疼您，或是不小心戳您一下，您一跳、一喷气，立刻就会又是火又是烟。到时候我再怎么赔不是也晚了。
        - id: ch01-b37
          speaker: dragon
          text: 我拿一条龙的名誉起誓。
        - id: ch01-b38
          speaker: john
          text: 我知道您不会故意伤我。可不论哪位绅士，忽然被夹疼都会跳一下、喷口气。您喷一口气就够要我的命了。要不，先让我把您拴起来？
        - id: ch01-b39
          speaker: dragon
          text: 那多不体面。
        - id: ch01-b40
          speaker: john
          text: 马也得拴起来，可马还是“高贵的动物”呢。
        - id: ch01-b41
          speaker: dragon
          text: 话是没错，可你修完以后不放我怎么办？押一样东西在这里。你最珍惜什么？
        - id: ch01-b42
          speaker: john
          text: 我的锤子。铁匠没有锤子，就什么也不是。
        - id: ch01-b43
          speaker: dragon
          text: 可你修翅膀还要用锤子。赶快另想一样，不然我先吃你。
        - id: ch01-b44
          speaker: narrator
          text: 楼上的宝宝这时尖叫起来。妈妈一直没动静，它以为夜里开哭的时候到了。龙吓得一哆嗦，浑身铁甲都响了。
        - id: ch01-b45
          speaker: dragon
          text: 那到底是什么？是你珍惜的东西吗？
        - id: ch01-b46
          speaker: john
          text: 只是宝宝。是的，先生，我相当珍惜它。
        - id: ch01-b47
          speaker: dragon
          text: 那就带下来。我替你看着，等你铆好翅膀，也准你把我拴住。
        - id: ch01-b48
          speaker: john
          text: 好的。不过我得提醒您，宝宝对龙有毒。摸它没关系，千万别放进嘴里。我可不愿您这样相貌堂堂的绅士出事。
        - id: ch01-b49
          speaker: narrator
          text: 龙听了恭维，高兴得打起呼噜。
        - id: ch01-b50
          speaker: dragon
          text: 我会小心。去把那东西拿来吧，不管它是什么。
        - id: ch01-b51
          speaker: narrator
          text: 约翰飞快跑上楼。他知道，龙若在被拴住前失去耐性，背上一使劲就能掀起地牢的屋顶，把一家人全压死在废墟里。妻子竟在宝宝的哭声里睡着了。约翰轻轻抱起孩子，一路带到地牢，把它放在龙的两只前爪之间。
        - id: ch01-b52
          speaker: john
          text: 您只管对它打呼噜，它马上就会乖乖的。
        - id: ch01-b53
          speaker: narrator
          text: 龙的呼噜果然逗得宝宝不哭了。约翰从废铁堆里翻出沉重的锁链和巨大的颈圈。那是很久以前打造的，那时候人们边干活边唱歌，把心也放进手艺里，造出的东西能承受一千年的重量，更别说一条龙。
        - id: ch01-b54
          speaker: narrator
          text: 约翰锁好颈圈和链子，这才数起铆钉。
        - id: ch01-b55
          speaker: john
          text: 六、八、十，二十、四十。铺里的铆钉连一半都不够。我去别家弄几十颗，先生，马上回来。
        - id: ch01-b56
          speaker: narrator
          text: 他拔腿就跑，留下宝宝在龙爪间听那响亮的呼噜，笑得咿咿呀呀。
    - id: ch02
      title: 英雄的奖赏
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约翰飞奔进镇，找到镇长和市政会的先生们。
        - id: ch02-b02
          speaker: john
          text: 我家地牢里有一条龙，我已经把它锁住了。请快来帮我救出宝宝！
        - id: ch02-b03
          speaker: narrator
          text: 他把事情全说了。偏巧那些先生当晚人人有约。他们大赞约翰聪明，还说这件事交给他办，大家再放心不过。
        - id: ch02-b04
          speaker: john
          text: 可我的宝宝怎么办？
        - id: ch02-b05
          speaker: mayor
          text: 万一真出了事，你至少永远可以记住，孩子是为一项伟大的事业牺牲的。
        - id: ch02-b06
          speaker: narrator
          text: 约翰回到家，只把一部分经过告诉妻子。
        - id: ch02-b07
          speaker: wife
          text: 你把宝宝交给龙了！你这个没天良的父亲！
          emotion: angry
        - id: ch02-b08
          speaker: john
          text: 小声点，先听我说。我要下去一趟，然后换你去。只要你别慌，孩子就不会有事。
        - id: ch02-b09
          speaker: narrator
          text: 约翰下到地牢，龙还在拼命打呼噜哄宝宝。
        - id: ch02-b10
          speaker: dragon
          text: 你就不能快点吗？这种声音我可弄不了一整夜。
        - id: ch02-b11
          speaker: john
          text: 对不起，先生，所有铺子都关了，只能明早再修。别忘了您答应照看宝宝。这事恐怕有点累人。晚安。
        - id: ch02-b12
          speaker: narrator
          text: 龙为了叫宝宝安静，已经拼命打了很久的呼噜，累得连气都快喘不上来。它终于停住。四周才刚安静，宝宝便认定人人都已经躺下过夜，自己理所当然又该开始了，于是立刻放声大哭。龙伸出大爪子，轻轻拍了拍宝宝。谁知这一拍，宝宝反而哭得更凶。
        - id: ch02-b13
          speaker: dragon
          text: 太糟了！我也累得要命，本来还盼着睡个好觉呢。
        - id: ch02-b14
          speaker: narrator
          text: 宝宝不停尖叫。
        - id: ch02-b15
          speaker: dragon
          text: 从今往后我别想清静了，神经都要给它毁掉。乖哦，不哭，小乖乖，不哭哦。
        - id: ch02-b16
          speaker: narrator
          text: 龙把宝宝当成小龙哄，还唱起《睡吧，小龙》。宝宝却越哭越凶。龙忽然看见台阶上坐着一个女人。
        - id: ch02-b17
          speaker: dragon
          text: 我怎么也哄不住。喂，你懂不懂怎样照看宝宝？
        - id: ch02-b18
          speaker: wife
          text: 略懂一点。
        - id: ch02-b19
          speaker: dragon
          text: 那就请你抱走它，让我睡一会儿。明早铁匠来以前，再送回来就好。
        - id: ch02-b20
          speaker: narrator
          text: 母亲走下石阶，抱起自己的宝宝，带它回到楼上，又把经过告诉丈夫。夫妻俩这才欢欢喜喜地上床睡觉，因为龙已经捉住，宝宝也平安救回。第二天，约翰又下到地牢，仔仔细细地向龙说明事情到底成了什么样。他弄来一扇带铁栅的铁门，牢牢装在台阶脚下。龙气得连续喵叫了好多天，可发现怎么闹也没有用，这才终于安静。
        - id: ch02-b21
          speaker: john
          text: 我捉住了龙，也救了全镇。
        - id: ch02-b22
          speaker: mayor
          text: 高贵的救星！我们要为你募捐，还要公开替你戴上月桂冠！
          emotion: happy
        - id: ch02-b23
          speaker: narrator
          text: 镇长先写下自己的名字，认捐五英镑。市政会的先生们每人捐三英镑，别人又捐出一基尼、半基尼、半克朗和一克朗。大家忙着认捐时，镇长还自掏腰包，请镇上的诗人写了三首诗，专门歌颂这件大事。这些诗得到的赞美比约翰多得多，尤其深受镇长和市政会先生们喜爱。
        - id: ch02-b24
          speaker: narrator
          text: 第一首歌颂镇长怎样高尚地安排众人捆龙。第二首赞美市政会给了多么辉煌的帮助。第三首则说，诗人获准歌颂这番伟业，心中多么骄傲快活。任何有一颗多情的心，或有一个平衡得当的头脑的人，都会觉得圣乔治的事迹比起来平淡无奇。
        - id: ch02-b25
          speaker: narrator
          text: 募捐结束时，钱恰好凑到一千英镑。大家马上成立委员会，专门决定这笔钱该怎么花。委员会拿三分之一给镇长和市政会办宴席，又拿三分之一给镇长买了一条带龙纹的金项圈，还给每一位市政会先生买了一枚龙纹金奖章。最后剩下的钱，全作了委员会自己的经费。约翰什么钱也没拿到，只有一顶月桂冠，还有一份无人能夺走的自知：真正救了全镇的人确实是他。
        - id: ch02-b26
          speaker: narrator
          text: 好在日子从此好过一点。首先，宝宝不再像从前那样爱哭。接着，山羊的主人被约翰的义举感动，花两先令四便士订了一整套蹄铁，还为了赞扬他一心为公，慷慨地凑成两先令六便士。后来，游客常常坐着四轮大马车，从很远的地方赶来。每人付两便士，就能沿台阶下地牢，隔着铁栅看一眼锈龙。每一拨人再付三便士，约翰就点一小簇彩焰给他们照亮。彩焰短得出奇，所以每次能净赚两便士半。妻子还按每人九便士供应茶点。总的说来，日子一星期比一星期亮堂。
        - id: ch02-b27
          speaker: narrator
          text: 宝宝也跟父亲一样取名约翰，大家叫他约翰尼。他渐渐长大，和差不多住在正对面的白铁匠的女儿蒂娜成了好友。蒂娜是个可爱的小姑娘，梳着两条金黄辫子，长着一双蓝眼睛。至于约翰尼小时候由一条真龙照看的故事，她早就听腻了。两个孩子常结伴去隔着铁栅看龙，有时会听见它可怜巴巴地喵叫。他们还会点燃价值半便士的彩焰，借着光瞧瞧它。他们就这样一年年长大，也一年年变得更聪明。
    - id: ch03
      title: 龙大战巨人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 终于有一天，镇长和市政会的先生们穿着金色长袍去猎野兔，忽然一路尖叫着逃回镇门。他们带来一个可怕的消息。一位跛脚、驼背的巨人，身躯足有一座铁皮教堂那么大，正穿过沼泽，一步步向镇上走来。
        - id: ch03-b02
          speaker: mayor
          text: 我们完了！谁能把巨人挡在镇外，我就给他一千英镑。我看看他的牙，就知道他吃什么。
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 大家束手无策。约翰尼和蒂娜互看一眼，飞跑进铁匠铺，冲下地牢，敲响铁门。
        - id: ch03-b04
          speaker: dragon
          text: 谁呀？
        - id: ch03-b05
          speaker: johnnie
          text: 是我们。
        - id: ch03-b06
          speaker: narrator
          text: 龙独自关了十年，实在闷坏了。
        - id: ch03-b07
          speaker: dragon
          text: 进来吧，孩子们。
        - id: ch03-b08
          speaker: tina
          text: 你不会伤害我们，也不会朝我们喷火吧？
        - id: ch03-b09
          speaker: dragon
          text: 无论如何也不会。
        - id: ch03-b10
          speaker: narrator
          text: 两个孩子这才走进地牢，陪龙好好聊了一阵。他们告诉它外面的天气如今是什么样，也把报纸上最近登的事情说给它听。聊到最后，约翰尼才像忽然想起似的，提到了镇上眼下的那桩大事。
        - id: ch03-b11
          speaker: johnnie
          text: 镇上来了一位跛脚巨人。他正找你。
        - id: ch03-b12
          speaker: dragon
          text: 是吗？我要是能出去就好了！
        - id: ch03-b13
          speaker: johnnie
          text: 我们放你出去，也许你能在他抓住你以前逃掉。
        - id: ch03-b14
          speaker: dragon
          text: 也许能。不过话说回来，也许不能。
        - id: ch03-b15
          speaker: tina
          text: 你总不会跟他打吧？
        - id: ch03-b16
          speaker: dragon
          text: 当然不打，我一向主张和平。放我出去，你们就知道了。
        - id: ch03-b17
          speaker: narrator
          text: 孩子们解开颈圈和锁链。龙撞塌地牢的一头，大摇大摆地走了出去。它经过铁匠铺门口时只停了一回，请约翰替它把翅膀铆好。随后，它在镇门口遇见巨人。巨人抡起大棒猛敲龙身，仿佛在敲一整座炼铁厂。龙也像一座冶炼厂那样应战，火焰和浓烟一齐往外喷。场面可怕极了。人们远远站着观看，每一记重击都震得他们双腿一软，倒在地上，可他们总要重新爬起来接着看。
        - id: ch03-b18
          speaker: narrator
          text: 龙终于打赢了。巨人灰溜溜地穿过沼泽逃走。龙也已经累坏，便回家去睡觉，还宣布自己明早要吃掉全镇的人。它又钻回旧地牢，因为它在镇上人生地不熟，不知道哪里还有别的体面住处。蒂娜和约翰尼这才去找镇长和市政会，索要先前许下的赏金。
        - id: ch03-b19
          speaker: tina
          text: 巨人的事解决了。请把一千英镑赏金给我们。
        - id: ch03-b20
          speaker: mayor
          text: 不，不。解决巨人的是龙，不是你们。你们已经重新锁住它了吧？等龙亲自来领，我自然把赏金给它。
        - id: ch03-b21
          speaker: johnnie
          text: 它还没锁起来。要不要我叫它来领钱？
        - id: ch03-b22
          speaker: narrator
          text: 镇长听说龙随时可以亲自来，赶紧回答说，完全用不着劳烦它跑这一趟。他也不再提把赏金交给龙的事，转过身又开出一千英镑的悬赏。这一回，谁能把龙重新锁好，钱就归谁。
        - id: ch03-b23
          speaker: johnnie
          text: 我不相信你。我父亲锁住龙以后，你是怎样对待他的，大家都知道。
        - id: ch03-b24
          speaker: narrator
          text: 门外一直有人偷听。这些镇民忍不住插话说，约翰尼若能再次锁住龙，他们就把现在的镇长赶下台，叫约翰尼接任。大家早已对镇长不满了一阵子，觉得眼下正好换一个。
        - id: ch03-b25
          speaker: johnnie
          text: 一言为定！
    - id: ch04
      title: 怎样驯服一条龙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 约翰尼牵着蒂娜，去找所有小伙伴。
        - id: ch04-b02
          speaker: johnnie
          text: 你们愿意帮我们拯救全镇吗？
        - id: ch04-b03
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 当然愿意！多好玩呀！
          emotion: happy
        - id: ch04-b04
          speaker: tina
          text: 明天早饭时，把你们的面包牛奶盆全带到铁匠铺来。
        - id: ch04-b05
          speaker: johnnie
          text: 等我当上镇长，就摆宴席请你们。整场宴席从头到尾，只吃甜食！
        - id: ch04-b06
          speaker: narrator
          text: 所有孩子都答应得好好的。到了第二天早上，蒂娜和约翰尼先找出家里的大洗衣盆。盆又大又笨重，两个人只好一路推着、滚着，把它沿那道弯弯曲曲的楼梯运进地牢。
        - id: ch04-b07
          speaker: dragon
          text: 那是什么声音？
        - id: ch04-b08
          speaker: tina
          text: 只是一位大巨人在喘气。现在已经走过去了。
        - id: ch04-b09
          speaker: narrator
          text: 到了早饭时间，全镇的孩子果真端来各自的面包牛奶。蒂娜把所有面包和牛奶都倒进洗衣盆。大盆装得满满以后，她走到那扇带铁栅的铁门前，伸手敲门。
        - id: ch04-b10
          speaker: tina
          text: 我们可以进来吗？
        - id: ch04-b11
          speaker: dragon
          text: 可以，这里闷得很。
        - id: ch04-b12
          speaker: narrator
          text: 他们走进地牢，又叫九个孩子一起来帮忙。大家费力把沉重的洗衣盆抬进去，放在龙的身边。接着，其他孩子全都离开了，只剩蒂娜和约翰尼。他们挨着大盆坐下，一起哭起来。
        - id: ch04-b13
          speaker: dragon
          text: 这是什么？你们为什么哭？
        - id: ch04-b14
          speaker: johnnie
          text: 这是面包牛奶，是我们的早饭，全部都在这里了。
        - id: ch04-b15
          speaker: dragon
          text: 我不明白你们还要早饭做什么。等我再休息一会儿，就会吃掉镇上所有人。
        - id: ch04-b16
          speaker: tina
          text: 龙先生，求您别吃我们。要是换成您被吃掉，您喜欢吗？
        - id: ch04-b17
          speaker: dragon
          text: 一点也不喜欢。不过谁也吃不了我。
        - id: ch04-b18
          speaker: johnnie
          text: 那可说不定。现在又来了一位巨人。
        - id: ch04-b19
          speaker: dragon
          text: 巨人的事我知道。我刚刚跟他打过，还把他揍跑了。
        - id: ch04-b20
          speaker: johnnie
          text: 你打的只是这位巨人的小儿子。新来的这个还要大上一半。
        - id: ch04-b21
          speaker: tina
          text: 他有先前那个七倍大。
        - id: ch04-b22
          speaker: johnnie
          text: 不，是九倍。他比教堂尖塔还高。
        - id: ch04-b23
          speaker: dragon
          text: 哎呀，我怎么没料到还有这回事。
          emotion: fearful
        - id: ch04-b24
          speaker: tina
          text: 镇长把你住的地方告诉了他。等他磨快大刀，马上就来吃你。镇长说你是野龙。那个巨人倒不介意，他说自己只吃野龙，还要蘸面包酱。
        - id: ch04-b25
          speaker: dragon
          text: 这可麻烦了。盆里这种湿乎乎、白糊糊的东西，就是面包酱吧？
        - id: ch04-b26
          speaker: johnnie
          text: 没错。面包酱只配野龙，驯龙要配苹果酱和洋葱馅。
        - id: ch04-b27
          speaker: tina
          text: 可惜你不是驯龙。要不然，他连看都不会看你一眼。再见了，可怜的龙。现在你也会知道被吃是什么滋味了。
        - id: ch04-b28
          speaker: narrator
          text: 两个孩子又哭起来。
        - id: ch04-b29
          speaker: dragon
          text: 等等！你们不能假装我是驯龙吗？就说我只是一条可怜、胆小的小驯龙，是你们养的宠物。
        - id: ch04-b30
          speaker: johnnie
          text: 他绝不会信。你若是我们养的驯龙，我们一定会把你拴好。像你这样又亲爱又漂亮的宠物，我们可舍不得弄丢。
        - id: ch04-b31
          speaker: narrator
          text: 龙听完这番话，立刻反过来央求孩子们，务必马上把自己牢牢拴住。约翰尼和蒂娜当然答应了。他们找来那副古老的颈圈和锁链，重新套到龙身上，一把把锁好。它们是在人人边工作边唱歌的年代造的。那时工匠肯把整颗心放进手艺，造出的东西结实得经得起任何拉扯。
        - id: ch04-b32
          speaker: narrator
          text: 孩子们离开地牢，把自己怎样重新锁住龙的经过告诉众人。约翰尼果真被推选为镇长，也完全照着诺言办了一场盛大的宴席，席上除了甜食什么也没有。开头是土耳其软糖和半便士小圆面包，接着吃橙子、太妃糖、椰蓉糖、薄荷糖、果酱酥皮点心、覆盆子甜酒、冰激凌和蛋白甜饼，最后还有牛眼糖、姜饼和酸味硬糖。
    - id: ch05
      title: 面包牛奶
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 对约翰尼和蒂娜来说，这一切当然好得很。可你若是个善良又有同情心的孩子，也许会替那条可怜的龙难过。它受了欺骗，被人愚弄，锁在沉闷的地牢里，什么事也做不了，只能反复想着约翰尼对它说过的那些骇人谎话。
        - id: ch05-b02
          speaker: narrator
          text: 可怜的囚龙越想自己怎样受了骗，就越伤心，最后忍不住哭了起来。大颗大颗的眼泪从脸上落下，沿着生锈的甲片一路往下滚。哭了一阵，它忽然觉得浑身发软，几乎要晕过去。人哭过以后有时也会这样，尤其是在差不多十年没吃过东西的时候。
        - id: ch05-b03
          speaker: narrator
          text: 可怜的家伙总算擦干眼睛，抬起头向四周看了看。那盆面包牛奶原来还放在旁边，一点也没有动。龙心里想，巨人既然爱吃这种湿乎乎、白糊糊的东西，自己说不定也会喜欢。于是它先小心尝了一点，没想到味道好极了。它越吃越香，最后把整整一大盆全吃光了。
        - id: ch05-b04
          speaker: narrator
          text: 下一拨游客到来时，约翰尼点起彩焰。龙有些害羞地开口了。
        - id: ch05-b05
          speaker: dragon
          text: 对不起，麻烦你了。能不能再给我带一点面包牛奶？
        - id: ch05-b06
          speaker: narrator
          text: 约翰尼便安排人们每天赶着大车，挨家挨户收集孩子们的面包牛奶，送给龙吃。孩子们改由镇上出钱养活，爱吃什么就可以吃什么。于是他们除了蛋糕、小圆面包和各式甜食，别的什么也不碰，还说那条可怜的龙尽管享用他们的面包牛奶，自己十分欢迎。
    - id: ch06
      title: 天下第一只猫
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 约翰尼当了大约十年镇长，后来和蒂娜结了婚。婚礼当天早上，两个人没有忘记那位地牢里的老朋友，特意一起去看龙。龙已经变得十分温顺，身上锈迹斑斑的甲片有些已经脱落。露出来的地方软绵绵、毛茸茸的，摸起来很舒服。于是，他们走到它身边，好好抚摸了一会儿。
        - id: ch06-b02
          speaker: dragon
          text: 除了面包牛奶，我从前怎么还会爱吃别的东西？我现在真的是一条驯龙了，对不对？
        - id: ch06-b03
          speaker: tina
          text: 对，你现在确实是一条驯龙。
        - id: ch06-b04
          speaker: dragon
          text: 我已经这么温顺了，你们愿不愿意替我松绑？
        - id: ch06-b05
          speaker: narrator
          text: 换作别人，或许不敢相信这条龙。可约翰尼和蒂娜在婚礼这天实在太幸福了。他们怎么也不肯相信，世上会有任何人对他们怀着恶意。于是，两人替龙解开了锁链。
        - id: ch06-b06
          speaker: dragon
          text: 请等我一下。我想去取一两样小东西。
        - id: ch06-b07
          speaker: narrator
          text: 龙转过身，朝那段谁也不知道通向哪里的神秘石阶走去。它一步步向下，很快消失在黑暗里。随着它走动，身上越来越多的锈甲松动、掉落。几分钟后，台阶下面又响起一阵哐啷声，而且越来越近。龙重新爬了上来，嘴里还衔着一样东西。两人仔细一看，原来是一袋金子。
        - id: ch06-b08
          speaker: dragon
          text: 这东西对我没用。也许你们用得着。
        - id: ch06-b09
          speaker: narrator
          text: 两人诚恳地向它道谢。
        - id: ch06-b10
          speaker: dragon
          text: 下面还有的是。
        - id: ch06-b11
          speaker: narrator
          text: 龙告诉他们，下面还有的是。它便一趟又一趟地来回，取来更多、更多、更多的金子，直到两人叫它停下。约翰尼和蒂娜成了富人，双方的父母也全都富了。说真的，人人都有了钱，镇上再也没有穷人。他们不用工作就全都富起来，这其实很不对。可龙不像你一样上过学，它哪里懂得这些道理呢？
        - id: ch06-b12
          speaker: narrator
          text: 龙离开地牢，跟在新婚夫妇身后，来到婚礼之日灿烂的金色和蓝色阳光里。它已经不知有多少年没见过这么明亮的日光，一时间很不习惯，便像一只忽然走到太阳底下的猫那样眨了眨眼。接着，它站稳四只脚，用力抖了抖全身。最后几片锈甲一下子掉落，连两只翅膀也跟着脱了下来。如今再从头到脚看它一遍，已经活像一只格外、格外巨大的猫。
        - id: ch06-b13
          speaker: narrator
          text: 从那一天起，它身上的毛越长越多，越长越柔软。后来，世上的猫全由它而来，它也就成了天下所有猫的始祖。原先属于龙的东西，到最后只剩下一双爪子。直到今天，每一只猫身上仍旧留着那样的爪子。你若不相信，只要找到身边的猫仔细瞧一瞧，很容易就能查验明白。
        - id: ch06-b14
          speaker: narrator
          text: 所以现在你该明白了，给自家的猫喂面包牛奶有多么重要。假如你什么别的东西都不给它，只让它整天吃老鼠和鸟，它也许会一点点越长越大，脾气越来越凶。接着，它身上的鳞片会越来越多，尾巴会越来越长，最后还会生出一对翅膀，重新变成最早的那一批龙。到那时候，为了龙闹出的所有麻烦，可就又要从头来一遍了。
