  chapters:
    - id: ch01
      title: 转错方向的王国
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 公主和园丁家的男孩正在后院玩。园丁家的男孩名叫汤姆，他忽然问起公主长大以后想做什么。
        - id: ch01-b02
          speaker: tom
          text: 公主，你长大以后想做什么？
        - id: ch01-b03
          speaker: mary_ann
          text: 我想嫁给你呀，汤姆。你会介意吗？
        - id: ch01-b04
          speaker: tom
          text: 不介意，也不怎么介意。只要那时候我有空，你愿意，我就娶你。
        - id: ch01-b05
          speaker: narrator
          text: 汤姆这样说，是因为他长大以后要做的事实在太多。他打算当将军、诗人、首相、海军上将，还要做土木工程师。眼下他门门功课都是全班第一，尤其擅长地理。玛丽·安公主则是个十分乖巧的小姑娘，人人都喜欢她。无论面对谁，她总是和善又有礼貌，哪怕那个人是她不大喜欢的詹姆斯舅舅。照公主的标准看，她算不上格外聪明，可她做功课总肯用心。就算明知不会做，也值得试一试。运气好的时候，居然真能把功课做完。
        - id: ch01-b06
          speaker: narrator
          text: 公主还有一副真正的好心肠，对宠物尤其温柔。河马玩闹时踩坏她的玩偶，她从不打它。后院小笼里的犀牛，她也一次不忘地喂。她的大象对她忠心得不得了。有时，她偷偷把这个可爱的小家伙带上床，让它睡在身边。小象把长鼻子亲昵地搭在她喉咙上，小脑袋靠在王家的右耳朵下面，这常常惹得奶妈发火。
        - id: ch01-b07
          speaker: narrator
          text: 公主一星期都表现得好，奶妈便准她在星期三一早请朋友们来，玩上一整天。她当然也偶尔淘气，所有活生生又讨人喜欢的真正孩子都会淘气，可她从来不坏。在那个国家，星期三就是一星期的最后一天。到了下午，小公爵、小公爵小姐、小侯爵和小伯爵小姐们吃完米布丁，也洗净了手和脸，奶妈照例要问一句，仿佛她猜不到回答似的。
        - id: ch01-b08
          speaker: nurse
          text: 好啦，亲爱的孩子们，今天下午想玩什么？
        - id: ch01-b09
          speakers: [noble_boy_1, noble_boy_2, noble_boy_3, noble_girl_1]
          ensemble: chorus
          text: 我们去动物园吧！骑大豚鼠，喂兔子，再听睡熟的睡鼠说梦话！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 大家脱下罩衫，一起去动物园。那里的豚鼠一回能驮二十个孩子。哪怕最小的孩子也能喂大兔子，只要有个好心的大人把孩子举起来就行。这样的好心人总能找到，因为罗通迪亚人人都很和善，只有一个人例外。
        - id: ch01-b11
          speaker: narrator
          text: 听到这里，你多半已经知道，罗通迪亚是个非常奇怪的王国。要是你肯动脑筋，当然不用我来点破。可万一你只差那么一点点没想到，我还是立刻告诉你吧。那里的动物，个头全都长错了。至于为什么，就得从很久很久以前说起。
        - id: ch01-b12
          speaker: narrator
          text: 当时，世界还只是一大团松散的泥土、空气、火和水，乱糟糟地搅在一起，像一锅布丁，还发疯似的不停旋转，拼命要把每一样东西送到该去的位置。忽然，一块圆圆的土地挣脱出来，独自在水面上打着转飞走了。那时的水也才刚铺开，正想变成真正的大海。圆土地一路使劲旋转，迎面撞上一根坚硬的长岩石。岩石也是从那团布丁一样的混合物里飞出来的，又硬又快，尖头一下子刺穿圆土地，从另一面穿了出去。两个东西合在一起，简直像一只大得太过分的陀螺。
        - id: ch01-b13
          speaker: narrator
          text: 这段话也许有点乏味，不过地理向来活泼不到哪儿去。哪怕讲童话，我也得偷偷塞给你一点知识，就像把药粉掺进果酱里。那根尖岩石撞得太猛，推着圆土地一起在空中旋转。当时，空气也忙着寻找自己的位置。可惜它们忘了自己原来朝哪边转，竟转反了方向。不久，负责管理这一切的巨人“重心”在大地中央醒了过来。
        - id: ch01-b14
          speaker: center_of_gravity
          text: 快一点！赶紧下来，老老实实躺好，不行吗？
        - id: ch01-b15
          speaker: narrator
          text: 于是岩石带着圆土地掉进海里。岩石尖端正好插进石质海床的一个洞，那个洞大小刚刚合适。它们朝错误的方向转了七圈，总算停住。几百万年以后，这块圆土地便成了罗通迪亚王国。
        - id: ch01-b16
          speaker: narrator
          text: 地理课讲完了。接着还要上一小会儿博物课，免得刚才的时间全白花。岛屿既然转反了，岛上动物长大时，个头自然也全长反了。那里的豚鼠跟我们的大象一般大。那里的大象却是可爱的小宠物，只有女士手笼里那种黑褐色小狗那么大。兔子差不多赶得上我们的犀牛，挖出来的洞也像铁路隧道那么宽。
        - id: ch01-b17
          speaker: narrator
          text: 睡鼠当然是最大的动物。我实在说不出它有多大，你就算拼命想象大象也没有用。幸好全岛只有一只睡鼠，而且它总在睡觉，不然罗通迪亚人一定受不了。人们替它盖了一座房子，还因此省下一支铜管乐队的钱。只要睡鼠说起梦话，再响的乐队也别想让人听见。岛上的男人、女人和孩子倒是正常大小，因为动物长成、岛屿安定了很久以后，他们的祖先才跟随征服者渡海过来。
        - id: ch01-b18
          speaker: narrator
          text: 博物课也到这里。要是刚才你认真听了，现在你对罗通迪亚的了解，已经胜过岛上绝大多数人。只有三个人比你知道得多。一个是学校总长，一个是公主那位当魔法师的舅舅。他不用学习就什么都知道。第三个，便是园丁的儿子汤姆。
        - id: ch01-b19
          speaker: narrator
          text: 汤姆在学校里学得最多，因为他很想拿奖。学校总长预备了一部装帧精美的《罗通迪亚史》，书脊上印着王家纹章。不过，公主说过长大后要嫁给汤姆。汤姆认真想了想，认定世界上最好的奖品其实是公主，而他下定决心要得到这份奖品。一个园丁的儿子既然打算迎娶公主，自然会发现，学校里的知识越多越好。
        - id: ch01-b20
          speaker: narrator
          text: 小公爵和小侯爵们不来喝茶时，公主总跟汤姆一起玩。汤姆告诉她，自己几乎肯定会考第一。公主高兴地拍起手来。
        - id: ch01-b21
          speaker: mary_ann
          text: 亲爱的汤姆，你又善良又聪明，所有奖品都该归你。我要把宠物大象送给你。等我们结婚的时候，你再把它还给我。
        - id: ch01-b22
          speaker: narrator
          text: 小象名叫菲多。汤姆把它放进外套口袋，带回了家。菲多身长不过六英寸，却聪明得不得了。哪怕它有一英里高，也不可能更加聪明。它舒舒服服地躺在汤姆口袋里。汤姆伸手进去，它便用小鼻子缠住他的手指。那份满怀爱意的信赖，让汤姆打心底喜欢上这个新伙伴。
        - id: ch01-b23
          speaker: narrator
          text: 汤姆有了小象，也有了公主的爱，第二天还要领到那部封面印着王家纹章的《罗通迪亚史》。他兴奋得几乎整夜没有合眼。再说，那条狗也叫得实在太吓人。罗通迪亚只有一条狗，因为王国养不起第二条。它是一只墨西哥哈巴狗。在世界大多数地方，这种狗从可爱的小鼻尖到宝贝尾巴尖只有七英寸。可在罗通迪亚，它大得让人怎么也不肯相信。
        - id: ch01-b24
          speaker: narrator
          text: 它一叫，巨大的声音便把整夜塞得满满的，再也放不进睡眠、梦境、客气的谈话，或是别的任何东西。岛上的事从来不能惹它叫，它的心胸可没那么狭窄。可若有船在黑暗里冒冒失失地经过，一头撞上岛尾的礁石，它就会叫一两声，好让那些船明白，这里可不是它们想怎么玩就怎么玩的地方。
        - id: ch01-b25
          speaker: narrator
          text: 偏偏这一夜，哈巴狗叫个没完。公主被吵得困极了。
        - id: ch01-b26
          speaker: mary_ann
          text: 哎呀，它要是别再叫就好了。我真困死了。
        - id: ch01-b27
          speaker: narrator
          text: 汤姆却在想，究竟出了什么事。他决定等天一亮，立刻出去看看。
    - id: ch02
      title: 石柱旁的紫龙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天边才泛起好看的粉红和嫩黄，汤姆就起床出门了。墨西哥哈巴狗还在不停地吠，震得房屋发抖，宫殿屋顶的瓦片哗啦作响，像一匹欢蹦乱跳的马拉着车，车上的牛奶罐撞个不停。
        - id: ch02-b02
          speaker: narrator
          text: 汤姆穿过城镇，决定去石柱那里看看。石柱就是几百万年前刺穿罗通迪亚、让它转错方向的那根岩石露在地面上的尖端。它正好立在岛中央，又高得不得了。爬到柱顶，当然比站在地面看得远。
        - id: ch02-b03
          speaker: narrator
          text: 汤姆走出城镇，穿过起伏的草地。清晨明亮，草叶沾满露水。兔子正带着幼崽在洞口蹦跳，景色美极了。不过汤姆没有走近。兔子长得这么大，玩起来未必留心脚下，很可能一脚把他踩扁，事后还要伤心。汤姆是个善良的孩子，连兔子也舍不得惹哭。我们这里的蠼螋发现你可能踩到它们，也常常赶快躲开。它们同样好心，不愿让你事后后悔。
        - id: ch02-b04
          speaker: narrator
          text: 汤姆继续向前，一面看兔子，一面看清晨染上越来越浓的红色和金色。哈巴狗仍在狂吠，教堂的钟被震得叮当乱响，苹果工厂的烟囱也摇个不停。可他来到石柱脚下才发现，根本不必爬上柱顶，就能看见哈巴狗在冲什么叫。
        - id: ch02-b05
          speaker: narrator
          text: 石柱边躺着一条极其巨大的紫龙。它的翅膀像一把把淋过许多场雨的紫色旧伞。脑袋又大又秃，活像紫蘑菇光溜溜的菌盖。那条紫尾巴又长又细，绷得紧紧的，就像马车夫长鞭末端的鞭梢。
        - id: ch02-b06
          speaker: narrator
          text: 紫龙舔着一只伞似的翅膀，不时呻吟，把头向后靠在石柱上，看起来快要昏倒。汤姆马上明白了。昨夜准有一群紫龙飞过小岛，这条可怜的龙撞到石柱，折断了翅膀。
        - id: ch02-b07
          speaker: narrator
          text: 罗通迪亚人个个善待别人。汤姆从没跟龙说过话，却一点也不怕。他经常看见一群群龙飞越大海，只是没想到自己会亲自认识一条。
        - id: ch02-b08
          speaker: tom
          text: 你看起来很不舒服。
        - id: ch02-b09
          speaker: narrator
          text: 紫龙摇了摇硕大的脑袋。它不会开口，可它跟别的动物一样，只要愿意，完全听得懂人话。
        - id: ch02-b10
          speaker: tom
          text: 要不要我替你拿点什么来？
        - id: ch02-b11
          speaker: narrator
          text: 紫龙睁开紫眼睛，带着询问的意思笑了笑。汤姆便哄它吃点东西。
        - id: ch02-b12
          speaker: tom
          text: 吃一两个圆面包好吗？附近正好有一棵很漂亮的圆面包树。
        - id: ch02-b13
          speaker: narrator
          text: 紫龙张开紫色的大嘴，舔舔紫嘴唇。汤姆跑去摇圆面包树，很快抱回一大堆新鲜的葡萄干圆面包。回来的路上，他又从石柱附近的矮灌木上摘了几个巴斯圆面包。
        - id: ch02-b14
          speaker: narrator
          text: 岛屿转错方向，还带来一件怪事。在我们这里必须亲手烤出来的圆面包、蛋糕和黄油酥饼，在罗通迪亚全长在树木和灌木上。我们地里长出的花椰菜、卷心菜、胡萝卜、苹果和洋葱，那里的人反倒得亲手制作，就像我们的厨师做布丁和水果酥皮饺一样。
        - id: ch02-b15
          speaker: tom
          text: 来，多少吃一点。吃完你很快就会舒服些。
        - id: ch02-b16
          speaker: narrator
          text: 紫龙把圆面包全吃光了，只不大客气地点一下头，随后又去舔翅膀。汤姆只好回城报信。一条真正的活龙竟来到岛上，这事从未发生过。所有人都兴奋极了，连颁奖典礼也顾不上，全都跑来看龙。学校总长也来了，口袋里还装着汤姆的奖品，就是那部小牛皮装帧、封面印着王家纹章的《罗通迪亚史》。偏偏书从口袋掉出来，又偏偏被紫龙一口吞掉。汤姆终究没能领到奖，而紫龙尝过以后，似乎也不喜欢那本书。
        - id: ch02-b17
          speaker: tom
          text: 也许这样反而好。就算拿到了，我也不一定喜欢那份奖品。
        - id: ch02-b18
          speaker: narrator
          text: 那天刚好是星期三。公主的朋友们照例被问起想去做什么。
        - id: ch02-b19
          speakers: [noble_boy_1, noble_boy_2, noble_boy_3]
          ensemble: chorus
          text: 我们去看那条龙！
          emotion: happy
        - id: ch02-b20
          speakers: [noble_girl_1, noble_girl_2, noble_girl_3]
          ensemble: chorus
          text: 可是我们害怕。
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 玛丽·安公主摆出了王家的气派。
        - id: ch02-b22
          speaker: mary_ann
          text: 别犯傻。只有童话和英国史那样的故事里，人们才会不友善，才会伤害别人。在罗通迪亚，大家都很和善。只要你不淘气，就用不着害怕。就算淘气挨罚，我们也知道那是为自己好。我们一起去看龙，还可以带些酸味糖给它。
        - id: ch02-b23
          speaker: narrator
          text: 孩子们于是出发了。所有有爵位的孩子轮流拿酸味糖喂龙。紫龙看起来既高兴又受宠若惊，还摇起自己够得着的那一截紫尾巴。它的尾巴实在太长了。轮到公主喂糖时，紫龙咧开大嘴，笑得格外灿烂，又把长尾巴从头到尾，每一英寸都摇了一遍。看起来，它仿佛在夸公主善良、可爱又漂亮。
        - id: ch02-b24
          speaker: narrator
          text: 可是在它邪恶的紫色心脏深处，它想的却是另一回事。它觉得公主漂亮、肥嫩又可爱，真想一口吃掉她，而不是吃这些傻乎乎的酸味糖。谁也听不见龙心里的话，只有公主的舅舅听得见。他是魔法师，惯于在门外偷听，那本来就是他的行当。
        - id: ch02-b25
          speaker: narrator
          text: 你还记得，罗通迪亚有一个坏人。现在不能再瞒了。这个十足的大坏蛋，正是詹姆斯舅舅。童话告诉你，魔法师总是坏的。《林中婴儿》和《诺福克悲剧》又告诉你，有些舅舅也很坏。英国史还告诉你，至少有一个名叫詹姆斯的人很坏。一个人既当魔法师，又当舅舅，偏偏还叫詹姆斯，你就别指望他会做好事。他是三重十足的大坏蛋，也绝不会有好下场。
        - id: ch02-b26
          speaker: narrator
          text: 詹姆斯舅舅早就想除掉公主，把王国抢到自己手里。他讨厌的东西多得数不清，一个漂亮的王国几乎是他唯一喜欢的东西。可他始终想不出真正可行的办法。罗通迪亚人太善良，邪恶咒语碰到这些清白无辜的岛民，就像水滑过鸭背，根本不起作用。现在詹姆斯舅舅却觉得机会终于来了。岛上有了两个坏人，正好互相帮忙。一个是他自己，另一个就是紫龙。他什么也没说，只跟紫龙交换了一个意味深长的眼神。随后，大家都回家喝茶了。除了汤姆，没有人看见那个眼神。
        - id: ch02-b27
          speaker: narrator
          text: 汤姆回家以后，把一切都讲给菲多听。聪明的小象认真听完，从汤姆膝头爬到桌上。桌面摆着一座装饰精美的日历，是公主送给汤姆的圣诞礼物。菲多用细小的鼻子点出一个日期，八月十五日，也就是公主的生日。然后，它焦急地望着主人。
        - id: ch02-b28
          speaker: tom
          text: 怎么了，菲多？好菲多，你想告诉我什么？
        - id: ch02-b29
          speaker: narrator
          text: 聪慧的小象又把刚才的动作做了一遍。汤姆终于懂了。
        - id: ch02-b30
          speaker: tom
          text: 哦，公主生日那天会出事，是不是？好，我一定会留心。
        - id: ch02-b31
          speaker: narrator
          text: 他也真的一直留着心。
    - id: ch03
      title: 詹姆斯舅舅的礼物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 起初，罗通迪亚人很喜欢紫龙。它住在石柱旁，自己去圆面包树上找吃的。渐渐地，它却开始四处游荡，还钻进大兔子挖的洞穴。游客在草地游玩时，会看见它那条细长、紧绷、像鞭梢一样的尾巴扭动着滑进兔洞，一下消失。可他们还没来得及喊出它在那里，那颗难看的紫脑袋已经从另一个兔洞冒出来。它有时出现在游客背后，有时贴着人的耳朵低声发笑。
        - id: ch03-b02
          speaker: narrator
          text: 紫龙的笑声一点也不快活。这种捉迷藏起初还算好玩，后来却越来越折磨人的神经。要是你不明白这是什么意思，下次妈妈头疼而你正在玩蒙眼捉人时，可以请她解释。后来，紫龙又养成甩响尾巴的习惯，像人甩响鞭子一样，这同样让大家的神经受不了。
        - id: ch03-b03
          speaker: narrator
          text: 接着，一些小东西开始失踪。就算在私立学校，丢东西也很讨厌。一个人人共同拥有的王国丢了东西，当然更加糟糕。起初不见的还不是什么要紧东西，不过是几头小象、一两只河马和几只长颈鹿。这些本来算不了什么，却让人不安。后来，公主最喜欢的兔子弗雷德里克神秘地不见了。再后来，在一个可怕的早晨，墨西哥哈巴狗也消失了。
        - id: ch03-b04
          speaker: narrator
          text: 自从紫龙上岛，哈巴狗就没停过叫。所有人都习惯了那片吵闹。现在吠声突然中止，反而把大家惊醒。人们出门查看，才发现哈巴狗没了。他们派一个男孩去叫醒军队，让军队搜索。可军队竟然也不见了。直到这时，人人才真的害怕起来。
        - id: ch03-b05
          speaker: narrator
          text: 詹姆斯舅舅走上宫殿露台，开始向民众演说。
        - id: ch03-b06
          speaker: uncle_james
          text: 朋友们，同胞们，我不能再瞒着自己，也不能瞒着你们。这条紫龙是个一文不名的可怜流亡者，是我们中间孤苦无助的异乡客。况且，它还是一条非常、非常了不起的龙。
        - id: ch03-b07
          speaker: narrator
          text: 众人想起紫龙那条尾巴，纷纷表示赞同。
        - id: ch03-b08
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 说得对！说得太对了！
        - id: ch03-b09
          speaker: uncle_james
          text: 我们当中有一位温顺又毫无自卫能力的成员遭遇了不测。究竟出了什么事，我们还不知道。
        - id: ch03-b10
          speaker: narrator
          text: 人人都想起那只名叫弗雷德里克的兔子，发出一片呻吟。
        - id: ch03-b11
          speaker: uncle_james
          text: 我国所有的防卫力量，已经让什么东西吞掉了。
        - id: ch03-b12
          speaker: narrator
          text: 人人又想起了可怜的军队。詹姆斯舅舅越讲越起劲。
        - id: ch03-b13
          speaker: uncle_james
          text: 如今只有一个办法。我们只要采取一项简单的预防措施，就能避免更多兔子失踪，也能保住海军、警察和消防队。这样一点小事，难道我们也不肯做吗？要是不做，将来怎么原谅自己？我必须提醒各位，不管什么东西多么神圣，紫龙都不会放在眼里。
        - id: ch03-b14
          speaker: narrator
          text: 这回，大家全想到了自己。
        - id: ch03-b15
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 那个简单的办法到底是什么？
        - id: ch03-b16
          speaker: uncle_james
          text: 明天是紫龙的生日。它每逢生日，一向要收到礼物。只要我们送它一份真正合心意的礼物，它一定会急着带回去给朋友们看。从此它会飞走，再也不回来。
        - id: ch03-b17
          speaker: narrator
          text: 人群狂热地欢呼起来，站在阳台上的公主也高兴地拍手。詹姆斯舅舅更得意了。
        - id: ch03-b18
          speaker: uncle_james
          text: 紫龙想要的礼物，价钱确实不便宜。不过给人送礼，尤其是送给远道而来的客人，怎么能心疼呢？它想要一位公主。不错，我们只有这一位公主。可到了这种时候，绝不能显得小气。要是送礼的人毫无损失，那份礼物也就一文不值。你们肯把自己的公主送出去，恰好证明了大家有多么慷慨。
          emotion: happy
        - id: ch03-b19
          speaker: narrator
          text: 人群全哭了。他们爱自己的公主，可他们也看得再明白不过。眼下最要紧的责任就是慷慨，把可怜的紫龙想要的东西送给它。公主也哭了。她不愿成为任何人的生日礼物，更别说一条紫龙的生日礼物。汤姆也哭了，因为他气愤到了极点。
        - id: ch03-b20
          speaker: narrator
          text: 汤姆径直回家，把事情全告诉了菲多。小象哄着他，让他重新振作。没过多久，这两个伙伴便专心玩起一只陀螺。菲多用鼻子抽动鞭绳，让陀螺不停旋转。
        - id: ch03-b21
          speaker: narrator
          text: 一大早，汤姆来到宫殿。他先望了望起伏的草地，那里已经几乎没有兔子玩耍。随后，他从白玫瑰丛摘下一朵朵花，不断扔向公主的窗户。公主终于醒来，探出头来看他。
        - id: ch03-b22
          speaker: mary_ann
          text: 爬上来，亲亲我。
        - id: ch03-b23
          speaker: narrator
          text: 汤姆攀着白玫瑰丛爬上去，隔着窗户亲了公主一下。
        - id: ch03-b24
          speaker: tom
          text: 祝你以后每一年，都有一个快乐的生日。
        - id: ch03-b25
          speaker: narrator
          text: 玛丽·安一下哭了起来。
        - id: ch03-b26
          speaker: mary_ann
          text: 汤姆，你怎么还能说这样的话？你明明知道我要……
          emotion: sad
        - id: ch03-b27
          speaker: tom
          text: 别哭，玛丽·安。我的宝贝，我的公主。难道紫龙来领生日礼物时，我会站在一边什么也不做？别哭了。菲多和我已经全安排好了，你只管照我们的话做。
          emotion: calm
        - id: ch03-b28
          speaker: mary_ann
          text: 只要这样就行吗？那很容易，我常常照别人说的话做。
        - id: ch03-b29
          speaker: narrator
          text: 汤姆把计划说给她听。公主一遍又一遍地亲他。
        - id: ch03-b30
          speaker: mary_ann
          text: 亲爱的汤姆，你真善良，又真聪明。我太庆幸把菲多送给你了。你们两个救了我。你们都是我的宝贝！
          emotion: happy
    - id: ch04
      title: 公主的生日礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早晨，詹姆斯舅舅穿上自己最好的外套和帽子，还套了一件绣着金蛇的背心。他是魔法师，对背心的品味总是鲜艳得惊人。打扮妥当以后，他叫来一辆出租马车，要接公主出门。
        - id: ch04-b02
          speaker: uncle_james
          text: 来吧，我的小小生日礼物。紫龙见到你一定非常高兴。你没有哭，这真让我欣慰。孩子越早学会先替别人着想，把自己的幸福放在后面，就越好。我可不愿自己心爱的小外甥女那么自私，连一条远离故乡和朋友、又贫穷又患病的龙想要这点小小快乐，也狠心不肯给它。
        - id: ch04-b03
          speaker: narrator
          text: 公主回答说，她会尽量不自私。没过多久，出租马车停在石柱附近。紫龙就守在那里。它那难看的紫脑袋在阳光下闪闪发亮，难看的紫嘴巴半张着。
        - id: ch04-b04
          speaker: uncle_james
          text: 早安，先生。我们给您带来了一份小小的生日礼物。这样重要的纪念日，我们当然不能让它白白过去，总该献上一点合适的心意。更何况，您还是我们中间的异乡客。我们虽然财力微薄，心意却很丰厚。公主只有一位，我们还是慷慨地把她送来了。是不是这样，孩子？
        - id: ch04-b05
          speaker: narrator
          text: 公主说，她想大概是这样。紫龙又朝她靠近一点。忽然，有个声音大喊起来。
        - id: ch04-b06
          speaker: tom
          text: 快跑！这样才算公平！
        - id: ch04-b07
          speaker: narrator
          text: 喊话的是汤姆。他还带来了动物园的豚鼠和一对比利时野兔。詹姆斯舅舅顿时勃然大怒。
        - id: ch04-b08
          speaker: uncle_james
          text: 先生，你这是什么意思？居然带着这些平民兔子一类的东西，闯进国家大典！走开，你这个淘气小子，带它们到别处玩去！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 他还在说，两只野兔已经一左一右逼近。它们庞大的身体高高耸起，把詹姆斯舅舅紧紧夹在中间。他整个人埋进厚厚的兔毛，几乎喘不过气。公主趁机跑到石柱另一面，探出头来看事情会怎么发展。
        - id: ch04-b10
          speaker: narrator
          text: 一大群人跟着出租马车从城里赶来，这时也到了所谓的国家大典现场。他们异口同声地嚷嚷起来。
        - id: ch04-b11
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 要公平，必须公平！答应过的事怎么能反悔？哪有把礼物送出去又拿回来的道理？让可怜的流亡异乡客收下它的生日礼物！
        - id: ch04-b12
          speaker: narrator
          text: 人们想抓住汤姆，可巨大的豚鼠挡住了他们。
        - id: ch04-b13
          speaker: tom
          text: 没错，公平比什么都宝贵。你们那位孤苦无助的流亡客可以得到公主，只要它抓得住她。开始吧，玛丽·安！
        - id: ch04-b14
          speaker: narrator
          text: 玛丽·安从大石柱背后探出头，朝紫龙叫了一声。
        - id: ch04-b15
          speaker: mary_ann
          text: 嘘！你抓不到我！
        - id: ch04-b16
          speaker: narrator
          text: 她说完就拼命跑。紫龙立刻追了上去。公主跑出半英里，在一棵树前停住，绕过树干，转身跑回石柱，又围着石柱兜圈。紫龙始终紧追在她身后。紫龙的身体太长，转弯远不如公主灵活。公主一圈又一圈地跑，第一圈离石柱很远，接着每一圈都靠得更近。紫龙只顾追赶她，完全没有发现汤姆已经把它那条又长、又紧、像鞭绳一样的尾巴尖拴在岩石上。
        - id: ch04-b17
          speaker: narrator
          text: 紫龙绕的圈越多，尾巴缠在石柱上的圈数也越多。这就跟给陀螺缠绳完全一样，只不过陀螺的轴钉换成了石柱，鞭绳换成了龙尾。魔法师还夹在两只比利时野兔中间，倒是十分安全。他眼前只有一片黑暗，什么也做不了，只顾着喘不上气。
        - id: ch04-b18
          speaker: narrator
          text: 等紫龙能够缠上石柱的身体全缠了上去，它已经紧得像线轴上的棉线。公主终于停下。她几乎喘不过气，好不容易才说出一句话。
        - id: ch04-b19
          speaker: mary_ann
          text: 哈！现在是谁赢了？
        - id: ch04-b20
          speaker: narrator
          text: 紫龙气坏了。它用尽全身力气，张开巨大的紫翅膀，想向公主猛扑过去。这么一来，它的尾巴当然被拉扯，而且拉得非常非常用力。龙一拉，尾巴就非动不可。尾巴一动，石柱也非跟着转不可。石柱一转，整座岛自然也跟着石柱转。
        - id: ch04-b21
          speaker: narrator
          text: 一转眼，龙尾从石柱上松开，整个岛像陀螺一样飞快旋转。速度实在太快，所有人都脸朝下摔倒，用力抱紧自己，因为大家都感觉到，马上要有大事发生。只有魔法师例外。他还夹在两只野兔之间，喘不过气。除了兔毛和满肚子的怒火，什么也感觉不到。
    - id: ch05
      title: 一切回到正确大小
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大事果然发生了。紫龙带着整个罗通迪亚，转向世界开创之初就该转的方向。岛屿不断旋转，所有动物也开始改变大小。豚鼠越变越小，大象越变越大。男人、女人和孩子本来也会跟着变，幸好他们知道用两只手紧紧抱住自己。至于动物，我们当然不能指望它们也懂这个办法。
        - id: ch05-b02
          speaker: narrator
          text: 最妙的是，大兽变小、小兽变大的时候，紫龙也缩了起来。最后，它落在公主脚边，变成一只缓缓爬动、背上长着翅膀的紫色小水蜥。
        - id: ch05-b03
          speaker: mary_ann
          text: 这个小东西真好玩。我要把它当作我的生日礼物。
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 其他人仍然脸朝下趴着，牢牢抱住自己。可魔法师詹姆斯舅舅从没想到他也该这样做。他满脑子都在琢磨，要怎样惩罚那两只比利时野兔和园丁家的儿子。于是，大兽缩小时，他也跟着缩小了。
        - id: ch05-b05
          speaker: narrator
          text: 紫色小龙掉在公主脚边，看见那里还有一个极小的魔法师。他的名字正是詹姆斯舅舅。小龙便把他带走了，因为它正想得到一份生日礼物。
        - id: ch05-b06
          speaker: narrator
          text: 从此以后，所有动物都有了新的个头。刚开始，大家看着笨重的大象和小小的睡鼠，都觉得古怪极了。如今他们早已习惯，就像我们一样，根本不再把这事放在心上。
        - id: ch05-b07
          speaker: narrator
          text: 这一切发生在许多年前。就在前几天，我从《罗通迪亚时报》上读到一篇报道。报道说，玛丽·安公主和托马斯·加德纳勋爵举行了婚礼。这位勋爵还有一个头衔，叫作聪勇屠龙爵士。
        - id: ch05-b08
          speaker: narrator
          text: 我知道，公主除了汤姆，绝不会嫁给别人。所以我猜，他们一定特意为了这场婚礼把汤姆封成了勋爵。那个聪勇屠龙爵士的头衔，当然是说他既聪明又勇敢，还战胜过一条龙。要是你不赞成，那只能说明你不知道罗通迪亚人是怎样拼字的。
        - id: ch05-b09
          speaker: narrator
          text: 报纸还说，新郎送给新娘的华美礼物当中，有一头巨大的大象。新婚夫妇骑着它去度蜜月。这一定就是菲多。你还记得吧，汤姆答应过，等他们结婚时会把小象还给公主。《罗通迪亚时报》把他们称为幸福的一对。报纸能想出这种说法，真是聪明。它听起来又新鲜又好听，而且我觉得，它比报纸上许多别的话都更加真实。
        - id: ch05-b10
          speaker: narrator
          text: 你瞧，公主和园丁的儿子那么喜欢彼此，想不幸福都难。更何况，他们还有一头完全属于自己的大象可以骑。要是这样还不足以让人幸福，我倒想知道怎样才算足够。当然，也有人非得骑着鲸鱼航行才肯幸福，说不定真有了鲸鱼仍不满足。那都是些贪得无厌的人，很可能连布丁也要添上四份。汤姆和玛丽·安可从来不会这样。
