cover_prompt: |-
  A wordless cover scene in a grand English palace garden around 1900 shows a small newly crowned boy accidentally releasing a dragon from an ancient book. The boy wears a velvet suit beneath an oversized royal mantle and a bright crown, and he kneels beside a great brown leather volume with gold corners, jeweled clasps, and yellowed pages. A vast red dragon with scarlet wings surges upward from the open book toward the distant green hills while a red-bearded courtier and an elderly nurse recoil behind the child. The dragon's emergence from the page is the clear focal action, magical and astonishing yet playful and non-frightening. Use a wide child-height view across the terrace and garden, with the open book prominent in the foreground, the palace and trees framing the sides, and calm generous sky at the top. Keep the clothing, architecture, and objects grounded in turn-of-the-century Britain, and invent the creature and every decorative detail without reference to screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
