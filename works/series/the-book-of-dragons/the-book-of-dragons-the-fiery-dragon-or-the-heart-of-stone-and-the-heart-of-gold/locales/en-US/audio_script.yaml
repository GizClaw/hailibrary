  chapters:
    - id: ch01
      title: The Fiery Dragon, or The Heart of Stone and the Heart of Gold
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Each pearl-gray morning, when the starlings began to chatter, the little white Princess woke in her little white bed. She ran barefoot up the twisting tower stairs in her white bed-gown. At the top, she kissed her hands to the sun, the woods, and the sleeping town.
        - id: ch01-b02
          speaker: sabrinetta
          text: Good morning, pretty world!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Then she hurried down the cold stone steps, put on her short skirt, cap, and apron, and started the day's work. She swept every room and made breakfast. Afterward she washed the dishes and scoured the pans. She did it all because she was a real Princess. Of all the servants who should have cared for her, only her old nurse had remained faithful. Nurse had lived with her in the tower for the Princess's whole life. Now Nurse was old and weak, Sabrinetta would not let her work anymore. Nurse sat quietly with her sewing while the Princess cared for them both. This real Princess had skin like milk, hair like flax, and a heart like gold.
        - id: ch01-b04
          speaker: narrator
          text: Her name was Sabrinetta. Her grandmother was Sabra, who had married Saint George after he killed the dragon. By right, all the country belonged to Sabrinetta. There were woods stretching away to the mountains and open downs sloping toward the sea. There were lovely fields of corn, maize, and rye, with olive orchards and vineyards between them. The little town had towers and turrets, steep roofs, and curious windows. It nestled in a hollow between the sea, where a whirlpool turned, and the mountains, which were white with snow and rosy in the sunrise.
        - id: ch01-b05
          speaker: narrator
          text: But Sabrinetta's father and mother died when she was still young. Her cousin was trusted to care for the kingdom until she grew up. He was a very evil Prince. Instead of guarding her inheritance, he took it all for himself, and all the people followed him. Of everything that had once belonged to Sabrinetta, only one possession remained. It was the great dragonproof tower her grandfather, Saint George, had built. And of all the servants who should have surrounded her, only good old Nurse remained.
        - id: ch01-b06
          speaker: narrator
          text: That was why she saw the wonder before anyone else. Very early one morning, while the town slept, she climbed the tower and looked across the field. Beyond it lay a ferny ditch, a thorny rose hedge, and then the wood. The hedge shook and twisted. Something bright and shining wriggled through it into the ditch, then slipped back again.
        - id: ch01-b07
          speaker: sabrinetta
          text: Dear me, what a strange, shiny creature! If it were larger, and if fabulous monsters had not disappeared long ago, I might think it was a dragon.
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: It looked like a dragon, only too small. It looked like a lizard, only too large. It was about the length of a hearthrug.
        - id: ch01-b09
          speaker: sabrinetta
          text: I wish it had not rushed back into the wood. I am safe in my dragonproof tower, of course. But if it is a dragon, it is big enough to eat people. And today is the first of May, when the children gather flowers in the wood.
        - id: ch01-b10
          speaker: narrator
          text: Sabrinetta finished every bit of housework without leaving even a speck of dust in the tightest corner of the winding stair. Then she put on her silky, milk-white gown embroidered with moon daisies and returned to the tower top. Across the fields, whole troops of children were setting out to gather May flowers. Their laughter and singing floated all the way up to her.
        - id: ch01-b11
          speaker: sabrinetta
          text: Oh, I hope that creature was not a dragon.
        - id: ch01-b12
          speaker: narrator
          text: The children came in twos, threes, tens, and twenties. Their red, blue, yellow, and white clothes dotted the green field.
        - id: ch01-b13
          speaker: sabrinetta
          text: They look like flowers stitched onto a green silk cloak.
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: Group after group vanished into the wood until the field was plain green again.
        - id: ch01-b15
          speaker: sabrinetta
          text: Now all the embroidery has been picked out.
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: The sun shone in a blue sky. The fields were perfectly green, and every flower looked especially bright because it was May Day. Then, without warning, a cloud crossed the sun. Faraway shrieks shattered the silence. All the children burst from the wood like a many-colored flood. They poured across the field in one red, blue, yellow, and white wave, screaming as they ran. Their words reached the Princess high upon her tower, strung through the screams like beads upon sharp needles.
        - id: ch01-b17
          speakers: [people_1, people_2, people_3]
          ensemble: chorus
          text: The dragon! Open the gates! The fiery dragon is coming!
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: They swept across the field and through the town gate, and it banged behind them. The children vanished from sight. Then, on the far side of the field, rose branches cracked and broke in the hedge. For one moment something huge, glaring, and horrible crushed the ferns in the ditch. Then it hid itself once more in the shelter of the wood.
        - id: ch01-b19
          speaker: narrator
          text: Sabrinetta told Nurse, who locked the tower door at once and put the key in her pocket. The Princess begged to go and help protect the children.
        - id: ch01-b20
          speaker: nurse
          text: The townspeople can look after themselves. My work is to look after you, my precious, and that is what I mean to do. I may be old, but I can still turn a key.
        - id: ch01-b21
          speaker: narrator
          text: Sabrinetta climbed once more to the top of her tower. Whenever she thought of the children and the fiery dragon, she began to cry. She knew that although her own tower was safe, the gates of the town were not dragonproof at all. Nothing could keep the creature outside. It could simply walk into the streets whenever it pleased.
        - id: ch01-b22
          speaker: narrator
          text: The children ran to the palace and found the Prince cracking his hunting whip near the kennels. When they told him what they had seen, he ordered out his pack of hippopotamuses.
        - id: ch01-b23
          speaker: tiresome
          text: This will be excellent sport!
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: The Prince always hunted big game with hippopotamuses. People might have forgiven him for that. What they could not forgive was the way he swaggered through the streets while the whole pack yelped and frisked at his heels. Whenever he showed them off, the greengrocer with a stall in the marketplace bitterly regretted it. The crockery merchant, who spread his wares on the pavement, was ruined for life every single time.
        - id: ch01-b25
          speaker: narrator
          text: Now the Prince rode out with the pack trotting and frisking behind. At the sound of their voices and his hunting horn, people hurried into their houses. The animals squeezed through the town gates and charged across the country after the dragon. If you have never seen hippopotamuses hunting in full cry, you can hardly imagine the sight. They do not bay like hounds. They grunt like pigs, only their grunts are enormous and fierce. No one expects a hippopotamus to jump, either. The pack smashed straight through hedges and lumbered across standing corn. They badly damaged the crops and annoyed the farmers very much.
        - id: ch01-b26
          speaker: narrator
          text: Every hippopotamus wore a collar with its name and address. Still, when farmers complained at the palace, the Prince said they should not have left their crops standing in people's way. He never paid them anything.
        - id: ch01-b27
          speakers: [people_1, people_2]
          ensemble: duo
          text: I wish the dragon would eat him.
        - id: ch01-b28
          speaker: narrator
          text: That was a very wrong thing to wish, no doubt. But he was a very nasty Prince. The hunt crossed fields and open hills. They searched the woods and found nothing. The shy dragon would not appear.
        - id: ch01-b29
          speaker: narrator
          text: The hunters crossed field after field and searched the open hills. They drew the woods blank, and on the downs there was no scent at all. The dragon was shy and refused to show itself. Just as the Prince decided the whole tale was nonsense, his favorite old hippopotamus gave a hunting cry. The Prince blew his horn and shouted to the pack. Every hippopotamus charged downhill toward the hollow beside the wood. There, where no one could miss it, stood the dragon. It was as big as a barge, glowing like a furnace, spitting fire, and flashing its bright teeth.
        - id: ch01-b30
          speaker: tiresome
          text: Tallyho! Forward! The hunt is on!
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: Indeed it was. But the dragon did not behave as hunted prey should. Instead of running away, it rushed straight at the pack. From his seat on the elephant, the Prince had to watch his precious animals swallowed one by one in the twinkling of an eye. The dragon gulped down each hippopotamus as easily as a dog swallows a morsel of meat. It was a shocking sight. The pack had set out so merrily to the sound of the horn, but now not even a baby hippopotamus remained. The dragon looked anxiously around to make sure it had forgotten nothing.
        - id: ch01-b32
          speaker: narrator
          text: The Prince slid down the far side of his elephant and fled into the thickest bushes. They were strong and tightly tangled, and he hoped the dragon could not force its way through. He crawled on hands and knees, which was not princely at all, until he found a hollow tree and crept inside. The wood stayed perfectly still. No branches crashed behind him, and no smell of burning warned him that the dragon was near. He drained the silver hunting bottle hanging from his shoulder and stretched out his legs inside the tree.
        - id: ch01-b33
          speaker: narrator
          text: He did not shed one tear for the poor tame hippopotamuses. They had eaten from his hand and faithfully followed him through years of hunting, but he gave them no thought. He was a false Prince, with skin like leather, hair like hearth brushes, and a heart like stone. He did not cry. He merely settled himself inside the hollow tree and went to sleep.
        - id: ch01-b34
          speaker: narrator
          text: Darkness had fallen when he woke. He crawled from the tree and saw a red glow in a nearby hollow. Beside a stick fire sat a ragged young man with long yellow hair. Sleeping shapes lay all around him, breathing heavily.
        - id: ch01-b35
          speaker: tiresome
          text: Who are you?
        - id: ch01-b36
          speaker: elfin
          text: I am Elfin, the pig keeper. Who are you?
        - id: ch01-b37
          speaker: tiresome
          text: I am Prince Tiresome.
        - id: ch01-b38
          speaker: elfin
          text: Then why are you outside your palace so late at night?
        - id: ch01-b39
          speaker: tiresome
          text: I have been hunting.
        - id: ch01-b40
          speaker: elfin
          text: Oh, so that was you! Fine hunt, was it? My pigs and I watched the whole thing.
        - id: ch01-b41
          speaker: narrator
          text: The sleeping shapes grunted and snored. The Prince knew they were pigs by their manners.
        - id: ch01-b42
          speaker: elfin
          text: If you knew what I know, you could have saved your pack.
        - id: ch01-b43
          speaker: tiresome
          text: What are you talking about?
        - id: ch01-b44
          speaker: elfin
          text: The dragon. You hunted at the wrong hour. A dragon must be hunted at night.
        - id: ch01-b45
          speaker: tiresome
          text: No, thank you. Hunting it by daylight was more than enough, you foolish pig keeper.
          emotion: fearful
        - id: ch01-b46
          speaker: elfin
          text: Suit yourself. The dragon may come hunting you tomorrow. I do not care if it does, you foolish Prince.
        - id: ch01-b47
          speaker: tiresome
          text: You are extremely rude.
          emotion: angry
        - id: ch01-b48
          speaker: elfin
          text: No. I am only telling the truth.
        - id: ch01-b49
          speaker: tiresome
          text: Then tell me this truth of yours. What did you know that could have saved my hippopotamuses?
        - id: ch01-b50
          speaker: elfin
          text: That is poor English. But what will you give me for the answer?
        - id: ch01-b51
          speaker: tiresome
          text: The answer to what?
        - id: ch01-b52
          speaker: elfin
          text: To the question you want answered.
        - id: ch01-b53
          speaker: tiresome
          text: I do not want to know anything.
        - id: ch01-b54
          speaker: elfin
          text: Then you are even more foolish than I thought. Do you not want to stop the dragon before it stops you?
        - id: ch01-b55
          speaker: tiresome
          text: Perhaps that would be useful.
        - id: ch01-b56
          speaker: elfin
          text: I am never very patient, and now I have almost none left. What will you give me if I tell you?
        - id: ch01-b57
          speaker: tiresome
          text: Half my kingdom and my cousin the Princess as your wife.
        - id: ch01-b58
          speaker: elfin
          text: I agree to the bargain. Here is the secret. The dragon shrinks at night. It sleeps under this tree root, and I use it to light my fire.
        - id: ch01-b59
          speaker: narrator
          text: There it lay on scorched moss beneath the tree, no longer than a finger.
        - id: ch01-b60
          speaker: tiresome
          text: How do I kill it?
        - id: ch01-b61
          speaker: elfin
          text: I do not know if you can. But you can carry it away if you have a container. Your hunting bottle should work.
        - id: ch01-b62
          speaker: narrator
          text: Using little sticks and burning their fingers slightly, they poked and pushed until the dragon crawled into the silver bottle. The Prince screwed the top on tight.
        - id: ch01-b63
          speaker: elfin
          text: We have it now. We will take the bottle home and seal it with Solomon's seal. Tomorrow we can divide the kingdom, and I will buy fine clothes for courting.
        - id: ch01-b64
          speaker: narrator
          text: But the wicked Prince never meant to keep a promise.
        - id: ch01-b65
          speaker: tiresome
          text: Be off with you! I found the dragon, and I imprisoned it. I promised no kingdom and no courting. Say that again, and I will cut off your head.
          emotion: angry
        - id: ch01-b66
          speaker: narrator
          text: He drew his sword.
        - id: ch01-b67
          speaker: elfin
          text: Very well. I am still richer than you.
        - id: ch01-b68
          speaker: tiresome
          text: What do you mean by that?
          emotion: angry
        - id: ch01-b69
          speaker: elfin
          text: You have only a kingdom and a dragon. I have clean hands and seventy-five fine black pigs.
        - id: ch01-b70
          speaker: narrator
          text: Elfin shrugged and sat down beside his fire again. The Prince made his way home with the silver bottle. He called Parliament together in the middle of the night and woke every member on purpose, simply so he could boast about how brave and clever he had been.
        - id: ch01-b71
          speakers: [people_1, people_2, people_3]
          ensemble: chorus
          text: You truly are brave and clever.
        - id: ch01-b72
          speaker: narrator
          text: They dared not sound angry, because they knew what happened to anyone who displeased the Prince. Then the Prime Minister solemnly pressed Solomon's seal over the mouth of the bottle. The bottle was carried to the Treasury and locked inside. That was the strongest building in the whole town. It was made from solid copper, and its walls were as thick as Waterloo Bridge.
        - id: ch01-b73
          speaker: narrator
          text: They set the bottle among the sacks of gold. A junior secretary to the junior clerk of the last Lord of the Treasury was appointed to sit up beside it all night and watch for anything unusual. He had never seen a dragon. More than that, he did not believe the Prince had ever seen one either. Tiresome had never been a truthful boy. It would have been just like him to bring home an empty bottle and pretend a dragon was trapped inside. So the junior secretary did not mind being left there.
        - id: ch01-b74
          speaker: narrator
          text: They gave the junior secretary the key. Once everyone in town had gone back to bed, he unlocked the door for some junior secretaries from other government departments. They played a lively game of hide-and-seek among the sacks of gold. Then they opened the great ivory chests and played marbles with the diamonds, rubies, and pearls. They were enjoying themselves enormously when the copper Treasury began to feel warmer and warmer.
        - id: ch01-b75
          speaker: secretary
          text: Look at the bottle!
          emotion: surprised
        - id: ch01-b76
          speaker: narrator
          text: The bottle with Solomon's seal had swollen to three times its proper size. It looked nearly red-hot. The air grew warmer and warmer, while the bottle grew bigger and bigger. At last all the junior secretaries agreed the room was too hot for them. They rushed out, tumbling over one another in their hurry. Just as the last secretary escaped and locked the door behind him, the bottle burst.
        - id: ch01-b77
          speaker: narrator
          text: The fiery dragon sprang out of the broken bottle and began swelling larger with every passing minute. It turned upon the treasure at once. It swallowed the sacks of gold and crunched up pearls, diamonds, and rubies as though they were lumps of sugar. It ate through the night without stopping. By breakfast time, the whole of the Prince's treasure had vanished inside it.
        - id: ch01-b78
          speaker: narrator
          text: At about eleven, the Prince came walking down the street. At that very moment the dragon stepped through the Treasury's broken door, with melted gold still dripping from its jaws. Tiresome turned and ran for his life. He fled straight toward the dragonproof tower. The little white Princess saw him coming, raced downstairs, unlocked the door, and pulled him inside. Then she slammed the dragonproof door in the dragon's fiery face. The creature sat outside and whined because it wanted the Prince very badly indeed.
        - id: ch01-b79
          speaker: narrator
          text: Sabrinetta led Tiresome into the best room and spread a cloth on the table. She gave him cream and eggs, white grapes, honey, bread, and many other good things to eat, all yellow and white. She served him with perfect kindness. She would have treated him no better if he had been anyone else, though he was the wicked Prince who had taken her kingdom and kept it for himself. That was because Sabrinetta was a true Princess with a heart of gold.
        - id: ch01-b80
          speaker: narrator
          text: After eating and drinking, Tiresome asked how the tower door worked. Nurse was asleep, so no one stopped Sabrinetta from showing him.
        - id: ch01-b81
          speaker: sabrinetta
          text: Turn the key this way, and the door stays locked. Turn it nine times the other way, and it flies open.
        - id: ch01-b82
          speaker: narrator
          text: And that was exactly what happened. The door flew open. The instant it did, Tiresome shoved the white Princess out of her own tower, just as he had once shoved her out of her own kingdom. Then he slammed the door and locked himself safely inside. He wanted the entire dragonproof tower for himself.
        - id: ch01-b83
          speaker: narrator
          text: And there Sabrinetta stood in the street. On the other side of the way, the dragon sat whining. Yet it made no attempt to eat her. Nurse did not know this, but dragons cannot eat white Princesses whose hearts are made of gold.
        - id: ch01-b84
          speaker: narrator
          text: Sabrinetta could not possibly walk through the streets in her silky, milk-white daisy gown without a hat or gloves. So she turned the other way and ran across the meadows toward the wood. Never before in her life had she been outside the tower. Under her feet, the soft grass felt like the grass of Paradise.
        - id: ch01-b85
          speaker: narrator
          text: Sabrinetta did not know what her own heart was made of, so she was still afraid that the dragon might eat her. She ran straight into the thickest part of the wood. There, in a green hollow, she came upon Elfin and his seventy-five fine black pigs. Elfin sat playing his flute, while all around him the pigs danced cheerfully upon their hind legs.
        - id: ch01-b86
          speaker: sabrinetta
          text: Oh, please protect me. I am terribly frightened.
          emotion: fearful
        - id: ch01-b87
          speaker: elfin
          text: I will. You are safe now. What frightened you?
        - id: ch01-b88
          speaker: narrator
          text: Elfin put his arms around her.
        - id: ch01-b89
          speaker: sabrinetta
          text: It was the dragon.
          emotion: fearful
        - id: ch01-b90
          speaker: elfin
          text: Then it escaped from the silver bottle. I hope it ate the Prince.
        - id: ch01-b91
          speaker: sabrinetta
          text: It did not. But why would you hope for that?
          emotion: surprised
        - id: ch01-b92
          speaker: narrator
          text: Elfin told her the whole story of the dragon, the promise, and the cruel way the Prince had cheated him.
        - id: ch01-b93
          speaker: elfin
          text: He offered me half the kingdom and his cousin the Princess as my wife.
        - id: ch01-b94
          speaker: sabrinetta
          text: Oh, what a shameful trick! How dare he?
          emotion: angry
        - id: ch01-b95
          speaker: narrator
          text: She tried to pull away, but Elfin held her closer.
        - id: ch01-b96
          speaker: elfin
          text: What is wrong? I thought it was shameful too. But he may keep every bit of his kingdom if I may keep what I have now.
        - id: ch01-b97
          speaker: sabrinetta
          text: And what do you have now?
        - id: ch01-b98
          speaker: elfin
          text: You, my pretty dear. As for the cousin he offered me, forgive me, but I had not yet seen the real Princess. The only Princess. My Princess.
        - id: ch01-b99
          speaker: sabrinetta
          text: Do you mean me?
          emotion: surprised
        - id: ch01-b100
          speaker: elfin
          text: Who else could I mean?
        - id: ch01-b101
          speaker: sabrinetta
          text: But you had never seen me five minutes ago!
        - id: ch01-b102
          speaker: elfin
          text: Five minutes ago, I was a pig keeper. Since I held you, I have become a Prince, even if I must tend pigs all my life.
        - id: ch01-b103
          speaker: sabrinetta
          text: But you have not asked me.
        - id: ch01-b104
          speaker: elfin
          text: You asked me to care for you. I will do it for the rest of my life.
        - id: ch01-b105
          speaker: narrator
          text: And so that matter was settled. Then they began discussing truly important things, like what to do about the dragon and the Prince. All that time, Elfin had no idea that Sabrinetta really was the Princess. But he knew that she had a heart of gold, and he told her so again and again.
        - id: ch01-b106
          speaker: elfin
          text: Our mistake was using a bottle that was not dragonproof. I understand that now.
        - id: ch01-b107
          speaker: sabrinetta
          text: Is that the only trouble? I can bring you a dragonproof bottle. Everything in my tower is dragonproof. We must stop the dragon and save the little children.
        - id: ch01-b108
          speaker: narrator
          text: She set off alone. Elfin wanted to join her, but she refused.
        - id: ch01-b109
          speaker: sabrinetta
          text: If you are right that my heart is gold, the dragon cannot hurt me. Besides, someone must stay with the pigs.
        - id: ch01-b110
          speaker: narrator
          text: Elfin was certain, so he let her go.
        - id: ch01-b111
          speaker: narrator
          text: When Sabrinetta reached the tower, she found its door standing open. The dragon had waited patiently outside for Tiresome. At last he had stepped through the door, only for an instant, to post a letter to his Prime Minister. The letter explained where he was hiding and asked for the fire brigade to come and deal with the fiery dragon. That instant was enough. The dragon ate him. Afterward, as night drew near and its shrinking time approached, the dragon went back to the wood.
        - id: ch01-b112
          speaker: narrator
          text: Sabrinetta entered the tower, kissed Nurse, and made her a cup of tea. Then she explained everything that was about to happen. She told Nurse that her heart was gold, which meant the dragon could not eat her. When Nurse understood that the Princess truly would be safe, she kissed Sabrinetta and allowed her to go.
        - id: ch01-b113
          speaker: narrator
          text: Sabrinetta took a dragonproof bottle made from polished brass and ran back through the meadows to the wood. When she reached the hollow, Elfin was still sitting where she had left him. His seventy-five sleek black pigs surrounded him, and he was waiting eagerly for her return.
        - id: ch01-b114
          speaker: elfin
          text: I thought you would never return. You have been gone for at least a year.
        - id: ch01-b115
          speaker: narrator
          text: Sabrinetta sat beside him among the pigs. The two of them held hands until darkness fell. Then the dragon came crawling over the moss. It left scorched ground behind and grew smaller and smaller as it moved. At last, when it had dwindled to its nighttime size, it curled itself beneath the root of the tree.
        - id: ch01-b116
          speaker: elfin
          text: Now hold the bottle steady.
        - id: ch01-b117
          speaker: narrator
          text: Elfin prodded the dragon with sticks until it crept inside. But the bottle had no stopper.
        - id: ch01-b118
          speaker: elfin
          text: Never mind. I will stop it with my finger.
        - id: ch01-b119
          speaker: sabrinetta
          text: No, let me do it.
        - id: ch01-b120
          speaker: narrator
          text: Elfin would not allow that. He pushed his finger into the bottle's mouth.
        - id: ch01-b121
          speaker: sabrinetta
          text: To the sea! Run for the cliffs!
        - id: ch01-b122
          speaker: narrator
          text: Off they raced, while all seventy-five pigs trotted steadily behind them in one long black procession. Inside the bottle, the dragon puffed fire and smoke with all its might. The brass grew hotter and hotter in Elfin's hands. Still he refused to let go. He carried it all the way to the edge of the cliffs. Far below was the dark blue sea, and in that sea the whirlpool went round and round.
        - id: ch01-b123
          speaker: narrator
          text: Elfin gathered all his strength and lifted the burning bottle high above his head. Then he hurled it outward, into the dark space between the stars above and the sea below. The brass bottle turned through the air and fell directly into the middle of the whirlpool.
        - id: ch01-b124
          speaker: sabrinetta
          text: We have saved the country. You have saved the children. Give me your hands.
          emotion: happy
        - id: ch01-b125
          speaker: elfin
          text: I cannot. I will never hold your dear hands again. Mine have burned away.
          emotion: sad
        - id: ch01-b126
          speaker: narrator
          text: It was true. Where Elfin's hands should have been, nothing remained but black cinders. Sabrinetta kissed those poor burned places and wept over them. She tore strips from her silky, milk-white gown and carefully bound them. Together they made their way back to the tower and told Nurse the whole story from beginning to end. All seventy-five pigs sat outside and waited.
        - id: ch01-b127
          speaker: sabrinetta
          text: He is the bravest man in the world. He saved the country and every child. But his poor, dear hands!
          emotion: sad
        - id: ch01-b128
          speaker: narrator
          text: The door opened. The oldest of the seventy-five pigs came in, walked to Elfin, and rubbed against him with small loving grunts.
        - id: ch01-b129
          speaker: nurse
          text: Look at the dear creature. It understands. It truly understands.
          emotion: sad
        - id: ch01-b130
          speaker: narrator
          text: Nurse wiped a tear from her eye as she watched the faithful pig. Sabrinetta bent down and stroked it in Elfin's place. Elfin himself could not stroke the dear creature, for now he had no hands for stroking or for anything else.
        - id: ch01-b131
          speaker: nurse
          text: Pig fat is the only cure for a dragon burn, and this faithful creature knows it.
        - id: ch01-b132
          speaker: elfin
          text: I would not allow it for an entire kingdom!
          emotion: angry
        - id: ch01-b133
          speaker: narrator
          text: He tried to stroke the pig with his elbow.
        - id: ch01-b134
          speaker: sabrinetta
          text: Is there truly no other cure?
        - id: ch01-b135
          speaker: narrator
          text: Just then another pig pushed its black nose through the doorway. Another followed, and then another. They kept coming until the room was packed with pigs, one great surging mass of rounded blackness. They pushed and struggled to reach Elfin, grunting softly in the language of true affection.
        - id: ch01-b136
          speaker: nurse
          text: There is one more cure. Those loving animals all wish to die for you.
        - id: ch01-b137
          speaker: sabrinetta
          text: What is the other cure?
        - id: ch01-b138
          speaker: nurse
          text: If enough people are willing to die for a man burned by a dragon, each one may kiss the burn and wish with a loving heart for it to heal.
        - id: ch01-b139
          speaker: sabrinetta
          text: How many must there be?
        - id: ch01-b140
          speaker: nurse
          text: There must be seventy-seven.
        - id: ch01-b141
          speaker: sabrinetta
          text: There are only seventy-five pigs. With me, that makes seventy-six!
          emotion: sad
        - id: ch01-b142
          speaker: nurse
          text: It must be seventy-seven, and I truly cannot die for him. Nothing can be done. He will have to wear cork hands.
          emotion: sad
        - id: ch01-b143
          speaker: elfin
          text: I knew about the seventy-seven loving hearts. I never guessed my pigs loved me this much, or that my dear did. That only makes the cure more impossible. There is one last charm for dragon burns, but I would rather be burned black from head to foot than marry anyone except you, my dear.
        - id: ch01-b144
          speaker: sabrinetta
          text: Then whom must you marry to heal the burns?
        - id: ch01-b145
          speaker: elfin
          text: I must marry a Princess. That is how Saint George healed his burns.
        - id: ch01-b146
          speaker: nurse
          text: Well, imagine that! I am old, and I never heard of such a cure.
          emotion: surprised
        - id: ch01-b147
          speaker: narrator
          text: Sabrinetta threw her arms around Elfin's neck and held him as if she would never let go.
        - id: ch01-b148
          speaker: sabrinetta
          text: Then everything is well, my brave, precious Elfin. I am a Princess, and you shall be my Prince. Come, Nurse. Do not even stop for your bonnet. We will be married this instant!
          emotion: happy
        - id: ch01-b149
          speaker: narrator
          text: Off they went at once. Behind them came the pigs, moving two by two in a stately black procession. The very minute Elfin was married to the Princess, his hands became perfectly well again. The people had long been weary of Prince Tiresome and his destructive hippopotamuses. They gladly hailed Sabrinetta and her new husband as the rightful rulers of the land.
        - id: ch01-b150
          speaker: narrator
          text: The next morning, the new Prince and Princess went out to discover whether the dragon had washed ashore. They could see no trace of it anywhere. But when they looked toward the whirlpool, they saw a cloud of steam rising from the water. The fishermen reported that for miles around, the sea had grown hot enough for a man to shave with.
        - id: ch01-b151
          speaker: narrator
          text: The water remains hot there to this very day. So we may be fairly sure that the dragon was fierce enough to resist all the cooling waters of the sea. The whirlpool is far too strong for the creature to climb out. It must spin round and round there forever and ever. At last, it is doing something useful by warming water for poor fisherfolk to shave with.
        - id: ch01-b152
          speaker: narrator
          text: The Prince and Princess rule the country well and wisely. Nurse lives with them and has no work at all except a little fine sewing, and she does even that only when she wants to very much. The Prince keeps no pack of hippopotamuses. Because of this, he is wonderfully popular with everyone.
        - id: ch01-b153
          speaker: narrator
          text: The seventy-five devoted pigs live in white marble sties. Every sty has its own brass knocker, and each doorplate bears the word Pig. Twice a day, the animals are washed with Turkish sponges and soap scented with violets. No one objects when they follow the Prince on his walks. They behave beautifully, always stay on the footpath, and faithfully obey every notice that tells them not to walk upon the grass.
        - id: ch01-b154
          speaker: narrator
          text: Every day, the Princess feeds all seventy-five pigs with her own hands. And the very first command she gave after taking the throne concerned one particular word. No one in the kingdom was ever to say “pork” again, on pain of death. Besides that, the forbidden word had to be scratched out of every dictionary in the land.
