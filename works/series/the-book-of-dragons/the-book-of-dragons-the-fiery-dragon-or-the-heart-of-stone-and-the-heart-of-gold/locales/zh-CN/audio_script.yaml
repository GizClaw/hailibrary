audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    sabrinetta:
      display_name: 萨布丽妮塔
      tts:
        delivery: 温柔明朗，纯真善良中自有勇气
        timbre: 清亮柔美
        pace: 从容而灵动
        pitch: 中高音
    nurse:
      display_name: 老奶妈
      tts:
        delivery: 慈爱护短，年迈却果断实际
        timbre: 温厚微哑
        pace: 舒缓
        pitch: 中低音
    tiresome:
      display_name: 蒂尔瑟姆王子
      tts:
        delivery: 傲慢自负，胆怯时仍强装威风
        timbre: 尖硬而张扬
        pace: 偏快
        pitch: 中音
    elfin:
      display_name: 埃尔芬
      tts:
        delivery: 直率机敏，带着不卑不亢的幽默
        timbre: 明朗质朴
        pace: 平稳
        pitch: 中音
    dragon:
      display_name: 龙
      tts:
        delivery: 自负敏感，一本正经又容易上当
        timbre: 低沉粗粝而洪亮
        pace: 稍慢
        pitch: 低音
    junior_secretary:
      display_name: 初级秘书
      tts:
        delivery: 年轻好奇，遇事容易慌张
        timbre: 清晰轻快
        pace: 明快
        pitch: 中高音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 惊慌急切，呼喊清楚有力
        timbre: 明亮稚嫩
        pace: 急促
        pitch: 高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 惊慌急切，声音清脆
        timbre: 清亮稚嫩
        pace: 急促
        pitch: 中高音
    parliamentarian_1:
      display_name: 议员甲
      tts:
        delivery: 恭顺谨慎，赞颂得一本正经
        timbre: 圆润端正
        pace: 平稳
        pitch: 中音
    parliamentarian_2:
      display_name: 议员乙
      tts:
        delivery: 小心附和，唯恐得罪权贵
        timbre: 柔和拘谨
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 白塔上的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 珍珠灰的晨光一到，椋鸟开始叽叽喳喳，小小的白公主萨布丽妮塔便从白床上醒来。树林醒了，她也光着脚跑上曲折的角楼石梯。她穿着白睡袍站在塔顶，朝太阳、树林和沉睡的小城送去飞吻。
        - id: ch01-b02
          speaker: sabrinetta
          text: 早安，美丽的世界！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 接着，她跑下冰凉的石阶，换好短裙，戴上帽子，系起围裙。她打扫一间间屋子，生火准备早餐，再洗净碗碟，把锅子刷亮。一天的活计都由她亲手完成，因为她是真正的公主。原本应该服侍她的人，只剩老奶妈还忠心守在身边。奶妈从公主出生起便陪她住在塔里，如今年老体弱，公主不肯让她再劳累，只叫她安稳坐着做针线。萨布丽妮塔的肌肤像牛奶，头发像亚麻，心却像金子。
        - id: ch01-b04
          speaker: narrator
          text: 她名叫萨布丽妮塔。她的祖母是萨布拉，就是圣乔治杀死恶龙后娶的那位姑娘。按理说，国土都该归萨布丽妮塔所有。树林一直伸到群山脚下，丘陵缓缓斜向大海。秀美的田野里长着小麦、玉米和黑麦，还有一片片橄榄园与葡萄园。那座小城也属于她。城里有高塔、角楼、陡峭的屋顶和形状奇异的窗子。它安卧在大海与群山之间的低地里，海上有漩涡，山巅积着白雪，清晨又会被霞光染成玫瑰色。
        - id: ch01-b05
          speaker: narrator
          text: 可她父母去世以后，代管王国的堂兄夺走了一切。百姓也都跟从了那个坏王子。公主最后只剩圣乔治建造的防龙塔，还有善良的老奶妈。正因为这样，全国第一个看见奇事的人，才会是萨布丽妮塔。
        - id: ch01-b06
          speaker: narrator
          text: 那天早得不能再早，全城仍在熟睡。公主已经跑上角楼石梯，站到高处远望。田野尽头有一道长满绿色蕨草的沟，沟后横着一排野蔷薇篱笆，再过去才是树林。那排带刺的篱笆突然摇晃扭动起来，一个非常明亮、闪闪发光的东西钻出来，溜进蕨沟，转眼又缩了回去。它只露面片刻，公主却看得清清楚楚。
        - id: ch01-b07
          speaker: sabrinetta
          text: 多古怪、多明亮的小东西呀！要是它再大一点，要不是神奇怪兽已经很久没出现了，我简直会把它当成一条龙。
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 那东西像龙，可又太小；像蜥蜴，可又太大。它大约有壁炉前一张小地毯那么长。
        - id: ch01-b09
          speaker: sabrinetta
          text: 它干吗急着躲回去呢？我在防龙塔里不会有事，可它如果真是龙，已经大得能吃人了。今天是五月一日，孩子们还要进树林采花呢。
        - id: ch01-b10
          speaker: narrator
          text: 公主做完家务，连旋梯最偏僻、最容易藏灰的角落也擦得干干净净。随后，她换上光滑的乳白丝裙，裙上绣着月亮一般洁白的雏菊，再次来到塔顶。一群群孩子正越过田野，赶去采五月花。他们的笑声与歌声越飘越高，一直传到公主站立的地方。
        - id: ch01-b11
          speaker: sabrinetta
          text: 但愿刚才那不是龙。
        - id: ch01-b12
          speaker: narrator
          text: 孩子们有的两个一伙，有的三个一群，有时十个，有时二十个。红色、蓝色、黄色和白色的衣裳，星星点点散在碧绿的田野上。公主笑着说，整片田野像一件绿绸斗篷，上面绣满鲜花。后来，孩子们也两个三个、十个二十个地消失在树林里。田野这件斗篷重新只剩素净的绿色，公主便叹了口气，说斗篷上的绣花全被拆掉了。
        - id: ch01-b13
          speaker: narrator
          text: 阳光明亮，天空湛蓝，田野碧绿，五月节的花开得格外鲜艳。可一片云忽然从太阳前掠过，远方的尖叫一下打碎了寂静。孩子们全从林中冲出来，像一股五彩的急流，又像红蓝黄白的浪潮，一面横越田野，一面不停尖叫。声音一直传上塔顶。公主听见一句句呼喊穿在尖叫声上，仿佛珠子穿在尖利的针上。
        - id: ch01-b14
          speakers: [child_1, child_2]
          ensemble: duo
          text: 龙！龙来了！快开城门！火龙来了！
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 孩子们涌进小城，大门砰地关上。与此同时，田野另一头的蔷薇枝噼啪折断，一个庞大、耀眼又可怕的怪物踏烂蕨草，随即藏回树林。公主下楼告诉奶妈。奶妈立刻锁住高塔，把钥匙收进口袋。
        - id: ch01-b16
          speaker: nurse
          text: 让他们自己照看自己吧。我的本分是照看你，我的宝贝。我虽然老了，转动钥匙还是办得到的。
        - id: ch01-b17
          speaker: narrator
          text: 萨布丽妮塔只好重新回到塔顶。每次想到刚才逃命的孩子们，还有树林里那条可怕的火龙，她就忍不住流泪。她心里很清楚，小城的门并不防龙。只要那条龙愿意，什么时候都能径直闯进去，城里的孩子依然身处危险之中。
    - id: ch02
      title: 王子的河马猎群
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 孩子们跑进王宫，把遭遇告诉正在狗舍边抽猎鞭的王子。
        - id: ch02-b02
          speaker: tiresome
          text: 这可有打猎的乐子了！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 他立刻命人牵出自己的河马猎群。他总爱用河马追捕大兽。百姓对这件事本来还不至于太介意，可他偏偏喜欢领着猎群在城中街道上耀武扬威。河马们跟在脚边，又叫又跳。每逢这时，集市上的菜贩总会后悔自己出了摊，把陶器摆满人行道的商人则每次都被撞得倾家荡产。王子骑着大象出了城，河马群一路小跑蹦跳。百姓一听见猎群的叫声和猎号，就以最快的速度躲进屋里。河马们挤过城门，冲向郊外去猎龙。
        - id: ch02-b04
          speaker: narrator
          text: 没见过河马全力追猎的人，很难想象那是什么场面。它们不学猎犬吠叫，只会像猪那样哼哼，可那哼声巨大又凶猛。当然，谁也不会指望河马跳过障碍。它们只管撞穿一道道树篱，拖着沉重的身子闯过尚未收割的庄稼，把田地毁得很严重，也把农夫气得很厉害。每头河马的项圈都写着姓名住址，可农夫去王宫投诉时，王子总说，是他们自己把庄稼竖在别人路上挡道，受了损失也是活该。他从来不赔一个钱。所以这回王子出猎，城里有好几个人悄悄盼着龙把他吃掉。这样想自然很不应该，可他实在坏得出奇。
        - id: ch02-b05
          speaker: narrator
          text: 他们一块田接一块田地猎，又搜遍连绵的荒原。林子里什么也没惊动，丘陵上更是一点气味都留不住。龙很怕羞，一直不肯现身。王子正准备认定根本没有龙，孩子们说的都是无稽之谈，他最得宠的老河马忽然发出了发现猎物的叫声。王子立刻吹响号角，催整个猎群冲下山坡，直奔树林旁的洼地。龙就在那里，谁都看得清清楚楚。它大得像一艘驳船，浑身亮得像熔炉，一面吐火，一面露出闪闪发光的利齿。
        - id: ch02-b06
          speaker: tiresome
          text: 好戏开场了！发现猎物，向前追！
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: 好戏的确开了场，可龙完全不肯照猎物应守的规矩行事。它没有转身逃跑，反倒迎着整支猎群直冲过来。王子高高坐在大象背上，只能满怀羞恼地看着自己最得意的河马一头接一头被龙吞掉。龙吞它们，就像狗把一块块肉咽下去。那景象实在吓人。刚才还伴着号角声欢快出猎的整支队伍，转眼连一头河马幼崽也没剩。龙却意犹未尽，还焦急地向四周张望，生怕自己遗漏了什么。
        - id: ch02-b08
          speaker: narrator
          text: 王子从大象的另一侧悄悄滑下来，逃进林木最茂密的地方。他指望那里的灌木又密又结实，龙撞不过来。他手脚并用地往前爬，模样一点也不像王子。最后，他发现一棵空心树，赶紧钻了进去。林中安静极了，没有折断树枝的巨响，也没有烧焦的气味来吓他。他喝光肩上银猎壶里的酒，又在树洞里伸直双腿。那些可怜的驯养河马吃过他手里的食物，多年来忠心陪他享受一次又一次狩猎，他却一滴眼泪也没流。这个假王子皮肤像皮革，头发像刷壁炉的硬刷子，心像石头。他只顾自己睡着了。
        - id: ch02-b09
          speaker: narrator
          text: 他醒来时，天已全黑。附近洼地里有一堆柴火，一个衣衫褴褛、留着长黄发的年轻人坐在火边，周围一团团沉睡的身影呼吸粗重。
        - id: ch02-b10
          speaker: tiresome
          text: 你是谁？
        - id: ch02-b11
          speaker: elfin
          text: 我叫埃尔芬，是个养猪人。你又是谁？
        - id: ch02-b12
          speaker: tiresome
          text: 我是蒂尔瑟姆王子。
        - id: ch02-b13
          speaker: elfin
          text: 这么晚不待在王宫里，你跑出来做什么？
        - id: ch02-b14
          speaker: tiresome
          text: 我去打猎了。
        - id: ch02-b15
          speaker: elfin
          text: 原来我看见的是你啊？这场猎打得真不错。我和猪群一直在旁边看呢。你如果懂得跟我一样多，那些河马就不会送命了。
        - id: ch02-b16
          speaker: narrator
          text: 地上那些身影一齐哼哼打鼾。王子从它们的举止认出来，那都是猪。
        - id: ch02-b17
          speaker: tiresome
          text: 你这话是什么意思？
        - id: ch02-b18
          speaker: elfin
          text: 我说的是那条龙。你挑错了时候，猎龙得等到夜里。
        - id: ch02-b19
          speaker: tiresome
          text: 不必了，多谢！白天那一场已经够我受的了，你这个蠢养猪人。
        - id: ch02-b20
          speaker: elfin
          text: 那就随你。明天说不定要轮到龙来猎你。它真来了，我可不在乎，你这个蠢王子。
        - id: ch02-b21
          speaker: tiresome
          text: 你太无礼了。
        - id: ch02-b22
          speaker: elfin
          text: 不，我只是说实话。
        - id: ch02-b23
          speaker: tiresome
          text: 那你就说清楚。你究竟知道什么，能让我保住那些河马？
        - id: ch02-b24
          speaker: elfin
          text: 你这话说得不大通顺。不过算了，我要是告诉你，你拿什么来换？
        - id: ch02-b25
          speaker: tiresome
          text: 你到底要告诉我什么？
        - id: ch02-b26
          speaker: elfin
          text: 就是你想知道的事。
        - id: ch02-b27
          speaker: tiresome
          text: 我什么都不想知道。
        - id: ch02-b28
          speaker: elfin
          text: 那你比我想的还蠢。你就不想赶在龙收拾你以前，先把它收拾掉吗？我的耐性平常就不多，现在更快用完了。你到底肯给什么？
        - id: ch02-b29
          speaker: tiresome
          text: 半个王国，再把我的堂妹公主嫁给你。
        - id: ch02-b30
          speaker: elfin
          text: 成交。龙到了夜里会缩小，就睡在这棵树根下面。我还拿它给篝火点火呢。
        - id: ch02-b31
          speaker: narrator
          text: 龙果然躺在树根下的一窝焦黑苔藓上，只有一根手指那么长。
        - id: ch02-b32
          speaker: tiresome
          text: 我要怎样才能杀死它？
        - id: ch02-b33
          speaker: elfin
          text: 能不能杀死它，我不知道。可你只要有容器，就能把它带走。那只猎壶正合适。
        - id: ch02-b34
          speaker: narrator
          text: 两人用树枝连捅带推，手指也稍稍烫伤，总算把龙逼进银猎壶。王子马上拧紧壶盖。
        - id: ch02-b35
          speaker: elfin
          text: 捉住了。咱们带它回去，在壶口盖上所罗门王的封印，就安全了。明天分好王国，我也有钱买漂亮衣裳去求婚。
        - id: ch02-b36
          speaker: narrator
          text: 可坏王子许诺，从来不是为了兑现。
        - id: ch02-b37
          speaker: tiresome
          text: 滚开！龙是我找到的，也是我关起来的。我没说过王国，更没说过求婚。你敢胡说，我马上砍掉你的脑袋！
          emotion: angry
        - id: ch02-b38
          speaker: narrator
          text: 他拔出宝剑。埃尔芬只是耸耸肩。
        - id: ch02-b39
          speaker: elfin
          text: 行啊。反正我过得比你好。
        - id: ch02-b40
          speaker: tiresome
          text: 你什么意思？
          emotion: angry
        - id: ch02-b41
          speaker: elfin
          text: 你不过有一个王国，再加一条龙。我却有一双干净的手，还有七十五头漂亮的黑猪。
    - id: ch03
      title: 冲破银壶的火龙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 埃尔芬回到火边坐下。王子则赶回城里，把议员们从梦中叫醒，告诉他们自己有多么聪明勇敢。议员们不敢生气，他们知道惹王子不高兴会有什么下场。
        - id: ch03-b02
          speakers: [parliamentarian_1, parliamentarian_2]
          ensemble: duo
          text: 您的确既勇敢又聪明。
        - id: ch03-b03
          speaker: narrator
          text: 首相郑重地在银壶口盖好所罗门王的封印，再把它送进国库。国库是城里最坚固的建筑，通体由纯铜造成，墙壁厚得如同滑铁卢桥。银壶被安放在一袋袋黄金中间。财政大臣手下末等办事员的初级秘书，奉命整夜坐在旁边，看看到底会发生什么。
        - id: ch03-b04
          speaker: narrator
          text: 那位秘书从来没见过龙，更不相信王子真的见过。王子小时候就不是个诚实的孩子，完全可能带回一只空壶，偏说里面关着一条龙。因此，秘书一点也不介意独自留下。别人把钥匙交给他，等全城人都重新上床，他便悄悄放进几个其他政府部门的初级秘书。大家在一袋袋黄金中间痛快地玩捉迷藏，还打开巨大的象牙箱，拿里面的钻石、红宝石和珍珠当弹珠玩。
        - id: ch03-b05
          speaker: narrator
          text: 玩着玩着，铜国库越来越热。银壶已经胀到三倍大，烫得快要发红。
        - id: ch03-b06
          speaker: junior_secretary
          text: 快看那只壶！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 壶越胀越大，空气越来越热。所有秘书一致认定，这里已经热得不能待，便争先恐后往外挤，慌乱中彼此绊倒。最后一个人刚逃出去锁上门，银壶便轰然炸开。火焰熊熊的龙从里面钻出来，而且每过一刻都长得更大。它先吞掉一袋袋黄金，又把珍珠、钻石和红宝石送进嘴里，像嚼糖块一样咯吱作响。
        - id: ch03-b08
          speaker: narrator
          text: 到了早餐时间，王子的全部珍宝已被吃得干干净净。约莫十一点，王子沿街走来，正好遇见龙从国库破碎的大门里迈出来，嘴边还滴着熔化的金子。他一看见便转身逃命，一直奔向防龙塔。站在高处的白公主看见他跑来，急忙下楼打开大门，让他进去，随后当着火龙的脸把防龙门砰地关紧。龙得不到自己想要的王子，只好坐在塔外不停呜咽。
        - id: ch03-b09
          speaker: narrator
          text: 公主把蒂尔瑟姆领进塔里最好的房间，亲手铺好桌布。她端来奶油、鸡蛋、白葡萄、蜂蜜和面包，还有许多黄色与白色的美味食物。这个坏王子明明夺走她的王国，又一直霸占着不肯归还，她却仍像招待任何别的客人一样亲切地服侍他。因为她是真正的公主，有一颗金子般的心。
        - id: ch03-b10
          speaker: narrator
          text: 吃饱以后，王子求公主教他开关大门。奶妈正在睡觉，没人拦着，公主便演示给他看。
        - id: ch03-b11
          speaker: sabrinetta
          text: 朝这边转，门会牢牢关住。可是往反方向转九圈，门就自己弹开了。
        - id: ch03-b12
          speaker: narrator
          text: 门果真弹开。就在它开启的那一刻，王子一把将白公主推出高塔，就像从前把她赶出自己的王国，接着把门重新关紧。他要独占这座高塔。公主孤零零站在街上，龙就在道路另一边坐着呜咽。可它没有扑来吃她。老奶妈并不知道其中的原因，龙吃不了有一颗金子心的白公主。
        - id: ch03-b13
          speaker: narrator
          text: 公主穿着绣雏菊的乳白丝裙，既没戴帽子，也没戴手套，不能就这样穿过城中街道。她只好朝相反的方向转身，越过一片片草地，向树林跑去。她一生从未离开过高塔，赤足踏上的青草柔软极了，仿佛天堂里的草。可她自己并不知道心是什么做的，也不敢确信龙不会伤害她。因为仍然害怕，她一口气逃进树林最深处。
        - id: ch03-b14
          speaker: narrator
          text: 洼地里，埃尔芬正吹着笛子。七十五头漂亮的黑猪围在他身旁，用后腿站着，快活地跳舞。
        - id: ch03-b15
          speaker: sabrinetta
          text: 请你保护我吧，我实在太害怕了。
          emotion: fearful
        - id: ch03-b16
          speaker: elfin
          text: 我会保护你。现在你安全了。是什么吓着你？
          emotion: calm
        - id: ch03-b17
          speaker: sabrinetta
          text: 那条龙。
          emotion: fearful
        - id: ch03-b18
          speaker: elfin
          text: 看来它逃出了银壶。真希望它已经把王子吃掉。
        - id: ch03-b19
          speaker: sabrinetta
          text: 它没有吃他。可你为什么这样说？
        - id: ch03-b20
          speaker: narrator
          text: 埃尔芬讲起王子如何骗走自己的功劳，又如何赖掉承诺。
        - id: ch03-b21
          speaker: elfin
          text: 他答应给我半个王国，还说要把堂妹公主嫁给我。
        - id: ch03-b22
          speaker: sabrinetta
          text: 真不像话！他怎么敢这样做？
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: 她想挣开埃尔芬的怀抱，他却抱得更紧。
        - id: ch03-b24
          speaker: elfin
          text: 怎么了？这当然不像话，至少我本来这样觉得。可只要我能留下现在怀里的，他爱留半个还是整个王国，都随他吧。
        - id: ch03-b25
          speaker: sabrinetta
          text: 你现在有什么？
        - id: ch03-b26
          speaker: elfin
          text: 有你呀，我的美人，我的心肝。至于他的堂妹，请原谅我。当初讨她时，我还没见过真正的公主，唯一的公主，我自己的公主。
        - id: ch03-b27
          speaker: sabrinetta
          text: 你指的是我？可五分钟前，你甚至还不认识我！
          emotion: surprised
        - id: ch03-b28
          speaker: elfin
          text: 五分钟前我是养猪人。现在我抱过你了，我就是王子，哪怕一辈子还得继续养猪。
        - id: ch03-b29
          speaker: sabrinetta
          text: 可你还没问我愿不愿意呢。
        - id: ch03-b30
          speaker: elfin
          text: 你已经请我保护你了。我会保护你一辈子。
        - id: ch03-b31
          speaker: narrator
          text: 事情就这么说定了。两人这才转而谈起真正要紧的事，那就是怎样对付龙和王子。直到这时，埃尔芬依然不知道眼前的姑娘就是那位公主，也不知道她本来就是王国的主人。可他看得出，她有一颗金子般的心，而且说了一遍又一遍，仿佛怎么也说不够。
        - id: ch03-b32
          speaker: elfin
          text: 我们错在没有准备一只防龙的瓶子。现在我算明白了。
        - id: ch03-b33
          speaker: sabrinetta
          text: 原来只缺这个？那很容易，我塔里的每样东西都防龙。我去拿瓶子。我们得制服那条龙，救下小孩子们。
        - id: ch03-b34
          speaker: narrator
          text: 她不肯让埃尔芬陪着。
        - id: ch03-b35
          speaker: sabrinetta
          text: 如果你真相信我有一颗金子心，龙就伤不了我。何况总要有人留下照顾猪群。
        - id: ch03-b36
          speaker: narrator
          text: 埃尔芬完全相信她，只好让她独自离开。
    - id: ch04
      title: 漩涡里的龙
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 公主回到高塔，发现大门敞开着。原来龙一直耐心守在外面，等候王子现身。王子只出门一瞬，原本想寄一封信给首相，告诉众人自己藏在哪里，再请他们派消防队来收拾火龙。可他刚刚踏出门槛，龙便抓住机会，一口把他吃了。眼看夜色将近，又快到了身体缩小的时候，吃饱的龙这才离开小城，回树林去了。
        - id: ch04-b02
          speaker: narrator
          text: 萨布丽妮塔走进塔里，先吻了吻奶妈，又替她沏上一杯茶。她把刚才发生的事情和接下来的打算都解释清楚，还告诉奶妈，自己有一颗金子心，所以龙根本吃不了她。奶妈认真一想，明白公主当然十分安全，于是也吻了吻她，不再阻拦，放她带着瓶子离开。
        - id: ch04-b03
          speaker: narrator
          text: 公主拿起锃亮的黄铜防龙瓶，跑回洼地。埃尔芬坐在油亮的黑猪中间，焦急等候。
        - id: ch04-b04
          speaker: elfin
          text: 我还以为你永远不回来了。你至少走了一年。
        - id: ch04-b05
          speaker: narrator
          text: 公主坐到他身旁。两人握着手，一直等到天黑。龙爬过苔藓，沿路留下一片焦黑，身体也越爬越小，最后蜷进树根下面。
        - id: ch04-b06
          speaker: elfin
          text: 你拿稳瓶子，我来把它赶进去。
        - id: ch04-b07
          speaker: narrator
          text: 他用树枝连戳带拨，终于把龙送进防龙瓶。可瓶子没有塞子。
        - id: ch04-b08
          speaker: elfin
          text: 没关系，我拿手指堵住瓶口。
        - id: ch04-b09
          speaker: sabrinetta
          text: 不，换我来！
        - id: ch04-b10
          speaker: narrator
          text: 埃尔芬当然不答应。他把手指紧紧塞住瓶口。
        - id: ch04-b11
          speaker: sabrinetta
          text: 去海边！快往悬崖跑！
        - id: ch04-b12
          speaker: narrator
          text: 两人拔腿飞奔，七十五头猪排成一列长长的黑色队伍，稳稳小跑着跟在后面。瓶里的龙使出浑身力气，不停喷火吐烟。黄铜瓶在埃尔芬手中越来越热，越来越热，热得几乎无法握住。可他的手指仍堵着瓶口，一路都没有松开。两人终于来到悬崖边，脚下是夜色中的深蓝大海，巨大的漩涡正在一圈又一圈地旋转。
        - id: ch04-b13
          speaker: narrator
          text: 埃尔芬把瓶子高举过头，奋力掷向星辰与海面之间。瓶子正好落进漩涡中央。
        - id: ch04-b14
          speaker: sabrinetta
          text: 我们救了这个国家。你也救了孩子们。快把手给我。
          emotion: happy
        - id: ch04-b15
          speaker: elfin
          text: 我不能。以后我再也握不了你亲爱的手了。我的手都烧没了。
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 他的双手果然不见了。手原本所在的地方，只剩两团漆黑的焦炭。公主俯身亲吻伤处，对着它们流泪，又从自己的乳白丝裙上撕下布条，小心替他包好。两人一同回到高塔，把全部经过讲给奶妈听。七十五头猪则端端正正坐在门外，安静等候。
        - id: ch04-b17
          speaker: sabrinetta
          text: 他是世上最勇敢的人。他救了国家，也救了孩子们。可他的手，他那双可怜又宝贵的手！
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: 门开了。猪群里年纪最大的一头走进来，靠在埃尔芬身上蹭来蹭去，嘴里发出充满爱意的轻哼。
        - id: ch04-b19
          speaker: nurse
          text: 看这个可爱的小东西。它知道，它心里全都知道！
          emotion: sad
        - id: ch04-b20
          speaker: narrator
          text: 萨布丽妮塔替没有双手的埃尔芬抚摸那头猪。
        - id: ch04-b21
          speaker: nurse
          text: 龙火烧伤只能用猪油治。这头忠心的猪，心里明白得很。
        - id: ch04-b22
          speaker: elfin
          text: 就算给我一个王国，我也不肯！
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: 他尽力用胳膊肘抚摸那头猪。
        - id: ch04-b24
          speaker: sabrinetta
          text: 难道没有别的办法了吗？
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: 又一只猪把黑鼻子探进门，接着又来一只，再来一只。没过多久，房间便挤满了猪。圆滚滚的黑色身子汇成一片不断起伏的浪潮。它们彼此推搡，彼此拥挤，都想来到埃尔芬身边。每一头猪都用真挚的爱所特有的语言，对着主人轻轻哼哼，仿佛愿意把自己的一切都献给他。
        - id: ch04-b26
          speaker: nurse
          text: 还有一个办法。瞧这些深情的小家伙，它们全都愿意为你去死。
          emotion: sad
        - id: ch04-b27
          speaker: sabrinetta
          text: 另一个办法是什么？快告诉我。
        - id: ch04-b28
          speaker: nurse
          text: 要是一个人被龙火烧伤，只要有足够多的人愿意为他死，每个人再亲一下伤处，从充满爱意的心底盼它痊愈，伤就会好。
        - id: ch04-b29
          speaker: sabrinetta
          text: 到底要多少人？
        - id: ch04-b30
          speaker: nurse
          text: 七十七个。
        - id: ch04-b31
          speaker: sabrinetta
          text: 猪儿们只有七十五头，加上我，也不过七十六个！
          emotion: sad
        - id: ch04-b32
          speaker: nurse
          text: 必须有七十七个。我实在不能为他去死，所以没办法了。他只能装一双软木手。
          emotion: sad
        - id: ch04-b33
          speaker: elfin
          text: 七十七颗爱他的心，这个法子我知道。可我没想到，我的猪儿们这样爱我，我的心上人也这样爱我。这反而让事情更难办。其实还有一种魔法，可要我娶你以外的人，我宁愿浑身烧成黑炭。
        - id: ch04-b34
          speaker: sabrinetta
          text: 你得娶谁，伤口才会好？
        - id: ch04-b35
          speaker: elfin
          text: 得娶一位公主。圣乔治就是这样治好烧伤的。
        - id: ch04-b36
          speaker: nurse
          text: 真想不到！我活到这么大，竟从没听说过这个办法。
          emotion: surprised
        - id: ch04-b37
          speaker: narrator
          text: 萨布丽妮塔伸手紧紧搂住埃尔芬的脖子，仿佛再也不放开。
        - id: ch04-b38
          speaker: sabrinetta
          text: 那就全解决了，我亲爱又勇敢的埃尔芬。我就是公主，你也会成为我的王子。走吧，奶妈，帽子也别戴了，我们现在就去结婚！
          emotion: happy
    - id: ch05
      title: 金子心的王国
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 于是，他们真的一刻也没有耽搁。奶妈连帽子都来不及戴，七十五头猪则庄严地排成两列黑色队伍，跟随大家前去。就在埃尔芬和萨布丽妮塔结为夫妻的那一刻，他烧焦的双手完全复原了。百姓早已受够蒂尔瑟姆和他那群横冲直撞的河马，于是欢呼着拥戴萨布丽妮塔与她的丈夫，尊他们为这片国土名正言顺的君主。
        - id: ch05-b02
          speaker: narrator
          text: 第二天早晨，王子和公主一同来到海边，想看看装着龙的瓶子是不是已经被浪冲上岸。他们沿岸寻找，却没看见龙的任何踪影。等两人向海上的漩涡望去，倒看见那里升起一大片蒸汽。不久，渔夫们也赶来报告，说方圆数英里的海水都已经热得足够拿来刮胡子。
        - id: ch05-b03
          speaker: narrator
          text: 那里的海水直到今天依然温热，所以我们很可以相信，那条龙的火气凶猛得非同寻常，就连整个大海所有的水加起来，也无法使它彻底冷却。漩涡的力量又太强，它无论怎样挣扎都逃不出去，只能永远随着海水一圈又一圈地旋转。这样一来，它总算做起了一件有用的事，天天替穷苦的渔民烧热刮胡子要用的水。
        - id: ch05-b04
          speaker: narrator
          text: 从此，王子和公主把国家治理得又好又明智。奶妈也一直跟他们住在一起，再不用操持任何辛苦的活计。她唯一还做的是精细针线，而且只在自己兴致很高、特别想动针的时候才做。埃尔芬当上王子以后，一头河马也没有养过，所以很自然地受到了所有百姓的爱戴。
        - id: ch05-b05
          speaker: narrator
          text: 七十五头忠心的猪住进白色大理石猪舍。每扇门都装着黄铜门环，门牌上还端端正正写着“猪”。它们每天用土耳其海绵和紫罗兰香皂洗两次澡。王子出门散步时，它们可以全都跟在后面，谁也不会抱怨。因为它们举止漂亮，总是规规矩矩走在人行道上，而且一见到“不许践踏草地”的告示，就会认真服从。
        - id: ch05-b06
          speaker: narrator
          text: 公主每天都用自己的双手，亲自给这七十五头忠心耿耿、举止优雅的猪喂食。她登上王位以后，颁布的第一道命令也正是为了它们。往后，国中任何人胆敢说出“猪肉”二字，一律处死。不只如此，这个词还必须从所有字典里彻底刮掉，再也不许留下半点痕迹。
