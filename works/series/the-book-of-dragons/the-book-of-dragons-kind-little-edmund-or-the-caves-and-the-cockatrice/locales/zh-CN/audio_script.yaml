audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    edmund:
      display_name: 埃德蒙
      tts:
        delivery: 好奇认真，自信而有些固执
        timbre: 明亮稚嫩
        pace: 明快
        pitch: 中高音
    granny:
      display_name: 祖母
      tts:
        delivery: 慈爱耐心，温和中带着不以为然
        timbre: 柔和苍老
        pace: 舒缓
        pitch: 中音
    master:
      display_name: 老师
      tts:
        delivery: 严厉武断，刻板而毫无幽默感
        timbre: 干涩冷硬
        pace: 稳重
        pitch: 中低音
    cockatrice:
      display_name: 鸡蛇兽
      tts:
        delivery: 庄重老练，偶尔不耐烦
        timbre: 洪亮而略带沙哑
        pace: 从容
        pitch: 中低音
    dragon:
      display_name: 黄龙
      tts:
        delivery: 威势逼人，敏感而自负
        timbre: 低沉轰鸣
        pace: 缓慢
        pitch: 低音
    drakling:
      display_name: 幼龙
      tts:
        delivery: 睡意蒙眬，听话而彬彬有礼
        timbre: 年幼而粗哑
        pace: 稍慢
        pitch: 中音
    townspeople_1:
      display_name: 市民甲
      tts:
        delivery: 直截了当，满腹怀疑
        timbre: 清晰结实
        pace: 平稳
        pitch: 中音
    townspeople_2:
      display_name: 市民乙
      tts:
        delivery: 实际冷淡，随声附和
        timbre: 轻快清脆
        pace: 平稳
        pitch: 中高音
  chapters:
    - id: ch01
      title: 埃德蒙与三种怪声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 埃德蒙是个男孩。不喜欢他的人说，世上再没有比他更叫人头疼的孩子。祖母和朋友们却说，他只是爱探究。祖母还总说他是天底下最好的孩子。当然，她年纪很大，心肠也特别软。
        - id: ch01-b02
          speaker: narrator
          text: 埃德蒙什么事都想亲自弄明白。照理说，这样的孩子应该天天上学，因为世上凡是能学到的东西，若有什么地方能教给你，那地方自然就是学校。可埃德蒙并不想让别人教。他觉得学习和亲手探究根本不是一回事。他看到钟表滴答行走，就要把零件全拆开，看看是什么让它不停转动。他看到门锁咔嗒扣住，就要把锁从门板上卸下来，找出它为何能够锁门。就连一只弹来跳去的橡皮球，也逃不过他的手。他把球剖开，翻来覆去寻找弹跳的秘密。结果呢，他什么也没找到。这一点，倒和曾经做过同样试验的你一模一样。
        - id: ch01-b03
          speaker: narrator
          text: 埃德蒙和祖母住在一起。祖母非常疼爱他，就算那颗爱探究的心又闯了祸，也很少真正责骂。在祖母眼里，他无论惹出什么麻烦，终究还是天底下最好的孩子。她有一把玳瑁梳。埃德蒙偏想知道，它究竟是真正的玳瑁，还是别的某种会燃烧的材料。于是，他把梳子放到火边试验，最后烤得又卷又焦。祖母对这件事也只说了他几句。埃德蒙当然不是完全不上学。他偶尔还是会去一趟。有时候，课堂上的知识硬是钻进他的脑袋，让他没法避免地学会一点。不过你可以放心，他从来不是故意要学的。
        - id: ch01-b04
          speaker: edmund
          text: 上学太浪费时间了。老师讲的都是人人知道的事。我要发现谁也没想到过的新东西。
        - id: ch01-b05
          speaker: granny
          text: 世上的学者已经琢磨了几千年。我看，他们全都没想到的事，恐怕不会轻易叫你碰上。
        - id: ch01-b06
          speaker: narrator
          text: 埃德蒙一点也不同意祖母的话。他一有机会便逃学。你要记住，他这样做是因为心地善良。他不忍心让老师把宝贵的时间和力气，全都浪费在一个不肯学习、只想亲手探究的孩子身上。学校里还有那么多品行端正的男孩，眼巴巴等着老师传授地理、历史、阅读、算术和斯迈尔斯先生的《自助》呢。别的男孩当然也会逃学。他们跑到城外有树林和树篱的地方，采坚果、黑莓和野李子。埃德蒙却从不往那个方向走。他每次都爬上另一边的山。那里巨石嶙峋，高大的黑松遮住天空，深深的洞穴里还会传出古怪而可怕的声音。城里人因为那些声音，谁也不敢靠近。埃德蒙却不害怕，他只想亲手查出声音的来历。
        - id: ch01-b07
          speaker: narrator
          text: 有一天，埃德蒙终于有了查明真相的办法。他独自发明一盏新奇的提灯，材料是一只芜菁和一个玻璃杯。他再从祖母卧室的烛台上取来蜡烛，装进去一试，灯光竟然相当漂亮。第二天他不得不去学校，因为擅自缺课挨了藤条。他已经老老实实解释过，自己忙着做灯，实在没有时间上学，可老师还是不肯放过他。又过一天，他天不亮就起了床。祖母替他准备的学校午饭是两只煮鸡蛋和一只苹果馅饼。他带上午饭，提起新灯，像一支箭那样直奔山中洞穴。
        - id: ch01-b08
          speaker: narrator
          text: 洞穴黑得厉害，不过提灯把四周照得很好。岩洞里有钟乳石、石笋和化石，还有给少年读的知识书中提过的一切奇观。换个时候，它们也许值得研究，可埃德蒙眼下一个也顾不上看。他只想知道，别人害怕的声音到底从哪里来。可是那些岩石不会开口告诉他。后来，他在最大的洞穴里坐下，一动不动地仔细听。渐渐地，三种声音分开了。最响的是沉重的隆隆声，像一位身材魁梧的老先生吃完饭睡熟了。它下面还压着一阵较小的隆隆声。第三种声音又打鸣又咯咯叫，仿佛有一只鸡长得跟干草垛一样大。
        - id: ch01-b09
          speaker: edmund
          text: 咯咯声离我最近。我这回总算要弄明白一件事了。
        - id: ch01-b10
          speaker: narrator
          text: 他爬进洞壁半腰的窟窿，沿着一条石道往前走。通道弯来绕去，咯咯声越来越清楚。前面还透来一道淡黄色的光，像是从门缝里漏出来的。
        - id: ch01-b11
          speaker: edmund
          text: 那大概就是地心的火。这件事，我在学校里没忍住，还是学会了。
        - id: ch01-b12
          speaker: narrator
          text: 火光忽然一闪，暗了下去，咯咯声也停了。埃德蒙转过弯，推开虚掩的石门。门后是一个像圣保罗大教堂穹顶那么高的圆洞。中央有只巨大的石盆，里面坐着一个苍白的家伙。它长着人的脸、狮鹫的身体、羽毛丰满的翅膀、蛇尾巴，还有公鸡的冠子和颈羽。
        - id: ch01-b13
          speaker: edmund
          text: 你到底是什么？
        - id: ch01-b14
          speaker: cockatrice
          text: 我是一只快饿死的鸡蛇兽。我肯定活不成了！我的火灭啦。我一定睡过了头，连表也走得不准。每过一百年，我得用尾巴绕着火搅七圈，它才能一直燃烧。现在一切都完了。
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 我想，我已经说过埃德蒙有多么善良。
        - id: ch01-b16
          speaker: edmund
          text: 别灰心，我替你重新点火。
          emotion: calm
        - id: ch01-b17
          speaker: narrator
          text: 埃德蒙说完便跑出洞穴。几分钟后，他从外面的松林抱回一大捆干树枝。口袋里还有一两本课本，是他以前疏忽大意，忘记及时弄丢的，竟然一直完好无损地留到今天。他把松枝和课本堆在鸡蛇兽四周，点起一圈火。木柴很快熊熊燃烧。没过多久，石盆里的一种液体也跟着着了，蓝亮的火苗跳起来，像“火焰葡萄干”游戏里燃烧的白兰地。鸡蛇兽立刻伸出尾巴，在液体中绕圈搅动，又张开大翅膀，在火焰里一下下拍打。几滴滚烫的火液飞出石盆，溅到埃德蒙手上，把他烫得很厉害。可鸡蛇兽的身体一点点恢复了颜色，也重新有了力气。它原本苍白的冠子变得鲜红，暗淡的羽毛也重新油亮起来，整个家伙又强壮又快活。
        - id: ch01-b18
          speaker: cockatrice
          text: 鸡——蛇——兽——喔喔喔！
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 鸡蛇兽连声向他道谢，埃德蒙说，这件事不用放在心上，能亲眼见它恢复健康，自己也很高兴。
        - id: ch01-b20
          speaker: cockatrice
          text: 那么，我能替你做什么？
        - id: ch01-b21
          speaker: edmund
          text: 给我讲故事吧。我要听学校里没人知道的真事。
        - id: ch01-b22
          speaker: narrator
          text: 鸡蛇兽便讲起矿井、地下宝藏和大地里的岩层是怎样形成的。它告诉埃德蒙，地底深处藏着哪些东西，又有哪些秘密从来没有写进学校的课本。它讲地精、仙女和龙，也讲冰川怎样移动，石器时代的人怎样生活，世界刚刚开始时又是什么模样。它还说到独角兽与凤凰，说到魔法里的黑与白。埃德蒙坐在那里，一边剥开煮鸡蛋，一边咬着苹果馅饼，始终听得入神。等到午饭吃完很久，肚子再次饿起来，他才依依不舍地告别回家。第二天他又来听，第三天也来，往后的许多天，他一直来。回到学校，他把鸡蛇兽和那些奇妙的真实故事讲给别的男孩。大家听得津津有味，还盼着他继续往下讲。可他把同样的事讲给老师，换来的却是一顿藤条，因为老师认定他在撒谎。
        - id: ch01-b23
          speaker: edmund
          text: 我没有撒谎。你看看我手上被火烫出的伤。
        - id: ch01-b24
          speaker: master
          text: 这只能证明你又玩火闯祸了。
        - id: ch01-b25
          speaker: narrator
          text: 老师把他抽得更狠。那位老师无知又不肯相信人。不过听说，也有些老师不是这样的。
    - id: ch02
      title: 黄龙吞下小城
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又有一天，埃德蒙用从学校实验室悄悄顺来的化学材料做了一盏新灯。他带着这件新发明重回山里，要寻找另外两种隆隆声的主人。这次，他在山的另一边发现一条从没走过的黑暗通道。通道四壁从头到尾全包着黄铜，人在里面行走，就像钻进一架巨型望远镜。最深处立着一扇鲜绿色的门。门上的铜牌写着“龙太太家，请敲门并按铃”，旁边的白纸条又写着“三点叫醒我”。埃德蒙恰好有一块手表，是两天前过生日时收到的。他还没来得及拆开研究，所以表仍旧走得很准。当时，指针正指着差一刻三点。
        - id: ch02-b02
          speaker: narrator
          text: 善良的埃德蒙不肯提前打扰人家，便坐在黄铜门阶上等到三点。他敲门按铃，里面传来咔啦声和呼哧声。大门猛然打开，他刚躲到门后，一条庞大的黄龙便钻了出来。她沿通道扭动爬行，像一条咔啦作响的长虫，更像一条骇人的巨型蜈蚣。
        - id: ch02-b03
          speaker: narrator
          text: 黄龙爬到岩石上晒太阳。埃德蒙蹑手蹑脚绕过她，冲下山，跑进学校。
        - id: ch02-b04
          speaker: edmund
          text: 一条大龙正朝这里来！快想办法，不然大家全会被毁掉！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 老师立刻因为他撒谎而抽他。老师从不把责任留到以后。埃德蒙让大家看窗外，山顶上果然升起一团巨大的黄云。
        - id: ch02-b06
          speaker: master
          text: 那只是一场雷阵雨。
        - id: ch02-b07
          speaker: narrator
          text: 老师又抽了他一顿。他固执得很，要是眼睛看到的东西和自己先前的话不同，他宁肯不信眼睛。接着，他在黑板上写道，撒谎很不对，说谎的人必须挨打，这是为他们好。他要埃德蒙抄七百遍。
        - id: ch02-b08
          speaker: narrator
          text: 趁老师还在黑板前忙碌，埃德蒙悄悄溜出学校。他拼命跑过小城，要赶回去警告祖母，可祖母偏偏不在家。他又从城后的门冲出去，一口气奔上山，要把消息告诉鸡蛇兽，请它相助。他根本没想过鸡蛇兽也许会怀疑自己。毕竟，鸡蛇兽给他讲了那么多奇妙的故事，他从头到尾全都相信。你若相信一个人讲的每件事，那个人也理当相信你讲的事。无论怎么看，这才公平。
        - id: ch02-b09
          speaker: narrator
          text: 到鸡蛇兽的洞口时，埃德蒙已经喘不过气。他停下脚步，回头俯瞰平原。刚才奔跑的时候，两条小腿一直发抖，巨大黄云的阴影也一路盖在他身上。现在，他又站在温暖的大地和蓝天之间。绿色平原上点缀着果树，散落着红屋顶的农庄，一块块金黄的麦田在日光下发亮。灰色小城位于平原中央。坚固城墙上开着弓箭手射击用的孔洞，方形塔楼也留着专门的洞口，可以把熔化的铅浇到陌生人头上。城中有桥梁和尖塔。安静的河流两边长着柳树与桤木。中央还有一片宜人的绿园子，节日里，人们会坐在那里抽烟斗、听乐队演奏。这一切，埃德蒙全看见了。他也看见巨大的黄龙正爬过平原。她碰到的东西立刻枯萎，所过之处留下长长的黑线。更可怕的是，她比整座小城还大上许多倍。
        - id: ch02-b10
          speaker: edmund
          text: 啊，我可怜的亲祖母！
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: 黄龙越靠越近，长长的红舌舔着嘴唇。老师却还在认真上课，半点也不信埃德蒙的话。
        - id: ch02-b12
          speaker: edmund
          text: 不管怎样，他很快就非信不可了。
        - id: ch02-b13
          speaker: narrator
          text: 埃德蒙虽然心肠柔软，想到老师将要用这种办法学会相信自己，却没有像应该的那样难过。黄龙停在城外，把嘴越张越大，越来越大。老师虽然就在城里，和善的埃德蒙仍不忍看那可怕的一幕，只好紧紧闭上眼。四周安静下来以后，他才敢再次睁开。整座小城已经消失，原来立着城墙和尖塔的地方，只剩下一块光秃秃的空地。黄龙心满意足地舔着嘴唇，慢慢把身子盘成一团，像一只刚刚吃完老鼠的小猫那样准备睡觉。埃德蒙先倒吸一口气，又倒吸一口气，随后转身冲进洞穴，要把灾难告诉鸡蛇兽。
        - id: ch02-b14
          speaker: cockatrice
          text: 唔。那又怎么样？
        - id: ch02-b15
          speaker: edmund
          text: 你没明白。那条龙把整座城吞下去了。
        - id: ch02-b16
          speaker: cockatrice
          text: 这很要紧吗？
        - id: ch02-b17
          speaker: edmund
          text: 我住在那里。祖母也在那里，我不能就这样失去她。
        - id: ch02-b18
          speaker: cockatrice
          text: 我不懂祖母是什么。要是那是一件你很看重的财物，你也可以搬来和我住。
        - id: ch02-b19
          speaker: edmund
          text: 祖母当然要紧！请你帮帮我，我该怎么办？
        - id: ch02-b20
          speaker: cockatrice
          text: 去找那只幼龙，把它带到这里。
        - id: ch02-b21
          speaker: narrator
          text: 埃德蒙又问为什么。老师一向受不了他这个习惯，鸡蛇兽也不打算忍耐。
        - id: ch02-b22
          speaker: cockatrice
          text: 别来烦我！主意已经给你了，爱听不听。把幼龙带来，我就告诉你下一步。不带就算了，我再也不管你。
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: 鸡蛇兽把四周的火焰一直拢到肩头，把身体严严实实地缩进火里，闭上眼睡了。这正是管教埃德蒙的好办法，只是以前谁也没想到试一试。埃德蒙站在原地，盯着它看了一会儿。鸡蛇兽从眼角偷看埃德蒙，却装作已经睡熟，还故意把鼾打得震天响。埃德蒙这才彻底明白，它绝不会容忍自己胡闹。从这一刻起，他对鸡蛇兽肃然起敬。他没有再问一个问题，立刻动身，完完全全照着吩咐去做。这大概是他有生以来的第一次。
    - id: ch03
      title: 穿五十双鞋的幼龙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 埃德蒙虽然常逃学，却也知道一些你未必知道的事。他知道幼龙就是龙的孩子。三种怪声里，咯咯声来自鸡蛇兽，最大的隆隆声来自黄龙，那么较小的隆隆声自然属于幼龙。
        - id: ch03-b02
          speaker: narrator
          text: 他大胆闯进一条条洞穴，找了又走，走了又找，终于在山腹深处看见第三扇门。门上写着“宝宝正在睡觉”。就在门前，整整齐齐摆着五十双铜鞋。谁只要看上一眼，都能认出这些鞋是给什么脚穿的，因为每只鞋面都有五个孔，正好容下幼龙的五只爪子。幼龙随了它的母亲，身上恰好有一百只脚，不多一只，也不少一只，因此每天出门都要穿整整五十双鞋。在那些很有学问的书里，这一种龙被叫作百足龙。
        - id: ch03-b03
          speaker: narrator
          text: 埃德蒙很害怕，可一想到鸡蛇兽严厉的眼神和坚定的鼾声，还是鼓足勇气推开了门。
        - id: ch03-b04
          speaker: edmund
          text: 喂，幼龙！马上起床。
        - id: ch03-b05
          speaker: drakling
          text: 还没到时候呢。
        - id: ch03-b06
          speaker: edmund
          text: 不管到没到时候，你母亲叫你起来。快一点！
        - id: ch03-b07
          speaker: narrator
          text: 幼龙没有吃他，只叹着气下了床。它边走出房间边穿鞋，身子虽比母亲小，也足有一座浸礼会教堂那么大。它笨手笨脚地摆弄到第十七只鞋，埃德蒙又催它快些。
        - id: ch03-b08
          speaker: drakling
          text: 妈妈说过，我不穿好鞋就不能出门。
        - id: ch03-b09
          speaker: narrator
          text: 埃德蒙只好帮忙。这件事又费时间又不舒服。等五十双鞋全穿好，他已经忘了害怕，领着幼龙回到鸡蛇兽那里。通道太窄，幼龙便像胖虫钻硬土缝一样，把身体缩得细细的。
        - id: ch03-b10
          speaker: cockatrice
          text: 请坐下等一等。你母亲很快就来。
        - id: ch03-b11
          speaker: narrator
          text: 幼龙坐下，却馋巴巴地盯着火盆。
        - id: ch03-b12
          speaker: drakling
          text: 对不起，我每天起床都要先吃一小盆火，现在饿得发晕。我能吃一点吗？
        - id: ch03-b13
          speaker: narrator
          text: 它伸出一只爪子。
        - id: ch03-b14
          speaker: cockatrice
          text: 当然不能！你是在哪里长大的？难道没人教过你，看见什么都不能伸手讨要吗？
        - id: ch03-b15
          speaker: drakling
          text: 对不起，可我真的非常饿。
        - id: ch03-b16
          speaker: narrator
          text: 鸡蛇兽把埃德蒙叫到盆边，贴着他的耳朵认真低语了很久，烧掉了他一边的不少头发。埃德蒙一次也没问为什么。听完以后，他温和地转向幼龙。
        - id: ch03-b17
          speaker: edmund
          text: 可怜的小家伙，你如果真饿了，我知道哪里有吃不完的火。
        - id: ch03-b18
          speaker: narrator
          text: 他领幼龙来到一扇圆铁盖前。那东西像工人往地窖里倒煤的入口，只是大得多。埃德蒙拉住铁钩掀起盖子，一股热浪险些让他窒息。幼龙却凑过去，用一只眼睛朝下看，又吸了吸鼻子。
        - id: ch03-b19
          speaker: drakling
          text: 闻起来真香，是不是？
        - id: ch03-b20
          speaker: edmund
          text: 是呀。下面是地心的火，多得很，火候也正好。快下去吃早饭吧。
        - id: ch03-b21
          speaker: narrator
          text: 幼龙钻进洞口，沿通向地心的斜井越爬越快。埃德蒙照鸡蛇兽的吩咐，抓住它的尾巴尖，把铁钩穿过去，牢牢挂住。它无法转身爬回来，因为通往地下火焰的路下去容易，回来却绝无可能。有句拉丁文专说这件事，开头就是“Facilis descensus”。
        - id: ch03-b22
          speaker: narrator
          text: 幼龙就这样被自己的傻尾巴牢牢钩住。它不能掉进地心，也不能回过头来照看受苦的尾巴。埃德蒙在旁边忙得十分起劲，觉得自己既重要又能干，对这一番成果满意极了。他确认铁钩不会脱开，便沿来路匆匆跑回火盆旁，站到鸡蛇兽面前，请示下一步该怎么办。
        - id: ch03-b23
          speaker: cockatrice
          text: 到洞口去嘲笑黄龙，一定要让她听见。
        - id: ch03-b24
          speaker: narrator
          text: 埃德蒙差点又问为什么，及时忍住，只说黄龙听不见。鸡蛇兽说，既然他最明白，那就算了，随后又要缩进火里。埃德蒙赶紧照办。他的笑声在洞口来回碰撞，听起来像满满一城堡的巨人都在大笑。
    - id: ch04
      title: 小城落在山坡上
      blocks:
        - id: ch04-b01
          speaker: dragon
          text: 你笑什么？
          emotion: angry
        - id: ch04-b02
          speaker: edmund
          text: 笑你。
        - id: ch04-b03
          speaker: narrator
          text: 埃德蒙继续笑。黄龙也和别人一样，最受不了被人取笑。她刚吃了一顿大餐，只能拖着沉重的身体慢慢爬上山，又问了一遍。那声音可怕得叫埃德蒙觉得，自己这辈子再也笑不出来了。
        - id: ch04-b04
          speaker: cockatrice
          text: 我们在笑你！你把自己的幼龙连同小城一起吞了。你亲生的小幼龙！嘻嘻嘻，哈哈哈！
        - id: ch04-b05
          speaker: edmund
          text: 哈，哈！
        - id: ch04-b06
          speaker: dragon
          text: 哎呀，我刚才就觉得那座城有点卡嗓子。得把它拿出来，再仔细找一遍。
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: 黄龙又咳又噎，整座小城一下落到山坡上。埃德蒙已经从鸡蛇兽那里听完下一步。他用圆铁门使劲夹幼龙的尾巴。幼龙在山腹里凄惨号叫，黄龙立刻听见了。
        - id: ch04-b08
          speaker: dragon
          text: 宝宝怎么啦？它根本不在小城里！
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: 黄龙把自己缩得又细又长，钻进山里找孩子。鸡蛇兽留在火盆里不停放声大笑，埃德蒙则守在圆铁盖旁，一下一下夹那条可怜的尾巴，好让幼龙继续叫喊。黄龙听着声音，在弯曲的山洞中越钻越深。等她的脑袋终于来到圆洞前，细长的身体还塞满了身后的通道，尾巴更是远在一两英里外的山外。埃德蒙听出她已经靠近，便最后狠夹一下幼龙的尾巴。随后他抓住铁钩，猛地掀起圆盖，自己躲在盖子后面，不让黄龙看见。他飞快解开穿过尾巴的铁钩。黄龙刚好探头朝斜井里看，只看见孩子的尾巴滑向深处，最后一声痛苦的尖叫也随它消失在光滑倾斜的井道里。
        - id: ch04-b10
          speaker: narrator
          text: 可怜的黄龙不论还有什么缺点，做母亲却好极了。她看到孩子的尾巴滑走，想也没想便一头扎进洞里，沿着斜井去追幼龙。埃德蒙先看着她的脑袋下去，接着是脖子和身子，一段又一段，始终没有尽头。为了穿过洞穴，她把身体拉得实在太细太长，光是从埃德蒙眼前滑过去，就花了整整一夜。那情形活像站在德国的铁路边，看一列长得没完没了的货运火车驶过。等最后一截尾巴终于消失，埃德蒙马上砰地盖上铁门。他心地善良，一想到黄龙母子从今以后永远都有最爱吃的火，便觉得这件事有了一个令人满意的结局。
        - id: ch04-b11
          speaker: narrator
          text: 埃德蒙认真谢过鸡蛇兽的帮助，这才离开洞穴。他沿着山路赶回家，时间刚好够吃一顿早饭，又在九点以前走进学校。若是小城仍旧坐落在原来的地方，也就是平原中央那条河的旁边，他无论怎样飞奔都不可能赶得上。可是经过昨夜的灾难，小城已经在黄龙把它吐下来的山坡上牢牢扎根。学校也随着整座城搬到了离洞穴很近的地方，这才让埃德蒙准时赶到。
        - id: ch04-b12
          speaker: master
          text: 你昨天到哪里去了？
        - id: ch04-b13
          speaker: narrator
          text: 埃德蒙解释完，老师立刻因为他不说实话而抽他。
        - id: ch04-b14
          speaker: edmund
          text: 这是真的！整座城都被龙吞了，你明明知道。
        - id: ch04-b15
          speaker: master
          text: 胡说。那只是一场雷雨加一次地震。
        - id: ch04-b16
          speaker: edmund
          text: 那你怎么解释小城现在到了山坡上，不再像从前那样待在河边？
        - id: ch04-b17
          speaker: master
          text: 小城一直都在山坡上。
        - id: ch04-b18
          speaker: narrator
          text: 全班同学也这么说。他们比埃德蒙聪明，不肯和手持藤条的人争论。
        - id: ch04-b19
          speaker: edmund
          text: 那就看看地图。
        - id: ch04-b20
          speaker: narrator
          text: 埃德蒙的肉身虽然可以挨打，在辩论里却绝不肯认输。老师抬手指向墙上的地图。大家一看，小城果然明明白白画在山坡上，仿佛从来不曾靠近河流。全班只有埃德蒙看得出其中的道理。整座城被巨龙吞进肚子，又被猛烈咳到山坡上，遭受了那么大的震荡，当然会连所有地图也一起震乱，让它们跟着变得不对。可老师听完，只是又抽了他一顿。老师还特意解释，这一次并不是罚他撒谎，而是罚他总爱争辩，实在叫人心烦。由此你便能看出，这位老师是个多么偏执、多么无知的人。他和你那所好学校里备受敬爱的校长，实在完全不同。你善良的父母愿意把你送到那么好的学校，真值得庆幸。
        - id: ch04-b21
          speaker: narrator
          text: 第二天，埃德蒙还想证明自己的故事。他告诉大家，只要亲眼见到鸡蛇兽，谁也不能再说他撒谎。他居然真的说服了几个人，带着他们一路走进山洞，来到那扇石门前。可鸡蛇兽早已从里面闩紧了门。无论埃德蒙怎样敲，里面都不肯开门。大家什么怪兽也没有见到，只觉得被他领着白跑了一趟，于是狠狠责骂他，说他带众人追了一场野鹅。
        - id: ch04-b22
          speakers: [townspeople_1, townspeople_2]
          ensemble: duo
          text: 野鹅和鸡蛇兽一点也不像。
        - id: ch04-b23
          speaker: narrator
          text: 可怜的埃德蒙明知他们错得厉害，却一句话也说不出。只有祖母相信他。不过，她年纪很大，心地慈祥，而且一直说埃德蒙是天底下最好的孩子。
        - id: ch04-b24
          speaker: narrator
          text: 这个长故事到头来只带来一件好事。从那以后，埃德蒙不再完全是从前那个叫人头疼的男孩。他还是喜欢探究，却不再每逢一件事都争辩到底。他甚至答应去给锁匠当学徒，老老实实学习锁和钥匙的本领。当然，他肯这样做也有自己的打算。他希望有朝一日，自己能够撬开鸡蛇兽前门那把紧闭的锁，再进去听一听那些别人不知道的故事。日子一年年过去，埃德蒙早就不再是个小男孩。如今，他已经是一位相当年迈的老人。可是鸡蛇兽的那扇门，他直到今天也没能打开！
