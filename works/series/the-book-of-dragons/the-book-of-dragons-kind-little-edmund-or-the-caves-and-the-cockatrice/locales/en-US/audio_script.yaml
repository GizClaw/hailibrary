audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, playful, and story-rich
        timbre: clear and rounded
        pace: measured with lively turns
        pitch: medium
    edmund:
      display_name: Edmund
      tts:
        delivery: curious, earnest, and stubbornly confident
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    granny:
      display_name: Granny
      tts:
        delivery: loving, patient, and gently doubtful
        timbre: soft and aged
        pace: unhurried
        pitch: medium
    master:
      display_name: Schoolmaster
      tts:
        delivery: severe, certain, and humorlessly proper
        timbre: dry and hard
        pace: deliberate
        pitch: medium-low
    cockatrice:
      display_name: Cockatrice
      tts:
        delivery: dignified, knowing, and sometimes irritable
        timbre: resonant and faintly raspy
        pace: measured
        pitch: medium-low
    dragon:
      display_name: Dragon
      tts:
        delivery: enormous, touchy, and self-important
        timbre: deep and rumbling
        pace: slow
        pitch: low
    drakling:
      display_name: Drakling
      tts:
        delivery: sleepy, obedient, and politely hungry
        timbre: young and gravelly
        pace: slow
        pitch: medium
    townspeople_1:
      display_name: First Townsperson
      tts:
        delivery: skeptical and blunt
        timbre: clear and sturdy
        pace: medium
        pitch: medium
    townspeople_2:
      display_name: Second Townsperson
      tts:
        delivery: skeptical and matter-of-fact
        timbre: light and crisp
        pace: medium
        pitch: medium-high
  chapters:
    - id: ch01
      title: Edmund and the Three Noises
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Edmund was a boy. People who disliked him called him the most tiresome boy who ever lived. His grandmother and his friends said he had an inquiring mind, and Granny often called him the best of boys. But Granny was very old and very kind.
        - id: ch01-b02
          speaker: narrator
          text: Edmund loved finding things out. That may sound like a reason to attend school every day, since school is meant to teach whatever can be learned. But Edmund did not want to learn things. He wanted to find them out, and to him those were quite different matters.
        - id: ch01-b03
          speaker: narrator
          text: His inquiring mind led him into all kinds of experiments. He pulled clocks apart to discover what made them go. He removed locks from doors to discover what made them stick. He even cut open an India rubber ball to find the secret of its bounce. He never found that secret, any more than you did when you tried the same experiment.
        - id: ch01-b04
          speaker: narrator
          text: Edmund lived with Granny, who loved him in spite of that inquiring mind. She hardly scolded him even when he frizzled her tortoiseshell comb while testing whether it was real shell or something that would burn. He did go to school now and then. Sometimes he could not help learning something there, but he never did it on purpose.
        - id: ch01-b05
          speaker: edmund
          text: School wastes so much time. They only teach what everyone knows already. I want to discover something new, something nobody but me has ever thought of.
        - id: ch01-b06
          speaker: granny
          text: I don't believe you'll discover anything that all the wise men in the world have missed for thousands of years.
        - id: ch01-b07
          speaker: narrator
          text: Edmund disagreed. He played truant whenever he could. He was kindhearted, you see, and could not bear to think of a master's time and labor being wasted on a boy like him. Edmund did not wish to learn. He wished only to find things out. Meanwhile, plenty of worthy lads were thirsting for instruction in geography, history, reading, arithmetic, and Mr. Smiles's “Self-Help.”
        - id: ch01-b08
          speaker: narrator
          text: Other boys played truant too. They went gathering nuts, blackberries, or wild plums. Edmund never went toward the green woods and hedges. He climbed the mountain instead, among huge rocks and tall, dark pines. Everyone else feared that place because strange sounds came from its caves.
        - id: ch01-b09
          speaker: narrator
          text: The sounds were strange and terrible, but Edmund was not afraid. He meant to find out what made them. One day, he did.
        - id: ch01-b10
          speaker: narrator
          text: He invented a clever new lantern from a turnip and a tumbler. When he borrowed the candle from Granny's bedroom candlestick, it gave a splendid light. He had to attend school the next day, where he was caned for staying away without permission. He explained honestly that making the lantern had kept him too busy for school.
        - id: ch01-b11
          speaker: narrator
          text: The morning after that, he rose very early. He took the school lunch Granny had prepared, two boiled eggs and an apple turnover, picked up his lantern, and flew straight toward the mountain caves.
        - id: ch01-b12
          speaker: narrator
          text: The caves were terribly dark, but his lantern lit them beautifully. They were fascinating places, full of stalactites, stalagmites, fossils, and all the other wonders described in instructive books for young people. Edmund cared nothing for those things just then. He wanted to know what made the sounds that frightened everyone, and nothing he saw in the caves gave him an answer.
        - id: ch01-b13
          speaker: narrator
          text: At last he sat in the largest cave and listened closely. Three sounds began to separate themselves. One was a deep rumble, like an enormous old gentleman sleeping after dinner. Beneath it ran a smaller rumble. The third was a crowing, clucking sound, like a chicken as large as a haystack.
        - id: ch01-b14
          speaker: edmund
          text: That clucking sounds closer than the other two.
        - id: ch01-b15
          speaker: narrator
          text: He searched the caves again. He learned nothing until he noticed a hole halfway up one wall. Being a boy, he climbed to it and crawled inside. It opened into a rocky passage. The clucking was much clearer there, while the rumbles nearly faded away.
        - id: ch01-b16
          speaker: edmund
          text: At last I'm going to find something out.
        - id: ch01-b17
          speaker: narrator
          text: On he went. The passage wound and twisted, twisted and turned, then turned and wound again. After a while Edmund noticed that the way ahead looked brighter.
        - id: ch01-b18
          speaker: edmund
          text: My lantern keeps burning better and better.
        - id: ch01-b19
          speaker: narrator
          text: Then he saw that the extra light did not come from his lantern. A pale yellow glow shone far along the passage through what seemed to be a crack beside a door.
        - id: ch01-b20
          speaker: edmund
          text: I expect that's the fire in the middle of the earth. I couldn't help learning about it at school.
        - id: ch01-b21
          speaker: narrator
          text: Suddenly the distant fire flickered pale and sank. The clucking stopped. Around the next corner stood a rocky door, slightly open. Edmund stepped through it into a round cavern as high and domed as St. Paul's.
        - id: ch01-b22
          speaker: narrator
          text: A hollow like a gigantic hand basin lay in the center. Inside it sat a large, pale person with a man's face, a griffin's body, great feathered wings, a snake's tail, and the comb and neck feathers of a cock.
        - id: ch01-b23
          speaker: edmund
          text: Whatever are you?
        - id: ch01-b24
          speaker: cockatrice
          text: I'm a poor, starving cockatrice, and I know I'm going to die! My fire has gone out. I must have fallen asleep, and my watch must have been wrong. Once every hundred years, I have to stir the fire seven times around with my tail. Now it's gone, and I shall die.
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: I believe I have already mentioned that Edmund was kindhearted.
        - id: ch01-b26
          speaker: edmund
          text: Don't give up. I'll light it again for you.
          emotion: calm
        - id: ch01-b27
          speaker: narrator
          text: Edmund hurried outside. A few minutes later, he returned carrying a great armful of sticks from the pine trees. He also had one or two lesson books which, by an oversight, he had not yet managed to lose. They were still safe in his pocket. With the pine sticks and those lesson books, he lit a fire all around the cockatrice.
        - id: ch01-b28
          speaker: narrator
          text: The wood flared. Then something inside the basin caught, a liquid that burned like brandy in a snapdragon. The cockatrice stirred it with his tail and beat it with his wings. A splash landed on Edmund's hand and burned him badly.
        - id: ch01-b29
          speaker: narrator
          text: But the cockatrice turned red and strong and happy. His comb became scarlet, his feathers shone, and he rose up with a loud, clear cry.
        - id: ch01-b30
          speaker: cockatrice
          text: Cock-a-trice-a-doodle-doo!
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: Edmund's kindly heart rejoiced to see him healthy again. When the cockatrice began thanking him, Edmund assured him it was nothing and that he was delighted to help.
        - id: ch01-b32
          speaker: cockatrice
          text: Then what can I do for you?
        - id: ch01-b33
          speaker: edmund
          text: Tell me stories.
        - id: ch01-b34
          speaker: cockatrice
          text: What should the stories be about?
        - id: ch01-b35
          speaker: edmund
          text: True things they don't know about at school.
        - id: ch01-b36
          speaker: narrator
          text: So the cockatrice began telling stories. He told Edmund about mines, hidden treasures, and the way the rocks of the earth were formed. He spoke of gnomes and fairies and dragons, of glaciers, the Stone Age, and the beginning of the world. He told him about the unicorn and the phoenix, and about Magic, both black and white.
        - id: ch01-b37
          speaker: narrator
          text: Edmund ate his eggs and apple turnover as he listened. When hunger returned, he said good-bye and went home. He came back the next day for more stories, then the next day and the next, and kept coming for a long while.
        - id: ch01-b38
          speaker: narrator
          text: At school, he told the other boys about the cockatrice and his wonderful true tales. The boys enjoyed them. When Edmund told the master, however, the master caned him for lying.
        - id: ch01-b39
          speaker: edmund
          text: But it really is true. Look at the burn the fire left on my hand.
        - id: ch01-b40
          speaker: master
          text: I can see that you've been playing with fire and getting into mischief again.
        - id: ch01-b41
          speaker: narrator
          text: The master caned him harder than before. He was ignorant and unbelieving, though I am told that some schoolmasters are different.
    - id: ch02
      title: Mrs. D. Comes Out
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day Edmund made another lantern from a chemical substance he had sneaked out of the school laboratory. He went exploring once more, hoping to discover what made the other two sounds.
        - id: ch02-b02
          speaker: narrator
          text: In a different part of the mountain, he found a dark passage lined from end to end with brass, like the inside of a tremendous telescope. A bright green door stood at the far end. Its brass plate read, “Mrs. D. Knock and Ring.” A white label below it read, “Call Me at Three.”
        - id: ch02-b03
          speaker: narrator
          text: Edmund owned a watch. He had received it for his birthday two days earlier and had not yet found time to take it apart, so it still worked. The hands showed a quarter to three.
        - id: ch02-b04
          speaker: narrator
          text: Have I told you what a kindhearted boy he was? Although the door told him to call at three, he did not knock early and disturb whoever lived there. Edmund sat patiently on the brass doorstep until the hour arrived. Exactly at three o'clock, he knocked and rang. Something rattled and puffed inside, and the huge door burst open.
        - id: ch02-b05
          speaker: narrator
          text: Edmund barely had time to hide behind it. An immense yellow dragon came out and wriggled away through the brass-lined cave. She looked like a long, rattling worm, or perhaps an enormous centipede.
        - id: ch02-b06
          speaker: narrator
          text: Slowly Edmund crept outside. The dragon was stretching in the sunshine on the rocks. He slipped past her, tore downhill into town, and burst into the school.
        - id: ch02-b07
          speaker: edmund
          text: A huge dragon is coming! Someone must stop her, or she'll destroy every one of us!
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: Without a moment's delay, the master caned him for lying. The master never postponed a duty.
        - id: ch02-b09
          speaker: edmund
          text: It is true. Just look and you'll see!
        - id: ch02-b10
          speaker: narrator
          text: Edmund pointed through the window. Everyone could see a vast yellow cloud rising above the mountain.
        - id: ch02-b11
          speaker: master
          text: That's nothing but a thunder shower.
        - id: ch02-b12
          speaker: narrator
          text: Then he caned Edmund even more. He was not like some masters I know. He was so stubborn that if his own eyes contradicted something he had already said, he would refuse to believe them.
        - id: ch02-b13
          speaker: narrator
          text: The master wrote a sentence on the blackboard for Edmund to copy seven hundred times. It said that lying was very wrong, that liars must be caned, and that the punishment was for their own good.
        - id: ch02-b14
          speaker: narrator
          text: While he was writing, Edmund slipped out. He ran for his life across town to warn Granny, but she was away from home. He rushed out through the town's back gate and raced uphill to ask the cockatrice for help.
        - id: ch02-b15
          speaker: narrator
          text: Edmund never imagined that the cockatrice might doubt him. He had listened to so many of the creature's marvelous tales and believed every one. When you believe all of someone's stories, that person ought to believe yours. It is only fair.
        - id: ch02-b16
          speaker: narrator
          text: Breathless at the cave mouth, Edmund stopped and looked back. As he ran, his small legs had shaken beneath him while the giant yellow shadow passed overhead. Now he stood between warm earth and blue sky, gazing down on the plain.
        - id: ch02-b17
          speaker: narrator
          text: Fruit trees, red-roofed farms, and patches of golden corn dotted the green land. The gray town stood in the center. Its strong walls had openings for archers, and its square towers had holes for pouring melted lead onto strangers below. Edmund could see the bridges and steeples, too. A quiet river ran beside willow and alder trees. In the pleasant green garden at the heart of town, people sat on holidays, smoking their pipes and listening to the band.
        - id: ch02-b18
          speaker: narrator
          text: Edmund saw all that. He also saw the yellow dragon crawling across the plain. A black trail followed her, because everything she touched withered. She was many times larger than the entire town.
        - id: ch02-b19
          speaker: edmund
          text: Oh, my poor dear Granny!
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: His heart was tender, as I should have told you before. The dragon came closer and closer, licking her greedy lips with a long red tongue. Yet inside the school, Edmund knew, the master was still teaching with the greatest earnestness. Even with that tremendous creature bearing down upon the town, he still did not believe the least little bit of Edmund's warning.
        - id: ch02-b21
          speaker: edmund
          text: Well, he'll certainly have to believe me in a minute.
        - id: ch02-b22
          speaker: narrator
          text: Tenderhearted though Edmund was, he was not quite as sorry as he should have been about the lesson his master was about to receive. The dragon opened her jaws wider and wider. Edmund shut his eyes. Even with the master down there, he could not bear to watch such a dreadful sight.
        - id: ch02-b23
          speaker: narrator
          text: When he looked again, the town had vanished. Only a bare patch remained. The dragon licked her lips and curled up to sleep, just as Kitty does after finishing with a mouse.
        - id: ch02-b24
          speaker: narrator
          text: Edmund gasped once or twice. Then he ran into the cave and told the cockatrice everything.
        - id: ch02-b25
          speaker: cockatrice
          text: Well, what happens now?
        - id: ch02-b26
          speaker: edmund
          text: I don't think you understand. The dragon swallowed the whole town.
        - id: ch02-b27
          speaker: cockatrice
          text: Does that matter?
        - id: ch02-b28
          speaker: edmund
          text: But that's where I live!
        - id: ch02-b29
          speaker: cockatrice
          text: Never mind. You can live in this cave with me.
        - id: ch02-b30
          speaker: narrator
          text: The cockatrice rolled over in his pool of flame to warm his chilly side. Edmund had forgotten, as usual, to shut the cave door.
        - id: ch02-b31
          speaker: edmund
          text: I'm afraid I haven't explained it properly. Granny is inside the town, and I can't bear to lose her this way.
        - id: ch02-b32
          speaker: cockatrice
          text: I have no idea what a granny is. But if it's some possession that matters to you...
        - id: ch02-b33
          speaker: edmund
          text: Of course she matters! Oh, please help me. What can I do?
        - id: ch02-b34
          speaker: cockatrice
          text: In your place, I would find the drakling and bring it here.
        - id: ch02-b35
          speaker: narrator
          text: The cockatrice stretched out until the flames washed around his chin.
        - id: ch02-b36
          speaker: edmund
          text: But why?
        - id: ch02-b37
          speaker: narrator
          text: Edmund had acquired the habit of asking why at school, where it always annoyed the master. The cockatrice had no intention of tolerating it either.
        - id: ch02-b38
          speaker: cockatrice
          text: Oh, stop talking! I've given you advice. Take it or leave it. I won't trouble with you again. Bring the drakling here, and I'll tell you the next step. If you don't, I won't.
          emotion: angry
        - id: ch02-b39
          speaker: narrator
          text: He pulled the fire snugly around his shoulders, curled up, and went to sleep.
    - id: ch03
      title: The Drakling
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: This was exactly the right way to manage Edmund, though no one had ever tried it before. Edmund watched the cockatrice. From the corner of one eye, the cockatrice watched him back and began snoring very loudly.
        - id: ch03-b02
          speaker: narrator
          text: Edmund understood once and for all that his friend would stand no nonsense. From that moment, he respected the cockatrice enormously. Perhaps for the first time in his life, he set out at once to do precisely as he had been told.
        - id: ch03-b03
          speaker: narrator
          text: Despite all his truancy, Edmund knew one or two things that you may not know, even if you have attended school faithfully. He knew, for example, that a drakling is a baby dragon.
        - id: ch03-b04
          speaker: narrator
          text: He was sure the drakling made the last of the three mountain sounds. The clucking had come from the cockatrice. The great rumble, like a large gentleman sleeping after dinner, belonged to the mother dragon. Therefore the smaller rumble must belong to her baby.
        - id: ch03-b05
          speaker: narrator
          text: Edmund plunged boldly into the caves. He searched and wandered, wandered and searched, until he reached a third mountain door. Words across it announced, “The Baby Is Asleep.”
        - id: ch03-b06
          speaker: narrator
          text: Fifty pairs of copper shoes stood just outside the door. No one could look at them without knowing what sort of feet they fitted, because each copper shoe had five separate openings for the drakling's five claws. There were fifty pairs because the drakling took after his mother and possessed one hundred feet, no more and no less. In learned books, that kind of dragon is called Draco centipedis.
        - id: ch03-b07
          speaker: narrator
          text: Edmund felt badly frightened. But he remembered the grim look in the cockatrice's eye, and the determined snore still rang in his ears. It even carried through the drakling's own considerable snoring.
        - id: ch03-b08
          speaker: narrator
          text: Edmund gathered his courage, threw open the door, and shouted inside.
        - id: ch03-b09
          speaker: edmund
          text: Hello in there, drakling! Get out of bed this instant!
        - id: ch03-b10
          speaker: narrator
          text: The snoring stopped.
        - id: ch03-b11
          speaker: drakling
          text: It isn't time yet.
        - id: ch03-b12
          speaker: edmund
          text: Your mother says you must get up anyway. And you'd better be quick about it.
        - id: ch03-b13
          speaker: narrator
          text: Since the drakling had not eaten him yet, Edmund began to feel braver. The creature sighed, and he heard it climbing out of bed. A moment later it began emerging from its room, putting on its copper shoes as it came. It was nowhere near as large as its mother. In fact, it was only about the size of a Baptist chapel.
        - id: ch03-b14
          speaker: edmund
          text: Hurry! You're still fumbling with the seventeenth shoe.
        - id: ch03-b15
          speaker: drakling
          text: Mother told me never to go outside without my shoes.
        - id: ch03-b16
          speaker: narrator
          text: So Edmund helped with the shoes. It took a long time and was not comfortable work. At last the drakling announced that it was ready. By then Edmund had forgotten his fear.
        - id: ch03-b17
          speaker: edmund
          text: Come along, then.
        - id: ch03-b18
          speaker: narrator
          text: They returned to the cockatrice. The passage was rather tight for the drakling, but it stretched itself thin, the way a fat worm narrows itself to squeeze through a crack in hard ground.
        - id: ch03-b19
          speaker: edmund
          text: Here it is.
        - id: ch03-b20
          speaker: narrator
          text: The cockatrice woke immediately. He politely invited the drakling to sit and wait while he stirred his fire.
        - id: ch03-b21
          speaker: cockatrice
          text: Your mother will arrive soon.
        - id: ch03-b22
          speaker: narrator
          text: The drakling sat down, but its hungry eyes stayed fixed on the flames.
        - id: ch03-b23
          speaker: drakling
          text: Excuse me. I always have a small basin of fire when I get up, and I'm feeling rather faint. May I have some?
        - id: ch03-b24
          speaker: narrator
          text: It reached one claw toward the cockatrice's basin.
        - id: ch03-b25
          speaker: cockatrice
          text: Certainly not! Where did you learn your manners? Were you never taught that we must not ask for everything we see?
          emotion: angry
        - id: ch03-b26
          speaker: drakling
          text: I'm sorry, but I truly am very hungry.
        - id: ch03-b27
          speaker: narrator
          text: The cockatrice beckoned Edmund close to the side of the fiery basin. There he whispered into the boy's ear for a long time, speaking very earnestly. Edmund stood so near the flames that one whole side of his hair was burned away. Still, through all those secret instructions, he never interrupted the cockatrice once to ask why.
        - id: ch03-b28
          speaker: narrator
          text: When the instructions ended, Edmund's tender heart turned toward the drakling.
        - id: ch03-b29
          speaker: edmund
          text: Poor thing. If you're truly hungry, I know a place with plenty of fire.
        - id: ch03-b30
          speaker: narrator
          text: Edmund led off through the caves, and the drakling followed. At the proper place, he stopped beside a round iron lid set into the floor. It looked like the lids over holes where men pour coal into cellars, only much larger.
        - id: ch03-b31
          speaker: narrator
          text: A hook stuck from one side. Edmund heaved the lid open, and a blast of hot air rushed up and nearly choked him. The drakling moved closer, peered down with one eye, and sniffed.
        - id: ch03-b32
          speaker: drakling
          text: Oh, that smells good!
          emotion: happy
        - id: ch03-b33
          speaker: edmund
          text: That's the fire in the middle of the earth. There's plenty down there, all cooked just right. Why don't you climb in and start breakfast?
        - id: ch03-b34
          speaker: narrator
          text: The drakling wriggled through the opening. It began crawling faster and faster down the sloping shaft that led to the fire in the middle of the earth. Edmund did exactly what the cockatrice had told him, which was a wonder in itself. He seized the very end of the drakling's tail and ran the iron hook through it, so the creature was held fast.
        - id: ch03-b35
          speaker: narrator
          text: The drakling could not turn around and climb back to inspect its poor tail. As everyone knows, the road to the fires below is easy to descend and impossible to climb again. There is a Latin phrase about it beginning with “Facilis descensus.”
        - id: ch03-b36
          speaker: narrator
          text: So the foolish drakling hung there by its tail. Edmund felt very busy, important, and pleased with himself as he hurried back to the cockatrice.
    - id: ch04
      title: How the Town Came Back
      blocks:
        - id: ch04-b01
          speaker: edmund
          text: Now what do I do?
        - id: ch04-b02
          speaker: cockatrice
          text: Go to the cave entrance and laugh loudly enough for the dragon to hear you.
        - id: ch04-b03
          speaker: narrator
          text: Edmund almost asked why, but caught himself just in time.
        - id: ch04-b04
          speaker: edmund
          text: She won't be able to hear me...
        - id: ch04-b05
          speaker: cockatrice
          text: Very well. No doubt you understand this better than I do.
        - id: ch04-b06
          speaker: narrator
          text: The cockatrice began settling himself into the fire again. Edmund quickly obeyed. His laughter rolled around the cave mouth until the echoes made it sound like a whole castle full of giants laughing together.
        - id: ch04-b07
          speaker: narrator
          text: The dragon lay sleeping in the sunshine. The noise woke her, and she spoke crossly.
        - id: ch04-b08
          speaker: dragon
          text: What are you laughing at?
          emotion: angry
        - id: ch04-b09
          speaker: edmund
          text: I'm laughing at you!
        - id: ch04-b10
          speaker: narrator
          text: He laughed on. The dragon endured it as long as she could. But like everyone else, she hated being mocked. At last she dragged herself slowly up the mountain. She had eaten a very heavy meal, after all.
        - id: ch04-b11
          speaker: narrator
          text: Outside the cave, she asked again in a voice so terrible that Edmund felt he might never laugh again.
        - id: ch04-b12
          speaker: dragon
          text: What are you laughing at?
          emotion: angry
        - id: ch04-b13
          speaker: cockatrice
          text: At you! You swallowed your own little drakling along with the town. Your very own baby! Hee, hee, hee! Ha, ha, ha!
        - id: ch04-b14
          speaker: narrator
          text: Edmund found enough courage to join in. The cave turned his small laugh into a tremendous one.
        - id: ch04-b15
          speaker: edmund
          text: I'm laughing too! Ha, ha!
        - id: ch04-b16
          speaker: dragon
          text: Dear me. I did think that town felt rather stuck in my throat. I'll have to take it out and search it properly.
          emotion: surprised
        - id: ch04-b17
          speaker: narrator
          text: She coughed and choked. Out came the town, landing on the hillside.
        - id: ch04-b18
          speaker: narrator
          text: Edmund had already run back to the cockatrice and received his next instructions. Before the dragon had time to search the town for her baby, a miserable howl came from deep inside the mountain. It was the drakling's own voice. Edmund was pinching its tail as hard as he could beneath the round iron lid, like the lids over the holes where coal is poured into cellars.
        - id: ch04-b19
          speaker: dragon
          text: Why, what's wrong with Baby? He isn't here!
          emotion: fearful
        - id: ch04-b20
          speaker: narrator
          text: She made herself thin and crept into the mountain to find him. The cockatrice laughed as loudly as he could, while Edmund kept pinching.
        - id: ch04-b21
          speaker: narrator
          text: At last the great dragon reached the round opening and its iron lid. To fit the winding passage, she had made herself extremely long and narrow. Her head was now deep inside the mountain, but her tail still lay a mile or two away, somewhere outside.
        - id: ch04-b22
          speaker: narrator
          text: When Edmund heard her coming, he gave the drakling's tail one final nip. Then he lifted the lid and hid behind it, where the dragon could not see him. He pulled the hook free.
        - id: ch04-b23
          speaker: narrator
          text: The dragon peered down through the opening. She was just in time to see the tip of her baby's tail vanish into the smooth, sloping shaft. From far below came one last squeak of pain, and then the drakling was gone from sight.
        - id: ch04-b24
          speaker: narrator
          text: Whatever other faults the poor dragon had, she was an excellent mother. She plunged headfirst into the opening and slid down after her baby.
        - id: ch04-b25
          speaker: narrator
          text: Edmund watched her head disappear, then the rest of her. She had stretched herself so long and thin that the sight lasted all night. It was like watching a freight train pass in Germany.
        - id: ch04-b26
          speaker: narrator
          text: The final joint of her tail slipped below. Edmund slammed the iron lid shut. You have probably guessed that he was a kindhearted boy. It pleased him to know that the dragon and drakling would have all the fire they liked to eat, forever and ever.
        - id: ch04-b27
          speaker: narrator
          text: He thanked the cockatrice for helping him and reached home just in time for breakfast. He even arrived at school by nine. That would have been impossible if the town still stood beside the river in the middle of the plain. Instead, it had taken root on the hillside exactly where the dragon coughed it up.
    - id: ch05
      title: What Nobody Would Believe
      blocks:
        - id: ch05-b01
          speaker: master
          text: Well, where were you yesterday?
        - id: ch05-b02
          speaker: narrator
          text: Edmund explained everything. The master immediately caned him for not telling the truth.
        - id: ch05-b03
          speaker: edmund
          text: But it is true! The dragon swallowed the whole town. You know she did.
        - id: ch05-b04
          speaker: master
          text: Nonsense. We had a thunderstorm and an earthquake. Nothing more.
        - id: ch05-b05
          speaker: narrator
          text: He caned Edmund harder than ever.
        - id: ch05-b06
          speaker: edmund
          text: Then how do you explain why the town is on the hillside now? It used to be beside the river.
        - id: ch05-b07
          speaker: narrator
          text: Edmund always argued, even when the circumstances could hardly have been worse.
        - id: ch05-b08
          speaker: master
          text: This town has always stood on the hillside.
        - id: ch05-b09
          speaker: narrator
          text: Every child in the class agreed. They had more sense than to argue with a man carrying a cane.
        - id: ch05-b10
          speaker: edmund
          text: Look at the maps, then!
        - id: ch05-b11
          speaker: narrator
          text: Edmund would not lose the argument, whatever happened to him in the flesh. The master pointed at the map on the wall. There was the town, shown on the hillside.
        - id: ch05-b12
          speaker: narrator
          text: No one but Edmund understood the obvious truth. The shock of being swallowed by the dragon had upset all the maps and moved the town on every one of them.
        - id: ch05-b13
          speaker: narrator
          text: The master caned Edmund once more. This time, he explained, the punishment was not for lying. It was for Edmund's irritating habit of arguing. That shows what a prejudiced and ignorant man the master was, and how unlike the honored Head of the excellent school your good parents kindly send you to.
        - id: ch05-b14
          speaker: narrator
          text: The next day, Edmund decided to prove his story by showing people the cockatrice. He actually persuaded some townspeople to enter the cave with him. But the cockatrice had bolted his door and refused to open it.
        - id: ch05-b15
          speaker: narrator
          text: Edmund gained nothing from the trip except a scolding for leading everyone on a wild-goose chase.
        - id: ch05-b16
          speakers: [townspeople_1, townspeople_2]
          ensemble: duo
          text: A wild goose is nothing like a cockatrice.
        - id: ch05-b17
          speaker: narrator
          text: Poor Edmund could not answer, though he knew perfectly well how wrong they were. Granny was the only person who believed him. But then, she was very old and very kind, and she had always called him the best of boys.
        - id: ch05-b18
          speaker: narrator
          text: Only one good thing came from this long story. Edmund was never quite the same boy afterward. He did not argue nearly as much as before. He even agreed to become a locksmith's apprentice, so that one day he might know how to pick the lock on the cockatrice's front door. Then, he hoped, he could go inside and learn more of the things that other people did not know.
        - id: ch05-b19
          speaker: narrator
          text: But Edmund is an old man now, and he still has not opened that door.
