audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    effie:
      display_name: 艾菲
      tts:
        delivery: 好奇认真，勇敢中带着孩子气的坦率
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    harry:
      display_name: 哈里
      tts:
        delivery: 自信好胜，爱冒险，带一点哥哥的神气
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    doctor:
      display_name: 医生
      tts:
        delivery: 专注理性，一谈到科学便格外投入
        timbre: 温和沉稳
        pace: 从容清楚
        pitch: 中低音
    professor:
      display_name: 教授
      tts:
        delivery: 学究气十足，急切而好胜
        timbre: 干爽厚实
        pace: 稍快
        pitch: 中低音
    mother:
      display_name: 妈妈
      tts:
        delivery: 疼爱孩子，也坚定严厉
        timbre: 温暖柔和
        pace: 稳健
        pitch: 中音
    st_george:
      display_name: 圣乔治
      tts:
        delivery: 老派豪迈，却始终睡意蒙眬
        timbre: 低沉醇厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章　祖国的拯救者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 故事是从艾菲眼睛里掉进一样东西开始的。那东西疼得厉害，像一粒烧红的火星，却好像还有腿，也有苍蝇一样的翅膀。艾菲一边揉眼睛一边哭，眼泪自己不停地流。她心里并不伤心，只是眼睛忍不住要哭。艾菲只好去找爸爸，请他取出眼里的东西。爸爸是医生，当然很会做这种事。他拿一支柔软的画笔，蘸上一点蓖麻油，很巧妙地把东西取了出来。
        - id: ch01-b02
          speaker: doctor
          text: 这东西可真奇怪。
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: 艾菲以前也常有东西掉进眼里。爸爸总觉得那很平常，最多只是有点麻烦，有点淘气。他可从没说过奇怪。
        - id: ch01-b04
          speaker: effie
          text: 我觉得它还在眼睛里呢。
        - id: ch01-b05
          speaker: narrator
          text: 人们刚把眼里的东西取出来，总会这样说。他们总觉得眼里还留着一点什么，艾菲也不例外。
        - id: ch01-b06
          speaker: doctor
          text: 已经出来啦。你看，就在画笔上。这个标本很有意思。
        - id: ch01-b07
          speaker: narrator
          text: 艾菲从没听爸爸说过，跟她有关的东西很有意思。她立刻追问那是什么。医生小心地端着画笔走到显微镜旁，把笔尖放在镜头下。他拧动黄铜螺丝，闭上一只眼仔细观察。那个小东西正在蓖麻油里轻轻扭动。
        - id: ch01-b08
          speaker: doctor
          text: 哎呀！它有四条完整的腿，一条长尾巴，五根脚趾还长短不一。看着很像蜥蜴，可又留下了翅膀的痕迹。对，是蝙蝠似的翅膀。一定是个新标本。艾菲，快去请教授过来一趟。
          emotion: surprised
        - id: ch01-b09
          speaker: effie
          text: 爸爸，你该给我六便士。新标本可是我带来的，我还一直把它好好保存在眼睛里。我的眼睛真的很疼。
        - id: ch01-b10
          speaker: narrator
          text: 医生太高兴了，索性给了艾菲一先令，比她要的还多了一倍。教授很快赶来，还留下吃了午饭。整个下午，他都在和医生争论，从艾菲眼睛里取出的东西究竟该叫什么、属于哪一科。两个人各不相让，吵得十分愉快。
        - id: ch01-b11
          speaker: narrator
          text: 到了下午茶时间，哈里从茶杯里捞出一样东西。他以为是蠼螋，正准备扔到地上，照平常的办法结果它。没想到那东西在茶匙里抖抖身子，张开两片湿翅膀，啪嗒落在桌布上。它坐在那里，用脚清理身体，又把翅膀伸展开来。
        - id: ch01-b12
          speaker: harry
          text: 咦，这是一只小蝾螈！
          emotion: surprised
        - id: ch01-b13
          speaker: professor
          text: 哈里，我出半克朗买下它。
        - id: ch01-b14
          speaker: narrator
          text: 教授抢在医生前面说完，便用手绢小心地托起那个东西。
        - id: ch01-b15
          speaker: professor
          text: 又是一个新标本，而且比你的那个更好，医生。
        - id: ch01-b16
          speaker: narrator
          text: 那是一只半英寸长的小蜥蜴，身上既有鳞，又有翅膀。医生和教授各自有了一个新标本，两个人都很得意。可是没过多久，这两个标本就不那么稀罕了。第二天早晨，擦刀子的男仆正在清理医生的靴子，忽然把手里的刷子、靴子和鞋油全扔到地上，尖叫着说自己被烫伤了。一只小猫般大的蜥蜴正从靴子里面慢慢爬出来，身后还长着一对又大又亮的翅膀。
        - id: ch01-b17
          speaker: effie
          text: 我知道啦！这是龙，就像圣乔治杀死的那条龙。
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: 艾菲说得一点不错。那天下午，陶泽在花园里追一条兔子大的龙，反倒挨了一口。第二天，所有报纸都在报道全国出现的奇妙“有翼蜥蜴”。报纸就是不肯叫它们龙。如今没人相信龙，报纸当然更不愿傻乎乎地相信童话。起初只出现了几条，可一两个星期以后，全国到处都爬着大大小小的龙。它们飞上天时，密得像一大群蜜蜂。
        - id: ch01-b19
          speaker: narrator
          text: 这些龙只是大小不同，模样全都一样。它们披着绿鳞，有四条腿、一条长尾巴，还有蝙蝠似的大翅膀。翅膀是半透明的淡黄色，很像自行车的齿轮罩。它们当然会喷火吐烟，正经的龙都该有这份本事。报纸却还在假装它们只是蜥蜴，直到一条巨龙抓走《旗帜报》的编辑。编辑不在了，也就没人再告诉其他报人哪些事情不该相信。后来，动物园里最大的大象也被龙叼走，报纸终于不再装模作样，承认那就是龙，还在头版最上方登出了几个大字：《骇人龙灾》。
        - id: ch01-b20
          speaker: narrator
          text: 这场龙灾又吓人，又叫人心烦。巨龙当然可怕，好在人们发现，龙害怕夜里的冷空气，总会早早上床睡觉。只要白天不出门，大家还算安全。真正难缠的是小龙，它们能钻进任何地方。蠼螋大的会爬进肥皂，又钻进黄油。狗大的会躺进浴缸，一开冷水，它体内的烟火便冒出滚滚蒸汽，粗心的人常常被严重烫伤。鸽子大的躲在针线篮和角落的抽屉里，专等你急着拿针或手绢时，突然咬你的手。
        - id: ch01-b21
          speaker: narrator
          text: 绵羊大的龙远远就看得见，本来容易躲开。可它们会从窗口飞进屋，钻到鸭绒被下面，蜷起身子藏好。等你晚上上床，掀开被子才发现里面睡着一条龙，总要吓一大跳。这种龙倒是不吃人，只吃生菜，不过它们身上太热，总把床单和枕套烤得一塌糊涂。
        - id: ch01-b22
          speaker: narrator
          text: 郡议会和警察想尽了一切办法。古时候，谁杀掉一条龙，就能娶公主。那时只有一条龙和一位公主，这办法很合适。如今龙比公主多得多，就算王室人丁兴旺，也远远不够分。拿公主当奖赏，只会白白浪费公主。况且大家根本不用悬赏，见到多少龙就杀多少，全是自己愿意动手，只想快点除掉这些讨厌的东西。
        - id: ch01-b23
          speaker: narrator
          text: 郡议会答应，每天从十点到两点焚化送来的死龙。办公处所在的街上，星期里不论哪一天，都排着长长的队。一辆辆马车、板车和货车装满龙，等着送进去。男孩用独轮车推来整堆死龙，上午放学的孩子也会顺路交出书包里的一两把小龙，或是把龙兜在打了结的手绢里送来。可做了这么多，龙仍像以前一样多。警察又搭起木头和帆布做的高塔，外面涂满专利胶。龙撞上去，便像厨房粘蝇纸上的苍蝇和黄蜂一样动弹不得。等塔上粘满龙，警督就把塔和龙一把火烧掉。
        - id: ch01-b24
          speaker: narrator
          text: 商店里摆满专利杀龙药、驱龙肥皂和防龙窗帘。能想到的办法，人们全试过了。可龙似乎反而越来越多。想配出合适的毒药也很难，因为不同的龙，食物完全不同。最大的先吃大象，只要还有大象就一直吃下去，等大象没了再吃马和牛。有一种除了铃兰什么也不吃，还有一种只吃首相，找不到首相便毫不客气地吃穿制服的仆人。另有一种靠砖头过活，其中三条一个下午就吃掉了南兰贝斯医院的三分之二。
        - id: ch01-b25
          speaker: narrator
          text: 艾菲最怕餐厅那么大的龙，因为这种龙专吃小男孩和小女孩。起初，她和哈里还挺喜欢新的生活。他们夜里不用上床睡觉，可以一直醒着，在电灯照亮的花园里玩个痛快。到了早晨，妈妈反而来催他们上床。连她道晚安时说的那些话，听来都新鲜又好笑。
        - id: ch01-b26
          speaker: mother
          text: 晚安，我的宝贝们。白天要好好睡，别起得太早。一定等天全黑了再起来，不然那些讨厌的龙会抓住你们。
        - id: ch01-b27
          speaker: narrator
          text: 日子一久，孩子们就受够了。他们想亲眼看看田野里生长的花草树木，想站在屋外真正的阳光下，而不是隔着玻璃窗和专利防龙帘往外看。他们也想在草地上玩，可电灯照亮的花园只在夜里开放，草上有夜露，妈妈不许他们过去。他们太想在美丽、明亮而危险的白昼出去一次了，于是努力寻找一个非出去不可的理由。可他们又不愿违背妈妈。
        - id: ch01-b28
          speaker: narrator
          text: 一天早晨，妈妈忙着调配新的杀龙药，准备撒进地窖。爸爸则在给擦靴男仆包扎手掌。那只手被一种龙抓伤了，有首相时，这种龙最爱吃首相。大人们各自忙得不可开交，谁也没想起来叮嘱孩子，要一直睡到天完全黑了才能起床。
        - id: ch01-b29
          speaker: harry
          text: 我们现在就走。没人叫我们别走，所以不算不听话。我知道该做什么，只是不知道该怎么做。
        - id: ch01-b30
          speaker: effie
          text: 那我们该做什么？
        - id: ch01-b31
          speaker: harry
          text: 去叫醒圣乔治。他是那座城里唯一会对付龙的人。童话里的人不算，圣乔治可是真实存在的。他只是睡着了，正等着有人叫醒他。爸爸说，现在已经没人相信他了。
        - id: ch01-b32
          speaker: effie
          text: 可我们相信呀。
        - id: ch01-b33
          speaker: harry
          text: 对呀，艾菲。正因为相信，我们才叫得醒他。不相信一个人，怎么可能把他叫醒呢？
        - id: ch01-b34
          speaker: narrator
          text: 艾菲同意这个道理，可圣乔治到底在哪里？哈里说，他们只能出去找。艾菲可以穿防龙布做的裙子，他自己则把最好的杀龙药抹遍全身。话还没说完，艾菲便高兴得跳了起来。
        - id: ch01-b35
          speaker: effie
          text: 哈里，我知道去哪里找啦！当然是圣乔治教堂！
          emotion: happy
        - id: ch01-b36
          speaker: harry
          text: 嗯，你虽说是个女孩，偶尔也有点脑筋。
        - id: ch01-b37
          speaker: narrator
          text: 哈里只恨自己没先想到。第二天下午，时间还很早，落日的光束还远远没有宣告夜晚来临，人人也都还没起床做事，两个孩子便悄悄下了床。来不及做防龙裙子，艾菲只好用一条防龙细纱披肩裹住身体。哈里把专利杀龙药涂得到处都是，弄得自己脏兮兮的。瓶上保证它对婴儿和病弱者无害，他便觉得十分安全。
        - id: ch01-b38
          speaker: narrator
          text: 两人牵着手走向圣乔治教堂。叫这个名字的教堂有很多座，幸好他们拐上了通往正确那座的路。两个孩子走在灿烂的阳光下，觉得自己十分勇敢，正要经历一场大冒险。街上除了龙，半个人也没有。人行道上有龙，车道上有龙，公共建筑的台阶上趴着晒太阳的龙，滚烫的屋顶上还有正在梳理翅膀的龙。幸好没有一条正好大到能吃孩子，不然故事恐怕只好讲到这里。
        - id: ch01-b39
          speaker: narrator
          text: 整座城都被龙染绿了。出了城，孩子们走上乡间小路，只见两边田野也比平时更绿，遍地都是带鳞的腿和长长的尾巴。小龙还在开花的山楂树篱里，用石棉筑起自己的窝。艾菲一直紧紧抓着哥哥的手。一条胖龙忽然啪嗒撞上她的耳朵，她吓得尖叫。叫声惊起田野里一大群绿龙，它们立刻腾空，摊开四肢划过天空，翅膀一路咔啦作响。
        - id: ch01-b40
          speaker: effie
          text: 我想回家了。
          emotion: fearful
        - id: ch01-b41
          speaker: harry
          text: 别犯傻。你没忘记七勇士和那些王子吧？要拯救祖国的人，绝不会尖叫着说想回家。
        - id: ch01-b42
          speaker: effie
          text: 我们真的会成为拯救祖国的人吗？
        - id: ch01-b43
          speaker: harry
          text: 你等着瞧吧。
        - id: ch01-b44
          speaker: narrator
          text: 他们继续赶路。圣乔治教堂的门开着，两人径直走进去，可圣乔治并不在里面。他们只好绕到外面的墓园，找了一阵，终于发现圣乔治巨大的石墓。墓上躺着他的全身大理石像，身穿盔甲，头戴钢盔，两手叠在胸前。两个孩子不知道该怎样叫醒他。哈里先好好跟他说话，又扯开嗓子呼唤，最后还抓住这位屠龙英雄的大理石肩膀用力摇。圣乔治一点反应也没有。
        - id: ch01-b45
          speaker: narrator
          text: 艾菲急得哭了。她尽力抱住圣乔治的脖子，虽然石像背后那块大理石十分碍事。她亲了亲大理石的脸。
        - id: ch01-b46
          speaker: effie
          text: 亲爱的圣乔治，你那么善良，又那么好心。求求你醒来帮帮我们吧。
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: 圣乔治这才睡眼蒙眬地睁开眼，伸了个懒腰，问小姑娘出了什么事。孩子们把龙灾从头讲起。他在大理石里翻了个身，用胳膊肘撑着听。听说龙有那么多，他摇了摇头。
        - id: ch01-b48
          speaker: st_george
          text: 这可不成。龙多了一条，可怜的老乔治就对付不了。你们该早点叫醒我。我一向讲究公平，一个人对一条龙，这才像话。
        - id: ch01-b49
          speaker: narrator
          text: 正在这时，一群龙从他们头顶飞过。圣乔治下意识地握住剑柄，把剑拔出一半。可他看着那群龙飞向远方，身影越变越小，又慢慢摇了摇头，把拔出一半的剑重新推回鞘里。
        - id: ch01-b50
          speaker: st_george
          text: 我帮不了你们。现在跟我那个年代不一样了。工程师罢工时，有人叫醒圣安德鲁，他后来来找我，说如今什么都靠机器。你们一定也能用机器解决这些龙。对了，最近天气怎么样？
        - id: ch01-b51
          speaker: narrator
          text: 哈里觉得他漫不经心又不近人情，气得不肯回答。艾菲仍耐着性子说，天气一直很好，爸爸还说，这是全国从未有过的酷热。
        - id: ch01-b52
          speaker: st_george
          text: 果然如此。龙最受不了又湿又冷的天气，这就是唯一的办法。你们要是能找到那些龙头就好了。
        - id: ch01-b53
          speaker: narrator
          text: 圣乔治已经重新躺回石板，一边用大理石手掌遮着哈欠，一边道晚安，说很遗憾帮不了忙。
        - id: ch01-b54
          speaker: effie
          text: 你能帮我们！快告诉我们，是什么龙头？
        - id: ch01-b55
          speaker: st_george
          text: 就像浴室里的龙头。那里还有一面镜子，能看见全世界和正在发生的事。圣但尼跟我说过，那东西很漂亮。很遗憾我不能……晚安。
        - id: ch01-b56
          speaker: narrator
          text: 他倒回大理石里，转眼又睡熟了。
        - id: ch01-b57
          speaker: harry
          text: 我们肯定找不到那些龙头。要是附近来了专吃勇士那么大的龙，圣乔治偏偏醒过来，那可太糟了。
        - id: ch01-b58
          speaker: narrator
          text: 艾菲摘下防龙面纱。来的路上没有餐厅那么大的龙，她觉得圣乔治应该安全。于是，她把面纱盖在圣乔治身上。哈里也从身上尽量擦下杀龙药，涂到他的盔甲上。哈里正提议躲进教堂等天黑，一片黑影忽然罩住他们。那正是一条和家中餐厅一样大的龙。
        - id: ch01-b59
          speaker: narrator
          text: 两个孩子知道一切都完了。龙俯冲下来，一爪勾住艾菲的绿绸腰带，一爪勾住哈里那件伊顿式短上衣背后的小尖角。它展开黄色巨翼，咔啦咔啦地升到空中，声音像刹车扣得死紧的三等车厢。孩子们就这样被它吊在爪子下面，离地面越来越远。
        - id: ch01-b60
          speaker: effie
          text: 哈里，你说它什么时候会吃掉我们？
          emotion: fearful
        - id: ch01-b61
          speaker: narrator
          text: 龙飞过树林和田野，每扇一下翅膀，就掠过四分之一英里。树篱、河流、教堂和农舍从孩子们脚下飞快退去，比特快列车窗外的景物还快。一路上，他们看见别的龙，这条餐厅大的龙却不跟谁交谈，只管稳稳向前飞。
        - id: ch01-b62
          speaker: harry
          text: 它很清楚自己要去哪儿。但愿到达以前，它能把我们扔下去！
        - id: ch01-b63
          speaker: narrator
          text: 龙牢牢抓着他们。它飞呀，飞呀，飞呀，一直飞到两个孩子晕头转向，才带着满身鳞片的咔啦声落在山顶。它侧着巨大而布满绿鳞的身子躺下，飞了这样远，累得呼哧直喘，可两只爪子依旧勾着孩子的衣服。艾菲掏出哈里送她的生日礼物，一把只值六便士、已经用了一个月、除了石笔什么也削不动的小刀。不知怎的，她竟用这把刀割断了身前的腰带，自己钻了出来，只留下一只绿绸蝴蝶结挂在龙爪里。
        - id: ch01-b64
          speaker: narrator
          text: 那把小刀无论如何也割不断哈里的衣尾。艾菲试了半天，只好放弃，转而帮他悄悄把胳膊从袖子里扭出来，让龙爪里只剩一件伊顿式短上衣。两人踮着脚钻进岩缝。缝隙太窄，龙进不来，他们便待在里面，等龙歇够了坐起来盘算怎样吃他们时，冲它做起鬼脸。龙气坏了，朝洞里又喷火又吐烟。孩子们赶快往深处跑，龙怎么也够不着，喷累了，终于离开。
        - id: ch01-b65
          speaker: narrator
          text: 孩子们仍然害怕，不敢走出洞穴，只能朝更深处走。狭窄的裂缝渐渐展开，地方越来越宽，脚下也变成柔软的沙。一直走到洞穴最深处，他们发现那里竟有一扇门。门上清清楚楚写着：“全球龙头总室，闲人免进。”他们马上把门打开，本来只想偷偷往里瞧上一眼。这时，两人才同时想起圣乔治说过的话。
        - id: ch01-b66
          speaker: harry
          text: 外面还有龙等着，我们不可能比现在更倒霉了。进去吧。
        - id: ch01-b67
          speaker: narrator
          text: 两人壮着胆子走进去，把身后的门关好。这间屋子是从整块坚硬的岩石里凿出来的。一面墙从头到尾装满龙头，每只龙头上都挂着瓷牌，就和浴缸边上看见的一样。两个孩子都能认双音节的词，有时候连三音节的词也难不倒他们。所以他们一看那些牌子就明白了，这里正是替全世界打开各种天气的地方。
        - id: ch01-b68
          speaker: narrator
          text: 六只大龙头标着阳光、风、雨、雪、冰雹和冰。旁边还有许多小龙头，分别标着晴到多云、阵雨、南方微风、庄稼生长的好天气、适宜滑冰、无霜好天气、南风、东风等等。阳光龙头正开到了最大。洞穴靠一扇蓝玻璃天窗照明，他们在屋里看不见阳光，便猜想阳光一定从别的出口流走了，就像厨房里专门冲洗水槽底部的龙头一样。
        - id: ch01-b69
          speaker: narrator
          text: 另一面墙其实是一整面镜子。往里一看，全世界正在发生的事会同时出现，这一点可不像普通的镜子。他们看见死龙一车车送到郡议会，看见圣乔治盖着防龙面纱睡觉，也看见妈妈在家里哭。孩子们跑进可怕又危险的白昼，她怕他们已经被龙吃掉了。
        - id: ch01-b70
          speaker: narrator
          text: 镜中还映出整个英格兰，像一幅巨大的拼图地图。田野的部分是绿色，城镇是棕色，生产煤炭、陶器、刀具和化学品的地方则是黑色。黑处、棕处、绿处，到处都交错爬满了绿龙，像一张绿色的大网。天还大亮，一条龙也没去睡觉。
        - id: ch01-b71
          speaker: effie
          text: 龙不喜欢冷。
        - id: ch01-b72
          speaker: narrator
          text: 艾菲想关掉阳光，偏偏龙头坏了。近来天气一直酷热，龙蛋也纷纷孵化，原来都是它惹的祸。孩子们只好不管阳光，转身把雪开到最大，再跑去看镜子。龙像蚁穴进水时的蚂蚁一样四处乱跑。当然，你绝不会残忍地往蚁穴里灌水。镜中的雪越下越密，越积越厚。
        - id: ch01-b73
          speaker: narrator
          text: 艾菲又把雨开到最大。没过多久，龙便越挣扎越慢，后来有些干脆躺着不动了。孩子们明白，雨水浇灭了龙体内的火，它们已经死了。两人又打开冰雹，只开到一半，免得砸破人家的窗户。又过了一阵，再也看不见一条龙动弹。他们终于知道，自己真的成了祖国的拯救者。
        - id: ch01-b74
          speaker: harry
          text: 大家会给我们立一座纪念碑，跟纳尔逊纪念柱一样高！龙全死啦！
          emotion: happy
        - id: ch01-b75
          speaker: effie
          text: 希望洞外那条龙也死了。可我不确定会不会有纪念碑。这样多的死龙怎么办？光埋就要埋好多年，它们全湿透了，也烧不起来。要是雨能把它们冲进海里就好了。
        - id: ch01-b76
          speaker: narrator
          text: 可雨并没有照艾菲希望的那样，把龙冲进海里。两个孩子开始觉得，自己也没有聪明得多么了不起。哈里忽然发现一只锈迹斑斑的老龙头，像是许多年没用过，瓷牌上积满厚厚的灰尘和蛛网。说来也怪，两人出门时偏偏都没带手绢，艾菲只好拿裙角一点点擦干净。牌子上写着“排水”。
        - id: ch01-b77
          speaker: effie
          text: 我们把它打开吧，说不定能把龙排走。
        - id: ch01-b78
          speaker: narrator
          text: 龙头锈得很紧，两人合力才拧开。他们马上跑回镜子前。英格兰地图正中央已经张开一个又大又圆的黑洞。地图四边渐渐翘起，雨水全朝洞口流去。
        - id: ch01-b79
          speaker: effie
          text: 太好啦，太好啦，太好啦！
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: 艾菲冲回去，把所有看起来跟水有关的龙头全打开。阵雨、无霜好天气、庄稼生长的好天气，还有南风和西南风，因为她听爸爸说过，这两种风会带来雨。
        - id: ch01-b81
          speaker: narrator
          text: 大雨像洪水一样倾泻到全国，一大片一大片的水涌向地图中央，一道道瀑布灌进那个大圆洞。龙也被水卷走，一大团一大团、一小群一小群地消失在排水管里。有的单独一条，有的十几条挤在一起。从能叼走大象的巨龙，到会掉进茶杯的小龙，什么尺寸都有，一条也逃不掉。
        - id: ch01-b82
          speaker: narrator
          text: 很快，一条龙也不剩了。孩子们关上排水，又把坏掉的阳光龙头关到一半。接着，他们打开晴到多云和阵雨。偏偏这两个龙头卡住了，再也关不上。这就是我们这里的天气为什么会变成如今这样。
        - id: ch01-b83
          speaker: narrator
          text: 他们怎样回家的？当然是搭斯诺登铁路。全国人民感激他们吗？这个嘛，全国人民都湿透了。等大家终于晾干，又开始关心一种用电烤松饼的新发明，早把龙忘得差不多了。龙一旦死去，再也看不见，似乎就没那么要紧。何况从来没人悬赏，谁也没答应过要给拯救者什么奖赏。
        - id: ch01-b84
          speaker: narrator
          text: 爸爸妈妈见到他们以后说了什么？亲爱的，这正是你们这些孩子总爱问的傻问题。不过就这一次，我告诉你吧。
        - id: ch01-b85
          speaker: mother
          text: 啊，我的宝贝们，我的宝贝们！你们平安回来了，真的平安回来了！可你们这两个淘气的孩子，怎么敢这样不听话，跑到白天外面去？现在就去睡觉，马上上床！
          emotion: surprised
        - id: ch01-b86
          speaker: doctor
          text: 早知道你们要做什么就好了。我很想保存一个标本。从艾菲眼睛里取出的那个，我已经扔掉了，因为我想另找一个更完整的。我没料到这个物种会立刻灭绝。
        - id: ch01-b87
          speaker: narrator
          text: 教授听完一句话也没说，只是得意地搓了搓双手。因为他没有扔掉自己的标本。那正是下午茶时从哈里杯里捞出来的龙，只有蠼螋那么大，教授花了半克朗才从哈里手里买到。直到今天，他还把它好好保存着。你要是见到教授，一定得请他亲手拿出来，让你好好看一看！
