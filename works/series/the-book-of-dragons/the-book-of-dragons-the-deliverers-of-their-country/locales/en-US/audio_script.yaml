  chapters:
    - id: ch01
      title: III. The Deliverers of Their Country
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It began when Effie got something in her eye. It hurt terribly. It felt like a red-hot spark, except that this spark seemed to have legs and fly wings. Effie rubbed her eye, and the tears came by themselves, though she was not miserable in her mind. Then she went to her father. He was a doctor, so he knew exactly how to remove things from eyes. With a soft paintbrush dipped in castor oil, he took it out very cleverly.
        - id: ch01-b02
          speaker: doctor
          text: This is very curious.
        - id: ch01-b03
          speaker: narrator
          text: Effie had often had things in her eye before. Her father had always treated that as natural, though perhaps tiresome and naughty. He had never called it curious.
        - id: ch01-b04
          speaker: effie
          text: I don't think you got it out.
        - id: ch01-b05
          speaker: narrator
          text: People nearly always say that after something has been taken from their eye.
        - id: ch01-b06
          speaker: doctor
          text: Oh, yes, it is out. Look, it is here on the brush. This is most interesting.
        - id: ch01-b07
          speaker: narrator
          text: Effie had never heard him call anything interesting when she had helped to produce it.
        - id: ch01-b08
          speaker: effie
          text: What is it?
        - id: ch01-b09
          speaker: narrator
          text: The doctor carried the brush carefully across the room and put its tip beneath his microscope. He adjusted the brass screws and peered down with one eye. The tiny creature wriggled in the castor oil.
        - id: ch01-b10
          speaker: doctor
          text: Dear me! It has four properly formed limbs, a long tail, and five toes of different lengths. It is almost one of the lizard family, but there are signs of wings too. Yes, a wing like a bat's. This must be a new specimen. Effie, run to the professor and ask him to come over for a few minutes.
          emotion: surprised
        - id: ch01-b11
          speaker: effie
          text: You could give me sixpence, Daddy. I brought you the new specimen, and I took great care of it inside my eye. My eye really does hurt.
        - id: ch01-b12
          speaker: narrator
          text: The doctor was so delighted with his discovery that he gave Effie a whole shilling instead of sixpence. Soon the professor came over as requested. The tiny creature proved interesting enough to keep him there through lunch. For the whole afternoon, he and the doctor argued about what the specimen should be called and which family it belonged to. They disagreed thoroughly and enjoyed every minute of the quarrel.
        - id: ch01-b13
          speaker: narrator
          text: At teatime, Harry fished something from his cup. He thought it was an earwig and was about to drop it on the floor and finish it in the usual way. Then it shook itself in his spoon, spread two wet wings, and flopped onto the tablecloth. It sat there cleaning itself with its feet and stretching its wings.
        - id: ch01-b14
          speaker: harry
          text: Why, it is a tiny newt!
          emotion: surprised
        - id: ch01-b15
          speaker: professor
          text: I will give you half a crown for it, Harry, my boy.
        - id: ch01-b16
          speaker: narrator
          text: The professor spoke before the doctor could say a word and lifted the creature carefully in his handkerchief.
        - id: ch01-b17
          speaker: professor
          text: Another new specimen, and this one is better than yours, Doctor.
        - id: ch01-b18
          speaker: narrator
          text: It was a tiny lizard, only half an inch long, with scales and wings. Now the doctor and professor had one specimen each, and both were pleased. But the specimens soon became much less valuable. Next morning, while the knife-boy cleaned the doctor's boots, he dropped the brushes, boot, and blacking and screamed that he had been burned. Out of the boot crawled a shiny-winged lizard as big as a kitten.
        - id: ch01-b19
          speaker: effie
          text: I know what it is! It is a dragon, like the one St. George killed.
        - id: ch01-b20
          speaker: narrator
          text: Effie was right. That very afternoon, Towser found a dragon about the size of a rabbit in the garden. He tried to chase it and was bitten for his trouble. By the next morning, newspapers everywhere were reporting the marvelous winged lizards that had appeared across the country. They refused to use the word dragons. No one nowadays was supposed to believe in dragons, and newspapers certainly did not mean to look foolish by believing in fairy tales. At first there were only a few creatures. Within a week or two, dragons of every possible size were crawling all over the country. When they rose into the air, there were sometimes as many as the bees in a thick swarm.
        - id: ch01-b21
          speaker: narrator
          text: Apart from their size, the dragons all looked alike. Each one had green scales, four legs, a long tail, and great wings shaped like a bat's. Those wings were a pale yellow and partly transparent, rather like the gear-cases on bicycles. Every dragon breathed fire and smoke, as any proper dragon must. Still the newspapers insisted on calling them winged lizards. Then a very large one picked up the editor of the Standard and carried him away. With that editor gone, there was no one left to tell the other newspaper people what they ought not to believe. Soon afterward, a dragon carried off the largest elephant in the Zoo. At last the papers stopped pretending. Across the tops of their pages, enormous headlines announced an alarming plague of dragons.
        - id: ch01-b22
          speaker: narrator
          text: You can hardly imagine how alarming the plague was, or how annoying. The largest dragons were certainly terrible. Still, people discovered that those dragons went to bed early because they feared the chilly night air. If you stayed safely indoors all day, the big ones were unlikely to get you. The smaller dragons were the real nuisance, because they could turn up anywhere. Earwig-sized ones wriggled into the soap and burrowed into the butter. Dog-sized ones climbed into baths. When someone turned on the cold tap, the fire and smoke inside a bathing dragon made the water steam furiously. Careless people were often badly scalded.
        - id: ch01-b23
          speaker: narrator
          text: Pigeon-sized dragons hid in workbaskets and the drawers tucked into room corners. They waited until someone was in a hurry for a needle or handkerchief, then bit the reaching hand. Sheep-sized dragons were easier to avoid because you could see them coming. But they often flew through open windows and curled up beneath the eiderdown. Imagine finding one only when you climbed into bed. It was always a shock. At least dragons of that size did not eat people. They ate lettuce instead, though their hot bodies scorched sheets and pillowcases dreadfully.
        - id: ch01-b24
          speaker: narrator
          text: The County Council and police tried everything. Offering a Princess to anyone who killed a dragon was useless. That worked in old times, when there was one dragon and one Princess. Now there were far more dragons than Princesses, even with a large Royal Family. Besides, people needed no reward. They killed every dragon they could just to get the nasty creatures out of the way.
        - id: ch01-b25
          speaker: narrator
          text: The Council agreed to burn any dead dragons delivered to its offices between ten in the morning and two in the afternoon. On every day of the week, wagons, carts, and trucks stood in a long line along the street, all loaded with dragon bodies. Boys wheeled up whole barrowfuls. Children stopped on their way home from morning school and handed over one or two fistfuls of little dragons. They carried them in their satchels or tied inside knotted pocket handkerchiefs. After all that killing and carrying, there still seemed to be just as many dragons as before.
        - id: ch01-b26
          speaker: narrator
          text: Then the police built tall wood-and-canvas towers covered in patent glue. Dragons that flew into them stuck fast, like flies on sticky kitchen paper. Once a tower was completely covered, an inspector set it alight and burned tower and dragons together. Shops sold dragon poison, anti-dragon soap, and dragonproof window curtains. Everything anyone could think of was done. Yet there seemed to be more dragons than ever.
        - id: ch01-b27
          speaker: narrator
          text: No one could easily discover the right poison, because dragons of different sizes ate completely different things. The largest kind ate elephants for as long as elephants remained, then continued with horses and cows. One smaller kind would touch nothing but lilies of the valley. A third kind ate only Prime Ministers when it could find them. When it could not, it fed quite freely on servants dressed in livery. Another kind lived on bricks. Three of those brick-eaters managed to devour two thirds of the South Lambeth Infirmary in a single afternoon.
        - id: ch01-b28
          speaker: narrator
          text: Effie feared one size most of all. It was about as big as her dining room, and it ate little girls and boys.
        - id: ch01-b29
          speaker: narrator
          text: At first Effie and Harry rather enjoyed their changed lives. They stayed awake all night and played in a garden lit by electric lamps. Even Mother's bedtime warning sounded funny.
        - id: ch01-b30
          speaker: mother
          text: Good night, my darlings. Sleep soundly all day, and do not get up before it is quite dark. You would not want those nasty dragons to catch you.
        - id: ch01-b31
          speaker: narrator
          text: Before long, the children were thoroughly tired of the new arrangement. They wanted to see flowers and trees growing in the fields. They wanted to stand in the pretty sunshine outdoors instead of seeing it through window glass and patent dragonproof curtains. They wanted to play on real grass. Mother would not let them do that in the electrically lit garden at night because the grass was wet with dew. More than anything, they longed to go outside just once in the beautiful, bright, dangerous daylight. They began inventing reasons why they really ought to go. The only trouble was that neither child wanted to disobey Mother.
        - id: ch01-b32
          speaker: narrator
          text: One morning, Mother was preparing new dragon poison for the cellars. Father was bandaging the boot boy's hand after a Prime-Minister-eating dragon had scratched it. No one remembered to tell the children to stay in bed until dark.
        - id: ch01-b33
          speaker: harry
          text: We should go now. It cannot be disobedience if no one told us not to. I know what we must do, though I don't know how to do it.
        - id: ch01-b34
          speaker: effie
          text: What must we do?
        - id: ch01-b35
          speaker: harry
          text: We must wake St. George. He was the only person in his town who understood dragons. People in fairy tales do not count, but St. George was real. He is only asleep, waiting for someone to wake him. Father says nobody believes in him anymore.
        - id: ch01-b36
          speaker: effie
          text: We believe in him.
        - id: ch01-b37
          speaker: harry
          text: Exactly, Ef. That is why we can wake him. You cannot wake someone you don't believe in, can you?
        - id: ch01-b38
          speaker: narrator
          text: Effie agreed, but she wanted to know where they could find him.
        - id: ch01-b39
          speaker: harry
          text: We will have to search. You can wear a dragonproof dress made from curtain cloth. I will cover myself with the very best dragon poison, and then—
        - id: ch01-b40
          speaker: narrator
          text: Effie clasped her hands and skipped with delight.
        - id: ch01-b41
          speaker: effie
          text: Harry, I know where he is! St. George must be in St. George's Church.
          emotion: happy
        - id: ch01-b42
          speaker: narrator
          text: Harry wished he had thought of that himself.
        - id: ch01-b43
          speaker: harry
          text: Hmm. For a girl, you do have some sense now and then.
        - id: ch01-b44
          speaker: narrator
          text: Early the next afternoon, long before sunset brought the working night, the children climbed out of bed. There was no time to sew a dress, so Effie wrapped herself in a shawl of dragonproof muslin. Harry smeared himself messily with patent dragon poison. Its label promised it was harmless to infants and invalids, so he felt safe. Holding hands, they started toward St. George's Church. There are many churches with that name, but luckily they chose the road to the right one. They walked through the bright sunlight feeling brave and adventurous.
        - id: ch01-b45
          speaker: narrator
          text: No one else was in the streets. Dragons swarmed everywhere, though fortunately none were just the right size to eat children. If there had been, this story might have ended at once. Dragons covered the pavements and roadways. They basked on the front steps of public buildings and sat high on roofs, preening their wings in the hot afternoon sun. The whole town looked green with scales. Beyond the town, the country lanes were no better. Fields on both sides looked greener than usual because scaly legs and long tails lay across them. Some of the smaller dragons had even made asbestos nests among the blossoms in the hawthorn hedges.
        - id: ch01-b46
          speaker: narrator
          text: Effie gripped Harry's hand. A fat dragon flopped against her ear, and she screamed. At the sound, a whole flight of green dragons rose from a field and sprawled across the sky. Their wings rattled as they went.
        - id: ch01-b47
          speaker: effie
          text: Oh, I want to go home!
          emotion: fearful
        - id: ch01-b48
          speaker: harry
          text: Don't be foolish. Remember the Seven Champions and all those princes. People who mean to deliver their country do not scream and ask to go home.
        - id: ch01-b49
          speaker: effie
          text: Are we really going to be deliverers?
        - id: ch01-b50
          speaker: harry
          text: You will see.
        - id: ch01-b51
          speaker: narrator
          text: They went on. The church door stood open, but St. George was not inside. In the churchyard they found his great stone tomb. His marble figure lay on top in armor and helmet, hands folded over his chest.
        - id: ch01-b52
          speakers: [effie, harry]
          ensemble: duo
          text: How can we possibly wake him?
        - id: ch01-b53
          speaker: narrator
          text: Harry spoke to the stone saint, then called more loudly. St. George did not hear. Harry even shook the dragon-slayer's marble shoulders, but nothing happened. Effie began to cry. She put her arms around his neck as well as the marble allowed, kissed his stone face, and pleaded with him.
        - id: ch01-b54
          speaker: effie
          text: Dear, good, kind St. George, please wake up and help us.
          emotion: sad
        - id: ch01-b55
          speaker: narrator
          text: St. George opened his eyes, stretched sleepily, and looked at her.
        - id: ch01-b56
          speaker: st_george
          text: What is wrong, little girl?
        - id: ch01-b57
          speaker: narrator
          text: The children told him everything. He rolled over in his marble and listened on one elbow. When he heard how many dragons there were, he shook his head.
        - id: ch01-b58
          speaker: st_george
          text: It is no use. That is one dragon too many for poor old George. You should have woken me sooner. I always believed in a fair fight. One man and one dragon, that was my rule.
        - id: ch01-b59
          speaker: narrator
          text: A flight of dragons passed overhead. St. George pulled his sword halfway out, then watched the flight grow small in the distance. He shook his head and pushed the sword back.
        - id: ch01-b60
          speaker: st_george
          text: I can do nothing. The world has changed since my day. St. Andrew told me so after someone woke him during the engineers' strike. He says everything is done by machinery now, so there must be some mechanical way to settle these dragons. What sort of weather have you had lately?
        - id: ch01-b61
          speaker: narrator
          text: Harry thought that question careless and unkind, so he refused to answer. Effie was more patient.
        - id: ch01-b62
          speaker: effie
          text: The weather has been very fine. Father says this is the hottest weather our country has ever known.
        - id: ch01-b63
          speaker: st_george
          text: Ah, just as I thought. Dragons cannot bear wet and cold. That is the only answer, if you can find the taps.
        - id: ch01-b64
          speaker: narrator
          text: St. George began settling onto his stone slab again. He yawned behind one marble hand.
        - id: ch01-b65
          speaker: st_george
          text: Good night. I am very sorry I cannot help you.
        - id: ch01-b66
          speaker: effie
          text: But you can help! Please tell us which taps you mean.
        - id: ch01-b67
          speaker: st_george
          text: Taps like the ones in a bathroom. There is a looking glass too. It shows the whole world and everything happening in it. St. Denis told me. He said it was very pretty. Sorry I cannot—good night.
        - id: ch01-b68
          speaker: narrator
          text: In another moment he had sunk back into the marble and was fast asleep.
        - id: ch01-b69
          speaker: harry
          text: We will never find those taps. And suppose St. George wakes when a champion-eating dragon is nearby. Wouldn't that be awful?
        - id: ch01-b70
          speaker: narrator
          text: Effie took off her dragonproof veil.
        - id: ch01-b71
          speaker: effie
          text: We saw no dining-room-sized dragons on the way here. I expect he will be safe enough.
        - id: ch01-b72
          speaker: narrator
          text: She covered St. George with the veil, and Harry rubbed as much dragon poison as he could from himself onto the saint's armor.
        - id: ch01-b73
          speaker: harry
          text: We could hide inside the church until dark, and then—
        - id: ch01-b74
          speaker: narrator
          text: A dark shadow fell over them before Harry could finish. They looked up and saw a dragon exactly the size of their dining room at home. The children knew all was lost. It swooped out of the sky and seized them in its claws. One claw caught Effie by her green silk sash. The other hooked into the little pointed tail at the back of Harry's Eton jacket. Then the dragon spread its enormous yellow wings and carried them into the air. Its scales and wings rattled like a third-class railway carriage when the brake is pressed hard.
        - id: ch01-b75
          speaker: effie
          text: Oh, Harry, when do you think it will eat us?
          emotion: fearful
        - id: ch01-b76
          speaker: narrator
          text: The dragon flew across woods and fields, and each great flap of its wings carried it a quarter of a mile. Effie and Harry looked down. Hedges, rivers, churches, and farmhouses flowed away beneath them, faster than the landscape races past the windows of the quickest express train. Still the dragon flew. Other dragons crossed the sky around it, but the dining-room-sized dragon did not pause to speak to any of them. It knew where it meant to go and kept flying steadily onward.
        - id: ch01-b77
          speaker: harry
          text: It knows exactly where it is going. If only it would drop us before it arrives!
          emotion: fearful
        - id: ch01-b78
          speaker: narrator
          text: The dragon held tight and flew until the children were dizzy. At last it landed on a mountaintop, scales rattling. It lay panting on its green side, exhausted by the long journey, but its claws still held Effie's sash and Harry's jacket.
        - id: ch01-b79
          speaker: narrator
          text: Effie drew the knife Harry had given her for her birthday. It had cost only sixpence in the first place. She had owned it for a month, and it had never managed to sharpen anything except slate pencils. Yet somehow, that poor little knife cut through the front of her sash. Effie slipped free and left the dragon clutching only a green silk bow. She tried the knife on the tail of Harry's jacket, but that cloth was far too strong. At last she gave up. With her help, Harry wriggled silently backward through his sleeves until he too was free. One dragon claw now held an empty sash, and the other held an empty Eton jacket.
        - id: ch01-b80
          speaker: narrator
          text: The children tiptoed into a crack in the rocks too narrow for the dragon. When it recovered enough to sit up and think of eating them, they made faces at it. Furious, it blew fire and smoke into the crack. They retreated beyond its reach, and when it grew tired of blowing, it went away.
        - id: ch01-b81
          speaker: narrator
          text: They were still afraid to leave the cave, in case the dragon was waiting nearby. Instead, they followed the narrow passage farther into the mountain. After a while it opened wider, and hard rock beneath their feet gave way to soft sand. They kept going until they reached the very end. A door stood there. Painted across it were the words, “Universal Taproom. Private. No One Allowed Inside.” Naturally, the children opened it at once, meaning only to peep. Then both of them remembered what St. George had said about taps.
        - id: ch01-b82
          speaker: harry
          text: We cannot be any worse off in there, with a dragon waiting outside. Let us go in.
        - id: ch01-b83
          speaker: narrator
          text: Boldly, they entered the taproom and shut the door behind them.
        - id: ch01-b84
          speaker: narrator
          text: The room had been cut from solid rock. Along one wall were taps with china labels, like the labels on bath taps. The children could read words of two syllables, and sometimes even three, so they understood that this was where the world's weather was turned on. Six large taps were marked Sunshine, Wind, Rain, Snow, Hail, and Ice. Smaller ones promised Fair to Moderate, Showery, South Breeze, Nice Growing Weather for the Crops, Skating, Good Open Weather, South Wind, East Wind, and many other kinds of weather.
        - id: ch01-b85
          speaker: narrator
          text: The Sunshine tap was on full. No sunlight showed inside because the cave was lit through a blue-glass skylight. They supposed it flowed away through some hidden pipe, like the special tap that washes underneath a patent kitchen sink.
        - id: ch01-b86
          speaker: narrator
          text: The opposite wall was one enormous looking glass. It did much more than an ordinary mirror, because it showed everything happening everywhere in the world, all at the same time. The children saw carts rolling up to the County Council offices to deliver their loads of dead dragons. They saw St. George lying asleep beneath Effie's dragonproof veil. Then they saw their own home. Mother was there, crying because her children had gone out into the dreadful, dangerous daylight. She was afraid that a dragon had eaten them.
        - id: ch01-b87
          speaker: narrator
          text: They saw all England spread beneath them like a great puzzle map. The parts covered in fields were green, and the towns were brown. The busy places where people made coal, crockery, cutlery, and chemicals showed up black. Over the black places, the brown places, and the green places alike lay a great network of living green dragons. The looking glass showed the children that it was still broad daylight everywhere. Not one of the dragons had gone to bed for the night.
        - id: ch01-b88
          speaker: effie
          text: Dragons cannot bear the cold.
        - id: ch01-b89
          speaker: narrator
          text: Effie tried to shut off the Sunshine, but its handle would not turn properly. The tap was broken. That was why the weather had stayed so hot, and the heat was why all those dragons had been able to hatch. Since they could do nothing with Sunshine, the children left it alone. Instead, they opened the Snow tap as far as it would go and hurried back to the looking glass. Snow began falling across England. Dragons rushed wildly in every direction, like ants when someone cruelly pours water into their nest. Of course, you would never do such a thing. The snow fell more heavily every moment.
        - id: ch01-b90
          speaker: narrator
          text: Effie turned the Rain tap fully on as well. The downpour soaked every dragon. Soon the creatures began wriggling more slowly. One after another they lay quite still. The children understood that the water had put out the fires inside them and that the dragons were dead. To make absolutely sure, they opened the Hail tap too. They turned it only halfway, because even while saving the country they did not want to break people's windows. After the hail had fallen for a while, they searched the whole looking glass. Not one dragon was still moving.
        - id: ch01-b91
          speaker: narrator
          text: The children knew that they truly were the deliverers of their country.
        - id: ch01-b92
          speaker: harry
          text: They will build us a monument as tall as Nelson's! Every dragon is dead.
          emotion: happy
        - id: ch01-b93
          speaker: effie
          text: I hope the dragon outside is dead. But I am not sure about a monument. What will everyone do with so many dead dragons? Burying them would take years, and now that they are soaked, they cannot be burned. I wish the rain could wash them into the sea.
        - id: ch01-b94
          speaker: narrator
          text: The rain did not wash them away. The children began to suspect they had not been quite as clever as they thought.
        - id: ch01-b95
          speaker: harry
          text: I wonder what this old tap does.
        - id: ch01-b96
          speaker: narrator
          text: He had found a rusty tap that seemed unused for ages. Dirt and cobwebs covered its china label. Effie cleaned it with a piece of her skirt. Strangely enough, neither child had brought a handkerchief. Under the dirt was the word “Waste.”
        - id: ch01-b97
          speaker: effie
          text: Let us turn it on. Perhaps it will carry the dragons away.
        - id: ch01-b98
          speaker: narrator
          text: The old tap was very stiff. Together they forced it open, then ran to the mirror. A huge round black hole had appeared in the center of England. The edges of the map tipped upward, and the rain streamed toward the hole.
        - id: ch01-b99
          speaker: effie
          text: Hurrah! Hurrah! Hurrah!
          emotion: happy
        - id: ch01-b100
          speaker: narrator
          text: Effie hurried back and opened every tap that sounded wet. She chose Showery, Good Open Weather, Nice Growing Weather for the Crops, and even South and Southwest, because Father had said those winds brought rain.
        - id: ch01-b101
          speaker: narrator
          text: Floods of rain poured down upon the country. Great sheets of water flowed from every side toward the center of the tilted map. There the water became cataracts and plunged into the huge round hole. The dead dragons began moving with it. They washed away in thick green masses and in scattered green shoals. Some went down the waste pipe one by one, while others vanished by the dozen. Dragons of every size were swept away, from the enormous kind that carried off elephants to the tiniest kind that slipped into a cup of tea.
        - id: ch01-b102
          speaker: narrator
          text: Soon not one dragon remained anywhere on the map. The children shut the Waste tap before anything else could disappear. Next they wrestled with Sunshine. Because it was broken, they could only turn it halfway down and could not shut it completely. Finally, they opened the taps marked Fair to Moderate and Showery, hoping to leave pleasant weather behind them. Unfortunately, both handles stuck in place and could never be turned off again. And that, if you have ever wondered, is the reason our climate changes between fair and showery weather.
        - id: ch01-b103
          speaker: narrator
          text: How did Effie and Harry get home? By the Snowdon railway, of course.
        - id: ch01-b104
          speaker: narrator
          text: Was the nation grateful to its two deliverers? Well, the nation was extremely wet. People had other things to think about while their clothes, houses, roads, and fields dried. By the time the country was dry again, everyone had become excited about a new invention that toasted muffins with electricity. The dragons were almost forgotten. You see, dragons do not seem nearly so important once they are dead and gone. And no one had ever offered a reward for saving the country from them.
        - id: ch01-b105
          speaker: narrator
          text: And what did Father and Mother say when the children returned? My dear, children always ask such silly questions. Still, just this once, I will tell you.
        - id: ch01-b106
          speaker: mother
          text: Oh, my darlings, you are safe! You are safe! You naughty children, how could you disobey us? Go straight to bed!
          emotion: happy
        - id: ch01-b107
          speaker: doctor
          text: I wish I had known what you planned. I would have preserved a specimen. I threw away the creature from Effie's eye because I meant to find a more perfect one. I did not expect the species to become extinct so quickly.
        - id: ch01-b108
          speaker: narrator
          text: The professor said nothing. He only rubbed his hands. He had kept his own specimen, the earwig-sized dragon that cost him half a crown, and he has it to this day.
        - id: ch01-b109
          speaker: narrator
          text: You must ask him to show it to you!
