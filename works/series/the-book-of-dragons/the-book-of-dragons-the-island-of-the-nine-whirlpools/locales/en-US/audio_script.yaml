  chapters:
    - id: ch01
      title: The Witch's Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The way into the witch's cave ran under a dark arch. A fringe of living black-and-yellow snakes hung from it. The Queen kept carefully to the middle as she passed beneath them. Every snake raised its wicked flat head and stared with wicked yellow eyes. Staring is bad manners, even when you stare at Royalty. Cats may be excused, but these snakes had been very badly brought up. They even stuck out their thin, sharp tongues at the poor lady.
        - id: ch01-b02
          speaker: narrator
          text: The Queen's husband was the King. He was also an enchanter, and people considered him one of the finest in his profession. He knew that when Kings and Queens wanted children, the Queen always went to a witch. So he gave his wife the witch's address. The Queen was frightened and disliked the whole business, but she went. Inside the cave, the witch sat beside a fire of sticks and stirred something bubbly in a bright copper cauldron.
        - id: ch01-b03
          speaker: witch
          text: What is it you want, my dear?
        - id: ch01-b04
          speaker: queen
          text: Oh, please, I want a baby. A very nice baby. We don't mind what it costs. My husband was saying something about it...
        - id: ch01-b05
          speaker: witch
          text: Yes, yes. I know all about your husband. So you want a child. Do you understand that the child will bring you sorrow?
        - id: ch01-b06
          speaker: queen
          text: First, my child will bring me joy.
        - id: ch01-b07
          speaker: witch
          text: It will bring you great sorrow.
        - id: ch01-b08
          speaker: queen
          text: It will bring me greater joy.
        - id: ch01-b09
          speaker: witch
          text: Very well, then. Have it your way. I suppose you would hardly dare go home without one.
        - id: ch01-b10
          speaker: queen
          text: The King would be terribly annoyed.
        - id: ch01-b11
          speaker: witch
          text: Well, what will you give me in return for the child?
        - id: ch01-b12
          speaker: queen
          text: Anything you ask. Everything I have.
        - id: ch01-b13
          speaker: witch
          text: Give me your golden crown.
        - id: ch01-b14
          speaker: narrator
          text: The Queen quickly took it off.
        - id: ch01-b15
          speaker: witch
          text: Now the necklace made of blue sapphires.
        - id: ch01-b16
          speaker: narrator
          text: The Queen unfastened it.
        - id: ch01-b17
          speaker: witch
          text: Your pearl bracelets too.
        - id: ch01-b18
          speaker: narrator
          text: The Queen unclasped them.
        - id: ch01-b19
          speaker: witch
          text: And those ruby clasps.
        - id: ch01-b20
          speaker: narrator
          text: The Queen undid the clasps.
        - id: ch01-b21
          speaker: witch
          text: Now give me the lilies at your breast.
        - id: ch01-b22
          speaker: narrator
          text: The Queen gathered up the lilies.
        - id: ch01-b23
          speaker: witch
          text: Last of all, I want the diamonds from your bright little shoe buckles.
        - id: ch01-b24
          speaker: narrator
          text: The Queen pulled off her shoes. The witch stirred the cauldron. One by one, she dropped in the golden crown, the sapphire necklace, the pearl bracelets, the ruby clasps, and the diamonds from the bright shoe buckles. The lilies went in last. The brew foamed up in flashes of yellow, blue, red, white, and silver. A sweet scent filled the cave. After a while, the witch poured it into a pot and left it to cool in the doorway among the snakes.
        - id: ch01-b25
          speaker: witch
          text: Your child's hair will shine as gold as your crown, and its eyes will be as blue as your sapphires. Your rubies will give their red to its lips. Its skin will be pale and clear like your pearls. Its soul will be as white and sweet as your lilies, and its wits will shine more clearly than your diamonds.
        - id: ch01-b26
          speaker: queen
          text: Oh, thank you! Thank you! When will my baby come?
          emotion: happy
        - id: ch01-b27
          speaker: witch
          text: You will find the child when you reach home.
        - id: ch01-b28
          speaker: queen
          text: But won't you take something for yourself? Anything you fancy. Would you like a whole country, or perhaps a sack of jewels?
        - id: ch01-b29
          speaker: witch
          text: No, thank you. In one day I could make more diamonds than I could wear in a year.
        - id: ch01-b30
          speaker: queen
          text: Please let me do one little thing for you. Are you tired of being a witch? Would you rather be a Duchess, or a Princess, or something of that sort?
        - id: ch01-b31
          speaker: witch
          text: There is one thing I would like. In my line of work, it is very hard to find.
        - id: ch01-b32
          speaker: queen
          text: Tell me. What is it?
        - id: ch01-b33
          speaker: witch
          text: I would like someone to love me.
        - id: ch01-b34
          speaker: narrator
          text: The Queen threw both arms around the witch and kissed her half a hundred times.
        - id: ch01-b35
          speaker: queen
          text: Why, I love you more than my life! You have given me my baby, and the baby shall love you too.
          emotion: happy
        - id: ch01-b36
          speaker: witch
          text: Perhaps it will. When the sorrow comes, send for me. Every one of your fifty kisses will be a spell that calls me to you. Now drink your medicine, dear, and hurry home.
        - id: ch01-b37
          speaker: narrator
          text: By then the drink was quite cool. The Queen swallowed it and passed out under the snakes. This time they behaved like good Sunday-school children. A few even tried to curtsy, though curtsying is difficult when you hang upside down by your tail. They knew the Queen was their mistress's friend, so they did their best to be polite.
        - id: ch01-b38
          speaker: narrator
          text: Sure enough, when the Queen reached home, a baby lay crying quite naturally in a cradle decorated with the Royal arms. Pink ribbons tied up its sleeves, so the Queen saw at once that it was a girl. When the King found out, he tore at his black hair in a fury.
        - id: ch01-b39
          speaker: king
          text: Oh, you foolish, foolish Queen! Why didn't I marry a clever woman? Do you think I sent you all the way to a witch, at great trouble and expense, just to bring home a girl? I wanted a boy. An heir. A Prince who could learn all my magic and enchantments, then rule after me. I would wager my own crown that you never told the witch what sort of child you wanted. Did you?
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: The Queen lowered her head. She had to admit that she had only asked for a child.
        - id: ch01-b41
          speaker: king
          text: Very well, madam. Have it your way. Make the most of your daughter while she is still a child.
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: And the Queen did. None of her earlier years had held half the happiness she found in each moment with her baby in her arms. The years passed. The King grew cleverer and cleverer at magic, and more and more disagreeable at home. The Princess became more beautiful and more dearly loved with every day she lived.
    - id: ch02
      title: The Island of the Nine Whirlpools
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the Princess's eighteenth birthday, she and the Queen fed crumbs of birthday cake to the goldfish in the courtyard fountains. The King came in looking as black as thunder, with his black raven hopping behind him. As usual when he met his family, he shook his fist at them. The raven perched on the marble basin and pecked at the goldfish, doing all it could to show that it shared its master's temper.
        - id: ch02-b02
          speaker: king
          text: A girl! How dare you even look at me when you know your foolishness ruined everything?
          emotion: angry
        - id: ch02-b03
          speaker: princess
          text: You must not speak to my mother that way.
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: The Princess was eighteen. All at once, she realized that she was grown up, and so she spoke her mind. For several minutes the King was too angry to make a sound.
        - id: ch02-b05
          speaker: queen
          text: My dear child, do not interfere.
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: The Queen sounded quite cross because she was frightened. Then she turned to her husband.
        - id: ch02-b07
          speaker: queen
          text: My dear, why must you keep troubling yourself over this? Our daughter is not a boy, that is true. But she may marry a clever man. He could rule your kingdom after you, and he could learn all the magic you wished to teach him.
        - id: ch02-b08
          speaker: king
          text: If she marries, her husband will have to be clever. Oh yes, clever indeed. And he will need to know far more magic than I would ever care to teach him.
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: The Queen heard his tone and knew he meant to do something disagreeable.
        - id: ch02-b10
          speaker: queen
          text: Please do not punish the child because she loves her mother.
        - id: ch02-b11
          speaker: king
          text: I will not punish her for that. I will merely teach her to respect her father.
        - id: ch02-b12
          speaker: narrator
          text: He went straight to his laboratory and worked through the night. He boiled things of many colors in crucibles. From old brown books, whose yellow pages were stained with mold, he copied charms written in strange twisted letters.
        - id: ch02-b13
          speaker: narrator
          text: By morning his plan was ready. He carried the poor Princess to the Lone Tower. It stood on an island in the sea, a thousand miles from everywhere. He gave her a dowry and a handsome income. He hired a capable dragon to guard her, along with a respectable griffin whose family and upbringing he knew thoroughly.
        - id: ch02-b14
          speaker: king
          text: Here you will remain, my dear respectful daughter, until the clever man comes to marry you. He must be clever enough to sail through the Nine Whirlpools around the island. Then he must kill both the dragon and the griffin. Until he arrives, you will grow neither older nor wiser. No doubt he will be here soon. You may spend the time embroidering your wedding gown. I wish you every joy, my dutiful child.
        - id: ch02-b15
          speaker: narrator
          text: His carriage was drawn by living thunderbolts, and thunder travels very fast. The strange team pulled it up through the air until carriage, King, and thunderbolts all disappeared from sight. The poor Princess remained behind on the Island of the Nine Whirlpools, alone except for the dragon and the griffin appointed to guard her.
        - id: ch02-b16
          speaker: narrator
          text: At home, the Queen cried for one whole day and one whole night. Then she remembered the witch and called her. The witch came, and the Queen told her everything.
        - id: ch02-b17
          speaker: witch
          text: For the sake of those twice twenty-five kisses, I will help you. But this is the last thing I can do, and it is not much. Your daughter is under a spell. I can take you to her, but then you must become stone and remain stone until the spell is lifted from your child.
        - id: ch02-b18
          speaker: queen
          text: I would be stone for a thousand years if I could see my dear child again when those years were over.
        - id: ch02-b19
          speaker: narrator
          text: The witch brought a carriage drawn by living sunbeams. Sunbeams travel faster than anything in the world, and much faster than thunder. Away they flew to the Lone Tower. The Princess sat on the floor of its best room, crying as though her heart would break. The dragon and the griffin sat primly on either side of her.
        - id: ch02-b20
          speaker: princess
          text: Oh, Mother! Mother! Mother!
          emotion: sad
        - id: ch02-b21
          speaker: narrator
          text: She threw her arms around the Queen's neck as if she would never let go. When they had all cried as much as was good for them, the witch spoke.
        - id: ch02-b22
          speaker: witch
          text: I can do one or two more small things. Time shall not make the Princess sorrowful. Every day will seem like one day until her rescuer comes. You and I, dear Queen, will sit in stone beside the tower gate. To do this, I must give up all my magic. When I speak the spell that changes you, I will turn to stone as well. If we ever come out again, I will no longer be a witch. I will be only a happy old woman.
        - id: ch02-b23
          speaker: narrator
          text: The three of them kissed one another again and again. The witch said her spell. At once, a stone lady stood on each side of the door. One wore a stone crown and carried a stone scepter. The other held a stone tablet covered in words. The dragon and griffin were both well educated, but neither could read them.
        - id: ch02-b24
          speaker: narrator
          text: From then on, every day felt like the same day to the Princess. Tomorrow always seemed to be the day her mother would step out of the stone and kiss her. The years moved slowly past. The wicked King died, and someone else took his kingdom. Many things changed in the world, but nothing changed on the island. The Nine Whirlpools still spun. The dragon and griffin remained, and the two stone ladies stood beside the gate.
        - id: ch02-b25
          speaker: narrator
          text: From the very beginning, the day of the Princess's rescue was creeping nearer and nearer. No one saw it coming except the Princess, and she saw it only in dreams. Tens of years passed, then hundreds. The Nine Whirlpools kept spinning around the island. Their roar sounded like a triumphant telling of every fine ship dragged down into their swirl. Each lost ship had carried some Prince who tried to win the Princess and her dowry, but neither courage nor a Royal title had brought one safely through.
        - id: ch02-b26
          speaker: narrator
          text: The great sea knew another set of stories too. Princes came from very distant lands, saw the whirlpools, shook their wise young heads, muttered something about the ship, and sensibly returned to their safe and comfortable kingdoms. Yet no one told the story of the rescuer who would succeed. Still the years went by.
    - id: ch03
      title: Nigel Finds the Way
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After more scores of years than you would care to add up on a slate, a sailor-boy named Nigel crossed the high seas with his uncle, a skillful skipper. Nigel could reef a sail, coil a rope, and hold a ship's nose steady before the wind. He was as good a boy as you could find in a month of Sundays, and worthy to be a Prince.
        - id: ch03-b02
          speaker: narrator
          text: There is Something wiser than all the world, and it knows when someone deserves to be a Prince. That Something came from beyond the seventh world and whispered in Nigel's ear. He heard it without knowing he had heard. He gazed over the black sea, where white foam-horses galloped, and noticed a light far away.
        - id: ch03-b03
          speaker: nigel
          text: Uncle, what is that light?
        - id: ch03-b04
          speaker: skipper
          text: May every good thing keep you from sailing near it, Nigel. Most charts say nothing about that light. But it is marked on my old chart, the one that belonged to my father's father, and to his father's father before him. It shines from the Lone Tower above the Nine Whirlpools. When my grandfather was young, an ancient man, his own great-great-grandfather, told him that an enchanted Princess waited there. They said she was fairer than day and waiting to be rescued. But no rescue is possible. Never steer toward that light, and put the Princess out of your thoughts. She is only an old tale. The whirlpools are real.
        - id: ch03-b05
          speaker: narrator
          text: Naturally, from that day onward Nigel thought of nothing else. As the ship sailed here and there across the high seas, he sometimes saw that light shining over the wild spinning water. One night, the ship lay at anchor and the skipper slept in his bunk. Nigel lowered the ship's boat and rowed alone through the darkness toward the light. He did not dare come too close before daylight showed him exactly what he had to fear.
        - id: ch03-b06
          speaker: narrator
          text: Dawn revealed the Lone Tower, dark against the pink and primrose eastern sky. Around its base, black water turned in a sullen swirl, and Nigel heard its wonderful roar. He rowed back and forth at a safe distance through that day, then watched for six more. After giving the whirlpools all his attention for seven days, he had learned something. You are certain to learn something when you give it your whole thought for that long, even if the subject is only the first declension, the nine-times table, or the dates of the Norman Kings.
        - id: ch03-b07
          speaker: narrator
          text: For five minutes in every day, the whirlpools went silent. The tide drained away and uncovered yellow sand. It happened five minutes earlier each day. Nigel made certain by checking the ship's chronometer, which he had thoughtfully brought. On the eighth day, five minutes before noon, he made ready. The whirlpools stopped, and the tide sank like water escaping through a hole in a basin. Nigel bent hard to his oars, drove the boat onto the yellow sand, dragged it into a cave, and sat down to wait.
        - id: ch03-b08
          speaker: narrator
          text: At one second past five minutes after noon, the whirlpools were black and busy again. Nigel looked out. On a rocky ledge above the sea stood a Princess as beautiful as day, with golden hair and a green gown. He stepped from the cave to meet her.
        - id: ch03-b09
          speaker: nigel
          text: I have come to rescue you. Oh, how beautiful and dear you are!
          emotion: happy
        - id: ch03-b10
          speaker: princess
          text: And you are very good, very clever, and very dear.
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: Smiling, she placed both hands in his. Before he released them, Nigel shut a little kiss inside each one.
        - id: ch03-b12
          speaker: nigel
          text: When the tide is low again, I will carry you away in my boat.
        - id: ch03-b13
          speaker: princess
          text: What shall we do about the dragon and the griffin?
        - id: ch03-b14
          speaker: nigel
          text: Dear me. I knew nothing about them. Perhaps I can kill them?
        - id: ch03-b15
          speaker: princess
          text: Don't be silly. You have no sword, no shield, nothing at all!
        - id: ch03-b16
          speaker: narrator
          text: She pretended to be very grown-up. Though she had lived on the island for no one knew how many years, she was still eighteen and still enjoyed pretending.
        - id: ch03-b17
          speaker: nigel
          text: Do the beasts ever sleep?
        - id: ch03-b18
          speaker: princess
          text: Yes, but only once every twenty-four hours. When the dragon sleeps, he turns to stone. The griffin has dreams and sleeps at teatime. The dragon sleeps for five minutes each day, and each day he begins three minutes later than the day before.
        - id: ch03-b19
          speaker: nigel
          text: What time will the dragon sleep today?
        - id: ch03-b20
          speaker: princess
          text: He will fall asleep at eleven o'clock.
        - id: ch03-b21
          speaker: nigel
          text: Can you do sums?
        - id: ch03-b22
          speaker: princess
          text: No. I was never very good at them.
          emotion: sad
        - id: ch03-b23
          speaker: nigel
          text: Then I must do it. I can manage sums, but I work slowly, and they make me miserable. This one may take days and days.
        - id: ch03-b24
          speaker: princess
          text: Do not start yet. You will have plenty of time to be unhappy when I am gone. Tell me all about yourself first.
        - id: ch03-b25
          speaker: narrator
          text: Nigel told her his story, and then she told him hers.
        - id: ch03-b26
          speaker: princess
          text: I know I have lived here for a long while, but I do not know what Time means. I stay busy sewing silk flowers onto the golden gown for my wedding. The griffin keeps the house. His feathery wings are excellent for sweeping and dusting. The dragon cooks because he is hot inside, so cooking costs him no trouble. I may not understand Time, but I am sure my wedding day is near. My gown needs only one more white daisy on the sleeve and one lily on the front. Then it will be finished.
        - id: ch03-b27
          speaker: narrator
          text: A dry rattling rustle came from the rocks above, followed by a snort.
        - id: ch03-b28
          speaker: princess
          text: That is the dragon! Good-bye. Be a good boy and finish your sum.
        - id: ch03-b29
          speaker: narrator
          text: She hurried away and left Nigel with his arithmetic. Here was the problem. The whirlpools stopped and the tide fell once in twenty-four hours, five minutes earlier every day. The dragon slept once a day, three minutes later every day. Nigel had to discover when the tide would fall three minutes before the dragon went to sleep.
        - id: ch03-b30
          speaker: narrator
          text: You would find it simple because you went to a good school and paid attention. Poor Nigel found it very different. With chalk, he worked on a smooth stone. He tried practice, the unitary method, multiplication, and the rule of three-and-three-quarters. Then came decimals, compound interest, square roots, cube roots, simple addition, other kinds of addition, and mixed examples in vulgar fractions. None of them helped.
        - id: ch03-b31
          speaker: narrator
          text: He moved on to algebra. He tried simple equations, quadratic equations, trigonometry, logarithms, and conic sections. Every method gave him an answer, but each answer was different. He could not tell which one was right. Just as he began to understand that knowing your sums matters more than almost anything, the Princess returned. Darkness was falling.
        - id: ch03-b32
          speaker: princess
          text: You have spent seven hours on that sum, and it still is not done. Look. These words are carved on the statue's tablet beside the lower gate. There are figures among them. Perhaps they give the answer.
        - id: ch03-b33
          speaker: narrator
          text: She handed him a large white magnolia leaf. Using the pin from her pearl brooch, she had scratched words into it. The marks had turned brown, as marks on magnolia leaves will. Nigel read that after nine days, the tide would fall at two twenty-four and the dragon would sleep at two twenty-seven. A final note said that the griffin was artificial, and the message ended with the letter R.
        - id: ch03-b34
          speaker: narrator
          text: Nigel clapped softly.
        - id: ch03-b35
          speaker: nigel
          text: Dear Princess, this must be right. It even ends with R. Still, I will prove it.
          emotion: happy
        - id: ch03-b36
          speaker: narrator
          text: He hurried through the problem backward, using decimals, equations, conic sections, and every rule he remembered. This time, every method agreed.
        - id: ch03-b37
          speaker: nigel
          text: Now we only have to wait.
        - id: ch03-b38
          speaker: narrator
          text: And they waited. Every day the Princess visited Nigel and brought him food cooked by the dragon. He lived in his cave. When she was there, he talked to her. When she was away, he thought about her. They were both as happy as the longest summer day. At last, The Day arrived, and together they settled every part of their plan.
    - id: ch04
      title: The Dragon and the Griffin
      blocks:
        - id: ch04-b01
          speaker: nigel
          text: You are certain he cannot hurt you, my only treasure?
        - id: ch04-b02
          speaker: princess
          text: Quite certain. I only wish I were half as sure that he could not hurt you.
        - id: ch04-b03
          speaker: nigel
          text: My Princess, two great powers stand with us. One is Love, and the other is Arithmetic. Nothing in the world is stronger than those two.
        - id: ch04-b04
          speaker: narrator
          text: As the tide began to drain away, Nigel and the Princess ran onto the sand. In plain sight of the terrace where the dragon watched, Nigel took the Princess in his arms and kissed her. The griffin was sweeping the Lone Tower stairs. The dragon saw the kiss and roared with rage. It sounded like twenty engines blowing off steam together inside Cannon Street Station.
        - id: ch04-b05
          speaker: narrator
          text: The lovers looked up at him. He was dreadful. Age had turned his head white, and his beard had grown so long that his claws caught in it when he walked. Sea spray had crusted his wings with white salt. His long white tail was thick and jointed, with far too many little legs, so it looked like an enormous fat silkworm. His claws were as long as lessons and as sharp as bayonets.
        - id: ch04-b06
          speaker: nigel
          text: Good-bye, my love!
        - id: ch04-b07
          speaker: narrator
          text: Nigel raced over the yellow sand toward the sea. One end of a cord was tied around his arm. The dragon scrambled down the cliff. A moment later, it crawled, twisted, sprawled, and wriggled after him across the beach. Its heavy feet punched great holes in the sand. The bare tip of its tail dragged a mark like the groove left when a boat is launched.
        - id: ch04-b08
          speaker: narrator
          text: Fire poured from the dragon's mouth. Wet sand hissed, and the water in the rock pools grew so frightened that it fled as steam. Still Nigel ran, and still the dragon followed. Steam hid everything from the Princess. She wept bitterly, but her right hand held tight to the cord, just as Nigel had told her. In her left hand she gripped the ship's chronometer and watched it through her tears, waiting for the exact moment to pull.
        - id: ch04-b09
          speaker: narrator
          text: Nigel ran on across the sand, with the dragon behind him. The tide was at its lowest, and sleepy little waves touched the edge of the beach. At the water's lip, Nigel stopped and looked back. The dragon sprang. It began another scream of rage, one loud enough for every railway engine in England. But the second half of that scream never came.
        - id: ch04-b10
          speaker: narrator
          text: Suddenly the dragon knew it was sleepy. It turned toward dry land because falling asleep near whirlpools is very unsafe. Sleep caught it before it reached shore and changed it into stone. Nigel saw what had happened and ran for his life. The tide swept in. The whirlpools were almost awake. He stumbled, waded, and swam while the Princess pulled with all her strength. She hauled him onto the dry shelf of rock just as the great sea rushed back and became a girdle of Nine Whirlpools around the island once more.
        - id: ch04-b11
          speaker: narrator
          text: The stone dragon slept beneath the whirlpools. When its sleep ended, it woke only to find itself drowned. That was the end of the dragon.
        - id: ch04-b12
          speaker: nigel
          text: Now we have only the griffin to face.
        - id: ch04-b13
          speaker: princess
          text: Yes. Only the griffin.
        - id: ch04-b14
          speaker: narrator
          text: She kissed Nigel, then returned to sew the last leaf of the last lily onto the front of her wedding gown. Again and again she thought about the words saying the griffin was artificial. The next day, she came to Nigel with an idea.
        - id: ch04-b15
          speaker: princess
          text: A griffin is half lion and half eagle. If the other two halves joined together, they would make a leo-griff, though I have never seen one. Still, I think I know what we can do.
        - id: ch04-b16
          speaker: narrator
          text: They talked it through and prepared everything. At teatime that afternoon, the griffin fell asleep. Nigel crept behind it and stepped on its tail. At that very instant, the Princess shouted.
        - id: ch04-b17
          speaker: princess
          text: Look out! There is a lion behind you!
        - id: ch04-b18
          speaker: narrator
          text: The griffin woke from its dreams and twisted its great neck around to find the lion. It saw a lion's flank and drove its eagle beak into it. The King-enchanter had made the griffin artificially, and its two halves had never become comfortable with each other. The drowsy eagle half believed it was fighting a lion. The half-asleep lion part believed it was fighting an eagle.
        - id: ch04-b19
          speaker: narrator
          text: The griffin was too sleepy to pull itself together and remember what it was. It rolled over and over while one end fought the other. The eagle end pecked the lion end to death, and the lion end clawed the eagle end until it died. So the creature made from a lion and an eagle destroyed itself, exactly as though it had been made from Kilkenny cats.
        - id: ch04-b20
          speaker: princess
          text: Poor griffin. It kept the house so well. I always liked it better than the dragon. The griffin was not nearly so hot-tempered.
          emotion: sad
        - id: ch04-b21
          speaker: narrator
          text: A soft, silky rush sounded behind her. The Queen had slipped from her stone statue at the moment the griffin died, and now she hurried to gather her beloved daughter into her arms. The witch climbed slowly down from her pedestal. After standing still for so long, she felt rather stiff.
        - id: ch04-b22
          speaker: narrator
          text: They all explained everything to one another, over and over, as many times as was good for them. Then the former witch remembered one last problem.
        - id: ch04-b23
          speaker: witch
          text: But what are we to do about the whirlpools?
        - id: ch04-b24
          speaker: narrator
          text: Nigel admitted that he did not know.
        - id: ch04-b25
          speaker: witch
          text: I am no longer a witch. I am only a happy old woman, but there are still a few things I know. The enchanter-King made those whirlpools by letting nine drops of his blood fall into the sea. His blood was so wicked that the sea has struggled ever since to throw it out. That struggle makes the whirlpools. All you need to do is go onto the sand at low tide.
    - id: ch05
      title: The Smooth Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Nigel understood what the old woman meant. When low tide came, he walked out over the uncovered sand. In the hollow left by the first whirlpool, he found a great red ruby. It was the first drop of the wicked King's blood. On the following day, another whirlpool left another ruby in its sandy hollow. Nigel returned the next day and the next, collecting them one at a time until the ninth day. Once he had taken the ninth ruby from the sea, the last whirlpool vanished and the water lay as smooth as glass.
        - id: ch05-b02
          speaker: narrator
          text: Later, the nine rubies were put to use in farming. If someone wanted a field plowed, they only had to throw the rubies into it. The whole surface of the ground turned itself over in its eagerness to be rid of anything so wicked. By morning, the field would be as thoroughly plowed as any young man at Oxford. In that way, the wicked King managed to do some good after all.
        - id: ch05-b03
          speaker: narrator
          text: Once the sea was calm, ships arrived from near and far. They brought people eager to hear the wonderful story. A beautiful palace was built. Wearing her golden gown, the Princess married Nigel, and they all lived happily for as long as was good for them.
        - id: ch05-b04
          speaker: narrator
          text: The dragon still lies as a stone dragon on the sand. At low tide, little children climb over it and play around it. The pieces of the griffin were buried beneath the herb bed in the palace garden. It had been so good at housework, and it was not the griffin's fault that it had been badly made and given such poor work as keeping a lady away from her lover.
        - id: ch05-b05
          speaker: narrator
          text: No doubt you want to know what the Princess lived on through all those years while the dragon did the cooking. My dear, she lived on her income. A great many people would like to be able to do the same.
