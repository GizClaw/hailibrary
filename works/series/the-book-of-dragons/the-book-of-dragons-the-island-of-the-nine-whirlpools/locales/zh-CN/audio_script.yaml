audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 温柔真挚，忧惧中始终带着坚定
        timbre: 柔和明亮
        pace: 自然舒缓
        pitch: 中高音
    witch:
      display_name: 女巫
      tts:
        delivery: 世故直率，冷峻外表下藏着温情
        timbre: 低沉微哑
        pace: 从容
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 傲慢刻薄，怒气中透着阴险
        timbre: 粗硬低沉
        pace: 稍慢而有压迫感
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 善良坦率，年轻活泼，偶尔故作成熟
        timbre: 清亮柔美
        pace: 轻快自然
        pitch: 中高音
    captain:
      display_name: 船长
      tts:
        delivery: 老练谨慎，讲古时郑重而带敬畏
        timbre: 浑厚沧桑
        pace: 沉稳
        pitch: 低音
    nigel:
      display_name: 奈杰尔
      tts:
        delivery: 真诚勇敢，遇事认真，带着年轻人的热烈
        timbre: 清朗坚实
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 九大漩涡岛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            通往女巫洞穴的拱门黑黢黢的，上面垂着一圈黄黑相间的活蛇，活像一道流苏。王后小心地从正中间走进去，那些蛇全抬起扁扁的脑袋，用黄色的眼睛恶狠狠地瞪着她。盯着别人看很没礼貌，哪怕看的是王室中人也一样，当然，猫不算。可这些蛇从小就没人好好教过，竟然还对可怜的王后吐出又细又尖的舌头，实在讨厌。
        - id: ch01-b02
          speaker: narrator
          text: >-
            王后的丈夫就是国王。他不只统治一个国家，还是同行中数一数二的魔法师，懂得很多。他知道，国王和王后想要孩子，王后就得去见女巫，于是把地址交给了她。王后怕得要命，也一点儿不想去，可还是来了。女巫正坐在柴火边，搅着一口亮闪闪的铜锅，锅里的东西咕嘟咕嘟冒着泡。
        - id: ch01-b03
          speaker: witch
          text: 亲爱的，你来想要什么？
        - id: ch01-b04
          speaker: queen
          text: 我想要一个小宝宝，一个特别可爱的小宝宝。花多少钱都没关系。我丈夫说……
        - id: ch01-b05
          speaker: witch
          text: 哦，他的事我全知道。你是想要一个孩子，对吧？可你知不知道，这个孩子以后会叫你伤心？
        - id: ch01-b06
          speaker: queen
          text: 可她会先带给我快乐。
        - id: ch01-b07
          speaker: witch
          text: 会是很大的悲伤。
        - id: ch01-b08
          speaker: queen
          text: 那我就会先得到更大的快乐。
        - id: ch01-b09
          speaker: witch
          text: 好吧，随你。我想，你要是空手回去，只怕连王后也做不成了吧？
        - id: ch01-b10
          speaker: queen
          text: 国王一定会大发脾气的。
          emotion: fearful
        - id: ch01-b11
          speaker: witch
          text: 好吧，好吧。为了这个孩子，你愿意拿什么来换？
        - id: ch01-b12
          speaker: queen
          text: 你想要什么，我都愿意给。所有东西都可以。
        - id: ch01-b13
          speaker: witch
          text: 那就先给我你的金王冠，再给我蓝宝石项链、珍珠手镯和红宝石搭扣。把胸前的百合花也给我。还有你那双亮闪闪的小鞋，把鞋扣里的钻石取下来。
        - id: ch01-b14
          speaker: narrator
          text: >-
            王后立刻摘下王冠，又解下项链、手镯和搭扣，把百合花拢在一起，最后脱下了鞋。女巫搅了搅锅，依次扔进金王冠、蓝宝石项链、珍珠手镯、红宝石搭扣、鞋扣上的钻石，最后才放入百合花。
        - id: ch01-b15
          speaker: narrator
          text: >-
            锅里一下子沸腾了，黄、蓝、红、白、银五种颜色的泡沫和亮光不断翻涌，还飘出一股甜香。过了一会儿，女巫把锅里的东西倒进罐子，放到门口那群蛇中间晾凉。
        - id: ch01-b16
          speaker: witch
          text: >-
            你的孩子会有金王冠一样灿烂的头发，蓝宝石一样湛蓝的眼睛。她的嘴唇会像红宝石那么红，皮肤会像珍珠那么洁白清润。她会有百合一样纯白芬芳的心，也会有钻石一样澄澈透亮的才智。
        - id: ch01-b17
          speaker: queen
          text: 太谢谢你了！我什么时候能见到这个孩子？
          emotion: happy
        - id: ch01-b18
          speaker: witch
          text: 你一回家就能见到她。
        - id: ch01-b19
          speaker: queen
          text: 那你自己呢？总该让我送你一点合心意的东西。一个国家，或者一袋珠宝，你想要吗？
        - id: ch01-b20
          speaker: witch
          text: 不必了，谢谢。我一天造出来的钻石，比我一年戴得完的还多。
        - id: ch01-b21
          speaker: queen
          text: 可你一定得让我为你做点什么。你是不是做女巫做腻了？想不想当公爵夫人、公主，或者别的什么？
        - id: ch01-b22
          speaker: witch
          text: 我倒真想要一样东西，可我们这一行的人很难得到它。我希望有人爱我。
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: 王后马上搂住女巫的脖子，一口气亲了她五十下。
        - id: ch01-b24
          speaker: queen
          text: 怎么会没有人爱你？我爱你胜过自己的性命！你把宝宝送给了我，她也会爱你的。
        - id: ch01-b25
          speaker: witch
          text: >-
            也许吧。等悲伤真的来了，就叫我。你给我的五十个吻，每一个都会变成召我过去的咒语。现在乖乖喝下这罐药，快回家吧。
        - id: ch01-b26
          speaker: narrator
          text: >-
            王后喝下已经凉透的药，从蛇流苏下面走了出去。那些蛇忽然规矩得像主日学校里的好孩子。有几条甚至想屈膝行礼，可它们用尾巴倒挂着，行礼实在很难。不过它们知道王后已经是女主人的朋友，当然要尽力客气一点。
        - id: ch01-b27
          speaker: narrator
          text: >-
            王后回到家，果然看见一个宝宝躺在画着王室徽章的摇篮里，哭得和天下所有宝宝一样自然。宝宝袖子上系着粉红丝带，王后一眼就看出，这是个女孩。国王听说以后，气得直揪自己的黑头发。
        - id: ch01-b28
          speaker: king
          text: >-
            你这个糊涂王后！我怎么没娶一个聪明的妻子？我费了那么多事，花了那么多钱，难道是让你从女巫那里带个女孩回来吗？我要的是男孩，是继承人，是王子！他将来要学会我的全部魔法，再接管王国。我敢拿一顶王冠打赌，就拿我自己的王冠。你根本没告诉女巫，你要哪一种孩子，对不对？
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: 王后低下头，只好承认，她确实只说自己想要一个孩子。
        - id: ch01-b30
          speaker: king
          text: 很好，夫人，那就照你的愿望来吧。趁女儿还小，你尽管好好疼她。
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: >-
            王后真的这样做了。她把一生所有的幸福加在一起，也抵不上抱着小宝宝时的每一刻。年复一年，国王的魔法越来越厉害，在家里的脾气也越来越坏。公主却一天比一天美，也一天比一天招人疼爱。
        - id: ch01-b32
          speaker: narrator
          text: >-
            公主十八岁生日那天，她和王后坐在庭院的喷泉旁，把生日蛋糕的碎屑喂给金鱼。国王走了进来，脸色阴沉得像一团雷雨云，黑乌鸦在他身后一蹦一跳。他朝妻子和女儿挥起拳头。其实他差不多每次见到她们都这样，在家里实在没什么好举止。乌鸦停在大理石池边，伸嘴去啄金鱼。它能用来表示自己和主人一样坏脾气的办法，也只有这个了。
        - id: ch01-b33
          speaker: king
          text: >-
            偏偏是个女孩！你明明知道，是你的愚蠢坏了我的大事，居然还敢抬头看我。我真不明白你怎么敢！
          emotion: angry
        - id: ch01-b34
          speaker: princess
          text: 你不该这样跟我母亲说话。
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: >-
            公主已经十八岁了。就在这一刻，她忽然明白自己长大了，于是勇敢地把这句话说了出来。国王气得说不出话，好几分钟都没找回声音。王后却因为害怕，显得很生气。
        - id: ch01-b36
          speaker: queen
          text: 好孩子，别插嘴。亲爱的，你为什么总为这件事烦恼呢？女儿的确不是男孩，可她可以嫁给一个聪明人呀。那个人以后能接管王国，你想教他多少魔法，他就能学多少。
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: 国王终于又能开口了。
        - id: ch01-b38
          speaker: king
          text: >-
            她要结婚的话，丈夫可非得是一个非常聪明的人。对，聪明得不得了！而且他必须懂很多魔法，比我肯教给他的还要多得多。
        - id: ch01-b39
          speaker: narrator
          text: 王后一听这个语气，就知道国王又在打坏主意。
        - id: ch01-b40
          speaker: queen
          text: 求你了，别因为孩子爱母亲就惩罚她。
          emotion: fearful
        - id: ch01-b41
          speaker: king
          text: 我不是为这件事惩罚她。我只是要教她尊敬自己的父亲。
        - id: ch01-b42
          speaker: narrator
          text: >-
            国王说完，悄悄回到实验室，忙了整整一夜。他把各种颜色的东西放进坩埚里煮，又从一本本发黄的棕色旧书里抄下咒语。书页长满霉斑，咒语的字也弯弯扭扭，古怪得很。
        - id: ch01-b43
          speaker: narrator
          text: >-
            第二天，一切都安排好了。国王把可怜的公主带到一座孤塔。塔立在海上的小岛上，不管从哪里出发，都离它足足一千英里。他给公主一份嫁妆，又替她安排了一笔丰厚的年金。他雇来一条能干的龙看守她，还雇了一只十分体面的狮鹫。狮鹫的身世怎么样，受过什么教养，国王全都查得清清楚楚。
        - id: ch01-b44
          speaker: king
          text: >-
            我亲爱的、懂得尊敬父亲的女儿，你就留在这里，等那个聪明人来娶你。他得有本事驾船穿过岛外的九大漩涡，还要杀死龙和狮鹫。在他来以前，你不会变老，也不会再聪明一点儿。他想必很快就到。你可以绣绣婚纱，打发时间。祝你幸福，我的孝顺女儿。
        - id: ch01-b45
          speaker: narrator
          text: >-
            国王登上由活雷电拉动的马车。雷电跑得飞快，马车升到空中，转眼就消失了。可怜的公主和龙、狮鹫一起，被留在了九大漩涡岛。
        - id: ch01-b46
          speaker: narrator
          text: >-
            王后独自在家哭了一天一夜，终于想起女巫，便把她召来，将所有事情都说了一遍。
        - id: ch01-b47
          speaker: witch
          text: >-
            看在你给我的两乘二十五个吻的分上，我会帮你。不过这是我最后能做的一件事，而且也帮不了太多。你女儿中了魔法。我能带你去见她，可那么一来，你就得变成石头，一直等到她身上的魔法解除。
        - id: ch01-b48
          speaker: queen
          text: 就算要做一千年的石头，我也愿意。只要一千年后，我还能再见到我的宝贝。
        - id: ch01-b49
          speaker: narrator
          text: >-
            女巫让王后坐上一辆由活阳光拉动的马车。阳光比世上任何东西都快，比雷电还要快。她们飞呀飞，一直飞到九大漩涡岛的孤塔。公主正坐在塔里最好的房间中，哭得心都要碎了。龙和狮鹫一本正经地守在她两旁。
        - id: ch01-b50
          speaker: princess
          text: 母亲！母亲！母亲！
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: 公主紧紧搂着王后的脖子，仿佛永远也不肯放开。三个人一起哭了很久。
        - id: ch01-b52
          speaker: witch
          text: >-
            好了，我还能替你们做一两件小事。时间不会再让公主伤心。来救她的人出现以前，每一天都会像同一天。至于你和我，亲爱的王后，我们会变成石像，坐在塔门两边。这件事做完，我就会失去全部法力。念出把你变成石头的咒语时，我也会一起变成石头。要是有一天我们能出来，我便不再是女巫，只是一个幸福的老太太。
        - id: ch01-b53
          speaker: narrator
          text: >-
            三个人亲了又亲。女巫念出咒语，塔门两边立刻各坐了一位石头夫人。一位戴着石王冠，拿着石权杖。另一位捧着一块刻了字的石板。狮鹫和龙虽然都受过很好的教育，却谁也读不懂那些字。
        - id: ch01-b54
          speaker: narrator
          text: >-
            从此以后，公主觉得每一天都和同一天一样，明天也永远像母亲会走出石头、再次亲吻她的那一天。岁月慢慢过去。邪恶的国王死了，别人夺走了他的王国，世上许多事都变了。只有小岛、九大漩涡、狮鹫、龙和两位石头夫人一成不变。
        - id: ch01-b55
          speaker: narrator
          text: >-
            从最初那天开始，公主获救的日子就一直在路上，慢慢爬得越来越近，又越来越近。除了公主，谁也看不见它，而公主也只有在梦里才见过。十年、百年不断流过，九大漩涡仍在岛边打转，用胜利的吼声讲着一艘又一艘好船怎样被它们卷进海底。每条船上都有一位王子，想赢得公主和她的嫁妆。
        - id: ch01-b56
          speaker: narrator
          text: >-
            大海还知道另外一些王子的故事。他们远道而来，一看见漩涡，就摇摇聪明的年轻脑袋，说一声“掉头”，再小心地回到自己舒适、安全又可爱的王国。可是，那个真会来救公主的人，他的故事还没人讲过。岁月仍在流逝。
        - id: ch01-b57
          speaker: narrator
          text: >-
            后来又过去许多个二十年，多得你绝不会愿意拿石板一笔笔加起来。有个水手少年跟着叔叔在海上航行，叔叔是一位经验丰富的船长。少年会收帆，会盘缆绳，也能迎着风稳稳把住船头。他实在是个难得的好孩子，就算连续找上一个月的星期日，也未必能再找到一个，完全配得上做王子。
        - id: ch01-b58
          speaker: narrator
          text: >-
            世上有一个“什么东西”，比整个世界都聪明。它知道谁配得上成为王子。这个“什么东西”从第七重世界的另一边赶来，在少年耳边轻轻说了一句话。少年听见了，却不知道自己听见了。他望着黑色的大海，白色浪沫像骏马一样在海面飞奔。远处亮着一盏灯。
        - id: ch01-b59
          speaker: nigel
          text: 叔叔，那边是什么灯？
        - id: ch01-b60
          speaker: captain
          text: >-
            愿世上一切善良的力量保护你，奈杰尔，千万别驶近那盏灯。不是每张海图都画着它，可我掌舵用的那张古海图上有。那张图是我祖父的祖父留下的，而他也是从自己的祖父的祖父那里得来的。灯光来自九大漩涡之上的孤塔。我的祖父还年轻时，听他那位老得不能再老的曾祖父说，塔里有个中了魔法的公主，美得像白昼，等着有人去救。可她不会得救。所以别往那边掌舵，也别再想她。公主只是无稽之谈，那些漩涡却是真的。
        - id: ch01-b61
          speaker: narrator
          text: >-
            从那一天起，奈杰尔心里自然再也容不下别的事。他在海上东来西往，常常看见那盏灯越过疯狂旋转的漩涡，远远照到海面上。一天夜里，大船抛了锚，船长在铺位上睡熟了。奈杰尔放下一只小艇，独自划过黑暗的大海，向灯光驶去。天亮以前，他没敢靠得太近。他得先看清那些可怕的漩涡到底是什么样。
        - id: ch01-b62
          speaker: narrator
          text: >-
            黎明时，孤塔黑沉沉地立在东方粉红和淡黄的晨光前。塔脚下的黑水阴沉地盘旋，发出惊人的轰鸣。奈杰尔在远处来回航行，先观察了整整一天，接着又一连观察六天。看满七天以后，他终于弄明白了一件事。只要把全部心思放在一件事上，认真研究整整七天，总能弄懂一点儿，哪怕那件事只是第一变格、九九乘法表，或者诺曼诸王的在位年份。
        - id: ch01-b63
          speaker: narrator
          text: >-
            一天有一千四百四十分钟。其中有五分钟，漩涡会安静下来，潮水也会退去，露出黄色沙滩。这每天都会发生，只是一天比一天早五分钟。奈杰尔特意带着船上的航海钟，把时间查得清清楚楚。
        - id: ch01-b64
          speaker: narrator
          text: >-
            第八天，离正午还差五分钟时，奈杰尔准备好了。漩涡突然停住，潮水像漏底盆里的水一样飞快退去。他紧握双桨，使足力气划，很快就让小艇冲上了黄沙。他把船拖进一个洞穴，坐下等待。
        - id: ch01-b65
          speaker: narrator
          text: >-
            正午过后五分零一秒，漩涡又黑沉沉地转动起来。奈杰尔从洞里探出头，看见临海的岩台上站着一位美如白昼的公主。她金发灿烂，穿着一条绿裙子。奈杰尔走出去迎接她。
        - id: ch01-b66
          speaker: nigel
          text: 我是来救你的。你真可爱，也真美！
          emotion: happy
        - id: ch01-b67
          speaker: princess
          text: 你也很善良，很聪明，也很可爱。
          emotion: happy
        - id: ch01-b68
          speaker: narrator
          text: 公主微笑着把两只手都交给他。奈杰尔在她的每只手心里各藏下一个小小的吻，这才放开。
        - id: ch01-b69
          speaker: nigel
          text: 下次退潮时，我就划小艇带你走。
        - id: ch01-b70
          speaker: princess
          text: 可是，龙和狮鹫怎么办？
        - id: ch01-b71
          speaker: nigel
          text: 哎呀，我不知道这里还有它们。也许我可以把它们杀死？
          emotion: surprised
        - id: ch01-b72
          speaker: princess
          text: 别说傻话了。你没有剑，没有盾，什么武器都没带！
        - id: ch01-b73
          speaker: narrator
          text: 公主故意摆出一副很成熟的样子。她在岛上待了不知多少年，可她还是十八岁，也还是喜欢装成大人。
        - id: ch01-b74
          speaker: nigel
          text: 那么，这两只野兽从来都不睡觉吗？
        - id: ch01-b75
          speaker: princess
          text: >-
            它们当然睡，不过二十四小时里只睡一次。龙睡着以后会变成石头，狮鹫却会做梦。狮鹫每天下午茶的时候睡。龙一天只睡五分钟，而且一天比一天晚三分钟。
        - id: ch01-b76
          speaker: nigel
          text: 龙今天几点睡？
        - id: ch01-b77
          speaker: princess
          text: 十一点。
        - id: ch01-b78
          speaker: nigel
          text: 你会算术吗？
        - id: ch01-b79
          speaker: princess
          text: 不会，我的算术一直都学不好。
          emotion: sad
        - id: ch01-b80
          speaker: nigel
          text: 那就只能让我来算了。我会算，可算得很慢，而且每次算都很痛苦。恐怕要算上许多天。
        - id: ch01-b81
          speaker: princess
          text: 先别算。等我不在你身边的时候，你有的是时间痛苦。现在先把你的事情全讲给我听吧。
        - id: ch01-b82
          speaker: narrator
          text: 奈杰尔把自己的经历说了出来，公主也把她的故事从头到尾告诉了他。
        - id: ch01-b83
          speaker: princess
          text: >-
            我知道自己在这里待了很久，可我根本不知道时间是什么。我一直在一件金色婚纱上绣丝线花。狮鹫做家务，它的翅膀全是羽毛，扫地掸灰方便得很。龙负责做饭，它肚子里那么热，做起饭来一点儿也不费事。我虽然不懂时间，却知道婚礼的日子到了。婚纱只差袖子上最后一朵白雏菊，还有胸前的一朵百合。绣完它们，整件婚纱就做好了。
        - id: ch01-b84
          speaker: narrator
          text: 就在这时，头顶的岩石上传来干巴巴的摩擦声和一声喷鼻息。
        - id: ch01-b85
          speaker: princess
          text: 是龙来了。再见。做个好孩子，把那道算术题算完。
        - id: ch01-b86
          speaker: narrator
          text: 公主匆匆跑开了，只留下奈杰尔一个人算题。
        - id: ch01-b87
          speaker: narrator
          text: >-
            题目是这样的。漩涡每二十四小时停一次，潮水也同时退去，而且每天都比前一天早五分钟。龙也是每天睡一次，却每天晚睡三分钟。那么，再过多少天，潮水会在当天龙睡着的前三分钟退去？
        - id: ch01-b88
          speaker: narrator
          text: >-
            你看，这道题简单极了。你上过好学校，功课又肯用心，大概一分钟就能解开。可怜的奈杰尔可不一样。他拿粉笔在一块光滑的石头上演算，先后用过实算法、归一法、乘法和三又四分之三比例法。他又试小数、复利、平方根、立方根，还试了简单加法、不那么简单的加法和普通分数的混合运算，全都没用。
        - id: ch01-b89
          speaker: narrator
          text: >-
            他接着改用代数，又试了一次方程、二次方程、三角学、对数和圆锥曲线，还是不行。其实他每次都得到了一个答案，可每次的答案都不同，他不知道哪一个才对。就在他深深体会到学会算术比世上什么都重要时，公主回来了，天色已经渐渐暗了。
        - id: ch01-b90
          speaker: princess
          text: >-
            哎呀，你算了整整七个小时，怎么还没算完？你看看这个。这是塔门旁那座石像手里石板上的字，里面有数字，说不定就是答案。
          emotion: surprised
        - id: ch01-b91
          speaker: narrator
          text: >-
            她递来一片宽大的白玉兰叶。她用珍珠胸针的针尖把字刻在上面，玉兰叶一被划过，痕迹就变成褐色。奈杰尔念了出来。
        - id: ch01-b92
          speaker: nigel
          text: >-
            九天以后。潮水，二时二十四分。龙，二时二十七分。答案。又及，狮鹫是人造的。王后。
        - id: ch01-b93
          speaker: narrator
          text: 奈杰尔轻轻拍起手来。
        - id: ch01-b94
          speaker: nigel
          text: >-
            亲爱的公主，这答案肯定没错。你看，后面还有王后的署名。不过，我还是倒过来验算一次吧。
          emotion: happy
        - id: ch01-b95
          speaker: narrator
          text: >-
            他立刻用小数、方程、圆锥曲线，还有所有能想到的法则重新计算。无论用哪一种方法，这回都得到了正确答案。
        - id: ch01-b96
          speaker: nigel
          text: 那我们现在只要等着就行。
        - id: ch01-b97
          speaker: narrator
          text: >-
            于是他们等了起来。公主每天来看奈杰尔，还给他带来龙做的饭。奈杰尔住在洞穴里，公主来时就跟她说话，她不在时就想念她。两个人快活得像夏天里最长的那一天。终于，约定的日子到了。他们把一切都安排妥当。
        - id: ch01-b98
          speaker: nigel
          text: 我唯一的珍宝，你确定它不会伤害你吗？
        - id: ch01-b99
          speaker: princess
          text: 我确定。我只希望自己也能有一半的把握，知道它不会伤害你。
        - id: ch01-b100
          speaker: nigel
          text: >-
            我的公主，有两股伟大的力量在帮助我们。一股是爱的力量，另一股是算术的力量。它们比世上任何东西都强大。
          emotion: calm
        - id: ch01-b101
          speaker: narrator
          text: >-
            潮水开始后退，奈杰尔和公主跑上沙滩。就在龙放哨的露台下面，也就在龙眼前，奈杰尔搂住公主，吻了她。狮鹫正忙着打扫孤塔的楼梯，龙却看得清清楚楚。它发出一声怒吼，仿佛坎农街车站里二十台蒸汽机车同时放汽。
        - id: ch01-b102
          speaker: narrator
          text: >-
            两个相爱的人站在下面，抬头看着龙。那条龙可怕极了。它的脑袋老得雪白，胡子长到走路时会绊住自己的爪子。海浪的泡沫冻在两翼上，结成盐霜，把翅膀也染白了。它的尾巴粗壮、修长，一节连一节，白森森的，上面长着数不清的小腿，活像一条硕大肥胖的蚕。它的爪子像学校功课那么长，也像刺刀那么尖。
        - id: ch01-b103
          speaker: nigel
          text: 再见了，亲爱的！
        - id: ch01-b104
          speaker: narrator
          text: >-
            奈杰尔高喊着冲过黄沙，朝大海跑去，一根绳子的一头牢牢系在他的手臂上。龙从悬崖上往下爬，转眼就到了海滩。它又爬又扭，又扑又蠕动，紧追在奈杰尔身后。沉重的脚每落下一次，就在沙地上踩出一个大坑。尾巴最后一截没有腿，只能一路拖过沙面，留下的痕迹就像人们把船推下水时划出的深沟。
        - id: ch01-b105
          speaker: narrator
          text: >-
            龙不停喷火，湿沙嘶嘶作响，小岩池里的水全吓得化成蒸汽逃走了。奈杰尔仍然朝前跑，龙仍然在后面追。蒸汽遮住了一切，公主什么也看不见，只能伤心地哭。可她的右手始终紧抓绳子的另一端，因为奈杰尔吩咐过，绝不能松手。她的左手举着航海钟，隔着眼泪盯紧时间，因为奈杰尔也嘱咐过她，到了时刻就要拉绳子。
        - id: ch01-b106
          speaker: narrator
          text: >-
            奈杰尔继续跑，龙继续追。潮水已经完全退去，一排困倦的小浪轻轻舔着沙滩的边缘。到了水边，奈杰尔忽然停住，回头望去。龙朝他扑来，刚吼出半声，那声音像全英格兰所有铁路的所有机车同时咆哮。可这声怒吼没能发完。
        - id: ch01-b107
          speaker: narrator
          text: >-
            龙突然觉得困了，连忙转身，想赶回干燥的陆地。它知道，在漩涡旁边睡觉太危险。可它还没回到岸上，睡意已经抓住它，把它变成石头。奈杰尔拼命往岸边跑。潮水开始上涨，漩涡也快醒了。他跌跌撞撞地蹚水，接着游了起来。公主用尽全身力气拉动绳子。大海轰然涌回，重新化作环绕小岛的九大漩涡。就在那一刻，她终于把奈杰尔拉上干燥的岩台。
        - id: ch01-b108
          speaker: narrator
          text: 龙在漩涡底下沉睡。等它从梦中醒来，才发现自己已经淹死了。龙的故事到这里就结束了。
        - id: ch01-b109
          speaker: nigel
          text: 现在只剩下狮鹫了。
        - id: ch01-b110
          speaker: princess
          text: 是的，只剩下……
        - id: ch01-b111
          speaker: narrator
          text: >-
            公主吻了奈杰尔，然后回去把婚纱胸前那朵百合的最后一片叶子绣好。她想来想去，一直琢磨石板上那句“狮鹫是人造的”。第二天，她又来见奈杰尔。
        - id: ch01-b112
          speaker: princess
          text: >-
            你知道，狮鹫一半是狮子，一半是鹰。剩下的两半要是拼在一起，就会成为鹰狮。可是我从来没见过鹰狮。不过，我想到办法了。
        - id: ch01-b113
          speaker: narrator
          text: 两个人商量了一番，把一切安排好。到了下午茶时间，狮鹫睡着了。奈杰尔悄悄走到它身后，一脚踩住了它的尾巴。公主同时大喊起来。
        - id: ch01-b114
          speaker: princess
          text: 小心！你背后有一头狮子！
        - id: ch01-b115
          speaker: narrator
          text: >-
            狮鹫猛然从梦中惊醒，扭过长长的脖子去找狮子。它只看到一片狮子的腰腹，立刻用鹰嘴狠狠啄了下去。原来，这只狮鹫是魔法师国王亲手造出来的，两半身体从来没有真正习惯彼此。
        - id: ch01-b116
          speaker: narrator
          text: >-
            此刻，狮鹫的鹰身还迷迷糊糊，以为自己正在跟狮子搏斗。狮身也半睡半醒，以为自己在和老鹰打架。整只狮鹫困得昏头昏脑，根本没法把自己合在一起想一想，也没想起自己究竟是用什么造出来的。
        - id: ch01-b117
          speaker: narrator
          text: >-
            它倒在地上翻来滚去，一头和另一头拼命厮打。鹰的那一半只顾用嘴猛啄，狮子的那一半只顾挥动利爪。最后，鹰身啄死了狮身，狮身也用爪子撕死了鹰身。这只用狮子和鹰拼出来的狮鹫就这样丢了性命，结局和两只基尔肯尼猫拼成的东西一模一样。
        - id: ch01-b118
          speaker: princess
          text: >-
            可怜的狮鹫。它做家务很能干。我一直比较喜欢它，不太喜欢龙。至少它的脾气没有那么火爆。
          emotion: sad
        - id: ch01-b119
          speaker: narrator
          text: >-
            就在这时，公主身后响起丝绸一样轻柔的窸窣声。她的母亲王后正站在那里。狮鹫一死，王后就从石像里滑了出来。她急匆匆赶来，把心爱的女儿抱进怀里。女巫也慢慢从自己的石座上爬下来。站了这么久，她的身子有些僵硬。
        - id: ch01-b120
          speaker: narrator
          text: 她们把各自经历的事讲了一遍又一遍，一直讲到再讲下去也没有什么好处。女巫这才问道。
        - id: ch01-b121
          speaker: witch
          text: 可是，那些漩涡怎么办？
        - id: ch01-b122
          speaker: narrator
          text: 奈杰尔说，他不知道。女巫便把自己知道的事告诉了他们。
        - id: ch01-b123
          speaker: witch
          text: >-
            我现在已经不是女巫，只是一个幸福的老太太。不过我还知道一些事。这些漩涡是魔法师国王造的。他把自己的九滴血滴进海里。那血实在太邪恶，大海从此一直想把它赶出去，所以才有了九大漩涡。你们现在只需要等退潮，然后走出去。
        - id: ch01-b124
          speaker: narrator
          text: >-
            奈杰尔明白该怎么做了。退潮时，他走到外面，在第一个漩涡留下的沙坑里找到了一颗硕大的红宝石。那就是邪恶国王的第一滴血。第二天他又找到一颗，第三天再找到一颗。这样一直找下去，到第九天，海面终于平滑得像玻璃。
        - id: ch01-b125
          speaker: narrator
          text: >-
            后来，那九颗红宝石被用来种田。要犁一块地，只要把它们扔进去。土地为了赶走这些邪恶的东西，会急得自己翻过来。第二天早晨，人们会发现整片田已经犁得彻彻底底，就像牛津大学任何一个年轻人喝醉时那么彻底。这样一来，邪恶的国王总算还是做了一件好事。
        - id: ch01-b126
          speaker: narrator
          text: >-
            海面平静以后，船从四面八方驶来，人们都想听这个奇妙的故事。岛上建起一座美丽的宫殿。公主穿着那件金色婚纱，嫁给了奈杰尔。只要幸福对他们还有好处，他们就一直幸福地生活下去。
        - id: ch01-b127
          speaker: narrator
          text: >-
            那条龙至今还躺在沙滩上，是一条石头龙。退潮时，孩子们会在它身边和身上玩耍。狮鹫的碎片被埋在宫殿花园的香草苗圃下面，因为它一直很会做家务。它被造得那么糟，又被派去看守姑娘，不让情人靠近。这份差劲的差事可不是它的错。
        - id: ch01-b128
          speaker: narrator
          text: >-
            我一点儿也不怀疑，你一定想知道，在那漫长的岁月里，既然始终是龙做饭，公主到底靠什么生活。亲爱的，她靠自己的年金生活。世上有许多人，都巴不得自己也能做到这一点。
