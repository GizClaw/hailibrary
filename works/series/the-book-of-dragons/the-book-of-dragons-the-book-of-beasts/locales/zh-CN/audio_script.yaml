audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着一本正经的幽默感
        timbre: 清澈温润
        pace: 舒缓而富有变化
        pitch: 中音
    lionel:
      display_name: 莱昂内尔
      tts:
        delivery: 天真直率，好奇心旺盛，遇事认真
        timbre: 清亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    nurse:
      display_name: 奶妈
      tts:
        delivery: 亲昵而严厉，说话爽快实在
        timbre: 温厚结实
        pace: 稳健利落
        pitch: 中低音
    prime_minister:
      display_name: 首相
      tts:
        delivery: 恭敬谨慎，偶尔流露夸张的郑重
        timbre: 圆润沉稳
        pace: 从容适中
        pitch: 中音
    chancellor:
      display_name: 大法官
      tts:
        delivery: 古板严肃，着急时仍保持官腔
        timbre: 略显粗哑
        pace: 稍慢而清楚
        pitch: 中低音
    citizen_1:
      display_name: 臣民甲
      tts:
        delivery: 直爽而爱发议论
        timbre: 明亮朴实
        pace: 适中
        pitch: 中音
    citizen_2:
      display_name: 臣民乙
      tts:
        delivery: 认真而随众
        timbre: 柔和清楚
        pace: 适中
        pitch: 中高音
    citizen_3:
      display_name: 臣民丙
      tts:
        delivery: 略带抱怨，语气干脆
        timbre: 厚实清晰
        pace: 适中
        pitch: 中低音
    manticora:
      display_name: 蝎尾狮
      tts:
        delivery: 怯懦含糊，竭力避开麻烦
        timbre: 细弱带鼻音
        pace: 稍慢
        pitch: 中高音
    hippogriff:
      display_name: 骏鹰
      tts:
        delivery: 温柔谦逊，沉静而可靠
        timbre: 柔和明净
        pace: 从容
        pitch: 中音
    rocking_horse:
      display_name: 木马
      tts:
        delivery: 老实谨慎，心有余悸
        timbre: 木质般温厚
        pace: 稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 小国王登基
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 消息传来时，莱昂内尔正在育儿室里用积木搭宫殿。他一听见楼下有人敲门说话，就把积木丢得满地都是，等着奶妈收拾。毕竟，这回的消息确实不同寻常。他原以为来的是煤气工。自从他把跳绳拴上煤气灯架荡过秋千，家里的煤气灯就再也不许点了，所以煤气工上门也很说得通。
        - id: ch01-b02
          speaker: nurse
          text: 亲爱的莱昂内尔少爷，人家来接你去当国王啦。
        - id: ch01-b03
          speaker: narrator
          text: 奶妈一刻也不耽搁，赶忙替他换下罩衫，又洗脸、洗手、梳头发。这些事一样接着一样，莱昂内尔也从头到尾扭个不停。一会儿央求奶妈别弄了，一会儿保证两只耳朵已经很干净，又说头发本来就很好，这样完全够了。
        - id: ch01-b04
          speaker: nurse
          text: 瞧你折腾成这样，不知道的还以为你要去做鳗鱼，不是去做国王呢。
        - id: ch01-b05
          speaker: narrator
          text: 奶妈的手刚一松开，莱昂内尔就跑了，连那条干净手绢都没等着拿。客厅里有两位神情庄重的先生，穿着镶毛皮的红袍，戴着金冠。冠顶中央的天鹅绒高高竖起，很像最昂贵的果酱馅饼上的那一撮奶油。两人朝他深深鞠躬，其中更严肃的那位告诉他，他那位隔了五个“高”字的祖父，也就是这个国家的国王，已经驾崩。如今必须请莱昂内尔跟他们走，因为现在轮到他做国王了。
        - id: ch01-b06
          speaker: lionel
          text: 好的，谢谢您。请问什么时候开始？
        - id: ch01-b07
          speaker: prime_minister
          text: 陛下今天下午就会加冕。
        - id: ch01-b08
          speaker: lionel
          text: 那我要带奶妈吗？你们几点接我？我是不是该换上那套有花边领子的天鹅绒衣服？
        - id: ch01-b09
          speaker: prime_minister
          text: 稍后会有人接奶妈进宫。衣服也不用换，王袍会把它全遮住。
        - id: ch01-b10
          speaker: narrator
          text: 两位先生走在前面，把莱昂内尔领到门外。那里已经停着一辆八匹白马拉的马车，就在沿街上坡时左手边的七号门前，也就是莱昂内尔一直住的那栋房子。临走前，他忽然又跑上楼亲了亲奶妈。他感谢奶妈替自己洗脸，只遗憾刚才没肯让她把另一只耳朵也洗干净。可现在已经没有时间了。他拿上那条干净手绢，向奶妈告别。
        - id: ch01-b11
          speaker: nurse
          text: 再见，小宝贝。要做个乖国王，记着说“请”和“谢谢”。吃点心时要把蛋糕递给小姑娘，不论什么东西，最多只添一回。
        - id: ch01-b12
          speaker: narrator
          text: 莱昂内尔就这样去当国王了。这件事对他十分新鲜，因为他从没料到自己会做国王，正如你也没料到自己会做国王。他甚至从来没想过这种事。马车穿过城镇时，他只好咬一咬舌头。舌头若是真的，便能证明自己没有做梦。半小时前，他还在育儿室里搭积木。此刻满街彩旗飞舞，窗口挤满挥手绢、撒鲜花的人。猩红制服的士兵沿着人行道一排排站好，所有教堂的钟都疯狂地响着。成千上万人的欢呼随着钟声汇成一支宏大的歌。
        - id: ch01-b13
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 莱昂内尔万岁！我们的小国王万岁！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 莱昂内尔起先有点后悔没穿最好的衣服，很快就忘了。若他是个女孩，多半会一路惦记。两位先生原来是首相和大法官，沿途替他解释不明白的事情。
        - id: ch01-b15
          speaker: lionel
          text: 我以为这里是共和国。我们不是已经很久没有国王了吗？
        - id: ch01-b16
          speaker: prime_minister
          text: 陛下，您的五世高祖去世时，我祖父还只是个孩子。从那以后，忠诚的臣民每星期按财力存一点钱，好给您买王冠。零花钱多的人出六便士，少的人出半便士。王冠必须由人民出钱，这是规矩。
        - id: ch01-b17
          speaker: lionel
          text: 可我那位不知道隔了多少个“高”字的祖父，自己没有王冠吗？
        - id: ch01-b18
          speaker: prime_minister
          text: 他有。不过他怕自己爱慕虚荣，就把王冠送去包锡，还拆下所有宝石，卖了钱买书。他是个很好的国王，只是太爱书。他临终前才把王冠送走，连锡匠的账单都没来得及付。
        - id: ch01-b19
          speaker: narrator
          text: 首相说着还擦去一滴眼泪。就在这时，马车停了，莱昂内尔被带去加冕。加冕远比你想象中辛苦。正式的仪式结束以后，他还得穿着沉重的王袍待上一两个小时。凡是职责规定必须亲吻国王手背的人，也都一个接一个地前来吻他的手。等这一切全做完，他已经累坏了。终于能走进宫里的育儿室时，他别提有多高兴。
        - id: ch01-b20
          speaker: narrator
          text: 奶妈已经等在那里，茶点也全都摆好了。桌上有香籽蛋糕、果干蛋糕、甜甜的果酱和刚烤好的热黄油吐司。茶具是他见过最好看的瓷器，上面开着红色、金色和蓝色的花。这里端上来的也不是给孩子敷衍用的饮料，而是真正的茶。莱昂内尔喜欢的话，想喝多少杯就能喝多少杯。
        - id: ch01-b21
          speaker: lionel
          text: 我想看一本书。奶妈，你替我拿来好吗？
        - id: ch01-b22
          speaker: nurse
          text: 老天保佑你。难道做了国王，两条腿就不能走啦？快自己拿书去。
    - id: ch02
      title: 从书里飞出的动物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 莱昂内尔只好自己下楼，走进图书室。首相和大法官正好都在。两人见他进来，赶紧深深鞠躬。接着，他们正要用最客气、最有礼貌的方式问一问，这位小国王到底为什么又跑来添麻烦，莱昂内尔已经被满屋的书惊呆了，根本没给他们开口的机会。
        - id: ch02-b02
          speaker: lionel
          text: 这么多书，简直装满了一个世界！它们都是你们的吗？
        - id: ch02-b03
          speaker: chancellor
          text: 书都是您的，陛下。原先它们属于先王，也就是您的那位高——
        - id: ch02-b04
          speaker: lionel
          text: 好啦，我知道。我会把这些书全读完。我喜欢读书，幸亏我学会了认字。
        - id: ch02-b05
          speaker: prime_minister
          text: 请容我劝陛下一句，最好别读这些书。您的那位高——
        - id: ch02-b06
          speaker: lionel
          text: 他怎么了？
        - id: ch02-b07
          speaker: prime_minister
          text: 他当然是位很好的国王，照他自己的方式来说，甚至好得出众。只不过，他稍微有那么一点古怪。
        - id: ch02-b08
          speaker: lionel
          text: 他疯了吗？
        - id: ch02-b09
          speaker: narrator
          text: 两位先生听了都大吃一惊，连忙否认。先王没有疯，只是聪明得过了头。他们可不愿自家的小国王碰那些书。莱昂内尔听得一脸困惑，大法官不安地拧着红胡子，终于说起真正的原因。
        - id: ch02-b10
          speaker: chancellor
          text: 人们都说，您的那位祖先是个魔法师。
        - id: ch02-b11
          speaker: lionel
          text: 可他其实不是，对吧？
        - id: ch02-b12
          speaker: chancellor
          text: 当然不是。他是一位最可敬的国王。不过换成我，绝不碰他的书。
        - id: ch02-b13
          speaker: narrator
          text: 莱昂内尔偏偏把双手放到书桌上的棕色大书上，说自己只看这一本。皮封面上有蜿蜒的金色花纹，四角也包着金，为的是不让皮面太快磨坏。金搭扣的纹路里还嵌着绿松石和红宝石。书脊上印着几个醒目的大字，书名是《百兽之书》。大法官叫他别做傻乎乎的小国王，可莱昂内尔哪里肯听，那两枚金搭扣已经让他打开了。
        - id: ch02-b14
          speaker: narrator
          text: 第一页画着一只红、棕、黄、蓝各色交映的蝴蝶，美得像真的一样。莱昂内尔刚夸了一句，蝴蝶就在泛黄的纸上扇起彩翼，飞出窗口。首相惊得喉咙发紧，好不容易才挤出一句话。
        - id: ch02-b15
          speaker: prime_minister
          text: 这就是魔法，错不了！
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: 可还没等首相把这句话说完，小国王已经翻开第二页。画中是一只光彩夺目的鸟，每一根蓝羽毛都画得完整又美丽，下面写着“蓝色极乐鸟”。莱昂内尔正看得入迷，蓝鸟也在泛黄的书页上抖开翅膀，从书中飞出了窗外。首相赶紧从他手里夺走书，合上那张已经空白的画页，再将整本书放到高高的架子上。大法官则抓住国王狠狠摇了一通，气得不得了。
        - id: ch02-b17
          speaker: chancellor
          text: 你这个淘气又不听话的小国王！
          emotion: angry
        - id: ch02-b18
          speaker: lionel
          text: 我又没觉得自己闯了祸。
        - id: ch02-b19
          speaker: narrator
          text: 莱昂内尔和所有男孩一样讨厌被人抓住摇晃，若让他自己挑，他宁愿挨上一巴掌。大法官却说，问题正是小国王根本不懂可能惹出什么祸。他怎能知道下一页画的不是蛇、虫子、蜈蚣、革命党，或者同样叫人头疼的别的东西？
        - id: ch02-b20
          speaker: lionel
          text: 要是我惹您生气了，那我道歉。来吧，我们亲一下，还是做好朋友。
        - id: ch02-b21
          speaker: narrator
          text: 他亲了首相一下，两人坐下来安安静静地玩画圈打叉，大法官则去加总账目。可到了夜里，莱昂内尔躺在床上，脑子里全是那本书。满月把四周照得通亮时，他悄悄起床，溜进图书室，爬上去取下《百兽之书》。
        - id: ch02-b22
          speaker: narrator
          text: 他把书拿到外面的露台上，那里被月光照得如同白昼。他打开书，看见蝴蝶和蓝鸟原来所在的两张画页都空了，只剩各自的名字。再往后翻，一团说不清是什么的红东西坐在棕榈树下，下面写着“龙”。那条龙并没有动，可莱昂内尔还是飞快地合上书，把它放回去，自己也回床上睡觉。
        - id: ch02-b23
          speaker: narrator
          text: 第二天，他到底还是想再看一次。他把书带进花园，解开镶有红宝石和绿松石的搭扣。书竟自己翻到红龙那一页，阳光也正好直直照在画面上。顷刻间，一条巨大的红龙冲出书页，张开宽阔的猩红翅膀，越过整座花园，朝远处的山岭飞去。莱昂内尔面前只剩空掉的画页。上面还有绿色棕榈、黄色沙漠，以及画笔当初涂出铅笔轮廓的几道细细红痕。
        - id: ch02-b24
          speaker: narrator
          text: 莱昂内尔这才真正明白自己干了什么。他做国王还不到二十四个小时，就已经把一条红龙放到外面，让它去折磨忠诚的臣民，把大家的日子搅得不得安宁。而这些人为了给他买那顶王冠，已经一星期又一星期地省钱，足足省了那么多年。想到这里，他忍不住哭了起来。
        - id: ch02-b25
          speaker: narrator
          text: 奶妈、首相和大法官全都跑来。他们一看书就明白了。大法官要奶妈把这个淘气的小国王送上床，叫他想想自己做过的事。首相却认为，眼下最好先问清楚，他到底放出了什么。
        - id: ch02-b26
          speaker: lionel
          text: 是一条红龙！它飞进山里去了。我真的后悔了，请你们原谅我吧！
          emotion: sad
        - id: ch02-b27
          speaker: narrator
          text: 两位大臣眼下有比原谅莱昂内尔更要紧的事。他们匆匆找警察商量，看看到底能想出什么办法。城里的每个人都尽力而为。有人坐着开委员会，有人站着守卫，还有人躺着埋伏。可是红龙始终留在山里，他们再也无计可施。奶妈也忠实地尽了职责，而且她做的说不定比谁都多。她打了国王的屁股，不让他喝茶，直接送他上床。天黑后，连一支供他看书的蜡烛也不给。
        - id: ch02-b28
          speaker: nurse
          text: 你是个淘气的小国王，再也没人会爱你了。
          emotion: angry
    - id: ch03
      title: 星期六的灾祸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，红龙仍没动静，只有诗意丰富的臣民声称，他们透过绿树看清了它身上的红光。莱昂内尔戴上王冠，坐到宝座上，决定制定法律。
        - id: ch03-b02
          speaker: narrator
          text: 私下里，首相、大法官和奶妈尽可以觉得莱昂内尔毫无判断力，还能打他屁股、罚他上床。可他只要坐上宝座，把王冠稳稳戴到头上，就立刻成了永远不会犯错的国王。他说的每一句话都一定正确，不可能有半点差错。他宣布，无论在学校还是其他任何地方，都不许打开书本。至少一半臣民真心支持，剩下那一半，也就是成年人，全都装出认为他完全正确的样子。
        - id: ch03-b03
          speaker: narrator
          text: 接下来，他又制定一条法律，规定每个人在任何时候都必须有足够的食物。除了那些从来吃得太多、如今反而受了限制的人，这条法律让所有人都很满意。等另外几条很不错的新法律也制定好，清清楚楚写到纸上，他便回去搭泥巴房子了。莱昂内尔玩得十分开心，也相信自己送给臣民这么多漂亮的法律，大家现在一定会爱他。
        - id: ch03-b04
          speaker: nurse
          text: 亲爱的，鸡还没孵出来，可别急着数。你和那条龙的事还远没有完。
        - id: ch03-b05
          speaker: narrator
          text: 第二天是星期六。到了下午，红龙带着一身可怕的赤红，从空中扑向公地，把足球运动员、裁判、球门柱和足球全抓走了。臣民气得不得了。
        - id: ch03-b06
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 早知道这样，还不如继续做共和国！我们攒了那么多年钱，连王冠都给他买了呀！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 聪明人摇头预言，全国人对体育的热爱就要衰退。果然，足球有一阵子变得很不受欢迎。接下来的一星期，莱昂内尔努力做个好国王，人们也渐渐肯原谅他了。
        - id: ch03-b08
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 足球本来就危险，劝大家少踢一点，说不定也是件明智的事。
        - id: ch03-b09
          speaker: narrator
          text: 大家普遍猜想，球员的身体练得又粗又硬，红龙吃起来一定很不合胃口，因此大概已经去了另一个地方。那里的人只玩翻花绳一类的游戏，身体不会被练得又粗又硬。不过议会仍在下一个星期六的下午开会，专门商量红龙的问题。这个时间选得很方便，因为大多数议员在星期六下午都有空出席。
        - id: ch03-b10
          speaker: narrator
          text: 偏偏红龙原来只是在睡觉。星期六一到，它便醒来，也把正在商讨自己的议会“商讨”了一番。等它离开，一个议员都没有剩下。人们只好设法另组议会，可不知怎么，当议员已经变得和踢足球一样不受欢迎。谁也不肯接受选举，这个国家只好暂时不设议会。再下一个星期六到来时，大家都有点害怕。红龙那天倒算相当安静，只吃掉了一整所孤儿院。
        - id: ch03-b11
          speaker: narrator
          text: 莱昂内尔非常难过。他知道，是自己的不听话害了议会、孤儿院和足球运动员，也知道自己非得做点什么。只是，他还不知道该怎么办。
        - id: ch03-b12
          speaker: narrator
          text: 蓝鸟常在宫殿的玫瑰园里唱歌，蝴蝶也变得很温驯。莱昂内尔走过高高的百合花时，它会落在他的肩上。这说明《百兽之书》里的动物不全像红龙一样坏。也许他能再放出一头野兽，叫它和红龙战斗。
        - id: ch03-b13
          speaker: narrator
          text: 莱昂内尔把书带进玫瑰园，只掀开红龙后一页的一点点，想偷看名字。他只看见“尾狮”两个字，书页中央却迅速鼓起，那头野兽正往外钻。他猛地坐到书上，使足力气才把它压回去，再扣紧红宝石和绿松石搭扣。他派人叫来大法官。大法官从星期六开始就病了，所以没和其他议员一起被吃掉。
        - id: ch03-b14
          speaker: lionel
          text: 有什么动物，名字最后两个字是“尾狮”？
        - id: ch03-b15
          speaker: chancellor
          text: 当然是蝎尾狮。它是龙的死敌，专喝龙血。它通身金黄，长着狮子的身体和人的脸。可惜最后一头几百年前就死了。如今要是有几头在这里，该多好！
        - id: ch03-b16
          speaker: narrator
          text: 小国王立刻翻到那一页。画里的蝎尾狮果然浑身金黄，有狮身人面，下面也写着它的名字。没过多久，它睡眼惺忪地爬出书本，一边揉眼睛，一边可怜地喵喵叫。它看起来呆头呆脑。莱昂内尔推了它一把。
        - id: ch03-b17
          speaker: lionel
          text: 快去，去跟红龙打呀！
        - id: ch03-b18
          speaker: narrator
          text: 蝎尾狮一听这话，立刻把尾巴夹在两腿中间，一溜烟逃走，躲到市政厅后面。等全城人都在夜里睡熟，它才四处游荡，把所有的小猫都吃光了。吃完以后，它反而叫得更加厉害。星期六早晨，大家怕红龙突然来访，不大敢出门。因为红龙从没有一个固定的来访时辰。蝎尾狮便沿街走去，喝光人们放在门边、预备喝茶用的牛奶，连装牛奶的罐子也一同吞进肚里。
        - id: ch03-b19
          speaker: narrator
          text: 它刚喝完最后半便士的牛奶，红龙就沿街找来了。那点牛奶还缺斤少两，因为送奶人早已吓坏。蝎尾狮根本不敢斗龙，见没有别的门开着，只好逃进邮政总局，藏到十点钟的邮件中间。
        - id: ch03-b20
          speaker: narrator
          text: 红龙在十点钟的邮件中间找到了蝎尾狮，立刻扑上去。那一大堆邮件根本护不住它。全城都听见了惨烈的猫叫。它先前吞下的那些小猫和牛奶，显然把嗓子养得格外有劲。接着，四周突然陷入一片凄惨的寂静。没过多久，窗户朝着邮局的人看见红龙走下邮政总局的台阶。它嘴里喷着火和烟，烟火里还混着一撮撮蝎尾狮的毛，以及一封封挂号信的碎片。
        - id: ch03-b21
          speaker: narrator
          text: 事情越来越严重。小国王从星期一到星期五不管多么得人心，红龙一到星期六总会做出点事，把臣民刚刚恢复的忠诚毁掉。那条龙整个星期六都是十足的祸害，只有正午那一个小时例外。到了这个时辰，它非得躲到一棵树下休息不可，不然太阳的热气就会把它晒得起火。你要记得，它本来就已经够热了。
    - id: ch04
      title: 白翼骏鹰
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 终于有个星期六，红龙走进王家的育儿室，把小国王最心爱的木马也抓走了。莱昂内尔一连哭了六天。第七天，他累得哭不动，听见蓝鸟在玫瑰间唱歌，又看见蝴蝶在百合间飞，便请奶妈替他擦脸。他决定不再哭了。
        - id: ch04-b02
          speaker: nurse
          text: 别再做傻乎乎的小国王。哭从来帮不了谁。
        - id: ch04-b03
          speaker: lionel
          text: 我也不敢这么说。哭过一个星期，我好像看得更清楚，也听得更明白了。亲爱的奶妈，我知道自己这回没错。请你亲亲我吧，免得我再也回不来。我一定得试着救救大家。
        - id: ch04-b04
          speaker: nurse
          text: 既然非去不可，那就去吧。只是别扯破衣服，也别把脚弄湿。
        - id: ch04-b05
          speaker: narrator
          text: 莱昂内尔就这样出发了。他又一次把《百兽之书》带到玫瑰园。一路上，蓝鸟的歌比往常更甜，蝴蝶的翅膀也比往常更亮。他到了花丛间便飞快地打开书，生怕动作稍慢，自己会胆怯，会改变主意。书一下子完全摊开，翻到差不多正中央的地方，页面底端写着“骏鹰”。
        - id: ch04-b06
          speaker: narrator
          text: 莱昂内尔还没来得及看清画面，就先听到大翅膀扑扇的风声，又听见蹄子踏在地上的响声，随后传来一声轻柔、友善的嘶鸣。一匹美丽的白马就这样走出书页。它拖着长长的白鬃和长长的白尾，背上的巨大翅膀像天鹅的双翼。那双眼睛比世上任何眼睛都柔和，也比任何眼睛都亲切。它静静站在玫瑰花丛中。
        - id: ch04-b07
          speaker: narrator
          text: 骏鹰用丝绸般柔软、牛奶般洁白的鼻子，轻轻蹭了蹭小国王的肩。莱昂内尔觉得，除了那双翅膀，它真像自己那匹可怜又亲爱的木马。蓝鸟的歌声又响又甜。
        - id: ch04-b08
          speaker: narrator
          text: 突然，红龙巨大、散乱、邪恶的身影从天空逼近。小国王立刻懂得该怎么做。他抓起《百兽之书》，跳上温驯的骏鹰，俯身贴近它尖尖的白耳朵。
        - id: ch04-b09
          speaker: lionel
          text: 飞吧，亲爱的骏鹰！使出最快的速度，飞到碎石荒原去！
        - id: ch04-b10
          speaker: narrator
          text: 红龙发现他们起飞，立即转身追赶。它的大翅膀上下翻动，像晚霞里的云。骏鹰的宽阔白翼，则像月亮升起时的云。城里人纷纷走出家门仰望，直到双方从视野中消失。大家认定最坏的事发生了，开始考虑参加宫廷丧礼该穿什么。
        - id: ch04-b11
          speaker: narrator
          text: 可是红龙始终追不上骏鹰。它的红翼虽然比骏鹰的白翼更大，力量却远远比不上那双白色翅膀。于是，白翼骏马带着小国王飞呀，飞呀，飞得越来越远。红龙始终在身后穷追不舍，直到骏鹰终于来到碎石荒原正中央。
        - id: ch04-b12
          speaker: narrator
          text: 碎石荒原就像海边没有沙子的那一段，到处只有松动滚滑的石子。那里没有一根草，方圆一百英里内也找不到一棵树。
        - id: ch04-b13
          speaker: narrator
          text: 到了荒原正中央，莱昂内尔从白马背上一跃而下，迅速解开《百兽之书》的搭扣，把书摊开放在碎石上。接着他急忙转身，踩得脚下石子咔啦咔啦直响。他刚刚重新跳上骏鹰的背，红龙便追到了。此时恰好是十二点整，太阳像一枚耀眼的金几尼，高高挂在蓝天中。红龙已经飞得有气无力，仍在不停四处寻找可以遮阴的树，可四周一百英里内根本没有树。
        - id: ch04-b14
          speaker: narrator
          text: 骏鹰绕着红龙一圈圈飞。红龙在干石子上扭动，身体越来越热，有些地方已经开始冒烟。它知道再找不到树，很快就会烧起来。它伸出红爪去抓国王和骏鹰，却虚弱得够不着，也不敢过分用力，免得更热。
        - id: ch04-b15
          speaker: narrator
          text: 这时，红龙看见了地上的《百兽之书》。书正摊在写有“龙”字的那一页。它看了又看，犹豫不决，最后愤怒地扭了一下身子，还是蠕动着钻回画里，坐到棕榈树下。它进去时，书页被烤焦了一小块。
        - id: ch04-b16
          speaker: narrator
          text: 那棵棕榈是这里唯一的树。莱昂内尔见红龙真的回到树下，立刻跳下马，把书“啪”地合紧。
        - id: ch04-b17
          speaker: lionel
          text: 万岁！这一回我们真的成功了！
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: 他用镶红宝石和绿松石的搭扣牢牢扣住书本，又转身称赞骏鹰，说它是最勇敢、最亲爱、最美丽的伙伴。话还没说完，骏鹰便谦逊地打断了他。
        - id: ch04-b19
          speaker: hippogriff
          text: 嘘。你没看见，这里不只有我们两个吗？
        - id: ch04-b20
          speaker: narrator
          text: 小国王回头一看，碎石荒原上果然围着一大群人。首相、议会里的议员、足球运动员、孤儿院里的所有人、蝎尾狮、木马，还有每一个被红龙吃下去的人，全都站在这里。原来红龙没法把他们一同带进书本。那一页光塞下它自己，就已经挤得不得了。因此，它钻回书里时，当然只能把所有人都留在外面。
    - id: ch05
      title: 从此以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来，大家虽然谁也说不清究竟用了什么办法，却总算一个不少地回到了家，从此幸福地生活下去。小国王问蝎尾狮愿意住在哪里，它请求回到书中。
        - id: ch05-b02
          speaker: manticora
          text: 我不喜欢过这种抛头露面的日子。
        - id: ch05-b03
          speaker: narrator
          text: 蝎尾狮当然认得通往自己那一页的路，所以完全不用担心它翻错地方，再把龙或别的什么放出来。它顺利钻回自己的画里，从此再也没有出来。所以，一个人就算活上一辈子，也只能在图画书中见到蝎尾狮。它当然把那些被吃掉的小猫留在了外面，因为书中实在没有多余的地方。那些奶罐也一起留在外面。
        - id: ch05-b04
          speaker: narrator
          text: 接着，木马也提出请求。它想搬到书里骏鹰所在的那一页。
        - id: ch05-b05
          speaker: rocking_horse
          text: 我想住到一个龙永远抓不到我的地方。
        - id: ch05-b06
          speaker: narrator
          text: 美丽的白翼骏鹰给木马带路。木马一直住在书里，后来小国王才命人把它取出来，交给自己的高——高——高——高孙辈玩耍。
        - id: ch05-b07
          speaker: narrator
          text: 骏鹰则接受了“国王御用木马”的职位。木头做的那一匹已经退休，这个位置正好空着。直到今天，蓝鸟仍在宫殿花园的百合与玫瑰间歌唱，那只蝴蝶也仍在那里轻轻飞舞。
