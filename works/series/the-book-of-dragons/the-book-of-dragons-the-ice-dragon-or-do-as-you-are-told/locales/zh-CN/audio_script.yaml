  chapters:
    - id: ch01
      title: 烟火节与北极光
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这个故事讲的是十二月十一日晚上的奇遇。那天，乔治和简偏偏做了大人不许他们做的事。你也许以为，不听话会招来哪些倒霉事，你早就全知道了。可世上偏有些事情，连你也不知道，他们当然更不知道。
        - id: ch01-b02
          speaker: narrator
          text: 那年盖伊·福克斯之夜没有烟火。王位继承人正在长第一颗牙，病得很厉害。无论谁长第一颗牙，都叫人操心，就算王室中人也一样。这个时候还放烟火，实在不成体统。兰兹角和马恩岛不该放，两个孩子居住的森林山更不该放。就连一向没什么头脑的水晶宫，也知道这时绝不能燃放轮转焰火。
        - id: ch01-b03
          speaker: narrator
          text: 等小王子终于长出了牙，庆祝不但可以，而且十分合宜。十二月十一日被宣布为烟火节。人们急着表示忠心，也急着趁机快活一番。街上有烟火和火炬游行，水晶宫还摆出大型焰火图案，用不同颜色的火光写出“愿王子蒙福”和“王室宝贝万岁”。最不爱热闹的寄宿学校也放了半天假，连水管工和作家的孩子也各得两便士，爱怎么花就怎么花。
        - id: ch01-b04
          speaker: narrator
          text: 乔治和简每人有六便士，全拿去买了一支“金雨”。它怎么也点不着，好不容易亮起，却转眼又灭了。两人只好望着隔壁花园的烟火，还有远处辉煌的水晶宫。家里的亲戚全伤风鼻塞，大人便准他们独自去花园。简穿着毛皮斗篷，戴上厚手套和一顶镶银狐皮的兜帽。那圈毛皮是用妈妈的旧暖手筒改的。乔治穿了带三层披肩的外套，围好围巾，还戴上爸爸的海豹皮旅行帽，两片帽耳正好垂下来护住耳朵。
        - id: ch01-b05
          speaker: narrator
          text: 花园很黑，四周的烟火却把夜色照得喜气洋洋。两个孩子虽冷得发抖，仍十分确信自己玩得很开心。为了看得更清楚，他们爬上花园尽头的篱笆。就在很远很远、黑暗世界的边缘，一排笔直美丽的亮光整齐闪耀，仿佛仙子大军举起的长矛。
        - id: ch01-b06
          speaker: jane
          text: 真漂亮！那是什么呢？好像仙子种下一排发亮的小白杨，又拿流动的光给它们浇水。
        - id: ch01-b07
          speaker: george
          text: 什么流动的光，尽胡说。那只是奥罗拉·博里阿利斯，也就是北极光。
        - id: ch01-b08
          speaker: jane
          text: 可那个“奥罗拉·博里什么斯”究竟是什么？谁点亮了它？放在那里又有什么用？
        - id: ch01-b09
          speaker: narrator
          text: 这些问题乔治还没在学校学过。他只知道北极光跟大熊星、大斗、犁和查尔斯的车有关。
        - id: ch01-b10
          speaker: jane
          text: 那些又是什么？
        - id: ch01-b11
          speaker: george
          text: 是几个星星家族的姓。快看，那枚火箭真带劲！
        - id: ch01-b12
          speaker: narrator
          text: 乔治不得不承认，他还没学过北极光是谁点亮的，又有什么用。不过他搬出一串星星的名字，总算让简觉得自己差不多明白了星星家族。仙子长矛般的光一闪一闪，忽明忽暗。隔壁再过去一家的花园里，那堆篝火又吵又亮，冒着浓烟，火星还噼啪乱迸。北极光比它漂亮得多，甚至比水晶宫的彩焰也漂亮。
        - id: ch01-b13
          speaker: jane
          text: 真想靠近看看。那些星星家族是不是好人家？假如我们也是小星星，妈妈会让我们去他们家喝茶吗？
        - id: ch01-b14
          speaker: george
          text: 傻瓜，根本不是那种家族。我说“家族”，只因为像你这样的小孩听不懂“星座……”后面那个词我也忘了。反正星星全在天上，你不可能去它们家喝茶。
        - id: ch01-b15
          speaker: jane
          text: 我说的是，假如我们也是小星星。我当然知道我们现在不是，我没你想的那么笨。可那些“奥罗拉·博里”就在什么地方的边上，对不对？我们不能走过去看看吗？
        - id: ch01-b16
          speaker: george
          text: 你已经八岁了，怎么还这么没脑筋？那离这里足有半个世界远。北极光就在北极附近。我虽然一点也不稀罕它，倒愿意去发现北极。那件事又困难，又危险。等我回来，就能写一本配着许多图画的书，人人都会说我多么勇敢。
        - id: ch01-b17
          speaker: narrator
          text: 简立刻从篱笆上跳下来，央求乔治马上出发。现在只有他们两个，天又这么晚，以后恐怕再也碰不上这样的机会。
        - id: ch01-b18
          speaker: george
          text: 要不是带着你，我早就去了。可大人总说是我领你闯祸。真去北极，我们十有八九还会弄湿靴子。你没忘吧，他们不许我们踏上草地。
        - id: ch01-b19
          speaker: jane
          text: 他们说的是草坪，我们又不走草坪。去吧，乔治。看着没那么远，我们能赶在他们气坏以前回来。
        - id: ch01-b20
          speaker: george
          text: 好吧。不过你记住，我可一点也不想去。
        - id: ch01-b21
          speaker: narrator
          text: 两人翻过篱笆。天气刚开始结冰，篱笆又冷又白，亮闪闪的。另一边是别人家的花园，他们赶紧穿过去。再往前，一片田里也燃着大篝火，围在火边的人影被映得皮肤黑黑的，像印第安人。乔治想留下多看一会儿，简却拉着他绕过火堆，从缺口钻过树篱，走进下一片漆黑的田。远处隔着一片又一片同样黑暗的田野，北极光仍在闪耀跳动。
    - id: ch02
      title: 通往北极的大滑道
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 冬天，北极地带其实会越过地图上的界线，向南伸出很远。知道的人很少，虽说清晨水罐里的冰早已泄露了秘密。两个孩子出发时，它恰好伸到了森林山附近。他们越走越冷。不久，田野全盖上雪，树篱和栅门垂下巨大的冰柱。可那片北极光看起来仍有一段距离。
        - id: ch02-b02
          speaker: narrator
          text: 他们穿过一片崎岖不平的雪地。简先发现四周的动物。那里有白兔、白野兔，还有各种模样、各种大小的白鸟。树篱的阴影下，另有一些更大的野兽若隐若现，她认定那是狼和熊。
        - id: ch02-b03
          speaker: jane
          text: 那当然是北极熊和北极狼。
        - id: ch02-b04
          speaker: narrator
          text: 简特地补上“北极”两个字，免得哥哥又嫌她笨。田野尽头的高大树篱上堆着雪，挂着冰柱。孩子们找到一处窟窿，那里似乎没有熊狼守着。他们便钻过去，又手脚并用地翻出另一边冻硬的沟渠，站住脚，惊奇得屏住了呼吸。
        - id: ch02-b05
          speaker: narrator
          text: 眼前铺着一条宽阔、笔直、光滑的黑冰大道，一直通向北极光。两旁高树挂满白霜，枝头垂着用细细月光穿起的串串星星，亮得仿佛仙境里的白昼。简觉得就是这样美，乔治却说更像伯爵宫展览会的电灯。两排树仿佛用尺画成，一直向远处延伸。路边还立着一块银雪指路牌，上面用纯冰拼出几个字：“此路通往北极。”
        - id: ch02-b06
          speaker: george
          text: 管它是不是路，我认得滑道。看我的！
        - id: ch02-b07
          speaker: narrator
          text: 乔治踩着冻雪助跑，简见了也照做。转眼间，两人已双脚分开足有半码，在通往北极的大滑道上飞驰。这条路是给北极熊行方便的。冬季里，它们会去陆海军百货公司购买食物，而这正是全世界最完美的滑道。若你从没见过，那是因为你没在十二月十一日放烟火，也没淘气到彻底不听话。可别为了找它故意使坏。你碰上的东西也许完全不同，到时准会后悔。
        - id: ch02-b08
          speaker: narrator
          text: 这种滑道跟普通滑道一样，一出发就只能滑到底，除非摔倒。摔在上面，也和摔在池塘的小滑道上一样疼。它一路向下，速度越来越快。两个孩子根本来不及细看风景，只见一列列挂霜的树和一盏盏星灯向后飞去。滑道两旁，一个宽广的白色世界和一片辽阔的黑夜也在倒退。树上和头顶的星星像银灯一样明亮，远处，仙子长矛般的北极光颤动、闪烁、跳跃。
        - id: ch02-b09
          speaker: george
          text: 我把北极光看得清清楚楚！
        - id: ch02-b10
          speaker: narrator
          text: 在清澈的黑冰上滑呀，滑呀，实在快活。若知道自己正去往一个真正的地方，就更加快活，而那个地方若是北极，那就更不用说了。孩子们的脚在冰上没有一点声音，他们不断向前，四周是一片美丽的白色寂静。忽然，一声喊叫越过雪原，把寂静彻底打碎。
        - id: ch02-b11
          speaker: sportsman
          text: 喂，那边的！停下来！
        - id: ch02-b12
          speaker: george
          text: 快摔倒，保命要紧！
        - id: ch02-b13
          speaker: narrator
          text: 乔治立刻扑倒，因为只有这样才能停住。简跌在他身上，两人又手脚并用地爬到滑道边的雪地。那里站着一个猎人。他戴尖顶帽，上唇的胡子冻得硬邦邦，模样像《冰雪彼得》的插图，手里还端着一支枪。
        - id: ch02-b14
          speaker: sportsman
          text: 你们碰巧带了子弹吗？
        - id: ch02-b15
          speaker: george
          text: 没有。我原有爸爸的五发左轮枪子弹，可保姆翻我口袋，查浴室门把手是不是让我无意中拿走了，子弹就被收走了。
        - id: ch02-b16
          speaker: sportsman
          text: 这种意外总会发生。那你也没有火器吧？
        - id: ch02-b17
          speaker: george
          text: 火器没有，烟火倒有。学校里的男孩送了我一支小爆竹，不知管不管用。
        - id: ch02-b18
          speaker: narrator
          text: 乔治开始在灯笼裤口袋里摸索。里面塞着灯芯绳、薄荷糖、纽扣、陀螺、钢笔尖、粉笔，还有外国邮票。猎人一本正经地说只能试试看，随即伸出手。简却扯了扯哥哥的衣襟，小声提醒他。
        - id: ch02-b19
          speaker: jane
          text: 先问他拿去做什么。
        - id: ch02-b20
          speaker: narrator
          text: 猎人只好承认，他想用烟火打死白松鸡。那只白松鸡果然坐在雪里，脸色苍白，忧心忡忡，等着他们决定自己的命运。
        - id: ch02-b21
          speaker: george
          text: 不给。打松鸡的理由昨天就到期了，我听爸爸说的。现在开枪不公平。真对不起，可我不能答应。
        - id: ch02-b22
          speaker: narrator
          text: 猎人一句话也没说，只朝简挥了挥拳头。随后他踏上滑道，试着朝水晶宫的方向走。可那边是上坡，走起来很不容易。孩子们把还在努力的他留在那里。出发以前，白松鸡用几句悦耳而得体的话谢过他们。两人斜着助跑，再次沿着大滑道奔向北极和那片美丽闪烁的光。
        - id: ch02-b23
          speaker: narrator
          text: 大滑道仿佛永远也到不了头，前方的光也不见靠近。白色寂静裹住孩子和宽阔的冰道。不久，又一声呼喊把它砸得粉碎。乔治照旧叫简快摔倒，自己先扑下去，简又停在他身上。两人爬到路边，突然看见一个蝴蝶收藏家。他戴蓝眼镜，拿着蓝色捕虫网和一本印有彩色图版的蓝皮书，正在寻找标本。
        - id: ch02-b24
          speaker: collector
          text: 请问，你们有一根很长的针吗？
        - id: ch02-b25
          speaker: jane
          text: 我有针线簿，可里面的针全让乔治拿走了。他要做两本少年实验书里的软木塞实验。实验一个没做成，针倒全糟蹋了。
        - id: ch02-b26
          speaker: collector
          text: 真巧，我也正要把针用在软木塞上。
        - id: ch02-b27
          speaker: jane
          text: 我的兜帽上有根帽针。温室门的钉子勾破了毛皮，我拿它别住的。又长又尖，能用吗？
        - id: ch02-b28
          speaker: narrator
          text: 收藏家还是说，只能试试看。简正要摸那根帽针，乔治掐了她的胳膊，叫她先问用途。收藏家只好承认，他想用针刺穿一只巨大的北极蛾。他说，那是极其珍贵的标本，自己非常想保存下来。两人转头一看，那只巨大的白蛾果然坐在捕虫网里，正全神贯注地听他们谈话。
        - id: ch02-b29
          speaker: jane
          text: 那可不行！北极蛾，请你先从网里走出来，好吗？
        - id: ch02-b30
          speaker: narrator
          text: 乔治向收藏家解释，他们实在不愿意帮这个忙。与此同时，简掀开层层蓝色网纱，请北极蛾暂且走到外面来。它果真走了出来。收藏家看见蛾子自由了，与其说是大发雷霆，不如说显得十分伤心。
        - id: ch02-b31
          speaker: collector
          text: 好吧，一整支北极探险队全白费了。我得回家再装备一支，还得给报社写许多信。你这个小姑娘，真是不替别人着想。
        - id: ch02-b32
          speaker: narrator
          text: 两个孩子继续赶路，把收藏家也留在原处，努力朝水晶宫爬上坡。巨大的白色北极蛾发表了一番得体的谢辞。他们斜着助跑，再次从星灯之间滑向北极。速度越来越快，前面的光也越来越亮，刺得他们睁不开眼，只能一路眨个不停。忽然，大滑道在一座巨大雪堆前终止。两人来不及停，一头射进松软的雪里，直陷到耳朵边。
    - id: ch03
      title: 冰龙与海豹皮侏儒
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人好不容易从雪里拔出身子，互相拍打后背，把雪抖掉，再搭起手遮住强光。奇迹中的奇迹就在面前。北极像一座洁白闪亮的冰灯塔，近得不能再近，也高得必须把头仰到不能再仰，还要再往后仰一点，才看得见顶。它全由透明的冰构成。你会听大人说许多关于北极的胡话。等你长大，说不定连自己也会说，再不可能的事都有可能发生。可你心底必须记住，北极只能是冰做的。仔细想想，它怎么可能是别的东西呢？
        - id: ch03-b02
          speaker: narrator
          text: 几百堆小火绕着北极，围成光亮的一圈。火焰既不摇，也不扭。蓝色、绿色、玫瑰色的焰苗笔直升起，像梦中百合的花茎。简这样形容，乔治却坚持说，它们直得像擦枪筒的通条。原来，这些火就是他们远在森林山望见的北极光。
        - id: ch03-b03
          speaker: narrator
          text: 四下地势平坦，光滑坚硬的雪闪闪发亮，像家里亲手抹上糖霜的生日蛋糕顶。店里做的生日蛋糕可不会这样闪，因为他们会偷偷在糖霜里掺面粉。
        - id: ch03-b04
          speaker: jane
          text: 这里像一场梦。
        - id: ch03-b05
          speaker: george
          text: 这里就是北极。人人都把到这儿说得那么难，其实根本不费事。
        - id: ch03-b06
          speaker: jane
          text: 我猜许多人都来过。难的不是来，是回去。也许没人会知道我们来过，知更鸟会拿树叶盖住我们……
        - id: ch03-b07
          speaker: george
          text: 别胡说。这里既没知更鸟，也没树叶。这不过是北极，而我已经发现了它。现在我要设法爬上去，把英国国旗插在顶上，我的手绢就能当旗子。要这里真是北极，詹姆斯舅舅给我的袖珍罗盘就会一直打转，那样我就知道了。跟我来。
        - id: ch03-b08
          speaker: narrator
          text: 走近那些高挑清澈的火焰，他们才看见北极底部盘着一大块形状古怪的冰。冰面清澈、光滑，又闪闪发亮。厚处像冰山，是深深的普鲁士蓝。薄处泛着各种奇妙的微光，忽明忽暗，不住变色，像外婆伦敦家里的切花玻璃吊灯。
        - id: ch03-b09
          speaker: jane
          text: 这形状好怪，几乎像一条龙。
        - id: ch03-b10
          speaker: george
          text: 我看更像泰晤士河堤岸上的路灯。
        - id: ch03-b11
          speaker: jane
          text: 乔治，它真是龙！我看见翅膀了。我们怎么办？
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: 那的确是一条巨大的龙，闪闪发光，长着翅膀、鳞甲、利爪和一张巨口，通身都是纯冰。它大概曾盘在一个洞口睡觉，那里原有暖融融的蒸汽从地心冒出。后来大地渐渐变冷，蒸汽柱冻成了北极，龙也在梦中一起冻住，冻得太硬，再也不能动弹，只能一直留在那里。它很可怕，也美得惊人。
        - id: ch03-b13
          speaker: george
          text: 别吵。我得想个办法爬上北极试罗盘，还不能惊醒这畜生。
        - id: ch03-b14
          speaker: narrator
          text: 龙浑身是清透深邃的普鲁士蓝，还闪着彩虹般的光。北极从它冰冷的盘绕中直冲上去，像整颗巨钻雕成的柱子。天气实在太冷，冰柱不时轻轻迸裂。广阔的白色寂静里，只有这细微的裂响。巨龙仿佛一颗硕大无朋的宝石，躺在寂静中央，周围笔直的火焰像高高的百合花茎。
        - id: ch03-b15
          speaker: narrator
          text: 孩子们正看着有生以来最奇妙的景象，身后忽然传来脚掌轻轻踏雪的声音，还有一阵急促的奔跑和推挤。火焰花茎外的黑暗里，涌出许多棕色小东西。它们有的跑，有的跳，有的手脚并用地爬，有的倒栽葱似的翻滚，甚至还有几个用脑袋走路。来到火边，它们便手牵手围成一圈，跳起舞来。
        - id: ch03-b16
          speaker: jane
          text: 是熊，一定是熊。我真不该来，而且靴子都湿了。
        - id: ch03-b17
          speaker: narrator
          text: 舞圈突然散开。下一刻，几百条毛茸茸的手臂一齐抓住乔治和简。两个孩子顿时陷进一大群穿棕色毛皮衣裳的小胖人中间。四周又软又挤，不住起伏，那片白色寂静彻底消失了。
        - id: ch03-b18
          speaker: dwarf_chief
          text: 还熊呢！等我们收拾完你们，你们会巴不得我们真是熊。
        - id: ch03-b19
          speaker: narrator
          text: 这句威胁听来太可怕，简立刻哭了。直到这时，两个孩子看到的还尽是美丽而奇妙的事物。现在，他们终于后悔做了大人不许做的事。先前为了出门，他们还认真争辩过，大人只说不能踩“草坪”，并没说不能走“草地”。可到了这里，这两个词之间的区别再也不像在森林山时那么大了。
        - id: ch03-b20
          speaker: narrator
          text: 简刚流泪，棕色小人便齐齐退后。北极地带没人敢哭，免得眼泪冻伤脸，所以它们从没见过这种事。
        - id: ch03-b21
          speaker: george
          text: 别真哭，不然眼睛会生冻疮。装着大哭就行，这能吓住它们。
        - id: ch03-b22
          speaker: narrator
          text: 简听从哥哥，继续装腔作势地号哭。奇怪的是，她一开始假哭，真眼泪反倒停了。只要开始装哭，真的哭泣总会停下来。你若不信，自己试试就知道了。乔治趁机扯开嗓门，好让侏儒越过她的号声听见自己。
        - id: ch03-b23
          speaker: george
          text: 呸，谁怕谁！我们叫乔治和简。你们是谁？
        - id: ch03-b24
          speakers: [dwarf_chief, dwarf_two, dwarf_three]
          ensemble: chorus
          text: 我们是海豹皮侏儒。我们很珍贵，也很昂贵，因为从里到外全是最上等的海豹皮。
        - id: ch03-b25
          speaker: george
          text: 那些火是干什么的？
        - id: ch03-b26
          speakers: [dwarf_chief, dwarf_two, dwarf_three]
          ensemble: chorus
          text: 我们在融化这条龙。它冻住了，才盘在北极睡觉。火把它烤化以后，它会醒来，把全世界的人吃掉，只留下我们。
        - id: ch03-b27
          speaker: george
          text: 你们究竟为什么要它这样做？
        - id: ch03-b28
          speakers: [dwarf_two, dwarf_three]
          ensemble: duo
          text: 不为什么，只想使坏。
        - id: ch03-b29
          speaker: jane
          text: 你们真没心肝。
        - id: ch03-b30
          speakers: [dwarf_chief, dwarf_two, dwarf_three]
          ensemble: chorus
          text: 谁说没有？我们的心也是上等海豹皮做的，像胖乎乎的小钱包。
        - id: ch03-b31
          speaker: narrator
          text: 它们又逼近一步。每个侏儒都又胖又圆。身子像大胖子穿的海豹皮外套，脑袋像海豹皮暖手筒，腿像海豹皮长围巾，手脚像海豹皮烟草袋。它们的脸也像海豹，因为脸上同样盖满海豹皮。
        - id: ch03-b32
          speaker: george
          text: 多谢你们告诉我们。晚上好。简，继续哭！
        - id: ch03-b33
          speaker: narrator
          text: 侏儒们嘟囔着继续靠近，一路交头接耳。突然，所有声音都停了。四下静得深不见底，简连假哭也不敢继续。这是一片棕色的寂静，她还是更喜欢先前那片白色的寂静。
        - id: ch03-b34
          speaker: dwarf_chief
          text: 你头上戴的是什么？
        - id: ch03-b35
          speaker: narrator
          text: 乔治心里一沉。那是爸爸的海豹皮帽。
        - id: ch03-b36
          speaker: dwarf_chief
          text: 这是用我们中的一个做的，要不就是我们的穷亲戚海豹。小子，你的命运已经被“海豹”封死啦！
          emotion: angry
        - id: ch03-b37
          speaker: narrator
          text: 周围全是凶恶的海豹脸，两个孩子也觉得命运真被封死了。侏儒伸出毛手臂抓住他们。乔治又踢又蹬，可踢海豹皮根本没用。简放声哭号，可侏儒已经听惯了。它们爬上冰龙的身侧，把孩子扔到冰冷的脊背上，让他们背靠北极。那里的寒冷钻进衣服，叫人浑身缩紧发刺，只恨身上没多穿二十倍的衣裳，好让自己在里面缩成更小、更刺痒的一团。
        - id: ch03-b38
          speaker: narrator
          text: 侏儒要把两个孩子捆在北极上，却没有绳子。于是它们用雪编成花环来绑。只要编法得当，雪环会结实得很。绑牢以后，它们又把火堆得离孩子和龙更近。
        - id: ch03-b39
          speakers: [dwarf_chief, dwarf_two, dwarf_three]
          ensemble: chorus
          text: 龙会暖起来，暖了就醒，醒了就饿，饿了就吃。它最先吃的就是你们。
        - id: ch03-b40
          speaker: narrator
          text: 细小尖利的彩色火苗像梦中百合的花茎一样蹿起，却没有一点热气传到孩子们身边。他们只觉得越来越冷，越来越冷。
        - id: ch03-b41
          speaker: george
          text: 等龙吃我们时，我们的味道不会太好。这倒是安慰。那以前，我们早冻成冰了。
    - id: ch04
      title: 羽毛与飞蛾
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 忽然，一阵翅膀拍动的声音从空中传来。先前获救的白松鸡飞到跟前，稳稳落在冰龙的脑袋上。
        - id: ch04-b02
          speaker: white_grouse
          text: 我能帮上什么忙吗？
        - id: ch04-b03
          speaker: narrator
          text: 这时，孩子们已经冷啊，冷啊，冷得不能再冷。他们早忘了其他一切，脑中只剩下一个“冷”字，嘴里也说不出别的话。
        - id: ch04-b04
          speaker: white_grouse
          text: 稍等。我正好借这个机会，感谢你们方才不肯交出烟火。那番仗义之举，我十分感佩。
        - id: ch04-b05
          speaker: narrator
          text: 头顶传来翅膀柔软的窸窣声。几百几千片洁白蓬松的小羽毛缓缓飘落，像雪花一样落在乔治和简身上。它们又像地上的积雪，一层盖住一层，越积越厚。不一会儿，两个孩子便埋在白羽毛堆里，只露出两张脸。
        - id: ch04-b06
          speaker: jane
          text: 亲爱的白松鸡，你真善良。可你把这么漂亮的羽毛全给我们，自己不会冷吗？
        - id: ch04-b07
          speaker: narrator
          text: 白松鸡听了笑起来。四面八方，几千只善良温柔的鸟儿也一同发出笑声，遥遥应和。
        - id: ch04-b08
          speakers: [white_grouse, grouse_two, grouse_three]
          ensemble: chorus
          text: 你以为这些羽毛全来自一只鸟吗？这里有几百只白松鸡，每只都能匀出一小撮胸羽，替两颗善良的小心保暖。
        - id: ch04-b09
          speaker: narrator
          text: 白松鸡说完这番话，它的礼数实在周到。孩子们依偎在羽毛下面，总算暖和了。侏儒们过来抢羽毛，白松鸡和伙伴便拍着翅膀，尖叫着扑到它们脸上，一直把它们赶退。这一族看着凶恶，其实全是胆小鬼。
        - id: ch04-b10
          speaker: narrator
          text: 龙还没有动，可说不定下一刻就会暖到足以动弹。乔治和简身体虽暖，处境却并不舒服，心里也一点不踏实。他们试着向白松鸡说明，侏儒正要烤醒这条龙，而龙醒来就会先吃掉他们。可这只鸟虽然很有礼貌，脑筋却不大灵光，怎么也没听懂他们还缺什么。
        - id: ch04-b11
          speaker: white_grouse
          text: 你们有了暖窝，我们也会替你们守住。除此以外，还能想要什么呢？
        - id: ch04-b12
          speaker: narrator
          text: 就在这时，远处又响起一种陌生的、断断续续的振翅声，比白松鸡的翅声轻柔得多。两个孩子一眼认出，那只巨大的白色北极蛾正朝火堆飞来。
        - id: ch04-b13
          speakers: [george, jane]
          ensemble: duo
          text: 当心！翅膀别碰到火！
        - id: ch04-b14
          speaker: arctic_moth
          text: 出什么事了？
        - id: ch04-b15
          speaker: narrator
          text: 北极蛾避开火苗，停在冰龙的尾巴上。乔治和简赶紧把海豹皮侏儒怎样捆住他们，又怎样想烤醒龙的事全告诉了它。
        - id: ch04-b16
          speaker: arctic_moth
          text: 它们是海豹皮做的？好，你们等一会儿！
        - id: ch04-b17
          speaker: narrator
          text: 北极蛾歪歪斜斜地飞走，一路灵巧地躲开火焰，消失在黑暗中。不多时，它又回来了。身后跟着的蛾子多得数也数不清，万千白翼骤然在孩子和群星之间铺展开来，像一幅活生生的大幕。
        - id: ch04-b18
          speaker: narrator
          text: 恶毒的海豹皮侏儒顿时大难临头。那片巨大的白翼骤然散开，如同真正的大雪从天而降，直扑侏儒。可每一片雪花都是一只活生生、扑扇着翅膀、饥肠辘辘的蛾子。它们一落到棕色皮毛上，便把贪吃的鼻子深深扎进去。
        - id: ch04-b19
          speaker: narrator
          text: 大人会告诉你，吃毛皮的是蛾子的孩子，并不是蛾子。这只是他们想骗你时才会说的话。忘了你还在旁边，他们又会说：“恐怕蛾子咬了我的白鼬皮披肩。”或者说：“你可怜的埃玛姨妈从前有件漂亮的紫貂皮斗篷，可惜叫蛾子吃了。”如今，聚在这里的蛾子比世上从来有过的都多，它们全落到了海豹皮侏儒身上。
        - id: ch04-b20
          speaker: narrator
          text: 侏儒发现危险时已经太晚。它们大喊着要樟脑、苦苹果、薰衣草油、黄肥皂和硼砂。有几个甚至拔腿去取，可还没等任何一个赶到药剂师那里，一切便结束了。蛾子吃呀，吃呀，不停地吃。侏儒从里到外都是海豹皮，连空空的心也不例外，转眼便被吃到了命根。它们一个接一个倒在雪上，就此送命。北极四周的雪面上，只剩棕色、扁平、光秃秃的皮。
        - id: ch04-b21
          speaker: jane
          text: 谢谢你，亲爱的北极蛾！你真好。但愿你们没吃得太多，回头闹肚子！
          emotion: happy
        - id: ch04-b22
          speakers: [arctic_moth, moth_two, moth_three]
          ensemble: chorus
          text: 为了帮朋友，要是连偶尔吃撑一次都办不到，我们也太没出息啦！
        - id: ch04-b23
          speaker: narrator
          text: 几百万只蛾子笑起来，那声音像蛾翼一样轻柔。随后，它们全都振翅飞走，白松鸡也离开了。海豹皮侏儒尽数死去，火焰一堆一堆地熄灭。黑暗里，只剩乔治、简，还有那条龙。
        - id: ch04-b24
          speaker: jane
          text: 哎呀，这才是最糟的！
          emotion: fearful
        - id: ch04-b25
          speaker: george
          text: 再也没有朋友能帮我们了。
        - id: ch04-b26
          speaker: narrator
          text: 乔治从没想过龙自己也许会帮忙。不过，这种念头本来就不会钻进任何男孩子的脑袋。四周越来越冷，越来越冷，越来越冷。就连躲在厚厚的白松鸡羽毛下面，两个孩子也冻得不停发抖。
    - id: ch05
      title: 冰龙送他们回家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 最后，四周冷到了极点。若是再冷一点，温度计非当场冻裂不可，于是天气总算不能更冷了。就在这时，巨龙松开环绕北极的身体，把长长的冰躯舒展开来，横卧在雪地上。
        - id: ch05-b02
          speaker: ice_dragon
          text: 这才像话！那些火烤得我浑身发虚！
        - id: ch05-b03
          speaker: narrator
          text: 原来，海豹皮侏儒从一开始就把办法全弄反了。龙已经冻了那么久，从里到外早已变成一整块实心的冰。那些火焰不但没让它暖和舒服，反而烤得它像是马上就要死掉。
        - id: ch05-b04
          speaker: narrator
          text: 火焰一熄灭，龙立刻觉得浑身舒服，也立刻饿得厉害。它抬起脑袋，四下寻找可以吃的东西，却根本没有发现乔治和简。两个孩子已经牢牢冻在它的脊背上，看起来就像背上的一部分。
        - id: ch05-b05
          speaker: narrator
          text: 龙慢慢挪动身体，绑住孩子和北极的雪环啪地绷断了。它驮着乔治和简开始向南爬。到了北极，不管往哪边走都只能向南。龙布满鳞片的冰背一路闪亮，身体叮叮当当地发出脆响，恰像你伸手碰了一下那盏切花玻璃吊灯。当然，谁都严禁你碰那盏灯。
        - id: ch05-b06
          speaker: narrator
          text: 从北极向南足有一百万条路。所以你得承认，两个孩子实在走运。龙偏偏选对了方向，沉重的脚突然踏上那条大滑道。它立刻加足速度，在一盏盏星灯之间飞驰，直向森林山和水晶宫奔去。
        - id: ch05-b07
          speaker: jane
          text: 它在送我们回家。它真是一条好龙，我太高兴了！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 乔治其实也挺高兴。可两个孩子都不敢肯定，大人见到他们会不会欢迎。毕竟，他们离家这么久，双脚和靴子又全湿透了，身下还驮来一条谁也不认识的龙。
        - id: ch05-b09
          speaker: narrator
          text: 龙上坡和下坡一样快。若把原因说给你听，你多半不会明白，因为你现在才学到长除法。不过，为了让你能拿去在别的孩子面前炫耀，我还是告诉你吧。龙能把尾巴伸进第四维度，牢牢勾在那里。只要办得到这一点，其他事情就全都容易了。
        - id: ch05-b10
          speaker: narrator
          text: 龙一路飞奔，只停过两次，顺便把仍在滑道上挣扎的猎人和收藏家吃掉了。那两个人还想朝水晶宫的方向走上坡，可他们没有尾巴，甚至从没听说过第四维度，当然怎么努力也走不上去。
        - id: ch05-b11
          speaker: narrator
          text: 到了滑道尽头，龙的速度慢了下来。它爬过一片黑暗的田野。再往前，就是燃着篝火的那片田。那里紧挨着森林山那座隔壁再过去一家的花园。
    - id: ch06
      title: 湿透的靴子
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 龙越走越慢，到了篝火燃烧的田野，便彻底停住。北极地带没有向南伸展到这么远，篝火又烧得极热。于是，冰龙开始融化，融化，不停地融化。两个孩子还没弄懂它在做什么，便发现自己坐进了一大摊水里。靴子湿得不能再湿，那条龙却连一点儿也没剩下。
        - id: ch06-b02
          speaker: narrator
          text: 他们只好走进屋去。当然，立刻就有某位大人发现，乔治和简的靴子又湿又脏，两个人的衣服也说明，他们刚在非常潮湿的地方坐过。因此，他们马上被赶上床睡觉。反正那时早就过了他们该睡的时辰。
        - id: ch06-b03
          speaker: narrator
          text: 现在，假如你有一颗凡事都爱追问的心——对于一个读童话的孩子来说，这可一点也不可爱——你一定想知道，海豹皮侏儒已经全被消灭，那些火也全都熄灭了，为什么每逢寒冷的夜晚，北极光仍旧像从前一样明亮。
        - id: ch06-b04
          speaker: narrator
          text: 亲爱的，我不知道！有些事情我确实一无所知，我可不至于骄傲得不肯承认，而这正是其中一件。但有一点我知道。无论是谁重新点燃了那些火，都绝不可能是海豹皮侏儒。它们早让蛾子吃得一干二净。被蛀坏的东西什么用也没有，连拿来生火都不行！
