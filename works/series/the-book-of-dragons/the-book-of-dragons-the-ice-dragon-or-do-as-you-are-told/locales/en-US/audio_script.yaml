  chapters:
    - id: ch01
      title: IV. The Ice Dragon, or Do as You Are Told
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This tale is about the wonders that came on the evening of December eleventh, when two children did exactly what they had been told not to do. You may believe you know every unpleasant thing that disobedience can bring. But some things are beyond even your knowing, and they were beyond these children's too. Their names were George and Jane.
        - id: ch01-b02
          speaker: narrator
          text: There had been no fireworks that year on Guy Fawkes' Day. The heir to the throne was ill while cutting his first tooth, which is an anxious business even for a Royal baby. He was much too poorly for fireworks to be in good taste anywhere, and in Forest Hill, where George and Jane lived, they were out of the question. Even the empty-headed Crystal Palace knew better than to set off Catherine wheels.
        - id: ch01-b03
          speaker: narrator
          text: Once the Prince had cut his tooth, rejoicing became proper again. December eleventh was proclaimed firework day. Everyone was eager to prove loyal and have fun at the same time. Fireworks burst everywhere, and torchlight processions went through the streets. At the Crystal Palace, great set pieces burned in different colors. One offered blessings to the Prince, while another wished the Royal Darling a long life. Even the most private boarding schools gave their pupils a half holiday. Even the children of plumbers and authors received twopence apiece to spend exactly as they pleased.
        - id: ch01-b04
          speaker: narrator
          text: George and Jane had sixpence each. They spent every penny on one golden rain. It refused to light for ages, then went out almost as soon as it began. So they had to watch the fireworks next door and the magnificent ones at the Crystal Palace.
        - id: ch01-b05
          speaker: narrator
          text: All their relations had head colds, so the children were allowed into the garden alone to set off their firework. Jane wrapped herself in a fur cape and thick gloves. Her hood had silver fox around it, made from Mother's old muff. George wore an overcoat with three capes, a comforter around his neck, and Father's sealskin traveling cap with pieces that folded down over the ears. The garden itself was dark, but fireworks going off on every side made it seem cheerful and grand. The children were cold through all those clothes. Still, they felt quite certain that they were enjoying themselves.
        - id: ch01-b06
          speaker: narrator
          text: They climbed onto the fence for a better view. Far away, at the very edge of the dark world, stood a straight row of beautiful lights. They shone like spears carried by a fairy army.
        - id: ch01-b07
          speaker: jane
          text: Oh, how lovely! What can they be? It looks as if fairies are planting tiny shining poplar trees and watering them with liquid light.
        - id: ch01-b08
          speaker: george
          text: Liquid nonsense! Those are the Aurora Borealis, the Northern Lights.
        - id: ch01-b09
          speaker: narrator
          text: George had been to school, so he knew that much.
        - id: ch01-b10
          speaker: jane
          text: Then what is the Rory Bory thing? Who lights it, and why is it there?
        - id: ch01-b11
          speaker: narrator
          text: George had to admit that school had not taught him that part.
        - id: ch01-b12
          speaker: george
          text: I do know it has something to do with the Great Bear, the Dipper, the Plough, and Charles's Wain.
        - id: ch01-b13
          speaker: jane
          text: What are those?
        - id: ch01-b14
          speaker: george
          text: They are surnames for some star families. Look, there's a splendid rocket!
        - id: ch01-b15
          speaker: narrator
          text: Jane felt she almost understood the star families. The fairy spears glittered and gleamed at the world's edge. They were prettier than the huge, noisy bonfire smoking, flaming, and sputtering two gardens away. To Jane, they were prettier even than all the colored fires at the Crystal Palace.
        - id: ch01-b16
          speaker: jane
          text: I wish we could see them closer. Do you suppose the star families are nice enough for Mother to let us visit for tea, if we were little stars?
        - id: ch01-b17
          speaker: george
          text: They aren't families like that, Silly. I only called them families because you wouldn't understand if I said constel... well, I've forgotten the rest. Anyway, the stars are in the sky. You cannot visit them for tea.
        - id: ch01-b18
          speaker: jane
          text: I said if we were little stars.
        - id: ch01-b19
          speaker: george
          text: But we aren't.
        - id: ch01-b20
          speaker: jane
          text: I know that. I'm not as stupid as you think, George. But the Tory Bories are somewhere near the edge. Couldn't we go and look at them?
        - id: ch01-b21
          speaker: george
          text: For an eight-year-old, you have very little sense. They are half the world away.
        - id: ch01-b22
          speaker: narrator
          text: George kicked the fence to warm his toes. Jane drew up her shoulders to keep her neck warm.
        - id: ch01-b23
          speaker: jane
          text: They look very close.
        - id: ch01-b24
          speaker: george
          text: They're near the North Pole. I don't care a bit about the Aurora Borealis, but I wouldn't mind discovering the Pole. It is terribly dangerous and difficult. Then you come home, write a book full of pictures, and everyone calls you brave.
        - id: ch01-b25
          speaker: narrator
          text: Jane climbed down from the fence.
        - id: ch01-b26
          speaker: jane
          text: Oh, George, let's go! We'll never have another chance. We're all alone, and it's quite late too.
        - id: ch01-b27
          speaker: george
          text: I would go if you weren't here. They always say I lead you into mischief. We would probably get our boots wet, and remember, we were told not to walk on the grass.
        - id: ch01-b28
          speaker: jane
          text: They said the lawn, not all grass. Oh, George, please! It doesn't look so very far. We could return before anyone became dreadfully angry.
        - id: ch01-b29
          speaker: george
          text: Very well. But remember, I don't want to go.
        - id: ch01-b30
          speaker: narrator
          text: Off they went. The fence was turning white, shiny, and bitterly cold as the frost began. Beyond it was somebody else's garden, so they hurried through. Then came a field with another great bonfire. The people around it looked dark-skinned in the firelight.
        - id: ch01-b31
          speaker: george
          text: They look like Indians.
        - id: ch01-b32
          speaker: narrator
          text: George wanted to stop, but Jane pulled him onward. They passed the fire, slipped through a hedge, and entered another dark field. Beyond many more fields, the Northern Lights still shimmered.
        - id: ch01-b33
          speaker: narrator
          text: In winter, the Arctic regions travel much farther south than maps admit. Almost nobody knows this, though you might expect the ice in the morning water jugs to give the secret away. That night, just as George and Jane set out for the Pole, the Arctic had crept almost as far as Forest Hill. With every field they crossed, the air grew colder. Soon snow covered the ground, and great icicles hung from every hedge and gate. Still, the Northern Lights seemed far away.
        - id: ch01-b34
          speaker: narrator
          text: In a rough, snowy field, Jane noticed animals. White rabbits, white hares, and white birds of every size moved around them. Larger shapes waited in the shadowy hedges, and Jane felt sure they were wolves and bears.
        - id: ch01-b35
          speaker: jane
          text: Arctic wolves and polar bears, of course.
        - id: ch01-b36
          speaker: narrator
          text: She made sure to name the polar bears and Arctic wolves, because she did not want George calling her stupid again. At the field's end stood a tall hedge buried under snow and hung all over with icicles. The children searched until they found a hole. No bear or wolf seemed to be lurking near that particular spot, so they crept through. On the far side they scrambled out of a frozen ditch, stood perfectly still, and held their breath with wonder.
        - id: ch01-b37
          speaker: narrator
          text: A great wide road of pure dark ice ran straight and smooth toward the Northern Lights. Tall trees stood along both sides, every branch sparkling with white frost. Strings of stars hung from the boughs as if someone had threaded them onto slender moonbeams. They shone so brightly that the night around the road looked like a beautiful fairy daylight.
        - id: ch01-b38
          speaker: jane
          text: It is beautiful fairy daylight!
        - id: ch01-b39
          speaker: george
          text: It looks more like the electric lights at the Earl's Court Exhibition.
        - id: ch01-b40
          speaker: narrator
          text: The two lines of trees stretched away as straight as if someone had ruled them. At the far end glowed the Aurora Borealis. Beside the road stood a signpost made of silvery snow. Its letters were pure ice, and they read, “This way to the North Pole.”
        - id: ch01-b41
          speaker: george
          text: Whether it is the way or not, I know a slide when I see one. Here goes!
        - id: ch01-b42
          speaker: narrator
          text: George ran over the frozen snow. Jane ran after him. A moment later they were gliding toward the North Pole with their feet half a yard apart.
        - id: ch01-b43
          speaker: narrator
          text: That great road is kept as a slide for polar bears. During winter, they use it to fetch their food from the Army and Navy Stores. It is the finest slide in the world. If you have never found it, that is because you have never set off fireworks on December eleventh while being thoroughly naughty and disobedient. Do not try those things merely to find it. You might find something else and be very sorry.
        - id: ch01-b44
          speaker: narrator
          text: Like any ordinary slide, this one carries you all the way to the end once you begin. You can stop only by falling, and a fall hurts just as much there as it does on a little frozen pond. The great slide runs downhill the whole way, so George and Jane flew faster, and faster, and faster. There was no time to study the country. They caught only flashes of the long lines of frosted trees and the lamps made of stars. On either side, a very broad white world rushed backward under a very large black night. Stars shone overhead like silver lamps, and far in front of them the row of fairy spears trembled and sparkled.
        - id: ch01-b45
          speaker: jane
          text: Look at the shining fairy spears!
        - id: ch01-b46
          speaker: george
          text: I can see the Northern Lights perfectly well.
        - id: ch01-b47
          speaker: narrator
          text: Sliding and sliding over clear dark ice is delightful. It is better when you feel you are truly going somewhere, and better still when that somewhere is the North Pole. George's and Jane's feet made no noise at all upon the ice. They went on and on inside a beautiful white silence. The wide road lay empty before them, with the star lamps shining and the snowy country stretching away on both sides. Then, without warning, a cry rang out over the snow and shattered the silence.
        - id: ch01-b48
          speaker: sportsman
          text: Hey! You two! Stop!
        - id: ch01-b49
          speaker: george
          text: Fall down for your life!
          emotion: fearful
        - id: ch01-b50
          speaker: narrator
          text: George dropped at once, because falling was the only way to stop. Jane landed on top of him. They crawled to the snowy edge and found a sportsman there. He wore a peaked cap and a frozen moustache, like the man in the pictures about Ice-Peter, and carried a gun.
        - id: ch01-b51
          speaker: sportsman
          text: You wouldn't happen to have any bullets with you?
        - id: ch01-b52
          speaker: george
          text: No. I did have five of Father's revolver cartridges. Nurse took them when she emptied my pockets to see whether I'd carried off the bathroom doorknob by mistake.
        - id: ch01-b53
          speaker: sportsman
          text: Quite so. Such accidents happen. Then I assume you carry no firearms?
        - id: ch01-b54
          speaker: george
          text: No firearms, but I do have a firework. One of the boys gave me a squib. Would that help?
        - id: ch01-b55
          speaker: narrator
          text: George searched through the string, peppermints, buttons, tops, pen nibs, chalk, and foreign stamps in his pockets.
        - id: ch01-b56
          speaker: sportsman
          text: We can only try.
        - id: ch01-b57
          speaker: narrator
          text: The sportsman held out his hand, but Jane tugged George's coat and whispered to him.
        - id: ch01-b58
          speaker: jane
          text: Ask him why he needs it.
        - id: ch01-b59
          speaker: narrator
          text: The sportsman had to confess that he meant to kill a white grouse with it. Sure enough, the grouse sat in the snow looking pale and worried, waiting for the decision.
        - id: ch01-b60
          speaker: george
          text: Then you cannot have it. Father said yesterday that the reason for shooting grouse was over, so it would not be fair. I'm sorry, but I won't give it to you.
        - id: ch01-b61
          speaker: narrator
          text: The sportsman said nothing. He shook his fist at Jane, stepped onto the slide, and tried to travel toward the Crystal Palace. That direction was uphill, so it was not easy. The children left him struggling there.
        - id: ch01-b62
          speaker: white_grouse
          text: You have my sincere thanks for your kindness.
        - id: ch01-b63
          speaker: narrator
          text: After the grouse had thanked them in those pleasant, carefully chosen words, George and Jane took a slanting run and swept toward the North Pole again.
        - id: ch01-b64
          speaker: narrator
          text: The slide went on and on. The lights scarcely seemed nearer, and white silence closed around the children. Once more, a call broke it into pieces.
        - id: ch01-b65
          speaker: collector
          text: Hey! You two! Stop!
        - id: ch01-b66
          speaker: george
          text: Fall down for your life!
          emotion: fearful
        - id: ch01-b67
          speaker: narrator
          text: George tumbled as before, and Jane stopped on top of him. At the edge they met a butterfly collector. He was hunting specimens with blue spectacles, a blue net, and a blue book filled with colored pictures.
        - id: ch01-b68
          speaker: collector
          text: Excuse me, but might you have a needle? I require a very long one.
        - id: ch01-b69
          speaker: jane
          text: I have a needle book, but no needles are left. George took them for experiments with bits of cork from “The Boy's Own Scientific Experimenter” and “The Young Mechanic.” He never did the experiments, but he certainly finished the needles.
        - id: ch01-b70
          speaker: collector
          text: How curious. I also need a needle for something involving cork.
        - id: ch01-b71
          speaker: jane
          text: There is a hatpin in my hood. I used it when the fur caught on a nail by the greenhouse. It's extremely long and sharp. Would that work?
        - id: ch01-b72
          speaker: collector
          text: We can only try.
        - id: ch01-b73
          speaker: narrator
          text: Jane reached for the pin, but George pinched her arm.
        - id: ch01-b74
          speaker: george
          text: Ask him what he wants it for.
        - id: ch01-b75
          speaker: narrator
          text: The collector admitted that he planned to push it through the great Arctic moth, which he called a magnificent specimen worth preserving. There in the blue net sat the moth himself, listening closely.
        - id: ch01-b76
          speaker: jane
          text: Oh, I could never let you do that!
          emotion: surprised
        - id: ch01-b77
          speaker: narrator
          text: While George explained that they would rather not help, Jane opened the net's blue folds.
        - id: ch01-b78
          speaker: jane
          text: Would you please step outside for a moment?
        - id: ch01-b79
          speaker: narrator
          text: The moth stepped out. When the collector saw him free, he looked more grieved than angry.
        - id: ch01-b80
          speaker: collector
          text: Well, there goes an entire Arctic expedition. I must return home and equip another one, with all the letters to the newspapers that requires. You are an exceptionally thoughtless little girl.
        - id: ch01-b81
          speaker: narrator
          text: They left him trying to climb the slide toward the Crystal Palace. The great white moth gave them a suitable speech of thanks. Then they ran sideways and began sliding once more beneath the star lamps.
        - id: ch01-b82
          speaker: narrator
          text: Faster and faster they went between the rows of star lamps. Ahead, the Northern Lights grew brighter and brighter. Soon the glare was too strong for the children to keep their eyes properly open. They had to blink and wink as they flew onward. Then, without the least warning, the great slide ended in an enormous heap of snow. George and Jane had no way to stop. They shot straight into the heap, and the snow was so soft that they sank up to their ears.
        - id: ch01-b83
          speaker: narrator
          text: First they pulled themselves out. Then each child thumped the other's back until most of the snow fell away. They shaded their eyes against the dazzling light and looked up. There, directly in front of them, stood the wonder of wonders. The North Pole towered high, white, and gleaming like an ice lighthouse. It was quite, quite close. To see its top, they had to tip their heads as far backward as heads could go, and then try to tip them a little farther.
        - id: ch01-b84
          speaker: narrator
          text: The Pole was made entirely of ice. Grown-ups say a great deal of nonsense about the North Pole, and one day you may do the same. The most unlikely things happen. Still, deep in your heart, remember that the North Pole is clear ice. If you think about it, it could not possibly be anything else.
        - id: ch01-b85
          speaker: narrator
          text: Hundreds of little fires made a shining ring around it. Their flames did not bend or flicker. They rose straight in blue, green, and rose-colored stalks, like lilies in a dream.
        - id: ch01-b86
          speaker: jane
          text: They look like the stems of dream lilies.
        - id: ch01-b87
          speaker: george
          text: They're as straight as ramrods.
        - id: ch01-b88
          speaker: narrator
          text: Those flames were the Aurora Borealis they had seen from Forest Hill. The flat ground was covered in hard, smooth snow. It glittered like the top of a homemade birthday cake. Cakes from shops never glitter that way because they put flour in the icing sugar.
        - id: ch01-b89
          speaker: jane
          text: It feels like a dream.
        - id: ch01-b90
          speaker: george
          text: It is the North Pole. People make such a fuss about reaching it, but there was really no trouble at all.
        - id: ch01-b91
          speaker: jane
          text: Perhaps lots of people have reached it. Getting here is easy. Getting home is the trouble. Maybe no one will ever know we came, and the robins will cover us in leaves, and...
        - id: ch01-b92
          speaker: george
          text: Nonsense. There are no robins and no leaves. This is simply the North Pole, and I found it. Now I shall climb up and plant the British flag. My handkerchief will serve. If this truly is the Pole, the compass Uncle James gave me will spin around and around. Then I'll be certain. Come along.
        - id: ch01-b93
          speaker: narrator
          text: Jane followed him toward the Pole. When they came close to the tall, clear flames, they saw that a huge and strangely shaped mass of ice surrounded the Pole's base. The ice was clear, smooth, and shining. Wherever it grew thick, it turned a deep and beautiful Prussian blue, like the heart of an iceberg. Along the thin parts, glimmering colors changed from one moment to the next. They reminded Jane of the light flashing through the cut-glass chandelier in Grandmamma's London house.
        - id: ch01-b94
          speaker: jane
          text: What a strange shape. It almost looks like... like a dragon.
        - id: ch01-b95
          speaker: narrator
          text: Jane stepped backward to see it better. George noticed something curled like a tail around the Pole.
        - id: ch01-b96
          speaker: george
          text: It looks much more like the lampposts along the Thames Embankment.
        - id: ch01-b97
          speaker: jane
          text: George, it is a dragon! I can see the wings. What are we going to do?
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: It truly was a dragon, enormous and shining, with wings, scales, claws, and a vast mouth, all made from pure ice. Long ago it must have fallen asleep around the opening where warm steam rose from the earth's center. The earth cooled, the steam froze into the North Pole, and the sleeping dragon froze too firmly to stir. Terrible as it was, it was also beautiful.
        - id: ch01-b99
          speaker: jane
          text: It is beautiful as well as terrible.
        - id: ch01-b100
          speaker: george
          text: Never mind that. I'm working out how to climb onto the Pole and test my compass without waking the brute.
        - id: ch01-b101
          speaker: narrator
          text: The dragon shone with deep Prussian blue and a glitter that changed through every color of the rainbow. From the middle of its cold coils, the North Pole shot upward like a pillar carved from one enormous diamond. Now and then, the sheer cold made the ice crack a little. That small cracking sound was the only thing that broke the great white silence. In the middle of it, the dragon lay like an enormous jewel. All around him, the straight flames rose like the stalks of tall lilies.
        - id: ch01-b102
          speaker: narrator
          text: As the children stared at the most marvelous sight they had ever seen, soft feet padded behind them. Out of the darkness beyond the flames rushed a crowd of small brown creatures. They ran, leaped, scrambled, somersaulted, crawled on all fours, and some even walked on their heads. Near the fires they joined hands and danced in a ring.
        - id: ch01-b103
          speaker: jane
          text: They're bears. I know they are. Oh, I wish we had stayed home, and my boots are terribly wet.
          emotion: fearful
        - id: ch01-b104
          speaker: narrator
          text: The ring flew apart. Hundreds of furry arms seized George and Jane, swallowing them in a soft, surging crowd of fat little people dressed in brown fur. The white silence vanished.
        - id: ch01-b105
          speaker: dwarf_1
          text: Bears, are we? Before we're finished, you'll wish we were bears!
        - id: ch01-b106
          speaker: narrator
          text: The threat sounded so dreadful that Jane began to cry. Until then, everything had been beautiful and wonderful. Now the children regretted disobeying, and the difference between a lawn and ordinary grass no longer seemed important.
        - id: ch01-b107
          speaker: narrator
          text: At the first tears, the brown people jumped backward. Nobody cries in the Arctic for fear the frost will strike them, so they had never seen crying before.
        - id: ch01-b108
          speaker: george
          text: Don't truly cry, or your eyes will get chilblains. Pretend to howl instead. It frightens them.
        - id: ch01-b109
          speaker: narrator
          text: Jane began a make-believe howl, and her real tears stopped, as real tears always do when you pretend. Try it yourself. George raised his voice above her noise.
        - id: ch01-b110
          speaker: george
          text: Yah! Who's frightened? We are George and Jane. Who are you?
        - id: ch01-b111
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: We are the sealskin dwarfs! We are costly and precious because every bit of us is made from the very finest sealskin.
        - id: ch01-b112
          speaker: narrator
          text: Their furry bodies twisted through the crowd like colored pieces turning in a kaleidoscope. Jane howled louder, so George had to bellow.
        - id: ch01-b113
          speaker: george
          text: What are all those fires for?
        - id: ch01-b114
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: We built them to thaw the dragon! He sleeps frozen around the Pole. When our fires wake him, he will eat everyone in the whole world except us!
        - id: ch01-b115
          speaker: george
          text: Why in the world do you want him to do that?
        - id: ch01-b116
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: Oh, only for spite!
        - id: ch01-b117
          speaker: narrator
          text: They shouted it as carelessly as if they had said, “Only for fun.”
        - id: ch01-b118
          speaker: jane
          text: You have no hearts at all!
        - id: ch01-b119
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: Of course we do. They are the finest sealskin, like little fat sealskin purses!
        - id: ch01-b120
          speaker: narrator
          text: The dwarfs shuffled one step closer. Every one of them was fat and round. Their bodies looked like sealskin jackets buttoned around very stout people. Their heads might have been sealskin muffs, while their short legs resembled sealskin boas. Their hands and feet had the shape of little tobacco pouches. As for their faces, those looked like the faces of seals. They had one more likeness to seals as well, because every inch of those faces was covered in sealskin.
        - id: ch01-b121
          speaker: george
          text: Thank you for explaining. Good evening. Jane, keep howling!
        - id: ch01-b122
          speaker: narrator
          text: The dwarfs came nearer, muttering and whispering. Then every voice stopped. The silence was so deep that Jane did not dare howl. It felt like a brown silence, and she preferred the white one.
        - id: ch01-b123
          speaker: chief_dwarf
          text: What are you wearing on your head?
        - id: ch01-b124
          speaker: narrator
          text: George knew it was all over. The cap belonged to his father, and it was sealskin. The chief did not wait for his answer.
        - id: ch01-b125
          speaker: chief_dwarf
          text: That cap was made from one of us, or from a seal, one of our poor relations. Boy, your fate is sealed!
          emotion: angry
        - id: ch01-b126
          speaker: narrator
          text: Surrounded by those wicked seal faces, both children felt that their fate really was sealed.
        - id: ch01-b127
          speaker: narrator
          text: The dwarfs closed their furry arms around the children. George kicked, but kicking sealskin does no good at all. Jane howled, but by then the dwarfs were used to the noise. They carried their prisoners up the dragon's side and dumped them onto its icy spine, with their backs pressed against the North Pole. You cannot imagine cold like that. It made them feel small and prickly deep inside their clothes. They wished they had twenty times as many things to wear, so they could feel small and prickly inside every one of them.
        - id: ch01-b128
          speaker: narrator
          text: With no ropes, the dwarfs tied George and Jane to the Pole using snow wreaths, which are very strong when properly made. Then they piled the fires close around them.
        - id: ch01-b129
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: Now the dragon will warm up. Then he will wake, and waking will make him hungry. When he starts eating, you two will be his first mouthful!
        - id: ch01-b130
          speaker: narrator
          text: Sharp flames in many colors sprang up like the stalks of dream lilies. None of their heat reached the children. George and Jane grew colder and colder.
        - id: ch01-b131
          speaker: george
          text: At least we won't taste very nice when he eats us. We'll be frozen solid long before then.
        - id: ch01-b132
          speaker: narrator
          text: Wings flapped above them. The white grouse landed on the dragon's head.
        - id: ch01-b133
          speaker: white_grouse
          text: Is there any assistance I can offer?
        - id: ch01-b134
          speaker: narrator
          text: The children were now so terribly cold that cold was all they could remember, and they could say nothing else.
        - id: ch01-b135
          speaker: white_grouse
          text: One moment, please. I am deeply grateful for the chance to repay your noble behavior with that firework.
        - id: ch01-b136
          speaker: narrator
          text: In the next moment, a soft rustle of wings whispered high above them. Then hundreds and thousands of small, white, fluffy feathers began to drift slowly down. They fell on George and Jane like snowflakes. Just as fallen snow builds one flake upon another, the feathers gathered into a thicker and thicker covering. Before long, the children were buried beneath a great white heap, and only their two faces peeped out.
        - id: ch01-b137
          speaker: jane
          text: Oh, you dear, kind grouse! But won't you be cold now that you've given us all your lovely feathers?
        - id: ch01-b138
          speaker: narrator
          text: The grouse laughed, and thousands of gentle bird voices laughed with him.
        - id: ch01-b139
          speaker: white_grouse
          text: Surely you did not imagine one bird supplied all those feathers?
        - id: ch01-b140
          speakers: [white_grouse, grouse_2, grouse_3]
          ensemble: chorus
          text: Hundreds of us are here, and each can spare a little breast down to keep two kind hearts warm!
          emotion: happy
        - id: ch01-b141
          speaker: narrator
          text: The grouse had very pretty manners indeed. George and Jane snuggled down beneath the soft feathers until they were warm again. The sealskin dwarfs tried to drag the covering away, but the grouse and all his friends flew straight into their faces. Wings flapped, birds screamed, and the dwarfs stumbled back. For all their threats, they were cowardly creatures.
        - id: ch01-b142
          speaker: narrator
          text: Still, the dragon might warm enough to move at any moment. George and Jane were no longer freezing, but they were far from easy. They tried to explain their danger. The grouse was polite, though not clever.
        - id: ch01-b143
          speaker: white_grouse
          text: You have a warm nest, and we will prevent anyone from taking it. What else could you possibly need?
        - id: ch01-b144
          speaker: narrator
          text: A new flutter sounded in the distance, softer and more uneven than the grouse's wings. George and Jane recognized the great Arctic moth at once.
        - id: ch01-b145
          speakers: [george, jane]
          ensemble: duo
          text: Oh, please watch your wings near the fires!
          emotion: fearful
        - id: ch01-b146
          speaker: narrator
          text: The moth settled on the dragon's tail.
        - id: ch01-b147
          speaker: arctic_moth
          text: What has happened here?
        - id: ch01-b148
          speaker: narrator
          text: They told him everything.
        - id: ch01-b149
          speaker: arctic_moth
          text: Sealskin, you say? Wait right there.
        - id: ch01-b150
          speaker: narrator
          text: The moth lifted away from the dragon's tail. He dodged the tall flames in a very crooked path and disappeared into the darkness. Presently he returned. Moths came with him, then more moths behind those, and still more behind them. There were so many that the children could no longer see the stars. It was as though someone had drawn a living sheet of white, fluttering wings across the whole sky.
        - id: ch01-b151
          speaker: narrator
          text: Then doom came suddenly upon the wicked sealskin dwarfs. The great sheet of living whiteness broke apart above them and began to fall, as thick and quiet as snow. But every falling flake was a live moth, fluttering and hungry. One after another, they settled on the dwarfs and buried their greedy noses deep in the sealskin fur.
        - id: ch01-b152
          speaker: narrator
          text: Grown-ups may claim that moths' children eat fur, not moths themselves. They are only trying to deceive you. When you are not listening, they say that moths got into an ermine tippet or ate poor Aunt Emma's sable cloak. And now more moths gathered around the dwarfs than had ever gathered anywhere before.
        - id: ch01-b153
          speaker: narrator
          text: The dwarfs did not understand the danger until it was too late. Then they shouted for camphor, bitter apple, oil of lavender, yellow soap, and borax. A few even started away to fetch these remedies. But the chemist's was much too far. The moths ate and ate and ate. Since the dwarfs were sealskin all the way through, even in their empty little hearts, the moths ate them down to the very life. One by one the dwarfs dropped onto the snow and came to their end. Soon the white ground all around the North Pole was brown with their flat, bare pelts.
        - id: ch01-b154
          speaker: jane
          text: Thank you, thank you, dear Arctic moth! You are so good. I only hope eating so much won't disagree with you afterward.
          emotion: happy
        - id: ch01-b155
          speakers: [arctic_moth, moth_2, moth_3]
          ensemble: chorus
          text: We would be poor friends indeed if we couldn't overeat once in a while to help a friend!
          emotion: happy
        - id: ch01-b156
          speaker: narrator
          text: Millions of moth voices answered Jane, and their laughter was as soft as moth wings brushing the air. Then the great white cloud broke apart and every moth fluttered away. The white grouse and all his companions flew away too. The sealskin dwarfs lay dead, and with no dwarfs to tend them, the colored fires went out one after another. George and Jane remained tied on the dragon's back, alone with it in the Arctic darkness.
        - id: ch01-b157
          speaker: jane
          text: Oh dear. This is the worst thing yet!
          emotion: fearful
        - id: ch01-b158
          speaker: george
          text: We haven't any friends left to save us.
        - id: ch01-b159
          speaker: narrator
          text: George never considered that the dragon might save them. No boy would have thought of such an idea. The air grew colder and colder. Even beneath the grouse feathers, they shivered.
        - id: ch01-b160
          speaker: narrator
          text: At last it became so cold that one more degree would have broken the thermometer. Then the cold stopped increasing. The dragon uncoiled from the Pole and stretched his long icy body across the snow.
        - id: ch01-b161
          speaker: ice_dragon
          text: Ah, this is much better! Those fires made me feel terribly faint.
        - id: ch01-b162
          speaker: narrator
          text: The sealskin dwarfs had gone about their work in exactly the wrong way. The dragon had stayed frozen for so long that it was no longer merely trapped in ice. It was solid ice all the way through. The fires had made it feel faint, almost as if it were going to die. Once the flames went out and the cold returned, the dragon felt perfectly well. It also felt very hungry. It turned its great head and searched for something to eat, but it never noticed George and Jane. They were frozen fast to its back.
        - id: ch01-b163
          speaker: narrator
          text: The dragon began to move slowly across the snow. With a sharp snap, the snow wreaths that held the children to the Pole broke apart. So the dragon crawled south with George and Jane still perched on its huge, scaly, shining back. Of course it had to go south if it went anywhere. Once you are standing at the North Pole, there is no other direction left. Its icy body rattled and tinkled as it walked. It sounded exactly like the cut-glass chandelier when you touch it, which you are strictly forbidden to do.
        - id: ch01-b164
          speaker: narrator
          text: There are a million roads south from the Pole. Luckily, the dragon chose the right one and planted its heavy feet on the great slide. It raced between the star lamps toward Forest Hill and the Crystal Palace.
        - id: ch01-b165
          speaker: jane
          text: He's carrying us home! Oh, what a good dragon. I'm so glad!
          emotion: happy
        - id: ch01-b166
          speaker: narrator
          text: George was rather glad too, though neither child expected a warm welcome. Their boots were wet, and they were bringing home a strange dragon.
        - id: ch01-b167
          speaker: narrator
          text: They traveled very quickly, since dragons go uphill just as easily as they go down. You might not understand the reason if you have reached only long division in your lessons. Still, perhaps you want to hear it so you can show off to the other children. A dragon can push its tail right into the fourth dimension and hold on there. That gives it all the help it needs for climbing. Once you know how to put your tail into the fourth dimension, everything else is easy.
        - id: ch01-b168
          speaker: narrator
          text: The dragon kept up its tremendous speed. It stopped only twice, once to eat the butterfly collector and once to eat the sportsman. The two men were still struggling to make their way uphill along the great slide. Their efforts had been useless. Neither one possessed a tail, and neither one had ever heard so much as a word about the fourth dimension.
        - id: ch01-b169
          speaker: narrator
          text: At the slide's end, the dragon crawled slowly across the dark field. Beyond it lay the field with the bonfire, beside the garden next door in Forest Hill.
        - id: ch01-b170
          speaker: narrator
          text: It went slower and slower, until it stopped completely in the field with the bonfire. The Arctic regions had not traveled quite that far south, and the bonfire was extremely hot. The dragon began to melt. It melted and melted beneath the children. Before they understood what their ride was doing, George and Jane found themselves sitting in a large pool of water. Their boots were as wet as wet could be, and not one single piece of the ice dragon remained.
        - id: ch01-b171
          speaker: narrator
          text: So they went indoors. Naturally, some grown-up immediately noticed their wet, muddy boots and saw that both had been sitting somewhere damp. George and Jane were sent straight to bed. It was long past bedtime anyway.
        - id: ch01-b172
          speaker: narrator
          text: Now, if you have an inquiring mind, which is not considered a nice thing in a small reader of fairy tales, you may ask a question. If the sealskin dwarfs are dead and their fires went out, why does the Aurora Borealis still shine so brightly on cold nights?
        - id: ch01-b173
          speaker: narrator
          text: My dear, I do not know. I am not too proud to admit that there are things I know nothing about, and this is one of them. Someone must have lighted the fires again, or the Northern Lights could not shine. But whoever did it, I can tell you with certainty that it was not the sealskin dwarfs. The moths ate every one of them. And once a thing is motheaten, it is no use for anything at all, not even for lighting fires!
