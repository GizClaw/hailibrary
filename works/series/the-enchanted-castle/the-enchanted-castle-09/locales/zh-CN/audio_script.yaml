audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    phoebus:
      display_name: 福玻斯
      tts:
        delivery: 优雅自得，带着神祇般漫不经心的热情
        timbre: 明亮清越的成年男声
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第九章：戒指的新本领
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 魔法世界和我们眼里的真实世界之间，永远垂着一道帷幕。它薄得像蛛丝，亮得像玻璃，却又硬得像钢。要是谁找到帷幕上薄弱的地方，比如魔法戒指或者护身符，那就几乎什么都可能发生。
        - id: ch01-b02
          speaker: narrator
          text: 那天下午，梅布尔和凯瑟琳正一本正经、一丝不苟地主持娃娃茶会。在她们参加过的所有娃娃茶会里，这一场乏味得足以排到最前面。可两人忽然同时生出一种古怪又毫无道理的冲动，非立刻回花神殿不可。娃娃茶具扔在那里不洗了，葡萄干只吃掉一半也顾不上。魔法在催她们走，她们明知这样不妥，也根本抵挡不了，几乎是违背自己的意愿出了门。
        - id: ch01-b03
          speaker: narrator
          text: 午后的四周金灿灿的，一片安静。她们越靠近花神殿，就越肯定自己绝不可能去别处。也正因为这样，杰拉尔德和吉米在黑暗通道里拉着手，装作只是闹着玩，一起喊出第一声时，外面马上就有人回答。
        - id: ch01-b04
          speaker: narrator
          text: 通道上一处怎么看都不像门的地方，忽然透进一道细细的亮光。石门慢慢自行打开。两个男孩从黑暗里钻出去，站在花神殿里，对着亲切的日光不停眨眼。他们还没来得及招架，凯瑟琳已经一把抱住他们，梅布尔的问题也像连珠炮一样劈头盖脸地追了过来。
        - id: ch01-b05
          speaker: princess
          text: 可你们就把那个丑八怪扔在伦敦了。你本来可以许愿，把它也一起带回来呀。
        - id: ch01-b06
          speaker: gerald
          text: 它在那里过得挺好。我怎么可能什么都想得到？再说，还是别带它了。现在回家去，把戒指装进信封封起来。
        - id: ch01-b07
          speaker: kathleen
          text: 可我还没用戒指做过任何事呢。
        - id: ch01-b08
          speaker: gerald
          text: 等你看过它怎么折腾人，你多半就不想碰了。
        - id: ch01-b09
          speaker: kathleen
          text: 要是换我许愿，它肯定不会惹出那种乱子。
        - id: ch01-b10
          speaker: princess
          text: 要我说，干脆把它送回藏宝室，以后再也别碰了。我本来就不该拿走它。严格说，这也算偷东西，跟伊莱扎借它去吓唬男朋友一样糟。
        - id: ch01-b11
          speaker: gerald
          text: 你肯放回去，我没意见。不过以后要是谁真想出了一个好愿望，我们当然还能取出来吧？
        - id: ch01-b12
          speaker: princess
          text: 当然，当然能。
        - id: ch01-b13
          speaker: narrator
          text: 大家一起走进城堡。梅布尔又扳动机关，墙板落下，藏宝处的珠宝再次露了出来。戒指被放回那堆灰扑扑的古怪饰物中间。它跟那些东西混在一起，看着一点也不起眼。梅布尔从前说过，那些饰物每一件都有魔法。
        - id: ch01-b14
          speaker: gerald
          text: 瞧它多无辜。谁能想到这枚傻乎乎的旧戒指会有魔法？不过，梅布尔说别的东西也有魔法，到底是不是真的？不如试试看。
        - id: ch01-b15
          speaker: kathleen
          text: 别试！我看有魔法的东西全都心眼坏，专门把人逼进难办的处境。
        - id: ch01-b16
          speaker: princess
          text: 我倒想试，可这些事把人弄得太乱了。我已经忘了哪件东西有什么本领。
        - id: ch01-b17
          speaker: narrator
          text: 其他人也全忘了。也许正因为谁都记不得，杰拉尔德才把一枚青铜扣子放在脚上，说它像七里靴，能让人一步跨出七里。可他站在原地，什么也没发生。吉米还留着一点当城里阔佬时的习气，说一只钢项圈能让口袋里永远有钱。他伸手去摸，自己的口袋照样空空如也。梅布尔和凯瑟琳也拿起各色戒指、链子和胸针，替它们编出种种再美妙不过的本领，结果没有一样应验。
        - id: ch01-b18
          speaker: princess
          text: 看来只有那枚戒指有魔法。哎，等等！
        - id: ch01-b19
          speaker: jimmy
          text: 怎么了？
        - id: ch01-b20
          speaker: princess
          text: 万一连那枚戒指也根本没有魔法呢？
        - id: ch01-b21
          speaker: kathleen
          text: 可我们明明知道它有呀。
        - id: ch01-b22
          speaker: princess
          text: 我可不知道。我觉得今天根本不是今天。刚才发生的那些事，都是我们在另一天做的梦。现在其实还是我第一次编出戒指那套话的那一天。
        - id: ch01-b23
          speaker: gerald
          text: 才不是。那天你还穿着公主服呢。
        - id: ch01-b24
          speaker: princess
          text: 什么公主服？
        - id: ch01-b25
          speaker: narrator
          text: 梅布尔把乌黑的眼睛睁得老大。
        - id: ch01-b26
          speaker: gerald
          text: 哦，别犯傻了。
        - id: ch01-b27
          speaker: princess
          text: 我没犯傻。你们也该走了，吉米肯定想喝茶。
        - id: ch01-b28
          speaker: jimmy
          text: 那当然。不过那天你确实穿着公主服。来，把护窗板关上，让戒指永远待在老地方。
        - id: ch01-b29
          speaker: princess
          text: 什么戒指？
        - id: ch01-b30
          speaker: gerald
          text: 别管她，她就是想逗我们。
        - id: ch01-b31
          speaker: princess
          text: 我才没有。我这是受了神启，就像皮媞亚女祭司，或者西比拉先知。什么戒指？
        - id: ch01-b32
          speaker: kathleen
          text: 就是许愿戒指呀，那枚能让人隐身的戒指。
        - id: ch01-b33
          speaker: princess
          text: 你们还不懂吗？你说戒指是什么，它就会变成什么！我们会隐身，就是因为我说它能让人隐身。要是真有这样的本领，就绝不能留在这里。这么宝贵的东西，拿走也不能算偷。你们说，它是什么？
        - id: ch01-b34
          speaker: jimmy
          text: 它是许愿戒指。
        - id: ch01-b35
          speaker: princess
          text: 这个已经试过了，还让你许了个傻愿望。我说它不是许愿戒指。我说，谁戴上它，谁就会长到四码高。
        - id: ch01-b36
          speaker: narrator
          text: 她说着一把抓起戒指。话音还没落，戒指已经高高出现在孩子们头顶，套在一根不可思议的梅布尔手指上。刚才还跟大家差不多高的姑娘，一下子直冲到屋顶般的高度。她真的长到了十二英尺，也就是整整四码高。
        - id: ch01-b37
          speaker: gerald
          text: 这下你可闯祸了！
        - id: ch01-b38
          speaker: narrator
          text: 他一点也没说错。梅布尔再怎么坚持它是许愿戒指都没用。她刚才说它是什么，现在它就已经是什么了。
        - id: ch01-b39
          speaker: gerald
          text: 而且你根本不知道这本领会持续多久。想想上回隐身吧。
        - id: ch01-b40
          speaker: narrator
          text: 隐身的样子当然看不见，不太好想，不过大家都懂他的意思。
        - id: ch01-b41
          speaker: kathleen
          text: 说不定会持续好几天。梅布尔，你怎么这么傻！
        - id: ch01-b42
          speaker: princess
          text: 对，你就往我的伤口上撒盐吧。你们刚才要是肯相信我，我就不用非得证明，也不会长成这个可笑的样子。现在怎么办，你们倒是教教我？
          emotion: angry
        - id: ch01-b43
          speaker: gerald
          text: 只能先把你藏起来，等你变回原来的大小。就这么办。
        - id: ch01-b44
          speaker: princess
          text: 可是藏在哪儿？
        - id: ch01-b45
          speaker: narrator
          text: 她一只足有二十四英寸长的脚，重重跺在地上。
        - id: ch01-b46
          speaker: gerald
          text: 找一间空屋子。你不会害怕吧？
        - id: ch01-b47
          speaker: princess
          text: 我当然不怕。唉，真希望我们刚才放好戒指就直接走了。
        - id: ch01-b48
          speaker: jimmy
          text: 不肯直接走的可不是我们。
        - id: ch01-b49
          speaker: princess
          text: 那我现在就把它放回去。
        - id: ch01-b50
          speaker: narrator
          text: 她用力往下拔戒指。
        - id: ch01-b51
          speaker: gerald
          text: 换了我就不摘。你总不想永远这么长吧？等效力消失时，要是戒指没戴在你手上，我猜它就不会让你变回去。
        - id: ch01-b52
          speaker: narrator
          text: 高处的梅布尔闷闷不乐地伸手碰动机关。墙板缓缓滑回原位，把所有闪亮的珠宝和那堆古怪饰物全遮住。藏宝室仿佛从没存在过。屋里又只剩下八面墙、护墙板和从窗外照进来的阳光，空荡荡的，一件家具也没有。
        - id: ch01-b53
          speaker: princess
          text: 那我到底藏哪儿？幸好姨妈准我今晚跟你们住。可就算这样，你们也得留一个人陪我过夜。我长得这么荒唐，绝不肯一个人待着。
        - id: ch01-b54
          speaker: narrator
          text: 她说“四码高”，身高果真就是四码，可身体并没比四英尺七英寸时粗多少。照杰拉尔德的话说，效果活像一条长虫，妙极了。衣服当然也跟着身体一起拉长。她像映在游乐园那种细长的弯镜子里，胖人照了会高兴地变苗条，瘦人却会惨兮兮地只剩皮包骨。她忽然坐到地上，仿佛一把四折尺自己折了起来。
        - id: ch01-b55
          speaker: gerald
          text: 姑娘，光坐着可解决不了问题。
        - id: ch01-b56
          speaker: princess
          text: 我不是坐着，我是趴下来，好从门里钻出去。以后大多数地方，我恐怕都得手脚并用地爬。
        - id: ch01-b57
          speaker: jimmy
          text: 你不饿吗？
        - id: ch01-b58
          speaker: princess
          text: 我不知道。我的胃离这儿实在太远了！
          emotion: sad
    - id: ch02
      title: 杜鹃花丛里的野餐
      blocks:
        - id: ch02-b01
          speaker: gerald
          text: 我先出去侦察。要是外面没人……
        - id: ch02-b02
          speaker: princess
          text: 等等，我想天黑以前还是待在户外好。
        - id: ch02-b03
          speaker: gerald
          text: 不行，肯定会有人看见你。
        - id: ch02-b04
          speaker: princess
          text: 走紫杉树篱里面就不会。那里有条通道，跟《韦尔家的好运》里的黄杨树篱一样。
        - id: ch02-b05
          speaker: jimmy
          text: 那是什么书？
        - id: ch02-b06
          speaker: princess
          text: 《韦尔家的好运》，特别好看。我就是看了它，才开始到处找护墙板里的暗门。只要我贴着肚皮，像蛇一样爬过通道，就能到杜鹃花丛。那里离恐龙很近，我们可以扎营。
        - id: ch02-b07
          speaker: gerald
          text: 可我们还得喝茶。
        - id: ch02-b08
          speaker: jimmy
          text: 根本没有茶可以喝。
        - id: ch02-b09
          speaker: narrator
          text: 两个男孩都没吃午饭。
        - id: ch02-b10
          speaker: princess
          text: 你们不会扔下我吧？这样好了，我给姨妈写张字条。只要她在家，而且醒着，她就会准备野餐。她不在，女仆也会准备。
        - id: ch02-b11
          speaker: narrator
          text: 梅布尔从杰拉尔德那本宝贝袖珍笔记簿上撕下一页。她写信给最亲爱的姨妈，请姨妈准备些野餐食物，让杰拉尔德去拿。她本来想亲自去，可是有点累，大概是最近长得太快了。落款写的是“爱您的侄女梅布尔”。最后她又补了一句，请多给一些，因为有好几个人饿得厉害。
        - id: ch02-b12
          speaker: narrator
          text: 梅布尔爬过紫杉树篱里的隧道很费劲，却不是办不到，只是慢得出奇。她只能把长身体一点点拖过去。三个人刚在杜鹃花丛里安顿好，正恼火地猜杰拉尔德究竟在磨蹭什么，为什么去了那么久，他就回来了。一只盖得严严实实的篮子压在他肩上，他累得直喘，把篮子往柔软如毯的细草地上一扔，还忍不住呻吟了一声。
        - id: ch02-b13
          speaker: gerald
          text: 不过这一趟值得。我们的梅布尔在哪儿？
        - id: ch02-b14
          speaker: narrator
          text: 梅布尔苍白的长脸从叶子中探出来，几乎贴着地面。
        - id: ch02-b15
          speaker: princess
          text: 我这样看起来跟普通人一模一样，对吧？剩下那些部分都在几英里外，分别藏在不同的灌木下面。
        - id: ch02-b16
          speaker: kathleen
          text: 我们已经拿蕨叶和树叶，把灌木之间的空隙全盖住了。别乱动，梅布尔，不然遮在你身上的东西都要掉了。
        - id: ch02-b17
          speaker: narrator
          text: 吉米兴冲冲地揭开篮盖。里面有一条长面包、包在卷心菜叶里的黄油、一瓶牛奶、一瓶水、蛋糕，还有一盒又大又光滑的黄醋栗。那只盒子从前装过一大瓶号称对头发胡须举世无双的妙品。
        - id: ch02-b18
          speaker: narrator
          text: 梅布尔从杜鹃花里小心地伸出两条长得惊人的胳膊，用一只细竹竿似的手肘撑着身体。杰拉尔德负责切黄油面包。凯瑟琳应梅布尔的请求，好心地绕着那副长身体跑了一整圈，检查那些离脑袋最远的地方，看看盖在上面的绿色东西有没有掉。接着是一阵幸福而饥饿的安静，只偶尔有人急切地开口。
        - id: ch02-b19
          speaker: kathleen
          text: 请再给我一点蛋糕。
        - id: ch02-b20
          speaker: jimmy
          text: 牛奶，开到这边来！
        - id: ch02-b21
          speaker: princess
          text: 把黄醋栗扔给我。
        - id: ch02-b22
          speaker: narrator
          text: 吃着吃着，大家都平静了，也对眼下的处境满意多了。疲倦和安逸混在一起，一种舒服的感觉慢慢爬到每个人的四肢末端。连倒霉的梅布尔也感觉到了，连她那双远得出奇的脚都没有落下。那两只脚交叉放着，躲在茶会西北偏北方向第三丛杜鹃花下面。
        - id: ch02-b23
          speaker: gerald
          text: 好了，我现在像换了个人。可就算给我钱，我也吃不下一颗黄醋栗了。
        - id: ch02-b24
          speaker: princess
          text: 我还能吃。我知道已经没有了，我自己那份也吃光了，可我还是吃得下。大概是因为我太长了。
        - id: ch02-b25
          speaker: narrator
          text: 饭后的甜美宁静铺满了夏日空气。不远处，巨大的石恐龙从灌木间露出灰色身影，身上披着一层绿色苔衣。它像孩子们一样吃饱了似的，也显得安宁又快活。杰拉尔德舒服地伸开四肢，从枝叶间的缺口望见它那只石头眼睛。不知为什么，那目光显得很有同情心。
        - id: ch02-b26
          speaker: gerald
          text: 我敢说，它活着的时候也喜欢痛痛快快吃一顿。
        - id: ch02-b27
          speaker: jimmy
          text: 谁呀？
        - id: ch02-b28
          speaker: gerald
          text: 就是那只恐……什么龙。
        - id: ch02-b29
          speaker: kathleen
          text: 它今天已经吃过一顿啦。
          emotion: happy
        - id: ch02-b30
          speaker: princess
          text: 可不是吗？
          emotion: happy
        - id: ch02-b31
          speaker: kathleen
          text: 你笑的时候，别让声音跑到胸口下面。不然盖在你身上的绿叶会抖掉。
        - id: ch02-b32
          speaker: jimmy
          text: 什么叫它吃过一顿？你们偷偷笑什么？
        - id: ch02-b33
          speaker: kathleen
          text: 就是有人往它肚子里塞了东西呀。
          emotion: happy
        - id: ch02-b34
          speaker: jimmy
          text: 你们爱耍宝就继续吧。我们根本不想知道，对不对，杰里？
          emotion: angry
        - id: ch02-b35
          speaker: gerald
          text: 我倒想知道，简直想得不得了。等你们装完不肯说的样子，再把我叫醒。
        - id: ch02-b36
          speaker: narrator
          text: 他把帽檐拉到眼睛上，往后一躺，摆出睡觉的样子。
        - id: ch02-b37
          speaker: kathleen
          text: 哦，别犯傻！我们只是把做丑八怪用的衣服，从恐龙肚子上的洞塞了进去，就当喂它吃饭。
        - id: ch02-b38
          speaker: gerald
          text: 那么走的时候顺便把衣服带回家，事情就解决了。
        - id: ch02-b39
          speaker: narrator
          text: 他嘴里嚼着一根草茎的白梢。
        - id: ch02-b40
          speaker: kathleen
          text: 我忽然有个主意。把戒指借我戴一会儿。我先不说是什么，免得没成功，你们又笑我傻。我保证走以前还给你。
        - id: ch02-b41
          speaker: princess
          text: 可你们还不走吧？当然，不管你的主意有多傻，我都非常愿意让你试。
        - id: ch02-b42
          speaker: narrator
          text: 梅布尔拔下戒指。凯瑟琳的想法很简单。也许换一个没受戒指魔法影响的人，再说一遍它有什么本领，那本领就会改变。戒指刚从梅布尔苍白的长手落进她胖乎乎、暖烘烘的小手，她便跳了起来。
        - id: ch02-b43
          speaker: kathleen
          text: 我们现在就去把恐龙肚子掏空！
        - id: ch02-b44
          speaker: narrator
          text: 她拔腿朝那头史前怪兽跑去，很快把别人远远甩在后面。她想大声说出一句话，又不肯让他们听见。她要趁自己跑在最前面，悄悄把戒指重新说成许愿戒指。
        - id: ch02-b45
          speaker: kathleen
          text: 这是许愿戒指。你想许什么愿，它都能替你实现。
        - id: ch02-b46
          speaker: narrator
          text: 她确实说了。谁也没有听见，只有鸟儿、一两只松鼠，也许还有一尊石头牧神。凯瑟琳飞快地从底座旁跑过，牧神那张漂亮的石头脸仿佛朝她转了过来，笑盈盈地望着她。
        - id: ch02-b47
          speaker: narrator
          text: 道路向上斜去，阳光照得明亮。凯瑟琳拼命跑了一路，可两个哥哥仍在她进入恐龙的巨大阴影前追上了她。她热得厉害，根本没法静下心来决定该许什么愿。
        - id: ch02-b48
          speaker: kathleen
          text: 我爬上去把东西搬下来。我清清楚楚记得放在哪儿。
        - id: ch02-b49
          speaker: narrator
          text: 杰拉尔德弯腰让她踩，吉米在旁边托着。她钻进洞口，消失在怪兽黑洞洞的肚子里。过了一会儿，衣服像骤雨一样落下来。空背心、裤腿乱挥的长裤、衣袖乱甩的外套，全都掉到外面。
        - id: ch02-b50
          speaker: kathleen
          text: 小心脑袋！
        - id: ch02-b51
          speaker: narrator
          text: 手杖、高尔夫球杆、曲棍球杆和扫帚柄紧跟着落下，一路互相碰撞，咔啦咔啦响成一片。
        - id: ch02-b52
          speaker: jimmy
          text: 走吧。
        - id: ch02-b53
          speaker: gerald
          text: 等等，我要上去。
        - id: ch02-b54
          speaker: narrator
          text: 杰拉尔德抓住上方洞口的边缘，纵身一跃。肩膀才钻进去，膝盖刚搭上洞沿，他便听见凯瑟琳的靴子踏着恐龙肚子里的地面。
        - id: ch02-b55
          speaker: kathleen
          text: 里面真凉快。雕像大概一直都是凉凉的吧。我真希望自己也是一尊雕像。哦！
          emotion: fearful
        - id: ch02-b56
          speaker: narrator
          text: 最后那声喊充满恐惧和痛苦，突然被石头般可怕的寂静截断。
        - id: ch02-b57
          speaker: gerald
          text: 怎么了？
        - id: ch02-b58
          speaker: narrator
          text: 可他心里已经明白。他爬进巨大的空壳，借洞口透进的一点微光，看见灰色内壁前有一团白色。他跪在那里摸遍口袋，划亮一根火柴。蓝火苗变成黄火苗时，他看清了早已猜到的景象。
        - id: ch02-b59
          speaker: narrator
          text: 凯瑟琳的脸雪白坚硬，没有一丝生气。她的头发也是白的，双手、衣服和鞋也全白了，从头到脚都像冰冷坚硬的大理石。她的愿望实现了，她变成了一尊雕像。恐龙肚子里久久没有一点动静。杰拉尔德仍跪在石头地面上，一句话也说不出。事情来得太突然，也太可怕，比以前任何一次魔法都更糟。
        - id: ch02-b60
          speaker: narrator
          text: 最后，他转过身，背后是冰冷如石的寂静，下面却是碧绿晴朗、树叶沙沙作响的活世界。他用平常得不能再平常的声音对吉米说话，仿佛只是在讲一件实在的小事。
        - id: ch02-b61
          speaker: gerald
          text: 吉米，凯瑟琳把戒指说成了许愿戒指，它当然就真成了许愿戒指。我现在懂她为什么先跑了。可这个小傻瓜，偏偏又许愿把自己变成雕像。
        - id: ch02-b62
          speaker: jimmy
          text: 她真的变了？
          emotion: fearful
        - id: ch02-b63
          speaker: gerald
          text: 你上来看看。
        - id: ch02-b64
          speaker: narrator
          text: 吉米靠杰拉尔德拉了一把，自己又往上一跳，也钻进恐龙肚子。
        - id: ch02-b65
          speaker: jimmy
          text: 她真的成雕像了。太可怕了！
          emotion: fearful
        - id: ch02-b66
          speaker: gerald
          text: 一点也不可怕。走吧，回去告诉梅布尔。
    - id: ch03
      title: 石壳里的夜晚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个男孩回到杜鹃花丛。梅布尔一直老实待在原地，长长的身体仍藏在叶子下面。他们把消息直接告诉她，简直像开枪打碎一只瓶子。
        - id: ch03-b02
          speaker: princess
          text: 我的天哪！接下来还会出什么事？我的天哪！
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 她的长身体猛地扭动，蕨叶和树叶像一阵小雨纷纷落下，腿后面立刻晒到了热烘烘的阳光。
        - id: ch03-b04
          speaker: gerald
          text: 她会恢复的。
        - id: ch03-b05
          speaker: princess
          text: 可我怎么办？戒指不在我手上。万一我的魔法比她的先结束呢？你们不能把戒指拿回来吗？不能从她手指上拔下来吗？我一恢复原样，就马上给她戴回去。我保证马上戴。
          emotion: fearful
        - id: ch03-b06
          speaker: jimmy
          text: 这有什么可哭的？至少你没什么值得哭。
        - id: ch03-b07
          speaker: narrator
          text: 梅布尔说话时不停吸鼻子，声音替代了所有停顿。吉米这话正是冲着那些声音说的。
        - id: ch03-b08
          speaker: princess
          text: 你不知道。你根本不知道长成我这样是什么滋味。求求你们，试着把戒指取回来吧。再说，这戒指本来也比属于你们更属于我。是我找到它，也是我先说它有魔法的。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 杰拉尔德心里那股一向都有的公平劲儿，被这番话唤醒了。
        - id: ch03-b10
          speaker: gerald
          text: 她的靴子和衣服全变了，我猜戒指也成了石头。不过我去看看。可要是取不下来，那就是取不下来，你怎么闹也没有用。
        - id: ch03-b11
          speaker: narrator
          text: 恐龙肚子里的第一根火柴亮起来，照出那枚黑沉沉的戒指，套在凯瑟琳雪白的石头手指上。她的手指直直伸着。杰拉尔德捏住戒指，没想到它轻轻一滑，就从冰凉光滑的大理石手指上脱了下来。
        - id: ch03-b12
          speaker: gerald
          text: 凯茜，老妹妹，我真难过。
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 他握了握那只大理石手，忽然想到凯瑟琳也许听得见，便把大家准备怎么办，一件一件全告诉了她。他这样说过一遍，自己也更清楚计划是什么。随后他又鼓励似的拍了拍雕像的后背。
        - id: ch03-b14
          speaker: narrator
          text: 回到杜鹃花丛以后，杰拉尔德发起号令来清楚又准确，像个天生的领袖。至少他后来是这么说的。他刚才把计划讲给凯瑟琳听时，自己也已经彻底想明白了。另外两个人什么办法都没有，所以他的计划自然被采纳。天生领袖的计划往往就是这样得到赞成的。
        - id: ch03-b15
          speaker: gerald
          text: 拿好你的宝贝戒指。现在你什么都不怕了，对吧？
        - id: ch03-b16
          speaker: princess
          text: 不怕。对呀，我竟然忘了。只要你们把外套全留给我，夜里好保暖，我就待在这儿，或者再往树林深处躲一点。这样凯瑟琳从石头里出来时，我也在她身边。
        - id: ch03-b17
          speaker: gerald
          text: 没错，这正是天生领袖的主意。你们俩回家告诉法国女教师，凯瑟琳今晚住在塔楼。她确实就住在那里。
        - id: ch03-b18
          speaker: jimmy
          text: 没错，千真万确。
        - id: ch03-b19
          speaker: gerald
          text: 魔法总是七个钟头一档。你隐身了二十一个钟头，我是十四个，伊莱扎是七个。戒指第一次变成许愿戒指时，效力也是七个钟头。可这回是哪一个数，谁也不知道，所以你们谁先恢复也说不准。
        - id: ch03-b20
          speaker: gerald
          text: 我们跟法国女教师道过晚安，就从蓄水池旁边的窗户溜出来，顺着格子架爬下去，睡前再来看你们。你最好挪到恐龙旁边，临走前我们用叶子把你盖好。
        - id: ch03-b21
          speaker: narrator
          text: 梅布尔爬到有更高树木遮蔽的地方，终于站起身来。她细得像一棵白杨，又虚假得像一道算错了的长除法答案。凭她现在的身高，要蹲在恐龙下面一点也不难。她只要弯下身体，把脑袋从怪兽腹部的洞口伸进去，就看见了凯瑟琳雪白的身影。
        - id: ch03-b22
          speaker: princess
          text: 没事的，亲爱的。我就在旁边。你一觉得自己快恢复了，马上叫我。
          emotion: calm
        - id: ch03-b23
          speaker: narrator
          text: 雕像一动不动，雕像通常都是这样。梅布尔缩回脑袋，躺下来，让大家把她盖严，随后独自留在那里。两个男孩回家去了。这是唯一合理的办法。
        - id: ch03-b24
          speaker: narrator
          text: 他们绝不能让法国女教师着急，更不能让她报警，叫警察到处搜查，人人都认为这一点很要紧。警察要是发现失踪的凯瑟琳不但在恐龙肚子里，还变成了她自己的石像，心智恐怕都会乱掉。法国女教师是外国人，心思自然更轻盈，也更经不起这种打击。至于梅布尔现在的样子，就更不能让外人看见。
        - id: ch03-b25
          speaker: gerald
          text: 嘿，瞧她现在的样子。除了我们，谁看见都得发疯。
        - id: ch03-b26
          speaker: jimmy
          text: 我们不一样。我们的脑袋早就被逼得非习惯不可了。现在想让我们发疯，可要费大劲。
        - id: ch03-b27
          speaker: gerald
          text: 不过老凯茜真可怜。
          emotion: sad
        - id: ch03-b28
          speaker: jimmy
          text: 那当然。
          emotion: sad
        - id: ch03-b29
          speaker: narrator
          text: 太阳沉到黑黝黝的树林后面，月亮升了起来。梅布尔荒唐的长身体上盖满外套、背心和长裤，躺在傍晚的寒气里安静睡着了。
        - id: ch03-b30
          speaker: narrator
          text: 恐龙肚子里，凯瑟琳也活在自己的大理石躯壳中，慢慢睡去。杰拉尔德说的话，她全听见了，点亮的火柴，她也看见了。她还是原来的凯瑟琳，只是被装进一具不能动的大理石壳子。哪怕想哭，壳子也不许她哭出来。不过她并不想哭。
        - id: ch03-b31
          speaker: narrator
          text: 大理石里面既不冷也不硬，仿佛衬着一层柔软的东西，温暖、舒服又安全。她不用弯腰，后背一点也不酸。四肢明明保持同一个姿势，几个钟头一动不动，却没有丝毫僵硬。外面的石壳冰凉坚固，里面的她却感到一切都很好，甚至比好还好。
        - id: ch03-b32
          speaker: narrator
          text: 她只要安安静静、舒舒服服地等着，就会从石壳里出来，重新变回那个自己早已习惯的凯瑟琳。她不用做任何事，也没有什么可害怕的。于是她幸福又平静地等待着。过了一会儿，等待变成不再等待，又变成什么都没有。大理石柔软的内里紧紧护着她。她安宁地睡着了，就像睡在自己的床上一样。
    - id: ch04
      title: 月光下的雕像
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 凯瑟琳醒来，是因为她发现自己并没躺在自己的床上。事实上，她根本没有躺着，而是一直站在那里。两只脚又麻又刺，两条胳膊保持着那个古怪姿势伸在外面，也是又僵又累。她揉揉眼睛，打了个呵欠，终于想起了一切。她曾经是恐龙石腹里的一尊石像。
        - id: ch04-b02
          speaker: kathleen
          text: 现在我又活过来了。我要从这里出去。
        - id: ch04-b03
          speaker: narrator
          text: 她坐下来，把双脚伸进石兽腹部泛着灰光的洞口。就在这时，身体下面的石面缓慢而长久地一歪，猛地将她掀到一边。恐龙在动。
        - id: ch04-b04
          speaker: kathleen
          text: 哦，太可怕了！一定是月光让它活过来了，真像杰拉尔德说的那样。
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 它确实在走。凯瑟琳从洞口望见草地、蕨丛和苔藓不断从下面移过去。怪兽拖着沉重的身体，一步一步往前。它还在动，她不敢跳下去，生怕那双巨脚会踩死她。
        - id: ch04-b06
          speaker: narrator
          text: 她立刻又想到了梅布尔。梅布尔是不是就在附近？要是巨脚踩中那副碍事的长身体怎么办？她长成那个样子，只要挡在路上，恐龙再小心也很难不踩中她。可恐龙根本不会小心，又为什么要小心呢？
        - id: ch04-b07
          speaker: narrator
          text: 凯瑟琳痛苦地悬在圆洞上方。巨兽的身体左右摇晃，而且越走越快。她几次想跳，却始终不敢。要是现在落到地上，那双巨脚很可能紧跟着踩过来。反正它们现在一定已经离梅布尔很远了。恐龙还在加快脚步，腹中的地面也越来越斜。凯瑟琳明白，它们正在往山坡下面走。
        - id: ch04-b08
          speaker: narrator
          text: 怪兽撞进一片常绿橡树林，枝条在它身边噼啪折断。沉重的石脚碾过碎石，咯吱作响。随后石头碰上了石头，它停了一下。附近忽然传来扑通一声，那儿正是花园里的湖。月光下，赫尔墨斯曾在那里飞舞，雅努斯和恐龙也曾一起游泳。
        - id: ch04-b09
          speaker: narrator
          text: 凯瑟琳立刻从洞口跳到池边平坦的大理石上，冲向一旁，气喘吁吁地躲进一尊雕像的底座阴影里。再慢一会儿就来不及了。她刚蹲好，巨蜥便沉重地滑进水中，压没上千片光滑明亮的睡莲叶，朝湖心的小岛游去。
        - id: ch04-b10
          speaker: phoebus
          text: 别动，小姑娘。我要跳下来了！
        - id: ch04-b11
          speaker: narrator
          text: 下一刻，福玻斯从小神殿的底座上一跃而下，越过台阶，落在两码外。
        - id: ch04-b12
          speaker: phoebus
          text: 你是新来的。要是以前见过你，我绝不会忘记。
        - id: ch04-b13
          speaker: kathleen
          text: 是的，全新，全新的。我不知道你还会说话。
        - id: ch04-b14
          speaker: phoebus
          text: 为什么不会？你不也会说话吗？
        - id: ch04-b15
          speaker: kathleen
          text: 可我是活人呀。
        - id: ch04-b16
          speaker: phoebus
          text: 难道我不是活的吗？
        - id: ch04-b17
          speaker: kathleen
          text: 哦，对，我想你也是。只是我一直以为，要先戴上戒指，才能看见你们动起来。
        - id: ch04-b18
          speaker: narrator
          text: 凯瑟琳心里乱糟糟的，却并不害怕。她的话也说得不太清楚，福玻斯似乎还是听懂了。这一点很值得称赞。
        - id: ch04-b19
          speaker: phoebus
          text: 啊，那只是凡人的规矩。生命属于我们的时间虽然很短，可在这段时间里，我们彼此都能听见，也能看见。这正是美丽魔法的一部分。
        - id: ch04-b20
          speaker: kathleen
          text: 可我就是凡人。
        - id: ch04-b21
          speaker: phoebus
          text: 你不但迷人，还很谦逊。洁白的湖水在召唤我，我去了！
        - id: ch04-b22
          speaker: narrator
          text: 福玻斯说得心不在焉，心思显然已经飞到了湖里。下一刻，太阳神雪白的双手在头顶合到一起，整个身子轻快地跃进湖中。洁白的身体没入水面，入水的地方漾起液态白银般的圆环，一圈接着一圈，在月光下越扩越大。
        - id: ch04-b23
          speaker: narrator
          text: 凯瑟琳转身朝山坡上的杜鹃花丛走。她必须找到梅布尔，两个人也必须马上回家。眼下最麻烦的，是梅布尔那个尺寸根本没法带回去。要是她已经恢复原来的大小，那就好了。在这段魔法生效的时间里，她多半已经恢复了。这个想法给凯瑟琳添了些勇气，她沿着山坡急忙往前赶。
        - id: ch04-b24
          speaker: narrator
          text: 穿过杜鹃花丛时，她想起那张曾从油亮叶子间探出来的彩绘纸脸。她本以为自己会怕，却一点也没怕。她没费多少力气就找到了梅布尔，只是原因并不像她希望的那样。
        - id: ch04-b25
          speaker: narrator
          text: 隔着很远，她便借月光看见那条长虫似的身影。整整十二英尺的身体完全伸展开来，上面盖满外套、长裤和背心。梅布尔看起来像一根到了冬天便裹上麻袋防冻的排水管。凯瑟琳走到近前，轻轻碰了碰她那张长脸，她醒了。
        - id: ch04-b26
          speaker: princess
          text: 怎么了？
        - id: ch04-b27
          speaker: kathleen
          text: 是我。
        - id: ch04-b28
          speaker: princess
          text: 你的手怎么这么冷？
        - id: ch04-b29
          speaker: kathleen
          text: 醒醒，我们说说话。
        - id: ch04-b30
          speaker: princess
          text: 现在还不能回家吗？我累极了，离喝茶的时间已经过去好久啦。
        - id: ch04-b31
          speaker: kathleen
          text: 你还是太长，没法回家。
          emotion: sad
        - id: ch04-b32
          speaker: narrator
          text: 梅布尔这才记起自己的处境。她闭着眼躺了一会儿，忽然动了起来。
        - id: ch04-b33
          speaker: princess
          text: 哦，凯茜，我觉得好古怪。就像那种角蛇玩具，得把它缩短了，才能塞回盒子。我正在……对，我知道，我正在变短！
          emotion: surprised
        - id: ch04-b34
          speaker: narrator
          text: 她真的在缩短。凯瑟琳看着她，也觉得那情形像一个孩子合拢双手，把一条螺旋角蛇慢慢压短，好塞回盒子。梅布尔远在别处的双脚一点一点靠近，瘦长的胳膊越来越短，那张曾经有半码长的脸也跟着缩了回来。
        - id: ch04-b35
          speaker: kathleen
          text: 你在恢复，真的在恢复！哦，我太高兴了！
          emotion: happy
        - id: ch04-b36
          speaker: princess
          text: 我知道。
        - id: ch04-b37
          speaker: narrator
          text: 话一说完，她又成了梅布尔。不只里面是梅布尔，那一点她从来没有改变，外面也终于恢复成了大家熟悉的梅布尔。十二英尺长的怪样子彻底消失了。
        - id: ch04-b38
          speaker: kathleen
          text: 你没事了，太好了！我真高兴。我们现在马上回家吧，亲爱的。
          emotion: happy
        - id: ch04-b39
          speaker: princess
          text: 回家？你想就这样回去？
        - id: ch04-b40
          speaker: narrator
          text: 梅布尔慢慢坐起来，乌黑的大眼睛直盯着凯瑟琳。
        - id: ch04-b41
          speaker: kathleen
          text: 什么叫就这样？
        - id: ch04-b42
          speaker: narrator
          text: 凯瑟琳已经有些不耐烦了。
        - id: ch04-b43
          speaker: princess
          text: 当然是你现在这个样子。
        - id: ch04-b44
          speaker: kathleen
          text: 我好得很。走吧。
        - id: ch04-b45
          speaker: princess
          text: 难道你还不知道？看看你自己，看看你的手、裙子，还有所有地方。
        - id: ch04-b46
          speaker: narrator
          text: 凯瑟琳低头看自己的手。那双手是大理石般的白色，而且没有一点活人的颜色。再往下看，裙子也是同一种白。她的鞋、袜子，甚至每一根头发的发梢，也都白得没有一点别的颜色。她从头到脚白得像刚刚落下的新雪。
        - id: ch04-b47
          speaker: kathleen
          text: 这是怎么回事？我为什么全身都是这种讨厌的颜色？
          emotion: fearful
        - id: ch04-b48
          speaker: narrator
          text: 看清自己全身的样子以后，她的身体不由自主地发起抖来。
        - id: ch04-b49
          speaker: princess
          text: 你还不明白吗？哦，凯茜，你还没明白吗？你并没有恢复，还是一尊雕像。
          emotion: sad
        - id: ch04-b50
          speaker: kathleen
          text: 我才不是。我活着，还在跟你说话呢。
        - id: ch04-b51
          speaker: princess
          text: 我知道你活着，亲爱的。那是因为现在有月光。
          emotion: calm
        - id: ch04-b52
          speaker: narrator
          text: 梅布尔像安抚一个闹脾气的孩子那样安抚她。
        - id: ch04-b53
          speaker: kathleen
          text: 可你明明看得出我活着。
        - id: ch04-b54
          speaker: princess
          text: 当然看得出，因为我戴着戒指。
        - id: ch04-b55
          speaker: kathleen
          text: 可我已经好了，我自己知道。
        - id: ch04-b56
          speaker: princess
          text: 你真的还不懂吗？
        - id: ch04-b57
          speaker: narrator
          text: 梅布尔轻轻握住她雪白的大理石手。
        - id: ch04-b58
          speaker: princess
          text: 你并没有好。现在有月光，而你还是一尊雕像，所以才跟花园里其他雕像一样，在月光下活了过来。你现在能走、能说，也能感觉，可这不等于你已经恢复。等月亮落下，你还会变回一尊普通石像，一动也不能动。这才是我们不能回家的难处，亲爱的。你仍是一尊雕像，只不过现在跟别的大理石东西一起活了。对了，恐龙在哪儿？
          emotion: calm
        - id: ch04-b59
          speaker: kathleen
          text: 在它的浴池里，其他石兽也全在那里。
        - id: ch04-b60
          speaker: princess
          text: 好吧，那我们至少还有一件值得庆幸的事！
