  chapters:
    - id: ch01
      title: CHAPTER IX
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There is a curtain between the world of magic and the world we call real. It is fine as gossamer, clear as glass, and strong as iron. But here and there it has a weak spot, marked by a magic ring or an amulet. Once someone finds such a spot, almost anything can happen.
        - id: ch01-b02
          speaker: narrator
          text: That was why Mabel and Kathleen suddenly longed to return to the Temple of Flora. They were in the middle of the dullest dolls' tea party either of them had ever attended. The little tea things were still unwashed, and half the raisins were uneaten. Even so, the girls got up and went. Magic pulled them on against their better judgment and almost against their will.
        - id: ch01-b03
          speaker: narrator
          text: The nearer they came to the temple through the golden stillness of the afternoon, the more certain they felt that they could not have chosen otherwise.
        - id: ch01-b04
          speaker: narrator
          text: This explains what happened next. Gerald and Jimmy stood hand in hand in the dark passage and gave their first great shout together, simply for the fun of it. An answering shout came at once from outside. A line of daylight appeared in the very part of the passage where they had least expected a door. The stone itself swung slowly open. The boys came out into the Temple of Flora, blinking helplessly in the good daylight. They made no attempt to resist Kathleen's hugs, while Mabel poured questions over them.
        - id: ch01-b05
          speaker: mabel
          text: So you left that Ugly-Wugly wandering loose in London? You might have wished for it to come with you too.
        - id: ch01-b06
          speaker: gerald
          text: It can stay exactly where it is. I couldn't remember everything, and I certainly didn't want that thing coming along. Now we'll go home and seal the ring inside an envelope.
        - id: ch01-b07
          speaker: kathleen
          text: But I haven't used the ring yet.
        - id: ch01-b08
          speaker: gerald
          text: Once you've seen what it does to people, I shouldn't think you'd want to.
        - id: ch01-b09
          speaker: kathleen
          text: It wouldn't do things like that if I were the one making the wish.
        - id: ch01-b10
          speaker: mabel
          text: Listen. Why don't we put it back in the treasure room and be finished with it? I never should have taken it. It really is stealing, just as much as when Eliza borrowed it to amaze her young man.
        - id: ch01-b11
          speaker: gerald
          text: I don't mind putting it back. But if one of us thinks of a sensible wish later, we can take it out again, can't we?
        - id: ch01-b12
          speaker: mabel
          text: Of course we can.
        - id: ch01-b13
          speaker: narrator
          text: They all went up to the castle. Mabel pressed the hidden spring once more. The panelling dropped away, the jewels shone out, and the ring went back among the odd, dull ornaments that Mabel had once claimed were magical.
        - id: ch01-b14
          speaker: gerald
          text: It looks so harmless there. You'd never think that foolish old ring had any magic in it. I wonder whether you were right about the other things too. Suppose we test them.
        - id: ch01-b15
          speaker: kathleen
          text: Please don't. Magic things are spiteful. They seem to enjoy landing you in dreadful trouble.
        - id: ch01-b16
          speaker: mabel
          text: I'd like to try, only everything has been so upsetting that I've forgotten what I said each thing could do.
        - id: ch01-b17
          speaker: narrator
          text: The others had forgotten too. Perhaps that was why none of their experiments worked. Gerald laid a bronze buckle on his foot and announced that it would act like seven-league boots. It did not carry him a single step. Jimmy still clung to a little of the City gentleman he had recently been. He fastened on a steel collar and said it would make sure there was always money in his pockets. His pockets remained as empty as before. Mabel and Kathleen chose one ring after another, then chains and brooches. They invented the most delightful powers for every one of them. Not one ornament did anything at all.
        - id: ch01-b18
          speaker: mabel
          text: It must be only the ring that's magic. But wait!
        - id: ch01-b19
          speaker: jimmy
          text: What is it?
        - id: ch01-b20
          speaker: mabel
          text: What if even the ring isn't magic?
        - id: ch01-b21
          speaker: gerald
          text: We know it is.
        - id: ch01-b22
          speaker: mabel
          text: I don't know any such thing. Perhaps today isn't today at all. Perhaps it's still the other day, when I first made up that nonsense about the ring, and we've only dreamed everything since.
        - id: ch01-b23
          speaker: gerald
          text: It can't be. You were wearing your Princess clothes then.
        - id: ch01-b24
          speaker: mabel
          text: What Princess clothes?
        - id: ch01-b25
          speaker: narrator
          text: Her dark eyes opened very wide.
        - id: ch01-b26
          speaker: gerald
          text: Oh, don't be ridiculous.
        - id: ch01-b27
          speaker: mabel
          text: I'm not being ridiculous, and I think it's time you went home. Jimmy must want his tea.
        - id: ch01-b28
          speaker: jimmy
          text: Of course I want tea. But you did have those Princess clothes that day. Come on. We'll close the shutters and leave the ring in its long home.
        - id: ch01-b29
          speaker: mabel
          text: What ring?
        - id: ch01-b30
          speaker: gerald
          text: Don't mind her. She's only trying to be funny.
        - id: ch01-b31
          speaker: mabel
          text: No, I'm not. I'm inspired, like a Python or one of those Sibylline ladies. What ring?
        - id: ch01-b32
          speaker: kathleen
          text: The wishing ring. The ring that made us invisible.
        - id: ch01-b33
          speaker: mabel
          text: Now don't you see? The ring becomes whatever you say it is. That's why it made us invisible. I said it would! We can't leave it here if it's as valuable as that. Taking it isn't really stealing now. Go on, say what it is.
        - id: ch01-b34
          speaker: jimmy
          text: It's a wishing ring.
        - id: ch01-b35
          speaker: mabel
          text: We've tried that already, and you wasted your wish. I say it is not a wishing ring. I say it makes whoever wears it four yards tall.
        - id: ch01-b36
          speaker: narrator
          text: Mabel snatched up the ring as she spoke. Before the last words were out, the ring rose high above the children's heads on the finger of an impossible Mabel. She was twelve feet tall.
        - id: ch01-b37
          speaker: gerald
          text: Now you've done it!
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: He was right. Mabel tried saying that the ring was a wishing ring, but it plainly was not. It had become exactly what she had declared it to be.
        - id: ch01-b39
          speaker: gerald
          text: And you have no idea how long this will last. Remember the invisibility. This might go on for days.
        - id: ch01-b40
          speaker: kathleen
          text: Oh, Mabel, that was a silly thing to do!
        - id: ch01-b41
          speaker: mabel
          text: Yes, go on, make it worse. You should have believed me when I explained how the ring worked. Then I wouldn't have needed to prove it, and I wouldn't be this absurd size. What am I supposed to do now?
          emotion: angry
        - id: ch01-b42
          speaker: gerald
          text: We'll hide you until you shrink back. That's all.
        - id: ch01-b43
          speaker: mabel
          text: Yes, but where?
        - id: ch01-b44
          speaker: narrator
          text: Mabel stamped a foot that was two feet long.
        - id: ch01-b45
          speaker: gerald
          text: One of the empty rooms. You wouldn't be frightened, would you?
        - id: ch01-b46
          speaker: mabel
          text: Of course not. Oh, I wish we'd simply put the ring back and gone away.
        - id: ch01-b47
          speaker: jimmy
          text: Well, we weren't the ones who refused.
        - id: ch01-b48
          speaker: mabel
          text: I'll put it back now.
        - id: ch01-b49
          speaker: narrator
          text: She pulled at the ring.
        - id: ch01-b50
          speaker: gerald
          text: I wouldn't do that. You don't want to remain that length forever, do you? When the magic ends, the ring may need to be on your finger before it can change you back.
        - id: ch01-b51
          speaker: narrator
          text: The towering Mabel pressed the spring in a sulky way. The panels slid shut and hid every shining jewel. Again the room was only an empty, sunlit, eight-sided room with wooden walls.
        - id: ch01-b52
          speaker: mabel
          text: Now where am I going to hide? At least Auntie said I could spend the night with you. One of you will have to stay with me. I'm not being left alone while I'm this ridiculous height.
        - id: ch01-b53
          speaker: narrator
          text: Height was certainly the word. Mabel had said four yards, and four yards was precisely what she got. Yet she was hardly any wider than when she had been only four feet seven. Gerald called the result wonderfully worm-like. Her clothes had grown with her, of course, so she still looked like a little girl, only one stretched in a long curved mirror. It was the kind of mirror that makes stout people delightfully slim and already slim people sadly thin. When she suddenly sat on the floor, her tall narrow body folded like a four-part ruler closing joint by joint.
        - id: ch01-b54
          speaker: gerald
          text: There's no use sitting there.
        - id: ch01-b55
          speaker: mabel
          text: I'm not sitting here. I only came down so I could fit through the door. I suppose I'll have to crawl on my hands and knees almost everywhere now.
        - id: ch01-b56
          speaker: jimmy
          text: Aren't you hungry?
        - id: ch01-b57
          speaker: mabel
          text: I don't know. My stomach feels such a long way away.
        - id: ch01-b58
          speaker: gerald
          text: I'll scout ahead. If no one's about...
        - id: ch01-b59
          speaker: mabel
          text: Wait. I'd rather stay outdoors until dark.
        - id: ch01-b60
          speaker: gerald
          text: You can't. Someone is sure to see you.
        - id: ch01-b61
          speaker: mabel
          text: Not if I use the yew hedge. It has a passage inside it, like the box hedge in The Luck of the Vails.
        - id: ch01-b62
          speaker: jimmy
          text: The luck of what?
        - id: ch01-b63
          speaker: mabel
          text: The Luck of the Vails. It's a splendid book. It was what made me start hunting for secret doors in panels. I can creep along the hedge on my front, like a snake. It comes out among the rhododendrons beside the dinosaurus. We could camp there.
        - id: ch01-b64
          speaker: gerald
          text: But what about tea? I haven't had dinner.
        - id: ch01-b65
          speaker: jimmy
          text: Tea is exactly what we haven't got. I missed dinner too.
        - id: ch01-b66
          speaker: mabel
          text: Oh, you won't abandon me, will you? I'll write to Auntie. If she's there and awake, she'll give you food for a picnic. If she isn't, one of the maids will.
        - id: ch01-b67
          speaker: narrator
          text: On a page from Gerald's invaluable pocketbook, Mabel wrote a note. She asked Auntie for picnic food and said Gerald would collect it. She explained that she was a little tired and thought she had been growing rather fast. Then she added a postscript asking for plenty, because some of them were very hungry.
        - id: ch01-b68
          speaker: narrator
          text: Mabel could creep through the tunnel in the yew hedge, though it was difficult and painfully slow. Kathleen and Jimmy helped her as far as the rhododendrons. Then Gerald went off for food. The three had barely managed to settle themselves among the bushes before they began wondering bitterly what on earth he could be doing for so long. At last he returned, bent and panting beneath the weight of a large covered basket. He let it fall onto the fine carpet of grass, straightened himself with a groan, and declared that the load had been worth carrying.
        - id: ch01-b69
          speaker: gerald
          text: It was worth carrying. Where is Mabel?
        - id: ch01-b70
          speaker: narrator
          text: Mabel's long, pale face appeared close to the ground among the rhododendron leaves.
        - id: ch01-b71
          speaker: mabel
          text: From here I look like anyone else, don't I? The rest of me is miles away under all those other bushes.
        - id: ch01-b72
          speaker: kathleen
          text: We've hidden the parts between the bushes with ferns and leaves. Don't wriggle, Mabel, or you'll shake them all off.
        - id: ch01-b73
          speaker: narrator
          text: Jimmy was already unpacking. It was a splendid tea. There was a long loaf, butter wrapped in a cabbage leaf, milk, water, cake, and a box of large, smooth, yellow gooseberries. The box had once held an extra-large bottle of someone's matchless treatment for hair and moustaches.
        - id: ch01-b74
          speaker: narrator
          text: Mabel carefully stretched her astonishing arms out from the leaves and leaned on one thin elbow. Gerald cut bread and butter. Whenever Mabel asked, Kathleen ran around the bushes to make sure none of her faraway parts had lost their green covering. Then everyone ate in a happy, hungry silence. It was broken only by a few heartfelt calls.
        - id: ch01-b75
          speaker: mabel
          text: More cake, please.
        - id: ch01-b76
          speaker: gerald
          text: Pass the milk this way.
        - id: ch01-b77
          speaker: jimmy
          text: Toss us the gooseberries.
        - id: ch01-b78
          speaker: narrator
          text: Soon everyone felt calmer and much better pleased with whatever life had given them. The sharp edge of hunger was gone. A pleasant feeling crept slowly through the party, half the heaviness of being tired and half the ease of being able to rest. It reached even poor Mabel's furthest parts. She could feel it in her distant feet, which lay neatly crossed beneath the third rhododendron to the north-north-west of the picnic itself.
        - id: ch01-b79
          speaker: gerald
          text: I feel like a new person, but I couldn't manage one more gooseberry even if you paid me.
        - id: ch01-b80
          speaker: mabel
          text: I could. I know they're gone, and I had my fair share. But I could still eat another. I suppose it's because there's so much of me now.
        - id: ch01-b81
          speaker: narrator
          text: A delicious peace filled the summer air after the meal. No one needed to hurry or worry for that one quiet moment. Not far away, the enormous grey dinosaurus showed through the shrubs, with green lichen spread across its ancient stone. It too seemed peaceful, full, and happy. Gerald stretched himself comfortably on the grass. Through a gap in the foliage, he caught sight of the creature's stone eye. Somehow its fixed glance looked understanding and sympathetic.
        - id: ch01-b82
          speaker: gerald
          text: I expect he enjoyed a good meal in his time.
        - id: ch01-b83
          speaker: jimmy
          text: Who did?
        - id: ch01-b84
          speaker: gerald
          text: The dino-whatever-you-call-it.
        - id: ch01-b85
          speaker: kathleen
          text: He had a meal today.
        - id: ch01-b86
          speaker: narrator
          text: Kathleen giggled, and Mabel joined her.
        - id: ch01-b87
          speaker: kathleen
          text: Don't laugh anywhere below your chest, Mabel, or you'll shake off your leafy covering.
        - id: ch01-b88
          speaker: jimmy
          text: What do you mean about it having a meal? What are you two sniggering over?
        - id: ch01-b89
          speaker: kathleen
          text: It had a proper meal. Things went inside its stomach.
        - id: ch01-b90
          speaker: jimmy
          text: Be funny if you like. Jerry and I don't care whether you tell us.
        - id: ch01-b91
          speaker: gerald
          text: I care desperately. Wake me when you've finished pretending you'll keep it secret.
        - id: ch01-b92
          speaker: narrator
          text: Gerald tipped his hat over his eyes and lay back as if asleep.
        - id: ch01-b93
          speaker: kathleen
          text: Oh, don't be stupid. We only fed the dinosaurus through the hole in its stomach. We put in all the clothes we used to make the Ugly-Wuglies.
        - id: ch01-b94
          speaker: gerald
          text: Then we can take the clothes home. That's one problem settled.
        - id: ch01-b95
          speaker: narrator
          text: He chewed the white end of a grass stalk.
        - id: ch01-b96
          speaker: kathleen
          text: I've just thought of something. Let me hold the ring for a little while. I won't tell you my idea unless it works, because otherwise you'll all call me silly. I'll give it back before we leave.
        - id: ch01-b97
          speaker: mabel
          text: You're not leaving yet, are you? Still, of course you may try your idea, no matter how silly it is.
        - id: ch01-b98
          speaker: narrator
          text: Mabel sounded most sincere as she pulled off the ring.
        - id: ch01-b99
          speaker: narrator
          text: Kathleen's plan was simple. Perhaps the ring would change its power if someone who was not under its enchantment gave it a new name. The moment it passed from Mabel's long, pale hand into Kathleen's warm red one, Kathleen jumped up.
        - id: ch01-b100
          speaker: kathleen
          text: Let's go and empty the dinosaurus now!
        - id: ch01-b101
          speaker: narrator
          text: She ran toward the prehistoric monster before the others could follow. Her plan depended on saying the secret words aloud without letting any of them hear. While she ran, she declared that this was a wishing ring and that it would grant any wish its wearer chose. Her voice reached only the birds, one or two squirrels, and perhaps a stone faun. As Kathleen raced past its pedestal, the faun's pretty carved face seemed to turn after her with a laughing look.
        - id: ch01-b102
          speaker: narrator
          text: The path went uphill in the sun. Kathleen ran as hard as she could, though her brothers caught her before she reached the dinosaurus's great black shadow. By then she was very hot and in no condition to choose a wish calmly.
        - id: ch01-b103
          speaker: kathleen
          text: I'll climb inside and push the clothes down. I remember exactly where I left everything.
        - id: ch01-b104
          speaker: narrator
          text: Gerald bent to give her a step, and Jimmy helped her scramble up. She vanished through the hole into the monster. A shower of clothes soon fell from it. Empty waistcoats dropped first, then trousers with legs waving wildly, and coats with sleeves flapping loose.
        - id: ch01-b105
          speaker: kathleen
          text: Mind your heads down there!
        - id: ch01-b106
          speaker: narrator
          text: Walking sticks, golf clubs, hockey sticks, and broom handles came rattling and clattering after the clothes.
        - id: ch01-b107
          speaker: jimmy
          text: Come on, then.
        - id: ch01-b108
          speaker: gerald
          text: Wait a moment. I'm coming up.
        - id: ch01-b109
          speaker: narrator
          text: Gerald caught the rim of the opening and jumped. Just as his shoulders passed through and his knees reached the edge, he heard Kathleen's boots moving inside.
        - id: ch01-b110
          speaker: kathleen
          text: It's wonderfully cool in here. I suppose statues are always cool. I wish I were a statue. Oh!
        - id: ch01-b111
          speaker: narrator
          text: Her last cry held horror and pain. It ended at once in a dreadful stone silence.
        - id: ch01-b112
          speaker: gerald
          text: Cathy? What's happened?
        - id: ch01-b113
          speaker: narrator
          text: In his heart, Gerald knew. He climbed into the hollow monster. A dim light rose through the hole, and something white stood against the grey stone wall. Still on his knees, Gerald searched his pockets and struck a match. The blue flame turned yellow. Then he saw what he had feared.
        - id: ch01-b114
          speaker: narrator
          text: Kathleen's face was white, hard, and lifeless. Her hair was white. Her hands were white, and so were her clothes and shoes. There was no colour left anywhere. Everything had the hard, cold whiteness of marble. Gerald had known what the match would show even before the flame grew clear enough to show it. Kathleen had received her careless wish exactly. She stood before him as a statue.
        - id: ch01-b115
          speaker: narrator
          text: For one long moment, perfect stillness filled the inside of the dinosaurus. Gerald could not speak. The change had come too quickly and was too terrible. It felt worse than anything magic had done to them before. At last he turned away from that cold stone silence. He leaned over the opening toward Jimmy, who waited below in a world that was green and sunny, where leaves rustled and everything was alive. Gerald forced himself to speak in perfectly ordinary, matter-of-fact tones.
        - id: ch01-b116
          speaker: gerald
          text: Jimmy, Kathleen told the ring it was a wishing ring. Now I understand why she ran ahead. Then the little idiot wished herself into a statue.
        - id: ch01-b117
          speaker: jimmy
          text: Has she really turned into one?
        - id: ch01-b118
          speaker: gerald
          text: Come up and see.
        - id: ch01-b119
          speaker: narrator
          text: Jimmy jumped while Gerald pulled, and together they got him inside.
        - id: ch01-b120
          speaker: jimmy
          text: She really is stone. This is awful.
          emotion: fearful
        - id: ch01-b121
          speaker: gerald
          text: No, it isn't. Come on. We must tell Mabel.
        - id: ch01-b122
          speaker: narrator
          text: The boys went back to Mabel, who had wisely kept her great length hidden among the rhododendrons. They gave her the news with all the sudden force of a bottle shattered by a pistol shot.
        - id: ch01-b123
          speaker: mabel
          text: Oh, goodness! What can happen next? Oh, goodness!
          emotion: fearful
        - id: ch01-b124
          speaker: narrator
          text: She twisted from head to foot. Leaves and ferns fell away in little showers, and the sun struck hot against the backs of her legs.
        - id: ch01-b125
          speaker: gerald
          text: She'll change back. It's going to be all right.
        - id: ch01-b126
          speaker: mabel
          text: But what about me? Kathleen has the ring, and my spell will end before hers. Can you take it off her hand? I'll put it back the very instant I'm my proper size again. I promise.
        - id: ch01-b127
          speaker: jimmy
          text: There's no reason for you to cry. Not over what has happened to you, anyway.
        - id: ch01-b128
          speaker: mabel
          text: You have no idea what it feels like to be this long. Please try to get the ring. It belongs more to me than to any of you. I found it, and I was the one who first said it was magic.
          emotion: sad
        - id: ch01-b129
          speaker: narrator
          text: Mabel's appeal woke Gerald's strong sense of justice.
        - id: ch01-b130
          speaker: gerald
          text: I expect the ring has turned to stone too. Her boots and clothes did. But I'll look. If I can't move it, I can't, and there will be no sense in making a fuss.
        - id: ch01-b131
          speaker: narrator
          text: Back inside the dinosaurus, Gerald struck another match. The ring showed dark against Kathleen's white stone hand. Her fingers pointed straight out. To his surprise, the ring slid easily from the smooth, cold marble.
        - id: ch01-b132
          speaker: gerald
          text: Oh, Cathy, I'm so sorry.
          emotion: sad
        - id: ch01-b133
          speaker: narrator
          text: He squeezed her marble hand as if it were still warm. Then it occurred to him that perhaps Kathleen could hear every word. He carefully told the statue what he and the others meant to do next. Explaining the plan to her helped him sort out his own ideas until they seemed quite clear. Before leaving, he gave the statue a hearty, encouraging thump on its marble back. He returned to the rhododendrons ready to issue orders with what he later described as the clear precision of a born leader. Since neither Jimmy nor Mabel had thought of any plan at all, Gerald's plan was accepted in the usual way that born leaders' plans are accepted.
        - id: ch01-b134
          speaker: gerald
          text: Here is your precious ring. You aren't afraid of anything, are you?
        - id: ch01-b135
          speaker: mabel
          text: No. I'd forgotten about that. I can stay here, or farther into the wood, if you leave me all the coats to keep me warm tonight. Then I'll be nearby when Kathleen comes out of the stone.
        - id: ch01-b136
          speaker: gerald
          text: Yes. That was exactly my born leader's plan. You two must go home and tell Mademoiselle that Kathleen is staying at the Towers. It will even be true.
        - id: ch01-b137
          speaker: jimmy
          text: It certainly will.
        - id: ch01-b138
          speaker: gerald
          text: The magic seems to last in groups of seven hours. Mabel was invisible for twenty-one, I was affected for fourteen, and Eliza for seven. The first wishing-ring spell lasted seven. But we can't know how many hours these spells will take, so we don't know which of you will change back first. Jimmy and I will say good night to Mademoiselle. Then we'll slip out through the cistern window, climb down the trellis, and check on you before bed. Mabel, come closer to the dinosaurus. We'll cover you in leaves before we go.
        - id: ch01-b139
          speaker: narrator
          text: Mabel crawled among the taller trees. There she stood, as slim as a poplar and as unreal as a wrong answer in a long-division sum. She could easily crouch beneath the dinosaurus and lift her head through the opening to look at the white figure of Kathleen.
        - id: ch01-b140
          speaker: mabel
          text: It's all right, dear. I'll be very close. Call me the moment you feel yourself changing back.
          emotion: calm
        - id: ch01-b141
          speaker: narrator
          text: The statue gave no answer and did not move. Statues generally do neither. Mabel lowered her head from the opening, stretched herself along the ground, and let the others cover her before they left. The boys went home because it was the only sensible thing to do. Mademoiselle must not become anxious and send the police searching for them. Imagine the shock to any constable of finding missing Kathleen inside the stomach of a dinosaurus and, beyond that, finding her as a stone statue of herself. Such a discovery might have unsettled his mind completely. The children thought it might be even harder on Mademoiselle, since they supposed a foreign mind must be lighter and easier to upset.
        - id: ch01-b142
          speaker: gerald
          text: And if anyone saw Mabel as she is now, it would drive them out of their senses. Anyone except us, that is.
        - id: ch01-b143
          speaker: jimmy
          text: We're different. Our senses have had plenty of practice. It would take a great deal to upset us now.
        - id: ch01-b144
          speaker: gerald
          text: Poor old Cathy, though.
          emotion: sad
        - id: ch01-b145
          speaker: jimmy
          text: Yes. Poor Cathy.
          emotion: sad
        - id: ch01-b146
          speaker: narrator
          text: The sun disappeared behind the black trees, and the moon rose. Mabel slept quietly in the cold evening. Coats, waistcoats, and trousers lay along her ridiculous length. Inside the dinosaurus, Kathleen slept too, alive within her marble.
        - id: ch01-b147
          speaker: narrator
          text: She had heard Gerald speak and had watched the brief light of his matches. Inside, she was still Kathleen in every way, with all her thoughts and feelings unchanged. The only difference was the marble case around her, which would not let her move. It would not even have allowed her to cry, if she had wanted to cry. But she did not want to. From within, the marble felt neither hard nor cold. It seemed to have a soft lining of warmth, comfort, and safety. Her back did not ache from the way she stood. Her arms and legs were not stiff, though they had remained perfectly still for hours.
        - id: ch01-b148
          speaker: narrator
          text: Everything felt well, and more than well. Kathleen knew she had only to wait quietly and comfortably. In time she would come out of the stone case and once again become the Kathleen she had always been accustomed to being. She settled into that certainty and waited happily. Little by little, waiting changed into not waiting, and then into not anything at all. Held close inside the soft inwardness of the marble, she slept as peacefully and calmly as though she really had been tucked into her own bed.
        - id: ch01-b149
          speaker: narrator
          text: Kathleen woke because she was not in her own bed. In fact, she was not lying down at all. She was standing, with pins and needles in her feet. Her outstretched arms felt stiff and tired. She rubbed her eyes, yawned, and remembered. She had been a statue inside the stone dinosaurus.
        - id: ch01-b150
          speaker: kathleen
          text: I'm alive again. Now I'll climb out.
        - id: ch01-b151
          speaker: narrator
          text: She sat and pushed her feet through the opening, which looked faintly grey in the creature's belly. Then a long, slow sway threw her sideways across the stone. The dinosaurus was moving.
        - id: ch01-b152
          speaker: kathleen
          text: Oh, how dreadful! It must be moonlight, and the dinosaurus has come alive, just as Gerald said.
          emotion: fearful
        - id: ch01-b153
          speaker: narrator
          text: It certainly was moving. Through the hole she saw grass, ferns, and moss passing below as the great beast lumbered along. She dared not drop out while those gigantic feet were moving. One of them might crush her.
        - id: ch01-b154
          speaker: narrator
          text: With that fear came another, even worse one. Where was Mabel? She had been somewhere nearby, stretched across the ground. What if one of those vast stone feet planted itself on some part of her inconvenient length? At Mabel's present size, it would be very difficult not to step on her, even for someone who was watching carefully and trying not to. The dinosaurus would not watch. It would not try. Why should a stone monster care where it put its feet?
        - id: ch01-b155
          speaker: narrator
          text: Kathleen hung over the round opening in agony while the huge beast swung from side to side. It began to move faster, and there was no longer any hope of jumping safely. She comforted herself that they must at least have left Mabel behind by now. The dinosaurus went faster still. The floor of its stomach sloped beneath Kathleen as they headed downhill. Twigs cracked and broke when it forced a path through a belt of evergreen oaks. Then came the hard crunch and grind of gravel under its stone feet. At last stone struck against stone, and the creature paused.
        - id: ch01-b156
          speaker: narrator
          text: A splash followed. They had reached the lake where Hermes fluttered by moonlight and Janus and the dinosaurus swam together. Kathleen dropped through the opening onto the flat marble edge of the pool. She darted aside and stood panting in the shadow of a statue's pedestal. She was just in time. The monster slid heavily into the water, drowning a thousand smooth lily pads, and swam toward the island in the middle.
        - id: ch01-b157
          speaker: phoebus
          text: Stand still, little lady. I am about to leap!
        - id: ch01-b158
          speaker: narrator
          text: The voice came from above her. A moment later, Phoebus sprang from the pedestal in his little temple. He cleared the steps and landed a few yards away.
        - id: ch01-b159
          speaker: phoebus
          text: You are new here. If I had ever seen you before, I would not have forgotten.
        - id: ch01-b160
          speaker: kathleen
          text: I am completely new. And I never knew you could speak.
        - id: ch01-b161
          speaker: phoebus
          text: Why shouldn't I? You can speak.
        - id: ch01-b162
          speaker: narrator
          text: Phoebus laughed.
        - id: ch01-b163
          speaker: kathleen
          text: But I'm alive.
        - id: ch01-b164
          speaker: phoebus
          text: And am I not alive?
        - id: ch01-b165
          speaker: kathleen
          text: Oh, yes, I suppose you are. I only thought I needed the ring before I could even see you move.
        - id: ch01-b166
          speaker: narrator
          text: Kathleen was distracted rather than afraid, and her explanation was not very clear. To his credit, Phoebus understood her.
        - id: ch01-b167
          speaker: phoebus
          text: Ah, the ring is for mortals. We stone beings can always see and hear one another during these few moments when life belongs to us. That is part of the beautiful enchantment.
        - id: ch01-b168
          speaker: kathleen
          text: But I am a mortal.
        - id: ch01-b169
          speaker: phoebus
          text: You are as modest as you are charming. The white water is calling me. I must go!
        - id: ch01-b170
          speaker: narrator
          text: He spoke rather absently. Then the Sun-god dived. His white hands struck the lake, and rings of liquid silver spread wider and wider across the water.
        - id: ch01-b171
          speaker: narrator
          text: Kathleen turned uphill toward the rhododendrons. She had to find Mabel, and then they must go home at once. Perhaps at this enchanted hour Mabel had returned to a size that could conveniently be taken home. The thought gave Kathleen hope, and she hurried on.
        - id: ch01-b172
          speaker: narrator
          text: As Kathleen passed through the bushes, she remembered the pointed, painted paper face that had once peered from those glossy leaves. She expected the memory to frighten her, but it did not. Finding Mabel was easy. In fact, it was much easier than it would have been if Mabel had become the size Kathleen hoped to find. From quite a long way off, moonlight revealed that pale, worm-like body extended to all of its twelve feet. Coats, trousers, and waistcoats lay over it in a broken covering. Mabel looked exactly like a drainpipe someone had wrapped in sacks to protect it from winter frost.
        - id: ch01-b173
          speaker: narrator
          text: Kathleen gently touched Mabel's long cheek. Mabel woke.
        - id: ch01-b174
          speaker: mabel
          text: What's happening?
        - id: ch01-b175
          speaker: kathleen
          text: It's only me.
        - id: ch01-b176
          speaker: mabel
          text: Your hands are so cold.
        - id: ch01-b177
          speaker: kathleen
          text: Wake up properly. We need to talk.
        - id: ch01-b178
          speaker: mabel
          text: Can't we go home now? I'm terribly tired, and tea was ages ago.
        - id: ch01-b179
          speaker: kathleen
          text: You're still too long to take home.
          emotion: sad
        - id: ch01-b180
          speaker: narrator
          text: Then Mabel remembered. She lay with her eyes shut. Suddenly her whole body moved, and she cried out.
        - id: ch01-b181
          speaker: mabel
          text: Oh, Cathy, I feel so strange! It's like one of those horn snakes when you press it short enough to fit inside its box. I am changing. Yes, I can feel it!
          emotion: surprised
        - id: ch01-b182
          speaker: narrator
          text: She was right, and Kathleen could see every part of the change. Mabel shortened exactly like a spiral horn snake when a child presses it between closing hands to put it away. Her distant feet began to slide nearer and nearer. Her long, thin arms drew themselves in. Her stretched body gathered back into its familiar shape. Last of all, Mabel's face was no longer half a yard from forehead to chin.
        - id: ch01-b183
          speaker: kathleen
          text: You're coming right! You really are. Oh, I'm so glad!
          emotion: happy
        - id: ch01-b184
          speaker: mabel
          text: I know I am.
        - id: ch01-b185
          speaker: narrator
          text: As she said it, she became Mabel again. She had always remained Mabel inside, of course. Now she looked like herself outside as well.
        - id: ch01-b186
          speaker: kathleen
          text: You're all right! Hooray! I'm so glad. Now we can go straight home, dear.
          emotion: happy
        - id: ch01-b187
          speaker: mabel
          text: Go home? You mean go home while you look like that?
        - id: ch01-b188
          speaker: narrator
          text: Mabel sat up slowly and stared with her large dark eyes.
        - id: ch01-b189
          speaker: kathleen
          text: Look like what?
        - id: ch01-b190
          speaker: mabel
          text: I mean you.
        - id: ch01-b191
          speaker: kathleen
          text: There's nothing wrong with me. Come on.
        - id: ch01-b192
          speaker: mabel
          text: Do you truly not know? Look at your hands. Look at your dress. Look at all of yourself.
        - id: ch01-b193
          speaker: narrator
          text: Kathleen looked down. Her hands were marble white. So were her dress, her shoes and stockings, and even the tips of her hair. She was as white as newly fallen snow.
        - id: ch01-b194
          speaker: kathleen
          text: What has happened? Why am I this horrible colour?
          emotion: fearful
        - id: ch01-b195
          speaker: narrator
          text: She began to tremble.
        - id: ch01-b196
          speaker: mabel
          text: Can't you see it, Cathy? You haven't changed back. You're still a statue.
        - id: ch01-b197
          speaker: kathleen
          text: I'm not! I'm alive. I'm standing here talking to you.
        - id: ch01-b198
          speaker: mabel
          text: I know, darling. That's because the moon is shining.
          emotion: calm
        - id: ch01-b199
          speaker: kathleen
          text: But you can see that I'm alive.
        - id: ch01-b200
          speaker: mabel
          text: Of course I can. I'm wearing the ring.
        - id: ch01-b201
          speaker: kathleen
          text: But I am all right. I know I am.
        - id: ch01-b202
          speaker: mabel
          text: No, you're not all right. It is moonlight, and you're a statue that has come alive with all the other statues. When the moon goes down, you'll turn still again. That is why we can't simply go home. You're still stone, even though the moon has brought you to life. Where has the dinosaurus gone?
          emotion: calm
        - id: ch01-b203
          speaker: narrator
          text: Mabel spoke gently and held Kathleen's white marble hand.
        - id: ch01-b204
          speaker: kathleen
          text: He's in the lake, and so are all the other stone animals.
        - id: ch01-b205
          speaker: mabel
          text: Well, then there is one thing we can be thankful for, at least.
