audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 朴实爽快，受惊时喃喃自语
        timbre: 年轻质朴的女声
        pace: 自然偏快
        pitch: 中音
    french_governess:
      display_name: 法国家庭女教师
      tts:
        delivery: 温柔热情，措辞略带异国韵味，激动时真挚急切
        timbre: 柔和明净的年轻女声
        pace: 自然偏缓
        pitch: 中音
    paper_guest:
      display_name: 纸人来宾
      tts:
        delivery: 沉静礼貌，咬字含混而执拗
        timbre: 空洞绵软的成年声
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 当时的大英雄成了约翰逊。报上说，是他追踪盗贼，设下圈套，又找回银器。那块砸中他的石头呢，大家认定梅布尔和姨妈一定弄错了，根本没有什么石头。那封警告信，他倒没有否认。早餐后，杰拉尔德买来《利德尔斯比观察报》，把那篇占了整整两栏的报道念给大家听。文章号称句句属实，其实全是瞎编。孩子们越听，嘴张得越大。最后，报上说这位本镇才俊的侦探本领胜过勒科克和福尔摩斯，升迁指日可待。屋里顿时静得发空。
        - id: ch01-b02
          speaker: jimmy
          text: 嘿，他可真谦虚，一点儿都没夸自己，是不是？
        - id: ch01-b03
          speaker: kathleen
          text: 我总觉得，这些大话像是我们替他撒的，我们也有错。要不是你，杰里，他们根本编不出这篇报道。他怎么好意思说出口呢？
        - id: ch01-b04
          speaker: gerald
          text: 这个嘛，他总不能什么也不说。幸亏我……
        - id: ch01-b05
          speaker: narrator
          text: 杰拉尔德忽然闭了嘴。
        - id: ch01-b06
          speaker: kathleen
          text: 幸亏你怎么了？
        - id: ch01-b07
          speaker: gerald
          text: 没什么。先把国家大事放在一边，还是说说今天吧。忠诚的梅布尔马上就来，她要拿回戒指，你和吉米也想戴。啊，有主意了！我们已经好几天没理法国女教师了，久得连本故事的英雄都不好意思承认。
        - id: ch01-b08
          speaker: jimmy
          text: 你别再管自己叫本故事的英雄了，行不行？反正你可不是我的英雄。
        - id: ch01-b09
          speaker: kathleen
          text: 你们两个都是我的英雄。
        - id: ch01-b10
          speaker: gerald
          text: 真乖。保姆回来以前，好好哄着小弟弟，可别让他发脾气。
        - id: ch01-b11
          speaker: kathleen
          text: 你不会丢下我们，一个人出去吧？
        - id: ch01-b12
          speaker: gerald
          text: 我匆匆上路，今天正赶集。到集市走一遭，给佳人买玫瑰。你们想来就快穿靴子，别磨蹭。
        - id: ch01-b13
          speaker: jimmy
          text: 我不去。
        - id: ch01-b14
          speaker: narrator
          text: 吉米抽了抽鼻子。凯瑟琳没办法，只好望着杰拉尔德。
        - id: ch01-b15
          speaker: gerald
          text: 唉，詹姆斯，詹姆斯，我怎么总忘不了你是我弟弟呢？有时候我把你当普通伙伴，像逗特纳、莫伯利他们那样逗你。你瞧，马上就出事了。
        - id: ch01-b16
          speaker: jimmy
          text: 你才不会叫他们小弟弟呢。
        - id: ch01-b17
          speaker: gerald
          text: 对，我以后一定小心，再也不这么叫了。走吧，我的英雄和女英雄。忠心的梅斯鲁尔，愿向二位俯首听命。
        - id: ch01-b18
          speaker: narrator
          text: 三个孩子走到广场拐角，正好碰见梅布尔。每逢星期五，这里便挤满货摊、遮篷和绿色大伞。鸡鸭、猪肉、陶器、蔬菜、布匹、糖果、玩具、工具、镜子，各种好玩的东西都来了。有些摆在架起来的桌面上，有些堆在大车里。拉车的马已经牵进马厩，空车的车辕下面垫着一摞木箱。瓷器和五金连桌子都不用，干脆摊在集市光秃秃的石板地上。
        - id: ch01-b19
          speaker: narrator
          text: 太阳照得十分卖力。照梅布尔的说法，整个大自然都在笑，都在高兴。菜摊中间夹着几束花，孩子们站在那里，怎么也拿不定主意。
        - id: ch01-b20
          speaker: princess
          text: 木犀草闻着最香。
        - id: ch01-b21
          speaker: kathleen
          text: 可玫瑰到底是玫瑰呀。
        - id: ch01-b22
          speaker: jimmy
          text: 康乃馨只要两便士。
        - id: ch01-b23
          speaker: narrator
          text: 杰拉尔德正在一束束扎紧的香水月季间闻来闻去，听见这句话，也觉得价钱足以替大家做决定。他们就买了三束康乃馨。一束黄得像硫磺，一束白得像浓奶油，还有一束红得像凯瑟琳那个从来不玩的洋娃娃的脸。他们把花带回家，用凯瑟琳的绿发带，在门阶上匆匆扎成花束。
        - id: ch01-b24
          speaker: narrator
          text: 杰拉尔德很有分寸地敲了敲客厅门。法国女教师好像整天都坐在这间屋里。
        - id: ch01-b25
          speaker: french_governess
          text: 请进！
        - id: ch01-b26
          speaker: narrator
          text: 杰拉尔德进去一看，她没有像平常那样读书，而是伏在一本素描簿上。桌面摊着一盒一看就不是英国货的颜料，还有一盒石板灰的水。无论是最厉害的水彩画家，还是只有一盒六便士颜料的孩子，都认识这种水。
        - id: ch01-b27
          speaker: gerald
          text: 这是我们大家送您的一点心意。
        - id: ch01-b28
          speaker: narrator
          text: 他冷不防把花摆到她面前。
        - id: ch01-b29
          speaker: french_governess
          text: 哎呀，你真是个可爱的孩子！为了这束花，让我亲亲你，好不好？
        - id: ch01-b30
          speaker: narrator
          text: 杰拉尔德还没来得及声明，自己已经大得不该让人亲了，她便照法国人的样子，在他两边脸颊轻快地各亲了一下。
        - id: ch01-b31
          speaker: gerald
          text: 您在画画吗？
        - id: ch01-b32
          speaker: narrator
          text: 他赶紧换了话题，免得别人看出他被当成小娃娃以后有多恼火。
        - id: ch01-b33
          speaker: french_governess
          text: 我在画完昨天的速写。
        - id: ch01-b34
          speaker: narrator
          text: 杰拉尔德还来不及琢磨，昨天画出来会是什么模样，她已递给他一幅雅尔丁塔楼的速写，画得又美又准。
        - id: ch01-b35
          speaker: gerald
          text: 哎呀，真棒！能叫他们也进来看看吗？
        - id: ch01-b36
          speaker: narrator
          text: 大家都进来了，梅布尔也在。她有点拘束，躲在众人后面，从吉米肩头望过去。
        - id: ch01-b37
          speaker: gerald
          text: 您可真有本事。
        - id: ch01-b38
          speaker: french_governess
          text: 有本事又有什么用？一个人还不是要用一辈子教小娃娃。
        - id: ch01-b39
          speaker: gerald
          text: 那可太糟了。
        - id: ch01-b40
          speaker: french_governess
          text: 你也要看画吗？你是他们从镇上带来的朋友，对不对？
        - id: ch01-b41
          speaker: princess
          text: 您好。不，我不是镇上的。我住在雅尔丁塔楼。
        - id: ch01-b42
          speaker: narrator
          text: 这个名字显然触动了法国女教师。杰拉尔德暗自着急，只盼她不是个势利眼。
        - id: ch01-b43
          speaker: french_governess
          text: 雅尔丁塔楼？这可真不寻常。那么，你是雅尔丁勋爵的家人吗？
        - id: ch01-b44
          speaker: princess
          text: 他没有家人。他没结婚。
        - id: ch01-b45
          speaker: french_governess
          text: 我是问，你是不是他的……该怎么说呢？堂妹、姐妹，或者侄女？
        - id: ch01-b46
          speaker: narrator
          text: 梅布尔的脸一下红透了。
        - id: ch01-b47
          speaker: princess
          text: 不是。我一点儿也不高贵。我姨妈是雅尔丁勋爵家的女管家。
        - id: ch01-b48
          speaker: french_governess
          text: 不过，你认识雅尔丁勋爵吧？
        - id: ch01-b49
          speaker: princess
          text: 不认识，我从来没见过他。
        - id: ch01-b50
          speaker: french_governess
          text: 那么，他从不回自己的城堡吗？
        - id: ch01-b51
          speaker: princess
          text: 从我住进去以后，他一次也没回来。不过下星期他就要来了。
        - id: ch01-b52
          speaker: french_governess
          text: 他为什么不住在那里？
        - id: ch01-b53
          speaker: princess
          text: 姨妈说，他太穷了。雅尔丁勋爵的叔父把能不给他的钱，全留给了另一个远房亲戚。他只剩一点钱，勉强够修修老宅，再到别的地方过很省的日子。他养不起整座宅子，也住不起。可他还不能卖，因为那座宅子已经写进故事里了。
        - id: ch01-b54
          speaker: french_governess
          text: 写进什么故事？
        - id: ch01-b55
          speaker: princess
          text: 律师编的故事呀。只要律师把你的房子写进去，你就不能卖，也不能送，只能把它留给儿子，哪怕你根本不想留。
        - id: ch01-b56
          speaker: narrator
          text: 法国女教师听得这样认真，梅布尔又得意，又觉得受宠若惊。
        - id: ch01-b57
          speaker: french_governess
          text: 可他叔父怎么能这么狠心？只给他一座城堡，却连一分钱也不给？
        - id: ch01-b58
          speaker: narrator
          text: 凯瑟琳和吉米惊讶极了。这个故事在他们听来乏味透顶，法国女教师怎么会忽然这么感兴趣？
        - id: ch01-b59
          speaker: princess
          text: 哦，这个我也知道。雅尔丁勋爵想娶一位小姐，他叔父偏不准。她好像是酒吧女招待，也可能是芭蕾舞女郎。他不肯放弃她，叔父就说，好吧，那我把一切都留给那位亲戚。
        - id: ch01-b60
          speaker: french_governess
          text: 可你刚才说，他没有结婚。
        - id: ch01-b61
          speaker: princess
          text: 是没结婚。那位小姐进了修道院。我猜，她现在已经给活活砌进墙里了。
        - id: ch01-b62
          speaker: french_governess
          text: 砌进……什么？
        - id: ch01-b63
          speaker: princess
          text: 墙里呀，就是把人封在墙里害死。修道院都这么干。
        - id: ch01-b64
          speaker: narrator
          text: 梅布尔还指着墙纸上描金的粉红玫瑰，热心地帮她理解。
        - id: ch01-b65
          speaker: french_governess
          text: 绝没有这种事。修道院里的女人都很善良。那里只有门锁可恨。有些人进去了，就再也出不来，尤其是那些还很年轻，却被亲人打着幸福安康的名义送进去的人。可把小姐砌进墙里害死？不，绝不可能。那么，这位勋爵没有去找他的小姐吗？
        - id: ch01-b66
          speaker: princess
          text: 当然找了。可是修道院有几百万所，他哪里知道该去哪一所？寄出去的信，也全让邮局退回来了。而且……
        - id: ch01-b67
          speaker: french_governess
          text: 天哪！看来女管家的客厅里，还真是什么事情都知道。
        - id: ch01-b68
          speaker: princess
          text: 差不多什么都知道。
        - id: ch01-b69
          speaker: french_governess
          text: 你觉得，他会找到她吗？不会吗？
        - id: ch01-b70
          speaker: princess
          text: 哦，当然会。等他年老体衰，快要咽气的时候，一位温柔的慈善修女会替他抚平枕头。就在最后一刻，她忽然表明身份，说，我失散的爱人！他的脸上会闪过神奇的喜悦，干裂的嘴唇喊着爱人的名字，然后离开人世。
        - id: ch01-b71
          speaker: narrator
          text: 法国女教师一句话也没说。她完全听呆了。
        - id: ch01-b72
          speaker: french_governess
          text: 原来你还会预言吗？
        - id: ch01-b73
          speaker: princess
          text: 才不是，这是我从书里看来的。您什么时候想听，我还能讲好多命中注定的爱情悲剧呢。
        - id: ch01-b74
          speaker: narrator
          text: 法国女教师轻轻跳了一下，像是猛然想起了什么。
        - id: ch01-b75
          speaker: french_governess
          text: 快到午饭时间了。你们的朋友梅布尔今天是客人，我们要给她办一场小宴会。凯瑟琳，把我这些漂亮的花插进水里。我去买蛋糕。你们都去洗手，等我回来就准备好。
        - id: ch01-b76
          speaker: narrator
          text: 她笑着朝孩子们点点头，离开客厅，跑上楼去了。
        - id: ch01-b77
          speaker: kathleen
          text: 她这样子，简直像个年轻姑娘。
        - id: ch01-b78
          speaker: princess
          text: 她本来就年轻。好多女士到了她这个年纪，照样有人求婚。我见过的新娘，不少都比她老得多。你们怎么从没告诉我，她这么漂亮？
        - id: ch01-b79
          speaker: kathleen
          text: 她漂亮吗？
        - id: ch01-b80
          speaker: princess
          text: 当然漂亮。她人也好，还特意给我买蛋糕，又说我是你们的宾客！
        - id: ch01-b81
          speaker: gerald
          text: 听我说，我觉得她这么做特别够意思。家庭女教师赚的钱少得可怜，只够勉强过日子，她却把手头那点钱都花在我们身上了。今天别出去了，我们留下陪她玩吧。我猜，她平时一定闷坏了。
        - id: ch01-b82
          speaker: kathleen
          text: 她真会喜欢吗？艾米莉姨妈说，大人其实不爱玩。他们陪孩子玩，只是想让孩子高兴。
        - id: ch01-b83
          speaker: gerald
          text: 他们哪知道，我们也常常陪他们玩，好让他们高兴。
        - id: ch01-b84
          speaker: kathleen
          text: 反正我们答应过，要穿公主服装演一场。就用那出戏招待她吧。
        - id: ch01-b85
          speaker: jimmy
          text: 最好快到下午茶时再演。这样演到一半，就会有人来打断，不至于一直演个没完。
        - id: ch01-b86
          speaker: princess
          text: 那些东西放得安全吗？
        - id: ch01-b87
          speaker: kathleen
          text: 很安全，我跟你说过藏在哪儿了。走吧，吉米，我们帮忙摆桌子，再叫伊莱扎拿出最好的瓷器。
        - id: ch01-b88
          speaker: narrator
          text: 他们走了。杰拉尔德却忽然想起一件事。
        - id: ch01-b89
          speaker: gerald
          text: 幸好那些盗贼没去偷藏宝室里的钻石。
        - id: ch01-b90
          speaker: princess
          text: 他们偷不了。除了你和我，我想没人知道那些钻石。你也发过誓，绝不说出去，还记得吧？我们刚认识不久就发誓了。姨妈肯定不知道，那处机关是我碰巧发现的。雅尔丁勋爵把秘密藏得真严。
        - id: ch01-b91
          speaker: gerald
          text: 真希望我也有一个这样的秘密，可以一直守着。
        - id: ch01-b92
          speaker: princess
          text: 要是盗贼知道钻石，审判时一切都会抖出来。律师会逼你把知道的都说了，还非让你添上一大堆谎话。
        - id: ch01-b93
          speaker: gerald
          text: 不会有审判。
        - id: ch01-b94
          speaker: narrator
          text: 杰拉尔德若有所思地踢着钢琴腿。
        - id: ch01-b95
          speaker: princess
          text: 没有审判？
        - id: ch01-b96
          speaker: gerald
          text: 报纸上说，歹徒大概得到了同伙的警告。警方原本布置周密，想等他们回来取赃物时一网打尽，结果没能成功。不过，警方已经掌握了一条线索。
        - id: ch01-b97
          speaker: princess
          text: 真可惜！
        - id: ch01-b98
          speaker: gerald
          text: 你不用担心，他们哪有什么线索。
        - id: ch01-b99
          speaker: narrator
          text: 他还是盯着钢琴腿看。
        - id: ch01-b100
          speaker: princess
          text: 我不是替线索可惜，我是替那个同伙可惜。
        - id: ch01-b101
          speaker: gerald
          text: 那真遗憾，因为那个同伙就是我。
        - id: ch01-b102
          speaker: narrator
          text: 杰拉尔德站起来，不再研究钢琴腿。他直直望着前方，仿佛成了那个站在燃烧甲板上的男孩。
        - id: ch01-b103
          speaker: gerald
          text: 我实在没办法。你一定觉得我是罪犯，可我就是狠不下心。我真不知道侦探怎么能把人送进去。爸爸带我参观过一次监狱。我给约翰逊报完信，一想到那座监狱，就再也做不下去了。我知道自己是个坏蛋，根本不配当英国公民。
        - id: ch01-b104
          speaker: princess
          text: 我倒觉得，你的心肠很好。你是怎么警告他们的？
        - id: ch01-b105
          speaker: gerald
          text: 我只给那个知道住处的人塞了张纸，从门底下塞进去，叫他赶快躲起来。
        - id: ch01-b106
          speaker: princess
          text: 哦！纸上到底写了什么？快告诉我。
        - id: ch01-b107
          speaker: narrator
          text: 这个新话题一下提起了梅布尔的兴致。
        - id: ch01-b108
          speaker: gerald
          text: 我写的是，除了姓名，警方已经知道你们的一切。只要改过自新，就能平安无事。再敢偷窃，我一定告发，你们尽可以相信。一个朋友。我知道这样不对，可我没办法。别告诉别人，他们不会明白我为什么这样做。其实，我自己也不明白。
        - id: ch01-b109
          speaker: princess
          text: 我明白。因为你有一颗仁慈又高贵的心。
        - id: ch01-b110
          speaker: gerald
          text: 仁慈个鬼，我的好姑娘！快去洗手吧，你黑得像墨水。
        - id: ch01-b111
          speaker: narrator
          text: 杰拉尔德不再像燃烧甲板上的男孩，转眼又变回了自己。
        - id: ch01-b112
          speaker: princess
          text: 你才黑呢，我一点儿也不黑。这是染料。姨妈今早照着《居家胡扯》的办法染女衫，现在她黑得像墨水，那件衣服还一块深一块浅。真可惜，戒指不能只让身上的一部分消失，比如这些污渍。
        - id: ch01-b113
          speaker: gerald
          text: 说不定这一次，它连你整个人也不会变没了。
        - id: ch01-b114
          speaker: princess
          text: 为什么？你没动过戒指吧？
        - id: ch01-b115
          speaker: gerald
          text: 没有。不过你没发现吗？你隐形了二十一小时，我是十四小时，伊莱扎只有七小时。每次都少七个小时。现在已经轮到……
        - id: ch01-b116
          speaker: princess
          text: 你的算术可真厉害！
        - id: ch01-b117
          speaker: gerald
          text: 你看，七减七就是零。所以这次一定会发生别的事。再下一次也不会是负七小时，我可想不出那该怎么实现。除非它让人比原来更看得见，也就是变得更厚实。你懂吧？
        - id: ch01-b118
          speaker: princess
          text: 别说啦！我都让你说晕了。
        - id: ch01-b119
          speaker: gerald
          text: 还有件怪事。一个人只要隐形，亲人就不爱他了。想想你姨妈，再想想我去抓贼的时候，凯茜连眉毛都没动一下。那枚戒指还有好多秘密，我们根本没弄明白。老天！法国女教师带蛋糕回来了。快跑，勇敢的强盗们，赶紧去洗手保命！
        - id: ch01-b120
          speaker: narrator
          text: 他们跑了。法国女教师带回来的不只是蛋糕，还有李子、葡萄、果酱馅饼、苏打水、覆盆子醋、漂亮盒子里的巧克力、棕色陶罐里的浓奶油，以及一大束玫瑰。那奶油纯净又浓稠，一看就是上好的。她快活得出奇，简直不像一位家庭女教师。她大方地分蛋糕和馅饼，又用鲜花编成花环，给每个人戴在头上。她自己没有吃多少，却把覆盆子醋兑进苏打水，调出漂亮的粉红饮料，为今天的贵宾梅布尔祝酒。她还说，希腊的男神女神参加宴会时都戴花环，总算劝得吉米也戴上一个。
        - id: ch01-b121
          speaker: narrator
          text: 自从世上有法国女教师以来，大概从没有哪一位办过这样的宴会。桌边全是笑话、故事和欢笑。吉米拿餐叉、软木塞、火柴和苹果变了几个戏法，人人都喜欢，实在也值得喜欢。法国女教师讲起自己上学的时候。那时她还是这么小的一个女孩，头上梳着两条紧紧的辫子。孩子们听不懂她说的辫子，她就要来纸笔，画了一幅可爱的自画像。小时候的她有两条短短胖胖的小辫，从脑袋两边支出来，像一团深色毛线插着两根毛衣针。后来，孩子们想看什么，她就画什么。一直到梅布尔扯扯杰拉尔德的外套，低声提醒他。
        - id: ch01-b122
          speaker: princess
          text: 别忘了演戏呀！
        - id: ch01-b123
          speaker: gerald
          text: 请给我们画一座剧院的正面吧，要法国的剧院。
        - id: ch01-b124
          speaker: french_governess
          text: 法国剧院和英国剧院，看起来是一样的。
        - id: ch01-b125
          speaker: gerald
          text: 您喜欢看戏吗？我是说，剧院里演的那种。
        - id: ch01-b126
          speaker: french_governess
          text: 当然，我非常喜欢。
        - id: ch01-b127
          speaker: gerald
          text: 那就好。您愿意的话，我们今天下午演一出给您看。
        - id: ch01-b128
          speaker: kathleen
          text: 可伊莱扎那时得洗碗。我们答应过，也让她看的。
        - id: ch01-b129
          speaker: gerald
          text: 那就晚上演。老师，能让伊莱扎也来看吗？
        - id: ch01-b130
          speaker: french_governess
          text: 当然可以。你们好好玩吧，孩子们。
        - id: ch01-b131
          speaker: princess
          text: 可我们是想让您高兴，因为我们都很爱您呀。是不是，你们大家？
        - id: ch01-b132
          speakers: [gerald, jimmy, kathleen]
          ensemble: chorus
          text: 是！
        - id: ch01-b133
          speaker: narrator
          text: 回答毫不迟疑。要不是梅布尔先说，其他人绝不会想到把这种话讲出来。可等她问出口，他们才惊讶地发现，原来这是真的。
        - id: ch01-b134
          speaker: french_governess
          text: 哎呀！你们会爱这个老法国女教师？不可能。
        - id: ch01-b135
          speaker: narrator
          text: 她的话音有些含混。
        - id: ch01-b136
          speaker: princess
          text: 您不老，至少不算很老。而且，您漂亮得像一位公主。
          emotion: happy
        - id: ch01-b137
          speaker: french_governess
          text: 去吧，你这个小马屁精！
          emotion: happy
        - id: ch01-b138
          speaker: narrator
          text: 法国女教师笑着说。梅布尔跑了出去，其他人早已到了楼梯半腰。
        - id: ch01-b139
          speaker: narrator
          text: 法国女教师照常坐在客厅。幸亏她没有研究什么要紧学问，因为整个下午，那扇门几乎一刻不停地开了又关。孩子们一趟趟跑来问，能不能拿绣花椅背罩和沙发靠垫，能不能拿洗衣房的晾衣绳。伊莱扎说不许，可他们到底能不能拿？羊皮炉前毯呢？餐厅里的舞台已经快搭好了，伊莱扎却要在那里摆下午茶，能不能把茶改到花园里喝？还有彩色衣裳、围巾、晨衣，凡是鲜艳的东西，能不能借给他们？当然能。她真的拿出了几件漂亮的丝绸衣物，叫人怎么也想不到，一位家庭女教师竟会有这样的衣裳。
        - id: ch01-b140
          speaker: narrator
          text: 接着，孩子们又来问她有没有胭脂。他们总听说法国女士会有。没有，她的脸色已经证明，根本用不着胭脂。那么，药剂师那里会不会卖？她有没有多余的假发？面对这最后一个问题，法国女教师抬起苍白的手指，一连拔下十来根发卡。最美丽的蓝黑长发一下垂下来，一绺绺又直又厚，一直落到膝头。
        - id: ch01-b141
          speaker: french_governess
          text: 没有，你们这些可怕的小鬼！我没有假发，也没有胭脂。你们是不是连我的牙齿也想借走？
        - id: ch01-b142
          speaker: narrator
          text: 她笑着把牙齿亮给他们看。
        - id: ch01-b143
          speaker: princess
          text: 我早说您是公主，现在我确定了。您就是莴苣姑娘！以后一直这样披着头发吧。壁炉台上的孔雀扇能借吗？束窗帘的带子呢？还有您所有的手帕？
        - id: ch01-b144
          speaker: narrator
          text: 法国女教师一样也没拒绝。孩子们拿走扇子和手帕，又从学校用品柜里取了几大张昂贵的图画纸，还带走她最好的紫貂毛画笔和颜料盒。
        - id: ch01-b145
          speaker: gerald
          text: 谁想得到，她藏在那副样子底下，竟然这么够朋友？真怪，深红色颜料怎么老有一股利比希肉精的味道。
        - id: ch01-b146
          speaker: narrator
          text: 杰拉尔德含着画笔，望着刚画好的纸面具，自言自语。也不知道为什么，那天什么都叫人高兴。从早上开始，每件事都顺顺当当。要找的东西正好就在该在的地方，没有人误会你，做什么都做得漂亮。
        - id: ch01-b147
          speaker: narrator
          text: 这可不像我们熟悉的另一种日子。那种日子里，鞋带会断，梳子不见了，发刷在地上打个转，偏偏滑到你够不着的床底。肥皂从手里溜走，纽扣一个个掉下来，睫毛钻进眼睛，最后一条干净手帕刚好用过。衣领边磨得发毛，蹭得脖子生疼。偏在最后关头，吊袜带又断了，连一根绳子都找不到。
        - id: ch01-b148
          speaker: narrator
          text: 碰上这样的早晨，你一定赶不上早餐，人人还觉得你故意迟到。接下来只会越来越糟。练习簿找不到，算术书掉进泥里，铅笔也断了。你打开小刀想削铅笔，指甲却先劈了。门会夹住你的大拇指，大人托你传的话也会被你传错。茶打翻了，面包和黄油怎么也不肯好好待在一起。最后，你总算上了床，通常还背着处分。你明明知道，没有一件事是自己的错，可这也一点儿不能安慰你。
        - id: ch01-b149
          speaker: narrator
          text: 你一定已经看出来，这一天并不是那种倒霉日子。就连花园里的下午茶也舒服极了。假山边恰好有块铺砖的平地，茶桌摆上去稳稳当当。不过，五个人里有四个满脑子都想着那出戏。第五个人也有自己的心事，只是和喝茶、演戏都没关系。
        - id: ch01-b150
          speaker: narrator
          text: 接下来的一段时间，屋里只听见门砰砰地开了又关。开门声之间，是一阵阵意味深长的安静，还有孩子们飞奔上楼、又飞奔下楼的脚步声。
        - id: ch01-b151
          speaker: narrator
          text: 天还很亮，晚餐铃就响了。这是喝下午茶时约好的信号，孩子们也早早把意思仔细解释给伊莱扎听。法国女教师放下手里的书，穿过被夕阳照得一片金黄的门厅，来到点着淡黄煤气灯的餐厅。伊莱扎一路咯咯笑着替她开门，又紧跟着她走进去。百叶窗关得严严实实，只从上边和下边的缝隙里漏进几道白天的亮光。学校餐桌上那几块绿黑相间的桌布，挂在从后院拿来的晾衣绳上。绳子虽然优美地弯弯垂着，还是尽职地撑住了帷幕，把房间里充当舞台的那一部分遮在后面。
        - id: ch01-b152
          speaker: narrator
          text: 房间另一头横着摆了一排又一排椅子，看起来，全屋能找到的椅子都搬到这里来了。法国女教师突然看见，足有六把椅子上坐着人，猛地吓了一大跳。那些人一个比一个古怪。有个老太婆戴着宽边软帽，下巴下面系着红手帕。有位女士戴着插满鲜花的大草帽，一双模样古怪的手伸过来，搭在前排椅背上。还有几个男人，身形又笨重又奇特。所有来宾的头上都戴着帽子。
        - id: ch01-b153
          speaker: french_governess
          text: 可是，你们还请了别的客人？孩子们，应该先问问我呀。
        - id: ch01-b154
          speaker: narrator
          text: 她隔着桌布缝低声问。帷幕后传来一阵笑，还有一声像是在喊万岁。
        - id: ch01-b155
          speaker: princess
          text: 没事的，莴苣姑娘老师！把煤气灯开亮吧，这也是表演的一部分。
        - id: ch01-b156
          speaker: narrator
          text: 伊莱扎还在咯咯笑。她从一排排椅子间挤过去，路上碰掉了一位客人的帽子，又把三盏白炽煤气灯拧亮。法国女教师盯着最近的人影，弯下腰仔细看。她刚笑出半声，忽然真的尖叫起来，一屁股坐了下去。
        - id: ch01-b157
          speaker: french_governess
          text: 啊！它们不是活人！
          emotion: surprised
        - id: ch01-b158
          speaker: eliza
          text: 它们肚子里是空的！
          emotion: surprised
        - id: ch01-b159
          speaker: narrator
          text: 伊莱扎也看出了真相，只是换了个说法，声音还响得多。散坐在椅子上的七位观众，肚子里确实没什么东西。长枕和卷起的毛毯做成身体，扫帚柄是脊梁，曲棍球杆和雨伞是胳膊腿的骨头。法国女教师用来撑外套肩形的木横架成了肩膀，手套里塞满手帕，就成了手。它们的脸，是杰拉尔德下午用没受过训练的画笔画出的纸面具，绑在长枕套末端填出的圆脑袋上。
        - id: ch01-b160
          speaker: narrator
          text: 那些脸看着真有点吓人。杰拉尔德已经尽了全力，可有几张脸要不是正好放在人脸通常该在的位置，也就是衣领和帽子之间，谁也认不出那是脸。眉毛用灯黑画成发怒的倒八字。眼睛足有五先令硬币那么大，不光大小相近，连形状也很像。嘴唇和脸颊用掉了大把深红颜料，还有差不多整整半块朱红。
        - id: ch01-b161
          speaker: french_governess
          text: 原来你们给自己做了观众！真是太棒了！
          emotion: happy
        - id: ch01-b162
          speaker: narrator
          text: 她回过神来，拍起手。随着掌声，帷幕升了起来。说得准确些，是被两边的人拉向了两边。一个上气不接下气的声音赶紧报出戏名，《美女与野兽》。舞台就这样完整地露了出来。
        - id: ch01-b163
          speaker: narrator
          text: 那还真像一座舞台。几张餐桌紧紧并在一起，上面铺着粉白床罩。踩上去虽然摇摇晃晃，还吱呀作响，看起来却十分气派。布景简单，但足够让人相信。硬纸板折成方形，割上几道缝，背后点一支蜡烛，一看就是家里的炉火。伊莱扎装帽子的圆铁盒摆在凳子上，下面点着小夜灯。除非故意挑刺，谁也不会把它看成洗衣锅以外的东西。废纸篓里塞进几块教室抹布和一件大衣，再把蓝睡衣搭在椅背上，整幅布景便完成了。侧幕后的声音其实不必再宣布，这里是美女家的洗衣房。谁看了都知道，这绝不会是别的地方。
        - id: ch01-b164
          speaker: princess
          text: 它们看着真像一群观众，是不是？上吧，吉米。别忘了，商人得摆足架子，还要说好多长词。
        - id: ch01-b165
          speaker: narrator
          text: 吉米穿着杰拉尔德最好的大衣，衣服里面塞了好几个枕头，把他撑得胖极了。这件大衣买来时特意留得很大，原本打算让杰拉尔德再长两年也能穿。吉米头上缠着一条土耳其毛巾，毛巾上还撑着一把打开的雨伞。他用一段干脆的独白，揭开了第一幕。
        - id: ch01-b166
          speaker: jimmy
          text: 我是天底下最倒霉的商人。以前，我是巴格达最富有的商人，可我的船全都沉了。现在我只能住在一间破破烂烂的穷房子里。你们瞧，雨水一直从屋顶漏下来，我的女儿们只好替别人洗衣服。还有……
        - id: ch01-b167
          speaker: narrator
          text: 这个停顿拖得相当长。杰拉尔德终于窸窸窣窣地上场了。他穿着法国女教师的粉红晨衣，姿态优雅，扮的是大女儿。
        - id: ch01-b168
          speaker: gerald
          text: 今天正适合晒衣服。亲爱的爸爸，请把雨伞倒着撑起来。这样，我们就不用冒雨出去打水了。来吧，妹妹们！亲爱的爸爸又给我们添了一只新洗衣盆，真是太奢侈了！
        - id: ch01-b169
          speaker: narrator
          text: 三姐妹跪在倒撑的雨伞旁，洗起想象中的衣服。凯瑟琳穿着伊莱扎的紫裙子，配自己的蓝上衣，头上用手帕打了个结当帽子。梅布尔的黑发间插着两朵红康乃馨，身上是白睡裙，外面系着白围裙。谁是三姐妹中的美女，一眼就能看出来。
        - id: ch01-b170
          speaker: narrator
          text: 第一场演得很顺利。结尾时，孩子们挥着毛巾跳舞。法国女教师说，真是可爱极了。伊莱扎更是笑个不停。照她自己的话说，她笑得太厉害，腰边都岔气了。
        - id: ch01-b171
          speaker: narrator
          text: 四个孩子整个下午都忙着准备服装，一点时间也没留下来排练台词。这样的《美女与野兽》会演成什么样，你大概想得到。可是，演员们演得兴高采烈，观众们也看得心满意足。就算是莎士比亚的戏，又能多做到什么呢？梅布尔穿着公主服装，成了一位光彩照人的美女。杰拉尔德披着客厅的炉前毯演野兽，竟显出一种谁也说不清的高贵气派。吉米这个商人虽然没说多少话，却用几个枕头把自己撑得几乎没有边，一身肥胖补足了所有台词。凯瑟琳一会儿演仙女，一会儿演仆人，一会儿又成了信使，在各种小角色间飞快变换，快得连她自己都又惊又喜。
        - id: ch01-b172
          speaker: narrator
          text: 第二幕结束时，梅布尔找到杰拉尔德。她的戏服已经好得不能再好，不用更换。杰拉尔德却裹在那身又厚又华丽的兽皮里，热得几乎喘不过气。
        - id: ch01-b173
          speaker: princess
          text: 喂，你该把戒指还给我们了。
        - id: ch01-b174
          speaker: gerald
          text: 正要给你呢。
        - id: ch01-b175
          speaker: narrator
          text: 其实，他早把这件事忘得干干净净。
        - id: ch01-b176
          speaker: gerald
          text: 下一场就还你。不过别弄丢，也别戴。你可能又会整个消失，再也没人看得见。也可能变得比别人显眼七倍，厚实得让我们站在旁边都像影子。或者……
        - id: ch01-b177
          speaker: kathleen
          text: 准备上场！
        - id: ch01-b178
          speaker: narrator
          text: 凯瑟琳匆匆走进来，又变成了一个恶毒的姐姐。杰拉尔德费了好大劲，才把手从炉前毯底下伸进口袋。他满眼痛苦和深情，开始说戏里的台词。
        - id: ch01-b179
          speaker: gerald
          text: 再见了，亲爱的美女！你一定要快点回来。要是你离开忠诚的野兽太久，他非死不可。
        - id: ch01-b180
          speaker: narrator
          text: 他把一枚戒指按进梅布尔手里，又接着往下演。
        - id: ch01-b181
          speaker: gerald
          text: 这是一枚有求必应的魔法戒指。等你想回到无私的野兽身边，就戴上它，说出愿望。一眨眼，你就会回到我身旁。
        - id: ch01-b182
          speaker: narrator
          text: 扮演美女的梅布尔接过戒指。那正是真正的魔法戒指。帷幕合拢，两双手热烈地拍起来。
        - id: ch01-b183
          speaker: narrator
          text: 下一场精彩极了。那几个姐姐刻薄起来，简直自然得过了头。她们把真正的肥皂水泼到美女的公主裙上，美女马上发了火。大家一致认为，这番怒气简直是演技上的奇迹。就连商人也不再只是塞在大衣里的几个枕头，好像真的又多了点别的东西。幕落时，他哀伤地保证，亲爱的美女不在身边，他一天比一天消瘦，很快就要化成一道影子。两双手又一次热烈地鼓起掌来。
        - id: ch01-b184
          speaker: gerald
          text: 来，梅布尔，帮我一把。
        - id: ch01-b185
          speaker: narrator
          text: 杰拉尔德在一大堆东西底下求救。里面有晒毛巾架、茶炊、茶盘和擦靴童的绿呢围裙。楼梯平台上的四盆红天竺葵、客厅壁炉里的蒲苇，还有客厅窗边的橡胶树，也都搬来了。这些东西要一起变成最后一幕的喷泉和花园。演员们还在忙着搬动它们，外面的掌声已经停了。
        - id: ch01-b186
          speaker: princess
          text: 我真希望我们做的那些东西全能活起来。那样，它们就能好好给我们鼓掌了。
        - id: ch01-b187
          speaker: narrator
          text: 她说着，接过了沉重的茶炊。
        - id: ch01-b188
          speaker: gerald
          text: 我倒庆幸它们没活。这些怪东西！每次撞上那些纸眼睛，我就觉得浑身不自在。
        - id: ch01-b189
          speaker: narrator
          text: 他一边说，一边安置绿呢和毛巾架。帷幕再次拉开。披着炉前毯的野兽平躺在一片热带花园里，摆出万念俱灰的样子。周围有蒲苇灌木、橡胶树丛、天竺葵大树，还有一眼茶炊喷泉。美女已经准备好，要在一片叫人发抖的绝望光辉中隆重登场。就在这一刻，一切突然发生了。
        - id: ch01-b190
          speaker: narrator
          text: 先是法国女教师。她看到花园布景，两只灵巧的法国手掌急促地轻轻拍起来。接着，伊莱扎厚实通红的手掌也沉重地加入了。然后，别的手也开始鼓掌。六双，也许七双。那声音低沉发闷，仿佛每只手掌上都垫着厚厚的软垫。
        - id: ch01-b191
          speaker: narrator
          text: 舞台对面已经不再只有两张脸，而是九张。其中七张，都是画出来的尖纸脸。每一只手，每一张脸，全都活了。梅布尔轻盈地走上台，掌声立刻更响。她停住脚，望向观众。这一下可不是排练好的。她脸上的惊恐和诧异，又换来了更热烈的喝彩。
        - id: ch01-b192
          speaker: narrator
          text: 可掌声再响，也盖不住法国女教师和伊莱扎的尖叫。两个人夺门而逃，一路撞翻椅子，又在门口挤成一团。远处接连传来两声关门巨响。一声是法国女教师的房门，另一声是伊莱扎的房门。
        - id: ch01-b193
          speaker: princess
          text: 拉幕！快把帷幕拉上！杰里，那些东西活了！啊，我们该怎么办？
          emotion: fearful
        - id: ch01-b194
          speaker: narrator
          text: 这声音既不像梅布尔，也不像美女。披着炉前毯的杰拉尔德一下跳起来。吉米和凯瑟琳赶紧合拢帷幕，桌布沿着晾衣绳刷刷滑动。外面又响起扁平沉闷的掌声。
        - id: ch01-b195
          speakers: [jimmy, kathleen]
          ensemble: duo
          text: 出什么事了？
        - id: ch01-b196
          speaker: gerald
          text: 这回你可闯大祸了！真讨厌，这些绳子！
          emotion: angry
        - id: ch01-b197
          speaker: narrator
          text: 梅布尔满脸通红，汗水直流。
        - id: ch01-b198
          speaker: princess
          text: 你就不能把绳子挣断吗？怎么成了我闯祸？这话可真好听！
          emotion: angry
        - id: ch01-b199
          speaker: gerald
          text: 我听起来可没你那么喜欢。
        - id: ch01-b200
          speaker: princess
          text: 哦，没关系，快来吧。我们得把那些东西拆掉。只要拆散，它们就活不成了。
        - id: ch01-b201
          speaker: gerald
          text: 反正都是你的错。你还没明白吗？戒指现在成了许愿戒指。我早知道这回一定不一样。快从我口袋里拿出小刀，这根绳子打了死结。吉米，凯茜，那些丑东西因为梅布尔许了愿，全活过来了。你们快去拆掉它们。
        - id: ch01-b202
          speaker: narrator
          text: 吉米和凯瑟琳从帷幕后探头看了一眼，顿时脸色惨白。他们瞪大眼睛，马上又缩了回来。
        - id: ch01-b203
          speaker: jimmy
          text: 我才不去！
          emotion: fearful
        - id: ch01-b204
          speaker: kathleen
          text: 想都别想！
          emotion: fearful
        - id: ch01-b205
          speaker: narrator
          text: 谁都听得出来，她是真心的。这时，杰拉尔德快要从炉前毯里挣脱了。他用小刀最紧的那片刀刃割绳子，却先劈断了拇指指甲。帷幕另一边传来厚重的窸窣声，还有一下下又尖又沉的笃笃脚步。
        - id: ch01-b206
          speaker: kathleen
          text: 它们要出去了！它们正用雨伞腿和扫帚柄腿往外走。你拦不住的，杰里，它们太可怕了！
          emotion: fearful
        - id: ch01-b207
          speaker: gerald
          text: 要是不拦住它们，明晚以前，全镇的人都会发疯！把戒指给我，我来许愿，让它们变回去。
        - id: ch01-b208
          speaker: narrator
          text: 他从毫不抵抗的梅布尔手中抢过戒指。
        - id: ch01-b209
          speaker: gerald
          text: 我希望那些丑东西全都不再活着！
        - id: ch01-b210
          speaker: narrator
          text: 他喊完便冲出门去。他想象着，梅布尔的愿望已经撤销。门厅该是空荡荡的，长枕、帽子、雨伞、外套和手套软塌塌地散落一地，卑微又无力。那一点短暂的生命，应该已经永远离开了这些道具。可眼前的情形完全不是这样。
        - id: ch01-b211
          speaker: narrator
          text: 可门厅里挤满了活物。它们奇形怪状，而且全都矮得吓人。扫帚柄和雨伞本来就只有那么高，做出来的腿当然也高不到哪里去。一只软绵绵的手朝他比画，一张尖尖的白脸抬起来看他，两颊涂得通红。两片宽大的红嘴唇动了动，说出一句话。杰拉尔德一个字也没听懂。那声音让他想起桥边那个没有上腭的老乞丐。这些生物当然也没有上腭，它们根本没有真正的嘴。
        - id: ch01-b212
          speaker: paper_guest
          text: 能……介绍……一家……好旅馆……吗？
        - id: ch01-b213
          speaker: narrator
          text: 那声音一连说了四遍。杰拉尔德好不容易镇定下来，这才听懂。这个活生生的、多半完全控制不了的怪物，正用一种可怕的沉静和礼貌，执拗地问他一个问题。
        - id: ch01-b214
          speaker: paper_guest
          text: 你能给我介绍一家好旅馆吗？
