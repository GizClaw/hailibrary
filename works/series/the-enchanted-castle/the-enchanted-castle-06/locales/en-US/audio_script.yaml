  chapters:
    - id: ch01
      title: CHAPTER VI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnson was now the hero of the hour. Everyone decided that he alone had tracked the burglars, arranged the whole plan, and recovered the missing silver. He certainly had not thrown the stone. Public opinion therefore settled on the idea that Mabel and her aunt had been mistaken, and perhaps there had never been a stone at all. Johnson did not deny receiving the warning letter. After breakfast, Gerald went out to buy the newspaper. He returned and read the others the Liddlesby Observer's report, two whole columns of invention presented as fact. As he went on, every listening mouth fell farther open. At last he reached the grand conclusion. The report praised Johnson as a gifted fellow townsman whose detective instincts surpassed those of both Lecoq and Holmes, and declared that his promotion was now assured. Gerald stopped reading. For a moment, there was a perfect blank silence.
        - id: ch01-b02
          speaker: jimmy
          text: Well, he doesn't praise himself much, does he?
        - id: ch01-b03
          speaker: kathleen
          text: It feels as if we told all those lies ourselves. They couldn't have printed them if you hadn't started it, Jerry. How could Johnson say such things?
        - id: ch01-b04
          speaker: gerald
          text: He had to tell them something, after all. I'm glad I...
        - id: ch01-b05
          speaker: narrator
          text: Gerald stopped suddenly.
        - id: ch01-b06
          speaker: kathleen
          text: You're glad about what?
        - id: ch01-b07
          speaker: gerald
          text: Never mind. Now, what shall we do today? Faithful Mabel is coming for her ring, and you two want it as well. Oh, I know. Our hero has neglected Mademoiselle for more days than he cares to admit.
        - id: ch01-b08
          speaker: jimmy
          text: Stop calling yourself our hero. You aren't mine.
        - id: ch01-b09
          speaker: kathleen
          text: You're both my heroes.
        - id: ch01-b10
          speaker: gerald
          text: Good girl. Keep baby brother cheerful until Nursie comes back.
        - id: ch01-b11
          speaker: kathleen
          text: You're not going without us, are you?
        - id: ch01-b12
          speaker: gerald
          text: I hurry away, for it's market day, and there I shall buy roses for my lady. If you're coming, put on your boots and be quick.
        - id: ch01-b13
          speaker: jimmy
          text: I don't want to come.
        - id: ch01-b14
          speaker: narrator
          text: Jimmy sniffed, and Kathleen looked desperately at Gerald.
        - id: ch01-b15
          speaker: gerald
          text: Oh, James, you make it very hard to forget you're my little brother. If I tease you as I'd tease Turner or Moberley or any of my friends, this is what happens.
        - id: ch01-b16
          speaker: jimmy
          text: You don't call them your baby brothers.
        - id: ch01-b17
          speaker: gerald
          text: No, and I'll be careful never to call you that again. Come along, hero and heroine. Your devoted Mesrour bows before you as your slave.
        - id: ch01-b18
          speaker: narrator
          text: The three met Mabel at the corner of the market square at just the right moment. Every Friday, stalls appeared beneath awnings and green umbrellas. Poultry, pork, pottery, vegetables, cloth, sweets, toys, tools, mirrors, and every other interesting kind of merchandise covered trestle tables. More goods were piled on carts whose horses had been taken away, leaving the shafts propped up on wooden cases. Crockery and hardware spread directly across the bare flagstones. Over all of it, the sun shone with tremendous goodwill.
        - id: ch01-b19
          speaker: mabel
          text: All of nature looks bright and cheerful today.
        - id: ch01-b20
          speaker: narrator
          text: A few flowers stood among the vegetables, and the children paused to choose.
        - id: ch01-b21
          speaker: mabel
          text: Mignonette smells sweet.
        - id: ch01-b22
          speaker: kathleen
          text: But roses are roses.
        - id: ch01-b23
          speaker: jimmy
          text: Carnations only cost twopence.
        - id: ch01-b24
          speaker: narrator
          text: Gerald went from bunch to bunch, sniffing the tightly tied tea roses. Then he agreed that Jimmy's mention of twopence settled everything. They bought three bunches of carnations. The yellow flowers were bright as sulphur. The white ones looked like clotted cream, and the red ones matched the cheeks of the doll Kathleen owned but never played with. They carried the flowers home. On the doorstep, Kathleen gave up her green hair ribbon, which suited the colors beautifully, and they hurriedly tied the bunches together. Then Gerald went to the drawing-room, where Mademoiselle seemed to sit all day, and knocked with great discretion.
        - id: ch01-b25
          speaker: mademoiselle
          text: Come in!
        - id: ch01-b26
          speaker: narrator
          text: She was bent over a sketchbook instead of reading. An unfamiliar-looking paintbox lay open beside a jar of slate-colored water.
        - id: ch01-b27
          speaker: gerald
          text: These are from all of us, with all our love.
        - id: ch01-b28
          speaker: narrator
          text: He set the flowers suddenly before her.
        - id: ch01-b29
          speaker: mademoiselle
          text: But you are a dear child! For this, I must embrace you, yes?
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: Before Gerald could explain that he was too old, she kissed both his cheeks with quick little French pecks.
        - id: ch01-b31
          speaker: gerald
          text: Are you painting?
        - id: ch01-b32
          speaker: narrator
          text: He hurried to hide how annoyed he was at being treated like a baby.
        - id: ch01-b33
          speaker: mademoiselle
          text: I am finishing a sketch of yesterday.
        - id: ch01-b34
          speaker: narrator
          text: Before Gerald could wonder what yesterday looked like in a picture, she showed him a beautiful, exact sketch of Yalding Towers.
        - id: ch01-b35
          speaker: gerald
          text: Oh, that's splendid! May the others come and see?
        - id: ch01-b36
          speaker: narrator
          text: They all came in, including Mabel, who stood awkwardly at the back and peered over Jimmy's shoulder.
        - id: ch01-b37
          speaker: gerald
          text: You really are clever.
        - id: ch01-b38
          speaker: mademoiselle
          text: What good is talent when one must spend one's life teaching infants?
        - id: ch01-b39
          speaker: gerald
          text: It must be fairly beastly.
        - id: ch01-b40
          speaker: mademoiselle
          text: Do you see the picture too? You are a friend from town, yes?
        - id: ch01-b41
          speaker: mabel
          text: How do you do? No, I don't live in town. I live at Yalding Towers.
        - id: ch01-b42
          speaker: narrator
          text: The name made a great impression on Mademoiselle. She repeated it as if she could hardly believe what she had heard. Gerald watched her closely and anxiously hoped she was not a snob.
        - id: ch01-b43
          speaker: mademoiselle
          text: Yalding Towers? How extraordinary! Then are you part of Lord Yalding's family?
        - id: ch01-b44
          speaker: mabel
          text: He hasn't got a family. He isn't married.
        - id: ch01-b45
          speaker: mademoiselle
          text: I mean, are you his cousin, sister, or niece?
        - id: ch01-b46
          speaker: mabel
          text: No. I'm not grand at all. My aunt is Lord Yalding's housekeeper.
        - id: ch01-b47
          speaker: narrator
          text: Mabel went hot and red.
        - id: ch01-b48
          speaker: mademoiselle
          text: But you know Lord Yalding, do you not?
        - id: ch01-b49
          speaker: mabel
          text: No, I've never seen him. He hasn't visited since I came, but he's coming next week.
        - id: ch01-b50
          speaker: mademoiselle
          text: Why does he not live at his own château?
        - id: ch01-b51
          speaker: mabel
          text: Auntie says he's too poor. His uncle left all the money he could to Lord Yalding's second cousin. Lord Yalding has just enough to repair the old house and live quietly somewhere else, but not enough to keep it open and live there. He can't sell it either, because it's in tail.
        - id: ch01-b52
          speaker: mademoiselle
          text: What does it mean, in tail?
        - id: ch01-b53
          speaker: mabel
          text: It means the house is in a tale the lawyers wrote. Once they put your house in one of their tales, you can't sell it or give it away. You have to leave it to your son, even if you don't want to.
        - id: ch01-b54
          speaker: narrator
          text: Mabel was proud of her knowledge and pleased by Mademoiselle's deep interest. Kathleen and Jimmy could not understand why she cared so much about such a dull story.
        - id: ch01-b55
          speaker: mademoiselle
          text: But how could his uncle be so cruel as to leave him the château with no money?
        - id: ch01-b56
          speaker: mabel
          text: I know that too. Lord Yalding wanted to marry a lady his uncle disliked, perhaps a barmaid or a ballet dancer. He refused to give her up, so his uncle left everything to the cousin.
        - id: ch01-b57
          speaker: mademoiselle
          text: Yet you say he is not married.
        - id: ch01-b58
          speaker: mabel
          text: No. The lady went into a convent. I expect they've bricked her up alive by now.
        - id: ch01-b59
          speaker: mademoiselle
          text: Bricked her up?
          emotion: surprised
        - id: ch01-b60
          speaker: mabel
          text: Inside a wall, you know. They shut ladies in until they die. That's what convents do.
        - id: ch01-b61
          speaker: narrator
          text: She pointed to the pink and gold roses on the wallpaper to explain.
        - id: ch01-b62
          speaker: mademoiselle
          text: Not at all! Convents are full of kind, good women. Only the locks on the doors are hateful. Sometimes people cannot get out, especially when they are very young and their relations put them there for their own welfare and happiness. But walling women up to kill them never happens. Did this lord not search for his lady?
        - id: ch01-b63
          speaker: mabel
          text: Oh, he searched for her. But there are millions of convents, and he didn't know where to look. The post office sent all his letters back, and...
        - id: ch01-b64
          speaker: mademoiselle
          text: Heavens! It seems one learns everything in the housekeeper's room.
          emotion: surprised
        - id: ch01-b65
          speaker: mabel
          text: Nearly everything.
        - id: ch01-b66
          speaker: mademoiselle
          text: Do you think he will find her?
        - id: ch01-b67
          speaker: mabel
          text: Of course he will, when he's old and broken down and dying. A gentle Sister of Charity will smooth his pillow. Then, just as he is dying, she'll reveal herself and cry, “My own lost love!” His face will shine with wonderful joy, and he'll die with her dear name on his parched lips.
        - id: ch01-b68
          speaker: narrator
          text: Mademoiselle was too astonished to speak for a moment.
        - id: ch01-b69
          speaker: mademoiselle
          text: So now you are making prophecies?
        - id: ch01-b70
          speaker: mabel
          text: Oh, no. I read that in a book. I can tell you plenty more fatal love stories whenever you like.
        - id: ch01-b71
          speaker: narrator
          text: Mademoiselle gave a little jump, as though she had suddenly remembered something.
        - id: ch01-b72
          speaker: mademoiselle
          text: It is nearly dinner time. Your friend Mabel will be our guest, and we shall make a little feast for her. Kathleen, put my beautiful flowers in water. I shall buy cakes. All of you wash your hands and be ready when I return.
        - id: ch01-b73
          speaker: narrator
          text: She smiled and nodded, then ran upstairs.
        - id: ch01-b74
          speaker: kathleen
          text: She ran just as if she were young.
        - id: ch01-b75
          speaker: mabel
          text: She is young. Plenty of ladies get marriage proposals when they're older than she is. I've seen weddings with much older brides. And why didn't you tell me she was so beautiful?
        - id: ch01-b76
          speaker: kathleen
          text: Is she beautiful?
        - id: ch01-b77
          speaker: mabel
          text: Of course. And what a darling she is to buy cakes for me and call me a guest!
        - id: ch01-b78
          speaker: gerald
          text: It's thoroughly decent of her. Governesses only earn enough to stay alive, and now she's spending her little money on us. What if we stay home and play with her today? She must be terribly bored.
        - id: ch01-b79
          speaker: kathleen
          text: Would she really enjoy it? Aunt Emily says grown-ups only play to please children.
        - id: ch01-b80
          speaker: gerald
          text: They have no idea how often we play to please them.
        - id: ch01-b81
          speaker: kathleen
          text: We promised to dress up in the Princess clothes. Let's do that for her.
        - id: ch01-b82
          speaker: jimmy
          text: Let's start close to tea. Then something will interrupt us before the play lasts forever.
        - id: ch01-b83
          speaker: mabel
          text: Are all the costumes safe?
        - id: ch01-b84
          speaker: kathleen
          text: Quite safe. I told you where I hid them. Come on, Jimmy. We'll help set the table and ask Eliza for the best china.
        - id: ch01-b85
          speaker: narrator
          text: Kathleen and Jimmy went away. Then a sudden thought struck Gerald.
        - id: ch01-b86
          speaker: gerald
          text: We were lucky the burglars didn't take the diamonds from the treasure chamber.
        - id: ch01-b87
          speaker: mabel
          text: They couldn't. They didn't know about them. I think only you and I know, and you swore not to tell. Auntie certainly doesn't know. I found the spring by accident. Lord Yalding has kept the secret well.
        - id: ch01-b88
          speaker: gerald
          text: I wish I had a secret like that to keep.
        - id: ch01-b89
          speaker: mabel
          text: If the burglars do know, it will come out at the trial. Lawyers make you tell everything you know at trials, and plenty of lies besides.
        - id: ch01-b90
          speaker: gerald
          text: There won't be a trial.
        - id: ch01-b91
          speaker: narrator
          text: Gerald thoughtfully kicked the piano leg.
        - id: ch01-b92
          speaker: mabel
          text: No trial?
        - id: ch01-b93
          speaker: gerald
          text: The paper says the villains must have been warned by a confederate. The police were waiting to arrest them when they returned for their stolen goods, but the plan failed. Still, the police have a clue.
        - id: ch01-b94
          speaker: mabel
          text: What a pity!
        - id: ch01-b95
          speaker: gerald
          text: Don't worry. They haven't got any clue worth having.
        - id: ch01-b96
          speaker: mabel
          text: I didn't mean the clue. I meant the confederate.
        - id: ch01-b97
          speaker: gerald
          text: Then it's a pity you pity him, because it was me. I couldn't help it. You'll think I'm a criminal, but I couldn't let them be caught. I once visited a prison with Father. After I gave Johnson the information, I remembered that prison, and I simply couldn't do it. I know I'm a beast and unworthy to be a British citizen.
        - id: ch01-b98
          speaker: narrator
          text: Gerald stood up and stared straight ahead like the boy on the burning deck.
        - id: ch01-b99
          speaker: mabel
          text: I think it was rather kind of you. How did you warn them?
        - id: ch01-b100
          speaker: gerald
          text: I pushed a note under the door of the man whose house I knew and told him to keep out of sight.
        - id: ch01-b101
          speaker: mabel
          text: Oh, tell me exactly what you wrote!
        - id: ch01-b102
          speaker: gerald
          text: I wrote, “The police know everything except your names. Be honest and you'll be safe. But if you burgle again, I'll tell on you. You may depend on that, from a friend.” I know it was wrong, but I couldn't help it. Don't tell the others. They wouldn't understand, and I don't understand it myself.
        - id: ch01-b103
          speaker: mabel
          text: I understand. You did it because your heart is kind and noble.
        - id: ch01-b104
          speaker: gerald
          text: Kind fiddlesticks, my good child! Go and wash your hands. You're black as ink.
        - id: ch01-b105
          speaker: narrator
          text: In a flash, Gerald dropped the tragic pose and became himself again.
        - id: ch01-b106
          speaker: mabel
          text: So are you, and I'm not dirty. Mine is dye. Auntie tried to dye a blouse this morning from instructions in Home Drivel. She's black as ink too, and the blouse is streaky. It's a pity the ring can't make only parts of you invisible, such as the dirt.
        - id: ch01-b107
          speaker: gerald
          text: Perhaps it won't make even all of you invisible again.
        - id: ch01-b108
          speaker: mabel
          text: Why not? You haven't done anything to it, have you?
        - id: ch01-b109
          speaker: gerald
          text: No. But you were invisible for twenty-one hours, I was invisible for fourteen, and Eliza for seven. Each time was seven hours shorter. Now we've reached...
        - id: ch01-b110
          speaker: mabel
          text: You are frightfully good at sums!
          emotion: surprised
        - id: ch01-b111
          speaker: gerald
          text: Seven less than seven is nothing, so the ring must do something different this time. After that it can't do minus seven hours, unless it makes you more visible than usual. Thicker, perhaps.
        - id: ch01-b112
          speaker: mabel
          text: Stop! You're making my head spin.
        - id: ch01-b113
          speaker: gerald
          text: There's something else. When you're invisible, your family doesn't love you. Your aunt didn't, and Cathy hardly cared when I went burgling. We haven't discovered everything about that ring yet. Crikey, Mademoiselle is back with the cakes! Run, bold bandits! Wash for your lives!
        - id: ch01-b114
          speaker: narrator
          text: They ran to wash. Mademoiselle had brought far more than cakes. There were plums and grapes, jam tarts, soda water and raspberry vinegar, chocolates packed in pretty boxes, pure thick cream in brown jugs, and a great bunch of roses. Mademoiselle was strangely merry for a governess. Though she ate very little herself, she served cakes and tarts with a generous hand. She turned the roses into wreaths and placed one on every head. Then she mixed raspberry vinegar with soda water to make a beautiful pink drink and solemnly drank to Mabel's health as the guest of the day. Jimmy resisted his wreath at first. Mademoiselle finally won him over by pointing out that at a feast, the Greek gods wore wreaths just as the goddesses did.
        - id: ch01-b115
          speaker: narrator
          text: Surely no French governess had ever provided such a feast since French governesses first existed. Jokes, stories, and laughter went round the table with the food. Jimmy performed every one of his well-loved tricks with forks and corks, matches and apples. Mademoiselle told stories from her own schooldays, when she had been a very little girl with two tight braids. The children could not understand what she meant by the braids, so she called for pencil and paper. She drew a delightful little picture of herself as a child, with two short, fat pigtails sticking straight out from her head like knitting needles from a ball of dark wool. After that, the children asked her to draw one thing after another. She obliged every time, until at last Mabel pulled at Gerald's jacket and whispered urgently to remind him of the acting.
        - id: ch01-b116
          speaker: mabel
          text: The play!
        - id: ch01-b117
          speaker: gerald
          text: Draw us the front of a theatre next. A French theatre.
        - id: ch01-b118
          speaker: mademoiselle
          text: French theatres look the same as English ones.
        - id: ch01-b119
          speaker: gerald
          text: Do you like acting? I mean, do you enjoy the theatre?
        - id: ch01-b120
          speaker: mademoiselle
          text: Oh, yes. I love it.
        - id: ch01-b121
          speaker: gerald
          text: Good. We'll perform a play for you this afternoon, if you like.
        - id: ch01-b122
          speaker: kathleen
          text: Eliza will be washing up, and we promised she could watch.
        - id: ch01-b123
          speaker: gerald
          text: Then we'll do it this evening. Mademoiselle, may Eliza come and see it too?
        - id: ch01-b124
          speaker: mademoiselle
          text: Certainly. Go and enjoy yourselves, my children.
        - id: ch01-b125
          speaker: mabel
          text: But we want to entertain you, because we all love you very much. Don't we?
        - id: ch01-b126
          speakers: [gerald, jimmy, kathleen]
          ensemble: chorus
          text: Yes, we do!
        - id: ch01-b127
          speaker: narrator
          text: The others would never have thought to say it themselves. But once Mabel said it, they were surprised to find it was true.
        - id: ch01-b128
          speaker: mademoiselle
          text: You love the old French governess? Impossible!
        - id: ch01-b129
          speaker: narrator
          text: Her words came out rather indistinctly.
        - id: ch01-b130
          speaker: mabel
          text: You're not old. Well, not very old. And you're as lovely as a princess.
        - id: ch01-b131
          speaker: mademoiselle
          text: Go away, you little flatterer!
          emotion: happy
        - id: ch01-b132
          speaker: narrator
          text: Mademoiselle laughed. Mabel ran after the others, who were already halfway upstairs.
        - id: ch01-b133
          speaker: narrator
          text: Mademoiselle stayed in the drawing room as usual, but serious study would have been impossible. The door opened and shut almost without stopping all afternoon. First the children wanted the embroidered chair covers and the sofa cushions. Then they wanted the clothesline from the washhouse. Eliza had forbidden it, but did Mademoiselle say they might use it? Could they also take the sheepskin rugs from the hearths? Soon they had nearly finished the stage in the dining room, and Eliza wanted to lay tea there, so could everyone have tea in the garden instead? And did Mademoiselle own any colored clothes at all? Scarves, dressing gowns, anything bright would do. Yes, she had some. She brought out silk things so surprisingly lovely that nobody would have expected a governess to possess them, and she lent the children everything they asked for.
        - id: ch01-b134
          speaker: narrator
          text: Then came the question of rouge. The children had always heard that French ladies used it. Mademoiselle had none, and the color that rose in her face showed plainly that she did not need it. Next they asked whether she had any false hair to spare. That was a challenge. Mademoiselle raised her pale hands and pulled out one hairpin after another, a dozen in all. Down came her own beautiful blue-black hair. It hung to her knees in straight, heavy lines, proving that she had no possible need of false hair either.
        - id: ch01-b135
          speaker: mademoiselle
          text: No, you terrible infants! I have no false hair and no rouge. Perhaps you want my teeth as well?
        - id: ch01-b136
          speaker: narrator
          text: She displayed those teeth in a laugh.
        - id: ch01-b137
          speaker: mabel
          text: I said you were a princess, and now I know it. You're Rapunzel! You should always wear your hair down. May we also have the peacock fans, the curtain ties, and every handkerchief you own?
        - id: ch01-b138
          speaker: narrator
          text: Mademoiselle refused them nothing. They took the fans and handkerchiefs, large sheets of costly drawing paper, her best sable brush, and her paintbox.
        - id: ch01-b139
          speaker: gerald
          text: Who would have guessed she was such a brick in disguise? And why does crimson lake paint taste exactly like Liebig's Extract?
        - id: ch01-b140
          speaker: narrator
          text: Gerald thoughtfully sucked the brush and studied the paper mask he had just painted. Everything went pleasantly that day. Some days are like that. Every object you need waits in its proper place. Nobody misunderstands you, and everything you try turns out well. Other days are the exact opposite. Your shoelace breaks. Your comb disappears. Your brush spins onto its back, slides under the bed, and stops where your hand cannot reach it. You drop the soap. Your buttons come off. An eyelash gets into your eye. You discover there is no clean handkerchief left, and the worn edge of your collar cuts your neck. At the last possible moment, a suspender breaks and there is no string anywhere. Naturally, all this makes you late for breakfast, and everyone believes you did it deliberately. The day only grows worse. Your exercise book vanishes. Your arithmetic book lands in the mud. Your pencil breaks, and when you open your knife to sharpen it, you split your nail. Doors trap your thumb. You confuse the messages grown-ups send you to deliver. You spill your tea, and your bread and butter refuses to stay together. At last you reach bed, usually in disgrace. By then, it is no comfort at all to know that not one bit of the trouble was your fault.
        - id: ch01-b141
          speaker: narrator
          text: This day, as you will have noticed, was not one of those bad days. Even tea in the garden was delightful. A patch of brick beside the rockery gave the tea table a firm, level floor. Yet four of the five children thought more about the coming play than about the food before them. The fifth had private thoughts of her own, and those thoughts had nothing at all to do with tea or acting. When tea ended, the house filled once more with busy preparations. Doors slammed, then came long and interesting silences. Feet raced up the stairs and down again, over and over.
        - id: ch01-b142
          speaker: narrator
          text: It was still broad daylight when the dinner bell rang. That was the signal the children had agreed upon at tea and carefully explained to Eliza. Mademoiselle put down her book. She crossed the hall, which the setting sun had turned yellow, and entered the dining room with its faint yellow gaslight. Eliza held the door open for her, giggling all the while, and then followed her inside. The shutters were closed, though narrow bands of daylight slipped in above and below them. The children had taken the green-and-black cloths from the school dining tables and hung them across the room. A clothesline from the backyard supported these stage curtains. The line drooped in a graceful curve, but it did the necessary work and hid the part of the room that had become the stage.
        - id: ch01-b143
          speaker: narrator
          text: At the other end of the room, rows of chairs faced the curtains. It looked as though the children had collected every chair in the house. Mademoiselle started violently when she saw that half a dozen seats were already occupied. The people sitting there were the strangest guests imaginable. One looked like an old woman in a deep bonnet tied beneath her chin with a red handkerchief. Another seemed to be a lady in a huge straw hat covered with flowers. Her very odd hands stuck out over the chair in front of her. Several men sat among them, each with a clumsy, unnatural shape, and every one of them kept his hat on indoors.
        - id: ch01-b144
          speaker: mademoiselle
          text: Have you invited other friends? You should have asked me first, my children.
        - id: ch01-b145
          speaker: narrator
          text: Laughter and something like a cheer came from behind the curtains.
        - id: ch01-b146
          speaker: mabel
          text: It's all right, Mademoiselle Rapunzel. Turn up the gas. They're part of the entertainment.
        - id: ch01-b147
          speaker: narrator
          text: Still giggling, Eliza squeezed between the chairs and knocked a visitor's hat off before turning up the three burners. Mademoiselle bent over the nearest figure, half laughed, screamed, and sat down suddenly.
        - id: ch01-b148
          speaker: mademoiselle
          text: Oh! They are not alive!
          emotion: fearful
        - id: ch01-b149
          speaker: eliza
          text: They haven't got any insides!
          emotion: fearful
        - id: ch01-b150
          speaker: narrator
          text: Eliza had discovered the same thing with a much louder scream. The seven audience members had very little in the way of insides. Bolsters and tightly rolled blankets formed their bodies. Broom handles ran down their backs as spines, while hockey sticks and umbrellas served as the bones of arms and legs. Their shoulders were the wooden crosspieces Mademoiselle used to keep her jackets in shape. Gloves packed with handkerchiefs made their hands. For heads, the children had stuffed the round ends of bolster cases. Gerald's painted paper masks were tied over them as faces. Those faces were truly dreadful. Gerald had done his best, but some would hardly have looked like faces if they had not been placed in the usual position between collar and hat. Lampblack made their eyebrows furiously dark. Their eyes were almost as large and round as five-shilling pieces. Gerald had spent quantities of crimson lake on the lips and cheeks, along with nearly an entire half-pan of vermilion.
        - id: ch01-b151
          speaker: mademoiselle
          text: You have made yourselves an audience! Bravo!
          emotion: happy
        - id: ch01-b152
          speaker: narrator
          text: Mademoiselle recovered her courage and began to clap. At the sound, the curtains did not rise so much as pull apart. Behind them appeared a real stage. The children had shoved the dining tables close together and hidden them under pink-and-white counterpanes. Anyone walking across it made it creak and wobble a little, but from the audience it looked most imposing.
        - id: ch01-b153
          speaker: gerald
          text: Beauty and the Beast!
        - id: ch01-b154
          speaker: narrator
          text: Gerald's announcement came from the wings in a breathless, choked voice. The scene itself was simple, but perfectly convincing. A large sheet of cardboard had been bent into a square. Slits cut through it glowed from a candle placed behind, so it could only be the family hearth. Eliza's round hatbox stood on a stool with a nightlight underneath. No fair-minded person could have mistaken it for anything but a laundry copper. A wastebasket held two or three school dusters and an overcoat. A pair of blue pajamas hung across the back of a chair and completed the picture. Someone announced from the wings that this was the laundry at Beauty's home, though the explanation was hardly needed.
        - id: ch01-b155
          speaker: mabel
          text: They look like a real audience, don't they? Go on, Jimmy. Remember, the Merchant is pompous and uses long words.
        - id: ch01-b156
          speaker: narrator
          text: Pillows stuffed beneath Gerald's large overcoat made Jimmy enormous. With a towel turban on his head and an open umbrella above it, he began the first act.
        - id: ch01-b157
          speaker: jimmy
          text: I am the unluckiest merchant who ever lived. Once I was the richest merchant in Bagdad, but every ship I owned was lost. Now my house is falling apart. Rain pours through the roof, and my daughters must take in washing. And...
        - id: ch01-b158
          speaker: narrator
          text: The pause grew long. Then Gerald swept in as the eldest daughter, elegant in Mademoiselle's pink dressing gown.
        - id: ch01-b159
          speaker: gerald
          text: What fine weather for drying clothes! Dear Papa, turn your umbrella upside down. Then we won't have to fetch rainwater. Come, sisters. Father has bought us a new washtub. What luxury!
        - id: ch01-b160
          speaker: narrator
          text: The three sisters knelt around the upturned umbrella and washed imaginary linen. Kathleen wore Eliza's violet skirt, her own blue blouse, and a cap of knotted handkerchiefs. Mabel's white nightdress, white apron, red carnations, and black hair made it perfectly clear that she was Beauty.
        - id: ch01-b161
          speaker: narrator
          text: The first scene went beautifully. Its final dance, performed with towels waving in the air, was utterly charming according to Mademoiselle. Eliza laughed so heartily that she gave herself a painful stitch in her side. You can imagine what Beauty and the Beast was like when acted by four children who had spent the entire afternoon arranging costumes and left no time at all to rehearse what they would say. Still, it delighted the actors and charmed their audience. What more can any play do, even a play by Shakespeare? Mabel looked magnificent as Beauty in the Princess clothes. Gerald became a Beast by wrapping himself in the drawing-room hearth rugs, and he wore them with an air of impossible distinction. Jimmy did not make a very talkative merchant, but the pillows gave him almost unlimited stoutness. Kathleen surprised and pleased even herself by changing with remarkable speed from one smaller role to another, appearing as fairies, servants, and messengers whenever the play required them.
        - id: ch01-b162
          speaker: mabel
          text: You might give us the ring back now.
        - id: ch01-b163
          speaker: narrator
          text: At the end of the second act, Mabel had no costume change to make. Gerald sweltered under his magnificent beast skin.
        - id: ch01-b164
          speaker: gerald
          text: I will. I'd forgotten it. I'll hand it to you in the next scene, but don't lose it or put it on. You might all vanish forever. Or perhaps you'd become seven times more solid than anyone else, until the rest of us looked like shadows beside you. Or...
        - id: ch01-b165
          speaker: kathleen
          text: Ready!
        - id: ch01-b166
          speaker: narrator
          text: Kathleen hurried in as a wicked sister. Gerald reached beneath the hearth rug and into his pocket. Rolling his eyes in agonies of feeling, he pressed a ring into Beauty's hand.
        - id: ch01-b167
          speaker: gerald
          text: Farewell, dear Beauty! Return soon, for your faithful Beast will perish if you stay away. Take this magic ring. It will grant any wish. When you want to return to your devoted Beast, put it on and speak your wish. At once, you will stand beside me.
        - id: ch01-b168
          speaker: narrator
          text: Beauty-Mabel accepted the ring, and it was the ring. The curtains closed to warm applause from two pairs of hands.
        - id: ch01-b169
          speaker: narrator
          text: The next scene went splendidly too. Beauty's sisters behaved so disagreeably that their acting seemed almost too natural. They used real soap and water in the laundry, and some of it splashed onto Beauty's Princess dress. Mabel's genuine annoyance passed for a miracle of fine acting. Even Jimmy's merchant rose to something greater than a mere collection of pillows. As the curtains closed, he pitifully assured everyone that while his dear Beauty was away, he was wasting down to a shadow. Once again, the only applause came from two pairs of hands, Mademoiselle's and Eliza's.
        - id: ch01-b170
          speaker: gerald
          text: Here, Mabel, take this.
        - id: ch01-b171
          speaker: narrator
          text: Gerald appealed for help from beneath a whole pile of stage scenery. He was carrying a towel horse, the tea urn, the tea tray, and the green baize apron that belonged to the boot boy. These objects were meant to become the fountains and garden of the final act. The children had also gathered four red geraniums from the landing, the tall pampas grass from the drawing-room fireplace, and the rubber plants from the drawing-room window. By the time Mabel came to take the tea urn from him, the last applause had died away.
        - id: ch01-b172
          speaker: mabel
          text: I wish those creatures we made were alive. Then we'd get some real applause.
        - id: ch01-b173
          speaker: narrator
          text: Mabel took the weight of the tea urn.
        - id: ch01-b174
          speaker: gerald
          text: I'm very glad they aren't alive. Horrid things! Their paper eyes make me feel foolish whenever I look at them.
        - id: ch01-b175
          speaker: narrator
          text: The curtains drew back for the final act. Gerald, coated in hearth rugs, lay stretched out in utter abandonment among the tropical wonders of the garden. Pampas grass made a shrubbery. Rubber plants became bushes, the red geraniums became trees, and the tea urn served as a fountain. Beauty waited to make her grand entrance in all the thrilling splendor of despair. Then, all at once, it happened.
        - id: ch01-b176
          speaker: narrator
          text: Mademoiselle began it by applauding the garden scene with the quick little claps of her French hands. Eliza joined in, striking her broad red palms together heavily. Then someone else was clapping. In another moment, six or seven other people had joined them, and those new hands made a dull, padded sound. Nine faces now turned toward the stage instead of two. Seven of the nine were painted, pointed faces made of paper, but every face was alive, and every hand moved. As Mabel glided forward, the applause grew louder. She reached her place, looked out at the audience, and stopped. Her horror and amazement needed no acting at all. The living audience mistook that frozen stare for a magnificent pose and applauded more loudly than ever.
        - id: ch01-b177
          speaker: narrator
          text: But their applause could not cover Mademoiselle's and Eliza's screams. The two women rushed out, overturning chairs and crushing together in the doorway. Far away, two doors slammed shut.
        - id: ch01-b178
          speaker: mabel
          text: Curtain! Quick, close the curtain! Jerry, those things are alive. What are we going to do?
          emotion: fearful
        - id: ch01-b179
          speaker: narrator
          text: It was neither Mabel's voice nor Beauty's. Gerald sprang up in his hearth rugs. Another burst of padded applause followed the swish of cloth as Jimmy and Kathleen closed the curtains.
        - id: ch01-b180
          speakers: [jimmy, kathleen]
          ensemble: duo
          text: What's happened?
        - id: ch01-b181
          speaker: gerald
          text: You've done it this time! Oh, bother these strings!
        - id: ch01-b182
          speaker: mabel
          text: Can't you break them? I've done it? That's a fine thing to say!
        - id: ch01-b183
          speaker: gerald
          text: I don't like it any better.
        - id: ch01-b184
          speaker: mabel
          text: It will be all right. We must pull the things apart. Then they can't stay alive.
        - id: ch01-b185
          speaker: gerald
          text: This is your fault. Don't you see? The ring grants wishes now. I knew it would do something different. Get my knife out of my pocket. This string is knotted. Jimmy, Cathy, Mabel wished those Ugly-Wuglies alive. Go and pull them apart.
        - id: ch01-b186
          speaker: narrator
          text: Jimmy and Kathleen peeped through the curtain. They drew back with white faces and staring eyes.
        - id: ch01-b187
          speaker: jimmy
          text: Not me!
          emotion: fearful
        - id: ch01-b188
          speaker: kathleen
          text: Certainly not!
          emotion: fearful
        - id: ch01-b189
          speaker: narrator
          text: Kathleen plainly meant it. Gerald had almost escaped the rugs when his thumbnail broke on the stiffest blade of his knife. Beyond the curtain came thick rustling and sharp, heavy thumps.
        - id: ch01-b190
          speaker: kathleen
          text: They're leaving! They're walking on umbrella and broomstick legs. You can't stop them, Jerry. They're too horrible!
          emotion: fearful
        - id: ch01-b191
          speaker: gerald
          text: Everyone in town will be mad by tomorrow night if we don't stop them. Give me the ring. I'll wish them dead again.
        - id: ch01-b192
          speaker: narrator
          text: Gerald snatched the ring from the unresisting Mabel.
        - id: ch01-b193
          speaker: gerald
          text: I wish the Uglies weren't alive!
        - id: ch01-b194
          speaker: narrator
          text: He tore through the door. In his mind, Mabel's wish had already been undone. He expected to find an empty hall strewn with limp bolsters, hats, umbrellas, coats, and gloves. They would be nothing but fallen stage properties again, with their brief spark of life gone out forever. But the hall was crowded with living things. Strange things. They were all horribly short, because broom handles and umbrellas are short. One limp hand gestured toward him. Above it, a pointed white paper face with painted red cheeks looked up. Wide red lips moved, and a voice made sounds that Gerald could not understand at all.
        - id: ch01-b195
          speaker: narrator
          text: The voice reminded Gerald of the old beggar who lived down by the bridge and had no roof to his mouth. Of course, these creatures had no roofs to their mouths either. They had paper faces, not real mouths at all. The jumble of sounds came again, and then again. Four times the creature patiently repeated itself before Gerald could gather enough courage and attention to understand. This horror was alive and probably quite uncontrollable, yet it spoke with dreadful calm and unfailing politeness. It was asking one simple question.
        - id: ch01-b196
          speaker: ugly_wugly_1
          text: Can you recommend a good hotel?
