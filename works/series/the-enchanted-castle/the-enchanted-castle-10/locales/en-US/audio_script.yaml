  chapters:
    - id: ch01
      title: CHAPTER X
      blocks:
        - id: ch01-b01
          speaker: kathleen
          text: If I truly am a statue that has come alive, why aren't you afraid of me?
        - id: ch01-b02
          speaker: mabel
          text: Because I have the ring. Cheer up, dear. You'll soon be better, so try not to think about it.
        - id: ch01-b03
          speaker: narrator
          text: Mabel spoke as if Kathleen were a small child who had cut a finger, or fallen on a garden path and stood up with grazed knees and bits of gravel sticking to them. Being turned into living marble was something to be comforted away in just the same sensible tone.
        - id: ch01-b04
          speaker: kathleen
          text: Yes, I know.
        - id: ch01-b05
          speaker: mabel
          text: I've been thinking. We could learn a great deal about this magical place if the other statues aren't too proud to speak to us.
        - id: ch01-b06
          speaker: kathleen
          text: They aren't. Phoebus wasn't, anyway. He was wonderfully polite and kind.
        - id: ch01-b07
          speaker: mabel
          text: Where is he?
        - id: ch01-b08
          speaker: kathleen
          text: He was in the lake.
        - id: ch01-b09
          speaker: mabel
          text: Then let's go there. Oh, Cathy, it feels splendid to be my proper size again!
        - id: ch01-b10
          speaker: narrator
          text: Mabel sprang up. When she had been stretched to that terrible length, dead ferns and branches had been gathered closely over her. Now, as she rose at her proper size, they all fell away. They dropped like forest leaves torn loose by a sudden storm. But white marble Kathleen stayed where she was and made no move to follow.
        - id: ch01-b11
          speaker: narrator
          text: The two girls sat on the grey grass under the moon, with the whole quiet night around them. The enormous park lay as still as a painted picture. A fountain splashed somewhere in the distance. Farther away, the Western express gave a lonely whistle. Those were the only sounds, and when they faded, the silence seemed deeper than before.
        - id: ch01-b12
          speaker: phoebus
          text: Good cheer, little sister!
        - id: ch01-b13
          speaker: narrator
          text: A golden voice spoke behind them. They turned with a start. Phoebus stood in the moonlight, still dripping from the lake, and his smile was gentle and friendly.
        - id: ch01-b14
          speaker: kathleen
          text: Oh, it's you!
          emotion: surprised
        - id: ch01-b15
          speaker: phoebus
          text: It is indeed. And who is this earth-child with you?
        - id: ch01-b16
          speaker: kathleen
          text: This is Mabel.
        - id: ch01-b17
          speaker: narrator
          text: Mabel rose and bowed. After a moment, she offered him her hand.
        - id: ch01-b18
          speaker: phoebus
          text: I am your servant, little lady. But how can you see us, and why aren't you frightened?
        - id: ch01-b19
          speaker: narrator
          text: Mabel showed him the hand that wore the ring.
        - id: ch01-b20
          speaker: phoebus
          text: That explains everything. But if you have the ring, why keep that patchy earthly look? Become a statue and swim with us.
        - id: ch01-b21
          speaker: mabel
          text: I can't swim.
        - id: ch01-b22
          speaker: kathleen
          text: Neither can I.
        - id: ch01-b23
          speaker: phoebus
          text: You can now. Every statue that comes alive can perform any athletic exercise. Dark-eyed child with hair like night, wish yourself into marble and join our revels.
        - id: ch01-b24
          speaker: mabel
          text: I'd rather not, if you don't mind. With this ring, you never know how long a wish will last. Being a statue might be lovely tonight, but by morning I could be very sorry.
        - id: ch01-b25
          speaker: phoebus
          text: Earth people often are. But you do not understand your ring. Make an exact wish, and it will obey exactly. Leave out the time, and strange enchantments from Arithmos, the banished god of numbers, will creep in and spoil it. Say, "I wish that until dawn I may be a statue of living marble like my child friend, and that afterward I may be Mabel again, with dark eyes and night-coloured hair."
        - id: ch01-b26
          speaker: kathleen
          text: Oh, please do, Mabel! It would be such fun. And if we're both statues, will we still be afraid of the dinosaurus?
        - id: ch01-b27
          speaker: phoebus
          text: There is no fear among living marble. The dinosaurus and we are brothers, all made of stone and life.
        - id: ch01-b28
          speaker: mabel
          text: And I really could swim?
        - id: ch01-b29
          speaker: phoebus
          text: You could swim, float, and dive. You could help the ladies of Olympus lay out their nightly feast, taste the food and drink of the gods, hear their undying song, and listen to immortal laughter.
        - id: ch01-b30
          speaker: kathleen
          text: A feast! Please do it, Mabel. You would if you were as hungry as I am.
        - id: ch01-b31
          speaker: mabel
          text: But it won't be real food.
        - id: ch01-b32
          speaker: phoebus
          text: It will be real to you, just as it is to us. Even in your many-coloured world, there is no other kind of real.
        - id: ch01-b33
          speaker: narrator
          text: Mabel still hesitated. Then she looked at Kathleen's marble legs and made up her mind.
        - id: ch01-b34
          speaker: mabel
          text: Very well. But first I must take off my shoes and stockings. Marble boots would look dreadful, especially the laces. And one of my stockings is falling down. Imagine that in marble!
        - id: ch01-b35
          speaker: narrator
          text: She took off her shoes, stockings, and pinafore.
        - id: ch01-b36
          speaker: phoebus
          text: Mabel understands beauty. Speak the spell, child, and I will take you to the ladies of Olympus.
        - id: ch01-b37
          speaker: narrator
          text: Mabel trembled a little as she made the wish. A moment later, two small living statues stood in the moonlit clearing. Tall Phoebus took one girl by each hand.
        - id: ch01-b38
          speaker: phoebus
          text: Come, run!
        - id: ch01-b39
          speaker: narrator
          text: They ran.
        - id: ch01-b40
          speaker: mabel
          text: Oh, this is wonderful! Look at my white feet in the grass. I thought a statue would feel stiff, but I don't.
          emotion: happy
        - id: ch01-b41
          speaker: phoebus
          text: Immortals are never stiff. Tonight, you are one of us.
        - id: ch01-b42
          speaker: narrator
          text: They raced down the slope to the lake.
        - id: ch01-b43
          speaker: phoebus
          text: Jump!
        - id: ch01-b44
          speaker: narrator
          text: All three leaped. Water splashed around three white, shining forms.
        - id: ch01-b45
          speaker: kathleen
          text: I can swim!
          emotion: surprised
        - id: ch01-b46
          speaker: mabel
          text: So can I!
          emotion: surprised
        - id: ch01-b47
          speaker: phoebus
          text: Naturally. Three times around the lake, and then we'll head for the island.
        - id: ch01-b48
          speaker: narrator
          text: The three swam side by side. Phoebus moved gently so the children could keep pace with him. Their marble clothes did not drag at them at all, though ordinary clothes certainly would if you jumped into a fountain and tried to swim. They moved beautifully, without effort and without ever growing tired. It was exactly like the easy swimming you sometimes do in dreams. Long, snakelike water-lily stems trouble ordinary swimmers, but these stems could not catch or hinder marble arms and legs. High above them, the moon stood in a clear dome of sky. Around the water were weeping willows, dark cypresses, temples and terraces, banks of trees and shrubs, and the wonderful old house. Together they made the lake seem more romantic than any place the girls had ever known.
        - id: ch01-b49
          speaker: mabel
          text: This is the best thing the ring has ever given us.
        - id: ch01-b50
          speaker: phoebus
          text: I thought you would like it. One more turn, and then the island.
        - id: ch01-b51
          speaker: narrator
          text: They came ashore through a fringe of rushes and flowers. There was yarrow, willow-herb, loose-strife, and here and there a late head of meadow-sweet, creamy, powdery, and scented. From the bank, the island had looked small. Once they stood on it, it seemed much larger and thickly covered with trees and shrubs. Phoebus led them beneath those trees. Beyond the trunks they saw a light, but it shone much nearer than the opposite shore could possibly be. A few more steps carried them through the belt of trees. Behind them, the trunks stood thick and dark in a circle, like a crowd gathered around a football field, as Kathleen pointed out.
        - id: ch01-b52
          speaker: narrator
          text: First came a broad, smooth ring of grass. Inside it, marble steps led down to a round pool. No water lilies grew there. Instead, gold and silver fish darted through the water like quicksilver flashes and dark little flames. A clear white radiance filled the grass, stone, and water, seven times stronger than the whitest moonlight. Seven moons lay reflected in the still pool. Whenever a fish steered past with moving fins and tail, the round shapes broke and trembled, proving that they were reflections. The girls looked straight up, half expecting seven moons in the sky as well. But the old moon shone there alone, just as it always had.
        - id: ch01-b53
          speaker: mabel
          text: There are seven moons in the water.
          emotion: surprised
        - id: ch01-b54
          speaker: phoebus
          text: Of course. In our world, everything is seven times as much as it is in yours.
        - id: ch01-b55
          speaker: mabel
          text: But there aren't seven of you.
        - id: ch01-b56
          speaker: phoebus
          text: No, but I am seven times as much. There are numbers, quantity, and quality too. Surely you see.
        - id: ch01-b57
          speaker: kathleen
          text: Not quite.
        - id: ch01-b58
          speaker: phoebus
          text: Explanations always tire me. Shall we join the ladies?
        - id: ch01-b59
          speaker: narrator
          text: Across the pool stood a gathering of twenty or thirty living statues. They were so brilliantly white that they seemed to make a great white opening in the trees. Some sat with their pale feet among the gold and silver fish, sending ripples across the faces of all seven moons. Some pelted one another with roses, and the flowers smelled so sweet that the girls caught their scent from the other side of the pool. Others joined hands and danced in a ring. On the steps, two more played cat's-cradle, which is a very ancient game indeed, using a thread of white marble.
        - id: ch01-b60
          speaker: narrator
          text: The newcomers were met with cheers and laughter.
        - id: ch01-b61
          speaker: olympian_1
          text: Late again, Phoebus!
        - id: ch01-b62
          speaker: olympian_2
          text: Did one of your horses lose a shoe?
        - id: ch01-b63
          speaker: narrator
          text: A third called out a joke about laurels.
        - id: ch01-b64
          speaker: phoebus
          text: I have brought two guests.
        - id: ch01-b65
          speaker: narrator
          text: At once, the statues came crowding around their visitors. Cool marble hands smoothed the girls' hair and patted their cheeks. Friendly voices welcomed them with all the prettiest and most affectionate names they knew.
        - id: ch01-b66
          speaker: hera
          text: Hebe, are the wreaths ready? Make two more!
        - id: ch01-b67
          speaker: narrator
          text: Almost at once Hebe came down the steps. Thick rose wreaths hung all along her round arms, enough to crown every marble head. When everyone wore one, the whole company looked seven times lovelier than before, which is saying a great deal when the company is made of gods and goddesses. The children remembered the raspberry-vinegar feast, when Mademoiselle had told them that gods and goddesses always wore wreaths with their meals.
        - id: ch01-b68
          speaker: narrator
          text: Hebe settled roses on the girls. Then Aphrodite Urania, the dearest lady in the world, took their hands. Her voice sounded like a mother's in the moments when she is loved most.
        - id: ch01-b69
          speaker: aphrodite_urania
          text: Come, we must prepare the feast. Eros, Psyche, Hebe, Ganymede, all you young ones may arrange the fruit.
        - id: ch01-b70
          speaker: kathleen
          text: But I don't see any fruit.
        - id: ch01-b71
          speaker: narrator
          text: Four slender figures came away from the white crowd.
        - id: ch01-b72
          speaker: eros
          text: You will. You only have to pick it.
        - id: ch01-b73
          speaker: psyche
          text: Like this.
        - id: ch01-b74
          speaker: narrator
          text: Psyche reached toward a willow branch. When she opened her hand, a ripe pomegranate lay in it.
        - id: ch01-b75
          speaker: mabel
          text: I understand. You just reach out and pick it.
        - id: ch01-b76
          speaker: narrator
          text: She touched the willow and found a large, softly firm peach beneath her fingers.
        - id: ch01-b77
          speaker: psyche
          text: Yes, that's all!
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: Hebe found several silver baskets growing conveniently on an alder. Then she and the other young people worked busily, picking impossible fruit from the trees and filling every basket. Meanwhile, the older statues reached into ash trees and young oaks. From their branches they plucked golden goblets, shining jugs, and broad dishes. They filled them with every good thing anyone could wish to eat or drink, then arranged the whole feast along the marble steps.
        - id: ch01-b79
          speaker: narrator
          text: It was a heavenly picnic. Everyone sat or stretched out on the steps, and the feast began. Oh, the taste of the food on those golden dishes! The drink melted sweetly from the cups onto the white lips of the company. No fruit grown on earth could compare with theirs. No earthly laughter sounds like the laughter of immortal lips, and no earthly songs are like the songs that stirred the silence of that wonderful night.
        - id: ch01-b80
          speaker: kathleen
          text: Oh, I wish the boys were here!
        - id: ch01-b81
          speaker: narrator
          text: Juice from her third peach ran through her fingers like tears onto the marble steps.
        - id: ch01-b82
          speaker: mabel
          text: I wonder what they're doing now.
        - id: ch01-b83
          speaker: narrator
          text: Hermes swept around them in a wide circle of flight and returned like a pigeon.
        - id: ch01-b84
          speaker: hermes
          text: At this very moment, they are wandering sadly near the dinosaurus's home. They climbed out of a window and came looking for you. They fear you are dead, and they would cry if they did not believe tears were unsuitable for men, however young.
        - id: ch01-b85
          speaker: narrator
          text: Kathleen stood and brushed crumbs of ambrosia from her marble lap.
        - id: ch01-b86
          speaker: kathleen
          text: Thank you all very much. It was very kind of you, and we have had a wonderful time. But I think we ought to leave now, please.
        - id: ch01-b87
          speaker: phoebus
          text: If you are worried about your brothers, they can easily join you. Lend me the ring for a moment.
        - id: ch01-b88
          speaker: narrator
          text: Kathleen gave it up unwillingly. Phoebus dipped it into one of the seven reflected moons and returned it. She held it tight.
        - id: ch01-b89
          speaker: phoebus
          text: Now make the same wish for them that Mabel made for herself.
        - id: ch01-b90
          speaker: kathleen
          text: I know. I wish that the boys may be living marble statues like Mabel and me until dawn, and afterward become what they are now.
        - id: ch01-b91
          speaker: phoebus
          text: If you had not interrupted me... Well, young marble cannot be expected to carry old heads. You should also have wished them here. Never mind. Hermes, old friend, fly over, fetch them, and explain on the way.
        - id: ch01-b92
          speaker: narrator
          text: Phoebus dipped the ring into another reflected moon before returning it.
        - id: ch01-b93
          speaker: phoebus
          text: There. It is washed clean and ready for the next piece of magic.
        - id: ch01-b94
          speaker: hera
          text: We do not usually question guests. Still, that ring interests every one of us.
        - id: ch01-b95
          speaker: phoebus
          text: It is the ring.
        - id: ch01-b96
          speaker: hera
          text: Certainly. If asking were not inhospitable, I would ask how it came into the hands of these earth-children.
        - id: ch01-b97
          speaker: phoebus
          text: That is a long tale. First the feast, then the story, and after the story, the song.
        - id: ch01-b98
          speaker: narrator
          text: Hermes must have explained everything very well on the journey. Gerald and Jimmy arrived in shining white marble, each one clinging to one of the god's winged feet while he carried them through the air. Neither boy seemed frightened or even awkward. They made their very best bows to the goddesses, then calmly took their places as though an Olympian supper were an ordinary event that happened every night of their lives. Hebe had already woven two more rose wreaths and kept them ready.
        - id: ch01-b99
          speaker: narrator
          text: Watching her brothers eat and drink comfortably in their marble forms, Kathleen was glad she had remembered them, even while immortal peach juice flowed around her.
        - id: ch01-b100
          speaker: hera
          text: Now that the boys have everything they could want, and more than they could eat, let us hear the story.
        - id: ch01-b101
          speaker: mabel
          text: Yes, please!
        - id: ch01-b102
          speaker: kathleen
          text: Oh yes, the story! How splendid!
          emotion: happy
        - id: ch01-b103
          speaker: phoebus
          text: Our guests will tell it.
        - id: ch01-b104
          speaker: kathleen
          text: Oh, no!
          emotion: fearful
        - id: ch01-b105
          speaker: zeus
          text: Perhaps the boys have more courage.
        - id: ch01-b106
          speaker: narrator
          text: The king of the gods removed his tight rose wreath and rubbed his squeezed ears.
        - id: ch01-b107
          speaker: gerald
          text: I truly can't. Besides, I don't know any stories.
        - id: ch01-b108
          speaker: jimmy
          text: Neither do I.
        - id: ch01-b109
          speaker: mabel
          text: They want to hear how we found the ring. I'll tell it. Once upon a time, there was a little girl named Mabel.
        - id: ch01-b110
          speaker: narrator
          text: Once she had begun, Mabel hurried on through the tale. She told them nearly everything that had happened in the enchanted castle, from the beginning until that very night. The marble Olympians listened without interrupting. They seemed nearly as enchanted by the story as the castle itself was enchanted. While she spoke, the soft moonlit moments passed one after another, like pearls dropping quietly into a deep pool.
        - id: ch01-b111
          speaker: mabel
          text: Then Kathleen wished for the boys, Lord Hermes brought them here, and that is where we are now.
        - id: ch01-b112
          speaker: narrator
          text: Questions and excited comments burst out around her sudden ending, but Mabel brushed them aside as they faded.
        - id: ch01-b113
          speaker: mabel
          text: Now you must tell us.
        - id: ch01-b114
          speaker: phoebus
          text: Tell you what?
        - id: ch01-b115
          speaker: mabel
          text: How you come alive, how you know about the ring, and everything else you know.
        - id: ch01-b116
          speaker: narrator
          text: Phoebus laughed, and every white mouth around him curved into laughter too.
        - id: ch01-b117
          speaker: phoebus
          text: Everything I know? Your whole earthly life would be too short for all the words I would need.
        - id: ch01-b118
          speaker: gerald
          text: Then tell us about the ring and how you come alive. It is all very puzzling to us.
        - id: ch01-b119
          speaker: aphrodite_urania
          text: Tell them, Phoebus. Do not tease the children.
        - id: ch01-b120
          speaker: narrator
          text: Phoebus settled back to answer them. He leaned against a luxurious heap of leopard skins, which Dionysus had somehow plucked in great numbers from the branches of a spruce tree. Then the Sun-god began his explanation.
        - id: ch01-b121
          speaker: phoebus
          text: Every statue may come alive when the moon shines, if it chooses. Statues in ugly cities choose not to. Why should they trouble themselves to look at ugliness?
        - id: ch01-b122
          speaker: gerald
          text: Quite so.
        - id: ch01-b123
          speaker: narrator
          text: Gerald spoke politely to fill the pause.
        - id: ch01-b124
          speaker: phoebus
          text: In your beautiful temples, the stone images of priests come alive beneath the moon. So do the warriors who lie with crossed legs upon their tombs. They rise and walk in their marble bodies through the temples, then out through the woods and fields. Ordinary people can see them on only one night in the whole year. You were able to see us because you held the ring, and later because you had become our brothers and sisters in living marble. But on that single night, anyone at all may see us.
        - id: ch01-b125
          speaker: gerald
          text: Which night is it?
        - id: ch01-b126
          speaker: phoebus
          text: It is the night of the harvest festival. When the moon rises, it sends one beam of perfect light onto the altar in certain temples. One of those temples lies in Hellas. It is buried under the broken mass of a mountain that Zeus hurled down upon it in his anger. Another of the temples is in this country, and it stands inside this very great garden.
        - id: ch01-b127
          speaker: gerald
          text: If we came to that temple on the right night, could we see you without becoming statues and without the ring?
        - id: ch01-b128
          speaker: phoebus
          text: You could. And more than that, we must answer any question a mortal asks us that night.
        - id: ch01-b129
          speaker: gerald
          text: And when is that night?
        - id: ch01-b130
          speaker: phoebus
          text: Ah, wouldn't you like to know!
          emotion: happy
        - id: ch01-b131
          speaker: narrator
          text: The great marble king yawned and stroked his long beard.
        - id: ch01-b132
          speaker: zeus
          text: Enough stories, Phoebus. Tune your lyre.
        - id: ch01-b133
          speaker: narrator
          text: As Phoebus tuned the white strings of the marble instrument at his feet, Mabel whispered to him.
        - id: ch01-b134
          speaker: mabel
          text: But what about the ring? How do you know so much about it?
        - id: ch01-b135
          speaker: phoebus
          text: Later. Zeus must be obeyed. Ask me again before dawn, and I will tell you everything I know about it.
        - id: ch01-b136
          speaker: narrator
          text: Mabel drew back and rested against the comfortable knees of Demeter. Kathleen and Psyche sat hand in hand. Gerald and Jimmy stretched out full length, their chins propped on their elbows and their eyes fixed on the Sun-god. Phoebus only held the lyre. His fingers had not yet swept across the strings. Even so, the spirit of music already hung in the air. It enchanted and mastered everyone there. Every thought fell silent except the thought of music, and every desire disappeared except the desire to hear it.
        - id: ch01-b137
          speaker: narrator
          text: Then Phoebus touched the strings and softly drew a melody from them. All the beautiful dreams of the world came fluttering close, with wings like the wings of doves. Lovely thoughts often hover near us but stay just beyond our grasp. Now those thoughts came home and nested in the hearts of everyone who listened. They forgot time and space. They forgot how to be sad, and even how to be naughty. It seemed to each listener that the whole world rested like a magic apple in one hand, and that every part of the world was good and beautiful.
        - id: ch01-b138
          speaker: narrator
          text: Then a broken chord shattered the spell. A moment of silence followed. Phoebus sprang up.
        - id: ch01-b139
          speaker: phoebus
          text: Dawn! Dawn! To your pedestals, gods!
          emotion: fearful
        - id: ch01-b140
          speaker: narrator
          text: In the same instant, the whole crowd of beautiful marble people sprang to their feet. They rushed into the belt of trees, where branches cracked and leaves rustled as they passed. A moment later, the children heard bodies splashing into the lake beyond. Another sound came through the wood, the deep, gurgling breath of a great beast. They knew the dinosaurus was also hurrying back to its proper place before daylight.
        - id: ch01-b141
          speaker: narrator
          text: Hermes alone had time to hover above them, because flying is faster than swimming. He laughed mischievously and whispered.
        - id: ch01-b142
          speaker: hermes
          text: Fourteen days from now, at the Temple of Strange Stones.
        - id: ch01-b143
          speaker: mabel
          text: What is the ring's secret?
        - id: ch01-b144
          speaker: hermes
          text: The ring is the heart of the magic. Ask when the moon rises on the fourteenth day, and you will learn everything.
        - id: ch01-b145
          speaker: narrator
          text: Hermes lifted his snowy caduceus in farewell. His winged feet carried him upward and away. As he went, the seven reflected moons faded from the pool one by one. A cold wind moved across the island. Grey morning light grew stronger. In the trees, waking birds began to stir and twitter.
        - id: ch01-b146
          speaker: narrator
          text: Then the marble slipped away from the children like a skin shrinking in fire. White stone gave way to warm flesh and blood, and they were ordinary children again. Instead of standing beside the feast, they found themselves knee-deep in brambles and long, coarse grass. The smooth lawn had vanished. So had the marble steps and the pool with its seven moons and darting fish. Heavy dew lay on the grass and brambles, and the early morning was bitterly cold.
        - id: ch01-b147
          speaker: mabel
          text: We should have left with them. We can't swim now that we're not marble. And this is the island, isn't it?
        - id: ch01-b148
          speaker: narrator
          text: It was, and none of them could swim. They knew it as surely as you know you cannot fly. The brighter the dawn became, the darker their prospects looked.
        - id: ch01-b149
          speaker: jimmy
          text: I suppose there isn't a boat?
        - id: ch01-b150
          speaker: mabel
          text: Not on this side of the lake. There is one in the boathouse, if anyone could swim over to it.
        - id: ch01-b151
          speaker: jimmy
          text: You know I can't.
        - id: ch01-b152
          speaker: gerald
          text: Can't anyone think of something?
        - id: ch01-b153
          speaker: jimmy
          text: When they notice we're gone, they'll drag every bit of water for miles, in case we fell in and sank. When they drag this lake, we can shout and be rescued.
        - id: ch01-b154
          speaker: gerald
          text: Yes, dear. That will be delightful.
        - id: ch01-b155
          speaker: mabel
          text: Don't be so disagreeable. The ring! We only need to wish ourselves home. Phoebus washed it in the moon, so it's ready for another wish.
          emotion: happy
        - id: ch01-b156
          speaker: narrator
          text: Her sudden cheerfulness made the others stare.
        - id: ch01-b157
          speaker: gerald
          text: You never mentioned that. Never mind. Where is the ring?
        - id: ch01-b158
          speaker: mabel
          text: Kathleen had it.
        - id: ch01-b159
          speaker: kathleen
          text: I did, but I gave it to Psyche to look at, and she still has it on her finger!
          emotion: fearful
        - id: ch01-b160
          speaker: narrator
          text: Everyone tried not to be angry with Kathleen. Each of them partly succeeded.
        - id: ch01-b161
          speaker: gerald
          text: If we ever escape this awful island, can you find Psyche's statue and take the ring back?
        - id: ch01-b162
          speaker: mabel
          text: No! I have never seen her statue. It could be in Hellas, wherever that is, or anywhere at all.
          emotion: sad
        - id: ch01-b163
          speaker: narrator
          text: No one could think of anything kind to say. It is pleasant to report that, instead of saying something unkind, they all kept quiet. By now, grey daylight covered the island. In the north, the sky was beginning to flush with pale pink and lavender. The boys stood moodily with their hands buried in their pockets. Mabel and Kathleen seemed unable to stop clinging to each other, while the long grass, icy with dew, pressed around their legs.
        - id: ch01-b164
          speaker: narrator
          text: Someone sniffed and caught a breath. Gerald suddenly became brisk.
        - id: ch01-b165
          speaker: gerald
          text: Now stop that. Crying won't help. No, I'm not being horrid. It's for your own good. We'll search the island. A boat may be hidden under the branches.
        - id: ch01-b166
          speaker: mabel
          text: How could one be there?
        - id: ch01-b167
          speaker: gerald
          text: Someone might have left it.
        - id: ch01-b168
          speaker: mabel
          text: Then how did that person leave the island?
        - id: ch01-b169
          speaker: gerald
          text: In another boat, of course. Come on.
        - id: ch01-b170
          speaker: narrator
          text: Gerald set off, and the other three followed without hope. Every one of them felt certain that there was no boat and could not possibly be one. How often they had dreamed of islands! How often they had wished to be stranded on one! Well, now their wish had come true, without help from the ring. Real adventures can be very different from dreamed ones, and this adventure was not half so pleasant. Mabel had the worst of it because her shoes and stockings lay far away on the mainland. Every step pushed coarse grass and cruel brambles against her bare feet and legs.
        - id: ch01-b171
          speaker: narrator
          text: They struggled through the wood until they reached the water, but they could not stay close to the island's edge. The branches grew too thickly and hung too low. A narrow path of grass twisted in and out among the trees, so they followed it instead, dejected and mournful. Every passing minute made it less likely that they could return to the school-house unnoticed. If the grown-ups discovered them missing and found their beds exactly as they had been left, there would certainly be some sort of dreadful trouble. As Gerald put it, that would mean farewell to liberty.
        - id: ch01-b172
          speaker: gerald
          text: We can always shout to a gardener or keeper on the shore. But then the secret is finished, and so is our freedom!
        - id: ch01-b173
          speakers: [jimmy, kathleen, mabel]
          ensemble: chorus
          text: Yes.
        - id: ch01-b174
          speaker: gerald
          text: Come on, cheer up! We've escaped other scrapes, and we'll escape this one. The sun is coming out. You all feel much better now, don't you?
        - id: ch01-b175
          speakers: [jimmy, kathleen, mabel]
          ensemble: chorus
          text: Oh yes.
        - id: ch01-b176
          speaker: narrator
          text: Their voices were completely miserable. By now the sun had risen. Through a deep opening in the hills, it sent a strong yellow shaft straight toward the island. The nearly level light cut between the tree trunks and dazzled the children. Gerald led the sad little procession, and he was not looking where he put his feet, a fact Jimmy remembered to point out later. Gerald stumbled and snatched at a tree trunk. His hand missed it. With a yell and a noisy clatter, he disappeared. Mabel came directly behind him, but managed to stop at the very edge of a steep flight of moss-covered steps that had opened suddenly in the ground.
        - id: ch01-b177
          speaker: mabel
          text: Gerald! Are you hurt?
        - id: ch01-b178
          speaker: gerald
          text: No. There are steps down here, and a passage.
        - id: ch01-b179
          speaker: narrator
          text: He spoke crossly because he was actually hurt quite badly.
        - id: ch01-b180
          speaker: jimmy
          text: There always is.
        - id: ch01-b181
          speaker: mabel
          text: I knew there was a passage. It runs beneath the water to the Temple of Flora. Even the gardeners know, but they're afraid to enter because of snakes.
        - id: ch01-b182
          speaker: gerald
          text: Then this is our way out. You might have told us before.
        - id: ch01-b183
          speaker: mabel
          text: I didn't remember it. Oh! The passage must go past the place where the Ugly-Wugly found its good hotel.
        - id: ch01-b184
          speaker: kathleen
          text: I won't go. I will not go down there in the dark!
          emotion: fearful
        - id: ch01-b185
          speaker: gerald
          text: Very well, baby. No one asked you to go in the dark. Stay here, and we'll come back with a boat. Jimmy, give me the bicycle lamp.
        - id: ch01-b186
          speaker: narrator
          text: Gerald's head appeared suddenly through the woven brambles, and one hand reached up for the lamp. Jimmy produced a bicycle lamp from inside his coat. That, of course, is where lamps are always kept in fairy tales. You have only to think of Aladdin and several others.
        - id: ch01-b187
          speaker: jimmy
          text: We brought it so we wouldn't break our shins tripping over stretched-out Mabel among the rhododendrons.
        - id: ch01-b188
          speaker: narrator
          text: Gerald struck a match and opened the thick, rounded glass of the lamp.
        - id: ch01-b189
          speaker: gerald
          text: You may all choose for yourselves, but I'm taking these steps and following the passage. If we find the good hotel, no one was ever harmed by a good hotel.
        - id: ch01-b190
          speaker: jimmy
          text: It won't help. You know we can't open the Temple of Flora door, even if we reach it.
        - id: ch01-b191
          speaker: gerald
          text: There may be a secret spring on the inside. We had no lamp to search for it last time.
        - id: ch01-b192
          speaker: mabel
          text: I hate being underground more than anything.
        - id: ch01-b193
          speaker: gerald
          text: But you aren't a coward. You're brave, Mabel, and I know it. Hold Jimmy's hand, and I'll hold Cathy's. Come along.
        - id: ch01-b194
          speaker: jimmy
          text: No one is holding my hand. I'm not a little child.
        - id: ch01-b195
          speaker: gerald
          text: Cathy will let me. Poor little Cathy! Kind brother Jerry will hold her hand.
        - id: ch01-b196
          speaker: narrator
          text: Gerald meant the words as bitter mockery, but the joke failed completely. Kathleen was far too unhappy to hear the sarcasm she would usually have understood at once. Instead, she gratefully caught the hand her brother had held out only to tease her.
        - id: ch01-b197
          speaker: kathleen
          text: Thank you, dear Jerry. You are kind. I'll try not to be frightened.
        - id: ch01-b198
          speaker: narrator
          text: For a full minute, Gerald felt ashamed that he had not been completely kind.
        - id: ch01-b199
          speaker: narrator
          text: The four children left the growing gold of sunrise behind and went down the stone steps into the underground passage beneath the water. At first, everything became dark. Then their eyes accepted the poor imitation of light offered by the bicycle lamp. The first part of the passage was choked with dead leaves that had drifted there through many long-ago autumns. Soon the tunnel turned. More steps led downward, then farther downward still. At last the passage became empty, straight, and very clean. Smooth slabs of marble lined the floor, the ceiling, and both walls.
        - id: ch01-b200
          speaker: narrator
          text: Gerald held Kathleen's hand with more kindness and less annoyance than he had expected. Kathleen discovered that she was much less afraid than she had expected too.
        - id: ch01-b201
          speaker: narrator
          text: The bull's-eye lamp threw a soft circle of misty light ahead, and the children followed it without speaking. Then, silently and without warning, the lamp changed. Its flame looked as pale and useless as a candle carried into sunlight to light a bonfire. The children stopped with wonder, interest, and awe all mingled together, but there was no fear in them now. They had entered a vast hall. Two rows of round pillars rose to support its arched roof. A soft, searching, beautiful light reached into every corner and filled every tiny hollow, just as seawater fills the secret cracks and chambers of a hidden cave.
        - id: ch01-b202
          speaker: kathleen
          text: How beautiful!
          emotion: surprised
        - id: ch01-b203
          speaker: mabel
          text: I have to hold your hand, Jimmy. I must hold on to something ordinary, or I won't believe this is real.
          emotion: surprised
        - id: ch01-b204
          speaker: narrator
          text: The hall was the most beautiful place in the world. It cannot be described in the usual way, because it did not look alike to any two people. If someone told you exactly how it appeared to one of these four children, you might not understand at all. To each of them, it seemed like the most perfect thing that could possibly exist. Great arches opened all around it. Kathleen saw them as Moorish. To Mabel they were Tudor, while Gerald saw Norman arches and Jimmy saw the sort called Churchwarden Gothic.
        - id: ch01-b205
          speaker: narrator
          text: Every arch opened onto something different. Beyond one lay an olive garden under an Italian moon, where two lovers stood holding hands. Beyond another rolled a wild and racing sea, yet a ship mastered it as if the sea were the ship's servant. A third showed a king upon his throne, surrounded by courtiers who bowed and flattered him. Through a fourth stood a truly good hotel, with the respectable Ugly-Wugly taking the sun on its front steps. Elsewhere, a mother bent lovingly over a wooden cradle. An artist gazed in wonder at a picture his wet brush seemed to have finished only that instant. A general lay dying on a battlefield where Victory had planted the flag he loved. None of these scenes were painted pictures or silent shows. They were the truest truths, alive before the children's eyes and plainly immortal.
        - id: ch01-b206
          speaker: narrator
          text: Many other visions appeared within the arches. Each one held a moment when life had suddenly sprung into fire and flower. Each showed the very best thing a human soul could ask for, or the best gift human destiny could grant. The truly good hotel had earned a place among these immortal moments too. After all, some souls ask for nothing higher in life than a really good hotel.
        - id: ch01-b207
          speaker: kathleen
          text: I'm so glad we came. I truly am!
          emotion: happy
        - id: ch01-b208
          speaker: narrator
          text: She held tightly to Gerald's hand as they moved slowly farther into the hall. Jimmy still carried the bull's-eye lamp, but he held it very crookedly now. Against the vast and glorious light around them, its little beam scarcely looked like light at all. It seemed more like a dim shadow moving beside them.
        - id: ch01-b209
          speaker: narrator
          text: When they had nearly reached the far end, the children discovered where all that radiance began. It spread outward from one place, and in that glowing place stood the very statue Mabel had said she could never find. It was Psyche. The children went closer, very slowly. They were completely happy and completely bewildered at once. Then they saw that one of Psyche's white hands was raised, and on one finger the ring made a dark mark against the marble.
        - id: ch01-b210
          speaker: narrator
          text: Gerald let go of Kathleen's hand. He placed one foot on the carved base and one knee on the pedestal, then pulled himself upright. For a moment he stood there, a dark human boy beside the white marble girl with butterfly wings.
        - id: ch01-b211
          speaker: gerald
          text: I hope you don't mind.
        - id: ch01-b212
          speaker: narrator
          text: Very gently, he drew the ring from Psyche's finger and dropped back to the floor.
        - id: ch01-b213
          speaker: gerald
          text: Not here. I can't explain it, but we must not use it here.
        - id: ch01-b214
          speaker: narrator
          text: All four passed behind the white figure of Psyche before they did anything with the ring. There, the dark passage closed around them once more, and the bicycle lamp suddenly seemed alive and useful again. Gerald held it out in front and went first, a pioneer leading the others through the twisting dark. The passage carried them away from that wonderful chamber, though at the time they did not know what sort of hall they had entered or what its name might be.
        - id: ch01-b215
          speaker: kathleen
          text: Give me the ring. I know exactly what to say.
        - id: ch01-b216
          speaker: narrator
          text: Gerald handed it over, though not very willingly.
        - id: ch01-b217
          speaker: kathleen
          text: I wish that no one at home may know we went out tonight. I wish we were safely asleep in our own beds, undressed and wearing our nightgowns.
        - id: ch01-b218
          speaker: narrator
          text: The next thing any of them knew, strong and ordinary daylight filled their rooms. It was not the pale light of sunrise. It was the familiar kind of day when someone comes in and tells you it is time to get up. Each child lay safely in bed, undressed and wearing a nightgown, exactly as Kathleen had asked. She had formed the wish with remarkable good sense. There had been only one mistake, and it lay in the words "our own beds."
        - id: ch01-b219
          speaker: narrator
          text: Mabel's own bed was at Yalding Towers, so that was where the wish carried her. Her drab-haired aunt believed Mabel was spending the night with the town child she liked so much. The aunt had locked every door at eleven, with Mabel still away. Yet in the morning, Mabel was lying in her own bed. The aunt has never understood how it happened. She was not a clever woman, but neither was she foolish enough to believe any of the eleven invented explanations that a desperate Mabel offered before the morning was over. Mabel's first explanation, making twelve in all, had been the truth. Naturally, her aunt was far too clever to believe that one.
