audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    phoebus:
      display_name: 福玻斯
      tts:
        delivery: 优雅自得，带着神祇般漫不经心的热情
        timbre: 明亮清越的成年男声
        pace: 从容
        pitch: 中音
    aphrodite:
      display_name: 阿佛洛狄忒·乌拉尼娅
      tts:
        delivery: 慈爱高贵，温柔得像最亲近的母亲
        timbre: 柔美丰润的成年女声
        pace: 舒缓
        pitch: 中音
    eros:
      display_name: 厄洛斯
      tts:
        delivery: 亲切活泼，带着少年般的轻盈
        timbre: 清亮柔和的少年声
        pace: 轻快
        pitch: 中高音
    psyche:
      display_name: 普绪刻
      tts:
        delivery: 甜美灵动，笑意自然
        timbre: 轻柔清澈的少女声
        pace: 自然
        pitch: 中高音
    hermes:
      display_name: 赫尔墨斯
      tts:
        delivery: 敏捷机敏，带着淘气的神秘感
        timbre: 清朗灵活的成年男声
        pace: 稍快
        pitch: 中高音
    hera:
      display_name: 赫拉
      tts:
        delivery: 威严端庄，措辞讲究
        timbre: 饱满沉静的成年女声
        pace: 从容
        pitch: 中低音
    zeus:
      display_name: 宙斯
      tts:
        delivery: 威严厚重，带着不容置疑的从容
        timbre: 洪亮深沉的成年男声
        pace: 缓慢
        pitch: 低音
    statue_one:
      display_name: 石像客人甲
      tts:
        delivery: 欢快热情，爱开玩笑
        timbre: 明亮的成年声
        pace: 轻快
        pitch: 中音
    statue_two:
      display_name: 石像客人乙
      tts:
        delivery: 欢快随和，带着善意的调侃
        timbre: 清朗的成年声
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十章
      blocks:
        - id: ch01-b01
          speaker: kathleen
          text: 要是我真是一尊活过来的石像，你居然一点也不怕我，那可真奇怪。
          emotion: sad
        - id: ch01-b02
          speaker: princess
          text: 戒指在我手里呢。振作一点，亲爱的！你很快就会恢复，先别老想着这件事。
        - id: ch01-b03
          speaker: narrator
          text: 梅布尔说得斩钉截铁，口气却像在哄一个割破手指的孩子，又像在哄一个摔破膝盖、伤口上还粘着小石子的孩子。
        - id: ch01-b04
          speaker: kathleen
          text: 我知道。
          emotion: sad
        - id: ch01-b05
          speaker: princess
          text: 我倒想到一件事。只要别的石像肯理我们，说不定能从它们那里弄明白这个魔法地方的许多事。
        - id: ch01-b06
          speaker: kathleen
          text: 它们会理我们的，至少福玻斯会。他又客气，人又好。
        - id: ch01-b07
          speaker: princess
          text: 他在哪儿？
        - id: ch01-b08
          speaker: kathleen
          text: 刚才还在湖里。
        - id: ch01-b09
          speaker: princess
          text: 那就去湖边。哦，凯茜！我终于缩回原来那点正常的厚度了，真快活！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 梅布尔一跃而起。她缩回原来的大小，盖在细长身体上的枯蕨和树枝纷纷落下，像骤雨扯落了一阵树叶。可白色的凯瑟琳还是一动不动。两个女孩坐在月光下灰蒙蒙的草地上，园林静得像一幅画。只有喷泉水声和远处特快列车的汽笛偶尔响起，声音一停，夜色反而更静了。
        - id: ch01-b11
          speaker: phoebus
          text: 小妹妹，你还好吗？
        - id: ch01-b12
          speaker: narrator
          text: 一个金灿灿的声音从身后传来。她们像受惊的小鸟一样猛然回头。福玻斯站在月光里，身上还滴着湖水，正温柔地朝她们微笑。
        - id: ch01-b13
          speaker: kathleen
          text: 哦，原来是你！
          emotion: surprised
        - id: ch01-b14
          speaker: phoebus
          text: 正是在下。你身边这位尘世朋友是谁？
        - id: ch01-b15
          speaker: kathleen
          text: 她是梅布尔。
        - id: ch01-b16
          speaker: narrator
          text: 梅布尔起身行了屈膝礼，迟疑片刻，又伸出手。
        - id: ch01-b17
          speaker: phoebus
          text: 任你差遣，小女士。不过你怎么能看见我们，又怎么一点也不怕？
        - id: ch01-b18
          speaker: narrator
          text: 梅布尔举起戴着戒指的手。
        - id: ch01-b19
          speaker: phoebus
          text: 原来如此。不过你既然有戒指，何必还留着这副斑斑驳驳的尘世模样？变成石像，跟我们到湖里游泳吧。
        - id: ch01-b20
          speaker: princess
          text: 我不会游泳。
        - id: ch01-b21
          speaker: kathleen
          text: 我也不会。
        - id: ch01-b22
          speaker: phoebus
          text: 变成活石像就会了。活石像样样体育本领都精通。黑眼睛、头发像夜色的孩子，把自己许成石像，来跟我们一起快活吧。
        - id: ch01-b23
          speaker: princess
          text: 请原谅，我还是不变吧。这戒指许下的愿，到底会管多久，谁也不知道。现在当石像也许好玩，可早晨一到，我肯定会后悔。
        - id: ch01-b24
          speaker: phoebus
          text: 听说尘世的人常常后悔。不过你还不懂戒指的力量。愿望说得分毫不差，它就会照办。要是不规定期限，被放逐的数字之神阿里斯莫斯织下的怪魔法就会钻进来，把咒语搅乱。你应该说，我希望从现在到黎明，都像我的小朋友一样，成为一尊有生命的大理石像。期限一到，我还变回原来那个黑眼睛、头发如夜色的梅布尔。
        - id: ch01-b25
          speaker: kathleen
          text: 对，就这么许，多好玩！变吧，梅布尔。我们俩都是石像以后，还用怕那只恐龙吗？
          emotion: happy
        - id: ch01-b26
          speaker: phoebus
          text: 活的大理石世界里没有恐惧。我们和恐龙兄弟，不都是石头与生命共同造出的手足吗？
        - id: ch01-b27
          speaker: princess
          text: 那我变了以后，真的会游泳？
        - id: ch01-b28
          speaker: phoebus
          text: 你会游，会漂，还会潜水。你也能跟奥林匹斯的女神们摆开夜宴，吃众神的食物，喝他们杯里的美酒，听不朽的歌声，看永生的笑容。
        - id: ch01-b29
          speaker: kathleen
          text: 宴会！梅布尔，快变吧！你要是跟我一样饿，早就答应了。
        - id: ch01-b30
          speaker: princess
          text: 可那不是真正的食物。
        - id: ch01-b31
          speaker: phoebus
          text: 对你来说，它会和对我们一样真实。就连你们那个五彩缤纷的世界，也没有别的真实。
        - id: ch01-b32
          speaker: narrator
          text: 梅布尔还是拿不定主意。她看了看凯瑟琳的双腿，忽然答应了，却坚持先脱掉鞋袜。她可不愿穿着难看的大理石系带靴，更不愿让自己那双总往下掉的长袜也变成大理石。
        - id: ch01-b33
          speaker: phoebus
          text: 梅布尔懂得美。念出咒语吧，孩子，我带你去见奥林匹斯的女神们。
        - id: ch01-b34
          speaker: narrator
          text: 梅布尔脱掉鞋袜和围裙，微微发着抖，说出了愿望。月光照着的空地上，立刻多了一尊活生生的小石像。高大的福玻斯一手牵住一个女孩。
        - id: ch01-b35
          speaker: phoebus
          text: 来，跑起来！
        - id: ch01-b36
          speaker: princess
          text: 哦，太痛快了！看看我踩在草地上的白脚。我还以为石像会硬邦邦的，原来一点也不僵。
          emotion: happy
        - id: ch01-b37
          speaker: phoebus
          text: 不朽的神灵怎么会僵硬？今夜，你也是我们的一员。
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: 他们沿着斜坡跑到湖边。福玻斯一声令下，两个女孩纵身跃入水中，浪花在三个洁白闪亮的身影四周飞溅。
        - id: ch01-b39
          speaker: kathleen
          text: 哦！我真的会游泳了！
          emotion: surprised
        - id: ch01-b40
          speaker: princess
          text: 我也会！
          emotion: surprised
        - id: ch01-b41
          speaker: phoebus
          text: 当然会。现在绕湖三圈，再朝小岛游。
        - id: ch01-b42
          speaker: narrator
          text: 三个人并肩游去。福玻斯迁就着两个孩子，游得很慢。她们身上的大理石衣服一点也不碍事，换成你的普通衣服可不成。要是你忽然跳进特拉法尔加广场的喷泉池，试着游几下，马上就会明白。她们游得轻松极了，姿势又美，既不费力，也不疲倦，就像人在梦里游泳一样，你一定也留意过那种感觉。这里实在是再好不过的游泳地方。睡莲那蛇一般的长茎，平常总让游泳的人为难，现在却一点也缠不住她们的大理石手脚。月亮高挂在清澈的天空，垂柳、柏树、神殿、台地、一层层树丛和灌木，还有那座奇妙古宅，全都给眼前的景色添上了梦境一般的情调。
        - id: ch01-b43
          speaker: princess
          text: 戒指带来的所有事情里，这一件最好。
        - id: ch01-b44
          speaker: phoebus
          text: 我就知道你会喜欢。再游一圈，我们就上岛。
        - id: ch01-b45
          speaker: narrator
          text: 他们从一圈灯芯草、蓍草、柳兰和千屈菜中间登上小岛。草木之间还点缀着几簇迟开的绣线菊，乳白色花头像扑了粉，空气里满是它们的香气。小岛看起来比从岸上见到的大得多，仿佛遍地都是树木和灌丛。福玻斯领她们走进树影以后，女孩们却发现林木另一边透出一道亮光。那光离得很近，绝不可能来自小岛另一岸。几乎一眨眼，他们就穿过了环形树林，看清光从哪里来。刚刚走过的那些树浓密又幽暗，围着一大片空地站成一圈。正像凯瑟琳说的，活像足球场边挤得密不透风的观众。
        - id: ch01-b46
          speaker: narrator
          text: 树林最里面先是一圈宽阔平整的草坪。再往里，大理石台阶向下一层层伸展，一直通到圆形水池。池中没有睡莲，只有金鱼和银鱼来回穿梭。银鱼像一道道水银的闪光，金鱼却像暗色的火焰。水池、大理石和草地围出的这片天地，全都泡在清澈洁白的灿烂光辉里，那光比最明亮的月色还要强上七倍。平静的水里映着七轮月亮。鱼儿用摆动的鳍向前游，用尾巴掌舵，把水面划出一道道皱纹。七轮月亮也随之破碎变形。这样一看，便知道它们只是倒影。
        - id: ch01-b47
          speaker: narrator
          text: 女孩们赶紧抬头，几乎以为天上也有七个月亮。可古老的月亮还是独自挂在那里，跟平常一样照着她们。
        - id: ch01-b48
          speaker: princess
          text: 水里有七个月亮。
          emotion: surprised
        - id: ch01-b49
          speaker: narrator
          text: 梅布尔茫然地伸手指着水面。这举动可不大合礼数。
        - id: ch01-b50
          speaker: phoebus
          text: 当然有。我们世界里的一切，都比你们世界多七倍。
        - id: ch01-b51
          speaker: princess
          text: 可你又没有七个。
        - id: ch01-b52
          speaker: phoebus
          text: 没有，不过我这一个抵得上七个。数目是一回事，分量是另一回事，更不用说品质了。这个道理你一定明白。
        - id: ch01-b53
          speaker: kathleen
          text: 我不大明白。
        - id: ch01-b54
          speaker: phoebus
          text: 一解释我就累。我们还是去跟女神们相聚吧。
        - id: ch01-b55
          speaker: narrator
          text: 水池对面聚着一大群人，大约有二三十个。他们全是石像，也全都活着。那一片洁白落在树林之间，简直像有人在那里挖开一个巨大的白洞。有的石像把白脚浸在金鱼和银鱼中间。脚边漾起的水波，一遍遍划过七轮月亮的脸。有的拿着玫瑰互相投掷，花香浓得连水池这边的女孩们都闻得见。还有些石像手拉着手，围成圆圈跳舞。台阶上坐着两个人，用一根白色大理石线翻花绳。那可真是一种古老得不能再古老的游戏。
        - id: ch01-b56
          speaker: narrator
          text: 三位客人刚走近，欢笑和欢迎声就一齐涌来。
        - id: ch01-b57
          speaker: statue_one
          text: 福玻斯，你怎么又迟到了！
        - id: ch01-b58
          speaker: statue_two
          text: 你的马是不是掉了一只蹄铁？
        - id: ch01-b59
          speaker: narrator
          text: 还有人拿他的月桂冠开玩笑。
        - id: ch01-b60
          speaker: phoebus
          text: 我带来了两位客人。
        - id: ch01-b61
          speaker: narrator
          text: 石像们马上围过来，摸摸女孩们的头发，拍拍她们的脸颊，还用最甜蜜的昵称叫她们。
        - id: ch01-b62
          speaker: aphrodite
          text: 赫柏，花环准备好了吗？再编两个！
        - id: ch01-b63
          speaker: narrator
          text: 没过多久，赫柏便走下台阶。她圆润的双臂上挂满玫瑰花环，每一颗大理石脑袋都分到了一个。戴上花环以后，所有人都比刚才美丽了七倍。对诸神来说，这可不是一句随口说出的空话。两个孩子想起喝覆盆子醋的那次宴会。那时，法国女教师曾告诉她们，神和女神用餐时总要戴着花环。眼前的一切果然如此。
        - id: ch01-b64
          speaker: narrator
          text: 赫柏亲手给女孩们戴上玫瑰。世上最可爱的女神阿佛洛狄忒·乌拉尼娅牵起她们的手。她的声音像母亲，像母亲在你最爱她的那些时刻里对你说话。
        - id: ch01-b65
          speaker: aphrodite
          text: 来吧，该准备宴席了。厄洛斯、普绪刻、赫柏、伽倪墨得斯，你们几个年轻人去摆水果。
        - id: ch01-b66
          speaker: narrator
          text: 四个苗条的身影从洁白的人群里走出来，迎向两个女孩。
        - id: ch01-b67
          speaker: kathleen
          text: 可我没看见水果呀。
        - id: ch01-b68
          speaker: eros
          text: 马上就能看见。你只管伸手摘。
        - id: ch01-b69
          speaker: narrator
          text: 女孩们立刻觉得厄洛斯真是个讨人喜欢的男孩。
        - id: ch01-b70
          speaker: psyche
          text: 你看，要像这样。
        - id: ch01-b71
          speaker: narrator
          text: 普绪刻抬起大理石手臂，伸向一根柳枝。手再收回来时，掌心已经托着一只熟透的石榴。
        - id: ch01-b72
          speaker: princess
          text: 我懂了，只要这样一摘……
        - id: ch01-b73
          speaker: narrator
          text: 她的手指刚碰到柳枝，一只大桃子便落进指间，摸起来又结实又柔软。
        - id: ch01-b74
          speaker: psyche
          text: 对，就是这样摘。
          emotion: happy
        - id: ch01-b75
          speaker: narrator
          text: 普绪刻笑起来，谁都看得出她可爱极了。赫柏从旁边一棵桤木上摘下几只银篮子，四个年轻的神便勤勤恳恳地采起水果。与此同时，年长的石像们也没有闲着。他们走到白蜡树和小橡树旁，从枝头摘下一只只金杯、金壶和金盘。那些器皿里很快盛满了美味。无论谁可能想吃什么、想喝什么，里面全都有。等一切备好，他们再把杯盘和金壶一件件摆上大理石台阶。
        - id: ch01-b76
          speaker: narrator
          text: 这是一场天国里的野餐。众神有的坐着，有的斜卧在台阶上，宴会就这样开始了。哦，那些盘中食物的滋味，简直不知道该怎样形容。饮料从金杯流过洁白嘴唇时，甜美得出奇。那些水果更是尘世绝不会长出的果实。就像尘世没有哪一种笑声，能比得上不朽者唇边的笑，也没有哪一首歌，能比得上那个奇迹之夜里搅动寂静的歌。
        - id: ch01-b77
          speaker: kathleen
          text: 哦，真希望男孩们也在这里！
        - id: ch01-b78
          speaker: narrator
          text: 她正吃第三只桃子，汁水从指缝流过，像眼泪一样滴在大理石台阶上。
        - id: ch01-b79
          speaker: princess
          text: 不知道他们这会儿在做什么。
        - id: ch01-b80
          speaker: narrator
          text: 赫尔墨斯刚像鸽子一样绕着众人飞过一圈，又落回大家中间。
        - id: ch01-b81
          speaker: hermes
          text: 就在此刻，他们刚翻窗逃出住处，正在恐龙附近慌慌张张地找你们。他们以为你们已经没命了。要不是记得男子汉不该哭，哪怕年纪还小也不该，他们早哭出来了。
        - id: ch01-b82
          speaker: narrator
          text: 凯瑟琳站起来，掸去大理石衣襟上的仙馔碎屑。
        - id: ch01-b83
          speaker: kathleen
          text: 非常感谢各位。你们这样招待我们，实在太好了，我们也玩得很快活。可是，我想我们该走了。
        - id: ch01-b84
          speaker: phoebus
          text: 要是你只担心两个兄弟，让他们来这里再容易不过。把戒指借我一下。
        - id: ch01-b85
          speaker: narrator
          text: 凯瑟琳不大情愿地伸出手。福玻斯取下戒指，在七轮月亮中的一轮倒影里蘸了蘸，又还给她。凯瑟琳立刻把它攥紧。
        - id: ch01-b86
          speaker: phoebus
          text: 现在替他们许个愿，就像梅布尔刚才替自己许的那样。你要说……
        - id: ch01-b87
          speaker: kathleen
          text: 我知道怎么说。我希望男孩们在黎明以前，都变成跟梅布尔和我一样的活大理石像，之后再恢复他们现在的样子。
        - id: ch01-b88
          speaker: phoebus
          text: 要是你不打断我就好了。不过算了，谁也不能指望年轻的大理石肩膀上长着年老的脑袋。你本该叫他们直接到这里来，还应该……罢了，不碍事。赫尔墨斯老伙计，抄近路去接他们，路上把一切解释清楚。
        - id: ch01-b89
          speaker: narrator
          text: 福玻斯又把戒指浸进一轮月亮的倒影，才重新交还凯瑟琳。
        - id: ch01-b90
          speaker: phoebus
          text: 好了，现在戒指洗干净了，又能施展下一次魔法。
        - id: ch01-b91
          speaker: hera
          text: 我们从来不盘问客人。不过这枚戒指，想必已经勾起了大家的兴趣。
        - id: ch01-b92
          speaker: phoebus
          text: 这就是那枚戒指。
        - id: ch01-b93
          speaker: hera
          text: 那当然。若不是向客人提问有失礼数，我倒很想知道，它怎么会到了这些尘世孩子手里。
        - id: ch01-b94
          speaker: phoebus
          text: 这件事说来话长。宴会结束以后讲故事，故事讲完以后唱歌。
        - id: ch01-b95
          speaker: narrator
          text: 看来赫尔墨斯把一切都解释得非常清楚。杰拉尔德和吉米赶来时，已经变成雪白的大理石。他们各自紧紧抱住赫尔墨斯的一只带翼脚，就这样从空中飞来，却一点也不显得狼狈。落地以后，两个男孩向女神们行了自己最漂亮的礼，随后安然坐下。那副从容自在的样子，仿佛他们这一辈子每天夜里都在奥林匹斯山吃晚餐。赫柏早已替他们编好玫瑰花环。凯瑟琳看着哥哥们坐在自己的大理石身体里随意吃喝，心里快活极了。
        - id: ch01-b96
          speaker: narrator
          text: 凯瑟琳看着两个哥哥自在地吃喝，庆幸自己刚才没有只顾着不朽的桃汁，把他们彻底忘掉。男孩们想要什么，面前就有什么，多得怎么也吃不完。
        - id: ch01-b97
          speaker: hera
          text: 现在，该讲故事了。
        - id: ch01-b98
          speakers: [princess, kathleen]
          ensemble: duo
          text: 对呀，现在讲故事。太棒了！
          emotion: happy
        - id: ch01-b99
          speaker: phoebus
          text: 这个故事，要请我们的客人来讲。
        - id: ch01-b100
          speaker: kathleen
          text: 哦，不行！
          emotion: fearful
        - id: ch01-b101
          speaker: zeus
          text: 也许男孩子们的胆量大一些。
        - id: ch01-b102
          speaker: narrator
          text: 宙斯摘下略显紧窄的花环，揉了揉被勒住的耳朵。
        - id: ch01-b103
          speaker: gerald
          text: 我真的讲不了，而且我一个故事也不知道。
        - id: ch01-b104
          speaker: jimmy
          text: 我也不知道。
        - id: ch01-b105
          speaker: princess
          text: 他们想听的是我们怎么得到戒指。你们要是愿意，我来讲。从前，有个小女孩叫梅布尔……
        - id: ch01-b106
          speaker: narrator
          text: 梅布尔越讲越快，就这样一直讲下去。她把魔法城堡里发生过的一切，或者说几乎一切，从头到尾讲了一遍，也就是你在前面听过的那些故事。大理石的奥林匹斯诸神全听入了迷。他们受到的吸引，几乎跟城堡本身所受的魔法一样深。月光下，柔和的一刻接着一刻悄悄流逝，就像一颗又一颗珍珠落进深潭，沉下去，再也看不见。
        - id: ch01-b107
          speaker: princess
          text: 后来，凯瑟琳许愿让男孩们过来，赫尔墨斯大人就把他们接来了。于是，我们现在全都在这里。
        - id: ch01-b108
          speaker: narrator
          text: 她突然停在这里。四周顿时响起兴致勃勃的议论和追问。等声音渐渐低下去，梅布尔马上把话题拨到一旁。
        - id: ch01-b109
          speaker: princess
          text: 现在轮到你们告诉我们了。
        - id: ch01-b110
          speaker: phoebus
          text: 告诉你们什么？
        - id: ch01-b111
          speaker: princess
          text: 你们为什么会活过来，为什么知道戒指，还有你们知道的所有事情。
        - id: ch01-b112
          speaker: phoebus
          text: 我知道的所有事情？尘世的孩子啊，就算用掉你的一生，我也讲不完。
          emotion: happy
        - id: ch01-b113
          speaker: narrator
          text: 福玻斯笑起来。不只他的嘴唇，所有洁白的嘴唇都弯出了笑意。
        - id: ch01-b114
          speaker: gerald
          text: 那至少说说戒指，再说说你们为什么会活过来吧。这些事实在让我们摸不着头脑。
        - id: ch01-b115
          speaker: aphrodite
          text: 告诉他们吧，福玻斯。别再捉弄孩子们了。
        - id: ch01-b116
          speaker: narrator
          text: 福玻斯向后一靠，倚在一大堆豹皮上。那是狄俄尼索斯刚从云杉上阔气地摘来的。
        - id: ch01-b117
          speaker: phoebus
          text: 所有石像，只要自己愿意，都能在月光下活过来。可是那些被放在丑陋城市里的石像不肯。它们何必让自己受苦，睁眼去看那些丑东西？
        - id: ch01-b118
          speaker: gerald
          text: 确实没必要。
        - id: ch01-b119
          speaker: phoebus
          text: 美丽神殿里的祭司像，还有墓上盘腿躺着的武士像，也会披着大理石身体醒来，在神殿里行走，还会走过树林和田野。不过一年只有一个夜晚，人人都能看见它们。你们现在看得见我们，是因为有戒指，又因为你们成了大理石的同族。到了那个夜晚，所有人都能看见我们。
        - id: ch01-b120
          speaker: gerald
          text: 那是哪一天？
        - id: ch01-b121
          speaker: phoebus
          text: 收获节的夜晚。月亮升起时，会把一道完美的月光照在某些神殿的祭坛上。一座神殿在希腊，被崩落的山体埋住了。那座山，是宙斯发怒时朝神殿扔过去的。另一座就在这个国家，就在这座大花园里。
        - id: ch01-b122
          speaker: gerald
          text: 那么到了那天晚上，就算我们没有变成石像，也没拿戒指，只要来到神殿，就能看见你们？
        - id: ch01-b123
          speaker: phoebus
          text: 正是如此。不只如此，那一夜凡人提出的任何问题，我们都必须回答。
        - id: ch01-b124
          speaker: gerald
          text: 那天晚上到底是哪一天？
        - id: ch01-b125
          speaker: phoebus
          text: 啊，你很想知道，是不是？
          emotion: happy
        - id: ch01-b126
          speaker: narrator
          text: 伟岸的大理石神王打了个哈欠，又捋了捋长须。
        - id: ch01-b127
          speaker: zeus
          text: 故事讲得够多了，福玻斯。给你的里拉琴调弦吧。
        - id: ch01-b128
          speaker: narrator
          text: 福玻斯开始调整脚边那架大理石乐器的洁白琴弦。它看上去很像一把竖琴。
        - id: ch01-b129
          speaker: princess
          text: 可是戒指呢？你为什么知道戒指的一切？
        - id: ch01-b130
          speaker: phoebus
          text: 待会儿再说。宙斯的命令必须服从。黎明以前再来问我，我会把知道的全告诉你。
        - id: ch01-b131
          speaker: narrator
          text: 梅布尔退回去，靠在得墨忒耳舒适的膝头。凯瑟琳和普绪刻手拉着手坐下。杰拉尔德和吉米伸直身体趴着，下巴支在手肘上，一起望着福玻斯。他才刚抱起里拉琴，还没碰弦，音乐的精灵已经悬在空气中，迷住了所有人。别的念头全都安静下来，只剩下对音乐的念想。别的渴望也都消失，只剩下聆听的渴望。
        - id: ch01-b132
          speaker: narrator
          text: 接着，福玻斯终于拨响琴弦。他从琴弦里轻轻采出旋律，像是在采下一朵花。世上一切美丽的梦都振翅飞近，翅膀像鸽子的翅膀。那些美好的思绪，有时会在人身边徘徊，却总离得太远，让人怎么也抓不住。现在，它们也全回到听者心中，像一群鸟儿终于归巢。听音乐的人忘记了时间，也忘记了空间。他们忘了该怎样悲伤，也忘了该怎样淘气。仿佛整个世界变成一只魔法苹果，稳稳落在每个人掌心。而这个世界里，一切都是好的，一切都是美的。
        - id: ch01-b133
          speaker: narrator
          text: 魔法忽然碎了。福玻斯拨出一个不和谐的音，四周立刻寂静。他一跃而起。
        - id: ch01-b134
          speaker: phoebus
          text: 黎明！黎明！众神啊，快回到各自的基座上！
          emotion: surprised
        - id: ch01-b135
          speaker: narrator
          text: 转眼之间，美丽的大理石人全都跳了起来，一齐冲进环形树林。一路上，枝叶被他们撞得咔嚓作响。紧接着，孩子们听见湖边传来接连不断的扑通声，那是众神正纷纷跃入外面的湖水。声音之间还混着一头巨兽咕噜咕噜的喘息。孩子们马上明白，恐龙也醒过神来，正急急忙忙赶回自己原来的位置。
        - id: ch01-b136
          speaker: narrator
          text: 只有赫尔墨斯来得及在他们头顶停留片刻，毕竟飞行总比游水快。他带着淘气的笑，压低声音。
        - id: ch01-b137
          speaker: hermes
          text: 从今天起十四天后，到怪石神殿去。
        - id: ch01-b138
          speaker: princess
          text: 戒指的秘密到底是什么？
        - id: ch01-b139
          speaker: hermes
          text: 戒指是魔法之心。第十四天月亮升起时去问，你们就会知道一切。
        - id: ch01-b140
          speaker: narrator
          text: 赫尔墨斯挥动雪白的双蛇杖，借着生翼的双脚飞上天空。他一离开，水中的七轮月亮就熄灭了。冷风吹起来，灰色天光越来越亮，鸟儿开始活动，啾啾鸣叫。
        - id: ch01-b141
          speaker: narrator
          text: 大理石从孩子们身上滑落，像一层被火烤皱的皮。他们不再是石像，又成了从前那些有血有肉的孩子，站在齐膝深的荆棘和粗长野草里。平整的草坪消失了，大理石台阶消失了，倒映着七个月亮的鱼池也消失了。仿佛刚才那片灿烂的天地从来没有存在过。厚厚的露水凝在草叶和荆棘上，四周冷极了。
        - id: ch01-b142
          speaker: princess
          text: 我们刚才应该跟着他们走。现在不是大理石了，我们也不会游泳。我想，这里就是那座小岛吧？
          emotion: fearful
        - id: ch01-b143
          speaker: narrator
          text: 这里的确是小岛，他们也的确不会游泳。这一点，他们心里清清楚楚。有些事根本不用试，就像你知道自己不会飞一样，绝不会弄错。黎明越来越亮，他们的处境却越来越暗淡。
        - id: ch01-b144
          speaker: jimmy
          text: 这里大概没有船吧？
        - id: ch01-b145
          speaker: princess
          text: 没有，至少湖这边没有。船屋里倒是有一只，只要你能游过去。
        - id: ch01-b146
          speaker: jimmy
          text: 你明知道我不会游。
        - id: ch01-b147
          speaker: gerald
          text: 难道谁也想不出办法？
        - id: ch01-b148
          speaker: narrator
          text: 杰拉尔德冷得直发抖。
        - id: ch01-b149
          speaker: jimmy
          text: 等人们发现我们不见了，就会以为我们掉进水里沉了。他们会把方圆几英里的水全拖一遍。等拖到这片湖，我们就大喊，然后得救。
        - id: ch01-b150
          speaker: gerald
          text: 是啊，亲爱的，这主意可真不错。
        - id: ch01-b151
          speaker: princess
          text: 别这么讨人厌。
          emotion: happy
        - id: ch01-b152
          speaker: narrator
          text: 梅布尔的声音快活得离奇，其他人都惊讶地盯着她。
        - id: ch01-b153
          speaker: princess
          text: 还有戒指呀！我们许愿回家不就行了？福玻斯刚在月亮里洗过它，现在又能许一次愿。
        - id: ch01-b154
          speaker: gerald
          text: 这件事你可没告诉我们。算了，戒指在哪儿？
        - id: ch01-b155
          speaker: princess
          text: 刚才是你拿着的，凯瑟琳。
        - id: ch01-b156
          speaker: kathleen
          text: 我知道是我拿着。可我交给普绪刻看了看，后来……后来她把戒指戴到自己手指上了！
          emotion: sad
        - id: ch01-b157
          speaker: narrator
          text: 每个人都努力忍住，不对凯瑟琳发火。他们每个人都成功了一点。
        - id: ch01-b158
          speaker: gerald
          text: 如果我们真能离开这座该死的小岛，你总能找到普绪刻的石像，把戒指取下来吧？
        - id: ch01-b159
          speaker: princess
          text: 我找不到！我根本不知道那尊石像在哪里，也从来没见过。它也许在希腊，也许在别的任何地方，我怎么会知道？
          emotion: sad
        - id: ch01-b160
          speaker: narrator
          text: 谁也想不出一句好听的话。值得庆幸的是，谁也没有开口。灰白的晨光已经在四周铺开，北边天空慢慢染上淡粉和浅紫。男孩们阴沉沉地站在那里，双手深深插在口袋里。梅布尔和凯瑟琳仿佛非得彼此依偎不可。她们紧紧靠在一起，腿边的长草全都沾满冰冷露珠。
        - id: ch01-b161
          speaker: narrator
          text: 寂静中，有人轻轻抽了下鼻子，又猛吸一口气。杰拉尔德突然振作起来。
        - id: ch01-b162
          speaker: gerald
          text: 听着，我可不准这样。抽抽搭搭一点用也没有。我不是狠心，这是为你们好。我们绕小岛找一圈，说不定低垂的树枝下面藏着船。
        - id: ch01-b163
          speaker: princess
          text: 怎么可能？
        - id: ch01-b164
          speaker: gerald
          text: 也许有人把船留在那里了。
        - id: ch01-b165
          speaker: princess
          text: 那个人又怎么离开小岛？
        - id: ch01-b166
          speaker: gerald
          text: 当然是坐另一只船。走吧。
        - id: ch01-b167
          speaker: narrator
          text: 四个孩子垂头丧气地出发了，谁都认定岛上没有船，也绝不可能有船。他们从前多少次梦见这座小岛，又多少次盼望自己能困在岛上。如今愿望总算实现了。可现实有时跟梦境大不一样，甚至连梦里一半的趣味都没有。梅布尔尤其难受，因为她的鞋袜还远在湖对岸的陆地上。小岛上的粗草和荆棘毫不留情，一路刺着她裸露的小腿和双脚。
        - id: ch01-b168
          speaker: narrator
          text: 他们跌跌撞撞穿过树林，终于走到水边。可岛岸边的枝条长得太密，根本不能紧贴着水绕岛前进。树木之间倒有一条窄窄的草径，弯弯曲曲，时隐时现。他们便沿着这条小路，沮丧又悲哀地向前走。时间一分一秒过去，他们越来越不可能悄悄溜回校舍，还不被任何人发现。要是有人发现他们失踪了，又发现床铺压根没有睡过，那就一定会闹出一场大乱子。照杰拉尔德的说法，这场乱子的意思就是，永别了，自由。
        - id: ch01-b169
          speaker: gerald
          text: 当然，我们总能出去。只要看见岸上的园丁或看守，大家一起喊就行。可那样一来，秘密就保不住了，一切全完了。
        - id: ch01-b170
          speakers: [jimmy, kathleen, princess]
          ensemble: chorus
          text: 是啊。
          emotion: sad
        - id: ch01-b171
          speaker: gerald
          text: 喂，振作点！以前那些乱子我们都能脱身，这次当然也行，你们明明知道。看，太阳出来了。现在是不是觉得舒服多了，也快活多了？
        - id: ch01-b172
          speakers: [jimmy, kathleen, princess]
          ensemble: chorus
          text: 是啊，当然！
          emotion: sad
        - id: ch01-b173
          speaker: narrator
          text: 三个人的声音凄惨极了。太阳从山丘间一道深深的豁口升起，把强光直直射向小岛。近乎水平的金色阳光穿过树干，晃得孩子们睁不开眼。杰拉尔德走路又从来不看脚下，后来吉米可没忘记指出这一点。
        - id: ch01-b174
          speaker: narrator
          text: 他走在忧郁小队最前面，忽然绊了一跤。杰拉尔德伸手去抓树干，却抓了个空。一声惨叫，一阵哐啷，他整个人消失了。梅布尔紧跟在后面，及时停住，才没摔下陡峭的石阶。长满青苔的阶梯，像是突然从她脚边张开了一张嘴。
        - id: ch01-b175
          speaker: princess
          text: 哦，杰拉尔德！你受伤了吗？
          emotion: fearful
        - id: ch01-b176
          speaker: gerald
          text: 没有。下面有台阶，还有一条通道。
          emotion: angry
        - id: ch01-b177
          speaker: narrator
          text: 其实他伤得相当厉害，只是不肯承认。
        - id: ch01-b178
          speaker: jimmy
          text: 这种地方总会有通道。
        - id: ch01-b179
          speaker: princess
          text: 我早知道这里有一条。它从水底穿过去，出口就在花神殿。连园丁们都知道，只是他们怕蛇，不敢下来。
        - id: ch01-b180
          speaker: gerald
          text: 那我们就能从这里出去。你真该早点说。
        - id: ch01-b181
          speaker: princess
          text: 我没想起来。至少……我想它大概还会经过丑八怪找到那家好旅馆的地方。
        - id: ch01-b182
          speaker: kathleen
          text: 我不去。我才不要摸黑进去，这事没得商量！
          emotion: fearful
        - id: ch01-b183
          speaker: gerald
          text: 很好，小娃娃。没人叫你摸黑进去。你愿意的话，我们把你留在这里，回头坐船来救你。吉米，把自行车灯给我！
          emotion: angry
        - id: ch01-b184
          speaker: narrator
          text: 杰拉尔德的脑袋从下方交错的荆棘间冒出来，一只手伸向上方。吉米从怀里掏出自行车灯。童话故事里的灯总是放在胸前，阿拉丁和其他人都是这样。
        - id: ch01-b185
          speaker: jimmy
          text: 我们带着灯，是怕在杜鹃花丛里被长长的梅布尔绊断腿骨。
        - id: ch01-b186
          speaker: narrator
          text: 杰拉尔德划亮火柴，打开车灯厚实浑圆的玻璃罩。
        - id: ch01-b187
          speaker: gerald
          text: 我不知道你们怎么打算，反正我要走下台阶，沿通道往前。要是真能找到那家好旅馆，那也不错。一家真正的好旅馆从来不会伤害谁。
        - id: ch01-b188
          speaker: jimmy
          text: 没用的。就算真走到花神殿门口，你也知道那扇门打不开。
        - id: ch01-b189
          speaker: gerald
          text: 我可不知道。门里面多半有机关。别忘了，上次我们没有灯，根本没法找。
        - id: ch01-b190
          speaker: princess
          text: 地下是我最讨厌的地方之一。
        - id: ch01-b191
          speaker: gerald
          text: 可你又不是胆小鬼。你很勇敢，梅布尔，这我还不知道吗？你牵吉米的手，我牵凯茜的。好了，走吧。
        - id: ch01-b192
          speaker: jimmy
          text: 我才不要别人牵手，我又不是小孩子。
        - id: ch01-b193
          speaker: gerald
          text: 那凯茜肯牵。可怜的小凯茜！让杰里哥哥牵着你可怜的小手吧。
        - id: ch01-b194
          speaker: narrator
          text: 这番尖酸挖苦没有得逞。凯瑟琳太难过，没听出他的心思，反而满怀感激地抓住那只嘲弄般伸来的手。
        - id: ch01-b195
          speaker: kathleen
          text: 哦，谢谢你，亲爱的杰里。你真好，我会尽量不害怕。
        - id: ch01-b196
          speaker: narrator
          text: 足足有一分钟，杰拉尔德羞愧地觉得，自己刚才确实不算十分厚道。
        - id: ch01-b197
          speaker: narrator
          text: 四个孩子离开日出时越来越浓的金光，走下通往地下，也通往水下长廊的石阶。四周先变得越来越暗，接着又勉强恢复了一点光亮。黎明的辉煌完全退去，只剩下自行车灯微弱而顽强的亮光。石阶果然通向一条长廊，入口被许多个旧秋天吹来、积下的枯叶堵住。没走多久，长廊拐了一个弯，又有更多台阶一路向下。再往前，通道变得空荡而笔直，上下左右都铺着大理石板，干净又明亮。
        - id: ch01-b198
          speaker: narrator
          text: 杰拉尔德一直牵着凯茜。他发现自己心里的体贴比预想中多，恼火却少得多。凯茜也很惊讶，原来自己没有想象中那么害怕。牛眼灯朝前投出一圈朦胧柔光，孩子们默默跟着它。
        - id: ch01-b199
          speaker: narrator
          text: 灯光忽然悄悄变了，像一支蜡烛被拿到阳光下。那情形也像你拿着蜡烛，准备点燃篝火，或引爆一长串火药时，烛焰在日光中突然显出的样子。孩子们这才发现，自己正站在一座巨大的厅堂里。他们又惊奇，又着迷，心中满是敬畏，却一点也不害怕。两排圆柱托着高高的拱顶，一种柔和、透彻又美丽的光充满每个角落和每道缝隙，就像海水灌满秘密海洞里，岩石之间那些无人知道的深处。
        - id: ch01-b200
          speaker: kathleen
          text: 真美！
          emotion: surprised
        - id: ch01-b201
          speaker: narrator
          text: 凯瑟琳急促的呼吸吹得哥哥耳朵发痒。梅布尔一把抓住吉米的手。
        - id: ch01-b202
          speaker: princess
          text: 我非牵着你的手不可。我得抓住一样东西，不然就不敢相信这是真的。傻瓜。
          emotion: surprised
        - id: ch01-b203
          speaker: narrator
          text: 孩子们所在的这座厅堂，是世上最美丽的地方。可我不打算描写它，因为在任何两个人眼中，它的模样都不一样。就算我真想告诉你，它在四个孩子中某一个人的眼里是什么样子，你也不会明白。这样的地方，别人说得再仔细，也没法让你看见同样的景象。你只要知道，在他们每个人眼里，这座厅堂都尽善尽美。
        - id: ch01-b204
          speaker: narrator
          text: 我只告诉你一件事，厅堂四周都是高大的拱门。可就连这些拱门，四个人看见的也各不相同。凯瑟琳看见摩尔式拱门，梅布尔看见都铎式，杰拉尔德看见诺曼式，吉米看见的却是教区委员式哥特风。你若不知道这些式样是什么，就去问那位收藏纪念铜牌的叔叔，他会解释给你听。又或者，你也可以请米勒先生把各种拱门画出来。
        - id: ch01-b205
          speaker: narrator
          text: 透过这些拱门，能看见许许多多的事物，多得简直数不清。一扇门外是橄榄园，一对恋人在意大利月光下手牵着手。另一扇门外是狂野的大海，一艘船迎着风浪向前冲，连奔腾的怒海也向它臣服。还有一扇门里，国王端坐在宝座上，廷臣们恭恭敬敬地侍候在四周。再下一扇门里，却是一家真正的好旅馆。那位体面的丑八怪正坐在门前台阶上，舒舒服服地晒太阳。
        - id: ch01-b206
          speaker: narrator
          text: 他们还看见一位母亲俯身望着木摇篮，一位画家痴痴看着刚画完的作品，湿润画笔还握在手中。又有一位将军倒在战场上，他深爱的旗帜已经在那里胜利升起。这些都不是图画，而是最真切、最鲜活的真实。任何人都看得出，它们永远不会消失。
        - id: ch01-b207
          speaker: narrator
          text: 其他拱门里还有更多景象。每一扇门框住的，都是生命绽放成烈火与鲜花的那一刻。那也是人类灵魂所能祈求、人类命运所能赐予的最好事物。你也许会奇怪，那家真正的好旅馆为什么也在这里。那是因为有些灵魂对生命最高的要求，不过就是一家真正的好旅馆。对这样的灵魂来说，它正是命运能给出的最好礼物。
        - id: ch01-b208
          speaker: kathleen
          text: 哦，我真高兴我们来了。真的，真的！
          emotion: happy
        - id: ch01-b209
          speaker: narrator
          text: 凯瑟琳紧紧握着哥哥的手。四个人慢慢走过厅堂。吉米把已经毫无用处的牛眼灯提得歪歪斜斜。在宏大灿烂的光里，那盏灯几乎只剩下一团影子。
        - id: ch01-b210
          speaker: narrator
          text: 快到厅堂尽头时，他们终于看见光从哪里来。所有光辉都从同一个地方涌出、铺开。那里立着梅布尔说自己根本不知道去哪儿找的唯一一尊石像，普绪刻。孩子们满心欢喜，又满心迷惘，慢慢走近她。普绪刻举起的手上，正戴着一枚深色戒指。
        - id: ch01-b211
          speaker: narrator
          text: 杰拉尔德松开凯瑟琳，一只脚踩上基脚，一边膝盖跪上基座。他站起来，成了一个黑暗而鲜活的人类身影，紧挨着长着蝴蝶翅膀的洁白少女。
        - id: ch01-b212
          speaker: gerald
          text: 但愿你不会介意。
        - id: ch01-b213
          speaker: narrator
          text: 他极轻地把戒指褪下来，随后跳回地面。
        - id: ch01-b214
          speaker: gerald
          text: 别在这里许愿。不知道为什么，反正不能在这里。
        - id: ch01-b215
          speaker: narrator
          text: 大家从白色普绪刻身后绕过去。杰拉尔德举着自行车灯走在最前，踏入黑暗通道，灯火立刻又显得明亮起来。这条通道通向厅堂之外，不过那时他们还不知道，刚才那究竟是什么厅堂。
        - id: ch01-b216
          speaker: narrator
          text: 蜿蜒的通道包围着他们，黑暗紧紧挤压自行车灯的一小圈光。
        - id: ch01-b217
          speaker: kathleen
          text: 把戒指给我。我完全知道该怎么说。
        - id: ch01-b218
          speaker: narrator
          text: 杰拉尔德不大情愿地把戒指交给她。
        - id: ch01-b219
          speaker: kathleen
          text: 我希望家里谁也不知道我们今晚出去过。我还希望大家平安回到各自的床上，已经脱掉衣服，穿好睡衣，睡着了。
        - id: ch01-b220
          speaker: narrator
          text: 等他们重新有了知觉，四周已经是明亮、强劲又普普通通的白昼。不是刚才灰蒙蒙的日出时分，而是平常有人走进房间，掀开窗帘，叫你起床时所见的那种熟悉天光。四个孩子没有留在那条黑暗的通道里，每个人都好端端地躺在自己的床上。
        - id: ch01-b221
          speaker: narrator
          text: 凯瑟琳的愿望想得非常周全，只有一个错误。她说的是各自的床，可梅布尔自己的床当然在亚尔丁庄园。梅布尔本来得到姨妈允许，要在城里那位跟她形影不离的朋友家过夜。姨妈晚上十一点锁门时，她明明还没有回来。可到了第二天早晨，她却好好睡在自己家里的床上。这样一件事，换成谁都很难解释。
        - id: ch01-b222
          speaker: narrator
          text: 直到今天，那位灰褐头发的姨妈也没想明白这是怎么回事。她虽然不算聪明，却也没笨到相信梅布尔从早晨起接连编出的十一种离奇解释。其实最先说出的那一个，也就是算上它总共十二个解释中的第一个，偏偏就是真相。姨妈当然聪明得绝不会相信那个！
