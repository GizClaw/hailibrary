audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    lord_yalding:
      display_name: 亚尔丁勋爵
      tts:
        delivery: 温和风趣，克制中带着真诚
        timbre: 清朗沉稳的成年男声
        pace: 从容
        pitch: 中低音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 文雅含蓄，中文里保留轻微的法语式语序
        timbre: 柔和明亮的成年女声
        pace: 稍缓
        pitch: 中音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 爽快直白，爱下简短结论
        timbre: 朴实清亮的年轻女声
        pace: 自然
        pitch: 中音
    grocers_daughter:
      display_name: 杂货商的女儿
      tts:
        delivery: 兴致勃勃，带着出游时的拘谨
        timbre: 清脆的年轻女声
        pace: 自然
        pitch: 中高音
    milliner_friend:
      display_name: 女帽店姑娘
      tts:
        delivery: 随和好奇，安静听人说话
        timbre: 轻柔的年轻女声
        pace: 自然
        pitch: 中高音
    drapers_assistant:
      display_name: 布店伙计
      tts:
        delivery: 爱开玩笑，带一点卖弄的浪漫
        timbre: 明快的年轻男声
        pace: 稍快
        pitch: 中音
    sweetheart:
      display_name: 伙计的心上人
      tts:
        delivery: 害羞活泼，笑意藏不住
        timbre: 甜润的年轻女声
        pace: 轻快
        pitch: 中高音
    conway:
      display_name: 杰斐逊·D·康韦
      tts:
        delivery: 精明爽利，带着夸张而自信的美国派头
        timbre: 干脆结实的成年男声
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 开放日与野餐之约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            亚尔丁城堡到了每周一次的开放日。孩子们觉得，正好可以去看梅布尔，再像杰拉尔德所说，神不知鬼不觉地混进游客中间。他们可以暗自得意，因为城堡里的活动墙板、魔法戒指，还有那些会在月下活过来的石像，样样都是自己知道，游客却不知道的。魔法奇遇最叫人快活的地方，或许正是这种感觉。你掌握着别人一无所知的真相，而那些人就算听你说了，也未必肯相信。
        - id: ch01-b02
          speaker: narrator
          text: >-
            城堡大门外的白路上，四轮马车、轻便马车和双轮马车星星点点地停着。三四辆候客汽车笨重地喷着烟，红砖墙边的草洼里，自行车横七竖八堆成一片。乘各种车来的人，加上靠自己两条腿走来的人，有的散在庭园各处，有的跟着向导，参观每周只开放这一天的房间。听说亚尔丁勋爵回来了，还有一位美国富翁想租下城堡，今天的游客格外多。国宾套房里的家具都揭掉了粗麻布罩。椅子露出绣花缎面、描金皮革和织锦，房间一下有了有人居住的亲切气息。桌上与窗台上摆着开花的盆栽和一盆盆玫瑰。梅布尔的姨妈一向以布置家居的雅趣自豪，还专门研读过《家居胡扯》上的系列文章《每周九便士，把家变高雅》。平时套在袋子里的水晶吊灯，如今闪着灰紫色的华光。国宾卧床上的褐布单也揭去了，连那些把普通百姓拦在规矩位置的红绳，都卷好藏了起来。
        - id: ch01-b03
          speaker: grocers_daughter
          text: >-
            这样走进来，简直像是在拜访这家的主人。
        - id: ch01-b04
          speaker: drapers_assistant
          text: >-
            那个美国佬要是不租，等咱们结婚了，搬进来住怎么样？
        - id: ch01-b05
          speaker: sweetheart
          text: >-
            哎呀，雷吉，你怎么说得出口！你真会逗人。
        - id: ch01-b06
          speaker: narrator
          text: >-
            整整一个下午，游客穿着最漂亮的假日衣服，在幽暗大厅、华丽客厅、闺房和画廊里穿来穿去。粉红衬衫、浅色套装、缀满花的帽子，还有难以形容的围巾，汇成一股喋喋不休的人潮。只有走进庄严宁静的卧房时，众人才多少安静下来。那里曾有人出生，也有人死去。很久以前的夏夜，王室贵宾曾在这里安眠，壁炉上还摆着一大束接骨木花，用来驱散热病与邪恶的咒法。露台下的花坛种着香蔷薇与青蒿。旧日戴轮状皱领的贵妇曾在那里闻花香，涂脂抹粉、身披锦缎的小姐，也曾摇着宽大的箍裙缓步走过。如今同一座露台上，回响的却是褐色靴子的脚步、廉价高跟鞋的嗒嗒声，还有响亮的笑与没有一句值得孩子听的闲谈。那片喧闹糟蹋了魔法城堡的幽静，也冒犯了魔法花园的安宁。
        - id: ch01-b07
          speaker: gerald
          text: >-
            其实这场热闹一点也不好玩。我真讨厌看着这么多人闯进我们的花园。
        - id: ch01-b08
          speaker: princess
          text: >-
            我早上也对那位和气的庄园管事这么说。他却觉得，每周只开放一次不算什么。要是他住在这里，他还愿意随时让人进来呢。
        - id: ch01-b09
          speaker: jimmy
          text: >-
            他懂什么！他还说了什么？
        - id: ch01-b10
          speaker: princess
          text: >-
            说了好多。我很喜欢他，所以把我们的冒险全告诉他了。他特别会听故事。我每个字都讲真的，却偏偏选了一种谁听了都不会相信的讲法。等我全讲完，他说我确实有文学天分。我答应他，等我长大写出第一本书，一定把他的名字印在书的开头。
        - id: ch01-b11
          speaker: gerald
          text: >-
            梅布尔小宝贝，你再管不住嘴，我们准会被关进疯人院，做一群可爱的疯子。
        - id: ch01-b12
          speaker: kathleen
          text: >-
            你连他的名字都不知道。我们还是用戒指做点什么吧。
        - id: ch01-b13
          speaker: gerald
          text: >-
            不行。我回去拿吊袜带时遇见法国女教师了。她要来找我们，再一起走回去。我当然说她肯来真是太好了。我们不想她来，又不等于她不是好意。
        - id: ch01-b14
          speaker: princess
          text: >-
            好意也一样叫人受不了。我们得守在这里等她，可我答应去见庄园管事。他要带一篮子吃的，在恐龙那边和我们喝野餐茶。他还会讲那些诺亚方舟以前的动物，我则拿那些“讨人喜欢的虚构故事”跟他交换。
        - id: ch01-b15
          speaker: gerald
          text: >-
            不如带法国女教师一起去。
        - id: ch01-b16
          speaker: kathleen
          text: >-
            她也许太骄傲，不肯和庄园管事喝茶。大人对简单事情会怎么想，谁也猜不到。
        - id: ch01-b17
          speaker: gerald
          text: >-
            那你们都去吧，野餐可不能错过。我留下等她。
        - id: ch01-b18
          speaker: princess
          text: >-
            杰拉尔德，你真够意思！
        - id: ch01-b19
          speaker: gerald
          text: >-
            少胡扯！这不叫讨好，叫外交。谁知道大人哪天会派上用场？总得给他们一点小乐趣。想想看，变老该多可怕！
        - id: ch01-b20
          speaker: kathleen
          text: >-
            但愿我以后别做老姑娘。
        - id: ch01-b21
          speaker: princess
          text: >-
            我才不做。哪怕嫁给四处流浪的补锅匠，也比做老姑娘好。
        - id: ch01-b22
          speaker: kathleen
          text: >-
            嫁给吉卜赛国王也不错。坐着大篷车到处走，替人算命，车外还挂满篮子和扫帚。
        - id: ch01-b23
          speaker: princess
          text: >-
            要我挑，当然嫁给一个强盗，住在深山堡垒里。我会善待他的俘虏，再帮他们逃走。
        - id: ch01-b24
          speaker: gerald
          text: >-
            你一定会成为丈夫难得的贤内助。
        - id: ch01-b25
          speaker: kathleen
          text: >-
            或者嫁给水手。你在阁楼窗前点灯，照他穿过风暴回家。等他淹死在海里，你每天都去长满雏菊的坟上献花。
        - id: ch01-b26
          speaker: princess
          text: >-
            也可以嫁给军人。穿短裙，戴三角帽，脖子上挂只小桶，像圣伯纳犬一样跟他上战场。姨妈有首歌就叫《随军女贩子》。
        - id: ch01-b27
          speaker: gerald
          text: >-
            等我结婚，我要娶个哑巴姑娘。要不就用戒指让她只有被问时才能开口。
        - id: ch01-b28
          speaker: narrator
          text: >-
            他从石格窗向外一看，游客正在离开，只有一个长山羊胡子的古怪小个子走错了方向，等着园丁去截住。
        - id: ch01-b29
          speaker: gerald
          text: >-
            那些粉红紫红的帽子正点着头，渐渐走远。山羊胡子的小个子偏偏走了另一条路，园丁得把他截回来。还是没看见法国女教师。你们赶快溜，野餐不能冒险。故事里那位被遗弃的英雄孤身一人、无依无靠，却催促勇敢的追随者去追辎重车。自己则留下守住危险艰难的岗位，因为他生来就注定站在众人已经逃离的燃烧甲板上，还要率领全人类都已经绝望的敢死队！
        - id: ch01-b30
          speaker: princess
          text: >-
            我看还是嫁个哑巴丈夫吧。以后我写书，也只写女英雄。走吧，凯茜。
        - id: ch01-b31
          speaker: narrator
          text: >-
            三个孩子从阴凉石亭走进阳光，像一步踏进烤炉。露台的石头烫得烧脚，吉米终于明白，热砖上的猫是什么滋味。那些史前动物立在半英里外一片山坡上的山毛榉林中，是现任勋爵的祖父在上个世纪中叶安放的。那正是阿尔伯特亲王、万国博览会、约瑟夫·帕克斯顿爵士与水晶宫风头最盛的年代。远远望去，树间已经露出灰色的石头腰身、又宽又笨重的翅膀，还有菱格斑驳、酷似鳄鱼的脊背。多数人以为中午最热，其实万里无云时，整个下午会越来越热，直到五点才热到顶点。你若穿着浆得硬挺的体面衣服，走一条又长又没树荫的路去别人家喝茶，一定早就知道。凯瑟琳、梅布尔和吉米越来越热，脚步也越来越慢。那种又恼火又难受，叫人后悔出门的心情刚要冒头，他们才看见庄园管事在林边挥动白手帕。
    - id: ch02
      title: 山毛榉林里的愿望
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那块白手帕像一面旗帜，无声地许诺着茶点、树荫，还有终于可以坐下休息的地方。孩子们一下又有了精神，赶紧加快脚步。最后那一小段路，他们索性拼命跑起来，一头冲进铺满铜色枯叶的山毛榉林。裸露的树根有灰有绿，在脚下交错起伏。
        - id: ch02-b02
          speaker: jimmy
          text: >-
            啊，太好啦！您好！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: >-
            姑娘们觉得，庄园管事今天体面极了。他没穿平常那套天鹅绒猎装，而是换了一身灰法兰绒西服，伯爵穿了也不失体面。他的草帽不会给公爵丢脸，那条漂亮的绿领带，就连王子也戴不出更好的。他热情欢迎孩子们。山毛榉叶间放着两只沉甸甸的篮子，一望就知道装满了好东西。他又非常懂得体贴。孩子们一路上想到还要顶着酷热，听一番石头史前动物的知识讲解，兴致早就越来越低，他却连提也没提这回事。
        - id: ch02-b04
          speaker: lord_yalding
          text: >-
            你们一定渴得像沙漠。等喝够了，又该饿了。我远远认出那位美丽故事家的身影，马上把水壶烧上了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            水壶坐在树根间的酒精灯上，噗噗冒气，咕嘟作响。
        - id: ch02-b06
          speaker: lord_yalding
          text: >-
            把鞋袜脱了吧。坡那边有一条小得像婴儿的水渠。
        - id: ch02-b07
          speaker: narrator
          text: >-
            走得又热又累以后，把脚浸进清凉流水，那份快乐至今还没人真正写出来过，叙述者觉得自己能为它写上好几页。小时候那条磨坊水沟里有小鱼，还有打着转漂走的落叶。柳树与桤木俯在水面上，替流水遮出一片清凉。不过，这并不是叙述者一生的故事。孩子们回来时，粉红的小脚已经歇够了，湿漉漉地踩在地上。茶也沏好倒好了，那茶香得不得了，爱加多少牛奶都行。牛奶装在一只带螺旋盖的啤酒瓶里。篮子中还有蛋糕、姜饼、李子，以及一只大甜瓜，瓜心里嵌着一大块冰。这简直是给神仙吃的茶点。
        - id: ch02-b08
          speaker: jimmy
          text: >-
            您这顿盛宴，快赶上不朽众神的宴席了。
        - id: ch02-b09
          speaker: lord_yalding
          text: >-
            请你解释一下，这句高深的典故究竟是什么意思。
        - id: ch02-b10
          speaker: narrator
          text: >-
            吉米听懂他是在问什么意思，便从头讲起那个奇妙夜晚。石像怎样在月光下活过来，孩子们怎样游过湖水登上小岛。那场宴席又怎样既辉煌又美味，完全不属于人间。大理石的手从湖心岛的树枝上，摘下金盘、金杯和尘世长不出的水果，众神的歌声还在夜色中久久流淌。
        - id: ch02-b11
          speaker: lord_yalding
          text: >-
            这些都是你从书里看来的？
        - id: ch02-b12
          speaker: jimmy
          text: >-
            不是，真的发生过。梅布尔告诉您的那些也全是真的。
        - id: ch02-b13
          speaker: lord_yalding
          text: >-
            你们这一群爱做梦的小家伙，想象力真丰富。
        - id: ch02-b14
          speaker: narrator
          text: >-
            他一面说，一面把李子递给凯瑟琳。凯瑟琳友好却又尴尬地笑了笑，心里只盼吉米赶紧闭嘴。可吉米固执地说，自己讲的每件事都确实发生过，梅布尔讲的也是。庄园管事听了，神色也有点不自在。他先用一句“好吧，小伙子”想把话题带过去，林中却落下一阵短短的尴尬沉默。偏偏这一回，吉米像咬住了马嚼子，谁也拉不住。
        - id: ch02-b15
          speaker: jimmy
          text: >-
            您别绕着说了，到底信不信我讲的这些事？
        - id: ch02-b16
          speaker: kathleen
          text: >-
            吉米，别犯傻。您要是不信，我就叫您非信不可。
        - id: ch02-b17
          speakers: [princess, kathleen]
          ensemble: duo
          text: >-
            别这样！
        - id: ch02-b18
          speaker: lord_yalding
          text: >-
            我觉得你特别会讲冒险故事。
        - id: ch02-b19
          speaker: jimmy
          text: >-
            那就是不信。别拦我，凯茜。他就算是庄园管事，也是个绅士。您不会把任何事说出去吧？
        - id: ch02-b20
          speaker: lord_yalding
          text: >-
            当然不会。正如你说的，我是荣誉本身。
        - id: ch02-b21
          speaker: jimmy
          text: >-
            凯茜，把戒指给我。
        - id: ch02-b22
          speakers: [kathleen, princess]
          ensemble: duo
          text: >-
            哦，不行！
        - id: ch02-b23
          speaker: narrator
          text: >-
            凯瑟琳不打算交出戒指，梅布尔也不想让她交，吉米当然更没有动武。可这偏偏是属于吉米的时刻。没过多久，谁也说不清事情怎么发生的，戒指竟已经到了他手里。我们每个人都会遇到这样的时刻，只要我们开口说某件事非做不可，它就真的会做成。
        - id: ch02-b24
          speaker: jimmy
          text: >-
            这就是梅布尔说过的戒指。我说它是许愿戒指。您只要戴上它，把愿望说出来，愿望就会实现。
        - id: ch02-b25
          speaker: lord_yalding
          text: >-
            我许愿的时候，必须把愿望说出声来吗？
        - id: ch02-b26
          speaker: jimmy
          text: >-
            我想必须说。
        - id: ch02-b27
          speaker: kathleen
          text: >-
            别许星期二天晴，或者明晚吃到爱吃的布丁。得许您真正想要的东西。
        - id: ch02-b28
          speaker: lord_yalding
          text: >-
            那我就许下唯一真正想要的事。我希望我的……我希望我的朋友就在这里。
        - id: ch02-b29
          speaker: narrator
          text: >-
            三个知道戒指威力的孩子立刻四下张望，等着庄园管事的朋友突然现身。他们想，那位男士一定会大吃一惊，说不定还会害怕。三个人全站起来，准备好好安慰这位凭空到来的客人。可是，山毛榉林里并没有冒出什么惊慌失措的绅士。只有法国女教师与杰拉尔德穿过树下斑驳的阳光和阴影，静静向他们走来。法国女教师穿着白裙，显得十分漂亮，简直像画中人。杰拉尔德则热得厉害，却仍旧彬彬有礼。
        - id: ch02-b30
          speaker: gerald
          text: >-
            下午好。我说服了法国女教师……
        - id: ch02-b31
          speaker: narrator
          text: >-
            这句话永远没能说完。庄园管事与法国女教师已经彼此望住了。他们的眼神就像两个走得筋疲力尽的旅人，完全没有料到自己会忽然抵达漫长旅途一直向往的终点。五个孩子站在旁边，也全都看明白了。此刻就算他们开口，甚至一齐大声说话，也不会产生半点分别。
        - id: ch02-b32
          speaker: lord_yalding
          text: >-
            是你！
          emotion: surprised
        - id: ch02-b33
          speaker: mademoiselle
          text: >-
            可是……原来是您。
          emotion: surprised
        - id: ch02-b34
          speaker: narrator
          text: >-
            两人一动不动，互相望了好一阵。谁也不管旁边还站着五个孩子，谁也想不起茶点或礼貌。用吉米后来的说法，他们就那样傻站着，活像两头呆猪。
        - id: ch02-b35
          speaker: jimmy
          text: >-
            她就是您的朋友？
        - id: ch02-b36
          speaker: lord_yalding
          text: >-
            对，当然是。你是我的朋友，对不对？
        - id: ch02-b37
          speaker: mademoiselle
          text: >-
            当然。我是您的朋友。
        - id: ch02-b38
          speaker: jimmy
          text: >-
            瞧！戒指真的照我说的做了。
        - id: ch02-b39
          speaker: lord_yalding
          text: >-
            不必争这个。你可以说是戒指。依我看，这是巧合，是世上最幸福、最珍贵的巧合。
        - id: ch02-b40
          speaker: mademoiselle
          text: >-
            那么您……？
        - id: ch02-b41
          speaker: lord_yalding
          text: >-
            当然。吉米，给你哥哥倒茶。法国女教师，我们去林中走走吧。有一千件事等着说。
        - id: ch02-b42
          speaker: mademoiselle
          text: >-
            你吃吧，我的杰拉尔德。我整点回来，我们一起回去。我和亚尔丁勋爵已经很久没有见面，我们必须好好说话。
        - id: ch02-b43
          speaker: narrator
          text: >-
            她一下显得年轻了，惊人地像一位仙女公主。她叫杰拉尔德先好好吃东西，又说自己整点就回来，到时大家再一同回去。她与亚尔丁勋爵已经很久没见，眼下有许多话非说不可。亚尔丁勋爵也请吉米给哥哥倒茶，然后与她一起走进树林。白裙和灰色法兰绒西服并肩消失在山毛榉树干之间。留下的孩子们目瞪口呆，过了好一会儿，才终于有人打破沉默。
        - id: ch02-b44
          speaker: jimmy
          text: >-
            原来他一直就是亚尔丁勋爵。拿真实身份当伪装，简直像风景画家微服出游那一套，我看蠢透了。谁能想到法国女教师就是他的朋友，他唯一的愿望还偏偏是叫她来到这里！这跟我们以前许的那些愿望多不一样。好戒指，老戒指这回真办了件好事！
        - id: ch02-b45
          speaker: princess
          text: >-
            什么朋友？她是他的心上人。她就是因为他太穷，被人封进修道院的小姐。他找不到她，现在戒指终于叫他们从此幸福生活了。我真高兴！
        - id: ch02-b46
          speaker: kathleen
          text: >-
            我也高兴。这跟嫁给水手或强盗一样好。
        - id: ch02-b47
          speaker: jimmy
          text: >-
            都是戒指的功劳。美国人租下城堡，付好多租金，他们就有钱过日子了。
        - id: ch02-b48
          speaker: princess
          text: >-
            不知道他们明天会不会结婚！
        - id: ch02-b49
          speaker: kathleen
          text: >-
            要是让我们做伴娘，该多好玩！
        - id: ch02-b50
          speaker: gerald
          text: >-
            请把甜瓜递给我。我们怎么没看出他是谁？真是又瞎又蠢。
        - id: ch02-b51
          speaker: princess
          text: >-
            我昨晚就知道，只是答应了不说。我很会保守秘密，对吧？
        - id: ch02-b52
          speaker: kathleen
          text: >-
            会得未免太过头了。
        - id: ch02-b53
          speaker: gerald
          text: >-
            他根本没装。想让人认不出来，最好的办法就是把自己扮成自己。歇洛克·福尔摩斯和那个笨蛋华生都没看穿这个道理，我可得记住。
        - id: ch02-b54
          speaker: princess
          text: >-
            法国女教师运气真好。
        - id: ch02-b55
          speaker: gerald
          text: >-
            她也不坏。他娶她总比娶别人强。请把李子递来！
    - id: ch03
      title: 美国百万富翁
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天早晨，魔法显然仍在暗中出力。法国女教师已经成了一位完全不同的家庭教师。她两颊粉红，嘴唇鲜红，眼睛看起来比从前更大、更明亮。就连头发也梳成了全新的样式。那发式多少有点轻佻，却漂亮得非常衬她。
        - id: ch03-b02
          speaker: eliza
          text: >-
            小姐要出阁喽！
        - id: ch03-b03
          speaker: narrator
          text: >-
            早饭刚吃完，亚尔丁勋爵便乘轻便马车来接大家。车身仿佛穿了一件漂亮的蓝布外衣，拉车的两匹马则披着油亮的褐色皮毛，那身皮毛比蓝布外衣贴合车身还要服帖。一行人就这样威风又气派地来到城堡。孩子们吵着请求彻底探查这座宅邸，这是他们从前一直没能做到的事。亚尔丁勋爵虽有些心不在焉，态度倒很亲切，很快答应下来。梅布尔领大家看遍自己发现的暗门、意想不到的通道和秘密楼梯。这真是一个好得不得了的早晨。亚尔丁勋爵与法国女教师也在屋里走了一阵，只是两个人都有些三心二意。他们很快便累了，从客厅的落地玻璃门走进玫瑰园，坐到迷宫中央那张弯曲的石凳上。当初一切刚开始时，杰拉尔德、凯瑟琳和吉米，正是在那里找到身穿粉红绸裙、头戴钻石的睡美人公主。
        - id: ch03-b04
          speaker: narrator
          text: >-
            两个大人一走，孩子们觉得城堡里顿时多出了一片宽广自在的天地。他们探索得比北极探险家还热心。后来，他们沿着一座摇摇晃晃的秘密小楼梯，从国宾套房的梳妆室钻到大厅上方的回廊。刚从小门出来，便迎面碰上昨天走错路的那个古怪小个子。他长着山羊似的胡子，正站在不该有游客出现的地方。
        - id: ch03-b05
          speaker: princess
          text: >-
            城堡的这一部分是私人的，不对游客开放。
        - id: ch03-b06
          speaker: conway
          text: >-
            我知道。不过亚尔丁伯爵允许我随意察看这座宅邸。
        - id: ch03-b07
          speaker: princess
          text: >-
            对不起，我们不知道。
        - id: ch03-b08
          speaker: conway
          text: >-
            各位想必是勋爵的亲戚？
        - id: ch03-b09
          speaker: gerald
          text: >-
            不完全是。我们是朋友。
        - id: ch03-b10
          speaker: narrator
          text: >-
            这位绅士身材瘦削，穿戴却极其整齐。他的脸被太阳晒得褐黄，望上去有些干巴巴的，一双小眼睛却笑盈盈。他猜孩子们是在玩什么游戏，随后露出一个拘谨却和善的笑容，提出要加入他们的探险。
        - id: ch03-b11
          speaker: conway
          text: >-
            你们是在玩游戏吧？一个陌生人能不能自荐加入探险队？
        - id: ch03-b12
          speaker: gerald
          text: >-
            这事不好解释。不过，您懂我的意思，对吧？
        - id: ch03-b13
          speaker: jimmy
          text: >-
            我们不知道您为什么想去，就不能让您加入。
        - id: ch03-b14
          speaker: princess
          text: >-
            您是摄影师，还是报社派来写城堡的？
        - id: ch03-b15
          speaker: conway
          text: >-
            我明白。我不拍照，也不替报社办事。我有些私人财产，正在贵国寻找一处可以租住的宅邸。我叫杰斐逊·D·康韦。
        - id: ch03-b16
          speaker: princess
          text: >-
            那您就是那位美国百万富翁。
        - id: ch03-b17
          speaker: conway
          text: >-
            我不喜欢这个称呼，小姐。我是美国公民，手头也不算拮据。这处产业非常好。要是肯卖……
        - id: ch03-b18
          speaker: princess
          text: >-
            不能卖。律师把城堡放进了限定继承，亚尔丁勋爵卖不了。不过您可以租下来，付一笔很有百万富翁派头的租金。这样他就能娶法国女教师……
        - id: ch03-b19
          speakers: [kathleen, conway]
          ensemble: duo
          text: >-
            嘘！
        - id: ch03-b20
          speaker: conway
          text: >-
            请带路。我建议把这次探查做得完整而彻底。
        - id: ch03-b21
          speaker: narrator
          text: >-
            得到这番鼓励以后，梅布尔便领着这位百万富翁走遍整座城堡。一个房间接着一个房间，一条通道连着另一条通道，他都仔细看了。孩子们也把自己知道的地方尽量展示给他。美国人显然很欣赏这处产业，时不时点头打量墙壁、地板与陈设。可不知为什么，他那双快活的小眼睛里又总留着一点失望，仿佛一座这么古老的城堡，不该只有眼前这些东西。
        - id: ch03-b22
          speaker: conway
          text: >-
            这宅邸很好。不过这么大的地方，通常该有秘密楼梯、藏匿神父的暗室，或者一个鬼魂吧？
        - id: ch03-b23
          speaker: princess
          text: >-
            有呀。我还以为美国人除了机器和报纸，什么都不信呢。
        - id: ch03-b24
          speaker: narrator
          text: >-
            梅布尔按动身后墙板的机关，暗门缓缓打开，露出那座摇摇晃晃的小楼梯。眼前的景象把美国人彻底变了一个样。他先前那点失望一扫而空，整个人立刻兴奋起来，精神抖擞，眼神也变得锐利极了。他站在梳妆室通往国宾卧房的门口，一遍遍赞叹这条秘密通道。
        - id: ch03-b25
          speaker: conway
          text: >-
            嘿，这可太棒了！真是太棒了！
          emotion: happy
        - id: ch03-b26
          speaker: narrator
          text: >-
            他的兴奋也点燃了所有人的希望。照眼前的情形看，城堡几乎肯定会以一笔很有百万富翁派头的租金租出去。只要美国人把租金付给亚尔丁勋爵，勋爵就会立刻富裕起来，而且会一直富裕到足以结婚的程度。
        - id: ch03-b27
          speaker: conway
          text: >-
            要是这座祖传老宅里还安置着一个真正的鬼魂，我今天就能跟亚尔丁伯爵签约。现在，当场拍板，马上成交。
        - id: ch03-b28
          speaker: princess
          text: >-
            您在这间房睡一夜，大概就能见到鬼。
        - id: ch03-b29
          speaker: conway
          text: >-
            这里真安置着鬼魂？
          emotion: happy
        - id: ch03-b30
          speaker: princess
          text: >-
            人家说，老鲁珀特爵士在亨利八世时代掉了脑袋。夜里，他会把自己的头夹在胳膊下面，在这里走来走去。不过这个鬼，我们还没有见过。我们真正见过的，是一位穿粉红裙子的小姐。她的头发上戴着钻石，手里还拿着一根点燃的蜡烛。
        - id: ch03-b31
          speaker: narrator
          text: >-
            梅布尔赶忙补上一句，说那位粉红裙子的小姐手里还拿着点燃的蜡烛。其他人这才突然听懂她的计划，纷纷用最认真、最可信的口气向美国人保证，他们全都亲眼见过那位小姐。康韦先生没有马上回答。他半眯起那双闪亮的小眼睛，一个接一个地打量孩子们。
        - id: ch03-b32
          speaker: conway
          text: >-
            我会请求伯爵准我在祖传的最佳卧房过夜。只要听见一声鬼脚步，或者一声幽灵叹气，我就租下这里。
        - id: ch03-b33
          speaker: kathleen
          text: >-
            太好了！我真高兴！
          emotion: happy
        - id: ch03-b34
          speaker: conway
          text: >-
            看来你们对这个鬼很有把握。不过我要告诉各位年轻的先生，我身上一直带着枪。只要真有鬼出现在面前，我一看见它，马上就会开枪。
        - id: ch03-b35
          speaker: narrator
          text: >-
            他说着便从臀部口袋里掏出一把手枪，拿在掌中爱怜地看了看。随后，他穿过国宾卧房光亮的地板，一直走到那扇敞开的窗前。
        - id: ch03-b36
          speaker: conway
          text: >-
            我的枪法还算过得去。看见那朵茶碟一样大的红玫瑰了吗？
        - id: ch03-b37
          speaker: narrator
          text: >-
            孩子们顺着他的手指望去，看见窗外那朵硕大的红玫瑰。下一刻，一声巨响击破城堡的寂静。玫瑰被子弹打得粉碎，鲜红的花瓣纷纷落下，撒满石栏杆与露台。康韦先生从一个孩子看到另一个孩子，只见每张小脸都白得没有一点血色。
        - id: ch03-b38
          speaker: conway
          text: >-
            杰斐逊·D·康韦能挣下这点家当，靠的就是专心办事，而且无论什么时候都把眼睛睁得雪亮。多谢各位对我的好意。
        - id: ch03-b39
          speaker: jimmy
          text: >-
            梅布尔，想想看，要是你真的扮成鬼跑来见他，他朝你开枪，还一枪打中了你，那可就会变成一场真正的冒险了！
        - id: ch03-b40
          speaker: princess
          text: >-
            我还是要扮。我们去找亚尔丁勋爵，把戒指要回来。
    - id: ch04
      title: 枪声中的鬼魂
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            亚尔丁勋爵刚刚和梅布尔的姨妈谈过话。幽暗的大厅里，在铠甲与沉重的橡木家具之间，已经摆好六个人的午餐。菜肴精美极了，全都盛在银盘里。法国女教师每过一刻，就显得更年轻，也更像一位公主。杰拉尔德站起来，手中举着一杯柠檬水，郑重提议大家为“亚尔丁勋爵与夫人”的健康干杯。法国女教师听见这句话，感动得流下眼泪。亚尔丁勋爵则说了一篇满是有趣笑话的答谢辞。等他说完，杰拉尔德觉得开口要回戒指的时机终于到了。
        - id: ch04-b02
          speaker: gerald
          text: >-
            那枚戒指，您知道，您虽然不相信它有魔法，我们却相信。现在可以把它还给我们吗？
        - id: ch04-b03
          speaker: narrator
          text: >-
            他真的顺利拿回了戒指。四个孩子马上赶到那间有墙板的珠宝室，把门关好，围在一起匆匆商议。他们知道美国人身上有枪，也知道梅布尔仍打算制造鬼魂，所以必须先想办法对付那些武器。
        - id: ch04-b04
          speaker: princess
          text: >-
            这是许愿戒指。我希望那个美国人各种各样的武器全都到这里来。
        - id: ch04-b05
          speaker: narrator
          text: >-
            刹那间，房间里塞满一团纠缠交错的武器，一直堆到墙上六英尺高。刀剑、长矛、箭、印第安战斧、猎枪、老式大口径短枪、手枪、左轮枪、弯刀、马来短剑，凡是你想得到的武器，样样都有。四个孩子被紧紧卡在这一大堆杀人的兵器中间，身前身后都是锋刃与枪管，吓得连呼吸都不敢用力。
        - id: ch04-b06
          speaker: gerald
          text: >-
            他准是收藏武器。那些箭说不定还淬了毒。梅布尔，快把它们送回去，再想办法。
        - id: ch04-b07
          speaker: narrator
          text: >-
            梅布尔赶紧许愿，把所有武器送回原来的地方。那团金属与木柄组成的可怕乱麻一瞬间消失，四个孩子重新安安全全地站在空荡荡的墙板房间里。刚才抵着他们身体的刀锋、箭头与枪口，全都不见了。
        - id: ch04-b08
          speaker: princess
          text: >-
            不行，我受不了这个办法。我们换一种法子制造鬼魂吧。我希望那个美国人上床睡觉时，以为自己看见了一个鬼。就让那个把脑袋夹在胳膊下面的鲁珀特爵士去好了。
        - id: ch04-b09
          speaker: kathleen
          text: >-
            他今晚住这里吗？
        - id: ch04-b10
          speaker: princess
          text: >-
            我不知道他是不是今晚睡在这里。那我就希望他每天晚上都能看见鲁珀特爵士，这样无论他哪一晚来住，准保都能万事大吉。
        - id: ch04-b11
          speaker: gerald
          text: >-
            可我们怎么知道他有没有看见？
        - id: ch04-b12
          speaker: princess
          text: >-
            明天早晨，只要他开口租下城堡，我们就知道他见过了。
        - id: ch04-b13
          speaker: narrator
          text: >-
            事情就这样定了。梅布尔的姨妈恰好想要外甥女陪伴，于是梅布尔留在城堡，其他孩子先回了家。他们谁也没料到，这个愿望会怎样实现。等三个孩子坐下吃晚饭时，亚尔丁勋爵忽然亲自来到他们面前。
        - id: ch04-b14
          speaker: lord_yalding
          text: >-
            康韦先生想请你们两个男孩去国宾卧房陪他过夜。我已经叫人添了床。你们不会介意吧？他觉得你们想扮鬼捉弄他。
        - id: ch04-b15
          speaker: narrator
          text: >-
            这份邀请实在难以拒绝，难到最后根本没有办法拒绝。十点钟时，两个男孩已经分别躺在窄窄的白床上。国宾卧房又高又大，黑沉沉的，小床摆在里面，显得荒唐地渺小。正对着他们的，是一张高耸瘦削的四柱床，四周垂着古老织锦，床顶还装饰着一簇簇东西，怎么看都像葬礼上才会出现的羽饰。
        - id: ch04-b16
          speaker: jimmy
          text: >-
            老天保佑，但愿这里没有真鬼。
          emotion: fearful
        - id: ch04-b17
          speaker: gerald
          text: >-
            不会的，这里不可能真有鬼。
        - id: ch04-b18
          speaker: jimmy
          text: >-
            可我不想看见鲁珀特爵士把脑袋夹在胳膊下。
          emotion: fearful
        - id: ch04-b19
          speaker: gerald
          text: >-
            你不会看见。梅布尔许愿叫百万富翁看见，又没叫我们看见。你很可能一觉睡到天亮。闭眼数到一百万，别犯傻。
        - id: ch04-b20
          speaker: narrator
          text: >-
            梅布尔从那位灰褐头发的姨妈那里确认，康韦先生当真会在今晚住进城堡。她唯恐先前的愿望不够准确，赶紧又补了一个，明明白白地说，愿鲁珀特爵士和他的脑袋今晚出现在国宾卧房。另一边，吉米闭上眼睛，认真开始数一百万。可远远没数到，他便睡着了。他哥哥也一样。
        - id: ch04-b21
          speaker: narrator
          text: >-
            一声震耳欲聋、回荡不绝的枪响，把兄弟俩同时惊醒。他们立刻想起早晨打碎红玫瑰的那一枪。两人睁开眼时，心里甚至还在等待那座阳光灿烂的露台，等待红色花瓣撒在暖暖的白石上。
        - id: ch04-b22
          speaker: narrator
          text: >-
            眼前却是高大幽暗的国宾卧房，只有六根高蜡烛发出微弱的光。美国人只穿着衬衫长裤站在房中，手里的手枪还冒着烟。从梳妆室门口向他们走来的，是一个身穿紧身上衣与马裤，颈上套着轮状皱领，却没有脑袋的人影。那颗头的确也在那里，只是被夹在右臂下，紧贴着上衣那只开缝的天鹅绒衣袖。胳膊下露出的脸上，还挂着十分和气的微笑。很遗憾，两个男孩全都尖叫起来。美国人再次开枪，子弹直接穿过鲁珀特爵士。爵士却像根本没有察觉，依然一步步向前。
        - id: ch04-b23
          speaker: narrator
          text: >-
            就在这时，所有灯火忽然全灭了。男孩们眼前只剩一片黑暗。等他们再有知觉时，天已经亮了。灰蒙蒙的晨光空落落地照进高窗，狂乱的雨水不断敲打玻璃。四柱床还在，小白床也还在，可那位美国人已经不见踪影。
        - id: ch04-b24
          speaker: jimmy
          text: >-
            我们这是在哪儿？哦，我想起来了。呃，昨晚真可怕。我已经受够那枚戒指了，现在这么说，我一点也不觉得难为情。
        - id: ch04-b25
          speaker: gerald
          text: >-
            胡说，我觉得挺好玩。我一点也没害怕，你怕了吗？
        - id: ch04-b26
          speaker: jimmy
          text: >-
            没有，我当然一点也没害怕。
        - id: ch04-b27
          speaker: narrator
          text: >-
            后来，他们听说美国人天刚亮就起了床。他很早便同亚尔丁勋爵吃过早饭，接着搭上第一班火车去了伦敦。男孩们还不知道他离开的真正原因，只觉得这趟匆忙的行程一定是在替租下城堡做准备。
        - id: ch04-b28
          speaker: gerald
          text: >-
            这事一定办成了。他赶去伦敦，准是为了处理掉原来的房子，然后回来租下这一座。老戒指折腾了我们那么多次，现在终于开始替大家办真正有用的事了。
    - id: ch05
      title: 一场好心办坏的魔法
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            吉米后来在画廊里遇见亚尔丁勋爵。他还深信美国人已经回伦敦处理旧房子，于是迫不及待地跑去邀功，也想让勋爵终于承认魔法戒指确实存在。
        - id: ch05-b02
          speaker: jimmy
          text: >-
            您现在总该相信那枚戒指了吧。杰斐逊先生昨晚能看见鬼，全是我们的功劳。他亲口告诉我们，只要见到鬼就会租下城堡，所以我们当然得想办法，确保他真的见到一个。
        - id: ch05-b03
          speaker: lord_yalding
          text: >-
            哦，原来是你们干的，是不是？那我可真得好好谢谢你们了。
        - id: ch05-b04
          speaker: jimmy
          text: >-
            不用客气。我原以为您一定会高兴，而且杰斐逊先生也一定会高兴。
        - id: ch05-b05
          speaker: lord_yalding
          text: >-
            你也许想知道，他对你们的鬼满意极了。今天早晨六点，他就把我从床上叫起来谈这件事。
        - id: ch05-b06
          speaker: jimmy
          text: >-
            啊，那太棒了！他到底说了些什么？
        - id: ch05-b07
          speaker: lord_yalding
          text: >-
            他说：“勋爵阁下，您这座祖传老宅是一等品，简直登峰造极。屋内奢华得像宫殿，庭园美得不亚于伊甸园。依我看，建造时绝没有吝惜钱财。您的祖先全是做事彻底的人，他们把一切都安排得妥妥当当，连最小的细节也没漏。我喜欢您的织锦，喜欢您的橡木，也喜欢您的秘密楼梯。不过我认为，您的祖先把这些做好以后，就该知足收手。”我告诉他，据我所知，他们的确收手了。
        - id: ch05-b08
          speaker: lord_yalding
          text: >-
            可他摇头，又说：“不，先生。您的祖先夜里出来散步时，喜欢把脑袋夹在胳膊下面。鬼要只是叹气、飘过去，或者窸窸窣窣响一响，我还受得了。我不但会感谢您，也愿意把它算进租金。可一个鬼让子弹从身体里穿过去，自己还咧着嘴站在那里，脖子光秃秃的，一颗松脱的脑袋就夹在胳膊下。旁边床上的小男孩又尖叫又昏倒。这可绝对不行！要是这就是英国世袭贵族家的高级祖传鬼魂，那还是饶了我吧！”说完，他就搭最早一班火车匆匆离开了城堡。
        - id: ch05-b09
          speaker: jimmy
          text: >-
            这个……我真的很抱歉。而且我觉得我们并没有真的昏过去，至少我一点也不觉得自己昏过。可我们原先以为，这种鬼恰好就是您和他想要的。也许以后还会有别人来租城堡。
          emotion: sad
        - id: ch05-b10
          speaker: lord_yalding
          text: >-
            我不认识别的有钱人，能付得起这里的租金。康韦先生还比自己原定的日期早来了一天，要不然你们根本碰不到他，也就不可能拿他试验魔法。我不知道你们究竟怎么办到的，也不想知道。这场玩笑实在有些愚蠢。
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: >-
            一阵阴沉的沉默落下来。亚尔丁勋爵没有再说话，吉米也找不到话来安慰他。两人站在长长的画廊中，只听见窗外的雨还在不停敲打高高的玻璃。就在这一片灰暗里，一个新念头忽然亮起，也照亮了吉米那张圆圆的脸。他觉得自己终于又找到了真正能帮上忙的办法。
        - id: ch05-b12
          speaker: jimmy
          text: >-
            我说，您要是真的缺钱，为什么不把自己那些珠宝卖掉呢？
        - id: ch05-b13
          speaker: lord_yalding
          text: >-
            我根本没有珠宝，你这个爱管闲事的小笨蛋。
          emotion: angry
        - id: ch05-b14
          speaker: jimmy
          text: >-
            我说的是那间有墙板的屋子。就是天花板上画着星星，四面墙里藏着秘密架子的那一间。那里面不是有好多珠宝吗？
        - id: ch05-b15
          speaker: lord_yalding
          text: >-
            那里没有。要是这又是什么戒指胡话，我劝你小心些。我已经受够了。
          emotion: angry
        - id: ch05-b16
          speaker: jimmy
          text: >-
            这不是戒指胡话。那间屋里明明摆着一层又一层的架子，架子上全是漂亮的传家珠宝。您可以把它们卖掉，有了钱以后就能……
        - id: ch05-b17
          speaker: mademoiselle
          text: >-
            哦，不行！千万别卖传家珠宝！
          emotion: surprised
        - id: ch05-b18
          speaker: narrator
          text: >-
            法国女教师恰在这时出现在画廊门口。她站在那里，衣着神态都华贵极了，活像一幅描绘公爵夫人的彩色石版画。亚尔丁勋爵一看见她，立刻朝她走去。
        - id: ch05-b19
          speaker: lord_yalding
          text: >-
            那里根本没有什么珠宝，我的小姐。我一直等着你，还以为你永远不会来了。
        - id: ch05-b20
          speaker: princess
          text: >-
            哦，真的没有珠宝吗？您只管跟我们过来，亲眼看看就知道了。
        - id: ch05-b21
          speaker: mademoiselle
          text: >-
            那我们就跟他们去看看吧，看看孩子们究竟想给我们展示什么。就算没有珠宝，至少也一定会很有趣。
        - id: ch05-b22
          speaker: jimmy
          text: >-
            那里确实很有趣，我可以保证。
        - id: ch05-b23
          speaker: narrator
          text: >-
            亚尔丁勋爵起初站着没动，法国女教师便说，就算那里什么也没有，去看看孩子们究竟想展示什么，至少也会很有趣。吉米立刻保证，那里确实很有趣。于是众人一起出发，去看那间据说根本不存在珠宝的珠宝室。梅布尔与吉米走在前面带路。法国女教师和亚尔丁勋爵落在后面，两个人手牵着手，慢慢跟着孩子们。
        - id: ch05-b24
          speaker: lord_yalding
          text: >-
            还是手拉着手走更安全。这些孩子一旦在附近自由活动，谁也猜不到下一刻又会发生什么事。
