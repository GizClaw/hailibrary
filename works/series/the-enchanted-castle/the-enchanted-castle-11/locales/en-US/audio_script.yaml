  chapters:
    - id: ch01
      title: CHAPTER XI
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was show-day at Yalding Castle. The children went to visit Mabel and, as Gerald said, mix with the crowd without anyone guessing what they knew. They could enjoy knowing about the sliding panels, the magic ring, and the statues that came alive, while all the visitors knew nothing. That is one of the pleasant things about magic. It gives you secrets other people would never believe, even if you told them.
        - id: ch01-b02
          speaker: narrator
          text: Outside the gates, the white road was spotted with brakes, wagonettes, and dogcarts. Three or four motorcars stood puffing heavily where they had stopped. Bicycles sprawled in heaps in a grassy hollow beside the red brick wall. Some visitors had arrived in the carriages, carts, motors, and bicycles. Others had walked there on their own feet. Now they were scattered across the grounds or being shown through the parts of the castle that opened to the public on this one day each week. More had come than usual. Word had spread that Lord Yalding was there and the covers would come off the state furniture for a rich American who might rent the castle and live in it.
        - id: ch01-b03
          speaker: narrator
          text: The place looked splendid. Brown covers no longer hid the embroidered satin, gilded leather, and tapestry chairs, so the rooms felt lived in again. Flowering plants and pots of roses stood on tables and window ledges. Mabel's aunt was proud of her taste. She had learned flower arranging from a magazine series called “How to Make Home High-class on Nine-pence a Week.”
        - id: ch01-b04
          speaker: narrator
          text: The great crystal chandeliers had been freed from their bags and shone gray and purple. The state beds had lost their brown sheets, and the red ropes that usually kept ordinary visitors back were rolled away.
        - id: ch01-b05
          speaker: grocers_daughter
          text: It feels just as if we've come to call on the family.
        - id: ch01-b06
          speaker: drapers_assistant
          text: If the Yankee won't take it, how about you and me moving in when we're married?
        - id: ch01-b07
          speaker: sweetheart
          text: Oh, Reggie! How can you? You are funny.
        - id: ch01-b08
          speaker: narrator
          text: All afternoon, the holiday crowd streamed again and again through the dark hall, the grand drawing rooms, the boudoirs, and the picture galleries. Their pink blouses, pale suits, flowery hats, and extraordinary scarves filled every room. Their talk quieted to something like a hush when they entered the calm, stately bedchambers. Men had been born in those rooms, and men had died there. Royal guests had slept there on summer nights long ago, with great bunches of elderflowers set on the hearth to guard them from fever and evil spells.
        - id: ch01-b09
          speaker: narrator
          text: Long ago, ladies in ruffs had stood on the terrace and breathed the scent of sweetbrier and southernwood from the flower beds below. Later ladies, bright with powder, rouge, and brocade, had crossed it in the wide swing of their hoop skirts. Now brown boots and high heels tapped over the stones. Loud laughter and chattering voices filled the air, but they said nothing the children wanted to hear. To the children, those visitors spoiled the quiet castle and disturbed the peace of the enchanted garden.
        - id: ch01-b10
          speaker: gerald
          text: This isn't much fun after all. I hate watching all these people tramp through our garden.
        - id: ch01-b11
          speaker: narrator
          text: From the window of the stone summerhouse at the terrace end, they watched the bright clothes and listened to the laughter. Mabel sat down on the stone floor.
        - id: ch01-b12
          speaker: princess
          text: I told that nice bailiff the same thing this morning. He said letting them in once a week wasn't much. He thinks Lord Yalding ought to open the place whenever people like, and says he would if he lived here.
        - id: ch01-b13
          speaker: jimmy
          text: Much he knows! What else did he say?
        - id: ch01-b14
          speaker: princess
          text: Lots. I like him, and I told him something interesting.
        - id: ch01-b15
          speaker: gerald
          text: You didn't tell him!
        - id: ch01-b16
          speaker: princess
          text: I did. I told him plenty about our adventures. The humble bailiff is a beautiful listener.
        - id: ch01-b17
          speaker: gerald
          text: My dear Mabel, if you let your tongue run away with you, they'll lock us up as beautiful lunatics.
        - id: ch01-b18
          speaker: princess
          text: They won't. I told it the way you can tell every true word and still make nobody believe it. When I finished, he said I had real literary talent. I promised to put his name at the front of the first book I write when I grow up.
        - id: ch01-b19
          speaker: kathleen
          text: You don't even know his name. Let's do something with the ring.
        - id: ch01-b20
          speaker: gerald
          text: Impossible. I forgot to tell you. When I went back for my garters, I met Mademoiselle. She's coming here to meet us and walk home with us.
        - id: ch01-b21
          speaker: jimmy
          text: What did you tell her?
        - id: ch01-b22
          speaker: gerald
          text: I said it was very kind of her. And it was. We may not want her, but that doesn't make her coming unkind.
        - id: ch01-b23
          speaker: princess
          text: It may be kind, but it's sickening too. Now we'll have to wait here, and I promised to meet the bailiff. He's bringing a basket so we can have a picnic tea.
        - id: ch01-b24
          speaker: jimmy
          text: Where are you meeting him?
        - id: ch01-b25
          speaker: princess
          text: Past the dinosaurus. He'll tell me about all the anteddy-something creatures. That means before Noah's Ark. There are lots besides the dinosaurus. In return, I'm to tell him more of my agreeable fictions. That's what he called them.
        - id: ch01-b26
          speaker: kathleen
          text: When is the picnic?
        - id: ch01-b27
          speaker: princess
          text: As soon as the gates close, at five.
        - id: ch01-b28
          speaker: gerald
          text: We could take Mademoiselle with us.
        - id: ch01-b29
          speaker: kathleen
          text: She may be too proud to take tea with a bailiff. You never know how grown-ups will react to the simplest thing.
        - id: ch01-b30
          speaker: gerald
          text: Then here's the plan. You three go and meet your bailiff. A picnic is a picnic. I'll stay and wait for Mademoiselle.
        - id: ch01-b31
          speaker: princess
          text: That's jolly decent of you, Gerald!
          emotion: happy
        - id: ch01-b32
          speaker: gerald
          text: Oh, that's nonsense.
        - id: ch01-b33
          speaker: jimmy
          text: Gerald rather likes sucking up to people.
        - id: ch01-b34
          speaker: gerald
          text: Little boys don't understand diplomacy. Sucking up is simply silly. Still, it's better to be good than pretty.
        - id: ch01-b35
          speaker: jimmy
          text: How do you know?
        - id: ch01-b36
          speaker: gerald
          text: And you never know when a grown-up may be useful. Besides, they enjoy these little pleasures. Think how awful it must be to be old. Good heavens!
        - id: ch01-b37
          speaker: kathleen
          text: I hope I don't become an old maid.
        - id: ch01-b38
          speaker: princess
          text: I won't. I'd sooner marry a traveling tinker.
        - id: ch01-b39
          speaker: kathleen
          text: Marrying the Gypsy King might be rather nice. You could travel in a caravan, tell fortunes, and have baskets and brooms hanging all around it.
        - id: ch01-b40
          speaker: princess
          text: If I had my choice, I'd marry a brigand. I'd live in his mountain fortress, be kind to his captives, and help them escape whenever I could.
        - id: ch01-b41
          speaker: gerald
          text: You'd be a real treasure to your husband.
        - id: ch01-b42
          speaker: kathleen
          text: A sailor would be nice too. You'd watch and wait for his ship to come home. You'd put a lamp in the attic window to guide him through the storm. Then, when he drowned at sea, you'd be terribly sorry, and every day you'd go and lay flowers on his daisy-covered grave.
        - id: ch01-b43
          speaker: princess
          text: Or a soldier! You'd follow him to war in short skirts and a cocked hat, with a barrel around your neck like a Saint Bernard. Auntie has a song with a picture of a soldier's wife. It's called “The Veevandyear.”
        - id: ch01-b44
          speaker: kathleen
          text: Let me tell you what I shall do when I marry.
        - id: ch01-b45
          speaker: gerald
          text: When I marry, I'll choose a girl who can't talk. Or I'll use the ring so she can only speak when someone speaks to her. Let's see what's happening outside.
        - id: ch01-b46
          speaker: narrator
          text: He put one eye to the stone lattice.
        - id: ch01-b47
          speaker: gerald
          text: They're moving off now. The pink and purple hats are bobbing away into the distance. That funny little man with a goat beard has gone a different way from everyone else, so the gardeners will have to turn him around. I still can't see Mademoiselle. You three had better run. Never take a risk where a picnic is concerned. The abandoned hero of our tale, alone and unsupported, urged his brave followers to pursue the supply wagons. He himself remained at the post of danger and difficulty, because he was born to stand on burning decks after everyone else had fled, and to lead hopeless charges when all humanity despaired!
        - id: ch01-b48
          speaker: princess
          text: I think I'll marry a husband who can't talk. And when I write my books, there won't be any heroes in them. Only a heroine. Come on, Cathy.
        - id: ch01-b49
          speaker: narrator
          text: They stepped from the cool, shady summerhouse into sunshine that felt like an oven. The terrace stones burned under their feet.
        - id: ch01-b50
          speaker: jimmy
          text: Now I know how a cat feels on hot bricks.
        - id: ch01-b51
          speaker: narrator
          text: The ancient stone animals stood in a beech wood on a slope at least half a mile across the park from the castle. Lord Yalding's grandfather had placed them there in the middle of the last century. Those were the great days of the late Prince Albert, the Exhibition of 1851, Sir Joseph Paxton, and the Crystal Palace. Long before the children reached the wood, they could see gray shapes between the trees. There were stone flanks, broad clumsy wings, and patterned backs like the backs of crocodiles.
        - id: ch01-b52
          speaker: narrator
          text: Most people think noon is the hottest part of the day, but they are wrong. Under a cloudless sky, the heat keeps building all afternoon and reaches its very worst at five. Surely you have noticed it when you are walking somewhere for tea in your best clothes. You notice it especially when those clothes are stiff with starch and the walk is long, with no shade anywhere along the way.
        - id: ch01-b53
          speaker: narrator
          text: Kathleen, Mabel, and Jimmy grew hotter with every step. The hotter they became, the more slowly they walked. Discomfort was turning into resentment, and they had nearly reached that miserable point when everyone wishes they had never come. Then, just below the edge of the beech wood, they saw the bailiff waving a white handkerchief.
        - id: ch01-b54
          speaker: narrator
          text: That white signal promised tea, shade, and a place to sit. They found fresh strength, hurried on, and finished with a desperate run into the copper-colored leaves and among the bare gray-green roots of the beeches.
        - id: ch01-b55
          speaker: jimmy
          text: Oh, this is glorious!
        - id: ch01-b56
          speaker: narrator
          text: Jimmy threw himself down, then remembered his manners.
        - id: ch01-b57
          speaker: jimmy
          text: How do you do?
        - id: ch01-b58
          speaker: narrator
          text: The girls thought the bailiff looked very fine. Instead of his usual velveteen, he wore a gray flannel suit that would have been good enough for an earl. His straw hat would have done no discredit to a duke, and no prince could have worn a prettier green tie. He welcomed all three children warmly. Among the fallen beech leaves sat two baskets. They looked heavy, and full of promise.
        - id: ch01-b59
          speaker: narrator
          text: He had tact. The children had dreaded a hot and improving tour of the stone animals more with every step. He never mentioned it.
        - id: ch01-b60
          speaker: lord_yalding
          text: You must be as dry as the desert. Once you've finished being thirsty, you'll be hungry too. I put the kettle on the moment I spotted my fair storyteller in the far distance.
        - id: ch01-b61
          speaker: narrator
          text: The kettle puffed and bubbled by way of introduction. It sat on a spirit lamp in a hollow between two gray roots.
        - id: ch01-b62
          speaker: lord_yalding
          text: Why don't you take off your shoes and stockings? There's a tiny little canal just over the ridge.
        - id: ch01-b63
          speaker: narrator
          text: He said it as casually as one old lady asking another to remove her bonnet. The pleasure of cooling hot feet in running water after a long walk has never been properly described. The narrator could fill pages with it, and with memories of a childhood millstream. Little fish swam there. Fallen leaves spun in the current, while willows and alders leaned over the water and kept it cool. But this is not the story of the narrator's life.
        - id: ch01-b64
          speaker: narrator
          text: The children came back on rested, damp, pink feet. By then, the tea had been made and poured. It was delicious, and they could have as much milk as they wanted from a screw-top beer bottle. There were cakes, gingerbread, and plums. Best of all, there was a great melon with a lump of ice hidden in its heart. It was a feast fit for the gods.
        - id: ch01-b65
          speaker: narrator
          text: Jimmy seemed to have the same thought. He lifted his face from a broad crescent bitten out of the melon rind.
        - id: ch01-b66
          speaker: jimmy
          text: Your feast is almost as good as the feast of the Immortals.
        - id: ch01-b67
          speaker: lord_yalding
          text: Kindly explain that mysterious remark.
        - id: ch01-b68
          speaker: narrator
          text: Jimmy understood him to mean, “What are you talking about?” So he told the whole story of the wonderful night when the statues came alive and marble hands picked a magnificent, unearthly banquet from the trees on the island.
        - id: ch01-b69
          speaker: lord_yalding
          text: Did you find all that in a book?
        - id: ch01-b70
          speaker: jimmy
          text: No. It happened.
        - id: ch01-b71
          speaker: lord_yalding
          text: You children are a wonderfully imaginative set of dreamers, aren't you?
        - id: ch01-b72
          speaker: narrator
          text: He passed the plums to Kathleen. She smiled in a friendly but embarrassed way. Why couldn't Jimmy keep quiet?
        - id: ch01-b73
          speaker: jimmy
          text: We're not dreamers. Everything I told you really happened, and so did everything Mabel told you.
        - id: ch01-b74
          speaker: narrator
          text: The bailiff looked uncomfortable.
        - id: ch01-b75
          speaker: lord_yalding
          text: All right, old fellow.
        - id: ch01-b76
          speaker: narrator
          text: An uneasy silence followed. But Jimmy had taken hold of the argument and would not let go.
        - id: ch01-b77
          speaker: jimmy
          text: Well? Do you believe me or don't you?
        - id: ch01-b78
          speaker: kathleen
          text: Jimmy, don't be silly!
        - id: ch01-b79
          speaker: jimmy
          text: If you don't believe me, I'll make you believe.
        - id: ch01-b80
          speakers: [princess, kathleen]
          ensemble: duo
          text: Don't do that!
          emotion: fearful
        - id: ch01-b81
          speaker: narrator
          text: Jimmy lay on his stomach with his chin in his hands. His elbows rested on a cushion of moss, and his bare legs kicked among the beech leaves.
        - id: ch01-b82
          speaker: jimmy
          text: Do you believe it or not?
        - id: ch01-b83
          speaker: lord_yalding
          text: I think you tell adventures remarkably well.
        - id: ch01-b84
          speaker: jimmy
          text: Very well. You don't believe me. Cathy, stop fussing. He's a gentleman, even if he is a bailiff.
        - id: ch01-b85
          speaker: lord_yalding
          text: Thank you for saying so!
        - id: ch01-b86
          speaker: jimmy
          text: You won't tell anyone, will you?
        - id: ch01-b87
          speaker: lord_yalding
          text: Tell them what?
        - id: ch01-b88
          speaker: jimmy
          text: Anything at all.
        - id: ch01-b89
          speaker: lord_yalding
          text: Certainly not. As you said, I am the soul of honor.
        - id: ch01-b90
          speaker: jimmy
          text: Then give me the ring, Cathy.
        - id: ch01-b91
          speakers: [princess, kathleen]
          ensemble: duo
          text: Oh no, you mustn't!
        - id: ch01-b92
          speaker: narrator
          text: Kathleen had no intention of giving it up. Mabel did not want her to, and Jimmy never used force. Yet a moment later, the ring was in his hand. This was Jimmy's hour. Sometimes, a person says a thing will happen, and somehow it does.
        - id: ch01-b93
          speaker: jimmy
          text: This is the ring Mabel told you about. I say it's a wishing ring. Put it on, make a wish, and your wish will come true.
        - id: ch01-b94
          speaker: lord_yalding
          text: Do I have to say the wish aloud?
        - id: ch01-b95
          speaker: jimmy
          text: Yes. I think you do.
        - id: ch01-b96
          speaker: kathleen
          text: Don't waste it on anything silly, like fine weather on Tuesday or your favorite pudding tomorrow. Wish for something you truly want.
        - id: ch01-b97
          speaker: lord_yalding
          text: I will. I'll wish for the only thing I truly want. I wish my—I wish my friend were here.
        - id: ch01-b98
          speaker: narrator
          text: The three children who knew the ring's power looked around at once. They expected the bailiff's friend to appear in front of them. That friend would surely be surprised and perhaps frightened, so they all rose and stood ready to soothe and reassure him. But no startled gentleman appeared in the wood. Instead, Mademoiselle and Gerald came quietly toward them through the patches of sun and shade beneath the beeches. Mademoiselle wore a white dress and looked as pretty as a picture. Gerald looked hot and very polite.
        - id: ch01-b99
          speaker: gerald
          text: Good afternoon. I persuaded Mademoiselle to come with me.
        - id: ch01-b100
          speaker: narrator
          text: That was all he managed to say. The bailiff and the French governess were staring into each other's eyes. They looked like weary travelers who had unexpectedly reached the place they had been seeking at the end of a very long journey. The children watched them and understood that even if anyone spoke, it would make no difference at all.
        - id: ch01-b101
          speaker: lord_yalding
          text: It really is you!
          emotion: surprised
        - id: ch01-b102
          speaker: mademoiselle
          text: Mais... c'est donc vous.
          emotion: surprised
        - id: ch01-b103
          speaker: narrator
          text: Her voice caught in her throat. They stood without moving and looked at each other for a long time. Jimmy later said they looked like stuck pigs.
        - id: ch01-b104
          speaker: jimmy
          text: Is she your friend?
        - id: ch01-b105
          speaker: lord_yalding
          text: Yes. Oh, yes. You are my friend, aren't you?
        - id: ch01-b106
          speaker: mademoiselle
          text: But yes. I am your friend.
          emotion: happy
        - id: ch01-b107
          speaker: jimmy
          text: There! You see? The ring works exactly as I said.
        - id: ch01-b108
          speaker: lord_yalding
          text: We needn't argue over that. You may call it the ring. To me, it's a coincidence, the happiest and dearest coincidence imaginable.
          emotion: happy
        - id: ch01-b109
          speaker: mademoiselle
          text: Then you still want to marry me?
        - id: ch01-b110
          speaker: lord_yalding
          text: Of course. Jimmy, give your brother some tea. Mademoiselle, walk with me in the woods. We have a thousand things to say.
        - id: ch01-b111
          speaker: mademoiselle
          text: Eat, my Gerald. I shall return at the proper hour, and we will go back together. We must speak to each other. It is so long since Lord Yalding and I have met!
        - id: ch01-b112
          speaker: narrator
          text: She suddenly looked young, almost like a fairy princess. Her white gown and his gray flannels disappeared between the beech trunks. The children sat in stunned silence until Jimmy broke it.
        - id: ch01-b113
          speaker: jimmy
          text: So he was Lord Yalding all along! Pretending to be a landscape painter or something. Silly, I call it. And she was his friend, and he wished her here. Quite different from our wishes, eh? Good old ring!
        - id: ch01-b114
          speaker: princess
          text: His friend? Can't you see she's his sweetheart? She's the lady who was shut up in a convent because he was poor and couldn't find her. Now the ring has brought them together to live happily ever after. I'm glad. Aren't you, Cathy?
        - id: ch01-b115
          speaker: kathleen
          text: Of course! It's every bit as good as marrying a sailor or a bandit.
        - id: ch01-b116
          speaker: jimmy
          text: The ring did it. If the American rents the castle, he'll pay heaps of money, and they can live on that.
        - id: ch01-b117
          speaker: princess
          text: I wonder whether they'll marry tomorrow!
        - id: ch01-b118
          speaker: kathleen
          text: Wouldn't it be fun if we were bridesmaids?
        - id: ch01-b119
          speaker: gerald
          text: Could someone pass the melon? Thank you. Why didn't we know he was Lord Yalding? We were blind as moles!
        - id: ch01-b120
          speaker: princess
          text: I've known since last night. I promised not to tell. I can keep a secret, can't I?
        - id: ch01-b121
          speaker: kathleen
          text: You keep secrets far too well.
        - id: ch01-b122
          speaker: jimmy
          text: He was disguised as a bailiff. That's why we didn't know him.
        - id: ch01-b123
          speaker: gerald
          text: Disguised, fiddlesticks! I've discovered something Sherlock Holmes never saw, and that idiot Watson didn't either. The best disguise is to dress as what you really are. I'll remember that.
        - id: ch01-b124
          speaker: kathleen
          text: It's like Mabel telling the truth so that nobody believes her.
        - id: ch01-b125
          speaker: princess
          text: I think Mademoiselle is jolly lucky.
        - id: ch01-b126
          speaker: gerald
          text: She's not bad. He could have done worse. Pass the plums, please.
        - id: ch01-b127
          speaker: narrator
          text: Magic was plainly at work. The next morning, Mademoiselle seemed to be a changed governess. Her cheeks had turned pink, her lips were red, and her eyes looked larger and brighter than before. She had arranged her hair in a completely new way. For a governess, the style was rather daring, but it suited her beautifully.
        - id: ch01-b128
          speaker: eliza
          text: Mamselle's coming out!
        - id: ch01-b129
          speaker: narrator
          text: Just after breakfast, Lord Yalding arrived in a wagonette covered with smart blue cloth. Two horses drew it. Their own coats were brown and shining, and fitted them even better than the blue cloth fitted the carriage. The whole party climbed in and rode to Yalding Towers in a state of great splendor.
        - id: ch01-b130
          speaker: narrator
          text: When they arrived, the children all begged for permission to explore the castle from top to bottom. They had never before been able to examine it properly. Lord Yalding seemed a little distracted, but he agreed quite pleasantly. Mabel led the others from place to place and showed them every secret door, unlikely passage, and hidden stair she had discovered. It was a glorious morning for exploring.
        - id: ch01-b131
          speaker: narrator
          text: Lord Yalding and Mademoiselle went through the house as well, though they did it in a rather halfhearted way. They soon decided they were tired of looking. They went through the French windows of the drawing room, crossed the rose garden, and found the curved stone seat in the center of the maze. They sat in the very place where, at the beginning of all the adventures, Gerald, Kathleen, and Jimmy had found the sleeping Princess dressed in pink silk and diamonds.
        - id: ch01-b132
          speaker: narrator
          text: With the two grown-ups gone, the castle seemed to have more room and freedom in it. The children explored with even more enthusiasm than travelers setting out for the Arctic. At last, they came out of a little shaky secret staircase. It ran from the powdering room in the grand state suite down to the gallery above the hall. The moment they emerged, they found themselves face to face with the odd little goat-bearded man who had taken the wrong path the day before.
        - id: ch01-b133
          speaker: princess
          text: This part of the castle is private.
        - id: ch01-b134
          speaker: narrator
          text: Mabel spoke quickly and shut the secret door behind her.
        - id: ch01-b135
          speaker: conway
          text: I know it is. The Earl of Yalding gave me permission to inspect the house at my leisure.
        - id: ch01-b136
          speaker: princess
          text: Oh! I beg your pardon. We all do. We didn't know.
        - id: ch01-b137
          speaker: conway
          text: Am I right in thinking you are relatives of his lordship?
        - id: ch01-b138
          speaker: gerald
          text: Not exactly. We're friends.
        - id: ch01-b139
          speaker: narrator
          text: The gentleman was thin and very neatly dressed. His face was brown and dry, and his small eyes were merry.
        - id: ch01-b140
          speaker: conway
          text: I suppose you're playing some sort of game?
        - id: ch01-b141
          speaker: gerald
          text: No, sir. We're only exploring.
        - id: ch01-b142
          speaker: conway
          text: Would you allow a stranger to join your exploring expedition?
        - id: ch01-b143
          speaker: narrator
          text: He gave them a narrow but kindly smile. The children exchanged looks.
        - id: ch01-b144
          speaker: gerald
          text: You see, it's rather hard to explain. But you understand what I mean, don't you?
        - id: ch01-b145
          speaker: jimmy
          text: He means we can't let you join until we know why you want to explore.
        - id: ch01-b146
          speaker: princess
          text: Are you taking photographs? Or did a newspaper send you to write about the Towers?
        - id: ch01-b147
          speaker: conway
          text: I understand your concern. I am neither a photographer nor a newspaper correspondent. I have independent means, and I am traveling through this country in search of a house to rent. My name is Jefferson D. Conway.
        - id: ch01-b148
          speaker: princess
          text: Oh! Then you're the American millionaire.
        - id: ch01-b149
          speaker: conway
          text: I don't care for that description, young lady. I am an American citizen, and I have sufficient means. This is a fine property, a very fine property. If it were for sale, I would be interested.
        - id: ch01-b150
          speaker: princess
          text: It isn't, and it can't be. The lawyers have tied it up, so Lord Yalding can't sell it. But you could live here and pay him a properly millionairish rent. Then he could marry the French governess.
        - id: ch01-b151
          speakers: [kathleen, conway]
          ensemble: duo
          text: Please, don't say that!
        - id: ch01-b152
          speaker: conway
          text: Lead on, please. I suggest we make the exploration thorough and complete.
        - id: ch01-b153
          speaker: narrator
          text: With that encouragement, Mabel took charge and led the millionaire through every part of the castle. Room after room seemed to please him, yet there was disappointment mixed with his pleasure. When the long tour was finished, they returned to the exact place from which they had started.
        - id: ch01-b154
          speaker: conway
          text: It is a fine mansion. Still, in a house of this size, I would expect a secret stair, a priest's hiding place, or perhaps a ghost.
        - id: ch01-b155
          speaker: princess
          text: We have those. But I thought Americans believed only in machines and newspapers.
        - id: ch01-b156
          speaker: narrator
          text: She reached behind her and pressed the hidden spring. The panel opened, revealing the little tottering staircase. One glimpse of it completely transformed the American. His disappointment vanished. He became eager, alert, and intensely interested. He followed the stair and stood in the secret doorway leading from the powdering room into the state bedchamber. There he cried out again and again.
        - id: ch01-b157
          speaker: conway
          text: Say! This is great. This is really great!
          emotion: happy
        - id: ch01-b158
          speaker: narrator
          text: Everyone's hopes rose. Surely he would rent the castle for a millionairish sum, and Lord Yalding would become rich enough to marry.
        - id: ch01-b159
          speaker: conway
          text: If this ancestral residence had a ghost, I would make a deal with the Earl of Yalding today. Right here, on the spot.
        - id: ch01-b160
          speaker: princess
          text: Stay until tomorrow and sleep in this room. I expect you'll see the ghost.
        - id: ch01-b161
          speaker: conway
          text: Is there truly a ghost here?
          emotion: happy
        - id: ch01-b162
          speaker: princess
          text: People say old Sir Rupert walks here at night. He lost his head in Henry the Eighth's time, and carries it under his arm. We haven't seen him. But we have seen a lady in a pink dress, with diamonds in her hair. She carries a lighted candle.
        - id: ch01-b163
          speaker: narrator
          text: The other children suddenly understood Mabel's plan. With voices full of honest conviction, they all assured the American that they had seen the lady in pink. He watched them through half-closed, twinkling eyes.
        - id: ch01-b164
          speaker: conway
          text: Then I intend to ask the Earl of Yalding for permission to spend a night in his finest ancestral bedchamber. If I hear one phantom step or a single ghostly sigh, I will rent the place.
        - id: ch01-b165
          speaker: kathleen
          text: I'm so glad!
          emotion: happy
        - id: ch01-b166
          speaker: conway
          text: You seem remarkably certain about this ghost. I should warn you, young people, that I carry a gun. Whenever I see a ghost, I shoot it.
        - id: ch01-b167
          speaker: narrator
          text: He drew a pistol from his hip pocket and gazed at it fondly.
        - id: ch01-b168
          speaker: conway
          text: I am a reasonably good shot. Do you see that large red rose by the open window, the one as broad as a saucer?
        - id: ch01-b169
          speaker: narrator
          text: They all looked and saw it. In the next moment, a loud shot broke the stillness of the room. The great rose burst apart. Its red petals fell across the stone balustrade and scattered over the terrace below. The American lowered the pistol and looked slowly from one child to the next. Every one of their faces had gone perfectly white.
        - id: ch01-b170
          speaker: conway
          text: Jefferson D. Conway earned his fortune by attending closely to business and keeping his eyes open. Thank you for your kindness.
        - id: ch01-b171
          speaker: jimmy
          text: Just think, Mabel. If you'd played the ghost, he might have shot you! That would have been an adventure, wouldn't it?
        - id: ch01-b172
          speaker: princess
          text: I'm still going to do it. Let's find Lord Yalding and get the ring back.
        - id: ch01-b173
          speaker: narrator
          text: Lord Yalding had been having a private talk with Mabel's aunt. Meanwhile, lunch for six had been laid in the great dark hall, surrounded by suits of armor and heavy oak furniture. It was a beautiful meal, and every dish was made of silver. Mademoiselle seemed younger with every passing minute and more and more like a princess. Tears filled her eyes when Gerald rose from his place, lifted his glass of lemonade, and offered a toast.
        - id: ch01-b174
          speaker: gerald
          text: I propose a toast to Lord and Lady Yalding!
        - id: ch01-b175
          speaker: narrator
          text: Lord Yalding replied with a speech full of pleasant jokes. Gerald judged that the moment had come.
        - id: ch01-b176
          speaker: gerald
          text: About the ring. You don't believe in it, but we do. May we have it back?
        - id: ch01-b177
          speaker: narrator
          text: They got it. The four children hurried to the paneled jewel room and held a quick council.
        - id: ch01-b178
          speaker: princess
          text: This is a wishing ring, and I wish every weapon the American owns were here.
        - id: ch01-b179
          speaker: narrator
          text: At once, the room filled with a tangled mass of weapons that reached six feet up the walls. Swords and spears crossed one another. Arrows and tomahawks stuck out between fowling pieces and blunderbusses. There were pistols, revolvers, scimitars, krises, and almost every other weapon anyone could imagine. The four children were wedged tightly into the heap. Surrounded on every side by all those instruments of death, they hardly dared to move or even breathe.
        - id: ch01-b180
          speaker: gerald
          text: He must collect weapons. Those arrows may even be poisoned. Mabel, please wish them back where they came from, and then try again.
        - id: ch01-b181
          speaker: narrator
          text: Mabel wished them away. In a moment, the children stood unharmed in the empty paneled room.
        - id: ch01-b182
          speaker: princess
          text: No, I can't bear that again. We'll make the ghost another way. I wish the American would think he sees a ghost when he goes to bed. Sir Rupert carrying his head will do.
        - id: ch01-b183
          speaker: jimmy
          text: Is he sleeping here tonight?
        - id: ch01-b184
          speaker: princess
          text: I don't know. Then I wish he would see Sir Rupert every night. That will settle it.
        - id: ch01-b185
          speaker: gerald
          text: That's rather dull. We won't know whether he sees Sir Rupert.
        - id: ch01-b186
          speaker: princess
          text: We'll know in the morning, when he rents the castle.
        - id: ch01-b187
          speaker: narrator
          text: With that settled, Mabel's aunt decided she wanted Mabel with her. The other children went home.
        - id: ch01-b188
          speaker: narrator
          text: During supper, Lord Yalding appeared unexpectedly.
        - id: ch01-b189
          speaker: lord_yalding
          text: Mr. Jefferson Conway wants you boys to spend the night with him in the state bedchamber. I've had beds brought in for you. You don't object, do you? He seems to think you have some plan to play ghostly tricks on him.
        - id: ch01-b190
          speaker: narrator
          text: Refusing Lord Yalding's request was difficult. In fact, the boys found it impossible. At ten o'clock that night, Gerald and Jimmy each lay in a narrow white bed in the state bedchamber. Their little beds looked absurdly small beneath the high ceiling and among the deep shadows. Across from them towered the great, thin four-poster. It was hung with tapestry and crowned with dark plumes that looked as if they belonged at a funeral.
        - id: ch01-b191
          speaker: jimmy
          text: I do hope there isn't a real ghost.
          emotion: fearful
        - id: ch01-b192
          speaker: gerald
          text: There won't be.
        - id: ch01-b193
          speaker: jimmy
          text: But I don't want to see Sir Rupert with his head under his arm.
          emotion: fearful
        - id: ch01-b194
          speaker: gerald
          text: You won't. At worst, you'll see the millionaire seeing him. Mabel wished for the ghost to appear to him, not to us. You'll probably sleep all night and see nothing. Close your eyes, count to a million, and don't be a goat.
        - id: ch01-b195
          speaker: narrator
          text: Once Mabel learned from her dull-haired aunt that Mr. Conway truly was sleeping at the castle that night, she had added another wish. Sir Rupert and his head must appear that very night in the state bedchamber.
        - id: ch01-b196
          speaker: narrator
          text: Jimmy closed his eyes and began counting to a million. He fell asleep long before he reached it. Gerald fell asleep too.
        - id: ch01-b197
          speaker: narrator
          text: They woke to the loud, echoing bang of a pistol. In that first confused instant, each boy remembered the shot fired that morning. They opened their eyes expecting to see the sunlit terrace again, with shattered red rose petals lying over warm white stone.
        - id: ch01-b198
          speaker: narrator
          text: Instead, they saw the vast, dark state bedchamber. Only six tall candles lit the room, and their light barely pushed back the darkness. The American stood in the middle of it in his shirt and trousers. A smoking pistol was still raised in his hand. From the door of the powdering room, another figure advanced. It wore a doublet and hose, with a stiff ruff around its neck. Above that ruff, there was no head at all.
        - id: ch01-b199
          speaker: narrator
          text: The missing head was there after all. The figure carried it under its right arm, held close against the slashed velvet sleeve of the doublet. The face that looked out from beneath the arm wore a pleasant smile. Both boys screamed. The American fired once more. His bullet passed straight through Sir Rupert, who continued to advance without seeming to notice it.
        - id: ch01-b200
          speaker: narrator
          text: Suddenly, every light went out. The next thing the boys knew, morning had come. Flat gray daylight filled the tall windows, rain beat wildly on the glass, and the American had vanished.
        - id: ch01-b201
          speaker: jimmy
          text: Where are we? Oh, I remember. Ugh, that was horrible. I've had about enough of that ring, and I don't mind admitting it.
        - id: ch01-b202
          speaker: gerald
          text: Nonsense. I enjoyed it. I wasn't frightened at all. Were you?
        - id: ch01-b203
          speaker: jimmy
          text: No. Of course I wasn't.
        - id: ch01-b204
          speaker: narrator
          text: Later they heard that the American had eaten an early breakfast with Lord Yalding and caught the first train to London.
        - id: ch01-b205
          speaker: gerald
          text: We've done it! He's gone to give up his other house and rent this one. At last the old ring is doing something useful.
        - id: ch01-b206
          speaker: narrator
          text: Jimmy met Lord Yalding afterward in the picture gallery.
        - id: ch01-b207
          speaker: jimmy
          text: Perhaps you'll believe in the ring now. Mr. Conway saw the ghost because of us. He said he'd rent the castle if he saw one, so we made certain that he did.
        - id: ch01-b208
          speaker: lord_yalding
          text: Oh, you did, did you? I'm extremely grateful, I'm sure.
        - id: ch01-b209
          speaker: jimmy
          text: Don't mention it. I thought you would be pleased. I thought he would too.
        - id: ch01-b210
          speaker: lord_yalding
          text: Then you may be interested to hear how pleased Mr. Jefferson D. Conway was. He dragged me out of bed at six this morning to discuss your ghost.
        - id: ch01-b211
          speaker: jimmy
          text: Oh, splendid! What did he say?
        - id: ch01-b212
          speaker: lord_yalding
          text: As nearly as I remember, he said, “My lord, your ancestral residence is first-rate. In fact, it is the very limit. The luxury is fit for a palace, and the grounds are nothing less than Eden. No expense has been spared. Your ancestors did everything properly and attended to every detail. I admire the tapestries, the oak, and the secret stairs. But your ancestors should have stopped there and left well enough alone.”
        - id: ch01-b213
          speaker: lord_yalding
          text: I told him that, as far as I knew, they had stopped there. He shook his head. “No, sir,” he said. “Your ancestors walk about at night with their heads under their arms. I could have accepted a ghost that sighed, glided, or rustled. I would even have counted it as part of the rent. But I will not accept a grinning ghost with a bare neck and its head loose under one arm, while bullets pass through it and little boys scream and faint in their beds. If that is a noble British family ghost, you must excuse me.” Then he caught the early train.
        - id: ch01-b214
          speaker: jimmy
          text: I say, I am sorry. And I truly don't think we fainted. We thought it was exactly what you wanted. Perhaps someone else will rent the castle.
          emotion: sad
        - id: ch01-b215
          speaker: lord_yalding
          text: I know no one else who can afford it. Mr. Conway arrived a day earlier than expected, or you would never have met him. I don't know how you managed this, and I don't want to know. It was a rather foolish trick.
        - id: ch01-b216
          speaker: narrator
          text: A gloomy silence followed while rain struck the long windows. Then a new idea lit Jimmy's round face.
        - id: ch01-b217
          speaker: jimmy
          text: If you need money, why don't you sell your jewels?
        - id: ch01-b218
          speaker: lord_yalding
          text: I have no jewels, you interfering young idiot.
          emotion: angry
        - id: ch01-b219
          speaker: narrator
          text: Lord Yalding pulled his hands from his pockets and started to walk away. Jimmy followed.
        - id: ch01-b220
          speaker: jimmy
          text: I mean the jewels in the paneled room with stars painted on the ceiling.
        - id: ch01-b221
          speaker: lord_yalding
          text: There are no jewels there. If this is more nonsense about the ring, be careful, young man. I've had quite enough.
        - id: ch01-b222
          speaker: jimmy
          text: It isn't nonsense. There are shelves and shelves of beautiful family jewels. You could sell them and have all the money you need.
        - id: ch01-b223
          speaker: mademoiselle
          text: Oh, no! You must not sell the family jewels!
          emotion: surprised
        - id: ch01-b224
          speaker: narrator
          text: Mademoiselle stood in the picture-gallery doorway looking like a richly colored portrait of a duchess. Lord Yalding went toward her.
        - id: ch01-b225
          speaker: lord_yalding
          text: There are no family jewels, my lady. I thought you would never come.
        - id: ch01-b226
          speaker: princess
          text: Oh, aren't there? Come with us and see.
        - id: ch01-b227
          speaker: narrator
          text: Mabel had followed Mademoiselle into the gallery, but Lord Yalding still did not move.
        - id: ch01-b228
          speaker: mademoiselle
          text: Let us see what they wish to show us. At least it should be amusing.
        - id: ch01-b229
          speaker: jimmy
          text: It is.
        - id: ch01-b230
          speaker: narrator
          text: So they went. Mabel and Jimmy led the way. Mademoiselle and Lord Yalding followed hand in hand.
        - id: ch01-b231
          speaker: lord_yalding
          text: Holding hands is much safer. With these children loose in the world, no one can guess what will happen next.
