  chapters:
    - id: ch01
      title: CHAPTER III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Anyone who has spent much time with an invisible companion will know how awkward it can be. No matter how certain you are that the person truly cannot be seen, every so often you still think it must be a dream and that you will wake in half a second. Gerald, Kathleen, and Jimmy felt exactly that way. They sat in the white marble Temple of Flora, looking through its arches at the sunny park and listening to the enchanted Princess. She was not really a princess at all. She was Mabel Prowse, the housekeeper's niece. Still, as Jimmy had said, she was certainly enchanted.
        - id: ch01-b02
          speaker: mabel
          text: Talking won't change anything. I never thought the ring would truly work, and now look what has happened.
        - id: ch01-b03
          speaker: narrator
          text: Her voice came from an empty space between two pillars, and she said much the same thing again and again.
        - id: ch01-b04
          speaker: gerald
          text: Is there anything we can actually do for you? If there isn't, we really ought to start home.
        - id: ch01-b05
          speaker: jimmy
          text: Yes. I want my tea.
        - id: ch01-b06
          speaker: mabel
          text: Tea? You would go home for tea and leave me here after you got me into this trouble?
          emotion: angry
        - id: ch01-b07
          speaker: gerald
          text: Well, you are the most unfair princess I have ever met.
        - id: ch01-b08
          speaker: kathleen
          text: Oh, don't tease her. Just think how horrible it must feel to be invisible.
        - id: ch01-b09
          speaker: mabel
          text: My aunt doesn't like me very much already. She wouldn't let me go to the fair because I forgot to put back an old, silly shoe that Queen Elizabeth wore. I took it out of its glass case to try it on.
        - id: ch01-b10
          speaker: kathleen
          text: Did the shoe fit you?
        - id: ch01-b11
          speaker: mabel
          text: Not at all. It was much too small. I don't believe it ever fitted anybody.
        - id: ch01-b12
          speaker: jimmy
          text: I really do want my tea.
        - id: ch01-b13
          speaker: gerald
          text: I honestly think we may have to leave. We can't do anything to help you here.
        - id: ch01-b14
          speaker: kathleen
          text: You'll have to tell your aunt what happened.
        - id: ch01-b15
          speaker: mabel
          text: No, no, no! Take me home with you. I'll leave her a note saying I've run away to sea.
          emotion: fearful
        - id: ch01-b16
          speaker: jimmy
          text: Girls don't run away to sea.
        - id: ch01-b17
          speaker: mabel
          text: They might go as stowaways if no one wanted a cabin boy. A cabin girl, I mean.
        - id: ch01-b18
          speaker: kathleen
          text: I'm sure you shouldn't do that.
        - id: ch01-b19
          speaker: mabel
          text: Then what am I supposed to do?
        - id: ch01-b20
          speaker: gerald
          text: I don't know what she can do. Let her come home with us and have...
        - id: ch01-b21
          speaker: jimmy
          text: Tea! Yes, let's do that.
          emotion: happy
        - id: ch01-b22
          speaker: gerald
          text: And then we'll hold a proper council.
        - id: ch01-b23
          speaker: jimmy
          text: After tea.
        - id: ch01-b24
          speaker: kathleen
          text: But your aunt will discover that you've gone.
        - id: ch01-b25
          speaker: mabel
          text: She would discover that if I stayed here too.
        - id: ch01-b26
          speaker: jimmy
          text: Oh, come on.
        - id: ch01-b27
          speaker: kathleen
          text: She'll think something dreadful has happened to you.
        - id: ch01-b28
          speaker: mabel
          text: Something has happened to me.
        - id: ch01-b29
          speaker: kathleen
          text: She'll tell the police, and they'll search everywhere.
        - id: ch01-b30
          speaker: gerald
          text: They will never find her. Now that is what I call a perfect disguise.
        - id: ch01-b31
          speaker: mabel
          text: My aunt would rather never see me again than see me invisible. She has spasms already. This might kill her. I'll write a note, and we can put it in the large letter box by the gate. Has anyone got paper and a pencil?
        - id: ch01-b32
          speaker: narrator
          text: Gerald had a notebook filled with shiny leaves. You could not write on them with an ordinary pencil. They needed a little ivory holder with a point of real lead, and that holder was useless on any other kind of paper. This could be very annoying when someone was in a hurry. Now the children saw the odd sight of the ivory stick standing at an impossible angle and moving across a page all by itself.
        - id: ch01-b33
          speaker: kathleen
          text: May we look over your shoulder?
        - id: ch01-b34
          speaker: narrator
          text: No answer came. The pencil kept moving.
        - id: ch01-b35
          speaker: kathleen
          text: Aren't we allowed to look?
        - id: ch01-b36
          speaker: mabel
          text: Of course you are. I nodded. Oh, I forgot that you can't see me nod either.
        - id: ch01-b37
          speaker: narrator
          text: Round, clear letters appeared on a page torn from the notebook.
        - id: ch01-b38
          speaker: mabel
          text: Dear Aunt, I am afraid you will not see me again for some time. A lady in a motorcar has adopted me. We are going straight to the coast and then leaving on a ship. There is no use following me. Farewell, and may you be happy. I hope you enjoyed the fair. Mabel.
        - id: ch01-b39
          speaker: jimmy
          text: But none of that is true.
        - id: ch01-b40
          speaker: mabel
          text: It isn't lying. It's imagination. If I wrote that I had turned invisible, she would think that was a lie anyway.
        - id: ch01-b41
          speaker: jimmy
          text: Come on. You can argue while we're walking.
        - id: ch01-b42
          speaker: narrator
          text: Gerald folded the note in a special way a lady in India had taught him years before. Then Mabel led them out of the park by a different path, which was much shorter than the way they had come.
        - id: ch01-b43
          speaker: narrator
          text: Clouds had covered the sky while they were inside the temple. The first drops of rain began to fall just as they reached the house, terribly late for tea. Mademoiselle was watching at the window, and she hurried to open the door herself.
        - id: ch01-b44
          speaker: narrator
          text: Mademoiselle cried that they were late and asked whether some accident had happened and whether all was well.
        - id: ch01-b45
          speaker: gerald
          text: We are very sorry. The walk home took longer than we expected. I hope you weren't worried. I was thinking about you for most of the way.
        - id: ch01-b46
          speaker: narrator
          text: The French lady smiled and told them to go in. Since they were so late, they could have tea and supper together. And that was exactly what they did.
        - id: ch01-b47
          speaker: mabel
          text: How could you say you were thinking about her the whole way home? That was as much a lie as my story about the lady in the motorcar.
        - id: ch01-b48
          speaker: narrator
          text: Mademoiselle had left them alone with bread and butter, milk, and baked apples. Gerald answered through a mouthful.
        - id: ch01-b49
          speaker: gerald
          text: No, it wasn't. I kept wondering whether she would be angry with us. So there.
        - id: ch01-b50
          speaker: narrator
          text: There were only three plates, so Jimmy gave his to Mabel and shared Kathleen's. Watching Mabel eat was rather horrid, though no one could stop looking. A slice of bread and butter floated in the air while bite after bite disappeared, apparently without any human help. A spoon lifted itself from the plate with baked apple in its bowl, rose through empty space, and returned with nothing on it. Even the tip of the spoon vanished while it was inside Mabel's unseen mouth. For those moments, it looked as if the spoon's bowl had broken clean away.
        - id: ch01-b51
          speaker: narrator
          text: They were all very hungry, and they had to fetch more bread and butter. Cook grumbled when she filled the plate for the third time.
        - id: ch01-b52
          speaker: jimmy
          text: You see? I told you I needed my tea.
        - id: ch01-b53
          speaker: gerald
          text: Giving Mabel breakfast will be terribly difficult. Mademoiselle will be here. Imagine her seeing pieces of fork and bacon vanish, then seeing the forks come back while the bacon stays gone forever. She would have a fit.
        - id: ch01-b54
          speaker: kathleen
          text: We'll have to buy food and feed our poor prisoner in secret.
        - id: ch01-b55
          speaker: jimmy
          text: Our money won't last long. Mabel, have you got any?
        - id: ch01-b56
          speaker: narrator
          text: He turned toward a mug of milk hanging unsupported in the air.
        - id: ch01-b57
          speaker: mabel
          text: I haven't got much money, but I have plenty of ideas.
        - id: ch01-b58
          speaker: kathleen
          text: We can settle everything tomorrow morning. First we'll say good night to Mademoiselle. Then you can sleep in my bed, Mabel, and I'll lend you a nightgown.
        - id: ch01-b59
          speaker: mabel
          text: I'll fetch my own things tomorrow.
        - id: ch01-b60
          speaker: kathleen
          text: You mean you'll go back for them?
        - id: ch01-b61
          speaker: mabel
          text: Why shouldn't I? No one can see me. I'm beginning to think of all kinds of fun. Being invisible isn't so bad after all.
          emotion: happy
        - id: ch01-b62
          speaker: narrator
          text: Kathleen found it extremely strange to watch the Princess's clothes come out of nothing. First the thin, gauzy veil appeared, hanging by itself in midair. Then the sparkling crown suddenly settled on top of the chest of drawers. One sleeve of the pink gown came into sight, then its fellow. At last the whole shining dress lay in a ring on the floor while Mabel's unseen legs stepped free of it. Every piece of clothing became visible the moment she took it off. Then Kathleen's nightgown rose from the bed and disappeared a little at a time as Mabel pulled it over herself.
        - id: ch01-b63
          speaker: kathleen
          text: Please get into bed.
        - id: ch01-b64
          speaker: narrator
          text: Kathleen sounded nervous. The bed creaked, and a hollow pressed itself into the pillow. She turned out the gas and climbed in. All that magic had unsettled her, and she was a little frightened. In the dark, though, things felt better. Mabel put her arms around Kathleen's neck, and the girls kissed where visible and invisible were equal.
        - id: ch01-b65
          speaker: mabel
          text: Good night. You're a darling, Cathy. You've been wonderfully kind to me, and I won't forget it. I couldn't say that in front of the boys because boys think you're silly if you're grateful. But I am grateful. Good night.
          emotion: happy
        - id: ch01-b66
          speaker: narrator
          text: Kathleen stayed awake for a while. Just as sleep was coming, she remembered that the maid who woke them would see the magnificent Princess clothes in the morning.
        - id: ch01-b67
          speaker: kathleen
          text: I'll have to get up and hide them. What a nuisance.
        - id: ch01-b68
          speaker: narrator
          text: She lay there thinking what a nuisance it was, and accidentally fell asleep. When she woke again, morning filled the room with light. Eliza stood before the chair where Mabel's clothes lay, staring at the pink Princess dress on top of the heap.
        - id: ch01-b69
          speaker: eliza
          text: Well, I never!
          emotion: surprised
        - id: ch01-b70
          speaker: kathleen
          text: Oh, please don't touch it!
        - id: ch01-b71
          speaker: narrator
          text: Kathleen sprang from bed just as Eliza reached out.
        - id: ch01-b72
          speaker: eliza
          text: Where in the world did you get that dress?
        - id: ch01-b73
          speaker: kathleen
          text: We're going to use it in a play. Someone lent it to me.
        - id: ch01-b74
          speaker: narrator
          text: The answer came to her in desperation.
        - id: ch01-b75
          speaker: eliza
          text: You might show it to me, miss.
        - id: ch01-b76
          speaker: kathleen
          text: Oh, please, not now. You can watch our play when we're all dressed up. And you won't tell anyone, will you?
        - id: ch01-b77
          speaker: narrator
          text: Kathleen stood between Eliza and the chair in her nightgown.
        - id: ch01-b78
          speaker: eliza
          text: Not if you're a good little girl. But mind you let me see when you dress up. Where did...
        - id: ch01-b79
          speaker: narrator
          text: A bell rang. It was the postman, and Eliza particularly wanted to see him, so she had to go.
        - id: ch01-b80
          speaker: kathleen
          text: Now we'll really have to put on a play. Everything keeps getting more difficult.
        - id: ch01-b81
          speaker: narrator
          text: She pulled on her first stocking. Another stocking rose unsupported, waved in the air, and quickly disappeared.
        - id: ch01-b82
          speaker: mabel
          text: Acting isn't difficult. I would love it.
        - id: ch01-b83
          speaker: kathleen
          text: You forget that an invisible actress can't be in a play unless the play is magical.
        - id: ch01-b84
          speaker: mabel
          text: Oh! I've just had such a wonderful idea!
          emotion: happy
        - id: ch01-b85
          speaker: narrator
          text: Her voice came from beneath a petticoat hanging in the air.
        - id: ch01-b86
          speaker: kathleen
          text: Tell us after breakfast. And I do wish you hadn't written such enormous lies to your aunt. I'm sure nothing makes lying right.
        - id: ch01-b87
          speaker: narrator
          text: Water splashed in the basin and dripped from nowhere back into it.
        - id: ch01-b88
          speaker: mabel
          text: What is the point of telling the truth when no one will believe you?
        - id: ch01-b89
          speaker: kathleen
          text: I don't know, but I'm sure we should tell it anyway.
        - id: ch01-b90
          speaker: mabel
          text: You can tell it if you want.
        - id: ch01-b91
          speaker: narrator
          text: The answer came from the folds of a towel waving by itself in front of the washstand.
        - id: ch01-b92
          speaker: kathleen
          text: Then we will, first thing after our breakfast. You'll have to stay upstairs until we can steal some food and bring it to you. Be sure to dodge Eliza when she comes to make the bed.
        - id: ch01-b93
          speaker: narrator
          text: Mabel thought dodging Eliza was a fairly amusing game. She made it livelier by tugging loose the corners of sheets and blankets whenever Eliza looked away.
        - id: ch01-b94
          speaker: eliza
          text: Drat these bedclothes! Anyone would think they were bewitched.
        - id: ch01-b95
          speaker: narrator
          text: Eliza looked around for the wonderful Princess clothes she had glimpsed earlier that morning. She could not find them. Kathleen had hidden the whole heap beneath the mattress, in the one place she knew Eliza never turned. The maid went back to work and hurriedly swept up those mysterious little pieces of fluff that come from no one knows where, even in the best-kept houses. Mabel was very hungry by now and thoroughly annoyed by the others' long absence at breakfast. At last she could no longer resist whispering directly into Eliza's ear.
        - id: ch01-b96
          speaker: mabel
          text: Always sweep under the mats.
        - id: ch01-b97
          speaker: narrator
          text: Eliza jumped and turned pale.
        - id: ch01-b98
          speaker: eliza
          text: I must be going silly. That's exactly what Mother always said. I hope I'm not going dotty like Aunt Emily. It's wonderful what a person can imagine.
          emotion: fearful
        - id: ch01-b99
          speaker: narrator
          text: All the same, she lifted the hearthrug and swept beneath it and under the fender. She worked so thoroughly and looked so pale that Kathleen noticed at once when she came in with a chunk of bread Gerald had raided through the pantry window.
        - id: ch01-b100
          speaker: kathleen
          text: Haven't you finished yet? Eliza, you look ill. What's wrong?
        - id: ch01-b101
          speaker: eliza
          text: I thought I'd give the room a proper cleaning.
        - id: ch01-b102
          speaker: kathleen
          text: Nothing happened to upset you, did it?
        - id: ch01-b103
          speaker: narrator
          text: Kathleen had private reasons for asking.
        - id: ch01-b104
          speaker: eliza
          text: Nothing but my imagination, miss. I've been fanciful since I was a child. I used to dream of the pearly gates and those little angels wearing nothing but their heads and wings. Much cheaper to dress than children, I've always thought.
        - id: ch01-b105
          speaker: narrator
          text: At last they got rid of her. Mabel ate the bread and drank water from the tooth mug.
        - id: ch01-b106
          speaker: kathleen
          text: I'm afraid the water tastes a little like cherry toothpaste.
        - id: ch01-b107
          speaker: mabel
          text: I don't mind. It makes the water more interesting. Perhaps the red wine in old ballads tastes like this.
        - id: ch01-b108
          speaker: kathleen
          text: We have permission to go out all day again. Gerald agrees with me about the lies, so we're going to tell your aunt where you really are.
        - id: ch01-b109
          speaker: mabel
          text: She won't believe you.
        - id: ch01-b110
          speaker: kathleen
          text: That doesn't matter as long as we tell the truth.
        - id: ch01-b111
          speaker: mabel
          text: I expect you'll regret it, but let's go. And please don't close the door on me. You nearly trapped me in it just now.
        - id: ch01-b112
          speaker: narrator
          text: Blazing sunlight flooded the High Street. Four shadows belonging to only three visible children were dangerously easy to notice. A butcher's boy stared much too hard at the extra shadow, while his large, liver-colored dog sniffed at its mistress's invisible legs and whined uneasily. Mabel's body could not be seen, but the sun still drew her shape plainly on the ground.
        - id: ch01-b113
          speaker: kathleen
          text: Walk behind me. Then our shadows may look like one.
        - id: ch01-b114
          speaker: narrator
          text: But that did not solve the problem. Mabel's shadow landed visibly across Kathleen's back. The stableman at the Davenant Arms looked up to see what enormous bird had flown over her. Then a woman driving a cart full of chickens and ducks called out that Kathleen had not cleaned the black mark from her back and asked what she had leaned against. Every one of the children felt relieved when the last houses were behind them.
        - id: ch01-b115
          speaker: narrator
          text: Telling Mabel's aunt the truth went differently from anything any of them had expected, even Mabel. She led the party into a pleasant little courtyard and up to the housekeeper's room. Clematis and green vines framed its window. There they found the aunt sitting comfortably with a pink novelette open before her, quite absorbed in her reading.
        - id: ch01-b116
          speaker: gerald
          text: Excuse me, but I believe your niece is missing.
        - id: ch01-b117
          speaker: aunt
          text: Not missing, my boy.
        - id: ch01-b118
          speaker: narrator
          text: The aunt was tall and thin, with a dull-colored fringe and a very refined voice.
        - id: ch01-b119
          speaker: gerald
          text: We have some news about her.
        - id: ch01-b120
          speaker: aunt
          text: Now, please don't bring me complaints. My niece has gone, and no one thinks less of her little tricks than I do. If she played one on you, that is simply her high spirits. Run along. I'm busy.
        - id: ch01-b121
          speaker: kathleen
          text: Did you receive her note?
        - id: ch01-b122
          speaker: narrator
          text: The aunt showed a little more interest, though she kept one finger inside her novelette.
        - id: ch01-b123
          speaker: aunt
          text: Oh, so you saw her leave. Did she seem pleased to go?
        - id: ch01-b124
          speaker: gerald
          text: Very pleased.
        - id: ch01-b125
          speaker: narrator
          text: That answer, at least, was true.
        - id: ch01-b126
          speaker: aunt
          text: Then I can only be glad she is being cared for. I suppose her departure surprised you, but romantic adventures do happen in our family. Lord Yalding chose me from eleven people who applied to be housekeeper. I have no doubt Mabel was exchanged at birth, and now her wealthy relations have claimed her.
        - id: ch01-b127
          speaker: gerald
          text: But won't you do anything? Aren't you going to tell the police, or...
        - id: ch01-b128
          speaker: mabel
          text: Hush!
        - id: ch01-b129
          speaker: jimmy
          text: I won't hush. Your Mabel is invisible. That's all that happened. She's standing beside me now.
        - id: ch01-b130
          speaker: aunt
          text: I cannot bear untruthfulness of any kind. Kindly take that little boy away. I am perfectly satisfied about Mabel.
        - id: ch01-b131
          speaker: gerald
          text: Well, you certainly are an aunt! What will Mabel's mother and father say?
        - id: ch01-b132
          speaker: aunt
          text: Her mother and father are dead.
        - id: ch01-b133
          speaker: narrator
          text: A small sob sounded close to Gerald's ear.
        - id: ch01-b134
          speaker: gerald
          text: All right, we'll go. Just don't claim later that we never told you the truth.
        - id: ch01-b135
          speaker: aunt
          text: None of you has told me anything, except that little boy, and he told a silly falsehood.
        - id: ch01-b136
          speaker: gerald
          text: We meant to help. You don't mind that we came through the grounds, do you? We take care not to touch anything.
        - id: ch01-b137
          speaker: aunt
          text: Visitors are not permitted.
        - id: ch01-b138
          speaker: narrator
          text: She glanced impatiently down at her novel.
        - id: ch01-b139
          speaker: gerald
          text: You wouldn't call us visitors. We're Mabel's friends. Our father is Colonel of the...
        - id: ch01-b140
          speaker: aunt
          text: Indeed?
        - id: ch01-b141
          speaker: gerald
          text: And our aunt is Lady Sandling, so you may be sure we would never damage anything here.
        - id: ch01-b142
          speaker: aunt
          text: I'm sure you wouldn't harm a fly. Good-bye, and be good children.
        - id: ch01-b143
          speaker: narrator
          text: They escaped quickly after that.
        - id: ch01-b144
          speaker: gerald
          text: Your aunt is as mad as a hatter. Imagine not caring what happens to you, yet believing all that nonsense about the motorcar lady!
        - id: ch01-b145
          speaker: mabel
          text: I knew she would believe it when I wrote it. She isn't mad. She simply reads novelettes all the time. I read the books in the great library instead. It's a wonderful room, with a strange smell like boots and old leather books whose edges have gone powdery. I'll take you there one day. Now that your consciences feel better, I'll tell you my great idea. Let's go down to the Temple of Flora. I'm glad you got permission to use the grounds. It would be awkward if you had to hide behind bushes whenever a gardener appeared.
        - id: ch01-b146
          speaker: gerald
          text: Yes. I thought of that.
        - id: ch01-b147
          speaker: narrator
          text: Gerald sounded modest. The day was as bright as the one before, and the four children returned across the grounds to the Temple of Flora. From the white marble building, the Italian-looking park seemed more than ever like an old steel engraving colored by hand, or a printed imitation of one of Turner's pictures.
        - id: ch01-b148
          speaker: narrator
          text: The three visible children settled comfortably on the steps below the white statue. Then the fourth child's voice spoke sadly.
        - id: ch01-b149
          speaker: mabel
          text: I am grateful, but I'm also hungry. You can't keep stealing food for me through your pantry window. If you want, I'll return to the castle and live there. People say it is haunted, and I suppose I can haunt it as well as anyone. I'm a kind of ghost now. I really will go if you want me to.
          emotion: sad
        - id: ch01-b150
          speaker: kathleen
          text: Oh, no. You must stay with us.
        - id: ch01-b151
          speaker: mabel
          text: But what about food? I truly am grateful, only breakfast is breakfast, and one piece of bread is just one piece of bread.
        - id: ch01-b152
          speaker: kathleen
          text: If you could remove the ring, you could go home.
        - id: ch01-b153
          speaker: mabel
          text: Yes, but I can't. I tried in bed last night and again this morning. And taking food from your pantry feels like stealing, even when it's only bread.
        - id: ch01-b154
          speaker: gerald
          text: Yes, it does.
        - id: ch01-b155
          speaker: narrator
          text: Gerald knew because he had carried out that daring raid.
        - id: ch01-b156
          speaker: mabel
          text: Then we must earn some money.
        - id: ch01-b157
          speaker: narrator
          text: Jimmy said that sounded easy enough to say. Gerald and Kathleen, however, listened carefully.
        - id: ch01-b158
          speaker: mabel
          text: I truly think my being invisible will turn out for the best. Just wait. We will have adventures because of it.
        - id: ch01-b159
          speaker: gerald
          text: Adventures do not always make money.
        - id: ch01-b160
          speaker: narrator
          text: The bold pirate murmured this warning.
        - id: ch01-b161
          speaker: mabel
          text: This adventure will. But you must not all take part. Suppose Jerry could make himself look ordinary...
        - id: ch01-b162
          speaker: jimmy
          text: That should be easy.
        - id: ch01-b163
          speaker: kathleen
          text: Jimmy, don't be so disagreeable.
        - id: ch01-b164
          speaker: jimmy
          text: I'm not. I only...
        - id: ch01-b165
          speaker: gerald
          text: He merely feels deep inside that your Mabel is going to land us in trouble. Like the beautiful lady without mercy, you know. He doesn't want people in future ages to find him wandering pale and lonely among all the reeds and things.
        - id: ch01-b166
          speaker: mabel
          text: I promise I won't get you into trouble. After the way you stood by me yesterday, we're a band of brothers forever. My plan is for Gerald to go to the fair and perform magic tricks.
        - id: ch01-b167
          speaker: kathleen
          text: But he doesn't know any tricks.
        - id: ch01-b168
          speaker: mabel
          text: I would do the real work. Jerry could pretend he was doing it while I moved things without touching them. All three of you shouldn't go together. The more children there are, the younger they seem, and then people wonder why they're alone.
        - id: ch01-b169
          speaker: gerald
          text: The accomplished magician judged these to be words of wisdom.
        - id: ch01-b170
          speaker: narrator
          text: Jimmy and Kathleen gloomily asked what they were supposed to do.
        - id: ch01-b171
          speaker: gerald
          text: Mix in with the crowd, but don't admit that you know me. Try to look as though you belong to some grown-ups. Otherwise, a kind policeman may take the poor lost children by the hand and lead them home to their grieving family. Their French governess, I mean.
        - id: ch01-b172
          speaker: mabel
          text: Let's go now.
        - id: ch01-b173
          speaker: narrator
          text: They still could not grow used to hearing her voice come from different patches of empty air as she moved. But they went.
        - id: ch01-b174
          speaker: narrator
          text: The fair stood on waste ground half a mile from the castle gates. When the steam organ on the merry-go-round came within hearing, Gerald suggested going ahead. He had ninepence and could buy food, then repay himself from whatever they earned by conjuring. The others waited in a deep, shady lane. He came back quite soon, though only after they had begun complaining that he had been gone forever.
        - id: ch01-b175
          speaker: narrator
          text: Gerald returned carrying Barcelona nuts, striped red apples, little sweet yellow pears, pale heavy gingerbread, a whole quarter pound of peppermint candies, and two bottles of ginger beer. It looked like a great deal to buy with the small supply of money they had.
        - id: ch01-b176
          speaker: gerald
          text: It's an investment. We need special food to keep up our strength, especially the fearless magician.
        - id: ch01-b177
          speaker: narrator
          text: He said this when Kathleen objected to the expense. They sat in the sheltered lane and ate and drank, with the faraway steam organ adding the final touch that made the meal feel like a celebration. The boys never tired of watching Mabel eat. They could only see each nut, piece of fruit, and bite of gingerbread vanish in a wonderfully magical way. They kept pressing food on her, more than her fair share, simply for the pleasure of seeing it disappear.
        - id: ch01-b178
          speaker: gerald
          text: My aunt! That trick will amaze them!
        - id: ch01-b179
          speaker: narrator
          text: He said it again and again. And the trick did amaze them.
        - id: ch01-b180
          speaker: narrator
          text: Jimmy and Kathleen went ahead. At the fair, they slipped into the crowd and tried to look as innocent as possible. Near the coconut game, they stood beside a large woman and watched a strange figure strolling across the trampled yellow grass. Scraps of paper, sticks, and straw blew around his feet.
        - id: ch01-b181
          speaker: narrator
          text: The figure was Gerald, though at first even his brother and sister barely knew him. He walked with his hands deep in his pockets. He had removed his tie and wrapped the crimson school scarf that usually supported his white flannels around his head like a turban. Presumably the tie had taken over the duties of a handkerchief. His face and both hands shone bright black, like beautifully polished stoves. People all across the fair turned to stare.
        - id: ch01-b182
          speaker: jimmy
          text: He looks exactly like a conjurer. Do you think that black will ever wash off?
        - id: ch01-b183
          speaker: narrator
          text: Jimmy and Kathleen followed him at a careful distance. Gerald stopped at the door of a small tent, where a long-faced, unhappy-looking woman leaned against the post. The other two children stopped nearby and tried to look as though they belonged to a farmer. He was busy trying to send a number up a scale by bringing a huge wooden mallet down on a block.
        - id: ch01-b184
          speaker: gerald
          text: Have you earned much today?
        - id: ch01-b185
          speaker: narrator
          text: The woman told him, without much anger, to take his impudence elsewhere.
        - id: ch01-b186
          speaker: gerald
          text: I'm in business too. I'm a conjurer from India.
        - id: ch01-b187
          speaker: fair_woman
          text: You aren't a conjurer. The backs of your ears are white.
        - id: ch01-b188
          speaker: gerald
          text: Are they? Very clever of you to notice.
        - id: ch01-b189
          speaker: narrator
          text: Gerald rubbed his ears with his black hands.
        - id: ch01-b190
          speaker: gerald
          text: Are they better now?
        - id: ch01-b191
          speaker: fair_woman
          text: That's all right. Now what's your game?
        - id: ch01-b192
          speaker: gerald
          text: Real conjuring. Boys younger than me perform it in India. Since you warned me about my ears, I'll give you a share. Let me use your tent, and you can talk to the people outside and bring them in.
        - id: ch01-b193
          speaker: fair_woman
          text: Bless you, I can't make speeches. And you're trying to fool me. If you're so clever, show me a trick.
        - id: ch01-b194
          speaker: gerald
          text: Very well. See this apple? I'll send it slowly through the air. When I say go, it will disappear.
        - id: ch01-b195
          speaker: fair_woman
          text: Yes, straight into your mouth! Go away with your nonsense.
        - id: ch01-b196
          speaker: gerald
          text: You're much too clever to doubt me. Look.
        - id: ch01-b197
          speaker: narrator
          text: He held up a small apple. The woman watched it leave his hand and travel slowly through the empty air with nothing supporting it.
        - id: ch01-b198
          speaker: gerald
          text: Now, go!
        - id: ch01-b199
          speaker: narrator
          text: The apple vanished.
        - id: ch01-b200
          speaker: gerald
          text: What do you think of that?
        - id: ch01-b201
          speaker: narrator
          text: Excitement lit the woman's face and made her eyes shine.
        - id: ch01-b202
          speaker: fair_woman
          text: Best trick I've ever seen. I'm with you, mate, if you know any more like it.
          emotion: happy
        - id: ch01-b203
          speaker: gerald
          text: I know plenty. Hold out your hand.
        - id: ch01-b204
          speaker: narrator
          text: She held it out. The apple appeared from nowhere and settled onto her palm, rather damp.
        - id: ch01-b205
          speaker: fair_woman
          text: Come on, then. Just you and me, mind. But don't use the tent. Set up beside it. A trick like that is worth twice as much outdoors.
        - id: ch01-b206
          speaker: gerald
          text: But no one will pay when they can watch for nothing.
        - id: ch01-b207
          speaker: fair_woman
          text: Let them see the first turn. They'll pay after that. You'll have to do the talking, though.
        - id: ch01-b208
          speaker: gerald
          text: Will you lend me your shawl?
        - id: ch01-b209
          speaker: narrator
          text: She unpinned her red-and-black checked shawl. Gerald spread it on the ground as he had seen Indian conjurers do, then sat cross-legged behind it.
        - id: ch01-b210
          speaker: gerald
          text: The only rule is that no one may stand behind me.
        - id: ch01-b211
          speaker: narrator
          text: The woman quickly made him a little enclosure by hanging old sacks between two tent ropes. Gerald said he was ready. She fetched a drum from the tent and beat it, and soon a small crowd gathered.
        - id: ch01-b212
          speaker: gerald
          text: Ladies and gentlemen, I come from India. I can give you a magical entertainment unlike anything you have seen before. As soon as there are two shillings on this shawl, I will begin.
        - id: ch01-b213
          speaker: bystander
          text: I expect you will!
        - id: ch01-b214
          speaker: narrator
          text: Several people gave short, unpleasant laughs.
        - id: ch01-b215
          speaker: gerald
          text: Of course, if all of you together cannot afford two shillings, I won't say another word.
        - id: ch01-b216
          speaker: narrator
          text: Nearly thirty people now surrounded him. Two or three pennies fell on the shawl, then several more. After that the shower of copper stopped.
        - id: ch01-b217
          speaker: gerald
          text: Ninepence. Well, I have a generous heart. I will give you the finest ninepence worth you have ever had. I won't deceive you. I do have an assistant, but my assistant is invisible.
        - id: ch01-b218
          speaker: narrator
          text: The crowd snorted.
        - id: ch01-b219
          speaker: gerald
          text: With that assistant's help, I can read any letter one of you has in a pocket. One person may step over the rope and stand beside me. My invisible assistant will read the letter over his shoulder.
        - id: ch01-b220
          speaker: narrator
          text: A ruddy-faced man who looked fond of horses stepped forward from the crowd. He pulled a letter from his pocket, opened it, and stood beside Gerald in full view. Everyone could see the paper. Everyone could also see the clear space behind his shoulder, where no visible person could possibly be hiding to read it.
        - id: ch01-b221
          speaker: gerald
          text: Now!
        - id: ch01-b222
          speaker: narrator
          text: After a short silence, a faint sing-song voice came from the far side of the enclosure.
        - id: ch01-b223
          speaker: mabel
          text: Sir, we have received your letter of the fifteenth. Concerning the mortgage on your land, we regret that we cannot...
        - id: ch01-b224
          speaker: horseman
          text: Stop that!
          emotion: angry
        - id: ch01-b225
          speaker: narrator
          text: He turned threateningly toward Gerald, then stepped out and declared there was nothing like that in his letter. No one believed him. Interested voices buzzed through the crowd and fell silent the moment Gerald spoke again.
        - id: ch01-b226
          speaker: gerald
          text: Watch these nine pennies. One after another, you will see them disappear.
        - id: ch01-b227
          speaker: narrator
          text: One after another, they did. Then Mabel's invisible hand laid each penny down again. The crowd clapped and shouted.
        - id: ch01-b228
          speakers: [crowd_member_1, crowd_member_2, crowd_member_3]
          ensemble: chorus
          text: Bravo! Now that is a real trick! Show us another one!
          emotion: happy
        - id: ch01-b229
          speaker: narrator
          text: The people at the back pushed toward the front.
        - id: ch01-b230
          speaker: gerald
          text: You have seen what I can do. I won't do anything more until five shillings lie on this carpet.
        - id: ch01-b231
          speaker: narrator
          text: Within two minutes, the shawl held seven shillings and threepence. Gerald performed more magic.
        - id: ch01-b232
          speaker: narrator
          text: When the people in front stopped paying, Gerald asked them to stand back and let those behind have a turn at seeing. There is no time to describe every trick he performed. The crowd around the enclosure grew so thick that their feet trampled away every blade of grass. With an invisible assistant, there was almost no limit to the wonders Gerald could offer. All sorts of objects moved through the air with no hand beneath them, and some vanished into the folds of Mabel's unseen clothes. The fairground woman watched the money tumble in and looked pleasanter by the minute. Every time Gerald paused, she beat her shabby drum and drew in fresh spectators.
        - id: ch01-b233
          speaker: narrator
          text: News of the marvelous conjurer spread from one end of the fair to the other. The crowd went wild with admiration. The man who ran the coconut game begged Gerald to join him. The owner of the rifle gallery promised free food and lodging as well as a share of the profits. A brisk, broad woman in stiff black silk and a violet bonnet pushed forward too. She wanted to hire him for a coming charity bazaar for reformed bandsmen.
        - id: ch01-b234
          speaker: narrator
          text: Through all this, Jimmy and Kathleen mixed with the spectators and remained completely unnoticed. Who could spare a glance for ordinary children when Gerald was performing such wonders? But it was getting late, long past teatime. Gerald was thoroughly exhausted. He had earned enough money to satisfy him, and now he racked his tired brain for some way to end the show and escape.
        - id: ch01-b235
          speaker: gerald
          text: How are we going to get away? They will never let us leave. I didn't think of that.
        - id: ch01-b236
          speaker: narrator
          text: He murmured while Mabel made his cap disappear by lifting it from his head and putting it into her pocket.
        - id: ch01-b237
          speaker: mabel
          text: Let me think.
        - id: ch01-b238
          speaker: narrator
          text: A moment later, she whispered close to his ear.
        - id: ch01-b239
          speaker: mabel
          text: Divide the money, and pay her for the shawl. Then put the money down and say exactly what I tell you.
        - id: ch01-b240
          speaker: narrator
          text: Gerald's little stage stood in the tent's shade. Otherwise, everyone would have seen Mabel's shadow moving around as she worked the tricks. He asked the woman to divide the money, and she did it honestly.
        - id: ch01-b241
          speaker: gerald
          text: I'll pay you five shillings for your shawl.
        - id: ch01-b242
          speaker: fair_woman
          text: Seven shillings and sixpence.
        - id: ch01-b243
          speaker: gerald
          text: Done!
        - id: ch01-b244
          speaker: narrator
          text: He pushed his heavy share of the earnings into his trouser pocket while the impatient crowd pressed closer.
        - id: ch01-b245
          speaker: gerald
          text: This shawl will now disappear.
        - id: ch01-b246
          speaker: narrator
          text: He lifted the shawl and passed it to Mabel. She put it on, and of course it vanished. The audience roared its approval.
        - id: ch01-b247
          speaker: gerald
          text: And now for my final trick. I will take three steps backward and disappear.
        - id: ch01-b248
          speaker: narrator
          text: He stepped backward three times. Mabel wrapped the invisible shawl around him, but Gerald remained plainly in sight. Since the shawl itself could not be seen, it concealed nothing.
        - id: ch01-b249
          speaker: fair_boy
          text: Look at him! He knows he can't do it!
        - id: ch01-b250
          speaker: mabel
          text: I wish I could put you in my pocket.
        - id: ch01-b251
          speaker: narrator
          text: The crowd kept pressing closer and closer. At any moment someone might bump into Mabel or seize the place where she stood, and then absolutely anything might happen. Gerald grabbed his hair with both hands. That was always his habit when he felt anxious or discouraged. Invisible Mabel wrung her hands as people are said to do in books. In ordinary terms, she clasped them together and squeezed as hard as she could.
        - id: ch01-b252
          speaker: mabel
          text: Oh! It's loose. I can take it off!
          emotion: surprised
        - id: ch01-b253
          speaker: gerald
          text: Not the...
        - id: ch01-b254
          speaker: mabel
          text: Yes. The ring.
        - id: ch01-b255
          speaker: farm_laborer
          text: Come on, young master. Give us something for our money!
        - id: ch01-b256
          speaker: gerald
          text: I will. This time I truly will disappear.
        - id: ch01-b257
          speaker: narrator
          text: Then he whispered to Mabel.
        - id: ch01-b258
          speaker: gerald
          text: Go around into the tent and push the ring beneath the canvas. Then slip out behind it and join the others. Once I see you with them, I'll vanish. Walk slowly. I'll catch up.
        - id: ch01-b259
          speaker: mabel
          text: It's me. He has the ring. Come quickly, before the crowd spreads out.
        - id: ch01-b260
          speaker: narrator
          text: A pale and perfectly visible Mabel whispered into Kathleen's ear. As the children passed through the fairground gate, a roar of surprise and annoyance rose behind them. This time Gerald really had vanished.
        - id: ch01-b261
          speaker: narrator
          text: They walked a mile before footsteps sounded on the road behind them. They looked back, but no one was there. Then Gerald's voice came from the clear, empty air beside them.
        - id: ch01-b262
          speaker: gerald
          text: Hello.
          emotion: sad
        - id: ch01-b263
          speaker: mabel
          text: How horrible! You made me jump. Take off the ring. Hearing your voice with no one there makes me shiver.
          emotion: fearful
        - id: ch01-b264
          speaker: jimmy
          text: Now you know how we felt about you.
        - id: ch01-b265
          speaker: kathleen
          text: Don't take it off yet. Your face is probably still black, and someone might recognize you. Gypsies might carry you off and make you perform magic forever.
        - id: ch01-b266
          speaker: jimmy
          text: I would take it off. We can't walk around with Mabel while people think we've run away with her.
        - id: ch01-b267
          speaker: mabel
          text: Yes, that would be ridiculous. Besides, I want my ring back.
        - id: ch01-b268
          speaker: jimmy
          text: It doesn't belong to you any more than it belongs to us.
        - id: ch01-b269
          speaker: mabel
          text: Yes, it does.
        - id: ch01-b270
          speaker: gerald
          text: Oh, stop arguing. What good does it do?
        - id: ch01-b271
          speaker: narrator
          text: His invisible voice sounded exhausted beside her.
        - id: ch01-b272
          speaker: mabel
          text: I want the ring.
        - id: ch01-b273
          speaker: narrator
          text: She spoke stubbornly. Gerald's answer came out of the still evening air.
        - id: ch01-b274
          speaker: gerald
          text: Wanting will have to be your master. You cannot have the ring. I can't get it off!
          emotion: fearful
