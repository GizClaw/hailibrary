audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 讲究而端庄，偶尔流露笑意
        timbre: 轻盈成熟的女声
        pace: 从容
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 朴实爽快，受惊时喃喃自语
        timbre: 年轻质朴的女声
        pace: 自然偏快
        pitch: 中音
    aunt:
      display_name: 梅布尔的姨妈
      tts:
        delivery: 文雅疏离，沉浸在浪漫幻想里
        timbre: 纤细成熟的女声
        pace: 从容
        pitch: 中音
    cart_woman:
      display_name: 赶车女人
      tts:
        delivery: 直嗓门，带乡间口音
        timbre: 粗亮的女声
        pace: 稍快
        pitch: 中音
    show_woman:
      display_name: 帐篷女人
      tts:
        delivery: 世故爽利，兴奋时热切
        timbre: 略带沙哑的女声
        pace: 明快
        pitch: 中低音
    bystander:
      display_name: 旁观者
      tts:
        delivery: 怀疑而爱起哄
        timbre: 普通成年男声
        pace: 自然
        pitch: 中音
    horseman:
      display_name: 红脸男人
      tts:
        delivery: 粗直警觉，恼火时强硬
        timbre: 粗壮的男声
        pace: 自然
        pitch: 中低音
    fair_boy:
      display_name: 集市男孩
      tts:
        delivery: 起哄嘲笑，嗓门响亮
        timbre: 尖亮的男孩声
        pace: 快
        pitch: 高音
    farm_worker:
      display_name: 农场工人
      tts:
        delivery: 粗声催促，毫不客气
        timbre: 厚重的男声
        pace: 稍快
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你要是常跟一个隐身伙伴四处走动，就会知道这事有多别扭。哪怕你再确信对方真的看不见了，隔不了多久，心里还是会忍不住冒出一句：这一定是一场梦，我再过半秒钟就会醒。杰拉尔德、凯瑟琳和吉米坐在白大理石的花神殿里，从拱门望着阳光灿烂的园子，听那位中了魔法的公主说话时，就是这种感觉。她其实根本不是什么公主，只是女管家的外甥女梅布尔·普劳斯。不过照吉米的说法，她中了魔法这件事倒是千真万确。
        - id: ch01-b02
          speaker: princess
          text: 说什么都没有用了。我压根没信过真会出事，可它偏偏发生了。
        - id: ch01-b03
          speaker: gerald
          text: 那我们能帮你做什么吗？要是帮不上，我想我们也该回去了。
        - id: ch01-b04
          speaker: jimmy
          text: 对呀，我还等着喝茶呢！
        - id: ch01-b05
          speaker: princess
          text: 喝茶？你们把我害成这个样子，竟然想丢下我，自己回去喝茶？
        - id: ch01-b06
          speaker: gerald
          text: 我还从没见过这么不讲理的公主——
        - id: ch01-b07
          speaker: kathleen
          text: 别逗她了。一个人突然变得谁也看不见，一定难受极了。
        - id: ch01-b08
          speaker: princess
          text: 我姨妈本来就不怎么喜欢我。她不准我去集市，就因为我拿出伊丽莎白女王穿过的一只旧鞋试了试，却忘记放回玻璃柜里。
        - id: ch01-b09
          speaker: kathleen
          text: 那只鞋你穿得下吗？
        - id: ch01-b10
          speaker: princess
          text: 怎么可能，实在太小了。我看它从前也没合过任何人的脚。
        - id: ch01-b11
          speaker: jimmy
          text: 可我真的很想喝茶！
        - id: ch01-b12
          speaker: gerald
          text: 说实话，我们留在这里也帮不了你，或许真该走了。
        - id: ch01-b13
          speaker: kathleen
          text: 你得把这件事告诉姨妈。
        - id: ch01-b14
          speaker: princess
          text: 不要，千万不要！带我一起走吧。我留张字条，就说我逃去坐船出海了。
          emotion: fearful
        - id: ch01-b15
          speaker: jimmy
          text: 女孩子哪会逃去当水手。
        - id: ch01-b16
          speaker: princess
          text: 女孩子也能偷乘船呀。没人肯要见习水手，我就做见习女水手。
        - id: ch01-b17
          speaker: kathleen
          text: 我还是觉得你不该这么做。
        - id: ch01-b18
          speaker: princess
          text: 那你说，我还能怎么办？
        - id: ch01-b19
          speaker: gerald
          text: 我也想不出她该怎么办。要不让她跟我们回去，吃点——
        - id: ch01-b20
          speaker: jimmy
          text: 茶！好主意！
        - id: ch01-b21
          speaker: gerald
          text: 再开个会，好好商量。
        - id: ch01-b22
          speaker: jimmy
          text: 先喝茶，后开会。
        - id: ch01-b23
          speaker: kathleen
          text: 可她姨妈会发现她不见了，还会以为她出了什么事。
        - id: ch01-b24
          speaker: princess
          text: 我留在这里，她照样会发现。我也的确出了事。
        - id: ch01-b25
          speaker: jimmy
          text: 哎呀，先走吧。
        - id: ch01-b26
          speaker: kathleen
          text: 她还会报警，叫警察到处找你。
        - id: ch01-b27
          speaker: gerald
          text: 警察永远也找不到她。这才算真正无懈可击的乔装。
        - id: ch01-b28
          speaker: princess
          text: 我姨妈宁愿永远见不到我，也不会愿意见我这副样子。她受不了，说不定会送命，她本来就会抽风。我要写封信，出去时投进门口的大信箱。谁有纸笔？
        - id: ch01-b29
          speaker: narrator
          text: 杰拉尔德正好带着一本特殊的笔记簿，纸页光溜溜的，普通黑铅笔根本写不上去。必须用一根象牙小棒，棒子尖端还嵌着真正的铅。偏偏这东西除了笔记簿里的纸，写到别处又完全不显字，所以赶时间时常常叫人恼火。这一次，大家却看见了一幕奇景。象牙小棒斜着竖在空中，角度古怪得几乎不可能，却像被一只普通的手握着那样，自己沿着纸面移动起来。
        - id: ch01-b30
          speaker: kathleen
          text: 我们能在旁边看吗？我们不能看吗？
        - id: ch01-b31
          speaker: narrator
          text: 铅笔没有停，也没有回答。
        - id: ch01-b32
          speaker: princess
          text: 当然能看！我刚才不是点头了吗？噢，我忘记了，你们连我点头也看不见。
        - id: ch01-b33
          speaker: narrator
          text: 圆圆的字母一个接一个落在撕下来的纸页上。梅布尔写道：“亲爱的姨妈，恐怕有一阵子您见不到我了。一位乘汽车的太太收养了我，我们马上要去海边，再坐船出发。追我也没有用。再见，祝您幸福。希望您在集市玩得开心。”信末署着梅布尔的名字。
        - id: ch01-b34
          speaker: jimmy
          text: 可这些话全是假的。
        - id: ch01-b35
          speaker: princess
          text: 这不叫撒谎，叫想象。就算我老实写自己隐身了，她也会认定我在撒谎。
        - id: ch01-b36
          speaker: jimmy
          text: 走吧。要吵架，边走也能吵。
        - id: ch01-b37
          speaker: narrator
          text: 杰拉尔德照一位印度太太多年前教他的办法，把信仔细折好。梅布尔领着大家换了一条近得多的路，走出园子。连回家的路也比来时短了许多。他们待在花神殿时，天空已经慢慢阴下来。等四个人赶回住处，不仅早就过了喝茶时间，第一滴雨也正好落下。法国女教师一直从窗口向外张望，最后还亲自跑来开门。
        - id: ch01-b38
          speaker: mademoiselle
          text: 你们怎么迟了这么久！是不是遇到了不幸？大家都平安吗？
          emotion: surprised
        - id: ch01-b39
          speaker: gerald
          text: 实在对不起。回来的路比预想中久。希望您没有担心，我一路上大半时间都在想着您。
        - id: ch01-b40
          speaker: mademoiselle
          text: 那就快进去吧。今天的茶点和晚饭一起吃。
        - id: ch01-b41
          speaker: narrator
          text: 他们果真把茶点和晚饭合成了一顿。法国女教师把几个孩子单独留在桌旁，面前摆着面包黄油、牛奶和烤苹果。她刚走，一个声音便贴到杰拉尔德耳边。
        - id: ch01-b42
          speaker: princess
          text: 你怎么能说一路都在想她？这跟我说自己被汽车太太收养一样，也是谎话。
        - id: ch01-b43
          speaker: gerald
          text: 不一样。我一直在想，她会不会大发脾气。所以我说的是真话。
        - id: ch01-b44
          speaker: narrator
          text: 桌上只有三只盘子，吉米把自己的让给梅布尔，改跟凯瑟琳合用。眼看一块面包黄油悬在空中，被一口一口咬掉，仿佛根本没有人在吃，实在有些吓人。盛着烤苹果的勺子也会自己升起，再空着落回盘中。每当勺尖送进梅布尔看不见的嘴里，连勺尖也跟着消失，有时看上去就像勺头忽然断掉。大家全都饿坏了，只能一次次去添面包黄油。等盘子第三次装满，厨娘终于忍不住抱怨起来。
        - id: ch01-b45
          speaker: jimmy
          text: 看吧，我早就说了，我真的需要喝茶。
        - id: ch01-b46
          speaker: gerald
          text: 明早给梅布尔弄早饭才叫难办。到时候法国女教师也会坐在桌边。她要是亲眼看见叉子尖挑着一块熏肉，熏肉一截一截地凭空消失，最后叉子又从虚无里退回来，可熏肉已经永远不见了，她准会当场抽风。
        - id: ch01-b47
          speaker: kathleen
          text: 那我们就买些吃的，偷偷喂养这位可怜的俘虏。
        - id: ch01-b48
          speaker: jimmy
          text: 我们的钱撑不了几天。梅布尔，你自己有钱吗？
        - id: ch01-b49
          speaker: narrator
          text: 吉米对着悬在半空的一杯牛奶发问。
        - id: ch01-b50
          speaker: princess
          text: 钱没有多少，主意倒多得很。
        - id: ch01-b51
          speaker: kathleen
          text: 明早再商量吧。我们先去道晚安，然后你睡我的床。梅布尔，我借你一件睡衣。
        - id: ch01-b52
          speaker: princess
          text: 我明天回去拿自己的。
        - id: ch01-b53
          speaker: kathleen
          text: 你还要回去取东西？
        - id: ch01-b54
          speaker: princess
          text: 有什么不行？反正谁也看不见我。我已经想到好多有趣的事了。隐身其实挺不错。
        - id: ch01-b55
          speaker: narrator
          text: 凯瑟琳眼看着公主服从虚空中一件件出现，觉得古怪极了。先是轻纱面罩悬在半空，接着闪亮的冠冕猛然落到五斗柜顶上。然后，粉红长裙的一只袖子显出来，另一只袖子也跟着出现。最后，整条裙子亮晶晶地围成一圈，落在地上，因为梅布尔那双看不见的腿已经从里面迈了出去。她每脱下一件衣服，那件衣服就重新变得看得见。可床上的睡衣被提起来以后，却正好相反，从一头开始一寸寸消失了。
        - id: ch01-b56
          speaker: kathleen
          text: 快上床吧。
        - id: ch01-b57
          speaker: narrator
          text: 床铺吱呀响了一声，枕头上也凹下去一个坑。凯瑟琳关掉煤气灯，跟着钻进被窝。这一连串魔法把她弄得心神不宁，她确实有那么一点害怕。可到了黑暗里，事情反而没有那么糟。她才刚躺好，梅布尔的胳膊就搂住了她的脖子。两个小姑娘在亲切的黑暗中互相亲吻。因为只有在那里，看得见的人和看不见的人终于能够平等地相见。
        - id: ch01-b58
          speaker: princess
          text: 晚安，凯茜。你对我实在太好了，我不会忘记。男孩子们在场时，我不敢说，因为他们觉得感恩的人没出息。可我真的很感激你。晚安。
          emotion: calm
        - id: ch01-b59
          speaker: narrator
          text: 凯瑟琳迟迟没有睡着。刚有睡意，她想起早晨来叫她们的女仆会看到那套公主服。
        - id: ch01-b60
          speaker: kathleen
          text: 我还得起床藏衣服。真麻烦！
        - id: ch01-b61
          speaker: narrator
          text: 凯瑟琳躺在那里，一遍遍想着这件事有多麻烦，可不知怎么还是睡着了。等她再次醒来，天已经大亮。伊莱扎就站在那把堆满梅布尔衣服的椅子前，目不转睛地盯着最上面的粉红公主裙，还慢慢伸出一只手。
        - id: ch01-b62
          speaker: eliza
          text: 老天呀！
          emotion: surprised
        - id: ch01-b63
          speaker: kathleen
          text: 请别碰！
        - id: ch01-b64
          speaker: eliza
          text: 这东西究竟是从哪儿来的？
        - id: ch01-b65
          speaker: kathleen
          text: 别人借给我的，我们准备拿它演戏。
        - id: ch01-b66
          speaker: eliza
          text: 那也给我看看嘛，小姐。
        - id: ch01-b67
          speaker: kathleen
          text: 现在不行！等大家装扮好了，你再来看演出。你可千万别告诉别人。
        - id: ch01-b68
          speaker: eliza
          text: 你乖乖听话，我就不说。不过你们装扮时，一定得让我瞧。可是——
        - id: ch01-b69
          speaker: narrator
          text: 门铃突然响了。邮差到了，伊莱扎特别想见他，只好马上离开。
        - id: ch01-b70
          speaker: kathleen
          text: 这下我们非演戏不可了。为什么每件事都这么难办？
        - id: ch01-b71
          speaker: princess
          text: 演戏不难呀，我一定会喜欢。
        - id: ch01-b72
          speaker: narrator
          text: 一只没人拿着的长袜在空中摆动，很快便消失了。
        - id: ch01-b73
          speaker: kathleen
          text: 你忘啦？女演员要是看不见，除非演魔法戏，否则根本没法登台。
        - id: ch01-b74
          speaker: princess
          text: 噢，我想到一个绝妙的主意！
          emotion: happy
        - id: ch01-b75
          speaker: kathleen
          text: 吃完早饭再讲。还有，我真希望你没对姨妈撒下那么大的谎。不管为了什么，我们都不该撒谎。
        - id: ch01-b76
          speaker: narrator
          text: 脸盆里的水哗哗溅起，又从看不见的地方滴落回去。
        - id: ch01-b77
          speaker: princess
          text: 如果说了真话也没人相信，那还有什么用？
        - id: ch01-b78
          speaker: kathleen
          text: 我说不上来，可我们还是应该讲真话。
        - id: ch01-b79
          speaker: princess
          text: 那你愿意说就去说吧。
        - id: ch01-b80
          speaker: narrator
          text: 声音从洗脸架前一条独自挥动的毛巾里冒了出来。
        - id: ch01-b81
          speaker: kathleen
          text: 好，我们一吃完早——我是说，一吃完自己的早饭，就去说。你留在楼上，等我们找来食物。伊莱扎铺床时，记得躲开她。
        - id: ch01-b82
          speaker: narrator
          text: 梅布尔倒很喜欢这个游戏。伊莱扎不留神时，她便把塞好的床单和毯角扯出来。
        - id: ch01-b83
          speaker: eliza
          text: 这些鬼被褥！简直像中了邪一样。
        - id: ch01-b84
          speaker: narrator
          text: 伊莱扎四处寻找清早瞥见的那套奇妙公主服。凯瑟琳却早已把它们藏在床垫底下，认定那里万无一失，因为她知道伊莱扎从来不会翻床垫。女仆匆匆扫起地板上的绒毛。哪怕收拾得最规矩的人家，也说不清这些东西究竟从哪儿冒出来。梅布尔饿得厉害，其他人却迟迟没有吃完早饭。她越等越恼，终于忍不住凑到伊莱扎耳边，低声提醒她。
        - id: ch01-b85
          speaker: princess
          text: 垫子底下也要扫。
        - id: ch01-b86
          speaker: narrator
          text: 伊莱扎吓得一哆嗦，脸色也白了。
        - id: ch01-b87
          speaker: eliza
          text: 我一定快要疯了。可妈妈从前总这样说。千万别让我像艾米莉姨妈一样发疯。人的脑子可真会胡思乱想啊。
          emotion: fearful
        - id: ch01-b88
          speaker: narrator
          text: 嘴上虽然这么说，伊莱扎还是掀起壁炉前的小毯子，把下面扫了一遍，连炉栏底下都没放过。她扫得格外彻底，脸色却越来越白。凯瑟琳拿着一大块面包走进来，那是杰拉尔德刚从食品储藏室窗口偷来的。她一看伊莱扎的样子，马上担心起来。
        - id: ch01-b89
          speaker: kathleen
          text: 还没弄完吗？伊莱扎，你看起来很不舒服。出什么事了？
        - id: ch01-b90
          speaker: eliza
          text: 我只是想把房间彻底收拾一遍。
        - id: ch01-b91
          speaker: kathleen
          text: 没有什么事吓着你吧？
        - id: ch01-b92
          speaker: eliza
          text: 没事，小姐，只是我又胡思乱想了。我从小就爱这样，老是梦见珍珠做的大门，还有那些小天使。他们身上什么也没穿，只有脑袋和翅膀。我总觉得，跟养普通孩子比起来，养他们可真省衣服钱。
        - id: ch01-b93
          speaker: narrator
          text: 伊莱扎终于走了。梅布尔吃掉面包，又拿漱口杯喝水。
        - id: ch01-b94
          speaker: kathleen
          text: 水里恐怕带着樱桃牙膏味。
        - id: ch01-b95
          speaker: princess
          text: 没关系，比白水有趣。我猜歌谣里的红葡萄酒，差不多就是这种味道。
        - id: ch01-b96
          speaker: kathleen
          text: 今天我们又请到一天假。杰拉尔德也赞成不撒谎，所以我们要去把你的实情告诉姨妈。
        - id: ch01-b97
          speaker: princess
          text: 她不会信的。
        - id: ch01-b98
          speaker: kathleen
          text: 只要说的是实话，她信不信都不要紧。
        - id: ch01-b99
          speaker: princess
          text: 你们准会后悔。不过走吧。出门时别再拿门夹我，刚才差一点就夹到了。
        - id: ch01-b100
          speaker: narrator
          text: 耀眼的阳光铺满大街，三个看得见的孩子身后却拖着四道影子，怎么看都危险。一个肉铺小伙计盯住那道多出来的影子，神情认真得过了头。他那条肝褐色的大猎犬也凑过来，嗅着影子主人看不见的双腿，不安地低声呜咽。
        - id: ch01-b101
          speaker: kathleen
          text: 你躲在我身后吧。这样两道影子就能叠成一道。
        - id: ch01-b102
          speaker: narrator
          text: 可梅布尔的影子清清楚楚地落在凯瑟琳背上。达文南特纹章旅馆的马夫还抬起头，想找出是哪只大鸟投下了这片阴影。这时，一个女人赶着满载鸡鸭的车经过。
        - id: ch01-b103
          speaker: cart_woman
          text: 喂，小姑娘，你背后怎么黑了一块？刚才靠到什么上面了？
        - id: ch01-b104
          speaker: narrator
          text: 好容易走出小镇，大家才松了一口气。至于向梅布尔姨妈说真话这件事，结果跟谁想的都不一样，连梅布尔自己也没有料到。他们来到城堡时，姨妈正在女管家的房间里，坐在窗前读一本粉红封皮的言情小册子。铁线莲和绿藤围成窗框，外面是一座小巧秀气的院子。梅布尔领着一行人找到了那里。
        - id: ch01-b105
          speaker: gerald
          text: 对不起，您的外甥女是不是不见了？
        - id: ch01-b106
          speaker: aunt
          text: 她并没有不见，小伙子。
        - id: ch01-b107
          speaker: narrator
          text: 姨妈又瘦又高，灰褐色的刘海垂在额前，说起话来十分文雅。
        - id: ch01-b108
          speaker: gerald
          text: 我们知道她出了什么事，想来告诉您。
        - id: ch01-b109
          speaker: aunt
          text: 好了，请别跑来告状。我的外甥女已经走了。她是爱搞点小恶作剧，可没有谁比我更不把这些事放在心上。就算她捉弄过你们，那也不过是因为她生性活泼。回去吧，孩子们，我这里正忙着呢。
        - id: ch01-b110
          speaker: kathleen
          text: 那您收到她的信了吗？
        - id: ch01-b111
          speaker: narrator
          text: 姨妈这才有了点兴趣，可一根手指仍夹在小册子里。
        - id: ch01-b112
          speaker: aunt
          text: 原来你们亲眼看见她走了。她走的时候高兴吗？
        - id: ch01-b113
          speaker: gerald
          text: 很高兴。
        - id: ch01-b114
          speaker: aunt
          text: 那我只应该庆幸她终于有了归宿。我想你们一定觉得很吃惊，可我们家里常常碰上这种浪漫的奇遇。雅尔丁勋爵当初有十一个应征者可以挑，却偏偏选中我，让我到这里当女管家。我一点也不怀疑，那孩子出生的时候被别人抱错了，如今一定是她那些有钱的亲人找到了她，把她认回去了。
        - id: ch01-b115
          speaker: kathleen
          text: 可您不打算做点什么吗？比如告诉警察，或者——
        - id: ch01-b116
          speaker: princess
          text: 嘘！
        - id: ch01-b117
          speaker: jimmy
          text: 我才不嘘。你们家的梅布尔变得看不见了。她现在就在我旁边。
        - id: ch01-b118
          speaker: aunt
          text: 我最痛恨不诚实。麻烦你们把这个小男孩带走，好吗？梅布尔的事，我完全放心。
        - id: ch01-b119
          speaker: gerald
          text: 好啊，您还真像个姨妈！那梅布尔的爸爸妈妈会怎么说？
        - id: ch01-b120
          speaker: aunt
          text: 梅布尔的父母都去世了。
        - id: ch01-b121
          speaker: narrator
          text: 杰拉尔德耳边传来一声很轻的抽泣。
        - id: ch01-b122
          speaker: gerald
          text: 好吧，我们这就走。以后可别说，我们没有把真相告诉您。
        - id: ch01-b123
          speaker: aunt
          text: 你们谁也没告诉我什么。只有那个小男孩，对我说了一个荒唐的谎。
        - id: ch01-b124
          speaker: gerald
          text: 我们也是一番好意。我们从庄园里穿过去，您不会介意吧？一路上我们很小心，什么也没碰。
        - id: ch01-b125
          speaker: aunt
          text: 庄园不许访客进入。
        - id: ch01-b126
          speaker: narrator
          text: 姨妈不耐烦地低头瞥向小说。杰拉尔德马上换成最得体的口吻。
        - id: ch01-b127
          speaker: gerald
          text: 您不会把我们当访客吧？我们是梅布尔的朋友。我们的父亲是某某团的上校。
        - id: ch01-b128
          speaker: aunt
          text: 是吗？
        - id: ch01-b129
          speaker: gerald
          text: 我们的姑妈是桑德林夫人。您尽管放心，我们绝不会弄坏庄园里的东西。
        - id: ch01-b130
          speaker: aunt
          text: 我相信你们连一只苍蝇也不会伤害。再见，做乖孩子。
        - id: ch01-b131
          speaker: narrator
          text: 姨妈说得心不在焉。孩子们听到这里，赶紧离开了小院。
        - id: ch01-b132
          speaker: gerald
          text: 你姨妈真是疯得不轻。她一点也不在乎你出了什么事，还把汽车太太那套话全信了！
        - id: ch01-b133
          speaker: princess
          text: 我写信的时候就知道她一定会信。她根本没有疯，只是一天到晚都在读言情小册子。大图书室里的书我也读过。噢，那间屋子可棒了，气味古里古怪，既像靴子，又像书页边上积了粉尘的旧皮面书。改天我带你们去看看。现在你们对我姨妈已经尽了责任，可以问心无愧了，我也终于能说那个妙主意。我们去花神殿吧。幸好杰里刚才替大家要到了在园子里走动的许可，不然以后每次碰见园丁，你们都得赶紧躲到灌木丛后面，那多不方便。
        - id: ch01-b134
          speaker: gerald
          text: 对，我正是这么打算的。
        - id: ch01-b135
          speaker: narrator
          text: 这一天和昨天一样晴朗。从白色大理石神殿望出去，那片带着意大利风味的景色，比平时更像一幅手工上色的钢版画，又像仿照透纳油画印出来的彩色石印画。三个看得见的孩子舒舒服服地坐在通往白色雕像的台阶上。第四个孩子看不见，只有她的声音从旁边传来，而且听上去很忧伤。
        - id: ch01-b136
          speaker: princess
          text: 我不是不知感恩，可我又有点饿了。你们总不能一直从食品储藏室的窗口替我拿东西。要是你们同意，我可以回城堡去住。我听说那里本来就闹鬼，而我扮起鬼来不会比任何人差。你们也知道，我现在已经算是个幽灵了。只要你们愿意，我就自己回去。
          emotion: sad
        - id: ch01-b137
          speaker: kathleen
          text: 不行，你一定要跟我们待在一起。
        - id: ch01-b138
          speaker: princess
          text: 那吃饭怎么办？我真的不是不知感恩，可早饭就是早饭，面包也只是面包呀。
        - id: ch01-b139
          speaker: kathleen
          text: 要是能摘掉戒指，你就可以回去了。
        - id: ch01-b140
          speaker: princess
          text: 可我摘不下来。昨晚睡觉后试过，今天早上也试过。而且从你们的储藏室拿吃的，哪怕只拿一块面包，也等于偷东西。
        - id: ch01-b141
          speaker: gerald
          text: 没错，的确算偷。
        - id: ch01-b142
          speaker: narrator
          text: 那次大胆的偷面包行动，正是杰拉尔德亲手干的。
        - id: ch01-b143
          speaker: princess
          text: 所以我们得想个办法挣钱。
        - id: ch01-b144
          speaker: jimmy
          text: 说起来容易。
        - id: ch01-b145
          speaker: princess
          text: 我真觉得，隐身最后会变成一件好事。要不是我看不见了，我们哪会碰上这些冒险？
        - id: ch01-b146
          speaker: gerald
          text: 冒险可不一定能赚到钱。
        - id: ch01-b147
          speaker: princess
          text: 这一次肯定能赚。不过不能全都去。杰里只要能把自己打扮得像个普通人——
        - id: ch01-b148
          speaker: jimmy
          text: 那应该不难。
        - id: ch01-b149
          speaker: kathleen
          text: 吉米，别这么讨人嫌。
        - id: ch01-b150
          speaker: jimmy
          text: 我没有，我只是——
        - id: ch01-b151
          speaker: gerald
          text: 只是心里有一种预感，觉得你这个梅布尔迟早会害我们倒霉。就像《无情的美丽姑娘》里的那个人，他大概也不愿意让后世的人发现，自己脸色苍白，孤零零地在一大片莎草之类的东西中间来回游荡。
        - id: ch01-b152
          speaker: princess
          text: 我不会害你们倒霉，真的。昨天你们帮了我，我们已经是一起患过难、永远不分开的兄弟了。我的主意是，让杰拉尔德去集市表演魔术。
        - id: ch01-b153
          speaker: kathleen
          text: 可他根本不会变魔术。
        - id: ch01-b154
          speaker: princess
          text: 真正变魔术的人是我，只要让观众以为是杰里在变就行。比如他不用手碰，东西也会自己移动。不过你们三个不能全跟去。孩子越多，看起来年纪越小，别人也越会奇怪，为什么没有大人陪着。
        - id: ch01-b155
          speaker: gerald
          text: 技艺精湛的魔术师认为，这话很有道理。凯瑟琳和吉米可以混进人群，这样谁也不会起疑心。不过你们千万别露出认识我的样子，还得装得像是跟集市里的某几个大人一起来的。不然，和善的警察十有八九会牵起两个迷路孩子的手，把你们送回悲痛欲绝的亲人身边——我是说，送回法国女教师那里。
        - id: ch01-b156
          speaker: princess
          text: 那就现在出发吧。
        - id: ch01-b157
          speaker: narrator
          text: 他们始终不能习惯那个声音。梅布尔从一个地方走到另一个地方，话音也跟着从不同位置的空气里冒出来。不过大家还是立刻上了路。集市设在一片荒地上，离城堡大门大约半英里。等他们听见旋转木马的蒸汽风琴声，杰拉尔德提议用自己的九便士先买些吃的。花出去的钱，等表演魔术赚到钱后再补回来。
        - id: ch01-b158
          speaker: narrator
          text: 其他人在一条深陷的乡间小路上等着，两旁高高的土坡投下大片阴影。杰拉尔德其实很快就回来了，可在等待的人看来，他像是已经去了很久很久。他带回一大堆好东西，有巴塞罗那榛果、带着红纹的苹果、小小的甜黄梨、颜色苍白又黏软的姜饼、足足四分之一磅薄荷牛眼糖，还有两瓶姜汁啤酒。
        - id: ch01-b159
          speaker: kathleen
          text: 你买得也太多了。
        - id: ch01-b160
          speaker: gerald
          text: 这叫投资。大家都得吃得有营养，才有力气撑下去，尤其是那位勇敢的魔术师。
        - id: ch01-b161
          speaker: narrator
          text: 大家又吃又喝，这一餐实在美妙。远处蒸汽风琴的乐声飘过来，又给眼前的欢乐添上了最后一点味道。两个男孩怎么看梅布尔吃东西也看不够。说得更准确些，他们着迷的是食物怎样神秘地消失，因为梅布尔吃东西时，唯一看得见的就是这个。仅仅为了多享受几回食物消失的乐趣，他们硬塞给梅布尔的分量，远远超过了她本来应得的那一份。
        - id: ch01-b162
          speaker: gerald
          text: 我的天，这一招一定能震住所有人！
        - id: ch01-b163
          speaker: narrator
          text: 这一招果然震住了他们。吉米和凯瑟琳先走一步，到了集市就混进人群，尽量不引人注意。他们站在一个胖太太身旁，看她瞧别人掷球打椰子。没过多久，一个怪模怪样的人把双手插在口袋里，悠闲地穿过被众人踩得发黄的草地。地上飘得到处都是碎纸，还有英国集市上永远少不了的木棍和乱草。
        - id: ch01-b164
          speaker: narrator
          text: 那人正是杰拉尔德，可凯瑟琳和吉米起初几乎没有认出他。他摘掉领带，把原本束在白色法兰绒衣服外面的深红校围巾缠到头上，弄得像一顶真正的头巾。至于那条领带，大概已经被他改成手帕了。更吓人的是，他的脸和双手全涂成了亮黑色，活像一只刚刚擦得锃亮的炉子。难怪一路上的人全都转头盯着他看。
        - id: ch01-b165
          speaker: jimmy
          text: 他还真像个魔术师。我看那层黑色一辈子也洗不掉，你觉得呢？
        - id: ch01-b166
          speaker: narrator
          text: 姐弟俩远远跟着。杰拉尔德来到一顶小帐篷前，一个长脸、满面愁苦的女人正靠着门柱。他们停在不远处，装成旁边一位农夫家的孩子。那农夫挥着大木槌，拼命砸一块木头，想把号码打上去。
        - id: ch01-b167
          speaker: gerald
          text: 生意赚得多吗？
        - id: ch01-b168
          speaker: show_woman
          text: 别这么没大没小，快走开。
        - id: ch01-b169
          speaker: gerald
          text: 我也是做生意的。我是从印度来的魔术师。
        - id: ch01-b170
          speaker: show_woman
          text: 就凭你？你才不是魔术师。你耳朵后面还是白的呢。
        - id: ch01-b171
          speaker: gerald
          text: 是吗？这都被你看出来了，真聪明。现在好点了吗？
        - id: ch01-b172
          speaker: narrator
          text: 他用手在耳朵后面擦了擦。
        - id: ch01-b173
          speaker: show_woman
          text: 这回行了。那你会什么小把戏？
        - id: ch01-b174
          speaker: gerald
          text: 我会的可不是小把戏，而是货真价实的魔术。在印度，比我年纪还小的男孩也有人干这一行。你刚才提醒了我耳朵的事，所以我欠你一个人情。只要你愿意替我张罗场面，再把帐篷借给我表演，我赚到的钱就分给你一份。
        - id: ch01-b175
          speaker: show_woman
          text: 哎哟，我可不会吆喝。你是在逗我吧？既然你这么有本事，先变一个给我看看。
        - id: ch01-b176
          speaker: gerald
          text: 没问题。看见这个苹果了吗？我能让它慢慢从空中飘过去。等我喊一声走，它就会消失。
        - id: ch01-b177
          speaker: show_woman
          text: 是啊，消失到你嘴里。少说胡话，快走吧。
        - id: ch01-b178
          speaker: gerald
          text: 你这么聪明，怎么偏偏不肯相信人？看好了。
        - id: ch01-b179
          speaker: narrator
          text: 杰拉尔德伸出一只小苹果。女人眼看着苹果没有任何东西托着，慢慢从空中飘了过去。
        - id: ch01-b180
          speaker: gerald
          text: 现在，走！怎么样？
        - id: ch01-b181
          speaker: narrator
          text: 苹果真的消失了。女人满脸通红，眼睛也亮起来。
        - id: ch01-b182
          speaker: show_woman
          text: 这是我这辈子见过最棒的！小伙计，你要是还有这种本事，我就跟你干。
          emotion: surprised
        - id: ch01-b183
          speaker: gerald
          text: 我会的多着呢。把手伸出来。
        - id: ch01-b184
          speaker: narrator
          text: 女人摊开手，那个苹果像从虚空中冒出来一样落进她掌心，只是有点湿。她盯着苹果看了一会儿。
        - id: ch01-b185
          speaker: show_woman
          text: 来吧，这生意只有我们两个能参加。不过别进帐篷，你就在旁边找块地方。露天表演能值两倍的钱。
        - id: ch01-b186
          speaker: gerald
          text: 可大家在外面白看够了，就不会付钱了。
        - id: ch01-b187
          speaker: show_woman
          text: 第一场是收不到多少，后面你就明白了。还有，招揽观众的话得由你自己说。
        - id: ch01-b188
          speaker: gerald
          text: 能把你的披肩借我用用吗？
        - id: ch01-b189
          speaker: narrator
          text: 女人解下一条红黑格披肩。杰拉尔德照着见过的印度魔术师，把它铺到地上，自己盘腿坐在后面。
        - id: ch01-b190
          speaker: gerald
          text: 只要别让人站到我身后就行。现在我准备好了。
        - id: ch01-b191
          speaker: narrator
          text: 女人赶紧把几只旧麻袋挂到帐篷的两根拉绳上，替杰拉尔德围出一小块不会有人站到背后的场地。他说自己已经准备好了，女人便从帐篷里搬出一面鼓，用力敲打起来。鼓声很快招来了路过的人。没过多久，一小群观众就聚到了杰拉尔德跟前。
        - id: ch01-b192
          speaker: gerald
          text: 女士们，先生们，我从印度来，要献上一场你们从没见过的魔术。等这条披肩上凑够两个先令，我就开始。
        - id: ch01-b193
          speaker: bystander
          text: 你当然得先收够钱喽！
        - id: ch01-b194
          speaker: narrator
          text: 人群发出几声短促又不怀好意的笑。这时围观的人已经有三十来个。
        - id: ch01-b195
          speaker: gerald
          text: 那当然。你们这么多人，要是连两个先令都凑不出来，我也没话可说。
        - id: ch01-b196
          speaker: narrator
          text: 两三个便士落上披肩，接着又来了几枚，然后这场铜币雨就停了。
        - id: ch01-b197
          speaker: gerald
          text: 九便士。好吧，我天生慷慨。你们只花九便士，就能看到一场从来没人用九便士看过的好戏。我不想欺骗各位，我确实有一个助手，不过你们看不见她。
        - id: ch01-b198
          speaker: narrator
          text: 人群哼哼起来。
        - id: ch01-b199
          speaker: gerald
          text: 有这位助手帮忙，不管你们当中是谁，只要口袋里装着一封信，我都能把信读出来。现在请一位观众跨过绳子，站到我身边。我的隐身助手会越过他的肩头，直接把口袋里的信念给大家听。
        - id: ch01-b200
          speaker: narrator
          text: 一个男人走上前来。他长着一张红脸，一看就是常跟马打交道的人。他从口袋里掏出一封信，当着所有人的面站到杰拉尔德身边。大家都看得清清楚楚，四周没有任何人能偷偷靠近，更不可能越过他的肩膀偷看信上的内容。
        - id: ch01-b201
          speaker: gerald
          text: 开始！
        - id: ch01-b202
          speaker: narrator
          text: 四周安静了片刻。接着，围场另一头响起一个轻轻的、遥远的拖长声音。
        - id: ch01-b203
          speaker: princess
          text: 先生，十五日来信已经收到。关于您那块土地的抵押，很抱歉，我们帮不上忙——
        - id: ch01-b204
          speaker: horseman
          text: 住口！
          emotion: angry
        - id: ch01-b205
          speaker: narrator
          text: 红脸男人气势汹汹地转向杰拉尔德，退出围场后，又不停解释信里根本没有这些话。可是谁也不信。人群兴奋地嗡嗡议论，直到杰拉尔德再次开口才停下来。
        - id: ch01-b206
          speaker: gerald
          text: 现在，请盯紧披肩上的九枚便士。它们会一枚接一枚地消失。
        - id: ch01-b207
          speaker: narrator
          text: 九枚便士当然全消失了。随后，梅布尔看不见的手又将它们一枚一枚放回来。人群大声鼓掌。前排叫着好，还喊着再来一个，后面的人则使劲往前挤。
        - id: ch01-b208
          speaker: gerald
          text: 现在你们已经见识过我的本领。除非这条毯子上有五个先令，否则我不会继续表演。
        - id: ch01-b209
          speaker: narrator
          text: 短短两分钟后，地上的钱已经有了七先令三便士，杰拉尔德便又接连变了好几手魔术。等站在前排的人不肯再掏钱，他就请他们往后退一退，让新来的人也能靠近看看。真希望我有足够的时间，把他表演过的所有魔术，一个接一个全都讲给你听。围场四周原本长着草，如今却被蜂拥而来的观众彻底踩秃了，连一片完整的草地也找不到。
        - id: ch01-b210
          speaker: narrator
          text: 只要有一个隐身助手，能变出来的奇迹简直没有尽头。各式各样的东西仿佛自己会动，还能一件件消失在梅布尔的衣褶里。帐篷女人站在旁边，眼看钱不断涌来，神色也变得越来越和善。每逢杰拉尔德停下来歇一会儿，她就敲响那面破旧的鼓，把人们的兴致再次挑起来。
        - id: ch01-b211
          speaker: narrator
          text: 魔术师的消息很快传遍了整个集市，人们佩服得简直发狂。经营掷球打椰子摊的男人央求杰拉尔德跟他合伙。气枪靶场的老板也来拉拢他，答应免费供他吃住，赚到的钱还可以分账。后来又来了一位精明爽利、身材宽阔的太太。她穿着硬挺的黑绸衣，头上戴一顶紫罗兰色女帽，也想聘请杰拉尔德参加即将举办的改过乐队队员义卖会。
        - id: ch01-b212
          speaker: narrator
          text: 这段时间，其他孩子一直混在人群里，完全没有人留意他们。除了杰拉尔德，大家哪里还有眼睛看别人呢？天已经很晚，远远过了喝茶时间。杰拉尔德累得筋疲力尽，对自己分到的那份钱也十分满意。现在唯一的问题，就是怎样脱身。他绞尽脑汁，却怎么也找不到一个能从人群中溜走的办法。
        - id: ch01-b213
          speaker: narrator
          text: 梅布尔摘下他的帽子，装进自己的口袋。帽子立刻从他头顶消失了。她动手时，杰拉尔德压低声音问她。
        - id: ch01-b214
          speaker: gerald
          text: 我们到底怎么溜出去？
        - id: ch01-b215
          speaker: princess
          text: 他们肯定不会放我们走。我刚才没想到这一点。让我想想……把钱分掉，再花钱买下那条披肩。把钱放在披肩上，然后你就这样说……
        - id: ch01-b216
          speaker: narrator
          text: 梅布尔凑近他的耳朵，把办法说了出来。杰拉尔德的场地设在帐篷阴影里。要不是这样，梅布尔走来走去让东西消失时，观众早就看见她的影子了。
        - id: ch01-b217
          speaker: narrator
          text: 杰拉尔德按照商量好的办法，请帐篷女人先把赚来的钱分掉。她虽然看着那些钱十分高兴，分起来倒很老实，一点也没有少给他。可是周围等得不耐烦的人已经越挤越近，不停催着他继续表演。
        - id: ch01-b218
          speaker: gerald
          text: 现在，我出五先令买下你的披肩。
        - id: ch01-b219
          speaker: show_woman
          text: 七先令六便士。
        - id: ch01-b220
          speaker: gerald
          text: 成交！
        - id: ch01-b221
          speaker: narrator
          text: 杰拉尔德把沉甸甸的那份钱塞进裤袋。
        - id: ch01-b222
          speaker: gerald
          text: 现在，这条披肩会消失。
        - id: ch01-b223
          speaker: narrator
          text: 他当众从地上拿起披肩，递到梅布尔看不见的手里。梅布尔把披肩往自己身上一裹，那条红黑格披肩自然立刻消失了。观众亲眼看见这一幕，雷鸣般的喝彩声顿时从人群中炸开。
        - id: ch01-b224
          speaker: gerald
          text: 接下来是最后一个魔术。我会向后退三步，然后彻底消失。
        - id: ch01-b225
          speaker: narrator
          text: 杰拉尔德当着所有人的面，认真向后退了整整三步。梅布尔赶紧用那条已经看不见的披肩裹住他，可杰拉尔德仍旧从头到脚都在那里，一点也没有消失。原来披肩虽然变得看不见了，却丝毫遮不住披在里面的人。
        - id: ch01-b226
          speaker: fair_boy
          text: 呸！快看他呀！他自己都知道变不了！
        - id: ch01-b227
          speaker: princess
          text: 真希望能把你装进我的口袋里。
        - id: ch01-b228
          speaker: narrator
          text: 人群还在不停向前逼，随时可能撞到梅布尔。一旦真的撞上，什么都可能发生——当真是任何事情。杰拉尔德双手揪住自己的头发，这是他焦急或泄气时惯有的动作。看不见的梅布尔也像书里常写的那样绞着双手。换成普通的话，就是把两只手紧紧握在一起，再用力地攥住。
        - id: ch01-b229
          speaker: princess
          text: 噢，松了！我能摘下来了！
          emotion: surprised
        - id: ch01-b230
          speaker: gerald
          text: 不是吧——
        - id: ch01-b231
          speaker: princess
          text: 是戒指。真的摘下来了。
        - id: ch01-b232
          speaker: farm_worker
          text: 来呀，小少爷！拿出点真本事，我们花的钱可不能白费。
        - id: ch01-b233
          speaker: gerald
          text: 会让你们看到的。这一次我真的会消失。绕到帐篷后面，把戒指从帆布底下塞给我，再从后面溜走，去找凯瑟琳他们。等我看见你跟他们会合，就开始消失。你们慢慢走，我会追上来。
        - id: ch01-b234
          speaker: narrator
          text: 不一会儿，一个脸色苍白、清清楚楚看得见的梅布尔贴近凯瑟琳耳边。
        - id: ch01-b235
          speaker: princess
          text: 是我。杰里已经拿到戒指了。快走，趁人群还没有散开。
        - id: ch01-b236
          speaker: narrator
          text: 他们走出集市大门时，身后忽然爆发出既惊讶又恼怒的叫喊。看来这一回，杰拉尔德真的消失了。
        - id: ch01-b237
          speaker: narrator
          text: 他们沿着路走出足足一英里，才终于听见后面传来一阵追赶的脚步声。大家一起停下来，回头朝来路张望，路上却连一个人影也没有。下一刻，杰拉尔德的声音突然从澄澈而空无一物的地方冒了出来，仿佛那声音一直独自在暮色中赶路，而且听上去闷闷不乐。
        - id: ch01-b238
          speaker: gerald
          text: 喂！
        - id: ch01-b239
          speaker: princess
          text: 真讨厌，你把我吓了一大跳！快摘掉戒指。只剩下一个声音，听着真让人毛骨悚然。
          emotion: fearful
        - id: ch01-b240
          speaker: jimmy
          text: 你刚才也是这样吓我们的。
        - id: ch01-b241
          speaker: kathleen
          text: 先别摘。我猜你身上还涂着黑铅。万一有人认出你，再叫吉卜赛人把你拐走，让你永远替他们变魔术呢？
        - id: ch01-b242
          speaker: jimmy
          text: 还是摘下来吧。别人看见我们跟梅布尔走在一起，却看不见你，准会以为是我们把她拐走了。隐身还有什么用？
        - id: ch01-b243
          speaker: princess
          text: 没错，那样蠢透了。再说，我要拿回自己的戒指。
        - id: ch01-b244
          speaker: jimmy
          text: 那枚戒指并不比属于我们更属于你。
        - id: ch01-b245
          speaker: princess
          text: 它就是我的。
        - id: ch01-b246
          speaker: gerald
          text: 别吵了。这样争来争去有什么用？
        - id: ch01-b247
          speaker: princess
          text: 我要那枚戒指。
        - id: ch01-b248
          speaker: narrator
          text: 梅布尔说得很固执。宁静的暮色中，杰拉尔德疲倦的声音回答了她。
        - id: ch01-b249
          speaker: gerald
          text: 光说“我要”，可不能让它听你的。戒指没法还给你。我也摘不下来了！
