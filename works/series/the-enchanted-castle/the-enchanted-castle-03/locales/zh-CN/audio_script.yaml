audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 讲究而端庄，偶尔流露笑意
        timbre: 轻盈成熟的女声
        pace: 从容
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 朴实爽快，受惊时喃喃自语
        timbre: 年轻质朴的女声
        pace: 自然偏快
        pitch: 中音
    aunt:
      display_name: 梅布尔的姨妈
      tts:
        delivery: 文雅疏离，沉浸在浪漫幻想里
        timbre: 纤细成熟的女声
        pace: 从容
        pitch: 中音
    cart_woman:
      display_name: 赶车女人
      tts:
        delivery: 直嗓门，带乡间口音
        timbre: 粗亮的女声
        pace: 稍快
        pitch: 中音
    show_woman:
      display_name: 帐篷女人
      tts:
        delivery: 世故爽利，兴奋时热切
        timbre: 略带沙哑的女声
        pace: 明快
        pitch: 中低音
    bystander:
      display_name: 旁观者
      tts:
        delivery: 怀疑而爱起哄
        timbre: 普通成年男声
        pace: 自然
        pitch: 中音
    horseman:
      display_name: 红脸男人
      tts:
        delivery: 粗直警觉，恼火时强硬
        timbre: 粗壮的男声
        pace: 自然
        pitch: 中低音
    fair_boy:
      display_name: 集市男孩
      tts:
        delivery: 起哄嘲笑，嗓门响亮
        timbre: 尖亮的男孩声
        pace: 快
        pitch: 高音
    farm_worker:
      display_name: 农场工人
      tts:
        delivery: 粗声催促，毫不客气
        timbre: 厚重的男声
        pace: 稍快
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你要是常跟一个隐身伙伴四处走动，就会知道这事有多别扭。明明确信对方真的看不见了，心里却总冒出一句：这一定是梦，我马上就会醒。杰拉尔德、凯瑟琳和吉米坐在白大理石的花神殿里，望着阳光下的园子，听那位中了魔法的公主说话时，就是这种感觉。她其实只是女管家的外甥女梅布尔·普劳斯。不过照吉米的说法，她中了魔法这件事倒是真的。
        - id: ch01-b02
          speaker: princess
          text: 说什么都没有用了。我压根没信过真会出事，可它偏偏发生了。
        - id: ch01-b03
          speaker: gerald
          text: 那我们能帮你做什么吗？要是帮不上，我想我们也该回去了。
        - id: ch01-b04
          speaker: jimmy
          text: 对呀，我还等着喝茶呢！
        - id: ch01-b05
          speaker: princess
          text: 喝茶？你们把我害成这个样子，竟然想丢下我，自己回去喝茶？
        - id: ch01-b06
          speaker: gerald
          text: 我还从没见过这么不讲理的公主——
        - id: ch01-b07
          speaker: kathleen
          text: 别逗她了。一个人突然变得谁也看不见，一定难受极了。
        - id: ch01-b08
          speaker: princess
          text: 我姨妈本来就不怎么喜欢我。她不准我去集市，就因为我拿出伊丽莎白女王穿过的一只旧鞋试了试，却忘记放回玻璃柜里。
        - id: ch01-b09
          speaker: kathleen
          text: 那只鞋你穿得下吗？
        - id: ch01-b10
          speaker: princess
          text: 怎么可能，实在太小了。我看它从前也没合过任何人的脚。
        - id: ch01-b11
          speaker: jimmy
          text: 可我真的很想喝茶！
        - id: ch01-b12
          speaker: gerald
          text: 说实话，我们留在这里也帮不了你，或许真该走了。
        - id: ch01-b13
          speaker: kathleen
          text: 你得把这件事告诉姨妈。
        - id: ch01-b14
          speaker: princess
          text: 不要，千万不要！带我一起走吧。我留张字条，就说我逃去坐船出海了。
          emotion: fearful
        - id: ch01-b15
          speaker: jimmy
          text: 女孩子哪会逃去当水手。
        - id: ch01-b16
          speaker: princess
          text: 女孩子也能偷乘船呀。没人肯要见习水手，我就做见习女水手。
        - id: ch01-b17
          speaker: kathleen
          text: 我还是觉得你不该这么做。
        - id: ch01-b18
          speaker: princess
          text: 那你说，我还能怎么办？
        - id: ch01-b19
          speaker: gerald
          text: 我也想不出她该怎么办。要不让她跟我们回去，吃点——
        - id: ch01-b20
          speaker: jimmy
          text: 茶！好主意！
        - id: ch01-b21
          speaker: gerald
          text: 再开个会，好好商量。
        - id: ch01-b22
          speaker: jimmy
          text: 先喝茶，后开会。
        - id: ch01-b23
          speaker: kathleen
          text: 可她姨妈会发现她不见了，还会以为她出了什么事。
        - id: ch01-b24
          speaker: princess
          text: 我留在这里，她照样会发现。我也的确出了事。
        - id: ch01-b25
          speaker: jimmy
          text: 哎呀，先走吧。
        - id: ch01-b26
          speaker: kathleen
          text: 她还会报警，叫警察到处找你。
        - id: ch01-b27
          speaker: gerald
          text: 警察永远也找不到她。这才算真正无懈可击的乔装。
        - id: ch01-b28
          speaker: princess
          text: 我姨妈宁愿永远见不到我，也不会愿意见我这副样子。她受不了，说不定会送命，她本来就会抽风。我要写封信，出去时投进门口的大信箱。谁有纸笔？
        - id: ch01-b29
          speaker: narrator
          text: 杰拉尔德正好带着一本特殊的笔记簿。那种光滑的纸不能用普通铅笔，非得拿一根尖端嵌铅的象牙小棒来写，而且那支笔写在别的纸上又不显字。赶时间时，它常常叫人气恼。此刻，象牙小棒斜着立在空中，像平常有人握着一样，独自在纸上移动。
        - id: ch01-b30
          speaker: kathleen
          text: 我们能在旁边看吗？我们不能看吗？
        - id: ch01-b31
          speaker: narrator
          text: 铅笔没有停，也没有回答。
        - id: ch01-b32
          speaker: princess
          text: 当然能看！我刚才不是点头了吗？噢，我忘记了，你们连我点头也看不见。
        - id: ch01-b33
          speaker: narrator
          text: 圆圆的字母一个接一个落在撕下来的纸页上。梅布尔在信里告诉姨妈，一位坐汽车的太太收养了她，正带她去海边乘船。姨妈不必追赶，只管幸福地生活，还祝她在集市玩得愉快。信末署着梅布尔的名字。
        - id: ch01-b34
          speaker: jimmy
          text: 可这些话全是假的。
        - id: ch01-b35
          speaker: princess
          text: 这不叫撒谎，叫想象。就算我老实写自己隐身了，她也会认定我在撒谎。
        - id: ch01-b36
          speaker: jimmy
          text: 走吧。要吵架，边走也能吵。
        - id: ch01-b37
          speaker: narrator
          text: 杰拉尔德照一位印度太太多年前教他的办法折好信。梅布尔另选了一条近得多的路，领大家出了园子，回家的路程也一下短了许多。他们离开花神殿时，天空已经阴了。等赶到家，第一滴雨落了下来，喝茶的时间也早就过了。
        - id: ch01-b38
          speaker: mademoiselle
          text: 你们怎么迟了这么久！是不是遇到了不幸？大家都平安吗？
          emotion: surprised
        - id: ch01-b39
          speaker: gerald
          text: 实在对不起。回来的路比预想中久。希望您没有担心，我一路上大半时间都在想着您。
        - id: ch01-b40
          speaker: mademoiselle
          text: 那就快进去吧。今天的茶点和晚饭一起吃。
        - id: ch01-b41
          speaker: narrator
          text: 他们果真把两顿合成了一顿。法国女教师离开后，桌上只剩面包黄油、牛奶和烤苹果。
        - id: ch01-b42
          speaker: princess
          text: 你怎么能说一路都在想她？这跟我说自己被汽车太太收养一样，也是谎话。
        - id: ch01-b43
          speaker: gerald
          text: 不一样。我一直在想，她会不会大发脾气。所以我说的是真话。
        - id: ch01-b44
          speaker: narrator
          text: 桌上只有三只盘子，吉米把自己的让给梅布尔，改跟凯瑟琳合用。面包黄油悬在空中，一口一口地消失。装着苹果的勺子自己升起，落回盘子时已经空了。连勺尖送进梅布尔嘴里也会看不见，有时就像勺头忽然断掉。大家全饿坏了，只好不断添面包黄油。盘子第三次装满时，厨娘已经开始抱怨。
        - id: ch01-b45
          speaker: jimmy
          text: 看吧，我早就说了，我真的需要喝茶。
        - id: ch01-b46
          speaker: gerald
          text: 明早给梅布尔吃东西才叫难。法国女教师会在场。她要是看见叉子上的熏肉一截截不见，空叉子又从虚无里退回来，准会当场抽风。
        - id: ch01-b47
          speaker: kathleen
          text: 那我们就买些吃的，偷偷喂养这位可怜的俘虏。
        - id: ch01-b48
          speaker: jimmy
          text: 我们的钱撑不了几天。梅布尔，你自己有钱吗？
        - id: ch01-b49
          speaker: narrator
          text: 吉米对着悬在半空的一杯牛奶发问。
        - id: ch01-b50
          speaker: princess
          text: 钱没有多少，主意倒多得很。
        - id: ch01-b51
          speaker: kathleen
          text: 明早再商量吧。我们先去道晚安，然后你睡我的床。梅布尔，我借你一件睡衣。
        - id: ch01-b52
          speaker: princess
          text: 我明天回去拿自己的。
        - id: ch01-b53
          speaker: kathleen
          text: 你还要回去取东西？
        - id: ch01-b54
          speaker: princess
          text: 有什么不行？反正谁也看不见我。我已经想到好多有趣的事了。隐身其实挺不错。
        - id: ch01-b55
          speaker: narrator
          text: 凯瑟琳眼看着公主服从虚空中一件件出现。轻纱面罩先悬在半空，闪亮的冠冕接着落在五斗柜顶上。粉红长裙的一只袖子、另一只袖子，也逐一显形。最后，整条裙子亮晶晶地围在地上，因为看不见的双腿已经迈了出去。梅布尔脱掉什么，什么就重新出现。她一拿起睡衣，睡衣却从一头开始慢慢消失。
        - id: ch01-b56
          speaker: kathleen
          text: 快上床吧。
        - id: ch01-b57
          speaker: narrator
          text: 床铺吱呀一声，枕头凹了下去。凯瑟琳关上煤气灯，也钻进被窝。这一晚的魔法让她有些不安，还有那么一点害怕，可黑暗反倒叫人安心。梅布尔立刻搂住她。两个小姑娘在黑暗中亲吻，因为只有在那里，看得见和看不见的人才站在同一边。
        - id: ch01-b58
          speaker: princess
          text: 晚安，凯茜。你对我实在太好了，我不会忘记。男孩子们在场时，我不敢说，因为他们觉得感恩的人没出息。可我真的很感激你。晚安。
          emotion: calm
        - id: ch01-b59
          speaker: narrator
          text: 凯瑟琳迟迟没有睡着。刚有睡意，她想起早晨来叫她们的女仆会看到那套公主服。
        - id: ch01-b60
          speaker: kathleen
          text: 我还得起床藏衣服。真麻烦！
        - id: ch01-b61
          speaker: narrator
          text: 她想着有多麻烦，竟不知不觉睡着了。再睁眼时天已大亮，伊莱扎站在椅子前，盯着衣服堆最上面的粉红公主裙。
        - id: ch01-b62
          speaker: eliza
          text: 老天呀！
          emotion: surprised
        - id: ch01-b63
          speaker: kathleen
          text: 请别碰！
        - id: ch01-b64
          speaker: eliza
          text: 这东西究竟是从哪儿来的？
        - id: ch01-b65
          speaker: kathleen
          text: 别人借给我的，我们准备拿它演戏。
        - id: ch01-b66
          speaker: eliza
          text: 那也给我看看嘛，小姐。
        - id: ch01-b67
          speaker: kathleen
          text: 现在不行！等大家装扮好了，你再来看演出。你可千万别告诉别人。
        - id: ch01-b68
          speaker: eliza
          text: 你乖乖听话，我就不说。不过你们装扮时，一定得让我瞧。可是——
        - id: ch01-b69
          speaker: narrator
          text: 门铃突然响了。邮差到了，伊莱扎特别想见他，只好马上离开。
        - id: ch01-b70
          speaker: kathleen
          text: 这下我们非演戏不可了。为什么每件事都这么难办？
        - id: ch01-b71
          speaker: princess
          text: 演戏不难呀，我一定会喜欢。
        - id: ch01-b72
          speaker: narrator
          text: 一只没人拿着的长袜在空中摆动，很快便消失了。
        - id: ch01-b73
          speaker: kathleen
          text: 你忘啦？女演员要是看不见，除非演魔法戏，否则根本没法登台。
        - id: ch01-b74
          speaker: princess
          text: 噢，我想到一个绝妙的主意！
          emotion: happy
        - id: ch01-b75
          speaker: kathleen
          text: 吃完早饭再讲。还有，我真希望你没对姨妈撒下那么大的谎。不管为了什么，我们都不该撒谎。
        - id: ch01-b76
          speaker: narrator
          text: 脸盆里的水哗哗溅起，又从看不见的地方滴落回去。
        - id: ch01-b77
          speaker: princess
          text: 如果说了真话也没人相信，那还有什么用？
        - id: ch01-b78
          speaker: kathleen
          text: 我说不上来，可我们还是应该讲真话。
        - id: ch01-b79
          speaker: princess
          text: 那你愿意说就去说吧。
        - id: ch01-b80
          speaker: narrator
          text: 声音从洗脸架前一条独自挥动的毛巾里冒了出来。
        - id: ch01-b81
          speaker: kathleen
          text: 好，我们一吃完早——我是说，一吃完自己的早饭，就去说。你留在楼上，等我们找来食物。伊莱扎铺床时，记得躲开她。
        - id: ch01-b82
          speaker: narrator
          text: 梅布尔倒很喜欢这个游戏。伊莱扎不留神时，她便把塞好的床单和毯角扯出来。
        - id: ch01-b83
          speaker: eliza
          text: 这些鬼被褥！简直像中了邪一样。
        - id: ch01-b84
          speaker: narrator
          text: 伊莱扎还想寻找清早见过的公主服。凯瑟琳却早已把它们塞到床垫底下，因为她知道伊莱扎从来不翻那里。女仆匆匆扫起地上的绒毛。那些绒毛不知从何而来，再整洁的人家也少不了。梅布尔饿着肚子，等其他人吃早饭等了太久，终于忍不住凑到伊莱扎耳边。
        - id: ch01-b85
          speaker: princess
          text: 垫子底下也要扫。
        - id: ch01-b86
          speaker: narrator
          text: 伊莱扎吓得一哆嗦，脸色也白了。
        - id: ch01-b87
          speaker: eliza
          text: 我一定快要疯了。可妈妈从前总这样说。千万别让我像艾米莉姨妈一样发疯。人的脑子可真会胡思乱想啊。
          emotion: fearful
        - id: ch01-b88
          speaker: narrator
          text: 她到底掀开炉前小毯子，把下面和炉栏底下都扫得干干净净。凯瑟琳带着杰拉尔德从食品储藏室窗口弄来的大块面包进屋，发现她不仅扫得格外彻底，脸色也格外苍白。
        - id: ch01-b89
          speaker: kathleen
          text: 还没弄完吗？伊莱扎，你看起来很不舒服。出什么事了？
        - id: ch01-b90
          speaker: eliza
          text: 我只是想把房间彻底收拾一遍。
        - id: ch01-b91
          speaker: kathleen
          text: 没有什么事吓着你吧？
        - id: ch01-b92
          speaker: eliza
          text: 没事，小姐，是我又乱想了。我从小就这样，梦见珍珠大门，还有那些只长脑袋和翅膀的小天使。我总觉得，养他们可比养孩子省衣服。
        - id: ch01-b93
          speaker: narrator
          text: 伊莱扎终于走了。梅布尔吃掉面包，又拿漱口杯喝水。
        - id: ch01-b94
          speaker: kathleen
          text: 水里恐怕带着樱桃牙膏味。
        - id: ch01-b95
          speaker: princess
          text: 没关系，比白水有趣。我猜歌谣里的红葡萄酒，差不多就是这种味道。
        - id: ch01-b96
          speaker: kathleen
          text: 今天我们又请到一天假。杰拉尔德也赞成不撒谎，所以我们要去把你的实情告诉姨妈。
        - id: ch01-b97
          speaker: princess
          text: 她不会信的。
        - id: ch01-b98
          speaker: kathleen
          text: 只要说的是实话，她信不信都不要紧。
        - id: ch01-b99
          speaker: princess
          text: 你们准会后悔。不过走吧。出门时别再拿门夹我，刚才差一点就夹到了。
