audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 温柔热情，中文里带一点轻巧的外国口音
        timbre: 柔和明净的年轻女声
        pace: 从容
        pitch: 中音
    ugly_respectable:
      display_name: 体面的丑八怪
      tts:
        delivery: 彬彬有礼，含混的吐字里带着中年绅士的笃定
        timbre: 空洞柔闷的成年男声
        pace: 稍慢
        pitch: 中低音
    bailiff:
      display_name: 庄园管家
      tts:
        delivery: 爽朗沉着，温和里透着敏锐和坚定
        timbre: 清晰浑厚的成年男声
        pace: 从容
        pitch: 中低音
    office_boy:
      display_name: 办公室跑腿男孩
      tts:
        delivery: 精明爽快，带着街头孩子的机警和调侃
        timbre: 略带沙哑的少年声
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 花神殿前
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 事情已经再明白不过了。倒霉的庄园管家开门时，魔法还没消退，那些丑八怪也还不只是外套、帽子和木棍。它们一拥而上，把他打成这样。他躺在地上，完全失去了知觉。杰拉尔德看着他额头上吓人的伤口，暗自猜测，打中他的究竟是高尔夫球杆，还是曲棍球杆。姑娘们早已跑到伤者身边，梅布尔抢先一步，让他的头枕在自己膝上。凯瑟琳也想让他枕着自己的膝盖，可她慢了一步。
        - id: ch01-b02
          speaker: narrator
          text: 不用梅布尔不耐烦地喊着要水，两个男孩也知道，救醒昏迷的人，头一样要紧的就是水。
        - id: ch01-b03
          speaker: jimmy
          text: 可拿什么装水？
        - id: ch01-b04
          speaker: narrator
          text: 吉米看看空着的两只手，又看看绿坡下面那座围着大理石、浮满睡莲的水池。
        - id: ch01-b05
          speaker: princess
          text: 用你的帽子呀。随便拿什么都行。
        - id: ch01-b06
          speaker: narrator
          text: 两个男孩转身朝水池走去。
        - id: ch01-b07
          speaker: jimmy
          text: 要是它们追过来呢？
        - id: ch01-b08
          speaker: gerald
          text: 你说什么会追来？
        - id: ch01-b09
          speaker: narrator
          text: 杰拉尔德听起来不像在问，倒像在训人。
        - id: ch01-b10
          speaker: jimmy
          text: 那些丑八怪。
        - id: ch01-b11
          speaker: gerald
          text: 谁怕它们了？
        - id: ch01-b12
          speaker: narrator
          text: 可话一说完，他还是极其仔细地看了看左右，特意挑了一条不挨近灌木丛的路。他用草帽舀起水，两手小心地捧稳，再带回花神殿。眼看水正飞快地从草缝里漏掉，他只好用牙齿从胸前口袋扯出手帕，丢进帽子里。姑娘们就是用这块湿手帕，擦掉了庄园管家额头上的血。
        - id: ch01-b13
          speaker: kathleen
          text: 我们应该有嗅盐的。我知道救人该用嗅盐。
          emotion: sad
        - id: ch01-b14
          speaker: princess
          text: 有嗅盐当然更好。
        - id: ch01-b15
          speaker: kathleen
          text: 你姨妈那里没有吗？
        - id: ch01-b16
          speaker: princess
          text: 有是有，可是……
        - id: ch01-b17
          speaker: gerald
          text: 别胆小。想想昨晚，它们不会伤你的。这位先生一定是侮辱了它们，或者做了别的什么。你快跑一趟，我们保证不让任何东西追上你。
        - id: ch01-b18
          speaker: narrator
          text: 梅布尔只好把这位很引人注目的病人交给凯瑟琳。她狠狠瞪了杜鹃花围着的山坡一眼，便飞快跑向城堡。其余三个孩子俯下身，围着仍旧昏迷的庄园管家。
        - id: ch01-b19
          speaker: jimmy
          text: 他不会死了吧？
          emotion: fearful
        - id: ch01-b20
          speaker: kathleen
          text: 不会，他的心还在跳。我和梅布尔摸过他的手腕，医生就是摸那里的。他长得真俊！
        - id: ch01-b21
          speaker: gerald
          text: 是还不错。
        - id: ch01-b22
          speaker: jimmy
          text: 我一直弄不懂，你们说一个人长得俊，到底是什么意思。
        - id: ch01-b23
          speaker: narrator
          text: 就在这时，一道影子落到他们身边的大理石地面上，第四个声音响了起来。那不是梅布尔，她奔跑的身影还远在别处。孩子们抬头一看，正对上年纪最大的那位体面丑八怪的脸。吉米和凯瑟琳真的尖叫了起来。
        - id: ch01-b24
          speaker: gerald
          text: 嘘！都别出声，我会把他弄走。
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 戒指还在杰拉尔德手上，他说完又压低了声音。
        - id: ch01-b26
          speaker: ugly_respectable
          text: 这件事实在令人难过。
          emotion: sad
        - id: ch01-b27
          speaker: narrator
          text: 丑八怪的卷舌音很古怪，发起姆和恩来，又像患了难熬的重感冒。不过，他已经不再只会发出昨夜那种呜呜啊啊的声音了。凯瑟琳和吉米弯腰去看庄园管家。眼前这个倒在地上的身体，毕竟属于一个人，多少让他们觉得有了保护。杰拉尔德仗着戒指给他的无畏，直盯着丑八怪，忽然吃了一惊。
        - id: ch01-b28
          speaker: narrator
          text: 那张脸还很像他亲手画在学校图画纸上的样子，可它已经不再是纸，而是一张真正的脸。那双手尽管瘦得近乎透明，也是真正的手。丑八怪稍稍挪动，好把地上的人看得更清楚，孩子们这才明明白白看见，他有活生生的腿和胳膊，还有一根能自己支撑身体的脊梁。他已经彻彻底底活了，再也不是一个用杂物撑起来的空架子。
        - id: ch01-b29
          speaker: gerald
          text: 这到底是怎么回事？
        - id: ch01-b30
          speaker: narrator
          text: 杰拉尔德努力让自己镇定，而且真的做到了。
        - id: ch01-b31
          speaker: ugly_respectable
          text: 万分遗憾。昨夜其他人在通道里走错了路，一直没能找到旅馆。
        - id: ch01-b32
          speaker: gerald
          text: 那您找到了？
          emotion: surprised
        - id: ch01-b33
          speaker: ugly_respectable
          text: 当然找到了。那地方非常体面，和你说的一模一样。今天白天，我想再看看林子里的景色。旅馆的人又讲不清该怎么走，我就没从正门离开。到了这里，我发现其他人全守在门边，气得不得了。他们整夜困在那里，想尽办法也出不去。后来门开了，应该就是这位先生开的。我还来不及护住他，那个戴高礼帽、没有教养的家伙，你还记得吧？
        - id: ch01-b34
          speaker: narrator
          text: 杰拉尔德当然记得。
        - id: ch01-b35
          speaker: ugly_respectable
          text: 那家伙朝他头上打了一下，他就倒在这里了。其他人四散走掉，我正要找人帮忙，恰好看见了你们。
        - id: ch01-b36
          speaker: narrator
          text: 这时大家才发现吉米哭了，凯瑟琳的脸白得像图画纸。
        - id: ch01-b37
          speaker: ugly_respectable
          text: 怎么了，小伙子？
        - id: ch01-b38
          speaker: narrator
          text: 他问得很和气，吉米却一下从流泪变成了号啕大哭。
        - id: ch01-b39
          speaker: gerald
          text: 来，把戒指戴上！
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: 杰拉尔德硬把戒指套上吉米又热又湿、拼命躲闪的手指。吉米那声哭号才喊到一半，忽然就停住了。杰拉尔德心里像闪过一道冷光，终于明白梅布尔昨夜经历的是什么滋味。不过现在是白天，而且杰拉尔德并不是胆小鬼。
        - id: ch01-b41
          speaker: gerald
          text: 我们得把其他人找出来。
        - id: ch01-b42
          speaker: ugly_respectable
          text: 我猜他们大概去洗澡了。他们的衣服都在树林里。
        - id: ch01-b43
          speaker: narrator
          text: 他僵硬地抬起手，朝树林指了指。
        - id: ch01-b44
          speaker: gerald
          text: 你们两个去看看。我留下来，继续给这家伙擦脑袋。
        - id: ch01-b45
          speaker: narrator
          text: 戴上戒指以后，吉米像狮子一样什么也不怕。他在树林里找到四堆衣服，还有扫帚柄、曲棍球杆和面具，一样都不少。那正是昨夜用来做成几个男丑八怪的全部东西。两个女丑八怪还坐在一张晒得到太阳的石凳上，凯瑟琳小心翼翼地走近。我们都知道，阳光底下的勇气总比黑夜里容易找。她和吉米一直走到凳边，才看出那不过是他们从前常做的那种丑八怪，身上一点生气也没有。吉米把它们抖得散了架，凯瑟琳这才长长松了口气。
        - id: ch01-b46
          speaker: kathleen
          text: 你看，魔法已经消失了。那位老先生肯定是真人，只是碰巧长得像我们做的丑八怪。
        - id: ch01-b47
          speaker: jimmy
          text: 可他穿的就是门厅里挂过的那件外套。
        - id: ch01-b48
          speaker: kathleen
          text: 不，只是长得很像。我们还是回去看看那个昏迷的陌生人吧。
        - id: ch01-b49
          speaker: narrator
          text: 他们回到花神殿。杰拉尔德请老丑八怪和吉米一起退进灌木丛。
        - id: ch01-b50
          speaker: gerald
          text: 我看可怜的庄园管家快醒了。要是睁眼就见到陌生人，他也许会受刺激。吉米陪您去，他是我们当中最适合陪您的人。
        - id: ch01-b51
          speaker: narrator
          text: 最后一句是杰拉尔德匆忙添上的。吉米戴着戒指，这话自然一点也不假。两人消失在杜鹃花后面。庄园管家睁开眼睛时，梅布尔也正好拿着嗅盐赶回来。
        - id: ch01-b52
          speaker: princess
          text: 事情总是这样，我这趟算是白跑了。不过……
        - id: ch01-b53
          speaker: narrator
          text: 她立刻跪下，把小瓶送到伤者鼻子下面，直到他打出一个喷嚏，虚弱地推开她的手。
        - id: ch01-b54
          speaker: bailiff
          text: 这回又出了什么事？
        - id: ch01-b55
          speaker: gerald
          text: 您的头受伤了，先躺着别动。
        - id: ch01-b56
          speaker: bailiff
          text: 别再把嗅瓶拿过来了。
        - id: ch01-b57
          speaker: narrator
          text: 他有气无力地说完，又躺了回去。没过多久，他坐起身看着四周，孩子们全都担心得不敢说话。这个大人知道昨夜的秘密。他们一点也拿不准，假如一个人做出了丑八怪，还让它们获得危险、好斗又愤怒的生命，法律究竟会怎样严厉地处罚。就算做这件事的人年纪很小，恐怕也未必能逃过去。他会说什么，又会做什么呢？
        - id: ch01-b58
          speaker: bailiff
          text: 真奇怪！我昏过去很久了吗？
        - id: ch01-b59
          speaker: princess
          text: 有好几个钟头呢。
        - id: ch01-b60
          speaker: kathleen
          text: 没有多久。
        - id: ch01-b61
          speaker: gerald
          text: 我们也不知道。发现您的时候，您已经这样了。
        - id: ch01-b62
          speaker: bailiff
          text: 我已经没事了。哎呀，我这一下撞得可真重。是你们替我做的急救吧？太谢谢你们了。不过，这件事还真奇怪。
        - id: ch01-b63
          speaker: narrator
          text: 他的目光落在了染血的手帕上。
        - id: ch01-b64
          speaker: gerald
          text: 什么事情奇怪？
        - id: ch01-b65
          speaker: narrator
          text: 礼貌逼得杰拉尔德只能问上一句。
        - id: ch01-b66
          speaker: bailiff
          text: 其实也许并不奇怪。我昏倒以前，不管当时出了什么事，大概刚见过你们。可昏迷的时候，我做了一个怪得不能再怪的梦，你们也在里面。
        - id: ch01-b67
          speaker: princess
          text: 梦里除了我们，就没有别的了吗？
        - id: ch01-b68
          speaker: narrator
          text: 梅布尔屏住呼吸问道。
        - id: ch01-b69
          speaker: bailiff
          text: 还有许多根本不可能存在的东西。不过你们倒是和梦里一模一样。
        - id: ch01-b70
          speaker: narrator
          text: 每个人都如释重负，深深吸了一口气。后来大家再谈起这件事时，一致觉得自己实在侥幸逃过了一劫。庄园管家站了起来，孩子们立刻齐声追问他是不是真的没事。
        - id: ch01-b71
          speakers: [gerald, jimmy, kathleen, princess]
          ensemble: chorus
          text: 您真的没事了吗？
        - id: ch01-b72
          speaker: bailiff
          text: 完全没事，谢谢你们。对了，我梦见花神像后面有一扇门，可那里当然没有。真不知道该怎么谢你们，幸亏你们从这里经过。以后你们什么时候想来都行，这地方任你们自由出入。
        - id: ch01-b73
          speaker: narrator
          text: 他说话时朝花神像背后望了一眼，随后又亲切地看着孩子们。
        - id: ch01-b74
          speaker: princess
          text: 您就是新来的庄园管家，对吗？
        - id: ch01-b75
          speaker: bailiff
          text: 是啊。你怎么会知道？
        - id: ch01-b76
          speaker: narrator
          text: 孩子们没有告诉他答案。他们反而问清楚他接下来要往哪边走，又热情地和他握过手。双方都说盼望不久以后再见，随后，孩子们便朝着和庄园管家完全相反的方向走去。
    - id: ch02
      title: 吉米变成了富翁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 孩子们望着庄园管家高大宽阔的身影越过滚烫的绿坡，渐渐变小。杰拉尔德先开了口。
        - id: ch02-b02
          speaker: gerald
          text: 听我说，你们想好今天怎么过了吗？我已经想好了。
        - id: ch02-b03
          speaker: narrator
          text: 其他人谁也没想好。
        - id: ch02-b04
          speaker: gerald
          text: 我们先想办法摆脱那个丑八怪。事情办完，就回家把戒指封进信封。这样它的牙就拔掉了，再也不能突然冒出恶作剧来折腾我们。然后我们爬上屋顶，安安静静看书、吃苹果。我告诉你们，我真受够冒险了。
        - id: ch02-b05
          speaker: narrator
          text: 其他人也说自己受够了。
        - id: ch02-b06
          speaker: gerald
          text: 那就想吧。拿出你们从来没有过的力气，好好想想怎么摆脱他。
        - id: ch02-b07
          speaker: narrator
          text: 大家真的都用力想起来。可焦虑和痛苦早已把他们的脑子折腾得疲惫不堪。好不容易想出的那些念头，用梅布尔的话说，连想都不值得，更不用说当众讲出来了。
        - id: ch02-b08
          speaker: kathleen
          text: 吉米不会出事吧？
        - id: ch02-b09
          speaker: gerald
          text: 他没事，戒指在他手上。
        - id: ch02-b10
          speaker: princess
          text: 但愿他别许下什么糟糕的愿望。
        - id: ch02-b11
          speaker: narrator
          text: 杰拉尔德叫她别出声，不要妨碍自己思考。
        - id: ch02-b12
          speaker: gerald
          text: 我看还是坐下来想最好。有时候把话讲出来，脑子会更清楚。那个丑八怪是真的，这一点不能弄错。他是在通道里变成真人的。要是能把他弄回去，也许他会恢复原样，我们就能把外套和那些东西带回家。
        - id: ch02-b13
          speaker: kathleen
          text: 就没有别的办法了吗？
        - id: ch02-b14
          speaker: princess
          text: 反正我绝不进那条通道！
        - id: ch02-b15
          speaker: gerald
          text: 大白天你也害怕！
        - id: ch02-b16
          speaker: princess
          text: 可通道里面又不是大白天。
        - id: ch02-b17
          speaker: narrator
          text: 凯瑟琳打了个寒战。
        - id: ch02-b18
          speaker: kathleen
          text: 要不我们走到他身边，突然把外套扯掉？他原本就是一堆衣服，没有外套，总不能还是真人吧。
        - id: ch02-b19
          speaker: gerald
          text: 为什么不能？你又不知道外套下面的他是什么模样。
        - id: ch02-b20
          speaker: narrator
          text: 凯瑟琳又哆嗦了一下。可他们说这些话时，太阳一直快活地照着。白色雕像、绿色树木、喷泉和一层层铺开的露台，也都显得那么愉快，那么浪漫，仿佛只是一幕精心摆在舞台上的布景。
        - id: ch02-b21
          speaker: gerald
          text: 不管了，我们先把他哄回通道，再关上门。这是最好的结果。接下来就是苹果和《鲁滨孙漂流记》，或者《瑞士家庭鲁滨孙》，随你们挑，只要没有魔法。现在我们非去不可。况且他已经不可怕了，真的。他已经变成真人了，你们明白吗？
        - id: ch02-b22
          speaker: princess
          text: 我想，变成真人以后，事情确实会不一样。
        - id: ch02-b23
          speaker: narrator
          text: 梅布尔努力说服自己相信这句话。
        - id: ch02-b24
          speaker: gerald
          text: 再说现在是白天。看看太阳，走吧！
        - id: ch02-b25
          speaker: narrator
          text: 他一手拉住一个女孩，三个人下定决心，朝吉米和丑八怪奉命等候的杜鹃花丛走去。一路上，杰拉尔德不停重复着那几句话。那是真人，太阳还照着，一转眼就会结束。他一遍遍地说，免得其中任何一点忽然出了差错。
        - id: ch02-b26
          speaker: narrator
          text: 他们走近灌木丛，闪闪发亮的叶片发出沙沙声，颤动着向两边分开。两个女孩还没来得及畏缩，吉米已经眨着眼睛，独自从里面走进阳光。枝条随即在他身后重新合拢。从那以后，叶片既没有再次晃动，也没有再发出一丝声响。第二个人始终没有出现，回来的只有吉米一个。
        - id: ch02-b27
          speakers: [kathleen, princess]
          ensemble: duo
          text: 他到哪儿去了？
        - id: ch02-b28
          speaker: jimmy
          text: 他正在一条冷杉小路上走来走去，拿着账簿算钱。他说自己富得吓人，非去伦敦那个股票什么所不可。那里的人只要够聪明，就能把纸变成金子。我挺想去看看那个股票变换所，你们不想吗？
        - id: ch02-b29
          speaker: gerald
          text: 我现在一点也不想看什么变换。我已经受够了。带我们去找他，我们非摆脱他不可。
        - id: ch02-b30
          speaker: narrator
          text: 吉米拨开被太阳晒暖、亮得像涂过清漆的杜鹃花叶，继续往前走。
        - id: ch02-b31
          speaker: jimmy
          text: 他还有汽车，有一座带网球场和湖的花园，也有马车和一对拉车的马。他去雅典度假，就像别人去马盖特一样随便。
        - id: ch02-b32
          speaker: gerald
          text: 最好的办法，是告诉他有条捷径能穿过昨晚那家旅馆。我们把他领进通道，推上一把，赶快跑出来，再关好门。
        - id: ch02-b33
          speaker: kathleen
          text: 可要是他真是人，就会在里面饿死。
        - id: ch02-b34
          speaker: gerald
          text: 我猜魔法不会维持太久，戒指的魔法一向很快就过去。反正我只能想到这个办法。
        - id: ch02-b35
          speaker: jimmy
          text: 他富得不得了。他给住处附近的人建公共图书馆，还要画一张自己的肖像挂进去。他觉得大家会喜欢。
        - id: ch02-b36
          speaker: narrator
          text: 吉米根本没在听他们商量。穿过灌木时，他还顶着枝条的噼啪声说个不停。他们来到一条平整的草径，两旁全是高大的松树和样子奇怪的冷杉。
        - id: ch02-b37
          speaker: jimmy
          text: 他就在那个弯道后面。他的钱多得满地乱滚，自己都不知道该怎么花。他还造了马饮水槽和一眼饮水泉，顶上放着自己的半身像。他怎么不在床边造个私人游泳池，早晨一醒，翻个身就能滚进去？我要是有钱，一定让他见识见识……
        - id: ch02-b38
          speaker: gerald
          text: 这个愿望倒是挺有道理。真奇怪，我们从前怎么没想到。哎呀，糟了！
          emotion: fearful
        - id: ch02-b39
          speaker: narrator
          text: 杰拉尔德叫得一点也没错。就在松林小径的绿荫下，四周安静得只能听见树叶的沙沙声，还有另外三个不幸的孩子急促的呼吸声，吉米的愿望实现了。变化来得迅速，可他们亲眼看着每一步发生，却说不清究竟发生了什么，更没有一点办法能够阻止。
        - id: ch02-b40
          speaker: narrator
          text: 吉米，这个从他们记事起就一起玩闹、争吵、又重新和好的伙伴，开始不停地变老。变化只用了几秒钟，可每一步都看得清清楚楚。他先长成少年，再成为青年，然后到了中年。接着，他仿佛猛地颤了一下，用一种说不清有多明确、又说不清有多可怕的方式，定格成一个上了年纪的绅士。他穿得体面，却有些过时，正隔着眼镜低头看他们。
        - id: ch02-b41
          speaker: jimmy
          text: 请问，最近的火车站往哪边走？
        - id: ch02-b42
          speaker: narrator
          text: 要不是亲眼看完这场变化的每一个可怕细节，孩子们绝对猜不到，这个肥胖、富足、上了年纪的绅士，就是他们自己的吉米。他戴着高礼帽，穿着长礼服外套，一枚大红印章垂在肥厚背心的弧线上。可他们既然亲眼看见了变化，就只能知道这个骇人的真相，再也没有办法骗自己。
        - id: ch02-b43
          speaker: princess
          text: 哦，吉米，别这样！
          emotion: fearful
        - id: ch02-b44
          speaker: gerald
          text: 这下真是糟透了。
        - id: ch02-b45
          speaker: narrator
          text: 凯瑟琳放声大哭。
        - id: ch02-b46
          speaker: jimmy
          text: 别哭了，小姑娘。还有你，小伙子，人家客气地问路，你就不能客气地回答吗？
        - id: ch02-b47
          speaker: kathleen
          text: 他不认识我们了！
          emotion: fearful
        - id: ch02-b48
          speaker: jimmy
          text: 谁不认识你们？
        - id: ch02-b49
          speaker: kathleen
          text: 是你！你已经不认识我们了！
          emotion: sad
        - id: ch02-b50
          speaker: jimmy
          text: 我的确不认识。但你也不必伤心成这个样子。
        - id: ch02-b51
          speaker: kathleen
          text: 吉米，吉米，吉米！
          emotion: sad
        - id: ch02-b52
          speaker: narrator
          text: 她哭得比刚才更响。
        - id: ch02-b53
          speaker: gerald
          text: 他的确忘了我们。可是听着，吉米，你不是故意逗我们吧？你要是在开玩笑，这就是最卑鄙的一次胡闹。
        - id: ch02-b54
          speaker: jimmy
          text: 我叫詹姆斯先生。
        - id: ch02-b55
          speaker: narrator
          text: 他准确地报出了自己的全名。这位突然发财的年老胖子原本是吉米，要是每次都称他为那个曾经是吉米的东西，未免太麻烦。以后，就把他简称为“那个”吧。
        - id: ch02-b56
          speaker: princess
          text: 我们该怎么办？哦，詹姆斯先生，不管您现在叫什么，请把戒指给我。
        - id: ch02-b57
          speaker: narrator
          text: 梅布尔先敬畏地低声问了一句，接着提高了声音。那枚要命的戒指，明明白白戴在“那个”的手指上。
        - id: ch02-b58
          speaker: jimmy
          text: 当然不行。你这个孩子好像非常贪心。
        - id: ch02-b59
          speaker: gerald
          text: 那您到底想怎么办？
        - id: ch02-b60
          speaker: narrator
          text: 杰拉尔德的声音平板极了，透着彻底的绝望。
        - id: ch02-b61
          speaker: jimmy
          text: 你的关心真让我受宠若惊。你们到底肯不肯告诉我，最近的火车站在哪里？
        - id: ch02-b62
          speaker: gerald
          text: 不肯。
        - id: ch02-b63
          speaker: jimmy
          text: 那么，也许你们愿意告诉我，最近的疯人院在哪里？
          emotion: angry
        - id: ch02-b64
          speaker: narrator
          text: “那个”仍然彬彬有礼，可显然已经气到了极点。
        - id: ch02-b65
          speaker: kathleen
          text: 不，不，不！您还没有糟糕到需要去那里！
        - id: ch02-b66
          speaker: jimmy
          text: 也许我不需要，可你们需要。你们就算不是疯子，也一定是傻瓜。前面有位先生，也许他的神志还算正常。事实上，我好像认识他。
        - id: ch02-b67
          speaker: narrator
          text: 果然，一位绅士正向他们走来，就是那个上了年纪的丑八怪。
        - id: ch02-b68
          speaker: kathleen
          text: 你不记得杰里了吗？也不记得凯茜，你自己的小猫咪凯茜？亲爱的吉米，别再犯傻了！
          emotion: sad
        - id: ch02-b69
          speaker: jimmy
          text: 小姑娘，很遗憾，看来没有人好好教过你礼貌。
        - id: ch02-b70
          speaker: narrator
          text: “那个”隔着眼镜恼怒地看她一眼，便僵直地走向丑八怪。两顶帽子同时举起，双方交谈了几句，两个上了年纪的人就并肩走上绿色的松林小径。三个悲惨的孩子跟在后面。他们心里又是恐惧，又是困惑，又是惊慌，又是无助。而真正比什么都糟的是，他们已经完全束手无策。
    - id: ch03
      title: 孩子们分头行动
      blocks:
        - id: ch03-b01
          speaker: gerald
          text: 他许愿发财，所以真的发财了。他会有钱买车票，也有钱买任何别的东西。等魔法消失以后，它一定会消失，对吧？到时候，他会发现自己落在某个可怕的地方，说不定是一家真正的好旅馆，却根本不知道自己怎么去的。
        - id: ch03-b02
          speaker: princess
          text: 不知道那些丑八怪活了多长时间。
        - id: ch03-b03
          speaker: gerald
          text: 对，你提醒我了。你们俩得把那些衣服和杂物都收起来，随便藏到什么地方。要是还有明天，我们明天再搬回家。
        - id: ch03-b04
          speaker: narrator
          text: 最后一句话，他说得阴沉沉的。
        - id: ch03-b05
          speaker: kathleen
          text: 别这样说！太阳明明这么好，谁能想到事情会变得这么可怕？
          emotion: fearful
        - id: ch03-b06
          speaker: gerald
          text: 我当然得跟着吉米。你们回法国女教师那里，告诉她，我和吉米跟一位先生坐火车走了。就说那人看着像我们的叔叔，他确实有一点像。后面肯定会闹翻天，可我们只能这么做。
        - id: ch03-b07
          speaker: kathleen
          text: 到处都挤满了谎话，一句真话都快塞不进去了。
        - id: ch03-b08
          speaker: gerald
          text: 别担心，那不算谎话。在我们碰上的这堆魔法胡闹里，它们和其他事情一样真实。就像人在梦里说谎，你根本没有办法。
        - id: ch03-b09
          speaker: kathleen
          text: 我只希望这一切快点停下来。
        - id: ch03-b10
          speaker: gerald
          text: 你这个愿望可真有用！再见，我得走，你们得留下。也许这样说能让你们好受些，我根本不相信这些事是真的。它不可能是真的，发生的事情实在太多了。告诉法国女教师，我和吉米会回来喝下午茶。要是没回来，我也没有办法。我帮不了别的，也许还能帮帮吉米。
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 杰拉尔德跑了起来。女孩们已经落到后面，丑八怪和从前的吉米却越走越快。梅布尔和凯瑟琳留在原地，看着他们远去。
        - id: ch03-b12
          speaker: princess
          text: 我们必须找到那些衣服。我以前总想当女英雄，可真的轮到自己，完全不是一回事，对不对？
        - id: ch03-b13
          speaker: kathleen
          text: 一点也不一样。找到衣服以后藏在哪里？不会是那条通道吧？
        - id: ch03-b14
          speaker: princess
          text: 绝对不行！藏进那头大石恐龙的肚子，它里面是空的。
        - id: ch03-b15
          speaker: kathleen
          text: 放进石头里，它们也可能活过来。
        - id: ch03-b16
          speaker: princess
          text: 阳光底下不会，没有戒指也不会。
        - id: ch03-b17
          speaker: kathleen
          text: 今天吃不成苹果，也看不成书了。
        - id: ch03-b18
          speaker: princess
          text: 是吃不成了。不过回家以后，我们要做一件最孩子气的事。我们办一场洋娃娃茶会。那样就会觉得，魔法根本不存在。
        - id: ch03-b19
          speaker: kathleen
          text: 那得是一场特别厉害的茶会才行。
        - id: ch03-b20
          speaker: narrator
          text: 这时，我们再去看看杰拉尔德。他小小却无比坚定的身影，正踩着阳光下松软洁白的道路尘土，跟在两位老绅士后面一路跋涉。他把手伸进裤袋，摸到一把沉甸甸、各种各样混在一起的硬币，心里很满意。这是他们在市集表演魔术赚来的钱，属于他的那一份利润。
        - id: ch03-b21
          speaker: narrator
          text: 他穿着走起路来没有声音的网球鞋，一路跟到车站，躲在售票处旁边。曾经名叫詹姆斯的“那个”买了一张去伦敦的头等票，又和丑八怪闲谈着走上站台。杰拉尔德这才客客气气买了一张去伦敦的三等往返票。火车尖叫着、喘息着，大步开进车站。两个被监视的人坐进铺着蓝色内衬的车厢，监视他们的人则跳上一节黄色木车厢。汽笛一响，旗子一挥，火车像收紧了全身，使劲挣扎起来。它猛地一顿，终于开动了。
        - id: ch03-b22
          speaker: gerald
          text: 我就是不明白，火车和魔法怎么能一起存在。
        - id: ch03-b23
          speaker: narrator
          text: 可它们偏偏就能。
        - id: ch03-b24
          speaker: narrator
          text: 另一边，梅布尔和凯瑟琳提心吊胆地搜遍杜鹃花、蕨草和那些怪模怪样的冷杉，找出了六堆各不相同的东西。外套、帽子、裙子、手套、高尔夫球杆、曲棍球杆、扫帚柄，全都在。正午的太阳毫不留情，两个女孩搬得浑身湿透，喘个不停，还得把东西一路送上山坡。落叶松林里立着一头巨大的石恐龙，肚子上正好有个洞。
        - id: ch03-b25
          speaker: narrator
          text: 凯瑟琳教梅布尔弯下腰，踩着她爬进怪兽冰冷的石肚子。梅布尔再把衣服和木棍一件件递上去。
        - id: ch03-b26
          speaker: kathleen
          text: 里面大得很，尾巴一直通到地下，像一条秘密通道。
        - id: ch03-b27
          speaker: princess
          text: 要是里面突然钻出什么东西，朝你扑过去呢？
        - id: ch03-b28
          speaker: narrator
          text: 凯瑟琳马上爬了下来。
        - id: ch03-b29
          speaker: narrator
          text: 要向法国女教师解释清楚两个男孩的去向，看来并不容易。不过凯瑟琳后来常说，只要冒出一点小事，就足够把大人的注意力引开。她们正努力解释，两个男孩跟去伦敦的那个人，真是像极了家里的一位叔叔。就在这时候，一个人影恰好从窗前走过。
        - id: ch03-b30
          speaker: mademoiselle
          text: 那是谁？
          emotion: surprised
        - id: ch03-b31
          speaker: narrator
          text: 法国女教师忽然指向窗外，虽然人人都知道这样指着别人很没礼貌。那人正是庄园管家。他看过医生，正在回来，早晨那道清洗了很久的伤口上，如今贴着消毒膏药。女孩们说，这是雅尔丁塔楼新来的庄园管家。
        - id: ch03-b32
          speaker: mademoiselle
          text: 天哪！
          emotion: surprised
        - id: ch03-b33
          speaker: narrator
          text: 从那以后，她再也没有追问男孩们那些难以回答的事。午饭开得很迟，吃饭时谁也不说话。饭后，法国女教师戴上缀满粉红玫瑰的帽子，撑着一把内衬也是玫瑰色的阳伞出门去了。两个女孩一声不响地张罗起洋娃娃茶会，而且用的是真茶。喝到第二杯时，凯瑟琳突然放声哭起来，梅布尔也流着眼泪抱住了她。
        - id: ch03-b34
          speaker: kathleen
          text: 我真希望知道男孩们在哪里。只要知道了，我就能安心一点。
          emotion: sad
        - id: ch03-b35
          speaker: narrator
          text: 杰拉尔德倒知道男孩们在哪里，可这并没有给他一丝一毫的安慰。仔细想想，世上能知道他们在哪里的人也只有他。吉米不知道自己是个男孩，事实上，那时的他也的确不算男孩。至于丑八怪，更不能指望他知道任何真实的事，比如男孩们身在何处。
        - id: ch03-b36
          speaker: narrator
          text: 洋娃娃茶会上的茶很浓，却还浓不到能把忧愁淹没。凯瑟琳用发抖的手倒第二杯茶时，杰拉尔德正藏在老布罗德街奥尔德曼伯里大楼的楼梯上。除了“潜伏”，再没有更合适的说法。他下面一层的门上写着“U·W·厄格利先生，股票与股份经纪人，兼伦敦证券交易所会员”。上面一层的门写着杰拉尔德弟弟的名字，也就是那个刚刚用悲惨的魔法突然发财的弟弟。
        - id: ch03-b37
          speaker: narrator
          text: 吉米的名字下面没有一个字说明他的身份。开门让他进去时，杰拉尔德看见里面挤满职员和桃花心木办公桌。看来“那个”的生意做得很大，可杰拉尔德根本猜不出，这个从前是吉米的人究竟靠什么营生发了财。杰拉尔德该怎么办？他又能怎么办呢？
        - id: ch03-b38
          speaker: narrator
          text: 他总不能走进伦敦的一家大公司，告诉大家，那位年老又受人敬重的老板并不像表面那样，其实是他的小弟弟，只因一枚爱捉弄人的许愿戒指，才一下变老又变富。更不可能去敲厄格利先生的门，告诉里面那些职员，他们的老板只是一堆碰巧活过来的旧衣服，又因为一种连杰拉尔德自己也解释不了的魔法，在一家根本不存在的真正好旅馆里住了一夜，便变成了真人。这些事对谁都难办，对小小的杰拉尔德更是几乎办不到。
        - id: ch03-b39
          speaker: narrator
          text: 眼前的处境，真是处处都竖着难题。偏偏杰拉尔德平常吃午饭的时间也早就过了，他越来越强烈的饥饿，很快成了所有难题里最要紧的一个。要是你等候的人在办公室里待得足够久，你完全可能饿死在伦敦一栋大楼的楼梯上。杰拉尔德正在越来越痛苦地明白这个道理。
        - id: ch03-b40
          speaker: narrator
          text: 一个头发像崭新门垫的男孩吹着口哨走上楼，手里拎着深蓝色的包。
        - id: ch03-b41
          speaker: gerald
          text: 你替我买六便士的小圆面包，我再给你六便士。
        - id: ch03-b42
          speaker: narrator
          text: 这种当机立断的气概，所有伟大的统帅都有。
        - id: ch03-b43
          speaker: office_boy
          text: 先让咱看看你那两个六便士。
        - id: ch03-b44
          speaker: narrator
          text: 这男孩回答得一样果断。杰拉尔德把钱亮给他看。
        - id: ch03-b45
          speaker: office_boy
          text: 行，拿来吧。
        - id: ch03-b46
          speaker: gerald
          text: 货到付款。
        - id: ch03-b47
          speaker: narrator
          text: 杰拉尔德说的是布料店里的话，自己也没想到有一天会用上。男孩佩服地咧嘴一笑。
        - id: ch03-b48
          speaker: office_boy
          text: 挺懂门道嘛。你这小子不好骗。
        - id: ch03-b49
          speaker: gerald
          text: 也没有那么好骗。快去吧，好伙计。我得留在这里等。你愿意的话，我能替你看包。
        - id: ch03-b50
          speaker: narrator
          text: 杰拉尔德回答得谦逊，却又很得意。
        - id: ch03-b51
          speaker: office_boy
          text: 咱也没那么好骗。咱玩骗术好多年了，打你这么大就开始啦。
        - id: ch03-b52
          speaker: narrator
          text: 男孩把包甩上肩，留下这句临别妙语便走了。过了一阵，他果然带着一大包小圆面包回来。杰拉尔德照约定付给他六便士，接过那包面包。仅仅一分钟以后，男孩便从厄格利先生的办公室出来。杰拉尔德立刻叫住他，用大拇指朝那扇门猛地一指，把自己的问题说明白。
        - id: ch03-b53
          speaker: gerald
          text: 里面是个什么样的人？
        - id: ch03-b54
          speaker: office_boy
          text: 那可是了不得的大人物，钱多得淹到眼睛，汽车什么的都有。
        - id: ch03-b55
          speaker: gerald
          text: 你知道楼上那个人吗？
        - id: ch03-b56
          speaker: office_boy
          text: 他比这个还阔，是老字号了。听说他在英格兰银行有个专用地窖，钱沿墙一格一格摆着，跟粮店货仓一样。我的老天，要是让我在里面待半小时，门全开着，警察都去赴宴……我可一点也不稀罕。倒是你，把那些面包全吃完，肚子会撑破的。
        - id: ch03-b57
          speaker: gerald
          text: 要不要来一个？
        - id: ch03-b58
          speaker: narrator
          text: 杰拉尔德把纸袋递过去。男孩接下面包，也很守信用，拿一条没人问过的消息来抵账。
        - id: ch03-b59
          speaker: office_boy
          text: 我们办公室的人说，这两个家伙一心想割断对方的喉咙。只是生意上的说法。他们已经斗了好多年。
        - id: ch03-b60
          speaker: narrator
          text: 杰拉尔德慌乱地想，究竟是什么魔法，又用了多少魔法，才替昨天刚出现的两个东西造出这么长的一段历史和过去？要是他能把他们带走，这个男孩脑子里关于他们的记忆会不会跟着消失？城里所有和他们做生意的人呢？那些摆满桃花心木办公桌、挤满职员的办公室，会不会一起消失？职员是真的吗？桃花心木是真的吗？他自己是真的吗？眼前这个男孩又是真的吗？
    - id: ch04
      title: 厄格利先生的计划
      blocks:
        - id: ch04-b01
          speaker: gerald
          text: 你能保守秘密吗？想不想找点乐子？
        - id: ch04-b02
          speaker: office_boy
          text: 我该回办公室了。
        - id: ch04-b03
          speaker: gerald
          text: 那你就回去！
        - id: ch04-b04
          speaker: office_boy
          text: 别生气呀。我正想说，回不回去都没关系。我要是晚了，知道怎么弄出鼻血来。
        - id: ch04-b05
          speaker: narrator
          text: 杰拉尔德祝贺他学会了这门实用又优雅的本领。
        - id: ch04-b06
          speaker: gerald
          text: 听着，我真的给你五先令。
        - id: ch04-b07
          speaker: office_boy
          text: 要我干什么？
        - id: ch04-b08
          speaker: gerald
          text: 只要你帮我一个忙。我是私人侦探。
        - id: ch04-b09
          speaker: office_boy
          text: 密探？你看着一点也不像。
        - id: ch04-b10
          speaker: gerald
          text: 要是一眼就能看出来，还叫什么密探？楼上那个老家伙，有人在找他。
        - id: ch04-b11
          speaker: narrator
          text: 杰拉尔德不耐烦地说着，又吃了一个面包。
        - id: ch04-b12
          speaker: office_boy
          text: 是警察吗？
        - id: ch04-b13
          speaker: gerald
          text: 不是，是他那些伤心的亲人。
        - id: ch04-b14
          speaker: office_boy
          text: 我懂了。回来吧，一切都忘了，一切都原谅了。
        - id: ch04-b15
          speaker: gerald
          text: 我得想办法把他带到亲人那里。你能不能进去，替一个想跟他谈生意的人捎句话？
        - id: ch04-b16
          speaker: office_boy
          text: 等等，我有个强两倍的办法。你去找老厄格利。只要能让楼上那个老家伙消失一两天，老厄格利连耳朵都肯送给你。我们办公室今天早晨还这么说。
        - id: ch04-b17
          speaker: gerald
          text: 让我想一想。
        - id: ch04-b18
          speaker: narrator
          text: 他特意把最后一个面包放在膝盖上，腾出两只手抱住脑袋。
        - id: ch04-b19
          speaker: office_boy
          text: 你想的时候，可别忘了我的五先令。
        - id: ch04-b20
          speaker: narrator
          text: 楼梯上一时没有人说话。只有“那个”的办公室里传出一个职员的咳嗽声，厄格利先生的办公室里，打字机一直咔嗒咔嗒响个不停。随后，杰拉尔德站起身，把特意留到最后的那个面包吃完。
        - id: ch04-b21
          speaker: gerald
          text: 你说得对，我冒险试一试。这是你的五先令。
        - id: ch04-b22
          speaker: narrator
          text: 他拍掉衣襟上的面包屑，清清嗓子，敲响厄格利先生办公室的门。门开了，他走进去。门垫脑袋男孩还在外面徘徊。他那只训练有素的鼻子，随时能弄出一场鼻血，替自己长时间不见踪影编好理由。所以他等得十分踏实，而这番等候也很快有了回报。
        - id: ch04-b23
          speaker: narrator
          text: 男孩往下走了几级，躲到楼梯的拐角后面，侧耳听见厄格利先生用一种柔和又谨慎的口气说话。那道声音在这座大楼的楼梯上，还有整个伦敦证券交易所里，人人都十分熟悉。
        - id: ch04-b24
          speaker: ugly_respectable
          text: 我会请他把戒指给我看看，再假装失手，让它掉到地上。你把它捡起来。记住，这完全是一场意外，而且你从来不认识我。我的名字可不能和这种事扯上关系。你确定他真的精神失常？
        - id: ch04-b25
          speaker: gerald
          text: 我确定。他对那枚戒指着迷得不得了。戒指到哪里，他就会跟到哪里。我知道他一定会。再想想那些伤心的亲人吧。
        - id: ch04-b26
          speaker: ugly_respectable
          text: 我正在想，当然一直在想。我心里想的只有他们。
        - id: ch04-b27
          speaker: narrator
          text: 厄格利先生上楼，进了另一个办公室。杰拉尔德听见“那个”告诉职员，自己要出去吃午饭。随后，可怕的丑八怪和吉米一起下楼。在杰拉尔德眼里，这时的吉米也好不到哪里去。暮色沉沉的下层楼梯平台上，两个男孩尽可能把自己藏得叫人认不出来。等两位老先生走出大楼，他们便跟到街上。前面两人一路谈论着股票、股份、多头和空头。
        - id: ch04-b28
          speaker: office_boy
          text: 我说，你到底打算干什么？
        - id: ch04-b29
          speaker: narrator
          text: 男孩压低声音，问得满是佩服。
        - id: ch04-b30
          speaker: gerald
          text: 你会看到的。跟紧点！
        - id: ch04-b31
          speaker: office_boy
          text: 你告诉我吧，我得回去了。
        - id: ch04-b32
          speaker: gerald
          text: 好，我告诉你，可你不会信。那个老绅士根本不老，他是我弟弟，刚刚变成了现在的样子。另一个不是真人，只是一堆旧衣服，里面什么也没有。
        - id: ch04-b33
          speaker: office_boy
          text: 这个我倒承认，他看着还真像。不过，你可真会编故事，是不是？
        - id: ch04-b34
          speaker: gerald
          text: 我弟弟被一枚魔法戒指变成了这样。
        - id: ch04-b35
          speaker: office_boy
          text: 世上没有魔法，我们学校教过了。
        - id: ch04-b36
          speaker: gerald
          text: 那好吧，再见。
        - id: ch04-b37
          speaker: office_boy
          text: 哎，接着讲呀！不过你确实很会编。
        - id: ch04-b38
          speaker: gerald
          text: 好吧，就是那枚魔法戒指。只要我能拿到它，就许愿让我们所有人去某个地方。我们会立刻到那里，我也就能处置他们两个。
        - id: ch04-b39
          speaker: office_boy
          text: 处置？
        - id: ch04-b40
          speaker: gerald
          text: 对。戒指不能撤销已经实现的愿望。旧愿会自己慢慢消失，像卷紧的弹簧一点点松开。不过它会给你一个全新的愿望，我差不多能肯定。反正我要冒险试试。
        - id: ch04-b41
          speaker: office_boy
          text: 你可真是个坏家伙，对吧？
        - id: ch04-b42
          speaker: narrator
          text: 男孩的声音里满是敬意。
        - id: ch04-b43
          speaker: gerald
          text: 你等着看。
        - id: ch04-b44
          speaker: office_boy
          text: 你不会真的要进这么阔气的地方吧？你可不能进去！
        - id: ch04-b45
          speaker: narrator
          text: 男孩停下脚，被皮姆餐厅的威严吓住了。
        - id: ch04-b46
          speaker: gerald
          text: 我要进去。只要我们规规矩矩，他们就不能赶人。你也来，我请你吃午饭。
        - id: ch04-b47
          speaker: narrator
          text: 谁也不知道杰拉尔德为什么这样舍不得这个男孩。那并不是个很讨人喜欢的孩子。也许是因为，除了曾经的吉米和丑八怪以外，这是他在整个伦敦唯一认识、也唯一能说上话的人。可那另外两位，他一个也不愿意搭话。
        - id: ch04-b48
          speaker: narrator
          text: 后面的事快得惊人。照杰拉尔德后来的说法，简直活像魔法。餐厅里挤满了人。忙碌的女招待飞快送上饭菜，忙碌的客人又匆匆吞下。四周全是刀叉和盘子的叮当声，啤酒从瓶里倒出的汩汩声，还有一片嗡嗡的谈话声。许多种美味食物的香气也混在一起，充满了餐厅。
        - id: ch04-b49
          speaker: gerald
          text: 请给我们两份肉排。
        - id: ch04-b50
          speaker: narrator
          text: 杰拉尔德手里把玩着一把明晃晃露在外面的硬币，免得别人怀疑他没有正当付账的意思。就在这时，他听见邻桌有人说起一件奇特的家传旧物。“那个”从手指上摘下戒指，厄格利先生低声称赞这件举世无双的珍玩，同时把那只本来不可能存在的手伸向戒指。门垫脑袋男孩屏住呼吸，一动不动地看着。
        - id: ch04-b51
          speaker: office_boy
          text: 还真有一枚戒指。
        - id: ch04-b52
          speaker: narrator
          text: 戒指就在这一刻从厄格利先生手里滑落，贴着餐厅的地板溜了出去。杰拉尔德像猎犬扑向野兔一样猛扑过去，一把将它抓住。他马上把那枚暗淡的指环套上自己的手指，在这间挤满了人的餐厅里高声喊出愿望。
        - id: ch04-b53
          speaker: gerald
          text: 我希望吉米和我都到花神像后面那扇门里面去！
        - id: ch04-b54
          speaker: narrator
          text: 那是他在紧急关头唯一能想到的安全地方。餐厅的灯光、声音和气味一齐消失，像一滴蜡落进火里，又像一滴雨落进水里。餐厅后来发生了什么，谁也说不清，杰拉尔德始终不知道。他后来忧心忡忡地翻过报纸，专找城中知名人士离奇失踪一类的消息，可报纸上一个字也没有。门垫脑袋男孩当时做了什么，又想了什么，他同样不知道。他其实很想知道，可讲故事的人倒连两个便士也不在乎。
        - id: ch04-b55
          speaker: narrator
          text: 不管那个男孩做过什么、想过什么，世界总归照常运转。皮姆餐厅的光亮变成了黑暗，喧闹的声音变成了寂静。牛肉、猪肉、羊肉、鱼肉、小牛肉、卷心菜、洋葱、胡萝卜、啤酒和烟草混在一起的气味，则变成了地下空间长久封闭以后，那种霉旧而潮湿的味道。
    - id: ch05
      title: 黑暗的通道
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 杰拉尔德恶心得厉害，头也晕得厉害。他脑子深处还藏着一件事，只是暂时想不起来。他知道，一旦想起那是什么，自己一定会更加恶心、更加晕眩。眼下最要紧的是找几句合适的话，安抚那个从前是吉米的城里商人，让他静静等着。只要时间像慢慢松开的弹簧一样消除魔法，一切就会恢复从前的模样，变回它们本来应该有的样子。
        - id: ch05-b02
          speaker: narrator
          text: 可杰拉尔德拼命寻找，还是一个字也想不出。其实他根本用不着想。深沉的黑暗里响起一道声音。那不是从前的吉米变成城里商人后的声音，而恰恰是杰拉尔德小弟弟吉米本来的声音。那个年轻又贫穷的吉米许下了倒霉的发财愿望。魔法要实现它，只能把他彻底变成一个富有而年老的吉米应该有的样子。
        - id: ch05-b03
          speaker: jimmy
          text: 杰里，杰里！你醒着吗？我刚才做了一个特别怪的梦。
        - id: ch05-b04
          speaker: narrator
          text: 接下来的一刻，没有一个人说话，也没有任何事情发生。杰拉尔德在浓厚的黑暗、浓厚的寂静和封闭旧土的浓厚气味中伸出手，一点点向旁边摸索，终于碰到并紧紧握住了吉米的手。
        - id: ch05-b05
          speaker: gerald
          text: 没事了，吉米，好兄弟。现在已经不是梦了，又是那枚讨厌的戒指。我只能许愿把我们送到这里，才能把你从那个梦里救出来。
          emotion: calm
        - id: ch05-b06
          speaker: jimmy
          text: 你把我们送到哪里了？
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: 吉米紧紧抓着哥哥的手。要是在平常的大白天，他准会第一个笑话这种举动太孩子气。
        - id: ch05-b08
          speaker: gerald
          text: 在花神像后面那条通道里面。真的，没事的。
          emotion: calm
        - id: ch05-b09
          speaker: jimmy
          text: 哦，我想当然没事。可我们怎么出去？
        - id: ch05-b10
          speaker: narrator
          text: 吉米的声音听着有些恼怒，可还没有恼怒到肯松开哥哥的手。这时杰拉尔德终于明白，脑子深处一直藏在那里、等着他的那件事究竟是什么。它让他比刚才从奇普赛德闪电般飞回雅尔丁塔楼时更加晕眩。可他还是用坚定的声音开了口。
        - id: ch05-b11
          speaker: gerald
          text: 我当然会许愿，让我们出去。
        - id: ch05-b12
          speaker: narrator
          text: 可他从头到尾都知道，戒指不会撤销自己已经实现的愿望。果然，它没有。杰拉尔德先许了愿，又在浓黑的黑暗里小心把戒指交给吉米。吉米也许了愿。他们却仍旧待在花神像背后的漆黑通道里。至少有一个丑八怪曾经沿着这条通道走进一家好旅馆。现在石门关得严严实实，他们连门在哪一边也不知道，甚至不知道该朝哪个方向走，才能摸到那扇门。
        - id: ch05-b13
          speaker: gerald
          text: 我要是有几根火柴就好了！
        - id: ch05-b14
          speaker: jimmy
          text: 你为什么不把我留在那个梦里？那里亮堂堂的，我正要吃三文鱼配黄瓜呢。
          emotion: sad
        - id: ch05-b15
          speaker: gerald
          text: 我还正要吃牛排和炸土豆呢。
        - id: ch05-b16
          speaker: narrator
          text: 这时陪着他们的，只有寂静、黑暗，还有泥土的气味。
