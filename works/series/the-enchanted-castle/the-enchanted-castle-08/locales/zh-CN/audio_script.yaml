        - id: ch05-b18
          speaker: narrator
          text: 两个人沉默了一阵。这工夫不长不短，正好足够让你从一数到十。随后，杰拉尔德勇敢的声音穿过泥土的气味、沉沉的寂静和浓厚的黑暗，响了起来。
