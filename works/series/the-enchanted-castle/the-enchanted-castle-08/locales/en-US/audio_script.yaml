  chapters:
    - id: ch01
      title: The Bailiff Wakes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The truth was horribly plain. The unfortunate bailiff must have opened the door before the spell had faded, while the Ugly-Wuglies were still more than coats, hats, and sticks. They had rushed out and attacked him. Now he lay senseless beside Flora's Temple, with a terrible cut across his forehead. Gerald looked at the wound and wondered whether a golf club or a hockey stick had struck the blow. The girls did not stop to wonder. They ran straight to the injured man. Mabel got his head into her lap before Kathleen could place it in hers.
        - id: ch01-b02
          speaker: princess
          text: Water! We need water!
        - id: ch01-b03
          speaker: jimmy
          text: What can we carry it in?
        - id: ch01-b04
          speaker: narrator
          text: He looked at his empty hands, then down the green slope toward the marble-edged pool and its water lilies.
        - id: ch01-b05
          speaker: princess
          text: Use your hat. Use anything!
        - id: ch01-b06
          speaker: narrator
          text: The boys turned toward the pool.
        - id: ch01-b07
          speaker: jimmy
          text: What if they come after us?
        - id: ch01-b08
          speaker: gerald
          text: What do you mean, they?
        - id: ch01-b09
          speaker: jimmy
          text: I mean the Ugly-Wuglies.
          emotion: fearful
        - id: ch01-b10
          speaker: gerald
          text: Who's afraid of them?
        - id: ch01-b11
          speaker: narrator
          text: Gerald still looked carefully to the right and left. Of the possible paths, he chose the one that stayed farthest from the bushes. At the pool, he dipped his straw hat into the water and started back with both hands supporting it. Water streamed through the woven straw at once. Since neither hand was free, Gerald caught the handkerchief in his breast pocket with his teeth, pulled it out, and let it fall into the hat. The cloth soaked up what little water remained. When he reached Flora's Temple, the girls used that wet handkerchief to wipe the blood from the bailiff's forehead.
        - id: ch01-b12
          speaker: kathleen
          text: We ought to have smelling salts. I know we ought to.
          emotion: sad
        - id: ch01-b13
          speaker: princess
          text: Yes, they would help.
        - id: ch01-b14
          speaker: kathleen
          text: Doesn't your aunt have some?
        - id: ch01-b15
          speaker: princess
          text: She does have some, but I'm afraid to go.
        - id: ch01-b16
          speaker: gerald
          text: Don't be a coward. Remember last night. They didn't hurt you then. He must have insulted them or done something. You run to the castle. We'll make sure nothing follows you.
        - id: ch01-b17
          speaker: narrator
          text: Mabel had no choice but to surrender the fascinating invalid's head to Kathleen. She glared once around the slope and its border of rhododendrons, then raced toward the castle. The other three leaned over the motionless bailiff.
        - id: ch01-b18
          speaker: jimmy
          text: He isn't dead, is he?
          emotion: fearful
        - id: ch01-b19
          speaker: kathleen
          text: No. His heart is beating. Mabel and I felt it in his wrist, where doctors do. Isn't he frightfully good-looking?
        - id: ch01-b20
          speaker: gerald
          text: He isn't bad.
        - id: ch01-b21
          speaker: jimmy
          text: I never understand what people mean by good-looking.
        - id: ch01-b22
          speaker: narrator
          text: A shadow suddenly crossed the marble beside them. A fourth voice spoke, and it was not Mabel's. She was still far away, hurrying toward the castle. The children looked up into the face of the eldest and most respectable Ugly-Wugly. Jimmy and Kathleen screamed. I am sorry to say it, but they did.
        - id: ch01-b23
          speaker: gerald
          text: Hush! Be quiet. I'll get him away.
          emotion: angry
        - id: ch01-b24
          speaker: ugly_wugly
          text: This is a very sad business.
        - id: ch01-b25
          speaker: narrator
          text: His voice had a curious accent. His r's sounded odd, and his m's and n's sounded as if he had an unbearable cold. Still, it was not the dreadful moaning voice of the night before. Kathleen and Jimmy bent closer over the bailiff, hoping not to look at the speaker. Even a senseless human body felt like some small protection because it was human. Gerald still wore the ring. The fearlessness it gave him allowed him to stare straight into the visitor's face. Then he started. The face closely resembled the one Gerald had painted on school drawing paper, yet it was not the same now. Paper could not move that way. This was a living face. The thin, almost transparent hands were real hands. When the creature shifted to see the bailiff better, Gerald could make out living arms and legs and a backbone that supported itself. There could be no doubt. The Ugly-Wugly was thoroughly and terribly alive.
        - id: ch01-b26
          speaker: gerald
          text: How did this happen?
        - id: ch01-b27
          speaker: narrator
          text: Gerald had to work at sounding calm, but he succeeded.
        - id: ch01-b28
          speaker: ugly_wugly
          text: It is deeply regrettable. The others must have lost their way in the passage last night. They never reached the hotel.
        - id: ch01-b29
          speaker: gerald
          text: But you did?
          emotion: surprised
        - id: ch01-b30
          speaker: ugly_wugly
          text: Naturally. It was most respectable, exactly as you promised. When I left, I avoided the front entrance because I wished to see this charming place by daylight. The hotel staff could not direct me, so I found my companions gathered at this door. They had spent the whole night trapped inside and were extremely angry. This gentleman must have opened the door. Before I could save him, that ill-bred fellow in the tall hat struck his head. You remember the man, I believe. The gentleman fell here, the others scattered, and I was about to fetch help when I saw you.
        - id: ch01-b31
          speaker: narrator
          text: Gerald did remember the man in the tall hat. By now Jimmy was crying, and Kathleen had gone as white as drawing paper.
        - id: ch01-b32
          speaker: ugly_wugly
          text: What troubles you, my little man?
        - id: ch01-b33
          speaker: narrator
          text: That kindness turned Jimmy's tears straight into howls.
        - id: ch01-b34
          speaker: gerald
          text: Here, take the ring!
        - id: ch01-b35
          speaker: narrator
          text: Gerald forced it onto Jimmy's hot, damp, resisting finger. Jimmy stopped in the middle of a howl. In one cold flash, Gerald understood what Mabel had endured the night before. But this was daylight, and Gerald was not a coward.
        - id: ch01-b36
          speaker: gerald
          text: We have to find the others.
        - id: ch01-b37
          speaker: ugly_wugly
          text: I believe they went bathing. Their clothes are in the wood.
        - id: ch01-b38
          speaker: narrator
          text: He pointed with a stiff arm.
        - id: ch01-b39
          speaker: gerald
          text: You two go and look. I'll keep wetting this fellow's head.
        - id: ch01-b40
          speaker: narrator
          text: In the wood, Jimmy was as fearless as a lion. He found four heaps of clothes, complete with broomsticks, hockey sticks, and masks. They were everything that had made the gentleman Ugly-Wuglies the night before. Two lady Ugly-Wuglies sat on a stone bench in the full sun. Kathleen approached them cautiously. Courage is easier by daylight, as we all know. Close up, the ladies were only ordinary Ugly-Wuglies of the sort the children had often made. There was no life in them. Jimmy shook them apart, and Kathleen sighed with relief.
        - id: ch01-b41
          speaker: kathleen
          text: The spell has broken. That old gentleman must be real. He only happens to look like the Ugly-Wugly we made.
        - id: ch01-b42
          speaker: jimmy
          text: He is wearing the coat that hung in the hall.
        - id: ch01-b43
          speaker: kathleen
          text: No, it only looks the same. Let's go back to the unconscious stranger.
        - id: ch01-b44
          speaker: narrator
          text: They returned. Gerald asked the elderly Ugly-Wugly to wait behind the bushes with Jimmy.
        - id: ch01-b45
          speaker: gerald
          text: I think the bailiff is waking up. Strangers might upset him, so Jimmy can keep you company. He's the best one of us to go with you.
        - id: ch01-b46
          speaker: narrator
          text: Since Jimmy had the ring, that was certainly true. The pair disappeared behind the rhododendrons. Mabel returned with the salts just as the bailiff opened his eyes.
        - id: ch01-b47
          speaker: princess
          text: That's just like life. I might as well not have gone. Still, I've brought them.
        - id: ch01-b48
          speaker: narrator
          text: She knelt and held the bottle beneath his nose until he sneezed and weakly pushed her hand away.
        - id: ch01-b49
          speaker: bailiff
          text: What has happened now?
        - id: ch01-b50
          speaker: gerald
          text: You hurt your head. Stay where you are.
        - id: ch01-b51
          speaker: bailiff
          text: Please don't give me any more smelling salts.
        - id: ch01-b52
          speaker: narrator
          text: He lay still, but before long he sat up and looked around. The children waited anxiously. Here was a grown-up who knew last night's secret. They had no idea how severely the law punished children who made Ugly-Wuglies and brought them into dangerous, angry life.
        - id: ch01-b53
          speaker: bailiff
          text: How strange. Was I unconscious for long?
        - id: ch01-b54
          speaker: princess
          text: You were unconscious for hours.
        - id: ch01-b55
          speaker: kathleen
          text: You weren't unconscious for very long.
        - id: ch01-b56
          speaker: gerald
          text: We don't know. We found you like this.
        - id: ch01-b57
          speaker: bailiff
          text: I'm all right now. I certainly gave my head a knock. You've been giving me first aid. Thank you very much. Still, the whole thing is queer.
        - id: ch01-b58
          speaker: gerald
          text: What is queer about it?
        - id: ch01-b59
          speaker: bailiff
          text: Perhaps I saw you just before I fainted. I had the most extraordinary dream while I was unconscious, and all of you were in it.
        - id: ch01-b60
          speaker: princess
          text: Was there anything besides us?
        - id: ch01-b61
          speaker: bailiff
          text: Oh, yes. All sorts of impossible things. But you seemed real enough.
        - id: ch01-b62
          speaker: narrator
          text: Everyone drew a deep breath of relief. Later they all agreed it had been a very lucky escape.
        - id: ch01-b63
          speakers: [gerald, kathleen, princess]
          ensemble: chorus
          text: Are you sure you're all right?
        - id: ch01-b64
          speaker: bailiff
          text: I am perfectly well, thank you.
        - id: ch01-b65
          speaker: narrator
          text: He stood on his feet while all four children watched closely. Then he glanced behind Flora's statue as he spoke, toward the place where the secret stone door ought to have been.
        - id: ch01-b66
          speaker: bailiff
          text: I dreamed there was a door back there, though of course there isn't one. I don't know how to thank you. I was lucky you came along. Visit whenever you like. You have the freedom of the place.
        - id: ch01-b67
          speaker: princess
          text: You're the new bailiff, aren't you?
        - id: ch01-b68
          speaker: bailiff
          text: Yes. How did you know that?
        - id: ch01-b69
          speaker: narrator
          text: They did not explain. Instead, they learned which way he meant to go and chose the opposite direction. After warm handshakes and hopes that they would meet again soon, they watched his tall, broad figure grow smaller across the hot green slope.
    - id: ch02
      title: Jimmy's Wish
      blocks:
        - id: ch02-b01
          speaker: gerald
          text: Do any of you know how we're going to spend today? I do.
        - id: ch02-b02
          speaker: narrator
          text: The others had no idea.
        - id: ch02-b03
          speaker: gerald
          text: First we'll get rid of that Ugly-Wugly. We'll find a way. Then we'll go home and seal the ring in an envelope. That should pull its teeth and stop it playing any more unexpected tricks. After that, we'll sit on the roof with books and apples and have a quiet day. I've had enough adventures.
        - id: ch02-b04
          speaker: narrator
          text: The others had had enough too.
        - id: ch02-b05
          speaker: gerald
          text: Now think harder than you've ever thought. How can we get rid of him?
        - id: ch02-b06
          speaker: narrator
          text: Everyone tried to think as hard as possible. Nothing useful came. Their minds were worn out by fear, worry, and everything that had happened since the night before. The thoughts that did arrive were so poor that Mabel said they were not worth thinking, much less saying aloud.
        - id: ch02-b07
          speaker: kathleen
          text: I hope Jimmy is all right.
        - id: ch02-b08
          speaker: gerald
          text: He's fine. He has the ring.
        - id: ch02-b09
          speaker: princess
          text: I hope he doesn't wish for something dreadful.
        - id: ch02-b10
          speaker: narrator
          text: Gerald told her to be quiet and let him think.
        - id: ch02-b11
          speaker: gerald
          text: I think best when I'm sitting down, and sometimes when I talk aloud. The Ugly-Wugly is real. Don't forget that. He became real inside the passage. If we can put him back there, perhaps he'll change back. Then we can return all the coats and things.
        - id: ch02-b12
          speaker: kathleen
          text: Isn't there any other way?
        - id: ch02-b13
          speaker: princess
          text: I'm not going into that passage. I simply won't.
        - id: ch02-b14
          speaker: gerald
          text: Are you afraid in broad daylight?
        - id: ch02-b15
          speaker: princess
          text: It wouldn't be daylight inside.
        - id: ch02-b16
          speaker: narrator
          text: Kathleen shivered.
        - id: ch02-b17
          speaker: kathleen
          text: What if we rushed at him and tore off his coat? He's only made of clothes. Without the coat, perhaps he couldn't stay real.
        - id: ch02-b18
          speaker: gerald
          text: Oh, couldn't he? You don't know what might be underneath it.
        - id: ch02-b19
          speaker: narrator
          text: Kathleen shivered again. All the while, the sun shone brightly. White statues, green trees, fountains, and terraces made the place look as cheerfully romantic as a scene on a stage.
        - id: ch02-b20
          speaker: gerald
          text: We'll try to put him back and shut the door. That's our best hope. Then we'll have apples and read Robinson Crusoe, or The Swiss Family, or anything without magic. We have to do it now. And he isn't horrible anymore. He really isn't. He's real.
        - id: ch02-b21
          speaker: princess
          text: I suppose being real makes all the difference.
        - id: ch02-b22
          speaker: narrator
          text: Mabel tried to believe it.
        - id: ch02-b23
          speaker: gerald
          text: Look at the sun. It's broad daylight. Come on!
        - id: ch02-b24
          speaker: narrator
          text: He took one girl by each hand, and together they marched toward the bank of rhododendrons where Jimmy and the Ugly-Wugly were waiting.
        - id: ch02-b25
          speaker: gerald
          text: He's real. The sun is shining. It will all be over in a minute.
        - id: ch02-b26
          speaker: narrator
          text: Gerald repeated those things over and over, so there could be no mistake. As they neared the bushes, the glossy leaves rustled and shook apart. Before the girls could hang back, Jimmy stepped out, blinking in the sunlight. The branches closed behind him and stayed still. No one else appeared.
        - id: ch02-b27
          speakers: [kathleen, princess]
          ensemble: duo
          text: Where is he?
        - id: ch02-b28
          speaker: jimmy
          text: He's walking up and down a path among the firs, doing sums in a book. He says he's terribly rich and has to go to London, to the Stocks or something. That's where clever people turn papers into gold. I'd like to visit the Stocks-change. Wouldn't you?
        - id: ch02-b29
          speaker: gerald
          text: I've stopped caring about changes. I've had enough of them. Show us where he is. We have to get rid of him.
        - id: ch02-b30
          speaker: jimmy
          text: He has a motorcar, a garden with a tennis court and a lake, and a carriage with two horses. He goes to Athens for holidays the way other people go to Margate.
        - id: ch02-b31
          speaker: narrator
          text: Jimmy parted the warm, polished-looking rhododendron leaves, and the others followed him through.
        - id: ch02-b32
          speaker: gerald
          text: We'll tell him the shortest way out goes through the hotel he thinks he found last night. Once he's in the passage, we'll push him, run back, and close the door.
        - id: ch02-b33
          speaker: kathleen
          text: If he's truly real, he'll starve in there.
        - id: ch02-b34
          speaker: gerald
          text: I don't think the spell will last long. The ring's magic never does. I can't think of anything else.
        - id: ch02-b35
          speaker: jimmy
          text: He's building a public library for people who work for him. He's having his own portrait painted to hang there. He thinks they'll enjoy that.
        - id: ch02-b36
          speaker: narrator
          text: Beyond the rhododendrons was a smooth grass walk lined with many strange pines and firs.
        - id: ch02-b37
          speaker: jimmy
          text: He's just around the corner. He has more money than he can use. He built a drinking fountain and a horse trough with a statue of his own head on top. Why doesn't he put a private swimming pool beside his bed, so he can roll straight into it every morning? If I were rich, I'd show him how to spend money.
        - id: ch02-b38
          speaker: gerald
          text: That's a sensible wish. Why didn't we think of it before? Oh, crikey!
          emotion: surprised
        - id: ch02-b39
          speaker: narrator
          text: Gerald had good reason to cry out. There in the green shade of the pine walk, with only rustling leaves and the frightened breathing of the other three to break the quiet, Jimmy's wish came true. They saw it happen clearly, one swift step at a time, though they could not understand it or stop it.
        - id: ch02-b40
          speaker: narrator
          text: Their own Jimmy began to grow old before their eyes. This was the Jimmy they had played with, teased, and quarrelled with for as long as they could remember. They had always made friends with him again. Now his familiar face and body changed without pause. In only a few seconds he passed through years that ought to have taken a lifetime. First he became a youth, then a young man, and then a middle-aged one. At last, with a final shivering shock that made the change horribly certain, he settled into an elderly gentleman. He was stout and prosperous. His clothes were expensive but rather dowdy. A tall hat sat above his spectacles, a frock coat covered his body, and a large red seal hung in a curve across his broad waistcoat. Nothing about this gentleman looked like the little boy they knew. If the children had not watched every awful detail of the change, they would never have guessed that this stranger was their own Jimmy. But they had watched, so they knew the truth.
        - id: ch02-b41
          speaker: rich_jimmy
          text: Can you direct me to the nearest railway station?
        - id: ch02-b42
          speaker: princess
          text: Oh, Jimmy, please don't!
          emotion: fearful
        - id: ch02-b43
          speaker: gerald
          text: This is perfectly horrible.
        - id: ch02-b44
          speaker: narrator
          text: Kathleen began to weep wildly.
        - id: ch02-b45
          speaker: rich_jimmy
          text: Don't cry, little girl. And you, boy, could you answer a civil question civilly?
        - id: ch02-b46
          speaker: kathleen
          text: He doesn't know us!
          emotion: sad
        - id: ch02-b47
          speaker: rich_jimmy
          text: Who doesn't know you?
        - id: ch02-b48
          speaker: kathleen
          text: You don't. You don't know us!
          emotion: sad
        - id: ch02-b49
          speaker: rich_jimmy
          text: I certainly do not, but that is hardly a reason for such distress.
        - id: ch02-b50
          speaker: kathleen
          text: Oh, Jimmy! Jimmy! Jimmy!
          emotion: sad
        - id: ch02-b51
          speaker: gerald
          text: He really doesn't know us. Jimmy, you aren't playing a trick, are you? Because if you are, it's absolutely rotten.
        - id: ch02-b52
          speaker: rich_jimmy
          text: My name is Mr. James.
        - id: ch02-b53
          speaker: narrator
          text: He gave Jimmy's full name, and it was perfectly correct. Still, it would take too long to call him “the elderly stout person who had once been Jimmy” every time he appeared. We shall call this magically rich version of Jimmy Mr. James, which is shorter and nearly as accurate.
        - id: ch02-b54
          speaker: princess
          text: What can we do? Mr. James, or whatever you call yourself, please give me that ring.
        - id: ch02-b55
          speaker: narrator
          text: The fatal ring was plainly visible on his finger.
        - id: ch02-b56
          speaker: rich_jimmy
          text: Certainly not. You seem to be a very greedy child.
        - id: ch02-b57
          speaker: gerald
          text: Then what are you going to do?
        - id: ch02-b58
          speaker: narrator
          text: Gerald's voice had gone flat with hopelessness.
        - id: ch02-b59
          speaker: rich_jimmy
          text: Your interest is most flattering. Will you tell me the way to the nearest station or not?
        - id: ch02-b60
          speaker: gerald
          text: No. We won't.
        - id: ch02-b61
          speaker: rich_jimmy
          text: Then perhaps you can direct me to the nearest lunatic asylum.
          emotion: angry
        - id: ch02-b62
          speaker: kathleen
          text: Oh, no! You aren't as bad as that!
        - id: ch02-b63
          speaker: rich_jimmy
          text: Perhaps I am not, but you are. If you aren't lunatics, you are idiots. There is a gentleman ahead who may be sane. In fact, I believe I know him.
        - id: ch02-b64
          speaker: narrator
          text: The elderly Ugly-Wugly was coming toward them.
        - id: ch02-b65
          speaker: kathleen
          text: Don't you remember Jerry? Don't you remember Cathy, your own Cathy Puss Cat? Dear Jimmy, stop being silly!
          emotion: sad
        - id: ch02-b66
          speaker: rich_jimmy
          text: Little girl, I am sorry no one taught you better manners.
        - id: ch02-b67
          speaker: narrator
          text: He looked crossly over his spectacles and walked stiffly toward the Ugly-Wugly. Both elderly gentlemen raised their hats with great politeness. After exchanging a few words, they turned and went side by side along the green pine walk. The children followed behind. All three were miserable, horrified by what they had seen, bewildered by what the wish had done, and afraid of what might happen next. Worst of all, they had reached the very end of their ideas.
    - id: ch03
      title: Two Journeys
      blocks:
        - id: ch03-b01
          speaker: gerald
          text: He wished to be rich, so now he is. He'll have money for tickets and everything. The spell is sure to break eventually, isn't it? But then he may find himself somewhere terrible, perhaps in a fine hotel, with no idea how he arrived.
        - id: ch03-b02
          speaker: princess
          text: I wonder how long the Ugly-Wuglies stayed alive.
        - id: ch03-b03
          speaker: gerald
          text: That reminds me. You two must gather all the clothes and sticks. Hide them wherever you can. We'll take them home tomorrow, if there is a tomorrow.
        - id: ch03-b04
          speaker: kathleen
          text: Oh, don't say that. How can everything be so awful while the sun is shining like this?
          emotion: sad
        - id: ch03-b05
          speaker: gerald
          text: Listen. I have to stay with Jimmy. You must go home and tell Mademoiselle that Jimmy and I left on a train with a gentleman. Say he looked like an uncle. He does look rather like one. There will be a dreadful fuss later, but we can't help that.
        - id: ch03-b06
          speaker: kathleen
          text: Everything is so full of lies that the truth can hardly squeeze through.
        - id: ch03-b07
          speaker: gerald
          text: Don't worry about that. These aren't lies. They're as true as anything in this magical mess. Lying in a dream doesn't count, because you can't help it.
        - id: ch03-b08
          speaker: kathleen
          text: I only wish all of it would stop.
        - id: ch03-b09
          speaker: gerald
          text: Your wishing won't help. Goodbye. I have to follow them, and you have to stay. If it comforts you, none of this can be real. It's too much. Tell Mademoiselle we'll be back for tea. If we aren't, I can't help that. I can't help anything now, except perhaps Jimmy.
        - id: ch03-b10
          speaker: narrator
          text: The girls had fallen behind, while Mr. James and the Ugly-Wugly walked faster. Gerald had to run or lose sight of them. Mabel and Kathleen stayed where they were, watching their brother hurry after two elderly gentlemen who should not have existed at all. One had been a little boy only minutes ago. The other had begun as paper, old clothes, and a walking stick. Now both were heading toward the railway as if nothing about them were strange.
        - id: ch03-b11
          speaker: princess
          text: We simply have to find those clothes. I used to want to be a heroine. It's very different when you truly have to be one.
        - id: ch03-b12
          speaker: kathleen
          text: Yes, it is very different. Where can we hide everything? We aren't using that passage, are we?
        - id: ch03-b13
          speaker: princess
          text: We will never hide it there. We'll put it all inside the great stone dinosaur. It's hollow.
        - id: ch03-b14
          speaker: kathleen
          text: The dinosaur comes alive without leaving its stone.
        - id: ch03-b15
          speaker: princess
          text: Not in sunshine, it doesn't. And not when we haven't got the ring.
        - id: ch03-b16
          speaker: kathleen
          text: We won't have apples and books today.
        - id: ch03-b17
          speaker: princess
          text: No, but the instant we get home, we'll do the most babyish thing possible. We'll have a dolls' tea party. Then perhaps it will feel as if magic isn't real.
        - id: ch03-b18
          speaker: kathleen
          text: It will need to be a very strong tea party.
        - id: ch03-b19
          speaker: narrator
          text: Meanwhile Gerald, small but determined, trudged through the soft white dust of the sunny road behind the two elderly gentlemen. His hand closed with satisfaction around the mixed coins in his pocket, his share of the money from the conjuring show at the fair. His quiet tennis shoes carried him all the way to the station.
        - id: ch03-b20
          speaker: rich_jimmy
          text: I would like one first-class ticket to London.
        - id: ch03-b21
          speaker: narrator
          text: Gerald reached the station without being noticed and listened at the ticket window. He waited until Mr. James and the Ugly-Wugly had strolled onto the platform, deep in polite talk about politics and the Kaffir market. Then he stepped up and bought a third-class return ticket to London with his fairground money. The train came striding into the station, squealing and puffing as it slowed. Gerald watched the men choose seats in a carriage lined in blue. He sprang into a separate yellow wooden compartment before anyone could see him. A whistle sounded. A flag waved. The whole train seemed to pull itself together, strain against its weight, jerk once, and start.
        - id: ch03-b22
          speaker: gerald
          text: I don't understand how railway trains and magic can happen at the same time.
        - id: ch03-b23
          speaker: narrator
          text: Yet they did.
        - id: ch03-b24
          speaker: narrator
          text: Back at Yalding, Mabel and Kathleen searched nervously among the rhododendrons and bracken and between the ornamental fir trees. One by one they discovered six separate heaps. There were coats, hats, skirts, and gloves, along with golf clubs, hockey sticks, and broom handles. Every piece had belonged to one of the Ugly-Wuglies. The midday sun beat down without mercy as the girls carried load after load up the hill. By the time they reached the enormous stone dinosaur among the larches, they were hot, damp, and panting. The dinosaur had a hole in its stomach. Kathleen showed Mabel how to bend over and make a step with her back. From there Kathleen climbed into the cold, stony inside of the monster. Mabel remained below and handed up the clothes and sticks, one awkward bundle after another.
        - id: ch03-b25
          speaker: kathleen
          text: There's plenty of space. Its tail goes down underground. It's almost like a secret passage.
        - id: ch03-b26
          speaker: princess
          text: What if something comes through it and jumps at you?
        - id: ch03-b27
          speaker: narrator
          text: Kathleen came down at once.
        - id: ch03-b28
          speaker: narrator
          text: Explaining the boys' disappearance to Mademoiselle promised to be hard. Mabel and Kathleen did their best with Gerald's story about a gentleman who looked like an uncle. Luckily, as Kathleen said afterwards, almost any small event is enough to pull a grown-up's attention away from an awkward explanation. Before Mademoiselle could press them too closely, a figure passed outside the window.
        - id: ch03-b29
          speaker: mademoiselle
          text: Who is that?
        - id: ch03-b30
          speaker: narrator
          text: She even pointed at the window, though everyone knows that pointing is not good manners. The figure was the bailiff, returning from the doctor. A strip of antiseptic plaster now covered the ugly cut that the children had spent so long washing that morning. The girls quickly told Mademoiselle that he was the new bailiff at Yalding Towers.
        - id: ch03-b31
          speaker: mademoiselle
          text: Good heavens!
          emotion: surprised
        - id: ch03-b32
          speaker: narrator
          text: That single sight ended Mademoiselle's awkward questions about the absent boys. Lunch came very late, and no one spoke while they ate. Afterwards Mademoiselle went out wearing a hat crowded with pink roses and carrying a parasol lined with rose-colored cloth. Left alone, the girls solemnly carried out their plan. In complete silence they arranged a dolls' tea party, using real tea and making it very strong. They poured the first cup and then a second. The game did not make magic feel any less real. At that second cup, Kathleen burst into tears. Mabel was crying too, and she put her arms around Kathleen.
        - id: ch03-b33
          speaker: kathleen
          text: I wish I knew where the boys are. Oh, I truly wish I knew. It would be such a comfort.
          emotion: sad
        - id: ch03-b34
          speaker: narrator
          text: Gerald knew exactly where the boys were, and it comforted him not at all. He was the only one who could know. Jimmy no longer knew he was a boy, and in truth he was not one just then. The Ugly-Wugly could hardly be expected to know anything real, including the whereabouts of boys.
    - id: ch04
      title: Aldermanbury Buildings
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: While Kathleen's shaking hand poured that second cup of very strong dolls' tea, Gerald was lurking on the stairs of Aldermanbury Buildings in Old Broad Street. There is no kinder or more accurate word for what he was doing. Below him stood a door with a painted notice. It read, “Mr. U. W. Ugli, Stock and Share Broker, and at the Stock Exchange.” On the floor above was another office door. That one bore the full name of Gerald's little brother, though the owner of the name had suddenly become an elderly man.
        - id: ch04-b02
          speaker: narrator
          text: No words beneath the name explained how Mr. James earned his fortune or what kind of business had supposedly made him rich. Once, when the office door opened to admit his transformed brother, Gerald had glimpsed a tangle of busy clerks and mahogany desks inside. The room appeared full of both. Whatever the business was, it was plainly a large and important one.
        - id: ch04-b03
          speaker: narrator
          text: What could Gerald possibly do? Even an adult would find it hard to enter a grand London office and explain that its elderly, respected owner was really a little boy, suddenly made old and rich by a troublesome wishing ring. Gerald could not knock below, either, and announce that Mr. Ugli was nothing but old clothes brought accidentally to life, then made real by spending a night at a fine hotel that did not exist.
        - id: ch04-b04
          speaker: narrator
          text: Whichever way Gerald turned the situation seemed to grow another sharp difficulty. Worse still, his proper dinner time had passed long ago. He had eaten nothing since leaving Yalding, and his hunger was rapidly becoming the largest difficulty of all. A person really can starve to death on the stairs of a London office, provided the people being watched remain in their rooms long enough. As time passed and neither office door opened, Gerald felt that truth more painfully in his empty stomach.
        - id: ch04-b05
          speaker: narrator
          text: A boy with hair like a brand-new doormat came whistling up the stairs. He carried a dark blue bag.
        - id: ch04-b06
          speaker: gerald
          text: I'll pay you sixpence for yourself if you fetch me sixpence worth of buns.
        - id: ch04-b07
          speaker: narrator
          text: Gerald decided quickly, as all great commanders do.
        - id: ch04-b08
          speaker: office_boy
          text: Let's see your money first.
        - id: ch04-b09
          speaker: narrator
          text: The other boy decided just as quickly. Gerald showed him the coins.
        - id: ch04-b10
          speaker: office_boy
          text: All right. Hand it over.
        - id: ch04-b11
          speaker: gerald
          text: You will be paid when the buns arrive.
        - id: ch04-b12
          speaker: narrator
          text: Gerald had heard shopkeepers use those words, but had never expected to use them himself. The boy grinned with respect.
        - id: ch04-b13
          speaker: office_boy
          text: You know your way around. Nobody can fool you.
        - id: ch04-b14
          speaker: gerald
          text: Not many people can. Hurry up, there's a good fellow. I have to wait here. I can mind your bag, if you like.
        - id: ch04-b15
          speaker: office_boy
          text: Nobody fools me either.
        - id: ch04-b16
          speaker: narrator
          text: He swung the bag onto his shoulder.
        - id: ch04-b17
          speaker: office_boy
          text: I've known the confidence trick for years, ever since I was your age.
        - id: ch04-b18
          speaker: narrator
          text: With that parting shot, he left. In time he returned loaded with buns. Gerald paid a sixpence and took them. A minute later, the boy came out of Mr. Ugli's office. Gerald stopped him and pointed his thumb at the door.
        - id: ch04-b19
          speaker: gerald
          text: What sort of fellow is he?
        - id: ch04-b20
          speaker: office_boy
          text: He's a very important man. He's buried in money and has a motorcar and everything.
        - id: ch04-b21
          speaker: gerald
          text: Do you know anything about the man on the next landing?
        - id: ch04-b22
          speaker: office_boy
          text: He's even bigger. The firm is ancient. They say he has a private cellar in the Bank of England. His money is stacked in bins along the walls, like grain at a corn shop. I'd like half an hour in there with the doors open and the police off enjoying themselves. Wouldn't I! You'll burst if you eat every one of those buns.
        - id: ch04-b23
          speaker: gerald
          text: Would you like one?
        - id: ch04-b24
          speaker: narrator
          text: Gerald held out the bag. The boy accepted a bun and paid for it honestly with more information.
        - id: ch04-b25
          speaker: office_boy
          text: People in our office say those two would gladly cut each other's throats. Only in business, of course. They've been fighting for years.
        - id: ch04-b26
          speaker: narrator
          text: Gerald wondered wildly what sort of magic could supply years of history to two beings who had existed only since yesterday. Mr. James and Mr. Ugli seemed to have businesses, fortunes, enemies, and memories in the minds of everyone around them. If Gerald managed to take the pair away, would all memory of them vanish from this office boy's head? Would every City man who traded with them forget their names? Would the mahogany desks and crowded offices disappear too? Were the clerks real? Was the polished mahogany real? For that matter, was Gerald real? Was the boy beside him?
        - id: ch04-b27
          speaker: gerald
          text: Can you keep a secret? Would you like an adventure?
        - id: ch04-b28
          speaker: office_boy
          text: I ought to get back to the office.
        - id: ch04-b29
          speaker: gerald
          text: Then go.
        - id: ch04-b30
          speaker: office_boy
          text: Don't get offended. I was about to say it doesn't matter. I can make my nose bleed if I'm late.
        - id: ch04-b31
          speaker: narrator
          text: Gerald congratulated him on such a useful and graceful skill.
        - id: ch04-b32
          speaker: gerald
          text: Listen. I'll give you five shillings. Honestly.
        - id: ch04-b33
          speaker: office_boy
          text: What do I have to do?
        - id: ch04-b34
          speaker: gerald
          text: Help me.
        - id: ch04-b35
          speaker: office_boy
          text: Go on, then.
        - id: ch04-b36
          speaker: gerald
          text: I'm a private investigator.
        - id: ch04-b37
          speaker: office_boy
          text: Do you mean a detective? You don't look like one.
        - id: ch04-b38
          speaker: gerald
          text: What use would a detective be if he looked like one? That old gentleman upstairs is wanted.
        - id: ch04-b39
          speaker: office_boy
          text: Is he wanted by the police?
        - id: ch04-b40
          speaker: gerald
          text: No. His grieving family wants him back.
        - id: ch04-b41
          speaker: office_boy
          text: You mean, “Come home, because everything is forgiven.” I understand.
        - id: ch04-b42
          speaker: gerald
          text: I have to get him back to them somehow. Perhaps you could take him a message from someone who wants a business meeting.
        - id: ch04-b43
          speaker: office_boy
          text: Wait. I know a better trick. Go in and speak to old Ugli. He would give his ears to have the man upstairs out of the way for a day or two. They were saying so in our office this morning.
        - id: ch04-b44
          speaker: gerald
          text: Let me think.
        - id: ch04-b45
          speaker: narrator
          text: Gerald placed his last bun on his knee and held his head between his hands.
        - id: ch04-b46
          speaker: office_boy
          text: Remember to think about my five shillings too.
        - id: ch04-b47
          speaker: narrator
          text: The stairs fell silent except for a clerk coughing in Mr. James's office and the clatter of a typewriter in Mr. Ugli's. At last Gerald stood and finished the bun.
        - id: ch04-b48
          speaker: gerald
          text: You're right. I'll risk it. Here are your five shillings.
        - id: ch04-b49
          speaker: narrator
          text: He brushed the crumbs from his clothes, cleared his throat, and knocked on Mr. U. W. Ugli's door. It opened, and he went inside.
    - id: ch05
      title: Gerald's Plan
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The office boy stayed on the stairs instead of returning to work. His well-trained nose could provide a bleeding excuse for his long absence, so he felt perfectly safe. Soon his patience was rewarded. He went down several steps, slipped around the bend in the staircase, and listened where no one above could see him. Mr. Ugli's soft, guarded voice came through the door. Everyone on those stairs knew that voice, and so did everyone at the Stock Exchange.
        - id: ch05-b02
          speaker: ugly_wugly
          text: I shall ask him to let me examine the ring, and then I shall drop it. You will pick it up. Remember, though, it must look like an accident. You do not know me. I cannot allow my name to become connected with such a matter. You are certain his mind is unbalanced?
        - id: ch05-b03
          speaker: gerald
          text: Completely. He's obsessed with the ring and will follow it anywhere. Just think of his grieving family.
        - id: ch05-b04
          speaker: ugly_wugly
          text: I do think of them. Naturally, they are my only concern.
        - id: ch05-b05
          speaker: narrator
          text: Mr. Ugli climbed to the office above. Gerald heard Mr. James tell his clerks he was going out to lunch. Then the awful Ugly-Wugly and Jimmy, who looked almost as awful to Gerald now, came down the stairs. On the dark lower landing, the two boys made themselves as hard to notice as they could. The gentlemen passed into the street, discussing shares, bulls, and bears. The boys followed.
        - id: ch05-b06
          speaker: office_boy
          text: What in the world are you doing?
        - id: ch05-b07
          speaker: gerald
          text: You'll find out. Come on.
        - id: ch05-b08
          speaker: office_boy
          text: Tell me now. I really should go back.
        - id: ch05-b09
          speaker: gerald
          text: I'll tell you, but you won't believe it. That old gentleman isn't old. He's my little brother, suddenly changed into what you see. The other one isn't real at all. He's nothing but old clothes with no one inside.
        - id: ch05-b10
          speaker: office_boy
          text: He does look like it. But you certainly know how to tell a tale.
        - id: ch05-b11
          speaker: gerald
          text: A magic ring changed my brother.
        - id: ch05-b12
          speaker: office_boy
          text: Magic doesn't exist. We learned that at school.
        - id: ch05-b13
          speaker: gerald
          text: Fine. Goodbye.
        - id: ch05-b14
          speaker: office_boy
          text: Oh, keep going. It's a tremendous tale, though.
        - id: ch05-b15
          speaker: gerald
          text: If I can get the ring, I'll wish us all into one particular place. Then we'll be there, and I can deal with both of them. The ring never reverses a wish. A wish wears off by itself, like a spring slowly unwinding. But I'm nearly sure the ring will grant a completely new wish. Anyway, I'm going to risk it.
        - id: ch05-b16
          speaker: office_boy
          text: You are a proper little villain, aren't you?
        - id: ch05-b17
          speaker: gerald
          text: Wait and see.
        - id: ch05-b18
          speaker: office_boy
          text: You're not going into that grand place, are you? You can't!
        - id: ch05-b19
          speaker: narrator
          text: The boy stopped before the magnificence of Pym's restaurant.
        - id: ch05-b20
          speaker: gerald
          text: Yes, I am. They can't put us out if we behave. Come with me. I'll buy your lunch.
        - id: ch05-b21
          speaker: narrator
          text: Gerald did not know why he held on to this boy, who was not especially pleasant and did not truly believe a word Gerald said. Perhaps it was because this was the only person in all London he could talk to, apart from Mr. James and the Ugly-Wugly. Gerald was far from home, following magic he did not understand, and he certainly did not want a conversation with either elderly gentleman.
        - id: ch05-b22
          speaker: narrator
          text: Everything that followed happened so quickly that Gerald later said it was just like magic. The restaurant was crowded from wall to wall. Busy men swallowed their meals in a hurry while equally busy waitresses rushed fresh plates to the tables. Forks struck plates with constant little clinks. Beer gurgled from tilted bottles. Talk from every table blended into one steady hum. Above it all hung the warm smell of many good things to eat, which Gerald noticed particularly because he was still hungry.
        - id: ch05-b23
          speaker: gerald
          text: Please bring us two chops.
        - id: ch05-b24
          speaker: narrator
          text: Gerald played with a clearly visible handful of money, so no one could doubt that he meant to pay. At the next table, a few words caught his ear.
        - id: ch05-b25
          speaker: rich_jimmy
          text: Ah, yes. It is a curious old family heirloom.
        - id: ch05-b26
          speaker: narrator
          text: Mr. James drew the ring from his finger and held it out across the space between the tables. Mr. U. W. Ugli murmured something about its being a unique curiosity. Then he reached toward it with the impossible hand that had once been made out of nothing more than the children's materials. Beside Gerald, the office boy watched the exchange without breathing.
        - id: ch05-b27
          speaker: office_boy
          text: There really is a ring.
        - id: ch05-b28
          speaker: narrator
          text: The ring slipped from Mr. Ugli's hand and skimmed across the floor. Gerald sprang after it like a greyhound after a hare. He snatched up the dull circle, forced it onto his finger, and shouted in the crowded restaurant.
        - id: ch05-b29
          speaker: gerald
          text: I wish Jimmy and I were inside the door behind the statue of Flora!
        - id: ch05-b30
          speaker: narrator
          text: It was the only safe place he could think of.
    - id: ch06
      title: Behind the Stone Door
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The restaurant's lights, sounds, and smells vanished as completely as a drop of wax in fire or a drop of rain in water. Neither Gerald nor anyone else ever told me what happened inside Pym's after that. Perhaps no one could have explained it. The newspapers said nothing about the extraordinary disappearance of a famous City man, though Gerald searched them anxiously for just such a headline. He never learned what the office boy did when the two figures vanished, or what the boy thought about magic after seeing it happen. Gerald would very much like to know. I do not care twopence. Whatever that boy did or believed, the rest of the world continued well enough.
        - id: ch06-b02
          speaker: narrator
          text: The restaurant's bright light became complete darkness. Its crowded noise became a silence so deep the boys could hear nothing around them. All the mixed odors of beef, pork, mutton, fish, veal, cabbage, onions, carrots, beer, and tobacco disappeared too. In their place came the damp and musty smell of an underground chamber that had been closed for a very long time.
        - id: ch06-b03
          speaker: narrator
          text: Gerald felt dizzy and sick after the lightning journey from London. Something else waited at the back of his mind. He knew it would make him feel worse as soon as he managed to remember it. For the moment, he tried to find the right words to calm the City gentleman who had once been Jimmy. He must soothe the man and keep him quiet in the dark. Then they could wait until Time unwound the spell like a spring and returned everything to what it had been, and what it ought to be. Gerald fought desperately for some proper, comforting speech. No words came.
        - id: ch06-b04
          speaker: narrator
          text: None were needed. A voice came through the deep darkness. It was not the voice of the rich City man. It belonged to Gerald's own little brother, the Jimmy who had wished for wealth and been changed from everything young and poor into everything old and rich.
        - id: ch06-b05
          speaker: jimmy
          text: Jerry? Jerry, are you awake? I've had such a queer dream.
        - id: ch06-b06
          speaker: narrator
          text: For one moment, neither boy spoke or moved. Then Gerald reached through the heavy dark, the heavy silence, and the thick smell of buried earth until he found Jimmy's hand.
        - id: ch06-b07
          speaker: gerald
          text: It's all right, Jimmy, old fellow. It isn't a dream now. That horrible ring did it again. I had to wish us here. It was the only way to bring you back from the dream.
          emotion: calm
        - id: ch06-b08
          speaker: jimmy
          text: Where did you wish us?
        - id: ch06-b09
          speaker: narrator
          text: Jimmy gripped his brother's hand in a way he would have called babyish in ordinary daylight.
        - id: ch06-b10
          speaker: gerald
          text: We're inside the passage behind Flora's statue. Truly, it's all right.
          emotion: calm
        - id: ch06-b11
          speaker: jimmy
          text: Oh, I daresay it's all right. But how do we get out?
        - id: ch06-b12
          speaker: narrator
          text: His irritation was not strong enough to make him release Gerald's hand. Now Gerald remembered what had been waiting to make him even dizzier than the lightning journey from London to Yalding Towers.
        - id: ch06-b13
          speaker: gerald
          text: I'll wish us out, of course.
        - id: ch06-b14
          speaker: narrator
          text: He spoke bravely, though he already knew the ring would not reverse a wish it had granted. It did not. Gerald wished. Then, through the absolute darkness, he carefully passed the ring to Jimmy. Jimmy wished too.
        - id: ch06-b15
          speaker: narrator
          text: The wishes changed nothing. The boys remained in the black passage behind Flora, the same passage that had led one Ugly-Wugly to what he called a good hotel. Now there was no friendly hotel and no light at all. The heavy stone door was closed. In the perfect dark, the boys could not see its outline, and they did not even know which way to turn to reach it.
        - id: ch06-b16
          speaker: gerald
          text: If only I had some matches.
        - id: ch06-b17
          speaker: jimmy
          text: Why didn't you leave me in the dream? There was light there, and I was about to eat salmon and cucumber.
          emotion: sad
        - id: ch06-b18
          speaker: gerald
          text: I was about to have steak and fried potatoes.
        - id: ch06-b19
          speaker: narrator
          text: Now they had only silence, darkness, and the earthy smell around them.
        - id: ch06-b20
          speaker: jimmy
          text: I always wondered what being buried alive would feel like. Now I know. Oh, it isn't true! It isn't! This is a dream. It must be a dream!
          emotion: fearful
        - id: ch06-b21
          speaker: narrator
          text: A long pause followed. You could have counted slowly to ten.
        - id: ch06-b22
          speaker: gerald
          text: Yes, it's only a dream, Jimmy, old fellow. We'll hold on to each other and call out now and then, just for fun. But of course it's only a dream.
          emotion: calm
        - id: ch06-b23
          speaker: jimmy
          text: Of course it's only a dream.
        - id: ch06-b24
          speaker: narrator
          text: His voice faded into the silence and darkness and the smell of old earth.
