audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    constable_johnson:
      display_name: 约翰逊警官
      tts:
        delivery: 诙谐随意，谈到案情时沉稳笃定
        timbre: 厚实的成年男声
        pace: 从容
        pitch: 中低音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 朴实爽快，受惊时喃喃自语
        timbre: 年轻质朴的女声
        pace: 自然偏快
        pitch: 中音
    alf:
      display_name: 阿尔夫
      tts:
        delivery: 老实拘谨，困惑时急促慌张
        timbre: 清亮朴实的年轻男声
        pace: 自然偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 卧室里每个角落都翻过了，戒指还是不见。杰拉尔德宣布，高贵的侦探英雄已经搜够了，再过一眨眼，他就得办别的要紧事。至于昨夜那场冒险，大家到底想不想听呢？
        - id: ch01-b02
          speaker: kathleen
          text: 还是等见到梅布尔，再一起听吧。
        - id: ch01-b03
          speaker: jimmy
          text: 不是约好十点半吗？让他边走边讲不就行了。反正我猜，昨晚根本没出什么大事。
        - id: ch01-b04
          speaker: gerald
          text: 这句话正好说明，你什么都不懂。可怜的梅布尔还在苦等，这一位偏偏不去赴约啦。
        - id: ch01-b05
          speaker: narrator
          text: 他套着《樱桃熟了》的调子唱起来，唱什么鱼儿等着下锅，凯瑟琳气得真想掐他。吉米冷冷转过身，叫他闹够了再开口。可杰拉尔德又唱起约翰逊、樱桃岛和等着煎的鱼，还庄严地请警官来买一盘。
        - id: ch01-b06
          speaker: kathleen
          text: 你怎么能这么气人？
        - id: ch01-b07
          speaker: gerald
          text: 我也说不清。大概没睡够，也可能是胜利把我灌醉了。走吧，找个没人听得见的地方再讲。来呀，到一座没人听见的小岛去，可要当心，有只耳朵正贴在钥匙孔上偷听呢。
        - id: ch01-b08
          speaker: narrator
          text: 他低声念完，猛地拉开房门。果然，伊莱扎正弯腰站在外面。她有气无力地拿掸子扫了扫护墙板，可现在怎么装都没用了。
        - id: ch01-b09
          speaker: jimmy
          text: 你总该知道吧，偷听的人从来听不到好话。
        - id: ch01-b10
          speaker: eliza
          text: 我不知道，反正就是不知道！
        - id: ch01-b11
          speaker: narrator
          text: 她那两只偷听的耳朵一下红透了。孩子们出了门，一路走到教堂墓园，坐在围墙上晃着腿。杰拉尔德始终抿紧嘴唇，又细又倔，一句话也不说。
        - id: ch01-b12
          speaker: kathleen
          text: 好啦，杰里，别闹别扭了！我都快急死了。后来到底怎么样？快告诉我。
        - id: ch01-b13
          speaker: gerald
          text: 这才对嘛。
        - id: ch01-b14
          speaker: narrator
          text: 杰拉尔德终于讲起昨夜的经历。他说起月光下的花园，那片雪白的景象又神秘，又像真有魔力，连他的声音也跟着变了。他说那些雕像全都活了过来，还有那头明明由石头雕成、浑身却有生命的巨兽。凯瑟琳听得紧紧抓住他的胳膊，连吉米也不踢墙了，只张着嘴发呆。
        - id: ch01-b15
          speaker: narrator
          text: 接下来，他又讲到惊险的盗贼，还有那封突然落进安宁场面的警告信。当时梅布尔和姨妈正吃面包黄油布丁。杰拉尔德讲得兴致勃勃，细节多得没完没了。教堂钟都敲过十一点半了，他才讲到凡人已经尽力，外援再也指望不上，而那位英勇的小侦探正要继续行动。
        - id: ch01-b16
          speaker: gerald
          text: 咦，梅布尔来了！
        - id: ch01-b17
          speaker: narrator
          text: 果然，一辆大车停下来，后挡板几乎把梅布尔卸在他们脚边。
        - id: ch01-b18
          speaker: princess
          text: 你们一直不来，我实在等不下去了，正好搭车过来。后来还有什么事吗？贝茨赶到保险库的时候，那些贼已经跑掉了。
        - id: ch01-b19
          speaker: jimmy
          text: 你不会真说，那一大套胡扯全是真的吧？
        - id: ch01-b20
          speaker: kathleen
          text: 当然是真的。杰里，快接着讲。你刚说到把石头扔进梅布尔的面包黄油布丁。往下讲呀。
        - id: ch01-b21
          speaker: narrator
          text: 梅布尔爬上围墙，告诉杰拉尔德，他恢复现形比自己快得多。杰拉尔德点点头，又摆出了讲故事的架势。
        - id: ch01-b22
          speaker: gerald
          text: 十二点还有鱼等我去煎，现在都过了半点，本故事只能长话短说。杰拉尔德·德·福尔摩斯留下那封信，让它好好完成警告的使命，自己披着隐身衣飞奔回去。盗贼还在遮光提灯底下，准时又利落地偷东西。我可不想白白冒险，就等在台阶外面的过道里。梅布尔，你知道那地方吧？
        - id: ch01-b23
          speaker: narrator
          text: 梅布尔点了点头。
        - id: ch01-b24
          speaker: gerald
          text: 没多久，他们就踮着脚出来，先朝四周看了看。因为看不见我，他们认定没人盯着，便排成一列，悄悄穿过通道。有一袋银器还擦过我的肚子。接着，他们走进黑夜里去了。
        - id: ch01-b25
          speaker: princess
          text: 他们去了哪儿？
        - id: ch01-b26
          speaker: gerald
          text: 穿过那间小镜屋，就是你隐身以后照过镜子的地方。英雄穿着看不见的网球鞋，马上追了上去。三个坏蛋躲进树林，在杜鹃花丛里偷偷走，又越过了庄园。
        - id: ch01-b27
          speaker: narrator
          text: 说到这里，他压低声音，直直望向白色尘土路那头。那里有一丛粉红旋花，正盖着一堆石头。
        - id: ch01-b28
          speaker: gerald
          text: 那些会活过来的石头东西，都从灌木和树底下探头看。我看得见它们，它们看不见我。它们却把盗贼看得清清楚楚，可盗贼又看不见它们。是不是很怪？
        - id: ch01-b29
          speaker: narrator
          text: 梅布尔只好先停下来，听大家解释他说的石头东西是什么。
        - id: ch01-b30
          speaker: princess
          text: 我傍晚去过花园那么多次，从没见过雕像活过来。
        - id: ch01-b31
          speaker: gerald
          text: 可我见过。
        - id: ch01-b32
          speaker: princess
          text: 我知道，我知道。我的意思是，也许只有隐身的人才能看见它们活着的样子。不是石头的样子，是活着的那一面。
        - id: ch01-b33
          speaker: narrator
          text: 杰拉尔德听懂了。我也真心希望，你同样听懂了。
        - id: ch01-b34
          speaker: gerald
          text: 你也许说对了。这座城堡的花园确实中了魔法。可它到底怎么中的，又为什么会中，我真想弄明白。走吧，我得在十二点前找到约翰逊。先去市场，再从那里跑过去。
        - id: ch01-b35
          speaker: princess
          text: 可冒险还没讲完呀。边走边说吧，求你了，真的太惊险了！
        - id: ch01-b36
          speaker: narrator
          text: 这句话当然正合杰拉尔德的心意。
        - id: ch01-b37
          speaker: gerald
          text: 好吧。我像在梦里一样，一路跟着他们。他们从我们钻进来的那个洞出去，我差点真跟丢了。得先让他们沿路走远，免得听见我踩响石头，再拼命跑才能追上。我连鞋都脱了，袜子大概已经全毁了。我一直跟，一直跟。他们穿过穷人住的街区，走到河边。还有……不行，咱们必须跑了！
        - id: ch01-b38
          speaker: narrator
          text: 故事只好停下，四个孩子拔腿就跑。
        - id: ch01-b39
          speaker: narrator
          text: 他们在约翰逊家的后院找到他。警官站在后门的一张长凳旁，正在洗脸。
        - id: ch01-b40
          speaker: gerald
          text: 约翰逊，你听着。我要是教你怎么拿到那五十英镑赏金，你拿什么谢我？
        - id: ch01-b41
          speaker: constable_johnson
          text: 一人一半。可你要是拿胡话耍我，我就赏你脑袋旁边一巴掌。
        - id: ch01-b42
          speaker: gerald
          text: 不是胡话。让我们进去，我把事情全告诉你。等你抓住盗贼，找回赃物，只要给我一英镑，讨个好彩头。我不多拿。
        - id: ch01-b43
          speaker: constable_johnson
          text: 那就进来吧，只要几位小姐不介意我还拿着毛巾。不过我敢说，你还想从我这儿得到别的。要不，你怎么不自己去领赏？
        - id: ch01-b44
          speaker: gerald
          text: 约翰逊真是智慧过人，一开口，每个字都长了翅膀。
        - id: ch01-b45
          speaker: narrator
          text: 这时孩子们已经进屋，门也关好了。
        - id: ch01-b46
          speaker: gerald
          text: 我要你答应，绝不说出是谁告诉你的。让大家都以为，这是你凭自己的勇气和眼光查出来的。
        - id: ch01-b47
          speaker: constable_johnson
          text: 坐下说。你要是在耍我，最好趁我动手以前，先叫小姑娘们回家。
        - id: ch01-b48
          speaker: gerald
          text: 我没耍你，也从没这么认真过。只要不是警察，谁都知道我为什么不想让人知道。半夜里，我跑到一个不该去的地方，才查清这件事。家里要是知道我几乎整夜没回去，非闹翻不可。现在明白了吗，我那双眼明亮的小雏菊？
        - id: ch01-b49
          speaker: narrator
          text: 约翰逊已经听入了神。吉米后来还说，这时候不管别人用多傻的名字叫他，他都不在意。警官说自己明白了，又催杰拉尔德多讲一点。
        - id: ch01-b50
          speaker: gerald
          text: 那你就别问。我该告诉你的，自然会全说。昨晚十一点左右，我在雅尔丁塔楼。我怎么去的，去干什么，这些不重要。那里开着一扇窗，我就进去了。保险库里透出灯光，有三个男人正在把银器装进袋子。
        - id: ch01-b51
          speaker: constable_johnson
          text: 写信警告他们去报警的，就是你？
        - id: ch01-b52
          speaker: narrator
          text: 约翰逊热切地朝前探着身子，两只手都按在膝盖上。
        - id: ch01-b53
          speaker: gerald
          text: 是我。你愿意的话，也可以叫他们以为是你写的。那时候你下班了吧？
        - id: ch01-b54
          speaker: constable_johnson
          text: 下班了，正躺在墨菲的怀抱里呢。
        - id: ch01-b55
          speaker: gerald
          text: 警察来得太慢。可我还留在那里，孤零零的一个侦探。我跟踪了他们。
        - id: ch01-b56
          speaker: constable_johnson
          text: 你真跟上去了？
        - id: ch01-b57
          speaker: gerald
          text: 我亲眼看见他们把赃物藏好。霍顿庄园丢的那批东西，也放在同一个地方。我还听见他们约好什么时候运走。
        - id: ch01-b58
          speaker: constable_johnson
          text: 快带我去！
          emotion: surprised
        - id: ch01-b59
          speaker: narrator
          text: 约翰逊猛地跳起来，温莎扶手椅朝后一倒，砰地砸在红砖地上。
        - id: ch01-b60
          speaker: gerald
          text: 不行。你要是在约好的时间之前靠近，银器倒是能找回来，那些贼却永远也抓不到了。
          emotion: calm
        - id: ch01-b61
          speaker: narrator
          text: 警官承认这话有道理，扶起椅子重新坐好，又问后来怎么办。
        - id: ch01-b62
          speaker: gerald
          text: 今晚一点，会有一辆汽车开到萨德勒公寓群那边，就在船屋后面的小路上接他们。十二点半，那些贼会把东西从水里捞出来，用船运过去。现在正是你把钱装进口袋，让荣誉和光辉披满全身的好机会。
        - id: ch01-b63
          speaker: constable_johnson
          text: 老天作证，这么一整套事情，你总不可能全靠脑袋编出来。
        - id: ch01-b64
          speaker: narrator
          text: 他还在思量，也还没有完全相信。
        - id: ch01-b65
          speaker: gerald
          text: 当然编得出来，可这一回是真的。听好，这种机会一辈子只有一次。我拿一英镑，你替我保密，就这么办。你答不答应？
        - id: ch01-b66
          speaker: constable_johnson
          text: 答应，我当然答应。可你要是又在胡闹……
        - id: ch01-b67
          speaker: kathleen
          text: 你难道看不出来，他没有胡闹吗？他不是骗子，我们也都不是。
        - id: ch01-b68
          speaker: gerald
          text: 你不愿意就明说。我可以去找一个脑子更好使的警察。
        - id: ch01-b69
          speaker: constable_johnson
          text: 我可会把你一夜没回家的事全说出去。
        - id: ch01-b70
          speaker: princess
          text: 可你不会这么不讲绅士风度吧？我们是好心帮你，别总是疑神疑鬼的。
        - id: ch01-b71
          speaker: gerald
          text: 换成我，就带两个人去藏银器的地方。旁边有木料场，正好设埋伏。再派两三个爬上小路边的树，等着那辆汽车。
        - id: ch01-b72
          speaker: constable_johnson
          text: 你真该加入警察队伍。可要是这一切都是骗局呢？
        - id: ch01-b73
          speaker: jimmy
          text: 那你就出一回洋相呗。反正大概也不是第一次。
        - id: ch01-b74
          speaker: gerald
          text: 吉米，你这个笨蛋，闭嘴！约翰逊，你到底干不干？
        - id: ch01-b75
          speaker: constable_johnson
          text: 干。
        - id: ch01-b76
          speaker: gerald
          text: 那你值勤时去木料场。我在哪儿擤鼻子，赃物就在哪儿。袋子用绳子系在水下的木桩上。你只管摆出又庄严又漂亮的样子，从旁边走过去，把地点记住。光荣就在那里等着你。以后名声把你托上云端，你升了警长，可别忘了我。
        - id: ch01-b77
          speaker: narrator
          text: 约翰逊连声说，今天真算开了眼。他答应照办，又说自己现在立刻就得动身。
        - id: ch01-b78
          speaker: narrator
          text: 约翰逊的小屋在镇外铁匠铺那边。孩子们穿过树林来，又照原路回去。他们走过镇上狭窄而不太好闻的街道，来到木料场旁的纤道。在那里，他们踩着大树干奔跑，探头看锯木坑。工人们都去吃午饭了，这地方本来就是方圆几英里内男孩子最爱的游乐场。他们又搬来一块刚锯好、带着松香味的木板，架在一截榆树根上，当成跷跷板。
        - id: ch01-b79
          speaker: princess
          text: 这里太棒了！我觉得比假装游戏更好玩，甚至比魔法都好玩。
        - id: ch01-b80
          speaker: jimmy
          text: 我也这么觉得。杰里，别再吸鼻子了，再吸就要把鼻子吸没啦。
        - id: ch01-b81
          speaker: gerald
          text: 我也没办法。我不敢拿手帕，万一约翰逊正躲在哪儿看着呢？早知道就换个暗号了。怪就怪在这里，要是没人规定我非得吸鼻子，我现在一点也不想吸。可一到这儿，想起暗号，我马上就伤风了。谢天谢地，他来了！
        - id: ch01-b82
          speaker: narrator
          text: 孩子们装作什么事也没有，离开了跷跷板。杰拉尔德喊着大家跟上领头的人，自己先在一根剥过皮的橡木上跑起来。其他人紧跟在后。他们绕过木堆，又从一层层木板伸出的板头下钻过去。警官的沉重靴子刚踏上纤道，杰拉尔德便停在一座朽木板搭成的小码头尽头。那里连扶栏都摇摇晃晃。他大喊停战，随后使足力气，响亮地擤了鼻子。
        - id: ch01-b83
          speaker: gerald
          text: 早上好。
        - id: ch01-b84
          speaker: constable_johnson
          text: 早上好。伤风了？
        - id: ch01-b85
          speaker: gerald
          text: 唉，我要是有你这样的靴子，怎么会伤风？瞧瞧它们。你这双仙履走起路来，一英里外都听得见。你究竟怎么靠近别人，把人抓住的？
        - id: ch01-b86
          speaker: narrator
          text: 他跳下码头，从约翰逊身边经过时，压低声音告诉警官，要勇敢，要果断，要行动，地点就在这里。说完，他又跑开，继续领着那支活泼的队伍。
        - id: ch01-b87
          speaker: kathleen
          text: 我们带了一位朋友回来吃午饭。法国女教师呢？
        - id: ch01-b88
          speaker: narrator
          text: 伊莱扎开门告诉他们，法国女教师去参观雅尔丁塔楼了，今天那里对外开放。她又催孩子们快点吃，因为自己下午休假，男朋友最讨厌等人。
        - id: ch01-b89
          speaker: gerald
          text: 放心，我们会吃得像闪电一样快。你这个天使，再摆一套餐具吧。
        - id: ch01-b90
          speaker: narrator
          text: 他们说到做到。午饭是碎牛肉、土豆和米布丁，大概是世上最乏味的一顿，只花一刻钟便吃完了。伊莱扎提着一罐热水上楼以后，梅布尔问起戒指。她该把它放回原处了。
        - id: ch01-b91
          speaker: jimmy
          text: 还没轮到我呢。找到以后，我和凯茜也该像你和杰拉尔德一样，各戴一次。
        - id: ch01-b92
          speaker: princess
          text: 找到以后？
          emotion: surprised
        - id: ch01-b93
          speaker: narrator
          text: 她苍白的脸夹在黑发中间，一下变得更白了。
        - id: ch01-b94
          speaker: kathleen
          text: 真对不起，我们都很对不起。
        - id: ch01-b95
          speaker: narrator
          text: 他们只好把戒指怎样丢失的，从头讲了一遍。
        - id: ch01-b96
          speaker: princess
          text: 你们一定没有认真找。戒指不可能平白无故就没了。
        - id: ch01-b97
          speaker: gerald
          text: 它到底会做什么，你不知道，我们也不知道。别像豪猪一样把刺全竖起来，尊贵的小姐。没准它能让自己消失呢。它是在床上从我手指上滑掉的，能找的地方我们都找过了。
        - id: ch01-b98
          speaker: princess
          text: 我可以自己找一遍吗？要是真把它弄丢了，就是我的错，简直跟偷走差不多。约翰逊一定也会这么说，我知道。
        - id: ch01-b99
          speaker: kathleen
          text: 那大家再找一次。今天早上，我们确实太匆忙了。
        - id: ch01-b100
          speaker: narrator
          text: 于是他们又找起来。床上床下，地毯下面，家具底下，全都搜过。窗帘抖了，墙角翻了，除了一团团灰尘和绒毛，什么也没找到。他们接着找，哪里都不肯放过。吉米甚至盯住天花板，好像戒指会弹到上面粘住似的。可是，还是没有。
        - id: ch01-b101
          speaker: princess
          text: 那就只有一个可能，是你们的女佣偷了。我认定是她，我要当面告诉她。
        - id: ch01-b102
          speaker: narrator
          text: 她还真准备去说。偏偏就在这时，前门砰地响了一声。大家知道，伊莱扎已经穿上最体面的衣裳，风风光光去见她的男朋友了。
        - id: ch01-b103
          speaker: princess
          text: 没用了。你们能让我一个人待一会儿吗？也许你们在旁边，我总是分心。我想自己把房间一寸一寸找过去。
          emotion: sad
        - id: ch01-b104
          speaker: gerald
          text: 为了照顾贵客的心情，善良的烧炭人就此退下。
        - id: ch01-b105
          speaker: narrator
          text: 他们轻轻关上门，把梅布尔和她的搜寻留在房里。大家当然得等她。礼貌要求他们等，法国女教师回来时，也得有人开门。可外面天气好得耀眼，吉米又刚想起，杰拉尔德口袋里还装满了集市上赚来的钱。那些钱除了买过几个杰拉尔德一口也没吃到的小面包，什么都没买过。孩子们自然越等越不耐烦。
        - id: ch01-b106
          speaker: narrator
          text: 感觉像过了一小时，其实足足只有十分钟。卧室门终于开了，梅布尔的脚步顺着楼梯下来。
        - id: ch01-b107
          speaker: gerald
          text: 她没找到。
        - id: ch01-b108
          speaker: jimmy
          text: 你怎么知道？
        - id: ch01-b109
          speaker: gerald
          text: 听脚步就知道。
        - id: ch01-b110
          speaker: narrator
          text: 一个人找完东西回来，光听脚步，几乎总能猜出他有没有找到。梅布尔的脚步把“没戏”说得明明白白，她的脸也证实了这个坏消息。
        - id: ch01-b111
          speaker: narrator
          text: 后门忽然传来一阵猛烈的敲击。现在谁也不用客气地表示遗憾，更不用硬说戒指肯定会出现了。除了伊莱扎，所有仆人都在休假，孩子们便一起去开门。杰拉尔德说，如果来的是面包师，正好买块蛋糕当甜点，那样的一顿午饭实在需要甜点。
        - id: ch01-b112
          speaker: narrator
          text: 来的却不是面包师。门一打开，只见铺石的院子里站着一个年轻人，旁边是水泵、垃圾箱和水桶。他的帽子歪得厉害，浅色硬胡子下的嘴巴张得老大，两只眼睛也瞪圆到了极点。他穿着鲜芥末色西装，系蓝领带，背心上横着金灿灿的表链。整个人往后仰，右臂却朝门口笔直伸着，活像有什么东西硬拖着他，不肯让他走。凯瑟琳低声说，这人像从疯人院跑出来的，伸手便要关门。可门关不上，有东西挡住了。
        - id: ch01-b113
          speaker: alf
          text: 放开我！
          emotion: fearful
        - id: ch01-b114
          speaker: eliza
          text: 好哇，我这就放开你！
          emotion: angry
        - id: ch01-b115
          speaker: narrator
          text: 那明明是伊莱扎的声音，可伊莱扎根本看不见。
        - id: ch01-b116
          speaker: kathleen
          text: 是谁抓着你？
        - id: ch01-b117
          speaker: alf
          text: 是她，小姐。
        - id: ch01-b118
          speaker: kathleen
          text: 她是谁？
        - id: ch01-b119
          speaker: narrator
          text: 凯瑟琳后来解释，她这样问只是想拖延时间，因为她已经明白，挡着门的是伊莱扎那只看不见的脚。
        - id: ch01-b120
          speaker: alf
          text: 我的未婚妻，小姐。至少声音是她的，摸起来那身骨头也像她。可我不知道出了什么事，我就是看不见她。
        - id: ch01-b121
          speaker: eliza
          text: 他翻来覆去就是这么说。他是我男朋友。到底是他疯了，还是我疯了？
        - id: ch01-b122
          speaker: jimmy
          text: 我看，你们两个都疯了。
        - id: ch01-b123
          speaker: eliza
          text: 喂，你也算个男子汉。看着我的脸说，你看不见我。
        - id: ch01-b124
          speaker: alf
          text: 可我真的看不见你。
        - id: ch01-b125
          speaker: gerald
          text: 我要是偷了戒指，就会进屋安安静静待着，才不会站在后门口，当着大家出洋相。
        - id: ch01-b126
          speaker: jimmy
          text: 她也没多少洋相能让人看。好戒指！
        - id: ch01-b127
          speaker: alf
          text: 我没偷东西。放开我！准是我的眼睛出了问题。快放手，听见没有？
          emotion: angry
        - id: ch01-b128
          speaker: narrator
          text: 他的手突然垂下，整个人踉跄着撞上水桶。伊莱扎真的放手了。她从孩子们中间挤过去，看不见的胳膊肘把大家推向两边。杰拉尔德一只手抓住她的胳膊，另一只手摸到她耳边，低声命令她站着别动，一个字也不许说。她要是不听，还有什么能拦住他去叫警察呢？
        - id: ch01-b129
          speaker: narrator
          text: 伊莱扎想不出答案，只好照办。她看不见地站在那里，一声不出，只剩下一阵阵呼哧呼哧的喘气声。每次累得喘不过气时，她都会发出这种声音。
        - id: ch01-b130
          speaker: narrator
          text: 穿芥末色西装的年轻人终于站稳了。他瞪着孩子们，眼睛要是还能更圆，这时准比刚才更圆。
        - id: ch01-b131
          speaker: alf
          text: 这是怎么回事？到底出了什么事？
          emotion: fearful
        - id: ch01-b132
          speaker: gerald
          text: 你自己都不知道，我们恐怕更没法告诉你了。
        - id: ch01-b133
          speaker: narrator
          text: 杰拉尔德说得十分客气。年轻人摘下帽子，拿手擦过额头。
        - id: ch01-b134
          speaker: alf
          text: 我刚才说话是不是很古怪？
        - id: ch01-b135
          speaker: princess
          text: 非常古怪。
        - id: ch01-b136
          speaker: alf
          text: 但愿我没说什么失礼的话。
        - id: ch01-b137
          speaker: kathleen
          text: 一点也没有。你只说，未婚妻正抓着你的手，可你看不见她。
        - id: ch01-b138
          speaker: alf
          text: 我的确看不见她。
        - id: ch01-b139
          speaker: princess
          text: 我们也看不见。
        - id: ch01-b140
          speaker: alf
          text: 可我总不可能先做了一个梦，再一路走到这里，像一便士的杂耍一样，当众给人看笑话吧？
        - id: ch01-b141
          speaker: gerald
          text: 这件事，你自己最清楚。
        - id: ch01-b142
          speaker: alf
          text: 可是，你们是说……
        - id: ch01-b143
          speaker: gerald
          text: 我什么都不打算告诉你，这可是实话。不过我能给你一点建议。回家躺一会儿，头上敷块湿布。明天就会好了。
        - id: ch01-b144
          speaker: alf
          text: 可我没有……
        - id: ch01-b145
          speaker: princess
          text: 换成我，我就会照办。今天太阳很毒呢。
        - id: ch01-b146
          speaker: alf
          text: 我现在觉得没事了。可是……唉，我只能说对不起，也只有这句话可说。我以前从没出过这种毛病，小姐。请别以为我常常这样。我敢发誓，刚才那就是伊莱扎。她不是出来见我了吗？
        - id: ch01-b147
          speaker: princess
          text: 伊莱扎在屋里。她今天不能出来见任何人。
        - id: ch01-b148
          speaker: alf
          text: 你们不会把我刚才的样子告诉她吧，小姐？她要是以为我会发病，也许就不喜欢我了。可我从小到大，一次也没发过病。
        - id: ch01-b149
          speaker: princess
          text: 我们不会对伊莱扎说任何关于你的事。
        - id: ch01-b150
          speaker: alf
          text: 那你们会原谅我这么冒失吧？
        - id: ch01-b151
          speaker: kathleen
          text: 当然。我们知道你也没办法。快回家躺下吧，你一定得休息。下午好。
        - id: ch01-b152
          speaker: alf
          text: 下午好，小姐。可我现在说话的时候，手上还能感觉到她的指骨压出来的印子。还有，千万别让这件事传到我老板那里，我是说我的雇主。不管干哪一行，男人犯这种病都没好处。
        - id: ch01-b153
          speakers: [gerald, jimmy, kathleen, princess]
          ensemble: chorus
          text: 不会的，不会的，没事。再见！
        - id: ch01-b154
          speaker: narrator
          text: 他恍恍惚惚地绕过水桶，慢慢走了。绿色院门在他身后合上，四周顿时安静下来。打破沉默的是伊莱扎。
        - id: ch01-b155
          speaker: eliza
          text: 把我交出去吧！把我送进牢房，让我在那里伤透心吧！
          emotion: sad
        - id: ch01-b156
          speaker: narrator
          text: 啪嗒一声，门阶上多了一颗圆圆的水珠。吉米说是雷阵雨，其实那是伊莱扎的一滴眼泪。
        - id: ch01-b157
          speaker: eliza
          text: 把我交出去吧，交出去吧。可别让我在这个人人认识我、尊重我的镇上被抓。宁可让我走十英里，到一个陌生警察那里自首。就是别去找约翰逊，他正在跟我表妹交往。不过有件事，我得谢谢你们。你们没告诉阿尔夫，是我偷了戒指。可我没有偷，我只是借来戴戴。今天轮到我休假，我男朋友又那么体面，你们自己也瞧见了。
          emotion: sad
        - id: ch01-b158
          speaker: narrator
          text: 她每说几句，门阶上便啪嗒落下一滴泪。孩子们着了迷似的盯着看。眼泪从可怜的伊莱扎那只看不见的鼻子上滚下来，落地以后才显出形状。杰拉尔德这才回过神。
        - id: ch01-b159
          speaker: gerald
          text: 说这些都没用，我们根本看不见你！
        - id: ch01-b160
          speaker: eliza
          text: 他也是这么说的。可是……
        - id: ch01-b161
          speaker: gerald
          text: 你自己也看不见自己。你的手在哪儿？
        - id: ch01-b162
          speaker: narrator
          text: 伊莱扎一定低头找了找，当然什么也没看见。她立刻尖叫起来。附近要是有警察，这声音准能把他们全招来。接着，她歇斯底里地哭闹起来。孩子们使出浑身解数，把书里读过的、这种时候该用的办法全试了一遍。可是，要照料一个穿着最漂亮衣服、完全看不见、又哭闹不休的女佣，实在太难。后来，她最好的帽子彻底毁了，那条最好的蓝裙子也再没恢复原样，原因就在这里。
        - id: ch01-b163
          speaker: narrator
          text: 他们把羽毛掸子的碎片点着，尽量凑近猜想中伊莱扎鼻子所在的位置。火焰突然往上一蹿，幸亏杰拉尔德眼疾手快，把它扑灭了。一股可怕的焦味飘出来，明明白白地告诉大家，伊莱扎那条羽毛围巾也来帮忙了。
        - id: ch01-b164
          speaker: eliza
          text: 别烧我那条真鸵鸟毛披肩。我已经好了。
        - id: ch01-b165
          speaker: narrator
          text: 看来那条披肩确实帮上了忙。伊莱扎深深抽噎一下，清醒过来。孩子们扶她起身，让她坐在最下面一级台阶上，再仔仔细细、和和气气地说明，她真的隐身了。谁要是偷走戒指，就算只说是借来戴戴，也永远猜不到会发生什么。
        - id: ch01-b166
          speaker: narrator
          text: 他们从厨房水池上方的钉子取下红木小镜子，这才让伊莱扎彻底相信，自己真的看不见了。
        - id: ch01-b167
          speaker: eliza
          text: 难道我得一辈子这样？我们本来约好复活节结婚。谁肯娶一个根本看不见的姑娘？不会有人肯的。
          emotion: sad
        - id: ch01-b168
          speaker: princess
          text: 不会一辈子这样的。你只要像出麻疹一样，把这段时间熬过去。我想，明天就会好了。
          emotion: calm
        - id: ch01-b169
          speaker: gerald
          text: 我看今天晚上就会好。
        - id: ch01-b170
          speaker: kathleen
          text: 我们会尽力帮你，也不会告诉任何人。
          emotion: calm
        - id: ch01-b171
          speaker: jimmy
          text: 连警察也不告诉。
        - id: ch01-b172
          speaker: gerald
          text: 现在去准备法国女教师的茶点吧。
        - id: ch01-b173
          speaker: jimmy
          text: 还有我们的茶点。
        - id: ch01-b174
          speaker: gerald
          text: 不，我们去外面喝茶，来一次野餐，还带上伊莱扎。我去买蛋糕。
        - id: ch01-b175
          speaker: eliza
          text: 我可不吃蛋糕，杰里少爷，您别想让我吃。你们会看着蛋糕一路掉进我的胸口。在大庭广众之下，让人瞧见我胸膛里有一块蛋糕，我可不觉得体面。唉，我不过借了件东西，居然受到这样的惩罚！
        - id: ch01-b176
          speaker: narrator
          text: 大家好好安慰了她，又替法国女教师摆好茶点。他们派凯瑟琳去开门。法国女教师回来时，看起来疲倦，还有一点忧伤。等她安顿好，杰拉尔德也带着蛋糕回来了，大家这才一起动身去雅尔丁塔楼。
        - id: ch01-b177
          speaker: princess
          text: 这里不准野餐。
        - id: ch01-b178
          speaker: gerald
          text: 我们自己准许自己。伊莱扎，挽住凯瑟琳的胳膊，我走在后面，替你挡住影子。我的老天，快把帽子摘了！它把你的影子弄得不伦不类，别人会以为郡立疯人院把病人全放出来了。
        - id: ch01-b179
          speaker: narrator
          text: 帽子一落进凯瑟琳手里，马上显出形来。大家这才看清，刚才洒的水几乎没有一滴落在伊莱扎脸上该在的地方。
        - id: ch01-b180
          speaker: eliza
          text: 我最好的帽子。
          emotion: sad
        - id: ch01-b181
          speaker: narrator
          text: 接下来是一阵沉默，中间夹着抽鼻子的声音。
        - id: ch01-b182
          speaker: princess
          text: 听着，振作一点。只当这一切是场梦。你碰了戒指，心里过意不去，难受得做了这样一场梦。
          emotion: calm
        - id: ch01-b183
          speaker: eliza
          text: 那我还会醒过来吗？
          emotion: fearful
        - id: ch01-b184
          speaker: princess
          text: 当然会。现在我们要蒙住你的眼睛，带你穿过一扇很小的门。别反抗，不然我们立刻把警察叫进你的梦里。
        - id: ch01-b185
          speaker: narrator
          text: 我没有时间细讲，他们到底怎样把伊莱扎弄进那个洞。她头朝前钻进去，女孩们在后面推，男孩们在前面接。要不是杰拉尔德想到先把她的手绑住，准有人会被抓伤。即便这样，梅布尔的手还是夹在冰冷的岩石和一只暴躁的靴后跟之间，受了伤。
        - id: ch01-b186
          speaker: narrator
          text: 他们领着伊莱扎走过两旁长满蕨草的沟谷，穿过拱门，进入那片像意大利风景一样的仙境。至于一路上她说了些什么，我也不准备全讲。等他们在垂柳下面解开蒙眼布，她已经没多少话可说了。旁边站着狄安娜雕像，手拿弓箭，还翘起一只脚。我始终觉得，这个姿势非常不适合射箭。
        - id: ch01-b187
          speaker: gerald
          text: 好了，麻烦全过去了。现在只剩下好事，还有蛋糕之类的东西。
        - id: ch01-b188
          speaker: jimmy
          text: 我们早就该喝茶了。
        - id: ch01-b189
          speaker: narrator
          text: 的确早该喝了。伊莱扎终于相信，自己的胸口虽然看不见，却并不是透明的，别人不会隔着胸膛数出她吃了几个小面包。于是她痛痛快快吃了一顿，其他人也一样。想真正享受下午茶，最好的办法，就是先用碎牛肉、土豆和米布丁做午饭，再经过几个小时的刺激，拖到很晚才喝茶。
        - id: ch01-b190
          speaker: narrator
          text: 花园里柔和又清凉的绿色和灰色，正在一点点变化。绿色渐渐染上金光，阴影变得墨黑。太阳对面，几朵松软的小云泛着玫瑰色，把福玻斯神殿下面的湖水也染亮了。天鹅的倒影颠倒着映在水里。
        - id: ch01-b191
          speaker: eliza
          text: 真漂亮，简直像明信片一样。就是那种两便士一张的，对吧？
        - id: ch01-b192
          speaker: princess
          text: 我该回家了。
        - id: ch01-b193
          speaker: eliza
          text: 我这个样子可回不了家。宁可留在这里当野人，住进那座白房子。只要它有墙，也有门就行。
        - id: ch01-b194
          speaker: princess
          text: 你说的是狄俄尼索斯神殿。
        - id: ch01-b195
          speaker: narrator
          text: 梅布尔指给她看。太阳忽然沉到坡顶那排黑杉树后面。刚才还泛着粉红的白神殿，一转眼便成了灰色。
        - id: ch01-b196
          speaker: kathleen
          text: 就算现在这样，也算是个很不错的住处。
        - id: ch01-b197
          speaker: eliza
          text: 到处漏风。天哪，这么多台阶都得擦！房子连墙也没有，到底是给谁住的？谁会住在……那是什么？
        - id: ch01-b198
          speaker: narrator
          text: 她猛地停下来，瞪大了眼睛。
        - id: ch01-b199
          speaker: kathleen
          text: 什么东西？
        - id: ch01-b200
          speaker: eliza
          text: 有个白色的东西正从台阶上下来。哎呀，是一座年轻人的雕像。
          emotion: surprised
        - id: ch01-b201
          speaker: gerald
          text: 这里的雕像，只要太阳下山，就会活过来。
        - id: ch01-b202
          speaker: narrator
          text: 杰拉尔德的语气平淡得不能再平淡。
        - id: ch01-b203
          speaker: eliza
          text: 我看见了。又来了一个。瞧，他脚上还有一对小翅膀，跟鸽子一样。
        - id: ch01-b204
          speaker: gerald
          text: 那大概是墨丘利。
        - id: ch01-b205
          speaker: princess
          text: 脚上长翅膀的那座，底下写的是“赫尔墨斯”。可是……
        - id: ch01-b206
          speaker: jimmy
          text: 我一座活雕像都看不见。你捅我干吗？
        - id: ch01-b207
          speaker: gerald
          text: 你们真的看不见吗？太阳一下山，雕像就活过来了。除非你也隐了身，不然根本看不见它们。而且就算看见，只要不碰它们，你也不会害怕。
        - id: ch01-b208
          speaker: narrator
          text: 其实他根本不用担心伊莱扎会听见。她所有的心思都放在眼前的景象上，两只眼睛来回移动，追着那些别人看不见的雕像。
        - id: ch01-b209
          speaker: jimmy
          text: 让她碰一个试试看。
        - id: ch01-b210
          speaker: eliza
          text: 他跳进水里了。哎哟，游得真好！那个脚上长着鸽子翅膀的，正飞过整个湖面，陪他玩呢。真漂亮，就像婚礼蛋糕上的小爱神。这里又来了一个，是个长耳朵的小家伙，旁边还有一只小鹿跟他一起跑。再看那个抱孩子的太太，她把孩子抛起来，又伸手接住，简直像在抛一只球。她居然一点也不害怕。不过，他们真好看。
        - id: ch01-b211
          speaker: narrator
          text: 宽阔的庄园在孩子们眼前铺展开来，暮色越来越灰，四周也越来越静。渐浓的阴影里，他们只能看见一尊尊雕像泛着白光，一动不动。伊莱扎眼里却是另一番景象。过了一会儿，她静静看着，孩子们也陪她静静看着。黄昏像一层越来越沉、越来越黑的面纱落下来。夜晚到了，月亮升上树梢。
        - id: ch01-b212
          speaker: eliza
          text: 啊！那个带小鹿的可爱男孩过来了。他正朝我冲过来呢，愿上帝保佑他！
          emotion: surprised
        - id: ch01-b213
          speaker: narrator
          text: 下一刻，她尖叫起来。叫声越来越远，碎石路上响起一双靴子拼命奔跑的声音。
        - id: ch01-b214
          speaker: gerald
          text: 快追！她碰到雕像了，所以才会害怕，跟我那次一样。跑啊！她要是这样冲进镇里，非把所有人逼疯不可。别人只能听见声音，看见靴子！快跑！
        - id: ch01-b215
          speaker: narrator
          text: 他们追了上去，可伊莱扎已经抢先一大段。她一跑上草地，连脚步声也听不见了。大家只能等她踩上远处的碎石路，再顺着皮靴的声音追。况且，她是被恐惧推着往前跑的，而恐惧跑得飞快。
        - id: ch01-b216
          speaker: narrator
          text: 她像是挑了最近的路，在越来越亮的月光里，无影无形地穿过林中空地和树丛。一路上她究竟看见些什么，只有她自己知道。
        - id: ch01-b217
          speaker: princess
          text: 我留在这里。明天见！她已经穿过马厩院子了。
        - id: ch01-b218
          speaker: narrator
          text: 追赶的人踏着震天响的脚步，从平台上奔过去。等他们转过自家街角，杰拉尔德已经喘得上气不接下气。
        - id: ch01-b219
          speaker: gerald
          text: 走后门！
        - id: ch01-b220
          speaker: narrator
          text: 他和吉米从水桶旁边荡过去，冲进院子。锁着的后门前，仿佛有个看不见、又急得要命的东西，正四处摸索。教堂钟敲响了半点。
        - id: ch01-b221
          speaker: gerald
          text: 九点半。拽戒指，也许现在能摘下来了。
        - id: ch01-b222
          speaker: narrator
          text: 他是朝空荡荡的门阶说的。可下一刻，那里突然伸出一只手。伊莱扎现形了。她衣衫凌乱，喘得厉害，头发披散，衣领歪着，裙子又扭又皱。那只手清清楚楚地露在月光下，魔法戒指那枚乌黑的圆环，就躺在她的手心里。
        - id: ch01-b223
          speaker: narrator
          text: 第二天早晨，伊莱扎一手提着水桶，一手拿着擦炉石，打开门时，男朋友已经等在外面了。
        - id: ch01-b224
          speaker: alf
          text: 等一等！真可惜，你昨天下午没有出来。
        - id: ch01-b225
          speaker: eliza
          text: 我也觉得可惜。你昨天去做什么了？
        - id: ch01-b226
          speaker: narrator
          text: 她拿湿布擦过最上面的一级台阶。
        - id: ch01-b227
          speaker: alf
          text: 我有点头疼，下午大半时间都躺着。你呢，做了什么？
        - id: ch01-b228
          speaker: eliza
          text: 没做什么特别的。
        - id: ch01-b229
          speaker: narrator
          text: 等他离开以后，伊莱扎才说，原来那一切都是一场梦。不过，这场梦也给了她一个教训。从今以后，她再也不敢随便碰别人的旧戒指了。
        - id: ch01-b230
          speaker: narrator
          text: 阿尔夫一边往前走，一边也对自己说，看来孩子们没有把他那副怪样告诉伊莱扎。大概真是太阳晒的，就像驻扎在印度的军队那样。他只希望，自己以后别落下这种怪毛病。
