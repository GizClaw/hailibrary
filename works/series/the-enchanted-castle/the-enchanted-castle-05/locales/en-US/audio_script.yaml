  chapters:
    - id: ch01
      title: CHAPTER V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: They searched every corner of the bedroom, turned everything out, and still found no ring.
        - id: ch01-b02
          speaker: gerald
          text: Search and research have both failed. Our noble detective now has other fish to fry. But if you want to hear what happened last night—
        - id: ch01-b03
          speaker: kathleen
          text: Let's wait until we reach Mabel.
        - id: ch01-b04
          speaker: jimmy
          text: We weren't meeting her until half past ten. Why can't Gerald talk while we walk? I don't suppose much happened anyway.
        - id: ch01-b05
          speaker: gerald
          text: That only shows how little you know. Mournful Mabel may wait for us in vain. I have other fish to fry!
        - id: ch01-b06
          speaker: narrator
          text: He sang the last words to the tune of “Cherry Ripe,” then made up another verse about Johnson and his smiling lips. Kathleen could have pinched him.
        - id: ch01-b07
          speaker: jimmy
          text: Tell us when you've finished.
        - id: ch01-b08
          speaker: kathleen
          text: How can you be so aggravating?
        - id: ch01-b09
          speaker: gerald
          text: I don't know. Perhaps I need sleep. Perhaps success has gone to my head. Come somewhere nobody can hear us. And mind the keyhole with an ear glued to it.
        - id: ch01-b10
          speaker: narrator
          text: Gerald whispered the warning, then jerked the door open. Sure enough, Eliza was crouching outside. She made a weak show of dusting the woodwork, but there was no hiding what she had done.
        - id: ch01-b11
          speaker: jimmy
          text: You know what listeners never hear.
        - id: ch01-b12
          speaker: eliza
          text: Well, I didn't hear it, so there!
        - id: ch01-b13
          speaker: narrator
          text: Her ears were scarlet. The children went up the High Street and sat on the churchyard wall with their legs swinging. Gerald kept his mouth pressed into a thin, stubborn line all the way.
        - id: ch01-b14
          speaker: kathleen
          text: Jerry, please don't be a goat. I'm simply dying to know what happened.
        - id: ch01-b15
          speaker: gerald
          text: That's better.
        - id: ch01-b16
          speaker: narrator
          text: Then Gerald told them everything that had happened after they left him. As he spoke, some of the white mystery and magic of the moonlit gardens entered his voice. He described the statues stepping down from their places and the great beast that seemed alive through every inch of its stone body. Kathleen felt the wonder of it and clutched his arm. Even Jimmy stopped striking his heels against the churchyard wall. He sat with his mouth open and listened.
        - id: ch01-b17
          speaker: narrator
          text: Then came the exciting part about the burglars. Gerald told how he had watched them at work and written a warning. He had wrapped the message around a stone and thrown it through the window, straight into the peaceful company of Mabel, her aunt, and their bread-and-butter pudding. He enjoyed telling the adventure and left out no detail. By the time he declared that his detective work was done, the church clock was chiming half past eleven.
        - id: ch01-b18
          speaker: gerald
          text: Our gallant young detective had now done everything humanly possible, and no more help could be hoped for. Why, there's Mabel!
        - id: ch01-b19
          speaker: narrator
          text: A cart had just set Mabel down almost at their feet.
        - id: ch01-b20
          speaker: mabel
          text: You never came, and I couldn't wait any longer, so I got a lift. Has anything else happened? The burglars were gone before Bates reached the strong-room.
        - id: ch01-b21
          speaker: jimmy
          text: Do you mean Gerald's whole tale is true?
        - id: ch01-b22
          speaker: kathleen
          text: Of course it is. Keep going, Jerry. You've just reached the part where you threw the stone into Mabel's pudding.
        - id: ch01-b23
          speaker: narrator
          text: Mabel climbed onto the wall beside them.
        - id: ch01-b24
          speaker: mabel
          text: You became visible again much sooner than I did.
        - id: ch01-b25
          speaker: gerald
          text: I'll have to make the rest short. My other fish must be fried at twelve, and it's already past half past eleven. After leaving the warning, Gerald de Sherlock Holmes hurried back invisibly. The burglars were still hard at work by their dark lanterns. I saw no point in running into danger, so I waited outside the passage by the steps.
        - id: ch01-b26
          speaker: narrator
          text: Mabel nodded.
        - id: ch01-b27
          speaker: gerald
          text: Soon they crept out and looked around. They couldn't see me, so they went quietly along the passage in a line. One sack of silver brushed right against my front. Then they slipped out into the night.
        - id: ch01-b28
          speaker: mabel
          text: Which way did they go?
        - id: ch01-b29
          speaker: gerald
          text: They went through the little mirror room, the one where you tried to look at yourself while you were invisible. Our hero hurried after them in his invisible tennis shoes. The three villains made straight for the shelter of the trees. They slipped among the rhododendrons and crossed the park without speaking, while I stayed close behind.
        - id: ch01-b30
          speaker: narrator
          text: Gerald's voice dropped. He stared past the white road at pink bindweed spread over a heap of stones.
        - id: ch01-b31
          speaker: gerald
          text: Those stone creatures that come alive were watching from bushes and under trees. I could see them, but they couldn't see me. They could see the burglars, though, while the burglars couldn't see them. Queer, wasn't it?
        - id: ch01-b32
          speaker: narrator
          text: Mabel had never seen the stone creatures alive, though she had often been in the gardens at evening, so the others had to explain.
        - id: ch01-b33
          speaker: mabel
          text: Perhaps you can only see their living part when you're invisible. I don't mean you can't see the stone part at other times.
        - id: ch01-b34
          speaker: narrator
          text: Gerald understood her, and perhaps you do too.
        - id: ch01-b35
          speaker: gerald
          text: You may be right. The castle garden is certainly enchanted. I only wish I knew how and why. Come on. I must catch Johnson before twelve. We can walk to the market and run from there.
        - id: ch01-b36
          speaker: mabel
          text: Keep telling us while we walk. It's terribly thrilling!
        - id: ch01-b37
          speaker: narrator
          text: That pleased Gerald.
        - id: ch01-b38
          speaker: gerald
          text: I followed them as if I were walking through a dream. They left by the cave we used when we first entered the garden. For a moment I truly thought I'd lost them. I had to let them get well down the road before I climbed out, because the loose stones would rattle and give me away. Then I tore after them as fast as I could. I took off my shoes so they wouldn't hear me, and I expect my stockings are ruined. I followed and followed while they passed through the streets where the poor people live. They kept going until they reached the river. And then—no, we must run now or we'll miss Johnson!
        - id: ch01-b39
          speaker: narrator
          text: The story stopped, and the running began. They found Johnson in his back yard, washing at a bench by his own back door.
        - id: ch01-b40
          speaker: gerald
          text: Johnson, what would you give me if I showed you how to win that fifty-pound reward?
        - id: ch01-b41
          speaker: johnson
          text: Half of it. And a clout beside the head if this is any of your nonsense.
        - id: ch01-b42
          speaker: gerald
          text: It isn't nonsense. Let us come inside and I'll explain. When you've caught the burglars and recovered the stolen goods, just give me one pound for luck. I won't ask for anything more.
        - id: ch01-b43
          speaker: johnson
          text: Come in, then, if the young ladies will excuse my towel. But you must want something else. Why wouldn't you claim the reward yourself?
        - id: ch01-b44
          speaker: narrator
          text: The children went into the cottage, and Johnson shut the door.
        - id: ch01-b45
          speaker: gerald
          text: Great is Johnson's wisdom. His words have wings. What I want is for you never to tell anyone who warned you. Let them believe your own courage and foresight solved everything.
        - id: ch01-b46
          speaker: johnson
          text: Sit down. If you're fooling me, you'd better send the little girls home before I begin on you.
        - id: ch01-b47
          speaker: gerald
          text: I've never been more serious. Anyone but a policeman could see why I need secrecy. I discovered it all in the dead of night, somewhere I had no business being. If the people at home learned that I'd been out nearly the whole night, there would be a horrible row. They would ask where I had gone, how I got there, and why I never came back to bed. I can't allow any of that. Do you understand now, my bright-eyed daisy?
        - id: ch01-b48
          speaker: narrator
          text: Johnson was too interested to object to silly names. He said he understood and wanted to hear more.
        - id: ch01-b49
          speaker: gerald
          text: Then don't ask questions. I'll tell you everything that is good for you to know. At about eleven last night, I was at Yalding Towers. It doesn't matter how I reached the place or what took me there. I found an open window and climbed inside. Somewhere in the house I saw a light. I followed it and found that it came from the strong-room. Three men were there, taking pieces of silver and packing them into a sack.
        - id: ch01-b50
          speaker: johnson
          text: Did you send the warning that brought the police?
        - id: ch01-b51
          speaker: narrator
          text: Johnson leaned forward eagerly, with both hands on his knees.
        - id: ch01-b52
          speaker: gerald
          text: Yes. You may let them think you sent it. You were off duty, weren't you?
        - id: ch01-b53
          speaker: johnson
          text: I was. I was asleep in the arms of Murphy.
        - id: ch01-b54
          speaker: gerald
          text: The police came too late, but I remained there alone, a detective. I followed the thieves.
        - id: ch01-b55
          speaker: johnson
          text: You followed them?
        - id: ch01-b56
          speaker: gerald
          text: I watched them hide the silver. The things stolen from Houghton's Court are hidden there too. I also heard exactly when they mean to move everything.
        - id: ch01-b57
          speaker: johnson
          text: Take me to the place!
        - id: ch01-b58
          speaker: narrator
          text: Johnson sprang up so fast that his Windsor chair crashed backward onto the red-brick floor.
        - id: ch01-b59
          speaker: gerald
          text: Certainly not. Go there before the proper time and you may recover the silver, but you'll never catch the thieves.
        - id: ch01-b60
          speaker: narrator
          text: Johnson agreed, picked up the chair, and sat again.
        - id: ch01-b61
          speaker: gerald
          text: A motorcar is coming to meet them at one o'clock tonight. It will wait in the lane beyond the boathouse by Sadler's Rents. The thieves plan to take the goods out of hiding at half past twelve and carry the sacks along the river in a boat. That gives you time to place your men before they arrive. This is your chance to catch the burglars, fill your pockets with reward money, and cover yourself in honor and glory.
        - id: ch01-b62
          speaker: johnson
          text: Help me, you couldn't have invented all this from nothing.
        - id: ch01-b63
          speaker: gerald
          text: I could have, but I didn't. It's the chance of your life. One pound for me and silence from you, and the bargain is done. Do you agree?
        - id: ch01-b64
          speaker: johnson
          text: I agree. But if this is one of your tricks—
        - id: ch01-b65
          speaker: kathleen
          text: Can't you see it isn't? Gerald isn't a liar. None of us are.
        - id: ch01-b66
          speaker: gerald
          text: If you won't do it, say so. I'll find a more sensible policeman.
        - id: ch01-b67
          speaker: johnson
          text: I could tell everyone you were out all night.
        - id: ch01-b68
          speaker: mabel
          text: But you wouldn't do anything so ungentlemanly. Don't doubt us when we're trying to help you.
        - id: ch01-b69
          speaker: gerald
          text: This is what I would do. Take two other men to the place where the silver is hidden. The wood yard stands close beside it, and the stacks there will make an excellent ambush. You can wait without being seen and catch the thieves when they come for the sacks. Then put two or three more men up in the trees along the lane. They can watch for the motorcar and stop whoever comes to meet the thieves.
        - id: ch01-b70
          speaker: johnson
          text: You ought to have joined the police. But suppose it's a hoax?
        - id: ch01-b71
          speaker: jimmy
          text: Then you'll have made an ass of yourself. It probably won't be the first time.
        - id: ch01-b72
          speaker: gerald
          text: Be quiet, Jimmy, you idiot! Johnson, are you in or not?
        - id: ch01-b73
          speaker: johnson
          text: I'm in.
        - id: ch01-b74
          speaker: gerald
          text: When you're on duty, walk down by the wood yard. Watch for me. Wherever I blow my nose is the spot. The sacks are tied to posts under the water. Stroll past with proper dignity and remember the place. Glory waits for you there. When fame lifts you up and you're a sergeant, remember me.
        - id: ch01-b75
          speaker: narrator
          text: Johnson said he was blessed, more than once. Then he repeated that the bargain was made and declared he must leave at once.
        - id: ch01-b76
          speaker: narrator
          text: Johnson's cottage stood just beyond the town, past the blacksmith's forge. The children went back by the same path through the wood. Then they crossed the town and its narrow, unpleasant-smelling streets until they came to the towing path beside the timber yard. Huge trunks lay there, and stacks of sawn boards reached above their heads. The men had gone away to dinner, so the place belonged to the children for the moment. It was a favorite playground for every boy who lived within miles. They balanced along the trunks, looked down into the deep sawpit, and explored between the piles. At last they laid a newly cut pine plank across a great elm root and made themselves a seesaw. The fresh wood smelled sweet as Mabel rose and fell at one end.
        - id: ch01-b77
          speaker: mabel
          text: What a splendid place! I think I like it better than pretending games, or even magic.
        - id: ch01-b78
          speaker: jimmy
          text: So do I. Jerry, stop sniffing or you'll wear your nose away.
        - id: ch01-b79
          speaker: gerald
          text: I can't help it. I don't dare use my handkerchief in case Johnson is watching from somewhere. I wish I'd chosen another signal. And the strange thing is, I didn't want to sniff until I came here and remembered what I'd promised. Thank goodness, there he is!
        - id: ch01-b80
          speaker: narrator
          text: The children climbed off the seesaw with a magnificent show of unconcern. Gerald shouted for everyone to follow his leader and raced along the length of a barked oak trunk. The others formed a line behind him. In and out they ran, circling heaps of logs, ducking beneath the jutting ends of stacked planks, and scrambling wherever he led. Johnson's heavy boots came down the towing path. At that exact moment, Gerald reached the end of a little landing stage made from rotten boards, with a handrail that shook when touched. He called for peace, raised his handkerchief, and blew his nose with loud and determined force.
        - id: ch01-b81
          speaker: gerald
          text: Good morning.
        - id: ch01-b82
          speaker: johnson
          text: Morning. You've got a cold, haven't you?
        - id: ch01-b83
          speaker: gerald
          text: I wouldn't catch cold if I owned boots like yours. Just look at them! Anyone could recognize your fairy footsteps a mile away. How do you ever get close enough to arrest anyone?
        - id: ch01-b84
          speaker: narrator
          text: Gerald hopped off the landing stage. As he passed Johnson, he whispered a few words, then dashed away at the head of the running children.
        - id: ch01-b85
          speaker: gerald
          text: Courage, speed, and action. That's the place.
        - id: ch01-b86
          speaker: kathleen
          text: We've brought a friend home for dinner. Where is Mademoiselle?
        - id: ch01-b87
          speaker: eliza
          text: She's gone to see Yalding Towers. It's open to visitors today. And mind you hurry over dinner. This is my afternoon out, and my gentleman friend doesn't like to be kept waiting.
        - id: ch01-b88
          speaker: gerald
          text: We'll eat like lightning. Set one more place, there's an angel.
        - id: ch01-b89
          speaker: narrator
          text: They kept their promise and ate as though every forkful mattered. Dinner was minced veal with potatoes, followed by rice pudding. Taken together, those may be the dullest foods in the world, but the children allowed no dullness to slow them. The whole meal was over in fifteen minutes. Then Eliza collected a jug of hot water and went upstairs to prepare for her afternoon out. Soon both she and the jug had disappeared from sight.
        - id: ch01-b90
          speaker: mabel
          text: Where is the ring? I ought to put it back.
        - id: ch01-b91
          speaker: jimmy
          text: I haven't had a turn yet. When we find it, Cathy and I should each have one, just as you and Gerald did.
        - id: ch01-b92
          speaker: narrator
          text: Mabel's pale face went even paler between her dark curls.
        - id: ch01-b93
          speaker: mabel
          text: When you find it?
        - id: ch01-b94
          speaker: kathleen
          text: I'm terribly sorry. We all are.
        - id: ch01-b95
          speaker: narrator
          text: They had to tell her how the ring had been lost.
        - id: ch01-b96
          speaker: mabel
          text: You can't have searched properly. A ring can't simply vanish.
        - id: ch01-b97
          speaker: gerald
          text: We don't know what that ring can do, and neither do you. Don't raise your feathers at us, fair lady. Perhaps disappearing is one of its tricks. It slipped off my hand in bed, and we searched everywhere.
        - id: ch01-b98
          speaker: mabel
          text: May I search? If it's gone, the fault is mine. It feels almost like stealing. Johnson would say it was exactly the same.
        - id: ch01-b99
          speaker: kathleen
          text: We'll all look again. We were in a hurry this morning.
        - id: ch01-b100
          speaker: narrator
          text: They began with the bed, pulling it apart and feeling through every fold. They searched under the bed, under the carpet, and beneath every piece of furniture. They shook the curtains and explored all the corners. Those corners gave them dust and fluff, but no ring. Again and again they went over the same ground, looking everywhere they could imagine. Jimmy even stood still and stared hard at the ceiling, as though the ring might have bounced upward and stuck there. It had not. When they finally stopped, the room had yielded everything except the thing they wanted.
        - id: ch01-b101
          speaker: mabel
          text: Then your housemaid stole it. That's the only answer. I'll tell her what I think.
        - id: ch01-b102
          speaker: narrator
          text: She truly meant to do it, but the front door slammed just then. Eliza had gone out in all the glory of her best clothes to meet her gentleman friend.
        - id: ch01-b103
          speaker: mabel
          text: Please leave me alone. Perhaps having everyone here distracts me. I'll examine every inch of the room myself.
          emotion: sad
        - id: ch01-b104
          speaker: gerald
          text: Respecting their guest's feelings, the kindly charcoal burners withdrew.
        - id: ch01-b105
          speaker: narrator
          text: They closed the door softly and waited. Courtesy required them to stay while Mabel searched, and someone also had to let Mademoiselle in. But waiting was hard. Outside, the day shone brilliantly. Jimmy had just remembered that Gerald's pockets were full of the money earned at the fair. None of it had bought anything except a few buns in which Jimmy had received no share. The children listened for sounds above and grew more impatient with every moment. It seemed that a whole hour passed. In truth, it was only about ten minutes before the bedroom door opened and Mabel's feet came slowly down the stairs.
        - id: ch01-b106
          speaker: gerald
          text: She hasn't found it.
        - id: ch01-b107
          speaker: jimmy
          text: How can you tell?
        - id: ch01-b108
          speaker: gerald
          text: By the way she walks.
        - id: ch01-b109
          speaker: narrator
          text: You can nearly always hear whether a lost thing has been found by the footsteps coming back. Mabel's feet said no as plainly as feet could, and her face said the same.
        - id: ch01-b110
          speaker: narrator
          text: A violent knocking at the back door saved everyone from polite sorrow and hopeful promises. All the other servants were away, so the four children went together. Gerald thought that if it was the baker, they might buy the dessert their dreary dinner badly needed.
        - id: ch01-b111
          speaker: narrator
          text: It was not the baker. In the paved court, among the pump, dustbin, and water butt, stood a young man who looked stranger than any caller they expected. His hat tilted far to one side. Beneath his fair, bristly mustache, his mouth hung open, and his eyes were as nearly round as human eyes can be. His suit was a glaring mustard color. A blue tie sat at his throat, and a yellow-gold watch chain crossed his waistcoat. He leaned backward with his right arm stretched helplessly toward the doorway. His whole expression belonged to someone being pulled somewhere against his will. Kathleen muttered that an escaped madman had arrived and tried to shut the door in his face. The door would not close. Something they could not see was standing in its way.
        - id: ch01-b112
          speaker: gentleman_friend
          text: Let go of me!
          emotion: fearful
        - id: ch01-b113
          speaker: eliza
          text: Oh yes, I'll let go of you!
          emotion: angry
        - id: ch01-b114
          speaker: kathleen
          text: Who is holding you?
        - id: ch01-b115
          speaker: gentleman_friend
          text: She is, miss.
        - id: ch01-b116
          speaker: kathleen
          text: Who do you mean by she?
        - id: ch01-b117
          speaker: narrator
          text: Kathleen already guessed that Eliza's invisible foot was keeping the door open, but the question gave her time.
        - id: ch01-b118
          speaker: gentleman_friend
          text: My fiancée, miss. It sounds like her and feels like her bones, but something has happened to me. I can't see her.
        - id: ch01-b119
          speaker: eliza
          text: That's all he keeps saying! He's my gentleman friend. Has he gone mad, or have I?
        - id: ch01-b120
          speaker: jimmy
          text: Probably both.
        - id: ch01-b121
          speaker: eliza
          text: Call yourself a man? Look me in the face and say you can't see me.
        - id: ch01-b122
          speaker: gentleman_friend
          text: But I can't!
        - id: ch01-b123
          speaker: gerald
          text: If I had stolen a ring, I would go quietly indoors instead of making a spectacle of myself at the back door.
        - id: ch01-b124
          speaker: jimmy
          text: There isn't much spectacle to see. Good old ring!
        - id: ch01-b125
          speaker: gentleman_friend
          text: I haven't stolen anything! Let me alone. My eyes must have gone wrong. Let go, do you hear?
        - id: ch01-b126
          speaker: narrator
          text: His hand dropped without warning, and he staggered against the water butt. Eliza had released him. She pushed invisibly past the children, but Gerald caught her arm, found her ear, and whispered into it.
        - id: ch01-b127
          speaker: gerald
          text: Stand still and say nothing. If you don't, what is there to stop me sending for the police?
        - id: ch01-b128
          speaker: narrator
          text: Eliza could think of nothing. She stood unseen and silent, except for the blowing, snorting sound she always made when she was out of breath. The young man regained his balance and stared at the children with eyes rounder than ever.
        - id: ch01-b129
          speaker: gentleman_friend
          text: What happened? What is all this about?
        - id: ch01-b130
          speaker: gerald
          text: If you don't know, I'm afraid we can't explain it.
        - id: ch01-b131
          speaker: gentleman_friend
          text: Was I talking strangely?
        - id: ch01-b132
          speaker: mabel
          text: Very strangely.
        - id: ch01-b133
          speaker: gentleman_friend
          text: I hope I didn't say anything rude.
        - id: ch01-b134
          speaker: kathleen
          text: Not at all. You only said your fiancée was holding your hand, though you couldn't see her.
        - id: ch01-b135
          speaker: gentleman_friend
          text: I still can't see her.
        - id: ch01-b136
          speaker: mabel
          text: Neither can we.
        - id: ch01-b137
          speaker: gentleman_friend
          text: But I couldn't dream it and then come here making a public show of myself, could I?
        - id: ch01-b138
          speaker: gerald
          text: You know that better than we do. I can offer some advice. Go home, lie down, and put a wet cloth on your head. You'll be well tomorrow.
        - id: ch01-b139
          speaker: mabel
          text: I would. The sun is very hot.
        - id: ch01-b140
          speaker: gentleman_friend
          text: I feel all right now. Still, I'm sorry. I've never had an attack like this before, miss. Please don't think such things happen to me. But I could have sworn it was Eliza. Hasn't she gone out to meet me?
        - id: ch01-b141
          speaker: mabel
          text: Eliza is indoors. She can't meet anyone today.
        - id: ch01-b142
          speaker: gentleman_friend
          text: You won't tell her how I behaved, will you? She might turn against me if she thought I suffered from fits, and I never have, not since I was a child.
        - id: ch01-b143
          speaker: mabel
          text: We won't tell Eliza anything about you.
        - id: ch01-b144
          speaker: gentleman_friend
          text: And you'll forgive me for taking the liberty?
        - id: ch01-b145
          speaker: kathleen
          text: Of course. You couldn't help it. Go home and lie down. I'm sure you need to. Good afternoon.
        - id: ch01-b146
          speaker: gentleman_friend
          text: Good afternoon, miss. Even now, I can feel her finger bones printed on my hand. You won't let my employer hear of it, will you? A man can lose any kind of job over fits.
        - id: ch01-b147
          speakers: [gerald, jimmy, kathleen, mabel]
          ensemble: chorus
          text: No, no, it's all right. Good-bye!
        - id: ch01-b148
          speaker: narrator
          text: He wandered around the water butt, and the green yard gate closed behind him. For a moment no one spoke. Then Eliza broke the silence.
        - id: ch01-b149
          speaker: eliza
          text: Give me up, then! Hand me over to have my heart broken in a prison cell!
          emotion: sad
        - id: ch01-b150
          speaker: narrator
          text: A large wet drop splashed onto the doorstep.
        - id: ch01-b151
          speaker: jimmy
          text: A thunder shower.
        - id: ch01-b152
          speaker: narrator
          text: It was really one of Eliza's tears.
        - id: ch01-b153
          speaker: eliza
          text: Give me up if you must, but don't have me arrested here in the town where everyone knows and respects me. I'll walk ten miles before I'll be taken by a policeman who knows my name. Find me a stranger, not Johnson, when Johnson keeps company with my own cousin. But I do thank you for one thing. You never told Alf that I'd taken the ring. And I didn't truly steal it. I only borrowed it because this was my day out, and my gentleman friend is such a fine, grand fellow. You saw that for yourselves.
          emotion: sad
        - id: ch01-b154
          speaker: narrator
          text: The children watched in fascination as tears appeared and rolled away from Eliza's invisible nose. At last Gerald collected himself.
        - id: ch01-b155
          speaker: gerald
          text: Talking won't help. We can't see you!
        - id: ch01-b156
          speaker: eliza
          text: That's what he said, but—
        - id: ch01-b157
          speaker: gerald
          text: You can't see yourself either. Where is your hand?
        - id: ch01-b158
          speaker: narrator
          text: Eliza must have lifted her hand and tried to see it. Of course, there was nothing to see. At once she gave a shriek loud enough to bring the police, if any had been near, and went into violent hysterics. The children caught at the empty air and did everything books had taught them was proper on such occasions. None of those books had explained how to manage an invisible housemaid who was kicking and struggling in her best clothes. Arms and legs seemed to be everywhere, yet nobody could tell where they would move next. That was why Eliza's best hat was later found completely ruined. Her best blue dress survived, but it was never quite itself again.
        - id: ch01-b159
          speaker: narrator
          text: At last they tried burning little pieces of the feather duster, because the smell was supposed to revive a fainting person. They held the smoking feathers as near Eliza's invisible nose as they could guess. Suddenly a bright tongue of flame shot up, and a horrible smell filled the passage. Gerald's hands moved quickly and crushed the flame before it spread. The accident showed all too clearly that Eliza's best feather boa had been hanging exactly where they were working. Still, the treatment succeeded. Eliza came back to herself with one deep, miserable sob.
        - id: ch01-b160
          speaker: eliza
          text: Don't burn my stole! It's real ostrich feather. I'm better now.
        - id: ch01-b161
          speaker: narrator
          text: They helped her onto the bottom step and kindly explained that she truly was invisible. When anyone stole a ring, or even borrowed one, there was no knowing what might happen. They fetched the little mahogany mirror from above the kitchen sink, and Eliza could no longer doubt them.
        - id: ch01-b162
          speaker: eliza
          text: Must I stay like this forever? We meant to be married by Easter. No man will marry a girl he can't see.
          emotion: sad
        - id: ch01-b163
          speaker: mabel
          text: Not forever. You'll have to go through it like measles. I expect you'll be yourself tomorrow.
        - id: ch01-b164
          speaker: gerald
          text: Tonight, I think.
        - id: ch01-b165
          speaker: kathleen
          text: We'll help all we can, and we won't tell anyone.
        - id: ch01-b166
          speaker: jimmy
          text: Not even the police.
        - id: ch01-b167
          speaker: gerald
          text: Now let's prepare Mademoiselle's tea.
        - id: ch01-b168
          speaker: jimmy
          text: And ours.
        - id: ch01-b169
          speaker: gerald
          text: No, we'll take our tea outside. We'll have a picnic, and Eliza will come. I'll buy the cakes.
        - id: ch01-b170
          speaker: eliza
          text: I won't eat cake, Master Jerry, so don't imagine I will. You'd see it traveling down inside my chest. Showing cake through myself outdoors wouldn't be decent. Oh, what a dreadful punishment for merely borrowing something!
        - id: ch01-b171
          speaker: narrator
          text: The children reassured her and laid Mademoiselle's tea. Kathleen stayed to open the door when Mademoiselle returned, looking tired and rather sad. Once Gerald arrived with the cakes, they all set out for Yalding Towers.
        - id: ch01-b172
          speaker: mabel
          text: Picnics aren't allowed there.
        - id: ch01-b173
          speaker: gerald
          text: Ours will be. Eliza, hold Kathleen's arm. I'll walk behind and hide your shadow. Good gracious, take off your hat! Its shadow looks impossible. People will think the whole county madhouse has escaped.
        - id: ch01-b174
          speaker: narrator
          text: The hat became visible in Kathleen's hand. It showed how little of the water meant for Eliza's face had actually landed there.
        - id: ch01-b175
          speaker: eliza
          text: My best hat!
          emotion: sad
        - id: ch01-b176
          speaker: narrator
          text: A sniffing silence followed.
        - id: ch01-b177
          speaker: mabel
          text: Cheer up. Pretend this is a dream, the sort you might have when your conscience aches because of a ring.
        - id: ch01-b178
          speaker: eliza
          text: Will I wake again?
        - id: ch01-b179
          speaker: mabel
          text: Of course. First we'll bandage your eyes and lead you through a very small door. Don't fight us, or we'll put a policeman into the dream at once.
        - id: ch01-b180
          speaker: narrator
          text: There is no need to repeat every difficulty of getting Eliza into the cave. She went through the narrow opening headfirst. Kathleen and Mabel pushed from behind while Gerald and Jimmy received her from inside. Gerald had thought to tie her hands, and without that precaution someone would certainly have been scratched. Her feet were still free. One furious heel trapped Mabel's hand against the cold rock and scraped it painfully. Once they had dragged Eliza through, they led her down the little hollow bordered with ferns and under the arch into the garden with its Italian temples and statues. Eliza talked almost without stopping along the way. By the time they reached the weeping willow, she had very little language left to use.
        - id: ch01-b181
          speaker: narrator
          text: They removed her bandage beneath a weeping willow. Nearby, a statue of Diana balanced on one toe with her bow, which has always seemed a poor position for shooting.
        - id: ch01-b182
          speaker: gerald
          text: The hard part is over. From now on, there will only be pleasant things and cake.
        - id: ch01-b183
          speaker: jimmy
          text: Then it is time for tea.
        - id: ch01-b184
          speaker: narrator
          text: And so it was. At first Eliza feared that food would show inside her, traveling through an empty-looking chest. The children convinced her that invisible did not mean transparent. Nobody could look through her and count how many buns she had eaten. Once she believed that, she made an excellent meal. The others ate just as heartily. If you ever want to enjoy tea as much as they did, begin with minced veal, potatoes, and rice pudding for dinner. Follow that with several hours of alarm and excitement. Then carry cakes into a beautiful garden and wait until late before you eat them.
        - id: ch01-b185
          speaker: narrator
          text: As tea ended, the soft, cool greens and greys of the garden began to change. The green leaves took on a golden glow, while every shadow darkened toward black. Down by the Temple of Phoebus, the lake lay smooth enough to hold the swans reflected upside down. Small, fluffy clouds floated across from the sunset, and their rosy light spread over the water. Eliza looked across it all from beneath the willow.
        - id: ch01-b186
          speaker: eliza
          text: It is pretty. Just like one of those twopenny picture postcards.
        - id: ch01-b187
          speaker: mabel
          text: I ought to go home.
        - id: ch01-b188
          speaker: eliza
          text: I can't go home like this. I'd stay here, live like a savage, and sleep in that white hut if only it had walls and doors.
        - id: ch01-b189
          speaker: mabel
          text: She means the Temple of Dionysus.
        - id: ch01-b190
          speaker: narrator
          text: The sun dropped behind the black fir trees along the ridge. The white temple changed from pink to grey.
        - id: ch01-b191
          speaker: kathleen
          text: Even without walls, it would be a lovely place to live.
        - id: ch01-b192
          speaker: eliza
          text: It would be drafty, and look at all those steps to scrub! Why build a house with no walls? Who would live in— What's that?
        - id: ch01-b193
          speaker: kathleen
          text: What do you see?
        - id: ch01-b194
          speaker: eliza
          text: That white thing coming down the steps. Why, it's a young man made of statue!
        - id: ch01-b195
          speaker: gerald
          text: The statues come alive here after sunset.
        - id: ch01-b196
          speaker: eliza
          text: So they do. There's another. Look at the little wings on his feet, like pigeons.
        - id: ch01-b197
          speaker: gerald
          text: That must be Mercury.
        - id: ch01-b198
          speaker: mabel
          text: The name under the statue with winged feet is Hermes, but—
        - id: ch01-b199
          speaker: jimmy
          text: I can't see any statues. Why are you punching me?
        - id: ch01-b200
          speaker: narrator
          text: Gerald whispered to the children while Eliza's wandering gaze followed the quick movements of things they could not see.
        - id: ch01-b201
          speaker: gerald
          text: Don't you understand? The statues become alive at sunset, but you can see them only while you're invisible. And if you do see them, they don't frighten you unless you touch one.
        - id: ch01-b202
          speaker: jimmy
          text: Let's make her touch one and find out.
        - id: ch01-b203
          speaker: eliza
          text: He's leaped right into the water. My goodness, how he can swim! The young one with pigeon wings on his feet is flying back and forth above the lake, playing tricks on the swimmer. I do call that pretty. They look like the little cupids people put on wedding cakes. Now another one is coming, a small fellow with long ears. A baby deer is galloping along beside him. And look at that lady with the baby! She's throwing it into the air and catching it again as if it were a ball. I wonder she isn't frightened of dropping it. Still, they're lovely to watch.
        - id: ch01-b204
          speaker: narrator
          text: The broad park stretched away before them, growing greyer as the light faded. Its stillness deepened. Among the gathering shadows, the children saw only the pale statues in their usual places, white and perfectly motionless. Eliza's eyes followed living creatures where they saw nothing move. After a while even she stopped describing them. She watched in silence, and the children watched her. Evening settled over the garden like a veil that grew heavier and blacker with every moment. At last it was fully night. Above the dark line of trees, the moon rose and poured its light across the park.
        - id: ch01-b205
          speaker: eliza
          text: Oh, here comes the dear little boy with the deer! He's coming straight to me, bless him!
          emotion: happy
        - id: ch01-b206
          speaker: narrator
          text: The next moment Eliza screamed. Her cries moved farther away, and fast boots struck the gravel.
        - id: ch01-b207
          speaker: gerald
          text: Come on! She touched it, and now she's frightened, just as I was. Run! If she reaches town as nothing but a voice and a pair of boots, she'll drive everyone mad. Run!
        - id: ch01-b208
          speaker: narrator
          text: All three ran after her, but Eliza already had a good start. Whenever she crossed grass, they lost even the sound of her. They had to stop and listen until the faint beat of leather soles began again on some far-off gravel path. Then they raced toward it, only to lose it once more. Eliza was not merely running. She was driven by terror, and terror can drive a person very fast. She seemed to choose the shortest route home, though no one could see her do it. Through the strengthening moonlight she fled among glades and groves, while the invisible statues showed her sights that only she could know.
        - id: ch01-b209
          speaker: mabel
          text: I'll stop here. See you tomorrow. She's gone through the stable yard!
        - id: ch01-b210
          speaker: narrator
          text: The others chased the clatter across the terrace. Gerald and Jimmy reached their own street, turned the corner, and dashed into the yard past the water butt.
        - id: ch01-b211
          speaker: gerald
          text: She took the back way.
        - id: ch01-b212
          speaker: narrator
          text: An unseen, frantic presence fumbled at the locked back door. The church clock struck the half hour.
        - id: ch01-b213
          speaker: gerald
          text: Half past nine. Pull the ring. Perhaps it will come off now.
        - id: ch01-b214
          speaker: narrator
          text: Gerald seemed to be speaking to the bare doorstep, because Eliza still could not be seen. Then, all at once, a woman stood where the empty space had been. It was Eliza, untidy and breathless after her wild run. Her hair had begun to tumble down. Her collar sat crooked, and her best dress was twisted and disordered. She stretched one hand toward the children, and now they could see every finger. In the open palm, plain beneath the moonlight, lay the small dark circle of the magic ring. It had come off at half past nine, just as Gerald had hoped.
        - id: ch01-b215
          speaker: narrator
          text: The next morning, Eliza opened the door carrying a pail and hearthstone. Her gentleman friend was waiting outside.
        - id: ch01-b216
          speaker: gentleman_friend
          text: Half a moment! I'm sorry you couldn't come out yesterday.
        - id: ch01-b217
          speaker: eliza
          text: So am I. What did you do?
        - id: ch01-b218
          speaker: narrator
          text: She swept a wet cloth along the top step.
        - id: ch01-b219
          speaker: gentleman_friend
          text: I had a bit of a headache. I lay down most of the afternoon. What did you do?
        - id: ch01-b220
          speaker: eliza
          text: Nothing in particular.
        - id: ch01-b221
          speaker: narrator
          text: He accepted that answer and soon went away. Eliza watched him go, still rubbing the wet flannel over the stone step. Once he was out of sight, she thought over the invisible ring, the ruined clothes, the living statues, and the long terrified run through the moonlit garden. If Alf remembered none of it properly, then perhaps the whole adventure really had been a dream.
        - id: ch01-b222
          speaker: eliza
          text: Still, it has taught me not to meddle with anyone's old ring again in a hurry.
        - id: ch01-b223
          speaker: narrator
          text: Yet the young man was thinking about the day as well. He remembered the invisible fingers on his hand, his strange behavior at the back door, and the long afternoon he had spent lying down with a headache. He was relieved that the children had apparently kept their promise and said nothing to Eliza.
        - id: ch01-b224
          speaker: gentleman_friend
          text: So they never told her how I behaved. It must have been the sun, like what happens to our soldiers in India. I only hope I'm not going to suffer from it again.
