audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小时候，有些事怎么听都难以相信，偏偏最乏味的大人会告诉你，那全是真的。地球绕着太阳转，地球还是圆的，不是平的。可童话和魔法这些听来很可信的事，大人又说全是假的。其实，尤其当你亲眼看见它们发生时，相信魔法再容易不过。最奇妙的事会落在各种人头上，只是他们怕别人不信，从不肯讲。他们只说给我听，因为他们知道，不管是什么事，我都肯信。
        - id: ch01-b02
          speaker: narrator
          text: 吉米吻醒沉睡的公主后，公主请三个孩子到宫殿里找吃的。到了这会儿，他们谁都相信，这地方处处可能发生魔法。四个人慢慢排成一队，穿过草地，往城堡走。公主领头，凯瑟琳替她提着闪亮的裙裾，吉米跟在后面，杰拉尔德走在最后。他们觉得自己已经走进童话正中央。况且三个人又累又饿，这样想就更容易了。穿粉红绸衣的公主领他们走过修剪得整整齐齐的花园，可他们困倦得谁也没有好好看上一眼。
        - id: ch01-b03
          speaker: narrator
          text: 他们饿得发慌，也累得够呛，几乎没看脚下的路，更顾不上欣赏公主领他们穿过的整齐花园。一路恍恍惚惚，就像在做梦。等他们清醒一点，已经站在一座宽阔的大厅里。墙边是一副副铠甲，头顶挂着古老的旗帜，地上铺着兽皮。沉重的橡木长桌和长凳，一排排摆得很整齐。
        - id: ch01-b04
          speaker: narrator
          text: 公主迈着庄严的步子，慢慢走进大厅。一进门，她却猛地从凯瑟琳手里抽回亮闪闪的裙裾，转过身来。
        - id: ch01-b05
          speaker: princess
          text: 你们在这里等一会儿。我不在的时候，千万不要出声。这座城堡里到处是魔法，我可不知道你们一开口，会闹出什么事情。
        - id: ch01-b06
          speaker: narrator
          text: 她说完，把厚厚的金粉色裙子夹在两条胳膊下，飞快地跑了。照吉米后来的说法，她跑得一点也不像公主，连黑长袜和黑色搭扣鞋都露了出来。
        - id: ch01-b07
          speaker: narrator
          text: 吉米很想说，他才不信开口会惹出事。可他又怕一说话，真的出了什么事，只好做个鬼脸，吐吐舌头。另两个孩子假装没看见，这比回嘴更让他泄气。他们安安静静地坐着，杰拉尔德拿靴跟在大理石地面上碾来碾去。
        - id: ch01-b08
          speaker: narrator
          text: 过了一会儿，公主回来了。她走得很慢，每迈一步，都要用脚把长裙踢到前面。她手里端着托盘，再也腾不出手提裙子。那可不是你想象的银托盘，只是一只长方形白铁盘。她咣当一声，把它放在长桌尽头，终于松了口气。
        - id: ch01-b09
          speaker: princess
          text: 哎呀，可真沉！
        - id: ch01-b10
          speaker: narrator
          text: 我不知道孩子们刚才想象的是哪一种仙家盛宴，眼前这盘东西反正完全不像。盘里只有一条面包、一大块奶酪，还有一只装水的褐色陶罐。其余的重量，全来自盘子、杯子和餐刀。
        - id: ch01-b11
          speaker: princess
          text: 快来吃吧。我只找到了面包和奶酪，不过不要紧，这里什么都有魔法。除非你藏着一种可怕的秘密缺点，否则面包和奶酪会变成你最想吃的东西。凯瑟琳，你想吃什么？
        - id: ch01-b12
          speaker: kathleen
          text: 我要烤鸡。
        - id: ch01-b13
          speaker: narrator
          text: 公主切下一片面包，放进碟子里。
        - id: ch01-b14
          speaker: princess
          text: 烤鸡来了。要我替你切好，还是你自己切？
        - id: ch01-b15
          speaker: kathleen
          text: 请你替我切吧。
        - id: ch01-b16
          speaker: narrator
          text: 于是，凯瑟琳盘里有了一片干面包。
        - id: ch01-b17
          speaker: princess
          text: 还要青豌豆吗？
        - id: ch01-b18
          speaker: narrator
          text: 公主又切下一块奶酪，放在面包旁边。凯瑟琳开始吃了，还把面包当成鸡肉，用刀叉一块块切开。她绝不能承认自己没看见鸡肉和豌豆，只看见奶酪和干面包。那样就等于承认，自己藏着一种可怕的秘密缺点。
        - id: ch01-b19
          speaker: kathleen
          text: 就算我真有那种缺点，这个秘密连我自己也不知道。
        - id: ch01-b20
          speaker: narrator
          text: 她在心里这么想着。另外两个孩子点了烤牛肉和卷心菜。凯瑟琳猜，他们或许真的吃到了。可在她眼里，桌上的东西仍旧只是干面包和荷兰奶酪。
        - id: ch01-b21
          speaker: kathleen
          text: 我那种可怕的秘密缺点，到底是什么呢？
        - id: ch01-b22
          speaker: narrator
          text: 凯瑟琳正想着，公主说她自己想吃一片烤孔雀。她用叉子举起第二口干面包。
        - id: ch01-b23
          speaker: princess
          text: 这一片烤孔雀，味道真是好极了。
        - id: ch01-b24
          speaker: jimmy
          text: 这其实就是个游戏，对吧？
        - id: ch01-b25
          speaker: princess
          text: 什么是游戏？
        - id: ch01-b26
          speaker: narrator
          text: 公主皱起了眉头。
        - id: ch01-b27
          speaker: jimmy
          text: 我是说，你把面包和奶酪假装成牛肉。
        - id: ch01-b28
          speaker: princess
          text: 游戏？它本来就是牛肉呀。你自己瞧。
        - id: ch01-b29
          speaker: narrator
          text: 她把眼睛睁得滚圆。
        - id: ch01-b30
          speaker: jimmy
          text: 是啊，当然是。我不过开个玩笑。
        - id: ch01-b31
          speaker: narrator
          text: 吉米说得有气无力。面包和奶酪大概比不上烤牛肉、烤鸡或者烤孔雀。孔雀我可说不准，我从没吃过，你吃过吗？不过，他们从早饭以后一直饿到现在，醋栗和姜汁啤酒又算不得一顿饭，平常的晚饭时间也早过了。眼下有面包和奶酪，总比什么都没有强。大家吃饱喝足，精神好了不少。
        - id: ch01-b32
          speaker: princess
          text: 好了。要是你们确定不再吃肉，就跟我去看宝贝吧。真的连一小口鸡肉也不要了？不要？那就来吧。
        - id: ch01-b33
          speaker: narrator
          text: 公主拂掉绿色绸裙膝头的面包屑，站了起来。孩子们跟着她，穿过长长的大厅。
        - id: ch01-b34
          speaker: narrator
          text: 大厅尽头，两边各有一道宽阔的石阶。它们向上伸去，汇成一座通往楼上回廊的大楼梯。楼梯下面挂着一幅织锦帷幔。
        - id: ch01-b35
          speaker: princess
          text: 这幅壁毯后面有一道门，能通到我的私人房间。
        - id: ch01-b36
          speaker: narrator
          text: 壁毯很沉。公主用两只手把它抬起来，露出了后面的一扇小门。
        - id: ch01-b37
          speaker: princess
          text: 钥匙就挂在上面。
        - id: ch01-b38
          speaker: narrator
          text: 果然，一把钥匙挂在一枚生锈的大铁钉上。
        - id: ch01-b39
          speaker: princess
          text: 把钥匙插进去，再转一下。
        - id: ch01-b40
          speaker: narrator
          text: 杰拉尔德照做了。大钥匙在锁孔里吱嘎作响，磨蹭了好一阵。
        - id: ch01-b41
          speaker: princess
          text: 现在推门。你们三个一起使劲！
        - id: ch01-b42
          speaker: narrator
          text: 三个孩子一同用力。门突然松开了，他们你撞我，我压你，一起跌进门后的黑暗。公主放下帷幔，跟进来，又把门关上。
        - id: ch01-b43
          speaker: princess
          text: 当心，当心！下面有两级台阶。
        - id: ch01-b44
          speaker: gerald
          text: 谢谢，我们已经自己发现了。
        - id: ch01-b45
          speaker: narrator
          text: 杰拉尔德已经摔到台阶底下，正在揉膝盖。
        - id: ch01-b46
          speaker: princess
          text: 对不起。不过你们总不会伤得太重。一直往前走吧，后面没有台阶了。
        - id: ch01-b47
          speaker: narrator
          text: 他们摸着黑，一直向前。
        - id: ch01-b48
          speaker: princess
          text: 摸到门就转动把手，走进去。进去以后站着别动，等我找到火柴。我知道火柴放在哪里。
        - id: ch01-b49
          speaker: jimmy
          text: 一百年前已经有火柴了吗？
        - id: ch01-b50
          speaker: princess
          text: 我说的是火绒盒。我们一直把它叫成火柴。你们不这么叫吗？来，让我走在前面。
        - id: ch01-b51
          speaker: narrator
          text: 她从几个人中间挤过去。等大家走到门边，公主已经拿着一支蜡烛等在那里。她把蜡烛塞给杰拉尔德。
        - id: ch01-b52
          speaker: princess
          text: 拿稳了。
        - id: ch01-b53
          speaker: narrator
          text: 她打开长窗上的百叶窗。起初，一线黄色的光在他们眼前闪了闪。紧接着，它变成一大片燃烧般明亮的长方形，阳光一下洒满屋子。
        - id: ch01-b54
          speaker: jimmy
          text: 现在看起来，这支蜡烛可真傻。
        - id: ch01-b55
          speaker: princess
          text: 可不是吗？
        - id: ch01-b56
          speaker: narrator
          text: 公主吹灭了蜡烛，又从门外的锁孔里拔出钥匙，把它插进门内的锁孔，转了一圈。这间屋子不大，却很高。深蓝色穹顶上画着金星，四周镶着雕花木板，一件家具也没有。
        - id: ch01-b57
          speaker: princess
          text: 这里就是我的藏宝室。
        - id: ch01-b58
          speaker: kathleen
          text: 可是，宝贝都在哪里呢？
        - id: ch01-b59
          speaker: princess
          text: 你们看不见吗？
        - id: ch01-b60
          speaker: jimmy
          text: 看不见。面包奶酪那一套，你别想再对我来第二回！
        - id: ch01-b61
          speaker: princess
          text: 你们要是真的看不见，那我只好念咒语了。请把眼睛闭起来，还要用名誉发誓。我没叫你们看，你们绝不偷看。不管看见了什么，也永远不告诉别人。
        - id: ch01-b62
          speaker: narrator
          text: 三个孩子这时都不太愿意拿名誉作保证，不过最后还是发了誓，紧紧闭上眼睛。
        - id: ch01-b63
          speaker: princess
          text: 维嘎迪尔，尤嘎嘟，贝嘎迪，利嘎迪夫，瑙嘎道？
        - id: ch01-b64
          speaker: narrator
          text: 公主飞快地念完咒语。他们听见绸缎裙裾嗖嗖掠过屋子，随后传来一阵吱嘎声和窸窣声。
        - id: ch01-b65
          speaker: jimmy
          text: 她要把我们锁在这里！
          emotion: fearful
        - id: ch01-b66
          speaker: gerald
          text: 你可是发过誓的！
          emotion: fearful
        - id: ch01-b67
          speaker: kathleen
          text: 哎呀，你快一点吧！
          emotion: fearful
        - id: ch01-b68
          speaker: princess
          text: 好了，可以看了。
        - id: ch01-b69
          speaker: narrator
          text: 三个孩子睁开眼。屋子已经不是刚才那一间，可它又还是那一间。画着金星的蓝色穹顶还在，下面六英尺高的深色护墙板也还在。可再往下，四面墙上射出白、蓝、红、绿、金、银各色光芒，亮得叫人睁不开眼。光从整间屋子的每一边闪过来，仿佛刚才空荡荡的墙壁，一转眼全燃起了宝石的光。
        - id: ch01-b70
          speaker: narrator
          text: 一圈架子围着屋子，上面摆满金杯、银盘、镶着宝石的碟子和高脚杯。还有金银饰物、钻石冠冕、红宝石项链，一串串祖母绿和珍珠。所有珍宝都放在褪色的蓝丝绒上，华美得让人想象不出。就像一位好心的叔叔带你去伦敦塔看王室珠宝，只是这里的珠宝，比你或任何人在伦敦塔乃至世上任何地方一次见过的都多。
        - id: ch01-b71
          speaker: narrator
          text: 三个孩子屏住呼吸，张大嘴巴，望着满屋灿烂的珍宝。公主站在一旁，一只胳膊威严地伸向前方，嘴角带着骄傲的笑。
        - id: ch01-b72
          speaker: gerald
          text: 我的天哪！
          emotion: surprised
        - id: ch01-b73
          speaker: narrator
          text: 没有人敢大声说话。他们像真的中了魔法，只等公主开口。
        - id: ch01-b74
          speaker: princess
          text: 现在，你们还敢说这是面包奶酪的把戏吗？说吧，我到底会不会魔法？
        - id: ch01-b75
          speaker: kathleen
          text: 会！你会魔法，你真的会！
          emotion: surprised
        - id: ch01-b76
          speaker: gerald
          text: 我们能不能摸一摸这些东西？
        - id: ch01-b77
          speaker: princess
          text: 我的一切也都是你们的。
        - id: ch01-b78
          speaker: narrator
          text: 公主大方地挥了挥褐色的小手，随即赶紧补上一句。
        - id: ch01-b79
          speaker: princess
          text: 不过，你们当然不能把任何东西带走。
        - id: ch01-b80
          speaker: jimmy
          text: 我们又不是贼！
        - id: ch01-b81
          speaker: narrator
          text: 另外两个孩子已经在翻看蓝丝绒架上的奇珍异宝。
        - id: ch01-b82
          speaker: princess
          text: 也许你们不是贼，可你是个一点儿也不肯相信人的男孩。你以为我看不见你在想什么，其实我看得一清二楚。
        - id: ch01-b83
          speaker: jimmy
          text: 那我在想什么？
        - id: ch01-b84
          speaker: princess
          text: 你自己最清楚。你还在想我把面包和奶酪变成牛肉的事，也在琢磨你的秘密缺点。听我说，我们全都打扮起来吧，你们也来当王子和公主。
        - id: ch01-b85
          speaker: gerald
          text: 现在，该给我们的英雄戴上王冠了。这不过是转眼间的事。
        - id: ch01-b86
          speaker: narrator
          text: 杰拉尔德拿起一顶带十字架的金冠，扣在头上。他又戴上一副由S形环节串成的项圈，还在腰间围了一条闪耀的祖母绿腰带。腰带差一点儿才能合拢，他就用自己的皮带巧妙地固定好。等他转过身，其他人早已把冠冕、项链和戒指戴了满身。
        - id: ch01-b87
          speaker: princess
          text: 你们看起来真气派！只可惜衣服不能更漂亮些。现在的人穿得可真难看。一百年前……
        - id: ch01-b88
          speaker: narrator
          text: 凯瑟琳突然不动了，手里还举着一只钻石手镯。
        - id: ch01-b89
          speaker: kathleen
          text: 对了，国王和王后在哪里？
        - id: ch01-b90
          speaker: princess
          text: 什么国王和王后？
        - id: ch01-b91
          speaker: kathleen
          text: 你的父亲和母亲呀。你那两位悲痛欲绝的双亲，现在应该也醒了吧？过了一百年，他们难道不想见你吗？
        - id: ch01-b92
          speaker: princess
          text: 哦……啊……对了。我去拿面包和奶酪的时候，已经抱过欢喜万分的父母了。他们正在吃饭，暂时不会来找我。来，看看这只手镯多漂亮！
        - id: ch01-b93
          speaker: narrator
          text: 她赶紧把一只红宝石手镯套到凯瑟琳胳膊上。凯瑟琳巴不得一整天都试戴珠宝，再对着公主从架上取下的银框小镜子照个没完。两个男孩却很快厌倦了。
        - id: ch01-b94
          speaker: gerald
          text: 既然你肯定父母不会来找你，我们到外面痛痛快快玩点什么吧。那座迷宫很适合玩城堡围攻。除非你还能再变几个魔法把戏。
        - id: ch01-b95
          speaker: princess
          text: 你忘了吗？我已经长大，不再玩游戏了。而且一次变太多魔法很累，我可不喜欢。再说，把这些东西全放回去，要花好长时间呢。
        - id: ch01-b96
          speaker: narrator
          text: 果真花了很长时间。孩子们恨不得把珠宝随手一放，公主却让他们看清楚，每条项链、每枚戒指、每只手镯，在丝绒上都有自己的家。下面的架板微微凹下去，恰好能让每颗宝石躺进自己的小窝。
        - id: ch01-b97
          speaker: narrator
          text: 凯瑟琳把最后一件闪亮饰物嵌回原位时，发现旁边那段架子上没有璀璨的珠宝。那里只有一些戒指、胸针、链子，还有几件她连名字都叫不出的古怪东西。它们全用暗淡的金属做成，一个个形状稀奇，跟旁边那些冠冕和宝石比起来，简直像一堆没人要的旧物。
        - id: ch01-b98
          speaker: kathleen
          text: 这些破烂是什么？
        - id: ch01-b99
          speaker: princess
          text: 破烂？这些可全是魔法宝物！戴上这只手镯的人，只能说真话。这条链子能给你十个人的力气。戴上这枚马刺，马一分钟能跑一英里。要是你步行，它就会像七里靴一样管用。
        - id: ch01-b100
          speaker: kathleen
          text: 那这枚胸针有什么用？
        - id: ch01-b101
          speaker: narrator
          text: 凯瑟琳一面问，一面伸出手。公主一把抓住她的手腕。
        - id: ch01-b102
          speaker: princess
          text: 不许碰！除了我，谁碰一下，所有魔法都会马上消失，再也回不来。这枚胸针能替你实现任何一个愿望。
        - id: ch01-b103
          speaker: jimmy
          text: 那这枚戒指呢？
        - id: ch01-b104
          speaker: princess
          text: 它能让人隐身。
        - id: ch01-b105
          speaker: gerald
          text: 这个奇怪的带扣又是什么？
        - id: ch01-b106
          speaker: princess
          text: 它能解除其他一切魔法。
        - id: ch01-b107
          speaker: jimmy
          text: 你说的是真话吗？不是又在哄我们？
        - id: ch01-b108
          speaker: princess
          text: 哄你们？我已经显过这么多魔法，你竟然还敢这样对一位公主说话！
          emotion: angry
        - id: ch01-b109
          speaker: gerald
          text: 那你可以让我们看看，这些东西到底怎么起效呀。你不能送给我们每人一个愿望吗？
        - id: ch01-b110
          speaker: narrator
          text: 杰拉尔德显然兴奋起来。公主没有马上回答。三个孩子的心思早围着那些实现了的愿望飞来飞去。他们各自在心里挑选着最想实现的事。每个愿望都灿烂极了，又都十分合理。可童话里的人突然得到三个愿望时，偏偏总想不出这样的好愿望。
        - id: ch01-b111
          speaker: princess
          text: 不行，我不能把愿望送给你们。那件东西只会替我实现愿望。不过，我可以让你们看看，这枚戒指怎样让我隐身。只是我戴戒指时，你们必须闭上眼睛。
        - id: ch01-b112
          speaker: narrator
          text: 三个孩子都闭上眼。
        - id: ch01-b113
          speaker: princess
          text: 数到五十，你们就可以睁眼。接着再闭上眼数到五十，我会重新出现。
        - id: ch01-b114
          speaker: narrator
          text: 杰拉尔德高声数起来。数数声里，他们听见吱吱嘎嘎、窸窸窣窣的声音。
        - id: ch01-b115
          speaker: gerald
          text: 四十七、四十八、四十九、五十！
        - id: ch01-b116
          speaker: narrator
          text: 大家睁开眼。房间里只剩下他们三个。珠宝消失了，公主也不见了。
        - id: ch01-b117
          speaker: jimmy
          text: 她当然是从门口出去了。
        - id: ch01-b118
          speaker: narrator
          text: 可是门依旧锁着。
        - id: ch01-b119
          speaker: kathleen
          text: 这回真的就是魔法。
          emotion: surprised
        - id: ch01-b120
          speaker: jimmy
          text: 马斯基林和德万也会变这种戏法。还有，我想喝下午茶了。
        - id: ch01-b121
          speaker: gerald
          text: 你的下午茶！我们可爱的公主，等英雄再数完五十，立刻重新现身。一、二、三、四……
        - id: ch01-b122
          speaker: narrator
          text: 杰拉尔德和凯瑟琳闭上了眼。吉米不知怎么忘了闭眼。他并不是有意作弊，只是忘记了。杰拉尔德数到二十时，他看见窗下的一块护墙板慢慢打开。
        - id: ch01-b123
          speaker: jimmy
          text: 原来是她。我早知道这是一场把戏！
        - id: ch01-b124
          speaker: narrator
          text: 吉米只在心里说了这句话，随即闭上眼。他仍旧是个守信用的小男孩。
        - id: ch01-b125
          speaker: gerald
          text: 五十！
        - id: ch01-b126
          speaker: narrator
          text: 六只眼睛同时睁开。护墙板已经关好，公主却没有出现。
        - id: ch01-b127
          speaker: gerald
          text: 这次她没变成功。
        - id: ch01-b128
          speaker: kathleen
          text: 也许你应该再数一次。
        - id: ch01-b129
          speaker: jimmy
          text: 我觉得窗户下面有个柜子。她就藏在里面。你们知道，那是一道暗门。
        - id: ch01-b130
          speaker: princess
          text: 你偷看了！你作弊！
          emotion: angry
        - id: ch01-b131
          speaker: narrator
          text: 公主的声音紧贴着吉米耳朵响起来，吓得他猛地一跳。
        - id: ch01-b132
          speaker: jimmy
          text: 我没有作弊！
        - id: ch01-b133
          speakers: [gerald, jimmy, kathleen]
          ensemble: chorus
          text: 你到底在哪里？这是怎么回事？
          emotion: surprised
        - id: ch01-b134
          speaker: narrator
          text: 三个人一齐叫起来，公主却还是看不见。
        - id: ch01-b135
          speaker: kathleen
          text: 亲爱的公主，现身吧。要不要我们再闭上眼，重新数一遍？
        - id: ch01-b136
          speaker: princess
          text: 别犯傻了！
          emotion: angry
        - id: ch01-b137
          speaker: jimmy
          text: 我们才不傻。你为什么不能赶快回来，把这件事了结？你明明只是藏起来了。
          emotion: angry
        - id: ch01-b138
          speaker: kathleen
          text: 吉米，别这么说。你知道，她已经隐身了。
        - id: ch01-b139
          speaker: jimmy
          text: 我要是钻进柜子里，也能隐身。
        - id: ch01-b140
          speaker: princess
          text: 哦，是啊。你们一定觉得自己聪明极了。不过我不在乎。只要你们高兴，我们就假装你们看不见我好了。
        - id: ch01-b141
          speaker: gerald
          text: 可我们真的看不见你。生气也没有用。如果你像吉米说的那样藏起来了，最好赶快出来。要是真的隐了身，也最好赶快把自己变回来。
        - id: ch01-b142
          speaker: princess
          text: 你们说真的？你们当真看不见我？
        - id: ch01-b143
          speaker: narrator
          text: 那声音完全变了调，可仍旧是公主的声音。
        - id: ch01-b144
          speaker: jimmy
          text: 难道你自己还看不出来，我们看不见你吗？
        - id: ch01-b145
          speaker: narrator
          text: 阳光火辣辣地照进窗口。八角形的小屋里热得厉害，每个人的脾气都渐渐坏起来。
        - id: ch01-b146
          speaker: princess
          text: 你们真的看不见我？
          emotion: sad
        - id: ch01-b147
          speaker: narrator
          text: 隐身公主的声音里，已经带着抽泣。
        - id: ch01-b148
          speaker: jimmy
          text: 我说过看不见了。而且我想喝下午茶，还想……
        - id: ch01-b149
          speaker: narrator
          text: 他的话突然断了，就像一根封蜡啪地折成两截。紧接着，在金色的午后，发生了一件实在很可怕的事。吉米猛地向后一仰，又向前一栽，眼睛和嘴巴都张得大大的。他这样前后摇晃了好几下，才终于站稳。
        - id: ch01-b150
          speaker: kathleen
          text: 哎呀，他抽风了！吉米，亲爱的吉米！你怎么了？你到底怎么了？
          emotion: fearful
        - id: ch01-b151
          speaker: narrator
          text: 凯瑟琳叫着跑了过去。
        - id: ch01-b152
          speaker: jimmy
          text: 我没有抽风。是她抓住我摇！
          emotion: angry
        - id: ch01-b153
          speaker: princess
          text: 没错。要是他再说看不见我，我就再摇他一次。
          emotion: angry
        - id: ch01-b154
          speaker: gerald
          text: 你最好来摇我。我的个头跟你更相近。
          emotion: angry
        - id: ch01-b155
          speaker: narrator
          text: 公主马上来摇他，可没摇多久。杰拉尔德刚觉得两只手搭上肩膀，就抬起双手，一把抓住那两只看不见的手腕。他明明能摸到手腕，眼前却只有阳光和空处。握着两只隐形手腕的感觉，可怕极了。一只看不见的脚踢得他缩了一下，他却依然紧抓不放。
        - id: ch01-b156
          speaker: gerald
          text: 凯茜，快来抱住她的腿！她正在踢我！
        - id: ch01-b157
          speaker: kathleen
          text: 她的腿在哪里？我根本看不见呀！
        - id: ch01-b158
          speaker: gerald
          text: 我抓住了她的手。她真的隐身了。你先抓住这只手，再顺着胳膊往下摸，就能找到她的腿。
        - id: ch01-b159
          speaker: narrator
          text: 凯瑟琳照他说的做了。我真希望能让你明白，在光天化日之下摸到一只看不见的手，再摸到看不见的胳膊，究竟有多么不自在，又有多吓人。
        - id: ch01-b160
          speaker: princess
          text: 不许你抱我的腿！
          emotion: angry
        - id: ch01-b161
          speaker: narrator
          text: 隐身的公主拼命挣扎。
        - id: ch01-b162
          speaker: gerald
          text: 你到底在气什么？你自己说要隐身，现在不是已经隐身了吗？
        - id: ch01-b163
          speaker: princess
          text: 我没有隐身。
        - id: ch01-b164
          speaker: gerald
          text: 你真的隐身了。去照照镜子。
        - id: ch01-b165
          speaker: princess
          text: 没有，我不可能隐身。
        - id: ch01-b166
          speaker: gerald
          text: 去照镜子。
        - id: ch01-b167
          speaker: narrator
          text: 杰拉尔德一点儿也没有动摇。
        - id: ch01-b168
          speaker: princess
          text: 那你先放开我。
        - id: ch01-b169
          speaker: narrator
          text: 杰拉尔德松开了手。一放开，他简直无法相信，自己刚才真的握住过两只隐形的手。
        - id: ch01-b170
          speaker: princess
          text: 你们只是在假装看不见我，对不对？快说是呀。你们已经取笑够了，不要再装下去。我不喜欢这样。
          emotion: fearful
        - id: ch01-b171
          speaker: gerald
          text: 我们用神圣的名誉发誓，你现在还是隐形的。
        - id: ch01-b172
          speaker: narrator
          text: 屋里沉默了一阵。
        - id: ch01-b173
          speaker: princess
          text: 来吧，我放你们出去。你们可以走了，我已经玩腻了。
          emotion: sad
        - id: ch01-b174
          speaker: narrator
          text: 三个孩子跟着她的声音走到门口，穿过门，又沿着小过道回到大厅。谁也不开口，每个人都浑身不自在。
        - id: ch01-b175
          speaker: jimmy
          text: 我们赶快离开这里吧。
        - id: ch01-b176
          speaker: narrator
          text: 到大厅尽头时，吉米压低声音说。
        - id: ch01-b177
          speaker: princess
          text: 从这边走更近。我觉得你们实在很讨厌，真后悔和你们一起玩。妈妈总叫我不要跟陌生孩子玩。
          emotion: angry
        - id: ch01-b178
          speaker: narrator
          text: 一扇门突然打开了，却看不见有手碰它。
        - id: ch01-b179
          speaker: princess
          text: 还不快进来！
          emotion: angry
        - id: ch01-b180
          speaker: narrator
          text: 门后是一间小小的前厅。细长的窗户之间，嵌着一面又一面细长的镜子。
        - id: ch01-b181
          speaker: gerald
          text: 再见。谢谢你让我们玩得这么开心。我们还是好聚好散吧。
        - id: ch01-b182
          speaker: narrator
          text: 杰拉尔德说着伸出手。一只看不见的手慢慢放进他的掌心，他立刻像老虎钳一样，把它紧紧夹住。
        - id: ch01-b183
          speaker: gerald
          text: 现在，你非得照照镜子，承认我们没有说谎。
        - id: ch01-b184
          speaker: narrator
          text: 他把隐身的公主领到一面镜子前，按住她的双肩，让她正对着镜面。
        - id: ch01-b185
          speaker: gerald
          text: 现在，你自己好好看吧。
        - id: ch01-b186
          speaker: narrator
          text: 屋里一片寂静。随后，一声绝望的哭喊响彻房间。
        - id: ch01-b187
          speaker: princess
          text: 啊！我真的隐身了！我该怎么办呀？
          emotion: fearful
        - id: ch01-b188
          speaker: kathleen
          text: 把戒指摘下来。
        - id: ch01-b189
          speaker: narrator
          text: 凯瑟琳一下变得十分务实。又是一阵沉默。
        - id: ch01-b190
          speaker: princess
          text: 摘不下来！戒指不肯下来。可是，不可能真是戒指呀。戒指怎么会让人隐身呢？
          emotion: fearful
        - id: ch01-b191
          speaker: kathleen
          text: 是你说这枚戒指能让人隐身。现在它真的做到了。
        - id: ch01-b192
          speaker: princess
          text: 可这不可能！我只是在假装变魔法。我不过藏进了秘密柜子，那只是一场游戏。哎呀，我该怎么办？
          emotion: fearful
        - id: ch01-b193
          speaker: gerald
          text: 游戏？可你明明会魔法。那些看不见的珠宝，不就是你叫它们现出来的吗？
        - id: ch01-b194
          speaker: princess
          text: 那里只有一枚秘密弹簧。按一下，护墙板就会滑上来。哎呀，我现在该怎么办？
          emotion: fearful
        - id: ch01-b195
          speaker: narrator
          text: 凯瑟琳朝声音传来的地方走过去，伸手摸索了一阵，终于抱住一截看不见的粉红绸衣腰身。两条看不见的胳膊也抱住了她。一张看不见的滚烫脸颊贴着她的脸。温热的隐形泪水不停流下来，把两张脸贴在一起的地方都弄湿了。
        - id: ch01-b196
          speaker: kathleen
          text: 别哭，亲爱的。让我去告诉国王和王后。
          emotion: calm
        - id: ch01-b197
          speaker: princess
          text: 告诉谁？
        - id: ch01-b198
          speaker: kathleen
          text: 当然是你尊贵的父亲和母亲呀。
        - id: ch01-b199
          speaker: princess
          text: 不要再取笑我了！你明明知道，那也是一场游戏，就像……
          emotion: sad
        - id: ch01-b200
          speaker: jimmy
          text: 就像面包和奶酪。我早知道那是假的！
        - id: ch01-b201
          speaker: kathleen
          text: 可你的衣服呢？你睡在迷宫里那件事呢？还有别的那些事……
        - id: ch01-b202
          speaker: princess
          text: 我穿成这样，只是为了好玩，因为大家都到集市去了。我把线团放下，也是为了让一切更像真的。起先我在扮演美人罗莎蒙德。后来听见你们在迷宫里说话，我觉得这下可有趣了。
        - id: ch01-b203
          speaker: princess
          text: 可现在我真的隐身了，再也变不回来了。我知道，我永远也变不回来！谁让我撒谎呢，这是我活该。可我真没想到你们会相信，至少没想到你们会全都相信。
          emotion: sad
        - id: ch01-b204
          speaker: narrator
          text: 她赶紧加上最后一句，竭力想说实话。
        - id: ch01-b205
          speaker: kathleen
          text: 那么，如果你不是公主，你究竟是谁？
        - id: ch01-b206
          speaker: narrator
          text: 凯瑟琳仍旧抱着那个看不见的人。
        - id: ch01-b207
          speaker: princess
          text: 我是……我姨妈住在这里。她随时都可能回来。哎呀，我到底该怎么办？
          emotion: fearful
        - id: ch01-b208
          speaker: kathleen
          text: 也许她知道什么咒语……
        - id: ch01-b209
          speaker: princess
          text: 胡说！她根本不相信咒语。她一定会气坏的。哎呀，我可不敢让她看见我这个样子！而且你们全都在这里，她肯定会大发脾气。
          emotion: fearful
        - id: ch01-b210
          speaker: narrator
          text: 刚才还让孩子们深信不疑的美丽魔法城堡，这时像在他们耳边轰然倒塌。睡了一百年的公主、仙家盛宴、突然出现的珍宝，原来全是编出来的游戏。如今只剩下一件魔法。公主真的隐身了。不过，你也得承认，这一件事已经相当不得了。
        - id: ch01-b211
          speaker: princess
          text: 我只是随口说说，它却真的成了。我真希望自己从来没玩过魔法，也从来没玩过任何游戏。
          emotion: sad
        - id: ch01-b212
          speaker: gerald
          text: 别这样说。我们去花园吧，到湖边找个凉快的地方，郑重其事地开一次会。你会喜欢的，对不对？
          emotion: calm
        - id: ch01-b213
          speaker: kathleen
          text: 啊，那枚带扣！它能解除魔法！
          emotion: surprised
        - id: ch01-b214
          speaker: princess
          text: 其实不能。那也是我随口编出来的。
          emotion: sad
        - id: ch01-b215
          speaker: gerald
          text: 戒指的作用也是你随口编的，可它偏偏成真了。不管怎么说，我们都该试一试。
        - id: ch01-b216
          speaker: princess
          text: 不是我们，是我。你们到湖边的花神殿去，我一个人回藏宝室。姨妈也许会看见你们。
        - id: ch01-b217
          speaker: jimmy
          text: 可她不会看见你。
        - id: ch01-b218
          speaker: gerald
          text: 别总往她的痛处戳。花神殿怎么走？
        - id: ch01-b219
          speaker: princess
          text: 从那边下台阶，再沿着灌木丛里的弯曲小路一直走。你们不会错过。那是一座白色大理石建筑，里面有一尊女神像。
        - id: ch01-b220
          speaker: narrator
          text: 三个孩子照她说的下去，来到湖边的白色大理石花神殿，在阴凉的殿里坐好。小殿紧贴着矮山的山坡。女神像背靠着山坡，除了她身后的那一面，四周全是敞开的拱门。湖边的热气进不来，殿里又凉爽，又安静。
        - id: ch01-b221
          speaker: narrator
          text: 他们等了还不到五分钟，碎石路上就响起一阵响亮的奔跑声。脚步越来越近，可小路上仍看不见一个人。只有一道又黑又清楚的影子跑进来，落在白色大理石地面上。
        - id: ch01-b222
          speaker: jimmy
          text: 不管怎么说，你的影子倒没有隐身。
        - id: ch01-b223
          speaker: princess
          text: 让我的影子见鬼去吧！我们把钥匙留在门里面了。风把门吹上了，那还是一把弹簧锁！
          emotion: angry
        - id: ch01-b224
          speaker: narrator
          text: 大家发自内心地沉默了一会儿。
        - id: ch01-b225
          speaker: gerald
          text: 坐下吧，公主。我们现在来好好商量，把这件事弄明白。
        - id: ch01-b226
          speaker: narrator
          text: 杰拉尔德摆出最一本正经的办事口吻。
        - id: ch01-b227
          speaker: jimmy
          text: 也许我们一睁眼，会发现这一切都是一场梦。
        - id: ch01-b228
          speaker: princess
          text: 哪有这么好的运气。
          emotion: sad
        - id: ch01-b229
          speaker: gerald
          text: 好吧，第一件事，你叫什么名字？既然你不是公主，你到底是谁？
        - id: ch01-b230
          speaker: princess
          text: 我……我是城堡管家的外甥女。我叫梅布尔·普劳斯。
          emotion: sad
        - id: ch01-b231
          speaker: narrator
          text: 她的声音被抽泣截得断断续续。
        - id: ch01-b232
          speaker: jimmy
          text: 果然跟我想的一模一样。
        - id: ch01-b233
          speaker: narrator
          text: 这句话一点儿也不真。吉米怎么可能想得到呢？另外两个孩子没有出声。这一刻，每个人心里都翻腾着纷乱不安的念头。
        - id: ch01-b234
          speaker: gerald
          text: 不管怎么说，你总归是这里的人。
        - id: ch01-b235
          speaker: princess
          text: 是啊。我的确是这里的人。可是，一个人要是连别人都看不见，属于什么地方又有什么用呢？
          emotion: sad
        - id: ch01-b236
          speaker: narrator
          text: 那声音从地面传上来，仿佛说话的人已经绝望地倒在了地上。
