audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    gerald:
      display_name: Gerald
      tts:
        delivery: confident, theatrical, and quick-witted
        timbre: bright and smooth
        pace: lively
        pitch: medium
    jimmy:
      display_name: Jimmy
      tts:
        delivery: blunt, skeptical, and energetic
        timbre: youthful and crisp
        pace: brisk
        pitch: medium-high
    kathleen:
      display_name: Kathleen
      tts:
        delivery: imaginative, earnest, and spirited
        timbre: youthful and clear
        pace: natural
        pitch: medium-high
    princess:
      display_name: The Princess
      tts:
        delivery: poised, playful, and perfectly self-assured
        timbre: youthful and resonant
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When you are young, the things grown-ups call true can be very hard to believe. They tell you the earth is round and travels around the sun. Then they say fairy tales and magic are not true at all, though those seem much more likely, especially when you see them happen. Wonderful things do happen to all kinds of people. Most never tell, because they think no one will believe them. They tell me, though. They know I can believe anything.
        - id: ch01-b02
          speaker: narrator
          text: Jimmy had awakened the Sleeping Princess, and she had invited all three children to her palace for something to eat. So they knew they had entered a place where magic happened. They crossed the grass in a slow procession. The Princess led, Kathleen carried her shining train, Jimmy followed, and Gerald came last. Tired and hungry as they were, they felt sure they had walked straight into the middle of a fairy tale. Their hunger made the wonder easier to believe.
        - id: ch01-b03
          speaker: narrator
          text: They barely noticed where the Princess led them, or the beauty of the formal gardens they passed. Hunger and weariness made everything hazy. They moved as if in a dream and only half woke when they found themselves in a great hall. Suits of armour and old flags lined the walls. Animal skins covered the floor, and heavy oak tables and benches stood in long rows.
        - id: ch01-b04
          speaker: narrator
          text: The Princess entered slowly and grandly. Once inside, she pulled her glossy train from Jimmy's hand and turned to them.
        - id: ch01-b05
          speaker: princess
          text: Wait here for one minute, and don't speak while I'm gone. This castle is packed with magic. I can't tell what might happen if you talk.
        - id: ch01-b06
          speaker: narrator
          text: She gathered the thick golden-pink folds under both arms and ran out. Her grand manner vanished the instant she started running. Jimmy later said she ran in a very unprincesslike way, with her black stockings and black strap shoes showing beneath the silk.
        - id: ch01-b07
          speaker: narrator
          text: Jimmy badly wanted to say that he did not believe anything would happen. But he was afraid something might happen if he spoke, so he held his tongue. Instead, he made a face and stuck it out at the others. They pretended not to notice. That was far more crushing than anything they could have said. So the three sat in complete silence while Gerald slowly ground the heel of his boot against the marble floor.
        - id: ch01-b08
          speaker: narrator
          text: The Princess returned very slowly, kicking her long skirts forward at every step. She could not lift them now, because she was carrying a tray. It was not silver, as you might expect. It was a long tin tray. She dropped it noisily on the end of the table and sighed with relief.
        - id: ch01-b09
          speaker: princess
          text: Oh, that was heavy!
        - id: ch01-b10
          speaker: narrator
          text: The children had probably been imagining some wonderful fairy feast while they waited. What arrived was nothing like it. The heavy tray held one loaf of bread, a lump of cheese, and a brown jug of water. Ordinary plates, mugs, and knives made up the rest of the weight.
        - id: ch01-b11
          speaker: princess
          text: Come and eat. I could only find bread and cheese, but that doesn't matter. Everything here is magic. Unless you have some dreadful secret fault, the bread and cheese will become whatever you want. Kathleen, what would you like?
        - id: ch01-b12
          speaker: kathleen
          text: I would like roast chicken.
        - id: ch01-b13
          speaker: narrator
          text: The Princess cut bread, put one slice on a plate, and offered it to her.
        - id: ch01-b14
          speaker: princess
          text: Here is your roast chicken. Shall I carve it, or would you rather do it?
        - id: ch01-b15
          speaker: kathleen
          text: You carve it, please.
        - id: ch01-b16
          speaker: narrator
          text: Kathleen received a piece of dry bread on a plate.
        - id: ch01-b17
          speaker: princess
          text: Would you like green peas with it?
        - id: ch01-b18
          speaker: narrator
          text: The Princess cut off some cheese and laid it beside the bread. Kathleen cut up the bread with her knife and fork and ate it exactly as one would eat chicken. She could not admit that she saw no chicken or peas, only dry bread and cheese. Saying so would mean she had some dreadful secret fault, and she was not prepared to own to that.
        - id: ch01-b19
          speaker: kathleen
          text: If I do have a secret fault, it must be a secret even from me.
        - id: ch01-b20
          speaker: narrator
          text: The boys asked for roast beef and cabbage. Kathleen supposed that was what they received, though to her their plates held more dry bread and Dutch cheese. She kept wondering what her own dreadful secret fault could possibly be. Meanwhile, the Princess announced that she fancied roast peacock and lifted another forkful of bread.
        - id: ch01-b21
          speaker: princess
          text: This peacock is delicious.
        - id: ch01-b22
          speaker: jimmy
          text: This is a game, isn't it?
        - id: ch01-b23
          speaker: princess
          text: What is a game?
        - id: ch01-b24
          speaker: jimmy
          text: Pretending the bread and cheese are beef.
        - id: ch01-b25
          speaker: princess
          text: Pretending? It is beef. Just look at it.
        - id: ch01-b26
          speaker: jimmy
          text: Yes, of course it is. I was only joking.
        - id: ch01-b27
          speaker: narrator
          text: Bread and cheese may not be as fine as roast beef or chicken. I cannot speak for peacock, since I have never tasted it. Have you? Still, bread and cheese is much better than nothing. The children had eaten nothing since breakfast, apart from gooseberries and ginger beer, which hardly count, and their proper dinner time was long past. They ate and drank until their hunger faded and they all felt much better.
        - id: ch01-b28
          speaker: narrator
          text: The Princess brushed the crumbs from her green silk lap.
        - id: ch01-b29
          speaker: princess
          text: If you are quite sure you don't want any more meat, you may come and see my treasures. Not even one more piece of chicken? No? Then follow me.
        - id: ch01-b30
          speaker: narrator
          text: She rose, and the three children followed her all the way to the far end of the long hall. Great stone staircases climbed on either side, then joined in one broad flight that led to the gallery above. Beneath the stairs hung a heavy tapestry.
        - id: ch01-b31
          speaker: princess
          text: Behind this tapestry is the door to my private rooms.
        - id: ch01-b32
          speaker: narrator
          text: She lifted the tapestry with both hands and uncovered a little hidden door.
        - id: ch01-b33
          speaker: princess
          text: The key is hanging above it.
        - id: ch01-b34
          speaker: narrator
          text: There it was, on a large rusty nail.
        - id: ch01-b35
          speaker: princess
          text: Put the key in and turn it.
        - id: ch01-b36
          speaker: narrator
          text: Gerald obeyed. The great key creaked and scraped in the lock.
        - id: ch01-b37
          speaker: princess
          text: Now push. All of you, push hard!
        - id: ch01-b38
          speaker: narrator
          text: All three leaned against the door and pushed hard together. It suddenly gave way. They lost their balance and tumbled over one another into the dark space beyond. The Princess let the heavy tapestry fall back into place, came in after them, and closed the hidden door behind her.
        - id: ch01-b39
          speaker: princess
          text: Take care! There are two steps down!
        - id: ch01-b40
          speaker: gerald
          text: Thank you. We discovered them ourselves.
        - id: ch01-b41
          speaker: narrator
          text: Gerald rubbed his knee at the foot of the steps.
        - id: ch01-b42
          speaker: princess
          text: I'm sorry, but you can't be badly hurt. Keep straight ahead. There are no more steps.
        - id: ch01-b43
          speaker: narrator
          text: They moved on through the dark.
        - id: ch01-b44
          speaker: princess
          text: When you reach the door, turn the handle and go through. Then stand still while I find the matches. I know where they are.
        - id: ch01-b45
          speaker: jimmy
          text: Did people have matches a hundred years ago?
        - id: ch01-b46
          speaker: princess
          text: I meant the tinderbox. We always called it the matches. Don't you? Here, let me go first.
        - id: ch01-b47
          speaker: narrator
          text: She slipped ahead. By the time they reached the next door, she was waiting with a candle and pushed it into Gerald's hand.
        - id: ch01-b48
          speaker: princess
          text: Keep that steady.
        - id: ch01-b49
          speaker: narrator
          text: She went to a long window and began undoing its shutters. At first, only a thin yellow streak crossed the darkness. Then the shutters swung wide, and a huge blazing rectangle of daylight flashed before them. In an instant, sunshine filled the room.
        - id: ch01-b50
          speaker: jimmy
          text: The sunshine makes that candle look rather silly.
        - id: ch01-b51
          speaker: princess
          text: So it does.
        - id: ch01-b52
          speaker: narrator
          text: She blew the candle out. Then she took the key from the outside of the door, fitted it into the keyhole on the inside, and turned it. The room was small but very high. Gold stars were painted across its deep-blue domed ceiling. The wooden walls were richly panelled and carved. There was not a single piece of furniture anywhere.
        - id: ch01-b53
          speaker: princess
          text: This is my treasure chamber.
        - id: ch01-b54
          speaker: kathleen
          text: But where are the treasures?
        - id: ch01-b55
          speaker: princess
          text: Can't you see them?
        - id: ch01-b56
          speaker: jimmy
          text: No, we can't. You won't fool me with the bread-and-cheese game twice.
        - id: ch01-b57
          speaker: princess
          text: If you truly cannot see them, I shall have to speak the charm. Close your eyes. Give me your word of honour that you won't look until I tell you, and that you will never tell anyone what you see.
        - id: ch01-b58
          speaker: narrator
          text: The children did not much want to give their words of honour just then. Still, they gave them and squeezed their eyes shut.
        - id: ch01-b59
          speaker: princess
          text: Wiggadil yougadoo begadee leegadeeve nowgadow?
        - id: ch01-b60
          speaker: narrator
          text: Her silk train swished across the room. Then came a creaking, rustling sound.
        - id: ch01-b61
          speaker: jimmy
          text: She's locking us in!
          emotion: fearful
        - id: ch01-b62
          speaker: gerald
          text: Remember your word of honour!
        - id: ch01-b63
          speaker: kathleen
          text: Oh, please hurry!
          emotion: fearful
        - id: ch01-b64
          speaker: princess
          text: You may look now.
        - id: ch01-b65
          speaker: narrator
          text: They opened their eyes. It was the same room, and yet it was not. The blue ceiling with its golden stars remained, with a few feet of dark panelling below. But beneath that, every wall blazed and glittered with white, blue, red, green, gold, and silver.
        - id: ch01-b66
          speaker: narrator
          text: Shelves circled the room from wall to wall. Against faded blue velvet stood golden cups, silver dishes, platters and goblets set with gems, and ornaments made of gold and silver. There were diamond tiaras, ruby necklaces, and long strings of emeralds and pearls. The whole place shone with unimaginable splendour. It was like seeing the Crown jewels at the Tower, only there seemed to be far more treasure here than anyone had ever seen gathered in one place.
        - id: ch01-b67
          speaker: narrator
          text: The children stared open-mouthed, too amazed to breathe. The Princess stood with one arm stretched out in command and a proud smile on her lips.
        - id: ch01-b68
          speaker: gerald
          text: My word, just look at all this!
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: He only whispered it. No one else spoke. They waited as if enchanted for the Princess to say something.
        - id: ch01-b70
          speaker: princess
          text: What do you think of the bread-and-cheese game now? Can I do magic, or can't I?
          emotion: happy
        - id: ch01-b71
          speaker: kathleen
          text: You can! Oh, you really can!
          emotion: surprised
        - id: ch01-b72
          speaker: gerald
          text: May we touch them?
        - id: ch01-b73
          speaker: princess
          text: Everything of mine is yours. Only you must not take anything away.
        - id: ch01-b74
          speaker: jimmy
          text: We aren't thieves!
          emotion: angry
        - id: ch01-b75
          speaker: narrator
          text: The others were already lifting the marvellous things from their blue velvet shelves.
        - id: ch01-b76
          speaker: princess
          text: Perhaps you aren't, but you are a very unbelieving boy. You think I cannot see what is inside you, but I know what you've been thinking.
        - id: ch01-b77
          speaker: jimmy
          text: What have I been thinking?
        - id: ch01-b78
          speaker: princess
          text: You know perfectly well. You've been thinking about the bread and cheese I changed into beef, and about your secret fault. Come, let's dress up. You can all be princes and princesses too.
        - id: ch01-b79
          speaker: gerald
          text: Crowning our hero took only a moment.
        - id: ch01-b80
          speaker: narrator
          text: Gerald raised a golden crown topped with a cross and set it on his head. Then he added a grand linked collar and a belt of glittering emeralds. The emerald belt would not quite meet around his middle, so he worked out a clever way to join it with his own belt. By the time he had finished and turned around, the others had already decked themselves in diadems, necklaces, and rings.
        - id: ch01-b81
          speaker: princess
          text: You all look splendid! If only your clothes were prettier. People wear such ugly things nowadays. You should have seen what people wore a hundred years ago.
        - id: ch01-b82
          speaker: narrator
          text: Kathleen stopped with a diamond bracelet lifted in one hand.
        - id: ch01-b83
          speaker: kathleen
          text: Wait. What about the King and Queen?
        - id: ch01-b84
          speaker: princess
          text: Which King and Queen?
        - id: ch01-b85
          speaker: kathleen
          text: Your father and mother. Your sorrowing parents. They must be awake now. Won't they want to see you after a hundred years?
        - id: ch01-b86
          speaker: princess
          text: Oh. Ah. Yes. I embraced my delighted parents when I fetched the bread and cheese. They are having dinner, so they won't expect me yet. Here, look how splendid this is!
        - id: ch01-b87
          speaker: narrator
          text: The Princess quickly slipped a ruby bracelet onto Kathleen's arm, turning her attention away from the royal parents. Kathleen was perfectly content. She could happily have spent all day trying on one jewel after another, then admiring how each looked in the little silver-framed mirror the Princess had taken from a shelf. The boys, however, soon grew tired of watching and wearing ornaments.
        - id: ch01-b88
          speaker: gerald
          text: If your father and mother don't need you, let's go outside and play something. That maze would be excellent for besieged castles, unless you have another magic trick to show us.
        - id: ch01-b89
          speaker: princess
          text: You forget that I am grown up. I do not play games. Besides, too much magic is terribly tiring, and putting every one of these things back will take ages.
        - id: ch01-b90
          speaker: narrator
          text: It did take ages. The children would gladly have left the jewels wherever there was room, but the Princess would not allow it. She showed them that every necklace, bracelet, and ring had its own proper place. The velvet shelf beneath each piece dipped into a slight hollow, shaped so every stone would settle into its own little nest.
        - id: ch01-b91
          speaker: narrator
          text: Kathleen was fitting the last shining ornament into its proper hollow when something else caught her eye. A nearby part of the shelf held no bright jewels at all. Instead, there were rings, brooches, chains, and several strange objects whose names she did not know. They were made of dull metal, and every one had an odd shape.
        - id: ch01-b92
          speaker: kathleen
          text: What is all this rubbish?
        - id: ch01-b93
          speaker: princess
          text: Rubbish? Those are all magic! Whoever wears this bracelet must speak the truth. This chain makes you as strong as ten men. This spur makes your horse travel a mile a minute, and if you walk, it works like seven-league boots.
        - id: ch01-b94
          speaker: kathleen
          text: What does this brooch do?
        - id: ch01-b95
          speaker: narrator
          text: Kathleen reached for it, but the Princess caught her wrist.
        - id: ch01-b96
          speaker: princess
          text: Don't touch! If anyone except me touches these things, their magic will vanish forever. That brooch grants any wish you choose.
        - id: ch01-b97
          speaker: jimmy
          text: And what about this ring?
        - id: ch01-b98
          speaker: princess
          text: That ring makes you invisible.
        - id: ch01-b99
          speaker: gerald
          text: What does this odd buckle do?
        - id: ch01-b100
          speaker: princess
          text: It reverses all the other charms.
        - id: ch01-b101
          speaker: jimmy
          text: Is that really true? You aren't teasing us?
        - id: ch01-b102
          speaker: princess
          text: Teasing! After all the magic I've shown you, how dare you speak to a Princess that way?
          emotion: angry
        - id: ch01-b103
          speaker: gerald
          text: Could you show us how one of them works? Perhaps the brooch could give each of us a wish.
        - id: ch01-b104
          speaker: narrator
          text: The Princess did not answer at once. While they waited, the minds of all three children filled with wishes already granted. Their wishes were brilliant, but also thoroughly sensible. They were exactly the sort of reasonable wishes that never seem to occur to people in fairy tales when they suddenly get the chance to choose three.
        - id: ch01-b105
          speaker: princess
          text: No, I cannot give wishes to you. The brooch grants wishes only to me. But I will show you the ring making me invisible. You must close your eyes while I put it on.
        - id: ch01-b106
          speaker: narrator
          text: They closed their eyes.
        - id: ch01-b107
          speaker: princess
          text: Count to fifty, then look. After that, close your eyes and count to fifty once more, and I will appear again.
        - id: ch01-b108
          speaker: narrator
          text: Gerald counted aloud. Beneath his counting came another creak and rustle.
        - id: ch01-b109
          speaker: gerald
          text: Forty-seven, forty-eight, forty-nine, fifty!
        - id: ch01-b110
          speaker: narrator
          text: At Gerald's final number, all three children opened their eyes together. They were alone in the high, empty room. The dazzling shelves of treasure had vanished back behind the dark panelling. More astonishing still, the Princess had vanished with them.
        - id: ch01-b111
          speaker: jimmy
          text: She must have gone through the door.
        - id: ch01-b112
          speaker: narrator
          text: But the door was locked.
        - id: ch01-b113
          speaker: kathleen
          text: That truly is magic.
          emotion: surprised
        - id: ch01-b114
          speaker: jimmy
          text: Maskelyne and Devant can do that trick. And I want my tea.
        - id: ch01-b115
          speaker: gerald
          text: Your tea! The lovely Princess appeared again as soon as our hero counted fifty. One, two, three, four...
        - id: ch01-b116
          speaker: narrator
          text: Gerald and Kathleen shut their eyes as the second count began. Somehow Jimmy did not. He had not decided to cheat. He simply forgot to close them. When Gerald's counting reached twenty, Jimmy saw a panel beneath the window begin to open, slowly enough to reveal the trick.
        - id: ch01-b117
          speaker: jimmy
          text: There she is. I knew it was a trick!
        - id: ch01-b118
          speaker: narrator
          text: He said it to himself, then honourably closed his eyes. At fifty, all six eyes opened. The panel had closed, and there was still no Princess.
        - id: ch01-b119
          speaker: gerald
          text: It hasn't worked this time.
        - id: ch01-b120
          speaker: kathleen
          text: Perhaps we should count again.
        - id: ch01-b121
          speaker: jimmy
          text: There is a cupboard under the window. She is hiding inside it, behind a secret panel.
        - id: ch01-b122
          speaker: princess
          text: You looked! You cheated!
          emotion: angry
        - id: ch01-b123
          speaker: narrator
          text: Her voice came so close to Jimmy's ear that he jumped.
        - id: ch01-b124
          speaker: jimmy
          text: I did not cheat.
        - id: ch01-b125
          speakers: [gerald, jimmy, kathleen]
          ensemble: chorus
          text: Where are you? What happened?
          emotion: surprised
        - id: ch01-b126
          speaker: narrator
          text: They still could not see her anywhere.
        - id: ch01-b127
          speaker: kathleen
          text: Please become visible again, dear Princess. Shall we close our eyes and count once more?
        - id: ch01-b128
          speaker: princess
          text: Don't be ridiculous!
          emotion: angry
        - id: ch01-b129
          speaker: jimmy
          text: We aren't ridiculous. Why don't you come back and finish the trick? You know you're only hiding.
          emotion: angry
        - id: ch01-b130
          speaker: kathleen
          text: Jimmy, don't. She really is invisible.
        - id: ch01-b131
          speaker: jimmy
          text: I would be invisible too if I climbed into that cupboard.
        - id: ch01-b132
          speaker: princess
          text: Oh, yes, you all think you are very clever. Never mind. If you like, we shall pretend that you cannot see me.
          emotion: angry
        - id: ch01-b133
          speaker: gerald
          text: But we truly can't see you. There is no point getting angry. If you're hiding, come out. If you have become invisible, then make yourself visible again.
        - id: ch01-b134
          speaker: princess
          text: Do you honestly mean you cannot see me?
          emotion: surprised
        - id: ch01-b135
          speaker: jimmy
          text: Can't you see that we can't?
        - id: ch01-b136
          speaker: narrator
          text: The sun poured through the window. The eight-sided room was hot, and everyone was growing cross.
        - id: ch01-b137
          speaker: princess
          text: You really cannot see me?
          emotion: sad
        - id: ch01-b138
          speaker: narrator
          text: A sob caught in her voice.
        - id: ch01-b139
          speaker: jimmy
          text: No, we can't see you. And I want my tea!
        - id: ch01-b140
          speaker: narrator
          text: His words snapped off like a stick of sealing wax. Then something truly horrible happened in the golden afternoon. Jimmy suddenly leaned backward, then pitched forward. His eyes opened wide, and so did his mouth. Back and forth he went, very quickly and with sharp, sudden movements. Then, just as abruptly, he stood still.
        - id: ch01-b141
          speaker: kathleen
          text: Oh, he's having a fit! Jimmy, dear Jimmy, what is it?
          emotion: fearful
        - id: ch01-b142
          speaker: narrator
          text: She hurried to him.
        - id: ch01-b143
          speaker: jimmy
          text: It isn't a fit. She shook me!
          emotion: angry
        - id: ch01-b144
          speaker: princess
          text: I did, and I will shake him again if he keeps saying he cannot see me.
          emotion: angry
        - id: ch01-b145
          speaker: gerald
          text: Shake me instead. I am nearer your own size.
          emotion: angry
        - id: ch01-b146
          speaker: narrator
          text: She did so at once, but she did not shake Gerald for long. The moment he felt hands land on his shoulders, he reached up and caught both invisible wrists. There he stood, gripping hands and arms he could feel but could not see. The sensation was dreadful. An unseen foot kicked him and made him wince, but still he held on tightly.
        - id: ch01-b147
          speaker: gerald
          text: Cathy, come and catch her legs! She is kicking me!
        - id: ch01-b148
          speaker: kathleen
          text: Where are they? I can't see any legs!
        - id: ch01-b149
          speaker: gerald
          text: I have her hands. She really is invisible. Take this hand, then feel your way down until you reach her legs.
        - id: ch01-b150
          speaker: narrator
          text: Kathleen obeyed. It is hard to explain how frightening and uncomfortable it is, in full daylight, to feel hands and arms that you cannot see.
        - id: ch01-b151
          speaker: princess
          text: You shall not hold my legs!
          emotion: angry
        - id: ch01-b152
          speaker: narrator
          text: The invisible Princess struggled fiercely.
        - id: ch01-b153
          speaker: gerald
          text: Why are you so angry? You said you would become invisible, and you have.
          emotion: calm
        - id: ch01-b154
          speaker: princess
          text: I have not!
          emotion: angry
        - id: ch01-b155
          speaker: gerald
          text: You really have. Look in the mirror.
          emotion: calm
        - id: ch01-b156
          speaker: princess
          text: I haven't. I cannot have disappeared.
        - id: ch01-b157
          speaker: gerald
          text: Look in the mirror.
          emotion: calm
        - id: ch01-b158
          speaker: princess
          text: Then let me go.
        - id: ch01-b159
          speaker: narrator
          text: Gerald released her. At once, he found it hard to believe that he had truly been holding invisible hands.
        - id: ch01-b160
          speaker: princess
          text: You are only pretending you cannot see me, aren't you? Please say you are. You have had your joke. Don't keep doing it. I don't like it.
          emotion: fearful
        - id: ch01-b161
          speaker: gerald
          text: On our sacred word of honour, you are still invisible.
        - id: ch01-b162
          speaker: narrator
          text: Silence followed.
        - id: ch01-b163
          speaker: princess
          text: Come with me. I will let you out, and then you can go. I am tired of playing with you.
          emotion: sad
        - id: ch01-b164
          speaker: narrator
          text: They followed the sound of her voice to the door, passed through it, and went along the little dark passage into the great hall. The unseen Princess led all the way. None of the children spoke to her or to one another. Everyone felt deeply uncomfortable, and the silence stayed with them as they crossed the hall.
        - id: ch01-b165
          speaker: jimmy
          text: Let's get away from here.
        - id: ch01-b166
          speaker: narrator
          text: He whispered as they reached the far end of the hall.
        - id: ch01-b167
          speaker: princess
          text: This way is quicker. I think you are all hateful. I wish I had never played with you. Mother always warned me not to play with strange children.
          emotion: angry
        - id: ch01-b168
          speaker: narrator
          text: A door opened abruptly, though no hand touched it.
        - id: ch01-b169
          speaker: princess
          text: Well, come through!
          emotion: angry
        - id: ch01-b170
          speaker: narrator
          text: They entered a small anteroom. Long, narrow mirrors stood between long, narrow windows.
        - id: ch01-b171
          speaker: gerald
          text: Goodbye, and thank you for the wonderful time. Let us part as friends.
        - id: ch01-b172
          speaker: narrator
          text: Gerald held out his hand. An unseen hand slowly entered it, and his fingers closed around it like a vice.
        - id: ch01-b173
          speaker: gerald
          text: Now you must look in the mirror and admit that we are not lying.
        - id: ch01-b174
          speaker: narrator
          text: He guided the invisible Princess to a mirror and held her by the shoulders in front of it.
        - id: ch01-b175
          speaker: gerald
          text: Look for yourself.
        - id: ch01-b176
          speaker: narrator
          text: There was a pause. Then a despairing cry rang through the room.
        - id: ch01-b177
          speaker: princess
          text: Oh! Oh! I am invisible! What am I going to do?
          emotion: fearful
        - id: ch01-b178
          speaker: kathleen
          text: Take off the ring.
        - id: ch01-b179
          speaker: narrator
          text: Another silence followed.
        - id: ch01-b180
          speaker: princess
          text: I can't! It will not come off. But the ring cannot have done this. Rings do not make people invisible.
          emotion: fearful
        - id: ch01-b181
          speaker: kathleen
          text: You said this ring did, and now it has.
        - id: ch01-b182
          speaker: princess
          text: But it can't have! I was only pretending to do magic. I hid in the secret cupboard. It was just a game. Oh, what can I do now?
          emotion: fearful
        - id: ch01-b183
          speaker: gerald
          text: Was it only a game? But the jewels were invisible, and you made them appear. That was magic.
          emotion: surprised
        - id: ch01-b184
          speaker: princess
          text: That was only a hidden spring. It makes the panelling slide upward. Oh, what shall I do?
          emotion: fearful
        - id: ch01-b185
          speaker: narrator
          text: Kathleen moved toward the voice and reached about carefully until her arms closed around an unseen waist wrapped in pink silk. Invisible arms clasped her in return. A hot cheek that could not be seen pressed against Kathleen's own cheek. Between their two faces, warm invisible tears made both cheeks wet.
        - id: ch01-b186
          speaker: kathleen
          text: Don't cry, dear. Let me fetch the King and Queen.
          emotion: calm
        - id: ch01-b187
          speaker: princess
          text: Do you mean the King and Queen?
        - id: ch01-b188
          speaker: kathleen
          text: Your royal father and mother.
        - id: ch01-b189
          speaker: princess
          text: Please don't mock me. You know the King and Queen were only another game.
          emotion: sad
        - id: ch01-b190
          speaker: jimmy
          text: Like the bread and cheese! I knew that was a game.
          emotion: happy
        - id: ch01-b191
          speaker: kathleen
          text: Then how do you explain your dress and finding you asleep in the maze?
        - id: ch01-b192
          speaker: princess
          text: I dressed up for fun because everyone had gone away to the fair. I laid the thread through the maze to make the game feel more real. At first I was pretending to be Fair Rosamond. Then I heard you talking in the maze and thought it would be such fun to include you. But now I am invisible, and I will never be right again. Never! I know I won't. It serves me right for lying. Still, I did not truly expect you to believe my story. Not more than half believe it, anyway.
          emotion: sad
        - id: ch01-b193
          speaker: kathleen
          text: If you aren't a Princess, then who are you?
        - id: ch01-b194
          speaker: narrator
          text: Kathleen still held the invisible girl in her arms.
        - id: ch01-b195
          speaker: princess
          text: I live here with my aunt. She could return at any moment. Oh, what shall I do?
          emotion: fearful
        - id: ch01-b196
          speaker: kathleen
          text: Perhaps she knows a charm that could help you.
        - id: ch01-b197
          speaker: princess
          text: Nonsense! She doesn't believe in charms. She would be furious. I can't let her see me like this! And if she found all of you here, she would be dreadfully cross.
          emotion: fearful
        - id: ch01-b198
          speaker: narrator
          text: A little while ago, the children had believed completely in the beautiful magic castle. Now that castle of make-believe seemed to be falling to pieces around their ears. The royal parents, the hundred-year sleep, the feast, and the treasure-room magic had all vanished. Only the Princess's invisibility remained. You must admit, that was quite a lot of magic to remain.
        - id: ch01-b199
          speaker: princess
          text: I only said the ring was magic, and then it came true. I wish I had never pretended to do magic. I wish I had never played any game at all.
          emotion: sad
        - id: ch01-b200
          speaker: gerald
          text: Don't say that. We can go into the garden near the lake, where it is cool, and hold a solemn council. You would like that, wouldn't you?
        - id: ch01-b201
          speaker: kathleen
          text: The buckle! You said it reverses magic!
          emotion: surprised
        - id: ch01-b202
          speaker: princess
          text: It doesn't really. I invented that too.
          emotion: sad
        - id: ch01-b203
          speaker: gerald
          text: You invented the story about the ring, and that came true. We should try the buckle.
        - id: ch01-b204
          speaker: princess
          text: I will try it, not you. Go down to the Temple of Flora by the lake. I will return to the jewel room alone. My aunt might see you.
        - id: ch01-b205
          speaker: jimmy
          text: She won't see you.
        - id: ch01-b206
          speaker: gerald
          text: Jimmy, don't make it worse. Which way is the Temple of Flora?
        - id: ch01-b207
          speaker: princess
          text: Go down those steps, then follow the winding path through the bushes. You cannot miss it. It is made of white marble, with a statue of a goddess inside.
        - id: ch01-b208
          speaker: narrator
          text: The three children followed the path to the white marble Temple of Flora. It stood close against the side of a little hill, near the lake. They went inside and sat in its cool, restful shade. Open arches ran all around the temple, except where the hill rose behind the statue of the goddess.
        - id: ch01-b209
          speaker: narrator
          text: They had been waiting for less than five minutes when the sound of running feet came sharply along the gravel path. No runner could be seen approaching through the arches. But a very black, clearly shaped shadow rushed into the temple and fell across its white marble floor.
        - id: ch01-b210
          speaker: jimmy
          text: Your shadow isn't invisible, at least.
        - id: ch01-b211
          speaker: princess
          text: Oh, bother my shadow! We left the key inside the door. The wind blew it shut, and it has a spring lock!
          emotion: angry
        - id: ch01-b212
          speaker: narrator
          text: They paused, all feeling the full weight of this new trouble.
        - id: ch01-b213
          speaker: gerald
          text: Sit down, Princess. We need to talk the whole matter over properly.
        - id: ch01-b214
          speaker: jimmy
          text: Perhaps we'll wake up and discover it was all a dream.
        - id: ch01-b215
          speaker: princess
          text: We won't be that lucky.
          emotion: sad
        - id: ch01-b216
          speaker: gerald
          text: First, what is your name? If you are not a Princess, who are you?
        - id: ch01-b217
          speaker: princess
          text: I am the housekeeper's niece here at the castle. My name is Mabel Prowse.
          emotion: sad
        - id: ch01-b218
          speaker: jimmy
          text: That is exactly what I thought.
        - id: ch01-b219
          speaker: narrator
          text: This was not remotely true. There was not even a shadow of truth in it, because how could Jimmy possibly have known? Gerald and Kathleen said nothing. It was one of those moments when everyone is deeply stirred up, and all their thoughts run together in confusion.
        - id: ch01-b220
          speaker: gerald
          text: Well, at least you belong here.
        - id: ch01-b221
          speaker: princess
          text: Yes, I belong here. But what good is belonging anywhere when nobody can see you?
          emotion: sad
        - id: ch01-b222
          speaker: narrator
          text: Her voice came from the floor, as if she had thrown herself down in despair.
