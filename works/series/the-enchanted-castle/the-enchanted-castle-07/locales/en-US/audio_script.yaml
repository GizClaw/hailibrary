  chapters:
    - id: ch01
      title: CHAPTER VII
      blocks:
        - id: ch01-b01
          speaker: respectable_ugly_wugly
          text: Can you recommend a good hotel?
        - id: ch01-b02
          speaker: narrator
          text: The speaker had no inside to his head, and Gerald knew it. There were no shoulders inside the coat, only the bar it hung on. The raised hand was a glove stuffed with handkerchiefs, and its arm was Kathleen's school umbrella. Still, the whole thing was alive, asking a perfectly reasonable question for anyone who had a real body.
        - id: ch01-b03
          speaker: narrator
          text: Gerald felt himself sink inside. This was the moment when he had to rise to the occasion, but rising even a little seemed impossible.
        - id: ch01-b04
          speaker: gerald
          text: I beg your pardon?
        - id: ch01-b05
          speaker: respectable_ugly_wugly
          text: Aa oo re-o-me me oo a oo ho-el?
        - id: ch01-b06
          speaker: gerald
          text: You want a hotel? A good hotel?
        - id: ch01-b07
          speaker: respectable_ugly_wugly
          text: A oo ho-el.
        - id: ch01-b08
          speaker: gerald
          text: I'm terribly sorry, but all our hotels close very early. About eight, I think.
        - id: ch01-b09
          speaker: respectable_ugly_wugly
          text: Och em er.
        - id: ch01-b10
          speaker: narrator
          text: Somehow Gerald understood him to mean, "Knock them up." Even now he cannot explain how a practical joke, hurriedly made from a hat, an overcoat, a paper face, and limp hands, could become so respectable merely by coming alive. The creature seemed about fifty years old. He was plainly well known and respected in his own suburb, the sort of man who traveled first class and smoked expensive cigars. None of those qualities had been built into the coat and hat, yet there they were.
        - id: ch01-b11
          speaker: gerald
          text: You can't wake them. Every hotel keeper in town is completely deaf. It's a County Council law. Only deaf people may keep hotels, because the hops in beer are so good for earache.
        - id: ch01-b12
          speaker: respectable_ugly_wugly
          text: I o wy ollo oo.
        - id: ch01-b13
          speaker: narrator
          text: This meant that he did not quite follow. Gerald admitted that the matter was difficult at first. By then the other Ugly-Wuglies had crowded around him.
        - id: ch01-b14
          speaker: flower_hat_ugly_wugly
          text: If there is no hotel, then we need lodgings.
        - id: ch01-b15
          speaker: narrator
          text: Gerald was becoming clever at understanding people with no roofs to their mouths. A song about sleeping on the cold ground ran uselessly through his mind. Then he wondered if it might be useful after all.
        - id: ch01-b16
          speaker: gerald
          text: I do know a lodging, but...
        - id: ch01-b17
          speaker: narrator
          text: The tallest Ugly-Wugly pushed forward. He wore the old brown coat and top hat kept on the school hat stand to fool burglars into thinking a gentleman was home. He looked more sporting and less reserved than the first, and plainly was not quite a gentleman.
        - id: ch01-b18
          speaker: tall_hat_ugly_wugly
          text: Wa I wo oo oh...
        - id: ch01-b19
          speaker: narrator
          text: The flower-hatted lady interrupted. Her speech was clearer because her paper mouth had been cut open and the flap folded back, giving her something like a roof to her mouth.
        - id: ch01-b20
          speaker: flower_hat_ugly_wugly
          text: What I want to know is, where are the carriages we ordered?
        - id: ch01-b21
          speaker: gerald
          text: I don't know, but I'll find out. We ought to move now. The performance is over, and they'll want to close the house and put out the lights.
        - id: ch01-b22
          speaker: respectable_ugly_wugly
          text: Eh ech e oo-ig.
        - id: ch01-b23
          speaker: narrator
          text: He stepped toward the front door.
        - id: ch01-b24
          speaker: flower_hat_ugly_wugly
          text: Oo urn oo.
        - id: ch01-b25
          speaker: narrator
          text: Her painted red lips seemed to stretch into a smile.
        - id: ch01-b26
          speaker: gerald
          text: I'd be delighted to help in any way I can. Things always happen so awkwardly when you least expect them. I'll come with you and find you lodgings, if you will only wait a few minutes in the yard. It is a very superior sort of yard, not a common one at all. The pump has just been painted green from top to bottom, and the dustbin is made of enamelled iron.
        - id: ch01-b27
          speaker: narrator
          text: The Ugly-Wuglies consulted one another. The green pump and enamelled dustbin seemed to change their opinion of the yard completely.
        - id: ch01-b28
          speaker: gerald
          text: I'm so sorry to keep you waiting, but I have an uncle who is quite mad. I must give him his gruel at half past nine, and he won't eat from anyone else's hand.
        - id: ch01-b29
          speaker: narrator
          text: Gerald no longer cared what he said. Ugly-Wuglies were the only people one was allowed to lie to. They were only clothes with no insides, a kind of very real vision, so they could not truly be deceived even when they seemed to be.
        - id: ch01-b30
          speaker: narrator
          text: Gerald led them through the coloured-glass back door and down the iron steps. They followed into the yard. Those with boots managed well enough, but the ones whose feet were broomsticks or umbrellas struggled on the open iron stairs.
        - id: ch01-b31
          speaker: gerald
          text: Would you mind waiting under the balcony? My uncle is extremely mad. If he saw strangers, even aristocratic ones, I couldn't answer for what might happen.
        - id: ch01-b32
          speaker: flower_hat_ugly_wugly
          text: Perhaps we'd better find lodgings for ourselves.
          emotion: fearful
        - id: ch01-b33
          speaker: gerald
          text: I wouldn't advise it. The police arrest every stranger here under a new law the Liberals have made. You'd be given lodgings you wouldn't care for. I couldn't bear to think of you in a prison dungeon.
        - id: ch01-b34
          speaker: respectable_ugly_wugly
          text: I ah wi oo er papers. What a disgraceful state of things.
        - id: ch01-b35
          speaker: narrator
          text: They lined up beneath the iron balcony. Gerald gave them one last look. In the secret part of his mind, he wondered why he was not frightened. In the outside part, he was congratulating himself on being so brave. The creatures looked horrible in that light. It was hard to believe they were only clothes, pillows, and sticks with nothing inside them. He went back up the awkward iron steps while their conversation rose from below in strange sounds made almost entirely of "oo" and "ah."
        - id: ch01-b36
          speaker: respectable_ugly_wugly
          text: A most gentlemanly lad.
        - id: ch01-b37
          speaker: flower_hat_ugly_wugly
          text: Yes, indeed.
        - id: ch01-b38
          speaker: narrator
          text: The coloured-glass door shut behind Gerald. On one side was the yard, filled with seven impossible creatures. On the other was the silent house, where five human beings waited in as much fear as human beings can feel. Perhaps you think an Ugly-Wugly is nothing to be frightened of. That is only because you have never seen one come alive. Try making one yourself. Take any old suit of your father's and a hat he is not wearing. Add a bolster or two, a painted paper face, a few sticks, and a pair of boots. Then persuade your father to lend you a wishing ring. Give it back when the work is done, and see how brave you feel.
        - id: ch01-b39
          speaker: narrator
          text: Gerald was unafraid because he wore the ring. Its wearer feared nothing unless he touched the thing itself. He knew exactly how the others must feel, though, and stopped in the hall to imagine what might have soothed him if he had been that terrified.
        - id: ch01-b40
          speaker: gerald
          text: Cathy! Jimmy! Mabel, ahoy!
        - id: ch01-b41
          speaker: narrator
          text: He called in a loud, cheerful voice that sounded false even to him. The dining-room door opened one careful inch.
        - id: ch01-b42
          speaker: gerald
          text: What a lark! Let me in. Why are you holding the door shut?
        - id: ch01-b43
          speaker: kathleen
          text: Are you alone?
          emotion: fearful
        - id: ch01-b44
          speaker: gerald
          text: Of course I am. Don't be a duffer.
        - id: ch01-b45
          speaker: narrator
          text: The door opened on three frightened faces and the scattered chairs where the strange audience had been sitting.
        - id: ch01-b46
          speakers: [kathleen, princess, jimmy]
          ensemble: chorus
          text: Where are they? Did you unwish them? We heard them talking. It was horrible!
          emotion: fearful
        - id: ch01-b47
          speaker: gerald
          text: They're in the yard, and it's wonderful fun. They're just like real people, quite kind and jolly. This is the best sort of adventure. Don't let Mademoiselle or Eliza know anything. I'll manage both of them. Then Cathy and Jimmy must go to bed, while I take Mabel home. As soon as Mabel and I are outside, I must find some kind of lodging for the Ugly-Wuglies. They really are great fun. I only wish all of you could come along.
        - id: ch01-b48
          speaker: kathleen
          text: Fun? Are you sure?
        - id: ch01-b49
          speaker: gerald
          text: It's perfectly killing. Listen to what I tell Mademoiselle and Eliza, and support me with all you've got.
        - id: ch01-b50
          speaker: princess
          text: You can't leave me alone outside and go away with those horrible things. They look like fiends.
          emotion: fearful
        - id: ch01-b51
          speaker: gerald
          text: Wait until you see them close up. They're quite ordinary. The first one only asked me for a good hotel. I couldn't understand him at first because he has no roof to his mouth.
        - id: ch01-b52
          speaker: narrator
          text: Gerald knew at once that mentioning the missing roof had been a mistake. Mabel and Kathleen had already been holding hands as if they had clung together in terror. Now they gripped each other again. Jimmy sat on the edge of the old stage, knocking his boots against the pink counterpane, and shuddered.
        - id: ch01-b53
          speaker: gerald
          text: The roofs don't matter. You soon understand them. I heard them call me a gentlemanly lad. Fiends wouldn't stop to notice a little thing like that.
        - id: ch01-b54
          speaker: princess
          text: I don't care what they think of you. If you don't see me home, you aren't gentlemanly at all. Will you take me or not?
        - id: ch01-b55
          speaker: gerald
          text: Of course. We'll have a splendid adventure. Now for Mademoiselle.
        - id: ch01-b56
          speaker: narrator
          text: Gerald pulled on his coat as he spoke and ran upstairs. The others crowded together in the hall and listened. First came his lighthearted knock at Mademoiselle's door. It was the sort of knock that asked why anyone would bolt a door when nothing unusual had happened. Then they heard his reassuring call that it was only Gerald. There was a pause, the door opened, and a low conversation began. After that, Gerald and Mademoiselle moved to Eliza's door. They offered reassurance while Eliza poured out her terror in plain, rapid words, and Gerald soothed every fear with great tact.
        - id: ch01-b57
          speaker: jimmy
          text: I wonder what lies he's telling them.
        - id: ch01-b58
          speaker: princess
          text: They aren't lies. He's only giving them as much truth as is good for them.
        - id: ch01-b59
          speaker: jimmy
          text: If you'd been a man, you'd have made a beastly Jesuit and hidden in chimneys.
        - id: ch01-b60
          speaker: princess
          text: If I were only a boy, I wouldn't be scared out of my life by some old coats.
        - id: ch01-b61
          speaker: gerald
          text: I'm so sorry we frightened you. We never thought of that. It was a good trick, though, wasn't it?
        - id: ch01-b62
          speaker: jimmy
          text: There, he's told her it was our trick.
        - id: ch01-b63
          speaker: princess
          text: Well, it was our trick.
        - id: ch01-b64
          speaker: mademoiselle
          text: It was a wonderful trick. How did you make the figures move?
        - id: ch01-b65
          speaker: gerald
          text: We've often moved them with strings.
        - id: ch01-b66
          speaker: kathleen
          text: That's true as well.
        - id: ch01-b67
          speaker: mademoiselle
          text: Then show us this remarkable trick once more.
        - id: ch01-b68
          speaker: narrator
          text: Mademoiselle reached the mat at the foot of the stairs.
        - id: ch01-b69
          speaker: gerald
          text: Oh, I've cleared them all away. We were sorry you were startled, so we thought you wouldn't want to see them again.
        - id: ch01-b70
          speaker: kathleen
          text: He really has cleared them out.
        - id: ch01-b71
          speaker: mademoiselle
          text: Then let us have supper and talk about your beautiful play.
        - id: ch01-b72
          speaker: narrator
          text: Gerald gave a full explanation. His brother and sister, he said, would be delighted to have supper and discuss the play. He himself had a duty that could not be avoided. He must escort Mabel home. It was very kind of Mademoiselle to suggest that Mabel stay the night, but that was impossible because Mabel's aunt loved her with such anxious devotion that she would become frantic. Nor was there any use suggesting Eliza as an escort. Eliza was nervous after dark unless her gentleman friend went with her.
        - id: ch01-b73
          speaker: narrator
          text: So Mabel was fitted with her own hat and a cloak that belonged to someone else. She and Gerald went out through the front door among kind last words and arrangements for the following day. The instant the door shut behind them, Gerald caught Mabel by the arm. He led her briskly to the corner of the side street that ran toward the yard. Just beyond the corner, he stopped and faced her.
        - id: ch01-b74
          speaker: gerald
          text: Now tell me, are you an idiot or not?
        - id: ch01-b75
          speaker: princess
          text: You're the idiot!
        - id: ch01-b76
          speaker: narrator
          text: She answered from habit, because she could see he was serious.
        - id: ch01-b77
          speaker: gerald
          text: I'm not frightened of the Ugly-Wuglies. They're as harmless as tame rabbits. But an idiot might panic and ruin everything. If you're an idiot, say so. I'll tell the others you're afraid to walk home and that I'm going to inform your aunt you're staying.
        - id: ch01-b78
          speaker: princess
          text: I'm not an idiot, and I'm not afraid of anything.
        - id: ch01-b79
          speaker: narrator
          text: She stared wildly around her like someone who was truly terrified.
        - id: ch01-b80
          speaker: gerald
          text: I'm willing to share my dangers and difficulties with you. I wouldn't do that for my own brother. But if you spoil my plan, I'll never speak to you again, and I won't let the others speak to you either.
        - id: ch01-b81
          speaker: princess
          text: You're a beast! You don't have to threaten me into being brave. I am brave.
        - id: ch01-b82
          speaker: gerald
          text: Mabel, I know you are. I believe in you. That's why I arranged it this way. Beneath that black-and-white outside, you have the heart of a lion. Can I trust you to the death?
        - id: ch01-b83
          speaker: narrator
          text: Mabel felt that any answer but yes would throw away a priceless reputation for courage.
        - id: ch01-b84
          speaker: princess
          text: Yes.
        - id: ch01-b85
          speaker: gerald
          text: Then wait by this lamp. When I bring them, remember they're as harmless as serpents. I mean doves. Talk to them as you would to anyone else. Understand?
        - id: ch01-b86
          speaker: princess
          text: Which hotel are you taking them to?
        - id: ch01-b87
          speaker: gerald
          text: Oh, Jimminy! You see, you're helping already. I completely forgot. Is there a lodge or something in the Castle grounds where they could spend the night? The spell will break sometime, as the invisibility did. Then they'll only be coats and things, and we can carry them home another day.
        - id: ch01-b88
          speaker: princess
          text: There is a secret passage...
        - id: ch01-b89
          speaker: narrator
          text: Just then the yard door opened. An Ugly-Wugly put out its head and peered anxiously along the street.
        - id: ch01-b90
          speaker: gerald
          text: Righto!
        - id: ch01-b91
          speaker: narrator
          text: He ran to meet it. Mabel's whole body wanted to run just as quickly in the opposite direction, and for exactly the opposite reason. It took everything she had to remain where she was. Yet she did remain. For as long as she remembered that night, she was proud that she had won that battle with herself.
        - id: ch01-b92
          speaker: narrator
          text: With every silent precaution required by an uncle who was extremely mad, the grisly band crept out of the yard.
        - id: ch01-b93
          speaker: bonneted_ugly_wugly
          text: Walk on your toes, dear.
        - id: ch01-b94
          speaker: narrator
          text: He whispered to the bonneted lady. Even then, Gerald wondered how she could obey. One foot ended in a golf club and the other in a hockey stick.
        - id: ch01-b95
          speaker: narrator
          text: Mabel felt there was no shame in retreating as far as the lamp at the street corner. Once she reached it, though, she forced herself to stop. No one but Mabel ever knew how much effort that took. Imagine standing firm and silent while those hollow, unbelievable things came closer. Some clattered over the pavement on short, hard feet. The flower-hatted lady moved without a sound because her skirt brushed the ground, and Mabel knew perfectly well that there was nothing at all beneath it. The insides of Mabel's hands grew cold and damp. Still, she stood her ground.
        - id: ch01-b96
          speaker: princess
          text: They aren't real. They can't be real. It's only a dream. They can't be.
          emotion: fearful
        - id: ch01-b97
          speaker: narrator
          text: Then Gerald was beside her, surrounded by Ugly-Wuglies.
        - id: ch01-b98
          speaker: gerald
          text: This is our friend Mabel. She played the Princess. Be a man!
        - id: ch01-b99
          speaker: narrator
          text: His last words were whispered for her alone. Every nerve in Mabel felt stretched as tight as the strings of a banjo. One dreadful instant followed. She did not know whether she could obey and be a man, or whether she would become nothing more than a shrieking little mad girl running for her life. Then the respectable Ugly-Wugly reached out and gave her hand a limp shake.
        - id: ch01-b100
          speaker: princess
          text: He can't be real.
          emotion: fearful
        - id: ch01-b101
          speaker: narrator
          text: She told herself so as the lady with roses took her arm in a padded glove fixed to an umbrella.
        - id: ch01-b102
          speaker: flower_hat_ugly_wugly
          text: You dear, clever little thing! Do walk with me!
        - id: ch01-b103
          speaker: narrator
          text: The voice was gushing and girlish, and almost all its consonants were missing. Then the whole company walked up the High Street as if, in Gerald's words, they were anybody else.
        - id: ch01-b104
          speaker: narrator
          text: It was a strange procession, but fortunately Liddlesby went to bed early. Its policemen, like those in most towns, wore boots that could be heard from a mile away. If Gerald heard such boots, he would have time to turn the procession back or lead it away. For now, the street stayed empty. Gerald listened to Mabel making polite replies to the even more polite remarks of the friendly Ugly-Wuglies, and he could not help feeling proud of her courage. What he did not know was how very close she remained to one wild scream. That scream would bring the police and the sleeping residents into the street and ruin everything for everyone.
        - id: ch01-b105
          speaker: passerby
          text: Guy Fawkes, help me!
          emotion: surprised
        - id: ch01-b106
          speaker: narrator
          text: One man alone met them. He muttered those words and hurried across the road. When he described the sight the next day, his wife refused to believe him and called it a judgment on him, which was unreasonable.
        - id: ch01-b107
          speaker: narrator
          text: To Mabel, it felt as if she were taking part in a nightmare that someone had arranged down to its smallest detail. But Gerald was in the nightmare too, and Gerald had asked whether she was an idiot. Well, she was not an idiot. She felt that she might become one very soon, but she was not one yet. So she walked on, answering the courteous streams of vowels spoken by these impossible people. Her aunt had often complained about impossible people. Now Mabel understood exactly what such people were like.
        - id: ch01-b108
          speaker: narrator
          text: Summer twilight faded into moonlight. On the white road, the creatures' shadows looked worse than their solid bodies. Mabel wished for darkness, then shuddered and hurriedly took the wish back.
        - id: ch01-b109
          speaker: narrator
          text: The tall-hatted Ugly-Wugly put Gerald through a searching examination. He wanted to know about Gerald's schools, his sports, the things he did for amusement, and his plans for the future. Gerald answered while wondering how long the spell might last. The ring seemed to do everything in sevens. Would these creatures live for seven hours, fourteen hours, or twenty-one? His mind wandered deeper and deeper into the seven-times table, which could be troublesome even in the best of circumstances. He only found his way out of the figures with a shock, when the whole procession arrived at the gates of the Castle grounds.
        - id: ch01-b110
          speaker: narrator
          text: The gates were locked.
        - id: ch01-b111
          speaker: gerald
          text: You see, it's very late. There is another way, but we'll have to climb through a hole.
        - id: ch01-b112
          speaker: respectable_ugly_wugly
          text: But the ladies...
        - id: ch01-b113
          speakers: [bonneted_ugly_wugly, flower_hat_ugly_wugly]
          ensemble: duo
          text: We love adventures!
        - id: ch01-b114
          speaker: flower_hat_ugly_wugly
          text: So frightfully thrilling!
        - id: ch01-b115
          speaker: narrator
          text: They followed the road around toward the hole. It was difficult to find, because moonlight always makes the most familiar places look strange. Gerald went first with a bicycle lantern he had snatched up as his pilgrims came out of the yard. The shrinking Mabel followed him. One by one, the Ugly-Wuglies crept through after her. Their wooden limbs knocked against the stone with hollow rattles. Strange vowel sounds came from the painted mouths, expressing general amazement, manly courage, and feminine nervousness. The whole company followed Gerald's small light down the passage, through the cutting hung with ferns, and under the arch into the grounds.
        - id: ch01-b116
          speakers: [respectable_ugly_wugly, flower_hat_ugly_wugly, tall_hat_ugly_wugly]
          ensemble: chorus
          text: Oh!
          emotion: surprised
        - id: ch01-b117
          speaker: narrator
          text: They emerged into the moonlit Italian garden, and more than one painted mouth gave that perfectly clear cry of admiration.
        - id: ch01-b118
          speaker: respectable_ugly_wugly
          text: Quite a show-place, by George, sir!
        - id: ch01-b119
          speaker: narrator
          text: Surely those marble terraces and carefully winding gravel paths had never echoed to footsteps like these. For all the enchantments the garden had known, shadows so wildly unbelievable had never fallen across its smooth grey lawns, silvered now with dew. Gerald was thinking something of the kind. What he actually thought was that even this garden had never seen such a commotion. Then the statue of Hermes sprang from its pedestal and ran toward the company with all the lively curiosity of a street boy who sees a fight beginning and means to be part of it.
        - id: ch01-b120
          speaker: narrator
          text: Only Gerald saw the white figure coming. The ring showed him what remained invisible to the others. He slipped it off, and Hermes stood frozen on his pedestal like a Christmas snowman. Gerald put it on again. At once Hermes was circling the visitors and staring deep into each paper face.
        - id: ch01-b121
          speaker: tall_hat_ugly_wugly
          text: This appears to be a very superior hotel. The grounds are laid out with what you might call taste.
        - id: ch01-b122
          speaker: princess
          text: We'll have to use the back door. The front is locked at half past nine.
        - id: ch01-b123
          speaker: small_ugly_wugly
          text: Quite an escapade. Makes me feel young again.
        - id: ch01-b124
          speaker: narrator
          text: The procession went around the marble-edged pool. Goldfish moved and glimmered beneath the surface. This was the same pool where the great beast from prehistoric times had once come down to drink and bathe. Moonlight broke across the water in flashes like white diamonds. Gerald alone saw that the enormous scaly, plated lizard had returned. At that very moment it was rolling and wallowing among the lily pads, unseen by every other member of the company.
        - id: ch01-b125
          speaker: narrator
          text: They hurried up the steps of the Temple of Flora. Its back, where there was no graceful arch open to the air, stood against one of the steep hills that rose almost like cliffs around the garden. Mabel slipped behind the statue of the goddess and felt about for a moment. Then Gerald's lantern flashed across the wall like a searchlight and revealed a doorway, very tall and very narrow. The stone that served as its door had sealed the opening completely. Under the touch of Mabel's fingers, it slowly revolved out of the way.
        - id: ch01-b126
          speaker: princess
          text: This way.
        - id: ch01-b127
          speaker: narrator
          text: She was breathing quickly, and the back of her neck felt cold and rough with gooseflesh.
        - id: ch01-b128
          speaker: tall_hat_ugly_wugly
          text: Lead on with the lantern, my lad.
        - id: ch01-b129
          speaker: gerald
          text: I must stay here and shut the door.
        - id: ch01-b130
          speaker: flower_hat_ugly_wugly
          text: The Princess can close it. We'll help her.
        - id: ch01-b131
          speaker: narrator
          text: Gerald thought this horribly officious. He gently insisted that shutting the door safely was his responsibility.
        - id: ch01-b132
          speaker: gerald
          text: I'm sure you wouldn't want me to get into trouble.
        - id: ch01-b133
          speaker: narrator
          text: For the last time, the Ugly-Wuglies were kind and reasonable. They agreed that Gerald getting into trouble was the very thing they most wished to avoid.
        - id: ch01-b134
          speaker: gerald
          text: You take the lamp. You're the natural leader.
        - id: ch01-b135
          speaker: narrator
          text: He pressed the bicycle lamp into the respectable Ugly-Wugly's hand.
        - id: ch01-b136
          speaker: gerald
          text: Go straight ahead. Are there any steps?
        - id: ch01-b137
          speaker: princess
          text: Not for a very long way. The passage goes on for ages, then turns around.
        - id: ch01-b138
          speaker: small_ugly_wugly
          text: Whispering ain't manners.
        - id: ch01-b139
          speaker: flower_hat_ugly_wugly
          text: He has no manners himself. Don't mind him. He's quite a self-made man.
        - id: ch01-b140
          speaker: narrator
          text: She squeezed Mabel's arm with dreadful, confidential softness. The respectable one led the way with the lamp, and the others followed him trustingly. One after another, every Ugly-Wugly disappeared into the narrow doorway. Gerald and Mabel remained outside. They hardly dared to breathe, for fear that even a breath might slow the procession or make one of the creatures turn around. At last the final hat and coat vanished into the darkness. The children almost sobbed with relief.
        - id: ch01-b141
          speaker: narrator
          text: Their relief came too soon. A sudden rush and scuffle broke out inside the passage. The children struggled to close the door, but the Ugly-Wuglies were pushing fiercely from the other side to open it again. Perhaps they had seen something in the dark passage and taken fright. Perhaps it had entered their empty heads that no truly respectable hotel could have such a back entrance. Or perhaps some sudden and convincing instinct warned them that Gerald had tricked them. Mabel and Gerald never knew the reason. What they did know was that the Ugly-Wuglies had stopped being friendly, commonplace people. A fierce change had come over the whole company.
        - id: ch01-b142
          speakers: [respectable_ugly_wugly, flower_hat_ugly_wugly, tall_hat_ugly_wugly, small_ugly_wugly]
          ensemble: chorus
          text: No! We won't go on! Make him lead!
          emotion: angry
        - id: ch01-b143
          speaker: narrator
          text: The women's screams and the hoarse, determined shouts of strong Ugly-Wuglies shattered the dreamy stillness of the perfect night. Worst of all was the steady pressure of the narrow stone door opening against the children. They had nearly forced it shut, but now a gap remained. Through it they saw a black, writhing crowd against the bicycle lantern's light. One padded hand reached around the edge of the stone. Arms made of sticks stretched angrily toward the outside world, the world from which the closed door would cut them off forever. Their speech was still broken and almost without consonants, but its tone was no longer polite or soothing. It had become a threat filled with the promise of horrors too dreadful to bear.
        - id: ch01-b144
          speaker: narrator
          text: Then the padded hand fell on Gerald's arm. Until that touch, the ring had kept his fear away, and he had known terror only by imagining what the others felt. Now all those terrors became real at once. In a flash like the one said to show drowning people their whole past lives, Gerald saw exactly what he had asked Mabel to do that night. He understood the courage he had demanded from her, and understood that she had given it.
        - id: ch01-b145
          speaker: gerald
          text: Push! Push for your life!
          emotion: fearful
        - id: ch01-b146
          speaker: narrator
          text: He braced his heel against Flora's pedestal and pushed with all his strength.
        - id: ch01-b147
          speaker: princess
          text: I can't push anymore. Oh, I can't!
          emotion: fearful
        - id: ch01-b148
          speaker: narrator
          text: Mabel tried to brace her heel too, but her legs were too short.
        - id: ch01-b149
          speaker: gerald
          text: They mustn't get out. They mustn't!
          emotion: fearful
        - id: ch01-b150
          speaker: tall_hat_ugly_wugly
          text: You'll know it when we do!
          emotion: angry
        - id: ch01-b151
          speaker: narrator
          text: Fury and the creature's roofless mouth would have made the threat meaningless to anyone whose ears had not been sharpened by that terrible moment.
        - id: ch01-b152
          speaker: stranger
          text: What's happening there?
        - id: ch01-b153
          speaker: narrator
          text: The new voice rang out with every consonant clear and comforting. A fresh shadow fell across the marble floor of Flora's temple.
        - id: ch01-b154
          speaker: gerald
          text: Help us push! If they get out, they'll kill us all!
          emotion: fearful
        - id: ch01-b155
          speaker: narrator
          text: His voice barely reached the newcomer. A strong shoulder covered in velveteen suddenly pressed between Gerald's shoulder and Mabel's. A stout man's heel found the support of the goddess's pedestal. Under that new strength, the heavy narrow door slowly gave way. Inch by inch it moved, until at last it closed and its spring clicked into place. The furious, surging, threatening mass of Ugly-Wuglies was shut inside. Gerald and Mabel, in a relief that seemed almost impossible to believe, were shut safely outside.
        - id: ch01-b156
          speaker: narrator
          text: Mabel threw herself down on the marble floor. Slow, heavy sobs shook her, not only from exhaustion but from the knowledge that they had succeeded. She had held her ground in the street, walked among the creatures, and helped keep them behind the door. If I had been there, I would have looked politely in another direction. Then I would not have seen whether Gerald finally gave himself up to the same sort of sobbing.
        - id: ch01-b157
          speaker: narrator
          text: The newcomer looked like a gamekeeper, Gerald decided later. He looked down at Mabel, at least, and spoke.
        - id: ch01-b158
          speaker: stranger
          text: Come now, don't be a little duffer. Or perhaps you're a pair of little duffers. Who was that, and what is all this about?
        - id: ch01-b159
          speaker: gerald
          text: I can't possibly tell you.
        - id: ch01-b160
          speaker: stranger
          text: We'll have to see about that. Come into the moonlight, and let's look at the situation.
        - id: ch01-b161
          speaker: narrator
          text: Even with his whole world turned upside down, Gerald found time for a thought about the newcomer. A gamekeeper who used expressions like "review the situation" had probably lived through a romantic past. He would certainly be much harder to manage with an unconvincing tale than Eliza, Johnson, or even Mademoiselle. Unfortunately, the only tale the children had to offer was the true one. With that particular truth, the man seemed almost impossible to manage at all.
        - id: ch01-b162
          speaker: narrator
          text: Gerald got up, if he had not been standing already, and pulled at Mabel's limp hand, which had grown hot now. The stranger took Gerald by the hand as well. In that fashion, he led both children out from the shadow beneath Flora's dome and into the clear moonlight. White light covered Flora's steps like a carpet. The man sat down with one child on either side. He drew one of Mabel's hands and one of Gerald's through his velveteen-covered arms, then pressed both children against his velveteen sides in a friendly, reassuring way.
        - id: ch01-b163
          speaker: stranger
          text: Now then. Go ahead.
        - id: ch01-b164
          speaker: narrator
          text: Mabel could not tell the story. She could only sob. We must forgive her for that. She had been very brave for a very long time, and bravery does not prevent a person from crying when the danger is over. I have no doubt that every heroine, from Joan of Arc to Grace Darling, has had her own moments of sobbing.
        - id: ch01-b165
          speaker: gerald
          text: It's no use. If I invented a story, you'd see through it.
        - id: ch01-b166
          speaker: stranger
          text: That's a compliment to my good judgment. How about telling me the truth?
        - id: ch01-b167
          speaker: gerald
          text: You wouldn't believe us if we did.
        - id: ch01-b168
          speaker: stranger
          text: Try me.
        - id: ch01-b169
          speaker: narrator
          text: He was clean-shaven, with large eyes that sparkled whenever the moon caught them.
        - id: ch01-b170
          speaker: gerald
          text: I can't. You'd think we were mad and have us locked away, or else... No, it's no good. Thank you for helping. Please let us go home.
        - id: ch01-b171
          speaker: stranger
          text: I wonder whether you have any imagination.
        - id: ch01-b172
          speaker: gerald
          text: Considering that we invented them...
        - id: ch01-b173
          speaker: narrator
          text: Gerald stopped himself, though rather late.
        - id: ch01-b174
          speaker: stranger
          text: If "them" means the people I helped you imprison in that tomb, remember that I saw and heard them. With all respect to your imagination, I doubt you could invent anything quite so convincing.
        - id: ch01-b175
          speaker: narrator
          text: Gerald planted his elbows on his knees and rested his chin in his hands.
        - id: ch01-b176
          speaker: stranger
          text: Collect yourself. While you do, let me explain my side. I don't think you understand my position. I've just come from London to look after a large estate.
        - id: ch01-b177
          speaker: gerald
          text: I thought you were a gamekeeper.
        - id: ch01-b178
          speaker: princess
          text: Then he's a hero in disguise. I knew it.
        - id: ch01-b179
          speaker: narrator
          text: Mabel laid her head on his shoulder and sniffed.
        - id: ch01-b180
          speaker: stranger
          text: Not at all. Bailiff would be closer. Try looking at this from my position. On my very first evening, I go out to enjoy the moonlight. As I approach a white building, I hear the noise of a violent struggle and frantic appeals for assistance. The excitement of the moment carries me away, and I do assist. I help shut goodness knows who behind a stone door. Now, is it unreasonable for me to ask whom I've helped to shut up, and who the two children are whom I have assisted?
        - id: ch01-b181
          speaker: gerald
          text: That's reasonable enough.
        - id: ch01-b182
          speaker: stranger
          text: Well, then?
        - id: ch01-b183
          speaker: gerald
          text: Well, the fact is... No. The fact is, I simply can't tell you.
        - id: ch01-b184
          speaker: stranger
          text: Then I'll ask the other side. Let me go. I'll open the door and find out.
        - id: ch01-b185
          speaker: princess
          text: Tell him. It doesn't matter whether he believes us. We can't let those things out.
        - id: ch01-b186
          speaker: gerald
          text: Very well. Mr. Bailiff, will you give us an English gentleman's word of honor? I can see you're a gentleman, bailiff or not. Promise you won't repeat our story or send us to a lunatic asylum, however mad we sound.
        - id: ch01-b187
          speaker: stranger
          text: Yes, I think I can promise all that. But there is another possibility. If you have been having some sort of sham fight and pushed the opposing side into that hole, don't you think you ought to let them out? They must be most terribly frightened in there. After all, I suppose the people behind that door are only children.
        - id: ch01-b188
          speaker: gerald
          text: Wait until you hear. They aren't children, not a bit. Shall I start with them or at the beginning?
        - id: ch01-b189
          speaker: stranger
          text: At the beginning, naturally.
        - id: ch01-b190
          speaker: princess
          text: Then let me start. I found a ring and pretended it could make me invisible. But it really did. I stayed invisible for twenty-one hours. Never mind where I found the ring. Gerald, you tell the rest.
        - id: ch01-b191
          speaker: narrator
          text: Gerald took over from there. He told how the children had learned what the ring could do, how the performance had ended, and how the figures they had made for an audience had come alive. He explained the dreadful moment when those hollow people began to speak, and how he had coaxed them into the yard and brought them through the moonlit streets. He went on for quite a long time, because after all it was a splendid story to tell.
        - id: ch01-b192
          speaker: gerald
          text: So we got them into the passage. When seven hours are over, or fourteen, or twenty-one, or some other time with a seven in it, they'll turn back into old coats. They came alive at half past nine. I think seven hours will do it, which means half past four. Now may we go home?
        - id: ch01-b193
          speaker: stranger
          text: I'll walk you home. Come along.
        - id: ch01-b194
          speaker: narrator
          text: His voice had changed into a new and annoyingly gentle tone.
        - id: ch01-b195
          speaker: gerald
          text: You don't believe us. Of course you don't. Nobody could. But I could make you believe if I wanted to.
        - id: ch01-b196
          speaker: narrator
          text: All three stood. The stranger stared into Gerald's eyes until Gerald answered the thought in them.
        - id: ch01-b197
          speaker: gerald
          text: I don't look mad, do I?
        - id: ch01-b198
          speaker: stranger
          text: No, you don't. You're an unusually sensible boy. But couldn't you be coming down with a fever or something?
        - id: ch01-b199
          speaker: gerald
          text: What about Cathy, Jimmy, Mademoiselle, Eliza, the man who cried "Guy Fawkes," and you? You saw the creatures move. You heard them shouting. Are all of you coming down with something too?
        - id: ch01-b200
          speaker: stranger
          text: No. Nothing except a need for information. Come, I'll see you home.
        - id: ch01-b201
          speaker: princess
          text: I live at the Towers.
        - id: ch01-b202
          speaker: narrator
          text: The stranger turned into the broad drive leading to the main gate.
        - id: ch01-b203
          speaker: princess
          text: I'm not related to Lord Yalding. I'm the housekeeper's niece.
        - id: ch01-b204
          speaker: narrator
          text: She held tightly to his hand all the way. At the servants' entrance, she lifted her face for a kiss and went inside.
        - id: ch01-b205
          speaker: stranger
          text: Poor little thing.
        - id: ch01-b206
          speaker: narrator
          text: He and Gerald went back down the drive and on to the school door.
        - id: ch01-b207
          speaker: gerald
          text: I know what you're planning. You're going back to open that door.
        - id: ch01-b208
          speaker: stranger
          text: Very discerning.
        - id: ch01-b209
          speaker: gerald
          text: Don't do it. Or at least wait for daylight and let us come too. We can be there by ten.
        - id: ch01-b210
          speaker: stranger
          text: All right. I'll meet you there at ten. By George, you are the strangest children I've ever met.
        - id: ch01-b211
          speaker: gerald
          text: We are strange. But you would be too if... Good night.
        - id: ch01-b212
          speaker: narrator
          text: The next day, all four children crossed the smooth lawn toward Flora's Temple. All morning they had talked over the adventures of the night before, and especially Mabel's courage. They had promised to arrive at ten, but it was already half past twelve. Eliza, firmly supported by Mademoiselle, had insisted that they clear up the litter left from the performance. She had also insisted that "clearing up" meant doing the work completely and very thoroughly before any of them went out.
        - id: ch01-b213
          speaker: kathleen
          text: Mabel, you're a Victoria Cross heroine. Someone ought to put up a statue of you.
        - id: ch01-b214
          speaker: gerald
          text: If they put it here, it would come alive.
        - id: ch01-b215
          speaker: jimmy
          text: I wouldn't have been frightened.
        - id: ch01-b216
          speaker: gerald
          text: Everything looks very different in daylight.
        - id: ch01-b217
          speaker: princess
          text: I hope he'll be there. He was such a dear, Cathy. A perfect bailiff, with a gentleman's soul.
        - id: ch01-b218
          speaker: jimmy
          text: He isn't there. I think you dreamed him, just like those moving statues.
        - id: ch01-b219
          speaker: narrator
          text: They climbed the marble steps in full sunshine. The temple, the statue, and the quiet garden all looked ordinary and safe. It was difficult to believe this was the very place where, only the night before, the moonlight had turned every shape strange and fear had laid such cold hands on the hearts of Mabel and Gerald.
        - id: ch01-b220
          speaker: kathleen
          text: Shall we open the door and start carrying the coats home?
        - id: ch01-b221
          speaker: gerald
          text: Listen first. They might not be coats yet.
        - id: ch01-b222
          speaker: narrator
          text: They pressed their ears against the hinges of the stone door. Behind that door, the Ugly-Wuglies had shrieked, struggled, and threatened them only hours ago. Now not one sound came through. Everything was as still as the sweet summer morning itself. The children listened, waited, and finally turned away. That was when they saw the man they had come to meet. He was on the other side of Flora's pedestal. But he was not waiting on his feet. He lay perfectly still on his back, with his arms flung wide on the marble.
        - id: ch01-b223
          speaker: kathleen
          text: Oh, look!
          emotion: surprised
        - id: ch01-b224
          speaker: narrator
          text: The children looked more closely. His face had turned a strange greenish color, nothing like the lively face they remembered from the night before. There was a cut across his forehead. The edges of the wound looked blue, and a small trail of blood had run from it onto the whiteness of the marble where he lay.
        - id: ch01-b225
          speaker: narrator
          text: At that same instant, Mabel raised her hand and pointed too. Unlike Cathy, she did not cry out. Her finger aimed at a large rhododendron bush with thick, glossy leaves. From among them, a pointed paper face peered at the children. Its painted white skin and painted red features showed clearly in the bright sunlight. The children stared back. Then, while they were still watching, the face slowly shrank out of sight beneath the cover of the shining leaves.
