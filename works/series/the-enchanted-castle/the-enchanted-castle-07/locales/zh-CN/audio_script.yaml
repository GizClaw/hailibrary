audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 温柔热情，中文里带一点轻巧的外国口音
        timbre: 柔和明净的年轻女声
        pace: 从容
        pitch: 中音
    ugly_respectable:
      display_name: 体面的丑八怪
      tts:
        delivery: 彬彬有礼，含混的吐字里带着中年绅士的笃定
        timbre: 空洞柔闷的成年男声
        pace: 稍慢
        pitch: 中低音
    ugly_bonnet:
      display_name: 戴软帽的丑八怪女士
      tts:
        delivery: 谨慎拘礼，说话含混而轻柔
        timbre: 空洞单薄的年长女声
        pace: 舒缓
        pitch: 中音
    ugly_tall:
      display_name: 戴高礼帽的丑八怪
      tts:
        delivery: 爽朗健谈，带一点自来熟的派头
        timbre: 空洞粗哑的成年男声
        pace: 自然
        pitch: 中低音
    ugly_wreathed:
      display_name: 戴花环帽的丑八怪女士
      tts:
        delivery: 热情娇嗔，殷勤得令人不安
        timbre: 柔软空洞的年轻女声
        pace: 轻快
        pitch: 中高音
    ugly_small:
      display_name: 最小的丑八怪
      tts:
        delivery: 生硬挑剔，爱突然插话
        timbre: 干瘪空洞的成年男声
        pace: 稍快
        pitch: 中高音
    ugly_cricket:
      display_name: 戴板球帽的丑八怪
      tts:
        delivery: 低声咕哝，像个偷偷冒险的老实人
        timbre: 厚钝空洞的成年男声
        pace: 稍慢
        pitch: 中低音
    passerby:
      display_name: 路人
      tts:
        delivery: 猛然受惊，边嘟囔边逃开
        timbre: 粗粝的成年男声
        pace: 急促
        pitch: 中音
    bailiff:
      display_name: 庄园管家
      tts:
        delivery: 爽朗沉着，温和里透着敏锐和坚定
        timbre: 清晰浑厚的成年男声
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 后院里的客人
      blocks:
        - id: ch01-b01
          speaker: ugly_respectable
          text: 能……介……绍……家……好……旅……馆……吗？
        - id: ch01-b02
          speaker: narrator
          text: 向杰拉尔德问话的东西，脑袋里面根本是空的。这一点，他有再充分不过的理由知道。它那件外套里没有肩膀，只有讲究的太太们挂衣服用的木横架。举起来询问的也不是手，只是一只塞满手帕、鼓得疙疙瘩瘩的手套。连着它的胳膊，则是凯瑟琳上学用的雨伞。可这样一个由衣服和杂物凑成的东西偏偏活了，还很认真地问起一家好旅馆。换成任何一个真正有血有肉的人，这个问题都十分合理。
        - id: ch01-b03
          speaker: narrator
          text: 杰拉尔德心里直往下沉。他知道，要挺身应付眼前的局面，现在是唯一的机会，再也不会有别的时候。可一想到自己必须挺起来，他的心反而比刚才沉得更深，仿佛连最小的一点勇气也提不起来。
        - id: ch01-b04
          speaker: gerald
          text: 对不起，您刚才说什么？
        - id: ch01-b05
          speaker: narrator
          text: 那张画出来的尖纸脸转向他，又含含混混地重复了一遍。
        - id: ch01-b06
          speaker: ugly_respectable
          text: 能……介……绍……家……好……旅……馆……吗？
        - id: ch01-b07
          speaker: gerald
          text: 您是想找旅馆？一家好旅馆？
        - id: ch01-b08
          speaker: ugly_respectable
          text: 家……好……旅……馆。
        - id: ch01-b09
          speaker: gerald
          text: 实在抱歉。我们这里的旅馆关门很早，大概八点就全关了。
        - id: ch01-b10
          speaker: narrator
          text: 无论出了什么事，人总还能讲礼貌，而杰拉尔德天生就很会讲礼貌。
        - id: ch01-b11
          speaker: ugly_respectable
          text: 敲……们……门。
        - id: ch01-b12
          speaker: narrator
          text: 这回不用再问，杰拉尔德便听懂了，它是说敲门叫醒他们。直到今天，他也不明白，那件由帽子、外套、纸脸和软手匆忙拼成的恶作剧，为什么只是活了过来，就立刻显得体体面面。它大约五十岁，在自家郊区显然人人认识、人人敬重，正是那种坐头等车厢、抽昂贵雪茄的人。
        - id: ch01-b13
          speaker: gerald
          text: 那可不行。镇上开旅馆的人全是聋子，这是郡议会的规定，只有聋人才准开旅馆。因为啤酒里有啤酒花，您知道，啤酒花治耳朵疼特别好。
        - id: ch01-b14
          speaker: ugly_respectable
          text: 没……太……听……懂。
        - id: ch01-b15
          speaker: gerald
          text: 一开始是有点难明白。
        - id: ch01-b16
          speaker: narrator
          text: 其余丑八怪也围了过来。杰拉尔德已经越来越会听懂这些嘴里没有上腭的人说的话。戴宽边软帽的女士挤到近前，客客气气地提出另一个办法。既然好旅馆实在找不到，那么有个普通住处也可以将就。
        - id: ch01-b17
          speaker: ugly_bonnet
          text: 旅馆不行，住处也可以。
        - id: ch01-b18
          speaker: narrator
          text: 一句“我栖身冰冷的地上”忽然自己跑进杰拉尔德耳朵里唱起来。这句歌来得既不是时候，看起来也毫无用处。可他猛地收住念头。且慢，难道它真的一点用也没有？也许他真知道一个能安顿它们的地方。
        - id: ch01-b19
          speaker: gerald
          text: 我倒知道一个住处，可是……
        - id: ch01-b20
          speaker: narrator
          text: 最高的丑八怪挤上前来。它穿着学校衣帽架上常年挂着的旧棕外套，还戴着高礼帽。那套衣帽本是专门吓唬窃贼的，好让他们以为这家有位男主人，而且此刻就在家。这个丑八怪比头一个更爱运动，也没那么矜持。谁都看得出，它不算十足的绅士。
        - id: ch01-b21
          speaker: ugly_tall
          text: 我……想……知……
        - id: ch01-b22
          speaker: narrator
          text: 戴花环帽的女士没等它讲完便打断了。她说话比其余几个清楚，杰拉尔德后来才弄明白原因。画她的嘴时，开口处那片纸被割开，又向里折了进去。这样一来，她嘴里还真有了近似上腭的东西，尽管那上腭也不过是纸做的。
        - id: ch01-b23
          speaker: ugly_wreathed
          text: 我只想知道，我们叫的马车都去哪儿了？
        - id: ch01-b24
          speaker: gerald
          text: 我也不知道，不过我会查清楚。演出已经结束了，人家正等着关屋熄灯。我们还是动身吧。
        - id: ch01-b25
          speaker: ugly_respectable
          text: 正……正……好。
        - id: ch01-b26
          speaker: narrator
          text: 体面的丑八怪朝前门迈去，戴花环帽的女士则叫杰拉尔德同行。她那两片朱红纸嘴唇甚至弯出了一个微笑。
        - id: ch01-b27
          speaker: ugly_wreathed
          text: 您……也……来。
        - id: ch01-b28
          speaker: gerald
          text: 我当然乐意帮忙。事情总爱在人毫无准备时突然发生。各位只要肯在后院等几分钟，我就陪你们去找住处。那后院相当高级，可不是普通院子。水泵刚从上到下漆成绿色，垃圾箱还是搪瓷铁的。
        - id: ch01-b29
          speaker: narrator
          text: 听见“后院”时，一阵惊讶和鄙夷从一张张白纸脸上掠过。杰拉尔德慌忙把绿色水泵和搪瓷垃圾箱说了出来。丑八怪们转向彼此，认真商量了一阵，似乎认定这两样东西确实足以让一个后院变得很不寻常，值得在那里等一等。
        - id: ch01-b30
          speaker: gerald
          text: 请各位等候，我实在过意不去。可我有个叔叔疯得厉害，九点半非得由我喂他喝粥。他不肯吃别人手里的东西。
        - id: ch01-b31
          speaker: narrator
          text: 杰拉尔德已经不管自己在说什么了。照理说，世上只有丑八怪可以随便骗。它们全是衣服，里面空空的，既不算人，也不算真正的生物，只是一种真实得出奇的幻象。因此，它们虽然看起来会相信谎话，其实根本不可能真的受到欺骗。
        - id: ch01-b32
          speaker: narrator
          text: 他领着它们穿过那扇嵌着蓝、黄、红、绿四色玻璃的后门，沿铁台阶下到院里。七个丑八怪排成一队跟在身后。脚上套着靴子的还走得过去，那些脚只是一截扫帚柄或一把雨伞的家伙，面对一阶阶镂空的铁格子，就走得狼狈极了。
        - id: ch01-b33
          speaker: gerald
          text: 请在阳台底下稍等，好吗？我叔叔疯得非常厉害。要是让他看见陌生人，哪怕是身份高贵的陌生人，我也不敢担保会发生什么。
        - id: ch01-b34
          speaker: ugly_wreathed
          text: 也许我们还是自己去找住处吧？
        - id: ch01-b35
          speaker: narrator
          text: 戴花帽的女士听起来有些不安。杰拉尔德却尽量让自己的口气变得阴森。
        - id: ch01-b36
          speaker: gerald
          text: 千万别去。这里的警察会逮捕所有外乡人，是自由党刚通过的新法令。到时候给你们安排的住处，准不是你们想住的那种。一想到各位被关进监狱地牢，我就受不了。
        - id: ch01-b37
          speaker: ugly_respectable
          text: 我……有……证……件。这种情形，简直不像话。
        - id: ch01-b38
          speaker: narrator
          text: 它们总算在铁阳台底下排好了。杰拉尔德最后望了一眼，心底暗暗奇怪自己为什么不怕，心头表面那一层却还在庆幸自己如此勇敢。那些东西确实很吓人。在院里的光线下，谁也很难相信，它们不过是衣服、枕头和木棍，肚子里什么都没有。
        - id: ch01-b39
          speaker: narrator
          text: 他转身走上台阶，听见身后的丑八怪互相交谈。那种奇怪语言里满是“呜”和“啊”，可他已经能够分辨意思。他好像听见体面的那个夸自己是个很有绅士风度的小伙子。戴花环帽的女士随即用十分热烈的语气表示赞同。
        - id: ch01-b40
          speaker: ugly_respectable
          text: 多……有……绅……士……风……度……的……小……伙……子。
        - id: ch01-b41
          speaker: ugly_wreathed
          text: 一点不错。
        - id: ch01-b42
          speaker: narrator
          text: 彩色玻璃门关上了。门后是住着七个不可能生物的院子，门前则是住着五个活人的寂静房屋。那五个人已经怕到了活人所能怕的极点。你若觉得丑八怪没什么可怕，只是因为你从没亲眼见过一个活起来。找来父亲不穿的旧衣服和没戴的帽子，再用一两个长枕、画出来的纸脸、几根木棍和一双靴子凑出一个。然后借他的许愿戒指把它变活，用完再把戒指还给他。到了那时，你就会明白自己是什么滋味。
        - id: ch01-b43
          speaker: narrator
          text: 杰拉尔德不怕，当然是因为戒指戴在手上。你已经见过，戒指的主人什么都不怕，除非亲手碰到那个可怕的东西。可他很明白屋里的人是什么滋味，便停在门厅里想了想。要是自己也吓成那样，听见什么话，才会最安心呢？
        - id: ch01-b44
          speaker: gerald
          text: 凯茜！吉米，嗨！梅布尔，听见没有？
        - id: ch01-b45
          speaker: narrator
          text: 他喊得响亮又快活，仿佛刚才什么也没发生，可连自己都觉得那声音假得厉害。寂静的屋子里先是没有回应，接着，餐厅门才极其小心地打开一条窄缝。
        - id: ch01-b46
          speaker: gerald
          text: 可真好玩！你们干吗一直关着门？小心，我要推了。
        - id: ch01-b47
          speaker: kathleen
          text: 只有你一个人吗？
          emotion: fearful
        - id: ch01-b48
          speaker: gerald
          text: 当然。别犯傻！
        - id: ch01-b49
          speaker: narrator
          text: 门终于完全打开，露出三张惊惶失色的脸。三张脸后面，是那些东倒西歪的椅子。不久之前，七个奇怪的观众还端坐在那里，现在却全都不见了。
        - id: ch01-b50
          speakers: [kathleen, jimmy, princess]
          ensemble: chorus
          text: 它们呢？你把愿望收回了吗？我们听见它们说话了，太可怕了！
          emotion: fearful
        - id: ch01-b51
          speaker: gerald
          text: 它们都在后院。实在太有趣了，跟真人一样，又和气又快活。别让法国女教师和伊莱扎知道，我会把她们哄过去。凯瑟琳和吉米先睡觉，我送梅布尔回家。出门以后，我再替丑八怪找个过夜的地方。真希望你们都能来。
        - id: ch01-b52
          speaker: kathleen
          text: 你说这叫有趣？
        - id: ch01-b53
          speaker: gerald
          text: 有趣得不得了。等会儿听我怎么跟她们说，你们一定要全力帮腔。
        - id: ch01-b54
          speaker: princess
          text: 你不会一出门就把我扔下，自己跟那些怪物走吧？它们看着像恶鬼。
          emotion: fearful
        - id: ch01-b55
          speaker: gerald
          text: 等你走近看看，就会发现它们很普通。头一个还请我介绍好旅馆呢。刚开始我没听懂，因为它嘴里根本没有上腭。
        - id: ch01-b56
          speaker: narrator
          text: 话一出口，杰拉尔德就知道坏了。梅布尔和凯瑟琳一直拉着手，看那样子，片刻之前她们还曾在极度恐惧中死死抱住对方。这会儿，两只手又紧紧攥住了。吉米坐在原来舞台的边沿，靴子一下下踢着粉红床罩，也打了个明显的寒战。
        - id: ch01-b57
          speaker: gerald
          text: 没上腭也不要紧，很快就能听懂。我离开时，还听见它们夸我是个有绅士风度的小伙子。要真是恶鬼，哪会留意这种小事？
        - id: ch01-b58
          speaker: princess
          text: 它们怎么夸你都没用。你要是不送我回家，就一点绅士风度也没有。你到底送不送？
        - id: ch01-b59
          speaker: gerald
          text: 当然送。咱们一定会玩得痛快。现在先去找法国女教师。
        - id: ch01-b60
          speaker: narrator
          text: 杰拉尔德一边说一边穿好外套，随即跑上楼。留在门厅的人听见他用那种轻松快活、仿佛什么异常都没发生的口气敲响法国女教师的房门。他先安慰她说，来人只是杰拉尔德。门开以后，两人低声商议了一阵。接着，他陪法国女教师来到伊莱扎门外，又是一番好言相劝。伊莱扎把恐惧说得又直白又滔滔不绝，他倒很圆滑地全劝住了。
        - id: ch01-b61
          speaker: jimmy
          text: 不知道他在编什么谎话骗她们。
        - id: ch01-b62
          speaker: princess
          text: 那不叫撒谎。他只是把适合让她们知道的那部分真相说出来。
        - id: ch01-b63
          speaker: jimmy
          text: 你要是个男人，准会当个讨厌的耶稣会士，还会躲进烟囱里。
        - id: ch01-b64
          speaker: princess
          text: 我要只是个男孩，才不会被一堆旧外套吓得魂都没了。
        - id: ch01-b65
          speaker: gerald
          text: 真对不起，吓着您了。我们没想到您会害怕。不过，那把戏很不错，对不对？
        - id: ch01-b66
          speaker: jimmy
          text: 听见了吧？他告诉她，那是我们的把戏。
        - id: ch01-b67
          speaker: princess
          text: 本来就是我们的把戏。
        - id: ch01-b68
          speaker: mademoiselle
          text: 那个把戏确实精彩极了。可是，你们怎么让那些假人动起来的？
        - id: ch01-b69
          speaker: gerald
          text: 我们以前常拿细绳拉着它们动。
        - id: ch01-b70
          speaker: kathleen
          text: 这句也是真话。
        - id: ch01-b71
          speaker: mademoiselle
          text: 那就再让我们看看这个了不起的把戏吧。
        - id: ch01-b72
          speaker: gerald
          text: 可我已经全清出去了。我们很抱歉吓着了您，还以为您一定不想再看见它们。
        - id: ch01-b73
          speaker: kathleen
          text: 他的确清出去了。
        - id: ch01-b74
          speaker: narrator
          text: 法国女教师来到楼梯最下面的垫子上，从门口探头望进乱糟糟的餐厅。那些奇怪人影果然都不见了。她立刻放下心来，声音也重新变得快活。
        - id: ch01-b75
          speaker: mademoiselle
          text: 那么，我们去吃晚饭，一边谈谈你们那出美丽的戏，好吗？
        - id: ch01-b76
          speaker: narrator
          text: 杰拉尔德详细说明，弟弟妹妹会多么喜欢留下来吃晚饭、谈演出。至于他，法国女教师也一定看得出，护送梅布尔回家是他不可推卸的责任。法国女教师虽好心留梅布尔过夜，可她姨妈对外甥女怀着近乎疯狂、焦灼万分的疼爱，绝不可能答应。想让伊莱扎代送也没用，因为夜里没有男朋友陪着，伊莱扎自己就会害怕。
        - id: ch01-b77
          speaker: narrator
          text: 这套说辞终于把事情安排妥当。梅布尔戴好自己的帽子，又披上一件不属于她的斗篷。众人送到门口，说了许多亲切的告别话，还约好明天再见。随后，她跟杰拉尔德一起从前门走了出去。
    - id: ch02
      title: 月光下的队伍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 前门刚关上，杰拉尔德便抓住梅布尔的胳膊，快步带她走到通往后院的侧街。拐过街角，他停住了。
        - id: ch02-b02
          speaker: gerald
          text: 我只问你一件事。你到底是不是傻瓜？
        - id: ch02-b03
          speaker: princess
          text: 你才是傻瓜！
        - id: ch02-b04
          speaker: narrator
          text: 梅布尔不过顺口还嘴，因为她已经看出杰拉尔德十分认真。
        - id: ch02-b05
          speaker: gerald
          text: 我可不怕丑八怪，它们跟驯服的兔子一样无害。可傻瓜也许会害怕，一怕就把整件事搞砸。你要真是傻瓜，现在就说。我回去告诉大家，你不敢走夜路，再替你通知姨妈，说你留下了。
        - id: ch02-b06
          speaker: princess
          text: 我不是傻瓜，也什么都不怕。
        - id: ch02-b07
          speaker: narrator
          text: 可她一边说，一边用真正吓破了胆的人才有的眼神四下乱看。嘴上那份勇敢，跟她眼睛里的惊慌，实在不是同一回事。
        - id: ch02-b08
          speaker: gerald
          text: 我准备让你分担我的困难和危险。哪怕是亲弟弟，我也不会给他这种机会。你要坏了我的事，我以后再也不跟你说话，也不许别人理你。
        - id: ch02-b09
          speaker: princess
          text: 你真坏！我不用别人威胁，也一样勇敢。我本来就勇敢。
        - id: ch02-b10
          speaker: narrator
          text: 杰拉尔德听出该换一种腔调了，便压低声音，讲得激动人心。
        - id: ch02-b11
          speaker: gerald
          text: 梅布尔，我知道你勇敢。我信任你，才会这样安排。你这身黑白衣裳底下，一定藏着狮子般的心。我能信你到最后吗？
        - id: ch02-b12
          speaker: narrator
          text: 梅布尔觉得，这个时候无论说什么，只要不是答应，就会白白丢掉自己那份无价的勇敢名声。这样的损失，她怎么也承受不起。
        - id: ch02-b13
          speaker: princess
          text: 能。
        - id: ch02-b14
          speaker: gerald
          text: 那就在路灯旁等着。看见我领它们过来，要记住，它们像毒蛇一样无害——不对，我是说像鸽子。把它们当普通人说话，明白吗？
        - id: ch02-b15
          speaker: narrator
          text: 他正要离开，梅布尔问了一个再自然不过的问题。
        - id: ch02-b16
          speaker: princess
          text: 你到底要带它们去哪家旅馆？
        - id: ch02-b17
          speaker: gerald
          text: 哎呀，我的老天！瞧，你已经帮上忙了。我全忘了。城堡庄园里有没有门房小屋之类的地方，能让它们住一夜？魔法迟早会像隐身术一样解除。到时候它们又是一堆外套和杂物，我们随时都能搬回来。
        - id: ch02-b18
          speaker: princess
          text: 那里有一条秘密通道……
        - id: ch02-b19
          speaker: narrator
          text: 梅布尔的话还没说完，后院门忽然打开。一个丑八怪把尖尖的纸脑袋探出来，焦急地朝街道两头张望，显然已经等得不耐烦了。
        - id: ch02-b20
          speaker: gerald
          text: 来啦！
        - id: ch02-b21
          speaker: narrator
          text: 杰拉尔德跑去迎接。梅布尔则得用尽全力，才能不带着完全相反的打算，朝完全相反的方向逃走。她能做的只有留在原地，可她真的做到了。此后只要想起那夜，她就会为自己骄傲。为了不惊动那个近在咫尺、疯得无可救药的叔叔，七个丑八怪处处小心，组成一支阴森森的队伍，从后院门鱼贯而出。
        - id: ch02-b22
          speaker: ugly_bonnet
          text: 亲爱的，踮起脚尖走。
        - id: ch02-b23
          speaker: narrator
          text: 她提醒戴花环帽的女士。杰拉尔德却忍不住想，那位女士一只脚是高尔夫球杆头，另一只脚是曲棍球杆头，到底该怎么踮脚。
        - id: ch02-b24
          speaker: narrator
          text: 梅布尔退到街角的灯柱旁，觉得这并不丢脸。可一到那里，她便强迫自己停住。究竟费了多大力气，只有她自己知道。想想看吧，她得稳稳地站着，一声不出，等那些肚子空空、根本不该存在的东西走到面前。有的用短粗的脚在石路上咔嗒作响，戴花帽的女士却被一条垂地长裙无声托着，而梅布尔很清楚，裙子里根本没有身体。
        - id: ch02-b25
          speaker: princess
          text: 它们不是真的，不可能是真的。这只是一场梦。它们不是真的，不可能。
          emotion: fearful
        - id: ch02-b26
          speaker: narrator
          text: 她一动不动地站着，手掌里面渐渐又冷又湿。那几句话在心里说了一遍又一遍。接着杰拉尔德终于来到灯下，七个丑八怪也一起围了上来。
        - id: ch02-b27
          speaker: gerald
          text: 这位是我们的朋友梅布尔，就是戏里的公主。拿出男子汉气概来！
        - id: ch02-b28
          speaker: narrator
          text: 最后一句只让梅布尔一个人听见。她全身的神经都绷得像班卓琴弦。那可怕的一瞬，她不知道自己究竟能不能拿出所谓的男子汉气概，还是会变成一个尖叫着逃跑的小疯姑娘。就在这时，体面的丑八怪伸出软塌塌的手，握住她的手摇了摇。
        - id: ch02-b29
          speaker: princess
          text: 它不可能是真的。
          emotion: fearful
        - id: ch02-b30
          speaker: narrator
          text: 梅布尔只能在心里这样安慰自己。可戴玫瑰花环的女士已经靠近，用那条雨伞做的胳膊挽住她。雨伞末端，塞得软软的手套亲密地贴上她的手臂。
        - id: ch02-b31
          speaker: ugly_wreathed
          text: 你这个又聪明又可爱的小东西！快陪我一起走吧！
        - id: ch02-b32
          speaker: narrator
          text: 她的语气热情又娇柔，话里几乎没有辅音。于是这群人沿大街走去，仿佛丑八怪也不过是些寻常旅客。
        - id: ch02-b33
          speaker: narrator
          text: 这支队伍说不出的古怪。不过利德尔斯比的人睡得早，而这里的警察和多数地方的警察一样，都穿着隔一英里也能听见的靴子。只要那种靴声传来，杰拉尔德还有足够时间折回去，把警察引向别处。他听见梅布尔礼貌回答那些和善丑八怪更加客气的怪话，不禁为她的勇气脸上一热。他不知道，她离那声会葬送全盘计划的尖叫，只差细细一线。只要她叫出声，警察和附近居民都会赶来，所有人就全完了。
        - id: ch02-b34
          speaker: narrator
          text: 路上只遇见一个人。那人猛地停住，嘟囔了一句，赶紧穿到马路对面。
        - id: ch02-b35
          speaker: passerby
          text: 盖伊·福克斯，老天作证！
          emotion: surprised
        - id: ch02-b36
          speaker: narrator
          text: 第二天，他把这事讲给妻子听。妻子不信，还说那是他遭了报应。这话实在毫无道理。
        - id: ch02-b37
          speaker: narrator
          text: 梅布尔觉得，自己像是掉进一场每个细节都安排得周周全全的噩梦。可杰拉尔德也在梦里，就是那个问她是不是傻瓜的杰拉尔德。好吧，她不是傻瓜，尽管她觉得自己再走一会儿，很快就会变成一个。她仍旧答着那些不可能存在的人所说的、只有元音的客气话。姨妈常常抱怨“不可能相处的人”，现在梅布尔总算亲眼知道那是什么样子了。
        - id: ch02-b38
          speaker: narrator
          text: 夏日的暮色一点点融化，变成了夏夜月光。丑八怪落在白路上的影子被拉得扭曲怪异，竟比它们比较实在的本身还要吓人。梅布尔一度希望这干脆是个漆黑的夜晚，却马上打了个寒战，急忙把这个愿望收了回去。
        - id: ch02-b39
          speaker: narrator
          text: 戴高礼帽的丑八怪一路仔细盘问，问杰拉尔德在哪所学校念书，爱做哪些运动，平日怎样消遣，将来又有什么志向。他一边应付，一边琢磨魔法会持续多久。戒指似乎凡事都按七来办。这些东西会活七小时、十四小时，还是二十一小时？他的脑子在错综复杂的七的乘法表里迷了路。那张表平常就够叫人头疼了。直到整支队伍来到城堡庄园门口，他才猛然回过神。
        - id: ch02-b40
          speaker: narrator
          text: 大门果然锁着。丑八怪们用那些不可思议的手徒劳地摇着铁门。
        - id: ch02-b41
          speaker: gerald
          text: 时间太晚了。还有另一条路，不过得从一个洞里爬进去。
        - id: ch02-b42
          speaker: ugly_respectable
          text: 可几位女士……
        - id: ch02-b43
          speakers: [ugly_bonnet, ugly_wreathed]
          ensemble: duo
          text: 我们最喜欢冒险了！
        - id: ch02-b44
          speaker: ugly_wreathed
          text: 刺激得简直要命。
        - id: ch02-b45
          speaker: narrator
          text: 他们沿大路绕到那个洞口。月光总爱把最熟悉的东西变得认不出来，那洞找了好一会儿才找到。杰拉尔德提着丑八怪们走出后院时顺手拿来的自行车灯，首先钻进去，畏缩的梅布尔跟在后面。丑八怪一个个爬过洞口，木头四肢撞着石头，发出空洞的咔啦声。它们嘴里又冒出一连串奇怪元音，有的表达众人的惊叹，有的表示男士的勇气，还有的泄露女士的紧张。整支队伍跟着灯光，穿过垂满蕨草的狭沟，又从拱门底下钻了过去。
        - id: ch02-b46
          speakers: [ugly_respectable, ugly_bonnet, ugly_wreathed]
          ensemble: chorus
          text: 啊！
          emotion: surprised
        - id: ch02-b47
          speaker: narrator
          text: 月光下的意大利花园美得像中了魔法，好几张纸嘴都发出听得懂的赞叹。
        - id: ch02-b48
          speaker: ugly_respectable
          text: 这地方一定很有名，值得游览。老天在上，先生，一点不错！
        - id: ch02-b49
          speaker: narrator
          text: 大理石露台和刻意修得蜿蜒的碎石小径，从没听过如此古怪的脚步。那些平整、灰白、挂着露珠的草坪，就算已经见过许多魔法，也没承受过这般狂乱而难以置信的影子。杰拉尔德心里想着类似的话。确切地说，他真正想的是，就算在这座魔法花园里，恐怕也从没闹过这么大的乱子。
        - id: ch02-b50
          speaker: narrator
          text: 这时，赫耳墨斯雕像突然从底座跳下，像赶着去看街头打架的男孩一样，带着活泼旺盛的好奇心兴冲冲跑来。他绕着队伍打转，凑近端详每一张毫无察觉的纸脸。杰拉尔德马上发现，只有自己看得见那道逼近的白色身影，也立刻明白是戒指的力量。他摘下戒指，赫耳墨斯果然回到底座上，静得像圣诞节堆的雪人。戒指一戴回去，活生生的赫耳墨斯又在队伍旁边打转。
        - id: ch02-b51
          speaker: ugly_tall
          text: 这家旅馆很高级，园子也布置得相当有品位。
        - id: ch02-b52
          speaker: princess
          text: 我们得走后门，前门九点半就锁了。
        - id: ch02-b53
          speaker: narrator
          text: 一个戴黄蓝板球帽的矮胖丑八怪，此前几乎没开过口。这时它咕哝着说起荒唐的冒险，还觉得自己仿佛重新年轻了。
        - id: ch02-b54
          speaker: ugly_cricket
          text: 这场冒险可真荒唐，倒叫我又有了年轻时的感觉。
        - id: ch02-b55
          speaker: narrator
          text: 他们绕过大理石镶边的水池。金鱼在水里游动，鳞光一闪一闪，那头史前巨兽也曾走下来，在这里洗澡喝水。月光落在池面，水花像无数白钻一样明灭。整支队伍里，依然只有杰拉尔德看得见，那头身披厚重鳞甲的巨蜥此刻就在睡莲叶间翻滚打转。
        - id: ch02-b56
          speaker: narrator
          text: 一行人匆匆登上花神殿的台阶。神殿背面没有优雅的拱门向天空敞开，而是紧贴着一座陡峭得几乎像悬崖的小山。花园里正是这些小山让景色有了起伏变化。梅布尔绕到女神像后摸索几下，自行车灯像探照灯一样扫过去，照出一扇又高又窄的门。那块石头既是门扉，也严严实实封着门洞。梅布尔手指一碰，它便缓缓转开。
        - id: ch02-b57
          speaker: princess
          text: 从这里走。
        - id: ch02-b58
          speaker: narrator
          text: 她气息急促，后颈冷得起了一层鸡皮疙瘩。
        - id: ch02-b59
          speaker: ugly_respectable
          text: 小伙子，你提着灯走在前面。
        - id: ch02-b60
          speaker: gerald
          text: 我得留在最后关门。
        - id: ch02-b61
          speaker: ugly_wreathed
          text: 公主会关门，我们也能帮她。
        - id: ch02-b62
          speaker: narrator
          text: 杰拉尔德觉得她热心得可怕，便温和而坚决地说，确保石门关好是自己的责任。
        - id: ch02-b63
          speaker: gerald
          text: 各位肯定也不愿意看我惹上麻烦。
        - id: ch02-b64
          speaker: narrator
          text: 丑八怪们最后一次表现得和善又通情达理。它们一致同意，世上一切不幸之中，最让它们不愿看到的事情，就是这个彬彬有礼的男孩因为没关好门而遇上麻烦。
        - id: ch02-b65
          speaker: gerald
          text: 灯给您，您天生就该带队。一直往前走。梅布尔，里面有台阶吗？
        - id: ch02-b66
          speaker: princess
          text: 很远以后才有。通道长得没完，接着会拐弯。
        - id: ch02-b67
          speaker: ugly_small
          text: 说悄悄话可没礼貌。
        - id: ch02-b68
          speaker: ugly_wreathed
          text: 他本来就没教养，别理他。完全是个白手起家的暴发户。
        - id: ch02-b69
          speaker: narrator
          text: 她用软得瘆人的胳膊亲密地挤了挤梅布尔。体面的丑八怪提灯领路，其余几个满心信赖地跟上，一个接一个消失在狭窄的门洞里。杰拉尔德和梅布尔站在外面，连呼吸都怕拖慢它们。眼看最后一个身影也进去了，两人几乎要如释重负地哭出来。
    - id: ch03
      title: 石门后的怒吼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 事实证明，这口气松得太早了。通道里突然响起一阵奔跑、冲撞和扭打声。两个孩子正推着石门合拢，丑八怪们却猛力往外顶。也许黑暗里有什么东西吓着了它们，也许它们空空的脑袋终于觉得这里不可能是体面旅馆的后门，又也许一个突然降临、无法抗拒的本能告诉它们上了当。真正的原因，梅布尔和杰拉尔德永远也没弄清。
        - id: ch03-b02
          speakers: [ugly_respectable, ugly_tall, ugly_wreathed, ugly_small]
          ensemble: chorus
          text: 不！我们不往前走！让那个男孩带路！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 梦一样安静的完美夜色，被“不”和“我们不走”的喊声撕破了。丑八怪已经不再和气平常，一股凶狠的变化攫住了它们。女士们尖声叫喊，被激怒的强壮丑八怪沙哑而坚决地怒吼。最糟的是，那扇几乎已经在整群怪物身后合拢的沉重石门，正被它们稳稳推开。门缝里黑影翻滚，背后亮着自行车灯。一只填满东西的手绕过门边，木棍做骨头的胳膊也愤怒地伸向外面的世界。石门一关，它们就会永远和那个世界隔绝。
        - id: ch03-b04
          speaker: narrator
          text: 没有辅音的话音不再温和，也不再像普通人的交谈。它只剩下威胁，预告着种种叫人无法承受的恐怖。一只软软填起的手突然落在杰拉尔德胳膊上。刹那间，他先前只在想象里知道的恐惧，全变成了切身的恐惧。他像溺水的人在一道闪光里看尽自己的一生那样，猛然看清自己刚才要求梅布尔承受了什么，而她又真的为他做到了什么。
        - id: ch03-b05
          speaker: gerald
          text: 推！拼命推！
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: 他把脚后跟抵住花神像基座，用尽全力顶住石门。梅布尔也想照做，可她的腿太短。
        - id: ch03-b07
          speaker: princess
          text: 我推不动了，真的推不动了！
          emotion: fearful
        - id: ch03-b08
          speaker: gerald
          text: 绝不能让它们出来！
          emotion: fearful
        - id: ch03-b09
          speakers: [ugly_respectable, ugly_tall, ugly_wreathed, ugly_small]
          ensemble: chorus
          text: 等我们出来，你们就知道了！
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 愤怒和没有上腭本该把这句话搅得谁也听不懂，可在那无法言说的时刻，狂烈的恐惧把两个孩子的耳朵磨得异常敏锐。
        - id: ch03-b11
          speaker: bailiff
          text: 那边出了什么事？
        - id: ch03-b12
          speaker: narrator
          text: 一个辅音齐全、清楚响亮的声音突然传来，听着叫人安心。花神殿的大理石地上，多了一道陌生人的影子。
        - id: ch03-b13
          speaker: gerald
          text: 快帮我们推！它们一出来，会把我们全杀掉！
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: 一副裹着棉绒布的强壮肩膀猛地挤进两个孩子中间，一个壮实男人的脚后跟也抵上女神像基座。三个人一起发力，沉重窄门终于一点点退回去，慢慢合拢。弹簧锁咔嗒一响，把那团愤怒翻涌、不断威胁的怪物关在里面，也把杰拉尔德和梅布尔关在安全的外面。这样的解脱，几乎叫人不敢相信。
        - id: ch03-b15
          speaker: narrator
          text: 梅布尔整个人扑倒在大理石地面上，一声声缓慢而沉重地哭起来。那是大事终于做成以后的哭声，也是耗尽最后一点力气后的哭声。假如我当时也在那里，一定会把脸转向别处，免得看见杰拉尔德是不是也放弃忍耐，任由自己跟她一样哭了出来。
        - id: ch03-b16
          speaker: narrator
          text: 来人看起来像猎场看守，至少杰拉尔德后来是这么判断的。他低头看着梅布尔开了口。
        - id: ch03-b17
          speaker: bailiff
          text: 好啦，别做小傻瓜。你们俩都别傻了。里面是谁？究竟出了什么事？
        - id: ch03-b18
          speaker: gerald
          text: 我绝对不能告诉您。
        - id: ch03-b19
          speaker: bailiff
          text: 可这事恐怕非弄清不可。先到月光底下，我们把局面好好梳理一遍。
        - id: ch03-b20
          speaker: narrator
          text: 世界已经颠倒成这样，杰拉尔德还有心思想，一个会说“梳理局面”这种话的猎场看守，多半有过传奇往事。同时他也明白，这样的人比伊莱扎、约翰逊，甚至法国女教师都难糊弄得多。若随口编一个不可信的说法，肯定瞒不过他。他们只有那一个真实的故事能讲，可偏偏这个唯一的故事听起来也根本摆平不了他。
        - id: ch03-b21
          speaker: narrator
          text: 杰拉尔德站起身——如果他刚才没有一直站着的话——拉住梅布尔软绵绵、已经发热的手。陌生人又握住他的手，就这样把两个孩子一起领出花神殿穹顶的阴影，来到铺满台阶的明亮白月光里。他坐下来，让孩子们一边一个，把他们各自的一只胳膊挽进自己的臂弯，又亲切而安慰地将两人贴在棉绒布衣襟旁。
        - id: ch03-b22
          speaker: bailiff
          text: 好，现在讲吧。
        - id: ch03-b23
          speaker: narrator
          text: 梅布尔一句话也说不出来，只顾抽泣。我们当然得原谅她，她这一夜已经勇敢到了极点。我丝毫不怀疑，从圣女贞德到格蕾丝·达林，世上所有女英雄都有过终于忍不住、只能坐下来哭一场的时候。
        - id: ch03-b24
          speaker: gerald
          text: 没用。我只要编故事，您马上就能看穿。
        - id: ch03-b25
          speaker: bailiff
          text: 至少这话很恭维我的眼力。那就告诉我真相，怎么样？
        - id: ch03-b26
          speaker: gerald
          text: 就算说真话，您也不会相信。
        - id: ch03-b27
          speaker: bailiff
          text: 说来试试。
        - id: ch03-b28
          speaker: narrator
          text: 他脸刮得干干净净，月光一照，那双大眼睛便闪闪发亮。
        - id: ch03-b29
          speaker: gerald
          text: 我不能说。您会觉得我们疯了，把我们关起来。或者……唉，说了也没用。谢谢您帮忙，请让我们回家吧。
        - id: ch03-b30
          speaker: bailiff
          text: 我倒想知道，你们究竟有没有想象力。
        - id: ch03-b31
          speaker: gerald
          text: 那些东西明明是我们造出来的……
        - id: ch03-b32
          speaker: narrator
          text: 杰拉尔德火气冲冲地开口，好不容易才迟迟收住话头。
        - id: ch03-b33
          speaker: bailiff
          text: 如果“那些东西”就是刚才我帮你们关进那座坟墓的人，别忘了，我看见了，也听见了。不是我小看你们，可你们凭想象造出的东西，恐怕不会逼真到这种地步。
        - id: ch03-b34
          speaker: narrator
          text: 杰拉尔德把手肘支在膝头，双手托住下巴。
        - id: ch03-b35
          speaker: bailiff
          text: 你先定定神。我从自己的立场讲讲。你们好像没明白我有多为难。我从伦敦来到这里，替人照看一大片庄园。
        - id: ch03-b36
          speaker: gerald
          text: 我还以为您是猎场看守。
        - id: ch03-b37
          speaker: narrator
          text: 梅布尔把头靠上陌生人的肩膀，仍在抽鼻子。
        - id: ch03-b38
          speaker: princess
          text: 那您一定是乔装的英雄。
        - id: ch03-b39
          speaker: bailiff
          text: 完全不是，叫管家还更接近些。你们想想我的处境。我从伦敦来到这里，替人照管一大片庄园。来到庄园的头一个晚上，我出门吹吹月夜的风。走近一座白房子时，我听见一阵慌乱的扭打声，还有人发疯似的拼命呼救。我一时热血上头，真的出了手，把天知道是谁关到石门后面。现在我问问自己帮忙关了谁，又帮助了什么人，难道不合理吗？
        - id: ch03-b40
          speaker: gerald
          text: 相当合理。
        - id: ch03-b41
          speaker: bailiff
          text: 那么？
        - id: ch03-b42
          speaker: gerald
          text: 那么，实情是……不行。我就是不能告诉您。
        - id: ch03-b43
          speaker: bailiff
          text: 那我只好去问门里面的人。放开我，我要打开门，自己弄明白。
        - id: ch03-b44
          speaker: princess
          text: 告诉他吧。他信不信都不要紧，我们不能让他放那些东西出来。
        - id: ch03-b45
          speaker: gerald
          text: 好，我说。管家先生，请您用英国绅士的荣誉发誓。因为我一看就知道，不管是不是管家，您都是一位英国绅士。请保证不把我们接下来讲的话告诉任何人。还有，无论我们听起来多么疯，也绝不把我们送进疯人院。
        - id: ch03-b46
          speaker: bailiff
          text: 好，我想这可以答应。不过，如果你们只是在玩打仗，把另一边的人塞进洞里，还是放他们出来比较好。他们一定吓坏了。说到底，那些人也只是孩子吧？
        - id: ch03-b47
          speaker: gerald
          text: 听完您就知道了。它们才不是孩子，差得远呢！我是只讲它们，还是从头开始？
        - id: ch03-b48
          speaker: bailiff
          text: 当然从头开始。
    - id: ch04
      title: 管家听见的真相
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 梅布尔从管家的棉绒布肩头抬起脑袋。
        - id: ch04-b02
          speaker: princess
          text: 那就让我开头。我找到一枚戒指，闹着说它能让我隐身，结果我真的消失了二十一小时。戒指从哪儿来，不用管。现在该你了，杰拉尔德。
        - id: ch04-b03
          speaker: narrator
          text: 杰拉尔德接着讲了下去，而且讲了很长时间，因为这的确是个讲起来精彩极了的故事。他从梅布尔第一次隐身讲起，又讲自己怎样戴上戒指，看见月光里的雕像得到生命。他说到伊莱扎消失，还说到今夜的演出。最后，他讲清梅布尔怎样无意中许愿，让七个由旧衣服、枕头、木棍和纸脸做成的假观众一齐活了过来。
        - id: ch04-b04
          speaker: gerald
          text: 最后，我们把它们骗进了石门。等七小时、十四小时、二十一小时，反正某个带七的时间一到，它们会重新变成旧外套。戒指以前的魔法也总按七小时变化。这些家伙是九点半活过来的，我猜再过七小时，也就是四点半，魔法就会停。到时候门后只剩衣服、枕头和木棍。现在能让我们回家了吗？
        - id: ch04-b05
          speaker: bailiff
          text: 我送你们回去。来，走吧。
        - id: ch04-b06
          speaker: narrator
          text: 管家忽然换上一种全新的语气，温柔得简直叫人恼火。杰拉尔德一听便明白，这人把他们当成了受惊过度、需要哄回家的孩子。
        - id: ch04-b07
          speaker: gerald
          text: 您根本不相信。那也难怪，谁都不可能相信。不过我真想的话，能让您相信。
        - id: ch04-b08
          speaker: narrator
          text: 三个人一起站起来。管家没有马上说话，只是直直盯着杰拉尔德的眼睛，像是在判断这个男孩神志是否清醒。杰拉尔德看懂了那道目光，先回答了他没说出口的疑问。
        - id: ch04-b09
          speaker: gerald
          text: 我看起来不像疯了，对不对？
        - id: ch04-b10
          speaker: bailiff
          text: 你没疯。可你是个聪明得出奇的孩子。有没有可能，你正要发烧或者生病？
        - id: ch04-b11
          speaker: gerald
          text: 那凯茜、吉米、法国女教师和伊莱扎呢？还有那个看见队伍、吓得直喊盖伊·福克斯的人。再说您自己，明明看见它们动，也听见它们叫。难道你们全病了？
        - id: ch04-b12
          speaker: bailiff
          text: 我没有。至少除了非弄清真相不可，没别的毛病。来吧，我送你们回去。
        - id: ch04-b13
          speaker: gerald
          text: 梅布尔住在雅尔丁塔楼。
        - id: ch04-b14
          speaker: princess
          text: 我跟雅尔丁勋爵没有亲戚关系，只是女管家的外甥女。
        - id: ch04-b15
          speaker: narrator
          text: 管家拐上通往庄园大门的宽阔车道。梅布尔一路都紧紧握着他的手。到了仆人出入的小门，她才终于放开，又仰起脸，让这位刚刚救过自己的陌生人亲了一下。随后，她独自走进门去。
        - id: ch04-b16
          speaker: bailiff
          text: 可怜的小东西！
        - id: ch04-b17
          speaker: narrator
          text: 梅布尔进门以后，管家又陪杰拉尔德沿宽阔车道往庄园外走。两人穿过大门，继续走回利德尔斯比。他一直把男孩送到学校门口，才准备告辞。
        - id: ch04-b18
          speaker: gerald
          text: 我知道您接下来要做什么。您会回去试着打开那扇门。
        - id: ch04-b19
          speaker: bailiff
          text: 真有眼力！
        - id: ch04-b20
          speaker: gerald
          text: 请别开。至少要等到白天，还得让我们在场。我们十点能赶到。
        - id: ch04-b21
          speaker: bailiff
          text: 好，我十点在那里见你们。老天，你们是我见过最古怪的一群孩子。
        - id: ch04-b22
          speaker: gerald
          text: 我们的确古怪。可要是您也……算了，晚安。
    - id: ch05
      title: 白昼里的花神殿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，四个孩子穿过平整的草坪，朝花神殿走去。他们一路仍在谈昨夜的冒险，也在谈梅布尔有多勇敢。事实上，整个早晨，他们说的全是这些。跟管家约好的时间明明是十点，现在却已经十二点半。伊莱扎在法国女教师支持下，坚持要他们先把昨夜留下的“烂摊子”收拾干净，而且必须收拾得彻彻底底。
        - id: ch05-b02
          speaker: kathleen
          text: 亲爱的，你是配得上维多利亚十字勋章的女英雄。真该给你立一座雕像。
        - id: ch05-b03
          speaker: gerald
          text: 雕像要是立在这里，也会活过来的。
        - id: ch05-b04
          speaker: jimmy
          text: 换成我，我才不会害怕。
        - id: ch05-b05
          speaker: gerald
          text: 白天看什么都不一样，顺眼得多。
        - id: ch05-b06
          speaker: princess
          text: 真希望他还在那里。凯茜，他实在太好了，是个十全十美的管家，还有一颗绅士的心。
        - id: ch05-b07
          speaker: jimmy
          text: 可他根本不在。我看他和那些活雕像一样，只是你做的梦。
        - id: ch05-b08
          speaker: narrator
          text: 孩子们踏着明亮阳光登上大理石台阶。昨夜就在这里，月光照着同一座神殿，恐惧曾伸出冰冷的手，牢牢抓住梅布尔和杰拉尔德的心。如今白昼中的一切都这样安静、寻常，几乎叫人不敢相信这是同一个地方。
        - id: ch05-b09
          speaker: kathleen
          text: 要不要打开门，把那些旧外套搬回去？
        - id: ch05-b10
          speaker: gerald
          text: 先听听。也许它们还没变回外套。
        - id: ch05-b11
          speaker: narrator
          text: 他们没有立刻开门，而是先把耳朵贴在石门的合页旁，屏住呼吸听里面的声音。昨夜，丑八怪们就在这扇门后尖叫、怒吼、威胁，拼命想重返外面的世界。孩子们还记得那些没有辅音的可怕声音。现在，门里却像这个甜美的早晨一样安静，连一丝动静也没有。
        - id: ch05-b12
          speaker: narrator
          text: 孩子们听了一会儿，正要转身离开，忽然看见了昨晚约好见面的管家。他就在花神像基座另一边，可并没有站在那里等他们。他仰面躺在大理石地上，一动不动，两条胳膊向外摊开。
        - id: ch05-b13
          speaker: kathleen
          text: 啊，快看！
          emotion: surprised
        - id: ch05-b14
          speaker: narrator
          text: 管家的脸泛着一种古怪的青绿色，跟昨夜月光下那张温和有神的脸完全不同。额头上裂着一道伤口，伤口两边已经发青。一点鲜血从那里缓缓淌下来，落在白色大理石上，格外醒目。
        - id: ch05-b15
          speaker: narrator
          text: 几乎在凯茜叫出声的同一刻，梅布尔也伸手指向另一处，却没有发出声音。她指着旁边一大丛叶片油亮的杜鹃花。浓密枝叶之间，一张画出来的尖纸脸正偷偷探在外面。灿烂阳光下，那张脸白得惨，红得刺眼。
        - id: ch05-b16
          speaker: narrator
          text: 四个孩子顺着梅布尔的手指一齐望过去。那张惨白又鲜红的纸脸也正望着他们。就在目光相碰的一刻，它猛地向后一缩，悄无声息地消失在层层闪亮叶片的掩护中，只剩杜鹃花丛在正午阳光下纹丝不动，四周依旧静得出奇。
