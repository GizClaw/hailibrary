cover_prompt: |-
  A wordless cover scene in an English country estate in 1907 shows three schoolchildren discovering a sleeping girl at the heart of a tall yew maze, with the white towers of an old castle rising beyond lime trees and rose gardens. The sleeping girl has a small pale freckled face, long black plaits, and a silver-starred veil over a faded pink-and-gold brocade dress and soft green embroidered petticoat, one bracelet-covered arm resting beside a sundial. A slim, brown, grey-eyed boy leans forward in wonder, while a younger boy in knickerbockers and a girl with a green hair ribbon follow the red thread that curls along the path to the stone seat. The red thread leads the eye toward the sleeping figure as the clear focal action, surrounded by sunlit roses, clipped hedges, marble terraces, and a distant lake. Use a gently elevated wide composition with the children and maze in the lower two-thirds and calm open blue sky above the castle turrets. Keep every costume, garden detail, and architectural element original, child-friendly, and faithful to an Edwardian English summer, independent of all screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
