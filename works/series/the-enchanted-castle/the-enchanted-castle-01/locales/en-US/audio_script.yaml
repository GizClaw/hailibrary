  chapters:
    - id: ch01
      title: CHAPTER I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Gerald, Jimmy, and Kathleen were three brothers and sister at school in a little town in the west of England. Gerald was never Jeremiah, whatever you may think, and Jimmy was really James. Kathleen was hardly ever Kathleen. When her brothers were pleased with her, she was Cathy, Catty, or Puss Cat. When they were not, she was Scratch Cat. The boys went to one school and Kathleen to another. They met on Saturdays and Sundays at the home of a kind maiden lady called Miss Hervey. But hers was one of those houses where play feels impossible, and even talking freely seems somehow out of place. So all three longed for the holidays. At home they could spend every day together, with Hampshire woods and fields full of things to see and do. Their cousin Betty was coming too, and they had plans.
        - id: ch01-b02
          speaker: narrator
          text: Betty's school closed first. She reached the Hampshire house before them and at once came down with measles. That meant the other three could not go home at all. Seven whole weeks at Miss Hervey's was more than they could bear, and each of them wrote home to say so. Their parents were surprised. They had always thought it delightful that dear Miss Hervey could take the children. Still, after many letters and telegrams, they arranged for the boys to stay at Kathleen's school. All the other girls and teachers had gone. Only the French governess remained.
        - id: ch01-b03
          speaker: kathleen
          text: It will still be better than Miss Hervey's. And our school isn't nearly as ugly as yours. We have tablecloths and window curtains. Your school is nothing but bare boards, desks, and ink stains.
        - id: ch01-b04
          speaker: narrator
          text: Once the boys had gone to pack, Kathleen did her best to make the rooms pretty. She filled jam jars with flowers, mostly marigolds, because the back garden offered little else. The geraniums, calceolarias, and lobelias grew in front, where the children were forbidden to pick them. After tea, Kathleen unpacked the boys' clothes. She laid each kind in a neat pile inside the painted drawers and felt wonderfully grown-up and responsible.
        - id: ch01-b05
          speaker: kathleen
          text: We need some sort of game to last through the holidays. What if we write a book?
        - id: ch01-b06
          speaker: jimmy
          text: You couldn't write one.
        - id: ch01-b07
          speaker: kathleen
          text: I didn't mean me alone. I meant all of us.
        - id: ch01-b08
          speaker: gerald
          text: Too much work.
        - id: ch01-b09
          speaker: kathleen
          text: If we wrote what schools are truly like inside, people would read it and think how clever we were.
        - id: ch01-b10
          speaker: gerald
          text: They'd be more likely to expel us. No, let's play an outdoor game. Bandits, perhaps. If we found a cave, we could store food there and eat our meals in it.
        - id: ch01-b11
          speaker: jimmy
          text: There aren't any caves. And Mademoiselle probably won't even let us go out by ourselves.
        - id: ch01-b12
          speaker: gerald
          text: We'll see about that. I'll speak to her like a father.
        - id: ch01-b13
          speaker: kathleen
          text: Looking like that?
        - id: ch01-b14
          speaker: narrator
          text: She pointed a scornful thumb at him. Gerald examined himself in the glass.
        - id: ch01-b15
          speaker: gerald
          text: It took our hero only a moment to brush his hair and clothes and wash his face and hands.
        - id: ch01-b16
          speaker: narrator
          text: He made his actions match his grand words. Soon a sleek, thin, brown boy with an interesting face knocked at the parlour door. Mademoiselle sat inside reading a yellow-covered book and wishing useless wishes. Gerald could make himself look interesting whenever he chose, which was very helpful with unfamiliar grown-ups. He opened his grey eyes wide, let the corners of his mouth droop, and put on a gentle, pleading expression.
        - id: ch01-b17
          speaker: mademoiselle
          text: Come in! Well, what is it?
        - id: ch01-b18
          speaker: gerald
          text: I hope I'm not disturbing you.
        - id: ch01-b19
          speaker: mademoiselle
          text: No. What do you want?
        - id: ch01-b20
          speaker: gerald
          text: I thought I should come and say how do you do, since you're the lady of the house.
        - id: ch01-b21
          speaker: narrator
          text: He offered her his newly washed hand, still red and damp. She took it.
        - id: ch01-b22
          speaker: mademoiselle
          text: You are a very polite little boy.
        - id: ch01-b23
          speaker: gerald
          text: Not at all. I feel so sorry for you. It must be dreadful having us to look after all holiday.
        - id: ch01-b24
          speaker: mademoiselle
          text: No, no. I am sure you will be very good children.
        - id: ch01-b25
          speaker: narrator
          text: Gerald's face promised that the children would come as close to being angels as human children possibly could.
        - id: ch01-b26
          speaker: gerald
          text: We'll try.
        - id: ch01-b27
          speaker: mademoiselle
          text: Is there anything I can do for you?
        - id: ch01-b28
          speaker: gerald
          text: Oh, no, thank you. We don't want to cause any trouble. I was thinking it might be easier for you if we spent tomorrow in the woods and took a cold dinner. Then the cook wouldn't have to bother with us.
        - id: ch01-b29
          speaker: mademoiselle
          text: How thoughtful of you.
        - id: ch01-b30
          speaker: narrator
          text: Her voice had gone cool. But Gerald's eyes had a way of smiling while his mouth stayed solemn. Mademoiselle saw the glint. She laughed, and Gerald laughed with her.
        - id: ch01-b31
          speaker: mademoiselle
          text: You little deceiver! Why not admit that you want to escape my watch instead of pretending you only want to please me?
        - id: ch01-b32
          speaker: gerald
          text: One has to be careful with grown-ups. But it isn't all pretending. We truly don't want to trouble you, and we don't want you to trouble us.
        - id: ch01-b33
          speaker: mademoiselle
          text: Do your parents allow you to spend days in the woods?
        - id: ch01-b34
          speaker: gerald
          text: Oh, yes.
        - id: ch01-b35
          speaker: narrator
          text: That answer was perfectly true.
        - id: ch01-b36
          speaker: mademoiselle
          text: Then I shall not be more of a dragon than your parents. I will warn the cook. Are you satisfied?
        - id: ch01-b37
          speaker: gerald
          text: Very! Mademoiselle, you're a dear.
        - id: ch01-b38
          speaker: mademoiselle
          text: A deer? You mean a stag?
        - id: ch01-b39
          speaker: gerald
          text: No, a darling. A first-rate darling. You won't regret it. Can we do anything for you? Wind your wool, find your spectacles, or something?
        - id: ch01-b40
          speaker: mademoiselle
          text: He thinks I am a grandmother! Go now, and do no more mischief than you must.
        - id: ch01-b41
          speaker: narrator
          text: She was laughing harder than ever when he left. Kathleen and Jimmy were waiting for him.
        - id: ch01-b42
          speakers: [kathleen, jimmy]
          ensemble: duo
          text: Well? Did she agree?
        - id: ch01-b43
          speaker: gerald
          text: Of course. I told you she would. The innocent young hero won the heart of the foreign governess, once the beauty of her humble village.
        - id: ch01-b44
          speaker: kathleen
          text: I don't believe she was ever a beauty. She's much too stern.
        - id: ch01-b45
          speaker: gerald
          text: That's because you don't know how to manage her. She wasn't stern with me.
        - id: ch01-b46
          speaker: jimmy
          text: You really are a humbug, aren't you?
        - id: ch01-b47
          speaker: gerald
          text: No, I'm a diplo-something. An ambassador sort of person. A dipsoplomatist, that's it. Anyway, tomorrow is ours, and if we don't find a cave, my name isn't Jack Robinson.
        - id: ch01-b48
          speaker: narrator
          text: At supper Mademoiselle seemed less stern than Kathleen had ever known her. The meal was bread spread with treacle hours before. By then it was harder and drier than almost any food imaginable. Gerald politely passed the butter and cheese and urged Mademoiselle to try the bread and treacle.
        - id: ch01-b49
          speaker: mademoiselle
          text: Bah! It is dry as sand in the mouth. Can you possibly enjoy this?
        - id: ch01-b50
          speaker: gerald
          text: No, that is impossible. But boys mustn't make rude remarks about their food.
        - id: ch01-b51
          speaker: narrator
          text: Mademoiselle laughed. After that night, dried bread and treacle never appeared at supper again.
        - id: ch01-b52
          speaker: kathleen
          text: How do you do it?
        - id: ch01-b53
          speaker: narrator
          text: Kathleen whispered the question admiringly when they said good night.
        - id: ch01-b54
          speaker: gerald
          text: It's easy once a grown-up understands what you're after. From now on, I could guide her with a rein made of darning cotton.
        - id: ch01-b55
          speaker: narrator
          text: Gerald rose early the next morning. Hidden among the marigolds, he found a plant with pink carnations. He picked a small bunch, tied it with black cotton, and placed it beside Mademoiselle's plate. She smiled and looked quite handsome when she tucked the flowers into her belt.
        - id: ch01-b56
          speaker: jimmy
          text: Is it really decent to bribe people with flowers and passed salt, just so they'll let you do what you want?
        - id: ch01-b57
          speaker: kathleen
          text: That isn't what Gerald means. I know, though I never remember such things in time. If you want grown-ups to be kind to you, the least you can do is be kind to them and notice little things that please them. Jerry thinks of those things, and that's why old ladies like him. It isn't bribery. It's honest, like paying for something.
        - id: ch01-b58
          speaker: jimmy
          text: Well, whatever it is, we've got a splendid day for the woods.
        - id: ch01-b59
          speaker: narrator
          text: And they had. Even during the busy morning, the wide High Street lay almost as quiet as a street in a dream. Sunlight filled it. Leaves shone after the night's rain, while the road was already dry and its dust glittered like diamonds. The fine old houses stood solidly in the warmth, as if they were enjoying the sunshine too.
        - id: ch01-b60
          speaker: kathleen
          text: But are there actually any woods?
        - id: ch01-b61
          speaker: narrator
          text: They were passing the marketplace.
        - id: ch01-b62
          speaker: gerald
          text: Woods don't matter much. We're bound to find something. A boy at school said his father remembered a little cave under a bank near the Salisbury Road. He also said there was an enchanted castle there, though, so perhaps the cave isn't true either.
        - id: ch01-b63
          speaker: kathleen
          text: If we bought horns and blew them very loudly all the way, perhaps they would lead us to a magic castle.
        - id: ch01-b64
          speaker: jimmy
          text: If you have money to waste on horns.
        - id: ch01-b65
          speaker: kathleen
          text: I do, as it happens. So there.
        - id: ch01-b66
          speaker: narrator
          text: They bought horns in a tiny shop whose bulging window held a great tangle of toys, sweets, cucumbers, and sour apples. At the quiet square by the church, where all the most respectable people lived, the children blew long, loud blasts. Not one house changed into an enchanted castle. They went on along the Salisbury Road. It was hot and dusty, and before long they agreed to drink one bottle of ginger beer.
        - id: ch01-b67
          speaker: jimmy
          text: We may as well carry the ginger beer inside us instead of inside the bottle. We can hide the empty bottle and collect it on our way home.
        - id: ch01-b68
          speaker: narrator
          text: Presently the road reached a place where, as Gerald put it, it went two ways at once.
        - id: ch01-b69
          speaker: kathleen
          text: That way looks like adventures.
        - id: ch01-b70
          speaker: narrator
          text: They chose the road on the right. At the next turning they went left, to be fair, as Jimmy said. Then they chose right, then left, and kept alternating until they were utterly lost.
        - id: ch01-b71
          speaker: kathleen
          text: Completely lost. How lovely!
        - id: ch01-b72
          speaker: narrator
          text: Trees now arched above them, and tall bushy banks rose beside the road. The adventurers had stopped blowing their horns long ago. It was tiring work when nobody was there to be annoyed by it.
        - id: ch01-b73
          speaker: jimmy
          text: Oh, crikey! Let's sit down and eat some dinner. We could call it lunch, if you like.
        - id: ch01-b74
          speaker: narrator
          text: They settled into the hedge and ate the ripe red gooseberries meant for dessert. As they rested, wishing their boots did not feel so crowded with feet, Gerald leaned against the bushes. They gave way behind him, and he nearly toppled backwards. Something moved beneath his weight. Then something heavy fell.
        - id: ch01-b75
          speaker: gerald
          text: Jiminy! There's a hollow place in there. The stone behind me simply dropped away.
        - id: ch01-b76
          speaker: jimmy
          text: I wish it were a cave, but of course it isn't.
        - id: ch01-b77
          speaker: kathleen
          text: Perhaps it will become one if we blow the horns.
        - id: ch01-b78
          speaker: narrator
          text: Kathleen promptly blew hers. Gerald pushed one hand through the bushes.
        - id: ch01-b79
          speaker: gerald
          text: I can't feel anything but air. It's a hole full of emptiness.
        - id: ch01-b80
          speaker: narrator
          text: Together they pulled the branches aside. There truly was a hole in the bank.
        - id: ch01-b81
          speaker: gerald
          text: I'm going in.
        - id: ch01-b82
          speaker: kathleen
          text: Oh, please don't. What if there are snakes?
          emotion: fearful
        - id: ch01-b83
          speaker: gerald
          text: Not likely.
        - id: ch01-b84
          speaker: narrator
          text: He bent forward and struck a match.
        - id: ch01-b85
          speaker: gerald
          text: It is a cave!
        - id: ch01-b86
          speaker: narrator
          text: He put one knee on the mossy stone where he had been sitting, scrambled across it, and vanished. For a moment, the others held their breath.
        - id: ch01-b87
          speaker: jimmy
          text: Are you all right?
        - id: ch01-b88
          speaker: gerald
          text: Yes. Come in feet first. There's a little drop.
        - id: ch01-b89
          speaker: kathleen
          text: I'll go next.
        - id: ch01-b90
          speaker: narrator
          text: Kathleen obeyed, though her feet waved wildly in the air.
        - id: ch01-b91
          speaker: gerald
          text: Look out! You'll kick my eye. Feet down, girl, not up. There's no room for flying in here.
        - id: ch01-b92
          speaker: narrator
          text: He dragged her feet down and lifted her under the arms. Dry leaves rustled under her boots. Then Jimmy dived through head first, as though plunging into an unknown sea.
        - id: ch01-b93
          speaker: kathleen
          text: It really is a cave.
        - id: ch01-b94
          speaker: gerald
          text: At first, the young explorers were dazzled by the cave's darkness and could see nothing.
        - id: ch01-b95
          speaker: jimmy
          text: Darkness can't dazzle you.
        - id: ch01-b96
          speaker: kathleen
          text: I wish we'd brought a candle.
        - id: ch01-b97
          speaker: gerald
          text: Yes, darkness can dazzle. But while his clumsy companions blocked the entrance, their fearless leader's eyes grew used to the dark. And he made a discovery.
        - id: ch01-b98
          speakers: [kathleen, jimmy]
          ensemble: duo
          text: What did you find?
        - id: ch01-b99
          speaker: narrator
          text: Kathleen and Jimmy knew Gerald's habit of turning adventures into stories while they happened. At exciting moments, they sometimes wished he would speak less and sound less like a book.
        - id: ch01-b100
          speaker: gerald
          text: He refused to reveal the dreadful secret until every faithful follower gave a word of honour to remain calm.
        - id: ch01-b101
          speaker: jimmy
          text: We'll be calm. Just tell us.
        - id: ch01-b102
          speaker: gerald
          text: Then look behind you. There's light over there!
        - id: ch01-b103
          speaker: narrator
          text: They turned. A faint grey patch lay on the cave's brown wall. Beyond it, a brighter grey ended at a sharp dark edge. Somewhere around a bend, daylight was entering.
        - id: ch01-b104
          speaker: gerald
          text: Attention!
        - id: ch01-b105
          speaker: narrator
          text: Being a soldier's son, Gerald meant to give a proper military order, though he shortened it to a sharp sound. The others obeyed without thinking.
        - id: ch01-b106
          speaker: gerald
          text: Stay at attention until I order a slow march. Then move carefully in open order behind your heroic leader. And try not to step on the dead and wounded.
        - id: ch01-b107
          speaker: kathleen
          text: I wish you wouldn't say things like that.
        - id: ch01-b108
          speaker: jimmy
          text: There aren't any dead people. He only means don't trip over stones.
        - id: ch01-b109
          speaker: narrator
          text: Jimmy searched for Kathleen's hand in the darkness. When he found it, she screamed.
        - id: ch01-b110
          speaker: jimmy
          text: It's only me. I thought you might want your hand held. But you really are just like a girl.
        - id: ch01-b111
          speaker: narrator
          text: Their eyes were adjusting now. They stood in a rough stone cave that ran straight for three or four yards before turning sharply right.
        - id: ch01-b112
          speaker: gerald
          text: Death or victory! Now then, slow march.
        - id: ch01-b113
          speaker: narrator
          text: Gerald picked his way over the loose soil and stones. At the corner he cried out.
        - id: ch01-b114
          speaker: gerald
          text: A sail! A sail!
        - id: ch01-b115
          speaker: kathleen
          text: How splendid!
        - id: ch01-b116
          speaker: narrator
          text: She drew a long breath as she stepped into sunlight.
        - id: ch01-b117
          speaker: jimmy
          text: I can't see any sail.
        - id: ch01-b118
          speaker: narrator
          text: The narrow cave ended in a round arch fringed with ferns and trailing plants. Beyond it lay a deep, narrow gully. Moss covered its stone banks. Ferns and long grass grew in every crack. Trees met overhead, and shifting patches of sunlight turned the gully into a roofed passage of green and gold. A path of grey-green flagstones sloped steeply down beneath fallen leaves. At the bottom stood another round arch, dark within, with rocks, grass, and bushes rising above it.
        - id: ch01-b119
          speaker: jimmy
          text: It looks like the entrance to a railway tunnel.
        - id: ch01-b120
          speaker: kathleen
          text: It's the entrance to the enchanted castle. Let's sound the horns.
        - id: ch01-b121
          speaker: gerald
          text: Be quiet. The bold captain silenced the foolish chatter of his followers.
        - id: ch01-b122
          speaker: jimmy
          text: Followers? I like that!
        - id: ch01-b123
          speaker: gerald
          text: I thought you would. He ordered them forward in silence, because someone might be nearby. Besides, that arch could lead to an ice house, or something dangerous.
        - id: ch01-b124
          speaker: kathleen
          text: What dangerous thing?
        - id: ch01-b125
          speaker: gerald
          text: Bears, perhaps.
        - id: ch01-b126
          speaker: jimmy
          text: There aren't loose bears in England. In America they call them bars, though.
        - id: ch01-b127
          speaker: gerald
          text: Quick march!
        - id: ch01-b128
          speaker: narrator
          text: They marched. Damp leaves shifted underfoot, but the path beneath stayed hard and stony. At the dark arch they stopped.
        - id: ch01-b129
          speaker: jimmy
          text: Steps go down from here.
        - id: ch01-b130
          speaker: gerald
          text: It must be an ice house.
        - id: ch01-b131
          speaker: kathleen
          text: Let's not go in.
        - id: ch01-b132
          speaker: gerald
          text: Nothing could frighten our hero. He cheered his trembling servants by saying that he was certainly going on, and they could please themselves.
        - id: ch01-b133
          speaker: jimmy
          text: If you call us names, you can go alone. So there!
        - id: ch01-b134
          speaker: gerald
          text: The names are part of the game, silly. You can be captain tomorrow. Until then, hold your tongue and think of what you'll call us on your turn.
        - id: ch01-b135
          speaker: narrator
          text: Very slowly, they descended. A stone vault curved over their heads. At the eleventh step, the edge vanished and a passage began, turning left. Gerald struck another match.
        - id: ch01-b136
          speaker: jimmy
          text: This passage will take us back to the road.
        - id: ch01-b137
          speaker: gerald
          text: Or underneath it. We came down eleven steps.
        - id: ch01-b138
          speaker: narrator
          text: Gerald moved ahead, slowly now, because there might be more steps. The passage was utterly dark.
        - id: ch01-b139
          speaker: jimmy
          text: I don't much like this.
          emotion: fearful
        - id: ch01-b140
          speaker: narrator
          text: Then a glimmer appeared. It grew brighter until the passage ended at another arch. Beyond it was a view so much like a picture of Italy that all three children lost their breath. They walked out in silence, staring. A short avenue of cypress trees opened onto a broad white marble terrace. Blinking in the sun, the children rested their arms on the wide stone railing and gazed below.
        - id: ch01-b141
          speaker: narrator
          text: There lay a lake with swans, an island, and weeping willows. Beyond it, groves of trees dotted the green slopes, and white statues gleamed among the leaves. A small round temple with pillars stood against a hill on the left. On the right, a waterfall tumbled over mossy rocks and splashed into the lake. Steps led from the terrace to the water and to lawns beside it. Deer grazed on the farther slopes. In the distance, where the groves thickened almost into forest, enormous grey stone shapes rose unlike anything the children had ever seen.
        - id: ch01-b142
          speaker: gerald
          text: That boy at school was telling the truth.
        - id: ch01-b143
          speaker: kathleen
          text: It is an enchanted castle.
        - id: ch01-b144
          speaker: jimmy
          text: I don't see a castle.
        - id: ch01-b145
          speaker: gerald
          text: Then what do you call that?
        - id: ch01-b146
          speaker: narrator
          text: He pointed beyond a belt of lime trees, where white towers and turrets cut into the blue sky.
        - id: ch01-b147
          speaker: kathleen
          text: No one seems to be here, but everything is so neat. I believe it really is magic.
        - id: ch01-b148
          speaker: jimmy
          text: Perhaps magic machines mow the grass.
        - id: ch01-b149
          speaker: kathleen
          text: If this were a book, it would certainly be an enchanted castle.
        - id: ch01-b150
          speaker: gerald
          text: It is an enchanted castle.
        - id: ch01-b151
          speaker: jimmy
          text: But enchanted castles don't exist.
        - id: ch01-b152
          speaker: gerald
          text: How can you know? Do you think the world contains nothing except what you've already seen?
        - id: ch01-b153
          speaker: jimmy
          text: Magic disappeared when people invented steam engines, newspapers, telephones, and wireless messages.
        - id: ch01-b154
          speaker: gerald
          text: Wireless seems rather magical when you think about it.
        - id: ch01-b155
          speaker: jimmy
          text: Oh, that kind of magic.
        - id: ch01-b156
          speaker: kathleen
          text: Perhaps magic stopped happening because people stopped believing in it.
        - id: ch01-b157
          speaker: gerald
          text: Then let's not spoil everything by refusing to believe. I'm going to believe as hard as I can. This is an enchanted garden, that is an enchanted castle, and I am going to explore them.
        - id: ch01-b158
          speaker: narrator
          text: The fearless knight led on, leaving his ignorant squires to follow if they chose. He rolled over the balustrade and strode toward the lawn, his boots clattering with determination. The others followed. No garden like this had ever existed outside a picture or a fairy tale. They passed close to the deer, which merely raised their graceful heads and showed no fear. After a long stretch of grass, the children walked beneath the heavy masses of lime trees. On the other side lay a rose garden, bordered by thick, closely cut yew hedges. Red, pink, green, and white shone in the sun, like an enormous scented handkerchief belonging to a giant.
        - id: ch01-b159
          speaker: kathleen
          text: A gardener will appear in a moment and ask what we're doing. What will you tell him?
        - id: ch01-b160
          speaker: narrator
          text: She spoke with her nose buried in a rose.
        - id: ch01-b161
          speaker: gerald
          text: I'll say we've lost our way. It will be perfectly true.
        - id: ch01-b162
          speaker: narrator
          text: But no gardener came. No one came at all. The sense of magic grew stronger and stronger, until even the sound of their own footsteps in that vast, silent place made them uneasy. Past the rose garden stood a yew hedge with an arch cut through it. The arch opened into a maze like the famous one at Hampton Court.
        - id: ch01-b163
          speaker: gerald
          text: Mark my words. The secret enchantment will be at the heart of this maze. Draw your swords, my merry men, and follow me in complete silence.
        - id: ch01-b164
          speaker: narrator
          text: They did. The close yew walls trapped the heat, and the way to the centre hid itself well. Again and again, they wandered back to the black arch facing the rose garden. They were glad of their large, clean handkerchiefs. On their fourth return, Jimmy suddenly began to cry out a wish. Then he stopped.
        - id: ch01-b165
          speaker: jimmy
          text: Oh, I wish... Oh! Where is our dinner?
        - id: ch01-b166
          speaker: narrator
          text: In one stricken silence, they remembered. The basket still sat at the cave entrance. Their thoughts went lovingly to cold slices of mutton, six tomatoes, bread and butter, a twisted paper of salt, apple turnovers, and the little thick glass for drinking ginger beer.
        - id: ch01-b167
          speaker: jimmy
          text: Let's go back this minute, fetch everything, and eat.
        - id: ch01-b168
          speaker: gerald
          text: Let's try the maze once more. I hate giving up.
        - id: ch01-b169
          speaker: jimmy
          text: I'm so hungry!
        - id: ch01-b170
          speaker: gerald
          text: Why didn't you say so before?
        - id: ch01-b171
          speaker: jimmy
          text: I wasn't hungry before.
        - id: ch01-b172
          speaker: gerald
          text: Then you can't be hungry now. Hunger doesn't arrive all at once. Wait. What's that?
        - id: ch01-b173
          speaker: narrator
          text: A thin red gleam lay at the foot of the hedge. No one might have noticed it without staring angrily at the roots as Gerald was doing. It was cotton thread. Gerald picked it up. One end was tied to a pierced thimble. The other end had no end at all.
        - id: ch01-b174
          speaker: gerald
          text: This is a clew! What do you say to cold mutton now? I've always known magic would happen one day, and here it is.
        - id: ch01-b175
          speaker: jimmy
          text: The gardener probably left it.
        - id: ch01-b176
          speaker: gerald
          text: With a princess's silver thimble attached? Look at it. There's a crown.
        - id: ch01-b177
          speaker: narrator
          text: There was indeed a crown on the thimble.
        - id: ch01-b178
          speaker: gerald
          text: Come on. If you're adventurers, then behave like adventurers. Besides, someone probably stole our mutton hours ago.
        - id: ch01-b179
          speaker: narrator
          text: Gerald moved forward, winding the red thread around his fingers. It truly was a clew. It led them straight to the maze's centre, up two stone steps, and onto a round patch of grass. A sundial stood in the middle. A low, broad marble seat curved around the edge against the yew. The red thread crossed the grass, passed the sundial, and ended in a small brown hand.
        - id: ch01-b180
          speaker: narrator
          text: Jewelled rings covered every finger. Bracelets set with red, blue, and green stones sparkled on the arm. Its sleeve was made of pink-and-gold brocade, faded in places but still magnificent. The sleeve belonged to a gown worn by a lady asleep on the stone seat in the sun. Her rosy golden dress opened over a softly green embroidered petticoat. Old yellow lace, the colour of scalded cream, edged her clothes. A thin white veil scattered with silver stars covered her face.
        - id: ch01-b181
          speaker: gerald
          text: It's the enchanted princess. I told you.
        - id: ch01-b182
          speaker: kathleen
          text: She's the Sleeping Beauty. Look at those old clothes, like the ladies around Marie Antoinette in our history book. She has slept for a hundred years. Gerald, you're the eldest. You must be the prince, and none of us ever knew.
        - id: ch01-b183
          speaker: jimmy
          text: She isn't truly a princess.
        - id: ch01-b184
          speaker: narrator
          text: Gerald and Kathleen laughed at him. Jimmy's objections could spoil any game, but this time they also laughed because neither felt certain he was wrong. The cave, the marvellous garden, the maze, and the red clew had made the magic feel stronger at every step. Now Gerald and Kathleen were almost completely under its spell.
        - id: ch01-b185
          speaker: kathleen
          text: Lift her veil, Jerry. If she isn't beautiful, we'll know she can't be the princess.
        - id: ch01-b186
          speaker: gerald
          text: Lift it yourself.
        - id: ch01-b187
          speaker: jimmy
          text: You're probably forbidden to touch the figures.
        - id: ch01-b188
          speaker: gerald
          text: She isn't made of wax, silly.
        - id: ch01-b189
          speaker: kathleen
          text: Wax would melt in this sun. Besides, she's breathing. She must be the princess.
        - id: ch01-b190
          speaker: narrator
          text: Very gently, Kathleen lifted the veil and folded it back. The princess had a small white face framed by long black plaits. Her nose was straight, her eyebrows finely drawn, and a few freckles crossed her cheekbones and nose.
        - id: ch01-b191
          speaker: kathleen
          text: No wonder she has freckles after sleeping a hundred years in the sun. Her mouth isn't exactly a rosebud, but still... isn't she lovely?
        - id: ch01-b192
          speaker: gerald
          text: Not bad at all.
        - id: ch01-b193
          speaker: kathleen
          text: Now, Jerry. You are the eldest.
        - id: ch01-b194
          speaker: gerald
          text: Of course I am.
        - id: ch01-b195
          speaker: narrator
          text: He sounded uneasy.
        - id: ch01-b196
          speaker: kathleen
          text: Then you have to wake the princess.
        - id: ch01-b197
          speaker: jimmy
          text: She isn't a princess. She's just a little girl in costume.
        - id: ch01-b198
          speaker: kathleen
          text: But she has a long dress.
        - id: ch01-b199
          speaker: jimmy
          text: Look where her feet end under it. If she stood up, she wouldn't be taller than Jerry.
        - id: ch01-b200
          speaker: kathleen
          text: Come on, Jerry. Don't be silly. You must do it.
        - id: ch01-b201
          speaker: gerald
          text: Do what?
        - id: ch01-b202
          speaker: narrator
          text: He rubbed the toe of one boot against the other.
        - id: ch01-b203
          speaker: kathleen
          text: Kiss her awake, of course.
        - id: ch01-b204
          speaker: gerald
          text: Not me!
        - id: ch01-b205
          speaker: kathleen
          text: Someone has to.
        - id: ch01-b206
          speaker: gerald
          text: She might attack me the moment she wakes.
        - id: ch01-b207
          speaker: kathleen
          text: I'd do it at once, but a kiss from me probably wouldn't work.
        - id: ch01-b208
          speaker: narrator
          text: Kathleen tried. Nothing happened. The princess slept on.
        - id: ch01-b209
          speaker: kathleen
          text: Then you must do it, Jimmy. Perhaps you'll be good enough. Jump back before she can hit you.
        - id: ch01-b210
          speaker: gerald
          text: She won't hit him. He's such a little fellow.
        - id: ch01-b211
          speaker: jimmy
          text: You're little yourself! I don't mind kissing her. I'm not a coward like Certain People. But if I do it, I get to be the fearless leader for the rest of the day.
        - id: ch01-b212
          speaker: gerald
          text: Now wait. Perhaps I had better...
        - id: ch01-b213
          speaker: narrator
          text: Too late. Jimmy planted a loud, cheerful kiss on the princess's pale cheek. All three children stood perfectly still and waited. The princess opened large dark eyes. She stretched her arms, gave a small yawn, covered her mouth with one brown hand, and spoke clearly enough that no one could misunderstand.
        - id: ch01-b214
          speaker: princess
          text: So the hundred years are over? How tall the yew hedges have grown! Which one of you is the prince who woke me from my long, deep sleep?
          emotion: surprised
        - id: ch01-b215
          speaker: jimmy
          text: I did.
        - id: ch01-b216
          speaker: narrator
          text: He answered without fear, because she did not look ready to slap anyone.
        - id: ch01-b217
          speaker: princess
          text: My noble rescuer!
        - id: ch01-b218
          speaker: narrator
          text: The princess held out her hand, and Jimmy shook it vigorously.
        - id: ch01-b219
          speaker: jimmy
          text: But look here. You aren't truly a princess, are you?
        - id: ch01-b220
          speaker: princess
          text: Of course I am. Who else would I be? Look at my crown.
        - id: ch01-b221
          speaker: narrator
          text: She drew aside the starry veil. Underneath was a coronet made of what even Jimmy had to admit were diamonds.
        - id: ch01-b222
          speaker: jimmy
          text: But...
        - id: ch01-b223
          speaker: princess
          text: You must have known I was here, or you would never have come. How did you pass the dragons?
        - id: ch01-b224
          speaker: narrator
          text: Gerald ignored her question.
        - id: ch01-b225
          speaker: gerald
          text: Do you honestly believe in magic and all that?
        - id: ch01-b226
          speaker: princess
          text: If anyone should believe, I should. See where the spindle pricked me.
        - id: ch01-b227
          speaker: narrator
          text: She showed them a small scar on her wrist.
        - id: ch01-b228
          speaker: gerald
          text: Then this truly is an enchanted castle?
        - id: ch01-b229
          speaker: princess
          text: Naturally. How very stupid you are!
        - id: ch01-b230
          speaker: narrator
          text: She stood, and the pink brocade gathered in shining waves around her feet.
        - id: ch01-b231
          speaker: jimmy
          text: I said the dress was too long.
        - id: ch01-b232
          speaker: princess
          text: It fitted when I fell asleep. It must have grown during the hundred years.
        - id: ch01-b233
          speaker: jimmy
          text: I still don't believe you're a princess. At least...
        - id: ch01-b234
          speaker: princess
          text: Then don't believe it. What you believe matters much less than what I am.
        - id: ch01-b235
          speaker: narrator
          text: She turned from Jimmy to the others.
        - id: ch01-b236
          speaker: princess
          text: Let's return to the castle. I'll show you all my beautiful jewels and treasures. Would you like that?
        - id: ch01-b237
          speaker: gerald
          text: Yes, but...
        - id: ch01-b238
          speaker: narrator
          text: His hesitation was plain.
        - id: ch01-b239
          speaker: princess
          text: But what?
        - id: ch01-b240
          speaker: gerald
          text: We're terribly hungry.
        - id: ch01-b241
          speaker: princess
          text: So am I!
        - id: ch01-b242
          speaker: gerald
          text: We haven't eaten since breakfast.
        - id: ch01-b243
          speaker: princess
          text: And the sundial says three o'clock. You poor things, you've gone hours and hours without food. But think of me. I haven't eaten for a hundred years. Come to the castle.
        - id: ch01-b244
          speaker: jimmy
          text: The mice will have eaten everything.
          emotion: sad
        - id: ch01-b245
          speaker: narrator
          text: Jimmy now believed she really was a princess.
        - id: ch01-b246
          speaker: princess
          text: Of course they haven't! Everything here is enchanted. Time stood still for a hundred years. Come along. One of you must carry my train, or I'll never move now that it has grown so terribly long.
          emotion: happy
