audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 讲究而端庄，偶尔流露笑意
        timbre: 轻盈成熟的女声
        pace: 从容
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 故事里有三个孩子，杰里、吉米和凯瑟琳。杰里的大名其实是杰拉尔德，可不是什么杰里迈亚，不管你先前怎么猜。吉米的大名是詹姆斯。凯瑟琳更少有人正经叫她本名。哥哥们高兴时，叫她凯茜、凯蒂或小猫咪。不高兴时，她就成了挠人猫。他们在英格兰西部一座小镇上学，两个男孩在一所学校，女孩在另一所。那时，男孩女孩同校这种明智的办法，还不像人们盼望的那么普遍。
        - id: ch01-b02
          speaker: narrator
          text: 星期六和星期日，他们会到好心的赫维小姐家见面。可那种房子偏偏叫人玩不起来。你大概见过那种房子吧？屋里好像总有一种说不清的东西。孩子们哪怕单独待着，连话也很难自在地说，更不用提玩了。真要玩起来，反倒显得又别扭又做作。所以他们一心盼着假期。回到汉普郡的家，三个人能整天在一起，屋里可以痛快玩，也可以随意说话。森林和田野间，更有许多好看好玩的东西。表姐贝蒂也要来，大家早有一肚子计划。
        - id: ch01-b03
          speaker: narrator
          text: 贝蒂的学校先放了假。她比他们早到汉普郡的家，谁知刚一进门就出了麻疹。于是，三个孩子谁也回不去了。你可以想象他们有多么难受。原先那些一同玩耍的计划，当然也全落了空。要他们在赫维小姐家熬七个星期，实在受不了，于是三个人都写信回家，把这件事说得明明白白。父母很惊讶。他们一直觉得，孩子们能去亲爱的赫维小姐家，是多好的一件事。好在用杰里的话说，父母还算通情达理。许多封信和电报来来去去，最后大家决定，让男孩们搬到凯瑟琳的学校住。女生全都离开了，教师也只剩下那位法国女教师。
        - id: ch01-b04
          speaker: kathleen
          text: 那里总比赫维小姐家好。再说，我们学校可不像你们学校那么难看。我们的桌上有桌布，窗上有窗帘。你们那儿呢？只有白木板、课桌，还有满眼的墨水渍。
        - id: ch01-b05
          speaker: narrator
          text: 男孩们回去收拾箱子，凯瑟琳便尽力把每个房间装点漂亮。她把花插进果酱瓶，主要是金盏花，因为后园几乎没有别的花。前园倒有天竺葵、蒲包花和半边莲，可孩子们不许摘。茶后，她又把男孩们的衣服取出来，放进漆过的五斗柜。她把不同种类的衣服分开，叠成一小摞一小摞，摆得整整齐齐，觉得自己真是又成熟又细心。
        - id: ch01-b06
          speaker: kathleen
          text: 整个假期，我们总得有个游戏一直玩下去。要不，我们来写一本书？
        - id: ch01-b07
          speaker: jimmy
          text: 你可写不了书。
        - id: ch01-b08
          speaker: kathleen
          text: 我又没说只让我写。我是说，我们三个一起写。
        - id: ch01-b09
          speaker: gerald
          text: 太费劲了。
        - id: ch01-b10
          speaker: kathleen
          text: 要是把学校里真正的样子写出来，别人读了，一定会觉得我们聪明极了。
        - id: ch01-b11
          speaker: gerald
          text: 我看，他们更可能把我们开除。咱们还是到外头扮强盗吧。要是能找到一个山洞，我们就把粮食存在里面，还能在那里吃饭。
        - id: ch01-b12
          speaker: jimmy
          text: 这里没有山洞。再说，你那位宝贝小姐很可能连门都不让我们自己出。
        - id: ch01-b13
          speaker: gerald
          text: 那可不一定。我去找她谈谈，摆出个父亲的样子。
        - id: ch01-b14
          speaker: kathleen
          text: 就凭你现在这副模样？
        - id: ch01-b15
          speaker: narrator
          text: 凯瑟琳轻蔑地用大拇指指着他。杰拉尔德往镜子里瞧了瞧。
        - id: ch01-b16
          speaker: gerald
          text: 我们的英雄只用一眨眼的工夫，就梳好头发，刷净衣服，还洗好了脸和手。
        - id: ch01-b17
          speaker: narrator
          text: 他一边说，一边把这些事做完了。过了一会儿，一个头发溜光、皮肤褐色、身材瘦削，看上去颇有意思的男孩，敲响了起居室的门。法国女教师正在里面读一本黄封皮的书，还在想那些永远实现不了的心愿。杰拉尔德只要愿意，转眼就能让自己显得格外惹人注意。这本领拿来跟陌生大人打交道，实在十分管用。他把灰眼睛睁大一点，让嘴角稍稍垂下，再摆出温顺恳求的神情，活像那位已经故去的小福特勒罗伊爵爷。不过顺便说一句，小爵爷要是还活着，如今也早老了，而且一定自命不凡得叫人受不了。
        - id: ch01-b18
          speaker: mademoiselle
          text: 请进！你有什么事？
        - id: ch01-b19
          speaker: gerald
          text: 希望我没有打扰您。
        - id: ch01-b20
          speaker: narrator
          text: 他说得无辜极了，简直像嘴里的黄油都不会融化。
        - id: ch01-b21
          speaker: mademoiselle
          text: 没有。你想要什么？
        - id: ch01-b22
          speaker: gerald
          text: 我觉得应该来向您问声好。因为现在，您就是这屋子的女主人。
        - id: ch01-b23
          speaker: narrator
          text: 他伸出刚洗过的手，还是又红又湿。小姐握了握。
        - id: ch01-b24
          speaker: mademoiselle
          text: 你真是个懂礼貌的小男孩。
        - id: ch01-b25
          speaker: gerald
          text: 哪里。我真替您难过。放假了还得照看我们，一定很糟糕吧。
        - id: ch01-b26
          speaker: mademoiselle
          text: 不会的。我相信你们一定会做很乖的孩子。
        - id: ch01-b27
          speaker: narrator
          text: 杰拉尔德脸上的神情向她保证，只要三个孩子还没有脱离凡胎，他们就会尽可能接近天使。
        - id: ch01-b28
          speaker: gerald
          text: 我们会努力的。
        - id: ch01-b29
          speaker: mademoiselle
          text: 有什么事是我能替你们做的吗？
        - id: ch01-b30
          speaker: gerald
          text: 不用了，谢谢您。我们一点也不想添麻烦。我只是在想，明天要是让我们整天去树林，再带一顿冷的晚饭，厨娘就不必为我们费心，您也会轻松些。
        - id: ch01-b31
          speaker: mademoiselle
          text: 你想得真周到。
        - id: ch01-b32
          speaker: narrator
          text: 她的语气冷了下来。可是杰拉尔德的嘴唇明明一本正经，眼睛却悄悄笑了。小姐看见那一点笑意，也笑出声来。杰拉尔德跟着笑了。
        - id: ch01-b33
          speaker: mademoiselle
          text: 小骗子！你明明是想躲开我的监视。为什么不直说，偏要装成一心想讨我高兴？
        - id: ch01-b34
          speaker: gerald
          text: 跟大人说话，总得小心一点。不过也不全是假装。我们真的不想麻烦您，也不想让您来麻烦我们。
        - id: ch01-b35
          speaker: mademoiselle
          text: 好吧。你们的父母允许你们整天待在树林里吗？
        - id: ch01-b36
          speaker: gerald
          text: 当然允许。
        - id: ch01-b37
          speaker: narrator
          text: 这一句倒完全是真话。
        - id: ch01-b38
          speaker: mademoiselle
          text: 那我也不做一条比你们父母更凶的恶龙。我会先告诉厨娘。现在满意了吗？
        - id: ch01-b39
          speaker: gerald
          text: 太满意了！小姐，您真是个宝贝。
        - id: ch01-b40
          speaker: mademoiselle
          text: 一头宝贝鹿？你说的是雄鹿吗？
        - id: ch01-b41
          speaker: gerald
          text: 不，不是鹿，是亲爱的。您是一等一的亲爱的，绝不会后悔答应我们。要不要我们替您做点事？绕毛线，找眼镜，或者别的什么？
        - id: ch01-b42
          speaker: mademoiselle
          text: 他把我当成老奶奶了！快去吧。淘气也别超过你们非淘不可的分量。
        - id: ch01-b43
          speaker: narrator
          text: 她笑得更厉害了。杰拉尔德一出来，另外两个孩子便围上去。
        - id: ch01-b44
          speakers: [kathleen, jimmy]
          ensemble: duo
          text: 怎么样？她答应了吗？
        - id: ch01-b45
          speaker: gerald
          text: 当然答应了，我早说过。天真的少年赢得了异国女教师的好感。这位女教师年轻时，曾是她那卑微村庄的一枝花。
        - id: ch01-b46
          speaker: kathleen
          text: 我才不信她从前漂亮过。她严厉得很。
        - id: ch01-b47
          speaker: gerald
          text: 那是因为你不会跟她打交道。你瞧，她对我就一点也不严厉。
        - id: ch01-b48
          speaker: jimmy
          text: 你可真是个大骗子，对不对？
        - id: ch01-b49
          speaker: gerald
          text: 我才不是骗子。我是个外……那个词叫什么来着？有点像大使。外角家，对，就是这个。总之，一整天已经到手了。要是明天还找不到山洞，我就不叫无名氏杰克·罗宾逊。
        - id: ch01-b50
          speaker: narrator
          text: 晚饭时，法国女教师坐在桌边，看着比凯瑟琳过去见过的任何时候都和气。桌上的晚饭是几个钟头前就抹好糖浆的面包，如今又干又硬，简直比你想得到的任何食物都难以下咽。杰拉尔德却礼貌得很。他殷勤地替小姐递黄油和奶酪，还再三请她亲口尝一尝那份糖浆面包。
        - id: ch01-b51
          speaker: mademoiselle
          text: 呸！干得像嘴里塞满了沙子！你们真的喜欢吃这个吗？
        - id: ch01-b52
          speaker: gerald
          text: 那当然不可能。不过，男孩子议论饭菜不好，可是很没礼貌的。
        - id: ch01-b53
          speaker: narrator
          text: 小姐笑了。从那以后，晚饭桌上再也没有出现过放干的糖浆面包。
        - id: ch01-b54
          speaker: kathleen
          text: 你到底是怎么做到的？
        - id: ch01-b55
          speaker: narrator
          text: 晚上道别时，凯瑟琳压低声音，满是钦佩。
        - id: ch01-b56
          speaker: gerald
          text: 一旦让大人看明白你想要什么，事情就简单了。你等着瞧吧，以后我只用一根缝补线当缰绳，就能驾着她走。
        - id: ch01-b57
          speaker: narrator
          text: 第二天，杰拉尔德起得很早。他从藏在金盏花间的一株花上，摘下一小束粉红康乃馨，用黑线扎好，放在小姐的盘子上。小姐微笑起来，把花插进腰带时，竟显得十分漂亮。
        - id: ch01-b58
          speaker: jimmy
          text: 送花、递盐，拿这些东西讨好别人，让他们答应你想做的事。你觉得这样真的光明正大吗？不就像行贿吗？
        - id: ch01-b59
          speaker: kathleen
          text: 不是那么回事。我明白杰拉尔德的意思，只是自己总来不及想到。你想让大人待你好，至少也应该待他们好一点，想些小事让他们开心。我从来想不到，杰里却想得到，所以老太太们都喜欢他。这不是行贿，倒像是一种诚实。就像买了东西，本来就该付钱。
        - id: ch01-b60
          speaker: jimmy
          text: 反正这个道德难题先放一边。今天去树林，天气真不错。
        - id: ch01-b61
          speaker: narrator
          text: 天气确实好极了。宽阔的大街泡在阳光里，哪怕正是一天里最忙碌的早晨，也安静得像一条梦中的街。昨夜下过雨，树叶像刚洗过一样鲜亮，路面却已经干了。阳光落下来，连路上的尘土也像碎钻石一样闪光。两旁那些美丽的老屋又结实又稳固，看起来仿佛也在舒舒服服地晒着太阳，而且十分享受。
        - id: ch01-b62
          speaker: kathleen
          text: 可这里真的有树林吗？
        - id: ch01-b63
          speaker: narrator
          text: 他们正走过集市广场。
        - id: ch01-b64
          speaker: gerald
          text: 有没有树林不大要紧，反正总会找到点什么。学校里有个家伙告诉我，他父亲小时候，在索尔兹伯里路附近的一条小巷里见过山洞。可他还说那里有座魔法城堡，所以山洞也不一定是真的。
        - id: ch01-b65
          speaker: kathleen
          text: 要是买几只号角，一路使劲吹，也许我们真能找到魔法城堡。
        - id: ch01-b66
          speaker: jimmy
          text: 你要是有闲钱拿去买号角，那就随你。
        - id: ch01-b67
          speaker: kathleen
          text: 真巧，我还偏偏有。怎么样？
        - id: ch01-b68
          speaker: narrator
          text: 号角就在一家很小的店里买到了。店铺有一扇向外凸出的橱窗，里头的玩具、糖果、黄瓜和酸苹果纠缠在一起，挤成乱糟糟的一团。镇子尽头有一座安静的广场，教堂和最体面人家的宅子都在那里。孩子们走过广场，一路把号角吹得又长又响，四面回声不断。可是，没有一幢房子肯变成魔法城堡。他们只好继续沿索尔兹伯里路往前走。路上又热又多尘，三个人商量过后，同意先喝掉一瓶姜汁啤酒。
        - id: ch01-b69
          speaker: jimmy
          text: 反正姜汁啤酒总得装在什么里头。装进肚子，跟装在瓶子里一样。空瓶可以藏起来，回来时再取。
        - id: ch01-b70
          speaker: narrator
          text: 不久，他们来到一个岔路口。照杰拉尔德的说法，路到了那里，同时朝两个方向走。
        - id: ch01-b71
          speaker: kathleen
          text: 这条路看着就会有奇遇。
        - id: ch01-b72
          speaker: narrator
          text: 他们选了右边那条路。下一次遇见岔路，又转向左边，因为吉米说，左右轮流才算公平。接着再往右，再往左，每逢路口就这样交替。如此反复下去，他们终于彻彻底底迷了路。
        - id: ch01-b73
          speaker: kathleen
          text: 迷得彻彻底底。多带劲呀！
        - id: ch01-b74
          speaker: narrator
          text: 树枝已经在头顶交拱起来，路边高高的坡岸上全是灌木。冒险家们早就不吹号角了。四周连个能被吵恼的人都没有，还一直吹下去，实在太累。
        - id: ch01-b75
          speaker: jimmy
          text: 哎哟喂！咱们坐一会儿，吃点晚饭吧。其实，也可以管它叫午餐。这样不是更好吗？
        - id: ch01-b76
          speaker: narrator
          text: 他们坐到篱边，把本来留作甜点的熟透红醋栗吃了。三个人一边歇息，一边盼着靴子里别塞着这么多脚，免得双脚挤得难受。杰拉尔德把身子向后一仰，靠上灌木。没想到灌木忽然让开了，害他差点仰面摔倒。他背后有什么东西承受不住压力，松动了。紧接着，他们听见一件沉重的东西掉了下去。
        - id: ch01-b77
          speaker: gerald
          text: 哎呀呀！里面是空的。我刚才靠着的那块石头，直接掉下去了！
        - id: ch01-b78
          speaker: jimmy
          text: 我真希望那是个山洞，可它当然不会是。
        - id: ch01-b79
          speaker: kathleen
          text: 吹响号角，它说不定就会变成山洞。
        - id: ch01-b80
          speaker: narrator
          text: 凯瑟琳这么一说，便赶忙吹起自己的号角。杰拉尔德则把手从挡在洞口的灌木间伸进去，朝那片黑暗里仔细摸索。
        - id: ch01-b81
          speaker: gerald
          text: 除了空气，什么也没有。这里只是一个洞，里头装满了空无一物。我要进去看看。
        - id: ch01-b82
          speaker: narrator
          text: 另外两个孩子扯开灌木，坡岸上果然有一个洞。
        - id: ch01-b83
          speaker: kathleen
          text: 别去！我真希望你别进去。万一里面有蛇呢？
        - id: ch01-b84
          speaker: gerald
          text: 不大可能。
        - id: ch01-b85
          speaker: narrator
          text: 他还是探身过去，划亮一根火柴。
        - id: ch01-b86
          speaker: gerald
          text: 真的是山洞！
        - id: ch01-b87
          speaker: narrator
          text: 他把膝盖撑在刚才坐过的苔藓石头上，攀过去，消失了。接下来是一阵叫人屏住呼吸的寂静。
        - id: ch01-b88
          speaker: jimmy
          text: 你还好吗？
        - id: ch01-b89
          speaker: gerald
          text: 我没事，过来吧。最好把脚伸在前面。这里有一点落差。
        - id: ch01-b90
          speaker: kathleen
          text: 下一个我来。
        - id: ch01-b91
          speaker: narrator
          text: 凯瑟琳照他说的，脚朝前钻进去，两只脚在空中胡乱踢腾。
        - id: ch01-b92
          speaker: gerald
          text: 小心！你快把我的眼睛踢出来了。脚往下放，姑娘，别往上抬。这里根本没地方飞，你试也没用。
        - id: ch01-b93
          speaker: narrator
          text: 杰拉尔德先用力把她乱踢的脚扳下来，又从腋下托住她，把她抱到地上。凯瑟琳的靴子踩着干枯的叶子，发出沙沙声。她站稳身子，准备在下面接住吉米。可吉米没有把脚伸在前面，反而头朝前钻了进来，活像一头扎进了一片陌生的海。
        - id: ch01-b94
          speaker: kathleen
          text: 这里真的是山洞。
        - id: ch01-b95
          speaker: gerald
          text: 年轻的探险家们刚刚进入山洞，被黑暗晃花了眼，什么也看不见。
        - id: ch01-b96
          speaker: narrator
          text: 他说话时用肩膀堵着洞口。
        - id: ch01-b97
          speaker: jimmy
          text: 黑暗才不会晃眼。
        - id: ch01-b98
          speaker: kathleen
          text: 要是带了蜡烛就好了。
        - id: ch01-b99
          speaker: gerald
          text: 黑暗就是会晃眼，所以他们什么也看不见。不过，那两个笨手笨脚的家伙堵住入口时，无畏的首领已经适应黑暗，还发现了一桩秘密。
        - id: ch01-b100
          speakers: [kathleen, jimmy]
          ensemble: duo
          text: 到底是什么秘密？
        - id: ch01-b101
          speaker: narrator
          text: 两个孩子很熟悉杰拉尔德边行动边讲故事的习惯。可在这样激动的时候，他们有时也真希望他别说得那么久，更别像一本书那样。
        - id: ch01-b102
          speaker: gerald
          text: 他没有马上说出那个可怕的秘密。他要忠实的随从们一个个用名誉担保，答应绝不惊慌，才肯开口。
        - id: ch01-b103
          speaker: jimmy
          text: 我们不会慌。你快说吧！
        - id: ch01-b104
          speaker: gerald
          text: 好吧，那边有亮光。回头看看！
        - id: ch01-b105
          speaker: narrator
          text: 杰拉尔德一下子不再像本书，又变回了男孩。他们回头一看，果真有光。褐色洞壁上浮着淡淡的灰白，另一块更亮的灰白，被一道暗线整整齐齐地截断。这表示在洞穴转弯处的后面，有日光照进来。
        - id: ch01-b106
          speaker: gerald
          text: 立正！
        - id: ch01-b107
          speaker: narrator
          text: 他原本想说得威武，可出口却有点含混。军人的儿子就该这么发令。另外两个孩子不由自主地照办了。
        - id: ch01-b108
          speaker: gerald
          text: 在我下令齐步走以前，你们要一直立正。听到口令，就拉开队形，小心前进，跟着你们的英雄首领。千万别踩着死伤的人。
        - id: ch01-b109
          speaker: kathleen
          text: 真希望你别说这种话！
        - id: ch01-b110
          speaker: jimmy
          text: 这里没有死伤的人。他只是叫我们留神，别被石头什么的绊倒。
        - id: ch01-b111
          speaker: narrator
          text: 吉米在黑暗里摸到凯瑟琳的手，她尖叫起来。
        - id: ch01-b112
          speaker: jimmy
          text: 只是我。我以为你愿意让我牵着。可你到底还是个女孩子。
        - id: ch01-b113
          speaker: narrator
          text: 三个人的眼睛渐渐习惯了黑暗。他们终于看清，自己站在一座粗糙的石洞里。洞穴从脚下一直笔直伸出三四码，随后猛地向右转弯。
        - id: ch01-b114
          speaker: gerald
          text: 不是胜利，就是死亡！现在，齐步走！
        - id: ch01-b115
          speaker: narrator
          text: 杰拉尔德小心地走在最前面。洞底铺满松土和零乱的石块，他每迈一步，都要先挑好稳当的落脚处。
        - id: ch01-b116
          speaker: gerald
          text: 有船！我看见船了！
        - id: ch01-b117
          speaker: narrator
          text: 他已经转过拐角。
        - id: ch01-b118
          speaker: kathleen
          text: 太美了！
        - id: ch01-b119
          speaker: narrator
          text: 凯瑟琳走进阳光里，长长吸了一口气。
        - id: ch01-b120
          speaker: jimmy
          text: 我怎么没看见船？
        - id: ch01-b121
          speaker: narrator
          text: 狭窄通道的尽头是一座圆拱，边缘挂满蕨草和藤蔓。他们穿过拱门，进入一道又深又窄的沟谷。谷岸由一块块石头砌成，上面盖着苔藓。石缝里还钻出更多蕨草和长长的青草。岸顶的树枝在头顶交接，阳光从叶间的缝隙洒下，一块块亮斑不停变幻，把沟谷化成一条金绿色的有顶长廊。灰绿色石板铺成的小径上，有些地方堆着风吹来的落叶。小路陡峭地向下倾斜，尽头又有一座里面漆黑的圆拱。拱门上方，全是岩石、青草和灌木。
        - id: ch01-b122
          speaker: jimmy
          text: 那里看着像铁路隧道的入口。
        - id: ch01-b123
          speaker: kathleen
          text: 不，那是魔法城堡的入口。咱们吹响号角吧。
        - id: ch01-b124
          speaker: gerald
          text: 别吵！英勇的队长斥责部下愚蠢的闲谈。
        - id: ch01-b125
          speaker: jimmy
          text: 说得好像真有那么回事！
        - id: ch01-b126
          speaker: gerald
          text: 我就知道你会喜欢。队长叫部下小心前进，不许出声。毕竟附近可能有人。另一座拱门也可能是冰窖，或者别的危险地方。
        - id: ch01-b127
          speaker: kathleen
          text: 会有什么危险？
        - id: ch01-b128
          speaker: gerald
          text: 也许有熊。
        - id: ch01-b129
          speaker: jimmy
          text: 英国的熊都关在铁栏后面，没有在外头乱跑的。美国人还把熊叫成八儿呢。
        - id: ch01-b130
          speaker: gerald
          text: 快速行军！
        - id: ch01-b131
          speaker: narrator
          text: 他们又上路了。湿落叶堆在小径上，脚拖过叶子，仍能感觉到底下的路又硬又多石。来到黑暗的拱门前，他们停了下来。
        - id: ch01-b132
          speaker: jimmy
          text: 这里有台阶通到下面。
        - id: ch01-b133
          speaker: gerald
          text: 果然是冰窖。
        - id: ch01-b134
          speaker: kathleen
          text: 我们还是别下去了。
        - id: ch01-b135
          speaker: gerald
          text: 我们的英雄什么也不怕。他重新鼓起卑微随从们动摇的希望，宣布自己非继续前进不可。至于他们，爱怎么样就怎么样。
        - id: ch01-b136
          speaker: jimmy
          text: 你要是骂人，就一个人往下走。我说到做到！
        - id: ch01-b137
          speaker: gerald
          text: 这是游戏的一部分，傻瓜。明天让你当队长。现在你最好闭上嘴，想想轮到你时，该拿什么名字骂我们。
        - id: ch01-b138
          speaker: narrator
          text: 他们极慢、极小心地走下台阶，头顶一直罩着拱形石顶。走到最下面，才发现最后一级根本没有台阶的边沿。那里已经变成一条向左拐的通道。杰拉尔德划亮一根火柴，借着短短的火光看清了前路。
        - id: ch01-b139
          speaker: jimmy
          text: 这条路会把我们带回大路上。
        - id: ch01-b140
          speaker: gerald
          text: 也可能带到大路底下。我们刚才下了十一级台阶。
        - id: ch01-b141
          speaker: narrator
          text: 三个人跟着首领继续走。杰拉尔德走得很慢，照他说，是担心前面还有台阶。通道里黑极了。
        - id: ch01-b142
          speaker: jimmy
          text: 我一点也不喜欢这里！
        - id: ch01-b143
          speaker: narrator
          text: 前方终于出现一线日光。那线光越来越亮，最后化成又一座拱门。门外的景色，就像意大利游记里的彩色插图，叫三个孩子看得连气也喘不过来。他们一句话都说不出，只顾睁大眼睛，呆呆往前走。一条短短的柏树林荫道越走越宽，通向一座宽阔洁白的大理石露台。孩子们在阳光里眨着眼，把手臂搭在宽而平坦的栏杆上，向外凝望。正下方是一座湖，和《意大利胜景》里的湖一模一样。湖上游着天鹅，还有一座小岛，岸边垂着柳树。湖后是碧绿的山坡，一片片树丛散布其间。树木当中，白色雕像的手臂和腿闪着光。左边一座小山旁，立着带圆柱的白色圆形建筑。右边，一道瀑布从布满苔藓的石头间奔泻下来，飞溅着落进湖里。几道台阶从露台通向水边，另外几道则通往湖畔草地。鹿群在远处的草坡上吃草。更远的树丛越来越密，几乎成了森林。林间还矗立着巨大的灰石形体，三个孩子从来没有见过那样的东西。
        - id: ch01-b144
          speaker: gerald
          text: 这就是学校里那个家伙说过的地方。
        - id: ch01-b145
          speaker: kathleen
          text: 这里真的是魔法城堡。
        - id: ch01-b146
          speaker: jimmy
          text: 我根本没看见城堡。
        - id: ch01-b147
          speaker: gerald
          text: 那你管那个叫什么？
        - id: ch01-b148
          speaker: narrator
          text: 他指着一带椴树林后面。白色塔楼和尖塔正从那里伸向天空，划破蓝天。
        - id: ch01-b149
          speaker: kathleen
          text: 四周明明一个人也没有，每样东西却都这么整齐。我相信这里有魔法。
        - id: ch01-b150
          speaker: jimmy
          text: 也许是魔法割草机收拾的。
        - id: ch01-b151
          speaker: kathleen
          text: 要是我们在一本书里，这里肯定就是魔法城堡。
        - id: ch01-b152
          speaker: gerald
          text: 这里就是魔法城堡。
        - id: ch01-b153
          speaker: jimmy
          text: 可世上根本没有魔法。
        - id: ch01-b154
          speaker: gerald
          text: 你怎么知道？难道世界上只有你亲眼见过的东西？
        - id: ch01-b155
          speaker: jimmy
          text: 自从人们有了蒸汽机、报纸、电话，还有无线电报，魔法就已经消失了。
        - id: ch01-b156
          speaker: gerald
          text: 仔细想想，无线电本身也很像魔法。
        - id: ch01-b157
          speaker: jimmy
          text: 哦，原来你说的是那种魔法。
        - id: ch01-b158
          speaker: kathleen
          text: 也许人们不再相信魔法以后，魔法就不肯再做魔法了。
        - id: ch01-b159
          speaker: gerald
          text: 别用那套傻乎乎的不相信，毁了这场好戏。我要拼尽全力相信魔法。这里是魔法花园，那里是魔法城堡，我非把它探个究竟不可。
        - id: ch01-b160
          speaker: narrator
          text: 无畏的骑士领头出发，把无知的侍从留在后面。他们爱跟不跟，悉听尊便。他翻过栏杆，大步走下台阶，坚定地朝草坪前进。靴子一路踏得铿锵作响，每一步都充满决心。另外两个孩子还是跟了上去。除了图画和童话故事，世上从没有过这样的花园。他们从鹿群近旁走过，靠得很近。鹿儿只是抬起秀气的头望了望，一点也不害怕。三个孩子穿过一大片绵延的草地，又从沉沉叠叠的椴树浓荫下走过，终于来到玫瑰园。修剪得厚实齐整的紫杉篱围在四周。园子里的红、粉、绿、白各色在阳光下铺开，仿佛巨人一方五彩缤纷、香气浓烈的大手帕。
        - id: ch01-b161
          speaker: kathleen
          text: 我看马上就会碰见园丁。他会问我们来这里干什么。到时候，你怎么回答？
        - id: ch01-b162
          speaker: narrator
          text: 她问话时，把鼻子埋在一朵玫瑰里。
        - id: ch01-b163
          speaker: gerald
          text: 我就说，我们迷路了。这可完完全全是真话。
        - id: ch01-b164
          speaker: narrator
          text: 可他们既没碰上园丁，也没见到其他任何人。魔法的感觉反而越来越浓。走在这样寂静又宏大的地方，他们几乎连自己的脚步声都害怕起来。玫瑰园后面还有一道紫杉篱，篱上剪出一扇拱门。穿过那扇门，就是一座迷宫，模样和汉普顿宫那座很相仿。
        - id: ch01-b165
          speaker: gerald
          text: 记住我的话。迷宫正中一定藏着魔法的秘密。拔剑吧，我的好汉们！谁也不许出声，奋勇向前，嗬，驾！
        - id: ch01-b166
          speaker: narrator
          text: 他们果真拔出想象中的剑，悄悄前进。紧密的紫杉篱间热极了，通往迷宫中心的路却藏得极好。他们试了一遍又一遍，每次都绕回那道通往玫瑰园的黑色紫杉拱门。天气热得叫人不停擦汗，三个人都庆幸自己带了又大又干净的手帕。第四次回到同一扇拱门时，吉米突然喊了起来。
        - id: ch01-b167
          speaker: jimmy
          text: 啊，我真希望……等等，晚饭到哪儿去了？
        - id: ch01-b168
          speaker: narrator
          text: 三个孩子顿时沉默了。他们终于想起，装晚饭的篮子还留在山洞入口。现在，他们满怀柔情地想着一片片冷羊肉、六只番茄、黄油面包、拧紧的纸包盐、苹果酥饼，还有喝姜汁啤酒用的那只矮胖玻璃杯。
        - id: ch01-b169
          speaker: jimmy
          text: 咱们回去吧，现在立刻回去。拿上东西，好好吃晚饭。
        - id: ch01-b170
          speaker: gerald
          text: 再试一次迷宫。我最讨厌半途放弃。
        - id: ch01-b171
          speaker: jimmy
          text: 我快饿死了！
        - id: ch01-b172
          speaker: gerald
          text: 你怎么不早一点说？
        - id: ch01-b173
          speaker: jimmy
          text: 我刚才还不饿。
        - id: ch01-b174
          speaker: gerald
          text: 那你现在也不可能饿。谁也不会一眨眼就突然饿起来。等等，那是什么？
        - id: ch01-b175
          speaker: narrator
          text: 紫杉篱脚下闪着一道细细的红光。那只是一根极细的线，若不是正一动不动、气冲冲地盯着树篱根，谁也不会注意到。杰拉尔德弯腰捡起来，发现那是一根红棉线。棉线的一端系着一枚有小孔的顶针，另一端却怎么也找不见。
        - id: ch01-b176
          speaker: gerald
          text: 它没有另一端。这就是线索，千真万确！现在谁还稀罕冷羊肉？我一直觉得，有一天会发生魔法。你们看，它真的发生了。
        - id: ch01-b177
          speaker: jimmy
          text: 我猜这是园丁放在这里的。
        - id: ch01-b178
          speaker: gerald
          text: 园丁会在线上系一枚公主的银顶针吗？仔细瞧，顶针上有一顶王冠！
        - id: ch01-b179
          speaker: narrator
          text: 上面的确有一顶王冠。
        - id: ch01-b180
          speaker: gerald
          text: 走吧。你们既然是冒险家，就拿出冒险家的样子来。再说，我猜早有人从那条路经过，把羊肉偷走好几个钟头了。
        - id: ch01-b181
          speaker: narrator
          text: 杰拉尔德沿着红线往前走，一面走，一面把经过的线缠在手指上。那的确是一条线索，领着他们穿过弯弯曲曲的道路，一直走进迷宫中心。就在迷宫最中央，三个孩子看见了那桩奇迹。
        - id: ch01-b182
          speaker: narrator
          text: 红线引他们登上两级石阶，来到一块圆形草地。中央立着一座日晷，四周沿紫杉篱摆着宽而低的大理石长椅。红线笔直穿过草地，又从日晷旁边经过，尽头落进一只褐色的小手。那只小手的每根手指都戴着镶宝石的戒指。手自然连着手臂，手臂上又套着许多手镯，红蓝绿三色宝石闪闪发亮。手臂穿在粉红与金色织锦绸的衣袖里。衣袖有些地方已经褪色，仍然气派得很。它属于一条长裙，穿裙子的女士正躺在石椅上，在阳光中沉睡。玫瑰金色的裙身从中间敞开，露出一条绣花的柔绿色衬裙。她身上的陈旧黄色花边，颜色像烫过的奶油。缀满银星的轻薄白纱，则遮住了她的脸。
        - id: ch01-b183
          speaker: gerald
          text: 是中了魔法的公主。我早就告诉过你们。
        - id: ch01-b184
          speaker: kathleen
          text: 她是睡美人。肯定是她！瞧她的衣服多老式，跟历史课本里玛丽·安托瓦内特身边那些女士一模一样。她已经睡了一百年。杰拉尔德，你年纪最大，一定就是王子。我们从前居然一直不知道！
        - id: ch01-b185
          speaker: jimmy
          text: 她才不是真的公主。
        - id: ch01-b186
          speaker: narrator
          text: 另外两个孩子都笑话他。一来，吉米这种话足以毁掉任何游戏。二来，他们自己也不能肯定，那个像阳光一样一动不动躺着的人，真的不是一位公主。山洞、奇妙的花园、迷宫，还有那根引路的红线，这一路的每一段奇遇，都让魔法的感觉比先前更深一层。走到现在，凯瑟琳和杰拉尔德几乎已经完全着了魔。
        - id: ch01-b187
          speaker: kathleen
          text: 杰里，把面纱揭开。要是她不漂亮，我们就知道她不可能是公主。
        - id: ch01-b188
          speaker: gerald
          text: 你自己去揭。
        - id: ch01-b189
          speaker: jimmy
          text: 我猜这里的人像都不许人碰。
        - id: ch01-b190
          speaker: gerald
          text: 她又不是蜡做的，傻瓜。
        - id: ch01-b191
          speaker: kathleen
          text: 当然不是。太阳这么大，蜡人可受不了。再说，你们看得见她在呼吸。她肯定就是公主。
        - id: ch01-b192
          speaker: narrator
          text: 凯瑟琳轻得不能再轻地捏住面纱边缘，把它向后翻开。两条长长的黑辫子之间，露出公主小巧苍白的脸。她的鼻梁笔直，眉毛像仔细描画出来一样纤细，颧骨和鼻梁上还散着几粒雀斑。
        - id: ch01-b193
          speaker: kathleen
          text: 难怪会有雀斑。她这么多年一直睡在太阳底下呢！虽然她的嘴不像一颗玫瑰花蕾，可她还是很美，对不对？
        - id: ch01-b194
          speaker: gerald
          text: 还不赖。
        - id: ch01-b195
          speaker: kathleen
          text: 好了，杰里。你是年纪最大的。
        - id: ch01-b196
          speaker: gerald
          text: 我当然最大。
        - id: ch01-b197
          speaker: narrator
          text: 可他听上去很不安。
        - id: ch01-b198
          speaker: kathleen
          text: 那么，你就得把公主唤醒。
        - id: ch01-b199
          speaker: jimmy
          text: 她不是公主，只是个穿上戏服的小姑娘。
        - id: ch01-b200
          speaker: narrator
          text: 他说着，把手插进灯笼裤的口袋。
        - id: ch01-b201
          speaker: kathleen
          text: 可她明明穿着一条长裙。
        - id: ch01-b202
          speaker: jimmy
          text: 你看看，她的脚只到裙子那么靠上的地方。等她站起来，个子根本不会比杰里高。
        - id: ch01-b203
          speaker: kathleen
          text: 快点吧，杰里，别犯傻。你非做不可。
        - id: ch01-b204
          speaker: gerald
          text: 你到底要我做什么？
        - id: ch01-b205
          speaker: narrator
          text: 他一边问，一边用右脚去踢左脚的靴子。
        - id: ch01-b206
          speaker: kathleen
          text: 当然是亲她一下，把她吻醒。
        - id: ch01-b207
          speaker: gerald
          text: 我才不干！
        - id: ch01-b208
          speaker: kathleen
          text: 总得有个人来做。
        - id: ch01-b209
          speaker: gerald
          text: 她醒过来，多半马上就会揍我。
        - id: ch01-b210
          speaker: kathleen
          text: 我倒是一点也不怕亲她。可我来亲，大概没有用。
        - id: ch01-b211
          speaker: narrator
          text: 凯瑟琳果真亲了一下，可一点用也没有。公主还是沉沉睡着。
        - id: ch01-b212
          speaker: kathleen
          text: 那就非你不可了，吉米。也许你会管用。亲完赶快跳开，免得她打你。
        - id: ch01-b213
          speaker: gerald
          text: 她才不会打他。他那么一丁点儿大。
        - id: ch01-b214
          speaker: jimmy
          text: 你自己才小！我不怕亲她，也不像某些人，是个胆小鬼。不过要是我来亲，今天剩下的时间里，都得让我当无畏的首领。
        - id: ch01-b215
          speaker: gerald
          text: 不行，你等一等。也许还是让我来。
        - id: ch01-b216
          speaker: narrator
          text: 可就在这时，吉米已经在公主苍白的脸颊上，响亮而痛快地亲了一口。三个孩子屏住呼吸，等待结果。
        - id: ch01-b217
          speaker: narrator
          text: 结果终于出现了。公主睁开一双又大又乌黑的眼睛，向外伸展双臂，轻轻打了个呵欠，又抬起褐色的小手遮住嘴。接着，她口齿清清楚楚地开了口。每一个字都明白得很，谁也不可能听错。
        - id: ch01-b218
          speaker: princess
          text: 这么说，一百年已经过去了？紫杉篱长得多高啊！你们当中哪一位是我的王子，把我从漫长百年的沉睡中唤醒？
        - id: ch01-b219
          speaker: jimmy
          text: 是我。
        - id: ch01-b220
          speaker: narrator
          text: 吉米答得毫不畏惧，因为公主看起来不像会给谁一巴掌。
        - id: ch01-b221
          speaker: princess
          text: 我高贵的救命恩人！
        - id: ch01-b222
          speaker: narrator
          text: 公主伸出一只手，吉米使劲握了握。
        - id: ch01-b223
          speaker: jimmy
          text: 可是我说，你不真是公主，对不对？
        - id: ch01-b224
          speaker: princess
          text: 我当然是。不然还能是谁？你们看我的王冠！
        - id: ch01-b225
          speaker: narrator
          text: 她把缀着亮片的面纱拉到一旁，露出藏在下面的小冠冕。冠冕上的宝石在日光中闪闪发亮。就连一路上都不肯相信她是公主的吉米，这时也不得不看出来，那些宝石的确是钻石。
        - id: ch01-b226
          speaker: jimmy
          text: 可是，我还是觉得不对。
        - id: ch01-b227
          speaker: princess
          text: 咦，你们一定早就知道我在这里，不然绝不会找来。那些龙守在路上，你们是怎么闯过来的？
        - id: ch01-b228
          speaker: narrator
          text: 杰拉尔德没有回答她的问题。
        - id: ch01-b229
          speaker: gerald
          text: 我说，你真的相信魔法，还有那一整套东西吗？
        - id: ch01-b230
          speaker: princess
          text: 要是连我都不该相信，还有谁应该相信？你们瞧，这里就是我被纺锤刺破手指的地方。
        - id: ch01-b231
          speaker: narrator
          text: 她给他们看手腕上的一道小疤。
        - id: ch01-b232
          speaker: gerald
          text: 这么说，这里真的就是魔法城堡？
        - id: ch01-b233
          speaker: princess
          text: 当然是。你们可真笨！
        - id: ch01-b234
          speaker: narrator
          text: 公主从大理石长椅上站了起来。那条粉红织锦长裙随即落在她脚边，铺开一道又一道鲜亮的波浪。
        - id: ch01-b235
          speaker: jimmy
          text: 我早说过，她的裙子会太长。
        - id: ch01-b236
          speaker: princess
          text: 我睡着时，它明明正合身。一定是过了一百年，裙子也跟着长长了。
        - id: ch01-b237
          speaker: jimmy
          text: 我还是不相信你是公主。至少，我不完全相信。
        - id: ch01-b238
          speaker: princess
          text: 你不爱信，就不用费心去信。你相信什么没那么要紧，要紧的是我到底是什么人。
        - id: ch01-b239
          speaker: narrator
          text: 她转向另外两个孩子。
        - id: ch01-b240
          speaker: princess
          text: 我们回城堡去吧。我把所有漂亮的珠宝和好东西都给你们看。你们难道不想看吗？
        - id: ch01-b241
          speaker: gerald
          text: 想倒是想。可是，还有一件事。
        - id: ch01-b242
          speaker: narrator
          text: 谁都听得出他有多么迟疑。
        - id: ch01-b243
          speaker: princess
          text: 可是什么？
        - id: ch01-b244
          speaker: narrator
          text: 公主已经有点不耐烦了。
        - id: ch01-b245
          speaker: gerald
          text: 可是我们已经饿坏了。
        - id: ch01-b246
          speaker: princess
          text: 啊，我也是！
        - id: ch01-b247
          speaker: gerald
          text: 我们从早饭以后，什么都没吃。
        - id: ch01-b248
          speaker: princess
          text: 现在已经三点了。你们已经一小时、一小时、又一小时没吃东西。可也想想我吧！我整整一百年，什么都没有吃。快跟我回城堡。
        - id: ch01-b249
          speaker: jimmy
          text: 老鼠肯定已经把所有东西都吃光了。
        - id: ch01-b250
          speaker: narrator
          text: 吉米一想到所有食物都可能没了，便伤心起来。可到了这时，他也终于看得出来，眼前这个女孩的确是一位公主。
        - id: ch01-b251
          speaker: princess
          text: 才不会呢！你们忘了吗？这里的一切都中了魔法。一百年来，时间根本没有动过，食物当然也不会让老鼠吃掉。快跟我走吧。你们得有一个人替我提着裙裾。裙子在这一百年里长得这么吓人，要是不把它提起来，我连一步也走不了。
