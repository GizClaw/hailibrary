audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 讲究而端庄，偶尔流露笑意
        timbre: 轻盈成熟的女声
        pace: 从容
        pitch: 中高音
    constable_johnson:
      display_name: 约翰逊警官
      tts:
        delivery: 诙谐随意，谈到案情时沉稳笃定
        timbre: 厚实的成年男声
        pace: 从容
        pitch: 中低音
    aunt:
      display_name: 梅布尔的姨妈
      tts:
        delivery: 文雅克制，焦急时严厉而急促
        timbre: 纤细成熟的女声
        pace: 从容
        pitch: 中音
    burglar_1:
      display_name: 盗贼甲
      tts:
        delivery: 粗野警觉，压低声音说话
        timbre: 沙哑的成年男声
        pace: 稍快
        pitch: 低音
    burglar_2:
      display_name: 盗贼乙
      tts:
        delivery: 暴躁粗鲁，带着紧张
        timbre: 粗重的成年男声
        pace: 稍快
        pitch: 低音
    eliza:
      display_name: 伊莱扎
      tts:
        delivery: 朴实爽快，受惊时喃喃自语
        timbre: 年轻质朴的女声
        pace: 自然偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 麻烦有两层。杰拉尔德戴着戒指，怎么也摘不下来，所以谁都看不见他。梅布尔却正好相反。她原先隐着身，还能偷偷带进屋。现在明明白白现了形，根本藏不住。回去以后，孩子们既要解释同行的伙伴为什么凭空少了一个，又要说明这个从未见过的女孩为什么忽然出现在眼前。一个看不见的孩子，加上一个多出来的陌生人，哪一件都不好交代。
        - id: ch01-b02
          speaker: princess
          text: 我不能回姨妈那里。我就是不回去。哪怕让我现形二十遍，我也不回去。
        - id: ch01-b03
          speaker: gerald
          text: 你一回去，她准会怀疑那位开汽车的太太，还有收养你的事。可我们又怎么向法国女教师解释你呢？
        - id: ch01-b04
          speaker: narrator
          text: 杰拉尔德一边说，一边拼命拽戒指。梅布尔提醒他，不如把真相说出来。
        - id: ch01-b05
          speaker: kathleen
          text: 她不会相信。就算她信了，也会瞪着眼睛，彻彻底底发疯的。
        - id: ch01-b06
          speaker: gerald
          text: 那就不能告诉她。不过她其实挺通情达理。我们可以说天太晚了，你来不及回家，求她留你住一夜。
        - id: ch01-b07
          speaker: jimmy
          text: 梅布尔是好办了，你自己呢？
        - id: ch01-b08
          speaker: gerald
          text: 我就说头疼，上床睡觉。这可不算撒谎，我现在真头疼。一定是太阳晒的，黑铅最会把阳光全吸过来。
        - id: ch01-b09
          speaker: jimmy
          text: 我看更像是梨和姜饼害的。走吧。要是隐身的是我，我可不会因为这点傻头疼就上床，我一定干点别的。
        - id: ch01-b10
          speaker: narrator
          text: 杰拉尔德的声音忽然从吉米身后问，他会去干什么。吉米吓得猛跳一下，心也跟着七上八下。他叫这个看不见的傻杜鹃别再乱跑，老老实实走到自己和凯茜中间。杰拉尔德照办了，可那片空地方看起来仍旧什么也没有。声音从那里又问了一遍，吉米终于有了答案。
        - id: ch01-b11
          speaker: jimmy
          text: 我去当强盗。
        - id: ch01-b12
          speaker: narrator
          text: 凯瑟琳和梅布尔同时说，偷东西可不对。两个人的话一齐冲着吉米来了，他只好马上把强盗改成侦探。梅布尔又指出，总得先有案子可查，人才当得成侦探。可吉米觉得，这也难不倒他。
        - id: ch01-b13
          speaker: jimmy
          text: 侦探也不一定查得出东西。实在没案子，我就当个破不了案的侦探，照样能玩个痛快。杰拉尔德，你也可以试试呀。
        - id: ch01-b14
          speaker: gerald
          text: 我正要这么办。先绕到警察局去，看看他们手上有什么案子。
        - id: ch01-b15
          speaker: narrator
          text: 他们果真绕到警察局，在门外的告示牌前站下来，一张张读过去。有人丢了两条狗，有人丢了一只钱包，还有人丢了一夹文件。告示特意声明，那些文件“除失主本人外，于任何人均无价值”。最像大案的，是霍顿庄园遭人闯入，许多银器失窃。谁能提供线索，帮忙找回失物，就有二十英镑赏金。
        - id: ch01-b16
          speaker: gerald
          text: 这桩案子归我，我来破。约翰逊要下班了，吉米，你去问他。冷酷无情的大侦探如今隐着身，没法亲自套话，只好看英雄的小弟弟能不能问得像样一点。
        - id: ch01-b17
          speaker: narrator
          text: 吉米叫住正要下班的约翰逊警官，先喊了一声他的名字。约翰逊回他一句“小毛头”，吉米立刻说，你自己才是毛头，不过并没有真生气。警官笑着问，这么晚了，几只本该回小窝窝的鸟怎么还在外面。凯瑟琳说，他们去了集市，那里有个魔术师，真希望约翰逊也亲眼看看。
        - id: ch01-b18
          speaker: constable_johnson
          text: 我听说啦。全是障眼法，手快得把眼睛骗过去罢了。
        - id: ch01-b19
          speaker: narrator
          text: 这就是杰拉尔德的盛名了。刚刚还被集市上的人当成真正的魔术师，如今到了约翰逊嘴里，不过是个会障眼法的骗子。杰拉尔德站在暗处，只好摇响口袋里的零钱安慰自己。约翰逊立刻警觉起来，追问是什么声音。吉米完全诚实地回答，那是他们的钱在响。
        - id: ch01-b20
          speaker: constable_johnson
          text: 有些人命真好。我只盼兜里也能装满钱，摇出这种响声。
        - id: ch01-b21
          speaker: princess
          text: 那你为什么不去拿二十英镑赏金呢？
        - id: ch01-b22
          speaker: constable_johnson
          text: 因为咱们这自由王国里，不列颠就算统治着海洋，你也不能只凭怀疑抓人。哪怕明知道是谁干的，也不成。
        - id: ch01-b23
          speaker: jimmy
          text: 这也太不像话了。那你觉得是谁偷的？
        - id: ch01-b24
          speaker: constable_johnson
          text: 不是觉得，是知道。那家伙是警方的老熟人，犯过一大堆案子。可我们每回都没法坐实，也凑不够证据定他的罪。
        - id: ch01-b25
          speaker: jimmy
          text: 等我离开学校，就来拜你为师，当个侦探。眼下我们得回去侦查晚饭了。晚安！
        - id: ch01-b26
          speaker: narrator
          text: 他们看着约翰逊宽阔的背影穿过警察局的弹簧门。门晃了几下，四周又安静下来。这时，看不见的杰拉尔德才满腹怨气地开口。他骂吉米的脑子还不如一个半便士小面包，最要紧的细节一样没问，银器什么时候丢的，强盗又是怎么进去的，全不知道。吉米替自己辩解，说至少问出了警察知道谁是贼。
        - id: ch01-b27
          speaker: gerald
          text: 对，就问出一个傻警察的傻猜想。回家侦查你的宝贝晚饭吧，你也就配干这个。
        - id: ch01-b28
          speaker: narrator
          text: 梅布尔问，那他自己吃什么。
        - id: ch01-b29
          speaker: gerald
          text: 小面包，半便士一个的。吃着它们，我就会想起亲爱的小弟弟和小妹妹。你们总还有脑子，知道替我买吗？我这样可进不了店。
        - id: ch01-b30
          speaker: princess
          text: 别这么讨人嫌。我们已经尽力了。我要是凯茜，就叫你吹着口哨等，才不给你买那些讨厌的小面包。
        - id: ch01-b31
          speaker: gerald
          text: 你要是凯茜，我早就离家出走了。家里有个吵闹的妹妹，再好的大宅子也不如流浪货船的小舱房。可你现在到底是外人。我弟弟妹妹知道，他们勇敢的首领什么时候在开玩笑。
        - id: ch01-b32
          speaker: kathleen
          text: 可我们看不见你的脸，就分不清呀。我刚才真以为你气坏了，吉米也是。
        - id: ch01-b33
          speaker: narrator
          text: 杰拉尔德说了声“胡说”，领大家去面包店。凯茜和吉米进店买东西，他和梅布尔留在橱窗外。两个人隔着玻璃，眼巴巴看着黄色薄纱下的果酱挞、瑞士卷、维多利亚夹心蛋糕和巴斯小圆面包。等待的时候，杰拉尔德凑到梅布尔耳边，滔滔不绝讲起自己投身侦探事业后的计划和希望。
        - id: ch01-b34
          speaker: gerald
          text: 今晚我会把眼睛睁得大大的，什么也不放过。钱包和银器的案子可以查，说不定还能发现一桩没发生的罪案。我会守着可疑的人，看他们离开镇子，再悄悄跟上。等他们手捧价值连城的珠宝，我就当场抓住，再把他们交出去。
        - id: ch01-b35
          speaker: narrator
          text: 梅布尔猛地尖叫，把他从美梦里惊醒。杰拉尔德以为硬苹果害她肚子疼，她却说，自己刚想起一件可怕的事。
        - id: ch01-b36
          speaker: princess
          text: 镶板房间的窗户！我们离开城堡时，窗户和百叶窗都开着，里头还放着珠宝。姨妈从来不进那间房。没办法，我现在就得回去。
        - id: ch01-b37
          speaker: narrator
          text: 正说到这里，另外两个孩子提着小面包走出店门。大家赶紧把窗户的事讲给他们听。梅布尔说完，凯瑟琳也觉得她非回去不可。吉米却没看出回去有什么用，因为镶板房间的钥匙还插在门的里面。梅布尔越想越难过。她说，姨妈发现窗户开着以后，只能叫园丁搬来梯子，从外面爬上去了。
        - id: ch01-b38
          speaker: gerald
          text: 有我呀！隐身的杰里比园丁和梯子都高明。我顺着常春藤爬进去，关好窗户和百叶窗，把钥匙挂回钉子，再从后门溜出来。那些仆人谁也不会察觉。时间还早，强盗哪会这么快就动手。
        - id: ch01-b39
          speaker: princess
          text: 你不会害怕吗？万一给抓住了，安全吗？
        - id: ch01-b40
          speaker: gerald
          text: 安全得很。他们根本抓不住我。
        - id: ch01-b41
          speaker: narrator
          text: 杰拉尔德很奇怪，这回担心他的居然是梅布尔，不是凯瑟琳。平日一碰到冒险，凯瑟琳总要为其中的危险和胡闹操心，多少还有点烦人。可现在她只平静地跟梅布尔告别，约好明早十点半在花神殿见，还盼梅布尔不会因为那位根本不存在的“汽车太太”挨一顿狠骂。吉米更干脆，又念起了回家侦查晚饭。
        - id: ch01-b42
          speaker: gerald
          text: 好吧。你们把食品储藏室的窗户留着，等我办完案子从那里进去。走吧，梅布尔。还有，小面包得归我。
        - id: ch01-b43
          speaker: narrator
          text: 杰拉尔德心里发酸。这么大的冒险就要开始了，多年来他一向享有的同情和关注却像计程车的计价器，说停就停。照理说，这时候所有人都该围着他转，可他们居然还顾得上晚饭。好吧，他才不在乎。他语气尖刻地交代完储藏室的窗户，又抓住梅布尔的手。临走前，他忽然想起小面包，一把抢过纸袋塞给她。四只靴子敲着大街的人行道，脚步声一路回荡，梅布尔奔跑的身影渐渐缩小。另一边，法国女教师正坐在客厅窗边，借着将尽的天光读信。
        - id: ch01-b44
          speaker: mademoiselle
          text: 啊，你们回来啦！又迟到了。我的小杰拉尔德呢？
        - id: ch01-b45
          speaker: narrator
          text: 这问题明明躲不过，吉米的侦探计划却偏偏没准备答案。这一刻实在可怕。房里半天没人出声，仿佛只要一直沉默，杰拉尔德就不必有去处。最后还是吉米开口，说哥哥头疼，已经上床睡觉了。这当然是真的，至少杰拉尔德先前的确这样说过。
        - id: ch01-b46
          speaker: mademoiselle
          text: 可怜的杰拉尔德！我要不要给他送些晚饭？
        - id: ch01-b47
          speaker: kathleen
          text: 他一犯头疼，从来不吃东西。
        - id: ch01-b48
          speaker: narrator
          text: 这话也是真的。于是吉米和凯瑟琳安心上了床，对哥哥在外面的冒险没有一丝忧虑。法国女教师又拿出那捆信，坐在简单晚餐留下的一片狼藉中，一封接一封读下去。另一边，杰拉尔德和梅布尔仍走在柔和的夏夜暮色中。他们离城堡还有一段路。
        - id: ch01-b49
          speaker: gerald
          text: 这么晚还在外面，真痛快。
        - id: ch01-b50
          speaker: princess
          text: 是啊。但愿姨妈不要气疯了才好。
        - id: ch01-b51
          speaker: narrator
          text: 在旁人看来，梅布尔像是孤零零一个人，沿着大路一步步往前挪。杰拉尔德好心劝她再吃一个小面包，黑暗里便响起两个人亲密的咀嚼声。到了雅尔丁塔楼，他们走到专供仆役出入的那扇门前。开门的竟是姨妈本人。她没有马上看梅布尔，反倒先越过这个脸色惨白、浑身发抖的女孩往外张望，仿佛还等着看见一个更高的人。谁也没有出现。梅布尔只好用极小的声音叫她。
        - id: ch01-b52
          speaker: aunt
          text: 你这个淘气丫头！怎么能把我吓成这样？我真该罚你躺一个星期。噢，梅布尔，谢天谢地，你平安回来了！
          emotion: surprised
        - id: ch01-b53
          speaker: narrator
          text: 姨妈先吓得往后一退，随即又朝梅布尔跨了一步。话还没说完，她的双臂已经一把抱住外甥女，梅布尔也紧紧搂住她。她们从来没有用这样的拥抱相逢过。直到这时，梅布尔才慢慢明白，姨妈不是装模作样。她当真一直担心，也当真因为孩子平安回来而高兴。
        - id: ch01-b54
          speaker: princess
          text: 可今天早晨，您好像一点也不在乎。我当时就在旁边听着。姨妈，别生气。
        - id: ch01-b55
          speaker: aunt
          text: 现在你平安回来了，我觉得自己再也不会生你的气了。
        - id: ch01-b56
          speaker: princess
          text: 可这是怎么回事？
        - id: ch01-b57
          speaker: aunt
          text: 亲爱的，我像是中了邪，恐怕要生病了。我一直疼你，只是不肯把你宠坏。可昨天下午三点半，我在集市上跟卢森先生谈起你，忽然觉得你一点也不重要。收到信时是这样，那几个孩子来时也是这样。直到今天喝下午茶，我才一下清醒，知道你不见了。那一刻太可怕了。梅布尔，你为什么要这么做？
        - id: ch01-b58
          speaker: princess
          text: 我只是开个玩笑。
        - id: ch01-b59
          speaker: narrator
          text: 梅布尔有气无力地答完，和姨妈进了屋。大门关在杰拉尔德面前。
        - id: ch01-b60
          speaker: gerald
          text: 这也太古怪了，看来又是魔法。事情离水落石出还远着呢。这座城堡的秘密，可不只是眼睛看见的那些。
        - id: ch01-b61
          speaker: narrator
          text: 他说得没错，这座城堡确实还有更多秘密。不过，那一夜的杰拉尔德自己还不知道，我们若抢先讲出来，对他可不公平。他独自隐着身，穿过幽暗而广阔的庭园，去找镶板房间那扇开着的窗户。他走过一片片沾满露水的草坪，又穿过一丛丛灌木和树木。池水躺在暗处，像巨大的镜子，映着安静的星星。雕像雪白的手脚也在阴影前微微发亮。走着走着，他心里有了另一种感觉。不是兴奋，不是惊讶，也不是不安，而是完全不同的东西。
        - id: ch01-b62
          speaker: narrator
          text: 隐身的公主让他惊奇，集市上的魔术叫他兴奋，忽然决定当侦探，又给他添了不少忧虑。这些事虽然奇妙又罕见，似乎仍没有越出可能发生的圈子。化学实验里，两种液体倒在一起会冒出火焰，那也很奇妙。手彩让人惊讶，杂耍叫人心里发紧，可它们终究还只是实验、手彩和杂耍。眼前这座花园却不同。白天，花园像梦。到了夜里，它却变成了幻境。
        - id: ch01-b63
          speaker: narrator
          text: 他低头看不见自己的双脚，只看见带露珠的草叶被无形的脚一步步拨向两旁。那一刻，一种难以形容，却真实得永远忘不了的感觉涌了上来。他觉得自己走进了另一个世界。新世界像地毯铺在地板上，把原来的世界盖在下面。地板当然还在那里，他脚下踩的却是上面的地毯。这张地毯浸透了魔法，就像草地浸透了露水。这感觉奇妙极了。也许有一天，你也会遇见。世上仍有几个地方能叫人这样觉得，只是它们一年比一年少。
        - id: ch01-b64
          speaker: narrator
          text: 花园的魔力留住了杰拉尔德。
        - id: ch01-b65
          speaker: gerald
          text: 现在进去还太早。以后说不定再也不能在夜里来这里。我想，是夜色把一切都变了模样。
        - id: ch01-b66
          speaker: narrator
          text: 垂柳下有白影动了一下。两只白手分开沙沙响的长叶，一个长角、长着山羊腿的白东西走了出来，可头和胳膊却像男孩。杰拉尔德竟一点也不怕。这才最奇妙，虽然他绝不会承认。那东西伸展四肢，在草上打个滚，又翻身站起，蹦跳着穿过草坪。柳树下还留着一点白光。杰拉尔德走近三步，看见一座空了的雕像基座。
        - id: ch01-b67
          speaker: gerald
          text: 它们活过来了。雕像全都活过来了。
        - id: ch01-b68
          speaker: narrator
          text: 又一道白影走出花神殿，一闪便钻进月桂树丛。接着，车道的碎石上传来咯吱咯吱的碾压声。一个长得吓人、深灰色的庞然大物，正缓慢又沉重地朝他爬来。月亮恰好在这时钻出云层，让他看清了它。那是水晶宫里陈列的那种巨型蜥蜴，用石头雕成。它的身体大得骇人，跟千百万年前、人类尚未出现、这种巨兽还是世界主人时一模一样。
        - id: ch01-b69
          speaker: gerald
          text: 它看不见我。我不怕。它也活了。
        - id: ch01-b70
          speaker: narrator
          text: 巨兽扭动着从他身边爬过。杰拉尔德伸出一只手，碰了碰那条巨大尾巴的侧面。入手分明是石头。它并没有像他先前想象的那样，从雕像变成血肉。它仍旧是石头，只是这块石头本身活着。被他一碰，石兽便转过头来。杰拉尔德也马上转身，用尽全身力气往宅子飞奔。就在手指触到冰冷石头的那一刻，恐惧忽然闯进花园，差一点把他捉住。他拼命逃避的其实不是那头会动的石兽，而是紧追在身后的恐惧本身。
        - id: ch01-b71
          speaker: narrator
          text: 他一路跑到第五扇窗下面，停下来大口喘气。墙上攀着盘曲的常春藤，他抓住藤枝，一点点爬上窗台。站稳以后，他回头望向灰色的斜坡。那座刚才倒映星光的鱼池里水花四溅，石兽正在睡莲叶间的浅水里翻滚。可等他翻进房间，再转身朝外看时，鱼池已经恢复平静，黑沉沉的水面只映着月亮。月光穿过垂柳枝条间的一处空隙，落在一座雕像身上。它安静地站在基座上，一动也不动。花园里的一切都回了原位，没有任何东西挪动，也没有一丝声响。
        - id: ch01-b72
          speaker: gerald
          text: 怪得不得了。没想到走过花园也能睡着，还能做那样的梦。
        - id: ch01-b73
          speaker: narrator
          text: 他关上窗户，划亮一根火柴，把百叶窗合拢。第二根火柴替他照出了房门。他转动钥匙，走出去，又从外面把门锁好，最后将钥匙挂回原来的钉子。到了过道尽头，他停在那里。反正隐着身，谁也发现不了他。他只需等火柴刺眼的亮光慢慢从眼前散去，就能重新借大厅窗户漏进来的月光认路。那些没有百叶窗的窗户装着铁栏，月光从栏杆间穿过，在地板上洒出一块块亮斑。
        - id: ch01-b74
          speaker: gerald
          text: 厨房究竟在哪儿？随便开几扇门，应该没关系吧。我还隐着身吗？对，手举到眼前都看不见。那就走吧！
        - id: ch01-b75
          speaker: narrator
          text: 他已经把自己是侦探这回事忘得一干二净，只急着回去，把花园里的怪梦从头到尾讲给大家听。他开过一扇又一扇门，在许多长房间里来回寻找。家具都罩着棕色粗布，在奇异的月光下看起来却像白色。高高的天花板上，枝形吊灯一盏盏套在大布袋里。有的墙挤满画像，像是活着。另一些墙被一排又一排古书压得寂静无声。他还闯进几间华丽的寝室，里面摆着挂羽饰的巨大四柱床，伊丽莎白女王想必也曾睡过。顺便说一句，那位女王在自己家里一定待得很少，因为英国仿佛每一幢老宅都说她在那里睡过。
        - id: ch01-b76
          speaker: narrator
          text: 厨房还是没找到。最后，一扇门外出现石阶、狭窄的石廊，又有石阶向下通去。尽头一扇门底下透着灯光。不知为什么，杰拉尔德很难伸手推它。
        - id: ch01-b77
          speaker: gerald
          text: 胡闹，别犯傻！你到底隐没隐身？
        - id: ch01-b78
          speaker: narrator
          text: 他推开门，里面立刻响起一声粗吼。一个男人冲到门口，用提灯照遍过道。杰拉尔德赶紧退到墙边，紧贴墙站着。
        - id: ch01-b79
          speaker: burglar_1
          text: 没事，只是这扇重门自己荡开了。
        - id: ch01-b80
          speaker: burglar_2
          text: 该死的门！我还真以为这回被人逮住了。
          emotion: fearful
        - id: ch01-b81
          speaker: narrator
          text: 两个人重新关上门。杰拉尔德一点也不介意，反倒更愿意让那扇厚门隔在自己和他们中间。他不喜欢那几个男人的模样。他们身上有股威胁人的气息，站在他们面前，连隐身也像一层太薄的伪装。不过他已经看得够多了，也看出自己对那帮匪徒的猜测果然没错。凭着惊人的运气，也就是打牌的人所说的新手好运，他当侦探的第一夜就撞见了一桩正在进行的盗案。
        - id: ch01-b82
          speaker: narrator
          text: 门缝里，那些男人正从两只大箱子里不停取出银器。他们把每一件银器用破布裹好，再装进粗呢口袋。房间的铁门足有六英寸厚，杰拉尔德这才知道，自己误打误撞找到了城堡的保险库。那样结实的门锁也已经被撬开了。盗贼用过的工具全留在地上，整整齐齐摆在一卷布套里，就像木雕匠把一把把凿子收进专用的套子。
        - id: ch01-b83
          speaker: burglar_1
          text: 快点，别磨蹭一整夜。
        - id: ch01-b84
          speaker: narrator
          text: 银器轻轻碰响。
        - id: ch01-b85
          speaker: burglar_2
          text: 那些托盘叫你摇得跟该死的响板一样。
        - id: ch01-b86
          speaker: narrator
          text: 杰拉尔德转过身，小心又飞快地离开。这件事说来真怪。先前心里没有别的事可想时，他怎么也找不到通往仆役侧厅的路。现在脑子里塞满银叉、银杯，还得时时想着，会不会有人正从身后的曲折过道追来，他反而不再迷路，像一支箭似的直奔那扇正确的门。那扇门正从大厅通向他要去的地方。一路上，刚才的经历自己在他脑中变成了词句。
        - id: ch01-b87
          speaker: gerald
          text: 幸运的侦探取得了连做梦也想不到的成功，亲自离开现场，去寻找援助。
        - id: ch01-b88
          speaker: narrator
          text: 可什么援助才有用？宅子里当然有男仆和姨妈，但一个看不见的声音，陌生人不会当回事。梅布尔也帮不了多少。等警察找来，强盗恐怕早已背着一袋袋银器逃走。杰拉尔德两手抱住脑袋，拼命思索，就像你有时对着简单方程，或英国内战的战役日期那样。
        - id: ch01-b89
          speaker: narrator
          text: 他取出铅笔和笔记簿，找到一处窗台，把当时能搜出的聪明才智全用上，写了一封信。信里先提醒收信人，她知道存放银器的是哪间房。接着写明，强盗此刻正在里面行窃，厚重的铁门已经被撬开，请马上派人去叫警察。如果警察赶到现场以前强盗逃走，他就跟在后面追踪。写到这里，他迟疑片刻，又在末尾补上一句：“一位朋友敬上，这不是恶作剧。”
        - id: ch01-b90
          speaker: narrator
          text: 杰拉尔德解下一根鞋带，把信紧紧绑在石头上。屋里，梅布尔和姨妈正沉浸在团圆的热情中，享用一顿格外诱人的夜宵。桌上有炖李子和奶油，有海绵蛋糕，有装在杯子里的蛋奶糊，还有冷面包黄油布丁。隐着身又饿着肚子的杰拉尔德，扔石头前还依依不舍地望了夜宵一眼。随后，石头砰的一声穿过窗户。屋里响起尖叫。他一直等到叫声停下，看着她们捡起石头，解下信，读完警告。
        - id: ch01-b91
          speaker: aunt
          text: 胡说！太恶毒了，当然是恶作剧。
        - id: ch01-b92
          speaker: princess
          text: 求您照信上说的，快叫警察吧！
          emotion: fearful
        - id: ch01-b93
          speaker: aunt
          text: 照谁说的？
        - id: ch01-b94
          speaker: princess
          text: 不管是谁说的，求您了。
          emotion: fearful
        - id: ch01-b95
          speaker: gerald
          text: 马上叫警察。你不叫，以后只能怪自己。我已经没法再帮你了。
        - id: ch01-b96
          speaker: aunt
          text: 我，我要放狗咬你！
          emotion: fearful
        - id: ch01-b97
          speaker: princess
          text: 姨妈，别这样！信里说的是真的，我知道是真的。快去叫醒贝茨！
          emotion: fearful
        - id: ch01-b98
          speaker: narrator
          text: 姨妈说自己一个字也不信。梅布尔却不停央求，坚持要叫醒贝茨。贝茨被闹醒后，同样不信这张警告纸条。可看完以后，他总得做个选择。要么亲自走到保险库，看看那里果真没有任何值得相信的事。要么骑上自行车，去把警察叫来。他宁愿选后一个。等警察赶到，保险库的门已经半开着，三个男人搬得动的银器全都不见了。
        - id: ch01-b99
          speaker: narrator
          text: 那一夜稍晚，杰拉尔德的铅笔和笔记簿又派上了用场。至于他后来拿它们做了什么，这时还没有说。直到清晨五点，他才终于爬上床，整个人累得筋疲力尽，身体冷得像块石头。两小时后，伊莱扎的声音就在耳边响起来。她来叫杰拉尔德起床，说已经七点，外头又是个晴天，还说昨夜又出了一桩盗窃案。她一边说一边拉起窗帘，随后转身望向床铺，突然大叫起来。
        - id: ch01-b100
          speaker: eliza
          text: 我的老天爷！床让黑东西弄得一塌糊涂，人却不在！哎哟我的天！
          emotion: surprised
        - id: ch01-b101
          speaker: narrator
          text: 伊莱扎第一声尖叫，把凯瑟琳从自己的房间里引了过来，也把吉米吵醒了。他在床上坐起身，不停揉眼睛。凯瑟琳赶紧问，究竟出了什么事。伊莱扎像是腿上忽然没了力气，重重坐到一只箱子上，这才说出自己刚才看见的情形。
        - id: ch01-b102
          speaker: eliza
          text: 我可好久没受过这种惊吓了。刚才床还是空的，黑得像烟囱背面，人也不在。再看一眼，他又一直躺在那儿。我准是犯傻了。昨天听见那些闹鬼的天使声音时，我就知道不对。杰拉尔德少爷，我一定把你的鬼把戏告诉法国女教师。你把自己涂黑，还蹭坏干净床单和枕套，真是太过分了。
        - id: ch01-b103
          speaker: gerald
          text: 听着，我要告诉你一件事。你能保守秘密吗？
        - id: ch01-b104
          speaker: narrator
          text: 杰拉尔德脸上的黑铅只擦掉了一半，那张灰扑扑的脸显得格外认真。伊莱扎听见他说有事相告，只从鼻子里哼了一声。这当然不大礼貌，可她刚刚受了那样的惊吓，还远远没有缓过来。等杰拉尔德认真问她能不能保守秘密时，她倒很干脆地答应了。
        - id: ch01-b105
          speaker: gerald
          text: 那你就保守这个秘密，我给你两个先令。
        - id: ch01-b106
          speaker: eliza
          text: 可你刚才要告诉我的是什么？
        - id: ch01-b107
          speaker: gerald
          text: 就是这件事。两个先令，还有保密。你把嘴闭紧。
        - id: ch01-b108
          speaker: eliza
          text: 我本来不该收的。好了，杰拉尔德少爷，快起床吧。洗脸时记得把犄角旮旯全洗干净。
        - id: ch01-b109
          speaker: narrator
          text: 伊莱扎嘴上推辞，手却急急伸了出去。等她离开，凯瑟琳立刻抱住哥哥，说他能平安回来，自己实在太高兴。杰拉尔德冷冷提醒她，昨晚可没看出她有多在乎。
        - id: ch01-b110
          speaker: kathleen
          text: 我真不知道自己昨晚怎么会放你走。那时我的确一点也不在乎。可今天早晨醒来，我就全想起来了！
        - id: ch01-b111
          speaker: gerald
          text: 好了，够了。黑铅会蹭到你身上。
        - id: ch01-b112
          speaker: narrator
          text: 凯瑟琳还是不管不顾地抱着他。吉米问，杰拉尔德是怎么重新现形的。
        - id: ch01-b113
          speaker: gerald
          text: 她叫我的时候，我就忽然现形了。戒指自己掉了下来。
        - id: ch01-b114
          speaker: kathleen
          text: 快把所有事从头到尾讲给我们听。
        - id: ch01-b115
          speaker: gerald
          text: 现在不讲。
        - id: ch01-b116
          speaker: narrator
          text: 他答得神神秘秘，显然不肯立刻交代夜里的经历。大家只好先去吃早餐。等早餐结束，吉米想起那枚让人隐身的戒指，马上追问戒指去了哪里。他觉得杰拉尔德已经试过，这一次怎么也该轮到自己戴一戴了。
        - id: ch01-b117
          speaker: gerald
          text: 我忘了。大概还在床上什么地方。
        - id: ch01-b118
          speaker: narrator
          text: 可床上没有。伊莱扎已经把床铺收拾好了。
        - id: ch01-b119
          speaker: eliza
          text: 我敢发誓，那里根本没有戒指。要是真有，我早就看见了。
