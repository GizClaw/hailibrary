  chapters:
    - id: ch01
      title: CHAPTER IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The trouble came in two parts. Gerald had put on the ring, could not pull it off, and had vanished. Mabel, who had been easy to smuggle into the house while she was invisible, could now be seen as plainly as anyone. Smuggling her in was no longer possible. Somehow the children had to explain both the missing member of their own party and the very obvious stranger who had appeared in his place.
        - id: ch01-b02
          speaker: mabel
          text: I can't go back to Aunt. I can't, and I won't, even if I'm twenty times visible.
        - id: ch01-b03
          speaker: gerald
          text: She'd know something was wrong, especially after that tale about the motorcar and the lady who adopted you. But how are we going to explain you to Mademoiselle?
        - id: ch01-b04
          speaker: narrator
          text: He pulled at the ring again.
        - id: ch01-b05
          speaker: mabel
          text: You could tell her what really happened.
        - id: ch01-b06
          speaker: kathleen
          text: She wouldn't believe us. And if she did, she'd go completely, raving mad.
        - id: ch01-b07
          speaker: gerald
          text: No, we can't risk telling her. She is rather decent, though. We'll say it's too late for you to get home and ask if you can stay tonight.
        - id: ch01-b08
          speaker: jimmy
          text: That takes care of Mabel. What about you?
        - id: ch01-b09
          speaker: gerald
          text: I'll go to bed with a bad headache. That part isn't a lie. My head aches properly. It must be the sun. Everyone knows blacklead draws the sun's rays together.
        - id: ch01-b10
          speaker: jimmy
          text: More likely it was all those pears and gingerbread. Come on, then. If I were invisible, I wouldn't waste it by going to bed with a silly headache.
        - id: ch01-b11
          speaker: gerald
          text: What would you do?
        - id: ch01-b12
          speaker: narrator
          text: Gerald's voice came from just behind Jimmy, and Jimmy jumped hard.
        - id: ch01-b13
          speaker: jimmy
          text: Stay in one place, you cuckoo! You make me jump when you wander about like that. Walk between Cathy and me.
        - id: ch01-b14
          speaker: gerald
          text: Well? What would you do?
        - id: ch01-b15
          speaker: jimmy
          text: I'd be a burglar.
        - id: ch01-b16
          speakers: [kathleen, mabel]
          ensemble: duo
          text: You can't do that. Burgling is wrong!
        - id: ch01-b17
          speaker: jimmy
          text: All right, then. I'd be a detective.
        - id: ch01-b18
          speaker: mabel
          text: You need something to detect before you can start being a detective.
        - id: ch01-b19
          speaker: jimmy
          text: Detectives don't always find things. If I couldn't be any other sort, I'd be a baffled detective. You could do that perfectly well and have plenty of fun. Why don't you try it?
        - id: ch01-b20
          speaker: gerald
          text: That is exactly what I mean to do. We'll stop at the police station and see what crimes they have waiting for me.
        - id: ch01-b21
          speaker: narrator
          text: They went to the police station and read every notice on the board outside. Two dogs had been lost, and so had a purse. Someone was also missing a portfolio of papers which, the notice carefully explained, had no value to anyone except the owner. The last notice was far more promising. Houghton Grange had been broken into, a quantity of silver plate was gone, and twenty pounds was offered for information that led to its recovery.
        - id: ch01-b22
          speaker: gerald
          text: That burglary is mine. I'll solve it. Here comes Johnson, and he's just going off duty. Ask him what happened. An invisible master detective can't question a constable himself, so his young assistant must do it properly. Be impressive, Jimmy.
        - id: ch01-b23
          speaker: narrator
          text: Jimmy called to the constable.
        - id: ch01-b24
          speaker: jimmy
          text: Hello, Johnson!
        - id: ch01-b25
          speaker: johnson
          text: Hello yourself, young shaver!
        - id: ch01-b26
          speaker: jimmy
          text: You're the shaver!
        - id: ch01-b27
          speaker: narrator
          text: There was no spite in it.
        - id: ch01-b28
          speaker: johnson
          text: What are you doing out at this hour? All the little birds have gone home to their nests.
        - id: ch01-b29
          speaker: kathleen
          text: We've been at the fair. There was a conjurer there. I wish you'd seen him.
        - id: ch01-b30
          speaker: johnson
          text: I heard about him. It's all tricks, you know. His hands move so fast that your eyes get fooled.
        - id: ch01-b31
          speaker: narrator
          text: So much for fame. Gerald stood in the shadows and jingled the loose coins in his pocket to comfort himself.
        - id: ch01-b32
          speaker: johnson
          text: What's that noise?
        - id: ch01-b33
          speaker: jimmy
          text: Just our money jingling.
        - id: ch01-b34
          speaker: narrator
          text: It was perfectly true.
        - id: ch01-b35
          speaker: johnson
          text: Some people have all the luck. I wish my pockets were full enough to jingle.
        - id: ch01-b36
          speaker: mabel
          text: Why aren't they? Why don't you win that twenty-pound reward?
        - id: ch01-b37
          speaker: johnson
          text: I'll tell you. In this free country, you're not allowed to arrest a man just because you suspect him, even when you know perfectly well he did it.
        - id: ch01-b38
          speaker: jimmy
          text: That's a shame! Who do you think it was?
        - id: ch01-b39
          speaker: johnson
          text: I don't think. I know. The police know the man because he's done a heap of crimes. But we can never prove one against him, and we haven't enough evidence to convict him.
        - id: ch01-b40
          speaker: jimmy
          text: When I leave school, I'll come and train under you as a detective. For now, we'd better go home and detect our supper. Good night!
        - id: ch01-b41
          speaker: narrator
          text: They watched Johnson's broad back pass through the station's swinging door. When all was quiet again, Gerald's invisible voice began complaining bitterly.
        - id: ch01-b42
          speaker: gerald
          text: You have no more brains than a halfpenny bun. You never asked when the silver was taken or how they did it.
        - id: ch01-b43
          speaker: jimmy
          text: But he said he knew who did it.
        - id: ch01-b44
          speaker: gerald
          text: Yes, and that's all you learned. One silly policeman's silly idea. Go home and detect your precious supper. That's about all you're fit for.
        - id: ch01-b45
          speaker: mabel
          text: What are you going to do for supper?
        - id: ch01-b46
          speaker: gerald
          text: Buns. Halfpenny buns. Every bite will remind me of my dear little brother and sister. Perhaps you have enough sense to buy them. I can hardly walk into a shop like this.
        - id: ch01-b47
          speaker: mabel
          text: Don't be so horrid. We tried our best. If I were Cathy, you could whistle for your nasty buns.
        - id: ch01-b48
          speaker: gerald
          text: If you were Cathy, this gallant detective would have run away to sea long ago. A tramp steamer's cabin is better than a grand house with a quarrelsome sister. But you're an outsider just now, gentle maiden. Jimmy and Cathy know when their fearless leader is joking.
        - id: ch01-b49
          speaker: kathleen
          text: Not when we can't see your face. I truly thought you were furious, and so did Jimmy.
        - id: ch01-b50
          speaker: gerald
          text: Oh, nonsense. Come on. This way to the bun shop!
        - id: ch01-b51
          speaker: narrator
          text: They reached the bun shop. Cathy and Jimmy went inside to buy supper, while Gerald and Mabel stayed at the window. Through the glass they gazed at jam tarts, Swiss rolls, Victoria sandwiches, and Bath buns, all lying beneath a spread of yellow muslin. As they waited, Gerald leaned close to Mabel's ear and explained every splendid hope and plan he had for his new detective career.
        - id: ch01-b52
          speaker: gerald
          text: I'll keep my eyes wide open tonight. The invisible detective might find the purse and the silver. He might even discover a crime before it happens. I'll watch until suspicious characters leave town, follow them in secret, catch them with priceless jewels in their hands, and turn them over to the law.
        - id: ch01-b53
          speaker: mabel
          text: Oh!
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: Her cry was so sharp that it pulled Gerald out of his daydream.
        - id: ch01-b55
          speaker: gerald
          text: Does something hurt? Those apples were rather hard.
        - id: ch01-b56
          speaker: mabel
          text: It isn't that. Oh, this is dreadful! I never thought of it before.
        - id: ch01-b57
          speaker: gerald
          text: Thought of what?
        - id: ch01-b58
          speaker: mabel
          text: The window.
        - id: ch01-b59
          speaker: gerald
          text: What window?
        - id: ch01-b60
          speaker: mabel
          text: The panelled-room window at the castle. We left it open, shutters and all, with the jewels inside. Auntie never goes into that room. I have to go home this minute.
        - id: ch01-b61
          speaker: narrator
          text: The other two came out carrying buns, and Mabel quickly explained.
        - id: ch01-b62
          speaker: mabel
          text: So you see, I really must go.
        - id: ch01-b63
          speaker: narrator
          text: Kathleen agreed. Jimmy could not see what good it would do.
        - id: ch01-b64
          speaker: jimmy
          text: The key is still inside the door.
        - id: ch01-b65
          speaker: mabel
          text: Aunt will be so cross. She'll have to send the gardeners for a ladder, and then—
          emotion: sad
        - id: ch01-b66
          speaker: gerald
          text: Hooray! You have me. Invisible Jerry is nobler and more secret than gardeners or ladders. I'll climb the ivy to the window, close it and the shutters, put the key back on its nail, then slip out through the servants without anyone seeing me. There is plenty of time. Burglars don't start their wicked work until late at night.
        - id: ch01-b67
          speaker: mabel
          text: Won't you be frightened? What if they catch you? Will you be safe?
        - id: ch01-b68
          speaker: gerald
          text: Safe as houses. They can't catch what they can't see.
        - id: ch01-b69
          speaker: narrator
          text: Gerald wondered why that anxious question had come from Mabel. Usually it was Kathleen who worried about every danger in an adventure and pointed out how foolish the whole plan might be. This time Kathleen did not object at all.
        - id: ch01-b70
          speaker: kathleen
          text: Goodbye, then. We'll meet you tomorrow at the floral temple, half past ten. I hope you don't get into dreadful trouble over that motorcar lady.
        - id: ch01-b71
          speaker: jimmy
          text: Now let's go and detect our supper.
        - id: ch01-b72
          speaker: gerald
          text: All right.
        - id: ch01-b73
          speaker: narrator
          text: Gerald sounded bitter. It is hard to set out on an adventure and find years of brotherly and sisterly interest cut off as suddenly as a gas meter. At a moment like this, Gerald felt he ought to have been the center of everyone's thoughts. Yet Cathy and Jimmy could actually turn away and talk about supper. Very well, then. Let them talk. He told himself he did not care, and spoke with a sharp sternness meant to prove it.
        - id: ch01-b74
          speaker: gerald
          text: Leave the pantry window open so I can get in after my detecting. Come on, Mabel. And I claim the buns!
        - id: ch01-b75
          speaker: narrator
          text: He caught Mabel's hand, snatched the bag, and pressed it on her. Four boot soles rang along the High Street. Soon the outline of the running Mabel had grown small in the distance.
        - id: ch01-b76
          speaker: narrator
          text: Mademoiselle sat by the drawing-room window in the fading light, reading letters.
        - id: ch01-b77
          speaker: mademoiselle
          text: Ah, there you are! Late again. And where is my little Gerald?
        - id: ch01-b78
          speaker: narrator
          text: It was a terrible moment. Jimmy's detective plan had provided no answer to that certain question. Nobody spoke until Jimmy finally did.
        - id: ch01-b79
          speaker: jimmy
          text: He said he was going to bed because his head hurt.
        - id: ch01-b80
          speaker: narrator
          text: That, at least, was true.
        - id: ch01-b81
          speaker: mademoiselle
          text: Poor Gerald! Shall I take some supper up to him?
        - id: ch01-b82
          speaker: kathleen
          text: He never eats when he has one of his headaches.
        - id: ch01-b83
          speaker: narrator
          text: That was true as well. Jimmy and Kathleen went to bed without worrying about their brother. Mademoiselle returned to her letters among the remains of supper.
        - id: ch01-b84
          speaker: gerald
          text: It is splendid being out so late.
        - id: ch01-b85
          speaker: narrator
          text: His voice travelled through the soft summer dusk beside the lonely-looking figure of Mabel on the high road.
        - id: ch01-b86
          speaker: mabel
          text: Yes. I only hope Auntie isn't terribly furious.
        - id: ch01-b87
          speaker: gerald
          text: Have another bun.
        - id: ch01-b88
          speaker: narrator
          text: A friendly sound of munching followed, and they ate as they walked toward Yalding Towers. Mabel was pale and trembling when they reached the door meant for servants to enter and leave by. Her aunt herself opened it. Before looking at Mabel, she peered over the girl's head as though she expected a taller person to be standing behind her.
        - id: ch01-b89
          speaker: mabel
          text: Aunt!
        - id: ch01-b90
          speaker: narrator
          text: Her aunt started back, then stepped toward her.
        - id: ch01-b91
          speaker: aunt
          text: You naughty, naughty girl! How could you frighten me like this? I ought to keep you in bed for a week. Oh, Mabel, thank Heaven you're safe!
          emotion: angry
        - id: ch01-b92
          speaker: narrator
          text: Her arms closed around Mabel, and Mabel hugged her back. They had never embraced like that before. Only then did Mabel understand that her aunt had truly worried and was truly glad to see her.
        - id: ch01-b93
          speaker: mabel
          text: But this morning, you didn't seem to care about me at all.
        - id: ch01-b94
          speaker: aunt
          text: How could you know that?
        - id: ch01-b95
          speaker: mabel
          text: I was there, listening. Please don't be angry, Auntie.
        - id: ch01-b96
          speaker: aunt
          text: Now that I have you safely home, I feel as if I could never be angry with you again.
        - id: ch01-b97
          speaker: mabel
          text: But what happened to you?
        - id: ch01-b98
          speaker: aunt
          text: My dear, I think I have been in some kind of trance. Perhaps I'm becoming ill. I have always loved you, though I tried not to spoil you. Yesterday at half past three, while I was speaking about you to Mr. Lewson at the fair, I suddenly felt that you did not matter at all. I felt the same after your letter came and when those children visited. Then today, in the middle of tea, I seemed to wake up. I knew you were gone, and it was dreadful. Oh, Mabel, why did you do such a thing?
        - id: ch01-b99
          speaker: mabel
          text: It was only a joke.
        - id: ch01-b100
          speaker: narrator
          text: Mabel's answer was faint. The two went inside, and the door closed behind them.
        - id: ch01-b101
          speaker: gerald
          text: That is extremely odd. It feels like more magic. We haven't reached the bottom of this, not by a long way. There is more to this castle than anyone can see.
        - id: ch01-b102
          speaker: narrator
          text: There certainly was more to the castle. But it would be unfair to Gerald to tell you anything he did not know himself that night. He crossed the vast grounds alone and invisible, searching for the open window of the panelled room. Dew lay on the lawns. Between the dark groups of shrubs and trees, pools rested like enormous looking glasses and reflected the quiet stars. White statue limbs gleamed against the shadows. As Gerald went on, he began to feel different. He was not excited, surprised, or anxious. It was something else altogether.
        - id: ch01-b103
          speaker: narrator
          text: The invisible princess had surprised him. The conjuring had thrilled him. His sudden choice to become a detective had brought worries of its own. But wonderful and unusual as those things were, they had remained inside the circle of what might be possible. They were like a chemical experiment where two harmless-looking liquids burst into flame, like a conjurer's quick hands, or like the thrill of watching a juggler. This new feeling was unlike any of those things.
        - id: ch01-b104
          speaker: narrator
          text: By daylight the gardens were like dreams. At night they were visions. Gerald could not see his own feet as he walked. He could only watch the wet blades of grass bend and move where those invisible feet pressed them down. Then came a feeling which was hard to describe, yet completely real and impossible to forget. Another world seemed to have covered the ordinary one, the way a carpet covers a floor. The floor remains underneath, but you walk upon the carpet. And the carpet beneath Gerald was drenched in magic, just as the grass was drenched in dew.
        - id: ch01-b105
          speaker: narrator
          text: It was a wonderful feeling. Perhaps one day you will know it. A few places in the world can still make you feel that way, though there are fewer every year. The garden's enchantment held Gerald fast.
        - id: ch01-b106
          speaker: gerald
          text: I won't go inside yet. It's too early, and I may never see this place at night again. I suppose the darkness is what makes it all look different.
        - id: ch01-b107
          speaker: narrator
          text: Something white stirred beneath a weeping willow. White hands divided the long, rustling leaves, and a figure stepped out. It had horns and goat's legs, but its head and arms belonged to a boy. Gerald felt no fear. That was the most wonderful part, though he would never have admitted it. The white creature stretched its limbs, rolled over the grass, sprang upright, and frisked away across the lawn. Something pale still showed beneath the willow. Gerald took three steps closer and found only the empty pedestal where a statue should have stood.
        - id: ch01-b108
          speaker: gerald
          text: They come alive. The statues come alive.
        - id: ch01-b109
          speaker: narrator
          text: Another white figure slipped out of the Temple of Flora and vanished among the laurels. Then small stones began crunching on the drive. A tremendously long, dark grey shape crawled toward Gerald, moving slowly and heavily. The moon came out just in time to reveal it. This was one of the vast stone lizards displayed at the Crystal Palace, made in the same dreadful size such creatures had possessed millions of years ago. In that distant age, they had been masters of the world, before human beings existed.
        - id: ch01-b110
          speaker: gerald
          text: It can't see me. I'm not afraid. This one has come alive too.
        - id: ch01-b111
          speaker: narrator
          text: As the creature twisted past, Gerald reached out and touched its enormous tail. It was stone. The beast had not come alive. It was alive while still made of stone. At his touch, it turned. Gerald turned too and raced toward the house. Fear had entered the garden with that stony touch and had nearly caught him. He ran from Fear, not from the moving beast.
        - id: ch01-b112
          speaker: narrator
          text: Gerald stopped beneath the fifth window, panting for breath. Twisted ivy clung to the wall, and he used it to climb onto the window ledge. From there he looked back across the grey slope. Water splashed in the fish pool which, only moments before, had quietly reflected the stars. Now the huge shape of the stone creature was wallowing in the shallows among the lily pads.
        - id: ch01-b113
          speaker: narrator
          text: Once inside the panelled room, he looked again. The pond was still and black beneath the moon. Through a gap in the willow, moonlight touched a statue standing calmly on its pedestal. Everything had returned to its place. Nothing moved.
        - id: ch01-b114
          speaker: gerald
          text: How extraordinarily strange. I never knew you could fall asleep while walking through a garden and dream anything like that.
        - id: ch01-b115
          speaker: narrator
          text: Gerald shut the window, struck a match, and closed the shutters. Another match showed him the door. He turned the key, stepped into the passage, locked the room behind him, and hung the key on its usual nail. At the far end of the passage he stopped and waited in the safety of his invisibility. The dazzling match flames had blinded him for the moment. Slowly his sight returned, and he could once more follow the bright patches of moonlight falling across the floor through the barred, unshuttered windows of the hall.
        - id: ch01-b116
          speaker: gerald
          text: I wonder where the kitchen is. I suppose it doesn't matter which doors I open. I'm still invisible, aren't I? Yes. I can't see my hand in front of my face. Here goes.
        - id: ch01-b117
          speaker: narrator
          text: He had forgotten all about being a detective. Now he only wanted to get home and tell the others about the extraordinarily odd dream he believed he had dreamed in the gardens. He opened door after door and wandered through long rooms. Furniture dressed in brown holland covers looked white in the strange moonlight. Chandeliers hung inside great bags from the high ceilings. Some walls seemed alive with painted faces, while other walls were hushed beneath row after row of old books. He crossed state bedrooms with vast, plumed four-poster beds where Queen Elizabeth had surely slept. That queen must have spent very little time at home, since she seems to have slept in every old house in England.
        - id: ch01-b118
          speaker: narrator
          text: Still he could not find the kitchen. At last one door led to stone steps. A narrow passage ran between stairs going up and stairs going down. At the end was another door, with light shining beneath it. For some reason, Gerald found it hard to reach out and open that door.
        - id: ch01-b119
          speaker: gerald
          text: Nonsense. Don't be an ass. Are you invisible or aren't you?
        - id: ch01-b120
          speaker: narrator
          text: He opened it. Someone inside growled a few rough words. Gerald flattened himself against the wall as a man sprang into the passage and swept it with a lantern.
        - id: ch01-b121
          speaker: burglar_1
          text: It's all right. The heavy door must have swung open by itself.
        - id: ch01-b122
          speaker: narrator
          text: Relief almost made the man sob.
        - id: ch01-b123
          speaker: burglar_2
          text: Curse that door! I thought we'd been caught that time.
        - id: ch01-b124
          speaker: narrator
          text: The men closed the door again, and Gerald did not mind. In fact, he preferred having it shut. He did not like their looks. There was a threat in the very air around them, and even invisibility seemed like a disguise too thin to trust in their presence. He had seen everything he needed. His grand talk about finding a gang had come true. With the astonishing luck of a beginner, as a card player might have called it, Gerald had discovered a burglary on the very first night of his detective career.
        - id: ch01-b125
          speaker: narrator
          text: Three men were lifting silver from two large chests. They wrapped each piece in rags and packed it into green cloth sacks. The room was the strong-room, behind an iron door six inches thick. The thieves had picked its lock. Their tools lay neatly on a cloth roll, like a wood-carver's chisels.
        - id: ch01-b126
          speaker: burglar_1
          text: Hurry up! We haven't got all night.
        - id: ch01-b127
          speaker: narrator
          text: The silver gave a small rattle.
        - id: ch01-b128
          speaker: burglar_2
          text: Stop rattling those trays like a pair of castanets.
        - id: ch01-b129
          speaker: narrator
          text: Gerald turned away with great care and even greater speed. It was a curious thing. Earlier, with nothing else to think about, he had wandered helplessly and could not find the servants' wing. Now his mind was crowded with silver forks, silver cups, and the question of who might be following him through those twisting passages. Yet he went as straight as an arrow to the hall door that led exactly where he wanted to go.
        - id: ch01-b130
          speaker: gerald
          text: The fortunate detective, after succeeding beyond his wildest dreams, left the scene to find assistance.
        - id: ch01-b131
          speaker: narrator
          text: But what assistance could he find? No doubt there were men in the house, and there was Mabel's aunt, but Gerald could not warn any of them in the usual way. He was far too completely invisible for strangers to take him seriously. Mabel's help would not count for much either. The police were the obvious answer, but getting them presented problems of its own. Before anyone could reach the station and return, the burglars might be far away with their sacks of silver.
        - id: ch01-b132
          speaker: narrator
          text: Gerald stopped, held his head in both hands, and thought as hard as he did over easy equations or dates from the Civil War. Then he found a pencil and notebook, leaned on a window ledge, and used all the cleverness he had.
        - id: ch01-b133
          speaker: narrator
          text: He wrote that burglars were stealing silver from the strong-room after picking its thick door. Someone must send for the police. If the thieves escaped before the police came, he would follow them. After a moment's thought, he added that the warning came from a friend and was not a trick.
        - id: ch01-b134
          speaker: narrator
          text: Gerald wrapped the note tightly around a stone and tied it in place with one of his shoelaces. In the room beyond the window, Mabel and her aunt were celebrating their reunion over a supper of unusual delight. There were stewed plums and cream, sponge cakes, custard served in cups, and cold bread-and-butter pudding. Hungry and invisible, Gerald looked wistfully at every dish before he sent the stone thundering through the window.
        - id: ch01-b135
          speaker: narrator
          text: He waited for the screams to stop. Someone picked up the stone and read the warning.
        - id: ch01-b136
          speaker: aunt
          text: Nonsense! What a wicked thing to do. Of course this is a hoax.
        - id: ch01-b137
          speaker: narrator
          text: She was beginning to recover her composure.
        - id: ch01-b138
          speaker: mabel
          text: Oh, please send for the police, just as he says!
          emotion: fearful
        - id: ch01-b139
          speaker: aunt
          text: Just as who says?
        - id: ch01-b140
          speaker: mabel
          text: Whoever wrote it!
        - id: ch01-b141
          speaker: gerald
          text: Send for the police at once. If you don't, you'll blame yourself afterward. I can't do anything more to help you.
        - id: ch01-b142
          speaker: narrator
          text: Outside the window, Gerald made his voice as manly as he could.
        - id: ch01-b143
          speaker: aunt
          text: I—I will set the dogs on you!
          emotion: fearful
        - id: ch01-b144
          speaker: mabel
          text: Auntie, don't! The warning is true. I know it is. Please, please wake Bates!
          emotion: fearful
        - id: ch01-b145
          speaker: aunt
          text: I don't believe one word of it.
        - id: ch01-b146
          speaker: narrator
          text: Neither did Bates when Mabel's determined worrying finally woke him. But once he saw the note, he had a choice. He could go to the strong-room and prove there was nothing to fear, or ride his bicycle to fetch the police. He chose the bicycle.
        - id: ch01-b147
          speaker: narrator
          text: By the time the police came, the strong-room door stood ajar. The three men had gone. They could not take every piece of silver, but they had carried away as much as the three of them could manage.
        - id: ch01-b148
          speaker: narrator
          text: Gerald's notebook and pencil came into use again later that night. Not until five in the morning did he creep back through the pantry window and reach his bed. By then he was worn out from the long night and cold as a stone.
        - id: ch01-b149
          speaker: eliza
          text: Master Gerald! Seven o'clock, another fine day, and there's been another burglary. My cats alive! Look at this bed, blackened all over, and the boy isn't even in it! Oh, Jiminy!
          emotion: surprised
        - id: ch01-b150
          speaker: narrator
          text: Eliza had raised the blind and turned toward the bed. Her first shout brought Kathleen running from her room, while Jimmy sat up and rubbed his eyes. Then Eliza screamed again, because Gerald had suddenly appeared in the bed.
        - id: ch01-b151
          speaker: kathleen
          text: Whatever is the matter?
        - id: ch01-b152
          speaker: eliza
          text: I never had such a shock. First his bed was empty and black as the back of the chimney. Then I looked again, and there he was all along. I must be losing my senses. I knew it when I heard those ghostly angel voices yesterday. But I'll tell Mamselle about your tricks, my lad. Smearing yourself black and ruining clean sheets and pillowcases! This is too much.
        - id: ch01-b153
          speaker: narrator
          text: Eliza sank heavily onto a box.
        - id: ch01-b154
          speaker: gerald
          text: Listen. I'm going to tell you something.
        - id: ch01-b155
          speaker: narrator
          text: Eliza snorted, which was rude, though she was still shaken.
        - id: ch01-b156
          speaker: gerald
          text: Can you keep a secret?
        - id: ch01-b157
          speaker: narrator
          text: Gerald looked very serious through the grey patches where the blacklead had rubbed away.
        - id: ch01-b158
          speaker: eliza
          text: Yes.
        - id: ch01-b159
          speaker: gerald
          text: Then keep this one, and I'll give you two shillings.
        - id: ch01-b160
          speaker: eliza
          text: But what were you going to tell me?
        - id: ch01-b161
          speaker: gerald
          text: That was it. The two shillings and the secret. Now don't say a word.
        - id: ch01-b162
          speaker: eliza
          text: I really shouldn't take it.
        - id: ch01-b163
          speaker: narrator
          text: She held out her hand eagerly.
        - id: ch01-b164
          speaker: eliza
          text: Now get up, Master Gerald, and make sure you wash every last corner.
        - id: ch01-b165
          speaker: kathleen
          text: Oh, I'm so glad you're safe!
          emotion: happy
        - id: ch01-b166
          speaker: narrator
          text: Eliza left, and Kathleen flung her arms around her brother.
        - id: ch01-b167
          speaker: gerald
          text: You didn't seem very concerned last night.
        - id: ch01-b168
          speaker: kathleen
          text: I don't know how I let you go. Last night I truly didn't care. But this morning I woke and remembered everything!
        - id: ch01-b169
          speaker: gerald
          text: That's enough. The blacklead will rub off on you.
        - id: ch01-b170
          speaker: narrator
          text: Kathleen went on hugging him anyway.
        - id: ch01-b171
          speaker: jimmy
          text: How did you become visible again?
        - id: ch01-b172
          speaker: gerald
          text: It happened when Eliza called me. The ring slipped off.
        - id: ch01-b173
          speaker: kathleen
          text: Tell us everything that happened.
        - id: ch01-b174
          speaker: gerald
          text: Not yet.
        - id: ch01-b175
          speaker: narrator
          text: Gerald answered mysteriously. After breakfast, Jimmy asked the question that mattered most.
        - id: ch01-b176
          speaker: jimmy
          text: Where is the ring? I want my turn now.
        - id: ch01-b177
          speaker: gerald
          text: I—I forgot about it. It must be somewhere in the bed.
        - id: ch01-b178
          speaker: narrator
          text: But the ring was not there. Eliza had already made the bed.
        - id: ch01-b179
          speaker: eliza
          text: I swear there was no ring in that bed. I would have seen it if there had been.
