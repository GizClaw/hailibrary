  chapters:
    - id: ch01
      title: CHAPTER XII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What did Lord Yalding feel as he followed Mabel and Jimmy through the halls of his own family home? I cannot tell you, because I do not know. Perhaps he was bewildered and a little amazed. Perhaps he wanted to pinch himself and find out whether he was dreaming. He may have wondered whether he was mad or the children were, without knowing which question to answer. The children plainly believed their strange stories. Their wish had come true, and the ghost had appeared. He must have thought something about it all, but guessing will get us no nearer the truth.
        - id: ch01-b02
          speaker: narrator
          text: I cannot tell you what Mademoiselle was thinking either. I know only that she was very happy. Anyone who saw her face could see that. Her guardian had once put her in a convent to stop her from marrying a poor lord and losing her fortune. Then he secured the fortune for himself by running away with it to South America. With no money left, Mademoiselle had to earn her living. She became a governess and chose this particular post because it was near Lord Yalding's home. She wanted to see him, though she believed he had abandoned her and no longer loved her. Now she had seen him, and she walked through his house with her hand in his. Perhaps she remembered all these things. But again, I cannot be sure.
        - id: ch01-b03
          speaker: narrator
          text: Jimmy's thoughts were much easier to read. Now Lord Yalding would have to believe him. For no sensible reason, that had become the most important thing in Jimmy's world. He wished Gerald and Kathleen could be there to enjoy his triumph. But they were helping Mabel's aunt cover the grand furniture, so they missed what came next.
        - id: ch01-b04
          speaker: mabel
          text: Now you'll see!
        - id: ch01-b05
          speaker: narrator
          text: She said it proudly as everyone gathered around her in the little panelled room. Then they waited. Nothing happened.
        - id: ch01-b06
          speaker: mabel
          text: There is a hidden spring somewhere here.
        - id: ch01-b07
          speaker: narrator
          text: She searched with fingers that had suddenly become hot and damp.
        - id: ch01-b08
          speaker: lord_yalding
          text: Where is it?
        - id: ch01-b09
          speaker: mabel
          text: Right here! Only I can't find it now.
        - id: ch01-b10
          speaker: narrator
          text: She easily found the spring that opened the secret panel under the window. But that seemed dull beside the jewels everyone had imagined and two of them had actually seen. The spring that should make the oak panels slide aside and reveal jewels worth a king's ransom could not be found. It simply was not there. Careful fingers felt every inch of the wood. Mabel and Jimmy protested earnestly at first. Soon their words faded into a miserable silence. Their ears felt hot. No one wanted to meet anyone else's eyes. And somehow it seemed deeply unfair that the spring refused to play the game.
        - id: ch01-b11
          speaker: lord_yalding
          text: There, you see. You have had your joke, if you can call it one, and I have had quite enough of this foolish business. Give me the ring. It must belong to me if, as you say, you found it here. And I do not want to hear another word about magic or enchantment.
        - id: ch01-b12
          speaker: mabel
          text: Gerald has the ring.
          emotion: sad
        - id: ch01-b13
          speaker: lord_yalding
          text: Then both of you must go and fetch him.
        - id: ch01-b14
          speaker: narrator
          text: The unhappy pair went away. While they were gone, Lord Yalding explained to Mademoiselle that jewels mattered very little compared with certain other things. Before long all four children returned together.
        - id: ch01-b15
          speaker: lord_yalding
          text: We have had enough trouble over this ring. Hand it to me, and we shall say no more about it.
        - id: ch01-b16
          speaker: gerald
          text: I—I can't take it off. It has always seemed to have ideas of its own.
        - id: ch01-b17
          speaker: lord_yalding
          text: I shall soon take it off.
        - id: ch01-b18
          speaker: narrator
          text: But he did not.
        - id: ch01-b19
          speaker: lord_yalding
          text: We will use soap.
        - id: ch01-b20
          speaker: narrator
          text: He said it firmly. Four of the five people listening knew exactly how useless soap would be.
        - id: ch01-b21
          speaker: mabel
          text: They don't believe me about the jewels! I can't find the spring, though all of us felt everywhere. It was just here, and—
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: Mabel had burst into tears. Then, while she was speaking, her fingers touched the spring. As her words stopped, the carved panels slid aside. Blue velvet shelves loaded with jewels appeared before the astonished eyes of Lord Yalding and the lady he meant to marry.
        - id: ch01-b23
          speaker: lord_yalding
          text: By Jove, there they are!
          emotion: surprised
        - id: ch01-b24
          speaker: mademoiselle
          text: Oh, misericorde!
          emotion: surprised
        - id: ch01-b25
          speaker: mabel
          text: But why did it open now? Why wouldn't it open before?
        - id: ch01-b26
          speaker: gerald
          text: I expect the answer is magic. There isn't a real spring at all, so it could not work while the ring was somewhere else. Phoebus told us the ring was the heart of all the magic, remember?
        - id: ch01-b27
          speaker: gerald
          text: Close the panel, take the ring out of the room, and try again.
        - id: ch01-b28
          speaker: narrator
          text: They did. Gerald, as he was careful to point out, proved right once more. With the ring outside the room there was no spring. When the ring came back, Mabel found the spring exactly where it ought to be.
        - id: ch01-b29
          speaker: mabel
          text: So now you see!
        - id: ch01-b30
          speaker: lord_yalding
          text: I see that the spring is hidden with extraordinary skill. You were very clever to discover it. And if those jewels are genuine—
        - id: ch01-b31
          speaker: mabel
          text: Of course they're genuine!
          emotion: angry
        - id: ch01-b32
          speaker: lord_yalding
          text: In any case, I am much obliged to all of you. The weather seems to be clearing. I will send you home in the wagonette after lunch. And now, if you please, I will take the ring.
        - id: ch01-b33
          speaker: narrator
          text: Half an hour with soap and water did nothing except leave Gerald's finger red and sore. Lord Yalding finally said something extremely impatient. That made Gerald angry too.
        - id: ch01-b34
          speaker: gerald
          text: Well, I certainly wish the thing would come off!
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: At once the ring slipped off, as easily as butter. Gerald made sure to point that out later.
        - id: ch01-b36
          speaker: lord_yalding
          text: Thank you.
        - id: ch01-b37
          speaker: narrator
          text: Later, back at home, the children sat comfortably on the leads. They talked everything over while sharing a tin of preserved pineapple, with a bottle of ginger beer for each of them.
        - id: ch01-b38
          speaker: gerald
          text: I believe he thinks I kept the ring on deliberately. Some people are impossible to please. He wasn't in such a blazing hurry to send for the wagonette once he discovered Mademoiselle meant to leave when we did. I liked him better when he was only a humble bailiff. Taken altogether, he doesn't look like someone we shall enjoy very much in future.
        - id: ch01-b39
          speaker: kathleen
          text: He doesn't understand what is happening to him. It really is the magic. It comes over you like getting measles. Don't you remember how cross Mabel was when she first turned invisible?
        - id: ch01-b40
          speaker: jimmy
          text: I should say I do!
        - id: ch01-b41
          speaker: gerald
          text: The magic is part of it, to be fair. The other part is being in love. A fellow at school told me that love always makes people behave like idiots. His sister went quite rotten when she got engaged, and she had been a perfectly decent sort before.
        - id: ch01-b42
          speaker: narrator
          text: At tea and supper, Mademoiselle shone with happiness. She was as lovely as a lady on a Christmas card, as lively as a marmoset, and as kind as you yourself would always be if only you could be bothered. At breakfast she was just as bright, merry, lovely, and kind.
        - id: ch01-b43
          speaker: narrator
          text: Then Lord Yalding came to see her. Their meeting took place in the drawing room. With remarkable discretion, the children stayed shut in the schoolroom. But Gerald went upstairs for a pencil and caught Eliza with her ear pressed to the drawing-room keyhole.
        - id: ch01-b44
          speaker: narrator
          text: After that, Gerald settled on the top stair with a book. He could not hear the conversation, but he had a clear view of the door. That meant he could make sure no one else listened. When the drawing-room door opened, he saw Lord Yalding come out.
        - id: ch01-b45
          speaker: narrator
          text: Gerald later claimed that our young hero coughed with infinite tact to announce his presence. Lord Yalding did not appear to notice. He walked blindly to the hat stand, fumbled among the umbrellas and raincoats, and found his straw hat. He stared at it gloomily, crushed it onto his head, and went out. The front door slammed behind him with reckless force.
        - id: ch01-b46
          speaker: narrator
          text: He had left the drawing-room door open. Gerald had chosen a place where he could hear nothing while that door was shut, but now a sound reached him clearly. To his deep distress and disgust, he heard sobbing and sniffling. Mademoiselle was certainly crying.
        - id: ch01-b47
          speaker: gerald
          text: Jiminy! They haven't wasted any time. Imagine starting to quarrel already. I hope I never have to be anyone's lover.
        - id: ch01-b48
          speaker: narrator
          text: This was no moment to brood over the horrors of Gerald's own future. Eliza might appear at any time. She would walk through that open door without a pause and push herself into the most private heart of Mademoiselle's sorrow. Gerald decided it would be better if he did that himself. He went quietly down the worn green stair carpet, entered the drawing room, and closed the door securely behind him.
        - id: ch01-b49
          speaker: mademoiselle
          text: It is finished. He will not marry me!
          emotion: sad
        - id: ch01-b50
          speaker: narrator
          text: Her face was buried in a cushion embroidered with beaded arum lilies on red cloth by a former pupil. Do not ask how Gerald had won her confidence. As I said near the beginning, he had charming ways with grown-ups when he chose to use them. Now he held her hand almost as tenderly as if she had been his mother with a headache.
        - id: ch01-b51
          speaker: gerald
          text: Please don't. Don't cry. It will all come right. You'll see. Tell me what happened, won't you?
          emotion: calm
        - id: ch01-b52
          speaker: narrator
          text: He comforted her as well as anyone could, sometimes patting her gently on the back and begging her to tell him the whole story. You might think this was simple curiosity, but it was not. Gerald felt more and more certain that the ring was somehow responsible. And Gerald, as he told himself once again, was right.
        - id: ch01-b53
          speaker: narrator
          text: Mademoiselle's story was certainly an unusual one. After dinner the night before, Lord Yalding had walked in the park to think.
        - id: ch01-b54
          speaker: gerald
          text: Yes, I know. He was wearing the ring. And then he saw—
        - id: ch01-b55
          speaker: mademoiselle
          text: He saw the statues come alive. His poor mind was confused by all those foolish tales of fairies you told him. He saw Apollo and Aphrodite living in their marble bodies, and he remembered your story. He wished to become a statue himself. Then his madness made him believe your tale about the island. He plunged into the lake. He swam among the animals from Noah's Ark and ate with gods upon an island.
          emotion: sad
        - id: ch01-b56
          speaker: mademoiselle
          text: At dawn his madness grew weaker. He believed the temple had vanished, yet he still thought he was a statue. He hid from his gardeners until a quarter to nine. Then he wished not to be a statue any longer and found himself flesh and blood. It was a bad dream, but he has lost his senses because of the stories you told. He says it was no dream at all. He says he is a madman, and a madman must never marry. There is no hope. I am in despair, and life is empty!
          emotion: sad
        - id: ch01-b57
          speaker: gerald
          text: There is hope. I promise there is. And life is really as right as rain. You needn't despair. He isn't mad, and it wasn't a dream. It was magic. Truly, it was.
          emotion: calm
        - id: ch01-b58
          speaker: mademoiselle
          text: Magic does not exist. He is mad from the joy of seeing me again after so many days. Oh, la-la-la-la-la!
          emotion: sad
        - id: ch01-b59
          speaker: gerald
          text: Did he speak to the gods?
        - id: ch01-b60
          speaker: narrator
          text: Gerald asked the question gently.
        - id: ch01-b61
          speaker: mademoiselle
          text: That is the maddest idea of all. He says Mercury arranged to meet him at a certain temple tomorrow, when the moon rises.
        - id: ch01-b62
          speaker: gerald
          text: Right! That settles it. Dear, kind, pretty Mademoiselle Rapunzel, don't be a silly little duffer.
        - id: ch01-b63
          speaker: narrator
          text: For a moment Gerald became lost among the pet names he usually gave Kathleen when she was upset. Then he hurried to correct himself.
        - id: ch01-b64
          speaker: gerald
          text: I mean, please don't cry when there is no cause. Tomorrow he will go to that temple. I shall go. You shall go. He will go. We shall go. You will go. Everyone can go! Then he will see he isn't mad, and you will understand everything. It is going to be absolutely all right. Here is my handkerchief. It happens to be quite clean. I haven't even unfolded it. Please stop crying, there's a dear, darling, long-lost lover.
          emotion: calm
        - id: ch01-b65
          speaker: narrator
          text: This flood of words had some effect. Mademoiselle took his handkerchief. She sobbed, managed half a smile, and dabbed her eyes.
        - id: ch01-b66
          speaker: mademoiselle
          text: Oh, you naughty boy! Is this another trick you have played on him, like the ghost?
        - id: ch01-b67
          speaker: gerald
          text: I can't explain it. But I give you my word of honour—and you know what an Englishman's word of honour means, even if you are French—that everything will turn out exactly as you want. I have never lied to you. Please believe me.
        - id: ch01-b68
          speaker: mademoiselle
          text: It is strange, but I do believe you.
        - id: ch01-b69
          speaker: narrator
          text: Once again, so suddenly that Gerald could not have stopped her, she kissed him. In her hour of sorrow, however, he would have thought it mean to resist. He would probably have told himself that it pleased her and did not hurt him very much.
        - id: ch01-b70
          speaker: narrator
          text: And now moonrise was near. The French governess went out with the four children. They had brought Mabel back by sending an urgent letter-card the day before. Mademoiselle half doubted and half hoped, but she longed with all her heart to be near Lord Yalding, even if he was as mad as a March hare. Together they crossed the wet grass.
        - id: ch01-b71
          speaker: narrator
          text: The moon was still below the horizon, though its light already filled the sky and mingled with the pink and purple sunset. Dark clouds and deep colour weighed upon the west. In the east, where the moon would rise, the sky was clear as a rock pool.
        - id: ch01-b72
          speaker: narrator
          text: They passed over the lawn and through the beech wood. At last, after pushing through brambles and tangled undergrowth, they reached a small, level tableland rising from the flat hilltop like one table set upon another. A ring of enormous rough stones stood there. One had a curious round opening worn smooth around its edge.
        - id: ch01-b73
          speaker: narrator
          text: In the middle lay one great flat stone, lonely and full of meaning. It carried the heavy memory of ancient faiths and forgotten creeds. Something dark moved inside the circle. Mademoiselle broke away from the children, ran to it, and clung to its arm. It was Lord Yalding, and he was telling her to leave.
        - id: ch01-b74
          speaker: mademoiselle
          text: Never! If you are mad, then I am mad as well, because I believe the story these children tell. I have come to stay beside you and see whatever the rising moon shows us.
        - id: ch01-b75
          speaker: narrator
          text: The children stood by the flat stone holding hands. The magic in her voice moved them more deeply than any enchanted ring. They listened while trying not to listen.
        - id: ch01-b76
          speaker: lord_yalding
          text: Aren't you afraid?
        - id: ch01-b77
          speaker: mademoiselle
          text: Afraid, when I am with you?
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: She laughed. He put his arm around her, and the children heard her sigh.
        - id: ch01-b79
          speaker: lord_yalding
          text: Are you afraid, my darling?
        - id: ch01-b80
          speaker: narrator
          text: Gerald crossed the wide ring of turf especially to answer him.
        - id: ch01-b81
          speaker: gerald
          text: You can't be afraid while you are wearing the ring. And I'm sorry, but we can hear every word you say.
        - id: ch01-b82
          speaker: mademoiselle
          text: It does not matter. You already know that we love each other.
          emotion: happy
        - id: ch01-b83
          speaker: narrator
          text: She laughed again. Lord Yalding placed the ring on her finger, and they stood side by side. The white sleeve of his flannel coat made no line against her white dress. They looked as if they had been carved together from one block of marble.
        - id: ch01-b84
          speaker: narrator
          text: A faint grey light touched the top of the round opening in the stone and crept down one side. Soon the opening became a disc of light. A moonbeam shot through it and crossed the grey-green ground inside the circle. As the moon climbed, the beam tilted downward.
        - id: ch01-b85
          speaker: narrator
          text: The children drew back until they stood close beside the lovers. Lower and lower the moonbeam slanted. It reached the far end of the flat stone, moved steadily toward the middle, and at last touched the exact centre.
        - id: ch01-b86
          speaker: narrator
          text: Then it was as if a spring had been pressed and a fountain of light released. Everything changed. Or perhaps everything was simply revealed, and there were no secrets anymore. The whole plan of the world seemed plain, like an easy sum written in large figures on a child's slate. You wondered how anything could ever have puzzled you.
        - id: ch01-b87
          speaker: narrator
          text: Space had vanished. Every place anyone had seen or dreamed of was there. Time had vanished too. Everything anyone had ever done or dreamed of doing filled that single instant. It was one moment and eternity. It was the centre of the universe, and the whole universe itself. Eternal light rested upon the eternal heart of things and made it clear.
        - id: ch01-b88
          speaker: narrator
          text: None of the six people who watched that moonrise could ever connect it with ordinary time. The ray of moonlight could only have rested on the centre of the stone for a single instant. And yet that instant held time enough for many things to happen.
        - id: ch01-b89
          speaker: narrator
          text: From the hilltop they could see across the quiet park and the sleeping gardens. Shapes began moving through the grey-green distance and coming toward them.
        - id: ch01-b90
          speaker: narrator
          text: The great beasts arrived first. There were strange creatures from the world's beginning, enormous winged lizards and dragons that still lived in human memory, mammoths, and huge unfamiliar birds. They crawled up the hill and formed a ring outside the stones.
        - id: ch01-b91
          speaker: narrator
          text: Others came from much farther away than the garden. Stone gods of Egypt and Assyria approached, with bodies like bulls, wings like birds, and heads like hawks or cats. They were carved from stone, yet every one was alive and watchful. Grotesque creatures from cathedral towers joined them, along with angels whose wings were folded and beasts whose wings spread wide. Sphinxes came, and rough idols from southern islands fringed with palms.
        - id: ch01-b92
          speaker: narrator
          text: Last came the beautiful marble gods and goddesses. They were the ones who had feasted on the lake island and invited Lord Yalding and the children to this gathering.
        - id: ch01-b93
          speaker: narrator
          text: No one spoke. Each stone figure entered the circle of light and understanding gladly and quietly. They came like children tired after a long ramble, creeping through an open door into the warm, firelit welcome of home.
        - id: ch01-b94
          speaker: narrator
          text: The children had planned many questions, and they had been promised answers. Yet nobody said a word. They had entered the circle of the true magic, where everything could be understood without speech.
        - id: ch01-b95
          speaker: narrator
          text: Afterwards, not one of them could remember what had happened there. Still, they never forgot that they had been somewhere everything was easy and beautiful. Anyone who remembers even that much is never quite the same again. When they spoke of it the next day, they discovered that each person had kept one small part of that night's great understanding.
        - id: ch01-b96
          speaker: narrator
          text: All the stone beings pressed closer around the central stone. Where the moonbeam struck, the light seemed to burst into spray like water falling from a great height. Its whiteness bathed the entire gathering, and a deep silence covered them all.
        - id: ch01-b97
          speaker: narrator
          text: Then one purpose swept through that mighty crowd. Every face turned upward. Birds and beasts, Greek statues and Babylonian monsters, human children and human lovers all looked toward the radiance. One word rose from every voice.
        - id: ch01-b98
          speakers: [gerald, mabel, mademoiselle, lord_yalding]
          ensemble: chorus
          text: The light! The light! The light!
        - id: ch01-b99
          speaker: narrator
          text: Their voices sounded like a great wave. Then the light was gone. Sleep settled on every mortal eye, soft as floating thistledown.
        - id: ch01-b100
          speaker: narrator
          text: The grass felt cold and wet with dew, and clouds had covered the moon. The children and the lovers stood close together, clinging to one another not because they were afraid, but because they loved.
        - id: ch01-b101
          speaker: mademoiselle
          text: I want to go to the cave on the island.
          emotion: calm
        - id: ch01-b102
          speaker: narrator
          text: They moved very quietly through the gentle, brooding night. At the boathouse they freed the clanking chain, took the boat, and dipped the oars among drowned stars and lilies. They reached the island and found the steps.
        - id: ch01-b103
          speaker: gerald
          text: I brought candles, just in case.
        - id: ch01-b104
          speaker: narrator
          text: By the light of Gerald's candles they went down into the Hall of Psyche. Light glowed from her statue, and everything was just as the children remembered it.
        - id: ch01-b105
          speaker: narrator
          text: This was the Hall of Granted Wishes.
        - id: ch01-b106
          speaker: lord_yalding
          text: This is the ring.
        - id: ch01-b107
          speaker: mademoiselle
          text: The ring is the true magic ring. Long ago it was given to a mortal, and it is exactly what you say it is. A lady from my family gave it to your ancestor so that he could build her a garden and a house like the palace and garden she had known in her own country. This place was made partly by his love and partly by the ring's magic. She died before she could see it. That was the price the magic demanded.
        - id: ch01-b108
          speaker: narrator
          text: She must have been speaking English, because otherwise the children could not have understood her. Yet her words sounded nothing like Mademoiselle's usual way of speaking.
        - id: ch01-b109
          speaker: mademoiselle
          text: The ring always takes payment from grown people, though not from children. When your wish brought me back to you, you paid for me with the terror that you were losing your mind. Only one wish asks no payment.
        - id: ch01-b110
          speaker: lord_yalding
          text: And which wish is that?
        - id: ch01-b111
          speaker: mademoiselle
          text: The final wish. Shall I make it?
        - id: ch01-b112
          speakers: [lord_yalding, gerald, jimmy, kathleen]
          ensemble: chorus
          text: Yes. Make the wish.
        - id: ch01-b113
          speaker: mademoiselle
          text: Then I wish that every piece of magic this ring has made shall be undone. From now on, let the ring be nothing more and nothing less than a charm that binds you and me together forever.
        - id: ch01-b114
          speaker: narrator
          text: Her voice stopped. At the same moment, the enchanted glow faded. The windows of granted wishes went dark one by one, like pictures from a magic lantern. Gerald's candle now showed only a roughly arched cave. Psyche's statue was gone. In its place stood a stone with something carved upon it.
        - id: ch01-b115
          speaker: narrator
          text: Gerald lowered the candle so they could see.
        - id: ch01-b116
          speaker: mademoiselle
          text: It is her grave.
          emotion: sad
        - id: ch01-b117
          speaker: narrator
          text: The next day, nobody could remember anything clearly. But many things had changed. The magic ring was gone. There was only a plain gold ring, which Mademoiselle found clasped in her hand when she woke in her own bed that morning.
        - id: ch01-b118
          speaker: narrator
          text: More than half the jewels had vanished from the panelled room. The ones that remained no longer had secret woodwork to hide them. They lay openly on shelves covered in velvet. The passage behind the Temple of Flora had disappeared. So had many of the other secret passages and hidden rooms. There were far fewer statues in the garden than everyone had believed. Large parts of the castle itself were missing and had to be rebuilt at enormous cost.
        - id: ch01-b119
          speaker: narrator
          text: From this, we may suppose that Lord Yalding's ancestor had used the ring quite often while building his house. Fortunately, the jewels left behind were more than enough to pay for all the repairs.
        - id: ch01-b120
          speaker: narrator
          text: The magic vanished so suddenly that everyone who had known it felt shaken. Before long, they almost doubted that any of it had happened at all.
        - id: ch01-b121
          speaker: narrator
          text: One thing is certain. Lord Yalding married the French governess, and a plain gold ring was used in their wedding. If you think about it, that ring could only have been the magic ring, changed by the last wish into a charm that would keep husband and wife together forever.
        - id: ch01-b122
          speaker: narrator
          text: Perhaps you think this whole story is nonsense. Perhaps Gerald, Jimmy, Kathleen, and Mabel made up a heap of unlikely tales and persuaded me to trust them. If so, how do you explain the report printed in the evening newspapers on the day after that magical moonrise?
        - id: ch01-b123
          speaker: narrator
          text: Its headline announced the mysterious disappearance of a well-known City gentleman. The report said that a respected man from the financial world had vanished without leaving any trace.
        - id: ch01-b124
          speaker: narrator
          text: According to the paper, Mr. U. W. Ugli had stayed late at his office, as he sometimes did. The office door was found locked. When it was broken open, his clothes lay in a heap on the floor. Beside them were an umbrella, a walking stick, a golf club, and, most curiously, the feather brush a housemaid might use for dusting. No trace of his body could be found. The police were said to have a clue.
        - id: ch01-b125
          speaker: narrator
          text: If the police truly had a clue, they kept it to themselves. I do not believe they could have had one. That respected gentleman was, of course, the Ugly-Wugly who became real after he entered the Hall of Granted Wishes while searching for a truly good hotel.
        - id: ch01-b126
          speaker: narrator
          text: And if the story never happened, why are those four children such close friends with Lord and Lady Yalding? Why do they stay at the Towers during nearly every holiday?
        - id: ch01-b127
          speaker: narrator
          text: They may all pretend that I invented the entire story. But facts are facts, and you cannot explain them away.
