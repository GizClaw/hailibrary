audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点机敏的调侃
        timbre: 清澈圆润
        pace: 舒缓而有变化
        pitch: 中音
    gerald:
      display_name: 杰拉尔德
      tts:
        delivery: 自信机灵，爱用戏剧腔讲故事
        timbre: 明亮顺滑的少年声
        pace: 轻快
        pitch: 中音
    jimmy:
      display_name: 吉米
      tts:
        delivery: 直率好辩，怀疑中带着活力
        timbre: 清脆的少年声
        pace: 稍快
        pitch: 中高音
    kathleen:
      display_name: 凯瑟琳
      tts:
        delivery: 热心认真，富有想象力
        timbre: 清亮的少女声
        pace: 自然
        pitch: 中高音
    princess:
      display_name: 梅布尔
      tts:
        delivery: 从容俏皮，理所当然地自信
        timbre: 年轻而饱满的女声
        pace: 自然
        pitch: 中音
    lord_yalding:
      display_name: 亚尔丁勋爵
      tts:
        delivery: 温和风趣，克制中带着真诚
        timbre: 清朗沉稳的成年男声
        pace: 从容
        pitch: 中低音
    mademoiselle:
      display_name: 法国女教师
      tts:
        delivery: 文雅含蓄，中文里保留轻微的法语式语序
        timbre: 柔和明亮的成年女声
        pace: 稍缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            亚尔丁勋爵跟在梅布尔和吉米身后，穿过自家祖先留下的厅堂。他心里是什么滋味，写出来想必很有意思，可惜我无从知道。他大概既迷惑，又隐隐惊异，还想掐自己一下，看是不是在做梦。也许他反复在想，到底是自己疯了，还是孩子们疯了，却连该先回答哪一个都拿不定主意，更不知道无论选了哪一个，答案究竟是什么。孩子们讲起那些怪事，分明是真心相信。愿望实现了，鬼魂也出现了。他一定想过许多。可这些全是猜测。至于他究竟怎么想，我和你一样不知道。
        - id: ch01-b02
          speaker: narrator
          text: >-
            法国女教师心里想什么，我也说不准。我只知道她很幸福，看一眼她的脸，谁都明白。当初，她的监护人不许她嫁给一位穷勋爵，说是不该让她为婚姻牺牲财产，于是把她送进了修道院。随后，那位监护人自己卷走这笔财产，逃去了南美。她一贫如洗，只好亲自挣钱生活，出来做了家庭教师。她特意接受眼下这份差事，正因为这里离亚尔丁勋爵的家很近。即使她以为他已经抛弃自己、不再爱她，也仍想见他。如今，她终于见到了。两人手牵着手走过他的宅邸时，她或许正想着其中一些往事。当然，我还是不能确定。
        - id: ch01-b03
          speaker: narrator
          text: >-
            吉米的心思倒很好猜，简直像一本翻旧的书。他只想着，这下亚尔丁勋爵非信我不可了。勋爵信不信他，竟莫名其妙地成了全世界最重要的事。他真希望杰拉尔德和凯瑟琳也在，一同见证自己的胜利。可那两人正帮梅布尔的姨妈给华丽的家具重新蒙上罩子，没赶上后来的事。其实他们也没错过多少。众人紧紧围在梅布尔身旁，走进那间有墙板的小屋。梅布尔得意地开口。
        - id: ch01-b04
          speaker: princess
          text: >-
            现在您就会看见了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            大家等了一会儿。结果什么也没发生。梅布尔伸手摸索，手指忽然又热又湿。
        - id: ch01-b06
          speaker: princess
          text: >-
            这里一定有个暗机关。
        - id: ch01-b07
          speaker: lord_yalding
          text: >-
            在什么地方？
        - id: ch01-b08
          speaker: princess
          text: >-
            就在这里呀，只是我怎么也找不到了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            她真的找不到。窗下那块秘密墙板的机关，她倒很快摸到了。可比起大家想象过、至少有两个人亲眼见过的珠宝，这东西实在无趣。至于那个能让橡木墙板滑开，把价值足够赎回一位国王的珠宝明明白白露出来的机关，却根本不在那里。一双双仔细的手摸遍了墙板的每一寸。梅布尔和吉米起初还一个劲儿认真申辩，后来声音越来越小，终于也沉默了。人人都觉得耳朵发烫，不愿看别人的眼睛，还憋着一股怨气，觉得这机关故意不肯好好配合，一点也不守比赛规矩。
        - id: ch01-b10
          speaker: lord_yalding
          text: >-
            你们的玩笑也开够了，假如这还能叫玩笑。这些蠢事我已经受够了。把戒指给我。既然你们说它是在这里找到的，我想它本来就该归我。往后别再提什么魔法和魔咒。
          emotion: angry
        - id: ch01-b11
          speaker: princess
          text: >-
            戒指在杰拉尔德手上。
          emotion: sad
        - id: ch01-b12
          speaker: lord_yalding
          text: >-
            那你们两个一起去，把他叫来。
        - id: ch01-b13
          speaker: narrator
          text: >-
            两个孩子垂头丧气地退出房间。趁他们不在，亚尔丁勋爵向法国女教师解释，和另外一些更要紧的东西相比，珠宝根本不值一提。没过多久，梅布尔和吉米带着杰拉尔德、凯瑟琳回来，四个孩子一同站到他们面前。
        - id: ch01-b14
          speaker: lord_yalding
          text: >-
            戒指的事到此为止。把它交给我，以后谁也别再提了。
        - id: ch01-b15
          speaker: gerald
          text: >-
            我……我摘不下来。它一向很有自己的主意。
        - id: ch01-b16
          speaker: lord_yalding
          text: >-
            我马上替你摘下来。
        - id: ch01-b17
          speaker: narrator
          text: >-
            可勋爵也没能摘下来。
        - id: ch01-b18
          speaker: lord_yalding
          text: >-
            用肥皂试试。
        - id: ch01-b19
          speaker: narrator
          text: >-
            听见这话的五个人里，有四个完全知道肥皂不会有用。梅布尔突然哭了起来。
        - id: ch01-b20
          speaker: princess
          text: >-
            他们不相信珠宝的事，我又找不到机关。我们把四处都摸遍了。它明明就在这里，可是……
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: >-
            她说着说着，手指忽然碰到了机关。话音刚落，雕花墙板就滑开了。铺着蓝丝绒的层层架子上摆满珠宝，赫然出现在亚尔丁勋爵和他未来妻子的眼前。
        - id: ch01-b22
          speaker: lord_yalding
          text: >-
            天哪！
          emotion: surprised
        - id: ch01-b23
          speaker: mademoiselle
          text: >-
            慈悲的上帝！
          emotion: surprised
        - id: ch01-b24
          speaker: princess
          text: >-
            为什么现在又行了？刚才怎么不行？
          emotion: surprised
        - id: ch01-b25
          speaker: gerald
          text: >-
            我看这就是魔法。这里根本没有真正的机关。刚才戒指不在，机关才不起作用。福玻斯不是说过吗，这枚戒指是所有魔法的心脏。把墙板关上，拿走戒指，再试一次。
        - id: ch01-b26
          speaker: narrator
          text: >-
            大家关上墙板，又把戒指带出房间，照他说的试了一遍。戒指一拿走，机关便不见了，无论怎么摸也摸不到。戒指回到屋里，机关果然又好端端地出现。杰拉尔德照例指出，自己又一次说对了。梅布尔也赶忙转向勋爵，提醒他眼前的证据。
        - id: ch01-b27
          speaker: princess
          text: >-
            所以您看，我没有骗人。
        - id: ch01-b28
          speaker: lord_yalding
          text: >-
            我看得出，这机关藏得实在巧妙。你们能找到它，的确很聪明。至于这些珠宝要是真的……
        - id: ch01-b29
          speaker: princess
          text: >-
            它们当然是真的！
          emotion: angry
        - id: ch01-b30
          speaker: lord_yalding
          text: >-
            好吧，不管怎样，多谢你们。天好像要放晴了。吃过午饭，我叫四轮马车送你们回家。还有，要是你们不介意，戒指就交给我。
        - id: ch01-b31
          speaker: narrator
          text: >-
            肥皂和水折腾了半个小时，只把杰拉尔德的手指弄得又红又疼。亚尔丁勋爵终于说了一句极不耐烦的话，杰拉尔德也恼了。
        - id: ch01-b32
          speaker: gerald
          text: >-
            好吧，我真希望它赶快脱下来！
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: >-
            话一出口，戒指立刻像抹了黄油一样滑了下来。这是杰拉尔德后来特别指出的。
        - id: ch01-b34
          speaker: lord_yalding
          text: >-
            多谢。
        - id: ch01-b35
          speaker: narrator
          text: >-
            后来回到家，孩子们舒舒服服地坐在屋顶平台上，把整件事从头到尾细细议论了一遍。他们中间放着一罐菠萝罐头，大家一起分着吃，每个人手边还有一整瓶姜汁汽水。
        - id: ch01-b36
          speaker: gerald
          text: >-
            我看他准以为，是我故意不肯摘戒指。有些人真是怎么也讨好不了。他发现法国女教师要跟我们一起走，就不急着套马车送人了。还是做庄园管事时的他更讨人喜欢。照现在这样看，我们以后大概不会再喜欢他了。
        - id: ch01-b37
          speaker: kathleen
          text: >-
            他不知道自己出了什么毛病。其实是魔法在起作用，就像要出麻疹时那股难受劲儿。你们还记得梅布尔刚开始隐身时，脾气有多坏吧？
        - id: ch01-b38
          speaker: jimmy
          text: >-
            怎么不记得！
        - id: ch01-b39
          speaker: gerald
          text: >-
            一部分是因为魔法，另一部分是因为他恋爱了。我尽量说句公道话。学校里有个家伙告诉我，恋爱总会把人变成傻瓜。他姐姐订婚以前还挺不错，订婚以后简直糟透了。
        - id: ch01-b40
          speaker: narrator
          text: >-
            喝茶时，法国女教师容光焕发。她像圣诞卡上的小姐一样动人，像绒猴一样快活，又像你自己肯费心时那么和善。晚饭时还是这样，第二天早饭时也丝毫没变。随后，亚尔丁勋爵来看她。两人在客厅见面，孩子们极其识趣，全都把自己关在教室里。可杰拉尔德上楼回房拿铅笔时，却撞见伊莱扎把耳朵牢牢贴在客厅门的钥匙孔上。
        - id: ch01-b41
          speaker: narrator
          text: >-
            杰拉尔德便拿了本书，坐在楼梯最上一级。屋里的谈话，他一个字也听不到，可从这里能看清房门，也能保证别人无法偷听。门一开，他正好看见亚尔丁勋爵出来。我们的小英雄后来声称，自己极其得体地咳嗽了一声，提醒对方有人在场。勋爵却像没听见。他茫然地朝帽架走去，在雨伞和胶布雨衣间笨手笨脚地摸索，好不容易才找到草帽。他阴沉地看了帽子一眼，往头上一扣便出了门，还全不顾惜地把门摔得震天响。
        - id: ch01-b42
          speaker: narrator
          text: >-
            亚尔丁勋爵走时忘了关客厅门。杰拉尔德特意坐在关门时什么也听不见的位置，可门一敞开，屋里的声音便清清楚楚传了出来。他又难过又厌恶地发现，那是抽泣和一声声吸鼻子的声音。毫无疑问，法国女教师正在哭。
        - id: ch01-b43
          speaker: gerald
          text: >-
            乖乖，他们可真不耽误工夫。这么快就吵起来了！但愿我永远不用做谁的情郎。
        - id: ch01-b44
          speaker: narrator
          text: >-
            可现在不是忧虑自己未来的时候。伊莱扎随时会来，毫不迟疑地闯进法国女教师最隐秘的伤心里。杰拉尔德觉得，还是自己进去更好。他踩着楼梯上磨旧的绿色荷兰地毯，轻轻走进客厅，再把门关严。
        - id: ch01-b45
          speaker: mademoiselle
          text: >-
            一切都完了。他不肯娶我！
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: >-
            她把脸埋进一只靠垫。那是从前一位学生绣的，红底上缀着珠子绣成的马蹄莲。别问杰拉尔德怎样取得了她的信任。故事刚开始时我大概说过，只要他愿意，对付大人总有一套讨人喜欢的办法。此刻，他握着她的手，亲热得像在安慰头疼的母亲。一会儿劝她别这样，一会儿说别哭，又保证事情准会好起来。为了叫她舒服些，他还轻轻拍她的背，请她把原委全说出来。这不只是好奇。他越来越肯定，不管出了什么问题，根源一定在戒指上。事实证明，他又说对了。
        - id: ch01-b47
          speaker: narrator
          text: >-
            法国女教师讲的故事很不寻常。昨天晚饭后，亚尔丁勋爵到园林里散步，说是为了想些事情。
        - id: ch01-b48
          speaker: gerald
          text: >-
            对，我知道。而且他戴着戒指。后来他看见了……
        - id: ch01-b49
          speaker: mademoiselle
          text: >-
            他看见石像活了过来。你们那些荒唐的仙女故事搅乱了他的脑子。他看见阿波罗和阿佛洛狄忒在大理石台座上活过来，便想起你们讲的故事，还希望自己也变成一座石像。后来他彻底疯了，以为湖心岛的故事是真的。他跳进湖里，在诺亚方舟里的野兽中间游水，又在岛上和众神一起吃饭。天快亮时，他的疯狂稍稍退去，以为那座万神殿已经消失。可他自己呢？不，他仍觉得自己是一座石像，一直躲着花园里的园丁，躲到差一刻九点。后来他希望自己不再是石像，这才发现自己有血有肉。他说那不是一场噩梦，而是自己真的疯了。疯子不能结婚。没有希望了，我已经绝望了，活着也没有意思！
          emotion: sad
        - id: ch01-b50
          speaker: gerald
          text: >-
            有希望，我保证有。日子其实好端端的，根本不用绝望。他没有疯，也不是做梦。那是魔法，真真正正的魔法。
        - id: ch01-b51
          speaker: mademoiselle
          text: >-
            魔法不存在，是他疯了。一定是重新见到我，让他高兴得发疯。哦，啦——啦啦啦啦！
          emotion: sad
        - id: ch01-b52
          speaker: gerald
          text: >-
            他和那些神说话了吗？
        - id: ch01-b53
          speaker: mademoiselle
          text: >-
            这才是他最疯狂的念头。他说墨丘利约他明天月亮升起时，到一座神庙见面。
        - id: ch01-b54
          speaker: gerald
          text: >-
            对了，这下全对了！亲爱的、善良的、好看的长发姑娘小姐，别做个傻乎乎的小笨蛋……我是说，请别做一位无缘无故哭泣的小姐。明天他会去那座神庙，我也去，您也去，大家全都去！一切都会好起来。他会知道自己没疯，您也会明白所有的事。拿我的手帕吧，碰巧干净得很，连展开都没展开过。别哭啦，做个亲爱的、可爱的、失而复得的情人吧。
        - id: ch01-b55
          speaker: narrator
          text: >-
            这番滔滔不绝的话果然有效。她接过手帕，抽泣着微微一笑，轻轻蘸了蘸眼睛。
        - id: ch01-b56
          speaker: mademoiselle
          text: >-
            哦，你这个淘气鬼！这是你们捉弄他的把戏吗？就像那个鬼魂？
        - id: ch01-b57
          speaker: gerald
          text: >-
            我没法解释，可我拿名誉担保。您知道英国人的名誉担保有多重吧？就算您是法国人，也该知道。事情一定会如您所愿。我从没对您撒过谎。相信我！
        - id: ch01-b58
          speaker: mademoiselle
          text: >-
            真奇怪，可我的确相信你。
        - id: ch01-b59
          speaker: narrator
          text: >-
            她又突然吻了他，叫他来不及反抗。不过在她这样伤心的时候，他即使来得及，也会觉得反抗太不厚道。他大概会想，这能叫她高兴，对自己也没多大损害。
        - id: ch01-b60
          speaker: narrator
          text: >-
            月亮快升起来了。法国女教师半信半疑，半怀希望，却一心要留在亚尔丁勋爵身边，哪怕他疯得像三月的野兔也不离开。她和四个孩子踏过露水沾湿的草地。孩子们前一天寄出一张写着急事的明信片，这才把梅布尔也叫了来。月亮还没露面，月光却已经映在天空，与落日的粉红和紫色交在一起。西边压着墨色的浓云，色彩浓得化不开。月亮将要升起的东方，却清澈得像一潭石间碧水。
        - id: ch01-b61
          speaker: narrator
          text: >-
            他们穿过草坪和山毛榉林，又钻过纠结的灌木和荆棘，终于来到山顶一小片突起的平地。那片平地高出平坦的山顶，像一张桌面上又架起一张桌面。那里立着一圈粗砺的巨石，一块石头上穿着奇异的圆洞，洞沿已经磨得光滑。石圈中央横着一块孤零零的宽阔平石。它既荒凉又意味深长，积满了早被遗忘的古老信仰。圈里有个黑影在动。法国姑娘挣开孩子们，奔过去紧紧挽住那人的手臂。那是亚尔丁勋爵，他正叫她离开。
        - id: ch01-b62
          speaker: mademoiselle
          text: >-
            我这一辈子也不走！要是您疯了，我也疯了，因为我相信这些孩子。我就在这里陪您，和您一起看升起的月亮会让我们看见什么。
        - id: ch01-b63
          speaker: narrator
          text: >-
            孩子们手牵着手站在平石旁，竭力装作没听见。姑娘声音里的魔力，比任何魔法戒指都更叫他们感动。
        - id: ch01-b64
          speaker: lord_yalding
          text: >-
            你不害怕吗？
        - id: ch01-b65
          speaker: mademoiselle
          text: >-
            害怕？有您在身边？
        - id: ch01-b66
          speaker: narrator
          text: >-
            她笑起来。他伸手搂住她，孩子们听见她轻轻叹了一口气。
        - id: ch01-b67
          speaker: lord_yalding
          text: >-
            你害怕吗，我的爱人？
        - id: ch01-b68
          speaker: gerald
          text: >-
            戴着戒指就不会害怕。还有，对不起，你们说的每一个字，我们全听得见。
        - id: ch01-b69
          speaker: mademoiselle
          text: >-
            没关系，反正你们早就知道我们彼此相爱。
          emotion: happy
        - id: ch01-b70
          speaker: narrator
          text: >-
            亚尔丁勋爵把戒指戴在她的手指上，两人并肩而立。他白色的法兰绒外套衣袖与她的白裙挨在一起，中间看不见一丝界线。远远望去，两个人仿佛是从同一块大理石里雕出来的。
        - id: ch01-b71
          speaker: narrator
          text: >-
            一抹淡淡的灰白碰上圆洞顶端，沿着洞边缓缓爬升。圆洞渐渐变成明亮的圆盘。一束月光笔直穿过洞口，横落在石圈里的灰绿色地面上，又随着月亮升高，慢慢向下倾斜。孩子们一步步后退，直到紧挨那对恋人。月光越来越斜。它先碰到平石远端，又一点点移近中央，最后落在中心那块石头真正的心脏上。那一刻，像是某个机关被触动了，一道光的喷泉猛然涌出。
        - id: ch01-b72
          speaker: narrator
          text: >-
            万物都改变了。不，与其说改变，不如说终于显出本来面目。世间再没有秘密。世界的布局一目了然，就像用大字写在孩子石板上的一道简单算术题。人不禁奇怪，自己从前怎么会对任何事情感到困惑。空间消失了，凡是见过或梦想过的地方，全都在这里。时间也消失了，曾经做过或梦想去做的一切，都涌进这一瞬。它是一刻，也是永恒。它是宇宙的中心，也是宇宙本身。永恒的光停在万物永恒的心上，将它照亮。
        - id: ch01-b73
          speaker: narrator
          text: >-
            看见那轮月亮升起的六个人，后来谁也无法把这件事和时间联系起来。月光完全落在石头中央，明明只可能停留一瞬。可就在那一瞬，许多事情都有了发生的时间。
        - id: ch01-b74
          speaker: narrator
          text: >-
            从高地望去，宁静的园林和沉睡的花园尽收眼底。一个个身影穿过灰绿色的夜色，从远处向他们走来。最先出现的是世界初生时便存在的巨兽。长着翅膀的巨蜥来了，活在人类记忆里的龙来了，猛犸象和古怪的巨鸟也来了。它们缓缓爬上山坡，在石圈外一一排开。
        - id: ch01-b75
          speaker: narrator
          text: >-
            接着，从遥远地方赶来了埃及与亚述的石神。它们有公牛的身躯、飞鸟的翅膀，有鹰头，也有猫首。它们全由石头雕成，却个个鲜活警醒。大教堂塔楼上的怪像来了，收拢翅膀的天使来了，张开双翼的野兽也来了。斯芬克斯和南方棕榈岛屿上的粗陋神像也在其中。最后，是那些美丽的大理石神祇。他们曾在湖心岛上欢宴，也邀请过亚尔丁勋爵和孩子们参加这场聚会。
        - id: ch01-b76
          speaker: narrator
          text: >-
            没有谁开口。每一尊石像都欣喜而安静地走进光明与领悟的圆环，就像走了很远的路、已经疲倦的孩子，悄悄穿过敞开的门，回到炉火照亮的温暖家中。孩子们原本准备了许多问题，对方也答应会一一回答。可现在，没有一个人说话。他们已经走进真正魔法的圆环，在那里，万事无须言语便能明白。
        - id: ch01-b77
          speaker: narrator
          text: >-
            后来，他们谁也记不起那里究竟发生了什么。他们只知道，自己曾到过一个万事都简单而美丽的地方，而且永远没有忘记。一个人只要还能记住这么一点，就再也不会和从前完全一样。第二天，大家谈起那一夜时才发现，每个人心里都留下了那场伟大启示的一小部分。
        - id: ch01-b78
          speaker: narrator
          text: >-
            所有石头生灵都向中央的石头靠拢。月光击中石面的地方，光芒像水从高处坠下那样，化作水雾般的飞沫。洁白的光沐浴着所有来客，深沉的静默笼罩着这场浩大的集会。忽然，同一个意念如波涛般扫过庞大的队伍。飞鸟、走兽、希腊雕像、巴比伦怪物、人类的孩子和相爱的恋人，全都仰起脸。灿烂的光照亮他们，所有人口中迸出同一个词。
        - id: ch01-b79
          speakers: [lord_yalding, mademoiselle, gerald, princess]
          ensemble: chorus
          text: >-
            光！光！光……
        - id: ch01-b80
          speaker: narrator
          text: >-
            那声音像一阵巨浪。随后，光消失了。睡眠像飘飞的蓟絮，轻轻落在除不朽者外所有人的眼睛上。
        - id: ch01-b81
          speaker: narrator
          text: >-
            草地冰凉，沾满露水，云遮住了月亮。恋人和孩子们站在一起，彼此紧紧依偎，不是因为害怕，而是因为爱。
        - id: ch01-b82
          speaker: mademoiselle
          text: >-
            我想去湖心岛上的洞窟。
        - id: ch01-b83
          speaker: narrator
          text: >-
            他们在温柔沉静、仿佛低头沉思的夜色中走到船屋，解开哗啦作响的锁链。船划出去，双桨一次次浸入水里，落在沉没的星光和睡莲之间。到了湖心岛，他们又找到了通向地下的那道台阶。
        - id: ch01-b84
          speaker: gerald
          text: >-
            我带了蜡烛，以防万一。
        - id: ch01-b85
          speaker: narrator
          text: >-
            一行人借着杰拉尔德带来的烛光，沿台阶向下，重新走进普绪刻之厅。她的雕像仍在那里放出柔和的光辉，照亮整座大厅。四周的一切都和孩子们上次看到时一样。这里，正是那座愿望实现之厅。
        - id: ch01-b86
          speaker: lord_yalding
          text: >-
            戒指。
        - id: ch01-b87
          speaker: mademoiselle
          text: >-
            这枚戒指，就是很久以前赐给一个凡人的魔法戒指。你说它是什么，它便是什么。我家的一位小姐把它送给你的祖先，好让他仿照她故乡的宫殿和庭园，为她建造一座宅邸和花园。这个地方，一半由他的爱情筑成，一半由戒指的魔法筑成。可是她没能活着看到它完工。那就是魔法索取的代价。
        - id: ch01-b88
          speaker: narrator
          text: >-
            她说的一定是英语，不然孩子们怎么可能全听懂？可这些话的句法和声音，一点也不像法国女教师平日说话的样子。
        - id: ch01-b89
          speaker: mademoiselle
          text: >-
            戒指会向每一个大人索取代价，只有孩子例外。你许愿让我来到身边，之后便受尽以为自己发疯的恐惧，那就是你为我付出的代价。只有一个愿望不用偿还。
        - id: ch01-b90
          speaker: lord_yalding
          text: >-
            那个愿望是……
        - id: ch01-b91
          speaker: mademoiselle
          text: >-
            最后一个愿望。让我来许吗？
        - id: ch01-b92
          speakers: [lord_yalding, gerald, jimmy, kathleen, princess]
          ensemble: chorus
          text: >-
            许吧！
        - id: ch01-b93
          speaker: mademoiselle
          text: >-
            那么，我希望这枚戒指施过的一切魔法全都消解。我还希望戒指本身不多也不少，只化作一道护符，让你我永远相守。
        - id: ch01-b94
          speaker: narrator
          text: >-
            她话音一落，魔法的光辉便熄灭了。那些实现愿望的窗景像一幅幅幻灯画片，一扇接一扇暗下去。大厅也不见了。杰拉尔德的蜡烛只发出一点微弱的光，照亮一座拱顶粗糙的洞窟。普绪刻雕像原先站立的地方，只剩下一块刻着字的石头。杰拉尔德俯下身，把烛光放低，让大家看清上面的字。
        - id: ch01-b95
          speaker: mademoiselle
          text: >-
            这是她的坟墓。
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: >-
            第二天，谁也不能确切记起任何事情，可许多东西都变了。魔法戒指不见了。法国女教师早晨在自己床上醒来时，只发现一枚普通金戒指紧扣在掌心。墙板房间里的珠宝少了一大半，剩下的也没有墙板遮挡，只赤裸裸地躺在丝绒架子上。花神庙后面的通道消失了，不少秘密过道和隐藏房间也不见了。花园里的石像，远没有大家原先以为的那么多。城堡甚至缺失了好几大片地方，只得花费巨资一一重建。
        - id: ch01-b97
          speaker: narrator
          text: >-
            从这些变化可以看出，亚尔丁勋爵的祖先当初建造城堡时，没少借助那枚戒指。不过，幸好留下的珠宝还完全足够支付修复城堡的一切费用。戒指的魔法猛然间全部消解，让所有相关的人都大受震动。如今，他们甚至开始怀疑，那些魔法究竟是否真的发生过。
        - id: ch01-b98
          speaker: narrator
          text: >-
            可有一件事千真万确。亚尔丁勋爵后来娶了那位法国女教师，婚礼上用的是一枚普普通通的金戒指。仔细想想，那不可能是别的。它正是从前的魔法戒指，被最后一个愿望变成了一道护符，要让亚尔丁勋爵和妻子永远相守。
        - id: ch01-b99
          speaker: narrator
          text: >-
            要是这个故事全是胡说，是凭空编出来的，要是杰拉尔德、吉米、凯瑟琳和梅布尔只拿一大堆荒诞离奇的谎话骗了轻信的我，那么月亮升起、魔法显现后的第二天，晚报上的那段消息又该怎么解释？那段报道的标题写得清清楚楚，知名金融界人士离奇失踪。
        - id: ch01-b100
          speaker: narrator
          text: >-
            报道说，一位在金融界赫赫有名、备受敬重的绅士突然消失，没有留下半点踪迹。U·W·厄格利先生偶尔会留在办公室工作到很晚，这次也是如此。第二天，人们发现办公室房门从里面锁着，只得把门撞开。屋里不见人影，只有这位不幸绅士的衣服堆在地板上。旁边还放着一把雨伞、一根手杖、一支高尔夫球杆，以及一件颇为古怪的东西，那是女仆平日清扫灰尘用的羽毛掸子。所有这些物件都好端端留在原处，可是他的身体却无影无踪。据说，警方已经掌握了一条线索。
        - id: ch01-b101
          speaker: narrator
          text: >-
            就算他们真有线索，也一直藏着没告诉任何人。可我认为，他们根本不可能掌握什么线索。那位受人敬重的绅士，当然就是那个变成真人的丑八怪。他为了寻找一家真正的好旅馆，误打误撞闯进了愿望实现之厅。还有，要是这一切从没发生过，那四个孩子怎么会跟亚尔丁勋爵和夫人成为那么要好的朋友，几乎每逢学校放假，都住到他们的高塔宅邸去呢？
        - id: ch01-b102
          speaker: narrator
          text: >-
            他们尽可以装作若无其事，硬说整个故事从头到尾都是我一个人编出来的。可事实就是事实。无论他们怎样辩解，也无论你怎样解释，都休想把这些事实说得无影无踪。
