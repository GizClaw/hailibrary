audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    aunt_susan:
      display_name: 苏珊姑妈
      tts:
        delivery: 随和爽快，说话带着好心情
        timbre: 明亮温和的成年女声
        pace: 中速
        pitch: 中高音
    shopkeeper:
      display_name: 糖果店主
      tts:
        delivery: 亲切利落，偶尔带点打趣
        timbre: 结实明朗的成年声
        pace: 中速
        pitch: 中音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    joan:
      display_name: 琼
      tts:
        delivery: 天真坦率，关心别人时格外认真
        timbre: 轻柔清脆的女孩声
        pace: 中速偏快
        pitch: 高音
    mrs_clive:
      display_name: 克莱夫太太
      tts:
        delivery: 关切直爽，叫女儿时干脆利落
        timbre: 温和清晰的成年女声
        pace: 中速
        pitch: 中音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 清楚利落，带一点姐姐的责备
        timbre: 明亮清晰
        pace: 中速
        pitch: 中高音
    jack_morgan:
      display_name: 杰克·摩根
      tts:
        delivery: 彬彬有礼，尴尬时说话犹疑断续
        timbre: 清朗的年轻男声
        pace: 中速偏慢
        pitch: 中音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    maid:
      display_name: 女佣
      tts:
        delivery: 恭敬利落，通报时简洁清楚
        timbre: 清晰的成年女声
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一先令的两种享受
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 事情得从威廉的姑妈说起。那天早晨，她心情很好，请威廉帮她寄信，再把杂货店的东西带回来，还给了他一先令。
        - id: ch01-b02
          speaker: aunt_susan
          text: 拿去买点糖吧，或者看场电影也行。
        - id: ch01-b03
          speaker: narrator
          text: 威廉沿大路慢慢走，盯着手里的硬币细细盘算。一先令就是两个六便士，那么糖和电影，不是两样都能要吗？
        - id: ch01-b04
          speaker: narrator
          text: 威廉买糖有一条定规，分量比品质要紧。方圆两英里里，哪位店主会在秤平之后多添一颗，他清楚得很，也只去这些店。称糖时，他总是绷着脸，睁大眼睛盯住秤盘。那些小气的店，早被他列入黑名单了。
        - id: ch01-b05
          speaker: narrator
          text: 他来到最喜欢的糖果店，在橱窗前站了整整五分钟。到底选醋栗眼珠糖，还是大理石弹珠糖？这是一场很难做出决定的较量。两种都是两便士买四盎司。再贵的东西，威廉从来不考虑。终于，他紧皱的眉头松开了，他已经选好，便走进店里。
        - id: ch01-b06
          speaker: william
          text: 给我来六便士的醋栗眼珠糖。
        - id: ch01-b07
          speaker: narrator
          text: 他说这话时有点不自在。平时他买糖，极少花到一便士。
        - id: ch01-b08
          speaker: shopkeeper
          text: 哟，今天可真阔气！
          emotion: surprised
        - id: ch01-b09
          speaker: william
          text: 今早刚得了点钱。
        - id: ch01-b10
          speaker: narrator
          text: 店主又惊讶又觉得好笑。威廉却说得满不在乎，派头像个大富翁。接着，他一声不响地盯着那些翠绿的糖装上秤。他一眼不眨，从头到尾没放过秤盘的任何动静。秤盘一沉，店主果然又添了一颗。威廉很满意，像接过宝贝一样接过纸袋，塞了两颗糖进嘴，然后走出店门。
        - id: ch01-b11
          speaker: narrator
          text: 他慢慢含着糖，沿大路走向电影院。威廉并不常看电影，这辈子也只看过一回。
        - id: ch01-b12
          speaker: narrator
          text: 那天的节目精彩得让人透不过气。第一出里有一群亡命徒。他们每从一座房子里走出来，都要缩起肩膀，弓着腰，先警惕地左看右看。确定一番以后，他们才故意装出鬼鬼祟祟的样子，偷偷摸摸地往前走。可无论在什么时候，无论走到什么地方，这种走法都会立刻惹来别人的注意和怀疑。
        - id: ch01-b13
          speaker: narrator
          text: 这个故事的曲折多得不得了。警察一路追赶，亡命徒跳上一列正在飞驰的火车，又不知为什么，从火车跳进一辆开动的汽车，最后还从汽车里一头扎进奔流的河水。画面一个接一个，惊险得不给人喘气的工夫。威廉看得心惊肉跳，他一动不动，眼睛睁得溜圆，全副心神都进了电影。只有他的上下牙床一刻没停，他的手也会不时自动伸进膝上的纸袋，一颗接一颗地摸出醋栗眼珠糖，送进嘴里。
        - id: ch01-b14
          speaker: narrator
          text: 第二出是朴素的乡村爱情故事。一位纯朴的乡下姑娘有两个追求者。其中那位乡绅留着两撇小胡子，光凭这个标志，观众就能看出他是坏人。经过一重又一重的波折，姑娘终于爱上了一位穿着漂亮乡村服装的本地小伙子。小伙子想表达什么感情，全靠一套艰难得像体操的手势。看来要做出这些动作，还得有非常高明的体操本领。那个坏人最后进了监狱，日渐憔悴，却还是时不时挤眉弄眼。
        - id: ch01-b15
          speaker: narrator
          text: 下一出仍是爱情故事。一对心地高尚的男女爱得死去活来，却从头到尾都不能走到一起。他们之间不但有一连串只会出现在电影里的误会，姑娘还有姑娘的骄傲和矜持，小伙子也有男人的骄傲和矜持。两人只能把满腔的热情全都藏起来，外表仍然摆得冷淡又傲慢。
        - id: ch01-b16
          speaker: narrator
          text: 姑娘失去了父母，她的哥哥便像个善良的仙人，始终温柔地照顾她。最后，他分别告诉两人，对方心里的爱情其实烧得正旺。威廉深受感动。
        - id: ch01-b17
          speaker: narrator
          text: 接着是一出喜剧。开头只有一个工人在给门刷新漆，到了结尾，却有一大群毫不相干的人浑身是漆，叠成一堆从楼梯上滚下去。威廉笑得前仰后合，整个影院都听得见。
        - id: ch01-b18
          speaker: narrator
          text: 最后一出讲的是一个酒鬼怎样一步步堕落。开头，他还是穿晚礼服的放荡年轻人，喝着烈酒打牌。到了末尾，他已经变成衣衫褴褛的放荡老头，可还在喝酒打牌。
        - id: ch01-b19
          speaker: narrator
          text: 他有个年幼的女儿，总是一脸虔诚和高尚，整天流着泪劝父亲改过。有一回，父亲终于忍无可忍，这倒也可以理解。他抓起啤酒瓶，朝女儿头上扔去。后来，他伏在女儿的病床前，眼泪洒湿床铺。他揪头发，向天举起双臂，捶打自己的背心，又把孩子紧紧搂住。被这样折腾一番，孩子病情反复也就不奇怪了。
        - id: ch01-b20
          speaker: narrator
          text: 女儿临终前对父亲说，不要再想他做过的事，她已经原谅了他。说完，她安详地离开了人世。
        - id: ch01-b21
          speaker: narrator
          text: 电影结束时，威廉深深吸了口气。他嘴里还含着糖，跟着人群起身，走出了电影院。
    - id: ch02
      title: 亡命徒和乡村情人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一到外面，威廉就警惕地左右看了看，然后鬼鬼祟祟地往家走。他突然急转身，冲进一条后街，想甩掉想象中的追兵。他掏出铅笔，对准空荡荡的前方开了两枪。两个追兵当场毙命，其他人反而追得更凶了。
        - id: ch02-b02
          speaker: narrator
          text: 事情万分紧急。威廉拼命冲进下一条街，跑过一位上了年纪的先生，踩疼了他的脚趾，只留他在后面骂个不停。快到家门时，威廉又拔出铅笔，回头对着大路开枪，同时一头冲进院门。
        - id: ch02-b03
          speaker: narrator
          text: 布朗先生那天头疼得厉害，肝也不大舒服，所以留在家里。他从杜鹃花丛正中央爬起来，一把揪住威廉的后领。
        - id: ch02-b04
          speaker: father
          text: 你这小混蛋！一头撞到我身上，到底想干什么？
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 威廉轻轻挣脱出来。
        - id: ch02-b06
          speaker: william
          text: 我没撞您，爸爸。我就像别人一样，从大门走进来。只是没往您那边看。可人又不能同时看四面八方，因为……
        - id: ch02-b07
          speaker: father
          text: 闭嘴！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 布朗先生和家里其他人一样，最怕威廉没完没了地说下去。
        - id: ch02-b09
          speaker: father
          text: 你舌头怎么了？伸出来！
        - id: ch02-b10
          speaker: narrator
          text: 威廉乖乖照做。他那条舌头绿得惊人，就连春天最鲜嫩的颜色看了都得自愧不如。
        - id: ch02-b11
          speaker: father
          text: 我说过多少遍了？两顿饭中间，不许你到处吃这种脏东西，这种毒物！
          emotion: angry
        - id: ch02-b12
          speaker: william
          text: 那不脏，也不是毒。就是几颗糖。苏珊姑妈给我的，因为我好心帮她去邮局，然后……
        - id: ch02-b13
          speaker: father
          text: 闭嘴！那种恶心东西还有没有？
          emotion: angry
        - id: ch02-b14
          speaker: william
          text: 才不恶心，好吃得很。您尝一颗就知道了。这就是苏珊姑妈给我的糖，因为我好心帮她……
        - id: ch02-b15
          speaker: father
          text: 闭嘴！糖在哪儿？
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 威廉慢吞吞地掏出纸袋，极不情愿地交了出去。父亲一把夺过来，远远扔进灌木丛。接下来十分钟，威廉对树丛进行了一场彻底又有系统的搜索。那天剩下的时间里，他吃下的醋栗眼珠糖和花园泥土，分量差不多。
        - id: ch02-b17
          speaker: narrator
          text: 他溜达到后花园，爬上围墙。
        - id: ch02-b18
          speaker: joan
          text: 你好，威廉！
        - id: ch02-b19
          speaker: narrator
          text: 隔壁小姑娘的模样和卷发，不知怎的，让威廉想起了电影里那位纯朴的乡下姑娘。威廉颇有艺术家气质，立刻把自己当成那个土生土长的纯朴小伙子。
        - id: ch02-b20
          speaker: william
          text: 你好，琼。我不在的时候，你想没想过我？
        - id: ch02-b21
          speaker: narrator
          text: 他把嗓音压得又粗又哑，想用这种声音表现深厚的爱情。
        - id: ch02-b22
          speaker: joan
          text: 我根本不知道你不在。你为什么这么怪声怪气地说话？
        - id: ch02-b23
          speaker: william
          text: 我没怪声怪气。我就这么说话，没办法。
        - id: ch02-b24
          speaker: joan
          text: 你就是感冒了。今早妈妈看见你在接雨水的桶里扑腾，她就说，接下来准会听说威廉·布朗感冒躺下了。
        - id: ch02-b25
          speaker: william
          text: 不是感冒。是我心里的感觉。
        - id: ch02-b26
          speaker: joan
          text: 你嘴里吃的是什么？
        - id: ch02-b27
          speaker: william
          text: 醋栗眼珠糖。你要吗？拿两颗吧。三颗也行。
        - id: ch02-b28
          speaker: narrator
          text: 他把口袋里的纸袋取出来，伸手递到围墙下面，豪爽得简直不顾一切。
        - id: ch02-b29
          speaker: joan
          text: 可这些糖……脏了。
        - id: ch02-b30
          speaker: william
          text: 拿着吧。就是点普通的泥，含一会儿就没了。真的很好吃。
        - id: ch02-b31
          speaker: narrator
          text: 威廉往下倒了一大把，好像下了一阵糖果雨。然后，他又回到了纯朴的乡村情人这个角色里。
        - id: ch02-b32
          speaker: william
          text: 我说，你刚才是不是说你想我了？我敢说，你想我，绝对没有我想你那么多。准没有。
        - id: ch02-b33
          speaker: narrator
          text: 他的声音越压越低，最后几乎听不见了。
        - id: ch02-b34
          speaker: joan
          text: 威廉，你的嗓子是不是疼得很厉害？所以才非这么说话不可？
        - id: ch02-b35
          speaker: narrator
          text: 她蓝蓝的眼睛里全是忧虑和同情。威廉一手按住喉咙，皱起眉头，然后故意装出若无其事的样子。
        - id: ch02-b36
          speaker: william
          text: 是有一点。
        - id: ch02-b37
          speaker: joan
          text: 啊，威廉！一直都疼吗？
          emotion: surprised
        - id: ch02-b38
          speaker: narrator
          text: 琼这么关心他，威廉觉得非常受用。她双手紧紧扣在一起，满脸都是对他的担心。
        - id: ch02-b39
          speaker: william
          text: 反正我没有老把这件事挂在嘴边，对不对？
        - id: ch02-b40
          speaker: narrator
          text: 他说得很有男子气概。琼听完，猛地站直身子，睁大蓝眼睛看着他。
        - id: ch02-b41
          speaker: joan
          text: 威廉，会不会是你的……肺？我有个姑妈的肺有毛病，她整天都在咳嗽。
          emotion: fearful
        - id: ch02-b42
          speaker: narrator
          text: 威廉赶紧咳了几声。
        - id: ch02-b43
          speaker: joan
          text: 她一咳就疼，病得可厉害了。威廉，我真希望你的肺没事。
          emotion: fearful
        - id: ch02-b44
          speaker: narrator
          text: 她仰着温柔又焦急的小脸看他。
        - id: ch02-b45
          speaker: william
          text: 我觉得我的肺是有毛病。不过我不会为这点事大惊小怪。
        - id: ch02-b46
          speaker: narrator
          text: 他又咳了几声。
        - id: ch02-b47
          speaker: joan
          text: 那医生是怎么说的？
        - id: ch02-b48
          speaker: narrator
          text: 威廉想了一会儿。
        - id: ch02-b49
          speaker: william
          text: 他说就是肺有问题，还说我得特别小心。
        - id: ch02-b50
          speaker: joan
          text: 威廉，我那盒新颜料，你想要吗？
        - id: ch02-b51
          speaker: william
          text: 我想暂时不用。谢谢。
        - id: ch02-b52
          speaker: joan
          text: 我还有三个球，有一个是全新的。你也不想要吗？
        - id: ch02-b53
          speaker: william
          text: 不了，谢谢。再收集一大堆东西对我也没什么用。得了肺病的人……谁知道呢。
        - id: ch02-b54
          speaker: joan
          text: 啊，威廉！
          emotion: sad
        - id: ch02-b55
          speaker: narrator
          text: 琼难过的样子实在让人心碎。
        - id: ch02-b56
          speaker: william
          text: 当然，只要我小心一点，就不会有事。别担心我。
        - id: ch02-b57
          speaker: mrs_clive
          text: 琼！
        - id: ch02-b58
          speaker: joan
          text: 是妈妈在叫我。再见，亲爱的威廉。要是爸爸带巧克力回来，我就拿来给你。我说真的，一定给你。谢谢你的醋栗眼珠糖。再见。
        - id: ch02-b59
          speaker: william
          text: 再见。别为我担心。
    - id: ch03
      title: 替姐姐传达爱意
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 威廉又往嘴里放了一颗醋栗眼珠糖，漫无目的地绕到房子前面。他的成年姐姐埃塞尔正在前门口，跟一个年轻男人握手。
        - id: ch03-b02
          speaker: ethel
          text: 我会尽量帮你的。
        - id: ch03-b03
          speaker: jack_morgan
          text: 我知道你会帮我。
        - id: ch03-b04
          speaker: narrator
          text: 两人的手握了很久，那一眼对视也持续了很久。年轻人走后，埃塞尔仍站在门口，眼神迷蒙地望着他的背影。威廉来了兴趣。
        - id: ch03-b05
          speaker: william
          text: 刚才那个人是杰克·摩根，对吧？
        - id: ch03-b06
          speaker: ethel
          text: 是啊。
        - id: ch03-b07
          speaker: narrator
          text: 埃塞尔心不在焉地应了一声，走进屋里。那个眼神，那次长长的握手，还有那几句话，却一直留在威廉心里。他们肯定非常喜欢对方，就像已经订婚了一样。可威廉知道，他们并没有订婚。
        - id: ch03-b08
          speaker: narrator
          text: 也许他们就像电影里那对男女，两个人都太骄傲，谁也不肯让对方知道自己有多喜欢他。埃塞尔需要一个像电影里那样的哥哥，替她告诉那个男人，她有多喜欢他。威廉脑中灵光一闪，站在原地深思起来。
        - id: ch03-b09
          speaker: narrator
          text: 这时，埃塞尔正在客厅里和母亲说话。
        - id: ch03-b10
          speaker: ethel
          text: 他打算下星期日向她求婚。我是她最要好的朋友，所以他才告诉我，还问我他有没有希望。我说应该有，只要找到机会，我会先给她透点口风，再替他说几句好话。真让人激动！
          emotion: happy
        - id: ch03-b11
          speaker: mother
          text: 是啊，亲爱的。对了，你看见威廉在哪儿了吗？但愿他没在闯祸。
        - id: ch03-b12
          speaker: ethel
          text: 一分钟前他还在前花园。不过现在不见了。
        - id: ch03-b13
          speaker: narrator
          text: 威廉已经到了摩根先生家。女佣把他领进摩根先生的起居室。
        - id: ch03-b14
          speaker: maid
          text: 布朗先生来了。
        - id: ch03-b15
          speaker: narrator
          text: 摩根先生站起来迎接客人。他依然彬彬有礼，可也难免有点迷惑，因为他跟威廉只是点头之交。
        - id: ch03-b16
          speaker: william
          text: 下午好。我是替埃塞尔来的。
        - id: ch03-b17
          speaker: jack_morgan
          text: 是吗？
        - id: ch03-b18
          speaker: william
          text: 是。她让我把这个送给你。
        - id: ch03-b19
          speaker: narrator
          text: 威廉在口袋里摸了半天，总算掏出一朵玫瑰花苞。它一直跟醋栗眼珠糖、一把铅笔刀、一只陀螺和一块油灰挤在一起，早就压得变了形。摩根先生望着花苞，神情像是还在梦游。
        - id: ch03-b20
          speaker: jack_morgan
          text: 是吗？呃……她可真是太客气了。
        - id: ch03-b21
          speaker: william
          text: 这是给你留个念想。算是件纪念品。
        - id: ch03-b22
          speaker: jack_morgan
          text: 是……她还有别的话吗？
        - id: ch03-b23
          speaker: william
          text: 有。她请你今晚过来见她。
        - id: ch03-b24
          speaker: jack_morgan
          text: 好，当然可以。可我才刚从她那儿回来。也许我走以后，她又想起有话要对我说。
        - id: ch03-b25
          speaker: william
          text: 可能吧。
        - id: ch03-b26
          speaker: jack_morgan
          text: 她说几点了吗？
        - id: ch03-b27
          speaker: william
          text: 没说。我看七点左右吧。
        - id: ch03-b28
          speaker: jack_morgan
          text: 噢，好。
        - id: ch03-b29
          speaker: narrator
          text: 摩根先生盯着那朵又蔓又脏的玫瑰花苞，眼神又迷惑，又怎么也移不开。
        - id: ch03-b30
          speaker: jack_morgan
          text: 你确定……这真是她送来的？
        - id: ch03-b31
          speaker: william
          text: 是啊。
        - id: ch03-b32
          speaker: jack_morgan
          text: 她真没有别的话了？
        - id: ch03-b33
          speaker: william
          text: 没有。
        - id: ch03-b34
          speaker: jack_morgan
          text: 那好吧。请你告诉她，我很乐意来。
        - id: ch03-b35
          speaker: william
          text: 好。
        - id: ch03-b36
          speaker: narrator
          text: 房里静了一会儿。
        - id: ch03-b37
          speaker: william
          text: 埃塞尔可喜欢你了。
        - id: ch03-b38
          speaker: narrator
          text: 摩根先生抬手擦了擦额头。
        - id: ch03-b39
          speaker: jack_morgan
          text: 是吗？她真是……呃，真是太好了。
        - id: ch03-b40
          speaker: william
          text: 她做梦的时候都一直叫你的名字。我睡在隔壁，整夜都能听见。她一遍又一遍地叫，“杰克·摩根，杰克·摩根，杰克·摩根。”就是这样，反复叫个不停。
        - id: ch03-b41
          speaker: narrator
          text: 威廉越说越起劲，声音又沙哑又深情。摩根先生一句话也说不出来，只是惊恐地盯着这位小客人。
        - id: ch03-b42
          speaker: jack_morgan
          text: 你……你肯定吗？她叫的会不会是别人？
          emotion: fearful
        - id: ch03-b43
          speaker: william
          text: 才不是。我听得清清楚楚，叫的就是你。“杰克·摩根，杰克·摩根，杰克·摩根。”她现在饭也几乎不吃，还总守在窗口，等着看你从外面走过。
        - id: ch03-b44
          speaker: narrator
          text: 摩根先生的额头上冒出了汗珠。
        - id: ch03-b45
          speaker: jack_morgan
          text: 这太……太可怕了。
          emotion: fearful
        - id: ch03-b46
          speaker: narrator
          text: 威廉很欣慰。这个年轻人总算明白，自己对埃塞尔有多残酷了。不过威廉从不喜欢半途而废。他继续镇定地坐着，想下一句该说什么。同时，他下意识地掏出一颗醋栗眼珠糖，放进嘴里。摩根先生也沉默地坐着，神情惨然，望着空处。
        - id: ch03-b47
          speaker: william
          text: 她有你的照片，装在一个圆圆的小盒子里，还用链子挂在脖子上。
        - id: ch03-b48
          speaker: jack_morgan
          text: 你……真的肯定？
          emotion: fearful
        - id: ch03-b49
          speaker: william
          text: 千真万确。好了，我该走了。她今晚特别想单独见你。再见。
        - id: ch03-b50
          speaker: narrator
          text: 摩根先生没有回答。威廉兴高采烈地走了，他却缩在椅子里，呆呆地望着前方，很久都没动。后来，他舔了舔干燥的嘴唇。
        - id: ch03-b51
          speaker: jack_morgan
          text: 我的上帝啊。
          emotion: fearful
    - id: ch04
      title: 七点钟的客人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 威廉回家时，脑子里还在转着电影里的画面。那个油漆工真有趣。所有人都弄得满身是漆，还一起滚下楼梯！想到这里，威廉忽然放声大笑。
        - id: ch04-b02
          speaker: narrator
          text: 可是，那工人在刷漆之前做了什么？威廉记得，他先用一种火把似的东西和一把刀，去掉门上的旧漆，然后才刷新漆。看来就是先用火把旧漆烤化，再用刀刮掉。
        - id: ch04-b03
          speaker: narrator
          text: 威廉从没在现实里见过这种做法，所以还不能确定。但他完全可以自己弄清楚。走进家门时，他掏出铅笔刀，若有所思地把刀刃打开，然后上了楼。
        - id: ch04-b04
          speaker: narrator
          text: 大约到了开晚饭的时候，布朗先生回到屋里。
        - id: ch04-b05
          speaker: ethel
          text: 爸爸，您的头还疼吗？
        - id: ch04-b06
          speaker: father
          text: 糟糕透了！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 布朗先生疲惫地倒进扶手椅。
        - id: ch04-b08
          speaker: mother
          text: 也许吃过饭就会好一点。晚饭这会儿应该已经做好了。
        - id: ch04-b09
          speaker: narrator
          text: 女佣走进了房间。
        - id: ch04-b10
          speaker: maid
          text: 太太，摩根先生来了。他想见埃塞尔小姐。我请他到书房等了。
        - id: ch04-b11
          speaker: father
          text: 他现在来？搞什么鬼！这小蠢货为什么偏偏七点钟上门？他以为我们几点吃饭？专挑别人吃饭时来，他到底是什么意思？他……
          emotion: angry
        - id: ch04-b12
          speaker: mother
          text: 埃塞尔，亲爱的，你快去问问他有什么事。尽量早点让他回去。
        - id: ch04-b13
          speaker: narrator
          text: 埃塞尔走进书房，小心地关严房门，想挡住父亲的议论声。可那声音还是穿过门厅，听得一清二楚。摩根先生起身时，埃塞尔发现他脸色苍白，神情憔悴。
        - id: ch04-b14
          speaker: jack_morgan
          text: 呃……晚上好，布朗小姐。
        - id: ch04-b15
          speaker: ethel
          text: 晚上好，摩根先生。
        - id: ch04-b16
          speaker: narrator
          text: 两人坐下后，谁也不开口，都在等对方解释这次来访。沉默渐渐变得越来越难受。摩根先生又痛苦又尴尬，挪了挪双脚，又咳了一声。埃塞尔看了看钟。
        - id: ch04-b17
          speaker: ethel
          text: 你来的时候，外面下雨了吗，摩根先生？
        - id: ch04-b18
          speaker: jack_morgan
          text: 下雨？呃……没有，完全没下。
        - id: ch04-b19
          speaker: narrator
          text: 两人又沉默下来。
        - id: ch04-b20
          speaker: ethel
          text: 今天下午，我还觉得天气像是要下雨。
        - id: ch04-b21
          speaker: jack_morgan
          text: 是，当然。呃……不，一滴雨也没下。
        - id: ch04-b22
          speaker: narrator
          text: 又是一阵沉默。
        - id: ch04-b23
          speaker: ethel
          text: 我们这一带只要一下雨，路就糟糕得很。
        - id: ch04-b24
          speaker: jack_morgan
          text: 是。呃……确实很糟。
        - id: ch04-b25
          speaker: narrator
          text: 摩根先生抬起一只手，好像想把衣领松一松。
        - id: ch04-b26
          speaker: ethel
          text: 简直没办法走。
        - id: ch04-b27
          speaker: jack_morgan
          text: 呃……没错。
        - id: ch04-b28
          speaker: narrator
          text: 书房又安静下来。客厅里，布朗先生却越来越坐不住。
        - id: ch04-b29
          speaker: father
          text: 难道我们要为那个年轻人等一整夜才吃晚饭？已经七点一刻了！我最受不了的，就是有人打乱我的吃饭时间。那个小笨蛋非要七点来串门，难道我的消化就活该被毁掉？
          emotion: angry
        - id: ch04-b30
          speaker: mother
          text: 那我们只能请他一起吃晚饭了。真的没有别的办法。
        - id: ch04-b31
          speaker: father
          text: 绝对不行。难道我因为头疼，一天没去办公室，就得招待方圆几英里内所有的年轻蠢驴？
          emotion: angry
        - id: ch04-b32
          speaker: narrator
          text: 电话铃响了。布朗先生绝望地把双手举过头顶。
        - id: ch04-b33
          speaker: father
          text: 啊——
          emotion: angry
        - id: ch04-b34
          speaker: mother
          text: 亲爱的，我去接吧。
        - id: ch04-b35
          speaker: narrator
          text: 布朗太太回来时，担忧地皱着眉。
        - id: ch04-b36
          speaker: mother
          text: 是克莱夫太太打来的。她说，琼吃了威廉给的几颗恶心糖果，现在吐得很厉害。她还说，听到威廉生病，她很难过，希望他快点好。我没有全听懂，可威廉好像告诉他们，自己的肺出了问题，必须去看医生。医生还说他的肺很虚弱，非得格外小心。
        - id: ch04-b37
          speaker: narrator
          text: 布朗先生立刻坐直了，望着妻子。
        - id: ch04-b38
          speaker: father
          text: 可是……这一切……到底是为什么？
          emotion: surprised
        - id: ch04-b39
          speaker: mother
          text: 我不知道，亲爱的。我一点都不知道。
        - id: ch04-b40
          speaker: father
          text: 他疯了。一定是疯了。只有这一种解释。
        - id: ch04-b41
          speaker: narrator
          text: 就在这时，前门开了又关，埃塞尔走进客厅。她满脸通红。
        - id: ch04-b42
          speaker: ethel
          text: 他走了。妈妈，这真是太可怕了！他没对我说太多，可听起来，威廉竟然跑到他家，说我想在今晚七点单独见他。我今天几乎没和威廉说过话，所以他根本不可能听错了什么。
          emotion: angry
        - id: ch04-b43
          speaker: ethel
          text: 他还带去一朵花，一朵难看得要命的玫瑰花苞，说是我送的。当时我都不知道该把眼睛放在哪儿，也不知道该说什么。真的太可怕了！
          emotion: angry
        - id: ch04-b44
          speaker: narrator
          text: 布朗太太无力地望着女儿。布朗先生站了起来，像一个已经被逼得忍无可忍的人。
        - id: ch04-b45
          speaker: father
          text: 威廉在哪儿？
          emotion: angry
        - id: ch04-b46
          speaker: ethel
          text: 我不知道。不过我刚才好像听见他上楼了。
        - id: ch04-b47
          speaker: narrator
          text: 威廉的确在楼上。过去二十分钟，他一直快快活活、安安静静地对付自己卧室的房门。他一手举着点燃的小蜡烛，一手拿着铅笔刀。这场实验毫无疑问地证明，旧漆的确就是这样清除的。布朗先生上楼时，威廉已经把门上一整块镶板的油漆刮得干干净净。
    - id: ch05
      title: 酒鬼的孩子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一小时后，威廉坐在后花园一只倒扣的箱子上，带着几分不屈的反抗，含着最后一颗醋栗眼珠糖。这也是所有糖里最脏的一颗。他悲伤地回顾这一天，觉得今天过得很不成功。
        - id: ch05-b02
          speaker: narrator
          text: 他对隔壁小姑娘那么慷慨，却被人误解成想要害死她。他努力推动亲姐姐的爱情，又遭到痛苦的误解。最后，他发现了一种完全科学的旧漆清除法，当然还有另外几件事，结果却受到一位暴躁、不讲理的父亲野蛮袭击。
        - id: ch05-b03
          speaker: narrator
          text: 威廉忽然开始怀疑，父亲会不会喝酒。隔着一层悲情的雾，他把自己看成了《酒鬼的孩子》。他试着想象父亲伏在自己病床前流泪，求他原谅。说真的，自己现在没躺在医院里，已经可算是奇迹。他垂下肩膀，浑身上下都是极度的沮丧。
        - id: ch05-b04
          speaker: narrator
          text: 屋里，父亲伸展着四肢，躺在扶手椅中，正向妻子大谈他们的儿子。他一只手按住疼痛的额头，另一只手不停地挥舞。
        - id: ch05-b05
          speaker: father
          text: 他疯了。彻彻底底，疯疯癫癫地疯了。你应该带他去看医生，好好检查一下脑子。你看看他今天做的那些事。开头，他无缘无故就把我撞进杜鹃花丛正中央。别忘了，我可没有招惹他，连话都没跟他说。
          emotion: angry
        - id: ch05-b06
          speaker: father
          text: 接着，他拿着我明明已经扔掉的恶心东西，去毒害隔壁那个可爱的小姑娘。然后，他又到处对人说自己得了肺痨。你看他像吗？再然后，他替埃塞尔给陌生的年轻男人捎去稀奇古怪的话和爱情信物，还把人弄得赶在我们刚要吃晚饭的时候上门。
          emotion: angry
        - id: ch05-b07
          speaker: father
          text: 到最后，他又在楼上烧门、割门。这一切到底有哪一件说得通？全是疯子才干得出来的事。你真得带他去检查一下脑子。
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: 布朗太太剪断了补衣服的毛线，把刚补好的袜子放到一边。
        - id: ch05-b09
          speaker: mother
          text: 听起来的确很傻，亲爱的。不过，要是我们知道全部经过，也许每件事都有它的缘故。男孩子真是些奇怪的东西。
        - id: ch05-b10
          speaker: narrator
          text: 她看了看钟，又走到窗前。
        - id: ch05-b11
          speaker: mother
          text: 威廉！亲爱的，该上床睡觉了。
        - id: ch05-b12
          speaker: narrator
          text: 威廉忧伤地站起来，慢慢走进屋里。
        - id: ch05-b13
          speaker: william
          text: 晚安，妈妈。
        - id: ch05-b14
          speaker: narrator
          text: 说完，他又用哀伤而责备的目光望向父亲。
        - id: ch05-b15
          speaker: william
          text: 晚安，爸爸。别再想您做过的事了，我原……
        - id: ch05-b16
          speaker: narrator
          text: 他猛地停住，随即匆匆撤退。这个决定既及时，又明智。
