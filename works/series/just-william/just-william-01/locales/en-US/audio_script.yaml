          text: William was upstairs. For twenty happy, peaceful minutes, he had been working on his bedroom door with a lighted candle in one hand and his pocketknife in the other. His experiment had proved it beyond doubt. This was how old paint came off. By the time his father arrived, William had stripped every bit of paint from one whole panel.

            An hour later, William sat on an overturned box in the backyard. With stubborn defiance, he sucked the last and dirtiest Gooseberry Eye and sadly reviewed his day. It had not gone well.

            His kindness to Joan had been mistaken for an attempt to poison her. His efforts to help his only sister's romance had been painfully misunderstood. And after discovering a perfectly scientific way to remove old paint, he had been brutally attacked by a violent and unreasonable parent.

            Suddenly William wondered whether his father drank. Through a haze of sorrow, he saw himself as the drunkard's child from the picture show. He imagined his father weeping over him in the hospital and begging forgiveness. It was surprising that William was not in the hospital already. His shoulders sagged, and his whole body drooped with misery.

