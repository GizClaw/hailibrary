  chapters:
    - id: ch01
      title: William Goes to the Pictures
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It began one morning when William's aunt happened to be in a generous mood. He posted a letter for her, carried her packages home from the grocery store, and earned a whole shilling for his trouble.
        - id: ch01-b02
          speaker: aunt_susan
          text: Buy yourself some candy, or go see a picture show.
        - id: ch01-b03
          speaker: narrator
          text: William walked slowly down the road, studying the coin. A shilling made two sixpences. After some serious figuring, he saw no reason to choose. He could have both.

            When William bought candy, he cared much more about quantity than quality. He knew every candy store within two miles where the owner slipped one extra piece onto the scale after weighing the order. Those were the only stores he used. He always watched the weighing with a grave face and an eager eye. Any stingy store went straight onto his private blacklist.

            At his favorite shop, he stood outside for five minutes trying to choose between Gooseberry Eyes and Marble Balls. Both cost two pennies for four ounces, and William never wasted money on anything more expensive. At last his frown cleared, and he marched inside.
        - id: ch01-b04
          speaker: william
          text: Sixpence worth of Gooseberry Eyes, please.
        - id: ch01-b05
          speaker: narrator
          text: He tried to sound as if buying sixpence worth were perfectly ordinary, though he rarely spent more than a penny at a time.
        - id: ch01-b06
          speaker: shopkeeper
          text: Well, hello! This is a big order for you.
          emotion: surprised
        - id: ch01-b07
          speaker: william
          text: I came into a little money this morning.
        - id: ch01-b08
          speaker: narrator
          text: He said it with the careless air of a millionaire. A purchase this large deserved close attention. He watched the bright green candies tumble onto the scale and waited in complete silence while the shopkeeper weighed them. The scale dropped. Then, just as William knew he would, the man added the all-important extra piece. Satisfied, William accepted the precious paper bag. He put two Gooseberry Eyes into his mouth before he even left the shop, then walked slowly toward the Picture Palace, sucking all the way.

            He had only been there once before, and the program was thrilling. First came a story about desperate crooks. Whenever they left a building, they crouched, peered carefully both ways, and crept off in the most noticeable manner possible. No one could have worked harder to look suspicious.

            The plot twisted wildly and became harder to follow with every chase. Police pursued the crooks through one danger after another. The crooks leaped onto a moving train. Then, for no reason that William could see, they jumped from the train to a moving car. From the car, they plunged into a moving river. William thrilled at every escape. He sat perfectly still, staring with wide, fascinated eyes. Only his jaws kept circling. Every so often, his hand traveled by itself to the bag on his knees, found another Gooseberry Eye, and carried it to his mouth without making him look away from the screen.

            Next came a simple country romance. A sweet country girl was pursued by the local squire. His enormous mustache marked him as the villain before he had done anything at all. After one adventure followed another, a good young countryman in picturesque farm clothes finally won her heart. Whenever emotion overcame him, he flung his whole body into gestures that must have required years of exercise. The wicked squire ended up wasting away in a prison cell. Even there, with everything lost, his eyebrows continued their busy performance.

            Another romance followed. This time, a noble young man and woman were consumed by love for each other. A whole series of misunderstandings kept them apart, and the misunderstandings could only have happened in a picture play. Their own pride made matters worse. The young woman was too proud and reserved to show what she felt. The young man was just as proud and reserved. So each of them hid a burning heart behind a cold, haughty face. The heroine's brother moved through the story like a kindly fairy. He treated his orphaned sister with great tenderness and protection. In the end, he explained to each lover how passionately the other one felt.

            William found it deeply moving.

            Then came a comedy. At the beginning, one workman was painting a door. By the end, a whole crowd had gotten covered in paint and tumbled downstairs in a heap. William laughed louder than anyone.

            The last picture told the sad story of a drunkard going steadily downhill. He started as a wild young man in evening clothes, drinking and playing cards. Years passed, and he finished as a wild old man in rags, still drinking and still playing cards. His small daughter wore a solemn, superior look. She spent all her time weeping over him and begging him to lead a better life. At last, in a moment of understandable irritation, he threw a beer bottle at her head.

            After that, he stood beside her hospital bed and soaked it with tears of repentance. He tore at his hair, threw both arms toward heaven, beat his chest, and crushed the poor child against him. After so much excitement, it was hardly surprising that she had a relapse. With her last breath, she told her father not to think about what he had done. She forgave him, then passed peacefully away.

            William drew a deep breath. Still sucking candy, he rose with the rest of the audience and went outside.
        - id: ch01-b09
          speaker: narrator
          text: The moment he reached the street, William glanced cautiously around and slunk toward home. Then he doubled back and raced down a side street to throw his imaginary pursuers off the trail. He pulled a pencil from his pocket, aimed it into empty air, and fired twice. Two pursuers fell dead. The rest came on faster.

            There was no time to lose. William tore around the next corner, leaving an elderly gentleman behind him clutching a sore toe and shouting curses. Near his own gate, William drew the pencil again. Looking backward and firing as he ran, he charged through the gateway.

            William's father had stayed home that day with a pounding headache and an upset stomach. He picked himself out of the middle of a rhododendron bush and grabbed William by the back of the neck.
        - id: ch01-b10
          speaker: mr_brown
          text: You little brute! Why did you come crashing into me like that?
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: William gently worked himself free.
        - id: ch01-b12
          speaker: william
          text: I wasn't crashing into you, Father. I was only coming through the gate like anyone else. I just wasn't looking the way you were coming, and I can't look every way at once because—
        - id: ch01-b13
          speaker: mr_brown
          text: Be quiet!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Like everyone else in the family, Mr. Brown dreaded the full force of William's explanations. Then he noticed something.
        - id: ch01-b15
          speaker: mr_brown
          text: What's all over your tongue? Stick it out.
        - id: ch01-b16
          speaker: narrator
          text: William obeyed. His tongue was a shade of green that could have put spring leaves to shame.
        - id: ch01-b17
          speaker: mr_brown
          text: How often have I told you not to spend the whole day eating poisonous trash between meals?
          emotion: angry
        - id: ch01-b18
          speaker: william
          text: It isn't poisonous trash. Aunt Susan gave me a few candies because I kindly went to the post office for her, and—
        - id: ch01-b19
          speaker: mr_brown
          text: Be quiet! Do you have any more of those awful things?
          emotion: angry
        - id: ch01-b20
          speaker: william
          text: They're not awful. They're good. Try one and see. Aunt Susan gave them to me because I kindly—
        - id: ch01-b21
          speaker: mr_brown
          text: Be quiet! Where are they?
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: Slowly and unwillingly, William produced the bag. His father snatched it and threw it deep into the bushes. William spent the next ten minutes searching every inch of the shrubbery. For the rest of the day, each Gooseberry Eye he ate came with about the same amount of garden dirt.

            He wandered into the backyard and climbed onto the wall.
        - id: ch01-b23
          speaker: joan
          text: Hi, William.
        - id: ch01-b24
          speaker: narrator
          text: The little girl next door looked up at him. Something about Joan's curls reminded William of the country girl in the picture show. William had an artistic nature. In an instant, he became the passionate young countryman.
        - id: ch01-b25
          speaker: william
          text: Hello, Joan. Have you missed me while I've been away?
        - id: ch01-b26
          speaker: narrator
          text: He spoke in a deep, rough whisper meant to express powerful love.
        - id: ch01-b27
          speaker: joan
          text: I didn't know you went anywhere. Why are you talking like that?
        - id: ch01-b28
          speaker: william
          text: I'm not talking strangely. I can't help sounding this way.
        - id: ch01-b29
          speaker: joan
          text: You have a cold. Mother said you would after she saw you splashing in your rain barrel this morning. She said the next thing we'd hear was that William Brown had gone to bed with a cold.
        - id: ch01-b30
          speaker: william
          text: It isn't a cold. It's just how I feel.
        - id: ch01-b31
          speaker: joan
          text: What are you eating?
        - id: ch01-b32
          speaker: william
          text: Gooseberry Eyes. Want one? Go ahead. Take two. Take three.
        - id: ch01-b33
          speaker: narrator
          text: In a burst of reckless generosity, he held the packet down to her.
        - id: ch01-b34
          speaker: joan
          text: But they're dirty.
        - id: ch01-b35
          speaker: william
          text: It's only ordinary dirt. It comes off when you suck them, and they're really good.
        - id: ch01-b36
          speaker: narrator
          text: He poured a generous shower of candies down to her. Then he dropped his voice again and returned to his role as the country lover.
        - id: ch01-b37
          speaker: william
          text: So, did you miss me? I bet you didn't think about me half as much as I thought about you.
        - id: ch01-b38
          speaker: narrator
          text: His voice sank lower and lower until it nearly disappeared.
        - id: ch01-b39
          speaker: joan
          text: William, does your throat hurt terribly? Is that why you have to talk that way?
        - id: ch01-b40
          speaker: narrator
          text: Her blue eyes were full of worry. William put one hand to his throat and frowned.
        - id: ch01-b41
          speaker: william
          text: A little.
        - id: ch01-b42
          speaker: joan
          text: Oh, William! Does it hurt all the time?
        - id: ch01-b43
          speaker: narrator
          text: Her concern was very flattering.
        - id: ch01-b44
          speaker: william
          text: Well, I don't go around complaining about it.
        - id: ch01-b45
          speaker: narrator
          text: Joan sprang up and stared at him.
        - id: ch01-b46
          speaker: joan
          text: Oh, William! Is it your lungs? I have an aunt with bad lungs, and she coughs and coughs. They hurt her and make her terribly sick. Oh, William, I hope you haven't got bad lungs.
          emotion: fearful
        - id: ch01-b47
          speaker: narrator
          text: William coughed quickly. Joan's small, anxious face tilted toward him.
        - id: ch01-b48
          speaker: william
          text: I suppose it is my lungs. I just don't make a fuss about them.
        - id: ch01-b49
          speaker: narrator
          text: He coughed once more.
        - id: ch01-b50
          speaker: joan
          text: What does the doctor say?
        - id: ch01-b51
          speaker: narrator
          text: William thought for a moment.
        - id: ch01-b52
          speaker: william
          text: He says it's my lungs, all right. He says I have to be very careful.
        - id: ch01-b53
          speaker: joan
          text: William, would you like my new paint box?
        - id: ch01-b54
          speaker: william
          text: I don't think so. Not now, thanks.
        - id: ch01-b55
          speaker: joan
          text: I have three balls, and one is almost new. Would you like that?
        - id: ch01-b56
          speaker: william
          text: No, thanks. There's no point collecting a lot of things. When it's your lungs, you never know what might happen.
        - id: ch01-b57
          speaker: joan
          text: Oh, William!
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: Her distress was pitiful, and William hurried to comfort her.
        - id: ch01-b59
          speaker: william
          text: Of course, if I'm careful, I'll be fine. Don't worry about me.
        - id: ch01-b60
          speaker: mrs_clive
          text: Joan!
        - id: ch01-b61
          speaker: joan
          text: That's Mother. Goodbye, William dear. If Father brings me chocolate, I'll bring some to you. I truly will. Thank you for the Gooseberry Eyes. Goodbye.
        - id: ch01-b62
          speaker: william
          text: Goodbye. And don't worry about me.
        - id: ch01-b63
          speaker: narrator
          text: He bravely put another Gooseberry Eye into his mouth and wandered around to the front of the house.
        - id: ch01-b64
          speaker: narrator
          text: His older sister, Ethel, stood at the front door shaking hands with a young man.
        - id: ch01-b65
          speaker: ethel
          text: I'll do everything I can to help you.
        - id: ch01-b66
          speaker: jack_morgan
          text: I know you will.
        - id: ch01-b67
          speaker: narrator
          text: Their hands stayed clasped for a long moment, and their looks lasted just as long. The young man walked away. Ethel remained in the doorway, gazing after him with a distant expression. William watched with great interest.
        - id: ch01-b68
          speaker: william
          text: That was Jack Morgan, wasn't it?
        - id: ch01-b69
          speaker: ethel
          text: Yes.
        - id: ch01-b70
          speaker: narrator
          text: Ethel answered without much attention and went inside. But the long look, the clasped hands, and those earnest words stayed in William's mind. Ethel and Jack must be very fond of each other, the way engaged people were. Yet William knew they were not engaged.

            Perhaps they were both too proud to admit their love, just like the couple in the picture show. What Ethel needed was a brother like the one in the movie, a brother who would tell the young man the truth. Suddenly, the answer came to William. He stood lost in thought.

            In the living room, Ethel was explaining the real situation to her mother.
        - id: ch01-b71
          speaker: ethel
          text: He's going to ask her to marry him next Sunday. He told me because I'm her best friend, and he wanted to know whether I thought he had a chance. I said I thought he did. I promised to prepare her a little and say something good about him if I could. Isn't it exciting?
          emotion: happy
        - id: ch01-b72
          speaker: mrs_brown
          text: Yes, dear. By the way, have you seen William? I hope he isn't getting into trouble.
        - id: ch01-b73
          speaker: ethel
          text: He was in the front yard a minute ago. He isn't there now.
        - id: ch01-b74
          speaker: narrator
          text: By then, William had reached Mr. Morgan's house. A maid showed him into the young man's sitting room.
        - id: ch01-b75
          speaker: morgans_maid
          text: Mr. Brown is here to see you.
        - id: ch01-b76
          speaker: narrator
          text: Jack Morgan rose politely, though he looked puzzled. He barely knew William.
        - id: ch01-b77
          speaker: william
          text: Good afternoon. Ethel sent me.
        - id: ch01-b78
          speaker: jack_morgan
          text: She did?
        - id: ch01-b79
          speaker: william
          text: Yes.
        - id: ch01-b80
          speaker: narrator
          text: William searched his pocket. At last he pulled out a rosebud. It had been crushed among the Gooseberry Eyes, a pocketknife, a top, and a lump of putty.
        - id: ch01-b81
          speaker: william
          text: She sent you this.
        - id: ch01-b82
          speaker: narrator
          text: Mr. Morgan stared at the rosebud like a man walking in his sleep.
        - id: ch01-b83
          speaker: jack_morgan
          text: Oh. That's very kind of her.
        - id: ch01-b84
          speaker: william
          text: It's a keepsake. A souvenir.
        - id: ch01-b85
          speaker: jack_morgan
          text: I see. Did she send any message?
        - id: ch01-b86
          speaker: william
          text: Oh, yes. She wants you to come see her this evening.
        - id: ch01-b87
          speaker: jack_morgan
          text: Of course. I only just left her, but perhaps she remembered something she wanted to tell me. Did she say what time?
        - id: ch01-b88
          speaker: william
          text: No. Around seven, I expect.
        - id: ch01-b89
          speaker: jack_morgan
          text: Oh. All right.
        - id: ch01-b90
          speaker: narrator
          text: Mr. Morgan could not take his eyes off the limp and rather dirty rosebud.
        - id: ch01-b91
          speaker: jack_morgan
          text: You're certain she sent this?
        - id: ch01-b92
          speaker: william
          text: Yes.
        - id: ch01-b93
          speaker: jack_morgan
          text: And there wasn't any other message?
        - id: ch01-b94
          speaker: william
          text: No.
        - id: ch01-b95
          speaker: jack_morgan
          text: Then please tell her I'll be glad to come.
        - id: ch01-b96
          speaker: narrator
          text: A silence followed. William decided that his work as the helpful brother had only begun.
        - id: ch01-b97
          speaker: william
          text: Ethel thinks an awful lot of you.
        - id: ch01-b98
          speaker: narrator
          text: Mr. Morgan rubbed his forehead.
        - id: ch01-b99
          speaker: jack_morgan
          text: Does she? That's very kind, I'm sure.
        - id: ch01-b100
          speaker: william
          text: She talks about you in her sleep all the time. My room is next to hers, so I hear it all night. She just keeps saying your name. Jack Morgan. Jack Morgan. Jack Morgan. Over and over.
        - id: ch01-b101
          speaker: narrator
          text: William's voice grew deep and full of feeling. Mr. Morgan stared at him in horror, unable to speak.
        - id: ch01-b102
          speaker: jack_morgan
          text: Are you certain? Couldn't it be someone else's name?
          emotion: fearful
        - id: ch01-b103
          speaker: william
          text: No, it's yours. Jack Morgan, Jack Morgan, Jack Morgan. Just like that. And she hardly eats anything now. She spends all her time by the windows, waiting for you to walk past.
        - id: ch01-b104
          speaker: narrator
          text: Beads of sweat appeared on Mr. Morgan's forehead.
        - id: ch01-b105
          speaker: jack_morgan
          text: This is horrible.
          emotion: fearful
        - id: ch01-b106
          speaker: narrator
          text: William was pleased. The young man had finally understood how cruelly he was treating Ethel. Still, William never left a job half done. He sat in silence, considering what to say next, and automatically slipped another Gooseberry Eye into his mouth. Mr. Morgan sat frozen in his chair, staring at nothing.
        - id: ch01-b107
          speaker: william
          text: She has your photograph in one of those little round cases. She wears it on a chain around her neck.
        - id: ch01-b108
          speaker: jack_morgan
          text: Are you absolutely sure?
          emotion: fearful
        - id: ch01-b109
          speaker: william
          text: Completely sure. Well, I should go. She especially wants to see you alone tonight. Goodbye.
        - id: ch01-b110
          speaker: narrator
          text: Mr. Morgan did not answer. Long after William walked jauntily away, he remained hunched in his chair, staring straight ahead. At last he wet his dry lips.
        - id: ch01-b111
          speaker: jack_morgan
          text: Good Lord.
        - id: ch01-b112
          speaker: narrator
          text: On his way home, William thought about the comedy. The painter had been especially funny, and the whole crowd covered in paint and falling downstairs was funnier still. William laughed aloud at the memory.

            Then he tried to remember what the workman had done before painting. He had used a small flame and a knife to remove the old paint. He seemed to melt it first and scrape it away afterward. William had never watched anyone do that in real life, but it looked like the proper method. He was not completely sure, of course. He would have to test it.

            As soon as he entered the house, he took out his pocketknife, opened it thoughtfully, and went upstairs.

            Mr. Brown came downstairs around dinnertime.
        - id: ch01-b113
          speaker: ethel
          text: How is your head, Father?
        - id: ch01-b114
          speaker: mr_brown
          text: Terrible!
        - id: ch01-b115
          speaker: narrator
          text: He sank wearily into an armchair.
        - id: ch01-b116
          speaker: mrs_brown
          text: Perhaps dinner will help. It should be ready now.
        - id: ch01-b117
          speaker: narrator
          text: The housemaid entered the room.
        - id: ch01-b118
          speaker: browns_housemaid
          text: Mr. Morgan is here, ma'am. He wants to see Miss Ethel, so I showed him into the library.
        - id: ch01-b119
          speaker: mr_brown
          text: Now? What the devil—what in the world is that young fool doing here at this hour? Seven o'clock! When does he imagine we eat dinner? What does he mean, calling on people at dinnertime?
          emotion: angry
        - id: ch01-b120
          speaker: mrs_brown
          text: Ethel, dear, please find out what he wants and send him on his way as soon as you can.
        - id: ch01-b121
          speaker: narrator
          text: Ethel went into the library and carefully closed the door. Even across the hall, her father's complaints were easy to hear. When Mr. Morgan stood to greet her, his face looked pale and worn.
        - id: ch01-b122
          speaker: jack_morgan
          text: Good evening, Miss Brown.
        - id: ch01-b123
          speaker: ethel
          text: Good evening, Mr. Morgan.
        - id: ch01-b124
          speaker: narrator
          text: They sat down. Each waited for the other to explain the visit. The silence grew unbearable. Mr. Morgan shifted his feet, coughed, and looked thoroughly miserable. Ethel glanced at the clock.
        - id: ch01-b125
          speaker: ethel
          text: Was it raining when you came over?
        - id: ch01-b126
          speaker: jack_morgan
          text: Raining? No. No, it wasn't.
        - id: ch01-b127
          speaker: narrator
          text: Silence settled over them again.
        - id: ch01-b128
          speaker: ethel
          text: It looked as though it might rain this afternoon.
        - id: ch01-b129
          speaker: jack_morgan
          text: Yes, of course. But no, it didn't.
        - id: ch01-b130
          speaker: narrator
          text: Once more, neither of them spoke.
        - id: ch01-b131
          speaker: ethel
          text: The roads around here get so bad when it rains.
        - id: ch01-b132
          speaker: narrator
          text: Mr. Morgan raised a hand as if his collar had suddenly become too tight.
        - id: ch01-b133
          speaker: jack_morgan
          text: Yes. Very bad.
        - id: ch01-b134
          speaker: ethel
          text: Almost impossible to use.
        - id: ch01-b135
          speaker: jack_morgan
          text: Quite.
        - id: ch01-b136
          speaker: narrator
          text: Another silence began. In the living room, Mr. Brown was losing what little patience he had left.
        - id: ch01-b137
          speaker: mr_brown
          text: Are we keeping dinner waiting for that boy all night? It's already a quarter past seven. You know I can't stand having my meals interrupted. Why should my digestion be ruined because this young idiot decides to make a social call at seven in the evening?
          emotion: angry
        - id: ch01-b138
          speaker: mrs_brown
          text: Then we'll have to invite him to dinner. We really will.
        - id: ch01-b139
          speaker: mr_brown
          text: We will not! Can't I stay home from the office for one day with a headache without entertaining every young jackass for miles?
          emotion: angry
        - id: ch01-b140
          speaker: narrator
          text: The telephone rang. Mr. Brown threw both hands above his head.
        - id: ch01-b141
          speaker: mr_brown
          text: Oh!
          emotion: angry
        - id: ch01-b142
          speaker: mrs_brown
          text: I'll answer it, dear.
        - id: ch01-b143
          speaker: narrator
          text: Mrs. Brown returned with a worried frown.
        - id: ch01-b144
          speaker: mrs_brown
          text: That was Mrs. Clive. Joan has been very sick after eating some horrible candy William gave her. Mrs. Clive also said she was sorry about William and hoped he'd recover soon. I couldn't understand it all, but apparently William told them he saw a doctor about his lungs. He said the doctor found them very weak and warned him to be careful.
