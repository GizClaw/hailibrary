audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    father:
      display_name: 布朗先生
      tts:
        delivery: 务实坚定，疲惫时仍保持威严
        timbre: 沉稳厚实的成年男声
        pace: 中速
        pitch: 中低音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 矜持敏锐，怀疑时冷淡，恼火时干脆
        timbre: 清亮的年轻女声
        pace: 中速偏快
        pitch: 中高音
    james_french:
      display_name: 詹姆斯·弗伦奇
      tts:
        delivery: 浪漫殷勤，紧张时吞吞吐吐
        timbre: 轻柔文雅的青年男声
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 一
      blocks:
        - id: ch01-b01
          speaker: james_french
          text: 她……她简直就是一幅波提切利。
        - id: ch01-b02
          speaker: narrator
          text: 年轻人像在说梦话，眼睛追着威廉的姐姐埃塞尔，看她越走越远。威廉却狠狠瞪住了他。
        - id: ch01-b03
          speaker: william
          text: 你自己才是瓶装樱桃！她长着红头发，又不是她的错。就像你长着……长着……
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 威廉把年轻人从头看到脚，认真找了半天，终于找到了能攻击的地方。
        - id: ch01-b05
          speaker: william
          text: 就像你长着一对大耳朵，也不是你的错。
        - id: ch01-b06
          speaker: narrator
          text: 年轻人根本没听见，当然也谈不上生气。他还望着远处那个苗条的身影。
        - id: ch01-b07
          speaker: james_french
          text: 蓝色的眼睛，红金的头发。对，得写“红金”，两种颜色都有。蓝色的眼睛，红金的头发……什么字跟“金”押韵？
        - id: ch01-b08
          speaker: william
          text: 冰！这个好。她正好伤风，昨晚打了一夜喷嚏。
          emotion: happy
        - id: ch01-b09
          speaker: james_french
          text: 不。我要写她的心冷得像冰。蓝色的眼睛，红金的头发，一颗冰心，冷硬得可怕……
        - id: ch01-b10
          speaker: william
          text: 真棒！就跟正经诗集里写的一模一样！
        - id: ch01-b11
          speaker: narrator
          text: 这个年轻人叫詹姆斯·弗伦奇。他在一次晚会上认识了埃塞尔，从此就被她迷住了。可他没胆量继续接近她，只好费心结交她的小弟弟，还以为这样能讨埃塞尔喜欢。
        - id: ch01-b12
          speaker: james_french
          text: 要是有人让你随便挑，这世上你最想要什么？
        - id: ch01-b13
          speaker: narrator
          text: 他坐在栅栏顶上，忽然探过身来问。
        - id: ch01-b14
          speaker: william
          text: 白老鼠。
        - id: ch01-b15
          speaker: narrator
          text: 弗伦奇想了很久。
        - id: ch01-b16
          speaker: james_french
          text: 我有个办法，马上就想好了。你陪我走回家吧。到了以后，我给你一样东西，也把这个办法告诉你。
        - id: ch01-b17
          speaker: narrator
          text: 威廉本来满脸不愿意。听了这话，两人才一起沿小路走。弗伦奇滔滔不绝，讲得格外恳切。威廉越听越惊，嘴巴张得老大，脸上全是不赞成和害怕。谈话里，“白老鼠”几个字出现了一遍又一遍。最后，他像是答应了，点了点头。
        - id: ch01-b18
          speaker: william
          text: 我看你真是为她发疯了，跟书里那些人一样。好吧，不过我要长尾巴的。
        - id: ch01-b19
          speaker: narrator
          text: 威廉并非不懂温柔的爱情。他看过电影和书，也见过哥哥罗伯特好几次经历爱情的全部痛苦。他自己动过心，还决定长大后娶隔壁的小姑娘。所以，他愿意用一切正当办法帮这位新朋友。只是眼前这个办法实在让他吃惊。不过，白老鼠到底是白老鼠。
        - id: ch01-b20
          speaker: narrator
          text: 第二天早晨，威廉脸上满是灿烂的美德。这种表情，他只在特别的时候才摆出来。
        - id: ch01-b21
          speaker: william
          text: 你今天早上要去买东西吧？
        - id: ch01-b22
          speaker: ethel
          text: 你明明知道我要去。
        - id: ch01-b23
          speaker: william
          text: 那我陪你吧，还能替你拿拿包裹。
        - id: ch01-b24
          speaker: narrator
          text: 威廉说得甜极了，埃塞尔立刻起了疑心。
        - id: ch01-b25
          speaker: ethel
          text: 你到底想要什么？我可不会给你买东西。
        - id: ch01-b26
          speaker: narrator
          text: 威廉露出受了伤害的样子。
        - id: ch01-b27
          speaker: william
          text: 我什么也不要。我就是想帮忙，替你拿包裹。我……我只是不想让你累着。
        - id: ch01-b28
          speaker: ethel
          text: 那好吧，你可以来，也可以拿包裹。不过别指望从我这里拿到一便士。
        - id: ch01-b29
          speaker: narrator
          text: 两人一起到了商店街。埃塞尔把一个又一个包裹堆到威廉身上，他全都温顺地接着。他们经过一家又一家玩具店，他连眼睛都不转一下。埃塞尔原先冷冰冰的怀疑，也慢慢变成了困惑。威廉心里正忙着训练一对白老鼠，让它们表演复杂的把戏。
        - id: ch01-b30
          speaker: ethel
          text: 威廉，你……你今天真好。你没事吧？我是说，你没有哪儿不舒服吧？
        - id: ch01-b31
          speaker: william
          text: 没有。至少现在没有。我眼下好好的。过一会儿也许会不舒服，不过我也说不准。
        - id: ch01-b32
          speaker: narrator
          text: 埃塞尔开始担心了。
        - id: ch01-b33
          speaker: ethel
          text: 那我们快回家。你吃了什么？
        - id: ch01-b34
          speaker: william
          text: 我什么也没吃！不是吃坏肚子的那种，完全不是一回事。
          emotion: angry
        - id: ch01-b35
          speaker: ethel
          text: 那是哪一种不舒服？
        - id: ch01-b36
          speaker: william
          text: 现在什么事也没有。我现在还好好的。
        - id: ch01-b37
          speaker: narrator
          text: 他们不再说话，离开大路，转上那条通往布朗家的长长乡间小道。威廉抱着满怀包裹，忽然放慢脚步，又一本正经地坐到地上。
        - id: ch01-b38
          speaker: william
          text: 我走不动了，埃塞尔。我突然犯病了。
        - id: ch01-b39
          speaker: narrator
          text: 他仰着一张健康得不能再健康的脸。埃塞尔不耐烦地低头看他。
        - id: ch01-b40
          speaker: ethel
          text: 别胡闹了，威廉。起来。
        - id: ch01-b41
          speaker: william
          text: 我没胡闹。我是真的犯病了。
        - id: ch01-b42
          speaker: ethel
          text: 你哪儿不舒服？
        - id: ch01-b43
          speaker: william
          text: 浑身都不舒服。
        - id: ch01-b44
          speaker: narrator
          text: 这个回答，他说得很谨慎。
        - id: ch01-b45
          speaker: ethel
          text: 脚踝疼不疼？
        - id: ch01-b46
          speaker: william
          text: 疼。膝盖也疼，从脚下一直往上都疼。我就是走不了，病得太重了。
        - id: ch01-b47
          speaker: narrator
          text: 埃塞尔焦急地朝四周看。
        - id: ch01-b48
          speaker: ethel
          text: 哎呀，这可怎么办？离家还有四分之一英里呢！
        - id: ch01-b49
          speaker: narrator
          text: 就在这时，一个高个年轻人出现了。他走到近前，摘帽行礼，脸涨得通红。
        - id: ch01-b50
          speaker: james_french
          text: 布朗小姐，是不是出了什么事？
        - id: ch01-b51
          speaker: ethel
          text: 你看看威廉！他非说自己走不动了。天知道我们该怎么办。
        - id: ch01-b52
          speaker: narrator
          text: 她夸张地指着那个舒舒服服坐在土里的小身影。弗伦奇弯腰看威廉，却不敢迎上他的目光。
        - id: ch01-b53
          speaker: james_french
          text: 怎么了，小家伙？不舒服吗？
        - id: ch01-b54
          speaker: william
          text: 哼！明明是你叫我这么干的，还来问我？
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: 弗伦奇又大声又长久地咳了起来。
        - id: ch01-b56
          speaker: james_french
          text: 好了，我们想想办法。你能爬到我背上吗？我背你回去。包裹也给我。对，就是这样。不，布朗小姐，我一定得拿。怎么能让你拿呢？好吧，既然你坚持，那几个归你，大的至少得留给我。威廉，准备好了吗？
        - id: ch01-b57
          speaker: narrator
          text: 威廉毫不反对，爬上去，从背后紧紧搂住弗伦奇。三个人就这样慢吞吞地出发了。埃塞尔感激极了。
        - id: ch01-b58
          speaker: ethel
          text: 弗伦奇先生，您真是太好了。没有您，我简直不知道怎么办。他不会重得吓人吧？也不知道这病传不传染。再给我几个包裹吧。真的不肯？妈妈一定会非常感激您。这事真怪，我一直觉得威廉身体特别结实。希望不是什么肺痨。肺痨刚开始是什么样的？
        - id: ch01-b59
          speaker: narrator
          text: 弗伦奇从不知道，一个结结实实的十一岁男孩通常有多重。他脚步踉跄，身子也摇摇晃晃。
        - id: ch01-b60
          speaker: james_french
          text: 不，不用客气，千万别。这是我的荣幸。包裹你不能再拿了，你手上已经够多了。威廉一点也不重，真的一点也不重。我正好经过，还能帮上忙，实在太高兴了！
        - id: ch01-b61
          speaker: narrator
          text: 他停下来擦擦额头，喘得非常厉害。到了这时候，他心里竟然猛烈地恨起了威廉，虽然这股恨意一点道理也没有。
        - id: ch01-b62
          speaker: james_french
          text: 威廉，你现在能不能走一点？就走一小段，我扶着你。
        - id: ch01-b63
          speaker: narrator
          text: 他还在喘，声音里已经透出了恼火。
        - id: ch01-b64
          speaker: william
          text: 好吧，我无所谓。那我使劲靠着你，行吗？
        - id: ch01-b65
          speaker: ethel
          text: 你已经好得能走了吗？
        - id: ch01-b66
          speaker: william
          text: 哦，好多了。他要我走，我就能走。只要他不介意我攀着他的胳膊。我觉得很快就会全好了，现在差不多已经好了。
        - id: ch01-b67
          speaker: narrator
          text: 三个人沿车道慢慢走向布朗家的房子。一路上，威廉把全身的重量都压在弗伦奇的胳膊上。布朗太太从窗口瞧见他们，赶紧跑到门口。
        - id: ch01-b68
          speaker: mother
          text: 天哪！你骑摩托车撞到他了。我早知道你迟早要撞人。昨天看见你骑过去，我就说过……
          emotion: surprised
        - id: ch01-b69
          speaker: ethel
          text: 妈妈，弗伦奇先生好得不得了！要不是他，我都不知道怎么办。威廉突然病得走不了路，是弗伦奇先生从小路那头一路背回来的。
          emotion: angry
        - id: ch01-b70
          speaker: mother
          text: 哦，真对不起。您实在太好了，弗伦奇先生。快进来吃午饭吧。威廉，你马上上楼睡觉，我这就给韦尔医生打电话。
        - id: ch01-b71
          speaker: william
          text: 不，别去麻烦可怜的韦尔医生。我真的已经好了。他来了，看见我一点事也没有，肯定会生气。
        - id: ch01-b72
          speaker: mother
          text: 你当然得让医生看看。
        - id: ch01-b73
          speaker: william
          text: 我当然不该看医生。你不明白，这种不舒服医生看不了。他来了也没用。我只是……只是突然发晕。
        - id: ch01-b74
          speaker: narrator
          text: 威廉总算想起了这个词。他最近听家里的清洁女工说过。布朗太太焦急地望向弗伦奇。
        - id: ch01-b75
          speaker: mother
          text: 弗伦奇先生，您觉得呢？
        - id: ch01-b76
          speaker: narrator
          text: 母女俩同时转向他，仿佛他能给出神谕。弗伦奇看看这个，又看看那个，心虚得满脸通红。
        - id: ch01-b77
          speaker: james_french
          text: 哦……呃……我看他气色挺好的，对吧？我觉得不用麻烦医生。只要……呃……别拿这件事一直问他，让他照常活动。我想，最好叫他忘了这回事。
        - id: ch01-b78
          speaker: narrator
          text: 他说到最后，声音越来越弱。
        - id: ch01-b79
          speaker: mother
          text: 他最近确实长得很快。
        - id: ch01-b80
          speaker: james_french
          text: 对，大概只是长身体的时候有点虚弱。
        - id: ch01-b81
          speaker: ethel
          text: 可弗伦奇先生真了不起，简直太了不起了！威廉，你根本不知道他有多好。你应该谢谢他。
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: 威廉冷冷看着自己的恩人。
        - id: ch01-b83
          speaker: william
          text: 非常感谢你背我回来。
        - id: ch01-b84
          speaker: narrator
          text: 母亲转身和埃塞尔谈午饭时，他又压低声音补了一句。
        - id: ch01-b85
          speaker: william
          text: 记住，是两只，还得有长尾巴！
        - id: ch01-b86
          speaker: narrator
          text: 弗伦奇留下吃午饭，下午还陪埃塞尔去打高尔夫。午饭后，威廉被毛毯裹得严严实实，躺在书房的沙发上。百叶窗也放下来了，好让他安静睡过这场神秘的病。
        - id: ch01-b87
          speaker: narrator
          text: 布朗太太轻手轻脚走进来，想看看儿子的病情，沙发上却已经没人了。
        - id: ch01-b88
          speaker: mother
          text: 哎呀，他跑了！我明明让他舒舒服服躺在这儿，还叫他尽量睡一觉。生病时，睡觉最要紧。可他现在跑了，恐怕不到晚上睡觉都不会回来！
        - id: ch01-b89
          speaker: father
          text: 很好。碰上这么点福气，也该知足了。
        - id: ch01-b90
          speaker: narrator
          text: 埃塞尔和她的护花使者回来喝下午茶。家里人把弗伦奇当成威廉的救命恩人，一再挽留，他又留下吃了晚饭。晚上，他伴着埃塞尔唱了几首歌。琴弹得不怎么样，赞叹倒是一阵接一阵。埃塞尔显然很受用，因为他一点也不掩饰自己的仰慕。他快到十一点才告辞，幸福得几乎醉了。布朗一家又对他谢了又谢。
        - id: ch01-b91
          speaker: narrator
          text: 他微笑着走下车道，心还飘在这一晚的幸福里。楼上一扇窗悄悄打开，一颗小脑袋探了出来。寂静中，突然射出一句话。
        - id: ch01-b92
          speaker: william
          text: 记住，是两只，还得有长尾巴。
    - id: ch02
      title: 二
      blocks:
        - id: ch02-b01
          speaker: father
          text: 这东西是从哪儿来的？
          emotion: angry
        - id: ch02-b02
          speaker: narrator
          text: 布朗先生凶狠地问。威廉赶紧把那只到处乱跑的宠物塞进口袋。
        - id: ch02-b03
          speaker: william
          text: 一个朋友送我的。
        - id: ch02-b04
          speaker: father
          text: 什么朋友？
        - id: ch02-b05
          speaker: william
          text: 弗伦奇先生。就是我突然犯病时，背我回来的那个人。他送给我的。我不知道它会钻进你的拖鞋。要是知道，我肯定不让它钻。我也不知道它会咬你的脚趾。它不是故意的，大概以为是我在喂它。我猜……
        - id: ch02-b06
          speaker: father
          text: 住嘴！弗伦奇先生为什么要送你这种该死的东西？
          emotion: angry
        - id: ch02-b07
          speaker: william
          text: 我不知道。大概他就是想送吧。
        - id: ch02-b08
          speaker: mother
          text: 他好像很喜欢威廉。
        - id: ch02-b09
          speaker: narrator
          text: 埃塞尔的脸微微红了。
        - id: ch02-b10
          speaker: father
          text: 他倒像是很恨我。这种讨厌的害虫，你一共有几只？
        - id: ch02-b11
          speaker: william
          text: 它们是老鼠，白老鼠。我只有两只。
        - id: ch02-b12
          speaker: father
          text: 我的天，还有两只！另一只在哪儿？
          emotion: surprised
        - id: ch02-b13
          speaker: william
          text: 在棚屋里。
        - id: ch02-b14
          speaker: father
          text: 那就把它关在棚屋里，听见没有？这一只也一样。我的脚趾都快叫它吃光了！它们应该戴上嘴套，没准还得了狂犬病。贾布尔呢？也在棚屋里吗？
        - id: ch02-b15
          speaker: narrator
          text: 问到这里，他的声音里满是希望。
        - id: ch02-b16
          speaker: william
          text: 没有。贾布尔不喜欢它们，不过我正在教它喜欢。我把老鼠放出来，再抓住贾布尔，让它看着它们。
        - id: ch02-b17
          speaker: father
          text: 对，就继续这么干吧。意外总会发生的。
        - id: ch02-b18
          speaker: narrator
          text: 当天晚上，威廉严格照着父亲的原话去做。他把两只老鼠关在盒子里，再把盒子放到卧室外面的窗台上。
        - id: ch02-b19
          speaker: narrator
          text: 到了凌晨，埃塞尔房里猛然响起刺耳的尖叫，全家都惊醒了。两只老鼠里，胆子较大的那只叫鲁弗斯。它逃出盒子，顺着攀缘植物爬进埃塞尔的房间。埃塞尔睁开眼时，它正坐在她的枕头上，轻轻扒拉她的头发。
        - id: ch02-b20
          speaker: narrator
          text: 一家人穿着各式各样的睡衣，全都涌进房间。埃塞尔已经歇斯底里了。大家让她喝热茶、吃饼干，好叫她镇定下来。
        - id: ch02-b21
          speaker: ethel
          text: 太可怕了！它在扯我的头发。它就坐在那里，粉红色的鼻子，还有一条长尾巴。实在太可怕了！
          emotion: fearful
        - id: ch02-b22
          speaker: father
          text: 那头讨厌的畜生在哪儿？
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: 布朗先生杀气腾腾地四下寻找。人群后面传来威廉细细的声音。
        - id: ch02-b24
          speaker: william
          text: 我抓住它了，爸爸。埃塞尔不明白，它只是在跟她玩。它不是故意吓她。它……
        - id: ch02-b25
          speaker: father
          text: 我明明叫你别把它们放进屋里！
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: 穿着宽大睡衣的布朗先生恶狠狠地俯视着穿小睡衣的威廉。威廉却怜爱地把罪魁祸首搂在胸前。埃塞尔躺在床上，边喝茶，边断断续续地虚弱喘气。
        - id: ch02-b27
          speaker: william
          text: 它们根本没在屋里。它们在窗外，就放在窗台上。窗外总不能也算屋里吧？是我把它放在外面的。我睡着以后，它自己跑进来，我能怎么办？
        - id: ch02-b28
          speaker: narrator
          text: 布朗先生严肃地盯住儿子。
        - id: ch02-b29
          speaker: father
          text: 威廉，下次再让我逮到这两只畜生里的任何一只进屋，我就拧断它的脖子。
          emotion: angry
        - id: ch02-b30
          speaker: narrator
          text: 第二天下午，弗伦奇来访，马上发现自己没有以前那么受欢迎了。埃塞尔虚弱地躺在沙发上。
        - id: ch02-b31
          speaker: ethel
          text: 我真不明白，你为什么要送威廉那么可怕的东西。我吓得够呛，现在头疼得厉害，神经也全垮了。
        - id: ch02-b32
          speaker: narrator
          text: 整个下午和晚上，弗伦奇都拼命想挽回失去的地位。他坐在沙发旁边低声说话，又念书给埃塞尔听。他体贴、后悔、谦卑，还满怀深情。可他自己清楚，不管怎么努力，原来的威望已经没了。他不再是那个“背威廉回家的人”，而成了那个“送威廉老鼠的人”。在布朗一家看来，埃塞尔被吓垮，全是他的错。就连送他出门的女仆，也用责备的眼神看他。
        - id: ch02-b33
          speaker: narrator
          text: 他走到车道上，遇见了威廉。威廉的一根手指裹着又脏又沾血的手帕，眼睛里也同样全是责备。
        - id: ch02-b34
          speaker: william
          text: 它咬我了。你送我的一只老鼠咬我了。
          emotion: angry
        - id: ch02-b35
          speaker: james_french
          text: 真对不起。可是……老鼠不是你自己要的吗？
        - id: ch02-b36
          speaker: narrator
          text: 弗伦奇先是很愧疚，说到后面，却突然硬气起来。
        - id: ch02-b37
          speaker: william
          text: 是我要的，可我没要凶老鼠。我从没说要会吓埃塞尔、还会咬我的那种，对吧？我只是教它用后腿跳舞，替它举着两只前爪，结果它反过来咬我。
        - id: ch02-b38
          speaker: narrator
          text: 弗伦奇忧心忡忡地望着他。
        - id: ch02-b39
          speaker: james_french
          text: 你最好别……呃……别把手指的事告诉你妈妈和姐姐。我不想让你姐姐再受刺激。
        - id: ch02-b40
          speaker: william
          text: 你不想让我告诉她们？
        - id: ch02-b41
          speaker: james_french
          text: 呃……对。
        - id: ch02-b42
          speaker: william
          text: 那么，你给我什么，我才不说？
        - id: ch02-b43
          speaker: narrator
          text: 威廉问得毫不害臊。弗伦奇把手伸进口袋。
        - id: ch02-b44
          speaker: james_french
          text: 我给你半克朗。
        - id: ch02-b45
          speaker: narrator
          text: 威廉把硬币装进口袋。
        - id: ch02-b46
          speaker: william
          text: 好！只要把血洗掉，再把手弄脏，就谁也看不出来了。
        - id: ch02-b47
          speaker: narrator
          text: 接下来几天，一切都很顺利。第二天一早，弗伦奇带着许多鲜花和葡萄来到布朗家，全家对他的态度缓和了。埃塞尔约他打一整天高尔夫。威廉也用那半克朗过了幸福的一天。
        - id: ch02-b48
          speaker: narrator
          text: 游乐场里正在热热闹闹地办集市，威廉便带着贾布尔去了。他一口气坐了十一次旋转木马。本来打算坐十二次，可身体里出现了好几种不舒服的感觉，只好放弃最后一次。
        - id: ch02-b49
          speaker: narrator
          text: 接着，他神气十足地走进七座帐篷，一声不响，看得如痴如醉。里面有大力士、胖女人、橡皮关节男孩、连体双胞胎、人鳗、人头象，还有会说话的猴子。每进一座帐篷，他都站着痴看，直到卖艺人为了给其他急着开眼的观众腾地方，把他赶出去。
        - id: ch02-b50
          speaker: narrator
          text: 等旋转木马带来的不适全消失了，他买了一大袋爆米花，靠着帐篷柱子全部吃完。然后又买两条牛轧糖，就着两瓶姜汁汽水吞下去。最后四便士，全换成了一大包叫“加拿大之乐”的红色黏糖。
        - id: ch02-b51
          speaker: narrator
          text: 暮色落下来时，威廉才慢慢地，极慢地回家。到了晚饭桌上，他坚决不肯吃任何东西。布朗太太担心起来。
        - id: ch02-b52
          speaker: mother
          text: 威廉，你的脸色很不好。不会又跟前几天一样吧？
        - id: ch02-b53
          speaker: narrator
          text: 威廉隔着餐桌迎上弗伦奇的目光。弗伦奇的脸红了。
        - id: ch02-b54
          speaker: william
          text: 不，跟那一次完全不一样。
        - id: ch02-b55
          speaker: narrator
          text: 大家一再追问，他只好承认自己去了集市。
        - id: ch02-b56
          speaker: william
          text: 有人给了我半克朗。我总得找个地方去啊。
          emotion: sad
        - id: ch02-b57
          speaker: mother
          text: 居然有人给威廉这么大的孩子一大笔钱，真是荒唐透顶！结果每次都这样。大人也该懂点事才对。
          emotion: angry
        - id: ch02-b58
          speaker: narrator
          text: 大家离开餐桌时，威廉用嘶哑的声音对弗伦奇耳语。
        - id: ch02-b59
          speaker: william
          text: 那半克朗是你给我的。
        - id: ch02-b60
          speaker: james_french
          text: 别告诉他们。
        - id: ch02-b61
          speaker: narrator
          text: 弗伦奇绝望地压低了声音。
        - id: ch02-b62
          speaker: william
          text: 那你再给我什么，我才不说？
        - id: ch02-b63
          speaker: narrator
          text: 弗伦奇偷偷往他手里塞了一枚两先令硬币。威廉眼前顿时展开一片灿烂的前景。他终于认定，弗伦奇非得成为这个家里的一员。到了那时，生活就会变成没完没了的半克朗和两先令硬币。
        - id: ch02-b64
          speaker: narrator
          text: 第二天是星期日。吃过早饭，威廉就进了棚屋，继续训练会跳舞的鲁弗斯。另一只白鼠新近有了名字，叫克伦威尔，它要学的是跟贾布尔交朋友。
        - id: ch02-b65
          speaker: narrator
          text: 这项训练一直只有一个步骤。克伦威尔一动不动地蹲在笼子里，威廉则挡在笼子前面，拼命拦住怒不可遏、恨不得杀掉它的贾布尔。威廉觉得，只要让它们看得够久，友谊早晚会长出来。于是每天，它们都彼此瞪着，直到威廉的胳膊发酸。可友谊到现在也没长出来。
        - id: ch02-b66
          speaker: mother
          text: 威廉！该去教堂了。
        - id: ch02-b67
          speaker: narrator
          text: 威廉呻吟了一声。星期日最叫人讨厌的就是这件事。他敢肯定，再练半个钟头，鲁弗斯就会跳舞，克伦威尔也会跟贾布尔成为朋友。可他不是那种会向环境低头的孩子。
        - id: ch02-b68
          speaker: narrator
          text: 他把鲁弗斯装进口袋，再把克伦威尔的笼子放到一摞箱子顶上。贾布尔留在地板上，可以继续那场关于友谊的凝视。
        - id: ch02-b69
          speaker: narrator
          text: 威廉安安静静、规规矩矩地跟在家人后面去教堂。一只手握着祈祷书，另一只手伸进口袋，紧紧攥着鲁弗斯。他盼着连祷时还能继续训练，后来果然如愿了。
        - id: ch02-b70
          speaker: narrator
          text: 埃塞尔坐在他一边，另一边正好没人。他虔诚地跪下，一只手挡着脸，另一只手抓住鲁弗斯的两只前爪，领着它在地板上一圈又一圈地走。进展越大，他看得越入迷。
        - id: ch02-b71
          speaker: mother
          text: 叫威廉跪直了，别乱动。
        - id: ch02-b72
          speaker: narrator
          text: 这句话隔着埃塞尔传了过来。威廉恶狠狠地瞥了母亲一眼，转过背，又继续上跳舞课。
        - id: ch02-b73
          speaker: narrator
          text: 这次连祷比他记忆里的任何一次都过得快。大家站起来唱赞美诗时，他把老鼠放回口袋。灾难就在唱诗时发生了。
        - id: ch02-b74
          speaker: narrator
          text: 布朗一家坐在教堂第一排。唱到第二节时，所有会众忽然看见，一个长尾巴的白色小东西爬上了布朗先生的肩头。埃塞尔的尖叫几乎压过风琴声。布朗先生抬起手，那位不速之客便跳到他头顶，在那里站了一秒，两只爪子深深抠进了受害者的头皮。
        - id: ch02-b75
          speaker: narrator
          text: 布朗先生把一张紫涨的脸转向儿子，那张脸已经预告了日后会有怎样的报复。唱诗班着了魔一样盯着老鼠，歌声渐渐停了。威廉满脸恐惧。
        - id: ch02-b76
          speaker: narrator
          text: 接着，鲁弗斯沿着布道坛边缘跑过去。会众里大多数女人已经顾不得礼节，纷纷退场。鲁弗斯靠近牧师，又顺着读经台往上爬，牧师的脸一下子白了。
        - id: ch02-b77
          speaker: narrator
          text: 一个唱诗班男孩眼疾手快，一把抓住鲁弗斯，退进祭衣室。他随后直接把老鼠带回了家，谁也没来得及质疑老鼠到底归谁。威廉终于找回了声音。
        - id: ch02-b78
          speaker: william
          text: 他拿走了。那是我的！他把我的老鼠拿走了！
        - id: ch02-b79
          speaker: ethel
          text: 嘘！
        - id: ch02-b80
          speaker: william
          text: 本来就是我的。那天我犯病以后，弗伦奇先生送给我的，你知道。
        - id: ch02-b81
          speaker: ethel
          text: 什么？
        - id: ch02-b82
          speaker: narrator
          text: 埃塞尔朝他探过身来。这时，赞美诗又唱得响亮起来。
        - id: ch02-b83
          speaker: william
          text: 那天我根本没病，是他叫我装的。这样他就能来背我回家，因为他迷上了你。老鼠也是他给我的。可那个男孩把它拿走了，它刚刚就快学会跳舞了，而且……
        - id: ch02-b84
          speaker: father
          text: 嘘！
          emotion: angry
        - id: ch02-b85
          speaker: narrator
          text: 布朗先生恶狠狠地低声制止他。
        - id: ch02-b86
          speaker: mother
          text: 我以后再也没脸见人了。我看人人今天都在教堂里！埃塞尔还叫得那么响。太可怕了，我准会连着做几夜的梦。威廉，我真不懂你怎么干得出这种事！
        - id: ch02-b87
          speaker: narrator
          text: 回家的路上，布朗太太一直哀叹。
        - id: ch02-b88
          speaker: william
          text: 可那是我的。那个男孩根本不该拿走。它已经开始认得我了。我又不是故意让它逃出来，爬到爸爸头上吓人的。我本来想让它好好待在口袋里。不管怎么说，那是我的，那个男孩把它拿走了。
        - id: ch02-b89
          speaker: father
          text: 从现在开始，它不是你的了，我的儿子。
        - id: ch02-b90
          speaker: narrator
          text: 埃塞尔紧紧抿着嘴，一言不发地往前走。远处有个高挑、活泼的身影迎面而来，原来是弗伦奇。他还不知道教堂里出了什么事，正兴高采烈地来接他们回家。
        - id: ch02-b91
          speaker: narrator
          text: 他一路微笑，认定大家一定会欢迎他，脑子里还在编排轻盈的恭维话。等埃塞尔走近，他潇洒地举起帽子，满脸笑容地问候她。埃塞尔却昂着头从他身边走过，看也没看他一眼。
        - id: ch02-b92
          speaker: narrator
          text: 弗伦奇惊恐又绝望地站在原地，只能望着埃塞尔沿路走远。他甚至没看见布朗夫妇。威廉却看懂了眼前的局面。未来那些半克朗和两先令硬币，仿佛一枚接一枚地消失了。他立刻激烈地抗议。
        - id: ch02-b93
          speaker: william
          text: 埃塞尔，别生弗伦奇先生的气。他没有坏心！他就是迷上了你，想替你做点事。
        - id: ch02-b94
          speaker: ethel
          text: 太可怕了！先是你把那头吓人的畜生带进教堂，接着我又发现他骗了我，你还帮着他。我真希望爸爸把另一只也弄走。
          emotion: angry
        - id: ch02-b95
          speaker: william
          text: 他不会的，他什么也没说。另一只还在棚屋里，正在学着跟贾布尔交朋友呢。埃塞尔，你别生弗伦奇先生的气。他……
        - id: ch02-b96
          speaker: ethel
          text: 哦，别再跟我提他了！
          emotion: angry
        - id: ch02-b97
          speaker: narrator
          text: 威廉很有几分哲学家的气质。他接受了失败，也接受了原本可能跟着弗伦奇一起进门的财富，如今全都没了。
        - id: ch02-b98
          speaker: william
          text: 好吧！不管怎样，我至少还剩一只。
        - id: ch02-b99
          speaker: narrator
          text: 他们转进车道，朝前门走去。灌木丛里突然传来一阵奔跑声，还有树枝折断的声音。贾布尔冲出来迎接主人，比平时更加欢喜，神情里还带着骄傲和胜利。它把得意的礼物放到了主人脚边。那是克伦威尔残缺不全的尸体。
        - id: ch02-b100
          speaker: narrator
          text: 威廉猛吸了一口气。
        - id: ch02-b101
          speaker: ethel
          text: 哦，威廉！我真难过。
          emotion: sad
        - id: ch02-b102
          speaker: narrator
          text: 威廉摆出骄傲又克制的悲伤神情。
        - id: ch02-b103
          speaker: william
          text: 没关系！其实不是你的错，也不是贾布尔的错。也许它以为，我就是在教它这么做。谁都没有错。我们只好把克伦威尔埋了。
        - id: ch02-b104
          speaker: narrator
          text: 他的精神又振作起来。
        - id: ch02-b105
          speaker: william
          text: 我要照着《公祷书》，给它举行一场真正的葬礼。
        - id: ch02-b106
          speaker: narrator
          text: 他站着不动，低头看着贾布尔那位朋友剩下的部分。贾布尔骄傲又快活地守在旁边，歪头仰望主人，尾巴不停地摇。威廉悲伤地回想自己一个接一个破灭的希望。弗伦奇和他所代表的一切都没了。鲁弗斯没了，克伦威尔也没了。
        - id: ch02-b107
          speaker: narrator
          text: 他把手伸进口袋，碰到了那枚两先令硬币。
        - id: ch02-b108
          speaker: william
          text: 嗯……不管怎样，我至少还剩下这个。
