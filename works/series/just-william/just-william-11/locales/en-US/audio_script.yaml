audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: dryly amused and observant
        timbre: warm and clear
        pace: measured
        pitch: medium
    william:
      display_name: William
      tts:
        delivery: blunt, defiant, and boyishly earnest
        timbre: bright and slightly rough
        pace: quick
        pitch: medium-high
    ethel:
      display_name: Ethel
      tts:
        delivery: poised, skeptical, and easily exasperated
        timbre: clear and youthful
        pace: brisk
        pitch: medium-high
    james_french:
      display_name: James French
      tts:
        delivery: romantic, eager, and nervously earnest
        timbre: light and refined
        pace: measured
        pitch: medium
    mrs_brown:
      display_name: Mrs. Brown
      tts:
        delivery: gentle, practical, and patient
        timbre: mature and soft
        pace: unhurried
        pitch: medium
    mr_brown:
      display_name: Mr. Brown
      tts:
        delivery: firm, weary, and matter-of-fact
        timbre: mature and resonant
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: A Bargain at the Gate
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: James French sat on top of a gate, watching William's sister Ethel disappear down the road. He had the dreamy look of a young man who could see no one else in the world.
        - id: ch01-b02
          speaker: james_french
          text: "She's... she's a real Botticelli."
        - id: ch01-b03
          speaker: narrator
          text: William glared at him. He had no idea what Botticelli meant, but it sounded insulting.
        - id: ch01-b04
          speaker: william
          text: "Bottled cherry yourself! She can't help having red hair. You can't help having... having big ears, can you?"
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: James did not hear the insult. His eyes stayed on Ethel's distant figure while he worked on a poem.
        - id: ch01-b06
          speaker: james_french
          text: "Eyes of blue and hair red-gold. I had to say red-gold because it has both colors. What rhymes with gold?"
        - id: ch01-b07
          speaker: william
          text: "Cold. That's a good one, because she has a cold. She sneezed all last night."
        - id: ch01-b08
          speaker: james_french
          text: "No, it ought to be about her heart. Eyes of blue and hair red-gold, heart of ice, so stony cold..."
        - id: ch01-b09
          speaker: william
          text: "That's great! It sounds just like a real poetry book."
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: James had met Ethel at an evening party and fallen completely under her spell. He lacked the courage to seek her out directly, so he had made friends with her little brother. He wrongly believed that this would make Ethel like him.
        - id: ch01-b11
          speaker: james_french
          text: "William, if you could have anything in the world, what would you choose?"
        - id: ch01-b12
          speaker: william
          text: "White rats."
        - id: ch01-b13
          speaker: narrator
          text: James thought hard. At last, an idea came to him.
        - id: ch01-b14
          speaker: james_french
          text: "I think I've found a way. Walk home with me and I'll give you something when we get there. I need to explain my plan."
        - id: ch01-b15
          speaker: narrator
          text: William looked unwilling, so James pleaded with him and promised that something would be waiting at the house. They went down the lane together while James explained his plan in a rush of serious words. As William listened, his mouth opened wider and wider with shocked disapproval. The idea clearly seemed dreadful to him. Still, James brought up the white rats often enough to keep his attention. By the end, William gave a slow, reluctant nod.
        - id: ch01-b16
          speaker: william
          text: "I suppose you're crazy about her, like people in books. Just remember, I want rats with long tails."
        - id: ch01-b17
          speaker: narrator
          text: William was not entirely ignorant about love. He had seen it in movies and read about it in books. He had also watched his older brother Robert pass through every stage of that consuming fever several times. In moments of deep feeling, William himself had decided that when he grew up, he would marry the little girl next door. So he was quite willing to help his new friend win Ethel by any proper method. The method James had suggested left him uneasy and rather shocked. But white rats were white rats, and two white rats with long tails could excuse a great deal.
    - id: ch02
      title: William Falls Ill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, William put on the shining, virtuous expression he saved for special occasions.
        - id: ch02-b02
          speaker: william
          text: "Are you going shopping this morning?"
        - id: ch02-b03
          speaker: ethel
          text: "You know I am."
        - id: ch02-b04
          speaker: william
          text: "Want me to come and carry your packages?"
        - id: ch02-b05
          speaker: narrator
          text: Ethel became suspicious at once.
        - id: ch02-b06
          speaker: ethel
          text: "What are you after? I'm not buying you anything."
        - id: ch02-b07
          speaker: william
          text: "I don't want anything. I only want to help. I don't want you getting tired."
        - id: ch02-b08
          speaker: ethel
          text: "Fine. You may carry my packages, but you won't get one cent from me."
        - id: ch02-b09
          speaker: narrator
          text: They walked to the shops together, and William meekly let Ethel load him with one package after another. At first, she watched him with grim suspicion. Then suspicion turned to bewilderment. They passed toy store after toy store, yet William did not stop, beg, or even turn his head. He hardly saw the windows at all. In his imagination, he already owned a pair of white rats and was teaching them a whole collection of difficult tricks.
        - id: ch02-b10
          speaker: ethel
          text: "This is awfully nice of you, William. Are you feeling all right? You're not sick, are you?"
        - id: ch02-b11
          speaker: william
          text: "No. I mean, not right now. I feel fine right now. I might not feel fine soon, though. I don't know."
        - id: ch02-b12
          speaker: narrator
          text: Ethel looked worried.
        - id: ch02-b13
          speaker: ethel
          text: "Then let's hurry home. What have you eaten?"
        - id: ch02-b14
          speaker: william
          text: "Nothing! It isn't that kind of sickness. It's different."
        - id: ch02-b15
          speaker: ethel
          text: "What kind is it?"
        - id: ch02-b16
          speaker: william
          text: "It's nothing yet. I'm fine right now."
        - id: ch02-b17
          speaker: narrator
          text: They walked in silence until the shops and the main road were behind them. At last, they turned onto the long, quiet country road that led to the Brown house. This was the place William had been waiting for. Still clasping the whole burden of packages, he slowed down. Then, very carefully and deliberately, he lowered himself into the dirt and sat there.
        - id: ch02-b18
          speaker: william
          text: "I can't walk any farther, Ethel. I got sick all of a sudden."
        - id: ch02-b19
          speaker: ethel
          text: "Don't be ridiculous. Get up."
        - id: ch02-b20
          speaker: william
          text: "I'm not being ridiculous. I'm sick."
        - id: ch02-b21
          speaker: ethel
          text: "Where do you feel sick?"
        - id: ch02-b22
          speaker: william
          text: "All over."
        - id: ch02-b23
          speaker: ethel
          text: "Does your ankle hurt?"
        - id: ch02-b24
          speaker: william
          text: "Yes, and my knees, and all the way up. I'm too sick to walk."
        - id: ch02-b25
          speaker: ethel
          text: "What are we going to do? We're a quarter mile from home!"
        - id: ch02-b26
          speaker: narrator
          text: Just then, a tall young man appeared. He came closer, lifted his hat, and blushed deeply.
        - id: ch02-b27
          speaker: james_french
          text: "Is something wrong, Miss Brown?"
        - id: ch02-b28
          speaker: ethel
          text: "Look at William! He says he can't walk, and I have no idea what to do."
        - id: ch02-b29
          speaker: narrator
          text: James bent over William without meeting his eye.
        - id: ch02-b30
          speaker: james_french
          text: "Feeling sick, little man?"
        - id: ch02-b31
          speaker: william
          text: "Huh! That's a fine thing for you to ask when you told me to—"
        - id: ch02-b32
          speaker: narrator
          text: James broke in with a long, loud cough.
        - id: ch02-b33
          speaker: james_french
          text: "All right, let's see what we can do. Climb onto my back and I'll carry you home. Hand me the packages. No, Miss Brown, I insist. I couldn't possibly let you carry them. Well, if you're sure, you take a few. Leave me the big ones. Ready, William?"
        - id: ch02-b34
          speaker: narrator
          text: William climbed on gladly, and they started down the road at a slow pace. Ethel was overwhelmed with gratitude.
        - id: ch02-b35
          speaker: ethel
          text: "This is so kind of you, Mr. French. I don't know what we'd have done. I hope he isn't terribly heavy. What if it's contagious? Please let me take more packages. Mother will be so grateful. It's very strange. William has always been strong. I hope it isn't consumption. How does consumption start?"
        - id: ch02-b36
          speaker: narrator
          text: James had never guessed how much a sturdy eleven-year-old boy could weigh. He staggered forward.
        - id: ch02-b37
          speaker: james_french
          text: "Oh, no. Don't mention it. It's a pleasure, truly. You already have enough packages. William isn't heavy at all. I'm so glad I happened to pass when I could help you. So glad!"
        - id: ch02-b38
          speaker: narrator
          text: James stopped and wiped his wet forehead. His breath came in heavy gasps. He had planned a graceful rescue that would make him look heroic to Ethel. He had not understood what an average sturdy boy of eleven weighed. As William clung comfortably to his back, an intense and quite unreasonable hatred of the boy filled James's heart.
        - id: ch02-b39
          speaker: james_french
          text: "Don't you think you could walk a little now, William? I'll help you."
        - id: ch02-b40
          speaker: william
          text: "All right. I can lean on you really hard, can't I?"
        - id: ch02-b41
          speaker: ethel
          text: "Do you feel well enough?"
        - id: ch02-b42
          speaker: william
          text: "Oh, yes. I can walk if he wants me to. I mean, if he doesn't mind me holding his arm. I think I'll be completely well soon. I'm almost well now."
        - id: ch02-b43
          speaker: narrator
          text: The three of them moved slowly up the drive, with William leaning his full weight on James's arm. Mrs. Brown saw them from the window and hurried to the door.
        - id: ch02-b44
          speaker: mrs_brown
          text: "Oh, dear! You ran over him on your motorcycle. I knew you would run over somebody. I said so when I saw you yesterday—"
        - id: ch02-b45
          speaker: ethel
          text: "Mother, Mr. French has been wonderful! William got sick and couldn't walk. Mr. French carried him all the way from the other end of the road."
        - id: ch02-b46
          speaker: mrs_brown
          text: "Oh, I'm so sorry. That was very kind of you, Mr. French. Come in and stay for lunch. William, go straight to bed. I'll call Dr. Ware."
        - id: ch02-b47
          speaker: william
          text: "No, don't bother poor Dr. Ware. I'm fine now, honestly. He'd be angry if he came and found nothing wrong."
        - id: ch02-b48
          speaker: mrs_brown
          text: "Of course you need a doctor."
        - id: ch02-b49
          speaker: william
          text: "No, I don't! It wasn't that kind of sickness. A doctor couldn't have helped. I just... came over queer."
        - id: ch02-b50
          speaker: narrator
          text: William had recently heard the cleaning woman use that phrase. Mrs. Brown and Ethel turned to James as if he were an expert. Guilt flooded his face.
        - id: ch02-b51
          speaker: mrs_brown
          text: "What do you think, Mr. French?"
        - id: ch02-b52
          speaker: james_french
          text: "Well, he looks all right, doesn't he? I wouldn't bother him. Don't ask him questions. Let him carry on as usual and forget the whole thing. That would be best."
        - id: ch02-b53
          speaker: mrs_brown
          text: "He is growing very fast."
        - id: ch02-b54
          speaker: james_french
          text: "Yes! It was probably a kind of growing weakness."
        - id: ch02-b55
          speaker: ethel
          text: "But Mr. French was splendid. William, you don't seem to understand how kind he was. You ought to thank him."
        - id: ch02-b56
          speaker: narrator
          text: William gave James a cold look.
        - id: ch02-b57
          speaker: william
          text: "Thank you very much for carrying me. Two, remember, and with long tails."
        - id: ch02-b58
          speaker: narrator
          text: William delivered the formal thanks in front of everyone. Then his mother turned away to say something to Ethel about lunch, and he slipped in the reminder about his payment. James stayed for the meal and spent the afternoon playing golf with Ethel at the links. William, meanwhile, was wrapped tightly in blankets and laid on the library sofa. The blinds were lowered, and the room was kept quiet so he could sleep off his mysterious illness.
        - id: ch02-b59
          speaker: narrator
          text: Mrs. Brown later tiptoed in and found the sofa empty.
        - id: ch02-b60
          speaker: mrs_brown
          text: "He's gone! I made him comfortable and told him to sleep. Sleep matters so much when you're sick, and now he'll probably stay out until bedtime."
        - id: ch02-b61
          speaker: mr_brown
          text: "Good. Be thankful for small mercies."
        - id: ch02-b62
          speaker: narrator
          text: James and Ethel returned for tea. The family still regarded him as the man who had saved William, and they urged him to stay for dinner. Afterward, Ethel sang while James played accompaniments that were not nearly as good as he imagined. Every so often, he broke off to praise her in rapturous words. His admiration was obvious, and Ethel was plainly flattered by it. He remained until almost eleven. When he finally left, the family thanked him all over again for carrying William home. James went out almost dizzy with happiness.
        - id: ch02-b63
          speaker: narrator
          text: He walked down the drive smiling, lost in memories of the evening. Then an upstairs window opened carefully, and a small head appeared.
        - id: ch02-b64
          speaker: william
          text: "Two, remember, and with long tails!"
    - id: ch03
      title: The White Rats Arrive
      blocks:
        - id: ch03-b01
          speaker: mr_brown
          text: "Where did you get that thing?"
          emotion: angry
        - id: ch03-b02
          speaker: narrator
          text: William caught his wandering pet and slipped it into his pocket.
        - id: ch03-b03
          speaker: william
          text: "A friend gave it to me."
        - id: ch03-b04
          speaker: mr_brown
          text: "What friend?"
        - id: ch03-b05
          speaker: william
          text: "Mr. French, the man who carried me when I got sick. I didn't know it would climb into your slipper. I wouldn't have let it if I'd known. I didn't know it would bite your toe, either. It didn't mean to. It probably thought you were me giving it something to eat—"
        - id: ch03-b06
          speaker: mr_brown
          text: "Be quiet! Why on earth did Mr. French give you the horrible thing?"
          emotion: angry
        - id: ch03-b07
          speaker: william
          text: "I don't know. I suppose he wanted to."
        - id: ch03-b08
          speaker: mrs_brown
          text: "He does seem very fond of William."
        - id: ch03-b09
          speaker: narrator
          text: Ethel blushed a little.
        - id: ch03-b10
          speaker: mr_brown
          text: "He seems to hate me. How many of these miserable pests do you have?"
        - id: ch03-b11
          speaker: william
          text: "They're rats. White ones. I've only got two."
        - id: ch03-b12
          speaker: mr_brown
          text: "Good heavens, two! Where's the other one?"
        - id: ch03-b13
          speaker: william
          text: "In the shed."
        - id: ch03-b14
          speaker: mr_brown
          text: "Keep it there, and keep this savage brute there too. My toe is almost eaten off. They need muzzles. They have rabies! Is Jumble in the shed with them?"
        - id: ch03-b15
          speaker: william
          text: "No. He doesn't like them, but I'm teaching him. I let the rats out, then I hold on to Jumble while he looks at them."
        - id: ch03-b16
          speaker: mr_brown
          text: "Yes, keep doing that. Accidents sometimes happen."
        - id: ch03-b17
          speaker: narrator
          text: That night, William obeyed the exact words of the rule. He kept the rats in a box on the outside sill of his bedroom window.
        - id: ch03-b18
          speaker: narrator
          text: In the early hours of the morning, piercing screams from Ethel's room woke the entire house. Rufus, the more adventurous of the two rats, had escaped from the box. He had climbed down the vine from William's window and found his way into Ethel's room. She woke suddenly and found him sitting on her pillow, softly pawing at her hair. Everyone rushed toward the screams in a strange collection of robes and pajamas. Ethel was hysterical. They settled her back in bed and fed her hot tea and crackers to steady her nerves.
        - id: ch03-b19
          speaker: ethel
          text: "It was horrible! It was pulling my hair. It sat right there with its pink nose and long tail. Absolutely horrible!"
          emotion: fearful
        - id: ch03-b20
          speaker: mr_brown
          text: "Where is that wretched animal?"
          emotion: angry
        - id: ch03-b21
          speaker: william
          text: "I've got him, Father. Ethel didn't understand. He was playing with her. He never meant to frighten her—"
        - id: ch03-b22
          speaker: narrator
          text: Mr. Brown, in large pajamas, glared down at William, in small pajamas, holding Rufus lovingly against his chest. Ethel lay in bed, gasping weakly between sips of tea.
        - id: ch03-b23
          speaker: mr_brown
          text: "I told you not to keep them in the house."
        - id: ch03-b24
          speaker: william
          text: "They weren't in the house. They were outside the window, right on the sill. Outside a window isn't inside the house. I put them outside. I can't help it if they come in while I'm asleep."
        - id: ch03-b25
          speaker: narrator
          text: Mr. Brown studied his son with terrible seriousness.
        - id: ch03-b26
          speaker: mr_brown
          text: "The next time I find either rat inside this house, William, I'll wring its neck."
          emotion: angry
        - id: ch03-b27
          speaker: narrator
          text: When James called the next afternoon, he could tell that his popularity had fallen.
        - id: ch03-b28
          speaker: ethel
          text: "Why did you give William such dreadful creatures? I feel awful. My head aches, and my nerves are completely ruined."
          emotion: sad
        - id: ch03-b29
          speaker: narrator
          text: Ethel lay weakly on the sofa while James worked all afternoon and evening to win back every bit of favor he had lost. He sat beside her and talked in a low voice. He read aloud to her. He was sympathetic about the shock, deeply sorry for his mistake, humble under every reproach, and completely devoted. Yet he could feel that his old glory had vanished. He was no longer the wonderful man who had carried William home. To the Brown family, he was now the foolish man who had given William the rat and caused Ethel's collapse. Even the housemaid's eyes accused him when she showed him out.
        - id: ch03-b30
          speaker: narrator
          text: James met William in the drive. A dirty, bloodstained handkerchief was wrapped around the boy's finger, and accusation filled William's eyes too.
        - id: ch03-b31
          speaker: william
          text: "It bit me. One of those rats you gave me bit me."
        - id: ch03-b32
          speaker: james_french
          text: "I'm terribly sorry. But you asked for rats, didn't you?"
        - id: ch03-b33
          speaker: william
          text: "Not savage ones. I didn't ask for rats that would scare Ethel and bite me. I was teaching this one to dance on its back legs. I held up its front paws, and it bit me."
        - id: ch03-b34
          speaker: narrator
          text: James looked at him nervously.
        - id: ch03-b35
          speaker: james_french
          text: "You'd better not tell your mother or Ethel about that finger. I don't want your sister upset again."
        - id: ch03-b36
          speaker: william
          text: "You don't want them to know?"
        - id: ch03-b37
          speaker: james_french
          text: "No."
        - id: ch03-b38
          speaker: william
          text: "What will you give me if I don't tell them?"
        - id: ch03-b39
          speaker: narrator
          text: James reached into his pocket.
        - id: ch03-b40
          speaker: james_french
          text: "I'll give you half a crown."
        - id: ch03-b41
          speaker: narrator
          text: William pocketed the coin.
        - id: ch03-b42
          speaker: william
          text: "All right. If I wash off the blood and make my hands dirty, nobody will notice."
    - id: ch04
      title: Half a Crown at the Fair
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: For several days after that, everything went well. James arrived the next morning loaded with flowers and grapes for Ethel. The gifts and his concern helped the whole household soften toward him again. Ethel even arranged to spend a day playing golf with him. William had his own good fortune. The half crown in his pocket promised a day of magnificent freedom, and a fair was in full swing nearby.
        - id: ch04-b02
          speaker: narrator
          text: William and Jumble made their way straight to the fairground. William began with eleven rides in a row on the merry-go-round. He had firmly decided on twelve, but before the last ride, certain unpleasant feelings made him change his mind. He moved on to the show tents with the grand air of a lord touring his estates. Seven times in a row, he paid his money and went inside. He gazed with silent, intense delight at the Strong Man, the Fat Woman, the India-rubber Jointed Boy, the Siamese Twins, the Human Eel, the Man-headed Elephant, and the Talking Monkey. Each wonder held him spellbound. In every tent, he stayed until the showman finally pushed him out so that other paying visitors could get a look.
        - id: ch04-b03
          speaker: narrator
          text: By the time the seven shows were over, William had completely recovered from the merry-go-round. He bought a large bag of popcorn, leaned against a tent pole, and ate every piece. Then he bought two long sticks of nougat and washed them down with two bottles of ginger beer. Four pennies remained from the half crown. He spent all four on a large package of a red and extremely sticky candy called Canadian Delight.
        - id: ch04-b04
          speaker: narrator
          text: Dusk had fallen by the time William made his very slow way home. At supper, he firmly refused all food. Mrs. Brown began to worry.
        - id: ch04-b05
          speaker: mrs_brown
          text: "William, you don't look well at all. You don't feel the way you did the other day, do you?"
        - id: ch04-b06
          speaker: narrator
          text: William met James's eye across the table, and James blushed.
        - id: ch04-b07
          speaker: william
          text: "No. Nothing like that."
        - id: ch04-b08
          speaker: narrator
          text: Under questioning, William admitted that he had gone to the fair.
        - id: ch04-b09
          speaker: william
          text: "Somebody gave me half a crown. I had to go somewhere."
        - id: ch04-b10
          speaker: mrs_brown
          text: "It's ridiculous for people to give that much money to a boy William's age. It always ends like this. People should know better."
        - id: ch04-b11
          speaker: narrator
          text: As they left the supper table, William whispered hoarsely to James.
        - id: ch04-b12
          speaker: william
          text: "It was the half crown you gave me."
        - id: ch04-b13
          speaker: james_french
          text: "Don't tell them."
        - id: ch04-b14
          speaker: william
          text: "What will you give me if I don't?"
        - id: ch04-b15
          speaker: narrator
          text: James looked around to make sure no one was watching. Then he secretly pushed a two-shilling coin into William's hand. A magnificent future opened before the boy's eyes. This was the second time James had paid him simply to keep quiet. William decided that James had to join the family for good. If he did, life might become one endless stream of half crowns and two-shilling coins, appearing whenever William happened to know something inconvenient.
        - id: ch04-b16
          speaker: narrator
          text: The next day was Sunday. As soon as breakfast ended, William went to the shed to continue the education of his rats. He had separate plans for each one. Rufus was to learn to dance on his back legs. Cromwell was to learn to be friends with Jumble. That second course had not advanced very far. Cromwell sat perfectly still inside his cage. In front of him, Jumble strained furiously toward the bars while William used all his strength to prevent murder. William believed that if the two animals only looked at each other long enough, friendship would surely grow. So they stared at each other every day until William's arm ached. Friendship had still not grown.
        - id: ch04-b17
          speaker: mrs_brown
          text: "William! It's time for church."
        - id: ch04-b18
          speaker: narrator
          text: William groaned. That was the trouble with Sundays. Another half hour might have taught Rufus to dance and Cromwell to love Jumble. Still, William did not let circumstances defeat him. He put Rufus in his pocket. Then he placed Cromwell's cage high on a pile of boxes and left Jumble on the floor to continue their friendly gaze.
    - id: ch05
      title: Disaster at Church
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: William walked quietly behind his family on the way to church. One hand held his prayer book. The other stayed in his pocket, gripping Rufus. He hoped to continue the dancing lesson during the Litany.
        - id: ch05-b02
          speaker: narrator
          text: At church, Ethel sat on one side of William, and no one sat on the other. That gave him exactly the space he needed. He knelt down with an appearance of deep devotion. One hand shaded his face from the family while the other reached to the floor. There he held Rufus firmly by the front paws and walked the rat around and around on its back legs. The dancing lesson became more interesting with every step, and soon William forgot almost everything else.
        - id: ch05-b03
          speaker: mrs_brown
          text: "Tell William to kneel up and stop fidgeting."
        - id: ch05-b04
          speaker: narrator
          text: The message traveled through Ethel. William gave his mother a poisonous look, turned his back on her, and went on with the lesson. The Litany passed faster than it ever had before. When everyone rose for the hymn, William put Rufus back into his pocket.
        - id: ch05-b05
          speaker: narrator
          text: The disaster came during the hymn. The Browns occupied the very front pew, where nothing could happen unseen. During the second verse, the congregation suddenly noticed a small white creature with a long tail climbing onto Mr. Brown's shoulder. Ethel let out a scream that nearly drowned out the organ. Mr. Brown threw up a hand to catch the intruder. Rufus sprang away, landed on the top of his head, and balanced there for a second. His small claws dug into his victim's scalp.
        - id: ch05-b06
          speaker: narrator
          text: Mr. Brown slowly turned a purple face toward his son. That look promised all the revenge that could not properly be delivered in church. Every member of the choir stared at the white rat, and one voice after another dropped out until the hymn died away. William's face had become a mask of horror. Rufus escaped from Mr. Brown and next appeared racing along the rim of the pulpit. Most of the women in the congregation made a sudden exit without worrying about ceremony or dignity. The minister himself went pale as Rufus approached him and slid up the reading desk.
        - id: ch05-b07
          speaker: narrator
          text: A choirboy grabbed Rufus, hurried into the vestry, and escaped home before anyone could question his right to the rat. William found his voice.
        - id: ch05-b08
          speaker: william
          text: "He took him! Rufus is mine. That boy stole him!"
        - id: ch05-b09
          speaker: ethel
          text: "Shh!"
        - id: ch05-b10
          speaker: william
          text: "He's mine. Mr. French gave him to me because I got sick that day."
        - id: ch05-b11
          speaker: ethel
          text: "What?"
          emotion: surprised
        - id: ch05-b12
          speaker: narrator
          text: By then, someone had managed to start the hymn again. The singing gave William enough cover to explain the entire arrangement in a fierce whisper.
        - id: ch05-b13
          speaker: william
          text: "He paid me to get sick so he could carry me home. He wanted to meet you because he's crazy about you. Rufus is mine, and that boy took him just when he was learning to dance—"
        - id: ch05-b14
          speaker: mr_brown
          text: "Shh!"
          emotion: angry
        - id: ch05-b15
          speaker: mrs_brown
          text: "I'll never be able to face anyone again. Everyone was in church! And Ethel screamed so loudly. It was awful. William, how could you?"
        - id: ch05-b16
          speaker: narrator
          text: The family was walking home now.
        - id: ch05-b17
          speaker: william
          text: "Rufus was mine. That boy had no right to take him. He was getting to know me. I didn't mean for him to escape or jump on Father's head or scare everybody. I meant him to stay quiet in my pocket. But he's still mine, and that boy took him."
        - id: ch05-b18
          speaker: mr_brown
          text: "He isn't yours anymore, my son."
        - id: ch05-b19
          speaker: narrator
          text: Ethel walked beside the family with her lips pressed tightly together. Farther down the road, a tall, cheerful figure came toward them. It was James. He knew nothing about Rufus, the ruined hymn, or William's whispered confession. He had set out happily to meet them on their return from church. As he walked, he smiled to himself and composed light, graceful compliments for Ethel.
        - id: ch05-b20
          speaker: narrator
          text: When Ethel drew near, James raised his hat with a flourish and beamed at her as warmly as he could. She kept her head high, walked straight past, and never gave him a glance. James stopped in the road, stunned and despairing, and stared after her. He was so crushed that he never even saw Mr. and Mrs. Brown go by. William saw the whole disaster clearly. With Ethel's anger, all the future half crowns and two-shilling coins that James might have provided seemed to vanish into the distance.
        - id: ch05-b21
          speaker: william
          text: "Ethel, don't be angry with Mr. French! He didn't mean any harm. He only wanted to do something for you because he's crazy about you."
        - id: ch05-b22
          speaker: ethel
          text: "It's horrible! First you bring that dreadful animal to church. Then I find out Mr. French tricked me and you helped him. I hope Father takes away the other rat."
          emotion: angry
        - id: ch05-b23
          speaker: william
          text: "He won't. He never said anything about Cromwell. Cromwell's in the shed learning to be friends with Jumble. Listen, Ethel, don't be angry with Mr. French—"
        - id: ch05-b24
          speaker: ethel
          text: "Oh, stop talking about him!"
          emotion: angry
        - id: ch05-b25
          speaker: narrator
          text: William was enough of a philosopher to accept defeat, along with the riches that marriage between Ethel and James might have brought him.
        - id: ch05-b26
          speaker: william
          text: "All right. At least I still have the other rat."
        - id: ch05-b27
          speaker: narrator
          text: The family entered the drive and began walking toward the front door. Suddenly, there was a rush from the bushes. Twigs cracked and leaves shook as Jumble raced out to welcome his master. More than ordinary pleasure shone in the dog's behavior. He carried himself with pride and triumph, as if he had completed a difficult task perfectly. At William's feet, he carefully laid down his proud offering. It was the mangled remains of Cromwell.
        - id: ch05-b28
          speaker: narrator
          text: William gasped.
        - id: ch05-b29
          speaker: ethel
          text: "Oh, William. I'm so sorry."
          emotion: sad
        - id: ch05-b30
          speaker: narrator
          text: William arranged his face into an expression of proud, controlled grief.
        - id: ch05-b31
          speaker: william
          text: "It's all right. It isn't really your fault, and it isn't Jumble's fault. Maybe he thought this was what I was teaching him to do. Nobody's to blame. We'll have to bury Cromwell. I'll read the real burial service from the prayer book."
        - id: ch05-b32
          speaker: narrator
          text: The thought of conducting a real burial service raised his spirits for a moment. Then William stood still and looked sadly at what remained of Jumble's supposed friend. Jumble waited beside his prize, proud and pleased with himself. He tilted his head to one side and wagged his tail as he looked up for praise. William reviewed the complete fall of all his plans. James French was gone, along with the stream of money that James had seemed to promise. Rufus was gone, carried away by the choirboy. Cromwell was gone too.
        - id: ch05-b33
          speaker: narrator
          text: William put a hand into his pocket and touched the two-shilling coin.
        - id: ch05-b34
          speaker: william
          text: "Well, I've still got that, anyway."
