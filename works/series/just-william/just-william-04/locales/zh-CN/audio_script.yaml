audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    miss_drew:
      display_name: 德鲁小姐
      tts:
        delivery: 耐心克制，疲惫时也保持教师的分寸
        timbre: 年轻柔和
        pace: 中速
        pitch: 中高音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 清楚利落，带一点姐姐的责备
        timbre: 明亮清晰
        pace: 中速
        pitch: 中高音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    cousin:
      display_name: 德鲁小姐的表亲
      tts:
        delivery: 友善随和，带着看热闹的兴致
        timbre: 清朗温厚
        pace: 中速
        pitch: 中音
    gardener:
      display_name: 园丁
      tts:
        delivery: 直来直去，对威廉时格外警觉
        timbre: 粗哑朴实
        pace: 中速
        pitch: 中低音
    woman:
      display_name: 胖女人
      tts:
        delivery: 戏剧化而尖锐，越说越觉得自己英勇
        timbre: 洪亮尖利
        pace: 偏快
        pitch: 高音
    policeman_1:
      display_name: 警察
      tts:
        delivery: 公事公办，耐心询问
        timbre: 稳重清晰
        pace: 中速
        pitch: 中低音
    policeman_2:
      display_name: 另一名警察
      tts:
        delivery: 务实疲惫，只想把搜索做完
        timbre: 低沉平直
        pace: 中速
        pitch: 低音
    friend:
      display_name: 女友人
      tts:
        delivery: 关切而赞叹，顺着朋友的话安慰她
        timbre: 柔软明亮
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 德鲁小姐的俘虏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 阳光照进教室，威廉却闷得要命。他趴在课桌一边，冷眼看着黑板上的一排数字，只觉得那些数字毫无意义。德鲁小姐其实也很厌烦，不过她还肯装作没这回事。
        - id: ch01-b02
          speaker: william
          text: 这根本说不通。
        - id: ch01-b03
          speaker: miss_drew
          text: 一百英镑存一年，如果利息是五英镑……威廉·布朗，坐好！别露出那副傻样子。
        - id: ch01-b04
          speaker: narrator
          text: 威廉从课桌这一边歪到另一边，马上替自己讲起了道理。
        - id: ch01-b05
          speaker: william
          text: 我什么都不明白，当然看起来会傻。有人拿走别人一大笔钱，还年年给人家一点钱，这有什么道理？你把一百英镑给他，只因为他说以后每年还你五英镑，那不是傻吗？你怎么知道他会还？等他拿到那一百英镑，他不给五英镑，又把一百英镑留下，谁能拦住他？
        - id: ch01-b06
          speaker: narrator
          text: 德鲁小姐举起一只纤细的手，叫他停下。
        - id: ch01-b07
          speaker: miss_drew
          text: 威廉，先听我说。假设埃里克有事需要一百英镑，你把钱借给他……
        - id: ch01-b08
          speaker: william
          text: 我不会借给埃里克。我没有一百英镑，只有三便士半，那也不能借他。我又不是傻瓜。上次我借给他一把口琴，他还咬掉了一块，而且……
        - id: ch01-b09
          speaker: narrator
          text: 炎热的下午本来就难熬，德鲁小姐的耐心终于用完了。
        - id: ch01-b10
          speaker: miss_drew
          text: 放学以后留下来，我单独讲给你听。
        - id: ch01-b11
          speaker: william
          text: 哼！
        - id: ch01-b12
          speaker: narrator
          text: 威廉又阴沉下去，直到他想起口袋里还有上学路上抓来的蜥蜴。可那只蜥蜴挤在石子、陀螺、小刀、油灰碎块和其他小玩意儿中间，已经放弃了这场力量悬殊的生存斗争。威廉的口袋太拥挤，住房问题把它压垮了。威廉嫌弃地拿吸墨纸裹住遗体，塞进邻座的墨水瓶。邻座一抗议，两个人立刻打成一团。最后，死蜥蜴又落进后一排一个死对头的衣领里。好几个热心同学帮忙才把它掏出来，接着便有人用吸墨纸写来一封封复仇信，信里的威胁句句都叫人毛骨悚然。
        - id: ch01-b13
          speaker: narrator
          text: 德鲁小姐还在给前排一小群认真又热心的学生解释单利。威廉则在后排想方设法消磨时间，而他的父亲正为了这些时间向教育部门缴纳一大笔钱。不过，他该受的那一份很快就来了。下午放学后，同学一个个走光，只剩他嚼着一块橡皮，满不在乎地瞪着德鲁小姐。
        - id: ch01-b14
          speaker: miss_drew
          text: 过来吧，威廉。你看，一个人要是向另一个人借了一百英镑……
        - id: ch01-b15
          speaker: narrator
          text: 威廉走到她的课桌旁。德鲁小姐俯身在纸上写数字，窗外的阳光照亮了她后颈的金色卷发。她抬起脸，眉头还严厉地皱着，眼睛却蓝得清澈，双颊也微微泛红。
        - id: ch01-b16
          speaker: miss_drew
          text: 现在明白了吗，威廉？
        - id: ch01-b17
          speaker: narrator
          text: 她身边还飘着一缕淡淡的香气。威廉一向是天不怕地不怕的海盗和强盗头子，最瞧不起所有娘娘腔的东西。可就在这一刻，他第一次中了那位爱恶作剧的盲眼小神射出的箭。他红了脸，嘴角也不由自主地露出傻笑。
        - id: ch01-b18
          speaker: william
          text: 这回我全明白了。您一讲就特别清楚。我刚才就是不懂。不过，别人只说来年给五英镑，你就借他一百英镑，还是有点傻，对吧？有些人真是傻瓜。可我现在确实懂了。
        - id: ch01-b19
          speaker: miss_drew
          text: 你要不是整堂课都在玩死蜥蜴，早就懂了。
        - id: ch01-b20
          speaker: narrator
          text: 她疲倦地合上书，威廉惊得倒吸一口气。从此刻起，他成了德鲁小姐忠心耿耿的奴仆。班里有人每天送她精致的小花束，威廉决定让所有人都比不上自己。
        - id: ch01-b21
          speaker: narrator
          text: 第二天上学以前，他趁四下无人，提着大篮子和剪刀钻进温室。那里原本万紫千红，所有鲜花正开得热闹。威廉却以一种本该用在更高尚事业上的彻底与专注，把花剪得干干净净。等他摇摇晃晃地提着堆得高高的花篮出来，温室已经空空荡荡，一片凄凉。后花园刚传来响动，他就决定不能再等，赶紧尽量不惹人注意地出了门。
        - id: ch01-b22
          speaker: narrator
          text: 德鲁小姐一走进教室就吓了一跳。往日桌上只有几朵小巧精致的襟花，今天却变成一大片开始打蔫的温室花。花多得把整张课桌盖得严严实实，连她的椅子也完全埋在了下面。威廉做任何事都不肯只做一半。
        - id: ch01-b23
          speaker: miss_drew
          text: 天哪！
          emotion: surprised
        - id: ch01-b24
          speaker: narrator
          text: 威廉高兴得满脸通红，把座位搬到了第一排。整个上午，他都热切地盯着德鲁小姐，脑海里全是自己英勇救她的画面。他会在最危险的时刻从海盗和强盗手里救出她。虽然他平日最爱扮演的，偏偏也是海盗和强盗头子，这一点多少有些矛盾。接着，他会用强壮的双臂抱着昏迷的她，一路送到安全的地方。她醒来以后，便满怀爱意与感激地依偎着他，立刻跟他结婚。
        - id: ch01-b25
          speaker: narrator
          text: 她会满怀爱意与感激地依偎着他，他们马上就结婚。婚礼必须由坎特伯雷大主教和约克大主教共同主持，不然就请教皇。威廉做事从不要半套，他甚至有点更中意教皇。他还想穿上那套画着骷髅和交叉骨的黑色海盗服。可仔细一想，那套衣服大概不适合婚礼。
        - id: ch01-b26
          speaker: miss_drew
          text: 威廉，我刚刚说了什么？
        - id: ch01-b27
          speaker: william
          text: 是借钱的事吗？
        - id: ch01-b28
          speaker: miss_drew
          text: 威廉！这不是算术课，我讲的是西班牙无敌舰队。
        - id: ch01-b29
          speaker: william
          text: 哦，是那个！对，我知道。
        - id: ch01-b30
          speaker: miss_drew
          text: 那你说一件跟它有关的事。
        - id: ch01-b31
          speaker: william
          text: 我还不知道。只是现在还不知道……
        - id: ch01-b32
          speaker: miss_drew
          text: 我刚才一直在告诉你。真希望你肯听一听。
        - id: ch01-b33
          speaker: narrator
          text: 威廉给这个问题难住了，再也答不出话，只好在第一排安静下来。不过，他只是没话可说，德鲁小姐的绝望丝毫没有把他吓住。
    - id: ch02
      title: 一个勤奋的学生
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 傍晚回家时，威廉发现花园里闹成一团。一个警察在量温室门上的玻璃，另一个跪着检查花坛。埃塞尔站在前门，兴奋得不得了。
        - id: ch02-b02
          speaker: ethel
          text: 今天早上，温室里的花全让人偷走了，一朵都没剩。我们刚刚才请到警察。威廉，你上学时有没有看见谁？
        - id: ch02-b03
          speaker: narrator
          text: 威廉认真想了很久，脸上慢慢摆出最天真无辜的神情。
        - id: ch02-b04
          speaker: william
          text: 没有，埃塞尔。我一个人也没看见。
        - id: ch02-b05
          speaker: narrator
          text: 他轻咳一声，十分谨慎地退走。到了晚上，他在书房桌边郑重坐好，把一本本书摊满四周，小脸上带着坚定的愁容，像是遇上了人生大事。布朗先生正坐在窗边的扶手椅里读晚报，忽然听见儿子发问。
        - id: ch02-b06
          speaker: william
          text: 爸爸，要是我请您给我一百英镑，答应明年给您五英镑，以后每年都给，您会答应吗？
        - id: ch02-b07
          speaker: father
          text: 不会，我的孩子。
        - id: ch02-b08
          speaker: william
          text: 我就知道这事有问题。
        - id: ch02-b09
          speaker: narrator
          text: 布朗先生回去读社论，可安静没有维持多久。
        - id: ch02-b10
          speaker: william
          text: 爸爸，西班牙无敌舰队是哪一年？
        - id: ch02-b11
          speaker: father
          text: 天哪，我怎么会知道？那时候我又没在场。
        - id: ch02-b12
          speaker: william
          text: 可我要写它为什么会失败。它到底为什么失败？
        - id: ch02-b13
          speaker: narrator
          text: 布朗先生呻吟一声，抱起报纸躲进餐厅。那篇社论快读完时，威廉又捧着一摞书来了，安静地坐到桌边。
        - id: ch02-b14
          speaker: william
          text: 爸爸，“我姑妈正在花园里散步”用法文怎么说？
        - id: ch02-b15
          speaker: father
          text: 你究竟在做什么？
        - id: ch02-b16
          speaker: william
          text: 我在写家庭作业。
        - id: ch02-b17
          speaker: father
          text: 我以前根本不知道你还有家庭作业。
        - id: ch02-b18
          speaker: william
          text: 我平常是不太费心。不过以后我要认真了，因为德鲁小姐……因为德鲁小姐……因、因为德鲁小姐……
        - id: ch02-b19
          speaker: narrator
          text: 威廉第一次说到德鲁小姐时只是微微脸红，第二次脸就更红，还结巴起来。等第三次把名字挤出口，他几乎憋得连气都喘不过来。布朗先生一句话也没说，悄悄收起报纸，蹑手蹑脚地溜到游廊。布朗太太正坐在那里，缝补这一星期积下的衣物。
        - id: ch02-b20
          speaker: father
          text: 威廉在餐厅里发疯了。症状是疯狂地渴求知识，嘴里还不停念叨一位德娄小姐，或是德鲁小姐。最好让他一个人待着。
        - id: ch02-b21
          speaker: narrator
          text: 布朗太太只管安详地笑了笑。布朗先生读完一篇社论，又读起一篇，威廉才皱着眉出现在门口。
        - id: ch02-b22
          speaker: william
          text: 爸爸，荷兰的首都是什么？
        - id: ch02-b23
          speaker: father
          text: 天哪！给他买百科全书吧，买什么都行。他把我当成什么了？
        - id: ch02-b24
          speaker: mother
          text: 他既然这么关心功课，我看该专门给他留一间屋子写作业。
        - id: ch02-b25
          speaker: father
          text: 一间屋子？他需要的是一整栋房子。
        - id: ch02-b26
          speaker: narrator
          text: 第二天，德鲁小姐又惊讶又感动。威廉整天都表现得无比认真，眼睛也一直盯着她。下午放学时，他又体贴地提出替她把书送回家。她一再推辞，他却挥挥手，把所有反对都挡了回去。他迈着大步走在她身边，愉快地说个不停，那张小小的雀斑脸上满是爱慕。
        - id: ch02-b27
          speaker: william
          text: 我喜欢海盗，您也喜欢吧？还有强盗。德鲁小姐，您愿意嫁给强盗吗？
        - id: ch02-b28
          speaker: narrator
          text: 威廉想把两个理想合到一起。他既想长大后做强盗，又想做德鲁小姐的丈夫。
        - id: ch02-b29
          speaker: miss_drew
          text: 我不愿意。
        - id: ch02-b30
          speaker: narrator
          text: 威廉的心一下沉了下去。
        - id: ch02-b31
          speaker: william
          text: 那海盗呢？您也不愿意？
        - id: ch02-b32
          speaker: miss_drew
          text: 也不愿意。
        - id: ch02-b33
          speaker: william
          text: 海盗其实很不错，真的。
        - id: ch02-b34
          speaker: miss_drew
          text: 我不这么认为。
        - id: ch02-b35
          speaker: william
          text: 那我们只能去猎野兽了。这样也行。
        - id: ch02-b36
          speaker: miss_drew
          text: 你说谁？
        - id: ch02-b37
          speaker: william
          text: 您等着看就知道了。对了，婚礼您想请约克大主教主持，还是请教皇？
        - id: ch02-b38
          speaker: miss_drew
          text: 我想还是大主教吧。
        - id: ch02-b39
          speaker: william
          text: 好吧。
        - id: ch02-b40
          speaker: narrator
          text: 德鲁小姐这时还觉得他很有趣。可到了第二天傍晚，她就笑不出来了。她和一位长得很英俊的男性表亲散步，碰巧经过威廉家。威廉正在花园扮海盗，见到他们就扔下游戏，快活地跑到德鲁小姐另一边。
        - id: ch02-b41
          speaker: narrator
          text: 威廉包办了整场谈话，那位表亲还故意鼓励他，弄得德鲁小姐很不高兴。无论她怎样暗示，威廉就是不走。他有好几件趣事一定要讲，而且确信听的人都会欣赏。昨天他找到一只死老鼠，拿去喂狗，可狗不吃死的，家里的老猫也不吃，所以他只好把老鼠埋了。他又问德鲁小姐喜不喜欢前几天那些花，还说明眼下暂时不能再送那么多。
        - id: ch02-b42
          speaker: narrator
          text: 接着，他开始琢磨如今为什么不能有海盗，还说自己打算先做一个。他将来要打死一头狮子和一只老虎，把兽皮送给德鲁小姐。说着说着，他越来越慷慨，答应送她一大堆各种野兽的皮。
        - id: ch02-b43
          speaker: miss_drew
          text: 威廉，你现在是不是该回家了？
        - id: ch02-b44
          speaker: william
          text: 不用，还早得很。
        - id: ch02-b45
          speaker: miss_drew
          text: 还没到你睡觉的时间吗？
        - id: ch02-b46
          speaker: william
          text: 还没有，离睡觉还早呢。
        - id: ch02-b47
          speaker: cousin
          text: 威廉，德鲁小姐平时在学校教你什么？
        - id: ch02-b48
          speaker: william
          text: 就是普通东西，无敌舰队什么的，还有把一百英镑借出去。借钱这件事傻透了。我明白是怎么回事，可它还是很傻。我爸爸也这样想，他一定懂。他去过很多次外国，还让一头公牛追过……
        - id: ch02-b49
          speaker: narrator
          text: 天色越来越暗，威廉还在滔滔不绝，直到三个人走到德鲁小姐家。他已经让自己的成功陶醉了，还把心中偶像一路不说话，当成她听得入了迷、满怀赞叹。他带着确信会受欢迎的神气，准备跟两位同伴一起穿过大门。德鲁小姐却干脆地把门关在了他面前。
        - id: ch02-b50
          speaker: miss_drew
          text: 你该回家了，威廉。
        - id: ch02-b51
          speaker: william
          text: 我进去坐一会儿也没关系。我一点都不累。
        - id: ch02-b52
          speaker: narrator
          text: 德鲁小姐和表亲已经走远，威廉只好回头。他刚到自家门口，就碰见了埃塞尔。
        - id: ch02-b53
          speaker: ethel
          text: 威廉，你跑到哪里去了？我找了你好久。早就过了睡觉时间。
        - id: ch02-b54
          speaker: william
          text: 我在陪德鲁小姐散步。
        - id: ch02-b55
          speaker: ethel
          text: 可你到时间就应该回家。
        - id: ch02-b56
          speaker: william
          text: 我觉得她不想让我走。我要是走了，多不礼貌。
        - id: ch02-b57
          speaker: narrator
          text: 爱上德鲁小姐，让威廉的生活忽然多了一件崭新而严肃的大事，可这事也不是全无坏处。过去上课时，他有数不清的小花样可以消磨时间。尽管现在深爱德鲁小姐，他还是怀念从前无忧无虑、想闹就闹的日子。不过，他仍旧留在第一排，坚持扮演勤奋学生。认真完成家庭作业，也让他放学以后少了很多活动时间，可眼下他还乐意抱紧身上的锁链。德鲁小姐坐在讲台上，被他全神贯注又深情的目光盯得不自在，而他提出的问题比那种目光更叫她难堪。
    - id: ch03
      title: 山梅花大盗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天放学时，威廉听见德鲁小姐跟另一位教师说话。
        - id: ch03-b02
          speaker: miss_drew
          text: 我很喜欢山梅花，真想有几枝。
        - id: ch03-b03
          speaker: narrator
          text: 威廉当场作出决定。他要给德鲁小姐送山梅花，不是一两枝，而是一把又一把、一抱又一抱的山梅花。放学以后，他哪儿也没去，径直回家找园丁，满心以为自家花园里总能找到。
        - id: ch03-b04
          speaker: gardener
          text: 我这儿没有山梅花。威廉少爷，请从玫瑰花坛里出来。整个园子都没有，我也不知道为什么。还有，请别动我的水管。
        - id: ch03-b05
          speaker: william
          text: 哼！
        - id: ch03-b06
          speaker: narrator
          text: 威廉轻蔑地转身，在自家花园里仔细找了一圈。园丁没有说错，到处都是雪球花，山梅花一棵也没有。他又爬过篱笆，站在那里查看隔壁的花园，结果还是满园雪球花，一棵山梅花都找不到。大概是这一带的土壤有什么古怪。他只好沿着大路慢慢走，一路查看两旁每一座花园。家家都有雪球花，就是没有一家种山梅花。
        - id: ch03-b07
          speaker: narrator
          text: 到了路尽头，他忽然停住脚步。那里有一栋小房子，临街窗户里面摆着一张桌子。桌上的花瓶里，插的正是他找遍附近也没找到的山梅花。他根本不知道谁住在这里，却还是小心翼翼地走进花园。四周一个人也没有。他朝窗里一看，房间空着，窗户下半扇还恰好开着。
        - id: ch03-b08
          speaker: narrator
          text: 威廉手脚并用地爬过窗户，顺便从窗台上蹭掉了好几层白漆。他今天非得到那束山梅花不可。他把花从瓶中抽出来，花枝上的水滴了一路。正要原路离开，房门忽然打开，一个胖女人出现在门口。她一看清威廉，立刻发出一声尖叫，那声音吓得他浑身的血液都快凝住了。
        - id: ch03-b09
          speaker: narrator
          text: 胖女人猛地向窗户扑去。威廉只好绕着桌子躲开她，再从房门飞奔出去。屋子的后门正好开着，他慌不择路，闭着眼睛一路冲到外面。胖女人没有跟在后面追。她还站在屋里，整个人探出窗外，让一声接一声的尖叫撕开空气，传遍整条街。
        - id: ch03-b10
          speaker: woman
          text: 警察！救命啊！杀人啦！有强盗！
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 又粗又刺耳的叫喊震响了整条安静的小街。威廉只觉得一道道寒意沿着脊背爬上去，又爬下来。他虽然从房里逃了出来，却落进一个小小的后花园。无论怎么看，四周都找不到出口。与此同时，胖女人的呼救声还在加倍变响。
        - id: ch03-b12
          speaker: woman
          text: 救命！救命！救命！
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: 接着，威廉听到前门打开，几个男人在大声问是谁、出了什么事。他发疯似的四处张望，终于看到花园角落有一座鸡舍。他猛冲过去，扯开小门，一头扎进乱飞的羽毛和愤怒受惊的母鸡中间。随后，他坚定地缩在黑暗角落里，手中仍然死死抓着那束山梅花。
        - id: ch03-b14
          speaker: narrator
          text: 起先，威廉只能听到远处模模糊糊的人声。他一动不动地等着，那些声音却渐渐向鸡舍靠近。没过多久，他已经能够清清楚楚地听见胖女人的声音。她正用尽力气，向来人高声讲述刚才发生的一切。
        - id: ch03-b15
          speaker: woman
          text: 那个男人个子很小，可脸凶恶极了。他从我身边冲过去，我只看清一眼。要不是我喊救命，他一定会杀了我。这个懦夫，竟敢欺负我这样手无寸铁的女人！我撞见他站在银器桌旁，正干着罪恶的勾当。我现在还惊魂未定，几天都别想睡了。一闭眼就会看见那张杀气腾腾的脸！
        - id: ch03-b16
          speaker: policeman_1
          text: 太太，您还能说出别的特征吗？如果再见到他，您认得出来吗？
        - id: ch03-b17
          speaker: woman
          text: 在哪儿我都能认出来！那完全是一张罪犯的脸。你不知道我吓成了什么样。要不是我有勇气呼救，现在已经是一具尸体了。
        - id: ch03-b18
          speaker: policeman_1
          text: 我们正在量脚印。您说他是从前门走的？
        - id: ch03-b19
          speaker: woman
          text: 我敢肯定。我也敢肯定他躲在大门边的灌木丛里。那张脸太卑劣了，我全身的神经都让他搅乱了。
        - id: ch03-b20
          speaker: policeman_2
          text: 我们会再搜一遍灌木丛，不过他现在多半已经逃了。
        - id: ch03-b21
          speaker: woman
          text: 那个畜生！尤其是他的脸！我要不是有勇气喊出声……
        - id: ch03-b22
          speaker: narrator
          text: 声音终于一点点远去，只剩威廉独自缩在鸡舍角落。一只白母鸡出现在小门口，愤怒地冲他叫了一阵，又一边咯咯表示不满，一边退了出去。威廉眼前接连浮现出终身苦役和绞刑。他认真比较了一番，觉得与其一辈子服苦役，还不如直接处死。说真的，他希望他们能判他死刑。
        - id: ch03-b23
          speaker: narrator
          text: 过了一会儿，威廉听到胖女人向警察道别，总算松了口气。可她很快又来到后花园，身边显然还带着一位朋友。她并没有打算让刚才的英勇事迹就此结束，又从头倾诉起自己受过的苦难。
        - id: ch03-b24
          speaker: woman
          text: 他就是从我身边冲过去的，亲爱的。个子很小，脸却凶得吓人。
        - id: ch03-b25
          speaker: narrator
          text: 一只黑母鸡来到门口，愤怒地冲威廉叫了一声，又走回花园。
        - id: ch03-b26
          speaker: friend
          text: 亲爱的，你真了不起。真不知道你哪来的勇气。
        - id: ch03-b27
          speaker: narrator
          text: 白母鸡发出一声满含讥讽的尖叫。
        - id: ch03-b28
          speaker: friend
          text: 亲爱的，你还是进屋歇一歇吧。
        - id: ch03-b29
          speaker: woman
          text: 是该歇歇。我实在觉得……受了很大的惊吓……
        - id: ch03-b30
          speaker: narrator
          text: 她们不再说话，进屋关上门，四周终于完全安静。又等了好一会儿，那个头发蓬乱、衣服也凌乱不堪的威廉才极其小心地爬出鸡舍。他身上从头到脚沾满母鸡留下的羽毛，手里却始终没有松开那束山梅花。他贴着墙绕到房子侧面，在那里发现一道锁着的侧门，于是手脚并用地翻了过去。随后，他又悄无声息地溜到前门，终于安全回到大路。
        - id: ch03-b31
          speaker: mother
          text: 威廉今晚到哪里去了？但愿他别过了睡觉时间还不回来。
        - id: ch03-b32
          speaker: ethel
          text: 我刚刚看见他了。他正上楼回卧室，浑身都是鸡毛，手里还拿着一束山梅花。
        - id: ch03-b33
          speaker: father
          text: 疯了！疯了！疯了！
    - id: ch04
      title: 偶像的泥脚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早晨，威廉终于把那束历尽艰险得来的山梅花放在德鲁小姐桌上。他没有提自己爬过窗户，也没有提胖女人、警察和那一身鸡毛。他只是带着一种安静而坚定的骄傲，像个真正的男子汉那样完成了献花。可德鲁小姐一看清桌上的花，立刻向后躲开。
        - id: ch04-b02
          speaker: miss_drew
          text: 不是山梅花，威廉！我根本受不了它的气味。
          emotion: disgusted
        - id: ch04-b03
          speaker: narrator
          text: 威廉一句话也说不出来，只能惊愕地望着她。
        - id: ch04-b04
          speaker: william
          text: 可您明明说过……您说自己喜欢山梅花，还想要几枝。
        - id: ch04-b05
          speaker: miss_drew
          text: 我说的是山梅花吗？我想说的应该是雪球花。
        - id: ch04-b06
          speaker: narrator
          text: 威廉一动不动地看着她，过了好一会儿，眼里的惊愕才渐渐变成像石头一样冰冷的鄙夷。他没有再争辩，只是转过身，慢慢走回教室后排原来的座位。当天晚上，他和几个最要好的朋友生起一堆篝火，在花园里重新玩起了印第安人。告别勤奋学生的锁链，回到从前那种无拘无束的生活，竟然又有了一种久违而激动人心的滋味。
        - id: ch04-b07
          speaker: father
          text: 嘿！我还以为你现在会做家庭作业了。
        - id: ch04-b08
          speaker: narrator
          text: 布朗先生说这话时，威廉正在灌木间四肢着地地爬。他听见父亲发问，便站直了身子。
        - id: ch04-b09
          speaker: william
          text: 我不准备再为作业费那么多事了。德鲁小姐说话说不清楚，她自己都不知道自己是什么意思。
        - id: ch04-b10
          speaker: father
          text: 女人总有这个毛病。
        - id: ch04-b11
          speaker: narrator
          text: 布朗太太正好走过来，布朗先生便把威廉的遭遇告诉她。
        - id: ch04-b12
          speaker: father
          text: 威廉说，他的偶像长着一双泥脚。
        - id: ch04-b13
          speaker: william
          text: 我可不知道她有没有泥脚。我只说她讲话说不明白。我费了那么大劲，她却连自己是什么意思都不知道。我看她的脚挺好，走路也没问题。再说，人家做假脚都用木头，谁会用泥呢？
