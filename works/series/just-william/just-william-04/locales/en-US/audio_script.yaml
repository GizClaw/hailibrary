  chapters:
    - id: ch01
      title: Arithmetic on a Hot Afternoon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: William was bored. He sat in the sunny schoolroom, staring without interest at a row of figures on the blackboard.
        - id: ch01-b02
          speaker: william
          text: It doesn't make any sense.
        - id: ch01-b03
          speaker: narrator
          text: Miss Drew was bored too, but she was trying not to show it.
        - id: ch01-b04
          speaker: miss_drew
          text: If the interest on one hundred pounds for one year is five pounds... William Brown, sit up straight. And don't look so stupid.
        - id: ch01-b05
          speaker: narrator
          text: William stopped hanging over one side of his desk and hung over the other instead. Then he began to defend himself.
        - id: ch01-b06
          speaker: william
          text: Well, I can't understand any of it. Anybody'd look stupid if they couldn't understand it. Why does somebody give you little bits of money because you gave them a lot of money? And why do they keep doing it? It doesn't make sense. You'd be a fool to hand over a hundred pounds just because somebody promised you five pounds and said you could keep your hundred. How do you know he'll do it? Once he's got your hundred pounds, what's to stop him keeping it and never giving you the five?
        - id: ch01-b07
          speaker: narrator
          text: William was gathering speed, but Miss Drew stopped him with one slim hand in the air.
        - id: ch01-b08
          speaker: miss_drew
          text: William, please listen. Suppose Eric needed a hundred pounds for something, and you lent it to him.
        - id: ch01-b09
          speaker: william
          text: I wouldn't lend Eric a hundred pounds. I haven't got it. I've only got three and a half pence, and I wouldn't lend him that either. I'm not a fool. I lent him my mouth organ once, and he bit a piece off it, and—
        - id: ch01-b10
          speaker: narrator
          text: Miss Drew cut him off sharply. Teaching on a hot afternoon could try anyone's patience.
        - id: ch01-b11
          speaker: miss_drew
          text: You can stay after school, William. I'll explain it to you then.
        - id: ch01-b12
          speaker: narrator
          text: William scowled, gave a scornful little “Huh,” and sank into gloom. Then he remembered the lizard he'd caught on the way to school and brightened. He pulled it out of his pocket. But the lizard had not survived among the stones, top, pocketknife, putty, and all the other things that lived in there. The housing problem had been too much for it.
        - id: ch01-b13
          speaker: narrator
          text: Disgusted, William wrapped the remains in blotting paper and dropped them into his neighbor's inkwell. The neighbor objected, and a lively struggle followed. At last the lizard went down the collar of one of William's oldest enemies in the next row. Several helpful friends were needed to get it out. After that came promises of revenge, terrible enough to chill the blood, all written on blotting paper.
        - id: ch01-b14
          speaker: narrator
          text: Up front, Miss Drew explained simple practice to a small, serious group who admired her. In the back row, William found his own uses for the school hours his father paid the authorities to provide. But his turn was coming.
        - id: ch01-b15
          speaker: narrator
          text: When afternoon school ended, the children left one by one. William remained behind, calmly chewing a piece of rubber and glaring at Miss Drew.
        - id: ch01-b16
          speaker: miss_drew
          text: All right, William.
        - id: ch01-b17
          speaker: narrator
          text: She was being patient in a very severe way. William went to the front and stood beside her desk.
        - id: ch01-b18
          speaker: miss_drew
          text: You see, if one person borrows a hundred pounds from another person...
        - id: ch01-b19
          speaker: narrator
          text: She bent over the desk and wrote the figures on a sheet of paper. Sunlight poured through the window and caught the little gold curls at the back of her neck. Then she looked up at William. Her eyes were stern and frowning, but very blue, and her cheeks were flushed.
        - id: ch01-b20
          speaker: miss_drew
          text: Don't you see it now, William?
        - id: ch01-b21
          speaker: narrator
          text: A faint perfume hung around her. William had always been a reckless pirate, a robber chief, and a stern enemy of anything soft or girlish. Now, for the first time, love's arrow found him. He blushed and smiled foolishly.
        - id: ch01-b22
          speaker: william
          text: Yes, I see the whole thing now. You explained it properly. I couldn't understand it before. It's still pretty silly, lending somebody a hundred pounds because he says he'll give you five next year. Some people are fools. But I understand it now. I didn't before.
        - id: ch01-b23
          speaker: miss_drew
          text: It might have been easier if you hadn't spent the lesson playing with dead lizards.
        - id: ch01-b24
          speaker: narrator
          text: Miss Drew closed her books wearily. William could only gasp. He went home as her devoted slave.
    - id: ch02
      title: Flowers for Miss Drew
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Some children left neat little bouquets on Miss Drew's desk each morning. William meant to outdo every one of them. Before school the next day, he went into the garden carrying a large basket and a pair of scissors.
        - id: ch02-b02
          speaker: narrator
          text: No one happened to be nearby. He began in the hothouse, which was a riot of color. He cut and gathered with complete concentration, putting into the job all the effort that might have served a much finer cause. When he finally emerged, he staggered beneath a basket piled high with hothouse flowers. Behind him, the hothouse stood bare, empty, and miserable.
        - id: ch02-b03
          speaker: narrator
          text: A sound came from the back garden. William decided there was no reason to wait. He left for school at once, trying to look as ordinary as possible.
        - id: ch02-b04
          speaker: narrator
          text: When Miss Drew entered the classroom, she stopped in horror. The usual few buttonhole flowers were gone from view. In their place lay a great heap of already wilting blooms that buried both her desk and her chair. William never did anything by halves.
        - id: ch02-b05
          speaker: miss_drew
          text: Good heavens!
          emotion: surprised
        - id: ch02-b06
          speaker: narrator
          text: William blushed with pleasure and moved himself into the front row. All morning he watched her earnestly. In his daydreams, he rescued her from robbers and pirates, though robbers and pirates were usually the heroes he preferred to be. He carried her, fainting, to safety. Then she clung to him with love and gratitude, and the Archbishops of Canterbury and York married them at once.
        - id: ch02-b07
          speaker: narrator
          text: William did not believe in half measures. It had to be both archbishops, or perhaps the Pope. He was beginning to think he'd rather have the Pope. He would wear his black pirate suit with the skull and crossbones. No, that wouldn't do.
        - id: ch02-b08
          speaker: miss_drew
          text: William, what did I just say?
        - id: ch02-b09
          speaker: narrator
          text: William coughed and gave her his most soulful look.
        - id: ch02-b10
          speaker: william
          text: Was it about lending money?
        - id: ch02-b11
          speaker: miss_drew
          text: William! This is not arithmetic. I'm teaching you about the Armada.
        - id: ch02-b12
          speaker: william
          text: Oh, that. Yes, of course.
        - id: ch02-b13
          speaker: miss_drew
          text: Then tell me something about it.
        - id: ch02-b14
          speaker: william
          text: I don't know anything about it. Not yet, anyway.
        - id: ch02-b15
          speaker: miss_drew
          text: I've just been telling you. I wish you would listen.
        - id: ch02-b16
          speaker: narrator
          text: William had no answer, but he was not beaten.
        - id: ch02-b17
          speaker: narrator
          text: When he reached home that evening, the garden was in an uproar. One policeman was measuring the glass panes in the conservatory door. Another knelt beside the flower beds, examining the ground. Ethel stood at the front door.
        - id: ch02-b18
          speaker: ethel
          text: Every flower in the conservatory was stolen this morning. We've only just managed to get the police here. William, did you notice anyone around when you left for school?
        - id: ch02-b19
          speaker: narrator
          text: William thought hard. His face became perfectly innocent.
        - id: ch02-b20
          speaker: william
          text: No. No, Ethel, I didn't see anybody.
        - id: ch02-b21
          speaker: narrator
          text: Then William coughed and quietly slipped away.
    - id: ch03
      title: A Wild Thirst for Knowledge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That evening William settled at the library table. He spread his books all around him and wore a determined frown. His father sat in an armchair by the window, reading the evening paper.
        - id: ch03-b02
          speaker: william
          text: Father, suppose I asked you for a hundred pounds and promised to give you five pounds next year, and then five every year after that. Would you give me the money?
        - id: ch03-b03
          speaker: father
          text: I would not, my son.
        - id: ch03-b04
          speaker: narrator
          text: William sighed.
        - id: ch03-b05
          speaker: william
          text: I knew there was something wrong with it.
        - id: ch03-b06
          speaker: narrator
          text: Mr. Brown returned to the leading article in his paper. He did not get far.
        - id: ch03-b07
          speaker: william
          text: Father, when was the Armada?
        - id: ch03-b08
          speaker: father
          text: Good heavens! How would I know? I wasn't there.
        - id: ch03-b09
          speaker: narrator
          text: William sighed again.
        - id: ch03-b10
          speaker: william
          text: Well, I'm trying to write about it, and why it failed. Why did it fail?
        - id: ch03-b11
          speaker: narrator
          text: Mr. Brown groaned, gathered up the paper, and escaped to the dining room. He had nearly finished the article when William appeared with an armload of books and quietly sat at the table.
        - id: ch03-b12
          speaker: william
          text: Father, how do you say “my aunt is walking in the garden” in French?
        - id: ch03-b13
          speaker: father
          text: What in the world are you doing?
        - id: ch03-b14
          speaker: william
          text: I'm doing my homework.
        - id: ch03-b15
          speaker: narrator
          text: William sounded extremely virtuous.
        - id: ch03-b16
          speaker: father
          text: I didn't even know you had homework.
        - id: ch03-b17
          speaker: william
          text: I don't usually bother much with it. But I'm going to now, because Miss Drew... because Miss Drew... b-because Miss Drew...
        - id: ch03-b18
          speaker: narrator
          text: His first blush deepened. Then he began to stammer until he was almost purple. Mr. Brown silently collected his paper and crept out to the porch. Mrs. Brown was sitting there with the week's mending.
        - id: ch03-b19
          speaker: father
          text: William has gone completely mad in the dining room. It seems to be a wild hunger for knowledge, mixed with babbling about a Miss Drawing, or Drew, or something. Best to leave him alone.
        - id: ch03-b20
          speaker: narrator
          text: He sat down. Mrs. Brown only smiled peacefully over her sewing. Mr. Brown finished one leading article and started another before William came back. William stood sternly in the doorway, frowning.
        - id: ch03-b21
          speaker: william
          text: Father, what's the capital of Holland?
        - id: ch03-b22
          speaker: father
          text: Good heavens! Buy him an encyclopedia. Buy him anything. What does he imagine I am?
        - id: ch03-b23
          speaker: mrs_brown
          text: Now that he's so interested, perhaps I should set aside a room just for his homework.
        - id: ch03-b24
          speaker: father
          text: A room? He needs an entire house.
        - id: ch03-b25
          speaker: narrator
          text: The next day, Miss Drew was both surprised and touched by William's serious attention. When afternoon school ended, he kindly offered to carry her books home. He waved away every objection and marched beside her, chatting pleasantly, his freckled face glowing with devotion.
        - id: ch03-b26
          speaker: william
          text: I like pirates. Do you like them, Miss Drew? Pirates and robbers and that sort of thing? Would you like to marry a robber?
        - id: ch03-b27
          speaker: narrator
          text: He was trying to fit his old dream of being a robber chief together with his new dream of being Miss Drew's husband.
        - id: ch03-b28
          speaker: miss_drew
          text: No, I would not.
        - id: ch03-b29
          speaker: narrator
          text: His heart dropped.
        - id: ch03-b30
          speaker: william
          text: What about a pirate?
          emotion: sad
        - id: ch03-b31
          speaker: miss_drew
          text: No.
        - id: ch03-b32
          speaker: william
          text: Pirates are actually pretty nice.
        - id: ch03-b33
          speaker: miss_drew
          text: I don't believe they are.
        - id: ch03-b34
          speaker: william
          text: Well, then we'll have to hunt wild animals and things. That'll be all right.
        - id: ch03-b35
          speaker: miss_drew
          text: Who will?
        - id: ch03-b36
          speaker: narrator
          text: Miss Drew looked bewildered.
        - id: ch03-b37
          speaker: william
          text: Just wait and see. Oh, and would you rather be married by the Archbishop of York or by the Pope?
        - id: ch03-b38
          speaker: miss_drew
          text: I think I'd choose the Archbishop.
        - id: ch03-b39
          speaker: narrator
          text: She answered with a perfectly serious face. William nodded.
        - id: ch03-b40
          speaker: william
          text: All right.
    - id: ch04
      title: An Evening Walk
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Miss Drew was amused then. She was much less amused the following evening. She had a handsome male cousin, and the two of them often took walks together. By chance, they passed William's house while he was in the garden. William dropped his latest game of pirates and joined them.
        - id: ch04-b02
          speaker: narrator
          text: He trotted happily on Miss Drew's other side and took complete control of the conversation. Her cousin seemed to encourage him, which annoyed Miss Drew. No matter how strongly she hinted, William would not leave. He had news to share, and he was certain they wanted every bit of it.
        - id: ch04-b03
          speaker: william
          text: I found a dead rat yesterday and gave it to my dog. He doesn't like rats when they're dead, though. The old cat didn't want it either, so I buried it. Did you like all those flowers I brought you? I don't think I can get you any more like those just yet. Are there still pirates now? What would people do if they found one? I don't see why there shouldn't be pirates. I think I'll start being one anyway. And one day I'm going to shoot a lion. A tiger too. I'll bring you the lion skin if you want it. I'll bring you lots of different animal skins.
        - id: ch04-b04
          speaker: miss_drew
          text: Don't you think you should go home, William?
        - id: ch04-b05
          speaker: narrator
          text: Her voice was cold, but William hurried to reassure her.
        - id: ch04-b06
          speaker: william
          text: Oh, no. Not for a long time yet.
        - id: ch04-b07
          speaker: miss_drew
          text: Isn't it past your bedtime?
        - id: ch04-b08
          speaker: william
          text: No, not yet. Not for ages.
        - id: ch04-b09
          speaker: narrator
          text: Miss Drew's cousin was giving William all his attention.
        - id: ch04-b10
          speaker: male_cousin
          text: What does Miss Drew teach you in school, William?
        - id: ch04-b11
          speaker: william
          text: Oh, just ordinary things. Armadas and things. And lending somebody a hundred pounds. That's awfully silly. I understand it, of course. But it's still silly. My father thinks so too, and he ought to know. He's traveled abroad lots of times. A bull chased my father once—
        - id: ch04-b12
          speaker: narrator
          text: Night was coming on by the time they reached Miss Drew's house, and William was still talking. He felt drunk with success. To him, his idol's silence could only mean she was listening in complete admiration.
        - id: ch04-b13
          speaker: narrator
          text: William started through the gate with them, looking entirely sure that he was invited. Miss Drew shut it firmly in front of him.
        - id: ch04-b14
          speaker: miss_drew
          text: You need to go home now, William.
        - id: ch04-b15
          speaker: narrator
          text: William hesitated.
        - id: ch04-b16
          speaker: william
          text: I don't mind coming inside for a while. I'm not tired.
        - id: ch04-b17
          speaker: narrator
          text: But Miss Drew and her cousin were already halfway up the path. William turned toward home and met Ethel near his own gate.
        - id: ch04-b18
          speaker: ethel
          text: William, where have you been? I've looked everywhere for you. It's hours past your bedtime.
        - id: ch04-b19
          speaker: william
          text: I went walking with Miss Drew.
        - id: ch04-b20
          speaker: ethel
          text: You still should have come home at bedtime.
        - id: ch04-b21
          speaker: william
          text: I don't think she wanted me to leave. It wouldn't have been polite.
        - id: ch04-b22
          speaker: narrator
          text: William had discovered a new and serious part of life, and it had its drawbacks. In the old days, he had found all sorts of small entertainments to help the hours of instruction go by. Even with all his devotion to Miss Drew, he missed those careless, lively days. Still, he stayed in the front row and held firmly to his new part as the earnest student.
        - id: ch04-b23
          speaker: narrator
          text: Doing his homework properly was also cutting into his time after school. For the moment, though, he embraced his chains. Up on the platform, Miss Drew found his concentrated, soulful stare embarrassing. His questions were worse.
        - id: ch04-b24
          speaker: narrator
          text: As William left school one day, he heard her speaking to another teacher.
        - id: ch04-b25
          speaker: miss_drew
          text: I'm very fond of syringa. I'd love to have some.
        - id: ch04-b26
          speaker: narrator
          text: William made his decision at once. He would bring her syringa by the handful. He would bring armfuls of it.
    - id: ch05
      title: The Search for Syringa
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: William went straight home and found the gardener.
        - id: ch05-b02
          speaker: gardener
          text: No, we haven't got any syringa. Kindly step off my rose bed, Master William. There isn't any syringa anywhere in this garden. I couldn't tell you why. And please leave my hose alone, Master William.
        - id: ch05-b03
          speaker: william
          text: Huh!
        - id: ch05-b04
          speaker: narrator
          text: William turned away in scorn and searched the grounds for himself. The gardener was right. Guelder roses grew everywhere, but there was no syringa. William climbed the fence and inspected the next garden. More guelder roses, and still no syringa. There must be something peculiar about the soil.
        - id: ch05-b05
          speaker: narrator
          text: He walked down the road, checking each garden he passed. Every one had guelder roses. Not one had syringa. Then he stopped. In the window of a small house near the bottom of the road, a vase stood on a table. It was full of syringa.
        - id: ch05-b06
          speaker: narrator
          text: William did not know who lived there. He went carefully into the garden. No one was around. He peered into the room and found it empty. The bottom of the window stood open.
        - id: ch05-b07
          speaker: narrator
          text: He climbed in, scraping several coats of white paint from the sill as he went. Nothing was going to stop him from getting that syringa. He lifted the flowers from the vase, dripping wet, and turned to leave.
        - id: ch05-b08
          speaker: narrator
          text: At that moment the door opened, and a large woman filled the doorway. The scream she gave at the sight of William made his blood run cold. She rushed toward the window, cutting off the way he'd entered. William dodged around the table in self-defense, shot through the room's doorway, and blindly fled through the open back door. The woman did not chase him. She leaned far out of the window and screamed into the street.
        - id: ch05-b09
          speaker: homeowner
          text: Police! Help! Murder! Robbers!
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: Her harsh cries rang through the quiet street. Cold shivers ran up and down William's back. He was trapped in a little rear garden, and he could not see any way out. The screams grew louder.
        - id: ch05-b11
          speaker: homeowner
          text: Help! Help! Help!
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: Then William heard the front door open and men's voices call out from inside.
        - id: ch05-b13
          speaker: policeman
          text: Hello? Who's there? What happened?
        - id: ch05-b14
          speaker: narrator
          text: William looked wildly around him. A henhouse stood in one corner. He tore its door open and plunged inside through a storm of flapping feathers and furious hens. In the dark, he crouched in a corner, still gripping his bunch of syringa.
        - id: ch05-b15
          speaker: narrator
          text: At first he heard voices far away. Soon they drew closer, and the woman's voice rose above them.
        - id: ch05-b16
          speaker: homeowner
          text: He was a rather small man, but his face was terribly evil. I only saw him for a moment as he rushed past me. I'm certain he would have murdered me if I hadn't called for help. What a coward, attacking a poor defenseless woman! He was beside the silver table. I interrupted him right in the middle of his crime. I'm so upset. I won't sleep for nights. I'll keep seeing that evil, murderous face. And I was completely unarmed!
          emotion: fearful
        - id: ch05-b17
          speaker: policeman
          text: Can you describe him any more clearly, ma'am? Would you know him if you saw him again?
        - id: ch05-b18
          speaker: homeowner
          text: I'd know him anywhere! Such a criminal face. You can't imagine how shaken I am. I might be lying dead this very minute if I hadn't been brave enough to scream.
          emotion: fearful
        - id: ch05-b19
          speaker: policeman
          text: We're measuring the footprints, ma'am. You say he escaped through the front door?
        - id: ch05-b20
          speaker: homeowner
          text: I'm certain of it. I'm certain he's hiding in those bushes near the gate. That low, wicked face! My nerves are completely shattered.
          emotion: fearful
        - id: ch05-b21
          speaker: policeman
          text: We'll look through the bushes once more, ma'am, but I expect he's gotten away by now.
        - id: ch05-b22
          speaker: homeowner
          text: The brute! Oh, the brute! And that face! If I hadn't been brave enough to cry out—
          emotion: angry
        - id: ch05-b23
          speaker: narrator
          text: The voices faded into the distance, leaving William alone in the corner of the henhouse. A white hen appeared in the little doorway. It stared in at the intruder, squawked furiously at him, then backed into the garden again, cackling its outrage to the other hens nearby.
        - id: ch05-b24
          speaker: narrator
          text: William pictured a lifetime in prison. He pictured hanging. On the whole, he would rather be executed. He hoped they would execute him.
        - id: ch05-b25
          speaker: narrator
          text: He heard the woman say goodbye to the policeman. A little later she came into the back garden with a friend and began the whole story again.
        - id: ch05-b26
          speaker: homeowner
          text: And then he rushed right past me, dear. He was quite a small man, but he had such an evil face.
        - id: ch05-b27
          speaker: narrator
          text: A black hen appeared in the doorway. It gave William one angry squawk, then went back outside.
        - id: ch05-b28
          speaker: friend
          text: I think you were wonderful, dear. Imagine having that much courage.
        - id: ch05-b29
          speaker: narrator
          text: The white hen let out a harsh, mocking cry.
        - id: ch05-b30
          speaker: friend
          text: You should come inside and rest, darling.
        - id: ch05-b31
          speaker: homeowner
          text: Yes, I should. I feel so... shaken.
        - id: ch05-b32
          speaker: narrator
          text: Their voices stopped. A door closed, and everything became still.
        - id: ch05-b33
          speaker: narrator
          text: Very slowly and carefully, a badly rumpled William crept out of the dark henhouse. He moved around the side of the building and found the side gate locked. After climbing over it, he glided as quietly as he could toward the front gate. From there he reached the road at last.
        - id: ch05-b34
          speaker: mrs_brown
          text: Where is William this evening? I hope he doesn't stay out past bedtime.
        - id: ch05-b35
          speaker: ethel
          text: I just saw him. He was going up to his room, covered in chicken feathers and carrying a bunch of syringa.
        - id: ch05-b36
          speaker: father
          text: Mad. Mad, mad, mad.
    - id: ch06
      title: The Fall of the Idol
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The next morning William placed the bunch of syringa on Miss Drew's desk. He made his offering with quiet, manly pride. Miss Drew drew back from it.
        - id: ch06-b02
          speaker: miss_drew
          text: Not syringa, William. I absolutely cannot stand the smell!
          emotion: disgusted
        - id: ch06-b03
          speaker: narrator
          text: For several moments, William could only stare at her in astonishment.
        - id: ch06-b04
          speaker: william
          text: But you said... you said... You said you liked syringa and wanted some.
          emotion: surprised
        - id: ch06-b05
          speaker: miss_drew
          text: Did I say syringa? I meant guelder roses.
        - id: ch06-b06
          speaker: narrator
          text: William looked at her with cold contempt. Then he slowly returned to his old seat at the back of the classroom.
        - id: ch06-b07
          speaker: narrator
          text: That evening he built a bonfire with several favorite friends and played Red Indians in the garden. Going back to his old life had a certain thrill.
        - id: ch06-b08
          speaker: father
          text: Hello there. I thought you did homework now.
        - id: ch06-b09
          speaker: narrator
          text: Mr. Brown had found William crawling on all fours through the bushes. William stood upright.
        - id: ch06-b10
          speaker: william
          text: I'm not going to bother much with it anymore. Miss Drew can't say what she means. She doesn't even know what she means.
        - id: ch06-b11
          speaker: father
          text: That's always the trouble with women.
        - id: ch06-b12
          speaker: narrator
          text: Mrs. Brown came toward them.
        - id: ch06-b13
          speaker: father
          text: William says his idol has feet of clay.
        - id: ch06-b14
          speaker: william
          text: I don't know that her feet are made of clay. I'm only saying she can't talk straight. I went to all that trouble, and she doesn't know what she means. Her feet look all right. She walks all right. Besides, when people make false feet, they make them out of wood, not clay.
