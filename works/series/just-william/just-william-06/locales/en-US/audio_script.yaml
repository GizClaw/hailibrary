  chapters:
    - id: ch01
      title: Nothing to Do
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It had rained all morning, and William was thoroughly bored with his family. For the tenth time, he demanded an answer from his father.
        - id: ch01-b02
          speaker: william
          text: What is there for me to do?
        - id: ch01-b03
          speaker: narrator
          text: His father answered fiercely from behind the newspaper.
        - id: ch01-b04
          speaker: father
          text: Nothing!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: William followed his mother into the kitchen and tried again, this time in a miserable voice.
        - id: ch01-b06
          speaker: william
          text: What can I do, then?
        - id: ch01-b07
          speaker: mrs_brown
          text: Couldn't you sit quietly for a while?
        - id: ch01-b08
          speaker: william
          text: But that isn't doing anything. I could sit quiet all day if I felt like it.
        - id: ch01-b09
          speaker: mrs_brown
          text: You never do, though.
        - id: ch01-b10
          speaker: william
          text: No, because what would be the point?
        - id: ch01-b11
          speaker: mrs_brown
          text: Why don't you read, or draw, or find something like that?
        - id: ch01-b12
          speaker: william
          text: That's lessons. Lessons don't count as doing something.
        - id: ch01-b13
          speaker: mrs_brown
          text: I could show you how to knit.
        - id: ch01-b14
          speaker: narrator
          text: William gave her one crushing look and left. In the drawing room, his sister Ethel was knitting a jumper while she talked with a friend.
        - id: ch01-b15
          speaker: ethel
          text: And then I heard her tell him—
        - id: ch01-b16
          speaker: narrator
          text: Ethel stopped as William entered. She sighed like a patient martyr. William sat down and glared at her, and she traded a long-suffering look with her friend.
        - id: ch01-b17
          speaker: ethels_friend
          text: And what are you doing, William?
        - id: ch01-b18
          speaker: william
          text: Nothing.
        - id: ch01-b19
          speaker: ethel
          text: When you leave, William, would you please shut the door?
        - id: ch01-b20
          speaker: narrator
          text: She sounded just as sweet as her friend. William rose with dignity. At the door, he turned back.
        - id: ch01-b21
          speaker: william
          text: Well, I won't stay now. Not even if... not even if... not even if you wanted me to.
        - id: ch01-b22
          speaker: narrator
          text: He shut the door and allowed himself a grim little smile.
        - id: ch01-b23
          speaker: william
          text: I bet they feel pretty small now.
        - id: ch01-b24
          speaker: narrator
          text: He said this to the umbrella stand. Then he went to the library. His seventeen-year-old brother, Robert, was showing a new rifle to a friend.
        - id: ch01-b25
          speaker: robert
          text: See, what you do is— Oh, get out!
        - id: ch01-b26
          speaker: narrator
          text: Robert had spotted William's face at the door. William got out. By the time he returned to his mother, he had an even gloomier opinion of life. Rain still streamed down outside while Mrs. Brown checked the tradesmen's account books.
        - id: ch01-b27
          speaker: william
          text: Can I go outside?
        - id: ch01-b28
          speaker: mrs_brown
          text: Of course not. It's pouring.
        - id: ch01-b29
          speaker: william
          text: Rain doesn't bother me.
        - id: ch01-b30
          speaker: mrs_brown
          text: Don't be ridiculous.
        - id: ch01-b31
          speaker: narrator
          text: William felt that hardly any boy in the world could have parents as unsympathetic as his.
        - id: ch01-b32
          speaker: william
          text: How come Ethel and Robert have friends here and I don't?
        - id: ch01-b33
          speaker: mrs_brown
          text: Perhaps because you never asked anyone.
        - id: ch01-b34
          speaker: william
          text: Can I ask somebody now?
        - id: ch01-b35
          speaker: mrs_brown
          text: No, it's too late.
        - id: ch01-b36
          speaker: narrator
          text: She looked back at the butcher's book and murmured, “Ten shillings and elevenpence.”
        - id: ch01-b37
          speaker: william
          text: So when can I have someone over?
        - id: ch01-b38
          speaker: narrator
          text: Mrs. Brown lifted a harassed face from the figures.
        - id: ch01-b39
          speaker: mrs_brown
          text: William, please be quiet. You may ask someone any time. Eighteen shillings and twopence.
        - id: ch01-b40
          speaker: william
          text: Can I have a lot of people?
        - id: ch01-b41
          speaker: mrs_brown
          text: Oh, go ask your father.
        - id: ch01-b42
          speaker: narrator
          text: William returned to the dining room. His father still had the paper, and the sigh that greeted William was certainly not one of relief.
        - id: ch01-b43
          speaker: father
          text: If you're here to ask more questions—
        - id: ch01-b44
          speaker: william
          text: I'm not. Father, everyone will be out on Saturday. Can I have a party then?
        - id: ch01-b45
          speaker: father
          text: No, of course not. Can't you find something to do?
        - id: ch01-b46
          speaker: narrator
          text: That drove William past endurance. Words poured out of him.
        - id: ch01-b47
          speaker: william
          text: Everything I want to do, you tell me not to do. And everything I don't want to do, you tell me to do. Mother told me to knit. Knit!
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: No words could describe his fury and scorn. His father glanced through the window.
        - id: ch01-b49
          speaker: father
          text: Thank heaven, the rain has stopped. Go outside!
        - id: ch01-b50
          speaker: narrator
          text: Outside, William found plenty worth doing. He marched through road puddles, which any boy knows is deeply satisfying. He shook wet hedges until they showered him. The ditch was full, so he tested how many times he could jump it without falling in. Most times, he fell in. Then he scraped his boots through the mud. His spirits climbed, but the party stayed in his mind. He suddenly wanted one very badly, and he wanted it Saturday, when his family would spend the day with an aunt. Aunts hardly ever included William in their invitations.
        - id: ch01-b51
          speaker: narrator
          text: He came home wet, filthy, and cheerful, then approached his father carefully.
        - id: ch01-b52
          speaker: william
          text: Father, did you say I could have that party?
        - id: ch01-b53
          speaker: father
          text: No, I did not.
        - id: ch01-b54
          speaker: narrator
          text: For the moment, William let the subject drop.
    - id: ch02
      title: Two Negatives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: During English grammar the next morning, William spent most of the class thinking about his party. Having one without his parents, his older brother, or his sister sounded excellent. He could invite George, Ginger, Henry, Douglas, and plenty more. In fact, he wanted the entire class. All thirty of them.
        - id: ch02-b02
          speaker: miss_jones
          text: William, what did I just say?
        - id: ch02-b03
          speaker: narrator
          text: William sighed. Schoolmistresses were always asking that foolish question. Surely they knew what they had just said better than anyone. William never knew, so why did they keep asking him? His face stayed blank. Then a faint memory came to him.
        - id: ch02-b04
          speaker: william
          text: Was it something about participles?
        - id: ch02-b05
          speaker: narrator
          text: He did remember participles, though perhaps they had not come up today. Miss Jones groaned.
        - id: ch02-b06
          speaker: miss_jones
          text: That was ages ago, William. You haven't listened at all. Henry, tell him.
        - id: ch02-b07
          speaker: narrator
          text: Henry stopped trying to push a fly into his inkwell with the tip of his pen and answered without thinking.
        - id: ch02-b08
          speaker: henry
          text: Two negatives make an affirmative.
        - id: ch02-b09
          speaker: miss_jones
          text: Yes. Now you say it, William.
        - id: ch02-b10
          speaker: narrator
          text: William repeated the rule without showing much interest.
        - id: ch02-b11
          speaker: miss_jones
          text: Good. And what is a negative?
        - id: ch02-b12
          speaker: narrator
          text: William sighed once more, but tried to be helpful.
        - id: ch02-b13
          speaker: william
          text: Is it something to do with photographs?
        - id: ch02-b14
          speaker: miss_jones
          text: No!
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: The heat was wearing on Miss Jones, and William was wearing on her even more.
        - id: ch02-b16
          speaker: miss_jones
          text: “No” and “not” are negatives. An affirmative means “yes.”
        - id: ch02-b17
          speaker: william
          text: Oh.
        - id: ch02-b18
          speaker: miss_jones
          text: Put two negatives in the same sentence, and they mean yes. If you say, “There isn't no money in the box,” you're saying there is money.
        - id: ch02-b19
          speaker: narrator
          text: William thought this over.
        - id: ch02-b20
          speaker: william
          text: Oh.
        - id: ch02-b21
          speaker: narrator
          text: Then, all at once, he looked intelligent.
        - id: ch02-b22
          speaker: william
          text: So if somebody says “no” and “not” in one sentence, that really means “yes”?
        - id: ch02-b23
          speaker: miss_jones
          text: Certainly.
        - id: ch02-b24
          speaker: narrator
          text: William smiled, which was a rare sight.
        - id: ch02-b25
          speaker: william
          text: Thank you.
        - id: ch02-b26
          speaker: narrator
          text: Miss Jones was quite touched.
        - id: ch02-b27
          speaker: miss_jones
          text: You're welcome, William. I'm glad you're finally interested in your schoolwork.
        - id: ch02-b28
          speaker: narrator
          text: But William was quietly repeating two sentences to himself.
        - id: ch02-b29
          speaker: william
          text: “No, of course not,” and “No, I did not.” A no and a not mean yes. So Father really said, “Yes, of course,” and “Yes, I did.”
        - id: ch02-b30
          speaker: narrator
          text: He waited until Friday before handing out his invitations. He made them sound perfectly casual.
        - id: ch02-b31
          speaker: william
          text: My family will be out tomorrow, and they said I could have a few friends for tea. Can you come? Tell your mother they said you should just come along. She doesn't need to write.
        - id: ch02-b32
          speaker: narrator
          text: William was a born strategist. None of his friends' parents suspected the truth. Once or twice his conscience, that curious little organ, tried to trouble him. William answered it firmly.
        - id: ch02-b33
          speaker: william
          text: He did say I could. He said, “Yes, of course.” Then he said, “Yes, I did.”
        - id: ch02-b34
          speaker: narrator
          text: William invited everyone. If you were going to have a party, he reasoned, it might as well be a large one. He promised, in mysterious hints, that there would be no limit to the fun. Every boy accepted.
        - id: ch02-b35
          speaker: narrator
          text: On Saturday morning, Mrs. Brown said goodbye to him anxiously.
        - id: ch02-b36
          speaker: mrs_brown
          text: You really don't mind staying behind, darling?
        - id: ch02-b37
          speaker: william
          text: No, Mother.
        - id: ch02-b38
          speaker: narrator
          text: That answer was perfectly true.
        - id: ch02-b39
          speaker: mrs_brown
          text: And you won't do anything we've forbidden, will you?
        - id: ch02-b40
          speaker: william
          text: No, Mother. I'll only do things you've said yes to.
        - id: ch02-b41
          speaker: narrator
          text: Cook and Jane had been looking forward to this day for a long time. The house would need very little work. As for William, they could only hope for the best.
        - id: ch02-b42
          speaker: narrator
          text: William stayed out all morning. At lunch he was so quiet and polite that it seemed ominous. Jane decided she could safely go to the movies with her young man. Cook did not mind being left alone. “That Master William” had gone out, and she saw no sign that he would be back before teatime. So Jane went to the movies.
    - id: ch03
      title: Storming the Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At about three, the postman brought the letters. Cook went to the door, then froze there, staring down the road.
        - id: ch03-b02
          speaker: narrator
          text: William had gathered up his guests along the way and was leading them happily home. They had left their own houses clean, stiffly starched, and perfectly proper. Under William's kindly influence, they had become a wild and cheerful crowd. They had picked up sticks, stones, and old cans from the ditches. William's manner told them that this would be no ordinary party. He marched in front, blowing a trumpet.
        - id: ch03-b03
          speaker: narrator
          text: They poured through the garden gate. Cook watched them, pale and speechless. Then she found her voice.
        - id: ch03-b04
          speaker: cook
          text: You are not coming into this house! Why have you dragged all those boys in here to clutter up the garden?
          emotion: angry
        - id: ch03-b05
          speaker: william
          text: They're here for tea.
        - id: ch03-b06
          speaker: narrator
          text: Cook went even paler.
        - id: ch03-b07
          speaker: cook
          text: Oh, no, they're not! Just wait until your father hears about this—
          emotion: angry
        - id: ch03-b08
          speaker: william
          text: Father said they could come. I asked him and he said, “Yes, of course.” Then I asked if he'd really said it, and he said, “Yes, I did.” That's what English grammar makes it mean. Miss Jones said so.
        - id: ch03-b09
          speaker: narrator
          text: Cook slammed the door in his face and locked it. The thirty guests were taken aback, but only for a moment.
        - id: ch03-b10
          speaker: william
          text: Come on! She's the enemy. We'll storm her old castle!
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: The boys brightened at once. This sounded much better than an ordinary party. They swarmed around the back of the house. The enemy had bolted that door too and was fastening every window. Purple with fury, Cook shook her fist through the drawing-room window. William waved his stick, blew his trumpet, and answered her challenge.
        - id: ch03-b12
          speaker: narrator
          text: His army armed itself with anything it could find. That included the raspberry canes William's father had spent an entire day setting out with great care. William decided to reach the balcony outside Ethel's open bedroom window, helped upward by his loyal band. War whoops filled the air. The boys covered the front garden and crushed every rose bed underfoot while they cheered their general up the wall. William climbed with the trumpet held between his lips.
        - id: ch03-b13
          speaker: narrator
          text: Cook appeared at the bedroom window and slammed it shut. Startled, William dropped back among his followers. A rough roar of anger rose from the whole crowd.
        - id: ch03-b14
          speaker: william
          text: You mean old cat!
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: Now the army wanted battle. Thirty soldiers could hardly let one enemy defeat them. Every door and window was locked, so only one choice remained. Their general prepared to take it while his followers shouted him on.
        - id: ch03-b16
          speakers: [party_guest_1, party_guest_2, party_guest_3, party_guest_4]
          ensemble: chorus
          text: Go on, William! Get her! Yee-oo-oo!
        - id: ch03-b17
          speaker: narrator
          text: William hurled a stone through the drawing-room window. It landed on a small table and scattered Mrs. Brown's treasured silver in every direction.
        - id: ch03-b18
          speaker: narrator
          text: A born general could not worry about such minor damage in wartime. William widened the hole and helped his brave army through. Only a few boys were cut or scratched. Mad with the excitement of battle, they left behind the ruined rosebushes and trampled lawn, then squeezed through the broken window at considerable risk to arms and legs.
        - id: ch03-b19
          speaker: narrator
          text: Cook was trying to shut the little coal-cellar window. William trapped her inside, turned the key, and gave a great yell of victory.
    - id: ch04
      title: A Perfect Party
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With the enemy safely imprisoned, the party began. It was everything the guests had hoped for. This party was like no other party they had ever attended.
        - id: ch04-b02
          speaker: narrator
          text: Usually, Hide-and-Seek came with smiling but determined mothers, aunts, and sisters posted everywhere. They spoiled the fun by calling, “Stay out of the bedrooms, dear,” or “Watch the umbrella stand,” or “Certainly not in the drawing room,” or “Please don't shout so loudly.” But this was Hide-and-Seek as it ought to be. The boys charged upstairs and down, raced through every bedroom, slid along the banisters, and swept in and out of the drawing room. Behind them came muddy footprints and broken ornaments.
        - id: ch04-b03
          speaker: narrator
          text: Ginger discovered a magnificent hiding place in Robert's bed. His boots stamped several perfect muddy prints across it. Henry crouched inside Ethel's wardrobe, on top of her satin evening shoes and among her evening dresses. George slammed the drawing-room door so hard that its handle came away in his hand. Douglas got tangled in the dining-room curtain. The curtain gave way as he struggled, bringing an old china bowl down from the sideboard with it.
        - id: ch04-b04
          speaker: narrator
          text: None of them had imagined a party like this. It was pure happiness. Boys ran back and forth through the house, shouting and yelling. Underneath all that noise came the deep, muffled sound of Cook's fury. She shouted terrible curses and flung lumps of coal at the door. Cook was Irish, and she longed to get back into the fight.
        - id: ch04-b05
          speaker: narrator
          text: William was the first to notice that teatime had arrived without any tea. He felt rather cheated until he remembered the pantry. At once, he cheered up.
        - id: ch04-b06
          speaker: william
          text: Come on! Everybody grab whatever you can find!
        - id: ch04-b07
          speaker: narrator
          text: They rushed in, panting, laughing, and shouting, and each boy took whatever he could find. Ginger claimed what remained of a cold ham and stripped the bone clean. George drank an entire jar of cream with great enjoyment. William and Douglas shared a gooseberry pie, while Henry ate a whole currant cake by himself.
        - id: ch04-b08
          speaker: narrator
          text: Everyone foraged on his own. Between them, the boys finished two bowls of cold vegetables, a joint of cold beef, two jars of honey, three dozen oranges, three loaves of bread, and two pots of dripping. They even tried lard, onions, and raw sausages. When they left, the pantry was a wide, empty space.
        - id: ch04-b09
          speaker: narrator
          text: All the while, Cook's voice rose from below. Breathing coal dust and roaring curses had made her hoarser and hoarser. The coal-cellar door kept shaking and rattling.
        - id: ch04-b10
          speaker: narrator
          text: Then one boy returned from the drawing-room window with urgent news.
        - id: ch04-b11
          speaker: party_guest_1
          text: She's coming back!
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: Everyone crowded around the window. At the side gate, Jane was saying an affectionate goodbye to her young man.
        - id: ch04-b13
          speaker: william
          text: Don't let her get inside! Come on!
        - id: ch04-b14
          speaker: narrator
          text: Jane turned through the gate with a smile on her face, lost in happy memories. She was not prepared for a rain of missiles from the upstairs windows. A lump of lard struck her ear and knocked her hat sideways. She hurried back to the gate.
        - id: ch04-b15
          speaker: william
          text: Keep going! Drive her out into the road!
        - id: ch04-b16
          speaker: narrator
          text: Onions flew after Jane. So did the ham bone and several potatoes. She retreated all the way into the road, and the boys filled the air with victorious shouts.
    - id: ch05
      title: The Grammar Problem
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then every shout stopped. William's smile disappeared. His hand, raised to throw another onion, fell to his side. A cab was turning through the front gate.
        - id: ch05-b02
          speaker: narrator
          text: Silence dropped over the party. From the coal cellar, Cook's hoarse demands for revenge suddenly sounded twice as loud. William went pale.
        - id: ch05-b03
          speaker: narrator
          text: His family was inside the cab.
        - id: ch05-b04
          speaker: narrator
          text: Two hours later, a young girl who was friends with William came by with a note for his mother. She looked up and saw William's untidy head at his bedroom window.
        - id: ch05-b05
          speaker: young_girl
          text: William, come play with me!
        - id: ch05-b06
          speaker: william
          text: I can't. I'm going to bed.
        - id: ch05-b07
          speaker: young_girl
          text: Why? Are you sick?
        - id: ch05-b08
          speaker: william
          text: No.
        - id: ch05-b09
          speaker: young_girl
          text: Then why do you have to go to bed?
        - id: ch05-b10
          speaker: narrator
          text: William leaned farther out of the window.
        - id: ch05-b11
          speaker: william
          text: I'm going to bed because my father doesn't understand English grammar. That's why!
