audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 文雅矜持，不耐烦时反而格外甜
        timbre: 清亮的年轻女声
        pace: 中速
        pitch: 中高音
    ethels_friend:
      display_name: 埃塞尔的朋友
      tts:
        delivery: 客气含笑，故意逗弄时语气甜美
        timbre: 轻柔的年轻女声
        pace: 中速
        pitch: 高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负急躁，对弟弟毫不客气
        timbre: 平滑的青年男声
        pace: 中速偏快
        pitch: 中音
    miss_jones:
      display_name: 琼斯小姐
      tts:
        delivery: 字句精确，克制着被学生耗尽的耐心
        timbre: 清晰利落的成年女声
        pace: 中速
        pitch: 中音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    douglas:
      display_name: 道格拉斯
      tts:
        delivery: 热心随和，偶尔故作老成
        timbre: 清亮的男孩声
        pace: 中速
        pitch: 中高音
    cook:
      display_name: 厨娘
      tts:
        delivery: 火气十足，发怒时毫不退让
        timbre: 洪亮结实的成年女声
        pace: 偏快
        pitch: 中低音
    party_guest_1:
      display_name: 小客人甲
      tts:
        delivery: 兴奋大胆，一开口就带着起哄劲儿
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 高音
    party_guest_2:
      display_name: 小客人乙
      tts:
        delivery: 淘气爽快，爱跟着伙伴高声呐喊
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    party_guest_3:
      display_name: 小客人丙
      tts:
        delivery: 精力旺盛，遇到热闹便格外来劲
        timbre: 轻快的男孩声
        pace: 中速偏快
        pitch: 高音
    party_guest_4:
      display_name: 小客人丁
      tts:
        delivery: 喧闹快活，欢呼时毫不收敛
        timbre: 清亮的男孩声
        pace: 偏快
        pitch: 中高音
    young_girl:
      display_name: 小姑娘
      tts:
        delivery: 友好热切，有疑问便直截了当地追问
        timbre: 轻柔的女孩声
        pace: 中速偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 无事可做
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雨下了整整一上午。威廉闷得要命，连家里人也叫他烦透了。他第十次跑去追问父亲。
        - id: ch01-b02
          speaker: william
          text: 我到底能干点什么？
        - id: ch01-b03
          speaker: narrator
          text: 布朗先生躲在报纸后面，没好气地给了他一个答案。
        - id: ch01-b04
          speaker: father
          text: 你什么也别干！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 威廉又跟着母亲进了厨房，这回声音听上去十分可怜。
        - id: ch01-b06
          speaker: william
          text: 那我能找点什么事做？
        - id: ch01-b07
          speaker: mother
          text: 你安安静静坐一会儿，不好吗？
        - id: ch01-b08
          speaker: william
          text: 光坐着哪算做事？我要真想坐，坐上一整天都没问题。
        - id: ch01-b09
          speaker: mother
          text: 可你从来没有安静地坐过。
        - id: ch01-b10
          speaker: william
          text: 那是因为坐着没意思，我干吗要坐？
        - id: ch01-b11
          speaker: mother
          text: 你可以看看书，画点画，随便找件这样的事呀。
        - id: ch01-b12
          speaker: william
          text: 那些全是功课，根本不算做事！
        - id: ch01-b13
          speaker: mother
          text: 你要是愿意，我可以教你织毛衣。
        - id: ch01-b14
          speaker: narrator
          text: 威廉用一道沉重的目光回绝了她，转身走进客厅。姐姐埃塞尔正在织套头衫，还跟一位朋友聊得起劲。
        - id: ch01-b15
          speaker: ethel
          text: 后来，我亲耳听见她对他说了那句话……
        - id: ch01-b16
          speaker: narrator
          text: 威廉一露面，埃塞尔立刻收住话头，像个苦苦忍耐的人那样叹了口气。威廉坐下瞪着她。她只好和朋友交换了一个忍无可忍的眼神。
        - id: ch01-b17
          speaker: ethels_friend
          text: 威廉，你这会儿在忙什么呀？
        - id: ch01-b18
          speaker: william
          text: 我什么也没忙。
        - id: ch01-b19
          speaker: ethel
          text: 威廉，你待会儿出去时，劳驾把门关上。
        - id: ch01-b20
          speaker: narrator
          text: 她的声音跟朋友一样甜。威廉觉得自己受了侮辱，庄严地起身走向门口，又回头慢慢开了口。
        - id: ch01-b21
          speaker: william
          text: 我现在不稀罕待在这儿。就算……就算……就算你们求我留下，我也不留！
        - id: ch01-b22
          speaker: narrator
          text: 他关上门，脸上浮出一丝冷笑，然后郑重其事地对伞架说了一句话。
        - id: ch01-b23
          speaker: william
          text: 我敢打赌，她们现在肯定觉得特别没脸！
        - id: ch01-b24
          speaker: narrator
          text: 接着，他去了书房。十七岁的罗伯特正向朋友显摆一支新步枪。
        - id: ch01-b25
          speaker: robert
          text: 你瞧，这里应该……威廉，你快出去！
        - id: ch01-b26
          speaker: narrator
          text: 罗伯特从门边看见了威廉的脸。威廉只得出去，再次回到母亲身边。这时，他对人生的看法比先前更阴沉了。外面仍在下雨，布朗太太正在查商店的账本。
        - id: ch01-b27
          speaker: william
          text: 我可以到外面去吗？
        - id: ch01-b28
          speaker: mother
          text: 当然不行，雨下得这么大。
        - id: ch01-b29
          speaker: william
          text: 我一点也不怕淋雨。
        - id: ch01-b30
          speaker: mother
          text: 你别胡闹了。
        - id: ch01-b31
          speaker: narrator
          text: 威廉认定，世上再没有几个男孩，会被这么不体谅人的父母处处拖累。
        - id: ch01-b32
          speaker: william
          text: 为什么他们都能请朋友来，我却一个也不能请？
        - id: ch01-b33
          speaker: mother
          text: 大概是你自己从没想到要请人吧。
        - id: ch01-b34
          speaker: william
          text: 那我现在请一个人来，行吗？
        - id: ch01-b35
          speaker: mother
          text: 现在太晚了，不行。肉铺这笔是十先令十一便士。
        - id: ch01-b36
          speaker: william
          text: 那我到底什么时候可以请？
        - id: ch01-b37
          speaker: narrator
          text: 布朗太太疲惫地抬起脸，耐心快要耗尽了。
        - id: ch01-b38
          speaker: mother
          text: 威廉，你先安静一会儿。只要问过我们，什么时候都可以。下一笔是十八先令两便士。
        - id: ch01-b39
          speaker: william
          text: 那我能请很多人来吗？
        - id: ch01-b40
          speaker: mother
          text: 这个问题你去问父亲吧。
        - id: ch01-b41
          speaker: narrator
          text: 威廉回到餐厅。父亲还在看报，见他进来便叹了口气。这一声可绝不是因为松了口气。
        - id: ch01-b42
          speaker: father
          text: 你要是又想来问问题，我可要不客气了。
        - id: ch01-b43
          speaker: william
          text: 我不是来问问题的。爸爸，星期六你们都出门时，我能在家开个聚会吗？
        - id: ch01-b44
          speaker: father
          text: 当然不能。你就不能自己找点事情做吗？
        - id: ch01-b45
          speaker: narrator
          text: 这下威廉彻底被逼急了，满肚子的委屈一股脑儿冲了出来。
        - id: ch01-b46
          speaker: william
          text: 我爱干的事，你们一样也不许。我不爱干的事，你们倒全叫我干。妈妈甚至叫我织毛衣！
          emotion: angry
        - id: ch01-b47
          speaker: narrator
          text: 那份鄙夷和怒火，简直没法形容。布朗先生望向窗外，发现雨终于停了。
        - id: ch01-b48
          speaker: father
          text: 谢天谢地，雨停了。你赶快出去！
        - id: ch01-b49
          speaker: narrator
          text: 威廉总算来到屋外。路上的水洼可以踩，每个男孩都知道，穿过水洼的感觉痛快极了。树篱一摇，就会给摇树的人送上一场淋浴，那滋味也很好。沟里的水涨满了，正适合试试自己能往返跳过几次才会掉进去。虽说多数时候都会掉下去，可那照样有趣。靴子踩进泥里，再一路刮着泥往前走，也让人舍不得停下。威廉玩得越来越高兴，心里却始终甩不掉聚会。他突然非常想办一场，而且非得在星期六办。那天全家要到姨妈家待上一整天，而姨妈请客时向来不大记得把威廉也算进去。
        - id: ch01-b50
          speaker: narrator
          text: 回家时，他又湿又脏，心情倒很好。他试探着靠近父亲，装作随口一问。
        - id: ch01-b51
          speaker: william
          text: 爸爸，你刚才是不是答应我开聚会了？
        - id: ch01-b52
          speaker: father
          text: 不，我没有答应。
        - id: ch01-b53
          speaker: narrator
          text: 威廉暂时把这件事放下了。
    - id: ch02
      title: 两个否定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天上午的英语语法课，威廉大半时间都在盘算那场聚会。星期六没有父母，也没有成年的哥哥姐姐，这样的聚会实在大有可为。他想请乔治、姜吉、亨利、道格拉斯，还想请许多许多人。最后，他决定把所有人都请来。这里的“所有人”，指的是全班三十个人。
        - id: ch02-b02
          speaker: miss_jones
          text: 威廉，你说说我刚才讲了什么？
        - id: ch02-b03
          speaker: narrator
          text: 威廉叹了口气。老师明明最清楚自己刚说过什么，却总爱问他这种傻问题。他一向答不出来，只能茫然地猜上一回。
        - id: ch02-b04
          speaker: william
          text: 您刚才讲的是分词吗？
        - id: ch02-b05
          speaker: miss_jones
          text: 分词早就讲过去了，威廉。你压根儿没在听。
        - id: ch02-b06
          speaker: narrator
          text: 琼斯小姐呻吟一声。威廉清清嗓子，摆出尊严，不肯回答。她只好点了另一个学生。
        - id: ch02-b07
          speaker: miss_jones
          text: 亨利，你来告诉他正确答案。
        - id: ch02-b08
          speaker: narrator
          text: 亨利正忙着用笔尖把一只苍蝇推进墨水瓶。他停下这项迷人的工作，机械地答道。
        - id: ch02-b09
          speaker: henry
          text: 两个否定放在一起，就会变成肯定。
        - id: ch02-b10
          speaker: miss_jones
          text: 说得对。威廉，你把这句话重复一遍。
        - id: ch02-b11
          speaker: narrator
          text: 威廉照着说了，却一点兴趣也没有。琼斯小姐又问他什么叫否定，他只好再次猜测。
        - id: ch02-b12
          speaker: william
          text: 否定是不是照相底片之类的东西？
        - id: ch02-b13
          speaker: miss_jones
          text: 不是！“不”和“没有”才是否定，“是”就是肯定。
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: 天气本来就热，再加上威廉，琼斯小姐觉得这一堂课格外难熬，尤其叫她难熬的还是威廉本人。威廉倒客客气气地应了一声，表示自己听见了。
        - id: ch02-b15
          speaker: miss_jones
          text: 同一句话里有两个“不”或“没有”，意思就成了“是”。比如“盒子里不是没有钱”，就是说盒子里有钱。
        - id: ch02-b16
          speaker: narrator
          text: 威廉想了一会儿，又答应一声。忽然间，他整个人都聪明起来了。
        - id: ch02-b17
          speaker: william
          text: 那么，只要一句话里既有“不”又有“没有”，意思就会变成“是”，对吗？
        - id: ch02-b18
          speaker: miss_jones
          text: 对，当然是这样。
        - id: ch02-b19
          speaker: narrator
          text: 威廉笑了。他很少露出笑容，还向老师道了谢。琼斯小姐十分感动，以为这个学生终于肯用功了。
        - id: ch02-b20
          speaker: miss_jones
          text: 不用谢，威廉。你终于开始对功课感兴趣，我很高兴。
        - id: ch02-b21
          speaker: narrator
          text: 可威廉正在低声重算父亲说过的话。
        - id: ch02-b22
          speaker: william
          text: 他说过“不，当然不行”，还说“不，我没有答应”。两个否定就是肯定，所以他其实说的是“行，当然可以”，还有“是，我答应了”。
        - id: ch02-b23
          speaker: narrator
          text: 威廉等到星期五，才若无其事地向所有同学发出邀请。
        - id: ch02-b24
          speaker: william
          text: 我家里人明天都出去，他们让我请几个朋友来喝茶。你能来吗？你告诉妈妈，不用写信问，只管来就行。
        - id: ch02-b25
          speaker: narrator
          text: 他生来就是个战略家。朋友们的父母谁也没猜到真相。偶尔，他那个古怪的良心也会跑出来责备他，可他总能把它顶回去。
        - id: ch02-b26
          speaker: william
          text: 爸爸明明答应了。他说的是“可以，当然可以”，还说“是，我答应了”。
        - id: ch02-b27
          speaker: narrator
          text: 既然要开聚会，当然越大越好。威廉把所有同学都请了，还神神秘秘地暗示大家，这一回可以不受任何拘束，尽情玩乐。结果三十个人全都接受了邀请。
        - id: ch02-b28
          speaker: narrator
          text: 星期六早晨，布朗太太临走前还是放心不下。
        - id: ch02-b29
          speaker: mother
          text: 宝贝，把你一个人留在家里，你不会觉得难受吧？
        - id: ch02-b30
          speaker: william
          text: 我一点也不介意，妈妈。
        - id: ch02-b31
          speaker: mother
          text: 我们不许你做的事，你可不能偷偷去做。
        - id: ch02-b32
          speaker: william
          text: 我不会的。我只做你们已经说过“可以”的事。
        - id: ch02-b33
          speaker: narrator
          text: 这两句话，威廉说得都是真心话。厨娘和简也盼这一天盼了很久。家里几乎没什么活要做，至于威廉，她们也只能往好处想。威廉上午一直不见人影，午饭时却安静又客气，安静得反而叫人不安。简于是决定跟男朋友去看电影。厨娘见“那个威廉少爷”已经出门，以为他喝茶前都不会回来，便说自己一个人留下也不要紧。
        - id: ch02-b34
          speaker: narrator
          text: 三点左右，邮差来送信。厨娘打开门，朝大路一望，整个人顿时僵住了。
    - id: ch03
      title: 攻打城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 威廉一路召齐客人，正欢天喜地地把他们领回来。孩子们离开各自家门时还干干净净，衣服浆得笔挺，举止规规矩矩。可受了威廉一路和善的熏陶，如今个个闹得起劲，还从沟里捡来木棍、石头和旧罐头盒。他们从威廉对这场聚会的态度看出，这绝不是普通的茶会。一群人快活极了。威廉手持小号，走在队伍最前面。
        - id: ch03-b02
          speaker: narrator
          text: 大伙涌进花园门。厨娘脸色煞白，起初连话也说不出来，随后才凶狠地挡住他们。
        - id: ch03-b03
          speaker: cook
          text: 你们谁也别想进屋！威廉，你带这么多男孩子来挤满花园，到底想干什么？
          emotion: angry
        - id: ch03-b04
          speaker: william
          text: 他们都是来喝茶的。
        - id: ch03-b05
          speaker: cook
          text: 他们才不是来喝茶的！要是你父亲知道这件事，他绝不会饶你！
          emotion: angry
        - id: ch03-b06
          speaker: william
          text: 就是爸爸说他们可以来。我问他，他说“可以，当然可以”。我又问他是不是答应了，他说“是，我答应了”。这是英语语法，琼斯小姐教过的。
        - id: ch03-b07
          speaker: narrator
          text: 厨娘把门重重摔在他脸上，又锁得严严实实。三十个客人只愣了一小会儿，威廉便兴奋地发布命令。
        - id: ch03-b08
          speaker: william
          text: 大伙儿跟我来！她现在是敌人，咱们一起攻下她的老城堡！
        - id: ch03-b09
          speaker: narrator
          text: 孩子们一下来了精神。这可比平常的聚会强多了。他们蜂拥到屋后，发现后门已经闩上，所有窗户也正在一扇扇关紧。厨娘气得脸色发紫，隔着客厅窗户挥拳头。威廉挥动木棍，吹响小号，向她还击。孩子们也拿起各种武器，连布朗先生花了一整天安插好的覆盆子支杆都拔了出来。
        - id: ch03-b10
          speaker: narrator
          text: 埃塞尔的卧室窗还开着，外面有一座阳台。威廉决定让这支高贵的队伍托他爬上去。挑衅的战吼响彻四周。前花园挤满了孩子，玫瑰花圃被踩得一塌糊涂。大家高声喊着战号，为嘴里衔着小号、奋力往上爬的威廉助威。可敌人突然出现在窗口，一把关上窗户。威廉吓了一跳，跌回伙伴中间。三十个人顿时发出一阵嘶哑的怒吼。
        - id: ch03-b11
          speaker: william
          text: 这个卑鄙的老母猫！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 这支军队已经杀红了眼。足足三十个人，怎么能败给一个敌人？所有门窗都锁死了，如今只剩下一种办法。忠诚的士兵们用欢呼催促将军动手。
        - id: ch03-b13
          speakers: [party_guest_1, party_guest_2, party_guest_3, party_guest_4]
          ensemble: chorus
          text: 威廉，快动手！加把劲儿，咱们一起冲进去！
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: 威廉扔出一块石头，砸破了客厅窗户。石头落在小茶几上，布朗太太珍爱的银器顿时飞得到处都是。天生的将军不会把战争里这点小小损失放在眼里。他把破洞一点点弄大，再帮助英勇的伙伴们钻进去，整个过程只造成了少数割伤和擦伤。孩子们全都沉醉在战斗的刺激里，把满地折断的玫瑰和踩烂的草坪抛在身后，冒着折断手脚的危险挤过破窗。厨娘正要关上煤窖的小窗，威廉赶紧把她囚禁在里面，转动钥匙，发出一声胜利的高喊。
        - id: ch03-b15
          speaker: narrator
          text: 聚会终于开始，而且完全没有辜负大家的期待。这果然是一场和以往任何聚会都不一样的聚会。平常玩捉迷藏，总有母亲、姨妈和姐姐站在各处。她们脸上虽然带着笑，态度却很坚决，总说不许进卧室，要当心伞架，更不能进客厅，也不许大声叫。这一次却完美极了。楼上楼下全能跑，每间卧室都能躲，还能滑楼梯扶手，随便穿过客厅。孩子们走到哪儿，沾泥的靴印和破碎的摆设就跟到哪儿。
        - id: ch03-b16
          speaker: narrator
          text: 姜吉躲上罗伯特的床，靴底在床上印出好几个完整的泥印。亨利钻进埃塞尔的衣橱，蹲在晚礼服中间，踩着她的缎面晚宴鞋。乔治使劲摔门，竟把客厅的门把手摔了下来。道格拉斯缠进餐厅窗帘，拼命挣扎，最后窗帘连同餐具柜上的古瓷碗一起砸到他身上。
        - id: ch03-b17
          speaker: narrator
          text: 这样的聚会，他们连做梦也没有梦到过，简直是毫无杂质的快乐。男孩子们满屋奔跑、呼喊、尖叫，地下还不断传来厨娘愤怒的低吼。她吐出一句句可怕的诅咒，又拿煤块狠狠砸门。这位爱尔兰厨娘一心只想回到战场上，亲自加入这场混战。
    - id: ch04
      title: 聚会的结局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最先发现喝茶时间已经到了、屋里却没有茶的人，是威廉。他先觉得自己吃了亏，随后想起食品储藏室，立刻又有了精神。
        - id: ch04-b02
          speaker: william
          text: 大家快来，看到什么就拿什么，能吃多少就吃多少！
        - id: ch04-b03
          speaker: narrator
          text: 孩子们喘着气，笑着，叫着，全部涌进储藏室。姜吉抢到冷火腿，把骨头啃得干干净净。乔治喝掉一整罐奶油。威廉和道格拉斯合力吃完一只醋栗馅饼。亨利独自解决了整个黑醋栗蛋糕。其他人也各自寻找食物。
        - id: ch04-b04
          speaker: narrator
          text: 两碗冷蔬菜、一大块冷牛肉、两罐蜂蜜、三打橙子、三条面包和两罐油滴，全进了他们肚子。他们还拿猪油、洋葱和生香肠做了一番大胆尝试。等孩子们离开，储藏室已经空得像张大了嘴。厨娘仍在地下怒骂。她一面吸进煤灰，一面呼出诅咒，嗓子越来越沙哑，煤窖门却还在不停摇晃，砰砰直响。
        - id: ch04-b05
          speaker: narrator
          text: 一个守在客厅窗边的客人忽然跑回来报信。
        - id: ch04-b06
          speaker: party_guest_1
          text: 简已经回来了，我看见她走到侧门啦！
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: 众人一齐涌到窗口。简正站在侧门边，依依不舍地跟男朋友道别。
        - id: ch04-b08
          speaker: william
          text: 千万别让她进屋！大家赶紧过来帮忙！
        - id: ch04-b09
          speaker: narrator
          text: 简还带着回味快乐时光的微笑，转身走进花园。她完全没料到，楼上的窗口会突然飞下一阵东西。一块猪油砸中她的耳朵，帽子也歪到了一边。她连忙往侧门退。
        - id: ch04-b10
          speaker: william
          text: 别停手，把她一直赶到大路上！
        - id: ch04-b11
          speaker: narrator
          text: 一阵洋葱、那根火腿骨头和几只土豆，追着简一直飞到大路上。胜利的欢呼几乎撕裂空气，可声音忽然全停了。威廉脸上的笑也消失了。他正举着一只洋葱，手却慢慢垂下来。一辆出租马车正从前门驶进来。聚会顿时死一般安静，厨娘从煤窖发出的沙哑复仇呼声反而加倍清楚。威廉的脸白了。
        - id: ch04-b12
          speaker: narrator
          text: 马车里坐着他的全家人。
        - id: ch04-b13
          speaker: narrator
          text: 整整两小时以后，一位和威廉要好的小姑娘替家里送便条给布朗太太。她抬头望向威廉的窗口，恰好看见他那颗乱蓬蓬的脑袋，便热切地喊他下来。
        - id: ch04-b14
          speaker: young_girl
          text: 威廉，你下来跟我一起玩吧！
        - id: ch04-b15
          speaker: william
          text: 我不能去玩，我现在要上床睡觉。
        - id: ch04-b16
          speaker: young_girl
          text: 你为什么要睡觉？威廉，你是不是病了？
        - id: ch04-b17
          speaker: william
          text: 我没有生病。
        - id: ch04-b18
          speaker: young_girl
          text: 既然没有生病，你为什么现在就得上床？
        - id: ch04-b19
          speaker: narrator
          text: 威廉从窗口探出身子，严肃地告诉她原因。
        - id: ch04-b20
          speaker: william
          text: 我之所以要上床，是因为我爸爸根本不懂英语语法。就是这么回事！
