audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    french_master:
      display_name: 法文老师
      tts:
        delivery: 急躁尖厉，带明显的法语口音
        timbre: 紧绷锐利
        pace: 急促
        pitch: 高音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    butler:
      display_name: 比格斯先生
      tts:
        delivery: 拿腔拿调，威严而爱挖苦人
        timbre: 浑厚圆润
        pace: 偏慢
        pitch: 低音
    cook:
      display_name: 厨娘
      tts:
        delivery: 泼辣直爽，遇事总往坏处想
        timbre: 洪亮结实
        pace: 中速
        pitch: 中低音
    housemaid:
      display_name: 女仆
      tts:
        delivery: 傲慢挑剔，话里总带着嫌弃
        timbre: 细而清晰
        pace: 中速
        pitch: 中高音
    kitchenmaid:
      display_name: 厨娘帮工
      tts:
        delivery: 活泼爱笑，满是看热闹的兴致
        timbre: 年轻明亮
        pace: 轻快
        pitch: 高音
    host:
      display_name: 男主人
      tts:
        delivery: 随和沉着，语气自然
        timbre: 清晰温和
        pace: 中速
        pitch: 中音
    hostess:
      display_name: 女主人
      tts:
        delivery: 端庄平和，略带困惑
        timbre: 柔和清楚
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 尖叫的气球
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 威廉近来很不得人心，他觉得全世界都在跟自己作对。事情的起因，是一位胆小的姑妈给了他六便士，想讨他喜欢。他拿钱买了一只怪气球，上面装着硬纸板做的鸭头和鸭腿。气球吹足以后，要过好几分钟才会瘪掉，这段时间里，它会不停发出又尖又长的呻吟。威廉立刻看出了它的妙处。他可以私下把气吹足，藏在外套里，到了人前再松手，然后一脸无辜地四处找声音是从哪儿来的。
        - id: ch01-b02
          speaker: narrator
          text: 早饭前，他把气球吹得滚圆，一直偷偷攥到餐桌旁才放开。怪声一响，母亲碰翻了一杯咖啡，父亲让面包刀割了手，埃塞尔也小小地精神崩溃了一场。威廉却坐得端端正正，脸上全是受惊后的清白。家里人最恨的正是他这副神情，立刻一齐责问他。他当然承认自己在桌子底下拿着气球，只是不承认自己做错了事。
        - id: ch01-b03
          speaker: william
          text: 对，气球是在桌子底下。可我早就把它吹起来了，总不能永远攥着吧？气总得放掉，它一放气就会响，我也没办法。它本来就是这么做的，又不是我造的。
        - id: ch01-b04
          speaker: narrator
          text: 威廉带着受尽冤屈的样子去上学，当然也带上了气球。路上，他瞧见前面有位上了年纪、看起来一点就着的先生，就先拐进一条小街，把气球吹足，牢牢藏在外套底下。两人并肩时，他才悄悄松手。老先生吓得原地一跳，凶狠地四处搜寻声音的来处。他也看了威廉一眼，可这个小学生一脸端正，嘴边又没有任何折磨人的乐器。于是，老先生把满腔怒火和疑心都投向了楼上的窗户。威廉赶紧去找下一位行人，一路玩得十分开心。
        - id: ch01-b05
          speaker: narrator
          text: 到了学校，他又把气球藏进课桌。每逢尖叫声冒出来，他就摆出练熟了的惊恐表情。法文老师终于给逼得失去了耐性。
        - id: ch01-b06
          speaker: french_master
          text: 是谁弄出这个声音？马上给我站出来！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 没有人动，怪声还是隔一会儿就响一次。最后，数学老师找到了气球，把它收走了。午饭时，布朗先生问那台该死的机器是不是已经遭到没收。
        - id: ch01-b08
          speaker: william
          text: 是，已经让他们拿走了。可有些人拿了别人的东西，好像根本不觉得这是偷。
        - id: ch01-b09
          speaker: father
          text: 那我们今晚总能清静一会儿了吧？反正我要出去吃饭，对我影响不大。赴宴最不乏味的一点，就是终于能暂时离开威廉，歇一歇。
        - id: ch01-b10
          speaker: narrator
          text: 威廉用一记怒视收下这份恭维，又嘟囔说，有些人就是喜欢处处为难他。
        - id: ch01-b11
          speaker: narrator
          text: 下午自习时，他看起邻座好心借来的故事书。这可不是因为他没有功课，而是因为他要用看故事书来反抗整个世界。当然，那本书也的确好看。故事开头，主人公还是个小男孩，周围所有人都误解他、欺负他。后来他离家出走，漂洋过海，没过几年便在金矿挣下巨大财富。到了最后一章，他回家原谅亲人，还送给他们一座气派的大宅子和好几船黄金。
        - id: ch01-b12
          speaker: narrator
          text: 威廉很欣赏这个故事，只是不喜欢结尾。他打算自己住那座大宅子，只偶尔回家探望亲人，坐在那里听他们低声下气地赔罪。高兴的时候，也许赏他们一两块金子，不过绝不能给得太多，埃塞尔更别想多拿。他甚至不确定自己是否会真正原谅他们。自己的宅子里要有一间又一间的屋子，全部塞满尖叫气球和小号，还要到处养毛毛虫和小白鼠，专养那些在老家总能惹出大惊小怪的东西。他要天天穿着脏靴子走来走去，永远不梳头，也不洗脸，还要买几十辆汽车，一辆都不让埃塞尔坐。
        - id: ch01-b13
          speaker: narrator
          text: 这场好梦先被管自习的老师打断了。故事书遭到没收，书的主人也跟着大发雷霆。为了充分表示不满，那孩子把一个浸透墨水的吸墨纸团塞进威廉背后。威廉正要还手，却被罚放学后留下半小时。他只好阴沉着脸，重新对着一本倒放的历史书，继续厌恶整个人生。他悲愤地把自己和故事里的男孩相比，认定再也不能把时间浪费在这些合不来的人身边。只要处罚结束，他就立刻离家出走。
    - id: ch02
      title: 新来的擦鞋小厮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 威廉快步走出村子，气球也安稳地回到了他的口袋。原来数学老师把它忘在讲桌上，他发现以后非常振奋，便高高兴兴地重新拿走。他估计天黑前能到海边，下星期前能到金矿。发财应该用不了多久，也许圣诞节前他就能回来，到时候非叫所有人大吃一惊不可。第一，他不用再上学。第二，金块给谁要由他精心挑选。他会给肉铺小伙计、邮差、调琴师和扫烟囱的人。家人和学校里的老师却一块都没有。别人怎样对他，他就怎样回报，这件事他说到做到。
        - id: ch02-b02
          speaker: narrator
          text: 可海边的路似乎格外长，他走着走着便累了。他先下到路沟里，换一种走法，又挤过一道树篱，抄近路横穿刚犁过的田。暮色越来越重，连他那旺盛的兴致也慢慢低落。将来发财当然很好，可眼下他又冷、又累、又饿。金矿还遥不可及，连海边都没见到，必须先想个办法。书里的男孩是一路讨饭去的，威廉也决定这么办，只是眼前除了山楂树篱和田后的稻草人，根本没有人可讨。他垂头丧气地继续往前走，等着第一户人家出现，好在那里开始自己的乞丐生涯。
        - id: ch02-b03
          speaker: narrator
          text: 一对铁门终于从昏暗里显了出来。威廉摆出一副默默忍受苦难的可怜相，觉得这副表情足以融化铁石心肠，便沿车道走到正门。他的帽子早已丢在路上，于是先抚平头发，拉好袜子，再按门铃。过了一阵，开门的是个穿管家制服的胖先生。他一句话也没说，先恶狠狠地把威廉从头看到脚。
        - id: ch02-b04
          speaker: william
          text: 请问，您能听我说句话吗……
        - id: ch02-b05
          speaker: butler
          text: 你要是新来的擦鞋小厮，就绕到后门。你要不是，现在就走。
        - id: ch02-b06
          speaker: narrator
          text: 门就在威廉面前关上了。他站在最高一级台阶上，把这件事认真想了几分钟。天已经又黑又冷，而且怎么看都只会变得更黑、更冷。于是，他决定自己就是新来的擦鞋小厮。他摸到后门，敲得十分坚定。一个身材高大的厨娘打开门，她穿着印花布衣裙，身前还系着围裙，开口时一点也不客气。
        - id: ch02-b07
          speaker: cook
          text: 你来干什么？
        - id: ch02-b08
          speaker: william
          text: 那个人说了，我要是新来的擦鞋小厮，就到后门来。
        - id: ch02-b09
          speaker: cook
          text: 你已经去过正门了？胆子真大。你的行李又在哪儿？
        - id: ch02-b10
          speaker: william
          text: 我的行李正在送来的路上。
        - id: ch02-b11
          speaker: cook
          text: 你是累得连自己的行李也拿不动吗？算了，进来吧。
        - id: ch02-b12
          speaker: narrator
          text: 威廉感激地走进一间又大又暖、十分整洁的厨房。娇小的厨娘帮工正在水槽边削土豆，另一个女仆穿着黑衣服，戴荷叶边帽子，也系着荷叶边围裙，正对墙上的镜子往鼻子上扑粉。两个人都停下手里的事，转过身来盯住威廉。
        - id: ch02-b13
          speaker: cook
          text: 新来的擦鞋少爷到了。他的贴身男仆待会儿会把行李送来。
        - id: ch02-b14
          speaker: narrator
          text: 女仆先从泥靴子看到乱头发，又从乱头发看到泥靴子。
        - id: ch02-b15
          speaker: housemaid
          text: 这孩子一看就没规矩。
        - id: ch02-b16
          speaker: narrator
          text: 威廉当即决定，将来绝不给她金块。厨娘帮工却笑着冲他眨眼，于是得到了半船金子的许诺。
        - id: ch02-b17
          speaker: housemaid
          text: 小黑炭，别在那儿耍贫嘴。
        - id: ch02-b18
          speaker: cook
          text: 你喝过茶了吗？
        - id: ch02-b19
          speaker: william
          text: 我还没喝过茶。
        - id: ch02-b20
          speaker: cook
          text: 那就坐到桌边去。
        - id: ch02-b21
          speaker: narrator
          text: 威廉顿时精神百倍，心一下飞到了九霄云外。厨娘让他坐在桌旁，又端来满满一大盘黄油面包。他一刻也不耽搁，立刻吃了起来。女仆却在一旁鄙夷地瞧着他的吃相。
        - id: ch02-b22
          speaker: housemaid
          text: 看他这副吃相，准是在动物园里学的。
        - id: ch02-b23
          speaker: narrator
          text: 厨娘帮工又笑着眨眼，可威廉只顾享用面包，根本不理会。管家这时走进厨房，又把他仔细打量一遍。
        - id: ch02-b24
          speaker: butler
          text: 小子，下次再进这座宅子，你可记清楚。正门留给体面人，后门才让小崽子走。
        - id: ch02-b25
          speaker: narrator
          text: 威廉仍在大口吃面包，只隔着手里那一大块黄油面包冷冷地看他。在心里那张将来分发金块的名单上，他也把管家的名字划掉了。管家像是对世间万物都失望了似的，悲伤地环顾整间厨房。
        - id: ch02-b26
          speaker: butler
          text: 你们全都一样，只知道吃。白天吃，晚上吃。这孩子进来还不到两分钟，已经吃上了。照这样下去，不出一个星期，他也会像上一个小厮那样，把制服纽扣全撑掉。你是不是宁可吃东西，也不愿干活？
        - id: ch02-b27
          speaker: william
          text: 对，我就是宁可吃东西。
        - id: ch02-b28
          speaker: narrator
          text: 厨娘帮工又笑起来。女仆一面用细铅笔慢慢描自己的眉毛，一面长叹了一口气，那声叹息里装满了鄙夷和厌倦。
        - id: ch02-b29
          speaker: butler
          text: 爵士大人，您要是终于吃完了，我就领您去房间。
        - id: ch02-b30
          speaker: narrator
          text: 威廉表示自己已经彻底吃完，便跟着管家上了楼。管家把他带进一间很小的卧室。椅子上放着一套听差制服，外套正面照老样子钉着一排黄铜纽扣。
        - id: ch02-b31
          speaker: butler
          text: 这是你的行头，赶快穿好。今晚家里有客人。
        - id: ch02-b32
          speaker: narrator
          text: 威廉穿上制服。衣服是按上一个小厮的身量做的，落在他身上松松垮垮。
        - id: ch02-b33
          speaker: butler
          text: 你比上一个矮。不过松一点也好，吃上几个星期，你多半就能把它撑破了。现在走吧。谁会把你的行李送来？
        - id: ch02-b34
          speaker: william
          text: 会有一位朋友替我送来。
        - id: ch02-b35
          speaker: butler
          text: 如今让你亲手提自己的包袱，大概是要求太高了。你不会是个布尔什维克吧？
        - id: ch02-b36
          speaker: william
          text: 我是个淘金客。
        - id: ch02-b37
          speaker: butler
          text: 乖乖，你原来是个淘金客！
          emotion: surprised
    - id: ch03
      title: 配膳室里的灾星
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 管家把威廉重新带回楼下厨房，又推开一扇门。门后是一间小小的配膳室，也就是威廉接下来要干活的地方。
        - id: ch03-b02
          speaker: butler
          text: 这里是你干活的地方，大厨房是你待的地方。至于佣人餐厅，你可没有资格进去。现在就开工吧。午饭用过的刀都得擦。这是围裙、磨刀板和磨刀粉。
        - id: ch03-b03
          speaker: william
          text: 哎呀，我还不能进佣人餐厅！
        - id: ch03-b04
          speaker: narrator
          text: 管家把还没弄清怎么回事的威廉关进配膳室，自己转身回到厨房，问厨娘对这个新来的小厮怎么看。
        - id: ch03-b05
          speaker: cook
          text: 这孩子看起来准会给我们惹麻烦。
        - id: ch03-b06
          speaker: housemaid
          text: 他一点教养都没有。真叫人吃惊，男孩这种东西，长大以后居然能变成像您这样老练、明理又心胸开阔的男人，比格斯先生。
        - id: ch03-b07
          speaker: narrator
          text: 比格斯先生喜滋滋地抿嘴一笑，还整了整领带。
        - id: ch03-b08
          speaker: butler
          text: 我小时候当然不是他那副样子。
        - id: ch03-b09
          speaker: narrator
          text: 配膳室的门又开了，威廉把脑袋探出来，脸上沾得到处都是磨刀粉。
        - id: ch03-b10
          speaker: william
          text: 我已经擦了几把刀。能不能先做别的，剩下的以后再擦？
        - id: ch03-b11
          speaker: butler
          text: 你到底擦了几把？
        - id: ch03-b12
          speaker: william
          text: 一两把吧。准确地说，是两把。可我已经不想再擦刀了。
        - id: ch03-b13
          speaker: narrator
          text: 厨娘帮工听见这话，高兴得尖叫起来，厨娘却深深叹了一口气。管家没有立刻发作，只是缓慢而威严地走向门边。威廉那颗乱蓬蓬的脑袋还伸在外面，脖子拉得老长。
        - id: ch03-b14
          speaker: butler
          text: 小子，你必须把那些刀擦完。要不然……
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: 威廉估量了一下他的身材和分量。
        - id: ch03-b16
          speaker: william
          text: 好吧，我会擦完的。
        - id: ch03-b17
          speaker: narrator
          text: 他缩回配膳室，关上了门。
        - id: ch03-b18
          speaker: cook
          text: 他肯定会是个大麻烦，这回错不了。
        - id: ch03-b19
          speaker: butler
          text: 说“大麻烦”都太轻了。
        - id: ch03-b20
          speaker: housemaid
          text: 应该说他是个灾星。
        - id: ch03-b21
          speaker: butler
          text: 这个词才合适。
        - id: ch03-b22
          speaker: narrator
          text: 威廉的脑袋再次从门后冒出来。
        - id: ch03-b23
          speaker: william
          text: 我们几点吃晚饭？
        - id: ch03-b24
          speaker: narrator
          text: 厨娘帮工听见这个问题，笑得快喘不过气，管家则气得发出一声怒吼。威廉赶在他冲过来以前，飞快地退回配膳室。厨娘索性让帮工把土豆带进去削，一来大厨房能安静些，二来也好看着威廉，让他老老实实把活干完。
        - id: ch03-b25
          speaker: narrator
          text: 帮工欢欢喜喜地进去，看见威廉坐在桌边，懒洋洋地摆弄一把刀。他早就拿磨刀粉做起了试验，把粉末掺进水里，捏出一只只棕色小饼，在壁炉台上排成整齐的一列。他还亲口尝过磨刀粉，嘴唇上的深色污迹就是证据。日子只要变得费劲，他的头发就会根根竖起，此刻也正是这样。
        - id: ch03-b26
          speaker: william
          text: 你要是知道我的真正身份，肯定会吓一跳。
        - id: ch03-b27
          speaker: kitchenmaid
          text: 那你快说呀，你到底是什么人？
        - id: ch03-b28
          speaker: william
          text: 我是淘金客。我很快就会有一船又一船的金子，可我不会分给门外那个家伙，也不给厨房里那些人。
        - id: ch03-b29
          speaker: kitchenmaid
          text: 那我能分到吗？
        - id: ch03-b30
          speaker: narrator
          text: 她朝猫眨了眨眼，仿佛这玩笑只有他们和猫知道。
        - id: ch03-b31
          speaker: william
          text: 你会拿到好多金块。你把这三颗纽扣收好，就当作信物。等我发财回来，你拿给我看，我就会记得答应过你。到时候我会给你金块。要是我还没娶别人，也许还会娶你。
        - id: ch03-b32
          speaker: narrator
          text: 威廉说话时拿起一把刀，摆出王公贵族赏赐臣民的气派，从制服正中割下三颗纽扣递给她。那三颗纽扣就是信物，等他带着黄金回来，见到它们就不会忘记承诺。厨娘帮工听得眉开眼笑，又把脑袋探到配膳室外，把自己的新发现告诉大家。
        - id: ch03-b33
          speaker: kitchenmaid
          text: 他脑子有点不正常，可听他说这些真好玩。
        - id: ch03-b34
          speaker: narrator
          text: 正门铃忽然响了，贵客已经到来，他们的谈话只好停下。比格斯先生和女仆出去接待，厨娘帮工也跑去帮忙把饭菜装盘。威廉独自留在配膳室，坐在桌子上，无所事事地用手指在磨刀粉里画出各种花样。
        - id: ch03-b35
          speaker: cook
          text: 他刚才在里面干什么？
        - id: ch03-b36
          speaker: kitchenmaid
          text: 什么也没干，就顾着说话。他可真是个活宝。
        - id: ch03-b37
          speaker: cook
          text: 刀擦完以后，把地上的靴子和鞋也收拾了。刷子和鞋油都在架子上。
        - id: ch03-b38
          speaker: narrator
          text: 威廉听到以后立刻来了兴致。靴子听起来比刀好玩多了。他小心地把那一大堆没擦的刀全藏到刀箱后面，转而开始对付鞋子。管家这时回来问汤好了没有，还说客人已经走进餐厅，是老爷的一位朋友，看起来倒还算体面。
        - id: ch03-b39
          speaker: narrator
          text: 配膳室里，威廉把刷子蘸上厚厚一层鞋油，再一层一层往靴子和鞋上抹。他并不大知道鞋究竟应该怎样擦，只知道多涂一些，结果很大一部分鞋油都粘到了自己手上。管家朝里面一看，立刻发现制服正中少了三颗纽扣。
        - id: ch03-b40
          speaker: butler
          text: 你的纽扣到哪里去了？
        - id: ch03-b41
          speaker: william
          text: 那些纽扣是自己掉的。
        - id: ch03-b42
          speaker: butler
          text: 是你吃得把它们撑掉了。我第一眼看见你就说过，不出一星期，纽扣全得让你撑开。现在才十分钟，你已经撑掉三颗了。
        - id: ch03-b43
          speaker: narrator
          text: 管家回到厨房，阴沉沉地抱怨男孩除了吃东西，就只会糟蹋自己的衣服。接着，他端着汤出去了，留下威廉独自面对那堆靴子。威廉已经把每双鞋都抹上厚厚的鞋油，却不知道下一步该做什么，也彻底厌倦了这份差事。忽然，他想起气球还在楼上原来那件衣服的口袋里。这东西正好能替单调的生活换换滋味。他悄悄溜上楼拿来气球，又若无其事地回到靴子旁边。
    - id: ch04
      title: 父子重逢
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 没过多久，比格斯先生和女仆端着空汤盘回到厨房。一声尖厉的哀号突然响起，拖得又长又刺耳。女仆吓得尖叫。
        - id: ch04-b02
          speaker: cook
          text: 老天爷！有人在活活折磨那只可怜的猫，肯定又是那个该死的孩子。
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 管家挺身而出，勇敢地走到配膳室前，把门推开。威廉就站在里面，一只手里正举着那只吹得滚圆的气球，硬纸板做的鸭头和鸭腿还挂在上面。管家看清以后，立刻气势汹汹地逼了过去。
        - id: ch04-b04
          speaker: butler
          text: 小混蛋，你敢再放一次这个东西，我就……
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 他一边威胁，一边把那张肥大的脸凑到威廉眼前。威廉突然涌起一股自己也控制不住的冲动。他抓起那把厚厚蘸满鞋油的刷子，迎面抵住比格斯先生的脸，把它推了回去。四周先是死一般恐怖地静了一瞬。紧接着，比格斯先生怒不可遏，整个人向威廉扑了过去。
        - id: ch04-b06
          speaker: narrator
          text: 同一时刻，男女主人正和客人坐在餐厅里。男主人问，新来的擦鞋小厮有没有到。
        - id: ch04-b07
          speaker: hostess
          text: 那个小厮已经到了。
        - id: ch04-b08
          speaker: host
          text: 他干活还行吗？
        - id: ch04-b09
          speaker: hostess
          text: 比格斯好像不大喜欢他。不过新来的小厮从来都不能让比格斯满意。
        - id: ch04-b10
          speaker: father
          text: 上天把男孩交给人类，就是为了磨炼人。我家也有一个。虽然是亲生儿子，可他只要出了门，家里那份安宁和轻松，真叫人难以形容。
        - id: ch04-b11
          speaker: host
          text: 我倒很想见见你的儿子。
        - id: ch04-b12
          speaker: father
          text: 你迟早会见到。附近所有人早晚都会碰上他。他从不肯把自己的光藏起来。我更喜欢那些没见过他的人，因为他们不会通过儿子来评判我。
        - id: ch04-b13
          speaker: narrator
          text: 管家这时拿着一张便条走进餐厅，只说了一句不用回信，随后又迈着缓慢而庄严的步子走了。女主人向客人告了声失陪，拆开一看，原来是妹妹写来的。
        - id: ch04-b14
          speaker: hostess
          text: 她说，她替我雇的擦鞋小厮得了流感，今天没来，希望没有给我们添太多麻烦。可那个小厮明明已经到了呀。
          emotion: surprised
        - id: ch04-b15
          speaker: narrator
          text: 话音刚落，远处便传来一声愤怒的吼叫，接着又是一声尖叫。沉重的脚步一路咚咚奔来，离餐厅越来越近。
        - id: ch04-b16
          speaker: father
          text: 我猜是革命爆发了，赤党已经冲进屋了。
        - id: ch04-b17
          speaker: narrator
          text: 门猛然撞开。一个男孩冲进餐厅，一手拿着鞋刷，一手抓着鼓足的气球。他浑身凌乱，制服正面少了三颗纽扣，脸上被磨刀粉和鞋油抹得一道又一道。身后的胖管家穷追不舍，脸气得发紫，正中还印着一大块鞋油。
        - id: ch04-b18
          speaker: narrator
          text: 男孩绕着餐桌拼命奔逃，脚下却在擦得光亮的地板上一滑。他慌忙伸手，死死抓住客人的脖子，竟把客人连人带椅一起拽倒在自己身旁。屋里顿时静得可怕，所有人都惊得动弹不得。男孩和客人并排坐在地上，呆呆地望着对方。男孩的手无力地松开，那个不知怎样熬过整场追逐还没破的气球，便在死寂中发出一声尖厉的哀鸣。
        - id: ch04-b19
          speaker: narrator
          text: 男女主人坐在原处，一时完全弄不明白发生了什么，只能茫然地看看这个，又看看那个。客人盯着眼前的男孩，脸上先露出惊讶，接着变成不敢相信，最后凝成一片冰冷的恐惧。男孩也直直望着客人，神情同样先是惊讶，继而不敢相信。两张脸上的变化几乎一模一样，只是到了最后，男孩脸上剩下的是彻底而空白的沮丧。
        - id: ch04-b20
          speaker: father
          text: 老天！原来是威廉！
          emotion: surprised
        - id: ch04-b21
          speaker: william
          text: 哎呀！原来是爸爸！
          emotion: surprised
