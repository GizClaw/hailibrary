  chapters:
    - id: ch01
      title: The Groaning Balloon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: William felt bitter about life. Once again, he was going through one of those times when nobody seemed to like him. The trouble had reached its peak after a timid aunt gave him sixpence, hoping to buy his goodwill. William spent it on a balloon with a cardboard duck's head and legs. When it was blown up and allowed to empty, it took several minutes to go down and made one long, high groan.
        - id: ch01-b02
          speaker: narrator
          text: William saw the possibilities at once. He could inflate it in private, hide it under his coat, and let it empty in public while he looked around in innocent amazement. Before breakfast, he blew it up as far as it would go. Then he held the opening tightly shut and kept the balloon hidden until he was seated at the table. When everyone had settled down, he released it. The long, piercing groan took them all by surprise. His mother knocked over her coffee. His father cut himself with the bread knife. Ethel nearly had a nervous breakdown. Through it all, William sat there staring around as if the mysterious sound had shocked him more than anyone.
        - id: ch01-b03
          speaker: narrator
          text: Nothing made his family angrier than that innocent face. They all turned on him, and William defended himself as best he could.
        - id: ch01-b04
          speaker: william
          text: Yes, I had the balloon under the table. I blew it up a while ago, but I couldn't hold it forever, could I? I had to let the air out sometime. It's not my fault it makes that noise. That's how they made it. I didn't make it.
        - id: ch01-b05
          speaker: narrator
          text: He left for school looking deeply wronged, and he took the balloon with him. An elderly, irritable-looking gentleman was walking ahead. William stepped a little way down a side street, inflated the balloon, held it tightly beneath his coat, and caught up. As he drew even with the man, he let it groan. The gentleman leaped into the air and glared fiercely in every direction. He glanced at the small, virtuous-looking schoolboy beside him. William had nothing at his lips that could possibly make such a dreadful noise. So the man turned his fury and suspicion toward the upstairs windows. William hurried ahead to find another pedestrian. By the time he reached school, he had enjoyed the walk very much.
        - id: ch01-b06
          speaker: narrator
          text: School began just as well. William opened his desk, quickly blew up the balloon, shut the lid, and put on his well-practiced look of horrified surprise. The French master was driven nearly out of his mind.
        - id: ch01-b07
          speaker: french_master
          text: Whoever is making that noise, step forward!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Nobody moved. The groaning returned again and again until the mathematics master found the balloon and took it away.
        - id: ch01-b09
          speaker: father
          text: I hope they confiscated that infernal machine of yours.
        - id: ch01-b10
          speaker: narrator
          text: At lunch, William sadly admitted that they had. Then he observed that some people apparently didn't call it stealing when they took somebody else's property.
        - id: ch01-b11
          speaker: father
          text: So we can expect a little peace tonight? It makes no difference to me, since I'm dining out. The one good thing about a dinner engagement is getting a short rest from William.
        - id: ch01-b12
          speaker: narrator
          text: William answered that compliment with a scowl. Under his breath, he muttered that some people were always picking on him.
    - id: ch02
      title: William Runs Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: During afternoon study, William read a storybook borrowed from the boy next door. He did have schoolwork, but reading the story was his way of defying the whole world. Besides, it was a very interesting story.
        - id: ch02-b02
          speaker: narrator
          text: Its hero began as a misunderstood little boy whom everyone treated badly. He ran away to sea, made an enormous fortune in the goldfields, and came home in the final chapter. Then he forgave his family and gave them a grand mansion and several shiploads of gold.
        - id: ch02-b03
          speaker: narrator
          text: William liked the idea, except for that ending. He would keep the grand mansion for himself and visit his family only on rare occasions. During those visits, he would sit and listen while they apologized humbly for the way they had treated him. Perhaps he would hand out a nugget or two, but not very many, and certainly not many to Ethel. In fact, he wasn't sure he would ever truly forgive any of them. His own house would have whole rooms filled with squeaky balloons and trumpets. Caterpillars and white rats would be allowed everywhere, because those were the very things his family made such a fuss about in their old house. William would always wear muddy boots indoors. He would leave his hair unbrushed, never wash, and own dozens of cars. Ethel wouldn't be allowed to ride in a single one of them.
        - id: ch02-b04
          speaker: narrator
          text: That splendid dream ended when the master in charge found the storybook and confiscated it. The boy who owned it was furious with William for losing it. To show exactly how furious, he made a little ball of blotting paper, soaked it in ink, and dropped it down William's back. William immediately tried to get revenge. The master caught him and sentenced him to stay for half an hour after school. William returned gloomily to his history book, which he held upside down, and to his bitter dislike of mankind.
        - id: ch02-b05
          speaker: narrator
          text: Comparing himself bitterly with the hero, William decided not to waste another moment in such unpleasant surroundings. The instant they released him, he would run away.
        - id: ch02-b06
          speaker: narrator
          text: When he was finally released, he marched briskly down the road that led away from the village. The balloon rested in his pocket. To his delight, the mathematics master had left it lying on his desk, so William had simply taken possession of it again. He expected to reach the coast before nightfall and arrive at the goldfields before the following week. Surely making a fortune there couldn't take very long. He might be home before Christmas. When he returned rich, he would certainly make everyone sit up and pay attention.
        - id: ch02-b07
          speaker: narrator
          text: He would never go to school again, and he would choose his nugget recipients very carefully. The butcher's boy could have some. So could the mailman, the piano tuner, and the chimney sweep. His family and the schoolmasters would get nothing. William would treat people exactly as they had treated him.
        - id: ch02-b08
          speaker: narrator
          text: The road to the coast proved much longer than William had expected, and he began to tire. He walked along a ditch for a change. After that, he scraped his way through a hedge and tried a shortcut across a plowed field. Dusk came quickly, and even William's hopeful spirits began to fail. The future fortune still sounded wonderful. The present was another matter. He was cold, tired, and very hungry. So far he had not even reached the coast, much less the goldfields.
        - id: ch02-b09
          speaker: narrator
          text: Something had to be done. The boy in the book had begged his way to the coast, so William would do the same. Unfortunately, there was nobody to beg from but a hawthorn hedge and the scarecrow behind it. He wandered on miserably, planning to begin his begging career at the first sign of a house.
    - id: ch03
      title: The New Boots
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, through the deepening dusk, William saw a pair of iron gates. This was his first sign of human habitation and the place where his career as a beggar would begin. He arranged his face into an expression of patient suffering that he believed could melt a heart of stone, and walked up the drive. At the front door, he prepared himself carefully. He smoothed down his hair, since his cap had been lost somewhere along the way, pulled up his fallen socks, and rang the bell.
        - id: ch03-b02
          speaker: narrator
          text: After a pause, a stout gentleman dressed as a butler opened the door and glared fiercely at William from top to bottom.
        - id: ch03-b03
          speaker: william
          text: Please—
        - id: ch03-b04
          speaker: mr_biggs
          text: If you're the new Boots, use the back door. If you're not, go away.
        - id: ch03-b05
          speaker: narrator
          text: He shut the door in William's face. William stayed on the top step and thought it over. The night was dark and cold, and it promised to become darker and colder. He decided he was the new Boots.
        - id: ch03-b06
          speaker: narrator
          text: He found the back door and knocked firmly. A large woman in a printed dress and apron opened it.
        - id: ch03-b07
          speaker: cook
          text: What do you want?
        - id: ch03-b08
          speaker: william
          text: He told me to come around here if I was the new Boots.
        - id: ch03-b09
          speaker: narrator
          text: The woman looked at him with grim disapproval.
        - id: ch03-b10
          speaker: cook
          text: You went to the front door first? You've got some nerve!
        - id: ch03-b11
          speaker: narrator
          text: Her disapproval turned to suspicion.
        - id: ch03-b12
          speaker: cook
          text: Where are your belongings?
        - id: ch03-b13
          speaker: william
          text: They're coming.
        - id: ch03-b14
          speaker: cook
          text: Too tired to carry them yourself, were you? Fine. Come in.
        - id: ch03-b15
          speaker: narrator
          text: William entered gratefully. The kitchen was large, warm, and clean. A small kitchen maid peeled potatoes at the sink. A housemaid in black, wearing a frilled cap and apron, powdered her nose at a wall mirror. Both turned to stare.
        - id: ch03-b16
          speaker: cook
          text: Here's the new Boots. His valet will bring his belongings later.
        - id: ch03-b17
          speaker: narrator
          text: The housemaid looked up from William's muddy boots to his untidy hair, then all the way down again.
        - id: ch03-b18
          speaker: housemaid
          text: What an impertinent-looking child.
        - id: ch03-b19
          speaker: narrator
          text: She returned to her powder. William privately removed her from the list of people who would receive gold nuggets. The kitchen maid giggled and gave him a friendly wink, so William promised her half a shipload.
        - id: ch03-b20
          speaker: housemaid
          text: That's enough from you, Smutty. No cheek!
        - id: ch03-b21
          speaker: cook
          text: Have you had your tea?
        - id: ch03-b22
          speaker: narrator
          text: William's spirits rose.
        - id: ch03-b23
          speaker: william
          text: No.
        - id: ch03-b24
          speaker: cook
          text: Then sit at the table.
        - id: ch03-b25
          speaker: narrator
          text: His spirits soared. Cook set a large plate of bread and butter before him, and William began at once. The housemaid watched with scorn.
        - id: ch03-b26
          speaker: housemaid
          text: I suppose he learned his table manners at the zoo.
        - id: ch03-b27
          speaker: narrator
          text: The kitchen maid giggled and winked again. William was too busy enjoying his bread and butter to notice. Then the butler entered and gave him another long inspection.
        - id: ch03-b28
          speaker: mr_biggs
          text: Next time you enter this house, my boy, remember that the front door is for gentlefolk and the back door is for brats.
        - id: ch03-b29
          speaker: narrator
          text: William looked coldly at him over a thick piece of bread and butter, and crossed him off the nugget list too. Mr. Biggs gazed sadly around the room.
        - id: ch03-b30
          speaker: mr_biggs
          text: They're all alike. Eat, eat, eat. Day and night, nothing but eating. He hasn't been here two minutes, and he's already at it. In one week he'll burst every button off his uniform, just like the last boy. You'd rather eat than work, wouldn't you?
        - id: ch03-b31
          speaker: william
          text: Yes, I would.
        - id: ch03-b32
          speaker: narrator
          text: The kitchen maid giggled once more. The housemaid sighed with weary scorn as she drew a thin pencil over her eyebrows.
        - id: ch03-b33
          speaker: mr_biggs
          text: If you've quite finished, my lord, I'll show you to your room.
        - id: ch03-b34
          speaker: narrator
          text: William indicated that he had finished. Mr. Biggs led him out of the warm kitchen and upstairs to a very small bedroom. Draped over a chair was the uniform worn by the previous page. Down the front of its coat ran the usual neat row of shining brass buttons.
        - id: ch03-b35
          speaker: mr_biggs
          text: Those are your clothes. Put them on quickly. We have company for dinner tonight.
        - id: ch03-b36
          speaker: narrator
          text: William put them on.
        - id: ch03-b37
          speaker: mr_biggs
          text: You're smaller than the last boy, so they hang loose. Never mind. A week or two of stuffing yourself will probably make you burst them, so loose is best. Now, come along. Who's bringing your belongings?
        - id: ch03-b38
          speaker: william
          text: A... a friend.
        - id: ch03-b39
          speaker: mr_biggs
          text: Of course carrying your own packages is too much to expect these days. You're one of those Bolshevists, I suppose.
        - id: ch03-b40
          speaker: narrator
          text: William decided to explain his true position.
        - id: ch03-b41
          speaker: william
          text: I'm a gold digger.
        - id: ch03-b42
          speaker: mr_biggs
          text: Good grief!
    - id: ch04
      title: Trouble Below Stairs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Mr. Biggs took William back down to the kitchen and opened the door of a small pantry.
        - id: ch04-b02
          speaker: mr_biggs
          text: This pantry is where you work, and the kitchen is where you live. You are not permitted in the servants' hall.
        - id: ch04-b03
          speaker: william
          text: Crumbs!
        - id: ch04-b04
          speaker: mr_biggs
          text: You may as well start now. All the lunch knives need cleaning. Here's an apron, the knife board, and the knife powder.
        - id: ch04-b05
          speaker: narrator
          text: He shut the bewildered William inside the pantry and turned to Cook.
        - id: ch04-b06
          speaker: mr_biggs
          text: What do you think of him?
        - id: ch04-b07
          speaker: cook
          text: He looks like the kind of boy who'll give us trouble.
        - id: ch04-b08
          speaker: housemaid
          text: He has no class at all. It amazes me that anything like a boy can grow into an experienced, sensible, broad-minded man like you, Mr. Biggs.
        - id: ch04-b09
          speaker: narrator
          text: Mr. Biggs smiled modestly and straightened his tie.
        - id: ch04-b10
          speaker: mr_biggs
          text: Well, naturally, I was never like him when I was a boy.
        - id: ch04-b11
          speaker: narrator
          text: The pantry door opened. William's face, now generously decorated with knife powder, appeared around it.
        - id: ch04-b12
          speaker: william
          text: I've cleaned some knives. Can I do something else now and finish the rest later?
        - id: ch04-b13
          speaker: mr_biggs
          text: How many did you clean?
        - id: ch04-b14
          speaker: william
          text: One or two. Well, two. But I'm tired of cleaning knives.
        - id: ch04-b15
          speaker: narrator
          text: The kitchen maid shrieked with delight, and Cook gave a deep sigh. Mr. Biggs moved slowly and grandly toward the tousled head still poking around the door.
        - id: ch04-b16
          speaker: mr_biggs
          text: You will finish those knives, my boy, or else—
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: William considered Mr. Biggs's size and weight.
        - id: ch04-b18
          speaker: william
          text: All right. I'll finish them.
        - id: ch04-b19
          speaker: narrator
          text: He withdrew and closed the pantry door.
        - id: ch04-b20
          speaker: cook
          text: That boy is going to be a real trial.
        - id: ch04-b21
          speaker: mr_biggs
          text: Trial is hardly strong enough.
        - id: ch04-b22
          speaker: housemaid
          text: An affliction.
        - id: ch04-b23
          speaker: mr_biggs
          text: Yes, that's closer.
        - id: ch04-b24
          speaker: narrator
          text: William's head appeared again.
        - id: ch04-b25
          speaker: william
          text: What time is supper?
        - id: ch04-b26
          speaker: narrator
          text: He vanished quickly as the kitchen maid gave a hysterical shriek and Mr. Biggs roared with fury.
        - id: ch04-b27
          speaker: cook
          text: Take your potatoes into the pantry. Maybe we'll get some peace in here, and you can make sure he's doing the job properly.
        - id: ch04-b28
          speaker: narrator
          text: The kitchen maid happily carried her potatoes into the pantry. William was sitting beside the table, lazily playing with one of the knives. He had been experimenting with the knife powder instead of cleaning. First he mixed it with water. The result was a collection of little brown pies, which he arranged in a row on the mantel. He had also tasted the powder, and the dark stains around his lips clearly showed it. His hair stood straight up on his head, as it always did whenever life became especially difficult.
        - id: ch04-b29
          speaker: william
          text: You'd be surprised if you knew what I really was.
        - id: ch04-b30
          speaker: kitchenmaid
          text: Go on, then. What are you?
        - id: ch04-b31
          speaker: william
          text: I'm a gold digger. I've got shiploads and shiploads of gold. At least, I will soon. He won't get any, and neither will the rest of them in there.
        - id: ch04-b32
          speaker: narrator
          text: He pointed toward the pantry door. The kitchen maid winked at the cat, the only other witness to the joke.
        - id: ch04-b33
          speaker: kitchenmaid
          text: And what about me?
        - id: ch04-b34
          speaker: william
          text: You'll get a whole lot of nuggets. Here.
        - id: ch04-b35
          speaker: narrator
          text: With a grand flourish, William took a knife, cut three buttons from the middle of his coat, and handed them to her.
        - id: ch04-b36
          speaker: william
          text: Keep these as tokens. When I come home rich, show me the buttons. Then I'll remember and give you the nuggets. I might even marry you, if I haven't married somebody else.
        - id: ch04-b37
          speaker: narrator
          text: The kitchen maid put her head around the pantry door.
        - id: ch04-b38
          speaker: kitchenmaid
          text: He's crazy. It's wonderful listening to him talk.
        - id: ch04-b39
          speaker: narrator
          text: The front doorbell rang, ending the conversation. The dinner guests had arrived. Mr. Biggs and the housemaid went to receive them, while the kitchen maid hurried off to help serve the food. William remained on the pantry table, drawing patterns in the knife powder with one finger.
        - id: ch04-b40
          speaker: cook
          text: What was he doing?
        - id: ch04-b41
          speaker: kitchenmaid
          text: Nothing except talking. He's a funny one, he is.
        - id: ch04-b42
          speaker: cook
          text: If those knives are finished, there are boots and shoes on the floor. The brushes and blacking are on the shelf.
        - id: ch04-b43
          speaker: narrator
          text: William got up eagerly. Boots sounded more interesting than knives. He carefully hid the pile of dirty knives behind the knife box and started on the shoes.
        - id: ch04-b44
          speaker: mr_biggs
          text: Is the soup ready? The company is going into the dining room. Just a friend of the master's. He looks respectable enough.
        - id: ch04-b45
          speaker: narrator
          text: In the pantry, William had covered a brush with a very thick layer of blacking. He spread it over the boots and shoes in heavy coats, without sparing a single one. A large part of the blacking ended up on his own hands. While William was still working in this fashion, Mr. Biggs stopped and looked into the pantry.
        - id: ch04-b46
          speaker: mr_biggs
          text: What happened to your buttons?
        - id: ch04-b47
          speaker: william
          text: They came off.
        - id: ch04-b48
          speaker: mr_biggs
          text: Burst off, you mean. I knew it the moment I saw you. I said you'd eat until the buttons burst off in a week. You've managed it in ten minutes.
        - id: ch04-b49
          speaker: narrator
          text: Mr. Biggs returned gloomily to the kitchen.
        - id: ch04-b50
          speaker: mr_biggs
          text: Eating and ruining their clothes. That's all boys ever do. They eat, and they ruin their clothes.
        - id: ch04-b51
          speaker: narrator
          text: Mr. Biggs carried the soup into the dining room, leaving William alone with the boots. William was already growing tired of boots. He had covered all of them with thick blacking, but nobody had told him what to do after that. Then he suddenly remembered the balloon in the pocket of his own clothes upstairs. It might help vary the dullness of life below stairs. He slipped quietly up to the bedroom, retrieved it, and returned to his boots before anyone stopped him.
        - id: ch04-b52
          speaker: narrator
          text: Before long, Mr. Biggs and the housemaid brought back the empty soup plates. A high-pitched squeal rang through the kitchen, fading slowly into a shrill groan. The housemaid screamed.
        - id: ch04-b53
          speaker: cook
          text: Mercy! Somebody's torturing that poor cat to death. It'll be that dreadful boy.
          emotion: surprised
        - id: ch04-b54
          speaker: narrator
          text: Mr. Biggs advanced bravely and opened the pantry. William stood there holding the inflated duck balloon in one hand.
        - id: ch04-b55
          speaker: mr_biggs
          text: If you let that thing off once more, you little pest, I'll—
          emotion: angry
        - id: ch04-b56
          speaker: narrator
          text: His broad face moved threateningly close to William's. On a sudden, uncontrollable impulse, William grabbed the brush loaded with blacking and pushed Mr. Biggs's face away with it. For one moment, horror silenced the room. Then Mr. Biggs threw himself furiously at William.
    - id: ch05
      title: The Dinner Guest
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In the dining room sat the master and mistress of the house with their guest.
        - id: ch05-b02
          speaker: master
          text: Did the new Boots arrive?
        - id: ch05-b03
          speaker: mistress
          text: Yes.
        - id: ch05-b04
          speaker: master
          text: Is he any good?
        - id: ch05-b05
          speaker: mistress
          text: Biggs doesn't seem impressed, but he never likes them at first.
        - id: ch05-b06
          speaker: father
          text: The human boy was put on earth to discipline us. I have one myself. Even though he's my own son, I can hardly describe the peace and relief that fill our house whenever he's away.
        - id: ch05-b07
          speaker: master
          text: I'd like to meet your son.
        - id: ch05-b08
          speaker: father
          text: You probably will, sooner or later. Everyone in the neighborhood does. He never keeps himself unnoticed. Personally, I prefer people who haven't met him. They can't judge me by him.
        - id: ch05-b09
          speaker: narrator
          text: Just then, Mr. Biggs entered with a note.
        - id: ch05-b10
          speaker: mr_biggs
          text: No answer is required.
        - id: ch05-b11
          speaker: narrator
          text: He withdrew with his usual slow dignity. The lady opened the note.
        - id: ch05-b12
          speaker: mistress
          text: Excuse me. It's from my sister. She says, “I hope the Boots I hired hasn't caused too much inconvenience by failing to arrive. He has the flu.” But he did arrive. How strange.
        - id: ch05-b13
          speaker: narrator
          text: An angry shout sounded in the distance. Then came a scream and the clatter of heavy running feet, growing nearer.
        - id: ch05-b14
          speaker: father
          text: A revolution, I expect. The Reds are upon us.
        - id: ch05-b15
          speaker: narrator
          text: At that instant, the dining-room door burst open. A boy rushed through it with a blacking brush in one hand and an inflated duck balloon in the other. He was wildly disheveled after his flight through the house. Three buttons were missing from the front of his uniform, while knife powder and blacking streaked his face. Close behind him thundered a fat butler. Mr. Biggs's face was purple with fury beneath the broad smear of blacking William had planted there.
        - id: ch05-b16
          speaker: narrator
          text: The boy rushed around the dining table with Mr. Biggs behind him. Then his feet slipped on the polished floor. As he fell, he grabbed desperately at the guest's neck for support. The guest toppled backward, and guest, chair, and boy crashed to the floor together. Everyone else froze. The room fell into a silence of helpless horror. Still sitting on the floor beside the overturned chair, the guest and the boy stared directly at one another.
        - id: ch05-b17
          speaker: narrator
          text: The boy's powerless hand slowly loosened its grip on the balloon. Somehow, despite everything that had happened during the wild chase, it was still inflated and unharmed. As the air began to escape, one shrill squeak cut through the perfect silence of the dining room. The master and mistress remained in their seats, looking from one person to another in stunned amazement.
        - id: ch05-b18
          speaker: narrator
          text: As the guest studied the boy, his face passed from amazement to disbelief, and then to frozen horror. The boy's face changed from amazement to disbelief, and finally to complete misery.
        - id: ch05-b19
          speaker: father
          text: Good Lord! It's William!
          emotion: surprised
