audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    father:
      display_name: 布朗先生
      tts:
        delivery: 务实坚定，疲惫时仍保持威严
        timbre: 沉稳厚实的成年男声
        pace: 中速
        pitch: 中低音
    miss_grant:
      display_name: 格兰特小姐
      tts:
        delivery: 甜美做作，谈起浪漫便格外陶醉
        timbre: 清亮如笛的成年女声
        pace: 舒缓而讲究
        pitch: 中高音
    dorita:
      display_name: 多丽塔
      tts:
        delivery: 文雅甜脆，刻薄话也说得若无其事
        timbre: 清脆纤细的女孩声
        pace: 中速偏快
        pitch: 高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 天真含混，恳求时可怜巴巴
        timbre: 稚嫩柔软的幼儿声
        pace: 缓慢而跳跃
        pitch: 高音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    douglas:
      display_name: 道格拉斯
      tts:
        delivery: 热心随和，偶尔故作老成
        timbre: 清亮的男孩声
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一个浪漫的主意
      blocks:
        - id: ch01-b01
          speaker: miss_grant
          text: 我真想要个小侍童。婚礼上少了小侍童，总觉得不够体面。
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: 格兰特小姐说得满心惆怅。她的姨妈，也是这家的女主人布朗太太，隔着茶桌看了看小儿子。威廉正大口吃着糖霜蛋糕，根本不考虑后果。少年人往往就是这样。
        - id: ch01-b03
          speaker: mother
          text: 威廉也可以呀。不过，威廉，你吃的蛋糕已经够多了。
        - id: ch01-b04
          speaker: narrator
          text: 格兰特小姐认真打量着他。威廉的脸上明明白白写着，一个品行完美的人，正在遭受无法忍耐的迫害。
        - id: ch01-b05
          speaker: william
          text: 什么叫够多了？我根本没吃多少。你看见我的时候，我才刚开始吃。这又是普通蛋糕，不会害人。要是有害，我当然不吃。糖对身体有好处，动物为了不生病也吃糖。马吃，鹦鹉也吃，它们都没——
        - id: ch01-b06
          speaker: mother
          text: 行了，威廉，别争了。
        - id: ch01-b07
          speaker: narrator
          text: 布朗太太很累。威廉那一套雄辩，全家早就领教过，也一直有点怕。格兰特小姐终于得出了结论。
        - id: ch01-b08
          speaker: miss_grant
          text: 他的脸太现代了。可小侍童这件事，本来应该有中世纪的浪漫气息。
        - id: ch01-b09
          speaker: mother
          text: 威廉一点儿也不像中世纪的人，更谈不上浪漫。
        - id: ch01-b10
          speaker: miss_grant
          text: 那么，他表妹多丽塔呢？他们都是十一岁，对吧？让他们两个穿白缎子，再拿上冬青花束。请她来住几天，参加典礼，好不好？至于威廉，只要最近别剪头发，也许还不至于太难看。
        - id: ch01-b11
          speaker: narrator
          text: 格兰特小姐总把自己的婚礼叫作“典礼”。这时候，威廉已经和三个生死之交到了花园。他们是姜吉、亨利和道格拉斯，正在玩威廉刚发明的登山游戏。一块木板斜搭在围墙上，四个人用绳子拴成一串，帽子插着羽毛，顺着木板往上爬。威廉还戴着母亲的旧高尔夫球帽，觉得自己一定英武极了。
        - id: ch01-b12
          speaker: narrator
          text: 他们每次没到顶就会脚下一滑，一路滚到底下，扭成一团，人人带伤。可淤青一点也没让游戏失去魅力。在威廉看来，游戏好不好玩，主要就看它会不会要命，会不会摔断胳膊腿。
        - id: ch01-b13
          speaker: narrator
          text: 这一切都源于一根旧登山杖。布朗先生的一位朋友欠缺考虑，把它送给了威廉。家里人还没听说这件礼物，楼梯和楼上走廊的油漆已经全毁了。登山杖被没收一星期，归还时附带一个条件，不许带进屋。威廉只好另想办法，木板登山就这样诞生了。四个人轮流用登山杖，不过每一轮威廉都能用两次，好让大家记得宝物属于谁。
        - id: ch01-b14
          speaker: narrator
          text: 布朗太太找他谈小侍童的事，心里很不踏实。其实，威廉的家人每次要面对他，大都怀着这种心情。
        - id: ch01-b15
          speaker: mother
          text: 你想参加西比尔表姐的婚礼吗？
        - id: ch01-b16
          speaker: william
          text: 不想。
        - id: ch01-b17
          speaker: mother
          text: 那你不想打扮一下再去吗？
        - id: ch01-b18
          speaker: william
          text: 扮成红印第安人？
        - id: ch01-b19
          speaker: mother
          text: 不是，不完全是。
        - id: ch01-b20
          speaker: william
          text: 那扮海盗？
        - id: ch01-b21
          speaker: mother
          text: 也不是。
        - id: ch01-b22
          speaker: william
          text: 要是扮红印第安人或者海盗，我就去。别的我都不扮。
        - id: ch01-b23
          speaker: miss_grant
          text: 威廉，小侍童是个很浪漫的中世纪构想，还有一种迷人的骑士精神。你这样的男孩子，一定会喜欢的。
        - id: ch01-b24
          speaker: narrator
          text: 威廉转过那张叫人猜不透的脸，冷冷瞪了她一眼。两个女人已经自顾自商量起衣服。
        - id: ch01-b25
          speaker: mother
          text: 我有一双漂亮的白丝袜，可以给他当紧身裤。埃塞尔还有条缎子衬裙，只有一处刚磨坏。拿它改一身衣服，再买点白缎子，找几张纸样，应该就够了吧？
        - id: ch01-b26
          speaker: william
          text: 我才不穿埃塞尔的破衣服！你们就想让我丢脸，根本不管我以后怎么办。我要穿着她的旧衣服出去，一辈子都抬不起头。我不干，也不去那场破婚礼。我不想看西比尔表姐结婚，你们也别想逼我穿那种东西！
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 她们先跟他讲道理，又好言哄他，最后连威胁都用上了，什么办法都不管用。可父母的权威终究压倒了他，他不得不屈服。从那以后，威廉就在自己的世界里走来走去，神情像个已经被判定要绑上火刑柱的殉道者。就连刚发明的登山游戏也失去了吸引力，那根珍贵的登山杖孤零零靠在花园墙边。至于他的那一小圈密友，更没给他多少安慰。
        - id: ch01-b28
          speakers: [ginger, henry, douglas]
          ensemble: chorus
          text: 哟，谁要当小侍童呀？穿一身白的小侍童！亲爱的小威利，该有多甜呀！
        - id: ch01-b29
          speaker: narrator
          text: 接下来的日子突然忙得很，威廉把大部分时间都用来报复朋友们的侮辱。他一次又一次投入争斗，心里还偷偷盼着，最好能因此永远毁容。那样一来，大人总不能再让他参加婚礼了。可命运并不帮忙。除了额头鼓起一个大包，他什么毛病也没落下。他站在镜子前，若有所思地研究了半天，觉得只要再帮这个包一把，也许自己就不能在那场浪漫盛会上公开露面。他鼓起勇气，英勇地往墙上撞了一次。随之而来的疼痛太厉害，他立刻放弃了这个计划。
    - id: ch02
      title: 多丽塔来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二个星期，多丽塔来了，还带着三岁的弟弟迈克尔。她身材纤细，走路轻盈，一张苍白的小椭圆脸，配着卷曲的黑发。格兰特小姐到门阶上迎接她。
        - id: ch02-b02
          speaker: miss_grant
          text: 我的小伴娘来啦！欢迎你。我们一定会成为最好的朋友，你、我，还有威廉。新娘和她的小侍童、小伴娘，多美呀。威廉毕竟是男孩子，有那么一点不懂事，还不知道这件事有多浪漫。你一定懂，我看看你可爱的小脸就知道。以后我们可以说好多贴心话。
        - id: ch02-b03
          speaker: narrator
          text: 她恰到好处地红了脸，做出羞答答的样子。接着，她看见迈克尔，眼睛忽然眯起来。
        - id: ch02-b04
          speaker: miss_grant
          text: 他穿白缎子也一定很可爱，是不是？让他走在他们中间。我们再买一些白缎子就好。
        - id: ch02-b05
          speaker: narrator
          text: 等大人离开，小伴娘用一双乌黑的眼睛一本正经地望着威廉。长长的睫毛一动不动。她朝格兰特小姐刚消失的门口点了点头。
        - id: ch02-b06
          speaker: dorita
          text: 真是个傻瓜。
        - id: ch02-b07
          speaker: narrator
          text: 威廉一下子有了点精神。
        - id: ch02-b08
          speaker: dorita
          text: 你很想参加那场无聊透顶的婚礼吗？反正我一点也不想。
        - id: ch02-b09
          speaker: narrator
          text: 威廉发现自己终于有了同伴。他不再那么冷淡，带她去了马厩，给她看自己捉来的田鼠。那只田鼠被养在硬纸盒里。
        - id: ch02-b10
          speaker: william
          text: 我正教它跳舞。等它学会了，一定能卖很多钱。会跳舞的老鼠很值钱，你知道吧？舞台上有人表演这个，每晚能赚好多英镑。就算老鼠自己赚不到，让它跳舞的主人也能赚。我把饼干举在它头上，来回移动，它就能学。昨天它咬了我两口。
        - id: ch02-b11
          speaker: narrator
          text: 他得意地亮出受伤的手指，又解释说，自己也是昨天才捉到田鼠。可既然已经教了一天，它今天无论如何也该学会跳舞了。两个人兴冲冲去看，却只找到硬纸盒。盒角已经被咬出一个洞，田鼠没了踪影。多丽塔的失望一点也不比威廉少。这件事反而让威廉更喜欢她。
        - id: ch02-b12
          speaker: narrator
          text: 他开始躲着亨利、道格拉斯和姜吉。那三个人发过誓，婚礼当天一定守在教堂门口，亲眼看他穿着白缎子走下马车。威廉觉得，再深的友谊也经不起这种考验。
        - id: ch02-b13
          speaker: narrator
          text: 他和多丽塔坐到花园墙头。那里又冷又危险，两人却聊起西比尔表姐和她的婚礼。多丽塔说话的方式，让威廉又惊喜又着迷。
        - id: ch02-b14
          speaker: dorita
          text: 她就是个黏糊糊的老疯子。拿命打赌，全世界都找不出第二个这么黏糊的人。她从里到外都黏糊糊的。就算我死在沟里，也不愿让人看见我跟她待在一起。拿撑船篙的尖儿碰她一下，我都不肯。她就是头蠢透了的母牛。哼！
        - id: ch02-b15
          speaker: narrator
          text: 格兰特小姐却私下跟那位很有学问的未婚夫说，这两个孩子的性格叫她有一点失望。至少，对她这样热爱孩子的人来说是如此。她试着探究他们的内心，可那里根本没有可供探究的深处。既没有神秘，也没有迷人的光彩，更没有什么“荣耀的云霞”。他们实在太物质了。
        - id: ch02-b16
          speaker: narrator
          text: 受难的日子越来越近，威廉也越来越消沉。他眼前好像铺开了自己的一生，从少年一直通到成年，再通到老年。那是一片凄凉的荒地，塞满屈辱和羞耻。他的威望和名声会永远毁掉。从今以后，没人记得他当过红印第安人、海盗和亡命徒。大家只会说，他就是那个穿白缎子参加婚礼的男孩。
        - id: ch02-b17
          speaker: narrator
          text: 教堂门口肯定会挤满翻腾的男孩子。方圆几英里，只要认识威廉，哪怕只见过他一面的人，都主动宣布一定到场。他还得跟多丽塔和迈克尔一起坐新娘的马车。威廉一次次想象那辆车停下，自己穿着白缎子走下来，四面八方立刻爆出嘲笑声。光是想想，他的脸颊就热辣辣的。他觉得，往后好几年，自己活着只剩下一件事，就是向这些人报仇。
        - id: ch02-b18
          speaker: narrator
          text: 他恶狠狠盯着那位脸红的准新娘，最绝望的时候甚至想过谋杀。母亲不过轻声提议，小侍童和小伴娘可以合送新娘一件礼物，他就猛地爆发了，把她吓了一跳。
        - id: ch02-b19
          speaker: william
          text: 你们非要我丢一辈子的脸，我才不送她礼物。我倒是知道，自己最想送她什么。
          emotion: angry
        - id: ch02-b20
          speaker: dorita
          text: 对，我也知道自己想送什么。
        - id: ch02-b21
          speaker: narrator
          text: 布朗太太忍住了，没有再问。
    - id: ch03
      title: 婚礼那一天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 婚礼那天天空晴朗，阳光灿烂，可冷得一点也不讲情面。威廉痛苦地申诉，还报出一连串可怕的重病症状。经验丰富的家人谁也没有理会。
        - id: ch03-b02
          speaker: narrator
          text: 三个孩子里，迈克尔最先穿好。他套上那身小得不能再小的白缎礼服，被送进起居室安静地玩。接着轮到威廉。大人找了半天，终于在马厩最黑的角落抓到了这个拒不服从的人。他脸色苍白，一路抗议，却还是被拖去换上白缎衣服，接受他认定的酷刑。
        - id: ch03-b03
          speaker: william
          text: 是啊，我大概很快就要死了。到那时候，你们也许会有一点后悔。不过我已经不在乎了。
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 迈克尔身上还保留着两种原始人的本能。一种是到处找吃的，另一种是找到以后藏起来，免得被敌人发现。那天早些时候，他溜进厨房，正好里面没人。桌上摆着一磅黄油和一大袋橙子，他立刻全部占为己有。
        - id: ch03-b05
          speaker: narrator
          text: 过去的经验告诉他，随时会有人来打断。他赶紧把宝藏搬到起居室的桌子底下。可还没开吃，他就被叫去楼上换典礼服。再回来时，他从头到脚洁白无瑕，发现宝藏还没人动，简直高兴极了。
        - id: ch03-b06
          speaker: narrator
          text: 他决定先吃黄油，一口接一口往嘴里送。实在吃不下的，就顺手抹到脸上和卷发里。忽然，他的良心有点不安，似乎这样会留下太明显的证据。他抓起一块毛茸茸的脚垫，使劲擦脸，又使劲擦头，认真想把一切痕迹都消灭掉。做完这些，他爬上切斯特菲尔德长沙发，坐稳以后又开始对付橙子。
        - id: ch03-b07
          speaker: narrator
          text: 橙子又黄又多汁，还熟得稍微过了头。迈克尔两只胖手一起挥动，拼命往嘴里塞。他年纪虽小，却已经懂得，人生最甜的快乐总是结束得最快。橙汁、毛屑和黄油糊满了圆脸，又顺着两颊滴到白蕾丝领子上。他的嘴边全黄了。他把橙子倒得满座都是，自己坐在一汪果汁里，衣服上粘着汁水、籽和果皮，依旧吃个不停。
    - id: ch04
      title: 白缎脱险
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最先撞见他的是威廉和多丽塔。两人手拉着手，默默安慰彼此，慢吞吞走下楼，像两个闪闪发亮的白缎人。大人也把他们打发进起居室，叫他们等候召唤以前安静地玩。
        - id: ch04-b02
          speaker: william
          text: 玩？我一点儿也不想玩。
        - id: ch04-b03
          speaker: narrator
          text: 他们走到房间里面，看见迈克尔，顿时张着嘴，一句话也说不出来。黄油和毛屑粘在他的卷发和上半张脸上，下半张脸的东西倒被橙汁冲掉了。他的礼服几乎全部湿透，后面尤其彻底。
        - id: ch04-b04
          speaker: william
          text: 我的天！
          emotion: surprised
        - id: ch04-b05
          speaker: dorita
          text: 你这下可要倒大霉了。
        - id: ch04-b06
          speaker: narrator
          text: 迈克尔赶紧离开犯罪现场。
        - id: ch04-b07
          speaker: michael
          text: 迈迈现在乖。
        - id: ch04-b08
          speaker: narrator
          text: 他的口气里全是求饶。威廉和多丽塔看看他留下的座位。那里只剩下一汪压烂的橙肉和果汁。他们又看了看对方。
        - id: ch04-b09
          speaker: dorita
          text: 他去不成婚礼了。
        - id: ch04-b10
          speaker: narrator
          text: 两人再次望向那张沾满橙子的空沙发，又再次互相看了一眼。
        - id: ch04-b11
          speaker: michael
          text: 他现在可乖啦。
        - id: ch04-b12
          speaker: narrator
          text: 小伴娘知道，只要停下来冷静思考，再辉煌的冲动也可能被掐死。她一把抓住威廉的手。
        - id: ch04-b13
          speaker: dorita
          text: 快坐下！
        - id: ch04-b14
          speaker: narrator
          text: 两个人一声不响地坐进迈克尔留下的那片橙肉和果汁里。他们耐心待在那里，一动不动，一直坐到冰冷的湿气穿过白缎衣服，慢慢渗到皮肤上。等到这件事再也不可能补救，威廉才长长叹了一口气。
        - id: ch04-b15
          speaker: william
          text: 这下我们也去不成了。
        - id: ch04-b16
          speaker: narrator
          text: 敞开的房门外，一小群人正朝这里走来。格兰特小姐穿着闪亮的白衣走在最前面，后面是盛装打扮的布朗太太，还有布朗先生。他看起来有些疲倦，也像松了口气，整件事总算快结束了。
        - id: ch04-b17
          speaker: dorita
          text: 那条老沙丁鱼打扮得花枝招展，过来啦。
        - id: ch04-b18
          speakers: [miss_grant, mother, father]
          ensemble: chorus
          text: 威廉！多丽塔！迈克尔！
        - id: ch04-b19
          speaker: narrator
          text: 三个孩子慢慢走过去，听候召唤。格兰特小姐一眼看到迈克尔变成的怪模样，立刻尖叫起来。
        - id: ch04-b20
          speaker: miss_grant
          text: 迈克尔！这个可怕的孩子！
          emotion: surprised
        - id: ch04-b21
          speaker: narrator
          text: 她抱住门框中间，看上去马上要晕倒。迈克尔哭了。
        - id: ch04-b22
          speaker: michael
          text: 可怜的迈迈，他好难受。
          emotion: sad
        - id: ch04-b23
          speaker: narrator
          text: 大人赶紧把他带走。
        - id: ch04-b24
          speaker: mother
          text: 没关系，亲爱的，另外两个看起来很可爱。
          emotion: calm
        - id: ch04-b25
          speaker: narrator
          text: 可布朗先生已经往房里多走了几步。从后面看过去，小侍童和小伴娘的模样实在惊人。
        - id: ch04-b26
          speaker: father
          text: 什么？哪儿可爱？
          emotion: surprised
        - id: ch04-b27
          speaker: narrator
          text: 威廉和多丽塔本能地转过身。布朗太太和新娘也终于看到了。新娘又尖叫起来，这一声更尖，也更狂乱。
        - id: ch04-b28
          speaker: miss_grant
          text: 哦，他们到底干了什么？这两个可恶的孩子！偏偏我现在最需要冷静，一切都要靠我保持冷静。偏偏——
          emotion: angry
        - id: ch04-b29
          speaker: william
          text: 我们本来在房间里走来走去。后来坐到这张切斯特菲尔德长沙发上，上面有这些东西，就全粘到衣服上了。
        - id: ch04-b30
          speaker: narrator
          text: 他的声音冷冰冰的，一点起伏也没有，一口气把事情解释完了。
        - id: ch04-b31
          speaker: mother
          text: 那你们为什么要坐下？
        - id: ch04-b32
          speaker: william
          text: 我们在屋里走来走去，后来累了，就坐到沙发上。上面有这些东西，所以才粘到——
        - id: ch04-b33
          speaker: mother
          text: 可你们没看见沙发上有东西吗？
        - id: ch04-b34
          speaker: narrator
          text: 威廉认真想了想。
        - id: ch04-b35
          speaker: william
          text: 嗯，我们那时正在屋里走来走去。后来觉得累了，就坐——
        - id: ch04-b36
          speaker: mother
          text: 别再重复这套话了。
        - id: ch04-b37
          speaker: miss_grant
          text: 能不能给他们做两件斗篷？长长地垂下来，把后面全遮住。用不了多少时间吧？
        - id: ch04-b38
          speaker: narrator
          text: 新娘几乎是在哀号。布朗先生掏出怀表。
        - id: ch04-b39
          speaker: father
          text: 马车已经等了一刻钟，我们没有时间做斗篷。走吧，亲爱的。这件事等仪式结束以后再查。至于你们三个，当然不能再去婚礼了，只好留在家里。
        - id: ch04-b40
          speaker: narrator
          text: 最后一句话，他是严厉地对着威廉说的，目光也落在威廉身上。可那严厉的声音里，不知怎么又藏着一丝羡慕，连他自己大概都没有察觉。
        - id: ch04-b41
          speaker: miss_grant
          text: 可我真的那么想要一个小侍童。
          emotion: sad
        - id: ch04-b42
          speaker: narrator
          text: 格兰特小姐满腹委屈地走了。欢乐和希望一下子跳回威廉心里。车轮声沿着车道远去，他立刻在草坪上连翻几个筋斗。接着，他看见那根受冷落已久的登山杖还靠在墙边。
        - id: ch04-b43
          speaker: william
          text: 来呀！我教你玩一个我发明的游戏，叫登山！
          emotion: happy
        - id: ch04-b44
          speaker: narrator
          text: 多丽塔看着他把木板斜靠到墙上，准备开始危险的攀登。
        - id: ch04-b45
          speaker: dorita
          text: 你真傻。我知道一种登山游戏，比你这个破玩意儿强十倍。
    - id: ch05
      title: 更好的登山游戏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 威廉顺从地站到了学生的位置。单凭这一点，就能看出这位小伴娘有怎样的品格，又有怎样的感召力。
        - id: ch05-b02
          speaker: narrator
          text: 还有一件事必须说明。布朗家的仆人都忙着往花园的大帐篷里摆茶点，前厅一个人也没有。
        - id: ch05-b03
          speaker: narrator
          text: 大约一刻钟以后，登山游戏已经玩得热火朝天。楼梯最下面几级铺着布朗夫妇的床垫，上面是格兰特小姐的，再往上是威廉的，最顶上才是多丽塔的。所有卧室里，被褥都乱七八糟扔在地板上。
        - id: ch05-b04
          speaker: narrator
          text: 为了让这座“山”稳住，他们在床垫末端钉了几枚钉子，钉子穿过床垫，一直扎进楼梯。两个人还穿着典礼用的白缎衣服，脚上只剩袜子，就这样在山上爬来爬去。他们不时脚下一滑，从高处一路滚到楼梯脚下，正好掉进堆在那里的枕头和长枕里。那些东西也是他们从每张床上搜刮来的，根本没管原来属于谁。
        - id: ch05-b05
          speaker: narrator
          text: 两个人笑得又疯又响，轮流使用登山杖。这东西实在好用，尖头能牢牢扎进床垫。威廉站到山顶，手里握着登山杖。他浑身发热，喘着粗气，停下来歇了一会儿。
        - id: ch05-b06
          speaker: narrator
          text: 他很清楚，惩罚已经不远了。准确地说，惩罚这时就在附近的教堂，再过几分钟就会坐着马车回到家。他知道，白缎衣服上的黄污渍还等着他交代。家里所有的床垫也被搬下楼，钉在楼梯上，用在一种绝对算不上正当的用途上。这两件事随便哪一件，都足以让大人追究很久。可眼下，他一点也不在乎。
        - id: ch05-b07
          speaker: narrator
          text: 他心里只看见一群男孩子聚在教堂外面，眼巴巴盯着一辆马车，等那个穿白缎子的小侍童露面。车门终于打开，下来的人却只有格兰特小姐、布朗太太和布朗先生。朋友们苦等一场，却什么也没看到。威廉的一生重新在眼前铺开，又明亮，又灿烂，还染上了玫瑰色。胜利的笑容弯起他的嘴角。
        - id: ch05-b08
          speaker: william
          text: 哟，是谁在教堂外面等了半天，结果根本没等到人？
          emotion: happy
        - id: ch05-b09
          speaker: william
          text: 星期三你们在教堂门口等我，没冻出重感冒吧？
          emotion: happy
        - id: ch05-b10
          speaker: william
          text: 有些人真好骗。我敢说，你们一定都信了我星期三会去。
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: 这些得意的话，一句接一句，悠然飘过他的脑海。
        - id: ch05-b12
          speaker: dorita
          text: 喂，该轮到我用那根带尖的棍子了。
        - id: ch05-b13
          speaker: narrator
          text: 威廉默默把登山杖递给她。
        - id: ch05-b14
          speaker: dorita
          text: 我问你，你觉得结婚这回事怎么样？
        - id: ch05-b15
          speaker: william
          text: 不知道。
        - id: ch05-b16
          speaker: dorita
          text: 要是我非结婚不可，那跟别人比起来，我宁愿跟你结婚。
        - id: ch05-b17
          speaker: william
          text: 我也不反对。不过得穿平常的衣服。
        - id: ch05-b18
          speaker: narrator
          text: 小侍童这话说得很有骑士风度。多丽塔才答了一声“当然”，脚下一滑，整个人滚进了枕头堆。她的声音从里面传出来，虽然闷闷的，却依旧清楚。
        - id: ch05-b19
          speaker: dorita
          text: 我敢拿命保证，当然得穿平常的衣服。
