  chapters:
    - id: ch01
      title: A Page for the Wedding
      blocks:
        - id: ch01-b01
          speaker: miss_grant
          text: "I'd simply love to have a page. A wedding seems so second-rate without one."
        - id: ch01-b02
          speaker: narrator
          text: Mrs. Brown, Miss Grant's aunt and hostess, looked across the tea table at her younger son. William was devouring iced cake with the fearless disregard for consequences that belongs to youth.
        - id: ch01-b03
          speaker: mrs_brown
          text: "There's William, I suppose. Though you've had more than enough cake, William."
        - id: ch01-b04
          speaker: narrator
          text: Miss Grant studied him. At that moment his face showed perfect innocence suffering cruel persecution.
        - id: ch01-b05
          speaker: william
          text: "Enough? I've hardly had any! I'd only just started when you looked at me. It's plain cake, so it can't hurt me. I wouldn't eat it if it could. Sugar's good for you. Animals eat it to stay healthy. Horses eat it, and it doesn't hurt them. Parrots and things eat it, and it doesn't hurt them, and—"
        - id: ch01-b06
          speaker: mrs_brown
          text: "Please don't argue, William."
        - id: ch01-b07
          speaker: narrator
          text: She sounded tired. Everyone in William's family knew and feared his gift for argument. Miss Grant finished studying his face and announced her conclusion.
        - id: ch01-b08
          speaker: miss_grant
          text: "His face is so modern. And a page ought to be medieval and romantic."
        - id: ch01-b09
          speaker: narrator
          text: The wedding was to take place from Mrs. Brown's house, and she looked worried.
        - id: ch01-b10
          speaker: mrs_brown
          text: "There is nothing medieval or romantic about William."
        - id: ch01-b11
          speaker: miss_grant
          text: "Then what about his cousin Dorita? They're both eleven, aren't they? Picture the two of them in white satin, carrying bunches of holly. Could Dorita stay here for the ceremony? And if you let William's hair grow for a while, perhaps he wouldn't look too bad."
        - id: ch01-b12
          speaker: narrator
          text: Miss Grant always called her wedding “the ceremony.” While these plans were being made, William had gone into the garden with his three closest friends, Ginger, Henry, and Douglas. They were playing his newest game, mountaineering.

            A plank leaned against the garden wall. The four boys scrambled up it tied together with rope, feathers stuck in their caps. William wore an old golf cap belonging to his mother and imagined he looked heroic and impressive. They never reached the top. Their feet slipped, they rolled down the plank, and they landed in one bruised heap. The bruises only made the game better. To William, a game was exciting mainly when it put life and limb in danger.

            An old alpenstock had inspired the whole thing. A friend of Mr. Brown's had carelessly given it to William. Before the family discovered the gift, he had ruined the paint on the staircase and the upstairs hall. The alpenstock was taken away for a week, then returned on the strict condition that it never enter the house again. So the boys climbed their plank outdoors. They took turns with the alpenstock, though William claimed two turns in a row because it belonged to him.
        - id: ch01-b13
          speaker: narrator
          text: Mrs. Brown approached him about becoming a page with some anxiety. In fact, anxiety was his family's usual attitude whenever they approached William.
        - id: ch01-b14
          speaker: mrs_brown
          text: "Would you like to go to Cousin Sybil's wedding?"
        - id: ch01-b15
          speaker: william
          text: "No. I wouldn't."
        - id: ch01-b16
          speaker: mrs_brown
          text: "But wouldn't you like dressing up?"
        - id: ch01-b17
          speaker: william
          text: "As a Red Indian?"
        - id: ch01-b18
          speaker: narrator
          text: Hope flashed across his face.
        - id: ch01-b19
          speaker: mrs_brown
          text: "Well, no. Not exactly."
        - id: ch01-b20
          speaker: william
          text: "A pirate, then?"
        - id: ch01-b21
          speaker: mrs_brown
          text: "Not quite."
        - id: ch01-b22
          speaker: william
          text: "I'll go as a Red Indian or a pirate. I won't go as anything else."
        - id: ch01-b23
          speaker: miss_grant
          text: "William, a page is a medieval, romantic idea. It has all the glamour of chivalry. Surely that should appeal to a boy your age."
        - id: ch01-b24
          speaker: narrator
          text: William turned his unreadable face toward her and gave her an icy stare. Later, Mrs. Brown and Miss Grant discussed the costume in private.
        - id: ch01-b25
          speaker: mrs_brown
          text: "I have some lovely white silk stockings that could be tights. Ethel has a satin petticoat that's beginning to wear through in one spot. We could make some kind of costume from that, couldn't we? Then we'd only need a little more white satin and some patterns."
        - id: ch01-b26
          speaker: william
          text: "No! I won't wear Ethel's old clothes. You all want me to look ridiculous, and you don't care how ridiculous I look. I'll spend the rest of my life being ridiculous because I went around in Ethel's old clothes. I won't do it. I won't go to any stupid wedding. I don't want to see Cousin Sybil get married, and you can't make me look ridiculous in Ethel's old clothes!"
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: They reasoned with him, coaxed him, and threatened him. Nothing worked. In the end, parental authority won. William gave in and moved through his world like a martyr on his way to the stake. Even mountaineering lost its charm. The alpenstock lay forgotten against the garden wall. His closest friends offered no comfort at all.
        - id: ch01-b28
          speakers: [henry, ginger, douglas]
          ensemble: chorus
          text: "Hey! Who's going to be a page? Oh, crumbs, a page dressed all in white! Dear little Willie, won't he look swe-e-e-et?"
        - id: ch01-b29
          speaker: narrator
          text: William's days became very busy, mostly because he had to avenge these insults. Each taunt demanded an answer, and there were plenty of taunts. Secretly, he hoped all the fighting would leave him disfigured for life. Then, surely, no one could expect him to appear at a wedding. But apart from a large bump on his forehead, he survived unharmed and looked much as he had before.

            He examined the bump thoughtfully in the mirror. With a little encouragement, he decided, it might grow impressive enough to make any public appearance at a romantic ceremony impossible. He made one heroic attempt to bang it against the wall. The pain was so immediate that he abandoned the plan.
    - id: ch02
      title: Dorita Arrives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Dorita arrived the next week with her three-year-old brother, Michael. She was slim and graceful, with a pale oval face and dark curls. Miss Grant met them on the doorstep.
        - id: ch02-b02
          speaker: miss_grant
          text: "Well, here's my little maid of honor! Welcome, darling. You and I and William are going to be such friends—the bride and her little page and maid of honor. William is a boy, so he's just a tiny bit thoughtless. He doesn't understand all the romance. But you will. I can see it in your dear little face. We'll have some wonderful talks."
        - id: ch02-b03
          speaker: narrator
          text: She blushed prettily when she called herself the bride. Then she noticed Michael, and her eyes narrowed with a sudden new idea.
        - id: ch02-b04
          speaker: miss_grant
          text: "Wouldn't he look sweet in white satin, too? He could walk between them. We could buy a little more satin."
        - id: ch02-b05
          speaker: narrator
          text: Once the adults had gone, the maid of honor turned her demure, dark eyes on William. She nodded toward the door where Miss Grant had disappeared.
        - id: ch02-b06
          speaker: dorita
          text: "What a soft-headed idiot."
        - id: ch02-b07
          speaker: narrator
          text: Her voice was perfectly clear and refined. William felt vaguely encouraged.
        - id: ch02-b08
          speaker: dorita
          text: "Are you excited about this stupid wedding business? Because I'm certainly not."
        - id: ch02-b09
          speaker: narrator
          text: William knew at once that he had found a kindred spirit. He warmed enough to take her to the stable and show her a field mouse he had caught in a cardboard box.
        - id: ch02-b10
          speaker: william
          text: "I'm teaching it to dance. Once it dances properly, it ought to make loads of money. Dancing mice do. They put them onstage, you know, and people onstage earn pounds and pounds every night. So mice must earn it too. Well, the people who own the dancing mice do. I hold a biscuit over its head and move it around. It bit me twice yesterday. Look at my finger. I only caught it yesterday, so it should learn today."
        - id: ch02-b11
          speaker: narrator
          text: He proudly displayed his injured finger. But when they looked in the box, they found only a hole gnawed through one corner. Dorita's deep disappointment made William like her even more.

            He kept away from Henry, Douglas, and Ginger. They had sworn to wait at the church door and watch him climb from the carriage in all the glory of white satin. William knew their friendship could not survive such a moment.

            Instead, he sat with Dorita on the cold, dangerous top of the garden wall, where one wrong movement could send them tumbling off. There they discussed Cousin Sybil and the approaching wedding. William listened with growing pleasure. Dorita's extraordinary language fascinated and delighted him.
        - id: ch02-b12
          speaker: dorita
          text: "She's a soppy old lunatic. The soppiest old lunatic anywhere on this earth, you bet your life. She's made of sop. I wouldn't be caught dead in a ditch with her. I wouldn't touch her with the end of a barge pole. She's a complete idiot. Hmph!"
        - id: ch02-b13
          speaker: narrator
          text: Meanwhile, Miss Grant confided in her intellectual fiancé.
        - id: ch02-b14
          speaker: miss_grant
          text: "Those children are a little disappointing in character, at least to a child lover like me. I've tried to explore their depths, but they don't seem to have any. There's no mystery in them, no glamour, no clouds of glory. They're so terribly material."
        - id: ch02-b15
          speaker: narrator
          text: |-
            The ordeal came closer, and William's spirits sank lower. He saw his entire life ahead of him—boyhood, manhood, old age—all dreary, empty, and full of shame. His reputation would be ruined forever. He would no longer be William the Red Indian, William the pirate, William the daredevil. He would only be the Boy Who Went to a Wedding Dressed in White Satin.

            He expected a heaving crowd of boys at the church door. Every boy for miles who knew him, even by sight, had promised to be there. William was supposed to ride with Dorita and Michael in the bride's carriage. He could already imagine stepping out while the jeers rose around him. His cheeks burned at the thought. For years afterward, his whole life would be spent avenging insults.

            He watched the blushing bride-to-be wherever she went and followed her with a murderous glare. In his darkest moments, he even considered murder. Then his mother mildly suggested that the page and maid of honor should give the bride a wedding present. The very idea released all the anger he had been storing up. William's furious answer horrified her.
        - id: ch02-b16
          speaker: william
          text: "You're making me look ridiculous for the rest of my life. I'm not giving her any present. I know what I'd like to give her."
          emotion: angry
        - id: ch02-b17
          speaker: dorita
          text: "Yes. And I know what I'd give her too."
        - id: ch02-b18
          speaker: narrator
          text: Mrs. Brown decided not to ask what either child meant.
    - id: ch03
      title: The Wedding Morning
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The wedding day arrived cold, bright, and sunny. William described agonies and announced several alarming symptoms of serious disease. His experienced family ignored every one.

            Michael was dressed first in his tiny white satin suit and sent to the morning room to play quietly. Then the family found William hiding in the darkest corner of the stable. They captured him and dragged him away, pale and protesting, to be dressed for the slaughter.
        - id: ch03-b02
          speaker: william
          text: "Yes, and I'll probably die soon. Then maybe you'll be sorry. I won't care by then."
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: Michael still possessed two instincts from primitive man. One was to hunt for food wherever he could find it. The other was to hide his food from every possible enemy once he had secured it.

            Earlier that day, he had visited the kitchen when no one was there. On the table sat a pound of butter and a large bag of oranges. Michael took both. Afraid someone might interrupt him, as experience had taught him they often did, he carried his treasure under the morning-room table. Before he could eat any of it, he was called upstairs and dressed for the ceremony.

            When he returned in spotless white satin, he was delighted to find the food still hidden. He began with the butter. What he could not eat, he spread over his face and curly hair. Then guilt suddenly troubled him. He rubbed his face and hair hard with a woolly mat, trying to wipe away every sign of the crime.

            After that, he sat on the Chesterfield and started on the oranges. They were yellow, juicy, and a little overripe. He pushed them into his mouth with both chubby hands. Even at three years old, Michael understood that life's sweetest pleasures end quickly.

            Orange juice mixed with butter and wool fuzz across his round face. It ran down both cheeks and dripped steadily onto his white lace collar. His mouth and everything around it turned completely yellow. He had emptied all the oranges from the bag, and they lay around him across the seat. He sat in a growing pool of juice. His satin suit became covered in juice, seeds, and bits of peel. The wetness soaked into the cloth beneath him, but still he kept eating.
        - id: ch03-b04
          speaker: narrator
          text: William and Dorita were the first to interrupt him. They came slowly downstairs, holding hands in silent sympathy, two shining figures in white satin. They walked into the morning room. Like Michael, they had been ordered to play quietly until they were called.
        - id: ch03-b05
          speaker: william
          text: "Play? I don't exactly feel like playing."
        - id: ch03-b06
          speaker: narrator
          text: They saw Michael and stopped with their mouths open. Clumps of butter and pieces of wool clung to his curls and the top half of his face. Orange juice had washed them from the bottom half. His suit was almost completely covered, and the back of it was soaked through.
        - id: ch03-b07
          speaker: william
          text: "Crumbs!"
          emotion: surprised
        - id: ch03-b08
          speaker: dorita
          text: "You're going to catch it."
        - id: ch03-b09
          speaker: narrator
          text: Michael backed away quickly from the evidence.
        - id: ch03-b10
          speaker: michael
          text: "Micky good now."
        - id: ch03-b11
          speaker: narrator
          text: They looked at the place he had left. The seat held a puddle of juice and crushed orange pieces. Then they looked at each other.
        - id: ch03-b12
          speaker: dorita
          text: "He can't go now."
        - id: ch03-b13
          speaker: narrator
          text: Once more they looked at the orange-covered Chesterfield, then at one another.
        - id: ch03-b14
          speaker: michael
          text: "He quite good now."
        - id: ch03-b15
          speaker: narrator
          text: Dorita knew that careful thought can kill the finest impulse. She grabbed William's hand before either of them could hesitate.
        - id: ch03-b16
          speaker: dorita
          text: "Sit down. Quick!"
        - id: ch03-b17
          speaker: narrator
          text: Without saying a word, they sat. They stayed there until the cold wetness soaked through the white satin and reached their skin. William let out a deep sigh.
        - id: ch03-b18
          speaker: william
          text: "We can't go now."
        - id: ch03-b19
          speaker: narrator
          text: Through the open door, they saw a small group approaching. Miss Grant came first, shining in white. Mrs. Brown followed in her finest clothes. Beside her was Mr. Brown, whose face showed weariness mixed with relief that the whole business would soon be finished.
        - id: ch03-b20
          speaker: dorita
          text: "Here comes the old sardine, all dressed up."
        - id: ch03-b21
          speakers: [miss_grant, mrs_brown, mr_brown]
          ensemble: chorus
          text: "William! Dorita! Michael!"
        - id: ch03-b22
          speaker: narrator
          text: Slowly, William, Dorita, and Michael answered the call. Miss Grant took one look at the strange object Michael had become and screamed.
        - id: ch03-b23
          speaker: miss_grant
          text: "Michael! Oh, you dreadful child!"
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: She clutched the middle of the door and seemed ready to faint. Michael began to cry.
        - id: ch03-b25
          speaker: michael
          text: "Poor Micky. He feels so sick."
          emotion: sad
        - id: ch03-b26
          speaker: narrator
          text: They hurried him away.
        - id: ch03-b27
          speaker: mrs_brown
          text: "Never mind, dear. The other two look sweet."
        - id: ch03-b28
          speaker: narrator
          text: Mr. Brown had walked farther into the room. From there, he suddenly saw the page and maid of honor from behind.
        - id: ch03-b29
          speaker: mr_brown
          text: "What? Where did—"
          emotion: surprised
        - id: ch03-b30
          speaker: narrator
          text: William and Dorita turned automatically. Now Mrs. Brown and the bride could see what had startled him. Miss Grant screamed again, louder and wilder than before.
        - id: ch03-b31
          speaker: miss_grant
          text: "Oh, what have they done? Those miserable children! And I wanted to feel calm. Everything depends on my feeling calm right now. Just when—"
          emotion: angry
        - id: ch03-b32
          speaker: william
          text: "We were walking around the room, and then we sat on the Chesterfield because we were tired, and this stuff was on it, and it got all over our clothes."
        - id: ch03-b33
          speaker: narrator
          text: He delivered the whole explanation in one flat, stony breath.
        - id: ch03-b34
          speaker: mrs_brown
          text: "Why did you sit down?"
        - id: ch03-b35
          speaker: william
          text: "We were walking around, and we got tired, and then we sat on the Chesterfield, and this stuff was there, and it got—"
        - id: ch03-b36
          speaker: mrs_brown
          text: "Stop! Didn't you see it?"
        - id: ch03-b37
          speaker: narrator
          text: William considered the question.
        - id: ch03-b38
          speaker: william
          text: "Well, we were just walking around the room, and we got tired, so we sat—"
        - id: ch03-b39
          speaker: mrs_brown
          text: "Stop saying that."
        - id: ch03-b40
          speaker: miss_grant
          text: "Couldn't we make cloaks? Long ones that would hang down and hide the backs of their clothes? It wouldn't take very long."
          emotion: sad
        - id: ch03-b41
          speaker: narrator
          text: Mr. Brown pulled out his watch.
        - id: ch03-b42
          speaker: mr_brown
          text: "The carriage has already waited fifteen minutes. We haven't a moment to spare. Come along, my dear. We'll investigate after the service. William and Dorita obviously can't go. They must stay home."
        - id: ch03-b43
          speaker: narrator
          text: He fixed William with a stern look, though his voice held an unconscious touch of envy.
        - id: ch03-b44
          speaker: miss_grant
          text: "And I wanted a page so very much."
          emotion: sad
        - id: ch03-b45
          speaker: narrator
          text: She turned away. The sound of carriage wheels moved down the drive, and joy and hope rushed back into William. He turned several somersaults across the lawn. Then he spotted his long-neglected alpenstock leaning against the wall.
    - id: ch04
      title: Mountaineering Indoors
      blocks:
        - id: ch04-b01
          speaker: william
          text: "Come on! I'll teach you a game I invented. It's mountaineering."
          emotion: happy
        - id: ch04-b02
          speaker: narrator
          text: Dorita watched him lean a plank against the wall and begin the dangerous climb.
        - id: ch04-b03
          speaker: dorita
          text: "You're an idiot. I know a mountaineering game ten times better than that old thing."
        - id: ch04-b04
          speaker: narrator
          text: It says a great deal about the maid of honor's character and force of will that William meekly allowed her to become the teacher.

            The Brown family's servants were all outside, arranging refreshments in a marquee in the garden. The front hall stood completely empty.

            Fifteen minutes later, the new mountaineering game was going at full speed. The mattress from Mr. and Mrs. Brown's bed lay across the lowest stairs. Above it came the mattress from Miss Grant's bed, then William's, and finally Dorita's at the top. In every bedroom, blankets and sheets were scattered over the floor. A few nails driven through the mattress ends into the stairs kept the mountain steady.

            Still dressed in their ceremonial white satin, William and Dorita climbed in their stocking feet. Again and again they slipped and rolled down onto a heap of pillows and bolsters at the bottom. They had taken those from every bed without discrimination. Their laughter was wild and deafening.

            They took turns using the alpenstock. It helped enormously, because its sharp point could catch firmly in the mattresses. At last William stood at the summit, hot and breathless, with the alpenstock in his hand. He stopped to recover.
        - id: ch04-b05
          speaker: narrator
          text: |-
            William knew punishment was close. More exactly, it was in the church nearby and would return by carriage within minutes. He knew the adults still wanted an explanation for the yellow stains. He also knew that family mattresses were not supposed to be nailed to a staircase.

            None of it mattered to him. In his imagination, he saw only a crowd of small boys packed outside the church door. Their eager eyes were fixed on the arriving carriage, waiting for a white-satin page they meant to torment. But the only people who stepped out were Miss Grant, Mrs. Brown, and Mr. Brown. William's whole future, which had looked so gray before, now stretched ahead of him bright and rosy again. A triumphant smile bent his lips.
        - id: ch04-b06
          speaker: william
          text: "Hey! Who waited at a church for somebody who never came? I hope you didn't catch a bad cold waiting for me at the church door on Wednesday. Some people are easy to fool. I bet every one of you believed I was coming."
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: These satisfying remarks drifted through his mind.
        - id: ch04-b08
          speaker: dorita
          text: "Hey, it's my turn with the spiked stick."
        - id: ch04-b09
          speaker: narrator
          text: William handed it over without a word.
        - id: ch04-b10
          speaker: dorita
          text: "What do you think about this whole marriage business?"
        - id: ch04-b11
          speaker: william
          text: "Dunno."
        - id: ch04-b12
          speaker: dorita
          text: "If I had to get married, I'd just as soon marry you as anybody else."
        - id: ch04-b13
          speaker: william
          text: "I wouldn't mind. But only in ordinary clothes."
        - id: ch04-b14
          speaker: narrator
          text: Dorita lost her footing and rolled down into the pile of pillows. Her answer came up muffled but as clear as ever.
        - id: ch04-b15
          speaker: dorita
          text: "Oh, yes. You bet your life. Ordinary clothes."
