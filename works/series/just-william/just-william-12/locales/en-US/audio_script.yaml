  chapters:
    - id: ch01
      title: A Boy Without a Bow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mr. Brown put the bow and arrow at the very back of the library cupboard. Then he locked the door without a word. William watched every move with large, gloomy eyes.
        - id: ch01-b02
          speaker: mr_brown
          text: "Three windows and Mrs. Clive's cat, all in one morning."
        - id: ch01-b03
          speaker: william
          text: "I didn't mean to hit the cat. Honest, I didn't. I wouldn't go around bothering cats. They get too mad. It just got in the way, and I couldn't stop the arrow. I didn't mean to break the windows, either. I wasn't aiming at them. I haven't hit one thing I aimed at yet. I just need practice. It's a knack."
        - id: ch01-b04
          speaker: narrator
          text: Mr. Brown slipped the key into his pocket.
        - id: ch01-b05
          speaker: mr_brown
          text: "You won't learn that knack by practicing with this bow."
        - id: ch01-b06
          speaker: narrator
          text: William wandered into the garden and looked sadly at the wall. The little girl next door was away, so there was nobody to sympathize with him. Fate seemed against him. He sighed, went through the gate, and walked down the road with his hands in his pockets.
        - id: ch01-b07
          speaker: narrator
          text: Without his bow and arrow, life looked empty. Ginger would have his. Henry would have his. Douglas would have his. Bows and arrows were the fashion, and William alone would be an outcast. If only one of the others would break a window, or hit some silly cat that did not know enough to move.
        - id: ch01-b08
          speaker: narrator
          text: He sat on a stile with his elbows on his knees and his chin in his hands. Life was simply not worth living.
        - id: ch01-b09
          speaker: william
          text: "Rotten old cat! I didn't even hurt it. It only screamed and carried on to be spiteful. And windows! Glass is cheap, and it's easy to put in. I could fix them myself if I had the stuff. I could—"
        - id: ch01-b10
          speaker: narrator
          text: Something came dancing down the road. It had fox-terrier ears, a retriever's nose, a collie's tail, and a body that was a little like a dachshund's. Every bit of it trembled with delight. It stopped before William, barked a cheerful greeting, and waited. It was a mongrel and proud of it.
        - id: ch01-b11
          speaker: william
          text: "Rats! Go get 'em!"
        - id: ch01-b12
          speaker: narrator
          text: The dog sprang forward and crouched, ready for a game. William broke a stick from the hedge and threw it. The dog raced after it, barked, shook it, tossed it up, caught it, growled over it, and finally carried it back. Then it stood panting and grinning, asking for more.
        - id: ch01-b13
          speaker: narrator
          text: William's spirits rose at once. He climbed down and looked at the collar. One word was stamped on it. Jumble.
        - id: ch01-b14
          speaker: william
          text: "Hey, Jumble!"
        - id: ch01-b15
          speaker: narrator
          text: William started along the road. Jumble leaped around him, ran ahead, came tearing back, worried his boots, and begged for another stick. He caught that one, rolled over with it, chewed it to pieces, and laid the remains at William's feet.
        - id: ch01-b16
          speaker: william
          text: "Good old boy! Come on, Jumble."
        - id: ch01-b17
          speaker: narrator
          text: They went through the village together. William wore the proud but careless look of a boy who owned a dog and did not need anyone to know it. Whenever Jumble strayed into a ditch, William gave a commanding whistle. He had practiced that whistle in private for the wonderful day when Fate finally gave him a dog. Until now, Fate, in the shape of his parents, had ignored every plea.
        - id: ch01-b18
          speaker: narrator
          text: It was a glorious morning. Jumble swam in the pond and fetched sticks from it. He shook water all over William, chased a hen, got chased by a cat, barked at some cows, and pulled down a curtain drying in a cottage garden. He was mischievous, loving, funny, and impossible to resist. Best of all, he adopted William completely. Each time William turned a corner, he waited breathlessly. Every time, the lively little dog came racing after him.
    - id: ch02
      title: The Dog Upstairs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: William arrived late for lunch. His parents, Robert, and Ethel had already begun. He slipped quietly into his chair while Mr. Brown read the second of his two daily newspapers.
        - id: ch02-b02
          speaker: mrs_brown
          text: "William, please come on time. And brush your hair before you sit down."
        - id: ch02-b03
          speaker: narrator
          text: William raised one hand to smooth his hair. Then he noticed its color and quickly lowered it. Mrs. Brown turned back to Ethel, who was telling her about the artist renting Lavender Cottage.
        - id: ch02-b04
          speaker: mrs_brown
          text: "An artist? How nice. Have they moved in? William, sit still, please."
        - id: ch02-b05
          speaker: ethel
          text: "Yes, they've rented it furnished for two months, I think. Oh, just look at William's hands!"
        - id: ch02-b06
          speaker: narrator
          text: William hid them under the table and glared at her.
        - id: ch02-b07
          speaker: mrs_brown
          text: "Go wash your hands, dear."
        - id: ch02-b08
          speaker: narrator
          text: Eleven years as William's mother had taught her patience. William got up reluctantly.
        - id: ch02-b09
          speaker: william
          text: "They're not dirty. Anyway, they've been worse before, and nobody said anything. I can't wash them all the time. Some hands get dirty faster, and washing only makes them worse, and—"
        - id: ch02-b10
          speaker: narrator
          text: Ethel groaned. Mr. Brown lowered his paper. William left quickly, though he managed to look dignified.
        - id: ch02-b11
          speaker: ethel
          text: "And look at his boots! They're covered in mud. His socks are soaking wet, too. He must have gone right into the pond."
        - id: ch02-b12
          speaker: narrator
          text: William heard no more. At moments like this, he truly disliked Ethel. A few minutes later he returned shining clean, with his hair brushed fiercely away from his face.
        - id: ch02-b13
          speaker: ethel
          text: "His nails."
        - id: ch02-b14
          speaker: mrs_brown
          text: "Go on about the new neighbors. William, hold your knife properly."
        - id: ch02-b15
          speaker: narrator
          text: William ate in silence. When the meal was nearly over, he made his great announcement.
        - id: ch02-b16
          speaker: william
          text: "I've got a dog."
        - id: ch02-b17
          speakers: [robert, ethel]
          ensemble: duo
          text: "What kind? Who gave it to you?"
        - id: ch02-b18
          speaker: william
          text: "Nobody gave it to me. I just got it. It followed me this morning, and I couldn't make it leave. It went all around the village with me and came home, too. I couldn't get rid of it."
        - id: ch02-b19
          speaker: mrs_brown
          text: "Where is it now?"
        - id: ch02-b20
          speaker: william
          text: "In the back garden."
        - id: ch02-b21
          speaker: narrator
          text: Mr. Brown folded his newspaper.
        - id: ch02-b22
          speaker: mr_brown
          text: "Digging up my flower beds, I suppose."
        - id: ch02-b23
          speaker: william
          text: "No, he's tied up. I tied him to the tree in the middle of the rose bed."
        - id: ch02-b24
          speaker: mr_brown
          text: "The rose bed! Good Lord."
        - id: ch02-b25
          speaker: robert
          text: "Did you feed him?"
        - id: ch02-b26
          speaker: william
          text: "Yes. I found a few old things in the pantry."
        - id: ch02-b27
          speaker: narrator
          text: William avoided his mother's eyes. Mr. Brown checked his watch and stood up.
        - id: ch02-b28
          speaker: mr_brown
          text: "Take that dog to the police station this afternoon."
        - id: ch02-b29
          speaker: william
          text: "The police station? He's not lost. He didn't belong to anybody. Well, not before. Poor thing. He doesn't need much. He could sleep in my room and eat scraps."
        - id: ch02-b30
          speaker: narrator
          text: Mr. Brown left without replying.
        - id: ch02-b31
          speaker: mrs_brown
          text: "You have to take him, William, so go soon. You know the way, don't you? Would you like me to come?"
        - id: ch02-b32
          speaker: william
          text: "No, thank you."
        - id: ch02-b33
          speaker: narrator
          text: A few minutes later William set out for the police station. Jumble followed happily, with no idea what was meant to happen. William looked hard and grim until they reached the gate. Then he stopped. Jumble put his paws down for a game and wagged his tail.
        - id: ch02-b34
          speaker: william
          text: "Well, here you are. This is the police station."
        - id: ch02-b35
          speaker: narrator
          text: Jumble barked sharply, as if asking William to hurry up with a stick or a race.
        - id: ch02-b36
          speaker: william
          text: "Go on, then. Go inside."
        - id: ch02-b37
          speaker: narrator
          text: Jumble attacked a large stone in the road instead. He rolled it with his paws and chased it with fierce little growls.
        - id: ch02-b38
          speaker: william
          text: "It's the police station. You can go in if you want."
        - id: ch02-b39
          speaker: narrator
          text: William turned and walked home without looking back. He went slowly, calling Jumble's name and giving short, commanding whistles. Jumble trotted cheerfully behind him. No one was in the garden, hall, or stairway. For once, Fate was on William's side.
        - id: ch02-b40
          speaker: narrator
          text: At tea, William appeared scrubbed and brushed. He wore the showy look of goodness that his family connected with his boldest schemes.
        - id: ch02-b41
          speaker: mr_brown
          text: "Did you take the dog to the police station?"
        - id: ch02-b42
          speaker: narrator
          text: William coughed and stared at his plate.
        - id: ch02-b43
          speaker: william
          text: "Yes, Father."
        - id: ch02-b44
          speaker: mr_brown
          text: "What did they say?"
        - id: ch02-b45
          speaker: william
          text: "Nothing, Father."
        - id: ch02-b46
          speaker: mr_brown
          text: "Then I suppose I'll spend tonight planting those rosebushes again."
        - id: ch02-b47
          speaker: mrs_brown
          text: "And William gave the dog a whole steak-and-kidney pie. Cook has to make another one for tomorrow."
        - id: ch02-b48
          speaker: narrator
          text: William coughed politely again. Then a dull scraping noise came from upstairs.
        - id: ch02-b49
          speaker: ethel
          text: "What's that? Listen."
        - id: ch02-b50
          speaker: robert
          text: "It's upstairs."
        - id: ch02-b51
          speaker: narrator
          text: A sharp, impatient bark followed.
        - id: ch02-b52
          speakers: [mr_brown, mrs_brown, robert, ethel]
          ensemble: chorus
          text: "It's a dog! It's William's dog!"
        - id: ch02-b53
          speaker: narrator
          text: They all stared at William in horror. He turned slightly red but kept eating cake, pretending not to notice.
        - id: ch02-b54
          speaker: mr_brown
          text: "You told me you took that dog to the police station."
        - id: ch02-b55
          speaker: william
          text: "I did. I took him there and came home. He must've gotten out, followed me back, and gone into my bedroom."
        - id: ch02-b56
          speaker: mr_brown
          text: "Did you leave him inside the station?"
        - id: ch02-b57
          speaker: william
          text: "No. Just at the gate."
        - id: ch02-b58
          speaker: narrator
          text: Mr. Brown stood with a weary look.
        - id: ch02-b59
          speaker: mr_brown
          text: "Robert, please make sure that animal reaches the police station tonight."
        - id: ch02-b60
          speaker: robert
          text: "Yes, Father."
    - id: ch03
      title: Half a Dog
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Robert gave William a vengeful look. William followed him upstairs, where Jumble was happily chewing the bedroom door.
        - id: ch03-b02
          speaker: robert
          text: "What a beastly nuisance."
        - id: ch03-b03
          speaker: william
          text: "Look at him! He knows me. Sending a dog away when he knows you like that is a mean trick."
        - id: ch03-b04
          speaker: robert
          text: "He's a rotten little mongrel."
        - id: ch03-b05
          speaker: william
          text: "He isn't a mongrel. Just look at him! He learns tricks easy. Watch him sit up and beg. I only taught him today."
        - id: ch03-b06
          speaker: narrator
          text: William held up a biscuit from his pocket. Jumble rose shakily on his back legs, toppled over backward, and wagged his tail as if the fall were a fine joke. Robert's superior expression softened.
        - id: ch03-b07
          speaker: robert
          text: "Do that again. Not so far back this time. Give me the biscuit. Come on, old boy. That's right. Stay there. Good dog! Have you got another one?"
        - id: ch03-b08
          speaker: narrator
          text: For twenty minutes, the boys taught Jumble to sit up. They almost taught him two more tricks, called Trust and Paid For. Jumble had a charm even Robert could feel. Then Ethel called from below.
        - id: ch03-b09
          speaker: ethel
          text: "Robert! Sydney Bellew is here!"
        - id: ch03-b10
          speaker: narrator
          text: Robert stood up, red-faced and untidy from bending over the dog.
        - id: ch03-b11
          speaker: robert
          text: "Bother that dog. Sydney and I are walking to Fairfields, and the police station is miles out of our way."
        - id: ch03-b12
          speaker: william
          text: "I'll take him, Robert. I really will."
        - id: ch03-b13
          speaker: robert
          text: "You took him this afternoon, didn't you?"
        - id: ch03-b14
          speaker: william
          text: "I'll honestly take him tonight. I couldn't do it before, could I? Not after all this."
        - id: ch03-b15
          speaker: robert
          text: "Nobody ever knows what you're going to do."
        - id: ch03-b16
          speaker: narrator
          text: Sydney called for Robert to hurry before dark. William promised again. Robert hesitated, and that was enough.
        - id: ch03-b17
          speaker: robert
          text: "All right, but you'd better do it. If you don't, I'll hear about it, and then you'll hear from me."
        - id: ch03-b18
          speaker: narrator
          text: William set off toward the police station again, with Jumble skipping behind him. He walked slowly, staring at the ground and thinking hard. William almost never admitted defeat.
        - id: ch03-b19
          speaker: ginger
          text: "Hello, William! They took your bow and arrow away!"
        - id: ch03-b20
          speaker: narrator
          text: Ginger stood in the road, showing off his own bow. William glared at him. Then, little by little, his eyes brightened. An idea had arrived.
        - id: ch03-b21
          speaker: william
          text: "If I let you have a dog half the time, will you let me use your bow and arrows half the time?"
        - id: ch03-b22
          speaker: ginger
          text: "What dog?"
        - id: ch03-b23
          speaker: william
          text: "There's one behind me, isn't there? Hey, Jumble!"
        - id: ch03-b24
          speaker: ginger
          text: "Yeah. He's just coming out of the ditch."
        - id: ch03-b25
          speaker: william
          text: "I'm taking him to the police station. I'll keep walking, and he'll keep following me. You come up behind and grab his collar. I won't see you because I won't turn around. His name's Jumble. Take him to the old barn. We'll keep him there together and feed him on different days, and you'll let me practice with your bow. That's fair, isn't it?"
        - id: ch03-b26
          speaker: ginger
          text: "All right."
        - id: ch03-b27
          speaker: narrator
          text: William walked all the way to the police station without looking back.
        - id: ch03-b28
          speaker: robert
          text: "Well?"
        - id: ch03-b29
          speaker: narrator
          text: Robert questioned him in a stern whisper that evening.
        - id: ch03-b30
          speaker: william
          text: "I took him. Well, I started out with him. But when I got there, he'd disappeared. I looked around and couldn't see him anywhere, so I came home."
        - id: ch03-b31
          speaker: robert
          text: "If that dog comes back here, I'll wring his neck. You remember that."
        - id: ch03-b32
          speaker: narrator
          text: Two days later William sat on an upside-down box in the barn, his chin in his hands, looking at Jumble. A paper bag held the dog's food for the day. It was William's turn to own him. Gathering the scraps had taken great care. William had slipped bread into his pocket at breakfast and meat into it at dinner. He had stolen a jam pastry from the pantry and rescued a bone from the garbage. While Ginger roamed the fields with his bow, William enjoyed Jumble. The next day they would trade.
        - id: ch03-b33
          speaker: narrator
          text: William had spent the morning teaching Jumble difficult tricks and loving him more every minute. He hated giving him back to Ginger. Yet the bow still had its powerful charm. William wanted to end the partnership, give up Ginger's bow, and keep Jumble for himself. He thought about his own bow locked in the library. He planned and plotted, but no answer came.
        - id: ch03-b34
          speaker: narrator
          text: William did not notice the man leaning against the barn door. He was tall, with a thin face and a loose tweed suit. When he saw the boy and dog, his eyes narrowed and his lips curved into a quiet smile. Jumble noticed him first and went over, wagging his tail. William looked up and scowled. The stranger lifted his hat.
        - id: ch03-b35
          speaker: mr_jarrow
          text: "Good afternoon. Do you remember what you were thinking about just now?"
        - id: ch03-b36
          speaker: narrator
          text: William studied him with interest. Perhaps the man was crazy, and William imagined crazy people might be entertaining.
        - id: ch03-b37
          speaker: william
          text: "Yes."
        - id: ch03-b38
          speaker: mr_jarrow
          text: "Then think it again and make that same face. If you do, I'll give you anything you want. That's a reckless promise, but I mean it."
        - id: ch03-b39
          speaker: narrator
          text: William did as he was asked. Soon he forgot the stranger completely and returned to his dark thoughts. The man took a small sketchbook from his pocket and began drawing William's solemn, unreadable face.
        - id: ch03-b40
          speaker: ninette
          text: "Daddy!"
        - id: ch03-b41
          speaker: narrator
          text: The man sighed and put the sketchbook away.
        - id: ch03-b42
          speaker: mr_jarrow
          text: "You'll make that face for me again someday, won't you? I'll keep my promise. Well, hello!"
        - id: ch03-b43
          speaker: narrator
          text: A beautifully dressed little girl with dark, lively eyes stood in the doorway. She took one quick look around the barn.
        - id: ch03-b44
          speaker: ninette
          text: "Daddy, it's Jumble! It really is! You horrible dog thief!"
          emotion: angry
        - id: ch03-b45
          speaker: narrator
          text: Jumble ran to her, barking with delight. Then he hurried back to William, as if to prove that his loyalty had not changed.
        - id: ch03-b46
          speaker: mr_jarrow
          text: "It is Jumble. That's his name because he's a jumble of every kind of dog. This is my daughter, Ninette. I'm Mr. Jarrow. We've rented Lavender Cottage for two months. We wander everywhere and never stay longer than that. Now you know all about us. Jumble seems to have adopted you. Ninette, I'm afraid this young gentleman has taken your place in his heart."
        - id: ch03-b47
          speaker: william
          text: "I didn't steal him. He just came and followed me. I didn't want him to. Not at first, anyway. Not much. I suppose... I suppose you want him back?"
        - id: ch03-b48
          speaker: narrator
          text: A terrible fear had come over William.
        - id: ch03-b49
          speaker: ninette
          text: "He can keep Jumble for a while, can't he, Daddy? You're buying me a Pomeranian, a sweet little white one. When Jumble got lost, I decided I'd rather have that. Jumble is rough, and he isn't really a good dog. He has no pedigree."
        - id: ch03-b50
          speaker: william
          text: "Can I really keep him for a while?"
        - id: ch03-b51
          speaker: ninette
          text: "Of course. I'd rather have a quiet dog. Do you want to see our cottage? It's right over there."
    - id: ch04
      title: Ninette's Bargain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: William went with her, confused but greatly relieved. Mr. Jarrow followed at an easy pace. Ninette, it turned out, was a remarkable person. Though only eleven, she had visited every capital in Europe. In each one, she had seen the finest art and heard the finest music. She had attended every current play in London, and she knew all the newest dances.
        - id: ch04-b02
          speaker: ninette
          text: "Do you like Paris?"
        - id: ch04-b03
          speaker: william
          text: "Never been there."
        - id: ch04-b04
          speaker: narrator
          text: William looked back secretly to make sure Jumble was still following. Ninette gave her dark curls a little shake.
        - id: ch04-b05
          speaker: ninette
          text: "What a funny boy. But you do speak French, don't you?"
        - id: ch04-b06
          speaker: narrator
          text: She asked the last question in French. William refused to answer. Instead, he whistled for Jumble, who was hunting an imaginary rabbit in a ditch.
        - id: ch04-b07
          speaker: ninette
          text: "Can you dance the jazz?"
        - id: ch04-b08
          speaker: william
          text: "I don't know. I've never tried. I expect I could."
        - id: ch04-b09
          speaker: narrator
          text: Ninette took a few quick, graceful steps on her slim legs.
        - id: ch04-b10
          speaker: ninette
          text: "That's how. I'll teach you at the cottage. We can dance to the phonograph."
        - id: ch04-b11
          speaker: narrator
          text: William kept walking in silence. Under a tree, Ninette suddenly stopped and lifted her bright little face toward him.
        - id: ch04-b12
          speaker: ninette
          text: "You may kiss me if you want."
        - id: ch04-b13
          speaker: narrator
          text: William considered her without much interest.
        - id: ch04-b14
          speaker: william
          text: "No, thanks. I don't want to."
        - id: ch04-b15
          speaker: ninette
          text: "You really are funny! And you're so rough and messy. You're rather like Jumble. Do you like him?"
        - id: ch04-b16
          speaker: william
          text: "Yes."
        - id: ch04-b17
          speaker: narrator
          text: His voice shook. He knew that Jumble no longer belonged to him.
        - id: ch04-b18
          speaker: ninette
          text: "Then you can have him forever and ever. Now kiss me."
        - id: ch04-b19
          speaker: narrator
          text: William kissed her cheek awkwardly, like someone firmly doing his duty. Inside, his heart flooded with relief and joy.
        - id: ch04-b20
          speaker: ninette
          text: "I'd love to watch you dance. You'd look so funny. You've seen Pavlova, haven't you?"
        - id: ch04-b21
          speaker: william
          text: "Dunno."
        - id: ch04-b22
          speaker: ninette
          text: "You have to know."
        - id: ch04-b23
          speaker: william
          text: "No, I don't. Maybe I saw him and didn't know it was him."
        - id: ch04-b24
          speaker: narrator
          text: Laughing again, Ninette raced back to her father.
        - id: ch04-b25
          speaker: ninette
          text: "He's such a funny boy, Daddy! He can't jazz, he's never seen Pavlova, and he doesn't speak French. I gave him Jumble, and he didn't even want to kiss me!"
        - id: ch04-b26
          speaker: narrator
          text: Mr. Jarrow gave William a dry, questioning smile.
        - id: ch04-b27
          speaker: mr_jarrow
          text: "Watch yourself, young man. She'll try to educate you. I know her, so consider yourself warned."
        - id: ch04-b28
          speaker: narrator
          text: At the door of Lavender Cottage, he turned to William.
        - id: ch04-b29
          speaker: mr_jarrow
          text: "Sit and think for me again. I haven't forgotten my promise."
        - id: ch04-b30
          speaker: ninette
          text: "I do like you. Come back soon, and I'll teach you all sorts of things. I think I might marry you when we grow up. You're so restful."
        - id: ch04-b31
          speaker: narrator
          text: William left for home.
    - id: ch05
      title: Friendship
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next afternoon, William came home and found Mr. Jarrow sitting in the library with his father.
        - id: ch05-b02
          speaker: mr_jarrow
          text: "I had completely run out of subjects. I didn't know what to paint. Then I saw those two in the barn, and the idea came like a gift. Ah, here he is. William, Ninette wants you to come for tea tomorrow. She gave him Jumble. Do you object?"
        - id: ch05-b03
          speaker: narrator
          text: Mr. Brown swallowed hard.
        - id: ch05-b04
          speaker: mr_brown
          text: "I'm trying not to. The dog kept us awake last night, but I suppose we'll grow used to it."
        - id: ch05-b05
          speaker: mr_jarrow
          text: "I also made William a reckless promise, and I'll keep it if it's humanly possible. William, what would you like more than anything else in the world?"
        - id: ch05-b06
          speaker: narrator
          text: William looked straight at his father.
        - id: ch05-b07
          speaker: william
          text: "I want my bow and arrows back from that cupboard."
        - id: ch05-b08
          speaker: narrator
          text: Mr. Jarrow looked pleadingly at Mr. Brown.
        - id: ch05-b09
          speaker: mr_jarrow
          text: "Please don't make me break my word. I'll pay for every bit of damage."
        - id: ch05-b10
          speaker: narrator
          text: With a long sigh, Mr. Brown slowly took a ring of keys from his pocket.
        - id: ch05-b11
          speaker: mr_brown
          text: "Then every one of us will be risking our lives again, every hour of the day."
        - id: ch05-b12
          speaker: narrator
          text: After tea, William set off down the road once more. The sunset had turned the sky gold, and a gentle haze lay across the countryside. Birds sang clearly, and the hedges were bursting into summer. Through it all marched William with a small swagger, his bow under one arm and his arrows under the other. Jumble trotted at his heels, playful, eager, and adoring. He was a mongrel unashamed, all sorts of a dog. William's heart shone with proud happiness.
        - id: ch05-b13
          speaker: narrator
          text: Later that year, one painting at the Academy drew a great deal of attention. It showed a boy in a barn, sitting on an upside-down box with his elbows on his knees and his chin in his hands. He was looking down at a mongrel dog. His freckled face held the solemn, eager longing of youth, and his untidy hair stood up all around it. The dog gazed back, trembling with trust and love. The boy's own longing seemed to shine from its eyes and its pointed ears.
        - id: ch05-b14
          speaker: narrator
          text: The painting was called "Friendship."
        - id: ch05-b15
          speaker: narrator
          text: Mrs. Brown went to see it. She said it did not look very much like William, and she wished the artist had made him a little tidier.
