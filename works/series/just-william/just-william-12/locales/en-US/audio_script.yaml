      display_name: William
      tts:
        delivery: blunt, defiant, and boyishly earnest
        timbre: bright and slightly rough
        pace: quick
        pitch: medium-high
    ethel:
      display_name: Ethel
      tts:
        delivery: poised, skeptical, and easily exasperated
        timbre: clear and youthful
        pace: brisk
        pitch: medium-high
    mrs_brown:
      display_name: Mrs. Brown
      tts:
        delivery: gentle, practical, and patient
        timbre: mature and soft
        pace: unhurried
        pitch: medium
    mr_brown:
      display_name: Mr. Brown
      tts:
        delivery: firm, weary, and matter-of-fact
        timbre: mature and resonant
        pace: measured
        pitch: low
    robert:
      display_name: Robert
      tts:
        delivery: confident, superior, and easily annoyed
        timbre: youthful and clear
        pace: brisk
        pitch: medium
    ginger:
      display_name: Ginger
      tts:
        delivery: cheeky, practical, and competitive
        timbre: bright and boyish
        pace: quick
        pitch: medium-high
