audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏诙谐，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直率，辩解时一本正经
        timbre: 清脆而略显粗粝的男孩声
        pace: 偏快，激动时连珠炮般
        pitch: 中高音
    mr_brown:
      display_name: 布朗先生
      tts:
        delivery: 严肃克制，常带无可奈何的冷讽
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    mrs_brown:
      display_name: 布朗太太
      tts:
        delivery: 耐心温和，操心却不慌乱
        timbre: 柔和清晰
        pace: 适中
        pitch: 中音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 挑剔敏锐，语气利落
        timbre: 明亮的年轻女声
        pace: 适中偏快
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负老成，容易不耐烦
        timbre: 清朗的青年男声
        pace: 适中
        pitch: 中音
    ginger:
      display_name: 姜头
      tts:
        delivery: 淘气爽快，嘲弄时得意洋洋
        timbre: 活泼的男孩声
        pace: 偏快
        pitch: 中高音
    sydney:
      display_name: 西德尼
      tts:
        delivery: 随意急切，像在远处催促朋友
        timbre: 清朗的青年男声
        pace: 偏快
        pitch: 中音
    mr_jarrow:
      display_name: 贾罗先生
      tts:
        delivery: 风趣随和，观察人时带艺术家的兴味
        timbre: 轻柔而略带沙哑
        pace: 从容
        pitch: 中低音
    ninette:
      display_name: 妮内特
      tts:
        delivery: 自信活泼，娇俏而见多识广
        timbre: 轻盈明亮的女孩声
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 弓箭和一条杂种狗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗先生把弓箭放进书房柜子的最里面，关门，上锁，全程沉着脸。威廉睁着一双阴郁的大眼睛，满含责怨地盯住他的每一个动作。
        - id: ch01-b02
          speaker: mr_brown
          text: 一个上午，你打碎了三扇窗，还射中了克莱夫太太的猫。
          emotion: angry
        - id: ch01-b03
          speaker: william
          text: 我真不是故意射那只猫的。我才不会到处招惹猫呢，它们生起气来可凶了。它偏偏跑到箭前面，我来不及停手。窗子也不是我故意打的，我瞄准的东西，到现在一样都没射中。我只是还没摸到窍门，多练练就会了。
        - id: ch01-b04
          speaker: narrator
          text: 布朗先生把钥匙揣进口袋。
        - id: ch01-b05
          speaker: mr_brown
          text: 这件家伙已经不会再给你练习那个窍门了。
        - id: ch01-b06
          speaker: narrator
          text: 威廉闷闷地走进花园，抬头望着围墙。隔壁的小姑娘不在家，就算冒险爬上墙头那个摇摇欲坠的座位，也没人安慰他。命运处处跟他作对。他长长叹气，走出花园门，两手插进口袋，沿路慢慢晃荡。没有弓箭，前面的日子一下子变得空空荡荡，一点也不吸引人。姜头、亨利和道格拉斯都会拿着自己的弓箭，只有威廉被孤零零撇在一边，成了伙伴们眼中的异类。一个没有弓箭的男孩，简直像是被大家赶出了圈子。眼下弓箭可是最时兴的玩意儿。要是他们当中也有人打碎一扇窗，或者射中一只不懂躲开的蠢老猫，那该多好。
        - id: ch01-b07
          speaker: narrator
          text: 他坐上田边的阶梯栅门，双肘支着膝盖，两手托住下巴，觉得这样的日子简直没法过了。
        - id: ch01-b08
          speaker: william
          text: 讨厌的老猫！明明一点没伤着，还故意又叫又闹。窗玻璃又不贵，装起来也容易。只要给我材料，我自己都能修。我……
        - id: ch01-b09
          speaker: narrator
          text: 路上有个东西跑了过来。它步子轻快，像是在跳舞，长着猎狐梗的耳朵、寻回犬的鼻子、柯利犬的尾巴，身子还有点像腊肠犬。它浑身都因活着的快乐而颤动。跑到威廉面前，它高兴地叫了一声，热切又友好地站住了。这是一条对自己的杂种血统毫不羞愧的狗。
        - id: ch01-b10
          speaker: william
          text: 有耗子，快把它们赶出来！
        - id: ch01-b11
          speaker: narrator
          text: 小狗轻轻一跃，分开前爪，伏低身子，拿一只调皮的眼睛抬头等着。威廉从树篱上折下一根枝条，远远扔了出去。它尖叫一声便追上去，叼住枝条使劲撕咬，又抛到空中，一口接住，还冲着它低声咆哮。玩够以后，它总算把枝条送回威廉脚边。它站在那里直喘气，兴奋得分明是在咧嘴笑，还眼巴巴地央求威廉再来一次。威廉低落的心情马上振作起来。他跳下栅门，仔细查看小狗的项圈。上面只写着一个名字：杂毛。
        - id: ch01-b12
          speaker: william
          text: 喂，杂毛！
        - id: ch01-b13
          speaker: narrator
          text: 威廉叫着新名字，沿路跑了起来。杂毛兴奋地绕着他往上蹿，忽然飞奔出去，又立刻飞奔回来。它咬咬威廉的靴子，再次扑向他，接着又跑开，眼巴巴地讨另一根枝条。枝条飞出去后，它稳稳接住，抱着在地上滚了一圈，冲它低声咆哮。最后，它把枝条嚼得稀烂，又郑重地把残渣摆在威廉脚边。
        - id: ch01-b14
          speaker: william
          text: 好伙计！好杂毛！跟我来吧。
        - id: ch01-b15
          speaker: narrator
          text: 杂毛真的跟来了。威廉走过村子，摆出既骄傲又满不在乎的主人派头。杂毛只要跑去探查沟渠和路边，他就扭头吹一声威严的口哨。这种口哨他私下练过许多次，专等命运赐给他一条真正属于自己的狗。可过去，命运总是借他父母之手，拒绝他的一切恳求。
        - id: ch01-b16
          speaker: narrator
          text: 那个上午快活极了。杂毛跳进池塘游水，替威廉把一根根枝条衔回来，上岸后又贴着他猛抖身子，把水珠全甩在他身上。它先追一只母鸡，随后反过来被猫追。它冲一群牛大叫，还跑进一户农家的花园，把晾在那里的一幅窗帘扯了下来。它淘气、亲热又滑稽，叫人根本无法抗拒。它已经彻底认定威廉是自己的主人。威廉却总要故意装得满不在乎，大摇大摆地拐过街角，再屏住呼吸回头偷看，生怕那活蹦乱跳的小身影没有跟来。可每一次，杂毛都急匆匆地飞奔着追上他。
    - id: ch02
      title: 两次送往警察局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 威廉吃午饭迟到了。父母和哥哥姐姐已经开饭，父亲照例在读午餐时看的那份报纸。威廉悄悄溜到座位上。
        - id: ch02-b02
          speaker: mrs_brown
          text: 威廉，我真希望你能按时来，也希望你上桌以前先梳梳头。
        - id: ch02-b03
          speaker: narrator
          text: 威廉抬手要拿手指当梳子，忽然瞥见手上的颜色，又赶紧放下。母亲没留意这个小动作，还在问埃塞尔。她说自己不知道薰衣草小屋已经租了出去，听说新住户是位画家，觉得这消息很不错。问完他们是不是已经搬进去，她又不得不分神叫威廉坐稳。
        - id: ch02-b04
          speaker: ethel
          text: 他们好像连家具一起租了两个月。哎呀，你们快看威廉的手！
        - id: ch02-b05
          speaker: narrator
          text: 威廉把手藏到桌下，瞪了她一眼。布朗太太做了十一年威廉的母亲，这份磨人的差事早教会了她耐心。
        - id: ch02-b06
          speaker: mrs_brown
          text: 去洗洗手吧，亲爱的。
        - id: ch02-b07
          speaker: william
          text: 我的手不脏。以前比这还脏，你们也没说什么。我总不能一直洗吧？有些人的手就是脏得快，越洗反而越容易脏，而且……
        - id: ch02-b08
          speaker: narrator
          text: 埃塞尔呻吟一声，父亲放下报纸。威廉立刻有尊严地撤退了。
        - id: ch02-b09
          speaker: ethel
          text: 再看看他的靴子，泥都结成壳了！长袜也湿透了。他准是整个人下了池塘，而且……
        - id: ch02-b10
          speaker: narrator
          text: 威廉没再听下去。有些时候，他真心讨厌埃塞尔。几分钟后，他洗得干干净净地回来，脸上像在闪光，头发也凶狠地全梳向脑后。他才刚坐下，埃塞尔便又低声挑剔起他的指甲。母亲没有让话题继续绕着他打转，只请埃塞尔接着讲新邻居。当然，她同时还得提醒威廉把餐刀拿好。威廉没再辩解，默默吃完这顿饭，等大家说完了，才郑重其事地宣布那件大事。
        - id: ch02-b11
          speaker: william
          text: 我有狗了。
        - id: ch02-b12
          speakers: [robert, ethel]
          ensemble: duo
          text: 什么样的狗？谁给你的？
        - id: ch02-b13
          speaker: william
          text: 谁也没给我。它早上自己跟着我，怎么赶也不走。它跟我绕遍村子，又一路跟回了家。我根本甩不掉它。
        - id: ch02-b14
          speaker: mrs_brown
          text: 它现在在哪儿？
        - id: ch02-b15
          speaker: william
          text: 后花园里。它拴得好好的，我把它系在玫瑰花坛正中的树上了。
        - id: ch02-b16
          speaker: narrator
          text: 父亲把报纸折起来，绝望地猜那条狗此刻正在刨他的花坛。威廉却安慰他说，狗已经拴得很牢。可当他报出拴狗的地点，父亲一听见“玫瑰花坛”几个字，便呻吟着叫起老天。罗伯特这时板起面孔，像个负责的大人一样，追问那条狗有没有东西吃。
        - id: ch02-b17
          speaker: william
          text: 吃过了。我从食品储藏室找了几样剩下的东西。
        - id: ch02-b18
          speaker: mr_brown
          text: 下午把它送到警察局去。
        - id: ch02-b19
          speaker: william
          text: 警察局？它不是走失的狗，只是以前不属于任何人。它要的不多，睡在我房里，吃点剩饭就能很快活。
        - id: ch02-b20
          speaker: narrator
          text: 父亲根本不回答，径直离开饭桌。母亲温和地告诉威廉，这条狗非送去不可，叫他动作快些。她又确认威廉知不知道警察局在哪儿，还好心问要不要陪他一起去。威廉赶忙谢绝。几分钟后，他已经走在去警察局的路上。仍旧兴冲冲的杂毛跟在后面，一路小跑，对自己就要面对的厄运毫无察觉。
        - id: ch02-b21
          speaker: narrator
          text: 快到警察局时，威廉严峻的脸稍稍舒展开来。他站在门口看着杂毛。杂毛摆好前爪，摇着尾巴，只等着玩。
        - id: ch02-b22
          speaker: william
          text: 好了，到了。这就是警察局。进去吧。
        - id: ch02-b23
          speaker: narrator
          text: 杂毛尖叫一声，仿佛在催他快扔枝条，或者快来赛跑。接着，它用爪子推着一块大石头滚，又低吼着追上去。
        - id: ch02-b24
          speaker: william
          text: 这里就是警察局。你想进去，就自己进去吧。
        - id: ch02-b25
          speaker: narrator
          text: 威廉说完脚跟一转，开始往家走，一次也没有回头。不过他走得格外慢，还一路用鼓励的声音喊着“喂，杂毛”，不时吹出一声短促而威严的口哨。杂毛当然把这些全当成召唤，快活地紧跟在他脚后。回到家，花园里没人。穿过大厅，还是没人。就连上楼梯时，也没碰见一个人。这一回，命运终于站在威廉一边。
        - id: ch02-b26
          speaker: narrator
          text: 下午茶时，威廉洗得干干净净，头也梳得整齐，还摆出一副格外招摇的乖巧模样。熟悉他的人一见这模样，就知道他刚干下了最胆大的勾当。父亲问他有没有把狗送去。
        - id: ch02-b27
          speaker: william
          text: 送了，爸爸。
        - id: ch02-b28
          speaker: mr_brown
          text: 他们怎么说？
        - id: ch02-b29
          speaker: william
          text: 什么也没说，爸爸。
        - id: ch02-b30
          speaker: narrator
          text: 父亲苦涩地说，今晚看来得把那些玫瑰树一棵棵重新栽好。母亲又轻声提起另一件事：威廉拿去喂狗的并不是几样无关紧要的剩饭，而是整整一只牛排腰子馅饼。厨娘原本为明天准备的东西没了，只好重新再做一个。威廉听着这些话，又客客气气地咳嗽一声，始终不肯抬头，只管盯着自己的盘子。就在这时，屋里传来一种奇怪的低沉声音，像有什么东西正在用力抓挠木头。
        - id: ch02-b31
          speaker: ethel
          text: 那是什么声音？听！
        - id: ch02-b32
          speaker: robert
          text: 在楼上。
        - id: ch02-b33
          speaker: narrator
          text: 罗伯特摆出福尔摩斯的神气。紧接着，楼上传来一声尖锐而不耐烦的狗叫。
        - id: ch02-b34
          speakers: [mr_brown, mrs_brown, robert, ethel]
          ensemble: chorus
          text: 是条狗！是威廉的狗！
          emotion: surprised
        - id: ch02-b35
          speaker: narrator
          text: 四个人一起转过头，惊恐地盯住威廉。他的脸微微红了，却没有停下，仍旧若无其事地吃着一块蛋糕。他硬装出心不在焉的样子，可谁也不会上当。父亲板起面孔，逼问他刚才明明说过已经把狗送去了，这条狗为什么还会在楼上。
        - id: ch02-b36
          speaker: william
          text: 我真的送去了。送到以后我就回家了。它准是自己跑出来，又跟回家，还上了我的卧室。
        - id: ch02-b37
          speaker: mr_brown
          text: 你把它留在警察局里面了吗？
        - id: ch02-b38
          speaker: william
          text: 没有，就留在门口。
        - id: ch02-b39
          speaker: narrator
          text: 布朗先生满脸疲惫地站起来，让罗伯特务必在今晚把那畜生送到警察局。罗伯特恶狠狠地瞪着威廉，答应了父亲。威廉一路跟他上楼。罗伯特边走边抱怨这条狗真会给人添麻烦。杂毛这时正在啃威廉的房门，一见两个人出现，立刻欣喜若狂地迎上来。
        - id: ch02-b40
          speaker: william
          text: 瞧它这么认得人！把一条这样认人的狗送去警察局，实在太卑鄙了！
          emotion: angry
        - id: ch02-b41
          speaker: robert
          text: 一条讨厌的小杂种狗。
        - id: ch02-b42
          speaker: william
          text: 它哪有一点杂种样？你看，它学把戏可快了。我下午刚教会它坐起来讨东西。
        - id: ch02-b43
          speaker: narrator
          text: 威廉举起一块饼干。杂毛摇摇晃晃地用后腿站起来，又仰面摔倒。它摇着尾巴咧嘴笑，自己觉得有趣极了。罗伯特的优越神情松动了。
        - id: ch02-b44
          speaker: robert
          text: 再来一次，别往后仰那么远。把饼干给我。来，好伙计！对了，别动！好狗！还有没有？再试一次。
        - id: ch02-b45
          speaker: narrator
          text: 接下来的二十分钟里，两兄弟把送狗的事忘得干干净净。他们一遍遍举起饼干，总算教会杂毛坐起来讨食，又差一点教会它“赊账”和“付清”。杂毛身上的确有种奇妙的魅力，连起初高高在上的罗伯特也抵挡不住。为了教狗，他一直弯着腰，后来已经弄得脸红气喘、衣衫凌乱。直到埃塞尔的声音从楼下传来，他才想起西德尼还在等。
        - id: ch02-b46
          speaker: ethel
          text: 罗伯特，西德尼·贝卢来找你了！
        - id: ch02-b47
          speaker: robert
          text: 这该死的狗！我们还要走去费尔菲尔兹，警察局根本不顺路。
        - id: ch02-b48
          speaker: william
          text: 我替你送，罗伯特。这回我真的会送到。
        - id: ch02-b49
          speaker: robert
          text: 是啊，下午你已经送过一次了。
        - id: ch02-b50
          speaker: william
          text: 今晚我一定送。可刚才大家都和它玩成这样了，我怎么送得走呢？
        - id: ch02-b51
          speaker: robert
          text: 谁知道你会干什么！
        - id: ch02-b52
          speaker: sydney
          text: 快点，伙计！再不快点，天黑以前就来不及了！
        - id: ch02-b53
          speaker: william
          text: 我真的会送去，罗伯特。
        - id: ch02-b54
          speaker: narrator
          text: 西德尼还在楼下催，说再磨蹭下去，他们想办的事就来不及在天黑前办完了。威廉又保证一遍。罗伯特犹豫了，也就在那一刻输给了威廉。他终于答应把送狗的差事交出去，却郑重警告威廉一定得送到，否则绝不会轻饶。他还声称，自己也会盯着威廉把事情办完。
    - id: ch03
      title: 一人一天的主人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 威廉再次领着杂毛往警察局走。他脚步很慢，低头紧锁双眉。威廉很少肯承认自己败了。忽然，姜头拿着弓箭站到面前，故意显摆。
        - id: ch03-b02
          speaker: ginger
          text: 你的弓箭让人没收啦！
        - id: ch03-b03
          speaker: narrator
          text: 威廉阴沉地盯了他一会儿，眼睛却渐渐亮了。他有了主意。
        - id: ch03-b04
          speaker: william
          text: 我要是分一半时间让你养狗，你能不能也分一半时间，让我玩你的弓箭？
        - id: ch03-b05
          speaker: ginger
          text: 你的狗在哪儿？
        - id: ch03-b06
          speaker: william
          text: 我身后有一条，对吧？喂，杂毛！
        - id: ch03-b07
          speaker: ginger
          text: 有，它刚从沟里出来。
        - id: ch03-b08
          speaker: william
          text: 我正带它去警察局。我只管往前走，它就跟着。你把它带走，我不会回头，所以也看不见。抓住项圈，把它带去旧谷仓。它叫杂毛。以后我们一起养，一人一天，你再让我用弓箭练习。很公平，对吧？
        - id: ch03-b09
          speaker: ginger
          text: 行，就这么办。
        - id: ch03-b10
          speaker: narrator
          text: 威廉头也不回地继续走到了警察局。当天晚上，罗伯特追问结果。
        - id: ch03-b11
          speaker: william
          text: 我带它出门了。可是走到那里时，它已经不见了。我回头一看，哪儿都找不到，只好回家。
        - id: ch03-b12
          speaker: robert
          text: 它再敢到家里来，我就扭断它的脖子。你给我小心点。
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 两天后，轮到威廉做杂毛的主人。他坐在旧谷仓里倒扣的木箱上，两手托着下巴，低头凝望杂毛。旁边的纸袋装着狗当天的口粮。为了凑齐这些所谓的“剩饭”，他费尽了心思。早餐时，他设法把一片面包塞进口袋。正餐时，又用同样的方法藏起一块肉。一个果酱酥皮点心是从食品储藏室偷来的，最后那根骨头则是从垃圾箱里翻出来的。此刻姜头正拿着弓箭在田野里四处游荡，威廉却能尽情享受拥有杂毛的快乐。到了明天，两个人就要交换。威廉去带弓箭，姜头来做狗主人。
        - id: ch03-b14
          speaker: narrator
          text: 威廉整个上午都在教杂毛好几种复杂的把戏，而且每过一会儿，就更彻底地爱上它。他一想到还得把狗交给姜头，心里就万分舍不得。可是弓箭也有强大的诱惑。他真想马上结束这场合伙，宁愿不要姜头的弓箭，也要把无法抗拒的杂毛完全留给自己。可他又想到那副锁在书房柜子里的弓箭。如果能把自己的拿回来，一切就解决了。他苦思冥想，反复计划，想了一个办法又推翻一个办法，始终找不到出路。
        - id: ch03-b15
          speaker: narrator
          text: 威廉完全没有察觉，一个高个男人已经走到谷仓门口，靠着门柱站在那里看他。那人脸又瘦又长，身上穿着一套宽松的花呢衣服。他的目光一落到威廉和杂毛身上，眼睛忽然眯了起来，灵活的嘴唇也不由自主地弯出一丝笑意。杂毛先看见了他，摇着尾巴走过去。威廉这才抬头，很不友好地皱起眉。陌生人倒很客气，还摘下帽子向他致意。
        - id: ch03-b16
          speaker: mr_jarrow
          text: 下午好。你还记得刚才在想什么吗？
        - id: ch03-b17
          speaker: narrator
          text: 威廉有点感兴趣，猜这个人多半疯了。他觉得疯子应该很有趣。
        - id: ch03-b18
          speaker: william
          text: 我记得。
        - id: ch03-b19
          speaker: mr_jarrow
          text: 那就再想一遍，还照刚才那样坐着。我会把你想要的任何东西送给你。这话虽然冒失，我却一定兑现。
        - id: ch03-b20
          speaker: narrator
          text: 威廉立刻照办。他重新想起弓箭和杂毛这个解不开的难题，很快就忘了陌生人的存在。那人从口袋里取出一块小速写本，静静画起威廉那张深沉、沉思而叫人猜不透的脸。威廉保持着原来的姿势，一动不动。可画才进行了一会儿，外面忽然有人高声叫爸爸。男人无奈地叹了口气，只得收起速写本。
        - id: ch03-b21
          speaker: mr_jarrow
          text: 改天再这样坐给我画一次，好吗？我一定遵守诺言。咦！
    - id: ch04
      title: 杂毛原来的主人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一个衣着精美的小姑娘出现在门口。她模样秀气，眼睛乌黑，一眼扫过谷仓里的人和狗。
        - id: ch04-b02
          speaker: ninette
          text: 爸爸，是杂毛！真的是它！你这个偷狗的坏男孩！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 杂毛发出一连串尖锐的欢叫，飞快地跑向她。可它才刚打过招呼，又掉头跑回威廉身边，仿佛急着向新主人保证，哪怕旧主人突然出现，自己那份永不改变的忠心也还是属于威廉。
        - id: ch04-b04
          speaker: mr_jarrow
          text: 确实是杂毛。它为什么叫这个名字呢？因为它本来就是各种狗混成的一团，什么品种都在它身上沾了一点。这是我女儿妮内特，我姓贾罗。我们租下了薰衣草小屋，准备住两个月。我们父女俩是到处漂泊的流浪汉，在任何地方都不会待得更久。好了，现在你已经知道我们的一切了。杂毛看来已经认了你做主人。亲爱的妮内特，你在它心里彻底失宠了。如今这位先生才是至高无上的主宰。
        - id: ch04-b05
          speaker: william
          text: 我没偷它。是它自己来跟我的。一开始我也没多想让它跟。你们现在要把它带回去吗？
        - id: ch04-b06
          speaker: ninette
          text: 爸爸，他想养就让他再养一阵吧。你要给我买一只可爱的小白博美。杂毛走丢以后，我觉得还是博美好。杂毛太粗野，也不算真正的好狗，它连血统证书都没有。
        - id: ch04-b07
          speaker: william
          text: 那我能再养它一阵子吗？
        - id: ch04-b08
          speaker: ninette
          text: 当然。我更喜欢安静一点的狗。你愿意去看看我们的小屋吗？就在那边。
        - id: ch04-b09
          speaker: narrator
          text: 威廉还有些迷糊，却已经大大松了口气，跟着她向薰衣草小屋走去。杂毛也跟着他们。贾罗先生不紧不慢地走在两个孩子后面。一路谈下来，威廉发现妮内特·贾罗小姐是个很了不起的人物。她也是十一岁，却已经去过欧洲的每一座首都。在每一座城里，她都看过当地最好的艺术，也听过最好的音乐。伦敦当时上演的每一出戏，她全都看过。至于最新流行的舞步，她更是每一种都知道。这些经历对她来说平常得很，对威廉来说却完全是另一个世界。
        - id: ch04-b10
          speaker: ninette
          text: 你喜欢巴黎吗？
        - id: ch04-b11
          speaker: william
          text: 没去过。
        - id: ch04-b12
          speaker: narrator
          text: 威廉偷偷回头，确认杂毛还跟着。妮内特左右摇了摇乌黑的卷发，这是她的小习惯。
        - id: ch04-b13
          speaker: ninette
          text: 你真有趣。Mais vous parlez français, n’est-ce pas?
        - id: ch04-b14
          speaker: narrator
          text: 威廉不屑回答，只朝正在沟里追一只假想兔子的杂毛吹了声口哨。
        - id: ch04-b15
          speaker: ninette
          text: 你会跳爵士舞吗？
        - id: ch04-b16
          speaker: william
          text: 不知道。我没试过，不过我想我会。
        - id: ch04-b17
          speaker: narrator
          text: 妮内特用那双裹着黑色丝袜的纤细双腿，轻盈地跳了几步。
        - id: ch04-b18
          speaker: ninette
          text: 就是这样。回家我教你，我们跟着留声机跳。
        - id: ch04-b19
          speaker: narrator
          text: 威廉一声不响地走。妮内特忽然停在树下，把活泼俏丽的小脸仰向他。
        - id: ch04-b20
          speaker: ninette
          text: 你愿意的话，可以亲亲我。
        - id: ch04-b21
          speaker: william
          text: 我不想亲，谢谢。
        - id: ch04-b22
          speaker: ninette
          text: 你真是个有趣的男孩！还又粗野又邋遢，简直像杂毛。你喜欢它吗？
        - id: ch04-b23
          speaker: william
          text: 我喜欢它。
        - id: ch04-b24
          speaker: narrator
          text: 威廉的声音颤了一下。他以为自己拥有杂毛的日子已经过去了。
        - id: ch04-b25
          speaker: ninette
          text: 那我就永永远远把它送给你。现在亲我吧！
          emotion: happy
        - id: ch04-b26
          speaker: narrator
          text: 威廉答应了这个交换。他笨手笨脚地凑过去，在妮内特的脸颊上亲了一下。那副神情不像是得了亲吻的机会，倒像一个下定决心、非把责任尽完不可的人。不过他的心里完全是另一回事。杂毛从此真正属于他了，这份巨大而欢欣的宽慰，已经把他的心装得满满的。
        - id: ch04-b27
          speaker: ninette
          text: 我真想看你跳舞，你跳起来一定很好玩。你看过巴甫洛娃，对吧？
        - id: ch04-b28
          speaker: william
          text: 我不知道会不会。
        - id: ch04-b29
          speaker: ninette
          text: 你一定得知道。
        - id: ch04-b30
          speaker: william
          text: 我不一定！我也许见过他，只是不知道那个人就是他，不行吗？
          emotion: angry
        - id: ch04-b31
          speaker: narrator
          text: 妮内特笑着跑回父亲身边。
        - id: ch04-b32
          speaker: ninette
          text: 他真有趣，爸爸！他不会跳爵士舞，没见过巴甫洛娃，也不会讲法语。我把杂毛送给他了，他还不想亲我！
        - id: ch04-b33
          speaker: narrator
          text: 贾罗先生带着冷峭的戏谑微笑望向威廉。
        - id: ch04-b34
          speaker: mr_jarrow
          text: 小心啊，年轻人。她会想办法教育你的。我太了解她了，先警告你一声。
        - id: ch04-b35
          speaker: narrator
          text: 一行人走到薰衣草小屋门口，贾罗先生没有忘记谷仓里的约定。他请威廉再坐下来，照原来的样子认真想一会儿，好让自己继续作画，并再次保证一定会兑现诺言。等威廉准备告辞，妮内特又摆出亲切而大方的样子叫住他。她显然已经替两个人的将来想好了不少安排。
        - id: ch04-b36
          speaker: ninette
          text: 我确实喜欢你。你一定要再来，我会教你许多东西。等我们长大，我想我愿意嫁给你。你让人觉得这么……安宁。
    - id: ch05
      title: 贾罗先生的诺言
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天下午，威廉回到家，发现贾罗先生已经坐在书房的扶手椅里，正和他的父亲谈话。原来，那天在谷仓里没有画完的速写，并不是一个随手而来的消遣。贾罗先生正向布朗先生解释，自己怎样在束手无策的时候，从男孩和狗身上找到了题材。
        - id: ch05-b02
          speaker: mr_jarrow
          text: 我当时正愁找不到题材，简直束手无策。一看见他俩待在谷仓里，老天就赐给我一道灵感。啊，他回来了。威廉，妮内特请你明天去喝下午茶。她已经把杂毛送给你了。布朗先生，您介意吗？
        - id: ch05-b03
          speaker: narrator
          text: 布朗先生艰难地咽了一口。
        - id: ch05-b04
          speaker: mr_brown
          text: 我正在努力不介意。它昨晚闹得全家都没睡，不过我们大概总会习惯。
        - id: ch05-b05
          speaker: mr_jarrow
          text: 我还冒失地答应了他一件事。只要人力能办到，我无论如何都要兑现。威廉，这世上你最想要什么？
        - id: ch05-b06
          speaker: narrator
          text: 威廉毫不退缩地盯住父亲。
        - id: ch05-b07
          speaker: william
          text: 我想拿回锁在那个柜子里的弓箭。
        - id: ch05-b08
          speaker: narrator
          text: 贾罗先生恳求地望着布朗先生。
        - id: ch05-b09
          speaker: mr_jarrow
          text: 请别让我失信。造成的一切损失都由我赔。
        - id: ch05-b10
          speaker: narrator
          text: 布朗先生深深叹气，慢慢掏出一串钥匙。
        - id: ch05-b11
          speaker: mr_brown
          text: 这下，我们所有人又得时时刻刻冒生命危险了。
        - id: ch05-b12
          speaker: narrator
          text: 喝过下午茶，威廉再次沿路出发。太阳正在落下，把整片天空染成金色，乡野处处笼着一层轻柔的薄雾。清亮的鸟鸣充满天地，路边的树篱蓬蓬勃勃，正涌入盛夏。威廉就从这一切中间神气地大步走过，步子里还带着一点得意的摇摆。一只胳膊下夹着失而复得的弓，另一只胳膊下夹着箭。杂毛在他脚后小跑，热切、顽皮，又满怀爱意。它是一条对自己的杂种血统毫不羞愧、什么狗都沾一点的狗。威廉再也不是没有弓箭的异类，也不用把狗分给别人。此刻，他心里装满了骄傲而灿烂的幸福。
    - id: ch06
      title: 《友谊》
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 那一年，皇家美术学院展览上出现了一幅画，引起许多人的注意。画里，一个男孩坐在谷仓中倒扣的木箱上，双肘支着膝盖，两手托住下巴。他正低头望着一条杂种狗。那张长着雀斑的脸无比郑重，藏着只有青春才会有的、连自己也没有察觉的热切向往。没梳过的乱发围着脸庞根根翘起。那条杂种狗抬头望着男孩，身体轻轻颤动。它在等待，在信赖，也全心爱着眼前的人。男孩眼里的那份热切向往，像一道倒影，也出现在狗的眼睛里，出现在那双高高竖起的耳朵上。画家给这幅作品取了一个很简单的名字，叫《友谊》。
        - id: ch06-b02
          speaker: narrator
          text: 布朗太太后来特地去了展览，亲眼看过这幅画。她说，画里的男孩其实不太像威廉，而且她真希望画家当初能把他画得整洁一点。
