audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    douglas:
      display_name: 道格拉斯
      tts:
        delivery: 热心随和，偶尔故作老成
        timbre: 清亮的男孩声
        pace: 中速
        pitch: 中高音
    aunt_emily:
      display_name: 埃米莉姨婆
      tts:
        delivery: 威严阴郁，谈起身体时满怀自怜
        timbre: 洪亮厚重
        pace: 从容
        pitch: 中低音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    visitor_1:
      display_name: 小观众甲
      tts:
        delivery: 不服气，喜欢当面拆穿把戏
        timbre: 清脆的孩子声
        pace: 偏快
        pitch: 高音
    visitor_2:
      display_name: 小观众乙
      tts:
        delivery: 眼尖直爽，想到什么就说什么
        timbre: 明亮的孩子声
        pace: 中速
        pitch: 中高音
    visitor_3:
      display_name: 小观众丙
      tts:
        delivery: 怀疑而嘴硬，不肯轻易受骗
        timbre: 略尖的孩子声
        pace: 偏快
        pitch: 高音
    visitor_4:
      display_name: 小观众丁
      tts:
        delivery: 好奇兴奋，说话时总屏着一口气
        timbre: 轻亮的孩子声
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 五先令的难题
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 亡命徒们围坐在旧谷仓里，一个个想得出了神。十二岁零三个月的亨利年纪最大，是他忽然提出，大家该找一件从没干过的新鲜事。
        - id: ch01-b02
          speaker: henry
          text: 咱们另外想点事情吧。要跟以前做过的都不一样，越新鲜越好。
        - id: ch01-b03
          speaker: narrator
          text: 这可不容易。他们彼此打过殊死搏斗，也完全不管烹饪规矩，把古怪材料放在冒烟又烧不旺的小火上乱煮。他们故意弄出南美洲土著的脸色和步态，在乡间彼此追踪，甚至试过绑架，虽然并没有什么了不起的成功。如今，这些事全叫他们厌烦了。四个人组成的亡命徒协会办事一向朴素，从不张扬。他们躲避公众目光时表现出的自然谦逊，很值得别的公共团体学习。连他们的父母都不知道协会存在。父母总爱在最不合适的时候干涉，把珍爱的计划扼杀在摇篮里。痛苦的经验告诉他们，保守秘密就是唯一的保护。再加上这个不讲情面的世界定下规矩，逼他们每天九点到四点上学，他们只能趁半天假开会，偶尔也会选星期日下午。
        - id: ch01-b04
          speaker: william
          text: 咱们用弓箭射东西吧，就像从前真正的亡命徒那样。
        - id: ch01-b05
          speaker: henry
          text: 你打算射什么？
        - id: ch01-b06
          speaker: ginger
          text: 咱们又上哪儿找弓箭？
        - id: ch01-b07
          speaker: william
          text: 什么都能射，鸟、猫、母鸡，全行。弓箭可以去商店买。
        - id: ch01-b08
          speaker: douglas
          text: 咱们自己做一副也行吧？
        - id: ch01-b09
          speaker: william
          text: 自己做的肯定射不直。真正的弓箭一点都不能差。我在布鲁克商店的橱窗里见过一副，跟真正的亡命徒用的一模一样。
        - id: ch01-b10
          speaker: henry
          text: 那副弓箭要多少钱？
        - id: ch01-b11
          speaker: william
          text: 五先令，还带靶子。咱们可以先练准，再射真的东西。
        - id: ch01-b12
          speaker: douglas
          text: 五先令？咱们根本没有这么多钱。亨利打破客厅窗户以后就没零用钱了，姜吉每星期才有三便士，还要捐献。钻进姜吉姐姐帽子的那只豚鼠，咱们也没付钱，而且……
        - id: ch01-b13
          speaker: william
          text: 别再数了。咱们只要弄到五先令就成。
        - id: ch01-b14
          speaker: ginger
          text: 可是怎么弄？
        - id: ch01-b15
          speaker: william
          text: 大人想要钱的时候总能弄到。他们会办义卖会什么的。
        - id: ch01-b16
          speaker: henry
          text: 义卖会？谁会来参加咱们的义卖会？你这么聪明，倒是说呀。义卖会上还得有东西卖，可咱们什么也没有。既没人买，又没东西卖，办它有什么用？
        - id: ch01-b17
          speaker: narrator
          text: 亨利最喜欢这样在口头上胜过威廉。威廉一向不喜欢别人逼他交代细节，这次却真的被问得没有办法，只好走投无路地脱口说，他们可以办一场展览会。大家安静了片刻，姜吉才若有所思地把这个主意念了一遍。道格拉斯的大哥正在家里过大学假，所以他也学着大哥的样子，故作老成地低声叫了一句“好家伙”。
        - id: ch01-b18
          speaker: ginger
          text: 展览会真能办。咱们弄些动物来，谁想看就得付钱。
        - id: ch01-b19
          speaker: henry
          text: 可谁愿意付钱来看？
        - id: ch01-b20
          speaker: ginger
          text: 谁都会呀。人们去动物园，不就是花钱看真动物吗？咱们也去找些动物，这还不容易？
        - id: ch01-b21
          speaker: narrator
          text: 附近教堂的钟敲了四下，会议只好结束。威廉替大家做了总结，下星期就安排展览会，挣到钱便买弓箭，再拿弓箭去射东西。回家路上，他走得又慢又沉静。进门后，他坐在床边，两手插在口袋里，皱着眉，心思却飘进了梦境。那里有一场场奇妙的展览会，还有稀世罕见的异国猛兽。
        - id: ch01-b22
          speaker: narrator
          text: 隔壁忽然响起一丝细声。它一点点变大，像狮子怒吼一样灌满整座房子，又慢慢消失。安静只维持了一秒，声音便再度升起，从耳语长成粗哑的咆哮，再缓缓退去。片刻后，它又从头开始。威廉母亲的姨妈埃米莉正在午睡。她一个月前来做客，本来只住一星期，可至今没提过什么时候走。布朗先生已经开始着急。埃米莉姨婆身材肥胖，身体健壮，却把所有时间都花在调养两年前得过的一场小病上。她生活里只有两件事，恰好也只有这两件，那就是吃和睡。可她庞大的个子、惊人的食量、阴郁的神气，还有那份对威廉彻底的无视，都让威廉深深着迷。
        - id: ch01-b23
          speaker: narrator
          text: 茶铃一响，鼾声马上停了，这场特别的娱乐也就结束。威廉下楼来到餐厅，父亲正在火气十足地问母亲，埃米莉姨婆到底打算永远住下，还是只住几年。他显然还有许多话要说，可一看见威廉，立刻把后半句话咽了回去。
        - id: ch01-b24
          speaker: mother
          text: 姨妈能住在这里，真是太好了，亲爱的。
        - id: ch01-b25
          speaker: narrator
          text: 埃米莉姨婆随即走进餐厅，威廉的母亲问她睡得好不好。
        - id: ch01-b26
          speaker: aunt_emily
          text: 睡觉？凭我现在的身体，哪里还敢指望睡着。能稍微休息一下，我就该知足了。
        - id: ch01-b27
          speaker: father
          text: 听说您还是没好，真叫人遗憾。
        - id: ch01-b28
          speaker: aunt_emily
          text: 好起来？我要恢复健康，还早得很呢。
        - id: ch01-b29
          speaker: narrator
          text: 她把庞大健壮的身子慢慢放进椅子，仔细挑出一块分量十足的黄油面包，吃得精神十足。威廉的母亲说，茶后要去邮局，问她愿不愿意同行。埃米莉姨婆没有立刻回答，先给自己盛了满满一大勺果酱。
        - id: ch01-b30
          speaker: aunt_emily
          text: 我这副身体，你总不会还要我晚上出门吧？我好多年没在茶后出去过了。今天早晨我去过邮局，那里人很多，可他们先给我办了。大概是看见我病得厉害。
        - id: ch01-b31
          speaker: narrator
          text: 布朗先生忽然噎住，随后道了歉，可那歉意一点也不谦卑。埃米莉姨婆接着说，这地方倒很适合她，只要再住几个月，或许能强壮一点。她一面说，一面叫威廉递果酱。布朗先生朝她狠狠瞪了一眼，换个没那么强壮的女人，恐怕早已吓得缩成一团。可她正忙着刮净果酱罐里最后一点残余，根本没看见。
        - id: ch01-b32
          speaker: aunt_emily
          text: 我今天大概又累过头了。我总忘记自己有多虚弱，一不小心就过度劳累。威廉，把蛋糕给我。昨天下午我只在太阳下多坐了一会儿，身子就受不了。茶后本来该写信，可我实在没有力气。威廉，再拿一块蛋糕。我还是上楼休息吧。家里可要保持安静，我难得睡得着。
        - id: ch01-b33
          speaker: narrator
          text: 布朗先生猛地离开餐厅。威廉却留在桌边，两眼一眨不眨，着迷地看着蛋糕一块块消失。等埃米莉姨婆终于吃完，他跟着那副庞大肥硕的身躯上楼，回到自己的房间。他一边认真策划展览会，一边带着兴奋和敬畏，侧耳等候隔壁的鼾声再次响起。
        - id: ch01-b34
          speaker: narrator
          text: 展览会的地点和时间都不好定。在旧谷仓办，会把他们珍爱已久的秘密基地暴露给全世界。威廉建议使用自己的卧室，让观众避开前门和楼梯，从花园围墙爬上洗涤间屋顶，再钻进窗口。他一向乐观，坚称谁也不会看见，更不会听见。时间只有星期三下午、星期六下午和星期日可选。星期日最初被他们当作绝不可能，可另外两天也都有麻烦。星期三，姜吉和道格拉斯得勉强去上舞蹈课，而且跳得一点也不优美。星期六，布朗先生会在花园干活，正好看见围墙和屋顶。厨娘和艾玛这两天下午也在家里四处走动，这两个人又偏偏很多疑。可到了星期日，她们都会出门，布朗太太照例去看朋友，布朗先生则会躺在沙发上，睡得对世界毫无知觉。
        - id: ch01-b35
          speaker: narrator
          text: 威廉还向其他亡命徒指出，他们能在路上拦住正要去主日学校的学生，再想办法劝这些孩子来参观展览。主日学校的学生身上多半带着捐献用的钱，正好可以拿来付入场费。威廉把这个计划从头到尾想了一遍。星期日下午的主意越想越诱人，那些看起来麻烦的地方也很快不算困难了。于是，四个人最终决定，展览会就在星期日下午举行。
        - id: ch01-b36
          speaker: narrator
          text: 选定星期日下午以后，偏偏连天气也来帮忙，那天阳光很好，亡命徒们一早就忙了起来。威廉摆出一副温顺又有德行的样子，问母亲能不能让“几个朋友”下午来自己房里。这副神情本该提醒她危险将至。可她想到丈夫整个下午都可以少受儿子那份坐立不安的陪伴，便十分高兴，痛快地答应了。
    - id: ch02
      title: 稀世珍奇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两点半时，所有展品都已就位。窗边笼子里有一只白老鼠，身上一道淡蓝、一道淡粉，彼此相间，全是道格拉斯亲手用水彩画的。它坐在那里，满脸迷惑，偶尔舔一下条纹，随即便明显后悔自己刚才为什么要舔。笼子上的硬纸牌说，这是来自中国的老鼠，中国老鼠全都长成这样。
        - id: ch02-b02
          speaker: narrator
          text: 第二件展品是威廉姐姐的猫斯穆茨，它被关在一把藤条扶手椅下面。斯穆茨平时脾气就坏，而且一辈子都对威廉怀着深仇大恨。如今，仇敌亲手把它关进两英尺见方的牢房，它的怒火再也没有边界。它撕扯藤条，发疯似的一圈圈乱转，又抓又啐，还骂个不停。椅子上的牌子简单又合适，只写了两个字：野猫。威廉骄傲地看着它，拼命祈祷这股怒火能烧上一下午。
        - id: ch02-b03
          speaker: narrator
          text: 接下来是巨人。道格拉斯骑在姜吉背上，两条床单蒙住他们，紧紧系在道格拉斯脖子上。旁边的牌子故意把字写错，称它为“珍货巨人”。姜吉已经在床单下面烦躁起来。
        - id: ch02-b04
          speaker: ginger
          text: 这也太过分了。我先前根本不知道会是这样，要不然才不会答应。时间过半以后，我一定要跟道格拉斯换。要是不换，我就不干了。
        - id: ch02-b05
          speaker: narrator
          text: 下一件展品是布朗太太的黑狐皮围巾。幸好上面正好连着脑袋和几只脚，是威廉趁人不备，从母亲衣橱拿来的。他用绳子绑好，肚子里塞满废纸，再拿铁丝一点点撑住，直到这东西在他眼中简直活了过来。可即使有铁丝帮忙，四条腿仍旧撑不起身体，脑袋也只会悲伤地垂到地板，所以它只能趴着展出。狐皮上到处是黏糊糊的手指印，还有威廉剪铁丝时，剪刀几次滑到一旁留下的剪痕。即便如此，总的说来，他仍然很有理由为它骄傲。牌子上写着，这是一头从“饿国”猎来的熊，由亡命徒亲手击毙。话很醒目，却一点都不真实。
        - id: ch02-b06
          speaker: narrator
          text: 再往后是一条蓝狗。它本是亨利的猎狐㹴奇普斯。对奇普斯来说，整个世界已经一片漆黑。亨利那颗高明的脑袋根本看不上颜料盒和水彩，而是借来一袋蓝粉，痛痛快快扑遍奇普斯全身。经过最初一场狂乱而拼命的挣扎，奇普斯彻底放弃了抵抗。它坐在那里，满脸漆黑的绝望，偶尔用忧郁的眼睛看看仍在发火的斯穆茨。对它来说，猫、快乐、生活和打架都已不复存在。它卑微又羞耻，只剩下一条蓝狗。
        - id: ch02-b07
          speaker: narrator
          text: 担任讲解员的威廉也很威风。他披着父亲的红睡袍，长长的衣摆拖在身后的地板上。睡袍的系带垂在胸前，他每走一步都要被它绊得歪歪斜斜。他从一块地毯的流苏上剪下几缕毛，拿胶水粘在嘴唇上当胡子，两绺毛笔直垂下，正好盖住嘴。头顶还有一顶金属丝冠冕，是姐姐从前扮仙女王后时戴过的。
        - id: ch02-b08
          speaker: narrator
          text: 这场展览早已到处宣传过，附近的孩子全都受过亲自邀请，也被严令保密。亡命徒们说，谁敢泄密，就要遭到他们可怕的处置。这些威胁害得不少孩子晚上躺在床上，久久不敢入睡。如今，威廉望着满屋展品，心里充满了骄傲。
        - id: ch02-b09
          speaker: william
          text: 我敢说，一便士能看到这些，一点都不亏。别处准找不到一样的展览。姜吉，你别再说话了。要是让人听见巨人从肚子里出声，一切都毁了。巨人的话该让道格拉斯说，这谁都看得出来。喂，他们来了！快看，他们正在围墙上爬！
        - id: ch02-b10
          speaker: narrator
          text: 一小列孩子四肢着地，排成单行沿围墙顶端爬来。他们一个接一个登上洗涤间屋顶，再小心地靠近卧室窗口。这是第一批客人，本来正要去主日学校，只是顺路来参观。亨利守在入口，逐个收下他们的一便士。等人都进来了，威廉清清嗓子，摆出讲解员的派头，正式开始。
        - id: ch02-b11
          speaker: william
          text: 女士们，先生们，这是来自中国的白老鼠，身上有粉红和蓝色的条纹。中国老鼠全长这样。这一只是英国唯一的真中国老鼠，上星期特地运来参加展览。连它吃的中国黄油面包也是特地运来的。
        - id: ch02-b12
          speaker: visitor_1
          text: 那你洗洗它呀。洗给我们看看，还剩不剩条纹。
        - id: ch02-b13
          speaker: william
          text: 洗它？它当然要洗，跟你我一样，早晚各洗一次。中国老鼠不洗就会立刻死掉。洗澡才不会弄掉条纹。只要懂一点中国老鼠的事，谁都知道这个道理。
        - id: ch02-b14
          speaker: narrator
          text: 威廉轻蔑地一笑，转向斯穆茨。猫已经渐渐习惯藤椅，正准备安顿下来睡觉。威廉赶紧四肢着地，蹲到椅边。他先用手指沿着藤条来回划动，再把自己的脸凑得很近，突然恶狠狠地嚎了一声。斯穆茨从睡意中猛然惊起，直接向他扑来，又抓又啐，怒火一下回到了顶点。
        - id: ch02-b15
          speaker: william
          text: 这就是野猫。它一逃出来就能杀人。它会扑向喉咙，用爪子挖掉眼睛，再咬住脖子，直到上下牙碰在一起。只要我挪开椅子，它就会冲向你们。你们中间马上会死掉几个。它又咬又抓，能把整颗脑袋从身体上弄下来！
        - id: ch02-b16
          speaker: narrator
          text: 孩子们赶紧退开。四下安静得满是敬畏，直到有人拆穿他。
        - id: ch02-b17
          speaker: visitor_2
          text: 别胡说了，那就是你姐姐的猫斯穆茨。
        - id: ch02-b18
          speaker: narrator
          text: 威廉哈哈大笑，仿佛听到了天底下最好笑的主意。他还偷偷踢了藤椅一脚，斯穆茨顿时更加愤怒，抓挠和叫骂得比刚才更凶。
        - id: ch02-b19
          speaker: william
          text: 斯穆茨？斯穆茨要是这么凶，我看这房子里早就剩不下几个人了。
        - id: ch02-b20
          speaker: narrator
          text: 大家随后来到巨人面前。威廉先扶正那顶略嫌宽大的金属丝冠冕，再请他们好好看看这个真正的巨人。它足有两个孩子加起来那么高，站在那里几乎碰到了房间上方。
        - id: ch02-b21
          speaker: william
          text: 你们想想，它怎么进门？它用的东西全得特制。现在看它走路。姜吉，走两步。
        - id: ch02-b22
          speaker: narrator
          text: 姜吉走了两步，道格拉斯紧紧抓着他的肩膀，焦急地叫了一声“好家伙”。威廉却说，这根本不算走路。被逼急的姜吉终于从巨人肚子里开口了。
        - id: ch02-b23
          speaker: ginger
          text: 你再这样对我说个不停，我就把他扔下来。我已经受够了。
        - id: ch02-b24
          speaker: william
          text: 好吧。反正它是个巨人，而且是个顶呱呱的巨人。
        - id: ch02-b25
          speaker: visitor_3
          text: 可这个巨人长着道格拉斯的脸。
        - id: ch02-b26
          speaker: narrator
          text: 威廉一时答不出来，不过很快就找到了道理。
        - id: ch02-b27
          speaker: william
          text: 巨人总要长一张什么样的脸吧？它又不能没有脸。
        - id: ch02-b28
          speaker: narrator
          text: 俄国熊常常披在布朗太太肩上，马上被孩子们认出，引来一阵放肆的嘲笑。蓝狗却实实在在大获成功。奇普斯低着蓝脑袋，蓝尾巴夹在两条蓝腿之间，怯生生地走来，像是在为自己的可怕模样低声道歉。亨利确实干得漂亮，孩子们围着它，完全看入了迷。
        - id: ch02-b29
          speaker: william
          text: 这是一条蓝狗。你们以前从没见过吧，以后多半也不会再见到了。它专门为这场展览变蓝，全世界只有这一条。以后各国的人都会赶来看，可它居然被放进一场只收一便士的展览。它要在动物园，票价至少一先令。它能出现在这里，完全是你们运气好。动物园的人准巴不得也有一条。很少有展览能拿出蓝狗，棕色、黑色和白色的狗倒是哪儿都有。人们光看普通狗都肯花钱，何况这里除了蓝狗，还有饿国死熊、巨人、野猫和中国老鼠。五样展品只收一便士，你们的运气真不错。
        - id: ch02-b30
          speaker: narrator
          text: 威廉刚才走上前时，被睡袍系带狠狠绊了一跤。站稳以后，他又把从额头滑到鼻子的冠冕推回去。每讲完一段，他还得把地毯流苏从嘴里拿出来，因为假胡子只肯服从地心引力，不肯服从他的心意。
        - id: ch02-b31
          speaker: visitor_3
          text: 它不过涂了颜料。亨利家的大门就在刷蓝漆。
        - id: ch02-b32
          speaker: narrator
          text: 这句批评说得有气无力，并没有动摇蓝狗的胜利。正当大家围着不幸的奇普斯默默赞叹，隔壁忽然传来轻声，像风吹过树林。它起起落落，每一次都更响，到了最高处，简直像受伤的野兽在哀号。
        - id: ch02-b33
          speaker: visitor_4
          text: 那到底是什么声音？
        - id: ch02-b34
          speaker: narrator
          text: 威廉有点不安。他还不知道这个变化会给展览增光，还是会让它丢脸，只好故作神秘地拖延时间。
        - id: ch02-b35
          speaker: william
          text: 没错，那是什么呢？我看你们都很想知道。
        - id: ch02-b36
          speaker: visitor_1
          text: 别装了，那就是有人在打呼噜。
        - id: ch02-b37
          speaker: william
          text: 打呼噜？这可不是普通的呼噜。你们只管听，我敢说你们谁也打不出这种声音。
        - id: ch02-b38
          speaker: narrator
          text: 孩子们果然听得出了神。轻声越来越响，最响时，他们脸上全是陶醉的笑。随后声音猛然停止，四周只剩寂静。片刻以后，那阵轻声又从头升起，一点点长大。威廉故意用台上才能听见的低声问亨利，他们是不是该为听这个声音另收一笔钱。孩子们赶紧辩解，自己根本没在听，只是没办法不听见。第二批客人已经到达，正在付入场的一便士，可第一批人就是不肯走。成功给威廉壮了胆。他打开房门，带着大家悄悄溜到楼梯平台，一个个把耳朵紧贴在那扇神奇的房门上。
    - id: ch03
      title: 肥胖野女人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 亨利暂时接过讲解员的工作，替威廉招待客人。威廉则穿着华丽服装，威严地站在一旁，陷入深深的思索。很快，灵感赐给信徒的那种淡淡微笑浮上他的脸。他立即让观众全部退回展览室，关好房门，自己脱掉鞋，屏住呼吸，轻轻推开埃米莉姨婆的房门，只把脑袋探进去，朝里面偷偷看去。
        - id: ch03-b02
          speaker: narrator
          text: 那天下午很闷热。埃米莉姨婆躺在鸭绒被上，为了不压皱衣裙，她脱掉了裙子，只穿上衣和条纹衬裙。庞大的身躯摊在床上，张开的嘴里不断涌出迷人的声音。睡着的埃米莉姨婆实在谈不上美。威廉站在门口，把眼前的情形从头到尾看了一遍。他若有所思地拿来一个靠垫，悄悄支住房门，随后又站在那里认真考虑了好一会儿。
        - id: ch03-b03
          speaker: narrator
          text: 几分钟后，展览室挤满了安静而期待的孩子。门边的角落多了一块新告示，写着要在这里脱鞋，还把“发誓安静”错写成了“发四安静”。威廉先精心挑出一小队观众，再用自己最庄严、最有威势的方式，让每一个人发誓保持安静。等他们全都脱掉鞋，他才走在前面，领着大家踮起脚尖，一步步进入隔壁房间。
        - id: ch03-b04
          speaker: narrator
          text: 埃米莉姨婆的床边也挂了新牌子，上面把她称作“肥胖野女人”，还说她正在讲“土著语盐”。孩子们围着床，组成安静又满心欢喜的一圈。鼾声始终没有停，也丝毫没有减弱。威廉严格掌握时间，每一批人只能在房里待两分钟。两分钟一到，他们便依依不舍地退出去，可马上又掏出更多钱，到队尾重新排起，等着再看一遍。有的人就这样一连进去好几次。越来越多的孩子赶到这里，可整场展览现在只剩下埃米莉姨婆。别的展品再也无人问津。
        - id: ch03-b05
          speaker: narrator
          text: 中国老鼠已经把身上的蓝粉条纹和粉红条纹全都舔掉，斯穆茨在藤椅下睡得正香。姜吉坐在椅子的座位上，道格拉斯坐在椅背上。姜吉终于坚持要呼吸空气、看看外面，脑袋已经从两条床单接缝中钻出来。俄国熊倒在地上，没人肯扶。奇普斯绝望地缩成一团，成了重度忧郁的牺牲品。可谁也不在乎这些了。新来的孩子匆匆经过旧展品，脱掉鞋，到埃米莉姨婆门外排队。参观完的也马上回到队尾，等着再轮一次。许多人还跑回家拿更多钱，因为看埃米莉姨婆要另付一便士，第一次以后，每次再收半便士。
        - id: ch03-b06
          speaker: narrator
          text: 主日学校的钟声响起，一遍遍召唤学生，可没有一个孩子肯离开。那天晚上，牧师非常沮丧，因为学生的出席人数创下了有史以来最低的纪录。与此同时，埃米莉姨婆仍旧睡着，仍旧打着呼噜，安静而陶醉的观众一直围着她。可是，威廉从不会满足。他那份雄心足以让许多长辈都感到惭愧。他突然清空房间，把门关起来。顾客们只能留在外面，屏住呼吸，焦急地等了几分钟，展览才再次开放。
        - id: ch03-b07
          speaker: narrator
          text: 观众重新进门时，又见到了新展品。威廉那双锐利的眼睛早已搜遍房间，不肯放过任何细节。床边桌上放着一只玻璃杯，里面是他从盥洗架找到的假牙。旁边还有梳妆台上的一绺假发和一把缺齿的梳子。三件东西都有自己的告示，说它们分别是肥胖野女人的牙、“头伐”和“梳几”。
        - id: ch03-b08
          speaker: narrator
          text: 只要弄出一点声音，观众就会被立刻赶走，已经有几个人尝过这种痛苦。要不是有这条规矩，他们的兴奋准会再也控制不住。他们只好安静地、满怀期待地悄悄走进去，激动地观看和倾听那幸福的两分钟。埃米莉姨婆从不叫人失望，照样睡得很熟，呼噜也从没停。孩子们不顾一切地互相借钱。穷孩子甚至把自己最珍贵的宝贝卖给有钱孩子，只为再进去一次。所有人就这样一遍又一遍地回来，埃米莉姨婆也一遍又一遍地打着呼噜。要不是她恰好在一阵最动听、最让观众欢喜的高音上惊醒，这场盛况还不知道会继续多久。
        - id: ch03-b09
          speaker: narrator
          text: 她猛地睁眼，惊讶地看看四周。起初，她以为床边聚成一团的小男孩只是梦，尤其是他们一见她醒来，马上转身仓皇逃跑以后。随后她坐起身，目光先落在床边桌上的东西，又扫过房间里的告示，最后盯住了那个吓得魂飞魄散、浑身僵硬的讲解员。她一跃下床，两手抓住威廉的肩膀，用力摇得他牙齿咯咯作响。金属丝冠冕从头顶掉下来，正好箍住耳朵和鼻子，一边假胡子也软绵绵地落在脚下。
        - id: ch03-b10
          speaker: aunt_emily
          text: 你这个坏孩子！你这个坏、坏、坏孩子！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 威廉终于挣脱她，飞快逃回展览室。为了自卫，他搬来一张桌子和三把椅子，横在房门后面。房里已经空了，只剩亨利、蓝狗，还有依旧熟睡的斯穆茨。巨人只留下皱成一团的床单。道格拉斯逃走时发出一声敬畏的“好家伙”，还不忘一把抄走自己的老鼠。窗外，最后一名顾客正四肢着地，用最快速度沿花园围墙顶端逃走。威廉望着眼前的残局，机械地扶正冠冕。
        - id: ch03-b12
          speaker: william
          text: 她醒了，而且现在野得发疯。
        - id: ch03-b13
          speaker: narrator
          text: 他提心吊胆地侧耳听着，等愤怒的脚步走下楼梯，再等父亲发出那道可怕的召唤。可是，除了埃米莉姨婆在房里来回走动，什么都没发生。威廉心里升起一线狂乱的希望。也许只要多给她一点时间，她就会把整件事忘得干干净净。
        - id: ch03-b14
          speaker: henry
          text: 咱们先数数钱吧。
        - id: ch03-b15
          speaker: narrator
          text: 两个人把一便士、半便士全都摊开，一枚一枚数过去。最后算出的总数，叫威廉兴奋得尖叫起来。
        - id: ch03-b16
          speaker: william
          text: 四先令六便士！这可真不错。没有埃米莉姨婆，最多只能挣两先令。是我想到拿她展览的，你们全都该谢谢我。
        - id: ch03-b17
          speaker: henry
          text: 我可一点都不嫉妒。等她把事情告诉你爸爸，这份功劳也全归你。
        - id: ch03-b18
          speaker: narrator
          text: 威廉高昂的心一下沉了。就在这时，那扇决定命运的门打开，沉重的脚步沿着楼梯走了下去。
    - id: ch04
      title: 一枚半克朗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 布朗太太刚从每星期的朋友家回来，正在门厅把雨伞放进伞架。埃米莉姨婆戴着帽子，穿好外套，提着一只包走下楼。布朗先生也刚从宁静的星期日下午酣睡中醒来，听见妻子的声音，便来到门厅。三个人恰好碰在一起。埃米莉姨婆把目光牢牢钉在布朗先生身上。
        - id: ch04-b02
          speaker: aunt_emily
          text: 麻烦你给我叫一辆车。这个家让我受尽侮辱，我一刻也不肯再住下去了。
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 她气得浑身发抖，把自己受过的每一样侮辱都详细讲了出来，从床边围着的小男孩，一直讲到那些叫人无法忍受的告示。布朗太太又恳求，又道歉，又哄劝，想让她留下。布朗先生却没有多说，只是悄悄出门叫车。等他带着车回来，埃米莉姨婆还站在门厅里滔滔不绝，根本没有讲完。
        - id: ch04-b04
          speaker: aunt_emily
          text: 一群粗俗的小男孩，房里还到处挂着可怕又下流的告示。
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 布朗先生替她把提包拿下台阶，一直送到出租马车旁。她跟在后面，还不忘提醒所有人，自己偏偏是这副身体，竟然遭到了这种待遇。等坐进车里，她又抛下最后一句。
        - id: ch04-b06
          speaker: aunt_emily
          text: 要不是出了这件可怕的事，我本来可能跟你们住上整个冬天，或许还会住过大半个春天。
        - id: ch04-b07
          speaker: narrator
          text: 出租马车驶出大门，越走越远，布朗先生这才掏出手帕，慢慢擦了擦额头。布朗太太嘴里说着，这实在太糟糕了，却始终避开丈夫的眼睛，不肯跟他对视。接着，她忽然打起精神，把话头转到了威廉身上。
        - id: ch04-b08
          speaker: mother
          text: 威廉做出这种事，真是太不像话了。你一定得跟他谈谈。
        - id: ch04-b09
          speaker: father
          text: 我会跟他谈。威廉，马上下来！
        - id: ch04-b10
          speaker: narrator
          text: 楼上的威廉心里一沉。最后一线希望破灭了，他低声告诉亨利，埃米莉姨婆已经告状。
        - id: ch04-b11
          speaker: henry
          text: 你还是下去吧，早点挨完就算了。
        - id: ch04-b12
          speaker: father
          text: 威廉！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: 这一次，声音更加凶猛。亨利向窗口挪了几步，准备布朗先生一上楼，就立刻逃跑。
        - id: ch04-b14
          speaker: henry
          text: 快去。他要是等不到，只会亲自上来抓你。
        - id: ch04-b15
          speaker: narrator
          text: 威廉知道父亲早晚会亲自上来，只好慢慢搬开堵住门的桌椅，一步步走下楼梯。他还记得摘掉金属丝冠冕，脱下拖地的红睡袍，可只剩一边的假胡子仍然软软地挂在嘴上。父亲已经站在门厅里等他，神情十分严肃。
        - id: ch04-b16
          speaker: father
          text: 你脸上那件可怕的东西是什么？
        - id: ch04-b17
          speaker: william
          text: 那是胡子。
        - id: ch04-b18
          speaker: narrator
          text: 布朗先生居然接受了这个回答，没有继续追究那片胡子。随后，他问起埃米莉姨婆房里的事。
        - id: ch04-b19
          speaker: father
          text: 你是不是没得到允许，就带朋友进了姨婆的房间，还在里面到处挂粗俗的告示？
        - id: ch04-b20
          speaker: narrator
          text: 威廉抬头仔细看着父亲的脸，忽然有了希望。那张脸虽然努力摆得严厉，却藏不住真正的心情。布朗先生可不会演戏。
        - id: ch04-b21
          speaker: william
          text: 是真的。
        - id: ch04-b22
          speaker: father
          text: 太不像话了，实在太不像话了。就这样。
        - id: ch04-b23
          speaker: narrator
          text: 可事情还没有完全结束。父亲说完话时，一个又硬又圆的东西悄悄滑进威廉手里。威廉把手合拢，什么也没说，随即迈着轻快的脚步，一路跑回楼上的展览室。
        - id: ch04-b24
          speaker: henry
          text: 这么快就完了？到底怎么回事？
        - id: ch04-b25
          speaker: narrator
          text: 威廉摊开手掌，那里有一样东西正在闪闪发亮。
        - id: ch04-b26
          speaker: william
          text: 看呀！好家伙，快看！
        - id: ch04-b27
          speaker: narrator
          text: 那是一枚亮闪闪的半克朗硬币。
