audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: dryly amused and observant
        timbre: warm and clear
        pace: measured
        pitch: medium
    william:
      display_name: William
      tts:
        delivery: blunt, defiant, and boyishly earnest
        timbre: bright and slightly rough
        pace: quick
        pitch: medium-high
    father:
      display_name: Father
      tts:
        delivery: dry, weary, and sharply controlled
        timbre: resonant and mature
        pace: measured
        pitch: medium-low
    mrs_brown:
      display_name: Mrs. Brown
      tts:
        delivery: gentle, practical, and patient
        timbre: mature and soft
        pace: unhurried
        pitch: medium
    henry:
      display_name: Henry
      tts:
        delivery: confident, skeptical, and fond of getting the last word
        timbre: clear and boyish
        pace: brisk
        pitch: medium-high
    ginger:
      display_name: Ginger
      tts:
        delivery: eager, practical, and quick to complain
        timbre: lively and boyish
        pace: quick
        pitch: medium-high
    douglas:
      display_name: Douglas
      tts:
        delivery: hopeful and self-consciously sophisticated
        timbre: light and boyish
        pace: moderate
        pitch: medium-high
    aunt_emily:
      display_name: Aunt Emily
      tts:
        delivery: grand, gloomy, and firmly convinced of her own frailty
        timbre: full and mature
        pace: deliberate
        pitch: medium-low
    visitor:
      display_name: Young Visitor
      tts:
        delivery: skeptical, curious, and easily impressed
        timbre: youthful and clear
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: A Brand-New Scheme
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Outlaws sat around their old barn, thinking as hard as they could. Henry, the oldest of the four at twelve and a quarter, had started it all with a sudden idea.
        - id: ch01-b02
          speaker: henry
          text: Let's find something else to do. Something completely new.
        - id: ch01-b03
          speaker: narrator
          text: So they thought. They had fought deadly battles with one another. They had cooked unlikely mixtures over a smoky fire that hardly wanted to burn. They had tracked each other across the countryside while trying to walk and look like South American natives. They had even tried kidnapping, though not with much success. Now all of it had grown dull.
        - id: ch01-b04
          speaker: narrator
          text: The Society of Outlaws liked to carry out its plans quietly and without showing off. Other public societies might have learned something from such modesty. Its four members had no desire for publicity, and their parents did not even know the society existed. Parents had ruined too many excellent schemes by interfering at exactly the wrong moment, just as those schemes were getting started. Bitter experience had taught the boys that secrecy was their only defense. The unfriendly world also ordered them to be in school from nine to four, so meetings had to wait for half holidays and an occasional Sunday afternoon.
        - id: ch01-b05
          speaker: narrator
          text: William, who could always produce an idea, spoke first.
        - id: ch01-b06
          speaker: william
          text: We could shoot things with bows and arrows, like real outlaws did.
        - id: ch01-b07
          speaker: henry
          text: What would we shoot?
        - id: ch01-b08
          speaker: ginger
          text: And where would we get bows and arrows?
        - id: ch01-b09
          speaker: william
          text: We'd shoot anything. Birds, cats, hens, whatever we found. And we'd buy the bows and arrows. Shops sell them.
        - id: ch01-b10
          speaker: douglas
          text: We could make them ourselves.
        - id: ch01-b11
          speaker: william
          text: Homemade ones wouldn't be right. They'd shoot crooked or something. Bows have to be made just so if they're going to shoot straight. I saw a set in Brook's window. They're exactly like real outlaws used.
        - id: ch01-b12
          speaker: narrator
          text: The others leaned in, breathless.
        - id: ch01-b13
          speaker: henry
          text: How much do they cost?
        - id: ch01-b14
          speaker: william
          text: Five shillings. You get targets too, so we can practice before we start on real things.
        - id: ch01-b15
          speaker: narrator
          text: Douglas repeated the price as if William had said five pounds.
        - id: ch01-b16
          speaker: douglas
          text: Five shillings? We haven't got that. Henry isn't getting any money since he broke their drawing-room window. Ginger only gets threepence a week, and some of that has to go in the collection. And we still haven't paid for the guinea pig that got into Ginger's sister's hat. She was furious, and—
        - id: ch01-b17
          speaker: william
          text: Oh, forget all that. We'll just get five shillings.
        - id: ch01-b18
          speaker: henry
          text: How?
        - id: ch01-b19
          speaker: william
          text: Well... grown-ups can always get money when they need it.
        - id: ch01-b20
          speaker: henry
          text: How do they get it?
        - id: ch01-b21
          speaker: narrator
          text: William never liked being pinned down to details.
        - id: ch01-b22
          speaker: william
          text: They have bazaars and things.
        - id: ch01-b23
          speaker: henry
          text: A bazaar? Who'd come to a bazaar run by us? Tell me that. And you'd need things to sell. What have we got? Nothing. So we'd have nobody to buy and nothing for them to buy. What's the use of that?
        - id: ch01-b24
          speaker: narrator
          text: Henry always enjoyed proving William wrong. William hunted desperately for another answer.
        - id: ch01-b25
          speaker: william
          text: Well, people put on shows and things.
        - id: ch01-b26
          speaker: narrator
          text: For a moment nobody spoke. Then Ginger repeated the important word, while Douglas tried out an expression he'd picked up from his oldest brother, who was home from college.
        - id: ch01-b27
          speaker: ginger
          text: A show...
        - id: ch01-b28
          speaker: douglas
          text: By Jove!
        - id: ch01-b29
          speaker: ginger
          text: We could put on a show. We'd collect animals and charge people to look at them.
        - id: ch01-b30
          speaker: henry
          text: Who'd pay for that?
        - id: ch01-b31
          speaker: ginger
          text: Anybody would. You'd pay to see real animals, wouldn't you? People pay at the zoo. All we have to do is find some animals. That'll be easy.
        - id: ch01-b32
          speaker: narrator
          text: A nearby church clock struck four, and the meeting had to end.
        - id: ch01-b33
          speaker: william
          text: That's settled, then. We'll have a show, make the money, buy the bows and arrows, and shoot things. We'll arrange it next week.
    - id: ch02
      title: The Sound Next Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: William walked home slowly, lost in thought. He sat on his bed with his hands in his pockets and a deep frown on his face, dreaming of marvelous shows filled with rare and foreign beasts.
        - id: ch02-b02
          speaker: narrator
          text: Then a thin sound came through the wall from the next room. It swelled until it seemed to fill the house like a lion's roar. It faded away, and for one second there was silence. Then it began again, first a whisper, then a rough bellow, then a slow fading into silence before the whole thing started over.
        - id: ch02-b03
          speaker: narrator
          text: William's great-aunt Emily was taking her afternoon nap next door. She had arrived a month earlier for a one-week visit, and she had never mentioned leaving. William's father was getting worried. Aunt Emily was a large, healthy woman who devoted all her time to recovering from a slight illness she'd had two years before. Her life had only two occupations, eating and sleeping.
        - id: ch02-b04
          speaker: narrator
          text: William found her impossible to resist. There was something fascinating about her size, her enormous appetite, and the deep gloom she carried everywhere. Even the way she completely ignored him drew him toward her. He watched her with the same interest he might have given some strange and remarkable creature.
        - id: ch02-b05
          speaker: narrator
          text: The tea bell rang, and the snoring stopped at once. William went downstairs. His father was speaking to his mother with some heat.
        - id: ch02-b06
          speaker: father
          text: Is she staying forever, or only for the next few years? I'd like to know, because—
        - id: ch02-b07
          speaker: narrator
          text: He saw William and stopped. Mrs. Brown answered quietly.
        - id: ch02-b08
          speaker: mrs_brown
          text: It's so nice having her here, dear.
        - id: ch02-b09
          speaker: narrator
          text: Aunt Emily came in.
        - id: ch02-b10
          speaker: mrs_brown
          text: Did you sleep well, Aunt Emily?
        - id: ch02-b11
          speaker: aunt_emily
          text: Sleep? With my health as it is, I hardly expect to sleep. The most I can hope for is a little rest.
        - id: ch02-b12
          speaker: father
          text: I'm sorry you're no better.
        - id: ch02-b13
          speaker: aunt_emily
          text: Better? It will be a very long time before I'm better.
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: She lowered her large, healthy body into a chair, chose a thick piece of bread and butter, and began eating it with energy.
        - id: ch02-b15
          speaker: mrs_brown
          text: I'm walking to the post office after tea. Would you like to come?
        - id: ch02-b16
          speaker: narrator
          text: Aunt Emily helped herself to a large spoonful of jam.
        - id: ch02-b17
          speaker: aunt_emily
          text: You can't seriously expect me to go out in the evening in my condition. I haven't gone out after tea for years. Besides, I was at the post office this morning. There were a great many people there, but they served me first. I suppose they could see how ill I looked.
        - id: ch02-b18
          speaker: narrator
          text: William's father suddenly choked. He apologized, though not very humbly. Aunt Emily continued.
        - id: ch02-b19
          speaker: aunt_emily
          text: I will say that this place agrees with me. After a few months here, I may feel a little stronger. Pass the jam, William.
        - id: ch02-b20
          speaker: narrator
          text: William's father gave her a look that might have frightened a stronger woman. Aunt Emily was too busy scraping up the last of the jam to notice.
        - id: ch02-b21
          speaker: aunt_emily
          text: I'm overtired today. I keep forgetting how weak I am, and then I do too much. I'm ready for the cake, William. Yesterday I sat outside in the sun a little too long, and that wore me out. I should write some letters after tea, but I don't think I have the strength. Another piece of cake, William. I'll go upstairs and rest instead. Please keep the house quiet. I so rarely manage to get any sleep.
        - id: ch02-b22
          speaker: narrator
          text: William's father left the room suddenly. William stayed and watched, fascinated, until the cake disappeared. Then he followed Aunt Emily's large figure upstairs. He sat in his room planning the show while he waited, with a kind of excited awe, for the sounds to begin next door.
        - id: ch02-b23
          speaker: narrator
          text: Finding a place and time for the show was not easy. The old barn was out of the question. Using it would reveal the Outlaws' secret meeting place. William offered his bedroom instead. Visitors would avoid the front door and stairs. They could climb the garden wall, cross the scullery roof, and enter through his window. William, always hopeful, insisted that no one would see or hear them.
        - id: ch02-b24
          speaker: narrator
          text: They could choose Wednesday afternoon, Saturday afternoon, or Sunday. At first, Sunday seemed impossible. But Ginger and Douglas had dancing lessons on Wednesday. On Saturday, William's father worked in the garden, where he could see both the wall and the scullery roof. Cook and Emma would also be around, and both were suspicious.
        - id: ch02-b25
          speaker: narrator
          text: Sunday began to look much better. Cook and Emma went out. Mrs. Brown made her weekly visit to an old friend. Mr. Brown spent the afternoon asleep on the sofa and knew nothing of the world. Best of all, the boys could wait for children on their way to Sunday school and persuade them to visit the show. Those children would probably be carrying collection money, which solved another problem. Sunday still had a few difficulties on the surface, but the more William thought about it, the more attractive it became. Sunday afternoon was chosen.
    - id: ch03
      title: The Exhibits
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Sunday arrived bright and clear, and the Outlaws started work early. William asked his mother whether he might have just a few friends in his room that afternoon. His face was so meek and virtuous that it should have warned her. Instead, Mrs. Brown was glad her husband would be spared William's restless company, and she agreed at once.
        - id: ch03-b02
          speaker: narrator
          text: By half past two, the exhibits were ready. Beside the window stood a cage containing a white rat with pale pink and blue stripes. The rat was Douglas's contribution, and Douglas had painted every stripe himself with watercolors. The animal looked bewildered. Now and then it licked one of the stripes and immediately seemed sorry. A cardboard sign on the cage announced that this was a rat from China and that all Chinese rats looked the same.
        - id: ch03-b03
          speaker: narrator
          text: Next came Smuts, the cat belonging to William's sister. Smuts was trapped beneath a wicker chair. Even on a good day, he had a short temper, and he'd hated William all his life. Now his enemy had shut him inside a prison only two feet wide. Smuts tore at the wicker, raced in furious circles, scratched, spat, and swore. The sign above him simply said, “Wild Cat.”
        - id: ch03-b04
          speaker: narrator
          text: William watched with honest pride. He could only hope Smuts would stay just as angry all afternoon.
        - id: ch03-b05
          speaker: narrator
          text: The next exhibit was a giant. Douglas sat on Ginger's back, and two sheets were wrapped tightly around them, tied at Douglas's neck. Their label read, with uncertain spelling, “Genuine Giant.” Ginger was already losing patience. His muffled voice came from somewhere inside the sheets.
        - id: ch03-b06
          speaker: ginger
          text: This is a bit much. Nobody told me it would be like this. I wouldn't have agreed if I'd known. And halfway through, Douglas has to carry me. If we don't switch, I'm done.
        - id: ch03-b07
          speaker: narrator
          text: After the giant came William's mother's black fox fur. It still had a head and several feet attached, and William had quietly removed it from her wardrobe. He had tied it, filled it with wastepaper, and wired it into what he considered a remarkably lifelike shape. But even with wire in them, the legs would not hold up the body. The head drooped sadly to the floor. The creature had to lie down.
        - id: ch03-b08
          speaker: narrator
          text: The fur carried sticky fingerprints and several cuts where William's scissors had slipped while he worked on the wire. Its body could not stand, and its sad head would only hang toward the floor, but none of that troubled William. He felt he had every right to be proud of it. Its impressive but completely untrue sign said, “Bear Shot by Outlaws in Russia.”
        - id: ch03-b09
          speaker: narrator
          text: Last came the “Blue Dog.” This was Henry's fox terrier, Chips. For Chips, the world had turned very dark indeed. Henry had decided watercolor was not good enough. He had borrowed a bag of blue powder and rubbed it generously all over the dog. At first Chips had struggled wildly. Then he had given up.
        - id: ch03-b10
          speaker: narrator
          text: He sat there in complete despair, glancing now and then at the furious Smuts. But cats, happiness, life, and fighting meant nothing to him anymore. He was miserable. He was ashamed. He was blue.
        - id: ch03-b11
          speaker: narrator
          text: William had dressed for his part as showman. He wore his father's red dressing gown, which dragged along the floor and tripped him whenever he walked. He had snipped a few threads from the fringe of a rug and glued them above his mouth for a mustache. They hung down in two straight lines. A tinsel crown sat on his head, left over from the time his sister had played the Fairy Queen.
        - id: ch03-b12
          speaker: narrator
          text: The boys had advertised everywhere. They had spoken privately to every child nearby and ordered each one to keep the show secret. Their threats about what the Outlaws would do to anyone who talked had kept more than one child awake at night.
        - id: ch03-b13
          speaker: narrator
          text: William looked over the room with satisfaction.
        - id: ch03-b14
          speaker: william
          text: It's a pretty good show for a penny. There can't be many others like it. Ginger, stop talking. You'll ruin everything if people hear the giant's voice coming out of its stomach. Douglas has to do the talking. Anybody can see that. Wait, they're coming! Look at the wall!
        - id: ch03-b15
          speaker: narrator
          text: A thin line of children crawled single file along the top of the garden wall, all of them on hands and knees. They climbed onto the scullery roof and made their careful way toward the bedroom window. These were the first arrivals. They had stopped on their way to Sunday school, just as William had planned.
        - id: ch03-b16
          speaker: narrator
          text: Henry collected their pennies. William cleared his throat and began the tour.
    - id: ch04
      title: The Penny Show
      blocks:
        - id: ch04-b01
          speaker: william
          text: Ladies and gentlemen, this is a white rat from China. See the pink and blue stripes? Every rat in China has them. This is the only real Chinese rat in England. It was brought here specially last week, just for our show. It even eats Chinese bread and butter that gets shipped over for it.
        - id: ch04-b02
          speaker: visitor
          text: Wash it! Go on, wash it and let's see what happens.
        - id: ch04-b03
          speaker: william
          text: Wash it? Of course it gets washed. We wash it morning and night, like anybody else. Chinese rats have to be washed or they die straight away. Water doesn't do anything to the stripes. Anybody who knows about Chinese rats knows that.
        - id: ch04-b04
          speaker: narrator
          text: William laughed at such ignorance and moved on to Smuts. The cat had begun to get used to the wicker chair and was settling down for a nap. William dropped onto all fours, ran his fingers over the wicker, put his face close, and let out a cruel howl. Smuts sprang at him, scratching and spitting.
        - id: ch04-b05
          speaker: william
          text: That's a wild cat. Look at him! He'd kill anybody if he escaped. He'd jump at your throat, claw your eyes out, and bite your neck until his teeth met. If I moved this chair, he'd come straight at you.
        - id: ch04-b06
          speaker: narrator
          text: The visitors hurried away from the chair.
        - id: ch04-b07
          speaker: william
          text: I bet some of you would be dead in no time. He could bite and scratch a person's head clean off. Right off the body!
        - id: ch04-b08
          speaker: narrator
          text: An awed silence followed. Then one child found the courage to object.
        - id: ch04-b09
          speaker: visitor
          text: Oh, come on. That's Smuts. He's your sister's cat.
        - id: ch04-b10
          speaker: narrator
          text: William laughed as if the idea were wonderfully funny. Without being seen, he kicked the chair and made Smuts even wilder.
        - id: ch04-b11
          speaker: william
          text: Smuts? If Smuts acted like this, there wouldn't be many people left alive in our house.
        - id: ch04-b12
          speaker: narrator
          text: The tour reached the giant. William pushed his crown back into place.
        - id: ch04-b13
          speaker: william
          text: Here's a real giant. Look how big he is. He's as tall as two of you together. How do you think he gets through doors? Everything has to be made specially for him. Watch him walk. Go on, Ginger.
        - id: ch04-b14
          speaker: narrator
          text: Ginger took two steps. Douglas clung tightly to his shoulders.
        - id: ch04-b15
          speaker: douglas
          text: By Jove!
        - id: ch04-b16
          speaker: william
          text: Keep going. You can't call that walking.
        - id: ch04-b17
          speaker: narrator
          text: At last Ginger answered from somewhere around the giant's middle.
        - id: ch04-b18
          speaker: ginger
          text: If you keep at me, I'll drop him. I've had about enough of this.
        - id: ch04-b19
          speaker: william
          text: All right. Anyway, it's a giant. A very fine giant.
        - id: ch04-b20
          speaker: visitor
          text: It's got Douglas's face.
        - id: ch04-b21
          speaker: narrator
          text: For one moment, William had no answer.
        - id: ch04-b22
          speaker: william
          text: Well, a giant has to have some kind of face, doesn't it? It can't go around with no face at all.
        - id: ch04-b23
          speaker: narrator
          text: The Russian bear had often been seen around Mrs. Brown's shoulders, so the visitors recognized it at once and jeered. But the Blue Dog was an unquestioned success. Chips crept forward with his blue head down and his blue tail between his blue legs. Every step seemed like an apology for his terrible condition. Henry had done his work well. The children gathered around in silent admiration.
        - id: ch04-b24
          speaker: narrator
          text: William strode forward proudly, tripped hard over the cord of the dressing gown, and nearly fell. He recovered, pulled the crown up from his nose, and continued.
        - id: ch04-b25
          speaker: william
          text: A blue dog. You've never seen one before, have you? And you probably never will again. He was made blue specially for this show. He's the only blue dog in the whole world. People will come from everywhere to see him, and we're including him in a penny show! The zoo would charge you a shilling. You're lucky he's here at all. I bet the zoo wishes it had him. Plenty of shows have brown dogs, black dogs, and white dogs. They don't have blue ones. People even pay to see ordinary dogs. But for one penny, you're getting a blue dog, a dead Russian bear, a giant, a wild cat, and a Chinese rat.
        - id: ch04-b26
          speaker: narrator
          text: Whenever William finished a speech, he had to take the rug fringe out of his mouth. Gravity had a different idea from William about where a mustache belonged.
        - id: ch04-b27
          speaker: visitor
          text: It's only paint. Henry's gate is being painted blue.
        - id: ch04-b28
          speaker: narrator
          text: The objection was weak, and nobody paid it much attention. Whatever the visitors thought about the painted rat, the familiar fox fur, or the giant with Douglas's face, the Blue Dog had impressed them. On the whole, the Outlaws had won a great victory with Chips.
        - id: ch04-b29
          speaker: narrator
          text: While everyone stood admiring the miserable animal, a soft sound came from the room next door. At first it was like wind sighing through trees. It rose and fell, then rose and fell again. Each time it grew louder, until the highest note sounded like a wild animal in pain.
        - id: ch04-b30
          speaker: visitor
          text: What's that noise?
        - id: ch04-b31
          speaker: narrator
          text: William felt uneasy. He could not decide whether this new development improved his show or disgraced it. He needed time to think.
        - id: ch04-b32
          speaker: william
          text: Yes... what is it? I suppose you'd all like to know.
        - id: ch04-b33
          speaker: visitor
          text: Oh, it's just somebody snoring.
        - id: ch04-b34
          speaker: william
          text: Snoring? That's no ordinary snore. Just listen. I bet you couldn't make a noise like that.
        - id: ch04-b35
          speaker: narrator
          text: They listened, spellbound. The gentle sound climbed higher and higher until delighted smiles spread across their faces. Then it stopped. Silence. A moment later, it began softly and started climbing all over again.
        - id: ch04-b36
          speaker: narrator
          text: In a loud whisper, William asked Henry whether they ought to charge extra for listening. The visitors quickly insisted that they weren't listening at all. They simply couldn't help hearing it.
        - id: ch04-b37
          speaker: narrator
          text: A second group had reached the bedroom window and was paying admission, but the first group refused to leave. The room was becoming crowded, and nobody wanted to move away from the sound. Success made William bold. He opened his door, and everyone crept onto the landing. There they pressed their ears against the mysterious door next to his and listened again.
        - id: ch04-b38
          speaker: narrator
          text: Henry took over the tour. William stood in his splendid costume and thought. Slowly, inspiration brought a faint smile to his face. He sent the visitors back into the show room and closed the door.
        - id: ch04-b39
          speaker: narrator
          text: Then William took off his shoes. Very softly, holding his breath, he opened Aunt Emily's door and peeked inside. The afternoon was warm. She lay on top of the comforter, and she had removed her skirt to keep it from getting crushed. Her enormous figure wore only a blouse and a striped petticoat. The wonderful noises poured from her open mouth. Asleep, Aunt Emily was not beautiful.
        - id: ch04-b40
          speaker: narrator
          text: William propped a pillow against the doorway and studied the scene.
        - id: ch04-b41
          speaker: narrator
          text: A few minutes later, a silent and eager crowd filled his room. A new sign marked the spot where visitors had to remove their shoes and take an oath of silence. William gave the oath to a select group with great ceremony. Then he led them, barefoot and on tiptoe, into the next room.
        - id: ch04-b42
          speaker: narrator
          text: A sign hanging from Aunt Emily's bed announced, in William's spelling, “Fat Wild Woman Talking Native Language.”
        - id: ch04-b43
          speaker: narrator
          text: The children stood around her bed in delighted silence. The noise never stopped or weakened. William allowed each group only two minutes. When their time was up, they left unwillingly, paid again, went to the back of the line, and waited for another turn.
        - id: ch04-b44
          speaker: narrator
          text: More children arrived, but now Aunt Emily was the entire show. The Chinese rat had licked away all its stripes. Smuts was sound asleep. Ginger sat on the seat of a chair with Douglas perched on its back. Ginger had finally demanded air and a view, so his head stuck out where the sheets met. The Russian bear lay on the floor, and nobody had bothered to pick it up. Chips was a miserable blue heap. Nobody cared about any of them.
        - id: ch04-b45
          speaker: narrator
          text: New visitors hurried past every other exhibit. They took off their shoes and joined the line outside Aunt Emily's room. Anyone who came out simply went around for another look. Many children ran home for more money. Aunt Emily cost an extra penny on the first visit, then a halfpenny each time after that.
        - id: ch04-b46
          speaker: narrator
          text: The Sunday school bell rang, calling them to class. Not one child left. That evening, the vicar was deeply disappointed. Sunday school attendance had never been so poor.
        - id: ch04-b47
          speaker: narrator
          text: Aunt Emily went on sleeping and snoring before one silent, enchanted group after another. But William was never satisfied for long. His ambition would have impressed many grown-ups. He cleared the room and closed it for a few minutes while his customers waited in breathless excitement.
        - id: ch04-b48
          speaker: narrator
          text: When they were admitted again, the show had three new exhibits. William's sharp eye had searched Aunt Emily's room for every possible detail. On the bedside table now stood a glass holding the teeth he'd found on the washstand. Beside it lay a switch of hair and a toothless comb from her dressing table. Each item had its own cardboard sign. They were labeled the fat wild woman's teeth, hair, and comb, though William's spelling gave the last two words a style all his own.
        - id: ch04-b49
          speaker: narrator
          text: Only the rule of instant expulsion for making a sound kept the children under control. A few had already suffered that terrible punishment. The rest crept inside, silent, expectant, and thrilled, ready for their wonderful two minutes.
        - id: ch04-b50
          speaker: narrator
          text: Aunt Emily never disappointed them. She slept and snored. They borrowed money from one another without a thought. Children with nothing sold their favorite possessions to children who had plenty, and everyone kept coming back.
        - id: ch04-b51
          speaker: narrator
          text: No one knows how long it might have lasted. Then Aunt Emily reached the highest note of one magnificent snore, a note that delighted her audience, and woke with a start.
        - id: ch04-b52
          speaker: narrator
          text: She stared around her. At first, the little crowd of boys seemed like part of a dream, especially when they all turned and fled. Then she sat up. She saw the bedside table. She saw the signs. Finally, she saw the showman, frozen in horror.
        - id: ch04-b53
          speaker: narrator
          text: Aunt Emily leaped from the bed, seized William by the shoulders, and shook him. His teeth rattled. The crown slipped down around his ears and nose. One side of his mustache fell sadly to the floor.
        - id: ch04-b54
          speaker: aunt_emily
          text: You wicked boy! You wicked, wicked, wicked boy!
          emotion: angry
        - id: ch04-b55
          speaker: narrator
          text: William tore himself free and ran to the show room. To protect himself, he pushed a table and three chairs against the door.
        - id: ch04-b56
          speaker: narrator
          text: The room was empty except for Henry, the Blue Dog, and the sleeping Smuts. The giant had collapsed into two crumpled sheets. Douglas had cried, “By Jove!” grabbed his rat, and run. The final customer was racing along the garden wall on all fours as fast as possible.
        - id: ch04-b57
          speaker: narrator
          text: William straightened his crown without thinking.
        - id: ch04-b58
          speaker: william
          text: She's awake. She's gone wild.
        - id: ch04-b59
          speaker: narrator
          text: He listened nervously for angry feet on the stairs and the terrible sound of his father calling him. Nothing came. Aunt Emily moved around in her room, but that was all. William began to hope that if he gave her enough time, she might forget the whole thing.
        - id: ch04-b60
          speaker: henry
          text: Let's count the money.
        - id: ch04-b61
          speaker: narrator
          text: They counted it.
        - id: ch04-b62
          speaker: william
          text: Four shillings and sixpence! Four and six! That's pretty good. We'd only have made about two shillings without Aunt Emily, and I was the one who thought of her. You ought to be grateful to me.
          emotion: happy
        - id: ch04-b63
          speaker: henry
          text: That's fine with me. I'm not jealous. You can have all the credit when she tells your father.
        - id: ch04-b64
          speaker: narrator
          text: William's pride vanished.
        - id: ch04-b65
          speaker: narrator
          text: Then the dreaded door opened, and heavy footsteps began coming down the stairs.
    - id: ch05
      title: A Bright Half-Crown
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Mrs. Brown had come home from her weekly visit and was putting her umbrella in the stand. Aunt Emily came downstairs wearing her hat and coat and carrying a bag. Mr. Brown had just woken from his peaceful Sunday nap. When he heard his wife in the hall, he joined her there.
        - id: ch05-b02
          speaker: narrator
          text: Aunt Emily fixed him with a hard stare.
        - id: ch05-b03
          speaker: aunt_emily
          text: Kindly arrange for a cab. After the humiliations I've endured in this house, I refuse to stay another minute.
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: Trembling with outrage, she described every humiliation. Mrs. Brown pleaded with her, apologized, and tried to coax her into staying. Mr. Brown slipped quietly away to find a cab. When he returned, Aunt Emily was still talking in the hall.
        - id: ch05-b05
          speaker: aunt_emily
          text: A crowd of common little boys was standing around me, and there were dreadful, improper signs all over the room.
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: Mr. Brown carried her bag down to the cab. Aunt Emily followed him.
        - id: ch05-b07
          speaker: aunt_emily
          text: And all this happened while I'm in such poor health.
        - id: ch05-b08
          speaker: narrator
          text: From inside the cab, she delivered one last blow.
        - id: ch05-b09
          speaker: aunt_emily
          text: If this horrible business had not occurred, I might have stayed through the entire winter and perhaps part of the spring.
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: As the cab drove away, William's father wiped his forehead with his handkerchief.
        - id: ch05-b11
          speaker: mrs_brown
          text: How dreadful!
        - id: ch05-b12
          speaker: narrator
          text: She carefully avoided looking at her husband. Then sudden determination entered her voice.
        - id: ch05-b13
          speaker: mrs_brown
          text: What William did was disgraceful. You must speak to him.
        - id: ch05-b14
          speaker: father
          text: I will.
        - id: ch05-b15
          speaker: narrator
          text: He called up the stairs in a stern voice.
        - id: ch05-b16
          speaker: father
          text: William!
          emotion: angry
        - id: ch05-b17
          speaker: narrator
          text: William's heart sank.
        - id: ch05-b18
          speaker: william
          text: She told him.
        - id: ch05-b19
          speaker: henry
          text: You'd better go down and get it over with.
        - id: ch05-b20
          speaker: father
          text: William!
          emotion: angry
        - id: ch05-b21
          speaker: narrator
          text: Henry edged toward the window, ready to escape if Mr. Brown came upstairs.
        - id: ch05-b22
          speaker: henry
          text: Go on. If you don't, he'll come up and get you.
        - id: ch05-b23
          speaker: narrator
          text: William slowly pulled away the barricade and went downstairs. He had remembered to remove the crown and dressing gown, but one half of the mustache still drooped over his mouth.
        - id: ch05-b24
          speaker: narrator
          text: His father stood waiting in the hall.
        - id: ch05-b25
          speaker: father
          text: What's that dreadful thing on your face?
        - id: ch05-b26
          speaker: william
          text: Whiskers.
        - id: ch05-b27
          speaker: narrator
          text: His father accepted this answer.
        - id: ch05-b28
          speaker: father
          text: Did you really take your friends into your aunt's bedroom without permission and hang vulgar signs all around it?
        - id: ch05-b29
          speaker: narrator
          text: William looked up at his father's face. Suddenly, hope returned. Mr. Brown was no actor.
        - id: ch05-b30
          speaker: william
          text: Yes.
        - id: ch05-b31
          speaker: father
          text: It was disgraceful. Absolutely disgraceful. That's all.
        - id: ch05-b32
          speaker: narrator
          text: But that was not quite all. Something hard and round slipped into William's hand. He ran lightly back upstairs.
        - id: ch05-b33
          speaker: henry
          text: Hello! That didn't take long. What happened?
        - id: ch05-b34
          speaker: narrator
          text: William opened his hand. Something bright shone in his palm.
        - id: ch05-b35
          speaker: william
          text: Look! Crumbs, look!
        - id: ch05-b36
          speaker: narrator
          text: It was a bright half-crown.
