cover_prompt: |-
  A wordless cover scene in an English village around 1920 catches William Brown in the middle of an ambitious backyard scheme. William is an untidy eleven-year-old boy with rumpled brown hair, a scuffed school cap, crooked tie, dark blazer, short trousers, long socks, and muddy shoes. Three similarly dressed schoolboy friends steady a homemade cart while William raises a wooden plank toward a garden wall, and a stern adult silhouette appears at a distant gate. William's determined attempt to launch the wobbling cart is the focal action, energetic but clearly harmless. Use a low dynamic three-quarter view with diagonals from the plank and fence, keeping generous uncluttered sky above the rooftops. Preserve authentic interwar English clothes and props and avoid likenesses from television or other adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
