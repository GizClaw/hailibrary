            Robert's happiness was complete. The boat ride would give him his chance. He could form a friendship meant to last forever, arrange to exchange letters, and carefully suggest his plans for the future. Naturally, he would have to explain that he could not offer his heart and hand while he was still in college. But if she would only wait— He began composing speeches inside his head.

            They reached the riverbank and opened the lunch baskets. Freed from Robert's advice about impossible delicacies, the cook had outdone herself. The party chose a place under the trees, where the leaves gave them plenty of shade. They spread the white cloth on the ground, unpacked the food, and took their places around it.

            Robert picked up a plate of sandwiches. He turned toward Miss Cannon, ready to offer them with the courteous gesture he had imagined. Before he could do it, his eyes moved past her to the long white road that ran from the village down to the riverside. His gaze locked onto something in the distance. Horror froze his face. The hand holding the plate lost all its life and sank back onto the tablecloth.

            The others saw Robert's expression and followed his stare. Far up the white road, a strange figure was riding a bicycle toward them. Its face appeared black. A few tired feathers drooped from its head, and a doormat streamed behind it in the wind. A crowd of small children ran after the bicycle, cheering as they came. Even at that distance, there was something vaguely familiar about the rider.
