  chapters:
    - id: ch01
      title: William the Intruder
      blocks:
        - id: ch01-b01
          speaker: robert
          text: She's unlike anyone else in the whole world. I couldn't possibly describe her. Nobody could!
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: Robert could barely get the words out in his excitement. His mother went on darning his socks without a comment. Only his younger brother showed any interest.
        - id: ch01-b03
          speaker: william
          text: What's so different about her? Is she blind, or lame, or something?
        - id: ch01-b04
          speaker: narrator
          text: Robert swung toward him, thoroughly annoyed.
        - id: ch01-b05
          speaker: robert
          text: Oh, go play with your trains. A child your age wouldn't understand any of this.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: William withdrew with dignity to the window. His interest did not fade in the least, and he listened closely as the conversation went on.
        - id: ch01-b07
          speaker: mrs_brown
          text: But who is she, dear? Robert, I simply can't imagine how you make such enormous holes in the heels of your socks.
        - id: ch01-b08
          speaker: narrator
          text: Robert dragged both hands wildly through his hair.
        - id: ch01-b09
          speaker: robert
          text: I've already told you who she is, Mother. I've talked about her from the moment I came in.
        - id: ch01-b10
          speaker: mrs_brown
          text: Yes, dear, but you haven't told me her name, or anything that would identify her.
        - id: ch01-b11
          speaker: narrator
          text: Robert answered with the patience of someone enduring a terrible trial.
        - id: ch01-b12
          speaker: robert
          text: Her name is Miss Cannon. She's staying with the Clives. I met her this morning when she was out with Mrs. Clive, and Mrs. Clive introduced us. She's the most beautiful girl I've ever seen, and she—
        - id: ch01-b13
          speaker: mrs_brown
          text: Yes, you've told me that part.
        - id: ch01-b14
          speaker: robert
          text: Then we have to invite her to tea. I know I can't marry while I'm still in college, but I could at least get to know her. Not that she'd ever notice me. She's far above me. She's above everyone. You can't imagine how beautiful she is. If I tried to describe her, you wouldn't believe me. No one could describe her. She—
        - id: ch01-b15
          speaker: narrator
          text: Mrs. Brown hurried to interrupt him.
        - id: ch01-b16
          speaker: mrs_brown
          text: I'll ask Mrs. Clive to bring her one afternoon. By the way, I've run out of this blue wool. I wish all your socks were the same color. I'll have to mend this one with mauve, but the hole is right under your heel. It won't show.
        - id: ch01-b17
          speaker: narrator
          text: Robert gasped in horror.
        - id: ch01-b18
          speaker: robert
          text: You can't do that, Mother! How can you be sure it won't show? Even if it doesn't, I'll know it's there. This is a crisis in my life now that I've met her. I can't go around feeling ridiculous.
          emotion: fearful
        - id: ch01-b19
          speaker: william
          text: Say, are you in love with her?
          emotion: surprised
        - id: ch01-b20
          speaker: mrs_brown
          text: William, don't use such vulgar expressions. Robert merely has a friendly interest in her. Isn't that right, Robert?
        - id: ch01-b21
          speaker: narrator
          text: Robert groaned as if hope itself had deserted him.
        - id: ch01-b22
          speaker: robert
          text: A friendly interest! No one even tries to understand me. I've told you she's the most beautiful girl alive, that she's far above me and everyone else, and you call it friendly interest. This is the one great passion of my life. It's—
        - id: ch01-b23
          speaker: mrs_brown
          text: Well, I'll call Mrs. Clive and ask whether she's free tomorrow afternoon.
        - id: ch01-b24
          speaker: narrator
          text: Robert's tragic face brightened. Then he fell into deep thought, and worry settled over it again.
        - id: ch01-b25
          speaker: robert
          text: Ellen can press the pants from my brown suit tonight, can't she? And could you buy me socks and a tie before tomorrow? Blue, I think. Bright enough to notice, but not too bright. I wish the laundry did decent work. A new collar ought to shine, and they never make mine shine. I'd better buy new collars too. It matters so much how a person looks. She—people judge you by your appearance. They—
        - id: ch01-b26
          speaker: narrator
          text: Mrs. Brown put down her sewing.
        - id: ch01-b27
          speaker: mrs_brown
          text: I'll go call Mrs. Clive now.
        - id: ch01-b28
          speaker: narrator
          text: When she came back, William had left. Robert stood at the window, pale with suspense and wearing a frown fit for an emperor.
        - id: ch01-b29
          speaker: mrs_brown
          text: Mrs. Clive can't come, but Miss Cannon will come by herself. Apparently she already knows Ethel. So you can stop worrying, dear.
        - id: ch01-b30
          speaker: narrator
          text: Robert gave a bitter little laugh.
        - id: ch01-b31
          speaker: robert
          text: Stop worrying? There's still plenty to worry about. What are we going to do about William?
        - id: ch01-b32
          speaker: mrs_brown
          text: What about him?
        - id: ch01-b33
          speaker: robert
          text: Can't he go somewhere else tomorrow? Nothing ever goes right when William is around. You know it doesn't.
        - id: ch01-b34
          speaker: mrs_brown
          text: The poor boy has to take tea with us. I'm sure he'll behave. Ethel will be home, and she can help. I'll tell William not to bother you.
        - id: ch01-b35
          speaker: narrator
          text: William received exact instructions. He was to stay outside until the tea bell rang, then go back to the garden as soon as tea was over. He had no objection. The idea of Robert as a heartbroken lover thrilled him, and he treated the whole affair with great seriousness.

            He was in the garden when the visitor came up the drive. Since he had been told not to draw her attention, he slipped quietly behind the rhododendrons and peered through the leaves. This also suited the part he was playing that afternoon. He was Chief Red Hand, a fearsome warrior.

            Miss Cannon really was pretty. Her hair and eyes were brown, and dimples appeared and vanished in her rosy cheeks. She wore white and carried a parasol. She came up the drive without looking to either side. Then a bush moved. She turned and found a small face watching her. It was blackened with burnt cork and surrounded by chicken feathers tied on with tape. Her dimples appeared.
        - id: ch01-b36
          speaker: miss_cannon
          text: Greetings, mighty chief!
        - id: ch01-b37
          speaker: narrator
          text: William stared with his mouth open. Such understanding was rare in a grown-up.
        - id: ch01-b38
          speaker: william
          text: I'm Chief Red Hand.
        - id: ch01-b39
          speaker: narrator
          text: He added a savage scowl. Miss Cannon bowed low, her brown eyes sparkling.
        - id: ch01-b40
          speaker: miss_cannon
          text: And what terrible death is waiting for the helpless pale-face you've captured?
        - id: ch01-b41
          speaker: william
          text: You'd better come quietly to my wigwam and find out.
        - id: ch01-b42
          speaker: narrator
          text: She glanced toward the bend where the house stood hidden. Then she laughed softly and followed him through the bushes.

            From one spot they could see the drawing-room window. Robert stood there, pale and rigid with anxiety. His freshly pressed pants were turned up high enough to display the new blue socks. His soulful eyes never left the bend in the drive where his beloved ought to appear. Again and again, one nervous hand rose to touch his new tie and his bright new collar. The collar was too high and much too tight, but the storekeeper had assured his troubled customer that it was the newest and most correct style.

            Meanwhile, the beloved had reached William's dugout. He had built it from branches cut off the trees and had spent many happy hours there with his friends.
        - id: ch01-b43
          speaker: william
          text: This is the wigwam, pale-face. Stand here while I ask Snake Face and the other chiefs what we're going to do with you. See those bushes? That's Snake Face and all the rest.
        - id: ch01-b44
          speaker: narrator
          text: The last part came in his ordinary voice. He marched over to the bushes and spent several minutes speaking fiercely in words that made no sense. Every now and then he turned his blackened, scowling face toward Miss Cannon and pointed at her, apparently describing his prisoner. Then he came back.
        - id: ch01-b45
          speaker: william
          text: I was talking Red Indian just then. Snake Face says the pale-face has to be scalped and cooked and eaten!
        - id: ch01-b46
          speaker: narrator
          text: William dropped his voice to a low roar, made his scowl even fiercer, and opened a pocketknife as though he meant to begin at once.
        - id: ch01-b47
          speaker: william
          text: But the other chiefs and me say you can stay alive if you'll be our squaw and cook for us.
        - id: ch01-b48
          speaker: narrator
          text: Miss Cannon sank to her knees.
        - id: ch01-b49
          speaker: miss_cannon
          text: Thank you, great Red Hand. I am your most grateful servant, and I would be delighted to become your squaw.
        - id: ch01-b50
          speaker: william
          text: I've got a fire back here.
        - id: ch01-b51
          speaker: narrator
          text: He proudly led her behind the wigwam. A small wood fire smoldered weakly there, nearly choked by a large tin full of dark liquid. With a grand sweep of his hand, Red Hand pointed to it.
        - id: ch01-b52
          speaker: william
          text: That, O Squaw, is a pale-face we caught last night!
        - id: ch01-b53
          speaker: narrator
          text: The squaw clasped her hands.
        - id: ch01-b54
          speaker: miss_cannon
          text: Oh, wonderful! Is he cooking now?
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: Red Hand nodded.
        - id: ch01-b56
          speaker: william
          text: I'll find you some feathers. A squaw ought to wear feathers too.
        - id: ch01-b57
          speaker: narrator
          text: He vanished into the wigwam and returned with a handful of chicken feathers. Laughing, Miss Cannon removed her broad hat and tucked the feathers into her soft brown hair.
        - id: ch01-b58
          speaker: miss_cannon
          text: This is great fun. I love playing Red Indians!
          emotion: happy
        - id: ch01-b59
          speaker: william
          text: I've got some cork you can black your face with too. It doesn't take long to burn it in the fire.
        - id: ch01-b60
          speaker: narrator
          text: He offered it with reckless generosity. Miss Cannon looked through the trees toward the house chimneys, then shook her head with real regret.
        - id: ch01-b61
          speaker: miss_cannon
          text: I'm afraid I'd better not do that.
          emotion: sad
        - id: ch01-b62
          speaker: william
          text: All right. I'll go hunting while you stir the pale-face. We'll eat him when I get back. Watch how I track things.
        - id: ch01-b63
          speaker: narrator
          text: He flourished his open knife, threw dark looks around him, and crawled into the bushes on his hands and knees. He kept circling where his squaw could see him, plainly determined to impress her. She stirred the mixture with a twig and rewarded him now and then with exactly the admiring looks he wanted.

            Before long he returned with a doormat over his shoulder and dropped it at her feet.
        - id: ch01-b64
          speaker: william
          text: A deer for you, O Squaw. Cook it. I've had it out here all morning, and they still haven't missed it.
        - id: ch01-b65
          speaker: narrator
          text: He brought two small tins with jagged edges from the wigwam. Then he lifted the large tin off the fire and poured some of the liquid into each one.
        - id: ch01-b66
          speaker: william
          text: Here you are, Squaw. Have some pale-face.
        - id: ch01-b67
          speaker: miss_cannon
          text: Oh, I'm sure he's delicious, but—
        - id: ch01-b68
          speaker: william
          text: You don't have to be scared. It's really good. Look, it's only soup powder and water. I promise it's good.
        - id: ch01-b69
          speaker: narrator
          text: He picked up the paper wrapper from a soup packet lying behind the trees.
        - id: ch01-b70
          speaker: miss_cannon
          text: How nice! Do they really let you take—
        - id: ch01-b71
          speaker: william
          text: They don't let me. There's lots of it in the pantry, though, and they never notice if one packet goes missing now and then. Go ahead. I don't mind you having it. Honestly. I can always get more.
        - id: ch01-b72
          speaker: narrator
          text: Miss Cannon bravely raised the tin, took one sip, and closed her eyes.
        - id: ch01-b73
          speaker: miss_cannon
          text: Magnificent!
          emotion: happy
        - id: ch01-b74
          speaker: narrator
          text: She drained the tin. Pride and happiness lit William's face. Then a bell rang inside the house, and his expression fell.
        - id: ch01-b75
          speaker: william
          text: Crumbs! That's the tea bell!
          emotion: surprised
        - id: ch01-b76
          speaker: narrator
          text: Miss Cannon quickly pulled the feathers from her hair and put on her hat.
        - id: ch01-b77
          speaker: miss_cannon
          text: I don't suppose you keep a mirror in your wigwam?
        - id: ch01-b78
          speaker: william
          text: N-no. But I'll get one before you come again. I can take one from Ethel's room.
        - id: ch01-b79
          speaker: miss_cannon
          text: Won't Ethel mind?
        - id: ch01-b80
          speaker: william
          text: She won't know.
        - id: ch01-b81
          speaker: narrator
          text: Miss Cannon smoothed her dress.
        - id: ch01-b82
          speaker: miss_cannon
          text: I'm terribly late. What will everyone think? It was dreadful of me to follow you, but I'm always doing dreadful things. That's our secret. Now come inside, and we'll confess together.
        - id: ch01-b83
          speaker: narrator
          text: She gave him a smile so dazzling that he could only stare.
        - id: ch01-b84
          speaker: william
          text: I can't come yet. I promised I'd wash and get tidy before tea. Today's special because of Robert, you know. Well, you know. Because of—Robert!
        - id: ch01-b85
          speaker: narrator
          text: He nodded meaningfully at her puzzled face.
        - id: ch01-b86
          speaker: narrator
          text: Inside the house, Robert had become frantic. He had run his fingers through his hair so often that it stood around his head like a spiked halo.
        - id: ch01-b87
          speaker: robert
          text: We can't possibly start without her. She'll think we're horrible, and she'll never want anything to do with me. A girl like her isn't used to people beginning tea before she arrives. And you, my own mother, are treating her this way. You could be ruining my life. You don't understand what this means. If you'd seen her, you'd have more sympathy. She's the most beautiful girl I've ever known, and I can't begin to describe—
          emotion: fearful
        - id: ch01-b88
          speaker: mrs_brown
          text: I invited her for four o'clock, Robert, and it's past four-thirty. Ethel, tell Emma to ring the bell and serve tea.
        - id: ch01-b89
          speaker: narrator
          text: Sweat stood on Robert's forehead.
        - id: ch01-b90
          speaker: robert
          text: This is the end of every hope I had.
          emotion: sad
        - id: ch01-b91
          speaker: narrator
          text: A few minutes after the tea bell stopped ringing, the front doorbell sounded sharply. Robert flattened his hair with wild sweeps of both hands and forced a suffering smile onto his face.

            Miss Cannon appeared in the doorway, charming and modest.
        - id: ch01-b92
          speaker: miss_cannon
          text: Aren't I disgracefully late? Honestly, I met your little boy in the driveway and stayed with him all this time. He's an absolute darling, isn't he?
        - id: ch01-b93
          speaker: narrator
          text: Her brown eyes settled on Robert. He wet his lips and produced that tortured smile, but words failed him.
        - id: ch01-b94
          speaker: miss_cannon
          text: I already know Ethel, of course. And I met your son yesterday, didn't I?
        - id: ch01-b95
          speaker: narrator
          text: Robert made an unclear sound. He lifted one hand to his painfully tight collar, then gave her a vague bow. They went in to tea.

            William arrived a few minutes later. He had brushed his hair and removed every feather. He had also washed his face, though patches of burnt cork still showed. Most of the conversation passed between Miss Cannon and Ethel. Robert said almost nothing. He searched his mind desperately for one brilliant remark, something so striking that Miss Cannon would place him far above every ordinary young man she knew. Nothing came. Whenever her brown eyes rested on him, he summoned the same joyless smile and lifted one hand to ease the pressure of the collar around his neck. He could feel the precious minutes slipping away. His great passion remained unrevealed, except for the message he tried to send through his soulful eyes. Worst of all, he feared Miss Cannon had not read that message.

            When everyone rose from the table, William turned anxiously to his mother. His whisper hissed through the room.
        - id: ch01-b96
          speaker: william
          text: Should I have worn my best suit too?
        - id: ch01-b97
          speaker: narrator
          text: Mischief danced in Miss Cannon's eyes. Robert gave William a look that might have destroyed anyone with less courage.

            William had completely forgotten his orders to leave after tea. Hints could not move him. He followed the victorious Miss Cannon into the drawing room and sat on the sofa beside Robert, who had carefully chosen a place next to his beloved.
        - id: ch01-b98
          speaker: robert
          text: Are you, uh, fond of reading, Miss Cannon?
        - id: ch01-b99
          speaker: william
          text: I wrote a story once. It was really good. I showed it to some people, and I can show it to you. It starts with a pirate on a raft. He stole some jewelry, and the king who owned it was chasing him in a steamship. Just when the king was catching up, the pirate jumped in the water with the jewels. Then a fish ate them, and the king caught the fish, and—
        - id: ch01-b100
          speaker: narrator
          text: He had to stop for breath.
        - id: ch01-b101
          speaker: miss_cannon
          text: I'd love to read it!
          emotion: happy
        - id: ch01-b102
          speaker: narrator
          text: Robert turned sideways and planted one arm on his knee to shut William out.
        - id: ch01-b103
          speaker: robert
          text: What flower do you like best, Miss Cannon?
        - id: ch01-b104
          speaker: narrator
          text: William's head stretched around Robert's arm.
        - id: ch01-b105
          speaker: william
          text: I have a garden. Virginia stock grows everywhere in it, and it comes up really fast. Mustard and cress come up fast too. I like plants that don't keep you waiting. Don't you get tired of waiting for the slow ones?
        - id: ch01-b106
          speaker: narrator
          text: Robert stood up in desperation.
        - id: ch01-b107
          speaker: robert
          text: Would you like to see the garden and the greenhouses, Miss Cannon?
        - id: ch01-b108
          speaker: miss_cannon
          text: I'd love to.
        - id: ch01-b109
          speaker: narrator
          text: Robert led the way outside after giving William a threatening glare. William followed, full of innocent enthusiasm.
        - id: ch01-b110
          speaker: william
          text: Can you tie knots that never come undone?
        - id: ch01-b111
          speaker: miss_cannon
          text: No. I wish I could.
        - id: ch01-b112
          speaker: william
          text: I can. I'll find some string and teach you later. It's easy once you've practiced. I can also make paper airplanes that fly when it's windy. You just have to make them the right size. I can make those, and I can make all sorts of things from matchboxes and—
        - id: ch01-b113
          speaker: narrator
          text: Robert could stand no more.
        - id: ch01-b114
          speaker: robert
          text: These are my father's roses. He's extremely proud of them.
        - id: ch01-b115
          speaker: miss_cannon
          text: They're beautiful.
        - id: ch01-b116
          speaker: william
          text: Just wait till you see my Virginia stock. Then you'll see something. Just wait—
        - id: ch01-b117
          speaker: robert
          text: Would you accept this tea rose, Miss Cannon? It suits you. You and flowers—I mean, I'm sure you love flowers, and you should always have them. If I—
        - id: ch01-b118
          speaker: narrator
          text: Robert had turned purple as he offered it.
        - id: ch01-b119
          speaker: william
          text: I'll pick those red roses for you, and that white one too. And you can have some of my Virginia stock. I don't give my Virginia stock to anybody.
        - id: ch01-b120
          speaker: narrator
          text: When they returned to the drawing room, Miss Cannon carried an enormous bunch of Virginia stock and red and white roses. Robert's one tea rose had vanished inside it. William walked beside her, talking with perfect confidence. Robert followed like a pale statue of despair.

            He sent his mother an agonized look. Mrs. Brown called William over to her corner, while Robert and Miss Cannon sat together on the sofa again.
        - id: ch01-b121
          speaker: robert
          text: I hope—I truly hope you're going to stay here for a long time.
        - id: ch01-b122
          speaker: william
          text: Why can't I even talk to her?
        - id: ch01-b123
          speaker: narrator
          text: William's whisper was both loud and offended.
        - id: ch01-b124
          speaker: mrs_brown
          text: Hush, dear.
        - id: ch01-b125
          speaker: robert
          text: I'd be very pleased to show you some of the walks around here, if you would give me the pleasure—the honor.
        - id: ch01-b126
          speaker: narrator
          text: He spoke desperately, keeping one fearful eye on William in the corner.
        - id: ch01-b127
          speaker: william
          text: I was only talking to her. I wasn't hurting anything. I was just talking!
        - id: ch01-b128
          speaker: narrator
          text: The room went completely still. Robert's face turned purple. He opened his mouth, desperate to say anything loud enough to cover that awful whisper, but no sound came. Miss Cannon was plainly listening.
        - id: ch01-b129
          speaker: william
          text: Is nobody else allowed to speak to her just because Robert's fallen in love with her?
        - id: ch01-b130
          speaker: narrator
          text: The hissing appeal filled every corner of the room. For weeks afterward, the horror of that moment followed Robert through his days and haunted his nights.

            Mrs. Brown coughed quickly and began a long, unnecessary account of the caterpillars attacking her husband's favorite rosebush. A minute later, William withdrew to the garden with dignity. Miss Cannon stood up from the sofa.
        - id: ch01-b131
          speaker: miss_cannon
          text: I'm afraid I really must go.
        - id: ch01-b132
          speaker: narrator
          text: She smiled. Robert rose slowly, crushed but not cured of love.
        - id: ch01-b133
          speaker: robert
          text: You will come back sometime, won't you?
        - id: ch01-b134
          speaker: miss_cannon
          text: I will. I can't wait to see more of William. I adore him!
          emotion: happy
        - id: ch01-b135
          speaker: narrator
          text: The family did its best to soothe Robert's wounded feelings. In the end, Ethel found the one plan that cheered him. They would have a picnic the following Thursday. It was Robert's birthday and also the last day of Miss Cannon's visit. The party would include Robert, Ethel, Mrs. Clive, and Miss Cannon. William would not even be told where they were going.

            They sent the invitation that evening. All week, Robert dreamed about picnic lunches. He kept proposing impossible delicacies that the cook had never even heard of. At last, she threatened to quit. Only then did he grudgingly agree to leave the arrangements in her hands. His white flannel clothes were already perfectly clean, but he sent them to the laundry anyway. A note went with them. It hinted darkly at legal action unless every piece came back spotless by Thursday morning. Robert spent the week wearing a frown and an expression of fixed, solemn purpose. He ignored William completely. At a used bookstore, he bought a book of poems and placed it on the table beside his bed.

            No one saw Miss Cannon before Thursday. The morning arrived clear and bright, and Robert's anxious spirits rose with the sun. His father gave him a watch and chain. His mother gave him a bicycle. William contributed a tin of toffee, though the gift was not entirely selfless.

            The party met Mrs. Clive and Miss Cannon at the station. They bought tickets to a village a few miles away, planning to walk from there to a shady place beside the river.

            William's pride was slightly hurt by being so deliberately excluded from the party. Still, he accepted his fate. He spent the first part of the morning among the rhododendrons in the role of Chief Red Hand. His costume had grown since the last game. He had found an ostrich feather in Ethel's room and added it to his headdress. He had used almost an entire burnt cork to blacken his face, and the doormat was pinned across his shoulders like a cloak.

            He melted some treacle toffee in rainwater over his smoky fire, mixed in orange juice, and drank the result. Then he tired of being Chief Red Hand. He went upstairs to inspect Robert's birthday presents.

            The tin of toffee stood on the table by Robert's bed. William took one or two pieces as a matter of course and began reading the love poems. He kept helping himself while he read. A few minutes later, he looked down and was horrified to find the tin empty. With a sigh, he fastened the lid again. He wondered whether Robert would guess who had eaten all the candy, and he was afraid Robert would. On the other hand, William had been the one who gave it to him. And he certainly had not known he was eating the whole tin while he did it.

            Next, William moved to the dressing table, where the new watch and chain were waiting. He tried them on at several angles. He stood this way and that, studying how they looked with a variety of poses. For a while, he was strongly tempted to keep them on for the rest of the morning. In the end, he resisted and carefully put them back on the dressing table.

            Downstairs, he wandered around to the shed. Robert's new bicycle stood there in all its shining glory. The paint was spotless, every part gleamed, and William gazed at it with awe and admiration. He decided there was no possible way to damage a bicycle merely by leading it carefully around the house. The knowledge that Mrs. Brown had gone shopping made the decision easier. He wheeled it around the house once, then again, and then several more times. Walking beside it gave him a wonderful feeling of importance. It also felt very much as if the bicycle belonged to him.

            Soon he hated the thought of giving up that feeling and putting the bicycle away. He began wondering whether riding it could really be so difficult. He had tried once before while staying with an aunt, so the idea was not entirely new. He brought a garden bench over and stood on it. From there, with considerable difficulty, he transferred himself to the bicycle seat. The bicycle moved. To William's surprise and delight, he traveled several whole yards before he fell off.

            He climbed back onto the bench, mounted the bicycle again, and fell off again. On the next attempt, he stayed upright long enough to ride straight into a holly bush. By then, he had forgotten the picnic, Robert, his costume, and everything else. Nothing mattered except mastering the art of riding. He mounted again and again. Sometimes he fell. Sometimes he headed straight back into the holly bush, as though it were pulling him in. The bicycle no longer looked spotless. Scratches appeared in the shining black paint. The handlebars bent slightly and became dull. William's own body was bruised and battered, but his determination remained unbeaten.

            Finally, he escaped the fatal pull of the holly bush. He managed to steer an unsteady zigzag down the whole driveway and out through the gate. William had never formed any plan to ride into the road. In fact, he had forgotten that he was still wearing his feathered headdress, his blackened face, and the doormat fastened around his shoulders. Yet there he was, riding away from home in full costume. Only after he was actually in the road did he understand two terrible things. Turning back was impossible, and he had no idea how to get off the bicycle.

            What came next felt more like a nightmare than anything else. A large truck came toward him, filling the road ahead. William panicked and swerved down a side street to escape it. That street led him into another side street, and the next turn carried him still farther from home. People heard the commotion and came out of their houses to watch him pass. Children ran into the road behind him. Some booed, some cheered, and soon they were following in a crowd.

            William rode on and on for one reason only. He could not stop. Usually his nerve was made of iron, but now it had failed him. He did not even have enough presence of mind to throw himself off. Before long, he was completely lost. The houses thinned out, the town fell behind him, and he had no idea what road he was on or where it might lead. Wherever he went, he became the center of attention. His face was blackened and streaked with sweat. The doormat snapped and streamed behind him in the wind. His headdress had begun to collapse, and every now and then another feather broke free and floated away. The sight of him brought the local population to its doors.

            The watchers tried to explain him. Some said he must have escaped from an asylum. Others were sure the whole display was an advertisement, though they could not say what it advertised. The children decided he was probably part of a circus. William himself had passed beyond despair. Under the black streaks, his face was pale and set. The sharp panic he had felt at first was gone. In its place came the dull certainty that this ride would continue forever. He would never discover how to stop. He might go clear across England. Perhaps he was already getting close to the sea. He felt that it could not be very far away. He wondered if he would ever see his mother and father again.

            All the while, his feet went on pedaling mechanically. His legs were too short to keep contact with the pedals through a full turn. Whenever a pedal dropped to its lowest point, his foot lost it. Then he had to wait for it to rise, catch it as it came up, and drive it down again with all his strength.

            It was exhausting. William wondered whether anyone would feel sorry if he dropped dead.

            William had no idea where he was going.

            But Fate knew.
