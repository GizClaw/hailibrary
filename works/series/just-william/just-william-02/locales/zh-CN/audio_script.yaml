audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 文雅矜持，不耐烦时反而格外甜
        timbre: 清亮的年轻女声
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负急躁，对弟弟毫不客气
        timbre: 平滑的青年男声
        pace: 中速偏快
        pitch: 中音
    miss_cannon:
      display_name: 坎农小姐
      tts:
        delivery: 活泼大方，端庄里藏着顽皮的笑意
        timbre: 柔亮的年轻女声
        pace: 轻快
        pitch: 中高音
    mrs_clive:
      display_name: 克莱夫太太
      tts:
        delivery: 随和开朗，谈话自然亲切
        timbre: 温润的成年女声
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 罗伯特唯一伟大的爱情
      blocks:
        - id: ch01-b01
          speaker: robert
          text: 她跟所有人都不一样。我根本说不出她是什么样，谁也说不出来！
          emotion: surprised
        - id: ch01-b02
          speaker: narrator
          text: 母亲还在补他的袜子，一句话也没接。倒是弟弟威廉马上来了兴趣。
        - id: ch01-b03
          speaker: william
          text: 她到底哪儿不一样？她是看不见，还是腿瘸，还是有什么别的毛病？
        - id: ch01-b04
          speaker: narrator
          text: 罗伯特恼火地转过身。
        - id: ch01-b05
          speaker: robert
          text: 玩你的火车去！你这么小，懂什么？
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 威廉很有尊严地退到窗边，照旧听着，兴致一点也没减。
        - id: ch01-b07
          speaker: mother
          text: 可她到底是谁呀，亲爱的？还有，罗伯特，你的袜子后跟怎么总能破这么大的洞？
        - id: ch01-b08
          speaker: narrator
          text: 罗伯特抓住自己的头发，简直要发疯了。
        - id: ch01-b09
          speaker: robert
          text: 妈妈，我一进来就在告诉您她是谁！
        - id: ch01-b10
          speaker: mother
          text: 是呀，可你没说她叫什么，也没说她是什么人。
        - id: ch01-b11
          speaker: robert
          text: 好吧。她姓坎农，住在克莱夫家。今天早上，克莱夫太太把我们介绍认识了。她是我见过最美的姑娘，而且她……
        - id: ch01-b12
          speaker: mother
          text: 对，对，这些你已经讲过了。
        - id: ch01-b13
          speaker: robert
          text: 总之，我们一定得请她来喝茶。我现在还不能结婚，至少大学没念完不行，可我可以先跟她熟起来。当然，她大概不会喜欢我。她比我高贵，比谁都高贵。您想象不出她的样子，我说了您也不会信。根本没人能把她说清楚。她……
        - id: ch01-b14
          speaker: mother
          text: 我会请克莱夫太太找个下午带她来。对了，蓝毛线没有了，我只能拿淡紫色补你的袜子。反正补的是脚后跟，看不见。
        - id: ch01-b15
          speaker: narrator
          text: 罗伯特吓得吸了一口气。
        - id: ch01-b16
          speaker: robert
          text: 妈妈，不能这么补！您怎么知道一定看不见？就算看不见，光是想到它也受不了。现在正是我人生最要紧的时候，我不能一边走路，一边想着自己有多可笑。
        - id: ch01-b17
          speaker: william
          text: 喂，你是不是迷上她了？
        - id: ch01-b18
          speaker: mother
          text: 威廉，别说这么粗俗的话。罗伯特只是把她当朋友，很喜欢她，对不对？
        - id: ch01-b19
          speaker: robert
          text: 当朋友！我讲了这么多，您还是不明白。她是我见过最美、最高贵的姑娘，这不是普通的喜欢。这是我一生中唯一伟大的爱情！这是……
          emotion: sad
        - id: ch01-b20
          speaker: mother
          text: 好了，我现在就打电话，问克莱夫太太明天下午有没有空。
        - id: ch01-b21
          speaker: narrator
          text: 罗伯特那张年轻而悲壮的脸一下亮了。可他想了想，忧愁又回来了。
        - id: ch01-b22
          speaker: robert
          text: 今晚能让艾伦熨一下我的棕色西裤吗？妈妈，明天以前还得买袜子和领带。我要蓝色，亮一点，可不能亮得过分。洗衣店也真不像话，新衣领就该有光泽，他们从来浆不好。明天我最好多准备几副。外表太重要了，她会看你的样子来判断你……
        - id: ch01-b23
          speaker: mother
          text: 我现在就去打电话。
        - id: ch01-b24
          speaker: narrator
          text: 母亲回来时，威廉已经走了。罗伯特守在窗前，等得脸色发白，眉头皱得像拿破仑。
        - id: ch01-b25
          speaker: mother
          text: 克莱夫太太不能来，不过坎农小姐会自己来。她以前见过埃塞尔，所以你不用操心了。
        - id: ch01-b26
          speaker: robert
          text: 操心？值得操心的事多着呢。威廉怎么办？
        - id: ch01-b27
          speaker: mother
          text: 威廉怎么了？
        - id: ch01-b28
          speaker: robert
          text: 明天不能让他去别处吗？只要他在，事情就一定会出岔子。您明明知道。
        - id: ch01-b29
          speaker: mother
          text: 可怜的孩子也得跟大家喝茶呀。到时埃塞尔也回来了，她会帮忙。我会叫威廉别烦你，他会听话的。
        - id: ch01-b30
          speaker: narrator
          text: 威廉得到了一套非常明确的命令。茶铃响起以前，他不许进屋。等大家喝完茶，他又必须立刻离开，回花园去玩。他对这些安排完全没有异议，也很愿意服从。事实上，一想到罗伯特马上就要扮演一个为爱情受苦的英雄，他便激动得不得了。他不但对哥哥的爱情发生了浓厚兴趣，也把眼前这场局面看得极其认真。
    - id: ch02
      title: 红手酋长的俘虏
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 客人沿车道走来时，威廉正在花园里。既然不许他现身惹人注意，他就悄悄爬到杜鹃花丛后面偷看。这也很符合他当时的身份，因为他正是一位印第安酋长。坎农小姐确实漂亮，棕发棕眼，红润的脸颊上时不时露出酒窝。她穿着白衣，撑着阳伞。灌木里轻轻一响，她猛地回头，看见一张涂得乌黑的男孩脸，四周还绑着一圈鸡毛。她的酒窝出现了。
        - id: ch02-b02
          speaker: miss_cannon
          text: 向伟大的酋长致敬！
        - id: ch02-b03
          speaker: narrator
          text: 威廉张着嘴望她。这样懂行的大人可不多见。
        - id: ch02-b04
          speaker: william
          text: 我是红手酋长。
        - id: ch02-b05
          speaker: narrator
          text: 他狠狠皱起眉。坎农小姐深深鞠了一躬，棕色眼睛里全是笑。
        - id: ch02-b06
          speaker: miss_cannon
          text: 那这个落到酋长手里、又没法反抗的可怜白脸人，要怎么处死呢？
        - id: ch02-b07
          speaker: william
          text: 你乖乖跟我去帐篷，到了就知道。
        - id: ch02-b08
          speaker: narrator
          text: 她先朝车道拐弯处看了一眼，屋子就在那后面。接着她低低一笑，跟威廉钻过灌木。路上有个地方正好能看见客厅窗户。罗伯特焦急地站在窗前，脸都等白了。他的裤子刚熨过，裤线挺得笔直，裤脚还特意翻得高高的，为的是让崭新的蓝袜子露出来。他含情脉脉地盯着车道拐弯处，心上人原本该从那里出现。每隔一会儿，那只紧张的手就抬起来，摸摸新领带，再摸摸闪亮的新衣领。衣领又高又紧，勒得并不舒服，可洗衣店的老板亲口保证，这是最新、也最正规的式样。
        - id: ch02-b09
          speaker: narrator
          text: 这时候，他的心上人已经进了威廉的地堡。那是威廉用砍下的树枝搭成的，他常和朋友躲在里面玩。
        - id: ch02-b10
          speaker: william
          text: 白脸人，这就是帐篷。站在这里，我去跟蛇脸和别的酋长商量怎么处置你。他们就在那边。
        - id: ch02-b11
          speaker: narrator
          text: 威廉指着一小簇灌木，走过去，对着它凶巴巴地说了好几分钟没人听得懂的话。显然，他在汇报自己怎样抓到了俘虏，还隔一会儿就回头指她一下。说完，他走回来。
        - id: ch02-b12
          speaker: william
          text: 刚才说的是印第安话。蛇脸说，必须剥掉白脸人的头皮，把她煮熟，再吃掉！
        - id: ch02-b13
          speaker: narrator
          text: 他压低声音咆哮，眉头皱得更凶，还打开小折刀，像是马上就要动手。
        - id: ch02-b14
          speaker: william
          text: 可我跟他们说了，只要你肯做我们的印第安女人，给我们烧饭，我们就让你活着。
        - id: ch02-b15
          speaker: narrator
          text: 坎农小姐跪下双膝。
        - id: ch02-b16
          speaker: miss_cannon
          text: 我万分谦卑、万分感激地谢谢伟大的红手。我非常愿意做你的印第安女人。
        - id: ch02-b17
          speaker: william
          text: 火生在这边。
        - id: ch02-b18
          speaker: narrator
          text: 他骄傲地把她领到帐篷后。那里有一小堆柴，没精打采地冒着烟，上面压着一口盛满黑水的大铁罐，火几乎透不过气。
        - id: ch02-b19
          speaker: william
          text: 印第安女人，这里面煮的是我们昨晚抓到的白脸人！
        - id: ch02-b20
          speaker: miss_cannon
          text: 啊，太棒了！他正在煮吗？
          emotion: happy
        - id: ch02-b21
          speaker: narrator
          text: 红手点点头，忽然又热心起来。
        - id: ch02-b22
          speaker: william
          text: 我去给你找羽毛。你也该戴羽毛。
        - id: ch02-b23
          speaker: narrator
          text: 他钻进帐篷深处，拿来一把鸡毛。她摘下宽边帽，笑着把羽毛插进蓬松的棕发。
        - id: ch02-b24
          speaker: miss_cannon
          text: 真有意思！我最喜欢印第安人了！
          emotion: happy
        - id: ch02-b25
          speaker: william
          text: 我还有软木，也能把你的脸涂黑。往火里一放就能烧。
        - id: ch02-b26
          speaker: narrator
          text: 她望望树林间露出的屋顶烟囱，遗憾地摇头。
        - id: ch02-b27
          speaker: miss_cannon
          text: 恐怕这个还是算了。
          emotion: sad
        - id: ch02-b28
          speaker: william
          text: 那好。现在我要去打猎。你搅着白脸人，等我回来，我们就吃他。我要出发了，看我怎么追踪猎物。
        - id: ch02-b29
          speaker: narrator
          text: 他杀气腾腾地挥了一下手，打开折刀，阴森森地朝四周看了一圈，然后手脚并用地钻进灌木。他并没有真正走远，只在印第安女人看得见的地方一圈圈爬行，显然一门心思想叫她佩服。她拿一根细枝搅着锅里的东西，隔一会儿便抬头看他，眼神里恰好装满了他最想看到的赞赏。没过多久，他凯旋归来，肩上扛着一块门垫，走到她面前，郑重地把猎物扔在她脚边。
        - id: ch02-b30
          speaker: william
          text: 印第安女人，这是一头鹿。把它煮了。其实我整个早上都拿着它，他们还没发现门垫不见了。
        - id: ch02-b31
          speaker: narrator
          text: 他找来两个边缘破破烂烂的小铁罐，从火上取下大罐，给两人各倒了一些。
        - id: ch02-b32
          speaker: william
          text: 给你，印第安女人。这是你的白脸人。
        - id: ch02-b33
          speaker: miss_cannon
          text: 噢，我相信他一定特别好吃，可是……
        - id: ch02-b34
          speaker: william
          text: 别怕，真的很好吃。其实就是这个加水！
        - id: ch02-b35
          speaker: narrator
          text: 他从树后捡起一只汤料包的纸壳给她看。
        - id: ch02-b36
          speaker: miss_cannon
          text: 真不错！家里人让你拿……
        - id: ch02-b37
          speaker: william
          text: 他们才不让我拿。不过食品室里多得很，偶尔少一包也发现不了。喝吧，我不介意给你喝，一点也不介意。我很快还能再拿几包。
        - id: ch02-b38
          speaker: narrator
          text: 她勇敢地举起铁罐喝了一口。
        - id: ch02-b39
          speaker: miss_cannon
          text: 美味极了！
        - id: ch02-b40
          speaker: narrator
          text: 她闭上眼，一口气喝光了。威廉又骄傲又快活，脸都亮了。偏偏这时，屋里的铃响起来，他的脸立刻沉下去。
        - id: ch02-b41
          speaker: william
          text: 糟了！要喝茶了！
        - id: ch02-b42
          speaker: narrator
          text: 坎农小姐赶紧拔掉羽毛，重新戴好帽子。
        - id: ch02-b43
          speaker: miss_cannon
          text: 你的帐篷里大概没有镜子吧？
        - id: ch02-b44
          speaker: william
          text: 没有。不过你下回来，我会准备一面。我去埃塞尔房里拿。
        - id: ch02-b45
          speaker: miss_cannon
          text: 她不会介意吗？
        - id: ch02-b46
          speaker: william
          text: 她不会知道。
        - id: ch02-b47
          speaker: narrator
          text: 坎农小姐抚平裙子。
        - id: ch02-b48
          speaker: miss_cannon
          text: 我迟到太久了，他们会怎么想？跟你跑来玩，真不像话。我总做这种不像话的事。这是我们两个人的秘密。现在进去吧，一起坦白。
        - id: ch02-b49
          speaker: narrator
          text: 她朝威廉一笑，笑得他眼花缭乱。对威廉来说，这位肯喝黑汤、肯戴鸡毛，还完全听得懂印第安规矩的大人，实在难得。
        - id: ch02-b50
          speaker: william
          text: 我不能去。我答应过先洗干净，收拾整齐再下楼。今天很特别，因为罗伯特。你当然知道。就是因为……罗伯特！
        - id: ch02-b51
          speaker: narrator
          text: 他意味深长地点头。坎农小姐却满脸迷惑。
    - id: ch03
      title: 下午茶上的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 罗伯特已经急得发疯。他抓头发抓得太多，头发根根竖起，像一圈带刺的光环。
        - id: ch03-b02
          speaker: robert
          text: 她没来，我们就不能开始。要是先喝茶，她会觉得我们太失礼，从此再也不会喜欢我。她不是那种能让人不等就开茶的姑娘。她是我见过最美的人，可您是我的亲生母亲，竟然这样对她。您可能会毁掉我的一生！您要是见过她，就会同情我了。我真说不出她有多……
        - id: ch03-b03
          speaker: mother
          text: 我约的是四点，现在已经过了四点半。埃塞尔，告诉艾玛，可以摇铃上茶了。
        - id: ch03-b04
          speaker: narrator
          text: 罗伯特额头上冒出了汗。
        - id: ch03-b05
          speaker: robert
          text: 这下好了，我所有希望都完了。
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 茶铃的回声刚消失几分钟，前门铃就清脆地响了。罗伯特胡乱压平头发，勉强挤出一丝受尽折磨的笑。坎农小姐出现在门口，看起来又迷人又端庄。
        - id: ch03-b07
          speaker: miss_cannon
          text: 我是不是太不像话了？说实话，我在车道上碰见你们家的小男孩，跟他玩了好一会儿。他真是个可爱的小宝贝，对不对？
        - id: ch03-b08
          speaker: narrator
          text: 她的棕色眼睛望向罗伯特。罗伯特舔舔嘴唇，挤着那丝痛苦的笑，一个字也说不出。
        - id: ch03-b09
          speaker: miss_cannon
          text: 我认识埃塞尔，也见过你们的儿子，是昨天见的，对吗？
        - id: ch03-b10
          speaker: narrator
          text: 罗伯特含糊地咕哝了一声，抬手碰碰那圈过紧的衣领，又朝她的方向茫然鞠了一躬。接着大家进屋喝茶。几分钟后，威廉也来了。他头发梳得整整齐齐，脸上的软木灰却只洗掉一部分，好在羽毛全摘干净了。席间大半时间，都是坎农小姐和埃塞尔在谈话。罗伯特绞尽脑汁，想找一句能叫人刮目相看的话，好让自己在她心里远远胜过普通青年，可他什么也想不出来。每次那双棕色眼睛落到身上，他便挤出那丝毫无笑意的笑，再抬手松一松像牢笼一样勒住脖子的衣领。他绝望地感觉到，宝贵的时间正在一刻刻溜走，自己的热情却一句也没能说出口，只能试着从眼睛里传给她。更糟的是，他还担心她根本没读懂那双眼睛里的话。
        - id: ch03-b11
          speaker: narrator
          text: 大家离开茶桌时，威廉担心地凑近母亲，发出嘶哑的低语。
        - id: ch03-b12
          speaker: william
          text: 我是不是也该穿上最好那套衣服？
        - id: ch03-b13
          speaker: narrator
          text: 坎农小姐端庄的眼睛里跳着笑意。满头大汗的罗伯特狠狠瞪了威廉一眼。可威廉早忘了喝完茶立刻离开的命令，谁怎么暗示都没用。他跟进客厅，坐到沙发上，正挨着刚坐到坎农小姐身边的罗伯特。
        - id: ch03-b14
          speaker: robert
          text: 坎农小姐，您……喜欢看书吗？
        - id: ch03-b15
          speaker: william
          text: 我以前还写过一个故事，特别精彩，也给几个人看过。你想看，我就拿给你。开头有个海盗站在木筏上，偷了好多珠宝。国王坐船追他，眼看要追上了，他就带着珠宝跳进水里。后来鱼把珠宝吃了，国王又抓到了那条鱼，然后……
        - id: ch03-b16
          speaker: narrator
          text: 威廉终于停下来换气。
        - id: ch03-b17
          speaker: miss_cannon
          text: 我太想看了！
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: 罗伯特侧过身，一条胳膊撑在膝上，想挡住不肯罢休的弟弟。
        - id: ch03-b19
          speaker: robert
          text: 坎农小姐，您最喜欢哪一种花？
        - id: ch03-b20
          speaker: william
          text: 我有个花园，到处都种了紫罗兰桂竹香，很快就能长出来。芥菜和水芹也长得快。我就喜欢长得快的东西，你呢？等别的东西长起来，实在太烦了，对吧？
        - id: ch03-b21
          speaker: narrator
          text: 罗伯特绝望地站起来。
        - id: ch03-b22
          speaker: robert
          text: 坎农小姐，您愿意去看看花园和温室吗？
        - id: ch03-b23
          speaker: miss_cannon
          text: 我很乐意。
        - id: ch03-b24
          speaker: narrator
          text: 罗伯特恶狠狠瞪了威廉一眼，领着客人去花园。天真快活的威廉也跟了出去。
        - id: ch03-b25
          speaker: william
          text: 你会打怎么都解不开的结吗？
        - id: ch03-b26
          speaker: miss_cannon
          text: 不会，真希望我会。
        - id: ch03-b27
          speaker: william
          text: 我会，我可以教你。等会儿找根绳子做给你看。其实很容易，只要练一练。纸飞机我也会做，刮风的时候能飞上天。那个也容易，不过大小一定要刚好。我还能用火柴盒做很多东西，而且……
        - id: ch03-b28
          speaker: narrator
          text: 罗伯特气得再也忍不住，硬把话截走。
        - id: ch03-b29
          speaker: robert
          text: 这些玫瑰是我父亲种的，他非常得意。
        - id: ch03-b30
          speaker: miss_cannon
          text: 真漂亮。
        - id: ch03-b31
          speaker: william
          text: 哼，你等着看我的紫罗兰桂竹香吧！只管等着，等……
        - id: ch03-b32
          speaker: robert
          text: 坎农小姐，我能把这朵香水月季送给您吗？它很衬您。您……花和您……我是说，您喜欢花，就应该一直有花陪着。要是我……
        - id: ch03-b33
          speaker: narrator
          text: 罗伯特涨红了脸，把花递给她。可威廉也一样着迷，决心不让哥哥抢走风头。
        - id: ch03-b34
          speaker: william
          text: 我把那些红玫瑰和那朵白的也摘给你，再送你一些我的紫罗兰桂竹香。我从来没把紫罗兰桂竹香送给别人。
        - id: ch03-b35
          speaker: narrator
          text: 回到客厅时，坎农小姐怀里抱着一大束紫罗兰桂竹香，还有红玫瑰和白玫瑰。罗伯特精心送出的那朵香水月季被压在下面，遮得严严实实，一点也看不见。威廉陪在她身边，神气活现，信心十足，一路不停地跟她说话。罗伯特跟在后头，脸上已经没有血色，活像一尊绝望的雕像。母亲看懂了他投来的痛苦目光，赶紧把威廉叫到自己的角落里。罗伯特这才终于又和坎农小姐在沙发上坐下来。
        - id: ch03-b36
          speaker: robert
          text: 我希望……我真希望您能在这里多住一些日子？
        - id: ch03-b37
          speaker: william
          text: 可为什么我连跟她说句话都不行？
          emotion: angry
        - id: ch03-b38
          speaker: mother
          text: 嘘，亲爱的！
        - id: ch03-b39
          speaker: robert
          text: 我想带您看看附近几条散步的小路。不知道我能不能有这个……荣幸？
        - id: ch03-b40
          speaker: william
          text: 我不过跟她说说话，又没做坏事，对不对？我只是跟她讲话！
          emotion: angry
        - id: ch03-b41
          speaker: narrator
          text: 屋里静得吓人。罗伯特满脸紫红，想说点什么压过那个声音，可一句也挤不出来。坎农小姐显然正听着威廉。
        - id: ch03-b42
          speaker: william
          text: 难道以后谁都不准跟她说话了吗？就因为罗伯特爱上她了？
          emotion: angry
        - id: ch03-b43
          speaker: narrator
          text: 那带着嘶声的耳语越说越响，传遍整间屋子。这一刻的恐怖，后来一连几星期都日日夜夜纠缠着罗伯特。母亲赶紧咳嗽，开始讲毛毛虫怎样糟蹋了丈夫最心爱的玫瑰，而且讲得没完没了，远比需要的详细。一分钟后，威廉很有尊严地退回花园。坎农小姐也站了起来。
        - id: ch03-b44
          speaker: miss_cannon
          text: 恐怕我得走了。
        - id: ch03-b45
          speaker: narrator
          text: 罗伯特痛苦又无力，只能慢慢起身。
        - id: ch03-b46
          speaker: robert
          text: 改天一定再来。
          emotion: sad
        - id: ch03-b47
          speaker: miss_cannon
          text: 我会来的。我真想多见见威廉，我太喜欢他了！
          emotion: happy
    - id: ch04
      title: 停不下来的自行车
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大家想尽办法安慰罗伯特受伤的心，可那些安慰都没什么用。最后还是埃塞尔想出的计划让他重新振作。她提议下星期四一起去野餐。那天恰好是罗伯特的生日，也恰好是坎农小姐来访的最后一天。参加野餐的人必须严格限制，只能有罗伯特、埃塞尔、克莱夫太太和坎农小姐。至于他们究竟要去什么地方，连半个字也不能让威廉知道。当晚，他们便把邀请送了出去。
        - id: ch04-b02
          speaker: narrator
          text: 接下来整整一星期，罗伯特做梦都在想野餐的饭菜。他提出一种又一种精致点心，可厨娘连名字都没听过，更别说做出来。直到厨娘威胁说再这样就辞职，他才勉强同意把一切交给她安排。他又把那条明明已经很干净的白法兰绒裤送进洗衣店，另外附上一张字条，阴森森地暗示，如果星期四早晨送回来的裤子不是洁白无瑕，他就要诉诸法律。接下来的几天，他总是皱着眉，带着一副坚定而庄严的表情在家里走来走去。他彻底无视威廉，仿佛弟弟已经不存在了。除此之外，他还特地去一家旧书店买回一本诗集，郑重地放在床边桌上。
        - id: ch04-b03
          speaker: narrator
          text: 这期间，他们一次也没见到坎农小姐。星期四却晴朗明亮，罗伯特悬着的心立刻飞扬起来。父亲送他怀表和表链，母亲送他一辆自行车，威廉送了一罐太妃糖。当然，威廉送礼并不完全无私。
        - id: ch04-b04
          speaker: narrator
          text: 他们在车站与克莱夫太太和坎农小姐会合，坐车去几英里外的村庄，再从那里步行到河边一处浓荫下。威廉知道自己被故意排除，尊严多少受了伤，但他接受了现实。早上，他仍在杜鹃花丛里扮红手酋长。头饰上多了一根从埃塞尔房里找到的鸵鸟羽毛，脸上又涂掉了差不多一整块软木，肩头还用别针披着门垫。
        - id: ch04-b05
          speaker: narrator
          text: 他先在冒烟的火上，把糖浆太妃糖放进雨水里煮化，又添了橙汁，把饮料喝掉。玩腻以后，他溜进罗伯特的卧室看生日礼物。那罐太妃糖就在床边。威廉觉得拿一两颗很合理，于是一边吃糖，一边读爱情诗。几分钟后，他惊恐地发现罐子空了，只好叹口气，盖紧盖子。他猜罗伯特多半知道是谁吃的。可糖本来就是他送的，再说，他开吃时也没想到会吃完整整一罐。
        - id: ch04-b06
          speaker: narrator
          text: 他又来到梳妆台前，把怀表和表链挂成一个又一个角度，自己也换着姿势，从各个方向欣赏。整个上午都戴着它们，这个念头实在诱人，可他最后总算抵住了诱惑，把东西放回梳妆台。随后他下楼，绕到棚屋。罗伯特的新自行车正在那里光彩照人地立着。车身油亮又洁净，威廉怀着敬畏和羡慕盯了很久。他认定，只要自己够小心，只推着车绕屋走几圈，就绝不可能把它弄坏。母亲恰好出门买东西，这给了他更多勇气。于是他推着车一圈又一圈绕过屋子，尽情享受那种威风凛凛的感觉，好像这辆漂亮的新车当真属于他。
        - id: ch04-b07
          speaker: narrator
          text: 渐渐地，他越来越舍不得放手，也开始琢磨，骑自行车到底有多难。从前住在一位姑妈家时，他曾经试骑过一次。威廉把车推到花园长凳旁，先站上长凳，再费了很大力气，才把自己从凳子挪到车座上。出乎意料，也让他万分惊喜的是，他居然骑出去好几码才摔下来。他立刻又试一次，结果又摔了。第三次，他连人带车一头撞进冬青树丛。到了这时候，他满脑子只剩下一件事，那就是一定要学会骑车，其他事情全被忘得干干净净。他试了一回又一回，也一回又一回摔在地上，或者撞进那片冬青树。自行车闪亮的黑漆渐渐刮花，车把微微撞弯，原有的光泽也没了。威廉自己同样青一块紫一块，衣服凌乱，浑身狼狈，可他还是不肯认输。
        - id: ch04-b08
          speaker: narrator
          text: 最后，他终于避开那片仿佛会吸人的冬青树，歪歪扭扭走着之字，沿车道骑出大门，上了公路。他根本没想骑到那里。事实上，他还戴着满是羽毛的头饰，脸涂得乌黑，肩上披着门垫。直到上了公路，他才明白自己已经没有退路，因为他压根不知道怎么下车。
        - id: ch04-b09
          speaker: narrator
          text: 接下来的事，对威廉来说，简直比什么都更像一场噩梦。一辆运货汽车迎面开来，他一时慌了神，猛地拐进旁边一条街，又从那里拐进另一条街。沿途的人纷纷从屋里跑出来，看着这个奇怪的骑车人经过。孩子们朝他起哄，也有人在路边欢呼，很快便有一大群人追在自行车后面。威廉只能不停地往前骑，因为他根本停不下来。平常那股钢铁一般的勇气已经彻底垮了，他甚至想不到还可以故意从车上摔下去。他完全迷失了方向，连自己经过了哪些街道也不知道。没过多久，整座城镇都被他抛在身后，可前面的公路究竟通往哪里，他仍旧一无所知。
        - id: ch04-b10
          speaker: narrator
          text: 不管骑到哪儿，他都会变成所有人的焦点。那个人影实在太古怪了，脸被软木涂得乌黑，又叫汗水冲出一道道花纹，门垫在背后迎风飞舞，头饰上的羽毛则不时被吹走一根。公路两旁的居民全被引到门口，站在那里议论纷纷。有人断定他是从疯人院里逃出来的，也有人猜他正在替某种东西做广告。孩子们却有自己的看法，他们更愿意相信，这个飞驰而过的怪人一定是马戏团的一员。
        - id: ch04-b11
          speaker: narrator
          text: 威廉已经越过了绝望，整个人只剩下麻木。他的脸苍白而僵硬，最初的惊慌变成了一种可怕的确信。这件事会永远继续下去，他永远也学不会停车，只能一路骑过整个英格兰。他猜，自己现在离海边也许已经不远了。照这样下去，他迟早会骑到海边。他又想，不知道以后还能不能再见到爸爸和妈妈。可他的双脚依然机械地蹬着踏板，仿佛它们已经不再听他指挥。路没有尽头，踏板也永远不会停。他的腿太短，每次踏板落到最低处，他就完全够不着，只能等踏板重新升上来，赶紧用脚踩住，再使出全身力气把它压下去。一次又一次，每一下都比上一次更费力。
        - id: ch04-b12
          speaker: narrator
          text: 他实在太累了，全身都像再也使不出一点力气。威廉心想，如果自己就这样倒在地上死掉，不知道大家会不会难过。我已经说过，威廉不知道自己正往哪里骑。可是，命运知道。
    - id: ch05
      title: 河边的相逢与休战
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 野餐的一行人从小车站走下山坡，前往河边。早晨天气好极了，罗伯特也满怀希望。他走在心中女神身旁，能靠得这么近，已经陶醉得说不出话。埃塞尔和克莱夫太太倒一路聊得很开心。
        - id: ch05-b02
          speaker: ethel
          text: 我们总算甩掉威廉了。他连我们去了哪里都不知道！
          emotion: happy
        - id: ch05-b03
          speaker: miss_cannon
          text: 真可惜。要是威廉也来，我一定很高兴。
        - id: ch05-b04
          speaker: ethel
          text: 那是因为你根本不了解他。
        - id: ch05-b05
          speaker: robert
          text: 今天早晨真美。坎农小姐，我是不是走得太快了？
        - id: ch05-b06
          speaker: miss_cannon
          text: 噢，没有。
        - id: ch05-b07
          speaker: robert
          text: 要不要把阳伞交给我拿？
        - id: ch05-b08
          speaker: miss_cannon
          text: 噢，不用了，谢谢。
        - id: ch05-b09
          speaker: narrator
          text: 罗伯特提议，等吃完午饭，大家可以去河上划船。看样子坎农小姐很愿意接受这个安排，埃塞尔和克莱夫太太却宁可留在岸边。罗伯特心里的幸福多得简直要溢出来了。这正是他苦苦等候的机会。船上只有他们两个人，他可以和她缔结终生的友谊，可以约好以后定期通信，还可以小心地暗示自己最后的打算。当然，他必须坦白说明，自己还在念大学，目前不能立刻向她献上真心，请求她嫁给自己。可是，如果她愿意等他……想到这里，他已经在脑中起草起一篇又一篇动人的演说。
        - id: ch05-b10
          speaker: narrator
          text: 一行人终于到了河边，打开午餐篮。没有罗伯特在身边碍手碍脚地指点，厨娘反而发挥得格外出色。大家把白色餐布铺在树荫下，围着坐好。罗伯特端起一盘三明治，正准备摆出最文雅的姿势，把盘子递到坎农小姐面前。可他的目光忽然落在远处一条白色长路上。那条路从村庄一直伸向河边。罗伯特再也挪不开眼睛，他的脸因恐惧一点点僵住，托着盘子的手也忽然失去力气，把三明治重新落回餐布。其他人察觉不对，一起顺着他的视线望过去。
        - id: ch05-b11
          speaker: narrator
          text: 一个怪模怪样的人正沿公路骑来。他的脸黑乎乎的，头上只剩几根羽毛，背后还有一块门垫迎风飘动。后面跟着一群欢呼的孩子。这个身影叫所有人都觉得有点眼熟。
        - id: ch05-b12
          speaker: robert
          text: 不可能。
          emotion: fearful
        - id: ch05-b13
          speaker: narrator
          text: 他嗓音嘶哑，抬手擦过额头。没人说话。那个人影越来越近，再也不会认错。
        - id: ch05-b14
          speakers: [robert, ethel, mrs_clive, miss_cannon]
          ensemble: chorus
          text: 威廉！
          emotion: surprised
        - id: ch05-b15
          speaker: narrator
          text: 威廉终于骑到公路尽头。他既没有拐进河岸左边的路，也没有拐进右边的路。他根本没认出野餐的四个人，甚至没有朝他们看上一眼。他的脸灰白而僵硬，只顾径直骑上河岸，一头冲进野餐的人群。众人眼看他撞来，纷纷从原地逃开。自行车先从铺好的餐布上碾过去，又依次碾过三明治、肉馅饼、面包卷和蛋糕。接着，它载着威廉冲下岸坡，没有一点停住的意思，最后一头栽进河水里。
        - id: ch05-b16
          speaker: narrator
          text: 大家赶紧把威廉和自行车救上来。即使到了这一步，命运仍旧在跟罗伯特作对，因为真正跳下水把人救起的，不是他，而是一位恰好经过的船夫。威廉爬回岸上时浑身湿透，筋疲力尽，连动一动都嫌费力，心里却又隐约觉得，经历了这一切，自己多少有些英雄气概。他看见罗伯特、埃塞尔、克莱夫太太和坎农小姐都站在那里，竟然一点也不惊讶。到了这个时候，不管眼前再出现什么，他大概都不会惊讶了。
        - id: ch05-b17
          speaker: narrator
          text: 罗伯特站在众人后面，气得全身发热，可这时候再怎么发火也毫无用处。他只能一边擦拭，一边检查那辆伤痕累累的新自行车，看着刮花的车漆和撞弯的车把。另一边，坎农小姐用手臂托住威廉湿淋淋的脑袋，小心地喂他喝热咖啡，又把三明治送到他嘴边。
        - id: ch05-b18
          speaker: miss_cannon
          text: 我可怜的小宝贝红手。
          emotion: sad
        - id: ch05-b19
          speaker: narrator
          text: 她坚持亲自陪威廉回家，一路上始终没有忘记自己的角色，仍旧扮着他那位忠诚的印第安女人。一直陪着他走到了家门口，她随口邀请罗伯特和埃塞尔过去喝茶，随后便回去收拾行李，因为她的来访已经到了最后一天。后来，母亲从威廉房里下楼，手里端着托盘，上面是一碗剩了一半的麦片粥。她在门厅碰见罗伯特。
        - id: ch05-b20
          speaker: mother
          text: 罗伯特，你真不用这么心烦。
        - id: ch05-b21
          speaker: narrator
          text: 罗伯特瞪着她，空洞地笑了一声。仿佛“心烦”两个字远远不够形容他的遭遇，简直冒犯了他。
        - id: ch05-b22
          speaker: robert
          text: 心烦？要是您的一生被毁了，您也会心烦。我当然有权心烦。
          emotion: angry
        - id: ch05-b23
          speaker: narrator
          text: 他绝望地抬手，从早已蓬乱的头发里穿过去。
        - id: ch05-b24
          speaker: mother
          text: 可你还要去她那里喝茶呢。
        - id: ch05-b25
          speaker: robert
          text: 是啊，而且还有别人在。有别人在场，谁能跟她说话？本来我能在河上跟她谈。我准备了那么多话，可威廉来了，毁了我的一辈子，也毁了我的自行车。她是我见过最美的姑娘。那辆车我也盼了很久，现在根本没法骑了。
          emotion: angry
        - id: ch05-b26
          speaker: mother
          text: 可怜的威廉得了很严重的风寒，你不该怨他。修车的钱也得由他赔。赔清以前，他一分钱零花钱都不会有。
        - id: ch05-b27
          speaker: narrator
          text: 罗伯特朝门厅桌子做了个绝望的手势，仿佛是在跟桌子讲道理。
        - id: ch05-b28
          speaker: robert
          text: 一栋房子里有四个大人，总该管得住威廉这么大的男孩吧？怎么能任他到处毁掉别人的人生，还毁掉别人的自行车？好吧，他绝不会再干这种事了。
          emotion: angry
        - id: ch05-b29
          speaker: narrator
          text: 最后一句，他说得阴森森的。母亲继续往厨房走。
        - id: ch05-b30
          speaker: mother
          text: 罗伯特，弟弟还病着，你总愿意跟他和平相处吧？
        - id: ch05-b31
          speaker: narrator
          text: 罗伯特把憔悴的脸转向她，几乎怀疑自己听错了。
        - id: ch05-b32
          speaker: robert
          text: 和平？我会等。我等他完全好了，能下床走动，再开始算账。在那以前，我不会动手。可是和平？这不是和平，只是休战。仅此而已。
          emotion: angry
