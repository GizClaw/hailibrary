  chapters:
    - id: ch01
      title: William Joins the Band of Hope
      blocks:
        - id: ch01-b01
          speaker: mrs_brown
          text: "William! You've been playing that dreadful game again!"
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: William stood before his mother covered in dust. His tie hung under one ear, his face was filthy, and both knees were cut. Yet he looked deeply offended by the accusation.
        - id: ch01-b03
          speaker: william
          text: "I haven't! I didn't do anything you told me not to. You said I wasn't to play Lions and Tamers, and I haven't played it once since then. I wouldn't play it if thousands of people begged me. Not after you said no. I—"
        - id: ch01-b04
          speaker: mrs_brown
          text: "Then what have you been playing?"
        - id: ch01-b05
          speaker: william
          text: "Tigers and Tamers. That's completely different. In Lions and Tamers, half the boys are lions and the other half are tamers. The tamers try to tame the lions, and the lions try not to let them. That's the whole game. It's only a little one."
        - id: ch01-b06
          speaker: mrs_brown
          text: "And what happens in Tigers and Tamers?"
        - id: ch01-b07
          speaker: narrator
          text: William thought hard.
        - id: ch01-b08
          speaker: william
          text: "Well... in Tigers and Tamers, half the boys are tigers, you see, and the other half—"
        - id: ch01-b09
          speaker: mrs_brown
          text: "William, that is exactly the same game."
        - id: ch01-b10
          speaker: william
          text: "How can it be the same? You can't call a lion a tiger. It isn't one. They don't even live in the same cages at the zoo. So Tigers and Tamers can't be exactly like Lions and Tamers."
        - id: ch01-b11
          speaker: mrs_brown
          text: "Then you are not to play Tigers and Tamers either. Now go wash your face."
        - id: ch01-b12
          speaker: william
          text: "My face? I've already washed it twice today! I washed it when I got up, and I washed it before dinner because you told me to."
        - id: ch01-b13
          speaker: mrs_brown
          text: "Just go look at it."
        - id: ch01-b14
          speaker: narrator
          text: William studied himself in the mirror with interest. He brushed his hands lightly over the dirt, pushed back his hair, and straightened his tie. Then he turned to his mother with a hopeful look.
        - id: ch01-b15
          speaker: mrs_brown
          text: "That won't do. Wash your face, brush your hair, and change your suit and stockings. They're covered with dust."
        - id: ch01-b16
          speaker: narrator
          text: William slowly left the room.
        - id: ch01-b17
          speaker: william
          text: "I bet hardly any other house has this much washing and brushing going on. Good for them."
        - id: ch01-b18
          speaker: narrator
          text: Ten minutes later, Mrs. Brown heard him coming downstairs and called him in. He was transformed. His face and hair shone, and he wore a clean suit. His offended expression had not changed at all.
        - id: ch01-b19
          speaker: mrs_brown
          text: "Much better. Now sit in here until tea. It's only ten minutes, so there's no point going outside. If you don't sit still, you'll only get messy again."
        - id: ch01-b20
          speaker: narrator
          text: William looked around the drawing room as if this demand were more than anyone could bear.
        - id: ch01-b21
          speaker: william
          text: "In here? What am I supposed to do? There's nothing to do. I can't just sit still doing nothing."
        - id: ch01-b22
          speaker: mrs_brown
          text: "Read something. There are plenty of books over there you haven't tried. You might like one of Scott's."
        - id: ch01-b23
          speaker: narrator
          text: |-
            With the look of someone enduring terrible pain, William pulled out a book at random. He sat apart from everyone else, holding it upside down. That was how Mrs. de Vere Carter found him when she arrived a moment later.

            Mrs. de Vere Carter was new to the neighborhood, and her arrival had caused quite a stir. Before her marriage, she had belonged to the important Randall family of Hertfordshire. People felt intensely honored whenever she smiled at them. She was tall and handsome. She dressed beautifully, spoke with overflowing enthusiasm, and seemed to sweep into every room. Everyone agreed that she was charming.
        - id: ch01-b24
          speaker: mrs_de_vere_carter
          text: "What a dear little boy!"
        - id: ch01-b25
          speaker: narrator
          text: William's face darkened as she swept toward him.
        - id: ch01-b26
          speaker: mrs_de_vere_carter
          text: "Well, my little man, how are you?"
        - id: ch01-b27
          speaker: narrator
          text: He could not answer. She had put a hand on his head and pressed his face against her perfumed frills. The thorn on the large rose at her chest nearly caught his nose.
        - id: ch01-b28
          speaker: mrs_de_vere_carter
          text: "I simply adore children."
        - id: ch01-b29
          speaker: narrator
          text: William jerked his head free. Mrs. de Vere Carter picked up his book.
        - id: ch01-b30
          speaker: mrs_de_vere_carter
          text: "Scott! What a dear little fellow."
        - id: ch01-b31
          speaker: narrator
          text: Mrs. Brown saw William's expression and quickly drew her visitor away.
        - id: ch01-b32
          speaker: mrs_brown
          text: "Please, come sit over here. Haven't we had perfect weather?"
        - id: ch01-b33
          speaker: narrator
          text: William walked out.
        - id: ch01-b34
          speaker: mrs_de_vere_carter
          text: "I'm terribly interested in social work, especially work with children. I adore them, and I always get along with them. Of course, I get along with nearly everyone. It's my personality, you know. You may have heard that I've taken charge of the Band of Hope here. I'm turning it into such a success. The little pets! Yes, three lumps of sugar, please. Now this is where I need your help, dear. You'll help me, won't you? You and your little manikin. I want a different sort of child to join the Band of Hope. Such a sweet name, don't you think? It would do the village children so much good to spend time with children from our own class."
        - id: ch01-b35
          speaker: narrator
          text: Mrs. Brown could not help feeling flattered by the request. Mrs. de Vere Carter was charming, important in the neighborhood, and one of the Randalls. Being asked to help her seemed like an honor.
        - id: ch01-b36
          speaker: mrs_de_vere_carter
          text: "The moment I came in and saw your little treasure sitting so sweetly in that chair, I said to myself, I simply must get him to come. The village children need the refining influence of children from our class. These cakes are delicious. You will lend him to me, won't you? We meet once a week, every Wednesday afternoon. May he come? I'll take the very best care of him."
        - id: ch01-b37
          speaker: mrs_brown
          text: "Well... yes. I'm just not sure William is suited to that kind of thing. Still—"
        - id: ch01-b38
          speaker: mrs_de_vere_carter
          text: "You can't discourage me! I know him already. He's one of my dearest little friends. It never takes me long to understand children. I was born loving them."
        - id: ch01-b39
          speaker: narrator
          text: William happened to cross the hall as Mrs. de Vere Carter came out with Mrs. Brown behind her.
        - id: ch01-b40
          speaker: mrs_de_vere_carter
          text: "There you are! I knew you'd be waiting to say goodbye."
        - id: ch01-b41
          speaker: narrator
          text: She opened her arms. William stepped back and stared at her with a dark frown.
        - id: ch01-b42
          speaker: mrs_brown
          text: "It was so nice to see you. I do hope you'll visit again."
        - id: ch01-b43
          speaker: narrator
          text: Mrs. Brown did not mean it. She stammered the polite words while moving across the hall, trying to block her guest's view of William's face. But Mrs. de Vere Carter was not so easily stopped. Some adults can look straight at a child's expression and understand absolutely nothing. She glided around Mrs. Brown and headed for William once again.
        - id: ch01-b44
          speaker: mrs_de_vere_carter
          text: "Goodbye, Willy, dear. You're not too old to give me a kiss, are you?"
        - id: ch01-b45
          speaker: narrator
          text: Mrs. Brown gasped. William's face held such concentrated fury that older and stronger people would have backed away from him. Mrs. de Vere Carter only smiled, completely untouched by it. He shot her one more poisonous look, turned on his heel, and marched away without a word.
        - id: ch01-b46
          speaker: mrs_de_vere_carter
          text: "What a sweet, shy child! I love shy ones."
        - id: ch01-b47
          speaker: narrator
          text: Later, Mrs. Brown told her husband about the invitation.
        - id: ch01-b48
          speaker: father
          text: "I can't quite picture William at a Band of Hope meeting. But if you want him there, I suppose he must go."
        - id: ch01-b49
          speaker: mrs_brown
          text: "She made such a point of having him. And she really is very charming. She's rather influential too. She was one of the Randalls, you know. It seems silly to offend someone like that."
        - id: ch01-b50
          speaker: father
          text: "Did William like her?"
        - id: ch01-b51
          speaker: mrs_brown
          text: "She was very sweet to him. Or she meant to be. But you know how easily William takes offense, and he always hates that particular name. I don't understand it. Plenty of people are called Willy."
        - id: ch01-b52
          speaker: narrator
          text: On the morning of the meeting, William came to breakfast looking miserable. He dropped into his chair, raised a hand to his forehead, and gave a hollow groan. Mrs. Brown jumped up in alarm.
        - id: ch01-b53
          speaker: mrs_brown
          text: "William! What's wrong?"
        - id: ch01-b54
          speaker: william
          text: "I've got a sick headache."
        - id: ch01-b55
          speaker: mrs_brown
          text: "Oh, I'm so sorry. You'd better go lie down."
        - id: ch01-b56
          speaker: william
          text: "I think I will. Right after breakfast."
        - id: ch01-b57
          speaker: mrs_brown
          text: "You shouldn't eat with a sick headache."
        - id: ch01-b58
          speaker: narrator
          text: William gazed hungrily at the eggs and bacon.
        - id: ch01-b59
          speaker: william
          text: "I think I could manage a little, Mother. Just a bit."
        - id: ch01-b60
          speaker: mrs_brown
          text: "No, dear. It would only make you worse."
        - id: ch01-b61
          speaker: narrator
          text: |-
            William returned to his room very reluctantly. After breakfast, his mother came to see him. No, he told her, he felt no better. Still, he thought he might try a short walk. He kept saying that he felt very sick. Mrs. Brown suggested a strong dose of salt water. If he could actually be sick, perhaps the headache would pass. William said he would hate to cause her so much trouble. Besides, he insisted, his sickness was not that kind of sickness at all. He was very clear about that. What he needed, he said, was a walk.

            Wrapped up warmly, he tottered down the drive in tiny, uncertain steps while his mother watched anxiously. Then he slipped behind the rhododendrons along the wall, doubled back, and climbed through the pantry window.
        - id: ch01-b62
          speaker: narrator
          text: Half an hour later, the cook hurried to Mrs. Brown with William behind her. He looked pale and deeply wronged.
        - id: ch01-b63
          speaker: cook
          text: "He's eaten nearly everything, ma'am! You never saw the like. He's had the cold ham, the kidney pie, three cold sausages, and the whole new jar of lemon curd!"
          emotion: angry
        - id: ch01-b64
          speaker: mrs_brown
          text: "William! You can't possibly have a sick headache after eating all that!"
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: |-
            That ended the sick headache.

            William spent the rest of the morning with Henry, Douglas, and Ginger. Together they formed a secret society called the Outlaws. It had very few purposes besides being secret, and William was its acknowledged leader. He was proud of that honor. The thought of the others learning about the Band of Hope made him hot and cold. What if they saw him on the way? What if somebody told them afterward? He would never be able to hold up his head again. He made several careful attempts to discover their afternoon plans. If he knew where they would be, perhaps he could avoid them. But they gave him no useful answer.

            The boys spent the morning hunting rabbits in the woods with Henry's fox terrier, Chips, and William's mongrel, Jumble. They neither saw nor heard a rabbit. Jumble did chase a butterfly and then a bee. He scratched up a molehill and got stung by a wasp. Chips managed to catch a field mouse. So the time was not entirely wasted.

            William's heart was not in any of it. All morning, he turned one escape plan after another over in his mind. Every plan ended the same way. It would never work.
        - id: ch01-b66
          speaker: narrator
          text: He reached the dining room early for lunch. Only his older brother Robert and his sister Ethel were there. William limped in with his mouth tight with pain and his brow furrowed.
        - id: ch01-b67
          speaker: robert
          text: "Hello. What happened to you?"
        - id: ch01-b68
          speaker: narrator
          text: Robert had missed breakfast and forgotten about the Band of Hope.
        - id: ch01-b69
          speaker: william
          text: "I sprained my ankle."
        - id: ch01-b70
          speaker: robert
          text: "Sit down, old man. Let me take a look."
        - id: ch01-b71
          speaker: narrator
          text: William meekly sat in a chair.
        - id: ch01-b72
          speaker: robert
          text: "Which ankle is it?"
        - id: ch01-b73
          speaker: william
          text: "Uh... this one."
        - id: ch01-b74
          speaker: ethel
          text: "Too bad you were limping on the other leg."
        - id: ch01-b75
          speaker: narrator
          text: |-
            That ended the sprained ankle.

            The meeting began at three. At two-thirty, William announced a sudden and terrible toothache. His family paid no attention. Five minutes later, he was suffering from acute rheumatism. That complaint failed too. At twenty to three, he declared that something was wrong with his liver. William considered this a wonderful inspiration, since trouble with his liver often kept his father home from work. His family remained completely unmoved. At a quarter to three, William stood ready in the hall.
        - id: ch01-b76
          speaker: mrs_brown
          text: "I'm sure you'll enjoy yourself. You'll probably play games and have a lovely time."
        - id: ch01-b77
          speaker: narrator
          text: William answered with silent contempt.
        - id: ch01-b78
          speaker: william
          text: "Here, Jumble!"
        - id: ch01-b79
          speaker: narrator
          text: Life could never be completely terrible while it still held Jumble. The dog raced in from the kitchen with gravy around his mouth, dropping a half-chewed bone on the hall carpet.
        - id: ch01-b80
          speaker: mrs_brown
          text: "William, you cannot take a dog to a Band of Hope meeting."
        - id: ch01-b81
          speaker: william
          text: "Why not? Dogs don't drink beer. Jumble has as much right to be there as I do. It seems like nobody's allowed to do anything."
        - id: ch01-b82
          speaker: mrs_brown
          text: "I'm sure dogs aren't permitted. Nobody brings a dog to a meeting."
        - id: ch01-b83
          speaker: narrator
          text: Mrs. Brown held Jumble firmly by the collar, and William went reluctantly down the drive.
        - id: ch01-b84
          speaker: mrs_brown
          text: "I hope you have fun!"
        - id: ch01-b85
          speaker: narrator
          text: William turned back toward her.
        - id: ch01-b86
          speaker: william
          text: "With all the things I have to do, it's a wonder I'm not dead."
        - id: ch01-b87
          speaker: narrator
          text: |-
            He walked slowly down the drive, looking thoroughly miserable and defeated. At the gate, he stopped and carefully checked both directions along the road. Three boys were coming toward him, each a short distance behind the last. They were Henry, Douglas, and Ginger.

            William's first instinct was to dart back inside and wait until all three had passed. Then something about them caught his attention. Every one of them wore the same dejected, hangdog look. William stayed where he was and waited for Henry. Henry gave him one shamefaced glance and tried to pass without stopping.
        - id: ch01-b88
          speaker: william
          text: "Are you going too?"
        - id: ch01-b89
          speaker: henry
          text: "Did that woman talk to your mother too?"
        - id: ch01-b90
          speaker: narrator
          text: Henry stared in surprise when he saw Ginger and Douglas coming behind him. Ginger, in turn, seemed amazed to discover Douglas. The four Outlaws joined one another and continued toward the Village Hall. They walked sheepishly, with nobody willing to say much. A heavy, depressed silence settled over them. At last, Ginger lifted one hand to his throat.
        - id: ch01-b91
          speaker: ginger
          text: "My throat's awful. I shouldn't even be out."
        - id: ch01-b92
          speaker: henry
          text: "I'm sick too. I told them that."
        - id: ch01-b93
          speaker: douglas
          text: "So am I."
        - id: ch01-b94
          speaker: william
          text: "Me too. Pretty cruel, sending all of us out when we're this ill."
        - id: ch01-b95
          speaker: narrator
          text: His laugh was hoarse and joyless. At the Village Hall door, they stopped. William gazed longingly toward the field.
        - id: ch01-b96
          speaker: ginger
          text: "No use running. They'd find out."
        - id: ch01-b97
          speaker: narrator
          text: Bitter and hopeless, the Outlaws went inside.
        - id: ch01-b98
          speaker: narrator
          text: Only a handful of children sat inside, and every one of them looked gloomy. Their loyalty to the meetings came from a single hope. Regular attendance might earn them a place on the annual outing. Mrs. de Vere Carter sailed toward the newcomers. Frills and scarves floated around her as she moved, and a powerful cloud of perfume reached the boys with her.
        - id: ch01-b99
          speaker: mrs_de_vere_carter
          text: "Dear children, welcome to our little gathering. Everyone, these are our dear new friends. We must make them feel so happy. Dear children!"
        - id: ch01-b100
          speaker: narrator
          text: The regular members turned their gloomy eyes on the Outlaws. Mrs. de Vere Carter placed the boys in the front row, then stood before the meeting.
        - id: ch01-b101
          speaker: mrs_de_vere_carter
          text: "Now, dear girls and dear boys, how do I expect you to behave at our meetings?"
        - id: ch01-b102
          speakers: [regular_child_1, regular_child_2, regular_child_3, regular_child_4]
          ensemble: chorus
          text: "Respectful and reposeful."
        - id: ch01-b103
          speaker: mrs_de_vere_carter
          text: "I do have a name, dear children."
        - id: ch01-b104
          speakers: [regular_child_1, regular_child_2, regular_child_3, regular_child_4]
          ensemble: chorus
          text: "Respectful and reposeful, Mrs. de Vere Carter."
        - id: ch01-b105
          speaker: mrs_de_vere_carter
          text: "Exactly. Respectful and reposeful. Now, my dear new friends, how do I expect you to behave?"
        - id: ch01-b106
          speaker: narrator
          text: No one answered. The Outlaws sat frozen with horror, outrage, and shame.
        - id: ch01-b107
          speaker: mrs_de_vere_carter
          text: "You're such shy little darlings, aren't you?"
        - id: ch01-b108
          speaker: narrator
          text: She reached toward them. William quickly leaned away, and Ginger found his face pressed hard against her diamond brooch.
        - id: ch01-b109
          speaker: mrs_de_vere_carter
          text: "You won't stay shy with us for long. We're so happy here. Happy and good. Now, dear children, what must we be?"
        - id: ch01-b110
          speakers: [regular_child_1, regular_child_2, regular_child_3, regular_child_4]
          ensemble: chorus
          text: "Happy and good, Mrs. de Vere Carter."
        - id: ch01-b111
          speaker: mrs_de_vere_carter
          text: "That's right. Now, my darlings in the front row, you tell me. Willy, pet, you may start. What must we be?"
        - id: ch01-b112
          speaker: narrator
          text: William had never been closer to murder. Then he caught a gleam in Henry's eye. Henry would remember that hated name. William choked but said nothing.
        - id: ch01-b113
          speaker: mrs_de_vere_carter
          text: "Then you tell me, Harry boy."
        - id: ch01-b114
          speaker: narrator
          text: Henry turned purple, and William immediately felt better.
        - id: ch01-b115
          speaker: mrs_de_vere_carter
          text: "They won't be nearly so shy next week, will they, dear children?"
        - id: ch01-b116
          speakers: [regular_child_1, regular_child_2, regular_child_3, regular_child_4]
          ensemble: chorus
          text: "No, Mrs. de Vere Carter."
        - id: ch01-b117
          speaker: mrs_de_vere_carter
          text: "Now we'll sing one of our dear little songs. Please hand out the books. Number five, Sparkling Water. Gather your thoughts, dear children. Is everyone ready?"
        - id: ch01-b118
          speaker: narrator
          text: She sat down at the piano and struck the opening chords. Songbooks had been placed in the Outlaws' hands, but none of the four boys joined in. They had no objection at all to water as something a person might drink. What they objected to was having to sing a song about it. When the song ended, Mrs. de Vere Carter rose from the piano to announce the next activity.
        - id: ch01-b119
          speaker: mrs_de_vere_carter
          text: "Now we'll play a game. You can begin without me, can't you, darlings? I must cross the field and find out why little Teddy Wheeler is absent. He needs to attend regularly, doesn't he? What shall we play? Last week we had Puss in the Corner, so this week we might try Here We Go Round the Mulberry Bush. No, darling, not Blind Man's Buff. That's a nasty, rough game. While I'm gone, help our four shy darlings feel at home. And play quietly. Before I leave, tell me the four things you must be."
        - id: ch01-b120
          speakers: [regular_child_1, regular_child_2, regular_child_3, regular_child_4]
          ensemble: chorus
          text: "Respectful and reposeful and happy and good, Mrs. de Vere Carter."
        - id: ch01-b121
          speaker: narrator
          text: |-
            She was gone for about fifteen minutes. When she returned, a game was in full swing, but it was not Here We Go Round the Mulberry Bush.

            A screaming, struggling mass of children filled the Village Hall. Benches lay overturned, and several chairs were broken. With shouts, blows, and fierce wrestling, the Tamers tried to tame their opponents. The animals answered with growls, snarls, bites, and struggles of their own. They were determined not to be tamed. Every trace of listlessness and boredom had vanished. William stood at the head of the fight as one of the Tamers. His tie hung in strips, his coat was torn, his head was cut, and his voice had gone hoarse from shouting.
        - id: ch01-b122
          speaker: william
          text: "Come on, you!"
          emotion: angry
        - id: ch01-b123
          speaker: regular_child_1
          text: "I'll get you!"
          emotion: angry
        - id: ch01-b124
          speaker: regular_child_2
          text: "Grrrrr!"
          emotion: angry
        - id: ch01-b125
          speaker: william
          text: "Go on, men! Catch them! Beat them! Knife them! Kill them!"
          emotion: angry
        - id: ch01-b126
          speaker: narrator
          text: The animals answered with fierce roaring and bellowing that was almost enough to chill the blood. Over all the noise, Mrs. de Vere Carter pleaded, protested, and wrung her hands.
        - id: ch01-b127
          speaker: mrs_de_vere_carter
          text: "Respectful and reposeful! Happy and good! Dear boys! Willy!"
        - id: ch01-b128
          speaker: narrator
          text: |-
            Her words floated over the battle without anyone noticing. Again and again came respectful and reposeful, happy and good, dear boys, and Willy. None of it made the smallest difference. Then somebody charged out the door into the field. No one later agreed on who it was. The whole battle poured after that first runner and fought itself to a finish outside.

            The Band of Hope was never formally dismissed. When the battle was over, its members separated reluctantly and made their way to their different homes. Every child was bruised and battered. Every child was also completely, blissfully happy.
        - id: ch01-b129
          speaker: narrator
          text: Mrs. Brown waited anxiously for William. When he appeared, she gasped and sank weakly onto a chair in the hall.
        - id: ch01-b130
          speaker: mrs_brown
          text: "William!"
          emotion: surprised
        - id: ch01-b131
          speaker: william
          text: "I didn't play either of those games. Not the ones you told me not to play."
        - id: ch01-b132
          speaker: narrator
          text: He peered at her through an eye that was rapidly swelling shut.
        - id: ch01-b133
          speaker: mrs_brown
          text: "Then what did you play?"
        - id: ch01-b134
          speaker: william
          text: "It was... it was Tamers and Crocodiles. And we played it at the Band of Hope!"
