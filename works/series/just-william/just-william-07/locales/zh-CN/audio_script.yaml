audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    father:
      display_name: 布朗先生
      tts:
        delivery: 一本正经，讽刺中透着疲惫
        timbre: 沉稳厚实
        pace: 从容
        pitch: 中低音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    ethel:
      display_name: 埃塞尔
      tts:
        delivery: 文雅矜持，不耐烦时反而格外甜
        timbre: 清亮的年轻女声
        pace: 中速
        pitch: 中高音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负急躁，对弟弟毫不客气
        timbre: 平滑的青年男声
        pace: 中速偏快
        pitch: 中音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    douglas:
      display_name: 道格拉斯
      tts:
        delivery: 热心随和，偶尔故作老成
        timbre: 清亮的男孩声
        pace: 中速
        pitch: 中高音
    cook:
      display_name: 厨娘
      tts:
        delivery: 火气十足，发怒时毫不退让
        timbre: 洪亮结实的成年女声
        pace: 偏快
        pitch: 中低音
    mrs_de_ville_carter:
      display_name: 德维尔·卡特太太
      tts:
        delivery: 甜腻热烈，自信而戏剧化
        timbre: 清脆悦耳的成年女声
        pace: 轻快
        pitch: 中高音
    hope_child_1:
      display_name: 希望会孩子甲
      tts:
        delivery: 倦怠顺从，玩闹时放声叫喊
        timbre: 清亮的孩子声
        pace: 中速
        pitch: 高音
    hope_child_2:
      display_name: 希望会孩子乙
      tts:
        delivery: 无精打采，兴奋后大胆喧闹
        timbre: 轻快的孩子声
        pace: 中速偏快
        pitch: 中高音
    hope_child_3:
      display_name: 希望会孩子丙
      tts:
        delivery: 规矩木然，打闹时精力十足
        timbre: 明亮的孩子声
        pace: 中速
        pitch: 高音
    hope_child_4:
      display_name: 希望会孩子丁
      tts:
        delivery: 老实沉闷，起哄时毫不收敛
        timbre: 清脆的孩子声
        pace: 中速偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 老虎、驯兽师和一位客人
      blocks:
        - id: ch01-b01
          speaker: mother
          text: 威廉！你怎么又玩起那种吓人的游戏了！
        - id: ch01-b02
          speaker: narrator
          text: 威廉满身是土，领带歪到了耳朵底下，脸上一片乌黑，膝盖也擦破了。可他看着母亲时，却像是自己受了天大的冤枉。
        - id: ch01-b03
          speaker: william
          text: 我没有！你不许玩的是“狮子和驯兽师”，我后来一次也没玩过。就算有几千个人求我，我也不会玩。你说了不许，我当然就不玩。我——
        - id: ch01-b04
          speaker: mother
          text: 那你刚才玩的到底是什么？
        - id: ch01-b05
          speaker: narrator
          text: 布朗太太已经累得不想争了。
        - id: ch01-b06
          speaker: william
          text: “老虎和驯兽师”。这跟那个游戏完全不一样。“狮子和驯兽师”是让一半人当狮子，一半人当驯兽师。驯兽师要把狮子驯服，狮子要想办法不让他们驯服。就这么一点玩法，是个很小的游戏。
        - id: ch01-b07
          speaker: mother
          text: 那“老虎和驯兽师”又怎么玩？
        - id: ch01-b08
          speaker: narrator
          text: 威廉费劲地想了半天。
        - id: ch01-b09
          speaker: william
          text: 嗯……玩这个的时候，一半人当老虎，你明白吧？另一半人——
        - id: ch01-b10
          speaker: mother
          text: 威廉，这根本就是同一个游戏。
        - id: ch01-b11
          speaker: william
          text: 怎么会一样？狮子又不是老虎，老虎也不是狮子。动物园都把它们关在不同的笼子里。“老虎和驯兽师”怎么可能跟“狮子和驯兽师”一样？
        - id: ch01-b12
          speaker: mother
          text: 好吧，那从现在起，“老虎和驯兽师”也不许玩。去把脸洗干净。
        - id: ch01-b13
          speaker: narrator
          text: 威廉更觉得自己有道理了。
        - id: ch01-b14
          speaker: william
          text: 我的脸？我今天都洗过两遍了！起床洗了一遍，午饭时又洗了一遍，而且两次都是你叫我洗的。
        - id: ch01-b15
          speaker: mother
          text: 你先去照照镜子。
        - id: ch01-b16
          speaker: narrator
          text: 威廉来到镜子前，很有兴趣地看着自己的模样。他在脸上变黑的地方轻轻抹了几下，又顺了顺头发，扶正领带，然后满怀希望地转过身。
        - id: ch01-b17
          speaker: mother
          text: 这样没用。你得洗脸、梳头，最好把衣服和长袜也换掉，上面全是土。
        - id: ch01-b18
          speaker: narrator
          text: 威廉慢吞吞地往外走，心里的不平一点也没消。
        - id: ch01-b19
          speaker: william
          text: 我看没有几户人家像咱们家这样，一天到晚叫人洗啊梳啊的。他们可真走运。
        - id: ch01-b20
          speaker: narrator
          text: 十分钟后，布朗太太听见他下楼，又把他叫了回来。威廉整个人已经焕然一新，脸洗得干干净净，头发也梳得亮闪闪，衣服全换过，只是那股义愤一点也没消。
        - id: ch01-b21
          speaker: mother
          text: 这就好多了。离喝茶只剩十来分钟，你就在这里坐着吧。现在出去没什么意思，万一不安分，你准会又弄得一团糟。
        - id: ch01-b22
          speaker: william
          text: 坐在这儿？可我在这儿干什么？什么事都没有。难道真让我一动不动，什么也不干？
        - id: ch01-b23
          speaker: mother
          text: 你可以看书呀。那边那么多书你都没读过，总会有一本喜欢的。要不，试试司各特？
        - id: ch01-b24
          speaker: narrator
          text: 她说到最后，自己也没什么把握。威廉却像遭了大罪似的，苦着脸穿过房间，随手抽出一本书。他摆出冷傲庄严的样子坐下，还把书拿倒了。就在这时，佣人领着德维尔·卡特太太进来了。她进门看到的，正是这副景象。
        - id: ch01-b25
          speaker: narrator
          text: 这位太太刚搬到附近。结婚前，她是赫特福德郡兰德尔家的小姐。她高挑漂亮，热情洋溢，衣着精致得挑不出毛病。她朝谁一笑，谁都觉得受了抬举。她一来便轰动了这一带，人人都说她迷人。
        - id: ch01-b26
          speaker: mrs_de_ville_carter
          text: 多可爱的小宝贝呀！
        - id: ch01-b27
          speaker: narrator
          text: 她一边跟布朗太太握手，一边看着角落里的威廉。那孩子衣服整齐，脸和头发干干净净，正安安静静地“读书”。威廉听见那声赞叹，立刻沉下脸。德维尔·卡特太太已经飘到他面前。
        - id: ch01-b28
          speaker: mrs_de_ville_carter
          text: 哎呀，我的小男子汉，你好吗？
        - id: ch01-b29
          speaker: narrator
          text: 她把手按在威廉头上，一把将他的脸压进自己香喷喷、缀满褶边的胸口。那儿还别着一朵大玫瑰，花刺差点扎到他的鼻子。
        - id: ch01-b30
          speaker: mrs_de_ville_carter
          text: 我最爱孩子了。
        - id: ch01-b31
          speaker: narrator
          text: 她越过威廉的头顶对他母亲说。威廉很不客气地挣开脑袋。她又拿起了他那本书。
        - id: ch01-b32
          speaker: mrs_de_ville_carter
          text: 司各特！真是个可爱的小家伙！
        - id: ch01-b33
          speaker: narrator
          text: 布朗太太看见威廉的表情，赶忙把客人引到一旁。
        - id: ch01-b34
          speaker: mother
          text: 快到这边坐吧。今天天气真好。
        - id: ch01-b35
          speaker: narrator
          text: 威廉趁机离开了房间。
    - id: ch02
      title: 一份推不掉的邀请
      blocks:
        - id: ch02-b01
          speaker: mrs_de_ville_carter
          text: 你知道吗，我对社会工作真是热心得不得了，尤其是孩子们的事。我太爱孩子啦！你家的小宝贝真甜。我跟孩子一向合得来，当然，我跟大多数人都合得来。这就是我的人格魅力，你知道的！你也许听说了，我已经接管了这里的希望会，还把它办得有声有色。那些小宝贝呀！对了，请给我三块糖。
        - id: ch02-b02
          speaker: narrator
          text: 布朗太太给她倒着茶。那位迷人的客人终于说到了来意。
        - id: ch02-b03
          speaker: mrs_de_ville_carter
          text: 我正有件事要请你帮忙。你会答应的，对不对，亲爱的？你和你的小人儿都来帮我吧。我想让不同阶层的孩子加入希望会。“希望会”，这个名字多甜蜜呀！让村里的孩子见见我们这个阶层的孩子，对他们很有好处。
        - id: ch02-b04
          speaker: narrator
          text: 布朗太太听了，很有些受宠若惊。不管怎么说，眼前这位德维尔·卡特太太，毕竟曾是兰德尔家的小姐。
        - id: ch02-b05
          speaker: mrs_de_ville_carter
          text: 就拿刚才来说吧，我一进门，看见你的小宝贝那么乖地坐在那里，马上就想，我非请他来不可。村里的孩子正需要我们这个阶层的孩子给他们一点熏陶。蛋糕真好吃。你肯把他借给我吧？我们每周三下午聚一次。他能来吗？我一定把他照顾得好好的。
        - id: ch02-b06
          speaker: mother
          text: 呃……好吧。不过，我不大知道威廉适不适合这种活动。可是……
        - id: ch02-b07
          speaker: mrs_de_ville_carter
          text: 啊，你可别想推掉！难道我还不了解他吗？我已经把他当成最亲爱的小朋友之一了。我看懂一个孩子，从来不需要多久。我天生就爱孩子。
        - id: ch02-b08
          speaker: narrator
          text: 她俏皮地摇了摇戴满珠宝的手指。等她离开客厅，布朗太太跟在后面送客，威廉正好从门厅经过。
        - id: ch02-b09
          speaker: mrs_de_ville_carter
          text: 你果然在这儿！我就知道，你一定会等着跟我道别。
        - id: ch02-b10
          speaker: narrator
          text: 她伸出胳膊要搂威廉。威廉往后退了一步，站在那里狠狠瞪着她。
        - id: ch02-b11
          speaker: mother
          text: 今天见到你太愉快了。希望你再来。
        - id: ch02-b12
          speaker: narrator
          text: 布朗太太说得结结巴巴，还挪了挪身子，想挡住威廉的脸。可谁也拦不住德维尔·卡特太太。有些人就是一点也看不懂孩子脸上的表情。她又朝威廉飘了过去。
        - id: ch02-b13
          speaker: mrs_de_ville_carter
          text: 再见啦，亲爱的威利。你总不至于已经大到不能让我亲一下吧？
        - id: ch02-b14
          speaker: narrator
          text: 布朗太太倒吸一口气。威廉脸上的怒气已经凝成一团，换个比客人年长强壮的人来，只怕也会吓得退开。可德维尔·卡特太太还在微笑。威廉再瞪她一眼，猛地转身走了。
        - id: ch02-b15
          speaker: mrs_de_ville_carter
          text: 多甜、多害羞的小家伙呀！我最喜欢害羞的孩子了。
        - id: ch02-b16
          speaker: narrator
          text: 这个邀请自然也传到了布朗先生耳中。
        - id: ch02-b17
          speaker: father
          text: 嗯，我实在想不出威廉参加希望会会是什么样。不过，你既然想让他去，他当然就得去。
        - id: ch02-b18
          speaker: mother
          text: 你也知道，她坚持得很。而且她确实迷人，又很有影响。她以前可是兰德尔家的小姐。为这种小事得罪她，也太不明智了。
        - id: ch02-b19
          speaker: father
          text: 威廉喜欢她吗？
        - id: ch02-b20
          speaker: mother
          text: 她对他亲热极了。至少……她是想对他亲热。可你知道威廉很容易生气，也一直讨厌人家那样叫他。我始终不懂这是为什么，明明很多人都叫威利。
    - id: ch03
      title: 威廉病得不轻
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 希望会集会那天一早，威廉下楼吃饭。健康红润的脸上，偏偏摆出一副痛苦万分的样子。他坐下来，一只手扶着额头，嘴里发出空洞的呻吟。布朗太太吓得站起身。
        - id: ch03-b02
          speaker: mother
          text: 哎呀，威廉！你怎么了？
        - id: ch03-b03
          speaker: william
          text: 我头疼，还恶心。
        - id: ch03-b04
          speaker: mother
          text: 哎呀，真可怜。你最好回房躺一会儿，可怜的宝贝。
        - id: ch03-b05
          speaker: william
          text: 我也觉得该去躺着。不过，我先把早饭吃完。
        - id: ch03-b06
          speaker: mother
          text: 我看还是别吃了。头疼又恶心，怎么能吃东西呢？
        - id: ch03-b07
          speaker: narrator
          text: 威廉肚子饿得厉害，只能眼巴巴看着鸡蛋和熏肉。
        - id: ch03-b08
          speaker: william
          text: 我觉得自己还能吃一点，妈妈。就一点点。
        - id: ch03-b09
          speaker: mother
          text: 还是别吃了，宝贝。吃下去只会让你更难受。
        - id: ch03-b10
          speaker: narrator
          text: 威廉万分不情愿地回了房。早饭过后，布朗太太去看他。他说自己一点也没好，恶心得仍旧厉害，不过出去稍微走一走也许会有用。
        - id: ch03-b11
          speaker: mother
          text: 要不喝一大剂盐水吧。真吐出来，说不定反倒舒服些。
        - id: ch03-b12
          speaker: william
          text: 不用了，我可不想给你添这种麻烦。再说，这不是那一种恶心，肯定不是。我觉得走一走会好些。我很想出去走走。
        - id: ch03-b13
          speaker: narrator
          text: 母亲把他裹得严严实实。他迈着又虚弱又不稳的小步子走下车道，布朗太太一直担忧地望着他。可他很快悄悄绕回屋后，躲到墙边的杜鹃花丛里，从食品储藏室的窗户爬了进去。
        - id: ch03-b14
          speaker: narrator
          text: 半小时后，厨娘慌慌张张地来找布朗太太，脸色苍白、满腹委屈的威廉跟在她身后。
        - id: ch03-b15
          speaker: cook
          text: 太太，他几乎把里面的东西全吃光了！您根本没见过这样的。他吃了冷火腿、腰子馅饼，还有三根冷香肠。连刚开的一整罐柠檬酱，也让他吃得干干净净。
          emotion: angry
        - id: ch03-b16
          speaker: mother
          text: 威廉！你吃下这么多东西，怎么还会头疼恶心？
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: 头疼恶心这一招，到这里就算完了。
        - id: ch03-b18
          speaker: narrator
          text: 上午剩下的时间，威廉跟亨利、道格拉斯和姜吉待在一起。他们四个组成了一个秘密会社，名字叫“亡命徒”。这个会社除了保守秘密，几乎没有别的宗旨。威廉是大家公认的首领，也一直为这份荣誉骄傲。
        - id: ch03-b19
          speaker: narrator
          text: 可今天，只要想到伙伴们可能看见他去希望会，或者从别人那里听说这件事，他就一阵冷、一阵热。要是他们知道了，甚至只是猜到了，他以后还怎么抬得起头？于是他绕着弯子，想问出三个人下午会去哪里。只要知道他们的去处，他也许就能设法避开。可他问来问去，什么也没打听到。
        - id: ch03-b20
          speaker: narrator
          text: 他们带着亨利的猎狐㹴奇普斯，还有威廉的杂种狗杂毛，在树林里“逮兔子”，玩了一上午。兔子一只也没露面。杂毛却追过一只蝴蝶和一只蜜蜂，刨开一座鼹鼠丘，还让黄蜂蜇了一下。奇普斯则逮住了一只田鼠，所以这上午也不能说全无收获。
        - id: ch03-b21
          speaker: narrator
          text: 只是威廉始终打不起精神。他想出一个又一个逃掉集会的办法，又一个接一个地放弃，因为没有哪个真能奏效。
        - id: ch03-b22
          speaker: narrator
          text: 午饭时，他比平常早一点走进餐厅。里面只有哥哥罗伯特和姐姐埃塞尔。威廉一瘸一拐，嘴唇紧紧抿着，像是在强忍疼痛，眉头也皱成一团。
        - id: ch03-b23
          speaker: robert
          text: 喂，出什么事了？
        - id: ch03-b24
          speaker: narrator
          text: 罗伯特早饭时不在家，也已经忘了希望会这回事。
        - id: ch03-b25
          speaker: william
          text: 我的脚踝扭伤了。
        - id: ch03-b26
          speaker: robert
          text: 来吧，老弟，坐下让我摸摸。是哪只脚？
        - id: ch03-b27
          speaker: narrator
          text: 威廉很听话地坐到椅子上。
        - id: ch03-b28
          speaker: william
          text: 呃……这只。
        - id: ch03-b29
          speaker: ethel
          text: 真可惜，你刚才跛的明明是另一只脚。
        - id: ch03-b30
          speaker: narrator
          text: 扭伤脚踝这一招，也就到此为止。
        - id: ch03-b31
          speaker: narrator
          text: 集会三点开始。两点半，威廉突然牙疼得要命。两点三十五，他又说风湿病犯了。到了两点四十，他宣布自己的肝也有点毛病。威廉觉得，这个主意简直像上天赐给他的，因为父亲有不少日子不去上班，正是为了这个毛病。可家里人对他这一连串申诉毫无反应，谁也没有因此让他留在家里。两点四十五，威廉已经穿戴好，站在门厅里了。
        - id: ch03-b32
          speaker: mother
          text: 你肯定会喜欢的，威廉。我想你们会一起玩游戏，玩得很开心。
        - id: ch03-b33
          speaker: narrator
          text: 威廉只用沉默和轻蔑回答了她。
        - id: ch03-b34
          speaker: william
          text: 杂毛！过来！
        - id: ch03-b35
          speaker: narrator
          text: 不管怎么说，只要世上还有杂毛，人生就不算全黑。杂毛从厨房那边欣喜若狂地冲来，嘴边全是肉汁，跑着跑着，还把啃了一半的骨头丢在门厅地毯上。
        - id: ch03-b36
          speaker: mother
          text: 威廉，你不能带狗去希望会。
        - id: ch03-b37
          speaker: william
          text: 为什么不能？狗又不喝啤酒，对吧？它去希望会，跟我一样有资格。看来别人真是什么都不许做。
        - id: ch03-b38
          speaker: mother
          text: 我肯定他们不会同意。参加集会的人没有谁会带狗。
        - id: ch03-b39
          speaker: narrator
          text: 布朗太太牢牢抓住杂毛的项圈。威廉只好独自走下车道，每一步都很不情愿。
        - id: ch03-b40
          speaker: mother
          text: 祝你玩得开心！
        - id: ch03-b41
          speaker: narrator
          text: 她兴高采烈地喊。威廉回过头看着她。
        - id: ch03-b42
          speaker: william
          text: 我受了这么多罪，居然还没死，简直是个奇迹！
    - id: ch04
      title: 四个害羞的小宝贝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 威廉垂头丧气地慢慢走着，模样凄凉极了。到了大门口，他停下来，小心地看看路的两头。三个身影正沿路走来，相隔都不远。那是亨利、道格拉斯和姜吉。
        - id: ch04-b02
          speaker: narrator
          text: 威廉第一个念头，是冲回家，等他们走远再出来。可这三个人看着不大对劲。他们也都低着头、皱着脸，活像做了什么亏心事。亨利最先走近。他羞惭地瞟了威廉一眼，正想从旁边溜过去。
        - id: ch04-b03
          speaker: william
          text: 你也要去？
        - id: ch04-b04
          speaker: narrator
          text: 亨利惊得吸了一口气。
        - id: ch04-b05
          speaker: henry
          text: 她也去找你妈妈了？
        - id: ch04-b06
          speaker: narrator
          text: 接着，亨利看见后面的姜吉和道格拉斯，又吃了一惊。姜吉回头看到道格拉斯，也是一脸意外。四个人就这样羞羞惭惭地结伴往村公所走。一路没人说话，大家心情都坏透了。走着走着，姜吉抬手摸了摸喉咙。
        - id: ch04-b07
          speaker: ginger
          text: 我的嗓子疼得厉害。我根本就不该出门。
        - id: ch04-b08
          speaker: henry
          text: 我也病了。我早就跟家里说过。
        - id: ch04-b09
          speaker: douglas
          text: 我也是。
        - id: ch04-b10
          speaker: william
          text: 我也是。我们全病成这样，他们还硬逼着我们出门，真残忍。
        - id: ch04-b11
          speaker: narrator
          text: 威廉干笑了一声，嗓音沙哑，半点笑意也没有。到了村公所门前，四个人停下脚步。威廉留恋地看向田野。
        - id: ch04-b12
          speaker: ginger
          text: 逃也没用。他们肯定会发现。
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: 他们满心怨恨，又灰心丧气，只能一起走进去。大厅里稀稀落落地坐着几个阴沉的孩子。这些老会员每次都按时来参加集会，心里唯一的盼头，就是一年一回的游玩招待。
        - id: ch04-b14
          speaker: narrator
          text: 德维尔·卡特太太朝他们飘过来，褶边和围巾在身边飞舞，一股浓浓的香水味也跟着来了。
        - id: ch04-b15
          speaker: mrs_de_ville_carter
          text: 亲爱的孩子们，欢迎来参加我们的小聚会。这四位是我们亲爱的新朋友。我们可一定要让他们特别开心。亲爱的孩子们！
        - id: ch04-b16
          speaker: narrator
          text: 她转向老会员。那些孩子阴沉地看着“亡命徒”们。接着，她把四个新人领到第一排坐好，自己站到大家面前讲话。
        - id: ch04-b17
          speaker: mrs_de_ville_carter
          text: 好了，亲爱的姑娘们，还有亲爱的小伙子们。参加集会时，我希望你们做到哪两点呀？
        - id: ch04-b18
          speakers: [hope_child_1, hope_child_2, hope_child_3, hope_child_4]
          ensemble: chorus
          text: 彬彬有礼，安安静静。
        - id: ch04-b19
          speaker: narrator
          text: 孩子们的声音单调又厌倦。
        - id: ch04-b20
          speaker: mrs_de_ville_carter
          text: 我不是也有名字吗，亲爱的孩子们？
        - id: ch04-b21
          speakers: [hope_child_1, hope_child_2, hope_child_3, hope_child_4]
          ensemble: chorus
          text: 彬彬有礼，安安静静，德维尔·卡特太太。
        - id: ch04-b22
          speaker: mrs_de_ville_carter
          text: 说对啦，亲爱的孩子们，就是彬彬有礼，安安静静。现在，请新来的小朋友告诉我，我希望你们做到哪两点？
        - id: ch04-b23
          speaker: narrator
          text: 没人出声。“亡命徒”们坐在那里，又惊恐，又愤慨，还羞耻得不得了。
        - id: ch04-b24
          speaker: mrs_de_ville_carter
          text: 你们都是害羞的小宝贝，对不对？
        - id: ch04-b25
          speaker: narrator
          text: 她说着伸出一条胳膊。威廉赶紧往后缩，姜吉却没躲开，脸被紧紧压在一枚钻石胸针上。
        - id: ch04-b26
          speaker: mrs_de_ville_carter
          text: 我相信，你们很快就不会在我们面前害羞了。瞧，我们在这里多快乐呀，又快乐又乖巧。好了，亲爱的孩子们，我们要怎么样？
        - id: ch04-b27
          speakers: [hope_child_1, hope_child_2, hope_child_3, hope_child_4]
          ensemble: chorus
          text: 快乐又乖巧，德维尔·卡特太太。
        - id: ch04-b28
          speaker: narrator
          text: 那阵厌倦又单调的合声再次响了起来。
        - id: ch04-b29
          speaker: mrs_de_ville_carter
          text: 对啦。现在请第一排的小宝贝来回答。亲爱的威利，你先说，我们要怎么样？
        - id: ch04-b30
          speaker: narrator
          text: 威廉这辈子从没有哪一刻像现在这样接近杀人。他瞥见亨利眼里闪过一道光。亨利一定会把“威利”这个称呼牢牢记住。威廉气得说不出话，却始终不开口。
        - id: ch04-b31
          speaker: mrs_de_ville_carter
          text: 那么，哈里小伙子，你来告诉我吧。
        - id: ch04-b32
          speaker: narrator
          text: 亨利的脸一下涨成紫色，威廉倒立刻振作了不少。
        - id: ch04-b33
          speaker: mrs_de_ville_carter
          text: 啊，到了下星期，他们就不会这么害羞了。对不对，亲爱的孩子们？
        - id: ch04-b34
          speakers: [hope_child_1, hope_child_2, hope_child_3, hope_child_4]
          ensemble: chorus
          text: 对，德维尔·卡特太太。
        - id: ch04-b35
          speaker: mrs_de_ville_carter
          text: 现在，我们先来唱一首亲爱的小歌。请把歌本发下去。第五首，《晶莹的清水》。亲爱的孩子们，都收收心。准备好了吗？
        - id: ch04-b36
          speaker: narrator
          text: 她坐到钢琴前，弹出开头几个和弦。“亡命徒”们虽然也拿到了歌本，却谁也不唱。他们并不反对把水当饮料，只是不愿意开口赞美它。歌曲结束后，德维尔·卡特太太从钢琴前站起来。
    - id: ch05
      title: 希望会的新游戏
      blocks:
        - id: ch05-b01
          speaker: mrs_de_ville_carter
          text: 现在，我们来玩一个亲爱的小游戏。小宝贝们，你们可以先自己玩起来，对不对？我要到田野那边看看，小泰迪·惠勒为什么没来。他可得坚持参加，对不对，亲爱的小伙子们？那么，玩什么好呢？上星期玩的是“角落里的猫咪”，这星期就玩“大家绕着桑树转”，好不好？不行，亲爱的，不能玩“摸瞎子”，那种游戏又吓人又粗野。我不在的时候，请你们想办法，让这四个害羞的小宝贝放松一点，好吗？大家玩得安静些。
        - id: ch05-b02
          speaker: mrs_de_ville_carter
          text: 好了，在我走之前，先告诉我，你们要做到哪四点？
        - id: ch05-b03
          speakers: [hope_child_1, hope_child_2, hope_child_3, hope_child_4]
          ensemble: chorus
          text: 彬彬有礼，安安静静，快乐又乖巧，德维尔·卡特太太。
        - id: ch05-b04
          speaker: narrator
          text: 她离开了大约一刻钟。等她回来，游戏已经玩得热火朝天。只是孩子们玩的，根本不是“大家绕着桑树转”。
        - id: ch05-b05
          speaker: narrator
          text: 村公所里挤满了尖叫扭打的孩子。长凳翻倒在地，好几把椅子也断了。驯兽师们狂呼乱叫，又打又扭，拼命要把动物驯服。动物们又吼又咬，又踢又挣扎，死活不肯让人驯服。刚才的倦怠和无聊早就一扫而空。
        - id: ch05-b06
          speaker: narrator
          text: 威廉的领带撕成了碎条，外套也破了，头上划开一道口子，嗓子已经喊哑。他正以驯兽师的身份，领着大家猛攻。
        - id: ch05-b07
          speaker: william
          text: 来呀，你！
        - id: ch05-b08
          speaker: hope_child_1
          text: 我来抓你啦！
        - id: ch05-b09
          speaker: hope_child_2
          text: 嗷——呜——呜——呜！
        - id: ch05-b10
          speaker: william
          text: 上啊，弟兄们！抓住他们！揍他们！拿刀捅他们！杀了他们！
        - id: ch05-b11
          speaker: narrator
          text: 动物们精神十足地吼叫着，那声音几乎让人毛骨悚然。德维尔·卡特太太又哄又劝，一会儿规诫，一会儿绝望地绞着双手。她的声音一直浮在喧闹上面。
        - id: ch05-b12
          speaker: mrs_de_ville_carter
          text: 要彬彬有礼，安安静静！要快乐又乖巧！亲爱的小伙子们！威利！
        - id: ch05-b13
          speaker: narrator
          text: 可这些话从战斗的浪头上飘过去，根本没有人理会。后来，不知道是谁第一个冲出大门，跑进了田野。有人说是这个孩子，有人又说是另一个，事后众说纷纭，谁也讲不清楚。总之，大战转移到田野，一直打到了最后。
        - id: ch05-b14
          speaker: narrator
          text: 希望会还没正式宣布散会，孩子们已经依依不舍地各自回家。他们个个鼻青脸肿，浑身伤痕，却又幸福得不得了。
        - id: ch05-b15
          speaker: narrator
          text: 布朗太太正在家里焦急地等威廉。一看见他，她猛吸一口气，浑身发软，跌坐在门厅的一把椅子上。
        - id: ch05-b16
          speaker: mother
          text: 威廉！
          emotion: surprised
        - id: ch05-b17
          speaker: william
          text: 我没有！我没玩那两个游戏，就是你不许我玩的那两个。
        - id: ch05-b18
          speaker: narrator
          text: 他的一只眼睛正迅速肿起来，很快就要睁不开了，只能用另一只眼睛看着母亲。
        - id: ch05-b19
          speaker: mother
          text: 那……那你到底玩了什么？
        - id: ch05-b20
          speaker: william
          text: 我们玩的是……是“驯兽师和鳄鱼”，就在希望会上玩的！
