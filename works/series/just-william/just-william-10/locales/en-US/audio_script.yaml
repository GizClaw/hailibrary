  chapters:
    - id: ch01
      title: A Resolution for William
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: William went whistling down the street with his hands deep in his pockets. His whistle was much more piercing than musical. People with sensitive ears shuddered and hurried away from the sound. Mr. Moss, who owned the sweet shop, was made of stronger stuff. He gave William a friendly nod as the boy passed. William was one of his regular customers, or at least as regular as a completely inadequate allowance allowed him to be. Encouraged by the greeting, William stopped in the doorway and, for once, stopped whistling.
        - id: ch01-b02
          speaker: william
          text: "Hello, Mr. Moss. Got anything cheap today?"
        - id: ch01-b03
          speaker: mr_moss
          text: "Hello, William. Nothing under two pennies an ounce."
        - id: ch01-b04
          speaker: william
          text: "That's terribly expensive. Give me two ounces, though. I'll pay tomorrow."
        - id: ch01-b05
          speaker: mr_moss
          text: "Everything's expensive. And my terms are cash, young sir. Still, tomorrow, when the scales are down, I'll throw in a few extra as a New Year's gift."
        - id: ch01-b06
          speaker: william
          text: "You really promise? Then give them to me now."
        - id: ch01-b07
          speaker: mr_moss
          text: "They wouldn't be a New Year's gift then, would they?"
        - id: ch01-b08
          speaker: narrator
          text: William thought it over.
        - id: ch01-b09
          speaker: william
          text: "I'll eat them today, but I'll think about them tomorrow. That'll make them a New Year's gift."
        - id: ch01-b10
          speaker: narrator
          text: Mr. Moss took out a generous fistful of mixed fruit drops and passed them across the counter. William accepted this advance on the New Year's gift with deep gratitude and immediately began crunching.
        - id: ch01-b11
          speaker: mr_moss
          text: "What good resolution are you making tomorrow?"
        - id: ch01-b12
          speaker: narrator
          text: William crunched in silence for a moment.
        - id: ch01-b13
          speaker: william
          text: "A good resolution? I haven't got one."
        - id: ch01-b14
          speaker: mr_moss
          text: "You have to make one for New Year's Day. Think of a fault you want to cure, and start tomorrow."
        - id: ch01-b15
          speaker: william
          text: "Like giving up sugar in your tea for Lent, or wearing blue on Boat Race Day? I can't think of any faults. You pick one for me."
        - id: ch01-b16
          speaker: mr_moss
          text: "You could do your schoolwork properly."
        - id: ch01-b17
          speaker: william
          text: "No. There wouldn't be much fun in that. None at all."
        - id: ch01-b18
          speaker: mr_moss
          text: "Then keep your clothes tidy. Or stop shouting and whistling."
        - id: ch01-b19
          speaker: narrator
          text: William shuddered at the first suggestion. At the next, he stuffed two more sweets into his mouth and shook his head hard.
        - id: ch01-b20
          speaker: william
          text: "Crumbs, no!"
        - id: ch01-b21
          speaker: mr_moss
          text: "What about being polite? Saying please and thank you, and things like, ‘If you don't mind me saying so,’ ‘Excuse me for disagreeing,’ and ‘Can I do anything for you?’"
        - id: ch01-b22
          speaker: narrator
          text: That idea caught William's interest in a way that schoolwork, tidy clothes, and silence had completely failed to do. He straightened his collar, drew himself up, and tried on the appearance of a very polite person.
        - id: ch01-b23
          speaker: william
          text: "Yes, I could try being polite. How long do I have to keep it up?"
        - id: ch01-b24
          speaker: mr_moss
          text: "Not long. Usually just the first day. Most people give up after that."
        - id: ch01-b25
          speaker: william
          text: "What's your resolution?"
        - id: ch01-b26
          speaker: narrator
          text: As he asked, William pushed four more sweets into his already busy mouth. Mr. Moss looked carefully around the little shop, though there was no one else there. Then, with the air of a man sharing a dangerous secret, he leaned across the counter.
        - id: ch01-b27
          speaker: mr_moss
          text: "I'm going to ask her again. I've asked the same person every New Year's Day for ten years."
        - id: ch01-b28
          speaker: william
          text: "Ask her what? To take you somewhere? Why can't you go by yourself?"
        - id: ch01-b29
          speaker: mr_moss
          text: "To marry me, of course."
        - id: ch01-b30
          speaker: narrator
          text: Mr. Moss blushed a little. William considered the matter like a judge.
        - id: ch01-b31
          speaker: william
          text: "I wouldn't keep asking the same person for ten years. I'd try other people till I found someone who didn't mind you. You've even got a sweet shop. She must be silly. Does she know about the shop?"
        - id: ch01-b32
          speaker: narrator
          text: Mr. Moss did not try to answer William's advice about finding a less particular bride. He only sighed, chose a bull's-eye candy for himself, and popped it into his mouth. Then he stood there chewing with an air of distant, melancholy thought.
    - id: ch02
      title: Politeness at Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, William jumped out of bed with stern determination.
        - id: ch02-b02
          speaker: william
          text: "I'm going to be polite. I'm going to be polite all day."
        - id: ch02-b03
          speaker: narrator
          text: He announced this solemnly to the chairs, the bed, and every other piece of bedroom furniture that might care to hear. Then he dressed and started down to breakfast. On the stairs, he met his father coming the other way.
        - id: ch02-b04
          speaker: william
          text: "Good morning, Father. Is there anything I can do for you today?"
        - id: ch02-b05
          speaker: narrator
          text: William believed he had spoken with the graceful courtesy of a gentleman at court. His father stopped and looked down at him with immediate suspicion.
        - id: ch02-b06
          speaker: mr_brown
          text: "What are you after now?"
        - id: ch02-b07
          speaker: william
          text: "I'm only being polite. You know, one of those things people take on New Year's Day. I've taken one to be polite."
        - id: ch02-b08
          speaker: mr_brown
          text: "I'm sorry. I'm not used to it. You startled me."
        - id: ch02-b09
          speaker: narrator
          text: At breakfast, William's new politeness had a wider audience, and it shone out in all its glory. He watched for a chance to practice one of Mr. Moss's phrases, then turned sweetly to his older brother.
        - id: ch02-b10
          speaker: william
          text: "Would you like me to pass you anything, Robert?"
        - id: ch02-b11
          speaker: narrator
          text: His older brother ignored him and spoke to no one in particular.
        - id: ch02-b12
          speaker: robert
          text: "Looks like rain again."
        - id: ch02-b13
          speaker: william
          text: "Excuse me for disagreeing, Robert, but I heard the milkman say it would be sunny. Excuse me for disagreeing."
        - id: ch02-b14
          speaker: robert
          text: "That's enough of your cheek!"
          emotion: angry
        - id: ch02-b15
          speaker: william
          text: "Nobody in this house understands politeness. I could keep it up for years, and none of you would even know what I was doing."
        - id: ch02-b16
          speaker: narrator
          text: William sounded bitterly wronged. He had made a noble effort, and his family treated it like misbehavior. His mother studied his face with growing anxiety, as though this strange sweetness might be a sign of illness.
        - id: ch02-b17
          speaker: mrs_brown
          text: "You are feeling all right, dear? No headache or anything?"
        - id: ch02-b18
          speaker: william
          text: "No, I'm being polite! I mean, I'm very well, thank you, Mother dear."
        - id: ch02-b19
          speaker: narrator
          text: He began irritably, caught himself, and finished in a voice as sweet and sticky as syrup.
        - id: ch02-b20
          speaker: robert
          text: "Does it hurt much?"
        - id: ch02-b21
          speaker: william
          text: "No, thank you, Robert."
        - id: ch02-b22
          speaker: narrator
          text: After breakfast, his father handed over his pocket money. William accepted it with a display of courteous gratitude so grand that Mr. Brown decided to answer in exactly the same style.
        - id: ch02-b23
          speaker: william
          text: "Thank you very much, Father."
        - id: ch02-b24
          speaker: mr_brown
          text: "Not at all. Please don't mention it. It's perfectly all right. Though it is rather trying. How long will this last?"
        - id: ch02-b25
          speaker: william
          text: "What? Oh, being polite. Mr. Moss said people don't usually keep it up after the first day. He's going to ask her again."
        - id: ch02-b26
          speaker: mr_brown
          text: "Whoever he is, he's right about that. But who's asking whom what?"
        - id: ch02-b27
          speaker: narrator
          text: William had already gone. He was on his way to Mr. Moss's shop.
    - id: ch03
      title: William Gets a Sweet Shop
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Mr. Moss was already at the shop door. He had his hat on and his coat buttoned, ready to leave, but instead of going anywhere he kept peering anxiously down the street. Every few seconds he looked for the nephew who was supposed to replace him.
        - id: ch03-b02
          speaker: william
          text: "Good morning, Mr. Moss."
        - id: ch03-b03
          speaker: mr_moss
          text: "He's late! I'm going to miss my train. I've made this trip every New Year's Day for ten years, and now I'll miss it."
        - id: ch03-b04
          speaker: narrator
          text: William examined the candy like an expert.
        - id: ch03-b05
          speaker: william
          text: "Those pink ones are new. What do they cost?"
        - id: ch03-b06
          speaker: mr_moss
          text: "Eight pennies for a quarter pound. Oh, I'll miss that train!"
        - id: ch03-b07
          speaker: william
          text: "They're awfully small. You'd think little ones like that would cost less."
        - id: ch03-b08
          speaker: mr_moss
          text: "Will you do me a favor? I'll give you a quarter pound of them."
        - id: ch03-b09
          speaker: narrator
          text: William gasped. The offer was almost too generous to believe.
        - id: ch03-b10
          speaker: william
          text: "For that, I'll do anything."
        - id: ch03-b11
          speaker: mr_moss
          text: "Stay here until my nephew Bill arrives. He should be here any second, and he'll run the shop till I return. Tell him I had to hurry for my train. If a customer comes first, ask them to wait or come back. You can weigh out your quarter pound of pink sweets."
        - id: ch03-b12
          speaker: narrator
          text: Mr. Moss was certainly feeling generous for the holiday. A whole quarter pound of those new pink candies, merely for waiting in a shop, was almost beyond belief. William pinched himself to make sure he was still alive and had not suddenly been carried into heaven. Mr. Moss checked his large old watch one last time. Then he rushed off in the direction of the station, leaving William alone among all the candy.

            For the first few moments, William did nothing but enjoy wonderful daydreams. His greatest childhood wish, and perhaps every child's greatest wish, had come true. He had a sweet shop. He walked around with the swagger of an owner inspecting his property. On the way, he paused to put a Butter Ball into his mouth. The label promised that it contained pure farm cream and the very best butter. Everywhere he looked, shining glass jars held sweets of every color and size. Boxes upon boxes of chocolates were arranged to tempt the eye. For a little while, William only pretended they all belonged to him. By the time he had marched around the shop three times, the pretending was over. He honestly believed he owned the place.
        - id: ch03-b13
          speaker: narrator
          text: Then a small boy appeared in the doorway. William scowled.
        - id: ch03-b14
          speaker: william
          text: "What do you want? I mean, please, what do you want?"
        - id: ch03-b15
          speaker: small_boy
          text: "Where's Uncle? Our Bill's sick, so he can't come."
        - id: ch03-b16
          speaker: william
          text: "That's fine. Tell them everything's fine. Now run along."
        - id: ch03-b17
          speaker: narrator
          text: The boy did not move. William pushed a licorice stick into one hand and a packet of chocolate into the other.
        - id: ch03-b18
          speaker: william
          text: "Now go away! I don't want you here. Go on, you ridiculous cow! If you don't mind me saying so."
        - id: ch03-b19
          speaker: narrator
          text: William's insults were often entirely original, and this one was no exception. The small boy finally ran off, still staring at William and still clutching the unexpected candy in both hands. William charged as far as the doorway and called the polite ending after the retreating figure, because even an insult had to satisfy the Resolution.

            By now, William no longer thought of the Resolution as a simple promise. It had become a powerful sort of god that had to be pleased at any cost. And why not? It seemed to have rewarded him already by placing him in sole command of a fully equipped sweet shop.

            He began another tour of his kingdom and discovered a completely new kind of sweet called Cokernut Kisses. They were delicious, but they had one serious weakness. The moment one entered his mouth, it melted away. That made it hard to know how many he had eaten. Almost before William understood what was happening, he found himself staring into an empty box. He decided that Pineapple Crisps were more solid and dependable, and returned to those.
    - id: ch04
      title: Two Very Different Customers
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A thin lady of no obvious age entered the shop.
        - id: ch04-b02
          speaker: thin_lady
          text: "Good morning. Where is Mr. Moss?"
        - id: ch04-b03
          speaker: narrator
          text: Her voice was cold. William answered around five candies.
        - id: ch04-b04
          speaker: thin_lady
          text: "I can't understand one word."
        - id: ch04-b05
          speaker: narrator
          text: She sounded even colder than before. William considered the problem and took two of the five candies out of his mouth. Since he meant to finish them later, he placed the wet candies carefully on the shop scale.
        - id: ch04-b06
          speaker: william
          text: "Gone. Thank you."
        - id: ch04-b07
          speaker: narrator
          text: The thank-you came only because the Resolution had suddenly entered his mind.
        - id: ch04-b08
          speaker: thin_lady
          text: "Then who is in charge?"
        - id: ch04-b09
          speaker: william
          text: "Me."
        - id: ch04-b10
          speaker: narrator
          text: She looked at him with clear disapproval.
        - id: ch04-b11
          speaker: thin_lady
          text: "Give me one of those chocolate bars."
        - id: ch04-b12
          speaker: narrator
          text: William looked around the shop and, for the first time, noticed that his private feast had left real gaps in Mr. Moss's stock. The missing candy might cost the owner quite a bit. Here was a customer and a chance to recover some of that loss. William looked down at the chocolate bars. Their usual price was two pennies each, but the usual price would hardly cover all he had eaten.
        - id: ch04-b13
          speaker: william
          text: "One shilling each."
        - id: ch04-b14
          speaker: thin_lady
          text: "A shilling? They cost two pennies yesterday!"
          emotion: surprised
        - id: ch04-b15
          speaker: william
          text: "The price went up. If you'll kindly excuse me for saying so."
        - id: ch04-b16
          speaker: thin_lady
          text: "Did the makers tell you that?"
        - id: ch04-b17
          speaker: william
          text: "Yes, ma'am. They told me this morning, if you don't mind me saying so."
        - id: ch04-b18
          speaker: narrator
          text: William's overflowing politeness only made her angrier.
        - id: ch04-b19
          speaker: thin_lady
          text: "Did their message come by mail?"
        - id: ch04-b20
          speaker: william
          text: "Yes, ma'am. This morning."
        - id: ch04-b21
          speaker: thin_lady
          text: "I live across the street, you wicked liar. The mail carrier never stopped here today."
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: William met her eyes without a tremor.
        - id: ch04-b23
          speaker: william
          text: "No, the makers came to see me during the night. You couldn't hear them because you were asleep, if you'll excuse me for disagreeing."
        - id: ch04-b24
          speaker: narrator
          text: Convincing other people with a lie is a remarkable gift. There is an even greater one, though. Some people can tell a lie and convince themselves that it is true. William possessed that greater gift. By the time he finished explaining the secret nighttime visit, he faced the lady with the calm certainty of an honest witness.
        - id: ch04-b25
          speaker: thin_lady
          text: "I refuse to pay more than two pennies. And I'm reporting this shop to the Profiteering Committee. This is disgraceful, and every word you've said is a wicked lie!"
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: She took a bar, dropped two pennies on the counter, and marched out. William glared after her.
        - id: ch04-b27
          speaker: william
          text: "It costs a shilling! I don't want your nasty old two pennies. I said one shilling, you old thief, if you don't mind me saying so!"
          emotion: angry
        - id: ch04-b28
          speaker: narrator
          text: He followed her all the way to the doorway while she crossed the street toward her house. The accusation came out at full volume. Then the Resolution tugged at his conscience, so he added the polite phrase under his breath with stubborn determination.
        - id: ch04-b29
          speaker: thin_lady
          text: "I'll send the police after you, you wicked, blasphemous boy!"
          emotion: angry
        - id: ch04-b30
          speaker: narrator
          text: William stuck out his tongue, went back inside, and shut the door.

            Opening the door made a bell ring. This was almost as entertaining as the candy. With his mouth full of Liquorice All Sorts, William spent five minutes opening and slamming the door over and over. The bell rang each time, until something in its mechanism finally went wrong and it fell silent. William prepared himself for repairs by eating several Nutty Footballs. Then he climbed onto a chair and began taking the bell apart without the slightest mercy. While he was busy, another customer entered. William swallowed one Nutty Football whole, jumped down, and hurried behind the counter.
        - id: ch04-b31
          speaker: narrator
          text: The new customer was a dainty girl of about nine. She wore a white fur coat and matching cap, with long white gaiters. Golden curls fell over the fur at her shoulders. Her eyes were blue, her cheeks soft and rosy, and her mouth was small like a baby's. William had seen this lovely vision around town several times, though he had never dared speak to her. Whenever she appeared, his heart seemed to melt inside him.

            Now he gave her a shy, foolish smile. His freckled face turned red all the way to the roots of his short, stiff hair. The girl showed no surprise at finding another child in charge of a shop. She simply walked up to the counter as if everything were perfectly ordinary.
        - id: ch04-b32
          speaker: little_girl
          text: "Please, may I have two chocolate bars at two pennies each?"
        - id: ch04-b33
          speaker: narrator
          text: Her voice was as clear and silvery as she looked. William was so delighted that speech deserted him completely. His smile only became wider and more foolish. Then he noticed that his two damp, half-eaten Pineapple Crisps were still lying in full view on the scale. He hurriedly put both back into his mouth. The girl laid four pennies on the counter and waited. At last, William managed to find his voice.
        - id: ch04-b34
          speaker: william
          text: "Four pennies will buy lots. Everything got cheaper. Much cheaper. Take the whole box. And what else do you want? Just tell me."
        - id: ch04-b35
          speaker: narrator
          text: He pressed the box into her unwilling hands.
        - id: ch04-b36
          speaker: little_girl
          text: "But I don't have any more money."
        - id: ch04-b37
          speaker: william
          text: "Money doesn't matter. Everything's terribly cheap today. For four pennies, you can have anything you want."
        - id: ch04-b38
          speaker: little_girl
          text: "Because it's New Year's Day?"
        - id: ch04-b39
          speaker: william
          text: "Yes. That's why."
        - id: ch04-b40
          speaker: little_girl
          text: "Is this your shop?"
        - id: ch04-b41
          speaker: william
          text: "Yes. The whole shop is mine."
        - id: ch04-b42
          speaker: narrator
          text: She looked at him with admiration and envy.
        - id: ch04-b43
          speaker: little_girl
          text: "I wish I had a sweet shop."
        - id: ch04-b44
          speaker: william
          text: "Take anything you like."
        - id: ch04-b45
          speaker: narrator
          text: She gathered all she could carry and headed for the door.
        - id: ch04-b46
          speaker: little_girl
          text: "Thank you! Thank you so much!"
          emotion: happy
        - id: ch04-b47
          speaker: narrator
          text: William leaned against the door like a generous gentleman who could provide anything.
        - id: ch04-b48
          speaker: william
          text: "It's all right. Perfectly all right. Not at all. Don't mention it."
        - id: ch04-b49
          speaker: narrator
          text: At last, William ran out of polite expressions. He could think of nothing more to say, so he bowed with what he hoped was graceful elegance while she passed through the doorway. When she went by the shop window, William's flushed face opened into another enormous smile. The girl stopped, turned toward him, and blew him a kiss. William blinked, overcome by pure emotion.

            He kept smiling long after she had disappeared down the street. Then, without paying attention, he filled his mouth with Mixed Dew Drops and sat behind the counter. As he crunched, a new daydream began. First he rescued the girl in white fur from robbers. Then he saved her from pirates. Finally, he carried her out of a burning house. In his imagination, William was just leaping bravely from the roof with the girl safe in his arms when two familiar faces appeared in the real window. Ginger and Henry had flattened their noses against the glass.
    - id: ch05
      title: The End of Politeness
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: William got up and went to the door.
        - id: ch05-b02
          speaker: william
          text: "Hello, Ginger. Hello, Henry."
        - id: ch05-b03
          speaker: narrator
          text: He tried, without success, to look as though nothing special was happening. His friends stared.
        - id: ch05-b04
          speaker: william
          text: "I've got a shop. Come in and see it."
        - id: ch05-b05
          speaker: narrator
          text: Ginger and Henry did not rush straight in. They peered cautiously around the doorway first. The sight of William clearly alone and in complete possession reassured them. They stepped inside with their mouths hanging open and slowly looked from the crowded shelves to the boxes and glittering jars. Beside this treasure, Aladdin's cave was nothing.
        - id: ch05-b06
          speaker: ginger
          text: "How did you get a whole shop, William?"
        - id: ch05-b07
          speaker: william
          text: "Someone gave it to me. I took one of those resolutions to be polite, and then somebody gave me this. Help yourselves. Not at all. Go ahead, and don't mention it."
        - id: ch05-b08
          speaker: narrator
          text: They needed no second invitation. Childhood instinct, strengthened by experience, warned them that this paradise might be invaded by an angry grown-up at any moment. Ginger and Henry made full use of every second. They hurried from box to box and jar to jar, pushing handfuls of candy and chocolate into their mouths. Neither boy said a word. Under the circumstances, speech was physically impossible. They also thought wisely about the future. Whenever there was a pause in filling their mouths, they filled their pockets instead. Their foresight would have done credit to the noble ant that adults so often hold up as an example to children.

            William ate very little now. For some strange reason, the sweets around him no longer seemed inviting. He refused to admit such weakness, so every so often he casually forced down a Toasted Square or a Fruity Bit.

            Then a rough boy of about fourteen passed the window. Three small boys devouring a sweet shop caught his attention, and he stopped in the doorway.
        - id: ch05-b09
          speaker: older_boy
          text: "What do you think you're doing?"
        - id: ch05-b10
          speaker: william
          text: "Get out of my shop."
