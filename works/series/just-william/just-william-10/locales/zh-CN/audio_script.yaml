audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    father:
      display_name: 布朗先生
      tts:
        delivery: 务实坚定，疲惫时仍保持威严
        timbre: 沉稳厚实的成年男声
        pace: 中速
        pitch: 中低音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负急躁，对弟弟毫不客气
        timbre: 平滑的青年男声
        pace: 中速偏快
        pitch: 中音
    mr_moss:
      display_name: 莫斯先生
      tts:
        delivery: 和气厚道，发愁时沉重，欢喜时忘乎所以
        timbre: 略带沙哑的成年男声
        pace: 中速
        pitch: 中低音
    messenger_boy:
      display_name: 送信男孩
      tts:
        delivery: 生硬直白，受惊时反应迟钝
        timbre: 稚嫩的男孩声
        pace: 中速
        pitch: 中高音
    thin_customer:
      display_name: 瘦太太
      tts:
        delivery: 冷峻挑剔，发怒时尖刻逼人
        timbre: 干涩锐利的成年女声
        pace: 中速偏快
        pitch: 中高音
    girl_in_white:
      display_name: 白衣小姑娘
      tts:
        delivery: 文静有礼，困惑时仍轻声细语
        timbre: 清澈甜润的女孩声
        pace: 舒缓
        pitch: 高音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    rough_boy:
      display_name: 粗野男孩
      tts:
        delivery: 蛮横挑衅，句句带着威吓
        timbre: 粗哑的少年声
        pace: 偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 新年志向
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 威廉双手插在口袋里，吹着口哨走过街头。那哨声刺耳有余，悦耳不足。听觉灵敏的人一听见，准会打着哆嗦躲开。糖果店老板莫斯先生倒没这么敏感，还朝这位常客和气地点了点头。当然，威廉只能在少得可怜的零花钱允许时光顾。受到鼓励，他便停在门口，也不吹了。
        - id: ch01-b02
          speaker: william
          text: 你好，莫斯先生！今天有便宜货吗？
        - id: ch01-b03
          speaker: mr_moss
          text: 你好，威廉。没有，最便宜的也得两便士一盎司。
        - id: ch01-b04
          speaker: william
          text: 这么贵啊。那给我两盎司，钱明天再付。
        - id: ch01-b05
          speaker: mr_moss
          text: 现在还有什么不贵？你倒说说看，什么东西不贵？可本店只收现钱，小先生，一手交钱，一手交货。不过明天称糖时，我可以多添几颗，送你当新年礼物。
        - id: ch01-b06
          speaker: william
          text: 真说定了？那现在就给我吧。
        - id: ch01-b07
          speaker: mr_moss
          text: 现在给了，怎么还能算新年礼物？
        - id: ch01-b08
          speaker: narrator
          text: 威廉认真想了想。
        - id: ch01-b09
          speaker: william
          text: 我今天把糖吃掉，明天再想着它们。这样不就算新年礼物了吗？
        - id: ch01-b10
          speaker: narrator
          text: 莫斯先生抓了一把什锦水果糖递给他。威廉满怀感激地接过来。
        - id: ch01-b11
          speaker: mr_moss
          text: 那你明天打算立什么好志向？
        - id: ch01-b12
          speaker: narrator
          text: 威廉一声不响地嚼了一会儿。
        - id: ch01-b13
          speaker: william
          text: 什么好志向？我没有啊。
        - id: ch01-b14
          speaker: mr_moss
          text: 元旦人人都得立一个。找出自己想改的毛病，明天就开始改。
        - id: ch01-b15
          speaker: william
          text: 就像大斋期喝茶不放糖，还有牛津剑桥赛艇那天穿蓝衣服？那我想不出来。你替我想吧。
        - id: ch01-b16
          speaker: mr_moss
          text: 你可以好好做功课。
        - id: ch01-b17
          speaker: william
          text: 那可不行，多没劲啊！天哪，肯定没劲。
        - id: ch01-b18
          speaker: mr_moss
          text: 那就把衣服弄得整整洁洁。或者别再大喊大叫，也别吹口哨。
        - id: ch01-b19
          speaker: narrator
          text: 威廉想到整洁就打了个寒战。他又塞了两颗糖，坚决摇头。
        - id: ch01-b20
          speaker: william
          text: 天哪，那也不行！
        - id: ch01-b21
          speaker: mr_moss
          text: 那就对人有礼貌。常说“请”和“谢谢”，还可以说“您若不介意我这么讲”“请原谅我反驳您”，或者“有什么我能效劳的吗”。
        - id: ch01-b22
          speaker: narrator
          text: 这个主意打动了威廉。他理理衣领，站得笔直。
        - id: ch01-b23
          speaker: william
          text: 这个倒可以试试。我就试着讲礼貌。可要坚持多久？
        - id: ch01-b24
          speaker: mr_moss
          text: 不会太久。通常只坚持元旦那一天，第二天大家就放弃了。
        - id: ch01-b25
          speaker: william
          text: 那你的志向是什么？
        - id: ch01-b26
          speaker: narrator
          text: 他的问题还没说完，又一口塞进四颗糖。莫斯先生没有马上回答，而是像在策划一桩秘密行动似的环顾小店。确定四周没人留意，他才凑过身来，把声音压得很低。
        - id: ch01-b27
          speaker: mr_moss
          text: 我打算再向她求一次。十年来，每个元旦我都求她一回。
        - id: ch01-b28
          speaker: william
          text: 求谁？求她什么？
        - id: ch01-b29
          speaker: mr_moss
          text: 当然是求她要我。
        - id: ch01-b30
          speaker: william
          text: 要你去哪儿？你自己不能去吗？
        - id: ch01-b31
          speaker: mr_moss
          text: 我是求她嫁给我。
        - id: ch01-b32
          speaker: narrator
          text: 莫斯先生说完，脸微微红了。威廉伤心地看着手里最后一颗糖，然后摆出裁判官的架势，认真替他分析起来。
        - id: ch01-b33
          speaker: william
          text: 换作我，才不会十年都问同一个人。我会一个个问过去，总能找到一个不嫌弃你的。再说你还有糖果店呢。她知道吗？她要是知道还不答应，那准是个傻瓜。
        - id: ch01-b34
          speaker: narrator
          text: 莫斯先生只叹了口气，心不在焉又满怀忧伤地往嘴里丢了一颗牛眼糖。
    - id: ch02
      title: 礼貌的一家人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，威廉带着一脸凛然的决心跳下床。
        - id: ch02-b02
          speaker: william
          text: 我要讲礼貌。今天一整天都讲礼貌。
        - id: ch02-b03
          speaker: narrator
          text: 他向卧室里的家具郑重宣布完，便下楼吃早饭。在楼梯上，他遇见了父亲。
        - id: ch02-b04
          speaker: william
          text: 早安，爸爸。今天有什么我能为您效劳的吗？
        - id: ch02-b05
          speaker: narrator
          text: 他自以为这一句彬彬有礼。布朗先生却狐疑地低头看他。
        - id: ch02-b06
          speaker: father
          text: 你这回又想要什么？
        - id: ch02-b07
          speaker: william
          text: 我什么也不要，只是在讲礼貌。这是元旦要立的那种志向。我决定讲礼貌。
        - id: ch02-b08
          speaker: father
          text: 对不起。你知道，我还真不习惯。刚才吓了我一跳。
        - id: ch02-b09
          speaker: narrator
          text: 到了早餐桌上，威廉的礼貌更是大放异彩。他甜蜜地询问哥哥，仿佛自己一向都这么体贴。
        - id: ch02-b10
          speaker: william
          text: 罗伯特，要我替你递什么东西吗？
        - id: ch02-b11
          speaker: narrator
          text: 罗伯特冷冷地不理他，只对着全世界开口。
        - id: ch02-b12
          speaker: robert
          text: 看样子又要下雨。
        - id: ch02-b13
          speaker: william
          text: 罗伯特，请原谅我反驳你。送奶工说今天会放晴。请原谅我反驳你。
        - id: ch02-b14
          speaker: robert
          text: 喂！少拿这套来烦我！
          emotion: angry
        - id: ch02-b15
          speaker: william
          text: 这家里压根没人懂礼貌。一个人在这儿讲上好几年，你们也看不出他在干什么。
        - id: ch02-b16
          speaker: narrator
          text: 布朗太太忧心忡忡地望着他。
        - id: ch02-b17
          speaker: mother
          text: 亲爱的，你没有不舒服吧？头不疼，也没有哪里难受？
        - id: ch02-b18
          speaker: william
          text: 没有，我只是在讲礼貌。
        - id: ch02-b19
          speaker: narrator
          text: 他答得很不耐烦，忽然想起自己的志向，赶紧收住脾气。
        - id: ch02-b20
          speaker: william
          text: 我很好，谢谢您，亲爱的妈妈。
        - id: ch02-b21
          speaker: robert
          text: 疼得很厉害吗？
        - id: ch02-b22
          speaker: william
          text: 一点也不疼，谢谢你，罗伯特。
        - id: ch02-b23
          speaker: narrator
          text: 早饭后，他用无比感激的态度领了零花钱。
        - id: ch02-b24
          speaker: william
          text: 非常感谢您，爸爸。
        - id: ch02-b25
          speaker: father
          text: 不用谢，千万别客气。没什么，完全没什么。可这实在太折磨人了，还要持续多久？
        - id: ch02-b26
          speaker: william
          text: 什么持续多久？
        - id: ch02-b27
          speaker: father
          text: 你的志向。
        - id: ch02-b28
          speaker: william
          text: 噢，你说讲礼貌。他说大家一般过了第一天就不干了。
        - id: ch02-b29
          speaker: father
          text: 不管那人是谁，他说得一点不错。一般都会放弃。
        - id: ch02-b30
          speaker: william
          text: 他今天又去求她了。
        - id: ch02-b31
          speaker: father
          text: 谁要向谁求什么？
        - id: ch02-b32
          speaker: narrator
          text: 可威廉已经出了门，没有留下来解释谁是谁。他正赶往莫斯先生的糖果店。
    - id: ch03
      title: 一家糖果店
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 莫斯先生戴着帽子，穿着外套，站在店门口焦急地望着街那头。他掏出一只硕大的老式怀表。
        - id: ch03-b02
          speaker: william
          text: 早安，莫斯先生。
        - id: ch03-b03
          speaker: mr_moss
          text: 他迟到了！我快赶不上火车了。哎呀，十年来，这会是我第一次错过元旦。
        - id: ch03-b04
          speaker: narrator
          text: 威廉摆出行家的样子，把糖果细细看了一遍。
        - id: ch03-b05
          speaker: william
          text: 那些粉红色的是新品种吧？多少钱？
        - id: ch03-b06
          speaker: mr_moss
          text: 四分之一磅八便士。哎呀，我真要赶不上火车了。威廉，你肯不肯替我办件事？我送你四分之一磅那种糖。
        - id: ch03-b07
          speaker: narrator
          text: 威廉倒吸一口气。这报酬丰厚得简直不像真的。
        - id: ch03-b08
          speaker: william
          text: 给这么多，不管什么事我都肯干。
        - id: ch03-b09
          speaker: mr_moss
          text: 那你留在店里，等我侄子比尔来。他马上就到，我再不走真要误车了。我回来前由他看店。你告诉他，我为了赶火车先走了。要是他来以前有顾客，请人家等一等，或者过会儿再来。那四分之一磅糖，你自己称。
        - id: ch03-b10
          speaker: narrator
          text: 莫斯先生显然满心都是节日的喜悦。威廉掐了自己一下，确定自己还活着，没有忽然升进福地。老板又焦急地看了最后一眼怀表，这才朝车站方向匆匆赶去。
        - id: ch03-b11
          speaker: narrator
          text: 店里只剩威廉。他站在那些糖果中间，沉进玫瑰色的美梦，足足陶醉了一会儿。童年的理想，也许是每个人童年的理想，竟然实现了。他有了一家糖果店。他故意神气活现地来回踱步，仿佛每天都这样巡视自己的产业。走到半路，他停下来，把一颗黄油球丢进嘴里。标签说，这糖用的是纯正农场奶油和上等黄油。
        - id: ch03-b12
          speaker: narrator
          text: 眼前一排排亮晶晶的玻璃瓶，装着大大小小、各种颜色的糖。旁边还有一盒又一盒巧克力，摆得诱人极了。全是他的。至少他有意把自己想成店主。绕店三圈以后，他已经深信不疑，自己就是这家店的主人。
        - id: ch03-b13
          speaker: narrator
          text: 这时，一个小男孩出现在门口。威廉皱起眉头。
        - id: ch03-b14
          speaker: william
          text: 喂，你来干吗？
        - id: ch03-b15
          speaker: narrator
          text: 他猛然记起自己的志向。
        - id: ch03-b16
          speaker: william
          text: 请问，你来干吗？
        - id: ch03-b17
          speaker: messenger_boy
          text: 你叔叔呢？我家的比尔病了，今天来不了。
        - id: ch03-b18
          speaker: narrator
          text: 威廉挥挥手，像个忙碌的店主那样打发他。
        - id: ch03-b19
          speaker: william
          text: 没关系。回去告诉他们，完全没关系。明白了吗？走吧！
        - id: ch03-b20
          speaker: narrator
          text: 小男孩没有照他说的走，依旧瞪着眼站在那里，像在地上生了根。威廉只好采取更有力的办法。他往男孩一只手里塞了根甘草糖，又在另一只手里塞上一包巧克力。
        - id: ch03-b21
          speaker: william
          text: 现在快走！我不想让你留在这儿。听懂没有？快走，你这头长着驴脑袋的小牛！
        - id: ch03-b22
          speaker: narrator
          text: 威廉骂起人来，总有彻头彻尾的独创精神。那男孩瞪着眼，紧抓战利品，总算跑了。威廉冲到门口，朝他的背影大喊。
        - id: ch03-b23
          speaker: william
          text: 您若不介意我这么讲！
        - id: ch03-b24
          speaker: narrator
          text: 威廉已经把这项志向当成一尊必须不惜任何代价讨好的神。无论刚才说了多不客气的话，最后补一句礼貌用语，他便觉得自己仍然忠于它。看起来，正是这尊神赐给了他一生的梦想，一间货品齐全的糖果店。
        - id: ch03-b25
          speaker: narrator
          text: 他又巡视一圈，发现一种从没见过的新糖，名字叫椰香之吻。它只有一个毛病，实在太不牢靠，一放进嘴里马上就化。每一颗都消失得太快了。还没等威廉弄明白究竟是怎么回事，眼前就只剩一只空盒。他只好重新转去投奔更结实、更可靠的菠萝脆糖。
    - id: ch04
      title: 两位顾客
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一位看不出年纪的瘦太太走进来，打断了威廉。
        - id: ch04-b02
          speaker: thin_customer
          text: 早安。莫斯先生呢？
        - id: ch04-b03
          speaker: narrator
          text: 她的语气冷冰冰的。威廉嘴里含着五颗糖，只能拼命回答。
        - id: ch04-b04
          speaker: thin_customer
          text: 你说什么？我一个字也听不清。
        - id: ch04-b05
          speaker: narrator
          text: 她的声音更冷了。威廉取出两颗糖，暂时搁在秤上。
        - id: ch04-b06
          speaker: william
          text: 他走了。谢谢。
        - id: ch04-b07
          speaker: narrator
          text: 后面两个字，是他想起志向才含含糊糊补上的。
        - id: ch04-b08
          speaker: thin_customer
          text: 那现在谁管店？
        - id: ch04-b09
          speaker: william
          text: 我。
        - id: ch04-b10
          speaker: narrator
          text: 威廉这句回答连语法也不大对。她打量着柜台后的男孩，脸上毫不掩饰地露出不赞成的神色。
        - id: ch04-b11
          speaker: thin_customer
          text: 好吧，我要一条那种巧克力。
        - id: ch04-b12
          speaker: narrator
          text: 威廉环顾整间店，这才忽然发现，自己刚才造成的损耗着实不小。不过眼下正有一个机会，可以弥补莫斯先生原本可能遭受的损失。他低头看了看顾客所指的巧克力，标签上的原价是两便士一条。
        - id: ch04-b13
          speaker: william
          text: 一先令一条。
        - id: ch04-b14
          speaker: thin_customer
          text: 一先令？昨天明明只卖两便士！
          emotion: surprised
        - id: ch04-b15
          speaker: william
          text: 后来涨价了。请原谅我这么讲。
        - id: ch04-b16
          speaker: thin_customer
          text: 涨价？是厂家通知你涨价的吗？
        - id: ch04-b17
          speaker: william
          text: 是的，太太。
        - id: ch04-b18
          speaker: thin_customer
          text: 什么时候通知的？
        - id: ch04-b19
          speaker: william
          text: 今天早上，您若不介意我这么讲。
        - id: ch04-b20
          speaker: narrator
          text: 威廉摆出过分殷勤的礼貌模样。他越客气，那太太似乎就越生气，简直快被他气疯了。
        - id: ch04-b21
          speaker: thin_customer
          text: 通知是邮寄来的？
        - id: ch04-b22
          speaker: william
          text: 是的，太太，今天早上寄来的。
        - id: ch04-b23
          speaker: narrator
          text: 她狠狠瞪着威廉，脸上忽然露出胜利的神色。
        - id: ch04-b24
          speaker: thin_customer
          text: 我就住在街对面，你这个坏透了的小骗子。今天早上邮差根本没来过！
          emotion: angry
        - id: ch04-b25
          speaker: narrator
          text: 威廉平静地迎着她的目光。
        - id: ch04-b26
          speaker: william
          text: 不是寄来的。厂家的人夜里亲自找我了。那时候您在睡觉，当然听不见。请原谅我反驳您。
        - id: ch04-b27
          speaker: narrator
          text: 撒谎能骗过别人，已经是一项了不起的天赋。撒谎时能把自己也骗过去，那便是更加了不起的天赋。威廉所具备的，正是后一种。
        - id: ch04-b28
          speaker: thin_customer
          text: 我最多只付两便士。
        - id: ch04-b29
          speaker: narrator
          text: 她严厉地说完，自己拿起一条巧克力，再把两便士重重放在柜台上。她显然不打算接受威廉定下的新价钱。
        - id: ch04-b30
          speaker: thin_customer
          text: 我要向暴利调查委员会举报这家店。太不像话了，还编出这么一大堆恶毒的谎话！
          emotion: angry
        - id: ch04-b31
          speaker: william
          text: 我说了一先令！谁要你那两枚讨厌的破便士？
          emotion: angry
        - id: ch04-b32
          speaker: narrator
          text: 威廉一路追到门边。那太太已经在过街回家。
        - id: ch04-b33
          speaker: william
          text: 你这个老贼！您若不介意我这么讲。
          emotion: angry
        - id: ch04-b34
          speaker: thin_customer
          text: 我要叫警察抓你！你这个邪恶亵渎的小坏蛋！
          emotion: angry
        - id: ch04-b35
          speaker: narrator
          text: 威廉冲她吐了吐舌头，回店关上门。他发现只要把门打开，门铃就会响。于是他先用什锦甘草糖塞满嘴巴，然后使劲开门、关门，听铃声响个不停。他足足玩了五分钟，直到门铃的机关坏掉。为了给自己壮胆，他又吃了一通坚果足球糖，接着站到椅子上，开始毫不留情地拆卸门铃。
        - id: ch04-b36
          speaker: narrator
          text: 又一位顾客进来了。威廉把整颗坚果足球糖咽下去，赶紧回到柜台后。来的是个九岁左右的小姑娘，精致得不得了。她穿着白色皮毛外套，戴同样的帽子，脚上是长长的白色绑腿。金色鬈发垂在白毛肩头，眼睛湛蓝，双颊又软又红，嘴巴像婴儿一样。
        - id: ch04-b37
          speaker: narrator
          text: 威廉在镇上见过她好几次，却从没说过话。每回见到这梦幻般的身影，他胸膛里的心都像蜡一样融化。这次他笑得羞怯又别扭，雀斑脸一直红到短硬的发根。小姑娘完全没觉得由一个男孩看店有什么奇怪，径直走到柜台前。
        - id: ch04-b38
          speaker: girl_in_white
          text: 劳驾，我要两条两便士的巧克力。
        - id: ch04-b39
          speaker: narrator
          text: 她的声音清亮得像银铃。威廉欣喜若狂，连话也说不出来，只顾越笑越大，也越笑越傻。他忽然看见秤上还放着两块自己吃了一半的菠萝脆糖，连忙把它们塞回嘴里。等小姑娘在柜台上放下四枚便士，他总算找回了声音。
        - id: ch04-b40
          speaker: william
          text: 这些钱能买好多。现在降价了，便宜得不得了。四便士能买一整盒。
        - id: ch04-b41
          speaker: narrator
          text: 他什么也不管，把盒子硬塞进她犹豫的手里。
        - id: ch04-b42
          speaker: william
          text: 你还想要什么？告诉我。想要什么都行。
        - id: ch04-b43
          speaker: girl_in_white
          text: 可是，我没有别的钱了。
        - id: ch04-b44
          speaker: william
          text: 钱不重要。今天什么都特别便宜，四便士能买你喜欢的任何东西。随便拿。
        - id: ch04-b45
          speaker: girl_in_white
          text: 是因为今天是元旦吗？
        - id: ch04-b46
          speaker: william
          text: 对，就是因为元旦。
        - id: ch04-b47
          speaker: girl_in_white
          text: 这是你的店吗？
        - id: ch04-b48
          speaker: william
          text: 是啊，整家店都是我的。
        - id: ch04-b49
          speaker: narrator
          text: 她又羡慕又钦佩地望着他。
        - id: ch04-b50
          speaker: girl_in_white
          text: 我真希望自己也有一家糖果店。
        - id: ch04-b51
          speaker: william
          text: 那你喜欢什么就拿什么。
        - id: ch04-b52
          speaker: narrator
          text: 她尽力抱起能拿走的一切，朝门口走去。
        - id: ch04-b53
          speaker: girl_in_white
          text: 谢谢你，真是太谢谢你了！
          emotion: happy
        - id: ch04-b54
          speaker: narrator
          text: 威廉靠在门边，摆出心地宽厚、有求必应的男子汉才有的潇洒姿势。
        - id: ch04-b55
          speaker: william
          text: 没关系，完全没关系。不用谢，千万别客气。完全没什么。
        - id: ch04-b56
          speaker: narrator
          text: 他终于停下来，只因为再也想不出别的客套话。小姑娘走出店门时，他还装模作样地优雅鞠了一躬。她经过橱窗，威廉用一张涨得通红的脸送上灿烂又热情的笑容。她停住脚步，朝他送了一个飞吻。威廉被这纯粹的感动弄得直眨眼。
        - id: ch04-b57
          speaker: narrator
          text: 那位接受笑容的人早已从街上消失，威廉却还站在原地微笑。过了一会儿，他才回到柜台后，心不在焉地抓起一把什锦露珠糖塞进嘴里，然后坐了下来。
    - id: ch05
      title: 店主回来了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 威廉一边嚼什锦露珠糖，一边做起白日梦。在那些梦里，危险总是接连不断，而他每回都是英雄。他一次次从强盗手里、海盗船上和着火的房子里救出那个穿白色皮毛外套的小姑娘。梦里，他正抱着她，从燃烧的屋顶灵巧地跳下来，忽然看见两个朋友把鼻子压扁在橱窗玻璃上。他只好离开白日梦，站起来走到门口。
        - id: ch05-b02
          speaker: william
          text: 你好，姜吉！你好，亨利！
        - id: ch05-b03
          speaker: narrator
          text: 他努力装得若无其事，可惜没能成功。两个男孩惊奇地望着他。
        - id: ch05-b04
          speaker: william
          text: 我有一家店了。进来看看吧。
        - id: ch05-b05
          speaker: narrator
          text: 他们从门边小心翼翼地探头张望。看见威廉确实独自占据整家店，这才放下心来，张大嘴走了进去。他们盯着一盒盒、一瓶瓶糖果，几乎不敢相信自己的眼睛。阿拉丁的宝洞跟这里一比，根本算不了什么。
        - id: ch05-b06
          speaker: ginger
          text: 威廉，你是怎么弄到这家店的？
        - id: ch05-b07
          speaker: william
          text: 有人送我的。我立了一个讲礼貌的什么志向，于是人家就把店送我了。吃吧，随便拿。不用谢，千万别客气。
        - id: ch05-b08
          speaker: narrator
          text: 两个人根本不需要再请第二遍。孩童的本能从不会错，其中也少不了过去经验的支持。他们知道，随时可能有一个大人化身复仇天使，闯进这座伊甸园，所以必须把握住每一刻。他们从一只盒子吃到另一只盒子，一把又一把地把糖果和巧克力塞进嘴里。
        - id: ch05-b09
          speaker: narrator
          text: 他们一句话也不说，因为嘴里塞成这样，生理上实在没法说话。两人把握每一个不往嘴里送糖的空隙，将糖果不停装进口袋，直到每只口袋都鼓了起来。他们是在替将来做打算。这份远见，完全比得上常被拿来教育孩子的高尚蚂蚁。
        - id: ch05-b10
          speaker: narrator
          text: 要是有人观察得仔细，就会发现威廉现在已经吃得很少了。其实有那么一阵，他自己也察觉到，周围明明全是诱人的美味，他却莫名其妙地产生了一种冷淡的感情。不过他不愿向这份软弱投降，隔一会儿还是装作若无其事，往嘴里放一块烤香方糖或果味糖粒。
        - id: ch05-b11
          speaker: narrator
          text: 恰好有个十四岁左右、模样粗野的男孩从店门前经过。他往里面一看，发现三个小男孩正在飞快地消灭店里的东西，顿时来了兴趣，停下脚步站在门口。
        - id: ch05-b12
          speaker: rough_boy
          text: 你们在里面干什么？
        - id: ch05-b13
          speaker: narrator
          text: 他站在门口，语气倒像是来主持正义的。
        - id: ch05-b14
          speaker: william
          text: 滚出我的店。
        - id: ch05-b15
          speaker: rough_boy
          text: 你的店？我看得清清楚楚，你们在偷别人店里的糖。喂，也分我一点。
        - id: ch05-b16
          speaker: william
          text: 你给我滚出去！
        - id: ch05-b17
          speaker: rough_boy
          text: 你才该滚出去！
        - id: ch05-b18
          speaker: william
          text: 要不是我立志讲礼貌，早就把你揍趴下了。
        - id: ch05-b19
          speaker: rough_boy
          text: 是吗？你真有这个本事？
        - id: ch05-b20
          speaker: narrator
          text: 他边说边卷起袖子。
        - id: ch05-b21
          speaker: william
          text: 当然有。你给我滚。
        - id: ch05-b22
          speaker: narrator
          text: 威廉抓起离手最近的瓶子，里面恰好是酸味硬糖。他朝那男孩的脑袋射去，一颗正中眼睛。对方退到街上，威廉斗志如火，追出去使出全身力气继续投掷。
        - id: ch05-b23
          speaker: narrator
          text: 街上的动静很快引来一群男孩。他们围拢过来，有的弯腰从阴沟里捡糖，有的干脆加入混战。威廉、亨利和姜吉以少敌多，打了一场英勇的战斗。
        - id: ch05-b24
          speaker: narrator
          text: 直到糖果店老板沿着人行道快步赶来，这场战斗才终于结束。街上的男孩带着他们能捡到的全部战利品，朝一个方向逃走。姜吉和亨利则朝另一个方向跑了。威廉没有跟着朋友逃跑。他把一只空空的酸味硬糖瓶紧抱在胸前，独自留在原地，等着面对快步走来的莫斯先生。
        - id: ch05-b25
          speaker: narrator
          text: 莫斯先生跨进店门。他先看看威廉怀里的空瓶子，又看看几乎被洗劫一空的货架，脸上满是茫然。他环顾四周之后，最先问的却不是糖果。
        - id: ch05-b26
          speaker: mr_moss
          text: 比尔呢？
        - id: ch05-b27
          speaker: william
          text: 他病了，来不了。我一直替你看店，已经尽力了。
        - id: ch05-b28
          speaker: narrator
          text: 威廉看看遭到洗劫的店铺，赶紧设法安抚老板。
        - id: ch05-b29
          speaker: william
          text: 我还替你收了点钱。
        - id: ch05-b30
          speaker: narrator
          text: 他指着四枚便士，那就是整个上午的营业收入。
        - id: ch05-b31
          speaker: william
          text: 钱不算多。
        - id: ch05-b32
          speaker: narrator
          text: 这倒是实话。他再次望向店里，一排排盒子已经空了，许多瓶子也只剩一半。地上更是一片狼藉，无论何时何地，只要打过一仗，总免不了这副景象。可莫斯先生几乎没有留意。
        - id: ch05-b33
          speaker: mr_moss
          text: 谢谢你，威廉。她要我了！她肯嫁给我。是不是太棒了？这么多年，她终于答应了！
          emotion: happy
        - id: ch05-b34
          speaker: william
          text: 店里恐怕有点乱。
        - id: ch05-b35
          speaker: narrator
          text: 莫斯先生只是挥挥手，不让威廉再为眼前的景象道歉。他的心思显然根本不在店里。
        - id: ch05-b36
          speaker: mr_moss
          text: 没关系，威廉。今天什么都不要紧。她终于要我了！下午我要关店，再去看她。谢谢你留下来看店。
          emotion: happy
        - id: ch05-b37
          speaker: william
          text: 不用谢，千万别客气。我觉得礼貌也讲得够久了。今年只讲一上午，您看行吗？
        - id: ch05-b38
          speaker: mr_moss
          text: 呃，行吧。好，我要关店了。你也别留着，该回家吃午饭了。
        - id: ch05-b39
          speaker: narrator
          text: 午饭？威廉十分确定，自己一点也不想吃午饭。一想到午饭，他身体里便涌起一股实实在在的不适，远远不只是没有胃口那么简单。他决定尽快回家，却绝不是回去吃饭。
        - id: ch05-b40
          speaker: william
          text: 再见。
        - id: ch05-b41
          speaker: mr_moss
          text: 再见。
        - id: ch05-b42
          speaker: william
          text: 恐怕有些东西不见了。刚才来了几个男孩。
        - id: ch05-b43
          speaker: mr_moss
          text: 没关系，威廉，完全没关系。
        - id: ch05-b44
          speaker: narrator
          text: 莫斯先生说着，又回到自己的玫瑰色美梦里。可是威廉一点也不好。读者啊，假如你十一岁时也曾独自掌管一家糖果店整整一个上午，而且想吃什么就吃什么，你会安然无恙吗？我看不会。
        - id: ch05-b45
          speaker: narrator
          text: 至于威廉在那个下午所经历的屈辱，我们就不再跟去了。让我们在这里同他分别吧。他脸色苍白，脚步不稳，却还控制得住局面，正缓缓走在回家的路上。
