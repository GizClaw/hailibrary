audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着克制的调侃
        timbre: 温暖清亮
        pace: 舒展而富于变化
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 倔强直接，认真得近乎理直气壮
        timbre: 清脆的男孩声
        pace: 偏快
        pitch: 中高音
    mother:
      display_name: 布朗太太
      tts:
        delivery: 平静温和，总能淡然接住家人的抱怨
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    robert:
      display_name: 罗伯特
      tts:
        delivery: 自负急躁，对弟弟毫不客气
        timbre: 平滑的青年男声
        pace: 中速偏快
        pitch: 中音
    henry:
      display_name: 亨利
      tts:
        delivery: 好胜老练，质疑别人时毫不客气
        timbre: 稍显低沉的男孩声
        pace: 中速偏快
        pitch: 中音
    ginger:
      display_name: 姜吉
      tts:
        delivery: 活泼直率，受了委屈就马上抱怨
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中高音
    douglas:
      display_name: 道格拉斯
      tts:
        delivery: 热心随和，偶尔故作老成
        timbre: 清亮的男孩声
        pace: 中速
        pitch: 中高音
    baby:
      display_name: 宝宝
      tts:
        delivery: 天真含混，兴奋时咿呀不断
        timbre: 稚嫩柔软的幼儿声
        pace: 缓慢而跳跃
        pitch: 高音
    outlaw:
      display_name: 亡命徒伙伴
      tts:
        delivery: 直率警觉，遇到意外便脱口而出
        timbre: 清亮的男孩声
        pace: 中速偏快
        pitch: 中高音
    small_boy:
      display_name: 小男孩
      tts:
        delivery: 淘气强硬，争抢时毫不示弱
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 高音
    mrs_butler:
      display_name: 巴特勒太太
      tts:
        delivery: 客气亲切，对眼前情形毫无防备
        timbre: 柔和的成年女声
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 半日假的差事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 下午学校放半天假。威廉在卧室里认真做着出门的准备。壁炉台上放着他从食品储藏室里成功夺来的半块蛋糕，还有一瓶甘草水。这种水只要拿一块甘草放进清水里，使劲摇一摇就成了。“亡命徒”们很爱喝它，威廉也是这伙人中的一员。每到半日假，他们便偷偷去一座废谷仓聚会，那里离威廉家大约四分之一英里。
        - id: ch01-b02
          speaker: narrator
          text: 这伙亡命徒目前做过的事，无非是摔跤、寻找冒险，还有烹饪。上星期厨娘夜里外出，威廉便趁机从食品储藏室拿走两根香肠。他把香肠贴着皮肉藏在衬衫下面，一直带去了谷仓。他们所谓的烹饪，是把香肠架在一堆冒烟的火上，直到两根都彻底变黑，随后又把那两截焦炭一样的残骸吃得津津有味。所以，说他们“烧过”香肠，实在已经很客气了。
        - id: ch01-b03
          speaker: narrator
          text: 威廉把甘草水塞进一个口袋，半块蛋糕放进另一个，正打算按惯常的秘密路线离家。他要先钻出浴室窗户，爬下洗涤间屋顶，再用两手轮流抓着水管，一点点落进后花园。即使身上没带偷来的半块蛋糕，他也无限偏爱这条路线，绝不愿简简单单从前门走出去。可他刚踏上楼梯平台，便听见门厅的门开了又关，随后响起母亲热烈的欢迎声。
        - id: ch01-b04
          speaker: mother
          text: 亲爱的，你总算来啦，我太高兴了！这就是宝宝吗？真是个小乖乖！来，让我看看，小宝宝好不好呀？咕——咕——咕。
        - id: ch01-b05
          speaker: william
          text: 哎呀，糟了！
        - id: ch01-b06
          speaker: narrator
          text: 他赶忙退回卧室，坐在床上等外面安静。可没多久，脚步声便上了楼。母亲走进来，告诉他巴特勒太太带着宝宝来过下午。她们本来约好推宝宝出去，一直逛到喝茶时间，可巴特勒太太头疼得厉害，母亲坚持让她躺在客厅里休息。偏偏她又担心，天气这么好，宝宝却没法出去。
        - id: ch01-b07
          speaker: william
          text: 哦。
        - id: ch01-b08
          speaker: mother
          text: 厨娘出门了，艾玛还得准备茶点、照应门铃，埃塞尔也不在。我已经告诉巴特勒太太，你一定愿意推宝宝出去转一小会儿。
        - id: ch01-b09
          speaker: narrator
          text: 威廉说不出话，只管瞪着母亲。他脸上的惊恐，连传说中的美杜莎见了也要甘拜下风。他舔了舔嘴唇，嗓音都哑了。
        - id: ch01-b10
          speaker: william
          text: 我？是我？你要我推着婴儿车，带一个宝宝出去？
          emotion: surprised
        - id: ch01-b11
          speaker: mother
          text: 我知道今天是你的半日假。可你本来就要去户外呼吸新鲜空气，这才最要紧。宝宝很乖，婴儿车也不重。你肯帮忙，巴特勒太太一定特别感激。
        - id: ch01-b12
          speaker: william
          text: 她当然该感激我。我要真肯推着婴儿车带宝宝出去，她可太该感激我了。
        - id: ch01-b13
          speaker: mother
          text: 威廉，你是愿意帮忙的。可怜的巴特勒太太头疼得那么厉害，你总不想让父亲听说，连这么点小事你都不肯做吧？
        - id: ch01-b14
          speaker: william
          text: 这么点小事！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 命运已经从四面八方围住了他。威廉心里明白，除非做完别人强塞给他的这件可怕差事，否则家里绝不会让他安生。他悲伤又不情愿，却只能向逃不开的命运低头。
        - id: ch01-b16
          speaker: william
          text: 好吧，我一会儿就下去。
        - id: ch01-b17
          speaker: narrator
          text: 门厅里的人还在忙着照料宝宝。随后，哥哥罗伯特的声音传了上来。他已经十八岁，一开口便带着压倒一切的优越感。
        - id: ch01-b18
          speaker: robert
          text: 妈妈，你不是真的要把那个孩子交给威廉吧？
        - id: ch01-b19
          speaker: mother
          text: 总得有人带宝宝出去。今天天气这样好，威廉还肯牺牲半日假来帮忙，真是难得。再说，她头疼得非常厉害。
        - id: ch01-b20
          speaker: robert
          text: 那当然。反正你跟我一样了解威廉。
        - id: ch01-b21
          speaker: narrator
          text: 罗伯特这副口气，表示从此出了什么事都跟他无关。布朗太太叹了气，怪他把安排妥当的事说得一无是处，又问他愿不愿意亲自带宝宝出去。罗伯特立刻退进餐厅，隔得远远的才肯接着说。
        - id: ch01-b22
          speaker: robert
          text: 我可不想带他出去，谢谢！我没挑毛病，只是说了一个事实。你明明跟我一样了解威廉。
        - id: ch01-b23
          speaker: narrator
          text: 威廉下楼以后，母亲告诉他，宝宝已经收拾妥当了。他不用走远，愿意的话，只在这条路上来回推一推就行，只是必须等到喝茶时间再回来。接着，她又冲着宝宝说起甜腻腻的儿语，先夸宝宝多可爱，再夸“威利小宝贝”多乖，会带他出去玩，让他的妈妈睡觉觉。威廉纯粹因为羞耻，涨得满脸通红。
        - id: ch01-b24
          speaker: narrator
          text: 他把车推到路尽头，又转过街角。早期殉道者受的那些苦，跟他此刻的感受一比，简直算是享福。一个堂堂亡命徒，竟要这样度过下午！他害怕遇见同伙，叫他们看到自己推着婴儿车。可他们的聚会地点又像磁石一样，怎么也抵挡不住。威廉把车推出大路，沿着乡间小道来到那片田野。他在篱笆梯前停住，隔着田野眼巴巴望着他们视为圣地的谷仓。宝宝坐着吮大拇指，盯了他一阵，终于主动说起话来。
        - id: ch01-b25
          speaker: baby
          text: 叭啦——叭啦——叭啦——噗噜——噗噜——噗噜！
        - id: ch01-b26
          speaker: william
          text: 你给我闭嘴！
        - id: ch01-b27
          speaker: narrator
          text: 宝宝大概嫌车子停得太久，忽然抓住盖布，从钩子上扯下来，扔到了路上。威廉弯腰去捡，枕头又飞到了他头顶，宝宝还为自己的杰作咯咯直笑。威廉对他的反感越来越强。就在这时，一个伟大的主意来了，威廉的脸也亮起来。他从口袋里掏出绳子，把车牢牢系在栏杆上，再小心抱出宝宝，带着他翻过篱笆梯，直奔谷仓。他两臂紧紧圈住宝宝的腰，把人抱在胸前。宝宝两脚悬空，一路踢他的肚子、揪他的头发，还把手指往他眼睛里戳。
        - id: ch01-b28
          speaker: william
          text: 真不知道人家喜欢宝宝什么！他们又抓又踢，还戳人的眼睛，恨不得把头发全揪下来！
    - id: ch02
      title: 一桩绑架
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 威廉抱着宝宝走进谷仓，里面立刻安静下来。
        - id: ch02-b02
          speaker: outlaw
          text: 你带来的是什么呀？
        - id: ch02-b03
          speaker: william
          text: 我绑架了他。我们能拿他换赎金。
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 伙伴们又敬畏又钦佩地看着威廉。这才是亡命徒事业的巅峰。威廉把宝宝放在地上。他摇摇晃晃走了几步，接着猛然坐下，那一下又重又突然。随后，他定定望住在场最高的道格拉斯，脸上绽开一个天使般的微笑。
        - id: ch02-b05
          speaker: baby
          text: 爸——爸——爸——爸——爸！
          emotion: happy
        - id: ch02-b06
          speaker: douglas
          text: 他以为我是他爸爸。
        - id: ch02-b07
          speaker: narrator
          text: 道格拉斯难为情地咧嘴笑了，解释时却很得意。亨利一直同威廉争夺首领位置，这会儿先问接下来该怎么办。
        - id: ch02-b08
          speaker: ginger
          text: 故事里的亡命徒会给他家里写封信，告诉他们要交多少赎金。
        - id: ch02-b09
          speaker: william
          text: 我们暂时不写。
        - id: ch02-b10
          speaker: ginger
          text: 绑了人却不告诉人家要付钱，哪还能叫索要赎金？这根本没道理。
        - id: ch02-b11
          speaker: william
          text: 是没错，可是谁带了纸和铅笔？我只是说了一个事实。到底谁带了？
        - id: ch02-b12
          speaker: narrator
          text: 谁也没出声。威廉得意了，叫姜吉不用纸笔也写一封给大家看看。
        - id: ch02-b13
          speaker: ginger
          text: 从前的亡命徒肯定没有纸和铅笔，那时候还没发明。他们大概写在树叶或者别的什么东西上。
        - id: ch02-b14
          speaker: william
          text: 那你就写在树叶上。谁也没拦你。我只是说了一个事实，你写吧。
        - id: ch02-b15
          speaker: narrator
          text: 道格拉斯忽然疼得大叫，打断了这场争论。宝宝这么快就把他当成父亲，实在叫他受宠若惊，他便壮着胆子，想跟这位新认的孩子再亲近一些。他模糊记得母亲平常对待婴儿的办法，于是把一根手指伸进宝宝嘴里。偏偏宝宝已经长出四颗门牙，上面两颗，下面两颗。牙齿一合，简直像老虎钳夹住了手指。道格拉斯抽回手，仔细检查起那两排深深的牙印。
        - id: ch02-b16
          speaker: douglas
          text: 你们看，咬得多深！都快到骨头了。威廉，你带来的这个宝宝可真凶。
        - id: ch02-b17
          speaker: william
          text: 我当然知道。是你自己非要碰他。只要别招惹他，他就没事。再说，他是我带来的，我可没准你随便摆弄。我敢说他绝不咬我。
        - id: ch02-b18
          speaker: henry
          text: 那么赎金呢？
        - id: ch02-b19
          speaker: ginger
          text: 派个人去告诉他家里，再把赎金带回来。
        - id: ch02-b20
          speaker: narrator
          text: 大家安静片刻。道格拉斯把受伤的手指从嘴里拿出来，只问了一句。
        - id: ch02-b21
          speaker: douglas
          text: 谁去？
        - id: ch02-b22
          speaker: henry
          text: 宝宝是威廉带来的。
        - id: ch02-b23
          speaker: william
          text: 所以我的那份已经干完了。
        - id: ch02-b24
          speaker: henry
          text: 别人能怎么办？难道挨家挨户地问，谁家丢了宝宝，肯不肯拿赎金来换？你才知道他是从哪儿来的，当然该由你去。
        - id: ch02-b25
          speaker: william
          text: 我能去，可我就是不去。我只是说个事实。谁要说我不敢去，我就跟他打架。
        - id: ch02-b26
          speaker: narrator
          text: 没有人说他不敢。这件事明摆着，确实用不着再说。亨利赶紧换了话题，问起宴会的食物。大家一样一样摆出来。威廉拿出甘草水和半块蛋糕，道格拉斯有两片生火腿和一块狗饼干，姜吉带来爆米花，还有用报纸包着的几个冷煮土豆。亨利则拿出一只冷苹果团子，外加一小瓶煤油。
        - id: ch02-b27
          speaker: henry
          text: 雨后木柴肯定是湿的，这瓶煤油能帮我们生火。很有道理吧？
        - id: ch02-b28
          speaker: ginger
          text: 可真正能烤的，只有那两片火腿。
        - id: ch02-b29
          speaker: william
          text: 土豆和团子也能烤，它们看着根本没熟透。先把吃的放在地上，我们分头出去找冒险，一刻钟以后回来。
        - id: ch02-b30
          speaker: narrator
          text: 每次聚会，亡命徒都会用一部分下午各自寻找冒险。到目前为止，他们追求危险女神的主要办法，就是闯进坏脾气的农场主的土地，希望对方发现以后追出来。这个愿望通常都能实现。他们把全部食物堆在谷仓角落的地上。那位“肉票”正坐在旁边，快活地嚼着自己的帽带。几个人看他一眼，便分别出发，出门时还仔细关紧了门。
        - id: ch02-b31
          speaker: narrator
          text: 一刻钟后，姜吉和威廉从相反的两个方向同时回到门口。两个人一问，都没有找到冒险，于是决定先点起那堆老火。他们推门走进谷仓，只见宝宝坐在物资中间。准确地说，是坐在物资剩下来的东西中间。煤油从他的头发、脸和胳膊一直沾到衣服和脚，整个人都浸透了。空瓶和帽子躺在一旁，冷煮土豆又和煤油混在一起，糊了他满身。他手里还牢牢举着苹果团子。
        - id: ch02-b32
          speaker: baby
          text: 球！
          emotion: happy
        - id: ch02-b33
          speaker: narrator
          text: 宝宝躲在土豆和煤油做成的面具后面，兴奋极了。他举着那只苹果团子，仿佛自己的所作所为再正常不过。两个男孩站在原地看了足足一分钟，谁也没说话。最后，姜吉把恼火的目光转向那只空煤油瓶。
        - id: ch02-b34
          speaker: ginger
          text: 煤油没了，现在拿什么生火？
        - id: ch02-b35
          speaker: william
          text: 是啊。这个样子的宝宝，又该由谁送回去？我只是说了一个事实，谁送他回家？
        - id: ch02-b36
          speaker: narrator
          text: 威廉偶尔肯降低身份，从家人那里借来一句口头禅，总会把它用得没完没了。姜吉提醒他，这些事都是宝宝自己干的，根本不能怪别人。威廉承认姜吉说得没错，可这恰恰是大人永远看不到的一点。不管怎样，他决定先把宝宝的脸洗干净。
        - id: ch02-b37
          speaker: ginger
          text: 你拿什么洗？
        - id: ch02-b38
          speaker: narrator
          text: 威廉掏出脏手帕，拔开那瓶没人碰过的甘草水。
        - id: ch02-b39
          speaker: ginger
          text: 你真要用那种脏水洗他？
        - id: ch02-b40
          speaker: william
          text: 这是水做的，还是我亲手用干净的水做的，我当然知道。人家洗东西不就是用干净的水吗？
        - id: ch02-b41
          speaker: ginger
          text: 那我们喝什么？宝宝已经糟蹋了土豆、苹果团子和煤油，你还要把甘草水也给他用掉！
        - id: ch02-b42
          speaker: narrator
          text: 威廉拿甘草水沾湿手帕，在宝宝脸上擦来擦去。宝宝一口咬住手帕角，死活不放。
        - id: ch02-b43
          speaker: william
          text: 要是你非得把这样的宝宝带回家，你就不会还惦记着喝甘草水。我只是说——
        - id: ch02-b44
          speaker: ginger
          text: 你别再说这句话了！我已经听够了！
          emotion: angry
    - id: ch03
      title: 亨利的母牛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，谷仓门猛地打开，一头大母牛慢吞吞走了进来，亨利和道格拉斯紧随其后。亨利整张脸都闪着胜利的光。他原本的威望被威廉那场绑架壮举压了下去，如今带回这样一件战利品，他觉得自己总算扳回一局，又能让伙伴们刮目相看了。
        - id: ch03-b02
          speaker: henry
          text: 我带来一头牛！我从利顿农场主的地里牵来的，路上隔了五片田，可费了大力气。
          emotion: happy
        - id: ch03-b03
          speaker: william
          text: 牵来干什么？
        - id: ch03-b04
          speaker: henry
          text: 你肯定没读过多少亡命徒的故事。他们总会从附近把牲口赶回营地。
        - id: ch03-b05
          speaker: william
          text: 可到底有什么用？
        - id: ch03-b06
          speaker: narrator
          text: 威廉一面问，一面还在跟宝宝争夺手帕。亨利这才没什么底气地说，大概可以杀掉母牛，把它烤来吃。
        - id: ch03-b07
          speaker: william
          text: 那你就杀呀，再把它烤了。谁也没拦你。然后你就等着因为谋杀罪被绞死吧。除了屠夫以外，杀牛大概也跟杀人一样算谋杀。
        - id: ch03-b08
          speaker: narrator
          text: 母牛迈着慢吞吞的步子，带着几分不好意思的神情向那位“肉票”走去。宝宝一看见它，立即松开一直咬着的手帕，抬起脸来，露出了满心欢喜的笑容。
        - id: ch03-b09
          speaker: baby
          text: 汪汪！
          emotion: happy
        - id: ch03-b10
          speaker: douglas
          text: 先不管这些，我们开宴会吧。
        - id: ch03-b11
          speaker: ginger
          text: 还开什么宴会？威廉带来的宝宝把煤油和土豆全用光了，苹果团子也压扁了，威廉又拿甘草水替他洗脸。还能剩下多少东西？
        - id: ch03-b12
          speaker: narrator
          text: 亨利不动声色地审视着宝宝，俨然是一位正在断案的法官。他认定宝宝的脸确实像是拿甘草水洗过，煤油和土豆也的确叫他全用光了。照现在这副模样，宝宝恐怕换不来多少赎金。威廉他们已经差不多把他彻底弄坏了。威廉捡起那块湿手帕。它如今成了深紫褐色。他烦躁地叫大家别再谈宝宝，赶快出去生火。
        - id: ch03-b13
          speaker: narrator
          text: 他们在田里堆起细树枝，设法点燃。道格拉斯忽然担心母牛会伤着“肉票”，要威廉去看看，因为那是他的肉票。
        - id: ch03-b14
          speaker: william
          text: 那还是亨利的牛呢。它要敢跟宝宝捣乱，我倒替那头牛担心。
        - id: ch03-b15
          speaker: narrator
          text: 威廉嘴上这样说，还是不情愿地从地上站起来，猛然推开谷仓门。母牛和宝宝依然互相爱慕地望着对方。母牛嘴里垂下一条又长又湿的帽带，末端还挂着宝宝那顶帽子被嚼烂的残片。宝宝举着狗饼干，开心得直叫。母牛低下头，小心又谨慎地闻了闻饼干。威廉走进来时，母牛恰好转过身，尾巴正正打在宝宝头上。刺耳的号哭立刻响起，整伙亡命徒全冲进谷仓。
        - id: ch03-b16
          speaker: douglas
          text: 威廉，你把这个可怜的小家伙怎么了？
        - id: ch03-b17
          speaker: william
          text: 是亨利的牛打了他！别说了，你们都闭嘴吧！
        - id: ch03-b18
          speaker: narrator
          text: 宝宝哭得更凶，亨利只好扯着嗓子，压过那阵愤怒的号哭。
        - id: ch03-b19
          speaker: henry
          text: 是你把宝宝带来的，就不能让他别哭吗？连宝宝都哄不住，还把他带得到处跑，有什么道理？
        - id: ch03-b20
          speaker: narrator
          text: 宝宝的脸已经涨得发紫。几个亡命徒围成一圈，只会眼睁睁看着，谁也想不出让他停下来的办法。道格拉斯猜他可能是饿了，便从地上残余的食物中拿起半块蛋糕，试探着递到宝宝面前。哭声一下子停住了。
        - id: ch03-b21
          speaker: baby
          text: 爸——爸——爸——爸——爸。
          emotion: sad
        - id: ch03-b22
          speaker: douglas
          text: 他还是把我当爸爸。来，你想吃蛋糕吗？
        - id: ch03-b23
          speaker: narrator
          text: 道格拉斯红着脸，笑得很得意。宝宝伸手掰下一大把蛋糕，送进嘴里。道格拉斯一见他当真肯吃，兴奋得尖声喊了出来。可是宝宝认真嚼过以后，又后悔自己肯赏这个脸，于是分成好几次，把嘴里的蛋糕一点一点全吐了出来。威廉看在眼里，替他臊得脸红，只能有气无力地叫伙伴们出去看看火。
        - id: ch03-b24
          speaker: narrator
          text: 一行人离开谷仓，回到刚才生火的地方。只见母牛也出来了，嘴里仍甩着宝宝帽子的残骸。它两只前蹄稳稳踩在火堆上。那堆火不久前明明很有希望点起来，如今已经叫它彻底踩灭了。
        - id: ch03-b25
          speaker: william
          text: 快看亨利的牛！你带来的牛可真不错。连它踩灭别人的火都拦不住，还牵牛出来干什么？
        - id: ch03-b26
          speaker: narrator
          text: 一场激烈的争论过后，他们终于把注意力转向母牛。可不管怎么对它“嘘”，它都拒绝离开，只是纹丝不动地站着，反过来把他们一个个瞪得败下阵。姜吉小心靠近，轻轻推了它一下，牛尾巴立即甩进他眼里，母牛仍若无其事地嚼着帽带。威廉刚走近一步，它就低下头，吓得他赶紧退开。他们只得重新去捡一批木柴，再点一堆火。没过多久，大家便幸福地吃掉两片烤黑的火腿、爆米花和剩下的蛋糕。
        - id: ch03-b27
          speaker: narrator
          text: 宴会以后，威廉和姜吉扮成野蛮的印第安人，向谷仓发动进攻，道格拉斯和亨利负责在里面守卫。“肉票”也在谷仓里四脚着地，到处爬来爬去。他一路搜寻，发现什么宝物都要捡起来，再放进嘴里试一试滋味。偶尔，他还会爬到守卫身边，同他们认真聊上几句。每次他一靠近，那股浓烈的煤油气味也会跟着过来。
        - id: ch03-b28
          speaker: baby
          text: 叭啦——叭啦——噗噜——噗噜——爸——爸——爸——爸。咕——咕——咕。
        - id: ch03-b29
          speaker: william
          text: 我非得进攻不可。要是让我为那个宝宝打仗，我根本使不出劲。
    - id: ch04
      title: 任凭命运如何
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最后，伙伴们觉得该各自回家了。威廉绝望地看着自己负责照管的宝宝。经过这整个下午，他那副模样已经根本没法形容。威廉不知道该怎样把他交还给母亲。此后许多年，只要有人提到宝宝，他脑子里就会立刻冒出煤油和土豆，仿佛这三样东西天生便该连在一起。
        - id: ch04-b02
          speaker: william
          text: 你们帮我把他头发里的土豆弄掉吧。煤油和别的东西就别管了。
        - id: ch04-b03
          speaker: ginger
          text: 我的天，他闻起来真怪，样子也怪极了！浑身都是煤油和土豆，还粘着蛋糕渣！
        - id: ch04-b04
          speaker: william
          text: 别说了，行不行！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 母牛一路跟着他们走到篱笆梯边，却没有继续往前。几个男孩带着宝宝一个接一个翻过去时，它始终站在田里望着他们。那双眼睛里的神情，仿佛是在嘲笑这伙忙乱的亡命徒。
        - id: ch04-b06
          speaker: baby
          text: 汪汪！
        - id: ch04-b07
          speaker: narrator
          text: 宝宝满怀依恋地向母牛低声告别。威廉却没心思理会，他慌慌张张地望向四周，寻找原本系在栏杆上的婴儿车。可车子已经不见了，原来的地方空空荡荡，只有那截绳子孤零零地挂在栏杆上。
        - id: ch04-b08
          speaker: william
          text: 哎呀，糟了！这才叫倒霉！我只是说一个事实，今天真是倒霉透了！
        - id: ch04-b09
          speaker: narrator
          text: 正说着，婴儿车出现了。它装着一群小男孩，正以全速从山坡上冲下来。到了坡底，车身猛地一翻，连同那一车乘客一起栽进沟里。从车子此刻的模样判断，它整个下午大概一直在重复这项表演。车上的男孩们倒十分开心，一个个兴高采烈地从沟里爬出来。威廉走上前，告诉他们那是他的婴儿车。
        - id: ch04-b10
          speaker: small_boy
          text: 少来！这车是我们的，我们捡到的！
        - id: ch04-b11
          speaker: william
          text: 可那是我留在这里的。
        - id: ch04-b12
          speaker: ginger
          text: 来吧，咱们打一架，谁赢了车归谁。
        - id: ch04-b13
          speaker: narrator
          text: 姜吉熟练地卷起袖子，摆出一副马上开打的架势。其他亡命徒也跟着挽起袖管，站到他身边。车上那群男孩没有立刻答应，他们仔细打量着这支队伍，估算了一番双方的实力，终于决定让步。
        - id: ch04-b14
          speaker: small_boy
          text: 行了，行了！你们这辆破车，拿走吧！
        - id: ch04-b15
          speaker: narrator
          text: 道格拉斯把宝宝放回座位。威廉还十分体贴地撑起车篷，尽量遮住路人好奇的目光。宝宝坐在里面，一面嚼着车篷布，一面兴奋地跟自己说个不停。威廉横下一条心，决意任凭命运如何都绝不动摇，推着车拐进自家那条路。宝宝的母亲巴特勒太太已经站在他家门口等着了。
        - id: ch04-b16
          speaker: mrs_butler
          text: 你们终于回来啦！我都开始担心了。亲爱的，实在太谢谢你了。
        - id: ch04-b17
          speaker: narrator
          text: 不过，她说这句话时，还没有看见宝宝！
