          text: "Oh, all right. Take your rotten old carriage!"
        - id: ch01-b142
          speaker: narrator
          text: |-
            Douglas lifted the baby back into his seat. William thoughtfully raised the carriage hood. It would hide his charge, at least as much as possible, from the curious eyes of people they passed. The baby was now chewing the carriage cover and talking excitedly to himself.

            With his heart steeled for any fate, William turned the corner into his own road. The baby's mother was already standing at his gate.
        - id: ch01-b143
          speaker: mrs_butler
          text: "There you are! I was starting to worry. Thank you so much, dear."
        - id: ch01-b144
