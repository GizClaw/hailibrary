  chapters:
    - id: ch01
      title: The Outlaws
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            It was a half-holiday, and William was in his bedroom getting ready for the afternoon. Half a cake stood waiting on the mantel. He had captured it in a successful raid on the pantry. Beside it was a bottle of licorice water, made by shaking a piece of licorice in plain water.

            William belonged to a band called the Outlaws. Every half-holiday, they met in secret inside an abandoned barn about a quarter mile from his house. So far, their outlaw business had included wrestling, hunting for adventures, and cooking. The week before, William had smuggled two sausages from the pantry under his shirt, right against his skin. The boys had held them over a smoky fire until they were black, then eaten every charred bit with great enjoyment.
        - id: ch01-b02
          speaker: narrator
          text: |-
            William put the licorice water in one pocket and the half cake in another. He meant to leave by his favorite route: out the bathroom window, across the scullery roof, then hand over hand down the drainpipe. He preferred it to the front door even when he wasn't carrying stolen cake.

            But as he stepped onto the landing, the front door opened and closed below. He heard delighted greetings in the hall.
        - id: ch01-b03
          speaker: mrs_brown
          text: "Oh, I'm so glad you're here! And is this the baby? What a little darling! Well, then, how are you? Goo-goo-goo!"
          emotion: happy
        - id: ch01-b04
          speaker: william
          text: "Oh, crumbs."
        - id: ch01-b05
          speaker: narrator
          text: William hurried back into his room and sat on the bed, waiting for the way to clear. Before long, footsteps came upstairs. His mother entered.
        - id: ch01-b06
          speaker: mrs_brown
          text: "Mrs. Butler brought her baby for the afternoon. We planned to take him out until tea, but she has such a bad headache that I'm making her lie down in the drawing room. She's terribly worried that the baby won't get outdoors on this lovely day."
        - id: ch01-b07
          speaker: william
          text: "Oh."
        - id: ch01-b08
          speaker: mrs_brown
          text: "Cook is out, Emma has to make tea and answer the door, and Ethel is away. So I told Mrs. Butler you surely wouldn't mind pushing the baby out for a while."
        - id: ch01-b09
          speaker: narrator
          text: William could only stare at his mother, unable to say a word. Even the terrible face of Medusa, frozen in horror, would have looked mild beside William's at that moment. At last he wet his lips. When he managed to speak, his voice came out hoarse.
        - id: ch01-b10
          speaker: william
          text: "Me? You mean me? Take a baby out in a baby carriage?"
          emotion: surprised
        - id: ch01-b11
          speaker: mrs_brown
          text: "I know it's your half-holiday, dear, but you'd still be outside in the fresh air. That's what matters. He's a nice baby, the carriage is easy to push, and Mrs. Butler would be so grateful."
        - id: ch01-b12
          speaker: william
          text: "She certainly ought to be. If I pushed her baby around, she'd have every reason to be grateful."
        - id: ch01-b13
          speaker: mrs_brown
          text: "I'm sure you want to help. And you wouldn't want your father to hear that you refused one little favor for poor Mrs. Butler, especially with her headache."
        - id: ch01-b14
          speaker: william
          text: "One little favor!"
        - id: ch01-b15
          speaker: narrator
          text: The trap was closing around him. William knew exactly how this would go. Nobody would leave him in peace until he had done the horrible thing they wanted. There was no escape left. Full of sorrow, and as unwilling as a person could possibly be, he bowed to the inevitable.
        - id: ch01-b16
          speaker: william
          text: "All right. I'll come down in a minute."
        - id: ch01-b17
          speaker: narrator
          text: He heard everyone fussing over the baby in the hall. Then his older brother spoke.
        - id: ch01-b18
          speaker: robert
          text: "Mother, you can't honestly mean to trust that child to William."
        - id: ch01-b19
          speaker: mrs_brown
          text: "Someone must take him out, Robert. It's a beautiful afternoon. William is being very kind, too, when it's his half-holiday. And Mrs. Butler has such a headache."
        - id: ch01-b20
          speaker: robert
          text: "Well, you know William as well as I do. I'm taking no responsibility for this."
        - id: ch01-b21
          speaker: mrs_brown
          text: "Oh, dear. Everything was settled until you found fault. If William shouldn't take him, will you do it?"
        - id: ch01-b22
          speaker: narrator
          text: Robert retreated quickly to the dining room and called back from a safe distance.
        - id: ch01-b23
          speaker: robert
          text: "No, thank you! I don't want to take him. I only said that you know William. I'm not criticizing anything. I'm simply stating a fact."
        - id: ch01-b24
          speaker: narrator
          text: Then William came downstairs.
        - id: ch01-b25
          speaker: mrs_brown
          text: "Here he is, all ready. You don't have to go far. Just go up and down the road if you like, but stay out until tea. Isn't he a sweet baby? And isn't Willy-Billy nice to take him out while his mommy has a little nap?"
        - id: ch01-b26
          speaker: narrator
          text: William went red with shame.
        - id: ch01-b27
          speaker: narrator
          text: |-
            He pushed the carriage to the end of the road and around the corner. Compared with William, the early martyrs must have felt perfectly happy. What a way for an Outlaw to spend a half-holiday!

            He dreaded meeting any of his brother Outlaws while pushing a baby. Still, their meeting place pulled at him like a magnet. He turned off the road and went down the country lane toward the field where their special barn stood. At the stile, he stopped. The barn was far across the field, and he could only stare at it longingly. The baby sat there sucking his thumb and watching William. At last, he began a conversation.
        - id: ch01-b28
          speaker: baby
          text: "Blab-blab-blab-blab! Blub-blub-blub!"
        - id: ch01-b29
          speaker: william
          text: "Oh, be quiet."
        - id: ch01-b30
          speaker: narrator
          text: The long stop annoyed the baby. He pulled the carriage cover loose and threw it into the road. While William picked it up, the baby tossed the pillow onto his head and chuckled. William was beginning to dislike him very much.

            Then a magnificent idea came. William's face cleared at once. He found a piece of string in his pocket and tied the carriage carefully to the railings. Next he lifted out the baby, handling him as cautiously as he could, and climbed the stile with him.

            William set off across the fields toward the barn. He held the baby pressed against his chest, with both arms locked tightly around the little waist. The baby's feet swung in the air. He passed the journey by kicking William in the stomach, pulling his hair, and pushing his fingers into William's eyes.
        - id: ch01-b31
          speaker: william
          text: "I don't know what anybody sees in babies. They scratch you, kick you, blind you, and pull out all your hair!"
        - id: ch01-b32
          speaker: narrator
          text: The barn went silent when William walked in.
        - id: ch01-b33
          speaker: unnamed_outlaw
          text: "Now, just look here—"
          emotion: angry
        - id: ch01-b34
          speaker: william
          text: "I've kidnapped him. We'll make them pay a ransom."
        - id: ch01-b35
          speaker: narrator
          text: The others gazed at William with awe. This was outlawry at its finest. He put the baby down. The baby toddled several steps, dropped hard onto the floor, then stared at Douglas, the tallest boy there. He smiled like an angel.
        - id: ch01-b36
          speaker: baby
          text: "Dad-dad-dad-dad-dad!"
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: Douglas gave an embarrassed grin.
        - id: ch01-b38
          speaker: douglas
          text: "He thinks I'm his father."
        - id: ch01-b39
          speaker: narrator
          text: Douglas sounded rather pleased. Henry, William's rival for command of the Outlaws, brought them back to business.
        - id: ch01-b40
          speaker: henry
          text: "The question is, what do we do first?"
        - id: ch01-b41
          speaker: ginger
          text: "In stories, kidnappers send the family a note and demand a ransom."
        - id: ch01-b42
          speaker: william
          text: "We're not doing that yet."
        - id: ch01-b43
          speaker: ginger
          text: "There's no sense holding somebody for ransom if you never tell the family to pay, is there?"
        - id: ch01-b44
          speaker: narrator
          text: Ginger finished with the firm manner of a man whose logic could not possibly be defeated. William drew out his answer, then suddenly caught sight of a way to escape.
        - id: ch01-b45
          speaker: william
          text: "No... but wait. Who has paper and a pencil? I'm only stating a fact. Who brought paper and a pencil?"
        - id: ch01-b46
          speaker: narrator
          text: Nobody answered. William's voice turned triumphant.
        - id: ch01-b47
          speaker: william
          text: "Exactly! Go ahead and write your note. Write it without paper or a pencil. We'll all stand here and watch you do it. Huh!"
        - id: ch01-b48
          speaker: ginger
          text: "I don't suppose real outlaws had paper and pencils. They hadn't been invented. They wrote on... well, on leaves or something."
        - id: ch01-b49
          speaker: william
          text: "Then write it on leaves. Nobody's stopping you. I'm simply stating a fact. Go on and write on leaves."
        - id: ch01-b50
          speaker: narrator
          text: |-
            A yell of pain from Douglas interrupted them. The baby had called him Dad, and Douglas was so flattered by their new family connection that he had tried to make friends. He had vague memories of the way his mother treated babies, so he put one finger into the baby's mouth.

            That baby happened to have four front teeth, two above and two below. They closed on Douglas's finger like a vise. Now he was examining the marks they had left.
        - id: ch01-b51
          speaker: douglas
          text: "Look how deep that is! Can you see? It nearly reached the bone. You've brought us a pretty savage baby."
        - id: ch01-b52
          speaker: william
          text: "I already know that. It's your fault for touching him. He's all right if you leave him alone. Besides, he's mine, and I never gave you permission to fool with him. I bet he wouldn't bite me."
        - id: ch01-b53
          speaker: henry
          text: "What about the ransom?"
        - id: ch01-b54
          speaker: ginger
          text: "Somebody could tell his family, then come back with the money."
        - id: ch01-b55
          speaker: narrator
          text: After a short silence, Douglas took his sore finger from his mouth.
        - id: ch01-b56
          speaker: douglas
          text: "Who?"
        - id: ch01-b57
          speaker: henry
          text: "William brought him."
        - id: ch01-b58
          speaker: william
          text: "Yes, and I've done my share."
        - id: ch01-b59
          speaker: henry
          text: "Then what's anybody else supposed to do? Visit every house around here and ask whether someone stole their baby and whether they'll pay to get it back? That's sensible, isn't it? You know where he came from, so you can collect the ransom."
        - id: ch01-b60
          speaker: william
          text: "I could, but I won't. I'm simply stating a fact. I'm not going. And if anybody says I'm afraid, I'll fight him."
        - id: ch01-b61
          speaker: narrator
          text: Nobody told William he was afraid. The fact that he wasn't afraid of a fight was far too clear to need saying. Henry saw where the discussion was heading and hurriedly changed the subject.
        - id: ch01-b62
          speaker: henry
          text: "Anyway, what did everybody bring for the feast?"
        - id: ch01-b63
          speaker: narrator
          text: |-
            William brought out his bottle of licorice water and the stolen half cake. Douglas had two slices of raw ham and a dog biscuit. Ginger unwrapped some popcorn and several cold boiled potatoes from newspaper. Henry's contribution was a cold apple dumpling and a small bottle of paraffin oil.
        - id: ch01-b64
          speaker: henry
          text: "I knew the wood would still be wet after the rain. The oil will get our fire started. Makes sense, doesn't it?"
        - id: ch01-b65
          speaker: ginger
          text: "The ham's the only thing we can cook."
        - id: ch01-b66
          speaker: william
          text: "We can cook the potatoes and the dumpling again. They don't look nearly cooked enough. Leave everything here, and we'll hunt for adventures first. We can go different ways and meet back in fifteen minutes."
        - id: ch01-b67
          speaker: narrator
          text: |-
            The Outlaws often spent part of each afternoon going off separately to look for an adventure. So far, they had mostly tried to win the attention of the Goddess of Danger by trespassing on land owned by bad-tempered farmers. They always hoped for a chase, and those hopes were generally fulfilled.

            They put their entire store of food on the floor in one corner of the barn. Then they glanced at their kidnapped baby. He sat there quite happily, busy chewing the strings of his hat. The boys went out in different directions and carefully closed the barn door behind them.

            Fifteen minutes later, Ginger and William reached the barn together from opposite directions.
        - id: ch01-b68
          speaker: ginger
          text: "Find anything?"
        - id: ch01-b69
          speaker: william
          text: "No."
        - id: ch01-b70
          speaker: ginger
          text: "Neither did I. Let's get the fire going."
        - id: ch01-b71
          speaker: narrator
          text: |-
            They opened the door and went in. The baby was sitting among the supplies. Or rather, he sat among whatever was left of them. Paraffin oil covered his hair, face, arms, clothes, and feet. He was drenched in it. The empty bottle lay on the floor beside his hat.

            Cold boiled potato had become mixed with the oil and spread all over him. He held the apple dumpling firmly in one hand.
        - id: ch01-b72
          speaker: baby
          text: "Ball!"
          emotion: happy
        - id: ch01-b73
          speaker: narrator
          text: The baby announced this with complete delight from behind his mask of potato and paraffin oil. William and Ginger stood looking at him without a word. A whole minute passed before Ginger finally turned his eyes to the empty bottle.
        - id: ch01-b74
          speaker: ginger
          text: "How are we supposed to light the fire now?"
        - id: ch01-b75
          speaker: william
          text: "Yes... and who's supposed to take that baby home? I'm simply stating a fact. Who's taking him home?"
        - id: ch01-b76
          speaker: narrator
          text: Robert's phrase had pleased William. Whenever he decided to borrow a favorite expression from anyone in his family, he always used it until everyone else was thoroughly tired of hearing it.
        - id: ch01-b77
          speaker: ginger
          text: "He did it himself. It isn't anybody else's fault."
        - id: ch01-b78
          speaker: william
          text: "No, but grown-ups never notice that sort of thing. Anyway, I'm washing his face."
        - id: ch01-b79
          speaker: ginger
          text: "With what?"
        - id: ch01-b80
          speaker: narrator
          text: William pulled out his dirty handkerchief and approached. His licorice water was still untouched in the corner, so he removed the cork.
        - id: ch01-b81
          speaker: ginger
          text: "You're washing him with that filthy drink?"
        - id: ch01-b82
          speaker: william
          text: "It's water. Clean water. I made it, so I ought to know. That's what people wash with, isn't it? Clean water."
        - id: ch01-b83
          speaker: ginger
          text: "And what are we going to drink? That baby has already taken our potatoes, our dumpling, and our oil. Now you're giving him our licorice water, too."
        - id: ch01-b84
          speaker: narrator
          text: William rubbed the baby's face with his handkerchief, now wet with licorice water. The baby caught one corner between his teeth and would not let go.
        - id: ch01-b85
          speaker: william
          text: "If you had to take him home looking like this, you wouldn't care about drinking it. I'm simply stat—"
        - id: ch01-b86
          speaker: ginger
          text: "Oh, stop saying that! I'm sick of hearing it."
          emotion: angry
        - id: ch01-b87
          speaker: narrator
          text: |-
            At that instant, the door flew open. A large cow walked slowly into the barn. Henry and Douglas followed close behind. Henry's whole face shone with triumph. William's kidnapping had pushed him into the shadows, but now he felt important again.
        - id: ch01-b88
          speaker: henry
          text: "I brought a cow! I got her from Farmer Litton's field, five fields away. And she was hard work to bring here, too."
          emotion: happy
        - id: ch01-b89
          speaker: william
          text: "What did you bring her for?"
        - id: ch01-b90
          speaker: narrator
          text: Henry laughed as if the answer should have been obvious.
        - id: ch01-b91
          speaker: henry
          text: "What for? You haven't read much about outlaws, have you? Outlaws always drove away cattle from the nearby countryside."
        - id: ch01-b92
          speaker: william
          text: "Yes, but what did they want cattle for?"
        - id: ch01-b93
          speaker: narrator
          text: Henry's certainty weakened.
        - id: ch01-b94
          speaker: henry
          text: "Well... I suppose they killed them and roasted them."
        - id: ch01-b95
          speaker: william
          text: "Then go ahead. Kill her and roast her. Nobody's stopping you. Then you'll be hanged for murder. I expect killing cows is murder just like killing people, unless you're a butcher."
        - id: ch01-b96
          speaker: narrator
          text: |-
            William tugged at the handkerchief, still clenched in the baby's teeth. Meanwhile, the cow came forward slowly and almost apologetically. The baby dropped the handkerchief and smiled at her in delight.
        - id: ch01-b97
          speaker: baby
          text: "Bow-wow!"
          emotion: happy
        - id: ch01-b98
          speaker: douglas
          text: "Let's get on with the feast."
        - id: ch01-b99
          speaker: ginger
          text: "Feast? There isn't much of one left. William's baby used all the oil and potatoes, crushed the apple dumpling, and got his face washed in the licorice water."
        - id: ch01-b100
          speaker: narrator
          text: Henry looked the baby over without any sympathy at all. He studied the damage carefully, like a judge considering evidence before announcing a decision.
        - id: ch01-b101
          speaker: henry
          text: "Yes, he does look as if somebody washed him in licorice water. And he certainly used the oil and potatoes. He won't bring much of a ransom now. You've made quite a mess of him."
        - id: ch01-b102
          speaker: william
          text: "Stop talking about the baby. I'm completely sick of him. Come on. Let's make the fire."
        - id: ch01-b103
          speaker: narrator
          text: William picked up his damp handkerchief. It had turned the color of a prune. Outside, the boys made a little pile of twigs and tried to light it.
        - id: ch01-b104
          speaker: douglas
          text: "I hope the cow isn't hurting the kidnap. Go check, William. He's your kidnap."
        - id: ch01-b105
          speaker: william
          text: "And she's Henry's cow. If she tries any tricks on that baby, I feel sorry for the cow."
        - id: ch01-b106
          speaker: narrator
          text: |-
            Still, William rose reluctantly from beside the fire and threw open the barn door. The cow and baby were standing there admiring each other. From the cow's mouth hung a long, wet ribbon. At the end of it were the chewed remains of the baby's hat.

            The baby held up the dog biscuit and crowed with delight. The cow bent her head and sniffed it with great care, as if she wasn't at all sure what to make of it.

            As William entered, the cow turned. Her tail struck the baby's head, and he let out a piercing howl. All the Outlaws rushed inside.
        - id: ch01-b107
          speaker: douglas
          text: "What did you do to the poor little thing?"
        - id: ch01-b108
          speaker: william
          text: "It was Henry's cow! She hit him. Oh, be quiet. Please, just be quiet!"
        - id: ch01-b109
          speaker: narrator
          text: The baby's howls grew louder.
        - id: ch01-b110
          speaker: henry
          text: "You brought him here. Can't you stop him? There's no sense carrying babies around if you don't know how to make them stop crying!"
        - id: ch01-b111
          speaker: narrator
          text: |-
            The baby had turned purple. The Outlaws stood around him helplessly.
        - id: ch01-b112
          speaker: douglas
          text: "Maybe he's hungry."
        - id: ch01-b113
          speaker: narrator
          text: Douglas picked up the half cake and offered it cautiously. The baby stopped crying at once.
        - id: ch01-b114
          speaker: baby
          text: "Dad-dad-dad-dad-dad."
          emotion: sad
        - id: ch01-b115
          speaker: narrator
          text: Douglas blushed and grinned.
        - id: ch01-b116
          speaker: douglas
          text: "He keeps thinking I'm his father. Here, do you want some cake?"
        - id: ch01-b117
          speaker: narrator
          text: The baby tore off a handful and pushed it into his mouth.
        - id: ch01-b118
          speaker: douglas
          text: "Look! He's eating it!"
          emotion: surprised
        - id: ch01-b119
          speaker: narrator
          text: Douglas's voice rose with excitement. But after chewing the cake thoroughly, the baby changed his mind and spat it out bit by bit. William blushed on his behalf.
        - id: ch01-b120
          speaker: william
          text: "Come on. Let's go see the fire."
        - id: ch01-b121
          speaker: narrator
          text: |-
            The boys left the barn. Outside, the cow still had the baby's hat hanging from her mouth. Her front feet were planted firmly on what had once been a promising fire.
        - id: ch01-b122
          speaker: william
          text: "Look at Henry's cow! That's a fine cow you brought us, Henry. No sense bringing cows around if you can't stop them from putting out everybody's fires."
          emotion: happy
        - id: ch01-b123
          speaker: narrator
          text: |-
            A fierce argument followed. Then the Outlaws turned all their attention to the cow. They tried to shoo her away, but she refused to move. She simply stood there and stared until the boys looked away first. Ginger crept toward her and gave her a small push. She flicked her tail straight into his eye, then calmly continued chewing the baby's hat string. William tried approaching next. The cow lowered her head, and William retreated in a hurry.

            At last, they gave up on her. They went to collect fresh wood and started the whole fire-building process again. Before long, they were perfectly happy. They ate the two slices of ham, now black from the flames, along with the popcorn and whatever remained of the cake.

            After this feast, Ginger and William became Wild Indians and attacked the barn. Douglas and Henry stayed inside to defend it. The kidnapped baby crawled around the defenders on all fours. Whenever he came across some treasure, he picked it up and tested what it did to his mouth. Every so often he came over to talk to the boys. As he approached, the strong smell of paraffin oil came with him.
        - id: ch01-b124
          speaker: baby
          text: "Blab-blab-blab-blab! Blub-blub-blub! Dad-dad-dad-dad-dad! Goo-goo-goo!"
        - id: ch01-b125
          speaker: narrator
          text: William had insisted on joining the attackers.
        - id: ch01-b126
          speaker: william
          text: "I couldn't put any real feeling into fighting for that baby."
        - id: ch01-b127
          speaker: narrator
          text: |-
            At last, the Outlaws decided it was time to go home. William looked at the baby he was supposed to return and felt completely hopeless. There really were no words for the baby's appearance now. Oil, potato, cake, and the adventures of the afternoon had done their work.

            The memory stayed with William. For many years afterward, whenever he thought about babies, he also thought about paraffin oil and cold potato.
        - id: ch01-b128
          speaker: william
          text: "Please help me get the potato out of his hair. Never mind the oil or anything else."
        - id: ch01-b129
          speaker: ginger
          text: "Good grief, he smells funny! And look at him. He's covered with oil, potato, and pieces of cake!"
        - id: ch01-b130
          speaker: william
          text: "Oh, stop talking about it."
          emotion: angry
        - id: ch01-b131
          speaker: narrator
          text: The cow followed them to the stile and watched with a mocking look as they climbed over.
        - id: ch01-b132
          speaker: baby
          text: "Bow-wow."
          emotion: happy
        - id: ch01-b133
          speaker: narrator
          text: The baby gave the cow an affectionate farewell. William looked wildly around for the carriage. It had vanished. Only his piece of string hung from the railings.
        - id: ch01-b134
          speaker: william
          text: "Crumbs! Talk about bad luck. I'm simply stating a fact. This is bad luck!"
        - id: ch01-b135
          speaker: narrator
          text: |-
            Just then, the carriage appeared at the top of the hill. It came racing down at full speed, loaded with small boys. When it reached the bottom, it overturned into a ditch, taking its entire cargo with it. Judging by the carriage's battered appearance, it had spent the whole afternoon racing down hills and tipping over.

            The boys climbed happily out of the ditch.
        - id: ch01-b136
          speaker: william
          text: "That's my carriage!"
        - id: ch01-b137
          speakers: [small_boy_1, small_boy_2, small_boy_3]
          ensemble: chorus
          text: "Get lost! It's ours. We found it!"
        - id: ch01-b138
          speaker: william
          text: "I left it there."
        - id: ch01-b139
          speaker: ginger
          text: "Come on, then. We'll fight you for it."
        - id: ch01-b140
          speaker: narrator
          text: Ginger rolled up his sleeves. The other Outlaws did the same. The small boys looked them over and made their decision.
        - id: ch01-b141
          speakers: [small_boy_1, small_boy_2, small_boy_3]
