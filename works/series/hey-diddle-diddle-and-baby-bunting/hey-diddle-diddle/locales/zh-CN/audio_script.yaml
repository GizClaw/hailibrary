audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 俏皮轻快，带着童谣般的节奏
        timbre: 温暖清亮
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 叮当开场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 嘿，叮当，叮当，瞧猫儿和小提琴！
    - id: ch02
      title: 跳过月亮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 母牛跳过月亮，小狗见了，乐得哈哈笑。
    - id: ch03
      title: 一起跑掉
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 盘子和勺子竟一起跑掉了。
