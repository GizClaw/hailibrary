cover_prompt: |-
  A wordless cover scene joins the two nursery rhymes in a cheerful moonlit English meadow. A round white cow leaps in a high arc over a silver crescent moon while a striped cat plays a small fiddle below, a brown dog laughs, and a dish and spoon scamper together across the grass. In the foreground, a bundled baby in a simple nineteenth-century bonnet rests safely in a wicker cradle lined with warm blankets. The cow's joyful leap is the focal action, with the other figures forming a playful curved rhythm around the cradle. Use a low childlike viewpoint and leave generous deep-blue sky around the moon at the top. Keep every figure simple, friendly, and based only on the traditional verses, with no modern objects or adaptation likenesses. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
