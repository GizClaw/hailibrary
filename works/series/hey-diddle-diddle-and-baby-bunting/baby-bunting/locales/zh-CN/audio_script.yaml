      display_name: 旁白
      tts:
        delivery: 温柔亲昵，带着摇篮曲般的节奏
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 睡吧，小宝贝
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 睡吧，小宝贝。
    - id: ch02
      title: 爸爸去打猎
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 爸爸出门打猎去了。
    - id: ch03
      title: 兔子皮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他要带张兔子皮回来，把小宝贝裹起来。
