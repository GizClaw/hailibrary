audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 克制、清楚，随场景自然起伏
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中
    hazel:
      display_name: 榛榛
      tts:
        delivery: 机敏认真，焦急时稍快但保持自然
        timbre: 年轻明亮
        pace: 中快
        pitch: 中高
    rook:
      display_name: 黑羽
      tts:
        delivery: 干燥幽默，克制而不冷漠
        timbre: 低沉略粗
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 一百颗以后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            第一颗橡果落下来时，榛榛正倒挂在白橡树的细枝上。橡果先敲了一下树根，又滚进两片红叶之间。她落地抱起它，掂了掂。饱满，沉，壳上只有一道浅浅的擦痕。

        - id: ch01-b02
          speaker: hazel
          text: 一。
        - id: ch01-b03
          speaker: narrator
          text: |+
            她说。

            树上又响了一声。第二颗落进草里。接着是第三颗、第四颗。风穿过树冠，整棵老橡树像抖开一只装满木珠的袋子。

            榛榛去年冬天吃过找不到食物的苦。那时雪封住林地，她刨开三个空洞，最后只能啃一截发苦的老树皮。她记得那种饿：肚子里像关着一只拿爪子挠门的小兽。因此，今年每得到一颗橡果，她都要数。

            她把第一颗埋在苔石北边，把第二颗塞进倒木旁的软土，把第三颗藏到蕨根下。她不肯把食物堆在一个洞里。林中有许多眼睛，也有许多会挖土的爪子；分开放，即使一处被偷走，别处还在。

        - id: ch01-b04
          speaker: hazel
          text: 七，八，九……
        - id: ch01-b05
          speaker: narrator
          text: |-
            榛榛每埋一颗，就用后脚把土踩平，再在心里把数目推高一格。

            老鸦黑羽停在低枝上。他的喉间有一根灰白羽毛，像落着一小片旧雪。
        - id: ch01-b06
          speaker: rook
          text: 你一直念，偷果子的也省得数了。
        - id: ch01-b07
          speaker: narrator
          text: |-
            

            榛榛立刻闭嘴，环顾四周。
        - id: ch01-b08
          speaker: hazel
          text: |+
            你听见多少？
          emotion: fearful

        - id: ch01-b09
          speaker: rook
          text: |+
            听见你从三十二数到四十七，中间把四十一数了两遍。

        - id: ch01-b10
          speaker: hazel
          text: 我没有。
        - id: ch01-b11
          speaker: narrator
          text: |-
            

            黑羽把头偏到一边。
        - id: ch01-b12
          speaker: rook
          text: 那就是风数的。
        - id: ch01-b13
          speaker: narrator
          text: |-
            

            榛榛不理他。她找到一块白色小石头，用爪尖划了一道。每藏十颗，她就在石边划一下。到傍晚，石头上有六道细痕。她对着痕迹重新数，越数越觉得冬天被自己关在了门外。

            第二天，风更凉。榛榛从山毛榉旁跑到溪沟边，从刺莓丛跑到枯树坡。她把橡果埋进许多浅浅的小坑，再把落叶拨回原处。有一颗长着虫洞，她当场吃掉；有一颗裂了，她也没有藏。好果子才值得留到雪天。

            黑羽有时从空中看着她，有时落下来啄一只甲虫。他从不替她记，只会在她绕着同一根树桩跑第三圈时说：
        - id: ch01-b14
          speaker: rook
          text: |+
            你今天很喜欢这根木头。

        - id: ch01-b15
          speaker: hazel
          text: |+
            我在找第五十八颗的地方。

        - id: ch01-b16
          speaker: rook
          text: 你埋的时候，这里没有风。现在每片叶子都换了座位。
        - id: ch01-b17
          speaker: narrator
          text: |
            

            榛榛扒开一处土，又赶紧盖回去。里面空空的。她看见自己尾巴扫乱的叶子，心里那只小兽又挠了一下门。

            她决定做一张更可靠的地图。
    - id: ch02
      title: 一张会动的地图
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            榛榛没有纸，也不需要纸。她把林子分成几块：苔石这边、溪沟那边、倒木上边、荆棘后边。她在白石上添划痕，在树皮上咬小缺口，还把三根细枝搭成箭头，尖端朝向新藏的橡果。

        - id: ch02-b02
          speaker: hazel
          text: 这下不会丢。
        - id: ch02-b03
          speaker: narrator
          text: |-
            她对黑羽说。

            黑羽飞到一根箭头旁。风一推，最上面的细枝滚了半圈。
        - id: ch02-b04
          speaker: rook
          text: 不会丢什么？
        - id: ch02-b05
          speaker: narrator
          text: |-
            

            榛榛把细枝搬回去。
        - id: ch02-b06
          speaker: hazel
          text: 我的记号。
        - id: ch02-b07
          speaker: narrator
          text: |-
            

            第三天夜里，雨来了。雨水沿坡流，把浅坑的土拍实，也把白石上的泥冲成细沟。刺莓丛下，一只田鼠闻到橡果，带走了两颗。倒木边，一只陌生松鼠挖开一处，又把没吃完的半颗埋到了更远的地方。

            清早，榛榛冲出巢洞。三根箭头散了，树皮缺口仍在，可树旁的黄叶铺了厚厚一层。白石上的划痕有的深，有的浅，多出一道水痕，又少了一小角。

            她一遍遍地数：
        - id: ch02-b08
          speaker: hazel
          text: |+
            六，七……这是雨，不算。八？这两道原来是一道吗？

        - id: ch02-b09
          speaker: rook
          text: 如果你问石头，
        - id: ch02-b10
          speaker: narrator
          text: 黑羽说，
        - id: ch02-b11
          speaker: rook
          text: |+
            它今天不太爱讲话。

        - id: ch02-b12
          speaker: hazel
          text: 我本来有九十颗。
        - id: ch02-b13
          speaker: narrator
          text: 榛榛的声音发紧，
        - id: ch02-b14
          speaker: hazel
          text: |+
            也许九十一。现在我不知道了。
          emotion: fearful

        - id: ch02-b15
          speaker: rook
          text: |+
            你知道肚子饿的时候，该去哪些地方找。

        - id: ch02-b16
          speaker: hazel
          text: 可我不知道每个地方有几颗。
        - id: ch02-b17
          speaker: narrator
          text: |-
            

            黑羽啄了啄湿叶下露出的橡果帽。
        - id: ch02-b18
          speaker: rook
          text: 冬天要你找到吃的，不会考你总数。
        - id: ch02-b19
          speaker: narrator
          text: |+
            

            这句话让榛榛更恼火。因为它听起来有一点对，又没有把她失去的数目还给她。她叼起白石，想把它带回树洞，可石头太重，走三步就从嘴里掉下来，砸中了自己的脚趾。

        - id: ch02-b20
          speaker: hazel
          text: 别笑。
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: |+
            她说。

            黑羽把喙藏进翅膀，肩膀却抖了两下。

            那以后，榛榛更忙了。她仍旧分散埋藏，却不再每颗都回头画记号。她记住粗大的树根、裂开的灰岩、长着三簇苔藓的树桩。她也靠鼻子贴近地面闻，靠爪下新旧不同的松土判断。数目偶尔从她脑中滑走，她就从最后记得的地方接着数。有时接错，有时干脆不接。

            一天午后，鹰影掠过林地。榛榛嘴里衔着一颗橡果，来不及跑回熟悉的树根，只得钻进一片矮灌木。她在那里飞快挖坑、埋果、压土，然后沿着石缝逃回树上。

            危险过去后，她站在枝头望那片灌木。风把每一簇叶子都翻出银白背面。她知道橡果在那里，却说不清是哪一簇下面。

        - id: ch02-b22
          speaker: hazel
          text: 一百零三。
        - id: ch02-b23
          speaker: narrator
          text: |-
            她低声说。

            过了一会儿，她又说：
        - id: ch02-b24
          speaker: hazel
          text: 也可能是一百零二。
        - id: ch02-b25
          speaker: narrator
          text: |-
            

            黑羽这次没有开玩笑。他望着远处渐暗的云，说：
        - id: ch02-b26
          speaker: rook
          text: |
            先回窝吧。
    - id: ch03
      title: 雪下的洞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            第一场雪很薄，只把枯叶的边缘描白。榛榛很快找到苔石边的橡果。她用前爪刨开松土，咬破硬壳，油润的果仁让她从舌根暖到胸口。

            第二场雪盖住了低草。她在倒木旁找到两颗，在蕨根下找到一颗。她没有每次都找对。有的坑空了，只留下田鼠细小的脚印；有的地方她刨了很久，下面只有一块圆石。但她找到的比找不到的多。

            真正的寒冷在深冬到来。雪面冻出硬壳，枝条一碰就发出玻璃般的轻响。榛榛醒来时，树洞里只剩几片啃净的果壳。她先去了白石附近，挖到鼻尖沾满雪，也没找到橡果。

        - id: ch03-b02
          speaker: hazel
          text: 不是这里。
        - id: ch03-b03
          speaker: narrator
          text: |-
            她喘着气说。

            黑羽在上方的枝头缩成一团。
        - id: ch03-b04
          speaker: rook
          text: 你还记得别处。
        - id: ch03-b05
          speaker: narrator
          text: |+
            

            榛榛记得裂开的灰岩，可岩缝被冰封住。她记得三簇苔藓的树桩，可雪把苔藓盖严。她朝溪沟跑，停住，又折向枯树坡。每一处都像她见过的地方，也像从未见过。

            她忽然想起那张落叶翻出银背的画面。鹰影、灌木、石缝，还有一颗没能记准数目的橡果。

        - id: ch03-b06
          speaker: hazel
          text: 那边。
        - id: ch03-b07
          speaker: narrator
          text: |+
            她说。

            灌木被雪压低了。榛榛从第一簇挖到第二簇，只挖出冻硬的根。到第三簇时，她的爪尖碰到了壳。那一颗橡果还在。旁边竟还有另一颗——也许是她藏的，也许是别的松鼠后来埋的。她没有办法知道。

            她把一颗推给黑羽。

        - id: ch03-b08
          speaker: rook
          text: 乌鸦不靠橡果过冬。
        - id: ch03-b09
          speaker: narrator
          text: |+
            他说。

        - id: ch03-b10
          speaker: hazel
          text: |+
            你也没少提醒我。

        - id: ch03-b11
          speaker: rook
          text: |+
            提醒不值半颗。

        - id: ch03-b12
          speaker: hazel
          text: 那你就欠我半颗。
        - id: ch03-b13
          speaker: narrator
          text: |
            

            黑羽叼起橡果，在壳上啄出一个口。两只动物蹲在雪压灌木下，把果仁分了。头顶的风依然冷，榛榛肚子里那只挠门的小兽却安静下来。

            冬天没有因为她数错就放过她，也没有因为她数得认真就格外为难她。她每天出去寻找，靠记忆，也靠气味、树根和偶然露出的叶角。有些贮藏被别的动物拿走，有些她自己再也没有找到。可那些分散在林地各处的小坑，一处空了，还有另一处。

            雪最深的那个星期，她停止计算还剩多少颗。不是因为不在乎，而是每找回一颗，她就先吃饱，再记住下一处该往哪里走。
    - id: ch04
      title: 没有找回来的
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |+
            春水从冰下响起来时，榛榛瘦了一圈，尾巴却仍旧蓬松。她在第一片裸露的土地上找到半颗发黑的橡果，嫌弃地推开。接着，她在苔石旁找到自己秋天划过的白石。雨雪磨平了几道痕迹，剩下的互相交叉，已经没有一个可信的数。

            她把石头翻了个面。底下没有橡果，只有一条受惊的蚯蚓缩进土里。

        - id: ch04-b02
          speaker: rook
          text: 你可以重新数春芽。
        - id: ch04-b03
          speaker: narrator
          text: |+
            黑羽说。

        - id: ch04-b04
          speaker: hazel
          text: 不数。
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: |+
            榛榛回答得太快，自己先笑了。

            几天后，她穿过枯树坡，闻到潮湿泥土和新叶的气味。倒木外侧冒出一根弯弯的浅绿芽，顶端还扣着裂开的棕壳。榛榛停下。那不是草。两片初生叶正慢慢张开，像一双刚从被窝里伸出的手。

            她刨开旁边的叶子，找到第二株。溪沟上方有第三株。刺莓丛后，还有两株挨得很近，其中一株的茎歪向阳光。

        - id: ch04-b06
          speaker: hazel
          text: 谁把橡果埋在这里？
        - id: ch04-b07
          speaker: narrator
          text: |-
            她问。

            黑羽从空中落下，看了看小芽，又看了看她。
        - id: ch04-b08
          speaker: rook
          text: 林子里会埋橡果的，不只你。
        - id: ch04-b09
          speaker: narrator
          text: |+
            

            榛榛认得倒木，认得那块灰岩，也认得灌木后的石缝。可她不能认出一颗已经裂开、向下生根又向上发芽的橡果。也许有些是她忘掉的，有些被别的动物搬过，有些会被吃掉，有些熬不过干热的夏天。眼前这些至少活到了春日的光里。

            她伸爪碰了碰最近的嫩叶，又马上缩回去。嫩叶很软，叶脉却已经清楚。

        - id: ch04-b10
          speaker: hazel
          text: 它算谁的？
        - id: ch04-b11
          speaker: narrator
          text: |+
            她问。

        - id: ch04-b12
          speaker: rook
          text: 你要是吃它，它算午饭。
        - id: ch04-b13
          speaker: narrator
          text: 黑羽说，
        - id: ch04-b14
          speaker: rook
          text: 你要是留下它，它就自己算。
        - id: ch04-b15
          speaker: narrator
          text: |-
            

            榛榛瞪了他一眼。这句话还是有点像玩笑，也还是没有替她给出答案。

            那天下午，大风刮过林地。一根断枝落下来，正压在最小的幼苗旁。榛榛本来已经跑过，听见叶片擦地的细响，又退回来。她咬住枝条末端，向后拖。枝条比橡果重得多，她拖了三次才把嫩芽旁的空处让出来。

            黑羽站在高处问：
        - id: ch04-b16
          speaker: rook
          text: 这是第一棵，还是第五棵？
        - id: ch04-b17
          speaker: narrator
          text: |+
            

            榛榛坐在湿土上喘气。幼苗在风里摇了一下，没有倒。

        - id: ch04-b18
          speaker: hazel
          text: 这一棵。
        - id: ch04-b19
          speaker: narrator
          text: |-
            她说。

            入夏前，林下长满高草。并不是每株幼苗都还在：溪沟边的一株不见了，刺莓后的两株只剩一株。倒木旁那株长出了更多叶子，颜色从嫩黄变成深绿。榛榛常从它上方的枝路经过，有时停下来赶走啃叶的毛虫，有时只是看一眼。

            秋天再来时，老橡树又开始落果。第一颗橡果敲在树根上，滚进两片红叶之间，仿佛去年那一颗原路回来。

            榛榛捡起它，照旧掂了掂。饱满，沉，没有虫洞。她衔着橡果跑过苔石，没有停；跑过白石，也没有停。她在离老树更远的一块松土上挖了一个浅坑，把橡果放进去，仔细盖好。

            黑羽从低枝上看着她。
        - id: ch04-b20
          speaker: rook
          text: 不数了？
        - id: ch04-b21
          speaker: narrator
          text: |+
            

            榛榛用后脚踩平最后一撮土。她看了看四周的树根、石缝和被风翻动的叶子，又望了一眼倒木旁那株已经齐她胸口高的小橡树。

        - id: ch04-b22
          speaker: hazel
          text: 这一颗，我记得。
        - id: ch04-b23
          speaker: narrator
          text: |-
            她说。

            然后她跑回橡树下，去接下一颗。
