audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 像在火炉边讲故事，温和细腻，遇到险情自然收紧, timbre: 温暖清亮, pace: 舒缓而有呼吸感, pitch: 中}
    hazel:
      display_name: 榛榛
      tts: {delivery: 认真机灵，着急时语速变快，放松时爽快自然, timbre: 年轻明亮, pace: 中快, pitch: 中高}
    rook:
      display_name: 黑羽
      tts: {delivery: 话不多，干巴巴的幽默里藏着关心, timbre: 低沉微哑, pace: 从容, pitch: 中低}
  chapters:
    - id: ch01
      title: 一百颗以后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第一颗橡果掉下来时，榛榛正倒挂在白橡树的细枝上。橡果敲了一下树根，滚进两片红叶中间。她跳下来抱住它，掂了掂。沉甸甸的，很饱满，壳上只有一道浅浅的擦痕。
        - {id: ch01-b02, speaker: hazel, text: 一。}
        - id: ch01-b03
          speaker: narrator
          text: |-
            树上又响了一声。第二颗橡果落进草里。接着是第三颗、第四颗。风穿过树冠，老橡树哗啦一抖，像有人抖开了一袋木珠子。

            榛榛可没忘记去年冬天挨饿的滋味。大雪封住林地，她连刨三个洞，三个都是空的。最后只好去啃又老又苦的树皮。那种饿，好像肚子里关着一只小兽，一直拿爪子挠门。所以今年，每得到一颗橡果，她都要数清楚。

            第一颗埋在苔石北边，第二颗塞进倒木旁的软土，第三颗藏在蕨根下面。她从不把食物堆在一个洞里。林子里眼睛多，会挖土的爪子也多。分开藏，一处叫人偷了，别处还有。
        - {id: ch01-b04, speaker: hazel, text: 七，八，九……}
        - id: ch01-b05
          speaker: narrator
          text: |-
            每埋一颗，她就用后脚把土踩平，心里的数也往上加一格。

            老鸦黑羽停在低枝上。他喉间有一根灰白羽毛，像沾着一小片去年的雪。
        - {id: ch01-b06, speaker: rook, text: 你这么一直念，偷果子的连数都不用自己数了。}
        - {id: ch01-b07, speaker: narrator, text: 榛榛马上闭紧嘴，左右看了看。}
        - {id: ch01-b08, speaker: hazel, text: 你听见多少？, emotion: fearful}
        - {id: ch01-b09, speaker: rook, text: 从三十二到四十七。四十一，你还数了两遍。}
        - {id: ch01-b10, speaker: hazel, text: 我才没有。}
        - {id: ch01-b11, speaker: narrator, text: 黑羽歪了歪头。}
        - {id: ch01-b12, speaker: rook, text: 那大概是风数的。}
        - id: ch01-b13
          speaker: narrator
          text: |-
            榛榛不理他。她找来一块白色小石头，每藏十颗，就用爪尖在石边划一道。傍晚时，石头上有了六道细痕。她对着痕迹重新数，越数越觉得，自己已经把冬天关在门外了。

            第二天更冷。她从山毛榉跑到溪沟，又从刺莓丛跑到枯树坡，把橡果一颗颗埋进浅坑，再拨回落叶。有虫洞的，当场吃掉；裂了壳的，也不留。好果子才该等到下雪的时候。

            黑羽有时在天上跟着，有时落地啄甲虫。他从不替榛榛记数。等她第三次绕过同一根树桩，他才开口。
        - {id: ch01-b14, speaker: rook, text: 你今天还真喜欢这根木头。}
        - {id: ch01-b15, speaker: hazel, text: 我在找第五十八颗埋在哪儿了。}
        - {id: ch01-b16, speaker: rook, text: 你埋的时候没风。现在嘛，每片叶子都搬过家了。}
        - id: ch01-b17
          speaker: narrator
          text: |-
            榛榛扒开一处土，一看是空的，又赶紧盖回去。自己的尾巴把叶子扫得乱七八糟。她肚子里那只小兽，好像又挠了一下门。

            不行。她得做一张更可靠的地图。
    - id: ch02
      title: 一张会动的地图
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 榛榛没有纸，也用不着纸。她把林子分成几块：苔石这边，溪沟那边，倒木上边，还有荆棘后边。她在白石上多划几道，在树皮上咬出小缺口，又拿三根细枝搭成箭头，让尖头对着新埋的橡果。
        - {id: ch02-b02, speaker: hazel, text: 这下总不会丢了。}
        - {id: ch02-b03, speaker: narrator, text: 黑羽飞到一根箭头旁。风轻轻一推，最上面的细枝就滚了半圈。}
        - {id: ch02-b04, speaker: rook, text: 什么不会丢？}
        - {id: ch02-b05, speaker: narrator, text: 榛榛赶紧把细枝搬回去。}
        - {id: ch02-b06, speaker: hazel, text: 我的记号。}
        - id: ch02-b07
          speaker: narrator
          text: |-
            第三天夜里，下雨了。雨水顺坡往下冲，把浅坑拍紧，也把白石上的泥冲成细沟。刺莓丛下，一只田鼠闻见橡果，搬走两颗。倒木旁，还有只陌生松鼠挖出一颗，吃掉一半，又把剩下的埋去了更远的地方。

            天一亮，榛榛就冲出巢洞。三根枝条早散了。树皮上的缺口倒还在，可树下已经铺了厚厚一层黄叶。白石更麻烦：划痕有深有浅，多了一道水痕，还缺了一个小角。她数了又数。
        - {id: ch02-b08, speaker: hazel, text: 六，七……不对，这道是雨冲的，不算。八？这两道以前是不是一道？, emotion: fearful}
        - {id: ch02-b09, speaker: rook, text: 你要是在问石头，它今天可不太想说话。}
        - {id: ch02-b10, speaker: hazel, text: 我本来有九十颗。也可能是九十一颗。现在我不知道了。, emotion: fearful}
        - {id: ch02-b11, speaker: rook, text: 可你知道，饿的时候该去哪些地方找。}
        - {id: ch02-b12, speaker: hazel, text: 但我不知道每个地方有几颗！, emotion: angry}
        - {id: ch02-b13, speaker: narrator, text: 黑羽啄了啄湿叶下面露出来的橡果帽。}
        - {id: ch02-b14, speaker: rook, text: 冬天只要你找到吃的，又不会考你总数。}
        - id: ch02-b15
          speaker: narrator
          text: 榛榛听了更来气。这话好像有一点对，却没把她弄丢的数还回来。她叼起白石，想搬回树洞。可石头太重，才走三步就从嘴里掉下来，正砸在脚趾上。
        - {id: ch02-b16, speaker: hazel, text: 不许笑。, emotion: angry}
        - id: ch02-b17
          speaker: narrator
          text: |-
            黑羽把嘴藏进翅膀里，可两边肩膀还是抖了两下。

            那以后，榛榛更忙了。她照样分散藏果子，只是不再每一颗都回头画记号。她开始记粗大的树根、裂开的灰岩，还有长着三簇苔藓的树桩。她把鼻子贴近地面闻，也用爪子感觉泥土是新翻的还是旧的。脑子里的数偶尔溜走，她就从最后记得的地方接着数。有时接错了，有时，她索性不接了。

            一天下午，鹰的影子突然掠过林地。榛榛嘴里还叼着橡果，来不及逃回熟悉的树根，只能一头钻进矮灌木。她飞快挖坑，埋下橡果，压平泥土，再沿着石缝逃回树上。

            危险过去，她站在枝头往下看。风把灌木的叶子一簇簇翻过来，全是银白的背面。她知道橡果就在下面，却说不出究竟在哪一簇。
        - {id: ch02-b18, speaker: hazel, text: 一百零三。}
        - {id: ch02-b19, speaker: narrator, text: 她低声说完，停了一会儿。}
        - {id: ch02-b20, speaker: hazel, text: 也可能……是一百零二。}
        - {id: ch02-b21, speaker: narrator, text: 这一次，黑羽没有取笑她。他望了望远处越来越暗的云。}
        - {id: ch02-b22, speaker: rook, text: 先回窝吧。}
    - id: ch03
      title: 雪下的洞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            第一场雪很薄，只给枯叶描了一圈白边。榛榛一下就找到苔石边的橡果。她用前爪刨开松土，咬破硬壳。油润的果仁一入口，暖意就从舌根一直流到胸口。

            第二场雪盖住了低草。她在倒木旁找回两颗，在蕨根下面找到一颗。当然，也不是每次都找得着。有的坑只剩田鼠的小脚印；有的地方刨了半天，底下却是一块圆石头。不过，找到的总比没找到的多。

            真正的严寒来了。雪冻出一层硬壳，树枝轻轻一碰，就发出玻璃一样的脆响。一天早上，榛榛醒来，树洞里只剩几片啃干净的果壳。她先跑到白石旁边，挖得鼻尖全是雪，还是一颗也没有。
        - {id: ch03-b02, speaker: hazel, text: 不在这儿。, emotion: fearful}
        - {id: ch03-b03, speaker: narrator, text: 她喘着气。黑羽缩成一团，蹲在上面的树枝上。}
        - {id: ch03-b04, speaker: rook, text: 你还记得别的地方。}
        - id: ch03-b05
          speaker: narrator
          text: |-
            榛榛记得裂开的灰岩，可岩缝冻住了。她也记得三簇苔藓的树桩，可苔藓全让雪盖住了。她先往溪沟跑，忽然停下，又转去枯树坡。每个地方都像来过，又像从来没见过。

            就在这时，她想起一幅画面：鹰的影子，矮灌木，石缝，还有那些被风翻出银白背面的叶子。那里埋着一颗她怎么也数不准的橡果。
        - {id: ch03-b06, speaker: hazel, text: 那边。}
        - id: ch03-b07
          speaker: narrator
          text: |-
            雪把灌木压得很低。榛榛从第一簇挖到第二簇，只挖出冻硬的根。到了第三簇，爪尖终于碰到硬壳。

            那颗橡果还在。旁边竟然还有一颗。也许旁边那颗也是她藏的，也许是别的松鼠后来埋的。她没办法知道。榛榛把一颗推给黑羽。
        - {id: ch03-b08, speaker: rook, text: 乌鸦可不靠橡果过冬。}
        - {id: ch03-b09, speaker: hazel, text: 你也没少提醒我呀。}
        - {id: ch03-b10, speaker: rook, text: 提醒可不值半颗。}
        - {id: ch03-b11, speaker: hazel, text: 那你就欠我半颗。}
        - id: ch03-b12
          speaker: narrator
          text: |-
            黑羽这才叼起橡果，啄开一个口。他们蹲在被雪压低的灌木下，把果仁分着吃了。头顶的风还是那么冷，可榛榛肚子里那只挠门的小兽，终于安静了。

            冬天不会因为她数错了就放过她，也不会因为她数得认真，就特意为难她。她每天出门去找，靠记忆，也靠气味、树根，还有偶尔从雪里露出来的叶角。有些贮藏叫别的动物拿走了，有些连她自己也再没找到。可她把橡果分散在林子各处，一处空了，总还有下一处。

            雪最深的那个星期，她不再计算还剩多少颗。不是不在乎了。只是每找回一颗，她会先填饱肚子，再想好下一处往哪里走。
    - id: ch04
      title: 没有找回来的
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            春水开始在冰下哗哗响时，榛榛瘦了一圈，尾巴倒还是蓬蓬的。她在第一块露出来的土地上找到半颗发黑的橡果，嫌弃地推到一边。接着，她又在苔石旁找到秋天那块白石。雨和雪早把划痕磨得乱七八糟，再也数不出一个可靠的数。

            她把石头翻过来。下面没有橡果，只有一条受惊的蚯蚓，赶紧往土里缩。
        - {id: ch04-b02, speaker: rook, text: 你可以重新数春芽。}
        - {id: ch04-b03, speaker: hazel, text: 不数！, emotion: happy}
        - id: ch04-b04
          speaker: narrator
          text: |-
            她答得太快，自己先笑了。

            几天后，榛榛穿过枯树坡。四周都是湿泥和新叶的味道。倒木外侧，一根浅绿色的小芽弯弯地钻出土，顶上还扣着裂开的棕色果壳。榛榛停住了。那不是草。两片小叶子正慢慢张开，像一双刚从被窝里伸出来的手。

            她拨开旁边的叶子，又找到一株。溪沟上方还有一株。刺莓丛后面，两株挨得很近，其中一株的茎歪向阳光。
        - {id: ch04-b05, speaker: hazel, text: 谁把橡果埋在这里的？}
        - {id: ch04-b06, speaker: narrator, text: 黑羽从空中落下来，看看小芽，又看看她。}
        - {id: ch04-b07, speaker: rook, text: 林子里会埋橡果的，又不只你一个。}
        - id: ch04-b08
          speaker: narrator
          text: |-
            榛榛认得倒木，认得那块灰岩，也认得灌木后面的石缝。可一颗橡果裂开以后，根往下扎，芽往上长，她就再也认不出它了。也许有些是她忘掉的，也许有些叫别的动物搬过。还有些会被吃掉，或者熬不过干热的夏天。可眼前这几株，至少已经活到了春天的阳光里。

            她伸爪轻轻碰了碰最近的嫩叶，又马上缩回来。叶子很软，可细细的叶脉已经看得清清楚楚。
        - {id: ch04-b09, speaker: hazel, text: 它算谁的？}
        - {id: ch04-b10, speaker: rook, text: 你要是吃了，它就算午饭。你要是留下，它就算它自己的。}
        - id: ch04-b11
          speaker: narrator
          text: |-
            榛榛瞪了他一眼。这话还是有点像玩笑，也还是没替她找到答案。

            当天下午，大风吹过林地。一根断枝掉下来，正压在最小的幼苗旁边。榛榛已经跑过去了，可听见叶片擦地的沙沙声，又折回来。她咬住枝条末端，使劲往后拖。树枝比橡果重多了，她拖了三次，才给小芽让出一块空地。黑羽站在高处。
        - {id: ch04-b12, speaker: rook, text: 这是第一棵，还是第五棵？}
        - {id: ch04-b13, speaker: narrator, text: 榛榛坐在湿土上直喘气。幼苗在风里晃了一下，没有倒。}
        - {id: ch04-b14, speaker: hazel, text: 这一棵。}
        - id: ch04-b15
          speaker: narrator
          text: |-
            入夏以前，林下长满了高草。并不是每株幼苗都还在。溪沟边那株不见了，刺莓后的两株也只剩一株。倒木旁的那株长出更多叶子，从嫩黄变成深绿。榛榛常从上面的枝路经过。有时会停下来赶走啃叶子的毛虫；有时，就只是看上一眼。

            秋天又来了。老橡树再次开始落果。第一颗敲在树根上，滚进两片红叶中间，好像去年的那颗沿着原路回来了。

            榛榛捡起来，照旧掂了掂。很饱满，沉甸甸的，也没有虫洞。她叼着橡果跑过苔石，没有停；跑过白石，也没有停。最后，她在离老树更远的一块松土上挖了个浅坑，把橡果放进去，仔仔细细地盖好。黑羽从低枝上看着她。
        - {id: ch04-b16, speaker: rook, text: 不数了？}
        - id: ch04-b17
          speaker: narrator
          text: 榛榛用后脚踩平最后一小撮土。她看看四周的树根、石缝，还有被风翻动的叶子。然后，她又望了望倒木旁那棵小橡树。如今，小树已经长到她胸口那么高了。
        - {id: ch04-b18, speaker: hazel, text: 这一颗，我记得。}
        - {id: ch04-b19, speaker: narrator, text: 说完，她跑回老橡树下，去接下一颗。}
