audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: intimate fireside storytelling with gentle scene-level movement, timbre: warm and clear, pace: measured with easy breathing room, pitch: medium}
    hazel:
      display_name: Hazel
      tts: {delivery: "intent and quick-minded, tightening under worry and loosening with relief", timbre: young and bright, pace: moderately brisk, pitch: medium-high}
    rook:
      display_name: Rook
      tts: {delivery: spare and dryly amused with quiet concern underneath, timbre: low and lightly rough, pace: unhurried, pitch: medium-low}
  chapters:
    - id: ch01
      title: After One Hundred
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The first acorn fell while Hazel was hanging upside down from a white oak twig. It hit a root, bounced once, and rolled between two red leaves. Hazel sprang down and turned it over in her paws. Good shell. Nice and heavy.
        - {id: ch01-b02, speaker: hazel, text: One.}
        - id: ch01-b03
          speaker: narrator
          text: |-
            Another acorn thumped into the grass. Then another. Wind stirred the crown, and the old oak started shaking loose all the work of summer.

            Hazel still remembered the hungry stretch of last winter. Snow had sealed the ground. She'd dug in three places and found three empty holes. By nightfall, she was chewing bitter bark while her belly pinched tighter with every bite. This year, she wanted a wall of acorns between herself and that hunger. And a wall like that needed a number.

            She buried one acorn north of a mossy rock, one beside a fallen log, and another under some fern roots. Never too many in one place. A mouse, a squirrel, or any patient nose might find one store. But lots of little stores gave a thief lots of chances to fail.
        - {id: ch01-b04, speaker: hazel, text: "Seven, eight, nine."}
        - id: ch01-b05
          speaker: narrator
          text: After every shallow hole, Hazel tamped down the soil with her hind paws and pushed the count up by one. Rook watched from a low branch. He was an old crow, with a pale feather at his throat and a wash of blue across his folded wings.
        - {id: ch01-b06, speaker: rook, text: "Keep saying every number out loud, and the thieves won't have to count for themselves."}
        - {id: ch01-b07, speaker: narrator, text: Hazel clapped her mouth shut.}
        - {id: ch01-b08, speaker: hazel, text: "How much did you hear?", emotion: fearful}
        - {id: ch01-b09, speaker: rook, text: Thirty-two through forty-seven. You said forty-one twice.}
        - {id: ch01-b10, speaker: hazel, text: I did not.}
        - {id: ch01-b11, speaker: narrator, text: Rook tipped his head.}
        - {id: ch01-b12, speaker: rook, text: "Must've been the wind, then."}
        - id: ch01-b13
          speaker: narrator
          text: |-
            Hazel found a flat white stone. For every ten acorns she buried, she scratched one line along its edge. By dusk, six pale lines showed through the dirt. She counted them twice. Somehow, those marks made winter feel like something she could shut outside a door.

            The next morning was colder, and more nuts were falling. Hazel raced from the beeches to the creek bank, then from the briars to the slope with the dead oak. Every good acorn went into its own patch of soft earth. She ate one with a worm hole and another with a split shell. The sound ones were for snow.

            Sometimes Rook followed overhead. He never offered to remember anything. When Hazel passed the same stump for the third time, he finally spoke up.
        - {id: ch01-b14, speaker: rook, text: You're awfully fond of that piece of wood today.}
        - {id: ch01-b15, speaker: hazel, text: I'm looking for number fifty-eight.}
        - {id: ch01-b16, speaker: rook, text: There wasn't any wind when you buried it. Every leaf has moved since then.}
        - id: ch01-b17
          speaker: narrator
          text: Hazel dug under a red leaf, found nothing, and hurried to cover the hole again. The loose earth made her belly tighten, even though she'd eaten that morning. She needed a better map.
    - id: ch02
      title: A Map That Moved
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Hazel split the woods into pieces she could hold in her mind: this side of the mossy rock, the far side of the creek, above the fallen log, behind the briars. She added scratches to the white stone and nipped little notches into dead bark. For three new caches, she laid down twigs like arrows, each one pointing straight at hidden food."
        - {id: ch02-b02, speaker: hazel, text: There. Now nothing can get lost.}
        - {id: ch02-b03, speaker: narrator, text: Rook landed beside one of her arrows. A gust rolled the top twig halfway around.}
        - {id: ch02-b04, speaker: rook, text: "Nothing?"}
        - {id: ch02-b05, speaker: narrator, text: Hazel shoved the twig back into place.}
        - {id: ch02-b06, speaker: hazel, text: None of my signs.}
        - id: ch02-b07
          speaker: narrator
          text: |-
            That night, the rain came. Water ran down the slope, pressing some caches flat and carving little channels through others. A deer mouse smelled two acorns under the briars and carried them away. Near the fallen log, a strange squirrel dug up another one, ate half, and buried the rest beyond Hazel's usual path.

            At dawn, Hazel burst out of her nest. Her twig arrows had fallen apart. The bark notches were still there, but fresh yellow leaves covered the ground below. Mud streaked the white stone. One scratch had turned into a groove, and a corner was gone. Hazel touched the marks one by one.
        - {id: ch02-b08, speaker: hazel, text: "Six, seven—no, that's rain. That doesn't count. Eight? Wait. Were these two one line before?", emotion: fearful}
        - {id: ch02-b09, speaker: rook, text: The stone doesn't seem very talkative this morning.}
        - {id: ch02-b10, speaker: hazel, text: I had ninety acorns. Maybe ninety-one. Now I don't know., emotion: fearful}
        - {id: ch02-b11, speaker: rook, text: You still know where to look when you're hungry.}
        - {id: ch02-b12, speaker: hazel, text: But I don't know how many are in each place!, emotion: angry}
        - {id: ch02-b13, speaker: narrator, text: Rook pecked at an empty cap under a wet leaf.}
        - {id: ch02-b14, speaker: rook, text: "Winter asks for food, not a total."}
        - id: ch02-b15
          speaker: narrator
          text: That only made Hazel angrier. It was partly useful, but it didn't give back a single missing number. She tried to carry the white stone home. It was too heavy. On her third step, it dropped right on her toes.
        - {id: ch02-b16, speaker: hazel, text: Don't laugh., emotion: angry}
        - id: ch02-b17
          speaker: narrator
          text: |-
            Rook tucked his beak under one wing. His shoulders shook anyway.

            Hazel kept storing acorns, and she still spread them all over the woods. But she stopped going back to the stone for every ten. Instead, she learned the bend of a thick root, a split gray boulder, and a stump with three patches of moss. With her nose close to the ground, she could smell disturbed earth. With her paws, she could feel where the soil was soft. Sometimes the number slipped away, and she'd start again with the last one she trusted. Sometimes she started with the wrong one. And once, to her own surprise, she didn't start again at all.

            Late one afternoon, a hawk's shadow swept across the leaves. Hazel had an acorn in her mouth. There was no time to reach her usual trees, so she dove into low brush beside a shelf of rock. She dug, dropped the acorn, swept soil over it, and raced through a narrow crack to safety.

            When the danger passed, she looked down from a branch. Wind turned every clump of leaves silver-side up. She knew her acorn was down there. She just couldn't tell which clump held it.
        - {id: ch02-b18, speaker: hazel, text: One hundred three.}
        - {id: ch02-b19, speaker: narrator, text: She whispered the number. Then she waited.}
        - {id: ch02-b20, speaker: hazel, text: Or... one hundred two.}
        - {id: ch02-b21, speaker: narrator, text: "This time, Rook didn't tease her. He looked toward the darkening clouds."}
        - {id: ch02-b22, speaker: rook, text: Home first.}
    - id: ch03
      title: Holes Under Snow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            The first snow was thin. It only traced white edges around the fallen leaves. Hazel found the acorn beside the mossy rock right away. She scraped back the loose earth, cracked the shell, and ate until warmth spread from her tongue to her chest.

            The second snow covered the low grass. She found two acorns by the log and one under the fern roots. She didn't get it right every time. One empty hole had tiny mouse tracks beside it. One long dig ended at a round stone. Still, she found more than she missed.

            Then deep winter came. The snow froze into a hard crust, and twigs rang like glass when the wind knocked them together. One morning, Hazel woke to a nest that held only clean, empty shells. She went straight to the white stone. She dug until snow clung to her whiskers, but there wasn't an acorn anywhere.
        - {id: ch03-b02, speaker: hazel, text: Wrong place., emotion: fearful}
        - {id: ch03-b03, speaker: narrator, text: She was panting now. Rook huddled on a branch above her.}
        - {id: ch03-b04, speaker: rook, text: You remember other places.}
        - id: ch03-b05
          speaker: narrator
          text: "Hazel remembered the split boulder, but ice filled the crack. She remembered the stump with three patches of moss, but snow hid every patch. She ran toward the creek, stopped, and turned for the dead-oak slope. Every place looked almost familiar and completely strange. Then a picture came back to her: the hawk's shadow, the low brush, the shelf of rock, and leaves flashing silver in the wind. Somewhere there was an acorn whose number had never stayed still."
        - {id: ch03-b06, speaker: hazel, text: There.}
        - id: ch03-b07
          speaker: narrator
          text: Snow had pressed the brush close to the ground. Under the first clump, Hazel found frozen roots. Under the second, a curled leaf. At the third, one claw tapped a shell. Her acorn was still there. And right beside it lay another. Maybe she'd buried both. Maybe another squirrel had moved the second one. The woods hadn't kept a label. Hazel pushed one acorn toward Rook.
        - {id: ch03-b08, speaker: rook, text: Crows don't live on acorns.}
        - {id: ch03-b09, speaker: hazel, text: You did help me remember.}
        - {id: ch03-b10, speaker: rook, text: A reminder isn't worth half an acorn.}
        - {id: ch03-b11, speaker: hazel, text: Then you owe me half.}
        - id: ch03-b12
          speaker: narrator
          text: |-
            Rook opened the shell with his beak. They crouched under the snowy brush and shared the nut. The wind above them was still cold, but the hard little fist in Hazel's belly finally let go.

            Winter didn't spare her because she'd counted carefully, and it didn't punish her because the count had failed. Every day, she searched with her memory and her nose, with the shapes of roots and whatever edge of leaf the wind uncovered. Some stores had been taken. Some she never found. But because she'd scattered the caches, one empty hole never emptied them all.

            During the deepest week of snow, Hazel stopped trying to figure out how many were left. It wasn't that she didn't care. When she found an acorn, she ate. Then she chose the next place to look.
    - id: ch04
      title: What Stayed Lost
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When water started talking under the creek ice, Hazel was lean, but her tail was still full. On the first patch of bare earth, she uncovered half a blackened acorn and pushed it away. Then, near the mossy rock, she found her white stone. Rain and ice had softened some scratches and crossed others. There wasn't one honest total left on it. Hazel turned the stone over. No acorn. Just a startled earthworm slipping back into the dark.
        - {id: ch04-b02, speaker: rook, text: You could start over and count spring buds.}
        - {id: ch04-b03, speaker: hazel, text: No., emotion: happy}
        - id: ch04-b04
          speaker: narrator
          text: |-
            The answer came out so fast, Hazel laughed.

            A few days later, she crossed the dead-oak slope through the smell of wet soil and opening leaves. On the far side of the fallen log, a hooked green shoot had pushed out of the ground. A split brown shell still clung to the top. Hazel stopped. This wasn't grass. Two new leaves were opening like paws reaching out of bed.

            She brushed aside the leaves nearby and found a second shoot. A third stood above the creek. Behind the briars, two grew close together, and one leaned toward the light.
        - {id: ch04-b05, speaker: hazel, text: "Who put acorns there?"}
        - {id: ch04-b06, speaker: narrator, text: Rook dropped out of the sky and studied the shoots.}
        - {id: ch04-b07, speaker: rook, text: You're not the only creature who buries them.}
        - id: ch04-b08
          speaker: narrator
          text: Hazel knew the log, the split boulder, and the narrow shelf of rock by the brush. But once an acorn cracked open, sent down a root, and lifted leaves into the light, she couldn't recognize it anymore. Some shoots might have come from caches she'd forgotten. Other nuts might have been moved by thieves or buried by strangers. Some would be eaten. Some wouldn't survive a dry summer. But these few had made it into the spring light. Hazel touched the nearest leaf, then pulled her paw back. It was tender, but every vein already showed.
        - {id: ch04-b09, speaker: hazel, text: "Who does it belong to?"}
        - {id: ch04-b10, speaker: rook, text: "If you eat it, it belongs to lunch. If you leave it, it belongs to itself."}
        - id: ch04-b11
          speaker: narrator
          text: Hazel glared at him. It sounded like another joke, and it still didn't answer her question. That afternoon, a hard wind swept through the woods. A dead branch fell beside the smallest seedling and pinned its outer leaves to the ground. Hazel had already run past when she heard them scrape. She turned back, caught the narrow end in her teeth, and pulled. It was much heavier than an acorn. It took three tries to clear a patch around the little oak. Rook watched from above.
        - {id: ch04-b12, speaker: rook, text: "Was that the first tree or the fifth?"}
        - {id: ch04-b13, speaker: narrator, text: "Hazel sat in the damp earth, breathing hard. The seedling rocked in the wind, but it stayed upright."}
        - {id: ch04-b14, speaker: hazel, text: This one.}
        - id: ch04-b15
          speaker: narrator
          text: |-
            By early summer, tall grass filled the open places. Not every seedling was still there. The one above the creek was gone, and only one of the pair behind the briars had survived. The oak beside the fallen log grew more leaves, turning from yellow-green to deep green. Hazel often passed along the branches above it. Sometimes she stopped to knock away a leaf-eating caterpillar. Sometimes she only looked.

            Autumn came back, and the old white oak began dropping acorns again. The first one struck a root and rolled between two red leaves, as if last year's nut had found its way back.

            Hazel picked it up and weighed it in her paws. Heavy. Sound. No worm hole. She carried it past the mossy rock without stopping. She passed the white stone too. Farther from the old oak, she found a patch of loose earth, dug a shallow hole, and covered the acorn with care. Rook watched from a low branch.
        - {id: ch04-b16, speaker: rook, text: "No number?"}
        - id: ch04-b17
          speaker: narrator
          text: Hazel pressed the last bit of soil into place. She looked at the roots, the shelf of rock, and the leaves shifting in the wind. Then she looked at the young oak beside the fallen log. By now, it stood as high as her chest.
        - {id: ch04-b18, speaker: hazel, text: I remember this one.}
        - {id: ch04-b19, speaker: narrator, text: Then she ran back to the old tree to catch the next one.}
