        timbre: 粗硬的成年男声
        pace: 快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第五章　村中之战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这处境真是糟透了。四个本该住在一九〇五年伦敦的英国孩子，此刻却被扔在公元前六千年的埃及，既没有办法回到自己的时代，也没有办法回到自己的家。他们连东方都找不到。偏偏从前有个爱管闲事的人告诉过西里尔，太阳其实并不是真的从东边升起，也不是真的在西边落下。现在就算抬头看太阳，也判断不了方向。更糟的是，赛米德趁大家不留神钻出鲈鱼篮，竟卑鄙地把他们丢下，独自跑了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            敌人正在逼近，战斗就要开始，而战斗是会死人的。孩子们一点也不喜欢自己也要参战这个念头。报信的男人还趴在沙地上喘气，长长的红舌头像狗一样垂在嘴外。村民急忙从一大堆荆棘里拖出刺丛，用长杆把一团团带刺的枝条挑起来，塞紧篱笆上的缺口。那堆荆棘显然早就备在那里，专等这种时候派上用场。他们挑刺丛的样子，就像如今家乡的人用草叉挑起干草。简咬住嘴唇，努力不让自己哭出来。罗伯特摸出玩具手枪，在里面装上一枚粉红纸火帽，那就是他唯一的武器。西里尔把腰带收紧两格。安西娅却还惦记着花。她摘下大家扣眼里蔫了的红玫瑰，咬去茎梢，把花插进茅屋门边阴影下的一只水罐里。她一向就是这样，对花总有些傻里傻气的怜爱。
        - id: ch01-b03
          speaker: anthea
          text: >-
            你们听我说。赛米德也许是在替我们安排什么。它不会真的把我们独自扔在过去，我敢肯定它不会。
        - id: ch01-b04
          speaker: narrator
          text: 简总算忍住了眼泪，至少眼下忍住了。
        - id: ch01-b05
          speaker: robert
          text: 可是，我们现在能做什么？
        - id: ch01-b06
          speaker: cyril
          text: >-
            什么也做不了，只能留心看、仔细听。那个报信的人已经缓过气了，咱们去听听他怎么说。
        - id: ch01-b07
          speaker: narrator
          text: 报信人跪起身，坐在脚后跟上，随后站起来。向村中首领恭敬问候过后，他终于说起真正要紧的事。
        - id: ch01-b08
          speaker: messenger
          text: >-
            我乘木筏顺流走了一个时辰，出去设套捕捉朱鹭。我布好套子等着，忽然听见许多翅膀拍动。抬头一看，一大群鹭在空中盘旋，它们很害怕。一头野兽突然出现，只能吓起一只鹭，吓不住整群鹭。可是它们怎么都不肯落下。我便知道，惊动它们的一定是人，而且不懂得像我们这样悄悄接近鸟兽。那些人不是我们的族类，也不是此地的人。我丢下木筏，沿河岸潜行，终于看见了他们。他们多得像沙漠里的沙，矛尖红得像太阳。他们十分可怕，正在向我们进发。我看清以后一路奔跑，直到来到你们面前。
        - id: ch01-b09
          speaker: headman
          text: 那些人是你们的同族！你们是替他们来窥探我们的！
          emotion: angry
        - id: ch01-b10
          speaker: cyril
          text: >-
            才不是！我们绝不会替任何人当探子。那些人肯定一点也不像我们。是不是？
          emotion: angry
        - id: ch01-b11
          speaker: messenger
          text: >-
            不像。他们脸色黝黑，头发黑得像夜。不过，这几个陌生孩子也许是他们的神，先来替他们开路。
        - id: ch01-b12
          speaker: narrator
          text: 人群中立刻响起一阵不安的低语。
        - id: ch01-b13
          speaker: cyril
          text: 不，不是这么回事！我们和你们站在一起，还会帮你们守住神圣的东西。
        - id: ch01-b14
          speaker: narrator
          text: 西里尔竟知道这里有神圣之物需要守护，首领似乎很受触动。他端详了孩子们片刻。
        - id: ch01-b15
          speaker: headman
          text: 很好。所有人都来献上供物，让我们在战斗中变得强大。
        - id: ch01-b16
          speaker: narrator
          text: >-
            人群散开。九名披着羚羊皮的男人聚在村子中央那道篱笆入口前。人们一个接一个送来河马肉、鸵鸟羽毛、椰枣树的果实、红色粉笔、绿色粉笔、河里的鱼和山里的野山羊。首领一一收下。外层篱笆里面还有一道篱笆，两者相隔大约一码，中间留出一条通道。几位首领不时捧着满手供物消失在通道里，过一会儿再两手空空地回来。
        - id: ch01-b17
          speaker: anthea
          text: 他们在给护身符献祭。我们最好也送点东西。
        - id: ch01-b18
          speaker: narrator
          text: >-
            大家连忙翻遍口袋，只找出一截粉红丝带、一小块封蜡，还有沃特伯里怀表的一个零件。罗伯特在圣诞节时实在忍不住，把那只表拆开了，此后一直没空装回去。多数男孩手里都有一只处于这种状态的表。他们郑重献上这些东西，安西娅又把刚刚救活的红玫瑰添了进去。收取供物的首领满怀敬畏地看着它们，尤其敬畏那几朵鲜红的花和奇异的怀表零件。
        - id: ch01-b19
          speaker: headman
          text: >-
            今天的奇事太多，我再也装不下更多惊讶。我们族中的少女说，你们与我们已经结下和平。若不是敌人将至，我们原该把这事查个明白。
        - id: ch01-b20
          speaker: narrator
          text: 孩子们一听，全都打了个寒战。
        - id: ch01-b21
          speaker: headman
          text: 现在回答。你们是不是站在我们这一边？
        - id: ch01-b22
          speaker: robert
          text: >-
            是啊！我不是一直这么说吗？我给你一个证明。看见这东西了吗？我要对它说话。它若回答，你就知道我们是来守护你们那件神圣宝物的，就是我们刚献过供物的那一件。
        - id: ch01-b23
          speaker: headman
          text: 你手中拿着神的形象。它只对你说话，还是我也能听见？
        - id: ch01-b24
          speaker: robert
          text: 等你听见，一定会吓一跳。好啦，现在听着。
        - id: ch01-b25
          speaker: robert
          text: >-
            如果我们应当守护里面的神圣宝物，请用洪亮的声音回答，我们一定听命。
        - id: ch01-b26
          speaker: narrator
          text: >-
            罗伯特扣动扳机，纸火帽砰地炸响。这把手枪值两先令，纸火帽也十分上等，声音自然响得很。全村男女老少都脸朝下扑倒在沙地上。接受考验的首领最先站起来。
        - id: ch01-b27
          speaker: headman
          text: 神已经开口。带他们到神圣之物的前厅去。
        - id: ch01-b28
          speaker: narrator
          text: >-
            四个孩子被人领着穿过外层篱笆的入口，沿通道一路绕行，直到内层篱笆的一处缺口。他们从那里穿过去，又进入另一条通道。整座设施就像一座迷宫，所有墙壁都是用干灌木和尖利的荆棘搭成的。
        - id: ch01-b29
          speaker: anthea
          text: 真像汉普顿宫的迷宫。
        - id: ch01-b30
          speaker: narrator
          text: 通道全都露着天空，只有正中的小屋盖了圆顶，门口挂着一幅兽皮帘子。
        - id: ch01-b31
          speaker: headman
          text: 你们可以在这里等，但绝不能越过帘子。
        - id: ch01-b32
          speaker: narrator
          text: 带路的首领自己掀开帘子，走进去不见了。
        - id: ch01-b33
          speaker: cyril
          text: 我们是不是该留几个人在外面？万一赛米德回来呢？
        - id: ch01-b34
          speaker: anthea
          text: >-
            无论如何都别再分开。和赛米德走散已经够糟了。那个人还在里面，我们现在什么也做不了，不如一起回村子。既然认得路，待会儿还能回来。真打起来，那个人多半也得出去作战。找到赛米德，我们就马上回家。天一定不早了，我也不喜欢这座绕来绕去的迷宫。
        - id: ch01-b35
          speaker: narrator
          text: >-
            他们出去告诉首领，等战斗开始，自己会来守护宝物。接着，他们终于有机会四处看看，亲眼看见一位一流的燧石工匠怎样敲剥石片，再在箭头和斧刃上凿出缺口。如今活着的人里，再没有谁享受过这种眼福。男孩们尤其喜欢那些武器。所谓箭头并不是装在弓箭上的，而是装在用手投掷的标枪上。主要武器是一块石头绑在一根不太长的木棍上，很像拦路勒索犯横行的年代里，绅士们随身携带、称作防身棍的东西。此外还有像长矛和骑枪一样的长武器，上面装着锋利得吓人的燧石刀，以及沉重的燧石战斧。全村人都忙起来，女人和孩子也不例外。整个村子简直像一座被人无意间踩了一脚的蚁穴。
        - id: ch01-b36
          speaker: narrator
          text: >-
            忽然，整片空气都烧得通红发亮，仿佛伍尔维奇兵工厂的熔炉门猛地打开。你若有幸被人带去那里，便会见到那种景象。几乎就在下一刻，熔炉门仿佛又猛地合上了。太阳已经落下，黑夜来了。八千年前的埃及太阳就是这样说落便落，我相信它直到今天也没能改掉这个习惯，每天还是以一模一样的方式下山。远古女孩拿来几张野鹿皮，领孩子们来到一堆干莎草旁。
        - id: ch01-b37
          speaker: ancient_girl
          text: 我父亲说，他们现在不会进攻。睡吧！
        - id: ch01-b38
          speaker: narrator
          text: >-
            这主意其实很好。你也许会以为，四面都是危险，孩子们一定睡不着。可不知为什么，尽管他们时不时还会害怕，心底深处却渐渐生出一种几乎藏得看不见的感觉。他们越来越相信赛米德值得信任，也相信自己其实会平安无事。这当然没有让害怕消失。他们依旧怕到了所能忍受的最大程度，只不过还没怕得彻底难受罢了。
        - id: ch01-b39
          speaker: robert
          text: >-
            咱们还是睡吧。我们整夜不回家，真不知道可怜的老保姆怎么办。她大概会叫警察来找。眼下要是真有十来个警察找到这里，那可太好了。不过光着急也没用。晚安。
        - id: ch01-b40
          speaker: narrator
          text: >-
            大家全睡着了。后来，一阵悠长、响亮而可怕的声音把他们惊醒。凶狠的呼喊、尖叫和号叫仿佛同时从四面八方涌来。西里尔后来形容，那声音像一群人渴望喝到仇敌的血。
        - id: ch01-b41
          speaker: ancient_girl
          text: >-
            是陌生人在叫。他们攻打围墙，被荆棘挡了回去。我父亲说，天亮以前他们不会再攻。现在大喊，只是为了吓唬我们。说得好像我们才是野蛮人！他们这些住在沼泽里的家伙！
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: >-
            可怕的喧声持续了一整夜。太阳像落下时一样猛地升起，叫喊也突然停止。孩子们还没来得及为这片安静高兴，成群的标枪已经呼啸着越过巨大的荆棘篱笆。大家赶忙躲到茅屋后面。下一刻，另一阵武器又从相反方向飞来，众人只好奔向另一处掩蔽。西里尔从身旁那间茅屋的屋顶拔下一支标枪，发现枪头不是燧石，而是打磨得闪闪发亮的铜。
        - id: ch01-b43
          speaker: narrator
          text: >-
            喊杀声再次响起，干荆棘也噼啪断裂。敌人正在拆毁篱笆。村民全涌向声音传来的地方，把石块和装着燧石尖头的短箭越过篱笆扔出去。孩子们第一次看见战斗的光在人的眼里燃烧。那景象陌生又可怕，叫人喉咙里怪怪地发紧，和家乡画报里的战争图画完全不同。石雨似乎把围攻的人逼退了，守村的人才来得及喘一口气，另一边又响起喊声和荆棘断裂声。人群赶紧奔去防守，战斗就这样在村子两边来回摆动。守村的人不懂得像敌人那样分兵，只能全体随着战况在村中奔来奔去。
        - id: ch01-b44
          speaker: narrator
          text: 西里尔发现，战士们不时走进迷宫。再出来时，他们脸色更明亮，神情更勇敢，腰杆也挺得更直。
        - id: ch01-b45
          speaker: cyril
          text: 他们一定是去摸护身符。赛米德说过，那东西能让人勇敢。
        - id: ch01-b46
          speaker: narrator
          text: >-
            孩子们悄悄穿过一道道通道，走进迷宫深处，躲在一旁观察。西里尔果然猜对了。一名首领守在兽皮帘前。每位战士来到他面前，他都会低声念一句孩子们听不清的话，再用手中某件看不见的东西碰一碰战士的额头。那件东西一直被他的手掌遮着，可孩子们透过首领的指缝，看见熟悉的红石头闪了一下。
        - id: ch01-b47
          speaker: narrator
          text: 篱笆外战况正烈，忽然响起一声凄厉的大喊。
        - id: ch01-b48
          speaker: villager_1
          text: 他们进来了！他们进来了！篱笆倒了！
          emotion: fearful
        - id: ch01-b49
          speaker: narrator
          text: 首领立刻钻进鹿皮帘子后面。
        - id: ch01-b50
          speaker: anthea
          text: 他去藏护身符了。亲爱的赛米德，你怎么能丢下我们！
        - id: ch01-b51
          speaker: narrator
          text: >-
            小屋里突然传出尖叫。首领脸色惨白，踉踉跄跄地逃出迷宫。孩子们也吓得面无人色。
        - id: ch01-b52
          speaker: anthea
          text: 那是什么？究竟是什么？赛米德，你怎么能这样！怎么能这样！
          emotion: fearful
        - id: ch01-b53
          speaker: narrator
          text: 四周的战斗声一阵低落，一阵凶猛高涨，仿佛海浪起起伏伏。安西娅打着寒战，又呼唤赛米德。
        - id: ch01-b54
          speaker: anthea
          text: 赛米德！赛米德！
          emotion: fearful
        - id: ch01-b55
          speaker: psammead
          text: 怎么啦？
        - id: ch01-b56
          speaker: narrator
          text: >-
            一个轻快的声音刚刚答完，一只毛茸茸的手便掀起兽皮帘的一角。赛米德的蝙蝠耳朵和蜗牛眼睛从后面探了出来。安西娅一把将它抱进怀里，四个孩子全都如释重负，仿佛同时吐出了一口憋了许久的气。
        - id: ch01-b57
          speaker: anthea
          text: 东方到底是哪一边？快告诉我！
        - id: ch01-b58
          speaker: narrator
          text: 安西娅说得飞快，因为疯狂的厮杀声越来越近。
        - id: ch01-b59
          speaker: psammead
          text: 别勒死我。先进来。
        - id: ch01-b60
          speaker: narrator
          text: 小屋里伸手不见五指。
        - id: ch01-b61
          speaker: cyril
          text: 我带了火柴。
        - id: ch01-b62
          speaker: narrator
          text: 西里尔划亮火柴，照见地面上松软散碎的沙子。
        - id: ch01-b63
          speaker: psammead
          text: >-
            我一直在这里睡觉，舒服极了。这是我一个月来睡过最好的沙子。放心，一切都没事。我早知道，你们只有趁战斗打起来才有机会。那个男人不会再回来。我咬了他，他以为我是恶灵。现在拿上东西，走吧。
        - id: ch01-b64
          speaker: narrator
          text: >-
            屋子四壁挂满兽皮。昨夜村民送来的供物高高堆在正中央，安西娅那几朵正在凋谢的红玫瑰还压在最上面。屋子一侧立着一块很大的方形石台，石台上放着一只长方形陶盒，盒面画着形状古怪的人和野兽。赛米德伸出一根瘦骨嶙峋的手指，直直指向陶盒。
        - id: ch01-b65
          speaker: cyril
          text: 护身符在盒子里面？
        - id: ch01-b66
          speaker: psammead
          text: >-
            你自己判断。我跳出来咬那个人的时候，他正要把盒子埋进沙子。
        - id: ch01-b67
          speaker: anthea
          text: 罗伯特，再点一根火柴。快点，东方究竟是哪边？
        - id: ch01-b68
          speaker: psammead
          text: 当然是太阳升起的地方！
        - id: ch01-b69
          speaker: anthea
          text: 可是以前有人告诉过我们，太阳根本不是这样升起的。
        - id: ch01-b70
          speaker: psammead
          text: 嗐，别人什么话都说得出来！
        - id: ch01-b71
          speaker: narrator
          text: 赛米德不耐烦地钻进鲈鱼篮，用防水布把自己包好。
        - id: ch01-b72
          speaker: jane
          text: 可我们在屋里看不见太阳，而且现在太阳也没有升起来呀。
        - id: ch01-b73
          speaker: psammead
          text: 你们真会浪费时间！东方就是神龛那边。那里！
        - id: ch01-b74
          speaker: narrator
          text: >-
            它指向大石台。呼喊声和石头撞击金属的声音越来越近。首领们已经围住小屋，要尽量守住宝物。可是刚才赛米德狠狠咬了一个首领，再也没人敢进屋。
        - id: ch01-b75
          speaker: cyril
          text: 简，我拿古代护身符。你准备举起我们的护符。过拱门时千万抓紧，绝不能松手。
        - id: ch01-b76
          speaker: narrator
          text: >-
            西里尔刚迈出一步，头顶就响起一阵巨大的碎裂声，阳光猛然灌进来。屋顶一侧被捅破，两根长矛插进洞里，正把一大片一大片的屋顶向外挑走。孩子们迎着突然出现的强光发抖眨眼，一时间什么也看不清。几只黝黑的大手已经扯倒一面墙，一张深色的脸从缺口上方望进来，鼻子又大又肉鼓鼓的。即使在这可怕的关头，安西娅仍有工夫想到，那张脸很像雅各布·阿布萨伦先生，就是在查令十字街附近那家铺子里，把护符卖给他们的人。
        - id: ch01-b77
          speaker: enemy_warrior
          text: >-
            他们的护身符在这里！就是它让他们勇于战斗，也敢于赴死。这里还有什么？是神，还是恶魔？
        - id: ch01-b78
          speaker: narrator
          text: >-
            敌方战士凶狠地瞪着孩子，眼白白得吓人，牙齿间还咬着一把沾湿的红色铜刀。一刻也不能耽搁了。
        - id: ch01-b79
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: 简！简！快！
          emotion: fearful
        - id: ch01-b80
          speaker: narrator
          text: >-
            简用发抖的双手把护符朝东方举起，西里尔立刻念出力量之名。护身符越长越大，变成一座巨大的拱门。门外仍是刺眼的埃及天空、被拆开的墙壁和那张残酷、黝黑、大鼻子的脸，闪亮的牙齿间还咬着那把湿漉漉的红刀。门内却完全是另一番光景，那里只有伦敦草木暗淡而浅浅的绿褐色。
        - id: ch01-b81
          speaker: cyril
          text: 简，抓紧！
        - id: ch01-b82
          speaker: narrator
          text: >-
            西里尔冲进拱门，拖着安西娅和赛米德一同过去。罗伯特紧紧抓住简，也跟在后面。每个人穿过护符拱门时，耳边战斗的喧声和狂怒都在顷刻间彻底消失。他们只听见巨大伦敦低沉、模糊而不满的嗡鸣，听见麻雀在碎石路上啄啄拍拍，也听见衣衫褴褛的小娃娃在枯黄而被踩坏的草地上玩《玫瑰花环》的声音。护符在简手中重新变小。午饭篮和奶油小面包还好端端地留在原处，和他们离开时一模一样。
        - id: ch01-b83
          speaker: cyril
          text: 我的天！这才算一场真正的冒险。
          emotion: surprised
        - id: ch01-b84
          speaker: psammead
          text: 的确颇有几分冒险的样子。
        - id: ch01-b85
          speaker: narrator
          text: 大家静静躺着，呼吸摄政公园里安全而安宁的空气。
        - id: ch01-b86
          speaker: anthea
          text: >-
            咱们最好马上回家。老保姆肯定急坏了。太阳看起来还和昨天出发时差不多，我们已经离开二十四小时了。
        - id: ch01-b87
          speaker: cyril
          text: 小面包还软着。我想是露水让它们一直这么新鲜。
        - id: ch01-b88
          speaker: narrator
          text: >-
            说来也怪，经历了这么久，他们竟然一点也不饿。孩子们从草地上爬起来，提起装午饭的篮子，又带上装赛米德的篮子，离开摄政公园，一路没有停留，也没有绕路，径直回家。老保姆一见他们这么快回来，惊讶地迎了出来。
        - id: ch01-b89
          speaker: old_nurse
          text: 哎哟，我可真没见过！出什么事了？你们这么快就玩腻了野餐。
        - id: ch01-b90
          speaker: narrator
          text: >-
            孩子们以为她在挖苦。所谓挖苦，就是故意说出和心意相反的话，让人不痛快。比如你的脸明明脏兮兮的，别人偏说你看起来真干净。
        - id: ch01-b91
          speaker: anthea
          text: 我们真的很抱歉……
        - id: ch01-b92
          speaker: old_nurse
          text: >-
            哎呀，孩子，我才不在乎！你们自己高兴，我就高兴。进来舒舒服服吃午饭吧，我正煮着一个土豆呢。
        - id: ch01-b93
          speaker: narrator
          text: >-
            老保姆转身去照看锅里的土豆，孩子们留在原地面面相觑。难道她的性情竟然变了这么多？他们整整二十四小时没有回家，实际上还在外面过了一夜，而且什么解释也没给，她居然完全不在乎，也没有追问半句？
        - id: ch01-b94
          speaker: psammead
          text: >-
            怎么啦？你们还不懂吗？你们从护符拱门回来时，正好还是出发的那一刻。现在并不是明天！
        - id: ch01-b95
          speaker: jane
          text: 那现在还是昨天吗？
        - id: ch01-b96
          speaker: psammead
          text: >-
            不，是今天。一直都是今天。可不能把现在和过去搅在一起，从这边剪下一块，再硬塞到那边去。
        - id: ch01-b97
          speaker: jane
          text: 那么，刚才整场冒险一点时间也没花？
        - id: ch01-b98
          speaker: psammead
          text: 你愿意这么说也行。反正现代的时间一点没过去。
        - id: ch01-b99
          speaker: narrator
          text: >-
            当天傍晚，安西娅说服杂役女仆比阿特丽斯，让自己把一块牛排送上楼，给学者先生当晚饭。比阿特丽斯正是送她蓝石手镯的人。学者先生特意请安西娅留下，于是他坐在那里吃晚饭时，她便从头到尾把整场冒险讲了一遍。
        - id: ch01-b100
          speaker: anthea
          text: >-
            今天下午，我们发现自己站在尼罗河岸边。后来，我们终于想起回来的办法。一眨眼又回到了摄政公园，而且一点时间也没有过去。
        - id: ch01-b101
          speaker: narrator
          text: >-
            她从尼罗河岸边的开头一直讲到回到摄政公园的结尾，只瞒下护符和赛米德，因为这两件事不许对任何人提起。即便少了这两件最神奇的东西，故事本身仍旧奇妙得很，学者先生听着听着便完全入了迷。
        - id: ch01-b102
          speaker: learned_gentleman
          text: 你真是个非同寻常的小姑娘。这些事情是谁告诉你的？
        - id: ch01-b103
          speaker: anthea
          text: 没有谁告诉我。事情就是这样发生了。
        - id: ch01-b104
          speaker: learned_gentleman
          text: 原来，这就叫假想游戏……
        - id: ch01-b105
          speaker: narrator
          text: >-
            他慢慢念出这个词，像一个终于想起并说出久已遗忘词语的人。安西娅离开后，他仍独自在椅子上坐了很久。最后，他猛然一惊，这才回过神来。
        - id: ch01-b106
          speaker: learned_gentleman
          text: >-
            我确实该休个假了，我的神经准是出了毛病。我竟然清清楚楚地觉得，楼下的小姑娘刚刚走进来，把前王朝时期的埃及生活讲得又连贯又生动，而且正和我的设想一样。人的心智真会捉弄人！以后可得多加小心。
        - id: ch01-b107
          speaker: narrator
          text: >-
            他认认真真吃完了剩下的面包，竟然真的放下书本，出门走了整整一英里，一步不少地走完了这段路。直到散步回来，他才重新坐到书桌前，继续自己的工作。
