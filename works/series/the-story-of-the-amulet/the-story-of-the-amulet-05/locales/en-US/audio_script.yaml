  chapters:
    - id: ch01
      title: THE FIGHT IN THE VILLAGE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The four English children were in a horrible position. Their proper date was A.D. 1905, and their proper address was London. Yet here they were in Egypt in 6000 B.C., with no way back to their own place and time. They needed to find the East, but none of them knew which way it was. The sun could not help just then. Besides, some meddlesome person had once told Cyril that it did not truly rise in the East or set in the West anyway.
        - id: ch01-b02
          speaker: narrator
          text: Worse still, the Psammead had slipped out of the bass-bag when no one was looking and deserted them. An enemy was coming, and there would be a fight. People were killed in fights. The idea of taking part in one did not appeal to the children at all.
        - id: ch01-b03
          speaker: narrator
          text: The runner who had brought the warning still lay panting on the sand, his long red tongue hanging out like a dog's. All around him, the villagers hurried to close gaps in the fence. A heap of clustered thornbushes had been piled there ready for just such a danger. The villagers used long poles to lift them, much as people at home lifted hay with a fork.
        - id: ch01-b04
          speaker: narrator
          text: Jane bit her lip and tried to decide not to cry. Robert searched his pocket for his only weapon, a toy pistol, and loaded it with a pink paper cap. Cyril tightened his belt by two holes. Anthea hardly seemed to notice what she was doing. She collected the drooping red roses from everyone's buttonholes, bit the ends of their stems, and placed them in a pot of water in the shade of a hut. She always cared rather too much about flowers.
        - id: ch01-b05
          speaker: anthea
          text: Listen. Perhaps the Psammead is arranging something for us. I can't believe it would leave us alone in the Past. I'm sure it wouldn't.
        - id: ch01-b06
          speaker: narrator
          text: Jane managed not to cry, at least for the moment.
        - id: ch01-b07
          speaker: robert
          text: But what are we supposed to do?
        - id: ch01-b08
          speaker: cyril
          text: Nothing except watch and listen. Look, that runner can breathe again. Let's hear what he has to say.
        - id: ch01-b09
          speaker: narrator
          text: The runner first pushed himself up onto his knees and sat back on his heels. When he had recovered enough breath, he stood before the leaders of the village. He began with the respectful words their position required. Then his report reached the part that mattered to the children.
        - id: ch01-b10
          speaker: runner
          text: I took my raft an hour upstream to set snares for ibises. While I waited, I heard many wings. A whole flock of herons circled overhead, too frightened to land. One beast might startle one bird, but it could not frighten an entire flock. So I knew men were coming, men who did not move quietly as our people do when hunting.
        - id: ch01-b11
          speaker: runner
          text: I left my raft and crept along the riverbank until I found the strangers. They are as many as the sands of the desert, and their spearheads shine red in the sun. They are terrible people, and they are marching toward us. Once I had seen them, I ran here without stopping.
        - id: ch01-b12
          speaker: headman
          text: They are your people! You came here to spy for them.
          emotion: angry
        - id: ch01-b13
          speaker: cyril
          text: We did not! We would never be spies. Those people aren't anything like us, are they?
          emotion: angry
        - id: ch01-b14
          speaker: runner
          text: No. Their faces are dark, and their hair is black as night. But perhaps these strange children are their gods, sent ahead to prepare the way.
        - id: ch01-b15
          speaker: narrator
          text: A murmur passed through the crowd.
        - id: ch01-b16
          speaker: cyril
          text: No, no! We're on your side. We'll help guard your sacred things.
        - id: ch01-b17
          speaker: narrator
          text: The headman stared at the children. He seemed impressed that Cyril knew there were sacred things to guard.
        - id: ch01-b18
          speaker: headman
          text: Good. Now everyone must bring an offering so that we will be strong in battle.
        - id: ch01-b19
          speaker: narrator
          text: The crowd scattered. Nine men in antelope skins gathered at the opening of a hedge in the center of the village. Before long, the other men returned one by one with their offerings. They brought hippopotamus meat, ostrich feathers, fruit from the date palms, red chalk and green chalk, fish from the river, and ibex from the mountains. The headman received each gift.
        - id: ch01-b20
          speaker: narrator
          text: A second hedge stood about a yard inside the first, leaving a narrow lane between the two walls of thorns. Every now and then, one of the headmen disappeared along that hidden lane with his hands full of offerings. A little later, he came back to the villagers with both hands empty.
        - id: ch01-b21
          speaker: anthea
          text: They're giving offerings to their Amulet. We ought to give something too.
        - id: ch01-b22
          speaker: narrator
          text: A hurried search of the children's pockets produced pink tape, sealing wax, and a piece of the Waterbury watch Robert had taken apart at Christmas and never found time to put together again. Most boys have a watch in that condition. The children presented all three things, and Anthea added the red roses.
        - id: ch01-b23
          speaker: narrator
          text: The headman gazed at their gifts in awe, especially the roses and the piece of watch.
        - id: ch01-b24
          speaker: headman
          text: So many wonders have happened today that I cannot be more astonished. Our maiden told us there was peace between you and us. If this enemy had not come, we would have made certain of it. Now answer me. Are you on our side?
        - id: ch01-b25
          speaker: narrator
          text: The children shuddered.
        - id: ch01-b26
          speaker: robert
          text: Yes! How many times must we say it? Look at this. I'll speak to it. If it answers, you'll know we've come to guard the sacred thing we just gave our offerings to.
        - id: ch01-b27
          speaker: narrator
          text: Robert held out his toy pistol.
        - id: ch01-b28
          speaker: headman
          text: Will the god whose image you carry speak only to you, or will I hear it too?
        - id: ch01-b29
          speaker: robert
          text: You'll certainly hear it. Now then. If we are meant to guard the sacred treasure inside those hedges, answer in your loud voice, and we will obey.
        - id: ch01-b30
          speaker: narrator
          text: Robert pointed toward the space inside the hedges as he spoke. Then he pulled the trigger. The excellent cap in the two-shilling pistol went off with a loud crack. Every man, woman, and child in the village dropped face down on the sand. The headman who had accepted Robert's test was the first to rise.
        - id: ch01-b31
          speaker: headman
          text: The voice has answered. Take them to the room before the sacred thing.
        - id: ch01-b32
          speaker: narrator
          text: The four children followed their guide through the opening in the outer hedge. He led them around the lane until they reached an opening in the inner hedge. They passed through that too and entered another lane. All the walls of this winding place were made of brushwood and thorns.
        - id: ch01-b33
          speaker: anthea
          text: It's like the maze at Hampton Court.
        - id: ch01-b34
          speaker: narrator
          text: The lanes were open to the sky. At the center stood a little round-roofed hut with a curtain of skins across its doorway.
        - id: ch01-b35
          speaker: headman
          text: Wait here, and do not dare go beyond the curtain.
        - id: ch01-b36
          speaker: narrator
          text: Their guide passed through the curtain and vanished.
        - id: ch01-b37
          speaker: cyril
          text: Some of us should stay outside in case the Psammead comes back.
        - id: ch01-b38
          speaker: anthea
          text: Whatever happens, let's not separate. Losing the Psammead is bad enough. We can't do anything while that man is inside, so let's return to the village. We know the way now and can come back later. If fighting starts, he'll probably have to join it. And if we find the Psammead, we'll go straight home. It must be late, and I don't like this maze.
        - id: ch01-b39
          speaker: narrator
          text: They went out and told the headman they would guard the treasure when the battle began. Then they watched skilled workers chip flakes from flint and notch the stone into javelin heads and axe blades. No other living person in their own time had ever enjoyed such a close look at the work.
        - id: ch01-b40
          speaker: narrator
          text: The boys were fascinated by the weapons. The pointed stones were not fixed to arrows for bows, but to javelins thrown by hand. The chief weapon was a stone fastened to a short stick, rather like the clubs gentlemen once carried for protection. There were also long spears tipped with terribly sharp flint knives, and flint battle-axes. The whole village was as busy as an anthill someone had stepped on by mistake. Women worked beside the men, and even the children were busy.
        - id: ch01-b41
          speaker: narrator
          text: Without warning, the whole air glowed red, as if someone had thrown open the door of a furnace. You might once have seen such a furnace at Woolwich Arsenal, if you were lucky enough to be taken there. Almost at once, the glowing door seemed to close again. The sun had set, and night had come. That was how suddenly the sun went down in Egypt eight thousand years ago. I believe it still has not broken the habit and sets in exactly the same way today.
        - id: ch01-b42
          speaker: narrator
          text: In the darkness, the village girl brought them the skins of wild deer and led them to a pile of dry sedge where they could lie down.
        - id: ch01-b43
          speaker: village_girl
          text: My father says they won't attack yet. Sleep now.
        - id: ch01-b44
          speaker: narrator
          text: Sleeping seemed sensible, though danger surrounded them. They were frightened, but deep inside, a small certainty was growing. The Psammead could be trusted, and somehow they were truly safe. That certainty did not stop them from being as frightened as they could bear without becoming utterly miserable.
        - id: ch01-b45
          speaker: robert
          text: I suppose we'd better sleep. Poor old Nurse will have the police looking for us after we're gone all night. I wish a dozen policemen could find us here. Still, worrying won't help. Good night.
        - id: ch01-b46
          speaker: narrator
          text: And they all fell asleep.
        - id: ch01-b47
          speaker: narrator
          text: Long, loud, terrible sounds woke them. Threatening shouts, shrieks, and howls seemed to rise from every direction at once. Cyril later said they sounded like the voices of men thirsting for their enemies' blood.
        - id: ch01-b48
          speaker: village_girl
          text: Those are the strangers. They attacked the walls, but the thorns drove them back. My father says they won't try again before daylight. They're only shouting to frighten us, as if we were savages from the swamps!
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: The girl trembled in the darkness as she spoke. The awful noise lasted all night. Then the sun rose as suddenly as it had set, and the shouting stopped.
        - id: ch01-b50
          speaker: narrator
          text: The children scarcely had time to feel relieved before a shower of javelins came hurtling over the great thorn hedge. Everyone hid behind the huts. In the next moment, another shower of weapons flew in from the opposite side and sent the crowd racing toward different shelter. Cyril pulled one javelin from the roof of a hut beside him. Its head was brightly polished copper.
        - id: ch01-b51
          speaker: narrator
          text: Shouts rose again, along with the crackle of dry thorns. The enemy was tearing through the hedge. All the villagers rushed toward the noise and hurled stones and short flint-headed arrows over the wall. The children had never seen the light of battle in men's eyes before. It was strange and terrible to see, and it left a queer, thick feeling in the throat. A real fight was nothing like the pictures of battles in the illustrated newspapers at home.
        - id: ch01-b52
          speaker: narrator
          text: The shower of stones seemed to force the attackers back, and the villagers paused for breath. At that very instant, shouting and the crackle of thorns began on the opposite side of the village. The whole crowd hurried across to defend the new spot. So the battle swept back and forth from one side of the village to the other. The defenders had not thought to divide their forces, though their enemies had done exactly that.
        - id: ch01-b53
          speaker: narrator
          text: As the battle shifted across the village, Cyril noticed that certain warriors entered the maze from time to time. Each one came out with a brighter face, a braver look, and a straighter back.
        - id: ch01-b54
          speaker: cyril
          text: I think they go in and touch the Amulet. Remember, the Psammead said it could make people brave.
        - id: ch01-b55
          speaker: narrator
          text: The children crept through the maze to find out, and there they saw that Cyril was right. A headman stood in front of the skin curtain. Each warrior came before him in turn. The headman murmured a word too low for the children to hear, then touched the warrior's forehead with something concealed in his hands. Through his fingers, they caught the gleam of a red stone they knew at once.
        - id: ch01-b56
          speaker: narrator
          text: Beyond the thorn hedge, the battle raged. Suddenly, a bitter cry rang out.
        - id: ch01-b57
          speakers: [runner, headman, village_girl]
          ensemble: chorus
          text: They're inside! They're inside! The hedge is down!
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: The headman turned at once and vanished behind the deer-skin curtain, taking the red stone with him.
        - id: ch01-b59
          speaker: anthea
          text: He's gone to hide it. Oh, dear Psammead, how could you leave us?
          emotion: fearful
        - id: ch01-b60
          speaker: narrator
          text: Without warning, a shriek came from inside the hut. The headman stumbled back through the curtain, white with fear, and fled out through the twisting maze. The children watched him go, and their own faces turned just as white as his.
        - id: ch01-b61
          speaker: anthea
          text: Oh, what is it? What happened? Psammead, how could you do this? How could you?
          emotion: fearful
        - id: ch01-b62
          speaker: narrator
          text: Around them, the sounds of battle sank to a breathless murmur and then swelled fiercely again, like waves rising and falling at sea. Anthea shuddered.
        - id: ch01-b63
          speaker: anthea
          text: Oh, Psammead! Psammead!
          emotion: fearful
        - id: ch01-b64
          speaker: psammead
          text: Well, did you call me?
        - id: ch01-b65
          speaker: narrator
          text: A brisk little voice answered her. Then a furry hand lifted one corner of the skin curtain. The Psammead peeped out, showing its familiar bat ears and snail eyes. Anthea caught it in both arms, and all four children breathed out together in desperate relief.
        - id: ch01-b66
          speaker: anthea
          text: Oh, which way is East?
          emotion: fearful
        - id: ch01-b67
          speaker: narrator
          text: She spoke quickly. The wild fighting was drawing closer.
        - id: ch01-b68
          speaker: psammead
          text: Don't choke me. Come inside.
        - id: ch01-b69
          speaker: narrator
          text: The hut was completely dark.
        - id: ch01-b70
          speaker: cyril
          text: I've got a match.
        - id: ch01-b71
          speaker: narrator
          text: Cyril struck it. Its light showed a floor of soft, loose sand.
        - id: ch01-b72
          speaker: psammead
          text: I've been asleep in here. It was wonderfully comfortable, the best sand I've had in a month. Everything is all right. I knew your only chance would come while the battle was going on. That man won't return. I bit him, and now he thinks I'm an evil spirit. All you have to do is take the thing and go.
        - id: ch01-b73
          speaker: narrator
          text: Skins hung over the walls of the hut. In the center lay a great heap of the offerings from the night before, with Anthea's red roses fading on top. At one side stood a large square block of stone. On the block rested a long earthenware box, decorated with strange figures of people and animals. The Psammead raised one skinny finger and pointed toward it.
        - id: ch01-b74
          speaker: cyril
          text: Is it inside that box?
        - id: ch01-b75
          speaker: psammead
          text: You must decide that. The man was about to bury the box in the sand when I jumped out and bit him.
        - id: ch01-b76
          speaker: anthea
          text: Robert, light another match. Quickly now, which way is East?
        - id: ch01-b77
          speaker: psammead
          text: Where the sun rises, of course!
        - id: ch01-b78
          speaker: anthea
          text: But someone told us...
        - id: ch01-b79
          speaker: psammead
          text: People will tell you anything!
        - id: ch01-b80
          speaker: narrator
          text: The Psammead climbed into its bass-bag and wrapped itself in the waterproof sheet.
        - id: ch01-b81
          speaker: jane
          text: We can't see the sun in here, and it isn't rising now anyway.
        - id: ch01-b82
          speaker: psammead
          text: How you waste time! The shrine is in the East. There!
        - id: ch01-b83
          speaker: narrator
          text: It pointed at the great stone. Outside, the shouting and the clash of stone against metal sounded closer and closer. The children could tell that the headmen had gathered around the hut. They meant to defend their treasure against the enemy for as long as they could. Yet none of them dared come inside after the Psammead's sudden, fierce bite had terrified their leader.
        - id: ch01-b84
          speaker: cyril
          text: Jane, I'll take the Amulet. Be ready to hold up the charm, and don't let go of it when you pass through.
        - id: ch01-b85
          speaker: narrator
          text: Cyril took one step forward. At that instant, a great crackle sounded overhead, and a blaze of sunlight poured in. The roof had broken open along one side. Two spears pushed through and lifted away great slabs of it. The children trembled and blinked in the sudden light. Then big dark hands tore down part of the wall, and a dark face with a broad, rounded nose appeared in the gap. Even at that dreadful moment, Anthea thought it looked very much like Mr. Jacob Absalom, the shopkeeper near Charing Cross who had sold them the charm.
        - id: ch01-b86
          speaker: enemy_warrior
          text: Here is their Amulet! This is what gives them strength to fight and courage to die. And what have we found with it? Gods, or demons?
        - id: ch01-b87
          speaker: narrator
          text: The warrior glared fiercely at the children, and the whites of his eyes looked startlingly bright. Between his teeth he held a wet red copper knife. There was not another moment to lose.
        - id: ch01-b88
          speakers: [anthea, cyril, robert]
          ensemble: chorus
          text: Jane! Jane, quickly!
          emotion: fearful
        - id: ch01-b89
          speaker: narrator
          text: Jane's hands shook as she raised the charm toward the East. Cyril spoke the word of power, and the Amulet grew until it became a great arch. Outside the arch were the glaring Egyptian sky, the broken wall, and that cruel dark face with the red, wet knife gleaming in its teeth. Inside the arch lay the dim greenish-brown grass and trees of London.
        - id: ch01-b90
          speaker: cyril
          text: Hold tight, Jane!
        - id: ch01-b91
          speaker: narrator
          text: Cyril dashed through the arch, dragging Anthea and the Psammead behind him. Robert followed close after them, clutching Jane. As each child crossed, all the sound and fury of battle died away at once. In its place came only the low, dissatisfied hum of vast London, the pecking and pattering of sparrows on the gravel, and the voices of ragged little children singing Ring Around the Rosie on the worn yellow grass.
        - id: ch01-b92
          speaker: narrator
          text: The charm became small again in Jane's hand. Their dinner basket and bath buns lay exactly where they had left them.
        - id: ch01-b93
          speaker: cyril
          text: My hat! Now that was a real adventure.
          emotion: surprised
        - id: ch01-b94
          speaker: psammead
          text: It was rather like one, certainly.
        - id: ch01-b95
          speaker: narrator
          text: For a while, they all lay perfectly still on the grass and drew long breaths of the safe, quiet air of Regent's Park.
        - id: ch01-b96
          speaker: anthea
          text: We'd better go home now. Nurse must be terribly worried. The sun looks just as it did when we left yesterday, but we've been gone for twenty-four hours.
        - id: ch01-b97
          speaker: cyril
          text: The buns are still soft. I suppose the dew kept them fresh.
        - id: ch01-b98
          speaker: narrator
          text: Strangely enough, none of them felt hungry. They picked up the basket that held their dinner and the separate basket that held the Psammead, then went straight home. Old Nurse met them with an astonished look.
        - id: ch01-b99
          speaker: nurse
          text: Well, if ever I did! What's gone wrong with all of you? You've tired of your picnic very quickly.
        - id: ch01-b100
          speaker: narrator
          text: The children thought she was speaking with bitter sarcasm. Sarcasm means saying exactly the opposite of what you mean just to be unpleasant. It is like telling someone with a dirty face that they look beautifully clean.
        - id: ch01-b101
          speaker: anthea
          text: We're very sorry...
        - id: ch01-b102
          speaker: nurse
          text: Oh, bless you, child, I don't mind! Please yourselves, and you'll please me. Come inside and eat your dinner comfortably. I've got a potato boiling.
        - id: ch01-b103
          speaker: narrator
          text: Nurse went away to see to the potatoes, and the children stared at one another. Could she truly have changed so much? They had been away from home for twenty-four hours, including a whole night, without giving any explanation at all. Yet she did not seem to care. Then the Psammead poked its head out of its basket.
        - id: ch01-b104
          speaker: psammead
          text: What's wrong with you? Don't you understand? When you return through the charm's arch, you arrive at the same time you left. This isn't tomorrow!
        - id: ch01-b105
          speaker: jane
          text: Then is it still yesterday?
        - id: ch01-b106
          speaker: psammead
          text: No, it's today, just as it always was. You can't mix the present with the Past and cut pieces from one to patch into the other.
        - id: ch01-b107
          speaker: jane
          text: So that whole adventure took no time at all?
        - id: ch01-b108
          speaker: psammead
          text: Call it that if you wish. It took none of your modern time, anyway.
        - id: ch01-b109
          speaker: narrator
          text: That evening, Anthea carried a steak upstairs for the learned gentleman's dinner. She had persuaded Beatrice, the maid-of-all-work who had given her the bangle with the blue stone, to let her take up the tray. The learned gentleman specially invited Anthea to stay and talk while he ate.
        - id: ch01-b110
          speaker: narrator
          text: Anthea told him the whole adventure from beginning to end. She began with the moment that afternoon when the children found themselves on the bank of the River Nile. She finished with their remembering how to return, appearing in Regent's Park, and realizing that the journey had taken no time at all.
        - id: ch01-b111
          speaker: narrator
          text: She said nothing about the charm or the Psammead because she was forbidden to tell anyone about them. Even with those two parts missing, her tale was wonderful enough to hold the learned gentleman completely spellbound.
        - id: ch01-b112
          speaker: learned_gentleman
          text: You are a most unusual little girl. Who tells you all these things?
        - id: ch01-b113
          speaker: anthea
          text: No one. They simply happen.
        - id: ch01-b114
          speaker: learned_gentleman
          text: So that is make-believe.
        - id: ch01-b115
          speaker: narrator
          text: He spoke slowly, like a man remembering and saying a word he had forgotten long ago. After Anthea left, he remained sitting there for a long while. At last, he roused himself with a start.
        - id: ch01-b116
          speaker: learned_gentleman
          text: I truly must take a holiday. My nerves must be in a dreadful state. I could almost swear that the little girl downstairs came in and gave me a clear, sensible account of life in Egypt before the dynasties, exactly as I imagine it. The mind plays very strange tricks. I must be more careful.
        - id: ch01-b117
          speaker: narrator
          text: He finished his bread very carefully. Then, before he went back to his work, he actually went outside and walked a full mile.
