  chapters:
    - id: ch01
      title: THE HALF AMULET
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Last summer, one of the Psammead's wishes had landed the children in trouble because the servants noticed the magical gifts and took them badly. The children had wished that servants would never notice anything the Psammead gave them. Later, when they parted from the creature, their last wish was to meet it again. And now they had met it, which, as Robert pointed out, was very lucky for the Psammead. Since that meeting happened because of a wish, it counted as a Psammead gift. Old Nurse could not notice it at all. The Psammead evidently still considered her a servant, although she now had a house of her own. That was just as well. She would never have let the girls keep an animal and a bath of sand beneath their bed.
        - id: ch01-b02
          speaker: narrator
          text: After a splendid breakfast with the rare treat of hot rolls, Anthea pulled out the sand-bath and woke the Psammead. It stretched itself and gave its fur a shake.
        - id: ch01-b03
          speaker: psammead
          text: You must have swallowed your breakfast in a most unhealthy hurry. You cannot have spent five minutes on it.
        - id: ch01-b04
          speaker: anthea
          text: We took nearly an hour. Come along. You know you promised.
        - id: ch01-b05
          speaker: psammead
          text: Now listen. We had better begin exactly as we mean to continue. I will not have any misunderstandings between us, so let me tell you plainly how things will be.
        - id: ch01-b06
          speaker: anthea
          text: Oh, please wait until we are with the others. They would think it terribly sneaky if I talked to you alone. Do come downstairs, there's a dear.
        - id: ch01-b07
          speaker: narrator
          text: Anthea knelt beside the bath and held out her arms. Perhaps the Psammead remembered how glad it had been to leap into those same little arms the day before. It gave a reluctant little grunt, then jumped into them again. Anthea wrapped it carefully in her pinafore and carried it downstairs. The others welcomed it without a word, but their silence was full of excitement.
        - id: ch01-b08
          speaker: anthea
          text: Well, here we are!
        - id: ch01-b09
          speaker: psammead
          text: What sort of place is this?
        - id: ch01-b10
          speaker: narrator
          text: Its long eyes shot out and traveled slowly around the room.
        - id: ch01-b11
          speaker: robert
          text: It is a sitting room, of course.
        - id: ch01-b12
          speaker: psammead
          text: Then I do not like it.
        - id: ch01-b13
          speaker: anthea
          text: Never mind. We can take you somewhere else if you like. But what were you about to tell me upstairs, before I said the others would mind if I stayed there talking to you?
        - id: ch01-b14
          speaker: narrator
          text: The Psammead gave her a sharp look, and Anthea blushed.
        - id: ch01-b15
          speaker: psammead
          text: Do not be absurd. Naturally, you want your brothers and sister to hear exactly how good and unselfish you were.
        - id: ch01-b16
          speaker: jane
          text: Oh, please don't tease her. Anthea was right. What were you going to say?
        - id: ch01-b17
          speaker: psammead
          text: Since you are all so eager, I shall tell you. You saved my life, and I am not ungrateful. But saving me has not changed your nature or mine. You remain very ignorant and rather foolish, while I am worth a thousand of you on any day of the week.
        - id: ch01-b18
          speaker: anthea
          text: Of course you are worth a thousand of us!
        - id: ch01-b19
          speaker: psammead
          text: Interrupting is very rude. I will tolerate no nonsense. Saving me does not give you leave to pet me or expect me to lower myself by playing with you. What you think is worth nothing at all. What I think is what matters. Is that clear?
        - id: ch01-b20
          speaker: cyril
          text: Yes. If you remember, it was always like that.
        - id: ch01-b21
          speaker: psammead
          text: Good. Then that is settled. We shall each be treated as we deserve. I shall be treated with respect, and you shall be treated with...well, I would rather not be rude. Shall I tell you how I came to be in that dreadful den where you bought me? I truly am grateful. I have not forgotten your rescue, and I never shall.
        - id: ch01-b22
          speaker: anthea
          text: Please tell us. You are so clever that even you cannot know how deeply and respectfully we respect you. Isn't that so, everyone?
        - id: ch01-b23
          speaker: narrator
          text: The others all agreed that they respected the Psammead, though they fidgeted in their chairs as they said it. Robert finally spoke the wish that all four of them shared.
        - id: ch01-b24
          speaker: robert
          text: I do wish you would get on with it.
        - id: ch01-b25
          speaker: narrator
          text: The Psammead sat upright on the green-covered table and began.
        - id: ch01-b26
          speaker: psammead
          text: After you left last summer, I went to sand and slept. Your foolish wishes had worn me out. I felt as if I had not truly been to sand for a whole year.
        - id: ch01-b27
          speaker: jane
          text: You went to sand?
        - id: ch01-b28
          speaker: psammead
          text: That is where I sleep. You go to bed. I go to sand.
        - id: ch01-b29
          speaker: narrator
          text: Jane yawned. Merely hearing about bed had made her sleepy.
        - id: ch01-b30
          speaker: psammead
          text: Very well. I have no wish to tell you a long story if it bores you. A man caught me, so I bit him. He put me in a bag with a dead hare and a dead rabbit. Then he carried me to his house and tipped me into a basket with holes that I could see through. I bit him again. After that, he brought me to this city. People tell me it is called the Modern Babylon, though it is nothing like the old Babylon. He sold me to the man you bought me from, and then I bit both men. Now, what has happened to you?
        - id: ch01-b31
          speaker: cyril
          text: Our story has much less biting in it. None, in fact. Father has gone to Manchuria, and Mother took the Lamb to Madeira because she was ill. I only wish they were both safely home again.
        - id: ch01-b32
          speaker: narrator
          text: From sheer habit, the sand-fairy began to swell itself up to grant the wish. Then it stopped.
        - id: ch01-b33
          speaker: psammead
          text: I had forgotten. I cannot grant you any more wishes.
        - id: ch01-b34
          speaker: cyril
          text: But couldn't we bring Nurse in and have her wish they were home? I am sure that is what she wants too.
        - id: ch01-b35
          speaker: psammead
          text: That will not work. If you ask someone else to make your wish, it is exactly the same as wishing for it yourselves.
        - id: ch01-b36
          speaker: robert
          text: It worked yesterday, when the man in the shop made a wish.
        - id: ch01-b37
          speaker: psammead
          text: Yes, because you did not ask him, and you had no idea what would happen. You cannot use that trick again. It is finished.
        - id: ch01-b38
          speaker: jane
          text: Then you cannot help us at all. Ever since we saved you yesterday, I have been sure you could do something. I thought you could bring Father back, even if Mother was too difficult.
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: The thought that even the Psammead could not bring Father and Mother home was too much for Jane. She began to cry.
        - id: ch01-b40
          speaker: psammead
          text: Please don't cry. You know tears always upset me. They make me feel terribly unsafe. What you need is a different sort of charm.
        - id: ch01-b41
          speaker: cyril
          text: Finding one is easier said than done.
        - id: ch01-b42
          speaker: psammead
          text: It is perfectly easy. One of the strongest charms in the world is very near the place where you bought me. The first man I bit went into another shop to ask the price of something. A concertina, I think. While he complained that the price was far too high, I saw the charm lying on a tray among some other things. Buy that charm, and you can have your heart's desire.
        - id: ch01-b43
          speaker: narrator
          text: The children looked at one another, then back at the Psammead. Cyril coughed uneasily and found the courage to say what they were all thinking.
        - id: ch01-b44
          speaker: cyril
          text: Please don't get angry, but here is the difficulty. When you granted our wishes last summer, they nearly always landed us in some sort of trouble. We sometimes thought you would have been disappointed if they had gone well. We have very little money now. If we spend every penny on this charm and then discover it is not worth much...well, you understand what I mean, don't you?
        - id: ch01-b45
          speaker: psammead
          text: What I understand is that you cannot see past the end of your nose, and that is not very far. I had to grant those old wishes. Of course they went wrong in a way, because none of you had enough sense to wish for something that was good for you. This charm is entirely different. Nothing forces me to help you now. I am telling you about it out of my own generous kindness, so of course it is bound to turn out well. Do you see?
          emotion: angry
        - id: ch01-b46
          speaker: anthea
          text: Please, please don't be cross. This money is all we have, and we will get no more pocket money until Daddy comes home, unless he sends some in a letter. But we truly do trust you. And listen, everyone. Isn't it worth spending all our money if there is even the smallest possible chance of bringing Father and Mother safely home now? Just imagine having them back. Oh, do let's buy it!
        - id: ch01-b47
          speaker: psammead
          text: Do whatever you please. I shall go back to sand until you make up your minds.
        - id: ch01-b48
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: No, don't go!
        - id: ch01-b49
          speaker: jane
          text: Our minds are completely made up. Can't you see? We will fetch our hats. Are you coming with us?
        - id: ch01-b50
          speaker: psammead
          text: Naturally. How else could you find the shop?
        - id: ch01-b51
          speaker: narrator
          text: Everyone found a hat. They placed the Psammead in a flat bass-bag that had arrived from Farringdon Market carrying two pounds of filleted plaice. Instead of fish, it now held about three and a quarter pounds of solid Psammead. The children took turns carrying the basket through the streets.
        - id: ch01-b52
          speaker: robert
          text: It is not half as heavy as the Lamb.
        - id: ch01-b53
          speaker: narrator
          text: The girls sighed. From time to time, the Psammead pushed one watchful eye above the basket and directed them through the streets.
        - id: ch01-b54
          speaker: robert
          text: How can you possibly know the way? I cannot think how you manage it.
        - id: ch01-b55
          speaker: psammead
          text: No. I do not suppose you can.
        - id: ch01-b56
          speaker: narrator
          text: At last they reached the shop. Its window held every sort of thing. There were concertinas, silk handkerchiefs, china cups and vases, blue Japanese jars, pipes, swords, pistols, lace collars, and silver spoons tied in sets of six. Wedding rings lay in a red lacquered bowl. Officers' epaulets sat beside doctors' lancets. There were tea caddies inlaid with red tortoiseshell and curling bits of brass, plates covered in different kinds of money, and stacks of many different dinner plates. Jane especially admired a beautiful picture of a little girl washing a dog.
        - id: ch01-b57
          speaker: narrator
          text: In the center sat a dirty silver tray. It was heaped with mother-of-pearl counters, old seals, paste buckles, snuffboxes, and other dingy little objects. The Psammead raised its whole head from the fish-basket to see.
        - id: ch01-b58
          speaker: cyril
          text: There is a tray full of rubbish.
        - id: ch01-b59
          speaker: narrator
          text: The Psammead's long snail eyes found something beneath a blue-and-yellow buckle. They stretched so far that they looked as long and thin as new slate pencils. Its fur bristled thickly all over its body, and when it whispered, excitement had made its voice quite hoarse.
        - id: ch01-b60
          speaker: psammead
          text: That is it! Look beneath the blue-and-yellow buckle. A red piece is sticking out. Can you see it?
          emotion: surprised
        - id: ch01-b61
          speaker: cyril
          text: Do you mean that horseshoe-shaped thing? The red one that looks like ordinary sealing wax?
        - id: ch01-b62
          speaker: psammead
          text: Yes. Do what you did yesterday. Ask what some other things cost so the man brings out the tray. Try the blue buckle. Anthea had better go inside. The rest of us will wait here.
        - id: ch01-b63
          speaker: narrator
          text: The others stayed outside and pressed their noses flat against the window. Soon a large, dirty hand appeared behind the green half-curtains. Its fingers were short, and one wore an enormous diamond ring. The hand reached into the display and carried away the tray. The children could see nothing of Anthea's interview with the owner of the ring. She seemed to be gone long enough to buy the entire shop, if only she had possessed the money.
        - id: ch01-b64
          speaker: narrator
          text: At last she came out with a broad grin wreathing her face, as Cyril described it later, and the charm held safely in her hand. It was shaped rather like a horseshoe. The stone was red and smooth, with a soft, gentle gleam on its surface.
        - id: ch01-b65
          speaker: anthea
          text: I have it! Let's go home. We cannot stand in the street staring at it like a row of stuck pigs.
        - id: ch01-b66
          speaker: narrator
          text: They hurried back. The dreary parlor in Fitzroy Street seemed a very flat setting for magic. In the country, among flowers and green fields, anything had felt possible, and indeed almost anything had been. Near Tottenham Court Road, it was difficult to believe that something truly wonderful might happen. Yet they had the Psammead, which was a wonder by itself. It could speak, and it had shown them where to buy a charm that could make its owner perfectly happy.
        - id: ch01-b67
          speaker: narrator
          text: The four children strode home with very long steps, their chins thrust forward and their mouths tightly shut. They went so fast that the Psammead was shaken from side to side inside the fish-basket. It did not complain. Perhaps it was afraid that speaking from inside a basket might attract attention in the street.
        - id: ch01-b68
          speaker: narrator
          text: They reached home very hot and placed the Psammead on the green tablecloth.
        - id: ch01-b69
          speaker: cyril
          text: Well, then!
        - id: ch01-b70
          speaker: narrator
          text: But the Psammead felt faint and needed a plate of sand. After it had refreshed itself, it sat up again.
        - id: ch01-b71
          speaker: psammead
          text: Now, let me see the charm.
        - id: ch01-b72
          speaker: narrator
          text: Anthea laid it on the green cloth. The Psammead shot out its long eyes, examined the stone, then turned those eyes reproachfully toward her.
        - id: ch01-b73
          speaker: psammead
          text: But this is only half of it!
          emotion: surprised
        - id: ch01-b74
          speaker: narrator
          text: The children had spent nearly all their money, and now their wonderful charm was incomplete. The discovery was a terrible blow.
        - id: ch01-b75
          speaker: anthea
          text: It was the only piece there.
        - id: ch01-b76
          speaker: narrator
          text: Anthea spoke timidly but firmly, because she knew the mistake was not hers.
        - id: ch01-b77
          speaker: psammead
          text: There ought to be a second piece, with a sort of pin that joins them together.
        - id: ch01-b78
          speaker: anthea
          text: Is half of it no use at all?
        - id: ch01-b79
          speaker: cyril
          text: Won't it work without the missing piece?
        - id: ch01-b80
          speaker: robert
          text: And it cost seven shillings and sixpence!
        - id: ch01-b81
          speaker: jane
          text: Oh, bother, bother, bother!
        - id: ch01-b82
          speakers: [anthea, cyril, jane, psammead]
          ensemble: chorus
          text: Don't be a silly little idiot!
        - id: ch01-b83
          speaker: narrator
          text: A miserable silence followed. Cyril was the first to break it.
        - id: ch01-b84
          speaker: cyril
          text: What are we supposed to do now?
        - id: ch01-b85
          speaker: psammead
          text: Go back and ask whether the shop has the other half. I shall go to sand until you return. Cheer up. The piece you have can still do something, though finding the rest will be a great nuisance.
        - id: ch01-b86
          speaker: narrator
          text: Cyril set off for the shop at once. The Psammead went to sand while it waited, and the other three children went to dinner, which was ready by then. Old Nurse was very cross indeed because Cyril had failed to appear when the meal began.
        - id: ch01-b87
          speaker: narrator
          text: The three watched from the windows until he came back. Long before they could see his face, they knew he had failed. His shoulders sagged, his knickerbockers sat all wrong, and his boots dragged along the ground.
        - id: ch01-b88
          speakers: [anthea, robert, jane]
          ensemble: chorus
          text: Well? What did he say?
        - id: ch01-b89
          speaker: narrator
          text: They still hoped against hope as they crowded around him on the front step.
        - id: ch01-b90
          speaker: cyril
          text: No use at all. The man insisted the thing was complete. He called it a Roman lady's locket and said people should not buy curios when they know nothing about archaeology, or whatever the word was. He said he never went back on a bargain because that was not business, and he expected his customers to behave in the same way. He was simply nasty. That is what he was, and now I want my dinner.
        - id: ch01-b91
          speaker: narrator
          text: Cyril was plainly not pleased. The parlor's dullness pressed on everyone's spirits like a lump of lead. Nothing truly interesting seemed likely to happen in such a room. Cyril ate his dinner, and just as he swallowed his final mouthful of apple pudding, something scratched at the door. Anthea went to open it, and the Psammead walked in.
        - id: ch01-b92
          speaker: psammead
          text: Things could be worse. Still, do not be surprised if you meet a few adventures before you recover the other half. You do mean to recover it, I suppose?
        - id: ch01-b93
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Of course we do! And we don't mind adventures.
        - id: ch01-b94
          speaker: psammead
          text: No. I seem to remember that about you. Sit down and listen with all your ears. You have eight between you, haven't you? Good. I am glad you can count. Pay attention, because I will not explain everything twice.
        - id: ch01-b95
          speaker: narrator
          text: The children settled on the floor. It was much more comfortable than the chairs, and more respectful to the Psammead, which sat on the hearthrug stroking its whiskers. Then a sudden cold pain caught Anthea's heart. Father, Mother, and the darling Lamb were all far away. A moment later, a warm, comforting feeling flowed through her. The Psammead was here. They had at least half a charm, and adventures lay ahead. If you do not know what that cold pain feels like, I am glad for your sake, and I hope you never learn.
        - id: ch01-b96
          speaker: psammead
          text: You are not especially pleasant or clever, and you are not good-looking at all. Still, you saved my life. Oh, when I remember that dreadful man and his pail of water! So I shall tell you everything I know. Not everything I know about everything, naturally, because I know far too much. But I shall tell you all I know about this red object.
        - id: ch01-b97
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Please do!
        - id: ch01-b98
          speaker: psammead
          text: This red thing is half of an Amulet with all sorts of powers. It can make grain grow, water flow, trees bear fruit, and new, beautiful babies come into the world. Not that babies truly are beautiful, of course. Their mothers think they are. And as long as you believe a thing is true, it is true as far as you are concerned.
        - id: ch01-b99
          speaker: narrator
          text: Robert yawned, but the Psammead continued.
        - id: ch01-b100
          speaker: psammead
          text: The complete Amulet can keep away all the things that make people unhappy. It protects you from jealousy, bad temper, pride, disagreeableness, greed, selfishness, and laziness. When the Amulet was made, people called all those things evil spirits. Do you not think it would be pleasant to own such a thing?
        - id: ch01-b101
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Very pleasant.
        - id: ch01-b102
          speaker: narrator
          text: They did not sound very interested.
        - id: ch01-b103
          speaker: psammead
          text: It can also give you strength and courage.
        - id: ch01-b104
          speaker: cyril
          text: That sounds better.
        - id: ch01-b105
          speaker: psammead
          text: And virtue.
        - id: ch01-b106
          speaker: jane
          text: I suppose virtue might be nice to have.
        - id: ch01-b107
          speaker: narrator
          text: Jane did not sound very interested either.
        - id: ch01-b108
          speaker: psammead
          text: And it can give you your heart's desire.
        - id: ch01-b109
          speaker: robert
          text: Now that is worth hearing!
        - id: ch01-b110
          speaker: psammead
          text: I am speaking already. You need not do it for me.
        - id: ch01-b111
          speaker: cyril
          text: Having my heart's desire is enough for me.
        - id: ch01-b112
          speaker: anthea
          text: But those are the powers of the whole charm. The half we have can do something by itself, can't it?
        - id: ch01-b113
          speaker: narrator
          text: Anthea looked appealingly at the Psammead, and it nodded.
        - id: ch01-b114
          speaker: psammead
          text: Yes. This half can carry you anywhere you choose to search for the other half.
        - id: ch01-b115
          speaker: narrator
          text: For a moment, that sounded wonderful. Then Robert saw the difficulty.
        - id: ch01-b116
          speaker: robert
          text: Does the charm know where we ought to search?
        - id: ch01-b117
          speaker: narrator
          text: The Psammead shook its head.
        - id: ch01-b118
          speaker: psammead
          text: That seems most unlikely.
        - id: ch01-b119
          speaker: robert
          text: Do you know where it is?
        - id: ch01-b120
          speaker: psammead
          text: No, I do not.
        - id: ch01-b121
          speaker: robert
          text: Then we may as well hunt for a needle in a bottle of hay. Yes, bottle is right, not bundle. Father told me so.
        - id: ch01-b122
          speaker: psammead
          text: Not at all. You think you know everything, and you are entirely wrong. First, you must make the charm speak.
        - id: ch01-b123
          speaker: jane
          text: Can it truly talk?
        - id: ch01-b124
          speaker: narrator
          text: Jane's question did not mean she truly doubted the charm. In spite of all the dreary parlor furniture around them, the sense of magic was growing deeper and thicker. It seemed to fill the whole room like a fragrant mist inside a dream.
        - id: ch01-b125
          speaker: psammead
          text: Naturally it can talk. I assume you children can read.
        - id: ch01-b126
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Of course we can!
        - id: ch01-b127
          speaker: narrator
          text: The question offended them all.
        - id: ch01-b128
          speaker: psammead
          text: Then all you need to do is read the name written on the piece you have. The instant you say that name aloud, the charm will gain the power to do several things.
        - id: ch01-b129
          speaker: narrator
          text: For a while, no one spoke. The children passed the red charm slowly from hand to hand. Each one turned it over and studied the strange marks cut into its surface.
        - id: ch01-b130
          speaker: cyril
          text: There is no name written here.
        - id: ch01-b131
          speaker: psammead
          text: Nonsense. What do you call those marks?
        - id: ch01-b132
          speaker: cyril
          text: Those aren't writing. They look like pictures of chickens and snakes and things.
        - id: ch01-b133
          speaker: psammead
          text: You exhaust my patience. If you cannot read it, find someone who can. What about a priest?
        - id: ch01-b134
          speaker: anthea
          text: We do not know any priests. We know a clergyman, and the prayer book calls him a priest. But he only knows Greek, Latin, and Hebrew. These signs are none of those. I am sure of that.
        - id: ch01-b135
          speaker: narrator
          text: The Psammead stamped one furry foot.
        - id: ch01-b136
          speaker: psammead
          text: I wish I had never met you. You are no more useful than four stone statues. Less useful, to tell the truth. Is there no wise man in your Babylon who knows how to pronounce the names of the Great Ones?
          emotion: angry
        - id: ch01-b137
          speaker: anthea
          text: There is a poor learned gentleman upstairs. We could ask him. His room is full of stone images and some that look like iron. We once peeped in while he was out. Nurse says he hardly eats enough to keep a canary alive because he spends all his money on stones and things.
        - id: ch01-b138
          speaker: psammead
          text: Try him, but take care. If he knows a greater name than the one on this charm and uses it against you, your charm will be powerless. First bind him with the chains of honor and upright dealing. Then ask for his help. Yes, all four of you had better go. You can put me to sand on your way upstairs. I need a few minutes of peace and quiet.
        - id: ch01-b139
          speaker: narrator
          text: Anthea made everyone wash their hands and brush their hair. Then the four children hurried upstairs to knock on the poor learned gentleman's door and bind him with the chains of honor and honest dealing.
