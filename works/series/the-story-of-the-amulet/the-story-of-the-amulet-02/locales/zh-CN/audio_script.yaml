audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二章　半块护身符
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，也就是去年夏天，赛米德实现的一个愿望给孩子们惹出了麻烦。仆人们对愿望送来的东西一点也不客气，于是孩子们又许了个愿，让仆人再也看不见赛米德送来的礼物。分别时，他们最后还盼着以后能再见到它。如今愿望果然成真了。照罗伯特的说法，这当然是赛米德走运。说到底，赛米德能来到这里，本来就是那个愿望的结果。它也算赛米德愿望送来的东西，仆人自然瞧不见。孩子们很快发现，在它眼里，老保姆即使已经有了自己的房子，也仍旧算仆人，因为她根本没留意到它。这可正好，否则她绝不会准许女孩们在床底下养一只动物，还放上一浴盆沙子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            早餐收拾完了。这一顿很不错，甚至有平日难得吃到的热面包卷。安西娅拖出浴盆，把赛米德叫醒。它伸了个懒腰，又抖抖身子。
        - id: ch01-b03
          speaker: psammead
          text: 你们肯定是狼吞虎咽吃完的，这可不利于身体。前后还不到五分钟吧？
        - id: ch01-b04
          speaker: anthea
          text: 我们明明吃了差不多一个钟头。来吧，你还记得自己答应过什么。
        - id: ch01-b05
          speaker: narrator
          text: 赛米德往沙上一坐，两只长眼睛猛地伸了出来。
        - id: ch01-b06
          speaker: psammead
          text: >-
            先听我说。既然咱们要待在一起，有些规矩最好现在就讲明白，免得往后闹误会。我得清清楚楚地告诉你……
        - id: ch01-b07
          speaker: anthea
          text: >-
            哦，求你等见到大家再说吧。我要是背着他们单独听，他们会觉得我坏透了。你跟我下楼，好不好？
        - id: ch01-b08
          speaker: narrator
          text: >-
            她跪在沙浴盆前，张开双臂。赛米德大概还记得，昨天自己曾多么高兴地跳进这双小胳膊，于是不大情愿地哼了一声，又跳了进去。安西娅拿围裙裹住它，抱到楼下。大家见了它，都兴奋得不出声。最后还是安西娅先开口。
        - id: ch01-b09
          speaker: anthea
          text: 好了，现在说吧！
        - id: ch01-b10
          speaker: narrator
          text: 赛米德伸出眼睛，慢慢扫了一圈。
        - id: ch01-b11
          speaker: psammead
          text: 这是什么地方？
        - id: ch01-b12
          speaker: robert
          text: 当然是客厅。
        - id: ch01-b13
          speaker: psammead
          text: 我不喜欢这里。
        - id: ch01-b14
          speaker: anthea
          text: >-
            没关系，你愿意去哪儿，我们就带你去哪儿。刚才在楼上，我说不能撇下大家只顾着跟你讲话。那时你想告诉我什么？
        - id: ch01-b15
          speaker: narrator
          text: 赛米德锐利地盯着她，安西娅的脸一下红了。
        - id: ch01-b16
          speaker: psammead
          text: >-
            别犯傻。你这么善良，又这么无私，当然巴不得让兄弟姐妹全都知道得一清二楚。
        - id: ch01-b17
          speaker: jane
          text: >-
            不许你这样说她。安西娅做得一点也没错。她刚才打断你的时候，你究竟要说什么？
        - id: ch01-b18
          speaker: psammead
          text: >-
            既然你们都急着听，我就讲明白。你们救了我的命，我也不是不懂感激。可你们还是原来的你们，我也还是原来的我。你们照旧无知，还有一点傻。随便哪一天，我一个也比得上一千个你们。
        - id: ch01-b19
          speaker: anthea
          text: 那当然……
        - id: ch01-b20
          speaker: psammead
          text: >-
            随便打断别人很没礼貌。我的意思是，我绝不容忍你们胡闹。别以为救过我，就能随便摸我、宠我，或逼我降低身份陪你们玩。你们怎么想，一文钱也不值。要紧的是我怎么想。听懂了吗？
        - id: ch01-b21
          speaker: cyril
          text: 我懂。你要是还记得，以前也一直是这样。
        - id: ch01-b22
          speaker: psammead
          text: >-
            很好，那就这么说定。谁都该得到与自己相配的待遇。我得到尊敬，你们得到……算了，我不讲难听话。你们想不想听听，我是怎么掉进那个可怕的窝，又被你们买出来的？我可没有忘恩负义。你们救我的事，我永远不会忘。
        - id: ch01-b23
          speaker: anthea
          text: >-
            快讲给我们听吧。你当然聪明极了，可再聪明也猜不到，我们有多么恭恭敬敬地尊敬你。是不是？
        - id: ch01-b24
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: 是啊，当然是！
        - id: ch01-b25
          speaker: narrator
          text: 三个人嘴上赞成，身子却在椅子上动个不停。罗伯特替大家说出了心里话。
        - id: ch01-b26
          speaker: robert
          text: 我只希望你赶快往下讲。
        - id: ch01-b27
          speaker: narrator
          text: 赛米德在铺着绿桌布的桌上坐直身子，这才讲了起来。
        - id: ch01-b28
          speaker: psammead
          text: >-
            你们走后，我钻进沙里睡了一阵。你们那些蠢愿望把我累坏了，弄得我好像整整一年都没有真正回沙里睡过。
        - id: ch01-b29
          speaker: jane
          text: 回沙里？
        - id: ch01-b30
          speaker: psammead
          text: 那就是我睡觉的地方。你们上床，我回沙。
        - id: ch01-b31
          speaker: narrator
          text: 简一听见床就困了，忍不住打了个哈欠。赛米德恼火起来。
        - id: ch01-b32
          speaker: psammead
          text: >-
            算了，我本来就不想给你们讲长篇故事。有人抓住我，我立刻咬了他。他把我和一只死野兔、一只死家兔塞进同一个袋子，带回家以后，又把我从袋里掏出来，放进一个有孔的篮子，让我能从孔里往外看。我当然又咬了他。后来，他一路把我带到这座城。听说这里叫现代巴比伦，可它跟古巴比伦一点也不像。他把我卖给后来那个店主，我便把他们两个全咬了。好了，现在轮到你们了。你们有什么新闻？
        - id: ch01-b33
          speaker: cyril
          text: >-
            我们的故事可没有这么多咬人的事，一次也没有。父亲去了满洲，母亲病了，带着小羊羔去了马德拉。我真希望他们现在已经平平安安回家了。
        - id: ch01-b34
          speaker: narrator
          text: 沙精习惯性地鼓起身子，却忽然停住。
        - id: ch01-b35
          speaker: psammead
          text: 我忘了，我已经不能再替你们实现愿望。
        - id: ch01-b36
          speaker: cyril
          text: >-
            是不能了。可我们能不能把老保姆叫来，让她说希望父亲母亲平安回家？我敢肯定，她心里也这么盼着。
        - id: ch01-b37
          speaker: psammead
          text: 不行。你们若叫别人替自己许愿，就跟亲自许愿一样，不会生效。
        - id: ch01-b38
          speaker: robert
          text: 可昨天店里那个人许的愿，明明就成真了。
        - id: ch01-b39
          speaker: psammead
          text: >-
            那不一样。你们没有叫他许，也不知道他的愿望会带来什么。这办法已经用过一次，不能再用了。
        - id: ch01-b40
          speaker: jane
          text: >-
            那你一点忙也帮不上了。唉，我还以为你总能想出办法呢。昨天救了你以后，我一直在想这件事。我以为你就算不能把母亲接回来，至少也能把父亲带回来。
          emotion: sad
        - id: ch01-b41
          speaker: narrator
          text: 简说着哭了起来。赛米德立刻慌了。
        - id: ch01-b42
          speaker: psammead
          text: >-
            别哭呀。你一哭，我就心慌，总觉得自己不安全。听好了，你们得去找一件新的魔法宝物。
        - id: ch01-b43
          speaker: cyril
          text: 这话说起来容易，做起来可难。
        - id: ch01-b44
          speaker: psammead
          text: >-
            一点也不难。离昨天买下我的地方不到一箭远，就藏着世上最强大的法宝。最先被我狠狠咬过的那个人，有一次走进一家店，问一件东西多少钱，好像是一架手风琴。他正对店主说，那东西的价钱高得实在离谱。我从装我的篮子里往外看，正好在一只浅盘里看见了那件法宝，旁边还堆着不少别的东西。你们只要把它买下来，就能得偿心愿。
        - id: ch01-b45
          speaker: narrator
          text: >-
            孩子们互相看看，又一起望向赛米德。西里尔尴尬地咳了一声，终于鼓起勇气，把大家都在想的话说了出来。
        - id: ch01-b46
          speaker: cyril
          text: >-
            我希望你别生气。以前你替我们实现愿望，几乎每一次都惹出了乱子。那时我们甚至觉得，要是什么乱子都没有，你反而会失望。至于这件法宝，我们的钱实在不多。万一全花掉了，它却不太管用……你明白我的意思吧？
        - id: ch01-b47
          speaker: psammead
          text: >-
            我只明白，你连自己的鼻尖以外都看不见，偏偏鼻子还一点也不长。以前我非得实现你们的愿望不可。那些愿望后来总是弄得很糟，当然是因为你们太笨，根本不知道该许什么愿才真正对自己有好处。这回却完全不同。没有谁逼着我帮你们。我只是天性慷慨又善良，才主动把法宝的事告诉你们。所以这件事绝不会出问题。现在听懂了吗？
          emotion: angry
        - id: ch01-b48
          speaker: anthea
          text: >-
            求你别生气。你看，这就是我们所有的钱。父亲回来以前，我们不会再有零用钱，除非他写信时寄来一点。可我们真的信任你。大家想想，哪怕只有一点希望，能让父亲母亲现在就平安回来，也值得把钱全花掉，对不对？我们去买吧！
        - id: ch01-b49
          speaker: psammead
          text: >-
            随你们，我才不在乎。等你们拿定主意以前，我要回沙里去了。
        - id: ch01-b50
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 不，别走！
        - id: ch01-b51
          speaker: jane
          text: >-
            我们已经彻底拿定主意了，你还看不出来吗？大家去拿帽子吧。你会跟我们一起去吗？
        - id: ch01-b52
          speaker: psammead
          text: 当然。不然你们怎么找得到那家店？
        - id: ch01-b53
          speaker: narrator
          text: >-
            大家都拿上帽子，把赛米德装进一只扁平的鲈鱼篮。这个篮子从前由法灵顿市场送来，里面装着两磅切好的鲽鱼肉，如今装的却是三又四分之一磅左右、结结实实的赛米德。孩子们轮流提着它。
        - id: ch01-b54
          speaker: robert
          text: 它连小羊羔一半重都没有。
        - id: ch01-b55
          speaker: narrator
          text: >-
            两个女孩都叹了口气。赛米德不时小心地从篮子顶上探出一只眼睛，告诉孩子们该在哪里转弯。
        - id: ch01-b56
          speaker: robert
          text: 你究竟怎么认得路？我怎么也想不明白。
        - id: ch01-b57
          speaker: psammead
          text: 不，我想你当然想不明白。
        - id: ch01-b58
          speaker: narrator
          text: >-
            最后，他们来到那家店。橱窗里的东西多得出奇。手风琴、丝手帕、瓷花瓶和茶杯、蓝色日本罐，还有烟斗、刀剑、手枪和蕾丝领子。银匙半打半打地捆着，结婚戒指盛在红漆盆里。军官肩章挨着医生的柳叶刀。一个茶叶匣上镶着红玳瑁和弯弯绕绕的黄铜花纹，旁边有装着各国钱币的盘子，也有一摞摞花样不同的盘子。还有一幅漂亮的画，画着一个小姑娘给狗洗澡，简喜欢得不得了。橱窗正中摆着一只肮脏的银盘，里面堆着珍珠母牌戏筹码、旧印章、假钻带扣、鼻烟盒，还有说不出名目的灰扑扑小玩意儿。
        - id: ch01-b59
          speaker: narrator
          text: 赛米德把整个脑袋探出鱼篮，朝橱窗张望。西里尔也看见了银盘。
        - id: ch01-b60
          speaker: cyril
          text: 那只盘子里装的全是破烂。
        - id: ch01-b61
          speaker: narrator
          text: >-
            赛米德忽然瞧见了什么。两根蜗牛长眼一下伸得又细又长，像两支崭新的石板笔。它浑身的厚毛都竖了起来，激动得声音发哑。
        - id: ch01-b62
          speaker: psammead
          text: >-
            就是它，就是它！看那个蓝黄相间的带扣，下面露出一小截红色的东西。你们看见了吗？
          emotion: surprised
        - id: ch01-b63
          speaker: cyril
          text: 是那件有点像马蹄的东西吗？红得像封包裹用的封蜡？
        - id: ch01-b64
          speaker: psammead
          text: >-
            对，就是它。现在照上次的办法来。先去问问别的东西多少钱，就问那个蓝色带扣。店主会把盘子从橱窗里拿出去。我看让安西娅去最好，我们都在外面等。
        - id: ch01-b65
          speaker: narrator
          text: >-
            于是其他人把鼻子紧贴在橱窗上。没过多久，一只又大又脏、手指短粗的手从后面的绿色半截帘里伸出来。手上戴着一枚硕大的钻戒，把银盘拿走了。孩子们看不到安西娅怎样跟“钻戒”交涉，只觉得她去了很久，久得足够把整间店买下来，只要她有那么多钱。
        - id: ch01-b66
          speaker: narrator
          text: >-
            她终于出来了。照西里尔后来的说法，她笑得满脸开花，手里正拿着那件法宝。那东西由一种红色石头制成，大致像半只马蹄，表面摸起来很平滑，还泛着柔和的光泽。
        - id: ch01-b67
          speaker: anthea
          text: >-
            我买到了。你们只看一眼，咱们就赶快回家。不能站在街上，像一群呆猪似的盯着它。
        - id: ch01-b68
          speaker: narrator
          text: >-
            他们回去了。菲茨罗伊街的客厅，实在不像会发生魔法奇事的地方。在乡间的鲜花和绿野中，什么都有可能发生，而且事实上也的确发生过。可这里紧挨着托特纳姆法院路，四周都是伦敦的街道和房屋，要人相信奇迹也会在这里出现，真是太难了。然而赛米德就在这里，它本身已经是个奇迹。它不但会说话，还亲自替孩子们指出了这件法宝。据它说，谁拥有这件东西，谁就能得到圆满的幸福。
        - id: ch01-b69
          speaker: narrator
          text: >-
            四个孩子迈着大步，扬起下巴，嘴巴闭得紧紧的，一心匆匆赶回家。他们相信手里拿着一件真正的法宝，也相信拥有它的人能得到圆满的幸福。大家走得实在太快，鱼篮里的赛米德被颠得七荤八素，却始终一声不吭，也许是怕说话会引起路人的注意。等他们终于到家，个个都热得厉害。他们赶紧把赛米德放到铺着绿色桌布的桌上。
        - id: ch01-b70
          speaker: cyril
          text: 好了！
        - id: ch01-b71
          speaker: narrator
          text: >-
            可赛米德已经虚弱得快要昏过去。孩子们只好先拿来一盘沙子，让它恢复了一点精神。
        - id: ch01-b72
          speaker: psammead
          text: 好了，把那件法宝给我看看。
        - id: ch01-b73
          speaker: narrator
          text: >-
            安西娅把红石头放在绿桌布上。赛米德伸出长眼睛，仔仔细细看过一遍，又满含责备地转向安西娅。
        - id: ch01-b74
          speaker: psammead
          text: 可这里只剩下一半了！
          emotion: surprised
        - id: ch01-b75
          speaker: narrator
          text: 这句话真像当头一棒。
        - id: ch01-b76
          speaker: anthea
          text: 店里就只有这一块。
        - id: ch01-b77
          speaker: narrator
          text: 安西娅说得有点怯，却很坚定。她知道这不是自己的错。
        - id: ch01-b78
          speaker: psammead
          text: 还该有另一半，也该有一根销钉，把两块扣在一起。
        - id: ch01-b79
          speaker: cyril
          text: 难道半块一点用也没有？
        - id: ch01-b80
          speaker: robert
          text: 少了另一块，它就不能施法吗？
        - id: ch01-b81
          speaker: anthea
          text: 它花了七先令六便士呢。
        - id: ch01-b82
          speaker: jane
          text: 哎呀，真烦，真烦，真烦！
        - id: ch01-b83
          speaker: psammead
          text: 别像一群小傻瓜似的！
        - id: ch01-b84
          speaker: narrator
          text: 大家嚷完，屋里落下一阵凄惨的沉默。最后，西里尔终于开了口。
        - id: ch01-b85
          speaker: cyril
          text: 那我们现在该怎么办？
        - id: ch01-b86
          speaker: psammead
          text: >-
            回那家店去，问问另一半还在不在。你们回来以前，我先回沙里。振作一点！手上这半块多少还有用，可要是找不到另一半，以后就会有没完没了的麻烦。
        - id: ch01-b87
          speaker: narrator
          text: >-
            西里尔去了店里，赛米德回到沙中，另外三个孩子去吃已经准备好的午饭。老保姆发现西里尔没有按时来吃饭，很不高兴。等西里尔回来时，三个孩子全守在窗边。他还离得很远，远得让人根本看不清脸。可大家只消看看那低垂的肩膀、松松垮垮的短裤，还有一路拖在地上的靴子，就再清楚不过地知道，他这一趟白跑了。
        - id: ch01-b88
          speakers: [robert, anthea, jane]
          ensemble: chorus
          text: 怎么样？
        - id: ch01-b89
          speaker: narrator
          text: 他们站在前门台阶上问。明知道没有希望，心里却还是盼着奇迹。
        - id: ch01-b90
          speaker: cyril
          text: >-
            没用。那个人硬说这东西本来就是完整的，还说它是一个罗马贵妇人的挂坠盒。他说，不懂考古的人就不该买古玩。他从不反悔做成的买卖，因为那不合做生意的规矩，顾客也得守同样的规矩。他坏透了，就是这么回事。现在我要吃午饭。
          emotion: angry
        - id: ch01-b91
          speaker: narrator
          text: >-
            西里尔显然很不高兴。想到这间客厅里根本不可能发生真正有趣的事，大家心头都像压了一块铅。西里尔吃完午饭，刚咽下最后一口苹果布丁，门上忽然传来抓挠声。安西娅打开门，赛米德走了进来。它听完了坏消息。
        - id: ch01-b92
          speaker: psammead
          text: >-
            好吧，事情还没有坏到极点。只不过在找到另一半以前，你们大概免不了碰上几场冒险。真碰上了，可别大惊小怪。你们当然还是想找到另外半块，对吧？
        - id: ch01-b93
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 那还用说！而且我们不怕冒险。
        - id: ch01-b94
          speaker: psammead
          text: >-
            是啊，我记得你们就有这个脾气。都坐下，把所有耳朵竖起来。一共八只，对吧？很好，幸亏你们还会算数。现在专心听，我可不准备把每件事都讲两遍。
        - id: ch01-b95
          speaker: narrator
          text: >-
            孩子们在地板上坐好。地板比椅子舒服，而且赛米德正在炉边地毯上捋胡须，这样坐对它也更有礼貌。安西娅心头忽然掠过一阵冰冷的痛。父亲、母亲、亲爱的小羊羔，全都远在天边，她一个也碰不到。紧接着，一股温暖又安稳的感觉流遍全身。赛米德就在这里，他们手里至少有半块法宝，而且新的冒险马上就要开始了。如果你不知道这种冰冷的痛是什么滋味，我真替你高兴，也希望你永远不会知道。
        - id: ch01-b96
          speaker: psammead
          text: >-
            听好了。你们不算特别可爱，也不算特别聪明，模样更是一点也不好看。不过你们毕竟救了我的命。哎呀，一想起那个人和他的水桶！所以，我愿意把知道的都告诉你们。当然不可能真的全部告诉，我知道的实在太多了。不过这件红东西的事，我知道多少就说多少。
          emotion: happy
        - id: ch01-b97
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 讲吧！讲吧！快讲吧！
        - id: ch01-b98
          speaker: psammead
          text: >-
            那就听好。这件红东西是半块护身符。完整的护身符能做各种各样的事。它能让田里的庄稼生长，让河水不停流淌，让树木结出果实，还能让崭新又漂亮的小宝宝降生。当然，宝宝本身并不漂亮，可他们的母亲总觉得他们漂亮。只要你真心相信一件事是真的，那么至少对你自己来说，它就是真的。
        - id: ch01-b99
          speaker: narrator
          text: 罗伯特打了个哈欠，赛米德继续往下讲。
        - id: ch01-b100
          speaker: psammead
          text: >-
            完整的护身符还能替你挡开所有让人不快活的东西，比如嫉妒、坏脾气、骄傲、讨人嫌、贪心、自私和懒惰。护身符制成的时候，人们还把这些东西统统叫作恶灵。你们不觉得，有这样一件护身符会很好吗？
        - id: ch01-b101
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 很好。
        - id: ch01-b102
          speaker: narrator
          text: 孩子们答得毫无兴致。
        - id: ch01-b103
          speaker: psammead
          text: 它还会给你力量和勇气。
        - id: ch01-b104
          speaker: cyril
          text: 这个听起来好一点。
        - id: ch01-b105
          speaker: psammead
          text: 还会给你美德。
        - id: ch01-b106
          speaker: jane
          text: 我想，有美德大概也不错。
        - id: ch01-b107
          speaker: narrator
          text: 简的兴趣也不大。
        - id: ch01-b108
          speaker: psammead
          text: 它还能让你得偿心愿。
        - id: ch01-b109
          speaker: robert
          text: 这才算说到点子上。
        - id: ch01-b110
          speaker: psammead
          text: 我一直都在说，所以不用你来提醒。
        - id: ch01-b111
          speaker: cyril
          text: 对我来说，能得偿心愿已经足够了。
        - id: ch01-b112
          speaker: anthea
          text: >-
            可是，你刚才说的都是完整护身符能做的事。我们这半块单独也能做一件事，对不对？
        - id: ch01-b113
          speaker: narrator
          text: 她求助似的望着赛米德。它点了点头。
        - id: ch01-b114
          speaker: psammead
          text: 对。这半块能带你们去任何想去的地方，寻找另外半块。
        - id: ch01-b115
          speaker: narrator
          text: 这听起来妙极了，直到罗伯特问出一个问题。
        - id: ch01-b116
          speaker: robert
          text: 它自己知道该去哪里找吗？
        - id: ch01-b117
          speaker: narrator
          text: 赛米德摇摇头。
        - id: ch01-b118
          speaker: psammead
          text: 我看它多半不知道。
        - id: ch01-b119
          speaker: robert
          text: 那你知道吗？
        - id: ch01-b120
          speaker: psammead
          text: 不知道。
        - id: ch01-b121
          speaker: robert
          text: >-
            那我们还不如去一瓶干草里找一根针。没错，是一“瓶”，不是一“捆”，父亲就是这么说的。
        - id: ch01-b122
          speaker: psammead
          text: >-
            才不是这么回事。你以为自己什么都知道，其实完全错了。第一件要做的事，是让这东西开口讲话。
        - id: ch01-b123
          speaker: jane
          text: 它会说话？
        - id: ch01-b124
          speaker: narrator
          text: >-
            简这么问，并不表示她认定它不会说话。客厅里的家具明明还和从前一样，魔法的气息却越来越浓，也越来越深。那感觉就像一场由带着香气的雾做成的梦，正在一点一点充满整间屋子。
        - id: ch01-b125
          speaker: psammead
          text: 它当然会。我想，你们总该识字吧？
        - id: ch01-b126
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 我们当然识字！
        - id: ch01-b127
          speaker: narrator
          text: 这个问题让大家觉得受了冒犯。
        - id: ch01-b128
          speaker: psammead
          text: >-
            那就好。只要念出刻在这半块护身符上的名字，而且大声念出来，它就有力量去做……嗯，好几件事。
        - id: ch01-b129
          speaker: narrator
          text: >-
            屋里安静下来。红色护身符从一个孩子手中传到另一个孩子手中。最后，西里尔开口了。
        - id: ch01-b130
          speaker: cyril
          text: 上面根本没有名字。
        - id: ch01-b131
          speaker: psammead
          text: 胡说。那又是什么？
        - id: ch01-b132
          speaker: cyril
          text: >-
            哦，你说那些东西！那根本不是字，看着像小鸡、蛇，还有乱七八糟的图画。
        - id: ch01-b133
          speaker: narrator
          text: 护身符上刻的，正是这样一些奇怪的图形。
        - id: ch01-b134
          speaker: psammead
          text: >-
            我对你们真是一点耐心也没有。既然不会读，就得找一个会读的人。比如一位祭司？
        - id: ch01-b135
          speaker: anthea
          text: >-
            我们不认识祭司。倒是认识一位牧师，祈祷书里也管他叫祭司。可他只懂希腊文、拉丁文和希伯来文。我知道这些图形哪一种都不是。
        - id: ch01-b136
          speaker: narrator
          text: 赛米德气得直跺毛茸茸的脚。
        - id: ch01-b137
          speaker: psammead
          text: >-
            我真希望从来没见过你们。你们跟一群石头偶像一样没用。说真的，还不如石头偶像。这座巴比伦里，难道连一个能念出伟大诸神名讳的智者都没有吗？
          emotion: angry
        - id: ch01-b138
          speaker: anthea
          text: >-
            楼上住着一位可怜的学者先生，我们可以请他试一试。他房里有很多石头偶像，还有一些看着像铁做的。有一次他不在，我们从门缝里看见了。老保姆说，他吃的东西少得连一只金丝雀都养不活，因为钱全花在石头一类的东西上了。
        - id: ch01-b139
          speaker: psammead
          text: >-
            那就去试试。可一定要小心。要是他知道一个更伟大的名字，还用它来对付你们，护身符就会失去作用。先用荣誉与正直的锁链把他缚住，再请他帮忙。对了，你们最好全都去。上楼时把我送回沙里，我非得安安静静歇几分钟不可。
        - id: ch01-b140
          speaker: narrator
          text: >-
            于是，四个孩子匆匆洗了手，又梳好头发。这是安西娅的主意。接着，他们上楼去敲那位“可怜的学者先生”的门，还得设法“用荣誉与正直的锁链把他缚住”。
