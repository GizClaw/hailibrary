audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    nurse:
      display_name: 老保姆
      tts:
        delivery: 嘴硬心软，絮叨中满是疼爱
        timbre: 温厚略沙哑的老年女声
        pace: 中等
        pitch: 中低
    learned_gentleman:
      display_name: 博学先生
      tts:
        delivery: 温和渊博，年老后多了眷恋与感慨
        timbre: 清癯温润的老年男声
        pace: 舒缓
        pitch: 中低
    rekh_mara:
      display_name: 雷克玛拉
      tts:
        delivery: 庄严自负，措辞古雅而充满权威
        timbre: 深沉有力的成年男声
        pace: 缓慢而郑重
        pitch: 低
    hurried_lady:
      display_name: 匆忙的女士
      tts:
        delivery: 心不在焉，脚步匆忙
        timbre: 清脆的成年女声
        pace: 快
        pitch: 中高
    devant:
      display_name: 德万特先生
      tts:
        delivery: 自信机敏，带着舞台主持人的风度
        timbre: 响亮圆润的成年男声
        pace: 中等
        pitch: 中低
    audience_man:
      display_name: 后排观众
      tts:
        delivery: 自以为看穿把戏，随口起哄
        timbre: 粗亮的成年男声
        pace: 中等偏快
        pitch: 中
    amulet_voice:
      display_name: 护符之声
      tts:
        delivery: 美妙威严，宁静中令人敬畏
        timbre: 空灵深广
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十四章　心愿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            要是时间够，真该把那些没讲完的冒险都说给你听。一个大雨天，四个孩子不顾赛米德劝阻，穿过护符拱门，走进金色沙漠。他们找到了巴勒贝克大神庙，还碰见了以为再也见不到的凤凰。凤凰起初完全不认得他们，直到进入预言般的恍惚状态才想起来。当然，那究竟算不算“记得”，也很难说。那次经历惊险极了，精彩得足够讲上好久，可惜这里来不及细讲，只能把它整个略过去。
        - id: ch01-b02
          speaker: narrator
          text: >-
            还有一次，孩子们把赛米德藏在旅行袋里，带去看竞技场演出。坐在他们四周的人，心里想要什么，什么就猛地实现。愿望一个接着一个，来得又快又怪，闹到最后，安西娅只好匆匆把赛米德送回家，白白错过了后半场节目。另一天，保姆去艾弗朗克那边一个朋友家喝茶，孩子们留下来玩“黑暗中的魔鬼”。游戏本来就阴森吓人，邮差又偏在最瘆人的时候敲门，几乎把简吓掉了魂。她到底还是鼓起勇气收下信，再把信塞进帽架抽屉最里面，藏到衣刷后面，心想那里一定万无一失。信的确一封也没丢，只是接下来一连好几个星期，她连想都没想起它们。
        - id: ch01-b03
          speaker: narrator
          text: >-
            有一回，他们带赛米德去卡姆登镇的男校，看幻灯，也听演讲。那场演讲从头到尾，说的都是英国在南非的士兵。讲到最后，演讲人说，他希望屋里每一个男孩心中都埋着勇气、英雄气概和自我牺牲的种子。他还希望这些男孩长大后，全都成为高尚、勇敢、无私的人，成为配得上伟大帝国的公民，因为帝国的士兵已经自愿献出了生命。赛米德就在现场，所以这番希望当然成了真。对卡姆登镇来说，这可真是结结实实得了一分。
        - id: ch01-b04
          speaker: narrator
          text: >-
            安西娅觉得这事有点倒霉，因为演讲人偏偏只提了男孩。往后，她和简要想变得高尚无私，就一点外力也借不到，全得靠自己。简却不肯认输。她说，凭她们天生的好性情，八成早就已经高尚、无私了，只有男孩才非得靠魔法才能变勇敢。这话听着实在气人，差一点就引起了一场头等大争吵。你们大概还想听听钓竿、鱼钩和隔壁厨娘的那件事。从某些人的角度看，那件事的确很逗，不过厨娘本人多半不这么想。可惜连这个也只能留着不讲。现在真正来得及讲的，是马斯基林与库克剧场的历险和那场意外现身。结局就从这里开始。
        - id: ch01-b05
          speaker: narrator
          text: 秋雨不停敲着窗玻璃，那声音听起来就像一支阴沉沉的曲子。老保姆忽然打断雨声，提议大家去埃及大厅，也就是英国神秘之家看魔术。四个孩子自己藏着一桩不能告诉旁人的神秘，他们很清楚，自家的真魔法和台上的把戏完全不是一类东西。可一听这个主意，他们还是全都来了精神。因为孩子总喜欢魔术，许多已经长大的大人其实也一样。
        - id: ch01-b06
          speaker: nurse
          text: >-
            地方就在皮卡迪利大街。从圆环往下走，不太远，左手边就是。外头有几根大柱子，像霍尔本那家卡特种子店。那铺子从前还是戴与马丁鞋油铺呢，那时我才是个小姑娘。也有点像尤斯顿车站，不过没那么大。
        - id: ch01-b07
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 知道了，我们都知道。
        - id: ch01-b08
          speaker: narrator
          text: >-
            保姆仔细数好先令，交给西里尔，孩子们便出发了。他们沿皮卡迪利大街左边一路走，却怎么也找不到有柱子的建筑。那里既不像种子仓库，也不像尤斯顿车站，更不像记忆中的英国神秘之家。最后，他们拦住一位匆匆赶路的女士，向她打听马斯基林与库克剧场。
        - id: ch01-b09
          speaker: hurried_lady
          text: 我怎么会知道？我买东西向来只去百货商店。
        - id: ch01-b10
          speaker: narrator
          text: >-
            女士说完便从他们身边挤了过去。她似乎觉得，自己只去百货商店，便没必要知道别处的路。依简看，这正说明大人有多无知。孩子们继续打听，最后还是一位警察解释清楚。原来，英国的种种神秘表演如今已经搬到圣乔治大厅，倒是十分名副其实。他们只好重新赶路，一路走到朗豪坊。等找到地方，节目单上的头两个节目已经结束。幸好他们还赶上了最奇妙的部分。台上的人一会儿凭空出现，一会儿又当众消失。孩子们亲眼见过比这大得多的真魔法，却还是几乎不敢相信，眼前这些精彩绝伦的把戏居然不是真魔法。
        - id: ch01-b11
          speaker: cyril
          text: 巴比伦人要能看见这种魔术就好了。他们那个老魔法师跟这一比，简直不值一提，对吧？
        - id: ch01-b12
          speaker: anthea
          text: 嘘！
        - id: ch01-b13
          speaker: narrator
          text: >-
            罗伯特身边空着一个座位。舞台上，德万特先生拿着一把只有一个壶嘴的水壶，却倒出一杯杯完全不同的饮料，让观众逐一品尝。大家看得兴高采烈。就在所有眼睛都盯着舞台时，罗伯特突然感觉身边有人了。他没有察觉谁坐下。前一刻座位明明还空着，下一刻，上面就出现了一个人。
        - id: ch01-b14
          speaker: narrator
          text: >-
            罗伯特转过头，终于看清那个突然占据空位的人。来者竟是阿蒙神的祭司雷克玛拉。观众的眼睛全都盯着大卫·德万特先生，大卫·德万特先生的眼睛却在观察观众。偏巧，他当时尤其注意罗伯特身边那个空座位。所以，埃及祭司怎样从无中突然现身，他看得清清楚楚。德万特先生暗暗称赞这是个漂亮把戏，而且就在自己的大厅、自己的眼皮底下变成了。他立刻打定主意，非找出其中的机关不可。因为只要他肯认真琢磨，还从来没有哪一种魔术是他自己变不了的。
        - id: ch01-b15
          speaker: narrator
          text: >-
            观众席上，越来越多的人发现了这位刮净胡须、衣着奇异的埃及人。德万特先生立刻抓住机会，站起来面对全场。
        - id: ch01-b16
          speaker: devant
          text: >-
            女士们，先生们，这项魔术我以前从未表演过。请看楼座第二排，从尽头数第三个座位。刚才它还是空的，现在上面坐着一位古埃及人，保证货真价实。
        - id: ch01-b17
          speaker: narrator
          text: >-
            他根本不知道，自己的话有多么真实。话一出口，全场的目光便从舞台转向祭司和四个孩子。起先，观众被这场意外表演惊得屏住呼吸，大厅里安静了一瞬。随后，他们认定这是安排好的精彩魔术，掌声和欢呼立刻轰然响起。只有祭司另一边的女士没有跟着高兴，反而稍稍往后缩了缩。她坐得那么近，心里再清楚不过，刚才绝没有任何人从自己身旁经过。后来喝茶吃冷牛舌时，她还忍不住重复这件事。她说，那个埃及人出现得实在太突然，害她皮肉发紧，浑身都起了鸡皮疙瘩。雷克玛拉却没有因为掌声而得意。他的脸色越来越难看，显然恼火极了。他不明白大家为何欢呼，也一点都不喜欢自己和孩子们突然成为所有人的焦点。
        - id: ch01-b18
          speaker: rekh_mara
          text: 离开这些人。我必须找个没人的地方跟你们谈。
        - id: ch01-b19
          speaker: jane
          text: 可我还想看吉祥飞蛾和口技师呢。
        - id: ch01-b20
          speaker: robert
          text: 你到底怎么跑到这里来的？
        - id: ch01-b21
          speaker: rekh_mara
          text: 你们怎样去了埃及和泰尔，我便怎样来了这里。走，离开人群。
        - id: ch01-b22
          speaker: robert
          text: 看来不走也不行了。
        - id: ch01-b23
          speaker: narrator
          text: 罗伯特恼怒地耸耸肩，四个孩子全站起来。后排一个男人自以为看穿了把戏。
        - id: ch01-b24
          speaker: audience_man
          text: 原来全是托儿！现在他们要绕到后台，参加下一个节目了。
        - id: ch01-b25
          speaker: robert
          text: 我倒真希望是这样。
        - id: ch01-b26
          speaker: cyril
          text: 你自己才是托儿！
        - id: ch01-b27
          speaker: narrator
          text: >-
            他们就这样离开座位，观众还一直为他们鼓掌，直到他们完全走出视线。在圣乔治大厅前厅，孩子们尽力替雷克玛拉乔装。罗伯特贡献出帽子，西里尔贡献出因弗内斯斗篷。可祭司穿戴起来仍旧十分奇特，要他徒步走过伦敦街头，肯定一路都会有人回头。他们只好雇一辆马车，也因此花光了五个人身上最后、最少的那点钱。离家还有几户时，他们让马车停下。两个女孩先进去，绘声绘色地向老保姆讲魔术，又热切央求下午茶吃油汁烤面包，好把她的注意力牢牢引住。她们故意敞着前门。趁保姆和女孩们说话，两个男孩领祭司无声无息地溜进屋，又像偷运货物一样，把他藏到楼上的卧室里。
        - id: ch01-b28
          speaker: narrator
          text: 女孩们随后上楼，看见雷克玛拉坐在西里尔床沿，双手放在膝盖上，活像一尊国王雕像。
        - id: ch01-b29
          speaker: cyril
          text: 快来吧。人没到齐，他一句也不肯说。把门关上，行不行？
        - id: ch01-b30
          speaker: rekh_mara
          text: 我的利益与你们的利益完全相同。
        - id: ch01-b31
          speaker: cyril
          text: >-
            这话很有意思。可你要是只穿这么点衣服，在一个体面国家里到处跟着我们，那才叫真有意思。
        - id: ch01-b32
          speaker: rekh_mara
          text: 安静。这是什么国家？又处在什么时代？
        - id: ch01-b33
          speaker: anthea
          text: 这里是英国，时间比你的时代大约晚了六千年。
        - id: ch01-b34
          speaker: rekh_mara
          text: 那么，护符不仅能让人穿越空间，还能带人来回穿越时间？
        - id: ch01-b35
          speaker: cyril
          text: 差不多。可马上要喝下午茶了，我们究竟该怎么安置你？
        - id: ch01-b36
          speaker: rekh_mara
          text: 你们拿着一半，我拿着另一半。现在只缺连接两半的别针。
        - id: ch01-b37
          speaker: robert
          text: 才不是。你手里的那半，和我们的分明是同一半。
        - id: ch01-b38
          speaker: rekh_mara
          text: 同一个东西在同一时间、同一地方，不可能既相同，又分成两个。看，这是我的半枚。你们的在哪里？
        - id: ch01-b39
          speaker: narrator
          text: >-
            祭司把自己的半枚护符放上印花床罩，又问孩子们的在哪里。简先看了看伙伴们的眼神，才解下颈间细绳，把护符也放到床上。她特意把两枚隔得很远，免得祭司突然伸手就能抢走。西里尔和罗伯特一左一右站在他身旁，浑身绷紧，只要他有一只手朝宝物挪动哪怕一点，就准备立刻扑上去。祭司的手没有动，只有双眼突然睁得极大，其他人也一样。因为他带来的护符竟自行颤抖、摇晃起来，随后像钢铁被磁石吸引，沿着白色床罩缓缓滑动，离简颈间焐热的那枚越来越近。
        - id: ch01-b40
          speaker: narrator
          text: >-
            两枚护符终于碰在一起。它们像雨水在窗玻璃上汇成一滴，又像水银珠彼此吸引。雷克玛拉的护符滑进了孩子们的护符，眼前只剩完整的一枚。
        - id: ch01-b41
          speaker: rekh_mara
          text: 黑魔法！
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: >-
            雷克玛拉高喊黑魔法，猛地扑向那枚吞下自己护符的护符。安西娅动作更快，一把将它抢在手里。几乎就在同一瞬间，一根绳圈从祭司头顶套下去。雷克玛拉仍在向前猛扑，自己的力气反而把绳索越扯越紧，两条胳膊顿时被死死捆在身体两侧。他还没来得及发挥力气挣脱，罗伯特已经绕到身后打好结，又把绳头绑在床柱上。祭司不停扭动身体，两脚乱踢。四个孩子一同扑上去，好不容易才压制住他，再拿来更多绳索，把他的双腿也结结实实地捆起来。
        - id: ch01-b43
          speaker: robert
          text: >-
            我猜他一定会抢我们的护符，所以早从储物间拿来了绳子。现在正好派上用场。
        - id: ch01-b44
          speaker: narrator
          text: 两个女孩脸色发白，却都庆幸罗伯特想得周到。
        - id: ch01-b45
          speaker: rekh_mara
          text: 立刻松绑！否则，我要用阿蒙—拉神的七道秘密诅咒把你们毁灭！
          emotion: angry
        - id: ch01-b46
          speaker: robert
          text: 等你诅咒完，我们才更不会放你。
        - id: ch01-b47
          speaker: anthea
          text: >-
            别吵了！他对护符的权利确实跟我们一样。现在这一枚既有他的，也有我们的。不如大家共有。
        - id: ch01-b48
          speaker: rekh_mara
          text: 放开我！
          emotion: angry
        - id: ch01-b49
          speaker: robert
          text: >-
            你再闹，我们就开窗喊警察，也就是卫兵，再说你想抢劫我们。现在能不能闭嘴，听我们讲道理？
        - id: ch01-b50
          speaker: rekh_mara
          text: 那就听听吧。
        - id: ch01-b51
          speaker: narrator
          text: >-
            孩子们先在洗脸架和毛巾架旁低声商议了许久，才由安西娅回到祭司面前。
        - id: ch01-b52
          speaker: anthea
          text: >-
            我们想跟你做朋友，也真心愿意帮你。咱们立个约定，一起找到完整的护符。找到以后，它属于你，也同样属于我们。这样，大家都能得到最想要的东西。
        - id: ch01-b53
          speaker: rekh_mara
          text: 好听的话可长不出洋葱。
        - id: ch01-b54
          speaker: jane
          text: >-
            我们这里说，好话不能给防风草抹黄油。可我们确实愿意公平呀，只想让你答应光明正大地做事。
        - id: ch01-b55
          speaker: robert
          text: 你会公平对待我们吗？
        - id: ch01-b56
          speaker: rekh_mara
          text: >-
            我以写在阿蒙—拉神祭坛之下的神圣秘密之名起誓，必定公平待你们。你们也肯立下诚实结盟的誓言吗？
        - id: ch01-b57
          speaker: anthea
          text: >-
            不肯。在英国，只有到了警察法庭才起誓，那里有卫兵，你不会想去的。可我们只要答应一件事，就一定会做到，这跟誓言没有分别。你相信我们，我们也相信你。
        - id: ch01-b58
          speaker: narrator
          text: 安西娅解开祭司腿上的绳子，男孩们也替他松开双臂。雷克玛拉一自由，便站起来伸展身体，放声大笑。
        - id: ch01-b59
          speaker: rekh_mara
          text: >-
            现在我比你们强壮，誓言也已经作废。我以根本不存在的名字起誓，所以誓言也是虚无。阿蒙—拉神祭坛下面根本没有秘密之名。
        - id: ch01-b60
          speaker: psammead
          text: 有的！
        - id: ch01-b61
          speaker: narrator
          text: >-
            声音从床底传来，人人都吓了一跳，祭司吓得尤其厉害。西里尔弯腰拖出赛米德睡觉的沙浴盆。赛米德抖动身体，沙粒叮叮落在盆沿。
        - id: ch01-b62
          speaker: psammead
          text: >-
            你虽然是阿蒙神庙的圣父，也不是什么都知道。祭坛下面确实藏着神圣秘密之名。要不要我现在呼唤它？
        - id: ch01-b63
          speaker: rekh_mara
          text: 不要！
          emotion: fearful
        - id: ch01-b64
          speaker: jane
          text: 对，谁的名字也别喊。
        - id: ch01-b65
          speaker: rekh_mara
          text: 我只是想说，哪怕那下面没有名字——
        - id: ch01-b66
          speaker: psammead
          text: 明明就有。
        - id: ch01-b67
          speaker: rekh_mara
          text: >-
            好吧。即使没有，我也愿意遵守你们这个古怪而正直的国家所用的无言誓言。我说了做朋友，便会做朋友。
        - id: ch01-b68
          speaker: psammead
          text: >-
            这还差不多。喝茶铃响了。你们准备拿这位尊贵伙伴怎么办？他这样子可不能下楼。
        - id: ch01-b69
          speaker: anthea
          text: 十二月三日以前，我们找不到完整护符。那这段日子里，雷克玛拉住哪儿？
        - id: ch01-b70
          speaker: cyril
          text: 藏进储物间，饭也偷偷送上去。应该挺有趣。
        - id: ch01-b71
          speaker: robert
          text: 就像把逃亡的保王党人藏起来，躲过怒气冲冲的圆颅党。好主意。
        - id: ch01-b72
          speaker: narrator
          text: >-
            祭司被带到楼上的储物间。孩子们在旧育儿室壁炉挡板和四柱大床残骸之间，给他整理出一个温暖舒服的小角落。他们找来大布头袋给他当座位，又从门后钉子上摘下虫蛀的旧皮大衣，让他披着御寒。孩子们自己喝完下午茶，又给他送去一份。雷克玛拉一点也不喜欢茶，却很爱配茶的黄油面包和蛋糕。那天晚上，孩子们轮流陪着他，临睡前，他还算高兴，也已经安顿妥当。第二天吃早饭时，四个孩子每人省下四分之一条熏鲱鱼，凑成一整条，满怀好意地送上楼。可雷克玛拉不见了。舒服的小角落还在那里，布头袋还在，虫蛀的皮衣也还在，唯独该坐在那里的人没了。
        - id: ch01-b73
          speaker: narrator
          text: >-
            看见空角落时，人人心里第一个念头都一样，走了才好。这个念头既自然，又让人痛快。可第二个念头马上跟来，便一点也不痛快了。祭司的护符已经被他们的护符吞掉，而那枚合在一起的护符重新挂回了简的颈间。没有护符，雷克玛拉绝无可能回到埃及的过去。因此，他一定还留在英国。他很可能就在附近某个地方，偷偷策划着坏事。为了免得冤枉他，也免得自己弄错，孩子们把整座阁楼仔仔细细搜了一遍。可箱子后面、杂物中间，到处都没有他的影子。
        - id: ch01-b74
          speaker: cyril
          text: 最好马上穿过半枚护符，找到完整的一枚，再回来。
        - id: ch01-b75
          speaker: anthea
          text: >-
            这样公平吗？也许他不是卑鄙的骗子，只是出了什么意外。
        - id: ch01-b76
          speaker: cyril
          text: 他才不会出意外。又能出什么事？
        - id: ch01-b77
          speaker: anthea
          text: >-
            也许夜里来了窃贼，不小心杀了他，又把他凡人的遗体搬走，免得被人发现。
        - id: ch01-b78
          speaker: cyril
          text: 也许窃贼把遗体藏进储物间的大箱子了。要不回去看看？
        - id: ch01-b79
          speaker: jane
          text: 不要！还是去问赛米德吧。
          emotion: fearful
        - id: ch01-b80
          speaker: anthea
          text: >-
            去问博学先生更好。雷克玛拉真出了事，绅士的意见总比赛米德有用。反正他又会当成梦。
        - id: ch01-b81
          speaker: narrator
          text: >-
            孩子们走到博学先生门外，先轻轻敲门。里面传来一声“进来”，他们才推门进去。眼前的情形让所有人吃了一惊。博学先生坐在餐桌一边，面前摆着早餐，却一口也没有动。他似乎早已完全忘记了吃饭。桌子对面的扶手椅里，雷克玛拉安安稳稳地坐着。原来，他们在整座阁楼里搜不到的埃及祭司，竟主动跑到博学先生这里来了。而博学先生不但没有害怕，反而像刚刚找到了世上最珍贵、最舍不得惊醒的一场梦。
        - id: ch01-b82
          speaker: learned_gentleman
          text: >-
            嘘，请千万安静，不然梦会跑掉。我正在学习。过去这一个钟头，我竟然学到了这么多！
        - id: ch01-b83
          speaker: rekh_mara
          text: >-
            黎明还是灰色时，我离开了藏身处。这里到处都是故国的珍宝，所以我留了下来。不知为什么，我在这里反而更像回到了家。
        - id: ch01-b84
          speaker: learned_gentleman
          text: 我当然知道这是梦。可是，诸神哪，多么了不起的梦！天神在上……
        - id: ch01-b85
          speaker: rekh_mara
          text: >-
            不要呼唤诸神，免得引来更强大、你却无法驾驭的存在。我与他已经亲如兄弟，他的安危对我就像自己的安危一样重要。
        - id: ch01-b86
          speaker: learned_gentleman
          text: 他已经告诉我——
        - id: ch01-b87
          speaker: robert
          text: 你把护符的一切告诉他了吗？
        - id: ch01-b88
          speaker: rekh_mara
          text: 还没有。
        - id: ch01-b89
          speaker: robert
          text: 那就现在讲。他学问很大，也许知道该怎么办。
        - id: ch01-b90
          speaker: narrator
          text: >-
            雷克玛拉听了罗伯特的话，先迟疑了一会儿，随后还是把护符的事讲给博学先生听。他究竟讲了哪些秘密，后来孩子们无论怎样回想，也没有一个人能够记起。那段话仿佛从他们脑中整整齐齐地消失了。也许祭司说话时悄悄用了魔法，故意不让他们留下记忆。博学先生却显然全听懂了。祭司讲完以后，他久久没有开口，只把胳膊肘支在餐桌上，再用一只手托住脑袋，陷入深深的思索。孩子们看着他，既期待，又有些不安。
        - id: ch01-b91
          speaker: anthea
          text: 亲爱的吉米，别发愁。今天我们一定会找到它。
        - id: ch01-b92
          speaker: rekh_mara
          text: 是的，也许还会随着它找到死亡。
        - id: ch01-b93
          speaker: robert
          text: 护符是给我们带来心愿的。
        - id: ch01-b94
          speaker: rekh_mara
          text: 谁知道黑暗之门后面，是否藏着从未入梦却无比可贵的东西？
        - id: ch01-b95
          speaker: jane
          text: 别再说了。
          emotion: fearful
        - id: ch01-b96
          speaker: learned_gentleman
          text: >-
            何不回到过去？选护符无人看守的时刻，许愿来到它身边，再许愿让它落进你们手里。
        - id: ch01-b97
          speaker: narrator
          text: 办法简单得不能再简单，可他们从来没想到。
        - id: ch01-b98
          speaker: rekh_mara
          text: 走吧！现在就走！
        - id: ch01-b99
          speaker: learned_gentleman
          text: 我能一起去吗？这只是一场梦，不是吗？
        - id: ch01-b100
          speaker: rekh_mara
          text: 欢迎你来，我的兄弟——
        - id: ch01-b101
          speakers: [cyril, robert]
          ensemble: duo
          text: 不行！
        - id: ch01-b102
          speaker: robert
          text: 你没跟我们去过亚特兰蒂斯，不然就知道不能带他。
        - id: ch01-b103
          speaker: anthea
          text: 亲爱的吉米，别要求去了。我们一转眼就回来，你甚至来不及发现我们离开过。
        - id: ch01-b104
          speaker: learned_gentleman
          text: 那他也要去吗？
        - id: ch01-b105
          speaker: rekh_mara
          text: >-
            我们必须同行。完整的护符只有一枚，而我和这些孩子拥有同样的权利。
        - id: ch01-b106
          speaker: narrator
          text: >-
            简举起护符，念出力量之语。护符很快长成一道巨大的拱门。雷克玛拉第一个走进去，四个孩子紧随其后。博学先生留在原地，透过拱门望见另一边的黑暗，里面只有烟雾般的微光忽隐忽现。他以为自己眼花了，抬手揉起眼睛。对他来说，这个动作只花了十秒钟，可拱门另一边已经发生了许多事。
        - id: ch01-b107
          speaker: narrator
          text: >-
            拱门另一边，孩子们和祭司落在一间狭小、黑暗的石室里。厚重巨石围着一道方形门洞，外面的光正从那里一阵阵照进来。那光不断移动，忽明忽暗。门外还有许许多多的声音，正在合唱一首缓慢、陌生的颂歌。他们谁也没有立刻行动，只站在原地听着。每隔一阵，吟唱的节奏就突然加快，门外的光也同时亮上一层，仿佛有人把新的燃料投入一堆熊熊燃烧的火中。那座神殿既古老又陌生，让人觉得世界本身都还没有完全醒来。
        - id: ch01-b108
          speaker: anthea
          text: 我们到哪儿了？
        - id: ch01-b109
          speaker: robert
          text: 又到了什么时候？
        - id: ch01-b110
          speaker: rekh_mara
          text: >-
            这里是信仰刚刚萌生时的一座神殿。拿到护符就走吧。世界还在清晨，这里冷得可怕。
        - id: ch01-b111
          speaker: narrator
          text: >-
            简把手按在一块石板或石桌上，掌下恰好有个熟悉的形状。它和长期挂在自己颈间的护符一样，却厚了整整一倍。
        - id: ch01-b112
          speaker: jane
          text: 在这里！我拿到了！
          emotion: surprised
        - id: ch01-b113
          speaker: rekh_mara
          text: 快离开。
        - id: ch01-b114
          speaker: robert
          text: 我真想再看看这座神殿。
        - id: ch01-b115
          speaker: rekh_mara
          text: 快走！四周都是死亡和强大的魔法。听那声音。
          emotion: fearful
        - id: ch01-b116
          speaker: narrator
          text: 吟唱声越来越响，也越来越凶猛，光芒随之增强。
        - id: ch01-b117
          speaker: rekh_mara
          text: 他们来了！快，举起护符！
          emotion: fearful
        - id: ch01-b118
          speaker: narrator
          text: 简把护符举起，转眼间，他们又站在博学先生眼前。
        - id: ch01-b119
          speaker: anthea
          text: 你揉眼睛揉了好久！没看见我们已经回来了吗？
        - id: ch01-b120
          speaker: narrator
          text: >-
            博学先生只顾瞪着她。楼下忽然传来老保姆又尖又高、兴奋异常的呼喊，叫着安西娅小姐和简小姐。人人都嫌这一声来得不是时候。
        - id: ch01-b121
          speaker: cyril
          text: >-
            吉米先生，你先接着做梦，我们马上回来。不下去的话，保姆会亲自上楼。她绝不会把雷克玛拉当成梦。
        - id: ch01-b122
          speaker: narrator
          text: 孩子们跑下楼。老保姆站在门厅，一手拿着橙色信封，一手拿着粉红纸条。
        - id: ch01-b123
          speaker: nurse
          text: >-
            你们的爸爸妈妈回来了！电报上说，十一点十五分到伦敦，要我照信里的吩咐收拾房间。下面签着他们两个人的名字。
        - id: ch01-b124
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: 万岁！万岁！万岁！
          emotion: happy
        - id: ch01-b125
          speaker: narrator
          text: 安西娅欢喜得几乎哭出来，连喊也喊不出。
        - id: ch01-b126
          speaker: anthea
          text: 原来那件事是真的。我们的心愿真的实现了。
          emotion: happy
        - id: ch01-b127
          speaker: nurse
          text: 可那封信是怎么回事？我根本没收到过信呀。
        - id: ch01-b128
          speaker: jane
          text: >-
            会不会是那些信？就是玩“黑暗中的魔鬼”那晚送来的。我把它们放在帽架抽屉里，藏到衣刷后面，然后……你看，它们还在这里！
        - id: ch01-b129
          speaker: narrator
          text: >-
            简一面说，一面拉开抽屉。信果然好端端地躺在里面。一封写给保姆，一封写给孩子们。信上说，爸爸的战地记者工作已经结束，马上就能回家。妈妈会带小羊羔去意大利迎接爸爸，随后一家三口一同回来。妈妈和小羊羔身体都很好。等到回家的日子和具体时刻确定下来，他们还会另发一封电报。所以保姆手里那张粉红纸条，正是信里早已答应过的电报。
        - id: ch01-b130
          speaker: nurse
          text: >-
            我的天哪！简小姐，你这事做得太不像话。我可有得忙了，非把家里替你们爸爸妈妈收拾妥当不可。
        - id: ch01-b131
          speaker: jane
          text: 别生气嘛，保姆。难道还有比这更好的事吗？
        - id: ch01-b132
          speaker: cyril
          text: >-
            我们会来帮忙。楼上还有件事必须处理，处理完，大家就一起帮你。
        - id: ch01-b133
          speaker: nurse
          text: >-
            快走吧。我还不知道你们能帮上什么忙吗？现在已经十点了。
        - id: ch01-b134
          speaker: narrator
          text: >-
            保姆嘴上赶人，却笑得十分开心。楼上等着处理的事确实重大，花的时间也远超孩子们预料。他们先冲进男孩们的房间，带来一身沙子、满肚子怒气的赛米德。
        - id: ch01-b135
          speaker: anthea
          text: 它再生气、身上再多沙，最后商量大事时也该在场。
        - id: ch01-b136
          speaker: robert
          text: 博学先生看见它，没准会吓得惊厥。
        - id: ch01-b137
          speaker: narrator
          text: 可他没有。雷克玛拉刚解释完赛米德是什么，博学先生便兴奋地叫起来。
        - id: ch01-b138
          speaker: learned_gentleman
          text: 这梦越来越奇妙了！我以前也梦见过这只怪兽。
        - id: ch01-b139
          speaker: robert
          text: >-
            半枚护符在简手里，完整的一枚在我手里。简，拿出来吧。
        - id: ch01-b140
          speaker: narrator
          text: >-
            简听话地解开细绳，把一直挂在颈间的半枚护符放到桌上。那张桌子本来就乱得很，上面铺满蒙尘的纸张，还散放着一只只泥圆筒。每个圆筒都刻满细小的痕迹，看上去像无数只小鸟用小脚踩出的脚印。罗伯特从口袋里取出他们刚在远古神殿找到的完整护符，也把它放在桌面。博学先生的眼睛顿时亮了。他这个研究古物的人，看见如此完整的标本，根本忍不住，手已经满怀渴望地伸了过去。安西娅明白事情还没结束，连忙轻轻握住他的手腕，把那只手拦在护符前面。
        - id: ch01-b141
          speaker: narrator
          text: >-
            接下来发生的事，和先前在印花床罩上发生的一模一样。半枚护符先是轻轻颤动，接着摇晃起来。随后，它像钢铁受到磁石吸引，自己越过一页页蒙尘的手稿，向罗伯特从口袋里拿出的完整护符滑去。那枚完整护符还带着罗伯特身上的温度。两者之间的距离越来越短，最后终于碰在一起。就像雨天里，两滴水沿着起皱的窗玻璃汇成一滴；又像一粒水银珠受到另一粒吸引，转眼融在一起。那枚既属于孩子们、也属于雷克玛拉的半枚护符，就这样滑进完整护符。桌面上再也没有两枚，最终只剩下那枚完美无缺、至高无上的护符。
        - id: ch01-b142
          speaker: psammead
          text: 这下总算妥了。
        - id: ch01-b143
          speaker: anthea
          text: 是啊，我们也得到了心愿。爸爸、妈妈和小羊羔今天回家。
        - id: ch01-b144
          speaker: rekh_mara
          text: 可是我呢？
        - id: ch01-b145
          speaker: anthea
          text: 你心里最渴望的是什么？
        - id: ch01-b146
          speaker: rekh_mara
          text: >-
            浩瀚而深邃的学问，比我故乡、我那个时代的任何人都更高深。可若没人理解，再大的学问也没有用。我若回去，谁会相信未来的见闻？让我留在这里吧。我可以成为通晓我们时代一切的大学者。那个时代对我活生生的，对你们却十分古老。你们的学者不停推测它，而且照他说的，常常全猜错了。
        - id: ch01-b147
          speaker: psammead
          text: >-
            我要是你，就先问问护符。住在不属于自己的时代很危险。你的肺来自几千个世纪以前，却呼吸几千个世纪以后的空气，迟早会出事。摆好神秘圆环，向护符请示。
        - id: ch01-b148
          speaker: learned_gentleman
          text: >-
            多么非凡的梦！亲爱的孩子们，如果你们爱我，无论梦里梦外都爱我，就摆好圆环，向护符请示吧！
        - id: ch01-b149
          speaker: narrator
          text: >-
            他们照赛米德的话做了。就像八月阳光灿烂的那次一样，所有人蹲在地板上，围成一个圆圈。可这一次，窗外没有夏日阳光。空气里塞满浓稠的黄雾。不知什么古怪规矩，每到牲畜展那一周，这种雾总会如期而至。街上还能听见小贩一声声叫卖。简念出“乌尔·赫考·塞切赫”。刹那间，所有光都灭了，所有声音也消失了。周围的黑暗和寂静，深得超过你做过的任何梦，也超过你能作出的任何想象。那感觉像是既聋又瞎，却比聋更静，比瞎更暗。
        - id: ch01-b150
          speaker: narrator
          text: >-
            在那无边无际的黑暗和寂静里，一道微光和一个细小的声音渐渐生了出来。最初，那道光太弱，什么也照不清。那个声音也太小，谁都听不清它究竟在说什么。可光一直变亮，声音也一直长大。后来，那光成了凡人只要直视便不能存活的光。那个声音则成了世间最甜美、也最可怕的声音。甜美与恐惧竟同时存在，谁也不敢怀疑它的力量。四个孩子立刻低下眼睛。祭司、博学先生和在场的每一个人，也全都垂下目光，不敢看向光芒的中心。
        - id: ch01-b151
          speaker: amulet_voice
          text: 我已经开口。你们想听什么？
        - id: ch01-b152
          speaker: narrator
          text: 大家都害怕得不敢说话。罗伯特却突然问了出来。
        - id: ch01-b153
          speaker: robert
          text: >-
            我们该拿雷克玛拉怎么办？他应该穿过护符，回到自己的时代，还是——
        - id: ch01-b154
          speaker: amulet_voice
          text: >-
            现在，谁也不能再穿过护符，去任何土地或时代。只有它不完整时，才做得到。但人可以穿过完整护符，走向完美的结合。那结合不属于时间，也不属于空间。
        - id: ch01-b155
          speaker: anthea
          text: >-
            能不能请您说得容易懂些？赛米德说雷克玛拉没法一直活在这里。可他要是又回不去——
          emotion: fearful
        - id: ch01-b156
          speaker: amulet_voice
          text: >-
            谁也不能长久活在并未指定给他的土地和时代。然而，一颗灵魂可以在别处活下去。只要那片土地、那个时代里，有一颗与它极为相近的灵魂，愿意让它栖身于自己的身体，两颗灵魂便能在一个身体里合而为一。
        - id: ch01-b157
          speaker: narrator
          text: >-
            孩子们沮丧地互相看着。雷克玛拉与博学先生的目光却相遇了。他们温和地看着彼此，眼神里仿佛许下了许多秘密、神圣而美好的诺言。安西娅发现了。
        - id: ch01-b158
          speaker: anthea
          text: >-
            可亲爱的吉米一点也不像雷克玛拉。我敢肯定，他们的灵魂完全不同。我不是故意无礼，可吉米有一颗金子般善良的心，而雷克玛拉——
        - id: ch01-b159
          speaker: amulet_voice
          text: >-
            一切不善之物都无法穿过完整护符的双重拱门。只要两个人都愿意，便念出力量之语，让两颗灵魂从此永远合为一体。
        - id: ch01-b160
          speaker: jane
          text: 要我念吗？
        - id: ch01-b161
          speakers: [rekh_mara, learned_gentleman]
          ensemble: duo
          text: 念吧！
        - id: ch01-b162
          speaker: narrator
          text: >-
            两个声音急切而充满生机，因希望和对伟大事物的渴望而颤动。简从罗伯特手中接过护符，举在两个男人中间，最后一次念出了力量之语。
        - id: ch01-b163
          speaker: jane
          text: 乌尔·赫考·塞切赫。
        - id: ch01-b164
          speaker: narrator
          text: >-
            完整的护符长成双重拱门。两道拱门彼此倾斜，合成巨大的字母A。
        - id: ch01-b165
          speaker: jane
          text: A代表阿蒙，就是雷克玛拉侍奉的神。
        - id: ch01-b166
          speaker: anthea
          text: 嘘。
        - id: ch01-b167
          speaker: narrator
          text: >-
            双重拱门在原有的绿光里渐渐发亮。那光更明亮，却也更加柔和。它的光辉、灿烂和甜美，无法用语言说清。
        - id: ch01-b168
          speaker: rekh_mara
          text: 来吧！
        - id: ch01-b169
          speaker: learned_gentleman
          text: 来吧！
        - id: ch01-b170
          speaker: narrator
          text: >-
            雷克玛拉伸出双手，呼唤博学先生过来。博学先生也向他伸出双手，发出同样的呼唤。两个人各自向前，走到那道光辉灿烂的完整护符拱门下。雷克玛拉忽然开始颤抖摇晃，像钢铁受到磁石吸引，在魔法拱门下不断移向博学先生，一点一点，越来越近。他们又像雨水在起皱的窗玻璃上汇成一滴，像一粒水银珠被另一粒吸过去。阿蒙—拉神庙的圣父雷克玛拉就这样被吸走，滑入博学先生体内，消失不见。最后，他与善良、受人爱戴而又博学的吉米合为一体。
        - id: ch01-b171
          speaker: narrator
          text: >-
            就在融合完成的那一刻，一切突然恢复正常。房中重新有了明亮的白昼，十二月的太阳从窗外照进来。刚才还浓得化不开的黄雾已经消散，快得像一场醒来便无影无踪的梦。完整的护符缩回原来的大小，小小的、完好无缺地留在简手中。其他孩子还在，赛米德还在，博学先生也依然站在那里。只有雷克玛拉不见了，确切地说，是雷克玛拉的身体再也不在房里了。至于那位埃及祭司的灵魂去了哪里，眼前很快就有了一个令人不太愉快的说明。
        - id: ch01-b172
          speaker: robert
          text: 多恶心的东西！
          emotion: disgusted
        - id: ch01-b173
          speaker: narrator
          text: >-
            一条手指那么长的蜈蚣正在博学先生脚边爬行扭动。罗伯特抬脚把它踩住。
        - id: ch01-b174
          speaker: psammead
          text: 那就是雷克玛拉灵魂里的邪恶。
        - id: ch01-b175
          speaker: narrator
          text: 四周陷入深沉的寂静。
        - id: ch01-b176
          speaker: jane
          text: 所以，雷克玛拉现在就是博学先生了吗？
        - id: ch01-b177
          speaker: psammead
          text: 是雷克玛拉身上一切善良的部分。
        - id: ch01-b178
          speaker: anthea
          text: 他也应该得到心愿。
        - id: ch01-b179
          speaker: psammead
          text: >-
            他的心愿就是你手里那枚完整护符。从第一次看见破损的半枚护符起，他想要的就一直是它。
        - id: ch01-b180
          speaker: anthea
          text: 我们的心愿已经实现了。
        - id: ch01-b181
          speaker: psammead
          text: >-
            是啊，你们的父母要回家了。可我怎么办？我会被发现，被拿去展览，受尽羞辱。他们肯定还会逼我进国会。那地方讨厌透了，全是泥，一粒沙都没有。沙漠里那座美丽的巴勒贝克神庙却有许多好沙子，也没有政治。我真希望自己安全地待在那里的过去。
          emotion: angry
        - id: ch01-b182
          speaker: learned_gentleman
          text: 那我也希望你在那里。
        - id: ch01-b183
          speaker: narrator
          text: >-
            博学先生说话时心不在焉，却还是跟平常一样客气。没想到，他随口说出的愿望立刻生效。赛米德把身体鼓得圆圆的，转动那双蜗牛般的长眼睛，最后依依不舍地望了安西娅一眼。安西娅后来总说，也始终相信，那是赛米德留给她的、充满爱意的一眼。随后，没有告别，也没有别的响动，赛米德就从房间里消失了。
        - id: ch01-b184
          speaker: anthea
          text: 我想它会很幸福。它真正放在心上的东西，毕竟只有沙子。
        - id: ch01-b185
          speaker: learned_gentleman
          text: 亲爱的孩子们，我一定睡着了。我做了一场最离奇的梦。
        - id: ch01-b186
          speaker: cyril
          text: 希望那是一场好梦。
        - id: ch01-b187
          speaker: learned_gentleman
          text: 是的。梦醒以后，我觉得自己焕然一新，彻底成了另一个人。
        - id: ch01-b188
          speaker: narrator
          text: 楼下的前门铃忽然响了。紧接着，孩子们听见有人开门，又听见好几个熟悉的声音从门厅传来。
        - id: ch01-b189
          speaker: robert
          text: 是他们！
          emotion: happy
        - id: ch01-b190
          speaker: narrator
          text: 四颗心同时激动得发颤。安西娅从简手里拿过护符，塞进博学先生掌中。
        - id: ch01-b191
          speaker: anthea
          text: >-
            给你！它完全属于你，是我们送你的礼物。因为你也是雷克玛拉……我是说，因为你实在太可爱了。
          emotion: happy
        - id: ch01-b192
          speaker: narrator
          text: >-
            安西娅来不及多说，只急促却热烈地抱了抱博学先生。四个孩子随即一阵风似的冲出房间，奔下楼梯，涌进门厅。一个马车夫正在门口进进出出，把旅途中带回的箱子一只只搬进屋。孩子们已经等了那么久，也想了那么多次，如今终于亲眼看见日思夜想的心愿站在家里。而且那不是一个心愿，是三重的。三个人都裹在厚厚的旅行斗篷和披巾里，风尘仆仆地站在孩子们眼前。是妈妈，是爸爸，还有小羊羔。护符答应给他们的愿望没有少掉任何一部分。他们最爱、最盼望的三个人，终于全都平安回家了。
        - id: ch01-b193
          speaker: learned_gentleman
          text: >-
            天哪，多么珍贵的宝物！亲爱的孩子们！一定是他们的情意，让我忽然有了这些明亮的洞见。我仿佛看见了许多过去从未看见的东西。亲爱的孩子们，亲爱的、亲爱的孩子们！
