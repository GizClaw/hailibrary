  chapters:
    - id: ch01
      title: The Heart's Desire
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If only there were time, I could tell you so much more. On one soaking day, against the Psammead's advice, the four children passed through the Amulet Arch into the golden desert. There they found the great Temple of Baalbec. They also met the Phoenix, whom they never expected to see again. The Phoenix did not remember them at all. Only after it fell into a kind of prophetic trance did anything return to it, if that can truly be called remembering. The whole adventure was wonderfully thrilling. I would gladly tell you every part of it, but there simply is not time, so all of it must be left out.
        - id: ch01-b02
          speaker: narrator
          text: Nor can I tell you everything that happened when the children carried the Psammead to the Hippodrome in its travelling bag. Wishes made by the people sitting around them began to come true. They were granted so suddenly, and in such surprising ways, that the children could not let it continue. At last Anthea had to pick up the travelling bag and hurry the Psammead home. That meant she missed half the performance herself.
        - id: ch01-b03
          speaker: narrator
          text: Then there was the evening Nurse went to tea with a friend out Ivalunk way. The children chose that evening for a game of devil in the dark, one of the creepiest games they knew. Right in the middle of it, the postman hammered at the door. The knock frightened Jane nearly out of her life, but she still went to collect the letters. She meant to keep them perfectly safe, so she tucked them behind the clothes brushes in the back of the hall-stand drawer. Safe they certainly were. She never thought about them again for weeks and weeks.
        - id: ch01-b04
          speaker: narrator
          text: One truly good thing happened at a magic-lantern lecture in the boys' school at Camden Town. The Psammead was there, and the lecturer spoke about British soldiers in South Africa. He ended with a wish.
        - id: ch01-b05
          speaker: lecturer
          text: I hope every boy here carries the seeds of courage, heroism, and self-sacrifice in his heart. May every one of you grow into a noble, brave, and unselfish citizen, worthy of this great Empire and of the soldiers who freely gave their lives for it.
        - id: ch01-b06
          speaker: narrator
          text: Naturally, the wish came true. That was a definite victory for Camden Town. Anthea thought it unlucky that he had said boys. She and Jane would have to become noble and unselfish without magical help.
        - id: ch01-b07
          speaker: jane
          text: Perhaps our beautiful natures have made us noble already. It's only boys who need magic to make them brave.
        - id: ch01-b08
          speaker: narrator
          text: That remark nearly began a splendid quarrel among them. And perhaps you would like every detail of the business involving the fishing rod, the fishhooks, and the cook next door. It was certainly amusing from some points of view, though the cook next door probably saw very little fun in it. There is not enough time even for that tale. There is only time for the adventure at Maskelyne and Cooke's, and the Unexpected Apparition. More importantly, that adventure was the beginning of the end.
        - id: ch01-b09
          speaker: narrator
          text: Autumn rain tapped gloomy music against the windowpanes. Nurse broke through that dreary sound by suggesting a visit to the Egyptian Hall, which was called England's Home of Mystery. The four children had excellent private reasons for knowing that their own special mystery was of a very different kind. Even so, every face brightened at Nurse's idea. All children love conjuring, and so do a great many grown-ups.
        - id: ch01-b10
          speaker: nurse
          text: It's in Piccadilly, not far down on the left from the Circus. Look for the big pillars. It's a little like Carter's seed shop in Holborn, which used to be Day and Martin's blacking when I was a girl. And it's a bit like Euston Station, only smaller.
        - id: ch01-b11
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Yes, we know.
        - id: ch01-b12
          speaker: narrator
          text: Nurse counted the exact number of shillings into Cyril's hand, taking care over every coin, and off they went. They followed her directions and walked along the left side of Piccadilly. They kept looking for the great pillars she had described. Yet no building they passed looked anything like Carter's seed warehouse in Holborn, or Euston Station, or the England's Home of Mystery they thought they remembered.
        - id: ch01-b13
          speaker: narrator
          text: At last they stopped a lady who was hurrying past and asked the way to Maskelyne and Cooke's.
        - id: ch01-b14
          speaker: hurried_lady
          text: I really don't know. I always shop at the Stores.
        - id: ch01-b15
          speaker: narrator
          text: She pushed past them without slowing. Jane said afterward that this proved how astonishingly ignorant grown-up people could be. At last the children found a policeman who could help. He explained that England's mysteries were now being performed, quite appropriately, at St George's Hall instead. So they trudged all the way to Langham Place. By the time they reached their seats, the first two acts on the programme were already over.
        - id: ch01-b16
          speaker: narrator
          text: They did arrive in time for the most astonishing appearances and disappearances. People and objects seemed to come from nowhere and vanish again before their eyes. The children knew more than most people about a larger and much more powerful kind of magic. Yet even they could hardly believe that the wonders on this stage were not real magic after all.
        - id: ch01-b17
          speaker: cyril
          text: If the Babylonians could see this, their old conjurer wouldn't seem so grand, would he?
        - id: ch01-b18
          speakers: [anthea, audience_lady]
          ensemble: duo
          text: Hush!
        - id: ch01-b19
          speaker: narrator
          text: There was an empty seat beside Robert. On the stage, Mr Devant held one kettle with one ordinary spout. Somehow he poured glass after glass of completely different drinks from it. People in the audience tasted them with delight, and every eye seemed fixed on the stage. At that moment Robert became aware of someone in the vacant chair. He had not seen the person approach, and he had not felt anyone sit down. There had been no movement at all. In one moment nobody was there. In the next, quite suddenly, somebody was.
        - id: ch01-b20
          speaker: narrator
          text: Robert turned. The newcomer was Rekh-mara, the Priest of Amen.
        - id: ch01-b21
          speaker: narrator
          text: Most of the audience watched Mr David Devant, but Mr David Devant had trained himself to watch his audience. At that particular instant, his attention happened to rest on the empty chair beside Robert. He saw it while it was empty, and he saw it the very next moment when the Egyptian Priest was sitting there. The man had quite plainly appeared from nowhere, directly under the magician's eyes.
        - id: ch01-b22
          speaker: devant
          text: That's an excellent trick, performed under my own eyes in my own hall. I'll find out how it was done.
        - id: ch01-b23
          speaker: narrator
          text: Mr Devant had never yet seen a conjuring trick that he could not perform himself once he had tried hard enough. He was determined that this new trick would be no exception. Meanwhile, more and more people had turned away from the kettle and noticed the clean-shaven man in his strange ancient clothes.
        - id: ch01-b24
          speaker: devant
          text: Ladies and gentlemen, here is a trick I have never performed before. The empty seat, third from the end in the second row of the gallery, is now occupied by a genuine Ancient Egyptian.
        - id: ch01-b25
          speaker: narrator
          text: Mr Devant had no idea how exactly true his announcement was. Now every eye in the hall turned toward Rekh-mara and the four children around him. For one breathless moment, the audience was too surprised to react. Then the whole hall broke into loud applause. Only the lady sitting on the Priest's other side drew back from him. She knew with absolute certainty that nobody had passed in front of her to reach that chair.
        - id: ch01-b26
          speaker: audience_lady
          text: It happened so suddenly, it made my flesh creep.
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: That was how she described it later, over tea and cold tongue. Rekh-mara was deeply annoyed by all the attention.
        - id: ch01-b28
          speaker: rekh_mara
          text: Leave this crowd with me. We must speak alone.
        - id: ch01-b29
          speaker: jane
          text: Oh, no. I wanted so much to see the Mascot Moth and the ventriloquist.
        - id: ch01-b30
          speaker: robert
          text: How did you get here?
        - id: ch01-b31
          speaker: rekh_mara
          text: How did you reach Egypt and Tyre? Come. We must leave these people.
        - id: ch01-b32
          speaker: robert
          text: I suppose we haven't any choice.
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: Robert gave an angry shrug, and they all stood up.
        - id: ch01-b34
          speaker: audience_man
          text: They're part of the show! Now they'll go backstage and appear in the next scene.
        - id: ch01-b35
          speaker: robert
          text: I wish we were.
        - id: ch01-b36
          speaker: cyril
          text: You're part of the show yourself!
        - id: ch01-b37
          speaker: narrator
          text: They escaped while the audience applauded them all the way out.
        - id: ch01-b38
          speaker: narrator
          text: In the vestibule of St George's Hall, they disguised Rekh-mara as well as they could. Robert surrendered his hat, and Cyril wrapped the Priest in his Inverness cape. The result was not good. Even with those things covering part of his ancient dress, Rekh-mara remained far too remarkable a figure to walk through London streets without notice. They had to hire a cab. The fare used the last and smallest coins any of them had. To keep Nurse from seeing their passenger arrive, they stopped the cab a few doors away from home.
        - id: ch01-b39
          speaker: narrator
          text: The girls entered first and made sure the front door remained open behind them. They gave Nurse an eager account of the conjuring show, then begged with all their hearts for dripping toast with tea. While Nurse listened to their story and answered their requests, the boys brought Rekh-mara quietly through the open door. They crossed the hall without being seen, crept up the stairs, and smuggled the Priest into their bedroom.
        - id: ch01-b40
          speaker: narrator
          text: When the girls arrived, the Priest sat on the edge of Cyril's bed with his hands on his knees, looking like the statue of a king.
        - id: ch01-b41
          speaker: cyril
          text: Come in. He won't start until we're all here. And shut the door, will you?
        - id: ch01-b42
          speaker: rekh_mara
          text: Your interests and mine are the same.
        - id: ch01-b43
          speaker: cyril
          text: Fascinating. It'll be even more fascinating if you go on following us around a respectable country wearing hardly anything.
        - id: ch01-b44
          speaker: rekh_mara
          text: Peace. What land is this, and what time?
        - id: ch01-b45
          speaker: anthea
          text: This is England, about six thousand years after your time.
        - id: ch01-b46
          speaker: rekh_mara
          text: Then the Amulet carries people through time as well as through space?
        - id: ch01-b47
          speaker: cyril
          text: More or less. Tea will be ready soon. What are we supposed to do with you?
        - id: ch01-b48
          speaker: rekh_mara
          text: You possess one half of the Amulet, and I possess the other. We need only the pin that joins them.
        - id: ch01-b49
          speaker: robert
          text: No, we don't. Your half is the very same half as ours.
        - id: ch01-b50
          speaker: rekh_mara
          text: One thing cannot be in the same place at the same time and still be two things. Here is my half. Show me yours.
        - id: ch01-b51
          speaker: narrator
          text: He laid his Amulet on the flowered Marcella counterpane. Jane watched the eyes of the others before she untied the string around her neck. Then she placed their half on the bed, far enough away that the Priest could not snatch it. Cyril and Robert took their places beside him. If either of his hands moved even slightly toward their magic treasure, both boys were ready to spring. But Rekh-mara's hands stayed still. Only his eyes opened very wide. A moment later, every other pair of eyes in the room did the same.
        - id: ch01-b52
          speaker: narrator
          text: The Amulet that Rekh-mara had brought began to quiver and shake. No hand touched it. Like a piece of steel drawn toward a magnet, it slid over the white counterpane, nearer and nearer to the children's Amulet, which was still warm from Jane's neck. Then the two pieces met. One slipped into the other as softly as two drops of water mingle on a window wrinkled with rain, or as one shining bead of quicksilver is drawn into another. Suddenly there were no longer two Amulets on the bed. There was only one.
        - id: ch01-b53
          speaker: rekh_mara
          text: Black magic!
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: Rekh-mara sprang forward to seize the Amulet that had swallowed his own. Anthea reached it first and snatched it from the bed. At that same instant, a loop of rope dropped over the Priest's head. His own forward leap pulled it tight, trapping both elbows against his sides. Before he had time to use his great strength and tear himself free, Robert knotted the rope behind him and fastened it firmly to the bedpost. Rekh-mara twisted, kicked, and struggled. All four children had to work together before they managed to bind his legs with more rope.
        - id: ch01-b55
          speaker: robert
          text: I thought he'd grab ours, so I fetched rope from the box room and kept it ready.
        - id: ch01-b56
          speaker: narrator
          text: Robert breathed hard as he tightened the last knot. The girls, rather pale, praised his foresight.
        - id: ch01-b57
          speaker: rekh_mara
          text: Free me before I strike you with the seven secret curses of Amen-Ra!
          emotion: angry
        - id: ch01-b58
          speaker: robert
          text: We certainly wouldn't free you afterward.
        - id: ch01-b59
          speaker: anthea
          text: Please don't quarrel! He has as much right to the Amulet as we do. This one has swallowed his half, so it belongs to him as well as us. We should share it.
        - id: ch01-b60
          speaker: rekh_mara
          text: Let me go!
          emotion: angry
        - id: ch01-b61
          speaker: robert
          text: Listen. If you make a noise, we'll open the window, call the police, and say you tried to rob us. They're the guards here. Now will you be quiet and listen to reason?
        - id: ch01-b62
          speaker: rekh_mara
          text: I suppose I must.
        - id: ch01-b63
          speaker: narrator
          text: They could not begin reasoning with him at once. First the children withdrew into the far corner of the bedroom, beside the washstand and the towel horse. There they held a whispered council. It went on for quite a long time, and every whisper was deeply earnest. Rekh-mara remained tied to the bedpost while they decided what was fair and what they could safely offer him. At last Anthea separated herself from the little group and returned to the Priest.
        - id: ch01-b64
          speaker: anthea
          text: We truly want to be friends and help you. Let's make a treaty and work together to find the whole Amulet. Then it will belong to you as much as to us, and we'll all receive our hearts' desire.
        - id: ch01-b65
          speaker: rekh_mara
          text: Fair words grow no onions.
        - id: ch01-b66
          speaker: jane
          text: We say fair words butter no parsnips. But we do want to be fair. We only need to bind you with honor and honest dealing.
        - id: ch01-b67
          speaker: robert
          text: Will you deal fairly with us?
        - id: ch01-b68
          speaker: rekh_mara
          text: I will. By the secret, sacred name written beneath the Altar of Amen-Ra, I swear to deal fairly with you. Will you swear an oath of honorable partnership as well?
        - id: ch01-b69
          speaker: anthea
          text: No. We don't swear oaths in England, except in police courts where the guards are, and you don't want to go there. When we say we'll do something, that is as good as an oath. We do it. Trust us, and we'll trust you.
        - id: ch01-b70
          speaker: narrator
          text: As soon as Anthea had given their promise, she knelt and began to untie the ropes around his legs. Cyril and Robert hurried to loosen the cord around his arms and free him from the bedpost. Once the last bond fell away, Rekh-mara rose to his full height. He stretched both arms as if testing his strength, looked down at the children, and laughed.
        - id: ch01-b71
          speaker: rekh_mara
          text: Now I am stronger than you, and my oath means nothing. I swore by nothing, so the oath itself is nothing. There is no secret, sacred name beneath the Altar of Amen-Ra.
        - id: ch01-b72
          speaker: psammead
          text: Oh, yes, there is!
        - id: ch01-b73
          speaker: narrator
          text: The answer came from beneath the bed. Every person in the room started at the unexpected voice, and Rekh-mara was more startled than anyone. Cyril stooped, reached into the darkness, and dragged out the bath filled with sand where the Psammead had been sleeping unnoticed through the whole discussion.
        - id: ch01-b74
          speaker: psammead
          text: You don't know everything, even if you are a Divine Father of the Temple of Amen. There is a secret, sacred name under that altar. Shall I call upon it?
        - id: ch01-b75
          speaker: rekh_mara
          text: No! No!
          emotion: fearful
        - id: ch01-b76
          speaker: jane
          text: No, please. Let's not call any names.
        - id: ch01-b77
          speaker: rekh_mara
          text: Besides, I only meant to say that although there is no name under—
        - id: ch01-b78
          speaker: psammead
          text: There is.
        - id: ch01-b79
          speaker: narrator
          text: The Psammead shook itself until sand tinkled against the bath. Rekh-mara had gone white beneath his natural brownness.
        - id: ch01-b80
          speaker: rekh_mara
          text: Even if there were no name, I accept the wordless oath of your strangely honest country. I have said I will be your friend, and so I will.
        - id: ch01-b81
          speaker: psammead
          text: Then that's settled. There's the tea bell. What will you do with your distinguished partner? He can't go down to tea dressed like that.
        - id: ch01-b82
          speaker: anthea
          text: We can't do anything until the third of December, when we're meant to find the whole charm. What can we do with Rekh-mara until then?
        - id: ch01-b83
          speaker: cyril
          text: Hide him in the box room and smuggle up his meals. It might be rather fun.
        - id: ch01-b84
          speaker: robert
          text: Like hiding a fleeing Cavalier from furious Roundheads. Yes.
        - id: ch01-b85
          speaker: narrator
          text: They took Rekh-mara up to the box room and prepared the most comfortable hiding place they could manage. It was a snug corner between an old nursery fender and the broken remains of a large four-poster bed. They gave him a bulging rag bag for a seat. An old, moth-eaten fur coat hung from a nail on the door, and they wrapped that around him for warmth. After the children had eaten their own tea, they carried a meal upstairs. Rekh-mara disliked the drink called tea, but he approved of the bread and butter and the cake served with it. Throughout the evening, the children took turns sitting with him. By bedtime he seemed fairly happy and quite settled for the night.
        - id: ch01-b86
          speaker: narrator
          text: At breakfast the next morning, each child went without one quarter of a kipper so that Rekh-mara could have something to eat. They carried the carefully saved fish upstairs. But when they reached the box room, the Priest was gone. Everything else remained just as they had left it. The rag bag sat in the snug corner, and the old moth-eaten fur coat lay there beside it. Yet the person for whom they had arranged that cozy hiding place had disappeared.
        - id: ch01-b87
          speaker: narrator
          text: Naturally, the same first thought flashed delightfully through every mind. Good riddance. Their second thought was much less comforting. Rekh-mara's half of the Amulet had been swallowed by theirs, and the joined piece now hung once more around Jane's neck. Without it, the Priest had no possible way to return to his own Egyptian past. He must still be somewhere in England. He was probably quite close to the house, and he might already be planning mischief against them. To make certain there had been no mistake, they searched the whole attic. The search was thorough and completely useless.
        - id: ch01-b88
          speaker: cyril
          text: We should go through our half Amulet now, find the whole one, and come straight back.
        - id: ch01-b89
          speaker: anthea
          text: Would that be fair? Perhaps he isn't truly a wicked deceiver. Something may have happened to him.
        - id: ch01-b90
          speaker: cyril
          text: Nothing happened to him. What possibly could?
        - id: ch01-b91
          speaker: anthea
          text: Burglars might have come in during the night and killed him by accident. Then they might have carried away all that was mortal of him, so no one would discover it.
        - id: ch01-b92
          speaker: cyril
          text: Or they hid all that was mortal in one of the big trunks up here. Shall we look again?
        - id: ch01-b93
          speaker: jane
          text: No, no! Let's tell the Psammead and ask what it thinks.
          emotion: fearful
        - id: ch01-b94
          speaker: anthea
          text: Let's ask the learned gentleman instead. If anything has happened to Rekh-mara, a gentleman's advice may be more useful than a Psammead's. And Jimmy will think it's all a dream, as usual.
        - id: ch01-b95
          speaker: narrator
          text: They knocked. At the call to come in, they entered. The learned gentleman sat before his untouched breakfast. Rekh-mara was sitting opposite him in the easy chair.
        - id: ch01-b96
          speaker: learned_gentleman
          text: Hush, please! If you make a sound, the dream may vanish. I am learning. Oh, how much I have learned in the last hour!
        - id: ch01-b97
          speaker: rekh_mara
          text: At grey dawn I left my hiding place. I found these treasures from my own country and stayed among them. Somehow, I feel more at home here.
        - id: ch01-b98
          speaker: learned_gentleman
          text: Of course it is a dream, but what an astonishing dream! By the gods! By Jove!
        - id: ch01-b99
          speaker: rekh_mara
          text: Do not call upon the gods. You may summon greater powers than you can control. He and I are already like brothers. His safety matters to me as much as my own.
        - id: ch01-b100
          speaker: learned_gentleman
          text: He has told me—
        - id: ch01-b101
          speaker: robert
          text: Have you told him everything about the Amulet?
        - id: ch01-b102
          speaker: rekh_mara
          text: No.
        - id: ch01-b103
          speaker: robert
          text: Then tell him now. He knows a great deal. Perhaps he can tell us what to do.
        - id: ch01-b104
          speaker: narrator
          text: Rekh-mara hesitated, then told him. Strangely, none of the children could ever remember afterward what he had said. Perhaps he used magic to keep it from their memories. When he finished, the learned gentleman sat silent, his elbow on the table and his head in his hand.
        - id: ch01-b105
          speaker: anthea
          text: Dear Jimmy, don't worry. Somehow, we're sure to find it today.
        - id: ch01-b106
          speaker: rekh_mara
          text: Yes. And perhaps we shall find Death with it.
        - id: ch01-b107
          speaker: robert
          text: It's meant to give us our hearts' desire.
        - id: ch01-b108
          speaker: rekh_mara
          text: Who can say what unimaginable and infinitely desirable things wait beyond the dark gates?
        - id: ch01-b109
          speaker: jane
          text: Oh, please don't.
          emotion: fearful
        - id: ch01-b110
          speaker: narrator
          text: The learned gentleman suddenly raised his head.
        - id: ch01-b111
          speaker: learned_gentleman
          text: Why not return to the Past at a moment when no one is guarding the Amulet? Wish to be beside it, with the Amulet directly under your hand.
        - id: ch01-b112
          speaker: narrator
          text: It was the simplest idea in the world, yet none of them had thought of it.
        - id: ch01-b113
          speaker: rekh_mara
          text: Come. Come now!
        - id: ch01-b114
          speaker: learned_gentleman
          text: May I come too? It is only a dream, you know.
        - id: ch01-b115
          speaker: rekh_mara
          text: Come and be welcome, my brother—
        - id: ch01-b116
          speakers: [cyril, robert]
          ensemble: duo
          text: No!
        - id: ch01-b117
          speaker: robert
          text: If you'd been with us in Atlantis, you'd know better than to let him come.
        - id: ch01-b118
          speaker: anthea
          text: Dear Jimmy, please don't ask. We'll be back before you have time to notice we're gone.
        - id: ch01-b119
          speaker: learned_gentleman
          text: And will he return too?
        - id: ch01-b120
          speaker: rekh_mara
          text: We must remain together. There is only one perfect Amulet, and the children and I have equal claims to it.
        - id: ch01-b121
          speaker: narrator
          text: Jane lifted the Amulet and spoke the Name of Power. It widened into a great arch. Rekh-mara went first, and the children followed. Through the opening, the learned gentleman saw darkness broken by smoky flashes. He rubbed his eyes for only ten seconds.
        - id: ch01-b122
          speaker: narrator
          text: The children and the Priest stood in a cramped, dark chamber. A square doorway of massive stone showed shifting light. Beyond it, many voices chanted a slow and unfamiliar hymn. Sometimes the chant quickened and the light flared, as if someone had thrown fuel on a fire.
        - id: ch01-b123
          speaker: anthea
          text: Where are we?
        - id: ch01-b124
          speaker: robert
          text: And when are we?
        - id: ch01-b125
          speaker: rekh_mara
          text: This is a shrine from near the beginning of belief. Take the Amulet and leave. It is cold here in the morning of the world.
          emotion: fearful
        - id: ch01-b126
          speaker: narrator
          text: Jane felt a stone slab beneath her hand. Something lay there shaped like the charm she had worn so long, but it was twice as thick.
        - id: ch01-b127
          speaker: jane
          text: It's here! I have it!
          emotion: surprised
        - id: ch01-b128
          speaker: narrator
          text: Her own voice sounded strange to her.
        - id: ch01-b129
          speaker: rekh_mara
          text: Come away.
        - id: ch01-b130
          speaker: robert
          text: I wish we could see more of this temple.
        - id: ch01-b131
          speaker: rekh_mara
          text: Come away. Death and powerful magic surround us. Listen.
          emotion: fearful
        - id: ch01-b132
          speaker: narrator
          text: The chanting grew louder and fiercer. The light burned more strongly.
        - id: ch01-b133
          speaker: rekh_mara
          text: They are coming! Quickly, raise the Amulet!
          emotion: fearful
        - id: ch01-b134
          speaker: narrator
          text: Jane held it up, and they were back.
        - id: ch01-b135
          speaker: anthea
          text: You've been rubbing your eyes for ages. Can't you see we've returned?
        - id: ch01-b136
          speaker: narrator
          text: The learned gentleman could only stare.
        - id: ch01-b137
          speaker: nurse
          text: Miss Anthea! Miss Jane!
          emotion: surprised
        - id: ch01-b138
          speaker: narrator
          text: Nurse's voice rose higher and more excitedly than they had ever heard it.
        - id: ch01-b139
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Oh, bother!
        - id: ch01-b140
          speaker: cyril
          text: Please keep dreaming for a moment, Mr Jimmy. We'll come straight back. Nurse will come upstairs if we don't go, and she won't believe Rekh-mara is a dream.
        - id: ch01-b141
          speaker: narrator
          text: They hurried down. Nurse stood in the hall with an orange envelope in one hand and a pink paper in the other.
        - id: ch01-b142
          speaker: nurse
          text: Your Pa and Ma have come home! The telegram says, "Reach London at eleven fifteen. Prepare rooms as directed in letter." And both their names are signed beneath it.
        - id: ch01-b143
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: Hooray! Hooray! Hooray!
          emotion: happy
        - id: ch01-b144
          speaker: narrator
          text: Anthea could not cheer. She was too close to tears.
        - id: ch01-b145
          speaker: anthea
          text: Then it really was true. We have got our hearts' desire.
          emotion: happy
        - id: ch01-b146
          speaker: nurse
          text: But I don't understand the letter. No letter ever came.
        - id: ch01-b147
          speaker: jane
          text: Oh! Could it have been one of those letters that came while we played devil in the dark? I put them in the hall-stand drawer behind the clothes brushes, and here they are!
          emotion: surprised
        - id: ch01-b148
          speaker: narrator
          text: Jane pulled open the drawer as she spoke, and there the forgotten letters were, still safe behind the brushes. One was addressed to Nurse, and the other belonged to the children. Together they explained everything. Father had finished his work as a war correspondent and was finally coming home. Mother and the Lamb were going to meet him in Italy, and all three of them would make the rest of the journey together. The letter assured them that Mother and the Lamb were both quite well. It also promised that a telegram would be sent as soon as the exact day and hour of their homecoming were known. That telegram was the orange envelope Nurse now held.
        - id: ch01-b149
          speaker: nurse
          text: Mercy me, Miss Jane! This is too bad of you. I'll have a fine time getting everything ready for your Pa and Ma.
        - id: ch01-b150
          speaker: jane
          text: Never mind that, Nurse. Isn't it more wonderful than anything?
          emotion: happy
        - id: ch01-b151
          speaker: narrator
          text: Jane hugged her.
        - id: ch01-b152
          speaker: cyril
          text: We'll help you. We only have one thing to settle upstairs, and then we'll all come down.
        - id: ch01-b153
          speaker: nurse
          text: Off with you. I know how much help you'd be. And it's ten o'clock already.
        - id: ch01-b154
          speaker: narrator
          text: Nurse laughed as she said it. The thing upstairs was considerable, and it took far longer than anyone expected. First they rushed to the boys' room for the Psammead, which was very sandy and very cross.
        - id: ch01-b155
          speaker: anthea
          text: It doesn't matter how cross or sandy it is. It ought to attend the final council.
        - id: ch01-b156
          speaker: robert
          text: I expect the learned gentleman will have fits when he sees it.
        - id: ch01-b157
          speaker: narrator
          text: He did not. Rekh-mara explained the Psammead to him.
        - id: ch01-b158
          speaker: learned_gentleman
          text: This dream becomes more wonderful every moment. I have dreamed of this creature before.
        - id: ch01-b159
          speaker: robert
          text: Jane has the half Amulet, and I have the whole one. Show yours, Jane.
        - id: ch01-b160
          speaker: narrator
          text: Jane untied the string from around her neck and laid her half of the Amulet on the learned gentleman's table. The table was littered with dusty papers and clay cylinders. Every cylinder was covered with little marks that looked like the tiny footprints of birds. Robert then brought out the whole Amulet they had taken from the ancient shrine and placed it beside Jane's half. The learned gentleman saw the perfect specimen and reached toward it with a scholar's eager, yearning hand. Before his fingers could touch it, Anthea gently caught and restrained that hand.
        - id: ch01-b161
          speaker: narrator
          text: Just as it had on the Marcella counterpane, the half Amulet trembled. Like steel pulled toward a magnet, it crossed the dusty manuscripts toward the complete charm, still warm from Robert's pocket. Like joining raindrops on window glass, like quicksilver flowing into quicksilver, the half slipped into the whole. Only one perfect and ultimate Charm remained.
        - id: ch01-b162
          speaker: psammead
          text: Well, that's settled properly.
        - id: ch01-b163
          speaker: anthea
          text: Yes, and we have our hearts' desire. Father and Mother and the Lamb are coming home today.
        - id: ch01-b164
          speaker: rekh_mara
          text: And what of me?
        - id: ch01-b165
          speaker: anthea
          text: What is your heart's desire?
        - id: ch01-b166
          speaker: rekh_mara
          text: Great and profound learning, greater than any man of my country and age possesses. But learning too far beyond its time has no use. If I return home, who will believe what I have seen in the future? Let me remain here and become the great authority on my own living age, which is ancient to you. Your scholars wonder about it endlessly, and he tells me they often wonder in vain.
        - id: ch01-b167
          speaker: psammead
          text: Ask the Amulet before you decide. Living in another age is dangerous. Your lungs were made for your own time. If you breathe air thousands of centuries ahead of them, you will feel it sooner or later. Make the mystic circle and consult the Amulet.
        - id: ch01-b168
          speaker: learned_gentleman
          text: What a dream! Dear children, if you love me, and I believe you do whether this is a dream or not, make the mystic circle and consult the Amulet.
        - id: ch01-b169
          speaker: narrator
          text: They obeyed. Once before they had crouched in a circle while August sunlight filled the room. Now the air outside was thick and yellow with the fog that always came during Cattle Show week, and street sellers called below.
        - id: ch01-b170
          speaker: jane
          text: Ur Hekau Setcheh.
        - id: ch01-b171
          speaker: narrator
          text: At the Name of Power, all light and sound vanished. The darkness and silence were deeper than anything you could dream of imagining. It was like blindness and deafness, only darker and quieter still.
        - id: ch01-b172
          speaker: narrator
          text: A light and a voice came out of that vast emptiness. At first the light revealed nothing, and the voice was too faint to hear. Both grew. The light became one no mortal could look upon and live. The voice became the sweetest and most terrible voice in the world. The children lowered their eyes. Everyone did.
        - id: ch01-b173
          speaker: amulet_voice
          text: I speak. What would you hear?
        - id: ch01-b174
          speaker: narrator
          text: No one dared answer. Then Robert spoke suddenly.
        - id: ch01-b175
          speaker: robert
          text: What should we do about Rekh-mara? Should he travel through the Amulet to his own time, or—
        - id: ch01-b176
          speaker: amulet_voice
          text: No one may travel through the Amulet to another land or age now. Such journeys were possible only while it was incomplete. Through the perfect Charm, people may pass into perfect union, which belongs to neither time nor space.
        - id: ch01-b177
          speaker: anthea
          text: Would you please explain that in words we understand? The Psammead said Rekh-mara may not be able to live here, and if he can't return—
        - id: ch01-b178
          speaker: narrator
          text: Anthea stopped. Her heart seemed to pound in her throat.
        - id: ch01-b179
          speaker: amulet_voice
          text: No one can go on living in a land or time that was not appointed for them. Yet a soul may live there if it finds another soul so much like itself that the second offers refuge within its own body. Then two souls may become one soul in one body.
        - id: ch01-b180
          speaker: narrator
          text: The children looked at one another in dismay. Rekh-mara and the learned gentleman met each other's eyes. Their looks were kind and seemed to promise many secret, sacred, and beautiful things. Anthea saw them.
        - id: ch01-b181
          speaker: anthea
          text: But dear Jimmy's soul isn't like Rekh-mara's at all. I'm sure it isn't. I don't mean to be rude, but Jimmy's soul is as good as gold, and—
        - id: ch01-b182
          speaker: amulet_voice
          text: Nothing that is not good can pass beneath the double arch of my perfect Amulet. If both men consent, speak the Word of Power. Their souls will become one forever.
        - id: ch01-b183
          speaker: jane
          text: Shall I say it?
        - id: ch01-b184
          speakers: [rekh_mara, learned_gentleman]
          ensemble: duo
          text: Yes.
        - id: ch01-b185
          speaker: narrator
          text: Both voices were eager and alive, thrilled with hope and the longing for great things. Jane took the Amulet from Robert, held it between the men, and spoke the Word of Power for the last time.
        - id: ch01-b186
          speaker: jane
          text: Ur Hekau Setcheh.
        - id: ch01-b187
          speaker: narrator
          text: The perfect Amulet became a double arch. The arches leaned together like a great letter A.
        - id: ch01-b188
          speaker: jane
          text: A stands for Amen, the god he served.
        - id: ch01-b189
          speaker: anthea
          text: Hush.
        - id: ch01-b190
          speaker: narrator
          text: The double arch glowed through the green light that had filled the room since the first Name of Power. Its new radiance was brighter and softer, with a glory and sweetness beyond words.
        - id: ch01-b191
          speaker: rekh_mara
          text: Come!
        - id: ch01-b192
          speaker: learned_gentleman
          text: Come!
        - id: ch01-b193
          speaker: narrator
          text: They reached out their hands and stepped beneath the shining arch. Rekh-mara began to tremble. Like steel pulled to a magnet, he was drawn closer and closer to the learned gentleman. Like raindrops joining on a window, like beads of quicksilver becoming one, Rekh-mara, Divine Father of the Temple of Amen-Ra, slipped into Jimmy. He vanished into him, and the two were one.
        - id: ch01-b194
          speaker: narrator
          text: Suddenly it was clear daylight. The December sun shone, and the fog had vanished like a dream. The complete Amulet rested in Jane's hand. The children, the Psammead, and the learned gentleman were there. Rekh-mara's body was gone. As for his soul, that was another matter.
        - id: ch01-b195
          speaker: robert
          text: Oh, what a horrible thing!
          emotion: disgusted
        - id: ch01-b196
          speaker: narrator
          text: A centipede as long as a finger writhed at the learned gentleman's feet, and Robert stamped on it.
        - id: ch01-b197
          speaker: psammead
          text: That was the evil in Rekh-mara's soul.
        - id: ch01-b198
          speaker: narrator
          text: A deep silence followed.
        - id: ch01-b199
          speaker: jane
          text: So Rekh-mara is him now?
        - id: ch01-b200
          speaker: psammead
          text: Everything good in Rekh-mara is.
        - id: ch01-b201
          speaker: anthea
          text: He ought to receive his heart's desire too.
        - id: ch01-b202
          speaker: psammead
          text: His heart's desire is the perfect Amulet in your hand. It has been ever since he first saw the broken half.
        - id: ch01-b203
          speaker: anthea
          text: We have ours.
        - id: ch01-b204
          speaker: psammead
          text: Yes. Your parents are coming home. But what will happen to me? They'll discover me, exhibit me, and humiliate me in every possible way. They'll make me go into Parliament, I know they will. Horrible place, all mud and no sand. The beautiful Temple of Baalbec stands in the desert, with plenty of fine sand and no politics. I wish I were safely there in the Past.
          emotion: angry
        - id: ch01-b205
          speaker: learned_gentleman
          text: I wish you were.
        - id: ch01-b206
          speaker: narrator
          text: He spoke absently but with his usual politeness. The Psammead puffed itself up. Its long snail eyes gave Anthea one last, lingering look. She always said and believed it was a loving look. Then the Psammead vanished.
        - id: ch01-b207
          speaker: anthea
          text: I suppose it's happy. Sand was the only thing it ever truly cared about.
        - id: ch01-b208
          speaker: learned_gentleman
          text: My dear children, I must have fallen asleep. I had the most extraordinary dream.
        - id: ch01-b209
          speaker: cyril
          text: I hope it was pleasant.
        - id: ch01-b210
          speaker: learned_gentleman
          text: Yes. I feel like a new man after it. An entirely new man.
        - id: ch01-b211
          speaker: narrator
          text: The front doorbell rang. A door opened below, and voices entered the house.
        - id: ch01-b212
          speaker: robert
          text: It's them!
          emotion: happy
        - id: ch01-b213
          speaker: narrator
          text: A thrill ran through four hearts.
        - id: ch01-b214
          speaker: anthea
          text: Here, take it. It's yours, your very own. This is our present because you're Rekh-mara too, and because you're such a dear.
          emotion: happy
        - id: ch01-b215
          speaker: narrator
          text: "Anthea snatched the Amulet from Jane and pressed it into the learned gentleman's hand. She hugged him quickly and fiercely. Then all four children swept downstairs. A cabman was carrying boxes into the hall. Wrapped heavily in travelling coats stood their threefold heart's desire: Mother, Father, and the Lamb."
        - id: ch01-b216
          speaker: learned_gentleman
          text: Bless me! What a treasure. Dear children! Their affection must have given me these brilliant new insights. I can see so many things now that I never saw before. The dear children. The dear, dear children!
