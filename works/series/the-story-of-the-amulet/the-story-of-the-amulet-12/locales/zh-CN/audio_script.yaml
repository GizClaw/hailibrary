      tts:
        delivery: 温和渊博，年老后多了眷恋与感慨
        timbre: 清癯温润的老年男声
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十二章　赔礼礼物和被停学的小男孩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            天气渐渐凉了。两个女孩忙着给娃娃缝暖和的连衣裙，西里尔坐在餐桌上，一边晃腿，一边拿折刀削木头做小船。忽然，他宣布自己终于想出了办法。
        - id: ch01-b02
          speaker: cyril
          text: >-
            你们还没明白吗？跑到过去找护符根本没用。过去有数不清的年月，就像海里有数不清的沙子，我们准会去错时候。哪怕找上一辈子，也未必看见它。眼下都九月底了，这就像在……里捞针。
        - id: ch01-b03
          speaker: robert
          text: 在一瓶干草里捞针，我知道。可要是不这么找，还能怎么办？
        - id: ch01-b04
          speaker: cyril
          text: 妙处就在这里。哎呀，真讨厌！每次刚说到有意思的地方，就要吃饭。
        - id: ch01-b05
          speaker: narrator
          text: >-
            老保姆偏在这时走进来。她端着刀叉和杯子，又从餐具柜里拿出桌布和餐巾，开始摆桌子。
        - id: ch01-b06
          speaker: nurse
          text: >-
            西里尔少爷，要不是我按时给你们开饭，你才真够人瞧的。别忙着抱怨，小心真碰上值得抱怨的事。
        - id: ch01-b07
          speaker: cyril
          text: 我没抱怨。可事情每次就是这么巧。
        - id: ch01-b08
          speaker: nurse
          text: >-
            真该让你碰上点儿事。我白天黑夜给你们当牛做马，连一句谢谢都听不见。
        - id: ch01-b09
          speaker: anthea
          text: 可是你样样都做得好极了。
        - id: ch01-b10
          speaker: nurse
          text: 不管怎样，这还是你们头一回肯费心告诉我。
        - id: ch01-b11
          speaker: robert
          text: >-
            非得说出来吗？我们吃得那么快，还差不多每顿都添第二份。这还看不出来？
        - id: ch01-b12
          speaker: narrator
          text: >-
            老保姆一边绕桌摆刀叉，一边说罗伯特真是个十足的男人。她那可怜的丈夫格林也是这样。两人共同生活了那么多年，每回她问晚饭合不合胃口，格林顶多挤出一句“还不错”。可临终前，他最后告诉她的却是：“玛丽亚，你一直是个好厨子。”说到这里，她的声音发了颤。安西娅赶紧说她本来就是好厨子，随即和简一起扑上去抱住她。
        - id: ch01-b13
          speaker: narrator
          text: 老保姆出去以后，安西娅说，她完全懂得保姆心里是什么滋味。
        - id: ch01-b14
          speaker: anthea
          text: >-
            咱们该受点儿罚，表示我们很后悔从前没告诉她，她做饭多好吃，人又多可爱。不是吃陈豌豆、穿粗毛衣、睡石头那种惩罚。我们来做一件赔礼礼物。礼物做好以前，西里尔不许说他的主意。反正他已经知道，我们却不知道，所以受罚更重的是我们。大家同意吗？
        - id: ch01-b15
          speaker: robert
          text: 受罚最傻了。不过要是为了让别人高兴，那就答应吧。
        - id: ch01-b16
          speaker: narrator
          text: >-
            其他人若不答应，自己也会觉得害臊，于是全都赞成了。安西娅还特地说明，这种惩罚对他们比对西里尔更重，因为西里尔已经知道那个秘密，他们却得继续等。晚饭是羊肉煎饼和黑莓苹果馅饼。四个人一面吃，一面认真商量该怎样向老保姆赔礼。直到饭快吃完，他们才终于想出一个人人满意、但愿保姆也会满意的办法。
        - id: ch01-b17
          speaker: narrator
          text: >-
            西里尔和罗伯特马上出门，嘴里还留着苹果味，嘴唇被黑莓染成紫色，罗伯特连袖口也染紫了。他们先去文具店买来一大张硬纸板，又走进一家水暖店。那家店的橱窗里摆满管子、水管、水龙头和煤气配件。他们在那里买了一块与硬纸板同样大的玻璃。店主拿出一种十分有趣的工具，工具顶端镶着一粒钻石。他替孩子们裁好玻璃，还出于天生的慷慨，白送一大块油灰和一小块胶。
        - id: ch01-b18
          speaker: narrator
          text: >-
            这时，女孩们已把四个孩子的照片浸进热水，让照片从原来的硬卡片上浮下来。四张照片被并排贴在纸板顶端。西里尔把胶装进果酱罐，再把罐子坐进炖锅，把炖锅架到火上融胶。罗伯特在照片四周画了一圈罂粟花。他画得又好又快，因为只要有人教过，罂粟花就不难画。安西娅再描出印刷体字母，简负责给字母上色。那两行字写的是：“献上我们全部的爱，你做的饭真叫人喜爱。”
        - id: ch01-b19
          speaker: narrator
          text: >-
            颜料干后，四个人都在下面签了名。他们把玻璃小心盖到纸板上，用牛皮纸沿着四周粘牢，又把整个背面也糊好，最后安上两个布带环，以便把礼物挂在墙上。等所有工序全都完成，再也来不及重做时，大家才发现原来的英文句子里，“things”这个词少写了一个字母。自然不能只为一个字母把整件礼物重做一遍，他们只好把缺少的“n”硬补进去。
        - id: ch01-b20
          speaker: anthea
          text: 好了，先正面朝上放在沙发底下。胶得几个钟头才干。小松鼠，现在说吧！
        - id: ch01-b21
          speaker: narrator
          text: >-
            西里尔用手帕使劲擦着沾满胶的手，急急忙忙开口，却只说出“我想说的是这么回事”，便陷入长久的沉默。罗伯特等了半天，只好追问究竟是什么回事。他回答“是这样的”，接着再次卡住。简刚问了一句是哪样，他便尖声埋怨大家老插嘴，害他没法说。于是人人闭嘴，谁也不再出声，只看着他皱紧眉头，在心里慢慢整理思路。
        - id: ch01-b22
          speaker: cyril
          text: >-
            我们记得以前寻找护符时做过什么。要是已经找到了，也一定会记得。所以，我们该去未来，去我们找到它以后的那个时候。到了那里，我们就会记起护符是怎么找到的。然后再回到现在，照着记忆真正把它找到。
        - id: ch01-b23
          speaker: robert
          text: 我明白了……不对，我们眼下明明还没找到呀。
        - id: ch01-b24
          speaker: cyril
          text: 将来会找到，除非赛米德把我们全耍了。
        - id: ch01-b25
          speaker: jane
          text: 真会找到吗？而且，不是得先找到，才会有找到以后吗？
        - id: ch01-b26
          speaker: anthea
          text: 嘘。我差不多明白了。小松鼠，你再慢慢说一遍。
        - id: ch01-b27
          speaker: narrator
          text: >-
            简刚说必须先找到护符，安西娅便叫她别打断。三张茫然的脸逼得西里尔把道理讲得更加明白。总会有一个他们找到护符以后的未来。他们要去的正是那个时候。到了那里，自然会记得当初怎样找到护符。然后，他们再回到现在，照记忆真正完成那次寻找。罗伯特这次终于懂了，但愿你也懂了。安西娅也明白过来，夸西里尔实在聪明。罗伯特却又担心，护符未必能向两个方向穿越时间。
        - id: ch01-b28
          speaker: cyril
          text: 如果时间不过是一个什么的什么玩意儿，应该就能。反正可以试试。
        - id: ch01-b29
          speaker: jane
          text: >-
            那就换上最好的衣服。人们不是总说，世界会随着进步越来越好、越来越光明吗？未来的人一定漂亮得不得了。
        - id: ch01-b30
          speaker: anthea
          text: 好吧。反正也得洗洗，我浑身都是胶。
        - id: ch01-b31
          speaker: narrator
          text: >-
            人人洗净、穿戴整齐后，孩子们举起护符。西里尔说，他们要去未来，看那枚已经被找到的护符。简念出力量之语，四个人穿过护符变成的巨大拱门，径直走进大英博物馆。他们立刻认出这个地方。就在正前方的玻璃柜里，果然摆着完整的护符。他们自己的半枚在那里，始终没找到的另一半也在那里。两半被一枚红石别针接在一起，那枚别针正好成了一道铰链。
        - id: ch01-b32
          speaker: robert
          text: 太妙了！它就在这儿！
          emotion: happy
        - id: ch01-b33
          speaker: cyril
          text: 是啊，就在这儿。可我们拿不出来。
        - id: ch01-b34
          speaker: narrator
          text: >-
            罗伯特想起巴比伦王后也拿不出博物馆玻璃柜里的东西。就算靠赛米德的魔法取出来，她也无法把东西带走。不过，他以为大家至少会记得护符来自哪里，这样就能回去寻找。西里尔苦涩地打断他，问他是不是真的记得。罗伯特仔细一想，只能承认，自己眼下也说不准。更糟的是，安西娅、简和西里尔同样想不起来。
        - id: ch01-b35
          speaker: jane
          text: 可我们为什么会忘记？
        - id: ch01-b36
          speaker: cyril
          text: >-
            我怎么知道。准是又一条愚蠢的古老魔法规矩。学校真该像教算术那样教魔法，或者干脆别教算术，只教魔法。那样护符才真有用。
        - id: ch01-b37
          speaker: anthea
          text: 不知道这是多远的未来。博物馆一点没变，只是不知怎么，更亮、更明朗了。
        - id: ch01-b38
          speaker: robert
          text: 不如回去，再试试过去。
        - id: ch01-b39
          speaker: anthea
          text: 等等，也许博物馆的人能告诉我们护符怎么来的。
        - id: ch01-b40
          speaker: narrator
          text: >-
            这间展厅空无一人。隔壁陈列亚述文物的展厅里，他们却遇见一个和善的胖男人，穿着宽松蓝袍，两条腿套着长袜。那些亚述文物到了未来仍然摆在那里。简看见男人的衣服，还以为博物馆换了漂亮的新制服。男人听过问题，指给他们看柜上的标签。标签先写着“来自某某的收藏”，后面跟着一个名字。那正是博学先生的名字，也就是孩子们私下叫作吉米、甚至曾在护符另一边当面这样叫过的那个人。
        - id: ch01-b41
          speaker: cyril
          text: 这条消息没多大用，不过还是谢谢你。
        - id: ch01-b42
          speaker: museum_attendant
          text: 你们怎么没上学？但愿不会被停学太久吧？
        - id: ch01-b43
          speaker: cyril
          text: 我们根本没被停学！
        - id: ch01-b44
          speaker: museum_attendant
          text: 要是我是你们，下次就不会再犯了。
        - id: ch01-b45
          speaker: narrator
          text: >-
            他显然不相信孩子们真的没有被停学，还认真劝他们下次别再犯。世上再没有哪种人，比不肯相信你的人更叫你不愿作伴了。西里尔仍然有礼貌地谢过他指给大家看标签，随后带着弟弟妹妹离开了。
        - id: ch01-b46
          speaker: narrator
          text: >-
            一走出博物馆，灿烂的阳光和蓝天便迎面涌来，晃得孩子们直眨眼。对面的房屋全消失了，那里成了一座大花园，长着树木、鲜花和平滑碧绿的草坪，却找不到一块牌子警告人们不许踩草、不许损坏树木灌丛，或不许摘花。四周摆着舒适长椅，玫瑰爬满凉亭和长长的棚架步道。喷泉低声呢喃，水花不断飞溅，落进盛满清水的白色大理石池。白色雕像在叶间闪光。鸽子有的掠过枝头，有的在细软平整的砂石地上啄食。它们不像如今博物馆前的鸽子那样又黑又乱，羽毛也不蓬散，倒像一群洁净、明亮、光滑的新银鸟。
        - id: ch01-b47
          speaker: narrator
          text: >-
            不少人坐在花园的长椅上。婴儿们身上实在没穿多少东西，就在柔软的草地上翻滚、蹬腿、玩耍。负责照管他们、弯下身陪他们玩的既有女人，也有男人。安西娅说眼前像一幅美丽的画，确实如此。人们的衣服色彩明亮柔和，每一件都做得漂亮而且十分简洁。谁都不戴男帽或女帽，却撑着许多看起来像日本阳伞的遮阳伞。树木之间还挂着一盏盏彩色玻璃灯。简抬头望着那些灯，猜想到了晚上，它们一定会在叶间一盏接一盏亮起来，因此越发希望自己也能住在未来。
        - id: ch01-b48
          speaker: anthea
          text: 真像一幅美丽的画。
        - id: ch01-b49
          speaker: jane
          text: 那些灯一定会在晚上点亮。我真希望自己也住在未来！
        - id: ch01-b50
          speaker: narrator
          text: >-
            孩子们沿小路往前走。长椅上的人好奇地看着他们，却不无礼，也没有恶意。孩子们也回望这些穿着柔美衣裳的人，但愿没有盯着不放。那些脸未必张张漂亮，不过即使只谈相貌，也胜过他们过去见过的任何一群人。真正吸引人的，是脸上的神情。孩子们起初怎么也说不出其中的特别之处，直到安西娅忽然想出答案：他们不发愁。每个人看起来都很安详，谁也不慌、不急、不焦虑、不烦躁。有些人的神色确实带着悲伤，却没有一个人满脸忧愁。
        - id: ch01-b51
          speaker: narrator
          text: >-
            未来的人虽然和善，却实在对四个孩子太感兴趣，弄得他们渐渐害羞起来。他们离开宽阔的大路，拐上一条窄窄的小径。小径在树木、灌木和长满苔藓、不断滴水的泉眼之间蜿蜒。在高大柏树之间一道幽深昏暗的凹谷里，他们发现一个小男孩。他脸朝下趴在苔藓草地上，肩膀以一种特别的方式不停发颤。那种颤法，四个孩子彼此身上都见过不止一次。安西娅马上跪到他身边。
        - id: ch01-b52
          speaker: anthea
          text: 出了什么事？
        - id: ch01-b53
          speaker: wells
          text: 我被学校停学了。
          emotion: sad
        - id: ch01-b54
          speaker: narrator
          text: >-
            这可严重了。人不会为一点小过失被停学。安西娅问他做了什么。
        - id: ch01-b55
          speaker: wells
          text: >-
            我撕碎一张纸，把纸屑扔得到处都是，扔在操场上。现在你们知道了，准不会再跟我说话。
          emotion: sad
        - id: ch01-b56
          speaker: anthea
          text: 就这些？
        - id: ch01-b57
          speaker: wells
          text: 这还不够吗？我要停学整整一天！
        - id: ch01-b58
          speaker: narrator
          text: >-
            安西娅温柔地说，自己实在不明白停学一天为什么那么可怕。男孩这才从草地上抬起脸，翻过身坐起来，惊奇地打量眼前这四个什么都不懂的陌生孩子。
        - id: ch01-b59
          speaker: wells
          text: 天哪，你们究竟是什么人？
        - id: ch01-b60
          speaker: anthea
          text: 我们来自一个很远的国家。那里随手丢一小片纸不算犯罪。
        - id: ch01-b61
          speaker: wells
          text: >-
            在这里算。大人这么做要罚款，小孩这么做就停学一天。
        - id: ch01-b62
          speaker: robert
          text: 那不就是放一天假吗？
        - id: ch01-b63
          speaker: wells
          text: >-
            你们一定来自很远的地方。放假是大家一起玩、一起吃好东西、一起快活。停学的日子里，谁也不会跟你说话。人人知道你是个被停学的人，不然你早该在学校了。
        - id: ch01-b64
          speaker: anthea
          text: 要是生病了呢？
        - id: ch01-b65
          speaker: wells
          text: >-
            几乎没人会生病。真病了，就戴病人徽章，人人都会对你好。有个男孩停学时偷戴姐姐的病人徽章，结果又被停学一个星期。整整一星期不能上学，一定可怕极了。
        - id: ch01-b66
          speaker: robert
          text: 这么说，你喜欢上学？
        - id: ch01-b67
          speaker: wells
          text: >-
            当然。学校是天底下最可爱的地方。今年我选铁路做专修科目，那里有特别棒的模型和东西。现在因为那张纸，我什么都要落后了。
        - id: ch01-b68
          speaker: cyril
          text: 专修科目是自己选的？
        - id: ch01-b69
          speaker: wells
          text: 当然。你们到底从哪里来，怎么什么都不知道？
        - id: ch01-b70
          speaker: jane
          text: 我们就是不知道，所以你最好告诉我们。
        - id: ch01-b71
          speaker: wells
          text: >-
            仲夏日学校放假，各处都用鲜花装饰。那天大家选择下一年的专修科目，一门课至少要坚持一年。当然还有阅读、绘画、公民守则这些课。快四点了，停学到四点就结束。跟我回家吧，妈妈会把所有事告诉你们。
        - id: ch01-b72
          speaker: anthea
          text: 你妈妈会喜欢你带陌生孩子回家吗？
        - id: ch01-b73
          speaker: wells
          text: 我不明白你的意思。走吧。
        - id: ch01-b74
          speaker: narrator
          text: >-
            男孩似乎完全不懂安西娅为什么担心母亲不欢迎陌生人。他理好蜂蜜色罩衫外的皮带，光着两只结实的小脚迈开步子。孩子们只好跟上。他们走过的街道宽阔、坚硬，而且十分洁净。路上没有马，只有一种开起来毫无声息的机动车。泰晤士河在绿色河岸之间流淌，河水清澈得像水晶。岸边长着树，人们安静地坐在树下钓鱼。无论走到哪里，都能看见绿树，却看不见一丝烟。所有房屋仿佛都建在同一座连绵不断的绿色大花园里。
        - id: ch01-b75
          speaker: narrator
          text: >-
            男孩把他们领到一所房子前。窗边露出一张开朗慈爱的母亲的脸。他一看见那张脸就冲进屋，紧紧抱住母亲。孩子们隔着窗户，看见他嘴唇急切地动个不停，两只手也飞快地比画、指点。没过多久，那位母亲便出来迎接他们。她穿着柔软的绿衣，先亲切地跟每个人说话，再把这群来自远方的孩子请进屋里。
        - id: ch01-b76
          speaker: narrator
          text: >-
            那是他们见过最古怪的房子。屋里空空荡荡，几乎没有摆设和装饰，每一样实用的东西却都很美。从碗柜里一排排明亮的瓷器，到地板上一方方厚实、带着东方情调的地毯，无不如此。说故事的人没有时间把整所房子仔细描写出来，一想到它与我们今天的房屋多么不同，也没有心情描写。女士却很热心，带着孩子们一间一间看遍整所房子。最奇怪的是中央的大房间。墙壁全包着软垫，地毯又软又厚，桌子和椅子也都包着软垫。孩子们环顾一周，竟找不到任何一样能让人在上面碰伤、割伤或摔伤的东西。
        - id: ch01-b77
          speaker: cyril
          text: 这房间给谁用？疯子吗？
        - id: ch01-b78
          speaker: future_mother
          text: >-
            不，当然是给孩子们的。难道你们国家没有儿童房？
        - id: ch01-b79
          speaker: anthea
          text: 有育儿室，可里面的家具和其他房间一样，又硬又有尖角。
        - id: ch01-b80
          speaker: future_mother
          text: >-
            太可怕了！你们国家一定远远落后于时代。孩子占人口一多半，给他们一间能痛快玩、又不会受伤的屋子，一点也不过分。
        - id: ch01-b81
          speaker: anthea
          text: 可这里没有壁炉。
        - id: ch01-b82
          speaker: future_mother
          text: 当然用热气管道。育儿室怎么能生火？孩子会烧伤的。
        - id: ch01-b83
          speaker: robert
          text: >-
            我们国家每年有三千多个孩子被烧死。是爸爸告诉我的，有一回我玩火时，他告诉我的。
        - id: ch01-b84
          speaker: future_mother
          text: 你们住的地方一定可怕透了！
          emotion: fearful
        - id: ch01-b85
          speaker: anthea
          text: 那为什么每件家具都得包软垫？
        - id: ch01-b86
          speaker: future_mother
          text: >-
            两三岁的小娃娃会在屋里跑来跑去，东西怎么能又硬又尖？他们会伤到自己。
        - id: ch01-b87
          speaker: narrator
          text: 罗伯特摸了摸额头上的伤疤。小时候，他正是在那里撞上了育儿室的壁炉围栏。
        - id: ch01-b88
          speaker: anthea
          text: 人人家都有这种房间吗？连穷人也有？乞丐、流浪汉和没有家的人呢？
        - id: ch01-b89
          speaker: future_mother
          text: >-
            只要有孩子，当然就有这种房间。你们的无知真叫人耳目一新！不，亲爱的，我不是说你们无知。你们的古代史明明懂得很多，只是还没上过公民义务课。至于乞丐、流浪汉和那些所谓没有家的人，我真的完全不懂你在说什么。在她听来，“没有家的人”似乎是一种不可理解的东西。
        - id: ch01-b90
          speaker: cyril
          text: >-
            我们国家不一样。我读过，伦敦从前也和现在不同。有人没有家，因为饥饿只好乞讨。整座城又黑又脏，泰晤士河浑浊污秽，街道又窄，而且……
        - id: ch01-b91
          speaker: future_mother
          text: >-
            你读的是非常过时的书，那全是黑暗时代的事。我丈夫把古代史选作过专修科目，他比我懂得多。
        - id: ch01-b92
          speaker: anthea
          text: 可我一直没看见劳动的人。
        - id: ch01-b93
          speaker: future_mother
          text: 我们全都是劳动的人呀。至少，我丈夫是木匠。
        - id: ch01-b94
          speaker: anthea
          text: 可你是一位淑女呀！
        - id: ch01-b95
          speaker: future_mother
          text: >-
            啊，多古怪的旧称呼！我丈夫准喜欢和你们谈谈。黑暗时代里，谁都能任由烟囱冒黑烟，讨厌的马挤满街道，各种垃圾都往泰晤士河里扔。那时人们受的苦，几乎让人不忍心去想。你们全都知道，真有学问。你也把古代史选作专修科目了吗？
        - id: ch01-b96
          speaker: cyril
          text: 不完全是。公民义务课究竟讲什么？
        - id: ch01-b97
          speaker: future_mother
          text: >-
            你们不是故意装不知道来逗乐吧？这门课教人怎样做个好公民，哪些事必须做，哪些事不能做。每个人都尽到责任，城镇才会成为美丽幸福的居所。年幼的孩子先学一首很浅显的儿歌：“我不偷窃，我要学会，不是劳动所得，便不属于我。无论做事还是游戏，每天都让世界变得美丽。我要善待每一个人，绝不容忍残酷的事情发生。我要勇敢，也要努力，受了伤也不要哭泣。尽我所能，常带笑颜，欢喜自己将长成大人。劳动养活自己，也帮助别人，永远献出我最大的本领。”
        - id: ch01-b98
          speaker: jane
          text: 这很容易，我都能记住。
        - id: ch01-b99
          speaker: future_mother
          text: >-
            那只是开头，后面还有许多。比如：“美丽街道不能弄脏，纸屑食物别到处乱放。公共鲜花不可采摘，它们不属‘我’，却属于‘大家’。”说到食物，你们饿不饿？威尔斯，去拿一托盘好吃的来。
        - id: ch01-b100
          speaker: robert
          text: 你为什么叫他威尔斯？
        - id: ch01-b101
          speaker: future_mother
          text: >-
            为了纪念一位伟大的改革家。你们总该听说过他吧？他生活在黑暗时代，却明白人应该先弄清自己想要什么，再努力争取。在那以前，人们只会修补已有的东西。如今，我们已经实现了他的许多设想。而且，“威尔斯”也有清泉的意思。这个名字很好听吧？
        - id: ch01-b102
          speaker: narrator
          text: >-
            威尔斯很快端着托盘回来。盘里摆着新鲜草莓、香甜蛋糕和柠檬水，几个客人和主人一起吃喝，人人都觉得十分可口。等大家吃完，母亲看了看时间，催威尔斯赶快出门，免得走迟了，来不及迎接爸爸。威尔斯听话地亲了亲母亲，又转身向四个新朋友挥手告别，这才跑了出去。
        - id: ch01-b103
          speaker: anthea
          text: 你愿不愿意去我们的国家看看？花不了一分钟。
        - id: ch01-b104
          speaker: narrator
          text: >-
            女士听见安西娅说一分钟就能去另一个国家，忍不住笑了。简却举起护符，念出力量之语。女士看见一道美丽的拱门在眼前不断长大，满心惊喜，只当这是了不起的戏法。安西娅请她穿过去，她便笑着走进拱门。可下一瞬间，她突然站在菲茨罗伊街的餐厅里，再也笑不出来了。
        - id: ch01-b105
          speaker: future_mother
          text: 多可怕的戏法！这个地方又阴暗、又丑陋，真叫人讨厌！
          emotion: disgusted
        - id: ch01-b106
          speaker: narrator
          text: >-
            她惊慌地冲到窗边，朝外望去。天空灰暗，街上雾气沉沉。一个神情阴郁的手摇风琴艺人正站在大门对面。人行道边，一个乞丐和一个卖火柴的人吵得不可开交。那条人行道的路面油腻发黑，行人们就在上面脚步匆匆地赶路。每个人都像只想赶快离开街头，躲进自家房屋的遮蔽里。
        - id: ch01-b107
          speaker: future_mother
          text: 看看他们那些可怕的脸！这些人全都怎么了？
          emotion: fearful
        - id: ch01-b108
          speaker: robert
          text: 他们只是穷人。
        - id: ch01-b109
          speaker: future_mother
          text: >-
            绝不只是穷！他们有病，不快乐，还邪恶。求你们停下吧，好孩子们。这个幻灯戏法确实聪明，可快停下！那些脸又疲惫、又痛苦、又可怜，还带着邪恶！
          emotion: sad
        - id: ch01-b110
          speaker: narrator
          text: >-
            她望着那些可怜、疲惫、痛苦又邪恶的脸，眼里含满泪水。安西娅向简使个眼色，拱门再次长大。孩子们念出力量之语，一起把女士推回她自己的时代和地方。那里的伦敦洁净美丽，泰晤士河清澈明亮，绿树蓬勃生长，谁也不害怕、不焦虑，也不匆忙。拱门消失后，菲茨罗伊街的房间里沉默了片刻。
        - id: ch01-b111
          speaker: anthea
          text: 我很高兴我们去过那里。
        - id: ch01-b112
          speaker: robert
          text: 我这一辈子再也不乱扔纸了。
        - id: ch01-b113
          speaker: jane
          text: 妈妈本来就一直叫我们别扔。
        - id: ch01-b114
          speaker: cyril
          text: >-
            我想把公民义务选作专修科目。不知道爸爸能不能教我，等他回家我要问问。
        - id: ch01-b115
          speaker: anthea
          text: 要是找到护符，爸爸现在就能回家，妈妈和小羊羔也能回来。
        - id: ch01-b116
          speaker: jane
          text: 再去一次未来吧。要是没隔得那么远，也许我们就能记起来。
        - id: ch01-b117
          speaker: narrator
          text: >-
            这一次，他们对护符说，要去护符所在、却没有那么遥远的未来。穿过熟悉的拱门，四个孩子来到一间宽敞明亮的屋子，墙上开着三扇窗户。熟悉的木乃伊棺正对着他们。窗边的桌旁坐着那位博学先生。他们一眼认出了他。尽管头发全白，他那张脸却属于不会随岁月改变的那一类。完整无缺的护符正握在他一只手中。他用另一只手抹过额头，还是孩子们熟悉的动作。
        - id: ch01-b118
          speaker: learned_gentleman
          text: 梦啊，梦！人老了，总有做不完的梦。
        - id: ch01-b119
          speaker: robert
          text: 你以前也和我们一起做过梦。你不记得了吗？
        - id: ch01-b120
          speaker: learned_gentleman
          text: >-
            当然记得。我一生做过最神奇的梦里，都有你们。
        - id: ch01-b121
          speaker: narrator
          text: >-
            屋里的书比菲茨罗伊街那间房多得多，稀奇珍贵的亚述和埃及文物也多得多。博学先生说，一生最神奇的梦里总有这几个孩子。西里尔却顾不上多看屋里的宝物，立刻指着他手中的护符，追问那东西究竟是从哪儿得到的。
        - id: ch01-b122
          speaker: learned_gentleman
          text: 要是你们不只是梦，应该记得它是你们送给我的。
        - id: ch01-b123
          speaker: cyril
          text: 可我们是从哪里得到它的？
        - id: ch01-b124
          speaker: learned_gentleman
          text: >-
            这个你们从来不肯说，总有自己的小秘密。亲爱的孩子们，你们给布卢姆斯伯里那所老房子带来过多大的变化！真希望我能常常梦见你们。现在你们长大了，已经不像小时候。
        - id: ch01-b125
          speaker: anthea
          text: 长大了？
        - id: ch01-b126
          speaker: narrator
          text: >-
            博学先生指向一个装着四张照片的相框，说孩子们未来的样子就在那里。四个人凑过去一看，照片里果然是四个成年人，两位女士，两位先生。他们从那些成年人的脸上认出了自己，却越看越厌恶，简直不敢相信自己有一天会长成这副模样。简悄悄问，他们难道真会变得这么可怕。安西娅倒想明白了，人总是一边慢慢改变，一边慢慢习惯自己。现在觉得可怕，只因一下子看见了结果。
        - id: ch01-b127
          speaker: jane
          text: 我们会长成那个样子吗？简直太可怕了！
          emotion: disgusted
        - id: ch01-b128
          speaker: anthea
          text: >-
            真变成那样以后，大概就不知道可怕了。人是一点点改变的，改变时也会一点点习惯自己。眼下突然看到，才觉得这么吓人。
        - id: ch01-b129
          speaker: narrator
          text: 博学先生满怀眷恋地望着他们，请他们别太快从梦里消失。大家沉默了一会儿。
        - id: ch01-b130
          speaker: cyril
          text: 你记得我们哪一天把护符给你吗？
        - id: ch01-b131
          speaker: learned_gentleman
          text: >-
            你们当然知道，只是梦里的你们忘了。那是1905年12月3日。那一天，我永远不会忘记。
        - id: ch01-b132
          speaker: cyril
          text: 谢谢你。真的太谢谢你了。
        - id: ch01-b133
          speaker: anthea
          text: 你换了新房间，窗外还有一座多漂亮的花园！
        - id: ch01-b134
          speaker: learned_gentleman
          text: >-
            我年纪大了，已经不在乎是不是住在博物馆附近。这地方的确很美。你们看起来和真人一模一样，我简直不能相信这只是一场梦。有件事，我只能对梦里的人说。要是告诉任何一个清醒的人，他准会当我疯了。你们送我的护符里藏着某种东西，一种我始终说不清、却非常神秘的力量。这么多年来，我一直能感觉到它，却没有办法向别人说明白。
        - id: ch01-b135
          speaker: robert
          text: 那是当然。
        - id: ch01-b136
          speaker: learned_gentleman
          text: >-
            我不是说你们不肯讲护符从哪儿来的那些可爱的小秘密，而是说护符本身。你们给我看过前半枚以后，我做了许多不可思议的梦。我那本研究亚特兰蒂斯的书，就是从一场梦里得来的。那本书给我带来了最初的名声，也带来了最初的财富。后来还有《罗马人入侵时期的不列颠》。那只是一册小小的册子，却解释了过去许多人一直不明白的问题。
        - id: ch01-b137
          speaker: anthea
          text: 是啊，它当然能解释。
        - id: ch01-b138
          speaker: learned_gentleman
          text: >-
            那还只是开始。后来，你们竟然把完整的护符送给我，真是慷慨。从那以后，不知怎么，我仿佛不必再靠推测，而是直接知道了古埃及文明的许多事。别人怎么试都推翻不了我的学说，怎么试都不行。他们把那些叫作学说，可在我心里，那些知识并不像书斋里推出来的理论，反而更像自己亲身经历后留下的记忆。我就是知道，自己说得对，也知道自己对阿蒙神庙秘密仪式的判断绝不会错。
        - id: ch01-b139
          speaker: anthea
          text: 你现在富有起来，我真高兴。住在菲茨罗伊街时，你可不富有。
        - id: ch01-b140
          speaker: learned_gentleman
          text: >-
            那时确实不富有，可现在我很富有，也有了这所漂亮的房子和可爱的花园。我有时还会亲自去园里挖土。你们记得吗？从前在菲茨罗伊街，你们总劝我别老坐在书堆里，要多活动活动。如今我真的照做了。我常常觉得，这所房子、这座花园，还有眼下安稳幸福的生活，全都是你们和护符送给我的。
        - id: ch01-b141
          speaker: narrator
          text: 安西娅高兴地亲了亲他。博学先生猛地一颤，声音也抖了起来。
        - id: ch01-b142
          speaker: learned_gentleman
          text: 这一下可不像梦。
        - id: ch01-b143
          speaker: anthea
          text: >-
            这不完全是梦。它也是护符的一部分，是一场特别特别真实的梦，亲爱的吉米。
          emotion: calm
        - id: ch01-b144
          speaker: learned_gentleman
          text: >-
            你一叫我吉米，我就知道这是梦了。我偶尔会梦见小妹妹，可那些梦没有这个真实。还记得吗？有一天，我梦见你们给我带来了巴比伦指环。
        - id: ch01-b145
          speaker: robert
          text: >-
            我们全记得。你搬出菲茨罗伊街，是不是因为太有钱，不愿住在那里？
        - id: ch01-b146
          speaker: learned_gentleman
          text: >-
            当然不是！你们知道，我绝不会因为有了钱就嫌弃那所老房子。我是在你们的老保姆去世以后才搬走的。你们怎么了？
        - id: ch01-b147
          speaker: anthea
          text: 老保姆死了？不！
          emotion: sad
        - id: ch01-b148
          speaker: learned_gentleman
          text: 是啊，谁都免不了这一遭。那已经是很久以前的事了。
        - id: ch01-b149
          speaker: narrator
          text: 简举起护符，整只手都在发抖。
        - id: ch01-b150
          speaker: jane
          text: >-
            快走，快回家！说不定回去时她已经死了，我们就来不及把礼物送给她。快走呀！
          emotion: fearful
        - id: ch01-b151
          speaker: learned_gentleman
          text: 别让这个梦现在就结束！
          emotion: sad
        - id: ch01-b152
          speaker: anthea
          text: 必须结束。
        - id: ch01-b153
          speaker: narrator
          text: 安西娅坚定地又亲了亲他。
        - id: ch01-b154
          speaker: robert
          text: >-
            既然有人要死，那就再见吧！我真高兴你又富有、又有名，而且过得幸福。
        - id: ch01-b155
          speaker: jane
          text: 快走吧！
          emotion: fearful
        - id: ch01-b156
          speaker: narrator
          text: >-
            简急得跺脚，四个孩子匆匆穿过拱门，回到自己的菲茨罗伊街。几乎就在同一时刻，老保姆端着茶点托盘走进房间。两个女孩看见她还好端端地活着，一齐冲上前去。她们扑得太快，抱得也太急，差一点儿把保姆和她手里的茶点托盘全撞翻在地。
        - id: ch01-b157
          speaker: jane
          text: 不要死！哦，千万不要！
          emotion: fearful
        - id: ch01-b158
          speaker: anthea
          text: 亲爱的、可爱的、宝贝一样的老保姆，别死呀！
          emotion: fearful
        - id: ch01-b159
          speaker: nurse
          text: >-
            老天保佑你们！只要上天开恩，我一时半会儿还不打算死。这些小宝贝究竟怎么了？
        - id: ch01-b160
          speakers: [anthea, jane]
          ensemble: duo
          text: 没什么，只要你别死！
        - id: ch01-b161
          speaker: narrator
          text: >-
            老保姆虽然完全不明白发生了什么，还是赶紧把托盘放稳，轮流抱了抱两个女孩。两个男孩不太会说这种话，便满怀真情，在她背上用力拍了几下。
        - id: ch01-b162
          speaker: nurse
          text: >-
            我这辈子从没像现在这么硬朗。什么死不死的，尽胡说！你们准是在昏暗里坐得太久，天都黑得伸手不见五指了。快放开，让我点灯。
        - id: ch01-b163
          speaker: narrator
          text: 黄色灯光照亮了四张苍白的脸。
        - id: ch01-b164
          speaker: anthea
          text: >-
            我们真的很爱你，还做了一幅画，好让你知道。小松鼠，快把它拿出来。
        - id: ch01-b165
          speaker: narrator
          text: 镶着玻璃的献礼被拖出沙发底下，举到保姆面前。
        - id: ch01-b166
          speaker: cyril
          text: 胶还没干，小心！
        - id: ch01-b167
          speaker: nurse
          text: >-
            多漂亮啊！我可从来没见过这样的好东西！上面有你们四个人的照片，还有这么漂亮的字，全是你们亲手做的。我一直都说，你们虽然有时粗心，心肠可全长在正地方。哎哟，我真没见过！我想自己这一辈子，大概从来没有像今天这样高兴过。
          emotion: happy
        - id: ch01-b168
          speaker: narrator
          text: >-
            老保姆实在高兴得不知该怎样才好，便把四个孩子一个接一个全抱了一遍。平日里，两个男孩未必喜欢让人这样搂在怀里，可不知怎么，那一天，他们一点也不介意，只管由她紧紧抱着。
        - id: ch01-b169
          speaker: narrator
          text: >-
            等这场拥抱和欢喜总算过去，安西娅又想起白天那件怎么也解释不通的事。她走到赛米德藏身的沙堆旁，没有粗暴地惊动它，而是费了好一番温柔功夫，才把那双蜗牛似的眼睛从沙里唤出来。她把自己在未来能记住什么、不能记住什么反复想了一遍，还是想不通，只好请这只古老的沙仙回答。
        - id: ch01-b170
          speaker: anthea
          text: >-
            为什么我们现在记得未来看见的一切，可身在未来时，却想不起那时已经过去的那一小段未来，也就是找到护符的那段时间？
        - id: ch01-b171
          speaker: psammead
          text: 这算什么傻问题？还没发生的事，你当然不可能记得。
        - id: ch01-b172
          speaker: anthea
          text: 可未来也还没发生，我们却记得很清楚。
        - id: ch01-b173
          speaker: psammead
          text: >-
            好孩子，那不是已经发生的事，那叫预见。梦，你们不是也记得吗？为什么不能记得预见？你们似乎永远也弄不懂最简单的道理。
        - id: ch01-b174
          speaker: narrator
          text: >-
            赛米德说完，一点也不给安西娅继续追问的机会，立刻钻回沙里。夜深以后，安西娅仍惦记着白天在未来听到的话。她穿着睡衣悄悄下楼，要再亲老保姆一下，也再看一眼那份漂亮的献礼。胶已经牢牢干透，礼物靠两条布带挂在厨房墙上，隔着玻璃闪闪发亮。
        - id: ch01-b175
          speaker: nurse
          text: 晚安，愿上天保佑你这颗有情有义的心。只要你别着凉，害一场要命的重感冒就好！
