  chapters:
    - id: ch01
      title: The Sorry-Present
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Cyril sat on the dining table, swinging his legs. He was cutting a little boat from a piece of wood while the girls made warm dresses for their dolls. The weather had begun to turn cold.
        - id: ch01-b02
          speaker: cyril
          text: Look here. I've really worked it out.
        - id: ch01-b03
          speakers: [anthea, robert, jane]
          ensemble: chorus
          text: Worked what out?
        - id: ch01-b04
          speaker: cyril
          text: Going into the Past won't help us find the Amulet. The Past has as many different times as the sea has grains of sand. We're almost certain to arrive at the wrong one. We could spend our whole lives searching and never once see the Amulet. And it's already the end of September. We might as well hunt for a needle in a bottle of hay.
        - id: ch01-b05
          speaker: robert
          text: I know all that. But if we stop searching the Past, what can we do instead?
        - id: ch01-b06
          speaker: cyril
          text: That's exactly the point. Oh, bother!
        - id: ch01-b07
          speaker: narrator
          text: Nurse had come in with knives, forks, and glasses. She began laying the table for the next meal.
        - id: ch01-b08
          speaker: cyril
          text: Meals always begin just when things get interesting.
        - id: ch01-b09
          speaker: nurse
          text: A fine interesting state you'd be in, Master Cyril, if I didn't feed you on time. Don't start grumbling, or you may find something worth grumbling about.
        - id: ch01-b10
          speaker: cyril
          text: I wasn't grumbling. But it does always happen that way.
        - id: ch01-b11
          speaker: nurse
          text: You deserve to have something happen. I slave for you day and night, and never hear one word of thanks.
        - id: ch01-b12
          speaker: anthea
          text: But you do everything beautifully.
        - id: ch01-b13
          speaker: nurse
          text: That's the first time any of you has taken the trouble to say so.
        - id: ch01-b14
          speaker: robert
          text: Why should we need to say it? We eat quickly enough, and we nearly always take a second helping. That ought to prove we like your cooking.
        - id: ch01-b15
          speaker: nurse
          text: You're a man all over, Master Robert. My poor Green was just the same. Whenever I asked if he'd enjoyed his dinner, all he'd say was, "It's all right." But when he lay dying, his last words were, "Maria, you were always a good cook."
          emotion: sad
        - id: ch01-b16
          speaker: anthea
          text: And you are a good cook!
        - id: ch01-b17
          speaker: narrator
          text: Nurse's voice had begun to tremble. Anthea and Jane threw their arms around her. After Nurse left the room, Anthea understood exactly how she had felt.
        - id: ch01-b18
          speaker: anthea
          text: We ought to do a penance. We never thought to tell Nurse how much we like her cooking, or how dear she is. Let's do something to show we're sorry.
        - id: ch01-b19
          speaker: robert
          text: Penances are silly.
        - id: ch01-b20
          speaker: anthea
          text: Not when the penance makes someone else happy. I don't mean peas in your shoes, hair shirts, or sleeping on stones. We'll make Nurse a sorry-present. And Cyril must wait to tell us his idea until we've finished it. Waiting is worse for us because he already knows the idea. Do we all agree?
        - id: ch01-b21
          speaker: narrator
          text: The others would have been ashamed to refuse, so every one of them agreed. By the end of dinner, after mutton fritters and blackberry-and-apple pie, the four had talked earnestly and settled on a present they hoped Nurse would love.
        - id: ch01-b22
          speaker: narrator
          text: Cyril and Robert hurried out with the taste of apple still in their mouths and purple blackberry stains on their lips. Robert had managed to stain his cuff as well. At the stationer's they bought a large sheet of cardboard. Then they visited the plumber's shop, where tubes, pipes, taps, and gas fittings filled the window. They bought a pane of glass exactly the same size as the cardboard. The plumber cut it with a fascinating tool that had a tiny diamond at one end. Out of pure generosity, he gave them a large lump of putty and a little piece of glue as well.
        - id: ch01-b23
          speaker: narrator
          text: While the boys were gone, the girls put four photographs of the children into hot water and floated them free from their cards. They pasted the four pictures in a row along the top of the cardboard. Cyril put the glue in a jam pot, set the pot inside a saucepan, and placed the saucepan over the fire. Robert painted a wreath of poppies around the photographs. He painted well and worked quickly, and poppies are easy once someone has shown you how. Anthea carefully drew large printed letters. Jane filled each one with color.
        - id: ch01-b24
          speaker: narrator
          text: Their message said, "With all our loves to show, we like the things to eat." When the paint was dry, all four children signed their names along the bottom. They laid the glass over the front, glued brown paper around every edge and across the back, and added two loops of tape so Nurse could hang the present on the wall.
        - id: ch01-b25
          speaker: narrator
          text: Only when it was too late did they notice that they had left the letter N out of "things." They squeezed it in. No one could be expected to remake the whole present for one missing letter.
        - id: ch01-b26
          speaker: anthea
          text: There! The glue will take hours to dry, so I'll put it under the sofa. Now, Squirrel, tell us your idea.
        - id: ch01-b27
          speaker: cyril
          text: Well, what I mean is this.
        - id: ch01-b28
          speaker: narrator
          text: Cyril rubbed his gluey hands on his handkerchief. Then he stopped. A long silence followed.
        - id: ch01-b29
          speaker: robert
          text: Well? What do you mean?
        - id: ch01-b30
          speaker: cyril
          text: It's like this.
        - id: ch01-b31
          speaker: jane
          text: Like what?
        - id: ch01-b32
          speaker: cyril
          text: How can I explain when all of you keep interrupting me?
        - id: ch01-b33
          speaker: narrator
          text: No one dared say another word. Cyril sat with his brow wrinkled into a deep frown while he sorted the idea into words the others might understand.
        - id: ch01-b34
          speaker: cyril
          text: We remember the journeys we've already made to look for the Amulet. If we'd found it on one of them, we'd remember that too.
        - id: ch01-b35
          speaker: robert
          text: Of course. But we haven't found it.
        - id: ch01-b36
          speaker: cyril
          text: No, but sometime in the future, we will have found it.
        - id: ch01-b37
          speaker: jane
          text: Are you sure we will?
        - id: ch01-b38
          speaker: cyril
          text: Unless the Psammead has made fools of us. We need to visit the time when we'll remember where we found it.
        - id: ch01-b39
          speaker: robert
          text: I see.
        - id: ch01-b40
          speaker: narrator
          text: Robert did not see at all.
        - id: ch01-b41
          speaker: anthea
          text: I nearly understand. Say it once more, Squirrel, very slowly.
        - id: ch01-b42
          speaker: cyril
          text: After we find the Amulet, there will be a future time when finding it has already happened. In that future, we'll know exactly how we did it. So we'll go to that time first, remember the answer, then return here and do the finding for real.
        - id: ch01-b43
          speaker: robert
          text: Now I see!
        - id: ch01-b44
          speaker: anthea
          text: Oh, Squirrel, that is clever!
          emotion: happy
        - id: ch01-b45
          speaker: robert
          text: But can the Amulet carry us both ways through time?
        - id: ch01-b46
          speaker: cyril
          text: It ought to, if time is only a thingummy of whatsitsname. We can try, anyway.
        - id: ch01-b47
          speaker: jane
          text: Then let's wear our best clothes. People say the world keeps getting better and brighter. Everyone in the future may be terribly smart.
        - id: ch01-b48
          speaker: anthea
          text: All right. We need to wash anyway. I'm covered in glue.
    - id: ch02
      title: The Future London
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Once they were clean and dressed, the children held up the charm.
        - id: ch02-b02
          speaker: cyril
          text: We want to visit the future and see the Amulet after we've found it.
        - id: ch02-b03
          speaker: narrator
          text: Jane spoke the Word of Power. The charm grew into its great arch, and they walked beneath it, straight into the British Museum. They knew the room the moment they saw it. Directly in front of them, beneath a glass case, lay the complete Amulet. Their own half was there, and so was the other half they had never managed to find. A pin of red stone joined the two pieces and made a hinge between them.
        - id: ch02-b04
          speaker: robert
          text: Oh, glorious! There it is!
          emotion: happy
        - id: ch02-b05
          speaker: cyril
          text: Yes, there it is. And we can't get it out of the case.
        - id: ch02-b06
          speaker: narrator
          text: Robert remembered the Queen of Babylon trying to remove objects from the Museum cases. Even Psammead magic had not allowed her to carry them away.
        - id: ch02-b07
          speaker: robert
          text: No, but now we remember where we found it. We can go back and—
        - id: ch02-b08
          speaker: cyril
          text: Do we remember? Do you know where we found it?
        - id: ch02-b09
          speaker: robert
          text: No. Now that you ask, I don't exactly remember.
        - id: ch02-b10
          speaker: narrator
          text: None of the others remembered either.
        - id: ch02-b11
          speaker: jane
          text: Why can't we remember?
        - id: ch02-b12
          speaker: cyril
          text: I don't know. Some silly old rule of enchantment, I suppose. Schools ought to teach magic along with arithmetic, or instead of it. Then an Amulet might actually be useful.
        - id: ch02-b13
          speaker: anthea
          text: I wonder how far into the future we've come. The Museum looks much the same, but everything seems lighter and brighter.
        - id: ch02-b14
          speaker: robert
          text: We might as well go home and search the Past again.
        - id: ch02-b15
          speaker: anthea
          text: Wait. Perhaps someone at the Museum can tell us where the Amulet came from.
        - id: ch02-b16
          speaker: narrator
          text: There was no one at all in the room with the Amulet. The children went on to the next gallery, where the Assyrian objects stood just as they had before. There they found a kind, stout man dressed in a loose blue gown, with stockings on his legs.
        - id: ch02-b17
          speaker: jane
          text: What a pretty new uniform!
        - id: ch02-b18
          speaker: narrator
          text: The children asked him where the Amulet had come from. The man pointed out the label fixed to its glass case. The words began, "From the collection of," and then gave a person's name. It was the name of the learned gentleman. Among themselves, and even to his face during their journeys beyond the Amulet, the children had always called him Jimmy.
        - id: ch02-b19
          speaker: cyril
          text: That doesn't help much, but thank you.
        - id: ch02-b20
          speaker: museum_attendant
          text: Why aren't you at school? I hope you haven't been expelled for long.
        - id: ch02-b21
          speaker: cyril
          text: We haven't been expelled at all.
        - id: ch02-b22
          speaker: museum_attendant
          text: Well, if I were you, I wouldn't do it again.
        - id: ch02-b23
          speaker: narrator
          text: He plainly did not believe them, and no company is less pleasant than the company of people who do not believe you.
        - id: ch02-b24
          speaker: cyril
          text: Thank you for showing us the label.
        - id: ch02-b25
          speaker: narrator
          text: They left him and walked out of the Museum. The sudden sunlight and blue sky made them blink. The houses across the road had vanished. A great garden spread in their place, filled with trees, flowers, and smooth lawns. There were no signs forbidding anyone to walk on the grass, harm the shrubs, or pick the flowers.
        - id: ch02-b26
          speaker: narrator
          text: Comfortable seats stood everywhere. Roses climbed over shady arbors and along high trellises that covered the walks. Fountains whispered and splashed into broad basins of white marble, while white statues gleamed among the leaves. Pigeons swept through the branches or pecked at the smooth, soft gravel. They were nothing like the dark, bedraggled pigeons that lived near the Museum in the children's own time. Every bird looked clean, sleek, and bright as if it had just been made from new silver.
        - id: ch02-b27
          speaker: narrator
          text: Many people rested on the seats. Babies rolled, kicked, and played on the grass, wearing very little indeed. Men as well as women looked after them and joined their games.
        - id: ch02-b28
          speaker: anthea
          text: It's like a lovely picture.
        - id: ch02-b29
          speaker: narrator
          text: It truly was. Everyone wore simple, beautiful clothes in soft, bright colors. No one had a hat or bonnet, though many carried sunshades that looked Japanese. Lamps of colored glass hung among the trees.
        - id: ch02-b30
          speaker: jane
          text: They must light those lamps in the evening. Oh, I wish we lived in the future!
        - id: ch02-b31
          speaker: narrator
          text: As the children walked down the path, people on the benches watched them with curiosity. No one was rude or unkind. The children studied the people in their beautiful, soft clothes and did their best not to stare. Those faces were worth a long look. Not every person was handsome, though the whole gathering looked finer than any crowd the children had seen before. The real difference lay in their expressions, but at first the children could not name it.
        - id: ch02-b32
          speaker: anthea
          text: I know what's different. None of them looks worried.
        - id: ch02-b33
          speaker: narrator
          text: She was right. Everyone seemed calm. No one hurried, worried, or fretted. A few people did look sad, but not one face carried that pinched, anxious look the children knew so well. Even so, every kind face turned toward the four strangely dressed visitors. The attention made the children shy. They left the broad main path and slipped into a narrow one that wound among trees, shrubs, and mossy springs dripping with water.
        - id: ch02-b34
          speaker: narrator
          text: In a deep, shadowy hollow between tall cypress trees, they found a little boy lying face down on the mossy ground. His shoulders rose and shook in a peculiar way. All four children recognized it, because they had seen the same movement in one another more than once. Anthea knelt down beside him.
        - id: ch02-b35
          speaker: anthea
          text: What's wrong?
        - id: ch02-b36
          speaker: wells
          text: I've been expelled from school.
          emotion: sad
        - id: ch02-b37
          speaker: narrator
          text: That sounded serious. Children were not expelled for small offenses.
        - id: ch02-b38
          speaker: anthea
          text: Would you mind telling us what you did?
        - id: ch02-b39
          speaker: wells
          text: I tore up one sheet of paper and scattered the pieces in the playground. Now that you know, you won't speak to me anymore.
          emotion: sad
        - id: ch02-b40
          speaker: anthea
          text: Was that all?
        - id: ch02-b41
          speaker: wells
          text: Isn't that enough? I've been expelled for the whole day!
        - id: ch02-b42
          speaker: anthea
          text: I don't quite understand.
        - id: ch02-b43
          speaker: narrator
          text: The boy raised his tearful face, rolled over, and sat up.
        - id: ch02-b44
          speaker: wells
          text: Who in the world are you?
        - id: ch02-b45
          speaker: anthea
          text: We're visitors from a distant country. Where we live, leaving a scrap of paper on the ground isn't a crime.
        - id: ch02-b46
          speaker: wells
          text: It is here. Grown-ups are fined for it, and children are expelled for the whole day.
        - id: ch02-b47
          speaker: robert
          text: But that only means you've got a holiday.
        - id: ch02-b48
          speaker: wells
          text: You must come from very far away. On a holiday, everyone has games and treats together. On an expelled day, no one speaks to you. They know you're an Expelleder because you aren't in school.
        - id: ch02-b49
          speaker: robert
          text: What if you were ill?
        - id: ch02-b50
          speaker: wells
          text: Hardly anyone is ever ill. But if someone is, they wear an illness badge, and then everybody treats them kindly. I know a boy who stole his sister's badge and wore it when he had been expelled for a day. When they discovered what he'd done, they expelled him for a whole week. It must be dreadful not to go to school for an entire week!
        - id: ch02-b51
          speaker: robert
          text: You actually like school?
          emotion: surprised
        - id: ch02-b52
          speaker: wells
          text: Of course! It's the loveliest place there is. I chose railways as my special subject this year. We have splendid models and all sorts of things. Now I'll fall behind because of that paper.
        - id: ch02-b53
          speaker: cyril
          text: You choose your own subject?
        - id: ch02-b54
          speaker: wells
          text: Naturally. Where do you come from? Don't you know anything?
        - id: ch02-b55
          speaker: jane
          text: No, we don't. You had better explain it to us.
        - id: ch02-b56
          speaker: wells
          text: On Midsummer Day, school ends and the whole place is decorated with flowers. That's when each of us chooses a special subject for the next year. Once you've chosen, you must stay with it for at least a year. Of course, you still have all the other subjects too. We learn reading and painting, and we study the rules of Citizenship.
        - id: ch02-b57
          speaker: anthea
          text: Good gracious!
          emotion: surprised
        - id: ch02-b58
          speaker: wells
          text: Look, it's almost four o'clock! My expelled time ends then. Come home with me. Mother can explain everything.
        - id: ch02-b59
          speaker: anthea
          text: Will your mother mind if you bring home four strangers?
        - id: ch02-b60
          speaker: wells
          text: I don't understand why she would. Come on.
        - id: ch02-b61
          speaker: narrator
          text: He straightened the leather belt over his honey-colored smock and set off on his sturdy bare feet. The children followed.
    - id: ch03
      title: The House of Wells
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The streets were broad, hard, and spotlessly clean. There were no horses anywhere. Instead, silent motor carriages moved along the road. The Thames flowed as clear as crystal between green banks. Trees grew at the water's edge, and people sat beneath them with their fishing lines in the stream. Green trees rose everywhere. Not a trace of smoke hung in the air. The houses stood among so much greenery that the whole city seemed to be one enormous garden.
        - id: ch03-b02
          speaker: narrator
          text: Wells led them to a house where a kind, bright motherly face appeared at the window. He rushed inside and hugged his mother. Through the glass, they saw his eager mouth moving and his quick hands pointing toward them.
        - id: ch03-b03
          speaker: narrator
          text: His mother came outside in soft green clothes. She spoke kindly to the children and invited them into the strangest house they had ever seen. At first it looked very bare because there were no ornaments at all. Yet every single thing inside was beautiful. The dresser held neat rows of bright china, and thick squares of carpet with Eastern patterns lay across the floors. The lady took the visitors through the house and showed them everything.
        - id: ch03-b04
          speaker: narrator
          text: The oddest room was a large one in the center. Soft padding covered its walls, carpet, chairs, and tables. There was nothing hard enough or sharp enough to hurt anyone.
        - id: ch03-b05
          speaker: cyril
          text: What's this room for? Is it for lunatics?
        - id: ch03-b06
          speaker: narrator
          text: The lady looked shocked.
        - id: ch03-b07
          speaker: wells_mother
          text: No! It's the children's room. Surely children in your country have rooms of their own.
        - id: ch03-b08
          speaker: anthea
          text: We have nurseries, but the furniture has hard corners like furniture everywhere else.
        - id: ch03-b09
          speaker: wells_mother
          text: How dreadful. Your country must be very far behind. Children make up more than half the people. Surely they deserve one room where they can enjoy themselves without being hurt.
        - id: ch03-b10
          speaker: anthea
          text: But where is the fireplace?
        - id: ch03-b11
          speaker: wells_mother
          text: We use hot-air pipes, of course. You couldn't put a fire in a nursery. A child might be burned.
        - id: ch03-b12
          speaker: robert
          text: In our country, more than three thousand children burn to death every year. Father told me once after I'd been playing with fire.
        - id: ch03-b13
          speaker: narrator
          text: The lady went quite pale.
        - id: ch03-b14
          speaker: wells_mother
          text: You must live in a frightful place!
          emotion: fearful
        - id: ch03-b15
          speaker: anthea
          text: Why is every piece of furniture padded?
        - id: ch03-b16
          speaker: narrator
          text: Anthea hurried to change the subject.
        - id: ch03-b17
          speaker: wells_mother
          text: Little children of two or three can't run through a room full of hard, sharp things. They might hurt themselves.
        - id: ch03-b18
          speaker: narrator
          text: Robert touched the scar on his forehead. He had got it as a small child by striking the nursery fender.
        - id: ch03-b19
          speaker: anthea
          text: Does everyone have a room like this? Even poor families?
        - id: ch03-b20
          speaker: wells_mother
          text: Of course there is a room like this wherever a child lives. How wonderfully ignorant you are! No, forgive me, my dear. I shouldn't call you ignorant. You clearly know a great deal about Ancient History. But I can see that none of you has taken the Duties of Citizenship Course yet.
        - id: ch03-b21
          speaker: anthea
          text: What about beggars and tramps? What about people without homes?
        - id: ch03-b22
          speaker: wells_mother
          text: People without homes? I truly don't know what you mean.
        - id: ch03-b23
          speaker: cyril
          text: Things are different in our country. I've read that London used to have homeless people who begged because they were hungry. The city was black and dirty. The Thames was muddy and filthy, and the streets were narrow. Wasn't that true?
        - id: ch03-b24
          speaker: wells_mother
          text: You have been reading very old books. All that belonged to the dark ages. My husband knows more about it. Ancient History was one of his special subjects.
        - id: ch03-b25
          speaker: anthea
          text: I haven't seen any working people here.
        - id: ch03-b26
          speaker: wells_mother
          text: We're all working people. My husband is a carpenter.
        - id: ch03-b27
          speaker: anthea
          text: Good gracious! But you're a lady!
          emotion: surprised
        - id: ch03-b28
          speaker: wells_mother
          text: '"Lady" is such a quaint old word. My husband will enjoy talking with you. In those dark ages, anyone was allowed to have a chimney pouring smoke into the air. Nasty horses crowded the streets, and people threw every sort of rubbish into the Thames. The suffering of ordinary people is almost too dreadful to think about. You are remarkably learned to know so much of that time. Did you choose Ancient History as your special subject?'
        - id: ch03-b29
          speaker: cyril
          text: Not exactly. What do you learn in the Duties of Citizenship Course?
        - id: ch03-b30
          speaker: wells_mother
          text: You truly don't know? You aren't only pretending for fun? The course teaches you how to be a good citizen. It shows you what you must do and what you must not do, so that you carry your share of the work. Everyone helps make the town a beautiful, happy place to live. Even the tiniest children begin with a very simple rhyme. Now, how does it go?
        - id: ch03-b31
          speaker: wells_mother
          text: I must not steal, and I must learn that nothing is mine unless I earn it. In work and play, I'll always try to make things beautiful each day. I must be kind to everyone and never stand by when something cruel is done. I must be brave. When I am hurt, I must try not to cry, and I must laugh as often as I can. I will be glad that I am growing up. I will work for my living, help everyone else, and never do less than my very best.
        - id: ch03-b32
          speaker: jane
          text: That's easy. I could remember it.
        - id: ch03-b33
          speaker: wells_mother
          text: That's only the beginning. There are many more rhymes. Another says that you mustn't drop paper or scraps of food in a beautiful street. You mustn't pick the public flowers either. They don't belong to one person. They belong to everyone.
        - id: ch03-b34
          speaker: wells_mother
          text: Speaking of food, are you hungry? Wells, please bring us a tray of nice things.
        - id: ch03-b35
          speaker: robert
          text: Why is he called Wells?
        - id: ch03-b36
          speaker: narrator
          text: The boy ran off to fetch the food.
        - id: ch03-b37
          speaker: wells_mother
          text: He's named for the great reformer. Surely you've heard of him. He lived in the dark ages, and he understood that people should first discover what they truly wanted and then try to achieve it. Until then, they had always tried to patch up whatever they happened to have. We now enjoy many of the things he imagined. Besides, the word "wells" means springs of clear water. It's a lovely name, don't you think?
        - id: ch03-b38
          speaker: narrator
          text: Wells soon came back carrying a tray of strawberries, cakes, and lemonade. The visitors had worked up an appetite during their journey, and everyone ate heartily and enjoyed the food.
        - id: ch03-b39
          speaker: wells_mother
          text: Wells, you had better go now, or you'll be late meeting Daddy.
        - id: ch03-b40
          speaker: narrator
          text: Wells kissed his mother, waved to the visitors, and left.
        - id: ch03-b41
          speaker: anthea
          text: Would you like to visit our country and see what it's like? It would only take a moment.
        - id: ch03-b42
          speaker: narrator
          text: The lady laughed. Jane raised the charm and spoke the Word. Its beautiful arch grew before them.
        - id: ch03-b43
          speaker: wells_mother
          text: What a marvelous conjuring trick!
          emotion: surprised
        - id: ch03-b44
          speaker: anthea
          text: Step through it.
        - id: ch03-b45
          speaker: narrator
          text: Still laughing, the lady passed under the arch. Her laughter stopped when she found herself in the Fitzroy Street dining room.
        - id: ch03-b46
          speaker: wells_mother
          text: What a horrible trick! This place is hateful, dark, and ugly!
          emotion: disgusted
        - id: ch03-b47
          speaker: narrator
          text: She ran to the window and stared outside. The sky was gray, and fog filled the street. A dreary organ-grinder stood opposite the door. At the edge of the pavement, a beggar and a man selling matches quarreled with each other. Crowds hurried over the greasy black ground. Every person seemed desperate to reach the shelter of a house.
        - id: ch03-b48
          speaker: wells_mother
          text: Look at their faces! What is wrong with everyone?
          emotion: fearful
        - id: ch03-b49
          speaker: robert
          text: They're poor. That's all.
        - id: ch03-b50
          speaker: wells_mother
          text: That isn't all. They're sick and miserable, and some look wicked. Please stop this, dear children. It's a very clever magic-lantern trick, but please make it end. Those poor, tired, unhappy faces!
          emotion: sad
        - id: ch03-b51
          speaker: narrator
          text: Tears filled her eyes. Anthea gave Jane a sign. The arch opened again, the children spoke the words, and they pushed the lady back into her own time. There London was clean and beautiful, the Thames ran clear and bright, trees grew green, and no one was afraid, anxious, or hurried.
        - id: ch03-b52
          speaker: narrator
          text: After the lady had vanished into her own bright London, the children stood together in silence. What they had seen left them with a great deal to think about.
        - id: ch03-b53
          speaker: anthea
          text: I'm glad we went.
        - id: ch03-b54
          speaker: robert
          text: I'll never drop paper in the street again for as long as I live.
        - id: ch03-b55
          speaker: jane
          text: Mother always told us not to.
        - id: ch03-b56
          speaker: cyril
          text: I'd like to choose Duties of Citizenship as a special subject. Perhaps Father could teach it to me. I'll ask him when he comes home.
        - id: ch03-b57
          speaker: anthea
          text: If we'd found the Amulet, Father could be home now. Mother and the Lamb could be here too.
          emotion: sad
        - id: ch03-b58
          speaker: jane
          text: Let's try the future again. Perhaps we'll remember if we don't go quite so far.
        - id: ch03-b59
          speaker: narrator
          text: So they raised the charm once more.
        - id: ch03-b60
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: Take us to the future where the Amulet is, but not so far away.
    - id: ch04
      title: Jimmy's Dream
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They stepped through the familiar arch into a large, bright room with three windows. Directly opposite them stood the mummy case they knew so well. At a table beside one window sat the learned gentleman. They recognized him immediately, although his hair had turned white. His was one of those faces that age does not truly change. And there in his hand was the Amulet, complete and perfect at last.
        - id: ch04-b02
          speaker: narrator
          text: He rubbed his other hand across his forehead in the familiar way.
        - id: ch04-b03
          speaker: learned_gentleman
          text: Dreams, dreams! Old age is full of them.
        - id: ch04-b04
          speaker: robert
          text: You've dreamed about us before. Don't you remember?
        - id: ch04-b05
          speaker: learned_gentleman
          text: Indeed I do. The most wonderful dreams I ever had were the ones with you in them.
        - id: ch04-b06
          speaker: narrator
          text: This room held many more books than his old room in Fitzroy Street. It was also filled with far more curious Assyrian and Egyptian treasures.
        - id: ch04-b07
          speaker: cyril
          text: Where did you get the object in your hand?
        - id: ch04-b08
          speaker: learned_gentleman
          text: If you weren't a dream, you would remember giving it to me.
        - id: ch04-b09
          speaker: cyril
          text: But where did we get it?
        - id: ch04-b10
          speaker: learned_gentleman
          text: You never told me. You always kept your little mysteries. Dear children, how you changed that old Bloomsbury house! I wish I dreamed of you more often. Now that you're grown, you aren't the same as you used to be.
        - id: ch04-b11
          speaker: anthea
          text: Grown up?
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: The learned gentleman pointed toward a frame that held four photographs. The children stared at the portraits inside. There were two grown women and two grown men, and these, apparently, were themselves. They looked at their future faces with complete disgust.
        - id: ch04-b13
          speaker: jane
          text: Are we really going to look like that? How perfectly horrid!
          emotion: disgusted
        - id: ch04-b14
          speaker: anthea
          text: If we do, we probably won't know it's horrid. We'll get used to ourselves while we're changing. It only seems dreadful because the change happened all at once for us.
        - id: ch04-b15
          speaker: narrator
          text: The learned gentleman watched them with wistful kindness.
        - id: ch04-b16
          speaker: learned_gentleman
          text: Please don't let me wake and lose you yet.
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: There was a pause. Then Cyril had another thought.
        - id: ch04-b18
          speaker: cyril
          text: Do you remember when we gave you the Amulet?
        - id: ch04-b19
          speaker: learned_gentleman
          text: You would know if you weren't a dream. It happened on the third of December, 1905. I will never forget that day.
        - id: ch04-b20
          speaker: cyril
          text: Thank you. Oh, thank you very much!
          emotion: happy
        - id: ch04-b21
          speaker: anthea
          text: You've moved to a new room, and the garden outside is lovely.
        - id: ch04-b22
          speaker: learned_gentleman
          text: I'm too old now to care about living near the Museum. This is a beautiful place. You look so real that I can hardly believe you're only a dream. There was something mysterious about that Amulet you gave me. I can tell you that because a real person would think me mad.
        - id: ch04-b23
          speaker: robert
          text: It certainly was mysterious.
        - id: ch04-b24
          speaker: learned_gentleman
          text: I don't mean your pretty childish secrets about where it came from. Something about the object itself was mysterious. After you showed me the first half, I began having extraordinary dreams. My book about Atlantis grew entirely from one of them. That book was the beginning of my fame, and of my fortune too. Then I wrote a pamphlet called Britain at the Time of the Roman Invasion. It explained many things that scholars had never understood before.
        - id: ch04-b25
          speaker: anthea
          text: Yes, it would have.
        - id: ch04-b26
          speaker: learned_gentleman
          text: That was only the beginning. Once you gave me the complete Amulet, I no longer had to build theories about ancient Egyptian civilization. Somehow, I simply knew. Other scholars have tried again and again to overturn my ideas, but they cannot do it. They call my work theory, yet it feels much more like memory to me. I know that I'm right about the secret rites in the Temple of Amen.
          emotion: happy
        - id: ch04-b27
          speaker: anthea
          text: I'm so glad you're rich. You weren't rich when you lived in Fitzroy Street.
        - id: ch04-b28
          speaker: learned_gentleman
          text: Indeed I was not rich then, but I am now. I have this beautiful house and this lovely garden. Sometimes I go outside and dig in it myself. You used to tell me that I ought to take more exercise, don't you remember? I feel that I owe the house, the garden, and everything else to you children and to the Amulet.
        - id: ch04-b29
          speaker: anthea
          text: I'm so glad.
        - id: ch04-b30
          speaker: narrator
          text: Anthea kissed him, and he started in surprise.
        - id: ch04-b31
          speaker: learned_gentleman
          text: That did not feel like a dream.
          emotion: surprised
        - id: ch04-b32
          speaker: narrator
          text: His voice trembled.
        - id: ch04-b33
          speaker: anthea
          text: It isn't exactly a dream. It's part of the Amulet, a special kind of real dream, dear Jimmy.
        - id: ch04-b34
          speaker: learned_gentleman
          text: When you call me Jimmy, I know I must be dreaming. My little sister called me that. I dream of her sometimes, but those dreams never feel as real as this. Do you remember when I dreamed you brought me the Babylonian ring?
        - id: ch04-b35
          speaker: robert
          text: We remember everything. Did you leave Fitzroy Street because you had become too rich to stay there?
        - id: ch04-b36
          speaker: learned_gentleman
          text: Oh, no! I would never have done that. You know I left after your old Nurse died and—what is it? What's wrong?
        - id: ch04-b37
          speaker: anthea
          text: Nurse is dead? Oh, no!
          emotion: sad
        - id: ch04-b38
          speaker: learned_gentleman
          text: Yes, yes. It happens to everyone. And it was a long time ago.
        - id: ch04-b39
          speaker: narrator
          text: Jane lifted the Amulet in a trembling hand.
        - id: ch04-b40
          speaker: jane
          text: Come home! Please, come now! She might die before we get back, and then we can't give her the present!
          emotion: fearful
        - id: ch04-b41
          speaker: learned_gentleman
          text: Oh, don't let the dream end yet!
          emotion: sad
        - id: ch04-b42
          speaker: anthea
          text: It has to end.
        - id: ch04-b43
          speaker: narrator
          text: Anthea kissed him once more.
        - id: ch04-b44
          speaker: robert
          text: When someone might be dying, we have to go. Good-bye! I'm so glad you're rich and famous and happy.
        - id: ch04-b45
          speaker: jane
          text: Please come!
          emotion: fearful
        - id: ch04-b46
          speaker: narrator
          text: Jane stamped in an agony of impatience, and the children went through the arch.
    - id: ch05
      title: Home to Nurse
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They had scarcely returned to Fitzroy Street when Nurse brought in the tea tray. Both girls rushed at her and nearly knocked the tray from her hands.
        - id: ch05-b02
          speaker: jane
          text: Don't die! Oh, please don't die!
          emotion: fearful
        - id: ch05-b03
          speaker: anthea
          text: Dear, darling old Nurse, don't die!
          emotion: fearful
        - id: ch05-b04
          speaker: nurse
          text: Bless you, I'm not planning to die for some time yet, please Heaven. Whatever is wrong with my chicks?
        - id: ch05-b05
          speakers: [anthea, jane]
          ensemble: duo
          text: Nothing. Only please don't!
        - id: ch05-b06
          speaker: narrator
          text: Nurse safely set down the tea tray. Then she took the frightened girls in her arms and hugged them one after the other. The boys were just as relieved, though they showed it differently. They thumped Nurse on the back with all the heartfelt affection they could manage.
        - id: ch05-b07
          speaker: nurse
          text: I'm as well as I've ever been. What nonsense is this about dying? You've sat too long in the dark, that's all. Let go while I light the gas.
        - id: ch05-b08
          speaker: narrator
          text: The yellow flame lit four pale faces.
        - id: ch05-b09
          speaker: anthea
          text: We love you so much. We made you a picture to show you. Squirrel, bring it out.
        - id: ch05-b10
          speaker: narrator
          text: They pulled the glazed present from beneath the sofa and held it up.
        - id: ch05-b11
          speaker: cyril
          text: Be careful. The glue is still wet.
        - id: ch05-b12
          speaker: nurse
          text: What a beauty! Well, I never! All four of your photographs are here, and look at that beautiful writing. I always did say your hearts were in the right place, even if you can be a careless lot at times. Well, I never did! I don't believe anything in my whole life has ever pleased me more than this.
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: Nurse hugged every one of them. Somehow, on that day, even the boys did not mind.
        - id: ch05-b14
          speaker: narrator
          text: Later, when the excitement had settled, Anthea went to the Psammead. Waking it took a long time and had to be done with the greatest gentleness. At last it stirred, and Anthea asked the question that had been troubling her.
        - id: ch05-b15
          speaker: anthea
          text: Why can we remember everything we saw in the future now? While we were there, we couldn't remember the part of the future when we found the Amulet, even though that part was already past for us there.
        - id: ch05-b16
          speaker: psammead
          text: What a foolish question. Naturally, you can't remember something that hasn't happened yet.
        - id: ch05-b17
          speaker: anthea
          text: But none of the future has happened yet, and we remember the rest of it.
        - id: ch05-b18
          speaker: psammead
          text: That isn't an ordinary happening, my good child. It's a prophetic vision. You remember dreams, don't you? Then why shouldn't you remember visions? You never understand even the simplest things.
        - id: ch05-b19
          speaker: narrator
          text: The Psammead turned back into sand at once.
        - id: ch05-b20
          speaker: narrator
          text: That night, after everyone had gone to bed, Anthea crept downstairs in her nightgown. She wanted to give old Nurse one final kiss before sleeping. She also took one last look at the children's beautiful testimonial. The glue had set firmly at last. Hanging by its two tapes, the glazed present shone in glory on the kitchen wall.
        - id: ch05-b21
          speaker: nurse
          text: Good night, and bless your loving heart. Just don't catch your death of cold!
