  chapters:
    - id: ch01
      title: 第十一章　法老驾前
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            尤利乌斯·恺撒和黑衣小姑娘那场奇遇过去一天，西里尔猛地闯进浴室，要在晚饭前洗手。他整个上午都在屋后平顶的蓄水池旁扮演海难水手，爬来爬去忙了半天，那双手脏得简直没法形容。可他冲到浴缸前，还没来得及拧开水龙头，却看见安西娅双肘撑着浴缸边，低着头伏在那里，眼泪一颗接一颗，不停往空浴缸里掉。
        - id: ch01-b02
          speaker: cyril
          text: 喂，这回怎么啦？再等你哭够一缸洗澡水，晚饭可要凉透了。
        - id: ch01-b03
          speaker: anthea
          text: 走开！我讨厌你，也讨厌所有人！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 西里尔一下愣住了。安西娅哭着说，从来就没人知道任何事。他老实解释，自己不知道她在生气，还以为她又像上星期那样，被水龙头弄伤了手指。安西娅却一边吸鼻子，一边讥讽地重复了一声“手指”。西里尔不自在地问她，是不是跟谁吵了架。她说没有，又叫他要么快洗那双讨厌的手，要么出去。安西娅平时很少发脾气，所以真发起脾气来，大家总是惊讶多过恼火。
        - id: ch01-b05
          speaker: narrator
          text: >-
            西里尔挪到她身边，把手搭在她胳膊上，难得温柔地劝她别哭。见她没有推开自己，他便笨拙地搂住她的肩，拿脑袋蹭了蹭她的耳朵，仿佛这副药能治好世上一切伤心事。
        - id: ch01-b06
          speaker: cyril
          text: 好啦，到底出了什么事？我保证不笑。我现在自己也一点儿不想笑。
        - id: ch01-b07
          speaker: anthea
          text: 是妈妈。我知道大家一直都想她，可我现在想得实在受不了。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            她想起古代不列颠王后怎样把伊莫金抱在怀里。伊莫金不是她，可那位王后多像妈妈。早晨的来信又说，小羊羔很喜欢海水浴。妈妈离家前一晚，正是在眼前这只浴缸里给他洗澡。说到这里，安西娅又哭了起来。
        - id: ch01-b09
          speaker: cyril
          text: >-
            别难过了。我一直在心里琢磨的那件事，有一半就是为了妈妈。我们很快会把她接回来。你先别哭，把脸洗干净，我就告诉你。让我够着水龙头。要不要我把门钥匙塞进你背后？
        - id: ch01-b10
          speaker: anthea
          text: 门钥匙是治流鼻血的。再说，我才不是小孩子，你也不是。
        - id: ch01-b11
          speaker: narrator
          text: >-
            她总算笑了一点，哭歪的嘴也慢慢恢复原样。西里尔把肥皂在双手之间来回搓，搓出一层黏稠的灰色泡沫。他说，他们从前只是拿护符来玩，现在该让它真正干活了，得把它所有的用处都使出来。这不只是为了妈妈。爸爸还在远方的战火中，他虽然没有为这件事号啕大哭，心里却一直想着。偏偏说到这里，那块裹着灰色泡沫的肥皂从手指间挤了出去，力道像弹弓一样，正好打中安西娅的下巴。
        - id: ch01-b12
          speaker: anthea
          text: 这下好了，我非洗脸不可了。
        - id: ch01-b13
          speaker: cyril
          text: >-
            你本来就得洗。我的办法是学传教士。他们把珠子、白兰地、紧身胸衣、帽子和背带送给野蛮人，那些人一感激，就回送珍珠、贝壳、象牙和食火鸡。要紧的是慷慨待人，让对方喜欢你。
        - id: ch01-b14
          speaker: narrator
          text: 安西娅正忙着把水泼到脸上，哗哗的水声盖住了西里尔的话。她只听见“贝壳”两个字，便叫他先等一等，把贝壳后面的东西重新说清楚。
        - id: ch01-b15
          speaker: cyril
          text: >-
            贝壳，还有诸如此类的东西。下次去过去，我们得好好装备。巴比伦王后不是很喜欢那本袖珍簿吗？我们带些那样的礼物，换来看一眼护符。只要知道它在哪儿，等大家睡着，再去把它拿走。
        - id: ch01-b16
          speaker: anthea
          text: 那应该不算偷吧？等我们去拿时，这件事已经发生在很久以前了。哎呀，饭铃又响了。
        - id: ch01-b17
          speaker: narrator
          text: >-
            饭铃响过以后，大家吃的是罐头鲑鱼、生菜和果酱馅饼。等晚饭吃完，桌布也收拾干净，西里尔便把自己在浴室里想出的计划仔细讲给其他人听。他们又把赛米德从沙中叫醒，郑重向它请教，带什么货物最能买来古埃及人的好感，还问那枚护符的另一半是否可能藏在法老的宫廷里。
        - id: ch01-b18
          speaker: psammead
          text: >-
            这场游戏不许我参加。我当然马上就能查出那东西在哪儿，可我不能查。不过，带点儿东西不算坏主意。别一次全拿出来，挑些小玩意儿，巧妙地藏在身上。
        - id: ch01-b19
          speaker: narrator
          text: >-
            赛米德的建议听来很有道理。很快，桌上堆满了他们以为古埃及人会喜欢的东西。安西娅拿来几个娃娃、益智积木、一套木头茶具，还有埃玛姑妈从前送她的绿色Nécessaire皮套。皮套上用金字写着那个法文名称，原先装着剪刀、小折刀、穿孔针、锥子、顶针、开瓶器和手套纽扣钩。剪刀、小刀、顶针和小折刀当然早已丢失，其余东西倒还全在，而且跟新的一样。
        - id: ch01-b20
          speaker: narrator
          text: >-
            西里尔拿出铅皮士兵、一门小炮、一架弹弓、罐头起子、领带夹、网球和一把没有钥匙的挂锁。罗伯特找来一根能自己站住的石蜡蜡烛，还特别说明古埃及人肯定没见过这种东西。他又添上一只一便士买来的日本别针托盘、刻着父亲姓名地址的橡皮图章，还有一块油灰。简则拿来钥匙圈、火钩的黄铜柄、装过冷霜的罐子、冬衣上掉下来的烟灰色珠光纽扣，以及一把没有锁的钥匙。
        - id: ch01-b21
          speaker: robert
          text: 这堆破烂不能全带。每个人只能选一样。
        - id: ch01-b22
          speaker: narrator
          text: >-
            四个孩子花了一个很愉快的下午，反复商量哪四件东西最合适，却始终不能达成一致。最后，他们照西里尔的办法轮流蒙住眼睛，伸手去摸，碰到的第一件东西就必须选定。于是西里尔摸到挂锁，安西娅拿到绿色皮套，罗伯特一把抓住蜡烛，简则捡起了领带夹。
        - id: ch01-b23
          speaker: jane
          text: 这个没什么用吧？我不相信古埃及人会打领带。
        - id: ch01-b24
          speaker: anthea
          text: >-
            不亲自挑选，也许更吉利。故事里的樵夫儿子总会在森林捡到一样没用的东西，差点儿扔掉，最后才发现那是宝物。要不然，他把失物还给别人，国王就把女儿嫁给他。
        - id: ch01-b25
          speaker: cyril
          text: 我可不要谁把手交给我结婚，多谢。
        - id: ch01-b26
          speaker: robert
          text: 我也不要。故事一到结婚，冒险准会结束。
        - id: ch01-b27
          speaker: jane
          text: >-
            我们要去的是可爱的埃及，对不对？我可不去自己一点儿也不了解的地方，尤其不要再去那座巨浪翻腾、火山燃烧的可怕城市。
        - id: ch01-b28
          speaker: narrator
          text: >-
            他们把赛米德哄进袋里。西里尔忽然说，自己已经受够国王了，人在宫殿里又太显眼。护符多半藏在神庙，最好先混进普通人中，再设法当上神庙里的助手。
        - id: ch01-b29
          speaker: anthea
          text: 就像教堂执事或司事。他们一定很容易接近神庙里的宝物。
        - id: ch01-b30
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 好极了！
        - id: ch01-b31
          speaker: narrator
          text: >-
            大家一致赞成。护符被举起来，在他们手中重新变大，拱门后又亮起温暖金黄的东方光芒。他们一步跨过，响亮而狂怒的声音立刻冲进耳朵。前一刻还是安静的菲茨罗伊街餐厅，下一刻已经掉进一群怒不可遏的东方人中。那群人气得太厉害，根本没人留意突然出现的四个孩子。孩子们一点点挤出人群，来到一所房子的墙边，靠墙站定，这才有工夫看清周围。
        - id: ch01-b32
          speaker: narrator
          text: >-
            人群中有男人、女人和孩子，肤色各不相同。若让一个孩子拿一盒一先令的颜料来画，大概会把黄赭、红赭、浅红、棕褐和墨黑全都用上。不过这些人的脸原本也已经画过，眉毛和睫毛涂得乌黑，有些人的嘴唇还抹了红。女人穿着带肩带的围裙式衣服，头和肩膀松松裹着布。男人因为都是劳苦人，身上的衣服很少。埃及男孩女孩则什么也没穿，除非你把颈上和腰间链子垂下的小饰物也算衣服。孩子们先看清了这一切，才从震耳的叫嚷中听明白只言片语。
        - id: ch01-b33
          speaker: narrator
          text: >-
            这时，一个高个子、铜色皮肤的男人爬上一辆被人群截停的战车。那辆车原本的主人已经逃走，临走还低声咕哝着要去叫卫队。男人站在高处开口演说，他的声音响亮有力，渐渐压过四周的叫嚷。没过多久，人群便慢慢安静下来，只剩他一个人的声音。
        - id: ch01-b34
          speaker: worker_speaker
          text: >-
            伙伴们，工友们，我们还要忍受主人们的暴政多久？他们靠我们的劳动成果，过着游手好闲、穷奢极欲的日子，只肯给我们勉强活命的工钱。他们吃尽大地最丰美的出产，我们却要劳苦一辈子，供他们无所顾忌地挥霍享受。不能再让这样的日子继续下去，该结束这一切了！
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: 人群轰然叫好。
        - id: ch01-b36
          speaker: worker_one
          text: 可你打算怎么做？
        - id: ch01-b37
          speaker: worker_two
          text: 小心点儿，别给自己惹来大祸！
        - id: ch01-b38
          speaker: robert
          text: 他刚才说的那些话，我上星期天在海德公园几乎全听过！
        - id: ch01-b39
          speaker: worker_speaker
          text: >-
            我们要罢工！要更多面包、洋葱和啤酒，还要更长的午休！你们已经筋疲力尽，又饿又渴，家里一贫如洗，妻子儿女也因为没有食物，饿得一天天发蔫。富人的谷仓却装满了我们需要的粮食，满得几乎就要爆开。而那些粮食，本来正是我们的双手辛苦种出来的。到谷仓去！
          emotion: angry
        - id: ch01-b40
          speakers: [worker_one, worker_two]
          ensemble: duo
          text: 到谷仓去！
        - id: ch01-b41
          speaker: worker_three
          text: 去见法老！向国王递请愿书！他会听受压迫者的呼声！
        - id: ch01-b42
          speaker: narrator
          text: >-
            人群一时向这边倒，一时又朝那边涌。先是所有人都想冲往谷仓，接着又转身奔向王宫。忽然，他们像一道被囚禁的急流冲破堤坝，沿着大街滚滚向前，四个孩子也身不由己地被卷了进去。人与人挤得密不透风，安西娅只得抱紧绣花袋，费尽力气护住它，才没有让里面的赛米德被挤得太难受。
        - id: ch01-b43
          speaker: narrator
          text: >-
            人潮冲过一条条灰暗街道。两旁房屋看着单调沉闷，窗户很少，而且都高高开在墙上。他们又经过一座市场，那里的人不花钱买东西，全都拿货物彼此交换。人群短暂停住时，罗伯特亲眼看见一篮洋葱换了一把梳子，五条鱼换了一串珠子。市场里的人显然比示威的劳工富裕，衣服更精美，身上穿的布料也更多。若在今天，他们大概会住在布里克斯顿或布罗克利那样的地方。
        - id: ch01-b44
          speaker: market_lady
          text: 这回又闹什么呢？
        - id: ch01-b45
          speaker: narrator
          text: 问话的是一位懒洋洋的大眼睛女士。她穿着半透明的细褶亚麻衣，黑发编成许多辫子，蓬蓬地堆在头上。
        - id: ch01-b46
          speaker: date_seller
          text: >-
            还是那些劳工，跟往常一样不知足。听听他们嚷的，好像多吃一口少吃一口真有什么要紧。社会的渣滓！
        - id: ch01-b47
          speaker: market_lady
          text: 一群败类！
        - id: ch01-b48
          speaker: robert
          text: 这话我也听过。
        - id: ch01-b49
          speaker: narrator
          text: >-
            人群的声音忽然由愤怒变成迟疑，又从迟疑变成恐惧。远处传来充满威吓的喊声，车轮轧轧，马蹄隆隆，而且飞快逼近。
        - id: ch01-b50
          speaker: guard_crier
          text: 卫队来了！
          emotion: fearful
        - id: ch01-b51
          speakers: [worker_one, worker_two, worker_three]
          ensemble: chorus
          text: 卫队！法老的卫队！
          emotion: fearful
        - id: ch01-b52
          speaker: narrator
          text: >-
            人群又摇摆了一下，像是悬在天平上，左右一时分不出高低。可马蹄声越来越近，劳工们终于四散奔逃，有的钻进狭窄小巷，有的躲进房屋的院落。卫兵驾着饰有凸纹皮革的战车沿街疾驰而来，车轮碾过石路，隆隆作响。那些卫兵肤色黝黑，身穿蓝色短衣，衣襟被疾驰带起的风吹开，又向身后翻飞。
        - id: ch01-b53
          speaker: market_lady
          text: >-
            骚乱总算结束了，谢天谢地。你们注意到卫队长了吗？哎呀，他可真英俊！
        - id: ch01-b54
          speaker: narrator
          text: 四个孩子趁人群还在摇摆、尚未转身逃跑的短暂一刻，奋力挤向街边。他们一面拉住彼此，免得被冲散，一面拖着同伴躲进一扇拱形门洞。直到所有人都靠墙站稳，才终于能长长喘上一口气，再互相看看有没有谁落下。
        - id: ch01-b55
          speaker: cyril
          text: 幸好我们逃出来了。
        - id: ch01-b56
          speaker: anthea
          text: 可怜的劳工还没见到国王就被赶走了。也许国王本来会帮他们呢。
        - id: ch01-b57
          speaker: jane
          text: 要是《圣经》里的那个法老，他才不会。他的心可硬了。
        - id: ch01-b58
          speaker: anthea
          text: >-
            那是摩西遇到的法老。约瑟遇到的那位不一样。我倒想去看看法老的家，不知道像不像水晶宫里的埃及宫廷。
        - id: ch01-b59
          speaker: cyril
          text: 我还以为我们说好，要设法去神庙里找份差事。
        - id: ch01-b60
          speaker: robert
          text: >-
            可我们得先认识一个人。也许可以送守门人一把挂锁，跟他交朋友。只是这些宏伟建筑里，哪些是神庙，哪些是宫殿呢？
        - id: ch01-b61
          speaker: rekh_mara
          text: 你们要找阿蒙—拉神庙，还是穆特神庙，或孔苏神庙？
        - id: ch01-b62
          speaker: narrator
          text: >-
            他们转身一看，身后站着一位年轻人。他从头到脚剃得干干净净，脚穿轻便的纸莎草凉鞋，身上的白亚麻短袍绣满厚重的彩色花纹。脚镯、手镯和臂环全是黄金制成，镶嵌得华美夺目，手指上还戴着一枚戒指。他外面套着一件绣金短褂，有点儿像轻步兵的制服，颈上的金项圈则垂着许多护身符。孩子们立刻留了心，把那些护身符一个个仔细看过，希望其中就有自己苦寻的另一半，却没有找到一个像自己的。
        - id: ch01-b63
          speaker: cyril
          text: 哪一座神庙都无所谓。
        - id: ch01-b64
          speaker: rekh_mara
          text: 告诉我你们来做什么。我是阿蒙—拉神庙的神父，也许帮得上忙。
        - id: ch01-b65
          speaker: cyril
          text: 我们来自一个日不落的大帝国。
        - id: ch01-b66
          speaker: rekh_mara
          text: 我早就觉得，你们来自某个古怪偏僻的地方。
        - id: ch01-b67
          speaker: robert
          text: 我们看过不少宫殿，这回想换个口味，参观一座神庙。
        - id: ch01-b68
          speaker: narrator
          text: 袋里的赛米德不安地动了动。祭司谨慎地问，他们是否给神庙带了礼物。
        - id: ch01-b69
          speaker: cyril
          text: >-
            礼物是有几件。可这件事牵涉魔法，我们不能全告诉你。而且这些礼物也不能白送。
        - id: ch01-b70
          speaker: rekh_mara
          text: >-
            当心别冒犯神明。我也会魔法。我能照你的模样做个蜡像，再念动咒语。蜡像在火前慢慢融化，你也会一点点萎缩，最后悲惨地死去。
        - id: ch01-b71
          speaker: cyril
          text: 那算什么？我能直接造出火来！
        - id: ch01-b72
          speaker: rekh_mara
          text: 我倒真想看看你怎么做。
        - id: ch01-b73
          speaker: cyril
          text: >-
            再容易不过。大家靠近些。我的咒语很短，也不用斋戒。联合旗，印刷机，火药，统治吧不列颠！火啊，听令来到这根小棍末端！
        - id: ch01-b74
          speaker: narrator
          text: >-
            西里尔掏出一根火柴，弯腰在靴底上一擦。那些咒语没有一个词像是埃及人听过的。等他站直身子，掌心护住的火苗正轻轻跳动。
        - id: ch01-b75
          speaker: cyril
          text: 看见了吗？来，你拿着吧。
        - id: ch01-b76
          speaker: rekh_mara
          text: 不必了，多谢。你还能再来一次吗？
        - id: ch01-b77
          speaker: cyril
          text: 当然能。
        - id: ch01-b78
          speaker: rekh_mara
          text: >-
            那就随我去法老伟大的双重宫殿。他喜爱高明的魔法，一定会赐你尊荣。既然我们都是入门之人，我也不瞒你。我近来因为一次预言失了宠。我说叙利亚会送来一位美丽公主，来的却是个三十岁的女人。不过不久以前，她确实还是个美人。时间本来就只是思想的一种形式。
        - id: ch01-b79
          speaker: narrator
          text: 听见这句熟悉的话，孩子们全都心头一震。
        - id: ch01-b80
          speaker: cyril
          text: 原来你也懂这个？
        - id: ch01-b81
          speaker: rekh_mara
          text: >-
            这是一切魔法奥秘的一部分。只要我把你们引荐给法老，先前那点儿不愉快就会被忘掉。我还会请法老，伟大的宫殿、太阳之子、南北之主，准你们住进神庙。你们可以四处细看，再教我你们的魔法，我也教你们我的。
        - id: ch01-b82
          speaker: narrator
          text: >-
            这个主意至少比当时任何人能想出的办法都好，于是孩子们同意跟着祭司穿城而过。他走在前面，一路领他们往法老的宫殿去。城中的街道非常狭窄，也很肮脏。祭司边走边解释，最好的房屋都藏在二十到二十五英尺高的围墙后面。围墙上即使开了窗，也高得叫路人无法向里张望，只有一丛丛棕榈树梢越过墙顶露出来。穷人则住在方方正正的小泥屋里，每间屋子只有一扇门、两扇窗，炊烟从后墙开出的洞中冒出来。
        - id: ch01-b83
          speaker: cyril
          text: 从我们第一次来埃及到现在，穷人造房子的本事可没进步多少。
        - id: ch01-b84
          speaker: narrator
          text: >-
            那些小屋用棕榈枝盖顶，四周到处是鸡、山羊，还有在黄尘中踢腿乱跑的赤裸孩子。一只山羊不知怎么爬上了屋顶，正在大嚼干枯的棕榈叶。它吃得高兴极了，一面发出哼哼声，一面得意地甩动脑袋。每户门上还挂着一种人像或奇怪图形。祭司告诉他们，那些全是用来挡住邪眼的护身符。
        - id: ch01-b85
          speaker: rekh_mara
          text: 那些都是护身符，挂在门上，是为了挡住邪眼，不让恶意和灾祸进屋。
        - id: ch01-b86
          speaker: robert
          text: 简，你说的可爱埃及，我真不怎么喜欢。这里根本比不上巴比伦。
        - id: ch01-b87
          speaker: jane
          text: 等你看见王宫再说吧。
        - id: ch01-b88
          speaker: narrator
          text: >-
            王宫果然比他们当天见过的一切都宏伟得多，尽管摆到巴比伦国王的宫殿旁，仍会显得寒酸。孩子们来到高高的砖墙前，墙间耸立着一座巨大的砂岩柱门。紧闭的大门由厚重的雪松木制成，装着青铜铰链，门面钉满青铜钉。旁边另有一道小门和一扇人行门，祭司领着孩子们从那里进去。他似乎知道一句特殊的暗语，守卫一听，便立刻给他们让开道路。
        - id: ch01-b89
          speaker: narrator
          text: >-
            墙内是一座大花园，种着几百种不同的树木和开花灌木。园中有一片湖，湖里游满了鱼，岸边开着蓝莲花。鸭子快活地游来游去，用简的话说，它们看着完全是现代的鸭子。祭司一路指给孩子们看卫兵室、库房和王后的宫室。随后，他们穿过一座又一座露天庭院，脚下全铺着平整石板，最后才来到宏伟的内门前。
        - id: ch01-b90
          speaker: rekh_mara
          text: >-
            我们运气很好，法老正在荣誉殿。进去以后，要显出万分敬畏赞叹。趴在地上也无妨。最要紧的是，没问到你们，绝不能开口。
        - id: ch01-b91
          speaker: robert
          text: 我爸爸小时候，我们国家也有这条规矩。
        - id: ch01-b92
          speaker: narrator
          text: >-
            荣誉殿外端挤满了人，他们跟守卫争吵，甚至动手推搡。那些守卫仿佛定下了一条规矩，不给好处，谁也别想进去。孩子们听见好几个人许诺送上贵重得惊人的礼物，不禁怀疑这些诺言以后是否真会兑现。大厅四周立着彩绘木柱，雪松木屋顶镶嵌得富丽堂皇。大厅中段横着一级又宽又浅的台阶，往前不远还有一级，再往里才是一道较窄的陡峭阶梯。
        - id: ch01-b93
          speaker: narrator
          text: >-
            那道陡梯一直通向法老的宝座。他头戴红白双冠，手执权杖，气派非凡地坐在彩绘华盖下。华盖和支柱都是木头制成，涂着鲜艳的颜色。大厅四周围着一圈低矮宽阔的长凳，国王的亲友和朝臣坐在上面，身后倚着蒙有华丽织物的靠垫。祭司领孩子们一级级走上去，直到所有人站在宝座前。忽然，他伸直双手，俯面伏地。孩子们也跟着趴下，安西娅还得格外小心，免得压到袋里的赛米德。
        - id: ch01-b94
          speaker: pharaoh
          text: 把他们扶起来，让他们同我讲话。
        - id: ch01-b95
          speaker: narrator
          text: 王室官员把一行人扶起。
        - id: ch01-b96
          speaker: pharaoh
          text: 这些陌生人是谁？雷克马拉，你的清白还没查明，竟敢到我面前来？
          emotion: angry
        - id: ch01-b97
          speaker: rekh_mara
          text: >-
            伟大的国王，您是拉神的形象，处处都像他的儿子荷鲁斯。神和人心中所想，您无不知晓。您已经看出，这些陌生人是日不落帝国里卑劣亡国君王的子孙。他们懂得埃及人不知道的魔法，还带来礼物向法老进贡。法老心中有诸神的智慧，唇上有诸神的真理。
        - id: ch01-b98
          speaker: pharaoh
          text: 话说得很好。礼物在哪儿？
        - id: ch01-b99
          speaker: narrator
          text: >-
            四个孩子忽然成了满朝目光的中心。周围坐着的一圈人，比他们能想象的更加华丽，更加金光闪耀，色彩也更加鲜艳。孩子们窘迫极了，只好一面尽力鞠躬，一面从身上掏出挂锁、绿色皮套和领带夹。就在众人注视之下，西里尔还低声咕哝，说这些东西绝不是什么贡品，因为英国从来不向别人进贡。
        - id: ch01-b100
          speaker: cyril
          text: 这些才不是贡品。英国从不进贡！
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: 王室总管从孩子们手中接过三件礼物，一件件送到宝座前。法老把陌生的挂锁、绿色皮套和领带夹轮流拿起，翻来覆去看得很有兴致。看完以后，他把东西交给身边的官员，命那人全都送到王家宝库，交由司库好好保管。
        - id: ch01-b102
          speaker: pharaoh
          text: 贡品虽少，却很稀奇，也有些价值。雷克马拉，他们的魔法呢？
        - id: ch01-b103
          speaker: rekh_mara
          text: 这些卑劣亡国之民不配为人的儿子，能够当众叫火从干木头里迸出来。
        - id: ch01-b104
          speaker: cyril
          text: 我们才不是亡国之民！
          emotion: angry
        - id: ch01-b105
          speaker: pharaoh
          text: 我倒真想看看你们怎么做。
        - id: ch01-b106
          speaker: narrator
          text: 西里尔立刻擦亮一根火柴。
        - id: ch01-b107
          speaker: pharaoh
          text: 再变些魔法。
        - id: ch01-b108
          speaker: anthea
          text: >-
            他现在不能再变。自由的人民正在喊着要面包、洋葱、啤酒和更长的午休。要是他们得到想要的东西，西里尔就能继续。
        - id: ch01-b109
          speaker: pharaoh
          text: >-
            好一个无礼的丫头。不过那群狗想要什么，就给他们什么。让他们多休息，多领口粮。反正有的是奴隶干活。
        - id: ch01-b110
          speaker: narrator
          text: 一名华服官员匆匆出去传令。
        - id: ch01-b111
          speaker: rekh_mara
          text: 您会成为万民崇拜的偶像，他们送来的供物，阿蒙神庙都要装不下了。
          emotion: happy
        - id: ch01-b112
          speaker: narrator
          text: >-
            西里尔又擦亮一根火柴，满朝上下顿时被喜悦和惊奇淹没。随后，他从口袋里取出那根能自己站住的石蜡蜡烛，用火柴把它点亮，再把燃烧的蜡烛高高举到国王面前。那根小小的火柴已经让他们惊叹不已，如今眼看蜡烛稳稳燃烧，火焰不必依附一根即刻烧尽的小木棍，也能长久发光，众人的热情再也没有边了。
        - id: ch01-b113
          speaker: rekh_mara
          text: >-
            太阳、月亮和群星都向您俯首，世间最伟大的君王啊，我得到赦免了吗？我的清白已经显明了吗？
        - id: ch01-b114
          speaker: pharaoh
          text: 大概也只能显明到这种地步。你已经获赦，快走吧，平安离开。
        - id: ch01-b115
          speaker: narrator
          text: 雷克马拉一听法老赦免了自己，立刻领命退下，快得像一道闪电，转眼便从宝座前溜走了。
        - id: ch01-b116
          speaker: pharaoh
          text: 那只袋子里是什么东西在动？陌生人，拿给我看。
        - id: ch01-b117
          speaker: narrator
          text: 孩子们别无选择，只能亮出赛米德。
        - id: ch01-b118
          speaker: pharaoh
          text: >-
            抓住它。这只猴子很稀奇，送进我的珍禽异兽园，正好添一件新鲜玩意儿。
        - id: ch01-b119
          speaker: narrator
          text: >-
            命令一下，卫兵立刻扑上去抓住赛米德。孩子们围在旁边大声哀求，赛米德也拼命用牙撕咬抓住它的人。那些恳求说得无比真切，那些牙也咬得无比用力，可两边都没能叫卫兵停手。转眼间，赛米德便被从他们眼前带走，连那只绣花袋也没能跟着它一起去。孩子们只能眼睁睁看着它消失在大厅外。
        - id: ch01-b120
          speaker: anthea
          text: 求你们小心一点儿！至少别让它沾水，把它装进神圣的屋子里！
          emotion: fearful
        - id: ch01-b121
          speaker: narrator
          text: 她把绣花袋高高举起。
        - id: ch01-b122
          speaker: robert
          text: 它是有魔法的生灵，是无价之宝！
        - id: ch01-b123
          speaker: jane
          text: 你没有权利抢走它！这太可耻了，简直是明目张胆的强盗！
          emotion: angry
        - id: ch01-b124
          speaker: narrator
          text: 大厅里顿时陷入一片可怕的寂静。
        - id: ch01-b125
          speaker: pharaoh
          text: >-
            把野兽的神圣屋子也夺过来，把他们全关起来。今晚饭后，我们也许还想看魔法。严加看守，先别拷打他们。眼下还别。
        - id: ch01-b126
          speaker: jane
          text: 我早就知道会这样！真希望你们当初别答应来这里！
          emotion: sad
        - id: ch01-b127
          speaker: cyril
          text: >-
            别哭了。是你自己非要来埃及，全是你的主意。不会有事的。
        - id: ch01-b128
          speaker: jane
          text: >-
            我以为我们会跟王后们玩球，还能痛痛快快地玩个没完。现在所有事情都要糟透了！
          emotion: sad
        - id: ch01-b129
          speaker: narrator
          text: >-
            他们被带走以后，关进的总算是一个真正的房间，并不是几个大孩子一路担心的阴暗地牢。安西娅说，这多少算一件值得安慰的事。墙上绘着好些色彩鲜明的图画，若换一个时候，他们一定会停下来仔细观看，觉得每一幅都很有趣。房间里还摆着一种低矮的卧榻和几把椅子，至少不像牢房那样空荡。等厚重的房门关上，守卫的脚步声远去，只剩他们几个以后，简终于长长松了一口气。
        - id: ch01-b130
          speaker: jane
          text: 现在我们总能平安回家了。
        - id: ch01-b131
          speaker: anthea
          text: 难道把赛米德丢下？
        - id: ch01-b132
          speaker: narrator
          text: >-
            西里尔叫大家等一下，说自己想到了一个办法。他安静地琢磨了片刻，随后走到门前，用拳头砰砰敲击那扇厚重的雪松木门。敲声在房间里显得格外响亮。没多久，门被打开一道缝，一名卫兵只把脑袋探进来，神情严厉，开口便命令他们停止这种吵闹，否则就要给他们好看。
        - id: ch01-b133
          speaker: cyril
          text: >-
            你守在这里一定很无聊吧？除了看我们，什么也不能做。想看看魔法吗？我们不介意变给你看。
        - id: ch01-b134
          speaker: palace_guard
          text: 看看也无妨。
        - id: ch01-b135
          speaker: cyril
          text: 那就把刚才被拿走的猴子找回来，我们给你变一场。
        - id: ch01-b136
          speaker: palace_guard
          text: >-
            我怎么知道你们不是耍我？说不定你们只想把那畜生弄回来，再放它咬我。它的牙和爪子也许都有毒。
        - id: ch01-b137
          speaker: robert
          text: >-
            你看，我们现在什么也没带。先关上门，五分钟以后再开。那时，我们会给你变出一件魔法东西，比如一盆开花的植物。
        - id: ch01-b138
          speaker: palace_guard
          text: 要是连这个都能做到，你们大概什么都能做。
        - id: ch01-b139
          speaker: narrator
          text: >-
            士兵说，若真能做到这一点，他们大概什么都能做到。随后他退出房间，在外面闩上门。孩子们当然马上举起护符，一边高高托着，一边慢慢转身。直到它开始变大，他们便知道已经找到了东方。大家穿过拱门回到自己的时代，又从菲茨罗伊街屋子的楼梯窗台上，搬来一盆盛开的天竺葵。那一簇簇花红得耀眼，绝不可能是刚才房间里原有的东西。
        - id: ch01-b140
          speaker: palace_guard
          text: 哎呀，我可真是……
          emotion: surprised
        - id: ch01-b141
          speaker: anthea
          text: >-
            只要把猴子还给我们，我们能变出比这神奇得多的东西。这两便士也送给你。
        - id: ch01-b142
          speaker: palace_guard
          text: 这是什么？
        - id: ch01-b143
          speaker: narrator
          text: >-
            罗伯特向他解释，付钱买东西比市场里那样拿一种货物交换另一种货物简单得多。士兵听懂以后，把两枚硬币收了起来。后来，他把钱交给自己的队长。再后来，队长又把它们呈给法老。法老当然把钱留了下来，而且对这种便利的主意大为赞赏。这其实就是埃及最早使用硬币的由来。你大概不会相信，不过说真的，既然故事其余部分你都信了，我实在想不出，你为什么偏偏不肯相信这一段。
        - id: ch01-b144
          speaker: anthea
          text: >-
            那些劳工不会有事吧？国王不会因为生我们的气，就收回答应他们的话吧？
        - id: ch01-b145
          speaker: palace_guard
          text: 不会。他挺怕魔法，一定会守信。
        - id: ch01-b146
          speaker: robert
          text: 那就好。
        - id: ch01-b147
          speaker: anthea
          text: >-
            求你把猴子找回来吧。那样你就能看见真正精彩的魔法。去吧，你是个又好心又善良的士兵。
        - id: ch01-b148
          speaker: palace_guard
          text: >-
            我不知道他们把你们那只宝贝猴子放在哪儿。不过，要是能找个人替我站岗，我就去看看有什么办法。
        - id: ch01-b149
          speaker: narrator
          text: 他很不情愿地走了出去。
        - id: ch01-b150
          speaker: robert
          text: 你的意思是，我们连护符的另一半都不找，就这样走掉？
        - id: ch01-b151
          speaker: anthea
          text: 我真的觉得，我们最好还是走吧。
          emotion: fearful
        - id: ch01-b152
          speaker: anthea
          text: >-
            护符的另一半一定就在附近，不然我们这一半不会把大家带到这里。真希望能找到它。可惜我们不懂真正的魔法，没法知道它究竟在哪里。
        - id: ch01-b153
          speaker: narrator
          text: >-
            要是孩子们知道就好了。一件极像护符另一半的东西，其实就在离他们很近的地方。它挂在某个人的脖子上，而那个人此刻正在监视他们。墙壁高处留着一道细缝，位置隐蔽，下面的人根本不会察觉。这道缝原本就是专门设计来窥看囚犯的。那个人从缝后看得见屋里的一切，可孩子们对此一点儿也不知道。
        - id: ch01-b154
          speaker: narrator
          text: >-
            他们焦急地等了将近一小时，只好努力从墙上的宴会图里寻找一点趣味。画中正在举行一场宴会，竖琴手弹着样式十分古怪的竖琴，女人们在乐声中跳舞。他们又低头研究涂过颜料的灰泥地面，还仔细看了那些木椅。椅子漆成白色，每隔一段便画着彩色条纹。可是这些东西并不能叫时间走得快些。等待依旧慢得难熬，人人都有充足的工夫，去想象晚饭以后会发生什么，再一遍遍想起法老那句“先别拷打他们，眼下还别”。
        - id: ch01-b155
          speaker: cyril
          text: >-
            真到了最坏的时候，我们只能溜走，把赛米德留在这里。它很会照顾自己。那些人一旦知道它能说话、能实现愿望，就不会杀它，也不会伤它。说不定还会给它造一座神庙。
        - id: ch01-b156
          speaker: anthea
          text: >-
            我受不了把它留在这里。法老说的是晚饭以后，现在还早。那个士兵确实很好奇，我相信眼下不会出事。
        - id: ch01-b157
          speaker: narrator
          text: 尽管如此，门闩拉开的声音，仍然像世上最悦耳的声音之一。
        - id: ch01-b158
          speaker: jane
          text: 万一他没带来赛米德呢？
          emotion: fearful
        - id: ch01-b159
          speaker: narrator
          text: >-
            她话音刚落，赛米德便从才打开的门缝里跳进安西娅怀中。它浑身发抖，皮毛全耸了起来。
        - id: ch01-b160
          speaker: palace_guard
          text: 这是它那件花哨的外套。
        - id: ch01-b161
          speaker: narrator
          text: 卫兵递出绣花袋，赛米德马上钻了进去。
        - id: ch01-b162
          speaker: cyril
          text: 现在你想看什么？有什么想要的东西，让我们替你取来吗？
        - id: ch01-b163
          speaker: palace_guard
          text: >-
            随便来个小把戏。你们连一盆栽在陶罐里的奇花都能弄来，我看什么都能弄到。我只希望得到国王宝库里的两大担珠宝。这可是我一直以来的愿望。
        - id: ch01-b164
          speaker: narrator
          text: >-
            士兵说出“愿望”两个字的一刹那，孩子们便全明白了。这一次根本不需要他们穿过护符去搬东西，赛米德自己就会接手这部分魔法。它果然实现了愿望。金子和珍贵宝石凭空出现在地面上，起初只是一堆，接着不断向外铺散，耀眼的财宝转眼便撒满了他们脚边的地面。
        - id: ch01-b165
          speaker: cyril
          text: 还要看什么小把戏？要不要我们隐身，或者凭空消失？
        - id: ch01-b166
          speaker: palace_guard
          text: 随你们的便，不过别想从门口出去。
        - id: ch01-b167
          speaker: narrator
          text: 他小心关紧门，用自己宽阔的脊背牢牢抵住。
        - id: ch01-b168
          speaker: hidden_voice
          text: 不！不！
          emotion: fearful
        - id: ch01-b169
          speaker: narrator
          text: 声音从墙边高大木柱的顶端附近传来，上方还有人在移动。士兵和孩子们一样吃惊。
        - id: ch01-b170
          speaker: palace_guard
          text: 这才叫魔法！
          emotion: surprised
        - id: ch01-b171
          speaker: narrator
          text: >-
            简就在这时举起护符，清清楚楚念出了那个有力量的名字。随着声音响起，护符在卫兵眼前越长越大，最后化成一座巨大的拱门。卫兵听见那个有力量的名字，又亲眼看见护符变成拱门，立刻发出一声敬畏而恐惧的大叫。他整个人俯面扑倒，恰好趴进了满地的黄金和宝石里。
        - id: ch01-b172
          speaker: narrator
          text: >-
            孩子们一次次穿过护符，动作早已练得熟极了。这回他们更是用最快的速度钻进拱门。可简到了拱门正中，却偏偏停住脚步，站在那里回头张望。其他三个孩子已经稳稳站在菲茨罗伊街餐厅的地毯上，回身一看，才发现简的半个身子仍留在古埃及那边，迟迟没有跟来。
        - id: ch01-b173
          speaker: cyril
          text: 有人抓住她了！我们得回去！
          emotion: fearful
        - id: ch01-b174
          speaker: narrator
          text: >-
            西里尔以为有人从古埃及那边抓住了简，马上喊着要回去救她。不过，他们先从餐厅这边握紧简的双手，用力拉了一下，想看看她究竟能不能过来。简当然顺势被拉回了地毯上。等最后一个人离开以后，巨大的拱门便像往常一样重新缩小，最后恢复成原来的护符，大家又全都平安待在家里。
        - id: ch01-b175
          speaker: jane
          text: >-
            真希望你们别拉我！那边有趣极了。祭司已经进了房间，正踢那个士兵，还说他这回闯下大祸。他们必须拿上珠宝，赶快逃命。
          emotion: angry
        - id: ch01-b176
          speaker: cyril
          text: 那他们逃了吗？
        - id: ch01-b177
          speaker: jane
          text: 我不知道，都怪你们打断。我真想把最后的情形看完。
        - id: ch01-b178
          speaker: narrator
          text: >-
            其实，他们谁也没有看见这件事的结局。当然，这里所说的“这件事”，是指祭司和士兵后来那场奇遇。
