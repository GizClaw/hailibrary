  chapters:
    - id: ch01
      title: BEFORE PHARAOH
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The day after their adventure with Julius Caesar and the Little Black Girl, Cyril burst into the bathroom to wash for dinner. His hands were filthy. You can hardly imagine how dirty they were. He had spent the whole morning on the leads behind the house, playing at shipwrecked sailors near the water tank. There he found Anthea leaning both elbows on the edge of the bath and crying steadily into it.
        - id: ch01-b02
          speaker: cyril
          text: Hullo! What's wrong now? Dinner will be cold before you've cried enough salt water to fill the bath.
        - id: ch01-b03
          speaker: anthea
          text: Go away! I hate you. I hate everyone!
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: A wounded silence followed.
        - id: ch01-b05
          speaker: cyril
          text: I didn't know.
        - id: ch01-b06
          speaker: anthea
          text: Nobody ever knows anything.
          emotion: sad
        - id: ch01-b07
          speaker: cyril
          text: I didn't know you were cross. I thought you'd hurt your fingers on the tap again, like last week.
        - id: ch01-b08
          speaker: anthea
          text: Oh, fingers!
        - id: ch01-b09
          speaker: cyril
          text: Come on, Panther, stop it. You haven't had a row with anyone, have you?
        - id: ch01-b10
          speaker: anthea
          text: No. Wash those horrible hands if that's why you came in, or else go away.
        - id: ch01-b11
          speaker: narrator
          text: Anthea was so rarely cross that the others felt surprised, rather than angry, when it happened. Cyril edged along the side of the bath until he stood beside her. He put one hand on her arm. When she did not seem to mind, even though she had not stopped crying, he awkwardly slipped his arm across her shoulders and rubbed his head against her ear.
        - id: ch01-b12
          speaker: cyril
          text: Do dry up. There, that's better. Now tell me what's wrong.
        - id: ch01-b13
          speaker: anthea
          text: Promise you won't laugh?
        - id: ch01-b14
          speaker: cyril
          text: I don't feel much like laughing either.
        - id: ch01-b15
          speaker: anthea
          text: Well, then. It's Mother.
        - id: ch01-b16
          speaker: cyril
          text: What's happened to Mother? Her letter this morning said she was all right.
        - id: ch01-b17
          speaker: anthea
          text: Yes, but I want her so much.
          emotion: sad
        - id: ch01-b18
          speaker: cyril
          text: You're not the only one.
          emotion: sad
        - id: ch01-b19
          speaker: anthea
          text: I know. We all miss her all the time. But right now I want her more than I've ever wanted anything. Yesterday, that little Imogen had the ancient British Queen cuddling her. Imogen wasn't me, but the Queen was Mother. Then Mother's letter came this morning, saying how the Lamb likes bathing in the sea. She bathed him in this very bath the night before she left. Oh, oh, oh!
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: Cyril thumped her on the back.
        - id: ch01-b21
          speaker: cyril
          text: Cheer up. Remember that inside thinking I told you about? Some of it was about Mother. We'll have her home soon. Stop crying, wash your face, and I'll explain. Here, let me reach the tap. Can't you stop? Shall I put the door key down your back?
        - id: ch01-b22
          speaker: anthea
          text: That's a cure for nosebleeds. And I'm no more a child than you are.
        - id: ch01-b23
          speaker: narrator
          text: But Anthea laughed a little, and her mouth began to return to its usual shape. Anyone who has cried in earnest knows what a strange shape a crying mouth can take.
        - id: ch01-b24
          speaker: cyril
          text: Listen. We've only played with the Amulet until now. It's time to make it work as hard as it can. And this isn't only about Mother. Father is out there among all the fighting. I don't cry over it, but I do think about it. Oh, bother this soap!
        - id: ch01-b25
          speaker: narrator
          text: The gray, slippery soap shot from his fingers like a stone from a catapult and struck Anthea on the chin.
        - id: ch01-b26
          speaker: anthea
          text: Well, now I really shall have to wash my face.
        - id: ch01-b27
          speaker: cyril
          text: You had to wash it anyway. Here's my plan. You know about missionaries?
        - id: ch01-b28
          speaker: narrator
          text: Anthea said yes, although she did not know a single missionary.
        - id: ch01-b29
          speaker: cyril
          text: They take people beads and brandy, corsets and hats and braces. Useful things those people don't have and have never heard of. Everyone loves the missionaries for being so generous and gives them pearls, shells, ivory, cassowaries, and things. That's how we can do it.
        - id: ch01-b30
          speaker: anthea
          text: Wait. I can't hear while I'm splashing. Pearls and what?
        - id: ch01-b31
          speaker: cyril
          text: Shells and things. The point is to make people love you by giving them presents. Next time we go into the Past, we'll take a proper supply. Remember how that Babylonian Queen grabbed your pocketbook? We'll bring things like that and trade them for a look at the Amulet.
        - id: ch01-b32
          speaker: anthea
          text: Merely looking at it won't help much.
        - id: ch01-b33
          speaker: cyril
          text: Of course not. But once we've seen it, we'll know where it is. Then we can come back at night and take it while everyone is asleep.
        - id: ch01-b34
          speaker: anthea
          text: Would that count as stealing? It will all have happened such an awfully long time ago when we do it. Oh, there's the dinner bell again.
        - id: ch01-b35
          speaker: narrator
          text: Dinner was tinned salmon, lettuce, and jam tart. As soon as they had eaten and the cloth had been cleared away, Cyril's plan was explained to Robert and Jane. Then they woke the Psammead from its sand. They asked it what goods might win the affection of the Ancient Egyptians, and whether the missing half of the Amulet was likely to be found at Pharaoh's court.
        - id: ch01-b36
          speaker: narrator
          text: The Psammead shook its head and thrust out its snail eyes without much hope.
        - id: ch01-b37
          speaker: psammead
          text: I'm not allowed to take part in this game. Naturally, I could discover where the thing is in a minute, but I'm forbidden. Still, taking things with you isn't a bad idea. Don't display everything at once. Bring small objects and hide them cleverly about yourselves.
        - id: ch01-b38
          speaker: narrator
          text: The children liked this advice. Soon they had covered the table with objects that might interest the Ancient Egyptians. Anthea brought dolls, puzzle blocks, a wooden tea set, and a green leather case with Nécessaire written on it in gold. Aunt Emma had given it to her with scissors, a penknife, a bodkin, a stiletto, a thimble, a corkscrew, and a glove-buttoner inside. The scissors, knife, and thimble had vanished long ago, but everything else was as good as new.
        - id: ch01-b39
          speaker: narrator
          text: Cyril supplied lead soldiers, a cannon, a catapult, a tin opener, a tie clip, a tennis ball, and a padlock with no key. Robert found a candle, a penny Japanese pin tray, a rubber stamp bearing Father's name and address, and a piece of putty.
        - id: ch01-b40
          speaker: robert
          text: I don't suppose they've ever seen a paraffin candle that fits its own holder.
        - id: ch01-b41
          speaker: narrator
          text: Jane added a key ring, the brass handle from a poker, an empty cold-cream pot, a smoked-pearl button from her winter coat, and a key with no lock.
        - id: ch01-b42
          speaker: robert
          text: We can't carry all this rubbish. Each of us ought to choose just one thing.
        - id: ch01-b43
          speaker: narrator
          text: They spent a pleasant afternoon trying to choose the four best objects, but no one could agree about what was best.
        - id: ch01-b44
          speaker: cyril
          text: Let's put on blindfolds and reach out. Whatever you touch first, you have to take.
        - id: ch01-b45
          speaker: narrator
          text: So they did. Cyril found the padlock. Anthea got the Nécessaire. Robert seized the candle. Jane picked up the tie clip.
        - id: ch01-b46
          speaker: jane
          text: It isn't much. I don't think Ancient Egyptians wore neckties.
        - id: ch01-b47
          speaker: anthea
          text: Perhaps it's luckier when you don't truly choose. In stories, a woodcutter's son always finds something in the forest and nearly throws it away because it looks useless. Then it turns out to be magic, or he returns it to someone and gets the King's daughter as his reward.
        - id: ch01-b48
          speaker: cyril
          text: I don't want anyone's hand in marriage, thank you.
        - id: ch01-b49
          speaker: robert
          text: Neither do I. Once the marriage hands appear, the adventures are always over.
        - id: ch01-b50
          speaker: anthea
          text: Is everyone ready?
        - id: ch01-b51
          speaker: jane
          text: We are going to Egypt, aren't we? Nice Egypt? I won't go somewhere I know nothing about, like that horrible city with the giant waves and the burning mountain.
        - id: ch01-b52
          speaker: narrator
          text: They coaxed the Psammead into its bag.
        - id: ch01-b53
          speaker: cyril
          text: You know, I'm rather tired of kings. People notice you too much in palaces. Besides, the Amulet is bound to be in a temple. Let's start among ordinary people and work our way up. Perhaps we can become temple assistants.
        - id: ch01-b54
          speaker: anthea
          text: Like church beadles or vergers. They must get wonderful chances to steal temple treasures.
        - id: ch01-b55
          speakers: [cyril, robert, jane]
          ensemble: chorus
          text: Righto!
        - id: ch01-b56
          speaker: narrator
          text: They held up the charm. Once more it grew large, and once more warm, golden Eastern light shone softly beyond it. The instant the children stepped through, loud and furious voices struck their ears. They had gone straight from the quiet Fitzroy Street dining room into the middle of a raging Eastern crowd. Everyone was far too angry to notice the newcomers. The children edged their way through the press until they reached the wall of a house, then stood with their backs against it.
        - id: ch01-b57
          speaker: narrator
          text: Men, women, and children filled the street, with skin of every shade from yellow ochre and red ochre to light red, sepia, and black. A child with a shilling paint box could have used every one of those colors. Their faces had been painted already, with black on eyebrows and lashes and red on some of the lips. The women wore pinafore-like dresses with shoulder straps and loose cloth wound around their heads and shoulders. The working men wore very little. The boys and girls wore nothing at all, unless you count the small ornaments hanging from chains at their necks and waists. The children took in all these sights before they could make out a single word in the shouting.
        - id: ch01-b58
          speaker: narrator
          text: Then one voice rose over the rest. A tall, copper-colored man had climbed onto a chariot abandoned by its owner, who had run off muttering about the Guards. As the crowd fell silent, the man began to speak.
        - id: ch01-b59
          speaker: worker_speaker
          text: Friends and fellow workers, how much longer must we endure our masters? They sit idle in luxury and live on everything our labor produces. They give us barely enough to survive while we work our whole lives to keep them rich. We must put an end to it!
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: The crowd roared its approval.
        - id: ch01-b61
          speaker: worker_one
          text: How do you mean to end it?
        - id: ch01-b62
          speaker: worker_two
          text: Watch yourself, or you'll land in trouble!
        - id: ch01-b63
          speaker: robert
          text: I heard nearly every word of that in Hyde Park last Sunday!
        - id: ch01-b64
          speaker: worker_speaker
          text: Then let us stop work until we get more bread, onions, and beer, and a longer rest at midday! You're exhausted, hungry, and thirsty. You're poor, and your wives and children have too little food. The rich men's barns are bursting with the grain we need, grain that we grew ourselves. To the granaries!
          emotion: angry
        - id: ch01-b65
          speakers: [worker_speaker, worker_one, worker_two]
          ensemble: chorus
          text: To the granaries!
          emotion: angry
        - id: ch01-b66
          speaker: worker_three
          text: No, go to Pharaoh! Take our petition to the King. He'll listen to people who are suffering!
        - id: ch01-b67
          speaker: narrator
          text: For a moment the crowd swayed first toward the granaries, then toward the palace. Suddenly it broke loose like a torrent and rushed down the street. The children were swept along with it, while Anthea struggled to keep the Psammead from being crushed in its bag.
        - id: ch01-b68
          speaker: narrator
          text: The crowd swept through streets of dull houses whose few windows were set high in the walls. Then it crossed a market where no one bought anything with money. Goods were traded for other goods instead. During one brief pause, Robert saw a basket of onions exchanged for a hair comb, and five fish handed over for a string of beads. The people in the market looked better off than the workers in the crowd. Their clothes were finer, and they wore more of them. Nowadays, people like these might have lived in Brixton or Brockley.
        - id: ch01-b69
          speaker: market_lady
          text: What are they making a fuss about now?
        - id: ch01-b70
          speaker: narrator
          text: The languid lady who asked had large eyes, elaborately braided black hair, and a crimped, half-transparent linen dress. She spoke to a seller of dates.
        - id: ch01-b71
          speaker: date_seller
          text: Oh, the workers are discontented again. Listen to them. You'd think it mattered whether they got a little more food or a little less. They're the dregs of society.
        - id: ch01-b72
          speaker: market_lady
          text: The scum.
        - id: ch01-b73
          speaker: robert
          text: I've heard that before too.
        - id: ch01-b74
          speaker: narrator
          text: At that moment the crowd's anger turned to doubt, and then to fear. New voices came nearer, shouting threats and defiance. Wheels rattled. Hoofs pounded.
        - id: ch01-b75
          speaker: worker_two
          text: The Guards!
          emotion: fearful
        - id: ch01-b76
          speakers: [worker_speaker, worker_one, worker_two, worker_three]
          ensemble: chorus
          text: The Guards! Pharaoh's Guards!
          emotion: fearful
        - id: ch01-b77
          speaker: narrator
          text: The workers hesitated, balanced between flight and resistance. Then the hoofbeats drew close, and they scattered into alleys and courtyards. The Guards swept past at a gallop in embossed leather chariots. Wheels clattered over stone, and dark blue tunics streamed open in the wind.
        - id: ch01-b78
          speaker: market_lady
          text: Well, that riot is over. What a blessing! And did you see the Captain of the Guard? What a very handsome man.
        - id: ch01-b79
          speaker: narrator
          text: Just before the crowd fled, the children had pulled one another into an arched doorway. Now they drew long breaths and looked around.
        - id: ch01-b80
          speaker: cyril
          text: We got out of that rather well.
        - id: ch01-b81
          speaker: anthea
          text: Yes, but I wish those poor men had reached the King before the Guards drove them back. Perhaps he would have helped them.
        - id: ch01-b82
          speaker: jane
          text: Not if he's the Pharaoh from the Bible. His heart was hard.
        - id: ch01-b83
          speaker: anthea
          text: That was the Pharaoh in Moses's time. The one in Joseph's time was quite different. I'd like to see Pharaoh's house. I wonder if it looks like the Egyptian Court at the Crystal Palace.
        - id: ch01-b84
          speaker: cyril
          text: I thought we'd agreed to find work in a temple.
        - id: ch01-b85
          speaker: robert
          text: Yes, but first we need to know someone. We might befriend a temple doorkeeper and give him the padlock. I wonder which of those buildings are temples and which are palaces.
        - id: ch01-b86
          speaker: narrator
          text: Across the market stood an enormous gateway with great buildings on either side. Other buildings, almost as splendid, rose to its right and left. Then a gentle voice spoke behind them.
        - id: ch01-b87
          speaker: rekh_mara
          text: Are you looking for the Temple of Amen Ra, the Temple of Mut, or the Temple of Khonsu?
        - id: ch01-b88
          speaker: narrator
          text: A young man stood beside them, shaved clean from head to foot, with light papyrus sandals on his feet. His white linen tunic was heavily embroidered in many colors. Gold anklets, bracelets, and armlets gleamed on him, all richly inlaid. A ring shone on his finger. Over the tunic he wore a short jacket of golden embroidery, rather like the jackets worn by Zouave soldiers. A broad gold collar circled his neck and carried many amulets, but the children could see that none of them matched their own.
        - id: ch01-b89
          speaker: cyril
          text: Any temple will do, really.
        - id: ch01-b90
          speaker: rekh_mara
          text: Tell me why you've come. I am a divine father in the Temple of Amen Ra. Perhaps I can assist you.
        - id: ch01-b91
          speaker: cyril
          text: We've come from the great Empire where the sun never sets.
        - id: ch01-b92
          speaker: rekh_mara
          text: I suspected you came from some strange, distant little place.
        - id: ch01-b93
          speaker: robert
          text: We've seen plenty of palaces, so we thought a temple would make a change.
        - id: ch01-b94
          speaker: narrator
          text: The Psammead shifted uneasily inside its embroidered bag.
        - id: ch01-b95
          speaker: rekh_mara
          text: Have you brought offerings for the temple?
        - id: ch01-b96
          speaker: cyril
          text: We do have some gifts. There's magic involved, so we can't explain everything. But we don't intend to give them away for nothing.
        - id: ch01-b97
          speaker: rekh_mara
          text: Take care not to insult the god. I know magic too. I can shape your image in wax and speak the proper words. As the wax melts in the fire, you will waste away until you die in misery.
          emotion: angry
        - id: ch01-b98
          speaker: cyril
          text: Pooh! That's nothing. I can make fire itself.
        - id: ch01-b99
          speaker: rekh_mara
          text: I should very much like to see that.
        - id: ch01-b100
          speaker: cyril
          text: Then you shall. It's easy. Everyone stand close to me.
        - id: ch01-b101
          speaker: rekh_mara
          text: You need no fasting first? No preparation or spells?
        - id: ch01-b102
          speaker: cyril
          text: My spell is short, and my kind of magic needs no fasting. Union Jack, Printing Press, Gunpowder, Rule Britannia! Come, Fire, at the end of this little stick!
        - id: ch01-b103
          speaker: narrator
          text: Cyril took a match from his pocket. At the end of this spell, whose words were surely unknown in Egypt, he crouched among the children and the priest and struck the match on his boot. Then he stood and sheltered the little flame with one hand.
        - id: ch01-b104
          speaker: cyril
          text: See? Here, you can hold it.
        - id: ch01-b105
          speaker: rekh_mara
          text: No, thank you. Can you make it happen again?
        - id: ch01-b106
          speaker: cyril
          text: Yes.
        - id: ch01-b107
          speaker: rekh_mara
          text: Then come with me to Pharaoh's great double house. He delights in fine magic and will give you honor and glory. Since we are both initiates, I can trust you with a secret. At present, Pharaoh is displeased with me over a prophecy that failed. I promised him a beautiful princess from Syria, and instead a woman of thirty arrived. She had been beautiful not so long before. Time is only a mode of thought, you know.
        - id: ch01-b108
          speaker: narrator
          text: The children thrilled at those familiar words.
        - id: ch01-b109
          speaker: cyril
          text: So you know that too?
        - id: ch01-b110
          speaker: rekh_mara
          text: Surely it belongs to the mystery of all magic. If I present you to Pharaoh, he will forget my small difficulty. I shall ask the Great House, Son of the Sun and Lord of the South and North, to let you stay in the temple. You can search it thoroughly and teach me your magic. In return, I will teach you mine.
        - id: ch01-b111
          speaker: narrator
          text: The idea seemed good. At least, no one could think of anything better just then, so they followed the priest through the city. The streets were very narrow and very dirty. As they walked, he explained that the finest houses stood behind walls twenty or twenty-five feet high. Any windows visible in those walls were far above the ground, and the tops of palm trees showed over them. Poor families lived in tiny square huts. Each hut had a door, two windows, and smoke escaping through a hole at the back.
        - id: ch01-b112
          speaker: cyril
          text: Poor Egyptians haven't improved their houses much since the first time we came here.
        - id: ch01-b113
          speaker: narrator
          text: Dry palm branches roofed the huts. Everywhere the children looked, chickens, goats, and naked little children kicked about in the yellow dust. One goat had somehow climbed right onto a roof. It was eating the dry palm leaves above the house, snorting and tossing its head with delight over every mouthful. Above the door of each house hung some little figure or mysterious shape.
        - id: ch01-b114
          speaker: rekh_mara
          text: Those are amulets. They keep away the evil eye.
        - id: ch01-b115
          speaker: robert
          text: I don't think much of your nice Egypt. It can't compare with Babylon.
        - id: ch01-b116
          speaker: jane
          text: Wait until you see the palace.
        - id: ch01-b117
          speaker: narrator
          text: The palace was far grander than anything they had seen that day, though it would have looked rather poor beside the palace of the Babylonian King. They reached it through a vast sandstone gateway set into a high wall of brick. The main doors were shut. They were made of massive cedar, hung on bronze hinges, and studded all over with bronze nails. A little door and a wicket gate stood to one side. The priest led the children through that smaller entrance, using some special word that made the sentries step aside for him.
        - id: ch01-b118
          speaker: narrator
          text: Beyond the wall lay a garden planted with hundreds of different kinds of trees and flowering shrubs. Fish filled a lake whose edges were bright with blue lotus flowers. Ducks paddled cheerfully over the water, looking so ordinary and comfortable that Jane said they seemed quite modern.
        - id: ch01-b119
          speaker: rekh_mara
          text: There is the guardroom, there the storehouses, and there the Queen's house.
        - id: ch01-b120
          speaker: narrator
          text: They crossed courtyards paved with flat stones. At a great inner gate, the priest whispered to a guard.
        - id: ch01-b121
          speaker: rekh_mara
          text: Fortune favors us. Pharaoh is in the Court of Honor now. Remember to look overcome with respect and wonder. Falling flat on your faces would do no harm. Most important, say nothing until someone speaks to you.
        - id: ch01-b122
          speaker: robert
          text: We had that rule in our country when Father was a little boy.
        - id: ch01-b123
          speaker: narrator
          text: At the outer end of the great hall, a crowd argued with the Guards and even pushed against them. The Guards appeared to have a firm rule that no one could pass without first promising them a bribe. The children heard several promises of enormous riches being offered in urgent voices. They could not help wondering whether the people making those promises ever meant to keep them.
        - id: ch01-b124
          speaker: narrator
          text: Painted wooden pillars stood all around the hall, and the cedar roof blazed with gorgeous inlay. About halfway along the floor was a broad, shallow step stretching from one wall to the other. A little farther on came another. Beyond that, a steep flight of narrower steps climbed all the way to the throne where Pharaoh sat.
        - id: ch01-b125
          speaker: narrator
          text: Pharaoh sat in splendor beneath a canopy of wood supported by wooden pillars, every part painted in brilliant colors. The red and white double crown rested on his head, and he held his scepter in one hand. A low, broad bench ran around the hall. There sat the King's friends, relations, and courtiers, leaning at their ease against cushions covered in the richest cloth.
        - id: ch01-b126
          speaker: narrator
          text: Rekh-mara led the children past the broad steps and up the narrow flight until all five of them stood directly before the throne. Then, without warning, he stretched both hands toward Pharaoh and fell flat on his face. The children hurried to copy him. Anthea had to lower herself with particular care so that she would not squash the Psammead inside its bag.
        - id: ch01-b127
          speaker: pharaoh
          text: Lift them up, so they may speak to me.
        - id: ch01-b128
          speaker: narrator
          text: Officers of the royal household pulled them to their feet.
        - id: ch01-b129
          speaker: pharaoh
          text: Who are these foreigners? And Rekh-mara, how dare you enter my presence before your innocence has been proved?
          emotion: angry
        - id: ch01-b130
          speaker: rekh_mara
          text: Great King, you are the very image of Ra and the perfect likeness of his son Horus. You know every thought in the hearts of gods and men. As you have already understood, these strangers descend from the wretched, defeated kings of the Empire where the sun never sets. They command magic unknown in Egypt and bring gifts as tribute to Pharaoh, whose heart holds the wisdom of the gods and whose lips speak their truth.
        - id: ch01-b131
          speaker: pharaoh
          text: Fine words. Where are these gifts?
        - id: ch01-b132
          speaker: narrator
          text: The children bowed as well as they could, though they felt terribly awkward. Every eye in a circle grander, more golden, and more brightly colored than they could ever have imagined was fixed upon them. At last they reached into their clothes and brought out the padlock, the Nécessaire, and the tie clip. Robert's candle remained hidden for the moment.
        - id: ch01-b133
          speaker: cyril
          text: It isn't tribute, though. England pays tribute to nobody!
        - id: ch01-b134
          speaker: narrator
          text: Cyril kept his protest to a mutter. The chief officer carried the objects to Pharaoh, who studied each one with great interest.
        - id: ch01-b135
          speaker: pharaoh
          text: Give these to the Keeper of the Treasury. The tribute is small, but it is strange and not worthless. Now, Rekh-mara, what of their magic?
        - id: ch01-b136
          speaker: rekh_mara
          text: These unworthy children of a conquered nation...
        - id: ch01-b137
          speaker: cyril
          text: Nothing of the sort!
          emotion: angry
        - id: ch01-b138
          speaker: rekh_mara
          text: These children of a wretched, defeated nation can summon fire from dry wood before the eyes of everyone here.
        - id: ch01-b139
          speaker: pharaoh
          text: I should very much like to see that.
        - id: ch01-b140
          speaker: narrator
          text: Without any fuss, Cyril struck another match.
        - id: ch01-b141
          speaker: pharaoh
          text: Show me more magic.
        - id: ch01-b142
          speaker: anthea
          text: He can't do any more while free people outside are crying out for bread, onions, beer, and a longer midday rest. Give the people what they need, and then he can continue.
        - id: ch01-b143
          speaker: pharaoh
          text: The girl speaks rudely. Still, give the dogs what they ask for. Let them have their rest and extra food. There are plenty of slaves to do the work.
        - id: ch01-b144
          speaker: narrator
          text: Without even turning his head, Pharaoh sent a richly dressed official hurrying from the hall.
        - id: ch01-b145
          speaker: rekh_mara
          text: The people will worship you! Their offerings will overflow the Temple of Amen.
          emotion: happy
        - id: ch01-b146
          speaker: narrator
          text: Cyril struck another match, and delight and wonder swept through the whole court. This time he went further. He took Robert's candle from his pocket, touched the match to its wick, and held the burning candle high before the King. At that sight, the courtiers' excitement knew no bounds.
        - id: ch01-b147
          speaker: rekh_mara
          text: Greatest of all rulers, before whom the sun, moon, and stars bow down, am I forgiven now? Has my innocence been proved?
        - id: ch01-b148
          speaker: pharaoh
          text: As clearly as it ever will be, I expect. Go away. You are pardoned. Go in peace.
        - id: ch01-b149
          speaker: narrator
          text: Rekh-mara vanished with astonishing speed.
        - id: ch01-b150
          speaker: pharaoh
          text: What is moving in that sack? Show it to me, strangers.
        - id: ch01-b151
          speaker: narrator
          text: There was no escape. The children showed him the Psammead.
        - id: ch01-b152
          speaker: pharaoh
          text: Seize it. That is a curious little monkey. It will make an amusing addition to my collection of wild animals.
        - id: ch01-b153
          speaker: narrator
          text: The children pleaded with everyone who came near, while the Psammead fought with its teeth. The begging was fervent, and so were the bites, but neither had the smallest effect on Pharaoh's servants. They pulled the creature away and carried it out of the hall before the children's eyes.
        - id: ch01-b154
          speaker: anthea
          text: Oh, please be careful with it! At least keep it dry. Keep it inside its sacred house!
        - id: ch01-b155
          speaker: narrator
          text: She held up the embroidered bag.
        - id: ch01-b156
          speaker: robert
          text: It's a magical creature. It's beyond price!
        - id: ch01-b157
          speaker: jane
          text: You have no right to take it! This is shameful. It's outright robbery!
          emotion: angry
        - id: ch01-b158
          speaker: narrator
          text: An awful silence filled the hall.
        - id: ch01-b159
          speaker: pharaoh
          text: Take the beast's sacred house from them. Lock them all away. After supper tonight, perhaps we shall ask for more magic. Guard them carefully, and do not torture them yet.
        - id: ch01-b160
          speaker: jane
          text: Oh dear! I knew this would happen. I wish you hadn't done it!
          emotion: sad
        - id: ch01-b161
          speaker: narrator
          text: Guards led them away.
        - id: ch01-b162
          speaker: cyril
          text: Be quiet, silly. You were the one who wanted to come to Egypt. The whole thing was your idea. Stop crying. We'll be all right.
        - id: ch01-b163
          speaker: jane
          text: I thought we'd play ball with queens and have wonderful fun. Now everything is going to be perfectly horrid!
          emotion: sad
        - id: ch01-b164
          speaker: narrator
          text: Their prison turned out to be a proper room, not the dark dungeon the older children had feared. Anthea said that was one comfort, at any rate. Paintings covered the walls, and at any other time the children would have found them wonderfully interesting. There was also a low couch and several chairs, so the room had at least been meant for people.
        - id: ch01-b165
          speaker: narrator
          text: Once they were alone, Jane sighed with relief.
        - id: ch01-b166
          speaker: jane
          text: Now we can go home safely.
        - id: ch01-b167
          speaker: anthea
          text: And leave the Psammead behind?
        - id: ch01-b168
          speaker: cyril
          text: Wait. I've thought of something.
        - id: ch01-b169
          speaker: narrator
          text: He considered for a moment, then hammered on the heavy cedar door. It opened, and a guard pushed his head inside.
        - id: ch01-b170
          speaker: palace_guard
          text: Stop that noise, or else...
          emotion: angry
        - id: ch01-b171
          speaker: cyril
          text: It must be dull standing here with nothing to do but guard us. Would you like to watch some magic? We're quite willing to perform for you.
        - id: ch01-b172
          speaker: palace_guard
          text: I wouldn't mind seeing some.
        - id: ch01-b173
          speaker: cyril
          text: Then bring back that monkey they took from us, and we'll show you.
        - id: ch01-b174
          speaker: palace_guard
          text: How do I know this isn't a trick? Perhaps you only want the creature so you can set it on me. Its claws and teeth may be poisonous.
        - id: ch01-b175
          speaker: robert
          text: Look, you can see we have nothing here. Shut the door, then open it in five minutes. By then we'll have made something magical for you. A magic flower growing in a pot, perhaps.
        - id: ch01-b176
          speaker: palace_guard
          text: Anyone who can do that can do anything.
        - id: ch01-b177
          speaker: narrator
          text: The guard went out and barred the heavy door behind him. Of course, the children immediately held up the Amulet. To find the East, they carried it around the room and turned very slowly, watching until the charm began to grow. Then they walked home through the great arch. From the staircase window in the Fitzroy Street house, they took a geranium in full scarlet flower. They carried the whole earthenware pot back through time. Five minutes after the guard had left, they were standing in the Egyptian room again, with the bright red plant beside them as proof.
        - id: ch01-b178
          speaker: palace_guard
          text: Well! I truly am...
          emotion: surprised
        - id: ch01-b179
          speaker: anthea
          text: We can do things far more wonderful than this if we have our monkey. And here are two pennies for you.
        - id: ch01-b180
          speaker: narrator
          text: Anthea sounded most persuasive. The soldier stared at the coins.
        - id: ch01-b181
          speaker: palace_guard
          text: What are these?
        - id: ch01-b182
          speaker: narrator
          text: Robert explained how money worked and how much easier it was to pay a set amount for something than to exchange one kind of goods for another, as everyone did in the market. Later, the soldier gave the coins to his captain. Still later, the captain showed them to Pharaoh. Pharaoh, of course, kept them, and the whole idea impressed him greatly. That was really how coins first came to be used in Egypt. You may not believe this. But if you believe the rest of the story, I cannot see why you should refuse to believe this part too.
        - id: ch01-b183
          speaker: anthea
          text: Wait, will those workers be all right? The King won't break his promise to them just because he's angry with us, will he?
        - id: ch01-b184
          speaker: palace_guard
          text: No. He's rather frightened of magic, you see. He'll keep his word.
        - id: ch01-b185
          speaker: robert
          text: Then that's all right.
        - id: ch01-b186
          speaker: anthea
          text: Oh, please fetch our monkey. Then we'll show you some lovely magic. Do help us. You seem such a nice, kind soldier.
        - id: ch01-b187
          speaker: palace_guard
          text: I don't know where they've put your precious monkey. But if another fellow can take my post, I'll see what I can do.
        - id: ch01-b188
          speaker: narrator
          text: He spoke grudgingly, but curiosity had plainly got the better of him. Then he went out to find someone who could take his place at the prison door.
        - id: ch01-b189
          speaker: robert
          text: Are we really going home without even trying to find the other half of the Amulet?
        - id: ch01-b190
          speaker: anthea
          text: I truly think we'd better.
        - id: ch01-b191
          speaker: narrator
          text: Her voice trembled.
        - id: ch01-b192
          speaker: anthea
          text: The other half must be somewhere nearby, or our half wouldn't have brought us here. I wish we could find it. If only we knew real magic, we could discover exactly where it is.
        - id: ch01-b193
          speaker: narrator
          text: If only they had known it, something very much like the missing half of the Amulet was close to them at that very moment. It hung around someone's neck. And that someone was watching the children through a narrow opening high in the wall. The opening had been specially designed so that prisoners could be watched without knowing it. But the children never guessed that anyone was there.
        - id: ch01-b194
          speaker: narrator
          text: They waited anxiously for nearly an hour. To pass the time, they tried to study a wall painting. It showed harpers playing some very odd-looking harps while women danced at a feast. They examined the painted plaster floor as well. They looked over the chairs, which were made of white-painted wood with stripes of color placed at intervals. None of it helped much. Time went terribly slowly, and every child had more than enough time to remember exactly how Pharaoh had said, “Do not torture them yet.”
        - id: ch01-b195
          speaker: cyril
          text: If the worst happens, we'll simply have to escape and leave the Psammead here. I think it can take care of itself well enough. They won't kill it or hurt it once they discover that it can speak and grant wishes. I shouldn't be surprised if they ended by building a temple for it.
        - id: ch01-b196
          speaker: anthea
          text: I couldn't bear to leave it. Pharaoh said after supper, so we still have time. And that soldier was curious. I'm sure we're safe for now.
        - id: ch01-b197
          speaker: narrator
          text: Even so, no sound could have seemed lovelier than the bar being drawn from the door.
        - id: ch01-b198
          speaker: jane
          text: What if he hasn't found the Psammead?
          emotion: fearful
        - id: ch01-b199
          speaker: narrator
          text: The Psammead itself answered that doubt. Almost before the door was open wide enough to admit anything, it squeezed through the narrow gap and sprang straight into Anthea's arms. The poor creature was shivering all over and hunching up its fur.
        - id: ch01-b200
          speaker: palace_guard
          text: Here's its fancy coat.
        - id: ch01-b201
          speaker: narrator
          text: He held out the embroidered bag, and the Psammead immediately crawled inside.
        - id: ch01-b202
          speaker: cyril
          text: Now, what magic would you like? Is there anything we can get for you?
        - id: ch01-b203
          speaker: palace_guard
          text: Any small trick will do. If you can produce a strange flower blooming in a clay pot, I suppose you can produce anything. I've always wished for two men's loads of jewels from the royal treasury.
        - id: ch01-b204
          speaker: narrator
          text: The instant the soldier said the word “wished,” the children knew that this part of the magic belonged to the Psammead. The creature had heard him, and it granted the wish. In a moment, the bare floor was littered with a heap of gold and precious stones that spread wider and wider before their eyes.
        - id: ch01-b205
          speaker: cyril
          text: Would you care for another trick? Perhaps we should turn invisible. Or vanish altogether.
        - id: ch01-b206
          speaker: palace_guard
          text: Go ahead, if you like. But you won't vanish through this door.
        - id: ch01-b207
          speaker: narrator
          text: He shut it carefully and planted his broad Egyptian back against it.
        - id: ch01-b208
          speaker: rekh_mara
          text: No! No!
          emotion: fearful
        - id: ch01-b209
          speaker: narrator
          text: The cry came from high among the tops of the tall wooden pillars against the wall. Someone moved above them. The soldier looked as astonished as everyone else.
        - id: ch01-b210
          speaker: palace_guard
          text: Now that is magic!
          emotion: surprised
        - id: ch01-b211
          speaker: narrator
          text: Jane raised the Amulet and spoke the Word of Power. At once the little charm grew into the great arch that led through time. The sound of the strange word and the sight of that widening doorway were too much for the soldier. With a cry of awe and terror, he fell flat on his face among the jewels.
        - id: ch01-b212
          speaker: narrator
          text: Long practice had made the children quick at traveling through the Amulet. They hurried through the arch without wasting a moment. Jane, however, stopped halfway through and turned her head to look back into the Egyptian room. The others were already standing on the dining-room carpet in Fitzroy Street when they turned and saw her still framed inside the arch, with half of her on one side of time and half on the other.
        - id: ch01-b213
          speaker: cyril
          text: Someone is holding her! We must go back.
        - id: ch01-b214
          speaker: narrator
          text: They were ready to rush back for her. First, though, they caught Jane by the hands and pulled, just to find out whether anything was truly holding her there. Of course, she came through at once. Then the great arch shrank into the little charm again, and all five travelers were safely together in Fitzroy Street.
        - id: ch01-b215
          speaker: jane
          text: Oh, I wish you hadn't pulled me away! It was so interesting. The priest had come in. He was kicking the soldier and saying they'd done it now, and must take the jewels and run for their lives.
        - id: ch01-b216
          speaker: cyril
          text: Did they run?
        - id: ch01-b217
          speaker: jane
          text: I don't know. You interrupted. I wanted to see how it ended.
        - id: ch01-b218
          speaker: narrator
          text: Jane was not very grateful to the others for pulling her home. In fact, none of the children had seen the end of it, if by “it” she meant the adventure of the Priest and the Soldier. That adventure had not ended when the Amulet closed.
