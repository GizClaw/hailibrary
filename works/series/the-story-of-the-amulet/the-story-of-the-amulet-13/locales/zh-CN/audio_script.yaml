audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    captain:
      display_name: 船长
      tts:
        delivery: 傲慢暴躁，说起泰尔时满是自豪
        timbre: 粗粝浑厚的中年男声
        pace: 中等偏快
        pitch: 中低
    sailor:
      display_name: 水手
      tts:
        delivery: 爽快随和，说到行当时很熟练
        timbre: 朴实略沙的成年男声
        pace: 中等
        pitch: 中
    rekhmara:
      display_name: 雷克玛拉
      tts:
        delivery: 神秘老练，礼貌中藏着算计
        timbre: 低沉微哑的成年男声
        pace: 舒缓
        pitch: 低
    dyer:
      display_name: 染坊主人
      tts:
        delivery: 精明挑剔，带着富商的优越感
        timbre: 饱满清晰的成年男声
        pace: 中等
        pitch: 中低
    phales:
      display_name: 费勒斯
      tts:
        delivery: 豪迈果敢，危急时显出冷酷与狂热
        timbre: 坚硬洪亮的中年男声
        pace: 中等
        pitch: 中低
    phales_wife:
      display_name: 费勒斯的妻子
      tts:
        delivery: 好客亲切，欢乐下压着忧伤
        timbre: 柔和成熟的女声
        pace: 中等偏慢
        pitch: 中
    lookout:
      display_name: 瞭望手
      tts:
        delivery: 警觉急促，声音能穿过风浪
        timbre: 高亢粗粝的成年男声
        pace: 快
        pitch: 中高
    noble_1:
      display_name: 贵族甲
      tts:
        delivery: 坚毅豪迈，满怀城邦荣誉
        timbre: 浑厚的成年男声
        pace: 中等偏快
        pitch: 中低
    noble_2:
      display_name: 贵族乙
      tts:
        delivery: 坚毅豪迈，满怀城邦荣誉
        timbre: 明亮的成年男声
        pace: 中等偏快
        pitch: 中
    noble_3:
      display_name: 贵族丙
      tts:
        delivery: 坚毅豪迈，满怀城邦荣誉
        timbre: 粗犷的成年男声
        pace: 中等偏快
        pitch: 低
  chapters:
    - id: ch01
      title: 第十三章　锡岛海难
      blocks:
        - id: ch01-b01
          speaker: jane
          text: 蓝色加红色，就会变成紫色。
        - id: ch01-b02
          speaker: cyril
          text: 那可不一定。得用深红和普鲁士蓝才行。要是把朱红和靛蓝混在一起，只会变成特别难看的石板灰。
        - id: ch01-b03
          speaker: jane
          text: 我最讨厌颜料盒里的棕褐色。
        - id: ch01-b04
          speaker: narrator
          text: >-
            简说着又吮了吮画笔。四个孩子都在画画。老保姆很感激他们送的礼物，又特别喜欢罗伯特画的罂粟花边，就送给每个孩子一盒一先令的颜料，还加上一大摞旧的《伦敦新闻画报》。
        - id: ch01-b05
          speaker: cyril
          text: 棕褐色颜料是拿恶心的墨鱼做的。
        - id: ch01-b06
          speaker: robert
          text: 紫色也能从一种鱼身上做出来。泰尔紫就是这样，我知道。
        - id: ch01-b07
          speaker: jane
          text: 是龙虾吗？龙虾煮熟是红的，活着是蓝的。把活龙虾和死龙虾混在一起，不就有泰尔紫了？
        - id: ch01-b08
          speaker: anthea
          text: 我才不愿拿任何东西去和活龙虾混在一起。
        - id: ch01-b09
          speaker: narrator
          text: 安西娅打了个寒战。
        - id: ch01-b10
          speaker: jane
          text: 可是没有别的鱼又红又蓝呀，那就只能这么做。
        - id: ch01-b11
          speaker: anthea
          text: 那我宁可不要紫色。
        - id: ch01-b12
          speaker: robert
          text: >-
            泰尔紫刚从鱼身上取出来时，根本不是紫色，后来也不是。它其实是猩红色，罗马皇帝就穿这种颜色。还在鱼身上时就更不好看了，是一种黄白色的液体，稠得像奶油。
        - id: ch01-b13
          speaker: cyril
          text: 你怎么知道？
        - id: ch01-b14
          speaker: robert
          text: 我读到过。
        - id: ch01-b15
          speaker: narrator
          text: 罗伯特说得既谦虚又骄傲，好像自己的学问确实比别人高。
        - id: ch01-b16
          speaker: cyril
          text: 在哪里读的？
        - id: ch01-b17
          speaker: robert
          text: 印出来的字里。
        - id: ch01-b18
          speaker: cyril
          text: >-
            你只要看见东西印出来，就当它全是真的。才不是呢。爸爸说过，印出来的谎话多得是，报纸上尤其多。
        - id: ch01-b19
          speaker: robert
          text: 可我看的不是报纸，是一本书。
        - id: ch01-b20
          speaker: jane
          text: 中国白真甜呀！
        - id: ch01-b21
          speaker: cyril
          text: 我才不信。
        - id: ch01-b22
          speaker: robert
          text: 你自己吮一口试试。
        - id: ch01-b23
          speaker: cyril
          text: 我说的又不是中国白。我说那种像奶油的鱼会变紫，还有……
        - id: ch01-b24
          speaker: anthea
          text: 哎呀，我画够了。咱们用护符去个地方吧，让它自己挑。
        - id: ch01-b25
          speaker: narrator
          text: >-
            安西娅一下跳了起来。西里尔和罗伯特都赞成这个主意。简也愿意停笔，因为中国白虽然真的很甜，吮久了，嗓子后头却会怪怪的。大家举起了护符。
        - id: ch01-b26
          speaker: jane
          text: 带我们去个地方吧。过去的什么地方都行，只要你在那里。
        - id: ch01-b27
          speaker: narrator
          text: >-
            简念出力量之语，众人马上觉得脚下摇摇晃晃，像坐着渔船出海。这也难怪，因为他们果然到了一条船上。船舷很高，一排洞里伸出船桨，船头像一只瞪大眼睛的怪兽，舵手的座位高高架起。船泊在海湾里，水面平得像镜子。
        - id: ch01-b28
          speaker: narrator
          text: >-
            船员们黯黑精瘦，长着黑发和黑胡子。他们除了一件从腰间垂到膝盖的短衣，再没穿别的衣裳，头上都戴着顶端有圆疙瘩的圆帽。他们忙得不得了，似乎根本顾不上留意孩子。而他们做的事又十分有趣，孩子们一开始看得入了迷，连护符究竟把自己带到了哪里都忘了想。
        - id: ch01-b29
          speaker: narrator
          text: >-
            船员把一只只灯芯草篮绑在长绳上，绳头拴着大块软木，每只篮里再放进贻贝或小青蛙。绳子一抛进海里，篮子往下沉，软木留在水面上。蓝色的海上到处都是船，每条船上的人都在摆弄绳索、篮子、青蛙和贻贝。
        - id: ch01-b30
          speaker: jane
          text: 你们到底在干什么？
        - id: ch01-b31
          speaker: narrator
          text: >-
            简问的是一个衣服穿得比别人多些的男人，看着像船长，又像监工。他吓了一跳，瞪着简。可他见过太多异国的事，并没被这几个衣着古怪的偷渡客吓得太厉害。
        - id: ch01-b32
          speaker: captain
          text: 我们在给染料贝下钓绳。你们是怎么上船的？
        - id: ch01-b33
          speaker: robert
          text: 就算是靠魔法吧。
        - id: ch01-b34
          speaker: narrator
          text: 船长摸了摸挂在颈间的护身符。
        - id: ch01-b35
          speaker: cyril
          text: 这里是什么地方？
        - id: ch01-b36
          speaker: captain
          text: 当然是泰尔。
        - id: ch01-b37
          speaker: narrator
          text: 船长退开几步，和一个水手低声说起话来。
        - id: ch01-b38
          speaker: cyril
          text: 这下可以弄清你那宝贝奶油罐鱼了。
        - id: ch01-b39
          speaker: jane
          text: 可我们根本没说要来泰尔呀。
        - id: ch01-b40
          speaker: anthea
          text: 我想是护符听见了咱们的话。它想得可真周到。
        - id: ch01-b41
          speaker: robert
          text: 另一半护符也在这里。船就这么大，一定找得到，只是不知道挂在谁身上。
        - id: ch01-b42
          speaker: anthea
          text: 哦，快看！你们快看！
          emotion: surprised
        - id: ch01-b43
          speaker: narrator
          text: >-
            一个水手裸露的胸口闪着一件红色的东西，跟孩子们珍藏的半枚护符一模一样。大家激动得说不出话，过了一会儿，简才开口。
        - id: ch01-b44
          speaker: jane
          text: 这么说，我们找到了！快把它拿走，咱们回家吧！
          emotion: happy
        - id: ch01-b45
          speaker: cyril
          text: 说拿就拿倒容易。他看起来可很强壮。
        - id: ch01-b46
          speaker: narrator
          text: 他的确很强壮，只是还比不上其他水手。
        - id: ch01-b47
          speaker: anthea
          text: 真怪，我好像在什么地方见过他。
        - id: ch01-b48
          speaker: robert
          text: 他有一点儿像咱们那位博学先生。可要说最像的人，那还得是……
        - id: ch01-b49
          speaker: narrator
          text: >-
            那水手正好抬起头，和罗伯特对上了目光。这下大家都认出他了。他是雷克玛拉，就是曾带他们去见法老的祭司。简穿过拱门时还看见过，他在劝法老的卫兵带上珠宝逃命。谁也不大高兴，可又说不出原因。
        - id: ch01-b50
          speaker: jane
          text: 要是有坏事，我们随时都能回去。
        - id: ch01-b51
          speaker: narrator
          text: >-
            简隔着连衣裙的褶子摸着他们自己的护符，说出了每个人的心声。眼下倒没发生坏事，只有人送来了味道很好的无花果和黄瓜。
        - id: ch01-b52
          speaker: captain
          text: >-
            我看得出来，你们从很远的国家来。你们现身在我的船上，让这条船蒙了光。所以你们必须留到明天早晨。到时我会带你们去见一位大人物，他最喜欢远方来的陌生人。
        - id: ch01-b53
          speaker: jane
          text: 咱们回家吧。那些青蛙现在全都在淹死，我觉得这里的人好残忍。
        - id: ch01-b54
          speaker: narrator
          text: 可男孩们想留下，看看第二天怎样收起钓绳。
        - id: ch01-b55
          speaker: cyril
          text: 这就像鳗鱼篓和龙虾篓一样，篮子只能从外面打开。我赞成留下。
        - id: ch01-b56
          speaker: narrator
          text: 于是他们留了下来。
        - id: ch01-b57
          speaker: captain
          text: 那边就是泰尔。大陆上那座城也是泰尔的一部分，大商人的游乐别墅、花园和农庄都在那里。
        - id: ch01-b58
          speaker: narrator
          text: >-
            船长很努力地对孩子们和气了些。他指着一座从海中陡然升起的巨大岩岛，岛顶围着高大的城墙和塔楼。隔着海水望去，大陆上还有另一座城。
        - id: ch01-b59
          speaker: cyril
          text: 快看！多漂亮的一条小船！
        - id: ch01-b60
          speaker: narrator
          text: 一条张满风帆的船飞快地穿过捕鱼船队。船长顿时变了脸色，他皱起眉，两眼冒火。
        - id: ch01-b61
          speaker: captain
          text: >-
            无礼的小蛮子！你竟敢把泰尔的船叫作小船？海上再没有比它们更大的船。这条船刚结束三年的航程。从这里到锡岛，所有大商港都知道它的名字。现在它满载财富，荣光归来，连船锚都是银的。
          emotion: angry
        - id: ch01-b62
          speaker: anthea
          text: >-
            我们真心向您道歉。在我们国家，“小”字也能表示亲爱。比如说，您的妻子也许会叫您“亲爱的小丈夫”。您明白吗？
        - id: ch01-b63
          speaker: captain
          text: 她要敢这么叫，看我怎么收拾她！
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: 船长虽然这样咆哮，却终于不再怒目而视了。
        - id: ch01-b65
          speaker: captain
          text: >-
            这生意赚得很多。我们拿染过一遍的布、次等玻璃，再加上年轻工匠练手时雕的粗糙神像，就能换来特索斯那个蛮族国王的许可，让我们开采银矿。那里的银子多得不得了。我们去的时候带铁锚，把铁锚留给他们，回来时换成银锚。
        - id: ch01-b66
          speaker: robert
          text: 太了不起了！请您继续讲。只染过一遍的布是什么？
        - id: ch01-b67
          speaker: captain
          text: >-
            你们一定是从最外层的黑暗里钻出来的蛮子。所有富有的民族都知道，我们最好的料子要染两遍，叫“迪巴夫塔”。只有国王、祭司和王公才配用它做长袍。
        - id: ch01-b68
          speaker: jane
          text: 那么，富商们住在游乐别墅里时，穿什么呢？
        - id: ch01-b69
          speaker: captain
          text: 他们也穿迪巴夫塔。我们的商人就是王公。
        - id: ch01-b70
          speaker: anthea
          text: 您别生气。我们特别喜欢听这些事，想知道所有染布的知识。
        - id: ch01-b71
          speaker: captain
          text: 原来你们打的是这个主意？哼，休想从我嘴里套出染料生意的秘密！
          emotion: angry
        - id: ch01-b72
          speaker: narrator
          text: >-
            船长走开了，留下大家一阵难堪。那个埃及人细长的眼睛却始终看着他们。到了夜里，孩子们躺在一堆斗篷上，仍然觉得他在黑暗中盯着自己。
        - id: ch01-b73
          speaker: narrator
          text: >-
            第二天早晨，篮子一只只被拉上来，里面装满了很像峨螺的贝壳。孩子们在船上很碍事，只好尽量缩小自己。船长走到另一头时，他们还是忍不住问了一个看着比较和善的水手。
        - id: ch01-b74
          speaker: sailor
          text: >-
            对，这就是染料鱼。它算是一种骨螺。西顿那边还能捞到另一种，当然还有专门染迪巴夫塔的那种。不过那完全不一样，它是……
        - id: ch01-b75
          speaker: captain
          text: 住嘴！
          emotion: angry
        - id: ch01-b76
          speaker: narrator
          text: >-
            水手立刻闭上嘴，不敢再往下说。满载而归的船缓缓绕过岩岛的一端，朝着泰尔的两座大港驶去，最后泊进其中一座。两座港口都藏在一道长长的防波堤后面。港里挤满了各式各样的船，有大的，也有小的。西里尔和罗伯特看着这些船，可比姐妹们快活得多。防波堤和码头上堆满了一包包货物和一筐筐东西，奴隶和水手到处都是。再往前看，还有一些男人不断跳进水里，正在练习潜水。
        - id: ch01-b77
          speaker: robert
          text: 这一下真漂亮！
        - id: ch01-b78
          speaker: narrator
          text: 一具裸露的棕色身体正好劈开水面。
        - id: ch01-b79
          speaker: captain
          text: >-
            当然漂亮。波斯采珠人的本事也不会比他们高。我们这里有一股淡水泉，从海底冒出来。潜水人能潜到水底，用皮袋装满淡水再上来。你们那些蛮族潜水人办得到吗？
        - id: ch01-b80
          speaker: robert
          text: 我想他们办不到。
        - id: ch01-b81
          speaker: narrator
          text: >-
            罗伯特很想跟船长讲讲英国的自来水、管道、水龙头，还有水暖工的种种奥妙，可他最后忍住了。船快靠岸时，船长匆匆整好头发和胡子，套上一件像短袖针织衫的衣服，系上刺绣腰带，又戴好珠串项链和大大的印章戒指。
        - id: ch01-b82
          speaker: captain
          text: 好了，我现在可以见人了。一起走吗？
        - id: ch01-b83
          speaker: jane
          text: 去哪里？
        - id: ch01-b84
          speaker: captain
          text: 去见大航海家费勒斯，就是我说过的那个喜欢蛮族的人。
        - id: ch01-b85
          speaker: narrator
          text: 这时，雷克玛拉走上前来，第一次开了口。
        - id: ch01-b86
          speaker: rekhmara
          text: >-
            我在另一个国度认识这些孩子。你知道我的魔力。正是我的魔法把他们带到你的船上，你也知道他们能给你带来什么好处。我能读懂你的心思。让我跟你一起去，看看他们最后会怎样。你好心让我在船上长了见识，作为回报，我会替你施展答应过的法术。
        - id: ch01-b87
          speaker: narrator
          text: 船长很不喜欢地看着这个埃及人。
        - id: ch01-b88
          speaker: captain
          text: 原来是你捣的鬼，我早该猜到。好吧，一起来。
        - id: ch01-b89
          speaker: narrator
          text: 雷克玛拉也跟来了。女孩们却宁愿他不要来。
        - id: ch01-b90
          speaker: robert
          text: 别犯傻了。只要他跟我们在一起，我们就还有机会拿到护符。真出了事，随时都能逃。
        - id: ch01-b91
          speaker: narrator
          text: >-
            早晨清新明亮，早饭又可口又新奇，那枚护符更确确实实挂在埃及人颈间。也许是这些事里的一两件，也许是全部加在一起，孩子们突然振作了起来。他们的心情一下子好了，高高兴兴地向城里走。那座城门的顶端并不是拱形，而是用一块巨大的平石直直地压在上面。他们从平石下穿过城门，走进了泰尔的街道。
        - id: ch01-b92
          speaker: narrator
          text: >-
            街上的腥气、大蒜味和上千种更难闻的气味混在一起。可船长进去出售那一夜收获的染料作坊，比街上还要糟糕。我真希望能把作坊里的一切都讲给你听，可我没有时间，你也未必真对它感兴趣。只说一件事就够了，事实证明罗伯特对了。染料果然是黄白色的稠液，像奶油一样，而且它的大蒜味比大蒜还浓。
        - id: ch01-b93
          speaker: narrator
          text: 船长跟染坊主人讨价还价时，埃及人挨到孩子们身边，忽然低声说了一句。
        - id: ch01-b94
          speaker: rekhmara
          text: 相信我。
        - id: ch01-b95
          speaker: anthea
          text: 但愿我们能相信你。
        - id: ch01-b96
          speaker: rekhmara
          text: 你们觉得我想夺走你们的护符，所以才不信我。
        - id: ch01-b97
          speaker: cyril
          text: 对。
        - id: ch01-b98
          speaker: rekhmara
          text: 可你们也想要我的护符，我却在相信你们。
        - id: ch01-b99
          speaker: robert
          text: 这么说也有点儿道理。
        - id: ch01-b100
          speaker: rekhmara
          text: >-
            我们手里各有护符的一半，可连起它们的别针还没找到。要想得到别针，我们只能留在一起。两半一旦分开，也许再也不会在同一个时间、同一个地方出现。聪明点儿吧，我们的利益是一样的。
        - id: ch01-b101
          speaker: narrator
          text: >-
            大家还没来得及回话，船长已经带着染坊主人回来了。染坊主人的头发和胡子像巴比伦人那样打着卷。他的衣着跟船长差不多，却多了黄金和刺绣，显得更加华贵。他戴着珠串和银项链，还有一枚玻璃护身符。护身符上嵌着一张很像他自己的男人脸，两边各有一个牛头。除了这些，他的手腕和上臂还套着金银镯环。他用锐利的目光把孩子们打量了一遍，这才开口。
        - id: ch01-b102
          speaker: dyer
          text: 我兄弟费勒斯刚从塔尔西施回来。他在自己的花园别墅里，除非又跑去沼泽猎野猪了。他一上岸就闷得要命。
        - id: ch01-b103
          speaker: captain
          text: 啊，他是个真正的腓尼基人。老歌不是这样唱吗？“泰尔，泰尔万万岁！啊，泰尔称霸海上！”我马上把这几个小蛮子带去给他看。
        - id: ch01-b104
          speaker: dyer
          text: 就该这样。他们真是古怪，对不对？衣服难看得吓人，还穿这么多层。再看看他们包在脚上的东西，简直丑透了。
        - id: ch01-b105
          speaker: narrator
          text: >-
            罗伯特想，只要抓住染坊主人的双脚，就能轻松地把他仰面推进旁边那口下沉式大染缸，那一定很痛快。可真这么做了，下一步就只能逃命，他还是忍住了。
        - id: ch01-b106
          speaker: narrator
          text: >-
            这次泰尔历险跟从前的都不一样，不知怎的，一切都显得更平静。而且还有一个不容怀疑的事实，那件宝物正挂在埃及人的颈间。这个埃及人也一直跟着他们。所以孩子们开始放下心来，尽情享受眼前的一切。他们先坐船离开岛城，划过海水上了岸，又骑上船长在大陆城门口雇来的驴子，穿过一片宜人的乡野。
        - id: ch01-b107
          speaker: narrator
          text: >-
            棕榈、无花果和雪松随处可见，整片乡间就像一座巨大的花园。铁线莲、忍冬和茉莉缠绕着橄榄树和桑树，从枝头一直垂落下来。地上开着郁金香和唐菖蒲，还有一丛丛曼德拉草。那些钟形的花朵颜色深蓝，像是用宝石一朵朵雕出来的。再往远处望，就能看见黎巴嫩山脉。最后他们来到一座低矮修长、有些像平房的宅子。宅子正面排着一列柱子，附近生长的雪松和悬铃木正好为屋子投下一片宜人的荫凉。他们全都下了驴，驴子也立刻被人牵走了。
        - id: ch01-b108
          speaker: robert
          text: 这里怎么会让人想到罗舍维尔花园呢？我知道了，因为这是个能让人快快活活过一天的地方。
        - id: ch01-b109
          speaker: cyril
          text: 船长肯带我们来这么棒的地方，人真不错。
        - id: ch01-b110
          speaker: anthea
          text: 你们有没有觉得，这里比我们见过的其他地方都更真实？就像回到家乡的乡下度假。
        - id: ch01-b111
          speaker: narrator
          text: >-
            孩子们被单独留在一座宽敞的大厅里。地上铺着马赛克，上面拼出一幅幅精美绝伦的图案，有船只，也有各种海兽和鱼。大厅的门敞开着。透过门望出去，他们还能看见一座鲜花盛开、宜人极了的庭院。
        - id: ch01-b112
          speaker: jane
          text: 我真想在这里住一个星期，每天都骑驴子出去玩。
        - id: ch01-b113
          speaker: narrator
          text: >-
            大家都快活极了，连埃及人也显得比平时和气。就在这时，船长忽然满面笑容地回来了，身边还跟着这座宅子的主人。主人站在那里，一动不动，没有立刻说话。他只把孩子们从头到脚仔细看了一遍，然后点了两下头。
        - id: ch01-b114
          speaker: phales
          text: 行，我的管家会照价付钱。不过那条埃及狗，我可不肯出这么高的价钱。
        - id: ch01-b115
          speaker: narrator
          text: 两个人说完就走了过去。
        - id: ch01-b116
          speaker: rekhmara
          text: 这下可真掉进一锅烂鱼汤里了。
        - id: ch01-b117
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 什么掉进去了？
        - id: ch01-b118
          speaker: rekhmara
          text: 我们眼下的处境。咱们那位航海朋友把我们全卖作奴隶了！
        - id: ch01-b119
          speaker: narrator
          text: >-
            这话把大家吓了一跳。他们马上匆匆商量起来，这一回也允许祭司加入。雷克玛拉劝他们留下。他说，眼下大家并没有危险。而且完整的护符一定就在附近，否则他们根本不可能来到这里。众人你一句、我一句地议论了一阵，最后还是同意照雷克玛拉的办法做。
        - id: ch01-b120
          speaker: narrator
          text: >-
            几个孩子受到的招待更像客人，不像奴隶。埃及人却被打发到厨房干活。宅子的主人费勒斯按国王的命令，当天傍晚又出海去了，开始另一段航程。他走后，妻子觉得这几个孩子是一群很有趣的伙伴，便把他们留在自己身边。孩子们陪她说话、唱歌、跳舞，一直闹到很晚。
        - id: ch01-b121
          speaker: phales_wife
          text: 这样我就不会再想着自己的伤心事了。
          emotion: sad
        - id: ch01-b122
          speaker: narrator
          text: 晚上，孩子们蜷缩在那些宽大柔软、当作床铺的靠垫上。
        - id: ch01-b123
          speaker: jane
          text: 我真喜欢当奴隶。
          emotion: happy
        - id: ch01-b124
          speaker: narrator
          text: >-
            夜色漆黑。孩子们从睡梦中醒来，每个人都感到一只手轻轻拂过自己的脸，耳边还有一个低低的声音。
        - id: ch01-b125
          speaker: rekhmara
          text: 别出声，不然就全完了。
          emotion: fearful
        - id: ch01-b126
          speaker: narrator
          text: 于是谁也没有出声。
        - id: ch01-b127
          speaker: rekhmara
          text: >-
            是我，阿蒙神的祭司雷克玛拉。把我们带来的人又出海了。他用蛮力抢走了我的护符，我又没有能把它夺回来的法术。你们的护符里，有能做到这件事的魔法吗？
        - id: ch01-b128
          speaker: narrator
          text: 这下所有人都彻底清醒了。
        - id: ch01-b129
          speaker: cyril
          text: 我们可以追上他。可他也许会把我们的护符也抢走，又或者，他发现我们追上来，会对我们发火。
        - id: ch01-b130
          speaker: rekhmara
          text: 这件事交给我。把你们的护符藏好。
        - id: ch01-b131
          speaker: narrator
          text: >-
            就在泰尔乡间别墅那间伸手不见五指的屋子里，护符再一次被举了起来，力量之语也被念出。巨大的拱门张开，所有人一起穿了过去。拱门那一边，是一条在狂风巨浪中颠簸翻腾的船。他们根本站不住，只能缩成一团，就这样一直熬到天亮。简和西里尔都晕得厉害。
        - id: ch01-b132
          speaker: narrator
          text: >-
            黎明像鸽子的羽毛那样灰蒙蒙的，在铅色的海浪上慢慢展开。孩子们迎着天光抬起头，又抵住船身一下又一下的颠簸，好不容易才站起来。费勒斯身经百战，既是老练的水手，也是大胆的冒险家。可他猛地一回头，看见这几个本不该在船上的人，脸色还是一下白了。
        - id: ch01-b133
          speaker: phales
          text: 哎呀！哎呀，我从没见过这种事！
          emotion: surprised
        - id: ch01-b134
          speaker: rekhmara
          text: 主人，我们是靠挂在您颈间那枚神圣护符的魔法，才来到这里的。
        - id: ch01-b135
          speaker: narrator
          text: 埃及人深深鞠了一躬。在这条船上，鞠躬甚至比站稳还难。
        - id: ch01-b136
          speaker: phales
          text: 我真没见过！哎呀，哎呀！
          emotion: surprised
        - id: ch01-b137
          speaker: robert
          text: 这条船要开到哪个港口？
        - id: ch01-b138
          speaker: phales
          text: 你懂航海吗？
        - id: ch01-b139
          speaker: narrator
          text: 罗伯特原本故意摆出一副水手的口气，可听到费勒斯这样反问，他只好老老实实承认自己并不懂航海。
        - id: ch01-b140
          speaker: phales
          text: >-
            那么告诉你也无妨。我们要去锡岛。世上只有泰尔知道锡岛在哪里。这是我们瞒住全世界的绝妙秘密。它对我们来说，就像你们的魔法对你们一样重要。
        - id: ch01-b141
          speaker: narrator
          text: 费勒斯说这些话时，声音已经完全变了。他对孩子们的态度也跟从前不一样，对他们和那枚护符似乎都多了许多尊敬。
        - id: ch01-b142
          speaker: jane
          text: 是国王派你去的，对不对？
        - id: ch01-b143
          speaker: phales
          text: 对。他命我带着十名勇敢的贵族和这班船员出发。你们就跟我们一起走吧，路上会看见许多奇景。
        - id: ch01-b144
          speaker: narrator
          text: >-
            费勒斯说完又鞠了一躬，转身离开。他命人给孩子们留下一些干果和一种硬饼，让他们拿这些东西当早饭，然后又吩咐其他人全都走开。等周围终于只剩下孩子们和雷克玛拉，罗伯特才问大家下一步怎么办。
        - id: ch01-b145
          speaker: robert
          text: 我们现在怎么办？
        - id: ch01-b146
          speaker: rekhmara
          text: >-
            等他在锡岛上岸，我们就可以叫蛮族来帮忙。到了夜里，我们一起袭击他，从那个受诅咒的异教徒脖子上扯下神圣的护符。
          emotion: angry
        - id: ch01-b147
          speaker: narrator
          text: 说到这里，雷克玛拉咬紧了牙。
        - id: ch01-b148
          speaker: jane
          text: 我们什么时候才能到锡岛？
        - id: ch01-b149
          speaker: rekhmara
          text: 哦，也许六个月，也许一年。
          emotion: happy
        - id: ch01-b150
          speaker: jane
          text: 要在这种地方待一年？
          emotion: surprised
        - id: ch01-b151
          speaker: narrator
          text: 西里尔还是难受得完全不想吃早饭，只能可怜巴巴地抱紧自己，打了个寒战。这次是罗伯特想出了办法。
        - id: ch01-b152
          speaker: robert
          text: >-
            听我说，我们可以把这一年缩短。简，把护符拿出来！许愿让我们去到这枚护符将来所在的地方，就在船离锡岛二十英里时。那样我们就有足够的时间把计划想好。
        - id: ch01-b153
          speaker: narrator
          text: >-
            这件事转眼就办成了。护符带着他们跨过了九个月，他们又回到同一条船上。这一回，头顶是北方灰暗的天，脚下是北方灰暗的海。落日已经快沉没了，只在天边留下一道淡黄色的光。这还是原来的船，船身却已经变了样。船员们也不再是九个月前的模样，他们个个饱经风霜，浑身肮脏，衣服又破又烂。
        - id: ch01-b154
          speaker: narrator
          text: >-
            孩子们这才明白，他们虽然一下跳过了九个月，这条船却只能实实在在地熬过九个月。费勒斯瘦了许多，脸上的线条也被焦虑磨得粗厉了。
        - id: ch01-b155
          speaker: phales
          text: 哈！护符把你们带回来了！这九个月里，我天天向它祈祷，现在你们果真出现了。你们没有能帮忙的魔法吗？
        - id: ch01-b156
          speaker: rekhmara
          text: 你需要什么？
          emotion: calm
        - id: ch01-b157
          speaker: phales
          text: >-
            我需要一股巨浪，把跟在后面的外国船彻底吞没。一个月前，它埋伏在诸神之柱附近。后来就一直追，想找出泰尔的秘密，看看锡岛究竟在哪里。要是夜里能辨认方向，我还可以甩掉他们。可今晚不会有星星。
        - id: ch01-b158
          speaker: rekhmara
          text: 我的魔法在这里帮不了你。
        - id: ch01-b159
          speaker: robert
          text: 我的魔法掀不起巨浪，不过我能教你不看星星也能掌握方向。
        - id: ch01-b160
          speaker: narrator
          text: >-
            罗伯特取出那只一先令的指南针。幸好它还能正常使用，这是他在学校里花五便士从另一个男孩手中买来的。他还掏出一块橡皮、一条鲸须和半根红色火漆，然后向费勒斯演示指南针怎样转动。那根针准确得像有魔法，费勒斯看得惊叹不已。
        - id: ch01-b161
          speaker: robert
          text: 我把它送给你，你把颈间那件护身符给我作交换。
        - id: ch01-b162
          speaker: narrator
          text: 费勒斯一句也没回答。他先大笑起来，接着从罗伯特手里一把抢走指南针，又笑着转身走了。
        - id: ch01-b163
          speaker: rekhmara
          text: 放心吧，我们的机会会来的。
          emotion: calm
        - id: ch01-b164
          speaker: narrator
          text: >-
            暮色一点点压下来，天越来越暗。费勒斯蹲在一盏暗淡的提灯旁，眼睛紧紧盯着这只从水晶宫来的一先令指南针，靠它辨认方向，控制船舵。谁也不知道另一条船究竟怎样在黑夜里航行，又是怎样紧追不舍的。到了深夜，船尾的瞭望手忽然用一种可怕的声音大喊起来。
        - id: ch01-b165
          speaker: lookout
          text: 它已经逼到我们身边了！
          emotion: fearful
        - id: ch01-b166
          speaker: phales
          text: 而我们也已经逼近港口了。
        - id: ch01-b167
          speaker: narrator
          text: 费勒斯沉默了一会儿，忽然改变航向，接着站起来，对众人讲话。
        - id: ch01-b168
          speaker: phales
          text: >-
            好朋友们，尊贵的先生们，国王命令我们踏上这场英勇的冒险，你们一路与我同甘共苦。那条背信弃义的外国船已经追到身后。我们上岸，他们也会上岸。只有诸神才知道，他们会不会在战斗中打败我们，活着把泰尔秘密岛屿的消息带回去，让他们那片可怜的国土富裕起来。我们能允许这种事吗？
        - id: ch01-b169
          speakers: [noble_1, noble_2, noble_3]
          ensemble: chorus
          text: 绝不能！
        - id: ch01-b170
          speaker: narrator
          text: 费勒斯身边的六七个男人高声喊道。奴隶们还在下层拼命划桨，根本听不见他说的话。
        - id: ch01-b171
          speaker: narrator
          text: 埃及人突然凶猛地扑向费勒斯，像一头跃起的野兽。
        - id: ch01-b172
          speaker: rekhmara
          text: 把我的护符还给我！
          emotion: angry
        - id: ch01-b173
          speaker: narrator
          text: 他一把抓住那件护身符。链子断了，护符落到祭司手里。费勒斯却笑了。他稳稳站着，脚下的船随着桨手一下下划动，不断往前跃。
        - id: ch01-b174
          speaker: phales
          text: >-
            现在没工夫理会护身符和装神弄鬼了。我们像男子汉一样活过，也要像尊贵的人一样死去。我们为辉煌的泰尔而死，为它的荣誉和光荣而死。老歌唱得好，“泰尔，泰尔万万岁！泰尔称霸海上！”
        - id: ch01-b175
          speaker: phales
          text: >-
            我要让船直冲龙礁。我们会为自己的城市沉入海底，勇敢的人本来就该这样。那些偷偷摸摸跟来的懦夫，也会像奴隶一样沉下去。等我们复生时，他们仍然要做我们的奴隶。泰尔，泰尔万万岁！
        - id: ch01-b176
          speaker: narrator
          text: 船上响起一阵巨大的欢呼，连下层的奴隶们也跟着喊起来。
        - id: ch01-b177
          speaker: anthea
          text: 快，护符！
          emotion: fearful
        - id: ch01-b178
          speaker: narrator
          text: >-
            安西娅马上举起他们的那一半护符，雷克玛拉也举起刚从费勒斯手中夺回的那一半。力量之语被念出。两道巨大的拱门顿时拔地而起，立在剧烈起伏的船上。拱门上方是黑暗的天，四周的狂风在尖啸。两枚护符各自迸发出美丽而强烈的绿光。光芒远远照亮了海浪，也把前方巨礁黑黢黢的面孔和参差狰狞的牙齿全都照了出来。那礁石离尖尖的船头还不到两条船的长度。
        - id: ch01-b179
          speakers: [noble_1, noble_2, noble_3]
          ensemble: chorus
          text: 泰尔，泰尔万万岁！泰尔称霸海上！
        - id: ch01-b180
          speaker: narrator
          text: >-
            那些注定赴死的人发出了胜利的呐喊。孩子们顾不上站稳，手脚并用地爬向拱门，一个接一个地爬了过去。等他们再次站稳时，已经回到菲茨罗伊街的客厅里。四个人全都浑身发抖，双眼不住地眨。
        - id: ch01-b181
          speaker: narrator
          text: >-
            虽然已经回到客厅，可他们耳边还回响着狂风的呼啸、船桨的喀啦声，还有船头撞上礁石时那一声可怕的巨响。在这些声音之上，是那些勇敢的贵族冒险家临死前最后的呼喊。他们为了自己热爱的城市，高唱着歌走向死亡。
        - id: ch01-b182
          speaker: narrator
          text: 孩子们把整件事从头到尾讲给赛米德听。
        - id: ch01-b183
          speaker: anthea
          text: 这么说，我们又把护符的另一半弄丢了。
        - id: ch01-b184
          speaker: psammead
          text: 胡说，呸！那根本不是另一半。那就是你们已经有的这一半，就是没被压碎、也没遗失的这一半。
        - id: ch01-b185
          speaker: anthea
          text: 可它怎么会是同一半呢？
        - id: ch01-b186
          speaker: psammead
          text: 当然，也不能说完全一样。你们手里这枚已经老了许多年。不过无论如何，那不是另一半。你们许愿时说的是什么？
        - id: ch01-b187
          speaker: jane
          text: 我忘了。
        - id: ch01-b188
          speaker: psammead
          text: 我可没忘。你说的是“带我们去你所在的地方”，它就照做了。所以你看，那就是同一半。
        - id: ch01-b189
          speaker: anthea
          text: 我明白了。
        - id: ch01-b190
          speaker: psammead
          text: 不过记住我的话，那个祭司早晚会给你们惹麻烦。
        - id: ch01-b191
          speaker: anthea
          text: 可他挺友好的呀。
        - id: ch01-b192
          speaker: psammead
          text: 不管怎样，你们最好提防雷克玛拉牧师大人。
        - id: ch01-b193
          speaker: cyril
          text: 唉，我已经烦透护符了。我们永远也找不到它。
        - id: ch01-b194
          speaker: robert
          text: 我们一定会找到。你不记得十二月三日了吗？
        - id: ch01-b195
          speaker: cyril
          text: 哎呀！我把这事忘了。
          emotion: surprised
        - id: ch01-b196
          speaker: jane
          text: 我才不信呢，而且我一点儿也不舒服。
        - id: ch01-b197
          speaker: psammead
          text: 我要是你们，在那一天到来以前，就不会再跑进过去。眼下别去任何可能遇见那个埃及人的地方，这样才安全。
        - id: ch01-b198
          speaker: anthea
          text: 我们当然听你的。不过他那张脸上有种东西，我还真的挺喜欢。
          emotion: calm
        - id: ch01-b199
          speaker: psammead
          text: 可你也不至于想追着他跑吧？等到三号，再看看会发生什么。
        - id: ch01-b200
          speaker: narrator
          text: >-
            西里尔和简都很不舒服，安西娅又一向好说话，所以罗伯特的意见被压了下去。孩子们答应了赛米德。
        - id: ch01-b201
          speaker: narrator
          text: 谁也没有预料到，连赛米德也没有，那个值得纪念的日子究竟会发生什么。至于你，当然已经看得一清二楚了。
