  chapters:
    - id: ch01
      title: PAINTS AND PURPLE
      blocks:
        - id: ch01-b01
          speaker: jane
          text: Blue and red make purple.
        - id: ch01-b02
          speaker: cyril
          text: Not every blue and red. You need crimson lake and Prussian blue. Mix vermilion with indigo and you get a perfectly horrible slate color.
        - id: ch01-b03
          speaker: jane
          text: I think sepia is the nastiest color in the box.
        - id: ch01-b04
          speaker: narrator
          text: Jane sucked her brush as she spoke. All four children were painting together. Nurse had been overcome with gratitude and delighted by Robert's painted border of poppies. Because of that, she had presented each child with a shilling paint box. She had also supplied them with a great pile of old copies of the Illustrated London News to paint.
        - id: ch01-b05
          speaker: cyril
          text: Sepia comes from beastly cuttlefish.
        - id: ch01-b06
          speaker: robert
          text: Purple comes from a fish too, as well as from red and blue. Tyrian purple did. I know that much.
        - id: ch01-b07
          speaker: jane
          text: From lobsters? They're red after they're boiled and blue before. If you mixed dead lobsters with live ones, perhaps you'd get Tyrian purple.
        - id: ch01-b08
          speaker: anthea
          text: I wouldn't want to mix anything with a live lobster.
          emotion: disgusted
        - id: ch01-b09
          speaker: jane
          text: But there aren't any other red and blue fish. You'd have to.
        - id: ch01-b10
          speaker: anthea
          text: Then I'd rather do without the purple.
        - id: ch01-b11
          speaker: robert
          text: Tyrian purple wasn't purple when it came out of the fish, or afterward either. It was really scarlet, and Roman Emperors wore it. While it was inside the fish, it was a creamy, yellowish-white liquid.
        - id: ch01-b12
          speaker: cyril
          text: How do you know that?
        - id: ch01-b13
          speaker: robert
          text: I read it.
        - id: ch01-b14
          speaker: cyril
          text: Where?
        - id: ch01-b15
          speaker: robert
          text: In print.
        - id: ch01-b16
          speaker: cyril
          text: You believe anything once it's printed, but plenty of printed things are lies. Father says so. Newspapers are especially full of them.
        - id: ch01-b17
          speaker: robert
          text: As it happens, it wasn't in a newspaper. It was in a book.
        - id: ch01-b18
          speaker: jane
          text: Chinese white tastes lovely.
        - id: ch01-b19
          speaker: narrator
          text: Dreamily, Jane sucked her brush again.
        - id: ch01-b20
          speaker: cyril
          text: I don't believe it.
        - id: ch01-b21
          speaker: robert
          text: Taste it yourself.
        - id: ch01-b22
          speaker: cyril
          text: Not the Chinese white. I mean the creamy stuff from the fish turning purple, and all the rest of it.
        - id: ch01-b23
          speaker: anthea
          text: Oh, I'm tired of painting! Let's use the Amulet and go somewhere. We could let it choose the place.
        - id: ch01-b24
          speaker: narrator
          text: Cyril and Robert liked the idea. Jane agreed to stop because Chinese white, though sweet, left a strange feeling in her throat if she painted too long. They held up the Amulet.
        - id: ch01-b25
          speaker: jane
          text: Take us somewhere in the Past, anywhere you like, but somewhere where you are.
        - id: ch01-b26
          speaker: narrator
          text: Jane spoke the word. At once the children felt a queer rocking and swaying, rather like the feeling of going out in a fishing boat. That was not surprising, because a boat was exactly where they found themselves. It was a very strange boat. Its high sides had holes through which the oars passed. A raised seat stood ready for the steersman, and the prow had been shaped into the head of some huge animal with great staring eyes. The boat lay at anchor, and the water across the bay was perfectly smooth.
        - id: ch01-b27
          speaker: narrator
          text: The crew were dark, wiry men with black hair and beards. Their only clothes were tunics from waist to knee and round caps with knobs on top. They were doing something so interesting that at first the children forgot even to wonder where the Amulet had taken them. The men were too busy to notice their strangely dressed visitors. They tied rush baskets along one long rope, put mussels or little frogs into every basket, and fixed a great piece of cork at the end. Then they cast the line out. The loaded baskets sank under the water, but the cork stayed floating above them. Other boats dotted the blue bay in every direction. On every one of them, a crew was busy with ropes, baskets, frogs, and mussels.
        - id: ch01-b28
          speaker: jane
          text: What are you doing?
        - id: ch01-b29
          speaker: narrator
          text: She had spoken to a man with more clothes than the others, who seemed to be their captain. He started, but he had visited too many strange countries to be greatly amazed by four queerly dressed stowaways.
        - id: ch01-b30
          speaker: captain
          text: We're setting lines for dye shellfish. How did you get aboard?
        - id: ch01-b31
          speaker: robert
          text: A kind of magic.
        - id: ch01-b32
          speaker: narrator
          text: The Captain touched an amulet hanging around his own neck.
        - id: ch01-b33
          speaker: cyril
          text: What place is this?
        - id: ch01-b34
          speaker: captain
          text: Why, Tyre, of course.
        - id: ch01-b35
          speaker: narrator
          text: He stepped back and murmured to one of the sailors.
        - id: ch01-b36
          speaker: cyril
          text: Now we'll find out about your precious cream-jug fish.
        - id: ch01-b37
          speaker: jane
          text: But we never asked to come to Tyre.
        - id: ch01-b38
          speaker: anthea
          text: The Amulet must have heard us talking. That was very obliging of it.
        - id: ch01-b39
          speaker: robert
          text: And its other half must be here. We ought to find it in a boat this small. Which man has it?
        - id: ch01-b40
          speaker: anthea
          text: Oh, look! Look!
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: Something red gleamed against one sailor's bare chest. The moment they saw its shape, they recognized it. It was the exact twin of their own precious half-Amulet, the very object they had been searching for through the Past.
        - id: ch01-b42
          speaker: jane
          text: We've found it! Oh, let's take it and go home!
          emotion: happy
        - id: ch01-b43
          speaker: cyril
          text: Taking it is easier said than done. He looks very strong.
        - id: ch01-b44
          speaker: narrator
          text: He did, though he was not as strong as the other sailors.
        - id: ch01-b45
          speaker: anthea
          text: How odd. I'm almost sure I've seen that man before.
        - id: ch01-b46
          speaker: robert
          text: He looks a little like our learned gentleman, but he looks much more like—
        - id: ch01-b47
          speaker: narrator
          text: The sailor looked up and met Robert's eyes. Now all four children knew him. He was Rekh-mara, the priest who had led them to Pharaoh's palace. Jane had last seen him through the arch, advising Pharaoh's guard to steal the jewels and run for his life. No one was pleased to see him, though no one quite knew why.
        - id: ch01-b48
          speaker: jane
          text: If anything nasty happens, we can go back in a minute.
        - id: ch01-b49
          speaker: narrator
          text: She felt their own Amulet through the folds of her dress as she spoke, reassuring herself that escape was close at hand. For the moment, nothing alarming happened at all. The sailors offered the children figs and cucumbers, and both tasted very pleasant after their sudden journey.
    - id: ch02
      title: THE DYE-FISH OF TYRE
      blocks:
        - id: ch02-b01
          speaker: captain
          text: I can see you've come from far away. Since you've honored my boat by appearing on it, you must remain until morning. Then I'll take you to a great man who loves strangers from distant lands.
        - id: ch02-b02
          speaker: jane
          text: Let's go home. All those frogs are drowning now. These people are cruel.
        - id: ch02-b03
          speaker: narrator
          text: But the boys wanted to watch the lines come up in the morning.
        - id: ch02-b04
          speaker: cyril
          text: They're like eel pots and lobster pots. The baskets only open from outside. I vote we stay.
        - id: ch02-b05
          speaker: narrator
          text: So they stayed aboard for the night. The Captain was plainly trying to be civil to them. He pointed across the bay to a great island of rock that rose steeply out of the sea, crowned from edge to edge with enormous walls and towers. That was Tyre, he told them. There was another city on the mainland opposite. It belonged to Tyre as well, and that was where the great merchants had their pleasure houses, gardens, and farms.
        - id: ch02-b06
          speaker: cyril
          text: Look at that lovely little ship!
        - id: ch02-b07
          speaker: narrator
          text: A ship under full sail swept swiftly through the scattered fishing fleet. To Cyril it looked lovely and small beside the wide bay, but the Captain heard only the insult. His whole face changed. He frowned, and his eyes flashed with furious pride.
        - id: ch02-b08
          speaker: captain
          text: Insolent young barbarian! You call a ship of Tyre little? No greater ships sail any sea. That one has returned from a three-year voyage. Every trading port from here to the Tin Islands knows her. She comes home rich and glorious, with even her anchor made of silver.
          emotion: angry
        - id: ch02-b09
          speaker: anthea
          text: Please forgive us. At home, we sometimes say little as a pet name. Your wife might call you her dear little husband.
        - id: ch02-b10
          speaker: captain
          text: I'd like to catch her doing it. Our trade is rich. We give the barbarian King in Tessos cloth dyed only once, second-rate glass, and rough figures carved by our young artists for practice. In return, he lets us work his silver mines. We take so much silver that we leave our iron anchors behind and sail home with silver ones.
        - id: ch02-b11
          speaker: robert
          text: How splendid! Please go on. What is cloth dyed only once?
        - id: ch02-b12
          speaker: captain
          text: You truly must be barbarians from the outer darkness. Every wealthy nation knows our best cloth is dyed twice. Dibaptha is only for kings, priests, and princes.
        - id: ch02-b13
          speaker: jane
          text: Then what do rich merchants wear in their pleasure houses?
        - id: ch02-b14
          speaker: captain
          text: They wear dibaptha. Our merchants are princes.
        - id: ch02-b15
          speaker: anthea
          text: Please don't be cross. We love hearing about new things, and we want to know all about the dyeing.
        - id: ch02-b16
          speaker: captain
          text: Oh, do you? Is that what brought you here? Well, you won't learn the secrets of our dye trade from me.
        - id: ch02-b17
          speaker: narrator
          text: The Captain turned his back and walked away. Every child felt thoroughly snubbed and uncomfortable after that. Yet their embarrassment was not the worst part of the evening. All the while, the Egyptian kept watching them with his long, narrow eyes. Later, when the children lay down to sleep together on a heap of cloaks, darkness hid him from sight. Even then, they felt as though those narrow eyes were following them through the night.
        - id: ch02-b18
          speaker: narrator
          text: In the morning the crew hauled up baskets packed with shells like whelks. The children kept out of the way as best they could. When the Captain went to the far end of the boat, they questioned a sailor whose face seemed a little kinder.
        - id: ch02-b19
          speaker: sailor
          text: Yes, that's the dye-fish. It's a kind of murex. They catch another kind at Sidon, and then there's the one used for dibaptha. That one's quite different. It is—
        - id: ch02-b20
          speaker: captain
          text: Hold your tongue!
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: The sailor stopped at once. With its baskets full of dye shellfish, the heavy boat was rowed slowly around the end of the island. It entered one of two great harbors protected inside a long breakwater. The water there was crowded with ships of every sort and size, which delighted Cyril and Robert much more than their sisters. Along the breakwater and the quays, bales and baskets stood in heaps. Sailors and enslaved workers moved everywhere among them. Farther along the waterfront, several men were practicing their diving, springing cleanly into the harbor one after another.
        - id: ch02-b22
          speaker: robert
          text: That was wonderfully done!
        - id: ch02-b23
          speaker: captain
          text: It ought to be. Even the pearl divers of Persia aren't more skillful. A freshwater spring rises from the bottom of our sea. Our divers fill skin bottles from it and bring the water up. Can your barbarian divers do that?
        - id: ch02-b24
          speaker: robert
          text: I suppose they can't.
        - id: ch02-b25
          speaker: narrator
          text: Robert resisted a wild desire to explain English waterworks, pipes, taps, and the complicated business of plumbers. As the boat neared the quay, the Captain hurriedly made himself presentable. He arranged his hair and beard, pulled on a short-sleeved jersey-like garment, and added an embroidered belt, beads, and a large signet ring.
        - id: ch02-b26
          speaker: captain
          text: Now I'm fit to be seen. Are you coming?
        - id: ch02-b27
          speaker: jane
          text: Where are we going?
        - id: ch02-b28
          speaker: captain
          text: To Pheles, the great sea captain I mentioned. He loves barbarians.
        - id: ch02-b29
          speaker: narrator
          text: Rekh-mara stepped forward and spoke for the first time.
        - id: ch02-b30
          speaker: rekh_mara
          text: I knew these children in another country. You know my magical powers. My magic brought these barbarians aboard, and you know how useful they will be to you. I can read your thoughts. Let me come and see what becomes of them. Afterward, I'll perform the spell I promised in return for the experience you've kindly given me aboard your boat.
        - id: ch02-b31
          speaker: narrator
          text: The Captain looked at him with dislike.
        - id: ch02-b32
          speaker: captain
          text: So this was your work. I might have known. Very well, come along.
        - id: ch02-b33
          speaker: narrator
          text: The girls wished the Egyptian had stayed behind.
        - id: ch02-b34
          speaker: robert
          text: Don't be silly. While he's with us, we still have a chance of getting the Amulet. If anything goes wrong, we can always escape.
    - id: ch03
      title: SOLD AT THE GARDEN HOUSE
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The morning was wonderfully fresh and bright. Their breakfast had been both good and agreeably strange, and they had truly seen the Amulet shining around the Egyptian's neck. Perhaps it was the weather, the food, the charm, or all three together, but the children's spirits suddenly rose. They set off quite cheerfully. The city gate had no arch. Instead, one enormous flat stone formed its roof. Beyond it, the street smelled horribly of fish, garlic, and a thousand other things even less agreeable. Yet every one of those street smells seemed mild when they reached the dye factory where the Captain meant to sell his night's catch.
        - id: ch03-b02
          speaker: narrator
          text: The Captain went inside to bargain over the catch. The factory held much that could be told about ancient dyeing, though perhaps not every listener would care to hear it. The important thing was that Robert's printed book had told the truth. The dye from the shellfish really began as a creamy liquid with a yellowish-white color. It also smelled more powerfully of garlic than garlic itself ever could.
        - id: ch03-b03
          speaker: narrator
          text: While the Captain bargained with the owner, Rekh-mara moved close to the children.
        - id: ch03-b04
          speaker: rekh_mara
          text: Trust me.
        - id: ch03-b05
          speaker: anthea
          text: I wish we could.
        - id: ch03-b06
          speaker: rekh_mara
          text: You distrust me because you know I want your Amulet.
        - id: ch03-b07
          speaker: cyril
          text: Yes.
        - id: ch03-b08
          speaker: rekh_mara
          text: But you want my Amulet too, and I am trusting you.
        - id: ch03-b09
          speaker: robert
          text: He has a point.
        - id: ch03-b10
          speaker: rekh_mara
          text: Between us, we have both halves, but we still lack the pin that joins them. We can only find it if we remain together. Separate these halves now, and they may never meet again in the same time and place. Be sensible. We need the same thing.
        - id: ch03-b11
          speaker: narrator
          text: The Captain returned before anyone could answer, bringing the master of the dye works with him. The man's hair and beard curled like those of the men the children had seen in Babylon. His clothes resembled the Captain's, but everything was made grander with gold and embroidery. Necklaces of beads and silver hung across his chest. Among them was a glass amulet, with a face very like his own set between two bulls' heads. Gold and silver bracelets and armlets covered his arms. He looked over the four children with a keen merchant's eye before he spoke.
        - id: ch03-b12
          speaker: dye_master
          text: My brother Pheles has just returned from Tarshish. He'll be at his garden house, unless he's hunting wild boar in the marshes. Shore life bores him terribly.
        - id: ch03-b13
          speaker: captain
          text: A true Phoenician! As the old song says, Tyre forever, for Tyre rules the waves. I'll take my young barbarians to him at once.
        - id: ch03-b14
          speaker: dye_master
          text: You should. They're very strange, aren't they? Such dreadful clothes, and so many of them! Look at those hideous coverings on their feet.
        - id: ch03-b15
          speaker: narrator
          text: Robert thought how easy and pleasant it would be to catch the dye-master by the feet and tip him backward into a nearby vat. But that would mean escaping at once, so he controlled himself. This Tyrian adventure felt calmer than their others, and the charm was certainly there on the Egyptian's neck.
        - id: ch03-b16
          speaker: narrator
          text: The children enjoyed every part of the journey that followed. First came the row from the island city across to the shore. Then, at the gate of the mainland town, the Captain hired donkeys, and everyone rode out into the countryside. The whole land seemed like one great garden. Palms, fig trees, and cedars grew everywhere. Clematis, honeysuckle, and jasmine climbed among the olives and mulberries. Tulips and gladioli brightened the ground. Here and there stood clumps of mandrake, whose bell-shaped flowers looked as if someone had cut them from dark blue jewels. Far beyond the green country rose the mountains of Lebanon.
        - id: ch03-b17
          speaker: narrator
          text: At last they reached a long, low house with pillars across its front, pleasantly sheltered by cedars and sycamores. Everyone dismounted, and the donkeys were led away.
        - id: ch03-b18
          speaker: robert
          text: Why does this remind me of Rosherville? Because it's the place to spend a happy day.
        - id: ch03-b19
          speaker: cyril
          text: It was very decent of the Captain to bring us somewhere so splendid.
        - id: ch03-b20
          speaker: anthea
          text: This feels more real than anything else we've seen. It's almost like a country holiday at home.
        - id: ch03-b21
          speaker: narrator
          text: The children and the Egyptian were left alone in a large hall. Under their feet, a mosaic floor had been made into wonderful pictures of ships, strange creatures of the sea, and darting fish. An open doorway led their eyes into a pleasant courtyard where flowers grew in the sunlight.
        - id: ch03-b22
          speaker: jane
          text: I'd like to stay for a week and ride a donkey every day.
        - id: ch03-b23
          speaker: narrator
          text: Everyone felt cheerful. Even Rekh-mara seemed pleasanter. Then the Captain returned with a joyful smile, beside the master of the house. Pheles studied the children and nodded twice.
        - id: ch03-b24
          speaker: pheles
          text: Yes. My steward will pay your price, but I won't pay that much for the Egyptian dog.
        - id: ch03-b25
          speaker: narrator
          text: The two men walked on.
        - id: ch03-b26
          speaker: rekh_mara
          text: Well, this is a pretty kettle of fish.
        - id: ch03-b27
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: What is?
        - id: ch03-b28
          speaker: rekh_mara
          text: Our present situation. Our friend the sailor has sold every one of us as slaves.
        - id: ch03-b29
          speaker: narrator
          text: The news shocked them into a hurried council, and this time they allowed the Priest to join it. Rekh-mara advised them to remain where they were. So far, they were in no danger. More importantly, the complete Amulet had to be somewhere near this house. If it were not, the magic could never have brought them to that place. The children discussed the matter from every side and finally agreed that staying offered their best chance.
        - id: ch03-b30
          speaker: narrator
          text: In spite of the sale, the household treated the children much more like guests than enslaved servants. Rekh-mara was less fortunate. He was sent directly to the kitchen and put to work. That very evening, an order arrived from the King, and Pheles had to leave at once to begin another voyage. Once he was gone, his wife decided that the children made amusing company. She kept them talking, singing, and dancing until very late. As she explained, their performance helped distract her mind from the sorrow of her husband's departure.
        - id: ch03-b31
          speaker: jane
          text: I do like being a slave.
        - id: ch03-b32
          speaker: narrator
          text: She spoke cheerfully as they curled up on the large soft cushions that served as beds.
    - id: ch04
      title: THE VOYAGE TO THE TIN ISLES
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In the blackest part of the night, each child woke to a hand passing softly over their face and a low whisper.
        - id: ch04-b02
          speaker: rekh_mara
          text: Keep quiet, or everything is lost. It is I, Rekh-mara, Priest of Amen. The man who brought us here has gone to sea again. He took my Amulet by force, and I have no magic that can recover it. Can the Amulet you carry help us?
        - id: ch04-b03
          speaker: narrator
          text: By then they were all wide awake.
        - id: ch04-b04
          speaker: cyril
          text: We can follow him. But he might take our Amulet too, or be angry because we came after him.
        - id: ch04-b05
          speaker: rekh_mara
          text: Leave that to me. Hide your Amulet carefully.
        - id: ch04-b06
          speaker: narrator
          text: There, in the deep darkness of the room in the Tyrian countryside, the children held up their Amulet once more and spoke the word. The arch opened, and all of them passed through. On the other side, they landed aboard a ship that pitched and tumbled over a sea driven by the wind. There was nothing they could do in the darkness but crouch close together and wait for morning. The wild motion made both Jane and Cyril miserably seasick.
        - id: ch04-b07
          speaker: narrator
          text: At last dawn spread a dove-colored light across the steel-gray waves. The children tried to stand, though the rolling deck made even that simple act difficult. Pheles was a hardy sailor and an experienced adventurer, not a man easily frightened. Yet when he suddenly turned and found the whole group standing behind him, his face went quite pale.
        - id: ch04-b08
          speaker: pheles
          text: Well! I never saw such a thing. Never!
          emotion: surprised
        - id: ch04-b09
          speaker: rekh_mara
          text: Master, the sacred Amulet around your neck brought us here by its magic.
        - id: ch04-b10
          speaker: narrator
          text: Bowing was even harder than standing on that tumbling deck.
        - id: ch04-b11
          speaker: pheles
          text: I never did! Well, well!
          emotion: surprised
        - id: ch04-b12
          speaker: robert
          text: What port are we sailing for?
        - id: ch04-b13
          speaker: pheles
          text: Are you a navigator?
        - id: ch04-b14
          speaker: narrator
          text: Robert admitted that he was not.
        - id: ch04-b15
          speaker: pheles
          text: Then I don't mind telling you. We are bound for the Tin Isles. Tyre alone knows their location, and we hide the secret from the whole world. That secret matters as much to us as your magic matters to you.
        - id: ch04-b16
          speaker: narrator
          text: His voice had changed. He now treated the children and their Amulet with far greater respect.
        - id: ch04-b17
          speaker: jane
          text: The King sent you, didn't he?
        - id: ch04-b18
          speaker: pheles
          text: Yes. He ordered me to sail with ten brave gentlemen and this crew. You shall come with us and see many wonders.
        - id: ch04-b19
          speaker: narrator
          text: Pheles bowed and went away. He had them left alone with dried fruit and a kind of hard biscuit for breakfast.
        - id: ch04-b20
          speaker: robert
          text: What do we do now?
        - id: ch04-b21
          speaker: rekh_mara
          text: Wait until he lands in the Tin Isles. Then the barbarians can help us attack him at night and tear the sacred Amulet from his accursed heathen neck.
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: The Priest ground his teeth.
        - id: ch04-b23
          speaker: jane
          text: When will we reach the Tin Isles?
        - id: ch04-b24
          speaker: rekh_mara
          text: Perhaps six months. Perhaps a year.
        - id: ch04-b25
          speaker: jane
          text: A whole year of this?
          emotion: fearful
        - id: ch04-b26
          speaker: narrator
          text: Cyril still felt too ill to care about breakfast. He hugged himself unhappily and shuddered.
        - id: ch04-b27
          speaker: robert
          text: We can make the year shorter. Jane, bring out the Amulet. Wish us to the place where it will be when this ship is twenty miles from the Tin Island. That will leave enough time to make our plans.
        - id: ch04-b28
          speaker: narrator
          text: The wish took only a moment. Suddenly they stood on the same ship, but now it sailed between a gray northern sky and a gray northern sea. The setting sun showed only as one pale yellow line. Though the vessel was the same, it looked deeply changed, and so did its crew. The sailors were weather-beaten and dirty. Their clothes hung torn and ragged after the long voyage. The children understood what had happened. They had skipped over nine months in an instant, but the ship and every person aboard had been forced to live through all that time. Pheles had grown thinner. His face was rugged now, worn down by worry.
        - id: ch04-b29
          speaker: pheles
          text: The charm has brought you back! I prayed to it every day for nine months, and now you've come. Can none of your magic help us?
          emotion: surprised
        - id: ch04-b30
          speaker: rekh_mara
          text: What help do you need?
        - id: ch04-b31
          speaker: pheles
          text: I need a huge wave to swallow the foreign ship behind us. A month ago it waited near the pillars of the gods, and ever since then it has followed us. They mean to discover Tyre's secret route to the Tin Islands. I could lose them if I could steer tonight, but there will be no stars.
        - id: ch04-b32
          speaker: rekh_mara
          text: My magic is powerless here.
        - id: ch04-b33
          speaker: robert
          text: My magic can't raise a giant wave, but I can show you how to steer without stars.
        - id: ch04-b34
          speaker: narrator
          text: Robert produced the shilling compass he carried, which fortunately was still in working order. He had bought it at school from another boy for fivepence. The bargain had also included a piece of rubber, a strip of whalebone, and half a stick of red sealing wax. Now Robert placed the compass before Pheles and patiently showed him how its needle worked. However the ship turned beneath it, the needle kept its direction. Pheles watched and wondered at the little instrument's magical truth.
        - id: ch04-b35
          speaker: robert
          text: I'll give it to you if you give me the charm around your neck.
        - id: ch04-b36
          speaker: narrator
          text: Pheles did not answer. He laughed, snatched the compass from Robert, and turned away laughing still.
        - id: ch04-b37
          speaker: rekh_mara
          text: Take comfort. Our moment will come.
          emotion: calm
        - id: ch04-b38
          speaker: narrator
          text: Darkness deepened. Crouched beside a dim lantern, Pheles steered by a shilling compass bought at the Crystal Palace.
    - id: ch05
      title: THE DRAGON ROCKS
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: No one ever discovered how the other ship managed to steer through that starless night. Pheles followed the compass through the darkness, believing he was leaving his pursuers behind. Then, deep in the night, the lookout stationed at the stern saw a shape close upon them. He cried out in a voice so terrible that everyone aboard understood the danger at once.
        - id: ch05-b02
          speaker: lookout
          text: She's almost upon us!
          emotion: fearful
        - id: ch05-b03
          speaker: pheles
          text: And we are almost at the harbor.
        - id: ch05-b04
          speaker: narrator
          text: Pheles fell silent. Then he abruptly changed course, stood upright, and addressed the men.
        - id: ch05-b05
          speaker: pheles
          text: My friends, brave gentlemen who joined this venture at our King's command, the treacherous foreign ship is at our heels. If we land, they will land too. The gods alone know whether they might defeat us, survive, and carry home the secret of Tyre's island to enrich their own wretched country. Shall we allow it?
        - id: ch05-b06
          speakers: [gentleman_one, gentleman_two, gentleman_three]
          ensemble: chorus
          text: Never!
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: The enslaved rowers below pulled hard and could not hear him. Then Rekh-mara sprang at Pheles with the fierceness of a wild beast.
        - id: ch05-b08
          speaker: rekh_mara
          text: Give me back my Amulet!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: He seized the charm. Its chain snapped, leaving the Amulet in the Priest's hand. Pheles laughed, balancing easily as the ship leaped forward under the oars.
        - id: ch05-b10
          speaker: pheles
          text: This is no hour for charms and magic shows. We have lived as men, and we will die as gentlemen for the honor and glory of Tyre, our splendid city. Tyre forever! Tyre rules the waves! I am steering straight for the Dragon Rocks. We will go down for our city, as brave men should. The creeping cowards behind us will sink like slaves, and when we live again, they will be slaves to us. Tyre forever!
        - id: ch05-b11
          speaker: narrator
          text: A mighty shout rose from the gentlemen around him. The sound carried down through the ship, and even the enslaved rowers below caught the cry and joined it, though moments before they had been too far away to hear Pheles speak.
        - id: ch05-b12
          speaker: anthea
          text: Quick! The Amulet!
          emotion: fearful
        - id: ch05-b13
          speaker: narrator
          text: Anthea raised their own half-Amulet at once. Beside her, Rekh-mara held up the half he had torn from Pheles. Someone spoke the word, and two enormous arches grew above the deck of the plunging ship. They stood beneath the dark sky while the wind screamed through them. A great and beautiful green light poured from each Amulet and shone far across the tossing waves. That light also revealed what waited directly ahead. The huge rocks had black faces and jagged teeth, and the ship's pointed prow was less than two ship lengths away from them.
        - id: ch05-b14
          speakers: [pheles, gentleman_one, gentleman_two, gentleman_three]
          ensemble: chorus
          text: Tyre forever! Tyre rules the waves!
          emotion: happy
        - id: ch05-b15
          speaker: narrator
          text: The voices of the doomed men rose together in a triumphant shout. The children scrambled through their arch just in time. A moment later they stood shaking and blinking in the familiar parlor in Fitzroy Street. Yet the sounds of the other time still rang in their ears. They heard the shrill whistle of the wind, the hard rattle of the oars, and the crash of the ship's bow striking the rocks. Last of all came the final shout of those brave gentlemen-adventurers. For the sake of the city they loved, they had gone singing to their deaths.
        - id: ch05-b16
          speaker: anthea
          text: So we've lost the other half of the Amulet again.
        - id: ch05-b17
          speaker: narrator
          text: The children had told the Psammead everything.
        - id: ch05-b18
          speaker: psammead
          text: Nonsense! Pooh! That was not the other half. It was the same half you already have, the one that wasn't crushed and lost.
        - id: ch05-b19
          speaker: anthea
          text: But how could it be the same one?
        - id: ch05-b20
          speaker: psammead
          text: Not exactly the same, of course. Your half is many years older. But it certainly wasn't the other half. What words did you use when you made the wish?
        - id: ch05-b21
          speaker: jane
          text: I don't remember.
        - id: ch05-b22
          speaker: psammead
          text: I do. You said, “Take us where you are.” And that is exactly what it did. So you see, it had to be the same half.
        - id: ch05-b23
          speaker: anthea
          text: I see.
