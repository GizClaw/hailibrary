audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    learned_gentleman:
      display_name: 学者先生
      tts:
        delivery: 温文拘谨，学究气中带着真诚善意
        timbre: 清瘦柔和的成年男声
        pace: 舒缓
        pitch: 中低
    gate_captain:
      display_name: 守门队长
      tts:
        delivery: 冷淡威严，公事公办
        timbre: 低沉坚实的成年男声
        pace: 中等偏慢
        pitch: 低
    kind_guard:
      display_name: 守门卫兵
      tts:
        delivery: 爽朗厚道，带着自豪的玩笑意味
        timbre: 温厚的成年男声
        pace: 中等
        pitch: 中低
    babylonian_woman:
      display_name: 巴比伦妇人
      tts:
        delivery: 热情朴实，待孩子亲切自然
        timbre: 柔暖的成年女声
        pace: 中等
        pitch: 中
    palace_porter:
      display_name: 王宫门房
      tts:
        delivery: 谨慎利落，熟悉宫廷规矩
        timbre: 清晰的成年男声
        pace: 中等
        pitch: 中低
    queen:
      display_name: 巴比伦王后
      tts:
        delivery: 华贵亲切，活泼中带着任性
        timbre: 明丽柔美的成年女声
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第六章　通往巴比伦之路
      blocks:
        - id: ch01-b01
          speaker: jane
          text: >-
            巴比伦离这儿多少里？七十里，不远！点着蜡烛能走到吗？能，还能走回来！
        - id: ch01-b02
          speaker: narrator
          text: >-
            简正抱着娃娃，一边前后摇晃，一边给它唱歌。她在餐桌底下搭了间小屋，桌面当屋顶，四周垂下的桌布和椅背罩巾当墙，再拿书压住布料露在桌沿上的一端。其他三个孩子却在楼梯上玩一种惊险得叫人快活的游戏。他们找来家里最大、最好的一只茶盘，把楼梯地毯当成雪坡，从上面一路滑下去。最好趁压毯杆拿去清洗时玩，因为那时整张地毯只由顶端的钉子固定。这本来是五六种顶顶好玩的游戏之一，可大人们偏偏最不讲理。老保姆许多地方都好得没话说，到底还是个十足的大人。每个参加的人连一半的瘾都没过足，她已经坚决叫停，收走了茶盘。兴致全败的一伙人走进起居室，这会儿谁也不肯轻易高兴起来。
        - id: ch01-b03
          speaker: cyril
          text: 真糟糕透了！
        - id: ch01-b04
          speaker: robert
          text: 简，别唱啦！
        - id: ch01-b05
          speaker: anthea
          text: 换一首吧，这首歌我实在听够了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            外面下着雨，原定那些不用花钱的伦敦名胜游览全泡了汤。孩子们一上午都在想昨天那场不可思议的历险。简举起护符，护符变成拱门，他们从眼前的时代和摄政公园跨进去，一步就到了八千年前的埃及。那一切还鲜明得叫人害怕。其实，人人都盼着别再有人提出去过去冒险，昨天的经历至少够他们消受一个星期。可每个人又都暗暗不安，唯恐别人看出自己害怕。西里尔本来并不胆小，想到自己竟可能不得不把自己看成胆小鬼，心里更不好受，于是先开了口。
        - id: ch01-b07
          speaker: cyril
          text: 简，先从屋里出来。咱们总得谈谈护符的事。
        - id: ch01-b08
          speaker: robert
          text: 哦，要只是谈谈，那还行。
        - id: ch01-b09
          speaker: narrator
          text: 简乖乖扭着身子爬出来，坐在小屋门前，还摸了摸脖子，确认护符仍挂在那里。罗伯特刚才的语气很无礼，西里尔一听，便把原本没打算说出口的话也说了。
        - id: ch01-b10
          speaker: cyril
          text: >-
            当然不只是谈谈。我们应该去找护身符。有这么一件一等一的护符，却把它闲在马厩里白吃草料，能有什么用？
        - id: ch01-b11
          speaker: robert
          text: 我是什么都敢去。不过嘛，我觉得姑娘们今天好像不大乐意。
        - id: ch01-b12
          speaker: anthea
          text: 我乐意！你要觉得我害怕，那就想错了。
        - id: ch01-b13
          speaker: jane
          text: 可我就是害怕。我不喜欢那里，也绝不会再去了，说什么都不去。
          emotion: fearful
        - id: ch01-b14
          speaker: cyril
          text: 傻瓜，我们又不是再去那里。这次会去另一个地方。
        - id: ch01-b15
          speaker: jane
          text: 谁知道那是什么地方？说不定到处都是狮子老虎。
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 简越是害怕，其他人反倒越觉得自己勇敢，纷纷认定大家非去不可。
        - id: ch01-b17
          speaker: anthea
          text: 再说，不去也太对不起赛米德了。
        - id: ch01-b18
          speaker: narrator
          text: 简站了起来。她已经被逼得什么也顾不得了。
        - id: ch01-b19
          speaker: jane
          text: >-
            我不去！不去，不去，就是不去！自己不想去，连会到什么地方都不知道，还偏要去，这不是犯傻吗？你们敢逼我，我就大声叫，还要去告诉老保姆，让她把护符扔进厨房炉子里烧掉！这下你们听清楚了吧！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            简说出的，偏偏是其他人整个上午都有过的心情，大家因此气坏了。每个人都想，这下总不能怪到自己头上。于是他们齐心协力，让简知道错全是她的，他们全都非常生气。这么一来，三个人顿时又勇敢了。
        - id: ch01-b21
          speaker: robert
          text: 告密精，割舌头，全城小狗分一口。
        - id: ch01-b22
          speaker: narrator
          text: 罗伯特唱起刻薄的童谣。
        - id: ch01-b23
          speaker: cyril
          text: 只要什么事里有姑娘掺和，最后总会变成这样。
        - id: ch01-b24
          speaker: anthea
          text: 哼，就算我是姑娘，我也不害怕。
        - id: ch01-b25
          speaker: narrator
          text: >-
            西里尔那冷冷的口气比童谣更伤人，安西娅这句话更是最扎心的一句。简抱起娃娃，带着一股绝望中生出来的勇气，迎面看着他们。
        - id: ch01-b26
          speaker: jane
          text: >-
            我才不管！我就是不去！明明不愿意，又不知道那地方是什么样，还非去不可，简直傻透了。你们尽管笑吧。你们都是坏蛋，我恨你们！
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: >-
            她说完这些可怕的话，走出去，把门摔得震天响。留下的三个人谁也不看谁，刚才那股勇气也没了。西里尔拿起书，可书里的内容一点也吸引不了他。罗伯特心不在焉地踢着椅子腿。他一有情绪，两只脚总比嘴更会表达。安西娅站在桌边，把桌布末端一道一道打褶，神情专注得仿佛世上再没有比把每道褶子折成同样宽更要紧的事。房间里安静下来，连简的哭声也渐渐听不见了。
        - id: ch01-b28
          speaker: anthea
          text: 哎呀，咱们去讲和吧。可怜的小猫咪，她毕竟最小。
        - id: ch01-b29
          speaker: robert
          text: 可她骂我们是坏蛋。
        - id: ch01-b30
          speaker: narrator
          text: 罗伯特忽然又踢了椅子一脚。西里尔偶尔会发作一阵毫不让步的公正。
        - id: ch01-b31
          speaker: cyril
          text: 是咱们先招她的。至少，是你先招她的。
        - id: ch01-b32
          speaker: robert
          text: 你要这么说，我才不道歉。
        - id: ch01-b33
          speaker: narrator
          text: 他话音刚落，又重重一脚踢去，椅子腿喀嚓裂开了。
        - id: ch01-b34
          speaker: anthea
          text: >-
            就去和好吧。咱们三个对她一个，而且妈妈最讨厌我们吵架。走，我先说对不起，虽然我几乎没说什么。
        - id: ch01-b35
          speaker: cyril
          text: 好吧，赶紧了结。喂，小猫咪！
        - id: ch01-b36
          speaker: narrator
          text: 楼梯高处传来断断续续的歌声。歌声里夹着抽鼻子的声音，却仍旧满是挑衅。
        - id: ch01-b37
          speaker: jane
          text: >-
            巴比伦离这儿多少里？七十里，不远！点着蜡烛能走到吗？能，还能走回来！
        - id: ch01-b38
          speaker: narrator
          text: >-
            她分明是故意唱来气人，实在叫人受不了。安西娅却不给自己生气的工夫，带头冲上楼梯，一步跨三级，很快来到最顶层。简坐在最高一级台阶上，正按着歌的拍子拍打娃娃。
        - id: ch01-b39
          speaker: anthea
          text: 小猫咪，咱们讲和吧！只要你肯原谅，我们很抱歉……
        - id: ch01-b40
          speaker: narrator
          text: >-
            话还没说完，这些已经足够。四个孩子互相亲吻，正式恢复了和平。简年纪最小，照他们之间的规矩，理应享受这样一场讲和仪式。安西娅觉得普通的道歉还不够，又另外向她赔了一回不是。
        - id: ch01-b41
          speaker: anthea
          text: >-
            亲爱的小猫咪，要是我刚才像头小猪，对不起。其实我心底最真实的地方，也有一点不想再去过去。可是，不去就找不到护身符。你想，要是我们能把爸爸、妈妈和小羊羔平安接回来，那该多好！所以我们一定得去。不过可以等一两天，等你觉得勇敢一些。
        - id: ch01-b42
          speaker: robert
          text: >-
            再胆小的人，吃了生肉也会勇敢。蔓越莓也行，鞑靼人就吃这个，所以他们勇敢得吓人。蔓越莓大概只有圣诞节才有，不过你愿意的话，我去请老保姆把你的羊排煎得特别生。
        - id: ch01-b43
          speaker: jane
          text: 不用了，不吃那个我也能勇敢。我会试试的。
        - id: ch01-b44
          speaker: narrator
          text: 简最讨厌没煎熟的肉。这时，学者先生打开房门，探出头来。
        - id: ch01-b45
          speaker: learned_gentleman
          text: >-
            对不起，我刚才好像听见了一个熟悉的词，不知道是不是听错了。你们唱的是不是一首关于巴比伦的古老歌谣？
        - id: ch01-b46
          speaker: robert
          text: >-
            不是。至少，简唱的是《巴比伦离这儿多少里》。不过她一直……我还以为你听不清歌词呢。
        - id: ch01-b47
          speaker: narrator
          text: 罗伯特差点说出“她一直抽鼻子”，幸亏安西娅及时掐了他一下。
        - id: ch01-b48
          speaker: learned_gentleman
          text: 我的确没有全听清。你们愿意把歌词背给我听吗？
        - id: ch01-b49
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: >-
            巴比伦离这儿多少里？七十里，不远！点着蜡烛能走到吗？能，还能走回来！
        - id: ch01-b50
          speaker: learned_gentleman
          text: 要是真能去就好了。
          emotion: sad
        - id: ch01-b51
          speaker: jane
          text: 不能去吗？
        - id: ch01-b52
          speaker: learned_gentleman
          text: >-
            巴比伦早已倾覆了。它曾是一座伟大又美丽的城市，是学问和艺术的中心。现在那里只剩废墟，还深埋在泥土底下，连它当年究竟坐落在哪里，人们也不能确定。
          emotion: sad
        - id: ch01-b53
          speaker: narrator
          text: >-
            学者先生靠在楼梯栏杆上，目光仿佛飘到了很远的地方。他像是透过楼梯窗户，看见了古巴比伦曾经拥有的辉煌。
        - id: ch01-b54
          speaker: cyril
          text: >-
            我说，我们给你看过那枚护符，上面的名字还是你教我们念的，对吧？
        - id: ch01-b55
          speaker: learned_gentleman
          text: 对！
        - id: ch01-b56
          speaker: cyril
          text: 那你觉得，它以前有没有到过巴比伦？
        - id: ch01-b57
          speaker: learned_gentleman
          text: >-
            很有可能。极早期的埃及墓葬里发现过这种护符，但没有准确证据能证明它们起源于埃及。也许它们是从亚洲传来的。就算这枚护符是在埃及制成的，也完全可能由一次友好的使团带去巴比伦。还有一种可能，巴比伦军队曾到埃及作战，又把它当作战利品带回去。护符上的铭文也未必和它同时出现，很可能晚了许多。想到你们那件精美的宝物曾在巴比伦人的生活中派过用场，实在是个令人愉快的猜想。
        - id: ch01-b58
          speaker: narrator
          text: 孩子们互相看看。这次开口的是简。
        - id: ch01-b59
          speaker: jane
          text: 巴比伦人是野蛮人吗？他们是不是总在打仗，还把东西扔得到处都是？
        - id: ch01-b60
          speaker: narrator
          text: 她借着自己心里的害怕，准确猜中了其他人的担忧。
        - id: ch01-b61
          speaker: learned_gentleman
          text: >-
            巴比伦人当然比亚述人温和，也绝不野蛮。他们有很高的文明。我是说，他们会雕刻美丽的塑像，会制作精巧的珠宝，也会建造宏伟的宫殿。他们非常有学问，拥有壮丽的图书馆，还有研究占星术和天文的高塔。
        - id: ch01-b62
          speaker: robert
          text: 什么术？
        - id: ch01-b63
          speaker: learned_gentleman
          text: 就是看星星和算命。他们还有神庙，还有美丽的空中花园……
        - id: ch01-b64
          speaker: jane
          text: 好吧，你们愿意的话，我去巴比伦。
        - id: ch01-b65
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: 说定了！
          emotion: happy
        - id: ch01-b66
          speaker: learned_gentleman
          text: >-
            唉，年轻的时候，人在梦里真能走得很远。那就祝你们玩得……痛快吧。
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: 他勉强装出轻快的样子，说完便回房关上了门。
        - id: ch01-b68
          speaker: cyril
          text: >-
            他说“痛快”的时候，简直像在说外国话。走吧，现在就去叫醒赛米德。我看巴比伦一定好玩得不得了。
        - id: ch01-b69
          speaker: narrator
          text: >-
            他们叫醒赛米德，把它放进鲈鱼篮，还带了一张防水布，免得巴比伦天气不好。赛米德很恼火，不过它说，去巴比伦跟去别处都一样。
        - id: ch01-b70
          speaker: psammead
          text: 那附近的沙子倒是不错。
        - id: ch01-b71
          speaker: narrator
          text: 简举起护符，西里尔对它说出请求。
        - id: ch01-b72
          speaker: cyril
          text: >-
            我们要去巴比伦寻找你丢失的那一部分。请你打开路，让我们从你这里过去，好吗？
        - id: ch01-b73
          speaker: jane
          text: 请把我们送到城外。要是我们不喜欢那里，就不用进城了。
        - id: ch01-b74
          speaker: psammead
          text: 别磨蹭一整天。
        - id: ch01-b75
          speaker: narrator
          text: 护符若没有力量之名就什么也做不了，安西娅赶紧轻声念了出来。
        - id: ch01-b76
          speaker: anthea
          text: 乌尔——赫考——塞切！
        - id: ch01-b77
          speaker: narrator
          text: >-
            护符立刻长高，化成一座几乎顶到卧室天花板的拱门。门外仍是刷过漆的五斗柜、基德明斯特地毯、盥洗架，还有那只铆补过的柳树图案水罐。褪色的窗帘旁，雨天的室内光线灰暗无神。门里却闪着柔绿的叶子和雪白的花，明亮得像另一个世界。大家看得心里轻松，高高兴兴迈了进去。连简也觉得，眼前的景色怎么都不像藏着狮子。她举着护符让其他人一个个先过去，手几乎没有发抖。最后，她自己也从门中闪身而过。护符随即恢复原来的大小，她又把它好好挂回脖子上。
        - id: ch01-b78
          speaker: narrator
          text: >-
            他们站在一棵果树下面，满树绿叶间开着雪白的花。四周像是一座望不到边的果园，处处都是这样的树，满枝青绿，满眼洁白。脚下长长的青草间，番红花、百合花和他们叫不出名字的蓝花一起开放。头顶浓密的枝叶里，画眉和乌鸫正在唱歌。远处又传来鸽子轻柔的咕咕声，一声声落进果园碧绿的宁静。
        - id: ch01-b79
          speaker: anthea
          text: 哦，太美了！简直跟家乡一样，我是说英格兰。只是这里更蓝、更白、更绿，花也更大。
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: 男孩们承认这里相当不错，连简也觉得处处都很漂亮。
        - id: ch01-b81
          speaker: anthea
          text: 这里肯定没什么可怕的东西。
        - id: ch01-b82
          speaker: jane
          text: >-
            那可不一定。就算人们正在互相残杀，果树大概还是照常开花结果。我不喜欢学者先生说的空中花园。也许那是专门用来把人吊死的花园。希望这里不是。
          emotion: fearful
        - id: ch01-b83
          speaker: cyril
          text: >-
            当然不是。空中花园就是挂在空中的花园。我想，是用铁链吊在房屋之间，跟托盘差不多。走吧，咱们去找个地方。
        - id: ch01-b84
          speaker: narrator
          text: >-
            他们踏着清凉的长草往前走。目光所及全是树，一座果园尽头还是一座果园，两片园地中间只隔着一条清澈的小溪。他们跳过溪水继续前进，不久又得跨过下一条。西里尔喜欢园艺，所谓喜欢，其实就是爱站在一旁看园丁干活。不过，这倒让他认得许多树。他一棵棵指给大家看，有坚果树、杏仁树和杏树，还有长着五指般宽大叶片的无花果树。这一回，他的知识确实为他赢得了大家的敬重。
        - id: ch01-b85
          speaker: anthea
          text: 这里真像《镜中奇遇》里那些方格之间的地方。
        - id: ch01-b86
          speaker: narrator
          text: >-
            后来，他们来到一座完全不同的园子，角落里有一幢低矮的房屋。
        - id: ch01-b87
          speaker: cyril
          text: >-
            这些是葡萄藤，所以这里是葡萄园。那座屋子里面，说不定还有榨酒机呢。
        - id: ch01-b88
          speaker: narrator
          text: >-
            走出果园后，他们踏上一条勉强能算作道路的路。路面崎岖不平，跟你平日走惯的道路完全不同。两边长着柏树、金合欢，还有一道柽柳篱笆，很像尼斯到戛纳的路边那种。如果你只去过利特尔汉普顿，那一带也能看见。前方出现了一大片建筑。木屋和石屋零散地坐落在绿色果园之间，后面耸立着一道巨墙，在清晨的阳光下闪着红光。墙高得惊人，超过圣保罗大教堂的一半。几座巨门嵌在墙中，被刚升起的太阳照得像黄金一样耀眼。每座门左右都有一座结实的方塔，突出墙面，又高高越过墙顶。墙后还有更多塔楼和房屋，闪着金色与鲜艳的色彩。左边远处，一条大河卷着钢蓝色的旋流。透过树木的空隙，还能看到河水从城中流出，穿过墙上的巨大拱洞，继续奔向远方。
        - id: ch01-b89
          speaker: cyril
          text: 水边那些像羽毛的树，就是棕榈树。
        - id: ch01-b90
          speaker: robert
          text: >-
            哦，你可真是什么都知道。那么远处那片又平又沙的地方，灰绿色的一大片又是什么？
        - id: ch01-b91
          speaker: cyril
          text: >-
            好吧，我什么也不说了。我只是以为，你下次再看见棕榈树时，会愿意认出它来。
        - id: ch01-b92
          speaker: anthea
          text: 快看，他们打开城门了！
        - id: ch01-b93
          speaker: narrator
          text: >-
            两扇巨门发出铿锵的铜响，缓缓向后开启。门才打开，十来个人立刻从城里涌出来，沿着大路朝孩子们迎面走来。四个孩子谁也不用开口商量，一起蹲到柽柳篱笆后面，把自己藏了起来。
        - id: ch01-b94
          speaker: jane
          text: >-
            我不喜欢那种关门声。要是人在里面，门忽然关上，恐怕就再也出不来了。
          emotion: fearful
        - id: ch01-b95
          speaker: psammead
          text: >-
            你不是有自己的拱门可以出去吗？别这么像个胆小的小姑娘。换作我，就昂首走进城，开口要求见国王。
        - id: ch01-b96
          speaker: narrator
          text: >-
            这个办法听起来又简单又气派，大家立刻都很中意。刚才出城的人穿得十分朴素，全身只套着一件长长的蓝衫或黄衫，所以孩子们确信他们都是出去做工的人。等那群人从身旁走过，渐渐远去，四个孩子才从篱笆后站起来，昂首挺胸地朝两座塔楼之间的铜门前进。城墙厚得惊人，门上的拱洞又深又暗，简直变成了一条隧道。
        - id: ch01-b97
          speaker: cyril
          text: 鼓起勇气，大步向前！想偷偷溜进去没用，得大胆一点！
        - id: ch01-b98
          speaker: narrator
          text: 罗伯特突然高唱《英国掷弹兵》，他们便踩着进行曲的步子走向巴比伦城门。
        - id: ch01-b99
          speaker: robert
          text: >-
            有人赞颂亚历山大，有人赞颂赫拉克勒斯，还有赫克托耳与莱山德，以及这些伟大的名字。可所有英勇的英雄当中……
        - id: ch01-b100
          speaker: narrator
          text: >-
            罗伯特刚唱到这里，他们便踏上巴比伦城门的门槛。就在这一刻，两个身披闪亮铠甲的男人突然从两旁大步上前，把手里的长矛一下子交叉在一起，严严实实挡住了四个孩子的去路。
        - id: ch01-b101
          speakers: [gate_captain, kind_guard]
          ensemble: duo
          text: 来者何人？
        - id: ch01-b102
          speaker: narrator
          text: >-
            我想，以前一定解释过一件怪事。孩子们无论偶然去到什么地方，总能听懂当地人说的话。他们自己开口时，当地人也同样听得明明白白。要是我从前忘了解释，那也只好请你暂且接受，因为眼下实在没有时间从头细说。
        - id: ch01-b103
          speaker: cyril
          text: 我们从很远的日不落帝国来，想见你们的国王。
        - id: ch01-b104
          speaker: anthea
          text: 当然，要是方便的话。
        - id: ch01-b105
          speaker: gate_captain
          text: >-
            国王陛下，愿他万寿无疆，去迎接第十四位妻子回宫了。你们究竟从什么地方来，竟连这件事都不知道？
        - id: ch01-b106
          speaker: anthea
          text: 那我们见王后。
        - id: ch01-b107
          speaker: narrator
          text: 安西娅匆匆换了目标，根本没有回答他们从哪里来。
        - id: ch01-b108
          speaker: gate_captain
          text: 王后陛下，愿她万寿无疆，今天会在日出三小时后接见臣民。
        - id: ch01-b109
          speaker: cyril
          text: 那么，三个小时还没过完，我们能做什么？
        - id: ch01-b110
          speaker: narrator
          text: >-
            守门队长不知道，也不在乎。他对孩子们的兴趣少得出奇。另一个卫兵却更有人情味。
        - id: ch01-b111
          speaker: kind_guard
          text: >-
            让他们进城看看吧。我敢拿最好的剑打赌，他们从没见过任何地方，能比得上我们这座小小的……村庄。
        - id: ch01-b112
          speaker: narrator
          text: >-
            他特意把宏伟的巴比伦说成“小村庄”，口气里满是得意，就像有人故意把浩瀚的大西洋叫作“鲱鱼池塘”。可是，守门队长听完这个主意，仍旧拿不定主意，没有立刻放行。
        - id: ch01-b113
          speaker: kind_guard
          text: >-
            他们毕竟只是孩子。我自己也有孩子。队长，让我离开几分钟吧。我带他们回家，请我那口子给他们找几件衣服，换下这一身古怪打扮。这样他们逛起来也不会被围观。行吗？
        - id: ch01-b114
          speaker: gate_captain
          text: 好吧，你愿意就去，只是别耗上一整天。
        - id: ch01-b115
          speaker: narrator
          text: >-
            卫兵领他们穿过长长的黑暗门洞，进入城中。这里跟伦敦完全不同。伦敦的房屋仿佛是拿各种零碎东西修了又补、补了又添，最后拼凑起来的。巴比伦的房屋却像是由一群喜欢相同东西的人一起建造的。它们并不一模一样，只是全都方方正正。有的大，有的小，装饰更是千变万化。有些墙上画着鲜艳的彩图，有些则绘着黑色与银色交织的花样。房屋之间还散布着平台、花园和阳台，开阔的空地上长着树木。卫兵一路把他们带进一条后街，停在一间小屋门前。门口坐着一个面容和善的女人，她面对着一间非常昏暗的屋子，手里正在纺线。
        - id: ch01-b116
          speaker: kind_guard
          text: >-
            借给这几个孩子一人一件斗篷吧，让他们在王后接见之前四处看看。你先放下羊毛，愿意就带他们逛逛。我得回去了。
        - id: ch01-b117
          speaker: narrator
          text: >-
            女人照办了。四个孩子披上带穗边的斗篷，跟着她走遍城里。哦，真希望我有足够的时间，把他们看见的一切全都告诉你。那里样样新奇，跟你曾经见过的任何东西都不一样。单说房屋吧，每一幢都明亮耀眼，许多墙面从上到下画满图画。有些大门两旁，还各自蹲着一头巨大的石雕怪兽。再看街上的人，这里没有黑礼服和高礼帽，也没有那些号称耐穿、实用，实际上却又灰暗又难看的外套和裙子。每个人都穿得鲜亮美丽，衣服上闪着蓝色、猩红、绿色与金色。
        - id: ch01-b118
          speaker: narrator
          text: >-
            集市亮丽得超出想象。摊位上摆着你可能需要的每一种东西，还有许多你眼下本来不需要，可一旦想要，就会想得什么也顾不上的东西。菠萝和桃子堆成小山。陶器与玻璃器皿有着漂亮的形状和灿烂的颜色。另一些摊子摆满项链、饰扣、手镯和胸针，还有的专卖织物、毛皮与绣花亚麻布。哪怕在伦敦的利伯蒂百货，孩子们也没见过这么多美丽的东西聚在一起。他们看得目不暇接，觉得不过一眨眼，约定的时间就快到了。
        - id: ch01-b119
          speaker: babylonian_woman
          text: 快到时候了，咱们该往王宫走。早点到比较好。
        - id: ch01-b120
          speaker: narrator
          text: >-
            他们来到王宫，才发现这里比先前见过的一切更加壮丽。整座宫殿流动着灿烂的色彩，金色、银色、黑色、白色交相辉映，看上去像一幅无比华美的刺绣。一重又一重宽阔的大理石台阶向上延伸，阶梯边缘耸立着巨大的雕像，每一尊都足有普通人二十倍高。有些怪物长着人的身体、鹰隼的头，还有一双仿佛锁子甲做成的翅膀。另一些是长着狗头的有翼人。那些怪物之间，还立着一尊尊伟大君王的塑像。
        - id: ch01-b121
          speaker: narrator
          text: >-
            一重重台阶之间是一层层平台，喷泉在那里不停扬起水花。王后的卫兵身穿白色与猩红色衣服，铠甲像金子一样闪亮。他们两人一组，沿着阶梯两旁一路排列上去。宫殿那扇巨大无比的门前，还密密聚着一大队卫兵。那扇宏伟的大门在正午阳光下光彩夺目，像一只亮得不可能存在的孔雀。各种各样的人正沿阶而上，请求王后接见。有穿着流苏荷叶边华丽绣裙的贵妇，有衣着朴素的穷人，还有把胡子抹上油、卷得整整齐齐的花花公子。西里尔、罗伯特、安西娅和简也混在人群中，一步步向王宫走去。
        - id: ch01-b122
          speaker: narrator
          text: 到了宫门，赛米德小心地从篮子里露出一只眼睛，压低声音说话。
        - id: ch01-b123
          speaker: psammead
          text: >-
            我可不想费心应付王后。我要跟这位太太回家。只要你们开口，她肯定会给我找些沙子。
        - id: ch01-b124
          speaker: jane
          text: 哦，别离开我们！
          emotion: fearful
        - id: ch01-b125
          speaker: narrator
          text: 那女人正向安西娅交代最后几条宫廷礼仪，没有听见简。
        - id: ch01-b126
          speaker: psammead
          text: >-
            别这么傻。你们有护符，却一点也不会用。要是需要我，念出力量之名，再让护符把我带到你们身边，不就行了？
        - id: ch01-b127
          speaker: jane
          text: 我宁可跟你走。
        - id: ch01-b128
          speaker: narrator
          text: >-
            这大概是简一生中说过的最惊人的话。人人都忘了礼貌，张大嘴巴。安西娅正往篮子里看，发现赛米德的嘴张得比谁都大。
        - id: ch01-b129
          speaker: jane
          text: >-
            别那样盯着我。它不想应付王后，我也不想。而且不管它去哪儿，我都知道，它肯定会把自己照顾得安全极了。
        - id: ch01-b130
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: 这话倒没错。
        - id: ch01-b131
          speaker: narrator
          text: >-
            大家早已从一次次相处中看出来，赛米德无论遇上什么情形，都很懂得判断哪一边对自己有利，也总有办法先照顾好自身的安全。所以，简对它的评价确实没有说错。
        - id: ch01-b132
          speaker: jane
          text: >-
            你会带我一起回家，对吧？等他们见完王后以前，也会让我跟你的小女儿们一起玩吧？
        - id: ch01-b133
          speaker: babylonian_woman
          text: 当然会，小宝贝！
        - id: ch01-b134
          speaker: narrator
          text: >-
            安西娅赶紧伸手摸摸赛米德，又紧紧抱了简一下。简一只手拉着女人，另一只胳膊挎住装赛米德的篮子，心满意足地跟在她身边，一路小跑着离开。其他三个孩子仍站在原处，目送她们穿过来来往往的人群。直到简、女人和篮子全都消失在五彩缤纷的衣裳之间，安西娅才转回身，重新面对王宫那扇华丽的门。
        - id: ch01-b135
          speaker: anthea
          text: 咱们请门房替我们保管巴比伦外套吧。
        - id: ch01-b136
          speaker: narrator
          text: >-
            三个孩子脱下女人借来的斗篷，请门房代为保管。他们只穿着自己的英国衣裳，安西娅是连衣裙，两个男孩则是外套，三个人还戴着帽子、穿着靴子。就这样，他们以一身与周围格格不入的打扮，站进互相推挤、等候王后接见的请愿者中间。
        - id: ch01-b137
          speaker: cyril
          text: 我们想拜见王后。我们来自遥远的日不落帝国！
        - id: ch01-b138
          speaker: narrator
          text: >-
            惊讶的低语和兴奋的颤动立刻传遍人群。门房先告诉一个黑人，那人又去告诉别人。接下来是一阵窃窃私语，也是一阵只能站着等待的停顿。终于，一个脸刮得干干净净的高大男人站到红色大理石阶梯顶端，朝孩子们招手。他们连忙走上台阶。罗伯特紧张得厉害，靴子踩在石面上，发出的响声比平时大得多。一扇门转开，一幅帘子也被拉到旁边。两列身穿华服、低头行礼的人排成一条通道，从孩子们面前一直伸向宝座的台阶。他们匆匆沿着这条人墙夹出的路向前走，宝座上随即传来一个甜美又亲切的声音。
        - id: ch01-b139
          speaker: queen
          text: 三个来自日不落之国的孩子！让他们到近前来，不必害怕。
        - id: ch01-b140
          speaker: narrator
          text: >-
            又过了一小会儿，孩子们已经来到宝座脚下，一齐跪了下来。他们把巴比伦女人临别前教的话记得清清楚楚，一字不差地向王后献上祝颂。
        - id: ch01-b141
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: 王后陛下，愿您万寿无疆！
        - id: ch01-b142
          speaker: narrator
          text: >-
            一位仿佛从华美梦境中走出来的夫人从宝座上俯身，亲手扶起安西娅。她周身闪耀着黄金、白银和珠宝，雪白的面纱一层层从身上飘垂下来，看起来就像柔软洁白的积雪。
        - id: ch01-b143
          speaker: queen
          text: >-
            别怕，我真高兴你们来了！太阳永不落下的国度！见到你们太好了。我刚才简直无聊得快受不了啦！
          emotion: happy
        - id: ch01-b144
          speaker: narrator
          text: 安西娅身后，西里尔仍跪在地上。他凑近同样恭恭敬敬的罗伯特，悄悄提醒他。
        - id: ch01-b145
          speaker: cyril
          text: >-
            鲍勃，先别告诉小豹子，惹她担心也没用。可是咱们没有问简的住址，赛米德还跟她在一起。
        - id: ch01-b146
          speaker: robert
          text: 没关系，护符随时能把他们带到这里。赛米德亲口说的。
        - id: ch01-b147
          speaker: cyril
          text: >-
            哦，对，我们当然什么事也没有。是啊，一点事都没有！只要护符在咱们手里就好了。
        - id: ch01-b148
          speaker: narrator
