  chapters:
    - id: ch01
      title: THE WAY TO BABYLON
      blocks:
        - id: ch01-b01
          speaker: jane
          text: How many miles to Babylon? Three score and ten! Can I get there by candlelight? Yes, and back again!
        - id: ch01-b02
          speaker: narrator
          text: Jane sang to her doll as she rocked it inside the little house she had built. The dining table made the roof. Tablecloths and antimacassars hung around it for walls, held in place by books along the table edge.
        - id: ch01-b03
          speaker: narrator
          text: The others had been enjoying the dangerous delights of indoor tobogganing. You do it with the largest, best tea tray and the surface of the stair carpet. The finest time is when the stair rods are being cleaned and only the nails at the top hold the carpet in place. It is one of the five or six truly splendid games that grown-ups treat most unfairly. Old Nurse was a brick in many ways, but grown-up enough to stop them long before they had enjoyed half as much as they wanted. She took away the tray, and the disappointed party came into the sitting room determined not to be pleased if they could help it.
        - id: ch01-b04
          speaker: cyril
          text: What a beastly mess!
        - id: ch01-b05
          speaker: robert
          text: Oh, do stop singing, Jane!
        - id: ch01-b06
          speaker: anthea
          text: Couldn't you sing something else? I'm thoroughly tired of that one.
        - id: ch01-b07
          speaker: narrator
          text: Rain had spoiled every plan for seeing the sights of London that cost nothing. Besides, all four children had spent the morning thinking about the day before. Jane had raised the charm, it had grown into an arch, and they had walked straight from the present day and Regent's Park into Egypt eight thousand years ago. The memory was still terribly fresh and frightening. Each child hoped no one would suggest another trip into the past. One adventure like that felt quite enough for at least a week. But each also worried that the others might notice the fear. Cyril truly was not a coward, and soon he began to feel it would be especially unpleasant if he had to think himself one.
        - id: ch01-b08
          speaker: cyril
          text: Jane, come out a moment. We ought to talk about the charm, anyway.
        - id: ch01-b09
          speaker: robert
          text: Oh, if that's all.
        - id: ch01-b10
          speaker: narrator
          text: Jane wriggled out to the front of her house and sat down. She felt for the charm to make sure it was still around her neck. Robert's rude tone made Cyril say much more than he had meant to.
        - id: ch01-b11
          speaker: cyril
          text: It isn't all. We ought to search for the other half of the Amulet. What's the point of owning a first-rate charm if we leave it idle in the stable, eating its head off?
        - id: ch01-b12
          speaker: robert
          text: I'm ready for anything, of course. Only the girls don't seem very keen today.
        - id: ch01-b13
          speaker: anthea
          text: I am keen. If you think I'm frightened, I'm not.
        - id: ch01-b14
          speaker: jane
          text: Well, I am. I hated it, and I won't go back there for anything.
          emotion: fearful
        - id: ch01-b15
          speaker: cyril
          text: We wouldn't go back there, silly. We'd go somewhere else.
        - id: ch01-b16
          speaker: jane
          text: Yes, somewhere full of lions and tigers, most likely.
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: Jane's fear made the others suddenly feel brave. They all declared that they ought to go.
        - id: ch01-b18
          speaker: anthea
          text: It would be terribly ungrateful to the Psammead if we didn't.
        - id: ch01-b19
          speaker: narrator
          text: Jane sprang up in desperation.
        - id: ch01-b20
          speaker: jane
          text: I won't! I won't, I won't, I won't! If you force me, I'll scream and tell Nurse. I'll make her burn the charm in the kitchen fire. So there!
          emotion: fearful
        - id: ch01-b21
          speaker: narrator
          text: You can imagine how furious everyone was with Jane for admitting the very fear they had all felt that morning. The same thought rose in every mind. No one could say it was their fault now. At once, they began showing Jane how angry they were and how completely the fault belonged to her. Blaming her made them feel wonderfully brave.
        - id: ch01-b22
          speaker: robert
          text: Tell-tale tit, its tongue shall be split, and all the dogs in our town shall have a little bit.
        - id: ch01-b23
          speaker: cyril
          text: This is what always happens when girls are involved.
        - id: ch01-b24
          speaker: anthea
          text: Well, I'm not frightened, even if I am a girl.
        - id: ch01-b25
          speaker: narrator
          text: Cyril's cold disapproval was crueler than Robert's rhyme. But Anthea's words hurt most of all, because Anthea was nearly always kind. Jane picked up her doll and faced them with what people sometimes call the courage of despair, the courage that comes when there is nothing left to lose.
        - id: ch01-b26
          speaker: jane
          text: I don't care. I won't go, and that's that! It's silly to visit places when you don't want to and don't know what they'll be like. Laugh as much as you please. You're beasts, and I hate every one of you!
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: She went out and slammed the door. The others could not look at one another, and none of them felt so brave now. Cyril picked up a book, but the words would not interest him. Robert kicked a chair leg without thinking. His feet always had a great deal to say when he was upset. Anthea folded the end of the tablecloth again and again. She seemed deeply concerned with making every pleat exactly the same size. At last, the sound of Jane's sobs died away.
        - id: ch01-b28
          speaker: anthea
          text: Oh, let's make peace with poor little Pussy. She is the youngest.
        - id: ch01-b29
          speaker: robert
          text: She called us beasts.
        - id: ch01-b30
          speaker: narrator
          text: He gave the chair another kick.
        - id: ch01-b31
          speaker: cyril
          text: We did start it, you know. Or Robert did, at least.
        - id: ch01-b32
          speaker: robert
          text: If that's what you mean, I'm not saying sorry.
        - id: ch01-b33
          speaker: narrator
          text: His next kick cracked the chair leg.
        - id: ch01-b34
          speaker: anthea
          text: Oh, please, let's do it. There are three of us against one, and Mother hates it when we quarrel. Come on. I'll apologize first, though I hardly said anything.
        - id: ch01-b35
          speaker: cyril
          text: All right. Let's get it over with. Hi, Pussy!
        - id: ch01-b36
          speaker: narrator
          text: Far up the stairs, Jane's voice answered. She was still crying, but she sang defiantly through every sniff.
        - id: ch01-b37
          speaker: jane
          text: How many miles to Babylon? Three score and ten! Can I get there by candlelight? Yes, and back again!
        - id: ch01-b38
          speaker: narrator
          text: This was trying to listen to, because the song was clearly meant to annoy them. Anthea refused to give herself time to think about that. She led the way upstairs, taking three steps at a time, and bounded up to Jane's level. Jane sat on the very top step, thumping her doll in time with the song she was trying to sing.
        - id: ch01-b39
          speaker: anthea
          text: Pussy, let's call it peace. We're sorry, if you are.
        - id: ch01-b40
          speaker: narrator
          text: That was enough. There was no need to finish the sentence. They all gave Jane the kiss of peace, a ceremony she was entitled to as the youngest. The quarrel was over. Then Anthea offered a special apology of her own.
        - id: ch01-b41
          speaker: anthea
          text: I'm sorry I behaved like a pig, Pussy dear. The truth is, deep down, I don't much want to go into the past again either. But if we never go, we'll never find the Amulet. Just think what it would mean to bring Father, Mother, and the Lamb safely home. We have to go. We can wait a day or two, if you like, until you feel braver.
        - id: ch01-b42
          speaker: robert
          text: Raw meat makes even cowards brave. Tartars eat cranberries too, and they're frighteningly brave. Cranberries only come at Christmas, I suppose, but I could ask Nurse to leave your chop very raw.
        - id: ch01-b43
          speaker: narrator
          text: Robert meant this to show there were no hard feelings. Jane hated underdone meat.
        - id: ch01-b44
          speaker: jane
          text: I think I can be brave without raw meat. I'll try.
        - id: ch01-b45
          speaker: narrator
          text: Just then, the learned gentleman opened his door and looked out.
        - id: ch01-b46
          speaker: learned_gentleman
          text: Excuse me. Did I hear a familiar word just now? Were you singing an old ballad about Babylon?
        - id: ch01-b47
          speaker: robert
          text: Not exactly. Jane was singing "How Many Miles," but I shouldn't think you heard the words over all the...
        - id: ch01-b48
          speaker: narrator
          text: Robert had been about to mention Jane's sniffing, but Anthea pinched him just in time.
        - id: ch01-b49
          speaker: learned_gentleman
          text: I did not catch every word. Would you recite it for me?
        - id: ch01-b50
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: How many miles to Babylon? Three score and ten! Can I get there by candlelight? Yes, and back again!
        - id: ch01-b51
          speaker: learned_gentleman
          text: I wish one truly could.
          emotion: sad
        - id: ch01-b52
          speaker: jane
          text: Can't you?
        - id: ch01-b53
          speaker: learned_gentleman
          text: Babylon has fallen. Once it was a great and beautiful city, a center of learning and art. Now it is nothing but ruins, buried so deeply that people cannot even agree where it stood.
          emotion: sad
        - id: ch01-b54
          speaker: narrator
          text: He leaned against the banisters, gazing far away. It seemed as if the staircase window no longer showed London at all. His eyes appeared to look through it into the splendor and glory of ancient Babylon.
        - id: ch01-b55
          speaker: cyril
          text: You remember our charm, the one with the name you taught us to pronounce?
        - id: ch01-b56
          speaker: learned_gentleman
          text: Yes!
        - id: ch01-b57
          speaker: cyril
          text: Do you think it might once have been in Babylon?
        - id: ch01-b58
          speaker: learned_gentleman
          text: Quite possibly. Charms like it have been found in very early Egyptian tombs, but no one has proved they truly began in Egypt. They may have been brought there from Asia. Even if yours was made in Egypt, a friendly embassy might have carried it to Babylon. Or a Babylonian army might have taken it as a spoil of war and brought it home after a campaign in Egypt. The inscription may be much newer than the charm itself. Oh yes, it is a pleasant thought that such a splendid piece once belonged among the people and buildings of Babylon.
        - id: ch01-b59
          speaker: narrator
          text: The children exchanged glances. Jane understood what all of them were wondering because she knew her own fears so well.
        - id: ch01-b60
          speaker: jane
          text: Were the people of Babylon savages? Were they always fighting and throwing things?
        - id: ch01-b61
          speaker: learned_gentleman
          text: They were certainly gentler than the Assyrians, and they were not savages at all. They had reached a very advanced level of culture. The learned gentleman saw that his audience was doubtful, so he put it more plainly. They made beautiful statues and jewelry, and they built splendid palaces. They were learned too. They had glorious libraries and tall towers built for studying astrology and astronomy.
        - id: ch01-b62
          speaker: robert
          text: What does that mean?
        - id: ch01-b63
          speaker: learned_gentleman
          text: They watched the stars and told fortunes. They also had temples and beautiful hanging gardens.
        - id: ch01-b64
          speaker: jane
          text: I'll go to Babylon, if everyone wants to.
        - id: ch01-b65
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: Done!
        - id: ch01-b66
          speaker: narrator
          text: They answered before Jane could change her mind. The learned gentleman smiled sadly.
        - id: ch01-b67
          speaker: learned_gentleman
          text: When one is young, dreams can carry one very far. I hope you have a jolly game.
        - id: ch01-b68
          speaker: narrator
          text: He sighed again. Then he made a great effort to sound brisk and cheerful over the word "jolly." When he had wished them a good game, he went back into his room and closed the door.
        - id: ch01-b69
          speaker: cyril
          text: He said "jolly" as if it belonged to a foreign language. Come on. Let's fetch the Psammead and leave now. Babylon sounds like a frightfully jolly place to visit.
        - id: ch01-b70
          speaker: narrator
          text: They woke the Psammead and put it into its bass bag with a waterproof sheet, in case Babylon had bad weather. It was very cross, but said Babylon was as good as anywhere else.
        - id: ch01-b71
          speaker: psammead
          text: The sand is good around there.
        - id: ch01-b72
          speaker: narrator
          text: Jane raised the charm.
        - id: ch01-b73
          speaker: cyril
          text: We want to go to Babylon and search for the missing part of you. Please let us pass through you and go there.
        - id: ch01-b74
          speaker: jane
          text: Please set us down outside the city. Then we won't have to enter if we don't like it.
        - id: ch01-b75
          speaker: psammead
          text: Don't take all day about it.
        - id: ch01-b76
          speaker: narrator
          text: Anthea quickly spoke the word of power. Without it, the charm could do nothing.
        - id: ch01-b77
          speaker: anthea
          text: Ur-Hekau-Setcheh!
        - id: ch01-b78
          speaker: narrator
          text: As Anthea spoke, the charm stretched into an arch so tall that its top nearly touched the bedroom ceiling. On their side of it stood the painted chest of drawers, the Kidderminster carpet, and the washstand with its willow-pattern jug, carefully repaired with rivets. There were the faded curtains and the dim light of a wet day indoors. Through the arch, soft green leaves and white blossoms gleamed. The children stepped toward them quite happily. Even Jane saw that this place did not look full of lions. Her hand scarcely shook as she held the charm until the others passed through. Then she slipped after them and hung it around her neck when it grew small again.
        - id: ch01-b79
          speaker: narrator
          text: They stood beneath a fruit tree covered in green leaves and white flowers. All around them stretched an orchard of trees just like it, every one green with leaves and white with bloom. Crocuses, lilies, and unfamiliar blue flowers grew among the long grass beneath their feet. Thrushes and blackbirds sang in the branches overhead. Somewhere nearby, a pigeon cooed softly into the green stillness of the orchard.
        - id: ch01-b80
          speaker: anthea
          text: Oh, it's perfectly lovely! It feels just like home, like England, only everything is bluer and whiter and greener, and the flowers are larger.
          emotion: happy
        - id: ch01-b81
          speaker: narrator
          text: The boys agreed that it was fairly decent. Even Jane admitted that it looked very pretty.
        - id: ch01-b82
          speaker: anthea
          text: I'm sure there is nothing here to frighten us.
        - id: ch01-b83
          speaker: jane
          text: I don't know. Fruit trees would keep growing even while people killed each other. And I didn't like what the learned gentleman said about hanging gardens. Perhaps they make gardens specially for hanging people. I hope this isn't one.
          emotion: fearful
        - id: ch01-b84
          speaker: cyril
          text: Of course it isn't. Hanging gardens are gardens hung up between houses on chains, like trays. At least, I think they are. Come on. Let's get somewhere.
        - id: ch01-b85
          speaker: narrator
          text: They walked on through the cool grass. Trees filled the view in every direction, one orchard stretching beyond another. A narrow stream of clear water separated the first two. They jumped across it and kept going. Cyril was fond of gardening, by which I mean that he enjoyed watching the gardener work. Now that little knowledge allowed him to command the respect of the others. He named tree after tree as they passed. There were nut trees, almond trees, apricots, and figs with broad leaves spread like five-fingered hands. Again and again, they reached another clear brook and had to cross it.
        - id: ch01-b86
          speaker: anthea
          text: It's like walking between the squares in Through the Looking-Glass.
        - id: ch01-b87
          speaker: narrator
          text: At last, they reached a different kind of orchard with a low building in one corner.
        - id: ch01-b88
          speaker: cyril
          text: These are vines, so this must be a vineyard. I shouldn't be surprised if that building has a wine press inside.
        - id: ch01-b89
          speaker: narrator
          text: At last, they left the orchards and found a road. It was very rough and quite unlike the roads they knew at home. Cypress and acacia trees lined it. Beside them grew a hedge of tamarisk, like the hedges on the road between Nice and Cannes. If you have only traveled as far as Littlehampton, you may have seen the same kind there.
        - id: ch01-b90
          speaker: narrator
          text: Ahead, a great mass of buildings came into view. Houses of wood and stone stood here and there among green orchards. Beyond them, a vast wall glowed red in the early morning sun. It stood more than half as high as St. Paul's. Enormous gates had been set into it, shining like gold where the rising sunlight struck them. A solid square tower guarded each side of every gate. The towers pushed outward from the wall and rose above it. More towers and houses shone beyond, bright with color and gold. To the left, a great steel-blue river swirled past. Through a gap in the trees, the children saw it flow out of the city beneath a mighty arch in the wall.
        - id: ch01-b91
          speaker: cyril
          text: Those feathery trees beside the water are palms.
        - id: ch01-b92
          speaker: robert
          text: Oh yes, you know everything. Then what's that gray-green stuff over there, where the land is flat and sandy?
        - id: ch01-b93
          speaker: cyril
          text: Fine. I won't tell you anything. I only thought you might like to recognize a palm tree next time.
        - id: ch01-b94
          speaker: anthea
          text: Look! The gates are opening!
          emotion: surprised
        - id: ch01-b95
          speaker: narrator
          text: The great gates swung apart with a clang of bronze. At once, a dozen or more people came out and started along the road. All four children ducked behind the tamarisk hedge.
        - id: ch01-b96
          speaker: jane
          text: I don't like the sound of those gates. Imagine being inside when they close. You could never escape.
          emotion: fearful
        - id: ch01-b97
          speaker: psammead
          text: You have your own arch to escape through. Stop behaving so much like a girl. If I were you, I would march straight into the city and ask to see the king.
        - id: ch01-b98
          speaker: narrator
          text: The idea was simple and grand at once, and everyone liked it. The people on the road wore only long, plain garments of blue or yellow. From this, the children felt certain they must be workers. Once the workers had passed, the four came out from behind the tamarisks and marched boldly toward the bronze gate between the towers. Above that gate, the wall was so enormously thick that the arch formed a whole tunnel.
        - id: ch01-b99
          speaker: cyril
          text: Courage. Step out properly. Sneaking past won't help. Be bold!
        - id: ch01-b100
          speaker: narrator
          text: Robert suddenly began singing "The British Grenadiers," and they marched to its quick beat toward the gates of Babylon.
        - id: ch01-b101
          speaker: robert
          text: Some talk of Alexander, and some of Hercules, of Hector and Lysander, and such great names as these. But of all the gallant heroes...
        - id: ch01-b102
          speaker: narrator
          text: At the very threshold, two men in shining armor crossed their spears and blocked the way.
        - id: ch01-b103
          speakers: [gatekeeper, guard]
          ensemble: duo
          text: Who goes there?
        - id: ch01-b104
          speaker: narrator
          text: You may wonder how they understood those men. The children could always understand the language of any place they happened to visit, and the people there could understand the children in return. I think I have explained the reason before. If I have not, there is no time to stop and explain it now.
        - id: ch01-b105
          speaker: cyril
          text: We have come a very long way, from the Empire where the sun never sets. We want to see your king.
        - id: ch01-b106
          speaker: anthea
          text: If it is convenient.
        - id: ch01-b107
          speaker: gatekeeper
          text: The King, may he live forever, has gone to bring home his fourteenth wife. Where on earth are you from, if you don't know that?
        - id: ch01-b108
          speaker: anthea
          text: Then we would like to see the Queen.
        - id: ch01-b109
          speaker: gatekeeper
          text: The Queen, may she live forever, receives visitors today three hours after sunrise.
        - id: ch01-b110
          speaker: cyril
          text: What are we supposed to do until those three hours are over?
        - id: ch01-b111
          speaker: narrator
          text: The gatekeeper seemed neither to know nor to care what they should do. He showed less interest in these four strangely dressed children from a distant empire than they could have believed possible. But the second man, who had crossed his spear with the gatekeeper's to stop them, was more human.
        - id: ch01-b112
          speaker: guard
          text: Let them come in and look around. I'll wager my best sword they have never seen anything that comes close to our little village.
        - id: ch01-b113
          speaker: narrator
          text: He said "little village" the way someone might call the Atlantic Ocean a herring pond. The gatekeeper still hesitated.
        - id: ch01-b114
          speaker: guard
          text: They're only children. I have children of my own. Let me leave for a few minutes, Captain. I'll take them home and see whether my good woman can find them something less strange to wear. Then they can walk around without a crowd following them. May I go?
        - id: ch01-b115
          speaker: gatekeeper
          text: Yes, if you wish. Just don't take all day.
        - id: ch01-b116
          speaker: narrator
          text: The guard led them through the deep, shadowy arch and into the city. Babylon was nothing like London. Everything in London seemed patched together from odd bits and pieces. These houses looked as though the people who built them all admired the same kinds of things. They were not identical. Every house was rather square, but they came in many sizes and carried every sort of decoration. Some blazed with paintings in bright colors, while others bore patterns of black and silver. There were terraces and gardens, balconies and open spaces where trees grew.
        - id: ch01-b117
          speaker: narrator
          text: Their guide turned into a back street and brought them to a small house. At its door, a kind-looking woman sat spinning wool. Behind her lay a room so dark that the children could scarcely see inside.
        - id: ch01-b118
          speaker: guard
          text: Please lend each child a mantle. They can see the city in those until the Queen begins her audience. Leave the wool for a while and show them around, if you like. I must return to my post.
        - id: ch01-b119
          speaker: narrator
          text: The woman did exactly as the guard had asked. She gave each child a fringed mantle, then left her spinning and led all four through the busy streets of Babylon. Oh, how I wish there were time to tell you everything they saw. It was all wonderfully unlike anything you have ever seen. Every house dazzled with color, and many were covered in pictures. At some doors, great creatures carved from stone stood guard on either side. The people looked just as bright. There were no black frock coats and tall hats. No one wore dingy coats and skirts cut from practical, ugly cloth that was guaranteed to last. Everywhere the children looked, clothes shone in blue, scarlet, green, and gold.
        - id: ch01-b120
          speaker: narrator
          text: The market was brighter than you could imagine anything could be. Its stalls offered everything anyone might want, and a great many things that would become your master if you wanted them here and now. Pineapples and peaches lay in heaps. Pottery and glass stood in beautiful shapes and glorious colors. Other stalls glittered with necklaces, clasps, bracelets, and brooches. There were woven fabrics, soft furs, and linen covered in embroidery. The children had never seen half so many beautiful things together, not even at Liberty's.
        - id: ch01-b121
          speaker: babylonian_woman
          text: It is nearly time. We should start toward the palace. It is wise to arrive early.
        - id: ch01-b122
          speaker: narrator
          text: When they reached the palace, it was more splendid than everything else. Gold, silver, black, white, and brilliant colors covered it like magnificent embroidery. Broad marble stairways rose flight after flight toward the entrance. Along their edges stood statues twenty times taller than a man. Some were winged men whose feathers overlapped like chain armor. Some had hawks' heads. Others were winged men with the heads of dogs. Stone figures of great kings stood among them.
        - id: ch01-b123
          speaker: narrator
          text: Terraces lay between the flights of stairs, and fountains played upon them. The Queen's Guard stood two by two all the way up. They wore white and scarlet, with armor that shone like gold. A great body of guards gathered around the vast palace door itself. Above and behind them, the building glittered in the noon sun like a peacock so radiant it could not possibly be real.
        - id: ch01-b124
          speaker: narrator
          text: Every kind of person climbed the steps to ask for an audience with the Queen. Rich ladies wore embroidered gowns with rows of fringed flounces. Poor people came in plain and simple clothes. Fashionable men had carefully oiled and curled their beards. Cyril, Robert, Anthea, and Jane went upward with the crowd.
        - id: ch01-b125
          speaker: narrator
          text: When they reached the palace gate, the Psammead cautiously pushed one long eye out of the basket. It kept the rest of itself safely hidden while it whispered to Jane.
        - id: ch01-b126
          speaker: psammead
          text: I cannot be bothered with queens. I shall go home with this woman. Ask her to find me some sand.
        - id: ch01-b127
          speaker: jane
          text: Oh, please don't leave us!
          emotion: fearful
        - id: ch01-b128
          speaker: narrator
          text: The woman was teaching Anthea the last rules of court manners, so she did not hear Jane.
        - id: ch01-b129
          speaker: psammead
          text: Don't be such a little muff. There is no use carrying a charm if you never use it. If you need me, speak the name of power and ask the charm to bring me to you.
          emotion: angry
        - id: ch01-b130
          speaker: jane
          text: I would rather go with you.
        - id: ch01-b131
          speaker: narrator
          text: It was the most surprising thing Jane had ever said. Everyone stared with open mouths. Anthea peeped into the basket and saw that the Psammead's mouth had fallen open widest of all.
        - id: ch01-b132
          speaker: jane
          text: You needn't all gape at me. I don't want to be bothered with queens either. And wherever the Psammead goes, I know it will make quite sure the place is safe.
        - id: ch01-b133
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: That is certainly true.
        - id: ch01-b134
          speaker: narrator
          text: They had all noticed that the Psammead knew very well how to look after itself. Jane turned to the woman.
        - id: ch01-b135
          speaker: jane
          text: Will you take me home with you and let me play with your little girls until the others finish visiting the Queen?
        - id: ch01-b136
          speaker: babylonian_woman
          text: Of course I will, little heart!
        - id: ch01-b137
          speaker: narrator
          text: Anthea quickly stroked the Psammead and hugged Jane. Then Jane took the woman's hand. She trotted contentedly away, carrying the Psammead's bag beneath her other arm. The three children remained where they were and watched her go. They did not turn back toward the palace until Jane, the woman, and the basket had vanished completely into the many-colored crowd.
        - id: ch01-b138
          speaker: anthea
          text: Let's ask the porter to keep our Babylonian overcoats safe.
        - id: ch01-b139
          speaker: narrator
          text: They removed the garments the woman had lent them and gave them to the porter. In their own English frocks and coats, hats and boots, they stood out sharply among all the splendid people jostling forward to ask the Queen for an audience.
        - id: ch01-b140
          speaker: cyril
          text: We have come to see the Queen. We are from the distant Empire where the sun never sets!
        - id: ch01-b141
          speaker: narrator
          text: A murmur of surprise rippled through the crowd, followed by a thrill of excitement. The door porter spoke to a black man. That man spoke to someone else. Then came a pause full of whispering and waiting. At last, a large man with a clean-shaven face beckoned to the children from the top of a flight of red marble steps.
        - id: ch01-b142
          speaker: narrator
          text: The children climbed toward him. Robert's boots clattered more loudly than usual because he was so nervous. A door swung open, and a curtain drew back. Two lines of people in gorgeous clothes bowed on either side, making a long path between them toward the steps of the throne. The children hurried down that path. Before they reached the end, a very sweet and kindly voice called from the throne.
        - id: ch01-b143
          speaker: queen
          text: Three children from the country where the sun never sets! Let them come closer without fear.
        - id: ch01-b144
          speaker: narrator
          text: A moment later, all three knelt at the foot of the throne.
        - id: ch01-b145
          speakers: [cyril, robert, anthea]
          ensemble: chorus
          text: O Queen, may you live forever!
        - id: ch01-b146
          speaker: narrator
          text: They said it exactly as the woman had taught them. The Queen looked like a magnificent lady from a dream, wrapped in gold, silver, jewels, and snowy veils. She raised Anthea to her feet.
        - id: ch01-b147
          speaker: queen
          text: Don't be afraid. I am truly delighted you have come! The land where the sun never sets! How wonderful to meet you. I was becoming dreadfully bored.
          emotion: happy
        - id: ch01-b148
          speaker: narrator
          text: Behind Anthea, Cyril leaned toward Robert, who still knelt respectfully.
        - id: ch01-b149
          speaker: cyril
          text: Bobs, don't tell Panther. It would only upset her. But we never asked for Jane's address, and the Psammead is with her.
        - id: ch01-b150
          speaker: robert
          text: The charm can bring them to us whenever we want. The Psammead said so.
        - id: ch01-b151
          speaker: cyril
          text: Oh yes, we're perfectly safe, aren't we? Of course we are, if only we had the charm.
        - id: ch01-b152
          speaker: narrator
          text: Then Robert understood.
        - id: ch01-b153
          speaker: robert
          text: Crikey!
          emotion: surprised
        - id: ch01-b154
          speaker: cyril
          text: Jane has the charm around her neck, you silly cuckoo.
        - id: ch01-b155
          speaker: robert
          text: Crikey!
          emotion: surprised
