        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    learned_gentleman:
      display_name: 学者先生
      tts:
        delivery: 温文拘谨，学究气中带着真诚善意
        timbre: 清瘦柔和的成年男声
        pace: 舒缓
        pitch: 中低
    old_nurse:
      display_name: 老保姆
      tts:
        delivery: 务实爽快，絮叨里满是照料孩子的熟练
        timbre: 温厚结实的老年女声
        pace: 中等
        pitch: 中低
    ancient_girl:
      display_name: 远古女孩
      tts:
        delivery: 质朴直接，戒备消退后热情坦率
        timbre: 清脆而略显粗粝的少女声
        pace: 中等
        pitch: 中高
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 好奇惊叹，直率热切
        timbre: 明亮的成年声
        pace: 中等偏快
        pitch: 中
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 好奇惊叹，直率热切
        timbre: 清脆的成年声
        pace: 中等偏快
        pitch: 中高
    villager_3:
      display_name: 村民丙
      tts:
        delivery: 好奇惊叹，直率热切
        timbre: 粗厚的成年声
        pace: 中等
        pitch: 中低
    villager_4:
      display_name: 村民丁
      tts:
        delivery: 好奇惊叹，直率热切
        timbre: 轻快的年轻声
        pace: 中等偏快
        pitch: 高
    messenger:
      display_name: 报信人
      tts:
        delivery: 急迫有力，气息短促
        timbre: 粗哑的成年男声
        pace: 快
        pitch: 中低
  chapters:
    - id: ch01
      title: 出发去过去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            第二天一早，安西娅说服老保姆，让她把“可怜的学者先生”的早餐送上楼。先生起初没有认出她，认出来以后，倒像是有一点高兴。
        - id: ch01-b02
          speaker: anthea
          text: 您看，我把护身符挂在脖子上了。我正照您说的，好好保管它呢。
        - id: ch01-b03
          speaker: learned_gentleman
          text: 很好。昨晚你们玩得开心吗？
        - id: ch01-b04
          speaker: anthea
          text: >-
            您先答应我，趁早餐没凉就吃掉，好吗？我们昨晚玩得可痛快了。护身符先让四周一片漆黑，后来又亮起绿光，接着竟然开口说话。真希望您也能听见，那声音可爱极了！它说另一半遗失在过去，所以我们当然得去过去找。
        - id: ch01-b05
          speaker: narrator
          text: 学者先生两手揉着头发，忧心忡忡地看着她。
        - id: ch01-b06
          speaker: learned_gentleman
          text: >-
            大概很自然吧，年轻人的想象力之类的。可总得有人……是谁告诉你们，护身符少了一半？
        - id: ch01-b07
          speaker: anthea
          text: >-
            我不能说。您那么好心，告诉我们力量之名，我还瞒着您，听起来的确很没礼貌。可我真的不许对任何人提起那个……告诉我这件事的人。您可别忘了吃早餐。
        - id: ch01-b08
          speaker: narrator
          text: 先生勉强笑了笑，又皱起眉。不是生气，是碰上难题时的那种皱眉。
        - id: ch01-b09
          speaker: learned_gentleman
          text: 谢谢你。往后只要路过，你随时都可以进来看看我。至少……
        - id: ch01-b10
          speaker: anthea
          text: 我会来的。再见。凡是准许我说的事，我都会告诉您。
        - id: ch01-b11
          speaker: narrator
          text: >-
            学者先生很少碰见跟孩子有关的奇事，不禁纳闷，难道所有孩子都是这样？他足足想了五分钟，才重新埋头写那部大作《阿蒙·拉祭司的秘密仪式》的第五十二章。
        - id: ch01-b12
          speaker: narrator
          text: >-
            孩子们想到要穿过护身符，走进过去，心里当然慌得很。万一留在那里，再也回不来呢？谁也不喜欢这个念头。可是没有一个人敢提议放弃。那句“咱们别去了吧”，虽然胆怯，却再自然不过。可要是谁真把它说出口，其余三个准会一齐笑他胆小，哪怕他们自己心里也怕得厉害。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他们得安排在外面待上一整天。谁也没有理由相信，开饭铃能一路响到过去。最好也别勾起老保姆的好奇心，因为无论说什么，哪怕把真相全说出来，她也不会满意。孩子们倒很得意，觉得自己已经把护身符和赛米德讲的时间、空间，还有诸如此类的道理，全都听懂了。他们确信老保姆连一个字也不可能明白，于是只问能不能带午饭到摄政公园吃。老保姆听出这意味着冷羊肉和西红柿，很爽快地答应了。
        - id: ch01-b14
          speaker: old_nurse
          text: >-
            想吃什么小面包、海绵蛋糕，你们自己买吧。可不许买果酱馅饼。那东西本来就容易弄脏衣服，何况你们又没有叉子和盘子，吃完还找不到地方洗手洗脸。
        - id: ch01-b15
          speaker: narrator
          text: >-
            老保姆给了西里尔一先令，孩子们便出发了。他们特意绕到托特纳姆法院路，买了一块防水布。如果到了过去，那边刚好下雨，就拿它盖住赛米德。赛米德要是淋湿，几乎必死无疑。
        - id: ch01-b16
          speaker: narrator
          text: >-
            阳光灿烂，连伦敦也显得漂亮起来。街边的女人守着装得满满的大篮子卖花，安西娅买了四朵，给自己和另外三个孩子一人一朵。红玫瑰闻起来全是夏天的味道。每到圣诞节，你总会拼命想念这种花，因为那时能买到的只有槲寄生，从颜色到气味都淡得没有精神，还有凑近一闻就扎鼻子的冬青。四个孩子把玫瑰插进扣眼，很快就在摄政公园的草地上坐了下来。头顶那些树若长在乡下，叶子本该干干净净，绿得清亮。可在伦敦，它们蒙着尘，泛着黄，边缘也焦褐了。
        - id: ch01-b17
          speaker: anthea
          text: >-
            这件事非做不可。年纪最大的人得先过去，所以简，你要留到最后。穿过去的时候必须一直抓住护身符，你明白吧，小猫咪？
        - id: ch01-b18
          speaker: jane
          text: 我真不想最后一个走。
        - id: ch01-b19
          speaker: anthea
          text: 你可以抱着赛米德。只要它肯让你抱。
        - id: ch01-b20
          speaker: psammead
          text: 谁抱我都行，只要别把我摔下去。我最受不了被人摔。
        - id: ch01-b21
          speaker: narrator
          text: >-
            简双手发抖，把装着赛米德的鱼篮夹在胳膊下，又把护身符的长绳挂到脖子上。大家一同站起。简伸直手臂举起护身符，西里尔郑重念出了力量之名。
        - id: ch01-b22
          speaker: narrator
          text: >-
            护身符立刻长高、变宽。简只要伸直手臂，就像正抓着一座形状古怪的巨大红拱门边缘。门洞不大，却足够让西里尔通过。拱门四周和后面，还是摄政公园褪色的树木与踩坏的草地，几个衣衫褴褛的小孩正在玩“玫瑰花环”。可透过门洞望去，里面只有蓝、黄、红三色交织的灿烂光芒。西里尔深吸一口气，把两条腿绷得笔直，免得别人看出他的膝盖正不停发抖，几乎就要撞到一起。
        - id: ch01-b23
          speaker: cyril
          text: 我去啦！
        - id: ch01-b24
          speaker: narrator
          text: >-
            他跨进门洞，转眼消失。安西娅紧随其后。罗伯特走在第三个，按照安西娅的主意死死抓住简的袖子，把简也安全拖了过去。等四个人来到另一边，拱门不见了，摄政公园也不见了。只有护身符还留在简手里，并且缩回了原来的大小。新世界的光亮得叫人睁不开眼，大家只能眯眼、眨眼，不停揉着眼睛。趁这阵什么都看不清的工夫，安西娅摸到护身符，把它推进简的衣襟，免得出了差错。眼睛渐渐适应以后，孩子们才抬头环顾四周。头顶的天空蓝得不能再蓝，还不住地闪烁、辉映，耀眼得像家乡的大海被太阳照亮时一样。
    - id: ch02
      title: 尼罗河边
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他们站在低矮浓密的树林空地上，周围尽是树木和灌木，下面还长着纠缠成团、处处带刺的矮树丛。前方先是一道模样古怪的黑泥岸，接着是一条棕黄发亮的河，像一根长缎带伸向远方。河对岸又是晒干开裂的泥地，再过去则是一片绿褐相间的莽林。这里只有这块空地、一条通往这里的小路，还有河中那圈割下的芦苇，能看出人来过的痕迹。四个孩子彼此望了望。
        - id: ch02-b02
          speaker: robert
          text: 嚯，这才真叫换个地方透气！
        - id: ch02-b03
          speaker: narrator
          text: 空气热得超乎想象，连八月的伦敦也没有这么热。
        - id: ch02-b04
          speaker: cyril
          text: 真想知道这里是哪儿。有一条河，会是亚马孙河、台伯河，还是别的河？
        - id: ch02-b05
          speaker: psammead
          text: 这是尼罗河。
        - id: ch02-b06
          speaker: narrator
          text: 赛米德从鱼篮里探出头。得过地理奖的罗伯特马上有了答案。
        - id: ch02-b07
          speaker: robert
          text: 那这里就是埃及。
        - id: ch02-b08
          speaker: cyril
          text: 可我没看见鳄鱼。
        - id: ch02-b09
          speaker: narrator
          text: >-
            西里尔得过博物学奖。赛米德伸出毛茸茸的胳膊，指向水边一堆看似寻常的泥。
        - id: ch02-b10
          speaker: psammead
          text: 那你管它叫什么？
        - id: ch02-b11
          speaker: narrator
          text: >-
            那堆泥忽然滑进河里，活像一整片湿灰泥从泥瓦匠的抹子上溜下去。
        - id: ch02-b12
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 啊！
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: 河对岸的芦苇猛烈折断，一个庞然大物出现在黑泥岸前，活像大得吓人的青灰色鼻涕虫。
        - id: ch02-b14
          speaker: psammead
          text: 瞧，那边还有一匹河马！
        - id: ch02-b15
          speaker: cyril
          text: 是河马。不知为什么，它可比动物园里的那只真实多了，对不对？
        - id: ch02-b16
          speaker: jane
          text: 我很高兴它是在河对岸真实。
        - id: ch02-b17
          speaker: narrator
          text: >-
            背后的芦苇和树枝也劈啪响了起来。这可怕极了。来的可能是另一头河马，也可能是鳄鱼、狮子，几乎什么都有可能。
        - id: ch02-b18
          speaker: robert
          text: >-
            简，手别离开护身符。咱们得随时备好逃跑的办法。我敢肯定，在这种地方，什么事都可能落到咱们头上。
        - id: ch02-b19
          speaker: jane
          text: 我看是一头河马要落到咱们头上了，而且非常、非常大。
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: 大家都转过身，面对着危险传来的方向。
        - id: ch02-b21
          speaker: psammead
          text: 别做傻乎乎的小笨蛋。那不是河马，是个人。
        - id: ch02-b22
          speaker: narrator
          text: >-
            果然是个人。那是个年纪和安西娅差不多的女孩。她的头发又短又浅，皮肤被太阳晒成了褐色，可还是看得出，只要有机会不受日晒，原本也会很白。她几乎没穿什么衣服，当然有的是机会晒黑。四个英国孩子却把连衣裙、帽子、鞋子、长袜、外套、衣领，还有其余种种，全都穿得整整齐齐。他们简直羡慕死她了，无论他们自己还是我，都找不到足够的语言来形容这份羡慕。在这样的气候里，毫无疑问，她那身打扮才真正合适。
        - id: ch02-b23
          speaker: narrator
          text: >-
            女孩头顶一只红黑陶罐，没有发现缩在莽林边的孩子。她走向河边打水，嘴里一直用两个音哼着低沉忧郁的声调。安西娅忍不住想，也许她以为那是在唱歌。
        - id: ch02-b24
          speaker: narrator
          text: >-
            女孩装满水罐，把它放在河岸边，又蹚进水里，俯身来到芦苇围成的圈旁。她从圈里的水中捞起六条肥美的鱼，每捞出一条便立刻杀死，再用随身带着的长柳条穿起来。她把柳条打好结，挂到胳膊上，抱起水罐往回走，这才看见四个孩子。简和安西娅的白裙子衬着幽暗的树林，白得像雪。女孩尖叫一声，水罐掉了，鱼也散落在地。罐里的水泼过坚硬的泥面，淋在鱼身上，随后一点点流进深深的裂缝。
        - id: ch02-b25
          speaker: anthea
          text: 别怕，我们不会伤害你。
        - id: ch02-b26
          speaker: ancient_girl
          text: 你们是谁？
          emotion: fearful
        - id: ch02-b27
          speaker: narrator
          text: >-
            我索性一次说清楚，我才不费神解释为什么女孩听得懂安西娅，安西娅也听得懂女孩。就算我肯解释，你也听不明白，正如你弄不懂时间和空间只是思想的形式。随你爱怎么想吧。也许孩子们发现了人人都能明白的世界通用语，而聪明的学者们至今还没找到它。你早就知道，这几个孩子运气好得出奇。除了别的好运，他们或许也碰巧得到了这一份。又或许……算了，何必再追究？事实就是，在他们所有的冒险里，那些被我们叫作外语的糊涂发明，从没有给他们添过半点麻烦。他们总能听懂别人，别人也总能听懂他们。你若解释得了，尽管说来听听。我大概听得懂你的解释，虽说你绝不会听懂我的。
        - id: ch02-b28
          speaker: narrator
          text: 所以女孩一问“你们是谁”，大家马上都懂了。
        - id: ch02-b29
          speaker: anthea
          text: 我们也是孩子，跟你一样。别害怕。你能带我们去看看你住的地方吗？
        - id: ch02-b30
          speaker: narrator
          text: 简把脸凑进赛米德的篮子，嘴巴埋进它的毛里，小声发问。
        - id: ch02-b31
          speaker: jane
          text: 那里安全吗？他们不会吃我们吧？他们是吃人族吗？
          emotion: fearful
        - id: ch02-b32
          speaker: narrator
          text: 赛米德耸了耸浑身的毛，显得有些不耐烦。
        - id: ch02-b33
          speaker: psammead
          text: >-
            别让声音嗡嗡地钻进来，挠得我耳朵发痒。只要牢牢抓住护身符，你们随时来得及回摄政公园。
        - id: ch02-b34
          speaker: narrator
          text: >-
            陌生女孩仍在害怕得发抖。安西娅胳膊上恰好戴着一只手镯。那不过是件假装成银器的便宜货，只值七个半便士，上面坠着一颗绿松石蓝的玻璃心。手镯原本是菲茨罗伊街那所房子里的杂役女仆送给她的。安西娅把它摘了下来。
        - id: ch02-b35
          speaker: anthea
          text: >-
            这个送给你，证明我们不会伤害你。你收下它，我也就知道你不会伤害我们。
        - id: ch02-b36
          speaker: narrator
          text: 女孩伸出手。安西娅把手镯套上她的手腕，她的脸立刻被拥有它的喜悦照亮。
        - id: ch02-b37
          speaker: ancient_girl
          text: 跟我来吧。你家与我家之间已经结下和平。
          emotion: happy
        - id: ch02-b38
          speaker: narrator
          text: 女孩爱惜地望着手镯，捡起鱼和水罐，沿窄路带着他们往前走。
        - id: ch02-b39
          speaker: cyril
          text: 这才像回事！
        - id: ch02-b40
          speaker: narrator
          text: 西里尔在努力壮胆。罗伯特心里也远没有表现出来的那样勇敢。
        - id: ch02-b41
          speaker: robert
          text: >-
            没错，这才真正算冒险！因为是在过去，跟凤凰和飞毯闹出的那些事完全不同。
        - id: ch02-b42
          speaker: narrator
          text: >-
            金合欢树林和灌木丛足有半英里宽，大多长满刺，样子也不讨人喜欢。小路狭窄，林中昏暗。走了许久，前面终于有阳光穿过枝叶。
        - id: ch02-b43
          speaker: narrator
          text: >-
            一行人忽然走出树影，刺眼的日光一下扑了过来。眼前展开大片黄沙，其间散落着一堆堆灰色岩石。带刺的仙人掌从石缝里伸出来，那些叶片看着破旧，还落满沙尘，上面却开着深红和粉红的艳丽花朵。右边远处有一样东西，很像一道灰褐色树篱。树篱后升起蓝色炊烟，飘向更加湛蓝的天空。阳光照着这里的一切，晒得人几乎忍受不了身上的衣服。
        - id: ch02-b44
          speaker: ancient_girl
          text: 我就住在那里。
        - id: ch02-b45
          speaker: jane
          text: 除非你说那里没事，否则我不去。
        - id: ch02-b46
          speaker: narrator
          text: 赛米德本该被这份信任感动，可它似乎把这当成了怀疑。
        - id: ch02-b47
          speaker: psammead
          text: 你现在不去，我以后再也不帮你了。
          emotion: angry
        - id: ch02-b48
          speaker: anthea
          text: >-
            亲爱的简，别这样！想想父亲、母亲，还有我们大家都能得偿所愿。再说，我们随时都能回去。走吧！
        - id: ch02-b49
          speaker: cyril
          text: >-
            赛米德若不知道这里没危险，自己绝不会跟来。它本来就不算多么勇敢。来吧！
        - id: ch02-b50
          speaker: narrator
          text: 简终于同意继续往前走。
    - id: ch03
      title: 荆棘里的村庄
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们一路走近那道褐色围墙，才看清那根本不是墙，而是一道用一丛丛荆棘堆成的巨大树篱，大约八英尺高。
        - id: ch03-b02
          speaker: cyril
          text: 这道树篱是做什么的？
        - id: ch03-b03
          speaker: ancient_girl
          text: 挡住敌人和野兽。
        - id: ch03-b04
          speaker: cyril
          text: 我看它肯定挡得住。有些刺都跟我的脚一样长了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            树篱上开着一个缺口，女孩领他们穿了过去。再往前还有一道较矮的篱笆，同样用干枯的荆棘堆成，看起来又尖锐又凶狠。篱笆里面是一座由茅屋组成的村子。那里没有花园，也没有道路。木头、树枝和泥巴搭成的茅屋，东一间西一间随意散落着，屋顶铺着巨大的棕榈叶。每扇门都低得像狗窝入口。房屋之间没有小径，也没有街道，只有一片被无数双脚踩得又硬又平的黄沙。村子中央另有一道树篱，围住一块空地，看起来约有他们在卡姆登镇的自家花园那么大。
        - id: ch03-b06
          speaker: narrator
          text: 孩子们刚走进内层篱笆，几十个男人、女人和孩子就从茅屋内外涌出，把他们团团围住。女孩站到了四人身前。
        - id: ch03-b07
          speaker: ancient_girl
          text: >-
            他们是来自沙漠彼方的神奇孩子，带来了不可思议的礼物。我已经宣布，我们与他们结下和平。
        - id: ch03-b08
          speaker: narrator
          text: >-
            她伸出戴着劳瑟拱廊手镯的胳膊。四个孩子来自如今什么都吓不着人的伦敦，却从没见过这么多人同时露出这般惊讶的脸。村民拥上来，摸他们的衣服、鞋子、男孩外套的纽扣，还有女孩项链上的珊瑚珠。
        - id: ch03-b09
          speaker: anthea
          text: 西里尔，你快说点什么呀。
        - id: ch03-b10
          speaker: narrator
          text: >-
            西里尔想起一个可怕的日子。那天父亲去见律师，他只能在外间等着，手边除了《每日电讯报》，什么也没得读。于是他摆出报纸上的口气。
        - id: ch03-b11
          speaker: cyril
          text: >-
            我们来自一个太阳永不落下的世界。我们想要有尊严的和平。我们属于伟大的盎格鲁—撒克逊民族，也就是征服者的民族。不过，我们可不是来征服你们的。我们只想看看你们的房屋，还有这里的一切。之后我们会回去，把看到的事讲给别人听，让你们声名远扬。
        - id: ch03-b12
          speaker: narrator
          text: >-
            这番演说根本没能让人群退开。村民仍旧挤在孩子们身边，兴致勃勃地打量他们的衣服。安西娅猜，这些人从没见过织成的布。向来只能拿兽皮遮身的人看见布料，自然觉得又奇妙又陌生。现代衣物的针脚也让他们十分吃惊。不过他们自己准也会缝东西，因为那些像是首领的男人都穿着山羊皮或鹿皮短裤，腰间系着拧成绳的皮条，女人们则穿又长又窄的兽皮裙。这些人个子不高，头发颜色很浅，男女都剪得很短。眼睛还是蓝色的，在埃及见到这样的眼睛，总显得有些古怪。他们大多数像水手一样刺着花纹，只是手艺粗糙得多。
        - id: ch03-b13
          speakers: [villager_1, villager_2, villager_3, villager_4]
          ensemble: chorus
          text: 这是什么？这是什么？
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: 安西娅赶忙摘下简那条褶边花领，交给看起来最友善的女人。
        - id: ch03-b15
          speaker: anthea
          text: 拿去好好看吧。别再围着我们，我们自己有话要说。
        - id: ch03-b16
          speaker: narrator
          text: >-
            她用了平日没空耐心哄小弟弟听话时，那种不容置疑的口气，果然同样有效。孩子们终于可以单独待着，人群退到十二码外才停下，一边端详花边衣领，一边使劲说个不停。孩子们永远不会知道他们说了什么，却很清楚话题正是自己这四个陌生人。他们努力想着女孩许下的友善承诺，好让自己安心。当然，最叫人放心的还是想起护身符。他们在村子中央那块围地的阴影下坐到沙上，直到这时才第一次有机会看看四周，而不只是看一张张热切好奇的脸。
        - id: ch03-b17
          speaker: narrator
          text: >-
            他们这才留意到，女人们戴着由各色石珠串成的项链，项链下面还挂着形状稀奇古怪的坠饰。有些女人手腕上戴的不是珠子，而是象牙和燧石手镯。
        - id: ch03-b18
          speaker: robert
          text: 我说，要是留下来，我们能教他们多少东西啊！
        - id: ch03-b19
          speaker: cyril
          text: >-
            我猜他们也能教我们一些东西。看见刚才那个女人的燧石手镯了吗？就是收到衣领的那个。那一定很难做。我们总凑在一起说悄悄话，他们会起疑。我想知道他们怎么做这些东西。叫那个女孩带我们四处看看吧，同时还能想办法找护身符。不过大家一定要待在一起。
        - id: ch03-b20
          speaker: narrator
          text: 安西娅向不远处眼巴巴望着他们的女孩招手，她高高兴兴地走了过来。
        - id: ch03-b21
          speaker: cyril
          text: 你们的石头手镯是怎么做出来的？
        - id: ch03-b22
          speaker: ancient_girl
          text: 用别的石头来做。是男人们做的，我们这里有人特别擅长这种手艺。
        - id: ch03-b23
          speaker: cyril
          text: 你们没有铁工具吗？
        - id: ch03-b24
          speaker: ancient_girl
          text: 铁？我不知道那是什么。
        - id: ch03-b25
          speaker: narrator
          text: 这是女孩头一个听不懂的词。
        - id: ch03-b26
          speaker: cyril
          text: 你们所有的工具都是燧石做的？
        - id: ch03-b27
          speaker: ancient_girl
          text: 当然啦。
        - id: ch03-b28
          speaker: narrator
          text: >-
            女孩惊讶地睁大眼睛。真希望我有时间把那番谈话全讲给你听。英国孩子既想听完这个新地方的一切，又想把自己的国家讲给女孩听。这就像你度假归来，既急着听别人说，也恨不得同时把自己的经历全说完。可谈得越久，女孩听不懂的词就越多。孩子们也渐渐发现，那些他们一直以为生活中绝不能少的东西，其实没几样真是活命必需的。于是，他们很快便放弃向女孩解释自己的国家究竟是什么模样。
        - id: ch03-b29
          speaker: narrator
          text: >-
            女孩带他们去看茅屋是怎样搭成的。恰好那天有人正在盖一间，她便领孩子们走过去。盖法与我们的完全不同。男人们先在一块与预定茅屋同样大的地面上插入长木条，每根相隔约八英寸。然后，他们在第一排八英寸外插下第二排，再往外插下第三排。排与排之间的空隙全用细枝和小树杈填满，最后糊上一层黑泥。那泥事先用脚踩过，已经变得又软又黏，就像油灰。
        - id: ch03-b30
          speaker: narrator
          text: >-
            女孩还告诉他们，男人怎样拿着燧石长矛和箭去打猎，怎样用芦苇和黏土造船。接着，她解释了河里那个芦苇圈，也就是她刚才捞鱼的地方。那是一只捕鱼陷阱，一圈芦苇竖在水中，只留下一个小入口。入口的水面下面，还插着几根顺着水流方向倾斜的芦苇。鱼傻乎乎地游进去，就傻乎乎地再也出不来了。她又带他们看陶盆、陶罐和陶盘，其中有些画着黑红相间的花纹。还有燧石与各种石料做成的珠子、饰品、工具和武器，样样都奇妙极了。
        - id: ch03-b31
          speaker: cyril
          text: 想想这些全是八千年前的东西，还真是了不起。
        - id: ch03-b32
          speaker: narrator
          text: 西里尔说这话时，很有几分居高临下。
        - id: ch03-b33
          speaker: ancient_girl
          text: 我听不懂你的话。
        - id: ch03-b34
          speaker: jane
          text: >-
            现在才不是八千年前，现在就是现在。我讨厌的正是这一点。趁别的事情还没发生，咱们回家吧。你们也看见了，护身符不在这里。
    - id: ch04
      title: 最里面的秘密
      blocks:
        - id: ch04-b01
          speaker: anthea
          text: 中间围起来的地方有什么？
        - id: ch04-b02
          speaker: narrator
          text: 安西娅指着树篱，她忽然想到了一个可能。
        - id: ch04-b03
          speaker: ancient_girl
          text: >-
            那是秘密的圣地，没有人知道里面有什么。那里有一层又一层围墙，在最里面的里面供奉着“它”。可是，除了各位首领，没有任何人知道“它”究竟是什么。
        - id: ch04-b04
          speaker: cyril
          text: 我相信你知道。
        - id: ch04-b05
          speaker: narrator
          text: >-
            西里尔说话时一直紧盯着女孩，仿佛要从她的脸上看出答案。安西娅则从手上摘下一枚珠子戒指。刚才村民围着他们时，早已对这枚戒指赞叹了许久。
        - id: ch04-b06
          speaker: anthea
          text: 你肯告诉我，我就把这个送给你。
        - id: ch04-b07
          speaker: ancient_girl
          text: >-
            好，我告诉你们。我父亲是首领之一，我知道一道水咒，可以让他睡着以后开口说话。他在梦里已经把秘密说了出来。可要是他们知道我把这件事告诉了你们，一定会杀死我。最里面的里面有一只石匣，石匣里放着护身符。没有人知道它从哪里来，只知道它来自非常遥远的地方。
        - id: ch04-b08
          speaker: narrator
          text: 女孩急切地接过戒指。
        - id: ch04-b09
          speaker: anthea
          text: 你亲眼见过护身符吗？
        - id: ch04-b10
          speaker: narrator
          text: 女孩点点头。简莽撞地把他们的护身符掏了出来。
        - id: ch04-b11
          speaker: jane
          text: 是不是有点像这个？
        - id: ch04-b12
          speaker: narrator
          text: 女孩的脸一下变成病恹恹的青白色。
        - id: ch04-b13
          speaker: ancient_girl
          text: >-
            藏起来，快藏起来！你必须把它放回去。他们看见了，会把我们全杀掉。你会因为偷走它被杀，我会因为知道有这样的东西被杀。灾祸呀！你们为什么偏要来这里？
          emotion: fearful
        - id: ch04-b14
          speaker: cyril
          text: >-
            别怕，他们不会知道。简，你以后别再像只小猴子一样莽撞，这就够了。你也看见这种事会惹出什么麻烦。现在，请你告诉我……
        - id: ch04-b15
          speaker: narrator
          text: >-
            西里尔转向女孩，正想继续问下去，可问题还没来得及出口，外面忽然传来一声响亮的高喊。一个男人从荆棘篱笆的缺口飞奔进来。
        - id: ch04-b16
          speaker: messenger
          text: 大群敌人攻来了！准备防守！
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: 报信人只剩力气喊出这一句，随后便倒在地上，气喘吁吁。
        - id: ch04-b18
          speaker: jane
          text: 啊，咱们快回家吧！我不管了，我非回去不可！
          emotion: fearful
        - id: ch04-b19
          speaker: narrator
          text: >-
            简立刻举起护身符。幸好那些浅色头发的陌生人全都忙着准备防守，谁也没有留意她。简把护身符举得高高的，可等了半天，什么也没有发生。
        - id: ch04-b20
          speaker: anthea
          text: 你还没有念力量之名。
        - id: ch04-b21
          speaker: narrator
          text: 简赶忙念出那个名字，依旧毫无动静。
        - id: ch04-b22
          speaker: robert
          text: 傻瓜，要朝东方举！
        - id: ch04-b23
          speaker: jane
          text: 哪边才是东方？
          emotion: fearful
        - id: ch04-b24
          speaker: narrator
          text: >-
            简被恐惧折磨得在原地乱跳，急着问哪一边才是东方。可是四个孩子谁也不知道答案。他们只好打开鱼袋，打算请赛米德指明方向。
        - id: ch04-b25
          speaker: narrator
          text: 袋子里只有一块防水布。
        - id: ch04-b26
          speaker: narrator
          text: 赛米德不见了。
        - id: ch04-b27
          speaker: ancient_girl
          text: 把圣物藏起来！快藏起来！
          emotion: fearful
        - id: ch04-b28
          speaker: narrator
          text: 西里尔耸了耸肩，努力摆出他认为自己本该有的勇敢模样。
        - id: ch04-b29
          speaker: cyril
          text: 收好它，小猫咪。这下咱们躲不过去了，只能留下来，看看到底会怎么样。
