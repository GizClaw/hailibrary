        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
