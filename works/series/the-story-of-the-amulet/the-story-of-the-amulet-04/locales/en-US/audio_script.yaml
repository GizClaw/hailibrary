  chapters:
    - id: ch01
      title: EIGHT THOUSAND YEARS AGO
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next morning, Anthea persuaded old Nurse to let her carry breakfast up to the poor learned gentleman. At first he did not know who she was. When he recognized her, he seemed vaguely glad to see her.
        - id: ch01-b02
          speaker: anthea
          text: >-
            Look, I'm wearing the charm around my neck. I'm taking care of it, just as you told us.
        - id: ch01-b03
          speaker: learned_gentleman
          text: >-
            Quite right. Did you have a pleasant game last night?
        - id: ch01-b04
          speaker: anthea
          text: >-
            You will eat your breakfast before it gets cold, won't you? We had a splendid time. The charm made everything dark, then filled the room with green light, and then it spoke. Oh, I wish you could have heard its darling voice! It said its other half was lost in the Past, so of course we must go and look for it there.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The learned gentleman rubbed his hair with both hands and stared at Anthea anxiously.
        - id: ch01-b06
          speaker: learned_gentleman
          text: >-
            Youthful imagination, I suppose. Perfectly natural, and so forth. But someone must have... Who told you that part of the charm was missing?
        - id: ch01-b07
          speaker: anthea
          text: >-
            I can't tell you. I know that sounds terribly rude after you were so kind and taught us the name of power. But I truly am not allowed to tell anyone about the person who told me. You won't forget your breakfast, will you?
        - id: ch01-b08
          speaker: narrator
          text: >-
            He gave her a weak smile, then frowned. It was not an angry frown. It was the frown of a man facing a puzzle.
        - id: ch01-b09
          speaker: learned_gentleman
          text: >-
            Thank you. I shall always be pleased if you stop in whenever you happen to be passing. At least...
        - id: ch01-b10
          speaker: anthea
          text: >-
            I will. Goodbye. I'll always tell you anything I'm allowed to tell.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The learned gentleman had not met many adventures involving children, and he wondered whether all children were like these. He wondered for a full five minutes. Then he returned to chapter fifty-two of his great book, The Secret Rites of the Priests of Amen Ra.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The children were far from easy about passing through the charm into the Past. They might be trapped there and never come home, and none of them liked that thought at all. Still, no one dared suggest giving up. Each child was frightened, but each would have mocked any other child who said the timid, perfectly natural words, "Let's not."
        - id: ch01-b13
          speaker: narrator
          text: >-
            They decided they must arrange to be away all day. There was no reason to think the dinner bell could call them back through the Past. They also thought it unwise to awaken Nurse's curiosity, because nothing they said could satisfy it. Even the truth would not have helped. The children were very proud of how well they had understood everything the charm and the Psammead said about Time, Space, and matters of that sort. They were equally certain Nurse could never understand a single word. So they merely asked to take their dinner into Regent's Park. Nurse agreed at once, and everyone understood that dinner would mean cold mutton and tomatoes.
        - id: ch01-b14
          speaker: nurse
          text: >-
            You may buy yourselves buns or sponge cakes, or whatever you fancy.
        - id: ch01-b15
          speaker: narrator
          text: >-
            She handed Cyril a shilling.
        - id: ch01-b16
          speaker: nurse
          text: >-
            But no jam tarts. They're messy even when you have forks and plates. Without them, you'll ruin your clothes, and you won't be able to wash your hands or faces afterward.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Cyril took the money, and they set out. On Tottenham Court Road they bought waterproof sheeting for the Psammead, in case rain was falling in the Past. Getting wet is almost certain death to a Psammead.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The sun shone so brightly that even London looked pretty. Women stood beside great baskets filled with roses, and Anthea bought four, one for each child. The flowers were red and smelled of summer. They were exactly the roses you desperately want at Christmas, when the only green things you can find are mistletoe and holly. Mistletoe looks pale right through to its scent, while holly pricks your nose if you try to smell it.
        - id: ch01-b19
          speaker: narrator
          text: >-
            With a rose in every buttonhole, they sat beneath the trees in Regent's Park. In the country, those leaves would have been a clean, clear green. Here they were dusty and yellowish, with brown around the edges.
        - id: ch01-b20
          speaker: anthea
          text: >-
            We have to go on with it. The eldest goes first, so you must go last, Jane. You understand that you have to hold on to the charm while you pass through, don't you, Pussy?
        - id: ch01-b21
          speaker: jane
          text: >-
            I wish I didn't have to be last.
          emotion: fearful
        - id: ch01-b22
          speaker: anthea
          text: >-
            You can carry the Psammead if you like. That is, if it allows you.
        - id: ch01-b23
          speaker: psammead
          text: >-
            I don't care who carries me, provided I am not dropped. I cannot bear being dropped.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Jane's hands trembled as she tucked the Psammead and its fish basket under one arm. The charm's long cord hung around her neck. They all stood. Jane held the charm out at arm's length, and Cyril solemnly spoke the word of power.
        - id: ch01-b25
          speaker: narrator
          text: >-
            As Cyril spoke, the charm grew taller and wider. Jane was suddenly gripping the edge of a huge red arch with a strange shape. Its opening was narrow, but Cyril saw that he could squeeze through it. All around the arch, Regent's Park remained just as it had been. He could see the faded trees and trampled grass, and little ragged children playing Ring-a-Ring-o'-Roses. But inside the arch, brilliant blue, yellow, and red light blazed from another place.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Cyril drew a long breath. He locked his knees so the others would not see them shake and knock together.
        - id: ch01-b27
          speaker: cyril
          text: >-
            Here goes!
        - id: ch01-b28
          speaker: narrator
          text: >-
            Cyril stepped through the arch and vanished. Anthea followed. At her suggestion, Robert held tightly to Jane's sleeve as he went next, and that pulled Jane safely after him. The moment they reached the other side, the arch and Regent's Park disappeared. Only the charm remained in Jane's hand, small again.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The new light was so fierce that they blinked, winked, and rubbed their eyes. While they were dazzled, Anthea felt for the charm and tucked it safely inside Jane's dress. When their eyes finally grew used to that wonderful brightness, the children looked around. The sky was bluer than they had ever imagined a sky could be. It flashed, glittered, and dazzled them like the sea at home when sunlight dances across the water.
        - id: ch01-b30
          speaker: narrator
          text: >-
            They stood in a small clearing inside a low, dense forest. Trees and shrubs rose from undergrowth that was thorny, tangled, and almost impossible to pass through. Ahead lay a bank of strange black mud. Beyond it ran a shining brown-yellow ribbon of river. On the farther side came more mud, dry and baked into cakes, and then another stretch of green-brown jungle. Only three things showed that human beings had ever been there at all: the clearing where the children stood, a path leading away from it, and a curious arrangement of cut reeds set in the river.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The children looked at one another.
        - id: ch01-b32
          speaker: robert
          text: >-
            Well, this certainly is a change of air!
          emotion: surprised
        - id: ch01-b33
          speaker: narrator
          text: >-
            It was indeed. The air was hotter than they had ever imagined, even in London during August.
        - id: ch01-b34
          speaker: cyril
          text: >-
            I wish I knew where we were. There's a river, but is it the Amazon, the Tiber, or something else?
        - id: ch01-b35
          speaker: psammead
          text: >-
            It is the Nile.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The Psammead peered out from its fish basket.
        - id: ch01-b37
          speaker: robert
          text: >-
            Then we're in Egypt.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Robert had once won a geography prize.
        - id: ch01-b39
          speaker: cyril
          text: >-
            But I don't see any crocodiles.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Cyril's prize had been for natural history. The Psammead stretched a hairy arm from its basket and pointed toward a mound of mud beside the water.
        - id: ch01-b41
          speaker: psammead
          text: >-
            Then what do you call that?
        - id: ch01-b42
          speaker: narrator
          text: >-
            As it spoke, the mound slid into the river like wet mortar slipping from a builder's trowel.
        - id: ch01-b43
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: >-
            Oh!
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: >-
            Reeds crashed on the opposite bank. A huge creature, like an enormous slate-blue slug, appeared against the black mud.
        - id: ch01-b45
          speaker: psammead
          text: >-
            And there is a river horse.
        - id: ch01-b46
          speaker: cyril
          text: >-
            It's a hippopotamus. It seems much more real than the one at the Zoo, doesn't it?
        - id: ch01-b47
          speaker: jane
          text: >-
            I'm glad it's being real on the far side of the river.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Then reeds and twigs crackled behind them. That was horrible. It might be another hippopotamus, a crocodile, a lion, or almost anything else.
        - id: ch01-b49
          speaker: robert
          text: >-
            Keep your hand on the charm, Jane. We need a quick way out. This is exactly the sort of place where absolutely anything might happen to us.
          emotion: fearful
        - id: ch01-b50
          speaker: jane
          text: >-
            I think a hippopotamus is about to happen to us. A very, very large one.
          emotion: fearful
        - id: ch01-b51
          speaker: narrator
          text: >-
            They all turned toward the danger.
        - id: ch01-b52
          speaker: psammead
          text: >-
            Don't be silly little duffers. It isn't a river horse. It's a human being.
        - id: ch01-b53
          speaker: narrator
          text: >-
            It was a girl about Anthea's age. Her hair was short and fair. The sun had browned her skin, though it would have been fair too if it had ever had the chance. She had every possible chance to become brown, because she wore hardly any clothes. The four English children were carefully wrapped in dresses, hats, shoes, stockings, coats, collars, and all the rest. In that terrible heat, they envied the girl more than any words could say. There was no doubt that she was dressed properly for the climate and they were not.
        - id: ch01-b54
          speaker: narrator
          text: >-
            A red-and-black earthenware pot rested on her head. She did not notice the children, who shrank back against the edge of the jungle as she passed. The girl walked down to the river to fill her pitcher. All the way, she made a strange droning, humming, mournful sound. It went back and forth on only two notes. Anthea could not help thinking that perhaps the girl believed this noise was singing.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The girl filled her pitcher and left it on the bank. Then she waded out and bent over the ring of reeds. She pulled six fine fish from the trap, killed each one, and threaded them onto a long willow twig. She knotted the twig, hung it over her arm, lifted the pitcher, and turned back.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Then she saw the children. Jane and Anthea's white dresses shone like snow against the dark woods. The girl screamed. Her pitcher dropped, and water spilled across the hard mud and over the fallen fish. Slowly, it drained into the deep cracks.
        - id: ch01-b57
          speaker: anthea
          text: >-
            Please don't be afraid. We won't hurt you.
        - id: ch01-b58
          speaker: ancient_girl
          text: >-
            Who are you?
        - id: ch01-b59
          speaker: narrator
          text: >-
            I will not trouble you with an explanation of how the girl understood Anthea, or how Anthea understood her. You would understand my explanation no better than you understand the idea that Time and Space are merely forms of thought. Perhaps the children discovered the universal language that wise men have never found. They were remarkably lucky children, after all.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Or perhaps it happened some other way. Why keep guessing? In every adventure, those muddle-headed inventions we call foreign languages gave the children no trouble. They always understood and were understood. Explain it if you can. I dare say I could follow your explanation, even though you could never follow mine.
        - id: ch01-b61
          speaker: anthea
          text: >-
            We're children, just like you. Please don't be frightened. Will you show us where you live?
        - id: ch01-b62
          speaker: narrator
          text: >-
            Jane pushed her face into the Psammead's basket and buried her mouth in its fur so she could whisper.
        - id: ch01-b63
          speaker: jane
          text: >-
            Is it safe? They won't eat us, will they? Are they cannibals?
          emotion: fearful
        - id: ch01-b64
          speaker: narrator
          text: >-
            The Psammead shrugged all over.
        - id: ch01-b65
          speaker: psammead
          text: >-
            Don't buzz in my ear like that. It tickles. If you keep hold of the charm, you can always return to Regent's Park in time.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The strange girl was still trembling. Anthea wore a cheap bangle that pretended to be silver, with a turquoise-blue glass heart dangling from it. The maid at the Fitzroy Street house had given it to her.
        - id: ch01-b67
          speaker: anthea
          text: >-
            Here, take this. It shows that we won't harm you. If you accept it, I'll know that you won't harm us either.
        - id: ch01-b68
          speaker: narrator
          text: >-
            The girl held out her hand. Anthea slipped the bangle over it, and joy lit the girl's face.
        - id: ch01-b69
          speaker: ancient_girl
          text: >-
            Come with me. There is peace between your house and mine.
          emotion: happy
        - id: ch01-b70
          speaker: narrator
          text: >-
            Gazing fondly at the bangle, she gathered up her fish and pitcher. She led them along the narrow path, and the children followed.
        - id: ch01-b71
          speaker: cyril
          text: >-
            Now this is more like it!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Cyril was trying to sound brave.
        - id: ch01-b73
          speaker: robert
          text: >-
            Yes, this really is an adventure. Being in the Past makes it completely different from everything that happened with the Phoenix and the Carpet.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Robert sounded bold too, though he felt nothing of the kind. The belt of acacia trees and bushes was about half a mile wide. Most of them looked prickly and unpleasant. The path was narrow, and the woods were dark, until daylight finally shone ahead through the leaves.
        - id: ch01-b75
          speaker: narrator
          text: >-
            The whole party stepped suddenly from the deep shade of the woods into fierce sunlight. A great stretch of yellow sand opened before them, dotted here and there with piles of gray rock. Spiky cactus plants grew among the stones. Bright crimson and pink flowers stood out against their shabby leaves, which were peppered with sand. Far to the right was something that looked like a long gray-brown hedge. From somewhere beyond it, blue smoke rose toward a sky that was bluer still. Over everything, the sun blazed so fiercely that the children could hardly bear to keep their clothes on.
        - id: ch01-b76
          speaker: ancient_girl
          text: >-
            That is my home.
        - id: ch01-b77
          speaker: narrator
          text: >-
            She pointed toward the hedge.
        - id: ch01-b78
          speaker: jane
          text: >-
            I won't go unless you tell me it's safe.
          emotion: fearful
        - id: ch01-b79
          speaker: narrator
          text: >-
            Jane whispered into the basket. The Psammead might have been touched by her trust. Perhaps it heard doubt instead.
        - id: ch01-b80
          speaker: psammead
          text: >-
            If you refuse to go now, I will never help you again.
          emotion: angry
        - id: ch01-b81
          speaker: anthea
          text: >-
            Oh, Jane, please don't! Think of Father and Mother, and of all of us getting our heart's desire. We can leave whenever we want. Come on!
        - id: ch01-b82
          speaker: cyril
          text: >-
            Besides, the Psammead would not come if there were danger. It isn't especially brave itself. Come along.
        - id: ch01-b83
          speaker: narrator
          text: >-
            At last Jane agreed. As they approached the brown fence, they saw an eight-foot wall made from heaps of thorn bushes.
        - id: ch01-b84
          speaker: cyril
          text: >-
            What is that meant to do?
        - id: ch01-b85
          speaker: ancient_girl
          text: >-
            It keeps out enemies and wild beasts.
        - id: ch01-b86
          speaker: cyril
          text: >-
            I should think it does. Some of those thorns are as long as my foot.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The girl led them through an opening. Beyond it stood a second thorn hedge, lower but just as spiteful-looking. Inside was a village of huts.
        - id: ch01-b88
          speaker: narrator
          text: >-
            There were no gardens and no roads. Huts made of wood, twigs, and clay had simply been set down wherever there was room. Broad palm leaves covered the roofs, and every doorway was so low that it looked like the entrance to a dog kennel. There were no paths or streets between the houses. There was only yellow sand, trampled until it became hard and smooth. In the center of the village, another hedge enclosed a piece of ground about as large as the children's own garden in Camden Town.
        - id: ch01-b89
          speaker: narrator
          text: >-
            The moment the visitors passed the inner hedge, dozens of men, women, and children poured from the huts and crowded around them. The girl stepped protectively in front of the four.
        - id: ch01-b90
          speaker: ancient_girl
          text: >-
            These are wonder-children from beyond the desert. They bring marvelous gifts. I have promised peace between their house and ours.
        - id: ch01-b91
          speaker: narrator
          text: >-
            She raised her arm to show Anthea's bangle. The London children came from a place where nobody was surprised by anything anymore, but they had never seen so many astonished faces.
        - id: ch01-b92
          speaker: narrator
          text: >-
            The villagers pressed closer and closer around the children. Curious hands touched the cloth of their clothes and the leather of their shoes. They fingered the buttons on the boys' jackets and examined the coral beads around the girls' necks. Nothing the visitors wore escaped their eager attention.
        - id: ch01-b93
          speaker: anthea
          text: >-
            Cyril, please say something.
        - id: ch01-b94
          speaker: cyril
          text: >-
            We come from the world where the sun never sets. We want peace with honor. We belong to the great Anglo-Saxon conquering race, though we don't mean to conquer you. We only want to see your houses and everything you have. Then we'll return home and tell people what we saw, so your name will become famous.
        - id: ch01-b95
          speaker: narrator
          text: >-
            Cyril's speech came from a dim memory of the Daily Telegraph, which he had once read while waiting for Father outside a solicitor's office. It did nothing to stop the villagers. They kept examining the children's clothes with just as much interest.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Anthea guessed these people had never seen woven cloth before. To anyone who had worn nothing but animal skins, the fabric must have seemed extraordinary. Even the sewing in the children's ordinary clothes filled them with wonder. The villagers must have known how to sew in their own way, though. The men who appeared to be chiefs wore goatskin or deerskin breeches, tied around the waist with twisted strips of hide. The women wore long, narrow skirts made from animal skins.
        - id: ch01-b97
          speaker: narrator
          text: >-
            The people were not very tall. Men and women alike wore their fair hair cut short, and all of them had blue eyes. Blue eyes seemed strange to the children here in Egypt. Most of the villagers were tattooed rather like sailors, though their markings were much rougher.
        - id: ch01-b98
          speaker: narrator
          text: >-
            Again and again, curious hands touched the children's clothes while voices asked what everything was. Anthea quickly removed Jane's frilly lace collar and offered it to the friendliest-looking woman.
        - id: ch01-b99
          speaker: anthea
          text: >-
            Take this and examine it, but please leave us alone now. We need to talk together.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Anthea used the commanding voice that always worked when she had no time to coax her baby brother. It worked here too. The villagers drew back about twelve yards, where they studied the lace and talked as hard as they could.
        - id: ch01-b101
          speaker: narrator
          text: >-
            The children never learned what the villagers said, though there was no doubt that the four strangers were the subject of every word. They tried to comfort themselves by remembering the girl's promise of friendship. Of course, remembering the charm was much more comforting. They sat together on the sand in the shade cast by the hedge around the central enclosure. For the first time since entering the village, they could look about and see something besides a crowd of eager, curious faces.
        - id: ch01-b102
          speaker: narrator
          text: >-
            The women wore strings of colored stone beads, with strangely shaped pendants hanging from them. Some also wore bracelets made of ivory and flint.
        - id: ch01-b103
          speaker: robert
          text: >-
            Just think how much we could teach them if we stayed here!
        - id: ch01-b104
          speaker: cyril
          text: >-
            I expect they could teach us a few things too. Did you see the flint bracelet on the woman who took the collar? Making that cannot have been easy.
        - id: ch01-b105
          speaker: cyril
          text: >-
            If we keep whispering together, they may grow suspicious. I want to learn how they make things. Let's ask the girl to show us around while we think about finding the Amulet. But remember, we must all stay together.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Anthea beckoned. The girl had been watching them wistfully from a short distance away, and she came at once.
        - id: ch01-b107
          speaker: cyril
          text: >-
            How do you make those stone bracelets?
        - id: ch01-b108
          speaker: ancient_girl
          text: >-
            We use other stones. Men with special skill make them.
        - id: ch01-b109
          speaker: cyril
          text: >-
            Don't you have iron tools?
        - id: ch01-b110
          speaker: ancient_girl
          text: >-
            Iron? I don't know that word.
        - id: ch01-b111
          speaker: narrator
          text: >-
            It was the first word she had failed to understand.
        - id: ch01-b112
          speaker: cyril
          text: >-
            Are all your tools made of flint?
        - id: ch01-b113
          speaker: ancient_girl
          text: >-
            Of course they are.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Her eyes opened wide. I wish there were time to tell you all of the talk that followed. The English children wanted to learn everything about this new place. At the very same moment, they wanted to explain their own country to the girl. It was like coming home from a holiday and wanting to hear every piece of news while telling every one of your adventures. As the conversation went on, more and more words meant nothing to the girl. At last the children gave up trying to describe their country. They were starting to see that many things they had always thought no one could live without were not really necessary to life at all.
        - id: ch01-b115
          speaker: narrator
          text: >-
            The girl showed them how the huts were made. One was being built that very day, so she took them to watch. The method was quite unlike anything the children knew. First, the men drove long pieces of wood into the ground around a space the size of the hut they wanted. They left about eight inches between each piece. Then they planted a second row about eight inches outside the first, and a third row farther out again. They filled every space between the rows with small branches and twigs. Finally, they covered it all with black mud. The mud had been worked underfoot until it was as soft and sticky as putty.
        - id: ch01-b116
          speaker: narrator
          text: >-
            The girl told them how the men hunted with flint-tipped spears and arrows, and how they made their boats from reeds and clay. Then she explained the ring of cut reeds where she had caught the fish. It was a trap with only one little opening. Just beneath the water, reeds had been planted across that entrance so they leaned in the same direction as the river flowed. A fish could swim foolishly past those reeds and enter the circle. Once inside, it could not swim back through them again, no matter how foolishly it tried.
        - id: ch01-b117
          speaker: narrator
          text: >-
            She showed them the things her people made from clay. There were pots, pitchers, jars, and flat dishes, and some had been decorated with patterns in red and black. Then came the most wonderful objects of all. The villagers shaped flint and many other kinds of stone into colored beads and ornaments. They also made every sort of tool and weapon they needed.
        - id: ch01-b118
          speaker: cyril
          text: >-
            It really is wonderful, when you remember this was all eight thousand years ago.
        - id: ch01-b119
          speaker: ancient_girl
          text: >-
            I don't understand what you mean.
        - id: ch01-b120
          speaker: jane
          text: >-
            It isn't eight thousand years ago. It's now, and that's exactly what I don't like. Please, let's go home before something else happens. We can see that the charm isn't here.
          emotion: fearful
        - id: ch01-b121
          speaker: anthea
          text: >-
            What is inside that enclosure in the middle?
        - id: ch01-b122
          speaker: narrator
          text: >-
            A sudden idea had come to her, and she pointed toward the fence.
        - id: ch01-b123
          speaker: ancient_girl
          text: >-
            That is the secret sacred place. No one knows what is there. It has wall after wall, and It is inside the innermost one. Only the headsmen know what It is.
        - id: ch01-b124
          speaker: cyril
          text: >-
            I think you know.
        - id: ch01-b125
          speaker: narrator
          text: >-
            Cyril looked at her intently. Anthea removed a beaded ring that the villagers had already admired.
        - id: ch01-b126
          speaker: anthea
          text: >-
            I'll give you this ring if you tell us.
        - id: ch01-b127
          speaker: ancient_girl
          text: >-
            Yes, I'll tell you. My father is one of the heads. I know a water charm that makes him speak in his sleep, and I heard what he said. But if anyone learns that I told you, they will kill me.
        - id: ch01-b128
          speaker: narrator
          text: >-
            She snatched eagerly at the ring.
        - id: ch01-b129
          speaker: ancient_girl
          text: >-
            Within the innermost place is a stone box. The Amulet lies inside it. No one knows where it came from. It was brought from very far away.
        - id: ch01-b130
          speaker: anthea
          text: >-
            Have you seen it yourself?
        - id: ch01-b131
          speaker: narrator
          text: >-
            The girl nodded.
        - id: ch01-b132
          speaker: jane
          text: >-
            Does it look anything like this?
        - id: ch01-b133
          speaker: narrator
          text: >-
            Without thinking, Jane pulled out the charm. The girl's face turned a sickly green-white.
        - id: ch01-b134
          speaker: ancient_girl
          text: >-
            Hide it! Put it back at once. If they see it, they will kill every one of us. They will kill you for taking it, and me for knowing such a thing existed. Oh, why did you ever come here?
          emotion: fearful
        - id: ch01-b135
          speaker: cyril
          text: >-
            Don't be afraid. They won't find out. Jane, don't behave like a little jackanapes again. Now you see what might happen if you do. Tell me this...
        - id: ch01-b136
          speaker: narrator
          text: >-
            Before Cyril could ask his question, a shout rang out. A man bounded through the opening in the thorn hedge.
        - id: ch01-b137
          speaker: messenger
          text: >-
            A great many enemies are attacking us! Prepare the defenses!
          emotion: fearful
        - id: ch01-b138
          speaker: narrator
          text: >-
            That warning used all the breath he had. He dropped to the ground, panting.
        - id: ch01-b139
          speaker: jane
          text: >-
            Oh, please, let's go home! I don't care what anyone says. I'm going!
          emotion: fearful
        - id: ch01-b140
          speaker: narrator
          text: >-
            Jane raised the charm. Luckily, the fair-haired villagers were too busy to notice. But nothing happened.
        - id: ch01-b141
          speaker: anthea
          text: >-
            You forgot to say the word of power.
        - id: ch01-b142
          speaker: narrator
          text: >-
            Jane said it quickly. Still nothing happened.
        - id: ch01-b143
          speaker: robert
          text: >-
            Hold it toward the East, you silly!
        - id: ch01-b144
          speaker: jane
          text: >-
            But which way is East?
          emotion: fearful
        - id: ch01-b145
          speaker: narrator
          text: >-
            In terror, Jane danced from one foot to the other. No one knew the answer. They opened the fish basket to ask the Psammead.
        - id: ch01-b146
          speaker: narrator
          text: >-
            The basket held nothing but the waterproof sheet. The Psammead had vanished.
        - id: ch01-b147
          speaker: ancient_girl
          text: >-
            Hide the sacred thing! Hide it, quickly!
          emotion: fearful
        - id: ch01-b148
          speaker: narrator
          text: >-
            Cyril lifted his shoulders and tried to look as brave as he knew he ought to feel.
        - id: ch01-b149
          speaker: cyril
          text: >-
            Put it away, Pussy. We're caught in this now. We'll have to stay and see it through.
