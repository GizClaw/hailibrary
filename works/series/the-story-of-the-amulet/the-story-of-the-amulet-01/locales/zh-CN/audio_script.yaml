audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    shopkeeper:
      display_name: 店主
      tts:
        delivery: 粗鲁精明，市井口吻浓重
        timbre: 粗哑厚重
        pace: 中等偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第一章　赛米德
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有四个孩子，叫西里尔、罗伯特、安西娅和简。他们曾在一幢白房子里过暑假，房子一边是沙坑，一边是白垩坑。就在沙坑里，他们走了大运，发现了一只奇怪的生物。它的长眼睛像蜗牛眼，可以像望远镜一样伸进伸出。耳朵像蝙蝠，毛茸茸的胖身子像蜘蛛，手脚又像猴子。那是赛米德，也就是沙精。这个名字念作“萨米艾德”。它的年纪老得惊人，差不多从万物初生时就活着，还在沙下埋了几千年。可它依然保留着精灵的本领，其中一样就是让人的愿望成真。你知道，精灵一向都有这种能耐。
        - id: ch01-b02
          speaker: narrator
          text: >-
            四个孩子果然得到了许多愿望。可他们总想不到真正合适的愿望，每次的结果都古怪得出奇。最后，那些糊涂愿望让他们陷入罗伯特所谓的“进退两难的绝境”。赛米德答应救他们出来，但孩子们必须保证，再也不求它实现愿望，也不把它的秘密告诉任何人。它实在不想再受人纠缠了。分别时，简却很客气地说出一个愿望。
        - id: ch01-b03
          speaker: jane
          text: 我希望以后有一天，我们还能见到你。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这份好意感动了赛米德，它便让简的愿望成了真。讲述那段经历的书叫《五个孩子和沙精》，结尾却故意说，孩子们确实又见到了赛米德，只是并非在沙坑里。至于究竟在哪里，书里偏偏不肯再讲。那时的我还没查清他们重逢的时间和地点，所以当然讲不下去。不过我早知道他们一定会再见。赛米德说话算数，它说一件事会发生，那件事就绝不会落空。这一点，可比预告下星期四伦敦、南部海岸和英吉利海峡天气的人可靠多了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            发现赛米德、让愿望成真的那个暑假，实在奇妙极了。孩子们一心盼着来年再去乡间度假。寒假里，他们又经历了《凤凰与魔毯》中的奇事。后来虽然失去了凤凰和魔毯，想到下一个乡间暑假，他们才没有绝望。在他们看来，世界到处藏着奇妙的事，而他们恰好就是会遇上奇妙事情的人。
        - id: ch01-b06
          speaker: narrator
          text: >-
            然而暑假终于来临时，一切都变了，变得非常糟糕。父亲要去满洲，把战争消息拍电报发给他供职的那家讨厌报纸，名字大概是《每日吼报》之类。可怜的母亲病得很重，到马德拉休养去了，小羊羔，也就是家里的宝宝，跟她在一起。埃玛姨妈是母亲的妹妹，她忽然嫁给了父亲的弟弟雷金纳德叔叔。新婚夫妇去了遥远的中国。那地方实在太远，不管姨妈姨父多么疼爱孩子们，他们也不能指望受邀去那里度假。
        - id: ch01-b07
          speaker: narrator
          text: >-
            四个孩子只好住进菲茨罗伊街，由大英博物馆附近的老保姆照看。老保姆很疼他们，宠孩子的程度，甚至超过了对我们中间最年长的人有益的限度。可他们还是伤心透了。马车载着父亲离开，车上堆着所有箱子和枪支，还有一张羊皮，里面卷着毯子和铝制野炊餐具。看到马车远去，最坚强的心也撑不住了。两个女孩抱在一起抽泣。两个男孩一人守着客厅一扇阴沉的长窗，只顾往外看，假装男孩子要是哭了，便是天下第一号没出息的人。
        - id: ch01-b08
          speaker: narrator
          text: >-
            你可别以为他们胆小。他们一直忍到父亲离开才哭，因为父亲已经有太多烦心事，不能再让他担忧。可他一走，大家都像是一辈子都在强忍眼泪，现在无论如何非哭不可。于是，他们痛痛快快地哭了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            茶点里有小虾和西洋菜，孩子们的精神稍微好了一点。西洋菜在一只胖玻璃盐罐四周围成树篱，花样倒很雅致，他们从前从没见过。可是这顿饭仍旧吃得毫不快活。
        - id: ch01-b10
          speaker: narrator
          text: >-
            茶后，安西娅走进父亲住过的房间。那里空空的，父亲不在的事实一下子变得格外可怕。她想到每过一分钟，父亲就离自己远一点，离俄国人的枪炮近一点，便又哭了。接着，她想起生病又孤单的母亲。说不定就在这一刻，母亲正盼着有个小姑娘陪在身边，替她往发痛的额头上抹一点古龙水，或者在她忽然想喝茶时，马上沏来一杯热茶。可是安西娅远在伦敦，什么也做不了。她越想越难过，眼泪也越流越多。
        - id: ch01-b11
          speaker: narrator
          text: >-
            后来她记起母亲临行前说过，自己是家里最大的女孩，应该努力让其他人开心。她这才停住眼泪，认真想起办法来。等她想到实在受不了，便洗净脸，梳好头发，下楼去找大家。她竭力装得若无其事，好像从来没听说过世上还有哭泣这种活动。
        - id: ch01-b12
          speaker: narrator
          text: >-
            客厅里还是一片愁云。罗伯特为了打发时间，正扯简的头发。他没使劲，只是刚好足够惹她生气，可这点努力并没让屋里快活多少。安西娅开口了。
        - id: ch01-b13
          speaker: anthea
          text: 你们听我说，咱们开个议事会吧。
        - id: ch01-b14
          speaker: narrator
          text: >-
            “议事会”这个词让大家想起去年那个糟糕的日子。西里尔不小心许愿，让红印第安人出现在英国，结果他们真的来了。四个孩子一起叹气，乡间暑假的一切又回到眼前。白房子外的花园美丽又纷乱，晚开的玫瑰、紫菀和金盏花挤在一起，空气里飘着木犀草的甜香，羽毛般轻柔的芦笋也长在其中。更远处那片荒地，从前有人认真打算把它开成果园，如今却成了父亲所说的“五英亩蓟草，闹着一群樱桃幼树的鬼魂”。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他们还记得山谷对面的石灰窑，在阳光里像阿拉丁的宫殿。沙坑周围长着发黄的草和细茎野花，崖壁小洞是沙燕的一扇扇小门。那里的空气自由又清新，带着百里香、甜蔷薇和小巷边村舍的柴烟味。孩子们再看看老保姆闷气沉沉的客厅，简终于忍不住了。
        - id: ch01-b16
          speaker: jane
          text: 唉，这里跟那儿真是一点也不一样！
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: >-
            的确太不一样了。父亲还没把孩子们托付给老保姆时，她一直靠出租房间过日子，所以屋子也是照出租的样子布置。奇怪的是，人们布置出租房，仿佛从没想过住客也得在里面生活。窗上挂着厚重的暗红粗布帘，那颜色就算沾上血也看不出来，里面还衬着粗糙的蕾丝。地毯又黄又紫，角落里东一块西一块补着灰棕色油布。壁炉里没有火，只有刨花和彩箔。漆得亮晃晃的红木柜子，既像衣柜又像餐具柜，偏偏锁不上。硬椅子多得过头，座面全朝错误的方向倾斜，钩针椅套还不停往下滑。
        - id: ch01-b18
          speaker: narrator
          text: >-
            桌子披着一块绿得叫人难受的布，边上绕着一圈黄色链形针脚。壁炉上方的镜子很有本事，不管你原本已经多么不好看，它总能把你照得更加难看。壁炉架铺着栗色长毛绒，垂下来的毛线穗边却根本不配套。旁边那座沉闷的钟活像黑色大理石墓碑，也像坟墓一样安静，因为它早已忘了怎样滴答。彩绘玻璃花瓶从来不插花，彩绘手鼓从来没人敲，几只画满花样的托架上也从来不放东西。
        - id: ch01-b19
          speaker: narrator
          text: >-
            墙上还有枫木框的版画，画着女王、议会两院、天堂的平原，以及一个塌鼻子樵夫空手回来。屋里只有两本书，一本是去年十二月的《布雷德肖铁路指南》，另一本是普拉姆里奇《帖撒罗尼迦书评注》的残卷。其实屋里还有别的东西，可这幅令人痛苦的景象已经说得够久，我实在不忍再讲下去。简一点也没有夸张，这里果然和那个有阳光、花香与清风的乡间完全不同。
        - id: ch01-b20
          speaker: anthea
          text: 好了，咱们还是来开议事会吧。
        - id: ch01-b21
          speaker: cyril
          text: 到底有什么可商量的？
        - id: ch01-b22
          speaker: robert
          text: 什么事情都没有，我们还能商量什么？
        - id: ch01-b23
          speaker: jane
          text: 我现在一点也不想玩。
        - id: ch01-b24
          speaker: narrator
          text: >-
            简的声音气呼呼的。安西娅拼命克制自己，没有发脾气，而且真的做到了。
        - id: ch01-b25
          speaker: anthea
          text: >-
            先听我说。我不是想教训你们，也不是故意讨人嫌。我只想做父亲常说的那件事，把眼下的处境讲清楚。你们愿意听吗？
        - id: ch01-b26
          speaker: cyril
          text: 你就说下去吧。
        - id: ch01-b27
          speaker: anthea
          text: >-
            那好。我们留在这里，是因为楼顶住着那位可怜的学者先生，保姆走不开。父亲也找不到别的可靠的人照看我们。还有，母亲去马德拉治病，已经花掉了很多钱。
        - id: ch01-b28
          speaker: narrator
          text: >-
            简难过地抽起鼻子。安西娅赶紧接着往下说。
        - id: ch01-b29
          speaker: anthea
          text: >-
            我知道你难受，可我们别再一直想着这些糟糕的事了。要花很多钱的地方，我们当然去不了，但总得找点事情做。伦敦有好多地方不要钱也能参观，我们可以去看看。现在我们都长大了，小羊羔又不在这里。
        - id: ch01-b30
          speaker: narrator
          text: 简把鼻子抽得更响了。
        - id: ch01-b31
          speaker: anthea
          text: >-
            我的意思是，那个小宝贝不在，就没人能因为要照顾他而说“不行”。我们得让保姆明白，大家已经大到能自己出门了。不然，这个假期就真的一点意思也没有。我提议把伦敦能看的地方全看一遍。先请保姆给我们一些面包，再去圣詹姆斯公园喂鸭子。最要紧的是，她必须答应让我们自己去。
        - id: ch01-b32
          speaker: robert
          text: 自由万岁！不过，她肯定不会答应。
        - id: ch01-b33
          speaker: jane
          text: >-
            她会答应的。我早上也想到了这件事，还问过父亲。父亲同意了，并且已经告诉老保姆。我们每次只要说清楚要去哪里，地方合适，她就会让我们走。
        - id: ch01-b34
          speaker: cyril
          text: 为想得周到的简欢呼三声！那还等什么，我们现在就出发吧！
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: >-
            西里尔终于摆脱了呵欠连天的绝望。老保姆果真放他们出门，只叮嘱过马路要小心，太难过的路口可以请警察帮忙。孩子们对此很有经验。他们从前住在卡姆登镇，熟悉肯蒂什镇路。那里的电车日夜疯狂来往，瞧着仿佛宁愿把你碾倒，也不肯让你平安过去。
        - id: ch01-b36
          speaker: narrator
          text: >-
            他们答应天黑前回家。可那是七月，天黑得非常晚，早就过了睡觉时间。他们往圣詹姆斯公园走去，每个人的口袋都塞满面包块和烤面包皮，准备喂鸭子。不错，他们的确出发了，却根本没有走到公园。
        - id: ch01-b37
          speaker: narrator
          text: >-
            菲茨罗伊街和圣詹姆斯公园之间隔着许多街道。只要路线走对，还会经过许多让人无论如何也忍不住停步的店铺。孩子们在一扇又一扇橱窗前站住，看了闪亮的金线饰带和珠子，也看了图画、珠宝、衣裙与帽子。另一些橱窗里摆着牡蛎和张牙舞爪的龙虾。一路有这么多新鲜东西可瞧，比起待在菲茨罗伊街三百号那间最体面的客厅时，他们的悲伤已经容易承受多了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            罗伯特是队长。女孩们认为让他带路对他有好处，他自己也完全赞成。西里尔当然不能反对，不然就显得又小气又嫉妒。靠着罗伯特一次神奇的转弯，他们来到一片曲曲折折的小街。这里的商店最有意思，因为卖的全是活物。
        - id: ch01-b39
          speaker: narrator
          text: >-
            一家店的整扇橱窗都摆满鸟笼，笼里关着各式各样的漂亮鸟。孩子们起初看得兴高采烈，忽然想起自己从前也许愿长过翅膀，而且愿望真的实现了。他们知道自由飞翔是什么感觉，这才明白，一只本来有翅膀的生物若被锁进笼子，永远不许飞出去，该是多么绝望。
        - id: ch01-b40
          speaker: cyril
          text: 做一只笼中鸟，肯定难受得要命。咱们走吧！
        - id: ch01-b41
          speaker: narrator
          text: >-
            他们继续前行。西里尔一路盘算，自己怎样去克朗代克淘金发财，再买下全世界所有的笼中鸟，把它们放走。后来，他们看见一家猫店，可猫也被关在笼子里。孩子们希望有人能把猫全买下来，安置在炉边地毯上，因为那里才是猫应该待的地方。
        - id: ch01-b42
          speaker: narrator
          text: >-
            狗店看起来更加伤心。大狗小狗全都被拴着或关着，用悲伤又渴望的眼睛望着四个孩子，哀求似的摇着尾巴。它们仿佛一遍遍在说，快买下我吧，带我走，让我陪你们出去散步。请把我可怜的兄弟们也一起买走。求你们了，求你们了。狗儿们不停呜咽，那一声声哀求几乎真的清清楚楚传进了耳朵。
        - id: ch01-b43
          speaker: narrator
          text: >-
            只有一只大个儿爱尔兰㹴不同。简伸手摸它，它却在角落里斜眼看着孩子们，低声咆哮。那声音仿佛在说，你们不会买我，永远不会有人买我。我会一直拴在这里直到死掉，反正早死晚死，我也不在乎。
        - id: ch01-b44
          speaker: narrator
          text: >-
            孩子们之所以听得懂这种绝望，是因为他们曾经困在一座被围攻的城堡里。他们知道，自己明明想出去，却偏被关着，是多么可恨。当然，他们一只狗也买不起。他们问了最小那只狗的价钱，竟然要六十五英镑。那是一只日本玩赏犬，王后还只是威尔士王妃时，曾经搂着同样的狗画过肖像。孩子们想，最小的一只都这么贵，最大的一只恐怕值几千英镑，只好离开。
        - id: ch01-b45
          speaker: narrator
          text: >-
            他们不再停看猫、狗和鸟，最后来到一家店。这里卖的生物好像都不太介意住在什么地方，有金鱼、白老鼠、海葵和别的水族箱生物，还有蜥蜴、癞蛤蟆、刺猬、陆龟、驯熟的兔子和豚鼠。孩子们在店外待了许久，隔着笼条把一小块一小块面包送给豚鼠，又认真商量起来，不知道能不能在菲茨罗伊街那幢房子的地下室里，偷偷养一只沙色的双耳垂兔。
        - id: ch01-b46
          speaker: jane
          text: >-
            我看老保姆不会太介意。兔子有时特别亲人，它一定能认出保姆的声音，不管她走到哪儿，都跟在后面。
        - id: ch01-b47
          speaker: cyril
          text: 那样她一天会被绊倒二十次。要是换成一条蛇，就不会这样。
        - id: ch01-b48
          speaker: robert
          text: >-
            这里根本没有蛇。再说，我也不知道为什么，反正自己从来就喜欢不起来蛇。
        - id: ch01-b49
          speaker: anthea
          text: >-
            虫子也一样，还有鳗鱼和鼻涕虫。我想，我们就是不喜欢那些没有腿的东西。
        - id: ch01-b50
          speaker: robert
          text: 可父亲说过，蛇的腿藏在身体里面。
        - id: ch01-b51
          speaker: anthea
          text: >-
            父亲还说，我们的尾巴也藏在身体里面呢。可不管是藏起来的腿，还是藏起来的尾巴，实际上全都没有用。我就是讨厌没有腿的东西。
        - id: ch01-b52
          speaker: jane
          text: 腿太多才更吓人呢。你们想想蜈蚣！
          emotion: disgusted
        - id: ch01-b53
          speaker: narrator
          text: >-
            四个孩子站在人行道上闲谈，挡得路人很不方便。西里尔把胳膊肘支在一只看似空着的笼顶，想逗一只早已蜷成圆球的刺猬重新理他。就在这时，他肘下传来一个细小柔和的声音。那声音平静、清楚，绝不可能听错，也不是需要猜测意思的吱吱或呜呜，而是明明白白的话。
        - id: ch01-b54
          speaker: psammead
          text: 请把我买下来吧。求求你们，买下我！
        - id: ch01-b55
          speaker: narrator
          text: 西里尔像是忽然被人拧了一把，猛地跳到一码之外。
        - id: ch01-b56
          speaker: psammead
          text: >-
            快回来，别走！你弯下腰，假装在系鞋带。我看见鞋带又松了，你总是这样。
        - id: ch01-b57
          speaker: narrator
          text: >-
            西里尔不由自主地单膝跪下。干热的人行道满是尘土，他朝笼子深处望去，正好和赛米德面对着面。赛米德比上次见面时瘦多了。它满身灰尘，毛皮又脏又乱，整个身子缩成可怜的一团。两根蜗牛眼紧紧收进去，几乎看不见了。
        - id: ch01-b58
          speaker: psammead
          text: >-
            你听好。开店的家伙应该不会把我要价太高。我已经咬过他好几次，还拼命把自己弄得普普通通。他一眼也没见过我这双美丽的眼睛。你去告诉其他人，我在这里。可你们都得装成只对那些低贱的普通畜生有兴趣。要是里面的家伙看出你们很在意我，开的价就会高得让你们付不起。我记得去年夏天那些好日子里，你们手头从来没有多少钱。
        - id: ch01-b59
          speaker: psammead
          text: >-
            我真没想到，再见到你们会让我这么高兴。我从来没想到过。你先去告诉他们，然后我会仔细教你怎样把我买走。
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: >-
            赛米德说到这里，难过地抽了抽鼻子。它突然把长长的蜗牛眼伸到最远，让一滴眼泪落在离身体很远的地上，免得沾湿自己那身已经够脏乱的皮毛。西里尔这才低下头，把松开的鞋带紧紧系成一个死结。随后，他站起身，竭力让声音听起来坚定又平常，招呼其他三个孩子。
        - id: ch01-b61
          speaker: cyril
          text: >-
            你们听着，我没有开玩笑。我以你们的荣誉起誓。别看那只笼子，只看白老鼠。不管我接下来讲什么，你们都绝对不许朝那边看。
        - id: ch01-b62
          speaker: narrator
          text: 西里尔挡在笼前，免得有人不小心看错方向。
        - id: ch01-b63
          speaker: cyril
          text: >-
            现在准备好大吃一惊。笼子里是我们的一位老朋友。千万别看！没错，就是赛米德，是我们的老朋友。它想让我们把它买走，也叫你们别盯着它。你们只管看白老鼠，再数数大家有多少钱。凭荣誉起誓，谁也不许偷看！
        - id: ch01-b64
          speaker: narrator
          text: >-
            其他人很守信用，一起死盯着白老鼠，直把它瞧得难为情。白老鼠跑到最远的角落，用后腿坐起来，两只前爪遮住眼睛，假装正在洗脸。西里尔又弯下腰，忙着摆弄另一根鞋带，继续听赛米德吩咐。
        - id: ch01-b65
          speaker: psammead
          text: >-
            你们先进去，问许多别的东西多少钱。最后再问，倒数第三个笼子里那只没有尾巴、又老又掉毛的猴子要卖多少。别怕伤我的感情，只管叫我掉毛的猴子。我费了好大力气，才把自己弄得像一只猴子。他应该不敢多要钱。我前天才来，已经咬了他十一次。要是价钱高得你们付不起，就说你希望自己有那么多钱。
        - id: ch01-b66
          speaker: cyril
          text: >-
            可你已经不能替我们实现愿望了。我答应过，绝不会再向你许任何愿。
        - id: ch01-b67
          speaker: psammead
          text: >-
            别做一个傻乎乎的小笨蛋。先弄清楚你们四个人一共有多少钱，再完全照我的话去做。
        - id: ch01-b68
          speaker: narrator
          text: >-
            沙精说话时声音发颤，语气却十分亲昵。西里尔僵硬地指着白老鼠，假装自己只因为它太迷人，才跟其他人解释事情的原委。赛米德则不停地缩紧身子，把自己团起来，尽可能显得毫不起眼。随后，四个孩子排着队走进店里。
        - id: ch01-b69
          speaker: cyril
          text: 请问，那只白老鼠卖多少钱？
        - id: ch01-b70
          speaker: shopkeeper
          text: 那只要八便士。
        - id: ch01-b71
          speaker: cyril
          text: 那么，豚鼠要卖多少钱？
        - id: ch01-b72
          speaker: shopkeeper
          text: 要看品种，从一先令六便士到五先令都有。
        - id: ch01-b73
          speaker: cyril
          text: 蜥蜴每只又是多少钱？
        - id: ch01-b74
          speaker: shopkeeper
          text: 每只九便士。
        - id: ch01-b75
          speaker: cyril
          text: 癞蛤蟆呢，也请告诉我价钱。
        - id: ch01-b76
          speaker: shopkeeper
          text: >-
            四便士。可是你们都给我听好！我可不许你们进来把整间铺子搅乱，把每只牲口都问一遍价，只为了自己开心。要买就真的买。我从没见过哪个客人一次要买老鼠、蜥蜴、癞蛤蟆和豚鼠。要是不买，你们马上滚出去！
          emotion: angry
        - id: ch01-b77
          speaker: narrator
          text: >-
            店主满脸油腻，忽然凶相毕露。孩子们全吓得往后退，一直贴到沿墙排列的笼架护板上。可怜的西里尔这才明白，自己虽然一片好心地照办了，做法却显得蠢极了。
        - id: ch01-b78
          speaker: cyril
          text: >-
            请再等一下，只回答最后一个问题。倒数第三个笼子里，那只又老又掉毛的猴子，你要卖多少钱？
        - id: ch01-b79
          speaker: shopkeeper
          text: >-
            你自己才是掉毛的小猴崽子！少在这里说混账话，马上给我滚出去！
          emotion: angry
        - id: ch01-b80
          speaker: jane
          text: >-
            请你别这么凶。他没有故意捣乱，是真的很想知道那一只卖多少钱！
        - id: ch01-b81
          speaker: narrator
          text: >-
            简一慌，彻底忘了先前的计策。商人冷笑一声，又疑心重重地挠耳朵。他是个精明的生意人，能听出一句话到底是真是假。他一只手还缠着绷带。三分钟前，他本来很乐意用十先令卖掉那只“掉毛的老猴子”。可现在，他改了主意。
        - id: ch01-b82
          speaker: shopkeeper
          text: >-
            原来他真想买，是不是？那就两镑十先令。这样的猴子，你们在赤道这一边绝对找不到第二只，因为它来自赤道另一边。伦敦也从没出现过另一只，它本来就该送进动物园。两镑十先令，当场付清。拿不出来，你们就滚出去！
        - id: ch01-b83
          speaker: narrator
          text: >-
            孩子们面面相觑。他们所有的钱加起来，只有二十三先令五便士。其中二十先令，还是临别时父亲给他们四个人一起用的。要不然，他们只有三先令五便士。
        - id: ch01-b84
          speaker: cyril
          text: 我们一共只有二十三先令五便士。钱全在我的口袋里。
        - id: ch01-b85
          speaker: shopkeeper
          text: >-
            我看是二十三个四分之一便士，再加上某个人的厚脸皮。你根本拿不出那么多钱。
        - id: ch01-b86
          speaker: narrator
          text: >-
            大家陷入一阵凄惨的沉默。忽然，安西娅想起赛米德的嘱咐。
        - id: ch01-b87
          speaker: anthea
          text: 唉，我真希望自己有两镑十先令。
        - id: ch01-b88
          speaker: shopkeeper
          text: 我也真心希望您有，小姐。我可太希望您有了。
        - id: ch01-b89
          speaker: narrator
          text: >-
            店主说得苦涩，却又装出礼貌。安西娅的一只手正放在柜台上，忽然有什么东西从掌下滑过。她抬起手，五枚闪闪发亮的半镑金币竟然躺在那里。
        - id: ch01-b90
          speaker: anthea
          text: >-
            咦，原来我真的有这么多钱。钱全在这里，现在请把萨米……我是说，把那只猴子交给我们。
          emotion: surprised
        - id: ch01-b91
          speaker: narrator
          text: 店主仔细看了看金币，很快把它们塞进口袋，又耸耸肩，挠了挠耳朵。
        - id: ch01-b92
          speaker: shopkeeper
          text: >-
            但愿这些钱来路正当。好吧，看来我非把它卖给你们不可。可我告诉你们，这东西至少值现在这个价钱的三倍。
        - id: ch01-b93
          speaker: narrator
          text: >-
            店主没有痛快交货。他慢吞吞地带孩子们回到笼前，小心翼翼地打开笼门，仿佛早已知道里面的东西有多会咬人。接着，他突然把手伸进去，凶狠地一把抓住赛米德。赛米德也毫不客气，用最后一记又长又狠的咬噬回答了他，而且咬住之后久久不肯松口。
        - id: ch01-b94
          speaker: shopkeeper
          text: >-
            快把这畜生拿走！它这一口简直咬进我的骨髓了！
          emotion: angry
        - id: ch01-b95
          speaker: narrator
          text: >-
            他把赛米德攥得太紧，差点让它断气。安西娅伸出手臂时，男人惊讶地瞪大了眼睛。
        - id: ch01-b96
          speaker: shopkeeper
          text: 它要是把你脸上的肉全撕下来，你可别怪我！
        - id: ch01-b97
          speaker: narrator
          text: >-
            赛米德从他肮脏粗硬的手中一跃而出。安西娅稳稳接住它。她的手也不算干净，但至少柔软粉嫩，而且抱得又温柔又牢靠。
        - id: ch01-b98
          speaker: cyril
          text: >-
            我们不能这样把它带回家。一路上的人全会跟在后面看热闹。
        - id: ch01-b99
          speaker: narrator
          text: >-
            西里尔说得没错，两个跑腿的男孩和一名警察已经围了上来。
        - id: ch01-b100
          speaker: shopkeeper
          text: >-
            我这里没别的东西能给你们，只有纸袋，就是平时装陆龟的那一种。
        - id: ch01-b101
          speaker: narrator
          text: >-
            大家重新走进店里。店主不大情愿地翻找半天，拿出自己能找到的最大纸袋递给安西娅。安西娅撑开袋口，赛米德竟然很懂事地小心爬了进去。店主从没见过一只怪兽这样主动钻进纸袋，看得眼珠子都快从眼眶里掉出来了。
        - id: ch01-b102
          speaker: shopkeeper
          text: >-
            嘿，这可比斗鸡还稀奇！难道你们以前见过这只畜生？
          emotion: surprised
        - id: ch01-b103
          speaker: cyril
          text: 是的，我们早就认识了。它是我们的老朋友。
        - id: ch01-b104
          speaker: shopkeeper
          text: >-
            我要是早知道，你们不付两倍的钱就别想带走它。不过，这笔买卖倒也不算坏。我买它只花了五先令，只是还得把它咬我的那些账算进去。
        - id: ch01-b105
          speaker: narrator
          text: >-
            孩子们又激动又兴奋，浑身发抖。他们一路小心托着纸袋，把同样在袋中发抖的赛米德带回了家。到家后，安西娅把它抱在怀里，一遍遍轻轻抚摸。看见它那副狼狈模样，她几乎要心疼得落泪，幸好及时记起，赛米德最讨厌被水弄湿，这才忍住。
        - id: ch01-b106
          speaker: narrator
          text: 等它终于恢复力气，能够开口时，第一件事就是索要沙子。
        - id: ch01-b107
          speaker: psammead
          text: >-
            给我弄些沙子来，要去油漆颜料店买银沙，而且一定要多买一些。
        - id: ch01-b108
          speaker: narrator
          text: >-
            孩子们买来了足够多的银沙，把沙子和赛米德一起放进圆浴盆。赛米德在里面来回擦身、翻滚、抖毛，又刮又抓，还仔细梳理每一处毛皮，直到浑身干净，终于觉得舒舒服服。接着，它匆匆刨开一个洞，钻进沙里睡着了。孩子们把浴盆藏到女孩们的床底下，便去吃晚饭。老保姆准备了黄油面包和炸洋葱，晚餐好吃极了。她总有这些温柔又体贴的心思。
        - id: ch01-b109
          speaker: narrator
          text: >-
            第二天早上，安西娅睁开眼睛，发现赛米德正舒服地蜷在她和简的肩膀之间。
        - id: ch01-b110
          speaker: psammead
          text: >-
            你们救了我的命。那个男人迟早会把冷水泼在我身上，那样我一定会死。昨天早上，我亲眼见到他用水冲洗豚鼠的笼子。我还是困得厉害，想回沙里再睡一觉。你把两个男孩叫醒，再叫醒简这只睡鼠。等你们吃完早饭，我们再一起谈谈。
        - id: ch01-b111
          speaker: anthea
          text: 你自己不想吃一点早饭吗？
        - id: ch01-b112
          speaker: psammead
          text: >-
            我待会儿大概会随便吃一点，不过我真正想要的只有沙子。对我来说，沙子既是肉又是酒，既是煤又是火，还是妻子和孩子。
        - id: ch01-b113
          speaker: narrator
          text: >-
            说完，赛米德顺着床单和被褥爬下床，蹒跚着回到浴盆。孩子们听见它不停扒沙，很快把自己藏得无影无踪。安西娅终于觉得，这个假期又有了希望。
        - id: ch01-b114
          speaker: anthea
          text: 不管怎样，我们的假期现在不会无聊了。我们又找到了赛米德。
          emotion: happy
        - id: ch01-b115
          speaker: jane
          text: >-
            我们当然不会无聊。可是它已经不能让愿望成真了，现在养着它，也只不过像养了一只宠物狗。
        - id: ch01-b116
          speaker: anthea
          text: >-
            你别这么不知足。即使它不能做别的事，至少还可以给我们讲讲大地懒之类的东西。
