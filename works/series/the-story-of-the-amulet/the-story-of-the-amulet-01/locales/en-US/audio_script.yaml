  chapters:
    - id: ch01
      title: THE PSAMMEAD
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There were once four children who spent their summer holidays in a white house between a sandpit and a chalkpit. One day, in the sandpit, they found the strangest creature. Its eyes stood on long horns like a snail's and slid in and out like telescopes. It had bat ears, a round furry body shaped rather like a spider, and hands and feet like a monkey's.
        - id: ch01-b02
          speaker: narrator
          text: The creature told Cyril, Robert, Anthea, and Jane that it was a Psammead, pronounced Sammy-ad, or, more simply, a sand-fairy. It was old beyond imagining and had lain buried for thousands of years. Yet it was still magical, and it could grant wishes.
        - id: ch01-b03
          speaker: narrator
          text: The children's wishes did come true, though never quite as they expected. Again and again, they chose the wrong thing and landed in trouble. At last, one particularly foolish wish left them in what Robert called a very tight place indeed. The Psammead helped them escape only after they promised never to ask it for another wish and never to tell anyone about it. It wanted no more people troubling it.
        - id: ch01-b04
          speaker: jane
          text: I wish we might see you again someday.
        - id: ch01-b05
          speaker: narrator
          text: Jane meant it kindly, and the Psammead was touched. It granted that last wish. The story of those adventures is called Five Children and It. At the end, it says the children did see the Psammead again, though not in the sandpit. Then, at the very point where you would most like to hear more, it says no more can be told. A tiresome sort of ending, perhaps, but there was a reason for it.
        - id: ch01-b06
          speaker: narrator
          text: At that time, I had not discovered exactly where or when they met again, so I could not tell you. Still, I knew they would meet. The Psammead was a creature of its word. When it said something would happen, that thing happened without fail. How unlike the people who tell us what Thursday's weather will be in London, along the South Coast, and over the Channel!
        - id: ch01-b07
          speaker: narrator
          text: Those country holidays, when they found the Psammead and received its wishes, had been wonderful. The children had every hope that the next summer in the country would be just as fine. During the winter holidays, the Phoenix and the Carpet had brought them another set of astonishing adventures. Losing those two treasures might have left them in despair, but they could still look forward to summer. The world seemed full of wonderful things. They had some reason to believe they were exactly the sort of people wonderful things happened to.
        - id: ch01-b08
          speaker: narrator
          text: But when summer came, everything was different and thoroughly horrid. Father had to go to Manchuria to send war news to the tiresome newspaper he worked for, the Daily Bellower, or some such name. Mother had been very ill and was away in Madeira with the baby, whom the children called the Lamb. Aunt Emma had suddenly married Father's brother, Uncle Reginald, and the two of them had gone all the way to China.
        - id: ch01-b09
          speaker: narrator
          text: So the four children were left with old Nurse in Fitzroy Street, near the British Museum. Nurse was always very kind. In fact, she spoiled them more than would be good even for most grown-ups. Yet the children were perfectly miserable. The cab carried Father away with all his boxes and guns. It also carried a sheepskin stuffed with blankets and an aluminum mess kit. Even the bravest heart failed then. Once Father was gone, the girls clung to each other and sobbed. Each boy stood at one of the long, gloomy parlor windows and tried to pretend that no boy would be enough of a muff to cry.
        - id: ch01-b10
          speaker: narrator
          text: They had bravely waited until Father left because he already had enough to upset him. Afterward, though, they all felt as if they had spent their entire lives holding back tears and had to cry now, whatever happened. So they cried.
        - id: ch01-b11
          speaker: narrator
          text: Tea cheered them a little. There were shrimps and watercress, and the watercress made a neat hedge around a fat glass saltcellar. They had never seen that arrangement before. Still, it was not a cheerful meal.
        - id: ch01-b12
          speaker: narrator
          text: After tea, Anthea went upstairs to the room that had been Father's. The emptiness struck her at once. Every minute was taking him farther from her and nearer the Russian guns, and she cried again. Then she thought of Mother, ill and alone, perhaps wishing at that very moment for a little girl to cool her forehead with cologne and make her a sudden cup of tea. Anthea cried harder.
        - id: ch01-b13
          speaker: narrator
          text: Then she remembered what Mother had said before leaving. Anthea was the eldest girl and must try to keep the others happy. So she stopped crying and began to think. When she had thought as long as she could bear, she washed her face, combed her hair, and went downstairs, doing her best to look as if she had never heard of crying.
        - id: ch01-b14
          speaker: narrator
          text: The parlor was sunk in gloom. Robert was trying to pass the time by pulling Jane's hair, not hard, but just enough to annoy her.
        - id: ch01-b15
          speaker: anthea
          text: Listen, everyone. Let's have a palaver.
        - id: ch01-b16
          speaker: narrator
          text: That word came from the dreadful day when Cyril had wished for Red Indians in England and got them. It reminded everyone of the previous summer, and they groaned.
        - id: ch01-b17
          speaker: narrator
          text: They remembered the white house and its tangled garden full of late roses, asters, marigolds, sweet mignonette, and feathery asparagus. They remembered the wild patch that had once been meant for an orchard. Father called it five acres of thistles haunted by the ghosts of baby cherry trees.
        - id: ch01-b18
          speaker: narrator
          text: They pictured the view across the valley, where the limekilns shone like Aladdin's palaces in the sun. They remembered their own sandpit, edged with yellowish grass and pale wildflowers on thin, stringy stalks. Small holes in the cliff were the small sand martins' small front doors. They remembered free, fresh air scented with thyme and sweetbrier, and the smell of woodsmoke drifting from cottages in the lane. Then they looked around Nurse's stuffy parlor.
        - id: ch01-b19
          speaker: jane
          text: Oh, everything is so different here.
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: It certainly was. Nurse had once rented out rooms, and hers were still furnished for lodgers instead of for living. Heavy dark-red curtains hung over coarse lace ones. The carpet was yellow and violet, patched here and there with gray and brown oilcloth. Shavings and tinsel filled the fireplace.
        - id: ch01-b21
          speaker: narrator
          text: A highly polished mahogany sideboard had a lock that refused to work. Far too many hard chairs stood about the room. Crochet covers slipped from their seats, and every seat sloped in the wrong direction. A cruel green cloth covered the table, with a yellow chain-stitched pattern running around its edge. Above the fireplace hung a mirror that made you look much uglier than you truly were, no matter how plain you might have looked to begin with.
        - id: ch01-b22
          speaker: narrator
          text: A board across the mantel was covered in maroon plush and wool fringe that did not even match it. A dreary black clock sat there like a marble tomb. It was as silent as a grave, because it had forgotten how to tick long ago. Painted glass vases never held flowers. No one ever played the painted tambourine, and the painted wall brackets supported nothing. Framed pictures showed the Queen, the Houses of Parliament, the Plains of Heaven, and a blunt-nosed woodman returning home.
        - id: ch01-b23
          speaker: narrator
          text: There were only two books, last December's railway timetable and one stray volume of Plumridge's Commentary on Thessalonians. I cannot bear to describe the room any longer. Jane was right. It was very different.
        - id: ch01-b24
          speaker: anthea
          text: Come on. Let's talk things over.
        - id: ch01-b25
          speaker: cyril
          text: What is there to talk about?
        - id: ch01-b26
          speaker: narrator
          text: Cyril yawned.
        - id: ch01-b27
          speaker: robert
          text: There isn't anything we can do anything about.
        - id: ch01-b28
          speaker: narrator
          text: Robert gave the table leg a miserable kick.
        - id: ch01-b29
          speaker: jane
          text: I don't want to play.
        - id: ch01-b30
          speaker: narrator
          text: Jane sounded thoroughly grumpy. Anthea made a great effort not to lose her temper, and she succeeded.
        - id: ch01-b31
          speaker: anthea
          text: I don't mean to preach or be beastly. I only want to do what Father calls defining the situation. Will you listen?
        - id: ch01-b32
          speaker: cyril
          text: Go ahead.
        - id: ch01-b33
          speaker: narrator
          text: He did not sound eager.
        - id: ch01-b34
          speaker: anthea
          text: We know we're here because Nurse can't leave the poor learned gentleman on the top floor. Father had no one else he could trust with us. And sending Mother to Madeira to get well has cost a great deal.
        - id: ch01-b35
          speaker: narrator
          text: Jane sniffed unhappily.
        - id: ch01-b36
          speaker: anthea
          text: Yes, I know. But let's not keep thinking how horrible it is. We can't do expensive things, but we must do something. There are heaps of places in London we can see for nothing. We're old enough now, and the Lamb isn't here.
        - id: ch01-b37
          speaker: narrator
          text: Jane sniffed even harder.
        - id: ch01-b38
          speaker: anthea
          text: I only mean no one can refuse because of the dear little Lamb. We must make Nurse understand how grown-up we are and let us go out alone. Otherwise, we'll have no fun at all. I say we see everything we can. First, we'll ask Nurse for some bread, go to St. James's Park, and feed the ducks. We only have to persuade her to let us go by ourselves.
        - id: ch01-b39
          speaker: robert
          text: Hurrah for freedom! But she won't agree.
        - id: ch01-b40
          speaker: jane
          text: Yes, she will. I thought of that this morning and asked Father. He said we could go. He even told Nurse. We only have to say where we want to go, and if the place is suitable, she'll let us.
        - id: ch01-b41
          speaker: cyril
          text: Three cheers for Jane thinking ahead! Come on, let's go now.
          emotion: happy
        - id: ch01-b42
          speaker: narrator
          text: And so they went. Nurse only asked them to take care at crossings and get a policeman's help with the difficult ones. The children knew about traffic. They had lived in Camden Town and knew Kentish Town Road, where trams raced up and down at all hours as if they would rather run you over than not.
        - id: ch01-b43
          speaker: narrator
          text: They promised to return before dark. Since it was July, darkness would arrive very late, long after bedtime. With their pockets stuffed full of bread and toast crusts for the ducks, they set off toward St. James's Park. They set off, I repeat, but they never arrived.
        - id: ch01-b44
          speaker: narrator
          text: Many streets lie between Fitzroy Street and St. James's Park. If you choose the right route, you pass a great many shops that are impossible not to stop and examine. The children paused before several windows. Some held gold braid and beads, some pictures and jewelry, and others dresses and hats. They even stopped to see oysters and lobsters. By then, their sorrow did not seem nearly so impossible to bear as it had in the best parlor at Number 300, Fitzroy Street.
        - id: ch01-b45
          speaker: narrator
          text: Presently, one of Robert's remarkable turns led them into a maze of little streets crossing this way and that. These held the most fascinating shops of all, the shops that sold living creatures. Robert had been elected Captain because the girls thought responsibility would be good for him. Robert certainly thought so too. And Cyril could hardly vote against him, because that would have looked like petty jealousy.
        - id: ch01-b46
          speaker: narrator
          text: One window was crowded from top to bottom with cages of beautiful birds. At first the children were delighted. Then they remembered the time they had wished for wings and flown themselves. They knew how desperately unhappy a winged creature must be when it was locked in a cage.
        - id: ch01-b47
          speaker: cyril
          text: Being a caged bird must be perfectly awful. Let's move on.
        - id: ch01-b48
          speaker: narrator
          text: As they walked, Cyril began planning to make his fortune by digging for gold in the Klondike. Then he could buy every caged bird in the world and set it free.
        - id: ch01-b49
          speaker: narrator
          text: The next shop sold cats, but those were caged too. The children wished someone would buy them all and put them on hearthrugs, where cats properly belonged. The dog shop was no happier. Every dog, large or small, was chained or caged. They gazed at the children with sad, pleading eyes and wagged their tails as if begging to be bought, walked, and freed along with all their brothers.
        - id: ch01-b50
          speaker: narrator
          text: Their whines almost shaped the words plainly enough to hear. Only one big Irish terrier did not plead. When Jane stroked him, he growled. From the corner of his eye, he seemed to say that they would not buy him, no one ever would, and he might as well die there in chains.
        - id: ch01-b51
          speaker: narrator
          text: I am not sure the children could have understood all that if they had not once been trapped inside a besieged castle themselves. That experience had taught them exactly how hateful it was to be kept in when you longed with all your heart to get out.
        - id: ch01-b52
          speaker: narrator
          text: Of course, they could not afford any of the dogs. They did ask the price of the very, very smallest one, but it cost sixty-five pounds. The price was so high because it was a Japanese toy spaniel, like the one the Queen had beside her when her portrait was painted while she was still Princess of Wales. If the smallest dog cost all that money, the children supposed the biggest ones must run into thousands of pounds. So they went on.
        - id: ch01-b53
          speaker: narrator
          text: After that, they passed every other bird, cat, and dog shop without stopping. At last they found a shop that seemed to sell only creatures that did not mind their surroundings quite so much. There were goldfish and white mice, sea anemones and other aquarium animals, lizards and toads, hedgehogs and tortoises, and tame rabbits and guinea pigs.
        - id: ch01-b54
          speaker: narrator
          text: They stayed there a long while. One by one, they examined the whole towering arrangement of hutches. They pushed bits of bread between the bars for the guinea pigs. They also wondered whether it might be possible to keep a sandy-colored, double lop-eared rabbit in the basement of the Fitzroy Street house.
        - id: ch01-b55
          speaker: jane
          text: I don't think Nurse would mind very much. Rabbits can be wonderfully tame. It might learn her voice and follow her everywhere.
        - id: ch01-b56
          speaker: cyril
          text: She'd trip over it twenty times a day. Now, a snake would be different.
        - id: ch01-b57
          speaker: robert
          text: There aren't any snakes here. Besides, I've never liked snakes somehow. I wonder why.
        - id: ch01-b58
          speaker: anthea
          text: Worms are just as bad, and so are eels and slugs. Perhaps we don't like anything without legs.
        - id: ch01-b59
          speaker: robert
          text: Father says snakes do have legs, only they're hidden inside.
        - id: ch01-b60
          speaker: anthea
          text: Yes, and he says we have tails hidden inside us. But neither one is any practical use. I can't bear things without legs.
        - id: ch01-b61
          speaker: jane
          text: Too many legs are worse. Just think of centipedes!
          emotion: disgusted
        - id: ch01-b62
          speaker: narrator
          text: They stood talking on the pavement, passing the time and getting rather in the way of everyone who wanted to pass. Cyril rested his elbow on top of a hutch that had seemed empty when they inspected it. At the same time, he tried to awaken the interest of a hedgehog that had curled itself into a ball earlier in their visit. Then a small, soft voice spoke directly beneath his elbow. It spoke quietly, plainly, and unmistakably. This was no squeak or whine that needed translating. It was ordinary English.
        - id: ch01-b63
          speaker: psammead
          text: Buy me. Oh, please buy me!
        - id: ch01-b64
          speaker: narrator
          text: Cyril jumped a full yard away as if someone had pinched him.
        - id: ch01-b65
          speaker: psammead
          text: Come back! Please come back. Bend down and pretend you're tying your bootlace. I can see it's undone, as usual.
        - id: ch01-b66
          speaker: narrator
          text: Cyril obeyed without thinking. He dropped to one knee on the hot, dry, dusty pavement. Then he peered into the darkness of the hutch and found himself face-to-face with the Psammead.
        - id: ch01-b67
          speaker: narrator
          text: It looked much thinner than it had when Cyril last saw it. The creature was dusty and dirty, and its fur hung ragged and untidy. It had hunched itself into a wretched little lump. Its long snail eyes were drawn in so tightly that almost nothing of them could be seen.
        - id: ch01-b68
          speaker: psammead
          text: Listen. I don't think the creature who owns this shop will charge much for me. I've bitten him more than once, and I've tried to look as ordinary as possible. He has never once seen my beautiful, beautiful eyes. Tell the others I'm here, but make them stare at those cheap, common animals while I speak to you.
        - id: ch01-b69
          speaker: psammead
          text: The creature inside mustn't know you care about me. If he does, he'll name a price far beyond what you can pay. I remember how little money you had last summer. Oh, I never dreamed I would be so glad to see you. Never!
          emotion: sad
        - id: ch01-b70
          speaker: narrator
          text: It sniffed. Then it shot out its long eyes so that one tear could fall well clear of its fur.
        - id: ch01-b71
          speaker: psammead
          text: Tell the others, and then I'll explain exactly how to buy me.
        - id: ch01-b72
          speaker: narrator
          text: Cyril pulled his bootlace into a hard knot, stood up, and spoke to the others in a firm voice.
        - id: ch01-b73
          speaker: cyril
          text: Listen carefully. I'm not joking, and I appeal to your honor.
        - id: ch01-b74
          speaker: narrator
          text: No one in the family ever ignored an appeal to honor.
        - id: ch01-b75
          speaker: cyril
          text: Don't look at that hutch. Look at the white rat. Whatever I tell you, you must not turn toward the hutch.
        - id: ch01-b76
          speaker: narrator
          text: He planted himself in front of it so no one could make a mistake.
        - id: ch01-b77
          speaker: cyril
          text: Now, prepare for a tremendous surprise. An old friend is inside that hutch. Don't look! It's the Psammead, our old Psammead, and it wants us to buy it. It says you mustn't stare at it. Keep watching the white rat and count all your money. On your honor, don't look around!
        - id: ch01-b78
          speaker: narrator
          text: The others behaved nobly. They stared so hard at the white rat that they embarrassed it. The rat retreated to a far corner, sat on its hind legs, covered its eyes with its front paws, and pretended to wash its face.
        - id: ch01-b79
          speaker: narrator
          text: Cyril bent down again. He busied himself with his other bootlace and listened for the Psammead's next instructions.
        - id: ch01-b80
          speaker: psammead
          text: Go inside and ask the prices of several other creatures. Then ask what he wants for the tailless monkey, the mangy old thing in the third hutch from the end. Don't worry about hurting my feelings. Call me a mangy monkey. I've worked hard to look like one! I doubt he'll charge much, because I've bitten him eleven times since I arrived the day before yesterday. If his price is more than you can pay, say you wish you had the money.
        - id: ch01-b81
          speaker: cyril
          text: But you can't grant us wishes. I promised never to take another wish from you.
        - id: ch01-b82
          speaker: psammead
          text: Don't be a silly little idiot. Just find out how much money you have altogether, and do exactly as I say.
        - id: ch01-b83
          speaker: narrator
          text: Though the Sand-fairy's voice trembled, it sounded affectionate as it scolded him. Cyril rose and pointed one stiff, meaningless finger at the white rat. This was meant to make it seem as if the rat's charms alone gave him something to talk about. While keeping up that pretense, he explained the plan to the others. Meanwhile, the Psammead hunched and bunched itself and did everything possible to look uninteresting.
        - id: ch01-b84
          speaker: narrator
          text: Then all four children filed into the shop.
        - id: ch01-b85
          speaker: cyril
          text: How much is the white rat?
        - id: ch01-b86
          speaker: shopkeeper
          text: Eightpence.
        - id: ch01-b87
          speaker: cyril
          text: And the guinea pigs?
        - id: ch01-b88
          speaker: shopkeeper
          text: Eighteenpence up to five shillings, depending on the breed.
        - id: ch01-b89
          speaker: cyril
          text: What about the lizards?
        - id: ch01-b90
          speaker: shopkeeper
          text: Ninepence each.
        - id: ch01-b91
          speaker: cyril
          text: And the toads?
        - id: ch01-b92
          speaker: shopkeeper
          text: Fourpence. Now, listen to me. I won't have you coming in, turning my shop upside down, and asking the price of every animal just for a joke. If you mean to buy, then buy. No customer wants mice, lizards, toads, and guinea pigs all at once. Out you go!
          emotion: angry
        - id: ch01-b93
          speaker: narrator
          text: The greasy owner of all that caged life had suddenly turned so fierce that the whole party hurried backward against the wooden wall of hutches lining the shop. Poor Cyril felt wretched. He knew he had carried out the Psammead's instructions with the best intentions, yet he had somehow managed to do it very foolishly.
        - id: ch01-b94
          speaker: cyril
          text: Wait just one moment. Tell me this. How much do you want for that mangy old monkey in the third hutch from the end?
        - id: ch01-b95
          speaker: narrator
          text: The shopkeeper took that as one more insult.
        - id: ch01-b96
          speaker: shopkeeper
          text: You're the mangy young monkey! Take your cheek and get out!
          emotion: angry
        - id: ch01-b97
          speaker: jane
          text: Oh, please don't be so cross. Can't you see he truly wants to know about that one?
        - id: ch01-b98
          speaker: narrator
          text: Jane had completely lost her head.
        - id: ch01-b99
          speaker: shopkeeper
          text: Oh, does he now?
        - id: ch01-b100
          speaker: narrator
          text: The man sneered, then scratched his ear and grew suspicious. He was a sharp businessman, and he recognized the sound of truth when he heard it. One of his hands was wrapped in a bandage. Only three minutes earlier, he would gladly have sold the mangy old monkey for ten shillings. But now he understood that the children truly wanted it, and his price changed at once.
        - id: ch01-b101
          speaker: shopkeeper
          text: So he does, eh? Then my price is two pounds ten. There's no other monkey like him anywhere this side of the equator, where he comes from. He's the only one ever seen in London and ought to be in the Zoo. Two pounds ten, paid at once, or out you go!
        - id: ch01-b102
          speaker: narrator
          text: The children looked helplessly at one another. All the money they possessed in the world came to twenty-three shillings and fivepence. Even that was an unusually large sum for them. Without the whole sovereign Father had given them to share when he said goodbye, their combined fortune would have been only three shillings and fivepence.
        - id: ch01-b103
          speaker: cyril
          text: We only have twenty-three shillings and fivepence.
        - id: ch01-b104
          speaker: narrator
          text: He rattled the coins in his pocket.
        - id: ch01-b105
          speaker: shopkeeper
          text: Twenty-three farthings and plenty of cheek, more likely.
        - id: ch01-b106
          speaker: narrator
          text: The dealer did not believe for a moment that Cyril truly had so much money in his pocket. No one knew what to say next. A miserable silence filled the shop. Then Anthea suddenly remembered the Psammead's last and most important instruction.
        - id: ch01-b107
          speaker: anthea
          text: Oh, I wish I had two pounds ten.
        - id: ch01-b108
          speaker: shopkeeper
          text: So do I, miss. I certainly wish you did.
        - id: ch01-b109
          speaker: narrator
          text: Anthea's hand rested on the counter. Something seemed to slide beneath it. She lifted her hand, and there lay five shining half sovereigns.
        - id: ch01-b110
          speaker: anthea
          text: Why, I do have it after all! Here's your money. Now give us the Sammy... I mean, the monkey.
          emotion: surprised
        - id: ch01-b111
          speaker: narrator
          text: The dealer examined the coins closely but lost no time putting them in his pocket.
        - id: ch01-b112
          speaker: shopkeeper
          text: I only hope you got that money honestly.
        - id: ch01-b113
          speaker: narrator
          text: He shrugged and scratched his ear once more.
        - id: ch01-b114
          speaker: shopkeeper
          text: Well, I suppose I must sell him. But he's worth three times the price, mind you.
        - id: ch01-b115
          speaker: narrator
          text: He led them slowly to the hutch and opened its door with care. Then he made a sudden, savage grab. The Psammead answered with one last, long, lingering bite.
        - id: ch01-b116
          speaker: shopkeeper
          text: Here, take the brute! He bit me right to the bone.
          emotion: angry
        - id: ch01-b117
          speaker: narrator
          text: The man squeezed the Psammead so tightly that it nearly choked. His eyes widened when Anthea held out her arms.
        - id: ch01-b118
          speaker: shopkeeper
          text: Don't blame me when it tears the flesh off your face.
        - id: ch01-b119
          speaker: narrator
          text: The Psammead made one quick leap from his dirty, rough hands straight into Anthea's waiting arms. Her own hands were certainly not very clean after the day's walk. At least they were soft and pink, and she held the poor creature kindly and close against her.
        - id: ch01-b120
          speaker: cyril
          text: We can't carry it home in your arms. Everyone will follow us.
        - id: ch01-b121
          speaker: narrator
          text: Two errand boys and a policeman had already gathered to watch.
        - id: ch01-b122
          speaker: shopkeeper
          text: All I can give you is a paper bag, the kind we use for tortoises.
        - id: ch01-b123
          speaker: narrator
          text: The whole party returned to the shop. The shopkeeper searched until he found the largest paper bag he had. Anthea held its mouth open. To the man's amazement, the Psammead did not struggle or bite. It carefully crawled into the bag by itself. The shopkeeper's eyes nearly popped from his head at the sight.
        - id: ch01-b124
          speaker: shopkeeper
          text: Well, that beats everything! Perhaps you've met the brute before.
          emotion: surprised
        - id: ch01-b125
          speaker: cyril
          text: Yes. He's an old friend of ours.
        - id: ch01-b126
          speaker: shopkeeper
          text: If I'd known that, you wouldn't have got him for less than twice the price.
        - id: ch01-b127
          speaker: narrator
          text: With the Psammead safely inside its paper bag, the children left the shop and disappeared down the street.
        - id: ch01-b128
          speaker: shopkeeper
          text: Still, I haven't done badly. I paid only five shillings for the beast, though I suppose the bites count for something.
        - id: ch01-b129
          speaker: narrator
          text: Trembling with excitement, the children carried the Psammead home. It trembled inside its paper bag too.
        - id: ch01-b130
          speaker: narrator
          text: Once they were safely home, Anthea took the Psammead out, cradled it, and gently stroked its poor untidy fur. She felt so sorry for it that she would have cried over it, if she had not remembered how much it hated being made wet.
        - id: ch01-b131
          speaker: psammead
          text: Bring me sand. Get silver sand from the oil and paint shop, and bring plenty of it.
        - id: ch01-b132
          speaker: narrator
          text: The children fetched plenty of silver sand and poured it into the round bath. Then they put the Psammead in with it. The creature rubbed itself in the sand and rolled over and over. It shook, scraped, scratched, and carefully preened its fur until it felt clean and comfortable again. At once, it scrabbled out a quick hole in the sand, climbed into it, and went to sleep.
        - id: ch01-b133
          speaker: narrator
          text: The children hid the bath beneath the girls' bed and went to supper. Nurse had prepared bread and butter with fried onions, a lovely meal. She was always full of kind and thoughtful ideas.
        - id: ch01-b134
          speaker: narrator
          text: When Anthea woke the next morning, she discovered that the Psammead had left the sand during the night. It was now nestled warmly in the bed between her shoulder and Jane's.
        - id: ch01-b135
          speaker: psammead
          text: You saved my life. Sooner or later, that man would have poured cold water over me, and I would have died. Yesterday morning, I watched him wash out a guinea pig's hutch. I'm still terribly sleepy, so I think I'll return to the sand for another nap. Wake the boys and this dormouse Jane. After you've eaten breakfast, we'll talk.
        - id: ch01-b136
          speaker: anthea
          text: Don't you want any breakfast?
        - id: ch01-b137
          speaker: psammead
          text: I may nibble something later. But sand is all I truly care for. To me, sand is food and drink, coal and fire, wife and children, all together.
        - id: ch01-b138
          speaker: narrator
          text: With that, it climbed down the bedclothes and scrambled back into the bath. The children heard it scratching until it had buried itself out of sight.
        - id: ch01-b139
          speaker: anthea
          text: Well, our holidays won't be dull now. We've found the Psammead again.
          emotion: happy
        - id: ch01-b140
          speaker: narrator
          text: Jane began pulling on her stockings.
        - id: ch01-b141
          speaker: jane
          text: No, we won't be dull. But if it can't grant wishes, having it will be no different from keeping a pet dog.
        - id: ch01-b142
          speaker: anthea
          text: Oh, don't be so dissatisfied. Even if it can do nothing else, it can tell us about megatheriums and creatures like that.
