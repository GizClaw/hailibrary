  chapters:
    - id: ch01
      title: ATLANTIS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Only one of the children's adventures had taken any time in London, and that was the Babylonian queen's visit. In the Past, the Amulet let them live through hours and hours of wonders. Yet each time they returned, the whole journey had passed at home in less than a lightning flash. Even so, their days were full, because they never stopped talking over everything they had seen and done.
        - id: ch01-b02
          speaker: narrator
          text: They talked at meals and on walks, in the dining room and the first-floor drawing room, but most of all on the stairs. The old house had once been fashionable and was still a fine place. Its banisters were excellent for sliding down. At the corners of the landings were large alcoves, once occupied by elegant statues. Now they quite often displayed the graceful figures of Cyril, Robert, Anthea, and Jane instead.
        - id: ch01-b03
          speaker: narrator
          text: One day, Cyril and Robert spent a happy hour posing as statues in tight white underclothes. They copied figures from the British Museum and Father's big book of photographs. Then Robert decided to become the Venus of Milo and tugged at the sheet they were using as drapery. At that exact moment, Cyril was balancing on one foot upon the sheet, looking remarkably like the Discobolos and holding a gold-and-white saucer for the discus.
        - id: ch01-b04
          speaker: narrator
          text: Down came the Discobolos, his discus, and the would-be Venus, all together. Everyone was badly hurt, especially the saucer. However carefully its uneven pieces might be joined with Seccotine or the white of an egg, it could never be quite the same again.
        - id: ch01-b05
          speaker: cyril
          text: Well, I hope you're satisfied.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Cyril held his head where a large lump was rising.
        - id: ch01-b07
          speaker: robert
          text: Oh, perfectly. Thanks.
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Robert's thumb had caught in the banisters and bent backward until it had nearly broken.
        - id: ch01-b09
          speaker: anthea
          text: Oh, poor dear Squirrel, I am so sorry. And you looked wonderful. I'll fetch a wet cloth. Bobs, put your hand under the hot-water tap. Ballet girls do that when they hurt their legs. I read it in a book.
        - id: ch01-b10
          speaker: robert
          text: What book was that?
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: Robert asked as disagreeably as he could, though he went all the same. When he returned, his sisters had bandaged Cyril's head. Cyril had also calmed down enough to admit, rather unwillingly, that Robert probably had not caused the fall on purpose. Robert answered with equal sweetness, so Anthea quickly changed the subject.
        - id: ch01-b12
          speaker: anthea
          text: I suppose neither of you feels like going anywhere through the Amulet.
        - id: ch01-b13
          speaker: jane
          text: Egypt! I want to see the pussy cats.
        - id: ch01-b14
          speaker: cyril
          text: Not me. Egypt is too hot. It's almost more than I can bear here, and this landing is the coolest place in the house. Let's go to the North Pole.
        - id: ch01-b15
          speaker: robert
          text: The Amulet probably never went there. Besides, our fingers might freeze so badly that we couldn't hold it up to get home. No, thank you.
        - id: ch01-b16
          speaker: jane
          text: Let's bring up the Psammead and ask what it thinks. It'll enjoy being asked, even if we don't follow its advice.
        - id: ch01-b17
          speaker: narrator
          text: They brought the Psammead upstairs in its embroidered green silk bag. Before they could ask it anything, the learned gentleman's door opened. A visitor who had lunched with him stood on the stairs, apparently still talking with one hand on the door handle.
        - id: ch01-b18
          speaker: visitor
          text: Go and see a doctor, old boy. All that thought-transference business is complete nonsense. You've worked too hard. Take a holiday. Go to Dieppe.
        - id: ch01-b19
          speaker: learned_gentleman
          text: I would much rather go to Babylon.
        - id: ch01-b20
          speaker: visitor
          text: Then I wish you'd go to Atlantis while you're at it. You could bring me some useful hints for my Nineteenth Century article.
        - id: ch01-b21
          speaker: learned_gentleman
          text: I wish I could.
        - id: ch01-b22
          speaker: visitor
          text: Goodbye, then. Take care of yourself.
        - id: ch01-b23
          speaker: narrator
          text: The door banged. The visitor came smiling down the stairs, a large, stout, prosperous man. The children had to stand so he could pass. He glanced at the bandages on Cyril's head and Robert's hand.
        - id: ch01-b24
          speaker: visitor
          text: Hello, children. Have you been in the wars?
        - id: ch01-b25
          speaker: cyril
          text: We're all right. But what was that Atlantic place you wanted him to visit? We couldn't help hearing.
        - id: ch01-b26
          speaker: jane
          text: You do speak very loudly, you see.
        - id: ch01-b27
          speaker: visitor
          text: Atlantis. The lost Atlantis, the garden of the Hesperides. It was a great continent, and it vanished beneath the sea. You can read about it in Plato.
        - id: ch01-b28
          speaker: cyril
          text: Thank you.
        - id: ch01-b29
          speaker: narrator
          text: Cyril sounded doubtful, but Anthea had been struck by a sudden worry.
        - id: ch01-b30
          speaker: anthea
          text: Were there any Amulets in Atlantis?
        - id: ch01-b31
          speaker: visitor
          text: Hundreds, I should imagine. Has he been talking to you, then?
        - id: ch01-b32
          speaker: anthea
          text: Often. He's very kind to us, and we like him tremendously.
        - id: ch01-b33
          speaker: visitor
          text: What he needs is a holiday and a change of scene. His head is packed so thick with facts about Egypt and Assyria that you must hammer away all day, for days, before you can get a new idea into it. I haven't the time, but you live here. You can keep hammering almost constantly. Give it a try, will you? Good. So long!
        - id: ch01-b34
          speaker: narrator
          text: He took the stairs three at a time. Jane said he seemed nice and probably had little girls of his own.
        - id: ch01-b35
          speaker: jane
          text: I wish they could come and play with us.
        - id: ch01-b36
          speaker: narrator
          text: The three older children exchanged looks, and Cyril nodded.
        - id: ch01-b37
          speaker: cyril
          text: All right. Let's go to Atlantis.
        - id: ch01-b38
          speaker: anthea
          text: And let's take the learned gentleman. He'll believe it was a dream afterward, but at least it will give him a change of scene.
        - id: ch01-b39
          speaker: jane
          text: Why don't we take him to lovely Egypt?
        - id: ch01-b40
          speaker: cyril
          text: Too hot.
        - id: ch01-b41
          speaker: jane
          text: What about Babylon? He wants to go there.
        - id: ch01-b42
          speaker: robert
          text: I've had enough of Babylon for now, and so have the others. I don't know why, but we have. Squirrel, let's get rid of these horrible bandages and put on our flannels. We can't travel in our underclothes.
        - id: ch01-b43
          speaker: anthea
          text: He wished to visit Atlantis, so he has to get there sometime. He may as well come with us.
        - id: ch01-b44
          speaker: narrator
          text: The learned gentleman had settled into his chair for a few minutes of rest. He was tired after hearing a great many opinions about Atlantis, and other subjects, with which he did not agree at all. When he opened his eyes, his four young friends stood before him in a row.
        - id: ch01-b45
          speaker: anthea
          text: Would you like to come to Atlantis with us?
        - id: ch01-b46
          speaker: narrator
          text: The learned gentleman told himself that once you knew you were dreaming, the dream must be nearly over. Unless, perhaps, this was only a game, like How Many Miles to Babylon?
        - id: ch01-b47
          speaker: learned_gentleman
          text: Thank you very much, but I can spare only fifteen minutes.
        - id: ch01-b48
          speaker: cyril
          text: It won't take any time. Time is only a mode of thought, you know. And since you've got to go sometime, why not come with us?
        - id: ch01-b49
          speaker: learned_gentleman
          text: Very well.
        - id: ch01-b50
          speaker: narrator
          text: By now he felt certain he was dreaming. Anthea offered her soft pink hand, and when he took it, she gently pulled him to his feet. Jane raised the Amulet, ready to open the way into the Past.
        - id: ch01-b51
          speaker: cyril
          text: Take us just outside Atlantis.
        - id: ch01-b52
          speaker: narrator
          text: Jane spoke the Name of Power.
        - id: ch01-b53
          speaker: robert
          text: You owl! Atlantis is an island. Outside an island is water.
        - id: ch01-b54
          speaker: psammead
          text: I won't go! I will not!
          emotion: fearful
        - id: ch01-b55
          speaker: narrator
          text: The Psammead kicked and struggled inside its bag, but the Amulet had already grown into a great arch. As the undoubted first-born, Cyril took charge and pushed the learned gentleman through. He landed not in water but on a wooden floor in the open air. The children followed, the arch shrank behind them, and they found themselves together on the deck of a ship.
        - id: ch01-b56
          speaker: narrator
          text: Sailors hurried to fasten the vessel with chains to great rings set into a white quay. The chains and rings shone with the red-yellow gleam of gold. At first, everyone aboard was far too busy to notice the visitors from Fitzroy Street. Men who looked like officers called orders while the crew worked around them.
        - id: ch01-b57
          speaker: narrator
          text: Beyond the broad quay rose the most beautiful city any of them had ever seen, or even imagined in dreams. The blue sea sparkled in gentle sunlight. Small white-capped waves washed softly against marble breakwaters, which guarded the shipping of the great city from the wilderness of winter winds and seas.
        - id: ch01-b58
          speaker: narrator
          text: The marble quay was white and sparkling, veined with a brightness like gold. Beyond it, red-and-white marble buildings climbed the hills. The greater palaces and temples seemed to carry roofs of gold and silver. On most houses, copper roofs glowed golden-red. Where sea spray and the fumes from the dye works and smelting works had touched them, they shaded into marvelous greens, blues, and purples.
        - id: ch01-b59
          speaker: narrator
          text: Magnificent flights of marble steps climbed from the quay to a terrace that seemed to stretch for miles. The city rose higher still behind it. The learned gentleman drew a long breath.
        - id: ch01-b60
          speaker: learned_gentleman
          text: Wonderful! Simply wonderful!
          emotion: surprised
        - id: ch01-b61
          speaker: robert
          text: I say, Mister... What is your name?
        - id: ch01-b62
          speaker: anthea
          text: He means we can never remember it. I know it's Mister De-something.
        - id: ch01-b63
          speaker: learned_gentleman
          text: When I was your age, people called me Jimmy. Would you mind doing that? In a dream like this, I would feel more at home if something made me seem like one of you.
        - id: ch01-b64
          speaker: anthea
          text: Thank you, Jimmy. Jimmy, dear.
        - id: ch01-b65
          speaker: narrator
          text: Calling a grown man Jimmy seemed terribly bold at first. Adding dear was easy, though, and Jimmy smiled with pleasure.
        - id: ch01-b66
          speaker: narrator
          text: The ship was secure now, and its captain had time to notice other things. He came toward the strangers in exactly the best sort of clothing anyone could choose for a life at sea. Until then, he had been far too occupied with bringing his vessel safely alongside the quay to wonder how five people had suddenly appeared on his deck.
        - id: ch01-b67
          speaker: captain
          text: What are you doing aboard my ship? Have you come to bless us or curse us?
          emotion: angry
        - id: ch01-b68
          speaker: cyril
          text: To bless you, naturally. Sorry if our arrival is inconvenient, but we came by magic from the land where the sun rises.
        - id: ch01-b69
          speaker: captain
          text: I understand. I failed to notice it at once, but I hope you are a good omen. We need one. And I suppose this man is your slave?
        - id: ch01-b70
          speaker: anthea
          text: Certainly not. He's a very great man. A sage, I think you'd call him. We want to see your beautiful city and its temples. Then we'll go home, and he'll tell his friend, and his friend will write a book about it.
        - id: ch01-b71
          speaker: captain
          text: What is a book?
        - id: ch01-b72
          speaker: anthea
          text: It's a record. Something written down, or engraved.
        - id: ch01-b73
          speaker: narrator
          text: Remembering Babylonian writing, Anthea added the last word just in time. Then a sudden feeling of trust made Jane pull the Amulet from beneath the neck of her dress.
        - id: ch01-b74
          speaker: jane
          text: Engraved like this.
        - id: ch01-b75
          speaker: narrator
          text: The captain examined it with interest, but the other children were relieved that he showed none of the overwhelming excitement its very name had caused in Egypt and Babylon.
        - id: ch01-b76
          speaker: captain
          text: This stone comes from our country. The marks resemble our writing, though I cannot read them. What is the sage called?
        - id: ch01-b77
          speaker: anthea
          text: His name is Ji-Jimmy.
        - id: ch01-b78
          speaker: captain
          text: Ji-Jimmy. Will you come ashore? Shall I conduct you to the Kings?
        - id: ch01-b79
          speaker: robert
          text: Before we go, do your Kings hate strangers?
        - id: ch01-b80
          speaker: captain
          text: We have ten Kings. Their unbroken royal line descends from Poseidon, father of us all, and tradition commands them to honor every stranger who comes in peace.
        - id: ch01-b81
          speaker: robert
          text: Then please lead the way. Though I would love to explore this beautiful ship and sail in her.
        - id: ch01-b82
          speaker: captain
          text: You may do that later. We fear a storm just now. Can you hear that strange rumbling?
        - id: ch01-b83
          speaker: old_sailor
          text: It's nothing, master. Only the pilchards coming in.
        - id: ch01-b84
          speaker: captain
          text: The sound is too loud for that.
        - id: ch01-b85
          speaker: narrator
          text: After an uneasy pause, the captain stepped onto the quay, and the visitors followed.
        - id: ch01-b86
          speaker: anthea
          text: Talk to him, Jimmy. You can discover all sorts of things for your friend's book.
        - id: ch01-b87
          speaker: learned_gentleman
          text: Please forgive me. If I speak, I may wake up. Besides, I cannot understand a word he says.
        - id: ch01-b88
          speaker: narrator
          text: No one else found anything to say. In complete silence, they followed the captain up the broad marble steps and into the town. Street after street opened before them, lined with houses and shops. They passed busy markets as they climbed farther from the harbor.
        - id: ch01-b89
          speaker: jane
          text: It's just like Babylon, except that everything is completely different.
        - id: ch01-b90
          speaker: anthea
          text: At least the ten Kings were properly taught to be kind to strangers.
        - id: ch01-b91
          speaker: cyril
          text: Yes. No deepest dungeons this time.
        - id: ch01-b92
          speaker: narrator
          text: There were no horses or chariots in the streets. Instead, handcarts and low trolleys rolled on thick log wheels, while porters carried bundles on their heads. Many other people rode beasts that looked like elephants. These creatures were covered in hair, though, and their faces lacked the gentle expression everyone knew from the elephants at the Zoo.
        - id: ch01-b93
          speaker: learned_gentleman
          text: Those animals are mammoths!
          emotion: surprised
        - id: ch01-b94
          speaker: narrator
          text: Jimmy stumbled over a loose stone. Crowds gathered around the strangers, but whenever they became too thick, the captain sent them back with an announcement.
        - id: ch01-b95
          speaker: captain
          text: Make way for the Children of the Sun God and their High Priest. They have come to bless our city.
        - id: ch01-b96
          speaker: narrator
          text: The people drew aside with a low murmur, almost like a cheer held under the breath. Gold covered many of the buildings, but on the larger ones the shining metal was a different color. Above those roofs rose structures rather like church steeples, made of brightly polished silver.
        - id: ch01-b97
          speaker: jane
          text: Are all these houses made of real gold?
        - id: ch01-b98
          speaker: captain
          text: The temples are covered in gold, of course. The houses use only oricalchum. It costs less.
        - id: ch01-b99
          speaker: narrator
          text: Jimmy had turned very pale. He staggered on, dazed by what he had heard.
        - id: ch01-b100
          speaker: learned_gentleman
          text: Oricalchum. Oricalchum.
        - id: ch01-b101
          speaker: anthea
          text: Don't be frightened. We can go home in a moment by raising the charm. Would you rather leave now? We can always return without you another day.
        - id: ch01-b102
          speaker: learned_gentleman
          text: Oh, no. Please let the dream continue. Please!
        - id: ch01-b103
          speaker: captain
          text: Perhaps the High Ji-Jimmy is tired after his magical journey. We still have a long way to go before we reach the Great Temple, where the Kings offer sacrifice today.
        - id: ch01-b104
          speaker: narrator
          text: The captain stopped beside the gate of a large enclosure. Trees rose high above its bronze wall, making the place look like a park hidden from the street. The party waited outside while he went in. Almost at once, he returned leading one of the hairy elephants and invited all five visitors to climb onto its back.
        - id: ch01-b105
          speaker: narrator
          text: The ride was glorious. Riding the elephant at the Zoo was glorious too, but that elephant traveled only a very short way before turning back, and turning back was always dull. This huge hairy creature carried them on and on, along streets and through squares and gardens. The glorious city seemed to be built almost entirely of red, white, or black marble. Again and again, their path crossed a bridge.
        - id: ch01-b106
          speaker: narrator
          text: Only when the mammoth had carried them up the hill at the city's center could they understand its astonishing shape. The whole of Atlantis was divided into twenty circles, with one ring of land followed by one of water, over and over again. The bridges they had crossed joined the land across every ring of water.
        - id: ch01-b107
          speaker: narrator
          text: At the top, they entered a great square. A vast building filled one entire side. Gold covered its walls, and a silver dome rose above it. Buildings of oricalchum surrounded the other sides. The whole square stood bold and brilliant beneath the sun, more splendid than anyone who had not seen it could possibly imagine.
        - id: ch01-b108
          speaker: captain
          text: You will want a bath before entering the royal Presence. That is our custom. We have baths for men, women, horses, and cattle. These are the High Class Baths. Father Poseidon gave us one spring of hot water and another of cold.
        - id: ch01-b109
          speaker: narrator
          text: The mammoth folded its legs and went clumsily down on its knees. Soon the children were bathing in what looked like pools of gold, something none of them had ever done before. The great bathing hall held several pools sunk below the level of the floor. Broad steps led down into the hot and cold water.
        - id: ch01-b110
          speaker: cyril
          text: This feels wonderfully grand.
        - id: ch01-b111
          speaker: robert
          text: Except it isn't gold, of course. It's ori... whatever the stuff is called. Pass me that towel.
        - id: ch01-b112
          speaker: narrator
          text: They met afterward in the Public Baths' flower-filled courtyard, scrubbed clean and looking rather boiled. Anthea spoke timidly to Jimmy.
        - id: ch01-b113
          speaker: anthea
          text: Doesn't this place seem much more like our own time than Babylon or Egypt? Oh, I forgot. You haven't visited either of those.
        - id: ch01-b114
          speaker: learned_gentleman
          text: I do know a little about those nations, and I quite agree. That is a remarkably discerning observation, my dear. This city clearly represents a much higher level of civilization than Egypt or Babylon, and...
        - id: ch01-b115
          speaker: captain
          text: Follow me. Boys, move out of our way.
        - id: ch01-b116
          speaker: narrator
          text: He pushed through a small group of boys playing with dried chestnuts tied to strings.
        - id: ch01-b117
          speaker: robert
          text: Ginger! They're playing conkers, just like the boys on Kentish Town Road!
          emotion: surprised
        - id: ch01-b118
          speaker: narrator
          text: They could now see three walls around the island where they stood. The captain explained that the outer wall was brass. The next shone like silver because it was coated with tin. The innermost one was oricalchum. At the very center stood yet another wall, entirely of gold, with golden gates and golden towers rising above it.
        - id: ch01-b119
          speaker: captain
          text: There stand the Temples of Poseidon. I am forbidden to enter, so I will wait here until you return.
        - id: ch01-b120
          speaker: narrator
          text: The captain taught them what to say. Then the five visitors from Fitzroy Street joined hands and walked forward. The golden gates slowly opened.
        - id: ch01-b121
          speaker: cyril
          text: We are the Children of the Sun, and this is our High Priest. At least, that is what the captain calls him. We use another name at home.
        - id: ch01-b122
          speaker: priest
          text: What is his name?
        - id: ch01-b123
          speaker: narrator
          text: A white-robed man stood in the doorway with both arms extended.
        - id: ch01-b124
          speaker: cyril
          text: Ji-Jimmy. We've come to speak to your Kings in the Temple of Poseidon. Did I pronounce Poseidon correctly?
        - id: ch01-b125
          speaker: learned_gentleman
          text: Perfectly. How strange that I understand you when you speak to them, but cannot understand their answers.
        - id: ch01-b126
          speaker: cyril
          text: The Queen of Babylon had the same trouble. It's part of the magic.
        - id: ch01-b127
          speaker: learned_gentleman
          text: What an extraordinary dream!
          emotion: surprised
        - id: ch01-b128
          speaker: narrator
          text: Other white-robed priests had joined the first, and all of them bowed low.
        - id: ch01-b129
          speaker: priest
          text: Enter, Children of the Sun. Enter with your High Ji-Jimmy.
        - id: ch01-b130
          speaker: narrator
          text: Beyond them was an inner courtyard, and there stood the Temple itself. Its walls were all silver, while its doors and soaring pinnacles were gold. Twenty enormous statues of men and women, each made of bright gold, stood around it. Beside them rose one immense pillar made from the other precious yellow metal, oricalchum.
        - id: ch01-b131
          speaker: narrator
          text: The priest led them through the doors and up a staircase to a gallery overlooking the magnificent chamber.
        - id: ch01-b132
          speaker: priest
          text: The ten Kings are choosing the bull at this very moment. I am not permitted to watch.
        - id: ch01-b133
          speaker: narrator
          text: He dropped facedown outside the gallery. The children peered below. Ivory covered the roof, decorated with gold, silver, and oricalchum, while the walls were lined with the Atlanteans' favorite metal.
        - id: ch01-b134
          speaker: narrator
          text: At the far end stood a group of statues unlike anything any living person has ever seen. The chief figure was Poseidon, Father of the City. Made entirely of gold, he towered so high that his head touched the roof. He stood in a vast chariot drawn by six enormous horses, while all around him a hundred mermaids rode upon dolphins.
        - id: ch01-b135
          speaker: narrator
          text: About fifteen bulls raced wildly this way and that across the Temple floor. Ten splendidly dressed men, armed only with ropes and sticks, tried to capture one of them. The children held their breath. The bulls looked dangerous, and their great horned heads swung more and more wildly as the chase went on.
        - id: ch01-b136
          speaker: narrator
          text: Anthea disliked watching them. She looked around the gallery instead and saw a staircase rising to another floor. A door also opened onto what seemed to be an outdoor balcony.
        - id: ch01-b137
          speaker: narrator
          text: A shout rose from below.
        - id: ch01-b138
          speaker: robert
          text: They've caught one!
        - id: ch01-b139
          speaker: narrator
          text: The other bulls were driven from the Temple with whips. The ten Kings followed them, and one King prodded a struggling black bull held tight in a lasso.
        - id: ch01-b140
          speaker: robert
          text: Now we won't see what happens next.
        - id: ch01-b141
          speaker: anthea
          text: Yes, we will. There's a balcony outside.
        - id: ch01-b142
          speaker: narrator
          text: They all crowded onto it, but the girls soon slipped back indoors.
        - id: ch01-b143
          speaker: jane
          text: I don't like sacrifices.
        - id: ch01-b144
          speaker: narrator
          text: Jane and Anthea went to speak with the priest. He had stopped lying on his face and now sat on the top step, wiping his forehead with his robe because the day was hot.
        - id: ch01-b145
          speaker: priest
          text: This is a special sacrifice. Usually it happens only on the days of justice, every five years and then every six. The Kings drink wine mixed with a little of the bull's blood and swear to judge honestly. They wear sacred blue robes, and every fire in the Temple is put out.
        - id: ch01-b146
          speaker: priest
          text: Today's sacrifice is different. The city is troubled by strange sounds from the sea and by the god inside the great mountain speaking in his voice of thunder. But those things have happened many times. They would not make me uneasy. If anything could do that, it would be the lemmings.
        - id: ch01-b147
          speaker: jane
          text: What would make the lemmings frightening? Are they enemies?
        - id: ch01-b148
          speaker: priest
          text: They are a kind of rat. Each year they swim here from a land no man knows. They stay for a while, and then swim away. This year they never came. Rats will not remain aboard a ship that is going to sink. If some horror were coming to Atlantis, I believe the lemmings would know. Perhaps that is why they have avoided us.
        - id: ch01-b149
          speaker: psammead
          text: What is this country called?
        - id: ch01-b150
          speaker: narrator
          text: The Psammead had suddenly poked its head out of the bag.
        - id: ch01-b151
          speaker: priest
          text: This country is called Atlantis.
        - id: ch01-b152
          speaker: psammead
          text: Then I advise you to find the highest ground you can. I remember hearing about a flood in this place. Anthea, let's go home. Things are looking much too wet for my whiskers.
        - id: ch01-b153
          speaker: narrator
          text: The girls obediently left the priest and returned to the outdoor balcony, where their brothers were still leaning over the railing and watching everything below.
        - id: ch01-b154
          speaker: anthea
          text: Where is the learned gentleman?
        - id: ch01-b155
          speaker: priest
          text: Down there. Your High Ji-Jimmy is with the Kings.
        - id: ch01-b156
          speaker: narrator
          text: The ten Kings were no longer alone. No one had noticed how he got there, but Jimmy now stood beside them on the steps of an altar. The body of the black bull lay upon it after the sacrifice. Every other part of the courtyard was packed with people who seemed to come from every class in the city. All of them cried the same words.
        - id: ch01-b157
          speakers: [captain, old_sailor, priest]
          ensemble: chorus
          text: The sea! The sea!
          emotion: fearful
        - id: ch01-b158
          speaker: king
          text: Be calm! Our city is strong enough to withstand the thunder of sea and sky.
          emotion: calm
        - id: ch01-b159
          speaker: psammead
          text: I want to go home.
          emotion: fearful
        - id: ch01-b160
          speaker: anthea
          text: We cannot leave without him.
        - id: ch01-b161
          speaker: anthea
          text: Jimmy! Jimmy!
        - id: ch01-b162
          speaker: narrator
          text: She waved. Jimmy heard and began pushing toward her through the crowd. From the balcony, they saw the sea captain forcing his way clear of the people. His face was as white as paper.
        - id: ch01-b163
          speaker: captain
          text: Run for the hills!
          emotion: fearful
        - id: ch01-b164
          speaker: narrator
          text: His terrible shout was drowned by something louder and more terrible, the voice of the sea. The girls looked toward the water. Across its smooth surface, something vast and black rolled toward Atlantis. It was a wave a hundred feet high, like a mountain rising higher and higher.
        - id: ch01-b165
          speaker: narrator
          text: Suddenly the wave seemed to split in two. Half rushed back toward the open sea. The other half raced toward the city.
        - id: ch01-b166
          speaker: anthea
          text: Oh, the city! Those poor people!
          emotion: fearful
        - id: ch01-b167
          speaker: robert
          text: Remember, this all happened thousands of years ago.
          emotion: fearful
        - id: ch01-b168
          speaker: narrator
          text: Robert's voice shook. For a moment they covered their eyes, unable to look. The wave smashed across the city. It swallowed the docks, quays, factories, and enormous storehouses. It ripped huge stones from forts and bridges, then drove them against the temples like battering rams.
        - id: ch01-b169
          speaker: narrator
          text: Great ships swept over rooftops and crashed halfway up the hill among ruined gardens and shattered buildings. Brown fishing boats were ground to powder against the golden palace roofs. Then the water rushed back toward the sea.
        - id: ch01-b170
          speaker: psammead
          text: I want to go home now!
          emotion: fearful
        - id: ch01-b171
          speaker: jane
          text: Yes, please! Let's go!
          emotion: fearful
        - id: ch01-b172
          speaker: narrator
          text: The boys were ready too, but Jimmy had not reached them. Then they heard him running into the inner gallery.
        - id: ch01-b173
          speaker: learned_gentleman
          text: I must see how the dream ends!
        - id: ch01-b174
          speaker: narrator
          text: He raced up the higher staircase, and the others followed. At the top they entered a roofed turret open to the air on every side. Jimmy leaned over its parapet. As they reached him, the huge wave came back across Atlantis, higher than before and destroying even more.
        - id: ch01-b175
          speaker: psammead
          text: Come home! That will be the last wave. I know it will. Look, there it is!
          emotion: fearful
        - id: ch01-b176
          speaker: narrator
          text: The Psammead pointed with a trembling claw.
        - id: ch01-b177
          speaker: jane
          text: Oh, please come with us!
          emotion: fearful
        - id: ch01-b178
          speaker: narrator
          text: Jane raised the Amulet.
        - id: ch01-b179
          speaker: learned_gentleman
          text: I will see the end of this dream!
        - id: ch01-b180
          speaker: cyril
          text: If you stay, you'll never see anything again.
        - id: ch01-b181
          speaker: anthea
          text: Oh, Jimmy, come now! I promise I'll never take you out with us again!
          emotion: fearful
        - id: ch01-b182
          speaker: psammead
          text: Unless you leave at once, you will never have another chance.
          emotion: fearful
        - id: ch01-b183
          speaker: learned_gentleman
          text: I will see the dream's ending.
        - id: ch01-b184
          speaker: narrator
          text: He would not be moved. The hills had turned black with people fleeing from the villages toward the mountains. Even as they ran, a thread of smoke rose from the great white peak, followed by a faint flash of fire. Then the volcano began hurling up the mysterious burning matter hidden inside it.
        - id: ch01-b185
          speaker: narrator
          text: The earth shook. Ash and sulfur poured down, and fine pumice fell like snow across the dry land. Elephants fled the forests toward the peaks. Lizards thirty yards long burst from mountain pools and rushed for the sea. Melting snow thundered downhill, first in avalanches and then in roaring floods. Boulders flung from the volcano splashed into the sea miles away.
        - id: ch01-b186
          speaker: anthea
          text: This is horrible! Come home, please come home!
          emotion: fearful
        - id: ch01-b187
          speaker: learned_gentleman
          text: The end of the dream...
        - id: ch01-b188
          speaker: psammead
          text: Raise the Amulet!
          emotion: fearful
        - id: ch01-b189
          speaker: narrator
          text: Men and women now crowded the turret, crushing the children against the parapet. The whole tower rocked and swayed. The wave had reached the golden wall. Jane held the Amulet above them.
        - id: ch01-b190
          speaker: psammead
          text: Now! Say the word!
          emotion: fearful
        - id: ch01-b191
          speaker: narrator
          text: As Jane spoke, the Psammead sprang from its bag and bit Jimmy's hand. At the same instant, the boys shoved him through the arch, and everyone followed.
        - id: ch01-b192
          speaker: narrator
          text: Jimmy looked back. Through the arch, he saw only a waste of water and, above it, the dreadful mountain peak raging with fire. Then the arch closed, and he staggered into his chair.
        - id: ch01-b193
          speaker: learned_gentleman
          text: What a ghastly dream! Oh, you're here, my... er... dears. Is there anything I can do for you?
          emotion: fearful
        - id: ch01-b194
          speaker: anthea
          text: Your hand is hurt. Let me bandage it for you.
        - id: ch01-b195
          speaker: narrator
          text: The bitten hand was bleeding quite badly, just as Anthea had seen. While she attended to it, the Psammead crept quietly back into its green silk bag. All four children were very pale after what they had witnessed.
        - id: ch01-b196
          speaker: psammead
          text: Never again will I travel into the Past with a grown-up. I must admit that you four do what you're told.
        - id: ch01-b197
          speaker: narrator
          text: That was later. Later still, Anthea remembered what they had gone to Atlantis to seek.
        - id: ch01-b198
          speaker: anthea
          text: We never even found the Amulet.
        - id: ch01-b199
          speaker: psammead
          text: Of course you didn't. It wasn't there. Only the stone it was made from was in Atlantis. That stone landed on a ship miles away, and the ship escaped to Egypt. I could have told you all that.
        - id: ch01-b200
          speaker: anthea
          text: I wish you had. Why didn't you tell us?
          emotion: fearful
        - id: ch01-b201
          speaker: psammead
          text: You never asked. I'm not the sort of fellow who pushes in where his opinion isn't wanted.
          emotion: angry
        - id: ch01-b202
          speaker: narrator
          text: Much later still, Cyril thought of the visitor and his magazine article.
        - id: ch01-b203
          speaker: cyril
          text: Mister Ji-Jimmy's friend will have something worth putting in his article now.
        - id: ch01-b204
          speaker: robert
          text: I don't think so. Learned Ji-Jimmy will decide it was a dream. Ten to one, he never tells his friend a single word.
        - id: ch01-b205
          speaker: narrator
          text: Robert was right about both things. The learned gentleman did think it was a dream. And he never told.
