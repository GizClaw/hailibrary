audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    visitor:
      display_name: 学者先生的客人
      tts:
        delivery: 爽朗自信，说话直截了当
        timbre: 洪亮圆润的成年男声
        pace: 中等偏快
        pitch: 中低
    learned_gentleman:
      display_name: 学者先生
      tts:
        delivery: 文雅拘谨，遇见古迹时热切忘我
        timbre: 温和略显单薄的成年男声
        pace: 中等偏慢
        pitch: 中
    captain:
      display_name: 船长
      tts:
        delivery: 威严干练，忧虑时仍努力镇定
        timbre: 粗犷有力的成年男声
        pace: 中等
        pitch: 低
    old_sailor:
      display_name: 老水手
      tts:
        delivery: 见多识广，语气朴实随意
        timbre: 苍老粗哑的男声
        pace: 中等偏慢
        pitch: 低
    priest:
      display_name: 祭司
      tts:
        delivery: 庄重守礼，私下说话坦率谨慎
        timbre: 平稳清晰的成年男声
        pace: 中等偏慢
        pitch: 中低
    king:
      display_name: 亚特兰蒂斯国王
      tts:
        delivery: 沉着威严，习惯号令众人
        timbre: 洪亮厚重的成年男声
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第九章　亚特兰蒂斯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            巴比伦王后来到伦敦，是孩子们那些冒险里唯一真正花了时间的一次。可他们的日子还是过得满满当当。每次借护符回到过去，他们明明在那里待了好几个钟头，回到伦敦一看，整场经历却比闪电一闪还短。于是，几个人总有说不完的话，要把过去见过和做过的奇事翻来覆去地讲。
        - id: ch01-b02
          speaker: narrator
          text: >-
            吃饭、散步、待在餐厅或二楼客厅时，他们都在谈。谈得最多的地方，却是楼梯。这幢老房子从前很时髦，如今也依然气派。楼梯扶手最适合坐上去往下滑，每层转角还有宽大的壁龛。从前，壁龛里摆的是优美的雕像。现在，里面常常摆着西里尔、罗伯特、安西娅和简。
        - id: ch01-b03
          speaker: narrator
          text: >-
            有一天，西里尔和罗伯特只穿紧身白内衣，花了整整一个钟头，模仿大英博物馆和爸爸相册里的雕像。罗伯特想扮米洛的维纳斯，伸手去扯当披衣用的床单。偏巧西里尔正单脚踩在那张床单上，手里还端着一只金白相间的碟子当铁饼。他那副模样，真像一尊掷铁饼者。
        - id: ch01-b04
          speaker: narrator
          text: >-
            结果，掷铁饼者、铁饼和未来的维纳斯一起摔了下来。谁都伤得不轻，伤得最重的是那只碟子。哪怕用赛可汀胶或蛋清，把参差的碎片粘得再仔细，它也永远回不到原来的样子了。
        - id: ch01-b05
          speaker: cyril
          text: 这下你总满意了吧？
        - id: ch01-b06
          speaker: narrator
          text: 西里尔按着脑袋，那里正鼓起一个大包。
        - id: ch01-b07
          speaker: robert
          text: 满意得很，谢谢你。
        - id: ch01-b08
          speaker: narrator
          text: 罗伯特的大拇指卡进栏杆，差一点就向后折断了。
        - id: ch01-b09
          speaker: anthea
          text: >-
            可怜的松鼠，我真难过。你刚才扮得那么好看呢。我去拿湿布。鲍勃，你把手放到热水龙头下面冲一冲。芭蕾舞女演员伤了腿就是这么办的，我在书里看见过。
        - id: ch01-b10
          speaker: robert
          text: 哪本书？
        - id: ch01-b11
          speaker: narrator
          text: >-
            罗伯特问得很不客气，不过还是去冲了手。等他回来，姐妹俩已经替西里尔包好脑袋，也终于把他劝到愿意勉强承认，罗伯特大概不是故意的。罗伯特用同样温文尔雅的口气回了他一句。眼看两个人又要吵起来，安西娅连忙把话题从这场意外上岔开。
        - id: ch01-b12
          speaker: anthea
          text: 你们现在大概不想穿过护符，到别处去了吧？
        - id: ch01-b13
          speaker: jane
          text: 去埃及！我想看那些猫咪。
        - id: ch01-b14
          speaker: cyril
          text: >-
            我不去，太热了。这里的热我都快受不了，更别提埃及。咱们去北极吧。
        - id: ch01-b15
          speaker: narrator
          text: 当时的确很热，连全屋最凉快的三楼转角都热得厉害。
        - id: ch01-b16
          speaker: robert
          text: >-
            护符说不定从没去过北极。我们的手指也可能冻坏，到时候举不起它，连家都回不了。谢谢，我不去。
        - id: ch01-b17
          speaker: jane
          text: >-
            咱们把赛米德拿来，问问它的主意吧。就算最后不听它的，只要我们肯问，它也会高兴。
        - id: ch01-b18
          speaker: narrator
          text: >-
            赛米德装在那只绣花绿绸袋里，被提到楼上。可孩子们还没来得及问一句，学者先生的房门便开了。刚和他吃完午饭的客人还握着门把手，像是临走前非把最后几句话讲完不可。他的声音清清楚楚传到楼梯上。
        - id: ch01-b19
          speaker: visitor
          text: >-
            去看看医生吧，老伙计。思想传递那一套全是胡扯。你工作得太累了，该休个假，到迪耶普去。
        - id: ch01-b20
          speaker: learned_gentleman
          text: 我倒宁愿去巴比伦。
        - id: ch01-b21
          speaker: visitor
          text: >-
            既然这么说，我真希望你什么时候去趟亚特兰蒂斯。回来给我出出主意，我正要给《十九世纪》写篇文章呢。
        - id: ch01-b22
          speaker: learned_gentleman
          text: 我真想去。
        - id: ch01-b23
          speaker: visitor
          text: 再见，好好照顾自己。
        - id: ch01-b24
          speaker: narrator
          text: >-
            门砰地关上，客人笑着走下楼来。他身材魁梧，胖墩墩的，脸上带着那种生活宽裕的人才有的神气。孩子们不得不站起来给他让路。他一眼瞧见西里尔头上和罗伯特手上的绷带，便像熟人一样同他们打招呼，还笑着问他们是不是刚打过一场仗。
        - id: ch01-b25
          speaker: cyril
          text: >-
            没什么。先生，您刚才说的那个大西洋什么地方，究竟是哪儿？我们不是有意偷听，可还是听见了。
        - id: ch01-b26
          speaker: jane
          text: 谁叫您说话那么响呢。
        - id: ch01-b27
          speaker: visitor
          text: >-
            亚特兰蒂斯。沉没的亚特兰蒂斯，也是赫斯珀里得斯的花园。那是一整片大陆，后来沉进海里了。你们可以去读柏拉图。
        - id: ch01-b28
          speaker: cyril
          text: 谢谢您。
        - id: ch01-b29
          speaker: narrator
          text: 西里尔说得将信将疑。安西娅却突然想起了要紧的事。
        - id: ch01-b30
          speaker: anthea
          text: 那里有护符吗？
        - id: ch01-b31
          speaker: visitor
          text: 我想总有几百个吧。原来他已经跟你们谈过了？
        - id: ch01-b32
          speaker: anthea
          text: 谈过好多次。他对我们特别好，我们都很喜欢他。
        - id: ch01-b33
          speaker: visitor
          text: >-
            他需要休假，你们劝劝他。那颗脑袋里已经厚厚结了一层埃及、亚述之类的学问。想往里面敲进新东西，非得一连好多天，从早到晚不停地敲。我没空，你们却住在这里，随时都能敲。替我试试手吧。好啦，再会！
        - id: ch01-b34
          speaker: narrator
          text: >-
            他一步跨三级台阶下了楼。简觉得这人真不错，猜他家里也有几个小女儿，还说自己真想跟她们玩。三个大孩子交换眼色，西里尔点了点头。
        - id: ch01-b35
          speaker: cyril
          text: 好吧，咱们去亚特兰蒂斯。
        - id: ch01-b36
          speaker: anthea
          text: >-
            把学者先生也带上吧。事后他会以为自己做了场梦，不过这肯定算是换了环境。
        - id: ch01-b37
          speaker: jane
          text: 为什么不带他去可爱的埃及呢？
        - id: ch01-b38
          speaker: cyril
          text: 太热。
        - id: ch01-b39
          speaker: jane
          text: 那就去他想去的巴比伦？
        - id: ch01-b40
          speaker: robert
          text: >-
            巴比伦我已经去够了，至少眼下够了。其他人也一样。别问为什么，我也说不上来。松鼠，咱们拆掉这些讨厌的绷带，换上法兰绒衣服吧。总不能只穿着内衣去。
        - id: ch01-b41
          speaker: anthea
          text: 他自己许愿要去，早晚总得成真。跟我们一起正合适。
        - id: ch01-b42
          speaker: narrator
          text: >-
            事情就是这样定下来的。学者先生刚听完客人一大堆关于亚特兰蒂斯和其他事情的意见，可那些意见他一样也不同意，听得实在疲倦。他容许自己坐在椅子里放松片刻。没过多久，他一睁眼，便看见四位小朋友整整齐齐站在面前。
        - id: ch01-b43
          speaker: anthea
          text: 您愿意跟我们去亚特兰蒂斯吗？
        - id: ch01-b44
          speaker: narrator
          text: >-
            学者先生心想，一个人知道自己在做梦，梦多半就快结束了。也许这只是孩子们在玩“到巴比伦还有多少英里”那样的游戏。
        - id: ch01-b45
          speaker: learned_gentleman
          text: 多谢你们，可我只有一刻钟的空闲。
        - id: ch01-b46
          speaker: cyril
          text: >-
            这事根本不花时间。您知道，时间只是思想的一种形式。您早晚总得去，那为什么不跟我们去呢？
        - id: ch01-b47
          speaker: learned_gentleman
          text: 那好吧。
        - id: ch01-b48
          speaker: narrator
          text: >-
            他已经完全相信自己在做梦。安西娅伸出柔软红润的小手，把他轻轻拉起来。简举起护符。
        - id: ch01-b49
          speaker: cyril
          text: 到亚特兰蒂斯外面去。
        - id: ch01-b50
          speaker: narrator
          text: 简念出了力量之名。
        - id: ch01-b51
          speaker: robert
          text: 你这只猫头鹰！那是一座岛，岛外面全是水。
        - id: ch01-b52
          speaker: psammead
          text: 我不去！我不去！
        - id: ch01-b53
          speaker: narrator
          text: >-
            赛米德在袋里连踢带挣，可护符已经长成高大的拱门。西里尔认定长子理所当然应该先走，便把学者先生推进门里。他没有掉进水中，脚下竟是一片露天的木地板。其他人紧跟着穿过来，护符又在身后缩小。大家这才看清，脚下原来是一艘船的甲板。水手们正忙着靠岸，把沉重的铁链系上白色码头边的圆环。那些链条和圆环都由同一种金属制成，闪着黄金般的红黄色光芒。
        - id: ch01-b54
          speaker: narrator
          text: >-
            船上人人都忙得很，起初没人发现这群从菲茨罗伊街突然冒出来的客人。那些官长模样的人正朝水手高声下令，谁也顾不上回头。孩子们便站在甲板上，越过宽阔的码头望去，看见后面高高升起一座城。那是他们有生以来见过，甚至在梦里见过的最美景色。
        - id: ch01-b55
          speaker: narrator
          text: >-
            蓝色大海在柔和的阳光下闪耀，小小的白浪顶着白沫，轻轻拍打大理石防波堤。冬天海上风急浪高，全靠这些堤坝护住大城的船只。宽阔的码头也是洁白的大理石，里面的纹路亮得像黄金。城里遍布红白两色的大理石建筑。那些最宏伟的房子像是神庙和宫殿，屋顶仿佛铺着金银。不过更多屋顶是铜的。山坡上的铜顶泛着金红，下城染坊和冶炼作坊的烟气混着咸涩海雾，碰到铜面，又把它们染出奇妙的绿、蓝、紫色。
        - id: ch01-b56
          speaker: narrator
          text: >-
            一道道壮丽的宽台阶从码头伸向高处，通到一片仿佛延续了好几英里的平台。平台后面，整座城沿山坡一层层升起。
        - id: ch01-b57
          speaker: learned_gentleman
          text: 奇妙！太奇妙了！
          emotion: surprised
        - id: ch01-b58
          speaker: robert
          text: 我说，先生，您叫什么名字来着？
        - id: ch01-b59
          speaker: anthea
          text: >-
            他的意思是，我们怎么也记不住您的名字。我知道是德什么先生。
        - id: ch01-b60
          speaker: learned_gentleman
          text: >-
            我像你们这么大时，别人都叫我吉米。你们介意也这么叫吗？这是我的梦，要是有点什么能让我像你们中的一个，我会自在些。
        - id: ch01-b61
          speaker: anthea
          text: 谢谢您，吉米。亲爱的吉米。
        - id: ch01-b62
          speaker: narrator
          text: >-
            第一句她说得很费劲。对一位成年先生直呼吉米，实在太冒失了。可等她添上一声亲爱的，反倒一点也不费劲。吉米笑了，看起来很高兴。这时船已经系牢，船长终于有空注意别的事情。他朝他们走来，身上那套衣服既漂亮又利落，简直是航海生活所能容许的最好装束。
        - id: ch01-b63
          speaker: captain
          text: 你们来做什么？是来赐福，还是来降祸？
        - id: ch01-b64
          speaker: cyril
          text: >-
            当然是来赐福的。要是打扰了您，很抱歉。不过我们是靠魔法来的，来自太阳升起的国度。
        - id: ch01-b65
          speaker: captain
          text: >-
            我明白了。刚才我没看出来，不过你们最好是个吉兆。我们眼下正需要吉兆。这一位想必是你们的奴隶？
        - id: ch01-b66
          speaker: anthea
          text: >-
            才不是！他是位非常了不起的人，应该叫智者吧。我们想参观你们美丽的城市和神庙。之后回到家，他会讲给朋友听，他的朋友再写一本书。
        - id: ch01-b67
          speaker: captain
          text: 书是什么？
        - id: ch01-b68
          speaker: anthea
          text: 是一种记录，把事情写下来，或者刻下来。
        - id: ch01-b69
          speaker: narrator
          text: >-
            简忽然生出一股莫名的信任，从衣领里拉出护符，说记录就像这个上面刻的东西。船长好奇地瞧着。三个大孩子暗暗松了口气，因为他只是好奇，并没有露出那种压倒一切的贪求。埃及人和巴比伦人一听见护符的名字，可不是这个样子。
        - id: ch01-b70
          speaker: captain
          text: >-
            这块石头出自我国，上面的符号也像我们的文字，可我读不懂。你们的智者叫什么？
        - id: ch01-b71
          speaker: anthea
          text: 吉……吉米。
        - id: ch01-b72
          speaker: captain
          text: 吉……吉米。你们愿意上岸吗？要我领你们去见众王吗？
        - id: ch01-b73
          speaker: robert
          text: 先问一句，你们的国王痛恨外乡人吗？
        - id: ch01-b74
          speaker: captain
          text: >-
            我们有十位国王，王室血脉从共同的父亲波塞冬那里传来，从未断绝。依照高贵的传统，只要外乡人怀着和平而来，我们就以礼相待。
        - id: ch01-b75
          speaker: robert
          text: >-
            那请带路吧。不过我真想把您的漂亮大船从头到尾看一遍，再乘着它航行一会儿。
        - id: ch01-b76
          speaker: captain
          text: >-
            以后会有机会。眼下我们担心暴风雨。你们听见那阵怪响了吗？
        - id: ch01-b77
          speaker: old_sailor
          text: 没事，船长。只是沙丁鱼群游来了。
        - id: ch01-b78
          speaker: captain
          text: 可声音太响了。
        - id: ch01-b79
          speaker: narrator
          text: 大家不安地沉默片刻。船长踏上码头，其他人也跟了过去。
        - id: ch01-b80
          speaker: anthea
          text: >-
            吉米，您跟他聊聊呀。这样就能替朋友的书打听到好多事情。
        - id: ch01-b81
          speaker: learned_gentleman
          text: >-
            请原谅。我一说话就会醒来。再说，我听不懂他在讲什么。
        - id: ch01-b82
          speaker: narrator
          text: >-
            别人也想不出话来说，于是一路上谁都没有开口。大家默默跟随船长，走上大理石台阶，再穿过城中的一条条街道。那里什么都有，有店铺，有房屋，也有热闹的集市。
        - id: ch01-b83
          speaker: jane
          text: 跟巴比伦一模一样，可是样样东西又完全不同。
        - id: ch01-b84
          speaker: anthea
          text: 幸好十位国王都受过好教养，知道善待外乡人。
        - id: ch01-b85
          speaker: cyril
          text: 是啊，这里没有最深的地牢。
        - id: ch01-b86
          speaker: narrator
          text: >-
            街上没有马，也没有战车，只有手推车和装着粗圆木轮的低平货车。脚夫把包裹顶在头上，不少人还骑着一种很像大象的动物。只是那些巨兽浑身长毛，脸上也没有动物园里大象那种温顺神情。
        - id: ch01-b87
          speaker: learned_gentleman
          text: 猛犸象！
          emotion: surprised
        - id: ch01-b88
          speaker: narrator
          text: >-
            学者先生说完，就被一块松动的石头绊了一跤。街上的人不断围拢过来。每当人群挤得太密，船长就高声宣布来客的身份。
        - id: ch01-b89
          speaker: captain
          text: 太阳神的孩子们，还有他们的大祭司，前来赐福本城！
        - id: ch01-b90
          speaker: narrator
          text: >-
            人群听完立刻退开，发出一阵低沉的嗡鸣，仿佛把欢呼声强压在喉咙里。许多建筑外面都包着黄金。那些更高大的建筑却覆着另一种颜色的金属，顶上还耸着一座座磨得锃亮的银色尖塔。
        - id: ch01-b91
          speaker: jane
          text: 这些房子全是真金的吗？
        - id: ch01-b92
          speaker: captain
          text: 神庙当然包着黄金。普通房屋只有山铜，没那么贵。
        - id: ch01-b93
          speaker: narrator
          text: 学者先生脸色惨白，神情恍惚地踉跄前行，嘴里反复念着那个名字。
        - id: ch01-b94
          speaker: learned_gentleman
          text: 山铜……山铜。
          emotion: surprised
        - id: ch01-b95
          speaker: anthea
          text: >-
            别害怕。只要举起护符，我们马上就能回家。您想现在回去吗？我们改天不带您，再来一次也很容易。
        - id: ch01-b96
          speaker: learned_gentleman
          text: 不，不。求你们了，让这个梦继续下去吧。
        - id: ch01-b97
          speaker: captain
          text: >-
            大祭司吉……吉米走过魔法之路，也许已经累了。可大神庙还远着呢，十位国王今天正在那里献祭。
        - id: ch01-b98
          speaker: narrator
          text: >-
            船长在一片巨大围地的门口停下。围地四周竖着铜墙，高高的树梢从墙后探出来，里面大概是一座公园。一行人在门外等候，没过多久，船长便牵着一头毛茸茸的大象回来，恭恭敬敬请他们骑上去。
        - id: ch01-b99
          speaker: narrator
          text: >-
            这一程骑得真痛快。动物园的大象骑起来也很有意思，可它只肯走那么一点点路，接着便原路返回，实在扫兴。这头毛茸茸的巨兽可不同。它一直走，一直走，带他们穿过一条条街道、一座座广场和花园。整座城壮丽极了，几乎所有建筑都由红色、白色或黑色的大理石建成。一路上，他们还时不时走过一座桥。
        - id: ch01-b100
          speaker: narrator
          text: >-
            直到毛象驮着他们登上城市中央的小山，他们才第一次看清整座城真正的模样。城市被分成整整二十个同心圆，陆地和水面一圈接一圈，彼此交替。刚才一路走过的那些桥，原来每一座都跨过一道环形水面，把各圈陆地连在一起。
        - id: ch01-b101
          speaker: narrator
          text: >-
            山上有一座大广场。一幢庞大的建筑占满广场的一侧，墙面披着黄金，顶上扣着银色圆顶。其余几面全是山铜建筑。它们在阳光下轮廓分明，巍然闪耀。那种大胆又灿烂的辉煌，任凭你怎样想，也想不出它真正的模样。
        - id: ch01-b102
          speaker: captain
          text: >-
            你们一定想先洗个澡。觐见以前先沐浴，是我们这里的规矩。城里给男人、女人、马匹和牲口都备了各自的浴池，你们要用的上等浴场就在这里。我们的父亲波塞冬赐给这座城两眼泉水，一眼终年温热，另一眼永远清凉。
        - id: ch01-b103
          speaker: narrator
          text: 孩子们还是头一回在黄金浴池里洗澡。
        - id: ch01-b104
          speaker: cyril
          text: 这样洗澡真气派。
        - id: ch01-b105
          speaker: robert
          text: >-
            当然了，它其实不是真金，是山……那个东西叫什么来着？把毛巾递给我。
        - id: ch01-b106
          speaker: narrator
          text: >-
            浴厅里有好几座大水池，全都沉在地面以下。想下到水里，得顺着一级级台阶往下走。等大家洗得干干净净，热水又把每个人都泡得像煮熟了一样，他们才穿好衣服，在公共浴场开满鲜花的庭院里重新会合。
        - id: ch01-b107
          speaker: anthea
          text: >-
            吉米，您不觉得这里比巴比伦或埃及更像我们的时代吗？哦，我忘了，您没去过那些地方。
        - id: ch01-b108
          speaker: learned_gentleman
          text: >-
            不过那两个民族，我还是知道一些的。我完全同意。这话很有眼光，亲爱的。这座城的文明，显然比埃及或巴比伦高得多，而且……
        - id: ch01-b109
          speaker: captain
          text: 跟我来。喂，孩子们，让开些。
        - id: ch01-b110
          speaker: narrator
          text: 船长拨开一群正在玩耍的男孩。他们把晒干的栗子拴在绳子上，互相敲打。
        - id: ch01-b111
          speaker: robert
          text: 嘿，他们也玩斗栗子，跟肯蒂什镇路上的孩子一模一样！
          emotion: surprised
        - id: ch01-b112
          speaker: narrator
          text: >-
            他们这才看清，脚下这座岛一共围着三道墙。船长告诉他们，最外层是黄铜墙。中间那层远远看去像银子，其实表面包的是锡。最内层则是山铜墙。就在所有圆环的正中央，还矗立着一道黄金墙，墙上立着金塔，也开着金门。
        - id: ch01-b113
          speaker: captain
          text: >-
            看哪，那里是波塞冬神庙。依照律法，我不能进去。我就在这里等你们回来。
        - id: ch01-b114
          speaker: narrator
          text: >-
            船长仔细教给他们进门以后应该说些什么，然后留在原地。五个从菲茨罗伊街来的人互相牵住手，一起朝黄金墙走去。等他们来到门前，高大的金门无声地慢慢打开了。
        - id: ch01-b115
          speaker: cyril
          text: >-
            我们是太阳的孩子，这位是我们的大祭司。至少船长这样叫他，在家乡我们用另一个称呼。
        - id: ch01-b116
          speaker: priest
          text: 他叫什么名字？
        - id: ch01-b117
          speaker: narrator
          text: >-
            白袍祭司张开双臂，站在门里。西里尔迟疑了一下。对这么有学问的先生直呼小名，实在显得太不恭敬。
        - id: ch01-b118
          speaker: cyril
          text: >-
            吉……吉米。我们想在波塞冬神庙里跟众王谈谈。吉米，“波塞冬”这个词，我说得对吗？
        - id: ch01-b119
          speaker: learned_gentleman
          text: >-
            完全正确。真奇怪，我听得懂你们对他们说什么，却听不懂他们的回答。
        - id: ch01-b120
          speaker: cyril
          text: 巴比伦王后也是这样，这是魔法的一部分。
        - id: ch01-b121
          speaker: learned_gentleman
          text: 多奇妙的梦啊！
          emotion: surprised
        - id: ch01-b122
          speaker: narrator
          text: 又有几位白袍祭司走来，所有人都深深鞠躬。
        - id: ch01-b123
          speaker: priest
          text: 请进吧，太阳的孩子们，还有你们的大祭司吉……吉米。
        - id: ch01-b124
          speaker: narrator
          text: >-
            神庙矗立在内院里，通体是银，尖塔和大门却是金的。四周还有二十尊明晃晃的巨大黄金人像，男人和女人都有。除此以外，那里还立着一根庞大得惊人的柱子，也是用另一种珍贵的黄色金属铸成。
        - id: ch01-b125
          speaker: narrator
          text: >-
            祭司领他们穿过大门，登上一条走廊，让他们俯看下面辉煌的殿堂。
        - id: ch01-b126
          speaker: priest
          text: 十位国王正在挑选公牛。依照律法，我不能观看。
        - id: ch01-b127
          speaker: narrator
          text: >-
            祭司说完，就在走廊外脸朝下趴伏到地上，连一眼也不敢偷看。孩子们却全都探身向殿内望去。象牙屋顶上装饰着那三种珍贵金属，墙壁则从上到下镶满当地人最喜爱的山铜。神庙尽头立着一组无与伦比的雕像。世上任何活着的人，都不曾亲眼看过同样的东西。
        - id: ch01-b128
          speaker: narrator
          text: >-
            整组雕像全由黄金铸成。正中的主像高得惊人，头顶一直碰到屋顶。那就是这座城的父亲波塞冬。他站在一辆巨大的战车上，六匹庞然大马拉着车向前。战车四周围着整整一百个美人鱼，每一个都骑在海豚背上。
        - id: ch01-b129
          speaker: narrator
          text: >-
            十个衣着华美的男人身上没有刀剑，只拿着棍棒和绳索。他们要从十五头公牛中活捉一头。那些牛在神庙地面上来回狂奔，谁也不肯停下，一颗颗长着尖角的大脑袋越甩越凶。孩子们觉得它们危险极了，全都屏住呼吸。
        - id: ch01-b130
          speaker: narrator
          text: >-
            安西娅不喜欢看公牛。她四处张望，发现走廊还有一道楼梯通往更高的一层，另一扇门外似乎是露天阳台。忽然下面响起一声欢呼。
        - id: ch01-b131
          speaker: robert
          text: 逮住了！
        - id: ch01-b132
          speaker: narrator
          text: >-
            安西娅低头一看，人们正挥着鞭子，把其余的牛赶出神庙。十位国王紧随在后，其中一位用棍子驱赶一头被套索紧紧勒住的黑牛。黑牛一路扭动挣扎。一个男孩着急地低声说，这下他们再也看不到后面的事情了。
        - id: ch01-b133
          speaker: anthea
          text: 看得到，那边有个露天阳台。
        - id: ch01-b134
          speaker: narrator
          text: >-
            大家全挤到阳台上。可没过多久，两个女孩就悄悄退了回来。简说自己不喜欢看献祭，安西娅也一样。于是她们去找祭司说话。他已经不再脸朝下趴着，而是坐在最高一级台阶上，用自己的白袍不停擦着额头。那天的天气实在很热。
        - id: ch01-b135
          speaker: priest
          text: >-
            这是一次特别的献祭。平常只有到了审判日才做，间隔先是五年，再是六年，这样交替下去。那一天，国王们会在一杯酒里掺进一点牛血，轮流喝下去，发誓自己一定公正断案。他们还会穿上神圣的蓝袍，把神庙中所有的火全都熄灭。
        - id: ch01-b136
          speaker: priest
          text: >-
            今天献祭，是因为海上不断传来怪声，大山里的神也用雷霆般的嗓音说话，闹得全城不安。可这些声音以前常常出现。真有事情能让我害怕，也不是这个。
        - id: ch01-b137
          speaker: jane
          text: 那会是什么？
        - id: ch01-b138
          speaker: priest
          text: 旅鼠。
        - id: ch01-b139
          speaker: jane
          text: 它们是谁？是敌人吗？
        - id: ch01-b140
          speaker: priest
          text: >-
            它们是一种老鼠。每年都会从一个谁也不知道的国度游过海来，在我们这里住上一阵，然后再游回去。可是今年，它们一直没有出现。你们知道，一艘船要是快沉了，老鼠绝不会留在船上。要是真有可怕的灾祸将要落到我们头上，我相信旅鼠一定会先知道。也许它们正因为这个，才一直躲着我们。
        - id: ch01-b141
          speaker: psammead
          text: 这个国家叫什么？
        - id: ch01-b142
          speaker: narrator
          text: 赛米德忽然从袋子里探出脑袋。
        - id: ch01-b143
          speaker: priest
          text: 亚特兰蒂斯。
        - id: ch01-b144
          speaker: psammead
          text: >-
            那我劝你快到最高的地方去。我记得听说这里会发大水。喂，你，咱们回家吧。照这情形，我的胡须非湿透不可。
        - id: ch01-b145
          speaker: narrator
          text: 女孩们听话地去找哥哥。他们正靠着阳台栏杆。
        - id: ch01-b146
          speaker: anthea
          text: 学者先生呢？
        - id: ch01-b147
          speaker: priest
          text: 在下面。你们的大祭司吉……吉米正跟众王待在一起。
        - id: ch01-b148
          speaker: narrator
          text: >-
            谁也没看见学者先生是怎么下去的。此刻，他正和十位国王站在祭坛的台阶上，刚才那头黑牛的尸体就躺在祭坛上。庭院其余地方挤满了人，看起来城里各个阶层的人全到了。所有人都仰着头，一遍遍高喊着海来了。
        - id: ch01-b149
          speaker: king
          text: 镇定！我们的城无比坚固，大海和天空的怒吼都奈何不了它！
        - id: ch01-b150
          speaker: narrator
          text: 说话的是最有王者气派的国王，也是刚才套住公牛的那一位。
        - id: ch01-b151
          speaker: psammead
          text: 我要回家。
          emotion: fearful
        - id: ch01-b152
          speaker: anthea
          text: 我们不能把他丢下。
        - id: ch01-b153
          speaker: anthea
          text: 吉米！吉米！
        - id: ch01-b154
          speaker: narrator
          text: >-
            安西娅一边呼唤，一边朝吉米用力挥手。吉米终于听见了，开始从祭坛那边穿过拥挤的人群，向阳台走来。孩子们也看见船长正侧着身子，一点一点往人群外挤。他先前还很镇定，这时脸上却没有一丝血色，白得像一张纸。
        - id: ch01-b155
          speaker: captain
          text: 快上山！
          emotion: fearful
        - id: ch01-b156
          speaker: narrator
          text: >-
            他的嗓音又响又可怕，可另一个声音从上面压了过去。那个声音更响，也更可怕。那是大海的声音。女孩们转头望向海面。
        - id: ch01-b157
          speaker: narrator
          text: >-
            平静辽阔的海面上，一个巨大而漆黑的东西正朝城市滚来。那是一道巨浪，足有一百英尺高，看上去简直像一座山。浪头还在不断升高，升得越来越高。忽然，它仿佛从正中裂成两半。一半倒卷回海里，另一半却带着可怕的轰鸣，直扑城市。
        - id: ch01-b158
          speaker: anthea
          text: 城里怎么办？那些可怜的人！
          emotion: fearful
        - id: ch01-b159
          speaker: robert
          text: 其实，这都是几千年前的事了。
        - id: ch01-b160
          speaker: narrator
          text: >-
            可罗伯特的声音也在发抖。孩子们捂住眼睛，不忍再往下看。巨浪已经迎面砸进城市，漫过码头和船坞，吞掉巨大的仓库与工场。它从堡垒和桥梁上扯下庞然巨石，又推着那些石头去撞神庙，仿佛把它们当作攻城锤。一艘艘大船被冲过屋顶，摔进半山腰的花园和房屋。花园毁了，房屋也塌了。棕色渔船被海水碾成粉末，撒满宫殿的金屋顶。
        - id: ch01-b161
          speaker: narrator
          text: 随后，巨浪退回海中。
        - id: ch01-b162
          speaker: psammead
          text: 我要回家！
          emotion: fearful
        - id: ch01-b163
          speaker: jane
          text: 好，快回去！
          emotion: fearful
        - id: ch01-b164
          speaker: narrator
          text: 男孩们也准备好了，可学者先生还没上来。
        - id: ch01-b165
          speaker: learned_gentleman
          text: 我一定要看完这个梦！
        - id: ch01-b166
          speaker: narrator
          text: >-
            他忽然飞奔上内侧走廊，又沿着更高的楼梯往上冲。其他人只好紧紧追赶。他们来到一座像角楼的地方，头顶虽然有屋盖，四面却向风敞开。学者先生靠在胸墙上，死死望着下面。孩子们刚追到他身边，那道巨浪便重新扑进城里。这一回，海水升得更高，毁掉的东西也更多。
        - id: ch01-b167
          speaker: psammead
          text: >-
            快回家！我知道那是最后一道浪！最后一道就在那边！
          emotion: fearful
        - id: ch01-b168
          speaker: narrator
          text: 它伸出一只颤抖的爪子，指向远处。
        - id: ch01-b169
          speaker: jane
          text: 快走吧！
          emotion: fearful
        - id: ch01-b170
          speaker: narrator
          text: 简一边催，一边举起护符。
        - id: ch01-b171
          speaker: learned_gentleman
          text: 我非看完这个梦不可！
        - id: ch01-b172
          speaker: cyril
          text: 真看完了，你以后就什么也看不见了。
        - id: ch01-b173
          speaker: anthea
          text: 吉米，求您了！我以后再也不带您出来了！
          emotion: fearful
        - id: ch01-b174
          speaker: psammead
          text: 再不快走，你们以后根本不会有机会。
        - id: ch01-b175
          speaker: learned_gentleman
          text: 我一定要看完这个梦。
        - id: ch01-b176
          speaker: narrator
          text: >-
            学者先生固执得很，还是不肯动身。四周山坡已经被逃难的人染成一片黑色。他们从一个个村庄涌出来，拼命朝更高的山上奔去。就在众人奔逃时，那座白色巨峰先冒出一缕薄烟，接着闪过一道微弱的火光。下一刻，火山开始把腹中那些神秘而炽热的东西全都喷向天空。
        - id: ch01-b177
          speaker: narrator
          text: >-
            大地开始颤抖，火山灰和硫黄从天而降，细碎的浮石像下雪一样，落遍所有还没有被淹没的土地。森林里的大象一齐冲出来，朝更高的山峰狂奔。山中水潭里也钻出三十码长的巨蜥，却拼命往海边逃。山顶积雪开始融化，先化作轰轰滚落的雪崩，接着又变成咆哮的洪流。火山喷起的巨石飞过好几英里，重重砸进远处的海中，溅起冲天水花。
        - id: ch01-b178
          speaker: anthea
          text: 太可怕了！回家吧，快回家！
          emotion: fearful
        - id: ch01-b179
          speaker: learned_gentleman
          text: 梦的结局……
        - id: ch01-b180
          speaker: psammead
          text: 快举起护符！
          emotion: fearful
        - id: ch01-b181
          speaker: narrator
          text: >-
            不知不觉间，角楼里已经挤满逃上来的男男女女。孩子们夹在人群中，被紧紧压上胸墙，连转身都很困难。整座角楼开始来回摇晃，脚下仿佛随时都会裂开。那道巨浪已经冲到了金墙下面。简拼命腾出一只手，把护符高高举起。
        - id: ch01-b182
          speaker: psammead
          text: 快，念出那个名字！
          emotion: fearful
        - id: ch01-b183
          speaker: narrator
          text: >-
            简刚念出力量之名，赛米德便从袋里猛地跳出来，一口咬住学者先生的手。就在同一刻，两个男孩合力把他推进护符形成的拱门。女孩们和赛米德也紧跟在后面，全都从即将毁灭的城市逃了出去。
        - id: ch01-b184
          speaker: narrator
          text: >-
            学者先生转身回望。护符的拱门还开着，可那边的城市已经消失，只剩一片茫茫洪水。水面上方，唯有那座可怕的山峰还高高耸立，烈火在山腹中疯狂燃烧。景象随拱门消失以后，他踉跄着退回自己的椅子旁。
        - id: ch01-b185
          speaker: learned_gentleman
          text: >-
            多可怕的一场梦！哦，你们还在这里，我的……呃……亲爱的孩子们。有什么要我替你们做吗？
        - id: ch01-b186
          speaker: anthea
          text: 您的手受伤了，我替您包起来吧。
        - id: ch01-b187
          speaker: narrator
          text: >-
            那只手果真被咬得不轻，流了不少血。安西娅赶紧动手替他包扎。赛米德早已悄悄爬回自己的袋子里，四个孩子站在旁边，谁也没能立刻说话。他们的脸全都白得吓人。
        - id: ch01-b188
          speaker: psammead
          text: >-
            我以后再也不跟大人一起去过去了！你们四个倒还有一点好，别人叫你们做什么，你们真肯照办。
        - id: ch01-b189
          speaker: anthea
          text: 可我们连护符都没找到。
        - id: ch01-b190
          speaker: psammead
          text: >-
            当然找不到，它根本不在那里。那里只有制作护符的石头。那块石头落到几英里外的一艘船上。船逃出了灾难，最后到了埃及。这些事，我本来都能告诉你们。
        - id: ch01-b191
          speaker: anthea
          text: 真希望你早说了。你为什么不说呢？
        - id: ch01-b192
          speaker: narrator
          text: 安西娅说话时，声音还在发颤。
        - id: ch01-b193
          speaker: psammead
          text: >-
            你们又没问。我可不是那种没人需要，也偏要把船桨伸进来乱搅和的家伙。
        - id: ch01-b194
          speaker: cyril
          text: 吉……吉米先生的朋友，这下可有真正值得写进文章的材料了。
        - id: ch01-b195
          speaker: narrator
          text: 这句话是很久以后才说的。又过了更久，罗伯特已经困得睁不开眼。
        - id: ch01-b196
          speaker: robert
          text: >-
            才不会。学者吉……吉米只会以为自己做了场梦。我敢拿十赔一打赌，他一个字也不会告诉那个家伙。
        - id: ch01-b197
          speaker: narrator
          text: 罗伯特两件事都说中了。学者先生果真把这一切当成梦，也果真一个字都没说。
