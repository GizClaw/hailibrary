        pace: 中等偏慢
        pitch: 中高
    learned_gentleman:
      display_name: 学者先生
      tts:
        delivery: 文雅拘谨，遇见古迹时热切忘我
        timbre: 温和略显单薄的成年男声
        pace: 中等偏慢
        pitch: 中
    imogen:
      display_name: 伊莫金
      tts:
        delivery: 倔强直白，伤心时仍带孩子气
        timbre: 细弱微哑的女孩声
        pace: 中等偏快
        pitch: 高
    queen:
      display_name: 不列颠王后
      tts:
        delivery: 深情爽直，喜悦中带着威仪
        timbre: 清亮而饱经风霜的成年女声
        pace: 中等
        pitch: 中
    briton_woman_1:
      display_name: 不列颠妇人甲
      tts:
        delivery: 朴实关切，语气真诚
        timbre: 温厚的成年女声
        pace: 中等
        pitch: 中
    briton_woman_2:
      display_name: 不列颠妇人乙
      tts:
        delivery: 朴实关切，语气真诚
        timbre: 略低的成年女声
        pace: 中等偏慢
        pitch: 中低
    briton_woman_3:
      display_name: 不列颠妇人丙
      tts:
        delivery: 朴实关切，语气真诚
        timbre: 明净的成年女声
        pace: 中等
        pitch: 中高
    caesar:
      display_name: 尤利乌斯·恺撒
      tts:
        delivery: 威严镇定，字字带着不容置疑的力量
        timbre: 洪亮坚实的成年男声
        pace: 从容
        pitch: 中低
    marcus:
      display_name: 马库斯
      tts:
        delivery: 恭谨敏捷，军人般利落
        timbre: 清晰的青年男声
        pace: 中等偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 第十章　黑衣小姑娘与尤利乌斯·恺撒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            亲眼看见一座大城被海水吞没，一片美丽国土毁在活火山手里，这样的事谁也不会天天遇上。哪怕从前见过再多奇迹，也会惊得喘不过气。亚特兰蒂斯就叫西里尔、罗伯特、安西娅和简好几天都没缓过来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这种情形一连持续了好几天，学者先生似乎也和他们一样。他本来就没剩多少气力，又花掉了不少，向安西娅细细讲起自己做过的一场奇梦。
        - id: ch01-b03
          speaker: learned_gentleman
          text: 你一定想不到，一个梦竟然能细致到这种程度。
        - id: ch01-b04
          speaker: narrator
          text: >-
            安西娅说，这倒不难相信。学者先生也不再提思想传递了。近来的怪事太多，那种解释连他自己也信不下去。
        - id: ch01-b05
          speaker: narrator
          text: >-
            孩子们还没从震惊中恢复，谁都不想再穿过护符冒险。罗伯特说出了大家的心声，他们暂时已经受够护符了。赛米德更是钻进沙里不肯出来。洪水吓坏了它，学者先生和巴比伦王后那些没想周全的愿望，又累得它几乎没命。
        - id: ch01-b06
          speaker: narrator
          text: >-
            大家便让它睡个够。把它带到陌生人身边太危险了，谁也不知道哪个人会突然许下一个糟糕的愿望。再说，不靠护符和赛米德，伦敦也有的是地方可去。伦敦塔、国会大厦、国家美术馆、动物园、各处公园、南肯辛顿的博物馆、杜莎夫人蜡像馆，还有能坐内河汽船去的邱园，全都可以逛。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他们本来真打算坐内河汽船去邱园。可就在几个人商量怎么走、该带多少吃的、又得花多少钱时，黑衣小姑娘的奇遇开始了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            那天，孩子们坐在圣詹姆斯公园的一张长椅上。刚才，他们一直看着一只鹈鹕端端庄庄地躲开海鸥的亲近。海鸥总想拉它一起玩，可鹈鹕很明白，自己的身材实在不适合游戏，所以大半时间都装作自己不肯玩并不是这个缘故。
        - id: ch01-b09
          speaker: narrator
          text: >-
            亚特兰蒂斯留下的震撼已经淡了一点。凡事都想弄明白的西里尔，还在心里来回琢磨。
        - id: ch01-b10
          speaker: robert
          text: 你干吗闷闷不乐的？
        - id: ch01-b11
          speaker: cyril
          text: 我没有。我只是在想事。等我想明白了再告诉你。
        - id: ch01-b12
          speaker: jane
          text: 要是又跟护符有关，我可不想听。
        - id: ch01-b13
          speaker: cyril
          text: 谁请你听了？我还没想完呢。先说邱园吧。
        - id: ch01-b14
          speaker: robert
          text: 我还是想坐汽船去。
        - id: ch01-b15
          speaker: narrator
          text: 两个女孩都笑了。
        - id: ch01-b16
          speaker: cyril
          text: 行啊，你就拿我逗趣吧。换了我也会这么干。
        - id: ch01-b17
          speaker: anthea
          text: 嗯，鲍勃这句话确实有点好笑。
        - id: ch01-b18
          speaker: robert
          text: 松鼠，想事情既然让你这么难受，我劝你还是别想了。
        - id: ch01-b19
          speaker: cyril
          text: 哦，你闭嘴吧。要不就好好谈邱园。
        - id: ch01-b20
          speaker: anthea
          text: >-
            我想看看那里的棕榈树，瞧瞧像不像那座岛上的。咱们还在那里请半个副牧师主持，让厨娘嫁给了强盗呢。
        - id: ch01-b21
          speaker: narrator
          text: >-
            快乐的回忆一下子涌了上来，把刚才的不愉快全冲走了。他们你一句我一句，问别人还记不记得这件事，有没有忘掉那件事。等这阵回忆稍稍平静，西里尔又想起来了。
        - id: ch01-b22
          speaker: cyril
          text: 我的天，咱们经历的事情可真不少。
        - id: ch01-b23
          speaker: robert
          text: 可不是嘛。
        - id: ch01-b24
          speaker: jane
          text: 以后可别再来了。
        - id: ch01-b25
          speaker: cyril
          text: 我刚才想的就是这个。
        - id: ch01-b26
          speaker: narrator
          text: >-
            就在这时，他们听见近处有人抽鼻子。一个小姑娘正站在那里看着他们。她的皮肤并不黑，黑的是身上那条又肥又长的旧连衣裙。她衣衫破旧，人也不大干净。因为哭得太久，眼皮肿得只剩窄窄一条缝，几乎看不出眼睛原来很蓝。她那顶缀着斑点黑丝带的水手帽也大得过分，原本该戴在比她大得多的脑袋上，如今底下只露出一颗亚麻色的小脑袋。她不停地抽着鼻子。
        - id: ch01-b27
          speaker: anthea
          text: 哎呀，到底出什么事了？
        - id: ch01-b28
          speaker: narrator
          text: 安西娅跳起来，把手放在小姑娘胳膊上，却被她猛地甩开。
        - id: ch01-b29
          speaker: imogen
          text: 别来管我。我又没招惹你。
          emotion: angry
        - id: ch01-b30
          speaker: anthea
          text: 究竟怎么了？是不是有人欺负你？
        - id: ch01-b31
          speaker: imogen
          text: 跟你有什么关系？你们当然什么事都没有。
          emotion: angry
        - id: ch01-b32
          speaker: robert
          text: 走吧。她就是个讨厌又没礼貌的小鬼。
        - id: ch01-b33
          speaker: anthea
          text: 不，她只是难过得不得了。你告诉我，到底怎么啦？
        - id: ch01-b34
          speaker: imogen
          text: 哼，你们当然好好的。反正要进济贫院的又不是你们。
          emotion: sad
        - id: ch01-b35
          speaker: anthea
          text: 那我们送你回家，好不好？
        - id: ch01-b36
          speaker: jane
          text: 你妈妈住在哪儿呀？
        - id: ch01-b37
          speaker: imogen
          text: 她哪儿都不住。她死了。现在你们总该明白了吧！
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            小姑娘凶狠的声音里，竟透着一种悲惨的得意。她睁大哭肿的眼睛，气愤地跺了一脚，转身跑开。可她只跑到下一张长椅，就扑下去放声大哭，根本没打算忍住。
        - id: ch01-b39
          speaker: narrator
          text: 安西娅立刻跟过去，用尽力气抱紧那团缩成一团的黑衣服。
        - id: ch01-b40
          speaker: anthea
          text: >-
            哦，亲爱的，别这样哭。别哭了，好不好？什么事都告诉安西娅吧，安西娅会帮你。好啦，好啦，亲爱的，先别哭了。
          emotion: calm
        - id: ch01-b41
          speaker: narrator
          text: >-
            安西娅对着那顶已经歪得不像样的大水手帽轻声安慰。其他孩子远远站着，还有一两个路人好奇地看过来。小姑娘哭得一阵一阵的，停下来时，似乎就在对安西娅说话。
        - id: ch01-b42
          speaker: narrator
          text: 过了一会儿，安西娅招手把西里尔叫了过去。
        - id: ch01-b43
          speaker: anthea
          text: >-
            这太可怕了！她爸爸是木匠，平时一向规规矩矩，只有星期六才喝酒。他来伦敦找活干，可一件活也没找到，后来就死了。她叫伊莫金，到十一月才满九岁。现在妈妈也死了，今晚她得住在施罗布索尔太太家。那位女房东对她很好，可明天济贫官就会把她领走，送进联合济贫院，也就是贫民习艺所。太可怕了。咱们能怎么办？
          emotion: angry
        - id: ch01-b44
          speaker: jane
          text: 去问学者先生呀。
        - id: ch01-b45
          speaker: narrator
          text: >-
            谁也想不出更好的办法。于是大家尽快赶回菲茨罗伊街。伊莫金紧紧拉住安西娅的手，她已经不哭了，只是还在轻轻抽鼻子。
        - id: ch01-b46
          speaker: narrator
          text: >-
            学者先生从书案前抬起头，脸上的笑容比以前自然多了。孩子们进他的房间，早已一点也不拘束。那房间仿佛也诚心欢迎他们，就连木乃伊棺材也像是在笑，用一种遥远又高傲的古埃及方式表示，见到他们还算高兴。
        - id: ch01-b47
          speaker: narrator
          text: >-
            安西娅陪着十一月才满九岁的伊莫金坐在楼梯上，其他人进屋说明她的难处。学者先生听得很严肃。
        - id: ch01-b48
          speaker: cyril
          text: >-
            她的运气实在太坏了。我常听说有些有钱人很想要孩子。换成我，我肯定不想要，可他们确实想啊。总会有人愿意收留她吧？
        - id: ch01-b49
          speaker: robert
          text: >-
            吉卜赛人很喜欢孩子，他们不是总偷孩子吗？也许他们愿意要她。
        - id: ch01-b50
          speaker: jane
          text: >-
            她其实是个挺好的小姑娘。刚见面时没礼貌，是因为我们又快活又幸福，她却一点也不幸福。您懂的，对不对？
        - id: ch01-b51
          speaker: learned_gentleman
          text: 我懂，很懂。照你们这么说，总会有一个家欢迎她的。
        - id: ch01-b52
          speaker: narrator
          text: >-
            学者先生心不在焉地摆弄一尊埃及来的蓝色小像，又皱起眉头盯着它出神。门外的安西娅觉得，他们解释得也太久了。她只顾着哄黑衣小姑娘振作起来，根本没发现赛米德被她的声音吵醒，已经抖掉沙子，歪歪扭扭地爬上楼。等它到了跟前，她才看见，赶紧抱起来放在膝头。
        - id: ch01-b53
          speaker: imogen
          text: 这是什么？是猫，是会耍把戏的猴子，还是别的东西？
        - id: ch01-b54
          speaker: narrator
          text: 就在这时，屋里传来了学者先生的声音。
        - id: ch01-b55
          speaker: learned_gentleman
          text: 是啊，我真希望能找到一个乐意收留她的家。
        - id: ch01-b56
          speaker: narrator
          text: >-
            话刚说完，安西娅便觉得膝上的赛米德开始鼓胀。她猛地站起来，用裙子兜住赛米德，另一只手拉着伊莫金，冲进学者先生的房间。
        - id: ch01-b57
          speaker: anthea
          text: 至少大家别分开！全都手拉手，快一点！
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: >-
            大家围成一个圆圈，活像在玩《绕着桑树转》或《玫瑰圈》。安西娅只好用牙咬住裙摆，把裙子兜成装赛米德的口袋，这才腾出双手拉住大家。
        - id: ch01-b59
          speaker: learned_gentleman
          text: 这是个游戏吗？
        - id: ch01-b60
          speaker: narrator
          text: >-
            学者先生问得有气无力，谁也没有回答。大家提心吊胆地等了一会儿，那种上下颠倒、里外翻转的怪感觉果然来了。每次魔法把人从一个地方送到另一个地方，差不多都会这样。与此同时，眼前也昏暗起来，一阵眩晕。
        - id: ch01-b61
          speaker: narrator
          text: >-
            迷雾散了，颠倒翻转也停了。六个人还是手拉手围成一圈，可十二只脚已经不在学者先生房间的地毯上，而是踩着青草。头顶也不再是菲茨罗伊街那间屋子灰暗的天花板，换成了一片淡蓝天空。墙壁和画着花纹的木乃伊棺材全不见了。四周只有高大的深绿色树木，有橡树，有白蜡树，林间和树下挤满纠缠的灌木与攀爬的常春藤。山毛榉下面倒是什么也不长，只有它们自己落下的一层枯红叶子，偶尔露出一小片嫩绿蕨叶。
        - id: ch01-b62
          speaker: narrator
          text: >-
            他们仍旧围着圆圈，像在玩《玫瑰圈》或《绕着桑树转》。六个人牵着手站在树林里，听起来很简单。可他们不知道树林在哪里，更不知道眼下是什么年代。学者先生心里生出一种奇怪的感觉。
        - id: ch01-b63
          speaker: learned_gentleman
          text: 哎呀，又是一场梦！
          emotion: surprised
        - id: ch01-b64
          speaker: narrator
          text: >-
            孩子们也几乎认定，他们来到了很久很久以前。小伊莫金只叫了一声，嘴巴便张得老大，再也合不上了。
        - id: ch01-b65
          speaker: imogen
          text: 哎哟！
          emotion: surprised
        - id: ch01-b66
          speaker: cyril
          text: 赛米德，我们这是在哪儿？
        - id: ch01-b67
          speaker: psammead
          text: 不列颠。
        - id: ch01-b68
          speaker: anthea
          text: 可这是哪个年代？
        - id: ch01-b69
          speaker: psammead
          text: >-
            大概在你们用来纪年的那一年之前五十五年。还有问题吗？我以前来过，这里几乎一点都没变。
        - id: ch01-b70
          speaker: narrator
          text: 赛米德从安西娅蓝色亚麻裙兜成的袋子里伸出脑袋，两只蜗牛似的眼睛转来转去。
        - id: ch01-b71
          speaker: anthea
          text: 可我们为什么会到这里来？
        - id: ch01-b72
          speaker: psammead
          text: >-
            还不是你那个从不替别人着想的朋友。他想找一个乐意收留这个讨厌的小号女性人类的家。天知道你们从哪儿捡来的她。巨兽时代那些家教好的孩子，可不会在公园里跟衣衫褴褛的陌生人搭话。他冒冒失失地想替这个没人要的陌生人找个去处，所以你们就全到这里来了！
          emotion: angry
        - id: ch01-b73
          speaker: anthea
          text: >-
            我看得出，我们的确到了。可为什么偏偏是这里，又偏偏是现在？
        - id: ch01-b74
          speaker: narrator
          text: 安西娅耐着性子说，一面环顾这片幽暗高耸的森林。
        - id: ch01-b75
          speaker: psammead
          text: >-
            你还真以为，在你们那个时代、那些城市里，会有人想要这样的孩子？你们把自己的国家弄得乱七八糟，连一半孩子都找不到容身的地方，更别说有人愿意要他们了。
          emotion: angry
        - id: ch01-b76
          speaker: anthea
          text: 那又不是我们造成的。
        - id: ch01-b77
          speaker: psammead
          text: >-
            你们还把我带来，连一件挡雨的东西都没有。谁不知道古代不列颠又湿又多雾？
          emotion: angry
        - id: ch01-b78
          speaker: robert
          text: 喏，用我的外套吧。
        - id: ch01-b79
          speaker: narrator
          text: >-
            罗伯特脱下外套。安西娅把它铺在地上，将赛米德放在上面，又用衣服裹好，只留下眼睛和毛茸茸的耳朵。
        - id: ch01-b80
          speaker: anthea
          text: >-
            好啦，只要看着要下雨，我立刻把你盖住。现在咱们该怎么办？
          emotion: calm
        - id: ch01-b81
          speaker: narrator
          text: 大家松开手，全围过来等答案。伊莫金敬畏地压低了声音。
        - id: ch01-b82
          speaker: imogen
          text: 怎么连耍把戏的猴子也能说话？我还以为只有鹦鹉会说呢！
          emotion: surprised
        - id: ch01-b83
          speaker: psammead
          text: 怎么办？你们爱干什么就干什么，我才懒得管！
          emotion: angry
        - id: ch01-b84
          speaker: narrator
          text: >-
            赛米德连脑袋和耳朵一起缩进罗伯特的粗花呢外套。其他人互相看着，谁也拿不定主意。
        - id: ch01-b85
          speaker: learned_gentleman
          text: >-
            反正只是一场梦。只要想办法别醒过来，总会有点事情发生。
        - id: ch01-b86
          speaker: narrator
          text: >-
            果然，事情来了。孩子的笑声和人们的说话声，打破了幽暗树林里沉沉的安静。
        - id: ch01-b87
          speaker: cyril
          text: 咱们过去看看。
        - id: ch01-b88
          speaker: learned_gentleman
          text: >-
            这只是一场梦。简，做梦的时候要是不顺着梦走，偏要反抗，人就会醒过来。你懂吧？
        - id: ch01-b89
          speaker: narrator
          text: >-
            灌木丛里有一道缺口，像是哪个傻瓜想象出来的小路。大家排成一列沿路前进，学者先生走在最前面。没过多久，他们来到一大片林间空地。里面立着一些房屋，你也许会叫它们茅屋。房屋外围，是一道泥土和木头筑成的栅栏。
        - id: ch01-b90
          speaker: anthea
          text: 看起来像那座古埃及小城。
        - id: ch01-b91
          speaker: narrator
          text: >-
            的确有点像。好些没穿衣服的孩子手牵着手，围成圆圈跳舞，玩的也很像《玫瑰圈》或《绕着桑树转》。几位妇女穿着蓝白长袍和兽皮短衣，坐在一片草坡上看他们玩。
        - id: ch01-b92
          speaker: narrator
          text: >-
            菲茨罗伊街来的孩子站在林边观看。稍远处，一位金色长发编成辫子的妇人独自坐着。她望着游戏中的孩子，眼神叫安西娅觉得又悲伤又怜惜。安西娅心想，那些小姑娘里，没有一个是她的女儿。
        - id: ch01-b93
          speaker: narrator
          text: 黑衣的伦敦小姑娘拉了拉安西娅的衣袖。
        - id: ch01-b94
          speaker: imogen
          text: >-
            你看，那边那个人特别像我妈妈。我妈妈要是有工夫把头发梳开，头发可漂亮啦。要是她住在这儿，准不会再打我。这附近大概一家酒馆都没有吧，最近的也得到埃平去。小姐，你说是不是？
        - id: ch01-b95
          speaker: narrator
          text: >-
            伊莫金一激动，便从树林的遮挡里走了出去。那位眼神悲伤的妇人看见她，立刻站了起来。她消瘦的脸一下亮了，像太阳刚升起。两条又长又瘦的胳膊朝伦敦来的孩子伸了过去。
        - id: ch01-b96
          speaker: queen
          text: 伊莫金！伊莫金！
          emotion: surprised
        - id: ch01-b97
          speaker: narrator
          text: >-
            至少，那声音听起来比任何别的词都更像“伊莫金”。四周忽然安静下来。那些孩子停下游戏，草坡上的妇女也不安地望过来。
        - id: ch01-b98
          speaker: imogen
          text: 哦，是妈妈！真的是妈妈！
          emotion: happy
        - id: ch01-b99
          speaker: narrator
          text: >-
            伊莫金喊着跑过空地。母女俩紧紧抱住对方，抱得那么牢，那么用力，一时简直像一尊石头雕出来的像。随后，妇女们都围了上来。
        - id: ch01-b100
          speaker: queen
          text: >-
            真的是我的伊莫金！真的是她！她没被狼吃掉，她回到我身边了。告诉我，宝贝，你怎么逃出来的？你去了哪里？谁给了你吃的，又是谁替你穿上衣服？
          emotion: happy
        - id: ch01-b101
          speaker: imogen
          text: 我什么都不知道。
        - id: ch01-b102
          speakers: [briton_woman_1, briton_woman_2, briton_woman_3]
          ensemble: chorus
          text: 可怜的孩子，狼群把她吓得神志不清了。
          emotion: sad
        - id: ch01-b103
          speaker: queen
          text: 可你还认得我吗？
        - id: ch01-b104
          speaker: narrator
          text: 伊莫金那两条裹在黑衣袖里的胳膊，还紧紧搂着妇人裸露的脖子。
        - id: ch01-b105
          speaker: imogen
          text: 哦，认得。妈妈，我当然认得你。
          emotion: happy
        - id: ch01-b106
          speaker: learned_gentleman
          text: 到底是怎么回事？她们刚才说了什么？
        - id: ch01-b107
          speaker: psammead
          text: 你希望来一个有人想要这孩子的地方。这个孩子说，那是她妈妈。
        - id: ch01-b108
          speaker: learned_gentleman
          text: 那位母亲怎么说？
        - id: ch01-b109
          speaker: psammead
          text: 你不是自己看得见吗？
        - id: ch01-b110
          speaker: learned_gentleman
          text: 可她真是孩子的母亲吗？我是说，孩子真是她的女儿吗？
        - id: ch01-b111
          speaker: psammead
          text: 谁知道？不过，她们各自填上了对方心里的空缺。这就够了。
        - id: ch01-b112
          speaker: learned_gentleman
          text: 哦，这是个好梦。我希望这个孩子能留在梦里。
        - id: ch01-b113
          speaker: narrator
          text: >-
            赛米德鼓起身子，让愿望实现了。伊莫金的将来就这样有了着落，她终于找到了一个想要她的人。
        - id: ch01-b114
          speaker: learned_gentleman
          text: 要是每个没人想要的孩子都能……
        - id: ch01-b115
          speaker: narrator
          text: 那位妇人朝他们走来，打断了学者先生。
        - id: ch01-b116
          speaker: queen
          text: >-
            欢迎你们！我是王后。我的孩子说，你们曾经好心帮过她。只看你们的脸，我就相信她说的是真的。我知道她中了魔法，可这件事她没有说谎，对不对？
          emotion: happy
        - id: ch01-b117
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 那不过是一点小事，没什么值得说的。
        - id: ch01-b118
          speaker: narrator
          text: >-
            真希望你能亲眼看看，那些古代不列颠人给了孩子们和学者先生多少荣誉，又待他们多么亲切。看着那番情形，你一定会以为，孩子原来是值得所有人珍爱的人，而不是一块该在街头被推来搡去，最后藏进贫民习艺所的垃圾。这次招待没有巴比伦那一场那么盛大，可不知为什么，大家心里反而觉得更满足，更快活。
        - id: ch01-b119
          speaker: learned_gentleman
          text: >-
            我觉得，你们几个孩子会对我产生一种奇妙的影响。认识你们以前，我从没做过这样的梦。
        - id: ch01-b120
          speaker: narrator
          text: >-
            那天晚上，不列颠人给他们铺了一大堆干蕨叶当床。等大家独自在星空下躺好，西里尔开了口。
        - id: ch01-b121
          speaker: cyril
          text: >-
            好了，伊莫金的事已经解决，咱们也痛痛快快玩了一回。我提议，趁战斗还没打起来，赶快回家。
        - id: ch01-b122
          speaker: jane
          text: 什么战斗？
        - id: ch01-b123
          speaker: narrator
          text: 简困得迷迷糊糊。
        - id: ch01-b124
          speaker: cyril
          text: >-
            当然是尤利乌斯·恺撒呀，你这只小山羊。还不明白吗？现在是公元前五十五年，恺撒随时都可能出现。
        - id: ch01-b125
          speaker: robert
          text: 我还以为你喜欢恺撒呢。
        - id: ch01-b126
          speaker: cyril
          text: >-
            我喜欢的是历史书里的恺撒。要是真被他的士兵杀掉，那可完全是另一回事。
        - id: ch01-b127
          speaker: anthea
          text: 要是碰见恺撒，说不定我们能劝他别打仗。
        - id: ch01-b128
          speaker: robert
          text: 那你就去劝恺撒吧。
        - id: ch01-b129
          speaker: narrator
          text: 罗伯特笑了。谁也没来得及阻止，学者先生已经说出了愿望。
        - id: ch01-b130
          speaker: learned_gentleman
          text: 我只希望以后有机会见一见恺撒。
        - id: ch01-b131
          speaker: narrator
          text: >-
            赛米德只花了一点点时间鼓起身子，实现了愿望。五个人，加上赛米德一共六个，立刻到了恺撒的营地，就站在他的帐篷外。他们真的见到了恺撒。学者先生只说哪天能见到他，愿望实在含糊，赛米德大概钻了这个空子。因为这里跟大家躺在干蕨叶间许愿时，并不是一天里的同一个时辰。
        - id: ch01-b132
          speaker: narrator
          text: >-
            此时正是日落。那位伟人坐在帐外的椅子上，越过大海望着不列颠，谁也不用告诉他们，就知道他看的一定是那里。帐篷两旁各立着一根柱子，柱顶各有一只金鹰。帐门挂着华丽非凡的垂幅，上面清清楚楚写着S.P.Q.R.几个字母。
        - id: ch01-b133
          speaker: narrator
          text: >-
            恺撒刚才还威严地望着英吉利海峡紫罗兰色的海面，现在又把同样的目光移向这些不速之客。几个人凭空突然出现，他连眼皮都没动一下，紧闭的嘴唇也没有稍稍收紧，仿佛他们只是早就约好、让他等候多时的一支使团。他从容地朝哨兵挥手，哨兵们便手持武器猛扑过来。
        - id: ch01-b134
          speaker: caesar
          text: >-
            退下！恺撒从什么时候开始，会害怕几个孩子和一个读书人？
        - id: ch01-b135
          speaker: narrator
          text: >-
            恺撒的声音像音乐一样震动人心。孩子们听见的是自己唯一懂的语言。学者先生听到的却是拉丁语，口音虽然奇怪，他仍听得明明白白。于是，他也用不大熟练的拉丁语回答。
        - id: ch01-b136
          speaker: learned_gentleman
          text: 恺撒啊，这是一场梦。
        - id: ch01-b137
          speaker: caesar
          text: 梦？梦是什么？
        - id: ch01-b138
          speaker: learned_gentleman
          text: 就是眼前这一切。
        - id: ch01-b139
          speaker: cyril
          text: 才不是梦，这是魔法。我们从另一个时代、另一个地方来的。
        - id: ch01-b140
          speaker: anthea
          text: >-
            我们还想请您别费心去征服不列颠。那地方又小又穷，根本不值得您费事。
        - id: ch01-b141
          speaker: caesar
          text: >-
            你们来自不列颠？衣服式样虽然粗野，布却织得很精细。头发也像罗马公民一样短，不像蛮族那样留长发。不过，我还是认为你们是蛮族。
        - id: ch01-b142
          speaker: jane
          text: >-
            我们才不是！一点也不是！我们来自日不落的国家，还在书里读过您呢。我们那里有很多好东西，圣保罗大教堂、伦敦塔、杜莎夫人蜡像馆，还有……
          emotion: angry
        - id: ch01-b143
          speaker: narrator
          text: 其他人赶紧阻止她继续往下说。
        - id: ch01-b144
          speaker: robert
          text: 别再胡说了。
          emotion: angry
        - id: ch01-b145
          speaker: narrator
          text: >-
            恺撒默默看了他们一会儿，随后叫来一名士兵，走到旁边低声吩咐了几句，这才高声宣布他的安排。
        - id: ch01-b146
          speaker: caesar
          text: >-
            三个年长的孩子可以在营地里随意走动。能亲眼参观恺撒营地的孩子没有几个。这个读书人和年幼的女孩留下来陪我。
        - id: ch01-b147
          speaker: narrator
          text: >-
            谁都不喜欢这个安排。可是恺撒一旦说出一句话，事情就这么决定了，再没有商量的余地。三个年长的孩子只好离开，把简和学者先生留在帐篷旁。
        - id: ch01-b148
          speaker: narrator
          text: >-
            只剩简和学者先生之后，这位伟大的罗马人没费什么力气，就把他们心里的事全都套了出来。可就连恺撒，摸清之后仍然很难弄懂，那些念头究竟是怎么一回事。学者先生始终坚持，眼前的一切不过是一场梦。他也不肯多讲，因为他说自己一开口就会醒来。
        - id: ch01-b149
          speaker: narrator
          text: 简却被仔仔细细盘问了一遍。她满肚子都是铁路、电灯、气球、军舰、大炮和炸药的消息。
        - id: ch01-b150
          speaker: caesar
          text: 你们也用剑打仗吗？
        - id: ch01-b151
          speaker: jane
          text: 用剑，也用枪和大炮。
        - id: ch01-b152
          speaker: narrator
          text: 恺撒追问什么是枪。
        - id: ch01-b153
          speaker: jane
          text: 扣它一下，它就会砰地响一声，然后人就倒下死了。
        - id: ch01-b154
          speaker: caesar
          text: 那么，枪长什么样？
        - id: ch01-b155
          speaker: narrator
          text: 简发现这可不好形容。
        - id: ch01-b156
          speaker: jane
          text: 不过，罗伯特口袋里正好有一把玩具枪。
        - id: ch01-b157
          speaker: narrator
          text: >-
            于是，其他人又被叫了回来。两个男孩把那把手枪从头到尾、仔仔细细讲给恺撒听，他看着那件东西，显得兴致勃勃。那是一把值两先令的手枪，还曾经在古埃及村庄里立过大功。
        - id: ch01-b158
          speaker: caesar
          text: >-
            我要命人造出枪来。在查清你们说的是真是假以前，你们必须留在这里。我刚刚才决定，不列颠不值得我费力入侵。现在听了你们的话，我却确信，那里非常值得去一趟。
        - id: ch01-b159
          speaker: anthea
          text: >-
            可那些全是胡说。不列颠只是个荒蛮的岛，到处都是雾、树林和大河。不过那里的人很善良，我们还认识一个叫伊莫金的小姑娘。再说，您就算造出枪也没有用，没有火药，枪根本打不响。火药还要几百年才会发明。我们不会做，也没法教您。亲爱的恺撒，请您直接回家，放过可怜的小不列颠吧。
        - id: ch01-b160
          speaker: caesar
          text: 可是刚才那个年幼的女孩说……
        - id: ch01-b161
          speaker: anthea
          text: 简说的东西，都是几百几百年以后才会出现的。
        - id: ch01-b162
          speaker: caesar
          text: >-
            那么，这位小姑娘是一名女先知？做这一行，她的年纪是不是太小了？
        - id: ch01-b163
          speaker: narrator
          text: 恺撒的神情带着戏谑。
        - id: ch01-b164
          speaker: cyril
          text: 您想叫她女先知也行，不过安西娅说的都是真的。
        - id: ch01-b165
          speaker: caesar
          text: 安西娅？这是个希腊名字。
        - id: ch01-b166
          speaker: cyril
          text: >-
            很可能吧。可我真的希望您别再想着征服不列颠。那里不值得去，真的不值得！
        - id: ch01-b167
          speaker: narrator
          text: 西里尔忧心忡忡。
        - id: ch01-b168
          speaker: caesar
          text: >-
            正好相反。你们的话已经让我下定决心。哪怕只是为了弄清不列颠到底是什么模样，我也要去。卫兵，把这些孩子扣起来。
        - id: ch01-b169
          speaker: robert
          text: >-
            快走，别等卫兵真来抓人。巴比伦那一回，我们已经受够这种事了。
        - id: ch01-b170
          speaker: narrator
          text: >-
            简把护符举到夕阳照不到的地方，念出了那个名字。学者先生被推进拱门，其他人也用从未有过的速度冲过去，回到自己的时代，回到学者先生那间安静又积满灰尘的客厅。
        - id: ch01-b171
          speaker: narrator
          text: >-
            说来也奇怪。当恺撒驻扎在高卢海岸时，我想大约就在布洛涅附近，他正坐在帐篷前的落日余晖里，望着英吉利海峡紫罗兰色的海水。忽然，他吃了一惊，揉了揉眼睛，又叫来自己的秘书。那个年轻人听见召唤，立刻从帐篷里赶了出来。
        - id: ch01-b172
          speaker: caesar
          text: >-
            马库斯，我刚才做了一场极其奇妙的梦。有些地方已经记不得了，可剩下的部分足以让我决定那件一直没有定下来的事。明天，给从利格里斯河调来的船装足给养。我们要驶向那座三角形的岛。第一次，只带两个军团。
        - id: ch01-b173
          speaker: marcus
          text: 如果传闻是真的，这些兵力应该足够。
        - id: ch01-b174
          speaker: caesar
          text: >-
            可如果我的梦才是真的，那么一百个军团也不够。因为刚才折磨恺撒头脑的，是他一生中最不可思议的一场梦。你知道，恺撒这一生也做过一些怪梦。
        - id: ch01-b175
          speaker: narrator
          text: 大家坐下来喝茶时，罗伯特埋怨起简来。
        - id: ch01-b176
          speaker: robert
          text: >-
            都怪你把现在的事全告诉恺撒。要不然，他根本不会去入侵不列颠。
        - id: ch01-b177
          speaker: anthea
          text: 胡说。那件事早在几百年前就已经决定了。
        - id: ch01-b178
          speaker: narrator
          text: 安西娅一边说，一边给大家倒茶。
        - id: ch01-b179
          speaker: cyril
          text: >-
            我可说不准。请把果酱递给我。时间是什么思想里的某个东西，这件事真叫人糊涂。要是所有事情都在同时发生……
        - id: ch01-b180
          speaker: anthea
          text: 不可能！现在就是现在，过去就是过去。
        - id: ch01-b181
          speaker: cyril
          text: >-
            也不总是这样。咱们待在过去的时候，现在不就成了未来吗？你看！
        - id: ch01-b182
          speaker: narrator
          text: 西里尔说得很得意，安西娅没法反驳。
        - id: ch01-b183
          speaker: robert
          text: 我倒真想在营地里多看一会儿。
        - id: ch01-b184
          speaker: anthea
          text: >-
            是啊，这一趟没捞回多少本钱。不过伊莫金幸福了，这总算一件好事。我们把她留在了幸福的过去。我常常在诗集里读到，人们在过去很幸福。现在我总算懂那句话是什么意思了。
        - id: ch01-b185
          speaker: psammead
          text: 留在过去，这主意倒也不坏。
        - id: ch01-b186
          speaker: narrator
          text: >-
            赛米德睡意蒙眬地从袋子里伸出脑袋，又猛地缩了回去。后来发生了一件事，让每个人都想起了它这句话。
