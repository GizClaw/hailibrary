        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
