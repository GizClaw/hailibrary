  chapters:
    - id: ch01
      title: THE LITTLE BLACK GIRL AND JULIUS CAESAR
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A great city swallowed by the sea and a beautiful country ruined by an active volcano are not sights you meet every day. Even after all the wonders they had seen, Atlantis had taken the breath from Cyril, Robert, Anthea, and Jane in a way that nothing else had.
        - id: ch01-b02
          speaker: narrator
          text: That feeling lasted for days. The learned gentleman was just as overwhelmed. He used much of his remaining breath to tell Anthea about the extraordinary dream he believed he had seen.
        - id: ch01-b03
          speaker: learned_gentleman
          text: You would hardly believe a dream could be so detailed.
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: Anthea said she could believe it very easily. He no longer spoke of thought-transference. He had witnessed too many wonders for that explanation now.
        - id: ch01-b05
          speaker: narrator
          text: None of the children proposed another journey through the Amulet. Robert spoke for everyone when he said they were fed up with it for a while. They truly were.
        - id: ch01-b06
          speaker: narrator
          text: The Psammead buried itself in its sand and stayed there. It was completely worn out. The flood had terrified it, and afterward it had been forced into far too much violent exercise. First the learned gentleman and then the Babylonian queen had spoken thoughtless wishes, and the poor creature had been obliged to grant them both.
        - id: ch01-b07
          speaker: narrator
          text: The children wisely let it sleep. Their recent adventures had made one danger clearer and clearer. Taking a wish-granting creature among strange people was never safe. Any stranger might carelessly say, "I wish," and the next moment an unwanted wish would come true before the children could prevent it.
        - id: ch01-b08
          speaker: narrator
          text: London still offered plenty to do without either Amulet or Psammead. They could visit the Tower of London, the Houses of Parliament, the National Gallery, the Zoo, the parks, the South Kensington museums, Madame Tussaud's waxworks, or the Botanical Gardens at Kew. The pleasant way to Kew was by river steamer, and that was the way they meant to go. They discussed what food to carry, how much they would need, and what the whole outing would cost. But they never went at all, because while they were making those plans, the adventure of the little black girl began.
        - id: ch01-b09
          speaker: narrator
          text: The children sat on a bench in St James's Park, watching a pelican refuse every invitation from the playful seagulls. The pelican behaved with great dignity. It knew it had quite the wrong figure for games and liked to pretend that was not why it refused them.
        - id: ch01-b10
          speaker: narrator
          text: The shock of Atlantis was beginning to fade. Cyril, who always needed to understand everything, sat turning matters over in his head. Robert asked why he looked so cross.
        - id: ch01-b11
          speaker: cyril
          text: I'm not cross. I'm thinking. When I've worked it all out, I'll tell you.
        - id: ch01-b12
          speaker: jane
          text: If it's about the Amulet, I don't want to know.
        - id: ch01-b13
          speaker: cyril
          text: No one asked you. I haven't finished thinking it through anyway. For now, let's go to Kew.
        - id: ch01-b14
          speaker: robert
          text: I'd rather go in a steamer.
        - id: ch01-b15
          speaker: narrator
          text: The girls laughed at this, because Kew by steamer was exactly what Cyril meant.
        - id: ch01-b16
          speaker: cyril
          text: Oh, very clever. Go on, laugh. I would.
        - id: ch01-b17
          speaker: anthea
          text: Well, he was rather funny.
        - id: ch01-b18
          speaker: robert
          text: I wouldn't think so hard, Squirrel, if it hurts this much.
        - id: ch01-b19
          speaker: cyril
          text: Oh, be quiet. Or talk about Kew.
        - id: ch01-b20
          speaker: anthea
          text: I want to see the palms. I wonder if they're like the ones on that island, where the Reverend Half-Curate married the Cook and the Burglar.
        - id: ch01-b21
          speaker: narrator
          text: At once, their small quarrel washed away beneath a pleasant tide of memories. They talked over that island, the Cook, the Burglar, the Reverend Half-Curate, and all the other strange times they had shared. Again and again one child asked, "Do you remember?" and another cried, "Have you forgotten?" At last the flood of recollection began to ebb.
        - id: ch01-b22
          speaker: cyril
          text: My hat! We really have had some times.
        - id: ch01-b23
          speaker: robert
          text: We certainly have.
        - id: ch01-b24
          speaker: jane
          text: Let's not have any more of them.
          emotion: fearful
        - id: ch01-b25
          speaker: cyril
          text: That's exactly what I was thinking.
        - id: ch01-b26
          speaker: narrator
          text: Just then they heard a sniff close beside them. A small girl stood there, watching them. She was not black at all. Her dress was black, too large, and too long. A speckled sailor hat with a black ribbon nearly swallowed her small fair head. She was shabby and dirty, and she had cried until her bright blue eyes were almost hidden between swollen lids.
        - id: ch01-b27
          speaker: anthea
          text: Oh, dear! What's happened to you?
        - id: ch01-b28
          speaker: narrator
          text: Anthea sprang up and touched the girl's arm. The child shook her hand away.
        - id: ch01-b29
          speaker: imogen
          text: You leave me alone. I ain't done nothing to you.
          emotion: angry
        - id: ch01-b30
          speaker: anthea
          text: But what's wrong? Has someone hurt you?
        - id: ch01-b31
          speaker: imogen
          text: What's it got to do with you? You're all right.
          emotion: angry
        - id: ch01-b32
          speaker: robert
          text: Come away, Anthea. She's a nasty, rude little kid.
        - id: ch01-b33
          speaker: anthea
          text: No, she isn't. She's terribly unhappy. Please tell me what's wrong.
        - id: ch01-b34
          speaker: imogen
          text: You're all right. You ain't going to the Union.
          emotion: sad
        - id: ch01-b35
          speaker: anthea
          text: Can we take you home?
        - id: ch01-b36
          speaker: jane
          text: Where does your mother live?
        - id: ch01-b37
          speaker: imogen
          text: She don't live nowhere. She's dead. So there!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: The girl opened her swollen eyes as wide as they would go. She stamped one foot in a burst of miserable fury and ran from them. Yet she only went as far as the next bench. There she flung herself down, curled into her loose black dress, and began to cry with all her strength. She did not even try to stop herself.
        - id: ch01-b39
          speaker: narrator
          text: Anthea followed at once and wrapped both arms tightly around the small, hunched figure in black.
        - id: ch01-b40
          speaker: anthea
          text: Oh, please don't cry like that, dear. Tell Anthea everything. I'll help you. There, there. Please don't cry.
          emotion: calm
        - id: ch01-b41
          speaker: narrator
          text: Anthea whispered beneath the brim of the large sailor hat, which had become very crooked indeed. The others understood that she could manage better alone, so they waited at a little distance. One or two people passing through the park stared at the strange group with curiosity. Gradually the child's sobs grew less constant. She still cried part of the time, but during the quiet moments she began to tell Anthea her story.
        - id: ch01-b42
          speaker: narrator
          text: At last Anthea beckoned Cyril over and whispered furiously. The story she had heard was horrible. The girl's name was Imogen, and she would be nine next November. Her father had been a carpenter and a steady man. He never drank except on Saturdays. He had brought his family to London because he needed work, but there was no work to be found. Then he died.
        - id: ch01-b43
          speaker: anthea
          text: Now her mother's dead too. Tonight she can stay with Mrs Shrobsall, a landlady who's been kind to her. But tomorrow the Relieving Officer will take her to the Union. That means the Workhouse. It's too horrible! What can we do?
          emotion: angry
        - id: ch01-b44
          speaker: jane
          text: Let's ask the learned gentleman.
        - id: ch01-b45
          speaker: narrator
          text: No one could think of anything better, so the whole party set off for Fitzroy Street as fast as it could go. The children kept Imogen among them, and she held tightly to Anthea's hand throughout the walk. Her tears had stopped now. She only sniffed gently from time to time as they hurried toward the learned gentleman's rooms.
        - id: ch01-b46
          speaker: narrator
          text: The learned gentleman looked up from his writing with a smile that came much more easily to him these days. The children were thoroughly at home in his room now, and the room itself seemed glad to receive them. Even the painted mummy-case appeared to smile in its distant, superior, ancient Egyptian fashion, as though it too was rather pleased to see them.
        - id: ch01-b47
          speaker: narrator
          text: Anthea stayed outside on the stairs with Imogen while the others explained. The learned gentleman listened gravely.
        - id: ch01-b48
          speaker: cyril
          text: It seems terribly hard. I've heard that rich people sometimes want children very badly. I know I never would, but they do. Someone must be glad to have her.
        - id: ch01-b49
          speaker: robert
          text: Gypsies are very fond of children. They're always stealing them. Perhaps they'd take her.
        - id: ch01-b50
          speaker: jane
          text: She really is a nice little girl. She was rude because we looked happy and she wasn't. You understand that, don't you?
        - id: ch01-b51
          speaker: learned_gentleman
          text: Yes, I understand it very well. You are right. There must be a home where she would be welcome.
        - id: ch01-b52
          speaker: narrator
          text: As he frowned thoughtfully and turned a little blue Egyptian image in his fingers, Anthea sat outside wondering why the explanation was taking so long. She kept talking to Imogen, trying to cheer and comfort her. That was why she never noticed the Psammead wake at the sound of her voice, shake the sand from its fur, and creep crookedly up the stairs. It had come quite close before she saw it. Then she picked it up and settled it on her lap.
        - id: ch01-b53
          speaker: imogen
          text: What's that? Is it a cat, or an organ monkey, or what?
        - id: ch01-b54
          speaker: learned_gentleman
          text: I wish we could find a home where they would be glad to have her.
        - id: ch01-b55
          speaker: narrator
          text: The instant those careless words reached Anthea, she felt the Psammead begin to swell upon her lap. A wish was being granted. She sprang to her feet, lifted her skirt around the creature to make a bag for it, caught Imogen firmly by the hand, and rushed into the learned gentleman's room before the magic could carry anyone away alone.
        - id: ch01-b56
          speaker: anthea
          text: At least we must stay together! Everyone hold hands, quickly!
        - id: ch01-b57
          speaker: narrator
          text: They formed a ring like children playing Mulberry Bush or Ring-o'-Roses. Anthea joined it while gripping the hem of her skirt in her teeth so the Psammead could not fall out.
        - id: ch01-b58
          speaker: learned_gentleman
          text: Is this a game?
        - id: ch01-b59
          speaker: narrator
          text: No one answered him. For one uneasy moment, nothing happened. Then came the strange sensation that almost always accompanied this sort of magical journey. They seemed to turn upside down and inside out at once, while their sight clouded over in a dizzy, dim mist.
        - id: ch01-b60
          speaker: narrator
          text: Slowly the mist cleared and the inside-out feeling passed. The six still stood in a ring, holding hands just as before. But their twelve feet rested on green grass instead of the learned gentleman's carpet. A pale blue sky stretched where his dusty ceiling had been. The painted mummy-case and the walls were gone. Around them rose tall, dark oaks and ashes, with tangled bushes and creeping ivy between them. Beneath the beeches lay only drifts of their own dead red leaves, broken here and there by a tender green fern.
        - id: ch01-b61
          speaker: narrator
          text: Six people holding hands in a wood sounds simple enough. Yet these six had no idea where the wood stood, and what mattered even more, they did not know when it stood. A peculiar feeling hung over the place. It made the children nearly certain they had reached a time very long ago, and it made the learned gentleman sigh over another dream. Imogen simply stared with her mouth very wide open.
        - id: ch01-b62
          speaker: imogen
          text: Oh, my!
          emotion: surprised
        - id: ch01-b63
          speaker: cyril
          text: Where are we?
        - id: ch01-b64
          speaker: psammead
          text: We are in Britain.
        - id: ch01-b65
          speaker: anthea
          text: But when are we?
        - id: ch01-b66
          speaker: psammead
          text: It is about fifty-five years before you begin counting your years. Is there anything else you want to know? I've been here before. It has hardly changed.
        - id: ch01-b67
          speaker: narrator
          text: The Psammead poked its head out of Anthea's blue skirt and turned its snail eyes from side to side.
        - id: ch01-b68
          speaker: anthea
          text: Yes, but why did we come here?
        - id: ch01-b69
          speaker: psammead
          text: Your inconsiderate friend wished for a home where people would welcome that unattractive young female you picked up goodness knows where. Proper children in the Megatherium age never spoke to shabby strangers in parks. He wanted someone to be glad of this unwanted stranger, so here you are!
          emotion: angry
        - id: ch01-b70
          speaker: anthea
          text: I see that. But why this place, at this time?
        - id: ch01-b71
          speaker: psammead
          text: Do you imagine anyone in your towns and your time would want a child like her? You've made such a mess of your country that there's no room for half the children, and no one to want them.
          emotion: angry
        - id: ch01-b72
          speaker: anthea
          text: We didn't make that mess, you know.
        - id: ch01-b73
          speaker: psammead
          text: And you brought me here without so much as a waterproof, when everyone knows Ancient Britain was damp and foggy!
          emotion: angry
        - id: ch01-b74
          speaker: robert
          text: Here, you can have my coat.
        - id: ch01-b75
          speaker: narrator
          text: Robert took it off. Anthea laid the Psammead on it and folded the cloth around the creature until only its eyes and furry ears showed.
        - id: ch01-b76
          speaker: anthea
          text: There. If rain comes, I can cover you at once. Now what should we do?
          emotion: calm
        - id: ch01-b77
          speaker: narrator
          text: Everyone crowded close to hear the answer.
        - id: ch01-b78
          speaker: imogen
          text: Can't the organ monkey talk too? I thought only parrots did that!
          emotion: surprised
        - id: ch01-b79
          speaker: psammead
          text: Do? I don't care what you do!
          emotion: angry
        - id: ch01-b80
          speaker: narrator
          text: It pulled its head and ears beneath Robert's coat. The others looked helplessly at one another.
        - id: ch01-b81
          speaker: learned_gentleman
          text: It is only a dream. If we can keep ourselves from waking, something is sure to happen.
        - id: ch01-b82
          speaker: narrator
          text: Something did. Children's laughter and many voices broke the deep silence of the forest.
        - id: ch01-b83
          speaker: cyril
          text: Let's find out what it is.
        - id: ch01-b84
          speaker: learned_gentleman
          text: Come along, Jane. In a dream, you must go with the current. If you resist it, you wake.
        - id: ch01-b85
          speaker: narrator
          text: Jane hung back, but the learned gentleman's dream advice persuaded her to follow. They found a break in the undergrowth that looked something like a path, though only like a very foolish person's idea of one. Branches and leaves crowded it on both sides. The six travelers moved along it in single file, with the learned gentleman leading the way.
        - id: ch01-b86
          speaker: narrator
          text: Before long, the poor little path opened into a broad clearing in the forest. A number of low houses stood there, though you might have called them huts instead. Around the settlement ran a rough fence built of mud and wood. After the dark trees, the open space and the people within it seemed suddenly bright and busy.
        - id: ch01-b87
          speaker: anthea
          text: It looks like that old Egyptian town.
        - id: ch01-b88
          speaker: narrator
          text: It did look rather like that old Egyptian town. A group of children with no clothes at all were playing a game that seemed very much like Ring-o'-Roses or Mulberry Bush. They held hands and danced around in a circle. On a grassy bank nearby, several women watched them. Some wore blue and white robes, while others had tunics made from animal skins.
        - id: ch01-b89
          speaker: narrator
          text: The children from Fitzroy Street remained at the forest's edge and watched the game. One woman sat a little apart from all the others. Long fair hair hung in braids down her back. She followed the dancing children with her eyes, and the sorrow in her face made Anthea's heart ache. Anthea felt sure that none of the little girls in that merry ring belonged to the lonely woman.
        - id: ch01-b90
          speaker: imogen
          text: Look at that one. She's ever so like Mother. Mother's hair was lovely when she had time to comb it. She'd never have beaten me if she'd lived here. There can't be a public house nearer than Epping, can there, miss?
        - id: ch01-b91
          speaker: narrator
          text: In her eagerness, Imogen stepped out from the trees. The sad woman saw her and rose. Her thin face brightened like sunrise, and she reached both long arms toward the London child.
        - id: ch01-b92
          speaker: british_queen
          text: Imogen! Imogen!
          emotion: surprised
        - id: ch01-b93
          speaker: narrator
          text: For one long moment, a great silence held the clearing. The naked children stopped in the middle of their dance, their hands still joined. Every woman on the grassy bank turned to stare anxiously at the black-clad child and the fair-haired woman who was calling her name.
        - id: ch01-b94
          speaker: imogen
          text: It is Mother! It really is!
          emotion: happy
        - id: ch01-b95
          speaker: narrator
          text: Imogen raced across the open ground without another thought. The woman rushed to meet her. They threw their arms around each other and clung so closely, and with such strength, that for one still moment they looked like a single statue carved from stone. Then the spell of silence broke, and all the other women crowded around the reunited pair.
        - id: ch01-b96
          speaker: british_queen
          text: It is my Imogen! The wolves did not eat her. She has come back! My darling, how did you escape? Where have you been? Who gave you food and clothes?
          emotion: happy
        - id: ch01-b97
          speaker: imogen
          text: I don't know nothing.
        - id: ch01-b98
          speakers: [british_woman_1, british_woman_2]
          ensemble: duo
          text: Poor child! The terror of the wolves has turned her mind.
          emotion: sad
        - id: ch01-b99
          speaker: british_queen
          text: But you do know me?
        - id: ch01-b100
          speaker: imogen
          text: Oh, yes, Mother. I know you right enough.
          emotion: happy
        - id: ch01-b101
          speaker: narrator
          text: Her black sleeves stayed locked around the woman's bare neck.
        - id: ch01-b102
          speaker: learned_gentleman
          text: What are they saying?
        - id: ch01-b103
          speaker: psammead
          text: You wished to find someone who wanted the child. She says this woman is her mother.
        - id: ch01-b104
          speaker: learned_gentleman
          text: And what does the woman say?
        - id: ch01-b105
          speaker: psammead
          text: You can see for yourself.
        - id: ch01-b106
          speaker: learned_gentleman
          text: But is Imogen truly her daughter?
        - id: ch01-b107
          speaker: psammead
          text: Who knows? Each one fills the empty place in the other's heart. That is enough.
        - id: ch01-b108
          speaker: learned_gentleman
          text: This is a good dream. I wish the child could remain in it.
          emotion: happy
        - id: ch01-b109
          speaker: narrator
          text: Again the Psammead began to blow itself out, and again its magic answered the careless words. The learned gentleman's wish was granted. Imogen would remain in this dream of ancient Britain, with the woman whose empty place she filled. Her future was safe now. She had found not merely a home, but someone who truly wanted her.
        - id: ch01-b110
          speaker: learned_gentleman
          text: If only every child whom no one wants could find such a home.
        - id: ch01-b111
          speaker: narrator
          text: The woman interrupted him as she came toward them.
        - id: ch01-b112
          speaker: british_queen
          text: You are all welcome! I am the Queen. My child says you were kind to her, and your faces tell me that she speaks the truth. Your clothes are strange, and the child is clearly bewitched, but I know she is honest about this. Is it not so?
        - id: ch01-b113
          speakers: [anthea, cyril, robert, jane]
          ensemble: chorus
          text: It was nothing, really.
        - id: ch01-b114
          speaker: narrator
          text: The ancient Britons poured honors and kindness upon the children and the learned gentleman. If you had seen the welcome, you would have thought a child was precious and worth making a fuss over. You would never have guessed that a child might be treated like rubbish, pushed through city streets, and hidden away in a Workhouse. The feast was not nearly as grand as their entertainment in Babylon, yet somehow it was far more satisfying.
        - id: ch01-b115
          speaker: learned_gentleman
          text: You children must have some wonderful influence upon me. Before I knew you, my dreams were never like these.
          emotion: surprised
        - id: ch01-b116
          speaker: narrator
          text: At last night settled over the British village. Beneath the stars, the Britons made their guests a deep bed from heaps of dry fern. When the feasting and kindness were over, and the children and the learned gentleman were finally alone together on that rustling bed, Cyril told them what had been worrying him.
        - id: ch01-b117
          speaker: cyril
          text: Imogen is safe, and we've had a fine time. I say we go home before the fighting starts.
        - id: ch01-b118
          speaker: jane
          text: What fighting do you mean?
        - id: ch01-b119
          speaker: cyril
          text: Julius Caesar, you little goat. If this is the year fifty-five, Caesar could arrive at any moment.
        - id: ch01-b120
          speaker: robert
          text: I thought you liked Caesar.
        - id: ch01-b121
          speaker: cyril
          text: I like reading about him in history. Being killed by his soldiers would be quite different.
        - id: ch01-b122
          speaker: anthea
          text: If we met Caesar, perhaps we could persuade him not to fight.
        - id: ch01-b123
          speaker: robert
          text: You persuade Caesar? That's a good one!
        - id: ch01-b124
          speaker: learned_gentleman
          text: I only wish we could see Caesar sometime.
        - id: ch01-b125
          speaker: narrator
          text: The learned gentleman spoke before anyone could stop him. Those innocent words were a wish, and the Psammead needed only a moment to swell for wish-giving. The dried ferns, the stars, and the British village vanished. Then the five travelers, or six if you count the Psammead, found themselves standing in Caesar's military camp, immediately outside the great general's own tent. And there before them sat Caesar himself.
        - id: ch01-b126
          speaker: narrator
          text: The Psammead had taken advantage of the loose wording of the wish. Though the learned gentleman had spoken among the ferns at night, they arrived in the camp at sunset. Caesar sat upon a chair outside his own tent and gazed across the sea toward Britain. Everyone knew where he was looking without being told. Two golden eagles stood on tall posts, one on each side of the splendid tent, and the letters S.P.Q.R. marked its gorgeous flaps.
        - id: ch01-b127
          speaker: narrator
          text: Caesar turned from the violet water and fixed the newcomers with the same majestic gaze. Though they had appeared out of empty air, not one eyelid flickered. Not even the smallest muscle tightened around his firm mouth. He looked as if this strange little embassy had been expected for hours. The sentries had seen the sudden arrival too. They sprang forward with weapons ready, but Caesar stopped them by raising one calm hand.
        - id: ch01-b128
          speaker: caesar
          text: Back! Since when has Caesar been afraid of children and students?
        - id: ch01-b129
          speaker: narrator
          text: To the children, Caesar seemed to speak the only language they knew. The learned gentleman heard something quite different. Caesar's lips were forming Latin words. The accent sounded strange, but every word was clear to him. He answered in Latin too, though his own words came out rather stiffly.
        - id: ch01-b130
          speaker: learned_gentleman
          text: O Caesar, this is a dream.
        - id: ch01-b131
          speaker: caesar
          text: Do you call this a dream? What is a dream?
        - id: ch01-b132
          speaker: learned_gentleman
          text: This is.
        - id: ch01-b133
          speaker: cyril
          text: No, it isn't. It's a kind of magic. We've come from a different place and time.
        - id: ch01-b134
          speaker: anthea
          text: And we want you not to conquer Britain. It's a poor little country and not worth the trouble.
        - id: ch01-b135
          speaker: caesar
          text: Are you British? Your clothes are crude but well woven, and your hair is short like a Roman citizen's, not long like a barbarian's. Yet barbarians are what I judge you to be.
        - id: ch01-b136
          speaker: jane
          text: We are not barbarians! We come from the country where the sun never sets. We've read about you in books, and our country is full of wonderful things. There's St Paul's, the Tower of London, Madame Tussaud's Exhibition, and ever so much more.
          emotion: angry
        - id: ch01-b137
          speaker: narrator
          text: The others stopped her.
        - id: ch01-b138
          speaker: robert
          text: Don't talk such nonsense.
          emotion: angry
        - id: ch01-b139
          speaker: narrator
          text: Caesar studied the children for a long moment without speaking. Their claims about Britain and the future gave away nothing he could easily judge. At last he called one of his soldiers. The two stepped aside, and Caesar spoke to him privately before turning back to the visitors.
        - id: ch01-b140
          speaker: caesar
          text: You three older children may go anywhere within my camp. Few children receive the honor of seeing Caesar's camp. The student and the youngest girl will stay here with me.
        - id: ch01-b141
          speaker: narrator
          text: No one liked that arrangement in the least. Still, when Caesar said a thing, that thing was so, and there was no more to be said about it. Anthea, Cyril, and Robert had to go and explore the camp, while Jane and the learned gentleman remained alone with the great Roman.
        - id: ch01-b142
          speaker: narrator
          text: Caesar found it easy enough to turn those two inside out with his questions. Yet even he could not make head or tail of the strange things he discovered in their minds. The learned gentleman insisted that the whole visit was a dream. He refused to talk much because he feared that too many words would wake him. Jane had no such fear. When Caesar questioned her closely, she poured out information about railways, electric lights, balloons, warships, cannons, and dynamite.
        - id: ch01-b143
          speaker: caesar
          text: And do your people fight with swords?
        - id: ch01-b144
          speaker: jane
          text: Yes, and with guns and cannons too.
        - id: ch01-b145
          speaker: narrator
          text: Caesar asked what guns were.
        - id: ch01-b146
          speaker: jane
          text: You fire them, they make a bang, and people fall down dead.
        - id: ch01-b147
          speaker: caesar
          text: But what does a gun look like?
        - id: ch01-b148
          speaker: narrator
          text: Jane struggled to explain.
        - id: ch01-b149
          speaker: jane
          text: Robert has a toy gun in his pocket.
        - id: ch01-b150
          speaker: narrator
          text: So Caesar ordered the other children to be brought back. Robert produced the toy pistol from his pocket. The boys explained every part of it as fully as they could. It was only a two-shilling pistol, but it was the very one that had done such good service in the old Egyptian village. Caesar turned it over and examined it with the deepest interest.
        - id: ch01-b151
          speaker: caesar
          text: I will have guns made. You will remain here until I know whether you speak the truth. I had decided Britain was not worth invading, but your information has convinced me that it is.
        - id: ch01-b152
          speaker: anthea
          text: But it's all nonsense! Britain is only a wild island with fog, forests, and great rivers. The people are kind, though. We know a little girl there named Imogen. And guns are useless without gunpowder. That won't be invented for hundreds of years, and we cannot make it or tell you how. Please go home, dear Caesar, and leave poor little Britain alone.
        - id: ch01-b153
          speaker: caesar
          text: But the other girl told me a very different story.
        - id: ch01-b154
          speaker: anthea
          text: Everything Jane described belongs hundreds and hundreds of years in the future.
        - id: ch01-b155
          speaker: caesar
          text: Then the little one is a prophetess? She seems rather young for the work.
        - id: ch01-b156
          speaker: cyril
          text: Call her a prophetess if you want, but Anthea is telling the truth.
        - id: ch01-b157
          speaker: caesar
          text: Anthea? That is a Greek name.
        - id: ch01-b158
          speaker: cyril
          text: It probably is. But please give up conquering Britain. It truly isn't worth doing.
        - id: ch01-b159
          speaker: caesar
          text: Quite the opposite. What you have told me makes me determined to go, if only to discover what Britain is really like. Guards, hold these children.
        - id: ch01-b160
          speaker: robert
          text: Quick, before the guards start holding us! We had enough of that in Babylon.
        - id: ch01-b161
          speaker: narrator
          text: Jane lifted the Amulet where the sunset could not shine through its opening and spoke the powerful word. The arch opened. They pushed the learned gentleman through it first, and the rest followed more quickly than they had ever passed through before. A moment later, they were safely back in their own time, standing in the learned gentleman's quiet, dusty sitting room.
        - id: ch01-b162
          speaker: narrator
          text: Now here is a curious thing. When Caesar camped on the coast of Gaul, somewhere near Boulogne, he really did sit before his tent in the glow of sunset and watch the violet waters of the English Channel. All at once, the great man started. He rubbed his eyes and called for his secretary. A young man answered at once and hurried out from inside the tent.
        - id: ch01-b163
          speaker: caesar
          text: Marcus, I have dreamed a most extraordinary dream. I have forgotten some of it, but I remember enough to settle what was undecided. Tomorrow we will provision the ships brought from the Ligeris. We sail for the three-cornered island with two legions. If what we have heard is true, that should be enough. But if my dream is true, a hundred legions will not be enough. It was the strangest dream ever to trouble even Caesar's mind, and Caesar has dreamed strange things before.
          emotion: surprised
        - id: ch01-b164
          speaker: narrator
          text: Back at home, the children sat down to tea.
        - id: ch01-b165
          speaker: robert
          text: Jane, if you hadn't told Caesar what our country becomes, he would never have invaded Britain.
        - id: ch01-b166
          speaker: anthea
          text: Don't be silly. It was all settled hundreds of years ago.
        - id: ch01-b167
          speaker: cyril
          text: I'm not sure. Pass the jam, please. This business about time being only a thingummy in your thoughts is very confusing. Suppose everything happens at once. What then?
        - id: ch01-b168
          speaker: anthea
          text: It can't! The present is the present, and the past is the past.
        - id: ch01-b169
          speaker: cyril
          text: That isn't always true. When we stood in the Past, the present was still the future. What do you say to that?
        - id: ch01-b170
          speaker: narrator
          text: Anthea could not deny it.
        - id: ch01-b171
          speaker: robert
          text: I wish we'd seen more of Caesar's camp.
        - id: ch01-b172
          speaker: anthea
          text: Yes, we didn't get much for our money. But Imogen is happy. That's something. We left her happy in the Past. I've read poems about people being happy in the Past, and now I understand what they mean.
          emotion: happy
        - id: ch01-b173
          speaker: psammead
          text: Being left in the Past isn't such a bad idea.
        - id: ch01-b174
          speaker: narrator
          text: Sleepily, the Psammead put its head out of its bag, then drew it in again at once. Later, when other things happened, everyone remembered those words.
