  chapters:
    - id: ch01
      title: THE QUEEN IN LONDON
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Cyril and the others told Jane about the Queen's conversation, the banquet, and the entertainment in Babylon. They carefully ended their account before they reached the dungeon.
        - id: ch01-b02
          speaker: cyril
          text: Now tell us what happened to you.
        - id: ch01-b03
          speaker: jane
          text: Going there wasn't much use if you never even tried to find the Amulet.
        - id: ch01-b04
          speaker: cyril
          text: We learned it wasn't in Babylon. It had already been lost. We'll search somewhere else, somewhere friendly where everybody is pleasant to us. But what happened to you?
        - id: ch01-b05
          speaker: jane
          text: That smooth-faced man of the Queen's came for me. What was his name?
        - id: ch01-b06
          speaker: cyril
          text: Ritti-Marduk.
        - id: ch01-b07
          speaker: jane
          text: Yes, Ritti-Marduk. He came just after the Psammead bit the gatekeeper's wife's little boy, and he took me to the Palace. I had supper with the young Egyptian Queen. She's lovely, and hardly older than you. She told me all about Egypt, and afterward we played ball. Then the Babylonian Queen sent for me. I like her too. She talked with the Psammead, I fell asleep, and then you woke me. That's everything.
        - id: ch01-b08
          speaker: narrator
          text: When they woke the Psammead, it gave the same account. Then it added something of its own.
        - id: ch01-b09
          speaker: psammead
          text: Whatever made you tell that Queen I grant wishes? Sometimes I think you were born without even the faintest beginnings of brains.
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: The children did not know what those long words meant, but they sounded insulting.
        - id: ch01-b11
          speaker: cyril
          text: I don't see that we did any harm.
        - id: ch01-b12
          speaker: psammead
          text: Harm? Certainly not! Quite the opposite! Except that she wished to find herself in your country soon, and soon might mean this very moment.
        - id: ch01-b13
          speaker: robert
          text: Then it's your fault. You could have made soon mean next year, or next century.
        - id: ch01-b14
          speaker: psammead
          text: There you go making the usual mistake. It was her wish, so soon had to mean what she meant. She meant the next time the King goes lion hunting. She'll have a whole day, perhaps two, to do exactly as she likes. She knows nothing about time being only a mode of thought.
        - id: ch01-b15
          speaker: cyril
          text: Then we'll have to give her the best time we can. She treated us decently. After dinner, let's finally go feed the ducks in St. James's Park. After Babylon and thousands of years ago, I'd like to see something real and present. Will you come, Psammead?
        - id: ch01-b16
          speaker: psammead
          text: Where is my priceless basket woven from sacred rushes? I cannot go outside wearing nothing, and I will not.
        - id: ch01-b17
          speaker: narrator
          text: They remembered too late that, in their rush to leave Babylon, they had forgotten the bass bag entirely. The Psammead's traveling basket had been left thousands of years in the past, and there was no simple way to go back and collect it.
        - id: ch01-b18
          speaker: robert
          text: It wasn't really priceless. Fish sellers in Farringdon Market give those bags away for nothing.
        - id: ch01-b19
          speaker: psammead
          text: So because I care nothing for the rubbish of this disgusting modern world, you think you can put me in a free fish bag. Very well. I am going to sand. Do not wake me.
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: It turned to sand then and there, which was its way of going to bed. The boys went alone to feed the ducks. Anthea and Jane spent the whole afternoon sewing. From each of their best green Liberty sashes they cut half a yard, and they sacrificed a towel to make the lining. They kept at the work for hour after hour, each girl making one side of a new bag for the Psammead. It was meant to replace the humble bass bag they had carelessly left behind in Babylon.
        - id: ch01-b21
          speaker: narrator
          text: Jane embroidered four-leaf shamrocks. They were the only things she knew how to embroider, because she had learned them at school, and luckily some of her school silk remained. Even then, Anthea had to draw the pattern first. On her own side, Anthea hurriedly but lovingly worked letters in chain stitch. She meant to write travelling carriage, but she made the letters so large that there was no room for the second word. Nurse's sewing machine turned the two decorated halves into a proper bag, and the girls used their own best red hair ribbons for its strings.
        - id: ch01-b22
          speaker: narrator
          text: At tea, the boys returned with a very poor report of the St. James's Park ducks. Anthea woke the Psammead and showed it the new bag.
        - id: ch01-b23
          speaker: psammead
          text: Hmph. It isn't half bad.
        - id: ch01-b24
          speaker: narrator
          text: It sniffed with contempt and affection at once. For a creature that had known megatheriums and pterodactyls, it picked up modern expressions remarkably fast.
        - id: ch01-b25
          speaker: psammead
          text: This is more worthy of me than a bag given away with a pound of plaice. When are you taking me out in it?
        - id: ch01-b26
          speaker: cyril
          text: I would rather rest from taking any of us anywhere.
        - id: ch01-b27
          speaker: jane
          text: I want to visit Egypt. I loved the Egyptian Princess who came to marry the King. She told me about the fun they have there, and about the cats. She also said the bird-shaped marks on the Amulet were Egyptian writing.
        - id: ch01-b28
          speaker: narrator
          text: The others exchanged delighted looks without saying a word. They were pleased with themselves for hiding the worst part of the Babylon adventure from Jane. She still knew nothing of the dungeon beneath the Euphrates, the danger they had faced there, or the terror from which they had escaped before returning home.
        - id: ch01-b29
          speaker: jane
          text: Egypt sounds so nice in Doctor Brewer's Scripture History. I'd like to be there when Joseph dreamed those strange dreams, or when Moses did wonders with snakes and sticks.
        - id: ch01-b30
          speaker: anthea
          text: I don't care for snakes.
          emotion: fearful
        - id: ch01-b31
          speaker: jane
          text: We needn't visit that part. Babylon was lovely. We had cream and sweet sticky things, and Egypt is probably just the same.
        - id: ch01-b32
          speaker: narrator
          text: They discussed Egypt from every side, but in the end they all accepted Jane's plan. The next morning, directly after a very good breakfast of kippers, they brought out the embroidered bag and formally invited the Psammead into its new traveling carriage. It climbed inside with stiff, furry reluctance, exactly like a cat when you want to hold it and the cat has quite different ideas. At that precise moment, Nurse came into the dining room.
        - id: ch01-b33
          speaker: nurse
          text: Well, chickies, are you feeling very bored?
        - id: ch01-b34
          speaker: anthea
          text: Not at all, dear Nurse. We're having a wonderful time. We're just going to see some very old relics.
        - id: ch01-b35
          speaker: nurse
          text: The Royal Academy, I suppose. Just don't spend your money too recklessly.
        - id: ch01-b36
          speaker: narrator
          text: Nurse cleared away the kipper bones and all the breakfast tea things. She swept every crumb from the table and carried off the cloth. Only when the room was theirs again did the children bring out the Amulet. They held it up and announced their destination with the grand confidence a duchess, or anyone else with a carriage, might use when giving orders to a coachman.
        - id: ch01-b37
          speaker: anthea
          text: Egypt, please!
        - id: ch01-b38
          speaker: jane
          text: When Moses was there.
        - id: ch01-b39
          speaker: narrator
          text: Cyril spoke the wonderful Name of Power. In the dingy dining room, the Amulet grew into an arch. Beyond it lay a deep blue sky and a running river.
        - id: ch01-b40
          speaker: cyril
          text: No, stop!
        - id: ch01-b41
          speaker: narrator
          text: He pulled down the hand in which Jane held the Amulet.
        - id: ch01-b42
          speaker: cyril
          text: What fools we are. We can't go. We mustn't leave the house for even one minute, because that minute might be the minute.
        - id: ch01-b43
          speaker: jane
          text: Which minute might be what minute?
        - id: ch01-b44
          speaker: cyril
          text: The minute the Queen of Babylon arrives.
        - id: ch01-b45
          speaker: narrator
          text: Then everyone understood. For several days, life crept along in a slow, dusty stream with nothing happening. They could never all go out together. No one knew when the King of Babylon might leave for a lion hunt and set his Queen free to make her eagerly expected surprise visit. So the children took turns, two staying home while two went out.
        - id: ch01-b46
          speaker: narrator
          text: The ones at home would have been far more bored if the learned gentleman had not begun taking an interest in them. His studies had begun drawing him toward the children and their astonishing knowledge. One day, when Anthea was the only one left at home, he called her into his room and showed her a beautiful necklace made of purple and gold beads. To him it was an ancient object to study. To Anthea it looked like something she had seen worn when Babylon was alive.
        - id: ch01-b47
          speaker: anthea
          text: I saw one like that in...
        - id: ch01-b48
          speaker: learned_gentleman
          text: In the British Museum, perhaps?
        - id: ch01-b49
          speaker: anthea
          text: I prefer to call the place where I saw it Babylon.
        - id: ch01-b50
          speaker: learned_gentleman
          text: A charming idea, and perfectly correct. These beads truly did come from Babylon.
        - id: ch01-b51
          speaker: narrator
          text: The other three children were out. The boys had planned to visit the Zoo. Jane had said she surely loved rhinoceroses more than either of them did, so Anthea let her go too. Jane caught the boys before Fitzroy Street became Fitzroy Square.
        - id: ch01-b52
          speaker: anthea
          text: Babylon is terribly interesting. I have the most amazing dreams about it. They aren't exactly dreams, but they're every bit as wonderful.
        - id: ch01-b53
          speaker: learned_gentleman
          text: Sit down and tell me about them.
        - id: ch01-b54
          speaker: narrator
          text: Anthea told him, and answered his many questions as well as she could.
        - id: ch01-b55
          speaker: learned_gentleman
          text: Wonderful! I have heard of thought-transference, but I never imagined I possessed that power. It must be what is happening, though it cannot be good for you. Does your head ache badly?
        - id: ch01-b56
          speaker: narrator
          text: He suddenly laid a cold, thin hand on her forehead.
        - id: ch01-b57
          speaker: anthea
          text: No, thank you. It doesn't ache at all.
        - id: ch01-b58
          speaker: learned_gentleman
          text: I promise I do not do it on purpose. I know a great deal about Babylon, and I must be sending that knowledge into your mind without knowing it. Yet some things you describe never entered my own head, though they sound astonishingly likely.
        - id: ch01-b59
          speaker: anthea
          text: It's all right. I understand, so please don't worry. It really is quite simple.
        - id: ch01-b60
          speaker: narrator
          text: It stopped seeming simple when Anthea heard the others return. Before she could ask about the Zoo, a roar rose outside. Beside it, the cries of wild animals would have sounded like birdsong. A mass of voices came through the open window. People shouted that someone looked like a Guy Fawkes figure, a ballet dancer, or a madwoman. Then the children heard a clear voice they knew.
        - id: ch01-b61
          speaker: queen
          text: Stand back, slaves!
        - id: ch01-b62
          speaker: narrator
          text: The crowd demanded to know what strange foreign language she was speaking. One voice called her a Guy Fawkes figure, though it was nowhere near November. Another insisted she was a ballet dancer, and a third declared she was mad. The children rushed to the door. The road and pavement were packed with people. From the top of the steps, they could plainly see the Babylonian Queen in the middle, her beautiful face shining beneath her bright, starry veil.
        - id: ch01-b63
          speaker: robert
          text: Jiminy, she's here! Make way and let the lady through. She's our friend, and she has come to visit us.
          emotion: surprised
        - id: ch01-b64
          speaker: narrator
          text: Robert ran down the steps. The crowd opened a little, though the marrow seller snorted at the kind of friend who would visit a respectable house. Cyril joined Robert and the Queen, carrying the Psammead's bag.
        - id: ch01-b65
          speaker: cyril
          text: The Psammead is in here. You can make wishes.
        - id: ch01-b66
          speaker: robert
          text: I wish you'd worn something else, if you had to come. But my wishes don't count.
        - id: ch01-b67
          speaker: queen
          text: No. I wish I were dressed... No, I wish all these people were properly dressed. Then they would not behave so foolishly.
        - id: ch01-b68
          speaker: narrator
          text: The Psammead swelled until the bag fitted tightly around it. At once every person in the crowd felt terribly underdressed. The Queen's idea of proper clothing belonged to Babylonian workers three thousand years earlier, and it covered very little.
        - id: ch01-b69
          speaker: marrow_woman
          text: Mercy! Whatever made me come out looking like this?
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: She wheeled her marrow cart away as quickly as she could.
        - id: ch01-b71
          speaker: bootlace_seller
          text: Someone has made a fine Guy Fawkes figure out of you, and you were laughing at hers.
        - id: ch01-b72
          speaker: street_man
          text: You should look at yourself. What happened to your boots, and what are those foolish things on your legs?
        - id: ch01-b73
          speaker: bootlace_seller
          text: I swear I never left home dressed like this. I wasn't quite myself last night, I'll admit, but I wouldn't dress for a circus.
        - id: ch01-b74
          speaker: narrator
          text: Everyone spoke at once, each person astonished by everyone else's clothes and by his own. Their confusion turned to anger, though no one thought of blaming the Queen. Anthea bounded down the steps, pulled her royal visitor toward the house, and shut the door after the others. Outside, one man admitted he could make no sense of anything and announced that he was going home. The first crowd slowly reached the same decision and dispersed. Behind them came another crowd of people who had not been transformed because, in the Queen's opinion, they had not been properly dressed in the first place.
        - id: ch01-b75
          speaker: anthea
          text: The police will be here any moment. Why did you come dressed like that?
        - id: ch01-b76
          speaker: narrator
          text: The Queen leaned against the horsehair sofa.
        - id: ch01-b77
          speaker: queen
          text: How else should a queen dress? You don't seem pleased to see me now that I have come. Perhaps the surprise has confused you, though surprises should be nothing new to you. I shall never forget the way you vanished. It was the finest magic I ever saw. How did you do it?
        - id: ch01-b78
          speaker: robert
          text: That doesn't matter now. You've upset those people, and they may bring the police. We don't want them seizing you and putting you in prison.
        - id: ch01-b79
          speaker: queen
          text: No one puts queens in prison.
        - id: ch01-b80
          speaker: cyril
          text: Don't they? We once cut off a king's head here.
        - id: ch01-b81
          speaker: queen
          text: In this wretched room? How fascinating!
        - id: ch01-b82
          speaker: cyril
          text: Not in this room. In history.
        - id: ch01-b83
          speaker: queen
          text: Oh, history. I thought you had done it yourselves.
        - id: ch01-b84
          speaker: narrator
          text: The girls shuddered. The Queen pleasantly called London hideous and its people horrible and ignorant. Not one of them, she complained, understood a word she said.
        - id: ch01-b85
          speaker: jane
          text: Can you understand them?
        - id: ch01-b86
          speaker: queen
          text: Certainly not. They speak some common northern dialect. I understand all of you perfectly.
        - id: ch01-b87
          speaker: narrator
          text: The children could understand and speak other languages so completely that every language sounded like English to them. That is why they and the Queen could talk together.
        - id: ch01-b88
          speaker: cyril
          text: Now you've seen how horrid London is. Wouldn't you rather go home?
        - id: ch01-b89
          speaker: queen
          text: I have seen almost nothing. I wished myself to your door, and here I was. Now I must visit your King and Queen.
        - id: ch01-b90
          speaker: anthea
          text: People aren't allowed to do that. But we'll show you anything else you would like, anything people may visit.
        - id: ch01-b91
          speaker: cyril
          text: We could take you to the Museum. It has many things from your country, if only we could disguise you.
        - id: ch01-b92
          speaker: anthea
          text: I know! Mother's old theater cloak, and one of her hats from the big box.
        - id: ch01-b93
          speaker: narrator
          text: They found Mother's old theater cloak and searched the large box of hats. The blue silk cloak, trimmed with lace, covered most of the Queen's dazzling royal clothes. The chosen hat fitted very badly and had pink roses all over it. Yet the disguise did not make her blend in as they had hoped. There was something about the cloak, the hat, or perhaps the Queen herself that made her look distinctly less than respectable. Cyril drew Anthea aside and whispered the uncomfortable truth.
        - id: ch01-b94
          speaker: anthea
          text: Never mind. We must get her out before Nurse finishes her nap. She must be on her thirty-ninth wink by now.
        - id: ch01-b95
          speaker: robert
          text: Then hurry. If those people fetch the police, no one will think to search for you inside the Museum.
        - id: ch01-b96
          speaker: narrator
          text: The pink-rose hat and blue cloak drew almost as many stares as the royal costume. The children were deeply relieved to leave the noisy streets for the gray quiet of the Museum.
        - id: ch01-b97
          speaker: museum_attendant
          text: Leave parcels and umbrellas here.
        - id: ch01-b98
          speaker: narrator
          text: They had no umbrellas. Their only parcel was the Psammead's bag, and the Queen had insisted on bringing it.
        - id: ch01-b99
          speaker: psammead
          text: I am not being left here, so do not even consider it.
        - id: ch01-b100
          speaker: anthea
          text: I'll stay outside with you.
        - id: ch01-b101
          speaker: narrator
          text: Anthea sat near the drinking fountain.
        - id: ch01-b102
          speaker: psammead
          text: Move away from that horrible fountain. I might be splashed.
        - id: ch01-b103
          speaker: narrator
          text: Anthea obediently moved to another bench and waited. Then she waited some more. The Psammead sank into an uneasy sleep inside its bag. For a long while she watched the swing door, but every time it opened, it released the wrong person. At last she gave up watching it and grew so drowsy that she was nearly asleep herself. Still Cyril, Robert, Jane, and the Queen did not appear. Then Anthea suddenly realized that they had appeared after all. They were coming toward her, and they were far from alone. A whole crowd of uniformed men followed them, along with several gentlemen, and every face in the party looked angry.
        - id: ch01-b104
          speaker: senior_official
          text: Go now. Take this poor, confused woman home and tell your parents that someone must look after her properly.
        - id: ch01-b105
          speaker: harsh_official
          text: If she refuses to leave, we shall call the police.
        - id: ch01-b106
          speaker: senior_official
          text: We would rather not use force.
        - id: ch01-b107
          speaker: robert
          text: May I speak to my sister first?
        - id: ch01-b108
          speaker: narrator
          text: The senior official nodded. The others stood around the Queen while Robert crossed to Anthea. Her questioning look asked what had happened.
        - id: ch01-b109
          speaker: robert
          text: Everything imaginable. She caused a fearful uproar. She said all the necklaces and earrings in the cases belonged to her and demanded them back. She tried to smash the glass, and she did break one piece. Everyone argued with her, but nothing worked. I only got her out by saying this was where they cut off queens' heads.
        - id: ch01-b110
          speaker: anthea
          text: Oh, Bobs, what an enormous lie!
        - id: ch01-b111
          speaker: robert
          text: You would have told a bigger one to get her out. Besides, I meant mummy queens. They might cut the heads off mummies to study the embalming. Can you persuade her to leave quietly?
        - id: ch01-b112
          speaker: anthea
          text: I'll try. Please come home. The learned gentleman in our house owns a necklace far nicer than anything here. Come and see it.
        - id: ch01-b113
          speaker: narrator
          text: The Queen nodded.
        - id: ch01-b114
          speaker: harsh_official
          text: There, she does understand English.
        - id: ch01-b115
          speaker: anthea
          text: I think I was speaking Babylonian.
        - id: ch01-b116
          speaker: senior_official
          text: My dear child, that is not Babylonian. It is nonsense. Go straight home and tell your parents exactly what happened.
        - id: ch01-b117
          speaker: narrator
          text: Anthea gently led the Queen away by the hand. The others followed while the dark crowd of officials watched from the steps. In the middle of the courtyard, the Queen noticed the Psammead's bag and stopped.
        - id: ch01-b118
          speaker: queen
          text: I wish every Babylonian object in there would come out to me, slowly, so these dogs and slaves may witness the great Queen's magic.
        - id: ch01-b119
          speaker: psammead
          text: You truly are an unbearable woman.
        - id: ch01-b120
          speaker: narrator
          text: Even so, it puffed itself out. A crash followed. The glass doors and their frames shattered. The officials jumped aside as a huge stone bull floated steadily through the doorway. The harsh official moved too slowly and was shoved aside. The bull settled beside the Queen.
        - id: ch01-b121
          speaker: narrator
          text: More stone figures followed the bull, floating steadily through the broken entrance. Great carved slabs came after them, then ancient bricks, helmets, tools, weapons, and fetters. Wine jars sailed out with bowls, bottles, vases, jugs, and saucers. There were seals and long round cylinders shaped a little like rolling pins, covered in marks that resembled the footprints of tiny birds. Necklaces, broad collars, rings, armlets, and earrings streamed after them. There were heaps and heaps and still more heaps, far too many objects for anyone to count, or even to see distinctly as they passed.
        - id: ch01-b122
          speaker: narrator
          text: Every angry gentleman except the senior official sat down abruptly on the steps. He kept his hands in his pockets as though floating stone bulls were ordinary, but sent a man to shut the great iron gates. A journalist leaving the Museum paused beside Robert.
        - id: ch01-b123
          speaker: journalist
          text: Theosophy, I suppose? Is that Mrs. Besant?
        - id: ch01-b124
          speaker: robert
          text: Yes.
        - id: ch01-b125
          speaker: narrator
          text: The journalist slipped through the iron gates just before they closed and raced to Fleet Street with his astonishing news. Within half an hour, his newspaper had printed a new edition. Sellers carried boards with enormous black letters announcing Mrs. Besant and theosophy, followed by an impertinent miracle at the British Museum. A few people who had nothing better to do climbed onto the tops of omnibuses and traveled down to see the wonder for themselves. By the time they arrived, though, the courtyard held nothing unusual at all.
        - id: ch01-b126
          speaker: narrator
          text: The Queen had noticed the closed gates and understood their threat.
        - id: ch01-b127
          speaker: queen
          text: I wish we were back in your house.
        - id: ch01-b128
          speaker: narrator
          text: In an instant, they were there. The Psammead was furious.
        - id: ch01-b129
          speaker: psammead
          text: They will follow you and discover me. Westminster will build a National Cage for me, and I shall be forced into politics. Why couldn't you leave those objects where they belonged?
          emotion: angry
        - id: ch01-b130
          speaker: queen
          text: What a temper you have. I wish every object were back in its proper place. Does that satisfy you?
        - id: ch01-b131
          speaker: narrator
          text: The Psammead swelled, shrank, and answered with great anger.
        - id: ch01-b132
          speaker: psammead
          text: I cannot refuse your wishes, but I can bite, and I will if this continues. Be warned.
          emotion: angry
        - id: ch01-b133
          speaker: anthea
          text: Please don't. This is dreadful for us too. Don't abandon us. Perhaps she'll soon wish herself home.
        - id: ch01-b134
          speaker: psammead
          text: She will do nothing of the kind.
        - id: ch01-b135
          speaker: queen
          text: Take me to see your city.
        - id: ch01-b136
          speaker: narrator
          text: The children looked at one another.
        - id: ch01-b137
          speaker: cyril
          text: With money, we could hire a cab. Inside it, people wouldn't notice her so much. But we have none.
        - id: ch01-b138
          speaker: queen
          text: Sell this.
        - id: ch01-b139
          speaker: narrator
          text: She pulled a ring from her finger.
        - id: ch01-b140
          speaker: cyril
          text: Everyone would think we stole it, and then we'd be sent to prison.
        - id: ch01-b141
          speaker: queen
          text: With you, every road seems to end in prison.
        - id: ch01-b142
          speaker: anthea
          text: The learned gentleman! Will you buy this ring for a pound?
        - id: ch01-b143
          speaker: narrator
          text: The thought of the learned gentleman came to Anthea at once. She snatched up the ring, ran upstairs, and offered to sell it to him for one pound. When she placed it in his hand, his face filled with scholarly joy and amazement. The object looked like a real piece of the ancient world he had spent so long studying, though it had come straight from the living hand of Babylon's Queen.
        - id: ch01-b144
          speaker: anthea
          text: It belongs to me. Someone gave it to me to sell.
        - id: ch01-b145
          speaker: learned_gentleman
          text: I will gladly lend you a pound and keep the ring safe. Who gave it to you?
        - id: ch01-b146
          speaker: anthea
          text: We call her the Queen of Babylon.
        - id: ch01-b147
          speaker: learned_gentleman
          text: Is this a game?
        - id: ch01-b148
          speaker: anthea
          text: It will become a very serious game if I cannot pay for her cabs.
        - id: ch01-b149
          speaker: learned_gentleman
          text: Sometimes I fear I am losing my mind, or perhaps...
        - id: ch01-b150
          speaker: anthea
          text: Or perhaps I am. But neither of us is, and neither is she.
        - id: ch01-b151
          speaker: learned_gentleman
          text: Does she claim that she is truly the Queen of Babylon?
        - id: ch01-b152
          speaker: anthea
          text: Yes.
        - id: ch01-b153
          speaker: learned_gentleman
          text: This thought-transference reaches farther than I dreamed. I must have influenced her unconsciously as well. I never expected my Babylonian studies to bear such terrible fruit. There are more things in heaven and earth...
        - id: ch01-b154
          speaker: anthea
          text: Heaps more. But right now, the pound matters most to me.
        - id: ch01-b155
          speaker: narrator
          text: He ran his fingers through his thin hair.
        - id: ch01-b156
          speaker: learned_gentleman
          text: Thought-transference again! This certainly appears to be a Babylonian ring. Perhaps I have hypnotized myself. As soon as I correct the final proofs of my book, I shall consult a doctor.
        - id: ch01-b157
          speaker: anthea
          text: Yes, please do. And thank you very much.
        - id: ch01-b158
          speaker: narrator
          text: Anthea thanked him, took the golden sovereign, and hurried downstairs to the others. Soon all of them were settled in a four-wheeled cab, and through its window the Queen of Babylon looked upon the wonders of London. Buckingham Palace struck her as uninteresting. She thought Westminster Abbey and the Houses of Parliament scarcely better. The Tower pleased her much more. When they reached the River, the water and the great ships upon it filled her with open wonder and delight.
        - id: ch01-b159
          speaker: queen
          text: You keep your slaves very badly. Look how poor, ragged, and neglected they are.
        - id: ch01-b160
          speaker: narrator
          text: Their cab was rattling along the Mile End Road.
        - id: ch01-b161
          speaker: jane
          text: They aren't slaves. They're working people.
        - id: ch01-b162
          speaker: queen
          text: Of course they work. Slaves always do. I know a slave's face when I see one. Why don't their masters feed and clothe them better? Explain it in three words.
        - id: ch01-b163
          speaker: narrator
          text: No one answered. England's wage system was hard to explain in three words, even for someone who understood it, and the children did not.
        - id: ch01-b164
          speaker: queen
          text: If you aren't careful, your slaves will revolt.
        - id: ch01-b165
          speaker: cyril
          text: They won't. They have votes, so they're safe from revolting. Votes change everything. Father told me.
        - id: ch01-b166
          speaker: queen
          text: What is a vote? Is it a magic charm? What do they do with it?
        - id: ch01-b167
          speaker: cyril
          text: I don't know. A vote is simply a vote. They don't do anything in particular with it.
        - id: ch01-b168
          speaker: queen
          text: I understand. It is a kind of toy. Then I wish every one of these slaves held all they wanted of their favorite food and drink.
        - id: ch01-b169
          speaker: narrator
          text: At once, the hands of poor people in Mile End Road and in every other street where poor people lived filled with food and drink. Bottles and cans appeared everywhere. Some people held joints of roast meat or whole fowls. Others carried red lobsters, huge yellow crabs, fried fish, boiled pork, beefsteak puddings, baked onions, or mutton pies. Most of the younger people found oranges, sweets, and cake in their hands. The sudden abundance changed the entire look of Mile End Road. The street itself seemed brighter, and the people's faces brightened more than anyone could possibly imagine.
        - id: ch01-b170
          speaker: queen
          text: It makes a difference, doesn't it?
        - id: ch01-b171
          speaker: jane
          text: That's the best wish you've made yet.
          emotion: happy
        - id: ch01-b172
          speaker: narrator
          text: Near the Bank, the cabman stopped.
        - id: ch01-b173
          speaker: cabman
          text: I'm not taking you any farther. Out you get. I want my tea.
        - id: ch01-b174
          speaker: narrator
          text: They climbed out unwillingly. Beside the cabman lay a heap of cabbage, pork chops with apple sauce, a duck, a spotted currant pudding, and a large can.
        - id: ch01-b175
          speaker: cabman
          text: Now pay my fare.
        - id: ch01-b176
          speaker: cyril
          text: We will take another cab. Please give me change for a sovereign.
        - id: ch01-b177
          speaker: narrator
          text: The cabman turned out to be a thoroughly dishonest man. He reached down and took Cyril's sovereign as though he meant to count out the proper change. Instead, he gathered the reins, cracked his whip, and drove straight away. The children watched their precious coin disappear with him into the moving stream of cabs, omnibuses, and wagons. He had not returned a single penny. While they stood there, stranded in the street with the Queen of Babylon and no money, a small crowd began gathering around them.
        - id: ch01-b178
          speaker: robert
          text: Come on.
        - id: ch01-b179
          speaker: narrator
          text: Robert set off confidently, but he led them the wrong way. The people around the strangely dressed party multiplied as they went, until the crowd pressed close on every side. They found themselves in a narrow street where many gentlemen stood about on the pavement. All wore ugly black coats, none wore a hat, and they talked to one another at the tops of their voices. This was Throgmorton Street, though the children had not meant to go there.
        - id: ch01-b180
          speaker: queen
          text: Their clothes are ugly. Some would be handsome men if they dressed properly, especially those with the fine curved noses. I wish they wore the clothes of my Babylonian court.
        - id: ch01-b181
          speaker: narrator
          text: The Psammead was already exhausted, almost fainting from so many wishes, but once more it forced itself to swell. In the same instant, every man in Throgmorton Street appeared in full Babylonian court dress. Each face was carefully powdered. Hair and beards were scented, curled, and darkened. Rich embroidery covered their garments. Rings crowded their fingers, armlets circled their arms, and flat collars of gold lay across their shoulders. Each man wore a sword and a headdress that looked impossible to keep on. The loud street fell into one moment of completely stunned silence.
        - id: ch01-b182
          speaker: young_broker
          text: I suppose my eyes are playing tricks, but all of you look remarkably strange.
        - id: ch01-b183
          speaker: broker_friend
          text: Look at yourself! You're wearing a sash, your hair has turned black, and you've grown a beard. We must have been poisoned. You look ridiculous.
        - id: ch01-b184
          speaker: young_broker
          text: Old Levinstein doesn't look too bad. But how did this happen? Is it a conjuring trick?
        - id: ch01-b185
          speaker: levinstein
          text: I believe this is a very bad dream. All along Bishopsgate, I saw ordinary people carrying good food in their hands. Yes, certainly a very bad dream.
        - id: ch01-b186
          speaker: clerk
          text: Then I am dreaming too, sir. I can see these awful sandals on my feet perfectly clearly.
        - id: ch01-b187
          speaker: levinstein
          text: And all that good food wasted. A bad dream, a very bad dream.
        - id: ch01-b188
          speaker: narrator
          text: Members of the Stock Exchange were said to be noisy at the quietest of times. Now each man wanted to express his horror at the costume of ancient Babylon, and each tried to make himself heard above all the others. Their combined roar was far louder than the ordinary clamor of the Street. A man could not hear even his own words unless he shouted them.
        - id: ch01-b189
          speaker: clerk
          text: I only wish we knew who did this.
        - id: ch01-b190
          speaker: narrator
          text: The clerk who had wondered about conjuring stood dangerously close to the children. They heard the word wish and trembled, because the Psammead could not refuse it. The wish took hold at once. Every confused broker suddenly knew exactly who had transformed him. They forgot their arguments with one another, turned together toward the Queen, and pressed around her in a threatening ring.
        - id: ch01-b191
          speakers: [young_broker, broker_friend, clerk]
          ensemble: chorus
          text: Scandalous! Shameful! The law should stop this! Hand her over! Fetch the police!
          emotion: angry
        - id: ch01-b192
          speaker: narrator
          text: The Queen drew back.
        - id: ch01-b193
          speaker: queen
          text: What are they saying? They sound like a thousand lions in cages.
        - id: ch01-b194
          speaker: cyril
          text: They're calling the police. I knew someone would, and I can't blame them.
        - id: ch01-b195
          speaker: queen
          text: I wish my guards were here!
        - id: ch01-b196
          speaker: narrator
          text: The exhausted Psammead was panting and trembling in its embroidered bag. It had already granted wish after wish, but the Queen's command forced one more from it. Armed guards in red and green garments appeared until they choked narrow Throgmorton Street. Brass and iron gear covered their bodies. They bared their weapons, and naked blades flashed on every side of the Queen.
        - id: ch01-b197
          speaker: rosenbaum
          text: I have gone mad. That is the answer. Mad!
          emotion: fearful
        - id: ch01-b198
          speaker: rosenbaum_partner
          text: This is judgment on you, Rosy. I warned you about the Flowerdew business. It is judgment, and somehow I am caught in it too.
        - id: ch01-b199
          speaker: narrator
          text: The members of the Stock Exchange had been eager to seize the Queen only moments before. Now they edged carefully away from the gleaming blades, the armored bodies, and the guards' hard, cruel eastern faces. Yet Throgmorton Street was narrow, and the transformed crowd stood packed together. However urgently the men wished to escape, there was no room for them to get away quickly.
        - id: ch01-b200
          speaker: queen
          text: Kill them! Kill the dogs!
          emotion: angry
        - id: ch01-b201
          speaker: narrator
          text: The guards obeyed.
        - id: ch01-b202
          speaker: levinstein
          text: It is all a dream!
          emotion: fearful
        - id: ch01-b203
          speaker: narrator
          text: He crouched in a doorway behind his clerk.
        - id: ch01-b204
          speaker: clerk
          text: It isn't a dream. Those foreign brutes are killing everyone! Henry Hirsh is down. Prentice has been cut in two. Huth is gone, Lionel Cohen has lost his head, and now Guy Nickalls too. A dream? I wish with all my heart that it were all a dream!
          emotion: fearful
        - id: ch01-b205
          speaker: narrator
          text: And instantly, it was. The entire Stock Exchange rubbed its eyes and returned at once to prices, fractions, close and over, and either side of seven-eighths. The men resumed their endless talk of Trunks, Kaffirs, Steel Common, Contangoes, Backwardations, Double Options, and every other important subject of the Street. Not one of them said a word about what had just happened. Businessmen do not like anyone to know that they have been dreaming during business hours. They especially dislike admitting to wild dreams in which hungry people receive good dinners and the Stock Exchange comes to a bloody end.
        - id: ch01-b206
          speaker: narrator
          text: The dream vanished with the fighting. The children found themselves back in the dining room at Number 300 Fitzroy Street, all of them pale and trembling after what they had seen. The Queen and her guards were gone. The Psammead crawled weakly out of its embroidered traveling bag and collapsed flat upon the table. One exhausted leg stuck straight out behind it, and in that state the ancient sand-fairy looked more like a dead hare than anything else in the world.
        - id: ch01-b207
          speaker: anthea
          text: Thank goodness that is over.
        - id: ch01-b208
          speaker: jane
          text: She won't come back, will she?
          emotion: fearful
        - id: ch01-b209
          speaker: cyril
          text: No. She is thousands of years in the past. But we spent a whole pound on her, and it will take ages of pocket money to repay it.
        - id: ch01-b210
          speaker: robert
          text: Not if everything was a dream. The wish made all of it a dream. Panther, hurry upstairs and ask whether he lent you anything.
        - id: ch01-b211
          speaker: narrator
          text: Anthea knocked and followed the sound into the learned gentleman's room.
        - id: ch01-b212
          speaker: anthea
          text: Excuse me for troubling you, but did you lend me a pound today?
        - id: ch01-b213
          speaker: learned_gentleman
          text: No, I did not. But it is extraordinary that you should ask me. I dozed for a few moments this afternoon, something I almost never do, and I had the clearest dream. You brought me a ring and told me it belonged to the Queen of Babylon. In the dream I lent you a sovereign, and you left one of the Queen's own rings here as security. I can still picture it perfectly. The ring was a truly magnificent specimen.
        - id: ch01-b214
          speaker: narrator
          text: He sighed, then smiled. He was learning to smile quite pleasantly.
        - id: ch01-b215
          speaker: learned_gentleman
          text: I wish it had not been a dream.
        - id: ch01-b216
          speaker: narrator
          text: Anthea was deeply thankful that the Psammead was not there to grant that wish.
