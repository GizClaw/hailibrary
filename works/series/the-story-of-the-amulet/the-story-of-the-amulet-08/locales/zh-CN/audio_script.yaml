  chapters:
    - id: ch01
      title: 第八章　王后在伦敦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            西里尔他们把王后的谈话、宴会，还有各式各样的表演都讲给简听。他们讲得很仔细，只在说到地牢以前收住了口。讲完以后，大家才让简也说说自己遇上的事。
        - id: ch01-b02
          speaker: jane
          text: 你们连护符都没拿到，这一趟可真没意思。
        - id: ch01-b03
          speaker: cyril
          text: >-
            我们已经知道没希望了。护符早在巴比伦以前就丢了。下次去个人人都和气的好地方找。现在该你说了。
        - id: ch01-b04
          speaker: jane
          text: 王后那个脸上光溜溜的侍从，叫什么来着？
        - id: ch01-b05
          speaker: cyril
          text: 里蒂-马尔杜克。
        - id: ch01-b06
          speaker: jane
          text: >-
            对，就是他。赛米德咬了守门卫兵妻子家的小男孩，没过多久，他就来接我了。他带我进了王宫。我还跟从埃及来的小王后一起吃晚饭。她真可爱，年纪也没比你大多少。她讲了好多埃及的事。吃完饭，我们还玩了球。后来巴比伦王后叫我过去。我也喜欢她。她跟赛米德说话的时候，我睡着了，后来你们把我叫醒。就这些。
        - id: ch01-b07
          speaker: narrator
          text: >-
            赛米德原本睡得很熟，这时候也醒了过来。孩子们让它说说后来发生了什么，它讲出的经过跟简说的一模一样。可等这个简短的故事讲完，它立刻想起了一件更要紧、也更叫它生气的事。那件事关系到王后临走前许下的愿望，也关系到孩子们接下来还能不能安心过日子。
        - id: ch01-b08
          speaker: psammead
          text: >-
            你们到底中了什么邪，竟然告诉王后我能实现愿望？有时候我真觉得，你们出生时连最粗浅、勉强算得上脑子的东西都没长出来。
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            孩子们谁也不知道“粗浅”究竟是什么意思。他们互相看看，虽然说不出准确的解释，却都听得出来，这一定是个十分粗鲁、专门用来侮辱人的词。
        - id: ch01-b10
          speaker: cyril
          text: 可我们也没闯出什么祸呀。
          emotion: sad
        - id: ch01-b11
          speaker: psammead
          text: >-
            对，没闯祸！一点也没有！恰恰相反！她不过是许了个愿，想不久以后到你们的国家来。而这个“不久”，随时都可能到！
          emotion: angry
        - id: ch01-b12
          speaker: robert
          text: >-
            那是你的错。你尽可以把“不久”变成明年，或者下个世纪。
        - id: ch01-b13
          speaker: psammead
          text: >-
            你又弄错了。我只能照她心里想的“不久”办，又不是我许愿。她想的是，等国王下次出去猎狮子，她就能有一整天，也许两天，爱做什么就做什么。她可不知道，时间只是思想的一种形式。
        - id: ch01-b14
          speaker: cyril
          text: >-
            那也没办法。她待我们不错，来了以后，我们只能尽量让她开心。吃过饭去圣詹姆斯公园喂鸭子怎么样？经历了巴比伦和那么久以前的事，我真想看看眼前实实在在的东西。赛米德，你去吗？
        - id: ch01-b15
          speaker: psammead
          text: >-
            我那只价值无可估量、用神圣灯心草编的篮子呢？我不能什么都不穿就出门，也绝不会那么做。
        - id: ch01-b16
          speaker: narrator
          text: >-
            大家这才痛心地想起来，当时离开巴比伦太匆忙，他们把那只鲈鱼袋忘得干干净净，根本没带回来。
        - id: ch01-b17
          speaker: robert
          text: >-
            它也没那么珍贵吧。去法灵顿市场买鱼，人家会白送一只袋子。
        - id: ch01-b18
          speaker: psammead
          text: >-
            原来你们看我瞧不起这个恶心的现代世界，就想拿不要钱的旅行车打发我。很好，我要钻进沙里了，别叫醒我。
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: >-
            它当场钻进沙里。你们知道，这就等于上床睡觉。两个男孩去了圣詹姆斯公园，安西娅和简却整个下午都在做针线。
        - id: ch01-b20
          speaker: narrator
          text: >-
            她们各自从最好的绿色利伯蒂绸腰带上剪下半码，又把一条毛巾剪成两半作衬里，然后不停地缝呀缝。她们要给赛米德做一只袋子，每人负责一面。简在自己那一面绣四叶三叶草。她只会绣这个，因为学校里只教过这个。幸好当时剩下的丝线还留着，不过连花样也得由安西娅替她画好。安西娅负责的那一面绣的是字母，用的是锁链针法。每一针都下得很匆忙，却也满含亲昵。
        - id: ch01-b21
          speaker: narrator
          text: >-
            安西娅本来想把“旅行马车”几个字全绣上去，可她把字母做得太大，绣到后来，布上已经没有地方了。最后，老保姆用缝纫机把两片布真正做成袋子，束口的绳子用的是女孩们最好的红发带。
        - id: ch01-b22
          speaker: narrator
          text: >-
            喝茶时，男孩们回来了，把公园里的鸭子说得一无是处。安西娅鼓起勇气叫醒赛米德，把新袋子递给它看。
        - id: ch01-b23
          speaker: psammead
          text: 哼，还不算太差。
        - id: ch01-b24
          speaker: narrator
          text: >-
            它鼻子里带着轻蔑，也带着一点亲热。想想看，它当年跟大地懒和翼龙来往过，如今竟这么快学会了现代人的说法，实在很了不起。
        - id: ch01-b25
          speaker: psammead
          text: >-
            这个才算配得上我，比买一磅鲽鱼白送的袋子强多了。你们什么时候带我出门？
        - id: ch01-b26
          speaker: cyril
          text: 我想先歇一阵，暂时不带你，也不带我们自己去任何地方。
        - id: ch01-b27
          speaker: jane
          text: >-
            我想去埃及。那位嫁到巴比伦的埃及公主真讨人喜欢。她跟我讲了埃及的趣事，还有那里的猫。我们去吧。我也把护符上那些鸟形符号说给她听了，她说那是埃及文字。
        - id: ch01-b28
          speaker: narrator
          text: >-
            其他人互相看了一眼，都暗暗庆幸没有把幼发拉底河下那场惊吓告诉简。
        - id: ch01-b29
          speaker: jane
          text: >-
            而且埃及那么好，《布鲁尔博士圣经史》里都写着呢。我想去约瑟做怪梦的时候，或者摩西用蛇和手杖变奇迹的时候。
        - id: ch01-b30
          speaker: anthea
          text: 我可不喜欢蛇。
          emotion: fearful
        - id: ch01-b31
          speaker: jane
          text: >-
            那就别正好去那一段。巴比伦多好呀，我们吃到了奶油，还有甜甜黏黏的东西。我猜埃及也一样。
        - id: ch01-b32
          speaker: narrator
          text: >-
            他们为了这件事商量了很久，最后才全都同意简的主意。第二天早饭刚吃完，大家都觉得腌鲱鱼的味道很不错，随后便请赛米德坐进新做好的旅行马车。
        - id: ch01-b33
          speaker: narrator
          text: >-
            赛米德浑身僵硬，一脸不情愿地钻进去，就像一只另有主意、偏偏被人抱起来的猫。就在这时，老保姆进来了。
        - id: ch01-b34
          speaker: nurse
          text: 怎么样，小宝贝们，是不是闷坏了？
        - id: ch01-b35
          speaker: anthea
          text: >-
            一点也不，亲爱的保姆。我们玩得很开心，正要出门看几件古老的遗物呢。
        - id: ch01-b36
          speaker: nurse
          text: >-
            哦，大概是去皇家美术学院吧？去可以，可别乱花钱。
        - id: ch01-b37
          speaker: narrator
          text: >-
            老保姆收走鱼骨和茶具，扫净面包屑，又撤下桌布。孩子们这才举起护符，像公爵夫人和别的人吩咐马车夫那样，下达了命令。
        - id: ch01-b38
          speaker: narrator
          text: >-
            西里尔念出那个奇妙的力量之名。
        - id: ch01-b39
          speaker: anthea
          text: 请带我们去埃及！
        - id: ch01-b40
          speaker: jane
          text: 去摩西在那里的时候。
        - id: ch01-b41
          speaker: narrator
          text: >-
            昏暗的菲茨罗伊街餐厅里，护符越变越大，成了一道拱门。门那边是湛蓝的天空，还有一条奔流的河。
        - id: ch01-b42
          speaker: cyril
          text: 不，等等！
          emotion: fearful
        - id: ch01-b43
          speaker: narrator
          text: >-
            西里尔喊出声的同时，一把拉下了简那只高高举着护符的手。门那边的天空和河流还清清楚楚地露在他们眼前。
        - id: ch01-b44
          speaker: cyril
          text: >-
            我们真是一群傻布谷鸟！当然不能去。现在一分钟也不能离开家，万一那一分钟正好到了呢？
        - id: ch01-b45
          speaker: jane
          text: 哪一分钟正好是哪一分钟？
        - id: ch01-b46
          speaker: narrator
          text: >-
            简不耐烦地问着，还想从西里尔手里挣开。
        - id: ch01-b47
          speaker: cyril
          text: 就是巴比伦王后来访的那一分钟。
        - id: ch01-b48
          speaker: narrator
          text: >-
            这一下，大家全明白了。眼前的埃及再诱人，他们也只能暂时关上那道门，继续留在家里等王后。
        - id: ch01-b49
          speaker: narrator
          text: >-
            接下来的几天，日子像一条蒙着尘、流得很慢的小溪，什么也没发生。他们再也不敢一起出门，因为谁也不知道巴比伦国王什么时候会去猎狮子。只要国王一走，王后就有了自由，随时可能突然登门。毫无疑问，她自己正热切盼着这次拜访。
        - id: ch01-b50
          speaker: narrator
          text: >-
            孩子们只好把自己分成两组。每次只能有两个人出门，另外两个人必须留在家里守候。这样不管王后什么时候出现，总有人能接住这场麻烦。幸好学者先生又对他们产生了新的兴趣，留在家里的人才不至于闷得那么厉害。
        - id: ch01-b51
          speaker: narrator
          text: >-
            有一天，他叫安西娅过去，拿出一串紫色和金色珠子做成的漂亮项链。
        - id: ch01-b52
          speaker: anthea
          text: 我在一个地方见过一串一模一样的。
        - id: ch01-b53
          speaker: learned_gentleman
          text: 也许是在大英博物馆？
        - id: ch01-b54
          speaker: anthea
          text: 我喜欢把那个地方叫作巴比伦。
        - id: ch01-b55
          speaker: learned_gentleman
          text: >-
            这个想象很美，而且完全正确。这些珠子确实是从巴比伦来的。
        - id: ch01-b56
          speaker: narrator
          text: >-
            那天，另外三个孩子都出门了。两个男孩本来准备去动物园，简听说以后，可怜巴巴地表示，她敢肯定自己比他们两个都更喜欢犀牛。安西娅叫她尽管跟着去。简当真拔腿跑了出去，在菲茨罗伊街忽然变成菲茨罗伊广场的那一段以前，总算追上了两个男孩。
        - id: ch01-b57
          speaker: anthea
          text: >-
            我觉得巴比伦有意思极了。我总会做些特别有趣的梦。其实也不能全算梦，不过跟梦一样奇妙。
        - id: ch01-b58
          speaker: learned_gentleman
          text: 快坐下，把梦讲给我听。
        - id: ch01-b59
          speaker: narrator
          text: >-
            安西娅依言坐下来，把巴比伦的经历讲给他听。学者先生接连问了许多问题，她知道的都尽力回答，不知道的也没有乱说。等她终于讲完，他越想越觉得不可思议，忍不住惊叹起来。
        - id: ch01-b60
          speaker: learned_gentleman
          text: >-
            太奇妙了！我听说过思想传递，可从没想到自己也有这种力量。一定是这样，而且恐怕这对你很不好。你的头疼得厉害吗？
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: >-
            他忽然把一只冰凉瘦削的手放到她额头上。
        - id: ch01-b62
          speaker: anthea
          text: 不疼，谢谢您，一点也不疼。
        - id: ch01-b63
          speaker: learned_gentleman
          text: >-
            我保证，这绝不是故意的。我很了解巴比伦，想必无意间把那些知识传给了你。你听说过读心术吧？可你讲的有些事，连我也不知道。它们从没进过我的脑子，却合理得惊人。
        - id: ch01-b64
          speaker: anthea
          text: >-
            没关系，我明白。您别担心，这件事其实很简单。
          emotion: calm
        - id: ch01-b65
          speaker: narrator
          text: >-
            可等安西娅听见其他人回来，刚走到楼下，还没问动物园好不好玩，事情就一点也不简单了。屋外忽然爆出一阵喧闹，衬得野兽叫声都像鸟儿唱歌。
        - id: ch01-b66
          speaker: anthea
          text: 我的天，那是什么声音？
          emotion: surprised
        - id: ch01-b67
          speaker: crowd_man
          text: 这里有个化装怪人！
        - id: ch01-b68
          speaker: crowd_woman
          text: 现在又不是十一月。她才不是化装怪人，明明是个芭蕾舞娘。
        - id: ch01-b69
          speaker: lace_seller
          text: 胡说，我告诉你，她是个疯婆娘。
        - id: ch01-b70
          speaker: queen
          text: 退下，奴隶们！
          emotion: angry
        - id: ch01-b71
          speakers: [crowd_man, crowd_woman, lace_seller]
          ensemble: chorus
          text: 她叽里咕噜说什么呢？
        - id: ch01-b72
          speaker: crowd_man
          text: 谁知道，反正是该死的外国话。
        - id: ch01-b73
          speaker: narrator
          text: >-
            孩子们一齐冲到门口。马路上挤满了人，人行道上也挤得水泄不通。可是从台阶顶上望去，还是一眼就能看见人群中央巴比伦王后那张美丽的脸，还有她头上颜色鲜亮的面纱。
        - id: ch01-b74
          speaker: robert
          text: 老天，她真来了！
          emotion: surprised
        - id: ch01-b75
          speaker: narrator
          text: 罗伯特奔下台阶，对人群大喊。
        - id: ch01-b76
          speaker: robert
          text: >-
            喂，当心！让这位女士过去。她是我们的朋友，是来看我们的。
        - id: ch01-b77
          speaker: crowd_woman
          text: 体面人家交的朋友可真不错。
        - id: ch01-b78
          speaker: narrator
          text: >-
            说话的是个胖女人，推车上堆着西葫芦。人群到底让开了一点。王后在人行道上迎住罗伯特，西里尔也赶来了，胳膊上还挎着赛米德的袋子。
        - id: ch01-b79
          speaker: cyril
          text: 赛米德在这里，你可以许愿。
        - id: ch01-b80
          speaker: robert
          text: >-
            你非来不可的话，真该换身衣服再来。可惜我许愿没用。
        - id: ch01-b81
          speaker: queen
          text: >-
            对，我希望自己穿着……不，我不希望。我希望他们都穿得规规矩矩，别再那么傻。
        - id: ch01-b82
          speaker: narrator
          text: >-
            赛米德把身子鼓起来，袋子顿时绷得紧紧的。转眼间，人群里的每个男人、女人和孩子都觉得自己衣不蔽体。王后眼中的规矩衣着，是三千年前巴比伦劳动百姓的穿法，那些衣服可没用多少布。
        - id: ch01-b83
          speaker: crowd_woman
          text: 我的老天！我怎么穿成这样就出来了？
          emotion: surprised
        - id: ch01-b84
          speaker: narrator
          text: 她推着车飞快逃走了。
        - id: ch01-b85
          speaker: lace_seller
          text: 刚才还说别人化装呢，瞧瞧你这身打扮，多漂亮呀！
        - id: ch01-b86
          speaker: crowd_man
          text: 你省省吧，先看看自己那双傻腿。你的靴子呢？
        - id: ch01-b87
          speaker: lace_seller
          text: >-
            我敢发誓，出门时绝不是这样。昨晚我是有点不清醒，可也没把自己打扮成马戏团的人。
        - id: ch01-b88
          speaker: narrator
          text: >-
            人群七嘴八舌，越吵越气，却没有一个人想到该怪王后。安西娅跳下台阶，把她拉进屋，其他孩子也跟着进来，门在身后砰的一声关上。他们听见外面有人嚷着，说怎么也弄不明白，自己要回家了。人群渐渐都有了同样的念头，终于散去。那些人各自匆匆赶回家，想把身上的怪衣服换掉。后面还跟来另一群人，他们刚刚来到这里，衣着在王后眼中一样不规矩，却完全不知道先前发生过什么。
        - id: ch01-b89
          speaker: anthea
          text: 警察马上就会来。你为什么穿成这样就来了？
          emotion: fearful
        - id: ch01-b90
          speaker: queen
          text: 王后不这么穿，还能怎么穿？
        - id: ch01-b91
          speaker: cyril
          text: 我们的王后穿得跟别人差不多。
        - id: ch01-b92
          speaker: queen
          text: >-
            可我不一样。再说，我都来了，你们看起来却一点也不高兴。也许是我来得太突然，可你们早该习惯意外了。你们消失的时候，真是我见过最精彩的魔法。到底怎么办到的？
          emotion: sad
        - id: ch01-b93
          speaker: robert
          text: >-
            先别管那个。你把外面的人全惹火了，他们准会去叫警察。我们可不想让你被抓走，关进监狱。
        - id: ch01-b94
          speaker: queen
          text: 没人能把王后关进监狱。
        - id: ch01-b95
          speaker: cyril
          text: 是吗？我们这里从前还砍过国王的头呢。
        - id: ch01-b96
          speaker: queen
          text: 就在这间破屋子里？那倒有意思。
        - id: ch01-b97
          speaker: cyril
          text: 不，不是在屋里，是在历史里。
        - id: ch01-b98
          speaker: queen
          text: 哦，在那个里面。我还以为是你们亲手砍的。
        - id: ch01-b99
          speaker: narrator
          text: 女孩们听得打了个寒战，王后却愉快地说了下去。
        - id: ch01-b100
          speaker: queen
          text: >-
            你们的城市真难看，人也讨厌，又无知。他们居然一个字也听不懂我说的话。
        - id: ch01-b101
          speaker: jane
          text: 那你听得懂他们吗？
        - id: ch01-b102
          speaker: queen
          text: >-
            当然听不懂。他们说的是粗俗的北方土话。可你们说的话，我全听得懂。
        - id: ch01-b103
          speaker: narrator
          text: >-
            至于孩子们为什么能听懂别的语言，也能开口说，而且听起来就像自己的话，我实在不打算再解释一遍。
        - id: ch01-b104
          speaker: cyril
          text: 既然你已经看见这里多讨厌，不如回家去吧？
        - id: ch01-b105
          speaker: queen
          text: >-
            可我还什么都没看呢。我许愿到你们门前，就真的到了。现在我要去见你们的国王和王后。
        - id: ch01-b106
          speaker: anthea
          text: >-
            谁也不能去见他们。不过我们可以带你看任何允许参观的东西。
        - id: ch01-b107
          speaker: narrator
          text: >-
            安西娅提出这个办法时很体贴。她还记得王后在巴比伦怎样亲切地招待他们，哪怕王后在简和赛米德那件事情上，确实稍稍耍过一点花招。
        - id: ch01-b108
          speaker: cyril
          text: >-
            可以去博物馆，那里有好多你们国家的东西。只要先稍微乔装一下。
        - id: ch01-b109
          speaker: anthea
          text: 我有办法。用妈妈的旧戏院斗篷，再从大箱子里找顶旧帽子。
        - id: ch01-b110
          speaker: narrator
          text: >-
            妈妈那件镶着花边的蓝绸戏院斗篷，的确遮住了王后身上几处耀眼得吓人的装饰。可是从大箱子里找出的旧帽子非常不合头，帽子上偏偏还插着粉红玫瑰。也不知问题出在斗篷、帽子，还是王后本人身上，反正她看起来总有那么一点不大体面。
        - id: ch01-b111
          speaker: anthea
          text: >-
            别管了。要紧的是趁保姆还没睡完四十个盹，把她带出去。我猜她已经打到第三十九个了。
        - id: ch01-b112
          speaker: robert
          text: >-
            那就快走。那些被你变成化装怪人的人要是真去找警察，警察也想不到去博物馆找你。
        - id: ch01-b113
          speaker: narrator
          text: >-
            蓝斗篷和粉红玫瑰帽招来的目光，几乎不比王后的华服少。孩子们穿过喧闹的街道，走进博物馆灰暗的安静里，这才松了一大口气。
        - id: ch01-b114
          speaker: museum_attendant
          text: 包裹和雨伞请寄存在这里。
        - id: ch01-b115
          speaker: narrator
          text: >-
            他们没有雨伞，唯一的包裹就是装赛米德的袋子，王后却坚持带它进去。
        - id: ch01-b116
          speaker: psammead
          text: 我才不留在这里。你们想都别想。
        - id: ch01-b117
          speaker: anthea
          text: 那我陪你在外面等。
        - id: ch01-b118
          speaker: narrator
          text: 安西娅在饮水处旁边的长凳上坐下。
        - id: ch01-b119
          speaker: psammead
          text: 别挨那讨厌的喷水池太近，水会溅到我身上。
        - id: ch01-b120
          speaker: narrator
          text: >-
            安西娅听话地挪到另一张长凳。她等啊，等啊，又等了很久。赛米德在袋子里睡着了，却睡得一点也不安稳。旋转门一次次转动，每次放出来的人都不是她要等的那些。到后来，安西娅早已不再盯着门，自己也快睡着了，可其他人还是没有回来。
        - id: ch01-b121
          speaker: narrator
          text: >-
            她忽然发现他们已经出来，吓得猛一激灵。他们身后跟着一大群穿制服的人，还有几位先生，个个都气坏了。
        - id: ch01-b122
          speaker: kind_gentleman
          text: >-
            现在走吧。把这个可怜的疯女人带回家，告诉你们的父母，应该好好看管她。
        - id: ch01-b123
          speaker: cross_gentleman
          text: 你们要是叫不走她，我们只能找警察。
        - id: ch01-b124
          speaker: kind_gentleman
          text: 不过我们不愿意来硬的。
        - id: ch01-b125
          speaker: narrator
          text: >-
            这位先生确实十分和气，看起来还是所有人的上司。
        - id: ch01-b126
          speaker: robert
          text: 我能先跟妹妹说句话吗？
        - id: ch01-b127
          speaker: narrator
          text: >-
            和气的先生点点头。博物馆的工作人员紧紧围着王后，其他人又在外面围成一道卫队似的圈子。罗伯特好不容易穿过两层人群，来到安西娅身边。安西娅没有出声，只用眼神问他，里面究竟出了什么事。
        - id: ch01-b128
          speaker: robert
          text: >-
            你能想到的事，她全干了。她在里面闹得天翻地覆，说玻璃柜里的项链、耳环，还有所有东西都是她的，非让人拿出来。她还想砸玻璃，真砸坏了一块！全馆的人都来劝，也没用。我只好告诉她，这里就是砍王后脑袋的地方，才把她哄出来。
        - id: ch01-b129
          speaker: anthea
          text: 哦，鲍勃，你这个谎撒得真大！
        - id: ch01-b130
          speaker: robert
          text: >-
            换成你，为了弄她出来，只会撒得更大。再说也不全是假话。我说的是木乃伊王后。谁知道他们会不会砍下木乃伊的脑袋，看看怎么做防腐？我只想问，你能不能让她乖乖走？
        - id: ch01-b131
          speaker: anthea
          text: 我试试。
        - id: ch01-b132
          speaker: anthea
          text: >-
            跟我们回家吧。住在我们家的学者先生有一串项链，比这里所有的都漂亮。来看看吧。
        - id: ch01-b133
          speaker: narrator
          text: 王后点了点头。
        - id: ch01-b134
          speaker: cross_gentleman
          text: 你们看，她明明听得懂英语。
        - id: ch01-b135
          speaker: anthea
          text: 我刚才说的好像是巴比伦语。
        - id: ch01-b136
          speaker: kind_gentleman
          text: >-
            好孩子，那不是巴比伦语，是胡言乱语。马上回家，把这件事原原本本告诉父母。
        - id: ch01-b137
          speaker: narrator
          text: >-
            安西娅牵住王后的手，轻轻把她带走。其他孩子跟在后面，那群黑压压、气冲冲的先生全站在台阶上，看着他们离开。这个已经丢尽脸面的小队伍，带着那个叫他们丢脸的王后，一直走到庭院中央。就在这时，王后看见了装着赛米德的袋子，猛地停住脚。
        - id: ch01-b138
          speaker: queen
          text: >-
            我希望所有巴比伦的东西都到这里来找我。要慢慢地来，好让那些狗和奴隶看看，伟大王后的魔法怎样施展。
        - id: ch01-b139
          speaker: psammead
          text: 哦，你这个女人真讨厌。
          emotion: angry
        - id: ch01-b140
          speaker: narrator
          text: >-
            赛米德嘴上抱怨，身子却还是鼓了起来。下一刻，轰的一声，玻璃旋转门连门框一起粉碎了。先生们纷纷跳开，最讨厌的那位慢了一步，被一头巨大的石牛粗暴地挤到旁边。石牛稳稳飘进庭院，停在王后身边。
        - id: ch01-b141
          speaker: narrator
          text: >-
            石牛后面还不断飘出更多东西。先是石像和巨大的石雕板，接着是砖块、头盔、工具、武器和镣铐。酒坛、碗、瓶子、花瓶、壶和碟子也成群结队地飞了出来，后面还有印章，以及一些又圆又长、形状很像擀面杖的东西，上面刻着鸟脚般的印痕。它们全从粉碎的门口稳稳飘过，来到王后身边。项链、颈圈、戒指、臂环和耳环更是一堆接一堆，仿佛永远也飞不完。东西多得谁也数不清，甚至连一件件看清都来不及。
        - id: ch01-b142
          speaker: narrator
          text: >-
            除了和气的先生，其他生气的先生都一屁股坐在博物馆台阶上。只有他仍双手插在口袋里站着，仿佛早就习惯看石牛和巴比伦小物件飘进庭院。不过，他还是叫人关上了铁门。
        - id: ch01-b143
          speaker: reporter
          text: 我猜这是神智学吧？她是贝赞特夫人吗？
        - id: ch01-b144
          speaker: robert
          text: 是。
        - id: ch01-b145
          speaker: narrator
          text: >-
            罗伯特已经顾不得那么多，随口就说是。记者听到答案，赶在铁门关闭前冲出去，一路直奔舰队街。还不到半小时，他的报纸就出了新版。报贩高高举起告示牌，上面的粗大黑字人人都看得见，写的是贝赞特夫人与神智学，还有大英博物馆上演无礼奇迹。街上的人议论纷纷，几个闲得无事的人立刻爬上公共马车顶层，催着车赶往博物馆，生怕错过这桩怪事。可等他们到达，庭院里已经什么也看不见了。
        - id: ch01-b146
          speaker: narrator
          text: 王后看见紧闭的大门，觉出了威胁。
        - id: ch01-b147
          speaker: queen
          text: 我希望我们回到你们家。
        - id: ch01-b148
          speaker: narrator
          text: 于是，他们立刻回了家。赛米德气得大发雷霆。
        - id: ch01-b149
          speaker: psammead
          text: >-
            他们会追来，还会找到我！到时候威斯敏斯特要给我造一座国家笼子，我还得参与政治。你们为什么不让那些东西留在原处？
          emotion: angry
        - id: ch01-b150
          speaker: queen
          text: >-
            你的脾气可真大。我希望所有东西都回到原来的位置。现在满意了吗？
          emotion: calm
        - id: ch01-b151
          speaker: narrator
          text: 赛米德一鼓一缩，气冲冲地开口。
        - id: ch01-b152
          speaker: psammead
          text: >-
            我不能拒绝你的愿望，可我能咬人。再这么下去，我真会咬。你等着吧。
          emotion: angry
        - id: ch01-b153
          speaker: anthea
          text: >-
            啊，别这样。我们也难受极了，你可不能再丢下我们。也许她很快就会许愿回家。
          emotion: sad
        - id: ch01-b154
          speaker: psammead
          text: 她才不会。
        - id: ch01-b155
          speaker: queen
          text: 带我看看你们的城市。
        - id: ch01-b156
          speaker: narrator
          text: 孩子们面面相觑。
        - id: ch01-b157
          speaker: cyril
          text: >-
            要是有钱，就能坐出租马车带她逛，别人也不会太留意她。可我们没有钱。
        - id: ch01-b158
          speaker: queen
          text: 卖掉这个。
        - id: ch01-b159
          speaker: narrator
          text: 王后从手指上摘下一枚戒指。
        - id: ch01-b160
          speaker: cyril
          text: >-
            人家只会以为戒指是我们偷的，然后把我们关进监狱。
        - id: ch01-b161
          speaker: queen
          text: 你们这里好像条条大路都通向监狱。
        - id: ch01-b162
          speaker: anthea
          text: 学者先生！
        - id: ch01-b163
          speaker: narrator
          text: 安西娅抓起戒指，跑上楼去找他。
        - id: ch01-b164
          speaker: anthea
          text: 您看看，肯花一英镑买下它吗？
        - id: ch01-b165
          speaker: learned_gentleman
          text: 哦！
          emotion: surprised
        - id: ch01-b166
          speaker: narrator
          text: 他又惊喜又诧异，把戒指接到手里。
        - id: ch01-b167
          speaker: anthea
          text: >-
            它完完全全属于我。有人把它送给我，让我卖掉。
        - id: ch01-b168
          speaker: learned_gentleman
          text: >-
            我很愿意借你一英镑，戒指先替你保管。你刚才说，是谁给你的？
        - id: ch01-b169
          speaker: anthea
          text: 我们叫她巴比伦王后。
        - id: ch01-b170
          speaker: learned_gentleman
          text: 这是个游戏吗？
        - id: ch01-b171
          speaker: anthea
          text: >-
            要是拿不到钱，不能替她付马车费，那才会变成一场好游戏。
        - id: ch01-b172
          speaker: learned_gentleman
          text: 有时候我觉得，不是我要疯了，就是……
        - id: ch01-b173
          speaker: anthea
          text: >-
            就是我疯了。可我没疯，您没疯，她也没疯。
        - id: ch01-b174
          speaker: learned_gentleman
          text: 她真的说自己是巴比伦王后？
          emotion: fearful
        - id: ch01-b175
          speaker: anthea
          text: 是的。
        - id: ch01-b176
          speaker: learned_gentleman
          text: >-
            思想传递的影响比我以为的还远。看来我无意中也影响了她。没想到研究巴比伦会结出这种果实，太可怕了！天地之间还有更多……
        - id: ch01-b177
          speaker: anthea
          text: 是，多得很。可我在天地之间最想要的，就是那一英镑。
        - id: ch01-b178
          speaker: narrator
          text: >-
            学者先生看看戒指，又看看安西娅，仿佛两样东西都在逼他相信不可能的事。最后，他只好抬起手，用手指慢慢梳过自己稀薄的头发。
        - id: ch01-b179
          speaker: learned_gentleman
          text: >-
            这种思想传递！毫无疑问，这在我看来是一枚巴比伦戒指。可也许是我催眠了自己。等校完最后一批清样，我马上去看医生。
        - id: ch01-b180
          speaker: anthea
          text: 好，您一定要去！实在太谢谢了。
        - id: ch01-b181
          speaker: narrator
          text: >-
            安西娅拿着那枚一英镑金币，飞快跑下楼去找其他人。没过多久，巴比伦王后便坐进一辆四轮出租马车，从车窗里观赏伦敦的种种奇景。她觉得白金汉宫没什么意思，威斯敏斯特教堂和国会大厦也好不了多少。伦敦塔倒很合她的心意，等看到河流和来来往往的船只，她更是又惊奇又欢喜。
        - id: ch01-b182
          speaker: queen
          text: >-
            你们把奴隶照管得真糟。他们看起来又悲惨又贫穷，根本没人管。
        - id: ch01-b183
          speaker: narrator
          text: 马车正哐啷哐啷驶过迈尔恩德路。
        - id: ch01-b184
          speaker: jane
          text: 他们不是奴隶，是劳动者。
        - id: ch01-b185
          speaker: queen
          text: >-
            劳动的当然就是奴隶。别来教我，难道我连奴隶的脸都认不出？他们的主人为什么不给他们吃好些、穿好些？用三个字回答。
        - id: ch01-b186
          speaker: narrator
          text: >-
            没人回答。现代英国的工资制度，就算真懂，也很难用三个字说清，何况孩子们根本不懂。
        - id: ch01-b187
          speaker: queen
          text: 再不小心，奴隶们会起来造反。
        - id: ch01-b188
          speaker: cyril
          text: >-
            不会的。他们有选票。有选票就不会造反，这可大不一样。爸爸说过。
        - id: ch01-b189
          speaker: queen
          text: 选票是什么？是符咒吗？他们拿它做什么？
        - id: ch01-b190
          speaker: cyril
          text: >-
            我不知道。选票就是选票！他们也不用它特别做什么。
        - id: ch01-b191
          speaker: queen
          text: >-
            我懂了，是一种玩物。那么，我希望现在所有奴隶手里都有最爱吃的肉和最爱喝的饮料，想要多少就有多少。
        - id: ch01-b192
          speaker: narrator
          text: >-
            一眨眼，迈尔恩德路和所有穷人居住的街道上，每个人手里都装满了吃喝。从马车窗口望出去，只见人们捧着烤肉和鸡禽，鲜红的龙虾和硕大焦黄的螃蟹到处都是。还有炸鱼、煮猪肉、牛排布丁、烤洋葱和羊肉馅饼。年轻人手里多半是橙子、糖果和蛋糕。人们还提着各种瓶瓶罐罐，里面装着自己最爱喝的东西。迈尔恩德路一下变了模样，仿佛忽然亮堂起来，大家的脸更是亮得远远超出你的想象。
        - id: ch01-b193
          speaker: queen
          text: 现在是不是大不一样？
        - id: ch01-b194
          speaker: jane
          text: 这是你到现在许过最好的愿望。
          emotion: happy
        - id: ch01-b195
          speaker: narrator
          text: >-
            到了银行附近，马车夫忽然停车。他看着凭空出现在座位上的食物，已经完全没有心思继续赶路。那里不只有卷心菜，还有猪排、苹果酱、一只鸭子和葡萄干斑点布丁，旁边更摆着一只大罐子。
        - id: ch01-b196
          speaker: cabman
          text: 我不拉你们了，全都下车。
        - id: ch01-b197
          speaker: cabman
          text: 我要吃茶点。把车钱给我。
        - id: ch01-b198
          speaker: narrator
          text: >-
            他的座位上堆着卷心菜、猪排、苹果酱、一只鸭子、一个葡萄干斑点布丁，旁边还有一大罐饮料。他低头看着食物，嘴里仍嘟囔着要吃。
        - id: ch01-b199
          speaker: cyril
          text: 我们另叫一辆车。劳驾，把这一英镑找开。
        - id: ch01-b200
          speaker: narrator
          text: >-
            可事实证明，这个车夫的人品一点也不好。他一把拿走金币，根本没有找零钱。接着扬起鞭子催马，转眼便消失在出租马车、公共马车和货车汇成的车流里，连一个子儿也没给他们。孩子们站在路边，又生气又无可奈何。还没等他们回过神，周围已经聚起一小群看热闹的人。罗伯特只得领着大家离开，可惜他选的方向完全错了。
        - id: ch01-b201
          speaker: narrator
          text: >-
            围观的人越来越多，孩子们想甩也甩不掉。他们一路来到一条狭窄的街道。那里有许多先生，全都穿着黑外套，也没有戴帽子。他们挤在人行道上，用很大的声音彼此交谈。这地方就是斯罗格莫顿街，街本来就窄，现在又被人群挤得几乎没有空隙。
        - id: ch01-b202
          speaker: queen
          text: >-
            他们穿得真难看。有几个本来相当英俊，尤其是那些长着漂亮弯鼻子的。要是穿得体面些就好了。我希望他们都穿成我宫廷里的巴比伦人。
        - id: ch01-b203
          speaker: narrator
          text: >-
            愿望当然又成真了。几乎快要昏倒的赛米德勉强鼓起身子，斯罗格莫顿街上的每个男人立刻换上全套巴比伦盛装。每个人都仔细扑过粉，头发和胡须喷着香水，还烫成卷曲的样子。他们的衣袍上满是华美刺绣，手指戴着戒指，手臂套着臂环，颈上围着平展的金项圈，腰间佩着宝剑，头顶还有不可思议的冠帽。刚才还高声交谈的人全都说不出话来。一阵惊呆了的寂静，忽然降临在整个人群中。
        - id: ch01-b204
          speaker: young_broker
          text: >-
            我说，这当然只是幻觉。我的眼睛一定出了毛病，可你们看起来真古怪。
        - id: ch01-b205
          speaker: broker_friend
          text: >-
            我们古怪？看看你自己！你居然系着腰带，头发也黑了，还长出胡子。咱们准是中毒了。你活像个小丑。
        - id: ch01-b206
          speaker: young_broker
          text: >-
            老莱文斯坦看着倒不坏。可这到底是怎么弄的？是戏法吗？
        - id: ch01-b207
          speaker: levenson
          text: >-
            我看这是一场灰常糟糕的梦。从主教门一路过来，我看见平民手里全是好吃的。对，毫无疑问，是场灰常糟糕的梦！
        - id: ch01-b208
          speaker: clerk
          text: >-
            那我也在做梦，先生。我低头就能看清，自己脚上穿着难看的凉鞋。
          emotion: disgusted
        - id: ch01-b209
          speaker: levenson
          text: 那么多好食物全糟蹋了。糟糕的梦，糟糕的梦。
        - id: ch01-b210
          speaker: narrator
          text: >-
            证券交易所的人平时已经够吵了，现在他们为了表示多么厌恶古巴比伦衣服，叫得比往常更响。不扯着嗓子，谁也听不见自己说话。
        - id: ch01-b211
          speaker: clerk
          text: 我只希望我们知道是谁干的。
        - id: ch01-b212
          speaker: narrator
          text: >-
            他正站在孩子们附近。孩子们听见这话全都发抖，因为无论他许什么愿，都会成真。果然，所有人立刻知道了答案，一齐朝王后围过来。
        - id: ch01-b213
          speakers: [young_broker, broker_friend, clerk]
          ensemble: chorus
          text: >-
            岂有此理！太可耻了！法律应该禁止这种事。把她交给警察，快去叫警察！
          emotion: angry
        - id: ch01-b214
          speaker: narrator
          text: 王后往后缩了缩。
        - id: ch01-b215
          speaker: queen
          text: >-
            怎么回事？他们听着像笼子里的狮子，成千上万头狮子。他们在喊什么？
          emotion: fearful
        - id: ch01-b216
          speaker: cyril
          text: >-
            他们在喊警察。我早知道迟早会这样。说真的，我也不能怪他们。
        - id: ch01-b217
          speaker: queen
          text: 我希望我的卫兵全都在这里！
          emotion: fearful
        - id: ch01-b218
          speaker: narrator
          text: >-
            赛米德已经筋疲力尽，喘个不停，浑身都在发抖，可它还是实现了这个愿望。王后的卫兵凭空出现，顿时塞满了狭窄的斯罗格莫顿街。他们穿着红绿衣袍，身上披挂着黄铜和铁制的甲胄。王后周围全是拔出鞘的兵刃，冷冷地闪着寒光。
        - id: ch01-b219
          speaker: rosenbaum
          text: 我疯了，就是这么回事。我疯了！
          emotion: fearful
        - id: ch01-b220
          speaker: partner
          text: >-
            这是上天在罚你，罗西。我早说过，你处理弗劳尔迪尤那件事太狠。现在报应来了，连我也被拖下水。
        - id: ch01-b221
          speaker: narrator
          text: >-
            交易所的人开始小心翼翼地后退。他们想避开闪亮的刀刃、披甲的身影，还有卫兵们冷酷凶狠的东方面孔。可是斯罗格莫顿街实在太窄，人群又挤得太密，他们根本不能像自己希望的那样迅速逃走。
        - id: ch01-b222
          speaker: queen
          text: 杀了他们！杀掉这些狗！
          emotion: angry
        - id: ch01-b223
          speaker: narrator
          text: 卫兵立刻服从了命令。
        - id: ch01-b224
          speaker: levenson
          text: 这全是一场梦！
          emotion: fearful
        - id: ch01-b225
          speaker: narrator
          text: 莱文斯坦先生缩进门洞，躲在自己的职员身后。
        - id: ch01-b226
          speaker: clerk
          text: >-
            不是梦，不是！我的老天，那些外国畜生正在杀人。亨利·赫什倒下了，普伦蒂斯被砍成两半。还有胡特，莱昂内尔·科恩的脑袋也掉了，现在盖伊·尼科尔斯也没了头。一场梦？但愿这一切真是一场梦！
          emotion: fearful
        - id: ch01-b227
          speaker: narrator
          text: >-
            于是，这一切当然立刻成了一场梦。整个证券交易所的人都揉揉眼睛，重新谈起收市价、溢价、七分之八上下、特伦克矿业股、南非矿业股、钢铁普通股、延期交割、逆价差和双重期权，还有他们每天待在这条街上，永远谈不完的那些有趣话题。
        - id: ch01-b228
          speaker: narrator
          text: >-
            没有一个人对别人提起半个字。他们各自装作一切都没发生，仿佛刚才不过走了一会儿神。你知道，商人不喜欢让人发现自己在办公时间做了梦。尤其不能让人知道，那是一场疯狂的梦，里面竟有穷人得到饭吃、证券交易所惨遭毁灭之类可怕的事情。这样的梦若说出去，实在太不像一位正经商人了。
        - id: ch01-b229
          speaker: narrator
          text: >-
            那个愿望把街上的灾难变成了梦，也把孩子们送回菲茨罗伊街三百号的餐厅。他们一个个脸色苍白，直到这时还在浑身发抖。刚才的刀剑、卫兵和倒下的人虽然已经成了梦，留在心里的恐惧却没有立刻消失。赛米德费力地爬出绣花旅行袋，四肢全摊开，软绵绵地趴在桌上。其中一条腿直直伸着不动，看起来最像一只死去的兔子。
        - id: ch01-b230
          speaker: anthea
          text: 谢天谢地，总算结束了。
        - id: ch01-b231
          speaker: jane
          text: 她不会再回来了吧？
          emotion: fearful
        - id: ch01-b232
          speaker: cyril
          text: >-
            不会，她在几千年前呢。可我们为她花了一英镑，得用以后很长很长时间的零用钱来还。
        - id: ch01-b233
          speaker: robert
          text: >-
            要是一切都成了梦，就不用还。那个愿望说的是“一切”，你知道的。潘瑟，你去问问学者先生，他有没有借钱给你。
        - id: ch01-b234
          speaker: narrator
          text: 安西娅敲敲门，听见回应才走到学者先生面前。
        - id: ch01-b235
          speaker: anthea
          text: 对不起，打扰您了。您今天借给我一英镑了吗？
        - id: ch01-b236
          speaker: learned_gentleman
          text: >-
            没有。不过你会这么问，真奇怪。今天下午我难得打了个瞌睡，清清楚楚梦见你拿来一枚戒指，说它属于巴比伦王后。我借给你一英镑，你把王后的戒指留给我。那可是一件极好的珍品。
        - id: ch01-b237
          speaker: narrator
          text: 他叹了口气。
        - id: ch01-b238
          speaker: learned_gentleman
          text: 真希望那不是梦。
        - id: ch01-b239
          speaker: narrator
          text: >-
            他说完便微笑起来。他的笑容当真越来越自然了。安西娅却万分庆幸，赛米德这会儿不在房间里，听不见这句话，也没法替学者先生实现这个愿望。
