cover_prompt: |-
  A wordless cover scene in an Edwardian London room shows four children opening a great magical arch formed by a deep red ancient amulet. A sturdy dark-haired boy in a Norfolk jacket, a practical girl with brown braids and a cream dress, a round-faced boy in suspenders, and a smaller girl in a blue pinafore stand beside a small furry sand creature with a tubby body, snail-like eyes on stalks, broad bat-like ears, and monkey-like hands and feet. Through the arch appears ancient Babylon under brilliant sun, with high city walls, date palms, and richly colored distant buildings, while the children lean forward at the threshold in shared wonder. Make the expanding amulet arch and the contrasting passage from the quiet London room into the ancient city the clear focal action. Use a wide child-height view with the figures low in the foreground, layered depth through the portal, and generous calm room at the top. Keep the magic original, child-friendly, and non-frightening, with historically grounded early-1900s clothing and no designs drawn from any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
