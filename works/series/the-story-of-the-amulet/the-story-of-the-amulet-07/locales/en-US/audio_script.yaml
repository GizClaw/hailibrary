  chapters:
    - id: ch01
      title: THE DEEPEST DUNGEON BELOW THE CASTLE MOAT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Queen tossed three embroidered cushions, red and gold, from her throne onto the marble steps. She told the children to make themselves comfortable. She was dying to hear about their wonderful country, how they had reached Babylon, and everything else. But every morning she had to sit there and do justice first.
        - id: ch01-b02
          speaker: queen
          text: Sit down and make yourselves comfortable. Do you have to do justice in your country too? What a bore it is. I would much rather have a private audience myself. It would be so much easier to manage. But one has to think of public opinion. Doing justice is terribly hard work, even when you have been trained for it.
        - id: ch01-b03
          speaker: cyril
          text: No, not like this. Of course we try to be just, but we do it privately, not in front of everyone.
        - id: ch01-b04
          speaker: anthea
          text: Jane and I have to practice scales for twenty minutes every day. That is horrid too.
        - id: ch01-b05
          speaker: queen
          text: What are scales? And who is Jane?
        - id: ch01-b06
          speaker: anthea
          text: Jane is our little sister. One of the gate guards' wives is looking after her. Scales are music. They aren't an instrument, exactly. And yes, we can sing in parts.
        - id: ch01-b07
          speaker: queen
          text: I have never heard of that instrument. But singing in parts must be magic. How many pieces do they cut each of you into before you do it?
        - id: ch01-b08
          speaker: robert
          text: Nobody cuts us into anything! We couldn't sing if they did. We'll show you afterward.
        - id: ch01-b09
          speaker: narrator
          text: The Queen promised they could sing afterward. For now, she told them to sit quietly like dear children and listen while she did justice. She said people had always admired her way of doing it, then stopped and wondered aloud if that sounded conceited. She decided she did not mind saying it to these children. Somehow, she felt she had known them for a long time already. Then she settled herself on the throne and gave a signal to her attendants. The children whispered together among the cushions on the steps. They decided that the Queen was very beautiful and very kind, though perhaps just the least little bit flighty.
        - id: ch01-b10
          speaker: narrator
          text: The first person asking for justice was a woman. She said her brother had taken the money their father left to her. The brother denied it and claimed that their uncle had the money. There was a great deal of talking on every side. The children listened at first, but soon they began to grow rather bored. Then the Queen suddenly clapped her hands. Her decision was simple. Both men would go to prison, and there they would stay until one of them admitted that the other was innocent.
        - id: ch01-b11
          speaker: cyril
          text: But suppose they both took it? And what if neither of them did?
        - id: ch01-b12
          speaker: queen
          text: If they both took it, prison is the best place for them. And neither is impossible. Something can't be done unless somebody does it. You mustn't interrupt again.
        - id: ch01-b13
          speaker: narrator
          text: Next came a weeping woman with a torn veil. There were real ashes on her head, Anthea thought, though they may only have been road dust. Her husband had been put in prison. People said he had spoken evil of the Queen, but the woman insisted that an enemy with a grudge had accused him falsely.
        - id: ch01-b14
          speaker: queen
          text: How can you know he never spoke against me?
        - id: ch01-b15
          speaker: petitioner
          text: No one could speak against Your Majesty after seeing your beautiful face.
        - id: ch01-b16
          speaker: queen
          text: Release him. Next case.
        - id: ch01-b17
          speaker: narrator
          text: Then came the case of a boy accused of stealing a fox. Robert whispered that it was like the Spartan boy. The Queen set this boy free. She could see no possible reason why anyone would own a fox, and even less reason why anyone would steal one. Besides, she did not believe there were any foxes in Babylon. She, at any rate, had never seen one. More people came with every kind of family quarrel and misunderstanding between neighbors. Brothers had fought over how to divide an inheritance. A woman had behaved dishonestly and unkindly after borrowing a cooking pot at the last New Year festival and failing to return it. Whatever the trouble, the Queen decided it very, very firmly indeed. At last she clapped her hands, suddenly and extremely loudly, and announced that the day's audience was over. Everyone cried that the Queen should live forever. Then they all went out, leaving the children in the hall with the Queen of Babylon and her ladies.
        - id: ch01-b18
          speaker: queen
          text: There, that's over! I couldn't do another stitch of justice, not even for the crown of Egypt. Come into the garden. Now we can have a nice, long, cozy talk.
        - id: ch01-b19
          speaker: narrator
          text: She led them through long, narrow corridors. The children could somehow feel that the walls were enormously thick. At last they entered a garden courtyard, where closely planted shrubs and roses trained over trellises made welcome shade. The sun was already as hot as an August day by the English seaside. Slaves spread cushions on a low marble terrace. Then a large, smooth-faced man brought cold drinks in gold cups studded with beryls. Before handing the Queen her cup, he took a sip from it himself.
        - id: ch01-b20
          speaker: robert
          text: That's a rather nasty trick. He might at least rinse the cup first.
        - id: ch01-b21
          speaker: queen
          text: Not at all. Ritti-Marduk is a very clean man. And someone has to taste my drink first, you know, in case of poison.
        - id: ch01-b22
          speaker: narrator
          text: The word poison made the children feel creepy. Still, Ritti-Marduk had carefully tasted every one of their cups, so they felt fairly safe. The drink was icy and delicious. It tasted partly like lemonade and partly like a penny ice. The Queen told her court ladies to leave. Their beautiful, many-colored dresses had folds, fringes, and more folds, and they filed out slowly. Then the Queen asked the children to tell her all about themselves.
        - id: ch01-b23
          speaker: cyril
          text: Robert should tell it.
        - id: ch01-b24
          speaker: robert
          text: No, Anthea should.
        - id: ch01-b25
          speaker: anthea
          text: Cyril should. The Queen of India loved the story you told her.
        - id: ch01-b26
          speaker: narrator
          text: Cyril muttered that it was all very well for them to choose him. When he had told the Queen of India about the Phoenix and the Carpet, every word had been true, and he could tell the whole truth. This time he had to leave out the Amulet. He also had to hide the awkward fact that they lived in London about twenty-five hundred years after this conversation. So he took refuge in the story of the Psammead and its wonderful power to make wishes come true. The children had never been able to tell anyone that secret before. Cyril was surprised that the spell which silenced them in London did not work here in the Past.
        - id: ch01-b27
          speaker: queen
          text: This is most interesting! We must have the Psammead at the banquet tonight. Its performance will be one of the most popular parts of the whole program. Where is it now?
        - id: ch01-b28
          speaker: narrator
          text: Anthea explained that Jane and the Psammead had gone home with the wife of one of the gate guards. The trouble was that none of them knew which guard she belonged to.
        - id: ch01-b29
          speaker: queen
          text: Oh, that is quite simple. Ritti-Marduk can run down to the gates and find out which guard took your sister home.
        - id: ch01-b30
          speaker: anthea
          text: Might he go now? I mean, would it interfere with his mealtimes or anything if he went at once?
        - id: ch01-b31
          speaker: queen
          text: Of course he shall go now. He may consider himself lucky if he gets his meals at any time at all.
        - id: ch01-b32
          speaker: narrator
          text: Cyril asked if he might send a letter. The Queen offered to call her scribe, but Cyril thanked her and said he could do the scribbling himself. He pulled out his red-backed penny account book and searched every pocket for the stump of pencil he knew was there. When he found it, the point was so blunt that he licked it and even bit away a little wood. The Queen called him a clever, clever boy and begged to watch him work. The account book had rough, woolly paper ruled for figures, with tiny hairs that would have caught on a pen. On one of its pages, Cyril wrote a warning. Jane must hide the Amulet very carefully before she came, never mention it, and destroy the note. Everything was going splendidly, the Queen was a fair treat, and there was nothing to fear.
        - id: ch01-b33
          speaker: cyril
          text: I wrote that you're fair and rather like a festival. I told Jane not to be afraid and to come at once.
        - id: ch01-b34
          speaker: ritti_marduk
          text: O Queen, live forever! Is this writing a charm? Is it a strong charm, most great lady?
        - id: ch01-b35
          speaker: robert
          text: It is a charm, and a terribly strong one. But it can't hurt anyone before Jane gets it. She'll tear it up at once, and that will end the magic. It's as strong as... as peppermint!
        - id: ch01-b36
          speaker: narrator
          text: Ritti-Marduk bowed timidly. He had never heard of the god Peppermint. Robert had to explain once more that Jane would tear up the charm the instant she received it, so there was no danger if he went at once. Then Ritti-Marduk left, though he still looked only partly satisfied. The Queen began admiring the account book and pencil in such an obvious and meaningful way that Cyril could hardly do anything except offer them to her as a gift. She ruffled the wonderful pages in delight. She asked whether that little stick was the style Cyril used to make charms, and begged him to make one for her. Then her voice sank to a whisper. Did he know the names of the great ones in his own far country? Cyril certainly did. He quickly wrote Alfred the Great, Shakespeare, Nelson, Gordon, Lord Beaconsfield, Mr. Rudyard Kipling, and Mr. Sherlock Holmes. The Queen watched him with breath held, then took the book and hid it reverently among the bright folds of her gown.
        - id: ch01-b37
          speaker: queen
          text: Later you must teach me how to say all those great names. You must teach me the names of their ministers too. Is the great Nisroch one of them?
        - id: ch01-b38
          speaker: cyril
          text: I don't think so. Mr. Campbell-Bannerman is Prime Minister, and Mr. Burns is a minister. I think the Archbishop of Canterbury may be one too, though I'm not sure. Doctor Parker was one, I know, and there are more...
        - id: ch01-b39
          speaker: queen
          text: No more! All those great names make my head spin. You can teach them to me later, during the nice long visit you'll make now that you've come. But you have been clever enough for the moment. I'm sure you would rather hear me tell you something.
        - id: ch01-b40
          speaker: anthea
          text: Yes. I want to know why the King has gone to bring home his fourteenth wife. I don't think even Bluebeard had that many. Besides, the King hasn't killed you, at any rate.
        - id: ch01-b41
          speaker: queen
          text: You must call him the King-may-he-live-forever.
        - id: ch01-b42
          speaker: robert
          text: She means English kings only have one wife. Henry the Eighth had seven or eight, but he didn't have them all at once.
        - id: ch01-b43
          speaker: queen
          text: In our country, a king with only one wife would not reign for a single day. No one would respect him, and quite right too. The other thirteen are alive, of course, the poor, mean-spirited things. I don't associate with them. I am the Queen. They are only the wives.
        - id: ch01-b44
          speaker: narrator
          text: Then the Queen told them what a fuss there had been over the newest wife. The King had wives from most important nations and wanted an Egyptian princess to complete his collection. Babylon began by sending the Egyptian king a handsome gift of gold. He returned only a few horses, because he was terribly stingy, and said what Egypt really needed was lapis lazuli. So Babylon sent that too. By then he had begun covering the roof beams of the Sun-God's temple with Babylonian gold, but he did not have enough to finish. More gold went out. Gifts and messages traveled back and forth for years, because every journey took at least six months. At last Babylon asked for the hand of his daughter.
        - id: ch01-b45
          speaker: queen
          text: And after he'd taken everything he could get from us, while sending the meanest gifts in return, he finally answered. He said he would value the honor of an alliance very highly, but unfortunately he had no daughter! He hoped one might be born soon, and if she was, he would certainly save her for our King!
        - id: ch01-b46
          speaker: cyril
          text: What a trick!
        - id: ch01-b47
          speaker: queen
          text: Wasn't it? So we said his sister would do. That meant more gifts and more journeys, and now at last the tiresome, black-haired thing is coming. The King has traveled seven days to meet her at Carchemish. He even took his best chariot, the one inlaid with lapis lazuli and gold, with gold-plated wheels and hubs set with onyx. It is far too great an honor. There will be a grand banquet tonight for her arrival, though she won't attend. She'll be having her baths and anointings. We always clean foreign brides very carefully, and that takes two or three weeks. Now it is dinnertime, and you shall eat with me. I can see that you are people of high rank.
        - id: ch01-b48
          speaker: narrator
          text: The Queen led them into a cool, dark hall. They sat on floor cushions while servants brought low tables of smooth blue stone mounted in gold. Golden trays appeared, but there were no knives, forks, or spoons. The children expected the Queen to ask for some. Instead, she simply began eating with her fingers. The first dish was boiled corn mixed with meat and raisins, with melted fat poured over the whole tray. Following her example while keeping anything like the table manners they knew at home was extremely difficult. After that came stewed quinces, dates swimming in syrup, and thick yellow cream. It was certainly not the sort of dinner they ever had in Fitzroy Street. When the meal was over, everyone went to sleep, even the children.
        - id: ch01-b49
          speaker: queen
          text: Good gracious, what a long time we've slept! I must rush away and dress for the banquet. I shall hardly have enough time.
        - id: ch01-b50
          speaker: anthea
          text: Hasn't Ritti-Marduk come back yet with our sister and the Psammead?
        - id: ch01-b51
          speaker: queen
          text: I quite forgot to ask. I'm sorry. No one would announce her unless I gave the order, except during justice hours. I expect she's waiting outside. I'll find out.
        - id: ch01-b52
          speaker: ritti_marduk
          text: I regret that I could not find your sister. The beast she carries in a basket bit the guard's child, and your sister and the beast set out to come here. The police say they have a clue. No doubt we shall have news of her in a few weeks.
        - id: ch01-b53
          speaker: narrator
          text: The children were horrified. They had lost Jane, the Psammead, and the Amulet all at once. While the Queen dressed for the banquet, they talked over every gloomy possibility. No one found anything hopeful to say. Instead, they repeated the same fears several times, went around the whole miserable subject again, and finally each child blamed the other two for ever letting Jane go.
        - id: ch01-b54
          speaker: cyril
          text: After all, Jane is with the Psammead, so she'll be all right. And the Psammead takes very good care of itself. It isn't as though we were in danger. Let's cheer up and try to enjoy the banquet.
        - id: ch01-b55
          speaker: narrator
          text: And they really did enjoy it. First they had a beautiful bath, which was delicious. Afterward, attendants oiled them heavily from head to foot, even rubbing oil into their hair, and that was extremely unpleasant. They dressed again and were presented to the King, who was as friendly as anyone could wish. The banquet went on for a long time. There were all sorts of good things to eat, and everyone seemed to eat and drink a great deal. The guests lay on cushions and couches. The ladies were on one side of the room and the gentlemen on the other. Once the eating ended, each lady went to sit beside some gentleman who seemed to be her husband or sweetheart, for the pairs were very affectionate. Their court clothes were woven with threads of gold that glittered brightly. The middle of the great room was left clear, and one performer after another came there to amuse the court. There were conjurers, jugglers, and snake charmers. Anthea did not like the snake charmers at all. When darkness fell, servants lit the torches. Oily cedar splinters blazed in copper dishes set high on poles.
        - id: ch01-b56
          speaker: narrator
          text: Then a dancer appeared. She wore hardly any clothes and was not at all pretty. She hardly danced either, but stood in one pose after another. The children found her rather boring. Everyone else was delighted, especially the King.
        - id: ch01-b57
          speaker: king
          text: By the beard of Nimrod! Ask for anything you like, girl, and you shall have it!
        - id: ch01-b58
          speaker: dancer
          text: I want nothing. The honor of pleasing the King-may-he-live-forever is reward enough for me.
        - id: ch01-b59
          speaker: narrator
          text: The King was so pleased with this modest and sensible answer that he took the gold collar from his own neck and gave it to her.
        - id: ch01-b60
          speaker: cyril
          text: I say, just look at that magnificent gift!
        - id: ch01-b61
          speaker: queen
          text: It's all right. That isn't one of his best collars. We always keep plenty of cheap jewelry ready for occasions like this. Now, you promised to sing for us. Would you like my minstrels to accompany you?
        - id: ch01-b62
          speaker: anthea
          text: No, thank you. What shall we sing? Perhaps we could do Sweet and Low.
        - id: ch01-b63
          speaker: narrator
          text: The Babylonian minstrels had been playing from time to time throughout the feast. Their music reminded Anthea of the band the children had once made for the fifth of November, using penny horns, a tin whistle, a tea tray, the fire tongs, a policeman's rattle, and a toy drum. They had enjoyed making that music enormously. Hearing someone else make the same kind of noise was quite different. At last Anthea understood that Father had not been heartless or unreasonable when he ordered them to stop that maddening din.
        - id: ch01-b64
          speaker: cyril
          text: That is too soft. I vote for Who Will O'er the Downs. Now then, one, two, three.
        - id: ch01-b65
          speakers: [cyril, anthea, robert]
          ensemble: chorus
          text: Oh, who will ride across the downs and follow me to win a blooming bride? Her father locked the door, her mother kept the key, but neither lock nor bar shall keep my own true love from me.
        - id: ch01-b66
          speaker: narrator
          text: Jane, who sang alto, was missing. Robert could never keep in key, whatever the lady's mother did in the song. Their performance was not perfect. Still, it sounded so unlike anything the Babylonian court had ever heard that everyone went wild with delight.
        - id: ch01-b67
          speaker: king
          text: More, more! By my beard, this savage music is a wonderfully new thing. Sing it again!
        - id: ch01-b68
          speakers: [cyril, anthea, robert]
          ensemble: chorus
          text: At twilight her bower was guarded, but by daybreak it was guarded no more. The servants slept, and no one saw the greeting between my love and me.
        - id: ch01-b69
          speaker: narrator
          text: Shouts of applause greeted the second verse. The King would not be satisfied until the children had sung all three part-songs they knew twice over. They finished with Men of Harlech, all singing the same tune. Then the King rose in his royal robes, his high narrow crown upon his head.
        - id: ch01-b70
          speaker: king
          text: By Nisroch's beak, strangers from the land where the sun never sets, ask whatever you wish!
        - id: ch01-b71
          speaker: anthea
          text: We ought to say the honor itself is enough, just as the dancer did. That would be better manners.
        - id: ch01-b72
          speaker: robert
          text: No, let's ask for It. Give us the half of the Amulet that bears the name Ur Hekau Setcheh, O King-may-he-live-forever.
        - id: ch01-b73
          speaker: narrator
          text: Robert had grown excited by the music, the flaring torches, the applause, and the chance to ask. Before the others could stop him, he spoke the great name. Everyone in the pillared hall fell facedown and lay still. Only the Queen remained crouching among her cushions with her head in her hands. The King stood perfectly rigid, like the stone statue of a king. It lasted only a moment. Then his great voice thundered through the hall.
        - id: ch01-b74
          speaker: king
          text: Guards, seize them! These impious, sacrilegious wretches go to the dungeons! Tomorrow we will find a way to make them speak. They must know where the lost half of It is hidden!
          emotion: angry
        - id: ch01-b75
          speaker: narrator
          text: Eight soldiers seemed to spring from nowhere. They wore bright armor inlaid with gold and tunics of red and white. They were splendid to look at and terrifying to meet. A wall of scarlet, white, steel, and gold closed tightly around the children and hurried them between the hall's many pillars. Behind them, the courtiers' voices rose loudly in horror. The children could not see where the guards were taking them because the soldiers pressed so close on every side. They could only feel the road changing beneath their feet. Smooth marble gave way to rough stone. Then the ground became loose earth and sand, and they felt the open night air around them. After that came hard stone once more, followed by steps that led down and down.
        - id: ch01-b76
          speaker: cyril
          text: You've really done it this time. I believe we are going to the deepest dungeon below the castle moat now.
        - id: ch01-b77
          speaker: anthea
          text: Oh, it will come right. It must. It always does.
        - id: ch01-b78
          speaker: narrator
          text: The dungeon was not beneath a castle moat. It lay beneath the River Euphrates, which was just as bad, if not worse. It was a most unpleasant place, dark and horribly damp, with an odd musty smell like oyster shells. The only torch was really a copper basket fixed to a tall stick, with pieces of oiled wood burning inside it. In that weak light, the children saw green walls streaked with trickling water. Cold drops fell steadily from the roof. Creatures that looked like newts lay on the floor, and creepy, shiny things moved slowly, uneasily, and horribly in the dark corners. Robert's heart sank right down into his dependable boots. Cyril and Anthea each had a private struggle with the disagreeable part that lives inside everyone, the part that wanted to blame him. Both children won their struggle. Neither told Robert that this was his doing, and they tried hard not even to think it. Anthea had the extra temptation to say that she had warned him. She resisted that too.
        - id: ch01-b79
          speaker: captain
          text: Sacrilege and impudent cheek. Keep them here at the King's pleasure. I expect he'll get plenty of pleasure out of them tomorrow when he makes them talk. He'll tickle them up!
        - id: ch01-b80
          speaker: gaoler
          text: Poor little children. They're only kids.
        - id: ch01-b81
          speaker: captain
          text: Oh yes, I have children of my own too. But you can't let family feelings interfere with public duty. Good night.
        - id: ch01-b82
          speaker: narrator
          text: The soldiers marched heavily away, red and white and steel and gold disappearing up the passage. The gaoler stayed behind with a bunch of large keys. He looked at the children with pity, shook his head twice, and went out.
        - id: ch01-b83
          speaker: anthea
          text: Courage! I know it will be all right. This is only a dream, really. It must be. I don't believe that time is only some sort of thing in our thoughts. It is a dream, and we're bound to wake up safe.
        - id: ch01-b84
          speaker: robert
          text: It was all my fault. If this really is the end, please don't go on blaming me for it. And tell Father... Oh. I forgot.
          emotion: sad
        - id: ch01-b85
          speaker: narrator
          text: What Robert had forgotten was that Father was three thousand miles away, and more than five thousand years away as well.
        - id: ch01-b86
          speaker: cyril
          text: It is all right, Bobs, old man.
          emotion: calm
        - id: ch01-b87
          speaker: narrator
          text: Anthea took Robert's hand and squeezed it. Then the gaoler returned. He carried a platter of hard, flat cakes made from coarse grain, nothing like the palace feast of cream and juicy dates. He also brought a pitcher of water.
        - id: ch01-b88
          speaker: anthea
          text: Oh, thank you so very much. You are kind. Dear Mr. Gaoler, what are they going to do to us tomorrow?
          emotion: fearful
        - id: ch01-b89
          speaker: gaoler
          text: They'll try to make you tell them things. If you have nothing to tell, my advice is to make something up. Then perhaps they'll sell you to the Northern nations. Those people are real savages. Now go to sleep on that straw. Tomorrow will come soon enough.
        - id: ch01-b90
          speakers: [cyril, anthea, robert]
          ensemble: chorus
          text: Good night.
          emotion: fearful
        - id: ch01-b91
          speaker: narrator
          text: The three trembling voices tried and failed to sound steady as they wished him good night. Then the gaoler went out, and the children were left alone in the damp, dim vault. Cyril stared at the flickering fire and said he knew it would not last much longer. Anthea wondered aloud whether there was any use in calling on the great name when they did not have the charm. Cyril did not think it would work, but he agreed that they might as well try. So the children called. The damp dungeon answered them with blank, heavy silence. The wet green walls remained, the darkness remained, and nothing at all changed.
        - id: ch01-b92
          speaker: cyril
          text: What was the name the Queen used? Nisbeth, Nesbit, something like that. You know, the servant of the great names.
        - id: ch01-b93
          speaker: robert
          text: Wait a moment. I don't know why you want it. Nusroch... Nisrock... Nisroch! That's it.
        - id: ch01-b94
          speaker: anthea
          text: Ur Hekau Setcheh! Oh, Nisroch, servant of the Great Ones, come and help us!
        - id: ch01-b95
          speaker: narrator
          text: Anthea pulled herself together before she called. Every muscle in her body tightened, and it seemed as though the muscles of her mind and soul tightened too. After her cry, there was a long, waiting silence. Then a cold blue light woke in the corner where the straw lay. Inside that light, the children saw a strange and terrible figure coming toward them. It looked exactly like the figures the ancient Babylonians carved upon their stones, carvings that can still be seen in the British Museum. There was no mistaking its shape. It had the broad wings of an eagle, an eagle's head, and the body of a man. Slowly it came nearer, immensely strong and unspeakably horrible.
        - id: ch01-b96
          speaker: anthea
          text: Oh, please go away! Please don't come any closer!
          emotion: fearful
        - id: ch01-b97
          speaker: cyril
          text: No, don't go. Stay here!
        - id: ch01-b98
          speaker: narrator
          text: The creature hesitated and bowed on the wet floor.
        - id: ch01-b99
          speaker: nisroch
          text: Speak. The servant of the Great Ones is your servant. What do you need, that you call upon the name of Nisroch?
        - id: ch01-b100
          speaker: robert
          text: We want you to take us home.
        - id: ch01-b101
          speaker: anthea
          text: No, no. We want to go wherever Jane is.
        - id: ch01-b102
          speaker: narrator
          text: Nisroch raised one great arm and pointed at the dungeon wall. As it pointed, the damp green rock disappeared completely. In its place shone and glowed a splendid room. Rich red silk covered the walls, embroidered all over with golden water lilies. There were soft, cushioned couches and great mirrors made of brightly polished steel. The Queen sat inside that glowing room. Before her, on a red cushion, was the Psammead. Its fur was hunched up in the irritated, discontented way the children knew so well. Nearby, Jane lay fast asleep on a couch covered in blue.
        - id: ch01-b103
          speaker: nisroch
          text: Walk forward without fear. Is there anything else the servant of the great Name can do for those who speak that name?
        - id: ch01-b104
          speaker: cyril
          text: No, oh no. Everything is all right now. Thank you very much.
        - id: ch01-b105
          speaker: anthea
          text: You are a dear. Oh, thank you, thank you. But please go away now!
        - id: ch01-b106
          speaker: narrator
          text: Anthea caught the creature's hand without really knowing what she was doing. It felt cold and hard in hers, like a hand made of stone. Nisroch told them once more to go forward, and the children stepped through into the Queen's room.
        - id: ch01-b107
          speaker: queen
          text: Oh, my good gracious, how did you get here? I knew you were magical! I meant to let you out first thing in the morning, if I could slip away. Thank Dagon you managed it yourselves. You must escape now. I'll wake my chief lady, and she can call Ritti-Marduk to let you out by the back way.
        - id: ch01-b108
          speaker: anthea
          text: Please don't wake anyone. Not anyone except Jane, and I'll wake her myself.
        - id: ch01-b109
          speaker: queen
          text: Ritti-Marduk brought them here hours ago, really. I only wanted to have the Psammead to myself for a little while. You'll excuse that small, natural deception, won't you? It's part of the Babylonian character. But I don't want anything to happen to you. Please let me wake someone.
        - id: ch01-b110
          speaker: anthea
          text: No, no, no. We can leave by our own magic. But you must tell the King it wasn't the gaoler's fault. Nisroch did it.
        - id: ch01-b111
          speaker: queen
          text: Nisroch! Then you truly are magicians after all.
          emotion: surprised
        - id: ch01-b112
          speaker: narrator
          text: Anthea shook Jane energetically, and Jane slowly woke. She sat up and blinked stupidly. Cyril snatched up the Psammead. It bit him automatically, though only very slightly.
        - id: ch01-b113
          speaker: cyril
          text: Hold It up, Jane, and say the word!
        - id: ch01-b114
          speaker: jane
          text: Which way is east?
        - id: ch01-b115
          speaker: queen
          text: The East is behind me. Why do you ask?
        - id: ch01-b116
          speaker: jane
          text: Ur Hekau Setcheh.
        - id: ch01-b117
          speaker: narrator
          text: Jane was still only half awake, but she held the charm up toward the East and spoke the words. The Queen's silk-hung room vanished in an instant. All four children and the Psammead found themselves safely back in the familiar dining room at 300 Fitzroy Street.
        - id: ch01-b118
          speaker: cyril
          text: Jane, please bring down the Psammead's plate of sand.
        - id: ch01-b119
          speaker: narrator
          text: Jane obediently went upstairs. As the sound of her boots grew fainter on the stairs, Cyril used the moment to warn the others. They must not tell Jane about the dungeon or any of the other horrors. It would only frighten her, and then she might never want to travel anywhere else through the Amulet.
        - id: ch01-b120
          speaker: cyril
          text: Righto. We won't tell her anything about it.
        - id: ch01-b121
          speaker: narrator
          text: Anthea was too shaken to speak. She felt that she could not have said a word to save her life. Then Jane returned with the plate of sand.
        - id: ch01-b122
          speaker: jane
          text: Why did you want to come back in such a hurry? Babylon was awfully jolly. I liked it ever so much!
        - id: ch01-b123
          speaker: cyril
          text: Oh yes, it was jolly enough, of course. But I thought we'd been there long enough. Mother always says you oughtn't to wear out your welcome.
