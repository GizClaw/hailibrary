  chapters:
    - id: ch01
      title: THE PAST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The learned gentleman had forgotten his dinner until it was quite cold. His mutton chop sat on its plate like a brown island in a frozen white pond, for the fat in the gravy had cooled and turned white. It looked thoroughly nasty. That was the first thing the children noticed when they knocked three times, heard no answer, and finally dared to turn the handle and open his door very softly.
        - id: ch01-b02
          speaker: narrator
          text: The chop stood at one end of a long table that stretched down one side of the room. Images, oddly shaped stones, and books covered the rest. Glass cases were fixed to the wall behind it, rather like the cases in a jeweler's shop, and each held its own small, strange object.
        - id: ch01-b03
          speaker: narrator
          text: At another table by the window, the poor learned gentleman was studying something very small between a pair of fine pincers. A round magnifying glass filled one eye. It reminded the children first of a watchmaker and then of the Psammead's long eyes, which stuck out like a snail's.
        - id: ch01-b04
          speaker: narrator
          text: He was very long and thin, and his long thin boots stuck out from beneath the far side of the table. He never heard the door. The children stood there, not quite knowing what to do, until Robert pushed it wider. Then they all jumped back. Hidden in the middle of the wall behind the door was an enormous mummy case, painted red, yellow, green, and black. Its face seemed to glare at them angrily.
        - id: ch01-b05
          speaker: narrator
          text: You know what a mummy case looks like, of course. If you do not, the British Museum will show you. But it is not something you expect to meet in a top-floor front room in Bloomsbury, looking as if it wants to know exactly what business you have there. The children all cried out quite loudly, and their boots clattered as they stumbled backward.
        - id: ch01-b06
          speaker: learned_gentleman
          text: I beg your pardon.
        - id: ch01-b07
          speaker: narrator
          text: The gentleman removed the glass from his eye. His voice was soft, quiet, and pleasant.
        - id: ch01-b08
          speaker: cyril
          text: No, we must beg yours. We're sorry we disturbed you.
        - id: ch01-b09
          speaker: learned_gentleman
          text: Please come in. I'm delighted to see you. Won't you sit down? Not on that chair just yet. Let me move the papyrus.
        - id: ch01-b10
          speaker: narrator
          text: He rose with such fine courtesy that Anthea was impressed. Then he cleared a chair and smiled kindly at them through his large round spectacles.
        - id: ch01-b11
          speaker: robert
          text: He talks to us as if we're grown up, and I don't think he knows how many of us there are.
        - id: ch01-b12
          speaker: anthea
          text: Hush. Whispering is rude. Cyril, you tell him. Go on.
        - id: ch01-b13
          speaker: cyril
          text: We really are sorry. We knocked three times, but you didn't say to come in, or go away, or come back when you weren't busy. You didn't say anything people usually say when someone knocks. So we opened the door. We knew you were here because we heard you sneeze.
        - id: ch01-b14
          speaker: learned_gentleman
          text: Not at all. Please, sit down.
        - id: ch01-b15
          speaker: narrator
          text: The gentleman carefully moved things from three more chairs and set them on the floor. One chair held bricklike pieces. They looked as though tiny birds had walked across the clay while it was soft, except that the little marks ran in neat rows. Another held objects like very large, fat, long, pale beads. A heap of dusty papers filled the last chair.
        - id: ch01-b16
          speaker: robert
          text: Now he's noticed there are four of us.
        - id: ch01-b17
          speaker: narrator
          text: The children sat down.
        - id: ch01-b18
          speaker: cyril
          text: We know you're tremendously learned. We have a charm, and we need you to read the name on it. It isn't Latin or Greek or Hebrew, or any language we know.
        - id: ch01-b19
          speaker: learned_gentleman
          text: A thorough knowledge of those languages would give you an excellent foundation for your education.
        - id: ch01-b20
          speaker: cyril
          text: Oh! We only know what they look like, except for Latin. And I've only reached Caesar in that.
        - id: ch01-b21
          speaker: narrator
          text: Cyril blushed. The gentleman took off his spectacles and laughed. To Cyril, the laugh sounded rusty, as if it was hardly ever used.
        - id: ch01-b22
          speaker: learned_gentleman
          text: Of course. Please forgive me. I must have been dreaming. You're the children from downstairs, aren't you? I've seen you as I've come and gone. Have you found something you believe is an antiquity and kindly brought it for me to examine?
        - id: ch01-b23
          speaker: anthea
          text: I'm afraid we weren't thinking about what you'd like. We came because we want to know the name on it.
        - id: ch01-b24
          speaker: robert
          text: And before we show you, please don't think we're rude, but we need you to be bound by the what-do-you-call-it of—
        - id: ch01-b25
          speaker: anthea
          text: The bonds of honor and honest dealing.
        - id: ch01-b26
          speaker: learned_gentleman
          text: I'm afraid I don't quite understand.
        - id: ch01-b27
          speaker: narrator
          text: He sounded gently nervous.
        - id: ch01-b28
          speaker: cyril
          text: It's like this. We have part of a charm. The Sammy—I mean, something told us it could work even though it's only half. But it won't work at all until we can say the name written on it. And if you happen to know another name that's strong enough to beat ours, our charm will be no use. Now that we've met you, I'm sure we don't really need to worry. Still, I promised to ask, so I must. Will you give us your word of honor as a gentleman that you won't say any name stronger than the name on our charm?
        - id: ch01-b29
          speaker: narrator
          text: The gentleman put his spectacles back on and peered at Cyril.
        - id: ch01-b30
          speaker: learned_gentleman
          text: Bless me. Bless me! Who told you all this?
        - id: ch01-b31
          speaker: cyril
          text: I can't tell you. I'm very sorry, but I can't.
        - id: ch01-b32
          speaker: narrator
          text: Perhaps some dim memory of his own childhood came back to the learned gentleman, because he smiled.
        - id: ch01-b33
          speaker: learned_gentleman
          text: I see. You're playing some sort of game. Of course! Then yes, I promise. Though I do wonder how you heard about names of power.
        - id: ch01-b34
          speaker: cyril
          text: We can't tell you that either.
        - id: ch01-b35
          speaker: anthea
          text: Here is the charm.
        - id: ch01-b36
          speaker: narrator
          text: The gentleman took it politely, but with no great interest. One glance changed him. His whole body went rigid, like a hunting dog that has spotted a bird.
        - id: ch01-b37
          speaker: learned_gentleman
          text: Excuse me.
        - id: ch01-b38
          speaker: narrator
          text: His voice sounded completely different. He carried the charm to the window and looked closely at it. He turned it over, fitted the round glass to his eye, and studied it all over again. Nobody spoke. The only sound was Robert shuffling his feet, and even that stopped when Anthea nudged him. At last the learned gentleman drew a long breath.
        - id: ch01-b39
          speaker: learned_gentleman
          text: Where did you find this?
        - id: ch01-b40
          speaker: cyril
          text: We didn't find it. We bought it from a shopkeeper called Jacob Absalom, not far from Charing Cross.
        - id: ch01-b41
          speaker: jane
          text: We paid seven shillings and sixpence.
        - id: ch01-b42
          speaker: learned_gentleman
          text: You don't mean to sell it, do you? You wouldn't part with it? I must tell you, it is extremely valuable. Extraordinarily valuable.
        - id: ch01-b43
          speaker: cyril
          text: Yes, we know. That's why we're keeping it.
        - id: ch01-b44
          speaker: learned_gentleman
          text: Then guard it carefully. If you ever decide to part with it, may I have first refusal?
        - id: ch01-b45
          speaker: cyril
          text: First refusal?
        - id: ch01-b46
          speaker: learned_gentleman
          text: I mean, give me the chance to buy it before you sell it to anyone else.
        - id: ch01-b47
          speaker: cyril
          text: All right, we promise. But we don't want to sell it. We want it to do things.
        - id: ch01-b48
          speaker: learned_gentleman
          text: I suppose that game is as good as any other, though I'm afraid the age of magic has ended.
        - id: ch01-b49
          speaker: anthea
          text: It truly hasn't. You'd know that if I could tell you about last summer, but I mustn't. Thank you. Can you read the name?
        - id: ch01-b50
          speaker: learned_gentleman
          text: Yes, I can.
        - id: ch01-b51
          speaker: cyril
          text: Will you tell us what it is?
        - id: ch01-b52
          speaker: learned_gentleman
          text: The name is Ur Hekau Setcheh.
        - id: ch01-b53
          speaker: cyril
          text: Ur Hekau Setcheh. Thank you very much. I hope we haven't kept you too long.
        - id: ch01-b54
          speaker: learned_gentleman
          text: Not at all. But please, I beg you, take the greatest care of that extremely valuable object.
        - id: ch01-b55
          speaker: narrator
          text: The children thanked him in every polite way they could think of, then filed through the door and down the stairs. Anthea went last. Halfway to the first landing, she turned and ran back.
        - id: ch01-b56
          speaker: narrator
          text: The door was still open. The learned gentleman and the mummy case stood facing each other as if they had been that way for years. When Anthea touched his arm, he started.
        - id: ch01-b57
          speaker: anthea
          text: I hope you won't be cross or say it's none of my business, but please look at your chop. Don't you think you ought to eat it? Father sometimes forgets his dinner when he's busy writing. Mother always says I should remind him when she isn't at home to do it, because missing your regular meals is very bad for you. I thought perhaps you wouldn't mind if I reminded you too. You don't seem to have anyone else here to do it.
        - id: ch01-b58
          speaker: narrator
          text: Anthea glanced at the mummy case. It certainly did not look likely to remind anyone about dinner. The gentleman studied her for a moment.
        - id: ch01-b59
          speaker: learned_gentleman
          text: Thank you, my dear. That was very kind. No, there is no one to remind me of such things.
        - id: ch01-b60
          speaker: narrator
          text: He sighed and looked at the chop.
        - id: ch01-b61
          speaker: anthea
          text: It looks very nasty.
        - id: ch01-b62
          speaker: learned_gentleman
          text: Yes, it does. I'll eat it now, before I forget again.
        - id: ch01-b63
          speaker: narrator
          text: He sighed more than once while he ate the cold chop. Perhaps he sighed because it tasted so nasty. Perhaps he longed for the wonderful charm the children would not sell. Or perhaps it had been a very long time since anyone cared whether he ate his meals or forgot them.
        - id: ch01-b64
          speaker: narrator
          text: Anthea caught the others at the foot of the stairs. They woke the Psammead, and it taught them exactly how to use the word of power and make the charm speak. I will not tell you how it was done, because you might try it yourself and almost certainly be disappointed. The chances against finding the right kind of charm are a thousand million to one. Even if you found one, you would hardly ever meet a learned gentleman both clever and kind enough to read its word for you.
        - id: ch01-b65
          speaker: narrator
          text: The children and the Psammead crouched in a circle on the girls' bedroom floor, with the charm in the middle. They chose that room because old Nurse might interrupt them in the parlor when she came to set the table for tea. Outside, the sun shone splendidly, and the bedroom was full of light. London's hum and rattle came through the open window, along with the voice of the milkman in the street below.
        - id: ch01-b66
          speaker: narrator
          text: When everything was ready, the Psammead signaled to Anthea. She spoke the word.
        - id: ch01-b67
          speaker: narrator
          text: At once, all the light in the whole world seemed to vanish. The room went dark, and the world outside became darker than the darkest night there had ever been. Every sound vanished too. The silence was deeper than any silence you could even dream of imagining. It was like suddenly going blind and deaf, only darker and quieter still.
        - id: ch01-b68
          speaker: narrator
          text: Before the children recovered from the shock enough to feel afraid, a faint and lovely light appeared inside the circle. At that same moment, a faint and lovely voice began to speak. The glow was too small for them to see anything by it, and the voice was too soft for them to catch what it said. They could only just see the light and just hear the voice.
        - id: ch01-b69
          speaker: narrator
          text: Then the light strengthened. It was green like the lamps of glowworms, and it grew until thousands upon thousands of them might have been signaling to their winged sweethearts from the middle of the circle. The voice grew too, not only louder but sweeter. It became so beautiful that the sound alone made you want to cry with pleasure. It was like nightingales, the sea, a fiddle, and your mother's voice when you have been away for a long time and she meets you at the door as you come home.
        - id: ch01-b70
          speaker: charm
          text: Speak. What do you wish to hear?
        - id: ch01-b71
          speaker: narrator
          text: I cannot say what language the voice used. I know only that everyone there understood it perfectly. Perhaps there is some language that everyone could understand if only we knew what it was. I cannot tell you how the charm spoke, either, or whether the voice belonged to the charm itself or to some presence inside it. The children could not have told you. Its light was too bright to look at, so they watched the green radiance lying on the faded carpet around the edge of the circle.
        - id: ch01-b72
          speaker: narrator
          text: They all became very quiet. No one wanted to ask questions or even shuffle a foot. This was nothing like the things that had happened in the country when the Psammead granted their wishes. Those adventures had somehow been funny, and this was not. It felt partly like magic from the Arabian Nights and partly like being in church. For a while, no one cared to speak.
        - id: ch01-b73
          speaker: cyril
          text: Please, we want to know where the other half of the charm is.
        - id: ch01-b74
          speaker: charm
          text: The missing part of the Amulet was broken and ground into the dust of the shrine that held it. The pin that once joined the two halves was ground into dust as well. Now that dust is scattered across many lands and has sunk beneath many seas.
        - id: ch01-b75
          speaker: robert
          text: Oh, I say!
        - id: ch01-b76
          speaker: narrator
          text: A blank silence followed.
        - id: ch01-b77
          speaker: cyril
          text: Then it's hopeless, isn't it? We can't search for something smashed to dust and scattered everywhere.
        - id: ch01-b78
          speaker: charm
          text: If you wish to find it, seek it where it remains whole.
        - id: ch01-b79
          speaker: cyril
          text: I don't understand.
        - id: ch01-b80
          speaker: charm
          text: You may find it in the Past.
        - id: ch01-b81
          speaker: cyril
          text: I wish we could find it.
        - id: ch01-b82
          speaker: psammead
          text: Don't you understand? The thing existed in the Past. If you could go into the Past as well, you could find it there. It is terribly difficult to make you understand anything. Time and space are only forms of thought.
        - id: ch01-b83
          speaker: cyril
          text: I see.
        - id: ch01-b84
          speaker: psammead
          text: No, you don't. It doesn't matter if you don't, either. What I mean is this. If you had only been made the proper way, you could see everything happening in the same place at the same time. Do you see now?
        - id: ch01-b85
          speaker: anthea
          text: I'm afraid I don't. I'm sorry I'm so stupid.
        - id: ch01-b86
          speaker: psammead
          text: At least understand this much. The lost half is in the Past, so the Past is where we must search. I can't speak to the charm myself. Ask it questions. Find out what we need!
          emotion: angry
        - id: ch01-b87
          speaker: cyril
          text: Where can we find your other half?
        - id: ch01-b88
          speaker: charm
          text: In the Past.
        - id: ch01-b89
          speaker: cyril
          text: Which part of the Past?
        - id: ch01-b90
          speaker: charm
          text: I may not tell you. Choose a time, and I will carry you to the place that held it then. You must find it yourselves.
        - id: ch01-b91
          speaker: anthea
          text: When did you last see it? I mean, when was it taken away from you?
        - id: ch01-b92
          speaker: charm
          text: That was thousands of years ago. The Amulet was whole then. It rested in a shrine, the last of the many shrines that had held it, and there I worked wonders. Then strange men came carrying weapons no one there had seen before. They tore down my shrine and carried the Amulet away along with many captives. But one of those prisoners was my priest, and he knew the word of power. He spoke it for me. The Amulet became invisible to its captors and returned to the place where my shrine had stood.
        - id: ch01-b93
          speaker: charm
          text: But the shrine had been broken down. Before any magic could raise it again, someone spoke a word before which my power had to bow. My power fell silent, and the Amulet lay there, still whole but enslaved. Later, a workman came carrying stones to rebuild the shrine. He dropped one of the cut stones on the Amulet, and the blow split one half from the other. I had no power to seek the part that was lost. There was no one left who could speak the word of power and join the two halves again.
        - id: ch01-b94
          speaker: charm
          text: So the Amulet lay in the desert dust for many thousands of years. At last a small man came, a conqueror leading an army. Behind him came a crowd of men who wanted to seem wise. One of those men found half the Amulet and carried it to this country. Yet none of them could read the name, so I remained silent. That man died, and his son died after him. The people who came next sold the Amulet to a merchant. You bought it from that merchant, and it came here with you. Now the name of power has been spoken. That is why I am here as well.
        - id: ch01-b95
          speaker: narrator
          text: That was the story the beautiful voice told. I think the small conqueror must have been Napoleon, because I had been told that he once led an army into Egypt. Afterward, a great many learned men went digging and grubbing through the sand. They brought up all kinds of wonderful objects, each older than you would think possible. I believe this charm was one of the things they found, and the most wonderful thing of all.
        - id: ch01-b96
          speaker: narrator
          text: Everyone listened, and everyone tried to think. But it is not easy to think clearly after listening to the kind of story the charm had just told them.
        - id: ch01-b97
          speaker: robert
          text: Can you take us into the Past, back to the shrine where you and the other half were together? If you could take us there, perhaps we'd find the missing part still in the shrine, even after all these thousands of years.
        - id: ch01-b98
          speaker: cyril
          text: Still there? Don't be silly. If we go back into the Past, then for us it won't be thousands of years ago at all. It will be now. That's right, isn't it?
        - id: ch01-b99
          speaker: narrator
          text: Cyril looked to the Psammead for an answer.
        - id: ch01-b100
          speaker: psammead
          text: For once, you're not too far from understanding it.
        - id: ch01-b101
          speaker: anthea
          text: Then will you take us back to the time when the shrine stood and the whole Amulet was safe inside it?
        - id: ch01-b102
          speaker: charm
          text: Yes. You must hold me up and speak the word of power. Then each of you shall pass through me into the Past, one by one, with the firstborn going first. The last person to pass through must be the one who holds me. That person must not lose their grip. If they do, you will lose me and all of you will remain in the Past forever.
        - id: ch01-b103
          speaker: robert
          text: I don't like that idea.
        - id: ch01-b104
          speaker: charm
          text: When you wish to return, hold me up toward the East and speak the word of power. Then pass through me once more. You will return to this time, and this time will become the present for you again.
        - id: ch01-b105
          speaker: cyril
          text: But how—
        - id: ch01-b106
          speaker: narrator
          text: A bell rang loudly.
        - id: ch01-b107
          speaker: robert
          text: Oh crikey, that's tea! Please bring back the proper daylight so we can go downstairs. And thank you very much for helping us.
          emotion: surprised
        - id: ch01-b108
          speaker: anthea
          text: We've enjoyed it very much indeed. Thank you.
        - id: ch01-b109
          speaker: narrator
          text: The beautiful green light slowly faded away. For one moment, the great darkness and the deep silence returned. Then both changed in an instant. Dazzling daylight filled the room, and the children heard London's great, soft, rustling sound again, like some enormous animal turning over in its sleep.
        - id: ch01-b110
          speaker: narrator
          text: The children rubbed their dazzled eyes. The Psammead hurried away to its sandy bath, and the others went downstairs to tea. Until the tea was truly poured and their cups were filled, it seemed much less real than the beautiful voice and the green light in the circle.
        - id: ch01-b111
          speaker: narrator
          text: After tea, Anthea persuaded the others that she should hang the charm around her neck on a piece of string. She was thinking of the warning they had heard and of how awful it would be if the Amulet vanished while they were visiting the Past.
        - id: ch01-b112
          speaker: anthea
          text: It would be dreadful if the charm got lost. It might be lost anywhere, you know. And then we might have to stay in the Past forever and ever. That would be rather beastly, wouldn't it?
