audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带一点郑重其事的幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    cyril:
      display_name: 西里尔
      tts:
        delivery: 聪明果断，偶尔故作老练
        timbre: 清亮的少年声
        pace: 中等偏快
        pitch: 中高
    robert:
      display_name: 罗伯特
      tts:
        delivery: 直率活泼，略带顽皮
        timbre: 明朗的少年声
        pace: 中等
        pitch: 中
    anthea:
      display_name: 安西娅
      tts:
        delivery: 体贴坚定，认真而自然
        timbre: 温柔清亮的少女声
        pace: 中等
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 稚气坦率，情绪写在声音里
        timbre: 轻软的女孩声
        pace: 中等偏慢
        pitch: 高
    psammead:
      display_name: 赛米德
      tts:
        delivery: 古老敏感，抱怨中带着骄傲和亲昵
        timbre: 沙哑细小而奇特
        pace: 中等偏慢
        pitch: 中高
    learned_gentleman:
      display_name: 学者先生
      tts:
        delivery: 温文拘谨，学究气中带着真诚善意
        timbre: 清瘦柔和的成年男声
        pace: 舒缓
        pitch: 中低
    amulet_voice:
      display_name: 护身符之声
      tts:
        delivery: 庄严悠远，甜美而不失神秘
        timbre: 空灵纯净
        pace: 缓慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 可怜的学者先生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            学者先生忙得连午饭都忘了。一块羊排在盘里彻底冷掉，肉汁里的油凝成一片白色，衬得羊排像冰池中央一座褐色小岛，样子实在倒胃口。孩子们敲了三遍门，里面始终没有回应。其中一个终于壮着胆子拧动把手，把门轻轻推开，第一眼便看见这顿冷饭。盘子摆在一张长桌尽头，桌子沿房间一侧伸展开去，上面挤满雕像、形状古怪的石头和书。后墙边固定着一排玻璃柜，里面收藏着稀奇古怪的小东西，很像珠宝店的陈列柜。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那位“可怜的学者先生”坐在窗前，用细镊子夹着一件极小的物品。他眼前扣着圆放大镜，很像钟表匠，也让孩子们想起赛米德的蜗牛长眼。他又高又瘦，长靴从桌子下面一直伸到另一边，丝毫没听见有人进来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            先生没有听见开门，四个孩子站在门口犹豫。罗伯特终于把门推得更开，大家却立刻吓得往后退。原来先前被门遮住的墙壁正中，立着一具大得惊人的木乃伊棺，涂着红、黄、绿、黑几种颜色，那张脸正凶巴巴地瞪着他们。你要是不知道木乃伊棺的模样，最好立刻去大英博物馆瞧瞧。反正谁也不会料到，它会站在布卢姆斯伯里顶楼的临街房间里，仿佛要盘问来客究竟有什么事。
        - id: ch01-b04
          speakers: [cyril, robert, anthea, jane]
          ensemble: chorus
          text: 啊！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: >-
            四双靴子咔嗒乱响。学者先生这才摘下放大镜，用受过牛津教育的绅士才有的轻柔声音开口。
        - id: ch01-b06
          speaker: learned_gentleman
          text: 失礼了。
        - id: ch01-b07
          speaker: cyril
          text: 该道歉的是我们。很抱歉打扰您。
        - id: ch01-b08
          speaker: learned_gentleman
          text: >-
            请进。见到你们，我很高兴。请坐吧。不，那把椅子不行，请让我先移开这卷纸莎草。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他微笑着清出一把椅子，大圆眼镜后的目光十分亲切。安西娅暗想，他的礼数真是高雅。
        - id: ch01-b10
          speaker: robert
          text: 他把我们当大人呢，而且好像还没看清我们有几个人。
        - id: ch01-b11
          speaker: anthea
          text: 嘘，讲悄悄话不礼貌。西里尔，你快说吧。
        - id: ch01-b12
          speaker: cyril
          text: >-
            我们真的不想打扰您。可我们敲了三遍，您没说“请进”，也没叫我们走开、改天再来，或者说您现在太忙。门里一直没回应，我们才自己进来。等候时听见您打喷嚏，所以知道您在家。
        - id: ch01-b13
          speaker: learned_gentleman
          text: 没有打扰。都请坐吧。
        - id: ch01-b14
          speaker: narrator
          text: >-
            先生听了，又腾出三把椅子，看来终于发现客人一共有四位。他把每样东西都小心放到地板上。第一把椅子上的东西很像砖块，表面留着排列整齐的小痕迹，仿佛砖还柔软时，有小得不能再小的鸟从上面走过。第二把椅子放着一些又圆、又粗、又长的浅色东西，活像大得出奇的胖珠子。最后一把堆的是积满灰尘的纸。等这些东西全都安置妥当，四个孩子才坐了下来。
        - id: ch01-b15
          speaker: cyril
          text: >-
            我们知道您学问很大。我们有一件护身符，想请您读出上面的名字。那些字既不是拉丁文、希腊文或希伯来文，也不是我们认识的其他语言。
        - id: ch01-b16
          speaker: learned_gentleman
          text: 能精通你说的那几种语言，已经是相当扎实的教育基础了。
        - id: ch01-b17
          speaker: cyril
          text: >-
            啊，我们只是认得那些文字的样子。只有拉丁文真的学过，可我也才读到恺撒。
        - id: ch01-b18
          speaker: narrator
          text: >-
            西里尔说这些话时红了脸。先生摘下眼镜笑起来，那笑声有点生锈，仿佛平日很少用。他这才像从梦里醒来，想起这几个孩子住在楼下，自己进出时曾见过他们。他以为孩子们发现了一件自认为是古物的东西，因为信任他的眼光，才特意拿来请他鉴定。
        - id: ch01-b19
          speaker: learned_gentleman
          text: 你们肯拿来给我看，真是好意。我很愿意鉴定。
        - id: ch01-b20
          speaker: anthea
          text: >-
            其实我们没想到您也会喜欢。我们只想知道上面的名字，是为了自己才来的。
        - id: ch01-b21
          speaker: robert
          text: >-
            还有，在给您看以前，我们得先请您受那个……叫什么来着……的约束。您不会觉得无礼吧？
        - id: ch01-b22
          speaker: anthea
          text: 受荣誉与正直的锁链约束。
        - id: ch01-b23
          speaker: learned_gentleman
          text: 恐怕我没听懂你们的意思。
        - id: ch01-b24
          speaker: narrator
          text: 先生显得温和，却有点不安。西里尔只好从头解释。
        - id: ch01-b25
          speaker: cyril
          text: >-
            我们只有半块护身符。萨米——我是说，有个什么东西告诉我们，只要念出上面的名字，半块也能施法。不过，要是您知道更厉害的名字，还用来对付我们的名字，护身符就会失效。见到您以后，我相信根本不必担心，可我答应过一定要问。请您以绅士的荣誉保证，绝不念出比护身符上的名字更强大的名字，好吗？
        - id: ch01-b26
          speaker: learned_gentleman
          text: 天哪！天哪！这些事是谁告诉你们的？
          emotion: surprised
        - id: ch01-b27
          speaker: cyril
          text: 对不起，我不能告诉您。
        - id: ch01-b28
          speaker: narrator
          text: >-
            也许就在这时，先生心里浮起了一点遥远童年的朦胧记忆。他露出笑容，认定孩子们正在玩某种一本正经的游戏，于是郑重答应了他们的请求。不过，他仍旧十分好奇，这些孩子究竟从哪里听说了“力量之名”这种事。
        - id: ch01-b29
          speaker: cyril
          text: 那件事我们也不能说。
        - id: ch01-b30
          speaker: anthea
          text: 这就是我们的护身符。
    - id: ch02
      title: 护身符上的名字
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            先生礼貌地接过护身符，眼中却没有多少兴趣。可只看了第一眼，他全身便猛地僵住，像一只猎犬突然发现了鹧鸪。刚才那副客气而心不在焉的神情，一瞬间全消失了。
        - id: ch02-b02
          speaker: learned_gentleman
          text: 请原谅。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他的声音完全变了。他把护身符拿到光线明亮的窗前，先仔细看正面，再翻过来查看背面，随后又把圆放大镜扣到眼睛上，从头研究一遍。大家谁也不敢出声，只有罗伯特忍不住把脚在地上蹭得沙沙响，直到安西娅轻轻碰他一下，叫他安静。漫长的等待过后，先生终于深深吸了口气。
        - id: ch02-b04
          speaker: learned_gentleman
          text: 你们在哪里找到它的？
        - id: ch02-b05
          speaker: cyril
          text: >-
            不是找到的，是从店里买来的。店主叫雅各布·阿布萨洛姆，店离查令十字街不远。
        - id: ch02-b06
          speaker: jane
          text: 我们付了七先令六便士。
        - id: ch02-b07
          speaker: learned_gentleman
          text: >-
            你们不打算卖掉它吧？我得告诉你们，这件东西极其珍贵，价值非同寻常。
        - id: ch02-b08
          speaker: cyril
          text: 我们知道，所以当然要留着。
        - id: ch02-b09
          speaker: learned_gentleman
          text: >-
            那就好好保管。将来万一想卖，请先给我买下它的机会，可以吗？
        - id: ch02-b10
          speaker: cyril
          text: 您说什么机会？
        - id: ch02-b11
          speaker: learned_gentleman
          text: 就是在让我出价以前，别把它卖给别人。
        - id: ch02-b12
          speaker: cyril
          text: >-
            好，我们不会卖给别人。可我们根本不想卖，只想让它施法。
        - id: ch02-b13
          speaker: learned_gentleman
          text: >-
            拿它来玩倒也无妨，只是魔法的时代恐怕早已过去了。
        - id: ch02-b14
          speaker: anthea
          text: >-
            其实没有。我要是能讲去年暑假的经历，您就会相信，可惜我不能说。谢谢您。您到底读得出名字吗？
        - id: ch02-b15
          speaker: learned_gentleman
          text: 是的，我读得出来。
        - id: ch02-b16
          speaker: cyril
          text: 那么，请告诉我们吧。
        - id: ch02-b17
          speaker: learned_gentleman
          text: 这个名字是乌尔·赫考·塞切赫。
        - id: ch02-b18
          speaker: cyril
          text: >-
            乌尔·赫考·塞切赫。太感谢了，希望我们没占用您太多时间。
        - id: ch02-b19
          speaker: learned_gentleman
          text: >-
            完全没有。不过请听我劝告，千万小心保管这件价值连城的珍品。
        - id: ch02-b20
          speaker: narrator
          text: >-
            孩子们把能想得出的每一种客气话都说了一遍，这才排着队走出房门，顺楼梯下去。安西娅落在最后。走到通往第一个楼梯平台的半路，她忽然停住，想起桌上那顿早已冷透的午饭，于是转身跑回楼上。门还开着，学者先生与木乃伊棺面对面站在那里，两边谁也不动，像是已经这样相对站了许多年。那幅景象既古怪，又有一点孤单。安西娅走近，把手轻轻放到先生胳膊上，他这才从沉思中惊醒，猛地吓了一跳。
        - id: ch02-b21
          speaker: anthea
          text: >-
            请别生气，也别说不关我的事。您看看那块羊排，不觉得该把它吃了吗？父亲写作时也会忘记吃饭。母亲不在家，就叫我提醒他，因为不按时吃饭对身体不好。您好像没人提醒，我想您大概不会介意我多嘴。
        - id: ch02-b22
          speaker: narrator
          text: >-
            她看了看木乃伊棺。那东西当然不像会提醒谁吃饭。先生静静望了安西娅一会儿。
        - id: ch02-b23
          speaker: learned_gentleman
          text: 谢谢你，亲爱的孩子。你能想到这件事，真好。的确没人提醒我。
        - id: ch02-b24
          speaker: narrator
          text: 他叹了口气，低头看看羊排。
        - id: ch02-b25
          speaker: anthea
          text: 它看起来很难吃。
        - id: ch02-b26
          speaker: learned_gentleman
          text: 是啊，确实如此。我马上吃，免得再忘掉。
        - id: ch02-b27
          speaker: narrator
          text: >-
            先生当真坐下来吃那块冷羊排，吃着吃着，又叹了好几次气。也许是因为肉的滋味实在太糟，也许是因为心里一直惦记着那件珍贵的护身符，可孩子们根本不愿出售。还有一种可能，他只是忽然想起，已经很久很久没有人关心他究竟按时吃掉了羊排，还是又把饭菜忘在一边。
    - id: ch03
      title: 美丽的声音
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            安西娅在楼梯脚追上大家。他们叫醒赛米德，让它一丝不差地教会自己怎样使用力量之名，又怎样叫护身符开口。我可不会把办法告诉你，免得你也照着尝试，结果只收获一场失望。首先，你拿到真正合用的护身符，机会大概只有十亿分之一。就算碰巧得到了，也几乎找不到既足够聪明、又足够善良，肯替你读出那个词的学者先生。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他们没有选择客厅，而是躲进女孩们的卧室。要是在客厅施法，老保姆随时可能进来铺下午茶的桌布，把一切打断。四个孩子和赛米德围成一圈，蹲在地板上，把红色护身符端端正正放在圆圈中央。外面阳光灿烂，房间里亮堂堂的。敞开的窗户送进伦敦不住的嗡鸣和车辆的辚辚声，楼下街头还传来送奶人拖长声音的叫卖。
        - id: ch03-b03
          speaker: narrator
          text: >-
            一切就绪，赛米德示意安西娅念出那个词。她刚一开口，世界上所有的光仿佛同时熄灭。房间完全黑了，窗外的整个世界也黑了，比人经历过的最深夜色还要浓重。所有声音一齐消失，连伦敦的低鸣也不留半点。那寂静深得连梦也想象不出，简直像突然又聋又瞎，只是比失去听觉与视觉更加黑暗，更加安静。
        - id: ch03-b04
          speaker: narrator
          text: >-
            孩子们刚受到惊吓，还没缓过神来，甚至没来得及真正害怕，圆圈中央便显出一点微弱而美丽的光芒。与此同时，一个同样微弱而美丽的声音开始说话。光小得照不见任何东西，声音也细得分辨不出话语，只能勉强看见，勉强听见。随后，绿光一点点增强，像萤火虫点起的小灯。它不停生长，越来越亮，最后仿佛有成千上万只萤火虫聚在圆圈中央，各自举着绿色灯火，朝那些长着翅膀的心上人闪动信号。
        - id: ch03-b05
          speaker: narrator
          text: >-
            声音也随光芒一同增长。它的确越来越响，可比音量增长得更快的，是那不可思议的甜美。仅仅听着它，人便会因为欢喜而想落泪。那声音里仿佛同时有夜莺的歌唱、大海的回声和提琴的旋律。它又像你离家很久以后终于归来，母亲站在门口迎接你时，对你说话的声音。
        - id: ch03-b06
          speaker: amulet_voice
          text: 说吧。你们想听到什么？
        - id: ch03-b07
          speaker: narrator
          text: >-
            谁也说不出那是哪种语言，可在场的每个人全都听得明明白白。仔细想想，世上或许真有一种人人都能懂的语言，只是我们不知道它是什么。护身符怎样开口的，也没人能解释。说话的究竟是护身符本身，还是藏在里面的某个存在，孩子们同样答不上来。事实上，那团光已经亮得叫人无法直视，他们谁也看不清护身符正在发生什么。大家只能移开目光，望着圆圈边缘那张褪色的基德明斯特地毯，看绿色光辉在陈旧的花纹上铺展开来。
        - id: ch03-b08
          speaker: narrator
          text: >-
            大家都安静极了，既不想提问，也不想再用脚蹭来蹭去。每个人都感到，眼前的事与赛米德在乡下替他们实现愿望时完全不同。那些愿望不论怎样惊人，不知为何总带着一点滑稽，叫人忍不住想笑。此刻的一切却没有半点可笑之处，反而让人不由自主地郑重起来。它既像《一千零一夜》里古老而庄严的魔法，又像大家正安静地坐在教堂。谁都不愿第一个出声，打破这片寂静。过了许久，西里尔终于鼓起勇气开口。
        - id: ch03-b09
          speaker: cyril
          text: 请告诉我们，护身符的另一半在哪里。
        - id: ch03-b10
          speaker: amulet_voice
          text: >-
            遗失的那一半已经碎裂，被碾入供奉我的神殿尘土。它和连接两半的销钉都已成为尘埃，散落在许多土地上，也沉没在许多海洋中。
        - id: ch03-b11
          speaker: robert
          text: 哎呀！
          emotion: surprised
        - id: ch03-b12
          speaker: narrator
          text: 一阵茫然的沉默落了下来。
        - id: ch03-b13
          speaker: cyril
          text: >-
            那不是全完了吗？东西碎成了尘土，又散得到处都是，我们还怎么找？
        - id: ch03-b14
          speaker: amulet_voice
          text: 要找到它，就去它仍旧完好无缺的地方寻找。
        - id: ch03-b15
          speaker: cyril
          text: 我不明白。
        - id: ch03-b16
          speaker: amulet_voice
          text: 你们可以到过去寻找。
        - id: ch03-b17
          speaker: cyril
          text: 我希望我们真能找到。
        - id: ch03-b18
          speaker: psammead
          text: >-
            还不明白吗？它在过去是存在的。你们要是也到了过去，就能找到它。想让你们弄懂事情真难。时间与空间只是思想的形式。
        - id: ch03-b19
          speaker: cyril
          text: 我懂了。
        - id: ch03-b20
          speaker: psammead
          text: >-
            不，你没懂，不过没关系。假如你的构造正确，就能看见所有事情在同一地点、同一时刻发生。现在懂了吗？
        - id: ch03-b21
          speaker: anthea
          text: 恐怕我也不懂。对不起，我太笨了。
        - id: ch03-b22
          speaker: psammead
          text: >-
            至少有一件事很清楚。遗失的那一半在过去，我们必须去过去找。我不能亲自跟护身符讲话，你们快问，把事情问清楚！
        - id: ch03-b23
          speaker: cyril
          text: 我们在哪里能找到你的另一半？
        - id: ch03-b24
          speaker: amulet_voice
          text: 在过去。
        - id: ch03-b25
          speaker: cyril
          text: 过去的哪个时候？
        - id: ch03-b26
          speaker: amulet_voice
          text: >-
            我不能说。你们选定一个时代，我就带你们去当时拥有它的地方。接下来必须由你们亲自寻找。
        - id: ch03-b27
          speaker: anthea
          text: 你最后一次见到它是什么时候？我是说，它何时被人从你身边拿走？
    - id: ch04
      title: 通往过去的路
      blocks:
        - id: ch04-b01
          speaker: amulet_voice
          text: >-
            那是几千年前。护身符还完整无缺，供奉在许多神殿中的最后一座里，我在那里施展奇迹。后来，一群陌生人拿着陌生武器来临。他们摧毁神殿，把护身符和许多俘虏一起带走。
        - id: ch04-b02
          speaker: amulet_voice
          text: >-
            俘虏中有我的祭司。他知道力量之名，替我念出它，护身符便隐去形迹，重回神殿。可神殿已经倒塌。魔法尚未来得及重建，又有人念出一个词，我的力量在它面前屈服，归于沉寂。护身符仍然完整，却从此受人奴役。
        - id: ch04-b03
          speaker: amulet_voice
          text: >-
            后来，有人运石头来重建神殿，一块凿好的石头从他手中掉下，把护身符砸成两半。我无力寻找遗失的部分，也没有人替我念出力量之名，让两半重新接合。于是护身符在沙漠尘土里沉睡了几千年。
        - id: ch04-b04
          speaker: amulet_voice
          text: >-
            最后，一个矮小的征服者带着军队来了。后面还跟着一群竭力想显得聪明的人。其中一人发现了半块护身符，把它带到这个国度。可是没人读得出名字，我便继续沉睡。那个人和他的儿子先后死去，后人把护身符卖给商人，你们又从商人手里买下它。现在，力量之名已经念出，我也随它来到了这里。
        - id: ch04-b05
          speaker: narrator
          text: >-
            那美丽的声音讲的就是这些。我猜它所说的矮小征服者一定是拿破仑。我记得听人讲过，他曾经率领一支军队前往埃及。后来，一大群自以为聪明的人跟着到了那里，在沙地里到处刨挖，从尘土下面掏出各式各样的奇物。那些东西经历的年代久远得超乎你的想象。我相信这半块护身符正是他们从沙中找到的东西之一，而且还是所有奇物里最不可思议、最有力量的那一件。
        - id: ch04-b06
          speaker: narrator
          text: >-
            在场的每一个人都静静听完，又各自在心里努力思索。可刚刚听过这样一番跨越几千年的话，谁也不容易立刻把事情理得清清楚楚。护身符怎样破碎，另一半又怎样还能在过去被找到，这些念头全挤在大家脑中。孩子们沉默了一阵，想了又想。最后，罗伯特终于先抓住一个主意，小心地把它说了出来。
        - id: ch04-b07
          speaker: robert
          text: >-
            你能带我们去过去吗？就去你和另一半都在神殿里的时候。这样，就算外面已经过了几千年，我们或许还能在那里找到它。
        - id: ch04-b08
          speaker: cyril
          text: >-
            什么叫还在那里，你真傻！我们回到过去以后，对我们来说那就是现在，不是几千年前。对吧？
        - id: ch04-b09
          speaker: narrator
          text: 西里尔转向赛米德，等它评判。
        - id: ch04-b10
          speaker: psammead
          text: 这次你的想法，倒不像平常那么离谱！
        - id: ch04-b11
          speaker: anthea
          text: >-
            那么，你能带我们回到神殿还在、完整的你还安全待在里面的时候吗？
        - id: ch04-b12
          speaker: amulet_voice
          text: >-
            可以。把我举起来，念出力量之名。从最先出生的人开始，你们一个接一个穿过我，进入过去。举着我的人最后通过，而且绝不能松手。否则你们会失去我，自己也将永远留在过去。
        - id: ch04-b13
          speaker: robert
          text: 这主意听着真难受。
        - id: ch04-b14
          speaker: amulet_voice
          text: >-
            想回来时，朝东方把我举起，再念出那个词。穿过我，你们便会回到这个时代，它也会重新成为你们的现在。
        - id: ch04-b15
          speaker: cyril
          text: 可是，我们该怎么做呢——
        - id: ch04-b16
          speaker: narrator
          text: 铃声突然大响，截断了他的话。
        - id: ch04-b17
          speaker: robert
          text: >-
            哎呀，是下午茶！请把真正的白昼变回来，让我们下楼去吧。也谢谢你这样好心帮助我们。
          emotion: surprised
        - id: ch04-b18
          speaker: anthea
          text: 我们真的过得非常愉快，谢谢你！
        - id: ch04-b19
          speaker: narrator
          text: >-
            护身符回答了最后一句话，美丽的光便一点点暗下去，那个甜美的声音也随之远去，直到两者彻底消失。那片巨大的黑暗与寂静随即重新压下来，把圆圈中的所有人包围。可它只停留了一瞬，下一刻便骤然变成令人眼花的明亮白昼。伦敦所有的声音也一起回来了，车辆、街声和远处的响动汇成一片柔和、窸窣却又无比巨大的声响，仿佛有一头庞然巨兽正在睡梦中缓缓翻身。
        - id: ch04-b20
          speaker: narrator
          text: >-
            孩子们不停揉着眼睛，赛米德飞快跑回自己的沙浴盆，其他人则匆匆下楼喝下午茶。刚才的一切仍牢牢占据着他们的心。直到茶壶里的茶真正斟进各人的杯子，他们依旧觉得眼前的杯碟、点心和下午茶，远不如那美丽的声音与绿色光芒真实。茶后，安西娅认真劝说其他人。护身符是大家来往过去的唯一道路，绝不能随便搁着。她终于得到一致同意，用一根细绳把它牢牢挂到自己的脖子上。
        - id: ch04-b21
          speaker: anthea
          text: >-
            要是它丢了，那就太可怕了。它随时可能在哪里弄丢。万一我们因此永远困在过去，岂不是糟透了吗？
