audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
    judith_loftus:
      display_name: 朱迪丝·洛夫特斯太太
      tts:
        delivery: 热心健谈，精明中带着温和的善意
        timbre: 明亮朴实
        pace: 自然流畅
        pitch: 中
  chapters:
    - id: ch01
      title: 第十一章
      blocks:
        - id: ch01-b01
          speaker: judith_loftus
          text: 进来吧。拉把椅子坐下。
        - id: ch01-b02
          speaker: huck
          text: 我进了屋，照她的话坐下。她用那双亮闪闪的小眼睛，从头到脚把我看了一遍。
        - id: ch01-b03
          speaker: judith_loftus
          text: 你叫什么名字呀？
        - id: ch01-b04
          speaker: huck
          text: 我叫萨拉·威廉斯。
        - id: ch01-b05
          speaker: judith_loftus
          text: 你住哪一带？就在附近吗？
        - id: ch01-b06
          speaker: huck
          text: 不是，太太。我住在下游七英里外的胡克维尔，一路走到这里，已经累坏了。
        - id: ch01-b07
          speaker: judith_loftus
          text: 你也饿了吧？我给你找点吃的。
        - id: ch01-b08
          speaker: huck
          text: 不用了，太太。刚才我饿得受不了，在下游两英里的一户农家歇过脚，现在不饿了。我在那里耽搁了一阵，所以才来得这么晚。我娘病倒了，钱也用光了。我来给舅舅阿布纳·穆尔报信，她说他住在镇子最上头。我从没来过这里，您认识他吗？
        - id: ch01-b09
          speaker: judith_loftus
          text: 不认识。我搬来还不到两个星期，这里的人没认全。镇子最上头离这儿可远呢。你今晚就住下吧，先把帽子摘了。
        - id: ch01-b10
          speaker: huck
          text: 不啦。我歇一阵就走，我不怕黑。
        - id: ch01-b11
          speaker: huck
          text: 她不肯让我独自上路，说丈夫大概再过一个半钟头就回来，到时可以送我去。接下来，她把丈夫、上游的亲戚和下游的亲戚说了个遍，又说他们从前过得好得多，不知道搬来我们镇上是不是错了，早知如此还不如安安稳稳留在原处。她就这么没完没了地说下去。我越听越发慌，开始怀疑自己跑来找她打听镇上的动静，恐怕也是走错了一步。
        - id: ch01-b12
          speaker: huck
          text: 后来，她总算说到了爹和那桩凶案，我马上乐意让她继续说下去。她讲起我和汤姆·索亚找到了六千块钱，不过这笔钱到了她嘴里，已经变成了一万。她又把爹的事从头说了一遍，说爹命苦，我也命苦，最后终于讲到我给人杀了。
        - id: ch01-b13
          speaker: huck
          text: 是谁干的？胡克维尔那边也听说了不少，可我们还不知道究竟是谁杀了哈克·费恩。
        - id: ch01-b14
          speaker: judith_loftus
          text: 这里也有一大群人想知道呢。有人说，是老费恩亲手干的。
        - id: ch01-b15
          speaker: huck
          text: 不会吧，真有这回事？
        - id: ch01-b16
          speaker: judith_loftus
          text: 起先差不多人人都这么想。他差一点就给人用私刑吊死了，自己还不知道有多险。可没到晚上，大伙儿又改了主意，认定是那个逃跑的黑奴吉姆干的。
        - id: ch01-b17
          speaker: huck
          text: 怎么可能是他呢——
        - id: ch01-b18
          speaker: huck
          text: 我赶紧住嘴，心想这时候还是保持安静为妙。她压根没注意我刚才插过话，只管一个劲儿往下说。
        - id: ch01-b19
          speaker: judith_loftus
          text: 哈克给杀的那晚，吉姆正好逃了，抓他有三百块赏金。抓老费恩也有两百块。凶案第二天一早，老费恩进镇报了信，还跟大伙儿坐渡船出去搜人，可转眼自己也跑了。天黑以前，人们已经想把他吊死，那时他早就没影了。他差点送了命，自己还一点也不知道。
        - id: ch01-b20
          speaker: judith_loftus
          text: 到了第二天，人们发现吉姆也不见了，而且凶案当晚十点以后，谁也没见过他，于是就把罪安在了他头上。隔天，大伙儿正一心认定是吉姆干的，老费恩又回来了。他哭哭啼啼去找撒切尔法官要钱，说要走遍伊利诺伊州，把吉姆找出来。法官果真给了他一些钱。
        - id: ch01-b21
          speaker: judith_loftus
          text: 当天晚上，老费恩喝得烂醉，跟两个模样很凶的陌生人混到半夜，后来随他们走了，再没回来。大伙儿猜，这阵风头不稍稍过去，他不会露面。如今人们都觉得，是他杀了自己的儿子，再把现场弄得像强盗干的。这样不用拖上老长一场官司，他也能拿到哈克的钱。人人都说，这种事他完全干得出来。
        - id: ch01-b22
          speaker: judith_loftus
          text: 我看他精得很。只要一年不回来，事情就全平静了，谁也拿不出证据证明是他干的。到那时，他大摇大摆回来拿走哈克的钱，简直不费一点力气。
        - id: ch01-b23
          speaker: huck
          text: 我看也是，太太，没什么能拦住他。现在已经没人觉得是吉姆干的吗？
        - id: ch01-b24
          speaker: judith_loftus
          text: 还是有不少人认定是他。不过很快就能抓住他了，说不定吓一吓，他便会招供。
        - id: ch01-b25
          speaker: huck
          text: 怎么，他们还在追他？
        - id: ch01-b26
          speaker: judith_loftus
          text: 你这孩子真不懂事。三百块钱哪能天天摆着等人捡？有人觉得吉姆没走远，我也是这么想，只是没到处说。几天前，隔壁木棚的一对老夫妻提到，对面的杰克逊岛平时几乎没人去。我问岛上有没有人住，他们说一个也没有。
        - id: ch01-b27
          speaker: judith_loftus
          text: 我没再出声，心里却琢磨起来。前一两天，我差不多能肯定岛尖那边冒过烟。吉姆多半就藏在那里。就算不是，费点事去搜一遍也值得。从那以后我没再看见烟，要真是他，也许已经走了。不过我丈夫还是要和另一个男人过去看看。他先前去了上游，今天才回来。两小时前刚进家门，我马上就把这件事告诉他了。
        - id: ch01-b28
          speaker: huck
          text: 我越来越慌，根本坐不住，只好找点事让两只手忙起来。我从桌上拿起一根针，试着把线穿进去。可手不停地抖，怎么也穿不好。她不说话了，我抬头一看，她正带着一点笑，好奇地盯着我。我赶紧放下针线，装出很感兴趣的样子。其实我确实听得入神。
        - id: ch01-b29
          speaker: huck
          text: 三百块钱可真不少。要是我娘能拿到就好了。您丈夫今晚就要去岛上吗？
        - id: ch01-b30
          speaker: judith_loftus
          text: 当然。他去镇上找刚才说的那个人了，还得弄条船，再看看能不能多借一杆枪。他们过了半夜就动身。
        - id: ch01-b31
          speaker: huck
          text: 等到白天，他们不是看得更清楚吗？
        - id: ch01-b32
          speaker: judith_loftus
          text: 是呀，可吉姆不也看得更清楚？半夜以后，他多半睡着了。他们能摸黑穿过树林。要是他生了营火，黑夜里反而更容易找到。
        - id: ch01-b33
          speaker: huck
          text: 这一层我倒没想到。
        - id: ch01-b34
          speaker: huck
          text: 她仍旧好奇地看着我，弄得我浑身不自在。过了一会儿，她又开口了。
        - id: ch01-b35
          speaker: judith_loftus
          text: 宝贝儿，你刚才说自己叫什么？
        - id: ch01-b36
          speaker: huck
          text: 我叫玛——玛丽·威廉斯。
        - id: ch01-b37
          speaker: huck
          text: 我隐约记得，先前说的好像不是玛丽，而是萨拉，所以不敢抬头。这下我像给逼进了墙角，只怕脸上也露出破绽。我真希望她赶紧说点别的，可她静静坐得越久，我心里就越慌。
        - id: ch01-b38
          speaker: judith_loftus
          text: 宝贝儿，我怎么记得你进门时，说的是萨拉？
        - id: ch01-b39
          speaker: huck
          text: 是的，太太。我叫萨拉·玛丽·威廉斯。萨拉是我的头一个名字，有人叫我萨拉，也有人叫我玛丽。
        - id: ch01-b40
          speaker: judith_loftus
          text: 哦，原来如此？
        - id: ch01-b41
          speaker: huck
          text: 是的，太太。
        - id: ch01-b42
          speaker: huck
          text: 我心里好受了一些，可还是想赶紧离开，仍旧不敢抬头。
        - id: ch01-b43
          speaker: huck
          text: 她又说起日子有多难过，他们穷得怎样过活，还说那些耗子简直把这里当成了自己家，想来就来。我的心慢慢安定下来。耗子的事，她可一点没夸张。每隔一会儿，就有一只从墙角洞里探出鼻子。她说，独自在家时，手边非得备点东西，好随时拿来砸它们，不然它们准闹得她不得安生。
        - id: ch01-b44
          speaker: huck
          text: 她给我看一条拧成疙瘩的铅块，说平时砸耗子一砸一个准，只是前一两天扭伤了胳膊，不知道现在还扔不扔得准。等耗子一露头，她便猛砸过去，可差得老远。胳膊疼得她叫了一声“哎哟”。接着，她叫我等下一只出来时试试。我只想赶在她家老头子回来前离开，嘴上当然半点不露。
        - id: ch01-b45
          speaker: huck
          text: 我接过铅块。下一只耗子刚露鼻子，我便甩手砸去。它要是还待在原地，准会给砸得不轻。她夸我这一手真不错，说下一只一定逃不掉。她捡回铅块，又拿来一绞毛线，要我帮她撑着。我举起两只手，她把毛线套上去，然后继续说她和丈夫家里的那些事。
        - id: ch01-b46
          speaker: judith_loftus
          text: 留神耗子。把铅块放在腿上吧，拿着方便。
        - id: ch01-b47
          speaker: huck
          text: 就在那一刻，她把铅块丢到我腿上，我两腿一合便夹住了。她接着往下说，可只又说了约莫一分钟，便从我手上取下毛线，直直望着我的脸。她的神色仍旧和和气气。
        - id: ch01-b48
          speaker: judith_loftus
          text: 好啦，说说吧，你到底叫什么名字？
        - id: ch01-b49
          speaker: huck
          text: 什——什么，太太？
        - id: ch01-b50
          speaker: judith_loftus
          text: 你的真名。是比尔、汤姆，还是鲍勃？究竟叫什么？
        - id: ch01-b51
          speaker: huck
          text: 我抖得像片树叶，简直不知道怎么办，只得继续装下去。
        - id: ch01-b52
          speaker: huck
          text: 太太，求您别拿我这样一个可怜姑娘取笑。要是我在这里碍事，我就——
        - id: ch01-b53
          speaker: judith_loftus
          text: 不，你哪儿也不去。坐好，我不会伤你，也不会告发你。把秘密告诉我，相信我吧。我会替你守住，还会帮你。我家老头子也会帮忙。你不过是个逃出来的学徒，没什么大不了。人家待你不好，你受不了才逃走。放心吧，孩子，我不会告发你。来，把事情全告诉我，做个好孩子。
        - id: ch01-b54
          speaker: huck
          text: 我说，再装下去也没用，不如索性把什么都老老实实告诉她，只求她别反悔，一定守住刚才的诺言。接着我又编了一套。我说爹娘都死了，官府把我送给一个住在乡下的刻薄老农做学徒。那地方离河三十英里，他待我坏透了，我再也忍不下去。
        - id: ch01-b55
          speaker: huck
          text: 正巧老农要出门两天，我便抓住机会，偷了他女儿的几件旧衣服逃出来。三十英里的路，我走了三个晚上，夜里赶路，白天躲起来睡觉。从家里带出一袋面包和肉，一路吃下来绰绰有余。我相信舅舅阿布纳·穆尔会收留我，所以才一路奔到戈申镇来。
        - id: ch01-b56
          speaker: judith_loftus
          text: 戈申？孩子，这里是圣彼得堡，可不是戈申。戈申还在上游十英里呢。谁告诉你这里是戈申？
        - id: ch01-b57
          speaker: huck
          text: 今天拂晓，我正要照常钻进树林睡觉，遇见一个男人。他说，走到岔路口往右拐，再走五英里就是戈申。
        - id: ch01-b58
          speaker: judith_loftus
          text: 我看他喝醉了。他告诉你的恰好全是反的。
        - id: ch01-b59
          speaker: huck
          text: 他那副样子的确像喝醉了。不过也不碍事，我得动身了，天亮以前总能赶到戈申。
        - id: ch01-b60
          speaker: judith_loftus
          text: 等一会儿。我给你包点吃的，路上也许用得着。
        - id: ch01-b61
          speaker: huck
          text: 她包好一份吃食，又突然考起我来。
        - id: ch01-b62
          speaker: judith_loftus
          text: 一头牛躺在地上，起身时哪一头先起来？马上回答，别琢磨。
        - id: ch01-b63
          speaker: huck
          text: 后半截先起来，太太。
        - id: ch01-b64
          speaker: judith_loftus
          text: 那么马呢？
        - id: ch01-b65
          speaker: huck
          text: 前半截先起来，太太。
        - id: ch01-b66
          speaker: judith_loftus
          text: 树的哪一边长青苔？
        - id: ch01-b67
          speaker: huck
          text: 青苔长在北边。
        - id: ch01-b68
          speaker: judith_loftus
          text: 十五头牛在山坡上吃草，有几头的脑袋朝同一个方向？
        - id: ch01-b69
          speaker: huck
          text: 十五头的脑袋全都朝着同一个方向，太太。
        - id: ch01-b70
          speaker: judith_loftus
          text: 嗯，你的确在乡下住过。我刚才还怕你又在编瞎话。现在说吧，你的真名叫什么？
        - id: ch01-b71
          speaker: huck
          text: 我叫乔治·彼得斯，太太。
        - id: ch01-b72
          speaker: judith_loftus
          text: 那就记牢了，乔治。别还没出门又说自己叫亚历山大，等我揭穿，再说全名是乔治·亚历山大。也别穿着这身旧印花布衣服去见女人。你扮姑娘不大像，也许能骗过男人。
        - id: ch01-b73
          speaker: judith_loftus
          text: 记住，穿针时别拿稳线，把针往上凑。该拿稳针，再把线送进针眼。女人差不多都这么做，男人正好相反。你朝耗子扔东西时，要笨手笨脚地踮起脚，把手举到头顶，故意扔偏六七英尺。胳膊得僵直，从肩膀发力，像那里安了根轴。这才像姑娘。男孩子才会把胳膊伸在一旁，用手腕和胳膊肘扔。
        - id: ch01-b74
          speaker: judith_loftus
          text: 还有，姑娘用裙子接东西，会把膝盖分开，绝不会像你接铅块时那样猛地夹紧双腿。其实你穿针时，我就认定你是个男孩子了。后面那些名堂，不过是为了再证实一下。
        - id: ch01-b75
          speaker: judith_loftus
          text: 现在快去找舅舅吧，萨拉·玛丽·威廉斯·乔治·亚历山大·彼得斯。要是惹上麻烦，就给朱迪丝·洛夫特斯太太捎个信，那就是我。我会尽力帮你。一路沿河边走，下回走远路可要带上鞋袜。那条路石头多，我看你到了戈申，两只脚准得吃足苦头。
        - id: ch01-b76
          speaker: huck
          text: 我沿河岸往上走了大约五十码，马上掉头，顺原路悄悄折回独木舟那里。船藏在屋子下游好远的一处。我跳上船，急忙划走。先逆流划到足以抵达岛尖的位置，再转向横渡。我摘下遮阳女帽，这时候可不能让它像眼罩一样挡住视线。
        - id: ch01-b77
          speaker: huck
          text: 到了河心附近，我听见钟开始报时，便停下船来细听。钟声越过水面传来，很轻，却很清楚。十一点。我抵达岛尖时，已经累得上气不接下气，却连喘口气都顾不上。我立刻钻进树林，赶到从前扎营的地方，在一块又高又干的地上生起一大堆火。
        - id: ch01-b78
          speaker: huck
          text: 接着我跳回独木舟，拼命朝下游一英里半外的住处划去。我上了岸，踩着水洼穿过树林，爬上山脊，冲进岩洞。吉姆正躺在地上，睡得死沉。我把他叫醒。
        - id: ch01-b79
          speaker: huck
          text: 快起来，赶紧动手，吉姆！一分钟也不能耽搁。他们来抓咱们了！
        - id: ch01-b80
          speaker: huck
          text: 吉姆没问一个问题，也没说一句话。可接下来半个钟头，他干活的那股劲儿，足以看出他吓成了什么样。忙完时，我们在这世上的全部家当都已经搬上木筏。木筏藏在柳树湾里，也做好了准备，随时都能推出去。我们头一件事，就是把岩洞前的营火彻底扑灭。此后，再没让一点烛光露到洞外。
        - id: ch01-b81
          speaker: huck
          text: 我把独木舟划离岸边一点，朝四周仔细望了望。就算附近真有船，我也看不见，只有星光和阴影，哪里照得清东西。随后，我们把木筏撑出去，藏在暗影里悄悄顺流而下。驶过岛尾时，一点声音都没有。我们谁也没说一句话。
