  chapters:
    - id: ch01
      title: CHAPTER XI.
      blocks:
        - id: ch01-b01
          speaker: judith
          text: Come on in. Take a chair.
        - id: ch01-b02
          speaker: huck
          text: I sat down. The woman studied me all over with her little bright eyes.
        - id: ch01-b03
          speaker: judith
          text: What's your name, dear?
        - id: ch01-b04
          speaker: huck
          text: My name is Sarah Williams.
        - id: ch01-b05
          speaker: judith
          text: Where do you live? Somewhere nearby?
        - id: ch01-b06
          speaker: huck
          text: No, ma'am. I live in Hookerville, seven miles downriver. I walked the whole way, and I'm worn out.
        - id: ch01-b07
          speaker: judith
          text: I expect you're hungry too. Let me find you something.
        - id: ch01-b08
          speaker: huck
          text: No, ma'am. I got so hungry that I stopped at a farm two miles back, so I'm all right now. That's why I'm late. My mother's sick, and she has no money or anything. I came to tell my uncle, Abner Moore. He's supposed to live at the upper end of town. I've never been here before. Do you know him?
        - id: ch01-b09
          speaker: judith
          text: No, but I don't know everybody yet. I've only lived here about two weeks. The upper end of town is a long way off. You'd better stay here tonight. Go ahead and take off your bonnet.
        - id: ch01-b10
          speaker: huck
          text: No, ma'am. I'll rest a bit and then keep going. The dark doesn't scare me.
        - id: ch01-b11
          speaker: huck
          text: She said she wouldn't let me walk there alone. Her husband might be home in an hour and a half, and then he could go along with me. After that, she started talking about him. She told me about all her relations upriver and all the others downriver. They used to be much better off, she said, and now she and her husband wondered if moving to our town had been a mistake. She went on so long that I began to think I'd made a mistake coming there for news.
        - id: ch01-b12
          speaker: huck
          text: Then she got around to Pap and the murder, so I was glad to let her talk. She told how Tom Sawyer and I had found six thousand dollars, though she made it ten thousand. She told what a hard case Pap was, and what a hard life I had. At last she reached the part where I was murdered.
        - id: ch01-b13
          speaker: huck
          text: Who did it? We've heard plenty about all this in Hookerville, but nobody there knows who killed Huck Finn.
        - id: ch01-b14
          speaker: judith
          text: Plenty of people here would like to know that too. Some say old Finn killed the boy himself.
        - id: ch01-b15
          speaker: huck
          text: No! Is that true?
          emotion: surprised
        - id: ch01-b16
          speaker: judith
          text: Nearly everybody thought so at first. He came close to getting lynched, though he'll never know it. By evening, people changed their minds. They decided a runaway slave named Jim had done it.
        - id: ch01-b17
          speaker: huck
          text: Why would he—
        - id: ch01-b18
          speaker: huck
          text: I stopped before I gave myself away. It seemed wiser to keep quiet. The woman never noticed that I'd started to object, and she went right on talking.
        - id: ch01-b19
          speaker: judith
          text: Jim ran away the very night Huck Finn was killed, and there's a three-hundred-dollar reward for him. Old Finn has a two-hundred-dollar reward on him too. He came to town the next morning and told everyone about the murder. He even joined the ferryboat search. Then he suddenly left. Folks wanted to lynch him by evening, but he was already gone.
        - id: ch01-b20
          speaker: judith
          text: The next day, they learned Jim had disappeared too. Nobody had seen him since ten o'clock on the night of the murder, so they blamed him instead. Then old Finn came back while everybody was stirred up. He cried to Judge Thatcher and asked for money to hunt Jim all across Illinois. The judge gave him some. That evening Finn got drunk, stayed out past midnight with two rough-looking strangers, and left with them. He hasn't come back.
        - id: ch01-b21
          speaker: judith
          text: Nobody expects him until things settle down. People think he killed his own boy and made it look like robbers did it. Then he could take Huck's money without a long lawsuit. They say he's bad enough to do it, and sly too. If he stays gone a year, nothing will be left to prove. He can come back when everything is quiet and take the money easy as anything.
        - id: ch01-b22
          speaker: huck
          text: I suppose you're right, ma'am. I don't see what could stop him. Has everybody given up blaming Jim?
        - id: ch01-b23
          speaker: judith
          text: Oh, no. Plenty still think Jim did it. They'll catch him soon, and maybe they can frighten the truth out of him.
        - id: ch01-b24
          speaker: huck
          text: Are they still looking for him?
        - id: ch01-b25
          speaker: judith
          text: My, aren't you innocent! People don't find three hundred dollars lying around every day, ready for anyone to pick up. Some folks think Jim hasn't gone far. I think so myself, though I haven't told people what I suspect.
        - id: ch01-b26
          speaker: judith
          text: A few days ago, an old couple in the log cabin next door mentioned that hardly anybody visits Jackson's Island. I asked if anyone lived there, and they said no. I didn't say more, but I started thinking. A day or two before, I was almost sure I'd seen smoke near the head of that island. Maybe Jim was hiding there. At any rate, the place was worth searching.
        - id: ch01-b27
          speaker: judith
          text: I haven't seen smoke since, so maybe he's gone, if it was him. But my husband is going over with another man. He'd been upriver. He came home two hours ago, and I told him right away.
        - id: ch01-b28
          speaker: huck
          text: I grew so uneasy that I couldn't sit still. I picked up a needle from the table and tried to thread it, just to keep my hands busy. But my hands were shaking, and I couldn't manage it. When the woman stopped talking, I looked up. She was watching me in a curious way, with a little smile.
        - id: ch01-b29
          speaker: huck
          text: I put down the needle and thread and tried to look as if I was only interested in her story. I really was interested too. I needed to know what those men planned to do.
        - id: ch01-b30
          speaker: huck
          text: Three hundred dollars is a lot of money. I wish my mother could get it. Is your husband going to the island tonight?
        - id: ch01-b31
          speaker: judith
          text: Oh, yes. He went into town with that other man to get a boat and borrow another gun if they can. They'll cross over after midnight.
        - id: ch01-b32
          speaker: huck
          text: Wouldn't they see better in daylight?
        - id: ch01-b33
          speaker: judith
          text: Yes, and Jim would see better too. After midnight, he'll probably be asleep. They can move quietly through the woods, and if he has a campfire, it'll be easier to find in the dark.
        - id: ch01-b34
          speaker: huck
          text: I hadn't thought of that.
        - id: ch01-b35
          speaker: huck
          text: She kept giving me those curious looks, and I felt worse every minute. Soon she asked me another question.
        - id: ch01-b36
          speaker: judith
          text: What did you say your name was, honey?
        - id: ch01-b37
          speaker: huck
          text: M-Mary Williams.
        - id: ch01-b38
          speaker: huck
          text: I was pretty sure I'd said Sarah before, so I didn't look up. I felt trapped, and I was afraid my face showed it. I wished she'd start talking again. The longer she stayed quiet, the more nervous I got.
        - id: ch01-b39
          speaker: judith
          text: Honey, didn't you tell me your name was Sarah when you came in?
        - id: ch01-b40
          speaker: huck
          text: Oh, yes, ma'am. It's Sarah Mary Williams. Sarah is my first name. Some people call me Sarah, and some call me Mary.
        - id: ch01-b41
          speaker: judith
          text: Oh, is that how it is?
        - id: ch01-b42
          speaker: huck
          text: Yes, ma'am, that's right.
        - id: ch01-b43
          speaker: huck
          text: I felt a little better, though I still wished I was out of there. I couldn't bring myself to look up yet.
        - id: ch01-b44
          speaker: huck
          text: The woman went back to talking, and after a while I began to relax again. Times were hard, she said. She and her husband had very little, and the rats behaved as if the place belonged to them. That was true. Every little while, one poked its nose from a hole in the corner.
        - id: ch01-b45
          speaker: huck
          text: She kept things close by to throw at them when she was alone. Otherwise, they never left her in peace. She showed me a bar of lead twisted into a knot. Usually she could hit what she aimed at, but she'd hurt her arm a day or two earlier and wasn't sure she could throw straight. When a rat appeared, she hurled the lead and missed it by a long way.
        - id: ch01-b46
          speaker: judith
          text: Ouch, that hurt my arm!
        - id: ch01-b47
          speaker: huck
          text: The throw hurt her arm, so she told me to try the next one. I wanted to leave before her husband returned, but I didn't let her see that. I took the lead and waited. When another rat showed its nose, I let fly. If it had stayed where it was, that rat would've been badly hurt.
        - id: ch01-b48
          speaker: judith
          text: That was mighty good. I reckon you'll get the next one.
        - id: ch01-b49
          speaker: huck
          text: She fetched the lead and came back with a hank of yarn. She wanted my help winding it. I held up both hands, she slipped the yarn over them, and she went on talking about her husband and herself. Then she broke off.
        - id: ch01-b50
          speaker: judith
          text: Watch those rats. Keep the lead right there in your lap, ready to throw.
        - id: ch01-b51
          speaker: huck
          text: She dropped it into my lap. I snapped my knees together to catch it, and she kept talking. But only for a minute. Then she lifted off the yarn, looked straight into my face, and spoke as pleasantly as could be.
        - id: ch01-b52
          speaker: judith
          text: Now then, what's your real name?
        - id: ch01-b53
          speaker: huck
          text: Wh-what do you mean, ma'am?
        - id: ch01-b54
          speaker: judith
          text: What's your real name? Bill? Tom? Bob? What is it?
        - id: ch01-b55
          speaker: huck
          text: I shook like a leaf and hardly knew what to do.
        - id: ch01-b56
          speaker: huck
          text: Please don't make fun of a poor girl, ma'am. If I'm in your way, I'll—
          emotion: fearful
        - id: ch01-b57
          speaker: judith
          text: No, you won't. Sit down and stay there. I won't hurt you, and I won't tell on you. Just trust me with your secret. I'll keep it, and I'll help you. My husband will too, if you want. You're a runaway apprentice, that's all. There's no harm in that. Somebody treated you badly, so you decided to escape. Bless you, child, I won't tell. Go on and tell me everything. You're a good boy.
          emotion: calm
        - id: ch01-b58
          speaker: huck
          text: I knew there was no use pretending anymore. I said I'd make a clean breast of everything, as long as she didn't break her promise. Then I made up another story. My parents were dead, I said, and the law had sent me to work for a mean old farmer in the country, thirty miles back from the river. He treated me so badly that I couldn't stand it any longer. When he went away for two days, I saw my chance. I stole some old clothes from his daughter and ran.
        - id: ch01-b59
          speaker: huck
          text: It had taken me three nights to cover those thirty miles. I traveled after dark, then hid and slept in the daytime. I'd brought a bag of bread and meat from the farm. There was plenty, and it lasted the whole trip. I believed my uncle Abner Moore would take care of me, so I'd set out for the town of Goshen.
        - id: ch01-b60
          speaker: judith
          text: Goshen? Child, this isn't Goshen. This is St. Petersburg. Goshen is ten miles farther upriver. Who told you that you were in Goshen?
        - id: ch01-b61
          speaker: huck
          text: A man I met around daybreak, just as I was about to go into the woods for my usual sleep. He said to take the right fork in the road, and five miles would bring me to Goshen.
        - id: ch01-b62
          speaker: judith
          text: He must've been drunk. He sent you exactly the wrong way.
        - id: ch01-b63
          speaker: huck
          text: He did act drunk, but it doesn't matter now. I need to get moving. I can reach Goshen before daylight.
        - id: ch01-b64
          speaker: judith
          text: Wait a minute. I'll pack you something to eat. You might need it.
        - id: ch01-b65
          speaker: huck
          text: She made me a snack. Then she began firing questions at me.
        - id: ch01-b66
          speaker: judith
          text: When a cow is lying down, which end gets up first? Answer quickly. Don't stop and think.
        - id: ch01-b67
          speaker: huck
          text: The hind end, ma'am.
        - id: ch01-b68
          speaker: judith
          text: And a horse?
        - id: ch01-b69
          speaker: huck
          text: The front end, ma'am.
        - id: ch01-b70
          speaker: judith
          text: Which side of a tree does moss grow on?
        - id: ch01-b71
          speaker: huck
          text: Moss grows on the north side.
        - id: ch01-b72
          speaker: judith
          text: If fifteen cows are grazing on a hillside, how many have their heads pointing the same way?
        - id: ch01-b73
          speaker: huck
          text: All fifteen cows do, ma'am.
        - id: ch01-b74
          speaker: judith
          text: Well, I believe you really have lived in the country. I thought you might be fooling me again. Now, what's your real name?
        - id: ch01-b75
          speaker: huck
          text: My real name is George Peters, ma'am.
        - id: ch01-b76
          speaker: judith
          text: Then remember it, George. Don't call yourself Alexander before you leave, then claim you're George Alexander when I catch you. And don't visit women wearing that old calico dress. You don't make a very convincing girl, though you might fool a man.
        - id: ch01-b77
          speaker: judith
          text: When you thread a needle, hold the needle still and push the thread toward it. That's how a woman usually does it. A man holds the thread still and brings the needle to it, like you did.
        - id: ch01-b78
          speaker: judith
          text: And when you throw at a rat, rise onto your toes, lift your hand awkwardly over your head, and miss by six or seven feet. Keep your arm stiff and throw from the shoulder, the way a girl would. Don't throw from the wrist and elbow with your arm out to one side, like a boy.
        - id: ch01-b79
          speaker: judith
          text: One more thing. A girl trying to catch something in her lap spreads her knees apart. She doesn't clap them together the way you did with that lead. I first took you for a boy when you threaded the needle. The other tests only made me sure.
        - id: ch01-b80
          speaker: judith
          text: Off you go to your uncle, Sarah Mary Williams George Alexander Peters. If you get into trouble, send word to Mrs. Judith Loftus. That's me. I'll do what I can to help you. Stay on the river road, and next time you travel, bring shoes and socks. That road is rocky, and your feet will be in a sorry state by the time you reach Goshen.
        - id: ch01-b81
          speaker: huck
          text: I walked about fifty yards up the bank. Then I doubled back and slipped down to my canoe, which I'd hidden well below the house. I jumped in right away and hurried off. I paddled upstream far enough to reach the head of the island, then turned across the river. I pulled off the sunbonnet. I didn't need anything blocking my sight now.
        - id: ch01-b82
          speaker: huck
          text: Around the middle of the river, I heard the town clock begin to strike. I stopped paddling and listened. The sound came faint but clear across the water. It was eleven o'clock.
        - id: ch01-b83
          speaker: huck
          text: When I reached the head of the island, I was almost out of breath, but I didn't stop. I pushed into the trees where my old camp had been and built a good fire on a high, dry spot.
        - id: ch01-b84
          speaker: huck
          text: Then I jumped back into the canoe and paddled as hard as I could for our place, a mile and a half down the island. I landed, splashed through the woods, climbed the ridge, and rushed into the cave. Jim was sound asleep on the ground. I woke him.
        - id: ch01-b85
          speaker: huck
          text: Get up and move, Jim! We don't have a minute to lose. They're coming after us!
          emotion: fearful
        - id: ch01-b86
          speaker: huck
          text: Jim didn't ask a question or say a word. But the way he worked for the next half hour showed how frightened he was. By then, everything we owned was loaded onto the raft. It was ready to leave the willow cove where we'd hidden it.
        - id: ch01-b87
          speaker: huck
          text: First, we put out the fire at the cave. After that, we didn't show even a candle outside.
        - id: ch01-b88
          speaker: huck
          text: I took the canoe a little way from shore and looked around. If any boat was nearby, I couldn't see it. Stars and shadows don't give you much light.
        - id: ch01-b89
          speaker: huck
          text: Then we eased the raft out and drifted down through the darkness along the shore. We passed the foot of the island without making a sound. Neither of us spoke a word.
