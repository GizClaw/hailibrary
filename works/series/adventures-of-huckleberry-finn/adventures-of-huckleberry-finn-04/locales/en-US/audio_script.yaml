  chapters:
    - id: ch01
      title: CHAPTER IV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Three or four months went by, and winter set in. I went to school nearly all the time. I learned to spell and read and write a little. I could say the multiplication table as far as six times seven is thirty-five, and I reckoned I could live forever without getting any farther. I never did think much of mathematics.
        - id: ch01-b02
          speaker: huck
          text: I hated school at first, but after a while I could put up with it. Whenever I got especially tired of it, I played hooky. The hiding I got the next day cheered me right up. The longer I kept going, the easier school became.
        - id: ch01-b03
          speaker: huck
          text: I was getting used to the widow's ways, too, and they didn't scrape against me so badly anymore. Living in a house and sleeping in a bed still felt mighty tight. Before the cold weather came, I would slip out and sleep in the woods sometimes, just to get a rest. I liked the old ways best, but I was starting to like the new ones a little. The widow said I was coming along slowly but surely. She was satisfied, and she wasn't ashamed of me.
        - id: ch01-b04
          speaker: huck
          text: One morning at breakfast, I knocked over the saltcellar. I reached for the salt fast, meaning to throw some over my left shoulder and stop the bad luck. But Miss Watson caught me first.
        - id: ch01-b05
          speaker: miss_watson
          text: Take your hands away, Huckleberry. You're forever making a mess!
          emotion: angry
        - id: ch01-b06
          speaker: huck
          text: The widow spoke up for me, but I knew that wouldn't hold back the bad luck. After breakfast I went out worried and shaky. I kept wondering what would happen and when it would strike. You can guard against some kinds of bad luck, but not this kind. There was nothing to do but move along feeling low and keep watch.
        - id: ch01-b07
          speaker: huck
          text: I went down to the front garden and climbed over the stile in the high board fence. An inch of new snow covered the ground, and somebody had left tracks in it. They came up from the quarry, stopped around the stile for a while, then continued along the garden fence. Why would somebody stand there and not come in? I couldn't make sense of it.
        - id: ch01-b08
          speaker: huck
          text: I meant to follow the tracks, but first I bent down for a closer look. At first I saw nothing strange. Then I spotted it. Big nails made a cross in the heel of the left boot. That cross was meant to keep off the devil.
        - id: ch01-b09
          speaker: huck
          text: I jumped up and tore down the hill. I kept looking behind me, but nobody was there. I ran all the way to Judge Thatcher's and arrived out of breath.
        - id: ch01-b10
          speaker: judge_thatcher
          text: Why, my boy, you're quite winded. Have you come to collect your interest?
        - id: ch01-b11
          speaker: huck
          text: No, sir. Is there some waiting for me?
        - id: ch01-b12
          speaker: judge_thatcher
          text: Yes. Your half-yearly payment arrived last night. It's more than a hundred and fifty dollars. That's quite a fortune for you. You'd better let me invest it with your six thousand, or you'll spend it if you take it.
        - id: ch01-b13
          speaker: huck
          text: No, sir. I don't aim to spend it. I don't want that money, or the six thousand either. I want you to take all of it. I'm giving it to you.
        - id: ch01-b14
          speaker: huck
          text: The judge stared at me. He couldn't figure out what I meant.
        - id: ch01-b15
          speaker: judge_thatcher
          text: What in the world do you mean, my boy?
          emotion: surprised
        - id: ch01-b16
          speaker: huck
          text: Please don't ask me about it. You'll take the money, won't you?
        - id: ch01-b17
          speaker: judge_thatcher
          text: I confess I'm puzzled. Has something gone wrong?
        - id: ch01-b18
          speaker: huck
          text: Just take it, please, and don't ask me anything. Then I won't have to tell any lies.
        - id: ch01-b19
          speaker: huck
          text: He thought for a while. Then an idea came to him.
        - id: ch01-b20
          speaker: judge_thatcher
          text: Oh, I believe I understand. You mean to sell me all your property, not give it away. Yes, that's the proper way to arrange it.
        - id: ch01-b21
          speaker: huck
          text: He wrote something on a sheet of paper and read it back to me.
        - id: ch01-b22
          speaker: judge_thatcher
          text: There. It says, “for a consideration.” That means I've bought your property and paid for it. Here's one dollar. Now put your name on the paper.
        - id: ch01-b23
          speaker: huck
          text: I signed it and went away.
        - id: ch01-b24
          speaker: huck
          text: Jim, who belonged to Miss Watson, had a hair ball as big as my fist. It had come out of an ox's fourth stomach, and Jim used it for magic. He said a spirit lived inside it and knew everything.
        - id: ch01-b25
          speaker: huck
          text: That night I went to Jim. I told him Pap had come back, because I'd found his tracks in the snow. I wanted to know what Pap meant to do and whether he planned to stay.
        - id: ch01-b26
          speaker: huck
          text: Jim took out the hair ball and spoke some words over it. Then he lifted it and dropped it on the floor. It landed with a solid thump and rolled only about an inch. He tried twice more, but it did the same thing each time. Jim knelt down, pressed his ear to it, and listened. It was no use.
        - id: ch01-b27
          speaker: jim
          text: It won't talk. Sometimes it won't say a thing unless it gets money first.
        - id: ch01-b28
          speaker: huck
          text: I told him I had an old counterfeit quarter. It was worn smooth and no good. A little brass showed through the silver, and even without that, it felt so greasy that nobody would take it. I didn't mention the dollar the judge had given me. The quarter was bad money, but maybe the hair ball couldn't tell the difference.
        - id: ch01-b29
          speaker: huck
          text: Jim smelled the coin, bit it, and rubbed it. He said he could fool the hair ball into thinking it was good.
        - id: ch01-b30
          speaker: jim
          text: I'll cut a raw Irish potato open and put this quarter inside it overnight. By morning, the brass won't show and the coin won't feel greasy. Anybody in town would take it then, and this hair ball surely will.
        - id: ch01-b31
          speaker: huck
          text: I had known a potato could do that, but I'd forgotten. Jim placed the quarter under the hair ball, knelt down, and listened once more. This time, he said it was ready to speak. It would tell my whole fortune if I wanted. I told him to go ahead. The hair ball spoke to Jim, and Jim passed the words on to me.
        - id: ch01-b32
          speaker: jim
          text: Your old father doesn't know what he's going to do yet. One minute he thinks he'll leave, and the next he thinks he'll stay. Best thing is to rest easy and let the old man choose his own way.
        - id: ch01-b33
          speaker: jim
          text: Two angels are hovering around him. One is white and shining, and the other one is black. The white one gets him going right for a little while. Then the black one rushes in and ruins it all. Nobody can tell which angel will have him in the end.
        - id: ch01-b34
          speaker: jim
          text: But you're going to be all right. You'll have plenty of trouble in your life and plenty of joy. Sometimes you'll get hurt, and sometimes you'll fall sick. Every time, though, you'll get well again.
        - id: ch01-b35
          speaker: jim
          text: Two girls will be moving through your life. One is light and the other is dark. One is rich and the other is poor. First you'll marry the poor one, and later you'll marry the rich one.
        - id: ch01-b36
          speaker: jim
          text: Keep away from the water as much as you can, and don't take any risks. It's written in the signs that you're going to be hanged.
        - id: ch01-b37
          speaker: huck
          text: That night I lit my candle and went up to my room. Pap was sitting there in person.
