audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    miss_watson:
      display_name: 老沃森小姐
      tts:
        delivery: 严厉挑剔，说话不容反驳
        timbre: 坚实清亮
        pace: 明快
        pitch: 中高
    judge_thatcher:
      display_name: 撒切尔法官
      tts:
        delivery: 稳重有礼，思路缜密
        timbre: 成熟浑厚
        pace: 适中
        pitch: 中低
    jim:
      display_name: 吉姆
      tts:
        delivery: 谨慎而生动，带着深信预兆的郑重
        timbre: 低沉富有共鸣
        pace: 不紧不慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 三四个月一晃就过去了，冬天也深了。我几乎天天上学，学会了一点拼字、读书和写字。乘法表能背到六七三十五，再往后嘛，就算活一辈子也够呛。反正我不大信算术。
        - id: ch01-b02
          speaker: huck
          text: 我一开始恨透了学堂，后来慢慢也就忍得住了。哪天实在烦得不得了，我就逃一天学。第二天虽然会挨上一顿狠揍，可那顿揍打完，我反倒又精神起来，心情也好了。就这样，上学的日子越久，这事也就越容易。
        - id: ch01-b03
          speaker: huck
          text: 我也渐渐习惯了寡妇的规矩，不再觉得事事都那么磨人。可住在房子里，睡在床上，大多数时候还是勒得我难受。天冷以前，我偶尔溜出去，在林子里睡上一觉，这才算歇了口气。我仍然最爱从前的过法，不过新过法也有一点叫我喜欢了。寡妇说我进步得慢，可一直在进步。她对我的表现很满意，也不觉得我给她丢脸。
        - id: ch01-b04
          speaker: huck
          text: 一天早饭时，我碰翻了盐罐。我赶紧想抓一把盐撒过左肩，好挡住霉运，可老沃森小姐先拦住了我。
        - id: ch01-b05
          speaker: miss_watson
          text: 把手拿开，哈克贝利！你怎么总把东西弄得一团糟！
          emotion: angry
        - id: ch01-b06
          speaker: huck
          text: 寡妇替我说了好话，可我清楚得很，那些好话挡不住霉运。早饭后，我心里又慌又不踏实，一路猜它会在什么时候落到我头上，又会是什么样的霉运。有些霉运有法子躲，可这一种没有。我什么也做不了，只好垂头丧气地慢慢走，随时留神。
        - id: ch01-b07
          speaker: huck
          text: 我下到前花园，爬过高木板围墙入口处的跨栏。地上的新雪有一英寸厚，上面印着一串脚印。它们从采石场方向上来，在跨栏边待了一阵，又绕着花园围墙走了。那人既然已经到了这里，为什么不进来？我怎么也想不通，只觉得这事越来越可疑。
        - id: ch01-b08
          speaker: huck
          text: 我本想追上去，又先蹲下细看。起初没发现什么，接着就看见了。左脚靴跟上，大钉子钉出了一个防魔鬼的十字。
        - id: ch01-b09
          speaker: huck
          text: 我马上跳起来，一溜烟往山下飞奔。我隔一会儿就回头看看，却一个人也没看见。我一口气跑到撒切尔法官家，累得上气不接下气。
        - id: ch01-b10
          speaker: judge_thatcher
          text: 哎呀，孩子，你怎么喘成这样？是来拿利息的吗？
        - id: ch01-b11
          speaker: huck
          text: 不是，先生。我有利息可拿吗？
        - id: ch01-b12
          speaker: judge_thatcher
          text: 有。半年一结的利息昨晚到了，足有一百五十多块。这对你可是一大笔财产。还是跟那六千块放在一起，让我替你生利吧。你自己拿走，会花掉的。
        - id: ch01-b13
          speaker: huck
          text: 不，先生。我不想花，也根本不想要。那六千块我也不要。我要把所有钱都给你。
        - id: ch01-b14
          speaker: narrator
          text: 法官惊讶地看着他，完全弄不明白。
        - id: ch01-b15
          speaker: judge_thatcher
          text: 孩子，你这究竟是什么意思？
          emotion: surprised
        - id: ch01-b16
          speaker: huck
          text: 求你别问。你会收下的，对吧？
        - id: ch01-b17
          speaker: judge_thatcher
          text: 这可真叫我糊涂了。是不是出了什么事？
        - id: ch01-b18
          speaker: huck
          text: 求你收下，什么也别问。这样我就不用撒谎了。
        - id: ch01-b19
          speaker: narrator
          text: 法官想了一会儿，终于明白了。他说，哈克是要把所有财产卖给他，不是白送，这样才对。接着，他在纸上写好字据，又从头到尾念了一遍。
        - id: ch01-b20
          speaker: judge_thatcher
          text: 你看，上面写着“以有价对价为换”。这就表明我买了你的财产，也付了钱。这一块钱给你。现在签字吧。
        - id: ch01-b21
          speaker: huck
          text: 我照他说的签了字，收下那一块钱，然后就离开了。
        - id: ch01-b22
          speaker: huck
          text: 老沃森小姐家的黑人吉姆有一个拳头大的毛球，是从牛的第四个胃里取出来的。他常用它变法术，说球里住着一个精灵，世上的事什么都知道。那天晚上，我去找吉姆，告诉他爸爸又来了，因为我在雪里看见了他的脚印。我想让毛球告诉我，爸爸打算干什么，还会不会留下。
        - id: ch01-b23
          speaker: narrator
          text: 吉姆取出毛球，对着它念叨几句，然后把它举起来，丢到地上。它沉沉落下，只滚了一英寸。他连试三次，每次都一样。他又跪下来，把耳朵贴在毛球上仔细听，可这一招也没用，毛球就是不肯说话。
        - id: ch01-b24
          speaker: jim
          text: 它有时候非要见到钱，才肯开口。
        - id: ch01-b25
          speaker: huck
          text: 我有一枚旧的二角五分假银币。银层磨掉一点，露出了里面的黄铜，当然花不出去。其实没露黄铜也不行，因为银币磨得太光，摸着油滑滑的，谁一摸就知道不对。至于法官给的那一块钱，我可没打算告诉吉姆。这枚假银币虽然糟糕，毛球也许分不出真假，说不定肯收。
        - id: ch01-b26
          speaker: narrator
          text: 吉姆闻了闻银币，咬了一口，又拿在手里撮了撮。他说，他有法子叫毛球把它当成真钱。只要切开一个生爱尔兰马铃薯，把银币夹在中间放一整夜，第二天就看不见黄铜，摸不出油滑了。到时候，镇上任何人都会马上收下它，更别说一个毛球。这办法哈克原本知道，只是一时忘了。
        - id: ch01-b27
          speaker: narrator
          text: 吉姆把二角五分的银币垫在毛球下，又跪下去听。这一回，他说毛球已经满意了。只要哈克想听，它愿意把他一辈子的命都算出来。哈克让它往下说，毛球便把话告诉吉姆，再由吉姆一句句转告他。
        - id: ch01-b28
          speaker: jim
          text: 你那老爹还没想定呢。一会儿寻思要走，一会儿又寻思要留。最好放宽心，由着那老头子自己选路走。他身边飘着两个天使，一个白得发亮，一个漆黑。白的能领他走一阵正路，可黑的一扑上来，一下就把一切都搅坏了。现在还没人能说得准，到最后究竟哪一个会把他领走。
        - id: ch01-b29
          speaker: jim
          text: 你倒不要紧。这辈子你会碰上不少麻烦，也会遇到不少喜事。你有时受伤，有时生病，可每回都能好起来。你身边会有两个姑娘，一个肤色浅，一个肤色深，一个有钱，一个穷。你先娶穷的，往后再娶有钱的。
        - id: ch01-b30
          speaker: jim
          text: 你得尽量离水远些，也别冒险。因为命数上写着，你最后要被人吊死。
        - id: ch01-b31
          speaker: huck
          text: 那天晚上，我点亮蜡烛，回到自己的房间。爸爸本人就坐在那里！
