audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    widow_douglas:
      display_name: 道格拉斯寡妇
      tts:
        delivery: 端庄和善，说话温和却不容商量
        timbre: 成熟温暖
        pace: 稳健
        pitch: 中
    miss_watson:
      display_name: 沃森小姐
      tts:
        delivery: 严厉精细，习惯随时纠正别人
        timbre: 清瘦脆亮
        pace: 不疾不徐
        pitch: 中高
    tom_sawyer:
      display_name: 汤姆·索亚
      tts:
        delivery: 自信大胆，满脑子冒险主意
        timbre: 明亮稚气
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要是你没读过《汤姆·索亚历险记》，大概就不知道我是谁。不过没读也不要紧。那本书是马克·吐温先生写的，他讲的事情大多是真的，只有些地方扯大了一点儿。
        - id: ch01-b02
          speaker: narrator
          text: 这也没什么稀奇。我就没见过谁从来不撒谎，除非波莉姨妈、道格拉斯寡妇，也许还有玛丽。波莉姨妈是汤姆的姨妈。她们三个人的事，前一本书里都有。总之，那书大体可信，只掺了几句瞎话。
        - id: ch01-b03
          speaker: narrator
          text: 前一本书结尾的时候，汤姆和我在山洞里找到了强盗埋的钱。我们一人分了六千美元，还是清一色的金子。那一大堆钱摆在眼前，真能把人吓一跳。
        - id: ch01-b04
          speaker: narrator
          text: 撒切尔法官替我们把钱拿去放债收利息。从那以后，一年三百六十五天，我们每个人每天都有一美元。钱多到这个份上，谁知道该往哪儿花？
        - id: ch01-b05
          speaker: narrator
          text: 道格拉斯寡妇收我做儿子，还打算把我教成文明人。可是她家里的日子太难过了。她做什么都讲规矩、讲体面，还总是死气沉沉。我实在熬不下去，就溜走了。
        - id: ch01-b06
          speaker: narrator
          text: 我换回从前那身破衣裳，又钻进自己的糖桶，终于自由自在了。可汤姆·索亚还是把我找了出来。
        - id: ch01-b07
          speaker: tom_sawyer
          text: 哈克，我要拉起一帮强盗。你想入伙，就得回到寡妇家去，先做个体面人。
        - id: ch01-b08
          speaker: narrator
          text: 为了加入汤姆的强盗帮，我只好又回去了。
        - id: ch01-b09
          speaker: narrator
          text: 寡妇一见我就哭了。她叫我“可怜的迷途小羊羔”，还送了我不少别的称呼，不过都没有恶意。接着，她又让我套上那身新衣服。我热得汗流个不停，身子也给箍得紧紧的。
        - id: ch01-b10
          speaker: narrator
          text: 从前那套日子马上又开始了。晚饭铃一响，人就非得准点儿到桌边。坐下还不能吃，得先等寡妇低着头，对饭菜嘟囔一阵。其实饭菜没坏，只是每样东西都单独烧，互不挨着。
        - id: ch01-b11
          speaker: narrator
          text: 我倒觉得，还是杂物桶里的东西好。这个和那个混在一起，各样汤汁来回串味，吃着才香。
        - id: ch01-b12
          speaker: narrator
          text: 吃过晚饭，寡妇翻开书，给我讲摩西和蒲草丛。我听得心急火燎，只想赶快知道他的全部故事。后来她才透露，摩西早就死了，而且死了很久。我立刻不想听了。死人，我可不关心。
        - id: ch01-b13
          speaker: narrator
          text: 过了一会儿，我想抽烟，就去问寡妇肯不肯。
        - id: ch01-b14
          speaker: widow_douglas
          text: 不行，哈克贝利。抽烟既下贱又不干净，你以后得努力把它戒掉。
        - id: ch01-b15
          speaker: narrator
          text: 有些人就是这么办事。自己对一件事一窍不通，偏偏先说它不好。寡妇替摩西操了那么多心，可他又不是她的亲戚，人也早没了，根本帮不了谁。轮到我做一件多少还有点儿好处的事，她却处处挑错。
        - id: ch01-b16
          speaker: narrator
          text: 更有意思的是，她自己还吸鼻烟。当然，她做这件事就全对，因为做的人是她嘛。
        - id: ch01-b17
          speaker: narrator
          text: 寡妇的妹妹沃森小姐刚搬进来。她是个挺瘦的老姑娘，鼻梁上架着眼镜。她拿拼字课本逼我念了一个钟头，直到寡妇开口，她才肯放松一点儿。要是再念下去，我准受不了。
        - id: ch01-b18
          speaker: narrator
          text: 后来那一个钟头更是闷得要命，我怎么坐也坐不安稳。沃森小姐的嘴一直没停。
        - id: ch01-b19
          speaker: miss_watson
          text: 哈克贝利，把脚从那上面拿下来。
        - id: ch01-b20
          speaker: miss_watson
          text: 别缩着身子，给我坐直了。
        - id: ch01-b21
          speaker: miss_watson
          text: 哈克贝利，不许又打哈欠又伸懒腰。你就不能守点规矩吗？
        - id: ch01-b22
          speaker: narrator
          text: 说完这些，她又给我讲那个坏地方。我告诉她，我真希望自己已经在那儿。她一下子生了气，其实我一点儿恶意也没有。我只是想离开眼下这个地方，随便去哪儿换一换都行。
        - id: ch01-b23
          speaker: miss_watson
          text: 这种话太邪恶了。就算拿全世界来换，我也不会这么说。我要好好做人，将来去那个好地方。
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: 我看不出跟她去同一个地方有什么好处，所以决定不去争取。不过这话我藏在心里，免得白白惹出麻烦。
        - id: ch01-b25
          speaker: narrator
          text: 沃森小姐讲上了瘾，又说起那个好地方。照她的说法，人到了那里，整天抱着竖琴走来走去，还得永远唱个不停。我觉得没什么意思，也没有告诉她，只问了另一个问题。
        - id: ch01-b26
          speaker: huck
          text: 你觉得汤姆·索亚能去那里吗？
        - id: ch01-b27
          speaker: miss_watson
          text: 他还差得远呢。
        - id: ch01-b28
          speaker: narrator
          text: 这个回答倒让我很高兴。我还想和汤姆待在一块儿呢。
        - id: ch01-b29
          speaker: narrator
          text: 沃森小姐继续数落个没完，我越来越厌烦，也越来越孤单。后来，她们把家里的黑奴们叫来一起祷告。祷告完，大家便各自睡觉去了。
        - id: ch01-b30
          speaker: narrator
          text: 我拿着一截蜡烛上楼，把它放到房里的桌上，又在窗边坐下。我努力想些高兴的事，可一点儿用也没有。那一刻，我孤单得几乎觉得死了更好。
        - id: ch01-b31
          speaker: narrator
          text: 窗外星光闪烁，树林里的叶子却沙沙响得好凄凉。远处有猫头鹰呜呜地叫，像在报谁已经死了。夜鹰和狗也跟着哀号，像在预告另一个人快要死去。
        - id: ch01-b32
          speaker: narrator
          text: 风贴着四周低声说话，我偏偏听不懂它说什么，冷意便一阵阵爬过全身。树林深处还有一种怪声，仿佛一个鬼心里憋着话，却怎么也不能让人明白。
        - id: ch01-b33
          speaker: narrator
          text: 那样的鬼躺在坟里也不安生，只好每天夜里出来游荡，独自悲号。想到这里，我又害怕又丧气，真希望能有个人陪着。
        - id: ch01-b34
          speaker: narrator
          text: 忽然，一只蜘蛛爬上了我的肩。我随手一弹，它掉进烛火，转眼就烧缩成一团。我马上知道这是个可怕的凶兆，晦气一定要来了。我吓得浑身乱抖，衣服都快给抖掉了。
        - id: ch01-b35
          speaker: narrator
          text: 我连忙站起来，在原地转了三圈，每转一次就在胸前画个十字。接着，我用线扎住一小绺头发，想防住巫婆。可自己也觉得这办法靠不住。
        - id: ch01-b36
          speaker: narrator
          text: 那个法子本来是这么用的：你捡到一只马蹄铁，却没有钉在门上，后来又把它弄丢了，这才扎头发。至于杀死蜘蛛以后能不能靠它挡晦气，我从来没听人说过。
        - id: ch01-b37
          speaker: narrator
          text: 我浑身发着抖，重新坐下来，掏出烟斗。整座屋子已经静得跟死了一样，寡妇发现不了我在抽烟。
        - id: ch01-b38
          speaker: narrator
          text: 不知过了多久，远处镇上的钟响了起来。咚，咚，咚，一共十二下。钟声停住以后，四下比先前还要安静。
        - id: ch01-b39
          speaker: narrator
          text: 没一会儿，黑暗的树林里“啪”地断了一根树枝。有东西正在活动。我屏住气坐着，仔细听，终于听见下面传来一声很轻的猫叫。
        - id: ch01-b40
          speaker: tom_sawyer
          text: 喵——呜！喵——呜！
        - id: ch01-b41
          speaker: narrator
          text: 这声音来得正好。我把嗓子压得不能再低，也回了过去。
        - id: ch01-b42
          speaker: huck
          text: 喵——呜！喵——呜！
        - id: ch01-b43
          speaker: narrator
          text: 我吹灭蜡烛，从窗口爬上外面的棚顶，再悄悄滑到地面，钻进树林。汤姆·索亚果然等在那里。
