audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: dry and mock-official
        timbre: clear and warm
        pace: measured
        pitch: medium
    huck:
      display_name: Huckleberry Finn
      tts:
        delivery: candid and wry, with an easygoing backwoods manner
        timbre: youthful and lightly rough
        pace: conversational
        pitch: medium
    widow_douglas:
      display_name: Widow Douglas
      tts:
        delivery: proper, kindly, and gently insistent
        timbre: mature and warm
        pace: measured
        pitch: medium
    miss_watson:
      display_name: Miss Watson
      tts:
        delivery: stern, precise, and habitually corrective
        timbre: thin and crisp
        pace: deliberate
        pitch: medium-high
    tom_sawyer:
      display_name: Tom Sawyer
      tts:
        delivery: confident, adventurous, and persuasive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER I.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: You won't know me unless you've read a book called The Adventures of Tom Sawyer, but that doesn't matter. Mr. Mark Twain made that book, and mostly he told the truth. He stretched some things, but mostly it was true. That's nothing unusual. I never knew anybody who didn't lie once in a while, except maybe Aunt Polly, or the widow, or Mary. Aunt Polly is Tom's aunt. She and Mary and the Widow Douglas are all in that other book. Like I said, it's mostly true, with a few stretchers.
        - id: ch01-b02
          speaker: narrator
          text: Here's how that book ended. Tom and I found the money the robbers had hidden in the cave, so we got rich. We each got six thousand dollars, all in gold. You should've seen that heap of money. Judge Thatcher took it and put it out at interest. After that, it brought each of us a dollar every day, all year long. That was more money than a person could figure out how to spend.
        - id: ch01-b03
          speaker: narrator
          text: The Widow Douglas took me in as her son and said she'd civilize me. But living in her house all the time was hard. Everything she did was so regular and proper and gloomy that I finally couldn't stand it. I ran off, put on my old rags, climbed back into my sugar barrel, and felt free and satisfied again.
        - id: ch01-b04
          speaker: narrator
          text: Then Tom Sawyer tracked me down.
        - id: ch01-b05
          speaker: tom_sawyer
          text: I'm starting a band of robbers. You can join, Huck, but only if you go back to the widow and act respectable.
        - id: ch01-b06
          speaker: narrator
          text: So I went back.
        - id: ch01-b07
          speaker: narrator
          text: The widow cried over me. She called me her poor lost lamb and plenty of other names too, though she meant no harm. Then she put me into those new clothes again. All I could do was sweat and sweat and feel squeezed in tight.
        - id: ch01-b08
          speaker: narrator
          text: Then the old routine started right back up. The widow rang a bell at supper, and you had to show up exactly on time. Once you sat down, you couldn't start eating. First you had to wait while she lowered her head and grumbled a little over the food, even though there wasn't anything wrong with it.
        - id: ch01-b09
          speaker: narrator
          text: Well, there was one thing wrong. Every kind of food was cooked by itself. It's better with a barrel full of odds and ends. Everything gets mixed together, the juices swap around, and the whole lot tastes better.
        - id: ch01-b10
          speaker: narrator
          text: After supper, the widow brought out her book and taught me about Moses and the bulrushes. I was sweating to hear everything about him. Then, after a while, she admitted he'd been dead for a mighty long time. Right then I quit caring. I don't take much interest in dead people.
        - id: ch01-b11
          speaker: narrator
          text: Pretty soon I wanted a smoke, so I asked the widow if I could have one.
        - id: ch01-b12
          speaker: widow_douglas
          text: No, Huckleberry. Smoking is a nasty, unclean habit. You must try to give it up.
        - id: ch01-b13
          speaker: narrator
          text: That's the way some people are. They'll condemn a thing when they don't know anything about it. There she was, fussing over Moses, who wasn't related to her and couldn't do anybody any good now that he was gone. At the same time, she found all kinds of fault with me for doing something that did have some good in it. And she took snuff herself. Of course that was all right, because she was the one doing it.
        - id: ch01-b14
          speaker: narrator
          text: Her sister, Miss Watson, had just come to live with her. She was a fairly thin old maid who wore spectacles. She sat me down with a spelling book and worked me pretty hard for about an hour. Then the widow made her let up. I couldn't have stood much more.
        - id: ch01-b15
          speaker: narrator
          text: The next hour was deadly dull, and I couldn't keep still.
        - id: ch01-b16
          speaker: miss_watson
          text: Huckleberry, take your feet down from there.
        - id: ch01-b17
          speaker: miss_watson
          text: And don't hunch yourself up that way. Sit up straight.
        - id: ch01-b18
          speaker: miss_watson
          text: Stop yawning and stretching, Huckleberry. Why can't you try to behave?
        - id: ch01-b19
          speaker: narrator
          text: Then she told me all about the bad place.
        - id: ch01-b20
          speaker: huck
          text: I wish I was there.
        - id: ch01-b21
          speaker: narrator
          text: That made her angry, though I hadn't meant any harm. I only wanted to go somewhere. Any change would do. I wasn't particular about where.
        - id: ch01-b22
          speaker: miss_watson
          text: That is a wicked thing to say. I wouldn't say such a thing for the whole world. I mean to live right, so I can go to the good place.
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: I couldn't see any advantage in going where she planned to go, so I decided I wouldn't try for it. I kept that to myself, though. Saying it would only make trouble and wouldn't do any good.
        - id: ch01-b24
          speaker: narrator
          text: Once Miss Watson got started, she kept on telling me about the good place. She said a person did nothing there but walk around all day with a harp and sing forever and ever. It didn't sound like much to me, but I didn't tell her that either. Instead, I asked her a question.
        - id: ch01-b25
          speaker: huck
          text: Do you reckon Tom Sawyer will go there?
        - id: ch01-b26
          speaker: miss_watson
          text: Not by a long way.
        - id: ch01-b27
          speaker: narrator
          text: I was glad to hear that. I wanted Tom and me to be together.
        - id: ch01-b28
          speaker: narrator
          text: Miss Watson kept pecking at me until I felt tired and lonely. After a while, they brought the enslaved people in for prayers. Then everybody went off to bed.
        - id: ch01-b29
          speaker: narrator
          text: I carried a piece of candle up to my room and set it on the table. Then I sat in a chair beside the window and tried to think of something cheerful. It was no use. I felt so lonely I almost wished I was dead.
        - id: ch01-b30
          speaker: narrator
          text: The stars were shining. Out in the woods, the leaves rustled in a mournful way. Far off, an owl kept calling about somebody who was dead. A whip-poor-will cried, and so did a dog, warning that somebody was going to die. The wind seemed to be whispering something to me, but I couldn't understand it. That sent cold shivers over me.
        - id: ch01-b31
          speaker: narrator
          text: Then I heard another sound deep in the woods. It was the kind a ghost makes when it has something on its mind but can't make anyone understand. A ghost like that can't rest easy in its grave. It has to wander around every night, grieving. By then I was so downhearted and scared that I truly wanted somebody with me.
        - id: ch01-b32
          speaker: narrator
          text: Just then, a spider crawled up my shoulder. I flicked it away, and it landed in the candle flame. Before I could move it, the spider shriveled up.
        - id: ch01-b33
          speaker: narrator
          text: Nobody had to tell me what that meant. It was a terrible sign, and bad luck was coming for me. I got so scared I nearly shook my clothes off.
        - id: ch01-b34
          speaker: narrator
          text: I stood up, turned around in my tracks three times, and crossed my chest each time. Then I tied a little lock of my hair with thread to keep witches away. But I didn't trust it much. That trick was for when you'd found a horseshoe and then lost it instead of nailing it over the door. I'd never heard anyone say it could stop the bad luck from killing a spider.
        - id: ch01-b35
          speaker: narrator
          text: I sat down again, still shaking all over, and took out my pipe. The house was as quiet as death now, so the widow wouldn't know I was smoking.
        - id: ch01-b36
          speaker: narrator
          text: A long time passed. Then the clock far away in town went boom, boom, boom. Twelve strokes. After that, everything fell quiet again, quieter than before.
        - id: ch01-b37
          speaker: narrator
          text: Soon a twig snapped among the trees in the dark. Something was moving. I sat perfectly still and listened. Then I could just barely hear a sound from below.
        - id: ch01-b38
          speaker: tom_sawyer
          text: Me-yow! Me-yow!
        - id: ch01-b39
          speaker: narrator
          text: That was good. I answered as softly as I could.
        - id: ch01-b40
          speaker: huck
          text: Me-yow! Me-yow!
        - id: ch01-b41
          speaker: narrator
          text: Then I put out the light, climbed through the window onto the shed, and slipped down to the ground. I crawled in among the trees. Sure enough, Tom Sawyer was there waiting for me.
