audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
    parker:
      display_name: 帕克
      tts:
        delivery: 粗声直气，警惕中还留着一点同情
        timbre: 厚重沙哑
        pace: 干脆利落
        pitch: 中低
    john:
      display_name: 约翰
      tts:
        delivery: 简短务实，随声附和时十分爽快
        timbre: 清楚结实
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 第十六章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我们白天几乎一直在睡，天黑后才出发。前头不远有只大木筏，长得像一支走不完的队伍，光从我们眼前经过就用了好久。两头各伸着四支长桨，我们估计筏上大概有三十个人。五座大棚屋彼此隔得远远的，中间露天烧着一堆篝火，两头还各竖着一根高旗杆。那排场真够神气。在这种木筏上当筏工，可算得上个人物。
        - id: ch01-b02
          speaker: huck
          text: 我们顺流漂进一道大河湾，天阴下来，又闷又热。河面很宽，两岸的树林密密实实，像筑起了两堵墙，几乎找不到一个缺口，更别想看见灯。我们担心认不出开罗。我听说镇上只有十来间房，要是碰巧都没点灯，谁知道我们正从一座镇子旁边经过？吉姆说，两条大河在那里汇合，一看见河口就是记号。可我怕我们会把它当成一座岛的下梢，以为绕过去还是原来这条河。
        - id: ch01-b03
          speaker: huck
          text: 我们越想越不安，不知道到底该怎么办。最后我出了个主意。只要看见灯，我就划上岸，说爸爸驾着一只做买卖的货船跟在后头。他刚做这门生意，什么也不熟，所以想问问离开罗还有多远。吉姆觉得这办法不错，我们便一边抽烟，一边等着灯火出现。
        - id: ch01-b04
          speaker: huck
          text: 我们只能睁大眼睛，千万别错过那座镇子。吉姆说，他一定看得见。看到开罗的那一刻，他就是自由人了。要是错过去，他又会进入蓄奴州，再也没有自由的指望。每隔一会儿，他便猛地跳起来。
        - id: ch01-b05
          speaker: jim
          text: 哈克，那边是不是开罗？
        - id: ch01-b06
          speaker: huck
          text: 每次都不是，不过是鬼火或萤火虫。吉姆重新坐下，跟先前一样继续望着前方。他说，离自由这么近，自己又发抖又发热。听了这话，我也跟着浑身发抖，一阵阵发热。因为我终于想明白，他真的就快自由了，而这件事要怪谁呢？怪我。这个答案怎么也躲不过去。
        - id: ch01-b07
          speaker: huck
          text: 这个念头怎么也赶不走。它越来越折磨我，像在心里不停烧着，害得我坐立不安，一个地方也待不住。以前我从没真正想过，自己做的究竟是什么。现在我全明白了。我劝自己，吉姆不是我撺掇着离开主人的，所以不能怪我。可良心马上回答，你明知他在逃，明知他想得到自由。你本来能划上岸，把这事告诉别人。你为什么不去？
        - id: ch01-b08
          speaker: huck
          text: 良心又问，沃森小姐做过什么对不起我的事？她教我读书，教我规矩，用自己知道的每一种办法对我好。我却看着她的黑奴从眼前逃走，连一句话也不说。我觉得自己又卑鄙又可恶，几乎不想活了。我在筏子上来回乱走，心里不停骂自己。吉姆也来回走，一次次从我身旁经过。我们谁也停不住。每当他跳起来喊那边就是开罗，那句话就像一颗子弹打进我心里。我想，要真是开罗，我一定会难受死。
        - id: ch01-b09
          speaker: huck
          text: 我默默责骂自己，吉姆却把自己的打算全说了出来。他到了自由州就开始攒钱，一个子儿也不花。等钱够了，先赎回妻子。她现在属于沃森小姐家附近一座农场的主人。等夫妻团聚，他们再一起挣钱，把两个孩子也赎回来。要是孩子的主人不肯卖，他们就找一个废奴主义者，请那个人把孩子偷出来。
        - id: ch01-b10
          speaker: huck
          text: 这些话听得我心里发冷。他从前一辈子都不敢这么说。可才觉得自己快自由了，整个人就变了，竟敢直截了当地说，要去偷自己的孩子。在我当时看来，那些孩子属于一个陌生人，而那个人从没害过我。这就是我不肯好好动脑筋的下场。我帮一个黑奴逃出来，他便想得寸进尺。我甚至觉得吉姆这样说，是把自己说低了。
        - id: ch01-b11
          speaker: huck
          text: 良心越逼越紧，我终于对它说，别再折磨我了，现在还不算晚，一看见灯我就划上岸告发吉姆。这个念头一落定，我立刻觉得又轻松又快活，身子轻得像根羽毛，所有烦恼全没了。我仔细寻找灯火，嘴里还轻轻哼起歌来。没过多久，前面真的亮起一点光。
        - id: ch01-b12
          speaker: jim
          text: 咱们得救啦，哈克！快跳起来，把脚后跟磕响！那一定是开罗，终于到啦！
          emotion: happy
        - id: ch01-b13
          speaker: huck
          text: 我坐小划子去看一眼吧，吉姆。那也可能不是开罗。
        - id: ch01-b14
          speaker: huck
          text: 吉姆马上替我准备好小划子，把旧外套铺在船底给我坐，又递来船桨。我才把船推开，他便欢欢喜喜地喊起来。
        - id: ch01-b15
          speaker: jim
          text: 很快我就能欢呼了！我要告诉大家，我能成为自由人，全是哈克的功劳。没有你，我永远也得不到自由。老吉姆一辈子都不会忘记。哈克，你是我最好的朋友，也是我现在唯一的朋友。
          emotion: happy
        - id: ch01-b16
          speaker: huck
          text: 我本来满头冒汗，急着去告发他。听完这些话，力气忽然全没了，划桨也慢下来。我不知道自己该庆幸还是该后悔。离开木筏五十码左右时，他又从后面喊我。
        - id: ch01-b17
          speaker: jim
          text: 去吧，守信用的哈克。答应老吉姆的事以后，只有你这个白人先生真的做到了。
        - id: ch01-b18
          speaker: huck
          text: 我心里一阵恶心，却还是逼自己非做不可，因为我觉得已经没有退路。正巧一只小艇划来，船上坐着两个带枪的男人。他们停住，我也停住。帕克先问远处是什么，我说是一截木筏。他又问我是不是筏上的人，上面还有几个男人。我一句句回答，说自己属于那木筏，筏上只有一个人。
        - id: ch01-b19
          speaker: parker
          text: 今晚上游的河湾跑了五个黑奴。你木筏上那个人，是白人还是黑人？
        - id: ch01-b20
          speaker: huck
          text: 我想立刻回答，可话堵在嗓子里。努力了好一会儿，我还是拿不出胆量，连只兔子都不如。最后我放弃挣扎，说那个人是白人。
        - id: ch01-b21
          speaker: parker
          text: 那我们还是过去亲眼看看。
        - id: ch01-b22
          speaker: huck
          text: 请你们去吧。筏上是我爸爸，也许你们能帮我把筏子拖到有灯的岸边。他病了，我妈妈和玛丽·安也病了。
        - id: ch01-b23
          speaker: parker
          text: 真见鬼，我们还赶时间呢。不过也不能不管。小子，使劲划，赶快过去。
        - id: ch01-b24
          speaker: huck
          text: 我们一起划起来。才划了一两下，我就告诉他们，爸爸一定会感激他们。以前每次请人帮忙拖筏子，大家都会离开，我一个人实在做不到。
        - id: ch01-b25
          speaker: parker
          text: 这也太缺德了，而且挺奇怪。小子，你爸爸到底得了什么病？
        - id: ch01-b26
          speaker: huck
          text: 我爸爸得的是……是那个……其实也不算什么大病。
        - id: ch01-b27
          speaker: huck
          text: 他们立刻停桨。这时小艇已经离木筏很近。帕克说我在撒谎，要我马上老实交代爸爸得了什么病，这样对我才有好处。我答应一定说实话，又苦苦求他们别走。我结结巴巴，怎么也说不出病名，只说两位先生再靠近一点，让我把缆绳抛过去就好，他们根本不用贴近木筏。
        - id: ch01-b28
          speaker: parker
          text: 约翰，快往后划！离远点，小子，待在下风头。糟了，风恐怕已经把病气吹过来了。你爸爸明明得了天花，为什么不早说？你想叫所有人都染上吗？
          emotion: fearful
        - id: ch01-b29
          speaker: huck
          text: 我抽噎着说，以前每次都告诉人家实情，可他们全把我们丢下走了。
        - id: ch01-b30
          speaker: parker
          text: 可怜的小鬼，这倒不能全怪你。我们很替你难过，可谁也不想染上天花。你别自己靠岸，那会把东西全撞坏。再顺流漂二十英里，左岸有座镇子。太阳升起以后，你就去求助，只说家里人得了寒热病。别再让别人猜出实情。
        - id: ch01-b31
          speaker: parker
          text: 那边的灯只是木料场，上岸也没用。你爸爸大概很穷，运气又坏透了。我放一枚二十美元的金币在木板上，等它漂过去，你就拿走。把你丢下，我心里也不好受。可天花实在碰不得。
        - id: ch01-b32
          speaker: john
          text: 等一下，帕克。我也放二十美元上去。再见，小子，照帕克先生说的做，你们就没事了。
        - id: ch01-b33
          speaker: parker
          text: 就这样办，孩子。要是看见逃跑的黑奴，赶紧找人抓住，还能赚一笔钱。再见。
        - id: ch01-b34
          speaker: huck
          text: 再见，先生。只要我有办法，绝不会放跑一个逃亡的黑奴。
        - id: ch01-b35
          speaker: huck
          text: 他们走后，我回到木筏，心里又低落又难受。我很清楚自己做错了，也看出想学做好人根本没用。一个人小时候没有走上正道，以后就没什么指望。真碰上难关，他心里没有一样东西能撑住他，让他把该做的事坚持到底。他最后只能败下阵来。
        - id: ch01-b36
          speaker: huck
          text: 可我想了一会儿，又对自己说，慢着。要是真做了所谓正确的事，把吉姆交出去，我会比现在好受吗？不会，我还是会难受，而且跟现在丝毫没有分别。那么，做对的事这么麻烦，做错的事倒毫不费力，得到的报酬却完全一样，何必学着做对呢？这个问题把我难住了，我怎么也答不上来。最后只好决定，以后再也不为这件事操心。事情到了眼前，哪一种做法最顺手，我就选哪一种。
        - id: ch01-b37
          speaker: huck
          text: 我走进棚屋，没看见吉姆，又把木筏四周找了一遍，到处都没有他的影子。我只好站在那里，大声叫他的名字。
        - id: ch01-b38
          speaker: jim
          text: 我在这儿，哈克。他们已经走远了吗？别说得太响。
        - id: ch01-b39
          speaker: huck
          text: 原来他躲在船尾长桨下面的河水里，整个身子都沉在水中，只把鼻子露在外头。我告诉他，那两个人早已走远，连影子也看不见了。他这才从水里出来，重新爬上木筏。
        - id: ch01-b40
          speaker: jim
          text: 你们说的话我全听见了。我悄悄滑进水里，打算等他们一上木筏就游走，等人走了再游回来。老天爷呀，哈克，你把他们骗得真惨！这主意聪明极了。我看这一招救了老吉姆的命。我永远不会忘记你，宝贝儿。
          emotion: happy
        - id: ch01-b41
          speaker: huck
          text: 接着，我们谈起那两枚金币。每人二十美元，这笔进账可不小。吉姆说，现在我们已经坐得起蒸汽船的甲板舱了。这些钱能让我们在自由州一直走到想去的地方。木筏再漂二十英里确实不算太远，可他还是恨不得我们已经到了那里。
        - id: ch01-b42
          speaker: huck
          text: 天快亮时，我们停下木筏。吉姆这回格外小心，非要把它藏得严严实实。随后，他又忙了一整天，把东西一件件扎成包，做好离开木筏的一切准备。当晚十点左右，我们终于在下游望见一座镇子的灯火，远远亮在左边一道河湾里。
        - id: ch01-b43
          speaker: huck
          text: 我划着小船出去打听，很快碰见一个待在河上的男人。他坐在小艇里，正在安放延绳钓。我靠过去，问远处那座镇子是不是开罗。他说当然不是，还骂我准是个该死的傻瓜。我再问那到底是什么镇子，他叫我想知道就自己去打听。要是再待在那里烦他半分钟，他就送我一样绝不想要的东西。
        - id: ch01-b44
          speaker: huck
          text: 我只好划回木筏。吉姆失望透了，我安慰他说不要紧，下一座镇子大概就是开罗。天亮前，我们又经过一座镇子。我本想再划出去询问，可那边地势很高，于是没有去。吉姆说过开罗附近没有高地，我这才想起这件事。白天，我们把木筏藏在离左岸相当近的一处沙洲旁。慢慢地，我们俩都开始怀疑一件事。
        - id: ch01-b45
          speaker: huck
          text: 吉姆，也许起雾那晚，我们已经从开罗旁边漂过去了。
        - id: ch01-b46
          speaker: jim
          text: 别说了，哈克。可怜的黑奴没有好运气。我早知道那张响尾蛇皮还没折腾完呢。
          emotion: sad
        - id: ch01-b47
          speaker: huck
          text: 我真希望从来没见过那张蛇皮，更希望自己一眼也没看过它。
        - id: ch01-b48
          speaker: jim
          text: 这不怪你，哈克。你那时候不知道，别再怪自己了。
          emotion: calm
        - id: ch01-b49
          speaker: huck
          text: 天一亮，我们果然看见岸边流着清澈的俄亥俄河水，外侧却还是那条一向浑浊的密西西比河。开罗真的错过了。我们把办法全想了一遍。现在不能上岸，木筏当然也不可能逆流而行。只好等到夜里，坐小划子回头碰碰运气。为了养足精神，我们躲进棉白杨树丛，整整睡了一天。可黄昏回到筏子上，小划子竟然不见了。
        - id: ch01-b50
          speaker: huck
          text: 我们很久没说话，因为根本没什么可说。两个人都明白，又是响尾蛇皮在作怪。说出口听着只像在埋怨它，准会招来更多厄运，而且一直招下去，直到我们学会闭嘴为止。后来我们才商量出唯一的办法。继续坐木筏往下漂，等有机会买只小划子再回去。我们不想像爸爸那样，趁四周没人就借走一只，因为那会引得别人追上来。
        - id: ch01-b51
          speaker: huck
          text: 天黑以后，我们又出发了。要是还有谁不信摆弄蛇皮很愚蠢，那就继续听下去。看看它接下来又给我们招来什么，那个人自然会信。
        - id: ch01-b52
          speaker: huck
          text: 小划子通常可以向停在岸边的木筏买，可那晚我们一只停靠的木筏也没遇见，只能继续往下漂。三个多小时以后，夜色渐渐变得灰蒙蒙、浑浊不清。这种天气只比大雾稍好一点。河道究竟是什么形状完全辨不出来，远处的东西也看不见。夜越来越深，四周静得很，忽然有一艘蒸汽船从下游驶来。
        - id: ch01-b53
          speaker: huck
          text: 我们点亮灯笼，以为船上的人一定能看到。逆流而上的船平时不会靠木筏太近。它们总驶到外侧，顺着沙洲寻找道路，再从礁石下面找水流较缓的地方。可碰上这种看不清的夜晚，它们不会绕远，而是沿着主航道，顶住整条河的水势直接往上闯。
        - id: ch01-b54
          speaker: huck
          text: 我们早就听见它轰隆轰隆地逼近，可直到船靠得很近才看清。它正对着我们直冲过来。那些蒸汽船常常故意这样吓人，想试试自己能离木筏多近而不碰上。有时明轮会咬掉筏子的一支长桨，领航员还会从窗口探出头大笑，觉得自己聪明透顶。我们以为这艘船也只是想擦着筏子过去，可它一点也没有转向。
        - id: ch01-b55
          speaker: huck
          text: 那艘大船来得飞快，远远望去，像一团周围镶着几排萤火虫的乌云。突然，它整个庞大、吓人的身躯凸现在眼前。一长排炉门全敞开着，亮得像烧红的牙齿，巨大的船头和护舷已经高高悬在我们头顶。有人冲我们大吼，停机铃叮当乱响，一群人骂成一片，蒸汽也尖声呼啸起来。吉姆从木筏一边跳下水，我从另一边跳下去。蒸汽船轰然碾过来，径直把木筏撞成两半。
        - id: ch01-b56
          speaker: huck
          text: 我一头扎进水里，拼命往下潜，恨不得直接摸到河底。三十英尺高的明轮马上要从头顶滚过去，我得给它留下足够的地方。平常我能在水下憋气一分钟，这回大概足足待了一分半。等到胸口几乎要炸开，我才急忙往水面猛冲。一下冒出来时，水只到腋窝。我把鼻子里的水狠狠喷掉，又呼哧呼哧喘了几口气。
        - id: ch01-b57
          speaker: huck
          text: 水流奔涌得厉害。那艘船停机以后，不到十秒就重新发动了，因为船上的人向来不怎么在意筏工的死活。它的明轮重新搅起河水，船身轰隆隆地向上游远去。没多久，它就在浑浊的夜色里消失了，虽然我还听得见它的轰鸣。
        - id: ch01-b58
          speaker: huck
          text: 我扯开嗓子喊了吉姆大约十二次，可始终没有任何回答。就在我踩水时，一块木板碰到身边。我赶紧抓住它，一边把它推在前头，一边朝岸上游。很快，我看出水流正斜斜地把我带向左岸。这说明自己到了横渡水道，于是我换了方向，顺势朝左边游去。
        - id: ch01-b59
          speaker: huck
          text: 那道横渡水道又长又斜，足足有两英里，我花了很久才终于游过去。好在我平安到了岸边，随后爬上河堤。天气太浑浊，四周看不出多远。我在崎岖的地面上摸索着走了四分之一英里还多，直到快撞上去，才猛然发现眼前立着一座老式的双体大木屋。
        - id: ch01-b60
          speaker: huck
          text: 我本来想从木屋旁边猛冲过去，尽快逃开。可一大群狗突然蹿出来，围着我又嚎又叫。看到这副阵势，我心里很清楚，这时候最好连一步也别再动。
