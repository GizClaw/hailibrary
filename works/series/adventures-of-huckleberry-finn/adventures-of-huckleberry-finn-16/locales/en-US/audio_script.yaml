  chapters:
    - id: ch01
      title: CHAPTER XVI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: We slept through most of the day and set out again at night. We followed a short way behind a tremendously long raft. It took as long to pass as a whole procession. The craft had four long steering oars at each end, so we figured maybe thirty men worked it. Five big shelters stood far apart across its deck. An open campfire burned in the middle, and a tall flagpole rose from either end. Everything about that raft had style. Being a raftsman on something like that really meant something.
        - id: ch01-b02
          speaker: huck
          text: We drifted into a wide bend. Clouds covered the sky, and the night turned hot. The river spread out between solid walls of trees, with hardly a break or a light anywhere. Jim and I wondered how we would recognize Cairo. I had heard it was only about twelve houses. If none had lamps burning, we might pass without knowing it. Jim said we could watch for the place where the two big rivers joined. I pointed out that it might look like the end of an island, with the same river continuing beyond it. That worried both of us.
        - id: ch01-b03
          speaker: huck
          text: We decided that when we saw a light, I would paddle ashore. I would say pap was following on a trading scow and was new to the business, then ask how far it was to Cairo. Jim liked that plan. We smoked and waited, watching hard so the town would not slip past us.
        - id: ch01-b04
          speaker: huck
          text: Jim said he would surely spot Cairo. The moment he saw it, he would be free. If he missed it, he would be back in slave country with no more chance at freedom. Every few minutes he jumped up and asked the same thing.
        - id: ch01-b05
          speaker: jim
          text: Is that Cairo there?
        - id: ch01-b06
          speaker: huck
          text: It never was. Each time, he had seen a wandering light or a lightning bug. He sat down and started watching again, just as closely as before. He told me being so near freedom made him shake like he had a fever. Hearing him made me shake too. One thought had finally struck me. Jim really was almost free, and who was responsible? I was. I could not push that thought out of my conscience. Until then, I had never truly faced what I was doing. Now it stayed with me and burned worse every minute. My conscience kept saying I had known Jim was escaping and could have paddled ashore to tell someone.
        - id: ch01-b07
          speaker: huck
          text: I tried telling myself I was not to blame because I had not made Jim leave Miss Watson. It did no good. My conscience answered that I had known he was running for freedom and could have stopped him. It reminded me that Miss Watson had done nothing against me. She had taught me my lessons and my manners and had tried to be kind in every way she knew. Yet I had watched Jim escape right before my eyes without saying a single word. I could not argue around that. I felt so low and miserable I almost wished I were dead.
        - id: ch01-b08
          speaker: huck
          text: Jim and I both paced around the raft, too restless to keep still. Whenever he cried out that he saw Cairo, the words hit me like a shot. All the while, he talked about what he would do in a free state. He would save every cent until he could buy his wife from the farm near Miss Watson's place. Then the two of them would work to buy their children. If the children's owner refused to sell, they would find an abolitionist to steal them away.
        - id: ch01-b09
          speaker: huck
          text: That talk nearly froze me. Jim would never have dared say such things before. Believing he was almost free had changed how boldly he spoke. I remembered the old saying that if you gave an enslaved man an inch, he would take an ell. This, I thought, was what came from my not thinking. I had practically helped Jim run away, and now he spoke openly of stealing his children from a man I did not even know, a man who had never harmed me. I thought it lowered Jim to talk that way, and my conscience burned hotter than ever. At last I told it to leave me alone. It was not too late. I would go ashore at the first light and tell. Right away, all my trouble seemed gone. I felt happy and light as a feather. I watched sharply for a lamp and even began singing to myself.
        - id: ch01-b10
          speaker: huck
          text: Before long, a light appeared.
        - id: ch01-b11
          speaker: jim
          text: We're safe, Huck! That's good old Cairo at last. Jump up and kick your heels!
          emotion: happy
        - id: ch01-b12
          speaker: huck
          text: I'll take the canoe and make sure. It might be somewhere else.
        - id: ch01-b13
          speaker: huck
          text: Jim sprang up, put his old coat in the canoe for me to sit on, and handed me the paddle. As I pushed away, he called after me.
        - id: ch01-b14
          speaker: jim
          text: Soon I'll be shouting that I'm free because of Huck. I never could've made it without you. Jim won't ever forget it. You're the best friend I've ever had, Huck, and the only friend old Jim has now.
          emotion: happy
        - id: ch01-b15
          speaker: huck
          text: I had been hurrying off to betray him, but his words took all the strength out of me. I paddled slower. I could not tell whether I was glad I had started or sorry. When I was about fifty yards away, he called once more.
        - id: ch01-b16
          speaker: jim
          text: There goes true old Huck, the only white gentleman who ever kept a promise to old Jim.
        - id: ch01-b17
          speaker: huck
          text: I felt sick. Still, I told myself there was no way out of it. Just then a skiff came along with two armed men. They stopped, and so did I.
        - id: ch01-b18
          speaker: parker
          text: What's that over there?
        - id: ch01-b19
          speaker: huck
          text: Part of a raft.
        - id: ch01-b20
          speaker: parker
          text: Is it yours?
        - id: ch01-b21
          speaker: huck
          text: Yes, sir.
        - id: ch01-b22
          speaker: parker
          text: Anybody on it?
        - id: ch01-b23
          speaker: huck
          text: Just one man, sir.
        - id: ch01-b24
          speaker: parker
          text: Five Black men escaped upriver tonight, above the bend. Is the man on your raft white or Black?
        - id: ch01-b25
          speaker: huck
          text: I tried to answer, but the words would not come. For a second or two, I struggled to force them out. I did not have the courage of a rabbit. I gave up and answered.
        - id: ch01-b26
          speaker: huck
          text: He's white.
        - id: ch01-b27
          speaker: parker
          text: We'll go see for ourselves.
        - id: ch01-b28
          speaker: huck
          text: Please do. That's pap on the raft. Maybe you can help me tow it over to the light. He's sick, and so are mam and Mary Ann.
        - id: ch01-b29
          speaker: parker
          text: Oh, devil! We're in a hurry, boy, but I suppose we have to help. Paddle hard. Let's get moving.
        - id: ch01-b30
          speaker: huck
          text: I dug in with my paddle, and they pulled their oars. After a stroke or two, I spoke again.
        - id: ch01-b31
          speaker: huck
          text: Pap will be very grateful. Whenever I ask people to help tow us ashore, they leave. I can't manage the raft alone.
        - id: ch01-b32
          speaker: parker
          text: That's terribly mean, and strange too. What's wrong with your father, boy?
        - id: ch01-b33
          speaker: huck
          text: It's... well, it isn't anything serious.
        - id: ch01-b34
          speaker: huck
          text: They stopped rowing. We were quite close to the raft now.
        - id: ch01-b35
          speaker: parker
          text: That's a lie. Tell us plainly what's wrong with your pap. It'll go better for you if you do.
        - id: ch01-b36
          speaker: huck
          text: I will, sir, honestly. Only please don't leave us. Gentlemen, if you row ahead, I'll throw you the rope. You won't need to come near the raft. Please?
        - id: ch01-b37
          speaker: parker
          text: Back her up, John! Keep away, boy, and stay downwind. The wind may have carried it over here already. Your pap has smallpox, and you know it. Why didn't you say so? Are you trying to spread it everywhere?
          emotion: fearful
        - id: ch01-b38
          speaker: huck
          text: I began to cry as I answered.
        - id: ch01-b39
          speaker: huck
          text: I told people before, and every one of them went away and left us.
          emotion: sad
        - id: ch01-b40
          speaker: parker
          text: Poor boy. I can understand why you hid it, and we're truly sorry. But we don't want smallpox either. Listen carefully. Don't try landing the raft alone, or you'll smash everything to pieces. Drift another twenty miles. You'll find a town on the left after sunrise. When you ask for help there, say your family has chills and fever. Don't be foolish again and let people guess the truth. We're trying to do you a kindness, so put twenty miles between us. That light you saw is only a wood yard. Landing there would not do you any good.
        - id: ch01-b41
          speaker: parker
          text: Your father must be poor, and he's surely having hard luck. I'll set a twenty-dollar gold piece on this board. Pick it up when it floats past. I feel mean leaving you, but nobody can take chances with smallpox.
        - id: ch01-b42
          speaker: john
          text: Wait, Parker. I'll add twenty dollars of my own. Goodbye, boy. Follow Mr. Parker's advice, and you'll be all right.
        - id: ch01-b43
          speaker: parker
          text: That's right. Goodbye, son. If you spot any escaped Black men, get help and catch them. You can earn money for it.
        - id: ch01-b44
          speaker: huck
          text: Goodbye, sir. I won't let any escape if I can stop them.
        - id: ch01-b45
          speaker: huck
          text: They rowed off, and I climbed back onto the raft feeling bad and low. I knew perfectly well that I had done wrong. It seemed useless for me to try learning to do right. If a person does not start out right as a child, then when a hard choice comes, there is nothing inside to hold him to the work. He is bound to be beaten.
        - id: ch01-b46
          speaker: huck
          text: Then I stopped and asked myself something. Suppose I had done what I called right and handed Jim over. Would I feel any better than I did now? No. I would feel bad either way. So what was the use of learning to do right when doing right was hard, doing wrong was easy, and the reward felt exactly the same? That question stopped me. I could not answer it. I decided not to bother about right and wrong anymore. From then on, I would do whichever thing seemed handiest at the time.
        - id: ch01-b47
          speaker: huck
          text: I looked inside the shelter, but Jim was gone. I searched the raft and could not find him anywhere.
        - id: ch01-b48
          speaker: huck
          text: Jim!
        - id: ch01-b49
          speaker: jim
          text: I'm here, Huck. Are they out of sight? Keep your voice down.
        - id: ch01-b50
          speaker: huck
          text: He was in the river beneath the stern oar, with only his nose above water. I told him the men were gone, and he climbed aboard.
        - id: ch01-b51
          speaker: jim
          text: I heard every word. I slipped into the river, and if they came aboard, I was going to swim away. After they left, I'd come back to the raft. But Huck, you surely fooled them! That was the smartest trick. I believe you saved old Jim. I'll never forget what you did, honey.
          emotion: happy
        - id: ch01-b52
          speaker: huck
          text: Then we discussed the money. Forty dollars was a fine gain. Jim said we could ride on a steamboat deck now and have enough to travel as far as we wanted in the free states. Another twenty miles was not far for the raft, though he wished we were there already.
        - id: ch01-b53
          speaker: huck
          text: Near daybreak, we tied up. Jim took special care to hide the raft. Then he spent the whole day gathering our things into bundles and getting ready for us to leave the raft behind. Around ten that night, we saw the lights of a town far ahead in a bend on the left side of the river.
        - id: ch01-b54
          speaker: huck
          text: I took the canoe to ask about it. Soon I came upon a man in a skiff setting a fishing line in the river.
        - id: ch01-b55
          speaker: huck
          text: Mister, is that town Cairo?
        - id: ch01-b56
          speaker: fisherman
          text: Cairo? No. You must be a complete fool.
        - id: ch01-b57
          speaker: huck
          text: What town is it, mister?
        - id: ch01-b58
          speaker: fisherman
          text: Go find out if you need to know. Keep bothering me another half minute, and you'll get an answer you won't like.
          emotion: angry
        - id: ch01-b59
          speaker: huck
          text: I paddled back. Jim was terribly disappointed, but I told him Cairo would probably be the next town.
        - id: ch01-b60
          speaker: huck
          text: Before daylight, we passed another town. I meant to go ask again, but the land there was high. Jim had said Cairo stood on low ground, and I had forgotten. We hid for the day on a towhead close to the left bank. Both of us began to suspect the same thing.
        - id: ch01-b61
          speaker: huck
          text: Maybe we passed Cairo in the fog that night.
        - id: ch01-b62
          speaker: jim
          text: Let's not speak about it, Huck. A poor enslaved man can't have any luck. I always feared that snakeskin hadn't finished with us.
          emotion: sad
        - id: ch01-b63
          speaker: huck
          text: I wish I'd never seen that snakeskin, Jim. I truly wish I'd never laid eyes on it.
          emotion: sad
        - id: ch01-b64
          speaker: jim
          text: It isn't your fault, Huck. You didn't know. Don't blame yourself for it.
          emotion: calm
        - id: ch01-b65
          speaker: huck
          text: Daylight showed us the truth. Clear Ohio water ran along the shore, and the regular muddy Mississippi flowed outside it. Cairo was behind us.
        - id: ch01-b66
          speaker: huck
          text: We talked through every choice. Going ashore was unsafe, and of course the raft could not travel upstream. There was only one thing left. We would wait until dark, paddle back in the canoe, and take whatever risks came. We slept all day among a thicket of cottonwoods so we would be rested for the work. At dusk, we went back to the raft. The canoe was gone.
        - id: ch01-b67
          speaker: huck
          text: For a long while, neither of us spoke. There was nothing to say. We both knew the snakeskin was causing more trouble. Talking about it would sound like we were finding fault with the bad luck. That would surely call down more of it, and the trouble would keep coming until we had sense enough to be quiet. So we said nothing.
        - id: ch01-b68
          speaker: huck
          text: After a while, we discussed what to do next. We had no choice except to keep drifting until we found a chance to buy another canoe and use it to go back. We would not take one from an empty place the way pap would have done. Somebody might come after us. When darkness fell, we pushed the raft into the current again.
        - id: ch01-b69
          speaker: huck
          text: If anyone still thinks handling a snakeskin is harmless after all it had done to us, just wait and see what it did next.
        - id: ch01-b70
          speaker: huck
          text: The place to buy a canoe was from one of the rafts tied along the shore, but we saw no rafts there. We kept drifting for more than three hours. The night grew gray and thick, almost as bad as fog. We could not make out the shape of the river or see anything far ahead. It had grown very late and very still when a steamboat came upriver.
        - id: ch01-b71
          speaker: huck
          text: We lit our lantern and expected the crew to see it. Steamboats traveling upstream did not usually come close to us. They worked around the sandbars and searched beneath the reefs for easy water. On a night like this, though, they drove straight up the main channel, pushing against the full force of the river.
        - id: ch01-b72
          speaker: huck
          text: We heard the boat pounding toward us before we could see it clearly. Then we realized it was aimed straight at the raft. Pilots often did that for sport, trying to find out how close they could come without actually hitting. Sometimes a paddle wheel bit off one of a raft's long steering oars. Then the pilot would stick his head out, laugh, and think himself wonderfully clever.
        - id: ch01-b73
          speaker: huck
          text: We thought this boat meant to shave past us, but it did not turn aside at all. It was huge and moving fast. At first it looked like a black cloud ringed with rows of glowworms. Then it swelled up before us, enormous and frightening. A long row of open furnace doors shone like red-hot teeth. The giant bow and guards hung directly above our heads. Someone yelled at us. Bells jingled for the engines to stop. Men shouted and cursed, and steam whistled. Jim jumped over one side, and I jumped over the other. The steamboat smashed straight through our raft.
        - id: ch01-b74
          speaker: huck
          text: I dived deep, meaning to reach the bottom if I could. A thirty-foot paddle wheel had to pass over me, and I wanted to leave it plenty of room. Usually I could stay underwater for a minute. This time, I believe I stayed down for a minute and a half. When my lungs were nearly bursting, I shot upward in a hurry. I came clear out to my armpits, blew the water from my nose, and gasped for breath.
        - id: ch01-b75
          speaker: huck
          text: The current boomed around me. Ten seconds after stopping, the steamboat had started its engines again. Those crews never cared much about raftsmen. Soon the boat was churning upriver and had vanished into the thick weather. I could no longer see it, but I could still hear its engines.
        - id: ch01-b76
          speaker: huck
          text: I shouted Jim's name around a dozen times, but no answer came. While I was treading water, a plank touched me. I grabbed it and began swimming toward shore, pushing the plank ahead. Then I noticed the current was carrying everything toward the left bank. That meant I was in one of the river's crossings. I changed direction and followed the drift.
        - id: ch01-b77
          speaker: huck
          text: It was one of those long crossings that slanted across the river for two miles, so reaching land took a long time. At last I got safely ashore and climbed the bank. I could see only a short distance through the thick air. I picked my way over rough ground for at least a quarter mile. Then I came upon a big, old-fashioned double log house before I had even noticed it was there.
        - id: ch01-b78
          speaker: huck
          text: I was about to rush past the house and get away. Then a pack of dogs sprang out, howling and barking at me. I knew better than to move so much as one more step.
