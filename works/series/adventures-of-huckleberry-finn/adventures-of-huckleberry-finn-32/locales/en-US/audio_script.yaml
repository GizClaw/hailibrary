  chapters:
    - id: ch01
      title: CHAPTER XXXII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: When I got there, everything was still and Sunday-like. The day was hot and bright, and the hands had all gone out to the fields. Bugs and flies made a faint droning sound. It felt so lonesome, like everybody was dead and gone. Whenever a breeze stirred the leaves, it sounded mournful, almost like spirits that had been dead for years were whispering about you. A place like that could make a person wish he was dead too, with everything over and done.
        - id: ch01-b02
          speaker: huck
          text: The Phelps place was a small one-horse cotton plantation, much like all the others. A rail fence circled a two-acre yard. The stile was made of short logs standing on end like barrels of different heights, so people could climb over the fence, and women could stand there to mount a horse. A few sickly patches of grass grew in the big yard, but most of it was bare and smooth, like an old hat rubbed bald.
        - id: ch01-b03
          speaker: huck
          text: The white folks lived in a big double log house made of hewn logs. Mud or mortar filled the cracks, and those pale stripes had been whitewashed sometime or other. A broad passage, open at the sides but covered by a roof, joined the house to a round-log kitchen. Behind that stood a smokehouse. On its far side were three small cabins in a row. One little hut stood all by itself against the back fence. Near it were an ash hopper and a big kettle for boiling soap. Other outbuildings sat farther away on the other side.
        - id: ch01-b04
          speaker: huck
          text: By the kitchen door stood a bench with a water bucket and a gourd. A hound slept there in the sun, and more hounds slept nearby. Three shade trees stood off in one corner. Currant and gooseberry bushes grew beside the fence. Outside were a garden and a watermelon patch. Then came the cotton fields, and after the fields, the woods.
        - id: ch01-b05
          speaker: huck
          text: I went around back, climbed the stile by the ash hopper, and headed for the kitchen. Before I got far, I heard the low hum of a spinning wheel. Its sound rose and sank like a wail. Then I knew for certain I wished I was dead, because that is the lonesomest sound in the whole world.
        - id: ch01-b06
          speaker: huck
          text: I kept walking without making any real plan. I trusted Providence to put the right words in my mouth when the time came. I had noticed that Providence usually did, so long as I left it alone.
        - id: ch01-b07
          speaker: huck
          text: Halfway across the yard, one hound got up and came at me, then another. I stopped, faced them, and held still. What a racket they made! In a quarter of a minute I was the hub of a wheel, with dogs for spokes. Fifteen of them crowded in a circle, stretching their necks and noses toward me, barking and howling. More kept coming, sailing over fences and around corners from every direction.
        - id: ch01-b08
          speaker: huck
          text: A Black woman tore out of the kitchen with a rolling pin in her hand. She shouted at the dogs as she ran.
        - id: ch01-b09
          speaker: lize
          text: Get away, Tige! You too, Spot! Go on, get!
        - id: ch01-b10
          speaker: huck
          text: She struck one dog and then another, sending them off howling, and the rest followed. A second later, half of them came back wagging their tails and making friends with me. There is no harm in a hound, anyhow.
        - id: ch01-b11
          speaker: huck
          text: A little Black girl and two little Black boys came out behind the woman. They wore nothing but rough linen shirts. They clung to their mother's dress and peeked shyly at me from behind her. Then a white woman came running from the house. She was about forty-five or fifty, bareheaded, with her spinning stick in one hand. Her young white children came behind her. They acted just like the other children, hanging back and hiding while they looked at me.
        - id: ch01-b12
          speaker: huck
          text: The woman was smiling so hard she could scarcely contain herself.
        - id: ch01-b13
          speaker: aunt_sally
          text: It really is you at last, isn't it?
          emotion: happy
        - id: ch01-b14
          speaker: huck
          text: Yes, ma'am.
        - id: ch01-b15
          speaker: huck
          text: The answer slipped out before I could think. She grabbed me and hugged me tight. Then she took both my hands and shook them over and over. Tears filled her eyes and ran down her face. She could not seem to get enough of hugging and shaking me.
        - id: ch01-b16
          speaker: aunt_sally
          text: You don't favor your mother as much as I expected, but mercy, I don't care! I'm so glad to see you. Dear, dear, I could just eat you up! Children, this is your cousin Tom. Come tell him hello.
          emotion: happy
        - id: ch01-b17
          speaker: huck
          text: The children only ducked their heads, put their fingers in their mouths, and hid behind her. She went right on talking.
        - id: ch01-b18
          speaker: aunt_sally
          text: Lize, hurry and make him a hot breakfast. Or did you eat on the boat?
        - id: ch01-b19
          speaker: huck
          text: I told her I had eaten there. She led me by the hand toward the house, with the children trailing after us. Inside, she put me in a split-bottom chair and sat on a low stool in front of me, still holding both my hands.
        - id: ch01-b20
          speaker: aunt_sally
          text: Now I can get a good look at you. Mercy me, I've wanted this for years and years, and at last you're here! We expected you more than two days ago. What held you up? Did the boat run aground?
        - id: ch01-b21
          speaker: huck
          text: Yes, ma'am. She—
        - id: ch01-b22
          speaker: aunt_sally
          text: Don't call me ma'am. Call me Aunt Sally. Where did she run aground?
        - id: ch01-b23
          speaker: huck
          text: I did not know what to say. I had no idea whether the boat should have been coming upriver or downriver. My instinct told me it would be coming up from the direction of New Orleans. That did not help much, since I knew none of the sandbars down that way. I would have to invent one, pretend I had forgotten its name, or find some other way out. Then an idea came to me.
        - id: ch01-b24
          speaker: huck
          text: Running aground didn't delay us much. We blew out a cylinder head.
        - id: ch01-b25
          speaker: aunt_sally
          text: Good gracious! Was anybody hurt?
          emotion: surprised
        - id: ch01-b26
          speaker: huck
          text: No, ma'am. It killed a Black man.
        - id: ch01-b27
          speaker: aunt_sally
          text: Well, that's lucky, because sometimes people do get hurt. Two years ago last Christmas, your uncle Silas came up from New Orleans on the old Lally Rook. Her cylinder head blew out and crippled a man. I believe he died afterward. He was a Baptist. Your uncle knew a family in Baton Rouge who knew his people very well.
        - id: ch01-b28
          speaker: aunt_sally
          text: Yes, I remember now. He did die. Mortification set in, and they had to amputate him, but it did no good. Yes, mortification was the trouble. He turned blue all over and died hoping for a glorious resurrection. They say he was a terrible sight.
        - id: ch01-b29
          speaker: aunt_sally
          text: Your uncle has gone into town every day to meet you. He left again less than an hour ago and could be back any minute. You must have passed him on the road. He's an older man, with a—
        - id: ch01-b30
          speaker: huck
          text: No, I didn't see anybody, Aunt Sally. The boat landed at daylight. I left my baggage on the wharf boat, wandered around town and a little way into the country to pass the time, and came here by the back way so I wouldn't arrive too early.
        - id: ch01-b31
          speaker: aunt_sally
          text: Who did you leave the baggage with?
        - id: ch01-b32
          speaker: huck
          text: Nobody.
        - id: ch01-b33
          speaker: aunt_sally
          text: Why, child, somebody will steal it!
          emotion: surprised
        - id: ch01-b34
          speaker: huck
          text: Not from the place where I hid it, I reckon.
        - id: ch01-b35
          speaker: aunt_sally
          text: How did you get breakfast so early on the boat?
        - id: ch01-b36
          speaker: huck
          text: I was on thin ice now, but I answered anyway. The captain saw me standing around and said I ought to eat before going ashore. He took me into the texas for the officers' meal and gave me all I wanted.
        - id: ch01-b37
          speaker: huck
          text: I was growing so uneasy that I could barely listen. I kept thinking about the children. If I could get one of them alone and ask a few questions, I might learn who I was supposed to be. But I never got the chance. Mrs. Phelps kept talking without a pause. Then she said something that sent cold chills down my back.
        - id: ch01-b38
          speaker: aunt_sally
          text: Here we are carrying on, and you haven't told me one word about Sis or any of the others. I'll stop talking now, and you can begin. Tell me everything about every one of them. I want to know how they are, what they're doing, what messages they sent, and every last thing you can remember.
        - id: ch01-b39
          speaker: huck
          text: I was trapped, and trapped for good. Providence had stood by me so far, but now I was stuck hard and fast. There was no use trying to bluff my way onward. I would have to give up. This was another time when I had to risk telling the truth. I opened my mouth to begin, but she grabbed me, hurried me behind the bed, and spoke in a whisper.
        - id: ch01-b40
          speaker: aunt_sally
          text: Here he comes! Duck your head lower. There, he can't see you now. Don't let him know you're here. I'm going to play a joke on him. Children, not one word.
        - id: ch01-b41
          speaker: huck
          text: That put me in a fine fix. Worrying would do no good. All I could do was keep still and get ready to jump clear when the lightning struck.
        - id: ch01-b42
          speaker: huck
          text: I caught one quick glimpse of the old gentleman as he entered, and then the bed hid him. Mrs. Phelps sprang toward him.
        - id: ch01-b43
          speaker: aunt_sally
          text: Has he come?
        - id: ch01-b44
          speaker: uncle_silas
          text: No.
        - id: ch01-b45
          speaker: aunt_sally
          text: Goodness gracious! What in the world could have happened to him?
          emotion: surprised
        - id: ch01-b46
          speaker: uncle_silas
          text: I can't imagine. I must say, it has me terribly uneasy.
        - id: ch01-b47
          speaker: aunt_sally
          text: Uneasy? I'm nearly out of my mind! He must have arrived, and you missed him on the road. I know that's what happened. I can feel it.
        - id: ch01-b48
          speaker: uncle_silas
          text: Why, Sally, I couldn't have missed him on that road. You know I couldn't.
        - id: ch01-b49
          speaker: aunt_sally
          text: Oh, dear, what will Sis say? He has to be here! You must have passed him. He—
        - id: ch01-b50
          speaker: uncle_silas
          text: Please don't distress me any more than I already am. I don't know what to think. I'm at my wits' end, and I admit I'm downright scared. But he can't be here, because he could not have come without my seeing him. Sally, this is terrible. Something must have happened to the boat!
          emotion: fearful
        - id: ch01-b51
          speaker: aunt_sally
          text: Silas, look up the road! Isn't that somebody coming?
        - id: ch01-b52
          speaker: huck
          text: He rushed to the window at the head of the bed. That was the chance Mrs. Phelps wanted. She bent down at the foot of the bed, gave me a quick pull, and out I came. When he turned from the window, she stood there glowing and smiling like a house on fire. I stood beside her, meek and sweaty.
        - id: ch01-b53
          speaker: uncle_silas
          text: Why, who's that?
          emotion: surprised
        - id: ch01-b54
          speaker: aunt_sally
          text: Who do you think it is?
        - id: ch01-b55
          speaker: uncle_silas
          text: I have no idea. Who is it?
        - id: ch01-b56
          speaker: aunt_sally
          text: It's Tom Sawyer!
          emotion: happy
        - id: ch01-b57
          speaker: huck
          text: By jings, I nearly sank through the floor. There was no time to change stories now. The old gentleman seized my hand and kept shaking it. His wife danced around us, laughing and crying. Then they both fired question after question at me about Sid, Mary, and all the rest of the family.
        - id: ch01-b58
          speaker: huck
          text: They were joyful, but not half as joyful as I was. Finding out who I was supposed to be felt like being born again. They stayed close and kept me answering questions for two whole hours. By the time my jaw was so tired it could scarcely move, I had told them more things about the Sawyer family than could ever have happened to six Sawyer families put together.
        - id: ch01-b59
          speaker: huck
          text: I also explained that our cylinder head had blown out at the mouth of the White River and taken three days to repair. The story worked perfectly, because they did not know whether such a repair ought to take three days. I could have called the broken thing a bolt head, and that would have worked just as well.
        - id: ch01-b60
          speaker: huck
          text: After that, I felt comfortable on one side and mighty uncomfortable on the other. Pretending to be Tom Sawyer was easy enough. It stayed easy until I heard a steamboat coughing its way down the river.
        - id: ch01-b61
          speaker: huck
          text: Then I thought, what if Tom Sawyer is on that boat? What if he walks in here and calls out my name before I can wink at him to keep quiet? I could not allow that. I had to go up the road and stop him first.
        - id: ch01-b62
          speaker: huck
          text: I told the family I should go into town and bring back my baggage. The old gentleman offered to come with me. I said there was no need. I could drive the horse well enough myself, and I would rather he did not trouble himself on my account.
