audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    aunt_sally:
      display_name: 萨莉姨妈
      tts:
        delivery: 热情爽快，忙忙碌碌，喜怒全写在声音里
        timbre: 成熟朴实
        pace: 轻快
        pitch: 中高
    uncle_silas:
      display_name: 赛拉斯姨父
      tts:
        delivery: 老实温和，忧虑时认真而迟疑
        timbre: 年长柔和
        pace: 舒缓
        pitch: 中低
    lize:
      display_name: 莉兹
      tts:
        delivery: 干练直爽，嗓门响亮
        timbre: 成熟有力
        pace: 利落
        pitch: 中
  chapters:
    - id: ch01
      title: 第三十二章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我走到费尔普斯家时，四周静得像个礼拜日。天气又热，阳光又亮，雇工们全都下地去了。只有虫子和苍蝇在空中低低地嗡嗡叫，听着像所有人都死了，整个世界只剩下我。微风一来，树叶轻轻发颤，又像死去多年的鬼魂在私语，而且谈的偏偏就是我。待在这种地方，人会觉得自己不如也死了算了，从此一了百了。
        - id: ch01-b02
          speaker: huck
          text: 费尔普斯家是座寒酸的小棉花种植园，跟附近那些地方几乎一个模样。木栅栏围着两英亩大的院子。几截圆木竖在栅栏旁，高高低低，既能当台阶翻过去，女人上马时也能踩在上面。院子里只有几小片病恹恹的草，大部分地方又秃又光，像顶磨掉了绒毛的旧帽子。
        - id: ch01-b03
          speaker: huck
          text: 白人住的大双连木屋拿削平的原木搭成，缝里塞着泥巴或灰浆，那些一道道的泥缝从前还刷过白。正屋和圆木厨房之间，有条很宽的过道，头上有顶，两边敞开。厨房后面是木头熏肉房，再过去并排立着三间黑人住的小木屋。后栅栏边还有一间孤零零的小棚子，旁边放着草木灰槽和熬肥皂的大锅。另一头更远的地方，还散着几间附属小屋。
        - id: ch01-b04
          speaker: huck
          text: 厨房门口有张长凳，上面摆着水桶和葫芦瓢。一条猎犬晒着太阳睡觉，附近还躺着好几条。院角有三棵遮阴树，栅栏旁长着醋栗和鹅莓。栅栏外是菜园和西瓜地，接着是棉田，棉田尽头就是树林。
        - id: ch01-b05
          speaker: huck
          text: 我绕到后面，从草木灰槽旁翻进院子，朝厨房走。才走几步，就听见纺车低低作响。那声音一阵高，一阵低，像在不停呜咽。我听着它，越发确信自己真想死。世上再没有比纺车更凄凉的声音了。
        - id: ch01-b06
          speaker: huck
          text: 我没想出什么办法，只管往前走。我相信时候一到，上天自然会把合适的话塞进我嘴里。照我的经验，只要我不去多管，上天总会这么办。
        - id: ch01-b07
          speaker: huck
          text: 走到院子中央，一条猎犬忽然爬起来扑向我，另一条也跟了上来。我只好停住脚，面对着它们，一动不动。它们闹出的动静可真够大的。不到一眨眼的工夫，十五条狗已经挤成一圈，把我围在正中。那样子就像我是车轴，它们是轮辐。每一条都伸长脖子，仰着鼻子，冲我又叫又嚎。更多的狗还从四面赶来，有的跃过栅栏，有的绕出墙角，简直像在飞。
        - id: ch01-b08
          speaker: huck
          text: 一个黑人妇女举着擀面杖从厨房飞奔出来，扯开嗓子赶狗。
        - id: ch01-b09
          speaker: lize
          text: 滚开，泰格！斯波特，你也滚！快走，先生！
          emotion: angry
        - id: ch01-b10
          speaker: huck
          text: 她用擀面杖一下打这条，一下敲那条，把它们打得嚎叫着逃开，其他的狗也跟着跑了。可才过一转眼，其中一半又摇着尾巴回来，在我身边转来转去，跟我交起朋友。猎犬嘛，终归没有什么坏心眼。
        - id: ch01-b11
          speaker: huck
          text: 莉兹身后出来一个黑人小姑娘和两个黑人小男孩。他们身上除了粗麻布衬衫，什么也没穿。三个人揪住母亲的裙子，害羞地躲在背后偷看我，小孩子常是这个样子。正屋里也跑出一个白人妇女，四十五到五十岁，没戴帽子，手里还握着纺线杆。她的几个孩子跟在后面，举动跟莉兹的孩子一模一样，也一个个躲躲闪闪地看我。
        - id: ch01-b12
          speaker: huck
          text: 那妇女满脸都是笑，欢喜得几乎站不住。
        - id: ch01-b13
          speaker: aunt_sally
          text: 真的是你！你总算来啦，对不对？
          emotion: happy
        - id: ch01-b14
          speaker: huck
          text: 对，太太。
        - id: ch01-b15
          speaker: huck
          text: 这句话没经过脑子就溜了出来。她一把抱紧我，又抓着我的两只手摇个不停。她眼里涌出泪来，顺着脸直往下流，怎么抱我、怎么摇我都嫌不够。
        - id: ch01-b16
          speaker: aunt_sally
          text: 你长得没有我想的那么像你妈，可老天爷呀，我才不管这个！见到你，我真是太高兴了。哎呀，哎呀，恨不得一口把你吞下去！孩子们，这是你们的汤姆表哥，快来跟他问好。
          emotion: happy
        - id: ch01-b17
          speaker: huck
          text: 孩子们却低着头，把手指塞进嘴里，全躲到她身后去了。她也不等他们，接着又忙起来。
        - id: ch01-b18
          speaker: aunt_sally
          text: 莉兹，赶紧给他做顿热早饭。等等，你在船上吃过没有？
        - id: ch01-b19
          speaker: huck
          text: 我说已经吃过。她牵着我的手进屋，孩子们一路跟在后边。她让我坐上一把藤条座椅，自己坐在对面的矮凳上，两只手还是紧紧握着我。
        - id: ch01-b20
          speaker: aunt_sally
          text: 现在可得让我好好看看你。这么多年，我不知盼过多少回，今天终于见着啦！我们等了你两天还不止。你怎么耽搁了？船搁浅啦？
        - id: ch01-b21
          speaker: huck
          text: 是的，太太，船是搁浅了。
        - id: ch01-b22
          speaker: aunt_sally
          text: 别叫太太，要叫萨莉姨妈。你们在哪儿搁浅的？
        - id: ch01-b23
          speaker: huck
          text: 这可难住了我。我连那条船该往上游开，还是往下游开都不知道。我办事多半靠直觉，直觉告诉我，它是从新奥尔良那边往上游来的。可这也帮不了多少忙，因为那一带的沙洲我一个也叫不出名字。要么现编一个，要么装作忘了我们搁浅的那一处叫什么。就在这时候，我总算想出一个说法。
        - id: ch01-b24
          speaker: huck
          text: 不是搁浅耽误了我们，那件事没费多少工夫。是船上的汽缸盖炸了。
        - id: ch01-b25
          speaker: aunt_sally
          text: 老天爷呀！有人伤着没有？
          emotion: surprised
        - id: ch01-b26
          speaker: huck
          text: 没有，太太。只死了一个黑人。
        - id: ch01-b27
          speaker: aunt_sally
          text: 那还算幸运，有时候真会伤到人的。前年圣诞节，你赛拉斯姨父坐老《拉莉·鲁克号》从新奥尔良往上游走，汽缸盖也炸了，还把一个人炸成了残废。我想那人后来死了。他是个浸礼会教徒。你姨父认识巴吞鲁日的一户人家，那一家跟那人的家里人又很熟。
        - id: ch01-b28
          speaker: aunt_sally
          text: 对，我想起来了，那个人确实死了。伤口生了坏疽，医生只好给他截肢，可还是没把他救回来。没错，就是坏疽。他浑身都变蓝了，临死还盼着将来得到荣耀的复活。听说那模样真叫人不忍心看。你姨父这些天每天都进镇接你。今天也去了，不到一个钟头前才走，随时都会回来。路上你准碰见他了吧？就是个上了年纪的男人，你该认得。
        - id: ch01-b29
          speaker: huck
          text: 没有，我谁也没看见，萨莉姨妈。船天一亮就靠岸了。我把行李留在码头船上，在镇里和乡下转了一阵，消磨消磨时间，免得来得太早。所以最后是从后面这条路过来的。
        - id: ch01-b30
          speaker: aunt_sally
          text: 你的行李交给谁了？
        - id: ch01-b31
          speaker: huck
          text: 没交给谁。
        - id: ch01-b32
          speaker: aunt_sally
          text: 哎呀，孩子，那不是会让人偷走吗？
        - id: ch01-b33
          speaker: huck
          text: 我藏得很妥当，应该没人偷得到。
        - id: ch01-b34
          speaker: aunt_sally
          text: 船上怎么那么早就有早饭吃？
        - id: ch01-b35
          speaker: huck
          text: 我知道自己已经踩上了薄冰，可还是只能继续编。船长看见我在那里闲站着，就说下船以前最好吃点东西。他把我带进上层舱房，让我跟船上的官员一起吃早饭，想吃多少都行。
        - id: ch01-b36
          speaker: huck
          text: 我越来越不安，萨莉姨妈说什么都快听不见了。我始终盯着那几个孩子，只想找机会把他们叫到一边，套几句话，弄明白自己冒充的到底是谁。可萨莉姨妈的话像河水一样没完没了，我连一点机会也找不到。忽然，她说出的下一句话，让我背上从上到下直冒冷汗。
        - id: ch01-b37
          speaker: aunt_sally
          text: 瞧我们说了这么久，你还没提姐姐，也没说家里其他人。现在换我歇歇嘴，你来说。每一个人的事情都得告诉我。他们身体好不好，在忙什么，托你带了什么话。只要想得起来，一样也别漏掉。
        - id: ch01-b38
          speaker: huck
          text: 这回我真的走投无路了，而且堵得结结实实。上天一路帮我混到这里，现在却把我这条船死死搁在了浅滩上。硬撑着往前开已经没有一点用，我只能举手认输，冒险把真话说出来。我刚一张嘴，她忽然抓住我，匆匆把我塞到了床后。
        - id: ch01-b39
          speaker: aunt_sally
          text: 他回来啦！把头再低一点。对，就是这样，谁也看不见你。别让他知道你在这儿，我要捉弄他一下。孩子们，你们也不许出声。
          emotion: happy
        - id: ch01-b40
          speaker: huck
          text: 我又掉进了一个麻烦里，可发愁也没用。眼下除了安安静静躲好，什么也做不了。我只能打起精神，等雷劈下来时再想办法闪开。老先生进门时，我只来得及瞥他一眼，床便把他挡住了。萨莉姨妈马上迎了过去。
        - id: ch01-b41
          speaker: aunt_sally
          text: 他来了吗？
        - id: ch01-b42
          speaker: uncle_silas
          text: 没有。
        - id: ch01-b43
          speaker: aunt_sally
          text: 老天爷呀！那孩子到底出了什么事？
          emotion: fearful
        - id: ch01-b44
          speaker: uncle_silas
          text: 我也想不明白。老实说，我实在担心得厉害。
        - id: ch01-b45
          speaker: aunt_sally
          text: 只是担心？我都快急疯了！他一定已经到了，是你在路上错过了他。准是这么回事，我心里就是知道。
          emotion: fearful
        - id: ch01-b46
          speaker: uncle_silas
          text: 萨莉，我不可能在路上错过他，这一点你也清楚。
        - id: ch01-b47
          speaker: aunt_sally
          text: 可姐姐会怎么说呢？他一定已经到了！一定是你没看见他！
          emotion: fearful
        - id: ch01-b48
          speaker: uncle_silas
          text: 别再让我更难受了，我已经够难受的啦。我一点办法都没有，也不怕承认自己真有些害怕。可他绝不会到了却没被我看见。萨莉，这事太可怕了。那条船一定出了事！
          emotion: fearful
        - id: ch01-b49
          speaker: aunt_sally
          text: 赛拉斯！快看那边，大路上不是有人来了吗？
          emotion: surprised
        - id: ch01-b50
          speaker: huck
          text: 他立刻冲到床头的窗边。萨莉姨妈趁机弯下腰，从床脚把我拖了出来。赛拉斯姨父转过身时，她正笑得像一团旺火，我却满头是汗，老老实实站在旁边。他瞪着我，满脸不明白。
        - id: ch01-b51
          speaker: uncle_silas
          text: 咦，这是谁？
        - id: ch01-b52
          speaker: aunt_sally
          text: 你猜猜看呀。
        - id: ch01-b53
          speaker: uncle_silas
          text: 我哪里猜得到？到底是谁？
        - id: ch01-b54
          speaker: aunt_sally
          text: 是汤姆·索亚！
          emotion: happy
        - id: ch01-b55
          speaker: huck
          text: 我的老天，我差点一头塌进地板底下。可这时候根本没空跟人换刀子、套交情。老先生抓住我的手使劲摇，而且一直不肯松开。萨莉姨妈则在旁边又蹦、又笑、又哭。接着两个人一齐问起锡德、玛丽，还有索亚家里其他那一大群人，问题一个接着一个。
        - id: ch01-b56
          speaker: huck
          text: 不过，他们再高兴也比不上我。我终于知道自己该是谁了，高兴得像重新投胎活了一回。他们紧紧缠住我，足足问了两个钟头。等我的下巴累得快动不了时，我已经说出一大堆索亚家的事情。那些事情当然全是编的，哪怕六个索亚家合在一起，也经历不了那么多。
        - id: ch01-b57
          speaker: huck
          text: 我还说，汽缸盖是在白河河口炸坏的，修了三天才好。这个说法很管用，因为他们也不知道汽缸盖到底要修几天。其实就算我说坏的是螺栓头，也一样能蒙混过去。
        - id: ch01-b58
          speaker: huck
          text: 现在，我从一边看觉得舒舒服服，从另一边看又很不自在。冒充汤姆·索亚又容易又安稳，而且一直都很容易、很安稳。可没过多久，我听见一艘汽船咳嗽着顺河开下来。要是汤姆本人就在那条船上呢？要是他随时走进这间屋子，在我来得及使眼色、叫他别说话以前，一嗓子喊出我的名字呢？那可绝对不行。
        - id: ch01-b59
          speaker: huck
          text: 我不能让这种事发生，必须先到大路上截住汤姆。于是我跟他们说，自己要进镇把行李取回来。赛拉斯姨父本想陪我一起去，我赶紧告诉他不用。我自己会赶马，也宁愿让他留在家里，不必再为我多费事。
