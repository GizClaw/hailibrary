audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
    aunt_sally:
      display_name: 萨莉姨妈
      tts:
        delivery: 爽直泼辣，生气时连珠炮一般咄咄逼人
        timbre: 明亮而有穿透力的成年女声
        pace: 偏快
        pitch: 中高
    farmer_1:
      display_name: 农场主甲
      tts:
        delivery: 急躁强硬，说话直截了当
        timbre: 粗哑的成年男声
        pace: 偏快
        pitch: 中低
    farmer_2:
      display_name: 农场主乙
      tts:
        delivery: 谨慎而紧绷，压低声音发号施令
        timbre: 厚重的成年男声
        pace: 稳健
        pitch: 低
    farmer_3:
      display_name: 农场主丙
      tts:
        delivery: 警觉凶狠，喊话短促有力
        timbre: 洪亮的成年男声
        pace: 急促
        pitch: 中
    farmer_4:
      display_name: 农场主丁
      tts:
        delivery: 粗豪急切，追赶时气息紧迫
        timbre: 沙哑的成年男声
        pace: 很快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第四十章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 早饭后，我和汤姆心情很好，便带上午饭，划独木舟过河钓鱼。我们又去看了木筏，见什么毛病也没有。等回家吃晚饭时，已经很晚了。全家人急得团团转，饭一吃完就催我们上床，却不肯说出了什么事，更不提那封新信。其实他们说不说都一样，事情我们全知道。
        - id: ch01-b02
          speaker: huck
          text: 上楼才上到一半，趁萨莉姨妈转过身，我们便溜到地窖的食品柜，装了满满一顿好吃的带回房，然后才上床。到十一点半左右，我们又悄悄爬起来。汤姆套上从萨莉姨妈那里偷来的长袍，正要带着食物出门，忽然想起一件事。
        - id: ch01-b03
          speaker: tom
          text: 黄油到哪儿去了？
        - id: ch01-b04
          speaker: huck
          text: 我切了一大块，放在一块玉米饼上了。
        - id: ch01-b05
          speaker: tom
          text: 那就是还放在那里，你没拿来。这儿没有。
        - id: ch01-b06
          speaker: huck
          text: 没有黄油也能凑合。
        - id: ch01-b07
          speaker: tom
          text: 有黄油照样能凑合。你快下地窖去拿，再顺着避雷针下来跟上我。我先拿稻草塞进吉姆的衣服，装成他乔装过的母亲。等你一来，我学绵羊叫一声，咱们就走。
        - id: ch01-b08
          speaker: huck
          text: 汤姆走了，我下到地窖。那块拳头大的黄油果然还在我放下的地方。我端起盛着黄油的玉米饼，吹灭灯，蹑手蹑脚往楼上走。一路顺利到了正屋这一层，萨莉姨妈却举着蜡烛迎面过来。我赶紧把玉米饼和黄油塞进帽子，再把帽子扣到头上。下一刻，她已经看见我了。
        - id: ch01-b09
          speaker: aunt_sally
          text: 你刚才去地窖了？
        - id: ch01-b10
          speaker: huck
          text: 是的，姨妈。
        - id: ch01-b11
          speaker: aunt_sally
          text: 你下去干什么？
        - id: ch01-b12
          speaker: huck
          text: 什么也没干。
        - id: ch01-b13
          speaker: aunt_sally
          text: 什么也没干？那你半夜跑下去干吗？
          emotion: angry
        - id: ch01-b14
          speaker: huck
          text: 我不知道，姨妈。
        - id: ch01-b15
          speaker: aunt_sally
          text: 你不知道？别这么回答我。汤姆，我问你，你刚才究竟在下面做了什么？
          emotion: angry
        - id: ch01-b16
          speaker: huck
          text: 我真的什么也没干，萨莉姨妈，我敢对老天发誓。
        - id: ch01-b17
          speaker: huck
          text: 我以为她会放我走，平常她也会。可最近怪事太多，稍有一点儿不对劲，她便急得出汗。她这回说得非常坚决。
        - id: ch01-b18
          speaker: aunt_sally
          text: 你现在就进起居室，待在那里等我。你准又做了不该做的事，我非查清楚不可。
          emotion: angry
        - id: ch01-b19
          speaker: huck
          text: 她走开了。我一进起居室，差点儿吓坏。里面有十五个农场主，人人拿着枪。我难受得要命，缩着身子挪到椅子上坐下。他们有几个在低声交谈，所有人都坐立不安，又偏要装作没事。他们不断摘下帽子，再戴回去，一会儿挠头，一会儿换座位，还不停摆弄衣扣。我也很不安，可我的帽子无论如何不能摘。
        - id: ch01-b20
          speaker: huck
          text: 我只盼萨莉姨妈快回来。她想揍我也行，只要赶紧了结，让我去告诉汤姆，我们闹得太过火，已经捅了个大马蜂窝。得马上停止胡闹，趁这伙人还没等烦，赶紧带吉姆逃走。
        - id: ch01-b21
          speaker: huck
          text: 姨妈终于回来，接连追问我。我一句也答不好，连自己哪头朝上都不知道。那些男人也越来越坐不住。有人说，离午夜只剩几分钟，不如立刻去埋伏。另一些人却叫大家沉住气，等绵羊叫的暗号。姨妈偏偏还在不停问。我吓得浑身发抖，几乎要瘫在地上。屋里越来越热，帽子里的黄油开始融化，顺着脖子和耳朵后面往下流。
        - id: ch01-b22
          speaker: farmer_1
          text: 我主张现在就进小屋藏好。等那帮人一来，咱们当场抓住他们。
        - id: ch01-b23
          speaker: huck
          text: 听见这话，我差点儿倒下。正好有一道黄油从额头淌下来。萨莉姨妈看见以后，脸一下子白得像纸。
        - id: ch01-b24
          speaker: aunt_sally
          text: 老天爷呀，这孩子是怎么了？他准得了脑炎，脑浆都流出来了！
          emotion: fearful
        - id: ch01-b25
          speaker: huck
          text: 所有人都跑来看。姨妈一把扯掉我的帽子，玉米饼和剩下的黄油立刻掉了出来。她紧紧抱住我。
        - id: ch01-b26
          speaker: aunt_sally
          text: 哎哟，你真把我吓死了！幸好没出更坏的事，我可真是谢天谢地。咱们最近运气太背，祸事总是成群地来。我看见那东西，还以为连你也保不住了。它的颜色和样子都像脑浆，要是……哎呀，你怎么不早说下地窖是为了拿这个？你要说了，我根本不会在意。现在快上床去，明早以前不许再让我看见你！
        - id: ch01-b27
          speaker: huck
          text: 我一转眼便上了楼，又顺着避雷针滑下去，摸黑跑向小屋的披棚。我急得几乎讲不出话，只能赶快告诉汤姆，我们必须马上走，一分钟也不能等。屋里全是带枪的人。
        - id: ch01-b28
          speaker: tom
          text: 真的？这不是棒极了吗！哈克，要是再来一回，我敢说能招来两百个人！要是咱们能拖到……
          emotion: happy
        - id: ch01-b29
          speaker: huck
          text: 快点，快点！吉姆在哪里？
        - id: ch01-b30
          speaker: tom
          text: 就在你身边，伸手便摸得到。他换好了衣服，什么都准备妥当。现在咱们溜出去，发绵羊叫的暗号。
        - id: ch01-b31
          speaker: huck
          text: 可就在这时，一群人的脚步直奔门口。他们开始摸索挂锁，我们又听见一个男人开了口。
        - id: ch01-b32
          speaker: farmer_2
          text: 我早说咱们来早了。他们还没到，门也锁着。我把几个人锁进小屋，你们藏在黑地里，等他们进来就杀掉。其余的人散开些，听听他们是不是来了。
        - id: ch01-b33
          speaker: huck
          text: 他们进来时，黑暗中根本看不见我们。我们慌忙往床下钻，差点儿被他们一脚踩中。好在我们及时躲进床底，又从洞口飞快爬了出去，一点声音也没弄出来。照汤姆的命令，吉姆最先，我跟在中间，汤姆最后。到了披棚，外面的脚步声就在附近。我们悄悄挪到门边，汤姆叫大家停住，把眼睛贴上门缝。可天实在太黑，他什么也看不见。
        - id: ch01-b34
          speaker: huck
          text: 他压低声音说，要先等脚步走远。等他碰我们一下，吉姆第一个溜出去，他自己仍旧最后走。汤姆把耳朵贴在门缝上，听了又听，外面的脚步一直擦着地面来回走。最后，他终于碰了我们一下。我们这才溜出门，弯下腰，屏住气，一点儿声音也不敢出，一个跟一个悄悄挪向篱笆。
        - id: ch01-b35
          speaker: huck
          text: 我和吉姆都翻了过去，汤姆的裤子却被横木顶端的尖刺勾住了。脚步声已经靠近，他只好猛地一挣。木刺啪的一声折断。汤姆刚落下来，跟着我们要跑，后面便有人大喊。
        - id: ch01-b36
          speaker: farmer_3
          text: 谁在那里？回答，不然我开枪了！
        - id: ch01-b37
          speaker: huck
          text: 我们一声不答，撒腿就跑。后面的人猛冲过来，砰砰砰连开几枪。子弹嗖嗖地从身边飞过。
        - id: ch01-b38
          speakers: [farmer_3, farmer_4]
          ensemble: duo
          text: 他们在这里！往河边逃了！弟兄们快追，把狗放出来！
        - id: ch01-b39
          speaker: huck
          text: 他们全速追了上来。我们听得见他们，因为他们脚上穿着靴子，还一路扯着嗓子喊。我们没穿靴子，也不出声。那时大家正跑在通往磨坊的小路上。等他们快要追到时，我们突然闪进灌木丛，让整伙人从身边冲过去，然后又落在他们后面继续跑。
        - id: ch01-b40
          speaker: huck
          text: 为了不惊跑强盗，他们先前把狗全关了起来。这时有人把狗放出，它们一路赶来，闹出的动静简直够一百万只狗用。可那些都是我们认识的狗。我们索性站住，等它们追上来。它们一看只是我们，又没什么热闹可凑，便随便打声招呼，朝着前面的喊叫和喧闹猛冲过去。我们也重新加足力气，跟在后面飞奔，一直跑到磨坊附近。
        - id: ch01-b41
          speaker: huck
          text: 快到磨坊时，我们穿过灌木，找到系着的独木舟。大家一跃上船，拼命朝河心划，却只弄出非有不可的一点儿声响。到了河上，我们才放慢速度，舒舒服服地驶向停木筏的小岛。沿岸到处有人喊，也有狗叫，彼此吵成一片。直到我们走得很远，那些声音才渐渐模糊，最后完全消失。踏上木筏，我终于能对吉姆说出那句话。
        - id: ch01-b42
          speaker: huck
          text: 老吉姆，你现在又自由了。我敢说，以后你再也不会当奴隶。
          emotion: happy
        - id: ch01-b43
          speaker: jim
          text: 这事真是办得漂亮，哈克！计划得漂亮，做得也漂亮。天下再没有谁想得出这么曲折、这么了不起的计划啦。
          emotion: happy
        - id: ch01-b44
          speaker: huck
          text: 我们全都高兴到了极点。可汤姆比谁都高兴，因为一颗子弹打中了他的小腿肚。我和吉姆一听这话，马上不再像刚才那么神气了。他疼得相当厉害，伤口也一直在流血。我们赶紧把他安置在木筏的窝棚里，又撕开公爵留下的一件衬衫，打算拿布条替他包扎。
        - id: ch01-b45
          speaker: tom
          text: 把布条给我，我自己能包。别停，别在这儿磨蹭，逃跑正进行得这么漂亮！快操桨，把木筏放出去！伙计们，这一回咱们真是办得出色，漂亮极了！要是当年路易十六交给咱们，他的传记里才不会写什么“圣路易之子，升入天堂吧”。不，先生，咱们早就把他赶过边境，而且办得干脆利落，半点儿也不费事。快操桨，快操桨呀！
          emotion: happy
        - id: ch01-b46
          speaker: huck
          text: 我和吉姆没有动。我们正在商量，也在仔细想这件事。过了一会儿，我让吉姆把话说出来。
        - id: ch01-b47
          speaker: jim
          text: 哈克，我是这样想的。要是获救的是汤姆少爷，咱们有个人中了枪，他会不会说：“别管医生，只管救我，那个人不用救”？汤姆·索亚少爷绝不会说这种话。那么吉姆会说吗？不会，先生。医生不来，我一步也不走，哪怕要等四十年！
        - id: ch01-b48
          speaker: huck
          text: 我知道吉姆的心是白的，也早料到他会这样说。事情就这么定了。我告诉汤姆，我要去请医生。他为这件事大吵大闹，可我和吉姆坚持不肯让步。汤姆便要自己爬出去，亲手解开木筏，我们还是不许。他气得狠狠数落了我俩一通，可依旧没有半点用处。
        - id: ch01-b49
          speaker: huck
          text: 他看见我在准备独木舟，只好换了个主意。
        - id: ch01-b50
          speaker: tom
          text: 好吧，你非去不可，就照我说的做。到了村里，先关上门，把医生的眼睛蒙严，再让他发誓守口如瓶，往他手里塞一袋金币。趁天黑领他在后巷到处绕，再让他坐独木舟，绕着岛子走弯路，把他带到这里。还得搜他的身，把粉笔拿走，送他回村后再还。不然，他会给木筏做记号，以后就能找到。大家都是这么办的。
        - id: ch01-b51
          speaker: huck
          text: 我答应照办，便划着独木舟离开。我们已经说好，等医生来了，吉姆就躲进树林，等人走后再出来。
