  chapters:
    - id: ch01
      title: CHAPTER XL.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: After breakfast, Tom and I felt mighty pleased with ourselves. We took my canoe across the river, carried a lunch, and spent the day fishing. We checked the raft too, and it was all right. But when we came home late for supper, everybody was so worried they hardly knew which end was up. As soon as we finished eating, they sent us straight to bed. Nobody told us what was wrong, and nobody mentioned the new letter. They did not have to. We knew as much about it as anybody.
        - id: ch01-b02
          speaker: huck
          text: We got halfway upstairs, waited until Aunt Sally turned her back, and slipped to the cellar cupboard. We packed a good lunch, carried it to our room, and went to bed. Around half past eleven, we got up again. Tom put on the dress he had stolen from Aunt Sally and picked up the food. Then he noticed something missing.
        - id: ch01-b03
          speaker: tom
          text: Where's the butter?
        - id: ch01-b04
          speaker: huck
          text: I set out a big piece on some cornbread.
        - id: ch01-b05
          speaker: tom
          text: Well, you left it sitting there, because it isn't here now.
        - id: ch01-b06
          speaker: huck
          text: We can manage without it.
        - id: ch01-b07
          speaker: tom
          text: We can manage with it too. Slip down to the cellar and bring it. Then climb down the lightning rod and come along. I'll stuff straw into Jim's clothes so it looks like his mother came in disguise. When you get there, I'll be ready to bleat like a sheep, and we'll move.
        - id: ch01-b08
          speaker: huck
          text: Tom left, and I went down to the cellar. The butter was right where I had put it, a piece as big as a fist sitting on a slab of cornbread. I picked it up, blew out my light, and crept upstairs. I reached the main floor safely. Then Aunt Sally came toward me with a candle. I shoved the cornbread and butter into my hat, pulled the hat onto my head, and she saw me the very next second.
        - id: ch01-b09
          speaker: aunt_sally
          text: Have you been down in the cellar?
        - id: ch01-b10
          speaker: huck
          text: Yes'm.
        - id: ch01-b11
          speaker: aunt_sally
          text: What were you doing down there?
        - id: ch01-b12
          speaker: huck
          text: Nothing.
        - id: ch01-b13
          speaker: aunt_sally
          text: Nothing?
        - id: ch01-b14
          speaker: huck
          text: No'm.
        - id: ch01-b15
          speaker: aunt_sally
          text: Then what made you go down there at this hour?
        - id: ch01-b16
          speaker: huck
          text: I don't know, ma'am.
        - id: ch01-b17
          speaker: aunt_sally
          text: You don't know? Don't you answer me like that. Tom, I want the truth. What have you been doing down there?
        - id: ch01-b18
          speaker: huck
          text: I haven't done one single thing, Aunt Sally. I truly haven't.
        - id: ch01-b19
          speaker: huck
          text: Usually that would have satisfied her. But so many strange things had happened that anything the least bit crooked made her worry. This time her answer was firm.
        - id: ch01-b20
          speaker: aunt_sally
          text: March into the sitting room and stay there until I come. You've been doing something you had no business doing, and before I'm through, I'll find out what it was.
        - id: ch01-b21
          speaker: huck
          text: She went away, and I opened the sitting-room door. My, what a crowd! Fifteen farmers sat inside, every one of them carrying a gun. I felt powerful sick. I slunk over to a chair and sat down. Some of the men talked quietly, but all of them were restless while pretending not to be. They kept taking off their hats and putting them back on. They scratched their heads, changed chairs, and fumbled with their buttons. I was uneasy too, but I never took off my hat.
        - id: ch01-b22
          speaker: huck
          text: I wished Aunt Sally would hurry back. She could question me and whip me too, if she wanted, as long as she let me go afterward. I had to tell Tom we had carried our game too far. We had stirred up a thundering hornets' nest, and we needed to stop fooling around and get Jim away before those men lost patience and came after us.
        - id: ch01-b23
          speaker: huck
          text: At last Aunt Sally returned and started asking questions. I could not give her a straight answer. I hardly knew which end of me was up. The men were growing more restless. Some wanted to leave at once and wait for the desperadoes because midnight was only minutes away. Others wanted everyone to hold back until they heard the sheep signal. Aunt Sally kept after me while I shook all over, scared enough to drop.
        - id: ch01-b24
          speaker: huck
          text: The room grew hotter and hotter. The butter under my hat began melting. It ran down my neck and behind my ears. Then one farmer said he meant to hide in the cabin right away and catch the robbers when they came. I nearly collapsed. A streak of butter trickled over my forehead, and Aunt Sally saw it. Her face went white.
        - id: ch01-b25
          speaker: aunt_sally
          text: Good land, what's wrong with this child? It's brain fever, sure as you're born, and his brains are oozing out!
          emotion: fearful
        - id: ch01-b26
          speaker: huck
          text: Everybody rushed over. Aunt Sally snatched off my hat, and out fell the cornbread and whatever butter had not melted. She grabbed me and hugged me.
        - id: ch01-b27
          speaker: aunt_sally
          text: Oh, what a fright you gave me! I'm so thankful it isn't worse. Luck has been against us, and one trouble keeps following another. When I saw that stuff running down, I thought we'd lost you. The color looked just like your brains would look if—oh, dear! Why didn't you tell me you went down for food? I wouldn't have cared. Now clear out to bed, and don't let me see you again until morning!
        - id: ch01-b28
          speaker: huck
          text: I was upstairs in one second and down the lightning rod in the next. Then I tore through the dark toward the lean-to. I was so anxious I could hardly get the words out, but I told Tom as fast as I could that we had to move now. There was not one minute to spare. The house was full of men with guns.
        - id: ch01-b29
          speaker: huck
          text: Tom's eyes began to blaze.
        - id: ch01-b30
          speaker: tom
          text: No! Is that true? Huck, that's splendid! If we could start over, I bet I could bring two hundred men. If only we could put it off until—
          emotion: happy
        - id: ch01-b31
          speaker: huck
          text: Hurry, hurry! Where's Jim?
        - id: ch01-b32
          speaker: tom
          text: He's right beside you. Reach out and you can touch him. He's dressed and ready. Now we'll slip outside, give the sheep signal, and go.
        - id: ch01-b33
          speaker: huck
          text: Before we could move, we heard men tramping toward the door. They began fumbling with the padlock, and one of them spoke.
        - id: ch01-b34
          speaker: farmer_1
          text: I told you we'd be here too early. They haven't come yet, because the door is still locked. I'll shut some of you inside the cabin. Wait in the dark and kill them when they come. The rest of you spread out nearby and listen for them.
        - id: ch01-b35
          speaker: huck
          text: The men came in, but the cabin was too dark for them to see us. They almost stepped on us while we scrambled under the bed. We made it underneath, then slipped through the hole, quick and quiet. Jim went first, I followed, and Tom came last, just as Tom had ordered.
        - id: ch01-b36
          speaker: huck
          text: We were in the lean-to now, with footsteps close outside. We crept to the door. Tom stopped us and pressed his eye to a crack, but the night was too dark to make out anything. He whispered that he would wait until the steps moved farther away. When he nudged us, Jim must go first and Tom would follow last.
        - id: ch01-b37
          speaker: huck
          text: Tom put his ear to the crack. He listened and listened while boots kept scraping around outside. At last he nudged us. We slid through the door and crouched low. We hardly breathed. Without making the smallest sound, we moved toward the fence in single file.
        - id: ch01-b38
          speaker: huck
          text: We reached it safely. Jim and I climbed over, but Tom's trousers caught on a splinter along the top rail. He heard footsteps coming and had to yank himself loose. The splinter snapped with a crack. Tom dropped down behind us and started running. Somebody shouted from the darkness.
        - id: ch01-b39
          speaker: farmer_2
          text: Who's there? Answer me, or I'll shoot!
        - id: ch01-b40
          speaker: huck
          text: We gave no answer. We just turned our heels loose and ran. Men rushed after us. Guns went bang, bang, bang, and bullets whizzed all around.
        - id: ch01-b41
          speakers: [farmer_1, farmer_2, farmer_3, farmer_4]
          ensemble: chorus
          text: There they go! They're running for the river! After them, boys! Turn the dogs loose!
        - id: ch01-b42
          speaker: huck
          text: They came at full speed. We could hear them because they wore boots and yelled. We had no boots, and we kept quiet. We were on the mill path. When the men got close, we dodged into the brush and let them thunder past. Then we slipped out behind them.
        - id: ch01-b43
          speaker: huck
          text: The dogs had been shut up so they would not scare away the robbers. Now somebody let them loose. They came making enough noise for a million dogs. But they were our dogs, so we stopped and waited for them. When they reached us and saw only their old friends, with no excitement to offer, they gave us a quick hello and raced on toward all the yelling and clattering.
        - id: ch01-b44
          speaker: huck
          text: We started running again and flew along behind them. Near the mill, we cut through the brush to the place where my canoe was tied. We jumped in and pulled hard for the middle of the river, making no more noise than we had to. Once we were out there, we turned toward the island where the raft waited and paddled easy. Along the bank, men shouted and dogs barked at one another. The farther we went, the fainter it all became, until every sound died away.
        - id: ch01-b45
          speaker: huck
          text: We stepped onto the raft, and I turned to Jim.
        - id: ch01-b46
          speaker: huck
          text: Now you're a free man again, Jim. And I bet nobody will ever make you a slave again.
          emotion: happy
        - id: ch01-b47
          speaker: jim
          text: And a mighty fine job it was, Huck. The plan was beautiful, and we carried it out beautiful too. Nobody but Tom Sawyer could make up a plan so mixed-up and splendid.
          emotion: happy
        - id: ch01-b48
          speaker: huck
          text: We were all as glad as we could be. Tom was the gladdest of anybody, because a bullet had gone into the calf of his leg.
        - id: ch01-b49
          speaker: huck
          text: When Jim and I heard that, we stopped feeling so bold. Tom was hurting badly, and his leg was bleeding. We laid him inside the wigwam and tore up one of the duke's shirts for a bandage. Tom reached for the cloth.
        - id: ch01-b50
          speaker: tom
          text: Give me those rags. I can bandage it myself. Don't stop now, and don't fool around while the escape is going so handsome. Get on the sweeps and turn the raft loose! Boys, we did it elegantly. We surely did. I wish we'd been in charge of Louis the Sixteenth. His story would never have said, “Son of Saint Louis, ascend to heaven!” No, sir. We'd have rushed him across the border as neat as anything. Now man the sweeps! Man the sweeps!
          emotion: happy
        - id: ch01-b51
          speaker: huck
          text: Jim and I did not move. We put our heads together and thought it over. After a minute, I looked at Jim.
        - id: ch01-b52
          speaker: huck
          text: Go ahead, Jim. Say what you're thinking.
        - id: ch01-b53
          speaker: jim
          text: All right, Huck. Suppose Tom was the one being set free, and one of us boys got shot. Would Tom say, “Keep going and save me. Never mind getting a doctor for him”? Does that sound like Tom Sawyer? Would he ever say such a thing? You know he wouldn't. Well, is Jim going to say it? No, sir. I won't move one step away from here without a doctor, not if it takes forty years!
        - id: ch01-b54
          speaker: huck
          text: I had known Jim would answer that way. I knew he was white inside, so everything was settled. I told Tom I was going to find a doctor. Tom made a considerable fuss, but Jim and I stood firm. Then he tried to crawl out and turn the raft loose by himself. We stopped him. He told us exactly what he thought of that, but it changed nothing.
        - id: ch01-b55
          speaker: huck
          text: When Tom saw me preparing the canoe, he decided to give me instructions.
        - id: ch01-b56
          speaker: tom
          text: Well, if you're determined to go, here's what you must do. When you reach the village, shut the door and blindfold the doctor good and tight. Make him swear he'll be silent as the grave. Put a purse full of gold into his hand. Then lead him through all the back alleys in the dark. Bring him here by canoe, but take a winding course among the islands. Search him first and take away his chalk. Don't return it until he's safely back in the village. Otherwise he'll mark the raft with chalk so he can find it again. That's how these things are always done.
        - id: ch01-b57
          speaker: huck
          text: I told him I would do it, and then I left. When Jim saw the doctor coming, he was supposed to hide in the woods and stay there until the doctor had gone again.
