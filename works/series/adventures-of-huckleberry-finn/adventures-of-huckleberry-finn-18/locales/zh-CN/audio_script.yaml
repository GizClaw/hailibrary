  chapters:
    - id: ch01
      title: 第十八章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 格兰杰福德上校是个真正的绅士，你明白吧。他从头到脚都有那股派头，全家也一样。人们说他们出身高贵。道格拉斯寡妇说，血统对人和对马同样要紧。她自己在我们镇上就是头等人家，谁也不会反对。爸爸也总这么说，可他本人高贵不到哪儿去，跟一条泥鲶差不了多少。
        - id: ch01-b02
          speaker: huck
          text: 上校又高又瘦，脸色暗淡苍白，一点红润也没有。他每天早晨都把瘦脸刮得干干净净。嘴唇和鼻孔都很薄，鼻梁高，眉毛浓。那双乌黑的眼睛陷得很深，像是从洞里望着你。他额头很高，黑直的头发一直垂到肩上，两只手也是又长又瘦。
        - id: ch01-b03
          speaker: huck
          text: 他天天穿干净衬衫和一身雪白的亚麻衣裤，白得刺眼。到了星期日，他会换上镶黄铜纽扣的蓝色燕尾服，再拄一根银头红木手杖。他从不轻浮，也从不高声说话。他非常和善，你能感觉出来，自然就信得过他。有时他微微一笑，看着真好。
        - id: ch01-b04
          speaker: huck
          text: 可他一旦像自由柱那样挺直身子，浓眉底下闪起电光，你就会想先爬到树上，再问究竟出了什么事。他根本不用开口叫人守规矩，只要站在那里，大家自己就规矩了。多数时候，他像阳光一样，仿佛连天气都跟着放晴。等他变成一大片乌云，四周只要黑上半分钟就够了，接下来整整一星期都不会有人惹事。
        - id: ch01-b05
          speaker: huck
          text: 每天早晨，他和老太太一下楼，全家便站起来问好。他们坐下以后，别人才能落座。汤姆和鲍勃会在餐具柜前调一杯苦味酒，递给老先生，再给自己也调上一杯。兄弟俩鞠躬祝二老安好，二老欠身道谢，然后三个人一起喝下去。接着他们往杯底剩下的一点威士忌或苹果白兰地和糖里添一匙水，把酒递给我和巴克，我们也向二老祝酒。
        - id: ch01-b06
          speaker: huck
          text: 鲍勃最大，汤姆第二。两个人都高大漂亮，肩膀宽，脸晒得黝黑，黑色长发下面是一双黑眼睛。他们也穿全套白亚麻衣服，戴宽边巴拿马帽。
        - id: ch01-b07
          speaker: huck
          text: 夏洛特小姐二十五岁，个子高，骄傲又气派。只要没人惹恼她，她心肠好极了。可她一发火，眼神就和父亲一样，能叫人立刻蔫下去。她长得很美。妹妹索菲娅小姐才二十岁，也是个美人，却美得不同。她温柔又甜美，像一只鸽子。
        - id: ch01-b08
          speaker: huck
          text: 家里每个人都有一个黑奴伺候，巴克也有。我也分到一个，可他清闲得很，因为我不习惯让人替我做事。巴克的那个却忙得脚不沾地。如今家里只剩这些人。从前还有三个儿子，可他们全被杀了。已经死去的埃米琳也曾是家里的一员。
        - id: ch01-b09
          speaker: huck
          text: 老先生有许多农场，手下有一百多个黑奴。方圆十英里、十五英里的客人有时会成群骑马来，一住就是五六天。白天，他们在树林和河上玩，跳舞，野餐。晚上，他们回家开舞会。客人大多是亲戚，男人个个带枪。告诉你吧，那可真是一群气派又体面的上等人。
        - id: ch01-b10
          speaker: huck
          text: 附近还有一门上流人家，一共五六户，大多姓谢泼德森。他们的派头、出身、财富和气势，跟格兰杰福德家不相上下。两家共用一座蒸汽船码头，就在我们家上游两英里左右。我跟一大群家里人去码头时，偶尔会看见不少谢泼德森家的人骑着好马。
        - id: ch01-b11
          speaker: huck
          text: 有一天，我和巴克去远处的树林打猎。经过大路时，我们听见一匹马跑过来。
        - id: ch01-b12
          speaker: buck
          text: 快，钻进树林！
        - id: ch01-b13
          speaker: huck
          text: 我们立刻躲进去，隔着树叶朝小路上看。没多久，一个英俊的年轻人骑马飞奔而来。他坐在马上轻松得很，样子像个军人，枪横放在鞍头。我以前见过他，他就是年轻的哈尼·谢泼德森。
        - id: ch01-b14
          speaker: huck
          text: 巴克的枪就在我耳边响了。哈尼的帽子一下飞掉，他抓起枪，直冲我们藏身的地方。我们不等他赶到，拔腿就往树林深处跑。树长得不密，我边跑边回头躲子弹，两次看见哈尼举枪瞄准巴克。后来他顺原路骑走了。我猜他回去捡帽子，不过并没看清。
        - id: ch01-b15
          speaker: huck
          text: 我们一直跑回家才停。老先生听完，眼睛亮了一会儿，我看他多半是在高兴。接着他的脸色缓和下来，轻声问巴克。
        - id: ch01-b16
          speaker: saul
          text: 我不喜欢藏在树丛后面放枪。孩子，你怎么不到大路上去？
        - id: ch01-b17
          speaker: buck
          text: 谢泼德森家的人自己也不出来，爸爸。他们总想占便宜。
        - id: ch01-b18
          speaker: huck
          text: 巴克讲这件事时，夏洛特小姐像女王一样昂着头。她鼻翼张开，眼睛里直冒火星。两个年轻人沉着脸，一声不响。索菲娅小姐却白了脸。直到听说哈尼没有受伤，她脸上才又有了血色。
        - id: ch01-b19
          speaker: huck
          text: 一有机会，我就把巴克拉到树下的玉米仓旁边。等四周只剩我们两个，我问他。
        - id: ch01-b20
          speaker: huck
          text: 巴克，你刚才真想杀了哈尼吗？
        - id: ch01-b21
          speaker: buck
          text: 当然了，我就是想杀他。
        - id: ch01-b22
          speaker: huck
          text: 他对你做过什么？
        - id: ch01-b23
          speaker: buck
          text: 他？他什么也没对我做过。
        - id: ch01-b24
          speaker: huck
          text: 那你干吗想杀他？
        - id: ch01-b25
          speaker: buck
          text: 没别的，因为我们两家有世仇。
        - id: ch01-b26
          speaker: huck
          text: 世仇是什么？
        - id: ch01-b27
          speaker: buck
          text: 你到底在哪儿长大的？怎么连世仇都没听过？
        - id: ch01-b28
          speaker: huck
          text: 我就是没听过。你讲给我听吧。
        - id: ch01-b29
          speaker: buck
          text: 就是有两个人吵起来，其中一个把另一个杀了。死者的兄弟再来杀凶手。然后两边的兄弟互相追杀，表兄弟、堂兄弟也全掺进来。一直杀到人人都死光，世仇才算完。不过这种事慢得很，总要拖上很久。
        - id: ch01-b30
          speaker: huck
          text: 你们这场世仇已经打很久了吗？
        - id: ch01-b31
          speaker: buck
          text: 那还用问！差不多三十年了。最早有人为了什么事闹起来，后来打官司解决。输官司的那个人拔枪打死了赢官司的人。这当然很自然，换了谁都会这样。
        - id: ch01-b32
          speaker: huck
          text: 他们最早争的是什么？是土地吗？
        - id: ch01-b33
          speaker: buck
          text: 也许吧，我不知道。
        - id: ch01-b34
          speaker: huck
          text: 那第一枪是谁开的？格兰杰福德家的人，还是谢泼德森家的人？
        - id: ch01-b35
          speaker: buck
          text: 老天，我哪知道？那都是多久以前的事了。
        - id: ch01-b36
          speaker: huck
          text: 难道谁都不知道？
        - id: ch01-b37
          speaker: buck
          text: 有人知道。爸爸和几个老人应该知道，不过连他们现在也说不清，当初究竟为什么吵起来。
        - id: ch01-b38
          speaker: huck
          text: 巴克，这些年死过很多人吗？
        - id: ch01-b39
          speaker: buck
          text: 死了不少，葬礼办过一大堆。当然，也不是每一回都能打死人。爸爸身上还留着几颗铅弹，可他根本不在乎，反正他也没多少分量。鲍勃挨过好几下鲍伊猎刀，汤姆也伤过一两回。
        - id: ch01-b40
          speaker: huck
          text: 那今年有人被杀吗？
        - id: ch01-b41
          speaker: buck
          text: 有。我们杀了他们一个，他们也杀了我们一个。大约三个月前，我的表哥巴德骑马穿过河对岸的树林。他才十四岁，身上连件武器都没带，真是蠢透了。
        - id: ch01-b42
          speaker: buck
          text: 到了一个偏僻地方，他听见后面有马蹄声。回头一看，老秃头谢泼德森正拿枪追他，那头白发在风里乱飞。巴德不肯跳下马躲进灌木丛，还以为能甩掉老头。他们一前一后跑了五英里还多，可老头越追越近。
        - id: ch01-b43
          speaker: buck
          text: 巴德最后明白自己跑不掉了，就勒住马转过身，好让弹孔留在身子正面，你懂吧。老头追上来，一枪把他打倒。不过他也没高兴多久。不到一个星期，我们家的人就把他放倒了。
        - id: ch01-b44
          speaker: huck
          text: 巴克，我看那个老头就是个胆小鬼。
        - id: ch01-b45
          speaker: buck
          text: 他可不是，差得远呢。谢泼德森家没有一个胆小鬼，格兰杰福德家也没有。告诉你吧，有一回老头独自对付三个格兰杰福德家的人，足足打了半个钟头，最后还是他赢了。
        - id: ch01-b46
          speaker: buck
          text: 双方本来都骑着马。他跳下马，躲在一小堆木柴后面，又让马挡在身前替他挨子弹。那三个人仍旧骑在马上，围着他来回跑，不停朝他开枪。他也一直还击。
        - id: ch01-b47
          speaker: buck
          text: 后来老头和他的马回到家，身上全是窟窿，走起路来一瘸一拐。可那三个格兰杰福德家的人得叫人抬回去，一个当时已经死了，另一个第二天也死了。所以啊，你要想找胆小鬼，可别去谢泼德森家白费工夫。他们家根本生不出那种人。
        - id: ch01-b48
          speaker: huck
          text: 下一个星期日，我们全家骑马去三英里外的教堂。男人们都带着枪，巴克也一样。他们把枪夹在膝间，或顺手靠在墙边。谢泼德森家的人也这么做。牧师讲得相当乏味，全是兄弟之爱这一类叫人厌烦的话。可大家都说那篇布道讲得好，回家路上还一直谈信仰、善行、白白的恩典、预定得救，还有一大堆我听不明白的东西。在我看来，那真是我熬过的最难受的星期日之一。
        - id: ch01-b49
          speaker: huck
          text: 午饭后过了大约一个钟头，大家都在打盹。有的靠着椅子，有的回了房间，四周越来越无聊。巴克和一条狗摊在阳光下的草地上，睡得正熟。我上楼回房，也打算睡一觉。温柔的索菲娅小姐正站在隔壁门口。她把我拉进屋，轻轻关上门。
        - id: ch01-b50
          speaker: young_woman_2
          text: 乔治，你喜欢我吗？
        - id: ch01-b51
          speaker: huck
          text: 喜欢。
        - id: ch01-b52
          speaker: young_woman_2
          text: 那你肯不肯替我办件事？不管是谁，你都不能告诉他。
        - id: ch01-b53
          speaker: huck
          text: 我答应她。她说自己的《新约》忘在教堂里了，就放在座位上两本书中间。她问我能不能悄悄去取回来，谁也别告诉。我说可以，便溜出屋，沿大路去了教堂。
        - id: ch01-b54
          speaker: huck
          text: 教堂里一个人也没有，也许只有一两头猪。门没上锁，夏天的木板地很凉快，猪喜欢躺在那里。你要留心就会发现，大多数人不到非进不可的时候，绝不肯走进教堂。猪却不一样。
        - id: ch01-b55
          speaker: huck
          text: 我心想，这里面一定有事。一个姑娘不会为一本《新约》急成这样。我抖了抖书，一张小纸片掉出来，上面用铅笔写着三个字，二点半。我把书从头翻到尾，再没找到别的东西。这三个字我怎么也想不明白，只好把纸片放回去。
        - id: ch01-b56
          speaker: huck
          text: 我回到家上楼，索菲娅小姐已经在门口等着。她拉我进屋，关上门，从《新约》里翻出那张纸片。一看见上面的字，她就满脸欢喜。我还没回过神，她已经抱住我，说我是世上最好的孩子，又叮嘱我绝不能告诉别人。她脸红了好久，眼睛亮闪闪的，显得美极了。
        - id: ch01-b57
          speaker: huck
          text: 我吃惊得喘过气来，才问她纸上写了什么。她反过来问我看过没有。我说没有。她又问我认不认得手写的字。
        - id: ch01-b58
          speaker: huck
          text: 我不认得，只认得印得又粗又黑的字。
        - id: ch01-b59
          speaker: young_woman_2
          text: 那张纸只是书签，提醒我读到哪儿了。好了，你出去玩吧。
        - id: ch01-b60
          speaker: huck
          text: 我一路琢磨着这件事，朝河边走去。不久，我发现伺候我的杰克跟在后面。等我们走到房子看不见的地方，他回头四下看看，跑到了我身边。
        - id: ch01-b61
          speaker: jack
          text: 乔治少爷，您要是肯跟我去沼泽，我就让您瞧一大群水蝮蛇。
        - id: ch01-b62
          speaker: huck
          text: 我觉得这可真怪。他昨天已经说过一遍了。他应该知道，谁也不会喜欢水蝮蛇，更不会喜欢到四处找它们。他到底在打什么主意？
        - id: ch01-b63
          speaker: huck
          text: 好吧，你领路。
        - id: ch01-b64
          speaker: huck
          text: 我跟着他走了半英里。他进了沼泽，又在齐脚踝深的水里走了半英里左右。我们来到一块平坦的干地，周围长满密密的树木、灌丛和藤蔓。
        - id: ch01-b65
          speaker: jack
          text: 乔治少爷，您往里面走几步就能看见蛇。我以前见过，不想再瞧了。
        - id: ch01-b66
          speaker: huck
          text: 他说完就趟水走了，很快消失在树林里。我往里钻了一段，来到一块卧室大小的空地，四周垂满藤蔓。那里躺着一个熟睡的人。老天爷呀，竟然是我的老吉姆！
        - id: ch01-b67
          speaker: huck
          text: 我叫醒他，以为他重新见到我一定会大吃一惊，可他一点也不意外。他高兴得差点哭出来。他说，那天夜里他一直跟在我后面游。每次听见我喊，他都不敢回答，生怕别人把他从水里捞上去，再抓回去当奴隶。
        - id: ch01-b68
          speaker: jim
          text: 我受了点伤，游不快，后来落在你后面好远。你上岸时，我想着自己也上岸追你，没必要出声。可我看见那座房子，就不敢走快了。我离得太远，没听见他们对你说什么，又怕那些狗。等四下安静下来，我知道你已经进屋了，就钻进树林等天亮。
        - id: ch01-b69
          speaker: jim
          text: 清早有几个去田里干活的人经过，把我带到这里。这里有水，狗闻不出我的踪迹。他们每天晚上给我送吃的，还把你的情况告诉我。
        - id: ch01-b70
          speaker: huck
          text: 吉姆，你怎么不让杰克早点带我来？
        - id: ch01-b71
          speaker: jim
          text: 咱们没想出办法以前，用不着叫你来操心，哈克。不过现在没事了。我只要有机会，就买锅、盘子和吃的，夜里还一直修木筏。
        - id: ch01-b72
          speaker: huck
          text: 什么木筏？
        - id: ch01-b73
          speaker: jim
          text: 就是咱们原来那只。
        - id: ch01-b74
          speaker: huck
          text: 你是说，那只旧木筏没有撞碎？
        - id: ch01-b75
          speaker: jim
          text: 没有。它破得挺厉害，一头坏了，可损伤不算大，只是咱们的东西差不多全丢了。要不是咱们当时潜得那么深，在水下游得那么远，夜里又黑，咱俩还吓昏了头，蠢得像南瓜脑袋，早就该看见它了。不过没看见也好。现在木筏快修得跟新的一样，丢掉的东西也重新置办齐了。
        - id: ch01-b76
          speaker: huck
          text: 可你是怎么找回木筏的？你追上它了吗？
        - id: ch01-b77
          speaker: jim
          text: 我人在树林里，怎么追？不是我找到的。几个黑奴看见木筏挂在河湾的一根断树桩上，就把它藏进柳树丛里的小河汊。他们为了木筏该归谁，吵得太凶，我很快就听说了。
        - id: ch01-b78
          speaker: jim
          text: 我出面告诉他们，木筏谁的也不是，是你和我的。我还问他们，难道想抢一位年轻白人先生的财产，再为了这事挨鞭子吗？后来我给他们每人十美分，他们全高兴坏了，还盼着再漂来几只木筏，让他们继续发财。
        - id: ch01-b79
          speaker: jim
          text: 这些人待我真好。我要他们帮忙，根本不用说第二遍，宝贝儿。杰克也是个好人，而且很机灵。
        - id: ch01-b80
          speaker: huck
          text: 是啊。他从没告诉我你藏在这里，只说要带我看一群水蝮蛇。这样不管出了什么事，都不会牵连到他。他可以说自己从没见过咱俩待在一起，而且他说的是实话。
        - id: ch01-b81
          speaker: huck
          text: 第二天发生的事，我不想多说，还是尽量讲短些吧。天刚亮我就醒了，本想翻身再睡，却发现四周静得出奇，好像一个会动的人都没有。这很不寻常。巴克也已经起床走了。我满心疑惑地下楼，附近一个人都没有，屋里屋外都静得像老鼠。我走到柴堆旁，碰见了杰克。
        - id: ch01-b82
          speaker: huck
          text: 到底出了什么事？
        - id: ch01-b83
          speaker: jack
          text: 乔治少爷，您还不知道吗？
        - id: ch01-b84
          speaker: huck
          text: 不知道，我什么也不知道。
        - id: ch01-b85
          speaker: jack
          text: 哎呀，索菲娅小姐私奔了，真的！她不知道夜里什么时候跑的，谁也说不准。大家都猜，她是去嫁给年轻的哈尼·谢泼德森。家里大约半个钟头前才发现，也许还更早一点。
        - id: ch01-b86
          speaker: jack
          text: 我告诉您，他们可一点时间都没耽误！您从没见过谁这么急着拿枪备马。女眷们都去召集亲戚。老索尔主人和几位少爷带着枪，已经沿河边大路追上去了。他们想在哈尼带索菲娅小姐过河以前抓住他，再把他杀掉。我看这回要出大乱子。
        - id: ch01-b87
          speaker: huck
          text: 巴克走的时候竟然没叫醒我。
        - id: ch01-b88
          speaker: jack
          text: 他当然不会叫您！他们不想把您也卷进去。巴克少爷装好枪，说他不是带回一个谢泼德森家的人，就是自己完蛋。那边人多得很。我看只要有机会，他准能带回来一个。
        - id: ch01-b89
          speaker: huck
          text: 我使出全身力气，沿河边大路飞奔。没过多久，我就听见远处传来枪声。等我看见圆木商店和蒸汽船码头旁的木柴堆，便借树木和灌丛遮住自己，一路摸到合适的地方。我爬上一棵别人够不到的棉白杨，坐在树杈间往下看。树前不远有一垛四英尺高的木柴，我原本想躲在那后面。幸亏我没去。
        - id: ch01-b90
          speaker: huck
          text: 四五个男人骑着马，在圆木商店前的空地上来回冲。他们一边咒骂叫喊，一边想逼近码头旁的木柴垛，可怎么也靠不过去。两个年轻人背靠背蹲在柴堆后面，可以同时照看两头。只要有人从靠河那边露出身子，马上就会挨枪子。
        - id: ch01-b91
          speaker: huck
          text: 过了一阵，骑马的人不再乱冲，也不再喊叫，开始朝商店走。这时，一个男孩站起身，隔着木柴垛稳稳瞄准，把其中一人打下马鞍。其他人全跳下马，抬起伤者，准备送进商店。就在这时候，两个男孩拔腿跑了。
        - id: ch01-b92
          speaker: huck
          text: 他们跑完到我这棵树的一半路程，那些人才发觉。男人们看见他们，立刻上马追来。马越追越近，可两个男孩起步够早，一时还追不上。他们跑到我树前那垛木柴后面，又占了上风。其中一个就是巴克，另一个是他十九岁左右、身材瘦削的表哥乔。
        - id: ch01-b93
          speaker: huck
          text: 那些人闹了一会儿，便骑马走了。他们一消失，我就朝巴克喊，说人已经走远。巴克先是听见树上传来声音，不知道怎么回事，吓了一跳。接着他叫我留神瞭望，那些人只要再露面就告诉他。他说，那帮人准在盘算什么恶毒主意，肯定没走远。我很想下树，却不敢。
        - id: ch01-b94
          speaker: huck
          text: 巴克哭着咒骂。他说，自己和表哥乔早晚要替今天的事报仇。父亲和两个哥哥已经被杀了，敌人也死了两三个。谢泼德森家设了埋伏。巴克说，他父亲和哥哥本该等亲戚们赶来，因为谢泼德森家的人实在太多。
        - id: ch01-b95
          speaker: huck
          text: 我问哈尼和索菲娅小姐怎么样了。
        - id: ch01-b96
          speaker: buck
          text: 他们已经过河了，两个人都平安无事。
        - id: ch01-b97
          speaker: huck
          text: 我听了很高兴。可巴克因为那天没能一枪杀死哈尼，竟然痛苦成那副样子。我这辈子从没听过那样的话。
        - id: ch01-b98
          speaker: huck
          text: 突然，砰！砰！砰！三四支枪一齐响了。那些人下了马，从树林后面绕回来，悄悄摸到了两个男孩背后。巴克和乔都受了伤，可他们还是跳进了河里。两人顺流往下游，那些人就在岸上追，一边开枪，一边高喊。
        - id: ch01-b99
          speakers: [pursuer_1, pursuer_2, pursuer_3]
          ensemble: chorus
          text: 杀了他们！杀了他们！
          emotion: angry
        - id: ch01-b100
          speaker: huck
          text: 我恶心得差点从树上摔下去。后面的事我不愿全讲，因为一讲出来，我又会恶心。我真希望那天夜里自己从没上岸，那样就不会看见这一切。这些事我永远也甩不掉，直到现在还常常梦见那一幕。
        - id: ch01-b101
          speaker: huck
          text: 我一直留在树上，直到天色渐暗，根本不敢下来。远处的树林里有时还会响起枪声。我又两次看见一小队一小队的人带着枪，骑马从圆木商店旁边飞驰过去，便知道争斗还没有停。
        - id: ch01-b102
          speaker: huck
          text: 我难过极了，决定再也不靠近那座房子。不知道为什么，我总觉得这件事怪我。纸片上的二点半，一定是索菲娅小姐和哈尼约好见面，再一起私奔的时间。我又觉得，自己本来应该把纸片和她那副古怪样子告诉她父亲。那样他也许会锁住她，这场可怕的祸事就不会发生。
        - id: ch01-b103
          speaker: huck
          text: 我从树上下来，沿河岸悄悄走了一段，看见两具尸体躺在水边。我把他们一个个拖上岸，盖住他们的脸，然后尽快离开。盖住巴克的脸时，我哭了一会儿。他待我实在太好了。
        - id: ch01-b104
          speaker: huck
          text: 天刚刚黑。我没有靠近那座房子，而是穿过树林，直奔沼泽。吉姆不在那座小岛上，我便急忙赶到河汊，挤过柳树丛，只想立刻跳上木筏，逃开这个可怕的地方。可是木筏不见了！老天爷，我吓坏了，差不多整整一分钟喘不过气。接着我放声大喊。离我不到二十五英尺的地方，忽然有人说话。
        - id: ch01-b105
          speaker: jim
          text: 老天爷！是你吗，宝贝儿？别出声。
          emotion: surprised
        - id: ch01-b106
          speaker: huck
          text: 那是吉姆的声音。我从没听过比这更好听的声音。我沿河岸跑了一段，跳上木筏。吉姆一把抓住我，紧紧抱住。他见我活着回来，高兴极了。
        - id: ch01-b107
          speaker: jim
          text: 上帝保佑你，孩子！我早认定你又死了。杰克来过，说你一直没回家，他猜想你挨了枪子。所以我刚才正把木筏撑到河汊口，随时准备出发。等杰克再来，确准你真的死了，我马上就走。老天爷呀，能再见到你，我可太高兴了，宝贝儿！
          emotion: happy
        - id: ch01-b108
          speaker: huck
          text: 好，这再好不过。他们找不到我，就会以为我中了枪，尸体顺河漂走了。上面有些东西会让他们这样想。所以别耽搁了，吉姆，赶紧把木筏撑到大河里去。
        - id: ch01-b109
          speaker: huck
          text: 木筏漂到下游两英里之外，来到密西西比河中央，我才终于放下心来。我们挂起信号灯，又觉得自由又安全。我从昨天起一口东西都没吃。吉姆拿出玉米小饼、酪乳、猪肉、卷心菜和青菜。这些东西只要烧得好，世上再没有什么比它们更好吃。
        - id: ch01-b110
          speaker: huck
          text: 我们吃着晚饭，说着话，快活极了。我能摆脱那场世仇，打心眼里高兴。吉姆能离开沼泽，也一样高兴。我们说，到头来，还是木筏最像家。别的地方都让人觉得狭窄憋闷，木筏却不会。待在木筏上，人自由自在，又安稳又舒服。
