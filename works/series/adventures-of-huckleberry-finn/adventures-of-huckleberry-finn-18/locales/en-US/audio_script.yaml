  chapters:
    - id: ch01
      title: CHAPTER XVIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Colonel Grangerford was a gentleman all through, and his family was the same. He came from good people, which the Widow Douglas said counted for as much in a man as in a horse. Pap said so too, though he had no more quality in him than a mudcat. The colonel was very tall and slim, with a pale, darkish face that never showed any red. He shaved his thin face clean every morning. His lips and nostrils were narrow, his nose was high, and heavy brows hung over the blackest eyes I ever saw. Those eyes seemed to watch you from deep inside two caves. He had a high forehead, and straight black hair down to his shoulders. His hands were long and thin. Every day he wore a clean shirt and a full suit of white linen so bright it hurt your eyes. On Sundays he added a blue tailcoat with brass buttons. He carried a mahogany cane with a silver head.
        - id: ch01-b02
          speaker: huck
          text: There was nothing foolish or noisy about him. He was as kind as a man could be, and you felt you could trust him. It was good to see him smile. But when he stood straight as a liberty pole and lightning began flashing under those eyebrows, you wanted to climb a tree before you asked what was wrong. He never had to order anyone to behave. Everybody had good manners around him. Most of the time he brought sunshine into a room. When he turned into a cloudbank, though, it went dark for half a minute. That was enough to keep anything from going wrong for a week.
        - id: ch01-b03
          speaker: huck
          text: Every morning, when the colonel and his wife came downstairs, the whole family stood and wished them good day. Nobody sat until the old couple sat. Tom and Bob went to the sideboard and mixed the colonel a glass of bitters. They waited until their own drinks were ready, and then the two young men bowed.
        - id: ch01-b04
          speakers: [tom_grangerford, bob_grangerford]
          ensemble: duo
          text: Our duty to you, sir and madam.
        - id: ch01-b05
          speaker: huck
          text: The old couple made the smallest bow and thanked them. All three men drank. Then Tom and Bob put a spoonful of water over the sugar and the little bit of whisky or apple brandy left in their glasses. They gave those to Buck and me, and we drank to the old folks too.
        - id: ch01-b06
          speaker: huck
          text: Bob was the oldest son, and Tom came next. They were tall, handsome men with broad shoulders, brown faces, long black hair, and black eyes. Like their father, they dressed all in white linen. They also wore broad Panama hats. Miss Charlotte was twenty-five. She was tall, proud, grand, and beautiful. Usually she was as good as could be. Once she got stirred up, though, one look from her could make you wilt where you stood. Her sister Sophia was beautiful in a different way. She was only twenty, gentle and sweet as a dove.
        - id: ch01-b07
          speaker: huck
          text: Each person had an enslaved servant waiting on them, even Buck. The man assigned to me had an easy time because I was not used to anyone doing things for me. Buck kept his servant moving most of the day. That was the whole family now. There had once been three more sons, but they were killed, and Emmeline had died too.
        - id: ch01-b08
          speaker: huck
          text: The colonel owned many farms and more than a hundred enslaved people. Sometimes crowds of relatives rode in from ten or fifteen miles away and stayed nearly a week. They held outings on the river, daytime picnics and dances in the woods, and balls at the house at night. The men always brought their guns. They were a handsome gathering of high-class people.
        - id: ch01-b09
          speaker: huck
          text: Another high-born clan lived nearby. Five or six families belonged to it, and most of them were named Shepherdson. They were every bit as rich and grand as the Grangerfords. Both clans used the same steamboat landing two miles upriver from the house. When I went there with the Grangerfords, I sometimes saw Shepherdsons sitting on their fine horses.
        - id: ch01-b10
          speaker: huck
          text: One day Buck and I were hunting deep in the woods. As we crossed a road, we heard a horse coming.
        - id: ch01-b11
          speaker: buck
          text: Quick! Get into the woods!
        - id: ch01-b12
          speaker: huck
          text: We jumped out of sight and peered through the leaves. Soon a fine young man came galloping along. He sat his horse easily and looked like a soldier, with his gun across the saddle. I had seen him before. He was young Harney Shepherdson. Buck fired beside my ear, and Harney's hat flew off. Harney snatched up his gun and rode straight toward our hiding place. We did not wait for him. We ran through the open woods. I kept looking over my shoulder so I could dodge the bullet, and twice I saw Harney aim at Buck. Then he turned back, likely to fetch his hat. We never stopped until we reached home.
        - id: ch01-b13
          speaker: huck
          text: The colonel's eyes blazed for a moment. I thought it was mostly pleasure. Then his face settled, and he spoke gently.
        - id: ch01-b14
          speaker: colonel_grangerford
          text: I do not care for shooting from behind a bush. Why didn't you stand out in the road, my boy?
        - id: ch01-b15
          speaker: buck
          text: The Shepherdsons wouldn't do that, Father. They always take any advantage they can get.
        - id: ch01-b16
          speaker: huck
          text: While Buck told the story, Miss Charlotte held her head like a queen. Her nostrils widened and her eyes flashed. Tom and Bob looked dark but said nothing. Miss Sophia went pale. Her color returned when she learned Harney had not been hurt.
        - id: ch01-b17
          speaker: huck
          text: As soon as I could get Buck alone by the corncribs, I asked whether he had meant to kill Harney.
        - id: ch01-b18
          speaker: buck
          text: You can bet I did.
        - id: ch01-b19
          speaker: huck
          text: What did he ever do to you?
        - id: ch01-b20
          speaker: buck
          text: Him? He never did anything to me.
        - id: ch01-b21
          speaker: huck
          text: Then why did you want him dead?
        - id: ch01-b22
          speaker: buck
          text: No special reason. It's the feud.
        - id: ch01-b23
          speaker: huck
          text: What's a feud?
        - id: ch01-b24
          speaker: buck
          text: Where were you raised? Don't you know what a feud is?
        - id: ch01-b25
          speaker: huck
          text: I never heard of one. Tell me.
        - id: ch01-b26
          speaker: buck
          text: It goes like this. One man quarrels with another and kills him. Then the dead man's brother kills the first man. After that, the brothers on both sides hunt each other. Then the cousins join in. After a while everybody is dead, and the feud is over. It happens slowly, though. It takes a long time.
        - id: ch01-b27
          speaker: huck
          text: Has this feud lasted long?
        - id: ch01-b28
          speaker: buck
          text: I should say so. It began about thirty years ago. There was an argument, then a lawsuit. One man lost the suit, so he shot the man who won. Naturally he did. Anybody would.
        - id: ch01-b29
          speaker: huck
          text: What started the argument? Was it land?
        - id: ch01-b30
          speaker: buck
          text: Maybe. I don't know.
        - id: ch01-b31
          speaker: huck
          text: Which side fired the first shot? Was it a Grangerford or a Shepherdson?
        - id: ch01-b32
          speaker: buck
          text: How would I know? It happened too long ago.
        - id: ch01-b33
          speaker: huck
          text: Doesn't anybody know?
        - id: ch01-b34
          speaker: buck
          text: Pa and some of the old people probably know who fired. But even they don't remember what the first quarrel was about.
        - id: ch01-b35
          speaker: huck
          text: Have many people been killed?
        - id: ch01-b36
          speaker: buck
          text: Yes, we've had plenty of funerals. They don't kill someone every time. Pa carries a few pieces of buckshot, but they don't bother him because he hardly weighs anything. Bob has been cut up some with a bowie knife, and Tom has been wounded once or twice.
        - id: ch01-b37
          speaker: huck
          text: Has anyone died this year?
        - id: ch01-b38
          speaker: buck
          text: Yes. We killed one of theirs, and they killed one of ours. Three months ago my cousin Bud was riding through the woods across the river. He was fourteen and had no weapon, which was a foolish thing to do. In a lonely place, he heard a horse behind him. Old Baldy Shepherdson was chasing him with a gun, his white hair flying. Bud could have jumped down and run into the brush, but he thought his horse could win. They raced for five miles or more, with the old man getting closer. At last Bud knew he could not escape. He stopped and turned around so the bullet holes would be in his front. The old man rode up and shot him down. He did not enjoy his luck for long. Within a week, our people killed him.
        - id: ch01-b39
          speaker: huck
          text: That old man sounds like a coward.
        - id: ch01-b40
          speaker: buck
          text: He was no coward. There isn't one coward among the Shepherdsons, and there isn't one among the Grangerfords. That old man once fought three Grangerfords for half an hour and won. All four started on horseback. He got down, took cover behind a little woodpile, and kept his horse in front of him to catch the bullets. The Grangerfords stayed mounted. They rode circles around him and kept firing while he fired back. He and his horse went home full of holes and badly hurt. The Grangerfords had to be carried home. One was already dead, and another died the next day. If you're hunting cowards, don't waste your time among the Shepherdsons. Their families don't produce that kind.
        - id: ch01-b41
          speaker: huck
          text: The next Sunday, we all rode three miles to church. The Grangerford men brought their guns, and Buck did too. They held them between their knees or leaned them close by against the wall. The Shepherdsons did the same. The preacher gave a poor sermon about brotherly love and other tiresome things. Everyone called it a fine sermon. All the way home they talked about faith, good works, free grace, foreordination, and more things I could not follow. It seemed like one of the roughest Sundays I had ever lived through.
        - id: ch01-b42
          speaker: huck
          text: An hour after dinner, everybody was dozing in chairs or bedrooms. Buck and a dog slept in the sunny grass. I went upstairs for a nap. Miss Sophia was waiting in the doorway beside ours. She drew me into her room, closed the door softly, and asked if I liked her. I said I did.
        - id: ch01-b43
          speaker: sophia
          text: Will you do something for me and keep it secret?
        - id: ch01-b44
          speaker: huck
          text: I said I would.
        - id: ch01-b45
          speaker: sophia
          text: I left my Testament at church. It's on the seat between two other books. Please slip out quietly, bring it back to me, and don't tell anyone.
        - id: ch01-b46
          speaker: huck
          text: I agreed and slipped up the road. Nobody was at church except perhaps a hog or two. The door had no lock, and hogs like a cool plank floor in summer. Most people only go to church when they have to, but a hog is different.
        - id: ch01-b47
          speaker: huck
          text: I knew something was going on. A girl would not get that worked up over a Testament. I shook the book, and a scrap of paper fell out. In pencil, it said, "Half past two." I searched the book but found nothing else. The words meant nothing to me, so I put the paper back. Miss Sophia was waiting in her doorway when I returned. She pulled me inside and closed the door. The moment she found the paper and read it, her face turned glad. She grabbed me, hugged me, and told me I was the best boy in the world. She reminded me not to tell. Her face went red, and her eyes lit up. It made her look wonderfully pretty.
        - id: ch01-b48
          speaker: huck
          text: Once I got over my surprise, I asked what the paper meant.
        - id: ch01-b49
          speaker: sophia
          text: Did you read it?
        - id: ch01-b50
          speaker: huck
          text: No. I can only read ordinary print, not handwriting.
        - id: ch01-b51
          speaker: sophia
          text: It was only a bookmark to hold my place. You may go play now.
        - id: ch01-b52
          speaker: huck
          text: I walked toward the river, thinking it over. Soon I noticed Jack following me. Once the house was out of sight, he looked around and ran up.
        - id: ch01-b53
          speaker: jack
          text: Master George, come down into the swamp with me. I'll show you a whole heap of water moccasins.
        - id: ch01-b54
          speaker: huck
          text: That was strange. He had said the same thing the day before. He ought to know nobody likes water moccasins enough to hunt for them. I wondered what he was doing, but I told him to lead on.
        - id: ch01-b55
          speaker: huck
          text: I followed him half a mile. Then we went another half mile through ankle-deep swamp. We reached a small patch of dry ground, thick with trees, bushes, and vines.
        - id: ch01-b56
          speaker: jack
          text: Go in just a few steps, Master George. That's where they are. I've seen them already, and I don't care to see them again.
        - id: ch01-b57
          speaker: huck
          text: Jack splashed away until the trees hid him. I pushed through the growth and found an open space about the size of a bedroom, with vines hanging all around it. A man lay asleep there. By jings, it was my old Jim!
        - id: ch01-b58
          speaker: huck
          text: I woke him, expecting him to be amazed. He nearly cried because he was so glad, but he was not surprised. He had swum behind me that night and heard every yell I gave. He had not answered because he feared someone would capture him and force him back into slavery.
        - id: ch01-b59
          speaker: jim
          text: I got hurt a little and couldn't swim fast, so near the end I fell a good way behind you. When you reached land, I figured I'd catch you without calling out. Then I saw that house and slowed down. I was too far away to hear what they said to you, and I was afraid of the dogs. Once everything went quiet, I knew you were inside. I went into the woods to wait for daylight. Early that morning, some enslaved field hands found me. They brought me here because the dogs can't follow a trail through the water. Every night they bring me food and tell me how you're doing.
        - id: ch01-b60
          speaker: huck
          text: Why didn't you ask Jack to bring me sooner?
        - id: ch01-b61
          speaker: jim
          text: There was no sense troubling you until we could do something. We're all right now. Whenever I got a chance, I bought pots, pans, and food. At night I've been repairing the raft, and...
        - id: ch01-b62
          speaker: huck
          text: What raft, Jim?
        - id: ch01-b63
          speaker: jim
          text: Our old raft.
        - id: ch01-b64
          speaker: huck
          text: You mean it wasn't smashed to pieces?
        - id: ch01-b65
          speaker: jim
          text: No. One end was torn up, but the damage wasn't too bad. We lost almost all our things. If we hadn't dived so deep and swum so far underwater, and if the night hadn't been so dark, and if we hadn't been so scared and foolish, we'd have seen it. Maybe it worked out better this way. The raft is nearly as good as new, and we've replaced the things we lost.
        - id: ch01-b66
          speaker: huck
          text: How did you get it back? Did you catch it yourself?
        - id: ch01-b67
          speaker: jim
          text: How could I catch it while I was hiding in the woods? Some enslaved workers found it caught on a snag in the bend. They hid it in a creek among the willows. They argued so much about which one had the best claim that I soon heard the whole story. I settled it by telling them the raft belonged to you and me. I asked whether they meant to take a young white gentleman's property and get whipped for it. Then I paid them ten cents apiece. They were mighty satisfied and wished more rafts would float by and make them rich. They've been good to me. Anything I need done, they do without being asked twice. Jack is a good man, and he's pretty smart.
        - id: ch01-b68
          speaker: huck
          text: Yes, he is. He never told me you were here. He only offered to show me water moccasins. If trouble comes, nobody can say he was part of it. He can truthfully say he never saw us together.
        - id: ch01-b69
          speaker: huck
          text: I do not care to say much about the next day. I'll tell it short. Near dawn I woke and almost went back to sleep. Then I noticed how still everything was. Nobody seemed to be moving, and that was not usual. Buck was already gone. I got up and went downstairs. No one was there. Inside and outside, it was quiet as a mouse. I found Jack beside the woodpile and asked what was happening.
        - id: ch01-b70
          speaker: jack
          text: Don't you know, Master George?
        - id: ch01-b71
          speaker: huck
          text: No, I don't.
        - id: ch01-b72
          speaker: jack
          text: Miss Sophia ran away in the night. Nobody knows exactly when. They think she went to marry young Harney Shepherdson. The family found out a little more than half an hour ago, and nobody wasted a second. You never saw people grab guns and saddle horses so fast. The women went to call the relatives. Old Master Saul and the boys took their guns and rode upriver. They mean to catch Harney and kill him before he gets Miss Sophia across the river. It's going to be rough.
        - id: ch01-b73
          speaker: huck
          text: Buck left without waking me.
        - id: ch01-b74
          speaker: jack
          text: He surely did. They didn't want to drag you into it. Master Buck loaded his gun and swore he'd bring down a Shepherdson or die trying. There will be plenty of them up there. If he gets a chance, he'll bring one down.
        - id: ch01-b75
          speaker: huck
          text: I ran up the river road as hard as I could. Before long I heard gunshots far ahead. When the log store and the landing's woodpiles came into sight, I stayed under the trees and brush. I found a place to watch and climbed into the fork of a cottonwood, safely out of reach. A four-foot stack of wood stood a little way in front of the tree. I had almost hidden behind it. It was lucky that I did not.
        - id: ch01-b76
          speaker: huck
          text: Four or five men on horseback were circling in the open ground before the store. They cursed and shouted, trying to reach two young fellows hidden behind a woodpile beside the landing. They could not do it. Whenever a rider showed himself on the river side, a shot came at him. The two boys crouched back to back so they could watch both directions.
        - id: ch01-b77
          speaker: huck
          text: After a while, the riders stopped shouting and wheeled toward the store. One boy rose behind the logs, aimed steadily, and knocked a man out of his saddle. The others jumped down and carried the wounded man toward the store. Right then, the boys ran. They were halfway to my tree before the men noticed. The riders mounted and chased them. They gained ground, but the boys had too much of a lead. The boys reached the woodpile in front of my tree and slipped behind it. Once more, they had the better position. One was Buck. The other was his slim cousin Joe, who was about nineteen.
        - id: ch01-b78
          speaker: huck
          text: The men raced around a little longer, then rode off. As soon as they disappeared, I called down to Buck. At first, he could not understand why my voice was coming from a tree. Then he stared up in surprise.
        - id: ch01-b79
          speaker: buck
          text: Keep a sharp watch. Tell us the second those men come back. They're planning some devilment, and they won't stay gone long.
        - id: ch01-b80
          speaker: huck
          text: I wished I could climb down, but I did not dare. Buck cried and raged. He said he and Joe would make the Shepherdsons pay for that day. His father and both brothers were dead, along with two or three of the enemy. The Shepherdsons had waited in ambush. Buck said his father and brothers should have waited for their relatives because the other side was too strong.
        - id: ch01-b81
          speaker: huck
          text: I asked what had happened to Harney and Miss Sophia.
        - id: ch01-b82
          speaker: buck
          text: They made it across the river. They're safe.
        - id: ch01-b83
          speaker: huck
          text: I was glad. Buck was not. He carried on terribly because his old shot at Harney had missed. I had never heard anything like it.
        - id: ch01-b84
          speaker: huck
          text: Without warning, three or four guns cracked. The men had gone around through the woods and crept up behind the boys on foot. Buck and Joe, both wounded, jumped into the river. While they swam with the current, the men ran along the bank, firing and yelling for them to be killed. I got so sick I almost fell from the tree. I will not tell everything that happened. Telling it would make me sick again. I wished I had never come ashore that night and seen such things. I can never get free of them. Many nights, I still dream about them.
        - id: ch01-b85
          speaker: huck
          text: I stayed in the tree until dark began to fall because I was afraid to come down. Now and then, guns sounded in the distant woods. Twice, small groups of armed men galloped past the store. The fighting was still going on. I felt terribly low, and I decided never to go near the Grangerford house again. Somehow, I thought it was my fault. The paper must have told Sophia to meet Harney at half past two and run away. I believed I should have told her father about the note and her strange behavior. Maybe he would have locked her up, and this awful thing would never have happened.
        - id: ch01-b86
          speaker: huck
          text: When I finally climbed down, I crept along the riverbank. I found the two bodies at the water's edge and pulled them onto land. Then I covered their faces and hurried away. I cried a little while I covered Buck's face. He had been mighty good to me.
        - id: ch01-b87
          speaker: huck
          text: It was dark by then. I stayed away from the house and cut through the woods toward the swamp. Jim was not on his little island, so I rushed to the creek and pushed through the willows. I was burning to get aboard and escape that terrible country. But the raft was gone. My soul, I was scared. For almost a minute, I could not breathe. Then I shouted.
        - id: ch01-b88
          speaker: jim
          text: Good Lord, is that you, honey? Don't make any noise.
        - id: ch01-b89
          speaker: huck
          text: Jim's voice came from less than twenty-five feet away. Nothing had ever sounded so good. I ran along the bank and climbed aboard. Jim grabbed me and hugged me, overjoyed that I was alive.
        - id: ch01-b90
          speaker: jim
          text: Bless you, child! I was certain you were dead again. Jack came here and said you might have been shot because you never came home. I had just started moving the raft toward the creek mouth. I wanted us ready to leave as soon as Jack came back and knew for sure that you were dead. Lord, I'm mighty glad to have you back, honey.
          emotion: happy
        - id: ch01-b91
          speaker: huck
          text: Good. They won't find me, so they'll think I was killed and floated downriver. There's something up there that will help them believe it. Don't waste a moment, Jim. Push out toward the big river as fast as you can.
        - id: ch01-b92
          speaker: huck
          text: I did not feel easy until we were two miles below that place, out in the middle of the Mississippi. We hung up our signal lantern and knew we were free and safe again. I had eaten nothing since the day before. Jim brought out corn dodgers and buttermilk, pork, cabbage, and greens. Nothing in the world tastes better when it is cooked right. I ate supper while we talked and enjoyed ourselves. I was mighty glad to be away from the feud, and Jim was just as glad to be out of the swamp.
        - id: ch01-b93
          speaker: huck
          text: We agreed there was no home like a raft. Other places feel close and choking, but a raft does not. On a raft, you feel mighty free, easy, and comfortable.
