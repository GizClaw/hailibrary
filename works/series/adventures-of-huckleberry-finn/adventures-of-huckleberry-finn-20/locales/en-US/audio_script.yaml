  chapters:
    - id: ch01
      title: CHAPTER XX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The king and the duke asked us one question after another. Why did we keep the raft covered? Why did we hide by day and travel at night? Was Jim an escaped enslaved man?
        - id: ch01-b02
          speaker: huck
          text: Goodness, would an escaped man be heading south?
        - id: ch01-b03
          speaker: huck
          text: They admitted he would not, but I still had to explain everything somehow. So I made up a story. I said my family had lived in Pike County, Missouri, where I was born. Everyone died except me, my father, and my little brother Ike. Pa decided to break up our home and move downriver to Uncle Ben's little one-horse farm, forty-four miles below New Orleans. Pa was poor and owed money. Once he paid his debts, all we had left was sixteen dollars and Jim. Sixteen dollars could not buy deck passage, or any other kind of passage, for fourteen hundred miles.
        - id: ch01-b04
          speaker: huck
          text: Then the river rose, and Pa had a lucky day. He caught this piece of raft, so we decided to ride it down to New Orleans. His luck did not last. One night, a steamboat ran over the front corner. All four of us went into the river and dove beneath the wheel. Jim and I came back up safely. Pa was drunk, and Ike was only four years old, so they never came up again. For the next day or two, men kept rowing out in skiffs and trying to take Jim away. They said he must be an escaped enslaved man. That was why we stopped traveling by day. At night, nobody bothered us.
        - id: ch01-b05
          speaker: duke
          text: I'll work out a way for us to travel by daylight whenever we please. Give me time and I'll invent a plan. But we'll wait until tomorrow. Passing that town in broad daylight might be unhealthy.
        - id: ch01-b06
          speaker: huck
          text: Near evening, the sky darkened and began to look like rain. Heat lightning flickered low, and the leaves started to tremble. Anyone could see an ugly storm was coming. The king and duke went through our shelter to inspect the beds. Mine was a straw mattress, better than Jim's mattress of corn shucks. Cobs always got mixed into a shuck mattress. They poked and hurt when you lay down. And whenever you rolled over, the dry shucks rustled like a whole pile of dead leaves. The noise could wake you right up.
        - id: ch01-b07
          speaker: huck
          text: The duke chose my straw bed, but the king refused to allow it.
        - id: ch01-b08
          speaker: king
          text: Our difference in rank ought to tell you that a corn-shuck bed isn't fit for me. Your Grace can sleep on it yourself.
        - id: ch01-b09
          speaker: huck
          text: Jim and I feared another quarrel. We were relieved when the duke gave way.
        - id: ch01-b10
          speaker: duke
          text: I am fated to be crushed beneath the iron heel of oppression. Misfortune has broken my proud spirit. I yield. I submit. I am alone in the world, so let me suffer. I can bear it.
        - id: ch01-b11
          speaker: huck
          text: We left as soon as it was properly dark. The king ordered us to keep well toward the middle of the river. We were not to show any light until we had gone a long way below town. After a while, its little cluster of lights came into view. We slid past safely, about half a mile from shore. Only when we were another three quarters of a mile downstream did we raise our signal lantern.
        - id: ch01-b12
          speaker: huck
          text: Around ten, the rain and wind broke loose. Thunder crashed, and lightning flashed like everything. The king ordered Jim and me to both stay on watch until the weather improved. Then he and the duke crawled into the shelter and settled down for the night. My first watch ran until midnight. Even if I had owned a bed, I would not have gone to it. A person does not see a storm like that every day of the week, not by a long way.
        - id: ch01-b13
          speaker: huck
          text: My, how the wind screamed along! Every second or two, a glare lit the whitecaps for half a mile around us. Through the rain, the islands looked dusty, and the trees thrashed wildly in the wind. Then came a hard whack, followed by boom after boom. The thunder rumbled and grumbled away until it quit. Right after that, another flash ripped open the sky, and another enormous crash struck. Sometimes the waves nearly washed me off the raft. I had no clothes on, so I did not mind the rain. Snags gave us no trouble. Lightning kept flickering so often that we always saw them soon enough to turn the raft one way or the other.
        - id: ch01-b14
          speaker: huck
          text: By the middle watch, I was sleepy. Jim offered to take the first half for me. He was always mighty good that way. I crawled into the shelter, but the king and duke had their legs sprawled everywhere. There was no room for me at all. So I lay outside instead. The rain was warm, and the waves had settled down, so I did not mind. Around two, they rose again. Jim was about to call me, but changed his mind because he thought they were not high enough to hurt anything yet. He was mistaken. Before long, one regular ripper came along without warning and washed me overboard. Jim almost died laughing. He was easier to set laughing than anyone I knew.
        - id: ch01-b15
          speaker: huck
          text: I took over the watch, and Jim lay down and snored. At last the storm ended. When the first cabin light appeared, I woke him, and we hid the raft for the day.
        - id: ch01-b16
          speaker: huck
          text: After breakfast, the king brought out an old, worn deck of cards. He and the duke played seven-up for five cents a game. When that bored them, they began what they called laying out a campaign.
        - id: ch01-b17
          speaker: huck
          text: The duke dug through his carpetbag, brought out a stack of little printed handbills, and read them aloud. One advertised the celebrated Doctor Armand de Montalban of Paris. On some blank date at some blank place, he would lecture on the science of phrenology. Admission cost ten cents, and a chart of your character cost twenty-five. The duke said that man was him. Another bill called him Garrick the Younger, the world-famous Shakespearean tragedian from Drury Lane in London. On the other bills, he used still more names and performed all kinds of wonders. He could find water and gold with a divining rod, drive away witch spells, and plenty more.
        - id: ch01-b18
          speaker: duke
          text: But acting is my dearest art. Tell me, Royalty, have you ever performed on a stage?
        - id: ch01-b19
          speaker: king
          text: No.
        - id: ch01-b20
          speaker: duke
          text: Then you will before three more days pass, Fallen Grandeur. In the first decent town, we'll rent a hall. We'll perform the sword fight from Richard the Third and the balcony scene from Romeo and Juliet. What do you say?
        - id: ch01-b21
          speaker: king
          text: If there's money in it, Bilgewater, I'm ready for anything. But I don't know a thing about acting, and I've hardly seen any. I was very young when they put on plays at my father's palace. Can you teach me?
        - id: ch01-b22
          speaker: duke
          text: Easily.
        - id: ch01-b23
          speaker: king
          text: Good. I'm hungry for something new. Let's begin now.
        - id: ch01-b24
          speaker: huck
          text: The duke explained Romeo and Juliet. He usually played Romeo, he said, so the king would play Juliet.
        - id: ch01-b25
          speaker: king
          text: But Duke, Juliet is a young girl. Won't my bald head and white whiskers look mighty strange on her?
        - id: ch01-b26
          speaker: duke
          text: Don't worry. These country people will never notice. And you'll be in costume, which changes everything. Juliet is enjoying the moonlight on her balcony before bed, so she wears a nightshirt and a ruffled nightcap. I have the costumes right here.
        - id: ch01-b27
          speaker: huck
          text: He brought out two or three suits made from curtain-patterned cloth. He called them medieval armor for Richard the Third and the man who fought him. Then he produced a long white cotton nightshirt and a ruffled nightcap to match. The king was satisfied. The duke opened his book and read through the parts in the grandest, widest style you ever heard. He pranced around and acted at the same time, showing the king exactly how it ought to be done. Then he handed over the book and told the king to learn his part by heart.
        - id: ch01-b28
          speaker: huck
          text: A small town stood about three miles down the bend. After dinner, the duke said he had solved the problem of traveling safely with Jim by day. He would go into town and arrange it. The king went along to see what he could find. We had run out of coffee, so Jim told me to take the canoe with them and buy some.
        - id: ch01-b29
          speaker: huck
          text: The town looked deserted. Its streets were empty and still as Sunday. In a backyard, we found a sick Black man warming himself in the sun.
        - id: ch01-b30
          speaker: sick_man
          text: Everybody who isn't too young, too old, or too sick has gone to the camp meeting. It's about two miles back in the woods.
        - id: ch01-b31
          speaker: huck
          text: The king got directions and decided to work the meeting for everything it was worth. I could come too. The duke said he was after a printing office. We found a little one upstairs over a carpenter's shop. Both the carpenters and the printers had gone to the meeting, and not one door was locked. The place was dirty and littered. Ink marks and handbills covered the walls, with pictures of horses and escaped enslaved people everywhere. The duke took off his coat, looked around, and said he had all he needed. Then the king and I set out for the camp meeting.
        - id: ch01-b32
          speaker: huck
          text: Half an hour later, we reached it dripping with sweat, because the day was terribly hot. Nearly a thousand people had come from as far as twenty miles around. Teams and wagons filled the woods, hitched wherever there was space. The animals fed from troughs at the wagons and stamped their feet to drive away the flies. Some shelters were made from poles and roofed with branches. Under them, people sold lemonade and gingerbread, along with piles of watermelons, green corn, and other food.
        - id: ch01-b33
          speaker: huck
          text: The preaching took place under shelters of the same kind, only these were larger and packed with people. The benches were made from the outside slabs of logs. Holes had been bored into the rounded sides, and sticks driven in for legs. There were no backs. At one end, a high platform held the preacher. The women wore sunbonnets. Their dresses were linsey-woolsey or gingham, with a few of the younger women in calico. Some young men had bare feet. Some children wore nothing but tow-linen shirts. A few old women kept on knitting, while young couples quietly courted each other.
        - id: ch01-b34
          speaker: huck
          text: At the first shelter we reached, the preacher was lining out a hymn. He called out two lines, and everybody sang them. Then he gave them two more, and they sang those too. It sounded grand with so many voices joining in so strongly. The people grew more worked up with every verse. They sang louder and louder until some began to groan and others began to shout.
        - id: ch01-b35
          speaker: huck
          text: Then the preacher truly went to work. He shouted with all his strength and wove from one side of the platform to the other. He leaned far out over the front, with his arms and his whole body moving every moment. Now and then, he held his Bible open above him and passed it from side to side so everyone could see.
        - id: ch01-b36
          speaker: preacher
          text: Here is the bronze serpent in the wilderness! Look upon it and live!
        - id: ch01-b37
          speakers: [worshipper_1, worshipper_2, worshipper_3]
          ensemble: chorus
          text: Glory! Amen!
        - id: ch01-b38
          speaker: preacher
          text: Come to the mourners' bench! Come even if you're black with sin, sick and aching, lame or blind. Come if you're poor, ashamed, worn down, dirty, or suffering. Bring your broken spirit and sorry heart. Come in your rags and your sin. The cleansing water is free, and heaven's door stands open. Come in and find rest!
        - id: ch01-b39
          speakers: [worshipper_1, worshipper_2, worshipper_3]
          ensemble: chorus
          text: Amen! Glory, glory, hallelujah!
        - id: ch01-b40
          speaker: huck
          text: He went on, while people groaned, cried, and called amen. Soon the noise grew so great that nobody could make out his words. People rose everywhere in the crowd. With tears running down their faces, they forced their way through by main strength to the mourners' bench. Once they had all crowded around the front benches, they sang and shouted and flung themselves down on the straw, wild with feeling.
        - id: ch01-b41
          speaker: huck
          text: Before I knew it, the king was shouting louder than anyone. He charged onto the platform. The preacher begged him to speak, and the king began a story.
        - id: ch01-b42
          speaker: king
          text: For thirty years, I was a pirate in the Indian Ocean. A fight last spring thinned out my crew badly, so I came home to gather fresh men. Then, just last night, robbers took everything I had. They put me ashore from a steamboat without one cent to my name. And I thank heaven for it! Being robbed was the greatest blessing that ever came to me. It changed me completely, and now, for the first time in my whole life, I am happy.
        - id: ch01-b43
          speaker: king
          text: Poor as I am, I will start back at once and work my way to the Indian Ocean. I mean to spend the rest of my life turning pirates toward the true path. I know every pirate crew in that ocean, so nobody can do the work better. Without money, the journey will take me a long time, but I will get there anyway. And every time I change a pirate's heart, I will tell him this. Do not thank me. Do not give me any credit. Every bit of it belongs to the dear people of the Pokeville camp meeting, those natural brothers and benefactors of mankind. It belongs to this dear preacher too, the truest friend a pirate ever had!
        - id: ch01-b44
          speaker: huck
          text: With that, the king burst into tears. The whole crowd cried along with him. In the middle of it all, one worshipper called out over the others.
        - id: ch01-b45
          speaker: worshipper_1
          text: Take up a collection for him!
        - id: ch01-b46
          speaker: huck
          text: Half a dozen people jumped to do it, but another voice stopped them.
        - id: ch01-b47
          speaker: worshipper_2
          text: Let him carry the hat himself!
        - id: ch01-b48
          speaker: huck
          text: Everyone took up the idea, including the preacher. The king went all through the crowd carrying his hat and wiping his eyes. He blessed the people, praised them, and thanked them for being so good to the poor pirates far away. Every little while, a pretty young woman with tears on her cheeks asked whether she might kiss him, so she could remember him. The king always allowed it. He hugged and kissed some of them as many as five or six times.
        - id: ch01-b49
          speaker: huck
          text: People invited him to stay a week and offered him their homes. The king said that since the meeting ended that day, he could do no more good there. Besides, he was desperate to reach the Indian Ocean and begin saving pirates.
        - id: ch01-b50
          speaker: huck
          text: Back at the raft, the king counted eighty-seven dollars and seventy-five cents. He had also carried off a three-gallon jug of whiskey that he found under a wagon on his way through the woods.
        - id: ch01-b51
          speaker: king
          text: All in all, that beats every day I ever spent as a missionary. There's no question about it. Heathens aren't worth a thing beside pirates when you're working a camp meeting.
        - id: ch01-b52
          speaker: huck
          text: The duke had thought he had done well until the king showed his haul. Then his own earnings did not seem like much. At the printing office, he had printed two horse bills for farmers and collected four dollars. He had also sold ten dollars' worth of newspaper advertisements for four dollars cash in advance.
        - id: ch01-b53
          speaker: huck
          text: The paper usually cost two dollars a year. The duke took three half-dollar subscriptions instead, as long as the buyers paid him at once. They normally paid in cordwood and onions. He told them he had just bought the paper, cut the price as low as he could, and meant to run it for cash.
        - id: ch01-b54
          speaker: huck
          text: He had even written three verses of sweet, sad poetry called “Yes, Crush, Cold World, This Breaking Heart.” He left it set in type for the paper and charged nothing for it. Altogether, he took in nine dollars and fifty cents. He called that a pretty fair day's work.
        - id: ch01-b55
          speaker: huck
          text: Then he showed us one more thing he had printed for free, because this one was for us. It pictured an escaped enslaved man carrying a bundle on a stick, with a two-hundred-dollar reward beneath it. The notice described Jim exactly. It said he had escaped last winter from St. Jacques' plantation, forty miles below New Orleans, and had probably gone north. Anyone who caught and returned him would receive the reward and expenses.
        - id: ch01-b56
          speaker: duke
          text: After tonight, we can travel in daylight whenever we want. If anyone comes near, we'll tie Jim's hands and feet, put him inside the shelter, and show them this notice. We'll say we captured him upriver. We were too poor to take a steamboat, so our friends gave us this little raft on credit, and now we're going downriver for the reward. Chains and handcuffs would look better, but they don't suit our story about being poor. They'd be too much like jewelry. Rope is just right. As we say on the stage, we must keep everything consistent.
        - id: ch01-b57
          speaker: huck
          text: We all agreed the duke had been mighty clever. With that handbill ready, there should be no trouble about traveling in daylight. We figured we could cover enough miles that night to get safely beyond the uproar his work in the printing office was bound to stir up in that little town. Once we were out of its reach, we could move right along in daytime whenever we pleased.
        - id: ch01-b58
          speaker: huck
          text: We lay low, kept perfectly still, and did not push away until nearly ten o'clock that night. Then we slid past the town, staying a good distance out from shore. We did not raise our signal lantern until every last town light had disappeared behind us.
        - id: ch01-b59
          speaker: huck
          text: Jim woke me for my watch at four in the morning.
        - id: ch01-b60
          speaker: jim
          text: Huck, do you reckon we'll run into any more kings on this trip?
        - id: ch01-b61
          speaker: huck
          text: No, I don't reckon we will.
        - id: ch01-b62
          speaker: jim
          text: Well, that's all right, then. I don't mind one king or maybe two, but that's enough. This one's powerful drunk, and the duke isn't much better.
        - id: ch01-b63
          speaker: huck
          text: I found out that Jim had been trying to persuade the king to speak some French, just so he could hear what the language sounded like. The king would not do it. He claimed he had lived in this country for so many years, and had gone through so much trouble, that he had forgotten every bit of his French.
