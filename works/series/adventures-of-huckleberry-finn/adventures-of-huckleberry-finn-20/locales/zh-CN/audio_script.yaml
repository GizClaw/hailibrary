audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 热诚质朴，对哈克满是关切
        timbre: 浑厚温暖
        pace: 舒展自然
        pitch: 低
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    preacher:
      display_name: 牧师
      tts:
        delivery: 激昂热烈，布道时富有煽动力
        timbre: 洪亮厚实
        pace: 由缓到急
        pitch: 中低
    congregant_1:
      display_name: 会众甲
      tts:
        delivery: 热切投入，情绪容易被人群带动
        timbre: 明亮有力
        pace: 爽快
        pitch: 中
    congregant_2:
      display_name: 会众乙
      tts:
        delivery: 虔诚激动，呼喊时毫不犹豫
        timbre: 清脆响亮
        pace: 稍快
        pitch: 中高
    congregant_3:
      display_name: 会众丙
      tts:
        delivery: 朴实诚恳，跟随众人齐声回应
        timbre: 粗厚响亮
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 白天行船的难题
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 那两个人问个没完。他们想知道，木筏为什么遮得严严实实，为什么白天藏着，偏要夜里赶路。说到底，他们是在问吉姆会不会是逃出来的黑奴。
        - id: ch01-b02
          speaker: huck
          text: 老天爷，逃跑的黑奴哪会往南边跑？
        - id: ch01-b03
          speaker: huck
          text: 他们觉得这话有理。可我总得编个说法，于是告诉他们，我家原来住在密苏里州派克县，我就是在那里出生的。家里人差不多都死了，只剩爸爸、弟弟艾克和我。爸爸打算收拾家当，去投奔奥尔良下游四十四英里处的本叔叔。本叔叔在河边只有一小块破庄园。爸爸本来就穷，还欠了债，清账以后只剩十六块钱和吉姆。可我们要走一千四百英里，十六块钱连甲板票也买不起，更别提别的走法了。
        - id: ch01-b04
          speaker: huck
          text: 河水涨起来以后，有一天爸爸走了运，恰好捞到这截木筏，我们就合计乘它往奥尔良去。可他的好运没能长久。一天夜里，一艘蒸汽船碾过木筏前角，我们全掉下水，被卷进明轮底下。吉姆和我平安浮了上来，喝醉的爸爸和只有四岁的艾克却再也没露面。接下来一两天，总有人划着小艇过来抢吉姆，认定他是逃跑的黑奴。我们只好白天藏起来，夜里再走，那时候就没人来打扰了。
        - id: ch01-b05
          speaker: duke
          text: 这件事交给我。我会想出办法，让咱们白天也能走。今天先别动，眼下大白天经过前面那个镇子，对咱们可不太健康。
        - id: ch01-b06
          speaker: huck
          text: 傍晚时，天色越来越阴，像是快下雨了。闷雷带来的闪电贴着低空四处乱窜，树叶也抖起来，一场凶暴的风雨眼看就要来了。公爵和国王先去翻检我们的棚屋，看看床铺怎么样。我的草褥子比吉姆的玉米皮褥子好。玉米皮里总会混着玉米芯，睡上去又硌又扎，一翻身还像滚过一堆干枯的落叶，沙沙响得能把自己吵醒。
        - id: ch01-b07
          speaker: huck
          text: 公爵刚说要睡我的铺位，国王就不肯了。
        - id: ch01-b08
          speaker: king
          text: 公爵大人，爵位有高有低，这还不够提醒你吗？玉米皮褥子不配给我睡。那张褥子还是留给你自己吧。
        - id: ch01-b09
          speaker: huck
          text: 我和吉姆立刻紧张起来，怕他们又要翻脸。幸好公爵让步了。
        - id: ch01-b10
          speaker: duke
          text: 我这一生，注定要被压迫的铁蹄踩进泥里。苦难已经折断我高傲的心。我让步，我服从，这就是命运。世上只有我孤零零一个人。让我受苦吧，我承受得住。
          emotion: sad
    - id: ch02
      title: 暴风雨和新戏码
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 天黑透以后，我们马上启程。国王叫我们尽量贴近河心，远远过了镇子才能点灯。过了一会儿，前方出现一小簇灯火，那自然就是镇子。我们从半英里外悄悄滑过，什么事也没出。到了下游四分之三英里处，才升起信号灯。
        - id: ch02-b02
          speaker: huck
          text: 十点左右，风雨雷电一齐发起疯来。国王让吉姆和我一同守着木筏，直到天气好转，自己却跟公爵钻进棚屋睡觉。下半夜十二点以前本来就是我值班，可就算有床，我也不会去睡。这样的暴风雨一星期也见不到一回，差得远呢。狂风尖叫不止，每隔一两秒，闪电就把半英里内的白浪照亮。雨幕里的岛屿灰蒙蒙的，树木被风甩来甩去。
        - id: ch02-b03
          speaker: huck
          text: 接着就是“嚓——轰！轰！隆隆轰隆轰轰轰轰——”，雷声一边咕哝，一边滚向远处，终于停了。才安静下来，“刺啦”又亮一道，紧跟着又是一声惊天动地的巨响。浪头几次差点把我从木筏上冲走，可我身上没穿衣服，也不在乎。闪电一直发亮、跳动，我们很早就能把前面的沉木看得清清楚楚，及时把筏头拨向这边或那边，从旁边躲过去。
        - id: ch02-b04
          speaker: huck
          text: 午夜本来也该我值班，可我困得睁不开眼。吉姆一向待我很好，主动替我守前半班。我想进棚屋，国王和公爵却把腿伸得到处都是，我只好睡在外面。天气暖和，浪也小了，淋点雨没什么。
        - id: ch02-b05
          speaker: huck
          text: 两点左右，浪又高起来。吉姆本想叫醒我，后来见浪头还不算高，觉得不会闯祸，就没叫。他可料错了。没过多久，一个真正厉害的大浪突然扑过来，一下子把我冲下木筏。吉姆笑得差点没命。他本来就是世上最容易发笑的人。
        - id: ch02-b06
          speaker: huck
          text: 我接过值班，吉姆倒头就睡，还打起鼾来。风暴终于彻底过去。岸上第一盏小屋灯一亮，我便叫醒他，一起把木筏藏起来过白天。
        - id: ch02-b07
          speaker: huck
          text: 早饭后，国王拿出一副又破又脏的纸牌，跟公爵玩五分钱一局的七点牌。玩腻以后，两人说要部署一场战役。公爵从旅行袋里翻出一叠旧广告，一张张大声念。他在一张广告上是巴黎名医阿尔芒·德·蒙塔尔邦博士，要讲授颅相学，门票一角，画一份性格图收两角五分。他还做过伦敦德鲁里巷享誉世界的莎士比亚悲剧演员“小加里克”，也换过许多别的名字，拿占卜杖找过水和金矿，替人驱过巫术。
        - id: ch02-b08
          speaker: duke
          text: 可我最爱的还是演戏。陛下以前登过台吗？
        - id: ch02-b09
          speaker: king
          text: 没有。
        - id: ch02-b10
          speaker: duke
          text: 那么三天之内，你一定会登台，落难的至尊。到了第一个像样的镇子，咱们就租个戏院，演《理查三世》的剑斗，再演《罗密欧与朱丽叶》的阳台戏。怎么样？
        - id: ch02-b11
          speaker: king
          text: 能挣钱的事，我都干到底，布里奇沃特。可我从没学过演戏，也没看过几回。以前父王在宫里请人演的时候，我还太小。你真能教会我？
        - id: ch02-b12
          speaker: duke
          text: 太容易了！
        - id: ch02-b13
          speaker: king
          text: 那就好。我正想换点新鲜花样。现在就开始吧。
        - id: ch02-b14
          speaker: huck
          text: 公爵讲清了罗密欧和朱丽叶是谁。他自己惯演罗密欧，便让国王演朱丽叶。
        - id: ch02-b15
          speaker: king
          text: 公爵，朱丽叶是个年轻姑娘。可我脑袋秃得发亮，胡子又白，装成她不会太怪吗？
        - id: ch02-b16
          speaker: duke
          text: 放心吧，这些乡巴佬想不到那儿去。何况穿上戏服，模样就全变了。朱丽叶睡前站在阳台赏月，本来就该穿睡袍，戴荷叶边睡帽。你看，戏服都在这里。
        - id: ch02-b17
          speaker: huck
          text: 公爵拿出两三套印花窗帘布做的衣裳，硬说那是理查三世和另一个人的中古铠甲，又拿出一件长长的白棉布睡袍，还有一顶相配的荷叶边睡帽。国王这才满意。公爵便捧着书，用最华丽、最夸张的腔调从头念起，一边到处蹦跶，一边亲自表演，好让国王看懂每个地方该怎样演。示范完以后，他把书交给国王，让他背熟自己的台词。
    - id: ch03
      title: 林中的宗教大会
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 河湾下游三英里有个寒酸的小镇。午饭后，公爵说自己已经想好怎样让吉姆安全地在白天赶路，要进镇把事情办妥。国王也想去碰碰运气。我们的咖啡没了，吉姆便让我划独木舟跟去买些回来。
        - id: ch03-b02
          speaker: huck
          text: 到镇上以后，一个活动的人影也看不见，街道空空的，像礼拜日一样死寂。只有一个生病的黑奴坐在后院晒太阳。他告诉我们，除去年纪太小、病得太重和老得走不动的人，其余人全去了两英里外林中的宗教大会。国王问清道路，决定去那里把能榨的油水全榨出来，还带上了我。
        - id: ch03-b03
          speaker: huck
          text: 公爵说，他要找的是印刷所。我们果真在一家木匠铺楼上找到了，只是那铺子小得可怜。木匠和印刷工都去赴会了，连门也没锁。里面又脏又乱，到处沾着油墨，墙上贴满了传单，有的画着马，有的画着逃跑的黑奴。公爵脱掉外套，说这地方正合他的心意，于是留了下来。我和国王则动身去宗教大会。
        - id: ch03-b04
          speaker: huck
          text: 半个钟头后，我们终于到了会场。那天热得可怕，身上的汗像水一样往下淌。方圆二十英里来了近一千人，林子里到处拴着马匹和车辆。牲口把嘴伸进车上的饲料槽，一边吃，一边跺脚赶苍蝇。木杆搭起、树枝盖顶的棚子里卖着柠檬水和姜饼，旁边还堆着西瓜、嫩玉米之类的吃食。
        - id: ch03-b05
          speaker: huck
          text: 布道也在这样的棚子里，只是棚子更大，挤满了人。长凳用圆木外侧切下的板皮做成，圆面钻孔，再插进木棍当腿，一张也没有靠背。棚子一头搭着高台，给牧师站在上面。女人戴着遮阳帽，穿亚麻羊毛混纺裙、方格布裙或印花布裙。有的年轻男人光着脚，有的孩子全身只穿一件粗麻衬衫。老太太中有人织毛线，年轻人中有人躲着旁人谈情说爱。
        - id: ch03-b06
          speaker: huck
          text: 第一个棚子里，牧师正领唱圣歌。他先念两行，大家便跟着唱两行，然后他再念两行，让大家接着唱。近千人的歌声汇在一起，又响亮又庄严。众人越来越兴奋，歌也越唱越高，快到末尾时，有人呻吟，有人呼喊。接着牧师开始讲道，一开口就用上全副力气。他摇摆着从高台这边走到那边，又俯身探出台子前沿，双臂和身体一刻不停，拼命吼出每一个字。他还不时举起摊开的《圣经》，向这边晃晃，再向那边晃晃。
        - id: ch03-b07
          speaker: preacher
          text: 这是旷野里的铜蛇！仰望它，就能得救！
        - id: ch03-b08
          speakers: [congregant_1, congregant_2, congregant_3]
          ensemble: chorus
          text: 荣耀归主！阿——门！
        - id: ch03-b09
          speaker: preacher
          text: 到悔罪席前来吧！一身罪孽的人，来吧！疾病缠身、遍体伤痛的人，来吧！瘸腿的、残疾的、瞎眼的人，来吧！贫穷困苦、深陷羞耻的人，也来吧！
        - id: ch03-b10
          speakers: [congregant_1, congregant_2, congregant_3]
          ensemble: chorus
          text: 阿门！阿——门！
        - id: ch03-b11
          speaker: preacher
          text: 所有疲惫、污秽、受苦的人，都带着破碎的灵魂和悔恨的心来吧！穿着破衣烂衫，带着罪孽和污垢来吧！洗净罪恶的水白白赐给你们，天堂的大门正敞开着。进来吧，到这里安歇！
        - id: ch03-b12
          speakers: [congregant_1, congregant_2, congregant_3]
          ensemble: chorus
          text: 阿——门！荣耀，荣耀，哈利路亚！
        - id: ch03-b13
          speaker: huck
          text: 牧师还在继续，可后来哭喊声盖住了他的声音，谁也听不清他在说什么。人群中处处有人站起来，眼泪顺着脸颊往下流，硬是凭着力气，从挤得水泄不通的人群里钻向悔罪席。等悔罪的人全都拥到前排长凳旁，便又唱又叫，一个个把自己扑倒在稻草上，狂乱得简直像疯了一样。
    - id: ch04
      title: 国王的海盗事业
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 我还没明白发生了什么，国王也突然来了劲，放声喊起来，声音压过所有人。紧接着，他一路猛冲上高台。牧师恳求他对大家讲几句话，他当然马上答应了。
        - id: ch04-b02
          speaker: king
          text: 乡亲们，我是个海盗，在印度洋干了三十年。去年春天一场战斗，让我的手下死伤大半。我这次回来，本是要招些新人。可感谢上帝，昨夜我遭人抢劫，又被赶下蒸汽船，身上一分钱也没剩！
        - id: ch04-b03
          speaker: king
          text: 我真心感谢这场灾祸。这是我一生最蒙福的事，因为我已经改过自新，头一次知道幸福是什么。就算穷得一文不名，我也要马上动身，一路做工回到印度洋，用余生把那些海盗引上正道。我熟悉那里的每一个海盗团伙，没人比我更适合做这件事。
        - id: ch04-b04
          speaker: king
          text: 没有钱，这一路会走很久，可我一定能回去。以后每劝化一个海盗，我都要告诉他，不要谢我，也别把功劳记在我头上。所有功劳都属于波克维尔宗教大会亲爱的乡亲们，他们是全人类的兄弟和恩人。还有这位亲爱的牧师，他是海盗有过的最真诚的朋友！
        - id: ch04-b05
          speaker: huck
          text: 国王说完便放声大哭，所有人也跟着哭起来。
        - id: ch04-b06
          speaker: congregant_1
          text: 给他募捐！给他募捐！
        - id: ch04-b07
          speaker: huck
          text: 五六个人争着要去收钱，另一个人又喊了起来。
        - id: ch04-b08
          speaker: congregant_2
          text: 让他自己拿帽子来收！
        - id: ch04-b09
          speakers: [preacher, congregant_1, congregant_2, congregant_3]
          ensemble: chorus
          text: 对，让他自己来收！
        - id: ch04-b10
          speaker: huck
          text: 国王举着帽子走遍人群，一面用帽子擦眼睛，一面祝福大家、赞美大家，又感谢他们善待远方那些可怜的海盗。每隔一会儿，就有非常漂亮的姑娘流着眼泪站起来，请他让自己亲一下，好留作纪念。他从来不会拒绝。有几个姑娘，他甚至搂住人家，一连亲了五六回。
        - id: ch04-b11
          speaker: huck
          text: 人们请他留下住一星期，人人都争着让他住进自己家，说能接待他是莫大的荣耀。国王却说，大会今天就结束，就算留下也帮不上什么忙。况且他心里急得很，恨不得马上赶回印度洋，立刻开始感化那些海盗。
        - id: ch04-b12
          speaker: huck
          text: 回到木筏后，他把钱数了一遍，竟有八十七块七角五分。他还带回一大罐威士忌，足足能装三加仑，是离开会场、穿过树林时从一辆马车底下找到的。国王把所有收获合在一起算了算，说这是自己做传教买卖以来最好的一天。要拿宗教大会挣钱，异教徒和海盗相比，简直连玉米皮也不值。
    - id: ch05
      title: 公爵的妙计
      blocks:
        - id: ch05-b01
          speaker: huck
          text: 国王回来以前，公爵还觉得自己那一天干得相当不错。看见国王拿出那一大笔钱以后，他便没那么得意了。他在印刷所排版印刷，替农夫做了两份卖马广告，收了四块钱。又替报纸揽到价值十块钱的广告，说只要预先付款，四块钱就肯刊登，对方真照他说的付了钱。
        - id: ch05-b02
          speaker: huck
          text: 报纸原本一年两块钱，公爵却用每份五角的价钱收了三笔订阅，条件还是必须预付。订户原本想照往常一样，拿劈柴和洋葱抵账。他却说自己刚刚买下这家铺子，已经把价钱降到承担得起的最低程度，以后经营只收现金。
        - id: ch05-b03
          speaker: huck
          text: 他还凭自己的脑袋编了一首小诗，一共三节，甜蜜里带着哀伤，题目叫《压吧，冷酷的世界，压碎这颗破碎的心》。他亲手排好字版，原样留在印刷所里，报纸拿去就能印，而且一分钱也没收。这样算下来，他一共挣到九块五角，还说这一天的活干得相当公道。
        - id: ch05-b04
          speaker: huck
          text: 随后公爵拿出另一张印刷品。这一份他没有收费，因为是专门替我们做的。纸上画着一个逃跑的黑奴，肩头扛着一根棍，棍上挑着包袱，画像下面写着“悬赏二百美元”。传单上的样貌把吉姆写得分毫不差，说他去年冬天从新奥尔良下游四十英里的圣雅克庄园逃走，很可能往北去了。谁把他抓住送回去，谁就能拿到赏金和路费。
        - id: ch05-b05
          speaker: duke
          text: 过了今晚，只要愿意，咱们白天也能走。有人过来时，就拿绳子捆住吉姆的手脚，把他放进棚屋，再亮出传单。咱们就说在上游抓住了他，因为穷得坐不起蒸汽船，朋友才赊给咱们一只小木筏，好让咱们去领赏金。
        - id: ch05-b06
          speaker: duke
          text: 手铐和锁链看着更像真的，可咱们既然穷，哪会有那些东西？它们未免太像首饰了。绳子才对。用舞台上的话说，整出戏必须前后一致。
        - id: ch05-b07
          speaker: huck
          text: 我们都夸公爵聪明。有了这个办法，白天行船也不会惹上麻烦。大家估摸着，只要当夜赶出足够远的一段路，就能躲开公爵在小镇印刷所干的那些勾当必定惹出的喧闹。从那以后，只要我们愿意，木筏就能全速向前赶。
        - id: ch05-b08
          speaker: huck
          text: 我们一直躲着不动，人人安安静静，直到快十点钟才把木筏撑出去。经过镇子时也离得远远的。等木筏完全出了镇上的视线，再也看不见那些灯火，我们才终于升起信号灯。
        - id: ch05-b09
          speaker: huck
          text: 凌晨四点，吉姆叫我起来换班。守了大半夜以后，他心里还惦记着木筏上这两位冒牌贵人。
        - id: ch05-b10
          speaker: jim
          text: 哈克，你说咱们这一路还会不会碰见更多国王？
        - id: ch05-b11
          speaker: huck
          text: 我想不会了。
        - id: ch05-b12
          speaker: jim
          text: 那就好。一两个国王我不介意，可这已经够多了。这个喝得烂醉，公爵也没好到哪儿去。
        - id: ch05-b13
          speaker: huck
          text: 吉姆原来一直想让国王说几句法语，好听听法语是什么样。国王却说，他在这个国家待得太久，又吃了太多苦，早把法语忘光了。
