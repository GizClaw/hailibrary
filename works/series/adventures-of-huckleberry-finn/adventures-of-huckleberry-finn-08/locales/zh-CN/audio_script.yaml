audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    captain:
      display_name: 渡船船长
      tts:
        delivery: 老练果断，发号施令时响亮直接
        timbre: 洪亮结实
        pace: 稳健
        pitch: 中低
    traveler:
      display_name: 赶路的男人
      tts:
        delivery: 旅途劳顿，说话简短务实
        timbre: 粗厚疲惫
        pace: 舒缓
        pitch: 中低
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
  chapters:
    - id: ch01
      title: 第八章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我醒来时，太阳已经升得老高，肯定过了八点。我躺在凉凉的草地和树阴里，东想西想，浑身的乏都歇过来了，舒服得根本不想动。四周全是大树，林子深处暗沉沉的。阳光只从一两个叶缝里钻进来，在地上洒下会慢慢挪动的光斑。这说明高处正有一点风。两只松鼠蹲在树枝上，亲热地冲我叫个不停。
        - id: ch01-b02
          speaker: huck
          text: 我正要重新睡过去，忽然听见上游远远传来一声炮响。紧接着又是一声。我跳起来，从树叶空隙往外看。渡口那边的水面浮着一团烟，一艘挤满人的渡船正顺流下来。船身又喷出白烟，我马上明白了。他们在河上放炮，想把我的尸首震出水面。
        - id: ch01-b03
          speaker: huck
          text: 我肚子很饿，却不敢生火，怕烟把人招来，只能坐着看炮烟，听一声声轰响，等他们搜我的残骸。夏天清早的河面足有一英里宽，望过去总是很好看。要是手里再有一口吃的，这场搜寻我尸首的热闹，便足够让我消磨一个早晨了。
        - id: ch01-b04
          speaker: huck
          text: 我忽然记起，人们会在面包里塞水银，让它漂去寻找淹死的人。据说面包碰到尸首就会停下。我便换到岛朝伊利诺伊州的那一面，等着看有没有面包肯来找我。
        - id: ch01-b05
          speaker: huck
          text: 一只大大的双联面包果真漂来。我站在水流最贴岸的地方，拿长棍去够，眼看就要到手，脚下一滑，又让它漂远了。过了一阵，又来一只，这回我赢了。我拔掉塞子，抖出那点水银，一口咬下去。这可是面包房烤的白面包，有身份的人才吃，不是穷人的玉米饼。
        - id: ch01-b06
          speaker: huck
          text: 我坐到树叶丛里，一面吃，一面看渡船，越想越觉得有意思。也许寡妇、牧师，或者别的什么人祷告过，求面包找到我，它还真的找到了。可见祷告多少有点用，只是得由路数合适的人来。我自己祷告就不灵。
        - id: ch01-b07
          speaker: huck
          text: 我点起烟斗，舒舒服服抽了好一阵，继续望着渡船。船顺流漂着，我算准它会像面包一样，沿着贴近岸边的水路从面前经过。等它渐渐靠近，我便熄掉烟斗，回到刚才捞面包的那片小空地，伏在岸边一根圆木后面，透过分叉的木头往外窥看。
        - id: ch01-b08
          speaker: huck
          text: 船靠得近极了，只要搭块板，船上的人便能直接走上岸。镇上的人差不多全来了。爸爸、撒切尔法官、贝茜·撒切尔、乔·哈珀、汤姆·索亚、年老的波莉姨妈、席德和玛丽都在，还有许多别人。大家七嘴八舌谈着那桩凶杀案，船长忽然打断了他们。
        - id: ch01-b09
          speaker: captain
          text: 大家仔细看！这一带水流最贴岸。他也许已经被冲上来，缠在水边的灌木里了。但愿能在这里找到吧。
        - id: ch01-b10
          speaker: huck
          text: 我可一点也不希望他们找到。所有人都挤到栏杆边，探身盯着水边，脸几乎凑到我跟前。我看他们看得清清楚楚，他们却一点也看不见我。船长又喊了一声。
        - id: ch01-b11
          speaker: captain
          text: 都往后退！
        - id: ch01-b12
          speaker: huck
          text: 大炮就在眼前炸响，震得我耳朵发聋，烟也熏得我几乎看不见。我还以为自己完了。要是炮里真有弹丸，他们大概就能得到想找的尸首。幸好我没受伤。
        - id: ch01-b13
          speaker: huck
          text: 渡船绕过岛身凸出的地方，渐渐看不见了。炮声越来越远，一个钟头以后终于停了。整座岛有三英里长，我以为他们已经搜到岛尾，打算放弃。可他们还没有死心。船绕过岛尾，开足蒸汽，沿密苏里州那一边往上走，偶尔仍放一炮。我穿过树林去看。船到岛头正对面才彻底停火，斜渡到密苏里州河岸，回镇上去了。
        - id: ch01-b14
          speaker: huck
          text: 这下我知道自己安全了，不会再有人来搜。我把所有东西搬下独木舟，在密林里弄出一个舒服的营地。两条毯子搭成小帐篷，物品都塞在下面，雨便淋不着。我捉了一条鲶鱼，手头没有刀，只好用木锯把鱼肚锯开。太阳快落山时，我才生起营火，吃过晚饭，又放下一根钓线，等着钓明早的鱼。
        - id: ch01-b15
          speaker: huck
          text: 入夜后，我坐在营火旁抽烟，起先觉得这一切挺叫人满足，后来却慢慢有些孤单。我走到岸边坐下，听水流哗哗作响，一颗颗数天上的星星，也数顺流漂过去的圆木和木排，最后才回去睡觉。一个人孤单时，睡觉最能消磨时间。你不可能一直醒着难受，只要睡过去，那阵孤单很快也就熬完了。
        - id: ch01-b16
          speaker: huck
          text: 三天三夜都是这样，天天没有一点分别。再下一天，我沿着岛往下游探险。我是这里的主人，可以说整座岛都归我管，当然想摸清它的每个地方，不过主要还是为了打发时间。林子里有许多熟透的好草莓，也有青的夏葡萄和覆盆子，黑莓才刚开始结出来。我估摸再过一阵，它们全都能当吃食。
        - id: ch01-b17
          speaker: huck
          text: 我带着枪在密林里乱走，一直走到快接近岛尾。一路上我什么也没打，枪只是拿来防身的。真要打猎，我想留到营地附近再打，免得费力把猎物带回去。一条挺大的蛇忽然从脚边滑进花草里。我追着它，想找机会开枪，却一头闯到一堆还在冒烟的营火灰烬前。
        - id: ch01-b18
          speaker: huck
          text: 我的心猛地往上一蹿，简直钻进了肺里。我没敢多看，放下枪机，踮起脚飞快往回溜。每走一段，我就躲进密叶里停一下，侧耳听听，可自己喘得太响，别的什么也听不清。树桩看着像个人。脚下踩断一根树枝，也像有人把我的一口气劈成两半，只还给我短短的那半截。
        - id: ch01-b19
          speaker: huck
          text: 回到营地，我的胆气早没了。不过这时候不能磨蹭。我把全部家什藏回独木舟，灭掉火，再把灰撒开，伪装成去年留下的旧营地，然后爬上树躲着。
        - id: ch01-b20
          speaker: huck
          text: 我在树上待了大约两个钟头，什么也没看见，什么也没听见，却总以为四周藏着一千样动静，一会儿像有人走过，一会儿又像哪里有东西盯着我。后来实在不能永远待在上头，只好爬下来。可双脚一落地，我也不敢走到开阔处，只肯贴着浓密的树木活动。我一直缩在密林深处，时时刻刻留神四周，能找到的吃食只有浆果和早饭剩下的一点东西。
        - id: ch01-b21
          speaker: huck
          text: 到了夜里，我已经饿坏了。月亮还没升起来，我趁天黑悄悄离岸，划到四分之一英里外的伊利诺伊州河岸，进树林做了一顿晚饭。我差不多已经决定在那里过夜，忽然听见一阵咯噔咯噔的马蹄声，接着又有人说话。我赶紧把每样东西装回船里，再伏低身子钻进树林，想听清他们来做什么。
        - id: ch01-b22
          speaker: traveler
          text: 要是能找到合适的地方，咱们就在这里扎营吧。马都快累垮了，先四下找找。
        - id: ch01-b23
          speaker: huck
          text: 我没再等，马上把船推离岸边，轻轻划回老地方，打算睡在独木舟里。
        - id: ch01-b24
          speaker: huck
          text: 可我没睡多少，怎么躺也睡不踏实，脑子里总惦记着那个陌生人。每回惊醒，都觉得有人已经一把掐住了我的脖子。这样的觉睡了也不能解乏，这种日子更没法过。我对自己说，非查明岛上的那个人是谁不可，哪怕豁出去也得弄明白。主意一定，我反倒立刻轻松了。
        - id: ch01-b25
          speaker: huck
          text: 我拿起桨，只把船划离岸边一两步，随后任它藏在阴影里顺流而下。月亮正亮，阴影外头几乎跟白天一样。我慢慢走了将近一个钟头，四下静得像石头，仿佛一切都睡熟了。快到岛尾时，一阵凉风吹过水面，推起细小的波纹。那就跟一句话一样明白，夜快过去了。
        - id: ch01-b26
          speaker: huck
          text: 我拨了一下桨，让船头靠岸，带枪钻进林边，坐在圆木上透过树叶望出去。月亮像是交了班，慢慢隐去，黑暗盖住河面。没多久，树梢上露出一线灰白，我知道天就要亮了。我朝发现营火的地方摸去，每隔一两分钟便停下来听，可怎么也找不准。后来，树木深处终于闪出一点火光，我便放轻脚步，慢慢靠过去。
        - id: ch01-b27
          speaker: huck
          text: 我走到能看清的地方，发现一个人躺在地上，毯子蒙着头，脑袋几乎伸进火里。我差点吓得魂都没了，只敢躲在六英尺外的灌木后面，一眼不眨地盯着他。天色渐渐发灰。那人终于打个哈欠，伸伸懒腰，一把掀开毯子。原来是华生小姐的吉姆！看清他的脸，我别提多高兴了，立刻跳出去招呼他。
        - id: ch01-b28
          speaker: huck
          text: 喂，吉姆！
          emotion: happy
        - id: ch01-b29
          speaker: huck
          text: 他猛地跳起来，惊恐地瞪着我，又扑通跪下，双手合在胸前。
        - id: ch01-b30
          speaker: jim
          text: 别害我，求你了！我从来没伤过鬼魂。我一直敬重死人，能帮他们的事也都帮过。你回河里去吧，回你该待的地方。别碰老吉姆，他一直是你的朋友啊！
          emotion: fearful
        - id: ch01-b31
          speaker: huck
          text: 我很快让他明白自己没有见鬼。见到吉姆，我别提多快活了，这下再也不孤单。我还告诉他，我不怕他泄露我的藏身处。我说了半天，他只坐着看我，始终没有开口。
        - id: ch01-b32
          speaker: huck
          text: 天已经大亮。咱们吃早饭吧，把火烧旺一点。
        - id: ch01-b33
          speaker: jim
          text: 把火烧旺又有什么用？还不是煮草莓和那些野东西。不过你有枪，对吧？那咱们总算能弄点比草莓强的吃食了。
        - id: ch01-b34
          speaker: huck
          text: 你就靠草莓和那些野东西活着？
        - id: ch01-b35
          speaker: jim
          text: 我找不到别的东西。
        - id: ch01-b36
          speaker: huck
          text: 你在这座岛上多久了？
        - id: ch01-b37
          speaker: jim
          text: 你被杀的第二天夜里，我就上岛了。
        - id: ch01-b38
          speaker: huck
          text: 你一直待到现在？这些天除了那种破烂吃食，什么也没吃？那你不是快饿死了？
        - id: ch01-b39
          speaker: jim
          text: 是啊，先生，什么也没吃。我看自己现在能吞下一匹马。你又是什么时候上岛的？
        - id: ch01-b40
          speaker: huck
          text: 从我被杀的那一晚起。
        - id: ch01-b41
          speaker: jim
          text: 真的？那你吃什么活下来的？对了，你有枪，这就好办了。你去打点东西，我来把火烧旺。
        - id: ch01-b42
          speaker: huck
          text: 我们回到藏独木舟的地方。吉姆在林间一片长草的空地生火，我从船里一样样搬出玉米面、咸猪肉、咖啡、咖啡壶、煎锅、糖和白铁杯。他越看越吃惊，认定这些全是我用巫术变出来的。我又捉到一条大鲶鱼，他拿自己的刀收拾干净，放进锅里煎熟。
        - id: ch01-b43
          speaker: huck
          text: 早饭做好以后，我们舒舒服服躺在草地上，趁食物还烫着便大吃起来。吉姆几乎饿坏了，使足了力气往肚里塞。两个人都吃得滚圆，再也不想动弹，便各自躺开来，懒洋洋地歇着。过了一阵，他终于想起那桩疑问，开口问起木屋里的事。
        - id: ch01-b44
          speaker: jim
          text: 哈克，木屋里死的如果不是你，那究竟是谁？
        - id: ch01-b45
          speaker: huck
          text: 我把野猪、血迹、石头口袋和玉米面留下的假线索，从头到尾讲了一遍。吉姆说这法子聪明极了，就连汤姆·索亚也想不出更好的。接着，我问他为什么会在岛上，又是怎么来到这里的。
        - id: ch01-b46
          speaker: jim
          text: 这件事，我也许不该告诉你。
        - id: ch01-b47
          speaker: huck
          text: 为什么不能说？
        - id: ch01-b48
          speaker: jim
          text: 我有我的难处。可我要真说了，你不会告发我吧，哈克？
        - id: ch01-b49
          speaker: huck
          text: 我要是告发你，就叫我不得好死。
        - id: ch01-b50
          speaker: jim
          text: 好，我相信你。哈克，我……我是逃出来的。
        - id: ch01-b51
          speaker: huck
          text: 吉姆，原来你真的逃出来了！
          emotion: surprised
        - id: ch01-b52
          speaker: jim
          text: 你答应过不告发我的。哈克，这话可是你亲口说的。
          emotion: fearful
        - id: ch01-b53
          speaker: huck
          text: 对，我答应了，就一定守信。别人会骂我是下贱的废奴派，因为我知情不报，可那有什么关系？我绝不会告发你，反正自己也不回去了。你把全部经过说给我听吧。
        - id: ch01-b54
          speaker: jim
          text: 华生小姐总挑我的毛病，对我也很狠，不过她一直说不会把我卖到新奥尔良。近来却有个贩奴的人常在那一带转悠，我越来越不放心。一天深夜，我悄悄走到没关严的门边，听见她告诉寡妇，自己打算把我卖掉。她说心里并不情愿，可人家肯出八百块钱，那是一大笔钱，她实在抵挡不住。寡妇努力劝她答应别卖，我没敢等着听结果，转身就拼命逃了。
        - id: ch01-b55
          speaker: jim
          text: 我冲下山坡，本想去镇子上游的岸边偷一只小划子，可外面还有人走动，只好藏进岸边那间破旧的箍桶匠铺子，等所有人离开。可那里整夜都有人来往。早晨六点左右，开始有小船经过。到了八九点，每条经过的船都在说，你爸爸进镇报信，说你被人杀了。
        - id: ch01-b56
          speaker: jim
          text: 后来的船上坐满了先生太太，他们全要过河看现场。有些船会在岸边停下歇一会儿，再继续渡河。我躲着听他们谈话，也就一点点弄清了那桩凶杀案的全部情形。哈克，那时我以为你真的死了，心里难受得很。现在知道你活着，当然一点也不难受了。
        - id: ch01-b57
          speaker: jim
          text: 我一整天埋在刨花底下。虽然饿，却不担心。华生小姐和寡妇吃过早饭就会去参加野外宗教集会，整天不回来。她们知道我天一亮就会赶牲口出去，本来便不指望在家附近见到我，直到晚上才会发现我失踪。其他仆人更不会找我。老人一出门，他们自己早就溜出去放假了。
        - id: ch01-b58
          speaker: jim
          text: 天黑后，我沿河边大路往上游跑了两英里多，一直跑到没有人家的地方。我早已想好了办法。要是从陆上逃，狗会跟着气味追。要是偷小划子过河，失主一发现船没了，就能猜到我大约从对岸哪里登陆，再接上我的踪迹。所以我决定等一张木排。木排在水上走，可不会留下脚印。
        - id: ch01-b59
          speaker: jim
          text: 后来一点灯光绕过河岬，我便蹚进水里，推着一根圆木游过大半条河，再钻进漂木中间，压低脑袋，一边逆着水流游，一边等候。木排一到，我就游到尾部，伸手抓住它。云正好遮住了天，四周暗了好一阵，我趁机爬上木板躺下。那些汉子全在老远的中间，守着灯笼，谁也没发现我。
        - id: ch01-b60
          speaker: jim
          text: 河正涨水，流得很快。我估计早晨四点就能到下游二十五英里外，再趁天亮前悄悄下水，游上伊利诺伊州河岸，钻进树林。可我偏偏没有这个运气。木排快到岛头时，有个人提着灯笼朝后面走来。我一看再等准会被发现，只得从木排边滑进河里，掉头朝岛上游。
        - id: ch01-b61
          speaker: jim
          text: 我本来以为哪儿都能上岸，谁知河岸陡得根本爬不上去，一直游到快接近岛尾，才找到一处合适的地方。我钻进树林，心想只要木排上的人还会提着灯笼到处走，以后再也不碰木排了。好在烟斗、一块黑烟草和几根火柴都装在帽子里，一点没有弄湿，所以我也就能过下去。
        - id: ch01-b62
          speaker: huck
          text: 所以你这些天一点肉和面包也没吃？怎么不抓泥龟？
        - id: ch01-b63
          speaker: jim
          text: 怎么抓？你又不能悄悄靠近，一伸手就抓住。拿石头也打不中。黑夜里办不到，白天我又不能到岸边露脸。
        - id: ch01-b64
          speaker: huck
          text: 也是，你只能一直藏在树林里。那你听见他们放炮了吗？
        - id: ch01-b65
          speaker: jim
          text: 当然听见了。我知道他们在找你，还隔着灌木看见渡船从这里经过。
        - id: ch01-b66
          speaker: huck
          text: 几只幼鸟飞来，每次只飞一两码，落下后又继续飞。吉姆说这是下雨的预兆，因为小鸡要是这样飞，天就会下雨，野鸟的幼鸟想来也一样。我正打算抓几只，他赶紧拦住，说那会招来死亡。他父亲有一次病得很重，家里有人捉了一只鸟，他老祖母立刻说父亲会死，后来果真死了。
        - id: ch01-b67
          speaker: huck
          text: 吉姆还说，准备做晚饭的东西绝对不能事先数，否则会招来坏运气。太阳落山以后抖桌布也一样。谁家养着蜂，那个人要是死了，第二天日出以前一定得把死讯告诉蜜蜂。不然蜜蜂会一天天衰弱，停止干活，最后全都死掉。他又说蜜蜂从来不蜇傻子。我可不信这种话，因为自己已经试过好多回，它们确实从没蜇过我。
        - id: ch01-b68
          speaker: huck
          text: 这些说法里，有几样我以前听过，却没有全部听过。吉姆懂得形形色色的预兆，还说自己差不多什么都知道。我越听越觉得不对，好像每一种预兆说的都是坏运气。于是我问他，难道就没有预示好运的吗？
        - id: ch01-b69
          speaker: jim
          text: 少得很，而且知道了也没用。你为什么非要预先知道好运快来？难道还想把它拦回去？不过胳膊和胸口长满毛，倒预示将来会发财。这个说法还有点用，因为发财也许要等很久。一个人可能先穷上好多年，要是不知道以后会有钱，说不定一灰心就把自己杀了。
        - id: ch01-b70
          speaker: huck
          text: 那你的胳膊和胸口有毛吗？
        - id: ch01-b71
          speaker: jim
          text: 这还用问？你不是看得见吗？
        - id: ch01-b72
          speaker: huck
          text: 可你有钱吗？
        - id: ch01-b73
          speaker: jim
          text: 现在没有，从前倒有过，以后也会再有。我曾经攒下十四块钱，后来拿去做买卖，全赔光了。
        - id: ch01-b74
          speaker: huck
          text: 你拿它做什么买卖？
        - id: ch01-b75
          speaker: jim
          text: 先做牲口买卖。我用十块钱买了一头牛，可那头牛死在我手里。以后我再也不敢拿钱冒这种险了。
        - id: ch01-b76
          speaker: huck
          text: 所以十块钱全赔了？
        - id: ch01-b77
          speaker: jim
          text: 没有全赔。我把牛皮和牛油卖掉，收回一块一毛钱，总共只亏了差不多九块。
        - id: ch01-b78
          speaker: huck
          text: 那你还剩五块一毛，后来又做买卖了吗？
        - id: ch01-b79
          speaker: jim
          text: 做了。老布拉迪什先生家那个少一条腿的黑奴开了一家银行，说谁存一块钱，年底就能多拿四块。大家都存了，可他们没有多少钱，只有我手里算是有一笔。我不肯只拿四块，坚持要更多，不然就自己开一家银行。他怕我抢生意，说这里的买卖养不起两家银行，最后答应我存五块，年底给我三十五块。
        - id: ch01-b80
          speaker: jim
          text: 我把钱存进去，又想把年底才拿到的三十五块立刻投出去，好让买卖一直滚下去。有个叫鲍勃的黑奴捞到一条运木平底船，他主人还不知道。我从他手里买下那条船，叫他等年底再拿三十五块。可当天夜里船就被偷了，第二天那个少一条腿的人又宣布银行倒闭。我们谁的钱都没拿到。
        - id: ch01-b81
          speaker: huck
          text: 那剩下的一毛钱呢？
        - id: ch01-b82
          speaker: jim
          text: 我本来想把它花掉，可后来做了一个梦。梦叫我把钱交给一个名叫巴兰的黑奴。大家管他叫“巴兰的驴”，说白了，他是个脑子不灵的家伙。可人们都说他运气好，而我知道自己的运气不好。梦里说，让巴兰替我拿这一毛钱做买卖，准能赚上一笔。
        - id: ch01-b83
          speaker: jim
          text: 巴兰拿着钱去了教堂。牧师说，把钱给穷人，就等于借给主，以后准能收回一百倍。巴兰便把那一毛钱送给穷人，安静等着看会发生什么。
        - id: ch01-b84
          speaker: huck
          text: 后来真的有回报吗？
        - id: ch01-b85
          speaker: jim
          text: 什么也没有。我用尽办法也讨不回来，巴兰同样没办法。以后要是亲眼看不见抵押，我再也不把钱借出去。牧师明明说能收回一百倍！可如今只要拿回原来那一毛钱，我就愿意算作两清，还得庆幸自己碰上了这么好的运气。
        - id: ch01-b86
          speaker: huck
          text: 反正你以后还会发财，那就没关系了。
        - id: ch01-b87
          speaker: jim
          text: 对。仔细想想，我现在已经很有钱了。我是自己的主人，而我值八百块钱。要是那八百块真在手里，我就什么也不缺了。
