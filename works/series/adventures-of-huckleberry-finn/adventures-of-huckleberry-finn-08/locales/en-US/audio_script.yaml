  chapters:
    - id: ch01
      title: CHAPTER VIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: By the time I woke, the sun was high enough that I figured it must be past eight. I stayed stretched out in the cool grass and shade, thinking and feeling rested and comfortable. Big trees stood all around me, so it was gloomy under them. Sunlight came through one or two openings and made freckled patches on the ground. Those patches shifted a little, which told me a breeze was moving above the leaves. Two squirrels sat on a limb and chattered at me like friends.
        - id: ch01-b02
          speaker: huck
          text: I felt too lazy to get up and cook breakfast. I was nearly asleep again when a deep boom came from far upriver. I raised myself on one elbow and listened. Soon it came again. I jumped up, found an opening in the leaves, and looked out. A cloud of smoke lay on the water near the ferry, and the ferryboat was drifting downstream, packed with people. Then I understood. Another boom sounded, and white smoke shot from the boat's side. They were firing a cannon over the water to make my dead body rise.
        - id: ch01-b03
          speaker: huck
          text: I was mighty hungry, but I could not risk a fire. Somebody might see the smoke. So I sat there watching the cannon smoke and listening to the booms. The river was a mile wide and looked fine that summer morning. Watching them hunt for what was left of me would have been pleasant enough if I had something to eat.
        - id: ch01-b04
          speaker: huck
          text: Then I remembered that people put quicksilver inside loaves of bread and float them out. They believed a loaf would travel straight to a drowned body and stop there. I decided to watch for any bread that came looking for me. I moved to the Illinois side of the island, where the current ran closest to shore.
        - id: ch01-b05
          speaker: huck
          text: Before long, a large double loaf floated past. I nearly reached it with a long stick, but my foot slipped and the loaf drifted away. Later another one came, and this time I got it. I pulled out the plug, shook away the little bit of quicksilver, and took a bite. It was baker's bread, the kind well-off people ate, not plain corn pone.
        - id: ch01-b06
          speaker: huck
          text: I found a leafy place, sat on a log, and ate while I watched the ferryboat. Then a thought struck me. Maybe the widow or the parson had prayed for that bread to find me, and it had. So there had to be something to prayer when the right kind of person did it. It never worked for me, though, and I reckoned it only worked for certain people.
        - id: ch01-b07
          speaker: huck
          text: I lit my pipe, took a long smoke, and kept watching. The ferryboat was moving with the current. Since it followed the same water as the bread, I figured it would pass close enough for me to see who was aboard. When it came near, I put out my pipe and returned to the spot where I had caught the loaf. I lay behind a forked log in a small open place by the bank and peeked through the gap.
        - id: ch01-b08
          speaker: huck
          text: The boat drifted so close that the people could have laid down a plank and walked ashore. Nearly everyone was aboard. I saw Pap, Judge Thatcher, Bessie Thatcher, Jo Harper, Tom Sawyer, Aunt Polly, Sid, Mary, and plenty more. They were all talking over the murder and what might have happened to me. Then the captain cut through their talk.
        - id: ch01-b09
          speaker: captain
          text: Keep a sharp watch here. The current runs closest to the island at this spot. Maybe the boy washed ashore and got caught in the brush by the water. I surely hope so.
        - id: ch01-b10
          speaker: huck
          text: I surely did not. Everybody crowded against the rail and leaned over, almost in my face. They went quiet and stared as hard as they could. I saw them perfectly, but none of them saw me.
        - id: ch01-b11
          speaker: captain
          text: Move back, everybody!
        - id: ch01-b12
          speaker: huck
          text: The cannon fired right in front of me. The blast nearly deafened me, and the smoke nearly blinded me. For a moment I thought I was finished. If the cannon had held any shot, they might have found the corpse they wanted. But I was not hurt, thank goodness.
        - id: ch01-b13
          speaker: huck
          text: The boat floated on and disappeared around the shoulder of the island. Every now and then I heard another boom, each one farther off than the last. After about an hour, the sound stopped altogether. The island was three miles long, so I guessed the boat had reached the foot and the search was over. It was not. They rounded the foot and came back up the Missouri channel under steam, firing the cannon once in a while as they went. I crossed the island and watched from that side. When they reached the head of the island, they finally quit shooting, moved over to the Missouri shore, and went home to town.
        - id: ch01-b14
          speaker: huck
          text: Now I knew I was safe. Nobody else would come hunting for me. I took my things from the canoe and made a camp deep in the woods. I rigged my blankets into a little tent so the rain could not reach my supplies. I caught a catfish and cut it open with my saw. Near sundown I built a fire and cooked supper, then set a line to catch fish for breakfast.
        - id: ch01-b15
          speaker: huck
          text: After dark, I sat by the fire smoking and felt well satisfied. In time I got lonesome. I went to the bank, listened to the current washing past, and counted the stars, drift logs, and rafts moving downriver. Then I went to bed. Sleeping is about the best way to pass lonely time. You cannot stay lonely while you are asleep, and soon the feeling goes away.
        - id: ch01-b16
          speaker: huck
          text: Three days and nights went by. Each one was just like the one before it. On the next day, I went exploring down through the island. I was the boss of the place, and it all belonged to me, so to speak. I wanted to learn everything about it, but mostly I needed something to fill the time. I found plenty of strawberries, ripe and good. The summer grapes and raspberries were still green, and the green blackberries were only beginning to appear. I reckoned all of them would come in useful later.
        - id: ch01-b17
          speaker: huck
          text: I wandered through the deep woods until I thought I was near the foot of the island. I carried my gun for protection, though I had not shot anything. I meant to hunt closer to camp. Then I almost stepped on a good-sized snake. It slid away through the grass and flowers, and I chased it, trying for a shot. All at once I came upon the ashes of a campfire. They were still smoking.
        - id: ch01-b18
          speaker: huck
          text: My heart jumped up among my lungs. I did not stop to look around. I uncocked the gun and crept back on tiptoe as fast as I could. Every little while I paused among the thick leaves to listen, but my own breathing was so hard that I heard nothing else. Then I crept farther and tried again. Every stump looked like a man. When I broke a stick underfoot, it felt as if somebody had cut one of my breaths in two and left me only the short half.
        - id: ch01-b19
          speaker: huck
          text: I did not feel very brave when I reached camp, but this was no time to fool around. I loaded everything back into the canoe and hid it. I put out my fire and scattered the ashes until the place looked like an old camp from last year. Then I climbed a tree.
        - id: ch01-b20
          speaker: huck
          text: I stayed in that tree for about two hours. I never truly saw or heard a thing, but I thought I saw and heard about a thousand. I could not stay up there forever, so at last I climbed down. Even then, I kept inside the thick woods and watched every direction as I moved. I did not dare return to ordinary camp life. The only food I could get was berries and whatever remained from breakfast.
        - id: ch01-b21
          speaker: huck
          text: By night I was hungry. Once it was fully dark and before the moon rose, I paddled a quarter mile to the Illinois bank. I went into the woods and cooked supper. I had almost decided to stay there all night when I heard hooves going plunkety-plunk, plunkety-plunk. Horses were coming. Then I heard voices. I packed the canoe fast and crept through the woods to learn what I could.
        - id: ch01-b22
          speaker: traveler
          text: We had better stop here if we can find a decent place. The horses are nearly worn out. Let's have a look around.
        - id: ch01-b23
          speaker: huck
          text: I did not wait. I pushed off and paddled away quietly. Back at my old place, I tied up and planned to sleep in the canoe.
        - id: ch01-b24
          speaker: huck
          text: I hardly slept in the canoe. Somehow, my thoughts would not let me rest. Every time I woke, I thought somebody had caught me by the neck. The little sleep I got did me no good at all. At last I told myself I could not keep living that way. I was going to find out who else was on the island, even if the trying broke me. As soon as I made up my mind, I felt better.
        - id: ch01-b25
          speaker: huck
          text: I eased the canoe a few feet from shore and let it drift downstream through the shadows. Moonlight made the open water almost as bright as day. I moved along for close to an hour while everything stayed still as stone and sound asleep. Near the foot of the island, a cool little breeze rippled the water. That told me the night was nearly over.
        - id: ch01-b26
          speaker: huck
          text: I turned the canoe toward shore, took my gun, and slipped into the edge of the woods. From a log I watched the moon go off duty and darkness cover the river. Soon a pale line appeared above the treetops. Day was coming. I started toward the smoking campfire, stopping every minute or two to listen. At first I could not find it. Then I caught the shine of a fire between the trees and moved toward it slowly.
        - id: ch01-b27
          speaker: huck
          text: Once I got close enough to see, a man was lying on the ground. A blanket covered his head, and his head was almost in the fire. The sight gave me the shakes. I crouched behind a clump of bushes only six feet away and never took my eyes off him. Gray daylight was spreading through the woods. After a while, the man yawned and stretched. He pushed away the blanket, and there was Miss Watson's Jim. I had never been so glad to see anybody.
        - id: ch01-b28
          speaker: huck
          text: Hello, Jim!
          emotion: happy
        - id: ch01-b29
          speaker: huck
          text: I jumped out. Jim sprang up and stared at me with wild eyes. Then he dropped to his knees and pressed his hands together.
        - id: ch01-b30
          speaker: jim
          text: Don't hurt me! Please don't! I never did any harm to a ghost. I always liked dead folks and did everything I could for them. You go back in the river where you belong, and don't do anything to old Jim. I was always your friend.
          emotion: fearful
        - id: ch01-b31
          speaker: huck
          text: It did not take long to show him I was alive. I was mighty glad to see him. I was not lonely anymore. I told him I was not afraid that he would tell anybody where I was. I kept talking, but Jim only sat and stared at me without saying a word.
        - id: ch01-b32
          speaker: huck
          text: Daylight's here. Let's have breakfast. Build your fire up.
        - id: ch01-b33
          speaker: jim
          text: What good is a fire if all we got to cook is strawberries and that sort of thing? Wait, you got a gun, don't you? Then we can get something better than berries.
        - id: ch01-b34
          speaker: huck
          text: Strawberries and that sort of thing? Is that all you've been eating?
        - id: ch01-b35
          speaker: jim
          text: I couldn't find anything else.
        - id: ch01-b36
          speaker: huck
          text: How long have you been on this island, Jim?
        - id: ch01-b37
          speaker: jim
          text: I came the night after you got killed.
        - id: ch01-b38
          speaker: huck
          text: You've been here all that time?
        - id: ch01-b39
          speaker: jim
          text: Yes, I surely have.
        - id: ch01-b40
          speaker: huck
          text: And you haven't eaten anything but berries and such rubbish?
        - id: ch01-b41
          speaker: jim
          text: No, sir. Nothing else.
        - id: ch01-b42
          speaker: huck
          text: You must be nearly starved.
        - id: ch01-b43
          speaker: jim
          text: I reckon I could eat a horse. How long have you been here?
        - id: ch01-b44
          speaker: huck
          text: Since the night I got killed.
        - id: ch01-b45
          speaker: jim
          text: No! Then what have you been eating? Oh, that's right. You got a gun. That's good. You go kill something, and I'll get the fire going.
          emotion: surprised
        - id: ch01-b46
          speaker: huck
          text: We went to the canoe. Jim built a fire in a grassy opening among the trees while I brought out cornmeal, bacon, coffee, a coffeepot, a frying pan, sugar, and tin cups. Jim leaned back in amazement. He thought witchcraft had produced it all. I caught a large catfish too. Jim cleaned it with his knife and fried it.
        - id: ch01-b47
          speaker: huck
          text: When breakfast was ready, we stretched out on the grass and ate it smoking hot. Jim ate with all his might because he was close to starving. Once we were full, we lay around and took it easy. After a while, Jim spoke.
        - id: ch01-b48
          speaker: jim
          text: Hold on, Huck. If you weren't the one killed in that cabin, then who was it?
        - id: ch01-b49
          speaker: huck
          text: I told him the whole story. Jim said it was a smart plan, as good as anything Tom Sawyer could have invented. Then I asked how he had come to the island. He looked uneasy and stayed quiet for a minute.
        - id: ch01-b50
          speaker: jim
          text: Maybe I ought not tell you.
        - id: ch01-b51
          speaker: huck
          text: Why not, Jim?
        - id: ch01-b52
          speaker: jim
          text: I got my reasons. But if I tell you, Huck, you won't turn me in, will you?
        - id: ch01-b53
          speaker: huck
          text: I surely won't.
        - id: ch01-b54
          speaker: jim
          text: All right. I believe you. Huck, I... I ran away.
        - id: ch01-b55
          speaker: huck
          text: Jim!
          emotion: surprised
        - id: ch01-b56
          speaker: jim
          text: Remember your promise, Huck. You said you wouldn't tell. You know you did.
          emotion: fearful
        - id: ch01-b57
          speaker: huck
          text: I did promise, and I mean to keep it. Honest, I do. Folks will call me a low-down abolitionist and despise me for staying quiet, but that makes no difference. I won't tell, and I won't go back there anyway. Now tell me what happened.
        - id: ch01-b58
          speaker: jim
          text: Miss Watson kept picking at me and treating me rough. She always said she would never sell me down to New Orleans. Then a slave trader started hanging around the place, and I got worried. Late one night, I crept near the door. It wasn't shut all the way. I heard Miss Watson tell the widow she planned to sell me down to New Orleans. She didn't want to do it, but she could get eight hundred dollars for me. That was more money than she could turn down. The widow tried to talk her out of it. I didn't wait to hear the rest. I left as fast as I could.
        - id: ch01-b59
          speaker: jim
          text: I ran down the hill, meaning to steal a skiff somewhere above town. Too many people were still moving around, so I hid in the old broken-down cooper shop by the river and waited for them to leave. I stayed there all night because somebody was always nearby.
        - id: ch01-b60
          speaker: jim
          text: Around six in the morning, skiffs began passing. By eight or nine, everybody in them was talking about how your pap had crossed over and said you were killed. Those later boats carried ladies and gentlemen going to see the place. Some stopped at the bank for a rest before crossing, and I learned the whole story by listening. I was mighty sorry you were dead, Huck. I ain't sorry now.
        - id: ch01-b61
          speaker: jim
          text: I stayed buried under those wood shavings all day. I was hungry, but I wasn't afraid they would start hunting me yet. Miss Watson and the widow were leaving for the camp meeting right after breakfast, and they would be gone all day. They knew I usually took the cattle out around daylight. They would not expect to see me near the house, and they would not know I was missing until after dark. The other servants would not miss me either. As soon as the old folks were out of the way, they would slip off and take a holiday of their own.
        - id: ch01-b62
          speaker: jim
          text: When darkness came, I followed the river road more than two miles, past all the houses. I had worked out a plan. If I escaped on foot, the dogs would track me. If I stole a skiff to cross the river, people would miss it and know about where I landed. Then they could pick up my trail. What I needed was a raft. A raft leaves no track.
        - id: ch01-b63
          speaker: jim
          text: After a while, I saw a light coming around the point. I waded in, pushed a log ahead of me, and swam more than halfway across. I got among the driftwood, kept my head low, and moved against the current until the raft reached me. Then I swam to the stern and grabbed hold.
        - id: ch01-b64
          speaker: jim
          text: Clouds covered the sky, and it stayed good and dark for a while. I climbed onto the raft and lay flat on the planks. All the men were a long way off in the middle, gathered where the lantern was burning. The river was rising, and the current was strong. I figured the raft would carry me twenty-five miles downstream by four in the morning. Then, just before daylight gave me away, I could slip into the water, swim to the Illinois shore, and disappear into the woods.
        - id: ch01-b65
          speaker: jim
          text: But my luck went bad. Near the head of this island, a man started walking toward the back of the raft with the lantern. I could not wait. I slid into the river and headed for the island. I thought I could land anywhere, but the bank was too steep. I got nearly to the foot before I found a place to climb out.
        - id: ch01-b66
          speaker: jim
          text: I went into the woods and decided I was done with rafts if men were going to carry lanterns around. I still had my pipe, a plug of cheap tobacco, and some matches tucked in my cap. They stayed dry, so I was all right.
        - id: ch01-b67
          speaker: huck
          text: You really went all that time without meat or bread? Why didn't you catch some mud turtles?
        - id: ch01-b68
          speaker: jim
          text: How was I supposed to catch them? You can't sneak up and grab one. You can't hit one with a rock in the dark, either. I wasn't about to show myself on the riverbank during the day.
        - id: ch01-b69
          speaker: huck
          text: That's true. You had to stay hidden in the woods. Did you hear them firing the cannon?
        - id: ch01-b70
          speaker: jim
          text: Oh, yes. I knew they were searching for you. I watched the boat pass from behind the bushes.
        - id: ch01-b71
          speaker: huck
          text: Some young birds came by, flying only a yard or two at a time and landing again. Jim said that meant rain was coming. When young chickens flew that way, it was a sure sign of rain, so he reckoned young wild birds must give the same warning. I started to catch some, but Jim would not let me. Catching one meant death, he said. His father had once been terribly sick when somebody caught a bird. Jim's grandmother warned that his father would die, and that was exactly what happened.
        - id: ch01-b72
          speaker: huck
          text: Jim had more warnings. Never count the things you plan to cook for dinner, or bad luck will come. Never shake a tablecloth after sunset, either. If a man who keeps bees dies, somebody must tell the bees before sunrise the next morning. Otherwise they will grow weak, stop working, and die. Jim said bees would not sting idiots. I did not believe that, because I had tried them plenty of times and they never stung me.
        - id: ch01-b73
          speaker: huck
          text: I had heard some of those signs before, but not all of them. Jim seemed to know every kind. I pointed out that they all appeared to be about bad luck. Weren't there any signs for good luck?
        - id: ch01-b74
          speaker: jim
          text: Mighty few, and those ain't much use. Why would you want to know good luck is coming? Are you planning to chase it away? Now, hairy arms and a hairy chest mean you'll be rich someday. A sign like that can help, because the money may be a long way off. A man might stay poor so long that he gets discouraged and kills himself, unless the sign tells him riches are coming later.
        - id: ch01-b75
          speaker: huck
          text: Do you have hairy arms and a hairy chest, Jim?
        - id: ch01-b76
          speaker: jim
          text: Why ask me that? You can see that I do.
        - id: ch01-b77
          speaker: huck
          text: Then are you rich?
        - id: ch01-b78
          speaker: jim
          text: Not now. I was rich once, though, and I'll be rich again. I used to have fourteen dollars. Then I went into speculating and lost nearly all of it.
        - id: ch01-b79
          speaker: huck
          text: What did you speculate in?
        - id: ch01-b80
          speaker: jim
          text: First I tried stock.
        - id: ch01-b81
          speaker: huck
          text: What kind of stock?
        - id: ch01-b82
          speaker: jim
          text: Livestock. Cattle, you know. I put ten dollars into a cow. I won't risk money in stock again. That cow went and died on me.
        - id: ch01-b83
          speaker: huck
          text: So you lost all ten dollars.
        - id: ch01-b84
          speaker: jim
          text: Not all of it. I only lost about nine dollars. I sold the hide and the tallow for a dollar and ten cents.
        - id: ch01-b85
          speaker: huck
          text: That left you five dollars and ten cents. Did you try another investment?
        - id: ch01-b86
          speaker: jim
          text: I did. You know that one-legged man who belongs to old Mister Bradish? He opened a bank and said anyone who put in one dollar would get four more at the end of the year. Everybody put something in, but most had very little. I was the only one with much money. I demanded better than four dollars and said I would start my own bank if I didn't get it.
        - id: ch01-b87
          speaker: jim
          text: He wanted to keep me from competing, because there wasn't enough business for two banks. So he offered to take my five dollars and pay me thirty-five at the end of the year. I agreed.
        - id: ch01-b88
          speaker: jim
          text: Then I planned to invest those thirty-five dollars right away and keep my money moving. A man named Bob had found a wood flat without his owner knowing. I bought it from him and promised he could collect the thirty-five dollars at the end of the year. Somebody stole the wood flat that very night. The next day, the one-legged man said the bank had failed. None of us got any money.
        - id: ch01-b89
          speaker: huck
          text: What happened to your last ten cents?
        - id: ch01-b90
          speaker: jim
          text: I meant to spend it, but I had a dream. The dream told me to give it to a fellow named Balum. Folks called him Balum's Ass because he was a fool, but they also said he was lucky. I knew I wasn't lucky, so I let Balum invest the ten cents and make something for me.
        - id: ch01-b91
          speaker: jim
          text: Balum took the money. In church, he heard the preacher say that whoever gave to the poor was lending to the Lord and would get the money back a hundred times over. So Balum gave my ten cents to the poor and waited to see what would happen.
        - id: ch01-b92
          speaker: huck
          text: What did happen?
        - id: ch01-b93
          speaker: jim
          text: Nothing ever came of it. I tried, but I couldn't collect that money any way at all. Balum couldn't collect it either. I learned my lesson. I won't lend out another cent unless I can see the security first. The preacher said a man was bound to get his money back a hundred times over. Why, if I could get my original ten cents back, I would call the whole thing square and be glad for the chance.
        - id: ch01-b94
          speaker: huck
          text: It doesn't matter much, Jim, if you're going to be rich again one day.
        - id: ch01-b95
          speaker: jim
          text: Come to think of it, I'm rich now. I own myself, and I'm worth eight hundred dollars. I wish I had that money. I wouldn't need any more.
