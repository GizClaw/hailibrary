        pace: 自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十七章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 过了大约一分钟，屋里终于有人隔着窗户喊话，可他连脑袋都没露出来。
        - id: ch01-b02
          speaker: saul
          text: 好了，孩子们！外面是谁？
        - id: ch01-b03
          speaker: huck
          text: 是我。
        - id: ch01-b04
          speaker: saul
          text: 你是谁？
        - id: ch01-b05
          speaker: huck
          text: 乔治·杰克逊，先生。
        - id: ch01-b06
          speaker: saul
          text: 你跑到这里来干什么？
        - id: ch01-b07
          speaker: huck
          text: 我没想干什么，先生，只是要从这儿过去，可那些狗拦着不让我走。
        - id: ch01-b08
          speaker: saul
          text: 半夜三更的，你在这儿偷偷摸摸做什么？
        - id: ch01-b09
          speaker: huck
          text: 我没有偷偷摸摸，先生。我从蒸汽船上掉进河里了。
        - id: ch01-b10
          speaker: saul
          text: 是吗？来个人点灯。你刚才说自己叫什么？
        - id: ch01-b11
          speaker: huck
          text: 乔治·杰克逊，先生。我只是个孩子。
        - id: ch01-b12
          speaker: saul
          text: 要是你说的都是真话，就别害怕，我们不会伤你。不过你站在原地，一步也别动。去叫醒鲍勃和汤姆，把枪拿来。乔治·杰克逊，你旁边还有别人吗？
        - id: ch01-b13
          speaker: huck
          text: 没有，先生，一个人也没有。
        - id: ch01-b14
          speaker: huck
          text: 我听见屋里有人走动，也瞧见了一点灯光。那个男人又大声发号施令。
        - id: ch01-b15
          speaker: saul
          text: 贝茜，快把灯拿开！你怎么一点脑子也没有？把它放到前门后面的地板上。鲍勃，汤姆，准备好了就各自站稳。
        - id: ch01-b16
          speakers: [bob, tom]
          ensemble: duo
          text: 准备好了。
        - id: ch01-b17
          speaker: saul
          text: 乔治·杰克逊，你认不认识谢泼德森家的人？
        - id: ch01-b18
          speaker: huck
          text: 不认识，先生。我从来没听过他们。
        - id: ch01-b19
          speaker: saul
          text: 这话可能是真的，也可能不是。大家当心。乔治·杰克逊，现在慢慢往前走，千万别着急。要是有人跟着你，让他留在后头。他只要一露面，我们就开枪。你自己把门推开，只开一道刚够你挤进来的缝。听清楚了吗？
        - id: ch01-b20
          speaker: huck
          text: 我想快也快不了，只能一步一步往前挪。四下一点声音都没有，我却觉得自己的心跳听得清清楚楚。那些狗也安静下来，就在我身后不远的地方跟着。到了三层圆木台阶前，我听见里面开了锁，又抽开门闩，拔下插销。我把门一点点推开，里面的人叫我停下，把头伸进去。我照着做了，心想，他们准会一枪打掉我的脑袋。
        - id: ch01-b21
          speaker: huck
          text: 蜡烛搁在地板上。屋里的人全盯着我，我也盯着他们，差不多看了一刻钟。三个高大的男人拿枪指着我，吓得我直往后缩。最年长的头发灰白，大概六十岁，另外两个三十多岁，三个人都长得体面又英俊。旁边还有一位满头白发、十分和善的老太太，她身后站着两个年轻女人，我看不大清她们。
        - id: ch01-b22
          speaker: saul
          text: 行了，我看没有危险。进来吧。
        - id: ch01-b23
          speaker: huck
          text: 我一进门，老先生马上重新上锁，插好门闩和插销，又让两个年轻人拿枪跟进来。大家走进铺着崭新碎布地毯的大客厅，聚在前窗打不到的角落。侧墙没有窗户。他们举起蜡烛，从头到脚仔细瞧我。
        - id: ch01-b24
          speakers: [household_voice_1, household_voice_2, household_voice_3, household_voice_4]
          ensemble: chorus
          text: 他不是谢泼德森家的人。没错，他身上一点也不像谢泼德森家的人。
        - id: ch01-b25
          speaker: huck
          text: 老先生请我别介意，他只想隔着衣服摸一摸，看我有没有带武器，并没有恶意。他没翻我的口袋，搜完便说没事了，还叫我别拘束，把自己的事都讲出来。老太太却先想到了别的。
        - id: ch01-b26
          speaker: rachel
          text: 哎呀，索尔，你看看这个可怜的孩子。他浑身湿透了，说不定还饿着肚子呢。
        - id: ch01-b27
          speaker: saul
          text: 你说得对，雷切尔。我把这事忘了。
        - id: ch01-b28
          speaker: rachel
          text: 贝茜，快给他弄点吃的来，越快越好。你们两个姑娘去一个，把巴克叫醒，告诉他……哦，他自己来了。巴克，带这位小客人去换掉湿衣服，拿你的干衣服给他穿。
        - id: ch01-b29
          speaker: huck
          text: 巴克跟我差不多大，看着有十三四岁，只比我高一点。他只穿一件衬衫，头发乱蓬蓬的，一边进门一边打哈欠。一只手揉着眼睛，另一只手还拖着一杆枪。
        - id: ch01-b30
          speaker: buck
          text: 附近真的没有谢泼德森家的人吗？
        - id: ch01-b31
          speakers: [household_voice_1, household_voice_2, household_voice_3, household_voice_4]
          ensemble: chorus
          text: 没有，只是虚惊一场。
        - id: ch01-b32
          speaker: buck
          text: 哼，要是真有人来了，我准能打倒一个。
        - id: ch01-b33
          speaker: huck
          text: 大家听了都笑起来。鲍勃拿他开起玩笑。
        - id: ch01-b34
          speaker: bob
          text: 得了吧，巴克。你来得这么晚，等你到的时候，他们早把咱们全家的头皮剥光了。
        - id: ch01-b35
          speaker: buck
          text: 根本没人来叫我。你们每次都把我压着，不肯给我一点机会，这不公平。
        - id: ch01-b36
          speaker: saul
          text: 别急，我的孩子。以后有的是机会，该来的时候自然会来。现在快照你妈妈说的做。
        - id: ch01-b37
          speaker: huck
          text: 我们上楼进了巴克的房间。他拿出一件粗布衬衫、一件短上衣和一条自己的裤子，让我换上。他先问我叫什么，可我还没回答，他就说起前天在树林里捉到的一只冠蓝鸦和一只小野兔。说着说着，他突然又问，蜡烛熄灭时，摩西在哪里。我说我不知道，也从没听说过这件事。
        - id: ch01-b38
          speaker: buck
          text: 那你猜一猜。
        - id: ch01-b39
          speaker: huck
          text: 我连这件事都没听过，怎么猜？
        - id: ch01-b40
          speaker: buck
          text: 你总能猜吧？这太容易了。
        - id: ch01-b41
          speaker: huck
          text: 你说的是哪根蜡烛？
        - id: ch01-b42
          speaker: buck
          text: 随便哪一根都行。
        - id: ch01-b43
          speaker: huck
          text: 我不知道摩西在哪儿。你快说，他到底在哪儿？
        - id: ch01-b44
          speaker: buck
          text: 当然是在黑暗里！蜡烛灭了，他不就在黑暗里吗？
        - id: ch01-b45
          speaker: huck
          text: 你自己明明知道，为什么还要问我？
        - id: ch01-b46
          speaker: buck
          text: 哎呀，这是个谜语，你还没听明白吗？对了，你要在这儿住多久？你干脆永远别走。现在学校放假，咱们可以痛痛快快地玩。你养不养狗？我有一条。只要把木片扔进河里，它就会跳下水捡回来。你喜欢星期天梳头打扮，还要守那些蠢规矩吗？我反正讨厌，可妈妈偏要逼我。这条该死的旧裤子！还是穿上吧，可天这么热，我一点也不想穿。你好了吗？那咱们走吧，老伙计。
        - id: ch01-b47
          speaker: huck
          text: 他们拿凉玉米饼、凉腌牛肉、黄油和酪乳给我吃。直到今天，我也没吃过比那更香的东西。贝茜和两个年轻女人已经走开，其余的人都抽着玉米芯烟斗，连巴克和他妈妈也抽。大家边抽边问，我就边吃边答。那两个年轻女人裹着被子，头发披在背后。
        - id: ch01-b48
          speaker: huck
          text: 我给他们编了一套身世。我说，我们一家原先住在阿肯色州南边的小农场。姐姐玛丽·安跟人私奔结婚，从此没了消息。比尔出去找她，也一去不回。汤姆和莫特都死了，后来只剩下爸爸和我。那些祸事把爸爸折腾得只剩一把骨头，他最后也死了。农场并不属于我们，我只好带上剩下的东西，搭蒸汽船的甲板舱往上游走，半路掉进河里，这才到了这里。
        - id: ch01-b49
          speaker: huck
          text: 他们说，只要我乐意，住多久都行。等我的故事讲完，天差不多亮了，大家便各自睡觉。我和巴克睡一张床。早晨醒来，我才想起自己竟然忘了假名字。我躺着琢磨了快一个钟头。巴克一醒，我便想出一个办法套他的话。
        - id: ch01-b50
          speaker: huck
          text: 巴克，你会不会拼字？
        - id: ch01-b51
          speaker: buck
          text: 当然会。
        - id: ch01-b52
          speaker: huck
          text: 我敢打赌，你肯定拼不出我的名字。
        - id: ch01-b53
          speaker: buck
          text: 你敢赌多少，我就敢说自己拼得出来。
        - id: ch01-b54
          speaker: huck
          text: 那好，你拼给我听。
        - id: ch01-b55
          speaker: buck
          text: G-e-o-r-g-e，J-a-x-o-n。怎么样？
        - id: ch01-b56
          speaker: huck
          text: 嗯，你还真拼出来了。我没想到你能行，这个名字可不好拼，你竟然想都不想就说出来了。
        - id: ch01-b57
          speaker: huck
          text: 我悄悄把拼法记在心里。下次也许会有人叫我亲自拼，我得先准备好，到时候才能像早就拼惯了那样，一口气说出来。
        - id: ch01-b58
          speaker: huck
          text: 这一家人好极了，房子也一样好。我在乡下从没见过这么漂亮、这么讲究的地方。前门没有铁门扣，也没有拴着鹿皮绳的木门闩，而是装着城里房子才有的黄铜转把。客厅里没有床，甚至看不出放过床的痕迹，可城里好多客厅还摆着床呢。
        - id: ch01-b59
          speaker: huck
          text: 屋里有座大壁炉，炉底铺着砖。为了让砖一直又红又干净，他们先泼水，再拿另一块砖去擦，有时还刷一层叫西班牙棕的红漆，跟城里的做法一样。炉膛里摆着一对粗大的黄铜柴架，连锯下来的整段木头也放得下。
        - id: ch01-b60
          speaker: huck
          text: 壁炉台正中放着一座钟。钟面下半边的玻璃上画着一座城，中央留了个圆洞当太阳，从洞里可以看见钟摆来回晃。听它滴答作响，真是好听。有时候，小贩上门把它擦亮修好，它就能一口气敲上一百五十下，直到自己累得再也敲不动。这家人无论如何也不肯卖掉它。
        - id: ch01-b61
          speaker: huck
          text: 钟的两边各站着一只怪模怪样的大鹦鹉，像是用白垩做的，身上涂得花花绿绿。一只旁边有陶猫，另一只旁边有陶狗。用手往下一按，猫和狗就会吱吱叫，可嘴巴一动不动，神情也毫不在意，因为声音其实从底下传出来。它们后面张着两把用野火鸡翅膀做成的大扇子。
        - id: ch01-b62
          speaker: huck
          text: 屋子中央的桌上有一只漂亮的陶篮，装满苹果、橙子、桃子和葡萄。那些水果比真的更红、更黄，也更好看，可它们当然是假的。有些地方磕掉了一块，露出了里面白色的白垩，或者别的什么东西。
        - id: ch01-b63
          speaker: huck
          text: 桌上铺着好看的油布，上面是一只红蓝两色、正要展翅飞起的鹰，周围还有一圈花边。听说那块桌布是从费城一路运来的。桌子四角整齐地摞着书。有一本厚厚的家庭《圣经》，里面全是插图。还有一本《天路历程》，写一个男人离开家人，却不告诉你他为什么走。我常常一口气读上不少，故事挺有意思，就是读起来费劲。
        - id: ch01-b64
          speaker: huck
          text: 另一本《友谊的献礼》全是美文和诗歌，不过我从来不读诗。桌上还有《亨利·克莱演说集》和冈恩医生的《家庭医学》。人生病或者死了该怎么办，那本书里什么都讲。另外还有赞美诗集和许多别的书。木条座面的椅子也很漂亮，每把都完好无缺，不像旧篮子那样在中间塌下去，破出一个洞。
        - id: ch01-b65
          speaker: huck
          text: 墙上的画大多是华盛顿、拉斐特、战争场面和苏格兰高地玛丽，还有一幅叫《签署独立宣言》。另外几幅叫炭笔画，是这家一个已经去世的女儿十五岁时画的。它们和我见过的画都不一样，最显眼的地方，就是黑得出奇。
        - id: ch01-b66
          speaker: huck
          text: 一幅画里，有个女人穿着细长的黑裙子，腰带一直束到腋下，袖子中间鼓得像卷心菜。她戴着黑色的大簸箕帽和黑面纱，细细的白脚踝缠着交叉的黑带，脚上的黑鞋小得像凿子。她站在垂柳下，一只胳膊肘忧伤地靠着墓碑，另一只手垂下来，拿着白手帕和小手袋。画下面写着，唉，难道我再也见不到你？
        - id: ch01-b67
          speaker: huck
          text: 另一幅画里，一个年轻女人把头发笔直地梳到头顶，又在一把像椅背的发梳前盘成发髻。她对着手帕哭，另一只手托着一只仰面躺倒、两脚朝天的死鸟。画下面写着，唉，我再也听不到你甜美的啁啾。
        - id: ch01-b68
          speaker: huck
          text: 还有一幅画着年轻女人站在窗边，抬头望着月亮，眼泪顺着脸颊往下淌。她一只手拿着拆开的信，信封角上露着黑色封蜡，另一只手把带链子的坠盒按在嘴上。下面写着，你走了吗？是的，你已经走了，唉。
        - id: ch01-b69
          speaker: huck
          text: 我觉得这些画画得都很好，可不知道为什么，就是喜欢不起来。本来心情一低落，再看它们，我就会害怕得浑身发毛。大家都为那个姑娘的死伤心。她原本还打算画好多这样的画，光看已经完成的这些，谁都明白家里损失了多大的本事。不过照她那种性情，我倒觉得她住在墓地里也许会更快活。
        - id: ch01-b70
          speaker: huck
          text: 她病倒时，正在画一幅自认最了不起的作品。她日夜祷告，只求能活到画完，可还是没能如愿。画上有个年轻女人穿着白袍，站在桥栏杆上，眼看就要跳下去。她披着长发，仰望月亮，满脸泪水。她有两条胳膊抱在胸前，两条伸向前方，还有两条举起来够月亮。原来她想先看看哪一对最好看，再把其余的擦掉。可她还没选好便去世了。
        - id: ch01-b71
          speaker: huck
          text: 家里把这幅画挂在她房间的床头。每逢她生日，他们就在画上挂满鲜花，平时则用小帘子遮住。画里的姑娘有一张温柔甜美的脸，可胳膊实在太多，在我看来，她活像一只蜘蛛。
        - id: ch01-b72
          speaker: huck
          text: 那位姑娘生前还做了一本剪贴簿。她常从《长老会观察家》上剪下讣告、事故和耐心受苦的故事，贴在簿子里，再凭想象给它们配诗。那些诗写得好极了。其中一首写一个叫斯蒂芬·道林·博茨的男孩，他掉进井里淹死了，诗名叫《悼亡者斯蒂芬·道林·博茨》。
        - id: ch01-b73
          speaker: narrator
          text: 难道小斯蒂芬病倒，难道小斯蒂芬死去？难道悲伤压满心头，送葬的人哭声不止？不，他的命运不是如此，小斯蒂芬·道林·博茨。虽有悲哀压在心头，却不是病痛惹的祸。百日咳不曾折磨他，麻疹也没让他满身斑点。毁掉斯蒂芬·道林·博茨圣名的，并不是这些灾难。被人轻视的爱情，没有悲痛地击中那颗长满卷发的脑袋。肚子的毛病也没把他放倒，小斯蒂芬·道林·博茨没有败。哦，不。请你含泪侧耳细听，让我把他的命运诉说。他的灵魂离开这个冰冷世界，是因为掉进了一口井。人们捞起他，又把水倒空。唉，可惜已经太迟。他的灵魂早已飞上高天，在善人与伟人的国度里嬉戏。
        - id: ch01-b74
          speaker: huck
          text: 埃米琳·格兰杰福德还不到十四岁，就能写出这样的诗，真不知道长大后会有多大本事。巴克说，她写诗从不费劲，也不用停下来想。她啪地写下一行，要是找不到押韵的词，就干脆划掉，再啪地另写一行，接着往下写。
        - id: ch01-b75
          speaker: huck
          text: 她一点也不挑题目，随便给她什么都能写，只要事情够悲伤。无论死的是男人、女人还是孩子，尸体还没凉，她的悼辞准已经送到了。邻居都说，一个人死后，先到的是医生，接着是埃米琳，最后才轮到殡葬人。
        - id: ch01-b76
          speaker: huck
          text: 她一生只有一次落在殡葬人后面。那位死者姓惠斯勒，她怎么也找不到能跟这个姓押韵的词。打那以后，她再也没有恢复原样。她一句怨言也没有，只是一天比一天憔悴，没过多久便死了。
        - id: ch01-b77
          speaker: huck
          text: 可怜的埃米琳。有时候她的画弄得我心烦，我会有点生她的气。这时我就强迫自己上楼，走进她从前那间小屋，拿出那本可怜的旧剪贴簿读一读。我喜欢这家人，连死去的人也喜欢，绝不允许什么事情把我们分开。
        - id: ch01-b78
          speaker: huck
          text: 埃米琳活着时，替每一个死去的人写诗。现在她自己死了，却没人替她写几句，实在说不过去。我也拼命想挤出一两节诗，可怎么都写不成。他们把她的房间收拾得整整齐齐，东西全照她生前喜欢的样子摆着，再也没有人睡在那里。家里明明有许多黑奴，老太太却亲自照管这间屋。她常在里面做针线，也多半在那里读《圣经》。
        - id: ch01-b79
          speaker: huck
          text: 再说回客厅。窗上挂着漂亮的白窗帘，画着城堡、爬满墙壁的藤蔓，还有走下来喝水的牛群。屋里有架老式小钢琴，我猜里面装着不少铁皮锅。两个年轻女人会在琴边唱《最后的纽带已断》，再弹一曲《布拉格之战》。世上简直没有比那更美妙的声音。
        - id: ch01-b80
          speaker: huck
          text: 每个房间的墙都抹了灰泥，大多铺着地毯，房子外面刷得雪白。这是一座双体屋，两幢屋子中间空着一大片，上面有屋顶，脚下铺着地板。有时他们中午把饭桌摆在那里。那地方又阴凉又舒服，再好不过。至于他们做的饭，那才叫好吃，而且每次都多得像一蒲式耳一蒲式耳往桌上端。
