  chapters:
    - id: ch01
      title: CHAPTER XVII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: After about a minute, a man called through a window without showing his head.
        - id: ch01-b02
          speaker: saul
          text: Quiet, boys! Who's out there?
        - id: ch01-b03
          speaker: huck
          text: It's me, sir.
        - id: ch01-b04
          speaker: saul
          text: Who do you mean by me?
        - id: ch01-b05
          speaker: huck
          text: George Jackson, sir.
        - id: ch01-b06
          speaker: saul
          text: What do you want here?
        - id: ch01-b07
          speaker: huck
          text: Nothing, sir. I'm only trying to pass by, but your dogs won't let me.
        - id: ch01-b08
          speaker: saul
          text: Then why are you sneaking around at this hour?
        - id: ch01-b09
          speaker: huck
          text: I wasn't sneaking, sir. I fell off a steamboat.
        - id: ch01-b10
          speaker: saul
          text: Did you now? Somebody light a candle. What name did you give me?
        - id: ch01-b11
          speaker: huck
          text: George Jackson, sir. I'm just a boy.
        - id: ch01-b12
          speaker: saul
          text: If that's the truth, you have nothing to fear. Nobody here will hurt you. But stay exactly where you are. Wake Bob and Tom and bring the guns. George Jackson, is anyone with you?
        - id: ch01-b13
          speaker: huck
          text: No, sir. I'm alone.
        - id: ch01-b14
          speaker: huck
          text: People began moving inside, and then I saw a light.
        - id: ch01-b15
          speaker: saul
          text: Betsy, get that light out of sight! Put it on the floor behind the front door. Bob and Tom, take your places when you're ready.
        - id: ch01-b16
          speakers: [bob, tom]
          ensemble: duo
          text: We're ready.
        - id: ch01-b17
          speaker: saul
          text: George Jackson, do you know the Shepherdsons?
        - id: ch01-b18
          speaker: huck
          text: No, sir. I've never heard of them.
        - id: ch01-b19
          speaker: saul
          text: Maybe that's true, and maybe it isn't. Now step forward, very slowly. If somebody is hiding with you, he'd better stay back. We'll shoot if he shows himself. Open the door yourself, but only wide enough to squeeze through. Do you understand?
        - id: ch01-b20
          speaker: huck
          text: I couldn't have hurried if I'd wanted to. I moved one slow step at a time. Everything was so quiet I thought I could hear my own heart. Even the dogs made no sound as they followed just behind me. At the three log steps, I heard locks, bars, and bolts coming loose. I eased the door open a little at a time.
        - id: ch01-b21
          speaker: saul
          text: That's far enough. Put your head inside.
        - id: ch01-b22
          speaker: huck
          text: I stuck my head in, though I figured they might take it off. A candle stood on the floor. For a good fifteen seconds, we all stared at one another. Three big men had guns aimed at me, and that made me flinch, I can tell you. The oldest was gray and about sixty. The other two were over thirty. All three were handsome, fine-looking men. There was a sweet gray-haired old lady, too, with two young women behind her whom I couldn't see very well.
        - id: ch01-b23
          speaker: saul
          text: I reckon you're all right. Come inside.
        - id: ch01-b24
          speaker: huck
          text: Once I was in, the old gentleman locked, barred, and bolted the door. He called the younger men in with their guns. We all went to a large parlor with a new rag carpet and gathered in a corner beyond the reach of the front windows. There were no windows on the sides. They raised the candle and looked me over closely.
        - id: ch01-b25
          speakers: [saul, bob, tom, rachel]
          ensemble: chorus
          text: Why, he isn't a Shepherdson. There's nothing Shepherdson about him.
        - id: ch01-b26
          speaker: huck
          text: The old man hoped I wouldn't mind if he checked me for weapons. He meant no harm. He only wanted to be certain. He didn't dig through my pockets, but felt the outside of my clothes and said everything was fine. Then he told me to make myself at home and explain who I was.
        - id: ch01-b27
          speaker: rachel
          text: Saul, the poor boy is soaked through. Don't you think he might be hungry?
        - id: ch01-b28
          speaker: saul
          text: You're right, Rachel. I forgot.
        - id: ch01-b29
          speaker: rachel
          text: Betsy, hurry and bring this poor boy something to eat. One of you girls, wake Buck and tell him... Oh, here he is. Buck, take our young guest upstairs. Get those wet clothes off him and give him something dry of yours.
        - id: ch01-b30
          speaker: huck
          text: Betsy was the Black woman who worked in the house. Buck looked about my age, thirteen or fourteen, though he was a little bigger. He wore nothing but a shirt. His hair was a mess, and he came in yawning and rubbing one eye with his fist while a gun dragged from his other hand.
        - id: ch01-b31
          speaker: buck
          text: Weren't there any Shepherdsons out there?
        - id: ch01-b32
          speakers: [saul, bob, tom]
          ensemble: chorus
          text: No. It was a false alarm.
        - id: ch01-b33
          speaker: buck
          text: Well, if there had been any, I reckon I'd have got one.
        - id: ch01-b34
          speaker: huck
          text: Everybody laughed.
        - id: ch01-b35
          speaker: bob
          text: Buck, you took so long that they could've scalped every one of us.
        - id: ch01-b36
          speaker: buck
          text: Nobody came to get me! It isn't fair. You always hold me back, and I never get a chance.
        - id: ch01-b37
          speaker: saul
          text: Don't fret, Buck. Your chance will come soon enough. Now go do what your mother told you.
        - id: ch01-b38
          speaker: huck
          text: Upstairs, Buck gave me a rough shirt, a short jacket, and a pair of his pants. While I changed, he asked my name. Before I could answer, he started telling me about a blue jay and a young rabbit he'd caught in the woods two days earlier. Then he asked where Moses was when the candle went out. I said I'd never heard that story, so I didn't know.
        - id: ch01-b39
          speaker: buck
          text: Go ahead and guess.
        - id: ch01-b40
          speaker: huck
          text: How can I guess when I've never heard of it?
        - id: ch01-b41
          speaker: buck
          text: You can still guess. It's easy.
        - id: ch01-b42
          speaker: huck
          text: Which candle do you mean?
        - id: ch01-b43
          speaker: buck
          text: Any candle at all.
        - id: ch01-b44
          speaker: huck
          text: I give up. Where was he?
        - id: ch01-b45
          speaker: buck
          text: He was in the dark! That's where!
        - id: ch01-b46
          speaker: huck
          text: If you already knew, why did you ask me?
        - id: ch01-b47
          speaker: buck
          text: Because it's a riddle! Don't you see? Say, how long will you stay? You ought to stay forever. We'd have a grand time, and there's no school now. Do you have a dog? I do. If I throw wood chips in the river, he'll swim out and fetch them. Do you like getting combed and dressed up on Sundays and all that foolishness? I sure don't, but Ma makes me. Bother these old pants! I suppose I ought to put them on, though it's so warm I'd rather not. Are you ready? Good. Come on, old fellow.
        - id: ch01-b48
          speaker: huck
          text: Downstairs they gave me cold corn bread, cold corned beef, butter, and buttermilk. I still don't believe I've ever found anything better. Buck, his mother, and the rest smoked corncob pipes, except Betsy, who had gone away, and the two young women. They smoked and talked while I ate and talked. The young women had quilts around their shoulders and their hair hanging down their backs.
        - id: ch01-b49
          speaker: huck
          text: They all asked questions, so I made up a story. I said Pap and our whole family had lived on a little farm at the bottom of Arkansas. My sister Mary Ann ran off to marry and was never heard from again. Bill went looking for her and vanished too. Tom and Mort died. That left only Pap and me, and his troubles wore him down to almost nothing. After he died, I took what little was left, since the farm wasn't ours, and headed upriver as a deck passenger. Then I fell overboard. That was how I'd come to their house.
        - id: ch01-b50
          speaker: huck
          text: They told me I could live there for as long as I liked. It was nearly daylight when everyone finally went to bed. I shared Buck's bed. When I woke in the morning, I'd forgotten the name I'd given them. I lay still for about an hour, trying to remember. Then Buck woke up.
        - id: ch01-b51
          speaker: huck
          text: Can you spell, Buck?
        - id: ch01-b52
          speaker: buck
          text: Yes, I can.
        - id: ch01-b53
          speaker: huck
          text: I bet you can't spell my name.
        - id: ch01-b54
          speaker: buck
          text: Bet anything you like. I can do it.
        - id: ch01-b55
          speaker: huck
          text: All right, then. Let's hear it.
        - id: ch01-b56
          speaker: buck
          text: G-e-o-r-g-e, J-a-x-o-n. There!
        - id: ch01-b57
          speaker: huck
          text: You got it. I didn't think you could spell a name like that without stopping to study.
        - id: ch01-b58
          speaker: huck
          text: I wrote it down in private. Somebody might ask me to spell it next, and I wanted to rattle it off as if I'd used it all my life.
        - id: ch01-b59
          speaker: huck
          text: They were a mighty nice family, and their house was mighty nice too. I'd never seen a country house with so much style. Instead of an iron latch or a wooden latch opened by a buckskin string, the front door had a brass knob you turned, just like a town house. There wasn't a bed in the parlor, or even a sign that there had ever been one there, though plenty of town parlors had beds in them.
        - id: ch01-b60
          speaker: huck
          text: The big fireplace had brick along the bottom. They kept it clean and red by wetting the bricks and scrubbing them with another brick. Sometimes they painted it with the same red wash people used in town, called Spanish brown. Large brass andirons stood there, strong enough to hold a saw log.
        - id: ch01-b61
          speaker: huck
          text: In the middle of the mantel stood a clock. A town was painted on the lower half of its glass door, with a round opening for the sun in the center, and the pendulum swung behind it where you could see it. That ticking was beautiful to hear. Sometimes a traveling repairman came along, polished the clock, and got it running well. Then it would start striking and might reach a hundred and fifty before it wore itself out. The family wouldn't have taken any amount of money for it.
        - id: ch01-b62
          speaker: huck
          text: On each side of the clock was a huge, strange parrot made of something like chalk and painted in gaudy colors. A crockery cat stood by one parrot and a crockery dog by the other. Press them down and they squeaked from underneath, though their mouths stayed shut and their faces showed no interest. Two fans made from wild turkey wings spread behind them.
        - id: ch01-b63
          speaker: huck
          text: The table in the center held a lovely crockery basket piled with apples, oranges, peaches, and grapes. They were brighter and prettier than real fruit, but chipped places showed the white chalk beneath. A beautiful oilcloth covered the table. It had a red and blue eagle across it and a painted border all the way around. They said it came from Philadelphia.
        - id: ch01-b64
          speaker: huck
          text: Books were stacked in perfectly even piles at each corner. There was a large family Bible full of pictures. Pilgrim's Progress was about a man who left his family, though it never said why. I read quite a bit of that now and then. The things it said were interesting, but hard to understand. Friendship's Offering was full of beautiful writing and poetry, though I didn't read the poetry. There were Henry Clay's speeches and Doctor Gunn's Family Medicine, which explained what to do if somebody was sick or dead. There was a hymnbook and a lot of other books too. The split-bottom chairs were nice and perfectly sound, not sagging in the middle and broken like old baskets.
        - id: ch01-b65
          speaker: huck
          text: Pictures covered the walls. Most showed Washington, Lafayette, battles, or Highland Mary. One was called Signing the Declaration. Then there were dark drawings they called crayons. A daughter who had died at fifteen had made them herself, and they looked unlike any pictures I'd seen.
        - id: ch01-b66
          speaker: huck
          text: One showed a woman in a narrow black dress, with the belt drawn tight just under her arms. The middle of each sleeve bulged like a cabbage. She wore a huge black bonnet shaped like a scoop shovel, with a black veil over it. Black ribbons crossed around her thin white ankles, and her tiny black shoes were pointed like chisels. Beneath a weeping willow, she rested her right elbow thoughtfully on a tombstone. Her other hand hung at her side, holding a white handkerchief and a little bag. The words under it asked, "Shall I never see thee more, alas?"
        - id: ch01-b67
          speaker: huck
          text: Another young woman had her hair combed straight to the top of her head and knotted in front of a comb shaped like a chair back. She cried into a handkerchief. In her other hand she held a dead bird lying on its back, with its feet sticking up. The words beneath her mourned, "I shall never hear thy sweet chirrup more, alas."
        - id: ch01-b68
          speaker: huck
          text: A third young woman stood at a window, looking up at the moon while tears ran down her cheeks. In one hand she held an open letter with black sealing wax along its edge. With the other, she pressed a locket and its chain against her mouth. The words beneath her said, "And art thou gone? Yes, thou art gone, alas."
        - id: ch01-b69
          speaker: huck
          text: I suppose they were all fine pictures, but I couldn't take to them. Whenever I already felt low, they gave me the shivers. Everybody mourned the girl because she'd planned many more, and her finished work showed how much had been lost. I figured that, with her gloomy nature, she was probably having a better time in the graveyard.
        - id: ch01-b70
          speaker: huck
          text: When she fell ill, she was working on what the family called her greatest picture. Day and night, she prayed to live long enough to finish it, but she never did. It showed a young woman in a long white gown, standing on a bridge rail and ready to jump. Her hair fell down her back, her face was wet with tears, and she looked toward the moon.
        - id: ch01-b71
          speaker: huck
          text: The woman had six arms. Two crossed over her chest, two reached straight out in front, and two stretched up toward the moon. The plan was to try every position, choose the pair that looked best, and erase the other four. But the artist died before she could make up her mind. The family kept the picture above the head of the bed in her room. They hung flowers on it every birthday and hid it behind a small curtain the rest of the time. The young woman's face looked gentle and sweet, but all those arms made her seem too much like a spider to me.
        - id: ch01-b72
          speaker: huck
          text: The girl's name was Emmeline Grangerford. She had kept a scrapbook of obituaries, accidents, and stories of patient suffering cut from the Presbyterian Observer. Then she wrote poems about them herself. Her poetry was very good. Here is what she wrote about Stephen Dowling Bots, a boy who fell into a well and drowned.
        - id: ch01-b73
          speaker: emmeline
          text: "Ode to Stephen Dowling Bots, Deceased. And did young Stephen sicken, and did young Stephen die? And did the sad hearts thicken, and did the mourners cry? No. Such was not the fate of young Stephen Dowling Bots. Though sad hearts round him thickened, it was not from sickness' shots. No whooping cough did rack his frame, nor measles drear with spots. Not these impaired the sacred name of Stephen Dowling Bots. Despised love struck not with woe that head of curly knots, nor stomach troubles laid him low, young Stephen Dowling Bots. Oh, no. Then listen with tearful eye while I his fate do tell. His soul did from this cold world fly by falling down a well. They got him out and emptied him. Alas, it was too late. His spirit had gone to sport aloft in the realms of the good and great."
        - id: ch01-b74
          speaker: huck
          text: Emmeline wrote that before she was fourteen, so there was no telling what she might have done later. Buck said poetry poured right out of her. She never had to pause and think. She'd write a line, and if no rhyme came, she'd cross it out, put down another, and keep going. She could write about anything anyone named, as long as it was sorrowful.
        - id: ch01-b75
          speaker: huck
          text: Whenever a man, woman, or child died, Emmeline had a tribute ready before the body was cold. Tribute was her word for those poems. The neighbors said the doctor came first, then Emmeline, and then the undertaker. Only once did the undertaker beat her. She couldn't find a rhyme for the dead person's name, which was Whistler.
        - id: ch01-b76
          speaker: huck
          text: She was never the same afterward. She didn't complain, but she slowly faded and died young. Many times, when her pictures had troubled me and made me feel a little bitter toward her, I made myself go up to her old room and read her scrapbook. I liked that whole family, including the ones who were dead, and I wasn't going to let anything come between us.
        - id: ch01-b77
          speaker: huck
          text: While Emmeline lived, she wrote poems for everyone who died. It didn't seem right that no one had written one for her. I tried hard to make a verse or two myself, but I couldn't get it to work.
        - id: ch01-b78
          speaker: huck
          text: The family kept Emmeline's room neat, with everything arranged the way she'd liked it. Nobody slept there. Though the house had plenty of servants, the old lady cared for that room herself. She often sewed there, and that was where she usually read her Bible.
        - id: ch01-b79
          speaker: huck
          text: Back in the parlor, beautiful white curtains hung at the windows. They were painted with castles, vines trailing all down the walls, and cattle walking to the water to drink. There was a little old piano that sounded as if it had tin pans inside. Still, nothing was lovelier than hearing the young women sing The Last Link Is Broken and play The Battle of Prague on it. The walls in every room were plastered. Most floors had carpets, and the whole house was whitewashed on the outside.
        - id: ch01-b80
          speaker: huck
          text: It was a double house, with a broad open passage between the two halves. That space had a roof and a floor, and sometimes they set the table there at midday. It was cool and comfortable. Nothing could have been better. And the cooking was so good, with bushels of food besides.
