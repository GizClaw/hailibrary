  chapters:
    - id: ch01
      title: CHAPTER XII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: It was close to one in the morning when we finally got below the island, and that raft seemed awful slow. If a boat came near, we meant to jump into the canoe and make for the Illinois shore. It was lucky none came. In our hurry, we'd left the gun, the fishing line, and every bite of food on the raft. We hadn't had time to think of all those things. Putting everything in one place hadn't been too smart.
        - id: ch01-b02
          speaker: huck
          text: If those men went to the island, I expect they found the campfire I'd built and watched it all night, waiting for Jim. Anyway, they stayed away from us. If that fire didn't fool them, it wasn't because I hadn't tried my best.
        - id: ch01-b03
          speaker: huck
          text: At the first streak of daylight, we tied up at a towhead in a wide bend on the Illinois side. A towhead is a sandbar packed thick with cottonwood trees. We chopped off branches and covered the raft until it looked like part of the bank had caved in.
        - id: ch01-b04
          speaker: huck
          text: Mountains rose along the Missouri shore, while heavy woods covered the Illinois side. The channel ran close to Missouri there, far away from our hiding place, so we weren't afraid of anybody stumbling across us. We lay there all day. Rafts and steamboats went spinning down along the Missouri shore, while boats headed upriver fought the force of the big river out in the middle.
        - id: ch01-b05
          speaker: huck
          text: I told Jim everything that had happened with the woman in town.
        - id: ch01-b06
          speaker: jim
          text: She was mighty sharp. If she'd come after us herself, she wouldn't sit watching a campfire. No, sir. She'd bring a dog.
        - id: ch01-b07
          speaker: huck
          text: Then why couldn't she tell her husband to bring one?
        - id: ch01-b08
          speaker: jim
          text: I bet she did think of it before those men got started. They must've gone back into town for a dog and lost all that time. Otherwise, we wouldn't be sitting sixteen or seventeen miles below the village. We'd be right back in that same old town.
        - id: ch01-b09
          speaker: huck
          text: I didn't care why they had missed us, so long as they had.
        - id: ch01-b10
          speaker: huck
          text: Near dark, we poked our heads out of the cottonwoods and looked in every direction. Nothing was in sight. Jim pulled up some of the raft's top planks and built a snug little wigwam. It would shade us in hot weather, shelter us in rain, and keep our things dry.
        - id: ch01-b11
          speaker: huck
          text: He raised its floor more than a foot above the raft, safely beyond the waves from passing steamboats. In the middle, we set a wooden frame and filled it with five or six inches of dirt. Then we could make a hidden fire when the weather was wet or cold.
        - id: ch01-b12
          speaker: huck
          text: We made a spare steering oar in case one of the others broke on a snag. We also fixed a short forked stick where we could hang the old lantern. Whenever a steamboat came downriver, we had to light it or risk being run over. For a boat going upriver, we only needed the lantern if we were in what folks called a crossing. The river was still high, and the lowest banks were partly underwater. Boats fighting their way upstream didn't always stay in the channel. They searched wherever the water ran easiest.
        - id: ch01-b13
          speaker: huck
          text: On our second night, we traveled seven or eight hours, with the current carrying us more than four miles an hour. We caught fish and talked. Now and then we slipped into the water for a swim to keep ourselves awake. It felt solemn, drifting down that broad, quiet river. We lay on our backs and looked up at the stars. Neither of us wanted to raise his voice out there. We didn't laugh often, either, and when we did, it was only a low chuckle.
        - id: ch01-b14
          speaker: huck
          text: The weather stayed fine, and nothing happened that night, or the next, or the one after that. Each night we passed towns. Some stood high on black hillsides, showing only beds of shining lights. You couldn't see a single house.
        - id: ch01-b15
          speaker: huck
          text: On the fifth night, we passed St. Louis. It looked as if the whole world had lit up. Folks back in St. Petersburg used to say twenty or thirty thousand people lived there, but I'd never believed them. Then, at two o'clock on that still night, I saw that wonderful spread of lights for myself. There wasn't a sound from the city. All those thousands of people were asleep.
        - id: ch01-b16
          speaker: huck
          text: By then, I went ashore around ten every night at some little village. I'd buy ten or fifteen cents' worth of cornmeal, bacon, or whatever food I could get. Sometimes I took along a chicken that wasn't roosting comfortably.
        - id: ch01-b17
          speaker: huck
          text: Pap always said to take a chicken whenever you got the chance. If you didn't want it, somebody else surely would, and a good deed was never forgotten. I never saw Pap turn down a chicken himself, but that was what he said.
        - id: ch01-b18
          speaker: huck
          text: Before daylight, I'd slip into cornfields and borrow whatever I found. It might be a watermelon, a muskmelon, a pumpkin, or some fresh corn. Pap always said borrowing did no harm if you meant to pay it back someday. The widow said that was only a gentle name for stealing, and no decent person would do it.
        - id: ch01-b19
          speaker: jim
          text: I reckon the widow's partly right, and your pap's partly right. We ought to choose two or three things and promise we won't borrow those anymore. Then borrowing the rest won't do any harm.
        - id: ch01-b20
          speaker: huck
          text: We spent one whole night drifting downriver and trying to decide what to give up. We went back and forth over watermelons, cantaloupes, muskmelons, and all the other things we borrowed. It took us until nearly daylight to settle the question in a way that satisfied us both. At last, we chose crab apples and persimmons. Those were the two things we wouldn't take anymore.
        - id: ch01-b21
          speaker: huck
          text: Before that, neither of us had felt quite right about the borrowing. Now everything felt comfortable again. I liked our choice. Crab apples are never good, and persimmons wouldn't be ripe for another two or three months.
        - id: ch01-b22
          speaker: huck
          text: Once in a while we shot a water bird that got up too early in the morning or stayed out too late at night. All in all, we lived mighty well.
        - id: ch01-b23
          speaker: huck
          text: On the fifth night after we passed St. Louis, a great storm struck sometime after midnight. Thunder rolled and cracked, lightning kept tearing open the darkness, and the rain fell in one solid sheet. There was nothing for us to do but stay inside the wigwam and let the raft mind itself. Whenever the lightning blazed, we could see a long, straight stretch of river ahead and high rocky bluffs rising on both sides.
        - id: ch01-b24
          speaker: huck
          text: Hello, Jim! Look over there!
          emotion: surprised
        - id: ch01-b25
          speaker: huck
          text: A steamboat had wrecked herself on a rock, and we were drifting straight toward her. The lightning showed every part of her as clear as day. She leaned far over, with only part of the upper deck still above water. In one flash, we could make out every little support around the chimneys. We even saw a chair beside the big bell, with an old slouch hat hanging from its back.
        - id: ch01-b26
          speaker: huck
          text: It was deep in the night, with the storm all around us, and that wreck looked mournful and lonely in the middle of the river. The whole thing felt awful mysterious. Any boy would've wanted to climb aboard, slip through the darkness, and find out what might be there. I surely did.
        - id: ch01-b27
          speaker: huck
          text: Let's land on her, Jim.
        - id: ch01-b28
          speaker: jim
          text: I don't want to go fooling around any wreck. We're doing mighty well, and we ought to leave well enough alone. There could be a watchman aboard.
        - id: ch01-b29
          speaker: huck
          text: A watchman? There's nothing there to guard except the officers' cabins and the pilothouse. Who'd risk his life for those on a night like this? The whole wreck might break apart and wash away any minute.
        - id: ch01-b30
          speaker: huck
          text: Jim couldn't think of an answer, so he didn't try. I kept after him. We might borrow something worth having from the captain's stateroom, maybe fine cigars that cost five cents apiece in solid cash. Steamboat captains were always rich. They earned sixty dollars a month, and once they wanted something, they didn't care what it cost.
        - id: ch01-b31
          speaker: huck
          text: Put a candle in your pocket. I can't rest until we've searched that wreck. Would Tom Sawyer ever sail past a thing like this? Not for anything. He'd call it an adventure and climb aboard even if it was the last thing he ever did. He'd put so much style into it, you'd think he was Christopher Columbus discovering the next world. I wish Tom were here.
        - id: ch01-b32
          speaker: huck
          text: Jim grumbled for a while, but at last he gave in. He warned that we must speak as little as we possibly could, and when we had to speak, we must keep our voices low. The next flash of lightning showed the wreck just when we needed it. We guided the raft to the starboard derrick and made it fast there.
        - id: ch01-b33
          speaker: huck
          text: The deck stood high out of the water where we climbed aboard. We began creeping down its steep slant toward the officers' cabins on the port side. We moved slowly, testing every step with our feet. We held our hands out in front of us too, because the night was so black that we couldn't see any of the support wires stretched across our way.
        - id: ch01-b34
          speaker: huck
          text: Soon we reached the front of a skylight and climbed onto it. One more step brought us to the captain's open door. Far down the passage, a light was burning. At that same moment, we heard low voices.
        - id: ch01-b35
          speaker: jim
          text: I'm feeling powerful sick, Huck. Come on. Let's get away from here.
          emotion: fearful
        - id: ch01-b36
          speaker: huck
          text: I agreed and started back toward the raft. Then a voice cried out from inside.
        - id: ch01-b37
          speaker: jim_turner
          text: Please don't, boys! I swear I'll never tell!
          emotion: fearful
        - id: ch01-b38
          speaker: jake_packard
          text: That's a lie, Jim Turner. You've done this before. You always grab more than your share, and you get it by threatening to tell on us. This time you made that threat once too often. You're the meanest, most treacherous hound in this country.
          emotion: angry
        - id: ch01-b39
          speaker: huck
          text: Jim had already gone back to the raft, but my curiosity was boiling. Tom Sawyer wouldn't turn back now, I told myself, so neither would I. I was going to learn what was happening.
        - id: ch01-b40
          speaker: huck
          text: I dropped to my hands and knees and crept toward the back through the narrow, dark passage. I stopped when only one stateroom stood between me and the cross hall. From there, I could see what was happening. A man lay stretched across the floor, tied at both his hands and his feet. Two other men stood over him. One carried a dim lantern. The other kept a pistol aimed straight at the prisoner's head.
        - id: ch01-b41
          speaker: bill
          text: I'd like to shoot you! I ought to do it too, you mean skunk!
          emotion: angry
        - id: ch01-b42
          speaker: jim_turner
          text: Please don't, Bill. I won't ever tell.
          emotion: fearful
        - id: ch01-b43
          speaker: jake_packard
          text: No, you surely won't! That's the truest thing you've ever said. Hear him beg, Bill. If we hadn't gotten the better of him and tied him up, he'd have killed us both. And for what? For nothing except that we stood up for our rightful share. You won't be threatening anybody else after this, Jim Turner. Put away that pistol, Bill.
        - id: ch01-b44
          speaker: bill
          text: I don't want to put it away, Jake Packard. I say we kill him. He killed old Hatfield exactly this way, and he deserves the same.
          emotion: angry
        - id: ch01-b45
          speaker: jake_packard
          text: I don't want him shot, and I've got my reasons.
        - id: ch01-b46
          speaker: jim_turner
          text: Bless you for saying that, Jake Packard! I'll remember it as long as I live!
        - id: ch01-b47
          speaker: huck
          text: Turner was nearly sobbing, but Packard paid no attention. He hung the lantern on a nail, turned toward the dark passage where I was hiding, and motioned for Bill to follow. I scrambled backward as fast as I could, but the deck slanted so badly that I barely moved. Before they could catch me or run right over me, I slipped into a stateroom on the upper side.
        - id: ch01-b48
          speaker: jake_packard
          text: In here. Come on.
        - id: ch01-b49
          speaker: huck
          text: Packard entered, with Bill close behind him. Before either one stepped inside, I'd managed to climb into the upper berth. Now I was cornered, with no way past them, and mighty sorry I'd ever boarded the wreck. They came right up to my hiding place, put their hands on the edge of the berth, and began to talk in the darkness.
        - id: ch01-b50
          speaker: huck
          text: They stood with their hands resting on the edge of the berth, so close beneath me that I could have touched them. I couldn't see either man, but the whiskey they'd been drinking told me exactly where they were. I was glad I didn't drink it. That hardly mattered, though, because they couldn't have found me by listening for my breath. I was too frightened to breathe at all. Besides, nobody could breathe while hearing talk like theirs.
        - id: ch01-b51
          speaker: huck
          text: They spoke in low, serious voices. Bill still wanted Turner dead.
        - id: ch01-b52
          speaker: bill
          text: He said he'll turn us in, and that's what he'll do. Even if we gave him both our shares now, it wouldn't change anything after this fight and what we've done to him. He'll testify for the State, sure as you're born. I'm telling you, we ought to put him out of his troubles.
        - id: ch01-b53
          speaker: jake_packard
          text: So am I.
        - id: ch01-b54
          speaker: bill
          text: Well, blast it, I was starting to think you weren't. Good. Let's go finish it.
        - id: ch01-b55
          speaker: jake_packard
          text: Wait. I haven't finished talking. A bullet works, but there are quieter ways if he has to die. There's no sense chasing after a hanging when we can get what we want without taking that risk. You agree with that, don't you?
        - id: ch01-b56
          speaker: bill
          text: Of course. But how are we going to do it?
        - id: ch01-b57
          speaker: jake_packard
          text: Here's my plan. We'll search the staterooms and gather up any loot we overlooked. Then we'll take it ashore, hide it, and wait. This wreck will break apart and wash downriver in less than two hours. Turner will drown, and he won't have anybody to blame but himself. That's a great deal better than killing him with our own hands. I don't favor killing a man when you can get around it. It isn't sensible, and it isn't moral. Am I right?
        - id: ch01-b58
          speaker: bill
          text: I reckon you are. But what if the wreck doesn't break apart?
        - id: ch01-b59
          speaker: jake_packard
          text: We can wait two hours and see, can't we?
        - id: ch01-b60
          speaker: bill
          text: All right. Let's go.
        - id: ch01-b61
          speaker: huck
          text: They left the room, and I slipped out after them. Cold sweat covered me as I scrambled toward the front of the wreck. It was black as pitch, and I couldn't see where I was going. I called for Jim in a rough whisper. His answer came as a low moan from right beside my elbow.
        - id: ch01-b62
          speaker: huck
          text: Quick, Jim! This is no time for moaning. There's a gang of murderers in there. We have to find their boat and turn it loose so they can't escape. Then the man they've tied up may be in trouble, but the sheriff can catch all three of them. Hurry! I'll search the port side, and you take the starboard side. Start from the raft and—
        - id: ch01-b63
          speaker: jim
          text: Oh, Lord! The raft? There ain't any raft! It broke loose and went away, and now we're stuck here!
          emotion: fearful
