audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
    jim_turner:
      display_name: 吉姆·特纳
      tts:
        delivery: 惊慌绝望，不住哀求
        timbre: 沙哑紧绷
        pace: 急促
        pitch: 中低
    jake_packard:
      display_name: 杰克·帕卡德
      tts:
        delivery: 冷静算计，语气阴沉
        timbre: 粗粝冷硬
        pace: 缓慢审慎
        pitch: 低
    bill:
      display_name: 比尔
      tts:
        delivery: 粗暴凶狠，咄咄逼人
        timbre: 低沉浑浊
        pace: 强硬有力
        pitch: 低
  chapters:
    - id: ch01
      title: 第十二章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我们终于漂过岛尾时，大概已经快凌晨一点了。木筏慢得叫人心焦。要是真有船追来，我们就打算跳进独木舟，逃到伊利诺伊岸。幸亏没船来，因为慌乱中，我们把枪、钓线和吃的全留在了木筏上。把所有家当放在同一个地方，实在不聪明。
        - id: ch01-b02
          speaker: huck
          text: 那两个人如果上了岛，八成会找到我点的营火，守上一整夜，等吉姆出现。反正他们始终没有追来。就算那堆火没骗住他们，我也已经把能使的坏招全使了。
        - id: ch01-b03
          speaker: huck
          text: 天刚蒙蒙亮，我们就在伊利诺伊一侧的大河湾里靠上一片沙洲。那种沙洲上，三角叶杨长得像耙齿一样密。我们砍下树枝，把木筏盖得严严实实，远远看去，就像河岸塌了一块。
        - id: ch01-b04
          speaker: huck
          text: 密苏里岸边是山，伊利诺伊这边全是浓密的树林，主河道又紧靠密苏里那头，所以我们不怕被人发现。我们躺在那里整整一天，看木筏和轮船沿对岸飞快地顺流而下，也看上行的轮船在大河中央跟水流拼力气，一点点往上闯。
        - id: ch01-b05
          speaker: huck
          text: 我把昨晚遇见那个女人的事，一五一十讲给吉姆听。
        - id: ch01-b06
          speaker: jim
          text: 那女人精明得很。她要亲自来追咱们，才不会守着一堆火傻等。她准会牵条狗来，绝对错不了。
        - id: ch01-b07
          speaker: huck
          text: 那她不能叫丈夫带狗吗？
        - id: ch01-b08
          speaker: jim
          text: 等那些人预备动身时，她准已经想起来了。他们一定进城找狗去了，这才耽误了那么多工夫。要不然，咱们哪能躲在离镇子十六七英里的沙洲上？绝对不能，咱们早就又被押回那个老镇子了。
        - id: ch01-b09
          speaker: huck
          text: 我说，不管他们因为什么没追上，只要咱们没被抓住就行。
        - id: ch01-b10
          speaker: huck
          text: 天快黑时，我们从三角叶杨的枝叶里探出脑袋，朝上游、下游和对岸都看了一遍。外头连个人影也没有。吉姆便撬起木筏上层的几块板，搭了个牢靠的小棚。太阳毒时能遮阳，下雨时能避雨，里面的家什也不会受潮。
        - id: ch01-b11
          speaker: huck
          text: 他把棚里的地板垫高了一英尺多，轮船掀起的浪便碰不到毯子和东西。我们还在正中央围了个框，铺上五六英寸厚的泥。天气又湿又冷时，可以躲在里面生火，外头也看不见火光。
        - id: ch01-b12
          speaker: huck
          text: 我们又多做了一支操舵桨，免得原来的桨撞上暗桩之类的东西折断。我们安了一根短短的叉头木棍，专门挂那盏旧提灯。看见下行轮船，必须马上点灯，免得让它撞上。上行轮船只有在我们横穿河道时才需要提防。那时河水还高，低岸有些地方仍泡在水里，上行的船常常不走主河道，只到处挑水势平缓的地方开。
        - id: ch01-b13
          speaker: huck
          text: 第二夜，我们顺流走了七八个钟头，水每小时能把我们送出四英里多。我们一边捕鱼，一边聊天，困了便下水游一阵，好把睡意赶走。宽阔的大河静静流着，我们仰躺在木筏上看星星，心里有种说不出的庄严。谁也不愿高声说话。偶尔觉得好笑，也只低低笑上几声。
        - id: ch01-b14
          speaker: huck
          text: 那几天天气一直很好。那一晚平安无事，下一晚也是，再下一晚还是一样。
        - id: ch01-b15
          speaker: huck
          text: 每夜，我们都会经过一些城镇。有的远远落在漆黑的山坡上，位置又高，房子一栋也看不见，眼前只有一大片闪亮的灯火。第五夜，我们从圣路易斯旁边漂过，仿佛整个世界都点亮了。
        - id: ch01-b16
          speaker: huck
          text: 圣彼得堡的人说，圣路易斯住着两三万人，我从前一直不信。直到那个寂静的夜里，两点钟时，我亲眼看见那么多灯，才相信他们没有骗人。城里听不见一点声音，所有人都睡着了。
        - id: ch01-b17
          speaker: huck
          text: 往后每晚十点左右，我都会在某个小村子附近悄悄溜上岸，花十来十五美分买些玉米面、熏肉和别的吃食。有时碰见一只在窝里栖得不大舒服的鸡，我也会顺手把它带走。
        - id: ch01-b18
          speaker: huck
          text: 爹总说，有机会就该拿一只鸡。自己不要，也总能找到想要的人，别人永远不会忘记你的好心。我倒没见过爹有哪次不想要那只鸡，可这的确是他常说的话。
        - id: ch01-b19
          speaker: huck
          text: 每天清早，天亮以前，我还会溜进玉米地，“借”一个西瓜、甜瓜、南瓜，或是几穗嫩玉米，还有别的什么。爹说，只要心里打算以后归还，借东西就不算坏事。寡妇却说，那不过是给偷东西换了个好听的名字，正派人绝不会这样做。
        - id: ch01-b20
          speaker: jim
          text: 我看寡妇有一半对，你爹也有一半对。咱们从那些东西里挑两三样，答应以后再也不借。剩下的东西，借一借也就没什么不对了。
        - id: ch01-b21
          speaker: huck
          text: 我们在河上商量了一整夜，拿不定主意该放过西瓜、香瓜还是甜瓜。快到天亮时，总算想出一个让大家都满意的法子。从此不拿酸苹果和柿子。
        - id: ch01-b22
          speaker: huck
          text: 这事没商量好以前，我们心里总觉得不大踏实。如今一切都解决了，浑身都舒服起来。我尤其满意这个结果，因为酸苹果从来不好吃，柿子还得再过两三个月才会熟。
        - id: ch01-b23
          speaker: huck
          text: 偶尔有水鸟早晨起得太早，或晚上睡得太迟，我们也会打下一只。总的说来，那些日子过得相当阔气。
        - id: ch01-b24
          speaker: huck
          text: 离开圣路易斯后的第五夜，午夜刚过，大暴雨便来了。雷声一阵接一阵，闪电不停，雨水像一整匹布似的往下泼。我们躲进小棚，什么也不管，任木筏自己照料自己。每逢电光一闪，前面笔直宽阔的河面和两岸高高的石崖就全亮了。
        - id: ch01-b25
          speaker: huck
          text: 喂——吉姆，快看那边！
        - id: ch01-b26
          speaker: huck
          text: 一艘轮船撞上礁石，把自己撞死了。我们的木筏正朝它直直漂去。闪电把那艘船照得清清楚楚。船身歪向一边，上层甲板还有一部分露在水外。细细的烟囱拉索、大钟旁的椅子，还有椅背上挂着的破旧软帽，每逢电光亮起，全都看得一清二楚。
        - id: ch01-b27
          speaker: huck
          text: 深更半夜，又赶上暴风雨，那艘沉船凄凉地、孤零零地躺在河心，一切都说不出的神秘。我跟任何别的男孩子一样，心里立刻痒了起来，非想爬上去偷偷转一圈，看看船里到底藏着什么不可。
        - id: ch01-b28
          speaker: huck
          text: 咱们靠过去吧，吉姆。
        - id: ch01-b29
          speaker: jim
          text: 我可不想在沉船边上胡闹。咱们现在过得好好的，就该知足收手，《圣经》也是这么说的。船上说不定还有看守呢。
        - id: ch01-b30
          speaker: huck
          text: 看守你奶奶！船上只剩顶层舱房和驾驶室可守。这种鬼天气，整条船随时都会散架，给河水冲到下游去。谁会为了两间破舱房，把自己的性命押在这里？
        - id: ch01-b31
          speaker: huck
          text: 再说，船长房里兴许有值得“借”的东西。我敢说有雪茄，一支值整整五美分。轮船船长一个月挣六十块，全是有钱人。他们看上什么，才不管价钱呢。
        - id: ch01-b32
          speaker: huck
          text: 把蜡烛装进口袋吧。不把那条船搜一遍，我就安不下心。汤姆·索亚碰见这种事，给他一块馅饼，他也不会错过。他会管这叫冒险，就算是他这辈子最后一件事，也照样登船。
        - id: ch01-b33
          speaker: huck
          text: 汤姆还会摆足派头，使出浑身本事。看见他那副样子，你准以为克里斯托弗·哥伦布正在发现天国。真希望汤姆也在这里。
        - id: ch01-b34
          speaker: huck
          text: 吉姆嘟囔了几句，到底还是答应了。他叫我尽量别说话，非说不可，也得把声音压得极低。闪电恰好又亮了一下，我们及时看准了沉船的位置。木筏靠上右舷的吊杆，我们就在那里把它牢牢系住。
        - id: ch01-b35
          speaker: huck
          text: 那边甲板翘得很高。我们在黑暗里沿着斜甲板往左舷下方摸，朝顶层舱房走去。脚下每一步都先试探，双手张开在前面挡着，免得撞上那些完全看不见的拉索。摸到天窗前端以后，我们爬了上去。再往前一步，就是敞开的船长舱门。
        - id: ch01-b36
          speaker: huck
          text: 我的天哪！远处的过道里竟然有一点灯光。同一刻，我们还听见了压得很低的说话声。
        - id: ch01-b37
          speaker: jim
          text: 哈克，我难受得厉害。咱们快走吧。
        - id: ch01-b38
          speaker: huck
          text: 我答应了，正要回木筏，忽然听见一个人哀求起来。
        - id: ch01-b39
          speaker: jim_turner
          text: 求求你们，别动手！我发誓，绝不会告诉别人！
          emotion: fearful
        - id: ch01-b40
          speaker: jake_packard
          text: 你撒谎，吉姆·特纳！你以前就这么干过。每次分赃，你都要多拿一份，不给你就威胁要告密，所以回回都让你得了手。这次，你把同一句话多说了一遍。再没有比你更卑鄙、更靠不住的狗了。
          emotion: angry
        - id: ch01-b41
          speaker: huck
          text: 这时吉姆已经回木筏去了。我却好奇得浑身发热，怎么也走不了。我对自己说，汤姆·索亚到了这一步，绝不会退回去，我也不能退。我要留下来，看看里面到底发生了什么。
        - id: ch01-b42
          speaker: huck
          text: 我趴下来，手脚并用，沿狭窄的过道摸黑往船尾爬。等我和横廊之间只隔着最后一间客舱，终于看清了里面。一个男人手脚被捆，直挺挺躺在地板上。两个男人站在他身边，一个提着昏暗的灯，另一个握着手枪，不住把枪口指向地上那人的脑袋。
        - id: ch01-b43
          speaker: bill
          text: 我真想一枪打死你！你这卑鄙的臭鼬，本来就该死！
          emotion: angry
        - id: ch01-b44
          speaker: jim_turner
          text: 别开枪，比尔，求求你！我以后绝不会告密了。
          emotion: fearful
        - id: ch01-b45
          speaker: jake_packard
          text: 你当然不会！我敢说，你这辈子从没讲过这么真的话。
        - id: ch01-b46
          speaker: jake_packard
          text: 听听他怎么求饶。要不是我们抢先把他捆起来，他早把咱俩杀了。为了什么？什么也不为，就因为我们非要拿自己该得的那份。吉姆·特纳，我看你以后再也威胁不了谁了。比尔，把枪收起来。
        - id: ch01-b47
          speaker: bill
          text: 我不收，杰克·帕卡德。我非杀了他不可。老哈特菲尔德就是让他这样杀死的。难道他不该偿命？
          emotion: angry
        - id: ch01-b48
          speaker: jake_packard
          text: 可我不想让他死。我这样说，自然有我的道理。
        - id: ch01-b49
          speaker: jim_turner
          text: 杰克·帕卡德，愿上帝保佑你说的这句话！只要我还活着，一辈子都不会忘记你！
        - id: ch01-b50
          speaker: huck
          text: 特纳抽抽搭搭地说着，帕卡德却连一点反应也没有。他把灯挂上钉子，示意比尔跟着自己，朝我藏身的黑暗处走来。我拼命往后退了两码，可船身斜着，根本爬不快。怕他们踩到我，再把我逮住，我只好钻进上侧的一间客舱。
        - id: ch01-b51
          speaker: jake_packard
          text: 来，咱们进这里说。
        - id: ch01-b52
          speaker: huck
          text: 帕卡德走进来，比尔紧跟在后。可他们进门以前，我已经爬上了上铺。现在我被堵在里面，后悔极了。他们站在近旁，把手搭在铺位边上。我看不见人，却能凭他们喝过的威士忌酒气，认出两人站在哪里。
        - id: ch01-b53
          speaker: huck
          text: 我很庆幸自己不喝威士忌。不过其实也没什么分别，因为大半时候，他们就是想循着气息找我也办不到。我吓得一口气也不敢喘。再说，听到他们接下来讲的话，谁还能喘得出气呢？他们声音很低，口气却十分认真。
        - id: ch01-b54
          speaker: bill
          text: 特纳说过要告密，就一定会去。现在就算把咱俩的份全给他，也已经晚了。刚才闹成那样，咱们又把他收拾了一顿，他准会去给州里当证人。听我的，干脆送他脱离苦海。
        - id: ch01-b55
          speaker: jake_packard
          text: 我也是这个意思。
        - id: ch01-b56
          speaker: bill
          text: 该死，我刚才还以为你不肯呢。既然这样，那就没事了。咱们现在去动手。
        - id: ch01-b57
          speaker: jake_packard
          text: 等一等，我的话还没说完。开枪当然省事，可既然非办不可，也有更安静的办法。只要能把事办成，又不必冒险，何苦自己往绞索跟前凑？我说得对吧？
        - id: ch01-b58
          speaker: bill
          text: 当然对。可这一次，你打算用什么办法？
        - id: ch01-b59
          speaker: jake_packard
          text: 咱们先把各间客舱再搜一遍，拿走漏下的值钱东西。然后上岸，把赃物藏好，再等上一阵。我看不出两个钟头，这条沉船就会散架，顺河漂走。
        - id: ch01-b60
          speaker: jake_packard
          text: 到时候，特纳会淹死，只能怪他自己。这可比亲手杀他强多了。只要能绕开，我就不赞成杀人。那既不聪明，也不合道德。对不对？
        - id: ch01-b61
          speaker: bill
          text: 我看你说得对。可要是船没有散架，也没有漂走呢？
        - id: ch01-b62
          speaker: jake_packard
          text: 那也先等两个钟头，看过以后再说，行不行？
        - id: ch01-b63
          speaker: bill
          text: 好，那就走吧。
        - id: ch01-b64
          speaker: huck
          text: 他们一走，我立刻浑身冷汗地往前逃。四周黑得像一桶沥青。我压着嗓子叫吉姆。他就在我胳膊肘旁边，呻吟似的答应了一声。
        - id: ch01-b65
          speaker: huck
          text: 快，吉姆！现在不是磨蹭哼哼的时候。那边有一伙杀人犯。咱们得找到他们的小船，把它放走。这样他们就逃不出沉船，那个被捆的人也许还能保住命。
        - id: ch01-b66
          speaker: huck
          text: 只要找到那条小船，就能让他们全都倒霉，治安官会来抓人。赶紧！我搜左舷，你搜右舷。你从木筏那边开始，然后——
        - id: ch01-b67
          speaker: jim
          text: 我的老天爷呀！木筏？木筏早就没啦！绳子挣脱了，它已经漂走了——咱俩困在这条船上啦！
          emotion: fearful
