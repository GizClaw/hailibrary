audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    aunt_sally:
      display_name: 萨莉姨妈
      tts:
        delivery: 热情爽快，忙忙碌碌，喜怒全写在声音里
        timbre: 成熟朴实
        pace: 轻快
        pitch: 中高
    uncle_silas:
      display_name: 赛拉斯姨父
      tts:
        delivery: 老实温和，忧虑时认真而迟疑
        timbre: 年长柔和
        pace: 舒缓
        pitch: 中低
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jimmy:
      display_name: 吉米
      tts:
        delivery: 天真直率，说话不绕弯子
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 第三十三章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我赶着马车进镇。走到半路，迎面也来了一辆车。仔细一看，车上果然是汤姆·索亚。我停下来等他靠近，喊他停车。他把车停在我旁边，嘴巴张得像敞开的箱子，怎么也合不上。接着又干咽了两三下，像嗓子已经干透了。
        - id: ch01-b02
          speaker: tom
          text: 我可从没害过你，这你是知道的。那你为什么还要回来，变成鬼缠着我？
          emotion: fearful
        - id: ch01-b03
          speaker: huck
          text: 我没回来，因为我根本就没走。
        - id: ch01-b04
          speaker: huck
          text: 一听见我的声音，汤姆稍微缓过来一点，可他还是不大放心。
        - id: ch01-b05
          speaker: tom
          text: 你别拿这种事骗我，我绝不会拿它骗你。凭良心说，你真的不是鬼？
        - id: ch01-b06
          speaker: huck
          text: 凭良心说，我不是。
        - id: ch01-b07
          speaker: tom
          text: 那么……那照说就该没事了。可我怎么还是弄不明白？你到底有没有让人杀死过？
        - id: ch01-b08
          speaker: huck
          text: 从来没有。那是我设下的骗局。你不相信，就上车摸摸我。
        - id: ch01-b09
          speaker: huck
          text: 汤姆果真上车摸了摸，这才相信。他见我还活着，高兴得不知道怎么办才好，马上就想听完整个经过。那故事既惊险又神秘，正是他最着迷的东西。我叫他往后再听，又吩咐他的车夫留在原处等着。我们把车赶开一小段，我把自己的麻烦从头到尾告诉了他，问他觉得该怎么办。汤姆叫我一分钟也别打扰他，独自想了又想，过了一阵才有了主意。
        - id: ch01-b10
          speaker: tom
          text: 有了。把我的箱子搬到你车上，就当是你的。你调头慢慢往回赶，照正常时候到家。我先往镇上走一段，再折回来，比你晚一刻钟或半个钟头到。起初你只管装作不认识我。
        - id: ch01-b11
          speaker: huck
          text: 这个办法行。不过还有件事，除了我，谁也不知道。这里关着一个黑人，我想把他从奴隶身份里偷出来。那人就是沃森小姐从前的吉姆。
        - id: ch01-b12
          speaker: tom
          text: 什么！吉姆不是……
          emotion: surprised
        - id: ch01-b13
          speaker: huck
          text: 他没说完，又低头想起来。我知道他要说什么。这事是肮脏下贱，可那又怎样？我自己本来就下贱。我一定要把吉姆偷出去，只求汤姆闭紧嘴巴，什么也别露出来。
        - id: ch01-b14
          speaker: huck
          text: 你答不答应？
        - id: ch01-b15
          speaker: tom
          text: 我不但答应，我还要帮你把他偷出来！
          emotion: happy
        - id: ch01-b16
          speaker: huck
          text: 这句话惊得我像挨了一枪，手里什么都抓不住了。我一辈子也没听过更惊人的话。说实在的，汤姆·索亚在我心里顿时矮了一大截。可我还是不敢相信。汤姆·索亚这样的人，居然也肯做个偷走黑人奴隶的家伙！
        - id: ch01-b17
          speaker: huck
          text: 得了吧，你一定是在开玩笑。
        - id: ch01-b18
          speaker: tom
          text: 我没有开玩笑。
        - id: ch01-b19
          speaker: huck
          text: 那不管你是不是说笑，如果听见别人提逃跑的黑人，你可一定记住，你不认识他，我也不认识他。
        - id: ch01-b20
          speaker: huck
          text: 我们把汤姆的箱子放进我的马车，然后各走各的。他朝一个方向，我朝另一个方向。我又高兴，脑子里又塞满了事情，竟把慢慢赶车的约定忘得一干二净。照这一趟的路程看，我回家实在快得离谱。赛拉斯姨父正在门口等着。
        - id: ch01-b21
          speaker: uncle_silas
          text: 这可太了不起了！谁知道这匹母马跑得这么快？刚才真该计个时。瞧，她连一根毛都没出汗。一百块钱我也不卖她了。说真的，从前十五块钱我就肯卖，还当她只值那么多呢。
          emotion: surprised
        - id: ch01-b22
          speaker: huck
          text: 他再没说别的。赛拉斯姨父是我见过最天真、最厚道的人。这也不奇怪，他既是农场主，也是牧师。种植园后面有座小小的圆木教堂，是他自己掏钱、亲手盖起来的，既当教堂，也当学校。他讲道从来不收费，而那些道也确实只值这个价钱。南方还有许多这样的农场主兼牧师，做法全都一样。
        - id: ch01-b23
          speaker: huck
          text: 过了半个钟头，汤姆的马车停在前面的栅栏台阶边。那里离屋子只有五十码，萨莉姨妈从窗口看得清清楚楚。
        - id: ch01-b24
          speaker: aunt_sally
          text: 有人来啦！会是谁呢？我看像个生客。吉米，快告诉莉兹，吃饭时多摆一只盘子。
          emotion: surprised
        - id: ch01-b25
          speaker: huck
          text: 我们全都挤向前门。生客不是年年都来，所以一旦真来一个，比黄热病还叫人兴奋。汤姆已经翻过栅栏台阶，朝屋子走来，送他的马车正沿大路飞快地驶向村里。我们一群人堵满了门口。他穿着进城才穿的好衣裳，面前又有这么多观众。这可是他最喜欢的场面，摆出足够的派头，对他一点儿也不难。
        - id: ch01-b26
          speaker: huck
          text: 汤姆从不肯像绵羊那样缩着头走过院子。他步子又稳又神气，活像一只公羊。来到我们面前，他斯斯文文地摘下帽子。那动作轻得很，仿佛帽子是一只盒盖，里面睡着几只蝴蝶，他怕把它们惊醒。
        - id: ch01-b27
          speaker: tom
          text: 请问，您就是阿奇博尔德·尼科尔斯先生吧？
        - id: ch01-b28
          speaker: uncle_silas
          text: 不是，孩子。很遗憾，你的车夫骗了你。尼科尔斯家还在三英里以外。快进来吧。
        - id: ch01-b29
          speaker: huck
          text: 汤姆回头看了一眼。
        - id: ch01-b30
          speaker: tom
          text: 太迟了，他已经走得看不见啦。
        - id: ch01-b31
          speaker: uncle_silas
          text: 是啊，他已经走了。孩子，你一定得进来跟我们吃饭。吃过饭，我们套上车送你去尼科尔斯家。
        - id: ch01-b32
          speaker: tom
          text: 我怎么能给你们添这么大麻烦？那可不行。我自己走过去吧，这点路不算什么。
        - id: ch01-b33
          speaker: uncle_silas
          text: 我们不能让你走过去。那样就不算南方人的待客之道了。快进屋。
        - id: ch01-b34
          speaker: aunt_sally
          text: 对，快进来，一点儿也不麻烦。你非留下不可。三英里又远，路上又全是灰，我们哪能让你步行？再说，我看见你来，已经叫人多摆盘子了。你可别让我们白忙一场。进来，就当到了自己家。
        - id: ch01-b35
          speaker: huck
          text: 汤姆谢得又热诚又体面，随后听凭他们劝说，顺势进了屋。进去以后，他又鞠了一躬，说自己是个外乡人，从俄亥俄州的希克斯维尔来，名叫威廉·汤普森。
        - id: ch01-b36
          speaker: huck
          text: 接着，他开始编希克斯维尔的故事。镇子和那里的人，全是他随口造出来的，可他一直说个不停。我越来越紧张，猜不出这一套怎样能救我。汤姆说着说着，忽然探过身去，正正亲在萨莉姨妈嘴上。然后他舒舒服服靠回椅背，还打算接着讲。萨莉姨妈猛地站起来，用手背使劲擦了擦嘴。
        - id: ch01-b37
          speaker: aunt_sally
          text: 你这个没羞没臊的小狗崽子！
          emotion: angry
        - id: ch01-b38
          speaker: huck
          text: 汤姆看起来反倒受了委屈。
        - id: ch01-b39
          speaker: tom
          text: 太太，您这样真叫我吃惊。
        - id: ch01-b40
          speaker: aunt_sally
          text: 你还吃惊？那你以为我该怎么样？我真想拿起……喂，你为什么亲我？
          emotion: angry
        - id: ch01-b41
          speaker: tom
          text: 我没什么意思，太太，真的没有恶意。我只是以为……以为您会喜欢。
        - id: ch01-b42
          speaker: huck
          text: 萨莉姨妈骂他是个天生的傻瓜，又抓起纺线杆。看她的样子，要忍住不打他一下，可真不容易。
        - id: ch01-b43
          speaker: aunt_sally
          text: 你凭什么会以为我喜欢？
          emotion: angry
        - id: ch01-b44
          speaker: tom
          text: 我也说不清。是他们告诉我的，他们说您会喜欢。
        - id: ch01-b45
          speaker: aunt_sally
          text: 他们说我会喜欢？跟你这么说的人也是疯子。我这辈子没听过这样的怪事。你说的“他们”是谁？
          emotion: angry
        - id: ch01-b46
          speaker: tom
          text: 就是大家呀，太太。大家全这么说。
        - id: ch01-b47
          speaker: huck
          text: 萨莉姨妈快压不住火了。她眼里冒着光，手指一屈一伸，像是马上要抓他几道。
        - id: ch01-b48
          speaker: aunt_sally
          text: “大家”到底是谁？把名字说出来，不然世上马上就要少一个傻瓜！
          emotion: angry
        - id: ch01-b49
          speaker: huck
          text: 汤姆站起来，满脸难过，低头揉着帽子。
        - id: ch01-b50
          speaker: tom
          text: 对不起，我没想到会这样。是大家叫我亲您的。每个人都说，亲她吧，她会喜欢的，一个也没漏。不过我真的很抱歉。以后再也不会了，我保证。
        - id: ch01-b51
          speaker: aunt_sally
          text: 你不会了，是不是？哼，我看你当然不会！
          emotion: angry
        - id: ch01-b52
          speaker: tom
          text: 是的，太太，我这回说真的。我再也不亲您了，除非您亲口叫我亲。
        - id: ch01-b53
          speaker: aunt_sally
          text: 除非我请你！我活了一辈子，也没见过这样的事。等我开口请你这种人亲我时，你准已经成了开天辟地第一号的玛土撒拉大傻瓜！
          emotion: angry
        - id: ch01-b54
          speaker: tom
          text: 这可真叫我吃惊，我完全弄不明白。他们说您会喜欢，我也以为您会喜欢。可是……
        - id: ch01-b55
          speaker: huck
          text: 他停下来，慢慢朝四下看，像是非要找一双同情他的眼睛。最后，他盯住赛拉斯姨父。
        - id: ch01-b56
          speaker: tom
          text: 先生，难道您也没想到，她会喜欢我亲她吗？
        - id: ch01-b57
          speaker: uncle_silas
          text: 这个，没有。我……我想，我确实没那么想。
        - id: ch01-b58
          speaker: huck
          text: 汤姆又照原样转向了我。
        - id: ch01-b59
          speaker: tom
          text: 汤姆，难道连你也没想到，萨莉姨妈会张开双臂喊一声，“锡德·索亚……”
        - id: ch01-b60
          speaker: aunt_sally
          text: 我的老天爷！你这个没大没小的小坏蛋，竟敢这样捉弄人……
          emotion: surprised
        - id: ch01-b61
          speaker: huck
          text: 她扑过去要抱汤姆，汤姆却伸手挡住了。
        - id: ch01-b62
          speaker: tom
          text: 不行，得等您先开口请我。
        - id: ch01-b63
          speaker: huck
          text: 萨莉姨妈马上就请了。她把汤姆抱住，亲了一遍又一遍，亲够以后，又把他交给赛拉斯姨父。姨父接过去，把剩下的那份也全补上。等大家稍微平静下来，萨莉姨妈才终于能说话。
        - id: ch01-b64
          speaker: aunt_sally
          text: 真没想到会有这样的惊喜！我们等的只有汤姆，根本不知道你会来。姐姐写信时，只提过他一个人。
          emotion: happy
        - id: ch01-b65
          speaker: tom
          text: 因为起初确实只打算让汤姆来。可我求了又求，到了最后一刻，她才答应让我也来。我们顺流而下时想出这个办法，让汤姆先到这里，我晚些再跟来，装成外乡人登门，好给你们一个大惊喜。不过我们想错了，萨莉姨妈。外乡人到这里来，可不太安全。
        - id: ch01-b66
          speaker: aunt_sally
          text: 是不安全，尤其是你这种没大没小的小狗崽子，锡德。你真该挨几个嘴巴子。我都记不起上次气成这样是什么时候了。不过这点代价算不了什么。只要能见到你，这样的玩笑来一千次，我也愿意受着。想起刚才那一出，我还吃惊呢。你猛地亲上来，差点把我吓成僵尸。
          emotion: happy
        - id: ch01-b67
          speaker: huck
          text: 我们在正屋和厨房之间那条宽阔、两面敞开的过道里吃饭。桌上的食物够七户人家吃，而且样样热腾腾的。绝不是那种在潮湿地窖的橱柜里搁上一夜，第二天早晨又软又韧，吃着像一大块冰冷老食人族的肉。赛拉斯姨父为这顿饭作了很长的祷告，不过这顿饭值得他祷告那么久。而且饭竟一点儿也没凉，不像我以前见过的那些打岔，常常能把一桌饭耽搁得冷透。
        - id: ch01-b68
          speaker: huck
          text: 大家整整聊了一下午。我和汤姆一直竖着耳朵，可谁也没提逃跑的黑人，我们又不敢主动把话引过去。直到晚饭时，一个小男孩忽然开了口。
        - id: ch01-b69
          speaker: jimmy
          text: 爸爸，我能跟汤姆、锡德一起去看演出吗？
        - id: ch01-b70
          speaker: uncle_silas
          text: 不能。我看那演出也办不成了。就算能办，你们也不能去。那个逃跑的黑人已经把那场丢人的表演全告诉了我和伯顿。伯顿答应通知镇上的人。所以我猜，那几个胆大包天的懒汉早被赶出镇子了。
        - id: ch01-b71
          speaker: huck
          text: 原来事情是这样，可我一点办法也没有。我和汤姆睡同一间房、同一张床。晚饭后，我们装作累了，道过晚安就上楼。随后又爬出窗户，顺着避雷针溜到地面，飞快赶往镇上。我不相信有人会给国王和公爵通风报信。要是我不赶快去，他们一定会惹上麻烦。
        - id: ch01-b72
          speaker: huck
          text: 路上，汤姆把我离开后的事全讲了。他说，人们怎样认定我已经被杀，爸爸怎样在不久后失踪，从此没再回来，还有吉姆逃跑时闹出了怎样大的风波。我也把“举世无双皇家异兽”那两个无赖的事说给他听。剩下的时间里，我尽量讲了讲木筏上的旅程。等这些话差不多讲完，我们也进了镇子。
        - id: ch01-b73
          speaker: huck
          text: 我们进了镇子，一直沿着镇子正中央的大街往前走。那时大约已经八点半，一大群人突然发疯似的迎面涌来。人们举着火把，狂呼乱叫，一边敲铁皮锅，一边吹响号角，闹出的声音简直震耳欲聋。我们赶紧跳到路边给他们让路。等人群从眼前经过，我才看见国王和公爵正分开两腿，跨坐在一根横杆上。他们满身焦油和羽毛，早已不像人，只像两根大得吓人的士兵帽缨。
        - id: ch01-b74
          speaker: huck
          text: 那场面看得我一阵恶心。我可怜那两个又穷又惨的无赖，觉得自己这辈子再也没法硬起心肠恨他们。人对人竟能残忍到这种地步，实在可怕。
        - id: ch01-b75
          speaker: huck
          text: 我们已经来迟，什么也帮不上了。问过几个落在后面的人，才知道大家去看演出时，全都装得老老实实，一声不响。他们一直等到可怜的老国王在台上跳得最起劲，才由一个人发出信号。满场观众立刻站起来，一齐扑向国王和公爵。
        - id: ch01-b76
          speaker: huck
          text: 我们只好拖着脚步往家走。我再也不像先前那么神气，只觉得又卑微、又羞惭，不知怎么还觉得自己也有错，尽管我根本什么都没做。可良心向来如此。你做得对也好，错也好，它一点道理不讲，横竖要来折磨你。
        - id: ch01-b77
          speaker: huck
          text: 我要是养了一条黄狗，见识还不如人的良心，我准会毒死它。人的良心占的地方，比肚子里其余东西加起来还大，可一点用也没有。汤姆·索亚也这么说。
