  chapters:
    - id: ch01
      title: CHAPTER XXXIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: I set out for town in the wagon. Halfway there, another wagon came toward me, and there sat Tom Sawyer. I stopped and called for his driver to hold up. When Tom saw me, his mouth fell open and stayed that way. He swallowed two or three times before he could speak.
        - id: ch01-b02
          speaker: tom
          text: I never hurt you, Huck. You know I didn't. What did you come back to haunt me for?
          emotion: fearful
        - id: ch01-b03
          speaker: huck
          text: I didn't come back. I never went away.
        - id: ch01-b04
          speaker: huck
          text: Hearing my voice settled him some, but he still wasn't convinced.
        - id: ch01-b05
          speaker: tom
          text: Don't play tricks on me. I wouldn't do that to you. Swear now, are you really not a ghost?
          emotion: fearful
        - id: ch01-b06
          speaker: huck
          text: I swear I'm not.
        - id: ch01-b07
          speaker: tom
          text: Well, that ought to settle it. Only I still can't make sense of this. Huck, weren't you ever murdered at all?
          emotion: surprised
        - id: ch01-b08
          speaker: huck
          text: No, I wasn't murdered. I fooled everybody. Come feel me if you don't believe it.
        - id: ch01-b09
          speaker: huck
          text: Tom climbed over and felt me, and that finally satisfied him. He was so glad to see me that he hardly knew what to do. He wanted the whole story right then. To him, it was a grand, mysterious adventure, and that sort of thing went straight to his heart. I told him the story would have to wait. Then I asked his driver to stay there while Tom and I rode a little farther in my wagon. I explained the trouble I was in and asked what he thought we ought to do. He told me to leave him alone for a minute and not disturb him. So he sat there thinking and thinking until the answer came.
        - id: ch01-b10
          speaker: tom
          text: I've got it. Put my trunk in your wagon and pretend it's yours. Turn back and take your time, so you reach the house when they expect you. I'll ride toward town, start over, and arrive a quarter or half an hour later. At first, act like you don't know me.
        - id: ch01-b11
          speaker: huck
          text: All right, but there's one more thing. Nobody knows it but me. An enslaved man named Jim is being held here, old Miss Watson's Jim. I'm trying to get him out of slavery.
        - id: ch01-b12
          speaker: tom
          text: What? But Jim is—
          emotion: surprised
        - id: ch01-b13
          speaker: huck
          text: Tom stopped to think again. I knew what I expected him to say.
        - id: ch01-b14
          speaker: huck
          text: I know. You'll say it's a dirty, low-down thing to do. Maybe it is. I'm low-down too, and I'm going to steal him out. Will you keep quiet and never let on?
        - id: ch01-b15
          speaker: huck
          text: Tom's eyes lit up.
        - id: ch01-b16
          speaker: tom
          text: I'll help you steal him!
          emotion: happy
        - id: ch01-b17
          speaker: huck
          text: I let go of everything, as if I'd been shot. That was the most astonishing speech I'd ever heard. I have to admit, Tom Sawyer dropped a long way in my opinion right then. Even so, I couldn't believe it. Tom Sawyer, helping to steal an enslaved man free? It didn't seem possible.
        - id: ch01-b18
          speaker: huck
          text: Oh, come on. You're joking.
        - id: ch01-b19
          speaker: tom
          text: No, I'm not joking.
        - id: ch01-b20
          speaker: huck
          text: Joke or no joke, if anybody talks about a runaway enslaved man, remember that neither one of us knows a thing about him.
        - id: ch01-b21
          speaker: huck
          text: We loaded Tom's trunk into my wagon. He went one way, and I went mine. I was so glad and so busy thinking that I forgot to drive slowly. I reached the house far too soon. The old gentleman stood at the door.
        - id: ch01-b22
          speaker: uncle_silas
          text: Well, this is remarkable! Who would have guessed that mare could make such time? I wish we'd measured it. She hasn't even worked up a sweat. I wouldn't take a hundred dollars for her now, though before today I'd have gladly sold her for fifteen.
          emotion: surprised
        - id: ch01-b23
          speaker: huck
          text: That was all he said. He was the most innocent, goodhearted old soul I ever knew. It wasn't so surprising, because he wasn't only a farmer. He was a preacher too. Behind the plantation stood his little one-horse log church, which he had built with his own money to serve as both church and schoolhouse. He never charged anything for his preaching, and it was worth exactly what people paid for it. Plenty of other Southern farmers preached the same way.
        - id: ch01-b24
          speaker: huck
          text: About half an hour later, Tom's wagon stopped by the front stile. Aunt Sally saw it through the window, only fifty yards away.
        - id: ch01-b25
          speaker: aunt_sally
          text: Why, someone's here! Who can it be? I do believe it's a stranger. Jimmy, run tell Lize to set one more plate for dinner.
          emotion: surprised
        - id: ch01-b26
          speaker: huck
          text: Everybody rushed to the front door. A stranger didn't come every year, so when one did, he was more interesting than yellow fever. Tom was already over the stile and walking toward the house. His wagon went spinning up the road toward the village while all of us crowded together in the doorway to watch him come.
        - id: ch01-b27
          speaker: huck
          text: Tom wore his good store-bought clothes, and now he had an audience. Nothing pleased Tom Sawyer more, and putting on just the right amount of style was easy for him. He wasn't the sort of boy to creep meekly up the yard like a sheep. He came along calm and important, like the ram. When he reached us, he lifted his hat with such delicate care that you might think it was the lid of a box full of sleeping butterflies.
        - id: ch01-b28
          speaker: tom
          text: Mr. Archibald Nichols, I presume?
        - id: ch01-b29
          speaker: uncle_silas
          text: No, my boy. I'm sorry, but your driver led you wrong. The Nichols place is about three miles farther on. Come inside.
        - id: ch01-b30
          speaker: huck
          text: Tom glanced back over his shoulder.
        - id: ch01-b31
          speaker: tom
          text: Too late. He's already out of sight.
        - id: ch01-b32
          speaker: uncle_silas
          text: Then you must come in and have dinner with us, son. Afterward, we'll hitch up and drive you to the Nichols place.
        - id: ch01-b33
          speaker: tom
          text: Oh, I couldn't put you to all that trouble. I'll walk. Three miles won't bother me.
        - id: ch01-b34
          speaker: uncle_silas
          text: We won't hear of you walking. That wouldn't be Southern hospitality. Come right in.
        - id: ch01-b35
          speaker: aunt_sally
          text: Please do. It isn't any trouble at all. You must stay. Those three miles are long and dusty, and we can't send you out on foot. Besides, I had another plate set as soon as I saw you. Don't disappoint us now. Come in and make yourself at home.
        - id: ch01-b36
          speaker: huck
          text: Tom thanked them in a handsome, hearty way and let them persuade him. Once he was inside, he introduced himself as William Thompson, a stranger from Hicksville, Ohio. Then he gave them another polished bow.
        - id: ch01-b37
          speaker: huck
          text: He kept talking, inventing one thing after another about Hicksville and everyone who lived there. I got nervous, wondering how any of this would get me out of trouble. At last, while he was still talking, Tom leaned over and kissed Aunt Sally square on the mouth. Then he settled comfortably into his chair as if nothing had happened. She sprang up and wiped her mouth with the back of her hand.
        - id: ch01-b38
          speaker: aunt_sally
          text: You shameless little puppy!
          emotion: angry
        - id: ch01-b39
          speaker: huck
          text: Tom looked hurt.
        - id: ch01-b40
          speaker: tom
          text: Why, ma'am, I'm surprised at you.
        - id: ch01-b41
          speaker: aunt_sally
          text: You're surprised? What do you think I am? I've half a mind to— What did you mean by kissing me?
          emotion: angry
        - id: ch01-b42
          speaker: huck
          text: Tom made himself look humble.
        - id: ch01-b43
          speaker: tom
          text: I didn't mean any harm, ma'am. I thought you would like it.
        - id: ch01-b44
          speaker: huck
          text: Aunt Sally grabbed the spinning stick. She could barely keep herself from cracking him with it.
        - id: ch01-b45
          speaker: aunt_sally
          text: You born fool! What ever made you think I'd like that?
          emotion: angry
        - id: ch01-b46
          speaker: tom
          text: I don't rightly know. They told me you would.
        - id: ch01-b47
          speaker: aunt_sally
          text: They told you? Then whoever said it is another lunatic. I never heard such nonsense. Who are they?
          emotion: angry
        - id: ch01-b48
          speaker: tom
          text: Everybody, ma'am. They all said so.
        - id: ch01-b49
          speaker: huck
          text: Her eyes flashed, and her fingers worked as if she wanted to scratch him.
        - id: ch01-b50
          speaker: aunt_sally
          text: Who is everybody? Give me their names right now, or there'll be one less idiot in this world.
          emotion: angry
        - id: ch01-b51
          speaker: huck
          text: Tom stood up looking miserable and fumbled with his hat.
        - id: ch01-b52
          speaker: tom
          text: I'm sorry, ma'am. I never expected this. They all told me to kiss you. Every last one said you'd like it. But I won't ever do it again. Honest, I won't.
        - id: ch01-b53
          speaker: aunt_sally
          text: You won't? Well, I should hope not!
          emotion: angry
        - id: ch01-b54
          speaker: tom
          text: No, ma'am. I truly won't. Not until you ask me.
        - id: ch01-b55
          speaker: aunt_sally
          text: Until I ask you! I never heard the equal of it in all my days. You'll be older than Methuselah before I ask you, or anyone like you.
          emotion: angry
        - id: ch01-b56
          speaker: tom
          text: I just can't understand it. They said you would like it, and I believed them. But—
        - id: ch01-b57
          speaker: huck
          text: He slowly looked around for a friendly face and stopped at the old gentleman.
        - id: ch01-b58
          speaker: tom
          text: Sir, didn't you think she'd want me to kiss her?
        - id: ch01-b59
          speaker: uncle_silas
          text: Why, no. I—well, no, I don't believe I did.
        - id: ch01-b60
          speaker: huck
          text: Tom turned the same questioning look on me.
        - id: ch01-b61
          speaker: tom
          text: Tom, didn't you think Aunt Sally would throw open her arms and say, “Sid Sawyer—”
        - id: ch01-b62
          speaker: aunt_sally
          text: My land! You impudent little rascal, fooling me like that—
          emotion: surprised
        - id: ch01-b63
          speaker: huck
          text: She jumped toward him to give him a hug, but he held her off.
        - id: ch01-b64
          speaker: tom
          text: No, not until you ask me first.
        - id: ch01-b65
          speaker: huck
          text: Aunt Sally asked without wasting a second. Then she hugged and kissed him over and over before passing him to the old gentleman, who welcomed whatever was left. When everyone had settled down a little, she spoke again.
        - id: ch01-b66
          speaker: aunt_sally
          text: Dear me, what a surprise! We weren't expecting you at all, only Tom. Your mother never wrote that anyone else was coming.
          emotion: surprised
        - id: ch01-b67
          speaker: tom
          text: That's because only Tom was supposed to come. I begged and begged until she let me come at the last minute. On the river, Tom and I planned a fine surprise. He would reach the house first, and I would follow later and pretend to be a stranger. But it was a mistake, Aunt Sally. This isn't a healthy place for strangers.
        - id: ch01-b68
          speaker: aunt_sally
          text: Not for impudent pups like you, Sid. You deserved to have your ears boxed. I can't remember the last time anyone upset me so. Still, I don't mind the price. I'd stand a thousand tricks like that just to have you here. And what a performance you gave us! I won't deny it, that kiss nearly turned me to stone with astonishment.
        - id: ch01-b69
          speaker: huck
          text: We ate dinner in the wide open passage between the house and the kitchen. That table held enough food for seven families, and every bit was hot. There was none of that limp, tough meat that's been sitting all night in a cupboard in a damp cellar. By morning, meat like that tastes like a chunk of some old cold cannibal. Uncle Silas gave a fairly long blessing over our meal, but it was worth waiting for. The food didn't cool at all, though I'd seen that happen during plenty of other long interruptions.
        - id: ch01-b70
          speaker: huck
          text: There was a good deal of talk all afternoon. Tom and I stayed on the lookout the whole time, waiting for somebody to mention a runaway enslaved man. Nobody did, and we were afraid to steer the talk that way ourselves. Then, during supper that night, one of the little boys asked a question.
        - id: ch01-b71
          speaker: jimmy
          text: Pa, can Tom and Sid and I go see the show?
        - id: ch01-b72
          speaker: uncle_silas
          text: No. I doubt there will be any show, and you couldn't go even if there was. The runaway enslaved man told Burton and me all about that disgraceful performance. Burton meant to warn the townspeople, so I expect they've already driven those brazen loafers out of town.
        - id: ch01-b73
          speaker: huck
          text: There it was, and I couldn't help it now. Tom and I were sharing a room and a bed. Right after supper, we said we were tired and went upstairs. Then we climbed through the window, went down the lightning rod, and hurried toward town. I didn't believe anyone would warn the king and the duke. If I didn't reach them quickly, they were bound to get into trouble.
        - id: ch01-b74
          speaker: huck
          text: Along the road, Tom told me how everyone believed I'd been murdered. Pap had disappeared soon afterward and never returned, and Jim's escape had caused a great stir back home. In return, I told Tom all about the two scoundrels who called themselves royalty and their Royal Nonesuch show. I also told as much of our journey on the raft as there was time for before we reached town.
        - id: ch01-b75
          speaker: huck
          text: It was around half past eight when we reached town and headed up the middle of the main street. Suddenly, a furious crowd came rushing straight toward us. People carried blazing torches. They yelled and whooped, beat on tin pans, and blew horns as they ran. Tom and I jumped to one side of the road to let the whole wild procession pass.
        - id: ch01-b76
          speaker: huck
          text: In the middle of it all, the king and the duke were riding astride a rail. I knew it had to be them, though tar and feathers covered them from head to foot. Nothing about them looked human anymore. They looked like two monstrous, oversized plumes from soldiers' hats. The sight made me sick. I felt so sorry for those poor, pitiful scoundrels that I couldn't imagine ever holding any anger against them again. It was a dreadful thing to watch. Human beings can be awful cruel to one another.
        - id: ch01-b77
          speaker: huck
          text: We could see we'd come too late, and there was nothing we could do. We asked some people trailing behind the crowd what had happened. They said everybody went to the show wearing innocent faces. The whole audience stayed quiet and gave nothing away until the poor old king was right in the middle of carrying on across the stage. Then someone gave a signal. The entire house rose at once and rushed the two of them.
        - id: ch01-b78
          speaker: huck
          text: Tom and I trudged home. I didn't feel nearly so bold anymore. I felt mean and humble and somehow to blame, even though I hadn't done anything. That's always the way with conscience. It makes no difference whether you do right or wrong. A person's conscience has no sense and comes after him anyway. If I owned a yellow dog that knew no more than a conscience does, I'd poison it. Conscience takes up more room than everything else inside a person, and it still isn't any use at all. Tom Sawyer said he thought the same.
