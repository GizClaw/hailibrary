  chapters:
    - id: ch01
      title: CHAPTER XXXVI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: That night, as soon as we figured everybody was asleep, Tom and I climbed down the lightning rod. We shut ourselves inside the lean-to, brought out our pile of fox-fire, and started working. First we cleared a space four or five feet wide along the middle of the bottom log.
        - id: ch01-b02
          speaker: huck
          text: Tom said we were right behind Jim's bed. We would dig under it, and once we broke through, no one in the cabin would ever see the hole. Jim's bedcover hung nearly to the ground, so a person would have to lift it and look underneath.
        - id: ch01-b03
          speaker: huck
          text: We dug with the case-knives until close to midnight. By then we were worn out, our hands were blistered, and you could hardly see that we had done a thing.
        - id: ch01-b04
          speaker: huck
          text: This isn't a thirty-seven-year job, Tom Sawyer. It's a thirty-eight-year job.
        - id: ch01-b05
          speaker: huck
          text: Tom said nothing. He sighed, stopped digging, and thought for a good while. Then he spoke.
        - id: ch01-b06
          speaker: tom
          text: It's no use, Huck. This won't work. If we were prisoners, it would be different. We'd have all the years we wanted and no need to hurry. We might get only a few minutes to dig each day while the guards changed watch. Our hands wouldn't blister, and we could keep at it year after year and do the job properly.
        - id: ch01-b07
          speaker: tom
          text: But we can't take our time. We have to rush, and we don't have a minute to spare. If we spend one more night doing it this way, our hands will need a whole week to heal. We couldn't touch a case-knife any sooner.
        - id: ch01-b08
          speaker: huck
          text: Then what are we going to do, Tom?
        - id: ch01-b09
          speaker: tom
          text: I'll tell you. It isn't right, and it isn't moral, and I wouldn't want anybody to hear about it. But there's only one way. We'll have to dig him out with picks and pretend we're using case-knives.
        - id: ch01-b10
          speaker: huck
          text: Now you're talking! Your head gets more sensible all the time, Tom Sawyer. Picks are what we need, moral or not. I don't care a bit about the morality of it.
        - id: ch01-b11
          speaker: huck
          text: When I set out to steal a Black man, a watermelon, or a Sunday-school book, I don't fuss over how it gets done. I want the man, or the watermelon, or the book. If a pick is the handiest tool, that's what I'll dig with. I don't care what the authorities think about it either.
        - id: ch01-b12
          speaker: tom
          text: Well, in a case like this, there's some excuse for using picks and pretending. Otherwise I wouldn't approve, and I wouldn't stand by while somebody broke the rules. Right is right and wrong is wrong. A person who knows better has no business doing wrong.
        - id: ch01-b13
          speaker: tom
          text: You could dig Jim out with a pick and not pretend, because you don't know any better. I couldn't, because I do. Give me a case-knife.
        - id: ch01-b14
          speaker: huck
          text: His own knife was beside him, but I handed him mine. He threw it down.
        - id: ch01-b15
          speaker: tom
          text: Give me a case-knife.
        - id: ch01-b16
          speaker: huck
          text: For a moment I did not understand. Then I got the idea. I rummaged through the old tools, found a pickaxe, and handed it over. Tom took it and went to work without another word.
        - id: ch01-b17
          speaker: huck
          text: That was Tom all over. He was mighty particular and full of principle.
        - id: ch01-b18
          speaker: huck
          text: I took a shovel, and we traded off picking and shoveling so fast that the dirt flew. We kept going for half an hour, about as long as we could stay on our feet. This time we had a good-sized hole to show for it.
        - id: ch01-b19
          speaker: huck
          text: When I climbed back upstairs, I looked out the window. Tom was trying his very best to climb the lightning rod, but his hands hurt too much. At last he gave up.
        - id: ch01-b20
          speaker: tom
          text: It's no use. I can't do it. What do you reckon I should do? Can't you think of some way?
        - id: ch01-b21
          speaker: huck
          text: I can, but I don't reckon it's regular. Come up the stairs and pretend they're a lightning rod.
        - id: ch01-b22
          speaker: huck
          text: So that was what he did.
        - id: ch01-b23
          speaker: huck
          text: The next day, Tom stole a pewter spoon and a brass candlestick from the house so he could make pens for Jim. He also took six tallow candles. I watched around the cabins until I got a chance to steal three tin plates.
        - id: ch01-b24
          speaker: huck
          text: Tom said three plates would not be enough. I told him no one would ever see the plates Jim threw from the window. They would fall into the dog-fennel and jimson weeds below. We could carry them back and let him use them again. That satisfied Tom.
        - id: ch01-b25
          speaker: tom
          text: Now we have to figure out how to get all these things to Jim.
        - id: ch01-b26
          speaker: huck
          text: We can take them through the hole when it's finished.
        - id: ch01-b27
          speaker: huck
          text: Tom gave me a scornful look and muttered that nobody had ever heard such an idiotic idea. Then he went back to thinking. After a while, he said he had worked out two or three ways, but we did not need to choose yet. First we had to warn Jim.
        - id: ch01-b28
          speaker: huck
          text: A little after ten that night, we climbed down the lightning rod with one of the candles. We listened under Jim's window and heard him snoring, so we tossed the candle inside. It did not wake him.
        - id: ch01-b29
          speaker: huck
          text: Then we went at the wall with the pick and shovel. Two and a half hours later, the hole was finished. We crawled under Jim's bed and into the cabin, felt around until we found the candle, and lit it.
        - id: ch01-b30
          speaker: huck
          text: We stood over Jim for a moment and saw that he looked hearty and healthy. Then we woke him slowly and gently. He was so glad to see us that he nearly cried. He called us honey and every other fond name he could think of.
        - id: ch01-b31
          speaker: jim
          text: Honey, go find a cold chisel. Cut this chain off my leg right now, and let's get away without wasting any time.
          emotion: happy
        - id: ch01-b32
          speaker: huck
          text: But Tom explained how irregular that would be. He sat down and told Jim all about our plans. If there was an alarm, we could change them in a minute. Jim did not need to be afraid, because we would make sure he escaped.
        - id: ch01-b33
          speaker: huck
          text: Jim agreed. We sat there talking about old times for a while. Then Tom started asking questions. Jim told him Uncle Silas came in every day or two to pray with him. Aunt Sally visited too, making sure he was comfortable and had enough to eat. Both of them treated him as kindly as they could.
        - id: ch01-b34
          speaker: tom
          text: Now I know how to manage it. We'll send some things to you through them.
        - id: ch01-b35
          speaker: huck
          text: Don't do anything like that. It's one of the biggest jackass ideas I've ever heard.
        - id: ch01-b36
          speaker: huck
          text: Tom paid no attention. Once his plans were settled, that was his way.
        - id: ch01-b37
          speaker: huck
          text: He told Jim we would have to smuggle the rope-ladder pie and the other large things in through Nat, the man who brought his food. Jim must watch for them, stay quiet, and never let Nat see him open anything.
        - id: ch01-b38
          speaker: huck
          text: The small things would go into Uncle Silas's coat pockets, and Jim would have to steal them out. If we got the chance, we would tie things to Aunt Sally's apron strings or slip them into her apron pocket. Tom told him what every object would be and what he must do with it.
        - id: ch01-b39
          speaker: huck
          text: He also explained how Jim must keep a journal on a shirt, written in his own blood. Tom went through every last part of the plan.
        - id: ch01-b40
          speaker: huck
          text: Jim could not see much sense in most of it. Still, he reckoned we were white and must know better than he did. So he accepted the whole thing and promised to do exactly what Tom said.
        - id: ch01-b41
          speaker: huck
          text: Jim had plenty of corncob pipes and tobacco, and we had a fine sociable visit. Then we crawled back through the hole and went home to bed. Our hands looked as if they had been chewed.
        - id: ch01-b42
          speaker: huck
          text: Tom was in high spirits. He said it was the best fun he had ever had, and the most intellectual too. If he could only find a way, we would keep it going for the rest of our lives and leave Jim for our children to free. He believed Jim would enjoy it more and more once he got used to it.
        - id: ch01-b43
          speaker: huck
          text: Tom said we could stretch the business out for eighty years and make it the longest escape on record. Everyone who had a hand in it would become famous.
        - id: ch01-b44
          speaker: huck
          text: In the morning, we went to the woodpile and chopped the brass candlestick into useful little pieces. Tom put them and the pewter spoon in his pocket. Then we headed for the cabins.
        - id: ch01-b45
          speaker: huck
          text: I drew Nat's attention away while Tom pushed a piece of candlestick into the middle of a cornpone in Jim's pan. Then we went along with Nat to see how our scheme would work.
        - id: ch01-b46
          speaker: huck
          text: It worked beautifully. Jim bit into that cornpone and nearly smashed every tooth in his head. Nothing could have gone better, and Tom himself said so.
        - id: ch01-b47
          speaker: huck
          text: Jim never gave us away. He acted as if he had only found a stone or something else that had got into the bread. After that, though, he never took a bite of anything until he had stabbed it three or four times with his fork.
        - id: ch01-b48
          speaker: huck
          text: While we stood there in the dim light, two hounds came pushing out from under Jim's bed. More followed them, one after another, until eleven dogs crowded the cabin and left hardly enough room to breathe.
        - id: ch01-b49
          speaker: huck
          text: By jings, we had forgotten to fasten the lean-to door! Nat shouted one word.
        - id: ch01-b50
          speaker: nat
          text: It's witches!
          emotion: fearful
        - id: ch01-b51
          speaker: huck
          text: He toppled onto the floor among the dogs and groaned as if he were dying. Tom jerked open the cabin door and threw out a slab of Jim's meat. The dogs chased it.
        - id: ch01-b52
          speaker: huck
          text: Tom dashed out too. Two seconds later he was back, and he shut the door behind him. I knew he had fastened the other door while he was outside.
        - id: ch01-b53
          speaker: huck
          text: Then Tom started coaxing and comforting Nat. He asked whether Nat had only imagined seeing something again. Nat sat up and blinked around the room.
        - id: ch01-b54
          speaker: nat
          text: Mars Sid, you'll call me a fool, but I truly saw nearly a million dogs, or devils, or something. I hope I drop dead right here if I didn't. I felt them, sir. They were crawling all over me.
          emotion: fearful
        - id: ch01-b55
          speaker: nat
          text: I only wish I could get my hands on one of those witches just once. That's all I'd ask. But more than anything, I wish they'd leave me alone.
          emotion: fearful
        - id: ch01-b56
          speaker: tom
          text: I'll tell you what I think. Why do they come here right at this runaway man's breakfast time? They're hungry. That's why. You ought to make them a witch pie.
        - id: ch01-b57
          speaker: nat
          text: But my goodness, Mars Sid, how am I supposed to make a witch pie? I don't know how. I never even heard of such a thing before.
        - id: ch01-b58
          speaker: tom
          text: Then I'll have to make it myself.
        - id: ch01-b59
          speaker: nat
          text: Will you, honey? Will you really? I'll worship the ground under your feet!
          emotion: happy
        - id: ch01-b60
          speaker: tom
          text: All right, I'll do it for you. You've been good to us, and you showed us the runaway man. But you have to be very careful. Whenever we come near, turn your back. Whatever we put in the pan, act as if you never saw it.
        - id: ch01-b61
          speaker: tom
          text: Don't watch when Jim empties the pan either. Something might happen, though I don't know what. Most of all, never touch the witch things.
        - id: ch01-b62
          speaker: nat
          text: Touch them, Mars Sid? What are you saying? I wouldn't put so much as one finger on them, not for ten hundred thousand billion dollars!
          emotion: fearful
