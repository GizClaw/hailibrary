audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
    jim_caretaker:
      display_name: 看守吉姆的黑人
      tts:
        delivery: 老实和气，迷信又容易受惊
        timbre: 成年浑厚
        pace: 稍慢而絮叨
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十六章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 那天夜里，我们估摸人人都睡熟了，就顺着避雷针下去，把自己关进披屋。我们取出那堆发着微光的狐火，再把底层圆木前面正中间四五英尺长的一段全清开。汤姆算准了，这里就在吉姆的床后头。我们从床底下挖进去，洞口就能让几乎垂到地面的床罩遮住。谁不特意掀起床罩往下看，就绝不会发现。
        - id: ch01-b02
          speaker: huck
          text: 我们拿餐刀一直挖到快半夜。两个人累得要命，手上全磨出了泡，可地面看起来几乎没动过。我终于忍不住了。
        - id: ch01-b03
          speaker: huck
          text: 汤姆·索亚，这活儿三十七年可干不完，少说也得三十八年。
        - id: ch01-b04
          speaker: huck
          text: 汤姆没有回答，只叹了口气。过了一会儿，他放下餐刀，闷头想了好一阵。
        - id: ch01-b05
          speaker: tom
          text: 不成，哈克，这个办法确实行不通。要是咱们自己坐牢，时间爱有多少就有多少，那当然不用急。每天趁看守换岗，咱们只有几分钟能挖，手也就不会起泡。这样一年接一年，一直挖下去，事情就能照规矩办，而且办成它本来该有的样子。
        - id: ch01-b06
          speaker: tom
          text: 可咱们等不起，非赶快不可。再这样挖上一夜，手就得养一个星期。养好以前，餐刀碰都碰不了。
        - id: ch01-b07
          speaker: huck
          text: 那咱们怎么办？
        - id: ch01-b08
          speaker: tom
          text: 只剩一个办法了。虽说不正当，也不合道德，我更不想叫别人知道，可咱们只能拿十字镐挖，再假装用的是餐刀。
        - id: ch01-b09
          speaker: huck
          text: 这才像话！汤姆·索亚，你的脑袋越来越清醒了。管它道德不道德，十字镐好用就该用它。我动手去偷一个黑人也好，一个西瓜也好，一本主日学校的课本也好，只管把想要的东西弄到手，从来不挑用什么办法。
        - id: ch01-b10
          speaker: huck
          text: 我要的是黑人，就是黑人。我要的是西瓜，就是西瓜。十字镐要是最顺手，我就用它把黑人、西瓜或者课本挖出来。管事的人爱怎么想就怎么想，我一点也不在乎。
        - id: ch01-b11
          speaker: tom
          text: 这种情形，用十字镐再装成餐刀，倒还有理由。否则我绝不会赞成，更不会眼看着规矩被破坏。对就是对，错就是错。一个人既然懂道理，就不能明知是错还去做。
        - id: ch01-b12
          speaker: tom
          text: 你不懂规矩，所以拿十字镐挖吉姆，又不加掩饰，还勉强说得过去。我却懂，不能那么干。给我一把餐刀。
        - id: ch01-b13
          speaker: huck
          text: 他自己的餐刀就在身边，我还是把我的递了过去。他接过来，马上扔到地上。
        - id: ch01-b14
          speaker: tom
          text: 我要的是一把“餐刀”。
        - id: ch01-b15
          speaker: huck
          text: 我愣了一下才明白，便从旧工具里翻出一把十字镐递给他。汤姆接过去，一句话不说就开了工。他向来这么讲究，满肚子原则。
        - id: ch01-b16
          speaker: huck
          text: 我也拿来铁锹。我们轮流挖土、铲土，泥块四下乱飞。半个钟头以后，两个人都站不住了，可地上总算有了一个像样的洞。
        - id: ch01-b17
          speaker: huck
          text: 我从楼梯回到楼上，再从窗口往外看。汤姆还在拼命爬避雷针，可他的手疼得太厉害，根本爬不上来。
        - id: ch01-b18
          speaker: tom
          text: 这下真不成了。你看我怎么办？就想不出一个法子吗？
        - id: ch01-b19
          speaker: huck
          text: 有倒是有，不过恐怕不合规矩。你从楼梯上来，假装那是避雷针吧。
        - id: ch01-b20
          speaker: huck
          text: 汤姆只好照办。
        - id: ch01-b21
          speaker: huck
          text: 第二天，汤姆从屋里偷了白镴勺、黄铜烛台和六支牛油蜡烛。勺子和烛台要拿来给吉姆做笔。我守在黑人住的小屋附近，等到机会，偷了三只锡盘。
        - id: ch01-b22
          speaker: huck
          text: 汤姆嫌三只不够。我告诉他，吉姆把盘子扔出窗口，它们会落进窗洞下面的狗茴香和曼陀罗草丛，谁也瞧不见。到时候我们再把盘子捡回来，送回去让吉姆反复使用。这才说服了他。
        - id: ch01-b23
          speaker: tom
          text: 现在得想一想，怎么把这些东西送到吉姆手里。
        - id: ch01-b24
          speaker: huck
          text: 洞挖通以后，直接从洞里带进去。
        - id: ch01-b25
          speaker: huck
          text: 汤姆轻蔑地瞧了我一眼，说从没听过这么蠢的主意，然后又低头琢磨起来。过了一会儿，他说自己已经算出两三个办法，只是眼下不用急着选。无论用哪一个，都得先把整个计划告诉吉姆，让他有个准备。
        - id: ch01-b26
          speaker: huck
          text: 那天夜里，十点一过，我们就带着一支蜡烛爬下避雷针。吉姆正在打鼾，我们从窗洞把蜡烛扔进去，也没惊醒他。接着两个人抡起十字镐和铁锹。两个半钟头后，洞终于挖通了。
        - id: ch01-b27
          speaker: huck
          text: 我们从吉姆床底下钻进木屋，在黑暗里摸索一阵，才找到蜡烛。点亮以后，我们站在床边看了看他。吉姆气色很好，身子也结实。我们这才轻轻地、慢慢地把他叫醒。他一见我们，高兴得几乎哭了，宝贝儿长、宝贝儿短，能想到的亲热话全说了出来。
        - id: ch01-b28
          speaker: huck
          text: 吉姆一心想让我们马上找把冷凿，凿断他脚上的链子，半刻也不耽误，立刻逃走。汤姆却先告诉他，这么办太不合规矩，然后坐下来，把我们的安排从头到尾讲了一遍。他还说，一旦听见警报，计划随时都能改。无论出什么事，我们保证会把吉姆救出去，他一点也不用害怕。
        - id: ch01-b29
          speaker: huck
          text: 吉姆这才答应。我们聊了一会儿从前的事，汤姆又问东问西。吉姆告诉他，赛拉斯姨父每隔一两天就来陪他祷告，萨莉姨妈也会来看看他住得舒不舒服，饭够不够吃。他们两个人待吉姆都好极了。
        - id: ch01-b30
          speaker: tom
          text: 这下有办法了。咱们就托他们给你带东西。
        - id: ch01-b31
          speaker: huck
          text: 千万别这么干！我还没听过几个比这更蠢的主意。
        - id: ch01-b32
          speaker: huck
          text: 汤姆根本不听。只要计划定下来，他向来不理别人说什么。
        - id: ch01-b33
          speaker: huck
          text: 他告诉吉姆，绳梯馅饼和别的大件东西，要经由送饭的纳特偷偷带进来。吉姆得随时留神，东西来了也不能吃惊，更不能让纳特看见他拆开。小件东西，我们会塞进姨父的衣袋，让吉姆趁机偷出来。要是有机会，我们还会把东西系在姨妈的围裙带上，或者悄悄放进她的围裙口袋。
        - id: ch01-b34
          speaker: huck
          text: 汤姆一件件说明那些东西是什么，又有什么用，还教吉姆用自己的血在衬衫上记日记，以及其他种种规矩。能想到的，他一样没落下。吉姆听不出大半安排有什么道理，可他觉得我们是白人，总比自己明白，便答应汤姆怎么说，他就怎么做。
        - id: ch01-b35
          speaker: huck
          text: 吉姆那里有的是玉米芯烟斗和烟草。我们三个坐在一起，抽着烟，有说有笑，痛痛快快地聊了好一阵，才从洞里爬出去，回家睡觉。那时我们的两只手看起来，就像给什么东西狠狠嚼过一样。
        - id: ch01-b36
          speaker: huck
          text: 汤姆可兴奋得很。他说这是自己一辈子遇过最好玩、最需要智慧的事情。只要想得出法子，他愿意让这件事一直办到我们老死，再把救吉姆的任务交给我们的孩子。汤姆相信，吉姆在这里待得越久，越习惯这套规矩，自己也会越来越喜欢。
        - id: ch01-b37
          speaker: huck
          text: 照汤姆的算法，这场营救能拖上八十年，创下有史以来最长的纪录。所有插过手的人，也都会因此出名。
        - id: ch01-b38
          speaker: huck
          text: 第二天早晨，我们在柴堆旁把黄铜烛台劈成几小段。汤姆把铜块和白镴勺装进口袋。到了黑人住的小屋，我设法引开纳特的注意，汤姆则把一块烛台塞进吉姆饭盘里的一只玉米饼。
        - id: ch01-b39
          speaker: huck
          text: 我们跟着纳特进去，亲眼看看这办法好不好用。吉姆一口咬下去，牙差点全硌碎。再没有比这更灵的法子了，至少汤姆亲口这么说。吉姆一点异样也没露，只装作面包里又混进了一块常见的小石头。可从那以后，他不论吃什么，都要先拿叉子在上面戳三四回，才敢送进嘴里。
        - id: ch01-b40
          speaker: huck
          text: 我们站在昏暗的屋里，忽然有两条猎狗从吉姆床底下挤了出来。后面的狗一条接一条，最后竟有十一条，挤得屋里连气都快喘不过来。我们这才想起，披屋的门忘了闩！
        - id: ch01-b41
          speaker: huck
          text: 纳特只喊了一声“女巫”，就一头栽进狗群，倒在地板上直哼哼，听起来像是快要死了。汤姆赶紧拉开门，扔出去一大块吉姆的肉。狗全追着肉冲了出去。汤姆也冲出去，两秒钟后又跑回来关上门。我知道，外面那扇门也已经让他闩好了。
        - id: ch01-b42
          speaker: huck
          text: 汤姆转身去哄纳特，问他是不是又凭空瞧见了什么。纳特坐起来，眨巴着眼睛四处看。
        - id: ch01-b43
          speaker: jim_caretaker
          text: 西德少爷，你准会笑我是傻瓜。可我真看见了差不多一百万条狗，也可能是魔鬼，还可能是别的东西。我要说假话，就让我马上死在这里！我看得千真万确。
          emotion: fearful
        - id: ch01-b44
          speaker: jim_caretaker
          text: 西德少爷，我还摸到它们了。真的，先生，我摸到了，它们爬了我一身！该死的，我真想亲手抓住一个女巫，只要一回就够了。可我最盼的，还是它们别再来烦我。
          emotion: fearful
        - id: ch01-b45
          speaker: tom
          text: 我知道它们为什么偏在这个逃跑黑人的早饭时间过来。它们一定是饿了。你得给它们做一个女巫馅饼，这才对。
        - id: ch01-b46
          speaker: jim_caretaker
          text: 老天爷呀，西德少爷，我哪会做女巫馅饼？怎么做我都不知道，从前听也没听过。
          emotion: fearful
        - id: ch01-b47
          speaker: tom
          text: 那就没办法了，只能由我来做。
        - id: ch01-b48
          speaker: jim_caretaker
          text: 宝贝儿，你肯替我做？你真的肯？那我情愿亲吻你脚底踩过的地！
        - id: ch01-b49
          speaker: tom
          text: 好吧，看在你的分上，我来做。你一直待我们不错，还带我们来看这个逃跑的黑人。不过你一定得小心。我们再来的时候，你先转过身。不管我们往饭盘里放了什么，都装作没有看见。
        - id: ch01-b50
          speaker: tom
          text: 吉姆倒空饭盘的时候，你也不能看，说不定会出什么事。还有最要紧的一条，女巫的东西千万碰不得。
        - id: ch01-b51
          speaker: jim_caretaker
          text: 碰它们？西德少爷，你说什么呢？就算给我一万亿亿块钱，我也不拿一根手指碰它们，绝对不碰！
          emotion: fearful
