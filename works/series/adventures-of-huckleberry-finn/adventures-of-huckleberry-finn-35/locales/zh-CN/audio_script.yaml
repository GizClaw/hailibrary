audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三十五章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 离早饭还有将近一个钟头，我们便离开木屋，钻进树林。汤姆说，挖地道总得有点光，好让人看清往哪里挖，可灯笼太亮，会给我们招来麻烦。我们得找那种叫“狐火”的朽木块，它放在暗处，只会发出淡淡的柔光。我们抱回满满一怀，藏进杂草里，然后坐下来歇息。汤姆却不大满意。
        - id: ch01-b02
          speaker: tom
          text: 真该死，这件事处处都简单得要命，也别扭得要命，反而害咱们很难想出一个真正困难的计划。这里没有看守可以下迷药，照理说，本来就该有个看守。连条狗都没有，想给它灌安眠药也不行。吉姆只有一条腿拴在床脚上，链子才十英尺长。只要抬起床架，就能把链子褪下来。赛拉斯姨父谁都相信，钥匙随手交给那个木瓜脑袋的黑人，连个人看住囚犯都不派。吉姆早就能钻出窗洞，只是拖着十英尺长的链子没法赶路。哈克，这是我见过最愚蠢的安排，所有难处都得咱们自己想。没办法，手头有什么，咱们只能用什么。
        - id: ch01-b03
          speaker: tom
          text: 不过，这里面倒有一件好事。那些本该安排难关的人，一样难处也没给咱们留下。咱们只好凭自己的脑袋，把艰难和危险全造出来，再把人救走，这样反而更光彩。就说灯笼吧，真要讲实话，咱们只能假装它很危险。依我看，只要愿意，咱们就算打着火把排成队干活也不会出事。对了，趁我想起来，得赶紧找样东西做锯子。
        - id: ch01-b04
          speaker: huck
          text: 要锯子干什么？
        - id: ch01-b05
          speaker: tom
          text: 还能干什么？咱们得锯断吉姆的床腿，才能弄开链子。
        - id: ch01-b06
          speaker: huck
          text: 可你刚才不是说，抬起床架就能把链子褪下来吗？
        - id: ch01-b07
          speaker: tom
          text: 哈克·费恩，你就会想这种幼儿班小娃娃的办法。难道你什么书都没读过？特伦克男爵、卡萨诺瓦、本韦努托·切利尼、亨利四世，还有那些英雄，你一个也不知道？哪有囚犯用老处女那样窝囊的法子逃走？最有权威的书上全说，先把床腿锯成两截，照原样摆好，再把锯末吞下去，免得叫人发现。锯开的地方还得抹上泥和油，这样连最精明的总管也看不出痕迹，只当床腿好端端的。
        - id: ch01-b08
          speaker: tom
          text: 等到一切准备好的那晚，一脚把床腿踢倒，褪掉链子，人就自由了。接下来，把绳梯挂上城垛，顺着它往下爬。绳梯照例会短十九英尺，所以你会摔断一条腿，掉进护城河。骏马和忠心的封臣就在岸边等着。他们把你捞起来，横着扔上马鞍，大家飞奔回你的故乡朗格多克，或者纳瓦拉，或者随便什么地方。那才气派呢，哈克。真希望这间木屋外面也有护城河。逃跑那晚要是来得及，咱们就挖一条。
        - id: ch01-b09
          speaker: huck
          text: 咱们要从木屋底下把吉姆拖出来，要护城河有什么用？
        - id: ch01-b10
          speaker: huck
          text: 汤姆根本没听见。他已经忘了我，也忘了周围的一切，只管托着下巴想。过了一会儿，他叹口气，摇摇头，又叹了一声。
        - id: ch01-b11
          speaker: tom
          text: 不行，这个办法不成，还没到非这么做不可的地步。
        - id: ch01-b12
          speaker: huck
          text: 什么事没到那一步？
        - id: ch01-b13
          speaker: tom
          text: 锯掉吉姆的腿呀。
        - id: ch01-b14
          speaker: huck
          text: 老天爷！根本没这个必要。你到底为什么要锯他的腿？
        - id: ch01-b15
          speaker: tom
          text: 最有权威的那些人里，有些就是这么干的。他们解不开链子，就砍掉自己一只手，马上逃走。换成腿还更像样。不过这回只能算了，因为没有非做不可的理由。再说，吉姆是个黑人，不会懂得为什么该这样，也不明白这是欧洲的规矩。可是绳梯不能少。咱们撕掉床单，给他做一架，再藏进馅饼里送进去。大家多半都这么做。反正比那更糟的馅饼我也吃过。
        - id: ch01-b16
          speaker: huck
          text: 汤姆·索亚，你这是什么话？吉姆根本用不上绳梯。
        - id: ch01-b17
          speaker: tom
          text: 他当然用得上。你还好意思说我？明明是你什么也不懂。所有囚犯都有绳梯，他也非有一架不可。
        - id: ch01-b18
          speaker: huck
          text: 他拿绳梯到底能干什么？
        - id: ch01-b19
          speaker: tom
          text: 他可以把绳梯藏在床里呀。所有囚犯都这样，他当然也得这样。哈克，你怎么总不肯照规矩办事，老想弄出新花样？哪怕他什么也不拿绳梯做，逃走以后，它还能留在床里当线索。人家当然需要线索。你一条也不给他们留，那成什么样子？我从没听过这种事。
        - id: ch01-b20
          speaker: huck
          text: 好吧，既然规矩上有，他也非要不可，那就给他。我可不想坏了规矩。不过咱们撕床单做绳梯，保准会惹怒萨莉姨妈。依我看，山核桃树皮梯子不花钱，也不糟蹋东西。塞进馅饼也好，藏进草褥子也好，跟布梯子一样管用。吉姆又没有越狱的经验，他才不在乎梯子是用什么做的——
        - id: ch01-b21
          speaker: tom
          text: 得了吧，哈克·费恩。我要是像你这样无知，早就闭嘴了。哪有国家要犯顺着山核桃树皮梯子越狱？简直荒唐透顶。
        - id: ch01-b22
          speaker: huck
          text: 那好，照你的意思办。不过你要肯听我一句，就让我从晾衣绳上借条床单。
        - id: ch01-b23
          speaker: huck
          text: 汤姆同意了，却立刻又想到一件事。
        - id: ch01-b24
          speaker: tom
          text: 再借一件衬衫。
        - id: ch01-b25
          speaker: huck
          text: 衬衫拿来干什么？
        - id: ch01-b26
          speaker: tom
          text: 让吉姆在上面写日记。
        - id: ch01-b27
          speaker: huck
          text: 写你奶奶的日记吧。吉姆根本不会写字。
        - id: ch01-b28
          speaker: tom
          text: 不会写又怎么样？他可以在衬衫上划印子。咱们拿一把旧白镴勺，或者一截旧铁桶箍，给他做支笔。
        - id: ch01-b29
          speaker: huck
          text: 从鹅身上拔根羽毛，做出来的笔不是更好、更快吗？
        - id: ch01-b30
          speaker: tom
          text: 你这笨瓜，地牢主塔里哪有鹅到处乱跑，等着囚犯拔毛？囚犯一定要找最硬、最结实、最难对付的旧黄铜烛台，或者类似的东西做笔。为了磨出一支笔，他们只能贴着墙蹭上好几个星期、好几个月。就算真有鹅毛，他们也不会用，因为不合规矩。
        - id: ch01-b31
          speaker: huck
          text: 那么，墨水拿什么做？
        - id: ch01-b32
          speaker: tom
          text: 好些人用铁锈和眼泪，不过那是普通人和女人的做法。最有权威的人都用自己的血，吉姆也可以。以后他要送出一封最平常的神秘口信，告诉全世界他被关在哪里，就能拿叉子刻在锡盘底下，再扔出窗口。铁面人一直这么干，这法子真不错。
        - id: ch01-b33
          speaker: huck
          text: 吉姆没有锡盘，人家拿盆给他盛饭。
        - id: ch01-b34
          speaker: tom
          text: 那算什么？咱们给他弄几只。
        - id: ch01-b35
          speaker: huck
          text: 可谁也看不懂他在盘子上写的东西。
        - id: ch01-b36
          speaker: tom
          text: 看不看得懂根本没关系。他只要写好，再扔出窗外就够了，又没规定一定得有人读懂。囚犯写在锡盘上或别处的东西，本来就有一半没人看得懂。
        - id: ch01-b37
          speaker: huck
          text: 那又何必白白糟蹋盘子？
        - id: ch01-b38
          speaker: tom
          text: 该死，那又不是囚犯自己的盘子。
        - id: ch01-b39
          speaker: huck
          text: 可总归是别人的盘子，对不对？
        - id: ch01-b40
          speaker: tom
          text: 是别人的又怎么样？囚犯才不管是谁的——
        - id: ch01-b41
          speaker: huck
          text: 早饭号角响起来，打断了汤姆。我们赶紧跑回屋。上午，我从晾衣绳上借来一条床单和一件白衬衫，又找来一只旧口袋，把它们装进去。接着，我们回到林子里取出藏在杂草里的狐火，也塞进袋子。我管这叫借，因为爸爸从来这么叫。汤姆却说这根本不是借，而是偷。
        - id: ch01-b42
          speaker: huck
          text: 按汤姆的说法，我们是在扮演囚犯。囚犯只要能拿到东西，才不管是怎么拿的，别人也不会因此责怪他们。囚犯为了逃走，偷自己需要的东西不算犯罪，那是他们的权利。既然我们代表囚犯，庄园里只要有任何东西能帮我们越狱，我们就完全有权偷走。要不是囚犯，事情就完全不同了。一个人在不是囚犯的时候还去偷东西，那他一定又卑鄙又下贱。于是我们商量好，凡是顺手的东西一概偷走。
        - id: ch01-b43
          speaker: huck
          text: 可后来有一天，我从黑人们的瓜地里偷了个西瓜吃掉，汤姆却大发脾气，还逼我拿一角钱送给他们，又不许说明那钱是为什么给的。他解释说，我们只能偷真正需要的东西。我说，我当时就需要那个西瓜。他却说，逃出监狱用不上西瓜，差别就在这里。要是我想在西瓜里藏把刀，再偷偷送给吉姆，让他拿去杀掉总管，那就完全合乎规矩。
        - id: ch01-b44
          speaker: huck
          text: 我只好把这事算了。可我还是看不出扮演囚犯有什么好处。每回逮着机会想顺走一个西瓜，还得先坐下来，把这些镶着金边的细微讲究一条条嚼个明白，那可实在占不到什么便宜。
        - id: ch01-b45
          speaker: huck
          text: 说回那天上午。我们一直等到人人都安顿下来干活，院子四周也看不见一个人。汤姆提着那只装满东西的口袋走进披屋，我站在稍远一点的地方替他望风。过了一会儿，他从里面出来，我们一起坐到柴堆上商量下一步怎么办。
        - id: ch01-b46
          speaker: tom
          text: 现在样样齐全，只差工具。这个容易。
        - id: ch01-b47
          speaker: huck
          text: 工具？拿来干什么？
        - id: ch01-b48
          speaker: tom
          text: 挖地道呀。咱们总不能一路把木屋啃穿吧？
        - id: ch01-b49
          speaker: huck
          text: 披屋里那些缺口断柄的旧十字镐，还不够把一个黑人挖出来吗？
        - id: ch01-b50
          speaker: huck
          text: 汤姆转过脸来看我，那种怜悯的神情，简直能叫人哭出来。
        - id: ch01-b51
          speaker: tom
          text: 哈克·费恩，你听说过哪个囚犯的衣柜里，摆着十字镐、铁锹和全套新式便利工具，专门让他自己挖地道逃跑吗？你要是还讲得出一点道理，就想想看，那样他还有什么机会当英雄？人家还不如直接把钥匙借给他，事情就结束了。十字镐和铁锹？哼，就算关的是国王，人家也不会给他这些东西。
        - id: ch01-b52
          speaker: huck
          text: 既然不用十字镐和铁锹，那咱们用什么？
        - id: ch01-b53
          speaker: tom
          text: 两把餐刀。
        - id: ch01-b54
          speaker: huck
          text: 拿餐刀挖穿木屋下面的地基？
        - id: ch01-b55
          speaker: tom
          text: 对。
        - id: ch01-b56
          speaker: huck
          text: 见鬼，汤姆，这也太蠢了。
        - id: ch01-b57
          speaker: tom
          text: 蠢不蠢根本不相干。这才是正确的做法，也是合规矩的做法。据我所知，再没有别的法子，这类事情怎么做，我全从书里读过。囚犯向来用餐刀挖出去。你可记住，他们通常挖的还不是泥土，是坚硬的岩石。他们得挖上一个又一个星期，一直没完没了。就说马赛港伊夫堡最底层地牢里的那个囚犯吧，他就是用餐刀挖出去的。你猜他在那里挖了多久？
        - id: ch01-b58
          speaker: huck
          text: 我不知道。
        - id: ch01-b59
          speaker: tom
          text: 猜猜看。
        - id: ch01-b60
          speaker: huck
          text: 不知道。一个半月？
        - id: ch01-b61
          speaker: tom
          text: 整整三十七年，最后从中国钻出来了。这才叫本事。真希望咱们这座堡垒底下也是实心岩石。
        - id: ch01-b62
          speaker: huck
          text: 可吉姆在中国一个人也不认识。
        - id: ch01-b63
          speaker: tom
          text: 那有什么关系？那个囚犯在中国也不认识人。你怎么总往岔路上跑？就不能紧扣正题吗？
        - id: ch01-b64
          speaker: huck
          text: 好吧，只要吉姆能出来，我不管他从哪儿钻出来，吉姆大概也不在乎。不过他年纪太大了，等不起咱们用餐刀把他挖出来。他活不到那一天。
        - id: ch01-b65
          speaker: tom
          text: 他当然活得到。泥土地基难道也要挖三十七年？
        - id: ch01-b66
          speaker: huck
          text: 那要多久？
        - id: ch01-b67
          speaker: tom
          text: 咱们不能真照规矩花那么久。赛拉斯姨父随时可能收到新奥尔良那一带的消息，知道吉姆根本不是从那里来的。接下来，他大概会登广告找人认领吉姆，或者想出别的办法。所以咱们不能冒险，照应有的时日慢慢挖。按规矩，我看怎么也该挖两年，可眼下办不到。事情这么没准，我的主意是，咱们先拼命动手，能挖多快就挖多快。挖通以后，再对自己假装已经挖了三十七年。只要有一点风声，马上把吉姆拖出来，带着他赶紧逃走。对，这就是最好的办法。
        - id: ch01-b68
          speaker: huck
          text: 这话才有道理。假装又不花钱，也不费事。只要这对计划有用，别说三十七年，就算假装挖了一百五十年，我也不在乎。等我装顺手了，一点都不会累着。那么我现在就动身，去给咱们顺两把餐刀来。
        - id: ch01-b69
          speaker: tom
          text: 顺三把，还得拿一把做锯子。
        - id: ch01-b70
          speaker: huck
          text: 汤姆，要是这么说不算破坏规矩，也不算亵渎神明，熏肉房后面有一截生锈的旧锯条，正从外墙板底下露出来。
        - id: ch01-b71
          speaker: huck
          text: 汤姆听完，显得又疲倦又灰心，仿佛已经对我彻底没了办法。他抬起眼睛看着我。
        - id: ch01-b72
          speaker: tom
          text: 哈克，想教会你什么都没用。快去顺餐刀，三把。
        - id: ch01-b73
          speaker: huck
          text: 于是我就照办了。
