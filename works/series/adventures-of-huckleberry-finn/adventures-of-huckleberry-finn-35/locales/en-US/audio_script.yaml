audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: confident and theatrical
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: CHAPTER XXXV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Breakfast was still nearly an hour away, so we headed into the woods. Tom said we needed a little light for digging, but a lantern would shine too bright and might get us caught. What we wanted was fox-fire, the rotten wood that gives off a soft glow in the dark. We gathered an armful, hid it in the weeds, and sat down to rest. Tom did not look satisfied.
        - id: ch01-b02
          speaker: tom
          text: Blame it, Huck, this whole business is as easy and awkward as it could be. That makes planning a proper difficult escape almost impossible. There ought to be a watchman for us to drug, but there isn't one. There isn't even a dog that needs a sleeping mixture. Jim's got one leg chained to his bed with ten feet of chain, and all anybody has to do is lift the bed and slip the chain off. Uncle Silas trusts everybody. He sends Nat in with the key and doesn't send anyone along to guard Jim. Jim could have climbed through that window hole already. The only reason he hasn't is that he couldn't travel anywhere with ten feet of chain dragging behind him.
        - id: ch01-b03
          speaker: tom
          text: It's the stupidest prison arrangement I ever saw. We have to invent every single difficulty ourselves. Still, we'll do the best we can with what we've got. There's more honor in rescuing him through dangers we had to dream up because the people in charge forgot to provide any. That's their duty, but they've left all the hard work to us. Take the lantern. When you look at the plain facts, we only have to pretend it's risky. I believe we could march in there with a whole torchlight parade if we wanted. And that reminds me. The first chance we get, we need to find something we can turn into a saw.
        - id: ch01-b04
          speaker: huck
          text: What do we need a saw for?
        - id: ch01-b05
          speaker: tom
          text: What do you think? We have to saw through the leg of Jim's bed so we can free the chain.
        - id: ch01-b06
          speaker: huck
          text: You just said we could lift the bed and slide the chain off.
        - id: ch01-b07
          speaker: tom
          text: That's just like you, Huck Finn. You always pick the easiest little schoolboy way. Haven't you read about Baron Trenck, Casanova, Benvenuto Cellini, Henry the Fourth, or any other heroes? Nobody ever heard of freeing a prisoner in such an old-maid fashion. Every proper authority says to saw the bed leg nearly through and leave it standing. Then you swallow the sawdust so nobody can find it and rub dirt and grease over the cut. Even the sharpest seneschal won't see a mark. He'll think the bed leg is perfectly sound.
        - id: ch01-b08
          speaker: tom
          text: On the night of the escape, the prisoner gives the bed leg one kick. Down it goes, and off comes the chain. Then he ties his rope ladder to the battlements, climbs down, and breaks his leg in the moat because the ladder is nineteen feet too short. His horses and faithful vassals are waiting below. They scoop him up, throw him across a saddle, and race away to his home in Languedoc or Navarre or wherever it is. That's splendid, Huck. I wish this cabin had a moat. Maybe we can dig one on the night we get Jim out, if there's time.
        - id: ch01-b09
          speaker: huck
          text: Why would we need a moat when we're pulling Jim out from under the cabin?
        - id: ch01-b10
          speaker: huck
          text: Tom did not hear me. He had forgotten I was there. He sat with his chin in his hand, thinking. After a while he sighed, shook his head, and sighed once more.
        - id: ch01-b11
          speaker: tom
          text: No, that won't do. There isn't enough need for it.
        - id: ch01-b12
          speaker: huck
          text: What are you talking about?
        - id: ch01-b13
          speaker: tom
          text: For sawing Jim's leg off.
        - id: ch01-b14
          speaker: huck
          text: Good land! There's no need at all. Why would you want to cut off his leg?
          emotion: surprised
        - id: ch01-b15
          speaker: tom
          text: Some of the best authorities did that sort of thing. When they couldn't remove a chain, they cut off a hand and went on without it. A leg would be better still. But we'll have to give that up. There isn't enough need in this case. Besides, Jim wouldn't understand the reason or know that it's the European custom. A rope ladder will do, though. We can tear up our sheets, make one without much trouble, and send it to him inside a pie. That's how it's usually done, and I've eaten worse pies than that.
        - id: ch01-b16
          speaker: huck
          text: Tom Sawyer, listen to yourself. Jim has no use for a rope ladder.
        - id: ch01-b17
          speaker: tom
          text: Of course he has. You're the one who ought to listen to yourself. You don't know anything about this. Every prisoner has to have a rope ladder.
        - id: ch01-b18
          speaker: huck
          text: What in the world is he supposed to do with it?
        - id: ch01-b19
          speaker: tom
          text: He can hide it in his bed, can't he? That's what every prisoner does, so Jim has to do it too. You never want to follow the regular rules, Huck. You're always trying to start something new. Maybe he never does a thing with the ladder. So what? After he escapes, it'll still be lying in his bed as a clue. The people searching for him will want clues, won't they? Naturally they will. And you wouldn't leave them even one? That would be a fine state of affairs. I never heard of such a thing.
        - id: ch01-b20
          speaker: huck
          text: Well, if the rules say he needs one, he can have it. I don't aim to go against the rules. But listen, Tom Sawyer. If we tear up our sheets, Aunt Sally will surely make trouble for us. A ladder made from hickory bark costs nothing and wastes nothing. It'll fit in a pie and hide in a straw mattress just as well as any rag ladder we could make. Jim has never escaped this way before. He hasn't got any experience, so he won't care what kind of ladder—
        - id: ch01-b21
          speaker: tom
          text: Oh, shucks, Huck Finn. If I knew as little as you do, I'd keep quiet. Whoever heard of a state prisoner escaping on a hickory-bark ladder? It's ridiculous.
        - id: ch01-b22
          speaker: huck
          text: All right, Tom. Have it your way. But take my advice and let me borrow a sheet from the clothesline.
        - id: ch01-b23
          speaker: huck
          text: Tom agreed. Then the sheet put another idea into his head.
        - id: ch01-b24
          speaker: tom
          text: Borrow a shirt too.
        - id: ch01-b25
          speaker: huck
          text: What do we need a shirt for?
        - id: ch01-b26
          speaker: tom
          text: Jim needs it for his journal.
        - id: ch01-b27
          speaker: huck
          text: Journal, your granny. Jim can't write.
        - id: ch01-b28
          speaker: tom
          text: That doesn't matter. He can make marks on the shirt. We'll make him a pen from an old pewter spoon or a piece of iron barrel hoop.
        - id: ch01-b29
          speaker: huck
          text: We could pull a feather from a goose and make a better pen much faster.
        - id: ch01-b30
          speaker: tom
          text: Prisoners don't have geese wandering around the dungeon keep so they can pull out a pen, you muggins. They always choose the hardest, toughest, most troublesome thing they can find, like a piece of an old brass candlestick. Then they spend weeks and weeks, even months and months, filing it down by rubbing it against the wall. They wouldn't use a goose quill even if someone gave them one. It isn't regular.
        - id: ch01-b31
          speaker: huck
          text: Then what will he use for ink?
        - id: ch01-b32
          speaker: tom
          text: Ordinary prisoners and women make ink from iron rust and tears. The best authorities use their own blood. Jim can do that. Then, whenever he wants to send the world some little ordinary mysterious message telling where he's held captive, he can scratch it on the bottom of a tin plate with a fork and throw the plate out the window. The Man in the Iron Mask always did it that way. It's a blame good method too.
        - id: ch01-b33
          speaker: huck
          text: Jim doesn't have tin plates. They feed him from a pan.
        - id: ch01-b34
          speaker: tom
          text: That doesn't matter. We can get him some.
        - id: ch01-b35
          speaker: huck
          text: Nobody could read what he wrote on them.
        - id: ch01-b36
          speaker: tom
          text: That has nothing to do with it. His job is to write on the plate and throw it out. Nobody has to read it. Half the time, you can't make out anything a prisoner writes on a tin plate or anywhere else.
        - id: ch01-b37
          speaker: huck
          text: Then what's the sense in wasting the plates?
        - id: ch01-b38
          speaker: tom
          text: Blame it all, they aren't the prisoner's plates.
        - id: ch01-b39
          speaker: huck
          text: They belong to somebody, don't they?
        - id: ch01-b40
          speaker: tom
          text: Suppose they do. Why should the prisoner care whose—
        - id: ch01-b41
          speaker: huck
          text: The breakfast horn sounded before Tom could finish. We hurried back to the house.
        - id: ch01-b42
          speaker: huck
          text: Later that morning, I borrowed a sheet and a white shirt from the clothesline. I found an old sack, put them inside, and added the fox-fire we'd hidden in the woods. I called it borrowing because that's what Pap always called it. Tom said it was stealing.
        - id: ch01-b43
          speaker: huck
          text: Tom explained that we were representing prisoners, and prisoners did not care how they got a thing as long as they got it. Nobody blamed them for that. Stealing something needed for an escape wasn't a crime for a prisoner. It was his right. Since we were acting for a prisoner, Tom said we had every right to steal anything on the place that might help us get out. If we weren't prisoners, things would be very different. Only a mean, low person would steal when he wasn't a prisoner. So we agreed to steal everything that came handy.
        - id: ch01-b44
          speaker: huck
          text: Yet one day after that, Tom made a terrible fuss when I stole a watermelon from the Black folks' patch and ate it. He made me go back and give them a dime without saying what it was for. Tom said he'd meant we could steal anything we needed for the escape. I told him I needed that watermelon. He said I didn't need it to get out of prison, and that was where the difference lay. If I'd wanted the melon so I could hide a knife inside and smuggle it to Jim for killing the seneschal, then taking it would have been proper.
        - id: ch01-b45
          speaker: huck
          text: I let the matter drop. Still, I couldn't see much benefit in representing a prisoner if every chance to grab a watermelon meant sitting down first and chewing over a whole pile of fine distinctions like those. It seemed like an awful lot of trouble just to decide whether I could take one.
        - id: ch01-b46
          speaker: huck
          text: That morning, we waited until everybody had settled into work and the yard was empty. Tom carried the sack into the lean-to while I stood some distance away and watched for trouble. When he came out, we sat on the woodpile to talk.
        - id: ch01-b47
          speaker: tom
          text: Everything is ready now except the tools, and those will be easy to arrange.
        - id: ch01-b48
          speaker: huck
          text: Did you say tools?
        - id: ch01-b49
          speaker: tom
          text: That's right.
        - id: ch01-b50
          speaker: huck
          text: What are the tools for?
        - id: ch01-b51
          speaker: tom
          text: Digging, of course. We aren't going to gnaw Jim out, are we?
        - id: ch01-b52
          speaker: huck
          text: Aren't those battered old picks and things in the lean-to good enough for digging Jim out?
        - id: ch01-b53
          speaker: huck
          text: Tom turned and gave me such a pitying look that it was enough to make a person cry.
        - id: ch01-b54
          speaker: tom
          text: Huck Finn, did you ever hear of a prisoner finding picks, shovels, and every modern convenience sitting in his wardrobe so he could dig himself free? If you've got any reason in you at all, tell me what sort of chance that would give him to become a hero. They might as well hand him the key and be done with it. Picks and shovels! They wouldn't provide those for a king.
        - id: ch01-b55
          speaker: huck
          text: If we don't want picks and shovels, what do we want?
        - id: ch01-b56
          speaker: tom
          text: We need a couple of case knives.
        - id: ch01-b57
          speaker: huck
          text: You mean to dig under the cabin's foundation with them?
        - id: ch01-b58
          speaker: tom
          text: That's what I mean.
        - id: ch01-b59
          speaker: huck
          text: Confound it, Tom. That's foolish.
        - id: ch01-b60
          speaker: tom
          text: It doesn't matter how foolish it is. It's the right way and the regular way. I've read every book that gives any useful information about these things, and I've never heard of another way. Prisoners always dig out with a case knife. They don't go through dirt, mind you. Usually they have to cut through solid rock, and it takes weeks and weeks, on and on forever. Think of that prisoner in the bottom dungeon of the Castle d'If, out in Marseilles harbor. How long do you suppose he spent digging his way out?
        - id: ch01-b61
          speaker: huck
          text: I couldn't say.
        - id: ch01-b62
          speaker: tom
          text: Take a guess.
        - id: ch01-b63
          speaker: huck
          text: I don't know. Maybe a month and a half.
        - id: ch01-b64
          speaker: tom
          text: Thirty-seven years, and he came out in China. That's how an escape ought to be. I only wish the ground under this fortress was solid rock.
        - id: ch01-b65
          speaker: huck
          text: Jim doesn't know anybody in China.
        - id: ch01-b66
          speaker: tom
          text: What does that have to do with anything? The other fellow didn't know anybody there either. You keep wandering away from the main point. Why can't you stick to it?
        - id: ch01-b67
          speaker: huck
          text: All right. I don't care where Jim comes out, as long as he gets out, and I reckon Jim feels the same. But he's too old to be dug out with a case knife. He won't live long enough.
        - id: ch01-b68
          speaker: tom
          text: Yes, he will. You don't think digging through a dirt foundation will take thirty-seven years, do you?
        - id: ch01-b69
          speaker: huck
          text: How long will it take?
        - id: ch01-b70
          speaker: tom
          text: We can't risk spending as long as we ought to. Uncle Silas may soon hear from the people down near New Orleans that Jim didn't come from there. His next move will be to advertise Jim or do something like that. So we haven't got time for the proper amount of digging. By rights, I reckon it should take us a couple of years, but things are too uncertain. I say we truly dig as fast as we can. Afterward, we can pretend to ourselves that it took thirty-seven years. Then, the first time there's an alarm, we'll snatch Jim out and rush him away. Yes, I reckon that's the best plan.
        - id: ch01-b71
          speaker: huck
          text: Now that makes sense. Pretending costs nothing and takes no work. If it helps the plan, I don't mind pretending we dug for a hundred and fifty years. It won't strain me at all once I get started. I'll mosey along now and steal a couple of case knives.
        - id: ch01-b72
          speaker: tom
          text: Steal three. We need one for the saw.
        - id: ch01-b73
          speaker: huck
          text: Tom, I hope it isn't against the rules or downright sinful to mention this, but there's an old rusty saw blade sticking out from under the boards behind the smokehouse.
        - id: ch01-b74
          speaker: huck
          text: Tom gave me a weary, discouraged look. My suggestion about using a real saw seemed to prove all over again that teaching me the proper way was hopeless.
        - id: ch01-b75
          speaker: tom
          text: There's no use trying to teach you anything, Huck. Go steal the knives. Three of them.
        - id: ch01-b76
          speaker: huck
          text: So I did.
