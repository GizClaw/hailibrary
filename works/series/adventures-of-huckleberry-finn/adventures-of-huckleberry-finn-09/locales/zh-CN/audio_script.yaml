audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
  chapters:
    - id: ch01
      title: 第九章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我先前探岛时，在岛中央附近发现过一个地方，很想带吉姆去看看。小岛只有三英里长、四分之一英里宽，我们没多久便走到了。
        - id: ch01-b02
          speaker: huck
          text: 那是一道四十英尺高的陡峭山脊。坡陡，灌木又密，我们好不容易才爬到上面，又四处找了一阵，终于在朝伊利诺伊州的一面发现一个大岩洞。它就在山顶下方，里面足有两三间屋子合起来那么大。吉姆能站直身子，洞里还凉快得很。
        - id: ch01-b03
          speaker: huck
          text: 吉姆想马上把家什搬进去。我嫌天天爬上爬下太麻烦，他却有自己的道理。
        - id: ch01-b04
          speaker: jim
          text: 把独木舟好好藏起来，再把东西全搬进洞里。要是有人上岛，咱们马上躲进去。他们不带狗，怎么也找不到。再说，那些幼鸟已经告诉咱们要下雨了。你难道想让东西全淋湿吗？
        - id: ch01-b05
          speaker: huck
          text: 我们只好回去取船，划到岩洞正下方，再把全部家什一件件扛上山。独木舟稳稳藏进附近的浓密柳丛。我们从钓线上收下几条鱼，又把鱼线重新放好，开始做午饭。洞口大得能滚进一只大酒桶，旁边正好伸出一小块又平又稳的地面，我们便在那里生火做饭。
        - id: ch01-b06
          speaker: huck
          text: 我们把毯子铺在洞里当作地毯，坐在上面吃完午饭，其余东西全顺手放到洞后面。没过多久，天便暗了，雷电跟着响起来。那些鸟果然没有说错。转眼间，雨像发了狠一样往下砸，风也刮得比我见过的任何一场风都凶。
        - id: ch01-b07
          speaker: huck
          text: 那是地道的夏日暴雨。外面蓝黑蓝黑的，却好看极了。雨密得像一层蛛网，稍远的树全变得模糊。一阵风压弯树身，翻出叶子淡白的背面。下一阵风更猛，枝条像发疯似的挥着胳膊。
        - id: ch01-b08
          speaker: huck
          text: 天地黑到最深时，忽然嚓的一亮，远处几百码外的树梢全在风雨里翻腾。可一眨眼，四周又黑得像罪恶本身。雷声紧跟着炸开，一路隆隆滚向天底下，好像一串空木桶从一架没完没了的楼梯上滚下去，边滚边蹦。
        - id: ch01-b09
          speaker: huck
          text: 吉姆，这儿可真舒服。除了这个洞，我哪儿也不想待。再给我一大块鱼，还有热玉米饼。
          emotion: happy
        - id: ch01-b10
          speaker: jim
          text: 要不是吉姆，你根本不会在洞里。你这会儿正蹲在下面的树林里，没午饭吃，还快叫雨淹透了，准没错，宝贝儿。小鸡知道什么时候下雨，野鸟也知道，孩子。
        - id: ch01-b11
          speaker: huck
          text: 河水一天接一天往上涨，足足涨了十天或十二天，最后漫过河岸。岛上的低地和伊利诺伊州河滩都积了三四英尺深的水。那一边的水面一下铺出去好几英里，密苏里州一边却还是原来的半英里宽，因为岸上立着一道道墙一样的高峭壁。
        - id: ch01-b12
          speaker: huck
          text: 白天，我们划着独木舟在岛上到处转。外面哪怕烈日灼人，密林里还是又阴又凉。我们绕着树干穿行，碰到垂得太密的藤蔓，就倒划出去另找路。每棵倒下的朽木上，都能看见兔子、蛇和各种小东西。洪水困了它们一两天，它们饿得不再怕人，船划到跟前都不躲。要是愿意，我们伸手便能摸到。只有蛇和乌龟会滑进水里。岩洞所在的山脊上也到处都是它们，我们想养多少宠物都行。
        - id: ch01-b13
          speaker: huck
          text: 一天夜里，我们捞到一小截运木排。上好的松木板拼成一片结实平整的地面，有十二英尺宽、十五六英尺长，板面高出水面六七英寸。白天偶尔也能看见锯材原木从旁边漂过，我们却全任它们过去。大白天，我们绝不能露面。
        - id: ch01-b14
          speaker: huck
          text: 又一天夜里，天快亮时，我们正在岛头，看见一幢两层木架房子顺着西面漂来。整幢房子歪得厉害。我们划过去登上房子，从楼上的窗口爬进去。里面还太黑，什么也看不见，只好先把独木舟系牢，坐在屋里等天亮。
        - id: ch01-b15
          speaker: huck
          text: 房子还没漂到岛尾，天光已经从窗外透进来。我们看见一张床、一张桌子和两把旧椅子。地板上散满了东西，墙边也挂着衣裳。远处墙角的地板上躺着一样东西，看上去很像一个人。吉姆朝它喊了一声。
        - id: ch01-b16
          speaker: jim
          text: 喂，你！
        - id: ch01-b17
          speaker: huck
          text: 它一动也不动。我又喊了一遍。
        - id: ch01-b18
          speaker: jim
          text: 那个人不是睡着了，他死了。你留在这里，我过去看看。
        - id: ch01-b19
          speaker: huck
          text: 吉姆走过去，弯腰仔细看了看。
        - id: ch01-b20
          speaker: jim
          text: 真是个死人，身上一件衣服也没有。他背后挨了一枪，大概已经死了两三天。进来吧，哈克，不过别看他的脸，太吓人了。
        - id: ch01-b21
          speaker: huck
          text: 我根本没有朝死人看，也一点都不想看。吉姆还是找来几块旧破布，把那个人盖住。屋里到处扔着油腻的旧纸牌、空威士忌酒瓶和两只黑布做的面具。墙上尽是木炭写的蠢话和画的蠢画。墙边还挂着两条又旧又脏的印花布裙、一顶遮阳女帽、几件女人内衣，也有几件男人衣裳。我们把衣服全搬进独木舟，往后也许用得上。
        - id: ch01-b22
          speaker: huck
          text: 地上有顶男孩戴的旧花斑草帽，我也拿走了。还有一只装过奶的瓶子，瓶口塞着一团破布，原是给婴儿吮着喝奶的。要不是瓶子已经破了，我们也会带走。屋里立着一口破旧的箱子和一只旧毛皮箱。两只都敞着，毛皮箱连铰链都坏了，里面却没剩什么有用的东西。看这满地狼藉的样子，我们猜原先那些人走得太急，根本来不及带走大部分家当。
        - id: ch01-b23
          speaker: huck
          text: 我们又找到一盏旧白铁灯、一把没刀柄的屠刀，还有一把崭新的巴洛折刀。那把折刀拿到任何铺子都值两角五分。我们还收了许多牛油蜡烛、一只白铁烛台、一个葫芦和一只白铁杯。床上那条虫蛀的旧被子，我们也扯了下来。
        - id: ch01-b24
          speaker: huck
          text: 一个女用小手袋里装着针、别针、蜂蜡、纽扣、线和一堆零碎。旁边还有一把斧头、几颗钉子，一根像我小手指那么粗的钓线，线上拴着几只大得吓人的鱼钩。另外还有一卷鹿皮、一只皮狗项圈、一枚马蹄铁和几小瓶没贴标签的药。
        - id: ch01-b25
          speaker: huck
          text: 就在要走时，我捡到一把还过得去的马梳。吉姆找着一根虫蛀的旧琴弓和一条木腿。木腿的带子已经断了，除此之外倒还好，可给我用太长，给吉姆用又太短。我们把四周全翻遍，也没有找到另一条。
        - id: ch01-b26
          speaker: huck
          text: 总的说来，这一趟收获不小。等我们把东西放稳、准备离开，房子已经漂到岛尾下游四分之一英里，天也完全亮了。吉姆要是坐在船上，别人老远就能看出他是个黑人。我便叫他躺进独木舟，用刚拿到的旧被子把自己盖得严实。
        - id: ch01-b27
          speaker: huck
          text: 我朝伊利诺伊州河岸划去，一面划，一面借着水流往下斜漂，走了将近半英里才靠过去。接着，我贴着岸下那片没有水流的静水，悄悄往回划。一路没出任何岔子，也没有碰见一个人。我们平平安安回到了家。
