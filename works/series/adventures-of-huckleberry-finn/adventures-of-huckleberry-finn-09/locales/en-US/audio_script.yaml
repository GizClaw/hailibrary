audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    jim:
      display_name: Jim
      tts:
        delivery: warm and practical
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER IX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: I wanted to show Jim a place I had found near the middle of the island while I was exploring. We set out and soon reached it. The island was only three miles long and a quarter of a mile wide.
        - id: ch01-b02
          speaker: huck
          text: The place was a long, steep ridge about forty feet high. The sides were so sharp and the bushes so thick that reaching the top was hard work. We tramped and climbed all over it. After a while, we found a big cavern in the rock, almost at the top of the side facing Illinois. It was as large as two or three rooms put together. Jim could stand straight up inside, and it was cool there.
        - id: ch01-b03
          speaker: huck
          text: Jim wanted to move our traps into the cavern right away. I said I did not want to keep climbing up and down that hill.
        - id: ch01-b04
          speaker: jim
          text: If we hide the canoe good and keep all our traps up here, we can hurry into the cave if anybody comes to the island. They won't ever find us unless they bring dogs. And those little birds said rain is coming. You want all our things getting wet?
        - id: ch01-b05
          speaker: huck
          text: So we went back for the canoe and paddled until we were even with the cavern. Then we hauled all our traps up the ridge. We found a place nearby where thick willows would hide the canoe. After that, we took fish off our lines, set the lines again, and started getting dinner ready.
        - id: ch01-b06
          speaker: huck
          text: The cavern entrance was wide enough to roll a big barrel through. On one side, the stone floor reached outside and made a flat spot for a fire. We built one there and cooked our dinner.
        - id: ch01-b07
          speaker: huck
          text: We spread the blankets inside like a carpet and ate there. Everything else went within easy reach at the back of the cavern.
        - id: ch01-b08
          speaker: huck
          text: Before long the sky darkened, and thunder and lightning began. The birds had been right. Then the rain came down with all its might, and I had never seen the wind blow so hard. It was a regular summer storm.
        - id: ch01-b09
          speaker: huck
          text: Outside, everything would turn so dark it looked blue-black and beautiful. Rain swept past in such thick sheets that trees a short way off looked dim and covered in spiderwebs. One blast bent the trees and flipped up the pale sides of their leaves. Then a wilder gust came through and tossed the branches around like they had gone crazy.
        - id: ch01-b10
          speaker: huck
          text: Just when the sky got its darkest, fst! Lightning made it bright as glory. For one quick moment, you could see distant treetops plunging in the storm, hundreds of yards beyond where you could see before. A second later it was dark as sin again. Then thunder broke with an awful crash. It went rumbling, grumbling, and tumbling toward the underside of the world, like empty barrels bouncing down a long flight of stairs.
        - id: ch01-b11
          speaker: huck
          text: Jim, this is fine. I wouldn't want to be anywhere but right here. Pass me another hunk of fish and some hot cornbread.
        - id: ch01-b12
          speaker: jim
          text: Well, you wouldn't be here if it wasn't for Jim. You'd be down in those woods with no dinner, getting nearly drowned besides. That's where you'd be, honey. Chickens know when rain is coming, and little birds know too, child.
        - id: ch01-b13
          speaker: huck
          text: The river kept rising for ten or twelve days. At last it spilled over the banks. In the low parts of the island and across the Illinois bottom, the water stood three or four feet deep. It spread for miles on that side. On the Missouri side, the river was still only half a mile across, because that shore rose in a wall of high bluffs.
        - id: ch01-b14
          speaker: huck
          text: In the daytime, we paddled the canoe all over the flooded island. Deep in the woods it stayed cool and shady, even while the sun blazed outside. We wound between the trees. Sometimes the vines were so thick that we had to back out and try another way.
        - id: ch01-b15
          speaker: huck
          text: Rabbits, snakes, and other creatures crowded onto every old fallen tree. After a day or two of flooding, hunger made them so tame that we could paddle close enough to touch them if we wanted. The snakes and turtles would not allow that. They slid straight into the water. The ridge around our cavern was full of animals. We could have had all the pets we wanted.
        - id: ch01-b16
          speaker: huck
          text: One night we caught a small piece of a lumber raft made of fine pine planks. It was twelve feet wide and about fifteen or sixteen feet long. The top stood six or seven inches above the water, solid and level like a floor. We sometimes saw sawlogs floating by in daylight, but we left them alone. We did not show ourselves during the day.
        - id: ch01-b17
          speaker: huck
          text: Another night, just before daylight, we were near the head of the island when a frame house came floating down the west side. It had two stories and leaned over quite a bit. We paddled out, climbed aboard through an upstairs window, tied the canoe fast, and sat inside. It was still too dark to see, so we waited for daylight.
        - id: ch01-b18
          speaker: huck
          text: Morning light began to show before the house reached the foot of the island. We looked through the window and made out a bed, a table, two old chairs, and all kinds of things scattered across the floor. Clothes hung against the wall. In the far corner, something lay on the floor that looked like a man.
        - id: ch01-b19
          speaker: jim
          text: Hello, there!
        - id: ch01-b20
          speaker: huck
          text: The man did not move. I called out once more.
        - id: ch01-b21
          speaker: jim
          text: That man ain't sleeping. He's dead. You stay where you are. I'll go take a look.
        - id: ch01-b22
          speaker: huck
          text: Jim went over, bent down, and looked at him.
        - id: ch01-b23
          speaker: jim
          text: Yes, he's dead, sure enough. He's naked too, and somebody shot him in the back. I reckon he's been dead two or three days. You can come in, Huck, but don't look at his face. It's too awful.
        - id: ch01-b24
          speaker: huck
          text: I did not look at the man at all. Jim covered him with some old rags, though he did not need to do it for me. I had no wish to see him.
        - id: ch01-b25
          speaker: huck
          text: Old greasy playing cards and empty whisky bottles covered the floor. There were two masks made of black cloth. The walls were marked with the most ignorant words and charcoal pictures you ever saw.
        - id: ch01-b26
          speaker: huck
          text: Hanging on the wall were two dirty calico dresses, a sunbonnet, some women's underclothes, and men's clothes too. We loaded all of it into the canoe. It might be useful. I also picked up an old speckled straw hat that had belonged to a boy.
        - id: ch01-b27
          speaker: huck
          text: We found a broken bottle that had once held milk. A rag in its neck had served as something for a baby to suck. We would have taken it if it had not been broken. A worn-out chest and an old hair-covered trunk stood open with their hinges broken, but nothing worthwhile was left inside. From the way everything lay scattered around, we reckoned the people had fled in a hurry and could not take most of their belongings.
        - id: ch01-b28
          speaker: huck
          text: We took an old tin lantern and a butcher knife with no handle. We found a brand-new Barlow knife worth twenty-five cents in any store, a pile of tallow candles, a tin candlestick, a gourd, and a tin cup. We pulled a ragged old quilt off the bed. A small bag held needles, pins, beeswax, buttons, thread, and things like that.
        - id: ch01-b29
          speaker: huck
          text: There was more. We found a hatchet and some nails, a fishing line as thick as my little finger with enormous hooks, a roll of buckskin, a leather dog collar, and a horseshoe. We took several bottles of medicine with no labels on them.
        - id: ch01-b30
          speaker: huck
          text: Just as we were leaving, I found a fairly good currycomb. Jim found a ragged old fiddle bow and a wooden leg. The straps had broken off, but otherwise the leg was good enough. It was too long for me and too short for Jim. We searched everywhere for the other leg but never found it.
        - id: ch01-b31
          speaker: huck
          text: All in all, we made a good haul. By the time we were ready to push off, the house had drifted a quarter mile below the island, and broad daylight had come.
        - id: ch01-b32
          speaker: huck
          text: I made Jim lie down in the canoe and cover himself with the quilt. If he sat up, people could tell from far away that he was Black. I paddled toward the Illinois shore, letting the current carry us nearly half a mile downstream while I crossed. Then I slipped into the still water under the bank. Nothing went wrong, and I saw nobody. We made it home safely.
