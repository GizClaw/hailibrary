audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    mary_jane:
      display_name: 玛丽·简·威尔克斯
      tts:
        delivery: 热诚坦荡，下定决心时坚定果断
        timbre: 年轻清亮
        pace: 舒缓自然
        pitch: 中高
    susan:
      display_name: 苏珊·威尔克斯
      tts:
        delivery: 温柔真挚，容易动情
        timbre: 年轻柔和
        pace: 舒缓
        pitch: 中
    joanna:
      display_name: 乔安娜·威尔克斯
      tts:
        delivery: 率真热切，反应明快
        timbre: 年少轻快
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 客房与晚餐
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 等客人全走了，国王问玛丽·简还有没有空房。她说只剩一间，正好给威廉叔叔。自己的屋子大一点，可以让哈维叔叔住，她就搬去跟两个妹妹挤一间，睡帆布床。阁楼上还有个小隔间，铺着草褥子。国王说，那里正合适给他的贴身仆人住，也就是我。
        - id: ch01-b02
          speaker: huck
          text: 玛丽·简带我们上楼，把各人的房间指给我们看。屋子都很朴素，却收拾得不错。她怕自己的衣裙和那些零碎物件碍着哈维叔叔，便说可以叫人全搬出去。国王回答，一件也不用动。这些摆设让房间更舒服，更像个家。那些衣裙沿墙挂着，前面垂着一道印花布帘，一直落到地板。一个屋角放着旧马鬃箱，另一个屋角搁着吉他盒，四下还有姑娘家用来装点房间的各种小玩意儿。公爵的房间和我的小隔间都不大，可也完全够住了。
        - id: ch01-b03
          speaker: huck
          text: 晚上，家里摆了一大桌好菜。白天那些男女都来了。我站在国王和公爵的椅子后面伺候，其他客人由黑奴照料。玛丽·简坐在桌子上首，苏珊挨着她。饭菜明明样样都好，她偏说饼干烤坏了，果酱做差了，炸鸡又老又硬。女人总爱在饭桌上这样挑自己的毛病，好逼客人开口夸奖。
        - id: ch01-b04
          speaker: huck
          text: 客人们也很懂这一套，马上夸她的饼干颜色漂亮，又问她从哪儿弄来这么好吃的酸黄瓜。饭桌上常听见的那些客套话，他们一句也没落下。
        - id: ch01-b05
          speaker: huck
          text: 大伙吃完，我和乔安娜到厨房吃桌上剩下的东西，其余几个姑娘则帮着黑奴收拾餐具。乔安娜一边吃，一边不停盘问我英国的事。她的问题一个接一个，有好几次，我都觉得脚下那层冰已经薄得快要裂开了。
    - id: ch02
      title: 乔安娜盘问英国来客
      blocks:
        - id: ch02-b01
          speaker: joanna
          text: 你见过国王吗？
        - id: ch02-b02
          speaker: huck
          text: 你说威廉四世？我当然见过。他还总到我们教堂做礼拜呢。
        - id: ch02-b03
          speaker: huck
          text: 我明知道威廉四世早死了好些年，却装作什么也不知道。
        - id: ch02-b04
          speaker: joanna
          text: 他常去吗？
        - id: ch02-b05
          speaker: huck
          text: 常去。他的座位就在我们家对面，隔着讲坛。
        - id: ch02-b06
          speaker: joanna
          text: 可国王不是住在伦敦吗？你又说自己住在谢菲尔德。
        - id: ch02-b07
          speaker: huck
          text: 我一下被问住了，只好假装让鸡骨头卡着，好给自己争取一点儿时间。等想出说法，我告诉她，国王夏天会到谢菲尔德洗海水浴，那时才去我们教堂。
        - id: ch02-b08
          speaker: joanna
          text: 你说什么呀？谢菲尔德根本不靠海。
        - id: ch02-b09
          speaker: huck
          text: 谁说谢菲尔德靠海了？你说是我说的，可我根本没讲过这种话。我只说国王到那里洗海水浴。
        - id: ch02-b10
          speaker: joanna
          text: 你明明说了。他要是不在海边，又怎么洗海水浴？
        - id: ch02-b11
          speaker: huck
          text: 你见过国会泉水吧？可你非得跑到国会去，才能弄到国会泉水吗？当然不用。同样，威廉四世也不必亲自跑到海边。海水可以装在木桶里，一桶桶运到谢菲尔德。王宫里有炉子，他又只肯用热水，正好可以在那里烧。海边可没有那些设备，烧不开他洗澡要用的那么多水。
        - id: ch02-b12
          speaker: joanna
          text: 原来是这么回事。你早点说明白，不就省时间了吗。
        - id: ch02-b13
          speaker: huck
          text: 她这么一说，我知道自己又闯过了一关，心里马上舒坦了。可她的问题还没完。
        - id: ch02-b14
          speaker: joanna
          text: 你也常去教堂吗？坐在哪儿？
        - id: ch02-b15
          speaker: huck
          text: 当然常去。我坐在我们家的座位，也就是你哈维叔叔家的座位。
        - id: ch02-b16
          speaker: joanna
          text: 哈维叔叔要座位干什么？我还以为牧师应该站在讲坛上呢。
        - id: ch02-b17
          speaker: huck
          text: 真该死，我把老头是牧师这回事给忘了。我只好再演一次鸡骨头卡喉咙。随后，我问她难道以为每座教堂只能有一个牧师。给国王讲道的教堂，至少也得有十七个。
        - id: ch02-b18
          speaker: joanna
          text: 十七个！哪怕永远上不了天堂，我也不愿坐在那里听完这么长一串牧师。那得讲整整一个星期吧！
          emotion: surprised
        - id: ch02-b19
          speaker: huck
          text: 十七个人又不是同一天全讲，每回只上去一个。其余的就在教堂里闲晃荡，传传奉献盘，再随手做点这个那个。不过说到底，他们大多数时候什么也不干。教堂养着这么多人，主要就是为了摆排场。
        - id: ch02-b20
          speaker: joanna
          text: 这种傻事，我一点儿也不想懂。英国人怎么对仆人？会比我们对黑奴好一点吗？他们也有圣诞节、新年那一周，还有七月四日的假吗？
        - id: ch02-b21
          speaker: huck
          text: 一听这话，谁都知道你没去过英国。乔安娜，那里的仆人根本不算人，主人待他们连狗都不如。从年头到年尾，他们连一天假也见不着。马戏不能看，戏院不能去，黑人歌舞戏也轮不到他们，反正哪里都去不了，连教堂也不许进。
        - id: ch02-b22
          speaker: joanna
          text: 可你不是总去教堂吗？
        - id: ch02-b23
          speaker: huck
          text: 我这才记起自己扮的是老头的仆人，又给问住了。我赶紧编了一套，说贴身仆人跟普通仆人完全不同。不管本人愿不愿意，法律都规定他必须陪主人一家去教堂，还得跟主人坐在一起。可这回我解释得很不漂亮，前后也不怎么圆得上。等我说完，她脸上的神情明明白白，还是一个字也不信。
        - id: ch02-b24
          speaker: joanna
          text: 你凭良心说，刚才是不是一直拿谎话骗我？
        - id: ch02-b25
          speaker: huck
          text: 凭良心说，没有。我连半句假话也没讲。
        - id: ch02-b26
          speaker: joanna
          text: 那你把手按在这本书上，再说一遍。
        - id: ch02-b27
          speaker: huck
          text: 我一看，那不过是本字典，便把手放上去，又发了一遍誓。
        - id: ch02-b28
          speaker: joanna
          text: 好吧，我可以信一部分。可老天作证，其余的我一个字也不信。
    - id: ch03
      title: 三个好姑娘
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 玛丽·简走了进来，苏珊跟在她身后。她听见乔安娜的话，立刻替我说话。
        - id: ch03-b02
          speaker: mary_jane
          text: 乔，你不信什么？他离家这么远，又是我们家的客人。你这样跟他说话，既不对，也不厚道。要是别人这么对你，你会好受吗？
        - id: ch03-b03
          speaker: joanna
          text: 玛丽，你总是别人还没受委屈，就冲上去帮忙。我根本没把他怎么样。他说的话有些夸张，我只说自己不会全信。就这么一点儿事，他总不至于受不了吧？
        - id: ch03-b04
          speaker: mary_jane
          text: 话大话小都一样。他住在我们家，是我们的客人，你这么说就是不应该。换成你，听了也会觉得羞愧。既然如此，你就不该拿这种话去叫别人难堪。
        - id: ch03-b05
          speaker: joanna
          text: 可是，姐姐，他刚才说……
        - id: ch03-b06
          speaker: mary_jane
          text: 他说了什么并不重要。你应该好好待他，别再提醒他自己远离家乡，亲人也不在身边。
        - id: ch03-b07
          speaker: huck
          text: 我在心里骂自己。玛丽·简是这么好的姑娘，我却由着那条老毒蛇抢她的钱。接着苏珊也加入进来。你要肯信我的话，她真把乔安娜训得像是坟墓都开口骂人了。我又想，苏珊也是个好姑娘，我竟也眼看着那老家伙抢她的钱。
        - id: ch03-b08
          speaker: huck
          text: 最后，玛丽·简又温温柔柔地劝了起来。她一向就是这个样子。可等她说完，可怜的乔安娜已经挨训挨得几乎什么也不剩，终于放声哭了。
        - id: ch03-b09
          speakers: [mary_jane, susan]
          ensemble: duo
          text: 好啦，你只要向他赔个不是就行。
        - id: ch03-b10
          speaker: huck
          text: 乔安娜真的向我道了歉，而且赔得漂亮极了。那番话听着实在叫人舒服。我甚至恨不得再对她撒上一千个谎，只为了让她重新向我道一次歉。
        - id: ch03-b11
          speaker: huck
          text: 我又想，乔安娜同样是个好姑娘，我却看着骗子抢她的钱。道歉以后，姐妹三个都一心照顾我，想让我在她们家里觉得自在，也让我明白自己正待在朋友中间。她们越是对我好，我越觉得自己卑鄙、下作、不是东西。最后，我终于拿定了主意。哪怕豁出命，哪怕事情办不成，我也非得替她们把那笔钱弄回来不可。
        - id: ch03-b12
          speaker: huck
          text: 我说自己要去睡觉，便溜了出去。至于什么时候真睡，那是另一回事。独自待着时，我把所有办法从头到尾想了一遍。悄悄去找医生，揭穿那两个骗子，不行。医生也许会说出消息是谁给的，到时候国王和公爵一定叫我吃不了兜着走。私下告诉玛丽·简，也不行。她的脸藏不住秘密，准会让骗子看出不对。他们手里握着钱，一见风头不妙，马上就会带钱逃跑。她若找来帮手，我也免不了在事情结束以前被卷进去。
        - id: ch03-b13
          speaker: huck
          text: 只剩一个法子，我得亲手把钱偷出来，还要偷得叫他们怎么也怀疑不到我头上。他们眼下不会主动离开。这一家和整座镇子还有油水可榨，两个骗子不把能拿的全拿走，绝不肯罢休，所以我总能等到机会。钱到手以后，我先把它藏好。等我坐木筏顺河漂得很远了，再写封信告诉玛丽·简藏钱的地方。不过，最好还是当晚就动手。医生未必真的像表面上那样罢休，也许他还会回来，硬把两个骗子吓跑。
    - id: ch04
      title: 帘后的秘密
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 我决定先摸黑上楼，搜一搜他们的房间。起初去了公爵那间，伸手四处乱摸。可我马上想到，国王那种人，绝不会放心让别人替他看管钱。我便改去国王的房里继续找。没有蜡烛，什么也摸不到，偏偏蜡烛又绝对不能点。看来只剩另一个办法，我得守在这里等他们回来，再偷听他们说话。
        - id: ch04-b02
          speaker: huck
          text: 脚步声正好从楼下传来。我本想钻到床底，可伸手没摸着床，反倒碰到了遮住玛丽·简衣裙的布帘。我赶紧躲到后面，挤在衣裙中间，贴墙站着，一动也不敢动。
        - id: ch04-b03
          speaker: huck
          text: 两个人进屋以后，随手关上了门。公爵做的第一件事，就是弯腰趴下，仔细查看床底。我顿时庆幸自己刚才伸手时没有摸到那张床。不过想想也不奇怪，人在做着见不得人的事时，总会本能地觉得床底是个藏身的好地方。等公爵检查完，两个人才坐下来，国王先开了口。
        - id: ch04-b04
          speaker: king
          text: 到底什么事？说短些。咱们应该待在楼下，把他们的丧事闹得更热乎一点。躲在这里，只会给他们机会议论咱们。
        - id: ch04-b05
          speaker: duke
          text: 是这样，卡佩。我心里不踏实，也不舒服。那个医生一直压在我心头。我想知道你有什么打算。我自己倒有个主意，觉得很稳妥。
        - id: ch04-b06
          speaker: king
          text: 什么主意？
        - id: ch04-b07
          speaker: duke
          text: 凌晨三点以前，咱们悄悄溜走，带着到手的东西沿河下去。钱来得这么容易，人家竟又送回咱们手里，简直是朝咱们头上扔。原先还以为得把它偷回来呢。依我看，现在收手，赶紧走。
        - id: ch04-b08
          speaker: huck
          text: 这话让我心里一下难受起来，还觉得非常失望。若是早一两个钟头听见他们要走，我的心情会完全不同。可现在，我已经答应自己要替三个姑娘把钱夺回来。国王听完公爵的主意，立刻破口大骂。
        - id: ch04-b09
          speaker: king
          text: 什么！剩下的产业不卖了？咱们要像一群傻瓜一样走掉，把八九千美元的财产白白丢下？那些可全是能卖钱的好东西，就等着咱们去拿！
          emotion: angry
        - id: ch04-b10
          speaker: huck
          text: 公爵嘟囔说，一袋金币已经足够。他不愿陷得更深，更不愿把几个孤儿的全部家当都抢走。
        - id: ch04-b11
          speaker: king
          text: 咱们除了这袋钱，根本不会抢走她们任何东西。真正倒霉的是买下产业的人。等咱们一走，别人很快会发现那些东西不归咱们，买卖自然作废，产业还得退回遗产里。几个孤儿照样能拿回房子，对她们来说也就够了。她们年轻又有力气，养活自己轻轻松松。世上还有成千上万的人比她们穷苦得多。老天，她们根本没有什么好抱怨的。
        - id: ch04-b12
          speaker: huck
          text: 国王说得公爵晕头转向。公爵终于让步，却仍说医生在一旁盯着，这时候留下实在太蠢。
        - id: ch04-b13
          speaker: king
          text: 让医生见鬼去！咱们怕他干什么？镇上的傻瓜全在咱们这边。不管在哪座镇子，这还不算压倒多数吗？
        - id: ch04-b14
          speaker: huck
          text: 两个人准备下楼时，公爵忽然说，钱藏得不够安全。我一下又有了精神。本来我还怕听不到半点儿线索。
        - id: ch04-b15
          speaker: duke
          text: 玛丽·简要开始服丧了。说不定她会叫收拾屋子的黑奴把这些衣服装箱。你以为一个黑奴碰上钱，会一点儿也不借吗？
        - id: ch04-b16
          speaker: king
          text: 公爵，你的脑袋又灵光了。
        - id: ch04-b17
          speaker: huck
          text: 国王说着，便弯腰摸索那道帘子，离我只有两三英尺。我拼命贴住墙壁，一动不动，身上却控制不住地发抖。我一面猜，两个家伙要是逮住我，会对我做些什么，一面拼命想被抓以后该怎么脱身。可我连半个主意都没想出来，国王已经拿到了钱袋。他自始至终都没怀疑我就在旁边。
        - id: ch04-b18
          speaker: huck
          text: 两人掀开羽毛褥子，把钱袋从一道破口塞进下面的草垫，又往稻草深处足足推了一两英尺。他们觉得这样就稳妥了。收拾房间的黑奴平时只整理上面的羽毛褥子，一年顶多翻动两次草垫。照他们的想法，这笔钱现在绝不可能被谁偷走。
        - id: ch04-b19
          speaker: huck
          text: 可我比他们清楚。他们还没走完一半楼梯，我已经从草垫里掏出了钱袋。我一路摸回阁楼的小隔间，先把它藏在那里，等有机会再找更好的地方。我很清楚，一旦发现钱丢了，他们准会把整座房子翻个底朝天。所以只要有机会，我还得把钱转移到屋外藏起来。
        - id: ch04-b20
          speaker: huck
          text: 我连衣服也没脱，就这样躺了下来。我急得满身是汗，一心只想赶紧把事情办完，就算真想睡也绝不可能睡着。过了一会儿，我听见国王和公爵沿楼梯上来了。我立刻从草褥子上滚下来，趴到小隔间的梯子口，把下巴搁在梯子顶端，屏住气等着，看他们发现钱不见了没有，看会不会出什么事。可一切安安静静，什么也没发生。
        - id: ch04-b21
          speaker: huck
          text: 我一直熬到深夜最后的声响全停了，清晨最早的声音还没有出现，整座房子静悄悄的，这才悄悄溜下梯子。
