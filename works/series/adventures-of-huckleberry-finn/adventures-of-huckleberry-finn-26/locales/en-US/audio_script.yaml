  chapters:
    - id: ch01
      title: CHAPTER XXVI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Once everybody had gone, the king asked Mary Jane about spare rooms. She had one for Uncle William. Uncle Harvey could take her room, which was a little bigger, and she would sleep on a cot with her sisters. There was also a tiny space in the garret with a pallet. The king said that would do for his valet, meaning me.
        - id: ch01-b02
          speaker: huck
          text: Mary Jane led us upstairs. The rooms were plain, but pleasant. She offered to move her dresses and other things out of Uncle Harvey's room if they bothered him.
        - id: ch01-b03
          speaker: king
          text: Don't move a thing. All these little touches make the room feel more like home.
        - id: ch01-b04
          speaker: huck
          text: Her dresses hung along the wall behind a calico curtain that reached the floor. An old hair trunk stood in one corner, a guitar case in another, and the room was full of little ornaments and odds and ends. Those were the things girls used to brighten up a room. The king liked them, so Mary Jane left everything where it was. The duke's room was small but good enough, and so was my place in the garret.
        - id: ch01-b05
          speaker: huck
          text: That night, they served a big supper with all the men and women there. I waited behind the king and duke, while the enslaved servants waited on everybody else. Mary Jane sat at the head of the table with Susan beside her. She complained that the biscuits were bad, the preserves were poor, and the fried chickens were tough. It was the sort of talk people use when they want their guests to praise the food.
        - id: ch01-b06
          speaker: guest_1
          text: Everything is wonderful. How do you get your biscuits so beautifully brown?
        - id: ch01-b07
          speaker: guest_2
          text: And where in the world did you find these amazing pickles?
        - id: ch01-b08
          speaker: huck
          text: They went on like that through supper, saying everything was first-rate. It was the usual foolish supper talk, and everybody knew it. Afterward, Joanna and I ate the leftovers in the kitchen. The others stayed behind to help the enslaved servants clear everything away. Joanna had a split lip, and people called her Harelip, though her name was Joanna. She began pumping me for answers about England. More than once, I felt as if the ice under me was getting mighty thin.
        - id: ch01-b09
          speaker: joanna
          text: Did you ever see the king?
        - id: ch01-b10
          speaker: huck
          text: Who, William the Fourth? Of course I have. He goes to our church.
        - id: ch01-b11
          speaker: huck
          text: I knew he had been dead for years, but I did not let that show.
        - id: ch01-b12
          speaker: joanna
          text: Does he go regularly?
        - id: ch01-b13
          speaker: huck
          text: Yes, all the time. His pew is across from ours, on the other side of the pulpit.
        - id: ch01-b14
          speaker: joanna
          text: I thought he lived in London.
        - id: ch01-b15
          speaker: huck
          text: He does. Where else would he live?
        - id: ch01-b16
          speaker: joanna
          text: But I thought you lived in Sheffield.
        - id: ch01-b17
          speaker: huck
          text: She had me trapped. I pretended to choke on a chicken bone so I could think of a way out. Then an answer came to me.
        - id: ch01-b18
          speaker: huck
          text: I mean he attends our church whenever he's in Sheffield. He only comes in summer, to take the sea baths.
        - id: ch01-b19
          speaker: joanna
          text: What are you talking about? Sheffield isn't by the sea.
        - id: ch01-b20
          speaker: huck
          text: I never said it was.
        - id: ch01-b21
          speaker: joanna
          text: Yes, you did!
        - id: ch01-b22
          speaker: huck
          text: No, I didn't.
        - id: ch01-b23
          speaker: joanna
          text: You did.
        - id: ch01-b24
          speaker: huck
          text: I never said anything like that.
        - id: ch01-b25
          speaker: joanna
          text: Then what did you say?
        - id: ch01-b26
          speaker: huck
          text: I said he came for sea baths. That's what I said.
        - id: ch01-b27
          speaker: joanna
          text: How can he take sea baths if Sheffield isn't on the sea?
        - id: ch01-b28
          speaker: huck
          text: Have you ever seen Congress water?
        - id: ch01-b29
          speaker: joanna
          text: Yes, I have.
        - id: ch01-b30
          speaker: huck
          text: Did you have to travel to Congress to get it?
        - id: ch01-b31
          speaker: joanna
          text: Why, no.
        - id: ch01-b32
          speaker: huck
          text: Well, William the Fourth doesn't need to visit the sea for a sea bath either.
        - id: ch01-b33
          speaker: joanna
          text: Then how does he get one?
        - id: ch01-b34
          speaker: huck
          text: The same way people here get Congress water. It comes in barrels. They have furnaces at the palace in Sheffield because he likes the water hot. They couldn't boil that much water at the seaside. They don't have the equipment.
        - id: ch01-b35
          speaker: joanna
          text: Oh, now I understand. You could have explained that first and saved us both some time.
        - id: ch01-b36
          speaker: huck
          text: I knew I was out of trouble again, and I felt easy. Then she moved on to something else.
        - id: ch01-b37
          speaker: joanna
          text: Do you go to church too?
        - id: ch01-b38
          speaker: huck
          text: Yes, regularly.
        - id: ch01-b39
          speaker: joanna
          text: Where do you sit?
        - id: ch01-b40
          speaker: huck
          text: In our pew.
        - id: ch01-b41
          speaker: joanna
          text: Whose pew do you mean?
        - id: ch01-b42
          speaker: huck
          text: Ours. Your Uncle Harvey's.
        - id: ch01-b43
          speaker: joanna
          text: His? Why would he need a pew?
        - id: ch01-b44
          speaker: huck
          text: To sit in. What else did you think he wanted it for?
        - id: ch01-b45
          speaker: joanna
          text: I thought he'd be standing in the pulpit.
        - id: ch01-b46
          speaker: huck
          text: I had forgotten that he was supposed to be a preacher. I choked on another chicken bone and bought myself more time to think.
        - id: ch01-b47
          speaker: huck
          text: Do you think a church only has one preacher?
        - id: ch01-b48
          speaker: joanna
          text: Why would it need any more?
        - id: ch01-b49
          speaker: huck
          text: For preaching before a king, of course. They always have at least seventeen.
        - id: ch01-b50
          speaker: joanna
          text: Seventeen! My goodness, I wouldn't sit through a line of preachers that long, even if it meant I never reached heaven. It must take them a week.
          emotion: surprised
        - id: ch01-b51
          speaker: huck
          text: They don't all preach on the same day. Only one of them does.
        - id: ch01-b52
          speaker: joanna
          text: Then what do all the others do?
        - id: ch01-b53
          speaker: huck
          text: Not much. They lounge around, pass the collection plate, and do one thing or another. Mostly, they do nothing.
        - id: ch01-b54
          speaker: joanna
          text: Then what are they for?
        - id: ch01-b55
          speaker: huck
          text: They're there for style. Don't you know anything?
        - id: ch01-b56
          speaker: joanna
          text: I don't want to know foolishness like that. How do people in England treat their servants? Are they treated better than enslaved people are here?
        - id: ch01-b57
          speaker: huck
          text: No! A servant counts for nothing over there. They treat servants worse than dogs.
        - id: ch01-b58
          speaker: joanna
          text: Don't they get holidays like ours do? Christmas, New Year's week, and the Fourth of July?
        - id: ch01-b59
          speaker: huck
          text: Listen to you! Anyone could tell you've never been to England. Why, Harel—Joanna, they never get a holiday all year. They never go to the circus, the theater, a minstrel show, or anywhere else.
        - id: ch01-b60
          speaker: joanna
          text: Not even church?
        - id: ch01-b61
          speaker: huck
          text: Not even church.
        - id: ch01-b62
          speaker: joanna
          text: But you said you always went to church.
        - id: ch01-b63
          speaker: huck
          text: I was trapped again. I had forgotten that I was supposed to be the old man's servant. I quickly made up an explanation about a valet being different from an ordinary servant. A valet had to attend church whether he wanted to or not. He also had to sit with the family, because that was the law. I did not explain it very well, and when I finished, I could see that Joanna still was not satisfied.
        - id: ch01-b64
          speaker: joanna
          text: Tell me honestly. Haven't you been feeding me a pack of lies?
        - id: ch01-b65
          speaker: huck
          text: Honest, I haven't.
        - id: ch01-b66
          speaker: joanna
          text: Not one lie in any of it?
        - id: ch01-b67
          speaker: huck
          text: Not one. Every bit of it is true.
        - id: ch01-b68
          speaker: joanna
          text: Put your hand on this book and swear to it.
        - id: ch01-b69
          speaker: huck
          text: I saw that the book was only a dictionary, so I put my hand on it and swore. She seemed a little more satisfied.
        - id: ch01-b70
          speaker: joanna
          text: All right, then. I'll believe some of your story, but there's no chance I'll believe the rest.
        - id: ch01-b71
          speaker: huck
          text: Mary Jane came in with Susan behind her.
        - id: ch01-b72
          speaker: mary_jane
          text: What won't you believe, Jo? It isn't right or kind to speak to him that way. He's a stranger, far from his own people. How would you feel if someone treated you like that?
        - id: ch01-b73
          speaker: joanna
          text: That's just like you, Maim. You always rush in to help somebody before they're even hurt. I haven't done anything to him. I reckon he told me some tall tales, and I only said I wouldn't swallow all of them. That's every last thing I said. He can stand that much, can't he?
        - id: ch01-b74
          speaker: mary_jane
          text: I don't care if it was a little thing or a big one. He's a stranger in our home, and it wasn't good of you to say it. You'd feel ashamed if you were in his place. You mustn't say things that make somebody else feel ashamed.
        - id: ch01-b75
          speaker: joanna
          text: But Maim, he said—
        - id: ch01-b76
          speaker: mary_jane
          text: It doesn't matter what he said. That's not the point. You need to treat him kindly. Don't say things that remind him he's far from his own country and his own people.
        - id: ch01-b77
          speaker: huck
          text: I thought to myself, this is the girl I'm letting that old reptile rob of her money.
        - id: ch01-b78
          speaker: huck
          text: Then Susan joined in and gave Joanna such a scolding that it sounded like a voice from the tomb.
        - id: ch01-b79
          speaker: huck
          text: Susan's scolding was so severe that it sounded like a voice from the tomb.
        - id: ch01-b80
          speaker: huck
          text: I thought, there's another girl I'm letting him rob. Then Mary Jane took her turn again. She spoke sweetly and gently, because that was her way. But by the time she finished, there was hardly anything left of poor Joanna. Joanna began to cry.
        - id: ch01-b81
          speakers: [mary_jane, susan]
          ensemble: duo
          text: All right, Jo. Just ask his pardon.
        - id: ch01-b82
          speaker: huck
          text: Joanna did ask my pardon, and she did it beautifully. It was so good to hear that I wished I could tell her a thousand more lies, just so she could do it again.
        - id: ch01-b83
          speaker: huck
          text: Then I thought, here's another girl I'm letting him rob. After that, all three sisters did everything they could to make me feel at home among friends.
        - id: ch01-b84
          speaker: huck
          text: Their kindness left me feeling low and mean.
        - id: ch01-b85
          speaker: huck
          text: I felt so low and mean that I made up my mind. I would get that money back for them or die trying.
        - id: ch01-b86
          speaker: huck
          text: I left, saying I was going to bed, though I only meant to go sometime later. Once I was alone, I thought the whole thing over. I could secretly tell the doctor about the frauds, but that would not work. He might say who had warned him, and then the king and duke would make things hot for me. I did not dare tell Mary Jane either. Her face would surely give the secret away. The men already had the money, and they would slip off with it. If she brought in help, I judged I would get tangled in the whole business before it ended.
        - id: ch01-b87
          speaker: huck
          text: There was only one way. I had to steal the money without making them suspect me. They had a profitable trick going and would stay until they had squeezed everything they could from the family and the town, so I would get a chance. I could hide the money, travel far downriver, and write Mary Jane a letter telling her where it was. Still, I needed to take it that night if possible. The doctor might not have given up, and he could scare them away.
        - id: ch01-b88
          speaker: huck
          text: I decided to search their rooms. The upstairs hall was dark, but I found the duke's room and began feeling around with my hands. Then I remembered what the king was like. He would never let anybody but himself look after that money. I moved to his room and searched there instead. Without a candle, I could do nothing useful, and of course I did not dare light one. That left one choice. I would hide nearby, wait for them, and listen.
        - id: ch01-b89
          speaker: huck
          text: Just then, I heard their footsteps. I reached for the bed so I could hide under it, but it was not where I expected. My hand touched the curtain over Mary Jane's dresses instead. I slipped behind it, pressed myself among the gowns, and stood perfectly still.
        - id: ch01-b90
          speaker: huck
          text: The king and duke came in and closed the door. The duke immediately bent down and looked under the bed. I was glad I had missed it. Hiding there does seem natural when you're doing something secret. They sat down, and the king spoke.
        - id: ch01-b91
          speaker: king
          text: Well, what is it? Keep it fairly short. We'd better be downstairs stirring up the mourning instead of staying up here and giving them time to talk us over.
        - id: ch01-b92
          speaker: duke
          text: Here's the trouble, Capet. I don't feel easy. That doctor worries me, and I want to know your plan. I've got an idea, and I think it's a good one.
        - id: ch01-b93
          speaker: king
          text: What is it, Duke?
        - id: ch01-b94
          speaker: duke
          text: We should slip away before three in the morning and head downriver with what we have. We got the money so easily. They handed it back and practically threw it at us, when we'd expected to steal it back. I say we stop now and clear out.
        - id: ch01-b95
          speaker: huck
          text: That made me feel badly disappointed. An hour or two earlier, I would have felt differently. The king burst out at him.
        - id: ch01-b96
          speaker: king
          text: What? Leave without selling the rest of the property? We'd look like fools, walking away from eight or nine thousand dollars' worth of perfectly good property just waiting to be taken!
          emotion: angry
        - id: ch01-b97
          speaker: huck
          text: The duke grumbled that the bag of gold was enough. He did not want to go any deeper or rob the orphans of everything they owned.
        - id: ch01-b98
          speaker: king
          text: We're not taking anything from them but this money. The people who buy the property will be the ones who suffer. Once they learn we never owned it, the sale won't count, and everything will return to the estate. The girls will get their house back, and that's enough. They're young and healthy. They can earn a living easily. Thousands of people have far less than they do, so they have nothing to complain about.
        - id: ch01-b99
          speaker: huck
          text: The king talked until the duke gave in. The duke agreed to stay, though he still called it foolish with the doctor hanging over them.
        - id: ch01-b100
          speaker: king
          text: Curse the doctor! Why should we care about him? Every fool in town is on our side. In any town, isn't that a large enough majority?
        - id: ch01-b101
          speaker: huck
          text: They got ready to go downstairs again, but the duke stopped.
        - id: ch01-b102
          speaker: duke
          text: I don't think we hid that money in a safe place.
        - id: ch01-b103
          speaker: huck
          text: That cheered me up. I had begun to fear they would give me no clue at all.
        - id: ch01-b104
          speaker: king
          text: Why isn't it safe?
        - id: ch01-b105
          speaker: duke
          text: Mary Jane will be wearing mourning clothes now. Before long, the servant who cleans the rooms may be told to pack these dresses away. If an enslaved man finds that money, do you think he won't borrow some?
        - id: ch01-b106
          speaker: king
          text: You're thinking straight again, Duke.
        - id: ch01-b107
          speaker: huck
          text: The king came over and began feeling under the curtain, only two or three feet from me. I pressed myself tight against the wall and kept mighty still, though I was trembling. I wondered what those two would say if they caught me. At the same time, I tried to decide what I should do if that happened. Before I got through even half a thought, the king found the bag. He never suspected I was there.
        - id: ch01-b108
          speaker: huck
          text: They pushed the bag through a tear in the straw mattress beneath the feather bed. Then they forced it a foot or two deep among the straw. That place suited them. A servant would straighten the feather bed, they said, but the straw mattress underneath only got turned about twice a year. They were certain the money could not be stolen from there.
        - id: ch01-b109
          speaker: huck
          text: I knew better. Before they were halfway downstairs, I had the bag out of the mattress. I felt my way back to my cubby and hid it there until I could find a better place. I figured the money needed to go somewhere outside the house. If they discovered it missing, they would give the whole house a thorough search. I knew that very well, and I did not want them finding it with me.
        - id: ch01-b110
          speaker: huck
          text: I lay down in all my clothes, but I was too worked up to sleep. After a while, I heard the king and duke come upstairs. I rolled off my pallet and waited with my chin at the top of the ladder to see if anything happened. Nothing did.
        - id: ch01-b111
          speaker: huck
          text: I waited until the last sounds of night had stopped and the first sounds of morning had not begun. Then I slipped down the ladder.
