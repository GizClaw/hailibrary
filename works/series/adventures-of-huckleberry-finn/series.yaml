cover_prompt: |-
  A wordless cover scene on the Mississippi River in the mid-nineteenth century shows a rough timber raft drifting past a wooded shore beneath a wide dawn sky. A barefoot white boy of about thirteen wears patched trousers, a loose shirt, and a battered straw hat, while beside him stands a tall middle-aged Black man in a plain worn shirt and trousers. The boy leans forward to guide the raft with a long steering sweep as his companion watches the bright bend ahead, making their shared river journey the focal action. A small canvas shelter, a fishing line, and bundled supplies sit on the raft, with distant river mist and a far-off steamboat establishing the period and place. Use a wide, low viewpoint near water level, keep both figures clearly silhouetted, and leave calm open sky across the upper third. Keep the scene warm, adventurous, child-friendly, historically grounded, and wholly independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
