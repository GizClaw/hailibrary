audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
  chapters:
    - id: ch01
      title: 第十五章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我们算着，再过三个晚上就能到开罗。那里在伊利诺伊州最南头，俄亥俄河正好汇进来。那就是我们的目的地。到了以后，我们卖掉木筏，坐蒸汽船沿俄亥俄河往上游走，进入自由州，从此便能摆脱麻烦。
        - id: ch01-b02
          speaker: huck
          text: 第二天夜里，河上起了雾。雾里不能赶路，我们就朝一个沙洲划去，想把筏子系住。我坐小划子先过去，手里带着缆绳，可岸边只有几棵细树苗，根本没别的东西可系。我把绳子绕在削壁边的一棵树苗上，急流却推着木筏轰隆隆地冲下来，一下把树连根拔起。木筏就这么漂走了。
        - id: ch01-b03
          speaker: huck
          text: 浓雾从四面压过来，我又怕又难受，足足愣了大半分钟。再一看，木筏早没影了，二十码外什么都瞧不见。我跳进小划子，赶到船尾，抓起桨往后一拨，船却不动。原来我慌得忘了解绳。我连忙站起来，可两手抖得厉害，连绳子都解不开。
        - id: ch01-b04
          speaker: huck
          text: 好容易脱了身，我便沿着沙洲拼命往下游追。开头那一段还算顺当，可整个沙洲还不到六十码长。刚刚冲过洲尾，我便一头扎进白茫茫、密不透风的浓雾，完全不知道自己正往哪儿去，跟死人也没什么两样。
        - id: ch01-b05
          speaker: huck
          text: 我心想，不能再划了，不然随时会撞上河岸、沙洲或别的什么东西。我只能坐着不动，任船漂流。可偏偏在这种时候还要把双手按住，真叫人心焦。我大喊一声，又竖起耳朵听着。远处不知什么地方也轻轻回了一声。我顿时来了精神，循声猛追。
        - id: ch01-b06
          speaker: huck
          text: 第二声传来时，我发现自己没有朝它去，反而偏到了它右边。第三声响起，我又偏到了左边，而且一点没追近。我忽左忽右地乱转，那个声音却始终径直朝前走。我真希望那个傻瓜能想起来敲只铁皮锅，而且不停地敲。偏偏他从头到尾都没想到。两声呼喊之间那段死寂，最让我为难。
        - id: ch01-b07
          speaker: huck
          text: 我苦苦追了一阵，忽然听见呼声到了身后。这下我彻底糊涂了。要么那是另一个人在喊，要么是我自己转了方向。我索性丢下桨，听它到底从哪儿来。呼声还在身后，却不停地换地方。我也一声声回应。过了一会儿，它竟又回到了前头。
        - id: ch01-b08
          speaker: huck
          text: 我这才知道，水流已经把船头转向下游。只要那是吉姆，不是别的筏工，方向就没错。可雾里听不清人的嗓音。那里看什么、听什么，都不像平常。
        - id: ch01-b09
          speaker: huck
          text: 我们继续一声声喊着。大约过了一分钟，我猛冲到一道削壁前。岸上的大树像一群烟雾缭绕的鬼。急流把小划子甩向左边，擦着岸推过去，又把它送进一大片枯树桩之间。水从那些树桩旁飞奔而过，吼得震耳欲聋。
        - id: ch01-b10
          speaker: huck
          text: 不过一两秒钟，四周又变得一片雪白，悄无声息。我坐在那里一动也不敢动，只听见自己的心怦怦直跳。我想，哪怕它已经跳了一百下，我也没有喘过一口气。
        - id: ch01-b11
          speaker: huck
          text: 这下我彻底不抱希望了，也终于明白怎么回事。刚才那道削壁属于一座大岛，吉姆一定从岛的另一边漂走了。这不是十分钟就能漂过去的小沙洲。岛上长着真正大岛才有的参天树林，兴许足有五六英里长、半英里还不止那么宽。
        - id: ch01-b12
          speaker: huck
          text: 我竖着耳朵，安静地等了大约一刻钟。小船当然一直在随水漂流，每小时总有四五英里，可人在船上根本不会想到这一点。你只觉得自己死死停在水面上。偶尔有一截枯树桩从眼前滑过，你也不会想自己漂得多快，反倒会倒抽一口气，觉得那树桩冲得真快。
        - id: ch01-b13
          speaker: huck
          text: 要是你不信，深夜独自困在浓雾里有多阴森、多孤单，就亲自试一回。到时候你自然会明白。
        - id: ch01-b14
          speaker: huck
          text: 接下来的半个钟头，我不时喊上一声。终于，远处又传来回应。我想循着声音追，却怎么也追不到。很快，我猜自己闯进了一群沙洲里，因为两边不时闪过灰蒙蒙的洲影。有时两座沙洲间只剩一条窄水道。有些沙洲我看不见，可水流拍击岸边枯枝和杂物的声音，会告诉我它们就在那里。
        - id: ch01-b15
          speaker: huck
          text: 没多久，我又听丢了呼声，也没再追多久。那比追鬼火还糟糕。你绝想不到，一个声音竟能这样四处躲闪，一眨眼就换了地方。
        - id: ch01-b16
          speaker: huck
          text: 有四五次，我都得拼命划离岸边，才没一头撞上那些岛。我想，木筏也一定时不时撞上河岸。不然它本来比我的小船漂得稍快，早该越漂越远，跑到我听不见的地方了。
        - id: ch01-b17
          speaker: huck
          text: 后来，我好像又回到了宽阔的河面，可哪里都听不见半点回应。我猜吉姆也许撞上了枯树桩，这下什么都完了。我实在累得要命，索性躺在小划子里，不再折腾。当然，我并不想睡，只打算眯一小会儿，可实在困得撑不住。
        - id: ch01-b18
          speaker: huck
          text: 那一觉大概远不止打了个盹。醒来时，星星亮晶晶的，雾已经散得干干净净。小划子船尾朝前，正飞快漂过一个大河湾。起初我不知道自己在哪里，还以为在做梦。等先前的事慢慢回到脑子里，它们却模模糊糊的，倒像是上星期发生的。
        - id: ch01-b19
          speaker: huck
          text: 这里的河面宽得吓人，两岸最高、最密的树连成了两堵墙，借着星光一直望不到头。我朝下游远远望去，水上有个黑点。我追到跟前，才发现是两根捆在一起的锯木。接着我又追了一个黑点，再追第三个。这一次终于找对了。那就是木筏。
        - id: ch01-b20
          speaker: huck
          text: 吉姆坐在那里睡着了，脑袋垂在两膝之间，右胳膊搭过掌舵的长桨。另一支桨已经折断，木筏上到处都是树叶、断枝和泥土。只消看上一眼，就知道它这一路也吃尽了苦头。
        - id: ch01-b21
          speaker: huck
          text: 我系好小划子，躺到吉姆鼻子底下，打着哈欠，伸开拳头舒展身子。
        - id: ch01-b22
          speaker: huck
          text: 嘿，吉姆，我刚才睡着了吗？你怎么不推醒我？
        - id: ch01-b23
          speaker: jim
          text: 我的老天爷，是你吗，哈克？你没死，也没淹死？你真的回来了？这好得简直不像真的，宝贝儿。让我看看你，让我摸摸你。你没死！你平平安安地回来了，还是原来的哈克。谢天谢地！
          emotion: happy
        - id: ch01-b24
          speaker: huck
          text: 你这是怎么了，吉姆？喝酒啦？
        - id: ch01-b25
          speaker: jim
          text: 喝酒？我哪儿有机会喝酒？
        - id: ch01-b26
          speaker: huck
          text: 那你怎么说起话来疯疯癫癫的？
        - id: ch01-b27
          speaker: jim
          text: 我怎么疯疯癫癫了？
        - id: ch01-b28
          speaker: huck
          text: 你一直说我回来了，还说了那么多别的，好像我离开过一样。
        - id: ch01-b29
          speaker: jim
          text: 哈克，哈克·费恩，你看着我的眼睛。你难道没有离开过？
        - id: ch01-b30
          speaker: huck
          text: 离开？你到底在说什么？我哪儿也没去。我能上哪儿去？
        - id: ch01-b31
          speaker: jim
          text: 老板，这里准有哪儿不对。那我还是我吗？不是我，又是谁？我是在这儿吗？要不我到底在哪儿？我现在就想弄明白。
        - id: ch01-b32
          speaker: huck
          text: 你明明就在这儿。不过我看，你是个脑子搅成一团的老傻瓜。
        - id: ch01-b33
          speaker: jim
          text: 我是老傻瓜？那你告诉我，你不是坐小划子带着缆绳，去沙洲上系木筏了吗？
        - id: ch01-b34
          speaker: huck
          text: 没有。什么沙洲？我根本没见过。
        - id: ch01-b35
          speaker: jim
          text: 你没见过？缆绳不是松了吗？木筏不是一下漂走，把你和小划子丢在雾里了吗？
        - id: ch01-b36
          speaker: huck
          text: 什么雾？
        - id: ch01-b37
          speaker: jim
          text: 就是围了咱们整整一夜的那场雾！你喊过，我也喊过。后来咱们在岛群里绕糊涂了，一个人迷路，另一个也差不多，因为他连自己在哪儿都不知道。我还接连撞上那些岛，吃尽了苦头，差点淹死。事情不就是这样吗，老板？你回答我。
        - id: ch01-b38
          speaker: huck
          text: 吉姆，你可把我弄糊涂了。我没见过雾、岛，也没碰上麻烦。咱们整夜都坐在这儿说话。大约十分钟前你睡着了，我想我也睡着了。这么一会儿你不可能喝醉，所以你一定是在做梦。
        - id: ch01-b39
          speaker: jim
          text: 真见鬼，我怎么能在十分钟里梦见那么多事？
        - id: ch01-b40
          speaker: huck
          text: 可那就是梦，因为那些事根本没发生。
        - id: ch01-b41
          speaker: jim
          text: 但是哈克，那些事在我心里清楚得就像……
        - id: ch01-b42
          speaker: huck
          text: 再清楚也没用。那全是假的。我一直在这里，所以我知道。
        - id: ch01-b43
          speaker: huck
          text: 吉姆沉默了大约五分钟，只顾坐着琢磨。后来他终于开口了。
        - id: ch01-b44
          speaker: jim
          text: 那么，我想我真的做梦了，哈克。不过我要是见过比这更厉害的梦，就叫猫来抓我。我这辈子没有哪场梦，能把我累成这样。
        - id: ch01-b45
          speaker: huck
          text: 做梦有时候确实很累。不过你这个梦真了不得。快从头到尾讲给我听。
        - id: ch01-b46
          speaker: huck
          text: 于是吉姆从头到尾讲起了整件事。每一段经过都跟实际发生的一样，只是被他添油加醋，说得更厉害了不少。讲完以后，他又说，这场梦一定是特意来警告我们的，所以非得从头好好解一解不可。
        - id: ch01-b47
          speaker: jim
          text: 第一个沙洲，代表一个想要帮助咱们的人。那股水流则是另一个人，他会把咱们从好人身边带走。那些远远传来的呼声，是一次次送给咱们的警告。咱们要是不使劲把警告的意思弄明白，它们不但不能让咱们躲开厄运，反而会把咱们领进厄运里。
        - id: ch01-b48
          speaker: jim
          text: 那一大片沙洲，就是咱们以后会碰上的种种麻烦。那里有爱争吵的人，也有各种各样的坏家伙。可只要咱们管好自己的事，不跟他们顶嘴，也不去招惹他们，咱们就能闯过去，走出浓雾，进入宽阔清澈的大河。那条大河代表自由州。到了那里，咱们以后再也不会有麻烦。
        - id: ch01-b49
          speaker: huck
          text: 我刚回到木筏时，云层压得很低，天色黑沉沉的。这时候，云却一点点散开，天又慢慢放晴了。
        - id: ch01-b50
          speaker: huck
          text: 好吧，吉姆，前面的意思你都解得不错。可这些东西又代表什么？
        - id: ch01-b51
          speaker: huck
          text: 我指着筏子上的树叶和杂物，还有那支断桨。现在，它们看得清清楚楚。
        - id: ch01-b52
          speaker: huck
          text: 吉姆先看看那堆垃圾，又看看我，然后回头再看垃圾。那个梦在他脑子里扎得太牢，一时怎么也摆脱不了，没法把真正发生的事重新放回原位。等他终于把一切理清楚，便一动不动地盯着我，脸上一点笑意也没有。
        - id: ch01-b53
          speaker: jim
          text: 它们代表什么？我告诉你。我累得一点力气都没了，还在不停地喊你。后来我睡着了。那时我以为你丢了，心都快碎了。至于我和木筏会怎么样，我一点也不在乎。
          emotion: sad
        - id: ch01-b54
          speaker: jim
          text: 等我醒来，看见你平平安安地回来，我眼泪都流了。我感激得恨不得跪下来亲你的脚。可你心里只想着怎么撒谎，把老吉姆当傻瓜耍。
          emotion: sad
        - id: ch01-b55
          speaker: jim
          text: 那边那些东西是垃圾。往朋友头上撒泥，让朋友受羞辱的人，也一样是垃圾。
        - id: ch01-b56
          speaker: huck
          text: 说完这些，吉姆慢慢站起来，走进棚屋，再没有多说一句。可他说的那些已经完全够了。我羞愧得要命，几乎恨不得真的去亲他的脚，只求他把刚才那番话收回去。
        - id: ch01-b57
          speaker: huck
          text: 我足足花了一刻钟，才鼓起勇气去向一个黑人低头认错。不过我还是去了，而且后来从没后悔。我再也没对吉姆耍过卑鄙的把戏。要是早知道这场恶作剧会让他那样难受，这一次我也绝不会做。
