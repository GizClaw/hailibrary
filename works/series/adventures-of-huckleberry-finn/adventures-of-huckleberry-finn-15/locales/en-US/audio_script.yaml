audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    jim:
      display_name: Jim
      tts:
        delivery: wary and expressive
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: We figured three more nights would take us to Cairo, down at the bottom of Illinois where the Ohio River joins the Mississippi. That was where we wanted to go. We could sell the raft there, take a steamboat far up the Ohio into the free states, and be out of trouble.
        - id: ch01-b02
          speaker: huck
          text: On the second night, fog began rolling in. We headed for a towhead so we could tie up, because running the river in fog was no good. I paddled ahead in the canoe with the line, but there were only little saplings to fasten it to. I looped the line around one at the edge of the cut bank. The current was strong, though. The raft came booming down, tore the sapling out by its roots, and swept away.
        - id: ch01-b03
          speaker: huck
          text: The fog was closing around me. I felt so sick and scared that I could not move for what seemed like half a minute. Then the raft was gone. I could not see twenty yards. I jumped into the canoe, scrambled to the stern, grabbed the paddle, and tried to back away. The canoe did not move. In my hurry, I had forgotten to untie it. I stood up and fumbled with the knot, but my hands were shaking so badly that I could hardly work it loose.
        - id: ch01-b04
          speaker: huck
          text: The moment I got free, I chased after the raft as hard as I could, straight along the towhead. That worked until I passed its lower end, and the whole thing was not even sixty yards long. Then I shot into solid white fog. I had no more notion which way I was going than a dead man would.
        - id: ch01-b05
          speaker: huck
          text: I told myself not to paddle. If I kept on, I might smash into a bank or another towhead. I had to sit still and let the canoe float. But holding your hands quiet at a time like that makes you mighty restless. I gave a whoop and listened. Somewhere far downriver, a small whoop answered, and my spirits jumped right up.
        - id: ch01-b06
          speaker: huck
          text: I tore after the sound and listened hard for another call. When it came again, I found I was heading too far to its right. At the next whoop, I was off to its left. I was not gaining much either. I kept flying first one way and then another, while the sound went straight ahead all the time.
        - id: ch01-b07
          speaker: huck
          text: I wished the fool would think to bang on a tin pan and keep banging. Those silent spaces between the whoops were what caused all my trouble. I fought along until suddenly the call came from behind me. Now I was tangled for certain. Either that was somebody else, or I had turned clear around.
        - id: ch01-b08
          speaker: huck
          text: I dropped the paddle. The whoop came again from behind me, only now it sounded like it was in a different place. It kept calling and shifting around, and I kept answering. After a while, it moved in front of me again. Then I knew the current had swung the canoe to face downstream. If that was Jim calling, and not some other raftsman, I was headed right. In fog, though, no voice sounds natural, and nothing looks natural either.
        - id: ch01-b09
          speaker: huck
          text: The calling went on. About a minute later, the current carried me booming toward a cut bank. Big trees stood on it like smoky ghosts. The water flung me off to the left and shot me past a pack of snags. They fairly roared, because the current was tearing through them so fast.
        - id: ch01-b10
          speaker: huck
          text: A second or two later, everything was white and still again. I sat without moving and listened to my heart pound. I reckon it beat a hundred times before I took another breath.
        - id: ch01-b11
          speaker: huck
          text: Then I gave up. I understood what had happened. That cut bank belonged to an island, and Jim had floated down the other side. This was not some little towhead that took ten minutes to pass. It had the tall trees of a proper island. It might be five or six miles long and more than half a mile across.
        - id: ch01-b12
          speaker: huck
          text: For about fifteen minutes, I kept quiet with my ears ready for any sound. The canoe must have been drifting four or five miles an hour, but it never feels that way. You feel as if you are lying dead still on the water. If you catch a quick glimpse of a snag sliding by, you do not think how fast you are moving. You suck in your breath and think how fast that snag is tearing along. If you doubt that a foggy river can feel dismal and lonely at night, try it by yourself sometime. Then you will know.
        - id: ch01-b13
          speaker: huck
          text: For the next half hour, I whooped now and then. At last an answer came from far away. I tried to follow it, but I could not. Soon I figured I had drifted into a whole nest of towheads. I caught dim glimpses of them on both sides, sometimes with only a narrow channel between. Other islands stayed hidden, but I knew they were there when I heard the current washing against dead brush and rubbish hanging over their banks.
        - id: ch01-b14
          speaker: huck
          text: Down among those towheads, I soon lost the whoops. I did not chase them for long, because it was worse than following a jack-o'-lantern. I never knew a sound could dodge around and change places so quickly.
        - id: ch01-b15
          speaker: huck
          text: Four or five times, I had to paddle away from a bank in a hurry to keep from knocking an island clean out of the river. I figured the raft must be bumping into banks too. Otherwise it would have pulled farther ahead and passed beyond my hearing, since it floated a little faster than the canoe.
        - id: ch01-b16
          speaker: huck
          text: After a while, I seemed to reach the open river again, but now I could not hear a single whoop. Maybe Jim had caught on a snag, I thought, and it was all over with him. I was worn out, so I lay down in the canoe and decided not to struggle anymore. I did not mean to sleep. I was so drowsy that I could not help it, though, and I told myself I would take one little catnap.
        - id: ch01-b17
          speaker: huck
          text: It must have been more than a catnap. When I woke, the stars shone bright, the fog was gone, and the canoe was spinning stern first around a great bend. At first I had no idea where I was. It seemed like a dream. When my memory returned, everything came back dimly, as if it had happened the week before.
        - id: ch01-b18
          speaker: huck
          text: The river was enormous there. On both banks, the tallest, thickest timber made a solid wall under the stars. Far downstream, I spotted a black speck on the water and went after it. It turned out to be two sawlogs fastened together. Then I saw another speck and chased that one, and then another. The third time, I was right. It was the raft.
        - id: ch01-b19
          speaker: huck
          text: Jim sat asleep with his head bent between his knees and his right arm hanging over the steering oar. The other oar had snapped off. Leaves, branches, and dirt covered the raft, so I could tell it had been through a hard time.
        - id: ch01-b20
          speaker: huck
          text: I tied the canoe to the raft and lay down right under Jim's nose. I yawned, stretched my fists toward him, and acted as if I had just woken up. Hello, Jim. Have I been asleep? Why didn't you wake me?
        - id: ch01-b21
          speaker: jim
          text: Goodness gracious, Huck, is that really you? You're not dead or drowned? You came back? This is too good to be true, honey. Let me look at you. Let me feel you. No, you aren't dead. You're alive and safe, the same old Huck. Thank goodness!
          emotion: surprised
        - id: ch01-b22
          speaker: huck
          text: What's wrong with you, Jim? Have you been drinking?
        - id: ch01-b23
          speaker: jim
          text: Drinking? When would I have had any chance to drink?
        - id: ch01-b24
          speaker: huck
          text: Then why are you talking so wild?
        - id: ch01-b25
          speaker: jim
          text: How am I talking wild?
        - id: ch01-b26
          speaker: huck
          text: How? You keep saying I came back, as if I had gone somewhere.
        - id: ch01-b27
          speaker: jim
          text: Huck Finn, look me straight in the eye. Haven't you been gone?
        - id: ch01-b28
          speaker: huck
          text: Gone? What in the world are you talking about? I haven't been anywhere. Where would I go?
        - id: ch01-b29
          speaker: jim
          text: Now listen, Huck. Something is wrong here. Am I really me? Am I sitting here, or where am I? That's what I want to know.
        - id: ch01-b30
          speaker: huck
          text: You look like you're here, all right. But I think you're a muddle-headed old fool, Jim.
        - id: ch01-b31
          speaker: jim
          text: Do you? Then answer this. Didn't you carry the line out in the canoe so you could tie us to a towhead?
        - id: ch01-b32
          speaker: huck
          text: No, I didn't. What towhead? I haven't seen one.
        - id: ch01-b33
          speaker: jim
          text: You never saw a towhead? Didn't the line pull loose? Didn't the raft go racing down the river and leave you behind in the canoe, there in the fog?
        - id: ch01-b34
          speaker: huck
          text: What fog?
        - id: ch01-b35
          speaker: jim
          text: The fog that hung around us all night! You called, and I called back. Then we got mixed up among the islands. One of us was lost, and the other might as well have been, because he had no idea where he was. I crashed against those islands, had a terrible time, and nearly drowned. Isn't that what happened, Huck? Tell me it isn't.
        - id: ch01-b36
          speaker: huck
          text: Jim, that's too much for me. I never saw any fog or islands or trouble. I sat right here talking with you all night. You fell asleep about ten minutes ago, and I reckon I nodded off too. You could not have gotten drunk that fast, so you must have dreamed the whole thing.
        - id: ch01-b37
          speaker: jim
          text: But how could I dream all that in ten minutes?
        - id: ch01-b38
          speaker: huck
          text: You did dream it, because none of it happened.
        - id: ch01-b39
          speaker: jim
          text: Huck, every bit of it is as plain to me as—
        - id: ch01-b40
          speaker: huck
          text: It does not matter how plain it seems. There is nothing to it. I know, because I was here the whole time.
        - id: ch01-b41
          speaker: huck
          text: Jim said nothing for about five minutes. He just sat there, thinking it over.
        - id: ch01-b42
          speaker: jim
          text: Well, I reckon I did dream it, Huck. But I'll be dogged if that wasn't the most powerful dream I ever had. No dream ever wore me out like this one did.
        - id: ch01-b43
          speaker: huck
          text: That's not so strange. A dream can tire a person terribly sometimes. But that was quite a dream. Tell me the whole thing, Jim.
        - id: ch01-b44
          speaker: huck
          text: Jim told me everything from beginning to end, just as it had happened, though he dressed it up quite a bit. Then he said the dream must be a warning, so he had to interpret it.
        - id: ch01-b45
          speaker: jim
          text: That first towhead stands for a man who will try to help us, and the current stands for another man who will pull us away from him. Those calls we heard are warnings that will come now and then. If we don't work hard to understand them, they'll lead us into bad luck instead of guiding us away from it. All those towheads are the troubles we'll meet with quarrelsome people and every sort of mean person. But if we mind our own business and don't answer back or make them angry, we'll get through. We'll come out of the fog into the wide, clear river. That river means the free states, where our troubles will be over.
        - id: ch01-b46
          speaker: huck
          text: Soon after I climbed onto the raft, the clouds had made the night dark again. Now the sky was clearing, and we could see the leaves and rubbish scattered around us, along with the broken oar.
        - id: ch01-b47
          speaker: huck
          text: Your interpretation sounds good as far as it goes, Jim. But what do all these things stand for?
        - id: ch01-b48
          speaker: huck
          text: Jim looked at the rubbish, then at me, then back at the rubbish. He had believed in the dream so firmly that he could not set it aside and put the real events back in place right away. But at last he understood. He looked straight at me without a smile.
        - id: ch01-b49
          speaker: jim
          text: You want to know what they stand for? I'll tell you. I wore myself out working and calling for you. When I finally fell asleep, my heart was nearly broken because you were lost. I didn't care what happened to me or the raft anymore. Then I woke and found you here again, alive and safe. Tears came to my eyes. I was so thankful I could have knelt down and kissed your foot. But all you thought about was how to fool old Jim with a lie. That mess there is trash. And that is what people are when they throw dirt on a friend's head and make him ashamed.
          emotion: sad
        - id: ch01-b50
          speaker: huck
          text: Jim rose slowly, walked to the wigwam, and went inside. He said nothing else, but that was enough. I felt so mean that I could almost have kissed his foot if it would make him take those words back.
        - id: ch01-b51
          speaker: huck
          text: It took me fifteen minutes to work up the courage to go and humble myself to a Black man. But I did it, and I was never sorry afterward. I never played another mean trick on Jim. If I had known how that one would make him feel, I would not have done it either.
