audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: confident and theatrical
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jim:
      display_name: Jim
      tts:
        delivery: cautious and warmhearted
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    nat:
      display_name: Nat
      tts:
        delivery: good-natured and anxious
        timbre: mellow and open
        pace: conversational
        pitch: medium-low
  chapters:
    - id: ch01
      title: CHAPTER XXXIV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: We quit talking and started thinking. After a while, Tom spoke up.
        - id: ch01-b02
          speaker: tom
          text: Look here, Huck. How could we be such fools and not see it sooner? I bet I know where Jim is.
        - id: ch01-b03
          speaker: huck
          text: You do? Where?
        - id: ch01-b04
          speaker: tom
          text: In that hut beside the ash hopper. At dinner, didn't you see a man carry food in there?
        - id: ch01-b05
          speaker: huck
          text: Yes.
        - id: ch01-b06
          speaker: tom
          text: What did you figure the food was for?
        - id: ch01-b07
          speaker: huck
          text: A dog.
        - id: ch01-b08
          speaker: tom
          text: So did I. But it wasn't meant for a dog.
        - id: ch01-b09
          speaker: huck
          text: How do you know?
        - id: ch01-b10
          speaker: tom
          text: Some of it was watermelon.
        - id: ch01-b11
          speaker: huck
          text: That's right. I saw it too. It beats everything that I never stopped to think that a dog wouldn't eat watermelon. A person can look straight at something and still not see it.
        - id: ch01-b12
          speaker: tom
          text: And the man unlocked a padlock before he went in, then locked it when he came out. About the time we left the table, he brought your uncle a key. I'll bet it was that same one.
        - id: ch01-b13
          speaker: tom
          text: The watermelon tells us there's a man inside, and the lock tells us he's a prisoner. There can't hardly be two prisoners on one little plantation, especially with such kind people living here. So Jim has to be the prisoner.
        - id: ch01-b14
          speaker: tom
          text: I'm glad we solved it like detectives. I wouldn't care a bit for finding out any other way. Now you think up a plan for stealing Jim, and I'll make one too. Then we'll choose whichever one we like best.
        - id: ch01-b15
          speaker: huck
          text: What a head that boy had on him! If I had Tom Sawyer's brains, I wouldn't trade them to be a duke, a steamboat mate, a circus clown, or anything else I could name.
        - id: ch01-b16
          speaker: huck
          text: I worked on a plan, though I was only keeping busy. I knew perfectly well which one of us would come up with the plan we used. Before long, Tom asked if I was ready.
        - id: ch01-b17
          speaker: tom
          text: Well, have you got yours?
        - id: ch01-b18
          speaker: huck
          text: Yes.
        - id: ch01-b19
          speaker: tom
          text: All right. Let's hear it.
        - id: ch01-b20
          speaker: huck
          text: First we find out for sure that Jim is in the hut. Tomorrow night, I'll bring my canoe up and fetch the raft over from the island. On the first dark night, we steal the key from the old man's pants after he's asleep.
        - id: ch01-b21
          speaker: huck
          text: Then we take Jim downriver on the raft. We hide in the daytime and travel at night, the same way Jim and I used to. Don't you think that would work?
        - id: ch01-b22
          speaker: tom
          text: Work? Of course it would work. It would work as sure as rats fighting. But it's much too simple. There's no trouble in it at all. What's the use of a plan like that? It's as mild as goose milk. Why, Huck, folks would talk about it no more than if we'd broken into a soap factory.
        - id: ch01-b23
          speaker: huck
          text: I kept quiet. I hadn't expected any other answer. And I knew that when Tom's plan was ready, nobody could accuse it of being too simple.
        - id: ch01-b24
          speaker: huck
          text: Sure enough, they couldn't. The minute he told me his plan, I saw it had fifteen times more style than mine. It would set Jim free just the same, and it might get all three of us killed besides. That satisfied me, so I said we'd go ahead with it.
        - id: ch01-b25
          speaker: huck
          text: There wasn't much point in explaining his plan then. I knew it wouldn't stay the way he first told it. Tom would twist it around every way he could while we carried it out, throwing in new grand ideas whenever he got the chance. And that was exactly what he did.
        - id: ch01-b26
          speaker: huck
          text: One thing was certain. Tom Sawyer truly meant to help steal Jim out of slavery. I couldn't make sense of that.
        - id: ch01-b27
          speaker: huck
          text: Tom was respectable and well raised. He had his own good name to lose, and his family had theirs. He was clever instead of slow, educated instead of ignorant, and kind instead of mean. Yet he was ready to stoop to this business and disgrace himself and his whole family in front of everybody. I couldn't understand it at all.
        - id: ch01-b28
          speaker: huck
          text: It seemed outrageous to me. As his true friend, I figured I ought to tell him so and let him stop before it was too late. I started to say it, but Tom cut me off.
        - id: ch01-b29
          speaker: tom
          text: Don't you suppose I know what I'm doing? Don't I generally know what I'm doing?
        - id: ch01-b30
          speaker: huck
          text: Yes.
        - id: ch01-b31
          speaker: tom
          text: Didn't I tell you I was going to help steal Jim?
        - id: ch01-b32
          speaker: huck
          text: Yes.
        - id: ch01-b33
          speaker: tom
          text: Well, then.
        - id: ch01-b34
          speaker: huck
          text: That ended it for both of us. When Tom said he'd do a thing, he always did it. I still couldn't understand why he would take part, but I let the matter drop. If he was set on it, there was nothing I could do.
        - id: ch01-b35
          speaker: huck
          text: When we got home, the whole house was dark and quiet. We kept going down to the hut beside the ash hopper so we could examine it. We crossed the yard on purpose to find out what the hounds would do. They already knew us, so they made no more fuss than country dogs usually make when anything passes at night.
        - id: ch01-b36
          speaker: huck
          text: We examined the front and both sides of the cabin. On the north side, which I hadn't seen before, there was a square opening set fairly high. One thick board was nailed across it.
        - id: ch01-b37
          speaker: huck
          text: Here's our way. The opening is big enough for Jim if we pry that board loose.
        - id: ch01-b38
          speaker: tom
          text: That's as simple as three-in-a-row, and as easy as skipping school. I should hope we can find something a little more complicated than that, Huck Finn.
        - id: ch01-b39
          speaker: huck
          text: Then what if we saw him out, the way I sawed myself out before I was murdered?
        - id: ch01-b40
          speaker: tom
          text: Now that's more like it. It's mysterious, difficult, and good. But I bet we can find a way that takes twice as long. We aren't in any hurry. Let's keep looking.
        - id: ch01-b41
          speaker: huck
          text: Behind the hut, in the space between it and the fence, stood a narrow shed made of planks. It joined the cabin under the eaves and ran the whole length of it, though it was only about six feet wide. At the south end, its door was fastened with a padlock.
        - id: ch01-b42
          speaker: huck
          text: Tom searched around the soap kettle and came back with the iron tool used to lift its lid. He pried out one of the lock staples. The chain dropped, and we opened the door, stepped inside, and shut it behind us.
        - id: ch01-b43
          speaker: huck
          text: We struck a match. The shed was only built against the cabin. There was no doorway between them and no floor under us. All we found were worn-out, rusty hoes, spades, picks, and a broken plow.
        - id: ch01-b44
          speaker: huck
          text: The match went out, and we left too. We pushed the staple back into place, and the door looked as securely locked as before. Tom was delighted.
        - id: ch01-b45
          speaker: tom
          text: Now we've got it! We'll dig Jim out. It should take us about a week!
          emotion: happy
        - id: ch01-b46
          speaker: huck
          text: We headed back to the house. I used the rear door. All you had to do was pull its buckskin latch string, because they never fastened it.
        - id: ch01-b47
          speaker: huck
          text: That easy back door wasn't romantic enough for Tom Sawyer. No other way would satisfy him. He insisted on climbing the lightning rod. Three times he got about halfway up, failed, and fell. The last fall nearly cracked his head, and for a while he thought he would have to quit.
        - id: ch01-b48
          speaker: huck
          text: After he had rested a while, he decided to try the whole climb once more for luck. That time, he made it all the way up.
        - id: ch01-b49
          speaker: huck
          text: At daybreak the next morning, we went to the workers' cabins. We wanted the dogs to get friendly with us, and we wanted to meet the man who took food to Jim, if Jim really was the prisoner.
        - id: ch01-b50
          speaker: huck
          text: The workers had just finished breakfast and were leaving for the fields. The man we wanted was filling a tin pan with bread, meat, and other food. As the rest went off, somebody brought the key down from the house.
        - id: ch01-b51
          speaker: huck
          text: The man had a good-natured, foolish-looking face. His hair was tied into little bunches with thread to keep witches away. He said witches had been tormenting him terribly at night.
        - id: ch01-b52
          speaker: huck
          text: They made him see strange sights and hear strange voices and noises. He had never been bewitched for so long before. He got so stirred up talking about his troubles that he forgot what he had been about to do. Tom asked about the pan.
        - id: ch01-b53
          speaker: tom
          text: Who's that food for? Are you feeding the dogs?
        - id: ch01-b54
          speaker: huck
          text: A smile slowly spread over the man's face, like a brick landing in a mud puddle.
        - id: ch01-b55
          speaker: nat
          text: Yes, Master Sid, it's for a dog. A mighty curious dog, too. Would you like to come see him?
        - id: ch01-b56
          speaker: tom
          text: Yes.
        - id: ch01-b57
          speaker: huck
          text: I nudged Tom and whispered to him.
        - id: ch01-b58
          speaker: huck
          text: You're going in now, in broad daylight? That wasn't our plan.
        - id: ch01-b59
          speaker: tom
          text: No, it wasn't. But it is now.
        - id: ch01-b60
          speaker: huck
          text: So we went with him, though I didn't like it one bit. The room was so dark that we could hardly see when we entered. Jim was there, sure enough. He could see us, and he called out.
        - id: ch01-b61
          speaker: jim
          text: Why, Huck! Good Lord, isn't that Master Tom?
          emotion: surprised
        - id: ch01-b62
          speaker: huck
          text: I had known this would happen. I had expected it from the start. I couldn't think of a thing to do, and even if I had, there was no time. The man broke in at once.
        - id: ch01-b63
          speaker: nat
          text: Good gracious! Does this runaway man know you gentlemen?
          emotion: surprised
        - id: ch01-b64
          speaker: huck
          text: Our eyes were used to the darkness now. Tom stared at the man with a puzzled look.
        - id: ch01-b65
          speaker: tom
          text: Does who know us?
        - id: ch01-b66
          speaker: nat
          text: Why, this runaway man right here.
        - id: ch01-b67
          speaker: tom
          text: I don't believe he does. What gave you that idea?
        - id: ch01-b68
          speaker: nat
          text: What gave me the idea? Didn't he call out just now as if he knew you?
        - id: ch01-b69
          speaker: tom
          text: That's very strange. Who called out? When did it happen? What did he say?
        - id: ch01-b70
          speaker: huck
          text: Tom turned to me, perfectly calm.
        - id: ch01-b71
          speaker: tom
          text: Did you hear anybody call out?
        - id: ch01-b72
          speaker: huck
          text: There was only one answer I could give.
        - id: ch01-b73
          speaker: huck
          text: No. I didn't hear anybody say a thing.
        - id: ch01-b74
          speaker: huck
          text: Then Tom looked Jim over as if he had never seen him in his life.
        - id: ch01-b75
          speaker: tom
          text: Did you call out?
        - id: ch01-b76
          speaker: jim
          text: No, sir. I haven't said anything.
        - id: ch01-b77
          speaker: tom
          text: Not one word?
        - id: ch01-b78
          speaker: jim
          text: No, sir. Not a word.
        - id: ch01-b79
          speaker: tom
          text: Have you ever seen us before?
        - id: ch01-b80
          speaker: jim
          text: No, sir. Not that I know of.
        - id: ch01-b81
          speaker: huck
          text: The man was looking wild and worried. Tom turned on him and spoke sharply.
        - id: ch01-b82
          speaker: tom
          text: What do you suppose is wrong with you? Why did you imagine someone called out?
        - id: ch01-b83
          speaker: nat
          text: Oh, it's those cursed witches, sir. I wish I were dead. They're always after me, and they nearly kill me with fright. Please don't tell anybody, sir, or old Master Silas will scold me. He says there aren't any witches.
          emotion: fearful
        - id: ch01-b84
          speaker: nat
          text: I only wish he were standing here now. I'd like to hear him explain this one away. But that's how stubborn people are. They won't look into a thing for themselves, and when you find out the truth and tell them, they refuse to believe you.
        - id: ch01-b85
          speaker: huck
          text: Tom gave him a dime. He promised we wouldn't tell anyone and said the man should buy more thread for his hair. Then Tom looked at Jim.
        - id: ch01-b86
          speaker: tom
          text: I wonder if Uncle Silas means to hang this runaway. If I caught someone ungrateful enough to escape, I wouldn't turn him over. I'd hang him myself.
        - id: ch01-b87
          speaker: huck
          text: The man stepped to the door to examine the dime and bite it, making sure it was real. Tom leaned close to Jim and whispered.
        - id: ch01-b88
          speaker: tom
          text: Don't show that you know us. If you hear digging at night, it will be Huck and me. We're going to set you free.
        - id: ch01-b89
          speaker: huck
          text: Jim had only enough time to catch our hands and squeeze them. Then the man came back. We said we might visit again if he wanted us to.
        - id: ch01-b90
          speaker: nat
          text: I'd surely like that, especially after dark. That's when the witches bother me most, and it helps to have people nearby.
