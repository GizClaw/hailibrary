audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
    jim_caretaker:
      display_name: 看守吉姆的黑人
      tts:
        delivery: 老实和气，迷信又容易受惊
        timbre: 成年浑厚
        pace: 稍慢而絮叨
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十四章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我们俩不说话了，都在动脑筋。过了一会儿，汤姆先想到了。
        - id: ch01-b02
          speaker: tom
          text: 哈克，咱们真傻，怎么早没想到！我敢说，我知道吉姆关在哪儿。
        - id: ch01-b03
          speaker: huck
          text: 真的？在哪儿？
        - id: ch01-b04
          speaker: tom
          text: 盛灰槽旁边那间小屋。吃饭时，不是有个黑人拿着吃的进去了？
        - id: ch01-b05
          speaker: huck
          text: 我看见了。还以为那些东西是拿去喂狗的。
        - id: ch01-b06
          speaker: tom
          text: 我起初也这么想，可那些吃的不是给狗的。
        - id: ch01-b07
          speaker: huck
          text: 为什么不是？
        - id: ch01-b08
          speaker: tom
          text: 因为里头有西瓜，狗可不吃西瓜。
        - id: ch01-b09
          speaker: huck
          text: 还真有西瓜，我也留意到了，偏偏没想到狗不吃它。人还真能一面看见，一面又没看见。
        - id: ch01-b10
          speaker: tom
          text: 那个人进门先开挂锁，出来又锁上。咱们离开饭桌时，他还把一把钥匙送给姨父，准是同一把。有西瓜，屋里就是人。有锁，那人就是囚犯。这么小的种植园，又全是厚道人，不会关着两个囚犯。所以那一定是吉姆。我就喜欢咱们像侦探这样查出来，别的法子我才不稀罕。现在你想一个救吉姆的计划，我也想一个，最后挑最好的。
        - id: ch01-b11
          speaker: huck
          text: 一个小孩子竟有这样的脑袋！要是我能有汤姆那副头脑，拿公爵、汽船大副、马戏团小丑，或任何身份来换，我都不肯。我也装模作样地想起来，反正真正的好办法会从谁脑袋里出来，我早就知道。没多久，他问我准备好了没有。我说准备好了，他便叫我讲出来。我告诉他，先查明屋里是不是吉姆。明晚把独木舟弄来，再把木筏从岛上划过来。等哪天夜里天黑透了，老先生睡下以后，咱们从他裤子里拿到钥匙，带着吉姆上木筏。往后白天藏好，夜里赶路，就照我和吉姆从前那样走。我问他，这个法子行不行。
        - id: ch01-b12
          speaker: tom
          text: 当然行，保准利索得像两只耗子打架。可它太简单了，一点花样也没有。毫不费事的计划有什么意思？这淡得像鹅奶，闹出的动静还不如闯进一家肥皂厂。
        - id: ch01-b13
          speaker: huck
          text: 我没回嘴，因为这话一点也不出我所料。我早就知道，汤姆等会儿想出的计划准不会有这些毛病。果然，他把办法一说，我立刻看出，单论派头，它就抵得上我的十五份。它也能叫吉姆自由，还很可能顺手把我们全害死。我这才满意，答应照他的办法轰轰烈烈地大干一场。
        - id: ch01-b14
          speaker: huck
          text: 他的办法究竟是什么，现在说了也没用。我知道它绝不会原样不动。事情只要往前走，汤姆就会把计划东改西改，只要逮着机会，还要塞进新的威风花样。后来他果真就是这么干的。
        - id: ch01-b15
          speaker: huck
          text: 有一点却是真的。汤姆打定主意，要帮我把吉姆从奴隶身份里偷走。这可把我难住了。他是体面人家教养出来的孩子，有自己的名声要丢，家里人也有名声要丢。他聪明，不是木头脑袋；他有见识，并不无知；他也不刻薄，反倒心眼很好。可他怎么会连体面、是非和羞耻都不要，甘愿干这种事，让自己和全家当着众人的面蒙羞？我怎么也想不明白。
        - id: ch01-b16
          speaker: huck
          text: 我觉得这事实在太不像话。真正的朋友就该把话直说出来，让他当场收手，免得毁了自己。我确实开口要劝，可话还没讲出来，他便堵住了我。
        - id: ch01-b17
          speaker: tom
          text: 我难道不知道自己在干什么？我平常做事，心里不是一直有数吗？
        - id: ch01-b18
          speaker: huck
          text: 是。
        - id: ch01-b19
          speaker: tom
          text: 我不是已经说了，要帮你把那个黑人偷出来吗？
        - id: ch01-b20
          speaker: huck
          text: 是。
        - id: ch01-b21
          speaker: tom
          text: 那不就得了。
        - id: ch01-b22
          speaker: huck
          text: 他只说到这里，我也只说到这里。再讲下去毫无用处，因为他只要说了要做一件事，就一定会做到。他为什么肯掺和进来，我仍旧想不通。于是我把这事撂下，不再费心。既然他非要这样，我也拿他没办法。
        - id: ch01-b23
          speaker: huck
          text: 回到家时，屋里漆黑又安静。我们又来到盛灰槽旁边的小屋查看，还特地穿过院子，想看看那些猎犬会怎么做。它们认得我们，只像乡下狗夜里见到东西经过时那样，照例叫了几声，并没有闹出更大的动静。
        - id: ch01-b24
          speaker: huck
          text: 我们把木屋正面和两边都看了一遍。在我原先不熟悉的北墙上，有一个方方的窗洞，位置相当高，洞口只横钉着一块结实的木板。
        - id: ch01-b25
          speaker: huck
          text: 就从这里走。把板子撬掉，洞口足够吉姆钻出来。
        - id: ch01-b26
          speaker: tom
          text: 这比下三子棋还简单，跟逃学一样容易。哈克·费恩，我真希望咱们能找个复杂一点的法子。
        - id: ch01-b27
          speaker: huck
          text: 那就锯开屋子救他吧，照我上次遇害时做的那样，行不行？
        - id: ch01-b28
          speaker: tom
          text: 这才像话。又神秘，又麻烦，很有意思。不过咱们准能找到一个多花一倍工夫的办法。反正不着急，接着找。
        - id: ch01-b29
          speaker: huck
          text: 木屋背后和篱笆之间搭着一座木板披屋，屋檐跟木屋连在一起。它和木屋一样长，只有六英尺来宽，南头的门上挂着锁。汤姆跑到煮肥皂的大锅旁，四下找了一阵，拿回一根揭锅盖的铁家伙。他用那东西撬出一枚锁扣，链子便掉下来。我们打开门，钻进去，再把门关严。
        - id: ch01-b30
          speaker: huck
          text: 我们划亮一根火柴，终于看清了里头。披屋只是贴着木屋搭起来的，两边并不相通，地上也没铺地板。除了几把生锈报废的锄头、铁锹、十字镐和一张坏掉的犁，什么也没有。火柴一灭，我们便退出去，把锁扣推回原处。门又锁得好好的，仿佛从没开过。汤姆乐坏了。
        - id: ch01-b31
          speaker: tom
          text: 这下妥了。咱们把他挖出来，要挖整整一个星期！
          emotion: happy
        - id: ch01-b32
          speaker: huck
          text: 我们朝屋子走回去。我只拉了拉鹿皮门闩绳，就从后门进了屋，这里的门夜里根本不锁。汤姆却嫌这种走法不够浪漫，什么法子也不肯用，非爬避雷针不可。他三次爬到一半，又三次摔下来，最后一次险些摔破脑袋，这才觉得该放弃了。可歇过以后，他还要再碰最后一次运气，这回总算爬了上去。
        - id: ch01-b33
          speaker: huck
          text: 第二天天刚亮，我们便起了床，来到黑人们住的小屋。一来逗逗那些狗，二来跟给吉姆送饭的人套近乎。当然，那时我们还没亲眼确认吃饭的人真是吉姆。其他人刚吃完早饭，正要下地干活。那个人正往一只锡盘里堆面包、肉和别的食物。等其余人动身时，钥匙也从屋里送来了。
        - id: ch01-b34
          speaker: huck
          text: 他长着一张和气又傻乎乎的脸，头发用线扎成许多小簇，说这样能挡住女巫。他抱怨这些夜里女巫把他折磨惨了，让他看到各种古怪的东西，听到各种古怪的话和声响。他一辈子也没让女巫缠过这么久。说着说着，他越来越激动，只顾没完没了地诉苦，连原本要做什么都忘了。汤姆便问他。
        - id: ch01-b35
          speaker: tom
          text: 这盘吃的是送给谁的？去喂狗吗？
        - id: ch01-b36
          speaker: huck
          text: 笑意慢慢爬满了那个人的脸，就像一块碎砖落进泥水塘，涟漪一点点散开。
        - id: ch01-b37
          speaker: jim_caretaker
          text: 是啊，锡德少爷，是一条狗。那狗可稀奇了。两位要不要去瞧瞧？
        - id: ch01-b38
          speaker: tom
          text: 要。
        - id: ch01-b39
          speaker: huck
          text: 我赶紧用胳膊肘碰汤姆，悄声提醒他。
        - id: ch01-b40
          speaker: huck
          text: 现在就去？天才刚亮，这可不是原先的计划。
        - id: ch01-b41
          speaker: tom
          text: 原来不是，现在是了。
        - id: ch01-b42
          speaker: huck
          text: 活见鬼，我们只好跟着走，我心里很不情愿。屋里暗得几乎什么也看不清，可吉姆果然在里面。他倒看见了我们，立刻喊出声来。
        - id: ch01-b43
          speaker: jim
          text: 哎呀，哈克！老天爷哪，那不是汤姆少爷吗？
          emotion: surprised
        - id: ch01-b44
          speaker: huck
          text: 我早知道事情会变成这样，也一直等着它发生。可眼下我一点办法也想不出。就算想得出来，也已经来不及了，因为那个人已经抢着问起来。
        - id: ch01-b45
          speaker: jim_caretaker
          text: 我的老天爷！他认识两位少爷吗？
          emotion: surprised
        - id: ch01-b46
          speaker: huck
          text: 这时我们的眼睛渐渐适应了黑暗，已经能看得相当清楚。汤姆定定地盯着那个人，脸上装出又惊讶又疑惑的样子。
        - id: ch01-b47
          speaker: tom
          text: 谁认识我们？
        - id: ch01-b48
          speaker: jim_caretaker
          text: 就是这个逃跑的黑人呀。他刚刚明明冲着两位喊了，像认识你们一样！
        - id: ch01-b49
          speaker: tom
          text: 我看他并不认识我们。可你怎么会想到那儿去？这倒真奇怪。刚才是谁喊的？什么时候喊的？到底喊了些什么？
        - id: ch01-b50
          speaker: huck
          text: 汤姆镇定得很，又转过来问我。
        - id: ch01-b51
          speaker: tom
          text: 你听见有人喊了吗？
        - id: ch01-b52
          speaker: huck
          text: 我除了这一句，哪还有别的话可说？我没听见，我没听见任何人开口说话。
        - id: ch01-b53
          speaker: huck
          text: 汤姆这才转向吉姆，把他从头到脚仔细打量一遍，装得好像这一辈子从来没有见过他。
        - id: ch01-b54
          speaker: tom
          text: 刚才是你喊的吗？你当真连一个字也没说？那你从前见过我们两个人吗？
        - id: ch01-b55
          speaker: jim
          text: 不是，少爷，我什么也没说，一个字都没有。至于两位少爷，我也不记得从前见过。
        - id: ch01-b56
          speaker: huck
          text: 那个人又慌又苦恼。汤姆转向他，口气严厉了一点。
        - id: ch01-b57
          speaker: tom
          text: 你到底怎么了？为什么非说有人喊过？
        - id: ch01-b58
          speaker: jim_caretaker
          text: 都怪那些该死的女巫，少爷，我真恨不得死了算了！她们总来折腾我，差点要了我的命，把我吓得魂都飞了。求您别把这事告诉别人，不然赛拉斯老爷会骂我，因为他硬说世上没有女巫。真希望他现在就在这里，看他这回还能说什么！我敢说，他再也找不到话搪塞了。可事情向来如此，死心眼的人永远死心眼。他们不肯亲自看看，弄个明白。等你查清楚了告诉他们，他们还是不信。
          emotion: fearful
        - id: ch01-b59
          speaker: huck
          text: 汤姆给了他一角钱，答应我们谁也不会告诉，又叫他拿钱多买些线，把头发扎得更牢。接着，汤姆看着吉姆，故意大声说起来。
        - id: ch01-b60
          speaker: tom
          text: 不知道赛拉斯姨父会不会绞死这个黑人。要是我抓到这么一个忘恩负义的逃奴，我才不把他交出去，非亲手绞死他不可。
        - id: ch01-b61
          speaker: huck
          text: 那个人走到门边，把硬币翻来覆去地看，又咬上一口，想试试真假。汤姆趁机压低声音告诉吉姆。
        - id: ch01-b62
          speaker: tom
          text: 千万别让人看出你认识我们。夜里要是听见挖土声，那就是我们。我们会放你自由。
        - id: ch01-b63
          speaker: huck
          text: 吉姆只来得及一把抓住我们两个人的手，紧紧地握了握，那个人便回来了。我们告诉他，只要他愿意，改天还会再来。他说当然愿意，尤其盼着我们天黑以后再来。那些女巫大多在黑暗里找上他，那时候身边能有人陪着，对他来说再好不过。
