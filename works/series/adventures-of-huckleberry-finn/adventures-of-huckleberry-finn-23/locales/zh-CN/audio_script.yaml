audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    judge:
      display_name: 法官
      tts:
        delivery: 体面老练，拿主意时干脆有力
        timbre: 浑厚清晰
        pace: 沉稳
        pitch: 中低
    jim:
      display_name: 吉姆
      tts:
        delivery: 热诚质朴，对哈克满是关切
        timbre: 浑厚温暖
        pace: 舒展自然
        pitch: 低
  chapters:
    - id: ch01
      title: 王室奇人开演
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 公爵和国王忙了一整天，把舞台搭好，幕布挂好，又排了一行蜡烛当脚灯。天一黑，屋里很快就挤满了男人。实在塞不下了，公爵才离开门口，绕到后面上了台。
        - id: ch01-b02
          speaker: huck
          text: 他站在幕前说了几句，把这出悲剧夸成世上最惊心动魄的好戏，还说头号主角是老埃德蒙·基恩演的。等大家都急着想看，他一下卷起幕布。
        - id: ch01-b03
          speaker: huck
          text: 国王马上赤条条地蹦了出来，四肢着地。他浑身涂满一道道、一圈圈的颜色，亮得跟彩虹一样。别的那点装束还是不说了，反正又野又滑稽。观众笑得几乎喘不上气。
        - id: ch01-b04
          speaker: huck
          text: 国王耍完宝退到幕后，可大家还在吼，在拍手跺脚，非叫他再来一遍。第二遍演完，他们又逼着他演了第三遍。那老傻瓜的洋相，连牛看了都会笑。
        - id: ch01-b05
          speaker: huck
          text: 公爵这才放下幕布，向观众鞠了一躬。他说，这出伟大的悲剧急着去伦敦赶场，只能再演两晚，因为德鲁里巷剧院的座位早就卖光了。他又鞠一躬，说大家要是看得高兴，还受了教益，请务必向朋友夸夸这出戏，劝他们也来看。
    - id: ch02
      title: 全镇人都要上当
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 二十来个人一齐喊起来，问怎么这就完了，难道整出戏就这么一点儿。公爵说，没错，已经完了。屋里顿时闹翻了天。人人都高喊着上了当，气冲冲地站起来，要上台找那两个悲剧演员算账。
        - id: ch02-b02
          speaker: huck
          text: 这时，一个高大又体面的男人跳上长凳，叫大家先听他说一句。人群果然停了下来。
        - id: ch02-b03
          speaker: judge
          text: 咱们是上了当，还吃了天大的亏。可咱们也不想让全镇人笑话，以后天天拿这事嘲弄咱们吧？既然不想，那就悄悄出去，把这场戏夸上天，也让镇上其他人来上当。这么一来，大家不就都一样了吗？这主意对不对？
        - id: ch02-b04
          speaker: huck
          text: 人们齐声回答，法官说得对。
        - id: ch02-b05
          speaker: judge
          text: 那就这么定了。谁也不准说自己上了当。都回家去，劝你们认识的人来看这出悲剧。
        - id: ch02-b06
          speaker: huck
          text: 第二天，全镇都在说那场戏有多精彩，根本听不到别的话。当晚屋里又挤得满满当当，我们原样把这批人也骗了。
        - id: ch02-b07
          speaker: huck
          text: 散场以后，我和国王、公爵回到木筏上，一起吃了顿夜宵。快到半夜，他们叫我和吉姆把木筏撑到河心，向下游走大约两英里，再靠岸藏好。
    - id: ch03
      title: 第三晚的礼物
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 第三晚，屋里还是挤得水泄不通。不过这回来的都是前两晚看过戏的人。我跟公爵在门口守着，看见每个人的口袋都鼓鼓的，有的人外套下面还裹着东西。那些绝不会是什么香喷喷的好玩意儿。
        - id: ch03-b02
          speaker: huck
          text: 变味的鸡蛋和烂白菜的臭气，一股股直往我鼻子里钻。附近有死猫的味儿，我更不会认不出来。我敢打赌，当晚他们至少带了六十四只死猫进去。
        - id: ch03-b03
          speaker: huck
          text: 我也进去待了一小会儿，可里头的气味混在一起，我实在受不了。等屋里连一个人也容不下时，公爵给了一个家伙两角五分，请他替自己守一会儿门，然后就绕向舞台入口。我跟着他，刚转过街角，走进黑处，他就开了口。
        - id: ch03-b04
          speaker: duke
          text: 快走。等到看不见那幢房子，就拼命往木筏跑，当后头有魔鬼在追你！
        - id: ch03-b05
          speaker: huck
          text: 我照他说的做了，他也一样。我们同时跑到木筏上，还不到两秒，木筏已经顺水滑走。四下漆黑又安静。我们慢慢移向河心，谁也没出声。
        - id: ch03-b06
          speaker: huck
          text: 我原以为，可怜的国王这回肯定会叫观众好好招待一顿。没想到才过了一会儿，他就从窝棚下面爬了出来。
        - id: ch03-b07
          speaker: king
          text: 怎么样，公爵？那个老把戏这一回收成好不好？
        - id: ch03-b08
          speaker: huck
          text: 原来国王根本没进镇。
    - id: ch04
      title: 国王的种性
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 等我们离那村子大约十英里，才敢点灯。吃过夜宵，国王和公爵想起自己怎么把那些人摆了一道，笑得骨头都快散架了。
        - id: ch04-b02
          speaker: duke
          text: 一群没长熟的傻瓜！我早就知道，头一晚那批人会把嘴闭紧，好让镇上其他人也钻进圈套。我还知道，到第三晚，他们会埋伏好来收拾咱们，以为这回终于轮到他们了。说得没错，现在确实轮到他们啦。
        - id: ch04-b03
          speaker: duke
          text: 我倒真想花点钱，问问他们愿意用什么价钱把这机会卖掉。我真想知道，他们这会儿是怎么享用这个好机会的。他们要愿意，完全可以办一场野餐，反正带的吃食多得很。
        - id: ch04-b04
          speaker: huck
          text: 那两个无赖三晚一共弄到四百六十五美元。我从没见过钱能这样一车一车地进来。过了一会儿，他们睡熟了，鼾声震天。吉姆这才跟我说话。
        - id: ch04-b05
          speaker: jim
          text: 哈克，那些国王能干出这种事，你不觉得奇怪吗？
        - id: ch04-b06
          speaker: huck
          text: 不奇怪，一点儿都不。
        - id: ch04-b07
          speaker: jim
          text: 怎么会不奇怪呢，哈克？
        - id: ch04-b08
          speaker: huck
          text: 因为这是他们打娘胎里就带来的性子。我看所有国王都差不多。
        - id: ch04-b09
          speaker: jim
          text: 可咱们这两个是地地道道的无赖啊，哈克。他们就是地地道道的无赖。
        - id: ch04-b10
          speaker: huck
          text: 对呀，我说的就是这个。据我看，国王差不多全是无赖。
        - id: ch04-b11
          speaker: jim
          text: 难道真是这样？
        - id: ch04-b12
          speaker: huck
          text: 你哪天读读他们的事就明白了。先看亨利八世吧。咱们这个跟他一比，都能算主日学校的校长了。再看看查理二世、路易十四、路易十五、詹姆斯二世、爱德华二世、理查三世，还有四十来个别的国王。加上以前撒克逊七国那帮家伙，他们一到处乱闯，什么都闹翻了。
        - id: ch04-b13
          speaker: huck
          text: 你真该看看老亨利八世风头正劲的时候。他才是一朵奇葩。他每天娶一个新老婆，第二天早上就把她的脑袋砍掉。他下这种命令，轻松得就跟叫人送几个鸡蛋一样。
        - id: ch04-b14
          speaker: huck
          text: 他会说，把内尔·格温带上来。人家就把她带来。第二天早上，他又说，砍掉她的脑袋。人家就砍了。他又叫人把简·肖尔带来，第二天照样砍头。然后他摇铃叫来美丽的罗莎蒙，到了早上，还是砍头。
        - id: ch04-b15
          speaker: huck
          text: 他还叫这些女人每晚给他讲一个故事。等他霸占了一千零一个故事，就把它们全编成书，取名叫《末日审判书》。这个书名取得真好，把事情说得清清楚楚。
        - id: ch04-b16
          speaker: huck
          text: 吉姆，你是不了解国王，我可了解。咱们这个老坏蛋，算是我在历史里见过最干净的一个了。
        - id: ch04-b17
          speaker: huck
          text: 后来，亨利突然想给这个国家找麻烦。他会先打声招呼，让人家有机会准备吗？才不会。他冷不防把所有的茶都倒进波士顿港，又一挥笔写出《独立宣言》，叫别人放马过来。他就是这样，从来不给别人机会。
        - id: ch04-b18
          speaker: huck
          text: 他怀疑自己的父亲威灵顿公爵，会把父亲叫来当面说清楚吗？才不会。他把人家像猫一样，溺死在一大桶马姆齐甜酒里。要是钱放在他面前，他会一把抢走。要是他收了你的钱，答应替你办事，可你没坐在旁边盯着，他会扭头去办别的事。他只要张嘴，你就得赶快叫他闭上，否则每回都会漏出一句假话。
        - id: ch04-b19
          speaker: huck
          text: 亨利就是这么一只怪虫。要是这一路跟着我们的是他，而不是咱们这两个国王，那镇上的人得惨上十倍。我可不是说咱们这两个是小羊羔。冷静下来按事实讲，他们当然不是。可跟那只老公羊比，他们实在算不上什么。
        - id: ch04-b20
          speaker: huck
          text: 反正国王就是国王，你得体谅他们。总的来说，他们是一帮坏到了家的人。都是从小的教养造成的。
        - id: ch04-b21
          speaker: jim
          text: 可咱们这个臭得也太厉害了。
        - id: ch04-b22
          speaker: huck
          text: 国王都这样，吉姆。我们可管不了国王身上是什么味儿，历史也没说过有什么办法。
        - id: ch04-b23
          speaker: jim
          text: 不过话说回来，公爵有些地方还挺像个好人。
        - id: ch04-b24
          speaker: huck
          text: 对，公爵是不一样。不过也没差多少。放在公爵里头，这个也算很坏的货色了。他一喝醉，眼神不大好的人保准会把他当成国王。
        - id: ch04-b25
          speaker: jim
          text: 不管怎样，我可不想再碰上一个了，哈克。这两个已经够我受的啦。
        - id: ch04-b26
          speaker: huck
          text: 我也这么想，吉姆。可他们已经落到咱们手里，咱们只好记住他们是什么人，尽量多体谅。有时候，我真希望能听说一个国家，那里连一个国王也没有。
        - id: ch04-b27
          speaker: huck
          text: 告诉吉姆，这两个家伙并不是真国王、真公爵，又有什么用呢？说了也没好处。再说，事情跟我讲的一样，他们和真的压根分不出来。
    - id: ch05
      title: 吉姆想起小伊丽莎白
      blocks:
        - id: ch05-b01
          speaker: huck
          text: 我睡着了。轮到我值班的时候，吉姆没有叫醒我，他常常这样做。天快亮时，我醒了，看见他独自坐在那里，脑袋低垂在两膝之间，嘴里轻声哀叹。
        - id: ch05-b02
          speaker: huck
          text: 我没去管他，也没让他知道我看见了。我明白他为什么难过。他想着远方的妻子儿女，又凄凉又想家，因为他这辈子还从没离开过家。
        - id: ch05-b03
          speaker: huck
          text: 我真的相信，他疼自己的家人，跟白人疼自家人一样深。这听着好像不大合常理，可我觉得就是事实。
        - id: ch05-b04
          speaker: huck
          text: 夜里，他以为我睡着了，常常会这样低声哀叹。
        - id: ch05-b05
          speaker: jim
          text: 可怜的小伊丽莎白！可怜的小约翰尼！这日子太难熬了。我怕这辈子再也见不到你们了，再也见不到了！
          emotion: sad
        - id: ch05-b06
          speaker: huck
          text: 吉姆真是个极好的黑人。可这一回，也不知道怎么了，我竟然跟他说起了他的妻子和儿女。过了一会儿，他说起了小伊丽莎白。
        - id: ch05-b07
          speaker: jim
          text: 我今天会这么难过，是因为刚才听见那边岸上响了一声，也不知是“啪”还是“砰”。那声音让我想起，以前我亏待过小伊丽莎白。
        - id: ch05-b08
          speaker: jim
          text: 她那时候才四岁左右。她得了猩红热，病得厉害，后来又好了。有一天，她站在那儿，我叫她把门关上。
        - id: ch05-b09
          speaker: jim
          text: 她就是不关。她站在那里，抬起脸，对着我微微地笑。我生气了，又扯大嗓门叫她，问她到底听见没有，快把门关上。
        - id: ch05-b10
          speaker: jim
          text: 可她还是那样站着，仰着脸对我微微地笑。我气得浑身冒火，跟她说，好啊，看你还敢不听我的话！
          emotion: angry
        - id: ch05-b11
          speaker: jim
          text: 说完，我一巴掌打在她脑袋旁边，把她打倒在地。然后我进了另一个房间，待了大约十分钟。
        - id: ch05-b12
          speaker: jim
          text: 等我回来，那扇门居然还开着。孩子差不多就站在门里，低着头，伤心得一直流眼泪。天哪，我当时又气坏了，正想过去收拾她。
        - id: ch05-b13
          speaker: jim
          text: 那扇门是朝里开的。就在这时，一阵风吹过来，门在孩子身后猛地合上，“砰”地响了一声。老天爷啊，那孩子竟然一动也没动！
          emotion: surprised
        - id: ch05-b14
          speaker: jim
          text: 我那口气差点从胸口里跳出来。心里那个滋味，那个滋味，我根本说不出来。我浑身发抖，踮着脚尖走出去，又轻手轻脚地绕到门后。
          emotion: fearful
        - id: ch05-b15
          speaker: jim
          text: 我慢慢把门拉开一点，把脑袋悄悄伸进去，凑到孩子背后，然后用尽力气大喊了一声“啪”。可她还是一动不动！
          emotion: fearful
        - id: ch05-b16
          speaker: jim
          text: 啊，哈克，我当场就哭了。我一把将她抱在怀里，求全能的主宽恕可怜的老吉姆。因为只要我还活一天，就永远没法宽恕自己！
          emotion: sad
        - id: ch05-b17
          speaker: jim
          text: 她完全聋了，也不会说话了，哈克。她彻底聋了，也彻底哑了。可我竟然还那样对她！
          emotion: sad
