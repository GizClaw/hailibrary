  chapters:
    - id: ch01
      title: CHAPTER XXIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The king and the duke worked hard all day. They put up a stage and a curtain, then set a row of candles along the front for footlights. That night, men packed the house in no time. Once nobody else could squeeze in, the duke left the door, slipped around back, and stepped onto the stage in front of the curtain.
        - id: ch01-b02
          speaker: huck
          text: He gave a little speech about the tragedy. He called it the most thrilling show ever performed and bragged about Edmund Kean the Elder, who was playing the leading part. By the time the duke finished, everybody expected something tremendous.
        - id: ch01-b03
          speaker: huck
          text: Then he raised the curtain. Out came the king, prancing on all fours without a stitch of clothing. He was painted from head to foot in rings, stripes, and every color you could think of, bright as a rainbow. I will leave the rest of his outfit alone. It was wild, and it was terribly funny.
        - id: ch01-b04
          speaker: huck
          text: The men nearly laughed themselves to death. The king capered around and disappeared behind the curtain, but they roared, clapped, and stamped until he came back. He did the whole thing twice more. The foolish old man cut such ridiculous shines that even a cow might have laughed.
        - id: ch01-b05
          speaker: huck
          text: At last, the duke lowered the curtain and bowed. He told the crowd that the great tragedy would run only two more nights. Urgent business called the company to London, he said, and every seat at Drury Lane had already sold.
        - id: ch01-b06
          speaker: duke
          text: Gentlemen, if tonight's performance has pleased and educated you, I would be deeply obliged if you told your friends and sent them to see it.
        - id: ch01-b07
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: Wait! Is the show finished? Was that everything?
          emotion: surprised
        - id: ch01-b08
          speaker: duke
          text: Yes, gentlemen. That concludes the performance.
        - id: ch01-b09
          speaker: huck
          text: Then trouble broke loose. Everybody shouted that they had been cheated. The men jumped up furious and started toward the stage and the two tragedians. But a big, fine-looking man climbed onto a bench and called for them to wait. The crowd stopped to hear him.
        - id: ch01-b10
          speaker: judge
          text: Gentlemen, they fooled us badly. But do we want this whole town laughing at us for the rest of our lives? No. We ought to leave quietly, praise this show, and fool everybody else into coming. Then the whole town will be in the same boat. Does that sound sensible?
        - id: ch01-b11
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: It surely does! The judge is right!
        - id: ch01-b12
          speaker: judge
          text: Good. Then nobody says a word about being cheated. Go home and tell everyone they must see this tragedy.
        - id: ch01-b13
          speaker: huck
          text: The next day, that town talked about nothing but the wonderful show. The house filled again that night, and we cheated the second crowd the same way. Afterward, the king, the duke, and I went back to the raft and ate supper. Around midnight, they had Jim and me move the raft into the middle of the river, float about two miles downstream, and hide it there.
        - id: ch01-b14
          speaker: huck
          text: The house was crammed on the third night too, but these were not new customers. They were the men from the first two nights. I stood beside the duke at the door. Every man who entered had bulging pockets or something hidden under his coat, and none of it smelled like perfume. There were rotten eggs, spoiled cabbages, and plenty more. I know the smell of a dead cat, and I would swear sixty-four dead cats went through that door.
        - id: ch01-b15
          speaker: huck
          text: I stepped inside for a minute, but there were too many kinds of stink for me. I could not stand it. When no one else could fit in the house, the duke paid a fellow a quarter to watch the door. Then he headed around toward the stage entrance, with me behind him. The moment we turned the corner into the dark, he spoke.
        - id: ch01-b16
          speaker: duke
          text: Walk fast until we're clear of the houses. Then run for the raft as if the devil were chasing you!
        - id: ch01-b17
          speaker: huck
          text: I did exactly that, and so did he. We reached the raft together. In less than two seconds, we were drifting downstream in the dark, quiet as could be, and easing toward the middle of the river. Nobody said a word.
        - id: ch01-b18
          speaker: huck
          text: I figured the poor king was about to have a mighty lively time with that audience. But he was in no danger at all. Before long, he crawled out from under the wigwam.
        - id: ch01-b19
          speaker: king
          text: Well, Duke, how did the old scheme work this time?
        - id: ch01-b20
          speaker: huck
          text: The king had never gone into town that night.
        - id: ch01-b21
          speaker: huck
          text: We kept every light out until we were about ten miles below the village. Then we lit up and ate supper. The king and the duke laughed until their bones nearly came loose over the trick they had played on those men.
        - id: ch01-b22
          speaker: duke
          text: What a pack of fools! I knew the first crowd would keep quiet so the rest of the town would get caught too. And I knew they would be waiting for us on the third night, thinking it was finally their turn. Well, it is their turn now. I wonder what price they'd take for it.
        - id: ch01-b23
          speaker: duke
          text: I would dearly love to know how they're using their chance. They can make a picnic of it if they like. They certainly brought enough provisions.
        - id: ch01-b24
          speaker: huck
          text: Those rascals made four hundred and sixty-five dollars in three nights. I had never seen money roll in by the wagonload like that. After a while, the two of them fell asleep and started snoring. Then Jim spoke to me.
        - id: ch01-b25
          speaker: jim
          text: Huck, don't it surprise you, the way them kings behave?
        - id: ch01-b26
          speaker: huck
          text: No, it doesn't.
        - id: ch01-b27
          speaker: jim
          text: How come it don't surprise you?
        - id: ch01-b28
          speaker: huck
          text: Because that's how they're bred. I reckon every king is pretty much the same.
        - id: ch01-b29
          speaker: jim
          text: But Huck, these kings of ours are regular rascals. That's just what they are.
        - id: ch01-b30
          speaker: huck
          text: That's what I'm telling you. From everything I can figure, most kings are rascals.
        - id: ch01-b31
          speaker: jim
          text: Is that really so?
        - id: ch01-b32
          speaker: huck
          text: Read about them sometime and you'll see. Take Henry the Eighth. Our king would look like a Sunday-school superintendent beside him. Then there was Charles the Second, Louis the Fourteenth, Louis the Fifteenth, James the Second, Edward the Second, Richard the Third, and forty more. Those old Saxon kingdoms raised all kinds of Cain too.
        - id: ch01-b33
          speaker: huck
          text: You should have seen Henry the Eighth in his prime. He was something special. He married a new wife every day and chopped off her head the next morning, as casually as a man ordering eggs.
        - id: ch01-b34
          speaker: huck
          text: He would say, “Bring in Nell Gwynn.” They brought her in. Next morning, he ordered her head chopped off, and they did it. Then he called for Jane Shore. She came in, and the next morning he had her head chopped off too. After that, he rang for Fair Rosamun. She answered, and he gave her the same treatment next morning.
        - id: ch01-b35
          speaker: huck
          text: He made every one of those wives tell him a story each night. He kept going until he had collected one thousand and one tales. Then he put them into a book and named it the Domesday Book. That was a fitting name, if ever there was one.
        - id: ch01-b36
          speaker: huck
          text: You don't know kings, Jim, but I do. Our old rascal is one of the cleanest kings I've come across in history. Henry once decided to start trouble with this country. Did he warn anybody or give the country a fair chance? Not him. Without a word, he dumped all the tea into Boston Harbor, hammered out a declaration of independence, and dared them to fight. That was how Henry worked. He never gave anybody a chance.
        - id: ch01-b37
          speaker: huck
          text: He got suspicious of his own father, the Duke of Wellington. Did he ask the man to explain himself? No. He drowned him in a barrel of sweet wine like a cat. Leave money lying near Henry, and he took it. Pay him to do a job without sitting there to watch, and he did the opposite. Every time he opened his mouth, a lie escaped unless he shut it mighty fast.
        - id: ch01-b38
          speaker: huck
          text: That was Henry for you. If he'd been traveling with us, he would have fooled that town far worse than our pair did. I won't call our kings lambs, because the facts won't allow it. But next to that old ram, they are nothing. Kings are kings, Jim. You have to make allowances. Taken together, they're a rotten lot. It comes from how they're raised.
        - id: ch01-b39
          speaker: jim
          text: But this king smells something awful, Huck.
        - id: ch01-b40
          speaker: huck
          text: They all do, Jim. We can't change how a king smells, and history doesn't offer any cure for it.
        - id: ch01-b41
          speaker: jim
          text: Now, the duke seems like a tolerable man in some ways.
        - id: ch01-b42
          speaker: huck
          text: A duke is different, but not by much. This one is a pretty hard case, even for a duke. When he's drunk, no nearsighted man could tell him from a king.
        - id: ch01-b43
          speaker: jim
          text: Well, I don't want any more of either kind, Huck. These two are all I can stand.
        - id: ch01-b44
          speaker: huck
          text: I feel the same way, Jim. But we're stuck with them, so we have to remember what they are and make allowances. Sometimes I wish there were a country with no kings at all.
        - id: ch01-b45
          speaker: huck
          text: There was no use telling Jim these men were not truly a king and a duke. It would not have helped. Besides, just as I had said, you could not tell them from the real kind.
        - id: ch01-b46
          speaker: huck
          text: I went to sleep, and Jim did not wake me for my turn on watch. He often let me sleep like that. At daybreak, I woke and found him sitting with his head between his knees, quietly moaning and grieving. I pretended not to notice, because I knew what troubled him.
        - id: ch01-b47
          speaker: huck
          text: His wife and children were far away, and he was thinking about them. Jim had never been away from home before, and he felt low and homesick. I believe he cared every bit as much for his family as white people care for theirs. That did not seem natural to me then, but I reckoned it must be true.
        - id: ch01-b48
          speaker: huck
          text: Many nights, when he thought I was asleep, I heard him grieving to himself.
        - id: ch01-b49
          speaker: jim
          text: My poor little 'Lizabeth. My poor little Johnny. This is mighty hard. I don't expect I'll ever see either of you again.
          emotion: sad
        - id: ch01-b50
          speaker: huck
          text: Jim was a mighty good man.
        - id: ch01-b51
          speaker: huck
          text: This time, I got him talking about his wife and children. Before long, he told me why he felt especially bad that night.
        - id: ch01-b52
          speaker: jim
          text: A while ago, I heard something across on the bank make a whack or a slam. It put me in mind of the time I treated my little 'Lizabeth so badly. She was only about four years old. She'd had scarlet fever something terrible, but she got well. One day she was standing near me, and I told her to shut the door.
        - id: ch01-b53
          speaker: jim
          text: She didn't do it. She just stood there, smiling up at me. That made me mad, so I shouted at her and asked if she heard me. I ordered her to shut that door. Still she stayed right there, smiling the same way. I was boiling then. I told her I'd make her mind me.
        - id: ch01-b54
          speaker: jim
          text: I slapped her on the side of the head so hard she went sprawling. Then I walked into the other room and stayed there about ten minutes. When I came back, the door was still open. My child was standing almost in the doorway with her head down, crying. The tears were running over her face.
        - id: ch01-b55
          speaker: jim
          text: That made me mad all over again, and I started toward her. The door opened inward, and right then the wind came along and slammed it shut behind her with a great bang. Huck, that child never moved.
        - id: ch01-b56
          speaker: jim
          text: It nearly knocked the breath out of me. I felt so strange I can't even tell you how. Trembling all over, I crept around and opened the door behind her, slow and easy. I put my head through without making a sound. Then all at once, I yelled, “Pow!” as loud as I could.
        - id: ch01-b57
          speaker: jim
          text: She never moved. Oh, Huck, I burst out crying and grabbed her up in my arms. I begged Almighty God to forgive poor old Jim, because Jim could never forgive himself as long as he lived.
          emotion: sad
        - id: ch01-b58
          speaker: jim
          text: My little girl was completely deaf and couldn't speak, Huck. She was deaf and couldn't speak, and I had treated her that way.
          emotion: sad
