  chapters:
    - id: ch01
      title: CHAPTER III.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Miss Watson gave me a proper scolding the next morning over my clothes. The widow didn't scold at all. She just cleaned off the grease and clay and looked so sorry that I thought I'd try to behave for a while, if I could.
        - id: ch01-b02
          speaker: huck
          text: Then Miss Watson took me into the closet to pray. It didn't do any good. She told me to pray every day, and said I'd get whatever I asked for. That wasn't how it worked when I tried it. Once I got a fishing line, but I couldn't get any hooks. A line without hooks wasn't much use.
        - id: ch01-b03
          speaker: huck
          text: I tried asking for hooks three or four times, and still nothing happened. One day I asked Miss Watson to pray for them instead.
        - id: ch01-b04
          speaker: miss_watson
          text: Huck, you are a fool.
        - id: ch01-b05
          speaker: huck
          text: She never told me why, and I couldn't figure it out.
        - id: ch01-b06
          speaker: huck
          text: One time I sat down in the woods and gave the whole thing a long think. If people could get anything they prayed for, why didn't Deacon Winn get back the money he'd lost on pork? Why didn't the widow get back her stolen silver snuffbox? And why couldn't Miss Watson put on some weight? No, I decided. There wasn't anything in it.
        - id: ch01-b07
          speaker: huck
          text: I told the widow what I thought. She said prayer could bring a person spiritual gifts. That was too much for me, so she explained. I was supposed to help other people, do everything I could for them, and always look out for them without ever thinking about myself. As I understood it, that included Miss Watson.
        - id: ch01-b08
          speaker: huck
          text: I went back into the woods and turned that over for a long while. I couldn't see any advantage in it except for the other people. At last I decided to quit worrying about it and let it go.
        - id: ch01-b09
          speaker: huck
          text: Sometimes the widow would take me aside and talk about Providence in a way that made it sound mighty fine. Then the very next day Miss Watson might start in and spoil the whole thing. I could see there must be two Providences. A poor fellow had a fair chance with the widow's Providence, but once Miss Watson's got hold of him, there was no helping him.
        - id: ch01-b10
          speaker: huck
          text: I thought it all through and decided I'd belong to the widow's Providence, if he wanted me. I couldn't see how he'd be any better off, though. I was so ignorant, low-down, and ornery.
        - id: ch01-b11
          speaker: huck
          text: Pap hadn't been seen for more than a year, and that suited me. I didn't want to see him again. Whenever he was sober and could catch me, he used to beat me. Most times when he was around, I took to the woods.
        - id: ch01-b12
          speaker: huck
          text: About then, people said Pap had been found drowned in the river, twelve miles above town. They figured the dead man was him. He was Pap's size, wore rags, and had the same uncommon long hair. His face had been in the water so long that it hardly looked like a face anymore. They found him floating on his back, then buried him on the riverbank.
        - id: ch01-b13
          speaker: huck
          text: I wasn't comfortable for long, because something occurred to me. I knew a drowned man floats facedown, not on his back. So it wasn't Pap. It was a woman dressed in men's clothes. That made me uneasy all over again. I figured the old man would turn up sooner or later, though I wished he wouldn't.
        - id: ch01-b14
          speaker: huck
          text: We played robbers now and then for about a month. After that I quit, and so did all the other boys. We hadn't robbed or killed anyone. We had only pretended. We'd burst out of the woods and charge at hog drivers or women taking cartloads of garden produce to market. That was as far as it ever went. We never captured a single one of them.
        - id: ch01-b15
          speaker: huck
          text: Tom called the hogs ingots and the turnips and other produce jewelry. Then we'd go back to the cave and talk over everything we'd supposedly done, including how many people we'd killed and marked. I couldn't see any profit in it.
        - id: ch01-b16
          speaker: huck
          text: One time Tom sent a boy racing around town with a burning stick. He called it a slogan, and it was the signal for the gang to meet. Tom said his spies had brought secret news. The next day, a great crowd of Spanish merchants and rich Arabs would camp in Cave Hollow.
        - id: ch01-b17
          speaker: tom
          text: They'll have two hundred elephants, six hundred camels, and more than a thousand pack mules. I call them sumter mules. They'll all be loaded with diamonds. Only four hundred soldiers will be guarding them. We'll lie in ambush, kill the whole lot, and scoop up everything. Get your swords and guns polished and ready.
        - id: ch01-b18
          speaker: huck
          text: Tom couldn't even attack a turnip cart without polishing the swords and guns first. They were nothing but wooden slats and broomsticks. You could scour them until they rotted away. No matter how hard you worked at it, they still wouldn't be worth a mouthful of ashes.
        - id: ch01-b19
          speaker: huck
          text: I didn't believe we could beat that many Spaniards and Arabs, but I wanted to see the camels and elephants. So I was there in the ambush on Saturday. When the signal came, we rushed out of the woods and down the hill.
        - id: ch01-b20
          speaker: huck
          text: There weren't any Spaniards, Arabs, camels, or elephants. It was only a Sunday-school picnic, and a class of little beginners at that. We broke up the picnic and chased the children along the hollow. There wasn't any treasure. All we got were some doughnuts and jam. Ben Rogers took a rag doll, and Jo Harper got a hymnbook and a religious tract.
        - id: ch01-b21
          speaker: huck
          text: Then the teacher charged at us. We dropped everything and ran.
        - id: ch01-b22
          speaker: huck
          text: I told Tom I hadn't seen any diamonds. He insisted there had been loads of them, along with Arabs, elephants, and everything else. I asked why we couldn't see any of it.
        - id: ch01-b23
          speaker: tom
          text: If you weren't so ignorant, Huck, and you'd read Don Quixote, you wouldn't have to ask. It was enchantment. There were hundreds of soldiers, and elephants, and treasure. But our enemies are magicians. Just to spite us, they changed it all into a Sunday school for little children.
        - id: ch01-b24
          speaker: huck
          text: All right, then. We ought to go after the magicians.
        - id: ch01-b25
          speaker: huck
          text: Tom said I was a numskull.
        - id: ch01-b26
          speaker: tom
          text: Why, a magician could call up a whole crowd of genies. They'd chop you to bits before you could say Jack Robinson. They're as tall as a tree and as big around as a church.
        - id: ch01-b27
          speaker: huck
          text: Suppose we got some genies to help us. Couldn't we beat the other crowd then?
        - id: ch01-b28
          speaker: tom
          text: And how would you get them?
        - id: ch01-b29
          speaker: huck
          text: I don't know. How do the magicians get them?
        - id: ch01-b30
          speaker: tom
          text: They rub an old tin lamp or an iron ring. Then the genies come rushing in through thunder, lightning, and rolling smoke. They'll do anything they're told. They could pull a shot tower right out by the roots and hit a Sunday-school superintendent over the head with it, or any other man.
        - id: ch01-b31
          speaker: huck
          text: Who makes them rush around like that?
        - id: ch01-b32
          speaker: tom
          text: Whoever rubs the lamp or ring. The genies belong to that person, and they have to obey him. Tell them to build a forty-mile-long palace out of diamonds, fill it with chewing gum or anything else you want, and bring you an emperor's daughter from China to marry. They have to finish before sunrise the next morning. What's more, they have to waltz that palace around the country wherever you tell them.
        - id: ch01-b33
          speaker: huck
          text: Then they're a pack of flatheads. Why don't they keep the palace instead of giving it away? And if I were one of them, a man could rub his old tin lamp all he pleased. I wouldn't leave my business and come to him.
        - id: ch01-b34
          speaker: tom
          text: Listen to yourself, Huck Finn. You'd have to come when he rubbed it, whether you wanted to or not.
        - id: ch01-b35
          speaker: huck
          text: What, even if I were as tall as a tree and as big as a church? Fine, I'd come. But I'd make that man climb the highest tree in the country.
        - id: ch01-b36
          speaker: tom
          text: Shucks, Huck Finn, there's no use talking to you. Somehow you don't know anything at all. You're a perfect saphead.
        - id: ch01-b37
          speaker: huck
          text: I thought it all over for two or three days and decided to find out whether any of it was true. I found an old tin lamp and an iron ring. Then I went into the woods and rubbed and rubbed until I was sweating, figuring I'd call up some genies, build a palace, and sell it.
        - id: ch01-b38
          speaker: huck
          text: It did no good. Not one genie came. So I decided the whole thing was just another one of Tom Sawyer's lies. I figured Tom really did believe in the Arabs and elephants, but I didn't. It had all the marks of a Sunday school.
