audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom_sawyer:
      display_name: 汤姆·索亚
      tts:
        delivery: 自信大胆，满脑子冒险主意
        timbre: 明亮稚气
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，老沃森小姐看见我的衣裳，劈头盖脸训了我一顿。寡妇没有骂，只替我擦去油污和泥巴。她那副难过的样子，弄得我也有点儿过意不去，心想只要忍得住，不妨规矩一阵子。
        - id: ch01-b02
          speaker: narrator
          text: 沃森小姐又把我带进小房间，和我一起祷告，可什么也没有发生。她说我应该天天祷告，想要什么就能得到什么。我亲自试了试，根本不灵。有一次我弄到一根钓鱼线，手里却没有鱼钩。光有线有什么用？我一连求了三四次，鱼钩还是没来。
        - id: ch01-b03
          speaker: narrator
          text: 后来，我请沃森小姐替我求鱼钩，她反倒说我是个傻瓜。为什么傻，她一句也没解释。我怎么想都想不通。
        - id: ch01-b04
          speaker: narrator
          text: 有一天，我一个人坐在树林深处，把祷告这件事仔细想了一遍。要是什么都能求来，温执事做猪肉生意赔的钱为什么没回来？寡妇丢掉的银鼻烟盒为什么也没回来？沃森小姐怎么还是胖不起来？所以我认定，这办法靠不住。
        - id: ch01-b05
          speaker: narrator
          text: 寡妇听了，却告诉我，祷告求来的是“属灵的恩赐”。我不懂，她就给我解释。意思是，我得帮助别人，能替别人做什么就做什么，总要先替别人着想，不能只想着自己。照我听来，这里头连沃森小姐也包括在内。
        - id: ch01-b06
          speaker: narrator
          text: 我又跑到树林里，翻来覆去想了好久。这样做有什么好处，我实在看不出来。除了别人能得好处，我自己什么也落不着。最后，我决定不再操心，把它丢到一边算了。
        - id: ch01-b07
          speaker: narrator
          text: 寡妇偶尔会单独跟我讲上帝的安排。经她那么一说，真叫人听了直流口水。可第二天只要沃森小姐接过去，那些好处准会被她说得一点儿不剩。
        - id: ch01-b08
          speaker: narrator
          text: 于是我猜，世上一定有两个上帝。倒霉人要是落到寡妇的上帝手里，还有不少指望。要是归了沃森小姐的上帝，那就彻底没救了。我愿意归寡妇的那一位，只要他肯收下我。可我这么无知，又这么下贱、没出息，他收了我以后能比从前好到哪儿去，我也实在想不明白。
        - id: ch01-b09
          speaker: narrator
          text: 我爸爸已经一年多没有出现了，我觉得这样很好。我一点儿也不想再见他。只要他没喝醉，又能抓到我，就总要狠揍我一顿。所以他在附近的时候，我大半时间都躲在树林里。
        - id: ch01-b10
          speaker: narrator
          text: 那阵子，有人在镇子上游十二英里左右的河里发现一具尸体。人们说，淹死的就是爸爸。那人的个头和他一样，穿得破破烂烂，头发也长得出奇。可尸体在水里泡了太久，脸已经不像脸，谁也辨认不出来。
        - id: ch01-b11
          speaker: narrator
          text: 据说尸体是仰面漂着的。人们把他捞起来，埋在河岸边。我刚放下心，忽然想起一件事。淹死的男人不会仰面漂，只会脸朝下。那具尸体不是爸爸，而是一个穿着男人衣裳的女人。
        - id: ch01-b12
          speaker: narrator
          text: 这么一来，我又不安了。那个老家伙迟早还会露面。我只盼他别回来。
        - id: ch01-b13
          speaker: narrator
          text: 接下来的一个月，我们偶尔还玩强盗游戏。后来我退出了，别的男孩也都散了。我们既没有抢过人，也没有杀过人，一切都只是假装。我们会从树林里猛冲出去，袭击赶猪的人，或者拦住赶车去卖菜的女人，可一次也没把谁抓走。
        - id: ch01-b14
          speaker: narrator
          text: 汤姆管猪叫“金锭”，管萝卜和别的蔬菜叫“珠宝”。回到山洞，我们就郑重其事地商量自己干了哪些大事，杀了多少人，又给多少人做了记号。可我一直不明白，这样玩到底有什么赚头。
        - id: ch01-b15
          speaker: narrator
          text: 有一回，汤姆叫一个男孩举着燃烧的木棍，在镇上到处跑。他说那是“号令”，全帮看见它就得集合。等大家到齐，他宣布密探送来了秘密消息。
        - id: ch01-b16
          speaker: tom_sawyer
          text: 明天，有一大群西班牙商人和富有的阿拉伯人要到洞穴谷扎营。他们带着两百头大象、六百峰骆驼，还有一千多匹驮骡。骡背上全是钻石，守卫却只有四百名士兵。咱们先埋伏好，再把他们全部杀掉，把财宝一扫而空。都回去把刀枪擦亮，做好准备！
        - id: ch01-b17
          speaker: narrator
          text: 汤姆就是这样。哪怕只去抢一辆萝卜车，他也非要大家把刀枪擦得锃亮。可我们的刀不过是木板条，枪也只是扫帚柄。就算一直擦到它们烂掉，也不会比原来多值一撮炉灰。
        - id: ch01-b18
          speaker: narrator
          text: 我不相信我们能打赢那么多西班牙人和阿拉伯人。不过我想看看骆驼和大象，所以第二天，也就是星期六，我准时赶去埋伏。信号一到，我们冲出树林，奔下山坡。
        - id: ch01-b19
          speaker: narrator
          text: 下面没有西班牙人，没有阿拉伯人，也没有骆驼和大象。只有主日学校出来野餐，而且还是最初级的小班。我们搅散了野餐，把孩子们追进山谷。最后只弄到几个炸面圈和一点儿果酱。本·罗杰斯抢到一个布娃娃，乔·哈珀拿到一本赞美诗集和一本宗教小册子。
        - id: ch01-b20
          speaker: narrator
          text: 老师随后冲了过来。我们只得扔下所有东西，拔腿就跑。
        - id: ch01-b21
          speaker: huck
          text: 我根本没看见钻石。
        - id: ch01-b22
          speaker: tom_sawyer
          text: 那里明明有成堆的钻石，还有阿拉伯人、大象和别的东西。
        - id: ch01-b23
          speaker: huck
          text: 那咱们怎么一样也看不见？
        - id: ch01-b24
          speaker: tom_sawyer
          text: 因为你太无知。你要是读过《堂吉诃德》，根本不会问。那全是魔法。那里本来有几百名士兵，还有大象和财宝。可咱们的仇敌魔法师故意捣鬼，把它们全变成了主日学校的幼儿班。
        - id: ch01-b25
          speaker: huck
          text: 那就好办了。咱们去收拾那些魔法师。
        - id: ch01-b26
          speaker: narrator
          text: 汤姆说我是个木头脑袋。
        - id: ch01-b27
          speaker: tom_sawyer
          text: 魔法师随手就能叫来一大群神怪。你连“杰克·鲁滨逊”都没说完，他们就把你剁碎了！那些神怪有树那么高，腰围跟教堂一样粗。
        - id: ch01-b28
          speaker: huck
          text: 那咱们也找一群神怪帮忙，不就能打赢他们了吗？
        - id: ch01-b29
          speaker: tom_sawyer
          text: 你打算从哪儿找来？
        - id: ch01-b30
          speaker: huck
          text: 我不知道。魔法师又是怎么找的？
        - id: ch01-b31
          speaker: tom_sawyer
          text: 他们只要擦一擦旧锡灯，或者擦一只铁环，神怪就会立刻冲过来。四周电闪雷鸣，浓烟翻滚。不管主人叫他们干什么，他们马上就干。拔起一座铅丸塔，再拿它砸主日学校校长的脑袋，他们连眼睛都不会眨一下。换了别人也照砸不误。
        - id: ch01-b32
          speaker: huck
          text: 谁能这么使唤他们？
        - id: ch01-b33
          speaker: tom_sawyer
          text: 谁擦灯或铁环，谁就是他们的主人。主人说什么，他们非做不可。你可以叫他们用钻石造一座四十英里长的宫殿，里头装满口香糖，或者装满任何你想要的东西。你也可以叫他们把中国皇帝的女儿带来给你做妻子。
        - id: ch01-b34
          speaker: tom_sawyer
          text: 这些事必须在第二天太阳升起以前办完。你想让宫殿在全国什么地方跳华尔兹，他们还得把整座宫殿搬过去。明白了吧？
        - id: ch01-b35
          speaker: huck
          text: 我看他们全是扁脑袋。造了宫殿，自己不留下，反倒白送给别人。再说了，要是我是神怪，有个人只擦一擦破锡灯，就想让我丢下手里的事去找他，那他等到天荒地老也别想见到我。
        - id: ch01-b36
          speaker: tom_sawyer
          text: 哈克·费恩，你说的这是什么话？只要他擦了灯，你就一定得去，愿不愿意都一样。
        - id: ch01-b37
          speaker: huck
          text: 什么？我都长得跟树一样高，腰围跟教堂一样粗了，还非去不可？行，那我就去。不过我准会叫那个人爬上全国最高的树。
        - id: ch01-b38
          speaker: tom_sawyer
          text: 呸，跟你说也没用。哈克·费恩，你怎么什么都不懂？简直是个大木瓜。
        - id: ch01-b39
          speaker: narrator
          text: 我把汤姆的话想了两三天，决定亲自试一试。我找来一盏旧锡灯和一只铁环，跑到树林里，使劲擦呀擦，擦得浑身冒汗，跟印第安人似的。我一心盘算着，等神怪造好宫殿，我就把它卖掉。
        - id: ch01-b40
          speaker: narrator
          text: 可神怪一个也没来。我这才认定，那又是汤姆·索亚编出来的谎话。他大概真信那些阿拉伯人和大象，我却不信。那些东西不管怎么看，都有一股主日学校的味道。
