audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
  chapters:
    - id: ch01
      title: 第十四章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 睡了一阵，我们起来清点那伙人从沉船上偷来的东西。靴子、毯子、衣服，各种杂物，什么都有，还有一大堆书、一架望远镜和三盒上等雪茄。我和吉姆这辈子从没这么富过。整个下午，我们都舒舒服服地躺在树林里，一面聊天，一面念书，抽着好雪茄，快活得很。
        - id: ch01-b02
          speaker: huck
          text: 我把沉船里和渡船上的事都讲给吉姆听，还告诉他，这种事就叫冒险。可吉姆说，他再也不想碰上任何冒险了。我钻进顶层舱房时，他爬回去找木筏，却发现木筏不见了，差点儿当场吓死。他觉得事情不管怎么收场，自己都完了。没人救，他会淹死。有人救，对方又会为了领赏把他送回去，沃森小姐准会把他卖到南方去。
        - id: ch01-b03
          speaker: huck
          text: 吉姆说得没错。他几乎总是对的。一个黑人能有这么清醒的头脑，真不寻常。
        - id: ch01-b04
          speaker: huck
          text: 我又给吉姆念起国王、公爵和伯爵的故事。我告诉他，这些人穿得花里胡哨，排场大得不得了，彼此不叫先生，倒叫陛下、殿下、爵爷，还有一大串别的尊称。吉姆越听越来劲，眼睛都瞪圆了。
        - id: ch01-b05
          speaker: jim
          text: 我真不知道世上有这么多这种人。除了老所罗门王，我差不多一个也没听过。纸牌里的那些国王不算。一个国王能挣多少钱？
        - id: ch01-b06
          speaker: huck
          text: 挣钱？他们想要的话，一个月能拿一千块。他们爱拿多少就拿多少，天下什么东西都是他们的。
        - id: ch01-b07
          speaker: jim
          text: 这日子可真美！那他们平时要干什么，哈克？
        - id: ch01-b08
          speaker: huck
          text: 什么也不干呀！你怎么会这么问？他们就坐在那里。
        - id: ch01-b09
          speaker: jim
          text: 不会吧，当真？
        - id: ch01-b10
          speaker: huck
          text: 当然当真。他们就是坐着。赶上打仗，也许会上战场。平时就闲着，或者放鹰打猎，放鹰，还有放……嘘！你听见动静了吗？
        - id: ch01-b11
          speaker: huck
          text: 我们赶紧蹿出去查看。其实什么事也没有，只是一艘蒸汽船正在很远的下游绕过河湾，明轮扑腾扑腾的响声顺水传了过来。我们这才又回到原地。
        - id: ch01-b12
          speaker: huck
          text: 我接着告诉吉姆，国王闲得发闷时，也会找议会的麻烦。谁要不完全顺着他，他就砍谁的脑袋。不过，他们大多数时候都在后宫里晃荡。
        - id: ch01-b13
          speaker: jim
          text: 你说他们在哪个宫？
        - id: ch01-b14
          speaker: huck
          text: 我说的是后宫。
        - id: ch01-b15
          speaker: jim
          text: 后宫是干什么的？
        - id: ch01-b16
          speaker: huck
          text: 是国王安置老婆的地方。你连这个都不知道？所罗门就有后宫。他大概有一百万个老婆。
        - id: ch01-b17
          speaker: jim
          text: 对呀，我把这事忘了。我看，后宫就跟一家大寄宿公寓差不多。你想，那么多孩子挤在育儿房里，肯定成天闹翻天。那些老婆又免不了吵个不停，这一来就更吵了。可人家还说，所罗门是世上最聪明的人。我才不信。
        - id: ch01-b18
          speaker: jim
          text: 聪明人会愿意天天住在那种叮叮咣咣的地方吗？绝对不会。真聪明的人会盖一家锅炉厂。等他想歇着，就让锅炉厂停工。
        - id: ch01-b19
          speaker: huck
          text: 可所罗门就是最聪明的人。寡妇亲口跟我说的。
        - id: ch01-b20
          speaker: jim
          text: 寡妇怎么说我都不管，所罗门根本不聪明。他有些做法，荒唐得不得了。那个他想劈成两半的孩子，你知道吧？
        - id: ch01-b21
          speaker: huck
          text: 知道，寡妇把那件事全讲给我听了。
        - id: ch01-b22
          speaker: jim
          text: 那不就得了！世上还有比这更离谱的主意吗？你仔细瞧。那边的树桩算一个女人，你算另一个女人，我是所罗门，这一块钱就是孩子。你们俩都说钱是自己的。
        - id: ch01-b23
          speaker: jim
          text: 我该怎么办？当然该跑遍左邻右舍，查清这张钞票到底是谁的，再安安全全、完完整整地交给真正的主人。稍微有点脑子的人都会这么做。可所罗门不。他要啪地把钱劈成两半，一半给你，一半给那个女人。他当时就是想这么处置孩子。
        - id: ch01-b24
          speaker: jim
          text: 你说，半张钞票有什么用？什么也买不了。半个孩子又能有什么用？就是给我一百万个，我也不肯花一个子儿。
        - id: ch01-b25
          speaker: huck
          text: 见鬼，吉姆，你压根儿没明白这里面的道理。你离那个要点足有一千英里。
        - id: ch01-b26
          speaker: jim
          text: 我没明白？去你的吧，别跟我扯什么要点。我碰上有道理的事，自然看得出来。可这种做法一点道理也没有。他们争的是一个完整的孩子，又不是半个孩子。谁想拿半个孩子解决这场争端，谁就是个下雨都不知道进屋的傻瓜。
        - id: ch01-b27
          speaker: jim
          text: 别跟我讲所罗门了，哈克。他是什么货色，我早就看透了。
        - id: ch01-b28
          speaker: huck
          text: 可你就是没明白那个要点。
        - id: ch01-b29
          speaker: jim
          text: 让那个要点见鬼去吧！我自己知道得很清楚。其实真正的要点藏得更深，得看所罗门是怎么长大的。一个人只有一两个孩子，他舍得糟蹋吗？当然舍不得。他糟蹋不起，知道孩子有多金贵。
        - id: ch01-b30
          speaker: jim
          text: 可要是一个人家里有差不多五百万个孩子满地乱跑，那就完全两样了。他劈起孩子来，跟劈一只猫差不多。反正家里还有的是。多一个孩子，少两个孩子，对所罗门根本不算什么。这个该死的家伙！
        - id: ch01-b31
          speaker: huck
          text: 我从没见过吉姆这样的人。他只要认准一件事，谁也别想把那个念头从他脑袋里撬走。我见过的黑人里，没有谁比他更瞧不上所罗门。于是我放下所罗门，改讲别的国王。
        - id: ch01-b32
          speaker: huck
          text: 我告诉吉姆，很久以前，法国人砍了路易十六的脑袋。他的小儿子叫“海豚”，本来会成为国王，可后来被关进监狱。有人说，他就死在里面了。
        - id: ch01-b33
          speaker: jim
          text: 可怜的小家伙。
          emotion: sad
        - id: ch01-b34
          speaker: huck
          text: 也有人说，他逃出监狱，跑到美国来了。
        - id: ch01-b35
          speaker: jim
          text: 那倒好！可他一定孤单得很。哈克，咱们这儿没有国王，对吧？
        - id: ch01-b36
          speaker: huck
          text: 咱们这儿没有国王。
        - id: ch01-b37
          speaker: jim
          text: 那他可找不到差事。他靠什么生活？
        - id: ch01-b38
          speaker: huck
          text: 我也不知道。有些国王去当警察，有些教人说法国话。
        - id: ch01-b39
          speaker: jim
          text: 哈克，法国人说话难道跟咱们不一样？
        - id: ch01-b40
          speaker: huck
          text: 当然不一样，吉姆。他们说的话，你连一个字也听不懂。
        - id: ch01-b41
          speaker: jim
          text: 哎呀我的老天！怎么会有这种事？
        - id: ch01-b42
          speaker: huck
          text: 我也不知道，反正就是这样。我从书里学了几句他们的胡话。要是有人走过来，对你说“巴莱呜弗朗赛”，你会怎么想？
        - id: ch01-b43
          speaker: jim
          text: 我什么也不想，直接一拳把他的脑袋打开花。当然，他要是白人就算了。可哪个黑人敢这样骂我，我绝不饶他。
        - id: ch01-b44
          speaker: huck
          text: 胡说，他没骂你。他只是问你会不会说法国话。
        - id: ch01-b45
          speaker: jim
          text: 那他为什么不直接这么问？
        - id: ch01-b46
          speaker: huck
          text: 他就是这么问的呀。法国人的问法就是那样。
        - id: ch01-b47
          speaker: jim
          text: 那种问法真是该死的荒唐。我不想再听了，根本没有道理。
        - id: ch01-b48
          speaker: huck
          text: 你听着，吉姆。猫跟咱们一样说话吗？
        - id: ch01-b49
          speaker: jim
          text: 不一样。
        - id: ch01-b50
          speaker: huck
          text: 那牛跟咱们一样说话吗？
        - id: ch01-b51
          speaker: jim
          text: 牛也不一样。
        - id: ch01-b52
          speaker: huck
          text: 那猫说话像牛吗？牛说话像猫吗？
        - id: ch01-b53
          speaker: jim
          text: 它们说得不一样。
        - id: ch01-b54
          speaker: huck
          text: 它们本来就该说得不同，对不对？
        - id: ch01-b55
          speaker: jim
          text: 当然是这样。
        - id: ch01-b56
          speaker: huck
          text: 那么，猫和牛不照咱们的样子说话，不也很自然吗？
        - id: ch01-b57
          speaker: jim
          text: 那当然自然。
        - id: ch01-b58
          speaker: huck
          text: 既然这样，法国人说话跟咱们不同，为什么就不自然？你回答我。
        - id: ch01-b59
          speaker: jim
          text: 猫是人吗，哈克？
        - id: ch01-b60
          speaker: huck
          text: 猫当然不是人。
        - id: ch01-b61
          speaker: jim
          text: 那猫不照人的样子说话，不是很应该吗？牛是人吗？还是说，牛是猫？
        - id: ch01-b62
          speaker: huck
          text: 都不是。
        - id: ch01-b63
          speaker: jim
          text: 所以，牛没道理学人说话，也没道理学猫说话。法国人是人吗？
        - id: ch01-b64
          speaker: huck
          text: 法国人当然是人。
        - id: ch01-b65
          speaker: jim
          text: 那不就得了！该死，他为什么不照人的样子说话？你回答我这个！
        - id: ch01-b66
          speaker: huck
          text: 我一看就知道，再费口舌也没用。你根本教不会一个黑人怎么讲道理。于是我不说了。
