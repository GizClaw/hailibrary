audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    jim:
      display_name: Jim
      tts:
        delivery: wary and expressive
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XIV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: When we got up after a while, we looked through everything the gang had stolen from the wreck. There were boots, blankets, clothes, books, a spyglass, three boxes of cigars, and all kinds of other things. Neither of us had ever been so rich. The cigars were first-rate. We spent the whole afternoon lying around in the woods, talking and reading the books and having a fine time.
        - id: ch01-b02
          speaker: huck
          text: I told Jim what had happened inside the wreck and on the ferryboat. I said that was the kind of thing you called an adventure.
        - id: ch01-b03
          speaker: jim
          text: I don't want any more adventures. When you went inside that cabin on the boat, I crawled back and found the raft gone. I nearly died. No matter what happened, I was finished. If nobody saved me, I'd drown. If somebody did save me, he'd send me home for the reward, and then Miss Watson would surely sell me South.
        - id: ch01-b04
          speaker: huck
          text: Jim was right. He was almost always right, and he had an uncommon level head for a Black man.
        - id: ch01-b05
          speaker: huck
          text: I read Jim a good deal about kings, dukes, earls, and people like that. The books told how grandly they dressed, how much style they put on, and how everyone called them Your Majesty, Your Grace, and Your Lordship instead of Mister. Jim's eyes went wide. He wanted to hear more.
        - id: ch01-b06
          speaker: jim
          text: I never knew there were so many of them. I hardly ever heard of any king except old King Solomon, unless you count the kings in a pack of cards. How much does a king earn?
        - id: ch01-b07
          speaker: huck
          text: You mean how much do they earn? Why, they can get a thousand dollars a month if they want it. They can have as much as they like. Everything belongs to them.
        - id: ch01-b08
          speaker: jim
          text: Well, isn't that grand? What do they have to do, Huck?
        - id: ch01-b09
          speaker: huck
          text: They don't do anything. They just sit around.
        - id: ch01-b10
          speaker: jim
          text: No, I can't believe it. Is that really so?
        - id: ch01-b11
          speaker: huck
          text: Of course. They sit around unless there's a war, and then they go fight. The rest of the time they loaf or go hawking, or they... Sh! Did you hear something?
        - id: ch01-b12
          speaker: huck
          text: We jumped up and looked. It was only the flutter of a steamboat's wheel far down the river, coming around the point, so we went back.
        - id: ch01-b13
          speaker: huck
          text: When things get dull, kings quarrel with Parliament. If everybody doesn't behave just right, a king chops off their heads. Mostly, though, they hang around the harem.
        - id: ch01-b14
          speaker: jim
          text: They hang around the what?
        - id: ch01-b15
          speaker: huck
          text: It's called the harem.
        - id: ch01-b16
          speaker: jim
          text: What's a harem?
        - id: ch01-b17
          speaker: huck
          text: It's where a king keeps his wives. Don't you know about harems? Solomon had one. He had about a million wives.
        - id: ch01-b18
          speaker: jim
          text: Oh, that's right. I'd forgotten. I reckon a harem is a boardinghouse. That nursery must be mighty noisy, and all those wives must quarrel plenty. That would make it noisier still. Folks say Solomon was the wisest man who ever lived, but I don't believe it. Would a wise man choose to live in the middle of all that racket? No, he wouldn't. A wise man would build a boiler factory. Then, when he wanted some rest, he could shut the factory down.
        - id: ch01-b19
          speaker: huck
          text: But Solomon was the wisest man, anyway. The widow told me so herself.
        - id: ch01-b20
          speaker: jim
          text: I don't care what the widow says. He wasn't wise. He had some of the strangest ways I ever heard of. You know about the child he planned to chop in two, don't you?
        - id: ch01-b21
          speaker: huck
          text: Yes. The widow told me the whole story.
        - id: ch01-b22
          speaker: jim
          text: Well, then! Wasn't that the wildest idea in the world? Look here a minute. That stump is one woman, and you're the other. I'm Solomon, and this dollar bill is the child. Both of you claim it. Now, what should I do? Shouldn't I ask around the neighborhood, find out who the bill belongs to, and hand it back safe and whole? That's what anybody with sense would do. But no. I cut the bill in two. You get one half, and the other woman gets the other half. That's what Solomon meant to do with the child. Half a bill can't buy anything, and half a child isn't worth a thing. I wouldn't give a darn for a million of them.
        - id: ch01-b23
          speaker: huck
          text: Hang it, Jim, you've missed the point completely. You've missed it by a thousand miles.
        - id: ch01-b24
          speaker: jim
          text: Me? Go on. Don't talk to me about your point. I know sense when I see it, and there's no sense in that. The argument was about a whole child, not half a child. A man who thinks he can settle a fight over a whole child by cutting it in half doesn't know enough to come in out of the rain. Don't tell me about Solomon, Huck. I know him through and through.
        - id: ch01-b25
          speaker: huck
          text: I'm telling you, you don't understand the point.
        - id: ch01-b26
          speaker: jim
          text: Forget the point. I know what I know. And the real trouble goes deeper. It's how Solomon was raised. Take a man with only one or two children. Would he waste children? No. He couldn't afford to. He knows what they're worth. But a man with five million children running around the house is different. He'd just as soon cut a child in two as cut a cat. There are plenty more. One child more or less meant nothing to Solomon, darn him!
        - id: ch01-b27
          speaker: huck
          text: I never saw anybody like Jim. Once he got an idea into his head, nothing could pull it out. Nobody could have been more against Solomon than Jim was. So I dropped Solomon and started telling him about other kings.
        - id: ch01-b28
          speaker: huck
          text: I told him about Louis the Sixteenth, whose head was cut off in France a long time ago. Then I told him about Louis's little boy, the Dauphin. He would have become king, but they locked him in jail, and some people said he died there.
        - id: ch01-b29
          speaker: jim
          text: I feel sorry for that poor little fellow.
          emotion: sad
        - id: ch01-b30
          speaker: huck
          text: But some people say he escaped, came to America, and got away.
        - id: ch01-b31
          speaker: jim
          text: That's good! But he'll be pretty lonely. There aren't any kings here, are there, Huck?
          emotion: happy
        - id: ch01-b32
          speaker: huck
          text: No, there aren't any kings here.
        - id: ch01-b33
          speaker: jim
          text: Then he can't get a position as a king. What's he going to do?
        - id: ch01-b34
          speaker: huck
          text: I don't know. Some former kings join the police, and some teach people to speak French.
        - id: ch01-b35
          speaker: jim
          text: Huck, don't French people talk the same way we do?
        - id: ch01-b36
          speaker: huck
          text: No, Jim. You couldn't understand one word they said.
        - id: ch01-b37
          speaker: jim
          text: Well, I'll be darned! How did that happen?
          emotion: surprised
        - id: ch01-b38
          speaker: huck
          text: I don't know, but it's true. I found some French talk in a book. Suppose a man came up and said, "Polly-voo-franzy." What would you think?
        - id: ch01-b39
          speaker: jim
          text: I wouldn't stop to think. I'd hit him over the head, unless he was white. I wouldn't let any Black man call me that.
        - id: ch01-b40
          speaker: huck
          text: Shucks, he isn't calling you anything. He's only asking whether you know how to speak French.
        - id: ch01-b41
          speaker: jim
          text: Then why doesn't he just say that?
        - id: ch01-b42
          speaker: huck
          text: He is saying it. That's how a Frenchman says it.
        - id: ch01-b43
          speaker: jim
          text: Well, it's a ridiculous way to talk, and I don't want to hear any more about it. It doesn't make sense.
        - id: ch01-b44
          speaker: huck
          text: Look here, Jim. Does a cat talk the way we do?
        - id: ch01-b45
          speaker: jim
          text: No, a cat doesn't.
        - id: ch01-b46
          speaker: huck
          text: Does a cow?
        - id: ch01-b47
          speaker: jim
          text: No, a cow doesn't either.
        - id: ch01-b48
          speaker: huck
          text: Does a cat talk like a cow, or a cow like a cat?
        - id: ch01-b49
          speaker: jim
          text: No, they don't.
        - id: ch01-b50
          speaker: huck
          text: Then it's natural and proper for them to talk differently from each other, isn't it?
        - id: ch01-b51
          speaker: jim
          text: Of course that's natural.
        - id: ch01-b52
          speaker: huck
          text: And it's natural and proper for cats and cows to talk differently from us, isn't it?
        - id: ch01-b53
          speaker: jim
          text: Why, certainly it is.
        - id: ch01-b54
          speaker: huck
          text: Then why isn't it natural and proper for a Frenchman to talk differently from us? Answer that.
        - id: ch01-b55
          speaker: jim
          text: Is a cat a man, Huck?
        - id: ch01-b56
          speaker: huck
          text: No, a cat isn't a man.
        - id: ch01-b57
          speaker: jim
          text: Then it wouldn't make sense for a cat to talk like a man. Is a cow a man? Or is a cow a cat?
        - id: ch01-b58
          speaker: huck
          text: No. She isn't either one.
        - id: ch01-b59
          speaker: jim
          text: Then she has no business talking like either of them. Is a Frenchman a man?
        - id: ch01-b60
          speaker: huck
          text: Yes, a Frenchman is a man.
        - id: ch01-b61
          speaker: jim
          text: Well, then! Darn it, why doesn't he talk like a man? You answer me that!
        - id: ch01-b62
          speaker: huck
          text: I could see there was no use wasting words. You couldn't teach a Black man to argue, so I quit.
