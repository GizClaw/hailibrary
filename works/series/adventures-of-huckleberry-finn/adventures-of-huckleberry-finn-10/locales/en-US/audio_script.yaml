audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    jim:
      display_name: Jim
      tts:
        delivery: wary and expressive
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER X.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: After breakfast, I wanted to talk about the dead man. I kept wondering how he got killed, who shot him, and why. Jim would not discuss it. He said talking about the man would bring bad luck. Besides, the man might come back and haunt us. A man who had never been buried, Jim said, was more likely to wander around than one who was settled comfortably in the ground. That sounded reasonable, so I let the subject drop. But I could not stop thinking about it.
        - id: ch01-b02
          speaker: huck
          text: We searched through the clothes we had taken from the house. Inside the lining of an old blanket coat, we found eight silver dollars sewn up tight. Jim figured the people in the house must have stolen the coat. If they had known about the money, they would never have left it behind. I said maybe they had killed the dead man too, but Jim wanted no more of that talk.
        - id: ch01-b03
          speaker: huck
          text: You call this bad luck, Jim? What did you tell me when I brought back that snakeskin from the ridge the day before yesterday? You said touching a snakeskin was the worst luck there was. Well, just look at our bad luck now. We got all this stuff, plus eight dollars. I wish this kind of bad luck came every day.
        - id: ch01-b04
          speaker: jim
          text: Never mind, honey. Just never mind. Don't get too pleased with yourself. That bad luck is coming. You remember I told you so.
        - id: ch01-b05
          speaker: huck
          text: And it did come. We had that talk on Tuesday. After dinner on Friday, we were lying in the grass at the upper end of the ridge when our tobacco ran out. I went to the cavern for more and found a rattlesnake inside. I killed it, curled it at the foot of Jim's blanket so it looked alive, and thought it would be a fine joke when he saw it. By nighttime, I had forgotten all about it. Jim threw himself down on the blanket while I was lighting up the cave. The dead snake's mate was there, and it bit him.
        - id: ch01-b06
          speaker: huck
          text: Jim sprang up yelling. As soon as the light caught the snake, I saw it coiled and ready to strike again. I grabbed a stick and killed it right away. Jim seized pap's whisky jug and began swallowing the liquor.
        - id: ch01-b07
          speaker: huck
          text: Jim had no shoes on, and the snake had bitten him square on the heel. It was all because I had been fool enough to forget that a dead snake's mate will come find it and curl up beside it.
        - id: ch01-b08
          speaker: jim
          text: Chop that snake's head off and throw the head away. Then skin the body, roast me a piece, and bring it here. Eating that will help cure me. Take those rattles off too. Tie them around my wrist. They'll help.
        - id: ch01-b09
          speaker: huck
          text: I did everything Jim told me, and he ate the roasted piece. Then I slipped away quietly and threw both snakes far out among the bushes. I did not mean to let Jim discover that the whole thing was my fault, if I could keep him from finding out.
        - id: ch01-b10
          speaker: huck
          text: Jim kept drinking from the jug. Now and then his mind wandered, and he thrashed around and yelled. Whenever his senses came back, he started drinking again. His foot swelled badly, and then his leg did too. After a while the whisky began to make him drunk, so I judged he would be all right. Still, I would rather have taken the snakebite than pap's whisky.
        - id: ch01-b11
          speaker: huck
          text: Jim could not get around for four days and four nights. Then the swelling disappeared, and he was on his feet again. After seeing what had happened, I decided I would never pick up another snakeskin with my bare hands.
        - id: ch01-b12
          speaker: jim
          text: Maybe next time you'll believe what I tell you. Touching a snakeskin brings such terrible luck that this trouble might not be over yet. I'd sooner look at the new moon over my left shoulder a thousand times than pick up one snakeskin.
        - id: ch01-b13
          speaker: huck
          text: I was beginning to agree with him, though I had always thought looking at the new moon that way was about the most careless, foolish thing anyone could do. Old Hank Bunker tried it once and bragged about it. Less than two years later, he got drunk and fell off the shot tower. The fall flattened him out like a layer. Folks said they slid him sideways between two barn doors, used them for his coffin, and buried him that way. I did not see it myself. Pap told me. But however it happened, it all came from Hank looking at the moon over his left shoulder like a fool.
        - id: ch01-b14
          speaker: huck
          text: The days passed, and the river settled back between its banks. One of the first things we did was skin a rabbit, bait a big hook with it, and set the line. We caught a catfish as big as a man. It was six feet two inches long and weighed more than two hundred pounds. There was no way we could handle it. That fish would have flung us clear into Illinois. We sat and watched it tear around until it drowned.
        - id: ch01-b15
          speaker: huck
          text: When we opened the catfish, we found a brass button, a round ball, and all kinds of rubbish in its stomach. We split the ball with the hatchet and found a spool inside. Jim said the spool must have been there a long time for the fish to coat it over into a ball.
        - id: ch01-b16
          speaker: huck
          text: I reckon it was as big a fish as anybody ever caught in the Mississippi. Jim had never seen a bigger one. It would have brought a good price over in the village. At the market house, they sell a fish that size by the pound, and everybody buys a share. The meat is white as snow and fries up well.
        - id: ch01-b17
          speaker: huck
          text: The next morning, I told Jim things were getting slow and dull. I wanted to stir them up somehow. I thought I might slip across the river and learn what was happening in town.
        - id: ch01-b18
          speaker: jim
          text: That's a good idea, but go after dark and keep a sharp watch. Say, couldn't you put on some of those old clothes and pass yourself off as a girl?
        - id: ch01-b19
          speaker: huck
          text: That was a good idea too. We shortened one of the calico dresses. I rolled my trouser legs up to my knees and climbed into it. Jim fastened the hooks down the back, and it fit well enough. Then I put on a sunbonnet and tied it beneath my chin. Anybody trying to see my face had to look down a stovepipe of cloth.
        - id: ch01-b20
          speaker: jim
          text: Why, hardly anybody would know you, even in daylight. But you don't walk like a girl. And quit hiking up that dress every time you reach for your trouser pocket.
        - id: ch01-b21
          speaker: huck
          text: I practiced in the dress all day until I got the hang of it. I paid attention to Jim's advice, and soon I did better. Just after dark, I took the canoe and started up the Illinois shore.
        - id: ch01-b22
          speaker: huck
          text: I turned toward town from a little below the ferry landing. The current carried me down to the lower end of town, where I tied the canoe and walked along the riverbank.
        - id: ch01-b23
          speaker: huck
          text: A light was shining from a little shanty that had stood empty for a long time. I wondered who had moved in. I crept close and peeked through the window. A woman of about forty sat inside, knitting beside a candle on a pine table. Her face was new to me. She had to be a stranger, because there was not a face in town I did not know.
        - id: ch01-b24
          speaker: huck
          text: That was lucky. My courage had been fading ever since I arrived. I was afraid somebody would recognize my voice and uncover me. But if this woman had lived in such a small town for even two days, she could tell me everything I wanted to learn. So I knocked on her door and made up my mind to remember that I was a girl.
