audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
  chapters:
    - id: ch01
      title: 第十章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 吃完早饭，我很想和吉姆谈谈木屋里的死人，猜猜他究竟怎么给人杀了。吉姆却不愿开口。他说，谈死人会招晦气，那人还可能回来缠着我们。没下葬的人不能舒舒服服躺在土里，比已经埋好的人更爱四处闹鬼。我听着挺有道理，也就不再说了。可是心里一直放不下，总想弄清是谁开的枪，又为什么要杀他。
        - id: ch01-b02
          speaker: huck
          text: 我们翻检从木屋带回来的衣服，竟在一件旧粗呢大衣的衬里摸到八块银元，钱全缝在里面。吉姆猜，那些人准是偷来了大衣。要是知道里面有钱，他们才舍不得丢。我说，也许死人也是他们杀的。吉姆还是不肯谈。我便拿前两天的事逗他。
        - id: ch01-b03
          speaker: huck
          text: 你说摸蛇皮是世上最倒霉的事。可你瞧，咱们得了这么一大堆东西，还有八块钱！吉姆，要是天天都能这样倒霉，我可求之不得。
        - id: ch01-b04
          speaker: jim
          text: 别急，宝贝儿，等着瞧吧。你可别这么早就得意。晦气就要来了，我告诉你，它一定会来。
        - id: ch01-b05
          speaker: huck
          text: 吉姆说中了。那番话是星期二讲的。到了星期五午饭后，我们躺在山脊上头的草地里，烟叶没了。我回岩洞去取，看见里面有条响尾蛇。我打死它，再把蛇盘好，摆在吉姆毯子的脚头，弄得跟活的一样，只等他发现时吓一跳。可到了晚上，我把这件事忘得干干净净。我点火的时候，吉姆一头倒在毯子上。那条死蛇的配偶正盘在旁边，一口咬住了他。
        - id: ch01-b06
          speaker: huck
          text: 吉姆大叫一声跳起来。火光刚亮，我便看见那畜生盘着身子，还要再扑。我抄起棍子，一下打死了它。吉姆抓过爹留下的威士忌酒壶，仰起头便往肚里灌。
        - id: ch01-b07
          speaker: huck
          text: 他没穿鞋，脚后跟正好挨了一口。都怪我太蠢，忘了死蛇丢在哪里，它的配偶总会找来，盘在尸体旁边。吉姆让我砍下蛇头扔掉，剥了蛇皮，再烤一块肉给他吃。我全照办了。他说蛇肉能帮着解毒，又叫我取下蛇尾的响环，绑到他手腕上，说这也有用。
        - id: ch01-b08
          speaker: huck
          text: 过后我偷偷溜出去，把两条蛇都远远扔进灌木丛。只要瞒得住，我绝不能让吉姆知道，这场祸全怪我。
        - id: ch01-b09
          speaker: huck
          text: 吉姆抱着酒壶不停地喝。有时他神志昏乱，满地翻滚，嘴里大喊大叫。每回清醒一点，又抓起酒壶猛喝。他的脚肿得老大，整条腿也跟着肿。后来酒劲终于上来了，我便觉得他不会有事。不过，若让我挑，我宁肯挨蛇咬，也不喝爹的威士忌。
        - id: ch01-b10
          speaker: huck
          text: 吉姆躺了整整四天四夜，肿才全消，又能走动了。这回我亲眼见到蛇皮带来的祸，从此再也不敢伸手碰它。吉姆说，下回我总该信他了。他还觉得，摸蛇皮的晦气这么大，我们遇到的也许还不是全部。
        - id: ch01-b11
          speaker: jim
          text: 叫我从左肩上看一千次新月，也比亲手拿一次蛇皮强。
        - id: ch01-b12
          speaker: huck
          text: 我也慢慢信了。虽说在我看来，从左肩上看新月，本来就是顶冒失、顶愚蠢的事。老汉克·邦克干过一回，还到处吹嘘。不到两年，他喝醉后从铅弹塔上摔了下来，整个人摊得薄薄的，简直只剩一层。听说人们只能把他侧着塞进两扇谷仓门中间，当成棺材埋掉。我没亲眼看见，是爹告诉我的。不管怎样，事情都怪汉克像个傻瓜似的从那边看月亮。
        - id: ch01-b13
          speaker: huck
          text: 日子慢慢过去，河水重新退回两岸之间。我们很快用一只剥皮兔子做饵，挂上大鱼钩，钓到一条人那么大的鲶鱼。它足有六英尺两英寸长，两百多磅重。我们当然弄不住它，它一甩就能把我们扔到伊利诺伊州去。于是两个人只管坐着，看它猛冲乱撞，直到死去。
        - id: ch01-b14
          speaker: huck
          text: 剖开鱼肚，我们找到一枚铜纽扣、一个圆球，还有一大堆破烂。斧头劈开圆球，里面竟是一个线轴。吉姆说，线轴一定在鱼肚里待了很久，外面才会一层层裹成球。我猜密西西比河里从没钓到过更大的鱼，吉姆也说自己从没见过更大的。拿到村里，这鱼准能卖很多钱。市场会把它按磅切开，人人都来买。鱼肉白得像雪，煎出来可香了。
        - id: ch01-b15
          speaker: huck
          text: 第二天早上，我嫌日子过得又慢又闷，想找点动静。我打算偷偷渡河，探听外面发生了什么。吉姆很赞成，只叮嘱我要趁黑去，处处当心。他想了想，又问我能不能穿上木屋带回来的旧衣服，扮成姑娘。这也是个好主意。
        - id: ch01-b16
          speaker: huck
          text: 我们改短一条印花布裙。我把裤腿卷到膝盖，再把裙子套上，吉姆从背后替我扣好，居然挺合身。我戴上遮阳女帽，把带子系在下巴底下。别人想看清我的脸，就像朝一截长长的火炉烟筒里往下瞧。
        - id: ch01-b17
          speaker: jim
          text: 这副模样，就算大白天，也没几个人认得出你。
        - id: ch01-b18
          speaker: huck
          text: 我穿着那身衣裳练了一整天，渐渐摸清该怎么行动。吉姆说我走路还不像姑娘，而且每次想掏裤兜，我都会把裙子往上提。我把这些话记在心里，后来装得好多了。
        - id: ch01-b19
          speaker: huck
          text: 天刚黑，我划着独木舟，顺伊利诺伊州的河岸出发了。我从渡口下游一点横过河，水流把船送到镇子下头。我系好船，沿岸往前走。前面有间很久没人住的小棚屋，这会儿里面却亮着灯。我想知道谁住了进去，便悄悄靠近，趴在窗口往里看。
        - id: ch01-b20
          speaker: huck
          text: 屋里有个四十来岁的女人，正坐在松木桌旁，借着蜡烛光织东西。那张脸我从没见过，她一定是外乡人。镇上的人只要站到我面前，就没有我不认识的。这回我的运气真不错。
        - id: ch01-b21
          speaker: huck
          text: 我本来已经有些泄气，也开始害怕自己不该来。镇上的人或许会听出我的声音，拆穿我的身份。可是这个女人哪怕只在小镇住了两天，也足够把我想知道的消息全告诉我。于是我敲了敲门，暗暗提醒自己，千万别忘了，我现在是个姑娘。
