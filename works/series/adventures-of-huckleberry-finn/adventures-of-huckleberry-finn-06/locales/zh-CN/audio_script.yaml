audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    pap:
      display_name: 爸爸
      tts:
        delivery: 粗暴多疑，醉意里带着蛮横和自怜
        timbre: 沙哑粗粝
        pace: 忽快忽慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 没过多久，老头子又能起来走动了。他把撒切尔法官告上法庭，非要拿回那笔钱。他也来找我的麻烦，因为我不肯退学。有两回他逮住我，把我狠狠抽了一顿。可我还是照常上学，平时要么躲开他，要么跑得比他快。以前我本来不大想念书，现在倒偏要去，好气气爸爸。
        - id: ch01-b02
          speaker: huck
          text: 那场官司拖得没完没了，像是永远也开不了庭。为了不挨牛皮鞭，我只好隔些日子就向法官借两三块钱给他。他一有钱就喝醉，喝醉了就在镇上闹，闹完就被关进牢里。这样的日子正合他的心意。
        - id: ch01-b03
          speaker: huck
          text: 他总在寡妇家附近晃悠。寡妇终于警告他，再不滚开，她就要给他点颜色看看。这下他可气坏了，说非让大家知道谁才是我的主人。
        - id: ch01-b04
          speaker: huck
          text: 春天里有一天，他守住我，把我抓进小划子，沿河往上划了约三英里，又渡到伊利诺伊州那岸。那里全是树林，一所房子也没有。密密的树丛里藏着一间破圆木屋，不知道地方的人怎么也找不到。
        - id: ch01-b05
          speaker: huck
          text: 爸爸整天把我带在身边，我一点逃跑的空子也没有。我们住进那间破屋。他每晚都锁门，把钥匙压在脑袋底下。他有一杆枪，我猜也是偷来的。我们靠打鱼、打猎过活。
        - id: ch01-b06
          speaker: huck
          text: 每隔一阵，他就把我锁在屋里，走三英里到渡口的铺子去。他拿鱼和野味换回威士忌，喝得烂醉，自己快活够了，再揍我一顿。后来寡妇打听到我的下落，派人过河来救我。爸爸端着枪，把那个人赶跑了。
        - id: ch01-b07
          speaker: huck
          text: 没多久，我就住惯了，甚至还挺喜欢。除了挨牛皮鞭以外，那日子又懒散又快活。我能整天舒舒服服地躺着，抽烟，钓鱼，没有书，也不用做功课。
        - id: ch01-b08
          speaker: huck
          text: 两个多月一晃就过去了，我的衣裳成了一身又脏又破的布条。我都想不通，以前怎么会喜欢寡妇家。到了那里，得洗脸，得用盘子吃饭，得梳头，还得按时睡觉、按时起床。天天为书本伤脑筋，老华生小姐还总在旁边啄个不停。
        - id: ch01-b09
          speaker: huck
          text: 我一点也不想回去。寡妇不许我骂脏话，我原先已经戒掉了。现在爸爸不反对，我就又骂了起来。总的说来，林子里的日子很不错。
        - id: ch01-b10
          speaker: huck
          text: 可后来，爸爸的山核桃木棍越使越顺。我浑身都是一道道肿痕，实在受不住了。他出门也越来越勤，每回都把我锁起来。有一次，他走了整整三天。屋里孤单得吓人。我猜他可能淹死了，那我一辈子也别想出去。想到这里，我害怕起来，决定无论如何也得逃走。
        - id: ch01-b11
          speaker: huck
          text: 我早就试过好多回，可木屋没有出路。窗洞小得连狗都钻不过去，烟囱窄得没法爬，门又是厚实的橡木板。爸爸每次出门都仔细检查，不留下一把刀，也不留下别的工具。我大概把屋里搜过一百遍。其实我一直在搜，因为除此以外，也没别的办法消磨时间。
        - id: ch01-b12
          speaker: huck
          text: 这一回，我终于在屋顶的椽子和木瓦之间找到一把旧木锯。锯子生了锈，连把手也没有。我给锯条抹上油，就动起手来。
        - id: ch01-b13
          speaker: huck
          text: 木屋尽头的桌子后面钉着一条旧马毯，专门挡住圆木缝里钻进来的风，免得蜡烛被吹灭。我钻到桌下，掀起毯子，开始锯最底下那根粗圆木。我想锯出一个洞，大小只要够自己钻出去就行。这活儿费了好大工夫。眼看快成了，我突然听见林子里传来爸爸的枪声。我赶快收拾好痕迹，放下毯子，把锯藏起来。没多久，他进了屋。
        - id: ch01-b14
          speaker: huck
          text: 爸爸的心情很坏。换句话说，他和平常一样。他说自己去了镇上，什么事都不顺。律师告诉他，只要官司总算开审，他多半能赢，拿回那笔钱。不过案子可以拖很久，而撒切尔法官知道该怎么拖。
        - id: ch01-b15
          speaker: huck
          text: 他还听说，有人又要打官司，把我从他身边夺走，交给寡妇监护。大家都猜这一回他们会赢。我听了很不安，因为我再也不想回寡妇家，不想被他们管得死死的，接受他们所谓的教化。
        - id: ch01-b16
          speaker: huck
          text: 老头子接着开骂。凡是他想得到的人和事，全都先骂一遍，再从头骂一遍，省得漏下谁。末了，他来了一通不分对象的大咒骂。那些叫不出名字的人也跑不了，他只管用“那个谁”代替，然后继续骂下去。
        - id: ch01-b17
          speaker: pap
          text: 我倒要瞧瞧，那寡妇怎么把你弄走。我会盯紧一点。那些人敢耍花招，我就把你藏到六七英里外的一个地方。他们就是找到累死，也休想找着你。
          emotion: angry
        - id: ch01-b18
          speaker: huck
          text: 这话又让我不安起来，不过只持续了一小会儿。我心想，我不会留在这里，等他得到那个机会。
        - id: ch01-b19
          speaker: huck
          text: 老头子叫我去小划子上搬东西。船上有一袋五十磅重的玉米面，一大扇咸猪肉，一些弹药，一罐四加仑的威士忌，还有一本旧书、两张塞枪膛用的报纸和一些麻絮。我搬完一趟，回到船头坐下歇气，仔细盘算怎么逃。
        - id: ch01-b20
          speaker: huck
          text: 我准备带上枪和几根钓线，钻进林子。逃走以后不能老待在同一个地方，我要横穿乡野一直走，最好只在夜里赶路。沿途打猎、钓鱼填肚子，越走越远，直到老头子和寡妇都再也找不到我。
        - id: ch01-b21
          speaker: huck
          text: 我想，当天夜里就把缺口锯开，只要爸爸醉得够厉害就成。我猜他一定会喝醉。我想得太入神，根本没留意坐了多久。直到老头子大声嚷嚷，问我是睡着了，还是淹死了，我才回过神来。
        - id: ch01-b22
          speaker: huck
          text: 等我把东西全搬进木屋，天差不多黑了。我做晚饭的时候，老头子喝下一两口酒，浑身热乎起来，又开始发作。他在镇上已经醉过一回，还在阴沟里躺了一夜，那副模样真有得瞧。谁看了都会以为他是亚当，因为他全身都是泥。
        - id: ch01-b23
          speaker: huck
          text: 他的酒劲一上来，差不多总要骂政府。这一回也一样。
        - id: ch01-b24
          speaker: pap
          text: 这也叫政府！你们瞧瞧，它算个什么东西。法律站在那里，等着从一个男人手里抢走他亲生的儿子。他把儿子养大，费了多少事，操了多少心，又花了多少钱。等孩子终于能干活，能替老子做点事，让老子歇口气，法律倒扑过来抢人。他们管这个叫政府！
          emotion: angry
        - id: ch01-b25
          speaker: pap
          text: 还不只这样。法律替撒切尔那个老法官撑腰，帮他霸住我的财产。一个身价六千块还不止的人，硬叫法律塞进这么一间捕兽笼似的破屋，穿的衣裳连猪都不配穿。他们也管这个叫政府！在这种政府底下，一个男人根本讨不回自己的权利。
          emotion: angry
        - id: ch01-b26
          speaker: pap
          text: 有时候我真想永远离开这个国家。我已经当着老撒切尔的面告诉他们了，好多人都能作证。我说，只要给我两分钱，我就离开这个该死的国家，一辈子不再回来。原话就是这样。
        - id: ch01-b27
          speaker: pap
          text: 再瞧瞧我的帽子。要是这也能叫帽子的话！帽顶往上翘，四周一直垂到下巴底下。它哪像帽子，倒像我的脑袋从一截炉筒里钻了出来。要是能讨回我的权利，我可是镇上数一数二的阔佬，现在却得戴这种东西。
          emotion: angry
        - id: ch01-b28
          speaker: pap
          text: 对，这政府可真了不起。那里有个从俄亥俄州来的自由黑人，是个黑白混血儿，差不多跟白人一样白。他穿着我见过最白的衬衫，帽子也锃亮。镇上没有一个人穿得比他好。他还有金表、金表链和银头手杖，简直是本州最神气的白头老阔佬。
          emotion: angry
        - id: ch01-b29
          speaker: pap
          text: 你们猜怎么着？人家说他是大学教授，会说各种语言，什么都懂。更糟的是，他回到自己家乡还能投票。那天正好选举，要不是我醉得走不到投票的地方，我也要去投票。可他们一说，这个国家里竟然有一个州准那个黑人投票，我立刻不干了。
          emotion: angry
        - id: ch01-b30
          speaker: pap
          text: 我说，我这辈子再也不投票。大家都听见了。这国家爱烂成什么样，就烂成什么样。只要我还活着，就不再投票。再看那个黑人傲慢的样子，要不是我把他推开，他连路都不肯给我让。
          emotion: angry
        - id: ch01-b31
          speaker: pap
          text: 我问大家，为什么不把他送上拍卖台卖掉？他们竟说，他得在本州住满六个月才能卖，可他还没住够。瞧见了吧，这就是个样子。一个自由黑人不住满六个月就不能卖，这种东西也配叫政府！
          emotion: angry
        - id: ch01-b32
          speaker: pap
          text: 它自称政府，装得像政府，还真当自己是政府。可是碰上一个四处游荡、偷鸡摸狗、该下地狱、穿白衬衫的自由黑人，它竟然得干等整整六个月，才能伸手抓他，而且……
          emotion: angry
        - id: ch01-b33
          speaker: huck
          text: 爸爸说得太起劲，根本没看自己的腿走到了哪里。他一头绊过腌猪肉桶，两条小腿都擦破了。他剩下的演说立刻变成最恶毒的咒骂，大半扔给那个黑人和政府，中间也赏给木桶几句。
        - id: ch01-b34
          speaker: huck
          text: 他在屋里跳来跳去，先用一条腿单脚跳，再换另一条腿。手也忙个不停，刚捧住这边的小腿，马上又去捧另一边。最后，他猛地抡起左脚，踹得木桶哐啷一响。这可不是聪明的一脚。那只靴子的前端破了，正露着两根脚趾。
        - id: ch01-b35
          speaker: huck
          text: 他立刻嚎了一声，吓得人头发都能竖起来。然后他倒在尘土里打滚，抱住脚趾，骂得比以往任何一次都厉害。后来他自己也是这么说的。他还说，自己听过老索伯里·黑根最会骂人的时候，这一次连那个人也比下去了。不过我猜，他多少有点吹过头。
        - id: ch01-b36
          speaker: huck
          text: 晚饭以后，爸爸抱起酒罐，说里面的威士忌够他醉上两回，再发一回酒疯。他一直把那叫作发酒疯。我猜再过一个钟头，他就会醉得不省人事。那时我不是偷走钥匙，就是把缺口锯开，总有一个办法能出去。
        - id: ch01-b37
          speaker: huck
          text: 他不停地喝，后来倒在毯子上。可我的运气不好，他没有睡熟。他一直呻吟，翻来滚去，折腾了好久。最后我困得怎么也睁不开眼，还没弄清自己在做什么，就先睡熟了，蜡烛却还点着。
        - id: ch01-b38
          speaker: huck
          text: 不知道过了多久，一声吓人的尖叫突然把我惊醒。我爬起来，看见爸爸眼神发狂，到处乱跳，嘴里喊着有蛇。他说蛇正顺着腿往上爬。接着，他猛跳一下，尖叫着说，有一条蛇咬了他的脸。可我什么蛇也没看见。
        - id: ch01-b39
          speaker: pap
          text: 把它拿掉！快拿掉！它在咬我的脖子！
          emotion: fearful
        - id: ch01-b40
          speaker: huck
          text: 我从没见过哪个人的眼睛疯成那样。他绕着木屋一圈圈狂奔，没过多久就累得浑身发软，倒在地上直喘气。接着，他又快得吓人地滚来滚去，两条腿朝各处乱踢，屋里的东西全被踢开了。他两只手不停地打向空中，又胡乱抓扯，尖叫着说有一群魔鬼正死死抓着他。
        - id: ch01-b41
          speaker: huck
          text: 最后他耗尽力气，躺着呻吟了一阵。后来，他越躺越安静，终于一点声音也没有。远处林子里的猫头鹰和狼叫，我都听得清清楚楚。四周静得吓人。他躺在墙角。过了一会儿，他又撑起半个身子，把头偏向一边，侧耳听起来。
        - id: ch01-b42
          speaker: pap
          text: 咚——咚——咚。那是死人。咚——咚——咚。他们来抓我了，可我不走。啊，他们到了！别碰我，别碰！把手拿开，冰死了！放开我。饶了我这个可怜的魔鬼吧！
          emotion: fearful
        - id: ch01-b43
          speaker: huck
          text: 他四肢着地爬走，一路哀求他们放过自己。接着，他用毯子裹住全身，滚进旧松木桌底下，还在不停求饶。后来他哭了起来。我隔着毯子也听得见。
        - id: ch01-b44
          speaker: huck
          text: 过了一会儿，他从桌下滚出来，猛地站起身。那双眼睛还是疯的。他看见我，就挥着一把折刀扑过来，绕着屋子一圈圈追我。他管我叫死亡天使，说要杀了我。这样我就再也不能来抓他。
        - id: ch01-b45
          speaker: huck
          text: 我一边逃，一边求他住手，告诉他我只是哈克。可他发出刺耳的狂笑，又吼又骂，继续追我。有一次，我突然转身，从他胳膊下面钻过去。他伸手抓住我两肩之间的外套。我以为自己完了，赶紧像闪电一样从外套里滑出来，这才逃脱。
        - id: ch01-b46
          speaker: huck
          text: 没多久，他就累得一点力气也没有了。他背靠着门坐下，说先歇一会儿，然后再杀我。他把刀压在身子底下，说要先睡一觉，养足力气，再看看我们两个到底谁斗得过谁。
        - id: ch01-b47
          speaker: huck
          text: 他很快打起盹来。我搬来那把旧藤条底椅子，尽量不发出声音，小心地爬上去，把枪取下来。我把通条伸进枪管，确定里面装着弹药。然后我把枪架在装萝卜的木桶上，枪口对准爸爸，自己坐在后面，等着他一有动静就动手。
        - id: ch01-b48
          speaker: huck
          text: 我坐在枪后面，一动不动地守着爸爸，等他醒来。时间过得真慢，四周静得一点声音也没有。
