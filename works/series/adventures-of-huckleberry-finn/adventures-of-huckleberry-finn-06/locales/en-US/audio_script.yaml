  chapters:
    - id: ch01
      title: CHAPTER VI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Pap was soon up and about again. He went after Judge Thatcher in court, trying to make him hand over my money. He went after me too, because I kept going to school. He caught me a couple of times and thrashed me, but I went right back. Most days I dodged him or outran him. I had never cared much for school before. Now I went just to spite pap.
        - id: ch01-b02
          speaker: huck
          text: The lawsuit moved so slowly it seemed it might never begin. Every now and then, I borrowed two or three dollars from Judge Thatcher and gave it to pap so he would not whip me. Whenever pap got money, he got drunk. Whenever he got drunk, he raised Cain around town. Then they put him in jail. That suited him fine. It was just his kind of life.
        - id: ch01-b03
          speaker: huck
          text: Pap kept hanging around the widow's house until she warned him to stay away or she would make trouble. That made him furious. He said he would show everybody who was boss of Huck Finn.
        - id: ch01-b04
          speaker: huck
          text: One spring day he lay in wait, caught me, and took me about three miles upriver in a skiff. We crossed to the Illinois side. The woods were thick there, with no houses anywhere except one old log hut. If you did not already know where that hut was, you would never find it.
        - id: ch01-b05
          speaker: huck
          text: Pap kept me beside him all the time, so I never had a chance to run. We lived in the old cabin. At night he locked the door and slept with the key under his head. He had a gun that I reckoned he had stolen. We hunted and fished, and that was how we got our food.
        - id: ch01-b06
          speaker: huck
          text: Every so often, pap locked me inside and walked three miles down to the store by the ferry. He traded fish and game for whisky. Then he brought the whisky home, got drunk, enjoyed himself, and licked me. After a while the widow found out where I was. She sent a man across the river to get hold of me, but pap drove him away with the gun. That ended the rescue attempt.
        - id: ch01-b07
          speaker: huck
          text: Before long I got used to living there, and I liked most of it. The cowhide was the part I did not like. Otherwise it was lazy and comfortable. I could spend all day smoking and fishing, with no books and no studying.
        - id: ch01-b08
          speaker: huck
          text: Two months or more went by. My clothes turned to dirty rags. I could hardly understand how I had ever liked the widow's house. There I had to wash, eat from a plate, comb my hair, go to bed and get up at regular times, fuss over books, and listen to Miss Watson peck at me all day. I did not want to go back anymore. I had quit cussing because the widow disliked it, but I started again because pap did not mind. Taken all together, life in the woods was pretty good.
        - id: ch01-b09
          speaker: huck
          text: Then pap began using his hickory stick too freely. I had welts all over me, and I could not stand it. He also went away more often and left me locked inside. Once he stayed gone for three whole days. The cabin felt terribly lonely. I began to think he had drowned somewhere and would never return with the key. If that happened, I would be trapped inside for good. I was scared, and I made up my mind to find some way to escape.
        - id: ch01-b10
          speaker: huck
          text: I had searched for a way out many times. None of the windows was big enough for a dog. The chimney was too narrow, and the door was made of thick, solid oak slabs. Pap never left a knife or any useful tool behind. I must have searched the cabin a hundred times. There was little else to do.
        - id: ch01-b11
          speaker: huck
          text: This time I finally found something. An old rusty wood saw with no handle was hidden between a roof rafter and the clapboards. I greased it and got to work. At the far end of the cabin, behind the table, a horse blanket was nailed over the logs. It kept wind from coming through the cracks and blowing out the candle. I crawled under the table, lifted the blanket, and began sawing a section from the big bottom log. I meant to make a hole wide enough to crawl through.
        - id: ch01-b12
          speaker: huck
          text: It was a long, slow job, but I kept sawing until I was nearly through the log. Then I heard pap's gun go off somewhere in the woods. I quickly cleared away every sign of my work, dropped the blanket back into place, and hid the rusty saw. A little later, pap came into the cabin.
        - id: ch01-b13
          speaker: huck
          text: Pap was in a bad humor, which meant he was acting like his usual self. He had been in town, and he said everything there was going wrong. His lawyer thought he would win the lawsuit and get the money, if the trial ever began. The trouble was that the trial could be put off for a long time, and Judge Thatcher knew exactly how to do it.
        - id: ch01-b14
          speaker: huck
          text: Pap had also heard there might be another trial about me. People thought the widow would win this time and become my guardian again. That shook me up. I did not want to go back and be cramped up and civilized, as they called it.
        - id: ch01-b15
          speaker: huck
          text: Pap began cussing everything and everybody he could think of. Then he went through them all again, making sure he had not skipped anyone. After that came one general cuss for everybody. It covered a whole parcel of people whose names he did not know. Whenever he reached one of them, he called the person what's-his-name and kept right on going.
        - id: ch01-b16
          speaker: pap
          text: I'd like to see that widow take you. If they try any game like that, I know a place six or seven miles from here where I can hide you. They can hunt till they drop, and they'll never find you.
          emotion: angry
        - id: ch01-b17
          speaker: huck
          text: That worried me again, but only for a minute. I decided I would be gone before pap got the chance.
        - id: ch01-b18
          speaker: huck
          text: Pap sent me down to the skiff for the things he had bought. There was a fifty-pound sack of cornmeal, a side of bacon, ammunition, a four-gallon jug of whisky, an old book, two newspapers for gun wadding, and some tow. I carried one heavy load toward the cabin. When I came back, I sat on the bow of the skiff to rest and think the whole matter through.
        - id: ch01-b19
          speaker: huck
          text: When I escaped, I would take the gun and some fishing lines and head into the woods. I would not settle anywhere. I would keep walking straight across the country, mostly at night, and live by hunting and fishing. I meant to get so far away that neither pap nor the widow could ever find me. If pap got drunk enough, I would finish sawing my way out that very night. I was sure he would.
        - id: ch01-b20
          speaker: huck
          text: I got so wrapped up in my plan that I lost track of time. Then pap yelled down to ask whether I was asleep or drowned. I carried everything to the cabin, and by then it was nearly dark.
        - id: ch01-b21
          speaker: huck
          text: While I cooked supper, pap took a couple of swallows from the jug. Soon he was warmed up and ranting again. He had already been drunk in town and spent the whole night lying in a gutter. He was such a muddy sight that a person might have taken him for Adam, with no proper clothes at all. Once the liquor got hold of him, he nearly always attacked the government. This time was no different.
        - id: ch01-b22
          speaker: pap
          text: You call this a government? Just look at it. The law stands ready to take a man's own son away, after that man has spent all the trouble, worry, and money to raise him. Soon as the boy is old enough to work for his father and give him some rest, the law comes to snatch him. And they call that government!
          emotion: angry
        - id: ch01-b23
          speaker: pap
          text: And that ain't all. The law helps old Judge Thatcher keep me away from my own property. It takes a man worth six thousand dollars or more, jams him into an old trap of a cabin, and leaves him wearing clothes unfit for a hog. A man can't get his rights under a government like this.
          emotion: angry
        - id: ch01-b24
          speaker: pap
          text: Sometimes I think I'll leave this country for good. I told them so, right to Thatcher's face, with plenty of people listening. For two cents, I'd go and never come near this blamed country again. Those were my very words.
          emotion: angry
        - id: ch01-b25
          speaker: pap
          text: Look at my hat, if you can call it a hat. The top lifts up, and the rest drops below my chin. It looks like my head got shoved through a piece of stovepipe. That's the kind of hat I have to wear, though I'd be one of the richest men in town if I could get my rights.
          emotion: angry
        - id: ch01-b26
          speaker: pap
          text: Oh yes, a wonderful government. There was a free Black man from Ohio in town, nearly as light-skinned as a white man. He wore the whitest shirt and the shiniest hat you ever saw. No man in that town had finer clothes. He even had a gold watch and chain and a cane with a silver head. He was the grandest old gray-headed big shot in the whole state.
          emotion: disgusted
        - id: ch01-b27
          speaker: pap
          text: They said he was a college professor. Said he knew all kinds of languages and just about everything else. Worse than that, they said he could vote back home. Well, that finished it for me. What is this country coming to?
          emotion: disgusted
        - id: ch01-b28
          speaker: pap
          text: It was election day, and I meant to vote myself if I wasn't too drunk to get there. Then I heard there was a state that let a Black man vote, so I quit. I said I'd never vote again as long as I lived, and the country could rot for all I cared. Everybody heard me say it.
          emotion: angry
        - id: ch01-b29
          speaker: pap
          text: And that man wouldn't even step out of my way until I shoved him. I asked why they didn't put him up at auction and sell him. You know what they told me? They couldn't sell him until he'd been in the state for six months, and he hadn't been here that long.
          emotion: angry
        - id: ch01-b30
          speaker: pap
          text: There's your fine government for you. It claims to be a government, but it has to sit still for six whole months before it can seize a prowling, thieving, white-shirted free Black man, and...
          emotion: angry
        - id: ch01-b31
          speaker: huck
          text: Pap was so busy ranting that he did not notice where his loose old legs were taking him. He went head over heels across the tub of salt pork and scraped both shins. The rest of his speech turned into the hottest cussing he knew. Most of it went toward the Black man and the government, though he threw some at the tub now and then. He hopped all over the cabin, first on one leg and then on the other, holding whichever shin hurt most.
        - id: ch01-b32
          speaker: huck
          text: He hopped around the cabin, first clutching one shin and then the other. At last he swung his left foot and kicked the tub hard enough to make it rattle. That was poor judgment. The left boot was the one with two of his toes sticking through its front. He howled so loud it made my hair rise, fell in the dirt, and rolled around holding those toes. Then his cussing grew worse than ever.
        - id: ch01-b33
          speaker: huck
          text: Pap later said the cussing he did then beat anything he had ever done before. He claimed it even beat old Sowberry Hagan in his best days. I reckon pap was piling it on a little.
        - id: ch01-b34
          speaker: huck
          text: After supper, pap took the jug. He said it held enough whisky for two drunks and one fit of delirium tremens. That was always his name for it. I figured he would be blind drunk within an hour. Then I could steal the key or finish sawing my way out.
        - id: ch01-b35
          speaker: huck
          text: He drank and drank until he fell onto his blankets. But my luck went wrong. He never sank into a sound sleep. For a long time he groaned, moaned, and thrashed from side to side. At last I got so tired I could not keep my eyes open. Before I knew it, I was asleep too, with the candle still burning.
        - id: ch01-b36
          speaker: huck
          text: I do not know how long I slept. All at once, a terrible scream brought me up. Pap was leaping around the cabin with a wild look in his eyes, yelling about snakes. He cried that they were crawling up his legs. Then he jumped and screamed that one had bitten his cheek. I could not see any snakes at all.
        - id: ch01-b37
          speaker: pap
          text: Get it off! Get it off! It's biting my neck!
          emotion: fearful
        - id: ch01-b38
          speaker: huck
          text: I had never seen a man's eyes look so wild. Pap ran around and around until he was worn out and fell down panting. Then he rolled wildly across the floor, kicking things every way, grabbing and striking at the air, and screaming that devils had hold of him. After a while he wore himself out. He lay moaning for a time, then grew still and made no sound.
        - id: ch01-b39
          speaker: huck
          text: Far off in the woods, I could hear owls and wolves. The cabin seemed terribly quiet. Pap lay over in the corner. After a while he raised himself halfway and listened with his head tipped to one side. Then he spoke very low.
        - id: ch01-b40
          speaker: pap
          text: Tramp, tramp, tramp. That's the dead. Tramp, tramp, tramp. They're coming for me, but I won't go. Oh, they're here! Don't touch me! Keep those cold hands off me. Let go! Leave a poor devil alone!
          emotion: fearful
        - id: ch01-b41
          speaker: huck
          text: He dropped onto all fours and crawled away, begging them to leave him be. Then he wrapped himself in his blanket and pushed under the old pine table. He kept begging and began to cry. I could hear him through the blanket.
        - id: ch01-b42
          speaker: huck
          text: At last he rolled out, jumped to his feet, and saw me. He came straight at me with a clasp knife. He chased me around and around the cabin, calling me the Angel of Death. He said he would kill me so I could never come for him again.
        - id: ch01-b43
          speaker: huck
          text: Pap, it's only me. I'm Huck!
          emotion: fearful
        - id: ch01-b44
          speaker: huck
          text: He answered with a terrible, screeching laugh. He roared and cussed and kept chasing me around the room. Once I turned sharply and ducked under his arm. He grabbed my jacket between my shoulders, and I thought I was finished. But I slipped out of it quick as lightning and got away, leaving the jacket in his hand.
        - id: ch01-b45
          speaker: huck
          text: Soon pap was exhausted. He dropped to the floor with his back against the door. He said he would rest for one minute and then kill me. He tucked the knife underneath himself so I could not reach it. He would sleep until he had his strength back, he said. After that, we would see who was who.
        - id: ch01-b46
          speaker: huck
          text: Pap soon dozed off. After a while, I brought over the old split-bottom chair. I climbed onto it as carefully as I could, making no noise, and reached up for the gun. Once I had it down, I slid the ramrod into the barrel to make certain it was loaded.
        - id: ch01-b47
          speaker: huck
          text: Then I rested the gun across the turnip barrel and aimed it at pap. I sat down behind it and waited for him to move. The time dragged by, slow and still.
