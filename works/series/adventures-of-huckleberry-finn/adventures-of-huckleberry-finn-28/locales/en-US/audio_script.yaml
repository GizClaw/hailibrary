  chapters:
    - id: ch01
      title: CHAPTER XXVIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: By and by, it was time for folks to get up. I climbed down from the garret and started downstairs. The girls' door stood open. Mary Jane was sitting beside her old hair trunk, packing for England. But she had stopped with a folded dress in her lap. Her face was in her hands, and she was crying. It made me feel awful. Anybody would have felt the same. I went in.
        - id: ch01-b02
          speaker: huck
          text: Miss Mary Jane, you can't bear seeing people in trouble. Most times, neither can I. Tell me what's wrong.
        - id: ch01-b03
          speaker: huck
          text: She told me, and it was just what I expected. She was thinking about the enslaved mother and children. Her wonderful trip to England felt nearly ruined. How could she be happy there, knowing that family would never see one another again? She began crying harder and threw up her hands.
        - id: ch01-b04
          speaker: mary_jane
          text: Oh, it's terrible! They'll never see each other again!
          emotion: sad
        - id: ch01-b05
          speaker: huck
          text: Yes, they will! They'll be together again in this house within two weeks. I know they will!
        - id: ch01-b06
          speaker: huck
          text: The words were out before I could stop them. Mary Jane threw her arms around my neck and begged me to say it again and again.
        - id: ch01-b07
          speaker: huck
          text: I knew I had spoken too fast and said too much. Now I was in a tight place. I asked her to give me a minute to think. She sat waiting, impatient and excited, and mighty handsome too. But she also looked happy and relieved, like someone whose aching tooth had finally been pulled.
        - id: ch01-b08
          speaker: huck
          text: I studied the problem. Telling the truth when you're trapped looked mighty risky to me, though I had no experience with it and couldn't be certain. Yet here was a case where the truth seemed better than a lie. It even looked safer. That was so strange and out of the ordinary that I meant to store it in my mind and think about it again someday. I had never seen anything like it. At last I decided to take the chance and tell the truth this once. It felt like sitting on a powder keg and lighting it just to find out where it would send you.
        - id: ch01-b09
          speaker: huck
          text: Miss Mary Jane, is there someplace a little way out of town where you could stay for three or four days?
        - id: ch01-b10
          speaker: mary_jane
          text: I could stay with Mr. Lothrop. Why?
        - id: ch01-b11
          speaker: huck
          text: Never mind why for now. If I tell you how I know that family will be together here again within two weeks, and prove it too, will you go to Mr. Lothrop's and stay four days?
        - id: ch01-b12
          speaker: mary_jane
          text: Four days? I'd stay a whole year!
        - id: ch01-b13
          speaker: huck
          text: Good. All I want from you is your word. I'd sooner trust that than another man's oath on the Bible. Mary Jane smiled and blushed in the sweetest way. I asked if she minded me closing the door and bolting it, and then I did.
        - id: ch01-b14
          speaker: huck
          text: I sat down again. Don't shout. Sit still and take it bravely. I've got to tell you the truth, and it's a hard kind of truth. Those men aren't your uncles at all. They're a pair of frauds and deadbeats. There, that's the worst part. You can stand the rest easier.
        - id: ch01-b15
          speaker: huck
          text: The news hit her hard, of course. But I had made it past the shallow water and could keep going now. I told her every last thing. I began with the foolish young man we met on his way up to the steamboat and explained how the frauds learned about Peter Wilks and his brothers. I carried the story right through their arrival at the house. I ended with Mary Jane throwing herself against the king at the front door while he kissed her sixteen or seventeen times. Her eyes burned brighter with every word. Then she sprang up, her face red as sunset.
        - id: ch01-b16
          speaker: mary_jane
          text: That brute! Come on, we can't waste even a second. We'll have them tarred and feathered and thrown into the river!
          emotion: angry
        - id: ch01-b17
          speaker: huck
          text: Certainly. But did you mean to do that before you go to Mr. Lothrop's, or after?
        - id: ch01-b18
          speaker: mary_jane
          text: Oh, what was I thinking? Please forget what I said. You will, won't you? I was so upset that I didn't think at all. Go on now. I promise I won't do that again. Tell me what to do, and whatever you say, I'll do it.
        - id: ch01-b19
          speaker: huck
          text: She put her soft hand on mine in such a way that I would sooner have died than hold her outburst against her.
        - id: ch01-b20
          speaker: huck
          text: Those two frauds are a rough pair. I'm fixed so I have to travel with them a while longer, whether I want to or not. I'd rather not explain why. If you exposed them now, the town would get me out of their claws, and I'd be all right. But somebody else, a person you don't know anything about, would land in terrible trouble. We've got to save him too, don't we? Of course we do. That means we can't expose the frauds yet.
        - id: ch01-b21
          speaker: huck
          text: The moment I said that, a good idea came into my head. Maybe I could get the frauds locked up in this town. Then Jim and I could leave them behind for good. But I did not want to take the raft out in broad daylight with nobody aboard except me to answer questions. So the plan could not start working too early. I needed everything to wait until pretty late that night.
        - id: ch01-b22
          speaker: huck
          text: You won't need to stay with Mr. Lothrop very long after all. How far away does he live?
        - id: ch01-b23
          speaker: mary_jane
          text: Just under four miles, out in the country behind town.
        - id: ch01-b24
          speaker: huck
          text: That'll work. Go out there and keep quiet until nine or half past nine tonight. Then ask them to bring you home. Tell them you remembered something you had to do. If you get back before eleven, put a candle in this window so I can see it. If I don't show up, wait until eleven. If I'm still gone then, you'll know I'm out of the way and safe. That's when you should spread the news through town and have these crooks put in jail.
        - id: ch01-b25
          speaker: mary_jane
          text: Good. I'll do it.
        - id: ch01-b26
          speaker: huck
          text: If I don't get away and they arrest me with the others, tell everyone I warned you beforehand. Stand by me as much as you can.
        - id: ch01-b27
          speaker: mary_jane
          text: Stand by you? Of course I will! They won't touch one hair on your head!
          emotion: angry
        - id: ch01-b28
          speaker: huck
          text: Her nostrils spread, and her eyes flashed when she said it.
        - id: ch01-b29
          speaker: huck
          text: If I escape, I won't be here to prove those rascals aren't your uncles. Truth is, I couldn't prove that even if I stayed. All I could swear is that they're cheats and loafers, though even that would count for something. Other people can prove it better than I can, and the court won't doubt them as quickly as it would doubt me. I'll tell you how to find those people. Give me a pencil and some paper.
        - id: ch01-b30
          speaker: huck
          text: I wrote, Royal Nonesuch, Bricksville. Put this away somewhere safe, and don't lose it. When the court wants the truth about these two men, have someone send word to Bricksville. Say the men who performed the Royal Nonesuch have been caught, and the court needs witnesses. Why, the whole town will come boiling down here before you can hardly blink, Miss Mary Jane. They'll be eager to come too.
        - id: ch01-b31
          speaker: huck
          text: I figured we had things arranged about right. Let the auction go ahead and don't worry about it. Because the notice was so short, nobody has to pay for anything until a full day after the sale. The frauds won't leave town before they collect that money. By then our plan will be working, the auction won't count, and they won't collect a cent. It is the same with the enslaved mother and children. That sale was never valid, and the family will be home again soon. The frauds can't even collect the payment for them yet. They're caught in the worst kind of fix, Miss Mary Jane.
        - id: ch01-b32
          speaker: mary_jane
          text: Then I'll go down to breakfast and leave for Mr. Lothrop's right afterward.
        - id: ch01-b33
          speaker: huck
          text: No, Miss Mary Jane. That won't do at all. You need to leave before breakfast.
        - id: ch01-b34
          speaker: mary_jane
          text: Why?
        - id: ch01-b35
          speaker: huck
          text: Why did you think I wanted you to leave town in the first place?
        - id: ch01-b36
          speaker: mary_jane
          text: I never thought about it. Now that you ask, I don't know. Why do I have to go?
        - id: ch01-b37
          speaker: huck
          text: Because you don't have one of those hard faces that hides everything. Your face is as easy to read as big print. Could you stand there when your uncles came to kiss you good morning and never let anything show?
        - id: ch01-b38
          speaker: mary_jane
          text: Stop, I understand! I'll gladly leave before breakfast. But should I leave my sisters here with them?
        - id: ch01-b39
          speaker: huck
          text: Yes. Your sisters will have to bear it a little longer. The frauds might suspect something if all three of you left together. And don't see your sisters or anybody else in town before you go. If a neighbor only asked how your uncles were this morning, your face would tell the whole story. Leave right away, and I'll settle it with everyone. I'll tell Susan to give your love to your uncles and say you went away for a few hours to rest, get a change, or visit a friend. I'll say you'll return tonight or early tomorrow.
        - id: ch01-b40
          speaker: mary_jane
          text: You may say I went to see a friend, but don't send those men my love.
        - id: ch01-b41
          speaker: huck
          text: Then I won't.
        - id: ch01-b42
          speaker: huck
          text: It was an easy promise to make. Little things smooth a person's road more than anything else. This would comfort Mary Jane and cost me nothing. Then I remembered one last matter.
        - id: ch01-b43
          speaker: huck
          text: There's one more thing. The bag of money.
        - id: ch01-b44
          speaker: mary_jane
          text: They have it, and I feel foolish when I think how they got it.
        - id: ch01-b45
          speaker: huck
          text: You're wrong. They don't have it.
        - id: ch01-b46
          speaker: mary_jane
          text: Then who does?
        - id: ch01-b47
          speaker: huck
          text: I wish I knew who has it, but I don't. I had the bag for a while because I stole it from the frauds. I meant to give it to you. I know where I hid it, but I'm afraid it isn't there anymore. I'm terribly sorry, Miss Mary Jane. I'm as sorry as I can be. I truly did the best I could. I nearly got caught with it, so I had to shove it into the first place I found and run. It wasn't a good hiding place at all.
        - id: ch01-b48
          speaker: mary_jane
          text: Stop blaming yourself. You couldn't help it, and it wasn't your fault. Where did you hide the money?
        - id: ch01-b49
          speaker: huck
          text: I did not want her thinking about her troubles again. I couldn't make myself tell her and put the picture of Peter's body in her mind, lying in his coffin with the money bag on him. I stayed quiet for a minute.
        - id: ch01-b50
          speaker: huck
          text: I'd rather not say where I put it, if you don't mind. I'll write it down, and you can read the note on the road to Mr. Lothrop's. Will that do?
        - id: ch01-b51
          speaker: mary_jane
          text: Yes, that's fine.
        - id: ch01-b52
          speaker: huck
          text: I wrote that I had put the money in the coffin. It had been there while she cried beside Peter late that night. I had watched from behind the door, feeling mighty sorry for her.
        - id: ch01-b53
          speaker: huck
          text: Remembering Mary Jane crying there all alone in the middle of the night brought tears to my eyes. Those devils had been lying under her own roof the whole time, robbing her and bringing shame on her. I folded the note and handed it over. When I looked up, tears had come into her eyes too. She took my hand and shook it hard.
        - id: ch01-b54
          speaker: mary_jane
          text: Good-bye. I'll do everything exactly as you told me. If we never meet again, I'll never forget you. I'll think of you many, many times, and I'll pray for you too.
          emotion: sad
        - id: ch01-b55
          speaker: huck
          text: Then she was gone.
        - id: ch01-b56
          speaker: huck
          text: Pray for me! I reckoned that if she really knew me, she'd have chosen a job closer to her size. But I know she did pray for me all the same. That was exactly the kind of person she was. She had enough grit to pray for Judas if the idea took hold of her, and she would never back down. Say what you like, but in my opinion she had more courage than any girl I ever saw. She was full of it. That may sound like flattery, but it isn't. When it came to beauty and goodness too, she had everybody beat.
        - id: ch01-b57
          speaker: huck
          text: I never saw Mary Jane again after she walked through that door. Still, I've thought of her millions of times, and of her promise to pray for me. If I'd ever believed my prayers could help her, I'd have prayed for her or burst trying.
        - id: ch01-b58
          speaker: huck
          text: Mary Jane must have slipped out the back way, because nobody saw her leave. When I found Susan and Joanna, I asked them the name of the people across the river whom they sometimes visited.
        - id: ch01-b59
          speaker: susan
          text: There are several families, but we mostly visit the Proctors.
        - id: ch01-b60
          speaker: huck
          text: That's the name. I almost forgot it. Mary Jane asked me to say she hurried over there because somebody is terribly sick.
        - id: ch01-b61
          speaker: joanna
          text: Which one of them?
        - id: ch01-b62
          speaker: huck
          text: I don't know. Or maybe I just forgot. I think it's...
        - id: ch01-b63
          speaker: joanna
          text: Goodness, I hope it isn't Hanner!
        - id: ch01-b64
          speaker: huck
          text: I'm sorry, but Hanner is the one.
        - id: ch01-b65
          speaker: joanna
          text: My goodness! She was perfectly well last week. Is she very sick?
          emotion: surprised
        - id: ch01-b66
          speaker: huck
          text: Very sick doesn't begin to describe it. Mary Jane said they had been sitting up with Hanner all night. They don't believe she'll last more than a few hours now.
        - id: ch01-b67
          speaker: joanna
          text: Just think of that! What illness does she have?
        - id: ch01-b68
          speaker: huck
          text: I couldn't think of any sensible illness quickly enough. Mumps.
        - id: ch01-b69
          speaker: joanna
          text: Mumps, my granny! Nobody sits up all night with someone who has mumps.
        - id: ch01-b70
          speaker: huck
          text: Don't they? They certainly do with these mumps. This is a new kind, Mary Jane said.
        - id: ch01-b71
          speaker: joanna
          text: What makes them new?
        - id: ch01-b72
          speaker: huck
          text: They're mixed up with other sicknesses.
        - id: ch01-b73
          speaker: joanna
          text: What other sicknesses?
        - id: ch01-b74
          speaker: huck
          text: Measles, whooping cough, erysipelas, consumption, yellow jaundice, brain fever, and I don't know what else.
        - id: ch01-b75
          speaker: joanna
          text: My land! And they call all that mumps?
          emotion: surprised
        - id: ch01-b76
          speaker: huck
          text: That's what Mary Jane called it.
        - id: ch01-b77
          speaker: joanna
          text: Why in the world would anyone call it mumps?
        - id: ch01-b78
          speaker: huck
          text: Because it is mumps. That's how the sickness begins.
        - id: ch01-b79
          speaker: joanna
          text: That makes no sense at all. A person could stub his toe, take poison, fall down a well, break his neck, and smash his head open. Then somebody could come along, ask what killed him, and hear some fool answer that he died because he stubbed his toe. Would there be any sense in that? No, and there's no sense in calling this sickness mumps either. Is it catching?
        - id: ch01-b80
          speaker: huck
          text: Catching? Listen to you. Is a harrow catching in the dark? If one tooth doesn't hook you, you're bound to catch on another. And once one tooth has you, you can't get away without dragging the whole harrow behind you, can you? Well, this kind of mumps works like a harrow. And it isn't any weak little harrow either, once it gets hooked on properly.
        - id: ch01-b81
          speaker: joanna
          text: That sounds awful. I'm going to tell Uncle Harvey and...
        - id: ch01-b82
          speaker: huck
          text: Oh, yes. I certainly would. I wouldn't waste a moment.
        - id: ch01-b83
          speaker: joanna
          text: Why shouldn't I?
        - id: ch01-b84
          speaker: huck
          text: Stop and think for a minute. Your uncles must hurry home to England as fast as they can. Do you believe they'd be mean enough to leave you girls to make that long journey alone? You know they'll wait for you. So far, so good. Now, Uncle Harvey is a preacher. Would a preacher deceive a steamboat clerk? Would he deceive a ship clerk just to get Mary Jane aboard? You know he wouldn't do such a thing.
        - id: ch01-b85
          speaker: huck
          text: He'd say it was a great pity, but his church would have to manage the best it could without him. His niece had been exposed to the dreadful pluribus-unum mumps, so it was his duty to sit right here for the three months it takes to find out whether she caught them. But never mind. If you still think it's best to tell Uncle Harvey...
        - id: ch01-b86
          speaker: joanna
          text: Shucks! Why sit around here when we could be enjoying England while we wait to find out? You talk like a fool.
        - id: ch01-b87
          speaker: huck
          text: Maybe you'd better tell some of the neighbors, then.
        - id: ch01-b88
          speaker: joanna
          text: Listen to you! You really are naturally stupid. Can't you see the neighbors would tell him? We can't tell anybody at all.
        - id: ch01-b89
          speaker: huck
          text: Maybe you're right. Yes, I reckon you are.
        - id: ch01-b90
          speaker: joanna
          text: We should at least tell Uncle Harvey that Mary Jane went out. Otherwise, he might worry about her.
        - id: ch01-b91
          speaker: huck
          text: Yes, that's what Mary Jane wanted. She said to give Uncle Harvey and William her love and a kiss. Then tell them she crossed the river to see Mister... Now, what's the name of that rich family your uncle Peter liked so much? The family that...
        - id: ch01-b92
          speaker: joanna
          text: You mean the Apthorps, don't you?
        - id: ch01-b93
          speaker: huck
          text: Of course, the Apthorps. Names like that are so hard to remember. Mary Jane crossed the river to ask them to come to the auction and buy this house, because she believed Uncle Peter would rather they had it than anybody else. She plans to stay with them until they promise to come. If she isn't too tired after that, she'll return tonight. Otherwise, she'll be home tomorrow morning.
        - id: ch01-b94
          speaker: huck
          text: She said not to mention the Proctors, only the Apthorps. And that's perfectly true, because she told me herself that she's going there to talk about buying the house.
        - id: ch01-b95
          speakers: [susan, joanna]
          ensemble: duo
          text: All right.
        - id: ch01-b96
          speaker: huck
          text: They hurried away to wait for their uncles, give them the love and kisses, and deliver the message.
        - id: ch01-b97
          speaker: huck
          text: Everything was settled now. The girls would keep quiet because they wanted to go to England. The king and duke would rather have Mary Jane away working to help the auction than nearby where Doctor Robinson could reach her. I felt mighty pleased with myself. I figured I had arranged it all very neatly. Tom Sawyer couldn't have managed it any neater. He would have put more style into the trick, of course, but I couldn't do that very easily. I had not been brought up to it.
        - id: ch01-b98
          speaker: huck
          text: Late that afternoon, they held the auction in the public square. It dragged on and on. The king stayed right beside the auctioneer, looking as poisonous as he knew how. Every so often, he would put in a little piece of Scripture or offer some sweet, pious saying. The duke moved around the crowd, making sorrowful eyes and begging for all the sympathy he could get. He spread himself over the whole performance.
        - id: ch01-b99
          speaker: huck
          text: At last, the auction crept to its end, and everything was sold except one small, worthless plot in the graveyard. The frauds still had to work that piece off, so they kept the sale going and tried to find a buyer for it. I never saw anyone like the king for wanting to swallow every last thing he could get.
        - id: ch01-b100
          speaker: huck
          text: While they worked on that last plot, a steamboat landed nearby. Within two minutes, a crowd came rushing up, whooping, laughing, yelling, and carrying on. They called out together.
        - id: ch01-b101
          speakers: [traveler_1, traveler_2, traveler_3]
          ensemble: chorus
          text: Here's the rival line! Now you've got two sets of heirs to old Peter Wilks. Pay your money and take your choice!
