        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    mary_jane:
      display_name: 玛丽·简
      tts:
        delivery: 真挚温柔，情绪强烈时直率果断
        timbre: 年轻明亮而柔和
        pace: 自然流畅
        pitch: 中高
    susan:
      display_name: 苏珊
      tts:
        delivery: 爽直关切，说话干脆
        timbre: 年轻清亮
        pace: 稍快
        pitch: 中高
    joanna:
      display_name: 乔安娜
      tts:
        delivery: 好奇较真，追问时毫不含糊
        timbre: 年少清脆，略带鼻音
        pace: 明快
        pitch: 高
    townsman_1:
      display_name: 镇民甲
      tts:
        delivery: 兴奋起哄，嗓门响亮
        timbre: 成年粗亮
        pace: 快
        pitch: 中
    townsman_2:
      display_name: 镇民乙
      tts:
        delivery: 兴奋起哄，语气夸张
        timbre: 成年洪亮
        pace: 快
        pitch: 中低
    townsman_3:
      display_name: 镇民丙
      tts:
        delivery: 看热闹般欢快高喊
        timbre: 青年明亮
        pace: 快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二十八章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 过了一阵，也该起床了。我爬下梯子，正准备往楼下走。经过姑娘们的房间时，门正敞着。玛丽·简坐在那只旧衣箱旁，箱盖也开着。她刚才一直在收拾去英国要带的东西，可这会儿停下了，膝上搁着一件叠好的长袍，双手捂着脸哭。我看着实在难受，换了谁也会难受，于是就走了进去。
        - id: ch01-b02
          speaker: huck
          text: 玛丽·简小姐，您不忍心看别人受苦，我大多数时候也不忍心。到底出了什么事，您告诉我吧。
        - id: ch01-b03
          speaker: huck
          text: 她把事情告诉了我，果然是为了那几个黑奴，我早就猜到了。她原本盼着去英国，可现在那趟美好的旅行差不多全毁了。只要想到那位母亲和孩子们从此再也见不着，她就不知道自己到了英国还能怎么快活。说着说着，她哭得比刚才更伤心，忽然把双手举了起来。
        - id: ch01-b04
          speaker: mary_jane
          text: 天哪！只要想到他们这一辈子再也见不了面，我怎么受得了！
          emotion: sad
        - id: ch01-b05
          speaker: huck
          text: 他们一定会再见面的！用不了两个星期，还会在这座房子里见面。我知道！
        - id: ch01-b06
          speaker: huck
          text: 老天，我根本没来得及想，那句话自己就冲出了嘴。我还没动一下，她已经搂住我的脖子，一连三次叫我再说一遍。我知道自己开口太急，说得也太多，已经把自己逼进死角，只好请她坐着等一会儿，让我先好好想想。
        - id: ch01-b07
          speaker: huck
          text: 她坐在那里，又着急又激动，也还是那么漂亮，可神色已经有了点快活，整个人轻松多了，就像刚拔掉一颗疼牙。我琢磨起来。人被逼得走投无路，忽然张嘴说真话，大概得冒很大的险。我从来没试过，也说不准。可眼前这件事，要是我没有看错，真话好像比谎话更好，甚至更稳妥。这事稀奇得不合常理，我从没见过，得牢牢记住，以后找个时候再慢慢想。
        - id: ch01-b08
          speaker: huck
          text: 我把各种办法翻来覆去地想，最后还是决定豁出去了。这一回，我就说真话。虽说这么干，简直像一个人坐到火药桶上，再亲手把火药点着，只为看看爆炸以后，自己到底会被抛到哪儿去。可既然真话看起来最稳妥，我也只能这么办。
        - id: ch01-b09
          speaker: huck
          text: 玛丽·简小姐，城外近处有没有哪户人家，能让您住三四天？
        - id: ch01-b10
          speaker: mary_jane
          text: 有，洛思罗普先生家。你问这个做什么？
        - id: ch01-b11
          speaker: huck
          text: 先别问。我要是把凭据都告诉您，说明那些黑奴为什么不到两个星期就能回到这里，您肯不肯去洛思罗普先生家住四天？
        - id: ch01-b12
          speaker: mary_jane
          text: 四天算什么！哪怕住上一年，我也肯！
        - id: ch01-b13
          speaker: huck
          text: 那我只要您答应一句。别人亲吻《圣经》发誓，也没有您一句话可靠。她笑了笑，脸也红了。我去关上门，插好门闩，回来坐下。
        - id: ch01-b14
          speaker: huck
          text: 您千万别喊，坐稳了，硬撑住。我非把真话说出来不可，您也得打起精神。这话很难听，可您必须知道。那两个人根本不是您的叔叔。他们是骗子，是两个地地道道的无赖。最难听的这一句已经说完了，后面的话就好受一些了。
        - id: ch01-b15
          speaker: huck
          text: 她当然惊得不轻。可我已经趟过了浅滩，索性把那些该死的事情一口气全说了。我从我们碰到那个赶汽船的年轻傻瓜说起，一直说到她在前门扑进国王怀里，让他亲了十六七下。她听着听着，两只眼睛里的火越烧越旺。最后她猛地跳了起来，脸红得像晚霞。
        - id: ch01-b16
          speaker: mary_jane
          text: 畜生！一分钟也别等，一秒钟也别等！现在就叫人来，给他们涂上柏油，粘满羽毛，再扔进河里！
          emotion: angry
        - id: ch01-b17
          speaker: huck
          text: 那当然。不过，您是想在去洛思罗普先生家以前动手，还是等到以后？
        - id: ch01-b18
          speaker: mary_jane
          text: 我这是在想什么呀！求你别把刚才的话当真。你不会当真的，对不对？我只是气昏了头。你接着说吧，我不会再这样了。你叫我怎么做，我就怎么做。
        - id: ch01-b19
          speaker: huck
          text: 那两个骗子又凶又狠，我不得不再跟他们走一阵，不管愿不愿意都得走。为什么，我不想告诉您。现在揭穿他们，镇上的人会把我救出来，我当然没事。可还有一个您不认识的人会遭大难。我们不能丢下他不管，所以眼下还不能揭穿那两个家伙。
        - id: ch01-b20
          speaker: huck
          text: 说到这里，我忽然想出了一个好主意。也许我能让两个骗子留在这里坐牢，自己带着吉姆摆脱他们。不过，我不愿在大白天撑着木筏离开。筏子上只有我一个人，路上要是有人盘问，我可不好应付。所以这个计划不能马上发动，最好一直等到今天深夜。
        - id: ch01-b21
          speaker: huck
          text: 玛丽·简小姐，我来告诉您怎么办。这样您也不用在洛思罗普先生家待很久。那里离这儿有多远？
        - id: ch01-b22
          speaker: mary_jane
          text: 不到四英里，就在后面的乡下。
        - id: ch01-b23
          speaker: huck
          text: 正合适。您马上去，悄悄待到今晚九点或九点半，再请他们送您回来，就说忽然想起一件事。要是十一点以前到家，您就在这扇窗里点一支蜡烛。我没有出现，您就一直等到十一点。十一点以后我还没来，那就说明我已经脱身，平安走了。到时您再把消息传开，叫人把这两个无赖抓进牢里。
        - id: ch01-b24
          speaker: mary_jane
          text: 好，我一定照办。
        - id: ch01-b25
          speaker: huck
          text: 万一我没逃掉，反而和他们一起被抓，您得站出来作证，说我早就把整件事告诉了您，还要尽力护着我。
        - id: ch01-b26
          speaker: mary_jane
          text: 我当然会护着你！他们休想碰你一根头发！
          emotion: angry
        - id: ch01-b27
          speaker: huck
          text: 她说这话时，鼻翼张开，两眼直冒火，我看得一清二楚。我接着告诉她，我只要逃掉，就不会再留在这里。我没法证明那两个人不是她的叔叔，就算留下也只能发誓说他们是骗子和无赖。我的话多少有点用，可还有一群人比我更能证明，而且别人不会像怀疑我这样，很快就怀疑他们。
        - id: ch01-b28
          speaker: huck
          text: 我请她拿来铅笔和纸，写下“布里克斯维尔，《王室异兽》”。我叫她把纸收好，千万别弄丢。以后法庭要查那两个人的底细，就派人去布里克斯维尔，说这里抓住了演《王室异兽》的两个家伙，请几个证人过来。等消息传到那里，玛丽小姐恐怕还没来得及眨一下眼，全镇的人就会一窝蜂地赶到这里作证。
        - id: ch01-b29
          speaker: huck
          text: 我看事情安排得差不多了，又告诉她，拍卖可以照常举行，不必为它担心。拍卖通知发得太晚，买主得等拍卖结束整整一天以后才付款。两个骗子拿不到这笔钱，自然不会离开。等事情揭开，这场买卖就不算数，他们也一分钱都拿不到。那几个黑奴的买卖同样不算数，母亲和孩子们很快就会回到这里。再说，骗子眼下连卖黑奴的钱也还没拿到，这两个人才真是倒了大霉。
        - id: ch01-b30
          speaker: mary_jane
          text: 那好，我先下楼吃早饭，吃完就去洛思罗普先生家。
        - id: ch01-b31
          speaker: huck
          text: 不行，玛丽·简小姐，绝对不行。您必须赶在早饭以前走。
        - id: ch01-b32
          speaker: mary_jane
          text: 为什么？
        - id: ch01-b33
          speaker: huck
          text: 您想想，我为什么一定要您离开？
        - id: ch01-b34
          speaker: mary_jane
          text: 我刚才没想过。现在一想，我还是不知道。到底为什么？
        - id: ch01-b35
          speaker: huck
          text: 因为您不是那种脸皮厚得叫人看不出心思的人。您的脸就像一本印着大字的书，谁都看得明白。等那两位叔叔来亲您，跟您道早安，您真能面对他们，一点也不露出——
        - id: ch01-b36
          speaker: mary_jane
          text: 好了，别再说了！我这就走，巴不得马上走。可是，真要把妹妹们留给他们吗？
        - id: ch01-b37
          speaker: huck
          text: 得留下她们，不过别担心，她们只是再忍一阵。三个人一起走，那两个家伙一定会起疑。您不能见他们，也不能见妹妹，最好连镇上的人也别碰到。邻居只要随口问一句两位叔叔今天好不好，您的脸就会把秘密全说出来。您现在就走，剩下的人都交给我应付。我会让苏珊小姐说，您出去几个钟头，想换换环境，歇一歇，或者去看一位朋友，今晚或明早回来，还可以替您向两位叔叔问好。
        - id: ch01-b38
          speaker: mary_jane
          text: 看朋友可以，可别替我向他们问好。
        - id: ch01-b39
          speaker: huck
          text: 好，那就不问好。答应她这件事不会惹出任何麻烦，办起来也一点不费力，却能让玛丽·简心里舒服。我当然愿意。人在这世上走路，常常就是这些不起眼的小事把路铺平。接着，我想起还有一件要紧事没说，就提起了那袋钱。
        - id: ch01-b40
          speaker: mary_jane
          text: 钱已经到了他们手里。一想到他们是怎么骗走的，我就觉得自己傻透了。
        - id: ch01-b41
          speaker: huck
          text: 那您可说错了，钱不在他们手里。
        - id: ch01-b42
          speaker: mary_jane
          text: 那钱在谁手里？
        - id: ch01-b43
          speaker: huck
          text: 我要是知道就好了，可我真的不知道。钱原先在我手里，因为我从他们那儿偷了出来，本想把它交给您。我也知道自己藏在哪里，可现在它恐怕已经不在那里了。真对不起，玛丽·简小姐，我心里要多难受有多难受。不过我已经尽了全力。我那时差点被人抓住，只能把钱塞进最先碰到的地方，赶紧逃开。偏偏那个地方实在很不牢靠。
        - id: ch01-b44
          speaker: mary_jane
          text: 不许再怪自己。你这样说太委屈自己了。那是没办法的事，根本不是你的错。你把钱藏在哪儿了？
        - id: ch01-b45
          speaker: huck
          text: 我不愿让她又想起那些伤心事，更说不出口，没法亲口告诉她那个地方。那样一说，她眼前准会看见尸体躺在棺材里，肚子上还压着钱袋。我沉默了一会儿，才问她能不能原谅我。我宁愿不把藏钱的地方说出口，不过可以写在纸上。等她走在去洛思罗普先生家的路上，什么时候想看，什么时候再打开。
        - id: ch01-b46
          speaker: mary_jane
          text: 当然可以。
        - id: ch01-b47
          speaker: huck
          text: 我在纸上写道，钱放进了棺材。那天夜里，她在那里哭的时候，钱还在里面。我当时躲在门后，看见她那样，心里难受极了。
        - id: ch01-b48
          speaker: huck
          text: 想起那一夜她孤零零地哭，两个恶魔却躺在她家的屋顶下欺辱她、抢劫她，我的眼睛也湿了。我把纸叠好交过去，她眼里也涌出了泪水。她紧紧握住我的手。
        - id: ch01-b49
          speaker: mary_jane
          text: 再见。你嘱咐我的事，我全都会照办。要是以后再也见不到你，我也永远不会忘记你。我会一遍遍地想起你，还会替你祷告。
          emotion: sad
        - id: ch01-b50
          speaker: huck
          text: 她说完就走了。替我祷告！我想，她要是真了解我，准会挑一件自己更做得来的差事。不过我敢说，她一定还是照样祷告了，她就是这样的人。只要她愿意，哪怕要替犹大祷告，她也敢做，绝不会退缩半步。别人爱怎么说就怎么说，照我看，她比我见过的任何姑娘都有胆量，从头到脚装的全是胆量。这听着像奉承，可绝不是奉承。论美貌，论善良，也没有谁比得过她。
        - id: ch01-b51
          speaker: huck
          text: 她走出那扇门以后，我就再也没有见过她，真的一次也没有过。可我想起过她千百万次，也千百万次想起她答应替我祷告。只要有一次，我觉得替她祷告真的管用，那我就是祷告到累死，也一定会替她祷告。
        - id: ch01-b52
          speaker: huck
          text: 我猜玛丽·简是从后门悄悄溜走的，因为屋里没有谁看见她离开。后来我碰见苏珊和兔唇姑娘乔安娜。为了替玛丽·简编出一个去处，我装作记不起名字，问她们河对岸那些常去走动的人家都叫什么。
        - id: ch01-b53
          speakers: [susan, joanna]
          ensemble: duo
          text: 那边有好几家，不过来往最多的是普罗克特一家。
        - id: ch01-b54
          speaker: huck
          text: 对，就是这个名字，我差点忘了。玛丽·简小姐让我告诉你们，普罗克特家有人病了，她有急事赶到河对岸去了。
        - id: ch01-b55
          speaker: susan
          text: 谁病了？
        - id: ch01-b56
          speaker: huck
          text: 我不知道，也可能是忘了。我想大概是——
        - id: ch01-b57
          speaker: joanna
          text: 老天保佑，可别是汉娜！
        - id: ch01-b58
          speaker: huck
          text: 很遗憾，正是汉娜。
        - id: ch01-b59
          speaker: susan
          text: 怎么会呢？她上星期还好好的！病得很重吗？
        - id: ch01-b60
          speaker: huck
          text: 重得没法说。玛丽·简小姐说，他们整夜守着她，都觉得她活不过几个钟头。
        - id: ch01-b61
          speaker: joanna
          text: 她到底得了什么病？
        - id: ch01-b62
          speaker: huck
          text: 我一时想不出什么像样的病，只好说是腮腺炎。
        - id: ch01-b63
          speaker: joanna
          text: 腮腺炎个鬼！谁会为了腮腺炎守上一整夜？
        - id: ch01-b64
          speaker: huck
          text: 普通的当然不用，可这种腮腺炎不一样。玛丽·简小姐说，这是新出来的一种。
        - id: ch01-b65
          speaker: joanna
          text: 新在哪里？
        - id: ch01-b66
          speaker: huck
          text: 里面还混着别的病。
        - id: ch01-b67
          speaker: joanna
          text: 混着什么病？
        - id: ch01-b68
          speaker: huck
          text: 有麻疹、百日咳、丹毒、肺痨、黄疸、脑热，还有一大堆，我实在记不全。
        - id: ch01-b69
          speaker: susan
          text: 我的老天！这样还叫腮腺炎？
        - id: ch01-b70
          speaker: huck
          text: 玛丽·简小姐就是这么说的。
        - id: ch01-b71
          speaker: joanna
          text: 可他们凭什么还管它叫腮腺炎？
        - id: ch01-b72
          speaker: huck
          text: 因为它本来就是腮腺炎，最先得的就是这个。
        - id: ch01-b73
          speaker: joanna
          text: 这话根本不通。一个人先踢伤脚趾，后来又中毒，再掉进井里，摔断脖子，撞破脑袋。别人问他怎么死的，一个傻瓜却说他是踢伤脚趾死的。哪有这种道理？你刚才的话也一样不通。那病会不会传人？
        - id: ch01-b74
          speaker: huck
          text: 会不会传人？这还用问吗？你在黑地里撞上一架耙，一根齿没钩住，还有下一根，总有一根会牢牢钩住你。等它钩住了，你想脱身，就得把整架耙都拖过来。这种腮腺炎也一样，而且还是一架厉害的大耙。
        - id: ch01-b75
          speaker: joanna
          text: 这病听着太吓人了，我得去告诉哈维舅舅。
          emotion: fearful
        - id: ch01-b76
          speaker: huck
          text: 对，换了我也会去告诉他，当然会去。一刻都别耽搁，赶紧去吧。
        - id: ch01-b77
          speaker: joanna
          text: 那你为什么刚才不让我去？
        - id: ch01-b78
          speaker: huck
          text: 您稍微想想就明白了。两位舅舅不是急着回英国吗？他们难道会把你们丢下，叫你们自己走那么远？当然不会。哈维舅舅又是牧师，他会为了让玛丽·简小姐上船，去骗汽船和海船上的办事员吗？当然也不会。
        - id: ch01-b79
          speaker: huck
          text: 他只会说，教会只好自己维持了。他的外甥女接触过可怕的合众为一腮腺炎，他必须留在这里等三个月，看看她会不会发病。不过，您要是觉得最好告诉他，那就去吧。
        - id: ch01-b80
          speaker: joanna
          text: 呸！我们本来可以去英国快活，却要留在这里干等三个月，看玛丽·简会不会生病？你说这种话，简直像个呆瓜。
        - id: ch01-b81
          speaker: huck
          text: 那么，也许还是告诉几个邻居比较好。
        - id: ch01-b82
          speaker: joanna
          text: 你可真是天生的笨。邻居难道不会跑去告诉舅舅？除了谁也不说，根本没有别的办法。
        - id: ch01-b83
          speaker: huck
          text: 嗯，也许您说得对。我看您的确说得对。
        - id: ch01-b84
          speaker: susan
          text: 可我们总该告诉哈维舅舅，她出去一会儿，免得他担心吧？
        - id: ch01-b85
          speaker: huck
          text: 对，玛丽·简小姐正是这么交代的。她请你们替她给哈维舅舅和威廉舅舅送上问候和亲吻，再告诉他们，她渡河去拜访彼得舅舅生前最看重的那户有钱人。那家人叫什么来着？
        - id: ch01-b86
          speaker: joanna
          text: 你说的是阿普索普一家吧？
        - id: ch01-b87
          speaker: huck
          text: 对，就是阿普索普。这种名字真难记。她赶过去，是想一定请他们来参加拍卖，把这栋房子买下来，因为她觉得彼得舅舅生前最愿意把房子交给他们。她会一直缠着他们，非等到他们答应不可。事情办完以后，她要是不太累，今晚就回来。要是累了，明天早晨无论如何也一定会回家。
        - id: ch01-b88
          speaker: huck
          text: 她还特意说，别提普罗克特家，只说阿普索普家。这完全是真话，因为她确实要请他们买房子，是她亲口告诉我的。
        - id: ch01-b89
          speakers: [susan, joanna]
          ensemble: duo
          text: 好吧。
        - id: ch01-b90
          speaker: huck
          text: 她们说完便走开了，准备等两位舅舅露面，好把问候、亲吻和口信都带过去。现在一切都妥当了。姑娘们一心盼着去英国，绝不会把生病的事泄露半个字。国王和公爵也巴不得玛丽·简在外面替拍卖奔走，不愿她留在家里，免得罗宾逊医生有机会接近她。
        - id: ch01-b91
          speaker: huck
          text: 我心里舒服极了，觉得这件事从头到尾办得相当漂亮。哪怕汤姆·索亚亲自出马，也不会安排得比我更周全。当然，他一定会在里头添上许多花样，摆出更大的排场。可我没受过那方面的教养，也从来没人教过我怎么做，所以摆弄排场这种事，我实在不太在行。
        - id: ch01-b92
          speaker: huck
          text: 下午快结束时，他们在公共广场上举行了拍卖。拍卖拖呀拖，简直没完没了。国王一直守在拍卖人身边，拿出浑身最坏、最毒的本事，时不时插上一小段《圣经》，再说几句假仁假义的好话。公爵则在四下里拼命装出一副可怜相，把全身的能耐都用上了。
        - id: ch01-b93
          speaker: huck
          text: 到后来，拍卖总算拖到了结尾。所有东西都卖掉了，只剩墓地里一小块不值钱的旧地，两个骗子连那块地也非得想办法脱手。我从没见过国王这么贪得无厌的长颈鹿，不管值不值钱，他都想一口吞进肚子里，半点东西也不肯留下。
        - id: ch01-b94
          speaker: huck
          text: 他们正忙着处理最后那块旧地，一艘汽船忽然靠了岸。不到两分钟，一大群人就从码头那边涌了过来。他们一路又叫又喊，又笑又闹，像赶着来看一场大热闹，嘴里还高声唱了起来。
        - id: ch01-b95
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 对手来啦！老彼得·威尔克斯的两拨继承人全到齐了！您付了钱，爱挑哪一拨就挑哪一拨！
