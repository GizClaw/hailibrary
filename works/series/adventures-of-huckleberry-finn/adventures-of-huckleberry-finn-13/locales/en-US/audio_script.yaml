  chapters:
    - id: ch01
      title: CHAPTER XIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: I caught my breath and nearly fainted. Jim and I were trapped on that wreck with those men. But there was no time to sit around feeling sorry for ourselves. We had to find their boat and take it.
        - id: ch01-b02
          speaker: huck
          text: We crept down the starboard side, shaking all over. It was slow work, and it felt like a week before we reached the stern. There was no sign of a boat. Jim was so frightened he could hardly move. He said he had no strength left and didn't think he could go any farther.
        - id: ch01-b03
          speaker: huck
          text: Come on, Jim. If this wreck carries us away, we're in real trouble.
        - id: ch01-b04
          speaker: huck
          text: We started searching again. We made for the stern of the texas, found it, and crawled forward over the skylight. Its edge was underwater, so we had to cling to one shutter after another. Near the cross-hall door, I could just make out the skiff. There it was. I was mighty thankful.
        - id: ch01-b05
          speaker: huck
          text: I was about to climb aboard when the door opened. A man stuck his head out just two feet from me. I thought I was done for, but he pulled it back inside.
        - id: ch01-b06
          speaker: packard
          text: Bill, get that blasted lantern out of sight!
        - id: ch01-b07
          speaker: huck
          text: Packard threw a bag into the skiff, climbed in, and sat down. Then Bill came out and joined him.
        - id: ch01-b08
          speaker: packard
          text: That's everything. Push off.
        - id: ch01-b09
          speaker: huck
          text: I felt so weak I could barely keep hold of the shutters. Then Bill stopped him.
        - id: ch01-b10
          speaker: bill
          text: Wait. Did you search him?
        - id: ch01-b11
          speaker: packard
          text: No. Didn't you?
        - id: ch01-b12
          speaker: bill
          text: No, and he's still got his part of the money.
        - id: ch01-b13
          speaker: packard
          text: Then let's go back. No sense taking the goods and leaving the cash.
        - id: ch01-b14
          speaker: bill
          text: Won't he figure out what we're doing?
        - id: ch01-b15
          speaker: packard
          text: Maybe not. Either way, we need that money. Come on.
        - id: ch01-b16
          speaker: huck
          text: They climbed out and went inside. The door slammed shut because the wreck leaned that way. Half a second later, I was in the skiff, and Jim tumbled in after me. I pulled my knife, cut the rope, and off we went.
        - id: ch01-b17
          speaker: huck
          text: We never touched an oar. We didn't speak, whisper, or hardly breathe. The current carried us swiftly and silently past the tip of the paddle box, then past the stern. A moment or two later, we were a hundred yards below the wreck. The darkness swallowed every last sign of it, and we knew we were safe.
        - id: ch01-b18
          speaker: huck
          text: Three or four hundred yards downstream, the lantern at the texas door showed for a second like a tiny spark. The men had missed their boat. Now they were beginning to see that they were in as much trouble as Jim Turner.
        - id: ch01-b19
          speaker: huck
          text: Jim took the oars, and we went looking for our raft. Only then did I start worrying about those men. I hadn't had time before. Even if they were murderers, it seemed awful to leave them trapped like that. I might turn into a murderer myself someday. How would I like it then?
        - id: ch01-b20
          speaker: huck
          text: Jim, when we see the first light, we'll land a hundred yards above or below it. You hide with the skiff. I'll make up a story and get somebody to rescue those men. Then they can be hanged when their proper time comes.
        - id: ch01-b21
          speaker: huck
          text: That plan didn't work. Another storm came up, worse than the first. Rain poured down, and no lights appeared. Everybody must have been in bed. The current drove us down the river while we kept watching for lights and watching for our raft.
        - id: ch01-b22
          speaker: huck
          text: After a long while, the rain eased. The clouds stayed, and the lightning kept making weak little flashes. At last, one flash showed a black shape floating ahead of us. We turned the skiff toward it and rowed after it.
        - id: ch01-b23
          speaker: huck
          text: It was our raft, and we were mighty glad to climb aboard again. Then we spotted a light far down the river on the right bank. I said I'd go to it.
        - id: ch01-b24
          speaker: huck
          text: The skiff was half full of things the gang had stolen from the wreck. We piled it all onto the raft. I told Jim to drift about two miles, show a light, and keep it burning until I came back. Then I took the oars and headed for the light.
        - id: ch01-b25
          speaker: huck
          text: As I came closer, three or four more lights appeared higher up on a hillside. It was a village. I moved in above the light by the shore, rested my oars, and let the current carry me past. Then I saw that the light was a lantern hanging from the jackstaff of a double-hulled ferryboat.
        - id: ch01-b26
          speaker: huck
          text: I searched for the watchman and wondered where he slept. At last I found him perched on the forward bitts, his head hanging between his knees. I nudged his shoulder two or three times and began to cry.
        - id: ch01-b27
          speaker: huck
          text: He woke with a start. When he saw I was only a boy, he gave a big yawn and stretched.
        - id: ch01-b28
          speaker: watchman
          text: Hello there. What's wrong? Don't cry, son. Tell me what happened.
        - id: ch01-b29
          speaker: huck
          text: It's Pap, and Mam, and my sister, and—
        - id: ch01-b30
          speaker: huck
          text: Then I broke down again.
        - id: ch01-b31
          speaker: watchman
          text: Oh, now, don't carry on. Trouble comes to everybody, and this will turn out all right. What's happened to them?
          emotion: calm
        - id: ch01-b32
          speaker: huck
          text: They're—they're—are you the watchman on this boat?
        - id: ch01-b33
          speaker: watchman
          text: Yes, and I'm proud of it. I'm the captain, owner, mate, pilot, watchman, and head deckhand. Sometimes I'm the freight and the passengers too. I'm not as rich as old Jim Hornback. I can't hand money to every Tom, Dick, and Harry the way he does. But I've told him plenty of times I wouldn't trade places. A sailor's life is the one for me. You couldn't pay me all his money twice over to live two miles outside town, where nothing ever happens. Like I always tell him—
        - id: ch01-b34
          speaker: huck
          text: They're in terrible trouble, and—
        - id: ch01-b35
          speaker: watchman
          text: Who is?
        - id: ch01-b36
          speaker: huck
          text: Pap and Mam and my sister and Miss Hooker. If you'd take your ferryboat up there—
        - id: ch01-b37
          speaker: watchman
          text: Up where? Where are they?
        - id: ch01-b38
          speaker: huck
          text: On the wreck.
        - id: ch01-b39
          speaker: watchman
          text: Which wreck?
        - id: ch01-b40
          speaker: huck
          text: There's only one.
        - id: ch01-b41
          speaker: watchman
          text: You don't mean the Walter Scott, do you?
        - id: ch01-b42
          speaker: huck
          text: Yes.
        - id: ch01-b43
          speaker: watchman
          text: Good land! What are they doing there? How did they ever get into that mess? If they don't get off quick, they haven't got a chance.
          emotion: surprised
        - id: ch01-b44
          speaker: huck
          text: They didn't go there on purpose. Miss Hooker had been visiting in the town up there.
        - id: ch01-b45
          speaker: watchman
          text: Booth's Landing. Go on.
        - id: ch01-b46
          speaker: huck
          text: She was visiting at Booth's Landing. Near evening, she and her Black woman took the horse ferry across the river to spend the night with a friend. Miss Something-or-other was the friend's name, but I can't remember it. They lost their steering oar and drifted stern-first for about two miles. Then the ferry got caught crossways on the wreck.
        - id: ch01-b47
          speaker: huck
          text: The ferryman, the woman, and the horses were all lost, but Miss Hooker grabbed hold and climbed onto the wreck. About an hour after dark, our trading scow came downstream. It was so dark that we didn't see the wreck until we hit it and got caught across it too. Everybody survived except Bill Whipple. He was the best person among us. I almost wish it had been me instead.
        - id: ch01-b48
          speaker: watchman
          text: My George! I've never heard anything like it. What did you all do then?
          emotion: surprised
        - id: ch01-b49
          speaker: huck
          text: We shouted and carried on, but the river is so wide there that nobody could hear. Pap said one of us had to reach shore and find help. I was the only one who could swim, so I went for it.
        - id: ch01-b50
          speaker: huck
          text: Miss Hooker told me that if I couldn't find help sooner, I should come here and find her uncle. He'd know what to do. I reached land about a mile below the wreck and have been trying ever since to get somebody to help. They all said nobody could go out in a night and current like this. They told me to find the steam ferry. So if you'll only go—
        - id: ch01-b51
          speaker: watchman
          text: By Jackson, I'd like to. Blast it, maybe I will. But who's going to pay me? Do you think your pap—
        - id: ch01-b52
          speaker: huck
          text: That part's all right. Miss Hooker made sure to tell me her uncle Hornback—
        - id: ch01-b53
          speaker: watchman
          text: Great guns! Jim Hornback is her uncle? Run toward that light over there. Turn west when you reach it, and you'll find the tavern about a quarter mile away. Have them take you straight to Hornback's place, and he'll pay the bill.
        - id: ch01-b54
          speaker: watchman
          text: Don't waste time. He'll want to hear what happened. Tell him I'll have his niece safe before he gets into town. Hurry now. I'm going around the corner to wake my engineer.
        - id: ch01-b55
          speaker: huck
          text: I headed toward the light, but as soon as the watchman turned the corner, I went back to my skiff and bailed out the water. Then I rowed about six hundred yards upstream through the easy water along the shore and tucked myself in among some woodboats. I couldn't settle down until I saw the ferryboat leave for the wreck.
        - id: ch01-b56
          speaker: huck
          text: When I thought it all over, I felt fairly good about going to so much trouble for that gang. Not many people would have done it. I wished the widow knew what I'd done. I figured she'd be proud of me for helping those scoundrels, because scoundrels and deadbeats were exactly the sort of people the widow and other good folks cared most about.
        - id: ch01-b57
          speaker: huck
          text: Before long, the wreck came sliding downstream, dim in the darkness. A cold shiver went through me, and I rowed toward it. It sat so deep in the water that I knew there wasn't much chance anybody was still alive.
        - id: ch01-b58
          speaker: huck
          text: I circled the wreck and called out a little. No one answered. Everything was dead still. I felt somewhat heavyhearted about the gang, though not too much. If they could stand it, I figured I could too.
        - id: ch01-b59
          speaker: huck
          text: Then the ferryboat came. I pulled toward the middle of the river on a long slant downstream. When I thought I was too far away to be seen, I rested my oars and looked back.
        - id: ch01-b60
          speaker: huck
          text: The ferryboat went nosing all around the wreck, looking for whatever might be left of Miss Hooker. The captain knew her uncle Hornback would want her remains. Before long, the ferryboat gave up the search and headed back toward shore. Then I bent hard to my oars and went racing downriver.
        - id: ch01-b61
          speaker: huck
          text: It felt like forever before Jim's light appeared, and when it did, it seemed a thousand miles away. By the time I reached him, the eastern sky was turning gray.
        - id: ch01-b62
          speaker: huck
          text: We headed for an island, hid the raft, sank the skiff, and lay down. Then we slept like dead people.
