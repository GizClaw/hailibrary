audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实温厚，谨慎中带着生动的幽默
        timbre: 浑厚温暖
        pace: 从容自然
        pitch: 低
    jake_packard:
      display_name: 杰克·帕卡德
      tts:
        delivery: 冷静算计，语气阴沉
        timbre: 粗粝冷硬
        pace: 缓慢审慎
        pitch: 低
    bill:
      display_name: 比尔
      tts:
        delivery: 粗暴凶狠，咄咄逼人
        timbre: 低沉浑浊
        pace: 强硬有力
        pitch: 低
    watchman:
      display_name: 渡船守夜人
      tts:
        delivery: 爱吹嘘又热心，带着河上人的爽直
        timbre: 粗厚响亮
        pace: 略慢而健谈
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十三章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我好不容易喘过气，差点儿又昏过去。跟那伙杀人犯一起困在沉船上，想想就吓人。可眼下不是伤感叹气的时候。我们非找到他们的小艇不可，还得把它弄到自己手里，要不然自己就走不了。
        - id: ch01-b02
          speaker: huck
          text: 我和吉姆抖得厉害，沿右舷一点点摸向船尾，仿佛走了一个星期。到了船尾，还是没有小艇。吉姆吓得浑身没力气，说再也挪不动了。我告诉他，要是被撇在沉船上，咱俩才真要命。于是我们咬着牙，继续往前摸。
        - id: ch01-b03
          speaker: huck
          text: 我们绕到顶层舱房后面，攀着一扇又一扇百叶窗，沿天窗往前爬。天窗边已经浸在水里。快到横廊门口时，我终于在黑暗里勉强看见了小艇，心里真是谢天谢地。再有一秒，我就能跳上去。偏偏门开了，一个男人在离我两英尺的地方探出头来。我以为自己完了，好在他马上缩了回去。
        - id: ch01-b04
          speaker: jake_packard
          text: 比尔，把那盏破灯藏好！
        - id: ch01-b05
          speaker: huck
          text: 帕卡德往艇里扔了一袋东西，跨进去坐下。比尔也跟着上船。
        - id: ch01-b06
          speaker: jake_packard
          text: 都齐了，开船吧。
        - id: ch01-b07
          speaker: huck
          text: 我虚弱得几乎抓不住百叶窗，比尔却忽然叫住了他。
        - id: ch01-b08
          speaker: bill
          text: 等等，你搜过特纳的身没有？
        - id: ch01-b09
          speaker: jake_packard
          text: 没有。你也没搜？
        - id: ch01-b10
          speaker: bill
          text: 没有。那他分到的钱还揣在身上呢。
        - id: ch01-b11
          speaker: jake_packard
          text: 那就回去。东西拿了，钱可不能留下。
        - id: ch01-b12
          speaker: bill
          text: 他会不会猜出咱们想干什么？
        - id: ch01-b13
          speaker: jake_packard
          text: 也许不会。反正钱必须拿到，走。
        - id: ch01-b14
          speaker: huck
          text: 两人下艇回到沉船，门装在船身倾斜的一侧，自己砰地关上了。不到半秒钟，我已经跳进小艇，吉姆也跌跌撞撞地跟了进来。我拔出刀割断绳子，小艇一下就漂开了。
        - id: ch01-b15
          speaker: huck
          text: 我们不敢碰桨，不敢说话，连耳语一声也不敢，几乎连气都不喘。小艇悄无声息地飞快滑过明轮罩的尽头，又滑过船尾。再过一两秒，我们已经到了下游一百码外。黑暗把沉船一点不剩地吞了进去。我们知道，自己安全了。
        - id: ch01-b16
          speaker: huck
          text: 漂出三四百码以后，顶层舱房门口的灯像一颗小火星，短短亮了一下。那几个恶棍已经发现小艇没了。他们这才慢慢明白，自己如今的麻烦，跟吉姆·特纳的一样大。
        - id: ch01-b17
          speaker: huck
          text: 吉姆拿起双桨去追木筏，我这才顾得上替那伙人担心，先前实在没有工夫去想。哪怕是杀人犯，困在那里也够可怕的。我想，谁也说不准，没准儿有一天我也会杀人。到时候换成我，我愿意被人撇下吗？
        - id: ch01-b18
          speaker: huck
          text: 看到第一盏灯，咱们就在它上游或下游一百码处靠岸，找个能把你和小艇藏好的地方。然后我去编个故事，找人到沉船上搭救那帮家伙。这样，他们就能先逃过这一劫，等到该上绞架的那天再上绞架了。
        - id: ch01-b19
          speaker: huck
          text: 这个主意没能实行。暴风雨又来了，比先前还凶。大雨铺天盖地，岸上连一盏灯也没有，人人大概都睡了。我们顺流飞驰，一边找灯，一边找木筏。很久以后，雨才小下来。云还压着河面，闪电仍在低低地呜咽。后来一道电光照出前方水上漂着的黑影，我们马上划了过去。
        - id: ch01-b20
          speaker: huck
          text: 那正是木筏。我们高兴极了，赶紧爬上去。右边远处的岸上又出现一盏灯，我决定划过去求救。小艇里装着那伙人从沉船偷来的赃物，足足有半船。我们赶紧把东西全堆到木筏上。我让吉姆继续顺流往下漂，估摸走出两英里左右就点起灯，一直亮着，等到我回来。
        - id: ch01-b21
          speaker: huck
          text: 我独自划向那盏灯。快到时，山坡上又亮起三四盏，原来那里有个村庄。我从岸边灯光的上游靠近，收起桨顺水漂过去，才看清提灯挂在一艘双体渡船的艏旗杆上。我在船边转来转去，一面找守夜人，一面猜他究竟睡在哪儿。最后，我发现他蜷在船头的系缆柱上，脑袋垂在两腿中间睡觉。我轻轻推了他两三下，马上哭了起来。
        - id: ch01-b22
          speaker: watchman
          text: 喂，小家伙，出什么事了？先别哭，到底怎么啦？
        - id: ch01-b23
          speaker: huck
          text: 我爹、我娘和我姐姐都出事了，还有一个人……
        - id: ch01-b24
          speaker: huck
          text: 我说到一半，就像实在忍不住似的，哭得讲不下去了。
        - id: ch01-b25
          speaker: watchman
          text: 哎，别这么难受。谁都会遇上麻烦，你家的事也会好起来。他们怎么了？
        - id: ch01-b26
          speaker: huck
          text: 他们……他们……您是这条船的守夜人吗？
        - id: ch01-b27
          speaker: watchman
          text: 没错。我既是船长和船主，又是大副、舵手、守夜人、甲板长。有时候，我还得兼做货物和乘客。
        - id: ch01-b28
          speaker: watchman
          text: 我可没有老吉姆·霍恩巴克那么有钱，不能像他一样，对汤姆、迪克、哈里，随便哪个人都慷慨，花钱从不眨眼。不过我不知对他说过多少回，就算能换，我也不换他的日子。当水手才叫生活。要我住到城外两英里、半点热闹也没有的地方，哪怕把他的全部钱财给我，再添上同样多的一份，我也不干。
        - id: ch01-b29
          speaker: huck
          text: 他们碰上天大的麻烦了，而且……
        - id: ch01-b30
          speaker: watchman
          text: 谁碰上麻烦了？
        - id: ch01-b31
          speaker: huck
          text: 是我爹、我娘、我姐姐，还有胡克小姐。我希望您能开渡船到上游去救他们。
        - id: ch01-b32
          speaker: watchman
          text: 去哪儿？他们在哪里？
        - id: ch01-b33
          speaker: huck
          text: 在沉船上。
        - id: ch01-b34
          speaker: watchman
          text: 哪条沉船？
        - id: ch01-b35
          speaker: huck
          text: 这儿不就只有一条吗？
        - id: ch01-b36
          speaker: watchman
          text: 你不会是说“沃尔特·司各特号”吧？
        - id: ch01-b37
          speaker: huck
          text: 就是那条船。
        - id: ch01-b38
          speaker: watchman
          text: 天哪！他们怎么会跑到那儿去？
        - id: ch01-b39
          speaker: huck
          text: 又不是他们故意去的。
        - id: ch01-b40
          speaker: watchman
          text: 当然不是！要不赶紧离开，他们可活不成。快说，他们怎么惹上这场麻烦的？
        - id: ch01-b41
          speaker: huck
          text: 事情很简单。胡克小姐到上面镇里拜访朋友……
        - id: ch01-b42
          speaker: watchman
          text: 对，布思渡口。接着说。
        - id: ch01-b43
          speaker: huck
          text: 她在布思渡口作客。傍晚时，她带着黑人女仆乘载马渡船过河，要去一位朋友家过夜。那位小姐的名字，我想不起来了。渡船半路丢了操舵桨，掉过头，船尾朝前漂下两英里，横着卡在沉船上。渡船夫、女仆和马全都没了，只有胡克小姐一把抓住沉船，爬了上去。
        - id: ch01-b44
          speaker: huck
          text: 天黑一个钟头以后，我们乘买卖货物的平底船下来。四周太黑，直到撞上去才看见沉船。我们的船也横着卡住了。除了比尔·惠普尔，其他人都活了下来。比尔是天底下最好的人，我真希望死的是我。
        - id: ch01-b45
          speaker: watchman
          text: 我的上帝！我还没听过这么离奇的事。后来你们怎么办？
        - id: ch01-b46
          speaker: huck
          text: 我们又喊又哭，可那里的河面太宽，岸上谁也听不见。爹说，无论如何，必须有人游上岸求救。只有我会游水，我就一头跳进河里。胡克小姐说，如果路上找不到帮手，就到这里来找她舅舅，他一定能把事情办妥。
        - id: ch01-b47
          speaker: huck
          text: 我在下游一英里外爬上岸，从那以后一直东奔西跑，求人帮忙。可他们都说，这种夜晚，河水又这么急，去了也没有用，叫我找蒸汽渡船。所以我才来求您开船去救他们。
        - id: ch01-b48
          speaker: watchman
          text: 我向杰克逊发誓，我倒真想去，说不定也真会去。可是这趟船钱谁付？你爹肯付吗？
        - id: ch01-b49
          speaker: huck
          text: 钱的事完全没问题。胡克小姐特意叮嘱过我，她舅舅霍恩巴克会付钱。
        - id: ch01-b50
          speaker: watchman
          text: 好家伙，霍恩巴克是她舅舅？你快朝那边的灯跑，到了就往西拐。再走大约四分之一英里，就能看见旅店。叫旅店的人马上送你去吉姆·霍恩巴克家，他会付清这趟船钱。
        - id: ch01-b51
          speaker: watchman
          text: 路上千万别磨蹭，霍恩巴克准等着听消息。告诉他，等他赶进城，我早把他的外甥女平平安安救回来了。快跑吧！我这就绕到拐角那边，把睡着的轮机手叫醒。
        - id: ch01-b52
          speaker: huck
          text: 我朝灯光跑去，等他转过拐角，立刻折回来跳进小艇。我舀掉艇里的积水，沿水流平缓的岸边往上划了大约六百码，把自己和小艇藏在几条运木船之间。没亲眼看见渡船开出去，我总不能安心。
        - id: ch01-b53
          speaker: huck
          text: 为了那伙人费了这么大工夫，我心里还挺舒坦，因为没几个人肯这样做。我真希望寡妇知道这件事。她一定会为我帮助这些恶棍而骄傲。毕竟寡妇和其他好人最关心的，不正是流氓和废物这一类人吗？
        - id: ch01-b54
          speaker: huck
          text: 没过多久，那条沉船影影绰绰地顺流滑了下来。我浑身掠过一阵寒意，赶快掉转小艇，迎着它划了过去。船身已经沉得很深，我一眼就看出，上面的人多半活不成了。我绕着它划了一整圈，又喊了几声，没有任何回答，四周死一样静。我有点替那伙人难过，不过也不算太难过。我想，他们都受得住，我当然也受得住。
        - id: ch01-b55
          speaker: huck
          text: 渡船接着赶来，我便顺着水势斜斜划向河心。等到没人能看见我，才收起双桨，回头张望。渡船围着沉船嗅来嗅去，要找胡克小姐的遗骸。船长当然知道，她舅舅霍恩巴克一定想要这些。
        - id: ch01-b56
          speaker: huck
          text: 没过多久，渡船终于放弃了搜寻，掉头朝岸边开去。我这才使足力气，飞快地顺流而下。吉姆的灯迟迟不出现，等我终于看见它，仿佛还在一千英里外，怎么划也到不了。
        - id: ch01-b57
          speaker: huck
          text: 等我终于赶回木筏，东方的天空已经微微发白。于是我们一起划向一座小岛，把木筏仔细藏好，又把小艇沉进水里。忙完这些，我们才倒头睡下，一个个睡得像死人一样。
