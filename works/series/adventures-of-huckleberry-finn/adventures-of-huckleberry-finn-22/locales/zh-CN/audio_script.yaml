audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    sherburn:
      display_name: 舍本上校
      tts:
        delivery: 冷峻克制，威胁时不动声色
        timbre: 坚硬深沉
        pace: 缓慢稳定
        pitch: 低
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    onlooker_1:
      display_name: 围观者甲
      tts:
        delivery: 激动急切，容易跟着人群起哄
        timbre: 明亮有力
        pace: 偏快
        pitch: 中
    onlooker_2:
      display_name: 围观者乙
      tts:
        delivery: 粗声粗气，呼喊时毫不迟疑
        timbre: 粗厚响亮
        pace: 爽快
        pitch: 中低
    ringmaster:
      display_name: 马戏领班
      tts:
        delivery: 干练响亮，维持秩序时郑重客气
        timbre: 洪亮清晰
        pace: 爽利
        pitch: 中
  chapters:
    - id: ch01
      title: 暴民来到舍本家
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 人群朝舍本家涌过去，像印第安人一样吼叫发怒。路上的东西要是不赶快让开，就会叫他们撞倒，踩成肉泥。孩子们尖叫着跑在最前头，只想躲开后面的人。沿路的窗口全挤着女人的脑袋，树上爬满黑人男孩，黑人男女也隔着篱笆张望。人群一靠近，他们便赶紧逃到够不着的地方。许多女人和姑娘吓得又哭又嚷。
        - id: ch01-b02
          speaker: huck
          text: 大家挤到舍本家的尖桩篱笆前。院子不过二十英尺见方，外面却塞得密不透风，吵得连自己的念头都听不清。
        - id: ch01-b03
          speakers: [onlooker_1, onlooker_2]
          ensemble: duo
          text: 拆掉篱笆！拆掉篱笆！
          emotion: angry
        - id: ch01-b04
          speaker: huck
          text: 撕的、扯的、砸的，一片乱响。篱笆倒了，最前面的人就像一道浪头，朝院子里卷进去。偏在这时候，舍本拿着双筒猎枪，走上门前小廊的顶。他站稳以后，一声不响，神情从容得很。嘈杂声立刻停了，那道浪头又缩了回去。
        - id: ch01-b05
          speaker: huck
          text: 舍本只管站在那里往下看。四周静得阴森，叫人难受。他慢慢扫视人群。被他盯住的人还想跟他对看几眼，可是谁也撑不住，最后都低下头，神情鬼鬼祟祟。过了一会儿，舍本笑了一声。那笑一点也不亲切，听着就像吃面包时嚼到了沙子。
    - id: ch02
      title: 舍本的训斥
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 接着，舍本用缓慢而轻蔑的口气开了口。
        - id: ch02-b02
          speaker: sherburn
          text: 就凭你们，也想把谁拖出去吊死？真可笑。你们竟以为自己有胆子对一个男人动私刑！你们只敢欺负路过这里、无依无靠的可怜女人，给她们涂柏油、粘羽毛，却以为自己也有种对男人下手？只要还是白天，只要一个男人没把后背留给你们，就算落到一万个你们这种人手里，也安全得很。
        - id: ch02-b03
          speaker: sherburn
          text: 我不了解你们？我早把你们看透了。我生在南方，长在南方，也在北方住过，所以各地寻常人的德性，我都清楚。寻常人就是懦夫。在北方，谁想踩他都能踩过去。他回家以后，还祷告上帝给他一颗谦卑的心，好让他忍下去。在南方，一个人孤身一人，光天化日之下就能拦住满载乘客的驿车，把整车人抢光。
        - id: ch02-b04
          speaker: sherburn
          text: 你们的报纸天天夸你们勇敢，弄得你们真以为自己比别人勇敢。其实你们跟别人一样，一点也不多。陪审团为什么不判杀人犯绞刑？因为他们怕凶手的朋友趁天黑从背后放冷枪。而那帮人也确实会这么干。
        - id: ch02-b05
          speaker: sherburn
          text: 所以陪审团总判无罪。随后才有一个男人夜里出动，身后跟着一百个蒙面的懦夫，把恶棍吊死。你们今天犯了两个错。头一个，是没带一个男人来。第二个，是没等到天黑，也没带面具。你们只带来半个男人，就是那边的巴克·哈克尼斯。要不是他带头，你们也就吹吹牛罢了。
        - id: ch02-b06
          speaker: sherburn
          text: 其实你们根本不想来。寻常人不喜欢麻烦和危险，你们也一样。可只要巴克·哈克尼斯那种半个男人喊一声“吊死他”，你们就不敢后退。你们怕别人看出自己是懦夫，只好跟着大叫，揪住那个半吊子的衣尾，气势汹汹地冲来，赌咒说自己要干多了不起的大事。
        - id: ch02-b07
          speaker: sherburn
          text: 世上最可怜的东西就是暴民，军队也是一群暴民。他们打仗靠的不是自己胸中的勇气，而是从人多势众和长官那里借来的。可暴民若连一个男人带头都没有，那就连可怜都不配了。现在，夹起尾巴回家去，钻进洞里。真有人要动私刑，也会照南方的做派，等天黑，戴上面具，再带一个男人来。现在滚吧，把你们那半个男人也带走。
        - id: ch02-b08
          speaker: huck
          text: 说完，他把猎枪横架到左臂上，扳起击锤。人群猛地往后一退，立刻散了，朝四面八方飞跑。巴克·哈克尼斯也灰溜溜地追在后面。我要是愿意，本来可以留下，可我不愿意。
    - id: ch03
      title: 马戏开场
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 我跑到马戏场，在帐篷后面转悠。看守一走过去，我便从帐篷底下钻了进去。我身上有一枚二十美元的金币，还有些零钱，可还是省着好。一个人离家在外，四周又都是生人，谁知道什么时候会用钱？再小心也不过分。没有别的法子时，我不反对花钱看马戏，可既然能不花，也就不用浪费。
        - id: ch03-b02
          speaker: huck
          text: 那场马戏真棒。全班人马一男一女，两两并骑入场，是我见过最壮观的场面。男人只穿衬裤和汗衫，没穿鞋，也不用马镫，两手轻松地放在大腿上，足有二十人。女士们个个面色娇美，漂亮得像一群货真价实的王后。她们的衣裳仿佛值几百万美元，上面还缀满了钻石。那景象真是好看极了，我从没见过那么美的东西。
        - id: ch03-b03
          speaker: huck
          text: 接着，他们一个个站到马背上，轻轻巧巧地绕场穿行，身子随着马步柔和地起伏。男人显得又高又直，身子轻飘飘的，脑袋几乎在帐篷顶下掠过。女士们玫瑰花瓣似的裙子，在腰间柔软如丝地飘动，她们活像世上最漂亮的阳伞。
        - id: ch03-b04
          speaker: huck
          text: 马越跑越快，所有人都在马背上跳舞，一只脚伸向空中，再换另一只。马身越倾越斜，领班绕着中央柱子一圈圈跑，鞭子甩得啪啪响，嘴里不断高喊“嗨！嗨！”小丑紧跟在他后面说笑。后来，骑手全松开缰绳。女士们把拳头抵在腰间，先生们抱住双臂，马弓起背，斜得更厉害。
        - id: ch03-b05
          speaker: huck
          text: 最后，骑手们一个接一个跳进场内，行了我见过最漂亮的礼，随即飞奔出去。观众拼命拍手，几乎全疯了。
    - id: ch04
      title: 醉汉的把戏
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 整场马戏里，演员一直在表演最惊人的绝技。小丑也不停胡闹，差点把观众活活笑死。领班无论对他说什么，他一眨眼就能顶回来，说的全是世上最逗的话，句句又快又巧。我真不明白，他怎么能一下想出那么多笑话，还来得那么突然、那么合适。换成我，想上一年也想不出来。
        - id: ch04-b02
          speaker: huck
          text: 后来，一个醉汉要闯进场内。他说自己想骑马，骑得不比任何人差。大家劝阻，他一句也不听，表演只好停下来。观众开始叫骂，还拿他取笑。他恼火了，大吵大闹。许多男人从长凳上拥下来，朝场内涌去。
        - id: ch04-b03
          speakers: [onlooker_1, onlooker_2]
          ensemble: duo
          text: 揍倒他！把他扔出去！
          emotion: angry
        - id: ch04-b04
          speaker: huck
          text: 还有一两个女人尖叫起来。领班只好站出来，要大家别闹。
        - id: ch04-b05
          speaker: ringmaster
          text: 我希望这里别出乱子。只要这个人答应不再惹事，而且他真觉得自己能待在马背上，我就让他骑一回。
        - id: ch04-b06
          speaker: huck
          text: 大家笑着答应，那人便上了马。他才坐稳，马就猛蹦乱跳，到处乱窜。两个马戏班的人吊在笼头上，拼命想把马拉住。醉汉死死搂住马脖子，每跳一下，两只脚跟都飞到半空。观众全站起来，又喊又笑，眼泪都流出来了。
        - id: ch04-b07
          speaker: huck
          text: 最后，那匹马挣脱众人，发疯似的绕场飞奔。醉鬼趴在马背上，紧抱马脖子，一会儿这条腿从一边垂下，几乎碰地，一会儿另一条腿又挂到另一边。观众看得发狂，我却一点也不觉得好笑。我怕他出危险，浑身直抖。
        - id: ch04-b08
          speaker: huck
          text: 没过多久，他挣扎着跨坐起来，抓住缰绳，左右摇晃。下一刻，他忽然跃起，丢开缰绳，在马背上站住了！马跑得像着了火，他却轻轻松松地站着绕场飞驰，仿佛一辈子也没醉过。
        - id: ch04-b09
          speaker: huck
          text: 接着，他一件件脱下衣服，随手往外扔。衣服多得几乎把空中堵住，前后竟脱了十七套。最后露出来的，是个又瘦又漂亮的男人，穿着鲜艳华美的戏服。他挥鞭催马，叫马跑得飞快，随后跳下马，行过一礼，一路舞进更衣室。全场又惊又喜，吼声震天。
        - id: ch04-b10
          speaker: huck
          text: 领班这才知道自己叫人耍了，那副难受的样子，我从没在别的领班脸上见过。原来那醉汉就是马戏班自己的演员！整场把戏都是他独自想出来的，事前谁也没告诉。连我都受骗了，实在难为情。可就算给我一千美元，我也不愿换到领班的位置。我不知道世上还有没有更棒的马戏，反正我还没遇见过。这一场已经够我满意了，以后不论在哪里再碰见，我每回都来捧场。
    - id: ch05
      title: 王室奇人
      blocks:
        - id: ch05-b01
          speaker: huck
          text: 当天晚上，我们也开演了。观众只有十二个左右，收入刚够开销。他们从头笑到尾，把公爵气坏了。除了一个睡着的男孩，其余人没等演完就走光了。
        - id: ch05-b02
          speaker: duke
          text: 这些阿肯色州的笨蛋根本欣赏不了莎士比亚。他们只想看低俗滑稽戏，兴许还得比低俗滑稽戏更糟一点。我已经摸清他们的口味了。
        - id: ch05-b03
          speaker: huck
          text: 第二天早晨，公爵找来几大张包装纸和一些黑漆，写好海报，贴遍全镇。上面说，法院仅演三夜，举世闻名的悲剧大师小大卫·加里克和老埃德蒙·基恩，来自伦敦及欧洲大陆各大剧院，将联手献演惊心动魄的悲剧《国王的长颈鹿》，又名《王室奇人》。票价五角。
        - id: ch05-b04
          speaker: huck
          text: 最下面还有一行最大的字，写着“妇女儿童不得入场”。公爵看着那行字，很是得意。
        - id: ch05-b05
          speaker: duke
          text: 瞧，这一行要是还招不来他们，那俺就算不懂阿肯色州！
