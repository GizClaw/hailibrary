  chapters:
    - id: ch01
      title: CHAPTER XXII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The mob rushed toward Sherburn's house, whooping and raging. Everything in the road had to move or get trampled flat. Children ran ahead, screaming as they tried to escape. Women crowded every window. Black boys watched from the trees, and men and women leaned over the fences until the mob came close. Then they scattered out of reach. Women and girls were crying and carrying on, nearly scared to death.
        - id: ch01-b02
          speaker: huck
          text: They packed together in front of Sherburn's fence, making such a roar you couldn't hear yourself think. His yard was only about twenty feet deep. Then some men shouted.
        - id: ch01-b03
          speakers: [mob_man_1, mob_man_2, mob_man_3, mob_man_4]
          ensemble: chorus
          text: Tear down the fence! Tear it down!
          emotion: angry
        - id: ch01-b04
          speaker: huck
          text: Wood ripped, cracked, and smashed. The fence fell, and the front of the crowd rolled into the yard like a wave.
        - id: ch01-b05
          speaker: huck
          text: Right then, Sherburn stepped onto the roof of his little front porch. He held a double-barreled gun and took his place without saying a word. He was perfectly calm and deliberate. The noise stopped, and that human wave pulled back.
        - id: ch01-b06
          speaker: huck
          text: Sherburn stood there looking down. The silence felt awful and creepy. He slowly swept his eyes across the crowd. Wherever he looked, people tried to stare back, but none of them could. They lowered their eyes and looked sneaky. After a while, Sherburn gave a little laugh. It wasn't a pleasant laugh. It felt like biting into bread with sand in it.
        - id: ch01-b07
          speaker: sherburn
          text: You people think you can lynch somebody? That's amusing. You think you have enough courage to lynch a man? You can tar and feather some poor friendless woman who's been cast out, so you imagine you have the nerve to lay hands on a man. A real man is safe among ten thousand of your kind, as long as it's daytime and you aren't behind him.
        - id: ch01-b08
          speaker: sherburn
          text: Do I know you? I know you all the way through. I was born and raised in the South, and I've lived in the North, so I know the average man everywhere. He's a coward. Up North, he lets anybody walk over him, then goes home and prays for the humility to bear it. Down South, one man has stopped a whole stagecoach in daylight and robbed everyone aboard.
        - id: ch01-b09
          speaker: sherburn
          text: Your newspapers call you brave so often that you've started believing you're braver than other people. You aren't. You're just as brave as anybody else, and no braver. Why don't your juries hang murderers? Because the jurors are afraid the murderer's friends will shoot them in the back after dark. And that is exactly what those friends would do.
        - id: ch01-b10
          speaker: sherburn
          text: So the jury sets the murderer free. Later, one man comes at night with a hundred masked cowards behind him, and they lynch the rascal. You made two mistakes today. You didn't bring a man with you, and you didn't come after dark wearing masks. All you brought was part of a man, Buck Harkness over there. Without him to stir you up, you would've done nothing but make noise.
        - id: ch01-b11
          speaker: sherburn
          text: None of you wanted to come. The average man doesn't like trouble or danger, and neither do you. But when half a man like Buck Harkness yells for a lynching, you're afraid to back down. Somebody might discover that you're cowards. So you yell too. You grab onto that half-man's coattails and storm up here, swearing about all the mighty things you'll do.
        - id: ch01-b12
          speaker: sherburn
          text: Nothing is more pitiful than a mob. An army is a mob too. Its men don't fight with courage of their own. They borrow it from the crowd and from their officers. But a mob with no man leading it is lower than pitiful. Now drop your tails, go home, and crawl into a hole. If a real lynching happens, it will happen Southern-style, in the dark. The men will wear masks, and they'll bring a man to lead them. Now leave, and take your half-man with you.
        - id: ch01-b13
          speaker: huck
          text: As he said it, Sherburn swung the gun across his left arm and cocked it.
        - id: ch01-b14
          speaker: huck
          text: The crowd washed backward all at once. Then it broke apart, with people running every way. Buck Harkness raced after them, looking pretty cheap. I could've stayed if I'd wanted to, but I didn't want to.
        - id: ch01-b15
          speaker: huck
          text: I went to the circus and hung around behind the tent until the watchman passed. Then I slipped underneath. I had my twenty-dollar gold piece and some other money, but I figured I'd better save it. Away from home among strangers, you never know when you'll need money. I don't mind paying for a circus when there's no other way in. I just don't believe in wasting money on one.
        - id: ch01-b16
          speaker: huck
          text: It was a first-rate circus. The grand entrance was the finest sight I'd ever seen. The riders came in two by two, a gentleman beside a lady. There must've been twenty of them. The men wore only drawers and undershirts, with no shoes and no stirrups. They sat easy, resting their hands on their thighs. The ladies were beautiful and looked like real queens. Their clothes seemed worth millions, with diamonds scattered all over them.
        - id: ch01-b17
          speaker: huck
          text: Then the riders stood up one after another. They circled the ring in a smooth, graceful line. The men looked tall and straight, their heads gliding high beneath the tent roof. Each lady's soft, silky dress fluttered around her hips until she looked like the loveliest parasol you ever saw.
        - id: ch01-b18
          speaker: huck
          text: They went faster and faster, dancing with one foot in the air and then the other. The horses leaned farther into the turn. The ringmaster ran around the center pole, cracking his whip and calling out.
        - id: ch01-b19
          speaker: ringmaster
          text: Hi! Hi!
        - id: ch01-b20
          speaker: huck
          text: The clown followed behind, throwing out jokes. Soon every rider dropped the reins. The ladies put their knuckles on their hips, and the gentlemen folded their arms. Those horses leaned over and drove forward. At last, the riders skipped down into the ring one after another, gave the sweetest bows I'd ever seen, and scampered out. The whole audience clapped and nearly went wild.
        - id: ch01-b21
          speaker: huck
          text: The performers did astonishing things all through the circus. That clown kept everyone laughing so hard it nearly killed them. Every time the ringmaster spoke to him, he fired back with an answer that was quick and perfectly funny. I couldn't understand how anybody could think up so many jokes that fast. I couldn't have done it in a year.
        - id: ch01-b22
          speaker: huck
          text: After a while, a drunk man tried to climb into the ring. He said he wanted to ride and could ride as well as anybody alive. The circus men argued with him and tried to keep him out, but he wouldn't listen. The whole show stopped.
        - id: ch01-b23
          speaker: huck
          text: People began jeering and making fun of him. That made him mad, and he started raising a terrible fuss. Then men came piling down from the benches and crowded toward the ring, shouting.
        - id: ch01-b24
          speakers: [mob_man_1, mob_man_2, mob_man_3, mob_man_4]
          ensemble: chorus
          text: Knock him down! Throw him out!
          emotion: angry
        - id: ch01-b25
          speaker: huck
          text: One or two women screamed. The ringmaster made a short speech. He said he hoped there wouldn't be any trouble. If the man promised to behave, he could try riding, provided he thought he could stay on the horse.
        - id: ch01-b26
          speaker: huck
          text: Everybody laughed and agreed, so the man climbed on. Right away, the horse began bucking, jumping, and tearing around. Two circus men clung to the bridle and tried to hold it. The drunk man wrapped himself around the horse's neck, with his heels flying up at every jump. The audience stood, shouting and laughing until tears ran down their faces.
        - id: ch01-b27
          speaker: huck
          text: At last, the horse broke loose in spite of all the circus men could do. It flew around and around the ring. The drunk lay across its back, clinging to its neck. First one leg nearly dragged on one side, then the other leg nearly dragged on the other. The crowd went crazy. I couldn't laugh. I was trembling because the man looked in such danger.
        - id: ch01-b28
          speaker: huck
          text: Then he fought his way upright, straddled the horse, and caught the bridle. He swayed from side to side. A moment later, he let go and sprang to his feet. The horse was still racing like a house on fire, but the man stood there as easy as if he'd never been drunk in his life.
        - id: ch01-b29
          speaker: huck
          text: Next he began tearing off his clothes and flinging them away. The suits came off so fast they seemed to fill the air. He shed seventeen of them altogether. Underneath was a slim, handsome man in the brightest, finest costume you ever saw. He whipped the horse into an even faster run. Then he jumped down, bowed, and danced away to the dressing room while everybody howled with delight and astonishment.
        - id: ch01-b30
          speaker: huck
          text: The ringmaster finally understood that he'd been fooled, and he looked sicker than any ringmaster you ever saw. The rider was one of his own performers. He had planned the trick entirely by himself and never told a soul.
        - id: ch01-b31
          speaker: huck
          text: I felt sheepish for being fooled too, but I wouldn't have traded places with that ringmaster for a thousand dollars. Maybe there are better circuses somewhere, but I've never found one. That show was plenty good enough for me, and if I ever met it again, it could count on my business every time.
        - id: ch01-b32
          speaker: huck
          text: That night, it was our turn to put on a show. Only about twelve people came, just enough to cover our expenses. They laughed the whole time, which made the duke mad. Everyone left before the performance ended except one boy, and he was asleep.
        - id: ch01-b33
          speaker: huck
          text: The duke said those Arkansas blockheads couldn't appreciate Shakespeare. They wanted low comedy, maybe something even lower. He told us he understood their taste now.
        - id: ch01-b34
          speaker: huck
          text: The next morning, he took big sheets of wrapping paper and black paint. He made handbills and pasted them all over the village. They announced three nights at the courthouse. The world-famous tragedians David Garrick the Younger and Edmund Kean the Elder, from the London and Continental theaters, would appear in their thrilling tragedy, The King's Camelopard, or The Royal Nonesuch. Admission was fifty cents.
        - id: ch01-b35
          speaker: huck
          text: At the very bottom, the duke painted the biggest line of all. It said that ladies and children would not be admitted.
        - id: ch01-b36
          speaker: duke
          text: There. If that line doesn't bring them in, then I don't know Arkansas.
