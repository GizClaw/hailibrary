  chapters:
    - id: ch01
      title: CHAPTER XLII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Uncle Silas went uptown again before breakfast, but he found no sign of Tom. He and Aunt Sally sat at the table without eating. They looked miserable, and their coffee went cold while they thought in silence. At last Uncle Silas spoke.
        - id: ch01-b02
          speaker: uncle_silas
          text: Did I ever give you that letter?
        - id: ch01-b03
          speaker: aunt_sally
          text: What letter do you mean?
        - id: ch01-b04
          speaker: uncle_silas
          text: The one I picked up at the post office yesterday.
        - id: ch01-b05
          speaker: aunt_sally
          text: No, you never gave me one.
        - id: ch01-b06
          speaker: uncle_silas
          text: Well, I must have forgotten.
        - id: ch01-b07
          speaker: huck
          text: He searched his pockets, then went off to wherever he'd left it and brought it back. Aunt Sally looked at the letter.
        - id: ch01-b08
          speaker: aunt_sally
          text: Why, this came from St. Petersburg. It's from Sis.
        - id: ch01-b09
          speaker: huck
          text: I thought another walk might do me good, but I couldn't make myself move. Before Aunt Sally could tear open the letter, she caught sight of something, dropped it, and ran. I saw the same thing. Tom Sawyer was being carried toward us on a mattress. The old doctor came with him. Jim was there too, still wearing Aunt Sally's calico dress, with his hands tied behind his back. A whole crowd followed them.
        - id: ch01-b10
          speaker: huck
          text: I shoved the letter behind the first thing I could find and rushed outside. Aunt Sally threw herself over Tom, crying.
        - id: ch01-b11
          speaker: aunt_sally
          text: Oh, he's dead! I know he's dead!
          emotion: fearful
        - id: ch01-b12
          speaker: huck
          text: Tom moved his head a little and muttered. He clearly wasn't in his right mind, but he was alive. Aunt Sally flung up her hands.
        - id: ch01-b13
          speaker: aunt_sally
          text: He's alive, thank God! That's all that matters!
          emotion: happy
        - id: ch01-b14
          speaker: huck
          text: She kissed him, then flew toward the house to ready his bed. All the way, she fired off orders to everyone she passed. The doctor and Uncle Silas followed Tom inside. I went after the men with Jim because I wanted to see what they would do to him.
        - id: ch01-b15
          speaker: huck
          text: The men were in an ugly temper. Some wanted to hang Jim as a warning to every other enslaved person nearby, so nobody else would run away and cause this much trouble. They blamed him for keeping the whole family frightened nearly to death for days and nights. Others said hanging him would never do. Jim belonged to somebody else. His owner was sure to appear and make them pay. That cooled the angry ones. The men most eager to hang another man's enslaved person were not eager at all to pay after they had their satisfaction.
        - id: ch01-b16
          speaker: huck
          text: They still cursed Jim plenty and struck him alongside the head now and then. Jim never answered them. He didn't even let on that he knew me. They marched him back to the same cabin, took off the calico dress, and put him in his own clothes. Then they chained him again. They didn't use the bed leg this time. They drove a great staple into the cabin's bottom log and fastened him to that, with chains on both hands and both legs.
        - id: ch01-b17
          speaker: huck
          text: They said he would get only bread and water until his owner came. If nobody claimed him within a set time, they would sell him at auction. They filled our escape hole. Two farmers with guns were to guard the cabin every night, and a bulldog would be tied at the door during the day. When the men had finished the work and were trailing off into a last general round of curses, the doctor came over and looked at Jim.
        - id: ch01-b18
          speaker: doctor
          text: Don't treat him any rougher than you have to, gentlemen. He isn't a bad man. When I found the boy, I saw I couldn't remove the bullet without help. He was in no condition to be left alone while I went looking for someone. He kept getting worse. After a long while, he grew delirious and wouldn't let me near him. He threatened to kill me if I chalked his raft and went on with all sorts of wild nonsense. I couldn't do a thing with him by myself.
        - id: ch01-b19
          speaker: doctor
          text: I said aloud that I had to get help somehow. The moment I said it, this man crawled out from somewhere and offered. And he did help. He did it very well. Of course, I figured he must be a runaway. That put me in a fine fix, because I had to stay there through the rest of the day and all night. I had two patients in town with the chills and wanted to see them. But I didn't dare leave. If this man escaped, people would blame me, and not one skiff came close enough for me to call over.
        - id: ch01-b20
          speaker: doctor
          text: I was stuck there until daylight this morning. I have never seen a better or more faithful nurse. He risked his freedom to help that boy, though he was worn out himself. Anyone could see he'd been worked terribly hard lately. I respected him for that. A man like him is worth a thousand dollars, gentlemen, and he deserves kind treatment too.
        - id: ch01-b21
          speaker: doctor
          text: I had all the supplies I needed, and the boy did as well there as he would have at home. Maybe better, since it was so quiet. Still, I had the two of them on my hands and couldn't leave until nearly dawn. Then some men passed in a skiff. By good luck, this man had fallen sound asleep beside the pallet with his head resting on his knees. I signaled for the men to come in quietly. They slipped up behind him, seized him, and tied him before he understood what was happening. We had no trouble at all.
        - id: ch01-b22
          speaker: doctor
          text: The boy was in a restless sort of sleep too. We muffled the oars, tied the raft behind the skiff, and towed it across very slowly and quietly. This man never made the least disturbance. He didn't fight us or speak a word from the moment we took him. He isn't a bad man, gentlemen. That's my judgment of him.
        - id: ch01-b23
          speaker: townsman
          text: I have to admit, Doctor, that speaks well for him.
        - id: ch01-b24
          speaker: huck
          text: The rest softened a little too. I was deeply grateful to the doctor for helping Jim that way. It also pleased me that I'd judged him right when we first met. I'd believed he had a good heart, and he did.
        - id: ch01-b25
          speaker: huck
          text: Everyone agreed Jim had behaved well and deserved some notice and reward. Each man gave a hearty promise that he wouldn't curse Jim anymore. Then they came out and locked him in.
        - id: ch01-b26
          speaker: huck
          text: I hoped they might remove one or two of those terribly heavy chains. Maybe they would let Jim have meat and greens along with his bread and water. Nobody thought of either thing. I figured I had better not interfere just then. Once I got past the trouble waiting for me, I meant to find some way of telling Aunt Sally everything the doctor had said.
        - id: ch01-b27
          speaker: huck
          text: That waiting trouble was the explanation I owed her. When I told her how Sid and I had spent that wretched night paddling around in search of Jim, I'd somehow forgotten to mention that Sid had been shot. I needed a story that could carry me through that. But there was no hurry yet. Aunt Sally stayed beside Tom in the sickroom all day and all night. Whenever I saw Uncle Silas wandering around with his thoughts elsewhere, I dodged him before he could question me.
        - id: ch01-b28
          speaker: huck
          text: The next morning, I heard Tom was much better and that Aunt Sally had gone to get some sleep. I slipped into the sickroom. If Tom was awake, I figured we could invent an explanation that would satisfy the family. He was sleeping peacefully, though. His face was pale now, not burning red as it had been when they brought him in. I sat down to wait.
        - id: ch01-b29
          speaker: huck
          text: About half an hour later, Aunt Sally glided into the room, and once again I was trapped with no way out. She motioned for me to keep still and sat beside me. In a whisper, she said we could all be joyful now. Every sign was first-rate. Tom had slept peacefully for a long time, looking better and calmer every minute. She believed the odds were strong that he would wake with his mind clear again.
        - id: ch01-b30
          speaker: huck
          text: We sat watching him. Before long, Tom stirred, opened his eyes naturally, and looked around.
        - id: ch01-b31
          speaker: tom
          text: Hello! Why, I'm home! How did that happen? Where's the raft?
          emotion: surprised
        - id: ch01-b32
          speaker: huck
          text: The raft's all right.
        - id: ch01-b33
          speaker: tom
          text: And Jim?
        - id: ch01-b34
          speaker: huck
          text: He's the same.
        - id: ch01-b35
          speaker: huck
          text: I couldn't say it very boldly, but Tom didn't notice.
        - id: ch01-b36
          speaker: tom
          text: Good! Splendid! Now we're safe and everything's fine. Did you tell Aunty?
          emotion: happy
        - id: ch01-b37
          speaker: huck
          text: I was about to say yes, but Aunt Sally spoke first.
        - id: ch01-b38
          speaker: aunt_sally
          text: Tell me what, Sid?
        - id: ch01-b39
          speaker: tom
          text: Why, how we did the whole thing.
        - id: ch01-b40
          speaker: aunt_sally
          text: What whole thing?
        - id: ch01-b41
          speaker: tom
          text: There's only one. How Tom and I set the runaway free.
        - id: ch01-b42
          speaker: aunt_sally
          text: Good land! Set the run—what is this child talking about? Dear, dear, he's out of his head again!
          emotion: surprised
        - id: ch01-b43
          speaker: tom
          text: No, I'm not out of my head! I know exactly what I'm saying. Tom and I planned to free him, and we did it. We did it elegantly too.
        - id: ch01-b44
          speaker: huck
          text: Once Tom got started, Aunt Sally couldn't stop him. She only stared while he raced ahead, and I saw there was no use trying to interrupt.
        - id: ch01-b45
          speaker: tom
          text: Aunty, it took us weeks of hard work, hours and hours every night while everyone slept. We stole candles, a sheet, a shirt, your dress, spoons, tin plates, case-knives, the warming pan, the grindstone, flour, and more things than I can name. You can't imagine the labor it took to make the saws and pens and carve all those inscriptions. And you can't imagine half the fun we had doing it.
        - id: ch01-b46
          speaker: tom
          text: We drew coffins and other things and wrote anonymous letters from robbers. We climbed up and down the lightning rod, dug a hole into the cabin, made a rope ladder, baked it into a pie, and slipped spoons and tools into your apron pocket for you to carry to Jim.
        - id: ch01-b47
          speaker: aunt_sally
          text: Mercy sakes!
          emotion: surprised
        - id: ch01-b48
          speaker: tom
          text: We filled Jim's cabin with rats and snakes and other creatures to keep him company. Then you held Tom here so long with that butter in his hat that you nearly ruined everything. The men reached the cabin before we got out, and we had to rush. They heard us escaping and fired at us. That's how I got my share of the shooting.
        - id: ch01-b49
          speaker: tom
          text: We slipped away from the path and let the men rush past us. When the dogs came, they weren't interested in our trail. They ran after the loudest noise instead. We reached our canoe, paddled to the raft, and made it to safety. Jim was a free man. Tom and I had done every bit of it by ourselves. Wasn't it grand, Aunty?
          emotion: happy
        - id: ch01-b50
          speaker: aunt_sally
          text: I never heard such a thing in my life! So you little scamps caused all this trouble, turned everyone's wits inside out, and frightened us nearly to death. I ought to punish you both this very minute. Night after night I've been—just you wait until you're well, young man. I'll tan the Old Harry out of both of you!
          emotion: angry
        - id: ch01-b51
          speaker: huck
          text: Tom was so proud and joyful over the adventure that he couldn't hold his tongue. He kept pouring out the story as fast as he could. Aunt Sally broke in again and again, spitting fire all the while, and Tom talked straight over her. They both went at once until the room sounded like a whole convention of cats.
        - id: ch01-b52
          speaker: aunt_sally
          text: Enjoy yourself while you can. If I catch you meddling with him again—
          emotion: angry
        - id: ch01-b53
          speaker: tom
          text: Meddling with who?
          emotion: surprised
        - id: ch01-b54
          speaker: aunt_sally
          text: Who do you think? The runaway, of course.
        - id: ch01-b55
          speaker: huck
          text: Tom's smile vanished. He looked at me very seriously.
        - id: ch01-b56
          speaker: tom
          text: Tom, didn't you say he was all right? Didn't he get away?
        - id: ch01-b57
          speaker: aunt_sally
          text: Him? The runaway? Indeed he didn't. They brought him back safe and sound. He's chained up in that cabin again with nothing but bread and water until somebody claims him or they sell him.
        - id: ch01-b58
          speaker: huck
          text: Tom sat straight up in bed. His eyes burned, and his nostrils opened and closed like gills. He shouted at me.
        - id: ch01-b59
          speaker: tom
          text: They have no right to lock him up! Go, and don't waste a minute. Turn him loose! He isn't a slave. He's as free as any creature walking this earth!
          emotion: angry
        - id: ch01-b60
          speaker: aunt_sally
          text: What does this child mean?
          emotion: surprised
        - id: ch01-b61
          speaker: tom
          text: I mean every word, Aunt Sally. If nobody else goes, I'll go myself. I've known Jim all my life, and so has Tom. Old Miss Watson died two months ago. She was ashamed that she'd ever planned to sell Jim down the river, and she said so. She set him free in her will.
        - id: ch01-b62
          speaker: aunt_sally
          text: Then why on earth did you try to free him when he was free already?
        - id: ch01-b63
          speaker: tom
          text: Well, that's just the kind of question a woman would ask! I wanted the adventure. I'd have waded neck-deep in blood to—goodness alive, Aunt Polly!
          emotion: surprised
        - id: ch01-b64
          speaker: huck
          text: Aunt Polly was standing just inside the door, looking as sweet and satisfied as an angel half full of pie. I swear it was so.
        - id: ch01-b65
          speaker: huck
          text: Aunt Sally sprang toward her, nearly hugged her head off, and cried over her. As for me, I found a good place under the bed. Things were getting too warm for us. I peeped out. After a little while, Aunt Polly shook herself free and looked over her spectacles at Tom as if she meant to grind him into the floor.
        - id: ch01-b66
          speaker: aunt_polly
          text: Yes, you'd better turn your head away, Tom. I surely would if I were you.
        - id: ch01-b67
          speaker: aunt_sally
          text: Oh, dear me! Has he changed that much? Why, that isn't Tom. That's Sid. Tom is—Tom is—why, where did Tom go? He was here a minute ago.
          emotion: surprised
        - id: ch01-b68
          speaker: aunt_polly
          text: You mean where is Huck Finn. I didn't raise my Tom all these years just to stop knowing him when I see him. That would be a fine state of things. Come out from under that bed, Huck Finn.
        - id: ch01-b69
          speaker: huck
          text: I came out, though I wasn't feeling bold.
        - id: ch01-b70
          speaker: huck
          text: Aunt Sally looked more mixed up than almost anyone I'd ever seen. The only person who beat her was Uncle Silas after he came in and they told him everything. The news left him acting almost drunk. He couldn't make sense of anything for the rest of the day. That night he preached such a tangled sermon at the prayer meeting that not even the oldest man alive could have understood it. That sermon gave Uncle Silas a tremendous reputation.
        - id: ch01-b71
          speaker: huck
          text: Aunt Polly explained who I really was and how I'd come to be there. Then I had to stand up and tell my part. When Mrs. Phelps first mistook me for Tom Sawyer, I'd been caught in such a tight place that I had no choice but to accept the name and go along with her mistake.
        - id: ch01-b72
          speaker: aunt_sally
          text: Oh, keep calling me Aunt Sally. I'm used to it now, so there's no need to change.
        - id: ch01-b73
          speaker: huck
          text: I explained that I knew Tom wouldn't mind the trick. A mystery like that would be pure pleasure to him, and he'd turn it into an adventure the moment he saw it. He would be perfectly satisfied. That was exactly how it turned out. When Tom arrived and understood what I'd done, he pretended to be Sid and made things as easy for me as he could.
        - id: ch01-b74
          speaker: huck
          text: Aunt Polly confirmed that Tom had told the truth about Miss Watson. Before she died, Miss Watson had set Jim free in her will. So Tom Sawyer really had gone through every bit of that trouble and bother to set a man free who was free already. Until that moment and that conversation, I had never understood how a boy with Tom's upbringing could bring himself to help an enslaved man escape.
        - id: ch01-b75
          speaker: huck
          text: Then Aunt Polly told them what she'd thought when Aunt Sally wrote that Tom and Sid had arrived safely.
        - id: ch01-b76
          speaker: aunt_polly
          text: I said to myself, I should have expected this after letting that boy travel without anyone watching him. Now I'll have to tramp eleven hundred miles down the river and find out what that creature is doing this time, since Sally won't answer my questions.
        - id: ch01-b77
          speaker: aunt_sally
          text: But I never heard anything from you.
        - id: ch01-b78
          speaker: aunt_polly
          text: Well, that is strange! I wrote twice to ask what you meant by saying Sid was here.
        - id: ch01-b79
          speaker: aunt_sally
          text: Those letters never reached me, Sis.
        - id: ch01-b80
          speaker: huck
          text: Aunt Polly turned slowly toward Tom. Her face was severe.
        - id: ch01-b81
          speaker: aunt_polly
          text: You, Tom!
          emotion: angry
        - id: ch01-b82
          speaker: tom
          text: Well, what?
        - id: ch01-b83
          speaker: aunt_polly
          text: Don't you say “what” to me, you impudent boy. Hand over those letters before I take hold of you myself.
          emotion: angry
        - id: ch01-b84
          speaker: tom
          text: What letters?
        - id: ch01-b85
          speaker: aunt_polly
          text: You know which letters. I declare, if I have to grab you, I'll—
          emotion: angry
        - id: ch01-b86
          speaker: tom
          text: They're in the trunk. There. They're exactly as they were when I took them from the post office. I never opened them or touched what was inside. I knew they'd cause trouble, and I thought if you weren't in a hurry, I could—
        - id: ch01-b87
          speaker: aunt_polly
          text: You certainly need a whipping. There's no doubt about that. I sent another letter saying I was coming, and I suppose he took that one too.
          emotion: angry
        - id: ch01-b88
          speaker: aunt_sally
          text: No, that one came yesterday. I haven't read it yet, but it's safe. I have it.
        - id: ch01-b89
          speaker: huck
          text: I wanted to bet her two dollars that she didn't have it. Then I decided keeping quiet was probably safer.
