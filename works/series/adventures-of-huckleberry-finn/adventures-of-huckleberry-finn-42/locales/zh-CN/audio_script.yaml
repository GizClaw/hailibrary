    doctor:
      display_name: 医生
      tts:
        delivery: 和善老练，问话时带着谨慎的审视
        timbre: 温和而略显苍老
        pace: 不疾不徐
        pitch: 中低
    uncle_silas:
      display_name: 西拉斯姨父
      tts:
        delivery: 朴实厚道，对孩子宽容又带几分无奈
