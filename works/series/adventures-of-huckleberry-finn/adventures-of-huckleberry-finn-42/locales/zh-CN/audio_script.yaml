    aunt_polly:
      display_name: 波莉姨妈
      tts:
        delivery: 精明严厉，训斥中藏着亲切和疼爱
        timbre: 清亮有力的老年女声
        pace: 干脆
        pitch: 中高
  chapters:
    - id: ch01
      title: 第四十二章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 早餐还没开，西拉斯姨父又进镇找了一趟，仍没打听到汤姆的消息。他和萨莉姨妈坐在饭桌旁，谁也不吃，谁也不说话，只顾愁眉苦脸地想心事，连咖啡都凉透了。过了好一会儿，姨父才开口。
        - id: ch01-b02
          speaker: uncle_silas
          text: 我把那封信交给你没有？
        - id: ch01-b03
          speaker: aunt_sally
          text: 哪一封信？
        - id: ch01-b04
          speaker: uncle_silas
          text: 就是昨天从邮局取回来的那封。
        - id: ch01-b05
          speaker: aunt_sally
          text: 没有啊，你没给我。
        - id: ch01-b06
          speaker: uncle_silas
          text: 那准是我给忘了。
        - id: ch01-b07
          speaker: huck
          text: 他把衣袋翻了一遍，又去不知哪里找回那封随手搁下的信。萨莉姨妈接过来，一看信封便说，信是圣彼得堡寄来的，是姐姐写的。我觉得自己最好再出去走一趟，可偏偏一步也挪不动。她还没拆开，忽然看见外面的来人，手一松，丢下信就跑。我也看见了。汤姆·索亚躺在一张褥子上，被人抬着回来。老医生走在旁边。吉姆也在那里，还穿着姨妈那件印花布裙子，双手反绑在背后。后面跟着一大群人。我连忙把信藏到手边一样东西后面，也冲了出去。姨妈扑到汤姆身上，哭了起来。
        - id: ch01-b08
          speaker: aunt_sally
          text: 他死了！他一定已经死了！
          emotion: fearful
        - id: ch01-b09
          speaker: huck
          text: 汤姆稍稍转头，嘴里含混地说了几声。他神志不清，可到底还活着。姨妈猛地举起双手。
        - id: ch01-b10
          speaker: aunt_sally
          text: 他还活着，感谢上帝！别的我什么都不求了！
          emotion: happy
        - id: ch01-b11
          speaker: huck
          text: 她抢着亲了汤姆一口，马上飞奔回屋铺床。一路遇见谁，她就吩咐谁，嘴里一刻也不停。老医生和西拉斯姨父跟着汤姆进屋，我却跟上押送吉姆的人，要看看他们准备怎么处置他。
        - id: ch01-b12
          speaker: huck
          text: 那些人怒气冲冲。有人要把吉姆吊死，给附近所有黑奴立个榜样，叫他们别再学他逃跑。吉姆这一逃，惹下成堆的乱子，害得整整一家人一连几天几夜几乎活活吓死。另一些人却说绝对不能吊。吉姆不是他们的财产，他的主人早晚会露面，到时准会让他们赔钱。这样一说，前面那些人总算消了点气。说来也怪，最急着吊死别人家黑奴的人，出了气以后，往往也最不愿意掏钱赔。
        - id: ch01-b13
          speaker: huck
          text: 不过他们照旧一路咒骂，时不时还朝吉姆脑袋旁边扇一巴掌。吉姆从头到尾没有出声，也没露出认识我的样子。他们把他押回原来那间小屋，脱下印花布裙子，换回他自己的衣服。这一回不再锁床腿。他们在小屋最底下一根圆木上钉进大铁环，把他锁在上面，两只手、两条腿也全加了锁链。
        - id: ch01-b14
          speaker: huck
          text: 他们宣布，在主人来领以前，吉姆只能吃面包、喝清水。过了事先规定好的期限还没人来认领，就把他送去拍卖。大家又填上我们挖的洞，安排两个带枪的农场主每晚守在小屋外，白天则把斗牛犬拴在门口。事情办完，他们正骂骂咧咧地往外走，老医生过来看了看吉姆。
        - id: ch01-b15
          speaker: doctor
          text: 先生们，没必要就别再难为他。他不是个坏人。我找到那个孩子时，一看就知道，没有人帮忙，子弹根本取不出来。孩子的情形又太糟，我也不能丢下他去找人。他越来越严重，后来神志都乱了，不许我靠近，还说我要是在他的木筏上做记号，他就杀了我，又讲了一大堆疯话。我一个人实在没办法，只好说，无论如何也得找个帮手。
        - id: ch01-b16
          speaker: doctor
          text: 我话刚出口，这个人就不知道从哪里爬出来，说愿意帮忙。他不但帮了，还帮得很好。我当然猜到他是逃出来的。这一下，我可给难住了，只能从白天一直守到夜里。镇上有两个发寒热的病人，我本来很想回去看他们，可又不敢离开。万一他跑了，责任就在我。偏偏没有一只小船靠得够近，能听见我喊。
        - id: ch01-b17
          speaker: doctor
          text: 我就这样困到今天天亮。我从没见过比他更会照顾人、更尽心的黑奴。他明知道会赔上自由，还是留下帮那个孩子。他自己已经累垮了，谁都看得出，近来有人叫他干过极重的活。就为这个，我也喜欢他。这样一个黑奴值一千美元，先生们，也值得别人好好待他。
        - id: ch01-b18
          speaker: doctor
          text: 我需要的东西一样不少，孩子在那里养伤，跟回家一样好，说不定还更好，因为那儿清静。可是孩子和这个黑奴都压在我手上，我只能一直熬到快天亮。后来有几个男人划小船经过。正巧这人坐在铺边，头枕着膝盖，睡得很沉。我悄悄招手让他们过来。他们从后面抓住他，在他反应过来以前就捆好了，一点麻烦也没费。
        - id: ch01-b19
          speaker: doctor
          text: 孩子也睡得迷迷糊糊。我们把桨包住，不让它出声，再把木筏系到小船后面，安安静静地拖回来。从被抓住起，这个人既没反抗，也没说过一句话。先生们，他不是个坏人。我就是这么看他的。
        - id: ch01-b20
          speaker: townsman
          text: 医生，我得承认，照你这么说，他这回事确实做得不错。
        - id: ch01-b21
          speaker: huck
          text: 其他人听了，态度也软下来。我很感激老医生肯替吉姆说好话，也高兴自己第一次见他时没有看错。我那时就觉得他心肠好，是个好人。大伙儿都承认，吉姆的表现值得称许，也该给点奖赏。于是他们一个个痛快地保证，以后不再骂他。
        - id: ch01-b22
          speaker: huck
          text: 说完，他们还是出来锁上了门。那些链子沉得要命，我盼着谁能提出卸下一两条，或者让吉姆吃面包、喝清水以外，也能吃点肉和蔬菜。可谁都没想到。我看这时不该插嘴，只能盘算着，等闯过眼前的难关，再设法把医生从头到尾讲的经过告诉萨莉姨妈。她要是知道吉姆为了救汤姆，连自己的自由都肯冒险，或许会替他说句话。
        - id: ch01-b23
          speaker: huck
          text: 那道难关，就是我得解释一件事。我先前告诉姨妈，我和席德怎样划着船找了一整夜的吉姆，却偏偏没提席德中了枪。不过暂时还不用着急。萨莉姨妈整天整夜守在病房里，西拉斯姨父一失魂落魄地晃过来，我就赶紧躲开。
        - id: ch01-b24
          speaker: huck
          text: 第二天早晨，我听说汤姆好了许多，别人还说，守了一昼夜的姨妈终于去打盹了。我便溜进病房。要是汤姆已经醒来，我们准能合伙编出一套让家里人相信的说法。可他还睡着，睡得很安稳，脸色已经从被抬回来时烧得通红变成了苍白。我只好坐下来等。大约半个钟头以后，姨妈轻手轻脚地进来，我又给堵得没有退路了。她示意我千万别出声，在我身旁坐下，小声告诉我，现在大家都可以放心高兴了。汤姆所有的症状都好得不能再好。他这样安稳地睡了很久，脸色越来越好，神情也越来越安详，十有八九，醒来时脑子也会清楚。
        - id: ch01-b25
          speaker: huck
          text: 我们一同守着他。过了一会儿，汤姆动了动，自自然然地睁开眼，四下看了看。
        - id: ch01-b26
          speaker: tom
          text: 咦，我怎么回到家了？这是怎么回事？木筏呢？
          emotion: surprised
        - id: ch01-b27
          speaker: huck
          text: 木筏好好的。
        - id: ch01-b28
          speaker: tom
          text: 那吉姆呢？
        - id: ch01-b29
          speaker: huck
          text: 也一样。
        - id: ch01-b30
          speaker: huck
          text: 我回答得一点也不硬气，可他没有察觉。
        - id: ch01-b31
          speaker: tom
          text: 好，太棒了！这下大家全都安全啦。你把事情告诉姨妈了吗？
          emotion: happy
        - id: ch01-b32
          speaker: huck
          text: 我正想说告诉了，姨妈却先问他，究竟是什么事。
        - id: ch01-b33
          speaker: tom
          text: 就是整件事怎么办成的呀。
        - id: ch01-b34
          speaker: aunt_sally
          text: 哪一件事？
        - id: ch01-b35
          speaker: tom
          text: 还能有哪一件？就是我和汤姆怎样把那个逃跑的黑奴放走的。
        - id: ch01-b36
          speaker: aunt_sally
          text: 老天爷！放走逃跑的……这孩子究竟在讲什么？哎呀，他脑子又糊涂了！
          emotion: surprised
        - id: ch01-b37
          speaker: tom
          text: 我的脑子才不糊涂，每句话我都清楚。我们真的把他放了，就是我和汤姆。我们早早就打定主意，最后也真干成了，还干得漂亮极了。
        - id: ch01-b38
          speaker: huck
          text: 他一说起来就收不住。姨妈只管盯着他，根本插不上手。我知道这时自己说什么也没有用。
        - id: ch01-b39
          speaker: tom
          text: 姨妈，这可花了我们好几个星期。你们每天晚上睡着以后，我们都得干上好几个钟头。我们偷了蜡烛、床单、衬衫、您的裙子、勺子、锡盘、餐刀、暖床锅、磨刀石、面粉，还有数不清的东西。做那些锯子、笔和题字费了多少工夫，您根本想不到，可有多好玩，您也连一半都猜不着。
        - id: ch01-b40
          speaker: tom
          text: 我们还得画棺材，假装强盗写匿名信，顺着避雷针爬上爬下，挖洞钻进小屋。绳梯做好以后，要烤进馅饼送进去。勺子和别的工具呢，就藏在您的围裙口袋里带进去。
        - id: ch01-b41
          speaker: aunt_sally
          text: 我的老天！
          emotion: surprised
        - id: ch01-b42
          speaker: tom
          text: 我们还往小屋里塞了老鼠和蛇，给吉姆作伴。偏偏您把汤姆扣在这里，让他把黄油藏在帽子里，差点把事情全毁了。那些人赶到时，我们还没逃出小屋，只好拼命跑。他们听见声音就开枪，我也挨了一下。我们躲到小路外面，让他们从旁边冲过去。狗来了，只管追动静最大的地方，也没理我们。于是我们弄到独木舟，划去木筏。大家平安无事，吉姆也自由了。这一切都是我们自己办成的。姨妈，这还不够棒吗？
        - id: ch01-b43
          speaker: aunt_sally
          text: 我活到今天也没听过这样的事！原来所有乱子都是你们两个小坏蛋惹的。你们把大家的脑子搅得翻了个个儿，还差点把我们全吓死。我现在就恨不得收拾你。你先把伤养好，小混蛋，等你能下床，我非狠狠抽你们两个一顿不可！
          emotion: angry
        - id: ch01-b44
          speaker: huck
          text: 汤姆正得意快活，哪里停得下来。姨妈一路插嘴发火，两个人一起嚷个不停，简直像一群猫聚在一起开大会。姨妈终于压住他说了一句。
        - id: ch01-b45
          speaker: aunt_sally
          text: 好，你现在只管高兴。可我告诉你，要是再让我抓到你去招惹他……
          emotion: angry
        - id: ch01-b46
          speaker: tom
          text: 招惹谁？
          emotion: surprised
        - id: ch01-b47
          speaker: aunt_sally
          text: 还能是谁？当然是那个逃跑的黑奴。
        - id: ch01-b48
          speaker: huck
          text: 汤姆的笑容一下没了。他神情严肃地转向我。
        - id: ch01-b49
          speaker: tom
          text: 汤姆，你刚才不是说他好好的吗？他没有逃掉？
        - id: ch01-b50
          speaker: aunt_sally
          text: 他才没逃掉！人家已经把他平安抓回来了。他又关进那间小屋，只能吃面包、喝清水，身上全是锁链。等人来认领他，要是没人来，就把他卖掉。
        - id: ch01-b51
          speaker: huck
          text: 汤姆猛地从床上坐直，眼里冒着火，鼻孔像鱼鳃一样一张一合，冲我大喊。
        - id: ch01-b52
          speaker: tom
          text: 他们凭什么关他？快去，一分钟也别耽搁，马上把他放了！他不是奴隶。他跟世上任何一个会走路的活物一样自由！
          emotion: angry
        - id: ch01-b53
          speaker: aunt_sally
          text: 这孩子究竟是什么意思？
        - id: ch01-b54
          speaker: tom
          text: 我说的每个字都当真，萨莉姨妈。要是没人肯去，我自己去。我从小就认识他，旁边那个汤姆也是。老华生小姐两个月前死了。她后悔自己竟想过把他卖到下游去，也亲口承认很羞愧，所以在遗嘱里给了他自由。
        - id: ch01-b55
          speaker: aunt_sally
          text: 既然他本来就是自由人，你为什么还非要去救他？
        - id: ch01-b56
          speaker: tom
          text: 这算什么问题？女人真是的！我要的是那场冒险。就算要趟过齐脖子深的血，我也会……我的天，波莉姨妈！
          emotion: surprised
        - id: ch01-b57
          speaker: huck
          text: 波莉姨妈就站在门里，模样又甜蜜又满足，活像吃了半肚子馅饼的天使。萨莉姨妈扑上去抱住她，险些把她的脑袋抱掉，又搂着她直哭。我一看屋里对我们越来越不妙，赶紧钻到床底下。我从那里偷眼往外看。没多久，波莉姨妈挣脱出来，隔着眼镜盯住汤姆。那目光简直能把他碾进地里。
        - id: ch01-b58
          speaker: aunt_polly
          text: 对，你最好把脸转开。我要是你，也会这样，汤姆。
        - id: ch01-b59
          speaker: aunt_sally
          text: 哎呀，他变得这么厉害吗？可那不是汤姆，是席德呀。汤姆呢？汤姆刚才还在这里，怎么不见了？
          emotion: surprised
        - id: ch01-b60
          speaker: aunt_polly
          text: 你想问的是哈克·费恩在哪儿！我把汤姆这个小坏蛋养了这么多年，要是见到他还认不出来，岂不成了天大的笑话？哈克·费恩，从床底下出来。
        - id: ch01-b61
          speaker: huck
          text: 我只好从床底爬出来，可一点儿也神气不起来。萨莉姨妈的模样迷糊透顶，却只能排第二。第一名还得算西拉斯姨父。他进屋以后，大家把整件事全告诉了他。他听得像喝醉了一样，一整天什么都弄不明白。那天晚上，他照样去祈祷会讲道，结果讲出了一篇谁也听不懂的东西，反倒替自己挣来好大的名声。哪怕世上年纪最大的人坐在那里，也休想弄明白他说的究竟是什么。
        - id: ch01-b62
          speaker: huck
          text: 波莉姨妈把我的身份从头解释了一遍。我也只能说明，菲尔普斯太太当初把我当成汤姆·索亚，我没有别的路，只好认下来。萨莉姨妈立刻插嘴，叫我还是喊她姨妈，反正她已经习惯，不必再改。我知道汤姆不会介意这场冒名，因为事情神神秘秘，正合他的胃口。他准会把它变成冒险。果然，他一到这里就装成席德，尽量帮我把局面应付过去。
        - id: ch01-b63
          speaker: huck
          text: 波莉姨妈还证实，老华生小姐确实在遗嘱里还了吉姆自由。原来汤姆费尽力气、惹出无数麻烦，不过是要释放一个本来就自由的人！听到这里，我才终于明白，照他从小受的教养，他为什么会肯帮别人放走一个黑奴。
        - id: ch01-b64
          speaker: huck
          text: 接着，波莉姨妈讲起自己为什么会来。萨莉姨妈写信告诉她，汤姆和席德已经平安到达。她看到这里，立刻想到，自己就这么放汤姆出门，身边连个看住他的人也没有，早该料到他会闹事。她后来写了两封信追问，却怎么也收不到回信，只好亲自沿河往下赶一千一百英里，看看这个小东西这回又在捣什么鬼。
        - id: ch01-b65
          speaker: aunt_sally
          text: 可我根本没收到过你的信呀。
        - id: ch01-b66
          speaker: aunt_polly
          text: 真怪了。我明明写过两封，问你说席德在这里是什么意思。
        - id: ch01-b67
          speaker: aunt_sally
          text: 我一封也没收到，姐姐。
        - id: ch01-b68
          speaker: huck
          text: 波莉姨妈慢慢转过身，神色严厉地叫了一声汤姆。
        - id: ch01-b69
          speaker: tom
          text: 干吗？
        - id: ch01-b70
          speaker: aunt_polly
          text: 少拿“干吗”来回我，你这个没规矩的东西。把那些信交出来。
        - id: ch01-b71
          speaker: tom
          text: 什么信？
        - id: ch01-b72
          speaker: aunt_polly
          text: 就是那些信。你等着，要是非得让我亲手抓住你，我就……
          emotion: angry
        - id: ch01-b73
          speaker: tom
          text: 在箱子里，行了吧。信从邮局拿来时什么样，现在还是什么样。我没拆，也没碰。可是我知道它们会惹麻烦，就想着您要是不着急，我可以……
        - id: ch01-b74
          speaker: aunt_polly
          text: 你真该剥一层皮，一点也没冤枉你。我还寄了第三封，告诉萨莉我要来。我猜那封也让你……
        - id: ch01-b75
          speaker: aunt_sally
          text: 不，那封昨天到了。我还没拆，不过没事，它好好在我这里。
        - id: ch01-b76
          speaker: huck
          text: 我真想拿两美元跟她打赌，那封信根本不在她手里。可我想了想，还是闭嘴最保险，所以一个字也没说。
