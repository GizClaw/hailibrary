audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    mary_jane:
      display_name: 玛丽·简·威尔克斯
      tts:
        delivery: 热诚坦荡，下定决心时坚定果断
        timbre: 年轻清亮
        pace: 舒缓自然
        pitch: 中高
    susan:
      display_name: 苏珊·威尔克斯
      tts:
        delivery: 温柔真挚，容易动情
        timbre: 年轻柔和
        pace: 舒缓
        pitch: 中
    joanna:
      display_name: 乔安娜·威尔克斯
      tts:
        delivery: 率真热切，反应明快
        timbre: 年少轻快
        pace: 稍快
        pitch: 高
    doctor_robinson:
      display_name: 鲁滨逊医生
      tts:
        delivery: 直率威严，发怒时毫不留情
        timbre: 坚硬洪亮
        pace: 有力
        pitch: 中低
    abner:
      display_name: 阿布纳·沙克尔福德
      tts:
        delivery: 朴直困惑，说话干脆
        timbre: 成年浑厚
        pace: 适中
        pitch: 中低
    townsman_1:
      display_name: 镇民甲
      tts:
        delivery: 好奇热心，乡音朴实
        timbre: 粗粝清楚
        pace: 明快
        pitch: 中
    townsman_2:
      display_name: 镇民乙
      tts:
        delivery: 热心笃定，说话爽快
        timbre: 明亮粗犷
        pace: 明快
        pitch: 中高
    townsman_3:
      display_name: 镇民丙
      tts:
        delivery: 朴直热烈，容易随众动情
        timbre: 厚实干爽
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 全镇迎接亲人
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 不到两分钟，消息就在镇上传遍了。人们从四面八方跑来，有的还边跑边穿外套。很快，我们四周全是人。脚步声隆隆的，听着像一队士兵正在行军。窗前和院门口也挤满了人，不时有人隔着篱笆喊。
        - id: ch01-b02
          speaker: townsman_1
          text: 来的是他们吗？
        - id: ch01-b03
          speaker: townsman_2
          text: 没错，就是他们！
        - id: ch01-b04
          speaker: huck
          text: 到那所房子时，门前的街已经堵得严严实实。三个姑娘站在门口。玛丽·简虽是一头红发，可这丝毫不碍事，她美得实在惊人。叔叔们终于来了，她高兴得整张脸都亮了起来，连眼睛里也像放着光。国王一张开双臂，她便扑进他怀里。乔安娜也扑向公爵。两边就这样抱成一团。围观的人看见一家人终于团聚，还亲热成这个样子，几乎全都喜极而泣，至少女人们全哭了。
        - id: ch01-b05
          speaker: huck
          text: 我看见国王暗中捅了公爵一下。他已经发现墙角的棺材架在两把椅子上。两个人搂着彼此的肩膀，腾出另一只手遮住眼睛，慢慢走了过去。众人退开让路，连声叫大家安静。男人们摘下帽子，低下头。四周顿时静得连针落地都能听见。
        - id: ch01-b06
          speaker: huck
          text: 两个骗子走到棺材跟前，弯腰朝里看了一眼，立刻大哭起来，那声音几乎能传到新奥尔良。他们搂住对方的脖子，把下巴搭在对方肩上，足足哭了三四分钟。我从没见过两个男人能淌那么多眼泪。你可别忘了，满屋的人也都照着他们的样子跟着哭。眼泪到处流，整个地方仿佛都湿透了。
        - id: ch01-b07
          speaker: huck
          text: 接着，两人分跪在棺材两边，把额头抵上去，装作各自在心里默默祷告。众人这下彻底撑不住了，姑娘们也放声抽泣。几乎每个女人都一个接一个走上前，不说一句话，只庄重地亲亲姑娘的额头，把手按在她头上，再含着泪仰望天空。眼泪顺着她们的脸往下流。随后，她们哭着退开，一边抽噎一边擦脸，再给下一个女人让地方。我从来没见过这么恶心的场面。
        - id: ch01-b08
          speaker: huck
          text: 过了一会儿，国王起身走到前面，硬把自己的情绪鼓动起来。他满脸眼泪，含混不清地说，他和可怜的弟弟失去亡兄，是一场沉痛的考验。两人赶了四千英里，还是没见到哥哥最后一面，这就更加悲痛。可乡亲们的同情和圣洁的泪水，又安慰并圣化了这场考验。人的话太软弱，也太冰冷，根本说不出这份感激。这一大堆黏糊糊的废话，听得我直犯恶心。
        - id: ch01-b09
          speaker: king
          text: 我和弟弟只能从心底感谢各位。阿门。
          emotion: sad
        - id: ch01-b10
          speaker: huck
          text: 说完这个假慈悲的“阿门”，他又放开嗓子痛哭，简直要把自己哭破了。他话音才落，人群里便有人领唱赞美诗，大家全都使足力气跟着唱。音乐真是好东西。听过刚才那些油腻话和胡说八道，再听见这歌声，整个屋子一下就清爽了。歌声诚恳又痛快，叫人浑身暖和，像礼拜终于散了场。
        - id: ch01-b11
          speaker: huck
          text: 国王又开口了。他说，自己和侄女们想请家里几位至交留下来吃晚餐，一起为亡人守灵。要是躺在那边的哥哥还能开口，他一定会请这些人，因为哥哥在信中常提到他们，也十分珍爱他们。
        - id: ch01-b12
          speaker: king
          text: 要请的是霍布森牧师、洛特·霍维执事、本·拉克先生、阿布纳·沙克尔福德、利维·贝尔、鲁滨逊医生和各位太太，还有巴特利寡妇。
        - id: ch01-b13
          speaker: huck
          text: 霍布森牧师和鲁滨逊医生正在镇子那头照料一个垂死的病人。换句话说，医生正送他去另一个世界，牧师则替他指路。贝尔律师远在路易维尔办事，其余的人都在场。他们上前同国王握手，向他道谢，又陪他说话。轮到公爵时，大家只同他握手，笑着点头，一句话也不讲，活像一群傻瓜。公爵则胡乱比画，嘴里像不会说话的婴儿一样咕咕个不停。
        - id: ch01-b14
          speaker: huck
          text: 国王说个不停，还把镇上差不多每个人和每条狗都点名问候了一遍。他讲起镇里、乔治一家，还有彼得从前经历的各种小事，每回都说是彼得写信告诉他的。那全是谎话。每一件事，都是他从那个坐我们独木舟去赶汽船的年轻傻瓜嘴里套来的。
    - id: ch02
      title: 地窖里的六千美元
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 玛丽·简拿来父亲留下的信，国王一边大声念，一边对着信流泪。信上说，住宅和三千美元黄金归三个姑娘。生意兴隆的制革场、另外几所房屋和一些土地，合计约值七千美元，连同三千美元黄金，都归哈维和威廉。信末还清清楚楚写明了另外六千美元现金藏在地窖的什么地方。
        - id: ch02-b02
          speaker: huck
          text: 两个骗子说要把钱取来，当众交代清楚。他们叫我拿上蜡烛，带我进了地窖，还关上身后的门。找到钱袋后，两人把金币全倒在地上。亮晃晃的金币铺了一地，真好看。国王的眼睛也亮得吓人。他狠狠拍了公爵一巴掌。
        - id: ch02-b03
          speaker: king
          text: 哎呀，比尔吉，这可一点儿也不痛快，对不对？简直比“王室奇人”还强！
          emotion: happy
        - id: ch02-b04
          speaker: huck
          text: 公爵也说确实如此。两个人不停用手扒拉金币，又把金币捧起来，让它们从指缝间一枚枚漏下去，清脆地叮叮当当落回地板上。
        - id: ch02-b05
          speaker: king
          text: 不用再争了，比尔吉。给死掉的有钱人当兄弟，替没赶到的外国继承人出面，这才是最适合咱俩的行当。你瞧，这就是信靠上天的好处。长远看，这法子最好。我什么门路都试过了，没有比它更好的。
        - id: ch02-b06
          speaker: huck
          text: 换作别人，看见这么大一堆钱，早就相信数目不会错了。可这两个人非要点一遍，结果发现少了四百一十五美元。
        - id: ch02-b07
          speaker: king
          text: 真该死。他把那四百一十五美元弄到哪儿去了？
        - id: ch02-b08
          speaker: huck
          text: 他们犯了一阵愁，又把四周翻了个遍。
        - id: ch02-b09
          speaker: duke
          text: 他病得那么重，多半是自己记错了。我看别再找了，也别声张。少这点钱，咱们还出得起。
        - id: ch02-b10
          speaker: king
          text: 出当然出得起，我才不在乎那点钱。我担心的是数目。咱们在这里得显得规规矩矩，什么都明明白白。钱要搬到楼上，当着大家的面数，这样才没人起疑。可死人明明写着六千美元。要是数出来少了，咱们总不能……
        - id: ch02-b11
          speaker: duke
          text: 等等。缺多少，咱们自己补上。
        - id: ch02-b12
          speaker: huck
          text: 公爵说着就从口袋里往外掏金币。
        - id: ch02-b13
          speaker: king
          text: 这主意妙极了，公爵！你这颗脑袋可真聪明。敢情老“王室奇人”又帮了咱们一把。
          emotion: happy
        - id: ch02-b14
          speaker: huck
          text: 国王也掏出金币，一枚枚摞起来。为了补齐差额，两人差点把口袋掏空，不过六千美元总算一分不少。
        - id: ch02-b15
          speaker: duke
          text: 我还有个主意。咱们把钱拿到楼上，当众数清楚，再把它全送给那几个姑娘。
        - id: ch02-b16
          speaker: king
          text: 天哪，公爵，快让我抱抱你！再没有比这更漂亮的主意了。你的脑袋真是了不起。这一招天下第一，绝不会错。谁要怀疑，就让他来好了。咱们一把钱送出去，准能把他们的疑心全打趴下。
          emotion: happy
        - id: ch02-b17
          speaker: huck
          text: 回到楼上，人人都围住桌子。国王当着大家的面点钱，每三百美元码成一摞，一共二十摞漂亮的小金堆。大伙眼巴巴地望着，馋得直舔嘴唇。两个骗子随后又把金币扫回袋里。我看见国王慢慢鼓起胸膛，知道他又要发表一番宏论了。
    - id: ch03
      title: 送出去的钱袋
      blocks:
        - id: ch03-b01
          speaker: king
          text: 各位朋友，我那可怜的哥哥躺在这里，对留在悲苦尘世的人一直十分慷慨。这几个可怜的小羊羔是他疼爱、庇护的孩子，如今父母都不在了，他对她们尤其慷慨。我们了解他，知道他本想留给她们更多，只因不愿伤害亲爱的威廉和我，才没有那么做。这还会有疑问吗？
        - id: ch03-b02
          speaker: king
          text: 既然这样，哪个兄弟会在这时候挡住他的心愿？哪个叔叔会忍心抢走这些可怜姑娘的钱？不错，那就是抢夺。要说我了解威廉，我想我确实了解。不过，我还是直接问问他吧。
        - id: ch03-b03
          speaker: huck
          text: 他转身对公爵比出一大串手势。公爵先呆头呆脑地看了一阵，随后像是忽然明白了。他扑向国王，欢喜得拼命咕咕乱叫，一连抱了国王约莫十五次才松手。
        - id: ch03-b04
          speaker: king
          text: 我早知道。现在人人都该明白威廉的心意了。玛丽·简、苏珊、乔安娜，拿去吧，把钱全拿去！这是那位躺在旁边、身子冰冷而心中欢喜的人送给你们的礼物。
        - id: ch03-b05
          speaker: huck
          text: 玛丽·简扑过去抱住国王，苏珊和乔安娜则扑向公爵。接下来那番搂抱亲吻，我再没见过第二回。人人含着眼泪挤过来，争着同两个骗子握手，几乎把他们的手都摇掉了。大家嘴里还不停夸他们善良，夸这件事感人。
        - id: ch03-b06
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 你们真是大好人！太感人了！你们怎么能这么好！
          emotion: happy
        - id: ch03-b07
          speaker: huck
          text: 没多久，大伙又谈起亡人，说他活着时多么善良，他的死带来多大的损失，人人都跟着感叹。这时，一个铁下巴似的大汉从门外挤进来。他只管站在那里听着、看着，一声也不响。也没人停下来招呼他，因为国王已经讲到半截，所有人都忙着听他说话。
        - id: ch03-b08
          speaker: king
          text: 这些人都是亡人的至交，所以今晚才请他们过来。可明天，我们希望大家全来，一个也别少。哥哥敬重每个人，也喜欢每个人，所以这场丧葬狂欢就该让公众参加。
        - id: ch03-b09
          speaker: huck
          text: 国王越说越来劲，听自己的声音听得很是陶醉，还不时来一句“丧葬狂欢”。公爵终于受不了了。他在小纸片上写下“是葬礼，你这个老傻瓜”，折好以后，一边咕咕叫，一边越过众人的头顶递给国王。
        - id: ch03-b10
          speaker: huck
          text: 国王看完纸片，把它塞进口袋，一点儿也没慌。
        - id: ch03-b11
          speaker: king
          text: 可怜的威廉虽有残疾，心却永远摆在正地方。他请我邀请所有人参加葬礼，还要我让大家都觉得受欢迎。他其实不用操心，我刚才说的正是这件事。
        - id: ch03-b12
          speaker: huck
          text: 他若无其事地接着说，照旧一遍又一遍提起“丧葬狂欢”。第三次说到这个词时，他索性解释起来。
        - id: ch03-b13
          speaker: king
          text: 我说“狂欢”，并不是因为大家通常这样叫。通常都说“葬礼”。可真正正确的词还是“狂欢”。如今英国早就不用“葬礼”这个旧词了，我们全说“狂欢”。这个词也更准确。它来自希腊语“奥戈”，意思是外面、露天、公开。再加上希伯来语“杰森”，意思是栽种、盖起来。两部分合到一起，就有了“埋葬”。所以，“丧葬狂欢”就是在露天举行，或者让公众参加的葬礼。
        - id: ch03-b14
          speaker: huck
          text: 他是我这辈子遇见的最糟糕的家伙。那个铁下巴的男人突然当面笑出声来，众人全惊呆了，纷纷叫他医生。
        - id: ch03-b15
          speaker: abner
          text: 鲁滨逊，你还没听说吗？这位就是哈维·威尔克斯。
          emotion: surprised
        - id: ch03-b16
          speaker: huck
          text: 国王连忙堆起笑脸，朝他伸出手。
        - id: ch03-b17
          speaker: king
          text: 您就是我可怜哥哥那位亲爱的朋友，也是给他看病的医生吗？我……
        - id: ch03-b18
          speaker: doctor_robinson
          text: 别用你的手碰我！你管这叫英国口音吗？我从没听过比这更糟的模仿。就凭你也敢说是彼得·威尔克斯的弟弟？你就是个骗子！
          emotion: angry
    - id: ch04
      title: 医生的警告
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 这一下，满屋的人都闹开了。他们围住医生，想让他消消气，又七嘴八舌地解释。哈维已经用四十种法子证明自己就是哈维。他知道每个人的名字，连镇上每条狗叫什么都清楚，这难道还不算证据吗？大家求了又求，只盼医生别伤害哈维的感情，也别伤了那几个可怜姑娘的心。可他们说什么都没有用。
        - id: ch04-b02
          speaker: huck
          text: 鲁滨逊医生继续大发雷霆。他说，一个人自称英国人，却连英国口音都装不像，那就一定是骗子，是撒谎精。三个姑娘紧紧偎着国王直哭。医生忽然转过身，冲着她们说。
        - id: ch04-b03
          speaker: doctor_robinson
          text: 我是你们父亲的朋友，也是你们的朋友。我以朋友的身份警告你们。作为一个诚实人，我只想保护你们，不让你们受伤，也不让你们惹上麻烦。离开那个恶棍，别再同他来往！他只是个无知的流浪汉，满嘴所谓的希腊语、希伯来语，全是蠢话。
          emotion: angry
        - id: ch04-b04
          speaker: doctor_robinson
          text: 他是最拙劣的冒牌货。不知从哪儿捡来一串名字和事情，就跑来骗你们。你们却把那些东西当成证据。这里的糊涂朋友本该明白事理，现在反倒帮着你们骗自己。
          emotion: angry
        - id: ch04-b05
          speaker: doctor_robinson
          text: 玛丽·简·威尔克斯，你知道我是你的朋友，也知道我帮你从不图回报。现在听我的，把这个可怜的无赖赶出去。我求你这样做。你肯吗？
        - id: ch04-b06
          speaker: huck
          text: 玛丽·简挺直了身子。哎呀，她那时真是好看极了。
        - id: ch04-b07
          speaker: mary_jane
          text: 这就是我的回答。这六千美元全交给你。你愿意怎么替我和妹妹们投资都行，也不用给我们任何收据。
        - id: ch04-b08
          speaker: huck
          text: 她提起钱袋，放进国王手里，然后从一边搂住他。苏珊和乔安娜也从另一边抱住国王。人人一起鼓掌跺脚，声势像一场暴风雨。国王高高昂着头，笑得十分得意。
        - id: ch04-b09
          speaker: doctor_robinson
          text: 好吧，这件事我不再插手。不过我警告你们所有人，总有一天，你们只要想起今天，就会恶心得难受。
        - id: ch04-b10
          speaker: huck
          text: 医生说完便走了。
        - id: ch04-b11
          speaker: king
          text: 行啊，医生。到时候我们一定想法子叫人去请你来。
        - id: ch04-b12
          speaker: huck
          text: 国王那口气满是嘲弄。大伙听完都笑了，还说这句话回得真妙。
