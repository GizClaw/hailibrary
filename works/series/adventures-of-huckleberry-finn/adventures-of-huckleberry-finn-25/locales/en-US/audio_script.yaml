  chapters:
    - id: ch01
      title: CHAPTER XXV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: In two minutes, the news had raced all over town. People came running from every direction, some still pulling on their coats. Soon we were surrounded, and all those pounding feet sounded like soldiers marching. Faces filled the windows and yards. Every little while, somebody called over a fence.
        - id: ch01-b02
          speaker: townsman_1
          text: Is that them?
        - id: ch01-b03
          speaker: townsman_2
          text: You bet it is!
        - id: ch01-b04
          speaker: huck
          text: By the time we reached the house, the whole street in front was packed. The three girls stood waiting in the doorway. Mary Jane had red hair, but that did not matter a bit. She was about as beautiful as anybody could be, and her face and eyes seemed to shine because she was so glad her uncles had finally come. The king spread his arms wide, and Mary Jane flew into them. Joanna rushed to the duke at the same time. There they all held on to one another. Nearly everybody watching, or at least nearly every woman, cried for joy at seeing the family together at last.
        - id: ch01-b05
          speaker: huck
          text: Then I saw the king give the duke a private nudge. He had noticed the coffin resting on two chairs in the corner. They put an arm across each other's shoulders, covered their eyes with their free hands, and walked toward it slow and solemn. The crowd moved aside. People whispered for quiet, and the men took off their hats and bowed their heads. The room grew so still you could have heard a pin fall.
        - id: ch01-b06
          speaker: huck
          text: The two frauds bent over the coffin and took one look inside. Then they burst out crying loud enough to be heard almost to New Orleans. They threw their arms around each other's necks and rested their chins across each other's shoulders. For three minutes, maybe four, I had never seen two men pour out tears the way they did. Before long, nearly everyone in the room was crying with them. The whole place seemed damp with it.
        - id: ch01-b07
          speaker: huck
          text: Next they took opposite sides of the coffin. They knelt, rested their foreheads against it, and pretended to pray silently. That broke the crowd down completely. Everybody began sobbing aloud, including the poor girls. Nearly every woman went to them without saying a word. Each woman kissed them solemnly on the forehead, placed a hand on a girl's head, and looked toward heaven while the tears ran down. Then she went away sobbing and wiping her face so the next woman could take her turn. I had never seen anything so disgusting.
        - id: ch01-b08
          speaker: huck
          text: After a while, the king stood, stepped forward, and worked himself up for a speech. Through tears and slobber, he called it a bitter trial for him and his poor brother. They had traveled four thousand miles only to arrive too late to see the deceased alive. But he said the town's loving sympathy and holy tears had sweetened that trial and made it sacred. He thanked everyone from the bottom of his own heart and from his brother's heart too. Neither of them could properly speak their thanks, he said, because words were too weak and cold for such a moment. It was all such rotten nonsense that it made me sick.
        - id: ch01-b09
          speaker: king
          text: Amen.
          emotion: sad
        - id: ch01-b10
          speaker: huck
          text: Then he let himself go and cried as if he might burst. The moment the last word left his mouth, someone in the crowd began singing the doxology. Everybody else joined in with all their strength. Music is a good thing. After all that greasy talk and foolishness, I had never heard anything freshen up a room so quickly. The singing sounded honest and fine, and it warmed you through like church letting out.
        - id: ch01-b11
          speaker: huck
          text: The king started talking again. He said he and his nieces hoped the family's closest friends would eat supper there that evening and sit up beside the deceased. If poor Peter could speak, the king said, he knew whom Peter would choose, because those names had often appeared in his letters.
        - id: ch01-b12
          speaker: king
          text: Reverend Hobson, Deacon Lot Hovey, Mr. Ben Rucker, Abner Shackleford, Levi Bell, Doctor Robinson, all their wives, and Widow Bartley.
        - id: ch01-b13
          speaker: huck
          text: Reverend Hobson and Doctor Robinson were together at the far end of town, attending a dying man. The doctor was helping him out of this world, and the preacher was pointing him in the right direction. Lawyer Bell was away in Louisville on business. The rest of the invited people were there. Each one shook the king's hand, thanked him, and talked with him. Then they shook hands with the duke. Since they believed he could neither hear nor speak, they said nothing. They only kept smiling and bobbing their heads like a pack of fools while he waved his hands and babbled like a baby.
        - id: ch01-b14
          speaker: huck
          text: The king kept chattering and found a way to ask after nearly every person and dog in town by name. He mentioned one little thing after another that had happened in the town, or to George's family, or to Peter himself. Every time, he pretended Peter had told him about it in a letter. That was a lie from beginning to end. He had learned every single detail from the young fool who paddled us out to the steamboat.
        - id: ch01-b15
          speaker: huck
          text: Then Mary Jane brought out the letter her father had left behind. The king read it aloud and cried as he went. The letter gave the dwelling house and three thousand dollars in gold to the girls. It gave the tanyard, which was doing good business, along with other houses and land worth about seven thousand dollars, to Harvey and William. They also received three thousand dollars in gold. At the end, the letter told them exactly where the whole six thousand dollars in cash was hidden down in the cellar.
        - id: ch01-b16
          speaker: huck
          text: The two frauds said they would fetch the money so everything would be open and honest. They took me along with a candle and shut the cellar door behind us. When they found the bag, they poured the coins across the floor. Those yellow gold pieces were a beautiful sight, and the king's eyes shone.
        - id: ch01-b17
          speaker: king
          text: Well, Bilge, this isn't fine at all, is it? Why, it beats the Nonesuch!
          emotion: happy
        - id: ch01-b18
          speaker: huck
          text: The duke agreed. They ran their hands through the coins and let the gold jingle between their fingers onto the floor.
        - id: ch01-b19
          speaker: king
          text: There's no use arguing about it, Bilge. The finest business for you and me is being brothers to a rich dead man and standing in for foreign heirs who have been left behind. This is what comes from trusting Providence. In the long run, that is the best way. I have tried every kind of scheme there is, and none works better.
        - id: ch01-b20
          speaker: huck
          text: Most people would have trusted a pile like that, but these two had to count it. The money came up four hundred and fifteen dollars short.
        - id: ch01-b21
          speaker: king
          text: Confound him. What did he do with that other four hundred and fifteen dollars?
        - id: ch01-b22
          speaker: huck
          text: They worried and searched all around the cellar.
        - id: ch01-b23
          speaker: duke
          text: He was very sick. He probably counted wrong. We had better forget the shortage and say nothing. We can afford it.
        - id: ch01-b24
          speaker: king
          text: Of course we can afford it. I don't care about losing that money. The count is what worries me. We need to look perfectly square, open, and honest here. We ought to carry this money upstairs and count it where everyone can watch us. Then nobody will have a reason to suspect anything. But the dead man says there are six thousand dollars. We cannot show the crowd a smaller amount and expect them not to wonder.
        - id: ch01-b25
          speaker: duke
          text: Wait. We'll cover the shortage ourselves.
        - id: ch01-b26
          speaker: huck
          text: The duke began pulling gold coins from his pocket.
        - id: ch01-b27
          speaker: king
          text: That's a wonderful idea, Duke. You have a mighty clever head. The old Nonesuch is helping us again.
        - id: ch01-b28
          speaker: huck
          text: The king added his own gold to the stacks. Replacing the missing money nearly cleaned them out, but at last they had the full six thousand dollars.
        - id: ch01-b29
          speaker: duke
          text: I've got one more idea. Let's count the money upstairs, then give every dollar of it to the girls.
        - id: ch01-b30
          speaker: king
          text: Good land, Duke, let me hug you! That is the most dazzling idea any man ever had. You have the most astonishing head I have ever seen. This is the best trick yet, and there is no mistake about it. Once we do this, folks can bring along every suspicion they have. Giving the money away will knock every one of them flat.
          emotion: happy
        - id: ch01-b31
          speaker: huck
          text: When we came back upstairs, everyone gathered close around the table. The king counted out the gold in front of them and arranged it in twenty handsome little stacks, three hundred dollars to a stack. Everybody looked hungry at the sight of it and seemed ready to lick their lips. Then the king swept every coin back into the bag. I watched him begin to swell himself up for another grand speech.
        - id: ch01-b32
          speaker: king
          text: Friends, my poor brother lying there was generous to those he left behind in this world of sorrow. He was generous to these sweet young girls he loved and sheltered, who now have neither father nor mother. Those of us who knew him understand that he would have done even more for them if he had not feared hurting his dear brothers, William and me. There can be no question of that. So what kind of brothers would we be if we stood in his way now? What kind of uncles would rob these poor girls at such a time? I believe I understand William. Still, I will simply ask him.
        - id: ch01-b33
          speaker: huck
          text: He turned and made signs to the duke. The duke stared back stupidly for a while. Then he finally understood, sprang at the king, babbled for joy, and hugged him again and again.
        - id: ch01-b34
          speaker: king
          text: I knew it. That ought to convince anybody how William feels about the matter. Here, Mary Jane, Susan, and Joanna. Take this money. Take every dollar of it. It is the gift of the man who lies over there, cold now, but joyful to see you receive it.
        - id: ch01-b35
          speaker: huck
          text: Mary Jane threw her arms around the king. Susan and Joanna rushed to the duke. I had never seen so much hugging and kissing. The crowd pressed in with tears in their eyes and nearly shook the frauds' hands off.
        - id: ch01-b36
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: You dear, good souls! How wonderful! How could you be so kind?
          emotion: happy
        - id: ch01-b37
          speaker: huck
          text: Before long, everybody was talking again about how good the deceased had been, what a terrible loss his death was, and all the usual things people say. Then a big man with an iron-hard jaw worked his way in from outside. He stood there watching and listening without saying a word. Nobody stopped to speak to him either. The king had begun talking once more, and the whole room was busy listening.
        - id: ch01-b38
          speaker: king
          text: These people were particular friends of the deceased, and that is why we invited them here this evening. Tomorrow, however, we want all of you to come. We want everybody. Peter respected everybody in this town, and he liked everybody. It is only fitting, then, that his funeral orgies should be open to the public.
        - id: ch01-b39
          speaker: huck
          text: The king wandered on and on, enjoying the sound of his own voice. Every little while, he brought up the funeral orgies again. At last the duke could not bear hearing it anymore. He took a little scrap of paper and wrote, “Obsequies, you old fool.” Then he folded the note and reached it over people's heads toward the king, making his foolish sounds all the while.
        - id: ch01-b40
          speaker: huck
          text: The king read the note and slipped it into his pocket.
        - id: ch01-b41
          speaker: king
          text: Poor William may be afflicted, but his heart is always in the right place. He asks me to invite everybody to the funeral and make every person welcome. He need not have worried himself about that. It was exactly what I was already doing.
        - id: ch01-b42
          speaker: huck
          text: Without losing his calm, the king went right on and used “funeral orgies” twice more. The third time, he explained himself.
        - id: ch01-b43
          speaker: king
          text: I say “orgies,” not because it is the common word. It is not. “Obsequies” is the term most people use. But in England, obsequies has gone out of fashion, and we say orgies now. Orgies is better because it tells you more exactly what you mean. The word comes from the Greek “orgo,” which means outside, open, or abroad. Then there is the Hebrew “jeesum,” meaning to plant or cover up. From that comes “inter.” So you see, funeral orgies means an open or public funeral.
        - id: ch01-b44
          speaker: huck
          text: He was the worst fraud I had ever met. The iron-jawed man laughed right in his face, and everyone gasped at the doctor.
        - id: ch01-b45
          speaker: abner
          text: Why, Robinson, haven't you heard? This man is Harvey Wilks.
          emotion: surprised
        - id: ch01-b46
          speaker: huck
          text: The king smiled eagerly and reached out his hand.
        - id: ch01-b47
          speaker: king
          text: Are you my poor brother's dear friend and physician?
        - id: ch01-b48
          speaker: doctor_robinson
          text: Keep your hands off me! You call that an English accent? It is the worst imitation I ever heard. You, Peter Wilks's brother? You are a fraud!
          emotion: angry
        - id: ch01-b49
          speaker: huck
          text: What a fuss the crowd made then. They pressed around the doctor and tried to calm him. They explained that Harvey had shown in forty different ways that he truly was Harvey. He knew everybody by name, they said, and even knew the names of the dogs. Again and again, they begged the doctor not to hurt Harvey's feelings or the feelings of the poor girls. None of it helped. Doctor Robinson stormed right on. He said that any man who claimed to be English but could not manage a better English accent was plainly a fraud and a liar. The poor girls clung to the king and cried. All at once, the doctor turned toward them.
        - id: ch01-b50
          speaker: doctor_robinson
          text: I was your father's friend, and I am your friend too. I am warning you as an honest friend who wants to protect you from harm and trouble. Turn your backs on that scoundrel and have nothing more to do with him. He is an ignorant tramp, with his idiotic talk about Greek and Hebrew. He is the thinnest kind of impostor. He came here carrying a collection of names and facts that he picked up somewhere, and you have mistaken them for proof. These foolish friends around you are helping you deceive yourselves when they ought to know better.
          emotion: angry
        - id: ch01-b51
          speaker: doctor_robinson
          text: Mary Jane Wilks, you know me. You know I have always been your friend, and an unselfish friend at that. Please listen to me now. Turn this pitiful rascal out of your house. I beg you to do it. Will you?
        - id: ch01-b52
          speaker: huck
          text: Mary Jane drew herself up straight, and she looked wonderfully handsome.
        - id: ch01-b53
          speaker: mary_jane
          text: Here is my answer. Take this whole six thousand dollars. Invest it for me and my sisters in any way you think best, and do not give us any receipt for it.
        - id: ch01-b54
          speaker: huck
          text: Mary Jane lifted the heavy bag of money and placed it in the king's hands. Then she slipped an arm around him from one side. Susan and Joanna did the same from the other. Everybody in the room began clapping and stamping on the floor. Together, they made a noise like a perfect storm. Through it all, the king held his head high and smiled with pride.
        - id: ch01-b55
          speaker: doctor_robinson
          text: Very well. I wash my hands of the whole matter. But I warn every one of you, a time is coming when you will feel sick whenever you remember what happened here today.
        - id: ch01-b56
          speaker: huck
          text: The doctor walked away.
        - id: ch01-b57
          speaker: king
          text: All right, Doctor. When that day comes, we will try to have them send for you.
        - id: ch01-b58
          speaker: huck
          text: He said it in a mocking way. Everyone laughed and called it a first-rate answer.
