  chapters:
    - id: ch01
      title: CHAPTER XIX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Two or three days and nights went by. You might say they swam by, they slipped along so quiet and smooth and lovely. The river was enormous down there, sometimes a mile and a half wide. We traveled at night and hid during the day. When night was nearly over, we tied up in the dead water below a towhead. We cut young cottonwoods and willows and covered the raft with them, then set out our fishing lines.
        - id: ch01-b02
          speaker: huck
          text: After that, we slipped into the river to swim and cool off. We sat on the sandy bottom where the water came to our knees and watched daylight arrive. There was not a sound anywhere. The whole world seemed asleep, except maybe for bullfrogs clattering now and then.
        - id: ch01-b03
          speaker: huck
          text: First, a dim line showed across the water. That was the woods on the far bank, though you could not make out anything else. Then one patch of sky turned pale, and the paleness spread. Far away, the black river softened to gray. Little dark spots came drifting into sight, trading scows and such, with long black rafts among them. Sometimes an oar squeaked or mixed-up voices carried across the water. It was so still that sound traveled a mighty long way.
        - id: ch01-b04
          speaker: huck
          text: Soon you could spot a streak on the river where fast water broke around a snag. Mist curled off the surface. The east and the river turned red. Across the way, a log cabin appeared at the edge of the woods, likely a woodyard. Its logs were stacked so poorly you could throw a dog through any part of the pile.
        - id: ch01-b05
          speaker: huck
          text: Then a fine breeze came over from that shore, cool and fresh and sweet with the smell of woods and flowers. It was not always sweet, though. Sometimes dead gar and other fish had been left lying around, and they smelled pretty rank. Then full daylight came. Everything smiled in the sun, and the songbirds let loose.
        - id: ch01-b06
          speaker: huck
          text: By then, a little smoke would not be noticed. We took fish off the lines and cooked a hot breakfast. Afterward, we watched the lonely river and lazed around until we fell asleep. Something might wake us later, maybe a steamboat coughing upstream so far over that all we could tell was whether she had a stern wheel or side wheels. Then another hour could pass with nothing to see or hear. It was solid lonesomeness.
        - id: ch01-b07
          speaker: huck
          text: At last, a raft might slide by in the distance with a fellow chopping on it. You saw his axe flash and fall, but heard nothing. He raised it again, and only when it reached over his head did the k-chunk come across the water. That was how long the sound took to reach us. We spent our days that way, lying around and listening to the stillness.
        - id: ch01-b08
          speaker: huck
          text: Once, thick fog covered the river. Rafts and other boats beat tin pans so steamboats would not run them down. A scow or raft passed so close that we heard people talking, cursing, and laughing as plain as could be, but we could not see a sign of them. It made your skin crawl. They sounded like spirits carrying on in the air. Jim reckoned they really were spirits.
        - id: ch01-b09
          speaker: huck
          text: No, they can't be spirits. Spirits wouldn't say, “Darn this darn fog.”
        - id: ch01-b10
          speaker: huck
          text: As soon as darkness came, we pushed off. Out near the middle, we let the raft go wherever the current wanted. We lit our pipes, hung our legs in the water, and talked about everything. We went without clothes day and night whenever the mosquitoes allowed it. The new clothes Buck's family had made me were too good to be comfortable, and I never cared much for clothes anyway.
        - id: ch01-b11
          speaker: huck
          text: Sometimes the whole river belonged to us for a long while. The banks and islands lay across the water. One spark might shine from a candle in a cabin window. Another one or two might glow on a raft or scow, and a fiddle or a song might drift over from one of those boats. It is lovely to live on a raft.
        - id: ch01-b12
          speaker: huck
          text: The sky above us was speckled all over with stars. We lay on our backs and argued over whether somebody made them or they just happened. Jim said they were made. I said they happened, because making so many would take too long.
        - id: ch01-b13
          speaker: jim
          text: Maybe the moon laid all those stars.
        - id: ch01-b14
          speaker: huck
          text: That sounded reasonable enough. I had seen a frog lay nearly as many, so of course it could be done. We watched the falling stars streak down too. Jim figured they had spoiled and been thrown out of the nest.
        - id: ch01-b15
          speaker: huck
          text: Once or twice each night, a steamboat slipped through the dark. Now and then, her chimneys belched a whole world of sparks. They rained into the river and looked mighty pretty. Then she rounded a bend. Her lights winked out, her noise died away, and the river went still again. Long after she was gone, her waves reached us and rocked the raft a little. After that, nothing sounded for who knew how long, except maybe a frog.
        - id: ch01-b16
          speaker: huck
          text: After midnight, the people ashore went to bed, and the banks stayed black for two or three hours. The sparks in the cabin windows were our clock. When the first one came back, morning was on its way, and we found a hiding place and tied up at once.
        - id: ch01-b17
          speaker: huck
          text: One morning around daybreak, I found a canoe and crossed a two-hundred-yard chute to the main shore. I paddled about a mile up a creek through the cypress woods, looking for berries. Where a cowpath crossed the creek, two men came tearing down the path as fast as they could run. I thought I was done for. Whenever anybody chased anybody, I always figured they were after me, or maybe Jim.
        - id: ch01-b18
          speaker: huck
          text: I was ready to get away, but the men were already close. They called out and begged me to save their lives. They claimed they had done nothing, but men and dogs were chasing them. They wanted to jump straight into the canoe.
        - id: ch01-b19
          speaker: huck
          text: Don't jump in here. I can't hear the dogs or horses yet, so you've got time. Push through the brush and go farther up the creek. Then get in the water, wade back down to me, and climb aboard. That will make the dogs lose your scent.
        - id: ch01-b20
          speaker: huck
          text: They did it. The moment they were aboard, I headed for our towhead. Five or ten minutes later, we heard dogs and men shouting far behind us. The sound came toward the creek and seemed to stop there while they searched around. All the time, we moved farther away. Soon we could hardly hear them. After we had put a mile of woods behind us and reached the river, everything was quiet. We paddled to the towhead, hid among the cottonwoods, and were safe.
        - id: ch01-b21
          speaker: huck
          text: One man looked seventy or older. He was bald, with very gray whiskers. He wore a battered slouch hat, a greasy blue wool shirt, and ragged blue jeans tucked into his boots. He had one homespun suspender and carried a long blue jean coat with shiny brass buttons over his arm. The other man was about thirty and dressed just as poorly. Both carried big, fat, shabby carpetbags.
        - id: ch01-b22
          speaker: huck
          text: After breakfast, we all lay around and talked. The first thing we learned was that the two men did not even know each other.
        - id: ch01-b23
          speaker: king
          text: What sort of trouble got you running?
        - id: ch01-b24
          speaker: duke
          text: I was selling a remedy that takes tartar off your teeth. It does work, too, though it generally takes the enamel along with it. I stayed one night longer than I should have. I was slipping out when I met you on the trail outside town. You said people were coming and begged me to help you escape. I told you I expected trouble myself, so we ran off together. That's my whole story. What's yours?
        - id: ch01-b25
          speaker: king
          text: I'd been running a little temperance revival for about a week. All the women, young and old, thought the world of me. I preached hard against drinkers and took in five or six dollars a night. Admission was ten cents, though children and Black folks got in free, and business kept growing. Then last night, a rumor got around that I spent my spare time with a private jug. A Black man woke me this morning and said the townspeople were quietly gathering their dogs and horses. They meant to give me half an hour's start, hunt me down, tar and feather me, and ride me on a rail. I skipped breakfast. I wasn't hungry.
        - id: ch01-b26
          speaker: duke
          text: Old man, maybe you and I ought to work together. What do you say?
        - id: ch01-b27
          speaker: king
          text: I might be willing. What's your main line of business?
        - id: ch01-b28
          speaker: duke
          text: I'm a printer by trade. I sell patent medicines sometimes. I act in the theater, mostly tragedies. When I get the chance, I do mesmerism and read the shape of people's heads. I can teach singing and geography, or give a lecture. I do all sorts of things, whatever comes along, as long as it isn't work. What do you do?
        - id: ch01-b29
          speaker: king
          text: I've done a fair amount of doctoring. Laying on hands is my best business, especially for cancer, paralysis, and things like that. I can tell fortunes pretty well if somebody helps me learn the facts first. I preach, too. I work camp meetings and go around as a missionary.
        - id: ch01-b30
          speaker: huck
          text: Nobody spoke for a while. Then the young man let out a heavy sigh.
        - id: ch01-b31
          speaker: duke
          text: Alas!
        - id: ch01-b32
          speaker: king
          text: What are you saying “alas” about?
        - id: ch01-b33
          speaker: duke
          text: To think I've lived long enough to lead this kind of life and sink into such company.
        - id: ch01-b34
          speaker: huck
          text: He wiped at the corner of his eye with a rag. The bald man turned sharp and offended.
        - id: ch01-b35
          speaker: king
          text: Curse you! Isn't our company good enough?
          emotion: angry
        - id: ch01-b36
          speaker: duke
          text: Yes, it is. It's as good as I deserve. Who brought me down from where I once stood? I did. I don't blame either of you gentlemen. I blame nobody. I deserve every bit of this. Let the cold world do its worst. I know there's a grave waiting for me somewhere. The world can keep going as it always has and take my loved ones, my property, everything. But it can't take that grave. One day I'll lie down there, forget it all, and let my broken heart rest.
          emotion: sad
        - id: ch01-b37
          speaker: huck
          text: He kept wiping his eyes.
        - id: ch01-b38
          speaker: king
          text: Confound your poor broken heart! Why are you moaning about it to us? We never did anything to you.
        - id: ch01-b39
          speaker: duke
          text: No, I know you didn't. I'm not blaming you, gentlemen. I brought myself this low. Yes, I did it myself. It's only right that I suffer, and you won't hear me complain.
        - id: ch01-b40
          speaker: king
          text: Brought down from where? Where did you fall from?
        - id: ch01-b41
          speaker: duke
          text: Ah, you'd never believe me. The world never believes. Let it go. It doesn't matter. The secret of my birth...
        - id: ch01-b42
          speaker: king
          text: The secret of your birth? Are you saying that—
        - id: ch01-b43
          speaker: huck
          text: The young man turned very solemn.
        - id: ch01-b44
          speaker: duke
          text: Gentlemen, I trust you, so I'll tell you the truth. By rights, I am a duke.
        - id: ch01-b45
          speaker: huck
          text: Jim's eyes nearly popped out, and I reckon mine did too. The bald man stared at him.
        - id: ch01-b46
          speaker: king
          text: No! You can't mean that.
          emotion: surprised
        - id: ch01-b47
          speaker: duke
          text: I do. My great-grandfather was the oldest son of the Duke of Bridgewater. Near the end of the last century, he fled to this country for the pure air of freedom. He married here and had a son, then both he and his own father died around the same time. The late duke's second son grabbed the title and estates, while the true duke was only a baby and got pushed aside. I come straight from that child. I am the rightful Duke of Bridgewater. And look at me now. I've been torn from my high position, hunted and despised, left ragged, worn, and heartbroken, with nothing but criminals for company on a raft.
          emotion: sad
        - id: ch01-b48
          speaker: huck
          text: Jim and I felt mighty sorry for him. We tried to comfort him, but he said comfort would not do much. What would help was for us to recognize his proper rank. We agreed, if he would tell us how.
        - id: ch01-b49
          speaker: duke
          text: Bow when you speak to me. Call me “Your Grace,” “My Lord,” or “Your Lordship.” You may simply call me “Bridgewater” too. That's a title, not a name. At dinner, one of you should serve me and take care of any little thing I need.
        - id: ch01-b50
          speaker: huck
          text: That was easy, so we did it. All through dinner, Jim stood by and waited on him.
        - id: ch01-b51
          speaker: jim
          text: Would Your Grace like some of this? Or maybe some of that?
        - id: ch01-b52
          speaker: huck
          text: Anybody could see how much the duke enjoyed it. After a while, though, the old man went quiet. He did not look comfortable with all that attention going to the duke. Something was working in his mind. That afternoon, he spoke up.
        - id: ch01-b53
          speaker: king
          text: Listen here, Bilgewater. I'm terribly sorry for you, but you aren't the only person who's suffered that kind of trouble.
        - id: ch01-b54
          speaker: duke
          text: No?
        - id: ch01-b55
          speaker: king
          text: No, you aren't. Other people have been wrongly dragged down from high positions too.
        - id: ch01-b56
          speaker: duke
          text: Alas!
        - id: ch01-b57
          speaker: king
          text: And you aren't the only man with a secret about his birth.
        - id: ch01-b58
          speaker: huck
          text: Then the old man began to cry.
        - id: ch01-b59
          speaker: duke
          text: Wait! What do you mean?
          emotion: surprised
        - id: ch01-b60
          speaker: king
          text: Bilgewater, can I trust you?
          emotion: sad
        - id: ch01-b61
          speaker: duke
          text: To the bitter death! Tell me the secret of who you are.
        - id: ch01-b62
          speaker: huck
          text: He took the old man's hand and squeezed it.
        - id: ch01-b63
          speaker: king
          text: Bilgewater, I am the late Dauphin!
        - id: ch01-b64
          speaker: huck
          text: Jim and I really stared then.
        - id: ch01-b65
          speaker: duke
          text: You're what?
          emotion: surprised
        - id: ch01-b66
          speaker: king
          text: It's sadly true, my friend. You are looking at the poor lost Dauphin, Louis the Seventeenth, son of Louis the Sixteenth and Marie Antoinette.
          emotion: sad
        - id: ch01-b67
          speaker: duke
          text: You? At your age? No! You must mean you're the late Charlemagne. You'd have to be six or seven hundred years old, at least.
        - id: ch01-b68
          speaker: king
          text: Trouble did it, Bilgewater. Trouble gave me these gray hairs and made me bald before my time. Yes, gentlemen, here I stand in blue jeans and misery. I am the wandering, exiled, beaten-down, suffering rightful King of France.
          emotion: sad
        - id: ch01-b69
          speaker: huck
          text: He cried and carried on until Jim and I hardly knew what to do. We felt so sorry for him, and so glad and proud to have him with us. We tried to comfort him just as we had comforted the duke. He said only death could truly end his suffering. Still, he might feel better for a while if people treated him according to his rights.
        - id: ch01-b70
          speaker: king
          text: Kneel on one knee when you speak to me, and always call me “Your Majesty.” Serve me first at meals. And don't sit down in my presence until I give you leave.
        - id: ch01-b71
          speaker: huck
          text: Jim and I began calling him “Your Majesty.” We waited on him, did whatever he asked, and stood until he told us we could sit. It helped him greatly. Soon he was cheerful and comfortable. The duke, though, turned sour. He did not like how things were going.
        - id: ch01-b72
          speaker: huck
          text: The king stayed friendly. He said his father had thought highly of the duke's great-grandfather and all the other Dukes of Bilgewater, and often allowed them into the palace. The duke remained huffy for quite a while. At last, the king addressed him.
        - id: ch01-b73
          speaker: king
          text: Chances are we'll be together on this raft for a blamed long time, Bilgewater. What's the use of staying sour? It only makes everyone uncomfortable. It isn't my fault I wasn't born a duke, and it isn't your fault you weren't born a king. So why worry? My rule is to make the best of things as you find them. What we've found here isn't bad. There's plenty to eat and the living is easy. Come on, Duke. Give me your hand, and let's all be friends.
        - id: ch01-b74
          speaker: huck
          text: The duke shook his hand, and Jim and I were mighty glad. All the discomfort went away. Trouble between people would have made life on the raft miserable. More than anything, you want everyone on a raft to be satisfied and kindly toward the others.
        - id: ch01-b75
          speaker: huck
          text: It did not take me long to decide those two liars were no king or duke. They were low-down frauds. But I kept that to myself and never let on. That is the best way to avoid quarrels and trouble. If calling them king and duke kept peace in the family, I had no objection. There was no use telling Jim either, so I did not. If Pap taught me anything, it was that the easiest way to live with people like these is to let them have their own way.
