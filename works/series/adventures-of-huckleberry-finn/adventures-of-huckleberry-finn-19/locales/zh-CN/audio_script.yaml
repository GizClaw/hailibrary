audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    jim:
      display_name: 吉姆
      tts:
        delivery: 热诚质朴，对哈克满是关切
        timbre: 浑厚温暖
        pace: 舒展自然
        pitch: 低
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
  chapters:
    - id: ch01
      title: 河上的日子
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 两三天两三夜就那么漂过去了。日子安静、平顺，又美得很，说它们是游过去、滑过去的都成。那一带的河宽得吓人，有时足有一英里半。我们夜里赶路，白天停下来躲着。天色快亮时，就不再航行，把木筏系在沙洲下方不流动的水里。接着砍来嫩棉白杨和柳枝，四面遮好，叫岸上的人看不见。
        - id: ch01-b02
          speaker: huck
          text: 下好钓线以后，我们跳进河里游一阵，洗去热气。随后坐到齐膝深的浅水里，脚下踩着沙，等天亮。四周静得像整个世界都睡着了，只偶尔听见牛蛙咕噜几声。
        - id: ch01-b03
          speaker: huck
          text: 朝水面望去，最先看清的是对岸树林那条模糊的暗线，别的什么也辨不出来。接着天边有一小块泛白，白色慢慢向四周铺开，远处的河也柔和下来，从黑色变成灰色。载货的平底船像漂着的小黑点，木筏像长长的黑道。有时长桨吱呀一声，有时几个人混在一起的说话声从远处传来。天地太静了，声音能走得很远。
        - id: ch01-b04
          speaker: huck
          text: 再过一会儿，水面上出现一道特别的纹路。只看它的样子，你就知道急流下面横着沉木，河水撞上去才留下那道印子。雾从河上卷起来，东方红了，河水也跟着红了。对岸远处的林边渐渐露出一间圆木屋，多半是个柴场。那些骗子把木柴堆得那么松，随便哪儿都能扔过一条狗。
        - id: ch01-b05
          speaker: huck
          text: 清风从对岸吹来，带着树林和花的气味，又凉又甜。要是岸上扔着雀鳝一类死鱼，那就不甜了，臭得厉害。再过一会儿，太阳照亮一切，万物都像在笑，鸟儿也放开嗓子唱起来。
        - id: ch01-b06
          speaker: huck
          text: 到这时，一点炊烟已经没人留意。我们从钓线上取下几条鱼，烧一顿热腾腾的早饭。吃完就望着河上的寂寞发懒，什么也不急着做，慢慢睡过去。过一阵醒来，还要先看看是什么惊动了自己。也许会瞧见一艘蒸汽船在对岸远处咳嗽着逆流而上。它离得太远，船上的情形一点也看不清，只够分辨它是艉轮船还是舷轮船。
        - id: ch01-b07
          speaker: huck
          text: 船过去后，差不多一个钟头里什么也看不见，什么也听不着，只剩下一大片实实在在的寂寞。后来远处滑过一只木筏，上面多半又有个傻大个儿在劈木头。木筏上的人差不多总爱干这个。你先看见斧头闪一下，落下去，却没有声音。那人把斧头重新举起来，等它升过头顶，那声咔嚓才终于越过水面，来到你耳边。我们整天就这样懒散地待着，专心听那片寂静。
        - id: ch01-b08
          speaker: huck
          text: 有一次大雾浓得厉害，经过的木筏和平底船都敲着铁皮锅，免得被蒸汽船撞上。有条船离我们很近，船上的人说话、骂人、发笑，我们听得清清楚楚，却看不见半点影子。那感觉叫人发冷，仿佛有幽灵在半空里胡闹。
        - id: ch01-b09
          speaker: jim
          text: 哈克，我看那就是幽灵。
        - id: ch01-b10
          speaker: huck
          text: 不会。幽灵才不会骂这该死的鬼雾呢。
        - id: ch01-b11
          speaker: huck
          text: 天黑透了，我们就解缆，把木筏撑到差不多河中央，任它跟着水流爱往哪儿走就往哪儿走。我们点起烟斗，两腿垂进水里，什么都聊。只要蚊子答应，白天黑夜我们都光着身子。巴克家给我的新衣裳太好，穿着反倒不自在，何况我本来就不喜欢衣服。
        - id: ch01-b12
          speaker: huck
          text: 有时很长一段工夫里，整条大河都只属于我们两个。水那边只有河岸和岛屿。远处小屋窗口的一点烛光，水上木筏或平底船的一两点火星，还有某条船上飘来的提琴声和歌声，全隔着宽宽的水面。住在木筏上真美。我们仰面躺着，看头顶那片缀满星星的天空，争论它们究竟是造出来的，还是自己碰巧有的。
        - id: ch01-b13
          speaker: jim
          text: 星星当然是造出来的。
        - id: ch01-b14
          speaker: huck
          text: 我不信。要造这么多星星，那得花多久啊？
        - id: ch01-b15
          speaker: jim
          text: 也许是月亮生下来的呢。
        - id: ch01-b16
          speaker: huck
          text: 这话听着有道理。我见过一只青蛙生下差不多同样多的卵，月亮当然也办得到。我们还看流星一道道划下去。吉姆说，那些星星是坏掉了，才被人从窝里扔出来。
        - id: ch01-b17
          speaker: huck
          text: 一夜里总有一两回，蒸汽船会从黑暗中悄悄滑过。烟囱忽然喷出满天火星，像一场亮闪闪的雨落进河里，漂亮极了。船拐过河湾，灯光一眨眼便不见了，轰隆声也跟着停住，河面重新安静。很久以后，那船早已走远，它留下的波浪才来到我们身边，轻轻摇一摇木筏。随后又不知要静多久，只偶尔剩下一两声蛙叫。
        - id: ch01-b18
          speaker: huck
          text: 半夜以后，岸上的人都睡了。接下来的两三个钟头，两岸一片漆黑，小屋窗口不再有半点火光。那些火光就是我们的钟。第一点光重新出现，就说明清晨快来了，我们得立刻找地方系好木筏，藏起来。
    - id: ch02
      title: 逃命的陌生人
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 一天快天亮时，我找到一只独木舟，划过两百码宽的河汊，上了大河岸。为了找浆果，我又沿柏树林里的一条小溪往上划了大约一英里。独木舟正经过一处牛踩出来的小路，那条路横穿小溪，两个男人忽然从路上冲来，能跑多快就跑多快。
        - id: ch02-b02
          speaker: huck
          text: 我立刻以为自己完了。每逢有人追人，我总觉得他们追的是我，也可能是吉姆。我正想赶紧划走，那两人已经冲到近处，扯着嗓子求我救命。他们说自己明明没做任何事，却偏偏因此挨追，后面还有人、狗和马。他们刚想直接跳进船里，我连忙拦住。
        - id: ch02-b03
          speaker: huck
          text: 别上船。我还没听见狗和马，你们来得及。钻过灌木，沿小溪往上走一段，再下水趟回来。这样狗就找不到气味了。
        - id: ch02-b04
          speaker: huck
          text: 他们照我说的办了。一上船，我就朝藏木筏的沙洲飞快划去。五到十分钟后，远处传来狗叫和人的喊声。追兵一路来到溪边，可我们看不见他们，只听得出他们像是停在那里胡乱转悠。我们一直往远处走，那些声音越来越轻。等一英里树林落到身后，我们已经划进大河，四周也重新安静。最后我们渡到沙洲，躲进棉白杨林，总算安全了。
        - id: ch02-b05
          speaker: huck
          text: 其中一个至少七十岁，脑袋秃了，络腮胡子灰白。他戴着又旧又瘪的软帽，穿油腻的蓝毛料衬衫，破烂的蓝粗布裤子塞进靴筒里，身上只剩一根家织的吊裤带。胳膊还搭着一件老式蓝布长尾外套，上面缀着光亮的黄铜纽扣。另一个三十来岁，穿得一样寒酸。两人都带着又大又沉、鼓鼓囊囊的旅行袋，袋子破得像被老鼠啃过。
        - id: ch02-b06
          speaker: huck
          text: 吃过早饭，大家全都舒舒服服躺下来聊天。话才说了没多久，我们便听出一件挺奇怪的事。这两个一起逃命、一道上船的家伙，原来从前根本互不相识。
        - id: ch02-b07
          speaker: king
          text: 你怎么惹上麻烦的？
        - id: ch02-b08
          speaker: duke
          text: 我在卖去牙垢的药。它确实能去掉牙垢，通常连牙釉质也一块去掉。可我在镇上多待了一夜。正要溜走，就在小路上碰见你。你说有人追来，求我帮你逃命。我自己也正等着麻烦上门，便跟你一道跑了。事情就这么简单。你呢？
        - id: ch02-b09
          speaker: king
          text: 我在那儿主持一场戒酒奋兴会，差不多讲了一个星期。大大小小的娘儿们都把我当宝贝，因为我把那些酒鬼骂得狗血淋头。我可告诉你，每人收一角，孩子和黑奴免费，我一晚上能挣五六块钱，生意还一天比一天兴旺。
        - id: ch02-b10
          speaker: king
          text: 可昨晚不知怎么忽然传出风声，说我背地里藏着酒壶，闲了就偷喝。今天一早，有个黑奴叫醒我，说镇上的人正悄悄集合，狗和马都带上了。他们马上就来，打算让我先跑半小时，再一路追赶。要是抓住我，就给我全身涂上柏油、粘满羽毛，再让我骑着木杠游街。我连早饭都没等。反正我一点也不饿。
        - id: ch02-b11
          speaker: duke
          text: 老伙计，咱们不如合伙干吧？
        - id: ch02-b12
          speaker: king
          text: 我不反对。你主要做什么行当？
        - id: ch02-b13
          speaker: duke
          text: 本行是流动印刷工，也卖一点专利药。我当过戏剧演员，专门演悲剧。有机会就表演催眠术，摸摸人的头骨看相。为了换换口味，我还开过唱歌兼地理的学校，偶尔也做做演讲。哦，我会的事情多得很，顺手的差不多都干，只要不是正经活儿。你靠什么营生？
        - id: ch02-b14
          speaker: king
          text: 我这辈子也干过不少治病的买卖。最拿手的是把手按在人身上，替他治癌症、瘫痪这一类毛病。只要身边有人能事先替我摸清客人的底细，我算命也算得相当准。我还会讲道，主持野外宗教集会，也到处做过传教士。
    - id: ch03
      title: 一位公爵
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 大家沉默了一阵。年轻人忽然叹了口气。
        - id: ch03-b02
          speaker: duke
          text: 唉！
          emotion: sad
        - id: ch03-b03
          speaker: king
          text: 你叹什么气？
        - id: ch03-b04
          speaker: duke
          text: 真想不到，我竟会活到今天，过上这种日子，还从原来的地位一路堕落，最后与这样的人为伍。
          emotion: sad
        - id: ch03-b05
          speaker: huck
          text: 他说着，拿块破布擦起眼角。秃头一下恼了。
        - id: ch03-b06
          speaker: king
          text: 去你的！我们还配不上你吗？
          emotion: angry
        - id: ch03-b07
          speaker: duke
          text: 不，你们当然配得上我，这样的同伴正是我应得的。从前我地位那么高，如今却落到这里。究竟是谁害的？都是我自己造成的。我不怪你们，先生们，绝没有这个意思。我谁也不怪，这一切都是我应得的。
        - id: ch03-b08
          speaker: duke
          text: 让冷酷的世界使出最狠的手段吧。它大可以照旧运转，夺走我爱的人、我的财产，夺走所有的一切，却夺不走世上属于我的那座坟墓。总有一天，我会躺进去，把这些事全忘掉，让这颗可怜的、破碎的心终于得到安息。
          emotion: sad
        - id: ch03-b09
          speaker: huck
          text: 他还在不停擦眼睛。
        - id: ch03-b10
          speaker: king
          text: 你那颗可怜的破心见鬼去吧。干吗冲我们抖搂它？我们又没把你怎么样。
        - id: ch03-b11
          speaker: duke
          text: 我知道。我没有怪你们。是我亲手把自己害到这一步。我受这些苦完全应该，一句怨言也没有。
        - id: ch03-b12
          speaker: king
          text: 那你原来在哪儿？究竟从什么地方落下来的？
        - id: ch03-b13
          speaker: duke
          text: 你们不会相信，世人从来不信我。算了，这不重要。我的身世之谜……
        - id: ch03-b14
          speaker: king
          text: 身世之谜？你难道是说……
        - id: ch03-b15
          speaker: duke
          text: 先生们，我相信你们，所以愿意说出秘密。照理说来，我是一位公爵！
        - id: ch03-b16
          speaker: huck
          text: 吉姆的眼睛瞪得快掉出来了，我猜自己也一样。秃头根本不敢相信。
        - id: ch03-b17
          speaker: king
          text: 不会吧！你是当真的？
          emotion: surprised
        - id: ch03-b18
          speaker: duke
          text: 当然。我的曾祖父是布里奇沃特公爵的长子。上个世纪末，他为了呼吸自由的空气逃到这个国家，在这里结婚，后来留下一个儿子去世了。当时他的父亲也差不多同时去世。
        - id: ch03-b19
          speaker: duke
          text: 已故公爵的次子抢走爵位和产业，真正的公爵当时还是婴儿，就这样没人理会。我正是那个婴儿的嫡系后裔，是布里奇沃特公爵爵位的合法继承人。可如今我孤苦伶仃，被人从高位赶下来，四处遭追，受这个冷酷世界鄙弃。我衣衫破烂，疲惫不堪，心也碎了，竟沦落到跟几个逃犯共乘一只木筏！
          emotion: sad
        - id: ch03-b20
          speaker: huck
          text: 我和吉姆都非常同情他，连忙想办法安慰。可他说什么安慰都没用，自己怎么也好受不了。不过，我们若肯承认他的身份，那比别的办法都管用。我们说愿意，只要他教我们该怎么做。他说，跟他说话要鞠躬，称他公爵大人、大人或阁下。直接叫布里奇沃特也行，因为那本来是爵号，不是姓名。吃饭时还得有个人站在一边服侍，他吩咐的每件小事也要替他办好。
        - id: ch03-b21
          speaker: huck
          text: 这些都很容易，我们便答应了。整顿饭工夫，吉姆一直站在旁边伺候。
        - id: ch03-b22
          speaker: jim
          text: 公爵大人想吃点这个，还是来点那个？
        - id: ch03-b23
          speaker: huck
          text: 谁都看得出，这一套让公爵受用极了。可老头越来越沉默，大家围着公爵奉承，他显得很不自在，像是一直藏着心事。到了下午，他终于开口。
    - id: ch04
      title: 又来一位国王
      blocks:
        - id: ch04-b01
          speaker: king
          text: 听着，布里奇沃特。我实在同情你，可遇上这种苦难的不只你一个。
        - id: ch04-b02
          speaker: duke
          text: 不是吗？
        - id: ch04-b03
          speaker: king
          text: 不是。身居高位却遭人冤枉，硬给拽下来的人，不只你一个。
        - id: ch04-b04
          speaker: duke
          text: 唉！
        - id: ch04-b05
          speaker: king
          text: 有身世秘密的人也不只你一个。
        - id: ch04-b06
          speaker: huck
          text: 说也奇怪，老头竟抽抽搭搭地哭了起来。
        - id: ch04-b07
          speaker: duke
          text: 等等！你是什么意思？
          emotion: surprised
        - id: ch04-b08
          speaker: king
          text: 布里奇沃特，我能信任你吗？
        - id: ch04-b09
          speaker: duke
          text: 至死不渝！快说，你的身世藏着什么秘密？
        - id: ch04-b10
          speaker: huck
          text: 年轻人握住老头的手，使劲捏了捏。
        - id: ch04-b11
          speaker: king
          text: 布里奇沃特，我就是那位失踪的王太子！
        - id: ch04-b12
          speaker: huck
          text: 这回我和吉姆真看傻了。公爵也愣住了。
        - id: ch04-b13
          speaker: duke
          text: 你是什么？
          emotion: surprised
        - id: ch04-b14
          speaker: king
          text: 我的朋友，这千真万确。站在你眼前的，就是可怜的、失踪了的王太子路易十七，路易十六和玛丽·安托瓦内特的儿子。
        - id: ch04-b15
          speaker: duke
          text: 你？这么大年纪？不可能！你该说自己是已故的查理曼大帝，那样你至少也有六七百岁了。
        - id: ch04-b16
          speaker: king
          text: 都是苦难造成的，布里奇沃特。苦难让我白了头，早早秃了顶。先生们，你们眼前这个穿蓝粗布衣裳、满身苦难的人，四处漂泊，流亡在外，受尽践踏和折磨，却正是法国合法的国王。
          emotion: sad
        - id: ch04-b17
          speaker: huck
          text: 他又哭又闹，我和吉姆几乎不知道怎么办。我们既同情他，又高兴又骄傲，没想到木筏上竟有这样一位人物，只好像刚才那样拼命安慰。
        - id: ch04-b18
          speaker: huck
          text: 国王说，什么安慰都没有用。只有死去，彻底摆脱这一切，才能叫他好受。不过，别人若肯照他的身份对待他，他倒能暂时舒服些。跟他说话必须单膝跪地，一直叫他陛下。吃饭时要先服侍他。他没有开口赐座，谁也不能在他面前坐下。
        - id: ch04-b19
          speaker: huck
          text: 我和吉姆便一口一个陛下，为他做这做那。他不让坐，我们就一直站着。这一套果然大有用处，老头很快变得快活又自在。公爵却渐渐生起闷气，脸色发酸，对事情变成这样一点也不满意。
        - id: ch04-b20
          speaker: huck
          text: 国王仍对公爵十分亲热。他说，公爵的曾祖父和历代布里奇沃特公爵都深受自己父王敬重，常常获准进宫。公爵还是别扭了好一阵，后来国王劝他。
        - id: ch04-b21
          speaker: king
          text: 看来咱们还得在这只该死的木筏上待很久，布里奇沃特。你总绷着脸，只会让大家不痛快。我没生来当公爵，不是我的错。你没生来当国王，也不是你的错。那还有什么好烦的？
        - id: ch04-b22
          speaker: king
          text: 碰上什么日子，就尽量往好里过，这是我的准则。咱们眼下也不坏，吃的管够，日子轻松。来，伸手吧，公爵，大家做朋友。
        - id: ch04-b23
          speaker: huck
          text: 公爵终于伸出手来，我和吉姆看了都很高兴。木筏上那股别扭劲儿总算消失，我们也跟着舒坦极了。木筏上的人若彼此不和，那日子一定难熬。住在这里，最要紧的就是人人都称心，谁也别憋着气，彼此一直好声好气。
        - id: ch04-b24
          speaker: huck
          text: 我没花多少工夫就看明白，这两个满嘴谎话的家伙根本不是什么国王和公爵，只是下三滥的骗子和冒牌货。可我一句也没说，半点也没露出来，只把这事藏在心里。这么做最稳妥，既不会跟他们吵架，也不会给自己招来麻烦。
        - id: ch04-b25
          speaker: huck
          text: 只要能保住一家人的和气，他们想让我们叫国王、公爵，我一点也不反对。告诉吉姆真相也没有任何用处，所以我没告诉他。爸爸就算没教会我别的，至少教会了我一件事。遇上这种人，最好的相处办法，就是由着他们，任他们照自己的意思来。
