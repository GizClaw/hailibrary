  chapters:
    - id: ch01
      title: CHAPTER XXI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The sun was up, but we kept floating instead of tying up. The king and the duke came out looking pretty rough. A swim in the river woke them up. After breakfast, the king sat on a corner of the raft with his boots off, his pants rolled up, and his legs in the water. He lit his pipe and started learning the Romeo and Juliet scene.
        - id: ch01-b02
          speaker: huck
          text: Once he thought he knew it, he practiced with the duke. The duke made him repeat every speech. He taught him when to sigh and put a hand over his heart. At last he said the king was doing fairly well, except for one thing.
        - id: ch01-b03
          speaker: duke
          text: Don't roar “Romeo!” like a bull. Say it soft and lovesick. R-o-o-meo! That's how you do it. Juliet is a dear, sweet young girl. She doesn't bray like a donkey.
        - id: ch01-b04
          speaker: huck
          text: Next they brought out two long swords the duke had made from oak strips. They practiced the fight from Richard the Third, with the duke playing Richard. They struck at each other and pranced all over the raft. It was a grand sight until the king tripped and fell overboard. Then they rested and traded stories about adventures they had once had along the river.
        - id: ch01-b05
          speaker: huck
          text: After dinner, the duke decided their show needed more.
        - id: ch01-b06
          speaker: duke
          text: Look here, Capet. If we want a first-class show, we need an extra act for the encores.
        - id: ch01-b07
          speaker: king
          text: What's an encore, Bilgewater?
        - id: ch01-b08
          speaker: huck
          text: The duke explained it to him.
        - id: ch01-b09
          speaker: duke
          text: I'll come back and dance the Highland fling or the sailor's hornpipe. And you can do Hamlet's soliloquy.
        - id: ch01-b10
          speaker: king
          text: Hamlet's what?
        - id: ch01-b11
          speaker: duke
          text: His soliloquy. It's the most famous thing in Shakespeare. It's magnificent, and audiences always love it. It isn't in the one volume I have, but I can put it together from memory. Let me walk around and pull it out of the vaults of recollection.
        - id: ch01-b12
          speaker: huck
          text: He marched back and forth, thinking hard. Now and then he frowned terribly. Then his eyebrows went up. He pressed a hand to his forehead, staggered backward, and moaned. He sighed and even pretended to shed a tear. It was beautiful to watch. Before long, he said he had remembered it and told us to pay attention.
        - id: ch01-b13
          speaker: huck
          text: He struck a noble pose with one leg forward, his arms raised high, his head tipped back, and his eyes on the sky. Then he ranted, ground his teeth, howled, waved about, and puffed out his chest. It beat every piece of acting I had ever seen. I learned the speech easily enough while he taught it to the king.
        - id: ch01-b14
          speaker: duke
          text: To be, or not to be. That is the bare bodkin that makes calamity of so long life. For who would carry burdens until Birnam Wood comes to Dunsinane, except that fear of something after death murders innocent sleep, great nature's second course, and makes us sling the arrows of outrageous fortune instead of flying to troubles we don't know? That is what makes us pause. Wake Duncan with your knocking! I wish you could. For who would bear the whips and scorns of time, the oppressor's wrong, the proud man's insults, the law's delay, and the quietus his pain might take? In the dead middle of night, when churchyards yawn in customary suits of solemn black, the undiscovered country that no traveler returns from breathes sickness on the world. So resolution, like the poor cat in the old saying, turns pale with care. All the clouds above our roofs turn their currents aside and lose the name of action. It is an ending greatly to be wished. But softly now, the fair Ophelia. Do not open your heavy marble jaws. Go to a nunnery. Go!
        - id: ch01-b15
          speaker: huck
          text: The old man liked the speech and soon learned to perform it first-rate. He seemed born for it. Once he got excited, the way he tore into the ending was perfectly lovely.
        - id: ch01-b16
          speaker: huck
          text: At the first opportunity, the duke had show bills printed. For the next two or three days, the raft was livelier than any raft you ever saw. Sword fights and rehearsals went on nearly all the time. Then one morning, well down in Arkansas, we saw a tiny town sitting in a big bend. We hid the raft three quarters of a mile above it, inside a creek covered over like a tunnel by cypress trees. Everybody but Jim took the canoe into town to see if we could put on our show there.
        - id: ch01-b17
          speaker: huck
          text: Our luck was good. A circus was coming that afternoon, and farm families were already arriving in broken-down wagons and on horseback. The circus would be gone before night, which left a fine opening for us. The duke rented the courthouse, and we put up the bills around town.
        - id: ch01-b18
          speaker: huck
          text: The bills promised a Shakespeare revival for one night only. They called the king and duke world-famous actors from grand London theaters. The program offered the balcony scene from Romeo and Juliet, a blood-curdling sword fight from Richard the Third, and Hamlet's immortal soliloquy, supposedly performed three hundred nights in Paris. It claimed new costumes, scenery, and a full company. Admission was twenty-five cents, or ten cents for children and servants. The actors had to leave at once for Europe, of course, so this was the town's only chance.
        - id: ch01-b19
          speaker: huck
          text: Then we wandered around town. Nearly every house and store was an old, dried-up wooden place that had never seen paint. They stood three or four feet above the ground on stilts, beyond the reach of floodwater. Little gardens held almost nothing but weeds, sunflowers, ash heaps, worn-out boots, broken bottles, rags, and useless tin pans. The fences leaned every way. Their mismatched boards had been nailed on at different times, and most gates hung by one leather hinge.
        - id: ch01-b20
          speaker: duke
          text: Those fences were probably whitewashed back in Columbus's time.
        - id: ch01-b21
          speaker: huck
          text: Hogs were usually rooting in the gardens while people chased them out. All the stores stood along one street. White cloth awnings hung out front, and country people tied their horses to the awning posts. Empty goods boxes sat underneath. Loafers perched on them all day, carving the wood with pocketknives, chewing tobacco, yawning, and stretching. They were a sorry-looking crowd.
        - id: ch01-b22
          speaker: huck
          text: Most wore yellow straw hats almost as wide as umbrellas, with no coats or vests. They called each other Bill, Buck, Hank, Joe, and Andy. They talked in lazy drawls and cursed plenty. Almost every awning post had a loafer against it, hands in his pockets unless he pulled them out to lend somebody tobacco or scratch himself.
        - id: ch01-b23
          speaker: loafer_1
          text: Give me a chew of tobacco, Hank.
        - id: ch01-b24
          speaker: loafer_2
          text: Can't. I've only got one chew left. Ask Bill.
        - id: ch01-b25
          speaker: huck
          text: Maybe Bill shared, and maybe he lied that he had none. Some loafers never owned a cent or a chew. They borrowed all their tobacco and claimed they had just given their last piece to somebody else. That lie might fool a stranger, but it did not fool their friends.
        - id: ch01-b26
          speaker: loafer_2
          text: You gave Ben Thompson your last chew? Sure you did, and so did your sister's cat's grandmother. Pay back what you already borrowed from me, Lafe Buckner. Then I'll lend you a ton or two without charging back interest.
        - id: ch01-b27
          speaker: loafer_1
          text: Well, I did pay some of it back once.
        - id: ch01-b28
          speaker: loafer_2
          text: About six chews. You borrowed good store tobacco and paid me back with cheap leaf.
        - id: ch01-b29
          speaker: huck
          text: Store tobacco came in flat black plugs, while these fellows mostly chewed twisted natural leaf. A borrower did not cut off his share. He clamped the plug between his teeth and pulled with both hands until it tore in two. Sometimes the owner stared sadly at what came back.
        - id: ch01-b30
          speaker: loafer_2
          text: Here, give me the chew and you keep the plug.
        - id: ch01-b31
          speaker: huck
          text: Every street and lane was mud, black as tar and nearly a foot deep in places. Even the shallow spots had two or three inches. Hogs wandered and grunted everywhere. A muddy sow and her pigs might amble down the street, then flop right where people needed to walk. She would close her eyes and wave her ears while the pigs fed, looking as contented as if she were being paid for it.
        - id: ch01-b32
          speaker: loafer_1
          text: Go get her, Tige!
        - id: ch01-b33
          speaker: huck
          text: The sow would race off squealing, with a dog hanging from each ear and three or four dozen more behind her. Every loafer got up, watched them disappear, laughed at the sport, and seemed thankful for the noise. Then they sat down until a dogfight woke them again. Nothing pleased them more, unless it was setting fire to turpentine on a stray dog or tying a pan to its tail and watching it run itself to death.
        - id: ch01-b34
          speaker: huck
          text: Along the riverfront, abandoned houses leaned out over the bank, bent and almost ready to fall. Under some occupied houses, the river had eaten away one corner, leaving it hanging in the air. Living there was dangerous. A strip of earth as wide as a house could cave in at once. Sometimes a belt a quarter mile deep crumbled away through one summer. The town had to keep moving backward because the river never stopped gnawing at it.
        - id: ch01-b35
          speaker: huck
          text: As noon came closer, the streets filled with more wagons and horses. Country families had brought dinner and ate in their wagons. Plenty of whiskey was going around, and I saw three fights. Then somebody shouted that old Boggs had come for his regular monthly drunk.
        - id: ch01-b36
          speaker: loafer_1
          text: Here comes old Boggs, boys! Who do you suppose he's going to chew up this time? If he'd really chewed up every man he threatened for the last twenty years, he'd have quite a reputation.
        - id: ch01-b37
          speaker: loafer_2
          text: I wish he'd threaten me. Then I'd know I was safe from dying for a thousand years.
        - id: ch01-b38
          speaker: huck
          text: Boggs came tearing along on horseback, yelling and whooping. He was over fifty, with a bright red face, and he swayed in the saddle because he was drunk.
        - id: ch01-b39
          speaker: boggs
          text: Clear the road! I'm on the warpath, and coffin prices are about to rise!
        - id: ch01-b40
          speaker: huck
          text: Everyone shouted, laughed, and called things at him. Boggs answered every insult and promised to deal with each man in turn. But first, he said, he had come to kill Colonel Sherburn. His rule was meat first and spoon food afterward. Then he noticed me and rode close.
        - id: ch01-b41
          speaker: boggs
          text: Where did you come from, boy? Are you ready to die?
        - id: ch01-b42
          speaker: huck
          text: He rode on. I was frightened, but a man nearby explained.
        - id: ch01-b43
          speaker: townsman
          text: He doesn't mean anything. He always carries on that way when he's drunk. He's the best-natured old fool in Arkansas. He's never hurt anybody, drunk or sober.
        - id: ch01-b44
          speaker: huck
          text: Boggs stopped at the biggest store and bent low to see beneath its awning.
        - id: ch01-b45
          speaker: boggs
          text: Come out, Sherburn! Come face the man you swindled! You're the hound I came for, and I'm going to get you!
          emotion: angry
        - id: ch01-b46
          speaker: huck
          text: He kept calling Sherburn every name he knew. The whole street crowded around, listening and laughing. At last a proud-looking man of about fifty-five stepped from the store. He was the best-dressed man in town. The crowd opened a path for him.
        - id: ch01-b47
          speaker: sherburn
          text: I'm tired of this, but I'll put up with it until one o'clock. Remember that. One o'clock, and not a minute longer. Say one word against me after that, and no matter how far you run, I will find you.
          emotion: calm
        - id: ch01-b48
          speaker: huck
          text: Sherburn turned and went inside. The crowd went sober. Nobody moved or laughed. Boggs rode away, cursing Sherburn as loudly as ever. Soon he came back and stopped before the store, still shouting. Men surrounded him and begged him to be quiet. One o'clock was only fifteen minutes away, they warned, so he had to go home at once.
        - id: ch01-b49
          speaker: huck
          text: Boggs would not listen. He cursed with all his strength, threw his hat into the mud, and rode over it. Then he charged down the street again with his gray hair flying. Whenever anyone got near him, they tried to coax him off the horse so they could lock him up until he was sober. Nothing worked. He kept racing back to curse Sherburn again.
        - id: ch01-b50
          speaker: townsman
          text: Somebody fetch his daughter, quick! Sometimes he'll listen to her. If anyone can talk him down, she can.
        - id: ch01-b51
          speaker: huck
          text: Someone ran for her. I walked farther down the street and stopped. Five or ten minutes later, Boggs came back without his horse or hat. Two friends held his arms and hurried him along. He was quiet now and looked worried. He did not resist them. In fact, he hurried too.
        - id: ch01-b52
          speaker: sherburn
          text: Boggs!
        - id: ch01-b53
          speaker: huck
          text: I looked across the street. Colonel Sherburn stood perfectly still with a pistol in his right hand. He was not aiming yet. The barrel pointed toward the sky. At that same moment, I saw a young girl running toward us with two men.
        - id: ch01-b54
          speaker: huck
          text: Boggs and his friends turned at the call. The moment the friends saw the pistol, they jumped aside. Slowly and steadily, Sherburn lowered the barrel until it was level. Both hammers were cocked. Boggs threw up his hands.
        - id: ch01-b55
          speaker: boggs
          text: Oh Lord, don't shoot!
          emotion: fearful
        - id: ch01-b56
          speaker: huck
          text: The first shot cracked. Boggs staggered backward, clawing at the air. The second shot cracked, and he fell flat on his back, heavy and solid, with both arms spread wide.
        - id: ch01-b57
          speaker: huck
          text: The young girl screamed and rushed to him. She dropped across her father's body, crying.
        - id: ch01-b58
          speaker: boggs_daughter
          text: Oh, he's killed him! He's killed him!
          emotion: sad
        - id: ch01-b59
          speaker: huck
          text: The crowd closed around them, shoving shoulder to shoulder and stretching their necks for a look. People nearest Boggs pushed back and called for everyone to give him air. Sherburn tossed his pistol onto the ground, turned on his heel, and walked away.
        - id: ch01-b60
          speaker: huck
          text: They carried Boggs into a little drugstore. The crowd pressed after them, and before long the whole town was there. I rushed to a window and found a good place close enough to see him. They laid him on the floor with a large Bible beneath his head. After tearing open his shirt, they spread another open Bible across his chest. I could see where one bullet had entered.
        - id: ch01-b61
          speaker: huck
          text: Boggs took about a dozen long breaths. Each time he breathed in, his chest lifted the Bible. Each time he breathed out, it sank again. Then he lay still. He was dead. They pulled his daughter away while she screamed and cried. She looked about sixteen, sweet and gentle, but terribly pale and frightened.
        - id: ch01-b62
          speaker: huck
          text: Soon everyone in town was wriggling, crowding, pushing, and shoving for a turn at the window. The people who already had good places would not move. Those behind complained that they had looked long enough and ought to let others have their fair chance.
        - id: ch01-b63
          speaker: huck
          text: The arguing got louder, so I slipped away before trouble started. The streets were full, and everybody was excited. Every witness told the story to a packed circle of listeners. One tall, thin man had long hair, a great white fur stovepipe hat tipped back on his head, and a cane with a crooked handle. He used the cane to mark where Boggs and Sherburn had stood.
        - id: ch01-b64
          speaker: huck
          text: People followed him from mark to mark, nodding to show they understood. They bent forward with hands on their thighs to watch every move. Then the man stood straight and stiff on Sherburn's spot. He frowned beneath the brim of his hat.
        - id: ch01-b65
          speaker: reenactor
          text: Boggs!
        - id: ch01-b66
          speaker: huck
          text: He slowly lowered his cane like a pistol.
        - id: ch01-b67
          speaker: reenactor
          text: Bang!
        - id: ch01-b68
          speaker: huck
          text: He staggered backward.
        - id: ch01-b69
          speaker: reenactor
          text: Bang!
        - id: ch01-b70
          speaker: huck
          text: Then he fell flat on his back. The witnesses said the performance was perfect, exactly the way it had happened. A dozen people pulled out bottles and treated him to drinks.
        - id: ch01-b71
          speaker: huck
          text: Before long, somebody said Sherburn ought to be lynched. Within a minute, everyone was saying it. The whole crowd rushed off, furious and yelling, tearing down every clothesline they passed so they could use the ropes to hang him.
