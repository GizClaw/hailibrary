audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    hank:
      display_name: 汉克
      tts:
        delivery: 懒洋洋，满不在乎
        timbre: 粗哑松散
        pace: 拖沓
        pitch: 中低
    loafer:
      display_name: 闲汉
      tts:
        delivery: 油滑刻薄，爱看热闹
        timbre: 干涩粗俗
        pace: 慢悠悠
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 不耐烦，回嘴时尖刻
        timbre: 硬朗沙哑
        pace: 爽利
        pitch: 中
    lafe:
      display_name: 莱夫·巴克纳
      tts:
        delivery: 赖皮随便，辩解时含含糊糊
        timbre: 粗糙低沉
        pace: 慢
        pitch: 中低
    boggs:
      display_name: 博格斯
      tts:
        delivery: 醉意浓重，叫嚣时狂放含混
        timbre: 苍老洪亮
        pace: 忽快忽慢
        pitch: 中低
    townsman:
      display_name: 镇民
      tts:
        delivery: 朴直随便，说话带着乡下腔调
        timbre: 成年浑厚
        pace: 舒缓
        pitch: 中低
    sherburn:
      display_name: 舍本上校
      tts:
        delivery: 冷峻克制，威胁时不动声色
        timbre: 坚硬深沉
        pace: 缓慢稳定
        pitch: 低
    boggs_daughter:
      display_name: 博格斯的女儿
      tts:
        delivery: 年轻温柔，惊痛时失声哭喊
        timbre: 清亮纤细
        pace: 自然偏快
        pitch: 中高
    onlooker_1:
      display_name: 围观者甲
      tts:
        delivery: 激动急切，容易跟着人群起哄
        timbre: 明亮有力
        pace: 偏快
        pitch: 中
    onlooker_2:
      display_name: 围观者乙
      tts:
        delivery: 粗声粗气，呼喊时毫不迟疑
        timbre: 粗厚响亮
        pace: 爽快
        pitch: 中低
    reenactor:
      display_name: 高个子男人
      tts:
        delivery: 好卖弄，模仿时一本正经
        timbre: 瘦削清晰
        pace: 刻意舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 木筏上的排演
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 天已经大亮，我们还是没有停靠。国王和公爵过了一阵才钻出来，两个人都没精打采的。他们跳进河里游了一回，精神才好了不少。早饭后，国王坐在木筏一角，脱掉靴子，卷起裤腿，把脚垂进水里。他点上烟斗，舒舒服服地背起《罗密欧与朱丽叶》。等他背熟一些，公爵便陪他排演。每句台词怎么念，公爵都要教上好几遍，还叫他叹气，把手按在心口。练过一阵，公爵总算觉得还不错，只剩一个毛病。
        - id: ch01-b02
          speaker: duke
          text: 你别像公牛一样吼“罗密欧”！要轻一点，病恹恹一点，还得缠绵。听着，是“罗——密——欧”。这才对。朱丽叶是个娇滴滴的小姑娘，哪会像驴子一样扯着嗓子叫？
        - id: ch01-b03
          speaker: huck
          text: 接下来，他们拿出两把橡木板条做的长剑，开始练剑斗。公爵自称理查三世。两个人在木筏上你劈我砍，蹦来跳去，实在好看。后来国王绊倒，掉进河里，他们才停下来歇气，聊起从前在河上经历的种种奇遇。吃过午饭，公爵又有了主意。
        - id: ch01-b04
          speaker: duke
          text: 喂，卡佩，咱们要办一场第一流的演出，还得再添点节目。至少观众叫咱们返场时，咱们手里得有东西可演。
        - id: ch01-b05
          speaker: king
          text: 布里奇沃特，啥叫返场？
        - id: ch01-b06
          speaker: huck
          text: 公爵先给他解释清楚，然后安排起返场节目。
        - id: ch01-b07
          speaker: duke
          text: 我可以跳苏格兰高地舞，或者水手角笛舞。至于你……让我想想。对了，你来念哈姆雷特的独白。
        - id: ch01-b08
          speaker: king
          text: 哈姆雷特的啥？
        - id: ch01-b09
          speaker: duke
          text: 哈姆雷特的独白呀！莎士比亚最有名的一段。真是崇高，太崇高了，每次都能叫满场观众倾倒。可惜我手头这一卷书里没有。不过我凭记忆东拼西凑，也能把它凑出来。让我走上几圈，看看能不能从记忆的宝库里把它唤回来。
        - id: ch01-b10
          speaker: huck
          text: 公爵来回踱步，苦苦思索。他一会儿狠狠皱眉，一会儿扬起眉毛，又把手紧按在额头上，踉跄后退，低声呻吟。接着，他叹口气，还装作流下一滴眼泪。那副模样真漂亮。过了一阵，他说自己想出来了，叫我们留神。随后，他跨出一条腿，两臂高举，脑袋向后仰着望天，摆出无比高贵的姿势。他开始咆哮，咬牙切齿。整段独白里，他又嚎又舞，胸膛鼓得老高，把我见过的所有演技都比得一点不剩。他教国王的时候，我也轻轻松松记住了那段话。
        - id: ch01-b11
          speaker: duke
          text: 生存，还是毁灭；这就是那柄出鞘的短剑，使灾难把人生拖得如此漫长。谁肯背负重担，直到伯南森林走向邓西嫩？若不是死后某种事物的恐惧，谋杀了无辜的睡眠，那是大自然盛宴上的第二道佳肴。它叫我们宁愿投出暴虐命运的利箭，也不肯飞向那些不知道的灾祸。正是这层顾虑使我们踌躇。用你的敲门声叫醒邓肯吧！但愿你叫得醒。谁肯忍受岁月的鞭挞和嘲弄，压迫者的横行、傲慢者的凌辱、法律的拖延，以及他的痛苦本可求得的长眠？在死寂荒凉的午夜，当墓园打着呵欠，身穿惯常那套庄严的黑衣。若不是那无人归来的未知国度，从边界向世间吐出瘟疫，于是决心天生的本色，像俗话里那只可怜的猫，蒙上忧虑的病容。笼罩在我们屋顶上的一切乌云，也因此掉转流向，失去了行动的名号。这是一个虔诚值得盼望的结局。且慢，美丽的奥菲利娅。莫要张开你沉重的大理石巨口。快去修道院吧——去吧！
        - id: ch01-b12
          speaker: huck
          text: 老头儿非常喜欢这段独白，很快就学得能演得十足精彩。他简直天生就该演这个。一旦演顺手，来了兴头，他便大喊大叫，横冲直撞，最后再仰头咆哮，那模样实在美妙极了。
    - id: ch02
      title: 一张第一流的戏单
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 一有机会，公爵便印了一批戏单。接下来两三天，木筏顺流而下，筏上却热闹得不得了。两个人从早到晚不是练剑斗，就是做公爵所谓的“排演”。一天早晨，我们已深入阿肯色州，在大河湾里看见一个寒酸的小镇。我们把木筏藏进镇子上游约四分之三英里处的小溪口。两旁的柏树把那里封得像条隧道。吉姆留下，其他人坐独木舟进镇，看看演出有没有机会。
        - id: ch02-b02
          speaker: huck
          text: 这回运气好极了。那天下午正有马戏团来，乡下人已经骑着马，或赶着摇摇欲坠的旧车进城。马戏团天黑前离开，我们的戏晚上就有机会了。公爵租下法院，我们四处张贴戏单。戏单先用一连串大字宣布，莎翁名剧复兴，绝妙盛会，只演一夜。接着，它介绍两位誉满全球的悲剧大师，一位是伦敦德鲁里巷剧院的小大卫·加里克，另一位是皇家干草市场剧院的老埃德蒙·基恩。他来自伦敦白教堂、布丁巷、皮卡迪利大街，还来自欧洲大陆各皇家剧院。
        - id: ch02-b03
          speaker: huck
          text: 这两位大师将联手献上崇高的莎翁奇观，也就是《罗密欧与朱丽叶》里的《阳台一幕》。加里克先生演罗密欧，基恩先生演朱丽叶，还有全体剧团倾力相助。戏服、布景和陈设全是新的。戏单还说，他们会演《理查三世》里惊心动魄、技艺精湛、令人毛骨悚然的阔剑大战。加里克先生演理查三世，基恩先生演里士满。
        - id: ch02-b04
          speaker: huck
          text: 最后还有应观众特别要求献上的哈姆雷特不朽独白，由显赫的基恩先生表演。他在巴黎连演过三百夜。如今只演这一夜，因为欧洲要务刻不容缓。票价二角五分，儿童和仆人只收一角。
        - id: ch02-b05
          speaker: huck
          text: 贴完戏单，我们就在镇上闲逛。那里的商铺和住宅，差不多全是从没刷过油漆的破木房子，干枯得像要散架。房子架在三四英尺高的木桩上，河水泛滥时才不至于淹着。屋外的小园子里几乎不长正经东西，只有曼陀罗、向日葵、灰堆、卷曲的旧靴旧鞋、碎玻璃瓶、破布和废锡器。围栏是不同年代的木板东拼西凑钉起来的，朝四面歪倒。门通常只有一个皮革铰链。有些围栏不知哪年刷过白灰，公爵说大概是哥伦布那时候刷的。园里往往还有猪，人们正忙着赶它们出去。
        - id: ch02-b06
          speaker: huck
          text: 所有商店都挤在一条街上，门前支着白棉布篷。乡下人把马拴在篷柱上。篷下摆着空干货箱，闲汉们整天蹲在上面。他们拿巴洛牌小刀削箱板，嚼着烟草，张嘴发呆，打呵欠，伸懒腰，真是一帮不成器的家伙。他们大多戴着几乎有雨伞那么宽的黄草帽，不穿外套，也不穿背心。大家互相叫比尔、巴克、汉克、乔、安迪，说话又懒又慢，还夹着一大堆脏话。差不多每根篷柱都倚着一个闲汉，双手总插在裤兜里。只有借烟草嚼，或者挠痒的时候，他们才肯把手拿出来。
        - id: ch02-b07
          speaker: loafer
          text: 汉克，给俺咬口烟草。
        - id: ch02-b08
          speaker: hank
          text: 不成。俺只剩一口了。问比尔去。
        - id: ch02-b09
          speaker: huck
          text: 比尔有时会给他，有时会撒谎，说自己没有。有些闲汉浑身一个子儿也没有，连一口自己的烟草也没有，全靠借来嚼。他们总说，自己刚把最后一口给了别人，所以想向杰克借一口。这话十回有九回是假话，只骗得过外乡人。可杰克又不是外乡人。
        - id: ch02-b10
          speaker: jack
          text: 是你给了他一口？你妹妹那只猫的外婆也给了。莱夫·巴克纳，你先把以前借俺的烟草还来，俺再借你一两吨，陈年老利息也不收你的。
        - id: ch02-b11
          speaker: lafe
          text: 可俺从前也还过你一点呀。
        - id: ch02-b12
          speaker: jack
          text: 是啊，还过差不多六口吧。你借的是店里买的烟砖，还回来的却是黑鬼头牌。
        - id: ch02-b13
          speaker: huck
          text: 店里卖的烟草是扁平的黑色烟砖，这些人嚼的却多半是拧成条的天然烟叶。他们借烟草时不用刀切，只把烟砖咬在牙间，一面啃，一面用手使劲扯，直到断成两截。有时主人接回剩下的半块，会伤心地看着它，再讥讽一句。
        - id: ch02-b14
          speaker: jack
          text: 得，把那一口还俺，你把整块拿走吧。
    - id: ch03
      title: 泥街上的人和猪
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 大街小巷里除了泥，什么也没有。泥黑得像柏油，有些地方差不多一英尺深，最浅的地方也有两三英寸。猪到处闲逛，哼哼唧唧。你会看见一头满身泥的母猪领着一窝小猪，慢悠悠走上街，然后扑通一声横躺在路中间。行人只好绕开。它舒展身子，闭上眼睛，扇着耳朵，让小猪吃奶，看起来快活得像有人给它发工钱。
        - id: ch03-b02
          speaker: loafer
          text: 嗨！上啊，小子！泰格，咬它！
        - id: ch03-b03
          speaker: huck
          text: 母猪顿时发出骇人的尖叫，撒腿便跑。每只耳朵上都挂着一两条狗，后面还有三四十条追过来。所有闲汉这才站起身，一直看到它们消失，再乐得哈哈大笑，仿佛很感激这场喧闹。随后他们重新坐好，等下一场狗打架。只有狗打架能让他们彻底醒过来，满心快活。除非是在流浪狗身上浇松节油再点火，或者把锡锅拴在狗尾巴上，看它跑到累死。
        - id: ch03-b04
          speaker: huck
          text: 河边有些房屋伸出岸外，歪腰塌背，眼看就要掉进水里，住户已经搬走。另一些屋子下面塌掉了一个角，那一角就悬在空中，居然还有人住。这样很危险，因为河岸有时一下便塌掉一条房子那么宽。还有些时候，一大片纵深四分之一英里的土地会开始坍塌，一路塌个不停，一个夏天全掉进河里。这样的镇子只能不断后退，再后退，因为河水一直在啃它。
        - id: ch03-b05
          speaker: huck
          text: 越近中午，街上的车辆和马匹越多，后面还在不停赶来。乡下人带着午饭，全家坐在车上吃。镇上有不少人喝威士忌，我还看见了三场打斗。过了一阵，有人突然喊起来。
        - id: ch03-b06
          speaker: onlooker_1
          text: 老博格斯来啦！从乡下进城，喝他每月那顿小醉来啦。伙计们，他来啦！
        - id: ch03-b07
          speaker: huck
          text: 闲汉们全都喜形于色。他们看来早就习惯拿博格斯取乐了。
        - id: ch03-b08
          speaker: loafer
          text: 不知道他这回又要生吞谁。过去二十年里，他说要生吞的人如果真全叫他吞了，如今可有大名声啦。
        - id: ch03-b09
          speaker: onlooker_2
          text: 真希望老博格斯也威胁俺一回。那俺就知道，自己一千年里都死不了啦。
        - id: ch03-b10
          speaker: huck
          text: 博格斯骑马飞奔而来，像印第安人似的又吼又叫。
        - id: ch03-b11
          speaker: boggs
          text: 让开，给俺让路！俺走上战道啦，棺材要涨价啦！
        - id: ch03-b12
          speaker: huck
          text: 他喝醉了，在马鞍上东倒西歪。他已经年过五十，脸红得厉害。人们全朝他叫嚷，嘲笑他，挖苦他，他也马上骂回去。他说会按顺序逐一收拾他们，把他们全放倒，只是眼下等不得。他进城是为了杀舍本老上校。他的信条是，先吃肉，最后再拿稀食收尾。他看见我，便骑到跟前。
        - id: ch03-b13
          speaker: boggs
          text: 小子，你从哪儿来？准备好死了吗？
        - id: ch03-b14
          speaker: huck
          text: 说完，他骑马走了。我真有点害怕，旁边一个男人却叫我别当真。
        - id: ch03-b15
          speaker: townsman
          text: 他没恶意。每回喝醉，他都这么胡闹。他是阿肯色州脾气最好的老傻瓜，不管醉着还是醒着，从没伤过谁。
    - id: ch04
      title: 一点钟的警告
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 博格斯骑到镇上最大的商店前，低下脑袋，从遮篷的垂帘下面望进去。
        - id: ch04-b02
          speaker: boggs
          text: 舍本，滚出来！滚出来见见让你坑过的人。俺找的就是你这条狗，这回非逮住你不可！
          emotion: angry
        - id: ch04-b03
          speaker: huck
          text: 他不停地骂，把想得出的难听话全扣到舍本头上。整条街都挤满了人，大家一面听，一面笑闹。过了一阵，一个神气傲慢、约莫五十五岁的男人从商店走出来。他也是镇上穿得最好的人。人群往两边退开，给他让路。他极其冷静，说话又慢又稳。
        - id: ch04-b04
          speaker: sherburn
          text: 我已经听够了，不过可以容忍你到一点钟。记住，一点钟，不会更久。过了那个钟点，你只要再开一次口骂我，不管跑得多远，我都会找到你。
          emotion: calm
        - id: ch04-b05
          speaker: huck
          text: 舍本转身回了商店。人群马上严肃起来，没人动，也没人再笑。博格斯骑下街去，仍然扯着嗓子骂舍本。没过多久，他又转回来，停在店前继续骂。几个人围上去，想叫他闭嘴，还提醒他，再过约莫一刻钟就是一点。他非回家不可，必须立刻走。可这些话一点用也没有。
        - id: ch04-b06
          speaker: huck
          text: 博格斯拼命咒骂，把帽子扔进泥里，又骑马从上面踏过去。随后，他再一次怒气冲冲地冲下街去，一头灰发迎风乱飞。每个能凑近的人都尽力哄他下马，想把他关起来，等他醒酒。还是不管用。他总会冲回街上，再把舍本痛骂一顿。最后，有人想到了他的女儿。
        - id: ch04-b07
          speaker: townsman
          text: 去找他女儿！快去！有时候他肯听她的话。真有人能劝住他，那也只有她了。
        - id: ch04-b08
          speaker: huck
          text: 有个人立刻飞奔而去。我顺着街走了一段，停下来看。五到十分钟以后，博格斯又出现了，这回没有骑马。他光着头，摇摇晃晃地朝我这边穿过街道。两边各有一个朋友抓着他的胳膊，催他赶快走。博格斯不再吵闹，神色不安。他没有往后挣扎，反倒也在自己赶路。忽然，有人叫了他的名字。
        - id: ch04-b09
          speaker: sherburn
          text: 博格斯，回头看我！
        - id: ch04-b10
          speaker: huck
          text: 我朝那边看去，原来是舍本上校。他一动不动地站在街上，右手举着一把手枪。他没有瞄准，枪管还斜斜指着天空。就在这时，一个年轻姑娘和两个男人也飞奔过来。博格斯和扶着他的人回头看是谁叫他。那两个朋友一看见手枪，马上跳到一旁。枪管缓慢而平稳地压下来，终于端平，两根枪管的击锤都扳开了。
        - id: ch04-b11
          speaker: boggs
          text: 主啊，别开枪！
          emotion: fearful
        - id: ch04-b12
          speaker: huck
          text: 砰！第一枪响了。博格斯向后踉跄，两只手在空中乱抓。砰！第二枪又响了。他沉重地仰面倒地，两条胳膊摊开。那个年轻姑娘尖叫着冲过来，一头扑在父亲身上。
        - id: ch04-b13
          speaker: boggs_daughter
          text: 啊，他杀了他！他杀了他！
          emotion: fearful
        - id: ch04-b14
          speaker: huck
          text: 人群立刻围拢，互相推搡拥挤，一个个伸长脖子想看。站在里面的人使劲把他们往后推。
        - id: ch04-b15
          speakers: [onlooker_1, onlooker_2, townsman]
          ensemble: chorus
          text: 退后，退后！让他透气，让他透气！
        - id: ch04-b16
          speaker: huck
          text: 舍本上校把手枪扔在地上，转过脚跟，走开了。
    - id: ch05
      title: 死亡和私刑的人群
      blocks:
        - id: ch05-b01
          speaker: huck
          text: 人们把博格斯抬进一家小药铺。人群还是紧紧围着，全镇的人都跟了过去。我冲到窗边，抢到一个好位置，离他很近，可以看见里面。他们把他放在地板上，拿一本大《圣经》垫住他的脑袋，又翻开另一本，摊在他胸口。不过在这以前，他们先撕开了他的衬衫，我看见一颗子弹射进去的地方。
        - id: ch05-b02
          speaker: huck
          text: 博格斯长长地喘了约莫十二口气。每次吸气，他的胸膛便把《圣经》顶起来。每次呼气，书又落下。随后他一动不动。他死了。人们把他的女儿从他身边拉开，在她的尖叫和哭泣声中将她带走。她约莫十六岁，长得十分甜美温柔，可脸色惨白，已经吓坏了。
        - id: ch05-b03
          speaker: huck
          text: 没过多久，全镇的人都到了。他们扭着身子，你推我挤，拼命往窗前钻，只想看上一眼。可占到位置的人死也不肯让开。后面的人一直抱怨。
        - id: ch05-b04
          speaker: onlooker_1
          text: 喂，你们几个已经看够了！老霸着地方，不给别人一点机会，这不对，也不公平。旁人也有旁人的权利呀！
        - id: ch05-b05
          speaker: huck
          text: 双方骂得很凶，我觉得可能要闹起来，便从人群里溜出去。街上到处都是人，每个人都很激动。凡是亲眼看见枪击的人，都在讲事情怎么发生。他们每个人身边都围着一大群人，个个伸长脖子听。
        - id: ch05-b06
          speaker: huck
          text: 有个又高又瘦的长发男人，后脑勺扣着高高的白毛皮烟囱帽，手里还拿一根弯柄手杖。他先在地上标出博格斯站的位置，再标出舍本站的位置。人们跟着他从这边走到那边，盯着他的一举一动，不停点头，表示自己看明白了。他用手杖在地上划位置时，他们又弯下腰，两手支住大腿，凑近了看。
        - id: ch05-b07
          speaker: huck
          text: 那男人走到舍本站过的地方，挺直身子，绷得硬邦邦的。他皱起眉，把帽檐压在眼睛上方，然后高喊起来。
        - id: ch05-b08
          speaker: reenactor
          text: 我先喊一声博格斯，再开第一枪，砰！接着是第二枪，砰！
        - id: ch05-b09
          speaker: huck
          text: 他先把手杖慢慢放平。喊完第一声“砰”，便向后踉跄。第二声一出口，他直挺挺地仰倒在地。亲眼见过枪击的人都说，他演得分毫不差，当时就是这样发生的。于是足有十二个人掏出酒瓶，请他喝酒。
        - id: ch05-b10
          speaker: huck
          text: 过了一阵，有人说应该对舍本动用私刑。不到一分钟，所有人都这样嚷起来。他们怒吼着冲上街去，见到晾衣绳就一把扯下来，准备用它绞死舍本。
