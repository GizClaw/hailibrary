  chapters:
    - id: ch01
      title: CHAPTER II.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: We tiptoed through the trees toward the back of the widow's garden. We kept low so the branches wouldn't scrape our heads. But when we passed the kitchen, I tripped over a root and made a noise. We dropped down and lay still.
        - id: ch01-b02
          speaker: huck
          text: Miss Watson's big slave, Jim, was sitting in the kitchen doorway. The light behind him let us see him clearly. He stood up, stretched his neck out, and listened for about a minute.
        - id: ch01-b03
          speaker: jim
          text: Who's there?
        - id: ch01-b04
          speaker: huck
          text: Jim listened some more. Then he came tiptoeing over and stopped right between us. He was so close we could almost have touched him. For minutes and minutes, none of us made a sound.
        - id: ch01-b05
          speaker: huck
          text: A spot on my ankle started itching, but I didn't dare scratch it. Then my ear itched. Next it was my back, right between my shoulders. I thought I'd die if I couldn't scratch. I've noticed that plenty of times since. If you're with important folks, or at a funeral, or trying to sleep when you aren't sleepy, every place you're not allowed to scratch starts itching at once.
        - id: ch01-b06
          speaker: jim
          text: Say, who are you? Where are you? Dog my cats if I didn't hear something. I know what I'll do. I'll sit right here and listen till I hear it again.
        - id: ch01-b07
          speaker: huck
          text: So Jim sat on the ground between Tom and me. He leaned against a tree and stretched his legs out until one foot nearly touched mine. Then my nose began to itch so badly that tears came into my eyes. I still didn't dare scratch. Soon it itched inside, too. Then another place started. I couldn't see how I was going to sit still.
        - id: ch01-b08
          speaker: huck
          text: That misery lasted six or seven minutes, though it seemed much longer. By then I was itching in eleven places. I figured I couldn't bear another minute. I set my teeth and got ready to try. Just then Jim began breathing hard. A moment later he was snoring, and pretty soon I was comfortable again.
        - id: ch01-b09
          speaker: huck
          text: Tom made a tiny sound with his mouth to signal me, and we crawled away on our hands and knees. When we'd gone about ten feet, he whispered that we ought to tie Jim to the tree for fun.
        - id: ch01-b10
          speaker: huck
          text: No. He might wake up and make a racket. Then they'd find out I'm not inside.
        - id: ch01-b11
          speaker: huck
          text: Tom said he didn't have enough candles and wanted to slip into the kitchen for more. I told him not to risk it, because Jim might wake. But Tom was set on trying. We slid into the kitchen, took three candles, and left five cents on the table to pay for them.
        - id: ch01-b12
          speaker: huck
          text: I was sweating to get away, but Tom wouldn't leave yet. He crawled back toward Jim on his hands and knees because he just had to play another trick on him. I stayed where I was and waited for Tom to return. Everything around me was so still and lonely that it felt like he was gone a long time.
        - id: ch01-b13
          speaker: huck
          text: When Tom returned, we hurried along the path, went around the garden fence, and at last reached the steep hilltop on the other side of the house.
        - id: ch01-b14
          speaker: tom
          text: I slipped Jim's hat right off his head and hung it on the branch above him. He stirred a little, but he never woke up.
        - id: ch01-b15
          speaker: huck
          text: Later, Jim said witches had put him in a trance. He said they'd ridden him all over the state, brought him back under the trees, and hung up his hat to show who'd done it. The next time he told the story, the witches had taken him clear down to New Orleans.
        - id: ch01-b16
          speaker: huck
          text: Every time Jim told it, the trip grew longer and the tale grew bigger. Before long, he said the witches had ridden him all over the world. They'd nearly worn him to death, and his back was covered with saddle sores.
        - id: ch01-b17
          speaker: huck
          text: Jim was mighty proud of what had happened. He got so important that he hardly noticed the other slaves. They came from miles away to hear his story, and folks looked up to him more than any other slave in that country. Strangers stared at him with their mouths open, as if he were a wonder.
        - id: ch01-b18
          speaker: huck
          text: The slaves were always talking about witches beside the kitchen fire after dark. Whenever somebody acted like he knew everything about witches, Jim would come in and shut him down.
        - id: ch01-b19
          speaker: jim
          text: Hm! What do you know about witches?
        - id: ch01-b20
          speaker: huck
          text: After that, the other man had to be quiet and take a back seat. Jim kept Tom's five-cent piece on a string around his neck. He claimed the devil had given it to him with his own hands. The coin could cure anybody and call up witches whenever Jim wanted, if he said certain words to it. But Jim never told anyone what those words were.
        - id: ch01-b21
          speaker: huck
          text: Slaves came from all around and offered Jim anything they had just to see that coin. Nobody would touch it, because the devil's hands had been on it. Jim became so proud of seeing the devil and being ridden by witches that he was nearly ruined as a servant.
        - id: ch01-b22
          speaker: huck
          text: From the edge of the hilltop, Tom and I looked down at the village. Three or four lights were twinkling, maybe in houses where people were sick. The stars above us shone beautifully. Down past the village lay the river, a whole mile wide, grand and terribly still.
        - id: ch01-b23
          speaker: huck
          text: We went down the hill and found Jo Harper, Ben Rogers, and two or three more boys hiding in the old tanyard. We untied a skiff and rowed two and a half miles downriver to the big scar on the hillside. There we went ashore.
        - id: ch01-b24
          speaker: huck
          text: We pushed into a clump of bushes. Tom made everyone swear to keep the secret, then showed us a hole hidden deep in the brush. We lit our candles and crawled inside on our hands and knees.
        - id: ch01-b25
          speaker: huck
          text: After about two hundred yards, the cave opened up. Tom searched through the passages until he ducked under a wall. You'd never have noticed the hole there. We followed a narrow way into a room that felt damp, sweaty, and cold. Then we stopped.
        - id: ch01-b26
          speaker: tom
          text: Now we'll start a robber band called Tom Sawyer's Gang. Anybody who joins has to swear an oath and write his name in blood.
        - id: ch01-b27
          speaker: huck
          text: Everybody agreed. Tom pulled out a sheet of paper with the oath he'd written and read it aloud.
        - id: ch01-b28
          speaker: huck
          text: Each boy had to stand by the gang and never tell its secrets. If anyone hurt a member of the gang, whichever boy was ordered to kill that person and his family had to do it. He couldn't eat or sleep until it was done. Then he had to cut a cross into their chests, because that was the gang's sign.
        - id: ch01-b29
          speaker: huck
          text: Nobody outside the gang could use the cross. The first time, the gang would sue him. If he did it again, they would kill him. And if a gang member gave away the secrets, they would cut his throat, burn his body, scatter the ashes, and cross his name off the list in blood. The gang would curse that name, never speak it again, and forget it forever.
        - id: ch01-b30
          speakers: [ben, jo, boy_2, boy_3]
          ensemble: chorus
          text: That's a truly beautiful oath. Did you make it all up yourself, Tom?
        - id: ch01-b31
          speaker: tom
          text: Some of it. The rest comes from pirate books and robber books. Every proper gang uses it.
        - id: ch01-b32
          speaker: huck
          text: Some of the boys thought the oath ought to say that the gang would kill the families of boys who told its secrets. Tom liked that idea and wrote it in with a pencil.
        - id: ch01-b33
          speaker: ben
          text: What about Huck Finn? He hasn't got any family. What are we supposed to do with him?
        - id: ch01-b34
          speaker: tom
          text: Doesn't he have a father?
        - id: ch01-b35
          speaker: ben
          text: Sure, but nobody can find him now. He used to lie drunk with the hogs in the tanyard. Nobody around here has seen him for a year or more.
        - id: ch01-b36
          speaker: huck
          text: They talked it over and nearly voted me out. They said every boy needed a family, or at least somebody the gang could kill. Otherwise it wouldn't be fair to the rest. No one could think of an answer. They were all stumped and sat there quietly. I was nearly crying when an idea came to me.
        - id: ch01-b37
          speaker: huck
          text: You can have Miss Watson. You can kill her.
        - id: ch01-b38
          speakers: [ben, jo, boy_2, boy_3]
          ensemble: chorus
          text: She'll do. That's settled. Huck can join.
        - id: ch01-b39
          speaker: huck
          text: We all pricked our fingers with a pin to get blood for signing. I made my mark on the paper.
        - id: ch01-b40
          speaker: ben
          text: So what kind of business is this gang going into?
        - id: ch01-b41
          speaker: tom
          text: Nothing but robbery and murder.
        - id: ch01-b42
          speaker: ben
          text: Who do we rob? Houses? Cattle? Or what?
        - id: ch01-b43
          speaker: tom
          text: Oh, come on. Taking cattle and things like that isn't robbery. It's burglary. We're not burglars. There's no style in that. We're highwaymen. We wear masks, stop stagecoaches and carriages on the road, kill the people, and take their watches and money.
        - id: ch01-b44
          speaker: ben
          text: Do we have to kill the people every time?
        - id: ch01-b45
          speaker: tom
          text: Certainly. That's best. A few authorities disagree, but most say you should kill them. Except for the ones you bring back to this cave and keep until they're ransomed.
        - id: ch01-b46
          speaker: ben
          text: Ransomed? What's that mean?
        - id: ch01-b47
          speaker: tom
          text: I don't know. But robbers do it. I've read it in books, so naturally we have to do it too.
        - id: ch01-b48
          speaker: ben
          text: How can we do it when we don't even know what it means?
        - id: ch01-b49
          speaker: tom
          text: Because we have to, that's how. I told you it's in the books. Do you want us doing things differently and making a mess of everything?
        - id: ch01-b50
          speaker: ben
          text: That's easy for you to say, Tom Sawyer. How are we supposed to ransom these fellows when we don't know how? That's what I want to understand. What do you think it means?
        - id: ch01-b51
          speaker: tom
          text: I don't know. Maybe keeping them until they're ransomed means keeping them until they're dead.
        - id: ch01-b52
          speaker: ben
          text: Now that makes some sense. Why didn't you say so? We'll keep them till they're ransomed to death. They'll be plenty of trouble, though. They'll eat up everything and keep trying to escape.
        - id: ch01-b53
          speaker: tom
          text: Listen to you, Ben Rogers. How can they escape when a guard is standing there, ready to shoot them if they move an inch?
        - id: ch01-b54
          speaker: ben
          text: A guard! That's a fine idea. Somebody has to sit up all night without any sleep, just to watch them. It sounds foolish to me. Why can't we take a club and ransom them as soon as they arrive?
        - id: ch01-b55
          speaker: tom
          text: Because the books don't do it that way. That's why. Ben Rogers, are you going to do this properly or not? The people who wrote those books knew the right way. You don't think you can teach them anything, do you? No, sir. We'll ransom our prisoners the regular way.
        - id: ch01-b56
          speaker: ben
          text: Fine, I don't mind. I still say it's a foolish way. What about the women? Do we kill them too?
        - id: ch01-b57
          speaker: tom
          text: Ben Rogers, if I knew as little as you do, I wouldn't advertise it. Kill the women? No! Nobody ever read such a thing in a book. You bring them to the cave and act as polite as pie. After a while, they fall in love with you and don't ever want to go home.
        - id: ch01-b58
          speaker: ben
          text: If that's the rule, all right. I don't believe a word of it, though. Soon this cave will be packed with women and fellows waiting to be ransomed. There won't be any room left for the robbers. But go ahead. I've got nothing more to say.
        - id: ch01-b59
          speaker: huck
          text: Little Tommy Barnes had fallen asleep. When the boys woke him, he got scared and started crying.
        - id: ch01-b60
          speaker: tommy
          text: I want to go home to my ma. I don't want to be a robber anymore.
          emotion: fearful
        - id: ch01-b61
          speaker: huck
          text: The boys laughed at him and called him a crybaby. That made Tommy angry.
        - id: ch01-b62
          speaker: tommy
          text: Then I'll go straight home and tell every secret!
          emotion: angry
        - id: ch01-b63
          speaker: huck
          text: Tom gave him five cents to keep quiet. He said we'd all go home for now, then meet the next week to rob somebody and kill some people.
        - id: ch01-b64
          speaker: huck
          text: Ben said he could hardly ever get away except on Sundays, so he wanted the gang to begin the very next Sunday. But all the boys said it would be wicked to rob and kill people on a Sunday, and that settled the matter.
        - id: ch01-b65
          speaker: huck
          text: We agreed to meet again and choose a day as soon as we could. Then we elected Tom Sawyer as the gang's first captain and Jo Harper as second captain. After that, we started home.
        - id: ch01-b66
          speaker: huck
          text: I climbed up the shed and slipped through my window just before daybreak. My new clothes were smeared with grease and clay, and I was dog-tired.
