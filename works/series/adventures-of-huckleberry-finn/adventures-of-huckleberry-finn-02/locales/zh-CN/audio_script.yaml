audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom_sawyer:
      display_name: 汤姆·索亚
      tts:
        delivery: 自信大胆，满脑子冒险主意
        timbre: 明亮稚气
        pace: 轻快
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 朴实笃定，谈起神怪时格外郑重
        timbre: 浑厚温暖
        pace: 舒缓
        pitch: 中低
    ben_rogers:
      display_name: 本·罗杰斯
      tts:
        delivery: 爱刨根问底，直爽中带着顽皮
        timbre: 清亮有活力
        pace: 明快
        pitch: 中高
    jo_harper:
      display_name: 乔·哈珀
      tts:
        delivery: 好奇兴奋，乐意跟着伙伴冒险
        timbre: 年少清亮
        pace: 轻快
        pitch: 中高
    boy_1:
      display_name: 男孩甲
      tts:
        delivery: 兴奋起哄，带着孩子气的认真
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    boy_2:
      display_name: 男孩乙
      tts:
        delivery: 热心附和，语气直率
        timbre: 稚嫩明亮
        pace: 轻快
        pitch: 中高
    tommy_barnes:
      display_name: 小汤米·巴恩斯
      tts:
        delivery: 胆小稚气，受委屈时藏不住情绪
        timbre: 细小稚嫩
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我和汤姆踮着脚，顺着林间小路往寡妇家花园后头摸。树枝压得低，我们只好弯腰走，免得刮着脑袋。经过厨房时，我被树根绊了一下，弄出了声音。我们马上趴低身子，谁也不动。
        - id: ch01-b02
          speaker: narrator
          text: 沃森小姐那个大个子黑奴吉姆正坐在厨房门口。灯从他身后照过来，我们把他看得清清楚楚。他站起身，伸长脖子听了足足一分钟。
        - id: ch01-b03
          speaker: jim
          text: 谁在那儿？
        - id: ch01-b04
          speaker: narrator
          text: 吉姆又听了一会儿，踮着脚走下来，偏偏停在我俩中间，近得我们几乎伸手就能碰到他。好几分钟过去了，一点儿声音也没有，我们三个就这么挨在一块儿。
        - id: ch01-b05
          speaker: narrator
          text: 这时候，我的脚踝痒了，可我不敢挠。接着耳朵也痒，后来两肩中间的后背也痒。我简直觉得，不挠一下就会活活痒死。
        - id: ch01-b06
          speaker: narrator
          text: 这种事我后来见得多了。跟体面人在一起，参加葬礼，或者明明不困却要睡觉，只要所在的地方不便伸手去挠，身上成百上千处就会一齐痒起来。没过多久，吉姆开口了。
        - id: ch01-b07
          speaker: jim
          text: 喂，你是谁？你在哪儿？见鬼了，我明明听见有动静。好吧，我就坐在这里听，看它会不会再响。
        - id: ch01-b08
          speaker: narrator
          text: 吉姆坐到我和汤姆中间，靠着树，把双腿伸得老长，一只脚差点儿碰到我。我的鼻子又痒起来，痒得眼泪直流，可我还是不敢挠。后来鼻孔里面也痒，身子底下也痒。我真不知道自己还能怎么坐住。
        - id: ch01-b09
          speaker: narrator
          text: 这场罪不过受了六七分钟，我却觉得长得没边。这会儿，我身上整整有十一个地方在痒。我估计连一分钟也撑不住了，只能咬紧牙，准备拼命再忍。就在这时，吉姆的呼吸越来越重，随后打起呼噜。我总算又舒坦了。
        - id: ch01-b10
          speaker: narrator
          text: 汤姆用嘴轻轻弄出一点儿声音，给我递了个信号。我们便趴在地上，手脚并用地爬开。离开十英尺后，他凑过来，小声说想把吉姆绑在树上，逗个乐子。
        - id: ch01-b11
          speaker: huck
          text: 不行。他一醒就会闹起来，到时候她们准知道我没在屋里。
        - id: ch01-b12
          speaker: narrator
          text: 汤姆又嫌蜡烛带少了，非要溜进厨房再拿几根。我劝他别冒险，吉姆随时可能醒，可他就是想试试。我们摸进去拿了三根蜡烛，汤姆还在桌上留下五美分，当作付钱。
        - id: ch01-b13
          speaker: narrator
          text: 一出厨房，我急得满头冒汗，只盼赶紧离开。汤姆却不肯走。他又手脚并用地爬回吉姆身边，非要在他身上玩个花样。我独自在那里等。四周又静又冷清，时间仿佛一下子慢了下来。
        - id: ch01-b14
          speaker: narrator
          text: 汤姆总算回来，我们沿小路飞奔，绕过花园篱笆，跑到屋子另一边的山顶。他说自己摘下了吉姆的帽子，把它挂在吉姆头顶的树枝上。吉姆只是动了动，并没有醒。
        - id: ch01-b15
          speaker: narrator
          text: 后来，这件事到了吉姆嘴里，就成了巫婆给他施法，把他弄昏，骑着他跑遍全州，再送回树林。帽子挂在树上，是巫婆故意留下的记号。
        - id: ch01-b16
          speaker: narrator
          text: 下一次讲，巫婆已经骑着他去了新奥尔良。再往后，故事越变越大。最后他竟说，巫婆骑着他走遍全世界，差点儿把他累死，背上到处都是马鞍磨出来的疮。
        - id: ch01-b17
          speaker: narrator
          text: 吉姆为这番经历得意极了，渐渐连别的黑奴都不大理会。有人走上几英里，专程来听他讲故事。他成了那一带最受敬重的黑奴。外地来的黑奴还会张着嘴，从头到脚打量他，像在看什么奇人。
        - id: ch01-b18
          speaker: narrator
          text: 黑奴们夜里围着厨房炉火，总爱讲巫婆的事。谁要是装得什么都懂，正说得起劲，吉姆就会走进来问他一句。
        - id: ch01-b19
          speaker: jim
          text: 哼！你也懂巫婆？
        - id: ch01-b20
          speaker: narrator
          text: 那人马上就没话了，只得退到一边。吉姆一直用绳子把那枚五美分硬币挂在脖子上，说那是魔鬼亲手给他的护身符。只要对硬币念几句话，他就能替任何人治病，还能随时召来巫婆。不过，他从不肯说自己念的是什么。
        - id: ch01-b21
          speaker: narrator
          text: 四面八方的黑奴都来求看那枚硬币，不管身上有什么，都肯拿出来送给吉姆。可谁也不敢碰它，因为魔鬼的手碰过它。吉姆自从见过魔鬼，又被巫婆骑过，就变得神气十足。作为仆人，他差不多算是毁了。
        - id: ch01-b22
          speaker: narrator
          text: 我和汤姆站到山顶边缘，向下面的村子望去。三四点灯光还在闪，也许是谁家有人生病。我们头顶的星星亮得出奇。村边那条河足有一英里宽，静得怕人，又显得那么壮阔。
        - id: ch01-b23
          speaker: narrator
          text: 我们下了山，在废弃的鞣皮场找到乔·哈珀、本·罗杰斯和另外几个男孩。他们正躲在那里。大家解开一条小船，顺河划了两英里半，在山坡上那道大疤痕一样的地方靠岸。
        - id: ch01-b24
          speaker: narrator
          text: 我们走进灌木丛。汤姆先叫每个人发誓保守秘密，再拨开最密的枝叶，露出山上的一个洞口。大家点亮蜡烛，手脚并用地往里爬。爬过大约两百码，山洞忽然开阔了。
        - id: ch01-b25
          speaker: narrator
          text: 汤姆在岔道间摸索了一阵，低头钻过一道石壁。那里藏着一个洞口，不仔细看根本发现不了。我们穿过窄道，进到一间房似的地方。里面湿漉漉、冷飕飕的，连石壁都像在冒汗。汤姆让大家停下。
        - id: ch01-b26
          speaker: tom_sawyer
          text: 现在，咱们成立一帮强盗，就叫“汤姆·索亚帮”。谁想入伙，都得发誓，还要用血写下自己的名字。
        - id: ch01-b27
          speaker: narrator
          text: 大家都答应了。汤姆掏出自己写好的誓词，念给我们听。每个男孩必须效忠强盗帮，永远不准泄密。谁敢伤害帮里的男孩，帮里派出的人就得杀掉他和他的全家。
        - id: ch01-b28
          speaker: narrator
          text: 在事情办完以前，那个人既不能吃饭，也不能睡觉。杀掉仇人以后，还得在他们胸口砍个十字，那是强盗帮专用的记号。外人用了就要挨告，再犯一次就得送命。
        - id: ch01-b29
          speaker: narrator
          text: 帮里要是出了叛徒，就割断他的喉咙，烧掉尸体，把骨灰四处撒开。他的名字要用血从名单上涂掉，谁也不许再提，只能叫它受诅咒，永远被人忘记。
        - id: ch01-b30
          speakers: [ben_rogers, jo_harper, boy_1, boy_2]
          ensemble: chorus
          text: 这誓词真漂亮！是你自己想出来的吗？
        - id: ch01-b31
          speaker: tom_sawyer
          text: 有一部分是。其余是我从海盗书和强盗书里学来的。凡是上等的强盗帮，都用这样的誓词。
        - id: ch01-b32
          speaker: narrator
          text: 有人提议，泄密的男孩不光自己该死，他的全家也该杀。汤姆觉得很好，拿铅笔把这一条添了进去。可本·罗杰斯马上发现了一个难题。
        - id: ch01-b33
          speaker: ben_rogers
          text: 哈克·费恩没有家人。那他怎么办？
        - id: ch01-b34
          speaker: tom_sawyer
          text: 他不是还有个爸爸吗？
        - id: ch01-b35
          speaker: ben_rogers
          text: 爸爸是有，可现在谁也找不到。从前他老醉倒在鞣皮场，跟猪睡在一起，但这一年多都没在附近露面了。
        - id: ch01-b36
          speaker: narrator
          text: 大家商量起来，眼看就要把我赶出去。他们说，每个男孩都必须有家人，或者至少有个人可以让大家杀，不然对别人不公平。谁也想不出办法，所有人都坐着不出声。我差点儿哭了，却忽然有了主意。
        - id: ch01-b37
          speaker: huck
          text: 我把沃森小姐交给你们。你们可以杀她。
        - id: ch01-b38
          speakers: [ben_rogers, jo_harper, boy_1, boy_2]
          ensemble: chorus
          text: 她行！那就没问题了。哈克可以入伙。
        - id: ch01-b39
          speaker: narrator
          text: 大家拿别针刺破手指，用血签下名字。我也在纸上画了自己的记号。
        - id: ch01-b40
          speaker: ben_rogers
          text: 好了，咱们这个帮到底做什么买卖？
        - id: ch01-b41
          speaker: tom_sawyer
          text: 就做两样，抢劫和杀人。
        - id: ch01-b42
          speaker: ben_rogers
          text: 那咱们抢什么？房子，牲口，还是别的？
        - id: ch01-b43
          speaker: tom_sawyer
          text: 胡说！偷牲口不叫抢劫，那叫入室行窃。咱们不是小偷，那一点儿派头都没有。咱们是拦路强盗。咱们蒙上脸，在大路上截住驿车和马车，杀掉里面的人，再拿走手表和钱。
        - id: ch01-b44
          speaker: ben_rogers
          text: 每回都一定要杀人吗？
        - id: ch01-b45
          speaker: tom_sawyer
          text: 当然，通常还是杀掉最好。有些权威不同意，可大多数都这么认为。只有几个人可以留下，把他们带到山洞里，一直关到他们交出赎金。
        - id: ch01-b46
          speaker: ben_rogers
          text: 交出赎金是什么意思？
        - id: ch01-b47
          speaker: tom_sawyer
          text: 我不知道。可书里就是这么干的，我亲眼看见过。所以咱们当然也得这么干。
        - id: ch01-b48
          speaker: ben_rogers
          text: 可咱们连它是什么意思都不知道，怎么干？
        - id: ch01-b49
          speaker: tom_sawyer
          text: 管它是什么意思，咱们非干不可！书里明明就是这么写的。难道你想不照书来，把事情弄得一团糟？
        - id: ch01-b50
          speaker: ben_rogers
          text: 说得倒轻巧，汤姆·索亚。咱们不知道该做什么，那些人怎么交出赎金？我问的就是这个。你觉得它到底是什么意思？
        - id: ch01-b51
          speaker: tom_sawyer
          text: 我也不知道。也许把人关到交出赎金，就是一直关到他们死。
        - id: ch01-b52
          speaker: ben_rogers
          text: 这还像句话，早这样说不就好了？咱们就把他们关着，等赎金等到死。不过这帮人一定麻烦透了。他们会吃光东西，还总想逃跑。
        - id: ch01-b53
          speaker: tom_sawyer
          text: 你怎么会这么想？有人守着，他们怎么跑？只要敢动一下，看守的人就开枪把他们打倒。
        - id: ch01-b54
          speaker: ben_rogers
          text: 还要看守？这可真妙。为了盯着他们，还得有人整夜坐着，一点儿觉也不能睡。我看这太蠢了。他们一来，为什么不拿根棍子马上把他们赎掉？
        - id: ch01-b55
          speaker: tom_sawyer
          text: 因为书里不是这么写的。就是这个道理。本·罗杰斯，你到底想不想照规矩办？写书的人肯定知道什么才是正确做法。难道你还能教他们？你差得远呢。不行，先生，咱们就按规矩让人交赎金。
        - id: ch01-b56
          speaker: ben_rogers
          text: 好吧，我不反对。可我还是觉得这办法蠢。对了，女人也要杀吗？
        - id: ch01-b57
          speaker: tom_sawyer
          text: 本·罗杰斯，我要像你这么没见识，才不会说出来。杀女人？当然不杀。书里哪有这种事？要把她们带回山洞，对她们客气极了。过些日子，她们自然会爱上你，再也不想回家。
        - id: ch01-b58
          speaker: ben_rogers
          text: 要是这样，那我同意，不过我不信这一套。很快山洞里就会塞满女人，还有一大群等着交赎金的人，最后连强盗都没地方待。算了，你们继续，我不说了。
        - id: ch01-b59
          speaker: narrator
          text: 小汤米·巴恩斯已经睡着了。大家把他弄醒，他吓得哭了起来。
        - id: ch01-b60
          speaker: tommy_barnes
          text: 我要回家找妈妈。我不想再做强盗了。
          emotion: fearful
        - id: ch01-b61
          speaker: narrator
          text: 大家都笑他，叫他爱哭鬼。汤米气坏了，说要立刻去把所有秘密告诉别人。汤姆只好给他五美分，让他别说出去，又宣布大家先回家，下星期再见面，到时候去抢一个人，再杀几个人。
        - id: ch01-b62
          speaker: narrator
          text: 本·罗杰斯说，自己平日很难溜出来，只有星期天方便，最好下个星期天就开始。可男孩们一致认为，星期天做这种事太邪恶，这个提议就作罢了。
        - id: ch01-b63
          speaker: narrator
          text: 大家约好尽快再聚，另外定个日子。随后，我们选汤姆·索亚当大头领，乔·哈珀当二头领，这才各自回家。
        - id: ch01-b64
          speaker: narrator
          text: 天快亮的时候，我爬上棚顶，从窗口钻回屋里。新衣服上尽是油污和泥巴，我浑身上下都累得快散架了。
