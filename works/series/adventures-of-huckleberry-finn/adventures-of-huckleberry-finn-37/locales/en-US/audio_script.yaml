  chapters:
    - id: ch01
      title: CHAPTER XXXVII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: That settled it. Tom and I went to the rubbish pile out back, where they kept old boots, rags, broken bottles, worn-out tinware, and every other kind of junk. We scratched around until we found an old tin washpan. It was full of holes, but we plugged them as well as we could. That would be our pie pan. Then we carried it down to the cellar, stole enough flour to fill it, and headed in for breakfast.
        - id: ch01-b02
          speaker: huck
          text: Along the way, we picked up two shingle nails. Tom said a prisoner could use them to scratch his name and his sorrows on the dungeon walls. We slipped one into Aunt Sally's apron pocket and tucked the other into Uncle Silas's hatband. The children had said their parents were visiting Jim's cabin that morning, so the nails would get delivered. At breakfast, Tom dropped the pewter spoon into Uncle Silas's coat pocket. Aunt Sally had not come in yet, and we waited for her.
        - id: ch01-b03
          speaker: huck
          text: When she arrived, she was hot, red-faced, and cross. She could hardly wait through the blessing. Then she poured coffee with one hand and cracked whichever child was nearest with her thimble using the other.
        - id: ch01-b04
          speaker: aunt_sally
          text: I've searched everywhere, and I cannot imagine what happened to your other shirt.
          emotion: angry
        - id: ch01-b05
          speaker: huck
          text: My heart dropped clear down among my insides. A hard piece of cornbread went after it, met a cough on the way, and shot across the table. It hit one child in the eye. He curled up like a fishing worm and let out a war whoop. Tom went blue around the gills. For a quarter of a minute, everything was in an uproar. I would have sold myself for half price if anyone had offered. Then things settled down. It was only the sudden surprise that had knocked us cold.
        - id: ch01-b06
          speaker: uncle_silas
          text: That is mighty strange. I cannot understand it. I know perfectly well that I took the shirt off. I can prove it—
        - id: ch01-b07
          speaker: aunt_sally
          text: Of course you took it off. You only have one on now! Just listen to the man. I remember better than you do, Silas. I saw that shirt on the clothesline yesterday. Now it's gone. You'll have to wear a red flannel one until I can make another. That'll be the third shirt I've made you in two years. Keeping you in shirts is a full-time job, and I cannot figure out what you do with them. At your age, you'd think you could take care of your clothes.
          emotion: angry
        - id: ch01-b08
          speaker: uncle_silas
          text: I know, Sally, and I do my best. But it cannot be entirely my fault. I never see the shirts or handle them unless I'm wearing them. And I don't believe I've ever lost one while it was on me.
        - id: ch01-b09
          speaker: aunt_sally
          text: Well, if you haven't, it isn't for lack of trying. And the shirt isn't the only thing missing. A spoon is gone too. We had ten, and now we have nine. Maybe the calf took the shirt, but I know it didn't take that spoon.
        - id: ch01-b10
          speaker: uncle_silas
          text: What else is missing, Sally?
        - id: ch01-b11
          speaker: aunt_sally
          text: Six candles, that's what. The rats may have taken those. I'm surprised they haven't carried off the whole house while you keep promising to plug their holes and never do it. If those rats had any sense, they'd sleep in your hair. You'd never notice. But you cannot blame the spoon on them.
          emotion: angry
        - id: ch01-b12
          speaker: uncle_silas
          text: You're right, Sally. I've been neglectful. I promise I won't let tomorrow pass without plugging those holes.
        - id: ch01-b13
          speaker: aunt_sally
          text: Oh, don't rush yourself. Next year will be soon enough. Matilda Angelina Araminta Phelps!
          emotion: angry
        - id: ch01-b14
          speaker: huck
          text: Her thimble came down with a whack, and the child yanked her fingers out of the sugar bowl in a hurry. Just then Lize stepped into the passage.
        - id: ch01-b15
          speaker: lize
          text: Miss Sally, one of the sheets is missing.
        - id: ch01-b16
          speaker: aunt_sally
          text: A sheet? Good land!
          emotion: surprised
        - id: ch01-b17
          speaker: uncle_silas
          text: I'll plug those holes today.
        - id: ch01-b18
          speaker: aunt_sally
          text: Oh, hush! Do you think rats carried off a sheet? Lize, where did it go?
          emotion: angry
        - id: ch01-b19
          speaker: lize
          text: I truly don't know, Miss Sally. It was on the clothesline yesterday, but it isn't there now.
        - id: ch01-b20
          speaker: aunt_sally
          text: The world must be ending. I never saw anything like this in all my born days. We've lost a shirt, a sheet, a spoon, and six candles—
        - id: ch01-b21
          speaker: young_woman
          text: Miss Sally, a brass candlestick is missing too.
        - id: ch01-b22
          speaker: aunt_sally
          text: Get out of here, or I'll come after you with a skillet!
          emotion: angry
        - id: ch01-b23
          speaker: huck
          text: Aunt Sally was boiling now. I watched for a chance to sneak out and hide in the woods until the storm passed. She kept her uprising going all by herself while everyone else stayed mighty meek and quiet. At last, Uncle Silas looked foolish, reached into his coat pocket, and pulled out the spoon. Aunt Sally stopped dead with her mouth open and both hands raised. As for me, I wished I were in Jerusalem, or anywhere else. I didn't have long to wish, because she started in on him at once.
        - id: ch01-b24
          speaker: aunt_sally
          text: I knew it! You had that spoon in your pocket the whole time. You've probably got the other things in there too. How did it get there?
        - id: ch01-b25
          speaker: uncle_silas
          text: I honestly don't know, Sally. I'd tell you if I did. Before breakfast, I was studying my sermon from Acts Seventeen. Maybe I meant to put my Testament in my pocket and picked up the spoon without noticing. My Testament isn't here, so that must be it. But I'll go look. If the Testament is still where I left it, then I'll know I set it down and picked up the spoon, and—
        - id: ch01-b26
          speaker: aunt_sally
          text: Good land, give me some peace! Every one of you, go away. Don't come near me again until I've got my wits back.
          emotion: angry
        - id: ch01-b27
          speaker: huck
          text: I would have heard that order if she'd whispered it to herself, and I would have obeyed even if I'd been dead. As we crossed the sitting room, Uncle Silas picked up his hat. The shingle nail fell onto the floor. He simply placed it on the mantel and walked out without a word. Tom saw him do it and remembered the spoon.
        - id: ch01-b28
          speaker: tom
          text: There's no point sending anything with him again. He isn't reliable. Still, he helped us with the spoon without knowing it. Let's help him without his knowing it and plug those rat holes.
        - id: ch01-b29
          speaker: huck
          text: The cellar had a noble collection of rat holes. It took us a whole hour, but we closed every one tight and shipshape. Then we heard footsteps on the stairs. We blew out our light and hid. Uncle Silas came down with a candle in one hand and a bundle of things for plugging holes in the other. He looked as absent-minded as the year before last. He wandered around as if he had forgotten why he'd come.
        - id: ch01-b30
          speaker: huck
          text: He wandered from one rat hole to the next until he'd checked them all. Then he stood there for five minutes, picking drops of tallow from his candle and thinking. At last, he turned toward the stairs, slow and dreamy.
        - id: ch01-b31
          speaker: uncle_silas
          text: For the life of me, I cannot remember when I plugged them. I could show Sally now that the rats weren't my fault. Oh, never mind. I reckon it wouldn't do any good.
        - id: ch01-b32
          speaker: huck
          text: He went upstairs mumbling, and we left the cellar. He was a mighty nice old man. He always was.
        - id: ch01-b33
          speaker: huck
          text: Tom was troubled about finding another spoon, but he said we had to have one. After thinking it through, he explained his plan. We waited beside the spoon basket until Aunt Sally came along. Then Tom laid out the spoons and began counting while I slipped one up my sleeve.
        - id: ch01-b34
          speaker: tom
          text: Aunt Sally, there are still only nine spoons here.
        - id: ch01-b35
          speaker: aunt_sally
          text: Go play and stop pestering me. I counted them myself, and I know you're wrong.
        - id: ch01-b36
          speaker: tom
          text: But I counted twice, Aunty. I still get nine.
        - id: ch01-b37
          speaker: huck
          text: She had no patience left, but of course she came over to count. Anybody would have.
        - id: ch01-b38
          speaker: aunt_sally
          text: Mercy, there really are only nine! What in the world happened now? Plague take these spoons. I'll count again.
          emotion: surprised
        - id: ch01-b39
          speaker: huck
          text: I slid the hidden spoon back. When she finished the next count, there were ten.
        - id: ch01-b40
          speaker: aunt_sally
          text: Confound this troublesome rubbish. Now there are ten!
          emotion: angry
        - id: ch01-b41
          speaker: tom
          text: I don't think there are ten, Aunty.
        - id: ch01-b42
          speaker: aunt_sally
          text: You numskull! Didn't you watch me count them?
          emotion: angry
        - id: ch01-b43
          speaker: tom
          text: I watched you count them, but I still don't think there are ten.
        - id: ch01-b44
          speaker: aunt_sally
          text: Then I'll count them once more.
        - id: ch01-b45
          speaker: huck
          text: I stole one again, and this time she found nine. That sent her into a tearing rage. She trembled all over and counted again and again. Soon she was so mixed up that she sometimes counted the basket as one of the spoons. Three counts came out right and three came out wrong. Finally, she snatched up the whole basket and slammed it across the house. It struck the cat and sent it flying head over heels. Then she ordered us out and said she'd skin us if we came bothering her again before dinner.
        - id: ch01-b46
          speaker: huck
          text: We had our extra spoon. While she was driving us away, we dropped it into her apron pocket. Before noon, Jim received it along with her shingle nail. We were pleased with the whole business.
        - id: ch01-b47
          speaker: tom
          text: That plan was worth twice the trouble. Now she couldn't count those spoons the same way twice to save her life. Even if she got the right number, she wouldn't trust it. After she counts her head nearly off for three days, she'll quit and threaten anyone who asks her to count again.
        - id: ch01-b48
          speaker: huck
          text: That night, we put the missing sheet back on the line and stole another from her closet. For the next couple of days, we kept returning one sheet and taking another. Every time the count might have settled, we mixed it up again. Soon Aunt Sally had no idea how many she owned. She didn't care anymore, either. She wasn't going to wear out the rest of her soul worrying over sheets. She would rather die than count them again.
        - id: ch01-b49
          speaker: huck
          text: So the shirt, sheet, spoon, and candles were all taken care of, thanks to the calf, the rats, and the confused counting. The candlestick didn't matter. That trouble would blow over after a while.
        - id: ch01-b50
          speaker: huck
          text: The pie was different. That pie gave us no end of trouble. We worked on it far out in the woods, away from the house. We finally baked one that satisfied us, but we couldn't finish the job in a single day. Before we got through, we'd used three washpans full of flour. We got burned in one place after another, and the smoke nearly put our eyes out. The trouble was that we only wanted an empty crust. We tried every way we knew to prop it up, but the sides kept falling inward before it could bake firm.
        - id: ch01-b51
          speaker: huck
          text: At last, we figured out the answer. We would bake the rope ladder right inside the pie. On the second night, we stayed with Jim and tore the sheet into narrow strips. We twisted them together until, long before daylight, we had a lovely rope strong enough to hang a person. We pretended it had taken nine months to make.
        - id: ch01-b52
          speaker: huck
          text: That morning, we carried the rope into the woods, but it wouldn't fit in the pie. A whole sheet had made enough rope for forty pies, with plenty left for soup, sausage, or anything else you might want. We could have served a full dinner. But we only needed enough for one pie, so we threw the rest away.
        - id: ch01-b53
          speaker: huck
          text: We never baked a pie in the tin washpan because we were afraid the solder would melt. Uncle Silas owned a grand brass warming pan with a long wooden handle. He thought a great deal of it because it had belonged to one of his ancestors. The story was that it came from England with William the Conqueror in the Mayflower, or maybe one of those other early ships. It was hidden in the attic with a collection of old pots and other family treasures. The things weren't valuable because they were worth anything. They were valuable because they were relics, you see.
        - id: ch01-b54
          speaker: huck
          text: We secretly carried the warming pan to the woods. It failed us on the first pies because we didn't know what we were doing, but it came up smiling on the last one. We lined it with dough and set it in the coals. Then we packed in the rag rope, covered it with a roof of dough, closed the lid, and piled hot embers on top.
        - id: ch01-b55
          speaker: huck
          text: The long wooden handle let us stand five feet from the coals, cool and comfortable. In fifteen minutes, the pan turned out a pie that was a satisfaction to look at. Eating it would be another matter. A person would want to bring along a couple of kegs of toothpicks. If swallowing that rag rope ladder didn't make him settle down and pay attention to his meal, then I don't know what I'm talking about. It would lay enough stomachache into him to last until the next time, too.
        - id: ch01-b56
          speaker: huck
          text: Nat wasn't looking when we slipped the witch pie into Jim's food pan. We also laid three tin plates flat on the bottom and covered them with the food. That way, Jim received every part of our delivery safely. As soon as he had the cabin to himself, he broke into the pie, pulled out the rope ladder, and hid it deep inside his straw mattress. Then he scratched some marks on one of the tin plates and threw it out through the window hole.
