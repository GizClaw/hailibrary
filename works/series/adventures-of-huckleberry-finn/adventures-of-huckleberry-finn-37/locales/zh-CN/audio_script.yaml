audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    aunt_sally:
      display_name: 萨莉姨妈
      tts:
        delivery: 爽直泼辣，生气时连珠炮一般咄咄逼人
        timbre: 明亮而有穿透力的成年女声
        pace: 偏快
        pitch: 中高
    uncle_silas:
      display_name: 赛拉斯姨父
      tts:
        delivery: 温厚迟钝，常常心不在焉，解释时认真又啰嗦
        timbre: 柔和苍老
        pace: 缓慢
        pitch: 中低
    lize:
      display_name: 莉兹
      tts:
        delivery: 谨慎恭顺，说话直白
        timbre: 朴实的成年女声
        pace: 稍慢
        pitch: 中
    young_maid:
      display_name: 年轻女佣
      tts:
        delivery: 小心翼翼，禀报事情时简短急促
        timbre: 年轻清亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三十七章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 事情都安排好了，我们便去后院翻破烂堆。那里扔满旧靴子、破布、碎瓶片和用坏的锡器，什么破烂都有。我们找出一只破锡脸盆，把窟窿尽量堵上，打算拿它烤馅饼。接着又把脸盆带进地窖，偷了满满一盆面粉，这才去吃早饭。
        - id: ch01-b02
          speaker: huck
          text: 路上，我们捡到两根钉木瓦的钉子。汤姆说，囚犯正好拿它们在牢墙上刻姓名和悲苦。萨莉姨妈的围裙挂在椅背上，我们往口袋里塞了一根。赛拉斯姨父的帽子放在五斗柜上，另一根就插进帽箍。孩子们说，他们的爹妈今早会去吉姆那里，所以这些东西都能捎过去。到了饭桌边，汤姆又把白镴勺丢进姨父的外套口袋。姨妈还没来，我们只好等着。
        - id: ch01-b03
          speaker: huck
          text: 萨莉姨妈一进来，脸又热又红，正在气头上，连饭前祷告都快等不及了。她一手哗哗倒咖啡，一手拿顶针敲身边孩子的脑袋，嘴里也没停。
        - id: ch01-b04
          speaker: aunt_sally
          text: 我上上下下全找遍了。真是活见鬼，你那另一件衬衫到底跑哪儿去了？
          emotion: angry
        - id: ch01-b05
          speaker: huck
          text: 我的心猛地掉进五脏六腑。一块硬玉米饼皮也滑进喉咙，半路撞上咳嗽，嗖地飞过桌面，正打中一个孩子的眼睛。那孩子缩得像条钓鱼虫，嚎声却像打仗。汤姆的脸也隐隐发青。屋里乱了十五秒左右。那时候，要是有人肯出价，半价我就把自己卖了。幸好大家很快缓过来，刚才只是那一下来得太突然，把我们都吓凉了。
        - id: ch01-b06
          speaker: uncle_silas
          text: 这可真怪，我怎么也想不明白。我明明记得把衬衫脱下来了，因为——
        - id: ch01-b07
          speaker: aunt_sally
          text: 因为你身上只穿着一件呀！听听这人说的什么话。我当然知道你脱了，而且我记得比你那胡思乱想的脑袋牢靠。昨天它还在晾衣绳上，我亲眼看见的。如今它没了，事情就是这么简单。
          emotion: angry
        - id: ch01-b08
          speaker: aunt_sally
          text: 等我有空再给你做一件，这几天你先穿红法兰绒衬衫。两年里这已经是第三件了。为了叫你总有衬衫穿，我得整天忙个不停。可你究竟怎么把它们一件件弄没的，我就是不明白。你都这么大岁数了，也该学会爱惜一点了吧。
          emotion: angry
        - id: ch01-b09
          speaker: uncle_silas
          text: 我知道，萨莉，我也一直尽力。这不能全怪我呀。衬衫不穿在身上的时候，我既看不见，也碰不着。我敢说，自己从来没把一件正穿着的衬衫弄丢过。
        - id: ch01-b10
          speaker: aunt_sally
          text: 要真没丢过，自然不是你的错，赛拉斯。只要办得到，我看你准会丢。再说，不见的还不只是衬衫。原来有十把勺子，如今只剩九把。衬衫大概让牛犊吃了，可牛犊绝不会偷勺子，这一点错不了。
          emotion: angry
        - id: ch01-b11
          speaker: uncle_silas
          text: 萨莉，难道还有别的东西不见了？
        - id: ch01-b12
          speaker: aunt_sally
          text: 还有六支蜡烛！蜡烛可能让耗子叼走了，我看就是它们干的。你总说要堵耗子洞，却一直不动手。它们没把整座屋子搬走，我倒觉得奇怪。要不是耗子太蠢，早钻进你头发里睡觉了，反正你也发现不了。可那把勺子绝不能赖给耗子，这我清楚。
          emotion: angry
        - id: ch01-b13
          speaker: uncle_silas
          text: 好吧，萨莉，是我不对。我承认自己一直疏忽了。不过明天以前，我一定把那些洞全堵上。
        - id: ch01-b14
          speaker: aunt_sally
          text: 可别着急，明年再堵也来得及。玛蒂尔达·安杰莉娜·阿拉明塔·菲尔普斯！
          emotion: angry
        - id: ch01-b15
          speaker: huck
          text: 啪的一声，顶针敲下去，那个孩子立刻把手从糖罐里抽了出来。就在这时，莉兹走到过道上禀报。
        - id: ch01-b16
          speaker: lize
          text: 太太，有一条床单不见了。
        - id: ch01-b17
          speaker: aunt_sally
          text: 一条床单也不见了！我的老天！
          emotion: surprised
        - id: ch01-b18
          speaker: uncle_silas
          text: 那我今天就去堵耗子洞。
        - id: ch01-b19
          speaker: huck
          text: 赛拉斯姨父说得十分难过，可萨莉姨妈听了更火大。
        - id: ch01-b20
          speaker: aunt_sally
          text: 你快闭嘴吧！难道床单也是耗子叼走的？莉兹，那条床单去哪儿了？
          emotion: angry
        - id: ch01-b21
          speaker: lize
          text: 对天发誓，我一点也不知道，萨莉太太。昨天它还挂在晾衣绳上，如今已经没了，那儿再也找不着啦。
        - id: ch01-b22
          speaker: aunt_sally
          text: 我看这世界真要完蛋了。我活到今天，从没见过这么离谱的事。一件衬衫，一条床单，一把勺子，还有六支蜡——
          emotion: angry
        - id: ch01-b23
          speaker: young_maid
          text: 太太，一只黄铜烛台不见了。
        - id: ch01-b24
          speaker: aunt_sally
          text: 滚出去，你这个贱丫头！不然我拿煎锅揍你！
          emotion: angry
        - id: ch01-b25
          speaker: huck
          text: 这下她简直烧开了。我暗暗等着机会，打算溜进树林，等风暴平息再回来。她一个人闹起了一场造反，其余人全都温顺安静，谁也不敢出声。最后，赛拉斯姨父窘窘地从口袋里摸出那把勺子。萨莉姨妈张着嘴，举着两只手，一下愣住了。我真恨不得自己正在耶路撒冷，或者随便什么别的地方。可她马上又开了口。
        - id: ch01-b26
          speaker: aunt_sally
          text: 果然跟我料的一样。原来你一直把勺子揣在口袋里。说不定别的东西也全在那里。它怎么进去的？
          emotion: angry
        - id: ch01-b27
          speaker: uncle_silas
          text: 我实在不知道，萨莉，不然一定会告诉你。早饭前，我正在琢磨《使徒行传》第十七章。我想自己准是没留神，把勺子放进口袋了，本来要放的是《新约》。一定是这样，因为《新约》没在里面。
        - id: ch01-b28
          speaker: uncle_silas
          text: 不过我可以去看看。要是《新约》还在原先的地方，就证明我没有把它装进口袋。那也说明我先放下《新约》，又拿起勺子，然后——
        - id: ch01-b29
          speaker: aunt_sally
          text: 我的老天，让人清静一会儿吧！你们全家老小统统走开。等我心气平了以前，谁也别再靠近我。
          emotion: angry
        - id: ch01-b30
          speaker: huck
          text: 这话哪怕她只在心里说，我也听得见，更别说她还喊出了声。就算我已经死了，也会爬起来照办。我们穿过起居室时，姨父拿起帽子，那根木瓦钉子掉在地板上。他只是捡起来，搁到壁炉架上，什么也没说，便走了。汤姆看见这一幕，又想起勺子的事。
        - id: ch01-b31
          speaker: tom
          text: 往后不能再托他捎东西了，他靠不住。不过勺子那件事，他自己不知道，却帮了咱们一个忙。那咱们也背着他帮一回，把耗子洞堵上。
        - id: ch01-b32
          speaker: huck
          text: 地窖里的耗子洞多得很。我们忙了整整一个钟头，最后全堵得又严又牢，做得十分齐整。楼梯上忽然响起脚步声，我们连忙吹灭灯，藏了起来。姨父一手拿蜡烛，一手抱着一捆东西走下来，神情恍惚得像还活在前年。
        - id: ch01-b33
          speaker: huck
          text: 他慢吞吞地挨个查看耗子洞，一个也没落下。看完以后，又站了足足五分钟，一边抠蜡烛上流下来的油，一边出神。最后，他迷迷糊糊地转向楼梯。
        - id: ch01-b34
          speaker: uncle_silas
          text: 真要了我的命，我怎么也想不起是什么时候堵的。现在我本来可以让她看看，耗子的事不能怪我。不过算了，随它去吧。说了大概也没有用。
        - id: ch01-b35
          speaker: huck
          text: 他一路嘟囔着上了楼，我们随后也从藏身处出来，离开了地窖。那老头儿真是个大好人。一直都是。
        - id: ch01-b36
          speaker: huck
          text: 汤姆为了再弄一把勺子，很是发愁。不过他说非有一把不可，便埋头盘算。等想好办法，我们就守在勺篮子旁边。萨莉姨妈一过来，汤姆便数起勺子，把它们一把把放到旁边。我趁机把一把滑进袖子里。
        - id: ch01-b37
          speaker: tom
          text: 咦，萨莉姨妈，怎么还是只有九把勺子？
        - id: ch01-b38
          speaker: aunt_sally
          text: 一边玩去，别来烦我。我亲自数过，心里有数。
        - id: ch01-b39
          speaker: tom
          text: 可我已经数了两遍，姨妈，怎么算都只有九把。
        - id: ch01-b40
          speaker: huck
          text: 她满脸不耐烦，可自然还是过来数了。换谁都会来数。
        - id: ch01-b41
          speaker: aunt_sally
          text: 老天作证，真的只有九把！这到底是怎么回事？这些该死的东西，我再数一遍。
          emotion: surprised
        - id: ch01-b42
          speaker: huck
          text: 我悄悄把袖子里的勺子放了回去。她数完以后，发现数目又变了。
        - id: ch01-b43
          speaker: aunt_sally
          text: 这些烦人的破烂真是活见鬼了！现在又有十把！
          emotion: angry
        - id: ch01-b44
          speaker: huck
          text: 她又恼火又迷惑，汤姆还偏要接着说。
        - id: ch01-b45
          speaker: tom
          text: 可是姨妈，我看不像有十把。
        - id: ch01-b46
          speaker: aunt_sally
          text: 你这个木头脑袋，没看见我亲手数了吗？
          emotion: angry
        - id: ch01-b47
          speaker: tom
          text: 我看见了，可是——
        - id: ch01-b48
          speaker: aunt_sally
          text: 好，我再数一遍！
          emotion: angry
        - id: ch01-b49
          speaker: huck
          text: 我又偷走一把，结果和先前一样，只剩九把。这下姨妈真发了疯，气得浑身直抖。她数了又数，脑子终于乱成一团，有时竟把篮子也算成一把勺子。三次数对，三次数错。后来，她抓起篮子狠狠扔过屋子，正好把猫砸得横飞出去。
        - id: ch01-b50
          speaker: huck
          text: 她叫我们滚，还说午饭以前再敢来烦她，就剥了我们的皮。趁她下逐客令，我们把那把多出来的勺子塞进她的围裙口袋。不到中午，吉姆顺利拿到了勺子，也拿到了里面的木瓦钉子。
        - id: ch01-b51
          speaker: huck
          text: 我们对这一手满意极了。汤姆说，这个办法就算多花一倍力气也值得。如今哪怕拿萨莉姨妈的命打赌，她也不可能连续两次数出一样的数。就算偶然数对，她自己也不会相信。接下来三天，她会不停地数勺子，数得脑袋都快掉下来。到最后，谁再叫她数，她准恨不得把谁杀了。
        - id: ch01-b52
          speaker: huck
          text: 当天夜里，我们把床单放回晾衣绳，又从壁橱里偷出一条。接下来两天，我们不停地把床单放回去，再偷走。最后姨妈根本弄不清自己有多少条，也不在乎了。她不肯为了这件事把后半辈子的心力全骂光。就算拿命相逼，她也不再数，宁可先死。
        - id: ch01-b53
          speaker: huck
          text: 这样一来，靠着牛犊、耗子和乱七八糟的数数，衬衫、床单、勺子和蜡烛就全不成问题了。烛台也没关系，过些时候风头自然会过去。
        - id: ch01-b54
          speaker: huck
          text: 可那个馅饼才真是苦差事，我们为了它吃尽了苦头。我们躲进树林深处去烤，忙了一天也没有做成。最后总算烤出一个像样的，可前后糟蹋了整整三脸盆面粉。我们身上这里烫一块，那里烫一块，烟也差点把眼睛熏瞎。
        - id: ch01-b55
          speaker: huck
          text: 我们只想烤出一张饼皮，可怎么也撑不好，每回都要塌。最后，我们当然还是想到了正确办法，那就是把绳梯也放进馅饼里一起烤。第二天夜里，我们钻进吉姆的小屋，撕碎床单，把布条搓成绳子。天还远没亮，一条漂亮的绳子便做好了，结实得足够拿来吊人。我们假装它花了九个月才编成。
        - id: ch01-b56
          speaker: huck
          text: 上午，我们把绳子带进树林，却怎么也塞不进馅饼。这可是整张床单搓成的。要是我们愿意，足够装满四十个馅饼，还能剩下不少，拿去做汤、灌香肠，或者做成你爱吃的任何东西。光靠它，我们就能摆出一整桌饭菜。
        - id: ch01-b57
          speaker: huck
          text: 不过我们只要馅饼用的那一截，其余全扔了。那些馅饼其实一个也没放进锡脸盆，我们怕焊锡化掉。赛拉斯姨父倒有一只了不起的黄铜暖床锅。他十分珍爱，因为那是祖先留下来的，安着一根长木柄。据说那位祖先乘《五月花号》或者别的早期帆船，跟征服者威廉一道从英国把它带来。
        - id: ch01-b58
          speaker: huck
          text: 暖床锅和一大堆旧锅旧罐藏在阁楼里。那些东西宝贵，不是因为真有用，它们根本没用，只因为是祖上传下来的古物。我们偷偷把锅拖出来，带到树林。头几个馅饼都烤坏了，因为我们不得要领，最后一个总算笑吟吟地交了差。
        - id: ch01-b59
          speaker: huck
          text: 我们在锅里铺上面团，把锅放进炭火，塞满破布绳，再盖上一层面皮当屋顶。合好盖子，往上堆满滚烫的余烬，我们便握着长柄，站在五英尺外面，又凉快又舒服。十五分钟以后，出锅的馅饼漂亮得叫人满意。
        - id: ch01-b60
          speaker: huck
          text: 不过谁想吃它，最好随身带两小桶牙签。要是那架绳梯还不能叫他认真对付，我说的话就全是胡扯。它也准会让那人狠狠肚子疼，一直疼到下回再吃为止。
        - id: ch01-b61
          speaker: huck
          text: 我们把女巫馅饼放进吉姆的饭盘时，纳特没有偷看。三只锡盘也藏到了食物底下。吉姆顺利拿到全部东西。等身边没人，他立刻掰开馅饼，把绳梯藏进草褥垫，又在一只锡盘上刻了些记号，从窗洞扔了出去。
