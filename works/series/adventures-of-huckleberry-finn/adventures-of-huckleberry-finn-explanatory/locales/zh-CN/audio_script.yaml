audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 说明
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这本书里用了好几种方言。有密苏里黑人的方言，有美国西南偏僻地区最浓重的土话，也有通常所说的“派克县”方言，还有四种从这种方言变化出来的说法。
        - id: ch01-b02
          speaker: narrator
          text: 这些方言之间那些细微的差别，不是我随手乱写的，也不是凭空猜的。我仔细推敲过，而且亲自熟悉这几种说话方式，这就是可靠的依据。
        - id: ch01-b03
          speaker: narrator
          text: 我特意说明这一点，是因为要是不说，许多读者会以为，书里这些人物都想说同一种腔调，只是谁也没有说成功。
        - id: ch01-b04
          speaker: narrator
          text: 作者
