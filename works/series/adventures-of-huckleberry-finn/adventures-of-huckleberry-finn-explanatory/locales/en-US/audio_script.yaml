  chapters:
    - id: ch01
      title: Explanatory
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This book uses several different dialects. They include what the book calls the Missouri Negro dialect, the most extreme kind of backwoods Southwestern dialect, the ordinary “Pike County” dialect, and four altered forms of that last one. Those differences were not thrown in at random or guessed at. They were worked out carefully, with reliable guidance and personal knowledge of these different ways of speaking.
        - id: ch01-b02
          speaker: narrator
          text: I am explaining this because, without it, many readers might think all the characters were trying to talk alike and simply failing.
        - id: ch01-b03
          speaker: narrator
          text: The Author.
