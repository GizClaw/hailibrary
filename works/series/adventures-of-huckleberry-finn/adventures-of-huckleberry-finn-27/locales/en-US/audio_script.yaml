  chapters:
    - id: ch01
      title: CHAPTER XXVII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: I crept up to the king's door and the duke's and listened. They were both snoring. I tiptoed downstairs without any trouble. Not a sound came from anywhere. Through a crack in the dining-room door, I saw the men who were watching the body. Every one of them was asleep in his chair. The door from there into the parlor stood open, and candles burned in both rooms.
        - id: ch01-b02
          speaker: huck
          text: I passed the open parlor door. Nobody was in there but what was left of Peter. Then I reached the front door and found it locked, with no key anywhere. Just then, somebody started down the stairs behind me. I ran into the parlor and looked around fast. The coffin was the only hiding place I could see.
        - id: ch01-b03
          speaker: huck
          text: The lid had been slid back about a foot. Peter's face showed beneath a wet cloth, and he wore his burial shroud. I pushed the money bag under the lid, just beyond his crossed hands. Touching those cold hands made me shiver. Then I hurried across the room and hid behind the door.
        - id: ch01-b04
          speaker: huck
          text: It was Mary Jane coming down. She stepped softly to the coffin, knelt, and looked inside. Then she raised her handkerchief and began to cry without making a sound. Her back was toward me, so I slipped away. I checked the watchers as I passed the dining room. They had not moved.
        - id: ch01-b05
          speaker: huck
          text: Back in bed, I felt pretty low. I had gone through all that trouble and danger, only to have it end this way. If the bag stayed hidden, I could write to Mary Jane after we were a hundred or two hundred miles downriver. She could dig Peter up and get it. But that was not likely. The money would probably turn up when they screwed on the coffin lid. The king would have it again, and it would be a long time before he ever gave anybody another chance to steal it from him.
        - id: ch01-b06
          speaker: huck
          text: I wanted to go back and move the bag, but I did not dare. Morning was getting closer every minute. One of the watchers might wake, and then I could be caught with six thousand dollars that nobody had asked me to mind. I wanted no part of that kind of trouble.
        - id: ch01-b07
          speaker: huck
          text: In the morning, the parlor was shut and the watchers had gone. Only the family, Widow Bartley, and our gang were around. I studied every face, trying to tell whether something had happened. I could not make anything out.
        - id: ch01-b08
          speaker: huck
          text: Near midday, the undertaker arrived with his helper. They put the coffin on two chairs in the middle of the room. Then they arranged all our chairs in rows. They kept borrowing more from the neighbors until the hall, parlor, and dining room were full of them. The coffin lid still looked just as it had before. With people all around, I did not dare go close enough to peek under it.
        - id: ch01-b09
          speaker: huck
          text: People began pouring in. The two frauds and the girls sat in the front row by the head of the coffin. For half an hour, everyone filed past in a slow, single line. Each person looked at Peter's face for a moment, and some shed a tear. The girls and the frauds bowed their heads behind their handkerchiefs and sobbed a little. Otherwise, the room stayed solemn and still. You could hear only shoes scraping the floor and people blowing their noses. Folks always seem to do more of that at a funeral than anywhere except church.
        - id: ch01-b10
          speaker: huck
          text: Once the rooms were packed, the undertaker glided about in black gloves, putting the last things in order and making people comfortable. He never spoke or made more noise than a cat. A nod or a motion of his hand moved people, squeezed latecomers into seats, and opened paths through the crowd. Then he took his place by the wall. He was the softest, quietest, most stealthy man I ever saw, and his face had no more smile than a ham.
        - id: ch01-b11
          speaker: huck
          text: Someone had lent them a melodeon, and it was a sick one. A young woman sat down and played it. The thing squeaked and groaned while everybody sang. As far as I could tell, Peter was the only person getting anything good out of it.
        - id: ch01-b12
          speaker: huck
          text: Then Reverend Hobson stood over the coffin and began speaking, slow and solemn. Right away, the most terrible racket burst out in the cellar. It was only one dog, but it sounded like a whole riot. The preacher had to stop because nobody could even hear himself think. It was mighty awkward, and no one knew what to do.
        - id: ch01-b13
          speaker: huck
          text: Then the tall undertaker caught the preacher's eye. He made a sign that seemed to say, "Do not worry. You can depend on me." He bent low and slid along the wall, with only his shoulders showing above the crowd. The dog's racket kept getting worse as he went around two sides of the room and disappeared into the cellar. About two seconds later came a whack. The dog finished with one or two tremendous howls, and then everything went dead quiet. Reverend Hobson picked up his solemn talk right where he had stopped.
        - id: ch01-b14
          speaker: huck
          text: A minute later, the undertaker's back and shoulders came gliding along the wall again. He went around three sides of the room. Then he rose, cupped his hands around his mouth, and stretched his neck toward the preacher over everybody's heads.
        - id: ch01-b15
          speaker: undertaker
          text: He had a rat!
        - id: ch01-b16
          speaker: huck
          text: The undertaker sank down and slid along the wall to his old place. You could see that his explanation satisfied everybody. Naturally, they had wanted to know what happened. It cost him nothing to tell them, and it is little things like that which make people respect and like a man. Nobody in town was more popular than that undertaker.
        - id: ch01-b17
          speaker: huck
          text: The funeral sermon was good, but it went on forever and wore everybody out. Then the king pushed forward and delivered some of his usual nonsense. At last the whole job was over. The undertaker began creeping toward the coffin with his screwdriver, and I broke into a sweat. I watched him as close as I could. He never reached under the lid or disturbed anything. He only slid the lid into place, soft as mush, and screwed it down tight and fast.
        - id: ch01-b18
          speaker: huck
          text: That left me stuck. I had no way to know whether the money was still in there. What if somebody had quietly taken the bag before the coffin was closed? How could I know whether to write Mary Jane? If I told her where I had hidden it, she might dig Peter up and find nothing at all. What would she think of me then? Somebody might track me down and put me in jail. I had better lie low, keep quiet, and write nothing. The whole thing was terribly mixed up. I had tried to fix it and made it a hundred times worse. I wished I had left the business alone from the start.
        - id: ch01-b19
          speaker: huck
          text: They buried Peter, and we came home. I went right back to watching faces because I could not help myself or rest easy. Nothing came of it. Their faces told me nothing.
        - id: ch01-b20
          speaker: huck
          text: That evening, the king went visiting. He charmed everybody he met and acted as friendly as could be. He said his congregation back in England must be terribly worried about him. That meant he had to settle the estate at once and hurry home. He claimed he was sorry to be rushed away. Everyone else was sorry too. They wished he could stay longer, though they agreed he had no choice.
        - id: ch01-b21
          speaker: huck
          text: The king also said that he and William would take the girls home to England. That pleased the whole town. The girls would be provided for and living with their own relations. It pleased the girls most of all. They were so delighted that they forgot they had ever known trouble. They told him to sell the property as fast as he liked, because they would be ready to leave.
        - id: ch01-b22
          speaker: huck
          text: Seeing those poor girls so happy made my heart ache. They were being fooled and lied to, but I could not see any safe way to speak up and change what everyone believed.
        - id: ch01-b23
          speaker: huck
          text: Before you knew it, the king had advertised the house, the enslaved family, and every bit of the property for auction. The sale would be two days after the funeral. Anybody who wanted something could buy it privately before then.
        - id: ch01-b24
          speaker: huck
          text: Around noon the next day, the girls' happiness took its first hard blow. Two slave traders came by, and the king sold the enslaved people to them at a low price, paid with drafts due in three days. The two sons were sent upriver to Memphis. Their mother was sent downriver to New Orleans.
        - id: ch01-b25
          speaker: huck
          text: The girls and the enslaved family acted as if their hearts would break. They went from one another to the next, clinging together and crying until the sight nearly made me sick. The girls said they had never dreamed the family would be separated, much less sold away from town. I have never been able to drive that scene from my memory. I can still see those poor, miserable people hanging around one another's necks and weeping.
        - id: ch01-b26
          speaker: huck
          text: I do not think I could have stood much more. I might have burst out and exposed our whole gang. The only thing that stopped me was knowing the sale was not valid. In a week or two, the family would be home again.
        - id: ch01-b27
          speaker: huck
          text: The sale stirred up the whole town. Plenty of people came right out and said it was shameful to separate a mother from her children that way. Folks thought less of the frauds after that. The duke said and did everything he could to stop it, and he looked badly worried. The stubborn old king pushed ahead anyway.
        - id: ch01-b28
          speaker: huck
          text: Auction day came next. Around daybreak, the king and the duke climbed into the garret and woke me. One look at their faces told me something was wrong.
        - id: ch01-b29
          speaker: king
          text: Were you in my room the night before last?
        - id: ch01-b30
          speaker: huck
          text: No, Your Majesty.
        - id: ch01-b31
          speaker: huck
          text: That was what I always called him when nobody but our gang could hear us.
        - id: ch01-b32
          speaker: king
          text: Did you go in there yesterday or last night?
        - id: ch01-b33
          speaker: huck
          text: No, Your Majesty.
        - id: ch01-b34
          speaker: king
          text: Give me your honest word now. No lying.
        - id: ch01-b35
          speaker: huck
          text: Honest, Your Majesty, I am telling the truth. I have not been near your room since Miss Mary Jane showed it to you and the duke.
        - id: ch01-b36
          speaker: duke
          text: Did you notice anybody else going in there?
        - id: ch01-b37
          speaker: huck
          text: No, Your Grace. Not that I can remember.
        - id: ch01-b38
          speaker: duke
          text: Think carefully.
        - id: ch01-b39
          speaker: huck
          text: I stopped and thought for a while. Then I saw my chance. Well, I did see the enslaved people go into that room several times.
        - id: ch01-b40
          speaker: huck
          text: Both men jumped a little. First they looked as if that had never crossed their minds. Then they looked as if it had.
        - id: ch01-b41
          speaker: duke
          text: What? Every one of them?
        - id: ch01-b42
          speaker: huck
          text: No, not together. At least, I think there was only one time when I saw all of them come out at once.
        - id: ch01-b43
          speaker: duke
          text: Well, now! When did that happen?
        - id: ch01-b44
          speaker: huck
          text: The morning of the funeral. It was not early because I slept late. I was starting down the ladder when I saw them.
        - id: ch01-b45
          speaker: duke
          text: Go on, then. What were they doing? How did they behave?
        - id: ch01-b46
          speaker: huck
          text: They did not do anything, and they acted ordinary enough as far as I could tell. They tiptoed away. It looked to me as though they had gone in to straighten Your Majesty's room, expecting you to be awake already. When they found you still asleep, they hoped to slip off without getting into trouble. Maybe they had not woken you yet, and they wanted to keep it that way.
        - id: ch01-b47
          speaker: king
          text: Great guns, this is a fine mess!
          emotion: surprised
        - id: ch01-b48
          speaker: huck
          text: Both of them looked sick and foolish. For a minute, they stood there thinking and scratching their heads. Then the duke let out a short, rough chuckle.
        - id: ch01-b49
          speaker: duke
          text: You have to admire how neatly they played their hand. They pretended to be sorry about leaving this part of the country. I believed they truly were sorry. So did you, and so did everyone else. Never tell me again that they have no talent for acting. That performance would have tricked anybody. There is a fortune in those people. If I had the money for a theater, I could not ask for a better company. And now we have sold them for next to nothing. We are not even allowed to collect that little song yet. Speaking of that, where is the draft?
        - id: ch01-b50
          speaker: king
          text: It is at the bank waiting to be collected. Where else would it be?
        - id: ch01-b51
          speaker: duke
          text: Well, thank goodness for that.
        - id: ch01-b52
          speaker: huck
          text: I tried to sound timid. Did something go wrong?
        - id: ch01-b53
          speaker: king
          text: That is none of your business! Shut your mouth and mind your own affairs, if you have any. Do not forget that while you are in this town. Do you hear me?
          emotion: angry
        - id: ch01-b54
          speaker: huck
          text: Then he turned to the duke.
        - id: ch01-b55
          speaker: king
          text: We will have to swallow the loss and say nothing. Not one word from either of us.
        - id: ch01-b56
          speaker: huck
          text: They started down the ladder. The duke chuckled again.
        - id: ch01-b57
          speaker: duke
          text: Quick sales and small profits. Now there is a fine business.
        - id: ch01-b58
          speaker: huck
          text: The king spun around with a snarl.
        - id: ch01-b59
          speaker: king
          text: I was doing what seemed best when I sold them quickly. If the profit turned out to be less than nothing, is that any more my fault than yours?
          emotion: angry
        - id: ch01-b60
          speaker: duke
          text: They would still be in this house, and we would already be gone, if you had listened to me.
        - id: ch01-b61
          speaker: huck
          text: The king talked back as much as he safely could. Then he changed direction and lit into me again. He scolded me for not coming straight to him after I saw the family leaving his room that way. Any fool, he said, would have known something was wrong. After that, he cursed himself for getting up instead of staying in bed and taking his usual long rest that morning. He swore he would never make that mistake again.
        - id: ch01-b62
          speaker: huck
          text: They went away arguing. I was mighty glad I had shifted the blame onto the enslaved family without doing them any harm.
