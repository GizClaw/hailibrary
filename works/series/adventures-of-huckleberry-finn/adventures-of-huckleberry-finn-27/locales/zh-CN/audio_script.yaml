audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    undertaker:
      display_name: 殡仪师
      tts:
        delivery: 克制周到，开口时低沉简短
        timbre: 成年而略显粗哑
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 钱袋藏进棺材
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我摸到国王和公爵门外听了听，两个人都在打呼噜。于是我踮着脚下楼，一路顺顺当当。整座房子静得没有一点声响。我从门缝往饭厅里看，那些守灵人全坐在椅子上睡熟了。通往客厅的门敞着，两个房间各点着一支蜡烛。客厅里除了彼得剩下的那副躯壳，一个活人也没有。我赶紧从门前走过，本想从前门出去，可门锁着，钥匙也不见了。
        - id: ch01-b02
          speaker: huck
          text: 偏在这时，身后的楼梯传来脚步声。我赶紧钻进客厅。能藏钱袋的地方只剩棺材。棺盖留着约莫一英尺的缝，下面露出死人的脸，脸上盖着湿布，身上穿着寿衣。我把钱袋塞到他交叉的双手下面。那双手冷得叫我浑身发毛。随后我跑到门后藏好。
        - id: ch01-b03
          speaker: huck
          text: 来的是玛丽·简。她轻轻走到棺材前，跪下来往里看，又举起手帕。我看见她哭了，可她背朝着我，一点哭声也听不见。我悄悄溜了出去。经过饭厅时，我又从门缝看了看。那些守灵人没有一个动过。
        - id: ch01-b04
          speaker: huck
          text: 我回到楼上，心里很不好受。费了那么大力气，冒了那么大风险，事情却办成了这样。要是钱能一直留在棺材里，倒也好办。等我们顺河走出一两百英里，我就写信告诉玛丽·简，让她把彼得挖出来取钱。可人们拧上棺盖时一定会发现钱袋。国王又会把它拿走，往后谁也别想从他手里偷出来。
        - id: ch01-b05
          speaker: huck
          text: 我当然很想再下楼取钱，可实在不敢。天越来越亮，守灵人随时会醒。要是有人撞见我手里拿着六千美元，而又没人雇我照看这笔钱，那麻烦可大了。我对自己说，这种事情千万别沾边，还是老老实实留在楼上。
    - id: ch02
      title: 葬礼上的秘密
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 早晨下楼时，客厅已经关上，守灵人也走了。屋里只有这一家人、巴特利寡妇和我们这一伙。我挨个盯着他们的脸，想知道是不是出了什么事，可什么也看不出来。
        - id: ch02-b02
          speaker: huck
          text: 快到中午，殡仪师带着帮手来了。他们把棺材架到屋子中央，再把椅子摆成一排排。家里的椅子不够，又向邻居借，直到门厅、客厅和饭厅全摆满。我看见棺盖还是原来的样子，可周围有人，不能走近查看。
        - id: ch02-b03
          speaker: huck
          text: 人们渐渐挤满了屋子。国王、公爵和姑娘们坐在棺材头前面的第一排。接下来半个钟头，大家排成一列，慢慢走过棺材，每个人都低头看看彼得的脸，停上一会儿，有些人还掉了泪。整个屋子又安静又肃穆。姑娘们和两个骗子始终低着头，用手帕遮住眼睛，只偶尔轻轻抽泣。除此以外，只听得见鞋底擦过地板，还有人们擤鼻子。人在葬礼上总爱擤鼻子，只有上教堂时擤得更多。
        - id: ch02-b04
          speaker: huck
          text: 屋里挤满以后，殡仪师戴着黑手套，在人群里轻轻滑来滑去，做最后的收拾。他把人和东西全安顿得妥妥帖帖，连猫也没有他安静。他从不开口，只点点头、打打手势，就能把客人挪好，把迟到的人塞进空隙，再让出过道。等一切都舒服稳当了，他才站到墙边。这个人走路又轻又滑，做什么都悄无声息，脸上却没有半点笑意，简直跟一只火腿一样。
        - id: ch02-b05
          speaker: huck
          text: 他们还借来一架有病的簧风琴。一个年轻女人坐下弹起来，那声音又尖又涩，像在闹肚子。众人跟着唱歌。照我看，只有彼得一个人占了便宜。霍布森牧师随后开始布道，声音又慢又庄严。可他才讲了几句，地窖里忽然闹翻了天。
        - id: ch02-b06
          speaker: huck
          text: 下面其实只有一条狗，可它闹出的动静大得吓人，还一直不停。牧师只好站在棺材上方等着，屋里的人连自己在想什么都听不清。谁也不知道该怎么办。那个长腿殡仪师朝牧师打了个手势，意思是别担心，交给他。接着他弯下身，贴着墙往前滑，人群头顶上只看得见他的肩膀。狗越叫越凶，他绕过两面墙，钻进了地窖。
        - id: ch02-b07
          speaker: huck
          text: 两秒钟后，下面传来“啪”的一声。狗发出一两声惊人的惨叫，便彻底安静了。牧师接着原来的地方往下讲。过了一会儿，殡仪师的后背和肩膀又沿着墙滑回来。他绕过三面墙，终于直起身，一手挡在嘴边，越过众人的头顶朝牧师伸长脖子。
        - id: ch02-b08
          speaker: undertaker
          text: 它逮着一只耗子！
        - id: ch02-b09
          speaker: huck
          text: 说完，他又伏低身子，贴着墙滑回了原位。所有人顿时都舒坦了，因为大家当然想知道地窖里出了什么事。告诉大家原来是一只耗子，这种小小的周到不花一文钱，却最能叫人敬重、喜欢。镇上再没有谁比这位殡仪师更得人心。
        - id: ch02-b10
          speaker: huck
          text: 葬礼上的布道还不错，只是长得要命，也烦得要命。国王随后也挤进去，说了些他平常爱说的废话，仪式总算结束。殡仪师拿着螺丝刀，悄无声息地走近棺材。我急得浑身直冒汗，眼睛一刻也没离开他。他却没有掀开棺盖，也没碰里面的东西，只把盖子软绵绵地推回原位，牢牢拧紧。
        - id: ch02-b11
          speaker: huck
          text: 这下我再也不知道钱在不在里面了。也许有人已经偷偷拿走了钱袋。可我既然不知道，又该不该写信给玛丽·简？她要真照我的话把彼得挖出来，却什么也没找到，会怎么看我？说不定人家还会一路找到我，把我送进牢里。我想，最好缩着脑袋，一句话也别说，信也别写。如今这件事乱成了一团。本来想把事情办好，结果反倒弄坏了一百倍。早知道这样，我真该从头到尾都别碰它。
        - id: ch02-b12
          speaker: huck
          text: 彼得下葬以后，我们回到家。我忍不住又去观察每个人的脸，心里怎么也安定不下来。可那些脸仍旧什么也没告诉我。
    - id: ch03
      title: 一家人被拆散
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 晚上，国王到处串门，跟每个人套近乎，把大家都哄得很高兴。他说，英国的教区信众一定正在为他着急，所以遗产必须马上处理完，他好赶紧回家。他装得十分遗憾，别人也舍不得他走，还希望他能多留些日子。可听完他的理由，大家又都说确实没有别的办法。
        - id: ch03-b02
          speaker: huck
          text: 国王还宣布，他和威廉当然会把三个姑娘带回英国，让她们在亲戚身边好好生活。大伙听了都觉得这样最好，姑娘们往后总算有了着落。姑娘们更是欢喜得忘掉了世上所有烦恼，催国王想多快卖掉产业都行，她们随时都能动身。我眼看着这些可怜姑娘这样幸福，却知道她们正受骗，听到的句句都是谎话，心里疼得厉害。可我找不到安全的办法站出来改变这一切。
        - id: ch03-b03
          speaker: huck
          text: 国王马上把房子、黑奴和全部财产挂牌拍卖，定在葬礼两天后开拍。谁要愿意，也可以赶在拍卖前私下买走。
        - id: ch03-b04
          speaker: huck
          text: 葬礼后的第二天中午，姑娘们的欢喜挨了第一记重击。两个贩卖黑奴的人来了。国王收下一张三天到期的汇票，用不高的价钱把黑奴卖给他们。两个儿子被带往上游的孟菲斯，母亲则被带往下游的新奥尔良。
        - id: ch03-b05
          speaker: huck
          text: 姑娘们和几个黑奴都伤透了心。他们围在一起，搂住彼此的脖子痛哭，哭闹得我几乎要恶心起来。姑娘们说，她们从没想过这一家人会被拆散，更没想过他们会被卖到外乡。那些可怜人抱头痛哭的情景，我一辈子也忘不了。要不是知道这笔买卖算不得数，他们一两个星期后就会回家，我一定再也忍不住，非跳出来把我们这一伙全揭发了不可。
        - id: ch03-b06
          speaker: huck
          text: 整座镇子也为这件事闹了起来。许多人干脆当面直说，硬把母亲和孩子这样分开卖掉，实在丢人。两个骗子因此失了些人心。公爵怎么劝、怎么拦也没用，那个老蠢货还是蛮横地往前冲。我告诉你，这可把公爵急坏了。
    - id: ch04
      title: 两个骗子追问钱袋
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 第二天就是拍卖日。天刚亮，国王和公爵爬上阁楼，把我叫醒。我一看他们的脸色，就知道麻烦来了。
        - id: ch04-b02
          speaker: king
          text: 前天夜里，你进过我的房间吗？
        - id: ch04-b03
          speaker: huck
          text: 没有，陛下。
        - id: ch04-b04
          speaker: huck
          text: 我们这一伙私下独处时，我总管他叫陛下。
        - id: ch04-b05
          speaker: king
          text: 昨天呢？昨天夜里呢？你进去过没有？
        - id: ch04-b06
          speaker: huck
          text: 没有，陛下。
        - id: ch04-b07
          speaker: king
          text: 凭良心说，别拿谎话骗我。
        - id: ch04-b08
          speaker: huck
          text: 凭良心说，我讲的是真话。自从玛丽·简小姐领您和公爵看过房间，我连您的门边都没靠近。
        - id: ch04-b09
          speaker: duke
          text: 那你见过别人进去吗？
        - id: ch04-b10
          speaker: huck
          text: 照我记得，没有，殿下。应该没有。
        - id: ch04-b11
          speaker: duke
          text: 别急，好好想清楚。
        - id: ch04-b12
          speaker: huck
          text: 我装作想了一阵，忽然看见了脱身的机会。
        - id: ch04-b13
          speaker: huck
          text: 对了，我看见那几个黑奴进去过好几回。
        - id: ch04-b14
          speaker: huck
          text: 两个人听完都轻轻一跳。起先，他们像是完全没料到这回事。可紧接着，两张脸又像在说，他们早就该猜到了。公爵马上追问下去。
        - id: ch04-b15
          speaker: duke
          text: 所有人都进去过？
        - id: ch04-b16
          speaker: huck
          text: 不是，不是一起进去的。我只见过一回，他们所有人一起从屋里出来。
        - id: ch04-b17
          speaker: duke
          text: 那是什么时候？
        - id: ch04-b18
          speaker: huck
          text: 办葬礼那天早晨。时间不早了，因为我睡过了头。我正准备下梯子，就看见了他们。
        - id: ch04-b19
          speaker: duke
          text: 往下说，快点！他们做了什么？看起来怎么样？
        - id: ch04-b20
          speaker: huck
          text: 什么也没做，看起来也没什么特别。他们踮着脚走开。我猜他们以为陛下已经起床，便进去收拾屋子。后来发现您还没起，就想趁没惹上麻烦以前悄悄溜掉，也免得吵醒您。要是他们还没把您吵醒的话。
        - id: ch04-b21
          speaker: king
          text: 老天爷，这下可真妙！
        - id: ch04-b22
          speaker: huck
          text: 两个人脸色都很难看，模样也傻透了。他们站在那里想了好一会儿，还不停地抓脑袋。最后，公爵忽然发出一阵又轻又刺耳的干笑。
        - id: ch04-b23
          speaker: duke
          text: 那几个黑奴这一手可真漂亮。他们装得像是舍不得离开这里，我信了，你信了，所有人都信了。往后谁也别说黑奴没有演戏的天分。他们那样演，任谁都会上当。依我看，他们身上藏着一大笔财路。我要是有本钱，再有一座戏院，绝找不到更好的班底。可我们居然用一首歌的价钱把他们贱卖了，而且这首歌还没轮到咱们唱。那笔钱呢？我是说，那张汇票现在在哪儿？
        - id: ch04-b24
          speaker: king
          text: 放在银行等着兑现。还能在哪儿？
        - id: ch04-b25
          speaker: duke
          text: 那就好，谢天谢地。
        - id: ch04-b26
          speaker: huck
          text: 我有点胆怯地问他们，是不是出了什么岔子。国王猛地转过身来。
        - id: ch04-b27
          speaker: king
          text: 不关你的事！闭上嘴，管好你自己的闲事。只要还在这个镇上，就别忘了这句话，听见没有？
          emotion: angry
        - id: ch04-b28
          speaker: king
          text: 咱们只能把这口气咽下去，一个字也别讲。咱俩都得守口如瓶。
        - id: ch04-b29
          speaker: huck
          text: 他们正要下梯子，公爵又干笑了一声。
        - id: ch04-b30
          speaker: duke
          text: 薄利快销！真是一门好买卖。
        - id: ch04-b31
          speaker: king
          text: 我急着卖掉他们，也是想把事情办好。现在一分钱没赚到，还倒欠一大截，连一分也带不走。这难道只怪我，不怪你？
          emotion: angry
        - id: ch04-b32
          speaker: duke
          text: 你要肯听我的，他们还会待在这座房子里，离开的早该是我们。
        - id: ch04-b33
          speaker: huck
          text: 国王不敢跟公爵顶得太厉害，只回了几句嘴，就转过来拿我出气。他狠狠骂了我一顿，问我看见黑奴踮着脚从他房里出来，为什么不马上告诉他。照他的说法，哪怕是个傻瓜，也该知道里头有鬼。骂完我，他又劈头盖脸地骂起自己，说这一切都怪他那天早晨没有多睡一会儿，没有让自己舒舒服服歇足。他发誓往后再也不会这样。
        - id: ch04-b34
          speaker: huck
          text: 国王和公爵就这样一边拌嘴，一边走下阁楼。我心里快活极了。整件事总算都推到了黑奴身上，两个骗子认定钱是他们拿的。可那几个黑奴早已被卖到外地，我这样说并没有给他们带来任何伤害。
