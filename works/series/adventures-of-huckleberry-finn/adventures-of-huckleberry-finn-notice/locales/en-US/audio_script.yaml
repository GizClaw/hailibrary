  chapters:
    - id: ch01
      title: Notice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Anyone who tries to find a motive in this story will be prosecuted. Anyone who tries to find a moral will be banished. And anyone who tries to find a plot will be shot.
        - id: ch01-b02
          speaker: narrator
          text: By order of the author, through G. G., Chief of Ordnance.
