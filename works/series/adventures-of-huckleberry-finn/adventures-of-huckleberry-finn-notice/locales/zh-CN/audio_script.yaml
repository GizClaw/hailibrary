audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 告示
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要是有人非要从这个故事里琢磨动机，就起诉他。要是有人非要从中找教训，就把他流放。谁还想找出情节，那就枪毙。
        - id: ch01-b02
          speaker: narrator
          text: 这道命令由军械总长 G. G. 代为发布。
