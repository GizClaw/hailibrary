  chapters:
    - id: ch01
      title: CHAPTER XXXIX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The next morning, Tom and I went to the village and bought a wire rat trap. We brought it home, opened the best rat hole again, and caught fifteen first-rate rats in about an hour. Then we hid the trap safely under Aunt Sally's bed.
        - id: ch01-b02
          speaker: huck
          text: While we were out hunting spiders, little Thomas Franklin Benjamin Jefferson Elexander Phelps found the trap. He opened its door to see whether the rats would come out. They did. Aunt Sally came in before we got back, and we found her standing on top of the bed, raising Cain, while the rats kept things lively all around her.
        - id: ch01-b03
          speaker: huck
          text: She gave both of us a whipping with a hickory switch. Then we spent nearly two hours catching another fifteen or sixteen rats. Drat that meddlesome child. The new rats weren't nearly as fine, because our first catch had been the pick of the lot. I never saw a likelier bunch of rats than those first ones.
        - id: ch01-b04
          speaker: huck
          text: We gathered a splendid assortment of spiders, bugs, frogs, caterpillars, and anything else we could find. We nearly got a hornet's nest too, but its family was home. We didn't quit right away. We stayed as long as we could, figuring either we'd tire them out or they'd tire us out. They won.
        - id: ch01-b05
          speaker: huck
          text: We rubbed allycumpain on the stings and soon felt almost right again, though sitting down was not convenient. Then we went after snakes. We caught about two dozen garter snakes and house snakes, put them in a bag, and left it in our room. By then it was supper time. It had been a fine, honest day's work, and hungry? Oh, no. Not us.
        - id: ch01-b06
          speaker: huck
          text: When we went back upstairs, there wasn't one blessed snake in the bag. We hadn't tied it properly, and they had worked their way out. That didn't matter much. They were still somewhere on the place, so we expected to catch some of them again.
        - id: ch01-b07
          speaker: huck
          text: There was no real shortage of snakes in that house for quite a spell. Every now and then one would drop from a rafter or some other place. It generally landed in somebody's plate or slid down the back of a neck, usually where it wasn't wanted. They were handsome, striped things, and a million of them couldn't hurt anyone. Aunt Sally did not care. She hated every kind of snake and couldn't bear them any way you fixed it.
        - id: ch01-b08
          speaker: huck
          text: Whenever one fell on her, she dropped whatever she was doing and lit out. I never saw such a woman. Her whoop could carry clear to Jericho. She wouldn't touch a snake even with the fire tongs. If she rolled over in bed and found one, she'd scramble out and howl as if the house were burning down.
        - id: ch01-b09
          speaker: huck
          text: She upset Uncle Silas so much that he almost wished snakes had never been created. Even a week after the last one had left the house, Aunt Sally wasn't over it. If she sat thinking and you brushed the back of her neck with a feather, she'd jump clean out of her stockings. It was curious. Tom said all women were like that, made so for some reason or other.
        - id: ch01-b10
          speaker: huck
          text: We got whipped every time one of our snakes crossed Aunt Sally's path. She said those whippings were nothing beside what she'd do if we ever filled the place with snakes again. The whipping didn't trouble me much. What bothered me was having to collect a fresh supply.
        - id: ch01-b11
          speaker: huck
          text: Still, we stocked up on snakes again and gathered all the other creatures too. You never saw a cabin as cheerful as Jim's when they all came swarming out to make music and go after him. Jim didn't like the spiders, and they didn't like him. They waited for their chances and made things mighty uncomfortable.
        - id: ch01-b12
          speaker: jim
          text: Between the rats, the snakes, and that grindstone, there is scarcely room for me in this bed. And when there is room, nobody could sleep here. Those creatures never sleep all at once. They take turns. When the snakes sleep, the rats come on duty. When the rats turn in, the snakes take watch. One gang stays under me, getting in my way, while the other holds a circus on top of me. If I get up to find another spot, the spiders go for me while I'm crossing. If I get out this time, I will never be a prisoner again, not even for pay.
        - id: ch01-b13
          speaker: huck
          text: By the end of three weeks, everything was in pretty good shape. We'd sent the shirt in early, hidden in a pie. Whenever a rat bit Jim, he got up and wrote a little in his journal while the ink was fresh. The pens were ready. The words and other marks were carved into the grindstone. We'd sawed the bed leg in two, and we'd eaten all the sawdust.
        - id: ch01-b14
          speaker: huck
          text: That sawdust gave us a truly amazing stomachache. We thought we were all going to die, but we didn't. It was the hardest sawdust to digest that I ever came across, and Tom agreed with me.
        - id: ch01-b15
          speaker: huck
          text: At last, all the work was finished. We were worn out, especially Jim. Uncle Silas had written twice to the plantation below New Orleans, asking them to come for their runaway slave. He got no answer because there was no such plantation. So he said he'd advertise Jim in the St. Louis and New Orleans newspapers. Hearing him mention St. Louis sent cold shivers through me. I could see we had no time left to waste.
        - id: ch01-b16
          speaker: huck
          text: Tom said it was time for the anonymous letters.
        - id: ch01-b17
          speaker: huck
          text: What are those?
        - id: ch01-b18
          speaker: tom
          text: They're warnings that tell people something is going on. There are different ways to do it, but someone always spies around and warns the man in charge of the castle. When Louis the Sixteenth meant to escape from the Tuileries, a servant girl warned them. That's a very good method, and so are anonymous letters. We'll use both. The prisoner's mother usually changes clothes with him too. She stays behind, and he slips out wearing her clothes. We'll do that as well.
        - id: ch01-b19
          speaker: huck
          text: But Tom, why should we warn anybody that something is going on? Let them discover it themselves. That's their lookout.
        - id: ch01-b20
          speaker: tom
          text: I know, but you cannot depend on these people. They've behaved this way from the start and left us to do everything. They're so trusting and thickheaded that they never notice a thing. Unless we warn them, nobody will interfere. Then after all our work and trouble, the escape will go off completely flat. There won't be anything to it.
        - id: ch01-b21
          speaker: huck
          text: That's just how I'd like it.
        - id: ch01-b22
          speaker: tom
          text: That's nonsense!
          emotion: disgusted
        - id: ch01-b23
          speaker: huck
          text: Tom looked disgusted, so I told him I wasn't complaining. Any plan that suited him suited me. Then I asked what he meant to do about the servant girl.
        - id: ch01-b24
          speaker: tom
          text: You'll be the servant girl. In the middle of the night, slip inside and steal that young woman's yellow dress.
        - id: ch01-b25
          speaker: huck
          text: Tom, that'll cause trouble in the morning. She probably doesn't own another dress.
        - id: ch01-b26
          speaker: tom
          text: I know. You only need it for fifteen minutes. Wear it while you carry the anonymous letter and push it under the front door.
        - id: ch01-b27
          speaker: huck
          text: All right, I'll do it. But I could carry the letter just as easily in my own clothes.
        - id: ch01-b28
          speaker: tom
          text: Then you wouldn't look like a servant girl, would you?
        - id: ch01-b29
          speaker: huck
          text: Nobody will be there to see what I look like anyway.
        - id: ch01-b30
          speaker: tom
          text: That has nothing to do with it. We have to do our duty and never worry whether anyone sees us doing it. Haven't you got any principles at all?
        - id: ch01-b31
          speaker: huck
          text: All right. I won't say another word. I'm the servant girl. Who is going to be Jim's mother?
        - id: ch01-b32
          speaker: tom
          text: I am. I'll steal one of Aunt Sally's gowns.
        - id: ch01-b33
          speaker: huck
          text: Then you'll have to stay in the cabin when Jim and I leave.
        - id: ch01-b34
          speaker: tom
          text: Not at all. I'll stuff Jim's clothes with straw and put them on his bed. That will stand for his mother in disguise. Jim will take the gown off me and wear it, and all three of us will escape together. When an important prisoner escapes, it's called an evasion. They always call it that when a king escapes, for instance. It's the same for a king's son, whether he's a natural son or an unnatural one.
        - id: ch01-b35
          speaker: huck
          text: Tom wrote the anonymous letter. That night, I stole the young woman's yellow dress, put it on, and pushed the letter under the front door exactly as Tom had told me.
        - id: ch01-b36
          speaker: huck
          text: The letter warned them that trouble was brewing and told them to keep a sharp lookout. It was signed, “Unknown Friend.”
        - id: ch01-b37
          speaker: huck
          text: The next night, we fastened a picture of a skull and crossbones to the front door. Tom had drawn it in blood. On the night after that, we put a picture of a coffin on the back door. I never saw a family in such a state. They couldn't have been more frightened if ghosts had filled the place, hiding behind everything, waiting under the beds, and shivering through the air.
        - id: ch01-b38
          speaker: huck
          text: If a door banged, Aunt Sally jumped and cried out. If something fell, she did it again. If anyone touched her while she wasn't paying attention, she jumped once more. No direction felt safe, because she always thought something was behind her. She'd whirl around with a cry, then turn back before she'd gone two-thirds of the way and cry out again.
        - id: ch01-b39
          speaker: huck
          text: She was afraid to go to bed, but she didn't dare stay up either. Tom said the plan was working very well. He'd never seen anything work better. That proved we'd done it properly.
        - id: ch01-b40
          speaker: tom
          text: Now for the grand finish!
        - id: ch01-b41
          speaker: huck
          text: At the first streak of dawn the next morning, we prepared another letter. We had to decide how to deliver it. At supper, we'd heard that a man would stand watch at each door all night. Tom climbed down the lightning rod to look around. The man guarding the back door was asleep, so Tom tucked the letter into the back of his collar and climbed up again.
        - id: ch01-b42
          speaker: huck
          text: This letter begged the family not to betray its writer, who claimed to be their friend. A desperate gang of killers from the Indian Territory, it said, planned to steal their runaway slave that very night. The gang had been frightening the family so everyone would stay inside and leave the thieves alone.
        - id: ch01-b43
          speaker: huck
          text: The writer claimed to be one of the gang. He said he'd found religion, wanted to live honestly, and meant to expose their terrible plan. At exactly midnight, the gang would creep down from the north along the fence. They had a false key and would enter Jim's cabin to take him away.
        - id: ch01-b44
          speaker: huck
          text: The writer was supposed to watch from a distance and blow a tin horn if danger came. Instead, once the gang was inside, he promised to bleat like a sheep and not blow the horn. While the thieves worked on Jim's chains, the family should sneak over, lock them in, and kill them whenever they pleased.
        - id: ch01-b45
          speaker: huck
          text: They must follow those directions exactly. Otherwise, the gang would suspect something and raise a terrible uproar. The writer wanted no reward. It was enough to know he'd done the right thing. This letter was signed, “Unknown Friend,” too.
