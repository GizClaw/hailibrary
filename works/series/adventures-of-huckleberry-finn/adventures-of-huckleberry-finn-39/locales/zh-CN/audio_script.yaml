audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第三十九章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 第二天一早，我和汤姆到村里买了只铁丝捕鼠笼。回来以后，我们扒开最像样的老鼠洞。才一个钟头，就捉到十五只顶精神的大耗子。我们把笼子藏在萨莉姨妈床底下，自以为十分稳妥，便出去找蜘蛛了。
        - id: ch01-b02
          speaker: huck
          text: 谁知小托马斯·富兰克林·本杰明·杰斐逊·亚历山大·菲尔普斯发现了鼠笼。他想看看耗子会不会出来，就打开笼门。耗子当然全跑了。等我们回来，萨莉姨妈正站在床顶上大喊大叫，耗子们则在下面拼命逗她热闹。
        - id: ch01-b03
          speaker: huck
          text: 她用山核桃木条狠狠抽了我俩一顿。我们又忙了两个钟头，才补捉到十五六只。都怪那个多事的小崽子！后来这批也不如原先的好，因为第一网已经把最出挑的全捉走了。我从没见过比头一批更威风的耗子。
        - id: ch01-b04
          speaker: huck
          text: 蜘蛛、甲虫、青蛙、毛毛虫，还有别的玩意儿，我们都弄来一大堆。我们还想取一个马蜂窝，可那一家子全在家。我们没有马上认输，能坚持多久就坚持多久，心想不是我们把马蜂累垮，就是马蜂把我们累垮。最后果然是我们垮了。擦过土木香膏以后，伤处差不多没事了，只是坐下还不大方便。
        - id: ch01-b05
          speaker: huck
          text: 接着，我们抓了二十来条袜带蛇和家蛇，装进口袋，放在房里。到晚饭时，一天的活总算扎扎实实干完了，我们当然饿得要命。可吃完饭回去一看，一条蛇也没有。袋口没系牢，它们不知怎么全钻了出去。不过它们还在宅子里，我们总能找回几条。
        - id: ch01-b06
          speaker: huck
          text: 那以后很长一阵子，屋里的蛇可真不少。时不时就有一条从房梁或别处滴溜下来，不是落进你的盘子，就是钻进你的后衣领，反正总挑你最不想让它去的地方。它们身上的条纹很漂亮，一百万条聚在一起也伤不了谁，可萨莉姨妈才不管这些。她痛恨所有的蛇，不论什么品种都一样，怎么也受不了。
        - id: ch01-b07
          speaker: huck
          text: 每逢蛇啪嗒一声掉到她身上，不管她正在做什么，都会立刻扔下手里的活儿，转身就跑。我从没见过这样的女人。她一叫起来，隔着老远都听得见。就算给她一把火钳，也休想叫她夹起一条蛇。要是她翻个身，发现床上躺着一条，准会连滚带爬冲下床，扯着嗓子大叫，叫人以为整座房子着了火。
        - id: ch01-b08
          speaker: huck
          text: 老头子被她闹得没法安生，说真希望世上从没造出过蛇。最后一条蛇离开屋子一个星期以后，萨莉姨妈还是没有缓过来。她坐着想事情时，只要拿羽毛碰一下她的后脖颈，她整个人都会猛地跳起来，连袜子都差点儿蹦掉。
        - id: ch01-b09
          speaker: tom
          text: 女人全是这样。她们生下来就是这个样子，至于为什么，我也说不清。
        - id: ch01-b10
          speaker: huck
          text: 我们的蛇每撞到萨莉姨妈面前一次，我和汤姆就挨一顿抽。她还说，要是我们再把房子塞满蛇，眼下这几顿打根本算不了什么，到时一定叫我们知道厉害。我不怕挨打，反正也没有多严重。我真正嫌烦的是，每次挨过打，还得费力重新补齐一批蛇。可我们还是把蛇和别的东西都凑齐了。
        - id: ch01-b11
          speaker: huck
          text: 等那些小畜生听见音乐，一齐爬出来扑向吉姆时，你绝想不到他的小屋有多么热闹欢快。吉姆不喜欢蜘蛛，蜘蛛也不喜欢他，总埋伏起来等着害他，让他的日子难熬得很。他说，耗子、蛇和那盘磨石把床挤得几乎没有地方躺。偶尔腾出一点儿空位，他还是睡不着，因为床上实在太热闹，从来没有一刻安静。
        - id: ch01-b12
          speaker: jim
          text: 它们从来不肯一块儿睡觉，倒会轮着值班。蛇睡了，耗子就出来。耗子回窝，蛇又来守夜。我身底下总压着一伙，另一伙在身上开大马戏。我要是起来换个地方，走过去时，蜘蛛还要趁机扑我。这次只要能出去，以后就算给我工钱，我也不当囚犯啦。
        - id: ch01-b13
          speaker: huck
          text: 三个星期快过完时，事情总算安排得相当妥当。衬衫早已藏在馅饼里送进去。每当耗子咬吉姆一口，他就趁血做的墨水还新鲜，赶紧起来往日记上写几笔。两支笔都做好了，铭文、纹章和其他东西全刻在磨石上，床腿也锯成了两截。锯下来的木屑让我们吃得一干二净，害得肚子疼得出奇。
        - id: ch01-b14
          speaker: huck
          text: 我们当时都以为自己准要死了，可最后谁也没死。那确实是我这辈子见过最难消化的锯末，汤姆也这么认为。到这时候，所有活儿终于做完了，大家累得半死，吉姆尤其累。
        - id: ch01-b15
          speaker: huck
          text: 老头子已经两次写信到奥尔良下游那座种植园，叫人来领他们逃跑的黑奴，可始终没有回信，因为世上根本没有那座种植园。他便说，下一步要在圣路易斯和新奥尔良的报纸上刊登吉姆的消息。一听见他提到圣路易斯，我顿时浑身发冷，明白我们已经没有时间可以耽搁。汤姆却说，现在该写匿名信了。
        - id: ch01-b16
          speaker: huck
          text: 匿名信是什么？
        - id: ch01-b17
          speaker: tom
          text: 就是先警告这里的人，说有事情要发生。这样的事有时用这个办法，有时用别的办法。可城堡附近总得有人暗中窥探，再给主人报信。路易十六打算逃出杜伊勒里宫时，就是一个女仆送的信。这个办法好，匿名信也好，咱们两个都用。
        - id: ch01-b18
          speaker: tom
          text: 还有，按规矩，囚犯的母亲得跟他换衣裳。母亲留下，囚犯穿她的衣裳溜走。咱们也照办。
        - id: ch01-b19
          speaker: huck
          text: 可咱们为什么非要警告他们？让他们自己发现好了，那是他们的事。
        - id: ch01-b20
          speaker: tom
          text: 你根本不能指望他们。从一开始，他们就把所有事都留给咱们。他们粗心得要命，脑袋又笨，什么也看不出来。咱们要是不报信，就没人来阻拦。那咱们费了这么多工夫，这场逃跑却平平淡淡地办完了，一点意思也没有，根本算不上逃跑。
        - id: ch01-b21
          speaker: huck
          text: 可我正喜欢那样，汤姆。
        - id: ch01-b22
          speaker: tom
          text: 呸！你居然还喜欢那样。
          emotion: disgusted
        - id: ch01-b23
          speaker: huck
          text: 不过我不抱怨。你喜欢怎么做，我都答应。那个女仆怎么办？
        - id: ch01-b24
          speaker: tom
          text: 你就是女仆。半夜溜进去，把那个黄皮肤姑娘的裙子偷出来。
        - id: ch01-b25
          speaker: huck
          text: 那她第二天早晨可要倒霉了。她大概只有那一条裙子。
        - id: ch01-b26
          speaker: tom
          text: 我知道，可你只借十五分钟。穿上它送匿名信，再把信从前门底下塞进去。
        - id: ch01-b27
          speaker: huck
          text: 行，我去。不过穿自己的衣裳送信，不也一样方便吗？
        - id: ch01-b28
          speaker: tom
          text: 穿自己的衣裳，你看起来还像女仆吗？
        - id: ch01-b29
          speaker: huck
          text: 不像。可反正也没人会看见我。
        - id: ch01-b30
          speaker: tom
          text: 有没有人看见，跟这件事毫无关系。咱们只管尽自己的本分，不能因为没人看，就不按规矩做。难道你一点原则都没有吗？
        - id: ch01-b31
          speaker: huck
          text: 好吧，我不说了。我就是女仆。那谁当吉姆的母亲？
        - id: ch01-b32
          speaker: tom
          text: 我来。我会偷萨莉姨妈的一件长袍。
        - id: ch01-b33
          speaker: huck
          text: 那我和吉姆离开时，你就得留在小屋里了。
        - id: ch01-b34
          speaker: tom
          text: 我才不留下。我会拿稻草塞满吉姆的衣裳，放在床上，假装那是乔装过的母亲。吉姆再脱下我身上的长袍，自己穿上，咱们三个一起逃。
        - id: ch01-b35
          speaker: tom
          text: 有派头的囚犯逃跑，叫作“潜遁”。国王逃跑就总这么叫，国王的儿子也一样。不管那个儿子是婚生的，还是非婚生的，都没有分别。
        - id: ch01-b36
          speaker: huck
          text: 汤姆写好匿名信。当天夜里，我偷来那个黄皮肤女仆的裙子，穿在身上，又照他说的，把信从前门底下塞进去。信上只有几句话。
        - id: ch01-b37
          speaker: huck
          text: 小心。祸事正在酝酿。务必严加防备。无名友人。
        - id: ch01-b38
          speaker: huck
          text: 第二天夜里，我们在前门贴了一张骷髅和交叉腿骨的画，是汤姆用血画的。再下一晚，我们又在后门贴上一口棺材。我从没见过哪一家人慌成那样。哪怕屋里塞满鬼魂，每一只都藏在家具后面和床底下等着他们，还有鬼在半空中哆嗦着飘来飘去，他们也不可能吓得更厉害。
        - id: ch01-b39
          speaker: huck
          text: 门砰地响一声，萨莉姨妈会跳起来喊“哎哟”。东西掉到地上，她也会跳起来喊一声。她没留神时，你只要碰她一下，结果还是一样。她朝哪个方向都不安心，总觉得背后藏着什么。所以她老是猛地回头，边转边喊。每次才转过三分之二，她又怕另一边出了事，赶紧转回去，再喊一声。她怕得不敢上床，却也不敢坐着熬夜。
        - id: ch01-b40
          speaker: tom
          text: 这件事进展得再顺利不过了。我从没见过哪件事办得这么叫人满意。这就证明，咱们的办法完全正确。
        - id: ch01-b41
          speaker: huck
          text: 汤姆说，接下来该来最厉害的一招了。第二天清早，天边刚透出一线光，我们又写好一封信，却不知道该怎么送进去。吃晚饭时，我们听说他们会派两个黑人守整夜，前门一个，后门一个。汤姆顺着避雷针爬下去察看，发现后门的守夜人睡着了。他便悄悄走过去，把信插进那人的后衣领，然后顺着避雷针爬了回来。
        - id: ch01-b42
          speaker: huck
          text: 信上说，请不要出卖我，我想做你们的朋友。印第安领地来了一伙穷凶极恶的杀人强盗，今晚要偷走你们抓到的逃奴。先前那些吓人的事都是他们干的，为的是让你们躲在屋里，别出来碍事。
        - id: ch01-b43
          speaker: huck
          text: 我也是他们一伙的，可如今信了教，想退出去，重新过诚实日子。所以我要揭发他们的恶毒计策。午夜整点，他们会从北边沿篱笆偷偷过来，用假钥匙打开黑奴的小屋，把人带走。
        - id: ch01-b44
          speaker: huck
          text: 我会站在远处放风，看见危险本该吹响锡号角。可他们一进去，我不会吹号，只会像绵羊那样咩一声。趁他们忙着解锁链，你们悄悄过去，把他们锁在屋里。到那时，你们爱什么时候杀，就什么时候杀。
        - id: ch01-b45
          speaker: huck
          text: 千万只照我的话办，别做别的。不然他们会起疑心，闹个天翻地覆。我不要奖赏，只想知道自己做了一件正确的事。无名友人。
