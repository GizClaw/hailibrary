        pitch: 低
  chapters:
    - id: ch01
      title: 两拨威尔克斯兄弟
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 人群押来了两个陌生人。老的相貌很体面，年轻的也不差，只是右臂吊着绷带。大家冲着他们又喊又笑，一直不肯停。我却看不出这有什么好笑，只等着看国王和公爵吓白脸。他俩若还能从中看出笑话来，那可真得费一番力气。可那两个家伙一点没慌。公爵装作什么也没察觉，照旧心满意足地咕咕哝哝，像一只往外倒酪浆的罐子。国王更绝。他悲悲切切地低头望着来人，活像世上竟有这种骗子和无赖，叫他从心窝里疼得犯恶心。他演得真是好极了。镇上那些有头脸的人还纷纷围到他身边，明摆着要让他知道，他们全站在他这一边。
        - id: ch01-b02
          speaker: huck
          text: 新来的老先生满脸困惑。他一开口，我就听出那才是真正的英国腔，跟国王学出来的不一样。他转身对众人解释。
        - id: ch01-b03
          speaker: harvey
          text: 眼前的事，我一点也没料到。坦白说，我现在拿不出什么证据，因为我和弟弟一路出了意外。他摔断胳膊，行李昨夜又被错卸在上游的镇子。我是彼得·威尔克斯的哥哥哈维，这位是弟弟威廉。他听不见，也不会说话，如今只能用一只手打手势，更难把意思说明白。再等一两天，我取回行李，就能证明我们的身份。在那以前，我不再多说，只去旅馆等着。
        - id: ch01-b04
          speaker: huck
          text: 哈维带着威廉朝旅馆走去。国王马上大笑起来，冲着众人胡扯。
        - id: ch01-b05
          speaker: king
          text: 胳膊偏在这时候断了，可真巧啊！一个冒牌货没学会打手势，这下正好有借口。行李也丢了！照眼下的情形说，这个理由想得可真聪明！
        - id: ch01-b06
          speaker: huck
          text: 他一笑，几乎所有人都跟着笑。只有三四个人没有笑，也许有五六个。其中一个是罗宾逊医生。另一个刚从汽船下来，提着老式的毯布旅行袋。他正同医生低声商量，两个人不时朝国王望过去，还一起点头。这人就是先前去了路易维尔的律师利维·贝尔。还有个高大粗壮的汉子也没笑。他过来从头听完哈维的话，如今又仔细听国王讲完。国王一闭嘴，他便问了起来。
        - id: ch01-b07
          speaker: hines
          text: 你说自己是哈维·威尔克斯，那你哪一天到的镇上？
        - id: ch01-b08
          speaker: king
          text: 葬礼前一天，朋友。
        - id: ch01-b09
          speaker: hines
          text: 什么时辰？
        - id: ch01-b10
          speaker: king
          text: 傍晚。太阳落山前一两个钟头。
        - id: ch01-b11
          speaker: hines
          text: 你怎么来的？
        - id: ch01-b12
          speaker: king
          text: 我从辛辛那提搭“苏珊·鲍威尔号”下来。
        - id: ch01-b13
          speaker: hines
          text: 那么早晨你为什么坐着独木舟，出现在上游的岬角？
        - id: ch01-b14
          speaker: king
          text: 我早晨根本没去过那里。
        - id: ch01-b15
          speaker: hines
          text: 你撒谎。
          emotion: angry
        - id: ch01-b16
          speaker: huck
          text: 好几个人赶紧拉住他，叫他别这样对一位老人、一位牧师讲话。
        - id: ch01-b17
          speaker: hines
          text: 牧师个鬼！他就是骗子，是个撒谎精。我住在上游，那天早晨也在那里。我亲眼看见他坐独木舟过来，身边还有蒂姆·柯林斯和一个男孩。
          emotion: angry
        - id: ch01-b18
          speaker: doctor
          text: 海因斯，要是再见到那个男孩，你认得出来吗？
        - id: ch01-b19
          speaker: hines
          text: 我想应该认得，不过也说不准。等等，他不就在那儿吗？这个我一眼就认得。
        - id: ch01-b20
          speaker: huck
          text: 他指的就是我。医生随即转向众人。
        - id: ch01-b21
          speaker: doctor
          text: 乡亲们，新来的两位是真是假，我还不敢断定。可是原先这两个若不是骗子，那我就是傻瓜。事情查清以前，不能让他们离开。咱们把这些人都带去旅馆，叫两边当面对质。问到底，总能问出点名堂。
        - id: ch01-b22
          speaker: huck
          text: 人群正巴不得再看一场热闹，虽说替国王撑腰的那些人未必喜欢，于是大家全跟着走了。太阳已经快落山。医生待我倒很和气，一路牵着我的手领我往前，可他的手从头到尾都没松开半分。
    - id: ch02
      title: 旅馆里的审问
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 大家挤进旅馆的一间大屋，点亮蜡烛，又把新来的两人叫进来。医生先提出，要把那袋金子暂时交给镇上的人保管。
        - id: ch02-b02
          speaker: doctor
          text: 我不愿对这两个人太苛刻，可我认为他们是骗子，也许还有同伙。万一同伙带着彼得留下的金子逃掉呢？如果他们问心无愧，就不会反对我们取来钱，代为保管，等身份查明再还给他们。
        - id: ch02-b03
          speaker: huck
          text: 人人都说有道理。我们这一伙一开场就被逼进了死角。国王却摆出悲伤的脸。
        - id: ch02-b04
          speaker: king
          text: 各位先生，我也希望钱还在原处。我绝不会妨碍大家公公平平地查清这桩可悲的事。可是，唉，钱已经不在那里了。你们若不信，尽管派人去看。
        - id: ch02-b05
          speaker: townsman_1
          text: 那钱去了哪里？
        - id: ch02-b06
          speaker: king
          text: 外甥女把钱交给我以后，我把它藏进了床上的草褥子。我们只住几天，没必要存进银行，我以为床上已经够安全了。我们在英国不常接触黑奴，还当他们跟英国仆人一样诚实。谁知第二天早晨，我刚刚下楼，他们便偷走了钱。我卖掉他们的时候还没发现钱不见了，所以他们已经带着钱逃得无影无踪。各位先生，我身边这个仆人可以把经过告诉你们。
        - id: ch02-b07
          speaker: huck
          text: 医生和几个人一齐“呸”了一声，看样子谁也没有完全相信。有人问我是不是亲眼看见黑奴偷钱。我说没有，只看见他们鬼鬼祟祟地走出房间，慌忙离开。我当时没觉得奇怪，只当他们害怕吵醒主人，想趁主人找麻烦以前悄悄脱身。众人只问了我这些，医生却忽然转过来盯着我。
        - id: ch02-b08
          speaker: doctor
          text: 你也是英国人？
        - id: ch02-b09
          speaker: huck
          text: 我说是。医生和几个人都笑起来，只说我胡扯。
        - id: ch02-b10
          speaker: huck
          text: 接下来，他们把所有人翻来覆去地盘问，一问就是一个钟头又一个钟头。没人提晚饭，仿佛世上根本没有晚饭这回事。事情越问越乱。国王得从头讲一遍，真正的哈维也得讲一遍。只要脑袋没叫偏心塞住，谁都看得出老先生讲的是真话，国王讲的是谎话。后来他们把我也叫到前面。国王从眼角偷偷递来一个眼色，我自然知道该帮哪一边说。我开始编谢菲尔德的生活，又编英国的威尔克斯一家。可还没编出多远，医生已经笑出声来，利维·贝尔也叫我停下。
        - id: ch02-b11
          speaker: lawyer
          text: 坐下吧，孩子，别再为难自己了。你平常大概不怎么撒谎，所以做得很不熟练。往后还得多练练，你现在实在太笨拙。
        - id: ch02-b12
          speaker: huck
          text: 这句夸奖我一点也不稀罕，可总算不用再往下编，我心里还是很高兴。医生正要继续说话，忽然转向利维，说他若是一开始就在镇上，事情也不会闹成这样。国王一听见律师的名字，马上打断医生，还热情地伸出手来。
        - id: ch02-b13
          speaker: king
          text: 原来您就是我那可怜亡弟常在信里提起的老朋友！
        - id: ch02-b14
          speaker: huck
          text: 律师笑着跟他握手，看起来很受用。两个人当众谈了一阵，又走到一旁压低声音商量。过了一会儿，律师终于提高嗓门，说他想出了检验笔迹的办法。
        - id: ch02-b15
          speaker: lawyer
          text: 这样办就成了。我把您写的订货单和令弟留下的那份一起寄去，对方一看就知道是真是假。
        - id: ch02-b16
          speaker: huck
          text: 众人马上拿来纸笔。国王坐下，把脑袋歪向一边，嘴里咬着舌头，费尽力气划出几行歪歪扭扭的字。然后，他们把笔递给公爵。直到这一刻，公爵才第一次露出病恹恹的难看脸色。他明知躲不过去，只好接笔写了。两人写完，律师才转向真正的哈维兄弟。
        - id: ch02-b17
          speaker: lawyer
          text: 请您和弟弟各写一两行，再签上名字。
        - id: ch02-b18
          speaker: huck
          text: 哈维动笔写了，可写出的东西屋里谁也认不出来。律师惊讶极了。他飞快从口袋里抽出一大叠旧信，先看信上的字，再看哈维刚写的，接着又回头看那些信，来来回回比了好几次。
        - id: ch02-b19
          speaker: lawyer
          text: 这可把我难住了。这些旧信是哈维·威尔克斯写来的。再看国王和公爵刚留下的两份字迹，任何人都看得出，旧信绝不是他俩写的。可这位老先生的字也对不上。说实在的，他画出的那些道道根本不能算字。现在，我这里还有几封信是……
        - id: ch02-b20
          speaker: harvey
          text: 请听我解释。除了弟弟，没人能认出我的字，所以我的信一向由他誊清。您保存的是他的笔迹，不是我的。
        - id: ch02-b21
          speaker: lawyer
          text: 这可真麻烦。我也留着威廉的信。只要请他写一两行，我们就能比较了。
        - id: ch02-b22
          speaker: harvey
          text: 他不能用左手写字。右手若没受伤，您就会看见，我和他的信都是他写的。请把两边仔细比一比，笔迹出自同一个人。
        - id: ch02-b23
          speaker: huck
          text: 律师重新看过，不得不承认两边非常相像。
        - id: ch02-b24
          speaker: lawyer
          text: 看来的确是同一个人的笔迹。即便不是，两边也比我先前看出的相像得多。我本以为已经走上了解开谜团的正路，这条路如今却又断了一半。不过至少有一件事已经证明。国王和公爵这两个人，谁也不是威尔克斯家的。
        - id: ch02-b25
          speaker: huck
          text: 你猜国王到了这里会认输吗？那个犟得像骡子的老蠢货偏偏不肯。他说这种试法根本不公平，还说自己的弟弟威廉是世上最爱恶作剧的人。威廉刚把笔尖落到纸上，他就看出弟弟故意不肯认真写。国王越说越来劲，一套谎话翻来覆去唱个不停，到后来几乎连他自己也信了。真正的哈维终于插进话来，说他刚刚想到了另一个办法。
        - id: ch02-b26
          speaker: harvey
          text: 在座有没有人帮忙给我弟弟，也就是已故的彼得·威尔克斯入殓？
        - id: ch02-b27
          speaker: ab_turner
          text: 有。我和另一个人料理的，我们都在这里。
        - id: ch02-b28
          speaker: harvey
          text: 那么，也许这位自称哈维的先生能告诉我，彼得胸口刺着什么图案？
        - id: ch02-b29
          speaker: huck
          text: 这句话来得太猛，国王差点像河水掏空根基的陡岸一样垮下去。他怎么可能知道尸体上刺了什么？换了谁冷不防挨上这样结实的一击，只怕都得瘫下来。他终于控制不住，脸白了一点。屋里静得吓人，每个人都微微探身，眼睛紧紧盯着他。我心想，这回他总该认输了，再撑也没有用。谁知他偏不认。我猜，他还想一直拖到大家厌烦散开，那时便能跟公爵挣脱逃走。他坐在那里硬撑了一阵，居然又慢慢笑了。
        - id: ch02-b30
          speaker: king
          text: 嗯哼，这个问题很难，是不是？我当然知道。彼得胸口有一支又小又细的蓝箭，不凑近看就发现不了。现在你还有什么话说？
        - id: ch02-b31
          speaker: huck
          text: 我活到那时，从没见过谁能像这个老无赖一样厚颜无耻。真正的哈维立刻转向那两个入殓的人。他两眼一下亮起来，显然认定这回已经稳稳抓住国王了。
        - id: ch02-b32
          speaker: harvey
          text: 你们都听见了。彼得胸口有过这样的蓝箭吗？
        - id: ch02-b33
          speakers: [ab_turner, burial_helper]
          ensemble: duo
          text: 我们没见到什么蓝箭。
        - id: ch02-b34
          speaker: harvey
          text: 很好。你们真正看见的是一个颜色很淡的小写字母P，一个代表他旧名字的B，还有一个W，字母中间各有一条短线，写成P—B—W。是不是这样？
        - id: ch02-b35
          speakers: [ab_turner, burial_helper]
          ensemble: duo
          text: 也不是。我们根本没看见任何记号。
    - id: ch03
      title: 风暴中的墓地
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 这一下，所有人都乱了。大家认定两边全是骗子，有人叫着把他们浸进水里，有人要直接淹死他们，还有人要绑到木杆上游街。每个人都在同时喊，屋里闹得天翻地覆。律师只好跳上桌子，扯开嗓门压住人声。
        - id: ch03-b02
          speaker: lawyer
          text: 各位先生，请只听我说一句！还有一个办法。咱们把尸体挖出来，亲眼看一看。
        - id: ch03-b03
          speaker: huck
          text: 这主意正合众人的心意。
        - id: ch03-b04
          speakers: [townsman_1, townsman_2, townsman_3, townsman_4]
          ensemble: chorus
          text: 好哇！现在就去！
        - id: ch03-b05
          speaker: huck
          text: 人群拔腿要走，医生和律师赶紧叫住他们。
        - id: ch03-b06
          speakers: [doctor, lawyer]
          ensemble: duo
          text: 等等！把这四个人和那个男孩全抓住，一起带去！
        - id: ch03-b07
          speakers: [townsman_1, townsman_2, townsman_3, townsman_4]
          ensemble: chorus
          text: 就这么办！要是尸体上没有那些记号，就把这一伙全吊死！
          emotion: angry
        - id: ch03-b08
          speaker: huck
          text: 我这回真怕了，可一点办法也没有。他们把四个大人和我全都牢牢抓住，排成一队，径直押往下游一英里半外的墓地。那时才晚上九点，我们闹出的动静却大得惊人，全镇的人都跟在了后面。
        - id: ch03-b09
          speaker: huck
          text: 路过住处时，我后悔把玛丽·简支出城去。她若在家，我只要使个眼色，她就能跑出来救我，再把我们这群骗子全揭穿。
        - id: ch03-b10
          speaker: huck
          text: 大家沿着河边一路涌去，像一群野猫似的吼叫。天也越来越吓人。黑云压下来，闪电忽明忽灭，风钻进树叶，把叶子吹得发抖。这是我有生以来遇过最可怕、最危险的麻烦，脑子都给吓木了。事情跟我的盘算完全不同。我原本已经安排妥当，可以照自己的意思从容行事，看够热闹。真到危险关头，还有玛丽·简替我撑腰，把我救出去。如今她不在，挡在我和突然送命之间的，世上只剩彼得胸口的刺字。要是他们找不到那些字，我就完了。
        - id: ch03-b11
          speaker: huck
          text: 我不敢再想下去，脑子却偏偏什么也不能想，只会绕着这件事打转。天越来越黑，这样的夜色本来最适合甩开人群逃跑。可那个大块头海因斯像铁钳一样攥着我的手腕。从他手里脱身，跟从巨人歌利亚手里逃掉一样难。他兴奋得只管拖着我猛冲，我非得一路小跑才跟得上。
        - id: ch03-b12
          speaker: huck
          text: 人群一到地方便冲进墓地，像涨起来的河水一样漫过整片地方。到了彼得坟前，他们才发现带来的铁锹比真正用得上的多了差不多一百倍，却没有一个人想起带灯笼。大家索性借着闪电立刻开挖，只派一个人去半英里外最近的住家借灯。
        - id: ch03-b13
          speaker: huck
          text: 他们不要命地往下挖。天已经黑得吓人，雨也落下来，风呼呼扫过墓地，闪电越来越密，雷声一阵阵炸开。可这些人一心只想着棺材，根本不理会风雨。白光亮起时，墓地里的一切突然全能看清。大群人的每一张脸，还有一锹锹飞出坟坑的泥土，全在眼前。下一刻，黑暗又把这些东西抹得干干净净，什么都看不到了。
        - id: ch03-b14
          speaker: huck
          text: 棺材终于被抬出来，他们开始一颗颗旋开棺盖上的螺丝。人人都想挤到前头看一眼，又撞又扛又推。黑暗让这场面更加可怕。海因斯也跟着拼命朝前拉扯，攥得我手腕疼得厉害。他一边使劲，一边激动得直喘气，早已忘了世上还有我这个人。
        - id: ch03-b15
          speaker: huck
          text: 忽然，闪电像闸门大开，满天白光倾泻下来。人群里有人喊出了声。
        - id: ch03-b16
          speaker: townsman_1
          text: 活见鬼，彼得胸口上放着那袋金子！
          emotion: surprised
        - id: ch03-b17
          speaker: huck
          text: 海因斯跟所有人一起欢呼，松开我的手腕，拼命往前挤着看。我趁黑拔腿冲向大路，跑得有多快，谁也说不清。
        - id: ch03-b18
          speaker: huck
          text: 整条路都归了我一个人。除了结结实实的黑暗、偶尔闪过的白光、雨的嗡鸣、风的抽打和在头顶炸开的雷声，再没有任何东西陪着我。我使出全身力气往前跑，简直是在飞。
    - id: ch04
      title: 刚刚得到的自由
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 我冲进镇子，暴风雨里一个人也没有。我顾不上再绕什么后街，直接沿着大街狂奔。快到我们住的地方时，我早早盯住了那栋房子。里面一点灯光也没有，整栋房子黑沉沉的。不知为什么，看到它这样黑着，我竟觉得又难过又失望，自己也说不出缘故。
        - id: ch04-b02
          speaker: huck
          text: 就在我飞奔过去的最后一刻，玛丽·简的窗口突然闪出了灯光。我的心一下胀起来，几乎撑破胸口。可也就在同一瞬间，那栋房子和里面的一切已经被我甩在身后的黑暗里，这辈子再也不会出现在我面前。玛丽·简是我见过最好的姑娘，也是最有胆量的一个。
        - id: ch04-b03
          speaker: huck
          text: 我跑到镇子上游足够远的地方，看准自己能划到河心的沙洲，便睁大眼睛四处找船。第一次有闪电照出一条没上锁链的船，我马上把它夺过来，解开唯一拴着的绳子，推进水里。那是条独木舟。沙洲离岸远得要命，孤零零待在大河中央，可我一刻也没耽误。终于靠上木筏时，我已经累得快瘫了。若不是急着逃命，我真想立刻躺下，只管喘气。可是我没有。我一跳上木筏便放声大喊。
        - id: ch04-b04
          speaker: huck
          text: 快出来，吉姆，把筏子解开！谢天谢地，我们总算甩掉他们了！
          emotion: happy
        - id: ch04-b05
          speaker: huck
          text: 吉姆立刻冲出来，张开双臂朝我迎来，欢喜得不得了。闪电正好一亮，我看清他的模样，吓得心直冲到嗓子眼，人也仰面掉进水里。我早忘了他还同时扮着老李尔王和一个淹死的阿拉伯人。黑夜里猛然见到那副脸，差点把我的五脏六腑全吓飞。
        - id: ch04-b06
          speaker: huck
          text: 吉姆把我从水里捞上来。他正想抱住我，好好庆祝我回来了，也庆祝我们摆脱了国王和公爵，我却急忙拦住他。
        - id: ch04-b07
          speaker: huck
          text: 现在顾不上，留到早饭时再庆祝！快解绳子，让木筏顺水走！
        - id: ch04-b08
          speaker: huck
          text: 不到两秒，木筏已经离开沙洲，顺着河水滑去。重新得到自由，只有我们两个待在宽阔的大河上，再也没有人来烦，那滋味实在太好了。我兴奋得忍不住在筏子上蹦来跳去，还接连跃起来，把两只脚跟在半空碰了几下。
        - id: ch04-b09
          speaker: huck
          text: 大约碰到第三下时，我突然听见一种熟得不能再熟的声音，立刻屏住呼吸，侧耳等着。下一道闪电劈开黑暗，照亮河面时，他们果然来了。两个人正俯着身子拼命划桨，划得那条小艇嗡嗡作响。来人正是国王和公爵。
        - id: ch04-b10
          speaker: huck
          text: 我当场软了下来，一下瘫倒在木筏的木板上，彻底死了心。刚刚得到的自由就这样没了。我拼尽全身力气，才勉强忍住，没有当场哭出来。
