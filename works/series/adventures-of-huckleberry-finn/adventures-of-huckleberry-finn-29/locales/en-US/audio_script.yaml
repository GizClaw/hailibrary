  chapters:
    - id: ch01
      title: CHAPTER XXIX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: They were bringing along a fine-looking old gentleman and a younger one with his right arm in a sling. The people yelled and laughed without stopping, and the noise went on and on. I could not see anything funny in it. I figured the sight would put a strain on the duke and the king, and I expected both of them to turn pale right then. Not a trace of paleness showed on either face.
        - id: ch01-b02
          speaker: huck
          text: The duke never gave the slightest sign that he understood what was happening. He moved around looking happy and satisfied, bubbling like a jug pouring out buttermilk. The king was even better. He kept gazing sadly at the newcomers, as if the thought of such frauds and rascals gave him a pain in the heart. It was an admirable performance. A great many of the town's leading men gathered around him so he could see that they were on his side.
        - id: ch01-b03
          speaker: huck
          text: The old newcomer looked completely bewildered. Then he spoke, and I knew at once that he sounded English. It was nothing like the king's imitation, though the king's imitation was pretty good. I cannot give his exact words or copy his way of speaking, but this is about what he told the crowd.
        - id: ch01-b04
          speaker: harvey
          text: I never expected a welcome like this, and I admit I am not well prepared to answer it. My brother and I have had bad luck. He broke his arm, and our baggage was mistakenly put off at a town upriver last night. I am Peter Wilks's brother Harvey. This is our brother William. He cannot hear or speak, and with only one useful hand, he can hardly make signs either. We are telling the truth. When our baggage arrives in a day or two, I can prove it. Until then, I will say no more. We will wait at the hotel.
        - id: ch01-b05
          speaker: huck
          text: Harvey and the new deaf-mute brother started away. The king laughed and burst out with his answer.
        - id: ch01-b06
          speaker: king
          text: A broken arm! How very likely, and how handy for a fraud who must make signs but never learned how. And their baggage is lost! Mighty clever, considering the trouble they are in.
        - id: ch01-b07
          speaker: huck
          text: He laughed again, and nearly everybody joined him. Only three or four held back, maybe half a dozen. The doctor was one of them. Another was a sharp-looking gentleman carrying an old-fashioned bag made from carpet cloth. He had just stepped off the steamboat. This was Levi Bell, the lawyer who had been away in Louisville. He and the doctor spoke quietly, glancing at the king now and then and nodding to each other. A big, rough fellow had come up and listened closely to everything Harvey said. He listened to the king too, and when the king finished, the fellow began asking questions.
        - id: ch01-b08
          speaker: hines
          text: If you are Harvey Wilks, when did you get to town?
        - id: ch01-b09
          speaker: king
          text: The day before the funeral, friend.
        - id: ch01-b10
          speaker: hines
          text: What time was that?
        - id: ch01-b11
          speaker: king
          text: In the evening, an hour or two before sundown.
        - id: ch01-b12
          speaker: hines
          text: And how did you come?
        - id: ch01-b13
          speaker: king
          text: Down from Cincinnati on the Susan Powell.
        - id: ch01-b14
          speaker: hines
          text: Then what were you doing up at the Point that morning, in a canoe?
        - id: ch01-b15
          speaker: king
          text: I was not at the Point that morning.
        - id: ch01-b16
          speaker: hines
          text: That is a lie.
          emotion: angry
        - id: ch01-b17
          speaker: huck
          text: Several men jumped toward Hines and begged him not to speak that way to an old man and a preacher.
        - id: ch01-b18
          speaker: hines
          text: Preacher, nothing! He is a liar and a fraud. I live at the Point, and I was there that morning. So was he. I saw him come in a canoe with Tim Collins and a boy.
          emotion: angry
        - id: ch01-b19
          speaker: doctor
          text: Hines, would you recognize that boy if you saw him again?
        - id: ch01-b20
          speaker: hines
          text: I reckon so, though I cannot be certain. Wait, there he is now. I know him easily.
        - id: ch01-b21
          speaker: huck
          text: He pointed straight at me. The doctor spoke to the neighbors.
        - id: ch01-b22
          speaker: doctor
          text: I cannot say whether the newcomers are frauds. But if these first two are honest, then I am an idiot. We ought to keep them here while we look into this. Come on, Hines, and all the rest of you. We will take them to the tavern, put both pairs face-to-face, and find out something before we finish.
        - id: ch01-b23
          speaker: huck
          text: The crowd loved that idea. It promised them plenty of excitement, though the king's friends probably liked it less. We all set out together, and by then the sun was going down. The doctor took me by the hand as we walked. He treated me kindly enough the whole way, but there was one thing I noticed. No matter what happened, he never once loosened his grip or let my hand go.
        - id: ch01-b24
          speaker: huck
          text: We packed into a large hotel room, lit candles, and brought in the newcomers. The doctor addressed everyone first.
        - id: ch01-b25
          speaker: doctor
          text: I do not want to treat these men unfairly, but I believe they are frauds. They may have partners we know nothing about. If so, those partners could escape with the gold Peter Wilks left. Honest men will not object if we send for the money and hold it until they prove who they are. Is that fair?
        - id: ch01-b26
          speakers: [townsman_1, townsman_2, townsman_3, townsman_4]
          ensemble: chorus
          text: Yes, that is fair.
        - id: ch01-b27
          speaker: huck
          text: That put our gang in a tight place right from the start. The king only looked mournful.
        - id: ch01-b28
          speaker: king
          text: Gentlemen, I wish the money were there. I would never stand in the way of a fair and open investigation into this miserable affair. But sadly, the money is gone. Send someone to look if you wish.
        - id: ch01-b29
          speaker: townsman_1
          text: Then where is it?
        - id: ch01-b30
          speaker: king
          text: When my niece asked me to keep it, I hid it in the straw mattress on my bed. We would only be here a few days, so I saw no need for a bank. We were used to honest English servants and knew no better. The enslaved people stole it the next morning after I came downstairs. I had not noticed the loss when I sold them, so they escaped with it. My servant can tell you what happened.
        - id: ch01-b31
          speakers: [doctor, townsman_2, townsman_3]
          ensemble: chorus
          text: Nonsense!
        - id: ch01-b32
          speaker: huck
          text: Nobody seemed to believe him completely. One man asked whether I had watched the enslaved people steal the money.
        - id: ch01-b33
          speaker: huck
          text: No, sir. I only saw them slipping out of the room and hurrying away. I thought they feared they had awakened my master and wanted to leave before he made trouble for them.
        - id: ch01-b34
          speaker: huck
          text: That was all they asked me about the money. Then the doctor turned on me.
        - id: ch01-b35
          speaker: doctor
          text: Are you English too?
        - id: ch01-b36
          speaker: huck
          text: Yes, sir.
        - id: ch01-b37
          speakers: [doctor, townsman_1, townsman_2]
          ensemble: chorus
          text: Oh, come now!
        - id: ch01-b38
          speaker: huck
          text: Then they plunged into the full investigation. Questions and answers went back and forth, hour after hour. Nobody said a word about supper. Nobody even seemed to remember there was such a thing. They kept at it until the whole affair was the most tangled mess I had ever seen. They made the king tell his story from beginning to end, then made Harvey give his. Any sensible person without a mind already made up could have heard the difference. Harvey was telling the truth, and the king was spinning lies.
        - id: ch01-b39
          speaker: huck
          text: Eventually they called on me. The king shot me a sideways look, so I knew which story I had better support. I started talking about Sheffield, our life there, and the English Wilkses. I had not gone far when the doctor laughed and Levi Bell stopped me.
        - id: ch01-b40
          speaker: levi_bell
          text: Sit down, son. I would not wear myself out if I were you. Lying does not come naturally to you. You need more practice, because you are doing it badly.
        - id: ch01-b41
          speaker: huck
          text: I did not care for the compliment, but I was glad to be excused. The doctor began telling Levi how things might have gone if he had been in town sooner. Then the king cut in and held out his hand.
        - id: ch01-b42
          speaker: king
          text: Why, can this be my poor dead brother's dear friend, the man he wrote about so often?
        - id: ch01-b43
          speaker: huck
          text: The lawyer shook his hand. He smiled and seemed pleased. They talked for a while, then moved aside and lowered their voices. At last Levi spoke up.
        - id: ch01-b44
          speaker: levi_bell
          text: This will settle it. Give me a written order. I will send it with one from your brother, and then the people who receive them will know everything is proper.
        - id: ch01-b45
          speaker: huck
          text: Someone brought paper and a pen. The king sat down to write. He twisted his head sideways, stuck to the work, and chewed his tongue while he scratched out an order. Then they handed the pen to the duke. That was the first moment when the duke looked truly sick. Still, he had no choice but to take the pen and write his part. When both of them had finished, the lawyer turned toward the newcomers and asked the real brothers to do the same.
        - id: ch01-b46
          speaker: levi_bell
          text: Please write a line or two, both of you, and sign your names.
        - id: ch01-b47
          speaker: huck
          text: Harvey wrote, but nobody could read it. Levi stared at the page in surprise.
        - id: ch01-b48
          speaker: levi_bell
          text: Well, this defeats me.
        - id: ch01-b49
          speaker: huck
          text: He pulled out a bundle of old letters and compared them with Harvey's writing. Then he compared them all again.
        - id: ch01-b50
          speaker: levi_bell
          text: These old letters came from Harvey Wilks. Neither of those first two men wrote them. And this older gentleman did not write them either. His marks hardly count as writing. Now, here are some letters from—
        - id: ch01-b51
          speaker: huck
          text: The king and duke looked foolish when they realized how Levi had trapped them. But Harvey interrupted before the lawyer finished.
        - id: ch01-b52
          speaker: harvey
          text: Please let me explain. Only my brother can read my handwriting, so he copies my letters for me. The writing you have is his, not mine.
        - id: ch01-b53
          speaker: levi_bell
          text: Well! This gets stranger every minute. I have letters from William too. Have him write a line so we can compare them.
          emotion: surprised
        - id: ch01-b54
          speaker: harvey
          text: He cannot write with his left hand. If his right arm were well, you would see that he wrote both his letters and mine. Compare the old letters. The same hand wrote both sets.
        - id: ch01-b55
          speaker: huck
          text: Levi examined them.
        - id: ch01-b56
          speaker: levi_bell
          text: I believe you are right. If not, the handwriting is certainly far more alike than I first noticed. I thought we had found our answer, but part of it has slipped away. Still, one thing is proven. The king and duke are not the Wilks brothers.
        - id: ch01-b57
          speaker: huck
          text: You might think that would have ended it, but the stubborn old king still would not surrender. Not for a moment. He declared that the test had been unfair. According to him, his brother William was the greatest joker in the world and had not made a real attempt to write. The king claimed he had spotted the joke as soon as William touched pen to paper. Then he warmed to his own story. He warbled on and on until he seemed close to believing every word himself. Before he could carry it any further, Harvey cut in with a new thought.
        - id: ch01-b58
          speaker: harvey
          text: I have just remembered something. Is anyone here who helped prepare my brother Peter's body for burial?
        - id: ch01-b59
          speaker: townsman_1
          text: Ab Turner and I did. We are both here.
        - id: ch01-b60
          speaker: harvey
          text: Then perhaps this gentleman can tell us what was tattooed on Peter's chest.
        - id: ch01-b61
          speaker: huck
          text: That question struck the king without warning. He had to pull himself together fast, or he would have collapsed like a riverbank with the earth washed out beneath it. It was the kind of blow that would have flattened almost anyone. After all, how could he possibly know what had been tattooed on Peter's chest? He turned a little pale in spite of himself. The room went so still that everybody seemed to lean forward at once, watching his face. I told myself that he had finally reached the end and would give up. But he did not. I reckon he planned to keep the game going until the crowd got tired and thinned out. Then he and the duke might break loose. Whatever he was thinking, he sat there a moment and slowly began to smile.
        - id: ch01-b62
          speaker: king
          text: That is a difficult question, is it not? But yes, I can answer it. Peter had a small, thin blue arrow on his chest. You could miss it if you did not look closely. Now what do you say to that?
        - id: ch01-b63
          speaker: huck
          text: I had never seen such pure nerve in anyone. Harvey turned quickly to the two men who had prepared the body. His eyes lit up as if he had caught the king at last.
        - id: ch01-b64
          speaker: harvey
          text: You heard him. Did Peter have any mark like that on his chest?
        - id: ch01-b65
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: No, we saw no blue arrow.
        - id: ch01-b66
          speaker: harvey
          text: Good. What you did see was a faint P, then a B from a name he stopped using when he was young, and then a W. There was a dash between each letter. P, dash, B, dash, W. Was that the mark?
        - id: ch01-b67
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: No. We never saw any marks at all.
        - id: ch01-b68
          speaker: huck
          text: That threw everybody into an uproar.
        - id: ch01-b69
          speakers: [townsman_1, townsman_2, townsman_3, townsman_4]
          ensemble: chorus
          text: They are all frauds! Duck them! Drown them! Ride them out on a rail!
          emotion: angry
        - id: ch01-b70
          speaker: huck
          text: Everyone shouted at once until Levi jumped onto a table and yelled over them.
        - id: ch01-b71
          speaker: levi_bell
          text: Gentlemen, please listen to one word! There is still a way to know. Let us dig up the body and look.
        - id: ch01-b72
          speaker: huck
          text: The crowd seized on that idea and started for the door, but the lawyer and doctor called them back.
        - id: ch01-b73
          speakers: [levi_bell, doctor]
          ensemble: duo
          text: Wait! Grab all four men and the boy, and bring them too!
        - id: ch01-b74
          speakers: [townsman_1, townsman_2, townsman_3, townsman_4]
          ensemble: chorus
          text: We will! And if those marks are not there, we will hang the whole gang!
          emotion: angry
        - id: ch01-b75
          speaker: huck
          text: Now I was truly scared. There was no chance to slip away because the crowd had a firm grip on every one of us. They marched all four men and me straight toward the graveyard, which stood a mile and a half downriver. The whole town came pouring behind us. We made enough noise to wake anyone along the road, and the night was still young. It was only about nine o'clock.
        - id: ch01-b76
          speaker: huck
          text: When we passed the house, I wished I had not sent Mary Jane away. If I could warn her now, she could run out, save me, and expose those swindlers.
        - id: ch01-b77
          speaker: huck
          text: We poured down the river road, carrying on like wildcats. The sky grew darker above us. Lightning began to wink and flutter, and the rising wind shivered through the leaves. I had never been caught in trouble so awful or so dangerous. I felt half stunned because everything had turned out opposite to my plan. I had expected to take my own time and watch the excitement if I chose. Mary Jane was supposed to be behind me, ready to save me and set me free when matters got too close. Instead, there was nothing in the world between me and sudden death but those tattoo marks on Peter's chest. If the crowd did not find them—
        - id: ch01-b78
          speaker: huck
          text: I could not bear the thought, but I could think of nothing else. The night grew darker, perfect for slipping away. Yet Hines held my wrist. Escaping him would have been like escaping a giant. He was so excited that he dragged me along, and I had to run to keep up.
        - id: ch01-b79
          speaker: huck
          text: When we reached the graveyard, the crowd swarmed through the gate and washed over the ground like a flood. They closed around Peter's grave with about a hundred times more shovels than the work required. In all their excitement, though, not one person had remembered to bring a lantern. That did not stop them. They went straight to digging whenever the flickering lightning gave them enough light to see. Meanwhile, they sent one man to the nearest house to borrow a lantern, even though the house was half a mile away.
        - id: ch01-b80
          speaker: huck
          text: They dug with all their strength while the darkness thickened around them. Rain started falling. The wind swished and rushed through the graveyard, the lightning flashed faster and faster, and thunder boomed overhead. The people were so wrapped up in the digging that they paid no attention to the storm. For one bright instant, I could see everything. Every face in that large crowd stood out, and every shovelful of dirt showed as it sailed from the grave. A second later, the darkness wiped the whole scene away, and I could see nothing at all.
        - id: ch01-b81
          speaker: huck
          text: At last the shovels reached the coffin. The men hauled it out of the grave and started turning the screws in its lid. Then came such crowding, shouldering, and shoving as I had never seen. Everybody fought to squeeze close enough for the first look inside. In that storm and darkness, the struggle felt terrible. Hines kept yanking and twisting my wrist until the pain was fierce. He panted with excitement and pulled so blindly that I believe he had completely forgotten I was there.
        - id: ch01-b82
          speaker: huck
          text: Then lightning poured down a great sheet of white glare, and somebody shouted.
        - id: ch01-b83
          speaker: townsman_3
          text: By the living jingo, the bag of gold is lying on his chest!
          emotion: surprised
        - id: ch01-b84
          speaker: huck
          text: Hines whooped with the rest and dropped my wrist. He surged forward to see. I shot away through the darkness and raced for the road before anybody knew what happened.
        - id: ch01-b85
          speaker: huck
          text: The road was mine, except for the solid dark, sudden flashes, buzzing rain, thrashing wind, and splitting thunder. I flew along as fast as my legs could carry me.
        - id: ch01-b86
          speaker: huck
          text: No one was out when I reached town, so I ran straight up the main street. Near the house, I fixed my eyes on it. There was no light. Seeing it dark made me sorry and disappointed, though I did not know why.
        - id: ch01-b87
          speaker: huck
          text: Just as I rushed past, light flashed in Mary Jane's window. My heart swelled until it nearly burst. A second later, the house was behind me in the darkness, and I knew I would never see it again. She was the best girl I ever knew, and the bravest.
        - id: ch01-b88
          speaker: huck
          text: The moment I reached a place far enough above town to make for the towhead, I began watching for a boat I could borrow. A lightning flash finally showed me one that was not chained. It was a canoe held by nothing but a rope. I snatched it, shoved away from shore, and started paddling. The towhead was a tremendous distance out in the middle of the river, but I did not waste a second. When I finally struck the raft, I was worn out. If I could have afforded it, I would have dropped down just to breathe and gasp. I could not. I sprang aboard and shouted for Jim.
        - id: ch01-b89
          speaker: huck
          text: Get out here, Jim, and turn her loose! Thank goodness, we are finally rid of them!
          emotion: happy
        - id: ch01-b90
          speaker: huck
          text: Jim rushed toward me with both arms spread, overjoyed. Then lightning showed him to me, and my heart jumped into my mouth. I had forgotten he was painted up as King Lear and a drowned Arab together. The sight scared me so badly that I fell backward into the river.
        - id: ch01-b91
          speaker: huck
          text: Jim pulled me out. He wanted to hug and bless me because I was safely back and we were free of the king and duke, but I stopped him.
        - id: ch01-b92
          speaker: huck
          text: Save it for breakfast, Jim! Cut us loose and let the raft go!
        - id: ch01-b93
          speaker: huck
          text: In two seconds, Jim had us loose, and the raft was sliding downriver. It felt so good to be free again. There we were, by ourselves on the great river, with no one around to bother us. The relief had to come out somehow. I skipped around the raft, jumped into the air, and cracked my heels together. Then I did it again, because I simply could not help myself.
        - id: ch01-b94
          speaker: huck
          text: On about the third jump, I heard a sound I knew too well. I held my breath and waited. The next flash lit the water, and there they came, pulling hard enough to make their skiff hum. It was the king and the duke.
        - id: ch01-b95
          speaker: huck
          text: I wilted down onto the planks and gave up. I could barely keep from crying.
