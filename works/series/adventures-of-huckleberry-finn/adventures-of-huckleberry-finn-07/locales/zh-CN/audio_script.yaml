audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    pap:
      display_name: 爸爸
      tts:
        delivery: 粗暴多疑，醉意里带着蛮横和自怜
        timbre: 沙哑粗粝
        pace: 忽快忽慢
        pitch: 低
    ferryman_1:
      display_name: 渡口汉子甲
      tts:
        delivery: 熬夜犯困，说起闲话却很起劲
        timbre: 粗厚随和
        pace: 松散
        pitch: 中低
    ferryman_2:
      display_name: 渡口汉子乙
      tts:
        delivery: 爱逗趣，讲冷笑话时自鸣得意
        timbre: 明亮粗犷
        pace: 轻快
        pitch: 中
    ferryman_3:
      display_name: 渡口汉子丙
      tts:
        delivery: 睡意浓重，被吵醒时不耐烦
        timbre: 低哑含混
        pace: 缓慢
        pitch: 低
    raft_man:
      display_name: 木排上的汉子
      tts:
        delivery: 隔水喊号，干脆有力
        timbre: 洪亮结实
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 第七章
      blocks:
        - id: ch01-b01
          speaker: pap
          text: 起来！你在搞什么？
        - id: ch01-b02
          speaker: huck
          text: 我睁眼四下看了看，一时还弄不清自己在哪儿。太阳已经出来了，我刚才睡得很死。爸爸站在跟前，脸色又阴又难看，整个人也像病了一场。
        - id: ch01-b03
          speaker: pap
          text: 你抱着这杆枪干什么？
        - id: ch01-b04
          speaker: huck
          text: 我看他一点也不记得昨晚干了什么，就说有人想闯进来，我拿枪守着那个人。
        - id: ch01-b05
          speaker: pap
          text: 那你怎么不叫醒我？
        - id: ch01-b06
          speaker: huck
          text: 我叫过了，可怎么推你，你都醒不了。
        - id: ch01-b07
          speaker: pap
          text: 行了，别站在这里废话一整天。出去看看钓线上有没有鱼，咱们好吃早饭。我马上就来。
        - id: ch01-b08
          speaker: huck
          text: 他开了锁，我赶紧沿河岸往上游走。水上有断枝和零星树皮漂下来，我便知道河水涨起来了。六月涨水一向给我带来好运。只要水势一起来，劈好的木柴和散了架的木排就会接连漂过，有时十来根圆木还捆在一起。要是在镇上，我这会儿准能好好忙活一阵。把东西截住，再卖给木柴场或锯木厂，就能换钱。
        - id: ch01-b09
          speaker: huck
          text: 我一面提防爸爸，一面盯着水里漂来的东西。忽然，我看见一只顶漂亮的独木舟，足有十三四英尺长，像鸭子一样浮得高高的。我穿着全身衣服，从岸上一头扎进水里，朝它游去。
        - id: ch01-b10
          speaker: huck
          text: 我原以为船里会躺着一个捉弄人的家伙。人们常这么干。等别人费劲划着小船，眼看就要靠上去，他们才突然坐起来，笑那人上当。可这次真是只随水漂来的空船。我爬进去，划回岸边，先想到的是老头子见了准高兴，这船能值十块钱。可爸爸还没出现。我把船驶进一条像深沟的小水道，两旁爬满藤蔓，柳枝也低低垂着。就在这时，我忽然改了主意。
        - id: ch01-b11
          speaker: huck
          text: 我决定把船藏牢。这样逃走时就不用徒步钻林子，受一路跋涉的罪。我可以顺流走上五十英里，找个地方安顿下来。藏船时，我总觉得爸爸就要到了。等我藏妥，探头一看，他还在小路远处举枪瞄鸟，什么也没发现。
        - id: ch01-b12
          speaker: huck
          text: 爸爸过来时，我正装作忙得不得了，使劲收那根多钩钓线。他嫌我动作太慢，照例骂了几句。我说自己掉进了河里，所以才耽搁这么久。我浑身湿透，若不先编个说法，他看见了准要追问。我们从线上取下五条鲶鱼，一起带回了家。
        - id: ch01-b13
          speaker: huck
          text: 早饭以后，我们都累坏了，便躺下补觉。我却一直在想，光靠运气逃远并不稳妥。在他们发现我不见以前，什么岔子都可能冒出来。要是能想个办法，让爸爸和寡妇相信根本没必要追我，那才真正安全。可我琢磨了半天，一点头绪也没有。后来爸爸短短坐起一会儿，又猛灌了一大通水。
        - id: ch01-b14
          speaker: pap
          text: 下回再有人偷偷摸到这里，你就叫醒我，听见没有？那个人准没安好心。我要是醒着，早开枪打死他了。下回一定叫我！
        - id: ch01-b15
          speaker: huck
          text: 他说完又倒头睡了。偏偏就是这几句话，送来了我一直等着的办法。我现在能把事情布置好，叫谁都不会想到追我。
        - id: ch01-b16
          speaker: huck
          text: 中午前后，我们沿岸往上游走。河水涨得很急，漂木一件接一件地过去。不久，一截木排顺流而来，九根圆木牢牢捆在一起。我们划小船出去，把它拖上岸，然后才吃午饭。换成任何别人，准会再守上一整天，看看还能捞到什么。爸爸可不是那样。九根圆木已经够他卖一回，他非得立刻过河进城不可。
        - id: ch01-b17
          speaker: huck
          text: 三点半左右，他把我锁进屋，划着小船拖走木排。我猜他夜里不会回来。等他走远，我拿出木锯接着锯圆木。爸爸还没到河对岸，我已经钻出了缺口。远远望去，他和木排只剩水上的一个小黑点。
        - id: ch01-b18
          speaker: huck
          text: 我先把那袋玉米面送到藏船处，拨开藤条和树枝，把它塞进去。接着是整扇咸猪肉和威士忌酒罐。屋里全部的咖啡、糖、弹药和塞枪膛的麻絮，也都归了我。木桶、葫芦、长柄水勺、白铁杯、旧木锯、两条毯子、煎锅、咖啡壶、钓线和火柴，我一样没落。凡是值一个子儿的东西，全叫我搬空了。屋里没有别的斧头，只有柴堆边那一把。我知道为什么得把它留下。最后，我带出了枪，这才算收拾齐全。
        - id: ch01-b19
          speaker: huck
          text: 我从缺口里爬进爬出，又拖了那么多东西，早把外面的泥地磨得很显眼。我只好在上面撒一层尘土，盖住光滑的地面和锯末。然后把锯下来的木头嵌回原处，底下垫两块石头，旁边再抵一块。那根木头有点向上弯，挨不紧地面，不过只要站在四五英尺外，又不知道它被锯过，绝对看不出什么。再说，那是木屋背面，本来也没人会跑去乱看。
        - id: ch01-b20
          speaker: huck
          text: 通往独木舟的路上全是草，没有脚印。我绕着查看一遍，又到岸边望望河面，哪儿都安全。随后我带枪进了林子，本想打几只鸟，却遇到一头从农场跑出来后变野的猪。我把它打死，拖回木屋。
        - id: ch01-b21
          speaker: huck
          text: 我抡斧砸破木门，又劈又砍，费了不少力气。然后把野猪拖到桌边，用斧头砍开它的喉咙，让血流在那片硬邦邦的泥地上。屋里可没有木地板。
        - id: ch01-b22
          speaker: huck
          text: 接着，我找来一只旧口袋，往里面装大石头，一直装到自己勉强拖得动。我从野猪躺着的地方开始拖，拖出木门，穿过林子，一直拖到河边，然后把整只口袋推进水里。它立刻沉得无影无踪，地上却留下一条清楚的拖痕，任谁看了都会以为有个重东西被拖走。我真希望汤姆·索亚也在。他一定喜欢这件事，还会添上许多漂亮的花招。要讲这种排场，谁也比不过汤姆。
        - id: ch01-b23
          speaker: huck
          text: 我又扯下几根头发，把斧头抹满血，将头发粘在斧背上，再把斧头丢进墙角。我用外套裹住野猪，抱着它走到木屋下游很远的地方，免得血滴一路，然后把它投入河中。
        - id: ch01-b24
          speaker: huck
          text: 我又想到一个主意，便从独木舟取回玉米面和木锯，把面袋放回原来摆着的地方，再用锯割破袋底。这里连刀叉都没有，爸爸做饭什么事都靠他的折刀。我扛起不断漏面的口袋，穿过草地，又钻过木屋东边的柳丛，走了大约一百码，来到那个足有五英里宽的浅水湖。湖里长满芦苇，时令一到，也满是野鸭。
        - id: ch01-b25
          speaker: huck
          text: 湖另一边有一条沼泽水道，或许是小溪，通往许多英里外，却不通大河。我一路撒出玉米面，直到湖边，还故意丢下爸爸的磨刀石，装成不小心落下的样子。随后我扎住袋口，把面袋和木锯送回独木舟。
        - id: ch01-b26
          speaker: huck
          text: 天快黑了。我让独木舟顺流滑到岸边的垂柳底下，把船系在树上，等着月亮升起。我吃了点东西，又躺在船里抽烟斗，把整个计划细想一遍。他们会顺着石袋的拖痕找到河边，以为我被杀以后扔进了水里，于是下河打捞。也会跟着玉米面的细痕走到湖边，再顺着流出去的水道到处追查，以为强盗杀了我，还抢走了屋里的东西。
        - id: ch01-b27
          speaker: huck
          text: 在大河里，他们只会找一具死尸，绝不会找活着的我。等捞烦了，也就不再管了。那时我想住哪儿都成。杰克逊岛就合适，我熟悉那里，而且从没人去。夜里我还能划到镇边，偷偷寻找需要的东西。就这么定了。
        - id: ch01-b28
          speaker: huck
          text: 我实在太累，不知什么时候睡了过去。醒来的头一会儿，我竟想不起身在何处，心里一惊，赶紧坐起来四下张望，这才记起一切。河面仿佛宽了好几英里。月光亮得很，几百码外的漂木，一根根黑沉沉、无声地滑过去，我甚至能数清有多少根。四周静得像什么都停住了。看样子夜已经很深，连空气闻起来也有一种夜深的味道。你明白我的意思，只是我找不到合适的话来说。
        - id: ch01-b29
          speaker: huck
          text: 我打了个大哈欠，伸过懒腰，正要解开缆绳，忽然听见水面远处传来声音。仔细一听，那是静夜里船桨在桨叉上来回摇动的低响，一下接着一下。我从柳枝间望出去，看见河上有一只小划子朝我靠近。
        - id: ch01-b30
          speaker: huck
          text: 起初，我看不出船里有几个人。它一直向我这边驶来，等到了正对我的水面，我才发现船上只有一个人。我猜也许是爸爸，尽管原本没想到他会来。小船先顺流滑到我的下游，过了一会儿，又借着岸边的缓水绕回来。从我身边经过时近得很，我只要把枪伸出去，就能碰到船上的人。果然是爸爸。看他划桨的样子，人还清醒得很。
        - id: ch01-b31
          speaker: huck
          text: 我立刻解缆，藏在岸边阴影里，轻快又安静地往下游划。走了两英里半，我又朝河心划出四分之一英里多。前面就是渡口码头，我怕有人看见我，出声招呼。我钻进漂木中间，躺到船底，让独木舟自己漂。
        - id: ch01-b32
          speaker: huck
          text: 我在船底舒舒服服躺着歇息，一面抽烟斗，一面望着没有一丝云的天空。月光下仰面看，天空深得不得了，这是我从前从没发现的事。这样的夜里，人的耳朵也像忽然变灵了，声音能沿着水面传出老远。渡口码头有人闲谈，他们说什么，我连每个字都听得一清二楚。
        - id: ch01-b33
          speaker: ferryman_1
          text: 眼下白天越来越长，夜晚越来越短了。
        - id: ch01-b34
          speaker: ferryman_2
          text: 我看今晚可不算短。
        - id: ch01-b35
          speaker: huck
          text: 两个人都笑起来。那个讲笑话的人觉得实在太妙，又把原话重复一遍，于是他们再笑一回。还不够，他们又叫醒另一个同伴，特意把这句妙话讲给他听。
        - id: ch01-b36
          speaker: ferryman_3
          text: 少来烦我！
          emotion: angry
        - id: ch01-b37
          speaker: ferryman_1
          text: 我回去要把这话讲给我家老婆听，她准觉得有意思。不过说真的，跟我从前讲过的那些妙话比，这一句还算不了什么。
        - id: ch01-b38
          speaker: ferryman_2
          text: 都快到三点了。只盼天亮别再叫咱们等上一个礼拜。
        - id: ch01-b39
          speaker: huck
          text: 说话声渐渐远去，我再也分辨不出字句，只听到模糊的咕哝，偶尔还有一阵遥远的笑声。
        - id: ch01-b40
          speaker: huck
          text: 我已经漂过渡口。站起身一看，杰克逊岛就在下游两英里半左右，立在河心。岛上密林黑压压的，整座岛又大又结实，活像一艘没亮灯的汽船。岛头的沙洲已经全被水淹没了。
        - id: ch01-b41
          speaker: huck
          text: 急流推得很猛，我没花多少时间便飞快越过岛头。随后，我转进没有水流的地方，从朝着伊利诺伊州河岸的那一面上岸。我知道岸边有一个很深的凹口，就把独木舟驶进去。入口全让柳枝挡着，我得用手拨开枝条才能进。等船系牢以后，从外头谁也瞧不见它。
        - id: ch01-b42
          speaker: huck
          text: 我走到岛头，在一根圆木上坐下。眼前是宽阔的大河和黑色的漂木。再往远处看，三英里外的镇子只剩三四点闪烁的灯火。上游约一英里的地方，一张大得惊人的木排正慢慢顺流爬下来，中间亮着一盏灯。我一直望着它越来越近。等它差不多到了我面前，水上忽然传来一声号令，清楚得就像那个人站在我身边。
        - id: ch01-b43
          speaker: raft_man
          text: 船尾下桨！把船头转向右舷！
        - id: ch01-b44
          speaker: huck
          text: 天边已经露出一点灰白。我走进树林躺下，趁早饭前先睡一会儿。
