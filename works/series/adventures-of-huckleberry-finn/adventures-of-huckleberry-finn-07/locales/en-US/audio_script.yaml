  chapters:
    - id: ch01
      title: CHAPTER VII.
      blocks:
        - id: ch01-b01
          speaker: pap
          text: Get up! What are you doing?
        - id: ch01-b02
          speaker: huck
          text: I opened my eyes and tried to figure out where I was. The sun was already up, and I'd been sound asleep. Pap stood over me looking sour and sick.
        - id: ch01-b03
          speaker: pap
          text: What are you doing with this gun?
        - id: ch01-b04
          speaker: huck
          text: I could tell he didn't remember anything he'd done, so I gave him an answer.
        - id: ch01-b05
          speaker: huck
          text: Somebody tried to get in. I was waiting for him.
        - id: ch01-b06
          speaker: pap
          text: Why didn't you wake me up?
        - id: ch01-b07
          speaker: huck
          text: I tried, but I couldn't. You wouldn't budge.
        - id: ch01-b08
          speaker: pap
          text: All right, then. Quit talking and go see if there's a fish on the lines for breakfast. I'll come along in a minute.
        - id: ch01-b09
          speaker: huck
          text: He unlocked the door, and I hurried up the riverbank. Bits of branches and bark were floating past, so I knew the river had started rising. If I'd been in town, that June rise would've meant good times for me. Cordwood and pieces of log rafts always came drifting down as soon as the rise began. Sometimes a dozen logs were tied together. All you had to do was catch them and sell them to the woodyards or the sawmill.
        - id: ch01-b10
          speaker: huck
          text: I went up the bank with one eye watching for Pap and the other watching whatever the river brought. Then a fine canoe came floating along. It was thirteen or fourteen feet long and rode high like a duck.
        - id: ch01-b11
          speaker: huck
          text: I jumped headfirst from the bank like a frog, clothes and all, and swam for it. I expected somebody to be hiding flat inside. Folks did that sometimes to fool you. They waited until you'd rowed a skiff almost close enough, then sat up and laughed. But nobody was hiding this time. It was a real drift canoe. I climbed in and paddled it ashore.
        - id: ch01-b12
          speaker: huck
          text: At first I thought Pap would be pleased when he saw it. That canoe was worth ten dollars. But he still wasn't in sight when I steered it into a little creek shaped like a gully, with vines and willows hanging all over it. Then a better idea struck me. I could hide the canoe and use it when I ran away. Instead of tramping through the woods and having a rough time on foot, I could go fifty miles downriver and camp somewhere for good.
        - id: ch01-b13
          speaker: huck
          text: The place was close to the shanty, and I kept thinking I heard Pap coming. I got the canoe hidden, peeked around the willows, and saw him farther down the path aiming his gun at a bird. He hadn't noticed a thing.
        - id: ch01-b14
          speaker: huck
          text: By the time he reached me, I was busy pulling in a trotline. He cursed me for taking so long. I said I'd fallen into the river. I knew he'd see my wet clothes and start asking questions otherwise. We took five catfish from the lines and went home.
        - id: ch01-b15
          speaker: huck
          text: After breakfast we lay down to catch up on sleep, because we were both nearly worn out. I kept trying to think of some way to stop Pap and the widow from even trying to follow me. That would be more certain than trusting myself to get far enough away before anyone missed me. Too many things might go wrong.
        - id: ch01-b16
          speaker: huck
          text: For a while, I couldn't think of anything. Then Pap sat up to drink another barrel of water and spoke.
        - id: ch01-b17
          speaker: pap
          text: Next time a man comes sneaking around here, you wake me up. You hear? He wasn't here for anything good. I'd have shot him. Next time, wake me up.
        - id: ch01-b18
          speaker: huck
          text: Pap dropped back down and went to sleep. But what he'd said gave me exactly the idea I needed. Now I could fix things so nobody would ever think of following me.
        - id: ch01-b19
          speaker: huck
          text: Around noon we headed up the bank. The river was rising fast, with plenty of driftwood moving past. Soon nine logs tied together came along. We took the skiff out, towed them ashore, and ate dinner.
        - id: ch01-b20
          speaker: huck
          text: Anybody but Pap would've waited out the day to see what else the river brought. That wasn't his way. Nine logs were enough for one trip, and he had to cross over and sell them right then. Around half past three, he locked me in the shanty, took the skiff, and started for town with the raft in tow.
        - id: ch01-b21
          speaker: huck
          text: I figured he wouldn't be back that night. Once he'd gotten a good start, I pulled out my saw and went back to work on the log wall. Before Pap reached the other side of the river, I was through the hole. He and his raft looked like one little speck far out on the water.
        - id: ch01-b22
          speaker: huck
          text: I carried the sack of cornmeal to the hidden canoe, pushed through the vines and branches, and stowed it inside. Then I brought the bacon and the whiskey jug. I took all the coffee and sugar, all the ammunition and wadding, the bucket and gourd, a dipper, a tin cup, my old saw, two blankets, the skillet, and the coffeepot. I added fish lines, matches, and everything else worth a cent. I cleaned the place out.
        - id: ch01-b23
          speaker: huck
          text: I wanted an ax, but the only one was out at the woodpile. I knew why I meant to leave that one there. I brought out the gun, and then I was done packing.
        - id: ch01-b24
          speaker: huck
          text: Crawling through the hole and dragging out all that gear had worn the ground smooth. From outside, I scattered dust over the spot to hide the smooth patch and the sawdust. Then I put the cut piece of log back. It bent up and didn't quite touch the ground, so I wedged two rocks under it and one against it.
        - id: ch01-b25
          speaker: huck
          text: From four or five feet away, nobody would notice the cut unless they already knew it was there. The log looked as if it belonged right where it was. Besides, this was the back of the cabin, where nobody was likely to come poking around.
        - id: ch01-b26
          speaker: huck
          text: Grass covered the whole way to the canoe, so I hadn't left tracks. I walked around and checked, then stood on the bank and studied the river. Everything was safe.
        - id: ch01-b27
          speaker: huck
          text: I took the gun into the woods and hunted for birds. Instead, I found a wild pig. Hogs that escaped from the prairie farms soon went wild in those river bottoms. I shot this one and carried it back to the shanty.
        - id: ch01-b28
          speaker: huck
          text: I took the ax from the woodpile and smashed the door in. I beat it and chopped it up badly while I did it. Then I carried the pig almost to the table, cut its throat with the ax, and left it bleeding on the packed dirt floor. There weren't any boards under it, only hard earth.
        - id: ch01-b29
          speaker: huck
          text: Next I filled an old sack with the biggest rocks I could drag. Starting beside the pig, I pulled the sack out the door, through the woods, and down to the river. I dumped it in, and it sank out of sight. The trail where something heavy had been dragged was plain to see.
        - id: ch01-b30
          speaker: huck
          text: I wished Tom Sawyer had been there. He would've taken a real interest in this kind of work and added all the fancy touches. Nobody could make more of a thing like that than Tom Sawyer.
        - id: ch01-b31
          speaker: huck
          text: Last of all, I pulled out some of my hair and smeared the ax with blood. I stuck some hair to the back of the ax and threw it into a corner. Then I held the pig against my chest inside my jacket so it wouldn't drip. I carried it well below the house and dumped it into the river.
        - id: ch01-b32
          speaker: huck
          text: That gave me another idea. I went to the canoe for the cornmeal and my saw and brought them back. I put the sack where it used to stand, then used the saw to rip a hole in the bottom. There weren't any knives or forks in the shanty. Pap did all the cooking with his pocketknife.
        - id: ch01-b33
          speaker: huck
          text: I carried the leaking sack about a hundred yards across the grass and through the willows east of the house. That way led to a shallow lake five miles wide, full of rushes and, when the season came, ducks too. A slough or creek ran out the far side and wandered for miles. I didn't know where it went, but I knew it didn't lead to the river.
        - id: ch01-b34
          speaker: huck
          text: Cornmeal sifted through the hole and marked a little trail all the way to the lake. I dropped Pap's whetstone there too, so it would look as if it had fallen by accident. Then I tied the torn sack with string to stop the leak and took it and the saw back to the canoe.
        - id: ch01-b35
          speaker: huck
          text: It was almost dark. I let the canoe drift down beneath some willows hanging over the bank and tied it to one while I waited for the moon. I ate a bite, stretched out in the canoe with my pipe, and worked through my plan.
        - id: ch01-b36
          speaker: huck
          text: They would follow the heavy drag marks to the river and search the water for me. Then they'd follow the cornmeal to the lake and hunt along the creek for the robbers who had killed me and stolen the supplies. On the river, they'd look for nothing but my dead body. Before long they'd get tired and leave me alone.
        - id: ch01-b37
          speaker: huck
          text: Then I could stop wherever I pleased. Jackson's Island would do. I knew it well, and nobody ever went there. At night I could paddle over to town, slip around unseen, and pick up whatever I needed. Jackson's Island was the place.
        - id: ch01-b38
          speaker: huck
          text: I was so tired that I fell asleep before I knew it. When I woke, I couldn't remember where I was for a moment. I sat up, a little scared, and looked around. Then it came back to me.
        - id: ch01-b39
          speaker: huck
          text: The river looked miles and miles wide. The moon shone so brightly that I could've counted every drift log sliding past, black and silent, hundreds of yards from shore. Everything was dead quiet, and it felt deep into the night. It looked late, and it smelled late too. You know what I mean. I don't have the words for it.
        - id: ch01-b40
          speaker: huck
          text: I yawned and stretched. Just as I was about to untie the canoe, I heard something far out on the water. I listened until I knew the sound. Oars were working steadily in their locks, the dull beat you hear across the water on a still night.
        - id: ch01-b41
          speaker: huck
          text: I peered through the willow branches and saw a skiff on the far side. At first I couldn't tell how many people were in it. As it came even with me, I saw only one man. Maybe it was Pap, though I hadn't expected him.
        - id: ch01-b42
          speaker: huck
          text: The skiff drifted below me with the current. Then the man swung toward shore through the easy water. He passed so close that I could've reached out with the gun and touched him. It was Pap, sure enough. From the way he handled the oars, he was sober too.
        - id: ch01-b43
          speaker: huck
          text: I didn't waste a second. The next minute I was sending the canoe downstream, quiet but quick, keeping inside the bank's shadow. After two and a half miles, I moved a quarter mile or more toward the middle of the river. The ferry landing was coming up soon. If I stayed near shore, somebody there might see me and call out to find who I was.
        - id: ch01-b44
          speaker: huck
          text: Once I reached the driftwood, I lay in the bottom and let the canoe float along with it. I had a good rest there, smoked my pipe, and watched the sky. There wasn't one cloud anywhere. When you're flat on your back in the moonlight, the sky looks terribly deep. I'd never known that before. And sounds carry an amazing distance over the water on a still night like that.
        - id: ch01-b45
          speaker: huck
          text: I could hear men talking at the ferry landing, and I caught every word. One of them said the season of long days and short nights was coming.
        - id: ch01-b46
          speaker: ferry_man_1
          text: We're getting close to the long days and short nights now.
        - id: ch01-b47
          speaker: ferry_man_2
          text: Well, I don't reckon this is one of the short ones.
        - id: ch01-b48
          speaker: huck
          text: The men laughed, so he said it again, and they laughed again. Then they woke another fellow, told him the joke, and laughed some more. He didn't laugh.
        - id: ch01-b49
          speaker: ferry_man_3
          text: Oh, leave me alone!
          emotion: angry
        - id: ch01-b50
          speaker: ferry_man_1
          text: I'll tell that one to my old woman. She'll think it's pretty good. But that's nothing beside some of the things I've said in my time.
        - id: ch01-b51
          speaker: ferry_man_2
          text: It's nearly three. I hope daylight doesn't keep us waiting more than another week.
        - id: ch01-b52
          speaker: huck
          text: Their voices faded as I floated farther away. Soon I couldn't make out the words. I still heard low mumbling and now and then a laugh, but it sounded far off.
        - id: ch01-b53
          speaker: huck
          text: I was well below the ferry when I sat up. Jackson's Island stood about two and a half miles downstream, thick with timber in the middle of the river. It looked big, dark, and solid, like a steamboat with no lights. The sandbar at its head had vanished under the high water.
        - id: ch01-b54
          speaker: huck
          text: The swift current carried me past the head of the island at a tearing speed. Then I turned into the still water and landed on the Illinois side. I knew a deep hollow in the bank there. I had to part the willow branches to get inside. Once I'd pushed the canoe in and tied it up, nobody looking from outside could've seen it.
        - id: ch01-b55
          speaker: huck
          text: I climbed to the head of the island and sat down on a log. From there I looked over the broad river and watched the black driftwood moving past. Far across the water, the town stood three miles away, with only three or four lights twinkling in the dark.
        - id: ch01-b56
          speaker: huck
          text: A huge lumber raft was drifting down from about a mile upstream with one lantern glowing in its middle. I sat there and watched the whole raft creep slowly closer. When it was almost even with the place where I stood, a man's command carried across the water as clearly as if he were right beside me.
        - id: ch01-b57
          speaker: raft_man
          text: Stern oars! Swing her head to starboard!
        - id: ch01-b58
          speaker: huck
          text: A little gray was showing in the sky by then. I went into the woods and lay down for a nap before breakfast.
