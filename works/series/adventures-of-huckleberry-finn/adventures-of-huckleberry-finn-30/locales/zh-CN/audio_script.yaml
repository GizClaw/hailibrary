audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第三十章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 国王刚上木筏就扑向我，揪住衣领来回猛摇。
        - id: ch01-b02
          speaker: king
          text: 你这小崽子，是不是想甩掉我们？嫌跟我们在一起烦了，是不是？
          emotion: angry
        - id: ch01-b03
          speaker: huck
          text: 没有，陛下，我们没想甩掉你们。求您别摇了，陛下！
          emotion: fearful
        - id: ch01-b04
          speaker: king
          text: 那就赶紧说，你们到底想干什么！再不说，我把你的肠子都摇出来！
          emotion: angry
        - id: ch01-b05
          speaker: huck
          text: 我发誓把事情原原本本全告诉您。抓住我的那个人待我挺好。他一直说，自己有个儿子，跟我差不多大，去年死了。他看我落进那么危险的处境，心里很难受。后来大家突然发现了金子，全吃了一惊，一起冲向棺材。那人这才松开我，还低声叫我赶紧跑，不然他们准会吊死我，我就跑了。留在那里也没有半点用，我什么都做不了。既然能逃，我当然不想白白挨绞索。我一路不停地跑，直到找到独木舟。回来以后，我马上催吉姆快走，怕他们追上来还是要吊死我。我还说，您和公爵恐怕已经没命了，我难过得要命，吉姆也一样。后来远远看见你们划过来，我们不知道有多高兴。不信您问吉姆，看我说的是不是实话。
        - id: ch01-b06
          speaker: jim
          text: 哈克说的都是真的。
        - id: ch01-b07
          speaker: huck
          text: 国王立刻叫吉姆闭嘴，还挖苦说，这番话听起来可真靠得住。他根本不信我，又揪着我摇了几下，还说看样子应该把我淹死。公爵这时开口拦住他。
        - id: ch01-b08
          speaker: duke
          text: 放开这孩子，你这个老蠢货！换成你，你还能怎么做？你自己一脱身，有没有四处打听他的下落？反正我不记得你打听过。
        - id: ch01-b09
          speaker: huck
          text: 国王终于松开我，转头咒骂起那座镇子，连镇上的人也一个不放过。公爵听不下去了。
        - id: ch01-b10
          speaker: duke
          text: 你最该骂的是自己！从头到尾，你没办成一件有脑子的事。只有信口编出那支根本不存在的蓝箭时，你够镇定，脸皮也够厚。那一招真漂亮，救了咱们。要不然，他们会一直关着我们，直到那两个英国人的行李运来。行李一到，咱们准进监狱。幸亏你那套鬼话把他们骗去了墓地，棺材里的金子又救了我们一回。那群兴奋的傻瓜要不是一看见金子就全撒了手，争着凑过去瞧清楚，今晚咱们就得系着绞索睡觉。那条“领带”还结实耐用，保证比咱们活得久。
        - id: ch01-b11
          speaker: huck
          text: 两个人沉默下来，各自琢磨了一会儿。国王像是忽然走了神。
        - id: ch01-b12
          speaker: king
          text: 唔！我们还以为是那些黑奴偷了金子呢！
        - id: ch01-b13
          speaker: huck
          text: 我听得浑身不自在。公爵故意把话说得又慢又讥讽。
        - id: ch01-b14
          speaker: duke
          text: 是啊，我们确实是这么以为的。
        - id: ch01-b15
          speaker: huck
          text: 过了好一阵，国王才慢吞吞地改口。
        - id: ch01-b16
          speaker: king
          text: 至少，我是这么以为的。
        - id: ch01-b17
          speaker: duke
          text: 不对，我才是这么以为的。
        - id: ch01-b18
          speaker: huck
          text: 国王听出话头不对，立刻恼了。
        - id: ch01-b19
          speaker: king
          text: 喂，比尔吉沃特，你这话到底什么意思？
        - id: ch01-b20
          speaker: duke
          text: 既然问到这里，那我也想知道，你刚才那句话是什么意思？
        - id: ch01-b21
          speaker: king
          text: 我哪知道！也许你当时睡着了，连自己做了什么都不记得。
        - id: ch01-b22
          speaker: huck
          text: 公爵一下竖起了毛。
        - id: ch01-b23
          speaker: duke
          text: 别再说这种该死的鬼话了！你真拿我当傻瓜？你以为我不知道是谁把钱藏进棺材的吗？
          emotion: angry
        - id: ch01-b24
          speaker: king
          text: 你当然知道，因为钱就是你亲手藏进去的！
          emotion: angry
        - id: ch01-b25
          speaker: huck
          text: 公爵骂他撒谎，猛地扑过去，双手掐住了他的脖子。国王被掐得招架不住，马上扯着嗓子叫了起来。
        - id: ch01-b26
          speaker: king
          text: 把手拿开！松开我的脖子！刚才的话我全收回！
          emotion: fearful
        - id: ch01-b27
          speaker: duke
          text: 你先承认，钱就是你藏的。你打算哪天甩掉我，再回来挖出钱，一个人全吞掉。
        - id: ch01-b28
          speaker: king
          text: 等一等，公爵。你只要公平老实地回答一个问题。钱要不是你放的，你就说，我会相信你，也把刚才的话全收回。
        - id: ch01-b29
          speaker: duke
          text: 你这个老无赖，钱不是我放的，你明明知道。现在听清楚了吧！
          emotion: angry
        - id: ch01-b30
          speaker: king
          text: 好，我相信你。可你再回答一个问题，先别发火。你是不是也想过把钱偷来藏起来？
        - id: ch01-b31
          speaker: huck
          text: 公爵沉默了一小会儿，显然不大愿意回答，最后才勉强开口。
        - id: ch01-b32
          speaker: duke
          text: 就算我想过，又怎么样？我到底没有动手。你可不一样。你不但想了，还真的干了。
        - id: ch01-b33
          speaker: king
          text: 公爵，我要是真干了，就叫我不得好死。我不否认自己原本打算那么做，因为我的确想过。可你，我是说有个人，抢在我前面动了手。
        - id: ch01-b34
          speaker: duke
          text: 撒谎！就是你干的！你今天非得亲口承认，不然我就不松手！
          emotion: angry
        - id: ch01-b35
          speaker: huck
          text: 国王喉咙里咯咯作响，只能一边喘气一边认输。
        - id: ch01-b36
          speaker: king
          text: 够了！我承认是我藏的！
          emotion: fearful
        - id: ch01-b37
          speaker: huck
          text: 听见国王亲口承认，我心里比刚才轻松多了。公爵这才松开双手，却没有就此放过他，又接着狠狠数落起来。
        - id: ch01-b38
          speaker: duke
          text: 你以后再敢不认，我就淹死你！坐在那里像小孩一样抽抽搭搭吧，照你干的那些事，活该你哭。我没见过你这么贪的老鸵鸟，什么都想一口吞下。亏我一直信任你，把你当亲爹。那些人把罪名推给几个可怜的黑奴时，你就站在旁边听着，一句话也不肯替他们说，你不害臊吗？我居然软心肠到信了那套鬼话，想起来都觉得自己可笑。该死的东西，现在我全明白了。你那么着急要补足亏空，就是想把我演《天下无双》和干别的勾当赚来的钱也骗走，最后一个人全吞了！
          emotion: angry
        - id: ch01-b39
          speaker: huck
          text: 国王还在抽鼻子，说话也怯生生的。
        - id: ch01-b40
          speaker: king
          text: 可是，公爵，补足亏空是你提出来的，不是我。
        - id: ch01-b41
          speaker: duke
          text: 闭嘴，我一个字也不想再听！这下你知道自己捞到什么了吧？他们拿回了自己的全部钱，还拿走了我们的钱，只剩下一两个谢克尔。滚去睡觉！只要你还活着，就别再跟我提什么补亏空！
          emotion: angry
        - id: ch01-b42
          speaker: huck
          text: 国王灰溜溜钻进棚屋，抱着酒瓶找安慰。没过多久，公爵也拿起了自己的酒瓶。大约半个钟头以后，他俩又好得像一窝贼。两个人越喝醉，彼此就越亲热，最后竟搂在一起，呼呼睡着了。他们都醉得软绵绵的。不过我留意到，国王还没醉到忘记一件事，那就是从此不能再否认钱袋是他藏的。这让我又安心又满意。等他们打起呼噜，我自然跟吉姆聊了很久，把刚才发生的所有事情都告诉了他。
