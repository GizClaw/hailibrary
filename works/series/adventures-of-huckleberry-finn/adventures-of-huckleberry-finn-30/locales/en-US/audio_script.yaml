audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    duke:
      display_name: The Duke
      tts:
        delivery: theatrical and self-important
        timbre: smooth and flexible
        pace: lively
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: crafty and grandiose
        timbre: old and gravelly
        pace: deliberate
        pitch: low
    jim:
      display_name: Jim
      tts:
        delivery: cautious and warmhearted
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXX.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: As soon as they climbed aboard, the king came at me. He grabbed my collar and shook me.
        - id: ch01-b02
          speaker: king
          text: So you meant to slip away from us, did you, you little pup? Got tired of our company, did you?
          emotion: angry
        - id: ch01-b03
          speaker: huck
          text: No, Your Majesty, we didn't. Please don't, Your Majesty!
          emotion: fearful
        - id: ch01-b04
          speaker: king
          text: Then tell me what you did mean to do, and be quick about it, or I'll shake your insides out!
          emotion: angry
        - id: ch01-b05
          speaker: huck
          text: Honest, Your Majesty, I'll tell you just how it happened. The man holding me was kind. He kept saying he'd had a boy about my size who died the year before, and he hated to see a boy caught in such a dangerous fix.
        - id: ch01-b06
          speaker: huck
          text: Then they found the gold. Everybody was so surprised that they rushed for the coffin. The man let go of me and whispered that I'd better run or they'd surely hang me. So I took off.
        - id: ch01-b07
          speaker: huck
          text: There wasn't any use in my staying. I couldn't help, and I didn't aim to get hanged if I could escape. I ran without stopping till I found the canoe. When I reached the raft, I told Jim to hurry before they caught me and hanged me after all.
        - id: ch01-b08
          speaker: huck
          text: I told him I was afraid you and the duke weren't alive anymore. Jim and I were both terribly sorry. Then we saw you coming, and we were mighty glad. Ask Jim if that isn't true.
        - id: ch01-b09
          speaker: jim
          text: That's just how it was.
        - id: ch01-b10
          speaker: huck
          text: The king told Jim to shut up.
        - id: ch01-b11
          speaker: king
          text: Oh, yes. That's mighty likely!
        - id: ch01-b12
          speaker: huck
          text: He shook me again and said he figured he would drown me. Then the duke broke in.
        - id: ch01-b13
          speaker: duke
          text: Let go of the boy, you old idiot! Would you have done any different? When you got free, did you go looking for him? I don't recall it.
        - id: ch01-b14
          speaker: huck
          text: The king released me and started cursing that town and everyone in it. The duke turned the blame right back on him.
        - id: ch01-b15
          speaker: duke
          text: You'd do better to curse yourself. You deserve it more than anybody. From the very start, you haven't done one sensible thing except inventing that blue-arrow mark. That was clever. It was the trick that saved us.
        - id: ch01-b16
          speaker: duke
          text: Without it, they would have locked us up until those Englishmen's baggage arrived. Then we'd have gone straight to the penitentiary. But your trick sent them to the graveyard, and finding the gold helped us even more.
        - id: ch01-b17
          speaker: duke
          text: If those excited fools hadn't dropped everything and run to look, we'd be sleeping in neckties tonight. And those neckties would last a good deal longer than we'd need them.
        - id: ch01-b18
          speaker: huck
          text: They both went quiet for a minute and thought it over. Then the king spoke as if his mind were somewhere else.
        - id: ch01-b19
          speaker: king
          text: Hm. And we thought the enslaved people stole it.
        - id: ch01-b20
          speaker: huck
          text: That made me squirm.
        - id: ch01-b21
          speaker: duke
          text: Yes. We certainly did.
        - id: ch01-b22
          speaker: huck
          text: The duke said it slowly, with plenty of sarcasm. About half a minute passed before the king drawled out an answer.
        - id: ch01-b23
          speaker: king
          text: Well, I did, anyway.
        - id: ch01-b24
          speaker: duke
          text: No. I did.
        - id: ch01-b25
          speaker: huck
          text: The duke used that same slow tone. The king began to bristle.
        - id: ch01-b26
          speaker: king
          text: Look here, Bilgewater. Just what are you hinting at?
        - id: ch01-b27
          speaker: duke
          text: If we're asking questions, maybe you can tell me what you were hinting at.
        - id: ch01-b28
          speaker: king
          text: Oh, nonsense! Maybe you were asleep and didn't know what you were doing.
        - id: ch01-b29
          speaker: huck
          text: The king laid the sarcasm on thick. Now the duke flared up.
        - id: ch01-b30
          speaker: duke
          text: Stop this cursed foolishness! Do you take me for an idiot? You think I don't know who hid that money in the coffin?
          emotion: angry
        - id: ch01-b31
          speaker: king
          text: Oh, I know you know. You put it there yourself!
          emotion: angry
        - id: ch01-b32
          speaker: duke
          text: That's a lie!
          emotion: angry
        - id: ch01-b33
          speaker: huck
          text: The duke lunged at him and got his hands around his throat. The king cried out.
        - id: ch01-b34
          speaker: king
          text: Get your hands off me! Let go of my throat! I take it back!
          emotion: fearful
        - id: ch01-b35
          speaker: duke
          text: First you admit that you hid the money. You meant to leave me behind one day, come back for it, and keep every dollar yourself.
          emotion: angry
        - id: ch01-b36
          speaker: king
          text: Wait a moment, Duke. Answer me one thing, fair and honest. If you didn't put it there, say so. I'll believe you and take back everything I said.
        - id: ch01-b37
          speaker: duke
          text: You old scoundrel, I didn't hide it, and you know I didn't. There!
          emotion: angry
        - id: ch01-b38
          speaker: king
          text: All right, then. I believe you. Just answer one more thing, and don't get mad. Didn't you mean to steal the money and hide it?
        - id: ch01-b39
          speaker: huck
          text: The duke said nothing for a little while. Then he gave his answer.
        - id: ch01-b40
          speaker: duke
          text: Maybe I did mean to. I don't care if I did. But I never actually did it. You meant to do it too, and you went through with it.
        - id: ch01-b41
          speaker: king
          text: I hope I drop dead if I did it, Duke, and that's the honest truth. I won't claim I wasn't planning to, because I was. But you did it first. I mean, somebody did.
        - id: ch01-b42
          speaker: duke
          text: That's a lie! You did it, and you'll say you did, or else—
          emotion: angry
        - id: ch01-b43
          speaker: huck
          text: The duke tightened his grip. The king began to gurgle. At last he gasped out the words.
        - id: ch01-b44
          speaker: king
          text: Enough! I admit it!
          emotion: fearful
        - id: ch01-b45
          speaker: huck
          text: I was mighty glad to hear that. Right away, I felt much easier. The duke took his hands off the king.
        - id: ch01-b46
          speaker: duke
          text: Deny it one more time and I'll drown you. Go ahead and sit there crying like a baby. After the way you've behaved, it suits you.
          emotion: angry
        - id: ch01-b47
          speaker: duke
          text: I never saw such a greedy old ostrich, always trying to swallow everything. And all this time, I trusted you like you were my own father.
          emotion: angry
        - id: ch01-b48
          speaker: duke
          text: You ought to be ashamed. You stood there while those poor enslaved people took the blame, and you never said one word for them. Now I feel like a fool for believing that rubbish.
          emotion: angry
        - id: ch01-b49
          speaker: duke
          text: Now I see why you were so eager to make up the missing amount. You wanted the money I had from the Nonesuch and our other schemes, so you could grab every bit of it!
          emotion: angry
        - id: ch01-b50
          speaker: huck
          text: The king was still sniffling when he answered in a timid voice.
        - id: ch01-b51
          speaker: king
          text: Why, Duke, you were the one who said we should make up the missing amount. I never said it.
        - id: ch01-b52
          speaker: duke
          text: Be quiet! I don't want another word from you. And look what your scheme got us. They've recovered all their own money, plus nearly every cent of ours.
          emotion: angry
        - id: ch01-b53
          speaker: duke
          text: Go to bed. And as long as you live, don't you ever come to me about making up another missing amount!
          emotion: angry
        - id: ch01-b54
          speaker: huck
          text: The king slipped into the wigwam and turned to his bottle for comfort. Before long, the duke took hold of his bottle too. Within half an hour, they were thick as thieves again. The drunker they got, the fonder they grew. At last they fell asleep in each other's arms, snoring away.
        - id: ch01-b55
          speaker: huck
          text: They both got powerful mellow. But I noticed that the king never got mellow enough to forget that he must not deny hiding the money bag again. That left me easy and satisfied.
        - id: ch01-b56
          speaker: huck
          text: Once they started snoring, Jim and I had a long talk, and I told him the whole story.
