        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    doctor:
      display_name: 医生
      tts:
        delivery: 和善老练，问话时带着谨慎的审视
        timbre: 温和而略显苍老
        pace: 不疾不徐
        pitch: 中低
    uncle_silas:
      display_name: 西拉斯姨父
      tts:
        delivery: 朴实厚道，对孩子宽容又带几分无奈
        timbre: 温厚的成年男声
        pace: 从容
        pitch: 中低
    aunt_sally:
      display_name: 萨莉姨妈
      tts:
        delivery: 爽直泼辣，生气时连珠炮一般咄咄逼人
        timbre: 明亮而有穿透力的成年女声
        pace: 偏快
        pitch: 中高
    mrs_hotchkiss:
      display_name: 霍奇基斯老太太
      tts:
        delivery: 爱抢话又无比笃定，一开口便滔滔不绝
        timbre: 尖亮的老年女声
        pace: 很快
        pitch: 高
    mrs_damrell:
      display_name: 达姆雷尔老太太
      tts:
        delivery: 好奇多话，总想插进自己的见解
        timbre: 略显沙哑的老年女声
        pace: 偏快
        pitch: 中高
    brother_penrod:
      display_name: 彭罗德大哥
      tts:
        delivery: 满腹疑问，开口便追根究底
        timbre: 粗实的成年男声
        pace: 偏快
        pitch: 中
    brother_hightower:
      display_name: 海托尔大哥
      tts:
        delivery: 夸张肯定，喜欢用数目压过别人
        timbre: 洪亮的成年男声
        pace: 有力
        pitch: 中低
    brother_marples:
      display_name: 马普尔斯大哥
      tts:
        delivery: 粗豪激动，越说越来劲
        timbre: 沙哑厚重
        pace: 偏快
        pitch: 低
    guest_1:
      display_name: 客人甲
      tts:
        delivery: 惊讶迟疑，说话容易被人打断
        timbre: 普通成年男声
        pace: 自然
        pitch: 中
    guest_2:
      display_name: 客人乙
      tts:
        delivery: 大惊小怪，感叹脱口而出
        timbre: 清亮的成年女声
        pace: 偏快
        pitch: 中高
    guest_3:
      display_name: 客人丙
      tts:
        delivery: 信誓旦旦，语气郑重
        timbre: 低沉的成年男声
        pace: 稳健
        pitch: 低
    guest_4:
      display_name: 客人丁
      tts:
        delivery: 急着补充，语气夸张
        timbre: 略粗的成年女声
        pace: 偏快
        pitch: 中
    guest_5:
      display_name: 客人戊
      tts:
        delivery: 胆小紧张，一想到危险便后怕
        timbre: 轻细的成年女声
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 第四十一章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我把医生叫醒以后，才看清他年纪很大，模样和和气气，人也很好。我说，昨天下午我和哥哥去西班牙岛打猎，在捡来的一块木筏上过夜。半夜里，哥哥做梦时大概踢到了枪，枪一响，打中了他的腿。我们想请医生过去治伤，不过千万别声张，因为我俩打算今晚回家，给家里一个惊喜。
        - id: ch01-b02
          speaker: doctor
          text: 你们是哪一家的孩子？
        - id: ch01-b03
          speaker: huck
          text: 就是那边的菲尔普斯家。
        - id: ch01-b04
          speaker: doctor
          text: 哦。你刚才说，他是怎么中的枪？
        - id: ch01-b05
          speaker: huck
          text: 他做了个梦，然后那个梦开枪打中了他。
        - id: ch01-b06
          speaker: doctor
          text: 这个梦倒真稀奇。
        - id: ch01-b07
          speaker: huck
          text: 医生点亮提灯，拿上鞍囊，跟我出了门。可他看见独木舟就不肯上，说一个人坐还行，两个人坐着怕是不安全。
        - id: ch01-b08
          speaker: huck
          text: 先生，您别怕。我们三个坐它过来，都轻松得很。
        - id: ch01-b09
          speaker: doctor
          text: 哪三个人？
        - id: ch01-b10
          speaker: huck
          text: 就是我、席德，还有……还有那些枪。我说的是人和枪，一共三个。
        - id: ch01-b11
          speaker: doctor
          text: 哦，是这么回事。
        - id: ch01-b12
          speaker: huck
          text: 可他仍把一只脚踩在船舷上，来回晃了晃，然后摇摇头，说还是找只大船好。偏偏别的船全上了锁，还拴着链子，他只能用我的独木舟。他叫我留在这里等他回来，也可以继续四处找船。要是我愿意，最好先回家，让家里人为那个惊喜做好准备。我说我不想走，就仔细告诉他怎样找到木筏。他听明白以后，一个人划走了。
        - id: ch01-b13
          speaker: huck
          text: 我很快想到，要是他不能像俗话说的那样，羊尾巴甩三下就治好汤姆，那可怎么办？要是这一治得花三四天呢？难道我们一直守在那里，等他把秘密说出去？不成。我已经想好了。我先等医生回来。要是他说还得再去，我就是游也要跟到岛上。然后我们把他捆起来，留在木筏上，带着他顺流而下。等汤姆用不着医生了，我们就照价付钱，哪怕把所有钱全给他，再放他上岸。
        - id: ch01-b14
          speaker: huck
          text: 我钻进木料堆睡了一觉。再醒来时，太阳已经爬到头顶老高了。我猛地蹿起来，冲去医生家。那里的人说，他夜里不知什么时候出了门，到现在还没回来。我心里一沉，这对汤姆可太不妙了，得立刻赶去岛上。我刚刚出发，转过街角，脑袋差点撞进西拉斯姨父的肚子。
        - id: ch01-b15
          speaker: uncle_silas
          text: 汤姆！你这个小混蛋，这么久跑到哪里去了？
        - id: ch01-b16
          speaker: huck
          text: 我没去哪里，只是跟席德一起找那个逃跑的黑奴。
        - id: ch01-b17
          speaker: uncle_silas
          text: 那你们究竟去了哪儿？你姨妈都快急坏了。
        - id: ch01-b18
          speaker: huck
          text: 她不用担心，我们一直都好好的。我们跟着那些人和狗追，可他们跑得太快，一会儿就把我们甩掉了。后来，我们好像听见河面上有动静，便找了只独木舟，追到对岸去，还是连他们的影子也没找到。我们只好沿着上游岸边继续找，后来又累又困，就把船系住，倒头睡着了。大约一个钟头前，我俩才醒过来，又划回镇上打听消息。席德去了邮局，想听听有没有新动静。我出来给我们找些吃的，找到了就跟他一起回家。
        - id: ch01-b19
          speaker: huck
          text: 姨父跟我去邮局找“席德”。果然不出我所料，他根本不在那里。姨父从邮局取出一封信，我们又等了一阵，席德还是没有出现。姨父便说，走吧，等席德胡闹够了，自会走路回去，或者划独木舟回去，我们可是要坐车的。我求他让我留下等席德，他怎么也不答应。他说等着没有用，我非跟他回去不可，好让萨莉姨妈亲眼看看，我确实平安无事。
        - id: ch01-b20
          speaker: huck
          text: 一回到家，萨莉姨妈看见我，高兴得又哭又笑。她一把抱住我，又照她的老办法打了几下。那种教训根本不痛不痒。她还说，等席德回来，也要照样招待他一顿。
        - id: ch01-b21
          speaker: huck
          text: 家里挤满了来吃饭的农场主和太太们。那一片叽叽喳喳，任谁也没听过第二回。霍奇基斯老太太最厉害，她嗓门最大，嘴也一刻不停。
        - id: ch01-b22
          speaker: mrs_hotchkiss
          text: 菲尔普斯大姐，那间小屋我里里外外全搜过了，那个黑奴绝对疯了。我刚才就对达姆雷尔大姐这么说，是不是呀，达姆雷尔大姐？我说的原话就是，他疯了。你们也都听见了，样样东西都是证据。就看那块磨刀石吧。哪个脑子正常的人，会往上面乱刻那些疯话？一会儿写某某在这里伤透了心，一会儿又说某某苦熬了三十七年，还有什么路易某某的亲生儿子，尽是没完没了的废话。我开头这么说，中间这么说，现在还是这么说。那个黑奴疯透了，跟尼布甲尼撒一模一样。
        - id: ch01-b23
          speaker: mrs_damrell
          text: 霍奇基斯大姐，还有那架破布做的梯子呢。老天在上，他究竟要拿它来做什么？
        - id: ch01-b24
          speaker: mrs_hotchkiss
          text: 这正是我刚才对厄特巴克大姐说的话，她自己可以作证。她说，瞧瞧那架破布梯子。我就说，对呀，你可得好好瞧瞧。他拿那东西到底有什么用？她还没说到下文，就先叫了我一声霍奇基斯大姐。
        - id: ch01-b25
          speaker: brother_penrod
          text: 可那块磨刀石到底是怎么搬进去的？那个洞又是谁挖的？
        - id: ch01-b26
          speaker: mrs_hotchkiss
          text: 彭罗德大哥，这又是我的原话！劳驾把那碟糖浆递过来。我刚才就在问邓拉普大姐，他们究竟怎么把磨刀石弄进去的？难道没人帮忙？关键就在这儿。别想骗我，一定有人帮，而且帮忙的人多着呢。少说也有十二个人在帮那个黑奴。就算把这庄园上的黑奴一个个剥掉一层皮，我也非查出是谁干的不可。不光这样，这件事还没完呢……
        - id: ch01-b27
          speaker: brother_hightower
          text: 十二个人？就是四十个也干不完！那些餐刀改的锯子，做起来多费劲。那条床腿，六个人也得锯一个星期。床上还有个稻草扎的黑奴，再看别的东西，那就更不得了……
        - id: ch01-b28
          speaker: mrs_hotchkiss
          text: 海托尔大哥，你说得太对了！我刚才跟菲尔普斯大哥本人讲的，正是这件事。他问我，那条床腿给锯成那个样子，我怎么看。我就告诉他，床腿总不会自己把自己锯断，一定是有人动的手。这就是我的看法，你们爱听不听。也许它不值什么，可不管值不值，我就是这么看的。谁要想得出更高明的说法，只管说出来。我刚才对邓拉普大姐也是这么讲的……
        - id: ch01-b29
          speaker: brother_marples
          text: 我的老天！他们准是整整四个星期，每晚都挤一屋子的黑奴进去，才干得完这些活。再看那件衬衫，从头到尾每一寸都写着用血写成的非洲密文。少说也得一木筏的人围着它，一刻不停地写。我情愿花两块钱，请人把那些字念给我听。至于写字的黑奴，我非拿鞭子狠狠抽他们不可……
        - id: ch01-b30
          speaker: aunt_sally
          text: 马普尔斯大哥，你还问有没有人帮他？你要是近来住在这所房子里，就不会只说“有人”了。他们见什么偷什么，而我们明明一直盯着。他们把晾衣绳上的衬衫直接偷走了！那条拿来做破布梯子的床单，鬼知道给他们偷过多少回。还有面粉、蜡烛、烛台、勺子、旧暖床锅，再加上差不多一千件我现在记不起来的东西，连我的新印花布裙子也没了。
        - id: ch01-b31
          speaker: aunt_sally
          text: 我、西拉斯、席德和汤姆日夜不停地守着，却连他们一根头发、一个影子、一点声音也没捉到。最后关头，他们居然从我们眼皮底下钻进来，把我们骗得团团转。还不只骗过我们，连印第安领地来的那些强盗也给骗了。十六个人、二十二条狗紧紧追在后面，竟还让他们把那个黑奴平平安安地救走了！这比我听说过的任何事情都邪门，连鬼魂也不见得做得这么漂亮、这么机灵。我看他们准就是鬼魂。你们都知道我家的狗，再没有比它们更好的，可它们一次也没闻到那伙人的踪迹。你们当中谁能解释？
        - id: ch01-b32
          speaker: guest_1
          text: 嗨，这件事实在叫人想不明白……
          emotion: surprised
        - id: ch01-b33
          speaker: guest_2
          text: 老天爷呀，我可从没听说过这种事……
          emotion: surprised
        - id: ch01-b34
          speaker: guest_3
          text: 我敢赌咒，换成我绝不会留在那里……
        - id: ch01-b35
          speaker: guest_4
          text: 他们不只救人，还是闯进屋子偷东西的贼……
        - id: ch01-b36
          speaker: guest_5
          text: 我的天哪，要我住在这样的房子里，非吓死不可……
          emotion: fearful
        - id: ch01-b37
          speaker: aunt_sally
          text: 只是吓得不敢住？我昨晚连床也不敢上，起来、躺下、坐下，什么都不敢，里奇韦大姐。那些家伙什么都偷，说不定连那东西也会拿走。你们想想，到了半夜，我已经慌成什么样子。我越想越怕，甚至担心他们会把家里人也偷走。现在是白天，想起来当然够傻的，可那会儿我早就吓得没了理智。我想到两个可怜的孩子睡在楼上那间孤零零的屋里，心里实在放不下，就偷偷摸上楼，把他们锁在里面。对，我真锁了。换了谁都会这样。人一旦怕起来，那股怕意不停缠着你，而且越来越厉害，脑子便乱成一团，什么疯事都做得出。过一阵你还会想，假如我就是那个孩子，人在楼上，房门又没锁，那可叫人怎么放心？
          emotion: fearful
        - id: ch01-b38
          speaker: huck
          text: 她突然停住，神情有些疑惑，慢慢把头转过来。她一看见我，我就起身出去走了走。我得先找个清静地方想清楚，今天早晨我和席德为什么没在锁住的房里。不过我不敢走远，免得她派人来找。
        - id: ch01-b39
          speaker: huck
          text: 到了傍晚，客人全都走了，我才回去解释。我说，吵闹声和枪声把我和席德惊醒了。房门虽然锁着，我们却很想出去看热闹，于是顺着避雷针爬了下去。我俩都受了点小伤，也已经吃够苦头，以后绝不会再试第二回。接着，我把先前骗西拉斯姨父的那番话，从头到尾又讲了一遍。
        - id: ch01-b40
          speaker: huck
          text: 萨莉姨妈说，这次可以原谅我们。说不定我们做得也不算太过分，男孩子本来就是一群冒冒失失的家伙。既然没闹出祸，她与其为那些已经过去、再也改变不了的事发愁，还不如感谢老天，让我们活蹦乱跳地回来，让她还能把我们留在身边。她亲了亲我，又拍拍我的头，坐在那里想了好一阵，忽然跳了起来。
        - id: ch01-b41
          speaker: aunt_sally
          text: 哎呀，都快天黑了，席德怎么还没回来？这孩子究竟出了什么事？
          emotion: fearful
        - id: ch01-b42
          speaker: huck
          text: 我抓住机会，马上说，我去镇上把他找回来。
        - id: ch01-b43
          speaker: aunt_sally
          text: 不准去，你就待在这里。一次丢一个孩子已经够了。吃晚饭时他还不回来，就让你姨父去。
        - id: ch01-b44
          speaker: huck
          text: 席德果然没有回来吃晚饭，姨父饭后便出门找他。十点左右，姨父回来了。他一路都没发现汤姆的踪迹，自己也有些不安。萨莉姨妈更不是有点儿担心，她已经急得厉害了。
        - id: ch01-b45
          speaker: uncle_silas
          text: 没什么好担心的，男孩子总归是男孩子。等到明早，他准会好端端地回家。
        - id: ch01-b46
          speaker: huck
          text: 萨莉姨妈只好听着，可她仍要等一会儿，还把灯留着，好让席德看见回家的路。
        - id: ch01-b47
          speaker: huck
          text: 我上床时，她拿着蜡烛陪我上楼，替我掖好被子，对我好得像亲娘一样。我心里难受极了，几乎不敢看她的脸。她在床边坐了很久，一直说席德是个多么好的孩子，好像永远也舍不得停下来。每隔一会儿，她就问我，席德会不会迷了路，会不会受了伤，也许掉进河里淹死了？他会不会此刻正躺在什么地方受苦，甚至已经死了，而她不在身边，根本没法救他？
        - id: ch01-b48
          speaker: huck
          text: 她这么问着，眼泪便静静往下流。我只好一次又一次告诉她，席德不会有事，明早一定会回家。她听完便握紧我的手，有时又亲亲我，求我把这话再说一遍，还要不停地说下去。她正为席德难受得要命，只有这句保证能让她好受一点。临走时，她低下头，安静又温柔地直望进我的眼睛。
        - id: ch01-b49
          speaker: aunt_sally
          text: 汤姆，这回门不锁了，窗户和避雷针也都在那里。可你会听话的，对不对？你不会再走吧？就看在我的分上。
          emotion: sad
        - id: ch01-b50
          speaker: huck
          text: 老天知道，我原本多想出去看看汤姆，也早已打定了主意。可听她说完这句话，就算有人把全天下的王国给我，我也不会走了。
        - id: ch01-b51
          speaker: huck
          text: 可我一会儿惦记萨莉姨妈，一会儿又惦记汤姆，一夜都睡不安稳。夜深以后，我两次顺着避雷针爬下去，悄悄绕到屋前。两次都看见她坐在窗口的蜡烛旁，眼睛一直望着大路，眼里含着泪。我真想替她做点什么，却什么也做不了，只能对天发誓，以后再也不做让她伤心的事。
        - id: ch01-b52
          speaker: huck
          text: 第三次醒来，天已经亮了。我又爬下去，看见她仍在窗口。蜡烛快燃尽了，她花白的头靠在手上，已经睡着。
