  chapters:
    - id: ch01
      title: CHAPTER XLI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The doctor was old, and he had a kind, pleasant look when I got him out of bed. I told him my brother and I had gone hunting on Spanish Island the afternoon before. We had camped on a piece of raft we found, and sometime around midnight my brother must have kicked his gun while he was dreaming. The gun went off and shot him in the leg. I asked the doctor to go patch him up and keep it quiet. We wanted to come home that evening and surprise our folks.
        - id: ch01-b02
          speaker: doctor
          text: Who are your folks?
        - id: ch01-b03
          speaker: huck
          text: The Phelpses, down that way.
        - id: ch01-b04
          speaker: doctor
          text: Oh. Now, how did you say he got shot?
        - id: ch01-b05
          speaker: huck
          text: He was dreaming, and it shot him.
        - id: ch01-b06
          speaker: doctor
          text: That was a mighty peculiar dream.
        - id: ch01-b07
          speaker: huck
          text: The doctor lit his lantern, fetched his saddlebags, and started off with me. But the moment he saw the canoe, he did not like the look of it. It was roomy enough for one person, he said, but it did not seem quite safe with two aboard.
        - id: ch01-b08
          speaker: huck
          text: You don't need to worry, sir. It carried three of us easily.
        - id: ch01-b09
          speaker: doctor
          text: Three? Who was the third?
        - id: ch01-b10
          speaker: huck
          text: Why, there was me and Sid, and... and the guns. That's what I meant.
        - id: ch01-b11
          speaker: doctor
          text: Oh.
        - id: ch01-b12
          speaker: huck
          text: He put one foot on the edge and rocked the canoe, then shook his head. He wanted to find a bigger boat, but every other one was locked and chained. So he took my canoe alone. He told me to wait until he came back. Or I could keep hunting for another boat. Then again, maybe I should go home and get everything ready for the surprise. I said I did not want to do that. I explained exactly where the raft was, and he paddled away.
        - id: ch01-b13
          speaker: huck
          text: Before long, a thought struck me. What if the doctor could not fix Tom's leg in three shakes of a sheep's tail? What if it took three or four days? We could not hang around until he told our secret. No, sir. If he came back saying he had to return, I would get to the island too, even if I had to swim. Then we would tie him up and take him downriver. When Tom was finished with him, we would pay him whatever the work was worth, or everything we had, and let him go ashore.
        - id: ch01-b14
          speaker: huck
          text: I crawled into a lumber pile and tried to get some sleep. The next time I opened my eyes, the sun was already high over my head. I shot out of that pile and rushed to the doctor's house. The people there told me he had gone away sometime during the night, and he still had not returned. That looked powerful bad for Tom. I decided I had better leave for the island at once. I shoved off, turned the corner, and nearly drove my head into Uncle Silas's stomach.
        - id: ch01-b15
          speaker: uncle_silas
          text: Why, Tom! Where have you been all this time, you rascal?
        - id: ch01-b16
          speaker: huck
          text: I haven't been anywhere except out hunting for the runaway man with Sid.
        - id: ch01-b17
          speaker: uncle_silas
          text: Then where in the world did you go? Your aunt has been terribly worried.
        - id: ch01-b18
          speaker: huck
          text: She didn't need to worry. We were safe. We followed the men and dogs, but they got too far ahead and we lost them. Then we thought we heard them out on the water, so we took a canoe across the river and chased after them. We couldn't find them. We kept going along the far bank until we were worn out, tied the canoe up, and fell asleep. We only woke about an hour ago. We paddled back to hear the news. Sid is at the post office asking around, and I'm looking for food. After that, we're going home.
        - id: ch01-b19
          speaker: huck
          text: We went to the post office to collect Sid. Just as I expected, he was not there. Uncle Silas picked up a letter, and we waited a little longer, but Sid never appeared. Uncle Silas said Sid could walk home when he finished fooling around, or come back in the canoe. We would ride. I tried to persuade him to let me stay and wait, but he would not hear of it. There was no use waiting, he said. I had to come along so Aunt Sally could see we were safe.
        - id: ch01-b20
          speaker: huck
          text: When we reached home, Aunt Sally was so glad to see me that she laughed and cried together. She hugged me, gave me one of her lickings that never amounted to much, and promised Sid the same treatment when he came back.
        - id: ch01-b21
          speaker: huck
          text: The house was packed with farmers and their wives, all there for dinner. I had never heard such a clatter. Old Mrs. Hotchkiss was the worst. Her tongue never stopped.
        - id: ch01-b22
          speaker: mrs_hotchkiss
          text: Sister Phelps, I searched that cabin from top to bottom, and I believe that man was crazy. I told Sister Damrell so. Didn't I, Sister Damrell? Those were my very words. Every last thing proves it. Just look at that grindstone. Would anyone in his right mind scratch all that foolishness onto a grindstone? One person broke his heart there, and another one dragged on for thirty-seven years. Then there was something about the natural son of some Louis or other, and a heap more rubbish. I said from first to last that he was crazy. Crazy as Nebuchadnezzar, that's what I said.
        - id: ch01-b23
          speaker: mrs_damrell
          text: And what about that ladder made of rags, Sister Hotchkiss? What in goodness could he ever have wanted with such a thing?
        - id: ch01-b24
          speaker: mrs_hotchkiss
          text: I said those exact words to Sister Utterback not one minute ago, and she'll tell you herself. She told me to look at that rag ladder. I said, "Yes, just look at it. What could he possibly have wanted with it?" She agreed with me completely.
        - id: ch01-b25
          speaker: mr_penrod
          text: But how in creation did they get that grindstone inside? And who dug the hole? Somebody else must have been involved.
        - id: ch01-b26
          speaker: mrs_hotchkiss
          text: My very words, Brother Penrod! Pass me that saucer of molasses, won't you? I was just asking Sister Dunlap how they got that grindstone in. They couldn't have done it without help. That's the point. Don't tell me otherwise. That man had plenty of help. A dozen people must have helped him, and I'd whip every last one on this place before I'd stop looking for the ones who did it.
        - id: ch01-b27
          speaker: mr_hightower
          text: A dozen? Forty couldn't have done all that work. Look at those saws made from case knives and all the rest. Think how long they took to make. Six men would need a week to saw through that bed leg with them. Then there's the man made of straw lying on the bed. Just look at all of it.
        - id: ch01-b28
          speaker: mrs_hotchkiss
          text: You can surely say that, Brother Hightower. I was telling Brother Phelps the same thing. He asked what I thought about that bed leg being sawed off. What did I think? It certainly didn't saw itself. Somebody sawed it. That's my opinion, and anybody with a better one is welcome to give it. I told Sister Dunlap the very same thing.
        - id: ch01-b29
          speaker: mr_marples
          text: Why, there must have been a houseful of people in that cabin every night for four weeks to finish all that work, Sister Phelps. Look at the shirt, covered from end to end in secret African writing done in blood. A whole raftload of them must have been writing on it nearly all the time. I'd pay two dollars to hear somebody read it. As for the people who wrote it, I reckon they deserve a lashing.
        - id: ch01-b30
          speaker: aunt_sally
          text: You think he had helpers, Brother Marples? You would know it if you'd lived in this house lately. They stole everything they could reach, even while we watched day and night. They took a shirt straight off the line. And that sheet they turned into a rag ladder? I couldn't tell you how many times they stole it and put it back. They took flour, candles, candlesticks, spoons, the old warming pan, my new calico dress, and nearly a thousand other things I can't remember now. Silas and I, along with Sid and Tom, watched constantly, night and day. Still, not one of us ever caught so much as a glimpse, a sound, or a trace of them.
        - id: ch01-b31
          speaker: aunt_sally
          text: Then, at the very last minute, they slipped right under our noses. They fooled us and those robbers from the Indian Territory too, and got away with the prisoner safe and sound while sixteen men and twenty-two dogs were right at their heels. It beats everything I ever heard. Spirits couldn't have done it any better or any smarter. Maybe they were spirits. You know our dogs are as good as any, but those dogs never once found their trail. Let one of you explain that!
        - id: ch01-b32
          speaker: neighbor_1
          text: Well, that surely beats anything I ever heard.
        - id: ch01-b33
          speaker: neighbor_2
          text: Mercy alive, I never saw the like.
        - id: ch01-b34
          speaker: neighbor_3
          text: So help me, I wouldn't have believed it.
        - id: ch01-b35
          speaker: neighbor_4
          text: They were house thieves too, on top of everything else.
        - id: ch01-b36
          speaker: neighbor_5
          text: Good gracious, I'd have been afraid to live in such a house.
        - id: ch01-b37
          speaker: aunt_sally
          text: Afraid to live here? Sister Ridgeway, I was so frightened I hardly dared go to bed, get up, lie down, or even sit. By midnight last night, I was in such a state that I feared they'd steal someone from the family. I couldn't think straight anymore. It sounds foolish now, in daylight. But my two poor boys were asleep upstairs in that lonely room, and I was so worried that I crept up and locked them in. Anybody would have done it. Once fear keeps growing and muddles your wits, you start doing the wildest things. Then you put yourself in that boy's place and wonder what might happen with the door unlocked.
        - id: ch01-b38
          speaker: huck
          text: She stopped. A puzzled look came over her face. Slowly, she turned her head, and when her eyes landed on me, I stood up and took a walk.
        - id: ch01-b39
          speaker: huck
          text: I figured I could explain why we had not been in that room better if I went off by myself and thought it over. I did not dare go far, or she would send for me. Late that afternoon, all the visitors left. Then I went inside and told her the noise and gunshots had woken Sid and me. The door was locked, but we wanted to see the excitement, so we climbed down the lightning rod. We both got hurt a little, and we never wanted to try that again. After that, I repeated the story I had told Uncle Silas.
        - id: ch01-b40
          speaker: huck
          text: Aunt Sally said she forgave us. Maybe it was all right after all, and about what anyone ought to expect from boys. As far as she could see, every boy was part of a harum-scarum lot. Since no harm had come of it, she decided she ought to spend her time being thankful. We were alive and well, and she still had us. There was no sense fretting over what was already past and done. She kissed me, patted my head, and sank into deep thought. Then she suddenly jumped up.
        - id: ch01-b41
          speaker: aunt_sally
          text: Mercy on us, it's nearly night, and Sid still isn't back! What has happened to that boy?
          emotion: fearful
        - id: ch01-b42
          speaker: huck
          text: I saw my chance.
        - id: ch01-b43
          speaker: huck
          text: I'll run up to town and bring him home.
        - id: ch01-b44
          speaker: aunt_sally
          text: No, you won't. You will stay right where you are. One lost boy is enough. If he isn't here by supper, your uncle will go.
        - id: ch01-b45
          speaker: huck
          text: Tom did not come for supper, so Uncle Silas left to look for him as soon as the meal was over.
        - id: ch01-b46
          speaker: huck
          text: Uncle Silas returned around ten o'clock, a little worried. He had found no trace of Tom. Aunt Sally was much more troubled, but Uncle Silas said there was no reason to fear.
        - id: ch01-b47
          speaker: uncle_silas
          text: Boys will be boys, Sally. You'll see. This one will turn up safe and sound in the morning.
        - id: ch01-b48
          speaker: huck
          text: Aunt Sally had to accept that, though she was far from easy in her mind. She said she would sit up for Tom awhile anyway. She would keep a light burning in the window so he could see it when he came home.
        - id: ch01-b49
          speaker: huck
          text: When I went upstairs, she came with me carrying her candle. She tucked me in and mothered me so tenderly that I felt ashamed and could hardly look at her. She sat beside me for a long time, talking about what a splendid boy Sid was, as though she never wanted to stop. Every little while, she asked whether I thought he might be lost, hurt, or drowned. Maybe he was lying somewhere right then, suffering or dead, with her nowhere near to help him. Silent tears ran down her face.
        - id: ch01-b50
          speaker: huck
          text: Sid is all right. He'll surely be home in the morning.
        - id: ch01-b51
          speaker: huck
          text: Each time I promised, she would squeeze my hand or bend down and kiss me. Then she would ask me to say it again, and to keep on saying it, because it did her good. She was in so much trouble that she needed to hear those words. At last, she got ready to leave. She looked steadily into my eyes, gentle and quiet.
        - id: ch01-b52
          speaker: aunt_sally
          text: The door won't be locked, Tom. You know where the window and the lightning rod are. But you'll be good, won't you? You won't leave, for my sake?
          emotion: sad
        - id: ch01-b53
          speaker: huck
          text: Heaven knew how badly I wanted to go and find out about Tom. I had meant to leave. But after that, I would not have gone for all the kingdoms in the world.
        - id: ch01-b54
          speaker: huck
          text: Aunt Sally stayed on my mind, and so did Tom. With both of them troubling me, I slept badly and kept waking. Twice during the night, I climbed down the lightning rod and slipped around to the front of the house. Both times, she was sitting by her candle in the window. Her eyes stayed fixed on the road, and they were full of tears. I wished there were something I could do for her, but there was not. All I could do was swear to myself that I would never do anything to grieve her again.
        - id: ch01-b55
          speaker: huck
          text: The third time I woke, dawn had come. I slid down the lightning rod once more and went around to look. She was still there in the window. Her candle had almost burned out. Her old gray head rested on one hand, and at last she had fallen asleep.
