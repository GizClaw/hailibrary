audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    jim:
      display_name: 吉姆
      tts:
        delivery: 热诚质朴，对哈克满是关切
        timbre: 浑厚温暖
        pace: 舒展自然
        pitch: 低
    young_man:
      display_name: 年轻旅客
      tts:
        delivery: 老实热心，说话毫无戒心
        timbre: 年轻清朗
        pace: 自然爽快
        pitch: 中
    townsman:
      display_name: 镇民
      tts:
        delivery: 朴直随便，说话带着乡下腔调
        timbre: 成年浑厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 吉姆的新伪装
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 第二天快到晚上，我们把木筏停在河心一处长着小柳树的沙洲后面。河两边各有一座村子，公爵和国王又开始盘算怎么去那里弄钱。吉姆只盼他们几个钟头就回来。他一个人留在木筏上时，非得用绳子捆住不可。不然有人看见他独自待着，身上又没有绳子，就不像逃跑的黑奴了。可是整天捆在窝棚里，他实在又累又难受。
        - id: ch01-b02
          speaker: jim
          text: 公爵，但愿你们别耽搁太久。俺白天一直捆着躺在窝棚里，身子沉得很，也累得很。
        - id: ch01-b03
          speaker: huck
          text: 公爵承认这个滋味不好受，说他会想出别的办法。他脑子确实灵，不多时就有了主意。他让吉姆穿上李尔王那套戏服，一件用花布帘子做的长袍，一顶白马毛假发，再配上白胡子。接着，他拿戏班的油彩，把吉姆的脸、双手、耳朵和脖子全涂成死沉沉的暗蓝色，活像淹死了九天的人。我一辈子也没见过这么吓人的怪物。
        - id: ch01-b04
          speaker: huck
          text: 公爵又在木瓦上写了一块牌子，上面明明白白写着：“患病的阿拉伯人，只要不发疯就没有危险。”他把牌子钉在板条上，竖在窝棚前四五英尺远的地方。吉姆很满意。他说，这总比每天被绳子捆着躺上两三年强多了，也不用一听见响动就吓得浑身发抖。
        - id: ch01-b05
          speaker: duke
          text: 你只管自在待着。真有人过来乱碰东西，你就从窝棚里跳出去，闹腾几下，再像野兽那样嚎上两声。那些人一准转身就逃，不会再来打扰你。
        - id: ch01-b06
          speaker: huck
          text: 这主意很稳妥。不过平常人见到吉姆那副样子，大概根本等不到他开口。他不只像死人，看起来比死人还吓人。
        - id: ch01-b07
          speaker: huck
          text: 两个无赖还想再演“王室奇人”，那出戏太能赚钱了。可他们怕消息已经传到下游，这么做不保险，只好另找门路。他们想了好些法子，没有一个完全合意。公爵说，他要躺着动一两个钟头脑筋，看看怎么对付阿肯色州那边的村子。国王打算毫无计划地去另一边，只信靠上天领他找到发财的路。我看，他说的上天其实就是魔鬼。
        - id: ch01-b08
          speaker: huck
          text: 我们上次停靠时都买了成衣。国王换上一身黑，又让我也换好。他的衣裳又体面又挺括，简直把人变了个样。从前他是天底下最下贱的老无赖。如今只要摘下白色海狸皮帽子，弯腰行礼，再露出一张笑脸，他就显得尊贵、慈祥又虔诚，活像刚从诺亚方舟里走出来的利未本人。
        - id: ch01-b09
          speaker: huck
          text: 吉姆收拾好独木舟，我备好桨。村子上游三英里处，有一艘大汽船停在岸边装货，已经装了两个钟头。
        - id: ch01-b10
          speaker: king
          text: 瞧我这身打扮，最好装成从圣路易斯、辛辛那提，或者别的大地方来的。往汽船那边划，哈克贝利。咱们坐船进村。
    - id: ch02
      title: 毫无戒心的旅客
      blocks:
        - id: ch02-b01
          speaker: huck
          text: 能坐汽船，我当然用不着他吩咐第二遍。我们在村子上游半英里处靠近岸边，贴着陡岸下方水势平缓的地方飞快往前划。很快，我们看见一个模样老实的年轻乡下人。他正坐在圆木上擦脸上的汗，身旁放着两只大旅行包。那天天气热得要命。
        - id: ch02-b02
          speaker: king
          text: 把船头靠过去。年轻人，你要上哪儿？
        - id: ch02-b03
          speaker: young_man
          text: 我要去搭汽船，到新奥尔良去。
        - id: ch02-b04
          speaker: king
          text: 那就上来吧。我的仆人会替你拿行李。阿道弗斯，下去帮这位先生把包搬上船。
        - id: ch02-b05
          speaker: huck
          text: 原来阿道弗斯就是我。我搬好行李，三个人继续上路。年轻人感激得不得了，说大热天扛着行李走，实在够呛。他问国王去哪里。国王说，自己早晨在对岸下了船，现在要到上游一座农庄去看老朋友。
        - id: ch02-b06
          speaker: young_man
          text: 我刚看见您的时候，还以为准是威尔克斯先生，他差一点就赶上了。可我又想，不对呀，要真是他，怎么会往上游划呢？您不是他吧？
        - id: ch02-b07
          speaker: king
          text: 不是，我叫亚历山大·布洛杰特。既然是主的卑微仆人，我想还该称作布洛杰特牧师。要是威尔克斯先生没及时赶到，错过了什么事，我也会替他难过。但愿他什么都没错过。
        - id: ch02-b08
          speaker: young_man
          text: 财产他不会错过，该得的都少不了。可他没见到哥哥彼得最后一面。他在不在乎，谁也说不准，可彼得临死前拿什么都愿意换弟弟回来。这三个星期，他嘴里说的只有这件事。他和哈维从小分开以后就没见过，另一个弟弟威廉更是从未见面。威廉又聋又哑，才三十岁或三十五岁。只有彼得和乔治来了这里。乔治结过婚，可他和妻子去年都死了。如今只剩哈维和威廉，可惜他们没赶到。
        - id: ch02-b09
          speaker: king
          text: 有人给他们送过信吗？
        - id: ch02-b10
          speaker: young_man
          text: 送过。彼得一两个月前刚病倒时就送了。他当时已经觉得，自己这回大概好不了。他年纪很大，乔治的女儿们又太小，只有红头发的玛丽·简还能陪陪他。乔治和妻子去年双双去世以后，他一直很孤单，对活下去也不大在意了。他一心想见哈维，当然也想见威廉。彼得最受不了立遗嘱，只肯给哈维留一封信，写明钱藏在哪里，其余财产怎么分，好让乔治那几个一无所有的女儿有个依靠。大家费尽力气，也只劝得他亲笔写了这封信。
        - id: ch02-b11
          speaker: king
          text: 哈维为什么没来？他住在哪儿？
        - id: ch02-b12
          speaker: young_man
          text: 他住在英国谢菲尔德，在那里当牧师，从没来过这个国家。留给他赶路的时间也不多。再说，那封信也许根本没有送到。
        - id: ch02-b13
          speaker: king
          text: 可怜的人没能活着见弟弟们一面，实在太可惜了。你刚才说要去新奥尔良？
        - id: ch02-b14
          speaker: young_man
          text: 对，不过那只是半路。下星期三，我要坐海船去里约热内卢，我舅舅住在那里。
        - id: ch02-b15
          speaker: king
          text: 路可真远，不过一定很美。真希望我也能去。玛丽·简是老大吗？另外两个姑娘多大？
        - id: ch02-b16
          speaker: young_man
          text: 玛丽·简十九岁，苏珊十五岁，乔安娜大约十四岁。乔安娜就是那个一心做好事、嘴唇豁了一道的姑娘。
        - id: ch02-b17
          speaker: king
          text: 可怜的孩子们，就这样孤零零留在冷酷的世上。
        - id: ch02-b18
          speaker: young_man
          text: 她们也不算无依无靠。老彼得有不少朋友，他们不会让姑娘们吃苦。有浸礼会牧师霍布森、洛特·霍维执事、本·拉克、阿布纳·沙克尔福德、律师利维·贝尔、鲁滨逊医生和他们的太太，还有巴特利寡妇。朋友当然不只这些，不过这几位跟彼得最要好，他写信回家时也提过。哈维来了，自然知道该找谁。
    - id: ch03
      title: 骗局成形
      blocks:
        - id: ch03-b01
          speaker: huck
          text: 老家伙接着问个没完，简直把年轻人肚子里的话全掏空了。这个该死的镇子里，不论什么人、什么事，他都打听得清清楚楚。威尔克斯一家的情形，他也一件没落下。彼得是制革匠，乔治是木匠，哈维是不从国教的牧师。问完这些，他才问年轻人为什么一路步行到汽船这里。
        - id: ch03-b02
          speaker: young_man
          text: 那是开往新奥尔良的大船，我怕它不肯在村边停。船吃水深的时候，岸上有人招呼也不停。辛辛那提来的船会停，可这艘来自圣路易斯。
        - id: ch03-b03
          speaker: king
          text: 彼得·威尔克斯家里富裕吗？
        - id: ch03-b04
          speaker: young_man
          text: 挺富裕。他有房有地，听说还在某处藏了三四千美元现钱。
        - id: ch03-b05
          speaker: king
          text: 他是什么时候去世的？葬礼大概在明天吧？
        - id: ch03-b06
          speaker: young_man
          text: 昨天夜里去世的。葬礼约莫明天中午举行。
        - id: ch03-b07
          speaker: king
          text: 真叫人伤心。不过人人早晚都有这一天，要紧的是先做好准备。准备好了，就不用害怕。
        - id: ch03-b08
          speaker: young_man
          text: 是的，先生，这样最好。我妈以前总这么说。
        - id: ch03-b09
          speaker: huck
          text: 我们赶到汽船旁边时，货已经快装完了，没多久船就开走了。国王从头到尾根本不提上船，我盼着坐一回汽船，到底还是没坐成。等船一走，他又让我往上游划一英里，在一个四下无人的荒僻地方上了岸。
        - id: ch03-b10
          speaker: king
          text: 马上赶回去，把公爵和新买的旅行包带来。要是他去了对岸，你就过河找他。告诉他，不管手头有什么事，都要赶紧过来。快去！
        - id: ch03-b11
          speaker: huck
          text: 我已经看出他的打算，可当然什么也没说。我回到木筏去找公爵。要是他已经去了对岸，我还得渡河把他带回来。等我们回到约好的地方，先藏好独木舟，两个人才在圆木上坐下。国王把年轻人的话从头到尾复述一遍，一个字也没漏。他一边讲，一边试着装英国口音。一个窝囊废能装得这么像，已经相当不错。我学不来，也不打算试。
        - id: ch03-b12
          speaker: king
          text: 比尔吉沃特，聋哑人那套你行不行？
        - id: ch03-b13
          speaker: duke
          text: 交给我好了。我从前在戏台上演过聋哑人。
        - id: ch03-b14
          speaker: huck
          text: 他们就这样坐着等汽船。下午过了一半，来了两艘小船，可它们出发的地方离这里不够远，只好放过去。最后终于来了一艘大汽船。他们招手叫停，汽船放下小艇来接我们。我们上船以后，才知道它来自辛辛那提。船上的人听说我们只走四五英里，顿时火冒三丈。他们骂了一通，还说不肯送我们上岸。国王却一点也不慌。
        - id: ch03-b15
          speaker: king
          text: 几位先生若是肯付每人每英里一美元，请小艇接送，汽船总该载得起他们吧？
        - id: ch03-b16
          speaker: huck
          text: 那些人这才消了气，说这样就没问题。
    - id: ch04
      title: 威尔克斯兄弟登岸
      blocks:
        - id: ch04-b01
          speaker: huck
          text: 到了村边，汽船上的人又放下小艇，把我们三个送到岸上。二十来个男人远远看见小艇朝村边过来，就一下子全往河岸涌去，围在那里等着看看我们究竟是什么人。
        - id: ch04-b02
          speaker: king
          text: 哪位先生能告诉我，彼得·威尔克斯先生住在哪里？
        - id: ch04-b03
          speaker: huck
          text: 那些人互相看了一眼，又一起点了点头，那副神情分明是在说：“瞧，我早就告诉过你们吧。”接着，其中一个人把声音放得又低又柔，开口回答国王。
        - id: ch04-b04
          speaker: townsman
          text: 对不起，先生。我们最多只能告诉您，他昨天傍晚以前住在哪里。
        - id: ch04-b05
          speaker: huck
          text: 一眨眼，那个下贱的老东西整个人都垮了。他扑到镇民身上，把下巴搁在人家肩头，眼泪顺着对方后背直淌。
        - id: ch04-b06
          speaker: king
          text: 唉，我们可怜的哥哥！他已经走了，我们连最后一面也没见着。这实在太、太难受了！
          emotion: sad
        - id: ch04-b07
          speaker: huck
          text: 国王转过身，一边号哭，一边朝公爵比出一大串蠢得要命的手势。公爵居然也把一只旅行包扔在地上，跟着放声痛哭。要说我见过比他们更会演的骗子，那才怪呢。
        - id: ch04-b08
          speaker: huck
          text: 男人们围过来安慰他们，说了许多好话，还替他们提着旅行包走上山坡。他们让两个骗子靠在自己身上哭，又把彼得临终时的情形原原本本告诉国王。国王听过一遍，再用手势从头到尾全讲给装聋哑人的公爵看。两个人为了那个死去的制革匠哭天抢地，仿佛一下失去了十二门徒。
        - id: ch04-b09
          speaker: huck
          text: 要是我从前见过这样的场面，那我就是个黑鬼。这一幕真叫人为整个人类害臊。
