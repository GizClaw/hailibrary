  chapters:
    - id: ch01
      title: CHAPTER XXIV.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Toward night the next day, we tied up beside a little willow island in midriver. There was a village on either bank, and the duke and the king began figuring out how to work both towns.
        - id: ch01-b02
          speaker: jim
          text: I hope this won't take more than a few hours. It's mighty hard lying in that wigwam all day with a rope around me.
        - id: ch01-b03
          speaker: huck
          text: Whenever we left Jim alone, we had to tie him. If somebody found him there loose, he wouldn't look much like a runaway. The duke agreed that spending every day bound up was hard, and promised to think of another way.
        - id: ch01-b04
          speaker: huck
          text: The duke was quick, and soon he had it. He put Jim into the King Lear costume, with its long curtain-calico gown, white horsehair wig, and whiskers. Then he painted Jim's face, hands, ears, and neck one flat, lifeless blue, like a man who had been drowned for nine days. Jim was the most horrible-looking sight I'd ever seen.
        - id: ch01-b05
          speaker: huck
          text: Next the duke painted a sign on a shingle. It said, "Sick Arab. Harmless unless he is out of his head." He nailed it to a strip of wood and planted it four or five feet in front of the wigwam.
        - id: ch01-b06
          speaker: jim
          text: I'm satisfied with this. It's a whole lot better than lying tied up every day for what feels like years and shaking all over whenever I hear a sound.
        - id: ch01-b07
          speaker: duke
          text: Make yourself comfortable. If anybody starts poking around, jump out of the wigwam, act wild, and give them a howl or two. They'll run off and leave you be.
        - id: ch01-b08
          speaker: huck
          text: That was sound judgment, though most men wouldn't wait around for the howl. One look would send an ordinary man running. Jim didn't merely look like he'd been dead. He looked worse than dead, and that blue paint made the whole disguise more dreadful.
        - id: ch01-b09
          speaker: huck
          text: The two rascals wanted to put on the Royal Nonesuch again because it had paid so well. But news of it might have traveled downriver, so they decided it wasn't safe. Nothing else pleased them either. At last the duke said he'd stay put for an hour or two, work his brains, and dream up something for the Arkansas village. The king would cross to the other town with no plan at all. He'd trust Providence to show him where the profit was, though I reckoned he meant the devil.
        - id: ch01-b10
          speaker: huck
          text: We'd bought store clothes at our last stop. The king put on his black outfit and told me to dress up too, so of course I did. He looked stiff and mighty fine. I'd never known clothes could change a person so much. Before, he had looked like the meanest old tramp alive. Now he could lift his new white beaver hat, bow, and smile so grand and pious that he might have stepped straight out of the ark. You could almost take him for old Leviticus himself.
        - id: ch01-b11
          speaker: huck
          text: Jim cleaned the canoe while I got my paddle. A big steamboat lay at the shore about three miles above town, taking on freight.
        - id: ch01-b12
          speaker: king
          text: Dressed like this, I ought to arrive from St. Louis, Cincinnati, or some other important place. Paddle for that steamboat, Huckleberry. We'll ride her down to the village.
        - id: ch01-b13
          speaker: huck
          text: Nobody had to tell me twice when a steamboat ride was offered. I reached shore half a mile above the village and skimmed along the quiet water beneath the bluff.
        - id: ch01-b14
          speaker: huck
          text: Before long, we came upon an innocent-looking young country fellow sitting on a log. The weather was powerful hot, and he was wiping sweat from his face. Two big carpetbags sat beside him.
        - id: ch01-b15
          speaker: king
          text: Turn her in to shore. Where are you headed, young man?
        - id: ch01-b16
          speaker: young_man
          text: I'm going to the steamboat. I'm bound for New Orleans.
        - id: ch01-b17
          speaker: king
          text: Then climb in. My servant will help with those bags. Adolphus, get out and give the gentleman a hand.
        - id: ch01-b18
          speaker: huck
          text: He meant me, so I climbed out and helped with the bags. Then the three of us started upriver again. The young fellow was mighty grateful. Carrying all that baggage in such weather had been hard work.
        - id: ch01-b19
          speaker: huck
          text: He asked where the king was going. The king claimed he'd come downriver and landed at the village across the way that morning. Now he was going a few miles upriver to visit an old friend on a farm.
        - id: ch01-b20
          speaker: young_man
          text: When I first saw you, I thought you had to be Mr. Wilks, and that you'd almost arrived in time. Then I figured you couldn't be him, or you wouldn't be paddling upriver. You aren't Mr. Wilks, are you?
        - id: ch01-b21
          speaker: king
          text: No, I'm Alexander Blodgett. Reverend Alexander Blodgett, I suppose I ought to say, since I'm one of the Lord's poor servants. Still, I can be sorry for Mr. Wilks if he has missed something by coming late. I surely hope he hasn't.
        - id: ch01-b22
          speaker: young_man
          text: He won't lose any property. He'll get all of that. But he missed seeing his brother Peter before he died. Maybe that matters to him and maybe it doesn't. Nobody can say. Peter would've given anything to see him, though. For three weeks, he hardly spoke of anything else.
        - id: ch01-b23
          speaker: young_man
          text: Peter hadn't seen Harvey since they were boys, and he'd never met their brother William at all. William is the deaf man who can't speak, and he's only about thirty or thirty-five. Peter and George were the only brothers who came to America. George was married, but he and his wife both died last year. Harvey and William are the only ones left, and neither got here in time.
        - id: ch01-b24
          speaker: king
          text: Did anyone send word to them?
        - id: ch01-b25
          speaker: young_man
          text: Yes. They sent word a month or two ago, when Peter first got sick. Peter said then that he didn't think he'd recover. He was pretty old, and George's girls were too young to be much company except for Mary Jane, the redheaded one. After George and his wife died, Peter got lonely and didn't seem to care much about living.
        - id: ch01-b26
          speaker: young_man
          text: He badly wanted to see Harvey, and William too. Peter couldn't bear to make a will. He left Harvey a letter saying where his money was hidden and how to divide the rest of the property so George's girls would be provided for. George had left them nothing. That letter was the only thing anyone could persuade Peter to write.
        - id: ch01-b27
          speaker: king
          text: Why do you think Harvey hasn't come? Where does he live?
        - id: ch01-b28
          speaker: young_man
          text: He's a preacher in Sheffield, England, and he's never been to this country. There hasn't been much time for him to get here. Besides, the letter might never have reached him.
        - id: ch01-b29
          speaker: king
          text: What a pity the poor man couldn't live to see his brothers. You said you're going to New Orleans?
        - id: ch01-b30
          speaker: young_man
          text: Yes, but that's only the first part. Next Wednesday, I'm taking a ship to Rio de Janeiro. My uncle lives there.
        - id: ch01-b31
          speaker: king
          text: That's a long trip, but it sounds wonderful. I wish I were going. Is Mary Jane the oldest? How old are the other girls?
        - id: ch01-b32
          speaker: young_man
          text: Mary Jane is nineteen, Susan is fifteen, and Joanna is about fourteen. Joanna is the one devoted to good works, and she has a harelip.
        - id: ch01-b33
          speaker: king
          text: Those poor girls, left all alone in the world.
        - id: ch01-b34
          speaker: young_man
          text: It could be worse. Peter had friends who won't let anything happen to them. There's Hobson, the Baptist preacher, Deacon Lot Hovey, Ben Rucker, Abner Shackleford, Levi Bell the lawyer, Dr. Robinson and their wives, and Widow Bartley. There are plenty more, but those were Peter's closest friends. He mentioned them in his letters home, so Harvey will know who to turn to when he arrives.
        - id: ch01-b35
          speaker: huck
          text: The old man kept asking questions until he'd emptied that young fellow of everything he knew. He dug into nearly everyone and everything in that blessed town, along with the whole Wilks family. Peter had been a tanner, George a carpenter, and Harvey a minister outside the established church. The king kept at it until there was hardly another fact left to ask about.
        - id: ch01-b36
          speaker: king
          text: Why were you walking all this way to catch the steamboat?
        - id: ch01-b37
          speaker: young_man
          text: She's a big New Orleans boat, and I was afraid she might not stop at the village. When those boats are loaded deep, they won't answer a hail. A Cincinnati boat will, but this one came from St. Louis.
        - id: ch01-b38
          speaker: king
          text: Did Peter Wilks leave much behind?
        - id: ch01-b39
          speaker: young_man
          text: Quite a bit. He owned houses and land, and people figure he hid three or four thousand dollars in cash somewhere.
        - id: ch01-b40
          speaker: king
          text: When did he die?
        - id: ch01-b41
          speaker: young_man
          text: I hadn't said before. It was last night.
        - id: ch01-b42
          speaker: king
          text: I suppose the funeral is tomorrow?
        - id: ch01-b43
          speaker: young_man
          text: Yes, around noon.
        - id: ch01-b44
          speaker: king
          text: It's terribly sad, but every one of us has to die sometime. The important thing is to be prepared. Then we'll be all right.
        - id: ch01-b45
          speaker: young_man
          text: Yes, sir. That's the best way. My mother always used to say so.
        - id: ch01-b46
          speaker: huck
          text: When we reached the steamboat, she had almost finished loading. Soon she pulled away. The king never suggested that we board, so I lost my ride after all. Once the boat was gone, he made me paddle another mile to a lonely place and stepped ashore.
        - id: ch01-b47
          speaker: king
          text: Hurry back and bring the duke here with the new carpetbags. If he's crossed to the other village, go fetch him there. Tell him to dress himself up properly, no matter what it takes. Get moving.
        - id: ch01-b48
          speaker: huck
          text: I knew exactly what he was planning, but I kept quiet. I brought the duke back, and we hid the canoe. The two men sat on a log while the king repeated every last thing the young traveler had told him.
        - id: ch01-b49
          speaker: huck
          text: All the while, the king practiced speaking like an Englishman. For such a worthless old fellow, he did it pretty well. I can't imitate the sound, so I won't try.
        - id: ch01-b50
          speaker: king
          text: Bilgewater, how well can you play a deaf man who can't speak?
        - id: ch01-b51
          speaker: huck
          text: The duke said that part was no trouble. He'd played a deaf man who couldn't speak on the stage. Then they waited for another steamboat.
        - id: ch01-b52
          speaker: huck
          text: Around midafternoon, two small boats came by, but neither had started far enough upriver to suit the king's scheme. At last, a big boat appeared. They hailed her, and she sent out a yawl to take us aboard. She had come from Cincinnati, which was just what the pair needed for their grand arrival.
        - id: ch01-b53
          speaker: huck
          text: When the crew learned we only wanted to travel four or five miles, they got furious. They cursed us and said they wouldn't put us ashore. The king stayed calm.
        - id: ch01-b54
          speaker: king
          text: If gentlemen can pay a dollar apiece for every mile the yawl carries them out and back, surely a steamboat can afford to take them. Can't it?
        - id: ch01-b55
          speaker: huck
          text: That softened the crew. They agreed, and when we reached the village, the yawl carried us ashore. About two dozen men hurried down when they saw us coming.
        - id: ch01-b56
          speaker: king
          text: Gentlemen, can any of you tell me where Mr. Peter Wilks lives?
        - id: ch01-b57
          speaker: huck
          text: The men glanced at one another and nodded, as if this arrival proved something they'd already guessed. One man answered in a soft, gentle voice.
        - id: ch01-b58
          speaker: townsman
          text: I'm sorry, sir. The best we can do is tell you where Mr. Wilks lived yesterday evening.
          emotion: sad
        - id: ch01-b59
          speaker: huck
          text: In an instant, the miserable old king seemed to collapse. He fell against the man, rested his chin on the man's shoulder, and cried down his back.
        - id: ch01-b60
          speaker: king
          text: Alas, our poor brother is gone, and we never got to see him. Oh, this is too cruel. It's far too cruel!
          emotion: sad
        - id: ch01-b61
          speaker: huck
          text: Still blubbering, he turned and made a string of foolish signs to the duke, pretending to tell his deaf brother the news. Then the duke dropped a carpetbag and burst into tears. Those two frauds could beat anybody I'd ever met.
        - id: ch01-b62
          speaker: huck
          text: The men crowded around to comfort them. They spoke all sorts of kind words, carried the carpetbags uphill, and let the pair lean against them and cry as they walked. They told the king every detail of his brother's final moments, and the king signed the whole story to the duke.
        - id: ch01-b63
          speaker: huck
          text: Both men mourned that dead tanner as if they'd lost all twelve disciples. I'd never seen anything like it. They were enough to make a person ashamed of the whole human race.
