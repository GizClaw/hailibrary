audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第三十八章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 那几支笔难做得要命，锯子也一样。吉姆看着这些活儿，觉得最难的还在后头，那就是囚犯用手在牢墙上抓刻出来、留给后人看的铭文。可汤姆说，无论多难，铭文和纹章都非有不可，因为每个国事犯都会留下这些东西，从来没有例外。
        - id: ch01-b02
          speaker: tom
          text: 你想想简·格雷夫人，再想想吉尔福德·达德利和老诺森伯兰。哈克，就算麻烦又能怎样？根本躲不过去。吉姆一定得有铭文，也一定得有纹章，别人全都有。
        - id: ch01-b03
          speaker: huck
          text: 吉姆一听，马上提出一个难处。
        - id: ch01-b04
          speaker: jim
          text: 汤姆少爷，我哪有什么纹章呀？我只有身上这件旧衬衫，还得拿它写日记呢。
        - id: ch01-b05
          speaker: tom
          text: 吉姆，你没弄懂。纹章跟衣裳根本不是一回事。
        - id: ch01-b06
          speaker: huck
          text: 不过吉姆说得没错，他确实没有纹章。
        - id: ch01-b07
          speaker: tom
          text: 这还用你告诉我？可他离开这里以前准会有一个。咱们要按正经规矩把他救出去，不能让他的履历留下缺憾。
        - id: ch01-b08
          speaker: huck
          text: 我和吉姆各拿一块碎砖磨笔。他磨黄铜做的那支，我磨勺子做的那支，汤姆则坐在一边，专心替吉姆设计纹章。过了一阵，他说自己想出的好图案实在太多，选都选不过来，不过总算定下一个最合适的。
        - id: ch01-b09
          speaker: tom
          text: 盾徽右下方画一道金色斜带，中间放一面桑葚紫的斜十字。再画一条卧狗，脚下压着垛口形锁链，代表奴役。盾首用绿色人字纹，边缘做成锯齿。天蓝底上添三道内凹线，脐点跃立在锯齿折线上。盔饰是一名黑色的逃亡黑奴，肩上背包袱，站在左斜杠上。两旁用一对红色人物扶盾，也就是你和我。格言写“Maggiore fretta, minore atto”。书上说，它的意思是越着急，走得越慢。
        - id: ch01-b10
          speaker: huck
          text: 我的乖乖，那其余的东西是什么意思？
        - id: ch01-b11
          speaker: tom
          text: 哪有时间管那些？咱们得拼命赶工了。
        - id: ch01-b12
          speaker: huck
          text: 那你至少解释几样吧。什么叫中间？
        - id: ch01-b13
          speaker: tom
          text: 中间嘛，中间就是……你根本用不着知道。等吉姆刻到那里，我自然会告诉他怎么刻。
        - id: ch01-b14
          speaker: huck
          text: 得了吧，汤姆，告诉人家又怎么了？左斜杠又是什么？
        - id: ch01-b15
          speaker: tom
          text: 这个我也不知道。可吉姆必须有，所有贵族都有。
        - id: ch01-b16
          speaker: huck
          text: 汤姆就是这样。只要他不想解释，哪怕追问一个星期也休想问出答案。纹章安排妥当，他又开始编凄惨的铭文，说每个囚犯都得留下一篇。他一口气编了四篇，认真写在纸上，再一篇篇念给我们听。
        - id: ch01-b17
          speaker: tom
          text: 第一篇是“一颗被囚的心在此迸裂”。第二篇是“一个被世人和朋友遗弃的可怜囚徒，在此愁苦终生”。第三篇是“孤独囚禁三十七年后，一颗寂寞的心在此破碎，一个疲惫的灵魂从此安息”。
        - id: ch01-b18
          speaker: tom
          text: 第四篇是“一位高贵的异乡人，路易十四的私生子，无家无友，惨遭囚禁三十七年后，殒命于此”。
          emotion: sad
        - id: ch01-b19
          speaker: huck
          text: 汤姆越念声音越颤，差点儿哭起来。四篇都好得叫他没法取舍，最后决定让吉姆全刻上。吉姆说，用一根钉子把这么多玩意儿刻在圆木上，准得花整整一年，而且自己根本不会写字。汤姆说，他会先把每个字描出来，吉姆什么也不用想，只管沿线刻。可没多久，他又改了主意。
        - id: ch01-b20
          speaker: tom
          text: 不对，不能刻在圆木上。地牢哪有圆木墙？得找块石头，把铭文凿进石头里。
        - id: ch01-b21
          speaker: huck
          text: 吉姆说石头比圆木更糟，要把那么多字全凿进去，得花上老鼻子工夫，等凿完，这辈子也别想出去了。汤姆答应让我帮忙，又来查看我们的笔。那活儿又慢又难，烦人透顶。我手上的伤口一直没机会养好，我们忙了半天，却几乎毫无进展。汤姆看过以后，又有了办法。
        - id: ch01-b22
          speaker: tom
          text: 咱们反正要找石头刻纹章和铭文，不如一石二鸟。磨坊有一盘特别大的磨石。把它偷来，既能刻字，也能磨笔和锯子。
        - id: ch01-b23
          speaker: huck
          text: 这主意确实不赖，那盘磨石的块头也确实大得够瞧。还没到半夜，我们便留下吉姆干活，溜去磨坊。磨石偷到了，可滚回家难得要命。不管我们怎么使劲，它还是老往旁边倒，每回都差点儿把我们压扁。汤姆说，事情办完以前，它准会要掉我们一个人的命。
        - id: ch01-b24
          speaker: huck
          text: 滚到半路，我们累得一丝力气也没了，浑身的汗水几乎把人淹死，只好回去找吉姆。吉姆抬起床，把锁链从床腿上褪下来，一圈又一圈缠在脖子上，再跟我们从洞里爬出去。我和他一块儿上手，刚才要命的磨石一下变得轻松，很快就向前滚了。汤姆只管站在一旁监督。他比我见过的任何男孩都更会监督别人，好像样样事情都知道该怎么办。
        - id: ch01-b25
          speaker: huck
          text: 我们挖的洞已经不小，却还是容不下磨石。吉姆拿起鹤嘴锄，很快就把洞刨得够宽。汤姆用钉子在石面描好纹章和铭文，让吉姆拿那根钉子当凿子，再从棚屋的垃圾里找出一根铁闩当锤子。他得一直凿到剩下的蜡烛烧完，才可以上床。睡觉以前，还得把磨石藏进草褥子底下，整夜压在身子下面。
        - id: ch01-b26
          speaker: huck
          text: 我们替吉姆把锁链重新扣回床腿，自己也准备睡了。汤姆却忽然想起一件事。
        - id: ch01-b27
          speaker: tom
          text: 吉姆，你这里有蜘蛛吗？
        - id: ch01-b28
          speaker: jim
          text: 谢天谢地，一只也没有，汤姆少爷。
        - id: ch01-b29
          speaker: tom
          text: 那好，我们给你弄几只来。
        - id: ch01-b30
          speaker: jim
          text: 小少爷，我可不想要蜘蛛。我怕那东西。真要我选，我宁可身边有几条响尾蛇。
        - id: ch01-b31
          speaker: huck
          text: 汤姆想了一会儿，竟觉得这个主意好极了。
        - id: ch01-b32
          speaker: tom
          text: 从前肯定有囚犯养过响尾蛇，这是明摆着的。对，这个主意真不错。你打算把它养在哪儿？
        - id: ch01-b33
          speaker: jim
          text: 养什么呀，汤姆少爷？
        - id: ch01-b34
          speaker: tom
          text: 当然是响尾蛇。
        - id: ch01-b35
          speaker: jim
          text: 我的老天爷呀！这里要是进来一条响尾蛇，我拿脑袋也要一头撞穿圆木墙，逃出去！
          emotion: fearful
        - id: ch01-b36
          speaker: tom
          text: 养上一阵，你就不怕了，还能把它驯服。
        - id: ch01-b37
          speaker: jim
          text: 你要我驯服一条响尾蛇？
          emotion: surprised
        - id: ch01-b38
          speaker: tom
          text: 这很容易。动物受到疼爱和抚摸，都会懂得感恩，连伤害疼它的人都不会想，随便哪本书都会这样告诉你。我只要求你试两三天。过不了多久，它就会爱上你，跟你睡觉，一分钟也舍不得离开。到那时，你把它缠在脖子上也行，它甚至会乖乖让你把蛇头放进嘴里。
        - id: ch01-b39
          speaker: jim
          text: 求求你别说啦，汤姆少爷，我受不了！它肯让我把蛇头塞进嘴里，算是给我面子，是不是？那我等一辈子也不会开口求它。我也不要它跟我睡觉。
          emotion: fearful
        - id: ch01-b40
          speaker: tom
          text: 别犯傻了，吉姆。囚犯总得养一种不会说话的宠物，这是规矩。要是从前真没有囚犯养过响尾蛇，那不是更好吗？你会成为第一个尝试的人，得到的光荣比别人都大。你就算为了救自己的命想破脑袋，也找不到更好的办法让自己名垂千古。
        - id: ch01-b41
          speaker: jim
          text: 我不要这种光荣。蛇一口咬掉吉姆的下巴，光荣还有什么用？不，少爷，我不干。
        - id: ch01-b42
          speaker: tom
          text: 真见鬼，你就试一下不行吗？要是不成，也不用继续养。
        - id: ch01-b43
          speaker: jim
          text: 可我试的时候挨上一口，那就全完了。汤姆少爷，只要事情还讲理，我差不多都肯做。可你和哈克要是弄来响尾蛇叫我驯，我一定离开这里。
        - id: ch01-b44
          speaker: tom
          text: 好吧，既然你这么犟，那就算了。咱们弄几条袜带蛇，在尾巴上绑几颗纽扣，假装是响尾蛇，也只好这样了。
        - id: ch01-b45
          speaker: jim
          text: 袜带蛇我还能忍，可没有它们，我本来也过得好好的。我从前真不知道，当囚犯会有这么多麻烦，要受这么多罪。
        - id: ch01-b46
          speaker: tom
          text: 要按规矩办，囚犯就是这么麻烦。对了，你这儿有耗子吗？
        - id: ch01-b47
          speaker: jim
          text: 没有，少爷，我一只也没见过。
        - id: ch01-b48
          speaker: tom
          text: 那我们给你弄几只来。
        - id: ch01-b49
          speaker: jim
          text: 汤姆少爷，我也不想要耗子。人正要睡觉，它们偏在身上爬，窸窸窣窣地闹，还咬人的脚。没有比它们更会搅人的畜生了。要是非养不可，我宁可要袜带蛇，千万别给我耗子。
        - id: ch01-b50
          speaker: tom
          text: 可你必须有耗子，所有囚犯都有，从来找不出一个例外，所以别再为这事闹了。他们训练耗子，疼它们，教它们耍把戏，最后把它们养得像苍蝇一样亲人。当然，你还得给耗子奏乐，不然可不成。你这里有没有什么东西可以拿来奏乐？
        - id: ch01-b51
          speaker: jim
          text: 我只有粗齿梳子、一张纸和一只口簧琴。可耗子未必瞧得上口簧琴吧。
        - id: ch01-b52
          speaker: tom
          text: 当然瞧得上。耗子不在乎是什么音乐，口簧琴配它们已经绰绰有余了。所有动物都爱音乐，牢里的动物更是喜欢得不得了，尤其爱听难听的曲子，而口簧琴偏偏只能吹出这种声音。它们一听就会来了兴趣，跑出来看你究竟出了什么毛病。
        - id: ch01-b53
          speaker: tom
          text: 每天晚上睡前，再加上一大清早，你都坐在床上吹口簧琴，就吹《最后一环已经断裂》。没有哪首曲子比它更会招耗子。只要吹上两分钟，耗子、蛇、蜘蛛和别的东西就会觉得你出了事，开始替你担心。它们会一股脑儿赶过来，成群结队爬满你一身，快快活活地玩个痛快。
        - id: ch01-b54
          speaker: jim
          text: 它们是会玩得痛快，可吉姆过的又是什么日子？我真看不出这有什么好。不过既然非做不可，我就做吧，最好把这些畜生哄高兴，免得大家住在一起还要闹事。
        - id: ch01-b55
          speaker: huck
          text: 汤姆没有马上走。他停下来，把囚犯应有的东西从头到尾仔细想了一遍，看看还有没有遗漏。不久，他果然又想起一件事。
        - id: ch01-b56
          speaker: tom
          text: 对了，你觉得自己能在这里种活一朵花吗？
        - id: ch01-b57
          speaker: jim
          text: 也许能吧，汤姆少爷。可这里黑得很，而且我也用不着花，种起来还特别麻烦。
        - id: ch01-b58
          speaker: tom
          text: 你还是试试，别的囚犯种过花。
        - id: ch01-b59
          speaker: jim
          text: 这里也许能长那种像大猫尾巴的毛蕊花。可种它费的工夫，它连一半都不值。
        - id: ch01-b60
          speaker: tom
          text: 才不是。我们会给你弄一棵小的，你把它栽在那边的角落里，每天照料，慢慢养大。还有一件事，不能叫它毛蕊花。花只要进了牢房，正经名字就得叫“皮契奥拉”。光改名字还不够，你必须用自己的眼泪浇它。
        - id: ch01-b61
          speaker: jim
          text: 可我有的是泉水呀，汤姆少爷。
        - id: ch01-b62
          speaker: tom
          text: 不能用泉水，必须用眼泪。囚犯一向这么做。
        - id: ch01-b63
          speaker: jim
          text: 我敢说，别人用眼泪才刚种出一棵，我用泉水已经能种活两棵了。
        - id: ch01-b64
          speaker: tom
          text: 关键不在这里。你非用眼泪不可。
        - id: ch01-b65
          speaker: jim
          text: 那它在我手里准会死，因为我几乎从来不哭。
        - id: ch01-b66
          speaker: huck
          text: 这下汤姆也没了办法。他又琢磨了一阵，只好让吉姆拿洋葱凑合，好叫眼泪能够流出来。汤姆还答应，第二天早晨会去黑人住的小屋，趁别人不留神，偷偷往吉姆的咖啡壶里丢一只洋葱。
        - id: ch01-b67
          speaker: jim
          text: 那我还不如往咖啡里放烟叶呢。做笔、刻铭文、写日记已经够忙了，现在还要照料毛蕊花，给耗子吹口簧琴，再成天疼蛇、哄蜘蛛，叫这些东西全都高兴。要做的活儿一样压着一样。当个囚犯竟比我做过的任何事情都费事，还得操这么多心，担这么多责任。
        - id: ch01-b68
          speaker: huck
          text: 吉姆把这些麻烦一件件数出来，越抱怨，汤姆越没耐心，差点儿彻底发火。汤姆说，从古到今，没有哪个囚犯身上压着这么多辉煌机会，可以为自己挣下大名。吉姆偏偏不知道珍惜，这些难得的机会落到他身上，简直全糟蹋了。吉姆听后很过意不去，向汤姆赔了不是，答应以后再也不这样抱怨。于是我和汤姆赶紧离开小屋，回去睡觉。
