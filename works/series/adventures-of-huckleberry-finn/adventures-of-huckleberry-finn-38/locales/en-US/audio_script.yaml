audio_script:
  language: en-US
  cast:
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    tom:
      display_name: Tom Sawyer
      tts:
        delivery: quick-witted and theatrically confident
        timbre: bright and youthful
        pace: lively
        pitch: medium
    jim:
      display_name: Jim
      tts:
        delivery: warm, practical, and deeply expressive
        timbre: mature and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: CHAPTER XXXVIII.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: Making those pens was miserable hard work, and so was making the saw. Jim figured the inscription would be hardest of all. That was the message a proper state prisoner scratched on the wall to leave behind, with his coat of arms beside it. Tom said there was no getting around either one.
        - id: ch01-b02
          speaker: tom
          text: Think of Lady Jane Grey, and Gilford Dudley, and old Northumberland! Maybe it is a heap of trouble, Huck, but what can we do? Jim has to make his inscription and his coat of arms. Every state prisoner does.
        - id: ch01-b03
          speaker: jim
          text: But Mars Tom, I ain't got any coat of arms. All I've got is this old shirt, and you know I have to keep my journal on that.
        - id: ch01-b04
          speaker: tom
          text: You don't understand, Jim. A coat of arms is something else entirely.
        - id: ch01-b05
          speaker: huck
          text: Jim is right about not having one, Tom. He truly hasn't got one.
        - id: ch01-b06
          speaker: tom
          text: I know that. But he'll have one before he gets out. He's going out the proper way, and his record won't have a single flaw in it.
        - id: ch01-b07
          speaker: huck
          text: Jim and I went on filing our pens against chunks of brick. His was made from brass, and mine from the spoon. Meanwhile, Tom worked out a coat of arms. After a while, he said he'd thought of so many fine choices that picking one was difficult. Still, he had finally settled on the best of them.
        - id: ch01-b08
          speaker: tom
          text: On the shield we'll put a gold bend in the right-hand base, a purple saltire across the middle, and a crouching dog as the common charge. Under the dog's foot goes an embattled chain for slavery. Above that comes a green chevron in an engrailed chief, with three invected lines on a blue field and rampant nombril points on an indented dancette. The crest will show a Black runaway carrying his bundle over one shoulder on a bar sinister. You and Huck can be the two red supporters. The motto is “Maggiore fretta, minore atto.” I found that in a book. It means, “The more haste, the less speed.”
        - id: ch01-b09
          speaker: huck
          text: Good grief, Tom. What does all the rest of that mean?
        - id: ch01-b10
          speaker: tom
          text: We can't waste time explaining it. We need to get to work as hard as we can.
        - id: ch01-b11
          speaker: huck
          text: Tell me one part, anyway. What's a fess?
        - id: ch01-b12
          speaker: tom
          text: A fess is... well, you don't need to know what it is. When Jim reaches that part, I'll show him how to draw it.
        - id: ch01-b13
          speaker: huck
          text: Shucks, Tom, you could at least tell a person. What's a bar sinister?
        - id: ch01-b14
          speaker: tom
          text: I don't know. But Jim has to have one. All the nobility have them.
        - id: ch01-b15
          speaker: huck
          text: That was Tom all over. If explaining something didn't suit him, you could question him for a week and never get an answer.
        - id: ch01-b16
          speaker: huck
          text: Once the coat of arms was settled, Tom turned to the mournful inscription. Jim needed one because every proper prisoner had one. Tom wrote several on paper and read them aloud.
        - id: ch01-b17
          speaker: tom
          text: “Here a captive heart busted.”
        - id: ch01-b18
          speaker: tom
          text: “Here a poor prisoner, abandoned by the world and his friends, wore out his sorrowful life.”
        - id: ch01-b19
          speaker: tom
          text: “Here a lonely heart broke, and a weary spirit went to rest after thirty-seven years of solitary captivity.”
        - id: ch01-b20
          speaker: tom
          text: “Here, homeless and friendless after thirty-seven years of bitter captivity, died a noble stranger, the natural son of Louis the Fourteenth.”
        - id: ch01-b21
          speaker: huck
          text: Tom's voice shook while he read, and he nearly broke down. Every inscription sounded so good to him that he couldn't choose. At last, he decided Jim should carve all four. Jim said scratching that much foolishness into the logs with a nail would take a year. Besides, he didn't know how to form the letters. Tom promised to mark every letter first. Then Jim would have nothing to do but guide his nail along the lines. A moment later, another thought struck Tom.
        - id: ch01-b22
          speaker: tom
          text: Wait. Logs won't do. A dungeon doesn't have log walls. The inscriptions have to be cut into rock, so we'll bring in a rock.
        - id: ch01-b23
          speaker: huck
          text: Jim said rock would be even worse than logs. Chiseling all four inscriptions into stone would take such an awful time that he'd never get out at all. Tom answered that I could help him do it. Then he checked our pens. Filing them against brick was tedious, punishing work. My sore hands had no chance to heal, and no matter how long Jim and I worked, neither of us seemed to make any headway.
        - id: ch01-b24
          speaker: tom
          text: I know the answer. We need a stone for the coat of arms and the inscriptions, so we'll make one stone do two jobs. There's a huge grindstone at the mill. We'll steal it, carve everything on it, and use it to file the pens and saw too.
        - id: ch01-b25
          speaker: huck
          text: It was a powerful good idea, and a powerful big grindstone. Still, we agreed to tackle it. Midnight hadn't come yet, so Tom and I left Jim working and slipped down to the mill. We stole the grindstone and started rolling it home. Moving that great round stone was awful work. No matter how carefully we balanced it, it kept falling over and nearly mashing us each time. Tom said it was sure to get one of us before we got through.
        - id: ch01-b26
          speaker: huck
          text: By the time we reached halfway, we were worn clean out and nearly drowned in sweat. We saw there was no use trying to finish alone, so we went back for Jim. He lifted his bed, slipped the chain from its leg, and wound the chain around and around his neck. Then the three of us crawled through the hole and returned to the stone. Jim and I leaned into it and rolled it along like it was nothing while Tom supervised. Tom could supervise better than any boy I ever saw. He always knew exactly how the work ought to be done.
        - id: ch01-b27
          speaker: huck
          text: Our hole was already large, but the grindstone still wouldn't pass through it. Jim took the pick and soon made the opening wide enough. Tom scratched the coat of arms and inscriptions onto the stone with a nail. Then he gave Jim that nail for a chisel and an iron bolt from the lean-to rubbish for a hammer. Jim was to keep carving until the last of his candle burned out. After that, he could hide the grindstone under his straw mattress and sleep on top of it.
        - id: ch01-b28
          speaker: huck
          text: We helped fasten Jim's chain to the bed leg again and were ready to turn in. Then Tom remembered one more thing.
        - id: ch01-b29
          speaker: tom
          text: Have you got any spiders in here, Jim?
        - id: ch01-b30
          speaker: jim
          text: No, sir, thank goodness I haven't, Mars Tom.
        - id: ch01-b31
          speaker: tom
          text: That's all right. We'll bring you some.
        - id: ch01-b32
          speaker: jim
          text: Bless you, honey, I don't want any. I'm afraid of spiders. I'd about as soon have rattlesnakes in here.
          emotion: fearful
        - id: ch01-b33
          speaker: huck
          text: Tom considered that for a minute or two.
        - id: ch01-b34
          speaker: tom
          text: Now that's a fine idea. I expect some prisoner has done it before. Somebody must have, when you think about it. Where could you keep one?
        - id: ch01-b35
          speaker: jim
          text: Keep what, Mars Tom?
        - id: ch01-b36
          speaker: tom
          text: A rattlesnake, of course.
        - id: ch01-b37
          speaker: jim
          text: Good gracious alive, Mars Tom! If a rattlesnake came in here, I'd smash straight through that log wall with my head!
          emotion: fearful
        - id: ch01-b38
          speaker: tom
          text: You'd stop being scared after a while, Jim. You could tame it.
        - id: ch01-b39
          speaker: jim
          text: Tame it?
          emotion: surprised
        - id: ch01-b40
          speaker: tom
          text: Easily. Every animal is grateful when you treat it kindly and pet it. It wouldn't dream of hurting the person who cared for it. Any book will tell you so. Just try it for two or three days. Before long, that snake will love you. It'll sleep beside you and follow you everywhere. It'll even let you wind it around your neck and put its head in your mouth.
        - id: ch01-b41
          speaker: jim
          text: Please, Mars Tom, don't say that! I can't bear to hear it. Let me put its head in my mouth, would it? Like it was doing me a favor? That snake would wait a mighty long time before I asked. And I surely don't want it sleeping with me.
          emotion: fearful
        - id: ch01-b42
          speaker: tom
          text: Don't be foolish, Jim. A prisoner has to keep some kind of silent pet. If no prisoner has tried a rattlesnake before, then you'll win more glory by being the first than you could in any other way.
        - id: ch01-b43
          speaker: jim
          text: I don't want that sort of glory, Mars Tom. Suppose the snake bites my chin off. Where's the glory then? No, sir. I want no part of it.
        - id: ch01-b44
          speaker: tom
          text: Can't you at least try? That's all I'm asking. If it doesn't work, you don't have to keep doing it.
        - id: ch01-b45
          speaker: jim
          text: If it bites me while I'm trying, the harm is already done. Mars Tom, I'll tackle most anything reasonable. But if you and Huck bring me a rattlesnake to tame, I am leaving. That's certain.
        - id: ch01-b46
          speaker: tom
          text: Fine, forget it, if you're going to be so stubborn. We'll get some garter snakes. You can tie buttons to their tails and pretend they're rattlesnakes. I suppose that will have to do.
        - id: ch01-b47
          speaker: jim
          text: I can stand garter snakes, Mars Tom, though I could manage just fine without them. I never knew being a prisoner took so much trouble.
        - id: ch01-b48
          speaker: tom
          text: It always does when you do it right. Have you got any rats in here?
        - id: ch01-b49
          speaker: jim
          text: No, sir. I haven't seen any.
        - id: ch01-b50
          speaker: tom
          text: Then we'll bring you some rats.
        - id: ch01-b51
          speaker: jim
          text: Mars Tom, I don't want rats. They're the worst creatures for troubling a man. They rustle all over him and bite his feet when he's trying to sleep. If I have to choose, give me the garter snakes. I have hardly any use for rats.
        - id: ch01-b52
          speaker: tom
          text: You have to keep them, Jim. Every prisoner does, so don't argue anymore. There has never been a prisoner without rats. They tame them, teach them tricks, and make them as friendly as flies. But you'll need to play music for them. Have you got an instrument?
        - id: ch01-b53
          speaker: jim
          text: I've only got a rough comb with a piece of paper and a Jew's harp. I don't reckon rats would care for a Jew's harp.
        - id: ch01-b54
          speaker: tom
          text: Certainly they would. Rats don't care what kind of music it is. A Jew's harp is good enough for them. All animals love music, especially prison animals, and the more painful it sounds, the better. A Jew's harp can't make any other kind. The noise interests them, and they come out to see what's wrong with you.
        - id: ch01-b55
          speaker: tom
          text: You're well supplied. Sit on your bed before sleep and again early in the morning. Play “The Last Link Is Broken.” Nothing draws a rat faster. In about two minutes, the rats, snakes, spiders, and all the rest will start worrying about you and come running. They'll swarm all over you and have a splendid time.
        - id: ch01-b56
          speaker: jim
          text: I reckon they will, Mars Tom, but what kind of time will I be having? I can't see the sense in it. Still, if I must do it, I will. I'd better keep the animals pleased so there won't be trouble in the house.
        - id: ch01-b57
          speaker: huck
          text: Tom paused to see if he had forgotten anything. Soon enough, he found something.
        - id: ch01-b58
          speaker: tom
          text: There's one more thing. Do you think you could grow a flower in here?
        - id: ch01-b59
          speaker: jim
          text: Maybe I could, Mars Tom, though it's fairly dark. I don't have any use for a flower, and tending one would be a powerful lot of work.
        - id: ch01-b60
          speaker: tom
          text: Try it anyway. Other prisoners have done it.
        - id: ch01-b61
          speaker: jim
          text: One of those big mullein stalks that look like cattails might grow in here. But it wouldn't be worth half the trouble it caused.
        - id: ch01-b62
          speaker: tom
          text: That's not true. We'll bring you a little one. Plant it in that corner and raise it there. And don't call it mullein. In a prison, its proper name is Pitchiola. You must water it with your tears.
        - id: ch01-b63
          speaker: jim
          text: But Mars Tom, I've got plenty of spring water.
        - id: ch01-b64
          speaker: tom
          text: Spring water is no good. A prison flower has to be watered with tears. That's how prisoners always do it.
        - id: ch01-b65
          speaker: jim
          text: I bet I could grow one mullein stalk twice as fast with spring water as another man could even start one with tears.
        - id: ch01-b66
          speaker: tom
          text: Speed isn't the point. You have to use tears.
        - id: ch01-b67
          speaker: jim
          text: That flower will die on me, Mars Tom. It surely will, because I hardly ever cry.
        - id: ch01-b68
          speaker: huck
          text: That stopped Tom for a while. He studied the problem and decided Jim would have to make do with an onion. In the morning, Tom would slip down to the enslaved people's cabins and secretly drop one into Jim's coffee pot.
        - id: ch01-b69
          speaker: jim
          text: I'd just as soon have tobacco in my coffee.
        - id: ch01-b70
          speaker: huck
          text: Then Jim complained about the whole business. He had to grow the mullein, play the Jew's harp for the rats, and pet and flatter the snakes, spiders, and every other creature Tom brought in. On top of that came making the pens, carving all four inscriptions, keeping the shirt journal, and doing all his other work. Jim said being a prisoner brought more trouble, worry, and responsibility than anything he'd ever taken on in his life.
        - id: ch01-b71
          speaker: huck
          text: Tom nearly lost his patience. He told Jim that no prisoner in the world had ever been loaded down with so many glorious chances to make a name for himself. Jim didn't know enough to value them, Tom said, so all those chances were almost wasted on him.
        - id: ch01-b72
          speaker: huck
          text: Jim was sorry. He promised he wouldn't carry on that way anymore. Then Tom and I went off to bed.
