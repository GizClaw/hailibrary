  chapters:
    - id: ch01
      title: CHAPTER THE LAST
      blocks:
        - id: ch01-b01
          speaker: huck
          text: The first chance I got Tom alone, I asked what he'd meant to do if our evasion worked. After all, we'd have set free a man who was free already.
        - id: ch01-b02
          speaker: tom
          text: I had it planned from the start. Once we got Jim away safe, we'd take the raft clear down to the mouth of the river and have adventures all the way. Then we'd tell him he was free and bring him home in style on a steamboat. We'd pay him for all the time he lost, send word ahead, and have all the Black folks around march him into town with torches and a brass band. Jim would be a hero, and so would we.
        - id: ch01-b03
          speaker: huck
          text: I reckoned things had turned out about as well the way they were.
        - id: ch01-b04
          speaker: huck
          text: We had Jim out of his chains in no time. Aunt Polly, Uncle Silas, and Aunt Sally heard how much he'd helped the doctor nurse Tom. They made a great fuss over him, fixed him up fine, gave him all he wanted to eat, and let him enjoy himself with no work to do. We brought him into Tom's sickroom, and the three of us had a long, grand talk together.
        - id: ch01-b05
          speaker: huck
          text: Tom paid Jim forty dollars for being such a patient prisoner and doing the whole business so well. Jim was nearly beside himself with pleasure.
        - id: ch01-b06
          speaker: jim
          text: There, Huck! What did I tell you back on Jackson's Island? I told you I had a hairy chest, and I told you what that sign meant. I was rich once, and I said I'd be rich again. Now it's come true. Here's the money! Don't tell me signs don't mean anything. Signs are signs, I tell you. I knew I'd be rich again just as surely as I know I'm standing here now!
          emotion: happy
        - id: ch01-b07
          speaker: huck
          text: Then Tom talked on and on. He proposed that the three of us slip away one night, buy our gear, and spend a couple of weeks having wild adventures among the Indians in the Territory.
        - id: ch01-b08
          speaker: huck
          text: That suits me. But I don't have any money for the gear, and I doubt I can get any from home. Pap has likely come back by now, taken every dollar from Judge Thatcher, and drunk it all up.
        - id: ch01-b09
          speaker: tom
          text: No, he hasn't. Your money is still there, more than six thousand dollars. Your pap hasn't come back at all. At least, he hadn't when I left.
        - id: ch01-b10
          speaker: huck
          text: Jim turned solemn before he answered.
        - id: ch01-b11
          speaker: jim
          text: He isn't coming back anymore, Huck.
          emotion: sad
        - id: ch01-b12
          speaker: huck
          text: Why not, Jim?
        - id: ch01-b13
          speaker: jim
          text: Never mind why. He just isn't coming back anymore.
        - id: ch01-b14
          speaker: huck
          text: I kept after him until he finally told me.
        - id: ch01-b15
          speaker: jim
          text: Remember that house floating down the river? There was a man inside with something covering him. I went in, uncovered him, and wouldn't let you come look. Well, you can get your money whenever you want it, because that man was your pap.
        - id: ch01-b16
          speaker: huck
          text: Tom is nearly well now. He wears the bullet around his neck on a watch chain, as if it belonged to a watch, and he's forever checking the time with it.
        - id: ch01-b17
          speaker: huck
          text: So there isn't anything more to write about, and I'm mighty glad of it. If I'd known how much trouble it was to make a book, I never would've started one. I won't take on another.
        - id: ch01-b18
          speaker: huck
          text: But I reckon I'll have to light out for the Territory before the others. Aunt Sally means to adopt me and civilize me, and I can't stand that. I've been through it before.
        - id: ch01-b19
          speaker: huck
          text: The end. Yours truly, Huck Finn.
