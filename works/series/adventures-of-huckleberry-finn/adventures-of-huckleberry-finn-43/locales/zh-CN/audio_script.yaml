audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    tom:
      display_name: 汤姆·索亚
      tts:
        delivery: 聪明自信，爱冒险，也爱在人前卖弄派头
        timbre: 明亮的少年嗓音
        pace: 灵活爽利
        pitch: 中高
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 末章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我终于逮着一个汤姆独处的机会，就问他，我们逃跑的时候，他心里到底怎么盘算的。吉姆明明已经是自由人了，要是我们顺利把他救走，接下来又该怎么办？
        - id: ch01-b02
          speaker: tom
          text: 这我早想好了。只要吉姆平安出来，咱们就带他坐木筏顺流而下，一路冒险，直到大河入海。到了那里，再告诉他其实早就自由了。然后咱们坐汽船，风风光光送他回家，还要赔他误工的钱。咱们先写信回去，把附近的黑奴都叫来，让他们打着火把，跟着铜管乐队，一边跳舞一边迎他进城。那时吉姆是英雄，咱们也是英雄。
        - id: ch01-b03
          speaker: huck
          text: 不过我觉得，事情现在这样收场，也不坏。我们很快卸掉了吉姆的锁链。波莉姨妈、西拉斯姨父和萨莉姨妈听说他怎样尽心帮医生照料汤姆，便好好招待他，还替他收拾得整整齐齐。他想吃什么都有，只管舒舒服服待着，也不用干活。
        - id: ch01-b04
          speaker: huck
          text: 后来，我们把吉姆请到病房，大家痛痛快快聊起来。汤姆给了他四十美元，说这是酬谢他耐心给我们当囚犯，还把这件事办得那么漂亮。吉姆一见那笔钱，欢喜得不得了。
        - id: ch01-b05
          speaker: jim
          text: 瞧见没有，哈克？在杰克逊岛上，我是怎么告诉你的？我说过，我胸口长毛，这是有兆头的。我从前阔过一回，以后还会再阔起来。现在不就应验了吗？钱就在这儿！你别跟我争，兆头就是兆头，准不会错。我早知道自己还会阔起来，就跟我知道自己正站在这里一样清楚！
          emotion: happy
        - id: ch01-b06
          speaker: huck
          text: 汤姆接着又说个不停。他想挑一个晚上，让我们三个悄悄离开这里，买齐行头，到西边的领地去，在印第安人中间痛痛快快冒上两个星期的险。
        - id: ch01-b07
          speaker: huck
          text: 我说这主意正合我心意，可我拿不出买行头的钱。家里的钱恐怕也指望不上。爸爸多半早已回来，从撒切尔法官那里把钱全领走，拿去喝光了。
        - id: ch01-b08
          speaker: tom
          text: 他没有回来。你的钱还全在那儿，足足有六千多美元。至少我离家以前，你爸爸一直没有露过面。
        - id: ch01-b09
          speaker: huck
          text: 吉姆听了，神情忽然变得有些凝重。
        - id: ch01-b10
          speaker: jim
          text: 哈克，他以后再也不会回来了。
        - id: ch01-b11
          speaker: huck
          text: 我问吉姆为什么这么说。
        - id: ch01-b12
          speaker: jim
          text: 你别问为什么，哈克。反正他不会再回来了。
        - id: ch01-b13
          speaker: huck
          text: 可我还是追着他问。吉姆推不过去，终于把实情告诉了我。
        - id: ch01-b14
          speaker: jim
          text: 你还记得那座顺河漂下来的房子吗？里面躺着一个人，身上盖着东西。我进去掀开看过，却没有让你跟进来。哈克，你什么时候想用自己的钱，就去拿吧。那个人就是你爸爸。
        - id: ch01-b15
          speaker: huck
          text: 如今汤姆的伤差不多好了。他把取出来的子弹穿在表链上，挂到脖子里当怀表，还总拿出来看时辰。到这里，实在没有别的事情可写了。我可真高兴。
        - id: ch01-b16
          speaker: huck
          text: 要是早知道写一本书这么费事，我压根儿不会动手。以后我也不打算再写了。不过，其他人还没动身，我大概就得先逃到西边的领地去。萨莉姨妈要收养我，还要好好教化我。这种日子我可受不了，因为我以前已经尝过一次了。
        - id: ch01-b17
          speaker: huck
          text: 全书完。你忠实的，哈克·费恩。
