audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    duke:
      display_name: 公爵
      tts:
        delivery: 圆滑善演，装腔时悲切庄重
        timbre: 成年而灵活
        pace: 机敏多变
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 粗俗狡黠，摆威风时夸张自得
        timbre: 苍老沙哑
        pace: 不紧不慢
        pitch: 低
    jim:
      display_name: 吉姆
      tts:
        delivery: 忠厚热情，关切时真挚自然
        timbre: 成年温厚
        pace: 从容
        pitch: 低
    boy:
      display_name: 路上的男孩
      tts:
        delivery: 好奇直率，说话毫不绕弯
        timbre: 年少清亮
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三十一章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 一连好多天，我们不敢再靠近任何镇子，只顾顺流往南漂。那时已经到了南方，天气暖了，家乡也早已远在身后。河边的树上渐渐垂下西班牙苔，灰白的一绺一绺，从枝头一直挂下来，像老人的长胡子。我从没亲眼见过那东西生长的样子。整片林子都叫它弄得庄严又阴森。两个骗子觉得已经走得够远，危险也甩在了后头，便又打起沿途村子的主意。
        - id: ch01-b02
          speaker: huck
          text: 他们先去讲戒酒，挣的钱却不够两个人喝醉。下一站又办舞蹈班，可他们懂的舞跟袋鼠差不多。才蹦第一下，全村人便冲进来，把他们蹦出了镇。后来他们还教朗诵，没教多久，听众就站起来痛骂一通，逼他们逃走。传教、催眠、治病、算命，他们什么都试了，样样倒霉。最后，两人穷得几乎一个子儿不剩，只能躺在木筏上，一想就是半天，一句话也不说，又灰心又绝望。
        - id: ch01-b03
          speaker: huck
          text: 后来他们换了做派，老是钻进棚屋，头碰着头，一连两三个钟头压低声音密谈。我和吉姆越看越不安，总觉得他们又在谋划比从前更坏的事。我们把各种可能翻来覆去地想。也许要闯进别人家里或铺子里行窃，也许要造假钞，也许还有别的坏事。我们都很害怕，于是商量好了，无论如何也不参与这种勾当。只要抓到一点机会，就甩掉他们，远远逃开，让他们留在后头。
        - id: ch01-b04
          speaker: huck
          text: 一天清早，我们把木筏藏在派克斯维尔下游两英里外。那是个又小又破的村子。国王独自上岸，叫大家藏好，说要进村打听有没有人听过《天下无双》。我心里明白，他其实是在找哪户人家好下手。等他抢完回来，就只能慢慢猜我、吉姆和木筏去了哪里。临走前，他说中午还不回来，就表示平安无事，公爵和我可以进村找他。
        - id: ch01-b05
          speaker: huck
          text: 公爵留在木筏上又急又燥，浑身冒汗，逮住什么骂什么。我和吉姆怎么做都不对。这里头准有鬼。到了中午，国王仍不见人，我反倒高兴。至少局面变了，说不定我也能趁机换个活法。
        - id: ch01-b06
          speaker: huck
          text: 我和公爵进村四处寻找，最后在一家低等小酒馆的后屋发现了国王。他醉得路也走不动，一群闲汉围着戏弄他取乐。他只能使出全身力气咒骂威胁，却拿谁也没办法。公爵一见便骂他老糊涂，他也立刻顶嘴还击。等两人真正吵得不可开交，我拔腿便跑，两条腿像挣脱了束缚，沿着河边大路飞驰得像只鹿。我知道机会终于来了，决心叫他们等上再长的日子，也休想再见到我和吉姆。
        - id: ch01-b07
          speaker: huck
          text: 我气喘吁吁地赶到木筏边，满心欢喜地喊了起来。
        - id: ch01-b08
          speaker: huck
          text: 快解开木筏，吉姆！我们这下自由啦！
          emotion: happy
        - id: ch01-b09
          speaker: huck
          text: 没有人回答，也没人从棚屋里出来。吉姆不见了。我喊了一声又一声，在林子里来回奔跑，扯着嗓子叫他，可一点用也没有。老吉姆真的不见了。我坐下来哭了一场，忍也忍不住，可又没法一直坐在那里。
        - id: ch01-b10
          speaker: huck
          text: 我走到大路上，一边想怎么办，一边遇见一个男孩。我把吉姆的衣着说给他听，问他见没见过这样一个陌生黑人。
        - id: ch01-b11
          speaker: boy
          text: 对，我见过这样一个人。
        - id: ch01-b12
          speaker: huck
          text: 在哪儿见的？
        - id: ch01-b13
          speaker: boy
          text: 就在赛拉斯·费尔普斯家，往下走两英里。他是逃跑的黑奴，已经叫人逮住了。你在找他？
        - id: ch01-b14
          speaker: huck
          text: 我才不找他！一两个钟头前，我在林子里碰见他。他说我敢喊，就把我的肝掏出来，还逼我趴下不准动。我一直躺到现在，吓得不敢出来。
          emotion: fearful
        - id: ch01-b15
          speaker: boy
          text: 现在不用怕了，人已经抓住。他是从南方什么地方逃来的。
        - id: ch01-b16
          speaker: huck
          text: 人确确实实抓住了，那就好。
        - id: ch01-b17
          speaker: boy
          text: 可不是嘛！他身上有两百块赏金，简直跟在路上捡钱一样。
        - id: ch01-b18
          speaker: huck
          text: 我要是再大些，那钱本来就是我的。我先看见他的。是谁抓住了他？
        - id: ch01-b19
          speaker: boy
          text: 一个上了年纪的外乡人。他得赶去上游，不能留下来等，就把领赏的权利四十块卖了。你想想看！换成我，等七年也愿意。
        - id: ch01-b20
          speaker: huck
          text: 我也愿意。不过他肯卖得这么便宜，也许那份权利不值更多，里头说不定有问题。
        - id: ch01-b21
          speaker: boy
          text: 一点问题也没有。我亲眼看过告示，上面把那人写得清清楚楚，像画出来的一样，还说他来自新奥尔良下边的一座种植园。那赏金肯定拿得到。喂，你有嚼烟吗？给我一点？
        - id: ch01-b22
          speaker: huck
          text: 我没有嚼烟，男孩便走了。我回到木筏，坐在棚屋里拼命想办法。脑袋都想疼了，也找不到一条出路。走了这么远，又替那两个恶棍做了那么多事，到头来全成了空，一切都破碎了，也毁掉了。他们竟狠得下心，为了四十块脏钱这样算计吉姆，把他重新推进奴役，还叫他余生都落在陌生人手里。
        - id: ch01-b23
          speaker: huck
          text: 我一度想，吉姆既然非当奴隶不可，还不如回到家人身边，那要强上一千倍。也许该写信给汤姆·索亚，请他告诉华生小姐吉姆在哪儿。可这个念头很快又行不通了，而且有两个理由。华生小姐会为吉姆逃走大发脾气，恨他又无赖又不知感恩，可能立刻把他卖到下游。就算她不卖，人人也会瞧不起他们眼里忘恩负义的黑奴，天天叫吉姆感到那份轻蔑，弄得他也觉得自己卑贱可耻。
        - id: ch01-b24
          speaker: huck
          text: 还有我呢。消息会传遍家乡，人人都会知道哈克·费恩帮一个黑奴逃向自由。以后只要再遇见镇上的熟人，我会羞得恨不得趴下舔他的靴子。人就是这样，干了大家眼里的下贱事，却又不愿承担后果，总觉得只要把事情藏住，别人不知道，就不算丢脸。我正是这个处境。越怕别人知道，心里的良心反倒磨得越厉害。
        - id: ch01-b25
          speaker: huck
          text: 我越想，良心磨得越狠，也越觉得自己邪恶、下流、卑贱。忽然间，我像挨了上帝一记耳光。我以为天上一直看着我，知道我怎样从一个从没害过我的可怜老太太手里偷走她的黑奴。如今上帝终于出手，告诉我这样的罪恶不能一直放任下去。我吓得差点倒下。
        - id: ch01-b26
          speaker: huck
          text: 我还想替自己开脱，说我从小就被教坏，不能全怪我。可心里有个声音说，我本来可以去主日学校。去了那里，他们会教我，像我这样帮助一个黑奴的人，死后要永远受火烧。
        - id: ch01-b27
          speaker: huck
          text: 我打起寒战，差不多下定决心，要跪下来祷告，试着不再做从前那个坏孩子，从今往后变好。可膝盖跪下去了，我却一句话也说不出来。为什么说不出呢？原因其实很清楚，瞒不过上帝，也瞒不过我自己。我的心不正，我也不诚实。我嘴上装作要放弃罪恶，心底却死死抓着最大的一桩罪不肯松手。我想让嘴巴答应去做正确清白的事，写信告诉吉姆的主人他在哪里，可心里知道自己根本不是这样想的。那是假话，上帝也知道。谎话是不能拿来祷告的。这件事，我终于懂了。
        - id: ch01-b28
          speaker: huck
          text: 我心里的烦恼已经多得再也装不下，又完全不知道怎么办。最后，我忽然想出一个办法。先把信写好，然后再试着祷告。真是奇怪，这个念头才冒出来，我立刻觉得自己轻得像根羽毛，所有烦恼一下子都消失了。我又高兴又激动，赶紧找来一张纸和一支铅笔，坐下写信。
        - id: ch01-b29
          speaker: huck
          text: 华生小姐，您逃走的黑奴吉姆如今在派克斯维尔下边两英里。费尔普斯先生抓住了他。您若派人来，他会拿赏金把人交出来。哈克·费恩。
        - id: ch01-b30
          speaker: huck
          text: 有生以来，我头一回觉得自己成了好人，身上的罪也洗得干干净净。我知道现在能祷告，可没有马上开口。我把信放下，坐在那里慢慢想。幸亏事情这样发生，我才没有彻底迷失正道、落进地狱，可刚才离那一步又是多么近。我一直想下去，心思渐渐回到了我们顺流而下的整段旅程。
        - id: ch01-b31
          speaker: huck
          text: 吉姆一直出现在眼前。白天和夜里，月光下和风暴中，我们一同漂着，说话、唱歌、欢笑。我想找一件能叫自己对他狠下心的往事，却怎么也找不到。我看见他替我多值一班，不忍叫醒我。我看见自己从浓雾里回来时，他高兴成什么样。又看见械斗之后，我们在沼泽里重逢。他总叫我宝贝，疼我，凡是想得到的事都替我做。他一直待我那么好。
        - id: ch01-b32
          speaker: huck
          text: 最后我想起，那回我骗追来的人，说木筏上有天花，救了吉姆。他感激得不得了，说我是老吉姆在世上最好的朋友，也是他如今唯一的朋友。这时，我转眼看见了那封信。
        - id: ch01-b33
          speaker: huck
          text: 事情到了最要紧的关头。我拿起信，攥在手里，浑身发抖。我知道，两条路之间必须作出一辈子的选择。我屏住气想了一会儿，终于对自己说出了决定。
        - id: ch01-b34
          speaker: huck
          text: 好吧，那我就下地狱。
        - id: ch01-b35
          speaker: huck
          text: 说完，我把信撕了。
        - id: ch01-b36
          speaker: huck
          text: 那个念头可怕，那句话也可怕，可既然已经说出口，我就让它算数，再不想改过自新。我把整件事赶出脑袋，决定重新做坏事。反正从小被教的就是这个，坏事才合我的路数，好事不合。头一件，我要立刻动手，把吉姆从奴役里再偷出来。如果还能想出比这更坏的事，我也一并照做。既然已经陷进来，而且打定主意永远不回头，那就索性干到底。
        - id: ch01-b37
          speaker: huck
          text: 我把许多营救办法在脑子里翻来覆去，终于定下一条合意的计策。下游不远有座长满树的小岛。天黑以后，我驾木筏过去，把它藏好，在岛上睡了一夜。天亮前，我吃过早饭，换上铺子里买的衣服，又把几件衣物和零碎扎成包袱，划着独木舟去岸边。
        - id: ch01-b38
          speaker: huck
          text: 我在估摸是费尔普斯家的下方上岸，把包袱藏进树林。接着往独木舟里灌满水，再装上一块又一块石头，让它沉下去。我特意挑了一个日后找得到的地方，免得需要时再也寻不着船。那里离岸边的一座小蒸汽锯木厂大约四分之一英里。
        - id: ch01-b39
          speaker: huck
          text: 我走上大路，经过锯木厂时看见牌子上写着“费尔普斯锯木厂”。再往前两三百码就是几座农舍。天已经大亮，我睁大眼睛一路留意，四周却看不见一个人，这正合我意。我还不想跟谁碰面，只想先把周围的地形摸清。照自己的计划，我得装作从村里那一头过来，绝不能让人看出我是从下游上岸的。该看的都看过以后，我便继续赶路，径直走向村子。
        - id: ch01-b40
          speaker: huck
          text: 进村碰见的第一个人偏偏是公爵。他正在张贴《天下无双》的告示，还要连演三个晚上。两个骗子的脸皮可真厚。我没来得及躲，已经走到他面前。他先吃了一惊，接着竟露出又急切又高兴的样子。
        - id: ch01-b41
          speaker: duke
          text: 你从哪儿冒出来的？木筏呢？藏到稳妥地方没有？
          emotion: surprised
        - id: ch01-b42
          speaker: huck
          text: 咦，殿下，我正要拿这话问您呢。
        - id: ch01-b43
          speaker: huck
          text: 他脸上的喜色一下子没了。
        - id: ch01-b44
          speaker: duke
          text: 你凭什么觉得我知道？
        - id: ch01-b45
          speaker: huck
          text: 昨天我看见国王醉倒在小酒馆，知道几个钟头内弄不回去，就在村里闲逛着等。有人答应给我十分钱，请我划船过河，帮忙运回一只羊。我们把羊拖向小船时，那人到后面去推，叫我抓住绳子。羊力气太大，猛地挣脱跑了。我们又没带狗，只好追遍四乡，直到它跑不动。
        - id: ch01-b46
          speaker: huck
          text: 天黑以后我们才捉住羊，把它运过河。我回到河边，木筏却没了。我以为你们出了麻烦，只能带着吉姆离开。这样一来，我在陌生地方什么财产也没有，连活命的办法也没了。我坐下来哭了一场，整夜睡在林子里。所以木筏到底怎么了？可怜的吉姆又去了哪里？
        - id: ch01-b47
          speaker: duke
          text: 我哪知道木筏去了哪里。那个老糊涂做了笔买卖，拿到四十块。酒馆里的闲汉又跟他猜硬币，把他买酒剩下的钱赢得一个子儿不剩。昨夜我很迟才把他弄回去，一看木筏没了，我们便认定是你这小无赖偷走木筏，甩掉我们，顺河跑了。
        - id: ch01-b48
          speaker: huck
          text: 可我怎么会甩掉我的黑奴？他是我唯一的黑奴，也是我唯一的财产。
        - id: ch01-b49
          speaker: duke
          text: 这一层我们倒没想到。说实话，我们已经把他当成自己的黑奴了。为了他，我们吃的苦可不少。木筏没了，钱也没了，除了再演一回《天下无双》，还能怎么办？我一直忙到现在，喉咙干得像火药筒。那十分钱呢？快拿来。
        - id: ch01-b50
          speaker: huck
          text: 我身上其实有不少钱，却只递给他十分钱。我求他买点食物，也分我一点，说这是自己全部的钱，从昨天起还没吃过东西。他不回答，转眼却猛地转过身来。
        - id: ch01-b51
          speaker: duke
          text: 你说那个黑奴会不会把我们的事抖出去？他要敢说，我们就剥了他的皮！
          emotion: angry
        - id: ch01-b52
          speaker: huck
          text: 他怎么说出去？他不是逃走了吗？
        - id: ch01-b53
          speaker: duke
          text: 没有！那个老糊涂把他卖了，钱也不分给我，现在更是一分不剩！
          emotion: angry
        - id: ch01-b54
          speaker: huck
          text: 卖了？可吉姆是我的黑奴，那钱也该归我！他在哪里？我要把他找回来。
          emotion: sad
        - id: ch01-b55
          speaker: duke
          text: 你反正要不回他，别再哭了。听着，你敢不敢告发我们？我看你这小子未必靠得住。你要是真敢开口告发……
        - id: ch01-b56
          speaker: huck
          text: 他没把话说完，可那双眼睛凶恶得吓人。我从没见过公爵这样看人，只好继续呜呜地哭。
        - id: ch01-b57
          speaker: huck
          text: 我不想告发谁，也没工夫去告发。我得马上动身找我的黑奴。
        - id: ch01-b58
          speaker: huck
          text: 公爵皱紧眉头，站在那里犯难，臂弯里的告示被风吹得簌簌响。他想了好一阵，才终于开口。
        - id: ch01-b59
          speaker: duke
          text: 这样吧。我们得在这里待三天。你答应不告发我们，也不让那个黑奴告发，我就告诉你去哪里找他。
        - id: ch01-b60
          speaker: huck
          text: 我答应了。他刚说出一个农场主名叫赛拉斯·费，就突然住口。我听得出，他原本差点说了实话。可他又想了想，还是不肯信我。他要把我支得远远的，确保这三天里我回不来。
        - id: ch01-b61
          speaker: duke
          text: 买下他的人叫亚伯拉罕·福斯特，全名亚伯拉罕·G·福斯特。他住在四十英里外的乡下，就在去拉斐特的路上。
        - id: ch01-b62
          speaker: huck
          text: 好，三天足够我走到。我今天下午就出发。
        - id: ch01-b63
          speaker: duke
          text: 不行，你现在就走。别耽搁，路上也不许跟人多嘴。闭紧嘴巴，只管赶路，这样才不会惹上我们。听清楚没有？
        - id: ch01-b64
          speaker: huck
          text: 这正是我想从他嘴里套出的命令。我需要他放我自由，好去实行自己的计划。
        - id: ch01-b65
          speaker: duke
          text: 快滚。见到福斯特先生以后，你爱说什么就说什么。也许你能让他相信吉姆真是你的黑奴。有些蠢货连证明文件也不看，至少我听说南方有这种人。你再说告示和赏金都是假的，把我们为什么弄出那些东西讲给他听，也许他会信。现在快走。到了那里随你说，可一路上别乱动嘴。
        - id: ch01-b66
          speaker: huck
          text: 我照他的话朝内地走去，没有回头，却总觉得公爵站在背后盯着我。我一直笔直走出约莫一英里，料想他总该看累了，这才停下来，钻进林子，绕路折回费尔普斯家。我不愿再闲晃磨蹭，最好立刻照计划动手。我得赶在那两个骗子脱身以前先找到吉姆，叫他闭紧嘴巴，免得又同他们惹出麻烦。他们这种人的所作所为，我已经见识得够多，只想从此彻底摆脱他们。
