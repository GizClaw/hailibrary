  chapters:
    - id: ch01
      title: CHAPTER XXXI.
      blocks:
        - id: ch01-b01
          speaker: huck
          text: For days and days, we did not dare stop at any town. We just kept floating south along the river. The weather was warm now, and home was a mighty long way behind us. Soon we came to trees with Spanish moss hanging from every limb like long gray beards. I had never seen it growing before. It made the woods look solemn and gloomy. By then the frauds figured they had traveled far enough to be out of danger, so they started working the villages again.
        - id: ch01-b02
          speaker: huck
          text: First they gave a lecture about giving up drink, but it did not earn enough money for both of them to get drunk. In the next village they opened a dancing school. They knew about as much dancing as a kangaroo. The moment they began prancing, the public jumped in and pranced them straight out of town. Somewhere else they tried teaching elocution. They did not keep that up for long before the audience rose, gave them a solid cursing, and made them run. After that came missionary work, mesmerism, doctoring, fortune-telling, and a little of everything. Nothing brought them any luck. At last they were almost dead broke. They lay around the raft for half a day at a time, thinking and thinking without a word, blue and desperate.
        - id: ch01-b03
          speaker: huck
          text: Then they changed their ways. They would put their heads together inside the wigwam and whisper for two or three hours at a time. Jim and I got uneasy. We did not like the look of it. It seemed as if they were planning worse deviltry than ever. We talked it over again and again. Maybe they meant to break into a house or a store. Maybe they planned to start making counterfeit money. Whatever it was, it scared us. We agreed we would take no part in anything like that. At the first chance, we would give them the cold shake, clear out, and leave them behind.
        - id: ch01-b04
          speaker: huck
          text: Early one morning, we hid the raft in a safe place about two miles below a shabby little village called Pikesville. The king went ashore. He ordered the rest of us to stay hidden while he sniffed around town to learn whether anyone there had heard of the Royal Nonesuch. I knew what he really meant. He was looking for a house to rob. Once he finished robbing it, he could come back to the river and wonder where Jim, the raft, and I had gone. He would just have to keep wondering. Before he left, the king said that if he was not back by noon, the duke and I should take that as a sign that everything was safe and come after him.
        - id: ch01-b05
          speaker: huck
          text: We waited. The duke paced around sweating, sour as could be. He scolded Jim and me over every little thing, and nothing we did suited him. Something was surely brewing. When noon came without the king, I was glad. At least there would be a change, and maybe I would get my chance to make a change of my own.
        - id: ch01-b06
          speaker: huck
          text: The duke and I went looking through the village. We finally found the king in the back room of a low drinking place. He was dead drunk. A pack of loafers were tormenting him for fun while he cursed and threatened them with all his strength. But he was too drunk to walk and could not do a thing to them. The duke started abusing him for an old fool. The king turned on the duke and gave back as good as he got. The instant they were properly tangled in their quarrel, I lit out. I shook my legs loose and flew down the river road like a deer. I had seen our chance, and I meant to make it a long, long time before either fraud saw Jim or me again.
        - id: ch01-b07
          speaker: huck
          text: I reached the raft breathless and bursting with joy.
        - id: ch01-b08
          speaker: huck
          text: Let her go, Jim! We are free of them now!
          emotion: happy
        - id: ch01-b09
          speaker: huck
          text: No one answered. Nobody came out of the wigwam. Jim was gone. I shouted once, then again, then a third time. I ran every way through the woods, calling and hollering. It did no good. Old Jim was gone. I sat down and cried because I could not help it. But I could not sit still for long.
        - id: ch01-b10
          speaker: huck
          text: I went out to the road, trying to decide what to do. A boy came walking along. I asked if he had seen a strange Black man dressed the way Jim was dressed.
        - id: ch01-b11
          speaker: boy
          text: Yes, I have.
        - id: ch01-b12
          speaker: huck
          text: Where did you see him?
        - id: ch01-b13
          speaker: boy
          text: He is down at Silas Phelps's place, two miles below here. He is a runaway, and they caught him. Were you looking for him?
        - id: ch01-b14
          speaker: huck
          text: Not me! I met him in the woods an hour or two ago. He said he would cut my insides out if I hollered. He made me lie down and stay there, so I did. I have been too scared to come out until now.
          emotion: fearful
        - id: ch01-b15
          speaker: boy
          text: You do not have to be scared anymore. They have him. He ran away from somewhere down South.
        - id: ch01-b16
          speaker: huck
          text: Good. I am glad they caught him.
        - id: ch01-b17
          speaker: boy
          text: You bet! There is a two-hundred-dollar reward for him. That is like finding money right in the road.
        - id: ch01-b18
          speaker: huck
          text: And I might have had it if I were bigger. I saw him first. Who caught him?
        - id: ch01-b19
          speaker: boy
          text: Some old stranger did. He had to go upriver and could not wait, so he sold his claim to the reward for forty dollars. Imagine that! I would wait seven years for two hundred dollars.
        - id: ch01-b20
          speaker: huck
          text: So would I. But maybe his claim is only worth forty dollars. If he sold it that cheap, perhaps something is wrong with it.
        - id: ch01-b21
          speaker: boy
          text: Nothing is wrong with it. I saw the handbill myself. It describes the man exactly and names the plantation below New Orleans where he came from. That reward is certain. Say, can you spare me a chew of tobacco?
        - id: ch01-b22
          speaker: huck
          text: I had no tobacco to give him, so the boy went on his way. I returned to the raft and sat inside the wigwam to think. I could not come to any answer. I thought until my head felt sore, but I could not see one way out of the trouble. After our long journey, and after all Jim and I had done for those scoundrels, everything had come to nothing. The whole thing was broken up and ruined because they had the heart to play such a trick on Jim. For forty dirty dollars, they had sold him back into slavery among strangers for the rest of his life.
        - id: ch01-b23
          speaker: huck
          text: At one point I told myself that if Jim had to be enslaved, he would be a thousand times better off back home near his family. Maybe I ought to write Tom Sawyer and have him tell Miss Watson where Jim was. But I soon gave up that idea for two reasons. Miss Watson would be angry and disgusted because Jim had run away from her. She would call him wicked and ungrateful, then sell him straight down the river again. Even if she did not sell him, everybody naturally despised an enslaved man they thought was ungrateful. They would make sure Jim felt their contempt every day. He would end up feeling mean and disgraced himself.
        - id: ch01-b24
          speaker: huck
          text: Then there was me. Everybody back home would hear that Huck Finn had helped an enslaved man get his freedom. If I ever saw anyone from that town again, I would feel so ashamed I could have crawled down and licked his boots. That is how it goes. A person does what people call a low-down thing, then wants none of the consequences. He tells himself that if he can hide what he did, there is no disgrace in it. That was exactly my fix. I wanted Jim free, but I could hardly bear the thought of anybody knowing I had helped him.
        - id: ch01-b25
          speaker: huck
          text: The longer I studied on it, the harder my conscience ground at me. I felt more wicked, low, and mean every minute. Then the truth seemed to hit me all at once. This was the plain hand of Providence slapping me in the face. Heaven had watched the whole time while I helped steal an enslaved man from a poor old woman who had never done me any harm. Now God was showing me that someone above was always watching and would only let such miserable doings go so far. The thought scared me so badly I nearly dropped where I stood.
        - id: ch01-b26
          speaker: huck
          text: I tried to excuse myself. I had been raised wicked, I thought, so maybe it was not all my fault. But something inside me answered that I could have gone to Sunday school. They would have taught me that boys who acted the way I had acted about Jim would burn forever.
        - id: ch01-b27
          speaker: huck
          text: I shivered. I decided to pray and see if I could quit being that kind of boy and become better. I knelt down, but no words came. Why would they not come? I knew the answer. There was no use trying to hide it from God or from myself. My heart was not right. I was not being honest. I was pretending to give up sin while deep inside I held on to the biggest sin of all. My mouth wanted to promise I would do the clean and proper thing by writing Jim's owner and telling her where he was. But I knew I did not mean it, and God knew too. You cannot pray a lie. That was what I found out.
        - id: ch01-b28
          speaker: huck
          text: I was as troubled as a person could be. At last I thought of something. I would write the letter first, then try praying again. The moment I decided that, I felt light as a feather. All my trouble seemed gone. Glad and excited, I found paper and a pencil and sat down to write.
        - id: ch01-b29
          speaker: huck
          text: Miss Watson, Jim ran away from you, and now he is two miles below Pikesville. Mr. Phelps has him and will hand him over for the reward if you send for him. Huck Finn.
        - id: ch01-b30
          speaker: huck
          text: For the first time in my life, I felt good and washed clean of sin. I knew I could pray now. But I did not pray right away. I laid the letter down and sat there thinking. I thought how fortunate it was that everything had happened this way. I thought how close I had come to being lost and going to hell. Still I kept thinking, and before long my mind went back over our whole journey down the river.
        - id: ch01-b31
          speaker: huck
          text: I saw Jim before me all the time. I saw him in daylight and darkness, under the moon and in storms. We were floating together again, talking, singing, and laughing. I tried to find memories that would harden me against him, but every memory did the opposite. I saw him stand my watch after he had already stood his own, instead of waking me, so I could keep sleeping. I remembered how glad he was when I came back through the fog. I remembered finding him again in the swamp after the feud. At times like those, he always called me honey. He petted me and did every kind thing he could think of for me. All I could remember was how good he had always been.
        - id: ch01-b32
          speaker: huck
          text: At last I remembered saving him by telling those men there was smallpox on our raft. Jim had been so grateful. He said I was the best friend old Jim ever had in the world, and the only friend he had then. That was when I looked over and saw the letter.
        - id: ch01-b33
          speaker: huck
          text: I had reached a tight place. I picked up the letter and held it. I was trembling because I knew I had to choose between two things forever. For a minute I sat there holding my breath. Then I made my choice.
        - id: ch01-b34
          speaker: huck
          text: All right, then, I will go to hell.
        - id: ch01-b35
          speaker: huck
          text: And I tore the letter to pieces.
        - id: ch01-b36
          speaker: huck
          text: Those were awful thoughts and awful words, but I had said them, and I let them stay said. I never thought about reforming again. I pushed the whole business out of my mind. I would take up wickedness once more, since that was what I had been raised for and goodness was not. To begin, I would go to work and steal Jim out of slavery again. If I could think of anything even worse, I would do that too. Once I was in, and in for good, I might as well go the whole hog.
        - id: ch01-b37
          speaker: huck
          text: I sat down to work out how to reach Jim. I turned one plan after another over in my mind until at last I found one that suited me. Downriver stood a wooded island. I took its bearings, waited until it was properly dark, then crept away on the raft. I carried it to the island, hid it there, and turned in. I slept through the night. Before daylight I got up and ate breakfast. I put on my store clothes, tied another set of clothes and a few other things into a bundle, and paddled the canoe toward shore.
        - id: ch01-b38
          speaker: huck
          text: I landed below the place I believed belonged to Phelps and hid my bundle in the woods. Then I filled the canoe with water and loaded it with rocks until it sank. I chose the spot carefully so I could find the canoe again whenever I needed it. It lay about a quarter mile below a little steam-powered sawmill on the riverbank.
        - id: ch01-b39
          speaker: huck
          text: I followed the road. When I passed the mill, I saw a sign that said Phelps's Sawmill. Two or three hundred yards farther on, I reached the farmhouses. I kept my eyes open, but nobody was around even though it was full daylight. That suited me. I did not want to meet anyone yet because I only meant to study the place and learn the lay of the land. My plan called for me to arrive there from the village, not from downriver. Once I had seen enough, I kept moving straight toward town.
        - id: ch01-b40
          speaker: huck
          text: The very first man I saw there was the duke. He was putting up a poster for another three-night run of the Royal Nonesuch. Those frauds had plenty of nerve. I was almost on top of him before I could dodge away. He stared at me in surprise. Then he looked eager and almost glad.
        - id: ch01-b41
          speaker: duke
          text: Well, hello! Where did you come from? Where is the raft? Did you hide it somewhere safe?
          emotion: surprised
        - id: ch01-b42
          speaker: huck
          text: Why, Your Grace, I was just about to ask you the same thing.
        - id: ch01-b43
          speaker: huck
          text: The glad look left his face.
        - id: ch01-b44
          speaker: duke
          text: Why would you think I knew where it was?
        - id: ch01-b45
          speaker: huck
          text: When I saw the king in that drinking place yesterday, I knew we could not take him home until he sobered up. So I wandered around town to pass the time. A man offered me ten cents to help row across the river and bring back a sheep. When we tried to pull the sheep to the boat, the man went behind to push and left me holding the rope. The sheep jerked free and ran. We had no dog, so we chased it all over the country until it tired out.
        - id: ch01-b46
          speaker: huck
          text: We did not catch the sheep until dark. After we got it across the river, I headed for the raft. It was gone. I thought you must have gotten into trouble and left with Jim. Then there I was in a strange place with no property, no way to earn a living, and not even Jim. I sat down and cried, and I slept in the woods all night. So what happened to the raft? And where is poor Jim?
        - id: ch01-b47
          speaker: duke
          text: I do not know what happened to the raft. That old fool made a deal for forty dollars. Then those loafers at the drinking place matched coins with him and won every cent he had not spent on whiskey. I brought him back late last night and found the raft missing. We figured you little rascal had stolen it, left us behind, and run downriver.
        - id: ch01-b48
          speaker: huck
          text: But I would not leave Jim. He was the only enslaved man I owned and the only property I had.
        - id: ch01-b49
          speaker: duke
          text: We never thought of that. I suppose we had started thinking Jim belonged to us. We certainly had enough trouble because of him. When the raft was gone and we were broke, our only choice was to try the Royal Nonesuch once more. I have been working ever since, and my throat is dry as a powder horn. Where is that ten cents? Hand it over.
        - id: ch01-b50
          speaker: huck
          text: I had plenty of money, but I gave him one dime. I begged him to buy food and share it with me. I said it was all I had, and I had eaten nothing since the day before. He did not answer. A moment later, he spun toward me.
        - id: ch01-b51
          speaker: duke
          text: Do you think Jim would tell anyone about us? We would skin him if he did!
          emotion: angry
        - id: ch01-b52
          speaker: huck
          text: How could he tell? Did he not run away?
        - id: ch01-b53
          speaker: duke
          text: No! That old fool sold him, kept my share of the money, and then lost it all.
          emotion: angry
        - id: ch01-b54
          speaker: huck
          text: Sold him? But Jim was mine, so that money was mine too! Where is he? I want him back.
          emotion: sad
        - id: ch01-b55
          speaker: duke
          text: You cannot get him back, so stop that crying. Tell me something. Would you dare expose us? I am not sure I can trust you. You had better not say one word about us.
        - id: ch01-b56
          speaker: huck
          text: He stopped there, but I had never seen such an ugly look in the duke's eyes. I kept whimpering.
        - id: ch01-b57
          speaker: huck
          text: I do not want to tell on anybody, and I have no time for it anyway. I have to go find Jim.
        - id: ch01-b58
          speaker: huck
          text: The duke looked bothered. He stood there thinking, his forehead all wrinkled up and the posters fluttering over his arm. For a while he could not decide what to do with me. At last he spoke.
        - id: ch01-b59
          speaker: duke
          text: Here is the deal. We have to stay in this town for three days. Promise you will keep quiet and make Jim keep quiet, and I will tell you where he is.
        - id: ch01-b60
          speaker: huck
          text: I promised.
        - id: ch01-b61
          speaker: duke
          text: The farmer's name starts with Silas Ph...
        - id: ch01-b62
          speaker: huck
          text: He stopped. He had started to tell the truth, but now I could see him thinking it over. He did not trust me. He wanted me safely out of the way for all three days, so he changed his story.
        - id: ch01-b63
          speaker: duke
          text: The buyer is Abram G. Foster. He lives forty miles into the country, on the road to Lafayette.
        - id: ch01-b64
          speaker: huck
          text: All right. I can walk there in three days. I will leave this afternoon.
        - id: ch01-b65
          speaker: duke
          text: No, you leave now. Do not waste time, and do not chatter to anyone along the way. Keep your mouth shut and keep moving if you want to stay out of trouble with us. Do you understand?
        - id: ch01-b66
          speaker: huck
          text: That was exactly the order I had hoped for. I wanted him to leave me free to carry out my plan.
        - id: ch01-b67
          speaker: duke
          text: Now clear out. Tell Mr. Foster anything you like. Maybe you can convince him that Jim belongs to you. Some fools do not ask for papers, or so I have heard down here. Tell him the handbill and reward are false, and explain why we made them. He may believe that too. Just go, and do not work your jaw between here and there.
        - id: ch01-b68
          speaker: huck
          text: I left and headed into the back country. I did not look around, though I could feel him watching me. I knew he would tire of it. I walked straight on for about a mile. Then I doubled back through the woods toward Phelps's place.
        - id: ch01-b69
          speaker: huck
          text: I meant to start my plan right away. First I had to keep Jim quiet until the frauds left town. I wanted no more trouble with their kind. I had seen all I ever wanted to see of them, and now I meant to be rid of them for good.
