audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 一本正经，带着不动声色的讽刺
        timbre: 清晰沉稳
        pace: 从容有力
        pitch: 中低
    huck:
      display_name: 哈克贝利·费恩
      tts:
        delivery: 坦率机灵，带着乡野少年的随便劲儿
        timbre: 年少而略带粗粝
        pace: 自然健谈
        pitch: 中
    judge_thatcher:
      display_name: 撒切尔法官
      tts:
        delivery: 稳重有礼，思路缜密
        timbre: 成熟浑厚
        pace: 适中
        pitch: 中低
    pap:
      display_name: 爸爸
      tts:
        delivery: 粗暴多疑，醉意里带着蛮横和自怜
        timbre: 沙哑粗粝
        pace: 忽快忽慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: huck
          text: 我把门关严，一回头，爸爸就坐在那里。以前我总怕他，因为他动不动就把我揍得够呛。这回刚看见他，我也猛地一惊，连气都噎住了。可那只是因为他来得太突然。缓过来以后，我才发现，自己其实已经不怎么怕他了。
        - id: ch01-b02
          speaker: huck
          text: 他快五十岁了，看着一点也不年轻。头发又长又乱，油腻腻地垂下来。那双眼睛隔着头发闪着光，像藏在藤蔓后面。头发通黑，一根灰的也没有。长胡子也是黑的，乱糟糟地搅在一起。他脸上露出来的地方惨白惨白，不是普通的白，而是让人恶心、让人浑身发毛的白，像树蛙一样白，也像鱼肚子一样白。
        - id: ch01-b03
          speaker: huck
          text: 他浑身上下只有几片破布。一只脚踝搭在另一条腿的膝盖上，脚上的靴子裂开了，两根脚趾从破口伸出来，还时不时动几下。地板上扔着他的黑色旧软帽，帽顶整个塌下去，活像一个盖子。
        - id: ch01-b04
          speaker: huck
          text: 我站着看他，他坐着看我，椅子还微微往后仰。我放下蜡烛，看见窗户开着，这才知道他是踩着棚顶爬进来的。他把我从头到脚瞧了半天，终于开口。
        - id: ch01-b05
          speaker: pap
          text: 衣裳浆得可真挺括。你觉得自己成了个了不得的大人物，是不是？
        - id: ch01-b06
          speaker: huck
          text: 也许是，也许不是。
        - id: ch01-b07
          speaker: pap
          text: 少跟我顶嘴。我不在这些日子，你倒摆起好大的派头了。等我收拾完你，非压下你这股神气不可。听说你还念了书，会读会写。你老子不会，你就觉得自己比老子强，是不是？看我不把你这毛病打掉！是谁准你碰这种装模作样的蠢玩意儿？说，是谁？
          emotion: angry
        - id: ch01-b08
          speaker: huck
          text: 寡妇。是她叫我学的。
        - id: ch01-b09
          speaker: pap
          text: 寡妇，是吗？谁准她把手伸进来，管这份不该管的闲事？
        - id: ch01-b10
          speaker: huck
          text: 没人准过她。
        - id: ch01-b11
          speaker: pap
          text: 好，我会教她以后少管闲事。你也听清楚，不许再上学了。我要让那些人明白，不能教一个孩子在亲老子面前摆架子，装得比老子还高明。再让我逮到你往学堂那边去，我非收拾你不可！
          emotion: angry
        - id: ch01-b12
          speaker: pap
          text: 你娘活着的时候不会读，也不会写。咱们家死了的那些人，没有一个会。我也不会，你倒把自己吹得鼓鼓囊囊。我可不吃这一套。来，念几句给我听。
        - id: ch01-b13
          speaker: huck
          text: 我拿起一本书，念起华盛顿将军打仗的故事。才念了半分钟，他一巴掌拍过来，把书打得飞过了屋子。
        - id: ch01-b14
          speaker: pap
          text: 还真会念。我刚才还不信呢。现在听好，不许再摆这种臭架子。我受不了这个。你给我当心点儿，小聪明鬼。让我发现你又去了学堂，我就狠狠抽你一顿。再这么下去，你没准连教都要信上了。我从没见过你这样的儿子。
        - id: ch01-b15
          speaker: huck
          text: 他又拿起一张蓝黄两色的小画片，上面有几头牛和一个男孩。
        - id: ch01-b16
          speaker: pap
          text: 这是什么？
        - id: ch01-b17
          speaker: huck
          text: 功课学得好，他们奖给我的。
        - id: ch01-b18
          speaker: huck
          text: 他一把撕碎了画片。
        - id: ch01-b19
          speaker: pap
          text: 我给你个更好的奖励。我奖你一顿牛皮鞭。
        - id: ch01-b20
          speaker: huck
          text: 他坐在那里嘟囔咆哮了一阵，很快又找到了新的由头。
        - id: ch01-b21
          speaker: pap
          text: 你可真是个香喷喷的阔少爷。床、铺盖、镜子都有，地板上还铺着地毯，你亲老子却得跟猪一起睡在制革场。我从没见过你这样的儿子。等我收拾完你，非打掉你一些臭派头不可。听说你发财了，是不是？怎么回事？
        - id: ch01-b22
          speaker: huck
          text: 他们撒谎，就这么回事。
        - id: ch01-b23
          speaker: pap
          text: 跟我说话小心点儿。我已经忍到头了，别再跟我耍横。我来镇上两天，听到的全是你发财的事。连河下游都在传，我早就听见了。正因为这个，我才回来。明天把钱给我弄来，我要用。
          emotion: angry
        - id: ch01-b24
          speaker: huck
          text: 我没有钱。
        - id: ch01-b25
          speaker: pap
          text: 撒谎！钱在撒切尔法官手里。你去拿，我要那笔钱。
          emotion: angry
        - id: ch01-b26
          speaker: huck
          text: 我告诉你，我没有。你去问撒切尔法官，他也会这么说。
        - id: ch01-b27
          speaker: pap
          text: 行，我会问他。我还会叫他老老实实把钱掏出来，不给的话，我非得问出个道理。你口袋里有多少？给我。
        - id: ch01-b28
          speaker: huck
          text: 只有一块钱，可我还要拿它去……
        - id: ch01-b29
          speaker: pap
          text: 你要拿它干什么不关我的事。掏出来。
        - id: ch01-b30
          speaker: huck
          text: 他拿走那一块钱，用牙咬了咬，看是不是真的。然后他说要进城买威士忌，因为这一天还没喝上一口。他爬到棚顶以后，又把头探进来，骂我摆臭架子，想装得比他强。
        - id: ch01-b31
          speaker: huck
          text: 我以为他已经走了，谁知他又折回来，把脑袋重新伸进窗户。他再次警告我，不许去学堂。我要是不退学，他就会守在那里逮住我，再把我狠狠揍一顿。
        - id: ch01-b32
          speaker: huck
          text: 第二天，他喝得醉醺醺的，跑到撒切尔法官那里蛮横地纠缠，非要法官交出那笔钱。法官没有给，他便发誓要借法律逼法官拿钱，非叫他交出来不可。
        - id: ch01-b33
          speaker: huck
          text: 撒切尔法官和寡妇打起官司，想请法院把我从爸爸手里带走，再由他们中的一个做我的监护人。可是新法官刚来，不了解爸爸。他说，只要还有别的办法，法院就不该拆散一家人。他不愿意把孩子从亲生父亲身边夺走。撒切尔法官和寡妇只好作罢。
        - id: ch01-b34
          speaker: huck
          text: 爸爸高兴得坐也坐不住。他威胁我，要是不给他弄钱，就用牛皮鞭把我抽得青一块紫一块。我只好向撒切尔法官借了三块钱。爸爸拿了钱，喝得烂醉，接着就在镇上到处吹牛、咒骂、吼叫、撒野，还一路敲着白铁皮锅，闹到快半夜。
        - id: ch01-b35
          speaker: huck
          text: 后来人们把他关进牢里。第二天，他被押上法庭，又判了一个星期。可他满意得很，还说自己就是儿子的主人，儿子归他管，他一定会叫我吃足苦头。
        - id: ch01-b36
          speaker: huck
          text: 爸爸出狱以后，新法官说要把他改造成一个真正的人。法官把他领回家，替他换上干净体面的衣服，还让他跟全家一起吃三顿饭，待他亲热得不得了。
        - id: ch01-b37
          speaker: huck
          text: 晚饭后，法官跟他谈戒酒的道理，直说得爸爸哭起来。爸爸承认自己从前是个糊涂虫，白白糟蹋了一辈子。可从现在起，他要翻开新的一页，做一个谁都不会替他害臊的人。他还盼着法官帮他一把，不要瞧不起他。
        - id: ch01-b38
          speaker: huck
          text: 法官说，听到这些话，他真想抱抱爸爸。说着，法官哭了，法官太太也哭了。爸爸说，他一直是个被人误解的人，法官说他相信。爸爸又说，一个落魄的人最需要同情，法官说一点不错。于是他们又一起哭起来。
        - id: ch01-b39
          speaker: huck
          text: 到了睡觉的时候，爸爸站起来，向所有人伸出一只手。
        - id: ch01-b40
          speaker: pap
          text: 各位先生，各位太太，都看看这只手。来，握住它，跟它握一握。它从前是猪猡的手，可现在不是了。如今它属于一个刚开始过新生活的人。这个人宁可死，也绝不会走回头路。记住我的话，别忘了是我亲口说的。这只手现在干净了，握吧，别害怕。
          emotion: sad
        - id: ch01-b41
          speaker: huck
          text: 于是大家围过来，一个接一个跟他握手，边握边哭。法官太太还吻了那只手。爸爸随后在戒酒誓约上画了个记号。法官说，这是有史以来最神圣的时刻，或者说了句差不多的话。
        - id: ch01-b42
          speaker: huck
          text: 他们把爸爸安顿进一间漂亮的客房。到了半夜，他渴得厉害，就从窗户爬上门廊屋顶，再顺着柱子滑到地面，用那件新外套换来一罐烈得能放倒人的威士忌。然后他又爬回房里，痛痛快快闹了一场。
        - id: ch01-b43
          speaker: huck
          text: 天快亮时，他再次爬出去，醉得像个拉琴的，一头从门廊上滚下来，左胳膊断了两处。太阳出来以后才有人发现他，那时候他都快冻死了。人们再进客房一看，简直得先测测水深，才知道该怎么在里面行船。
        - id: ch01-b44
          speaker: huck
          text: 新法官心里很不是滋味。他说，要想改造爸爸，拿一杆霰弹枪也许还有点办法。除此以外，他实在想不出别的招了。
