audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: dry and mock-official
        timbre: clear and warm
        pace: measured
        pitch: medium
    huck:
      display_name: Huck Finn
      tts:
        delivery: plainspoken and observant
        timbre: youthful and rough-edged
        pace: easy
        pitch: medium
    pap:
      display_name: Pap Finn
      tts:
        delivery: bitter and bullying
        timbre: coarse and worn
        pace: uneven
        pitch: low
    new_judge:
      display_name: New Judge
      tts:
        delivery: earnest and respectable
        timbre: mature and polished
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Pap at the Window
      blocks:
      - id: ch01-b01
        speaker: huck
        text: I pulled the door shut, turned around, and there he was. Pap. He used to tan me so often that I was scared of him all the time. That first sight of him caught my breath. Then the shock passed, and I knew I wasn't scared enough to worry about anymore.
      - id: ch01-b02
        speaker: huck
        text: He was close to fifty, and every year showed. Long, tangled, greasy black hair hung over his face, with his eyes shining through it like eyes behind vines. His whiskers were just as black and tangled. The skin between them had a sickly white look, like a tree toad or a fish's belly. His clothes were nothing but rags.
      - id: ch01-b03
        speaker: huck
        text: He sat with one ankle across his other knee. That boot had split open, and two toes poked through. Every so often he worked them around. The rest of him stayed planted in the chair. His old black slouch hat lay on the floor with its top caved in like a lid.
      - id: ch01-b04
        speaker: huck
        text: We stared at each other while his chair leaned back. I set down the candle. The window stood open, so he'd climbed in from the shed. He looked me over from head to foot. At last he spoke.
      - id: ch01-b05
        speaker: pap
        text: Well, look at those stiff clothes. You reckon you're somebody important now, don't you?
      - id: ch01-b06
        speaker: huck
        text: Maybe I am, and maybe I ain't.
      - id: ch01-b07
        speaker: pap
        text: Don't you talk back to me. You've picked up plenty of fancy ways since I left, but I'll knock that pride out of you. Folks say you're educated, too. You can read and write, and you think that makes you better than your own father. Who said you could meddle with such high-and-mighty foolishness?
      - id: ch01-b08
        speaker: huck
        text: The widow told me I could.
      - id: ch01-b09
        speaker: pap
        text: The widow, did she? Who gave her leave to stick her nose into business that ain't hers?
      - id: ch01-b10
        speaker: huck
        text: Nobody gave her leave.
      - id: ch01-b11
        speaker: pap
        text: Then I'll teach her not to meddle. And you listen to me. Quit that school. I'll show folks what happens when they teach a boy to act above his own father. If I catch you near that school again, you'll be sorry. Your mother couldn't read or write before she died. Nobody in the family could. I can't, either. But there you sit, puffed up with learning. I won't stand for it. Pick up a book and read. I want to hear it.
        emotion: angry
      - id: ch01-b12
        speaker: huck
        text: I opened a book and began reading about General Washington and the wars. Before half a minute had passed, Pap slapped the book out of my hands and sent it flying across the room.
      - id: ch01-b13
        speaker: pap
        text: So it's true. You really can read. I wasn't sure before. Now quit showing off, because I won't allow it. I'll watch for you, smarty, and if I find you at that school, I'll tan you good. Next thing I know, you'll be getting religion. I never saw such a son.
      - id: ch01-b14
        speaker: huck
        text: He picked up a little blue-and-yellow picture of some cows and a boy.
      - id: ch01-b15
        speaker: pap
        text: What's this thing?
      - id: ch01-b16
        speaker: huck
        text: They gave it to me for doing my lessons well.
      - id: ch01-b17
        speaker: huck
        text: He tore it in pieces.
      - id: ch01-b18
        speaker: pap
        text: I'll give you a better prize. I'll give you the cowhide.
      - id: ch01-b19
        speaker: huck
        text: He sat growling to himself for a minute, then started again.
      - id: ch01-b20
        speaker: pap
        text: Ain't you a fine, sweet-smelling gentleman? You've got a bed and blankets, a looking glass, and even carpet on the floor. Meanwhile, your own father sleeps with the hogs in the tanyard. I'll strip some of those fancy ways off you yet. And now folks say you're rich. Is that true?
      - id: ch01-b21
        speaker: huck
        text: They're lying.
      - id: ch01-b22
        speaker: pap
        text: Mind your tone. I've taken about all the sass I can take. I've been in town two days, and everybody talks about your money. I heard the same thing far downriver. That's why I came. Bring me that money tomorrow. I want it.
      - id: ch01-b23
        speaker: huck
        text: I don't have any money.
      - id: ch01-b24
        speaker: pap
        text: That's a lie. Judge Thatcher has it. Get it from him.
      - id: ch01-b25
        speaker: huck
        text: I told you, I haven't got it. Ask Judge Thatcher, and he'll say the same.
      - id: ch01-b26
        speaker: pap
        text: I'll ask him, all right. He'll hand it over, or I'll find out why he won't. How much is in your pocket? Give me that.
      - id: ch01-b27
        speaker: huck
        text: Only a dollar, and I need it for—
      - id: ch01-b28
        speaker: pap
        text: I don't care what you need. Hand it over.
      - id: ch01-b29
        speaker: huck
        text: He took the dollar and bit it to make sure it was good. Then he said he was going into town for whisky because he hadn't had a drink all day.
      - id: ch01-b30
        speaker: huck
        text: He climbed out onto the shed, but stuck his head back through the window to curse me for acting better than him. I thought he'd finally gone. Then his head came back once more, and he warned me to stay away from school or he'd wait for me and whip me.
    - id: ch02
      title: Pap Claims His Son
      blocks:
      - id: ch02-b01
        speaker: huck
        text: The next day Pap got drunk. He went to Judge Thatcher, bullied him, and tried to make him turn over my money. The judge wouldn't do it, so Pap swore he'd use the law to force him.
      - id: ch02-b02
        speaker: huck
        text: Judge Thatcher and the widow went to court, hoping one of them could become my guardian and take me away from Pap. But the judge was new in town and didn't know what Pap was like.
      - id: ch02-b03
        speaker: new_judge
        text: A court shouldn't split up a family if there's any way around it. I'd rather not take a child from his father.
      - id: ch02-b04
        speaker: huck
        text: The new judge wouldn't interfere, so that ended their attempt. Judge Thatcher and the widow had to give up and leave me with Pap. I had to stay where I was.
      - id: ch02-b05
        speaker: huck
        text: Pap was so pleased he couldn't sit still. He threatened to cowhide me black and blue unless I found him some money. I borrowed three dollars from Judge Thatcher, and Pap took it straight away.
      - id: ch02-b06
        speaker: huck
        text: He got drunk, stormed all over town, cursed, yelled, and banged on a tin pan until nearly midnight. He kept boasting and carrying on until they put him in jail. The next day they brought him before the court, and the court sent him back for a week.
      - id: ch02-b07
        speaker: pap
        text: Suits me fine. I'm still the boss of my son, and I'll make things hot for him.
    - id: ch03
      title: A New Life
      blocks:
      - id: ch03-b01
        speaker: huck
        text: When Pap got out, the new judge decided he would turn him into a proper man. He took Pap home, dressed him in clean, handsome clothes, and seated him with the family for breakfast, dinner, and supper. They treated him like an honored guest.
      - id: ch03-b02
        speaker: huck
        text: After supper, the judge spoke to him about giving up drink and changing his ways. Pap began to cry.
      - id: ch03-b03
        speaker: pap
        text: I've been a fool and thrown my life away. But I'm turning over a new leaf now. I'll become a man nobody has to be ashamed of. Judge, I hope you'll help me instead of looking down on me.
        emotion: sad
      - id: ch03-b04
        speaker: huck
        text: The judge said those words made him want to hug Pap. The judge cried, and then his wife cried, too. Pap told them that people had always misunderstood him before that night.
      - id: ch03-b05
        speaker: new_judge
        text: I believe you. I truly do.
      - id: ch03-b06
        speaker: pap
        text: When a man's fallen low, what he needs is sympathy.
      - id: ch03-b07
        speaker: new_judge
        text: That's exactly right.
      - id: ch03-b08
        speaker: huck
        text: Then they all cried again. At bedtime, Pap stood up and held out his hand.
      - id: ch03-b09
        speaker: pap
        text: Ladies and gentlemen, look at this hand. Take it and shake it. This used to be the hand of a hog, but it ain't one now. It's the hand of a man beginning a new life. He'll die before he goes back. Remember those words. This hand is clean now, so don't be afraid to shake it.
      - id: ch03-b10
        speaker: huck
        text: They went around shaking his hand one after another, and everybody cried. The judge's wife even kissed it. Then Pap signed a promise to stay sober by making his mark.
      - id: ch03-b11
        speaker: new_judge
        text: This may be the holiest moment anyone ever saw.
      - id: ch03-b12
        speaker: huck
        text: Or that was near enough to what the judge said. Afterward they tucked Pap into their beautiful spare room for the night.
    - id: ch04
      title: The Judge's Answer
      blocks:
      - id: ch04-b01
        speaker: huck
        text: Sometime during the night, Pap grew terribly thirsty. He climbed onto the porch roof, slid down a post, and traded his new coat for a jug of powerful whisky. Then he climbed back up and had himself a grand time.
      - id: ch04-b02
        speaker: huck
        text: Near daylight, he crawled outside again, drunk as a fiddler. He rolled off the porch and broke his left arm in two places. When somebody found him after sunrise, he was nearly frozen to death.
      - id: ch04-b03
        speaker: huck
        text: When they went upstairs and looked inside that beautiful spare room, it was such a wreck that you might have needed a sounding line before you could navigate through it.
      - id: ch04-b04
        speaker: huck
        text: The judge felt pretty sore about the whole business.
      - id: ch04-b05
        speaker: new_judge
        text: Maybe a shotgun could reform that old man. I don't know any other way.
