audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    questioner:
      display_name: Questioner
      tts:
        delivery: curious and friendly
        timbre: clear and youthful
        pace: easy
        pitch: medium
    margery_brown:
      display_name: Margery Brown
      tts:
        delivery: thoughtful and attentive
        timbre: light and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Looking Toward London
      blocks:
        - id: ch01-b01
          speaker: questioner
          text: Margery Brown, up there on the hill, why are you just standing still?
        - id: ch01-b02
          speaker: margery_brown
          text: I'm looking toward London town. If I go down, will I see the horsemen?
    - id: ch02
      title: The Bells and the Singing
      blocks:
        - id: ch02-b01
          speaker: questioner
          text: Margery Brown, up there on the hill, why are you standing so still and listening?
        - id: ch02-b02
          speaker: margery_brown
          text: I can hear the bells of London ringing. I can hear the men and maidens singing, too.
    - id: ch03
      title: Waiting on the Hill
      blocks:
        - id: ch03-b01
          speaker: questioner
          text: Margery Brown, up there on the hill, why are you still standing there and waiting?
        - id: ch03-b02
          speaker: margery_brown
          text: There's a knight down there, but I can't go. The bells of London town are ringing strangely.
