audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 含蓄而富有童谣韵律，渐渐透出不安
        timbre: 清澈温润
        pace: 舒缓
        pitch: 中
    questioner:
      display_name: 提问者
      tts:
        delivery: 亲切好奇，问话自然明快
        timbre: 明亮柔和
        pace: 适中
        pitch: 中
    margery_brown:
      display_name: 玛杰丽·布朗
      tts:
        delivery: 天真专注，末尾带着隐约的不安
        timbre: 清脆稚嫩
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 眺望伦敦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛杰丽·布朗站在山顶上，一动不动。
        - id: ch01-b02
          speaker: questioner
          text: 玛杰丽，你怎么闲站在这里呀？
        - id: ch01-b03
          speaker: margery_brown
          text: 我在望着远处的伦敦城。要是我下山去，能看见那些骑马的人吗？
    - id: ch02
      title: 伦敦的钟声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 玛杰丽还是站在山顶，侧耳听着远方。
        - id: ch02-b02
          speaker: questioner
          text: 玛杰丽，你站在那里听什么呢？
        - id: ch02-b03
          speaker: margery_brown
          text: 我听见伦敦的钟声，还听见城里的男人和姑娘们在唱歌。
    - id: ch03
      title: 异样的钟声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玛杰丽留在山顶，迟迟没有离开。
        - id: ch03-b02
          speaker: questioner
          text: 玛杰丽，你还在等什么呀？
        - id: ch03-b03
          speaker: margery_brown
          text: 那里有一位骑士，可我不能下山。伦敦城的钟声听起来很不寻常。
