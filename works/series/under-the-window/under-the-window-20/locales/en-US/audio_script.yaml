  chapters:
    - id: ch01
      title: The Way to Somewhere Town
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Which way to Somewhere Town? Oh, up early in the morning, over the tiles and chimney pots. That's the way, clear as can be.
    - id: ch02
      title: The Door to Somewhere Town
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Which door to Somewhere Town? Oh, up early in the morning, through the round red sun. That's the way, clear as can be.
