audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 去某某镇的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天亮就起来。越过屋瓦，再越过烟囱，去某某镇的路，清清楚楚就在眼前。
    - id: ch02
      title: 哪一扇门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 哪扇门才通往某某镇呢？
    - id: ch03
      title: 红太阳
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 还是趁早起来。穿过那轮圆圆的红太阳，那就是门，路也清清楚楚。
