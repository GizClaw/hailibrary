audio_script:
  language: zh-CN
  cast:
    susan:
      display_name: 小苏珊
      tts:
        delivery: 亲切活泼，带着孩子邀伴出游时的兴致
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    polly:
      display_name: 小波莉
      tts:
        delivery: 天真爽快，回答里带一点机灵和笃定
        timbre: 明净稚嫩
        pace: 轻快自然
        pitch: 中高
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔轻盈的童谣讲述口吻
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: “小波莉，今天去不去散步？”
      blocks:
        - id: ch01-b01
          speaker: susan
          text: 小波莉，今天一起去散步吗？
        - id: ch01-b02
          speaker: polly
          text: 好呀，小苏珊！妈妈准我去，我就去。
        - id: ch01-b03
          speaker: susan
          text: 她已经答应啦。你妈妈真好，肯说“行”，就不该再说“不行”。
        - id: ch01-b04
          speaker: susan
          text: 树顶有个秃鼻乌鸦窝，海那边有艘大船正开过来。你说哪个好，大船还是鸟窝？
        - id: ch01-b05
          speaker: polly
          text: 我喜欢哪个，哪个就是最好的。
