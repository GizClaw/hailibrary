audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    polly:
      display_name: Polly
      tts:
        delivery: bright and playfully thoughtful
        timbre: light and clear
        pace: easy
        pitch: high
    susan:
      display_name: Susan
      tts:
        delivery: friendly and eagerly curious
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Little Polly, Will You Go Walking Today?
      blocks:
        - id: ch01-b01
          speaker: susan
          text: Little Polly, would you like to go for a walk today?
        - id: ch01-b02
          speaker: polly
          text: I sure would, Susan, if I'm allowed.
        - id: ch01-b03
          speaker: susan
          text: You are! Your mother told me you could go. It was nice of her to say yes. I hope she never says no!
        - id: ch01-b04
          speaker: susan
          text: Look! A rook has a nest at the very top of that tree, and a big ship is coming from across the sea. Which would you rather see, the ship or the nest?
        - id: ch01-b05
          speaker: polly
          text: Why, whichever one Polly likes best!
