audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻巧趣味
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 故事开场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家听好，我来讲个故事。故事里有两个女孩、一个小男孩，还有一只猫和一扇绿门。
    - id: ch02
      title: 忽然忘光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 糟糕，我才刚开口，故事就从我这可怜的脑袋里跑光了。我说的可是实话。
    - id: ch03
      title: 只好再见
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 什么也想不起来啦，只好跟大家说再见！
