audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Listen, Everyone
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Now, everyone, listen close. I'll tell you a tale.
    - id: ch02
      title: The Tale
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Two girls, one little boy, a cat, and a green gate.
    - id: ch03
      title: All Forgotten
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Oh, dear! Since I started, the whole true story has slipped out of my poor head. So goodbye to you!
