audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Under My Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: My garden is under the window, where sweet flowers grow. A robin lives in the pear tree. He's the dearest bird I know.
    - id: ch02
      title: Early in the Morning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: I peek out early each morning, but the flowers are up first.
    - id: ch03
      title: Talking to the Robin
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then I try talking to the robin. Maybe he'd chat with me, if he dared.
