audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔而满怀静静的欢喜
        timbre: 清亮稚嫩
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 窗下的花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 窗下有我的小花园，芬芳的花儿在那里开放。梨树上住着一只知更鸟，是我最喜欢的鸟儿。
    - id: ch02
      title: 清早醒来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 清早我探头往外看，花儿却总比我先醒。
    - id: ch03
      title: 和知更鸟说话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我就试着和知更鸟说话。要是它敢，也许会陪我聊几句。
