cover_prompt: |-
  A wordless cover gathering of late-Victorian childhood scenes takes place beneath the open window of an English country house. Four young children in simple 1870s smocks, pinafores, straw hats, stockings, and buttoned shoes tend flowers, roll a hoop, and carry a small basket along the garden path. An older sister leans from the low window to pass a red apple down to the youngest child while a small dog waits below. The hand-to-hand gift of the apple is the focal action, joining home, garden, and play in one quiet moment. Use a child-height view with the cottage wall framing one side, layered flower beds leading outward, and generous pale sky above the roof and trees. Keep faces and clothing original and historically grounded rather than copying any existing illustrations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
