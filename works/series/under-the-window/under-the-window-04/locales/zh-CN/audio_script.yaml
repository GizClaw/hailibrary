audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快俏皮，带着谜语般的逗趣语气
        timbre: 清亮柔和
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 猫儿去喝茶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 三只虎斑猫带猫儿去喝茶，个个规矩得挑不出毛病。
    - id: ch02
      title: 牛奶和呼噜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 每只猫都坐上中意的椅子，喵喵讨奶喝，小口喝着，呼噜作响。
    - id: ch03
      title: 一共有几条命
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这些猫儿你都见了。猜猜，它们共有几条命？
