audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Three Tabbies at Tea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three tabbies took their cats out to tea. They were as well behaved as cats could be.
    - id: ch02
      title: Milk and Purrs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Each chose a favorite chair. They mewed for milk, then sipped and purred.
    - id: ch03
      title: How Many Lives?
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: You've seen these cats. Now tell me, how many lives did they have between them?
