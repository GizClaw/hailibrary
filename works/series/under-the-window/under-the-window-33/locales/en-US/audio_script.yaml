audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: All Three
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            It's sad, and it shocks me. What they're doing is bad, all three of them.
    - id: ch02
      title: Another Warning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            I've warned them before, and I warn them again. The water is cold. The fish will eat them.
    - id: ch03
      title: Still They Row
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Still they row about, though I cry, "Fie!" Fathers may scold them, and mothers may call to them.
