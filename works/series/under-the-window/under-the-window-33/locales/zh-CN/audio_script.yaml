audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻巧趣味
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 三个人都不该
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 他们三个的事，真让我难过又吃惊。是啊，这样做实在不对。
    - id: ch02
      title: 再劝一回
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我早警告过他们，现在还得再说一遍。水这么冷，鱼儿会把他们吃掉。
    - id: ch03
      title: 还在划船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可他们还划着船，来来回回。我喊他们“羞不羞！”爸爸们也许会责骂，妈妈们也许会呼唤。
