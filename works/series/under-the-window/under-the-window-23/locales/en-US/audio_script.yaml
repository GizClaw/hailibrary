  chapters:
    - id: ch01
      title: Polly's, Peg's, and Poppety's
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Mamma was kind and good. One happy day, she gave each girl a little scarf and hood.

            She bought each of them a bonnet, too, to keep off the sun. The girls wore them in snow and rain as well, and thought it was great fun.

            But sometimes, while they played, naughty boys would call out to them. They'd make this rude remark:
        - id: ch01-b02
          speakers: [boy_1, boy_2]
          ensemble: duo
          text: My eye! Three grannies out today!
