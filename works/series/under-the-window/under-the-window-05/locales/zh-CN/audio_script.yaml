audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快俏皮，带着童谣般的惊喜语气
        timbre: 清亮柔和
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 芬妮的帽子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小芬妮戴着一顶帽子。
    - id: ch02
      title: 像奶奶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 瞧，她真像年迈的奶奶呀。
    - id: ch03
      title: 汤米的铁环
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汤米的铁环呢？真没想到，是芬妮送的！
