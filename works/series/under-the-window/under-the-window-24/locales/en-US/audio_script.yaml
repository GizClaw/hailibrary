audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Bowl Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Bowl away! Fast as you can!

            Whoever bowls fastest is my man!
    - id: ch02
      title: Round About
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Up, down, round about. Don't let it fall!
    - id: ch03
      title: Beat Them All
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Do it ten times, or twenty times. Beat them all!
