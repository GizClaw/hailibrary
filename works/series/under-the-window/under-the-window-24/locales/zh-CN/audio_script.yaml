audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快活泼，带着童谣般的竞赛节奏
        timbre: 年轻清亮
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 快快滚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快把球滚出去，能多快就多快！谁滚得最快，谁就是我的好汉！
    - id: ch02
      title: 绕圈转
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 让球上上下下，再绕圈儿转，可别让它掉下来！
    - id: ch03
      title: 胜过所有人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 滚上十次，或者二十次，一定要胜过所有人！
