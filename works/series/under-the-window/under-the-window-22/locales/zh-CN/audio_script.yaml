audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 高声吹，低声吹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            小脚丫，再跑快一点！

            拿起一便士小喇叭，吹起来！

            吹得真棒，小主人！
