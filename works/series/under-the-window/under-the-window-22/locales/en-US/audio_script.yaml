  chapters:
    - id: ch01
      title: Pipe thee high, and pipe thee low
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Play high, play low.

            Little feet, hurry! Blow your penny trumpet!

            Good job, little master!
