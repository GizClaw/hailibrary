audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 自信活泼，转折处带一点诙谐
        timbre: 清亮温暖
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 最大最好的鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你瞧，我钓上的鳟鱼，准是最大最好的！
    - id: ch02
      title: 不肯咬钩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是这个大怪物偏偏不咬钩呢？
    - id: ch03
      title: 小不点儿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那我就钓条小不点儿带走。
