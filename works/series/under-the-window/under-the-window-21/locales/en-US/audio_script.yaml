audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: The boat sails away, like a bird on the wing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Away sails the boat, like a bird on the wing.

            Little boys dance in a ring on the sand, and little girls run. The wind may fade, or it may rise. You'd be foolish to go. If you're wise, you'll stay.

            Having money may be bad, but having none is worse.
