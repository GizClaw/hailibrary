audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 船儿扬帆远去，像鸟儿展翅飞翔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 船儿扬帆远去，像鸟儿展翅飞翔。小男孩们在沙滩上围圈跳舞。风也许停，也许起。要走真糊涂，聪明就留下。男孩们跳着，女孩们跑着。有钱若不好，没钱更糟。
