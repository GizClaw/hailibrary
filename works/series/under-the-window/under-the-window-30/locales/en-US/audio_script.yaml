audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    tommy:
      display_name: Tommy
      tts:
        delivery: bright and wonder-filled
        timbre: clear and boyish
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Spring Is Here
      blocks:
        - id: ch01-b01
          speaker: tommy
          text: |-
            Sweet spring is here! I see the birds darting by, and hear the bees humming.
    - id: ch02
      title: Mister Lark
      blocks:
        - id: ch02-b01
          speaker: tommy
          text: |-
            Oh, Mister Lark, you're high up in the sky.
    - id: ch03
      title: Who Is Happier?
      blocks:
        - id: ch03-b01
          speaker: tommy
          text: |-
            Now tell me, which one of us is happier, you, sir, or me?
