audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻柔节拍
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
    tommy:
      display_name: 汤米
      tts:
        delivery: 天真活泼，问话时带着孩子的欢喜和好奇
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 春天来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 汤米说。
        - id: ch01-b02
          speaker: tommy
          text: 甜美的春天来了。我看见鸟儿飞来飞去，也听见蜜蜂嗡嗡叫。
    - id: ch02
      title: 高飞的云雀
      blocks:
        - id: ch02-b01
          speaker: tommy
          text: 嘿，云雀先生！你高高飞在天上。
    - id: ch03
      title: 谁最快乐
      blocks:
        - id: ch03-b01
          speaker: tommy
          text: 现在说说，谁最快乐？是先生你，还是我？
