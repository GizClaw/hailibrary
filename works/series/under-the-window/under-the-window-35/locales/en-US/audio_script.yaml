audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Why Is Tommy Running?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Tommy's running and running. What is he running for on this fine day?
    - id: ch02
      title: Jimmy Gives Chase
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Jimmy is running right after Tommy. He's chasing him.
    - id: ch03
      title: There Is the Answer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            And that's what Tommy is running for on this fine day.
