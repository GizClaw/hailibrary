audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻巧趣味
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 他为什么跑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天气这么好，汤米怎么跑起来了？他为什么要跑呢？
    - id: ch02
      title: 吉米追来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吉米在后头追汤米。他追呀追，跟着汤米跑。
    - id: ch03
      title: 答案
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 原来，汤米跑，是因为吉米在追他。
