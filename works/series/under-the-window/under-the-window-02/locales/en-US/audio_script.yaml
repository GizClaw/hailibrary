audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Will You Be My Little Wife?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Will you be my little wife, if I ask? Please say yes!
    - id: ch02
      title: Sunday Clothes
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: I'll buy you a Sunday dress and a nice umbrella. You'll have a little hat with a long white feather, gloves, and sandals of the softest leather.
    - id: ch03
      title: A Tiny House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: You'll have a tiny house, a beehive full of bees, a little cow, a big cat, and green sage cheese.
