audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔而轻快
        timbre: 清亮柔和
        pace: 舒缓
        pitch: 中高
    child_suitor:
      display_name: 求婚的孩子
      tts:
        delivery: 认真又满怀期待
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 请你答应
      blocks:
        - id: ch01-b01
          speaker: child_suitor
          text: 要是我开口问你，你可要答应呀！我会送你一条礼拜天穿的漂亮裙子，再送你一把好看的雨伞。
    - id: ch02
      title: 帽子、手套和鞋
      blocks:
        - id: ch02-b01
          speaker: child_suitor
          text: 你还会有一顶小帽子，上面插着长长的白羽毛。我也会送你一双手套和一双凉鞋，全都用最柔软的皮料做成。
    - id: ch03
      title: 小小的家
      blocks:
        - id: ch03-b01
          speaker: child_suitor
          text: 你还会有一座小房子、一个装满蜜蜂的蜂巢、一头小母牛和一只大点儿的猫，当然还有绿色鼠尾草奶酪。
