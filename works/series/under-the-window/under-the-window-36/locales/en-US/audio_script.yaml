audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    butcher_boy:
      display_name: Butcher's Boy
      tts:
        delivery: friendly, then firm and matter-of-fact
        timbre: youthful and clear
        pace: easy
        pitch: medium
    baker_boy:
      display_name: Baker's Boy
      tts:
        delivery: proud and quick to challenge
        timbre: youthful and bright
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Summer Walk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            One summer day, a butcher's boy met a baker's boy.
        - id: ch01-b02
          speaker: butcher_boy
          text: |-
            Would you please come walk my way with me?
    - id: ch02
      title: The Best Trade in Town
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Then the butcher's boy spoke up and praised his own trade.
        - id: ch02-b02
          speaker: butcher_boy
          text: |-
            My trade is the very best in town.
        - id: ch02-b03
          speaker: baker_boy
          text: |-
            If you dare say that, I'll have to knock you down!
          emotion: angry
    - id: ch03
      title: A Warning About the Cook
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            The butcher's boy answered the baker's threat.
        - id: ch03-b02
          speaker: butcher_boy
          text: |-
            That's a wicked thing to do. And before you knock me down, the cook will blow you up!
