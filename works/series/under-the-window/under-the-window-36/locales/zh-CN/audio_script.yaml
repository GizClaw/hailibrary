audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快俏皮，带着古老童谣一本正经的幽默
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
    butcher_boy:
      display_name: 屠夫家的小伙
      tts:
        delivery: 爽直自信，话里带着少年人的神气
        timbre: 明亮结实
        pace: 中等
        pitch: 中
    baker_boy:
      display_name: 面包师家的小伙
      tts:
        delivery: 好胜冲动，回话干脆有力
        timbre: 清亮有劲
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 夏日相逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那是一个夏日，天气一整天都好得很。屠夫家的小伙遇见了面包师家的小伙。
        - id: ch01-b02
          speaker: butcher_boy
          text: 劳驾，你愿意跟我往这边走一趟吗？
    - id: ch02
      title: 谁的行当最好
      blocks:
        - id: ch02-b01
          speaker: butcher_boy
          text: 要论城里的行当，我们这一行才是顶好的，谁也比不上。
        - id: ch02-b02
          speaker: baker_boy
          text: 你要敢说你们这行最好，我就非把你打趴下不可！
          emotion: angry
    - id: ch03
      title: 谁先倒下
      blocks:
        - id: ch03-b01
          speaker: butcher_boy
          text: 你要真动手，那可太坏了。我看呀，还没等你把我打倒在地，厨子早就先把你炸得砰一声响啦！
