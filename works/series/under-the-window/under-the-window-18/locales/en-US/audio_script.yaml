  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    tommy:
      display_name: Tommy
      tts:
        delivery: boyish and boastfully confident
        timbre: young and bright
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Tommy Was a Silly Boy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Tommy was a silly boy.
        - id: ch01-b02
          speaker: tommy
          text: I can fly!
        - id: ch01-b03
          speaker: narrator
          text: Off he went. But very soon, he tumbled down on his head. His little sister Prue was there, watching him try. He had bragged so much, and she knew Tommy would be sorry for it.
