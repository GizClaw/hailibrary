audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
    tommy:
      display_name: 汤米
      tts:
        delivery: 天真又爱逞强，说话干脆利落
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 我真的会飞
      blocks:
        - id: ch01-b01
          speaker: tommy
          text: 我真的会飞！
        - id: ch01-b02
          speaker: narrator
          text: 他说着便往前冲，可没过多久，就一头栽了下去。
    - id: ch02
      title: 普鲁在一旁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小妹妹普鲁也在一旁，等着看他究竟怎么飞。
    - id: ch03
      title: 夸口的苦头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 汤米牛皮吹得那么响，普鲁早知道，他准要吃足苦头。
