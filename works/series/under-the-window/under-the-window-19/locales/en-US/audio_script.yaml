audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: See How They Run
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Higgledy-piggledy! Look how they run! Hopperty-popperty! What's all the fun?
    - id: ch02
      title: What Has Happened?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Did the sun or the moon fall into the sea? What's going on? Please tell me!
    - id: ch03
      title: Listen to the Bell
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Higgledy-piggledy! How should I know? Hopperty-popperty! Listen to that bell! Even the rats and mice are scurrying away. Who knows what might happen today?
