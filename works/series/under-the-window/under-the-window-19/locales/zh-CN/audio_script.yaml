audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 到底出了什么事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 蹦蹦跳，跳个不停！这到底有什么热闹？难道太阳或月亮跌进海里了？究竟出了什么事，快告诉我！
    - id: ch02
      title: 铃儿响了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乱哄哄，闹腾腾，可我哪里说得清？先听，那铃儿正叮叮地响！
    - id: ch03
      title: 今天会怎样
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 连大老鼠和小老鼠也慌忙逃走了。今天还会发生什么，谁也猜不着！
