audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    paul:
      display_name: Paul
      tts:
        delivery: lively and teasing
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Snails
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Little Miss Patty and Master Paul found two snails moving along the garden wall.
    - id: ch02
      title: So Slow
      blocks:
        - id: ch02-b01
          speaker: paul
          text: |-
            These snails are so slow! We can talk much faster than they can walk.
    - id: ch03
      title: A Race of Tongues
      blocks:
        - id: ch03-b01
          speaker: paul
          text: |-
            Hurry, Mr. Snail. Please move faster! Race our tongues today, and you'd lose.
