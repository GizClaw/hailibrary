audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻巧趣味
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
    paul:
      display_name: 保罗
      tts:
        delivery: 活泼俏皮，打趣时透着孩子气的认真
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 两只蜗牛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 帕蒂小姐和保罗少爷在花园墙上瞧见了两只蜗牛。
    - id: ch02
      title: 爬得真慢
      blocks:
        - id: ch02-b01
          speaker: paul
          text: 这两只蜗牛爬得真慢！咱们说话可比它们爬得快多了。
    - id: ch03
      title: 舌头赛跑
      blocks:
        - id: ch03-b01
          speaker: paul
          text: 蜗牛先生，劳驾您快点儿吧！今天要是跟我们的舌头赛跑，您准会输。
