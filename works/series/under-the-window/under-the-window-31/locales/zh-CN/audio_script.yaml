audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻柔节拍
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
    lark:
      display_name: 云雀
      tts:
        delivery: 轻盈明快，问话时带着跃跃欲试的欢喜
        timbre: 清亮悦耳
        pace: 轻快
        pitch: 高
    flower:
      display_name: 花儿
      tts:
        delivery: 柔美稚嫩，语气里带着含苞待放的期待
        timbre: 轻柔明净
        pace: 舒缓
        pitch: 中高
    sun:
      display_name: 太阳
      tts:
        delivery: 温暖开朗，问话自然亲切
        timbre: 明亮饱满
        pace: 从容
        pitch: 中
    shower:
      display_name: 阵雨
      tts:
        delivery: 调皮急切，像一阵忽然赶来的雨
        timbre: 清脆灵动
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 大家都想来
      blocks:
        - id: ch01-b01
          speaker: lark
          text: 我来唱歌好吗？
        - id: ch01-b02
          speaker: flower
          text: 我可以开花吗？
        - id: ch01-b03
          speaker: sun
          text: 我可以出来了吗？
        - id: ch01-b04
          speaker: shower
          text: 还是该我来吗？
    - id: ch02
      title: 唱吧，开吧，照耀吧
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 唱吧，美丽的小鸟。玫瑰花呀，开一小会儿吧。最亲爱的太阳，请照耀吧。淘气的阵雨，快走开！
