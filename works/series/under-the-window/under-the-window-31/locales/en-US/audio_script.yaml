audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    lark:
      display_name: Lark
      tts:
        delivery: light and eager
        timbre: bright and airy
        pace: lively
        pitch: high
    flower:
      display_name: Flower
      tts:
        delivery: soft and hopeful
        timbre: delicate and clear
        pace: measured
        pitch: medium-high
    sun:
      display_name: Sun
      tts:
        delivery: warm and cheerful
        timbre: full and glowing
        pace: relaxed
        pitch: medium
    shower:
      display_name: Shower
      tts:
        delivery: playful and questioning
        timbre: light and silvery
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Shall We Begin?
      blocks:
        - id: ch01-b01
          speaker: lark
          text: |-
            Shall I sing?
        - id: ch01-b02
          speaker: flower
          text: |-
            Is it time for me to bloom?
        - id: ch01-b03
          speaker: sun
          text: |-
            Should I come out now?
        - id: ch01-b04
          speaker: shower
          text: |-
            Or should I be the one to come?
    - id: ch02
      title: Sing and Bloom
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Sing your song, pretty bird. Roses, bloom for just an hour.
    - id: ch03
      title: Sun and Shower
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Shine, dearest Sun. And naughty Shower, go away!
