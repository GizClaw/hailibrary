audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和从容，话里含着一点幽默
        timbre: 清亮温暖
        pace: 舒缓
        pitch: 中高
    finikin:
      display_name: 芬尼金王子
      tts:
        delivery: 娇贵自得，语气夸张而神气
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高
    mamma:
      display_name: 妈妈
      tts:
        delivery: 优雅亲切，善于温柔地观察
        timbre: 温暖柔润
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 芬尼金王子和妈妈
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 芬尼金王子和妈妈坐在一起，一口一口地啜饮着武夷茶。王子忽然叫了一声，原来他瞧见了多莉。
        - id: ch01-b02
          speaker: finikin
          text: 天哪，妈妈！那个姑娘是谁？她肯定不是我们镇上的人。
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: 王子转过身去看妈妈，妈妈便放下了茶杯。多莉还是只望着他们，一个字也没有说。
        - id: ch01-b04
          speaker: finikin
          text: 她根本不会说话！这也太荒唐了！
          emotion: surprised
        - id: ch01-b05
          speaker: mamma
          text: 亲爱的王子，依我看，她像是想喝一杯我的武夷茶。
        - id: ch01-b06
          speaker: narrator
          text: 芬尼金便给多莉倒了茶，又拿了一块醋栗派给她。随后，他转向妈妈。
        - id: ch01-b07
          speaker: finikin
          text: 亲爱的妈妈，你看我这个王子多善良！
