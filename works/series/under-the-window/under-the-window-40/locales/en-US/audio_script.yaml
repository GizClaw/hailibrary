audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    finikin:
      display_name: Prince Finikin
      tts:
        delivery: pampered and proudly dramatic
        timbre: youthful and bright
        pace: lively
        pitch: medium-high
    mamma:
      display_name: Mamma
      tts:
        delivery: gracious and gently observant
        timbre: warm and refined
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Prince Finikin and His Mamma
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Prince Finikin and his mamma sat together, sipping their bohea tea. Then the prince caught sight of Dolly.
        - id: ch01-b02
          speaker: finikin
          text: Good gracious, Mamma! Who is that girl over there? She certainly can't be from our town.
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: He turned to his mamma, and she put down her teacup. Dolly only looked back at them. She didn't say a word.
        - id: ch01-b04
          speaker: finikin
          text: She has no voice! How completely absurd!
          emotion: surprised
        - id: ch01-b05
          speaker: mamma
          text: My dear prince, I think she looks as though she'd like a cup of my bohea.
        - id: ch01-b06
          speaker: narrator
          text: So Finikin poured Dolly some tea and gave her a piece of currant pie. Then he turned to his mamma.
        - id: ch01-b07
          speaker: finikin
          text: Dear Mamma, what a kind prince I am!
