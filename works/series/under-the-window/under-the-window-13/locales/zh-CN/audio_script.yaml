audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔轻快，带一点坦白拖延时的歉意
        timbre: 清亮稚嫩
        pace: 舒缓自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 坐在小小童车里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我画了妹妹，她坐在小小的童车里。我还答应，要画着她走遍广阔的世界。
        - id: ch01-b02
          speaker: narrator
          text: 可我们还没出发，说来真难过。因为这趟旅行总要推到明天。
