  chapters:
    - id: ch01
      title: In a Go-Cart So Tiny
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I drew my sister riding in a tiny go-cart, and I promised to draw her traveling all around the wide world. We haven't started yet, and I'm sorry to admit why. Our trip keeps getting put off until tomorrow.
