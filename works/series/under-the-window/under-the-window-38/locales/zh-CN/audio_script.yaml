audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔亲切，带着轻盈的童谣韵律和好奇
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 一朵花儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小宝宝，我把这朵美丽的花抛给你，你能接住吗？
    - id: ch02
      title: 小小的手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 你站着举高两只小手，能接住吗？
    - id: ch03
      title: 灰色的眼睛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 你那双灰眼睛向外望着，眼睛里怎么藏着那么深、那么深的惊奇呀？
