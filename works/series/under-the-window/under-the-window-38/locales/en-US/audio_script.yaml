      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Little Baby, If I Threw
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Little baby, if I tossed this fair flower down to you, would you catch it? Would you stand with tiny hands held up, watching with those gray eyes, so full of deep, deep wonder?
