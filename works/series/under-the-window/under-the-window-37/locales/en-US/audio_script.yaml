audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Twelve Little Girls
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            There were twelve sweet little girls called the Miss Pelicoes. Some braided their hair in pigtails, while others wore their hair in curls.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Every day, all twelve sat down to dinner. That's nothing so unusual, you may say.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Sometimes they went out for a walk. And here's another fact about them. Every one of the twelve could talk.
    - id: ch02
      title: Lessons and Accomplishments
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Of course, the twelve Miss Pelicoes were sent to school. Their parents wanted them to do well in every accomplishment.
        - id: ch02-b02
          speaker: narrator
          text: |-
            They learned to play music. Fal-lal-la! And that made every one of them their papa's pride.
        - id: ch02-b03
          speaker: narrator
          text: |-
            They learned dancing, too, along with lessons about the globes. That showed how wise they were, and how they had patience enough to rival Job.
    - id: ch03
      title: What They Ought to Do
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            The twelve Miss Pelicoes were always very polite. They said, "If you please," and, "Many thanks." They said, "Good morning," and, "Good night."
        - id: ch03-b02
          speaker: narrator
          text: |-
            So you can plainly see that they were taught to do the things they didn't like. In other words, they did the things they ought to do.
        - id: ch03-b03
          speaker: narrator
          text: |-
            And now, farewell, Miss Pelicoes. I wish you a good day.
        - id: ch03-b04
          speaker: narrator
          text: |-
            About these twelve Miss Pelicoes, I have nothing more to say.
