audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快俏皮，带着古老童谣一本正经的幽默
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 十二位小姐妹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 佩利科家有十二位甜美的小姑娘。有的梳着两条辫子，有的留着满头卷发。
        - id: ch01-b02
          speaker: narrator
          text: 这十二位小姐妹每天都要吃一顿正餐。你大概会说，这事太平常了，一点儿也不稀罕。
        - id: ch01-b03
          speaker: narrator
          text: 她们有时也结伴出去散步。还有一件大家都知道的事，那就是十二个姑娘个个都会说话。
    - id: ch02
      title: 学堂里的本领
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 当然啦，佩利科家的小姐妹全都进了学堂。父母盼着她们样样出色，每一种本领都能学好。
        - id: ch02-b02
          speaker: narrator
          text: 她们学会了奏乐，曲子唱的是“啦啦啦”。就这样，十二个女儿都成了爸爸心里的骄傲。
        - id: ch02-b03
          speaker: narrator
          text: 她们还学跳舞，也学地球仪知识。这足以说明，她们既聪明又有耐心，那份耐性简直能和约伯相比。
    - id: ch03
      title: 该做的事情
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 十二位小姐妹无论什么时候都很有礼貌。她们会说“劳驾”“多谢”“早上好”，到了晚上还会说“晚安”。
        - id: ch03-b02
          speaker: narrator
          text: 你一听就明白，她们受过教导，不喜欢的事情也照样去做。因为那些事虽然不讨喜欢，却正是她们应该做的。
        - id: ch03-b03
          speaker: narrator
          text: 好啦，佩利科家的小姐妹，再会吧，祝你们今天过得愉快。关于这十二位姑娘，我再也没有什么可说的了。
