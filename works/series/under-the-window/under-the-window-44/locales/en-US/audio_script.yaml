  chapters:
    - id: ch01
      title: Ring the Bells--Ring!
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Ring the bells! Hip, hurrah for the King! A silly boy was going to school when he fell into the pool. The groom and cook fished him out with a hook. Then he cried like a fool.
