audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔自然，带一点轻快的好奇
        timbre: 清亮稚嫩
        pace: 舒缓而富有童谣节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 敲响钟儿——敲呀！
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 钟儿敲起来！大家为国王欢呼！笨学生走在上学路上，扑通掉进水池。马夫和厨娘用钩子把他捞上来，他却哭得像个傻瓜。
