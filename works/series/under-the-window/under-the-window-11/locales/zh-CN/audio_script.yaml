audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔轻快，带着发现小小奇遇时的欣喜
        timbre: 清亮稚嫩
        pace: 舒缓自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 我沿着街道往前走
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我沿着街道走，尖塔的钟叮当响。我坐在玛丽脚边，听鸟儿甜甜地歌唱。
        - id: ch01-b02
          speaker: narrator
          text: 我走了很远，碰见一位小仙子。她摘下一朵芬芳的花，我把它带回家送给玛丽。
