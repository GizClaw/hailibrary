audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: As I Was Walking Up the Street
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Up the street I went, with the steeple bells ringing. Then I sat at Mary's feet and listened to the sweet, sweet birds sing.
        - id: ch01-b02
          speaker: narrator
          text: I walked far into the world and met a little fairy. She picked this sweet flower, so I brought it home to Mary.
