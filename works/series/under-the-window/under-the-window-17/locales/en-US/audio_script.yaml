  chapters:
    - id: ch01
      title: Up You Go, Shuttlecocks!
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Up you go, shuttlecocks, ever so high! Why come down again? When you've gone so far, why fall? When all are high, which is highest of all?
