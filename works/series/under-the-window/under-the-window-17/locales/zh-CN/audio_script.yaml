audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 怎么又落下来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 毽子呀，怎么又落下来了？为什么呢？
    - id: ch02
      title: 已经飞得那么高
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 都飞得这么高了，怎么还会掉下来？
    - id: ch03
      title: 谁飞得最高
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家都在高处，那到底谁最高？
