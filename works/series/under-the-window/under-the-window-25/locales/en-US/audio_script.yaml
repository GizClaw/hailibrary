audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    questioner:
      display_name: Questioner
      tts:
        delivery: playful and inquisitive
        timbre: warm and clear
        pace: easy
        pitch: medium
    boy_1:
      display_name: First Boy
      tts:
        delivery: eager and direct
        timbre: bright and youthful
        pace: lively
        pitch: high
    boy_2:
      display_name: Second Boy
      tts:
        delivery: cheerful and open
        timbre: light and youthful
        pace: lively
        pitch: medium-high
    boy_3:
      display_name: Third Boy
      tts:
        delivery: spirited and clear
        timbre: warm and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Three Little Boys
      blocks:
        - id: ch01-b01
          speaker: questioner
          text: |-
            What are you longing for, you three little boys? What would you like to eat?
        - id: ch01-b02
          speakers: [boy_1, boy_2, boy_3]
          ensemble: chorus
          text: |-
            We'd love some apples, or maybe gingerbread. Or give us a great big drum we can beat!
        - id: ch01-b03
          speaker: questioner
          text: |-
            What will you give me, you three little boys, in exchange for all these good things?
        - id: ch01-b04
          speakers: [boy_1, boy_2, boy_3]
          ensemble: chorus
          text: |-
            We'll give you bread and cheese, some radishes, and our little brown bird who sings.
        - id: ch01-b05
          speaker: questioner
          text: |-
            No, no, my three little friends. That won't do at all. I want something better than that.
        - id: ch01-b06
          speaker: questioner
          text: |-
            I'll take two of your fingers and two of your thumbs, tucked into the crown of your biggest hat!
