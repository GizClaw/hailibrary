audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快活泼，带着童谣般的明朗节奏
        timbre: 清亮温暖
        pace: 舒缓而有韵律
        pitch: 中高
    old_woman:
      display_name: 老太太
      tts:
        delivery: 年迈直率，抱怨时干脆而不夸张
        timbre: 苍老微哑
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 几只鹅出门散步
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 几只鹅出门散步，要去吃早餐和晚饭。它们伸长脖子，梳好羽毛。九只鹅里来了四只，一路嘎嘎、嘎嘎、嘎嘎地叫，觉得自己神气极了。
        - id: ch01-b02
          speaker: narrator
          text: 一位年迈的老太太独自走来。她听见叫声，开口说道。
        - id: ch01-b03
          speaker: old_woman
          text: 我真盼你们这些鹅饿成皮包骨！别再嘎嘎叫了，留我一个人在这儿清静。
          emotion: angry
