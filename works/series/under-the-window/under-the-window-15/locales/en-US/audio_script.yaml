audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    grown_up:
      display_name: Grown-up
      tts:
        delivery: firm and watchful, with patient affection
        timbre: mature and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Going Out to Tea
      blocks:
        - id: ch01-b01
          speaker: grown_up
          text: You're going out to tea today, so behave yourselves. I hope I hear only good things about you afterward.
    - id: ch02
      title: At the Table
      blocks:
        - id: ch02-b01
          speaker: grown_up
          text: Don't spill your tea or gnaw your bread. Don't tease each other. Tommy, don't talk too much or quarrel with your brother.
    - id: ch03
      title: Polite Words
      blocks:
        - id: ch03-b01
          speaker: grown_up
          text: Remember to say, “If you please,” and, “Thank you, Nurse.” Be home by eight o'clock. And Fanny, please take care not to tear your dress.
    - id: ch04
      title: Another Day
      blocks:
        - id: ch04-b01
          speaker: grown_up
          text: All five of you, mind your manners and listen. Then perhaps I'll let you go again another day.
