audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 今天你们要去赴茶会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们，今天你们要去赴茶会，可得好好守规矩。我只盼后来听到的，件件都是喜事。
        - id: ch01-b02
          speaker: narrator
          text: 别洒了茶，别啃面包，也不许互相捉弄。汤米少说些，更不许跟兄弟吵架。
        - id: ch01-b03
          speaker: narrator
          text: 记得说“劳驾”，也要对保姆说“谢谢”。八点钟回家。范妮，当心别撕破衣裙。
        - id: ch01-b04
          speaker: narrator
          text: 你们五个都听好，要懂礼貌，记住我的话。这样，改天也许还让你们再去。
