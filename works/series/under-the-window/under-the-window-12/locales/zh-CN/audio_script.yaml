audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔轻快，带着发现小小奇遇时的欣喜
        timbre: 清亮稚嫩
        pace: 舒缓自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 五个小姐妹排成一行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 五个小姐妹排成一行，一起往前走。瞧，小姑娘们这样走，多好呀！她们都戴着圆帽，抱着手筒，身上还穿着柔软的新绿斗篷。
        - id: ch01-b02
          speaker: narrator
          text: 再看五朵小金盏，也排成一行向上长。它们这样长，多美呀！每一株都有碧绿的花茎，开着鲜亮的黄花，也都有一个崭新的红花盆。
