  chapters:
    - id: ch01
      title: Five Little Sisters Walking in a Row
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Five little sisters walked in a row. Isn't that the best way for little girls to go? Each wore a round hat, carried a muff, and had a new coat of soft green stuff.
        - id: ch01-b02
          speaker: narrator
          text: Five little marigolds grew in a row. Isn't that the best way for marigolds to grow? Each had a green stalk, a bright yellow flower, and a new red pot.
