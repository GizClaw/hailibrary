audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 含蓄而富有童谣韵律，渐渐透出不安
        timbre: 清澈温润
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 吹向平原
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 风儿过山顶，吹向平原。
    - id: ch02
      title: 迎来阳光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小风儿吹来阳光。
    - id: ch03
      title: 吹散雨丝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小风儿吹散雨。
