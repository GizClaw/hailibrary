audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔自然，带一点轻快的好奇
        timbre: 清亮稚嫩
        pace: 舒缓而富有童谣节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 栏杆上的三个小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月里，天气晴朗，又有些炎热。三个小姑娘坐在栏杆上。她们三个，都坐在那栏杆上。
    - id: ch02
      title: 她们聊些什么
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这么好的日子里，她们说了些什么呢？她们聊了又聊。可在九月那个晴朗炎热的日子里，她们究竟聊了些什么？
    - id: ch03
      title: 乌鸦和玉米
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她们说起了乌鸦，也说起了玉米。至于乌鸦当时说过什么，却没有一个人知道。那是九月里一个晴朗炎热的日子。
