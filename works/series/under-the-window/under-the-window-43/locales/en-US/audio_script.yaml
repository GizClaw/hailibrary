  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Three Little Girls on a Rail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three little girls sat together on a rail. There they were, all three on that rail, on a fine, hot September day.
    - id: ch02
      title: What Did They Talk About?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: What did the girls talk about that day? What was it? What kept them talking on that fine, hot September day?
    - id: ch03
      title: The Crows and the Corn
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They talked about the crows and the corn. But what did the crows say? Nobody knows, not even now, what they said on that fine, hot September day.
