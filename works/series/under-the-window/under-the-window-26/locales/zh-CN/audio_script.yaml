audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻盈节拍
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中
    singer_1:
      display_name: 第一个唱歌的孩子
      tts:
        delivery: 明快有礼，歌谣感自然
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    singer_2:
      display_name: 第二个唱歌的孩子
      tts:
        delivery: 欢欣亲切，歌谣感自然
        timbre: 柔和稚嫩
        pace: 轻快
        pitch: 高
    singer_3:
      display_name: 第三个唱歌的孩子
      tts:
        delivery: 活泼爽朗，歌谣感自然
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 哦，敲响钟儿！哦，敲响钟儿！
      blocks:
        - id: ch01-b01
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: 先生们，早安！还请你们向我们道一声谢吧。花儿开得正鲜艳，拿去装点你们的衣衫，正合适。
        - id: ch01-b02
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: 快敲钟，快敲钟！好心的先生，请收下这声问候。我们一路走来，树林处处青翠。嘿，盼着下次再见！
