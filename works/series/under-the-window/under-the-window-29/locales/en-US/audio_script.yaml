audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    jane:
      display_name: Jane
      tts:
        delivery: lively and amused
        timbre: bright and youthful
        pace: conversational
        pitch: medium-high
    willy:
      display_name: Willy
      tts:
        delivery: playful and emphatic
        timbre: clear and boyish
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Proud Girl
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Yes, that's the girl strutting about. She's so very proud! Her little bow-wow looks just as proud. They're both wrong to be so proud.
    - id: ch02
      title: Jane and Willy Laugh
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            See Jane and Willy laughing at her. They say she's much too proud.
    - id: ch03
      title: So Stiff and Proud
      blocks:
        - id: ch03-b01
          speaker: jane
          text: |-
            My stars! They're so silly!
        - id: ch03-b02
          speaker: narrator
          text: |-
            Little Willy agrees.
        - id: ch03-b03
          speaker: willy
          text: |-
            They are, walking so stiff and proud!
