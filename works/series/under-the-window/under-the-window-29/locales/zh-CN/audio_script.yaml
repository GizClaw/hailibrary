audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻柔节拍
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
    jane:
      display_name: 简
      tts:
        delivery: 直爽活泼，话里带着孩子气的笑意
        timbre: 清亮自然
        pace: 轻快
        pitch: 中高
    willy:
      display_name: 小威利
      tts:
        delivery: 天真爽快，说话干脆又有兴致
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 骄傲的姑娘和小狗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那个姑娘真神气，神气得不得了！她那只汪汪叫的小狗也一样骄傲。两个都这么骄傲，实在不应该，真是骄傲得不得了。
    - id: ch02
      title: 简和小威利笑了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 简和小威利一见她，就笑起来，说她也太骄傲了。
    - id: ch03
      title: 走得直挺挺
      blocks:
        - id: ch03-b01
          speaker: jane
          text: 天哪，这一对可真够傻的！
        - id: ch03-b02
          speaker: willy
          text: 可不是嘛！你看这一对走起路来直挺挺的，还偏要那么骄傲。
