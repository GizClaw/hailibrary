audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔轻快，带着欣赏与欢喜
        timbre: 清亮柔和
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 花园里的茶会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快活的菲莉丝，你瞧，那个可爱的小姑娘请贝琳达来喝茶了。她那精巧的小花园有绿树遮阴，还有哪里会比这儿更好呢？
    - id: ch02
      title: 草地上的点心
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 草地上摆好了桌子，桌上有塞满葡萄干的蛋糕，也有草莓。我真喜欢这张雏菊和青草铺成的地毯。还能见到比这更美的景象吗？
    - id: ch03
      title: 快活的乌鸫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一只乌鸫从那边高高的枝头轻快飞过。是啊，乌鸫最爱暖和的天气。它看见两个小姑娘亲亲热热地说着话，难怪它也这样快活！
