audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Tea in the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Look, merry Phillis! That dear little girl has invited Belinda to tea. Her sweet little garden rests in the shade of the trees. Could there be a nicer place?
    - id: ch02
      title: A Pretty Picnic
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: There's a plum cake, and strawberries too. The table is ready out on the lawn. I do love a carpet made of daisies and grass. Have you ever seen a prettier picture?
    - id: ch03
      title: The Happy Blackbird
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And look, a blackbird is flitting near that high branch. Blackbirds do love warm weather. He sees the two little girls chatting together. No wonder the blackbird is so cheerful!
