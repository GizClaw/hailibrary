audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 认真保证中带着童谣般的俏皮
        timbre: 清澈温润
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 千真万确
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我说的可是真的，绝没有耍花招。月亮上住着一个老头，还有他的狗。那老头的坏脾气呀，活像一捆木棍。
