audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和从容，带着孩子等待落空后的失望
        timbre: 清亮温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 山坡上的等待
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 唉呀，时光走得这么慢。我望着山坡，望了很久，没人从这边来。夕阳沉下去，我的影子越拖越长。
    - id: ch02
      title: 没有来的小船
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们说过，我会坐着一只小船，沿溪往上，经过白色的大磨坊。可是我从早等到晚，也没见谁向我走来。我还在等，一直等到现在。
    - id: ch03
      title: 不是真的仙子城
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们还说，我会看到一座仙子城。那里的房子全是金的，人儿都是银的，连教堂尖顶也是金的。可这些话，一句也不是真的。
