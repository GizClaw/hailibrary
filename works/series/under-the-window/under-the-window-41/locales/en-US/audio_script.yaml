audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Waiting by the Hill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Heigh ho! Time creeps by so slowly. I've watched the hill so long, but no one has come this way. Now the sun sinks low, and my shadow is very long.
    - id: ch02
      title: Still Waiting
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They told me I'd sail in a little boat, up the stream by the great white mill. But I've waited all day, and no one has come my way. I'm still waiting.
    - id: ch03
      title: The Fairy Town
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They said I'd see a fairy town, with golden houses, silver people, and a golden church steeple. But it wasn't true.
