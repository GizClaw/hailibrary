audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
    singer_1:
      display_name: First Singer
      tts:
        delivery: bright and welcoming
        timbre: clear and youthful
        pace: lively
        pitch: high
    singer_2:
      display_name: Second Singer
      tts:
        delivery: cheerful and open
        timbre: light and youthful
        pace: lively
        pitch: medium-high
    singer_3:
      display_name: Third Singer
      tts:
        delivery: warm and festive
        timbre: gentle and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Fair Maytime
      blocks:
        - id: ch01-b01
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: |-
            Fair Maytime is here. We bring our flowers, and as we sing, hear what we have to say.
    - id: ch02
      title: Ring the Bells
      blocks:
        - id: ch02-b01
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: |-
            Ring the bells! Ring the bells! We'll gladly sing along with anyone.
    - id: ch03
      title: Good Cheer
      blocks:
        - id: ch03-b01
          speakers: [singer_1, singer_2, singer_3]
          ensemble: chorus
          text: |-
            May each new year bring you good cheer, and may each of us receive a penny.
