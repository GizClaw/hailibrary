audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sailing Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            I saw a ship sail across the sea as the sun went down.
    - id: ch02
      title: White Birds
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            White birds flew after it and followed it to London town. We stood alone and sadly watched it go far away.
    - id: ch03
      title: Another Day
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            But we knew another ship would come on another day.
