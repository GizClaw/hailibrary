audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔从容，带着古老童谣的轻柔节拍
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 夕阳下的船
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 夕阳落下时，我看见一艘船航行在海上。它离我远去了。
    - id: ch02
      title: 飞往伦敦的白鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 白鸟飞起来，跟着那艘船，一直飞向城里，飞向伦敦城。我们孤零零地站着，心里很难过，望着船越驶越远。
    - id: ch03
      title: 另一天，另一艘船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可我们知道，总会有船再来。改天还会有另一艘船来。
