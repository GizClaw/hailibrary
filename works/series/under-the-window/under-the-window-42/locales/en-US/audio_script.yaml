audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly amused
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Happy Child
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I'm a happy child. I laugh and play all day long, and I almost never cry.
    - id: ch02
      title: My Green Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: I have a tree, a green, green tree. It shades me from the sun, and I often sit beneath it when all my work is done.
    - id: ch03
      title: Into Town
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: I'll take my little basket and skip into town. Next time I'm there, I'll buy some cake and spend my bright half-crown.
