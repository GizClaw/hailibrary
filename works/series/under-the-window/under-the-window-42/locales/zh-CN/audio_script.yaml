audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和从容，带着孩子等待落空后的失望
        timbre: 清亮温暖
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 快乐的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我是个快活的孩子，一天到晚笑着玩着，几乎没有哭过鼻子。
    - id: ch02
      title: 绿绿的树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我有一棵绿绿的树，它替我挡住太阳。等活儿都做完了，我常坐到树荫下面去。
    - id: ch03
      title: 挎着篮子进城
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我要挎起小篮子，轻快地走进城去。下回再进城，我要买一块蛋糕，再把那枚亮闪闪的半克朗花掉。
