audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: gentle and quietly delighted
        timbre: young and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Bell We Toll
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor Dicky is dead. We toll the bell and lay him down in the deep, dark hole.
    - id: ch02
      title: Never Again
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The sun may shine and the clouds may rain, but Dick will never pipe again.
    - id: ch03
      title: A Quilt of Flowers
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: His quilt will be as sweet as ours, bright with buttercups and cuckoo flowers.
