audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切而认真，叮嘱孩子时温和又坚定
        timbre: 温暖清亮
        pace: 舒缓而有童谣般的节奏
        pitch: 中高
  chapters:
    - id: ch01
      title: 丧钟响起
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的迪基死了。我们敲着丧钟，把他安放进那幽深昏暗的土坑。
    - id: ch02
      title: 再无歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 太阳还会照耀，云朵还会落雨，可迪克再也不会啼唱了。
    - id: ch03
      title: 花儿铺成的被子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他会盖上和我们一样芬芳的被子。上面铺着明亮的毛茛花，还有布谷鸟花。
