cover_prompt: |-
  A wordless cover gathers bold motifs from The Red Fairy Book across a northern forest, mountain pass, and distant sea. Seven white foals gallop beside a young traveler, a marvelous musician plays beneath a tree, a red-feathered bird circles a tower, and a heroic figure approaches a sleeping dragon shown only as a peaceful distant silhouette. At the center, the musician draws woodland animals and travelers together in a widening circle. The gathering created by the music is the focal action, uniting the tales without depicting combat or danger. Use a broad elevated composition with strong red accents, layered landscapes, and generous pale sky at the top. Keep the many cultural settings distinct and respectful, the costumes premodern, and every character original rather than adapted from modern media. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
