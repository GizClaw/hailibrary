audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    snowdrop:
      display_name: 白雪公主
      tts:
        delivery: 天真温柔，受惊时仍保有善良与真诚
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高
    queen:
      display_name: 老王后
      tts:
        delivery: 骄傲冷酷，嫉恨发作时尖锐狠毒
        timbre: 冷硬华丽
        pace: 适中
        pitch: 中低
    mirror:
      display_name: 魔镜
      tts:
        delivery: 不带偏私，像宣告不可更改的事实
        timbre: 清冷空灵
        pace: 缓慢
        pitch: 中等
    huntsman:
      display_name: 猎人
      tts:
        delivery: 粗朴寡言，心软时语气低沉
        timbre: 粗粝厚实
        pace: 适中
        pitch: 低
    dwarf_1:
      display_name: 第一个小矮人
      tts:
        delivery: 警觉直爽，待人善良
        timbre: 明亮结实
        pace: 适中
        pitch: 中等
    dwarf_2:
      display_name: 第二个小矮人
      tts:
        delivery: 细心温和，说话清楚利落
        timbre: 温厚清晰
        pace: 适中
        pitch: 中等
    dwarf_3:
      display_name: 第三个小矮人
      tts:
        delivery: 朴实热心，语气坦率
        timbre: 轻快朴实
        pace: 适中
        pitch: 中高
    dwarf_4:
      display_name: 第四个小矮人
      tts:
        delivery: 稳重谨慎，关切时格外郑重
        timbre: 沉稳温暖
        pace: 稍慢
        pitch: 中低
    dwarf_5:
      display_name: 第五个小矮人
      tts:
        delivery: 爽快活泼，反应敏锐
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    dwarf_6:
      display_name: 第六个小矮人
      tts:
        delivery: 务实干脆，语气坚定
        timbre: 低厚清楚
        pace: 适中
        pitch: 中低
    dwarf_7:
      display_name: 第七个小矮人
      tts:
        delivery: 温柔敏锐，惊讶时仍压低声音
        timbre: 柔和年轻
        pace: 适中
        pitch: 中等
    prince:
      display_name: 王子
      tts:
        delivery: 真挚深情，喜悦时坦率明朗
        timbre: 清朗温暖
        pace: 适中
        pitch: 中等
  chapters:
    - id: ch01
      title: 白如雪，红如血，黑如乌木
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 隆冬时节，雪花像羽毛一样落满大地。一位王后坐在乌木窗框下缝衣服，望着窗外白茫茫的雪景。针尖忽然刺破手指，三滴鲜血落在雪上。那鲜红映着雪白，实在好看。王后心里升起一个愿望。
        - id: ch01-b02
          speaker: queen
          text: 要是我能有个孩子，肌肤白如雪，嘴唇红如血，头发黑如乌木，那该多好！
        - id: ch01-b03
          speaker: narrator
          text: 她的愿望果然实现了。不久，她生下一个女儿。孩子的肌肤白如雪，双唇和面颊红如血，头发黑如乌木，人们便叫她白雪公主。可公主出生没多久，王后就去世了。一年后，国王续娶。新王后十分美丽，却骄傲专横，绝不容许任何人在美貌上胜过自己。她有一面从不说谎的魔镜，常常站在镜前端详自己的容貌，再问同一个问题。
        - id: ch01-b04
          speaker: queen
          text: 镜子呀，挂在墙上，全国谁最漂亮？
        - id: ch01-b05
          speaker: mirror
          text: 王后娘娘最美丽，举国上下无人能比。
        - id: ch01-b06
          speaker: narrator
          text: 这个回答总能叫她心满意足。可是白雪公主越长越美。七岁那年，她的美貌已经胜过了王后。王后又来问魔镜，听到的回答却变了。
        - id: ch01-b07
          speaker: mirror
          text: 王后娘娘固然美丽，白雪公主却远胜于你。
        - id: ch01-b08
          speaker: narrator
          text: 王后顿时大发雷霆，嫉妒得脸色一阵青一阵绿。从这一刻起，她恨白雪公主入骨。一天又一天，妒忌、仇恨和恶意都在增长。嫉妒就像毒草，一旦滋长，便会把人的心紧紧缠住。最后，王后再也无法忍受白雪公主出现在眼前，便叫来一名猎人。
        - id: ch01-b09
          speaker: queen
          text: 把那孩子带进森林杀掉。我再也不想看见她。把她的肺和肝带回来，我才相信她真的死了。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 猎人把白雪公主带进森林，拔刀要杀她。公主吓得哭了起来。
        - id: ch01-b11
          speaker: snowdrop
          text: 好心的猎人，求你饶我一命！我会逃进大森林，再也不回家。
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 猎人见她年幼又美丽，终于动了恻隐之心。
        - id: ch01-b13
          speaker: huntsman
          text: 快跑吧，可怜的孩子。
        - id: ch01-b14
          speaker: narrator
          text: 猎人看着她逃走，心里却想，森林里的野兽很快就会把她吃掉。即便如此，不用亲手做下这件残忍的事，他还是觉得轻松了。就在他转身时，一头小野猪从旁边跑过。猎人开枪打死它，把野猪的肺和肝带回去，当作白雪公主已经死去的证据。恶毒的王后叫人用盐炖熟，全都吃了，还以为自己已经永远除掉了白雪公主。
    - id: ch02
      title: 七个小矮人的屋子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 白雪公主独自留在大森林里，四周的树木仿佛全变成了奇形怪状的东西。她吓得不知如何是好，只能拼命向前跑。她踩过尖利的石头，钻过带刺的荆棘。野兽从她身边掠过，却没有伤害她。她一直跑到两腿再也迈不动。黄昏将近时，她看见一座小屋，便进去歇息。屋里所有东西都小小的，却干净整齐得叫人难以想象。房间中央有一张铺着白布的小桌，桌上摆着七只盘子、七把叉子、七把汤匙、七把小刀和七只玻璃杯。墙边还并排放着七张小床，每张床上都铺着雪白的床罩。
        - id: ch02-b02
          speaker: narrator
          text: 白雪公主又饿又渴，便从每只盘子里吃一点面包和粥，又从每只杯子里喝一小口酒。吃饱以后，她困得睁不开眼，便躺上第一张床，可怎么也不舒服。她只好挨个儿试过去。这张太长，那张又太短，直到第七张才恰好合适。于是，她躺下来，像个乖孩子那样做完祷告，很快便沉沉睡去。
        - id: ch02-b03
          speaker: narrator
          text: 入夜后，七个小矮人从大山深处的矿坑回来了。他们点起七盏小灯，一眼就看出屋里有人来过。
        - id: ch02-b04
          speaker: dwarf_1
          text: 谁坐过我的小椅子？
        - id: ch02-b05
          speaker: dwarf_2
          text: 谁吃过我的小面包？
        - id: ch02-b06
          speaker: dwarf_3
          text: 谁尝过我的粥？
        - id: ch02-b07
          speaker: dwarf_4
          text: 谁用我的小盘子吃过东西？
        - id: ch02-b08
          speaker: dwarf_5
          text: 谁用过我的小叉子？
        - id: ch02-b09
          speaker: dwarf_6
          text: 谁拿我的小刀切过东西？
        - id: ch02-b10
          speaker: dwarf_7
          text: 谁喝过我小杯子里的酒？
        - id: ch02-b11
          speaker: narrator
          text: 第一个小矮人又发现床铺凹下去一块。
        - id: ch02-b12
          speaker: dwarf_1
          text: 谁躺过我的床？
        - id: ch02-b13
          speakers: [dwarf_2, dwarf_3, dwarf_4, dwarf_5]
          ensemble: chorus
          text: 我们的床也有人躺过！
        - id: ch02-b14
          speaker: narrator
          text: 第七个小矮人走到床边，看见熟睡的白雪公主，惊得后退一步。伙伴们把灯光都照过来，差点儿摔倒在地。
        - id: ch02-b15
          speakers: [dwarf_1, dwarf_3, dwarf_5, dwarf_7]
          ensemble: chorus
          text: 我的天哪，多么美丽的孩子！
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: 她的美丽令小矮人们着了迷。他们不忍叫醒她，便让她继续睡在小床上。第七个小矮人没有地方可睡，只好到每个伙伴的床上轮流躺一个钟头，就这样过了一夜。清晨，白雪公主醒来，看见七个小矮人围在身边，起初吓得很厉害。可他们十分友善，和和气气地问她叫什么，她这才放下心来。
        - id: ch02-b17
          speaker: snowdrop
          text: 我叫白雪公主。
        - id: ch02-b18
          speakers: [dwarf_1, dwarf_2, dwarf_3, dwarf_4]
          ensemble: chorus
          text: 你为什么会来到我们家？
        - id: ch02-b19
          speaker: narrator
          text: 小矮人又问她为什么会来到这里。白雪公主便把全部经过告诉他们。继母怎样命人杀她，猎人怎样在森林里饶过她，她又怎样独自奔跑了一整天，直到傍晚才找到这间小屋。小矮人们听完她的悲惨遭遇，愿意收留她，不过也请她替大家料理家务。
        - id: ch02-b20
          speaker: dwarf_4
          text: 你愿意留下料理家务吗？替我们做饭、铺床、洗衣、缝补和编织。只要屋里整洁，你什么都不会缺。
        - id: ch02-b21
          speaker: snowdrop
          text: 我愿意。你们要我做的事，我都会尽心做好。
        - id: ch02-b22
          speaker: narrator
          text: 从此，白雪公主便和小矮人住在一起。每天早晨，他们走进大山深处挖金子。白雪公主留在家里，做饭、铺床、洗衣、缝补，把屋子收拾得干干净净。傍晚，小矮人回来时，晚饭总已备好。只是白天只有公主独自在家，他们实在放心不下，临走前总要郑重提醒她。
        - id: ch02-b23
          speakers: [dwarf_1, dwarf_4, dwarf_6, dwarf_7]
          ensemble: chorus
          text: 当心你的继母。她很快会找到这里。我们不在时，无论谁来，都不能让他进屋。
    - id: ch03
      title: 王后的三次毒计
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王后以为自己吃掉了白雪公主的肺和肝，认定公主已经死去，自己又成了世上最美的女人。一天，她满怀得意地来到魔镜面前。
        - id: ch03-b02
          speaker: queen
          text: 镜子呀，挂在墙上，全国谁最漂亮？
        - id: ch03-b03
          speaker: mirror
          text: 王后娘娘固然美丽，白雪公主却远胜于你。她与七个小矮人同住，比你美丽不止一倍。
        - id: ch03-b04
          speaker: narrator
          text: 王后惊骇得几乎说不出话。魔镜从不说谎，她立刻明白猎人欺骗了自己，白雪公主仍然活着。只要国内还有一个比她美的人，她那颗嫉妒的心就一刻不得安宁。她日夜盘算怎样除掉公主，终于想出一条计策。王后把脸染得苍老黯淡，换上女货郎的衣服，装扮得谁也认不出来。她翻过七座山，来到小屋门前，一面敲门，一面叫卖。
        - id: ch03-b05
          speaker: queen
          text: 上好的货物，快来买呀！
        - id: ch03-b06
          speaker: snowdrop
          text: 您好，老婆婆，您卖些什么？
        - id: ch03-b07
          speaker: queen
          text: 各种颜色、各种样式的漂亮束带，全是好货。
        - id: ch03-b08
          speaker: narrator
          text: 她举起一条用鲜艳彩绸织成的束带。白雪公主看着很喜欢，心想，让这个老实的老婆婆进来，应该没有什么关系。她便拔掉门闩，打开房门，买下了那条漂亮的束带。
        - id: ch03-b09
          speaker: queen
          text: 瞧瞧你这身打扮。来，我替你把束腰好好系一回。
        - id: ch03-b10
          speaker: narrator
          text: 白雪公主毫无戒心。王后猛地把束腰勒紧，公主透不过气，像死了一样倒下。
        - id: ch03-b11
          speaker: queen
          text: 现在你再也不是最美的人了。
        - id: ch03-b12
          speaker: narrator
          text: 傍晚，小矮人们回到家，看见亲爱的白雪公主倒在地上，像死人一样一动不动，不知有多么惊恐。他们轻轻抱起她，很快发现束腰勒得太紧，便把束带剪成两段。白雪公主先有了一丝呼吸，随后慢慢苏醒。听她讲完方才的经过，小矮人立刻认出了凶手。
        - id: ch03-b13
          speaker: dwarf_4
          text: 那个老货郎一定是老王后。以后我们不在，你绝不能让任何人进门。
        - id: ch03-b14
          speaker: narrator
          text: 老王后回宫以后，径直走到魔镜前，又问谁是全国最美的人。镜子给出的仍是同一个回答。她的脸顿时变得像死人一样惨白，立刻明白白雪公主又活了。王后发誓这一次一定要彻底结果她的性命。她精通巫术，很快做出一把有毒的梳子，又装扮成另一个老婆婆。她再次翻过七座山，来到小屋门前敲门叫卖。
        - id: ch03-b15
          speaker: snowdrop
          text: 请您走吧，我不能让任何人进来。
        - id: ch03-b16
          speaker: queen
          text: 他们总不会连看一眼都不许吧？
        - id: ch03-b17
          speaker: narrator
          text: 王后把毒梳子举到窗口，让白雪公主看个清楚。那把梳子实在漂亮，公主越看越喜欢，竟把小矮人的警告忘在脑后，又一次上了当。她打开房门，和老婆婆讲好价钱。老婆婆收下钱，马上拿起梳子，要亲手替她梳头。
        - id: ch03-b18
          speaker: queen
          text: 来，让我替你好好梳一梳头发。
        - id: ch03-b19
          speaker: narrator
          text: 梳子才碰到头发，毒性便发作了。白雪公主失去知觉，倒在地上。
        - id: ch03-b20
          speaker: queen
          text: 好一个漂亮姑娘，这回你真的完了。
        - id: ch03-b21
          speaker: narrator
          text: 幸好天已近黄昏，七个小矮人很快就回来了。他们看见白雪公主像死了一样躺在地上，立刻猜到又是她那恶毒的继母在作怪。于是，他们从头到脚仔细寻找，终于在头发里发现那把毒梳子。梳子刚一拔出来，白雪公主便苏醒了。她把发生的事情说了一遍，小矮人再次警告她，一定要多加小心，决不能给任何人开门。
        - id: ch03-b22
          speaker: narrator
          text: 可王后回去一问魔镜，仍然得知白雪公主比她美。她气得浑身发抖。
        - id: ch03-b23
          speaker: queen
          text: 白雪公主非死不可！哪怕赔上我自己的性命，我也要杀了她！
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: 王后走进一间只有自己知道的密室，在里面制成一只毒苹果。苹果外表漂亮极了，一面洁白，一面鲜红，谁见了都恨不得咬上一口，可无论谁吃下有毒的部分，都会当场丧命。王后做得十分巧妙，只有红色的那半有毒。随后，她染了脸，换上农妇的衣服，第三次翻过七座山。她照旧敲门，可白雪公主记住了警告，这回只肯从窗口说话。
        - id: ch03-b25
          speaker: snowdrop
          text: 七个小矮人不许我给任何人开门。
        - id: ch03-b26
          speaker: queen
          text: 你怕有人下毒吗？我把苹果切开，白的一半我吃，红的一半给你。
        - id: ch03-b27
          speaker: narrator
          text: 白雪公主早就馋得想尝尝那只漂亮的苹果。她看见农妇亲口吃下白色的一半，终于再也抵挡不住诱惑，伸手接过了红色的半只苹果。第一口刚刚咽下，她便倒在地上死了。残忍的王后眼中闪着得意的光，望着倒下的公主，放声大笑。
        - id: ch03-b28
          speaker: queen
          text: 白如雪，红如血，黑如乌木。这一次，小矮人再也救不活你了。
          emotion: happy
        - id: ch03-b29
          speaker: narrator
          text: 王后回到宫里，立刻站到魔镜前，又问全国谁最漂亮。这一次，魔镜终于回答，王后娘娘最美丽，举国上下无人能比。听见这句话，她那颗嫉妒的心总算安定下来。可是嫉妒之心所能得到的安宁，本来也不过如此。
    - id: ch04
      title: 山顶的玻璃棺
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 傍晚，小矮人们回到家，看见白雪公主躺在地上。她不呼吸，也一动不动。他们把她抱起来，仔细查看身上是否藏着什么有毒的东西。他们解开束腰，梳理头发，又用清水和酒替她洗身子，却全都没有用。孩子死了，再也没有醒来。小矮人把她放到灵床上，七个人围坐在旁边，哭泣哀恸了整整三天。最后，他们只得决定将她安葬。
        - id: ch04-b02
          speaker: narrator
          text: 可她看上去仍像活着时一样鲜艳动人，双颊没有失去美丽的红润。小矮人们望着她，实在舍不得把她埋进冰冷的地下。
        - id: ch04-b03
          speakers: [dwarf_1, dwarf_4, dwarf_6, dwarf_7]
          ensemble: chorus
          text: 我们不能把她藏进漆黑的泥土里。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 他们请人做了一具透明的玻璃棺，把白雪公主安放进去，又用金字在棺盖上写明她是一位王家公主。随后，他们把玻璃棺放在山顶，始终留下一个小矮人守在旁边。就连空中的鸟儿也飞来哀悼白雪公主。先来的是猫头鹰，接着是乌鸦，最后来了一只小鸽子。
        - id: ch04-b05
          speaker: narrator
          text: 白雪公主在玻璃棺里躺了很久，模样始终没有改变，仿佛只是在沉沉熟睡。她依旧白如雪，双颊红如血，头发黑如乌木。一天，一位王子来到这片森林，从小矮人的屋子旁边经过。他抬头看见山上的玻璃棺，也看见里面美丽的白雪公主。王子走上山，读完棺盖上的金字，便向守在那里的一名小矮人请求。
        - id: ch04-b06
          speaker: prince
          text: 把玻璃棺给我吧。无论你想要什么，我都愿意交换。
        - id: ch04-b07
          speaker: dwarf_7
          text: 不行。就算拿全世界的金子来换，我们也不会给你。
        - id: ch04-b08
          speaker: prince
          text: 那就送给我吧。没有白雪公主，我活不下去。我会把她当作世上最珍贵的宝物，永远爱护她。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 王子说得那样悲伤，好心的小矮人不禁同情起他，便把玻璃棺送给了他。王子命仆人把棺材抬在肩上，沿山路带走。下山途中，一个仆人绊到一丛灌木，玻璃棺猛烈地颠了一下。白雪公主吞下的那块毒苹果竟从喉咙里掉了出来。她慢慢睁开眼睛，抬起棺盖，坐起身来，又恢复了生命和健康。
        - id: ch04-b10
          speaker: snowdrop
          text: 哎呀，我这是在哪里？
          emotion: surprised
        - id: ch04-b11
          speaker: prince
          text: 你和我在一起。
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: 王子满心欢喜，把自己怎样来到森林、怎样看见玻璃棺，以及小矮人如何把玻璃棺送给他的经过，全都告诉了她。说完，他便向白雪公主求婚。
        - id: ch04-b13
          speaker: prince
          text: 我爱你胜过世上的任何人。你愿意跟我回到父王的宫殿，做我的妻子吗？
        - id: ch04-b14
          speaker: narrator
          text: 白雪公主答应了王子的求婚，跟随他离开森林，一同回到他父王的宫殿。为了庆祝他们成婚，宫里举行了一场无比盛大辉煌的婚礼，许多宾客都收到了邀请。
    - id: ch05
      title: 最后的婚宴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 白雪公主那恶毒的继母也在婚宴的宾客之列。她把自己打扮得极其华丽，换好赴宴的礼服以后，临行前又来到魔镜旁，想听一听镜子会怎样回答。
        - id: ch05-b02
          speaker: queen
          text: 镜子呀，挂在墙上，全国谁最漂亮？
        - id: ch05-b03
          speaker: mirror
          text: 王后娘娘固然美丽，白雪公主却远胜于你。
        - id: ch05-b04
          speaker: narrator
          text: 老王后听见这个回答，立刻破口咒骂，羞愤得几乎发狂。起初，她根本不愿前去参加婚礼。可她又觉得，不亲眼看看那位年轻的王后，自己便永远不会安心。最后，她还是去了。老王后一走进婚宴，白雪公主便认出了她，吓得几乎昏倒。可是人们早已为这个恶毒的女人准备好一双烧得通红的铁鞋，逼她把脚伸进去，再不停地跳舞，直到她倒在地上死去。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事采自格林兄弟。
