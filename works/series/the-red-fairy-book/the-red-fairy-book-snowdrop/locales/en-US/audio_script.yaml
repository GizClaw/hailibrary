  chapters:
    - id: ch01
      title: The Queen's Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the middle of winter, snowflakes floated down like feathers. A Queen sat sewing beside a window framed in black ebony. As she looked across the white land, her needle pricked her finger. Three drops of blood fell onto the snow, and the bright red against the white gave her a wish.
        - id: ch01-b02
          speaker: first_queen
          text: Oh, what would I give for a child as white as snow, as red as blood, and as black as ebony!
        - id: ch01-b03
          speaker: narrator
          text: Before long, her wish came true. She had a little daughter whose skin was white as snow, whose lips and cheeks were red as blood, and whose hair was black as ebony. They called her Snowdrop. Soon after the child was born, the Queen died.
        - id: ch01-b04
          speaker: narrator
          text: A year later, the King married again. His new wife was beautiful, but she was proud and overbearing. She could not bear for anyone to rival her beauty. She owned a magic mirror, and often stood before it to ask the same question.
        - id: ch01-b05
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch01-b06
          speaker: mirror
          text: You are the fairest, my Lady Queen. No one in the land is fairer.
        - id: ch01-b07
          speaker: narrator
          text: That answer always pleased her. She knew the mirror spoke the truth, so she had no reason to doubt that she stood above every other beauty in the land.
        - id: ch01-b08
          speaker: narrator
          text: But every day Snowdrop grew lovelier. By the time she was seven, she was even more beautiful than the Queen. One day, the Queen asked her usual question, and the mirror gave a different answer.
        - id: ch01-b09
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch01-b10
          speaker: mirror
          text: My Lady Queen, you are fair, it is true. But Snowdrop is far fairer than you.
        - id: ch01-b11
          speaker: narrator
          text: The Queen flew into a terrible rage and turned every shade of green with jealousy. From that hour, she hated poor Snowdrop as if the child were poison. Her envy, hatred, and malice grew stronger each day. They were like evil weeds springing up and choking her heart. At last, she could no longer bear to have Snowdrop near her. She called for a huntsman.
        - id: ch01-b12
          speaker: stepmother
          text: Take that child into the woods, and make sure I never see her face again. Kill her. Bring back her lungs and liver so I will know she is dead.
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: The Huntsman obeyed and led Snowdrop deep into the woods. He drew his knife to kill her, but she began to cry.
        - id: ch01-b14
          speaker: snowdrop
          text: Oh, dear Huntsman, please spare me! I will run far into the woods and never come home again.
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: She was so young and pretty that he took pity on her.
        - id: ch01-b16
          speaker: huntsman
          text: Then run, poor child. Go now.
        - id: ch01-b17
          speaker: narrator
          text: He believed the wild animals would soon eat her, but his heart still felt lighter because he had not done the terrible deed himself. As he turned away, a young boar ran past. The Huntsman shot it and carried its lungs and liver back to the Queen as proof that Snowdrop was dead. The wicked woman had them stewed with salt. Then she ate them, certain she had put an end to Snowdrop forever.
    - id: ch02
      title: The House in the Woods
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Snowdrop was now alone in the great wood. The trees around her seemed to take on strange shapes, and she was too frightened to know what to do. She ran over sharp stones and through thorny bushes. Wild animals passed close by, but none of them harmed her. She kept running until evening, when she came upon a little house and went inside to rest.
        - id: ch02-b02
          speaker: narrator
          text: Everything in the house was tiny, and everything was wonderfully clean and neat. A white cloth covered the little table. On it stood seven small plates, seven forks, seven spoons, seven knives, and seven tumblers. Along the wall were seven little beds with snow-white covers.
        - id: ch02-b03
          speaker: narrator
          text: Snowdrop was terribly hungry and thirsty. She took one small piece of bread and a little porridge from each plate, careful not to take everything from any one place. Then she drank a single drop of wine from each tumbler. By then, she was tired and sleepy. She lay on the first bed, but it was uncomfortable. She tried the others one by one. Some were too long and some too short. Only the seventh fit her perfectly. She said her prayers, lay down, and fell fast asleep.
        - id: ch02-b04
          speaker: narrator
          text: After dark, the owners of the house returned. They were seven dwarfs who worked in mines deep inside the mountain. They lit their seven lamps. Once their eyes had grown used to the light, they could tell that someone had disturbed the room.
        - id: ch02-b05
          speaker: dwarf_1
          text: Who has been sitting in my little chair?
        - id: ch02-b06
          speaker: dwarf_2
          text: Who has eaten some of my little loaf?
        - id: ch02-b07
          speaker: dwarf_3
          text: Who has tasted my porridge?
        - id: ch02-b08
          speaker: dwarf_4
          text: Who has been eating from my little plate?
        - id: ch02-b09
          speaker: dwarf_5
          text: Who has used my little fork?
        - id: ch02-b10
          speaker: dwarf_6
          text: Who has been cutting with my little knife?
        - id: ch02-b11
          speaker: dwarf_7
          text: Who has drunk from my little tumbler?
        - id: ch02-b12
          speaker: narrator
          text: The first Dwarf looked at his bed and noticed a small hollow in it.
        - id: ch02-b13
          speaker: dwarf_1
          text: And who has been lying in my bed?
        - id: ch02-b14
          speaker: narrator
          text: The others hurried over and looked at their own beds.
        - id: ch02-b15
          speakers: [dwarf_2, dwarf_3, dwarf_4, dwarf_5]
          ensemble: chorus
          text: Someone has been lying in our beds too!
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: Then the seventh Dwarf reached his bed and stepped back in amazement. Snowdrop was asleep there. He called the others, and they held their lamps over her. The sight of the child almost knocked them down with surprise.
        - id: ch02-b17
          speakers: [dwarf_1, dwarf_3, dwarf_5, dwarf_7]
          ensemble: chorus
          text: Goodness! What a beautiful child!
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: They were so charmed by her beauty that they did not wake her. Since his own bed was taken, the seventh Dwarf slept beside each of his companions in turn. He spent one hour in every bed, and in that way he passed the whole night.
        - id: ch02-b19
          speaker: narrator
          text: In the morning, Snowdrop woke and was frightened to see seven little Dwarfs. But they spoke kindly and asked her name.
        - id: ch02-b20
          speaker: snowdrop
          text: My name is Snowdrop.
        - id: ch02-b21
          speakers: [dwarf_1, dwarf_2, dwarf_3, dwarf_4]
          ensemble: chorus
          text: How did you come to our house?
        - id: ch02-b22
          speaker: narrator
          text: Snowdrop told them that her stepmother had ordered her death, that the Huntsman had spared her, and that she had run all day until she found their little house. When the Dwarfs heard her sad story, they offered her a home.
        - id: ch02-b23
          speakers: [dwarf_4, dwarf_5, dwarf_6, dwarf_7]
          ensemble: chorus
          text: Will you stay with us and keep house? You can cook, make the beds, wash, sew, and knit. If you keep everything neat and do the work well, you will have all you need.
        - id: ch02-b24
          speaker: snowdrop
          text: Yes. I will gladly do everything you ask.
          emotion: happy
        - id: ch02-b25
          speaker: narrator
          text: So Snowdrop made her home with them and kept their little house in order. Each morning, the Dwarfs went deep into the heart of the mountain to dig for gold. Each evening, they came back to find that Snowdrop had supper ready. But while they worked, she was left in the house all alone. The good Dwarfs knew the danger and gave her a warning.
        - id: ch02-b26
          speakers: [dwarf_1, dwarf_2, dwarf_6, dwarf_7]
          ensemble: chorus
          text: Watch out for your stepmother. She will soon discover where you are. Whatever happens, do not let anyone into the house while we are gone.
    - id: ch03
      title: The Queen's Disguises
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Queen believed she had eaten Snowdrop's lungs and liver, so she never doubted that she was once more the most beautiful woman in the world. One day, she stood before her mirror again.
        - id: ch03-b02
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch03-b03
          speaker: mirror
          text: My Lady Queen, you are fair, it is true. But Snowdrop is far fairer than you. She lives with the seven little men, and her beauty is twice as great as yours.
        - id: ch03-b04
          speaker: narrator
          text: The Queen was nearly struck dumb with horror. The mirror always told the truth. Now she knew that the Huntsman had deceived her and Snowdrop was still alive. She thought day and night about how to destroy the child. As long as she had a rival anywhere in the land, her jealous heart gave her no rest. At last, she formed a plan. She darkened her face and dressed herself as an old peddler woman until no one could have recognized her. In that disguise, she crossed seven hills to the Dwarfs' house and knocked at the door.
        - id: ch03-b05
          speaker: stepmother
          text: Fine goods for sale! Fine goods for sale!
        - id: ch03-b06
          speaker: narrator
          text: Snowdrop peered through the window.
        - id: ch03-b07
          speaker: snowdrop
          text: Good day, mother. What are you selling?
        - id: ch03-b08
          speaker: stepmother
          text: Lovely things, my dear. I have laces in every color and kind.
        - id: ch03-b09
          speaker: narrator
          text: The disguised Queen held up a lace made from bright-colored silk. Snowdrop decided that such an honest-looking woman could surely come inside. She unbarred the door and bought the pretty lace.
        - id: ch03-b10
          speaker: stepmother
          text: Good gracious, child! Just look at the shape of you. Come here, and let me lace you properly for once.
        - id: ch03-b11
          speaker: narrator
          text: Snowdrop suspected nothing and stood before her. The old woman pulled the lace so quickly and so tight that Snowdrop could no longer breathe. She fell to the floor as if dead.
        - id: ch03-b12
          speaker: stepmother
          text: Now you are not the fairest anymore.
        - id: ch03-b13
          speaker: narrator
          text: The wicked woman hurried away.
        - id: ch03-b14
          speaker: narrator
          text: That evening, the seven Dwarfs came home and were terrified to find their dear Snowdrop on the floor. She lay as still and motionless as a dead person. They lifted her gently and looked her over. When they saw how tightly she had been laced, they cut the lace in two. Snowdrop began to breathe a little. Slowly, she came back to life. Once they heard what had happened, the Dwarfs knew who the peddler had really been.
        - id: ch03-b15
          speakers: [dwarf_1, dwarf_2, dwarf_6, dwarf_7]
          ensemble: chorus
          text: That old peddler was your stepmother, the Queen. From now on, never let anyone inside when we are away.
        - id: ch03-b16
          speaker: narrator
          text: The Queen went straight to her mirror as soon as she reached home.
        - id: ch03-b17
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch03-b18
          speaker: mirror
          text: My Lady Queen, you are fair, it is true. But Snowdrop is far fairer than you. She lives with the seven little men, and her beauty is twice as great as yours.
        - id: ch03-b19
          speaker: narrator
          text: The Queen turned pale as death. Snowdrop had come back to life.
        - id: ch03-b20
          speaker: stepmother
          text: This time, I will find a way to finish her once and for all.
        - id: ch03-b21
          speaker: narrator
          text: With the witchcraft she knew so well, the Queen made a poisonous comb. She disguised herself as a different old woman, crossed the seven hills, and knocked at the Dwarfs' door.
        - id: ch03-b22
          speaker: stepmother
          text: Fine goods for sale!
        - id: ch03-b23
          speaker: narrator
          text: Snowdrop looked through the window.
        - id: ch03-b24
          speaker: snowdrop
          text: You must go away. I am not allowed to let anyone inside.
        - id: ch03-b25
          speaker: stepmother
          text: Surely no one has forbidden you to look.
        - id: ch03-b26
          speaker: narrator
          text: She held up the poisoned comb. Snowdrop liked it so much that she was fooled again and opened the door. After they agreed on the price, the old woman spoke.
        - id: ch03-b27
          speaker: stepmother
          text: Now come here, and let me comb your hair properly for once.
        - id: ch03-b28
          speaker: narrator
          text: Snowdrop expected no harm. The instant the comb touched her hair, the poison took hold, and she fell unconscious.
        - id: ch03-b29
          speaker: stepmother
          text: There, my fine lady. This time you are truly finished.
        - id: ch03-b30
          speaker: narrator
          text: The wicked woman rushed home. Luckily, it was almost evening. The Dwarfs returned and found Snowdrop lying on the ground like someone dead. They suspected her stepmother at once. They searched until they found the poisoned comb, and the moment they pulled it from her hair, Snowdrop woke. She told them what had happened. Once again, they warned her to be careful and never open the door.
        - id: ch03-b31
          speaker: narrator
          text: The Queen reached home and went straight to the mirror.
        - id: ch03-b32
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch03-b33
          speaker: mirror
          text: My Lady Queen, you are fair, it is true. But Snowdrop is far fairer than you. She lives with the seven little men, and her beauty is twice as great as yours.
        - id: ch03-b34
          speaker: narrator
          text: The Queen shook all over with rage.
        - id: ch03-b35
          speaker: stepmother
          text: Snowdrop will die, even if it costs me my own life!
          emotion: angry
    - id: ch04
      title: The Poisoned Apple
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Queen entered a small secret room that no one else knew about. There, she made a poisoned apple. From the outside, it looked beautiful, with one white cheek and one red cheek. Anyone who saw it would long for a taste, but anyone who ate the poison would die on the spot. When the apple was ready, the Queen stained her face and dressed herself as a peasant woman. Then she carried it over the seven hills to the Dwarfs' house.
        - id: ch04-b02
          speaker: narrator
          text: She knocked at the Dwarfs' door. Snowdrop leaned out of the window.
        - id: ch04-b03
          speaker: snowdrop
          text: I cannot let anyone inside. The seven Dwarfs have forbidden it.
        - id: ch04-b04
          speaker: stepmother
          text: Are you afraid I might poison you? Look, I will cut the apple in half. I will eat the white side, and you may have the red one.
        - id: ch04-b05
          speaker: narrator
          text: The apple had been cleverly made, and only the red half held poison. Snowdrop longed for the lovely fruit. When she saw the peasant woman eating her own half, she could resist no longer. She reached out and took the poisoned piece. The first bite had barely passed her lips when she fell dead to the ground.
        - id: ch04-b06
          speaker: narrator
          text: The cruel Queen's eyes shone with delight. She laughed aloud.
        - id: ch04-b07
          speaker: stepmother
          text: White as snow, red as blood, and black as ebony. This time, the Dwarfs will not bring you back to life.
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: When the Queen returned home, she questioned the mirror.
        - id: ch04-b09
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch04-b10
          speaker: mirror
          text: You are the fairest, my Lady Queen. No one in the land is fairer.
        - id: ch04-b11
          speaker: narrator
          text: At last, her jealous heart was at rest, or as much at rest as a jealous heart can ever be.
        - id: ch04-b12
          speaker: narrator
          text: That evening, the Dwarfs found Snowdrop on the ground. She did not breathe or move. They lifted her and searched everywhere for something poisonous. They loosened her bodice, combed her hair, and washed her with water and wine. Nothing helped. Snowdrop was dead, and she stayed dead.
        - id: ch04-b13
          speaker: narrator
          text: They laid her on a bier, and all seven sat around her. For three whole days, they wept and sobbed over Snowdrop. At last, they decided that they must bury her. But even then, she looked as fresh and blooming as someone alive. Her cheeks still held their lovely color, and the Dwarfs could not bear to place her in a grave.
        - id: ch04-b14
          speakers: [dwarf_1, dwarf_3, dwarf_5, dwarf_7]
          ensemble: chorus
          text: We cannot hide her away in the black earth.
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: They had a coffin made from clear glass so that Snowdrop could still be seen, and they laid her inside. In golden letters on the lid, they wrote that she was a royal Princess. They placed the coffin high on top of the mountain. From then on, one of the Dwarfs always stayed beside it to keep watch. Even the birds of the air came to mourn Snowdrop's death. First came an owl, then a raven, and at last a little dove.
        - id: ch04-b16
          speaker: narrator
          text: Snowdrop lay in the coffin for a long time without changing. She seemed only to be fast asleep. She was still as white as snow and as red as blood, and her hair was still as black as ebony.
    - id: ch05
      title: Snowdrop Awakens
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, a Prince traveled through the wood and passed the Dwarfs' house. He saw the coffin on the hill and the beautiful Snowdrop inside. After reading the golden words on the lid, he spoke to the Dwarf on watch.
        - id: ch05-b02
          speaker: prince
          text: Give me the coffin. I will give you anything you ask for it.
        - id: ch05-b03
          speaker: dwarf_7
          text: No. We would not part with it for all the gold in the world.
        - id: ch05-b04
          speaker: prince
          text: Then please give it to me, because I cannot live without Snowdrop. I will love and cherish the coffin as my dearest possession.
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: The Prince spoke with such sadness that the good Dwarfs took pity on him. At last, they gave him the coffin. The Prince ordered his servants to lift it onto their shoulders and carry it away. As they made their way down the hill, the servants stumbled over a bush. The coffin was shaken so violently that the poisoned piece of apple Snowdrop had swallowed flew out of her throat.
        - id: ch05-b06
          speaker: narrator
          text: Slowly, Snowdrop opened her eyes. She lifted the glass lid above her and sat up inside the coffin. She was alive and well again.
        - id: ch05-b07
          speaker: snowdrop
          text: Oh, dear! Where am I?
          emotion: surprised
        - id: ch05-b08
          speaker: prince
          text: You are with me!
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: The Prince joyfully told her all that had happened. Then he asked her to go with him.
        - id: ch05-b10
          speaker: prince
          text: I love you more than anyone in the whole wide world. Will you come to my father's palace and become my wife?
        - id: ch05-b11
          speaker: narrator
          text: Snowdrop agreed to become his wife and went with him to his father's palace. Their marriage was celebrated there with great pomp and splendor.
        - id: ch05-b12
          speaker: narrator
          text: Snowdrop's wicked stepmother was invited to the wedding feast. She dressed in her finest clothes for the occasion, then stood before the mirror.
        - id: ch05-b13
          speaker: stepmother
          text: Mirror, mirror, hanging there, who is the fairest in all the land?
        - id: ch05-b14
          speaker: mirror
          text: My Lady Queen, you are fair, it is true. But Snowdrop is far fairer than you.
        - id: ch05-b15
          speaker: narrator
          text: The wicked Queen uttered a curse. Rage and shame drove her almost out of her mind. At first, she wanted to stay away from the wedding altogether. At the same time, she knew she would never be happy until she had seen the young Queen with her own eyes. So at last, she went to the feast.
        - id: ch05-b16
          speaker: narrator
          text: The moment the stepmother entered the wedding, Snowdrop recognized her and nearly fainted with fear. Red-hot iron shoes had been prepared for the wicked old Queen. She was made to step into them and dance before the wedding guests. She danced until she fell down dead.
