  chapters:
    - id: ch01
      title: The King's Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a King and Queen with one delightful daughter. She was so graceful, pretty, and clever that everyone called her Graciosa. Her mother loved her so dearly that she could think of almost nothing else. Each day the Queen gave her a lovely new dress of gold brocade, satin, or velvet. Whenever Graciosa was hungry, there were bowls filled with sugar-plums and at least twenty pots of jam waiting for her. People everywhere in all the wide world said no Princess could possibly be happier.
        - id: ch01-b02
          speaker: narrator
          text: At the same court lived a very rich old duchess named Grumbly. She was more fearsome than words could tell. Her hair was red as fire, she had only one eye, and that eye was not a pretty one. Her face was as broad as a full moon. Her mouth was so enormous that anyone who met her might fear being eaten, except that she had no teeth. She was every bit as cross as she was ugly, and she could not bear hearing everyone praise Graciosa's beauty and charm. Before long, she left the court for her own nearby castle. Yet whenever a visitor happened to mention the charming Princess, Grumbly flew into a rage.
        - id: ch01-b03
          speaker: queen_grumbly
          text: She isn't lovely at all! There is more beauty in my little finger than in her whole body.
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: Soon afterward, the Queen fell ill and died. Graciosa was heartbroken, and the King grew so melancholy that he shut himself inside his palace for a full year. His physicians feared he would become ill too. At last they ordered him to go outdoors and find some amusement. The court arranged a hunting party. Yet the day was so hot that the King soon grew weary of riding. When the party passed a castle, he announced that he would dismount and rest there.
        - id: ch01-b05
          speaker: narrator
          text: The castle belonged to Duchess Grumbly. When she heard the King was approaching, she went out to meet him. She told him that if he would agree to go below, the cellar was the coolest place in the whole castle. Down they went together. Nearly two hundred enormous casks stood there in long rows, side by side. The sight astonished the King, and he asked whether one woman truly kept that immense store of wine only for herself.
        - id: ch01-b06
          speaker: queen_grumbly
          text: Yes, sire, every drop is mine. Still, I would be delighted to give you a taste. Would you prefer canary, St. Julien, champagne, hermitage sack, raisin wine, or cider?
        - id: ch01-b07
          speaker: king
          text: Since you are kind enough to offer, I would rather have champagne than anything else.
        - id: ch01-b08
          speaker: narrator
          text: The Duchess picked up a small hammer and tapped the first cask twice. Instead of wine, at least a thousand crowns poured out.
        - id: ch01-b09
          speaker: queen_grumbly
          text: Well, what can this mean?
        - id: ch01-b10
          speaker: narrator
          text: She smiled and tapped the next cask. Out tumbled a whole bushel of gold pieces.
        - id: ch01-b11
          speaker: queen_grumbly
          text: I cannot understand it at all.
        - id: ch01-b12
          speaker: narrator
          text: Her smile widened as she tapped a third cask. This time diamonds and pearls streamed out until they covered the floor.
        - id: ch01-b13
          speaker: queen_grumbly
          text: Sire, this is beyond understanding. Someone must have stolen my good wine and filled the casks with this rubbish.
        - id: ch01-b14
          speaker: king
          text: Rubbish, Madam Grumbly? There is enough treasure here to buy ten kingdoms!
          emotion: surprised
        - id: ch01-b15
          speaker: queen_grumbly
          text: The truth is, all these casks hold gold and jewels. Marry me, and every bit of it will belong to you.
        - id: ch01-b16
          speaker: narrator
          text: The King loved money more than anything in the world. He answered at once.
        - id: ch01-b17
          speaker: king
          text: Marry you? Gladly! Tomorrow, if you wish.
          emotion: happy
        - id: ch01-b18
          speaker: queen_grumbly
          text: I have one condition. Your daughter must be entirely under my control, and I may do whatever I please with her.
        - id: ch01-b19
          speaker: king
          text: Certainly. You shall have your own way. Let us shake hands on it.
        - id: ch01-b20
          speaker: narrator
          text: They shook hands and left the treasure cellar. Grumbly locked its door and gave the key to the King.
        - id: ch01-b21
          speaker: narrator
          text: Back at his palace, Graciosa ran to meet him and asked whether the hunt had gone well.
        - id: ch01-b22
          speaker: king
          text: I caught a dove.
        - id: ch01-b23
          speaker: graciosa
          text: Oh, please give it to me! I will keep it and care for it.
        - id: ch01-b24
          speaker: king
          text: I can hardly do that. To speak plainly, I met Duchess Grumbly and promised to marry her.
        - id: ch01-b25
          speaker: graciosa
          text: And you call her a dove? I would call her a screech owl!
          emotion: surprised
        - id: ch01-b26
          speaker: king
          text: Hold your tongue. You will behave properly toward her. Go and make yourself presentable, because I am taking you to visit her.
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: Graciosa went sorrowfully to her room. Her nurse saw her tears and asked what was wrong.
        - id: ch01-b28
          speaker: graciosa
          text: How could I not be upset? The King means to marry again, and he has chosen my enemy, that hideous Duchess Grumbly.
          emotion: sad
        - id: ch01-b29
          speaker: nurse
          text: Remember that you are a Princess, and people expect you to set a good example when trouble comes. Promise me you will not show the Duchess how much you dislike her.
        - id: ch01-b30
          speaker: narrator
          text: At first Graciosa would make no such promise. But the nurse patiently offered one good reason after another, until the Princess finally agreed to treat her stepmother pleasantly. Then the nurse dressed her in a robe of pale green and gold brocade. She combed out Graciosa's long fair hair until it floated all around her like a golden mantle, and set a crown of roses and jasmine with emerald leaves upon her head. When the Princess was ready, no one could have looked prettier. Even so, she could not hide her sadness.
        - id: ch01-b31
          speaker: narrator
          text: Meanwhile, Grumbly was busy dressing herself. She had one shoe heel raised an inch or so above the other to make her limp less obvious. In place of her missing eye, she fitted a cleverly made eye of glass. She dyed her fiery red hair black and covered her face with paint. Over a yellow petticoat trimmed with violet ribbons, she wore a grand robe of lilac satin lined in blue. She had heard that queens always rode into their new dominions, so she ordered servants to prepare a horse for her.
    - id: ch02
      title: The Page in Green
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: While Graciosa waited for the King, she wandered alone through the garden and into a little wood. She sat on a mossy bank with such miserable thoughts that she began to cry. She cried until she forgot she was meant to return to the palace. Then a handsome page appeared before her. He wore green, and the cap in his hand had white plumes. He dropped to one knee.
        - id: ch02-b02
          speaker: percinet
          text: Princess, the King is waiting for you.
        - id: ch02-b03
          speaker: narrator
          text: Graciosa was startled, and truthfully, delighted by this charming page. She could not remember seeing him before. Thinking he might belong to the Duchess's household, she questioned him.
        - id: ch02-b04
          speaker: graciosa
          text: How long have you served as one of the King's pages?
        - id: ch02-b05
          speaker: percinet
          text: I do not serve the King, madam. I serve you.
        - id: ch02-b06
          speaker: graciosa
          text: You serve me? Then why have I never seen you before?
          emotion: surprised
        - id: ch02-b07
          speaker: percinet
          text: Princess, I never dared to appear before you. But the King's marriage places you in such danger that I must tell you how deeply I already love you. I hope one day to win your affection. I am Prince Percinet. You may have heard of my riches and my fairy gift. If you allow me to stay beside you in this disguise, that gift may help you through every difficulty.
        - id: ch02-b08
          speaker: graciosa
          text: Percinet, is it truly you? I have heard so much about you and often wished to meet you. If you will really be my friend, I will no longer fear that wicked old Duchess.
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: They returned to the palace together. Percinet had brought Graciosa a magnificent horse to ride. It was so spirited that he kept hold of the bridle, which gave him every excuse to turn and look at the Princess. He did so often, because looking at her was a pleasure. When the Duchess's mount was led up beside Graciosa's, it seemed no better than an old cart horse. The trappings were even farther apart. The Princess's saddle and bridle were one glittering mass of diamonds.
        - id: ch02-b10
          speaker: narrator
          text: The King was too occupied to notice, but every courtier admired the Princess and her page in green. Percinet looked more handsome and distinguished than all the rest of the court together.
        - id: ch02-b11
          speaker: narrator
          text: They found Grumbly sitting in an open carriage and trying unsuccessfully to look dignified. The King and Princess saluted her, and servants brought her horse. The moment she saw Graciosa's mount, she burst out angrily.
        - id: ch02-b12
          speaker: queen_grumbly
          text: If that child has a better horse than mine, I will return to my castle this instant! What is the use of being Queen if people treat me with such disrespect?
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: The King ordered Graciosa to dismount and ask the Duchess to honor her by taking her horse. Graciosa obeyed without a word. Grumbly neither looked at her nor thanked her. She scrambled onto the beautiful horse and sat there like a bundle of clothes, while eight officers held her up so she would not fall.
        - id: ch02-b14
          speaker: narrator
          text: Still she grumbled and muttered. When they asked what else was wrong, she answered sharply.
        - id: ch02-b15
          speaker: queen_grumbly
          text: I want that page in green to lead my horse, just as he did when Graciosa rode it.
        - id: ch02-b16
          speaker: narrator
          text: The King commanded Percinet to lead the Queen's horse. Percinet and Graciosa exchanged a look but said nothing. Then the procession set out in great splendor. Grumbly felt so grand that she would not have traded places even with Graciosa.
        - id: ch02-b17
          speaker: narrator
          text: At the very moment no one expected trouble, the beautiful horse began to plunge. It reared, kicked, and finally bolted at a pace no one could stop. Grumbly clung to the saddle for a little while, but soon she was thrown off. She landed in a heap among stones and thorns. When the others found her, she had been shaken like jelly, and they gathered up what remained of her as carefully as pieces of broken glass. Her bonnet was in one place and her shoes in another. Her face was scratched, and her splendid clothes were plastered with mud. No bride had ever arrived in such a dismal condition.
        - id: ch02-b18
          speaker: narrator
          text: They carried her to the palace and put her to bed. As soon as she could speak, she raged that Graciosa had arranged the accident to get rid of her. Unless the King punished the Princess, she would go home and enjoy her riches alone.
        - id: ch02-b19
          speaker: narrator
          text: The King was terrified of losing those casks of treasure. He hurried to soothe Grumbly and gave her permission to punish Graciosa however she liked.
        - id: ch02-b20
          speaker: narrator
          text: Grumbly summoned the Princess at once. Graciosa turned pale and trembled when the message came, because she knew it promised nothing pleasant. She looked everywhere for Percinet, but he was nowhere to be found, and she had no choice but to obey. She had barely crossed the threshold of Grumbly's room when four waiting women seized her. They were so tall, strong, and cruel-looking that Graciosa shuddered. Her fear grew worse when they armed themselves with great bundles of rods, and Grumbly called from the bed for them to beat the Princess without mercy.
        - id: ch02-b21
          speaker: narrator
          text: Graciosa longed for Percinet to know what was happening. The beating began, and to her great relief, every rod changed into a bundle of peacock feathers. The women struck until their arms were too tired to rise, but Graciosa was not hurt at all. Grumbly believed she must be black and blue, so when they released her, the Princess pretended to be in terrible pain.
        - id: ch02-b22
          speaker: narrator
          text: Back in her own room, Graciosa told her nurse the whole story. The nurse listened and then left her alone. When the Princess turned around, Percinet was suddenly standing beside her. She thanked him warmly for saving her in such a clever way. Together they laughed and made merry over the trick played on Grumbly and her exhausted waiting women. Percinet warned her that it would be wise to continue pretending she was ill for several days. He promised that whenever she needed him, he would come to her aid. Then he disappeared as suddenly as he had arrived.
    - id: ch03
      title: The Tournament and the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Grumbly was so delighted to hear that Graciosa was ill that her own injuries healed twice as quickly. The wedding was celebrated with great magnificence. The King knew his new Queen loved nothing more than being called beautiful. He ordered an artist to paint her portrait, then announced a tournament. His bravest knights would defend the claim that Grumbly was the most beautiful Princess in the world.
        - id: ch03-b02
          speaker: narrator
          text: Knights came from far and wide to challenge the King's champions. The hideous Queen sat in great state on a balcony hung with cloth of gold, watching every contest. Graciosa had to stand behind her. The Princess's beauty shone so clearly there that the combatants could hardly take their eyes off her. Grumbly was vain enough to believe all those admiring glances were meant for herself. The King's knights were defending a very bad cause, but they fought so bravely that they won one combat after another.
        - id: ch03-b03
          speaker: narrator
          text: When nearly all the strangers had been defeated, an unknown young knight rode forward. He carried a portrait inside a box covered with diamonds. He declared that he would fight them all to prove that the Queen was the ugliest creature in the world, while the Princess in his portrait was the most beautiful.
        - id: ch03-b04
          speaker: narrator
          text: One after another, the King's knights faced him, and one after another, he defeated them. At last he opened the box, saying its picture would console the losers. Everyone recognized Graciosa. The unknown knight saluted her gracefully and rode away without giving his name. Graciosa had no trouble guessing he was Percinet.
        - id: ch03-b05
          speaker: narrator
          text: The Queen was so furious that for a moment she could not speak. Then her voice returned, and she poured reproaches over Graciosa.
        - id: ch03-b06
          speaker: queen_grumbly
          text: How dare you compete with me for the prize of beauty and humiliate my knights! I will not endure it, you proud Princess. I will have my revenge.
          emotion: angry
        - id: ch03-b07
          speaker: graciosa
          text: Madam, I promise I had nothing to do with this. I am perfectly willing for everyone to declare you the Queen of Beauty.
        - id: ch03-b08
          speaker: queen_grumbly
          text: So you think you can mock me, you painted little popinjay? My turn will come soon enough!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: The King quickly heard what had happened and learned that Graciosa feared the angry Queen. He refused to protect his daughter.
        - id: ch03-b10
          speaker: king
          text: The Queen may do as she pleases. Graciosa belongs to her.
        - id: ch03-b11
          speaker: narrator
          text: Grumbly waited impatiently for night to fall. Then she ordered her carriage and had the unwilling Princess forced inside. Away they drove, never stopping until they reached a vast forest a hundred leagues from the palace. The place was terribly gloomy. Lions, tigers, bears, and wolves prowled among its trees, and no traveler dared pass through it even in broad daylight. There, in the middle of the black night, Grumbly set the unhappy Princess down. Graciosa wept and begged not to be abandoned, but the carriages drove away and left her alone.
        - id: ch03-b12
          speaker: narrator
          text: At first Graciosa stood frozen with bewilderment. The last sound of the carriages faded away. Then she ran without knowing where she was going. She struck trees, stumbled over stones, and expected at every moment that a lion would devour her. When she could go no farther, she sank to the ground and wept.
        - id: ch03-b13
          speaker: graciosa
          text: Percinet, where are you? Have you forgotten me completely?
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: The words had hardly left her mouth when a glow filled the forest. Every tree gave off a gentle radiance, brighter than moonlight and softer than day. At the far end of a long avenue, a palace of clear crystal blazed like the sun. A small sound behind Graciosa made her turn with a start. Percinet was standing there.
        - id: ch03-b15
          speaker: percinet
          text: Did I frighten you, my Princess? I have come to welcome you to our fairy palace. My mother the Queen is ready to love you as dearly as I do.
        - id: ch03-b16
          speaker: narrator
          text: Graciosa joyfully climbed beside Percinet into a little sledge. Two stags drew it, bounding along so swiftly that they soon reached the wonderful palace. The Fairy Queen welcomed Graciosa with the greatest kindness, and a splendid feast was served at once. The Princess had escaped the dark forest and all its terrors. She had found Percinet again. Relief made her very hungry and very merry, and everyone at the table shared her happiness.
        - id: ch03-b17
          speaker: narrator
          text: After supper they entered another lovely room. Pictures covered its crystal walls. To Graciosa's amazement, they showed her whole history, right up to the moment when Percinet found her in the forest.
        - id: ch03-b18
          speaker: graciosa
          text: Your painters must work very quickly. Look, they have already painted the last thing that happened!
          emotion: surprised
        - id: ch03-b19
          speaker: percinet
          text: They must work quickly. I will not allow anything that happens to you to be forgotten.
        - id: ch03-b20
          speaker: narrator
          text: When Graciosa grew sleepy, twenty-four charming maidens led her to the prettiest bedroom she had ever seen. They settled her into bed and sang with such sweetness that her dreams filled with mermaids and cool waves upon the sea. She dreamed of wandering through hidden caverns with Percinet beside her.
        - id: ch03-b21
          speaker: narrator
          text: Yet her first thought on waking was that she could not stay. However delightful the fairy palace might be, she must return to her father. The twenty-four maidens dressed her in a beautiful robe sent by the Fairy Queen. Then Percinet came to see her, and she told him what she had decided.
        - id: ch03-b22
          speaker: narrator
          text: Percinet was bitterly disappointed by her decision. He begged her to think again about all the misery the wicked Queen would cause her. If Graciosa would only marry him, the entire fairy palace would belong to her, and his one thought would always be how to please her. He argued and pleaded, but nothing he said could change her mind about returning. At last he persuaded her to remain for eight more days. Those days were so full of pleasures and amusements that they seemed to pass in only a few hours.
        - id: ch03-b23
          speaker: narrator
          text: On the final day, Graciosa confessed that she had often wondered what was happening at her father's palace. She asked Percinet to discover what reason the Queen had given for her disappearance. He first offered to send a courier.
        - id: ch03-b24
          speaker: graciosa
          text: Isn't there some faster way to learn the truth?
        - id: ch03-b25
          speaker: percinet
          text: Very well. You shall watch it yourself.
        - id: ch03-b26
          speaker: narrator
          text: They climbed to the top of a very high tower made entirely of rock crystal. Percinet held Graciosa's hand, told her to put the tip of her little finger into her mouth, and had her look toward the town. At once she saw Grumbly speaking to the King.
        - id: ch03-b27
          speaker: queen_grumbly
          text: That miserable Princess is dead, and no one has lost much by it. I have ordered her burial at once.
        - id: ch03-b28
          speaker: narrator
          text: Graciosa watched the Queen dress up a log of wood as though it were a body and have it buried at once. She saw the old King weeping for his daughter. All through the town, people murmured that Grumbly's cruelty had killed the Princess. They said the Queen ought to have her head cut off for it. The King believed Graciosa was truly dead, and his grief was so great that he could neither eat nor drink.
        - id: ch03-b29
          speaker: graciosa
          text: Percinet, if you love me, take me back at once!
          emotion: sad
        - id: ch03-b30
          speaker: narrator
          text: Percinet did not want her to go, but he had to promise.
        - id: ch03-b31
          speaker: percinet
          text: Perhaps you will not miss me, Princess, because you do not love me enough. But I can see that more than once, you will wish you had never left the fairy palace where we have been so happy.
          emotion: sad
        - id: ch03-b32
          speaker: narrator
          text: Nothing Percinet said persuaded her to remain. Graciosa said farewell to his mother and prepared for the journey. Very unwillingly, Percinet brought out the little sledge drawn by stags, and the Princess took her place beside him. They had traveled barely twenty yards when a tremendous noise burst out behind them. Graciosa turned to look. Before her eyes, the whole crystal palace flew apart into a million bright splinters, like the spray thrown up by a fountain. Then every trace of it vanished.
        - id: ch03-b33
          speaker: graciosa
          text: Percinet, what happened? The palace has disappeared!
          emotion: surprised
        - id: ch03-b34
          speaker: percinet
          text: Yes. My palace is now a thing of the past. You will see it again, but only after you have been buried.
        - id: ch03-b35
          speaker: graciosa
          text: Now you are angry with me. But really, I am the one who deserves your pity.
    - id: ch04
      title: The Impossible Tasks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As they neared the palace, Percinet made the sledge and both its passengers invisible. Graciosa slipped inside unseen and ran to the great hall, where the King sat alone. Her sudden appearance startled him. She told him that Grumbly had abandoned her in the forest and buried a log in her place. Unsure what to believe, the King ordered the grave opened. Just as Graciosa had said, they found the log.
        - id: ch04-b02
          speaker: narrator
          text: The King embraced his daughter and invited her to supper. For a little while, they were perfectly happy. Then someone told Grumbly that Graciosa had returned and was eating with the King. The Queen stormed into the room. The poor old King trembled before her.
        - id: ch04-b03
          speaker: narrator
          text: Grumbly insisted that the girl was not Graciosa but a wicked impostor. If the King did not surrender her at once, the Queen would return to her castle and never see him again. He could find no answer and seemed almost to believe that his own daughter was false.
        - id: ch04-b04
          speaker: narrator
          text: Triumphant, Grumbly called her waiting women. They dragged the unhappy Princess away and shut her in a garret. First they took every jewel she wore and removed the beautiful robe the Fairy Queen had given her. In its place they gave her a rough cotton dress, wooden shoes, and a small cloth cap. There was no proper bed in the room. Graciosa had only a little straw in one corner to sleep on, and they allowed her only a tiny piece of black bread to eat.
        - id: ch04-b05
          speaker: narrator
          text: Now Graciosa truly regretted leaving the fairy palace. She might have called Percinet, but she was certain he still resented her departure. She did not think she had any right to expect his help.
        - id: ch04-b06
          speaker: narrator
          text: Meanwhile, Grumbly summoned an old Fairy as malicious as herself.
        - id: ch04-b07
          speaker: queen_grumbly
          text: Find a task that this fine Princess cannot possibly finish. I mean to punish her. If she fails an order, she cannot accuse me of being unfair.
        - id: ch04-b08
          speaker: narrator
          text: The old Fairy promised to think and return the next day. When she came back, she carried a skein of thread three times her own size. The thread was fine enough to break in a breath of air, and so badly tangled that no beginning or end could be found.
        - id: ch04-b09
          speaker: queen_grumbly
          text: See this skein? Put your clumsy fingers to work. It must be untangled by sunset, and if you break even one thread, you will be sorry.
        - id: ch04-b10
          speaker: narrator
          text: Grumbly left Graciosa alone, closing the door behind her and locking it with three different keys. The Princess stood in dismay before the dreadful skein. She could not even see where to begin. Each time she turned the tangled mass over to search for an end, a thousand of the delicate threads seemed to snap beneath her fingers, yet she could not free a single one. At last, overwhelmed by the impossible task, she flung the whole skein into the middle of the floor.
        - id: ch04-b11
          speaker: graciosa
          text: Percinet, this horrible skein will be the death of me. Please forgive me and help me once more!
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: Percinet came in at once, as easily as if all three keys belonged to him.
        - id: ch04-b13
          speaker: percinet
          text: Here I am, Princess, still ready to serve you, though you have not been very kind to me.
        - id: ch04-b14
          speaker: narrator
          text: He brushed the skein with his wand. Every broken thread joined itself together, and the whole tangled mass wound itself neatly into a ball. Then he asked whether Graciosa needed anything else, and whether she would ever want him simply for himself.
        - id: ch04-b15
          speaker: graciosa
          text: Please do not be upset with me, Percinet. I am unhappy enough already.
          emotion: sad
        - id: ch04-b16
          speaker: percinet
          text: But why stay unhappy, my Princess? Come away with me, and we can be happy together from morning till night.
        - id: ch04-b17
          speaker: graciosa
          text: What if you grow tired of me?
        - id: ch04-b18
          speaker: narrator
          text: Her lack of trust hurt Percinet so deeply that he left without another word.
        - id: ch04-b19
          speaker: narrator
          text: Grumbly was so eager to punish Graciosa that she could hardly wait for sunset. She came early with four Fairies. As she put the three keys into the locks, she spoke to them.
        - id: ch04-b20
          speaker: queen_grumbly
          text: I wager the lazy minx has done nothing. She would rather sit with folded hands and keep them white.
        - id: ch04-b21
          speaker: narrator
          text: The door opened, and Graciosa immediately presented the thread wound into a ball in perfect order. Grumbly could not find one genuine fault with the work. Rather than admit defeat, she pretended to discover that the thread had become dirty. For this imaginary offense, she struck Graciosa once on each cheek. The blows were so hard that the Princess's delicate white and pink skin turned green and yellow. Then Grumbly ordered her locked in the garret once more.
        - id: ch04-b22
          speaker: narrator
          text: The Queen furiously scolded the old Fairy.
        - id: ch04-b23
          speaker: queen_grumbly
          text: Do not make that mistake again. Bring me something she truly cannot do.
          emotion: angry
        - id: ch04-b24
          speaker: narrator
          text: The next day the Fairy arrived with a huge barrel packed with the feathers of every sort of bird. There were feathers from nightingales, canaries, goldfinches, linnets, tomtits, parrots, owls, sparrows, doves, ostriches, bustards, peacocks, larks, and partridges, along with every other bird one could imagine. All of them had been stirred into such confusion that even the birds themselves could not have chosen their own feathers from the heap.
        - id: ch04-b25
          speaker: old_fairy
          text: Here is a task that will demand every bit of your prisoner's skill and patience. Order her to sort each kind of feather into its own pile. Only a fairy could manage it.
        - id: ch04-b26
          speaker: narrator
          text: The thought of Graciosa's despair delighted Grumbly. With the same threats as before, she locked the Princess in with the barrel and ordered her to finish before sunset. Graciosa began at once, but after fewer than twelve feathers, she saw that telling them apart was impossible.
        - id: ch04-b27
          speaker: graciosa
          text: The Queen wants to kill me. If I must die, then I must. I will not call Percinet again. If he truly loved me, he would come without waiting to be asked.
          emotion: sad
        - id: ch04-b28
          speaker: percinet
          text: I am here, my Graciosa! How can you still doubt that I love you with all my heart?
        - id: ch04-b29
          speaker: narrator
          text: He sprang out of the barrel where he had been hiding. Three taps of his wand sent every feather swirling into the air. They settled around the room in neat, separate heaps.
        - id: ch04-b30
          speaker: graciosa
          text: Percinet, what would I ever do without you?
        - id: ch04-b31
          speaker: narrator
          text: Still, Graciosa could not decide to leave her father's kingdom forever. She asked for more time, and Percinet went away disappointed again. At sunset, Grumbly was amazed and enraged to find the sorting finished. She complained that the piles were arranged badly, then had Graciosa beaten and returned to the garret.
        - id: ch04-b32
          speaker: narrator
          text: Once more, the Queen summoned the old Fairy and scolded her until she was thoroughly frightened. The Fairy promised to go home and devise a task more terrible than either of the others.
    - id: ch05
      title: The Forbidden Box
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Three days later, the old Fairy returned carrying a box.
        - id: ch05-b02
          speaker: old_fairy
          text: Make your slave carry this wherever you choose, but forbid her to open it. She will never resist, and then you will have the result you want.
        - id: ch05-b03
          speaker: narrator
          text: The Queen called Graciosa before her.
        - id: ch05-b04
          speaker: queen_grumbly
          text: Take this box to my castle and put it on the table in my room. If you look inside it, you will die.
        - id: ch05-b05
          speaker: narrator
          text: Graciosa set out in her cloth cap, wooden shoes, and old cotton dress. Even in those poor clothes, she was so beautiful that everyone she passed wondered who she could be. Before she had gone far, the hot sun and the heavy box exhausted her. She stopped in the shade of a little wood beside a green meadow, holding the box carefully on her lap.
        - id: ch05-b06
          speaker: narrator
          text: Suddenly she felt an overwhelming desire to open it.
        - id: ch05-b07
          speaker: graciosa
          text: What harm could it do? I would not take anything. I would only look inside.
        - id: ch05-b08
          speaker: narrator
          text: Without another thought, she lifted the lid. Swarms of tiny men and women rushed out, none of them taller than her finger. They scattered in every direction across the meadow. Some sang, some danced, and others began the merriest little games. At first Graciosa forgot her danger. She watched them with delight and found their play wonderfully amusing.
        - id: ch05-b09
          speaker: narrator
          text: Once she had rested and wanted to continue her journey, however, Graciosa discovered that nothing would make the little people return. If she chased them across the meadow, the whole swarm fled into the wood. If she pursued them among the trees, they dodged around the trunks and hid behind tiny sprigs of moss. Then peals of elfin laughter rang out, and they scampered straight back into the meadow. Graciosa ran after them until she was worn out. At last, terrified by what she had done, she sat down and cried.
        - id: ch05-b10
          speaker: graciosa
          text: This is my own fault. Percinet, if you can still care for such a foolish Princess, please help me again.
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: Percinet immediately appeared before her.
        - id: ch05-b12
          speaker: percinet
          text: Princess, I fear you would never think of me at all if that wicked Queen did not torment you.
        - id: ch05-b13
          speaker: graciosa
          text: I would think of you. I am not as ungrateful as you believe. Give me a little more time, and I think I will come to love you very dearly.
        - id: ch05-b14
          speaker: narrator
          text: That answer pleased Percinet. One stroke of his wand forced every wilful little person back into the box. Then he made Graciosa invisible and carried her in his chariot to Grumbly's castle.
        - id: ch05-b15
          speaker: narrator
          text: At the door, Graciosa explained that the Queen had ordered her to put the box in the Queen's own room. The governor laughed heartily.
        - id: ch05-b16
          speaker: governor
          text: No, no, my little shepherdess. That room is no place for you. Wooden shoes have never crossed its floor.
        - id: ch05-b17
          speaker: narrator
          text: Graciosa asked him to write a message telling the Queen that he had refused her entry. The governor did so. She returned to Percinet, who was waiting, and together they started back toward the palace.
        - id: ch05-b18
          speaker: narrator
          text: They set out for the palace together, but anyone could have guessed that they did not choose the shortest road. Graciosa enjoyed Percinet's company so much that the longer journey did not seem long to her at all. Before the two of them parted, she made him a promise. If Grumbly continued to treat her cruelly and attempted one more spiteful trick, Graciosa would finally leave the Queen behind and come to Percinet forever.
        - id: ch05-b19
          speaker: narrator
          text: Grumbly had kept the old Fairy beside her while she waited. As soon as she saw the Princess returning safely, she fell upon the Fairy. She pulled her hair, scratched her face, and truly would have killed her if a fairy could be killed. Graciosa presented the governor's letter and the box. Grumbly did not open either one. She threw them both straight into the fire, then looked at the Princess as though she would gladly have thrown her in after them.
    - id: ch06
      title: Buried and Found
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Instead, the Queen ordered a hole as deep as a well to be dug in her garden and covered with a flat stone. Later she walked near it with Graciosa and all her ladies.
        - id: ch06-b02
          speaker: queen_grumbly
          text: They say a great treasure lies beneath that stone. Let us see whether we can lift it.
        - id: ch06-b03
          speaker: narrator
          text: All the ladies gathered around the stone and began to push and pull. Graciosa joined them, just as the Queen had planned. Together they raised the heavy slab. The instant the opening grew wide enough, Grumbly gave the Princess a sudden push. Graciosa fell all the way to the bottom of the deep hole. Above her, the stone was allowed to crash back into place, closing out the garden and the daylight. She was left there as a prisoner beneath the earth.
        - id: ch06-b04
          speaker: narrator
          text: Graciosa believed she was finally beyond all hope. Surely not even Percinet could find her in the heart of the earth.
        - id: ch06-b05
          speaker: graciosa
          text: This is like being buried alive. Percinet, if only you knew how I suffer because I did not trust you! But how could I be sure you would not be like other men and grow tired of me as soon as you knew I loved you?
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: As she spoke, a small door suddenly opened in the wall. Bright sunshine poured into the dismal well. Graciosa did not hesitate for even an instant. She stepped through the doorway into a lovely garden. Flowers bloomed and fruit grew everywhere she looked. Fountains splashed nearby, and birds sang among the branches overhead.
        - id: ch06-b07
          speaker: narrator
          text: She reached a broad avenue of trees and looked ahead to see where it led. There stood the crystal palace. She could not mistake it. The Fairy Queen and Percinet were already coming to meet her.
        - id: ch06-b08
          speaker: fairy_queen
          text: Princess, do not keep poor Percinet wondering any longer. You cannot imagine how anxious he has been while that miserable Queen held you in her power.
        - id: ch06-b09
          speaker: narrator
          text: Graciosa kissed the Fairy Queen gratefully and promised to follow her wishes in everything. Then she held out her hand to Percinet and smiled.
        - id: ch06-b10
          speaker: graciosa
          text: Do you remember saying I would not see your palace again until I had been buried? Did you know that when it happened, I would tell you I love you with all my heart and will marry you whenever you wish?
          emotion: happy
        - id: ch06-b11
          speaker: narrator
          text: Percinet joyfully took her hand. For fear that Graciosa might change her mind, they held the wedding at once with the greatest splendor.
        - id: ch06-b12
          speaker: narrator
          text: And Graciosa and Percinet lived happily ever after.
