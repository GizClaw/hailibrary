audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 软弱贪财，受人逼迫时慌乱急躁
        timbre: 成熟偏厚
        pace: 适中
        pitch: 中低
    graciosa:
      display_name: 格拉西奥萨
      tts:
        delivery: 年轻聪慧，温柔中带着谨慎与坚韧
        timbre: 清澈明亮
        pace: 适中
        pitch: 中高
    grumbly:
      display_name: 咕哝王后
      tts:
        delivery: 骄横刻薄，嫉妒时尖利暴躁
        timbre: 粗哑尖刻
        pace: 稍快
        pitch: 中高
    nurse:
      display_name: 奶妈
      tts:
        delivery: 体贴稳重，劝慰时耐心而务实
        timbre: 柔和温厚
        pace: 从容
        pitch: 中等
    percinet:
      display_name: 佩西内
      tts:
        delivery: 深情诚恳，施展仙术时从容自信
        timbre: 年轻温润
        pace: 适中
        pitch: 中等
    fairy_queen:
      display_name: 仙女王后
      tts:
        delivery: 高贵慈爱，说话亲切而笃定
        timbre: 明亮柔和
        pace: 从容
        pitch: 中等
    old_fairy:
      display_name: 老仙女
      tts:
        delivery: 阴险冷淡，献计时得意而刻薄
        timbre: 苍老干涩
        pace: 稍慢
        pitch: 中高
    governor:
      display_name: 城堡总管
      tts:
        delivery: 自负势利，拒绝来客时带着嘲笑
        timbre: 平实偏硬
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 贪财的婚约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后只有一个女儿。小公主姿态优雅，容貌美丽，又聪明伶俐，大家便叫她格拉西奥萨。王后爱她爱得不得了，满心满眼都是这个孩子。每天，公主都有一件漂亮的新衣裳，不是金锦缎做的，就是绸缎或天鹅绒做的。她什么时候饿了，面前就会摆上一碗碗糖果，外加至少二十罐果酱。人人都说，她是世上最幸福的公主。
        - id: ch01-b02
          speaker: narrator
          text: 宫里还住着一位富有的老公爵夫人，名叫咕哝。她丑得难以形容。头发红得像火，只有一只眼睛，偏偏那只眼睛也不好看。她的脸宽得像满月，嘴巴又大得惊人，谁见了都担心会被她一口吞掉。好在她一颗牙也没有。她脾气和模样同样可怕，最恨别人夸格拉西奥萨美丽可爱。后来，她索性搬回附近自己的城堡。可谁去看她时若不小心提到公主，她还是会大发雷霆。
        - id: ch01-b03
          speaker: grumbly
          text: 格拉西奥萨根本不漂亮！我只用一根小指头，就能把她从头到脚都比下去。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 不久，王后病倒去世了。格拉西奥萨悲痛万分，国王也陷进深深的忧伤，整整一年把自己关在宫里。御医们怕他这样下去会生病，便下令叫他出去活动，找些乐子。宫里安排了一场狩猎，可天气太热，国王没过多久便累了。他看见路旁有一座城堡，决定下马进去歇息。那里恰好就是咕哝公爵夫人的家。
        - id: ch01-b05
          speaker: narrator
          text: 公爵夫人听说国王来了，亲自出门迎接。她说整座城堡里就数地窖最凉快，陛下若肯屈尊，不妨到下面坐坐。两人一同下去，国王看见大约两百只巨大的酒桶并排摆放，便忍不住问她，这样惊人的藏酒是不是全供她一人享用。
        - id: ch01-b06
          speaker: grumbly
          text: 是的，陛下，全是我的。不过我很愿意请您尝尝。加那利酒、圣朱利安红酒、香槟、埃米塔日白葡萄酒、葡萄干酒和苹果酒，您想喝哪一种？
        - id: ch01-b07
          speaker: king
          text: 既然你这样盛情，我就选最喜欢的香槟吧。
        - id: ch01-b08
          speaker: narrator
          text: 公爵夫人拿起一把小锤，在第一只酒桶上咚咚敲了两下。桶里流出的不是国王想喝的香槟，而是至少一千枚克朗金币。金灿灿的钱币落了一地，国王看得眼睛都直了。
        - id: ch01-b09
          speaker: grumbly
          text: 咦，这是怎么回事？
        - id: ch01-b10
          speaker: narrator
          text: 她笑着又敲第二只桶，里面滚出足足一蒲式耳金币。她脸上的笑意更浓了，嘴上却还说自己完全不明白。接着，她走到第三只桶前，咚，咚，又敲两下。钻石和珍珠顿时像流水一样奔涌而出，一直铺满了地面。
        - id: ch01-b11
          speaker: grumbly
          text: 这可真奇怪。一定有人偷走我的好酒，把这些破烂塞了进来。
        - id: ch01-b12
          speaker: king
          text: 破烂？这些东西足够买下十个王国了！
          emotion: surprised
        - id: ch01-b13
          speaker: grumbly
          text: 实话告诉您，每只桶里都是黄金珠宝。您若娶我，这些全归您。
        - id: ch01-b14
          speaker: narrator
          text: 国王最爱的就是钱，听到这句话，立刻喜出望外。
        - id: ch01-b15
          speaker: king
          text: 我当然娶你！只要你愿意，明天就办婚礼。
          emotion: happy
        - id: ch01-b16
          speaker: grumbly
          text: 我有一个条件。您的女儿从此完全归我管，我想怎样处置她都可以。
        - id: ch01-b17
          speaker: king
          text: 没问题，全都依你。我们握手定下这桩交易吧。
        - id: ch01-b18
          speaker: narrator
          text: 两人就这样握手定下婚约，一同离开藏宝的地窖。公爵夫人把沉重的门锁好，又亲手将钥匙交给国王。国王带着钥匙回到自己的王宫。格拉西奥萨一看见父亲回来，马上跑出去迎接，还问他这一天打猎有没有收获。
        - id: ch01-b19
          speaker: king
          text: 我捉到了一只鸽子。
        - id: ch01-b20
          speaker: graciosa
          text: 那就送给我吧，我一定把它照料得好好的。
        - id: ch01-b21
          speaker: king
          text: 恐怕不行。说得明白一点，我遇见了咕哝公爵夫人，已经答应娶她。
        - id: ch01-b22
          speaker: graciosa
          text: 您说她是鸽子？依我看，她明明是一只尖叫的猫头鹰！
          emotion: surprised
        - id: ch01-b23
          speaker: king
          text: 住口！以后对她规矩些。快去收拾好，我要带你拜访她。
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: 公主伤心地回到房间。奶妈见她流泪，便问她出了什么事。
        - id: ch01-b25
          speaker: graciosa
          text: 国王要再婚，选中的偏偏是我的仇人，那个丑陋的咕哝公爵夫人。谁遇上这种事会不难过呢？
          emotion: sad
        - id: ch01-b26
          speaker: nurse
          text: 你毕竟是一位公主。无论出了什么事，都该尽力应对，给别人作个好榜样。答应我，别让她看出你有多讨厌她。
          emotion: calm
        - id: ch01-b27
          speaker: narrator
          text: 格拉西奥萨起初怎么也不肯答应，奶妈耐心讲了许多道理，她才同意对继母和颜悦色。奶妈替她穿上淡绿色的金锦缎长袍，又把那一头长长的金发细细梳开。柔亮的头发披散在身后，像一袭金色斗篷。最后，她戴上玫瑰与茉莉编成的花冠，花间还点缀着祖母绿叶片。装扮完毕，世上仿佛再没有谁比她更美，眉间却仍藏不住忧伤。
        - id: ch01-b28
          speaker: narrator
          text: 咕哝也忙着装扮。她叫人把一只鞋跟垫得比另一只高上一英寸，好让自己走路不那么跛。失去的那只眼睛里，她装上一枚做工精巧的玻璃眼珠，又把火红的头发染黑，在脸上涂满脂粉。她穿起蓝色里衬的淡紫绸袍，下面配一条缀着紫罗兰色缎带的黄衬裙。听说王后总要骑马进入新领地，她还特意叫人备了一匹坐骑。
    - id: ch02
      title: 绿衣侍从与失控的骏马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 等国王启程时，格拉西奥萨独自走进花园旁的小树林，在长满青苔的坡地上坐下。她越想越伤心，哭得忘了回宫。忽然，一位英俊的年轻人来到面前。他身穿绿衣，手里捧着缀有白羽毛的帽子，见公主望来，便单膝跪下。
        - id: ch02-b02
          speaker: percinet
          text: 公主，国王正在等您。
        - id: ch02-b03
          speaker: narrator
          text: 格拉西奥萨不记得见过这位迷人的侍从，既惊讶，又暗自欢喜。她猜他来自公爵夫人的城堡。
        - id: ch02-b04
          speaker: graciosa
          text: 你在国王身边做侍从多久了？
        - id: ch02-b05
          speaker: percinet
          text: 我不侍奉国王，夫人。我侍奉的是您。
        - id: ch02-b06
          speaker: graciosa
          text: 侍奉我？那我以前为什么从没见过你？
        - id: ch02-b07
          speaker: percinet
          text: 从前我不敢来见您。如今国王的婚事会让您身陷危险，我必须告诉您，我早已深深爱上了您。我盼着终有一天能得到您的心。我是佩西内王子，您也许听说过我的财富。我还会仙术。只要您允许我继续扮成侍从陪在身边，我会帮您渡过所有难关。
        - id: ch02-b08
          speaker: graciosa
          text: 原来你就是佩西内！我常听人说起你，也一直想见你。你若肯做我的朋友，我就不再害怕那个恶毒的老公爵夫人了。
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: 两人一同回宫。佩西内早已为公主带来一匹漂亮而活泼的骏马，还亲自替她牵着缰绳。这样一来，他便能一次又一次回头望她，当然也没有错过任何机会。公主实在太美，能看着她本身就是一种快乐。咕哝的马牵到旁边以后，简直像一匹拉车的老马。两副鞍辔更是没法相比，公主的马鞍和缰绳满是钻石，闪闪发亮。国王心里装着太多别的事，没有留意这些。满朝的人却都在赞叹公主和绿衣侍从。那年轻人的容貌与气度，比宫里所有人加起来还要出众。
        - id: ch02-b10
          speaker: narrator
          text: 他们见到咕哝时，她正坐在敞篷马车里，怎么也摆不出尊贵的样子。国王和公主向她行礼，仆人牵来她的马。可她看见格拉西奥萨的坐骑，立刻尖声叫嚷。
        - id: ch02-b11
          speaker: grumbly
          text: 那个丫头凭什么骑得比我好？要是这样，我现在就回城堡！当了王后还受人怠慢，有什么意思？
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 国王听了，马上命格拉西奥萨下马，还叫她亲口请求公爵夫人赏脸，骑上自己的坐骑。公主一句怨言也没有，默默照办。咕哝既不看她，也不道谢，只顾笨拙地爬上骏马。她窝在华丽的马鞍上，看起来活像一大包衣服。整整八名军官只得围在旁边扶住她，以免她一头摔下来。可她仍不满足，还在不停嘟囔，众人只好问她究竟又有什么不称心。
        - id: ch02-b13
          speaker: grumbly
          text: 让那个绿衣侍从来牵马。刚才他怎样服侍格拉西奥萨，现在就该怎样服侍我。
        - id: ch02-b14
          speaker: narrator
          text: 国王照旧依从她，下令让绿衣侍从过来牵马。佩西内与公主互望一眼，谁也没有说话。他接过缰绳，队伍便浩浩荡荡地出发了。咕哝坐在马上神气十足，得意得简直不肯再和格拉西奥萨交换位置。谁知就在所有人最没有防备时，那匹漂亮的骏马忽然跳起来，后腿直立，又朝四面乱蹬。最后，它撒开四蹄狂奔起来，快得谁也拦不住。
        - id: ch02-b15
          speaker: narrator
          text: 咕哝起先还死死抓着马鞍，很快便被甩进乱石与荆棘，摔成软绵绵的一团。众人找到她时，只能像收拾一只碎玻璃杯似的，把她还剩下的部分一一捡起来。她的帽子飞到这边，鞋子落在那边，脸被荆棘抓破，华丽的衣裳裹满泥巴。世上再没有哪位新娘落到过这样凄惨狼狈的境地。
        - id: ch02-b16
          speaker: narrator
          text: 众人把她抬回王宫，送上床休养。她刚缓过气，能够开口说话，就又骂又嚷，一口咬定整件事都是格拉西奥萨的错。她说公主存心安排这场灾祸，就是想除掉自己。国王若不严惩公主，她便立刻回到自己的城堡，从此独自享用那些财富。国王一听便怕得要命。他舍不得地窖里那一桶桶黄金珠宝，连忙安抚咕哝，答应任她处置格拉西奥萨。
        - id: ch02-b17
          speaker: narrator
          text: 公主一听传召便脸色发白，浑身发抖，因为她知道绝不会有什么好事。她朝四下寻找佩西内，却哪里也不见他的踪影，只好走进咕哝的房间。刚跨过门槛，四名高大、强壮又凶狠的侍女便一拥而上，将她牢牢抓住。她们拿起一大捆一大捆的鞭条，咕哝则躺在床上，命她们毫不留情地打。格拉西奥萨看着那些可怕的女人，心里只盼佩西内能知道这一切，马上赶来相救。
        - id: ch02-b18
          speaker: narrator
          text: 鞭打刚开始，格拉西奥萨便惊喜地发现，鞭条已经全变成了孔雀羽毛。侍女们还在拼命抽打，一直累到两条胳膊垂在身旁，再也抬不起来，公主却一点儿也没受伤。咕哝躺在床上看着，还以为公主早已遍体鳞伤。格拉西奥萨获释以后，便装出伤势严重的样子，回到自己房里，把经过全告诉奶妈。奶妈离开以后，她一回头，佩西内已经站在身旁。
        - id: ch02-b19
          speaker: narrator
          text: 公主感谢他巧妙相救，两人想起咕哝与侍女受骗的模样，一起笑个不停。佩西内劝她再装病几天，答应只要她需要便会出现，随后忽然消失。
        - id: ch02-b20
          speaker: narrator
          text: 咕哝认定格拉西奥萨真被打病了，心里高兴得不得了，就连自己的伤也比平常快了一倍痊愈。婚礼随后办得无比盛大。国王知道，新王后最喜欢听别人称赞她美丽，便命画师给她绘制肖像，还特意举办一场比武大会。他要宫中最勇敢的骑士迎战所有来客，向全天下坚持一件事：咕哝才是世上最美丽的公主。
        - id: ch02-b21
          speaker: narrator
          text: 四面八方的骑士赶来接受挑战。丑陋的王后盛装坐在一座悬挂金锦的露台上观看比试，格拉西奥萨被迫站在她身后。公主的美貌太耀眼，场上的人都忍不住盯着她看。咕哝自负得昏了头，却以为那些倾慕的目光全是给自己的。何况国王的骑士虽然为一个糟透的理由而战，却个个英勇非凡，每场比试竟然都能取胜。
        - id: ch02-b22
          speaker: narrator
          text: 等外来的骑士几乎全被打败，一位身份不明的年轻骑士才来到赛场。他随身带着一幅肖像，画像藏在一只镶满钻石的盒子里。他当众宣称，自己愿意独自迎战这里的所有骑士。他要证明，王后才是世上最丑陋的生物，而他所带画像中的公主，才是世上最美的人。
        - id: ch02-b23
          speaker: narrator
          text: 骑士们一个接一个上前挑战，又一个接一个败在年轻人手下。等再也没有人能战胜他，他才打开那只镶着钻石的盒子。他说，为了安慰所有落败的人，愿意让大家看看自己心中的美人之后。画像一露出来，在场的每个人都认出，那正是格拉西奥萨公主。陌生骑士朝她优雅地行了一礼，随即退出赛场，始终没有向任何人说出姓名。格拉西奥萨当然不用费心去猜，她知道那就是佩西内。
        - id: ch02-b24
          speaker: narrator
          text: 咕哝气得一时说不出话，找回声音以后，立刻把公主骂得狗血淋头。
        - id: ch02-b25
          speaker: grumbly
          text: 你敢跟我争美貌的桂冠，还让我的骑士受辱？我绝不会忍下去。你等着，我一定报仇！
          emotion: angry
        - id: ch02-b26
          speaker: graciosa
          text: 夫人，这件事真的与我无关。我也愿意让大家称您为美人之后。
        - id: ch02-b27
          speaker: grumbly
          text: 你这个花里胡哨的黄毛丫头，少来取笑我！很快就该轮到我取笑你了。
          emotion: angry
        - id: ch02-b28
          speaker: narrator
          text: 有人把经过告诉国王，也说公主害怕极了。国王却毫不在意。
        - id: ch02-b29
          speaker: king
          text: 随王后高兴吧。格拉西奥萨归她处置。
    - id: ch03
      title: 水晶宫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 邪恶的王后焦急地等到天黑，立刻命人备车，把百般不愿的格拉西奥萨强塞进去。马车一路飞驰，中间一次也没有停下，直到离王宫一百法里的大森林才停住。那里阴森黑暗，到处都是狮子、老虎、熊和狼，就算在白天也没人敢穿行。王后不管公主怎样哭泣哀求，还是把她独自丢在漆黑的森林中央，驾车离去。
        - id: ch03-b02
          speaker: narrator
          text: 公主起初完全不知该怎么办，只能呆立原地。等最后一点远去的车声也从黑暗中消失，她才慌乱地四处奔跑。她没有方向，一会儿撞上树干，一会儿又被石头绊倒。森林里每一阵响动都让她以为狮子已经扑来，要把自己吃掉。没过多久，她累得一步也走不动，只能扑倒在地，伤心地哭喊。
        - id: ch03-b03
          speaker: graciosa
          text: 佩西内，你在哪里？难道你真的把我忘了吗？
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: 整座森林忽然亮了起来。每棵树都泛着柔光，比月光亮，又比日光温柔。长长的林荫道尽头，一座透明的水晶宫像太阳般灿烂。背后传来一声轻响，公主吃惊地回过头，佩西内就站在那里。
        - id: ch03-b05
          speaker: percinet
          text: 我的公主，我吓着您了吗？母后请我来欢迎您。她已经准备好像我一样爱您了。
        - id: ch03-b06
          speaker: narrator
          text: 格拉西奥萨欢喜地跟他登上小雪橇。两头雄鹿跳跃着向前飞驰，很快便把他们送进仙宫。仙女王后无比亲切地迎接公主，马上命人摆下盛宴。格拉西奥萨重新找到佩西内，又逃离了森林里的一切恐怖，胃口和心情都好极了。一席人说说笑笑，过得十分热闹。晚饭以后，他们来到另一间美丽的屋子。水晶墙上挂满公主一生的图画，连佩西内刚在森林找到她的那一刻也已经画好。
        - id: ch03-b07
          speaker: graciosa
          text: 你们的画师可真勤快，连刚发生的事情都画出来了。
          emotion: surprised
        - id: ch03-b08
          speaker: percinet
          text: 他们当然得勤快。发生在您身上的事，我一件也不许他们忘记。
        - id: ch03-b09
          speaker: narrator
          text: 公主渐渐困了，二十四位可爱的少女把她送进自己见过的最漂亮的卧房，替她安顿好床铺，又用无比甜美的歌声伴她入睡。格拉西奥萨做了一夜的美梦。梦里有人鱼，有清凉的海浪，也有幽深的岩洞，她和佩西内一起在那些神奇的地方漫游。可第二天醒来，她首先想到的却是，仙宫虽然迷人，自己不能永远留下，还是得回到父亲身边。
        - id: ch03-b10
          speaker: narrator
          text: 二十四位少女给公主穿上仙女王后送来的华美长袍，衬得她比往日更加漂亮。佩西内来见她，听到她的决定，失望得痛苦万分。他求公主再想想，咕哝会让她多么不幸。只要公主嫁给他，整座仙宫都会属于她，他也会把让她快乐当成唯一的心愿。格拉西奥萨仍然坚持回去。无论王子说什么，她都不肯改变主意，只答应多留八天。那八天里充满快乐与消遣，一晃便像几个小时似的过去了。
        - id: ch03-b11
          speaker: narrator
          text: 最后一天，公主惦记着父亲的宫廷，便请佩西内查明咕哝如何解释她的失踪。王子说可以派信使打听。
        - id: ch03-b12
          speaker: graciosa
          text: 难道就没有更快的办法吗？
        - id: ch03-b13
          speaker: percinet
          text: 有。您可以亲眼看看。
        - id: ch03-b14
          speaker: narrator
          text: 他们登上水晶宫最高的塔楼。佩西内握住她的手，让她把小指指尖含在嘴里，再朝城镇望去。她立刻看见咕哝来到国王面前。
        - id: ch03-b15
          speaker: grumbly
          text: 那个可恶的公主死了，反正也没什么损失。我已经叫人马上埋了她。
        - id: ch03-b16
          speaker: narrator
          text: 格拉西奥萨又看见咕哝找来一截木头，给它穿上自己的衣服，再命人当作公主的遗体埋葬。老国王听说女儿死去，哭个不停。百姓们也在到处议论，都说是咕哝用残酷手段杀害了格拉西奥萨，她应该为此被砍掉脑袋。格拉西奥萨见父亲为了自己假死的消息悲痛欲绝，连饭也不吃，连水也不喝，再也坐不住了。
        - id: ch03-b17
          speaker: graciosa
          text: 佩西内，你若爱我，就马上送我回去！
        - id: ch03-b18
          speaker: narrator
          text: 佩西内虽然万分不愿，还是答应放她离开。
        - id: ch03-b19
          speaker: percinet
          text: 公主，您大概不会想念我，因为您还没有那么爱我。我却看得见，将来您不止一次会后悔离开这里。我们在仙宫本来过得多么幸福。
          emotion: sad
        - id: ch03-b20
          speaker: narrator
          text: 公主仍向仙女王后告别，坐上雄鹿雪橇。雪橇刚走二十码，身后便传来震天巨响。她回头一看，水晶宫像喷泉的水花一样炸成百万片，眨眼便消失了。
        - id: ch03-b21
          speaker: graciosa
          text: 佩西内，出了什么事？整座宫殿都不见了！
          emotion: surprised
        - id: ch03-b22
          speaker: percinet
          text: 是的，我的宫殿已经成了过去。您还会见到它，但要等到自己被埋葬以后。
        - id: ch03-b23
          speaker: graciosa
          text: 你现在生我的气了。可说到底，我才是更值得同情的那个人呀。
        - id: ch03-b24
          speaker: narrator
          text: 临近王宫，佩西内让雪橇和两个人一同隐去形迹。格拉西奥萨没有被任何人发现，悄悄进了宫，跑到父亲独坐的大厅。国王见她突然出现，先是吓了一跳。公主把咕哝如何将自己扔进森林，又怎样给一截木头穿衣并将它埋葬的事情全说了。国王不知该相信什么，赶紧命人掘开坟墓，果然看见了那截木头。他这才疼爱地安慰女儿，留下她坐在身边一同吃晚饭，父女俩快活极了。
        - id: ch03-b25
          speaker: narrator
          text: 不知是谁把消息告诉了咕哝，说格拉西奥萨已经回来，此刻还在陪国王用餐。她立刻怒气冲天地闯进大厅。可怜的老国王一看见她，便吓得浑身发抖。咕哝一口咬定，眼前的人根本不是格拉西奥萨，只是一个邪恶的冒牌货。国王若不马上把她交出来，自己便回到城堡，永远不再见他。国王连一句反驳的话也不敢说，最后甚至仿佛真的相信了她。
        - id: ch03-b26
          speaker: narrator
          text: 咕哝得意扬扬地命侍女拖走公主，把她关进一间阁楼。她们拿走所有珠宝和漂亮衣服，只留下一件粗布棉裙、一双木鞋和一顶小布帽。角落里只有一堆稻草，那便是她全部的床铺。每天的食物也少得可怜，只有一丁点黑面包。落到这种凄惨境地，格拉西奥萨终于深深怀念起仙宫。她想呼唤佩西内前来相助，又认定王子还在为她离去而生气，觉得自己没有资格指望他再次出现。
    - id: ch04
      title: 三件不可能的差事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 咕哝召来一位和自己同样恶毒的老仙女。
        - id: ch04-b02
          speaker: grumbly
          text: 给这个漂亮公主想一件绝不可能完成的差事。我要惩罚她，也要让她没法指责我不公平。
        - id: ch04-b03
          speaker: narrator
          text: 老仙女答应回去好好想想，第二天再来。她回来时，带着一绞比自己身体大三倍的丝线。那些线细得一口气就能吹断，又乱得根本找不到开头和末尾。咕哝看了十分满意，马上命人把格拉西奥萨带到面前。
        - id: ch04-b04
          speaker: grumbly
          text: 用你那双笨手把丝线理开。日落以前，我要看到整齐的线球。你若弄断一根，就等着受罚吧。
        - id: ch04-b05
          speaker: narrator
          text: 她出去以后，用三把钥匙锁门。格拉西奥萨望着丝线束手无策。她刚翻动一下，就断了上千根，却连一根线也解不开。最后，她把丝线扔到屋子中央。
        - id: ch04-b06
          speaker: graciosa
          text: 佩西内，这绞丝线会害死我。请你原谅我，再帮我一次吧！
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 佩西内马上走进来，轻松得仿佛三把钥匙都在他手里。
        - id: ch04-b08
          speaker: percinet
          text: 公主，我来了，仍像从前一样听您差遣。不过，您待我实在不算好。
        - id: ch04-b09
          speaker: narrator
          text: 佩西内只用魔杖轻轻抚过那团乱线，所有断开的地方便自动接好。整绞丝线接着自己动了起来，以最奇妙的方式顺顺当当地绕成整齐的线球。王子转向格拉西奥萨，问她是不是还有别的事情需要自己效劳。他也想知道，究竟要等到什么时候，公主才会不为任何灾祸，只因为想念他这个人而呼唤他。
        - id: ch04-b10
          speaker: graciosa
          text: 佩西内，别再责怪我了。我已经够不幸啦。
          emotion: sad
        - id: ch04-b11
          speaker: percinet
          text: 我的公主，您何必留在这里受苦？跟我走吧，我们每天都可以快乐地生活。
        - id: ch04-b12
          speaker: graciosa
          text: 可要是有一天，你厌倦我了呢？
        - id: ch04-b13
          speaker: narrator
          text: 她还是不肯相信他，王子伤心得一句话也没说，转身离开。咕哝急着惩罚公主，只嫌太阳落得太慢。约定时间还没到，她便带着四位仙女来开门。
        - id: ch04-b14
          speaker: grumbly
          text: 我敢说，那个懒丫头什么也没干。她只会抱着手坐着，好让手指保持白嫩。
        - id: ch04-b15
          speaker: narrator
          text: 谁知门一打开，格拉西奥萨便把一个完美无缺的线球递到她面前。咕哝翻来覆去地检查，实在挑不出真正的错处，只好硬说丝线已经被公主弄脏。为了这个凭空捏造的过错，她在公主两边脸颊各打一巴掌，把原本白里透红的皮肤打得一块青、一块黄。发泄完怒气，她又命人把格拉西奥萨送回阁楼，重新锁了起来。
        - id: ch04-b16
          speaker: narrator
          text: 咕哝再次召来老仙女，劈头盖脸地骂了一顿，命她下回想出真正不可能完成的任务。第二天，老仙女带来一只大得惊人的木桶。里面混着夜莺、金丝雀、金翅雀、朱顶雀、山雀、鹦鹉、猫头鹰、麻雀、鸽子、鸵鸟、大鸨、孔雀、云雀、鹧鸪，还有所有想得到的鸟的羽毛。它们乱成一团，就算让那些鸟儿自己来找，也分不清哪根属于谁。
        - id: ch04-b17
          speaker: old_fairy
          text: 叫你的囚徒把每种鸟的羽毛单独挑出来。她除非是仙女，否则根本做不完。
        - id: ch04-b18
          speaker: narrator
          text: 咕哝一想到这件差事会让公主绝望，便开心得不得了。她派人把格拉西奥萨带来，照旧用可怕的惩罚威胁她，又用三把钥匙把她锁进房里，命她在日落以前把每一种鸟的羽毛分别堆好。格拉西奥萨马上动手，可还没挑出十二根，就发现这些羽毛根本无法分辨。
        - id: ch04-b19
          speaker: graciosa
          text: 王后想杀死我。若我注定要死，也只能接受。我不会再叫佩西内来。他若真的爱我，就该主动出现，不必等我开口。
          emotion: sad
        - id: ch04-b20
          speaker: percinet
          text: 我就在这里，我的格拉西奥萨！你为什么还怀疑我全心全意爱着你？
        - id: ch04-b21
          speaker: narrator
          text: 他从藏身的木桶里跳出来，用魔杖敲了三下。羽毛像云一样飞到空中，又按种类落成一堆堆，整齐地排满房间。
        - id: ch04-b22
          speaker: graciosa
          text: 佩西内，要是没有你，我该怎么办呢？
        - id: ch04-b23
          speaker: narrator
          text: 可她仍不愿永远离开父亲的王国，只求王子再给自己一点时间。佩西内又一次失望而去。日落时，咕哝看见羽毛已经分好，又惊又怒。她硬说那些小堆摆得不好，命人打了公主，再把她锁回阁楼。随后，她把老仙女骂到发抖，老仙女只得答应想出更难的任务。
        - id: ch04-b24
          speaker: narrator
          text: 三天以后，老仙女带着一只盒子回来。
        - id: ch04-b25
          speaker: old_fairy
          text: 叫你的女奴把盒子送去任何地方，但绝不许她打开。她肯定忍不住，到时结果一定让你满意。
        - id: ch04-b26
          speaker: grumbly
          text: 把盒子送到我的城堡，放在我房里的桌上。你若敢偷看里面有什么，我就处死你。
        - id: ch04-b27
          speaker: narrator
          text: 格拉西奥萨戴着布帽，穿着木鞋和旧棉裙上路。就算这副打扮，她仍美得让每个过路人都猜不透她是谁。烈日晒着，盒子又沉，她很快便累了，只好在绿草地旁的小树林里休息。盒子安稳放在膝头，她却忽然无比渴望打开它。
        - id: ch04-b28
          speaker: graciosa
          text: 打开又会怎样呢？我什么也不拿，只看一眼。
        - id: ch04-b29
          speaker: narrator
          text: 她立刻掀开盒盖。一群群只有手指高的男女小人跑出来，散到草地上唱歌、跳舞，玩着最快乐的游戏。起初，格拉西奥萨看得津津有味。可她休息够了，想赶路时，却怎么也抓不回这些小人。她追到草地，他们就逃进树林。她追进树林，他们便绕着树干和青苔躲闪，笑着跑回草地。
        - id: ch04-b30
          speaker: narrator
          text: 公主又累又怕，坐在地上哭了起来。
        - id: ch04-b31
          speaker: graciosa
          text: 都怪我自己。佩西内，你若还肯关心这样鲁莽的公主，请再帮我一次吧。
          emotion: sad
        - id: ch04-b32
          speaker: narrator
          text: 佩西内立刻站到她面前。
        - id: ch04-b33
          speaker: percinet
          text: 公主，要不是那个邪恶的王后，我怕您根本不会想起我。
        - id: ch04-b34
          speaker: graciosa
          text: 我会想起你的。我没有你以为的那么忘恩负义。再等一等吧，我相信自己很快就会深深爱上你。
        - id: ch04-b35
          speaker: narrator
          text: 佩西内听得十分高兴。他只挥动一次魔杖，任性的小人们便再也不能四处躲闪，只得全都回到盒中原来的位置。随后，他施展仙术，让公主隐去身形，又请她登上自己的马车，亲自驾车把她送到咕哝的城堡。
        - id: ch04-b36
          speaker: narrator
          text: 格拉西奥萨在门口说明王后的命令，总管却大笑起来。
        - id: ch04-b37
          speaker: governor
          text: 不成，小牧羊女。那地方可不是你能进去的，从来没有木鞋踏过那里的地板。
        - id: ch04-b38
          speaker: narrator
          text: 公主便请总管写信给王后，说明是他拒绝让她进去。总管照办了。格拉西奥萨拿着信，回到等候自己的佩西内身边，两人一同踏上归途。你大概猜得到，他们当然没有走最短的那条路。可是公主一点儿也不嫌路长。分别以前，她终于答应王子，咕哝若还残忍地对待她，再使出任何恶毒花招，她就离开王后，永远回到佩西内身边。
    - id: ch05
      title: 活埋之后的重逢
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 咕哝见格拉西奥萨归来，立刻扑向一直被她扣在身旁的老仙女。她使劲揪住老仙女的头发，又把她的脸抓出一道道伤痕。要不是仙女根本杀不死，她真会当场要了老仙女的命。公主递上城堡总管的信和那只盒子，咕哝连打开都不肯打开，看也不看便把两样东西扔进火里。她脸上的神情分明还想把公主也一并扔进去。
        - id: ch05-b02
          speaker: narrator
          text: 咕哝并没有马上把公主扔进火里，却想出了更恶毒的办法。她叫人在花园里挖出一个像水井那么深的大坑，又找来一块宽阔的平石，严严实实盖住洞口。所有准备都完成以后，她故意带着格拉西奥萨和一群随行的贵妇到附近散步，最后停在那块石头旁边。
        - id: ch05-b03
          speaker: grumbly
          text: 听说这块石头下面藏着宝物。我们一起试试，看能不能把它抬起来。
        - id: ch05-b04
          speaker: narrator
          text: 众人一同又推又拉，格拉西奥萨也在其中，这正合咕哝的心意。石头刚被抬得足够高，她便猛推公主一把，让她直直跌进坑底，随即命人把沉重的石头重新落回洞口。格拉西奥萨就这样被囚禁在大地深处。她觉得这一次真的走投无路了，埋在这样的地方，就连佩西内也一定找不到她。
        - id: ch05-b05
          speaker: graciosa
          text: 这就像被活埋一样。佩西内，要是你知道我因为不信任你，正受着怎样的折磨就好了！可我怎么能肯定，你不会像别的男人一样，一知道我爱你，就立刻厌倦我呢？
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 她还在说，一扇小门忽然打开，灿烂的阳光一下照进阴暗的深坑。格拉西奥萨片刻也不犹豫，马上穿过门，走进一座美丽花园。四面八方鲜花盛开，果实累累，喷泉哗哗作响，鸟儿在头顶的枝叶间歌唱。她沿着宽阔的林荫道向前，抬头想看看这条路通向哪里，竟发现自己已经来到水晶宫旁。绝不会认错，就是那座宫殿。仙女王后与佩西内正朝她迎面走来。
        - id: ch05-b07
          speaker: fairy_queen
          text: 公主，别再让可怜的佩西内悬着一颗心了。您被那个可恶的王后控制时，他受了多少煎熬，您根本想不到。
        - id: ch05-b08
          speaker: narrator
          text: 格拉西奥萨听完，感激地亲吻仙女王后。她答应从此照王后的话去做，不再让佩西内为自己苦苦等待。随后，她转向一直守在身旁的王子，脸上终于露出毫无疑虑的笑容，向他伸出一只手。
        - id: ch05-b09
          speaker: graciosa
          text: 你还记得吗？你说过，我要等到被埋葬以后，才能再见水晶宫。那时你有没有猜到，等这一天真的到来，我会告诉你，我全心全意地爱你？无论你何时愿意，我都肯嫁给你。
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: 佩西内欢天喜地地握住公主主动伸来的手。为了不让她再有机会改变心意，他们没有耽搁片刻，也不肯再多等哪怕一天，马上就举行了婚礼。整场婚礼从头到尾都以真正称得上最盛大、最辉煌的排场举行，隆重到了极点。从此，格拉西奥萨和佩西内永远幸福地生活在一起。
