audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    jack:
      display_name: 杰克
      tts:
        delivery: 聪明机敏，遇到危险时果断沉着
        timbre: 年轻清亮
        pace: 适中
        pitch: 中等
    father:
      display_name: 杰克的父亲
      tts:
        delivery: 朴实憨厚，遇事常有些慌张
        timbre: 成熟温厚
        pace: 适中
        pitch: 中低
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 坚决直率，说起儿子的前程不容含糊
        timbre: 成熟清晰
        pace: 适中
        pitch: 中等
    weatherbeard:
      display_name: 风云胡子农夫
      tts:
        delivery: 阴沉狡猾，发怒时凶狠逼人
        timbre: 粗哑低沉
        pace: 稍慢
        pitch: 低
    eldest_sister:
      display_name: 林中大姐
      tts:
        delivery: 古怪爽直，得到烟草后格外欢快
        timbre: 苍老干涩
        pace: 缓慢
        pitch: 中低
    second_sister:
      display_name: 水族二姐
      tts:
        delivery: 古怪爽直，说话简短利落
        timbre: 苍老柔和
        pace: 缓慢
        pitch: 中低
    youngest_sister:
      display_name: 飞鸟三姐
      tts:
        delivery: 古怪却热心，吩咐事情时稳当明确
        timbre: 苍老清亮
        pace: 缓慢
        pitch: 中等
    eagle:
      display_name: 鹰
      tts:
        delivery: 可靠警醒，指点逃亡时简洁果断
        timbre: 清越有力
        pace: 适中
        pitch: 中高
    girl:
      display_name: 客店姑娘
      tts:
        delivery: 心软善良，见到受苦的牲口满是怜惜
        timbre: 年轻柔和
        pace: 适中
        pitch: 中高
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧镇定，面对威逼时大胆机变
        timbre: 年轻明亮
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 师傅中的师傅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对夫妻，只生了一个儿子，名叫杰克。母亲觉得孩子已经该出门做学徒、学本领了，便催丈夫带他去找一位师傅。
        - id: ch01-b02
          speaker: mother
          text: 一定要给他找个好去处。我要他学成师傅中的师傅。
        - id: ch01-b03
          speaker: narrator
          text: 她给父子俩装了一袋食物，又放上一卷烟草。父亲带着杰克拜访了许多师傅，可每个人都说，最多只能把孩子教得和自己一样好，更高的本领就没有了。父亲只得回家，把这些回答告诉妻子。母亲听了仍不肯让步，又备好食物和烟草，叫他们重新上路。
        - id: ch01-b04
          speaker: mother
          text: 交给谁都行，可杰克非得成为师傅中的师傅。
        - id: ch01-b05
          speaker: narrator
          text: 父子俩走了很长一段路，踏上一片冰面。迎面来了一辆马车，车上有个人赶着一匹黑马。那人停下来，问他们要去哪里。
        - id: ch01-b06
          speaker: father
          text: 我得替儿子找人学手艺。他母亲出身殷实，一定要让他成为师傅中的师傅。
        - id: ch01-b07
          speaker: weatherbeard
          text: 那可巧了。我正有本事教他，也正想收这样一个徒弟。小子，上车来。
        - id: ch01-b08
          speaker: narrator
          text: 杰克才坐到马车后面，黑马就撒开蹄子，载着师徒两人直冲天空。父亲还站在冰面上，眼看儿子越飞越高，急得放声大喊。
        - id: ch01-b09
          speaker: father
          text: 等等！我还不知道你叫什么，也不知道你住在哪儿呢！
        - id: ch01-b10
          speaker: weatherbeard
          text: 东南西北都是我的家，我叫风云胡子农夫。一年以后再来这里，到时我会告诉你，这孩子合不合我的意。
        - id: ch01-b11
          speaker: narrator
          text: 风云胡子农夫说完，马车再次飞驰，转眼就消失了。父亲回到家，妻子立刻追问儿子的下落。他只能说，天知道孩子去了哪里，他亲眼看着马车飞上了高空。等他讲完经过，妻子发现丈夫既不知道杰克去了哪里，也不知道孩子何时出师，马上又把他打发上路。这次，她照样给他带了一袋食物和一卷烟草，非要他查个明白不可。
    - id: ch02
      title: 三位长鼻子老妇人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 父亲走了许久，进入一片望不到尽头的大森林。他走了一整天，前方始终只有树木。天快黑时，远处终于亮起一片光。他朝着亮光又赶了很久，才来到岩石脚下的一座小屋。屋外站着个老妇人，鼻子长得出奇，竟能用鼻子从井里汲水。
        - id: ch02-b02
          speaker: father
          text: 晚上好，大娘。我能在这里住一夜吗？
        - id: ch02-b03
          speaker: eldest_sister
          text: 一百年没人叫过我大娘了。不过，你不能住下。
        - id: ch02-b04
          speaker: narrator
          text: 父亲取出烟草，点燃一点，请她吸了一口。老妇人顿时快活得跳起舞来，终于答应让他留宿。刚住下不久，父亲便问起风云胡子农夫。老妇人说自己从没听说过，不过天下所有四足兽都归她管，也许其中有谁知道。她吹响哨子，把野兽全都召来，挨个问了一遍，可没有一只知道那个人的下落。
        - id: ch02-b05
          speaker: eldest_sister
          text: 我们姐妹三人。也许另外两人知道。我的马车借给你，天黑时你就能赶到二妹家，哪怕最近的路也有三百英里呢。
        - id: ch02-b06
          speaker: narrator
          text: 父亲坐上马车，当晚赶到第二座小屋。屋外的老妇人同样在用长鼻子汲水。他叫她大娘，老妇人说，一百年都没人这样称呼她了，可还是不许他借宿。父亲自己吸了一口烟，又把一撮鼻烟放到她手背上。老妇人立刻欢喜得跳起舞来，改口让他住下。她说天下的鱼都归自己管，也许有谁听说过风云胡子农夫。可哨声召来所有水族以后，还是问不到半点消息。
        - id: ch02-b07
          speaker: second_sister
          text: 我还有一个姐妹，她或许知道。她住在六百英里外，你坐我的马车，天黑时便能到。
        - id: ch02-b08
          speaker: narrator
          text: 父亲再次乘车出发，天黑时赶到第三位老妇人的家。她正在用长鼻子拨炉火。父亲照旧叫她大娘，她也说，整整一百年没人这样叫过自己了。父亲请求借宿，又拿出烟草，给她足以铺满手背的一大撮鼻烟。老妇人高兴得跳起舞来，这才让他进屋。她虽然不知道风云胡子农夫住在哪里，却统领着天下飞鸟，便吹哨把鸟儿全叫来。大家到齐以后，只有鹰不见踪影。过了不久，鹰才疲惫地落下，说自己刚从风云胡子农夫那里飞回来，长途赶路已经累得几乎飞不起来了。
        - id: ch02-b09
          speaker: youngest_sister
          text: 那就由你给他带路。不过先吃饱，好好睡一夜，明天再动身。
        - id: ch02-b10
          speaker: narrator
          text: 鹰先吃了个饱，又踏踏实实睡了一夜。第二天，老妇人从它尾巴上拔下一根羽毛，让父亲坐在空出来的位置。鹰载着他一路飞去，直到半夜，才终于抵达风云胡子农夫的住处。
    - id: ch03
      title: 从魔窟救回杰克
      blocks:
        - id: ch03-b01
          speaker: eagle
          text: 门外躺着许多尸体，你千万不要理会。屋里的人全都睡得很沉，不容易叫醒。你径直走到桌子旁，从抽屉里拿出三小块面包。要是听见有人打鼾，就从他头上拔下三根头发。这点动静还吵不醒他。
        - id: ch03-b02
          speaker: narrator
          text: 父亲进屋拿到三块面包，刚拔下一根头发，风云胡子农夫就叫了一声。父亲壮着胆子又拔一根，对方再次大叫。等第三根也被拔下来，那声吼叫简直要把砖石砌成的屋子震裂。可就算这样，风云胡子农夫还是呼呼大睡，没有醒来。
        - id: ch03-b03
          speaker: weatherbeard
          text: 哎哟，真疼啊！
        - id: ch03-b04
          speaker: narrator
          text: 鹰又告诉父亲下一步该怎么办。他来到马厩门前，脚下忽然被一块硬石头绊住。父亲捡起石头，看见下面还压着三根木片，便一并收好。他敲了敲马厩门，门马上自己打开。父亲把三块面包丢在地上，一只野兔跑出来吃，他立刻伸手将它抓住。
        - id: ch03-b05
          speaker: eagle
          text: 再拔下我三根尾羽，把野兔、石头、木片，还有你自己，都放在空位上。我能把你们一起带走。
        - id: ch03-b06
          speaker: narrator
          text: 鹰载着他们飞出很远，才落到一块石头上歇口气。它叫父亲回头看看。父亲望见一群乌鸦正从后面飞来，越追越近。
        - id: ch03-b07
          speaker: eagle
          text: 我们再飞一段。等它们靠近，就把那三根头发扔下去。
        - id: ch03-b08
          speaker: narrator
          text: 鹰再次起飞。等乌鸦已经紧跟在后面，父亲就把三根头发扔了下去。头发一落地，马上变成一群渡鸦，反过来追赶乌鸦，把它们一直赶回老家。鹰继续飞了很远，又落在石头上歇息。父亲先说不大确定，后来终于看清，追兵又到了身后。他依照鹰的话扔下三根木片。木片顷刻长成一片高大茂密的森林。风云胡子农夫过不去，只得先回家取斧头，再一点点砍出一条路。
        - id: ch03-b09
          speaker: narrator
          text: 鹰又载着父亲飞了很久很久，实在累得不行，便停在一棵枞树上。父亲望见极远处似乎闪过什么，等鹰再飞一程，他便看清风云胡子农夫已经追到身后。父亲把最后那块大石头扔了下去，石头顿时化成一座又高又大的山。风云胡子农夫只能破开石山往前走，可走到山腹时，他摔断一条腿，只好掉头回家医治。
        - id: ch03-b10
          speaker: narrator
          text: 趁风云胡子农夫治腿的工夫，鹰带着父亲和野兔一路飞回了家。父亲随即把野兔带到教堂墓园，请人取来一些基督徒墓地的泥土，撒在它身上。泥土刚一落下，野兔就恢复了人的模样。父亲历尽艰险，终于把儿子杰克救了回来。
    - id: ch04
      title: 三次卖马
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了赶集的日子，杰克把自己变成一匹浅色的马，请父亲牵去市场售卖。他知道风云胡子农夫一定会认出自己，所以事先把价钱和脱身的办法说得清清楚楚。
        - id: ch04-b02
          speaker: jack
          text: 有人要买，就收他一百块钱。可一定要取下笼头。风云胡子农夫会来和你讲价，笼头落在他手里，我就逃不掉了。
        - id: ch04-b03
          speaker: narrator
          text: 一个马贩子果然看中了马，缠着父亲讨价还价。父亲收下一百块钱。买卖谈妥以后，马贩子还想索要笼头，可父亲牢牢记得杰克的叮嘱，怎么也不肯给。两人各自离开。马贩子带着杰克还没走多远，马就恢复成人形。等父亲回到家，杰克已经先一步坐在炉边的长凳上了。
        - id: ch04-b04
          speaker: father
          text: 笼头不在买卖里。我还有别的马要卖，不能给你。
        - id: ch04-b05
          speaker: narrator
          text: 第二天，杰克变成一匹棕马，叫父亲再牵去市场，开价两百块钱。他知道买主还会请父亲吃喝，只再三嘱咐，不管喝什么、做什么，千万别把笼头忘了。事情果然一样。父亲拿到两百块钱，又受到热情款待。双方分手时，他几乎把叮嘱忘了，好在最后一刻还是取下了笼头。买主没走多远，杰克便恢复原形。等父亲回家，他又已经坐在炉边。
        - id: ch04-b06
          speaker: narrator
          text: 第三天，一切照旧。杰克化成一匹高大的黑马。他告诉父亲，这次只要有人肯出三百块钱，还额外请他尽情吃喝，就可以成交。但这一次，取下笼头比前两次更加要紧。
        - id: ch04-b07
          speaker: jack
          text: 不管你喝了多少，都别忘记取下笼头。要是忘了，我这一辈子都逃不出风云胡子农夫的手掌。
        - id: ch04-b08
          speaker: father
          text: 放心吧，我绝不会忘。
        - id: ch04-b09
          speaker: narrator
          text: 到了市场，风云胡子农夫果然来了。父亲收下三百块钱，又被他格外殷勤地请去好吃好喝。等买卖完成，酒足饭饱的父亲竟把取下笼头的事忘得干干净净。风云胡子农夫终于如愿牵走了杰克。
    - id: ch05
      title: 变形追逐
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 走了一程，风云胡子农夫又想进客店喝白兰地。他先把一桶烧得通红的铁钉放在马鼻子下面，却把一槽燕麦摆在马尾巴后面，再将笼头牢牢系在钩子上，这才走进店里。黑马闻得到燕麦，却连头也转不过去，只能站在那里又跺蹄，又踢腿，又喷鼻，又直立起来。一个姑娘走出来，看见有人这样虐待牲口，觉得既造孽又可耻，实在不忍心。
        - id: ch05-b02
          speaker: girl
          text: 可怜的牲口，你的主人怎么能这样折磨你！
        - id: ch05-b03
          speaker: narrator
          text: 姑娘说着，把笼头从钩子上推了下来，好让可怜的马转过身去吃燕麦。风云胡子农夫在店里听见动静，立刻大叫着冲出门来。
        - id: ch05-b04
          speaker: weatherbeard
          text: 我来了！
        - id: ch05-b05
          speaker: narrator
          text: 可杰克早已甩掉笼头，一头跳进鹅塘，变成一条小鱼。风云胡子农夫紧随其后，化作一条大梭子鱼。杰克眼看就要被追上，又变成鸽子飞向天空。风云胡子农夫马上化成老鹰，紧追不舍，还飞上去猛击鸽子。国王宫殿里，一位公主正站在窗前，把这场争斗看得清清楚楚。
        - id: ch05-b06
          speaker: princess
          text: 鸽子啊，你要是懂得我所懂的事，就飞进这扇窗，到我这里来。
        - id: ch05-b07
          speaker: narrator
          text: 鸽子听懂了公主的话，立刻从窗口飞进宫殿，落地又变回杰克。他把自己怎样拜师、逃走，又怎样遭到风云胡子农夫追赶的经过全都告诉了公主。公主听完，想出了藏住他的办法，叫他变成金戒指，套在自己手上。
        - id: ch05-b08
          speaker: jack
          text: 这样不行。风云胡子农夫会让国王生病，等别人都治不好，他再来治病，索要的报酬一定就是这枚戒指。
        - id: ch05-b09
          speaker: princess
          text: 那我就说，这是母亲留给我的戒指，我绝不交出去。
        - id: ch05-b10
          speaker: narrator
          text: 公主执意不肯退让，杰克只好化成一枚金戒指，牢牢套在她的手指上。风云胡子农夫这时再也碰不到他。可危险并没有过去。接下来的事情，果真和杰克预料的一模一样。
    - id: ch06
      title: 炉灰里的决斗
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 国王突然病倒了。所有医生都来试过，却没有一个能治好他。直到风云胡子农夫赶来，国王才恢复健康。谈到报酬时，他开口便要公主手上的金戒指。国王派使者去取，公主却说，那是母亲留给自己的遗物，坚决不肯交出。国王听到回话，顿时勃然大怒。他说，不管戒指是谁留下的，自己今天都非要拿到手。
        - id: ch06-b02
          speaker: princess
          text: 发火也没有用，我根本摘不下来。真想要戒指，只能连我的手指一起拿走！
        - id: ch06-b03
          speaker: weatherbeard
          text: 让我试试，戒指马上就能摘下来。
        - id: ch06-b04
          speaker: princess
          text: 不必了，我自己来。
        - id: ch06-b05
          speaker: narrator
          text: 公主走到壁炉边，抓起一些炉灰抹在戒指上。戒指一下从手指滑脱，掉进灰里，再也看不见了。风云胡子农夫知道那正是杰克，立刻变成一只野兔，跳进壁炉又刨又扒，到处寻找戒指。它不停地翻动灰烬，直到炉灰一直堆到两只耳朵旁边。
        - id: ch06-b06
          speaker: narrator
          text: 风云胡子农夫把全部心思都放在炉灰里的戒指上。就在这时，杰克从灰烬中变成一只狐狸，猛地扑向野兔，一口咬掉了它的脑袋。两人的变形追逐终于分出胜负。哪怕风云胡子农夫真有恶魔附体，这一次，也彻底完了。
