  chapters:
    - id: ch01
      title: Master of All Masters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man and a woman with one son, named Jack. His mother decided that it was time for him to go out to service, and she told her husband to find him a place.
        - id: ch01-b02
          speaker: mother
          text: Find him a very good master, one who can teach him to become master of all masters.
        - id: ch01-b03
          speaker: narrator
          text: She packed food and a roll of tobacco for the journey. Father and son visited a great many masters. Each one gave them the same answer. He could make Jack as skilled as he was himself, but he could never make the lad any better. At last Jack's father went home and told his wife that none of them could do what she wanted.
        - id: ch01-b04
          speaker: mother
          text: Do whatever you think best, but I mean what I said. Jack must be trained to become master of all masters.
        - id: ch01-b05
          speaker: narrator
          text: She filled their bag again, and father and son set out once more. After walking a long way, they came onto the ice. A man drove toward them in a carriage drawn by a black horse.
        - id: ch01-b06
          speaker: farmer_weatherbeard
          text: Where are you two going?
        - id: ch01-b07
          speaker: father
          text: I must apprentice my son to someone who can teach him a trade. My wife comes from well-to-do people, and she insists that he become master of all masters.
        - id: ch01-b08
          speaker: farmer_weatherbeard
          text: Then we have met at just the right time. I can teach him that, and I am looking for an apprentice. Boy, climb up behind me.
        - id: ch01-b09
          speaker: narrator
          text: Jack got into the carriage, and the black horse carried him and the stranger straight up into the air.
        - id: ch01-b10
          speaker: father
          text: No, wait! At least tell me your name and where you live!
          emotion: fearful
        - id: ch01-b11
          speaker: farmer_weatherbeard
          text: My home is in the north, the south, the east, and the west. They call me Farmer Weatherbeard. Come back in a year, and I will tell you whether the boy suits me.
        - id: ch01-b12
          speaker: narrator
          text: With that, master and apprentice vanished. When the father returned, his wife demanded to know where Jack was.
        - id: ch01-b13
          speaker: father
          text: Heaven alone knows where he is now. They went flying up into the sky.
        - id: ch01-b14
          speaker: narrator
          text: He told her the whole tale. She learned that he had let their son fly away with a stranger. He did not know where Jack had gone, and he had never asked when the apprenticeship would end. She would not leave matters that way. At once she sent her husband out to find him, with another bag of food and another roll of tobacco.
    - id: ch02
      title: The Three Long-Nosed Sisters
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After walking for some time, the man entered a vast wood. It stretched ahead of him all day, no matter how far he went. As night began to fall, he saw a great light in the distance and made his way toward it. He walked for a long, long time before he reached a little hut at the foot of a rock. Outside stood an old woman. Her nose was so long that she was using it to draw water from the well.
        - id: ch02-b02
          speaker: father
          text: Good evening, mother.
        - id: ch02-b03
          speaker: eldest_sister
          text: Good evening to you. No one has called me mother for a hundred years.
        - id: ch02-b04
          speaker: father
          text: May I stay here tonight?
        - id: ch02-b05
          speaker: eldest_sister
          text: No.
        - id: ch02-b06
          speaker: narrator
          text: The man lit a little tobacco and let her take a puff. It pleased her so much that she began to dance, and after that she allowed him to stay. Before long, he asked about Farmer Weatherbeard.
        - id: ch02-b07
          speaker: narrator
          text: The old woman knew nothing of him, but she ruled all four-footed beasts. Perhaps one of them would know. She blew her whistle, and the beasts came together from every direction. She questioned them one by one, but not a single creature knew anything about Farmer Weatherbeard.
        - id: ch02-b08
          speaker: eldest_sister
          text: There are three sisters in our family. One of the others may know where he lives. Take my horse and carriage. My sister's house is three hundred miles away, even by the shortest road, but you can reach it tonight.
        - id: ch02-b09
          speaker: narrator
          text: The man climbed into the carriage and took the nearest road, though even that road covered three hundred miles. The borrowed horse carried him all the way before night was over. When he arrived, the second old woman was standing outside. She too was drawing water from her well with her long nose.
        - id: ch02-b10
          speaker: father
          text: Good evening, mother.
        - id: ch02-b11
          speaker: middle_sister
          text: Good evening to you. No one has called me mother for a hundred years.
        - id: ch02-b12
          speaker: father
          text: Will you give me a bed for the night?
        - id: ch02-b13
          speaker: middle_sister
          text: No.
        - id: ch02-b14
          speaker: narrator
          text: He took a puff from his tobacco, then placed some snuff on the back of her hand. She was delighted and danced for joy. So he was allowed to spend the night, and soon he asked whether she knew Farmer Weatherbeard.
        - id: ch02-b15
          speaker: narrator
          text: She did not know him either. She ruled all the fishes, though, and thought one of them might help. She blew her whistle and called them together. Then she questioned all of them, but not one fish knew a thing about Farmer Weatherbeard.
        - id: ch02-b16
          speaker: middle_sister
          text: I have one more sister. Perhaps she knows. She lives six hundred miles from here, but take my horse and carriage, and you can arrive by nightfall.
        - id: ch02-b17
          speaker: narrator
          text: Once more, the man set off in a borrowed carriage. This journey was twice as long, but the horse carried him across all six hundred miles by nightfall. At the third sister's house, he found the old woman beside her fire. Her nose was so long that she used it as a rake among the coals.
        - id: ch02-b18
          speaker: father
          text: Good evening, mother.
        - id: ch02-b19
          speaker: youngest_sister
          text: Good evening to you. No one has called me mother for a hundred years.
        - id: ch02-b20
          speaker: father
          text: Could I stay here tonight?
        - id: ch02-b21
          speaker: youngest_sister
          text: No.
        - id: ch02-b22
          speaker: narrator
          text: Once again, the man brought out his tobacco. He filled his pipe and gave the old woman enough snuff to cover the back of her hand. She danced with delight, and he earned a place in her house. Then he asked about Farmer Weatherbeard.
        - id: ch02-b23
          speaker: narrator
          text: She knew nothing of him herself, but she governed all the birds. At the sound of her whistle, they gathered before her, and she asked each one where Farmer Weatherbeard lived. Only the eagle was missing. It arrived soon afterward, weary from a great flight, and said it had just come from Farmer Weatherbeard's home.
        - id: ch02-b24
          speaker: narrator
          text: The old woman ordered the eagle to guide the man there. First the bird needed food, and then it begged to wait until morning. Its long journey had left it almost too tired to rise from the ground.
        - id: ch02-b25
          speaker: narrator
          text: Once the eagle had eaten and rested, the old woman pulled one feather from its tail and placed the man where the feather had been. The great bird carried him away. They did not reach Farmer Weatherbeard's house until midnight.
    - id: ch03
      title: The Hare Behind the Stable Door
      blocks:
        - id: ch03-b01
          speaker: eagle
          text: You will see many dead bodies lying outside that door, but do not stop or trouble yourself over them. Everyone inside the house is sleeping so deeply that waking them will be hard. Go straight to the table drawer and take three pieces of bread. If you hear someone snoring, pull three feathers from his head. Even that will not wake him.
        - id: ch03-b02
          speaker: narrator
          text: The man entered and found the bread. Then he pulled out the first feather.
        - id: ch03-b03
          speaker: farmer_weatherbeard
          text: Oof!
        - id: ch03-b04
          speaker: narrator
          text: Farmer Weatherbeard did not wake. The man pulled a second feather.
        - id: ch03-b05
          speaker: farmer_weatherbeard
          text: Oof!
        - id: ch03-b06
          speaker: narrator
          text: Still he slept. When the third feather came out, Farmer Weatherbeard roared so loudly that the man thought the house would split apart. Even then, the master stayed asleep.
        - id: ch03-b07
          speaker: narrator
          text: The eagle told the man what to do next. At the stable door, he stumbled over a hard stone. He lifted it and found three splinters of wood underneath. He took the stone and the splinters, then knocked. The door opened at once.
        - id: ch03-b08
          speaker: narrator
          text: He tossed the three pieces of bread inside. A hare darted out and ate them, and the man caught it. The eagle told him to pull three more feathers from its tail. In the empty places, the man tucked the hare, the hard stone, the three wooden splinters, and himself. With all of them held there, the eagle spread its wings and carried the whole company away.
        - id: ch03-b09
          speaker: narrator
          text: After flying a great distance, the eagle landed on a stone.
        - id: ch03-b10
          speaker: eagle
          text: Can you see anything behind us?
        - id: ch03-b11
          speaker: father
          text: Yes. A flock of crows is flying after us.
        - id: ch03-b12
          speaker: eagle
          text: Then we had better fly farther.
        - id: ch03-b13
          speaker: narrator
          text: The eagle took off again. A little later, it asked the man to look back once more.
        - id: ch03-b14
          speaker: father
          text: The crows are right behind us now.
        - id: ch03-b15
          speaker: eagle
          text: Throw down the three feathers you pulled from Farmer Weatherbeard's head.
        - id: ch03-b16
          speaker: narrator
          text: The man flung the three feathers down. Before they touched the ground, they became a flock of ravens. The ravens wheeled after the pursuing crows and drove them all the way home. With the first danger gone, the eagle carried its passengers much farther before landing on another stone to rest.
        - id: ch03-b17
          speaker: eagle
          text: What can you see now?
        - id: ch03-b18
          speaker: father
          text: I am not sure, but something seems to be coming far behind us.
        - id: ch03-b19
          speaker: eagle
          text: We should keep flying.
        - id: ch03-b20
          speaker: narrator
          text: After they had gone on for some time, the eagle told him to look again.
        - id: ch03-b21
          speaker: father
          text: Yes, they are close behind us.
        - id: ch03-b22
          speaker: eagle
          text: Throw down the wooden splinters you found beneath the gray stone at the stable.
        - id: ch03-b23
          speaker: narrator
          text: The man threw the three splinters behind them. The moment they touched the ground, they sprang up into a vast, thick wood. Farmer Weatherbeard could not pass it. He had to go home for an axe, return to the forest, and cut a road through the trees. All that while, the eagle flew on and on. At last it grew tired and settled on a fir tree.
        - id: ch03-b24
          speaker: eagle
          text: Do you see anything following us?
        - id: ch03-b25
          speaker: father
          text: I cannot be certain, but I think I see something very far away.
        - id: ch03-b26
          speaker: eagle
          text: Then we must go a little farther.
        - id: ch03-b27
          speaker: narrator
          text: The eagle flew on, then asked the man to look one last time.
        - id: ch03-b28
          speaker: father
          text: He is close behind us now.
        - id: ch03-b29
          speaker: eagle
          text: Throw down the great stone from the stable door.
        - id: ch03-b30
          speaker: narrator
          text: The man cast the great stone down. It rose at once into an enormous mountain of solid rock. Farmer Weatherbeard could not fly around it or cross over it. He had to break his way straight through before he could follow them. By the time he reached the middle of the mountain, he had broken one leg. He could do nothing but turn back and have it put right.
        - id: ch03-b31
          speaker: narrator
          text: While he was gone, the eagle carried the man and the hare safely home. The father took the hare to the churchyard and had Christian earth placed upon it. At once, it changed into his son Jack.
    - id: ch04
      title: Three Horses at the Fair
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When fair day came, Jack changed himself into a light-colored horse and told his father to take him to market.
        - id: ch04-b02
          speaker: jack
          text: If someone wants to buy me, ask for one hundred dollars. But you must take off my halter. Farmer Weatherbeard will be the buyer, and if he gets the halter too, I will never escape him.
        - id: ch04-b03
          speaker: narrator
          text: Everything happened just as Jack had said. A horse dealer appeared, admired the pale horse, and bargained eagerly for him. Jack's father named his price and received one hundred dollars. Once the bargain was settled and the money was in his hand, the dealer demanded the halter as well.
        - id: ch04-b04
          speaker: father
          text: The halter was never part of our bargain. You cannot have it. I have other horses to sell.
        - id: ch04-b05
          speaker: narrator
          text: Buyer and seller went their separate ways. Before the horse dealer had gone far, Jack slipped back into his own shape. When his father reached home, the boy was already sitting on the bench beside the stove.
        - id: ch04-b06
          speaker: narrator
          text: The next day, Jack became a brown horse and again sent his father to market with him.
        - id: ch04-b07
          speaker: jack
          text: If a man offers to buy me, charge him two hundred dollars. He will pay it and treat you to drinks besides. Whatever you drink and whatever happens, remember my halter. If you leave it on me, you will never see me again.
        - id: ch04-b08
          speaker: narrator
          text: Once again, Jack was right. A buyer paid the full two hundred dollars and treated his father to drinks as well. When it was time to part, the old man was so pleased that he almost walked away without the halter. At the last possible moment, he remembered and pulled it off. The buyer had not gone far before Jack became a young man again. By the time his father came home, Jack was waiting on the bench by the stove.
        - id: ch04-b09
          speaker: narrator
          text: On the third day, Jack changed into a great black horse.
        - id: ch04-b10
          speaker: jack
          text: This time, sell me if a man offers three hundred dollars and treats you handsomely. But no matter what you do or how much you drink, do not forget the halter. If Farmer Weatherbeard takes it, I will never get free of him for as long as I live.
        - id: ch04-b11
          speaker: father
          text: No, I will remember.
        - id: ch04-b12
          speaker: narrator
          text: At the market, Farmer Weatherbeard came to bargain for the splendid black horse. He paid all three hundred dollars, then treated the father so handsomely that the old man drank and forgot every warning Jack had given him. This time the halter stayed on. Farmer Weatherbeard took hold of it and led the horse away.
        - id: ch04-b13
          speaker: narrator
          text: After traveling some distance, the master stopped at an inn because he wanted still more brandy. Before going in, he made sure the horse could not enjoy a moment's rest. He placed a barrel of red-hot nails beneath its nose and a trough full of oats behind its tail. Then he tied the halter firmly to a hook and left. The horse could smell the oats but could not reach them. It stamped, kicked, snorted, and reared.
        - id: ch04-b14
          speaker: narrator
          text: A girl came out of the inn. She thought it wicked and shameful to treat a horse that way.
        - id: ch04-b15
          speaker: girl
          text: Oh, you poor creature! What a cruel master you must have.
        - id: ch04-b16
          speaker: narrator
          text: She slipped the halter off the hook so the horse could turn around and eat the oats.
        - id: ch04-b17
          speaker: farmer_weatherbeard
          text: I am here!
        - id: ch04-b18
          speaker: narrator
          text: Farmer Weatherbeard rushed out, but he was too late. The horse had shaken off the halter and thrown himself into a goose pond, where he became a little fish. Farmer Weatherbeard jumped after him as a great pike.
    - id: ch05
      title: The Dove at the Palace Window
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: With the great pike close behind him, Jack changed from a little fish into a dove and flew out of the pond. Farmer Weatherbeard became a hawk. He swept after the dove through the air and struck him. At that moment, a Princess stood at an open window of the King's palace, watching the two birds struggle.
        - id: ch05-b02
          speaker: princess
          text: If you knew what I know, little dove, you would fly through my window to me.
        - id: ch05-b03
          speaker: narrator
          text: The dove flew inside and changed back into Jack. He told the Princess everything that had happened.
        - id: ch05-b04
          speaker: princess
          text: Turn yourself into a gold ring and slip onto my finger.
        - id: ch05-b05
          speaker: jack
          text: That will not work. Farmer Weatherbeard will make the King ill. No one will be able to cure him until Weatherbeard comes. Then he will ask for the gold ring as his payment.
        - id: ch05-b06
          speaker: princess
          text: I will tell them the ring belonged to my mother, and I refuse to give it up.
        - id: ch05-b07
          speaker: narrator
          text: Jack became a gold ring and settled on her finger. There Farmer Weatherbeard could not reach him. Then every part of Jack's warning came true. The King fell ill, and not one doctor could make him well. At last Farmer Weatherbeard arrived and cured him. In return, he demanded the ring on the Princess's finger.
        - id: ch05-b08
          speaker: narrator
          text: The King sent a messenger to his daughter and ordered her to hand over the ring. She refused to part with it, saying she had inherited it from her mother. When the messenger brought back that answer, the King flew into a rage. He declared that he would have the ring, no matter who had left it to her.
        - id: ch05-b09
          speaker: princess
          text: Anger will not help. I cannot pull it off. If you want this ring, you will have to take my finger with it.
        - id: ch05-b10
          speaker: farmer_weatherbeard
          text: Let me try. I will soon have that ring off.
        - id: ch05-b11
          speaker: princess
          text: No, thank you. I will try it myself.
        - id: ch05-b12
          speaker: narrator
          text: She went to the fireplace and rubbed ashes onto the ring. It slipped from her finger and disappeared among the ashes.
    - id: ch06
      title: The Fox and the Hare
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Farmer Weatherbeard changed himself into a hare. He scratched and scraped through the fireplace until ashes covered him to the ears.
        - id: ch06-b02
          speaker: narrator
          text: But Jack became a fox and bit off the hare's head. Whatever evil power had lived in Farmer Weatherbeard, that was the end of it.
