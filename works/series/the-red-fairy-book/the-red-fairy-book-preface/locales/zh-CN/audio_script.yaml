audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
  chapters:
    - id: ch01
      title: 再访仙境
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们又一次来到仙境的田野拾穗，当然不能盼着再找到一位佩罗。可是，留下来的好故事依旧不少。我们也希望，《红色童话书》里有些故事不如那些老朋友那么耳熟，反而会让人更想读一读。书中的故事，有些是译作，有些经过改编。奥诺瓦夫人原作很长，选入的几篇就属于改编。亨特夫人从挪威语译出了若干篇，明妮·赖特小姐翻译了奥诺瓦夫人的作品。兰夫人和布鲁斯小姐采用了其他法文来源，梅·塞拉小姐、法夸尔森小姐和布莱克利小姐则从德文翻译。还有《西格德》，那是编者依据威廉·莫里斯先生的《沃尔松格萨迦》散文译本缩写而成的。
    - id: ch02
      title: 承蒙允准
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 编者还要谢谢他的朋友夏尔·马雷勒先生，承蒙允许，本书收入了他从法文译写的《花衣魔笛手》《鸭尾巴》和《小金帽》。亨利·卡尔努瓦先生也给了同样的许可，让我们采用《传统》杂志上刊登的《六个傻瓜》。
        - id: ch02-b02
          speaker: narrator
          text: 弗朗西丝·贝尔福夫人好意抄录了一种古老版本的《杰克与豆茎》，史密斯—埃尔德出版公司也准许本书刊载拉尔斯顿先生从俄文译出的两篇故事。
    - id: ch03
      title: 署名
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这篇序言的署名是 A. L.
