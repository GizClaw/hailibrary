audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    prince_ivan:
      display_name: 伊凡王子
      tts:
        delivery: 勇敢坦率，历经苦难仍执着坚定
        timbre: 年轻明亮
        pace: 稳健明快
        pitch: 中等
    princess_marya:
      display_name: 玛丽亚公主
      tts:
        delivery: 亲切端庄，关怀弟弟
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高
    princess_olga:
      display_name: 奥尔加公主
      tts:
        delivery: 热情温柔，举止大方
        timbre: 清澈柔润
        pace: 适中
        pitch: 中高
    princess_anna:
      display_name: 安娜公主
      tts:
        delivery: 活泼亲切，感情真挚
        timbre: 明净柔美
        pace: 适中
        pitch: 中高
    falcon:
      display_name: 猎鹰
      tts:
        delivery: 豪爽亲切，言语爽朗
        timbre: 年轻洪亮
        pace: 明快
        pitch: 中低
    eagle:
      display_name: 雄鹰
      tts:
        delivery: 沉稳热诚，带着兄长般的可靠
        timbre: 浑厚清晰
        pace: 稳健
        pitch: 低
    raven:
      display_name: 乌鸦
      tts:
        delivery: 机敏直率，关切家人
        timbre: 清亮坚实
        pace: 稍快
        pitch: 中低
    survivor:
      display_name: 幸存者
      tts:
        delivery: 虚弱而郑重，如实回答
        timbre: 干涩微弱
        pace: 缓慢
        pitch: 中低
    marya_morevna:
      display_name: 玛丽亚·莫列夫娜
      tts:
        delivery: 英勇果断，对爱人温柔而忧心
        timbre: 坚定清澈
        pace: 从容有力
        pitch: 中等
    koshchei:
      display_name: 不死者科谢
      tts:
        delivery: 阴沉凶狠，得意时冷酷张狂
        timbre: 粗粝低沉
        pace: 稍慢
        pitch: 低
    koshchei_horse:
      display_name: 科谢的骏马
      tts:
        delivery: 冷静准确，回答毫不迟疑
        timbre: 深沉有力
        pace: 稳健
        pitch: 低
    strange_bird:
      display_name: 异乡鸟
      tts:
        delivery: 恳切机敏，报恩时爽快
        timbre: 清脆明亮
        pace: 轻快
        pitch: 高
    queen_bee:
      display_name: 蜂王
      tts:
        delivery: 急切恳求，指点时细致果断
        timbre: 轻细清晰
        pace: 稍快
        pitch: 高
    lioness:
      display_name: 母狮
      tts:
        delivery: 护子恳切，报恩时沉着可靠
        timbre: 温厚有力
        pace: 稳健
        pitch: 中低
    baba_yaga:
      display_name: 芭芭雅嘎
      tts:
        delivery: 阴险暴躁，威胁时尖刻凶狠
        timbre: 苍老沙哑
        pace: 忽缓忽急
        pitch: 中低
    mare_one:
      display_name: 母马甲
      tts:
        delivery: 惊惶委屈，急忙分辩
        timbre: 清亮
        pace: 稍快
        pitch: 中等
    mare_two:
      display_name: 母马乙
      tts:
        delivery: 惊惶委屈，急忙分辩
        timbre: 柔亮
        pace: 稍快
        pitch: 中高
    mare_three:
      display_name: 母马丙
      tts:
        delivery: 惊惶委屈，急忙分辩
        timbre: 稍哑
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 三位姐妹的婚事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一个王国，那里住着伊凡王子和他的三个姐妹。大姐叫玛丽亚，二姐叫奥尔加，小妹叫安娜。父亲和母亲临终时，把儿子叫到身边，郑重叮嘱他，不论最先上门求婚的是谁，都不要把姐妹留在自己身边。只要她们愿意，就让她们嫁出去。
        - id: ch01-b02
          speaker: narrator
          text: 父母去世后，伊凡安葬了他们。为了排遣悲伤，他陪姐妹们到碧绿的花园散步。忽然乌云遮天，一场可怕的暴风雨来了。
        - id: ch01-b03
          speaker: prince_ivan
          text: 姐妹们，快回家！
        - id: ch01-b04
          speaker: narrator
          text: 他们刚进宫殿，雷声就炸响了，天花板裂开，一只光彩夺目的猎鹰飞进屋里。猎鹰落到地上，转眼变成一个英武的青年。
        - id: ch01-b05
          speaker: falcon
          text: 伊凡王子，你好！我从前来这里做客，今天却是来求亲的。我要娶你的姐姐玛丽亚公主。
        - id: ch01-b06
          speaker: prince_ivan
          text: 只要姐姐中意你，我绝不会拦着。愿上帝保佑，就让她嫁给你吧！
        - id: ch01-b07
          speaker: narrator
          text: 玛丽亚公主看中了这个青年，答应了他的求婚。猎鹰娶她为妻，带她飞回自己的王国。日子一个接一个过去，钟点一个追着一个，转眼就是整整一年。伊凡又陪两个妹妹去碧绿的花园散步。就在这时，天边再次涌起乌云，旋风呼啸，电光闪闪。
        - id: ch01-b08
          speaker: prince_ivan
          text: 姐妹们，快回家！
        - id: ch01-b09
          speaker: narrator
          text: 他们才跨进宫殿，雷声便轰然响起，屋顶冒出火光，天花板裂成两半。一只雄鹰飞进来，落地变成了英武的青年。
        - id: ch01-b10
          speaker: eagle
          text: 伊凡王子，你好！从前我是客人，如今我是来求亲的。
        - id: ch01-b11
          speaker: narrator
          text: 雄鹰要娶奥尔加公主。
        - id: ch01-b12
          speaker: prince_ivan
          text: 只要奥尔加中意你，她就可以嫁给你。该由她自己选择，我不会干涉。
        - id: ch01-b13
          speaker: narrator
          text: 奥尔加答应了。雄鹰娶了她，也带她飞回自己的王国。又过一年，伊凡请小妹安娜到花园里走走。两人散步的时候，风暴第三次来了。
        - id: ch01-b14
          speaker: prince_ivan
          text: 妹妹，我们回家吧！
        - id: ch01-b15
          speaker: narrator
          text: 两人回到宫殿，还没坐下，雷声已经震裂天花板，一只乌鸦飞了进来。乌鸦落地变成一个青年，比前两位还要俊美。
        - id: ch01-b16
          speaker: raven
          text: 伊凡王子，我从前来做客，今天却来求亲。请把安娜公主嫁给我吧。
        - id: ch01-b17
          speaker: prince_ivan
          text: 只要你能赢得妹妹的心，她就可以嫁给你。我不会替她做主。
        - id: ch01-b18
          speaker: narrator
          text: 安娜公主也看中了求婚的青年，嫁给了乌鸦，随他飞回自己的王国。三个姐妹全都走了，宫殿里只剩下伊凡一个人。他独自生活了整整一年，越来越思念她们，也越来越厌倦这孤单的日子，终于决定出门寻找三个姐妹。
        - id: ch01-b19
          speaker: narrator
          text: 他准备好一路所需的东西，骑马走了又走。一天，眼前忽然出现一片可怕的景象，整支军队的尸体铺满了原野。伊凡不知道这里发生过什么，便勒住马，向四周高声询问，还有没有活人能够回答，究竟是谁消灭了这样强大的军队。
        - id: ch01-b20
          speaker: survivor
          text: 是美丽的玛丽亚·莫列夫娜公主。这里所有人，都是她杀死的。
        - id: ch01-b21
          speaker: narrator
          text: 伊凡继续赶路，来到一顶白帐篷前。美丽的玛丽亚·莫列夫娜公主亲自走出来迎接。
        - id: ch01-b22
          speaker: marya_morevna
          text: 王子，你要去哪里？是自己愿意上路，还是受了谁的逼迫？
        - id: ch01-b23
          speaker: prince_ivan
          text: 英勇的青年出门，从来不是受人逼迫！
        - id: ch01-b24
          speaker: marya_morevna
          text: 要是事情不急，就在我的帐篷里住几天吧。
        - id: ch01-b25
          speaker: narrator
          text: 伊凡听见挽留，心里十分欢喜，便在白帐篷里住了下来。他和玛丽亚·莫列夫娜共同度过两个夜晚，也赢得了公主的芳心。两人结为夫妻，公主带他回到自己的王国，共同生活了一段日子。后来，征战四方的念头又在玛丽亚·莫列夫娜心中升起。她要带兵出征，临行前便把家里的一切交给伊凡照管。
        - id: ch01-b26
          speaker: marya_morevna
          text: 家里每处地方，你都可以去，也要替我照看好。只有那边的密室，千万不要打开。
    - id: ch02
      title: 科谢逃脱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可玛丽亚·莫列夫娜才离开，伊凡就按捺不住。他冲到密室，拉开门一看，不死者科谢正被十二条锁链吊在那里。
        - id: ch02-b02
          speaker: koshchei
          text: 可怜可怜我，给我一点水吧！我在这里整整十年没吃没喝，嗓子早就干透了。
        - id: ch02-b03
          speaker: narrator
          text: 伊凡给了他一桶水。科谢一口喝光，还是口渴。
        - id: ch02-b04
          speaker: koshchei
          text: 一桶水根本不够，再给我一桶！
        - id: ch02-b05
          speaker: narrator
          text: 第二桶也被喝得一滴不剩。科谢又要了第三桶。水一喝完，他从前的力气全回来了。科谢猛一抖身，十二条锁链同时断裂。
        - id: ch02-b06
          speaker: koshchei
          text: 多谢你，伊凡王子！往后你想见玛丽亚·莫列夫娜，只怕比看见自己的耳朵还难！
        - id: ch02-b07
          speaker: narrator
          text: 科谢说完便化成一阵可怕的旋风，冲出窗户。他追上正在赶路的玛丽亚·莫列夫娜，一把抓住她，强行带回自己家中。伊凡失去妻子，伤心得放声痛哭。可他没有一直留在宫殿里哀伤。哭过之后，他重新穿戴整齐，走上漫长的旅途，心里发誓，无论遇见什么，也一定要把玛丽亚·莫列夫娜找回来。
        - id: ch02-b08
          speaker: narrator
          text: 走到第三天黎明，一座奇妙的宫殿出现在前方。宫殿旁有棵橡树，树上栖着猎鹰。猎鹰飞下来，落地变成人形。
        - id: ch02-b09
          speaker: falcon
          text: 亲爱的内兄，见到你真好！这些日子过得怎么样？
        - id: ch02-b10
          speaker: narrator
          text: 玛丽亚公主听见呼喊，也从宫殿里跑出来。她欢欢喜喜地迎接弟弟，先仔细问他身体好不好，又把自己离家以后的生活一件件讲给他听。伊凡在姐姐和姐夫家住了三天。到了第三天，他还是记挂着失踪的妻子，便向他们告辞。
        - id: ch02-b11
          speaker: prince_ivan
          text: 我不能留下。我一定要找到妻子玛丽亚·莫列夫娜。
        - id: ch02-b12
          speaker: falcon
          text: 这一路可不容易。把你的银勺留下吧，我们看见它，就会想起你。
        - id: ch02-b13
          speaker: narrator
          text: 伊凡留下银勺，继续上路。又到第三天黎明，他看见一座更宏伟的宫殿。旁边的橡树上栖着雄鹰。雄鹰飞下来，变成人形，高声呼唤妻子。
        - id: ch02-b14
          speaker: eagle
          text: 奥尔加，快来！我们亲爱的弟弟到了！
        - id: ch02-b15
          speaker: narrator
          text: 奥尔加立刻从宫殿里跑出来，又亲又抱地迎接伊凡。她一边问弟弟这些日子过得怎么样，一边把自己的近况讲给他听。伊凡在这里也停留了三天。姐夫和姐姐待他再亲热，他也不能忘记玛丽亚·莫列夫娜，住满三天便又要赶路。
        - id: ch02-b16
          speaker: prince_ivan
          text: 我不能再耽搁了。我得去找玛丽亚·莫列夫娜。
        - id: ch02-b17
          speaker: eagle
          text: 要找到她很难。留下一把银叉吧，我们想念你时可以看看。
        - id: ch02-b18
          speaker: narrator
          text: 伊凡留下银叉。再走三天，他见到一座比前两座都宏伟的宫殿。旁边橡树上的乌鸦飞落下来，变成青年。
        - id: ch02-b19
          speaker: raven
          text: 安娜，快出来！我们的弟弟来了！
        - id: ch02-b20
          speaker: narrator
          text: 安娜欢喜地跑出宫殿，搂住弟弟又亲又抱。她问伊凡身体可好，也把自己离家以后经历的事讲给他听。伊凡陪小妹和乌鸦住了三天。可他心里仍惦记妻子，到了分别的时候，便向他们告别。
        - id: ch02-b21
          speaker: prince_ivan
          text: 我要继续去找妻子，不能再留下了。
        - id: ch02-b22
          speaker: raven
          text: 这件事很难办。不管怎样，把银鼻烟盒留给我们。我们看着它，也能记起你。
        - id: ch02-b23
          speaker: narrator
          text: 伊凡留下鼻烟盒，又走了三天，终于找到玛丽亚·莫列夫娜。她看见心上人，一把搂住他的脖子，哭了起来。
        - id: ch02-b24
          speaker: marya_morevna
          text: 伊凡，你为什么不听我的话？你打开密室，还把不死者科谢放了出来！
          emotion: sad
        - id: ch02-b25
          speaker: prince_ivan
          text: 原谅我吧。过去的事先别想了，趁科谢不在，快跟我走。也许他追不上我们。
        - id: ch02-b26
          speaker: narrator
          text: 两人立刻逃走。傍晚，外出打猎的科谢骑马回家，骏马忽然绊了一下。
        - id: ch02-b27
          speaker: koshchei
          text: 没用的东西，为什么绊脚？你闻到祸事了吗？
        - id: ch02-b28
          speaker: koshchei_horse
          text: 伊凡王子来过，他带走了玛丽亚·莫列夫娜。
        - id: ch02-b29
          speaker: koshchei
          text: 还追得上吗？
        - id: ch02-b30
          speaker: koshchei_horse
          text: 现在种小麦，等它成熟，割下脱粒，再磨成面粉，做出五只馅饼。我们吃完再追，也完全来得及。
        - id: ch02-b31
          speaker: narrator
          text: 科谢纵马追去，很快赶上两人。
        - id: ch02-b32
          speaker: koshchei
          text: 你曾经给我水喝，这一次我看在那份恩情上饶你。第二次我也会放过你。可要是再有第三次，我就把你剁成碎块！
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: 科谢夺走玛丽亚·莫列夫娜，把她带回家。伊凡坐在石头上痛哭，哭够以后，又回去找她。科谢正巧不在。
        - id: ch02-b34
          speaker: prince_ivan
          text: 玛丽亚，我们再逃一次！
        - id: ch02-b35
          speaker: marya_morevna
          text: 他一定还会追上来。
        - id: ch02-b36
          speaker: prince_ivan
          text: 就算追上，至少我们还能在一起一两个钟头。
        - id: ch02-b37
          speaker: narrator
          text: 他们再次逃走。科谢回家时，马又绊了一下。
        - id: ch02-b38
          speaker: koshchei
          text: 为什么又绊脚？是不是出了祸事？
        - id: ch02-b39
          speaker: koshchei_horse
          text: 伊凡王子带走了玛丽亚·莫列夫娜。
        - id: ch02-b40
          speaker: koshchei
          text: 还赶得上他们吗？
        - id: ch02-b41
          speaker: koshchei_horse
          text: 现在种大麦，等它长成，割下脱粒，再酿成啤酒。我们喝得大醉，睡足以后再追，照样来得及。
        - id: ch02-b42
          speaker: narrator
          text: 科谢赶上伊凡，冷冷提醒他，想见玛丽亚比看见自己的耳朵还难，随后又把她带走。伊凡独自哭过，第三次回去找她。科谢仍不在家。
        - id: ch02-b43
          speaker: prince_ivan
          text: 玛丽亚，跟我逃吧！
        - id: ch02-b44
          speaker: marya_morevna
          text: 他这次一定会追上来，还会把你剁成碎块。
          emotion: fearful
        - id: ch02-b45
          speaker: prince_ivan
          text: 那就让他剁吧！没有你，我也活不下去。
        - id: ch02-b46
          speaker: narrator
          text: 两人第三次收拾停当，逃了出去。科谢骑马回家的路上，骏马再次绊了一下。科谢追问它是不是闻到了祸事，骏马便告诉主人，伊凡又来带走了玛丽亚·莫列夫娜。这一次，科谢没有再问能不能追上。他立刻纵马追赶，很快捉住伊凡，把王子剁成小小的碎块，全部装进一只木桶。科谢在桶外涂满沥青，又用铁箍箍得严严实实，最后将木桶扔进蔚蓝的大海。玛丽亚·莫列夫娜则又被他带回家中。
    - id: ch03
      title: 死而复生
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在伊凡遇害的时刻，他留在三个姐夫家里的银器全都变黑了。
        - id: ch03-b02
          speakers: [falcon, eagle, raven]
          ensemble: chorus
          text: 糟了，祸事果然发生了！
        - id: ch03-b03
          speaker: narrator
          text: 三位姐夫立刻分头行动。雄鹰赶往蔚蓝的大海，找到漂在水上的木桶，紧紧抓住它，把它一直拖到岸边。猎鹰飞去寻找生命之水，乌鸦则飞去寻找死亡之水。三人重新会合以后，合力砸开木桶，取出伊凡的残骸。他们把每一块都洗净，再照原来的位置仔细拼好。乌鸦先把死亡之水洒在上面，碎块立刻彼此相连，身体重新变得完整。猎鹰再洒下生命之水。伊凡浑身一颤，睁开眼睛，站了起来。
        - id: ch03-b04
          speaker: prince_ivan
          text: 哎呀，我这一觉睡得可真久！
        - id: ch03-b05
          speakers: [falcon, eagle, raven]
          ensemble: chorus
          text: 要不是我们，你还会一直睡下去呢。现在跟我们回家做客吧。
        - id: ch03-b06
          speaker: prince_ivan
          text: 不行，姐夫们。我还要去找玛丽亚·莫列夫娜。
        - id: ch03-b07
          speaker: narrator
          text: 伊凡找到妻子，请她设法问出科谢从哪里得到了那匹骏马。玛丽亚·莫列夫娜挑了一个合适的时机，向科谢问起这件事。
        - id: ch03-b08
          speaker: koshchei
          text: 越过三重九国，在第三十个王国的火焰河对岸，住着芭芭雅嘎。她有一匹母马，每天都能驮着她绕世界飞上一圈，还有许多别的骏马。我替她看守三天马群，一匹都没丢，她才送了我一匹马驹。
        - id: ch03-b09
          speaker: marya_morevna
          text: 那你怎么渡过火焰河呢？
        - id: ch03-b10
          speaker: koshchei
          text: 我有一块神奇的手帕。在右边挥三下，就会出现一座极高的大桥，河里的火焰根本够不到桥面。
        - id: ch03-b11
          speaker: narrator
          text: 玛丽亚·莫列夫娜记住科谢说的每一句话，等到两人再次见面，便原原本本地转告伊凡。她还悄悄拿走那块手帕，亲手交给丈夫。伊凡靠着它平安渡过火焰河，然后独自向芭芭雅嘎家走去。他走了很久很久，路上找不到食物，也找不到水，饥渴越来越难忍。后来，他遇见一只从异乡飞来的大鸟，身边还带着几只幼鸟。
        - id: ch03-b12
          speaker: prince_ivan
          text: 我实在太饿了，只好吃一只小鸟。
        - id: ch03-b13
          speaker: strange_bird
          text: 别吃我的孩子，伊凡王子！总有一天，我会报答你。
        - id: ch03-b14
          speaker: narrator
          text: 伊凡放过幼鸟，继续赶路。他在森林里看见蜂巢，又想取一块蜂房充饥。
        - id: ch03-b15
          speaker: queen_bee
          text: 别动我的蜂蜜，伊凡王子！以后我一定会帮你。
        - id: ch03-b16
          speaker: narrator
          text: 伊凡没有碰蜂蜜。又走了一段，一头母狮带着幼狮迎面而来。
        - id: ch03-b17
          speaker: prince_ivan
          text: 我饿得浑身难受，无论如何，也得吃掉这头幼狮。
        - id: ch03-b18
          speaker: lioness
          text: 求你放过我们吧，伊凡王子！总有一天，我会报答你。
        - id: ch03-b19
          speaker: prince_ivan
          text: 好吧，就照你的意思办。
        - id: ch03-b20
          speaker: narrator
          text: 伊凡饿得头昏眼花，还是继续往前走，终于来到芭芭雅嘎的屋子。屋子四周围着十二根木杆，十一根上面都插着人头，只有最后一根还空着。
        - id: ch03-b21
          speaker: prince_ivan
          text: 老婆婆，你好！
        - id: ch03-b22
          speaker: baba_yaga
          text: 伊凡王子，你来做什么？是自己情愿来的，还是受了谁的逼迫？
        - id: ch03-b23
          speaker: prince_ivan
          text: 我想替你干活，挣一匹英雄的骏马。
        - id: ch03-b24
          speaker: baba_yaga
          text: 可以！不用干一年，只要替我看守三天母马。一匹不丢，我就送你骏马。要是少了一匹，你的脑袋正好可以插在那根空木杆上，到时候可别怪我。
    - id: ch04
      title: 芭芭雅嘎的马群
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 伊凡明知最后那根木杆等着自己的脑袋，还是答应了。芭芭雅嘎先给他食物和水，然后叫他立刻干活。可伊凡才把母马赶到野外，马群就一齐翘起尾巴，朝草地四面八方狂奔。王子还没来得及看清它们去了哪里，所有母马已经消失得无影无踪。他又焦急又难过，不知道怎样才能把马找回来。伊凡哭过以后，坐在一块石头上，不知不觉睡着了。太阳快要落山时，那只异乡鸟从远处飞来，把他叫醒。
        - id: ch04-b02
          speaker: strange_bird
          text: 快起来，伊凡王子！母马已经全都回家了。
        - id: ch04-b03
          speaker: narrator
          text: 伊凡听从异乡鸟的话，起身赶回芭芭雅嘎的屋子。果然，一匹母马也没有少，全都已经回来了。可芭芭雅嘎不但没有高兴，反而正在对着马群大发雷霆，气得又跳又骂。
        - id: ch04-b04
          speaker: baba_yaga
          text: 谁让你们回来的？
          emotion: angry
        - id: ch04-b05
          speakers: [mare_one, mare_two, mare_three]
          ensemble: chorus
          text: 我们不能不回来呀！世界各地的飞鸟都来啄我们，眼睛差一点儿就被啄瞎了！
        - id: ch04-b06
          speaker: baba_yaga
          text: 好吧！明天别去草地，都给我躲进茂密的森林。
        - id: ch04-b07
          speaker: narrator
          text: 伊凡睡了一夜。第二天早晨，芭芭雅嘎再次警告他，只要少了一匹母马，他那颗勇敢的脑袋就会插上最后的木杆。伊凡把马群赶到野外。母马刚得到自由，立刻翘起尾巴，分别钻进茂密的森林，很快就连一点踪影也看不见了。伊凡还是无计可施，只能回到石头旁，哭了又哭，随后沉沉睡去。等太阳落到树林背后，前一天被他放过的母狮从林中跑来，站在他身边叫醒了他。
        - id: ch04-b08
          speaker: lioness
          text: 起来吧，伊凡王子！母马已经一匹不少，全都聚齐了。
        - id: ch04-b09
          speaker: narrator
          text: 伊凡回到家，芭芭雅嘎比前一天更加愤怒。
        - id: ch04-b10
          speaker: baba_yaga
          text: 你们怎么又回来了？
          emotion: angry
        - id: ch04-b11
          speakers: [mare_one, mare_two, mare_three]
          ensemble: chorus
          text: 世界各地的猛兽都来追我们，差一点儿就把我们撕碎了。我们怎么敢不回来？
        - id: ch04-b12
          speaker: baba_yaga
          text: 那明天都给我跑进蔚蓝的大海！
        - id: ch04-b13
          speaker: narrator
          text: 伊凡又睡了一夜。第三天早晨，芭芭雅嘎打发他去看守母马，又拿木杆上的空位威胁他。母马一出门便翘起尾巴，转眼不见踪影。它们这回一直逃进蔚蓝的大海，站在深水里，只把脖子和脑袋露在水面。伊凡根本无法把它们赶回来。他又坐到那块石头上，伤心地哭了一阵，随后睡着了。太阳落到森林背后时，一只蜜蜂飞到王子身边。
        - id: ch04-b14
          speaker: queen_bee
          text: 醒醒，王子！母马全回去了。你到家以后，别让芭芭雅嘎看见。悄悄溜进马厩，藏到食槽后面。那里有匹瘦弱的小马驹，在粪泥里打滚。等到半夜，你就偷走它，骑着逃出去。
        - id: ch04-b15
          speaker: narrator
          text: 伊凡照办，藏进马厩。外面，芭芭雅嘎又在怒骂马群。
        - id: ch04-b16
          speaker: baba_yaga
          text: 你们为什么还要回来？
          emotion: angry
        - id: ch04-b17
          speakers: [mare_one, mare_two, mare_three]
          ensemble: chorus
          text: 数不清的蜜蜂从世界各地飞来，围着我们不停地蜇，直蜇得鲜血直流！我们怎么能不回来？
        - id: ch04-b18
          speaker: narrator
          text: 芭芭雅嘎睡着以后，伊凡等到半夜，偷走小马驹，套上鞍，向火焰河飞奔。他来到河边，在右边挥了三下手帕。一座壮丽的大桥不知从哪里冒出来，高高悬在火河上。伊凡过桥以后，只在左边挥了两下，于是河上只剩一座薄得不能再薄的小桥。
        - id: ch04-b19
          speaker: narrator
          text: 清晨，芭芭雅嘎发现小马驹不见了，立刻追来。她坐在铁臼里飞驰，用杵催动铁臼，还拿扫帚抹去身后的踪迹。到了火焰河边，她看见那座小桥。
        - id: ch04-b20
          speaker: baba_yaga
          text: 好一座桥！
        - id: ch04-b21
          speaker: narrator
          text: 她觉得这座桥好极了，驾驶铁臼径直冲了上去。可那座桥只承受过两次手帕的魔力，细得几乎没有分量。芭芭雅嘎刚走到中央，桥便从中断成两截。她连同铁臼一起扑通掉进火焰河，在烈焰之中落了个凄惨的死法。
    - id: ch05
      title: 不死者之死
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 伊凡在碧绿的草地上把小马驹喂得又肥又壮。它终于变成一匹神奇的骏马。伊凡骑着它去找玛丽亚·莫列夫娜。公主跑出来，一把搂住他的脖子。
        - id: ch05-b02
          speaker: marya_morevna
          text: 上帝用了什么办法，竟然让你死而复生？
          emotion: surprised
        - id: ch05-b03
          speaker: prince_ivan
          text: 事情就是这样。别再耽搁，现在跟我走吧。
        - id: ch05-b04
          speaker: marya_morevna
          text: 我害怕。要是科谢追上来，你又会被他剁成碎块。
          emotion: fearful
        - id: ch05-b05
          speaker: prince_ivan
          text: 这一次他追不上！我有了英雄的骏马，它飞起来就像鸟一样。
        - id: ch05-b06
          speaker: narrator
          text: 两人一同骑上马背，飞驰而去。科谢回家时，他的马又绊了一下。
        - id: ch05-b07
          speaker: koshchei
          text: 没用的东西，你又为什么绊脚？闻到什么祸事了吗？
        - id: ch05-b08
          speaker: koshchei_horse
          text: 伊凡王子来过，带走了玛丽亚·莫列夫娜。
        - id: ch05-b09
          speaker: koshchei
          text: 我们还能赶上吗？
        - id: ch05-b10
          speaker: koshchei_horse
          text: 天知道！伊凡王子现在有匹比我更好的马。
        - id: ch05-b11
          speaker: koshchei
          text: 我咽不下这口气，非追不可！
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: 科谢追了上去，从马背跃到地上，举起利剑，正要再次把伊凡剁碎。就在那一刻，伊凡的骏马抬起铁蹄，用尽全力踢中科谢，一脚踢裂了他的头骨。伊凡再举起木棒，彻底结果了他。
        - id: ch05-b13
          speaker: narrator
          text: 科谢倒下以后，王子堆起一大堆木柴，亲手点燃火焰。他把不死者放在柴堆上烧成灰烬，又将灰全都撒进风里。玛丽亚·莫列夫娜骑上科谢留下的马，伊凡仍骑着自己的神奇骏马。两人并肩离开那里，先去探望乌鸦和安娜，再去看雄鹰和奥尔加，最后拜访猎鹰和玛丽亚。每到一处，亲人们都欢欢喜喜地迎接他们。
        - id: ch05-b14
          speakers: [raven, eagle, falcon]
          ensemble: chorus
          text: 伊凡，我们真没想到还能见到你！你吃了这么多苦，总算没有白费。像玛丽亚·莫列夫娜这样美丽的人，就算走遍全世界，也找不到第二个！
          emotion: happy
        - id: ch05-b15
          speaker: narrator
          text: 他们一路探亲，一路欢宴，后来才回到自己的王国。这个故事由拉尔斯顿收录。
