  chapters:
    - id: ch01
      title: The Three Storms
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a certain kingdom lived Prince Ivan and his three sisters, Princess Marya, Princess Olga, and Princess Anna. As their father and mother lay dying, they gave Ivan one last command. He must let each sister marry the first suitor who came for her and never keep any of them at home.
        - id: ch01-b02
          speaker: narrator
          text: After their parents died, Ivan buried them. Then he walked with his sisters in the green garden, hoping to ease his grief. A black cloud suddenly covered the sky, and a terrible storm rose around them.
        - id: ch01-b03
          speaker: prince_ivan
          text: Sisters, we must get home!
        - id: ch01-b04
          speaker: narrator
          text: They had barely reached the palace when thunder roared and the ceiling split open. A bright falcon flew into the room, struck the floor, and changed into a brave young man.
        - id: ch01-b05
          speaker: falcon
          text: Greetings, Prince Ivan. I came here once as your guest. Now I have come as a suitor, to ask for Princess Marya's hand.
        - id: ch01-b06
          speaker: prince_ivan
          text: If my sister wishes to marry you, I will not stand in her way. Let the marriage have God's blessing.
        - id: ch01-b07
          speaker: narrator
          text: Princess Marya looked kindly on the Falcon and gave her consent. The two were married, just as Ivan's parents had wished. Then the Falcon took his bride away from her old home and carried her to his own faraway realm.
        - id: ch01-b08
          speaker: narrator
          text: Days followed days and hours chased hours until a whole year had passed. Ivan was walking in the garden with Olga and Anna when another storm cloud rose, filled with wind and lightning.
        - id: ch01-b09
          speaker: prince_ivan
          text: Come inside, sisters!
        - id: ch01-b10
          speaker: narrator
          text: As soon as they entered the palace, thunder crashed. The roof blazed, the ceiling broke apart, and an eagle flew in. It struck the ground and became a brave young man.
        - id: ch01-b11
          speaker: eagle
          text: Greetings, Prince Ivan. Before, I visited as a guest. This time I have come to ask for a bride.
        - id: ch01-b12
          speaker: narrator
          text: The Eagle asked to marry Princess Olga.
        - id: ch01-b13
          speaker: prince_ivan
          text: If Princess Olga favors you, she may marry you. The choice is hers, and I will not interfere.
        - id: ch01-b14
          speaker: narrator
          text: Princess Olga was pleased with the Eagle and freely gave her consent. She married him, and when the wedding was over, the Eagle lifted her up and carried her away to live in his own kingdom.
        - id: ch01-b15
          speaker: narrator
          text: Another year passed. Ivan invited Anna, his youngest sister, to walk with him in the green garden. Before long, a third storm cloud brought wind and lightning.
        - id: ch01-b16
          speaker: prince_ivan
          text: Let us go back inside, Anna.
        - id: ch01-b17
          speaker: narrator
          text: They returned, but before they could sit down, thunder crashed and the ceiling split. A raven flew in and struck the floor. It became a brave youth, handsomer even than the two who had come before.
        - id: ch01-b18
          speaker: raven
          text: Prince Ivan, I was once your guest. Now I am here as a suitor. Give me Princess Anna as my wife.
        - id: ch01-b19
          speaker: prince_ivan
          text: My sister is free to choose. If she comes to love you, then she may marry you.
        - id: ch01-b20
          speaker: narrator
          text: Anna came to love the Raven and agreed to be his wife. After they married, he bore her away to his realm. Now all three sisters were gone, and Ivan was left alone in the palace. He lived without them for one whole year. As the lonely months passed, he grew more and more weary of being by himself.
        - id: ch01-b21
          speaker: prince_ivan
          text: I will go and search for my sisters.
        - id: ch01-b22
          speaker: narrator
          text: He prepared for the journey and rode far away. One day, he found an entire army lying dead across a plain.
        - id: ch01-b23
          speaker: prince_ivan
          text: If anyone here still lives, answer me! Who destroyed this mighty army?
        - id: ch01-b24
          speaker: survivor
          text: The fair warrior princess Marya Morevna destroyed them all.
        - id: ch01-b25
          speaker: narrator
          text: Ivan rode on until he reached a white tent. The fair Marya Morevna came out to meet him.
        - id: ch01-b26
          speaker: marya_morevna
          text: Welcome, Prince. Where is God sending you? Are you riding by your own choice, or because someone forced you?
        - id: ch01-b27
          speaker: prince_ivan
          text: A brave young man never rides against his own will.
        - id: ch01-b28
          speaker: marya_morevna
          text: If your errand can wait, stay in my tent awhile.
        - id: ch01-b29
          speaker: narrator
          text: Ivan had no urgent business, so he gladly accepted her invitation. He spent two nights beneath the white tent, and during that time Marya Morevna came to favor him. She chose him as her husband, and the two were married. Then the fair warrior princess carried Prince Ivan away with her to rule beside her in her own realm.
    - id: ch02
      title: Koshchei Breaks Free
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They lived together for some time. Then Marya Morevna prepared to go to war. She placed Ivan in charge of her whole household, but gave him one warning.
        - id: ch02-b02
          speaker: marya_morevna
          text: Go wherever you like and watch over everything. But you must never look inside that closet.
        - id: ch02-b03
          speaker: narrator
          text: Ivan could not resist. The moment she left, he hurried to the closet and opened it. Inside hung Koshchei the Deathless, bound by twelve chains.
        - id: ch02-b04
          speaker: koshchei
          text: Have mercy, Prince Ivan. Give me some water! I have hung here for ten years without food or drink, and my throat has dried up completely.
        - id: ch02-b05
          speaker: narrator
          text: Ivan brought him a bucket of water. Koshchei emptied it and begged again.
        - id: ch02-b06
          speaker: koshchei
          text: One bucket cannot quench this thirst. Please bring me another.
        - id: ch02-b07
          speaker: narrator
          text: Ivan gave him a second bucket, then a third. When Koshchei swallowed the last drop, all his old strength returned. He shook himself once and snapped all twelve chains.
        - id: ch02-b08
          speaker: koshchei
          text: Thank you, Prince Ivan! You will see your own ears before you ever see Marya Morevna again!
        - id: ch02-b09
          speaker: narrator
          text: Koshchei flew straight out the window in the shape of a terrible whirlwind. He swept over the land until he caught Marya Morevna traveling on her way. Before she could escape, he seized her and carried her back to his own home. When Ivan learned she was gone, he wept bitterly. But grief did not keep him in the palace. He dressed for the road and made himself a promise.
        - id: ch02-b10
          speaker: prince_ivan
          text: Whatever happens, I will find Marya Morevna.
        - id: ch02-b11
          speaker: narrator
          text: On the third dawn of his journey, Ivan saw a wondrous palace. Beside it stood an oak, with a bright falcon perched in its branches. The Falcon flew down, struck the earth, and became a young man.
        - id: ch02-b12
          speaker: falcon
          text: My dear brother-in-law! How have you been?
        - id: ch02-b13
          speaker: narrator
          text: When she heard the Falcon call, Princess Marya ran from the palace and greeted her brother with joy. She wanted to know how he had fared since they parted. Then she told Ivan everything that had happened in her own life. Brother and sister had three days together before Ivan said that he could stay no longer.
        - id: ch02-b14
          speaker: prince_ivan
          text: I cannot remain here. I must search for my wife, the fair Marya Morevna.
        - id: ch02-b15
          speaker: falcon
          text: Finding her will be hard. At least leave us your silver spoon. Whenever we look at it, we will remember you.
        - id: ch02-b16
          speaker: narrator
          text: Ivan left the spoon and continued. At dawn on the third day, he found an even grander palace, with an eagle sitting in an oak nearby. The Eagle flew down, struck the earth, and became a young man.
        - id: ch02-b17
          speaker: eagle
          text: Princess Olga, come quickly! Your dear brother is here!
        - id: ch02-b18
          speaker: narrator
          text: Princess Olga immediately ran out to meet her brother. She kissed him, embraced him, and asked about his health. Then she told him about all that had happened since the Eagle carried her away. Ivan rested in their grand palace for three days, happy to be with his sister again. But when the third day ended, he prepared to continue his search.
        - id: ch02-b19
          speaker: prince_ivan
          text: I cannot stay any longer. I am still searching for my wife, Marya Morevna.
        - id: ch02-b20
          speaker: eagle
          text: You will have a hard time finding her. Leave us your silver fork, so we can look at it and remember you.
        - id: ch02-b21
          speaker: narrator
          text: Ivan left the fork and rode on. On the third morning, he came to the grandest palace yet. A raven sat in the oak beside it. The Raven flew down, struck the earth, and became a young man.
        - id: ch02-b22
          speaker: raven
          text: Princess Anna, come out quickly! Your brother is coming!
        - id: ch02-b23
          speaker: narrator
          text: Princess Anna came running from the palace and welcomed Ivan with delight. She kissed and embraced her brother, asked after his health, and shared the story of her own life. Ivan spent three days with Anna and the Raven. Then the time came for him to take his leave and go on searching.
        - id: ch02-b24
          speaker: prince_ivan
          text: I must go on and find my wife, the fair Marya Morevna.
        - id: ch02-b25
          speaker: raven
          text: She will be difficult to find. Leave your silver snuffbox with us. We will remember you whenever we see it.
        - id: ch02-b26
          speaker: narrator
          text: Ivan handed over his silver snuffbox, said farewell, and continued alone. He traveled for one day and then another. On the third day, at last, he reached the place where Koshchei held Marya Morevna. The moment she saw the man she loved, she rushed to him, flung both arms around his neck, and burst into tears.
        - id: ch02-b27
          speaker: marya_morevna
          text: Oh, Ivan! Why did you disobey me? Why did you open the closet and release Koshchei the Deathless?
          emotion: sad
        - id: ch02-b28
          speaker: prince_ivan
          text: Forgive me, Marya. Let the past go. Koshchei is away, so come with me now. Perhaps he will not catch us.
        - id: ch02-b29
          speaker: narrator
          text: They fled together. Toward evening, Koshchei was riding home from the hunt when his good steed stumbled.
        - id: ch02-b30
          speaker: koshchei
          text: Why did you stumble, you miserable beast? Do you sense trouble?
        - id: ch02-b31
          speaker: koshchei_steed
          text: Prince Ivan has come and taken Marya Morevna away.
        - id: ch02-b32
          speaker: koshchei
          text: Can we catch them?
        - id: ch02-b33
          speaker: koshchei_steed
          text: You could sow wheat and wait for it to grow. You could reap and thresh it, grind it into flour, bake five pies, and eat every one. Even if we started after that, we would still catch them.
        - id: ch02-b34
          speaker: narrator
          text: Koshchei galloped after them and soon caught up.
        - id: ch02-b35
          speaker: koshchei
          text: I will forgive you this once because you gave me water. I will even forgive you a second time. But beware of the third. Then I will cut you to pieces.
        - id: ch02-b36
          speaker: narrator
          text: Koshchei tore Marya Morevna away from Ivan and carried her home. Left behind, Ivan sank onto a stone and wept. He cried for a long time, but he would not abandon her. He followed them back to Koshchei's home and waited until the Deathless one had gone out again. Then he slipped inside to find Marya.
        - id: ch02-b37
          speaker: prince_ivan
          text: Come, Marya. Let us escape again.
        - id: ch02-b38
          speaker: marya_morevna
          text: Ivan, he will catch us.
          emotion: fearful
        - id: ch02-b39
          speaker: prince_ivan
          text: Even if he does, we will have an hour or two together.
        - id: ch02-b40
          speaker: narrator
          text: They fled. On his way home, Koshchei's steed stumbled once more.
        - id: ch02-b41
          speaker: koshchei
          text: Why are you stumbling? Do you smell danger?
        - id: ch02-b42
          speaker: koshchei_steed
          text: Prince Ivan has taken Marya Morevna again.
        - id: ch02-b43
          speaker: koshchei
          text: Will we catch them?
        - id: ch02-b44
          speaker: koshchei_steed
          text: You could sow barley and wait for the crop. You could reap it, thresh it, brew beer, drink until you were full, and sleep as long as you liked. We would still overtake them afterward.
        - id: ch02-b45
          speaker: narrator
          text: Koshchei caught Ivan again.
        - id: ch02-b46
          speaker: koshchei
          text: Did I not warn you? You will no more see Marya Morevna than you can see your own ears.
        - id: ch02-b47
          speaker: narrator
          text: Koshchei seized Marya Morevna and carried her home once more, leaving Ivan alone on the road. Ivan wept until his tears were spent. Yet even that second warning could not turn him back. He returned to Koshchei's home for a third time and found Marya while her captor was away.
        - id: ch02-b48
          speaker: prince_ivan
          text: Marya, we must flee.
        - id: ch02-b49
          speaker: marya_morevna
          text: He is certain to catch us, and this time he will cut you apart.
          emotion: fearful
        - id: ch02-b50
          speaker: prince_ivan
          text: Then let him do it. I cannot live without you.
        - id: ch02-b51
          speaker: narrator
          text: They escaped once more. Koshchei was returning home when his horse stumbled beneath him.
        - id: ch02-b52
          speaker: koshchei
          text: Why did you stumble? Do you sense trouble?
        - id: ch02-b53
          speaker: koshchei_steed
          text: Prince Ivan has come and carried off Marya Morevna.
        - id: ch02-b54
          speaker: narrator
          text: Koshchei raced after Ivan, caught him, and chopped him into little pieces. He put the pieces in a barrel, sealed it with pitch and iron hoops, and threw it into the blue sea. Then he took Marya Morevna home.
    - id: ch03
      title: The Waters of Death and Life
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At that very moment, the silver spoon, fork, and snuffbox Ivan had left with his brothers-in-law all turned black.
        - id: ch03-b02
          speakers: [falcon, eagle, raven]
          ensemble: chorus
          text: Something terrible has happened!
        - id: ch03-b03
          speaker: narrator
          text: The three brothers-in-law set to work at once. The Eagle spread his great wings and hurried to the blue sea. He found the pitch-covered barrel among the waves, caught hold of it, and dragged it safely onto the shore. Meanwhile, the Falcon flew away to fetch the Water of Life, and the Raven went in search of the Water of Death. When all three met again, they broke the iron hoops, opened the barrel, washed Ivan's remains, and carefully set every piece in its proper place.
        - id: ch03-b04
          speaker: narrator
          text: The Raven sprinkled him with the Water of Death. The pieces joined and his body became whole. Then the Falcon sprinkled him with the Water of Life. Ivan shuddered, rose to his feet, and opened his eyes.
        - id: ch03-b05
          speaker: prince_ivan
          text: Ah, I have been asleep for such a long time!
          emotion: surprised
        - id: ch03-b06
          speakers: [falcon, eagle, raven]
          ensemble: chorus
          text: You would have slept much longer without us. Come home and visit us now.
        - id: ch03-b07
          speaker: prince_ivan
          text: No, brothers. I must go and find Marya Morevna.
        - id: ch03-b08
          speaker: narrator
          text: Ivan refused to turn aside from his purpose. He traveled until he found Marya Morevna once again. This time he knew that escape was useless while Koshchei rode such a swift horse. He asked Marya to learn where the Deathless one had found that remarkable steed. She returned to Koshchei, waited until the right moment, and gently led him into speaking about it.
        - id: ch03-b09
          speaker: koshchei
          text: Beyond three times nine lands, in the thirtieth kingdom, Baba Yaga lives across the fiery river. Her mare can fly around the whole world in a day, and she owns many other splendid mares. I guarded her herd for three days without losing one. In return, she gave me a foal.
        - id: ch03-b10
          speaker: marya_morevna
          text: But how did you cross the fiery river?
        - id: ch03-b11
          speaker: koshchei
          text: I have a magic handkerchief. Three waves on the right make a bridge so high that the flames cannot reach it.
        - id: ch03-b12
          speaker: narrator
          text: Marya Morevna repeated everything to Ivan. She also stole the handkerchief and gave it to him. With it, Ivan crossed the fiery river and continued toward Baba Yaga's home.
    - id: ch04
      title: The Road to Baba Yaga
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Ivan traveled a long way with nothing to eat or drink. At last he saw a strange bird with her young.
        - id: ch04-b02
          speaker: prince_ivan
          text: I will eat one of these chicks.
        - id: ch04-b03
          speaker: outlandish_bird
          text: Please do not eat my chick, Prince Ivan. Someday I will repay your kindness.
        - id: ch04-b04
          speaker: narrator
          text: Ivan spared it and went on. In the forest he found a beehive.
        - id: ch04-b05
          speaker: prince_ivan
          text: I will take a little honeycomb.
        - id: ch04-b06
          speaker: queen_bee
          text: Do not disturb my honey, Prince Ivan. One day I will do you a good turn.
        - id: ch04-b07
          speaker: narrator
          text: He left the hive alone. Farther on, he met a lioness with her cub.
        - id: ch04-b08
          speaker: prince_ivan
          text: I am so hungry that I feel ill. I will have to eat this lion cub.
        - id: ch04-b09
          speaker: lioness
          text: Please spare us, Prince Ivan. Someday I will help you in return.
        - id: ch04-b10
          speaker: prince_ivan
          text: Very well. I will leave you both alone.
        - id: ch04-b11
          speaker: narrator
          text: Ivan kept his word to the lioness and walked on without food. Hungry, faint, and growing weaker, he wandered farther and farther until Baba Yaga's house finally came into view. Twelve tall poles stood in a ring around it. A human head stared down from each of the first eleven poles. Only the twelfth remained bare, as though it were waiting for one more unfortunate visitor.
        - id: ch04-b12
          speaker: prince_ivan
          text: Greetings, Grandmother.
        - id: ch04-b13
          speaker: baba_yaga
          text: Greetings, Prince Ivan. Why are you here? Did you come freely, or were you forced?
        - id: ch04-b14
          speaker: prince_ivan
          text: I have come to earn a heroic steed from you.
        - id: ch04-b15
          speaker: baba_yaga
          text: Then serve me for three days. Guard my mares without losing a single one, and I will give you such a steed. Fail, and your head will fill that last empty pole. Do not complain afterward.
        - id: ch04-b16
          speaker: narrator
          text: Ivan accepted her dangerous terms. Baba Yaga first gave him food and drink, and then ordered him to begin. He opened the stable and drove all her mares into the fields. The instant they were free, they cocked their tails and tore away in every direction across the wide meadows. They ran so swiftly that before Ivan had time to look around, not one mare remained in sight.
        - id: ch04-b17
          speaker: narrator
          text: Ivan wept with worry. Then he sat on a stone and fell asleep. Near sunset, the strange bird flew down and woke him.
        - id: ch04-b18
          speaker: outlandish_bird
          text: Wake up, Prince Ivan. The mares are home again.
        - id: ch04-b19
          speaker: narrator
          text: Ivan returned and found Baba Yaga raging at the herd.
        - id: ch04-b20
          speaker: baba_yaga
          text: Why did you come back here?
          emotion: angry
        - id: ch04-b21
          speakers: [mare_1, mare_2, mare_3]
          ensemble: chorus
          text: How could we stay away? Birds came from every part of the world and nearly pecked out our eyes!
        - id: ch04-b22
          speaker: baba_yaga
          text: Tomorrow, keep away from the meadows. Scatter through the thick forests instead.
    - id: ch05
      title: The Three Days of Herding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Ivan slept through the night. In the morning, Baba Yaga warned him again.
        - id: ch05-b02
          speaker: baba_yaga
          text: Remember, Prince. Lose even one mare, and your bold head goes on that pole.
        - id: ch05-b03
          speaker: narrator
          text: Ivan drove the herd out. At once, the mares raised their tails and disappeared among the thick trees. Once again he sat on the stone, wept, and fell asleep. After the sun sank behind the forest, the lioness ran up to him.
        - id: ch05-b04
          speaker: lioness
          text: Wake up, Prince Ivan. Every mare has been gathered.
        - id: ch05-b05
          speaker: narrator
          text: Ivan went home. Baba Yaga raged more fiercely than before.
        - id: ch05-b06
          speaker: baba_yaga
          text: Why have you come back again?
          emotion: angry
        - id: ch05-b07
          speakers: [mare_1, mare_2, mare_3]
          ensemble: chorus
          text: We had no choice! Beasts came from all over the world and almost tore us to pieces!
        - id: ch05-b08
          speaker: baba_yaga
          text: Tomorrow, run into the blue sea.
        - id: ch05-b09
          speaker: narrator
          text: Ivan slept through the second night. In the morning, Baba Yaga sent him out to guard the herd and warned that the empty pole still waited for his head. As soon as the mares reached open ground, they lifted their tails, vanished from sight, and fled straight into the blue sea. There they stood in the deep water with only their necks showing. Ivan could neither reach them nor drive them home. He sat on his familiar stone, wept over his helplessness, and finally fell asleep.
        - id: ch05-b10
          speaker: narrator
          text: After sunset, a bee came flying to him.
        - id: ch05-b11
          speaker: queen_bee
          text: Wake up, Prince. The mares are together again. When you return, do not let Baba Yaga see you. Hide in the stable behind the mangers. You will find a miserable colt rolling in the muck. Steal that colt and ride away at midnight.
        - id: ch05-b12
          speaker: narrator
          text: Ivan slipped into the stable and hid behind the mangers. Outside, Baba Yaga was screaming at her mares.
        - id: ch05-b13
          speaker: baba_yaga
          text: Why did you come home?
          emotion: angry
        - id: ch05-b14
          speakers: [mare_1, mare_2, mare_3]
          ensemble: chorus
          text: What else could we do? Bees flew in from every part of the world and stung us until we bled!
        - id: ch05-b15
          speaker: narrator
          text: Baba Yaga went to sleep. At midnight, Ivan stole the wretched colt, saddled it, and galloped to the fiery river. He waved the handkerchief three times on his right. A splendid bridge rose high above the flames.
        - id: ch05-b16
          speaker: narrator
          text: Ivan crossed safely. Then he waved the handkerchief only twice on his left, leaving a bridge as thin as a thread behind him.
        - id: ch05-b17
          speaker: narrator
          text: When Baba Yaga rose in the morning, she went to the stable and saw that the miserable colt was gone. She leaped into her iron mortar and flew after Ivan at full speed. She drove the mortar onward with her heavy pestle and swept away every trace behind her with a broom. Soon she came roaring up to the fiery river. There she stopped and looked over the bridge Ivan had left hanging above the flames.
        - id: ch05-b18
          speaker: baba_yaga
          text: What an excellent bridge!
        - id: ch05-b19
          speaker: narrator
          text: She drove onto it. Halfway across, the bridge broke, and Baba Yaga fell into the fiery river. There she met a cruel death.
        - id: ch05-b20
          speaker: narrator
          text: Ivan fed the colt in green meadows until it grew into a wondrous steed. Then he rode back to Marya Morevna. She ran out, threw her arms around his neck, and cried out in wonder.
        - id: ch05-b21
          speaker: marya_morevna
          text: How did God bring you back to life?
          emotion: surprised
        - id: ch05-b22
          speaker: narrator
          text: Ivan told her everything that had happened.
        - id: ch05-b23
          speaker: prince_ivan
          text: Now come away with me.
        - id: ch05-b24
          speaker: marya_morevna
          text: I am afraid, Ivan. If Koshchei catches us, he will cut you into pieces again.
          emotion: fearful
        - id: ch05-b25
          speaker: prince_ivan
          text: He will not catch us. I have a heroic steed now, and it flies like a bird.
    - id: ch06
      title: The End of Koshchei
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Ivan and Marya Morevna mounted the wondrous horse and rode away. On his journey home, Koshchei felt his own steed stumble beneath him.
        - id: ch06-b02
          speaker: koshchei
          text: Why did you stumble, you sorry beast? Do you sense something wrong?
        - id: ch06-b03
          speaker: koshchei_steed
          text: Prince Ivan has come and carried off Marya Morevna.
        - id: ch06-b04
          speaker: koshchei
          text: Can we catch them?
        - id: ch06-b05
          speaker: koshchei_steed
          text: God alone knows. Prince Ivan has a horse better than I am now.
        - id: ch06-b06
          speaker: koshchei
          text: I cannot endure that. I will chase them anyway.
        - id: ch06-b07
          speaker: narrator
          text: Koshchei drove his weary horse onward and, after a time, came close enough to attack. He sprang down onto the road, drew his sharp sword, and moved to chop Ivan into pieces yet again. Before the blade could fall, Ivan's heroic steed swung one mighty hoof and struck Koshchei with its full strength. The blow cracked his skull. Then Ivan raised his club and made certain that Koshchei the Deathless would never rise again.
        - id: ch06-b08
          speaker: narrator
          text: Ivan piled up wood, burned Koshchei on a funeral fire, and scattered his ashes to the wind. Marya Morevna mounted Koshchei's horse, while Ivan rode his own.
        - id: ch06-b09
          speaker: narrator
          text: Together they began the long journey home, but first they went to visit Ivan's sisters and their husbands. They rode to the Raven's palace, then to the Eagle's, and finally to the Falcon's. At each splendid palace, the sister who lived there hurried out to greet them. Everywhere Ivan and Marya went, their family received them with amazement and joy.
        - id: ch06-b10
          speakers: [raven, eagle, falcon]
          ensemble: chorus
          text: Prince Ivan, we never thought we would see you again! All your trouble was worthwhile. You could search the whole world and never find another woman as beautiful as Marya Morevna.
          emotion: happy
        - id: ch06-b11
          speaker: narrator
          text: So they visited and feasted together. Afterward, Prince Ivan and Marya Morevna rode away to their own realm.
