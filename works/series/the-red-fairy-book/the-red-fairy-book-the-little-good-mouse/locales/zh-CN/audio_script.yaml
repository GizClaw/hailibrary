audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    queen:
      display_name: 王后
      tts:
        delivery: 温柔善良，忧伤时克制，保护孩子时坚定
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高
    jolly_king:
      display_name: 快活国王
      tts:
        delivery: 豪爽勇敢，说话坦荡有力
        timbre: 洪亮温厚
        pace: 稳健
        pitch: 中低
    messenger:
      display_name: 信使
      tts:
        delivery: 急迫沉痛，报告消息干脆直接
        timbre: 清晰有力
        pace: 稍快
        pitch: 中等
    wicked_king:
      display_name: 邪恶国王
      tts:
        delivery: 粗暴阴狠，嘲弄别人时残忍得意
        timbre: 沙哑低沉
        pace: 适中
        pitch: 低
    good_fairy:
      display_name: 善良的仙女
      tts:
        delivery: 聪慧亲切，遇到危险时果断镇定
        timbre: 明亮温暖
        pace: 从容
        pitch: 中等
    old_woman:
      display_name: 老太婆
      tts:
        delivery: 苍老挑剔，发怒时尖刻刻薄
        timbre: 干涩苍老
        pace: 稍慢
        pitch: 中高
    delicia:
      display_name: 德莉西娅
      tts:
        delivery: 年轻真诚，温柔中带着不肯屈服的勇气
        timbre: 清澈明亮
        pace: 适中
        pitch: 中高
    wicked_prince:
      display_name: 邪恶的王子
      tts:
        delivery: 任性自负，发脾气时尖厉蛮横
        timbre: 年轻偏冷
        pace: 稍快
        pitch: 中等
    guard_1:
      display_name: 卫兵甲
      tts:
        delivery: 奉命行事，面对公主时拘谨恭敬
        timbre: 平实清晰
        pace: 适中
        pitch: 中低
    guard_2:
      display_name: 卫兵乙
      tts:
        delivery: 奉命行事，面对公主时拘谨恭敬
        timbre: 平实清晰
        pace: 适中
        pitch: 中等
    subject_1:
      display_name: 百姓甲
      tts:
        delivery: 久经苦难后终于振奋，声音真诚热烈
        timbre: 明亮朴实
        pace: 适中
        pitch: 中等
    subject_2:
      display_name: 百姓乙
      tts:
        delivery: 久经苦难后终于振奋，声音真诚热烈
        timbre: 温厚朴实
        pace: 适中
        pitch: 中低
    subject_3:
      display_name: 百姓丙
      tts:
        delivery: 久经苦难后终于振奋，声音真诚热烈
        timbre: 清亮朴实
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 欢乐国与眼泪国
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王和一位王后，他们彼此深爱，只有待在一起才觉得快活。他们天天出门打猎或钓鱼，夜夜参加舞会或去看歌剧，还会唱歌、跳舞、吃糖果，真是世上最快活的一对。臣民也都学他们的样子，所以国家叫欢乐国。邻国却处处相反，名字也叫眼泪国。那里的国王又凶又阴沉，从来不肯享一点乐。他长得丑，脸色又难看，臣民见了都怕。他尤其痛恨笑脸，谁敢让他撞见在笑，当场就会被砍头。他听说快活国王生活幸福，嫉妒得发了狂，马上召集大军前来攻打。敌军逼近的消息很快传进宫里，王后吓得魂不附体，失声哭了起来。
        - id: ch01-b02
          speaker: queen
          text: 陛下，我们带上财宝逃走吧。逃得越远越好，一直逃到世界另一边去。
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 国王听完，马上拒绝了她。
        - id: ch01-b04
          speaker: jolly_king
          text: 夫人，我不能做胆小鬼。与其临阵脱逃，我宁可战死。
        - id: ch01-b05
          speaker: narrator
          text: 他立即召集所有武装起来的将士，依依不舍地告别王后，跨上那匹出色的骏马出征。王后一直望着，直到再也看不见他的身影。此后她只会流泪，绞着双手不停哀哭。她怕国王战死，也怕自己和小女儿从此无依无靠，愁得一口饭也吃不下，夜里同样无法入睡。起初国王每天都会捎回一封信。可终于有一天早晨，王后从宫窗向外望去，看见一个信使正快马加鞭地赶来。
        - id: ch01-b06
          speaker: queen
          text: 信使，快告诉我，前方有什么消息？
          emotion: fearful
        - id: ch01-b07
          speaker: messenger
          text: 我们战败了，国王已经阵亡。敌人马上就会打进来。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 可怜的王后向后一倒，当场失去了知觉。侍女们把她抬上床，围在旁边哭成一片。没过多久，外面响起震天的喧闹，整座宫殿乱作一团，她们知道敌人已经到了。紧接着，大家听见邪恶的国王亲自跺着脚在宫里到处寻找王后。侍女们连忙把小公主塞进她怀中，再用被子把母女俩从头到脚蒙得严严实实，随后各自逃命。王后躺在那里浑身发抖，只盼着敌人找不到自己。可邪恶的国王还是叮叮当当地闯进房来。他大声叫王后，王后不敢答应，气得他一把掀开丝绸被褥，扯掉她的花边睡帽。秀发一下披落到她肩头，国王便把长发在手上绕了三圈，将她甩到肩上，像扛一袋面粉那样扛走了。
        - id: ch01-b09
          speaker: narrator
          text: 王后把小女儿紧紧护在怀里，高声求饶。邪恶的国王不但毫无怜悯，反而嘲笑她，还叫她继续喊下去，说听着很有趣。他跨上高大的黑马，把母女带回眼泪国。一到那里，便声称要把她们吊死在最近的一棵树上。大臣们劝他说，这样未免可惜，婴儿长大后正好可以嫁给他的独生子。国王很喜欢这个主意，便把王后关在高塔最顶端的小屋里。屋子小得可怜，里面也十分寒酸，只有一张桌子和一张直接铺在地板上的硬床。
        - id: ch01-b10
          speaker: narrator
          text: 接着，国王派人请来一位住在附近的仙女。他破例客客气气地接待她，还设下丰盛的筵席款待她。吃过以后，他亲自领仙女登上高塔去看王后。仙女见王后被关在这间破屋里，生活如此凄惨，心里十分难过。她俯身吻王后的手时，趁机悄悄安慰她。
        - id: ch01-b11
          speaker: good_fairy
          text: 夫人，勇敢些。我想，我已经看见帮助你的办法了。
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: 王后心里有了一点希望，恳求仙女怜悯命运骤变的小公主。国王见两人低声交谈，立刻恼怒起来。
        - id: ch01-b13
          speaker: wicked_king
          text: 别再讲漂亮话了。我叫你来，是要知道这孩子长大后会不会美丽，会不会有福气。
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 仙女回答说，小公主长大以后会美丽、聪明，而且教养极好，再也没有谁能胜过她。老国王便朝王后咆哮，说她幸亏生了这样一个女儿，不然母女俩一定都会上绞架。说罢，他跺着脚走了，还把仙女一同带走，只留下可怜的王后独自流泪。王后心里十分矛盾。她不愿女儿长大后嫁给国王那个侏儒般的可怕儿子，可孩子若是不美，母女俩又会被杀。她只盼能把孩子藏到什么地方，让残忍的国王永远也找不到。
    - id: ch02
      title: 高塔里的小老鼠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 日子一天天过去，王后和小公主越来越瘦。狠心的狱卒每天只送三颗煮豌豆和一小丁点黑面包，她们从早到晚都饿得厉害。国王又十分贪婪，逼着王后昼夜不停地工作。一个傍晚，王后正坐在纺车旁干活，忽然看见一只小巧漂亮的老鼠从墙洞里钻了出来。
        - id: ch02-b02
          speaker: queen
          text: 小东西，你在这里找不到吃的。我一天只有三颗豌豆，你若不想挨饿，还是去别处吧。
        - id: ch02-b03
          speaker: narrator
          text: 小老鼠却东跑西跳，舞得十分可爱。王后看得开心，把留作晚饭的最后一颗豌豆也给了它。
        - id: ch02-b04
          speaker: queen
          text: 来，把它吃了吧。我没有更好的东西，可你逗我快活，这颗豌豆是我诚心送你的。
        - id: ch02-b05
          speaker: narrator
          text: 话刚说完，桌上便出现一只香喷喷的烤鹧鸪和两碟蜜饯。王后说，好心果然有好报。她和小公主美美地吃了晚饭，又把剩下的食物全送给小老鼠。小家伙吃饱以后，舞得比先前更加起劲。第二天，狱卒拿来三颗豌豆，还故意放在一只大盘子里，好让它们显得更小。盘子刚落到桌上，小老鼠就跑来把三颗全吃光了。王后到午饭时什么也没剩，气得抱怨这只坏老鼠再这样下去，自己就要活活饿死。可她再低头看盘子，那里已经堆满各式各样的美味。王后饱餐了一顿，心情也比往常开朗。后来坐回纺车旁，她又担心小公主长得不够美，不能让国王满意，只盼着能想出办法逃走。
        - id: ch02-b06
          speaker: narrator
          text: 小老鼠这时正在墙角摆弄几根长麦秆。王后拿来编织，说麦秆若是足够，她就能做一只篮子，把孩子从窗口放下去，交给好心的过路人照料。等她编完手里的麦秆，小老鼠已经一趟趟拖来更多，直到多得足够做成篮子。王后日夜不停地编，它便在旁边跳舞给她解闷。每到吃饭时，王后都把三颗豌豆和那丁点黑面包送给它，盘子里总会出现好菜替代。她怎么也猜不出这些食物来自哪里。篮子终于编好那天，王后从窗口探身向塔下张望，盘算要搓一根多长的绳子。就在这时，她看见一个拄着手杖的小老太婆正仰头望她。
        - id: ch02-b07
          speaker: old_woman
          text: 夫人，我知道你为什么发愁。只要你愿意，我可以帮忙。
        - id: ch02-b08
          speaker: queen
          text: 请你在我约定的时辰来吧。我会把孩子装在篮里放下去。请替我抚养她，等我重新富有，一定重重酬谢你。
        - id: ch02-b09
          speaker: old_woman
          text: 我不要酬谢。不过我吃东西很挑剔，最爱肥嫩的小老鼠。你阁楼里若有一只，就扔下来给我。我保证把孩子照顾好。
        - id: ch02-b10
          speaker: narrator
          text: 王后哭了，没有回答。老太婆等了一会儿，追问她出了什么事。
        - id: ch02-b11
          speaker: queen
          text: 阁楼里只有一只老鼠。它又亲人又漂亮，我一想到它会被杀死，心里就受不了。
          emotion: sad
        - id: ch02-b12
          speaker: old_woman
          text: 什么！你把一只倒霉的老鼠看得比亲生孩子还重？那你就留下来陪它吧。我想吃多少老鼠都找得到，用不着求你！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 老太婆一边嘀咕咒骂，一边蹒跚着走了。王后失望极了。哪怕当天饭菜比往常更好，小老鼠也舞得格外欢快，她还是只顾伤心哭泣。夜里，孩子睡熟以后，王后把她安顿在篮子里，又拿出一张纸条，写明这个不幸的小姑娘名叫德莉西娅，然后把纸条别在孩子的衣服上。她悲伤地伸手去合篮盖，小老鼠却忽然跳了进去，坐到了婴儿的枕边。
        - id: ch02-b14
          speaker: queen
          text: 小家伙，我为了救你，失去了安置德莉西娅的机会。别人早把你交给那个贪吃的老太婆了，可我实在不忍心。如今，我怎么知道女儿会不会得到照料呢？
          emotion: sad
        - id: ch02-b15
          speaker: good_fairy
          text: 夫人，相信我。你绝不会后悔今天的善意。
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: 王后听见小老鼠开口说话，已经惊讶得不知如何是好。接下来发生的变化更叫她不敢相信自己的眼睛。小老鼠尖尖的鼻子渐渐化作一张美丽的脸，四只小爪子变成了人的手脚，矮小的身体也忽然长得高挑起来。王后终于认出，眼前正是跟随邪恶国王来高塔探望过她的那位仙女。
        - id: ch02-b17
          speaker: good_fairy
          text: 我想知道，你能不能真心把我当作朋友。仙女什么都有，偏偏很难找到朋友。为了好处才亲近我的人，我一个也不算。你疼爱那只小老鼠时，并不知道能得到什么。我又变成窗下的老太婆考验你，这才确信你真的爱我。
        - id: ch02-b18
          speaker: queen
          text: 像你这样可爱的人，怎么可能缺少朋友呢？
          emotion: surprised
        - id: ch02-b19
          speaker: narrator
          text: 仙女转向小公主，在她红润的嘴唇上亲了三次。
        - id: ch02-b20
          speaker: good_fairy
          text: 小宝贝，我答应你，你会比父亲更加富有，会活到一百岁，永远美丽幸福，不怕衰老，也不会长皱纹。
        - id: ch02-b21
          speaker: narrator
          text: 王后欣喜万分，满怀感激地向仙女道谢，又请她照顾德莉西娅，把孩子当作亲生女儿抚养。仙女一口答应下来。她们合上篮子，小心翼翼地把篮子连同婴儿一起放到高塔脚下。仙女随后重新化作小老鼠，这件事只耽搁了短短几秒。可等她敏捷地顺着麦秆绳爬到塔底，篮子里的孩子竟然不见了。仙女吓得魂飞魄散，马上又爬回王后身边。
        - id: ch02-b22
          speaker: good_fairy
          text: 全完了！我的仇敌康卡琳偷走了公主。她残忍又恨我，年纪比我大，法力也比我强。我斗不过她，也想不出办法从她手里救回德莉西娅。
          emotion: fearful
        - id: ch02-b23
          speaker: narrator
          text: 王后心都碎了，求仙女尽力寻找女儿。狱卒恰好进来，发现公主失踪，马上报告国王。国王怒气冲冲地逼问，王后只说一个不知名的仙女强行带走了孩子。
        - id: ch02-b24
          speaker: wicked_king
          text: 我要绞死你！我早就告诉过你，你一定会上绞架！
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: 他一句话也不肯多听，拖着不幸的王后来到最近的一片树林，自己爬上树寻找能吊死她的枝杈。隐去身形、一路跟来的仙女等他爬得很高，猛地推了他一把。国王脚下一滑，轰然摔到地面，一下撞断四颗牙。趁他忙着修补牙齿，仙女用飞车把王后带到一座美丽的城堡。她待王后好极了，若不是失去德莉西娅，王后原本可以在那里过得十分快乐。善良的小老鼠用尽全力寻找，却始终查不到康卡琳把小公主藏在何处。
    - id: ch03
      title: 火鸡姑娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就这样过了十五年，王后才慢慢从悲痛中恢复。一天，她们听说邪恶国王的儿子想娶一个看守火鸡的姑娘，姑娘却坚决不肯。尽管如此，婚礼礼服已经做好，庆典也准备得盛大无比，方圆许多里的人都赶来，想亲眼看看这场婚礼。王后十分好奇，究竟是什么样的火鸡姑娘，竟然不愿意成为王后。善良的仙女便化作小老鼠，亲自赶到养禽场探个究竟。
        - id: ch03-b02
          speaker: narrator
          text: 火鸡姑娘独自坐在一块大石头上。她赤着脚，穿一身粗旧的亚麻布衣，头上还戴着破帽子，看起来寒酸极了。金银衣袍、缎带花边、钻石珍珠散满她脚边，火鸡却毫不在意地踩着这些宝物来回踱步。丑陋又讨厌的王子就站在她对面，怒气冲冲地宣布，她若是不肯嫁给自己，就一定要被处死。
        - id: ch03-b03
          speaker: delicia
          text: 我永远不会嫁给你！你长得丑，脾气又和你残忍的父亲一模一样。让我安静地陪着火鸡吧。比起这些华丽礼物，我更喜欢它们。
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 小老鼠躲在一旁，满怀赞叹地望着她。这个衣衫寒酸的姑娘虽然整天照管火鸡，却美得像春天一样。小老鼠一直等到邪恶的王子走远，才从藏身之处出来，化成一个上了年纪的乡下老太婆，慢慢走到姑娘面前和她搭话。
        - id: ch03-b05
          speaker: good_fairy
          text: 你好呀，漂亮姑娘！你养着一群多好的火鸡。
        - id: ch03-b06
          speaker: delicia
          text: 他们偏要我丢下火鸡，去做一个苦命的王后。您说，我该怎么办呢？
        - id: ch03-b07
          speaker: good_fairy
          text: 孩子，王冠看着漂亮，可你不知道要付出什么代价，也不知道它戴起来有多沉。
        - id: ch03-b08
          speaker: delicia
          text: 我知道得够清楚，所以才不肯戴。我不知道父亲是谁，也不知道母亲是谁，在世上连一个朋友都没有，可我还是不愿意。
        - id: ch03-b09
          speaker: good_fairy
          text: 你的善良和美貌，比十个王国都珍贵。告诉我，你为什么会来到这里，又为什么没有父母朋友？
        - id: ch03-b10
          speaker: delicia
          text: 都是康卡琳仙女害的。我跟她生活时，只有毒打和恶言。后来实在忍不下去，便逃了出来，也不知道要去哪儿。我穿过树林时遇见王子，他让我照管养禽场。我高兴地答应了，没想到从此天天都得见他。现在他还要娶我，我死也不会答应。
        - id: ch03-b11
          speaker: narrator
          text: 仙女听完这些经历，心里再也没有怀疑。眼前这个受尽欺凌、宁可看守火鸡也不肯嫁给恶人的姑娘，正是她寻找了十五年的德莉西娅公主。为了得到最后的确认，她温柔地问起姑娘的名字。
        - id: ch03-b12
          speaker: delicia
          text: 您若愿意听，我名叫德莉西娅。
        - id: ch03-b13
          speaker: narrator
          text: 仙女搂住她，亲得她几乎喘不过气。
        - id: ch03-b14
          speaker: good_fairy
          text: 德莉西娅，我是你的老朋友，终于找到你了！不过，这条旧裙子只配给厨房女佣穿。换上这件漂亮衣裳，让我看看会有什么不同。
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: 德莉西娅摘下难看的破帽，抖开满头闪亮的金发，又走到附近的清泉边，把双手和脸庞洗得干干净净。清水洗过以后，她的两颊红润得像玫瑰。她戴起仙女送的钻石，再穿上那件华美长袍，立刻成了世上最美丽的公主。仙女在旁边看着，简直高兴得不得了。
        - id: ch03-b16
          speaker: good_fairy
          text: 这才是你本来的模样。德莉西娅，你自己觉得怎么样？
        - id: ch03-b17
          speaker: delicia
          text: 我觉得自己像一位伟大国王的女儿。
        - id: ch03-b18
          speaker: good_fairy
          text: 如果你真是国王的女儿，会高兴吗？
        - id: ch03-b19
          speaker: delicia
          text: 我当然会高兴。
        - id: ch03-b20
          speaker: good_fairy
          text: 那么，明天我或许会带给你一个好消息。
        - id: ch03-b21
          speaker: narrator
          text: 仙女留下这句暗示，匆匆赶回自己的城堡。王后正坐在那里忙着刺绣，还不知道失散多年的女儿已经找到了。仙女一进门，便再也压不住心中的喜悦，兴冲冲地向她开口。
        - id: ch03-b22
          speaker: good_fairy
          text: 夫人，你敢拿顶针和金针打赌吗？我带来的正是你最想听的好消息。
        - id: ch03-b23
          speaker: queen
          text: 快活国王死了，德莉西娅也丢了。自那以后，世上任何消息对我都一文不值。
          emotion: sad
        - id: ch03-b24
          speaker: good_fairy
          text: 别再伤心了。公主好端端的，而且我从没见过像她那么美丽的人。只要她愿意，明天就能做王后。
        - id: ch03-b25
          speaker: narrator
          text: 仙女把自己如何找到德莉西娅、又如何认出她的经过从头讲了一遍。王后想到女儿长得如此美丽，先是欢喜不已，紧接着又想到她这些年竟成了一个衣衫褴褛的火鸡姑娘，忍不住流下泪来。
        - id: ch03-b26
          speaker: queen
          text: 我决不许他们逼她嫁给邪恶国王的儿子。我们现在就去接她。
    - id: ch04
      title: 黑牢与复仇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就在王后和仙女准备出发的时候，邪恶的王子还在为德莉西娅拒绝自己大发脾气。他独自坐在一棵树下，又哭又叫，满腔怨恨地号啕不止，声音大得传进王宫。国王终于听不下去，从窗口探出头来喝问他。
        - id: ch04-b02
          speaker: wicked_king
          text: 你怎么了？为什么闹出这么大的动静？
        - id: ch04-b03
          speaker: wicked_prince
          text: 都怪那个火鸡姑娘，她不肯爱我！
          emotion: angry
        - id: ch04-b04
          speaker: wicked_king
          text: 她不肯爱你？那我们马上看看她还敢不敢。卫兵，把德莉西娅抓来！看我能不能让她立刻改变心意。
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 卫兵奉命赶到养禽场，把那里里外外搜了一遍，却只见到德莉西娅一个人。她早已不再是那个衣衫破旧的火鸡姑娘。此刻，她穿着华美的长裙，头戴璀璨的钻石王冠，看起来就是一位真正的公主，美得让卫兵几乎不敢开口。德莉西娅见他们迟迟不说话，便很有礼貌地主动问起他们在找谁。
        - id: ch04-b06
          speakers: [guard_1, guard_2]
          ensemble: duo
          text: 夫人，我们奉命来找一个微不足道的小人物。她名叫德莉西娅。
        - id: ch04-b07
          speaker: delicia
          text: 唉，那正是我的名字。你们找我有什么事呢？
        - id: ch04-b08
          speaker: narrator
          text: 卫兵怕她逃走，拿粗绳把她的手脚全都捆住，将她押到正在等候的国王和王子面前。国王看见她时，被她的美貌惊得说不出话来。任何一个心肠没那么硬的人，见她被绳索捆着都会生出怜惜。可是邪恶的国王丝毫没有动心，反倒哈哈大笑，百般嘲弄她。
        - id: ch04-b09
          speaker: wicked_king
          text: 你这个小丑八怪、小癞蛤蟆！我儿子比你英俊，也比你好，你凭什么不爱他？马上爱上他，不然我就在你身上涂满焦油，再滚一层羽毛！
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 小公主吓得浑身发抖，跪下来求他。
        - id: ch04-b11
          speaker: delicia
          text: 求求您，别给我涂焦油、滚羽毛。那会难受极了。请给我两三天，让我拿定主意。到时候，您想怎样处置我都行。
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: 邪恶的王子很想立刻看她被涂上焦油、滚满羽毛，国王却同意给她几天，把她关进一间阴暗的地牢。王后和仙女恰在此时乘着飞车赶到，却还是晚了一步。王后听说女儿已经被捕，痛苦万分，哀叹自己注定一生不幸，再也不会有好日子。仙女却不许她绝望，叫她鼓起勇气等待。
        - id: ch04-b13
          speaker: good_fairy
          text: 他们欠下的账，我一定要讨回来。
        - id: ch04-b14
          speaker: narrator
          text: 当天夜里，邪恶的国王刚刚上床，仙女便化作小老鼠，悄悄爬上他的枕头，张口啃起一只耳朵。国王痛得大声尖叫，连忙翻身转向另一边。可这根本没有用，小老鼠马上跑过去啃他的第二只耳朵，而且啃得比第一只还疼。国王一会儿大喊杀人，一会儿又喊有贼。所有卫兵都跑来察看，却什么也找不到，连个人影也没看见。小老鼠早已溜进王子的房间，正用一模一样的办法收拾他。整整一夜，她都在父子两人之间来回奔跑。国王吓得发狂，又一夜没睡，终于冲出了王宫。
        - id: ch04-b15
          speaker: wicked_king
          text: 救命！快救救我！一群大老鼠正在追我！
          emotion: fearful
        - id: ch04-b16
          speaker: narrator
          text: 王子在自己的房里听见父亲的喊声，也顾不得被啃疼的耳朵，赶紧起床追了出去。国王在前面狂奔，王子紧跟在后面。父子俩还没有跑出多远，便一脚踏空，一起跌进河里。从那以后，再也没有任何人见过他们。
    - id: ch05
      title: 德莉西娅女王
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 善良的仙女赶去把消息告诉王后，两人一起来到关押德莉西娅的黑牢。仙女用魔杖轻轻一碰，面前的牢门便立刻弹开。可是她们足足穿过四十扇门，才终于看见公主垂头丧气地坐在地上。王后冲了进去，一分钟里足足亲了她二十次。她又哭又笑，把德莉西娅的身世从头到尾讲给她听。公主得知一切，欢喜得几乎发了狂。接着，仙女拿出特意给她带来的奇妙衣裙和各式珠宝。
        - id: ch05-b02
          speaker: good_fairy
          text: 别再耽搁了。我们得去向百姓讲话。
        - id: ch05-b03
          speaker: narrator
          text: 仙女神情端庄肃穆地走在最前面，身上那条长裙的拖尾足足有十厄尔。王后跟在她身后，穿着一件绣满金线的蓝色天鹅绒长袍，头上的钻石王冠比太阳还要明亮。德莉西娅走在最后，她美得令人惊叹，简直像个奇迹。三人穿过一条又一条街道，无论遇见显贵还是平民，都一一向他们的问候还礼。百姓纷纷转身跟在后面，猜测这三位高贵的夫人究竟是谁。
        - id: ch05-b04
          speaker: narrator
          text: 等议事大厅里挤满了人，仙女便告诉眼泪国的臣民，德莉西娅正是快活国王的女儿。大家若愿意拥立她为女王，仙女便负责替她找到一位称心如意的丈夫。她还向所有人保证，在这对夫妻统治的日子里，国内只会有欢庆和宴饮，所有阴郁悲苦的事情都会被彻底赶走。
        - id: ch05-b05
          speakers: [subject_1, subject_2, subject_3]
          ensemble: chorus
          text: 我们愿意！我们愿意！我们已经阴郁痛苦得太久啦！
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 百姓手拉着手，围着王后、德莉西娅和善良的仙女跳舞。
        - id: ch05-b07
          speakers: [subject_1, subject_2, subject_3]
          ensemble: chorus
          text: 愿意，愿意！我们愿意，我们愿意！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 于是，城里每一条街都摆起宴席，夜空中到处绽放焰火。第二天清早，仙女乘着飞车回来了。原来，她在夜里走遍世界各地，终于选中了世上最英俊、脾气也最温和的王子，并把他带到德莉西娅面前。两人的目光刚刚相遇，德莉西娅便爱上了他。至于那位王子，自然也觉得自己成了世上最幸运的人。王后终于相信，自己一生中所有的不幸都已经走到尽头。从此以后，他们永远幸福地生活在一起。
