  chapters:
    - id: ch01
      title: The Joyous Land Falls
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a King and Queen who loved one another so dearly that they were only happy together. Day after day they went hunting or fishing. Night after night they attended balls or the opera, where they sang, danced, and ate sugar-plums. They were the merriest people anyone could imagine. All their subjects followed their happy example, until the whole kingdom became known as the Joyous Land.
        - id: ch01-b02
          speaker: narrator
          text: The neighboring kingdom could not have been more different. Its King was savage, sullen, and never enjoyed anything at all. He looked so ugly and angry that every one of his subjects feared him. He hated the very sight of a cheerful face. If he caught anyone smiling, he ordered that person's head cut off that very minute. No wonder his kingdom was called the Land of Tears.
        - id: ch01-b03
          speaker: narrator
          text: When this wicked King heard how happy the Jolly King was, jealousy filled him. He raised a vast army and marched against the Joyous Land. As soon as the Queen heard that he was coming, she began to weep in terror.
        - id: ch01-b04
          speaker: queen
          text: Sire, let us gather all our treasure and flee as far as we can, even to the other side of the world!
          emotion: fearful
        - id: ch01-b05
          speaker: jolly_king
          text: Fie, madam! I am too brave to run away. I would rather die than be a coward.
        - id: ch01-b06
          speaker: narrator
          text: The King called his armed men together. After a tender farewell to the Queen, he mounted his splendid horse and rode away. She watched until he vanished, then wrung her hands and wept.
        - id: ch01-b07
          speaker: queen
          text: Oh, if the King is killed, what will become of my little daughter and me?
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Her sorrow was so great that she could neither eat nor sleep. A letter came from the King each day. Then one morning, as she watched from a palace window, she saw a courier racing toward her.
        - id: ch01-b09
          speaker: queen
          text: What news do you bring? Tell me quickly!
          emotion: fearful
        - id: ch01-b10
          speaker: courier
          text: We have lost the battle. The King is dead, and the enemy will be here at any moment.
        - id: ch01-b11
          speaker: narrator
          text: The Queen fell backward in a faint. Her ladies carried her to bed, then stood around her weeping and wailing. Soon a tremendous noise and confusion swept through the palace. They knew the enemy had arrived. Before long, they heard the wicked King himself stamping from room to room as he searched for the Queen.
        - id: ch01-b12
          speaker: narrator
          text: The ladies placed the little Princess in her mother's arms, pulled the bedclothes over them both from head to foot, and fled for their lives. The Queen lay trembling beneath the covers, scarcely daring to breathe and hoping she would not be found. But the wicked King soon clattered into the room. He called to her, and when she gave no answer, he flew into a fury. He tore away the silken covers and pulled off her lace cap. Her lovely hair tumbled over her shoulders. He wound it three times around his hand, threw her over his shoulder like a sack of flour, and carried her away.
        - id: ch01-b13
          speaker: narrator
          text: Through it all, the poor Queen held her little daughter safely in her arms. She shrieked and begged the King for mercy, but he only mocked her. He even told her to go on crying because her fear amused him. Then he mounted his great black horse with both captives and rode back to his own country. The moment he arrived, he announced that the Queen and Princess would be hanged from the nearest tree.
        - id: ch01-b14
          speaker: narrator
          text: His courtiers persuaded him to spare them. Hanging the baby seemed a pity, they said. When she grew up, she might make a fine wife for his only son. The idea pleased him. Instead of hanging the captives, he locked them in the highest room of a tall tower. It was tiny and wretchedly furnished, with only a table and a very hard bed laid on the floor.
        - id: ch01-b15
          speaker: narrator
          text: Next the King summoned a fairy who lived near his kingdom. He welcomed her with far more politeness than he usually showed anyone and entertained her with a magnificent feast. Afterward, he took her to the tower to see the Queen. The sight of such misery touched the Fairy deeply. As she bent to kiss the Queen's hand, she whispered to her.
        - id: ch01-b16
          speaker: good_fairy
          text: Have courage, madam. I believe I can find a way to help you.
          emotion: calm
        - id: ch01-b17
          speaker: narrator
          text: Those words gave the Queen a little hope. She welcomed the Fairy kindly and begged her to pity the poor Princess, whose fortune had changed so cruelly. When the King saw them whispering, he flew into a temper.
        - id: ch01-b18
          speaker: wicked_king
          text: Enough of these pretty speeches! I brought you here to tell me whether this child will grow up beautiful and fortunate.
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: The Fairy told him that the Princess would be as beautiful, clever, and well brought up as any child could be. The King growled that the Queen was lucky. Otherwise, he said, he would certainly have hanged them both. Then he stamped away with the Fairy and left the Queen in tears.
        - id: ch01-b20
          speaker: queen
          text: How can I wish my daughter to be beautiful when she must marry that horrid little dwarf, the King's son? Yet if she is ugly, we shall both be killed. If only I could hide her where this cruel King would never find her.
    - id: ch02
      title: The Mouse in the Tower
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Day by day, the Queen and the Princess grew thinner and thinner. Their hard-hearted gaoler brought them only three boiled peas and one tiny piece of black bread for the whole day, so they were always terribly hungry. One evening the Queen sat at her spinning-wheel. The greedy King made her work there by day and by night. As she spun, a tiny, pretty mouse crept from a hole and came toward her.
        - id: ch02-b02
          speaker: queen
          text: Oh, little creature, what can you hope to find here? Three peas must last me all day. Unless you want to go hungry, you had better look somewhere else.
        - id: ch02-b03
          speaker: narrator
          text: The mouse scampered back and forth, dancing so prettily that the Queen could not resist. She took the last pea she had saved for supper and held it out.
        - id: ch02-b04
          speaker: queen
          text: Here, little one. It is all I have, but I gladly give it to you for cheering me with your dance.
        - id: ch02-b05
          speaker: narrator
          text: The moment she spoke, a roasted partridge and two dishes of preserved fruit appeared on the table.
        - id: ch02-b06
          speaker: queen
          text: A kind deed truly does not go unrewarded!
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: She and the Princess enjoyed their supper, then shared what remained with the mouse. After that, it danced better than ever.
        - id: ch02-b08
          speaker: narrator
          text: The next morning the gaoler brought their three peas on a huge dish to make the serving look even smaller. As soon as he set it down, the mouse ate every pea. When the Queen came for her dinner, she found nothing.
        - id: ch02-b09
          speaker: queen
          text: What a naughty little mouse! If you go on like this, I shall starve.
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: But when she looked again, the dish was heaped with delicious food. She ate an excellent dinner and felt more cheerful than she had in a long while. Later, as she spun, her thoughts returned to the King's threat. What if the Princess did not grow beautiful enough to please him?
        - id: ch02-b11
          speaker: queen
          text: Oh, if only I could find some way to escape!
          emotion: sad
        - id: ch02-b12
          speaker: narrator
          text: In one corner, the mouse was playing with several long straws. The Queen picked them up and began to braid them.
        - id: ch02-b13
          speaker: queen
          text: If I had enough straw, I could weave a basket. Then I might lower my baby from the window to some kind passerby who would care for her.
        - id: ch02-b14
          speaker: narrator
          text: By the time she had braided the first straws, the mouse had dragged in several more. Again and again it returned with fresh ones, until the Queen had enough to make her basket. She worked on it day and night while the mouse danced to amuse her. At dinner and supper, the Queen gave the little creature all three peas and the piece of black bread. Every time, she found delicious food waiting on the dish instead. She could not imagine where any of it came from.
        - id: ch02-b15
          speaker: narrator
          text: At last the basket was finished. The Queen looked from the window to judge how long its cord must be. Far below stood a little old woman leaning on a stick and gazing up at her.
        - id: ch02-b16
          speaker: good_fairy
          text: I know what troubles you, madam. If you wish, I will help.
        - id: ch02-b17
          speaker: queen
          text: Dear friend, come back when I tell you, and I will lower my poor baby in this basket. Please take her and raise her for me. If I ever regain my riches, I will reward you splendidly.
        - id: ch02-b18
          speaker: good_fairy
          text: I want no reward, but there is one thing I would like. I am very particular about my food, and nothing pleases me more than a plump, tender mouse. If one lives in your garret, toss it down to me. In return, I promise to care well for your daughter.
        - id: ch02-b19
          speaker: narrator
          text: The Queen burst into tears and could not answer. After waiting a few moments, the old woman asked what was wrong.
        - id: ch02-b20
          speaker: queen
          text: There is only one mouse here. It is such a dear, pretty creature that I cannot bear the thought of anyone killing it.
          emotion: sad
        - id: ch02-b21
          speaker: good_fairy
          text: What? You care more for a miserable mouse than for your own baby? Goodbye, madam! Keep your mouse for company. I can find plenty elsewhere without asking you for one.
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: The old woman hobbled away, grumbling and growling all the while. The Queen was bitterly disappointed. She had lost the only person who had offered to take her baby. That evening she found a finer dinner than usual, and the mouse danced in its very merriest mood, but nothing could comfort her. She could do nothing but cry.
        - id: ch02-b23
          speaker: narrator
          text: That night, when the baby was fast asleep, the Queen laid her in the basket. On a slip of paper she wrote, “This unhappy little girl is called Delicia!” She pinned it to the baby's robe and sadly began to close the basket. Just then the mouse jumped in and settled on Delicia's pillow.
        - id: ch02-b24
          speaker: queen
          text: Little one, saving your life has cost me dearly. Now how will I ever know whether my Delicia is safe? Anyone else would have handed you to that greedy old woman to be eaten, but I could not do it.
          emotion: sad
        - id: ch02-b25
          speaker: good_fairy
          text: Believe me, madam, you will never regret your kindness.
          emotion: calm
    - id: ch03
      title: A Friendship Tested
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Queen stared in utter astonishment. She had never expected to hear the mouse speak. Then its sharp little nose became a beautiful face, and its four paws changed into hands and feet. The creature suddenly grew tall before her eyes. At last the Queen recognized the very Fairy who had come with the wicked King to visit her in the tower.
        - id: ch03-b02
          speaker: good_fairy
          text: I wanted to learn whether you could be faithful and feel true friendship for me. We fairies have riches of every kind, but true friends are very hard to find.
        - id: ch03-b03
          speaker: queen
          text: How could someone as charming as you ever lack friends?
          emotion: surprised
        - id: ch03-b04
          speaker: good_fairy
          text: It is true. I do not count those who are friendly only because they hope to gain something from me. When you cared for a poor little mouse, you had no reason to expect a reward. Then I came to your window as the old woman, and your answer proved that you truly loved me.
        - id: ch03-b05
          speaker: narrator
          text: The Fairy turned to the Princess and kissed her rosy lips three times.
        - id: ch03-b06
          speaker: good_fairy
          text: Dear little Delicia, you will be richer than your father. You will live for a hundred years, always beautiful and happy, without fearing age or wrinkles.
        - id: ch03-b07
          speaker: narrator
          text: The delighted Queen thanked her with all her heart. She begged the Fairy to take charge of little Delicia and raise the child as her own daughter, and the Fairy gladly agreed. Together they tucked the baby safely inside, closed the basket, and carefully lowered it down the long straw cord until it rested on the ground at the foot of the tower.
        - id: ch03-b08
          speaker: narrator
          text: The Fairy changed back into a mouse. The change delayed her only a few seconds, and then she raced down the straw rope. But when she reached the ground, the basket was empty. The baby had vanished.
        - id: ch03-b09
          speaker: narrator
          text: Terrified, the Fairy hurried back up to the Queen.
        - id: ch03-b10
          speaker: good_fairy
          text: All is lost! My enemy Cancaline has stolen the Princess. She is a cruel fairy who hates me. She is older and more powerful than I am, so I cannot fight her. I do not know how to rescue Delicia from her.
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: The news broke the Queen's heart. She begged the Fairy to do everything she could to recover her child. Just then the gaoler entered. When he saw that the Princess was gone, he ran to tell the King. The King stormed into the tower and demanded to know what the Queen had done with her baby.
        - id: ch03-b12
          speaker: queen
          text: A fairy came here and carried her away by force. I do not know the fairy's name.
        - id: ch03-b13
          speaker: wicked_king
          text: You will hang for this! I always told you that you would!
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: Without another word, he seized the unhappy Queen and dragged her into the nearest wood. There he climbed a tree, looking for a branch from which he could hang her. The good Fairy had made herself invisible and followed close behind. She waited until the King had climbed very high, then gave him a sudden push. He lost his footing, struck the ground with a crash, and broke four of his teeth.
        - id: ch03-b15
          speaker: narrator
          text: While he sat there trying to mend his broken teeth, the Fairy swept the Queen into her flying chariot. They flew away to a beautiful castle, safely beyond the wicked King's reach. The Fairy was so kind to her guest that, if not for the loss of Delicia, the Queen would have been perfectly happy there. The good little mouse searched and did everything within her power. Still, neither friend could discover where Cancaline had hidden the Princess.
    - id: ch04
      title: The Turkey-Maiden
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Fifteen years passed, and the Queen slowly recovered from her grief. Then she heard strange news. The wicked King's son wanted to marry the maiden who tended his turkeys, but the girl had refused him. Wedding clothes had been made in spite of her refusal, and the planned festivities were so splendid that people for miles around were crowding in to see them. The Queen was curious about a turkey-maiden who did not wish to become a queen, so the little mouse went to the poultry-yard to see the girl for herself.
        - id: ch04-b02
          speaker: narrator
          text: The maiden sat barefoot on a large stone, dressed in a rough old linen gown and an equally shabby cap. The ground at her feet was covered with robes of gold and silver, ribbons and lace, diamonds and pearls. Turkeys strutted back and forth over all those splendid gifts as if they were straw. Before her stood the King's ugly, disagreeable son. He angrily declared that if she would not marry him, she would be killed.
        - id: ch04-b03
          speaker: delicia
          text: I will never marry you! You are ugly, and you are too much like your cruel father. Leave me in peace with my turkeys. I like them far better than all your costly gifts.
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: The little mouse admired the girl greatly. She was as beautiful as springtime itself. As soon as the Prince left, the Fairy took the shape of an old peasant woman and greeted her.
        - id: ch04-b05
          speaker: good_fairy
          text: Good day, my pretty child. What a fine flock of turkeys you have.
        - id: ch04-b06
          speaker: delicia
          text: And yet they want me to leave my turkeys and become a miserable Queen. What do you think I should do?
        - id: ch04-b07
          speaker: good_fairy
          text: A crown may look very pretty, child, but you do not know its price or how heavy it can be.
        - id: ch04-b08
          speaker: delicia
          text: I know enough to refuse one. I do not know my father or my mother, and I have no friend in the world, but I still will not wear that crown.
          emotion: sad
        - id: ch04-b09
          speaker: good_fairy
          text: You have goodness and beauty, and they are worth more than ten kingdoms. But tell me how you came here. Why do you have no father, mother, or friend?
        - id: ch04-b10
          speaker: delicia
          text: A fairy called Cancaline is to blame. While I lived with her, she gave me nothing but blows and cruel words. At last I could bear no more, so I ran away without knowing where I was going. In the wood I met the wicked Prince. He offered me work in the poultry-yard, and I gladly accepted. I did not know I would have to see him every day. Now he wants to marry me, but I never will.
        - id: ch04-b11
          speaker: narrator
          text: At the name Cancaline, the Fairy became certain that this was the lost Princess.
        - id: ch04-b12
          speaker: good_fairy
          text: What is your name, little one?
        - id: ch04-b13
          speaker: delicia
          text: My name is Delicia, if you please.
        - id: ch04-b14
          speaker: narrator
          text: The Fairy threw her arms around Delicia and covered her with kisses.
        - id: ch04-b15
          speaker: good_fairy
          text: Oh, Delicia! I am an old friend of yours, and I am truly glad to find you at last. But that gown is fit only for a kitchen maid. Put on this beautiful dress, and let us see what a difference it makes.
          emotion: happy
        - id: ch04-b16
          speaker: narrator
          text: Delicia removed the ugly cap and shook out all her shining fair hair. She went to the nearest spring and bathed her hands and face in its clear water until her cheeks looked like roses. Then she put on the diamonds and the splendid robe the Fairy had given her. When she was fully dressed, she looked like the most beautiful Princess in the whole world.
        - id: ch04-b17
          speaker: good_fairy
          text: Now you look as you should, Delicia. What do you think?
          emotion: happy
        - id: ch04-b18
          speaker: delicia
          text: I feel as though I were the daughter of a great king.
          emotion: surprised
        - id: ch04-b19
          speaker: good_fairy
          text: Would it make you happy if you were?
        - id: ch04-b20
          speaker: delicia
          text: Indeed it would.
          emotion: happy
        - id: ch04-b21
          speaker: good_fairy
          text: Then perhaps I will bring you pleasant news tomorrow.
        - id: ch04-b22
          speaker: narrator
          text: The Fairy hurried back to her castle. The Queen was busy with her embroidery when her friend rushed in.
        - id: ch04-b23
          speaker: good_fairy
          text: Madam, will you wager your thimble and golden needle that I bring the best news you could possibly hear?
          emotion: happy
        - id: ch04-b24
          speaker: queen
          text: Since the Jolly King died and my Delicia was lost, all the news in the world has not been worth a pin to me.
          emotion: sad
        - id: ch04-b25
          speaker: good_fairy
          text: Come now, do not be so sorrowful. The Princess is alive and well. I have never seen anyone as beautiful. She could be a Queen tomorrow if she wished.
          emotion: happy
        - id: ch04-b26
          speaker: narrator
          text: The Fairy told her everything that had happened in the poultry-yard. At first the Queen rejoiced to hear that Delicia was alive and so beautiful. A moment later she pictured her daughter barefoot in a rough gown, tending turkeys for the wicked King, and began to weep.
        - id: ch04-b27
          speaker: queen
          text: She must not be forced to marry the wicked King's son. Let us go and bring her here at once.
    - id: ch05
      title: The Dark Dungeon
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, the furious Prince sat beneath a tree, howling with rage and spite. His noise reached the King at a palace window.
        - id: ch05-b02
          speaker: wicked_king
          text: What is the matter with you? Why are you making such a disturbance?
        - id: ch05-b03
          speaker: wicked_prince
          text: It is our Turkey-maiden. She refuses to love me!
          emotion: angry
        - id: ch05-b04
          speaker: wicked_king
          text: She refuses, does she? We shall soon see about that!
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: The King summoned his guards and ordered them to fetch Delicia.
        - id: ch05-b06
          speaker: wicked_king
          text: I will make her change her mind soon enough!
        - id: ch05-b07
          speaker: narrator
          text: The guards began searching every part of the poultry-yard. They could find no one there except Delicia, who still wore her magnificent dress and crown of diamonds. She looked so lovely and so completely like a great Princess that the men stopped in confusion. They hardly dared speak to her at all.
        - id: ch05-b08
          speaker: delicia
          text: Please tell me whom you are looking for.
        - id: ch05-b09
          speakers: [guard_1, guard_2]
          ensemble: duo
          text: Madam, we were sent to find an insignificant girl called Delicia.
        - id: ch05-b10
          speaker: delicia
          text: Alas, that is my name. What can you want with me?
        - id: ch05-b11
          speaker: narrator
          text: Afraid that she might escape, the guards bound her hands and feet with thick ropes. They carried her before the King and his son. Her beauty astonished the King. Anyone less hard-hearted would have felt pity, but he only laughed and jeered.
        - id: ch05-b12
          speaker: wicked_king
          text: Well, you little fright, you little toad! Why will you not love my son? He is far too handsome and good for you. Love him this instant, or you will be tarred and feathered!
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: Delicia shook with terror and fell to her knees.
        - id: ch05-b14
          speaker: delicia
          text: Please do not tar and feather me. It would be terribly uncomfortable. Give me two or three days to decide, and after that you may do as you please.
          emotion: fearful
        - id: ch05-b15
          speaker: narrator
          text: The Prince would gladly have watched her being tarred and feathered, but the King chose to have her shut in a dark dungeon instead. At that very moment, the Queen and the Fairy arrived in their flying chariot. When they learned what had happened, the Queen was terribly distressed. She mourned that she seemed destined to be unfortunate all her life. But the Fairy told her to take courage and nodded with great determination.
        - id: ch05-b16
          speaker: good_fairy
          text: I will make them pay for this yet.
        - id: ch05-b17
          speaker: narrator
          text: That very night, as soon as the wicked King had gone to bed, the Fairy became the little mouse. She crept onto his pillow and began nibbling his ear. He squealed loudly and rolled onto his other side to escape her. That did no good at all. The mouse simply followed him and began gnawing the second ear until it hurt even more than the first.
        - id: ch05-b18
          speaker: wicked_king
          text: Murder! Thieves!
          emotion: fearful
        - id: ch05-b19
          speaker: narrator
          text: All the guards came running to discover what was wrong, but they found no one and nothing in the room. The little mouse had already slipped away to the Prince's chamber and was treating his ears in exactly the same fashion. All night she raced from father to son and back again. At last the King, driven frantic by terror and want of sleep, bolted out of the palace.
        - id: ch05-b20
          speaker: wicked_king
          text: Help! Help! Rats are chasing me!
          emotion: fearful
        - id: ch05-b21
          speaker: narrator
          text: The Prince heard him, jumped up, and ran after him. Before they had gone far, both fell into the river. No one ever heard of them again.
    - id: ch06
      title: Delicia Becomes Queen
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The good Fairy hurried to tell the Queen. Together they went to the black dungeon where Delicia was imprisoned. The Fairy touched each door with her wand, and every lock sprang open. They passed through forty doors before they found the Princess sitting sadly on the floor.
        - id: ch06-b02
          speaker: narrator
          text: The Queen rushed into the cell and kissed Delicia twenty times in a single minute. She laughed, cried, and poured out the whole story of the Princess's birth, the tower, the basket, and her disappearance. Delicia was wild with delight to discover her mother at last. Then the Fairy opened the treasures she had brought and showed Delicia all the marvelous gowns and jewels waiting for her.
        - id: ch06-b03
          speaker: good_fairy
          text: We must not waste another moment. It is time to speak to the people.
        - id: ch06-b04
          speaker: narrator
          text: The Fairy led the way, looking grave and dignified. She wore a grand dress whose train stretched at least ten ells behind her. Next came the Queen in a robe of blue velvet embroidered with gold. On her head shone a diamond crown brighter than the sun itself. Delicia walked last of all, dressed once more as a Princess, and her beauty was nothing short of marvelous.
        - id: ch06-b05
          speaker: narrator
          text: They walked through the streets, returning every greeting, whether it came from someone great or humble. Everyone they passed turned and followed, wondering who these three noble ladies could possibly be. The procession grew longer at every corner. By the time the women reached the audience hall, it was packed with people eager to hear them.
        - id: ch06-b06
          speaker: good_fairy
          text: Will you accept Delicia, daughter of the Jolly King, as your Queen? If you do, I will find a worthy husband for her. During their reign, you shall have rejoicing and merry-making, and every gloomy thing shall be driven away.
        - id: ch06-b07
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: We will! We will! We have been gloomy and miserable for far too long!
          emotion: happy
        - id: ch06-b08
          speaker: narrator
          text: Everyone joined hands and danced around Delicia, the Queen, and the good Fairy.
        - id: ch06-b09
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: Yes, yes! We will, we will!
          emotion: happy
        - id: ch06-b10
          speaker: narrator
          text: That night there were feasts and fireworks in every street of the town, and the people celebrated their promised new life. Early the next morning, the Fairy returned in her flying chariot. She had traveled all over the world during the night and brought back the handsomest, best-tempered Prince she could find anywhere.
        - id: ch06-b11
          speaker: narrator
          text: He was so charming that Delicia loved him from the moment their eyes met. He could not help thinking himself the luckiest Prince in the world. The Queen knew at last that her misfortunes were over, and they all lived happily ever after.
