audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱疲惫，担忧中带着无奈
        timbre: 柔和微哑
        pace: 适中
        pitch: 中等
    minnikin:
      display_name: 米尼金
      tts:
        delivery: 勇敢机灵，说话爽快而有把握
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高
    king_pippin:
      display_name: 皮平王
      tts:
        delivery: 自信爽直，对弟弟有兄长的口气
        timbre: 清朗年轻
        pace: 适中
        pitch: 中高
    first_hag:
      display_name: 第一个老婆子
      tts:
        delivery: 苍老警觉，讨价还价时干脆
        timbre: 单薄沙哑
        pace: 缓慢
        pitch: 高
    second_hag:
      display_name: 第二个老婆子
      tts:
        delivery: 苍老谨慎，话音粗粝
        timbre: 粗哑衰老
        pace: 适中
        pitch: 中高
    third_hag:
      display_name: 第三个老婆子
      tts:
        delivery: 精明神秘，说话不紧不慢
        timbre: 干涩苍老
        pace: 缓慢
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 庄重威严，悲喜都深沉
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
    kitchen_maid:
      display_name: 厨房女仆
      tts:
        delivery: 实在爽利，待人热心却不失警觉
        timbre: 温暖朴实
        pace: 轻快
        pitch: 中等
    younger_princess:
      display_name: 小王女
      tts:
        delivery: 真诚勇敢，受惊时仍有坚定的力量
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高
    ritter_red:
      display_name: 红骑士
      tts:
        delivery: 傲慢冷酷，夸口时盛气凌人
        timbre: 强硬冰冷
        pace: 适中
        pitch: 中低
    five_headed_troll:
      display_name: 五头山怪
      tts:
        delivery: 凶暴狂吼，声势骇人
        timbre: 粗砺巨大
        pace: 沉重
        pitch: 低
    ten_headed_troll:
      display_name: 十头山怪
      tts:
        delivery: 雷鸣般凶猛，蛮横逼人
        timbre: 浑厚粗暴
        pace: 沉重
        pitch: 低
    fifteen_headed_troll:
      display_name: 十五头山怪
      tts:
        delivery: 震耳欲聋，凶狠狂暴
        timbre: 深沉如洞穴回响
        pace: 沉重
        pitch: 极低
    elder_princess:
      display_name: 大王女
      tts:
        delivery: 谨慎聪慧，焦急时也努力镇定
        timbre: 清晰成熟
        pace: 适中
        pitch: 中等
    sea_troll:
      display_name: 海底山怪
      tts:
        delivery: 多疑暴躁，开口便带威吓
        timbre: 低沉轰鸣
        pace: 沉重
        pitch: 低
  chapters:
    - id: ch01
      title: 两个小兄弟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对穷苦夫妻住在破得不能再破的小屋里。家中除了一贫如洗，什么也没有，没有饭吃，也没有柴烧。可他们年年添一个孩子，这份上天赐下的福气倒从没少过。父亲一点儿也高兴不起来。他成天嘟嘟囔囔，说这样的福分也会多得过了头。又一个孩子快出生时，他干脆躲进树林拾柴去了。他说自己不想见这个新生儿，反正等孩子饿得哇哇大哭，他很快就会听见。
        - id: ch01-b02
          speaker: narrator
          text: 孩子刚落地，便睁眼打量屋子，随后竟开口同母亲说起话来。
        - id: ch01-b03
          speaker: minnikin
          text: 妈妈，把哥哥们的旧衣裳给我几件，再包上几天的吃食吧。我要出去碰碰运气。依我看，您身边的孩子已经够多了。
        - id: ch01-b04
          speaker: mother
          text: 愿上天保佑你，我的孩子。你这么小，怎么能独自出去呢？
        - id: ch01-b05
          speaker: narrator
          text: 小家伙却拿定了主意，一遍又一遍地央求。母亲无可奈何，只好给他几片破衣裳，再包上一点食物。他就这样欢欢喜喜地上路了。
        - id: ch01-b06
          speaker: narrator
          text: 他几乎还没走出家门，母亲又生下一个男孩。这孩子也才睁开眼睛便说话了。
        - id: ch01-b07
          speaker: king_pippin
          text: 妈妈，也给我几件哥哥们的旧衣裳，再带上几天的食物吧。我要去找我的孪生哥哥。您这里已经有够多的孩子了。
        - id: ch01-b08
          speaker: mother
          text: 愿上天保佑你，小东西。你还这么小，这事绝对不成。
        - id: ch01-b09
          speaker: narrator
          text: 母亲劝也没用。第二个男孩也一直求，终于拿到了破衣裳和一包干粮，勇敢地出门追赶哥哥。
        - id: ch01-b10
          speaker: narrator
          text: 他走了一阵，看见哥哥就在前面不远处，连忙高声叫住他。
        - id: ch01-b11
          speaker: king_pippin
          text: 等等我！你走得像在跟人赛跑。急着出门之前，你至少也该见见弟弟呀。
        - id: ch01-b12
          speaker: narrator
          text: 哥哥听见喊声，停下脚步回头望去。弟弟赶上来，说自己就是随后出生的那个兄弟。哥哥听明白以后，便提议先在路旁坐下，瞧瞧母亲究竟给他们各自包了什么食物。两个小小的旅行者果真打开包袱，一起查看里面的干粮。
        - id: ch01-b13
          speaker: narrator
          text: 继续往前，他们来到一片绿草地，一条小溪从中流过。弟弟说，兄弟俩离家太匆忙，没来得及受洗取名，不如就在这里为彼此施洗。
        - id: ch01-b14
          speaker: minnikin
          text: 我就叫米尼金。你想叫什么呢？
        - id: ch01-b15
          speaker: king_pippin
          text: 我叫皮平王。
        - id: ch01-b16
          speaker: narrator
          text: 兄弟俩就在流过绿草地的小溪边为彼此施洗，从此有了名字。随后，他们继续向前，直到来到一个岔路口，这才决定分头赶路，各选各的道路。谁知才走出一点儿，两人便又碰上了。第二回，他们重新分手，各自另选一条路，很快却又迎面相逢。第三回依然如此。最后，他们只好把方向分得更清楚，约定一个向东，一个向西。
        - id: ch01-b17
          speaker: king_pippin
          text: 往后你若真遇上了危难，就连叫我三声，我会来帮你。不过，不到走投无路的时候，千万别叫。
        - id: ch01-b18
          speaker: minnikin
          text: 这么说，我们有一阵子见不着了。
        - id: ch01-b19
          speaker: narrator
          text: 两人互相道别。米尼金朝东走，皮平王朝西走。
    - id: ch02
      title: 三件奇宝
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 米尼金独自走了很远，碰见一个老得不能再老的驼背老婆子。她脸上只有一只眼睛。米尼金悄悄把那只眼睛偷走了。
        - id: ch02-b02
          speaker: first_hag
          text: 哎哟，哎哟！我的眼睛哪儿去了？
          emotion: surprised
        - id: ch02-b03
          speaker: minnikin
          text: 想拿回眼睛，你肯给我什么？
        - id: ch02-b04
          speaker: first_hag
          text: 我给你一把宝剑。任凭军队有多大，这把剑都能把它打败。
        - id: ch02-b05
          speaker: minnikin
          text: 那就把剑给我。
        - id: ch02-b06
          speaker: narrator
          text: 老婆子交出宝剑，换回眼睛。米尼金又走了一阵，第二个独眼驼背老婆子出现在路上。他趁她没察觉，也偷走了她的眼睛。
        - id: ch02-b07
          speaker: second_hag
          text: 哎哟！我的眼睛怎么不见了？
          emotion: surprised
        - id: ch02-b08
          speaker: minnikin
          text: 你拿什么来换回它？
        - id: ch02-b09
          speaker: second_hag
          text: 我给你一艘奇船。它能走过淡水和咸水，也能越过高山深谷。
        - id: ch02-b10
          speaker: minnikin
          text: 好，把船给我吧。
        - id: ch02-b11
          speaker: narrator
          text: 老婆子递给他一艘小得能放进口袋的船，拿回自己的眼睛，便与他各走各的路。米尼金又走了很久，第三次遇见一个老得不能再老的驼背老婆子。她同样只有一只眼睛。米尼金照旧把眼睛偷走。老婆子发现以后又尖叫又哀叹，追问眼睛究竟去了哪里，他便问她愿意拿什么来交换。
        - id: ch02-b12
          speaker: third_hag
          text: 我教你一种本领，让你一次就能用一百拉斯特麦芽酿成酒。
        - id: ch02-b13
          speaker: narrator
          text: 老婆子把酿酒的本领教给他，换回自己的眼睛，两人又各奔一方。米尼金才走出一小段，便觉得该试一试奇船究竟有什么本事。他从口袋里把船拿出来，先迈进去一只脚。脚才落下，船身立刻大了许多。等他把另一只脚也踏进去，小船已经长得和海上航行的大船一样。
        - id: ch02-b14
          speaker: minnikin
          text: 越过淡水和咸水，越过高山和深谷，到国王的宫殿再停下。
        - id: ch02-b15
          speaker: narrator
          text: 奇船立刻飞驰而去，快得像空中的鸟，眨眼便停在王宫下方。许多人从宫里窗口看见米尼金驾船凌空而来，全都惊得站住了。他们纷纷跑下楼，想看看乘船飞来的是何等人物。可等人们赶到时，米尼金早已上岸。他双脚一离开甲板，船便缩回刚到手时的模样，又被他收进口袋。众人四处张望，只看见海边站着一个衣衫褴褛的小男孩。
        - id: ch02-b16
          speaker: narrator
          text: 国王亲自问他从哪里来，又是怎样到这里的。米尼金说自己不知道从哪里来，也说不清怎样到达，只是又诚恳又讨人喜欢地求一份宫里的差事。他说，要是实在没有别的活儿，自己哪怕只能替厨房女仆挑水拾柴，也心甘情愿。国王听了，便准许他留在厨房帮忙。
        - id: ch02-b17
          speaker: narrator
          text: 走进王宫，米尼金发现里里外外、上上下下全挂着黑布，于是向厨房女仆问起缘故。
        - id: ch02-b18
          speaker: kitchen_maid
          text: 国王的女儿早就许给了三个山怪。下星期四晚上，其中一个就要来带走她。红骑士说他能救王女，可谁知道他到底行不行呢？宫里怎能不难过呀。
          emotion: sad
    - id: ch03
      title: 海边的三个星期四
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 星期四晚上终于到了。红骑士陪王女来到海边，因为约定中，第一个山怪会到这里把她带走，而红骑士本该守在她身旁保护她。可是王女才在岸边坐下，他就匆匆爬上一棵高大的树，使劲把自己往枝叶最深处藏。王女孤零零留在海边，哭着一遍遍求他不要丢下自己，他却根本不肯下来。
        - id: ch03-b02
          speaker: ritter_red
          text: 死一个总比死两个好。
        - id: ch03-b03
          speaker: narrator
          text: 与此同时，米尼金也在厨房里央求出去一会儿。
        - id: ch03-b04
          speaker: kitchen_maid
          text: 你跑到海滩上能干什么？那里又没有你的活儿。
        - id: ch03-b05
          speaker: minnikin
          text: 好姐姐，让我去吧。我只想跟别的孩子玩一会儿。
        - id: ch03-b06
          speaker: kitchen_maid
          text: 好吧，那就快去快回。晚饭架锅、烤肉上叉的时候，你必须回来。别忘了给厨房抱一大捆柴。
        - id: ch03-b07
          speaker: narrator
          text: 米尼金答应下来，飞奔到海边。他才到王女身旁，第一个山怪便伴着尖啸和轰鸣冲了过来。它又高又壮，长着五颗可怕的脑袋。
        - id: ch03-b08
          speaker: five_headed_troll
          text: 开火！
          emotion: angry
        - id: ch03-b09
          speaker: minnikin
          text: 你自己开火！
        - id: ch03-b10
          speaker: five_headed_troll
          text: 你会打仗吗？
          emotion: angry
        - id: ch03-b11
          speaker: minnikin
          text: 不会，我也能学。
        - id: ch03-b12
          speaker: narrator
          text: 山怪抡起粗大的铁棒猛砸下来，震得草皮飞起五码高。米尼金却连眼也不眨。
        - id: ch03-b13
          speaker: minnikin
          text: 呸，这也算不上厉害。现在看看我的一击吧。
        - id: ch03-b14
          speaker: narrator
          text: 他拔出老婆子给的宝剑，一剑挥去，山怪的五颗脑袋全飞过了沙滩。王女知道自己得救了，高兴得又蹦又跳。
        - id: ch03-b15
          speaker: younger_princess
          text: 来吧，把头枕在我腿上，睡一会儿。
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: 米尼金睡着后，王女悄悄给他披上一件金衣。红骑士躲在树上，看见危险已经彻底过去，立刻爬了下来。他恶狠狠地威胁王女，非逼她答应对所有人说，是红骑士救了她。要是她不肯，他便杀死她。王女没有办法，只得答应。他随后取下山怪的肺和舌头，包进自己的手帕，领着王女回到宫里。
        - id: ch03-b17
          speaker: narrator
          text: 国王不知道真相，把红骑士当成救女儿的英雄，简直想不出该怎样抬举他才够。从此每逢用餐，红骑士总被安排在国王右手边。米尼金却没有马上回来。他先登上山怪留下的船，从那里取走大批金箍和银箍，这才一路小跑着回到王宫。
        - id: ch03-b18
          speaker: kitchen_maid
          text: 米尼金，我的好朋友，你从哪儿弄来这么多金银？
          emotion: surprised
        - id: ch03-b19
          speaker: minnikin
          text: 我刚刚回了趟家。这些箍从我家几只桶上掉了下来，我顺手带回来送给你。
        - id: ch03-b20
          speaker: narrator
          text: 听说都是给自己的，厨房女仆立刻不再追问，欢欢喜喜收下了礼物。
        - id: ch03-b21
          speaker: narrator
          text: 第二个星期四，所有事情又照上回那样开始了。宫里的人仍旧满心悲伤和忧虑。红骑士却大声夸口，说自己既然能从一个山怪手里救出王女，再打败一个自然轻而易举。他像英雄一样把王女领到海边，可等到山怪快要出现时，便又说出那句老话，转身爬上树，藏进了枝叶间。
        - id: ch03-b22
          speaker: ritter_red
          text: 死一个总比死两个好。
        - id: ch03-b23
          speaker: narrator
          text: 米尼金又去向厨娘请假。
        - id: ch03-b24
          speaker: kitchen_maid
          text: 你去海边又能做什么？
        - id: ch03-b25
          speaker: minnikin
          text: 好姐姐，让我去玩一小会儿吧。
        - id: ch03-b26
          speaker: narrator
          text: 厨娘同上回一样，让他先保证两件事。厨房里的烤肉该翻面时，他必须已经回来，手里还得抱着一大捆柴。米尼金一一答应，这才获准离开。他刚赶到海滩，第二个山怪便伴着巨大的尖啸和轰鸣冲来。这个怪物足足比第一个大上一倍，肩头密密地顶着十颗脑袋。
        - id: ch03-b27
          speaker: ten_headed_troll
          text: 开火！
          emotion: angry
        - id: ch03-b28
          speaker: minnikin
          text: 你自己开火！
        - id: ch03-b29
          speaker: ten_headed_troll
          text: 你会打仗吗？
          emotion: angry
        - id: ch03-b30
          speaker: minnikin
          text: 不会，我也能学。
        - id: ch03-b31
          speaker: narrator
          text: 山怪举起比先前那根更粗的铁棒，一棒砸得泥土冲上十码高。
        - id: ch03-b32
          speaker: minnikin
          text: 呸，这一下算得了什么？该看我的了。
        - id: ch03-b33
          speaker: narrator
          text: 米尼金挥动宝剑，十颗脑袋便滚过沙滩。王女又让他枕在自己腿上休息，趁他睡着，为他披上一件银衣。
        - id: ch03-b34
          speaker: narrator
          text: 红骑士一直等到危险全都过去，这才从树上爬下来。他再次威胁王女，逼她许诺回宫以后仍要说，救命的人是红骑士。接着，他割下山怪的肺和舌头，包在手帕里，护送王女回宫。宫里自然满是欢声笑语。国王认定红骑士又立下大功，恨不得把所有尊荣和敬意都送给他。
        - id: ch03-b35
          speaker: narrator
          text: 米尼金却又登上山怪的船，从那里抱走满怀的金箍银箍，这才回到王宫。厨房女仆一看见这么多金银，惊讶得直拍双手，追问他到底从哪里弄来的。米尼金仍用上回的说法回答。他只是回家走了一趟，这些不过是自家几只桶上掉下来的箍，反正用不着，便全带回来送给她。
        - id: ch03-b36
          speaker: narrator
          text: 到了第三个星期四，所有事情又同前两回一样。王宫从里到外挂满黑布，人人悲伤忧虑。红骑士却说，大家实在没有害怕的理由。他已经从两个山怪手中救出王女，第三个当然也不在话下。他领着王女来到海边，可山怪快要出现时，他又像先前那样爬上大树，把身子藏进枝叶。王女哭着央求他留下，他仍旧不肯。
        - id: ch03-b37
          speaker: ritter_red
          text: 丢一条命总比丢两条好。
        - id: ch03-b38
          speaker: narrator
          text: 米尼金第三次请求去海边。厨房女仆问他去了能做什么，他只是一再央求。她终于同意，却叫他保证，烤肉翻面以前一定回到厨房。
        - id: ch03-b39
          speaker: narrator
          text: 他才到海边，第三个山怪便挟着震耳的呼啸来了。这家伙比前两个大得多，竟有十五颗脑袋。
        - id: ch03-b40
          speaker: fifteen_headed_troll
          text: 开火！
          emotion: angry
        - id: ch03-b41
          speaker: minnikin
          text: 你自己开火！
        - id: ch03-b42
          speaker: fifteen_headed_troll
          text: 你会打仗吗？
          emotion: angry
        - id: ch03-b43
          speaker: minnikin
          text: 不会，我也能学。
        - id: ch03-b44
          speaker: fifteen_headed_troll
          text: 那就让我来教你！
          emotion: angry
        - id: ch03-b45
          speaker: narrator
          text: 山怪抡起那根巨大的铁棒，朝米尼金狠狠砸下。铁棒落地时发出震耳的巨响，地上的泥土直冲到十五码高。可米尼金并没有被这可怕的一击吓住。他仍旧稳稳站在那里，看了看飞落的泥土，又轻蔑地摇了摇头。
        - id: ch03-b46
          speaker: minnikin
          text: 呸，这也叫一击？现在轮到我给你看了。
        - id: ch03-b47
          speaker: narrator
          text: 宝剑一闪，十五颗脑袋一齐飞落，在沙地上滚跳。王女终于再也不用害怕山怪了。她向米尼金道谢，为救命恩人祝福。
        - id: ch03-b48
          speaker: younger_princess
          text: 现在枕着我的腿歇一歇吧。
        - id: ch03-b49
          speaker: narrator
          text: 米尼金躺下后，王女把一件黄铜衣披在他身上。
        - id: ch03-b50
          speaker: younger_princess
          text: 真正救我的明明是你。我们怎样才能让大家知道呢？
        - id: ch03-b51
          speaker: minnikin
          text: 红骑士会把你带回宫，说是他救了你。他会娶你，还会得到半个王国。婚礼那天，人家问你想让谁斟酒，你就指名厨房里那个替女仆挑水拾柴的破衣男孩。到时我会把一滴酒洒在他的盘子里，你的盘子却一滴不沾。他会生气打我，一共打三次。第三次，你就当众说，真正从山怪手里救你的人是我，你想嫁的也是我。
        - id: ch03-b52
          speaker: narrator
          text: 米尼金安排妥当，便像前两次那样往王宫跑。不过，他先登上山怪的船，从船里取走大批金银和别的珍宝，又从中抱出满满一怀金箍银箍送给厨房女仆。红骑士也等到危险全都过去才爬下树。他再次威胁国王的女儿，直到她答应回宫后要说，救她的人是红骑士。随后，他才装作英雄的样子把她领回去。
        - id: ch03-b53
          speaker: narrator
          text: 国王根本不知道红骑士三次都躲在树上。他认定这个人接连从三个山怪手中救下女儿，满脑子想的都是怎样厚待这位大英雄。若说先前给他的尊荣还不够，这一回宫里便把能给的全给足了。国王当众宣布，红骑士将迎娶王女，还会得到半个王国。
    - id: ch04
      title: 婚宴上的真相
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 婚礼那天，王女提出一个请求。她要厨房里那个衣衫褴褛、替女仆挑水拾柴的小男孩来为婚宴斟酒。
        - id: ch04-b02
          speaker: ritter_red
          text: 你把那个又脏又破的小子叫进来干什么？
        - id: ch04-b03
          speaker: narrator
          text: 王女坚持非他不可，别人谁也不要，终于得到了准许。接下来的事全照她和米尼金商量的那样。米尼金端着酒走到桌旁，每回都让一滴酒落进红骑士的盘子，却把王女的那一杯斟得稳稳当当，盘里一滴也不沾。红骑士见自己的盘子被酒弄湿，立刻勃然大怒。这样的事连续发生三次，他也连续打了米尼金三下。
        - id: ch04-b04
          speaker: narrator
          text: 第一拳落下，米尼金的破衣裳全掉了。第二拳打落了黄铜衣。第三拳又打落银衣。他终于穿着那件金衣站在众人面前，灿烂的光芒从衣上闪耀出来。
        - id: ch04-b05
          speaker: younger_princess
          text: 你竟敢打我的心上人，真可耻！从山怪手中救出我的正是他，我要嫁的人也是他。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 红骑士赌咒发誓，说救人的明明是自己。国王要他们拿出证物。
        - id: ch04-b07
          speaker: narrator
          text: 红骑士听见要证物，马上跑去取来自己的手帕。里面包着他从山怪身上割下的肺和舌头。米尼金也离开宴席，把自己从三艘山怪船上带走的金银和各种珍宝全都搬了进来。一个拿着山怪身体上的东西，一个拿着山怪船中的宝藏，两人把各自的证物摆到国王面前，等他判断。
        - id: ch04-b08
          speaker: king
          text: 能拿出这么多金银钻石的人，才是真正杀死山怪的人。这些宝物在别处根本找不到。
        - id: ch04-b09
          speaker: narrator
          text: 红骑士被扔进蛇坑。米尼金则要迎娶王女，得到半个王国。
    - id: ch05
      title: 海底的王女
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天，国王与米尼金出外散步。米尼金问起，他从前是否还有别的孩子。
        - id: ch05-b02
          speaker: king
          text: 我还有一个女儿。那时没有人能救她，山怪便把她掳走了。你就要娶我的一个女儿。若能把另一个也救回来，我愿意让她也嫁给你，再送你另外半个王国。
        - id: ch05-b03
          speaker: minnikin
          text: 我不妨试一试。不过，我要一条五百厄尔长的铁索，五百个人，还有五个星期的粮食。我要走的路很远。
        - id: ch05-b04
          speaker: narrator
          text: 国王答应备齐这些东西，却担心找不到足够大的船。
        - id: ch05-b05
          speaker: minnikin
          text: 船我自己有。
        - id: ch05-b06
          speaker: narrator
          text: 米尼金从口袋里掏出老婆子送的那艘小船。国王看见这么个小玩意儿，忍不住笑起来，以为米尼金不过又在说笑。米尼金却请他照样准备自己要的东西，到时自然会看到奇事。铁索、人员和粮食全都备齐后，他命令众人先把铁索装进船里。可那条铁索实在太重，谁也抬不起来。而且船身只有那么一点儿大，每次顶多站进去一两个人。
        - id: ch05-b07
          speaker: narrator
          text: 米尼金亲手抓住沉重的铁索，把最前面一两节放进小船。奇事立刻发生了。铁索每多进去一节，船身便跟着长大一些。地方越变越宽，众人终于能继续往里装。到最后，船已经大得惊人。五百厄尔长的铁索、五百个人、够吃五个星期的粮食，再加上米尼金自己，全都装了进去，仍有足够的地方。
        - id: ch05-b08
          speaker: minnikin
          text: 越过淡水和咸水，越过高山和深谷，一直走到国王的女儿那里。
        - id: ch05-b09
          speaker: narrator
          text: 奇船立刻出发，越过水面和陆地。一路上，风在船边呼啸呜鸣。航行了很久很久，它忽然停在大海中央。
        - id: ch05-b10
          speaker: minnikin
          text: 我们已经到了。只是以后怎样回来，那可完全是另一回事。
        - id: ch05-b11
          speaker: narrator
          text: 米尼金把铁索一端牢牢系在腰间。
        - id: ch05-b12
          speaker: minnikin
          text: 我要下到海底。等我猛拉铁索，表示想上来，你们就得像一个人那样一起使劲。要不然，我和你们一个也活不成。
        - id: ch05-b13
          speaker: narrator
          text: 他把话交代清楚，纵身跃进大海。黄色水泡在身体四周一个接一个地冒出来。米尼金越沉越深，终于踩到海底。那里矗立着一座大山，山壁上开着一扇门。他推门走了进去，发现失踪的另一位王女正独自坐在那里缝东西。王女已经很久没有见过外人，一抬头发现米尼金，惊喜得拍起双手。
        - id: ch05-b14
          speaker: elder_princess
          text: 谢天谢地！自从被带到这里，我还没见过一个信奉基督的人。
          emotion: surprised
        - id: ch05-b15
          speaker: minnikin
          text: 我就是来救你的。
        - id: ch05-b16
          speaker: elder_princess
          text: 唉，你救不了我。山怪只要看见你，就会要你的命。连想都别想了。
          emotion: fearful
        - id: ch05-b17
          speaker: minnikin
          text: 先说说他吧。他去了哪里？我倒想见识见识。
        - id: ch05-b18
          speaker: narrator
          text: 王女告诉他，山怪出门寻找酿酒师去了。山怪要大办宴会，非得有人一次用一百拉斯特麦芽酿酒才够宾客喝。
        - id: ch05-b19
          speaker: minnikin
          text: 这件事我会做。
        - id: ch05-b20
          speaker: elder_princess
          text: 山怪若不是那么暴躁，我就能把你推荐给他。可他脾气坏极了，恐怕一进门就会把你撕碎。不过，我会想办法。你先藏进柜子里，我们见机行事。
          emotion: fearful
        - id: ch05-b21
          speaker: narrator
          text: 米尼金刚藏好，山怪便进了门。
        - id: ch05-b22
          speaker: sea_troll
          text: 呼！这里怎么有这么浓的基督徒血味？
          emotion: surprised
        - id: ch05-b23
          speaker: elder_princess
          text: 刚才有只鸟飞过屋顶，嘴里叼着一根基督徒的骨头。它把骨头掉进了烟囱，我马上就扔出去了。准是那根骨头留下的气味。
        - id: ch05-b24
          speaker: sea_troll
          text: 对，肯定是它。
        - id: ch05-b25
          speaker: narrator
          text: 王女随即问他，有没有找到能一次用一百拉斯特麦芽酿酒的人。
        - id: ch05-b26
          speaker: sea_troll
          text: 没有，根本没人办得到。
        - id: ch05-b27
          speaker: elder_princess
          text: 不久前倒来了一个人，他说自己能酿。
        - id: ch05-b28
          speaker: sea_troll
          text: 你平时那么聪明，怎么偏把他放走了？你明知道我正急着找这样的人。
          emotion: angry
        - id: ch05-b29
          speaker: elder_princess
          text: 我没有真让他离开。父亲的脾气太急，我怕出事，就把他藏进了柜子。父亲既没找到别人，那人还在这里。
        - id: ch05-b30
          speaker: sea_troll
          text: 让他出来。
        - id: ch05-b31
          speaker: narrator
          text: 米尼金走出柜子。山怪问他是否真能一次用一百拉斯特麦芽酿酒。
        - id: ch05-b32
          speaker: minnikin
          text: 是，我能做到。
        - id: ch05-b33
          speaker: sea_troll
          text: 幸好让我碰见你。马上干活！要是酿出来的酒不够烈，你就求上天保佑吧。
          emotion: angry
        - id: ch05-b34
          speaker: minnikin
          text: 放心，味道一定好。
        - id: ch05-b35
          speaker: narrator
          text: 他立即开始酿酒，可没过多久又停下来提出要求。
        - id: ch05-b36
          speaker: minnikin
          text: 我要更多山怪来搬东西。现在这些帮手一点儿也不管用。
        - id: ch05-b37
          speaker: narrator
          text: 山怪果真又叫来许多同类，数量多得密密麻麻挤成一群。有了这些帮手搬运所需的东西，酿酒的活儿便继续下去。甜麦汁一做好，所有山怪当然都急着尝鲜。海底山怪第一个喝，其余山怪一个接一个跟在后面。可米尼金早把麦汁酿得烈极了。它们只要喝下一口，便像苍蝇一样扑通倒地，当场死去。等酒尝完，满屋山怪一个也没站着，只有一个可怜的老山怪婆子还躺在炉子后面。
        - id: ch05-b38
          speaker: minnikin
          text: 可怜的老东西，别人都尝过了，你也该喝上一口。
        - id: ch05-b39
          speaker: narrator
          text: 他拿一只奶锅，从大桶底舀起一点麦汁递给她。老山怪婆子喝下去，最后一个山怪也完了。
        - id: ch05-b40
          speaker: narrator
          text: 所有山怪都死了以后，米尼金站在屋里四下查看，忽然发现一口大箱子。他把箱盖打开，往里面装满金子和银子。接着，他把垂到海底的铁索牢牢缠在自己身上，又把王女和沉重的箱子一起系好，最后使出全身力气，猛拉铁索。船上的五百个人感觉到信号，立刻像一个人那样齐心用力，终于把他们三个平平安安拖回水面。
        - id: ch05-b41
          speaker: minnikin
          text: 越过咸水和淡水，越过高山和深谷，直到国王的宫殿再停下。
        - id: ch05-b42
          speaker: narrator
          text: 奇船听到命令，立刻飞快返航，速度快得四周翻起一圈圈黄色泡沫。王宫里的人远远看见它回来，一刻也没有耽搁，立刻带着歌声和乐声前去迎接。欢喜的人群排成队伍，热热闹闹地走向米尼金，再簇拥着他们回宫。所有人都在庆祝，可最高兴的自然还是国王。多年以前被山怪掳走的另一个女儿，如今终于也平安回到了他身边。
    - id: ch06
      title: 七个王国传颂的婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 两位王女平安团聚，米尼金却反倒不快活了。姐妹俩都想嫁给他，他却除了最先救下的小王女，谁也不愿意娶。于是，他整日来来回回地踱步，苦苦思量怎样才能同心上人在一起，又不做出任何对不起姐姐的事。
        - id: ch06-b02
          speaker: narrator
          text: 一天，他走着想着，终于记起自己的孪生哥哥。皮平王与他长得一模一样，谁也分辨不出谁是谁。要是哥哥来到这里，便可以娶大王女，得到半个王国。至于米尼金自己，娶小王女，再留下另外一半王国，已经完全足够。主意一定，他便走到宫外，叫了一声皮平王，可没有人来。他提高声音叫第二声，四周还是毫无动静。第三次，米尼金用尽全力大喊哥哥的名字。话音才落，皮平王已经站在他身旁。
        - id: ch06-b03
          speaker: king_pippin
          text: 我说过，不到走投无路的时候不许叫我。这里连一只伤得了你的小飞虫都没有！
          emotion: angry
        - id: ch06-b04
          speaker: narrator
          text: 皮平王说完，狠狠打了弟弟一下，米尼金顿时滚倒在草地上。
        - id: ch06-b05
          speaker: minnikin
          text: 你怎么能打我！我先赢得一位王女和半个王国，又赢得另一位王女和另外半个王国。我正想把一位王女和半个王国送给你，你还有理由揍我吗？
          emotion: angry
        - id: ch06-b06
          speaker: narrator
          text: 皮平王一听，马上向弟弟道歉。兄弟俩立刻和好，又亲亲热热地站在一起。
        - id: ch06-b07
          speaker: minnikin
          text: 你知道，我们长得一模一样，没人分得清。跟我换衣裳，再走进王宫。两位王女会以为你就是我。谁先吻你，谁便嫁给你，另一个嫁给我。
        - id: ch06-b08
          speaker: narrator
          text: 米尼金知道，大王女比妹妹高大，也更有力气，所以不用看也能猜到事情会怎样发展。皮平王立刻答应了这个办法。兄弟俩交换衣裳，哥哥独自走进王宫，来到两位王女住的房间。姐妹俩果然没认出换了人。她们都以为进门的是米尼金，同时朝他跑去。姐姐仗着个子更高、力气更大，抢先把妹妹推到一旁，随后伸出双臂搂住皮平王的脖子，吻了他一下。
        - id: ch06-b09
          speaker: narrator
          text: 于是，皮平王娶了大王女，米尼金娶了小王女。两场婚礼办得无比盛大，足足七个王国的人都听说过，还谈论了很久很久。
