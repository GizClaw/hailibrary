  chapters:
    - id: ch01
      title: The Two Little Brothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor husband and wife who lived in a wretched hut. Black want was all they knew. There was no food to eat and no wood to burn. Yet if they lacked almost everything else, they had the blessing of children, for every year another child was born. The father was not pleased. He went about grumbling that a family might have too many of these good gifts. Shortly before the next baby arrived, he left for the forest to gather firewood. He did not want to see the new child, he said. He would hear the boy soon enough when the crying for food began.
        - id: ch01-b02
          speaker: narrator
          text: The new baby had hardly been born when he looked around the room and spoke to his mother.
        - id: ch01-b03
          speaker: minnikin
          text: Dear mother, give me some old clothes from my brothers and enough food for a few days. I will go out and seek my fortune. It seems to me you have children enough already.
        - id: ch01-b04
          speaker: mother
          text: Heaven help you, my son! You are much too little to do that.
        - id: ch01-b05
          speaker: narrator
          text: Still, the tiny boy begged and begged. At last his mother gave him a few old rags and tied up some food for him. He set off into the world as happy as could be.
        - id: ch01-b06
          speaker: narrator
          text: He was barely outside when another boy was born. This child also looked around and spoke at once.
        - id: ch01-b07
          speaker: king_pippin
          text: Dear mother, give me some of my brothers' old clothes and food for a few days. I am going to find my twin brother. You have children enough here.
        - id: ch01-b08
          speaker: mother
          text: Heaven help you, little one! You are far too small. It will never do.
        - id: ch01-b09
          speaker: narrator
          text: Her words made no difference. The second boy pleaded until he too had old rags and a bundle of food. Then he marched bravely out to find his brother.
        - id: ch01-b10
          speaker: narrator
          text: After a while, he saw the first boy ahead and called for him to stop.
        - id: ch01-b11
          speaker: king_pippin
          text: Wait for me! You are walking as if this were a race. You should have stayed long enough to meet your younger brother.
        - id: ch01-b12
          speaker: narrator
          text: The elder boy stopped and looked behind him. The younger hurried up and told him that they were brothers, born one after the other. Then the elder suggested that they sit beside the road and discover what sort of food their mother had put in their bundles. The two tiny travelers sat down and examined their provisions together.
        - id: ch01-b13
          speaker: narrator
          text: Farther on, they reached a brook running through a green meadow. The younger boy said they should christen each other there, since they had left home too quickly for it to be done.
        - id: ch01-b14
          speaker: king_pippin
          text: What shall I call you?
        - id: ch01-b15
          speaker: minnikin
          text: Call me Minnikin. And what shall I call you?
        - id: ch01-b16
          speaker: king_pippin
          text: I will be King Pippin.
        - id: ch01-b17
          speaker: narrator
          text: There beside the brook, the brothers christened each other Minnikin and King Pippin. Then they continued until they reached a crossing, where they agreed to part and each choose his own road. They had gone only a short distance when, without expecting it, they met again. They separated a second time, each taking his own road, but very soon they came face to face once more. The same strange thing happened a third time. At last they chose opposite quarters of the world. Minnikin would travel east, and King Pippin would travel west.
        - id: ch01-b18
          speaker: king_pippin
          text: If you ever fall into real danger or trouble, call me three times and I will come to help. But do not call unless your need is desperate.
        - id: ch01-b19
          speaker: minnikin
          text: Then it may be a long time before we meet again.
        - id: ch01-b20
          speaker: narrator
          text: The brothers said farewell. King Pippin went west, and Minnikin went east alone.
    - id: ch02
      title: Three Gifts and a Flying Ship
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Minnikin had traveled a long way when he met an ancient, crooked woman with only one eye. He stole that eye from her.
        - id: ch02-b02
          speaker: first_hag
          text: Oh! Oh! Where has my eye gone?
        - id: ch02-b03
          speaker: minnikin
          text: What will you give me if I return it?
        - id: ch02-b04
          speaker: first_hag
          text: I will give you a sword that can defeat an army, however great it may be.
        - id: ch02-b05
          speaker: minnikin
          text: Give me the sword, then.
        - id: ch02-b06
          speaker: narrator
          text: The old woman gave him the sword, and Minnikin returned her eye. Then they went their separate ways. After wandering for some time, he met another very old, crooked-backed woman. She too had only one eye. Minnikin stole it before she knew what he was doing.
        - id: ch02-b07
          speaker: second_hag
          text: Oh! Oh! What has happened to my eye?
        - id: ch02-b08
          speaker: minnikin
          text: What will you trade for it?
        - id: ch02-b09
          speaker: second_hag
          text: I will give you a ship that sails over fresh water and salt water, over high hills and deep valleys.
        - id: ch02-b10
          speaker: minnikin
          text: Let me have it.
        - id: ch02-b11
          speaker: narrator
          text: The woman handed him what looked like a tiny piece of a ship. It was no bigger than something he could slip into his pocket. Once he had it safely, he returned her eye, and each went on alone. After another long walk, he met a third very old, crooked-backed woman with a single eye. Minnikin stole that eye too. The woman screamed and lamented, demanding to know what had become of it.
        - id: ch02-b12
          speaker: minnikin
          text: What will you give me for your eye?
        - id: ch02-b13
          speaker: third_hag
          text: I will teach you how to brew a hundred lasts of malt in a single brewing.
        - id: ch02-b14
          speaker: narrator
          text: Once she had taught him the art, Minnikin gave back her eye. They went their separate ways.
        - id: ch02-b15
          speaker: narrator
          text: A short distance farther on, Minnikin thought it might be worthwhile to learn what his strange little ship could do. He drew it from his pocket and put one foot inside. The ship immediately became much larger. Then he stepped in with his other foot, and it grew again until it was as large as the ships that sailed upon the sea.
        - id: ch02-b16
          speaker: minnikin
          text: Carry me over fresh water and salt water, over high hills and deep valleys. Do not stop until you reach the King's palace.
        - id: ch02-b17
          speaker: narrator
          text: In an instant, the ship flew away as swiftly as any bird in the air. It did not stop until it stood just below the King's palace. Many people had watched its approach from the palace windows. Astonished by the sight of a ship sailing through the air, they all rushed down to discover what kind of man had come in it. Before they arrived, Minnikin stepped ashore. The moment he got out, the ship became as small as it had been when the old woman gave it to him, and he put it back in his pocket. The people from the palace found no wonderful sailor. They saw only a ragged little boy standing beside the sea.
        - id: ch02-b18
          speaker: narrator
          text: The King asked Minnikin where he had come from. The boy said he did not know. When they asked how he had reached the palace, he claimed he could not tell them that either. Instead, he begged earnestly and politely for a place in the royal household. If there was no finer work for him, he offered to fetch wood and water for the kitchen maid. The King gave him permission to do just that.
        - id: ch02-b19
          speaker: narrator
          text: When Minnikin went up to begin his work at the palace, he saw that the whole place was hung with black. Black cloth covered the outside and the inside, reaching from the bottom of the walls all the way to the top. The sight told him that some great sorrow lay over the royal household, so he asked the kitchen maid what it meant.
        - id: ch02-b20
          speaker: kitchen_maid
          text: The King's daughter was promised to three Trolls long ago. Next Thursday evening, one of them will come for her. Ritter Red says he can set her free, but who knows if he truly can? That is why the whole palace is grieving.
    - id: ch03
      title: The Three Trolls
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Thursday evening came, and Ritter Red accompanied the King's daughter to the sea-shore. That was where she had been ordered to meet the first Troll. Ritter Red was meant to stay beside her and protect her. Yet no sooner had the Princess seated herself on the sand than he hurried up a great tree nearby. He climbed high among the branches and hid himself as well as he could.
        - id: ch03-b02
          speaker: narrator
          text: The Princess wept and begged him not to leave her, but he paid no attention.
        - id: ch03-b03
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch03-b04
          speaker: narrator
          text: Meanwhile, Minnikin asked the kitchen maid to let him visit the shore for a little while.
        - id: ch03-b05
          speaker: kitchen_maid
          text: What could you possibly do there? You have no business at the shore.
        - id: ch03-b06
          speaker: minnikin
          text: Please let me go. I only want to play there with the other children.
        - id: ch03-b07
          speaker: kitchen_maid
          text: Very well, then. But be back before I put the supper pan on the fire and the roast on the spit. And bring me a good armful of wood.
        - id: ch03-b08
          speaker: narrator
          text: Minnikin promised and ran down to the shore. Just as he reached the Princess, a huge, stout Troll rushed up with a terrible whistling and whirring. It had five heads.
        - id: ch03-b09
          speaker: five_headed_troll
          text: Fire!
        - id: ch03-b10
          speaker: minnikin
          text: Fire yourself!
        - id: ch03-b11
          speaker: five_headed_troll
          text: Do you know how to fight?
        - id: ch03-b12
          speaker: minnikin
          text: If I do not, I can learn.
        - id: ch03-b13
          speaker: narrator
          text: The Troll swung a thick iron bar. The blow sent clods of earth flying five yards into the air.
        - id: ch03-b14
          speaker: minnikin
          text: Shame! That was hardly a blow. Now watch what I can do.
        - id: ch03-b15
          speaker: narrator
          text: Minnikin drew the sword from the first old woman and struck once. All five heads flew across the sand.
        - id: ch03-b16
          speaker: narrator
          text: The Princess was so delighted to be free that she skipped and danced without knowing what she was doing.
        - id: ch03-b17
          speaker: younger_princess
          text: Rest for a while with your head in my lap.
        - id: ch03-b18
          speaker: narrator
          text: Minnikin lay down and slept with his head in her lap. While he rested, the Princess put a golden suit of clothes on him. High in the tree, Ritter Red watched and waited. The moment he was sure that no danger remained, he crept down through the branches. He threatened the Princess until she promised to tell everyone that he had been her rescuer. If she refused, he said, he would kill her. Then he cut out the Troll's lungs and tongue, wrapped them in his pocket handkerchief, and led the frightened Princess back to the palace.
        - id: ch03-b19
          speaker: narrator
          text: The King knew nothing about Ritter Red's cowardice or threats. Believing that the man had saved his daughter, he did not know how to honor him enough. From then on, he always placed Ritter Red at his own right hand at the royal table. Minnikin, meanwhile, boarded the dead Troll's ship. He found a great many hoops of gold and silver there, took as many as he could carry, and trotted back toward the King's palace.
        - id: ch03-b20
          speaker: kitchen_maid
          text: Minnikin, my dear friend, where did you get all that gold and silver?
        - id: ch03-b21
          speaker: narrator
          text: She feared he might have stolen it.
        - id: ch03-b22
          speaker: minnikin
          text: I went home for a while. These hoops had fallen from some of our buckets, so I brought them back for you.
        - id: ch03-b23
          speaker: narrator
          text: Hearing that the hoops were hers, the kitchen maid thanked him and asked no more.
        - id: ch03-b24
          speaker: narrator
          text: When the next Thursday evening came, everything happened just as before. Everyone was full of grief, but Ritter Red boasted that since he had freed the King's daughter from one Troll, he could easily free her from another. He led her down to the shore. As the time for the Troll drew near, however, he did nothing to protect her. He told her again that it was better for one person to die than two, climbed the great tree, and hid among its branches.
        - id: ch03-b25
          speaker: narrator
          text: Minnikin once more begged the kitchen maid for leave to visit the shore. She asked what use he could possibly be there. He pleaded that he only wished to amuse himself with the other children. At last she gave permission, but first he had to promise that he would return by the time the joint needed turning and that he would bring a great armful of wood for the kitchen.
        - id: ch03-b26
          speaker: narrator
          text: At the shore, another Troll came whistling and whirring. It was twice as large as the first and had ten heads.
        - id: ch03-b27
          speaker: ten_headed_troll
          text: Fire!
        - id: ch03-b28
          speaker: minnikin
          text: Fire yourself!
        - id: ch03-b29
          speaker: ten_headed_troll
          text: Can you fight?
        - id: ch03-b30
          speaker: minnikin
          text: If not, I can learn.
        - id: ch03-b31
          speaker: narrator
          text: The Troll struck with an iron club larger than the first one's. Earth flew ten yards high.
        - id: ch03-b32
          speaker: minnikin
          text: That was a poor blow. Now you shall see one of mine.
        - id: ch03-b33
          speaker: narrator
          text: Minnikin grasped his wonderful sword and struck. All ten of the Troll's heads went dancing away over the sand. Once more the King's daughter asked him to sleep for a while with his head in her lap. While Minnikin lay there, she drew a suit of silver clothes over him.
        - id: ch03-b34
          speaker: narrator
          text: As soon as Ritter Red saw that there was no danger left, he crept down from the tree. He threatened the Princess until she was forced to promise once again that she would name him as her rescuer. Then he took the Troll's tongue and lungs, wrapped them in his handkerchief, and escorted her to the palace. Joy filled the palace, and the King could not think of enough honors to show Ritter Red.
        - id: ch03-b35
          speaker: narrator
          text: Minnikin went aboard the second Troll's ship and carried home another armful of gold and silver hoops. When he reached the palace, the kitchen maid clapped her hands and wondered aloud where he had found so much treasure. Minnikin said he had made a short visit home. The hoops, he claimed, had merely fallen from some pails, so he had brought them away as a gift for her.
        - id: ch03-b36
          speaker: narrator
          text: The third Thursday evening came, and the same sorrow returned. Black cloth hung throughout the King's palace, and everyone was distressed. Ritter Red told them they had little reason to fear. After all, he claimed, he had delivered the King's daughter from two Trolls and could easily deliver her from the third. But when he led her to the shore and the hour drew near, he climbed into the tree and hid himself yet again.
        - id: ch03-b37
          speaker: narrator
          text: The Princess wept and begged him to stay, but Ritter Red would not listen. He clung to his old saying that it was better for one life to be lost than two. At the palace, Minnikin again asked permission to visit the shore. The kitchen maid wanted to know what he could do there. He pleaded until she finally let him go, though he had to promise to be back in the kitchen when the roast was ready to be turned.
        - id: ch03-b38
          speaker: narrator
          text: The third Troll came with a great whizzing and whirring. It was far bigger than either of the others and had fifteen heads.
        - id: ch03-b39
          speaker: fifteen_headed_troll
          text: Fire!
        - id: ch03-b40
          speaker: minnikin
          text: Fire yourself!
        - id: ch03-b41
          speaker: fifteen_headed_troll
          text: Can you fight?
        - id: ch03-b42
          speaker: minnikin
          text: If not, I can learn.
        - id: ch03-b43
          speaker: fifteen_headed_troll
          text: Then I will teach you!
          emotion: angry
        - id: ch03-b44
          speaker: narrator
          text: Its iron club struck so hard that earth flew fifteen yards into the air.
        - id: ch03-b45
          speaker: minnikin
          text: Shame! That was not much of a blow. Now I will show you mine.
        - id: ch03-b46
          speaker: narrator
          text: He grasped his sword and cut. All fifteen heads danced away across the sand.
        - id: ch03-b47
          speaker: narrator
          text: Now the Princess was delivered for the third time. She thanked Minnikin and blessed him for saving her. She invited him to sleep for a while with his head in her lap. As he lay there, she placed a suit of brass clothes over him.
        - id: ch03-b48
          speaker: younger_princess
          text: But how can we make everyone know that you saved me?
        - id: ch03-b49
          speaker: minnikin
          text: Ritter Red will take you home and say he rescued you. Then he will be promised your hand and half the kingdom. On your wedding day, ask for the ragged kitchen boy who carries wood and water to serve the wine. I will spill one drop on his plate and none on yours. He will strike me, and it will happen three times. The third time, tell him, "Shame on you for striking the one I love. He saved me from the Troll, and he is the one I choose."
        - id: ch03-b50
          speaker: narrator
          text: With the plan settled, Minnikin ran back toward the King's palace as he had done before. First, though, he boarded the third Troll's ship. He took a great quantity of gold, silver, and other precious things. From this treasure he selected another whole armful of gold and silver hoops for the kitchen maid.
        - id: ch03-b51
          speaker: narrator
          text: Ritter Red did not come down until every danger had passed. Then he crept from the tree and threatened the King's daughter until she promised to tell everyone that he had saved her. He conducted her back to the palace. The King had no thought except how to reward the man he believed had rescued his daughter from all three Trolls. It was settled that Ritter Red would marry her and receive half the kingdom.
    - id: ch04
      title: The True Rescuer
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the wedding day, the Princess asked for the little kitchen boy who carried wood and water to fill the cups at the feast.
        - id: ch04-b02
          speaker: ritter_red
          text: Why would you bring that dirty, ragged boy in here?
        - id: ch04-b03
          speaker: narrator
          text: The Princess insisted that the ragged boy must be her cup-bearer and said she would accept no one else. At last the others gave way. Minnikin was brought in, and everything followed the plan that he and the Princess had made together on the shore.
        - id: ch04-b04
          speaker: narrator
          text: As he filled the cups, Minnikin spilled one drop of wine on Ritter Red's plate and none on the Princess's. Ritter Red flew into a rage and struck him. At that first blow, all the ragged clothes he had worn in the kitchen fell away, revealing the brass clothes underneath. Minnikin served them again and again spilled on Ritter Red's plate alone. Ritter Red struck a second time, and the brass clothes fell away to show the silver suit. The same thing happened a third time. At Ritter Red's third blow, the silver clothes dropped from Minnikin. There he stood in the golden clothes, so bright and splendid that light flashed from them.
        - id: ch04-b05
          speaker: younger_princess
          text: Shame on you for striking the one I love! He rescued me from the Troll, and he is the one I will marry.
        - id: ch04-b06
          speaker: narrator
          text: Ritter Red swore that he was the rescuer, but the King demanded proof.
        - id: ch04-b07
          speaker: king
          text: The man who saved my daughter must have some token to show us.
        - id: ch04-b08
          speaker: narrator
          text: Ritter Red ran off at once and returned with the handkerchief containing the Troll's lungs and tongue. Minnikin went for all the gold, silver, diamonds, and other precious things he had carried from the Trolls' ships. Each of them laid his tokens before the King and waited for his judgment.
        - id: ch04-b09
          speaker: king
          text: The one who owns such gold, silver, and diamonds must have killed the Trolls. Treasures like these are found nowhere else.
        - id: ch04-b10
          speaker: narrator
          text: The King's decision was made. Ritter Red, whose false claim had been uncovered, was seized and thrown into the snake pit. Minnikin, the true rescuer of the younger Princess, was to marry her and receive half of the kingdom.
        - id: ch04-b11
          speaker: narrator
          text: Some time afterward, the King and Minnikin went out walking together. As they walked, Minnikin wondered about the royal family and asked the King whether he had ever had any children besides the daughter Minnikin had rescued from the three Trolls.
        - id: ch04-b12
          speaker: king
          text: I had another daughter, but a Troll carried her away, and no one could save her. You are to marry one of my daughters. If you can free the other, you may marry her too and have the other half of the kingdom.
        - id: ch04-b13
          speaker: minnikin
          text: I may as well try. I will need an iron rope five hundred ells long, five hundred men, and food for five weeks. The voyage will be long.
        - id: ch04-b14
          speaker: narrator
          text: The King agreed, though he feared that he owned no ship large enough.
        - id: ch04-b15
          speaker: minnikin
          text: I have a ship of my own.
        - id: ch04-b16
          speaker: narrator
          text: Minnikin reached into his pocket and brought out the little ship the second old woman had given him. The King laughed when he saw it and thought Minnikin was joking. But Minnikin asked him to provide the iron rope, men, and food all the same. Once those things arrived, he said, the King would see what the little ship could do.
        - id: ch04-b17
          speaker: narrator
          text: Everything Minnikin had requested was brought to him. He first ordered the men to lay the iron rope aboard, but no one could even lift it. Besides, the little ship had room for only one or two men. Minnikin took hold of the rope himself and placed one link, then another, inside. With every link, the vessel grew larger. At last it was big enough for the whole rope, all five hundred men, five weeks of provisions, and Minnikin himself.
        - id: ch04-b18
          speaker: minnikin
          text: Go over fresh water and salt water, over hills and valleys. Do not stop until you reach the place where the King's daughter is held.
        - id: ch04-b19
          speaker: narrator
          text: At once the ship set off across land and water. It flew so fast that the wind whistled and moaned all around the vessel. They traveled for a long, long time, leaving the King's country far behind. Then, without warning, the ship stopped short in the middle of the sea, with nothing but water stretching away on every side.
        - id: ch04-b20
          speaker: minnikin
          text: We have reached the place. Getting back again may be another matter.
        - id: ch04-b21
          speaker: narrator
          text: He tied one end of the iron rope around his body.
        - id: ch04-b22
          speaker: minnikin
          text: I must go to the bottom. When I jerk the rope and want to return, every one of you must pull together. If you do not, all our lives will end here.
        - id: ch04-b23
          speaker: narrator
          text: With those instructions given, Minnikin sprang into the sea. Yellow bubbles rose all around him. He sank deeper and deeper through the water until at last he reached the bottom. There he saw a large hill with a door set into its side. Minnikin opened the door and went in.
    - id: ch05
      title: Beneath the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Inside the hill, the elder Princess sat sewing. The moment she saw Minnikin, she clapped her hands.
        - id: ch05-b02
          speaker: elder_princess
          text: Heaven be praised! I have not seen a Christian man since I was brought here.
          emotion: surprised
        - id: ch05-b03
          speaker: minnikin
          text: I have come to take you home.
        - id: ch05-b04
          speaker: elder_princess
          text: You cannot rescue me. Do not even think of it. If the Troll sees you, he will kill you.
          emotion: fearful
        - id: ch05-b05
          speaker: minnikin
          text: Tell me about him. Where has he gone? I should rather like to see him.
        - id: ch05-b06
          speaker: narrator
          text: The Princess told him that the Troll was away searching for one very particular kind of worker. He needed someone who could brew a hundred lasts of malt all in a single brewing. There was to be a feast at the Troll's home, and at such a feast the guests would drink no less than that enormous amount.
        - id: ch05-b07
          speaker: minnikin
          text: I can brew it.
        - id: ch05-b08
          speaker: elder_princess
          text: If only the Troll were not so quick-tempered, I could tell him. But I fear he will tear you apart the moment he enters. Hide in this cupboard, and I will try to manage him.
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: Minnikin hid in the cupboard. He had barely climbed inside when the Troll came home.
        - id: ch05-b10
          speaker: sea_troll
          text: Huf! I smell the blood of a Christian man!
        - id: ch05-b11
          speaker: elder_princess
          text: A bird flew across the roof with a Christian man's bone in its beak and dropped it down the chimney. I hurried to throw it out, but the smell must still be here.
        - id: ch05-b12
          speaker: sea_troll
          text: Yes, that must be it.
        - id: ch05-b13
          speaker: narrator
          text: The Princess asked whether he had found anyone who could brew the hundred lasts of malt.
        - id: ch05-b14
          speaker: sea_troll
          text: No. There is no one who can do it.
        - id: ch05-b15
          speaker: elder_princess
          text: A man was here a little while ago, and he said that he could.
        - id: ch05-b16
          speaker: sea_troll
          text: How could you be foolish enough to let him leave? You knew I needed exactly such a man.
          emotion: angry
        - id: ch05-b17
          speaker: elder_princess
          text: I did not let him leave. You are so quick-tempered that I hid him in the cupboard. If you found nobody else, he is still here.
        - id: ch05-b18
          speaker: sea_troll
          text: Bring him in.
        - id: ch05-b19
          speaker: narrator
          text: Minnikin came out. The Troll asked whether he truly could brew so much malt at once.
        - id: ch05-b20
          speaker: minnikin
          text: Yes, I can.
        - id: ch05-b21
          speaker: sea_troll
          text: Then I am lucky to have found you. Begin this minute, and Heaven help you if the ale is not strong.
        - id: ch05-b22
          speaker: minnikin
          text: It will taste strong enough.
        - id: ch05-b23
          speaker: narrator
          text: Minnikin set to work immediately. Before long, he told the Troll that the helpers provided were no good at carrying everything the brewing required. He would need many more Trolls. The master sent for more, and still more, until a whole swarm of them crowded around the work. With all those hands carrying the supplies, Minnikin continued the brewing.
        - id: ch05-b24
          speaker: narrator
          text: At last the sweet wort was ready. Naturally, every Troll was eager to taste it. The master Troll drank first, and then the others crowded forward for their share. But Minnikin had brewed the wort so terribly strong that every Troll fell dead like a fly the moment it swallowed a taste. One after another they dropped until the great room was silent. Only one wretched old Troll woman was left, lying out of sight behind the stove.
        - id: ch05-b25
          speaker: minnikin
          text: You poor old creature. You shall have a taste like all the others.
        - id: ch05-b26
          speaker: narrator
          text: Minnikin went back to the brewing vat and scraped up a little of the strongest wort from the very bottom. He poured it into a milk pan and carried it to the old woman behind the stove. When she had tasted it, Minnikin was rid of the last of the Trolls.
        - id: ch05-b27
          speaker: narrator
          text: Minnikin stood for a moment and looked around the Troll's home. His eye fell upon a large chest. He opened it and filled it with gold and silver. Then he fastened the iron rope securely around his own body, the Princess, and the heavy treasure chest. When all was ready, he gave the rope a mighty tug. The five hundred men aboard the ship felt his signal. Pulling together as one, they drew Minnikin, the King's daughter, and the chest through the water and brought them safely aboard.
        - id: ch05-b28
          speaker: minnikin
          text: Carry us over salt water and fresh water, over hills and valleys. Do not stop until you reach the King's palace.
        - id: ch05-b29
          speaker: narrator
          text: In a moment, the magic ship was flying home so swiftly that yellow foam rose all around it. The people in the King's palace saw the ship coming and lost no time. They went out to meet Minnikin with songs and music, marching toward him in great rejoicing. Of everyone who welcomed the travelers, the King was the happiest. The daughter he had lost to the Troll had come home again.
    - id: ch06
      title: King Pippin Returns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: In spite of the joyful homecoming, Minnikin was not happy. Both of the Princesses wanted him for a husband, but he wanted no one except the younger sister, whom he had rescued first from the three Trolls. He walked backward and forward day after day, thinking hard. He wanted to find a way to marry the younger Princess without doing anything cruel or unkind to her elder sister.
        - id: ch06-b02
          speaker: narrator
          text: One day, as he paced and puzzled over the matter, Minnikin suddenly remembered his twin brother. King Pippin looked so much like him that no one in the world could distinguish one brother from the other. If King Pippin came to the palace, Minnikin could give him the elder Princess and one half of the kingdom. Minnikin himself would gladly take the younger Princess and the other half. One half, he thought, was more than enough for him.
        - id: ch06-b03
          speaker: narrator
          text: As soon as the idea came to him, Minnikin went outside the palace and called for King Pippin. No one answered, and no one came. He called a second time, raising his voice so that it carried farther, but still he stood alone. Then Minnikin remembered his brother's exact instruction. He called King Pippin's name for the third time, shouting with all his might. Before the sound had faded, his twin brother was standing at his side.
        - id: ch06-b04
          speaker: king_pippin
          text: I told you not to call unless you were in the greatest need. There is not even a midge here that could harm you!
          emotion: angry
        - id: ch06-b05
          speaker: narrator
          text: King Pippin was certain that his brother had broken their agreement for no good reason. Without waiting for an explanation, he gave Minnikin such a blow that the little fellow rolled right over upon the grass.
        - id: ch06-b06
          speaker: minnikin
          text: Shame on you for hitting me! First I won one Princess and half the kingdom. Then I won the other Princess and the other half. I called because I meant to give you one Princess and half the kingdom. Was that any reason to strike me?
        - id: ch06-b07
          speaker: narrator
          text: King Pippin listened as his brother explained why he had called three times. When he heard about the two Princesses and the two halves of the kingdom, he saw that he had judged Minnikin too quickly. He begged his brother's pardon. Minnikin accepted it at once, and the twins were reconciled and became good friends again.
        - id: ch06-b08
          speaker: minnikin
          text: No one can tell us apart. Change clothes with me and go into the palace. Both Princesses will think you are Minnikin. The one who kisses you first will be your wife, and I will marry the other.
        - id: ch06-b09
          speaker: narrator
          text: Minnikin had already guessed how his test would end. The elder Princess was bigger and stronger than her younger sister, and he expected her to reach King Pippin first. His brother agreed to the plan without delay. The two exchanged clothes, making their likeness even harder to question, and King Pippin walked alone into the palace and entered the rooms where the Princesses were waiting.
        - id: ch06-b10
          speaker: narrator
          text: When King Pippin appeared, both Princesses were certain that Minnikin had entered. They sprang up and ran toward him at the same moment. Just as Minnikin had expected, the elder sister used her greater size and strength. She pushed the younger Princess out of her way, reached King Pippin first, threw both arms around his neck, and kissed him.
        - id: ch06-b11
          speaker: narrator
          text: And so the matter was settled without any unkind refusal. King Pippin took the elder Princess for his wife, while Minnikin married the younger sister he had loved from the first. Two weddings were celebrated at the palace. They were so magnificent that the news of them traveled far and wide, and people heard and talked about those weddings throughout seven kingdoms.
