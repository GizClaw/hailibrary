  chapters:
    - id: ch01
      title: The Foal on the Hill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a wealthy couple with twelve sons. When the youngest son grew up, he could no longer bear to stay at home. He wanted to go out into the world and seek his fortune.
        - id: ch01-b02
          speakers: [father, mother]
          ensemble: duo
          text: You are well provided for here. You are welcome to stay with us.
        - id: ch01-b03
          speaker: narrator
          text: His father and mother urged him to remain, but the young man could not rest. He insisted that he had to go. At last they gave him leave, and after a long journey he reached a King's palace. He asked for a position there, and the King took him into service.
        - id: ch01-b04
          speaker: narrator
          text: Now the King's only daughter had been carried into the mountains by a Troll. The King and all his people were deep in sorrow. He had promised the Princess and half his kingdom to whoever could free her, but although many had tried, no one had succeeded.
        - id: ch01-b05
          speaker: narrator
          text: After the young man had served at the palace for about a year, he wished to visit his parents. When he reached home, he found that both of them had died. His brothers had divided all their parents' property, and they had left nothing for him.
        - id: ch01-b06
          speaker: youth
          text: Am I to have no part of my inheritance at all?
        - id: ch01-b07
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: How could we know you were still alive after wandering for so long? There are twelve mares on the hills that we have not divided. If you want them as your share, take them.
        - id: ch01-b08
          speaker: narrator
          text: The young man was pleased. He thanked his brothers and went straight up to the hill where the mares were grazing. Each mare had a foal beside her. There was also one large dapple-gray foal, sleek and shining, standing near one of them.
        - id: ch01-b09
          speaker: youth
          text: Well, little foal, you are a handsome fellow.
        - id: ch01-b10
          speaker: dapplegrim
          text: I am. But kill the other twelve foals and let me drink the milk of every mare for a year. Then you will see how large and handsome I can become.
        - id: ch01-b11
          speaker: narrator
          text: The young man did as the foal asked. He killed all twelve little foals and went away again.
        - id: ch01-b12
          speaker: narrator
          text: He returned the next year to see the mares and the dapple-gray yearling. The horse was as fat as it could be, and its coat gleamed. It had grown so tall that the young man could barely climb onto its back. Each mare had another foal beside her.
        - id: ch01-b13
          speaker: youth
          text: Letting you drink from all my mares has cost me nothing. Look at the size of you now! You are quite big enough, so this time you must come with me.
        - id: ch01-b14
          speaker: dapplegrim
          text: Not yet. I must remain here for another year. Kill the twelve new foals, and let me drink from all the mares once more. By summer, you will see how much bigger and finer I am.
        - id: ch01-b15
          speaker: narrator
          text: Again the young man obeyed. When he came back the following year, the mares had foals once more. The dapple-gray colt stood so high that the young man could not reach its neck to feel how fat it was. Light flashed from its bright coat.
        - id: ch01-b16
          speaker: youth
          text: You were big and handsome last year, but now you are finer still. There is no horse like you anywhere in the King's court. You must come away with me now.
        - id: ch01-b17
          speaker: dapplegrim
          text: No. Leave me here for one more year. Kill the twelve little foals again so I can drink from the mares. Come back and see me in the summer.
        - id: ch01-b18
          speaker: narrator
          text: The young man killed the foals and went home. When he returned the next year, he stopped in amazement. He had never imagined that a horse could grow so enormous. The dapple-gray horse had to lie flat before his master could mount, and even then it was hard to climb up. The horse was so plump that its coat shone like a mirror.
        - id: ch01-b19
          speaker: narrator
          text: This time the horse was ready to leave. The young man mounted and rode home. His brothers clapped their hands and crossed themselves, for they had never seen or heard of such a horse in all their lives.
        - id: ch01-b20
          speaker: youth
          text: Bring me the finest horseshoes you can find, along with the grandest saddle and bridle. In return, you may have all twelve mares on the hill, and the twelve foals they have this year as well.
        - id: ch01-b21
          speaker: narrator
          text: The brothers gladly agreed. They gave him shoes that sent sticks and stones flying high whenever the horse ran over the hills. They also brought a golden saddle and a golden bridle that glittered from far away.
        - id: ch01-b22
          speaker: dapplegrim
          text: Now we will return to the King's palace. Remember to ask the King for a good stable and the very best feed for me.
        - id: ch01-b23
          speaker: narrator
          text: The young man promised. With such a horse beneath him, the ride to the palace did not take long.
    - id: ch02
      title: The Princess in the Mountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The King was standing on the palace steps when the young man rode up, and he stared at the magnificent pair.
        - id: ch02-b02
          speaker: king
          text: Never in my life have I seen such a rider or such a horse!
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: The young man asked for a position at court. The King was so delighted that he could almost have danced on the steps, and he hired him at once.
        - id: ch02-b04
          speaker: youth
          text: I will serve you, but my horse must have a fine stable and the best fodder you can provide.
        - id: ch02-b05
          speaker: narrator
          text: The King promised sweet hay and oats, as much as the dappled horse wished to eat. Every other rider had to lead his horse elsewhere so that Dapplegrim could have the whole stable to himself.
        - id: ch02-b06
          speaker: narrator
          text: That peaceful life did not last. The other people at court grew jealous of the young man. They would have done him any harm they dared, and at last they told the King a lie. They claimed that the young man had boasted he could rescue the Princess from the Troll's mountain.
        - id: ch02-b07
          speaker: king
          text: I am told you said you could free my daughter. You must do it now. If you succeed, you know my promise. You will have the Princess and half my kingdom. If you fail, you will be put to death.
        - id: ch02-b08
          speaker: narrator
          text: The young man denied ever saying such a thing, but the King refused to listen. There was nothing he could do except agree to try.
        - id: ch02-b09
          speaker: narrator
          text: He went down to the stable, weighed down with sadness and worry. Dapplegrim asked what troubled him, and the young man explained the King's command.
        - id: ch02-b10
          speaker: youth
          text: I do not know what to do. Freeing the Princess from that mountain is simply impossible.
          emotion: sad
        - id: ch02-b11
          speaker: dapplegrim
          text: It may be possible after all. I will help you. First, you must have me shod properly. Ask for ten pounds of iron, twelve pounds of steel, and two smiths, one to hammer and one to hold.
        - id: ch02-b12
          speaker: narrator
          text: The young man asked, and no one refused him. The iron, steel, and smiths were brought. Once Dapplegrim had been shod strongly and well, he carried his rider out of the palace in a cloud of dust.
        - id: ch02-b13
          speaker: narrator
          text: At last they reached the mountain where the Princess was held. Before them rose a sheer wall of rock. It was as steep as the side of a house and as smooth as glass, yet they had to climb it to reach the ground above.
        - id: ch02-b14
          speaker: narrator
          text: On their first charge, Dapplegrim climbed a short way before both front feet slipped. Horse and rider crashed down with a noise like thunder rolling among the mountains. On the second charge they climbed higher, but one front foot slid, and they fell with the roar of a landslide.
        - id: ch02-b15
          speaker: dapplegrim
          text: This time, we must show them what we can do.
        - id: ch02-b16
          speaker: narrator
          text: Dapplegrim charged a third time. Stones sprang high into the sky beneath his new shoes, and at last he reached the top. He galloped straight into the cleft in the mountain. The young man swept the Princess onto the front of his saddle, and Dapplegrim raced out again before the Troll had time even to stand.
        - id: ch02-b17
          speaker: narrator
          text: So the Princess was free. When they returned to the palace, the King rejoiced to see his daughter. Yet the jealous courtiers had worked on him again, and he was angry with the young man too. As the young man prepared to leave, the King addressed him.
        - id: ch02-b18
          speaker: king
          text: You have my thanks for freeing my Princess.
        - id: ch02-b19
          speaker: youth
          text: She should be my Princess now as well as yours. You gave your word.
        - id: ch02-b20
          speaker: king
          text: Yes, yes, you shall have her because I promised it. But first, you must make the sun shine into my palace.
    - id: ch03
      title: The Hill Before the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A great high hill stood outside the palace windows. Its shadow covered the building so completely that sunlight could not enter.
        - id: ch03-b02
          speaker: youth
          text: That was never part of our bargain. But I see that my words will not change your mind. I must do my best, because I mean to have the Princess.
        - id: ch03-b03
          speaker: narrator
          text: He returned to the stable and told Dapplegrim what the King demanded. The horse said it could easily be done, but he would need another set of shoes. Once again, they must be made with ten pounds of iron and twelve pounds of steel, and one smith must hammer while another held.
        - id: ch03-b04
          speaker: narrator
          text: The young man asked for everything. The King was ashamed to refuse, so the iron, steel, and smiths were provided at once. Dapplegrim received a strong new set of shoes, and his rider mounted him.
        - id: ch03-b05
          speaker: narrator
          text: They went straight toward the hill. Each time Dapplegrim leaped, he drove part of it fifteen ells down into the earth. He bounded on until the entire hill had vanished from before the King's eyes.
        - id: ch03-b06
          speaker: narrator
          text: The young man rode back to the palace. Bright sunlight now poured through the windows, and he asked whether the Princess might finally be his. But the people at court had stirred up the King once more.
        - id: ch03-b07
          speaker: king
          text: You shall have her. I never meant to deny you. But first, you must find her a horse as fine as your own, so she can ride it to the wedding.
        - id: ch03-b08
          speaker: youth
          text: You never asked me for that. I have surely earned the Princess by now.
        - id: ch03-b09
          speaker: narrator
          text: The King would not change his command. If the young man failed, he said, the young man would lose his life. Deeply sorrowful, the young man went down to the stable and told Dapplegrim about this new demand.
        - id: ch03-b10
          speaker: youth
          text: The Princess must have a bridal horse as fine as the bridegroom's, or I will die. How can I find one? There is no horse in the world equal to you.
          emotion: sad
        - id: ch03-b11
          speaker: dapplegrim
          text: There is one horse that can match me, but he lives underground, and taking him will not be easy. Still, we will try. Ask the King for another set of shoes. Bring ten pounds of iron, twelve pounds of steel, and two smiths, one to hammer and one to hold. Make certain the hooks on the shoes are very sharp.
        - id: ch03-b12
          speaker: dapplegrim
          text: We will also need twelve barrels of rye and twelve slaughtered oxen. Keep all twelve hides and set twelve hundred spikes into every one of them. Last of all, bring a barrel large enough to hold twelve tons of tar.
        - id: ch03-b13
          speaker: narrator
          text: The young man went before the King and named everything Dapplegrim required. Again the King thought it would be shameful to refuse. He provided all of it.
    - id: ch04
      title: The Road to the Horse Underground
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The young man mounted Dapplegrim and rode away from the palace. They traveled for a long, long time over hills and moors. At last Dapplegrim turned an ear toward the sky.
        - id: ch04-b02
          speaker: dapplegrim
          text: Do you hear anything?
        - id: ch04-b03
          speaker: youth
          text: Yes. There is a terrible whistling high above us, and it is beginning to frighten me.
          emotion: fearful
        - id: ch04-b04
          speaker: dapplegrim
          text: Those are all the wild birds of the forest. They have been sent to stop us. Cut holes in the grain sacks. The birds will be so busy with the grain that they will forget about us.
        - id: ch04-b05
          speaker: narrator
          text: The young man cut open the sacks, and barley and rye streamed out on every side. Wild birds filled the air in such numbers that they darkened the sun. The moment they saw the grain, they swooped down to scratch and peck. Soon they were fighting among themselves, and they forgot Dapplegrim and his rider entirely. The two travelers passed without harm.
        - id: ch04-b06
          speaker: narrator
          text: They went on for another long stretch, over hills and valleys, across rocks and through marshes. Dapplegrim listened once more.
        - id: ch04-b07
          speaker: dapplegrim
          text: What do you hear now?
        - id: ch04-b08
          speaker: youth
          text: There is a dreadful cracking and crashing all around us in the forest. Now I really am afraid.
          emotion: fearful
        - id: ch04-b09
          speaker: dapplegrim
          text: Those are the wild beasts of the forest. They too have been sent to stop us. Throw out the twelve ox carcasses. The beasts will be too occupied with them to remember us.
        - id: ch04-b10
          speaker: narrator
          text: The young man cast out the slaughtered oxen. Bears, wolves, lions, and all sorts of grim beasts rushed from the forest. At the sight of the carcasses, they fell upon them and fought until blood flowed. They paid no more attention to the young man and Dapplegrim.
        - id: ch04-b11
          speaker: narrator
          text: Once again the travelers rode on. Dapplegrim was so swift that many new lands passed before the young man's eyes. After a time, the great horse neighed and asked his rider to listen.
        - id: ch04-b12
          speaker: youth
          text: I can hear something answering. It sounds like a foal neighing, though it is a very long way off.
        - id: ch04-b13
          speaker: dapplegrim
          text: If its call sounds that clear from so far away, it is no foal. It is a full-grown colt.
        - id: ch04-b14
          speaker: narrator
          text: They traveled through one strange country after another. Dapplegrim neighed a second time and asked whether the young man could hear the answering call now.
        - id: ch04-b15
          speaker: youth
          text: Yes. This time I heard it distinctly. It neighed like a full-grown horse.
        - id: ch04-b16
          speaker: dapplegrim
          text: You will hear him once more very soon. Then you will know what kind of voice he has.
        - id: ch04-b17
          speaker: narrator
          text: They crossed still more kinds of country. Dapplegrim neighed for the third time. Before he could say another word, an answer thundered from beyond the heath. The young man thought the sound would split the hills and rocks apart.
        - id: ch04-b18
          speaker: dapplegrim
          text: He is here. Quickly, cover me with the ox hides that have spikes in them. Pour all twelve tons of tar over the field, then climb that tall spruce tree. When the other horse comes, fire will shoot from his nostrils and set the tar alight.
        - id: ch04-b19
          speaker: dapplegrim
          text: Watch the flames carefully. If they rise, I am winning. If they sink, I am losing. Take off my bridle before you climb. When you see that I have the better of him, throw it over his head, and he will become gentle.
        - id: ch04-b20
          speaker: narrator
          text: The young man fastened all twelve spiked hides over Dapplegrim. He spread the tar across the field and climbed safely into the spruce tree.
    - id: ch05
      title: The Two Dappled Horses
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At that very moment, a horse charged onto the field with flames pouring from both nostrils. The tar caught fire at once. Then the strange horse and Dapplegrim crashed together, fighting so fiercely that stones leaped toward the sky.
        - id: ch05-b02
          speaker: narrator
          text: They bit each other and struck with their front and hind legs. From the tree, the young man looked from the struggling horses to the burning tar and back again. At last the flames began to climb. Whenever the strange horse tried to bite or kick Dapplegrim, he struck one of the spikes hidden in the ox hides. In the end, he had to yield.
        - id: ch05-b03
          speaker: narrator
          text: As soon as the young man saw that Dapplegrim was winning, he hurried down from the tree. He threw the bridle over the other horse's head. In an instant, the fierce creature grew so tame that a slender string could have led him.
        - id: ch05-b04
          speaker: narrator
          text: The captured horse was dappled as well. He looked so exactly like Dapplegrim that no one could tell them apart. The young man mounted the new horse and rode back toward the King's palace, while Dapplegrim ran free beside them.
        - id: ch05-b05
          speaker: narrator
          text: When they entered the courtyard, the King was standing outside. The young man brought the two matching horses before him.
        - id: ch05-b06
          speaker: youth
          text: Can you tell which horse I captured and which one belonged to me before? If you cannot, then I believe your daughter is mine.
        - id: ch05-b07
          speaker: narrator
          text: The King examined both horses. He looked high and low, from the front and from the rear, but he could not find one hair of difference between them.
        - id: ch05-b08
          speaker: king
          text: No, I cannot tell them apart. You have found my daughter a splendid bridal horse, so you shall have her. But there must be one final trial to discover whether you are truly fated to marry her.
        - id: ch05-b09
          speaker: king
          text: The Princess will hide twice, and then you will hide twice. If you find her both times, while she fails to find you, then fate has decided. You shall marry the Princess.
        - id: ch05-b10
          speaker: youth
          text: That was not part of our bargain either. Still, if the trial must be made, then I will face it.
    - id: ch06
      title: The Trial of Hiding
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The King's daughter was to hide first. She changed herself into a duck and swam on the lake just outside the palace. The young man had no idea where she had gone, so he hurried down to Dapplegrim's stall and asked the horse for help.
        - id: ch06-b02
          speaker: dapplegrim
          text: Take your gun down to the lake. Aim it at the duck swimming there. She will soon tell you who she is.
        - id: ch06-b03
          speaker: narrator
          text: The young man picked up his gun and ran to the water. He raised it and took aim at the duck.
        - id: ch06-b04
          speaker: youth
          text: I think I will take a shot at that duck.
        - id: ch06-b05
          speaker: princess
          text: Oh, no, dear friend! Do not shoot. It is me!
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: So the young man found the Princess the first time.
        - id: ch06-b07
          speaker: narrator
          text: For her second hiding place, the Princess changed herself into a loaf of bread. She lay on a table among four other loaves, looking so much like them that no one could see a difference. Once more, the young man went to Dapplegrim and admitted that he had no idea where she was.
        - id: ch06-b08
          speaker: dapplegrim
          text: Find a very large bread knife and sharpen it. In the palace kitchen, there are four loaves on the table. Count them from right to left. Pretend you mean to cut straight through the third loaf, and you will soon find her.
        - id: ch06-b09
          speaker: narrator
          text: The young man went into the kitchen and sharpened the largest bread knife he could find. He took hold of the third loaf from the left and set the blade against it, as if he meant to slice it in two.
        - id: ch06-b10
          speaker: youth
          text: I will cut myself a piece from this loaf.
        - id: ch06-b11
          speaker: princess
          text: No, dear friend! Do not cut me. It is me again!
          emotion: fearful
        - id: ch06-b12
          speaker: narrator
          text: In that way, the young man found her a second time. Now it was his turn to hide, and Dapplegrim told him exactly what to do.
        - id: ch06-b13
          speaker: narrator
          text: First, the young man changed himself into a horsefly and hid inside Dapplegrim's left nostril. The Princess searched everywhere, looking high and low. She tried to enter Dapplegrim's stall, but the horse snapped and kicked until she was afraid to go near him. She could not find the young man.
        - id: ch06-b14
          speaker: princess
          text: I cannot find you. You will have to come out and show yourself.
        - id: ch06-b15
          speaker: narrator
          text: At once the young man appeared, standing on the stable floor.
        - id: ch06-b16
          speaker: narrator
          text: Dapplegrim instructed him again for the second hiding place. This time, the young man changed himself into a lump of earth and wedged himself between the shoe and the hoof of Dapplegrim's left front foot.
        - id: ch06-b17
          speaker: narrator
          text: Again the King's daughter searched everywhere, both inside and outside the palace. At last she entered the stable and approached Dapplegrim's stall. This time the horse allowed her to come in. She peered above and below, but Dapplegrim planted his feet too firmly for her to look beneath his hooves. She could not find the young man there.
        - id: ch06-b18
          speaker: princess
          text: You must show me where you are. I cannot find you anywhere.
        - id: ch06-b19
          speaker: narrator
          text: In an instant, the young man stood beside her on the stable floor.
        - id: ch06-b20
          speaker: youth
          text: Now you are mine.
        - id: ch06-b21
          speaker: narrator
          text: Then he went before the King.
        - id: ch06-b22
          speaker: youth
          text: You can see now that fate means the Princess to be mine.
        - id: ch06-b23
          speaker: king
          text: Yes, fate has decided it. What must be, must be.
        - id: ch06-b24
          speaker: narrator
          text: Everything was prepared for the wedding at once, and it was done with great splendor. The young man rode to the church on Dapplegrim, while the King's daughter rode the matching dappled horse. With horses like those beneath them, they could not have been long on the road.
