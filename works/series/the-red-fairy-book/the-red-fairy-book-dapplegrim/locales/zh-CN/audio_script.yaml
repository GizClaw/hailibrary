audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    youth:
      display_name: 年轻人
      tts:
        delivery: 诚实坚韧，遇到刁难时既忧虑又不肯退缩
        timbre: 年轻明朗
        pace: 适中
        pitch: 中等
    brother_1:
      display_name: 大哥
      tts:
        delivery: 现实冷淡，回答时带着推脱
        timbre: 成熟低沉
        pace: 适中
        pitch: 中低
    brother_2:
      display_name: 二哥
      tts:
        delivery: 漠然随意，习惯跟随兄长的口气
        timbre: 成熟自然
        pace: 适中
        pitch: 中等
    brother_3:
      display_name: 三哥
      tts:
        delivery: 精明疏远，说话简短直接
        timbre: 稍显干涩
        pace: 稍快
        pitch: 中等
    dapplegrim:
      display_name: 灰斑骏马
      tts:
        delivery: 沉着自信，指点主人时果断而胸有成竹
        timbre: 浑厚有力
        pace: 稳健
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严端正，面对苦难时温和体恤
        timbre: 成熟洪亮
        pace: 从容
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 端庄柔和，受惊时急切真诚
        timbre: 年轻清亮
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 山上的灰斑马驹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对富有的夫妇，生了十二个儿子。最小的儿子长大以后，再也不肯留在家里。他一心想出去闯荡，寻找自己的运气。父母劝他留下，说家里的日子已经很好，只要他愿意，永远都可以和他们住在一起。可年轻人怎么也安不下心，非走不可。父母只好答应。他走了很远，来到一座王宫，请求谋个差事，果然得到了一个职位。
        - id: ch01-b02
          speaker: narrator
          text: 这个国家的公主被山妖掳进了大山。国王再没有别的孩子，因此，他和全国百姓都悲痛万分。国王许诺，谁能救回公主，就把女儿嫁给谁，还分给那人半壁江山。许多人试过，却没有一个成功。年轻人在宫里待了大约一年，想回家探望父母。等他赶到家，父母已经去世，哥哥们把双亲留下的一切分得干干净净，什么也没给他留下。
        - id: ch01-b03
          speaker: youth
          text: 难道父母的遗产，我一点也分不到吗？
        - id: ch01-b04
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: 你在外面漂泊了这么久，谁知道你还活着？山上倒还有十二匹母马，我们尚未分配。你若愿意，就拿它们作自己的一份吧。
        - id: ch01-b05
          speaker: narrator
          text: 年轻人听了很满意，谢过哥哥们，立刻动身上山。等他找到那十二匹正在吃草的母马，只见每匹母马身边都有一匹小马驹。其中一匹母马旁，还额外跟着一匹高大的灰斑马驹。那马驹养得十分光润，浑身油亮，远远看去都在闪光。
        - id: ch01-b06
          speaker: youth
          text: 小马驹，你可真漂亮！
        - id: ch01-b07
          speaker: dapplegrim
          text: 是啊。不过，你若杀掉另外十二匹小马驹，让我独自吃十二匹母马一整年的奶，到时候再看吧。我会长得又高大，又俊美！
        - id: ch01-b08
          speaker: narrator
          text: 年轻人真就杀掉了十二匹小马驹，随后离开。第二年，他回乡探望母马和那匹马驹。灰斑马驹已经长得滚圆肥壮，皮毛亮得耀眼，身躯也大得出奇。他费了好大的力气，才爬上它的背。与此同时，那十二匹母马身边又各自有了新生的小马驹。
        - id: ch01-b09
          speaker: youth
          text: 看来，让你吃尽所有母马的奶，我一点也没有吃亏。可你已经长得够大了，现在该跟我走。
        - id: ch01-b10
          speaker: dapplegrim
          text: 不行，我还得再留一年。你把这十二匹小马驹也杀掉，让我今年继续吃所有母马的奶。等到夏天，你再看我能长得多高大、多俊美。
        - id: ch01-b11
          speaker: narrator
          text: 年轻人又照办了。再过一年，他上山一看，每匹母马又生了马驹。那匹灰斑马却高得惊人。年轻人想摸摸它的脖子，看它有多肥，伸长手也够不到。阳光照在它明亮的皮毛上，反射出一片光芒。
        - id: ch01-b12
          speaker: youth
          text: 我的马驹，去年你已经又高大又俊美，今年更是漂亮得不得了。整个王宫也找不到你这样的马。这回，你该跟我走了。
        - id: ch01-b13
          speaker: dapplegrim
          text: 还不行。我必须再留一年。你再杀掉十二匹小马驹，让我今年也吃尽母马的奶。等夏天再来看我吧。
        - id: ch01-b14
          speaker: narrator
          text: 年轻人杀掉了所有小马驹，又回去了。第二年再来时，他简直吓了一跳。他从没想过，一匹马竟能长得这么高大，甚至大得有些吓人。灰斑马必须把四条腿全都伏在地上，他才爬得上去。即使马已经趴下，往它背上爬仍然很费力。它养得那么肥壮，皮毛闪闪发亮，活像一面镜子。这一次，灰斑马没有再说要留下，而是愿意跟他走了。
        - id: ch01-b15
          speaker: narrator
          text: 年轻人骑马回到哥哥们那里。哥哥们从没见过，也没听说过这样的马，一个个惊得拍起手来，还在胸前画十字。
        - id: ch01-b16
          speaker: youth
          text: 你们替我的马钉上世上最好的马掌，再找来最华丽的鞍辔。山上的十二匹母马，连同今年新生的十二匹小马驹，就全都归你们。
        - id: ch01-b17
          speaker: narrator
          text: 哥哥们很乐意。灰斑马钉上最好的马掌，跑过山冈时，树枝和石块都被踢得高高飞起。它又配上黄金做的马鞍和辔头，远远就能看见金光闪耀。
        - id: ch01-b18
          speaker: dapplegrim
          text: 现在，我们去王宫。记住，你必须向国王替我讨一间好马厩，还要最上等的饲料。
        - id: ch01-b19
          speaker: narrator
          text: 这匹马名叫灰斑骏马。年轻人答应不会忘记，随即骑它赶往王宫。有这样的坐骑，他们自然转眼便到了。
    - id: ch02
      title: 救回公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 年轻人来到宫前，国王正站在台阶上。眼看这样一位骑手驾着世所罕见的骏马来到面前，国王瞪大眼睛，直盯着他看个不停。
        - id: ch02-b02
          speaker: king
          text: 哎呀，我活了一辈子，从没见过这样的人、这样的马。
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: 年轻人问，自己能不能在王宫里谋个职位。国王欢喜得几乎要在台阶上跳起舞来，当场便答应收下他。
        - id: ch02-b04
          speaker: youth
          text: 我还有一个条件。请给我的马一间好马厩，再供应最上等的饲料。
        - id: ch02-b05
          speaker: narrator
          text: 宫里答应给灰斑骏马香甜的干草和燕麦，它想吃多少就有多少。其余骑手还得把自己的马牵出去，让它独住一间马厩，有足够的地方舒展身体。
        - id: ch02-b06
          speaker: narrator
          text: 可好日子没过多久。宫里其他人嫉妒起年轻人来，只要有胆量，他们什么坏事都肯做。最后，他们去告诉国王，年轻人曾经夸口，说自己随时都能救回多年前被山妖掳走的公主。
        - id: ch02-b07
          speaker: narrator
          text: 国王立刻召见年轻人，说自己已经听说，他自称有本领救出公主，现在就命他兑现这句所谓的豪言。他若救回公主，国王便依照旧日的许诺，把女儿嫁给他，再分给他半壁江山，而且一定会诚实而体面地履行诺言。他若失败，就要被处死。年轻人竭力否认自己说过这种话，可不论怎样申辩，国王一个字也不肯听。他别无选择，只好答应尝试。
        - id: ch02-b08
          speaker: narrator
          text: 年轻人走进马厩，满怀忧愁。灰斑骏马问他出了什么事，他便把国王的命令说了一遍。
        - id: ch02-b09
          speaker: youth
          text: 我实在不知道怎么办。要从山妖手里救出公主，根本不可能。
          emotion: sad
        - id: ch02-b10
          speaker: dapplegrim
          text: 那倒未必。我会帮你。你先去要十磅铁、十二磅钢，再找两个铁匠。一个抡锤，一个扶稳我的马蹄，给我钉上一副结实的马掌。
        - id: ch02-b11
          speaker: narrator
          text: 没有人拒绝年轻人的要求。铁和钢都送来了，两个铁匠一个抡锤，一个扶住马蹄，给灰斑骏马钉上坚固的马掌。它载着主人冲出王宫，身后扬起一片尘云。他们来到公主被囚禁的大山，却被一道绝壁挡住。要登上后面的山峰，非得越过这面岩壁不可。岩壁像房屋的墙一样陡，又像一整片玻璃一样光滑。第一次冲上去，灰斑骏马爬了一小段，两条前腿便打了滑。一人一马轰然摔下，巨响像雷鸣一样传遍群山。第二次，他们冲得更高，可马的一条前腿又滑脱了。他们再次滚落，声势如同山崩。
        - id: ch02-b12
          speaker: dapplegrim
          text: 这一回，该让他们见识我们的本领了。
        - id: ch02-b13
          speaker: narrator
          text: 灰斑骏马第三次冲向绝壁，踢得石块直飞高空，终于跃上山顶。它驮着年轻人疾驰进山间裂谷。年轻人一把将公主抱到鞍桥前，没等山妖站起身，便带着她飞奔而去。公主就这样获救了。
        - id: ch02-b14
          speaker: narrator
          text: 年轻人带着公主返回王宫。国王失而复得，自然又欢喜又激动。可宫里那些人不知用了什么手段，又把他挑唆得对年轻人动了怒。年轻人把公主送进宫，正要离开，国王只冷淡地说，年轻人救回他的公主，他自然会表示感谢。
        - id: ch02-b15
          speaker: youth
          text: 现在，她应当既是您的公主，也是我的公主。您向来一言九鼎。
        - id: ch02-b16
          speaker: king
          text: 对，对。我既然说过，她自然归你。不过，你得先让阳光照进我的王宫。
        - id: ch02-b17
          speaker: narrator
          text: 原来，宫殿窗外耸立着一座又高又大的山丘。阴影严严实实罩住宫殿，阳光根本照不进来。
        - id: ch02-b18
          speaker: youth
          text: 这可不在我们的约定里。可我说什么也改变不了您的主意，只好尽力试试。公主我是一定要娶的。
    - id: ch03
      title: 与灰斑骏马匹敌的马
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 年轻人又去找灰斑骏马。灰斑骏马说，这件事很容易，只要再用十磅铁、十二磅钢，请两个铁匠替它换一副新马掌。国王不好意思拒绝，马上给了年轻人所需的一切。灰斑骏马载着主人来到山丘前。它每跳一步，山丘便向地下陷落十五厄尔。他们一路跳去，直到那座山丘彻底消失，国王眼前再也看不见它。
        - id: ch03-b02
          speaker: narrator
          text: 年轻人回到王宫，问自己是否终于能娶公主。那座遮蔽窗户的高大山丘已经彻底消失，阳光照进了宫殿，谁也无法否认。可是，那些人又一次挑唆国王。国王说，他当然会让年轻人娶公主，从来没有打算反悔，只是年轻人还得替新娘找来一匹婚礼坐骑，并且必须和新郎的马一样出色。年轻人提醒国王，这个条件从未说过，自己已经救回公主，也让阳光照进宫殿，早就真正赢得了她。国王却坚持己见，还说年轻人若办不到，就得丢掉性命。
        - id: ch03-b03
          speaker: narrator
          text: 年轻人只好回到马厩，心里又悲伤又苦恼。他把新的要求告诉灰斑骏马。
        - id: ch03-b04
          speaker: youth
          text: 国王非要我替公主找一匹与你同样出色的婚礼骏马，否则就处死我。这怎么可能呢？世上根本没有马能与你相比。
          emotion: sad
        - id: ch03-b05
          speaker: dapplegrim
          text: 世上确有一匹马能与我匹敌，只是它住在地下，不容易弄到手。不过，我们可以试试。你先替我再要一副新马掌，仍用十磅铁、十二磅钢和两个铁匠，马掌上的钩子必须锋利。再讨来十二桶黑麦、十二头宰好的公牛，还有十二张牛皮，每张钉上一千二百枚尖钉。最后，再带一桶焦油，桶里要有整整十二吨。
        - id: ch03-b06
          speaker: narrator
          text: 年轻人把这些东西一样样报给国王。国王觉得拒绝他有失体面，便全都给了他。年轻人备齐一切，骑上灰斑骏马离开王宫。他们翻过一座又一座山丘，穿过辽阔的荒原，向远方走了很久很久。
        - id: ch03-b07
          speaker: dapplegrim
          text: 你听见什么了吗？
        - id: ch03-b08
          speaker: youth
          text: 高空中传来可怕的呼啸声，我听着都有些害怕。
          emotion: fearful
        - id: ch03-b09
          speaker: dapplegrim
          text: 那是林中所有的野鸟。它们奉命来拦截我们。你在粮袋上割个洞，它们忙着啄食粮食，自然就会忘掉我们。
        - id: ch03-b10
          speaker: narrator
          text: 年轻人照它的话，在粮袋上割开洞口。大麦和黑麦顿时洒向四面八方。林中的野鸟全都飞了过来，数量多得遮住了太阳。可它们一看见地上的粮食，就再也顾不上原来的任务，纷纷落地，又刨又啄，争着吞食大麦和黑麦。最后，鸟群甚至彼此争斗起来。它们把年轻人和灰斑骏马忘得一干二净，两位旅伴从旁经过，没有受到半点伤害。
        - id: ch03-b11
          speaker: narrator
          text: 他们继续赶路，翻山越谷，又经过乱石地和沼泽。走了很久，灰斑骏马再次侧耳倾听。
        - id: ch03-b12
          speaker: dapplegrim
          text: 这回，你听见什么了？
        - id: ch03-b13
          speaker: youth
          text: 四面八方的树林里，全是可怕的断裂声和撞击声。这一回，我真的要害怕了。
          emotion: fearful
        - id: ch03-b14
          speaker: dapplegrim
          text: 那是林中所有的野兽。它们也来拦截我们。你扔下十二头公牛的尸体，它们一忙着争食，就会把我们完全忘掉。
        - id: ch03-b15
          speaker: narrator
          text: 年轻人照它的话，把十二头公牛的尸体全都扔了出去。林中野兽从四面八方赶来，有熊，有狼，有狮子，还有各种凶猛的怪兽。它们一看见牛尸便扑上去争抢，为了食物彼此撕咬，斗得鲜血横流。谁也不再理会灰斑骏马和年轻人，两位旅伴又一次平安通过。
        - id: ch03-b16
          speaker: narrator
          text: 年轻人又继续赶路。一路上，他们看见了许许多多从未见过的景象。骑在灰斑骏马背上，当然不会走得慢。山川飞快退到身后。忽然，灰斑骏马仰头嘶鸣了一声。
        - id: ch03-b17
          speaker: dapplegrim
          text: 你听见什么了吗？
        - id: ch03-b18
          speaker: youth
          text: 很远很远的地方，好像有匹小马驹在叫，声音还听得很清楚。
        - id: ch03-b19
          speaker: dapplegrim
          text: 离得这么远，你都听得如此清楚，那可是一匹成年的公马。
        - id: ch03-b20
          speaker: narrator
          text: 他们又走了很久。灰斑骏马第二次嘶鸣起来。
        - id: ch03-b21
          speaker: dapplegrim
          text: 现在听见了吗？
        - id: ch03-b22
          speaker: youth
          text: 听得清清楚楚。这声音像一匹成年骏马在嘶鸣。
        - id: ch03-b23
          speaker: dapplegrim
          text: 很快你还会再听见一次。到时，你就知道它的声音究竟有多响亮。
        - id: ch03-b24
          speaker: narrator
          text: 他们继续向前，又穿过许多地貌各异的地方。灰斑骏马第三次嘶鸣起来。还没等它开口询问，荒原另一边便传来一声惊天动地的马嘶。那声音比前两次清楚得多，也响亮得多。年轻人觉得，山丘和岩石都快被震裂了。
        - id: ch03-b25
          speaker: dapplegrim
          text: 它来了！快把钉满尖钉的牛皮披到我身上，把十二吨焦油泼遍田野，再爬上那棵高大的云杉。它的鼻孔会喷火，焦油随即燃烧。你看清楚，火焰向上升，就是我赢；火焰向下落，就是我输。你若见我占了上风，就取下我的辔头套到它头上。那时，它便会变得十分温顺。
        - id: ch03-b26
          speaker: narrator
          text: 年轻人刚披好牛皮，泼完焦油，安全爬上云杉，那匹鼻孔喷火的马便冲了过来。焦油顷刻燃烧，两匹骏马随即厮打起来，踢得石块飞上高空。它们互相撕咬，前腿后腿一齐踢打。年轻人一会儿望望战场，一会儿看看火焰。最后，火焰终于向上升起。陌生骏马无论咬向哪里、踢向哪里，都会撞上牛皮里的尖钉，终于不得不认输。
        - id: ch03-b27
          speaker: narrator
          text: 年轻人一看火焰上升，知道灰斑骏马已经得胜，立刻从树上爬下来。他取下灰斑骏马的辔头，套到陌生骏马头上。那匹方才还喷火恶斗的马，顿时温顺得仿佛只用一根细线就能牵走。它身上也有灰斑，模样同灰斑骏马一模一样，谁也分不清哪匹是哪匹。年轻人骑上新捉来的马，灰斑骏马没有佩戴辔头，自由地跑在一旁。他们一起返回王宫。
    - id: ch04
      title: 最后的考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们到达王宫时，国王正站在庭院里。
        - id: ch04-b02
          speaker: youth
          text: 请您看看，哪一匹是我新捉来的马，哪一匹是我原先的马？您若分辨不出，我想公主就该归我了。
        - id: ch04-b03
          speaker: narrator
          text: 国王走到两匹灰斑马跟前，仔仔细细地辨认。他先抬头看，再弯腰看，又绕到马前，转到马后，来来回回瞧了好几遍。可两匹马从头到尾，连一根毛的差别也没有。
        - id: ch04-b04
          speaker: king
          text: 我确实分辨不出。你既然替我女儿找来这样出色的婚礼骏马，她自然应该嫁给你。不过，我们还要考验一次，看看命运是否注定你会娶她。她藏两次，你也藏两次。她每次藏起来，你若都能找到；你藏起来，她若一次也找不到，那就是命中注定。我便把公主嫁给你。
        - id: ch04-b05
          speaker: youth
          text: 这也不在我们的约定里。不过，既然非这样不可，我们就接受考验吧。
        - id: ch04-b06
          speaker: narrator
          text: 公主先藏。她变成一只鸭子，在宫外的湖里游来游去。年轻人到马厩询问灰斑骏马，公主到底藏去了哪里。
        - id: ch04-b07
          speaker: dapplegrim
          text: 你拿上猎枪，到湖边瞄准水里的那只鸭子。她很快就会自己现身。
        - id: ch04-b08
          speaker: narrator
          text: 年轻人抓起猎枪，跑到湖边。他举起枪，瞄准那只鸭子。
        - id: ch04-b09
          speaker: youth
          text: 我正好朝这只鸭子开一枪。
        - id: ch04-b10
          speaker: princess
          text: 啊，不要，亲爱的朋友，别开枪！是我！
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: 年轻人第一次找到了公主。第二次，公主变成一只面包，躺在桌上的另外四只面包中间。她和其余面包一模一样，谁也看不出区别。年轻人又去请教灰斑骏马。
        - id: ch04-b12
          speaker: dapplegrim
          text: 你找一把很大的面包刀，把它磨锋利。王宫厨房的桌上摆着几只面包。从右向左数，拿起四只面包里的第三只，装作要从正中切开。她很快就会现身。
        - id: ch04-b13
          speaker: narrator
          text: 年轻人来到厨房，找出最大的一把面包刀，磨得雪亮。他抓起左边数来第三只面包，把刀架在上面，仿佛真要一刀切成两半。
        - id: ch04-b14
          speaker: youth
          text: 我来切一块面包吃。
        - id: ch04-b15
          speaker: princess
          text: 不要，亲爱的朋友，别切！是我！
          emotion: fearful
        - id: ch04-b16
          speaker: narrator
          text: 年轻人第二次也找到了她。现在轮到年轻人去藏。灰斑骏马早已仔细指点过他，所以公主要找到他可不容易。第一次，他变成一只马蝇，钻进灰斑骏马的左鼻孔。公主在宫里宫外到处翻找，上上下下，一处也不肯放过。她甚至来到马厩，想走进灰斑骏马的马栏，可骏马立刻又咬又踢，吓得她不敢靠近。公主只好退出来继续寻找，却始终看不见年轻人的踪影。
        - id: ch04-b17
          speaker: princess
          text: 好吧，我找不到你。你自己出来吧。
        - id: ch04-b18
          speaker: narrator
          text: 话音刚落，年轻人便现身，站在马厩的地面上。第二次，他又照灰斑骏马的指点，变成一小块泥土，紧紧嵌进它左前蹄的马蹄铁和蹄子之间。公主再次寻找，从宫里找到宫外，又从高处找到低处，最后还是来到马厩。这次，灰斑骏马没有阻拦，让她走进马栏。公主上上下下仔细察看，却没法检查它的蹄底，因为它四条腿站得实在太稳，根本不肯抬蹄。她还是没找到年轻人。
        - id: ch04-b19
          speaker: princess
          text: 你只得自己出来了，我实在找不到你。
        - id: ch04-b20
          speaker: narrator
          text: 转眼间，年轻人已经站在她身旁。
        - id: ch04-b21
          speaker: youth
          text: 现在，你归我了！
          emotion: happy
    - id: ch05
      title: 命中注定的婚礼
      blocks:
        - id: ch05-b01
          speaker: youth
          text: 国王陛下，现在您该看见了，命运注定她属于我。
        - id: ch05-b02
          speaker: king
          text: 不错，这的确是命中注定。既然命该如此，就只能如此。
        - id: ch05-b03
          speaker: narrator
          text: 众人不再耽搁，立刻开始筹备婚礼，很快便把一切安排得华丽而隆重。到了婚礼那一天，年轻人骑着灰斑骏马去教堂，国王的女儿则骑着另一匹一模一样的灰斑马。两匹神骏的坐骑并肩飞驰，谁都看得出来，新郎和新娘在路上自然花不了多少时间。这个故事采自约尔根·莫的作品。
