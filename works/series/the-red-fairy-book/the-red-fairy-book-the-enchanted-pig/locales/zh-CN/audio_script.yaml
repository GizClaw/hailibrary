audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严而慈爱，忧虑时仍保持克制
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低
    eldest_princess:
      display_name: 大公主
      tts:
        delivery: 自信大胆，兴奋时带着怂恿人的口吻
        timbre: 明亮清晰
        pace: 适中
        pitch: 中高
    second_princess:
      display_name: 二公主
      tts:
        delivery: 爽快活泼，打趣时略显轻率
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 温柔敏感，历经苦难后坚韧沉静
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
    pig_prince:
      display_name: 猪王子
      tts:
        delivery: 有礼而坚定，恢复人身后温厚深情
        timbre: 温暖低沉
        pace: 从容
        pitch: 中低
    witch:
      display_name: 老巫婆
      tts:
        delivery: 表面殷勤慈祥，话语深处藏着狡诈
        timbre: 苍老干涩
        pace: 稍慢
        pitch: 中低
    moon_mother:
      display_name: 月亮的母亲
      tts:
        delivery: 怜悯慈爱，像长者般温柔指点
        timbre: 柔暖苍老
        pace: 舒缓
        pitch: 中等
    sun_mother:
      display_name: 太阳的母亲
      tts:
        delivery: 和善从容，解释世事时庄重清楚
        timbre: 温厚明亮
        pace: 适中
        pitch: 中等
    wind_mother:
      display_name: 风的母亲
      tts:
        delivery: 朴实慈祥，带来消息时亲切笃定
        timbre: 苍老清晰
        pace: 舒缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 禁室里的预言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王，膝下有三个女儿。有一回，敌军率领大军逼近，国王不得不出征。他把三个女儿叫到跟前，临行前仔细叮嘱她们。
        - id: ch01-b02
          speaker: king
          text: 亲爱的孩子们，我必须上战场了。把你们留在宫里，我实在放心不下。我不在时，你们要照顾好自己，也替我照管宫里的一切。花园尽管去，宫中的房间也都可以进去，只有后面右手角落里的那一间不许开。你们千万别进去，否则一定会惹来祸事。
        - id: ch01-b03
          speakers: [eldest_princess, second_princess, youngest_princess]
          ensemble: chorus
          text: 父王放心，我们从来没有违背过您的话。您安心出征吧，愿上天赐您一场辉煌的胜利！
        - id: ch01-b04
          speaker: narrator
          text: 一切准备妥当，国王又重复一遍禁令，才把所有房间的钥匙交给大女儿。三位公主含着眼泪，亲吻父亲的手，祝他顺利归来。父亲走后，她们又伤心又无聊，只好每天做一会儿针线，读一会儿书，再到花园里玩一阵。起初日子十分安稳，可没过多久，好奇心便在她们心里一天一天长大了。
        - id: ch01-b05
          speaker: eldest_princess
          text: 妹妹们，我们整天缝衣、纺线、看书，花园每个角落都逛遍了，宫里那些漂亮房间也全都看过。父王不许进的那间屋子，我们为什么偏不能去瞧瞧？
        - id: ch01-b06
          speaker: youngest_princess
          text: 姐姐，你怎么能劝我们违背父王的命令？他既然特意不许我们进去，一定有他的道理。
        - id: ch01-b07
          speaker: second_princess
          text: 就算进去一回，天也不会塌下来呀。屋里总不会藏着等着吃人的恶龙吧？况且，父王怎么可能知道我们进去过？
        - id: ch01-b08
          speaker: narrator
          text: 三姐妹边说边给彼此壮胆，不知不觉已经走到禁室门前。大公主把钥匙插进锁孔。咔嗒一声，门开了。三个姑娘一同走进去。你猜她们看见了什么？屋里空空荡荡，没有任何装饰，只有正中央摆着一张铺着华丽桌布的大桌子，桌上摊开一本大书。她们立刻围了过去，都想知道书里究竟写着什么。
        - id: ch01-b09
          speaker: narrator
          text: 大公主最心急，先读出了书上的预言。
        - id: ch01-b10
          speaker: eldest_princess
          text: 这位国王的大女儿，将嫁给一位来自东方的王子。
        - id: ch01-b11
          speaker: narrator
          text: 二公主赶紧翻到下一页。
        - id: ch01-b12
          speaker: second_princess
          text: 这位国王的二女儿，将嫁给一位来自西方的王子。
        - id: ch01-b13
          speaker: narrator
          text: 两个姐姐欢喜得笑个不停，还互相打趣。小公主却不愿靠近桌子，更不肯翻书。姐姐们哪里肯放过她，硬把她拉过去。小公主浑身发抖，终于翻开下一页。
        - id: ch01-b14
          speaker: youngest_princess
          text: 这位国王的小女儿，将嫁给一头来自北方的猪。
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 就算一道霹雳从天而降，也不会让她更加惊恐。小公主悲痛得几乎死去，若不是姐姐们扶着，早就栽倒在地，撞破脑袋了。她当场昏了过去，醒来以后，两个姐姐连忙安慰她。
        - id: ch01-b16
          speaker: eldest_princess
          text: 这种胡话怎么能信？世上哪有国王的女儿嫁给一头猪的事？
        - id: ch01-b17
          speaker: second_princess
          text: 你怎么像个小娃娃一样！就算那恶心的东西真来求婚，父王手下那么多士兵，难道还保护不了你吗？
        - id: ch01-b18
          speaker: narrator
          text: 小公主多想相信姐姐，可心里始终沉甸甸的。书上许给姐姐们的是幸福，留给她的却是世上从未听闻过的命运。违背父亲的命令，也让她深深自责。没过几天，她便憔悴得几乎叫人认不出。过去那个面色红润、活泼爱笑的姑娘，如今脸色苍白，什么都不能让她欢喜。她不再去花园玩，不再把鲜花插在发间，做针线时也不唱歌了。
        - id: ch01-b19
          speaker: narrator
          text: 这时，国王已经大败敌军，匆匆赶回国都。百姓敲钹、吹笛、打鼓，欢庆他的胜利。国王先感谢上天，又赶回王宫看女儿。小公主竭力藏起悲伤，可父亲还是发现她越来越瘦，也越来越愁苦。他心头像插进一块烧红的烙铁，立刻猜到女儿们违背了禁令。
        - id: ch01-b20
          speaker: narrator
          text: 国王确信自己的猜测没有错，可还是要问个明白。他把三个女儿叫到跟前，一一盘问，命她们必须说出实话。三姐妹终于承认了一切，却谁也不肯说最初是谁撺掇了另外两个。国王听了，难过得几乎承受不住。但女儿们已经吓得面无人色，他只好强打精神，反过来安慰她们。事情已经发生，就算再说一千句话，也改变不了分毫。
        - id: ch01-b21
          speaker: narrator
          text: 日子久了，这场风波几乎被人忘记。一天，一位东方王子来到宫廷，向大公主求婚。国王欣然答应，宫中摆下盛大的婚宴，欢庆三日，又在一片喜悦中隆重地把新人送到边境。后来，西方的一位王子也来到宫中，赢得二公主的芳心，把她娶走了。书中的预言一一应验，小公主越发绝望。她不肯吃饭，不肯穿漂亮衣服，也不愿出门散步，还说自己宁死也不愿成为天下人的笑柄。国王绝不许她做出这样的错事，只得想尽一切办法安慰她。
    - id: ch02
      title: 猪的新娘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又过了一段日子，一头来自北方的大猪忽然走进王宫，径直来到国王面前。他一开口，竟说出一番十分漂亮的话。
        - id: ch02-b02
          speaker: pig_prince
          text: 向您致敬，国王陛下！愿您一生兴旺光明，就像晴天的朝霞一样。
        - id: ch02-b03
          speaker: king
          text: 朋友，见你安好，我也高兴。可是，哪一阵风把你吹到这里来了？
        - id: ch02-b04
          speaker: pig_prince
          text: 我是来求婚的。
        - id: ch02-b05
          speaker: narrator
          text: 国王听一头猪这样说话，立刻明白事情不寻常。他不愿把女儿嫁给猪，很想劝对方改变心意。可宫廷内外，连整条街上，都已经挤满了全世界的猪。国王无路可退，只能答应。猪还坚持一星期内必须举行婚礼，非要国王郑重发誓才肯离开。
        - id: ch02-b06
          speaker: narrator
          text: 国王叫来小女儿，劝她顺从命运，因为眼前已经没有别的办法。他又把自己的猜测告诉她。
        - id: ch02-b07
          speaker: king
          text: 孩子，这头猪的谈吐举止样样不凡，我不信他生来就是一头猪。这一定是魔法或巫术。你顺从他，尽量照他的心愿去做。我相信，上天很快会让你得到解脱。
        - id: ch02-b08
          speaker: youngest_princess
          text: 亲爱的父王，既然您希望我这样做，我会听您的话。
        - id: ch02-b09
          speaker: narrator
          text: 婚期转眼便到。成婚以后，猪和新娘乘坐王家马车，动身回他的住处。路过一片大泥沼时，猪忽然命车夫停车。他跳进泥里滚来滚去，直到浑身沾满污泥，才爬回车上，叫妻子亲吻自己。可怜的姑娘想起父亲的嘱咐，拿出手帕，轻轻擦净猪的口鼻，在上面亲了一下。
        - id: ch02-b10
          speaker: narrator
          text: 他们抵达森林深处的住处时，天已经黑透。两人歇了一会儿，一起吃过晚饭，便躺下休息。夜里，公主忽然发现，身旁的猪竟变成了一个男人。她惊讶万分，却记得父亲的话，于是鼓起勇气，决定等着看下去。
        - id: ch02-b11
          speaker: narrator
          text: 从此她留心观察，果然每到夜晚，猪便变成人。每天清晨，又会在她醒来前变回猪。这样的事一连发生了好几夜，她怎么也想不明白，最后只能断定丈夫一定中了魔法。日子久了，她见他待自己那样和善温柔，也真心喜欢上了他。
        - id: ch02-b12
          speaker: narrator
          text: 一天，公主独自坐着，看见一个老巫婆从门前经过。她已经很久没有见过人，便激动地叫住老妇人，请她进来聊天。巫婆说自己精通法术，不但能预知未来，还知道怎样用花草治病。
        - id: ch02-b13
          speaker: youngest_princess
          text: 老婆婆，只要你肯告诉我丈夫究竟出了什么事，我一辈子都会感激你。他为什么白天是猪，到了夜里却变成人呢？
        - id: ch02-b14
          speaker: witch
          text: 亲爱的，我正要说这件事，也让你瞧瞧我的本领。你若愿意，我可以给你一样东西，破除他的魔法。
        - id: ch02-b15
          speaker: youngest_princess
          text: 求你把它给我吧。无论你要什么报酬，我都答应。我实在不忍心看他一直这样。
        - id: ch02-b16
          speaker: witch
          text: 那就拿着这根线。可别让他知道，否则它会失去效力。等他夜里睡熟，你悄悄起来，把线牢牢系在他的左脚上。到了早晨，他就不会变回猪了。我不要报酬，只要知道你从此幸福就够了。一想到你吃了这么多苦，我的心都快碎了。早知道的话，我早就来救你了。
        - id: ch02-b17
          speaker: narrator
          text: 巫婆走后，公主小心地把线藏好。到了夜里，她等丈夫睡熟，才悄悄起身。她的心怦怦直跳，手里却不敢发出一点声响。她把线缠到丈夫的左脚上，正要把绳结收紧，只听啪的一声，线断了。原来巫婆交给她的，竟是一根早已腐朽的线。
        - id: ch02-b18
          speaker: pig_prince
          text: 不幸的女人啊，你做了什么？只差三天，我身上的邪恶魔法就会解除。现在谁知道我还要披着这副可憎的模样多久？我必须马上离开。除非你为了寻找我，穿破三双铁鞋，磨钝一根钢杖，否则我们再也不能相见。
        - id: ch02-b19
          speaker: narrator
          text: 话音一落，他便消失了。公主独自留下，哭得肝肠寸断。可是眼泪和哀号丝毫无济于事。她终于站起身来，决意不管命运把自己带到哪里，都要继续走下去。
    - id: ch03
      title: 月亮与太阳的家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 公主来到一座城里，所做的第一件事，就是定制三双铁鞋和一根钢杖。旅途所需的东西准备妥当，她马上出发寻找丈夫。她不停地走啊走，越过九片海，跨过九块大陆，又走进一座座森林。那里的树干粗得像啤酒桶。倒下的树枝一次次将她绊倒，让她撞得遍体鳞伤。可她每次都会重新爬起来，继续赶路。头顶的树枝抽打她的脸，脚边的灌木划破她的手，她始终向前，从不回头。漫长的旅途几乎耗尽她的力气，悲伤也压得她抬不起头，可心底仍留着一线希望。终于，她来到一所房子前。
        - id: ch03-b02
          speaker: narrator
          text: 你猜住在那里的是谁？原来是月亮。公主敲门，请求进去稍歇。月亮的母亲见她这样凄惨，十分怜悯，便收留她，日日悉心照料。公主在这里住了一段日子，还生下了一个小婴儿。一天，月亮的母亲问起她的来历。
        - id: ch03-b03
          speaker: moon_mother
          text: 你不过是个凡人，怎么会一路来到月亮的家呢？
        - id: ch03-b04
          speaker: narrator
          text: 公主把自己的遭遇从头到尾说了一遍。
        - id: ch03-b05
          speaker: youngest_princess
          text: 我永远感激上天把我领到这里，也感激您收留我和孩子，没有让我们死在外面。如今我只求您最后一件事。您的女儿月亮，能告诉我丈夫在哪里吗？
        - id: ch03-b06
          speaker: moon_mother
          text: 她也不知道，孩子。不过，你一直向东走，找到太阳的住处，他也许会有消息。
        - id: ch03-b07
          speaker: narrator
          text: 月亮的母亲给公主一只烤鸡充饥，还再三叮嘱她，一根鸡骨头也不要丢，往后也许大有用处。公主再次感谢她的收留和指点，随后脱下已经穿破的第一双铁鞋，把它丢在一旁，换上第二双。她仔细把鸡骨头扎成一包，再把婴儿抱进怀里，另一只手拿好钢杖，重新踏上漫长的旅途。
        - id: ch03-b08
          speaker: narrator
          text: 她走啊走，穿过荒凉的沙漠。沙地难走极了，每向前迈出两步，便会滑退一步。她拼尽力气走出旷野，又翻越高耸的石山，从一块峭岩跃向另一块，从一座山峰攀向下一座。她偶尔停下来喘口气，随后又向更远处走去。她蹚过沼泽，爬上遍布尖石的山峰，双脚、膝盖和手肘全都磨破流血。有时深渊挡住去路，她只能手脚并用，靠钢杖支撑着绕过去。
        - id: ch03-b09
          speaker: narrator
          text: 最后，公主累得奄奄一息，终于来到太阳的宫殿。她敲响宫门，请求主人让自己进去。太阳的母亲开了门，见一个凡人竟从遥远的人间来到这里，惊讶不已。听完她遭受的种种苦难，又怜悯得流下泪来。她答应替公主向儿子打听丈夫的下落，却先把母子俩藏进地窖，免得太阳回家以后发现。太阳每天夜里回来时，脾气总是很坏。
        - id: ch03-b10
          speaker: narrator
          text: 第二天，公主十分害怕，因为太阳已经察觉，有个来自另一个世界的人进过宫殿。幸好他的母亲轻言细语地哄住他，坚持说绝无此事。公主见这位长者如此保护自己，才终于放下心来。
        - id: ch03-b11
          speaker: youngest_princess
          text: 可是，太阳怎么也会发脾气呢？他那么美丽，又给凡人带来那么多好处。
        - id: ch03-b12
          speaker: sun_mother
          text: 清晨，他站在天堂门前，心里快活，便向整个世界微笑。到了白天，他看见人们做下的恶事，脾气越来越坏，所以阳光才会那样灼热。傍晚时，他站在死亡之门前，既悲伤又愤怒。每天走完这段路，他才会从那里回到家中。
        - id: ch03-b13
          speaker: narrator
          text: 太阳的母亲已经替公主问过，可她的儿子对那位失踪的丈夫一无所知。公主如今唯一的希望，只剩下去问风。临行前，太阳的母亲也给她一只烤鸡充饥，还像月亮的母亲一样，叫她仔细收好每一根骨头。公主把骨头包好，扔掉彻底穿破的第二双铁鞋。她把孩子抱在臂弯里，另一只手握着那根钢杖，离开太阳的宫殿，向风的住处走去。
    - id: ch04
      title: 穿破三双铁鞋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这一程比从前更加艰险。公主翻过一座又一座燧石山，山石间不时蹿出长长的火舌。她又穿过从来没有人踏足的森林，越过冰原和滚落的雪崩。种种苦难几乎要了她的命，可她始终没有失去勇气。最后，她来到山腹间一个巨大的洞穴。这里正是风的住处。洞前围着栅栏，栏上开着一扇小门。公主敲门请求收留，风的母亲怜悯她，便让她进来歇息，也把她藏好，不让风发现。
        - id: ch04-b02
          speaker: narrator
          text: 第二天早晨，风的母亲带来了丈夫的消息。
        - id: ch04-b03
          speaker: wind_mother
          text: 你的丈夫住在一片密林里。那里的树密得很，从来没有斧头能劈出一条路。他把树干排在一起，用柔韧的枝条捆牢，给自己搭了一所简陋的房子。从此独自住在那里，躲开所有人。
        - id: ch04-b04
          speaker: narrator
          text: 风的母亲给公主一只鸡吃，也提醒她把骨头一根不少地收好。随后，她指点公主踏上银河。每到夜间，银河便会横贯天空，只要沿着它不断向前，总有一天能抵达目的地。公主眼含热泪，感谢老妇人收留自己，也感谢她带来的好消息，随后马上动身。她太想早日见到丈夫，白天黑夜都不肯停歇，连片刻也舍不得耽搁。
        - id: ch04-b05
          speaker: narrator
          text: 她不停地走，直到最后一双铁鞋也裂成碎片。她扔掉破鞋，赤脚继续赶路。一路上的泥沼挡不住她，尖刺扎破脚掌，她也不在意。石头把双脚磕得青肿，她还是向前。最后，她来到树林边一片美丽的绿草地。鲜花开在凉爽柔软的草叶间，这片景色让她的心稍稍轻松了一些，她便坐下歇息。可是林中鸟儿正向各自的伴侣啁啾低语。她听着那些声音，又深深思念起丈夫，禁不住失声痛哭。哭过以后，她把孩子抱进怀里，把那包鸡骨头背上肩头，独自走进密林。
        - id: ch04-b06
          speaker: narrator
          text: 她在林中苦苦跋涉三天三夜，却始终什么也没找到。饥饿和疲倦已经把她折磨得精疲力尽，就连钢杖也在漫长的路上彻底磨钝，再也帮不上忙。她几乎要在绝望中放弃，可到了最后关头，还是咬紧牙关，拼尽全力作了一次尝试。就在这时，树丛深处忽然出现一所房子，模样正和风的母亲所说的一样。
        - id: ch04-b07
          speaker: narrator
          text: 房子连一扇窗也没有，唯一的门却开在屋顶。公主围着墙走了一圈又一圈，想找能通向屋顶的台阶，可哪里也找不到。怎么办呢？她要怎样才能进去？她想了又想，也一次次试着往上爬，结果还是够不到门口。这时，她忽然想起一路辛辛苦苦背来的鸡骨头。
        - id: ch04-b08
          speaker: youngest_princess
          text: 她们人人都叫我仔细收好这些骨头，一定有充分的理由。也许如今到了最危急的时候，它们真的能帮我。
        - id: ch04-b09
          speaker: narrator
          text: 公主取出骨头，把两根的末端接在一起。没想到，它们竟牢牢粘住了。她把更多骨头接上，做成两根和房屋一样高的长杆，靠在相距一码的墙面上。其余骨头被一根根横搭在中间，变成梯子的横档。每做好一级，她便踩上去，再搭下一级，就这样一步一步接近屋顶。
        - id: ch04-b10
          speaker: narrator
          text: 眼看要够到门，骨头却偏偏用光了，梯子还少最后一级。少了这一档，整架梯子都没有用。她一定在路上不慎丢过一根骨头。该到哪里再找一根呢？公主焦急地思索着，忽然有了主意。她拿出小刀，斩下自己的一根小手指，放到最后一级的位置。那根手指竟也像骨头一样牢牢粘住。梯子终于完成了。
        - id: ch04-b11
          speaker: narrator
          text: 公主把孩子抱在臂弯里，小心地爬上最后一级，从屋顶的门进了房子。她环顾四周，发现屋里的一切都收拾得井井有条。漫长的跋涉让她饥饿难忍，她便取来一些食物吃下，又把孩子轻轻放进地板上的一只槽里，让他在那里睡觉，自己也终于坐下来休息。
        - id: ch04-b12
          speaker: narrator
          text: 她的丈夫，那头猪，回家时被眼前的景象吓了一跳。他盯着骨头搭成的梯子，还有最顶端的那根小手指，简直不敢相信自己的眼睛。他以为新的巫术又找上门来，心里害怕极了，几乎转身离开。随即，他想出一个更稳妥的办法，把自己变成鸽子。这样一来，无论梯子上藏着什么魔法，都不能伤害他。鸽子没有碰那架梯子，直接飞进了屋里。
        - id: ch04-b13
          speaker: narrator
          text: 屋里，一个女人正摇着孩子。丈夫看见她为了寻找自己受尽苦难，竟憔悴成这副模样，心中忽然涌起无尽的爱与思念，也生出深深的怜惜。就在这一刻，他变成了一个男人。
    - id: ch05
      title: 魔法解除
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 公主看见这个陌生男人，立刻站起身来，心里怦怦直跳。她没有认出自己的丈夫。直到男人说明身份，她才欢喜得忘了所有苦难，过去的一切仿佛再也算不得什么。他十分英俊，身姿像杉树一样挺拔。两人一同坐下。公主讲起自己一路经历的苦难，丈夫听得怜惜落泪。随后，他也说出了自己的身世。
        - id: ch05-b02
          speaker: pig_prince
          text: 我是一位国王的儿子。从前，几条恶龙不断祸害我国，父王率军同它们作战，我杀死了其中最小的一条。它的母亲是个巫婆，对我施下魔法，把我变成了猪。那个装成老妇人，把朽线交给你的，也是她。原本只差三天，魔法就会解除，她的诡计却害我又做了整整三年的猪。如今我们都为对方受尽了苦，也终于重新相见，就把过去忘掉吧。
        - id: ch05-b03
          speaker: narrator
          text: 两人欢喜地亲吻了彼此。第二天一早，他们便动身返回王子父亲的国度。百姓忽然看见王子带着妻子归来，举国上下都沉浸在喜悦之中。他的父亲和母亲赶来紧紧拥抱两人，宫中也摆下盛宴，一连欢庆了三天三夜。
        - id: ch05-b04
          speaker: narrator
          text: 在王子的故乡欢庆过后，夫妻俩又一同启程，去看望公主的父亲。老国王终于重新见到女儿，欢喜得简直要发狂。公主坐在父亲身边，把离开王宫以后经历的一切，从头到尾说给他听。老国王听完，便对她说。
        - id: ch05-b05
          speaker: king
          text: 我不是早就告诉过你吗？那个来求婚、娶你为妻的家伙，绝不会生来就是一头猪。你瞧，孩子，你肯听我的话，这是多么明智啊。
        - id: ch05-b06
          speaker: narrator
          text: 国王已经年老，又没有继承人，便让女儿和女婿代替自己登上王位。从此以后，他们共同治理这个国家。两人经历过那么多苦难，也像所有历尽艰辛才登上王位的君王一样，治理着自己的臣民。倘若他们至今没有死去，那么一定仍在那里幸福地生活，统治着他们的王国。
