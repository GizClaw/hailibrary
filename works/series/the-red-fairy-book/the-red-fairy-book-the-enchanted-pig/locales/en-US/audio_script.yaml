  chapters:
    - id: ch01
      title: The Forbidden Room
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King with three daughters. When war drew near and he had to leave for battle, he called the three girls to him.
        - id: ch01-b02
          speaker: king
          text: My dear children, the enemy is coming with a great army, and I must go to war. It grieves me to leave you. While I am gone, take care of yourselves, behave well, and look after the palace. You may walk in the garden and enter every room but one. Never go into the room at the back, in the right-hand corner. Harm will come to you if you do.
        - id: ch01-b03
          speakers: [eldest_princess, princess_2, youngest_princess]
          ensemble: chorus
          text: Don't worry about us, Father. We have never disobeyed you. Go in peace, and may Heaven give you victory!
        - id: ch01-b04
          speaker: narrator
          text: When all was ready, the King handed the keys to his eldest daughter and warned them once again. The girls kissed his hands with tears in their eyes and wished him well. Then he left.
        - id: ch01-b05
          speaker: narrator
          text: Once the sisters were alone, the palace felt sad and dull, and they did not know how to fill their days. They agreed on a routine. They would work for part of each day, read for another part, and enjoy themselves in the garden for the rest. For a while, everything went well. But the peaceful days did not last. With every passing day, their curiosity grew stronger.
        - id: ch01-b06
          speaker: eldest_princess
          text: Sisters, we sew, spin, and read all day. We've explored every corner of the garden and admired every fine room in the palace. Why shouldn't we see the one room Father told us not to enter?
        - id: ch01-b07
          speaker: youngest_princess
          text: How can you ask us to break Father's command? He must have had a good reason for forbidding us to go inside.
        - id: ch01-b08
          speaker: princess_2
          text: The sky won't fall if we open one door. There won't be dragons waiting to eat us, and Father will never know.
        - id: ch01-b09
          speaker: narrator
          text: As they spoke and encouraged one another, they walked all the way to the forbidden room. The eldest put the key in the lock. Snap! The door opened.
        - id: ch01-b10
          speaker: narrator
          text: All three stepped inside, wondering what they would find. The room was bare and empty, without a single ornament. Only a large table stood in the middle. A gorgeous cloth covered it, and on top lay one great book, already open. All the sisters wanted to know what was written there, but the eldest was the most eager. She hurried over and read the words on the page.
        - id: ch01-b11
          speaker: eldest_princess
          text: The eldest daughter of this King will marry a prince from the East.
        - id: ch01-b12
          speaker: narrator
          text: The second sister stepped forward and turned the page.
        - id: ch01-b13
          speaker: princess_2
          text: The second daughter of this King will marry a prince from the West.
        - id: ch01-b14
          speaker: narrator
          text: The two sisters laughed with delight and teased each other. The youngest wanted no part of the book, but they would not leave her alone. They pulled her to the table, and at last, trembling with fear, she turned the page.
        - id: ch01-b15
          speaker: youngest_princess
          text: The youngest daughter of this King will marry a pig from the North.
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: A thunderbolt falling from the sky could hardly have frightened her more. Misery and terror overcame her, and she fainted. If her sisters had not caught and held her, she would have fallen to the floor and struck her head. They waited until she came to herself again, then did all they could to comfort her.
        - id: ch01-b17
          speaker: eldest_princess
          text: How can you believe such nonsense? Whoever heard of a king's daughter marrying a pig?
        - id: ch01-b18
          speaker: princess_2
          text: Don't be a baby. Even if that disgusting creature came for you, Father has soldiers enough to keep you safe.
        - id: ch01-b19
          speaker: narrator
          text: The youngest tried to let their words convince her, but the book still weighed on her heart. It promised great happiness to both her sisters. For her, it foretold a fate unlike anything the world had ever known. Worse still, she knew that she had disobeyed her father. The worry made her ill. Only a few days earlier she had been rosy and merry, but now she grew pale and thin, and nothing pleased her. She stopped playing with her sisters in the garden. She gathered no flowers for her hair and sang no more while they spun and sewed together.
        - id: ch01-b20
          speaker: narrator
          text: Meanwhile, the King won a great victory. He defeated the enemy completely and drove the invading army away. Throughout the fighting, his thoughts had kept returning to his daughters, so he hurried home as soon as he could. Everyone came out to meet him. Cymbals, fifes, and drums sounded, and the people rejoiced over his victory. When the King reached the palace, he first thanked Heaven. Then his three daughters came to greet him. The youngest tried hard to hide her sadness, and at first he rejoiced to see all three safe.
        - id: ch01-b21
          speaker: narrator
          text: Before long, he saw how thin and unhappy his youngest child had become. Suddenly the thought that she had broken his command struck his heart like hot iron. He felt certain that his daughters had entered the forbidden room, but he wanted to know the truth. He called all three before him, questioned them closely, and ordered them to hide nothing. They confessed everything. Still, they took care not to reveal which sister had first tempted the other two.
        - id: ch01-b22
          speaker: narrator
          text: Their father was almost overcome with grief. Still, he gathered his courage and comforted his terrified daughters. What was done could not be changed, however many words he spoke.
    - id: ch02
      title: The Pig from the North
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time, the forbidden room and its book were almost forgotten. Then, one fine day, a prince from the East arrived at court and asked the King for his eldest daughter's hand. The King gladly gave his consent, and preparations for a magnificent wedding began. The feasting lasted three days. Afterward, the happy pair were escorted all the way to the frontier amid great ceremony and rejoicing. Some time later, the same thing happened to the second daughter. A prince came from the West, wooed her, and won her for his bride.
        - id: ch02-b02
          speaker: narrator
          text: Now the youngest saw that the book's words were coming true. Her sorrow deepened. She would not eat, dress in fine clothes, or go walking. She said she would rather die than have the world laugh at her. The King would not let her do such a wrong, and he comforted her in every way he could.
        - id: ch02-b03
          speaker: narrator
          text: Time passed. Then, one day, an enormous pig came from the North and walked straight into the palace.
        - id: ch02-b04
          speaker: enchanted_prince
          text: Hail, O King! May your life be as bright and prosperous as sunrise on a clear day!
        - id: ch02-b05
          speaker: king
          text: I am glad to find you well, friend. But what brings you here?
        - id: ch02-b06
          speaker: enchanted_prince
          text: I have come to ask for a bride.
        - id: ch02-b07
          speaker: narrator
          text: The King was amazed to hear such fine speech from a pig. He guessed at once that there was something strange about this visitor. He had no wish to give his daughter away and would gladly have persuaded the Pig to seek another bride. Then he learned that the palace courtyard and the whole street outside were packed with every pig in the world. He saw no way of escape and had to consent. Even then, the Pig would accept no vague promise. He demanded that the wedding happen within one week and refused to leave until the King had sworn a royal oath.
        - id: ch02-b08
          speaker: narrator
          text: The King sent for his daughter and told her that fate had left them no other choice.
        - id: ch02-b09
          speaker: king
          text: My child, this Pig neither speaks nor behaves like an ordinary pig. I cannot believe he was always in this shape. Magic must be at work. Do as he asks, and I feel sure Heaven will soon set you free.
        - id: ch02-b10
          speaker: youngest_princess
          text: If this is what you wish, dear Father, I will do it.
        - id: ch02-b11
          speaker: narrator
          text: The wedding day drew nearer, and at last the marriage took place. After the ceremony, the Pig and his bride set off for his home in one of the royal carriages. Their road carried them past a great bog. There the Pig ordered the carriage to stop. He climbed down, went straight into the mire, and rolled about until thick mud covered him from head to foot. Then he climbed back into the carriage and told his new wife to kiss him.
        - id: ch02-b12
          speaker: narrator
          text: The Princess remembered her father's advice. She took out her handkerchief, gently wiped the Pig's snout, and kissed it.
        - id: ch02-b13
          speaker: narrator
          text: Darkness had fallen when they reached his home, which stood deep inside a thick wood. The long carriage ride had tired them, so they sat quietly for a time. Then they ate supper together and lay down to rest. During the night, the Princess discovered that the Pig beside her had become a man. She was greatly startled. Still, she remembered her father's words, found her courage, and decided to wait and see what would follow.
        - id: ch02-b14
          speaker: narrator
          text: The same thing happened for several nights. Each night, the Pig became a man. Every morning, before the Princess awoke, he changed back into a Pig. She watched and wondered but could not understand the mystery at all. One thing at least seemed clear. Her husband had to be under a spell. As time passed, she discovered how kind and gentle he was, and she grew truly fond of him.
    - id: ch03
      title: The Broken Thread
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One day, while the Princess sat alone, an old witch passed the house. The Princess had seen no other human being for so long that she eagerly called the woman over. The witch claimed to know every kind of magic, to foretell the future, and to understand the healing powers of plants.
        - id: ch03-b02
          speaker: youngest_princess
          text: Old dame, I will be grateful all my life if you can explain what has happened to my husband. Why is he a Pig by day and a man at night?
        - id: ch03-b03
          speaker: witch
          text: I was about to tell you, my dear, and prove what a fine fortune-teller I am. If you wish, I can give you something that will break the spell.
        - id: ch03-b04
          speaker: youngest_princess
          text: Please give it to me. Ask for anything in return. I cannot bear to see him like this.
        - id: ch03-b05
          speaker: witch
          text: Take this thread, child, and never tell him about it. If he knew, its healing power would vanish. Tonight, once he is asleep, quietly tie it as tightly as you can around his left foot. By morning he will still be a man. I ask no reward. Knowing you are happy will repay me. It breaks my heart to think of your suffering. If only I had known sooner, I would have come at once.
        - id: ch03-b06
          speaker: narrator
          text: After the old witch went away, the Princess hid the thread where no one would find it. That night she waited until her husband slept. Then she got up as quietly as she could. Her heart beat hard as she wound the thread around his left foot. She began to pull the knot firm, just as the witch had instructed. At that instant there came a sharp crack. The thread was rotten, and it had snapped in two.
        - id: ch03-b07
          speaker: enchanted_prince
          text: Unhappy woman, what have you done? In three more days this wicked spell would have ended. Now who knows how long I must wear this hateful shape? I have to leave you. We will not meet again until you have worn out three pairs of iron shoes and blunted a steel staff while searching for me.
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: With those words, he vanished. Left alone, the Princess wept and moaned pitifully. At last she understood that tears would not help her. She rose, ready to go wherever fate might lead.
        - id: ch03-b09
          speaker: narrator
          text: In the nearest town, she ordered three pairs of iron sandals and a steel staff. Once they were ready, she began her search. On and on she wandered, over nine seas and across nine continents. She forced her way through forests where the tree trunks were as thick as beer barrels. Again and again she stumbled over fallen branches or struck against them. Each time, she picked herself up and continued. Boughs hit her face and thorny shrubs tore her hands, but she never turned to look back.
        - id: ch03-b10
          speaker: narrator
          text: At last, exhausted by the long road and bowed by sorrow, yet still carrying hope in her heart, she came to a house. And who lived there? The Moon.
        - id: ch03-b11
          speaker: narrator
          text: The Princess knocked at the door and begged to come inside for a little rest. The mother of the Moon saw how miserable and exhausted she was. Filled with pity, she welcomed the traveler, nursed her, and cared for her. The long search had carried the Princess far from every other human home. While she was staying in the house of the Moon, she gave birth to a baby.
        - id: ch03-b12
          speaker: moon_mother
          text: How did a mortal woman ever reach the house of the Moon?
        - id: ch03-b13
          speaker: narrator
          text: The Princess told her whole story.
        - id: ch03-b14
          speaker: youngest_princess
          text: I will always thank Heaven for leading me here, and I will always thank you for saving my baby and me. Please grant me one last favor. Can your daughter, the Moon, tell me where my husband is?
        - id: ch03-b15
          speaker: moon_mother
          text: She cannot tell you, child. Travel east until you reach the home of the Sun. Perhaps he will know something.
        - id: ch03-b16
          speaker: narrator
          text: The Moon's mother gave her a roast chicken and warned her not to lose a single bone, because the bones might prove useful. The Princess thanked her for her shelter and advice. Her first iron shoes were worn out, so she threw them away and put on the second pair. She tied the chicken bones into a bundle, took her baby in one arm and her staff in the other, and set out again.
    - id: ch04
      title: The Houses of the Sun and Wind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On and on and on the Princess went across bare, sandy deserts. The roads were so heavy that whenever she fought her way two steps forward, she slipped one step back. Still, she struggled until those dreary plains lay behind her. Beyond them rose high, rocky mountains. She climbed from crag to crag and from peak to peak. Sometimes she stopped to rest on a mountainside, but each time she rose and pushed farther on.
        - id: ch04-b02
          speaker: narrator
          text: She crossed deep swamps and climbed peaks covered in sharp flint until her feet, knees, and elbows were torn and bleeding. Sometimes a precipice opened before her that was far too wide to jump. Then she had to crawl around it on her hands and knees, pulling herself onward with the steel staff. At length, nearly dead with weariness, she finally reached the palace where the Sun lived.
        - id: ch04-b03
          speaker: narrator
          text: The Princess knocked at the palace and begged to be allowed inside. The mother of the Sun opened the door. She could hardly believe that a mortal woman had come all the way from the distant shores of earth. When she heard of the traveler's suffering, she wept with pity. She promised to question her son about the missing husband. Before he returned, however, she hid the Princess in the cellar. The Sun often came home in a foul temper at night, and his mother did not want him to notice that anyone else was there.
        - id: ch04-b04
          speaker: narrator
          text: The next day, the Princess feared that all was not well. The Sun had sensed that someone from the other world had entered his palace. His mother soothed him with gentle words and persuaded him that no one had. Her kindness gave the Princess courage to ask a question.
        - id: ch04-b05
          speaker: youngest_princess
          text: How can the Sun ever be angry? He is so beautiful, and he does so much good for mortals.
        - id: ch04-b06
          speaker: sun_mother
          text: This is how it happens. In the morning, he stands at the gates of paradise and smiles happily on the world. As the day passes, he sees the evil things people do. That makes him angry, and his heat grows fierce. By evening he stands at the gates of death, both sad and angry. From there, he returns home.
        - id: ch04-b07
          speaker: narrator
          text: The Sun's mother had questioned her son, but he knew nothing of the Prince. The Princess's only hope was to ask the Wind.
        - id: ch04-b08
          speaker: narrator
          text: Before the traveler left, her hostess gave her another roast chicken and told her to guard the bones. The Princess wrapped them in her bundle. Her second iron shoes were now ruined, so she threw them away, took her child and staff, and started toward the Wind.
        - id: ch04-b09
          speaker: narrator
          text: This part of her journey brought even greater dangers than those before. She crossed one mountain of flint after another, while tongues of fire leaped out of the stones. She passed through forests so wild that no human foot had ever entered them. Beyond the trees waited fields of ice and great avalanches of snow. Again and again the hardships nearly killed her, but she held on to her courage and continued.
        - id: ch04-b10
          speaker: narrator
          text: At last she reached an enormous cave in the side of a mountain. This was the home of the Wind. A railing stood in front of the cave, with one little door set into it. The Princess knocked there and begged to be admitted. As the Moon's mother and the Sun's mother had done, the mother of the Wind took pity on her. She brought the traveler inside so that she could rest, but she too hid the Princess away before the Wind returned.
        - id: ch04-b11
          speaker: wind_mother
          text: Your husband lives alone in a wood so thick that no axe has ever cut a path through it. He has made a rough house by binding tree trunks together. He stays there and avoids all people.
        - id: ch04-b12
          speaker: narrator
          text: The Wind's mother gave the Princess a chicken, warned her to save its bones, and told her to follow the Milky Way across the night sky until she reached her goal.
        - id: ch04-b13
          speaker: narrator
          text: With tears in her eyes, the Princess thanked the old woman for her kindness and for the welcome news. Her longing to see her husband was so great that she rested neither by night nor by day.
    - id: ch05
      title: The Ladder of Bones
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Following the Milky Way, the Princess walked on without resting. At last her third and final pair of iron shoes fell to pieces. She threw the broken shoes away and continued with bare feet. She no longer cared about the bogs she had to cross. She paid no heed to the thorns that wounded her or the stones that bruised every step.
        - id: ch05-b02
          speaker: narrator
          text: At last she came to a beautiful green meadow at the edge of a wood. The sight of flowers and cool, soft grass cheered her heart after all the cruel roads behind her. She sat down and allowed herself a little rest. Then she heard the birds among the trees, each chirping to its mate. Their calls filled her with longing for her own husband, and she began to weep bitterly. When she rose, she took her child in her arms, lifted the bundle of chicken bones onto her shoulder, and entered the wood.
        - id: ch05-b03
          speaker: narrator
          text: For three days and three nights, she struggled through the tangled trees without finding any sign of the house. Hunger and weariness left her almost unable to move. Even her steel staff could help her no longer, for the long wandering had worn it completely blunt. She was close to giving up in despair. Then she gathered all the strength she had left and made one last effort. Suddenly, in the middle of a thicket, she found the rough house the Wind's mother had described.
        - id: ch05-b04
          speaker: narrator
          text: The house had no windows, and its only door was in the roof. The Princess searched all around it, but there were no steps. She tried and failed to climb the walls. Then she remembered the bones she had carried through every hardship.
        - id: ch05-b05
          speaker: youngest_princess
          text: They all told me to guard these bones, and they must have had a reason. Perhaps the bones can help me now, when I need them most.
        - id: ch05-b06
          speaker: narrator
          text: She took the bones from the bundle and pressed two ends together. To her surprise, they held fast. She joined more and more until she had made two poles as tall as the house. She leaned them against the wall, one yard apart, and fixed other bones across them as rungs.
        - id: ch05-b07
          speaker: narrator
          text: She climbed each new rung before making the next. Near the roof, the bones ran out. One last rung was missing, and without it the ladder was useless. She must have lost a bone somewhere along the way.
        - id: ch05-b08
          speaker: narrator
          text: Then an idea came to her. She took a knife and cut off her little finger. When she set it in place, it held fast like the bones. The ladder was complete. Carrying her child, she climbed through the roof door.
        - id: ch05-b09
          speaker: narrator
          text: Inside the strange house, the Princess found everything in perfect order, though its owner was gone. After so many days of hunger, she took some food and ate. Then she made a resting place for her baby in a trough that stood on the floor. Once the child was asleep, the exhausted Princess sat down beside the trough to wait and rest.
        - id: ch05-b10
          speaker: narrator
          text: When the Pig returned to his house, the sight before him stopped him short. At first, he could not believe his eyes. He stared at the ladder made of bones, then at the little finger forming its highest rung. He was sure that some new magic must be at work. Terror nearly made him turn away and leave the house. Then a better plan came to him. He changed himself into a dove, a shape no witchcraft there could touch, and flew through the roof door without setting foot on the ladder.
        - id: ch05-b11
          speaker: narrator
          text: There he saw a woman rocking a child. Suffering had changed her so greatly, yet he knew her. Love, longing, and pity moved his heart, and in that moment he became a man.
        - id: ch05-b12
          speaker: narrator
          text: The Princess rose quickly when she saw the stranger, and her heart beat with fear because she did not recognize him. Then he told her who he was. Her fear vanished, and in her great joy she forgot everything she had suffered. All those hardships seemed like nothing now. Her husband stood before her as a very handsome man, tall and straight as a fir tree.
        - id: ch05-b13
          speaker: narrator
          text: They sat down together, and the Princess told him the whole story of her search. She spoke of the iron shoes and steel staff, of the Moon, the Sun, and the Wind, and of the long road that had brought her to his roof. He wept with pity as he listened to all she had endured for his sake. When her tale was finished, he told her his own story.
        - id: ch05-b14
          speaker: enchanted_prince
          text: I am a King's son. While my father fought the dragons that tormented our country, I killed the youngest one. Its mother was a witch. She cursed me and turned me into a Pig. She was also the old woman who gave you the thread for my foot. Only three days remained before the spell would have broken, but the thread forced me to stay a Pig for three more years. We have suffered for each other and found each other again. Now let us forget the past.
        - id: ch05-b15
          speaker: narrator
          text: In their joy, they kissed each other.
    - id: ch06
      title: Home Again
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Early the next morning, the Prince and Princess began their long journey back to his father's kingdom. When the people saw their lost prince return with his wife and child, joy spread through the whole country. His father and mother came to embrace them both. For three full days and three full nights, the palace celebrated with feasting.
        - id: ch06-b02
          speaker: narrator
          text: Afterward, the couple traveled to visit her father. The old King nearly lost his senses with joy when he saw his daughter alive again. She told him all that had happened.
        - id: ch06-b03
          speaker: king
          text: Didn't I tell you that the creature who came to marry you could not have been born a Pig? You see, my child, you were wise to follow my advice.
        - id: ch06-b04
          speaker: narrator
          text: The King was old and had no heir to take his place, so he set the Prince and Princess upon his throne. Together, they ruled as only kings who have suffered many things can rule. And if they have not died, they are still living and ruling happily to this very day.
