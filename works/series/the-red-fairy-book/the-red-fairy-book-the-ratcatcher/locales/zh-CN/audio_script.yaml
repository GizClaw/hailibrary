audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    ratcatcher:
      display_name: 捕鼠人
      tts:
        delivery: 自信神秘，受辱后冷峻逼人
        timbre: 瘦削而有穿透力
        pace: 从容
        pitch: 中低
    town_counsellor:
      display_name: 市政顾问
      tts:
        delivery: 工于算计，自负又圆滑
        timbre: 成熟光滑
        pace: 不紧不慢
        pitch: 中低
    citizen_1:
      display_name: 市民甲
      tts:
        delivery: 警惕直率，容易激动
        timbre: 结实成熟
        pace: 稍快
        pitch: 中等
    citizen_2:
      display_name: 市民乙
      tts:
        delivery: 务实响亮，随众附和
        timbre: 清楚成熟
        pace: 适中
        pitch: 中等
    citizen_3:
      display_name: 市民丙
      tts:
        delivery: 热切急躁，情绪鲜明
        timbre: 明亮成熟
        pace: 稍快
        pitch: 中高
    citizen_4:
      display_name: 市民丁
      tts:
        delivery: 粗直有力，说话斩钉截铁
        timbre: 粗粝成熟
        pace: 适中
        pitch: 低
    blanchet:
      display_name: 布朗谢
      tts:
        delivery: 年迈疲惫，答话老实干脆
        timbre: 单薄沙哑
        pace: 缓慢
        pitch: 高
    first_boy:
      display_name: 第一个男孩
      tts:
        delivery: 哭泣中努力把话说清楚
        timbre: 稚嫩明亮
        pace: 迟疑
        pitch: 高
    second_boy:
      display_name: 第二个男孩
      tts:
        delivery: 惊魂未定，说话直接
        timbre: 稚嫩清楚
        pace: 时快时慢
        pitch: 高
    third_boy:
      display_name: 第三个男孩
      tts:
        delivery: 喘息急促，语气恳切
        timbre: 年轻轻亮
        pace: 稍快
        pitch: 高
    merchant_1:
      display_name: 不来梅商人甲
      tts:
        delivery: 见多识广，叙述笃定
        timbre: 沉稳清晰
        pace: 从容
        pitch: 中低
    merchant_2:
      display_name: 不来梅商人乙
      tts:
        delivery: 审慎可靠，下结论时坚定
        timbre: 温厚成熟
        pace: 从容
        pitch: 中等
  chapters:
    - id: ch01
      title: 鼠灾与交易
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，德国哈梅尔城遭了一场从未有过、以后恐怕也不会再有的鼠灾。那些大黑老鼠白天也敢在街上乱跑，屋里更是挤得到处都是。人的手脚不管落到哪里，都会碰上一只。
        - id: ch01-b02
          speaker: narrator
          text: 人们早晨穿衣服，会从马裤、衬裙、口袋和靴子里摸出老鼠。等他们想吃点东西，那群贪嘴的家伙早把地窖到阁楼搜刮空了。夜里更糟。灯一灭，它们就在天花板、地板、碗柜和门边不停追逐啃咬，响得像钻子、钳子和锯子一起开动，聋子也休想睡稳一个钟头。
        - id: ch01-b03
          speaker: narrator
          text: 猫狗赶不走它们，毒药和捕鼠夹也不顶用。向所有圣徒祈祷、为他们点起蜡烛，同样毫无办法。人们杀得越多，新冒出来的老鼠反而越多。哈梅尔的居民眼看就要彻底倒霉了，偏偏那些狗本来也没帮上什么忙。
        - id: ch01-b04
          speaker: narrator
          text: 一个星期五，城里来了个面貌古怪的人。他吹着风笛，嘴里唱着一段歌。
        - id: ch01-b05
          speaker: ratcatcher
          text: 活着的人自会瞧。看，他来到，捕鼠人驾到。
        - id: ch01-b06
          speaker: narrator
          text: 他长得高高瘦瘦，四肢细长，皮肤晒得又干又黑。弯鼻子下面，两撇长胡须活像老鼠尾巴。一双黄色大眼睛锐利逼人，眼神里又带着嘲弄。宽毡帽上插着鲜红的公鸡羽毛，身上穿绿上衣和红马裤，腰间束着皮带。脚上那双凉鞋的带子一圈圈缠在腿上，是吉卜赛人的打扮。直到今天，哈梅尔大教堂的一扇窗户上还能看到他这副模样。
        - id: ch01-b07
          speaker: narrator
          text: 他走到市政厅前的大集市广场，背对教堂站定，继续吹奏，又唱了起来。
        - id: ch01-b08
          speaker: ratcatcher
          text: 活着的人自会瞧。看，他来到，捕鼠人驾到。
        - id: ch01-b09
          speaker: narrator
          text: 市议会恰好又在商量这场如同埃及灾祸的鼠患。谁都救不了这座城。陌生人便托人告诉议员，只要酬劳合适，他能在天黑前把所有老鼠除尽，一只也不留。
        - id: ch01-b10
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 他一定是个巫师！大家可得提防他！
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 那位公认聪明的市政顾问马上安抚众人。
        - id: ch01-b12
          speaker: town_counsellor
          text: 管他是不是巫师。要是他真有本事，说不定这些害兽就是他放来的，现在又想收钱替我们除掉。那我们就用魔鬼自己的圈套捉魔鬼。你们只管交给我。
        - id: ch01-b13
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 对，交给市政顾问吧。
        - id: ch01-b14
          speaker: narrator
          text: 于是，陌生人被带到议会面前。
        - id: ch01-b15
          speaker: ratcatcher
          text: 每除掉一只老鼠，你们付我一枚格罗币。天黑以前，我会把哈梅尔的老鼠全打发干净。
        - id: ch01-b16
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 一只就要一枚格罗币？那不是得花几百万弗罗林！
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: 市政顾问只是耸了耸肩。
        - id: ch01-b18
          speaker: town_counsellor
          text: 成交！动手吧。就照你说的，每只老鼠一枚格罗币。
        - id: ch01-b19
          speaker: narrator
          text: 捕鼠人说，月亮一升起，他当晚就会施展本领。到时人人都要把街道完全让出来，只在自家窗口看着外面的动静。那会是一场好看的热闹。消息传开，哈梅尔人都在担心这笔巨款。
        - id: ch01-b20
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 每只一枚格罗币，这得花掉多少钱哪！
        - id: ch01-b21
          speaker: narrator
          text: 市议会的人却露出不怀好意的神气。
        - id: ch01-b22
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 交给市政顾问吧。
    - id: ch02
      title: 风笛引走群鼠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夜里快到九点，捕鼠人重回广场，仍像先前那样背对教堂。月亮刚从地平线上露面，风笛便“特啦哩啦，特啦哩”地响了。
        - id: ch02-b02
          speaker: narrator
          text: 开头的曲调缓慢温柔，接着越来越轻快，也越来越急。那声音既嘹亮又尖锐，直钻进全城最远的小巷和最深的藏身处。
        - id: ch02-b03
          speaker: narrator
          text: 地窖底下、阁楼顶上、家具下面，还有每道缝隙和每个墙角，很快都有老鼠钻出来。它们找到门，冲到街上，嗒嗒嗒排着队奔向市政厅。老鼠紧挨着老鼠，像泛滥的急流一样铺满了街面。
        - id: ch02-b04
          speaker: narrator
          text: 等广场完全挤满，捕鼠人转身往城墙脚下的河边走，手里的风笛依旧吹得欢快。到了岸边，他回头一看，所有老鼠都跟来了。
        - id: ch02-b05
          speaker: ratcatcher
          text: 跳！跳！都往河心跳！
        - id: ch02-b06
          speaker: narrator
          text: 他伸出手指，指向河中央。那里的水打着旋向下陷，好像有个漏斗正在吸水。老鼠毫不犹豫，一只接一只跃进河里，笔直游向那个漏斗，再一头扎下去，消失得无影无踪。扑通扑通的落水声一刻不停，一直响到午夜。
        - id: ch02-b07
          speaker: narrator
          text: 最后，一只年老得浑身雪白的大老鼠拖着身子，艰难地来到岸边。它正是鼠群的国王。
        - id: ch02-b08
          speaker: ratcatcher
          text: 布朗谢老友，它们全都到了吗？
        - id: ch02-b09
          speaker: blanchet
          text: 全到了。
        - id: ch02-b10
          speaker: ratcatcher
          text: 一共多少只？
        - id: ch02-b11
          speaker: blanchet
          text: 九十九万九千九百九十九只。
        - id: ch02-b12
          speaker: ratcatcher
          text: 没有数错？
        - id: ch02-b13
          speaker: blanchet
          text: 一只也没数错。
        - id: ch02-b14
          speaker: ratcatcher
          text: 那就去和它们会合吧，老陛下。后会有期。
        - id: ch02-b15
          speaker: narrator
          text: 白色的老鼠王也跳进河里，游向漩涡，随即不见了。捕鼠人的差事就此办完。他回客栈睡觉，而哈梅尔人三个月来第一次安安稳稳睡了一整夜。
    - id: ch03
      title: 一笔赖掉的报酬
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨九点，捕鼠人来到市政厅。议员们已经在那里等着他。
        - id: ch03-b02
          speaker: ratcatcher
          text: 昨天，你们的老鼠全跳进河里了。我担保没有一只会回来。总数是九十九万九千九百九十九只，每只一枚格罗币。请算钱吧。
        - id: ch03-b03
          speaker: town_counsellor
          text: 别急，先数脑袋。每只一枚格罗币，总要一颗脑袋才算一只。那些脑袋在哪儿？
        - id: ch03-b04
          speaker: narrator
          text: 捕鼠人没想到他们会耍出这样的奸计。他气得脸色发白，双眼像要喷出火来。
        - id: ch03-b05
          speaker: ratcatcher
          text: 脑袋？你们那么想要，就自己下河去找！
          emotion: angry
        - id: ch03-b06
          speaker: town_counsellor
          text: 这么看来，是你不肯遵守约定。我们本可以一个钱都不付。不过你确实出过力，我们不会让你空手走。这里有五十克朗，拿去吧。
        - id: ch03-b07
          speaker: ratcatcher
          text: 这点赏钱，你留给自己吧。你们不肯付，我就向你们的后人讨。
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 他说完便拉低帽檐，遮住眼睛，匆匆走出大厅。他没有再和任何人说话，径直离开了哈梅尔。
        - id: ch03-b09
          speaker: narrator
          text: 城里人听说事情这样收场，人人高兴得搓起手来。他们和市政顾问一样毫不惭愧，还笑捕鼠人专给别人设圈套，这回自己反倒中了一套。最好笑的，是他竟说要找他们的后人讨债。哈！要是一辈子遇上的债主都这样，他们真是再满意不过了。
    - id: ch04
      title: 消失的孩子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天正逢星期日。全城人都快快活活去了教堂。他们心里只想着，弥撒结束以后，总算可以回家好好吃一顿，尝尝那些没被老鼠抢先碰过的东西。谁也没有想到，可怕的意外正在家里等着他们。
        - id: ch04-b02
          speaker: narrator
          text: 等人们回来，城里一个孩子也找不到了。所有孩子全都消失了。
        - id: ch04-b03
          speakers: [citizen_1, citizen_2, citizen_3, citizen_4]
          ensemble: chorus
          text: 我们的孩子呢？我们可怜的孩子到哪里去了？
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 哭喊声很快传遍大街小巷。这时，三个小男孩从城东门走了进来。他们一面哭，一面讲起刚才发生的事。
        - id: ch04-b05
          speaker: first_boy
          text: 大人们去教堂以后，我们听见了一阵特别奇妙的音乐。留在家里的男孩和女孩都被那声音吸引，跑到了大集市广场。捕鼠人就站在昨晚的地方吹风笛。
        - id: ch04-b06
          speaker: second_boy
          text: 后来，他快步往前走。孩子们跟着音乐，一路跑，一路唱，还一边跳舞。大家一直跟到进城时就能看见的那座山脚下。
        - id: ch04-b07
          speaker: third_boy
          text: 我们一走近，山上就裂开一个小口。吹风笛的人带着孩子们进去，那个口马上又合上了。只有我们三个还在外面。
        - id: ch04-b08
          speaker: narrator
          text: 三个孩子能留下来，简直像个奇迹。第一个生着罗圈腿，怎么也追不上大家。第二个出门太急，一只脚穿鞋，另一只还光着。他撞到一块大石头，伤了脚，每走一步都很吃力。
        - id: ch04-b09
          speaker: narrator
          text: 第三个其实及时赶到了。他急着跟伙伴们一起进去，却一头撞上山壁，狠狠向后跌倒。就在那一刻，山口在伙伴们身后合上了。
        - id: ch04-b10
          speaker: narrator
          text: 父母们听完，哭喊得更厉害了。他们带上长矛和鹤嘴锄，一起奔到那座山下，想找出孩子消失时经过的入口。他们一处一处搜寻，直到傍晚还是一无所获。夜色落下来以后，众人才悲痛欲绝地回到哈梅尔。
        - id: ch04-b11
          speaker: narrator
          text: 最不幸的是市政顾问。他失去了三个小男孩和两个漂亮的小女孩。更糟的是，城里人把所有过错都推给了他，早忘了就在前一天晚上，他们还人人都赞同他的办法。
    - id: ch05
      title: 漫长的寻找
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那些不幸的孩子究竟去了哪里？父母始终不肯相信他们已经死去。他们觉得，捕鼠人必定从山的另一边出来了，又把孩子带回了自己的国度。
        - id: ch05-b02
          speaker: narrator
          text: 接下来的几年里，人们派出一批又一批寻找者，到不同的国家打听。可是无论怎么找，都没有人发现那些可怜孩子的一点踪迹。关于他们的消息，要到很久以后才终于出现。
    - id: ch06
      title: 一百五十年后的消息
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 大约一百五十年过去了。当年那些孩子的父亲、母亲、兄弟和姐妹，早已没有一个还活在人世。一天傍晚，几个从东方回来的不来梅商人到了哈梅尔，求见城里的市民。
        - id: ch06-b02
          speaker: merchant_1
          text: 我们穿过匈牙利时，在一个叫特兰西瓦尼亚的山区住过一阵。周围所有人都讲匈牙利语，只有山里的居民只会说德语。
        - id: ch06-b03
          speaker: merchant_2
          text: 那些居民也说，他们的祖先来自德国，却没人知道祖先怎么到了那片陌生的土地。照我们看，他们只能是哈梅尔失踪孩子的后代。
        - id: ch06-b04
          speaker: narrator
          text: 哈梅尔人一点也不怀疑。从那以后，他们便认定，匈牙利的特兰西瓦尼亚人正是自己的同乡。那些人的祖先年幼时，曾被捕鼠人带到那里。这件事，也未必比世上许多别的事更难叫人相信。
        - id: ch06-b05
          speaker: narrator
          text: 这个故事采自夏尔·马雷勒。
