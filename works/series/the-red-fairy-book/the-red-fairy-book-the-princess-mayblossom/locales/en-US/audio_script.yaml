  chapters:
    - id: ch01
      title: The Curse and the Tower
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King and Queen who had lost every child but one little daughter. The Queen longed to find a truly good nurse who would keep the child safe. A herald blew his trumpet on every street corner and called the finest nurses in the world to the palace. So many came that the Queen had them brought before her one at a time while she sat in a shady wood nearby.
        - id: ch01-b02
          speaker: narrator
          text: One by one, the nurses were brought into the shady wood. They curtseyed to the King and Queen, then formed a long line so the Queen could inspect them. Nearly all looked fair, plump, and pleasant. One alone was dark-skinned and ugly, and she spoke in a language no one understood. The Queen wondered how this stranger had dared offer herself as nurse to a princess. She was told firmly to go away, for she certainly would not be chosen. The woman muttered something no one could understand and moved on. But instead of leaving, she slipped inside a hollow tree where she could watch everything that followed.
        - id: ch01-b03
          speaker: narrator
          text: Without thinking of the stranger again, the Queen chose a pretty, rosy-cheeked nurse. At once, a snake hidden in the grass bit the woman's foot, and she fell as if dead. The accident greatly upset the Queen, but she soon selected another. Just as the second woman stepped forward, an eagle flew overhead and dropped a great tortoise on her head. It cracked like an eggshell. The Queen was horrified, yet she tried a third time. That choice ended no better. The third nurse moved too quickly, ran straight into a tree branch, and blinded herself on a thorn.
        - id: ch01-b04
          speaker: narrator
          text: Horrified, the Queen declared that some wicked power must be at work and refused to choose again that day. As she rose to leave, cruel laughter sounded behind her. There stood the rejected stranger, mocking everyone, and the Queen most of all. The Queen was about to have her arrested when the woman struck twice with her wand. A fiery chariot drawn by winged dragons appeared. The witch swept into the sky, shouting threats as she went.
        - id: ch01-b05
          speaker: king
          text: Oh, we are ruined now! That was Fairy Carabosse. She has hated me ever since I put sulfur in her porridge for a joke when I was a boy.
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: The Queen burst into tears.
        - id: ch01-b07
          speaker: queen
          text: If only I had known who she was! I would have tried to make peace with her. Now everything must be lost.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: The King regretted frightening the Queen so badly. He proposed that they hold a council and decide how to prevent whatever misfortunes Carabosse meant to bring upon their daughter. Every counsellor was summoned to the palace. They shut every door and window and even stuffed every keyhole so no one could overhear them. After talking the matter through, they agreed to invite every fairy within a thousand leagues to the christening. The exact time of the ceremony would remain a deep secret, in case Carabosse decided to attend.
        - id: ch01-b09
          speaker: narrator
          text: The Queen and her ladies prepared gifts for each invited fairy. There was a blue velvet cloak, an apricot satin petticoat, high-heeled shoes, sharp needles, and golden scissors. Only five fairies could attend. The first gave the Princess perfect beauty. The second promised that she would understand anything the first time it was explained. The third gave her the voice of a nightingale, and the fourth promised success in everything she attempted.
        - id: ch01-b10
          speaker: narrator
          text: The fifth fairy had just opened her mouth when the chimney gave a tremendous rumble. Carabosse rolled down it, covered in soot.
        - id: ch01-b11
          speaker: carabosse
          text: Then my gift is this. Until she is twenty, the Princess will be the unluckiest of all the unlucky!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: The Queen and the fairies begged her to spare a child who had never harmed her. Carabosse only grunted. Then the fifth fairy gave her own gift.
        - id: ch01-b13
          speaker: fifth_fairy
          text: Once that dangerous time has passed, the Princess shall live a long and happy life.
          emotion: calm
        - id: ch01-b14
          speaker: narrator
          text: Carabosse laughed and climbed back up the chimney. Though badly shaken, the Queen entertained the fairies splendidly and added beautiful ribbons to their presents, for fairies are very fond of ribbons.
        - id: ch01-b15
          speaker: narrator
          text: Before leaving, the oldest fairy advised hiding the Princess away with her attendants until her twentieth birthday. The King built a tower without windows, lit only by wax candles. Its single entrance was an underground passage lined with iron doors twenty feet apart, and guards stood everywhere.
        - id: ch01-b16
          speaker: narrator
          text: They named the child Mayblossom because she was as fresh and blooming as spring. She grew tall and beautiful, and everything she said and did was charming. Whenever the King and Queen visited, they went away more delighted with her than before. Yet Mayblossom was weary of the tower. Again and again she begged them to take her away, and every time they refused. The nurse who had cared for her from infancy never left her. Sometimes she described the world beyond those walls. Mayblossom had seen none of it herself, but thanks to the second fairy's gift, she understood every explanation at once.
        - id: ch01-b17
          speaker: king
          text: We have been cleverer than Carabosse. Our Mayblossom will be happy in spite of that old fairy's prediction.
        - id: ch01-b18
          speaker: narrator
          text: The Queen laughed until she was tired at the thought that they had outwitted Carabosse. With only four days left before Mayblossom turned twenty, the King and Queen decided it was time to choose her husband. They had her portrait painted and sent it to every neighboring court. The whole town celebrated the thought that their Princess would soon be free. Their joy grew greater when word arrived from King Merlin. He was sending his ambassador, Fanfaronade, to ask for Mayblossom's hand on behalf of his son.
    - id: ch02
      title: A Glimpse of Fanfaronade
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Mayblossom's nurse told her everything happening in town. She described the splendor of Fanfaronade's approaching procession until the Princess could think of nothing but seeing it herself.
        - id: ch02-b02
          speaker: mayblossom
          text: How miserable I am, shut inside this dreary tower as though I had done something wrong! I have never seen the sun, the stars, a horse, a monkey, or a lion except in pictures. The King and Queen promise to free me when I turn twenty, but I think they only say that to amuse me. They never mean to let me out.
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: She wept. The nurse, the nurse's daughter, the cradle-rocker, and the nursery maid loved her so much that they all wept with her. Nothing could be heard but sobs and sighs. Their pity made Mayblossom determined to get her way. She threatened to starve unless they found a way for her to watch Fanfaronade enter the town.
        - id: ch02-b04
          speaker: mayblossom
          text: If you truly love me, you will find some way to do it. The King and Queen never need to know.
        - id: ch02-b05
          speaker: narrator
          text: Her attendants cried even harder and tried every argument they knew. Mayblossom only grew more determined. At last they gave in. They chose the side of the tower facing the city gates and began making a tiny hole. They scratched and scraped at the wall all day and all through the night. Even after so much work, the opening was barely wide enough to push a slender needle through.
        - id: ch02-b06
          speaker: narrator
          text: Through that pinhole, Mayblossom saw daylight for the first time. It dazzled and delighted her. She never took her eye from the opening until the procession appeared. Fanfaronade rode at its head on a white horse that pranced to the trumpets. Pearls and diamonds almost hid his coat, his boots were solid gold, and scarlet plumes streamed from his helmet. At once, Mayblossom decided she would marry Fanfaronade and no one else.
        - id: ch02-b07
          speaker: mayblossom
          text: His master cannot be half as handsome or delightful. I don't care about rank. After this tower, even a little country house would feel wonderful. I would rather share bread and water with Fanfaronade than eat roast chicken and sweets with anyone else.
        - id: ch02-b08
          speaker: narrator
          text: She talked on and on until her attendants wondered where all the words came from. They reminded her that a princess could never marry an ambassador, but she ordered them to be silent. As soon as Fanfaronade reached the palace, the Queen went to fetch her daughter. Carpets covered every street, and ladies crowded the windows with baskets of flowers and sweets to scatter before the Princess.
        - id: ch02-b09
          speaker: narrator
          text: They had scarcely begun dressing Mayblossom when a dwarf arrived, mounted high on an elephant. The five fairies had sent him with gifts for the Princess. He carried a crown and a scepter, a robe of golden brocade, and a marvelous petticoat embroidered with butterflies' wings. He also brought a casket filled with jewels more splendid than any the court had ever seen. When the Queen opened it, the glitter almost blinded her. Mayblossom scarcely gave the treasures a glance. Her thoughts were all on Fanfaronade.
        - id: ch02-b10
          speaker: narrator
          text: The dwarf received a gold coin and so many ribbons that they nearly hid him. Mayblossom sent each fairy a new spinning wheel and a cedar distaff, while the Queen promised to find them something charming too. Once dressed in the fairies' gifts, Mayblossom looked more beautiful than ever. As she passed through the streets, the people cried out together.
        - id: ch02-b11
          speakers: [crowd_woman_1, crowd_woman_2]
          ensemble: duo
          text: How beautiful she is! How beautiful!
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: It was an enormous procession. Behind the Queen and Mayblossom came five dozen princesses who were their cousins, followed by ten dozen more from neighboring kingdoms. They moved through the carpeted streets at a stately pace. Then the sky began to darken. Thunder growled without warning, and rain and hail poured down in torrents. The Queen pulled her royal mantle over her head. All the other princesses lifted the long trains of their gowns and held them overhead for shelter.
        - id: ch02-b13
          speaker: narrator
          text: Before Mayblossom could do the same, a dreadful chorus of crows, rooks, ravens, and screech owls filled the air. A huge owl swooped down and threw a scarf over her shoulders. It was woven from spiders' webs and embroidered with bats' wings. Mocking laughter rang above them. Everyone knew this was another joke from Carabosse.
        - id: ch02-b14
          speaker: narrator
          text: The terrified Queen pulled at the black scarf, but it clung as if nailed to Mayblossom's shoulders.
        - id: ch02-b15
          speaker: queen
          text: Can nothing satisfy that enemy? I sent her more than fifty pounds of sweets, as much fine sugar, and even two Westphalia hams. She is still as angry as ever!
          emotion: fearful
        - id: ch02-b16
          speaker: narrator
          text: The Queen continued lamenting while everyone stood as wet as if they had been dragged through a river. Mayblossom still thought only of the ambassador. Just then, he appeared beside the King. Trumpets sounded and the people shouted more loudly than ever. Fanfaronade was almost never short of words, but the Princess was far lovelier and more majestic than he expected. He managed only a few stammers and forgot the grand speech he had practiced for months, though he had known it well enough to repeat in his sleep. Hoping to remember some of it, he bowed low several times. Mayblossom answered with half a dozen curtseys, hardly knowing what she did, and then came to his rescue.
        - id: ch02-b17
          speaker: mayblossom
          text: Sir Ambassador, whatever you meant to say must be charming because it comes from you. But let us hurry inside. The rain is pouring down, and wicked Carabosse will enjoy watching us drip. Once we are under shelter, we can laugh at her instead.
        - id: ch02-b18
          speaker: narrator
          text: Mayblossom's kindness finally helped Fanfaronade find his tongue. With all his usual gallantry, he declared that Carabosse must have foreseen the flames that would be kindled by the Princess's bright eyes. That was why the fairy had sent such a deluge to put them out. Then he offered Mayblossom his hand and began leading her toward the palace. As they walked together through the rain, she spoke to him softly.
        - id: ch02-b19
          speaker: mayblossom
          text: You could never guess how much I like you, so I must say it plainly. Ever since I saw you ride into town, I have wished you had come for yourself instead of your master. If you feel the same, I will marry you. You are not a prince, but I will love you as if you were. We can live in some cozy corner of the world and be happy together.
        - id: ch02-b20
          speaker: narrator
          text: Fanfaronade thought he must be dreaming and could hardly believe the lovely Princess had said such a thing. He did not dare give her any answer at all. Instead, he squeezed her hand so hard that he hurt her little finger. Mayblossom did not cry out or let anyone see. When they reached the palace at last, the King welcomed his daughter and kissed her on both cheeks.
        - id: ch02-b21
          speaker: king
          text: My little lamb, will you marry great King Merlin's son? His ambassador has come to take you to him.
        - id: ch02-b22
          speaker: mayblossom
          text: If you please, Father.
        - id: ch02-b23
          speaker: queen
          text: And I give my consent. Prepare the banquet!
        - id: ch02-b24
          speaker: narrator
          text: The servants prepared the banquet as quickly as they could. The King, Queen, courtiers, visiting princesses, and all the other guests ate splendidly. Everyone feasted except Mayblossom and Fanfaronade. They sat gazing at one another and forgot both the food before them and everyone else in the room.
    - id: ch03
      title: The Flight to Squirrel Island
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A ball followed the banquet, and a ballet followed the ball. At last everyone was so tired that they fell asleep wherever they sat. Only Mayblossom and Fanfaronade remained wide awake. When the Princess saw that no one was watching, she turned to him.
        - id: ch03-b02
          speaker: mayblossom
          text: Quickly, let us run away. We will never have a better chance.
        - id: ch03-b03
          speaker: narrator
          text: Mayblossom took the King's dagger, which rested in a diamond sheath, and also carried away the Queen's precious neckerchief. She put her hand in Fanfaronade's. He held a lantern before them as they slipped from the sleeping palace, ran through the muddy streets, and hurried down to the shore. There they found a little boat with a poor old boatman asleep inside it. He woke to see a beautiful Princess standing over him, covered in diamonds yet still wearing that strange scarf of spiders' webs. He could not imagine what was happening. When Mayblossom commanded him to set out at once, he obeyed without a question.
        - id: ch03-b04
          speaker: narrator
          text: No moon or stars could be seen, but a carbuncle set in the Queen's neckerchief shone as brightly as fifty torches. Fanfaronade asked where Mayblossom wished to go. She said any place would do as long as he was beside her.
        - id: ch03-b05
          speaker: fanfaronade
          text: Princess, I cannot take you to King Merlin's court. He would think hanging far too good for me.
          emotion: fearful
        - id: ch03-b06
          speaker: mayblossom
          text: Then we will go to Squirrel Island. It is lonely and so far away that no one will follow us.
        - id: ch03-b07
          speaker: narrator
          text: She ordered the boatman to steer for Squirrel Island. Meanwhile, dawn came. The King, Queen, and courtiers woke, rubbed their eyes, and returned to the wedding preparations. The Queen asked for her neckerchief so she could look her best. Servants searched from wardrobes to stoves, and the Queen ran from attic to cellar, but no one found it.
        - id: ch03-b08
          speaker: narrator
          text: By then, the King had discovered that his dagger was gone, so the whole search began again. Servants opened boxes and chests whose keys had been lost for a hundred years. They uncovered any number of curious old things, but not the dagger. The King tore at his beard, and the Queen tore at her hair. The missing neckerchief and dagger were worth more than anything else in the kingdom, and neither one was anywhere to be found.
        - id: ch03-b09
          speaker: king
          text: Never mind. Let us finish the wedding before anything else disappears. Now, where is the Princess?
        - id: ch03-b10
          speaker: nurse
          text: Sire, I have searched for her for two hours. She is nowhere to be found.
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: This was more than the Queen could bear. She gave a shriek of alarm and fainted where she stood. The courtiers poured two whole barrels of eau de cologne over her before she recovered. When she opened her eyes, everyone was running about in terror and confusion, still calling for the Princess. Mayblossom did not appear. The King ordered his page to find Fanfaronade, who was doubtless asleep in some forgotten corner, and tell him the dreadful news. The page hunted everywhere, but the ambassador had vanished just as completely as the Princess, the dagger, and the neckerchief.
        - id: ch03-b12
          speaker: narrator
          text: The King summoned his counsellors and guards to the great hall, with the Queen beside him. Since he had not prepared a speech, he ordered everyone to remain silent for three hours while he thought. Then he addressed them.
        - id: ch03-b13
          speaker: king
          text: Listen, great and small! My dear Mayblossom is gone. I cannot tell whether someone stole her or whether she simply disappeared. The Queen's neckerchief and my dagger are missing too, and worst of all, so is Fanfaronade. When King Merlin hears nothing from his ambassador, he may come here and accuse us of making mincemeat of the man. I might bear even that if the wedding had not ruined me. Tell me how to recover my daughter, the ambassador, and our treasures.
        - id: ch03-b14
          speaker: narrator
          text: It was the finest speech the King had ever made. Once everyone finished admiring it, the Prime Minister answered.
        - id: ch03-b15
          speaker: prime_minister
          text: Sire, your sorrow makes us all very sorry. We would give anything we value to remove its cause. Still, this may be another trick of Carabosse, since the Princess's twenty unlucky years were not quite finished. And if I must speak honestly, the Princess and Fanfaronade seemed to admire each other greatly. That may explain why they vanished.
        - id: ch03-b16
          speaker: queen
          text: Be careful, sir. Mayblossom was brought up far too well to fall in love with an ambassador.
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: At this, the nurse stepped forward and fell on her knees. She confessed how the women had made the little needle hole in the tower wall. She told them that Mayblossom had looked through it, seen the ambassador, and declared that she would marry him and no one else. The Queen flew into a rage. She scolded the nurse, the cradle-rocker, and the nursery maid so fiercely that all three shook in their shoes. Before she could continue, Admiral Cocked-Hat broke in.
        - id: ch03-b18
          speaker: admiral
          text: Let us chase that worthless Fanfaronade. There is no doubt that he has carried off our Princess!
        - id: ch03-b19
          speaker: narrator
          text: Everyone clapped and shouted agreement. Some searchers took ships, while others crossed from kingdom to kingdom, beating drums and blowing trumpets. Whenever a crowd gathered, the heralds called out together.
        - id: ch03-b20
          speakers: [herald_1, herald_2]
          ensemble: duo
          text: Tell us where Fanfaronade has hidden Princess Mayblossom, and you may have a beautiful doll, every kind of sweet, little scissors, a golden robe, and a satin cap!
        - id: ch03-b21
          speaker: narrator
          text: Everywhere the answer was the same. The people had seen neither the Princess nor Fanfaronade, and the searchers must go farther. Those who traveled by sea had better fortune. After sailing here and there for some time, they noticed a light ahead. It burned through the night like a great fire. The sailors did not know what it could be and at first dared not go near it. After a while, they saw that the brightness remained fixed above Squirrel Island. As you may already have guessed, it came from the carbuncle in the Queen's neckerchief.
        - id: ch03-b22
          speaker: narrator
          text: After landing, Mayblossom and Fanfaronade had paid the boatman one hundred gold coins. They made him solemnly promise that he would tell no one where he had taken them. But the very first thing that happened on his return was that he rowed straight into the middle of the royal fleet. Before he could escape, the Admiral spotted him and sent a boat in pursuit. The sailors searched his pockets and found the gold. Every coin was new, struck especially for the Princess's wedding. The Admiral felt certain that Mayblossom had paid this man to help her escape. Still, the boatman answered no questions. He pretended that he could neither hear nor speak.
        - id: ch03-b23
          speaker: admiral
          text: Deaf and dumb, is he? Tie him to the mast and let him taste the cat-o'-nine-tails. I know no better cure for either complaint.
        - id: ch03-b24
          speaker: narrator
          text: When the old man saw that the Admiral meant it, he told everything about the gentleman and lady he had carried to Squirrel Island. The Admiral knew they were Mayblossom and Fanfaronade, and he ordered the fleet to surround the island.
    - id: ch04
      title: Hunger Reveals a Heart
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the island, Mayblossom had grown terribly sleepy. She lay on a grassy bank in the shade and fell into a deep sleep. Fanfaronade was hungry instead of tired. He woke her crossly.
        - id: ch04-b02
          speaker: fanfaronade
          text: Madam, how long will you lie here? There is nothing to eat. Charming as you are, looking at you will not keep me from starving.
          emotion: angry
        - id: ch04-b03
          speaker: mayblossom
          text: Fanfaronade, can you really want anything when I am here with you? You should be thinking how happy you are.
          emotion: surprised
        - id: ch04-b04
          speaker: fanfaronade
          text: Happy? I am miserable. I wish with all my heart that you were back in your dark tower.
          emotion: angry
        - id: ch04-b05
          speaker: mayblossom
          text: Darling, please don't be cross. I will look for wild fruit for you.
        - id: ch04-b06
          speaker: fanfaronade
          text: I hope you find a wolf to eat you.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: Dismayed, Mayblossom ran here and there through the wood. She searched beneath the trees and among the bushes for any wild fruit she could carry back. Brambles tore her beautiful dress, and thorns scratched her white hands, but she found nothing fit to eat. At last she returned sadly to Fanfaronade. The moment he saw her empty hands, he rose and left her, grumbling to himself. The next day, they searched the island once more. They wandered just as far and looked just as carefully, but found no food at all.
        - id: ch04-b08
          speaker: mayblossom
          text: If only I could find food for you. I would not mind going hungry myself.
          emotion: sad
        - id: ch04-b09
          speaker: fanfaronade
          text: No, I would not mind that either.
        - id: ch04-b10
          speaker: mayblossom
          text: Would you truly not care if I died of hunger? You told me you loved me!
          emotion: sad
        - id: ch04-b11
          speaker: fanfaronade
          text: That was somewhere else, when I was not hungry. Dying of hunger and thirst on a desert island changes a man's ideas.
        - id: ch04-b12
          speaker: narrator
          text: Deeply hurt, Mayblossom sat beneath a white rosebush and wept.
        - id: ch04-b13
          speaker: mayblossom
          text: How lucky the roses are. They only bloom in the sunshine and let people admire them. No one is cruel to them.
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: Her tears splashed onto the roots. The whole bush began to rustle, and the prettiest rosebud spoke in a tiny, gentle voice.
        - id: ch04-b15
          speaker: rosebud
          text: Poor Princess, look inside that tree trunk. You will find a honeycomb there. But do not be foolish enough to share it with Fanfaronade.
          emotion: calm
        - id: ch04-b16
          speaker: narrator
          text: Mayblossom found the honey and ran straight to Fanfaronade.
        - id: ch04-b17
          speaker: mayblossom
          text: Look, I found a honeycomb! I could have eaten it myself, but I would much rather share it with you.
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: Without looking at her or offering a single word of thanks, Fanfaronade snatched the honeycomb from her hands. Then he ate it all, every last morsel, without offering her even a taste. Mayblossom had found it, carried it to him, and had eaten nothing herself. Even so, when she humbly asked him to spare a little, he mocked her. The honey was far too sweet for her, he said, and would only spoil her teeth.
        - id: ch04-b19
          speaker: narrator
          text: More miserable than before, she sat under an oak. Her sighs and tears were so pitiful that the tree fanned her with its leaves and spoke.
        - id: ch04-b20
          speaker: oak
          text: Take courage, pretty Princess. Not everything is lost. Drink this pitcher of milk, and whatever happens, do not leave one drop for Fanfaronade.
          emotion: calm
        - id: ch04-b21
          speaker: narrator
          text: Mayblossom looked around in amazement and saw a large pitcher filled to the brim with milk. She lifted it toward her lips. Before she could drink, however, she thought of Fanfaronade. After swallowing at least fifteen pounds of honey, he must be terribly thirsty. Forgetting the oak's warning and her own hunger, she picked up the heavy pitcher and hurried back to him.
        - id: ch04-b22
          speaker: mayblossom
          text: Here is some milk. You must be thirsty, so please drink. Only save a little for me, because I am faint with hunger and thirst.
        - id: ch04-b23
          speaker: narrator
          text: Fanfaronade seized the pitcher and drank everything it held in one enormous swallow. He left not a drop for Mayblossom. Then he hurled the empty pitcher against the nearest stone and smashed it into pieces. With a cruel smile, he told the starving Princess that since she had eaten nothing, she could not possibly be thirsty.
        - id: ch04-b24
          speaker: mayblossom
          text: Now I am punished for disappointing the King and Queen and running away with an ambassador I knew nothing about.
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: She wandered into the thickest wood and sat beneath a thorn tree where a nightingale sang. Soon the bird spoke to her.
        - id: ch04-b26
          speaker: nightingale
          text: Search beneath the bush, Princess. You will find sugar, almonds, and tarts. This time, do not be silly enough to offer Fanfaronade any.
        - id: ch04-b27
          speaker: narrator
          text: Mayblossom was nearly fainting, so this time she obeyed and ate everything herself. Fanfaronade saw that she had found good food and refused to share it. He rushed at her in a fury. Mayblossom quickly drew out the carbuncle, which could make anyone invisible when danger threatened. Once safely hidden, she gently reproached him for his cruelty.
    - id: ch05
      title: The Battle on the Island
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, Admiral Cocked-Hat sent Jack-the-Chatterer-of-the-Straw-Boots, the Prime Minister's official courier, to report that the fugitives had landed on Squirrel Island. The Admiral had not pursued them because he did not know the country and feared hidden enemies. The King and Queen rejoiced at the news.
        - id: ch05-b02
          speaker: narrator
          text: The King sent for an enormous book made by a very clever fairy. Each one of its leaves measured eight ells from end to end. The book contained a description of every country, sea, and island on the whole earth. The King turned its huge pages until he found Squirrel Island. There he read that the island was completely uninhabited.
        - id: ch05-b03
          speaker: king
          text: Go back at once. Tell the Admiral to land. I am astonished that he has not done so already.
        - id: ch05-b04
          speaker: narrator
          text: As soon as Jack carried the King's message back to the fleet, every ship began preparing for war. The noise grew so tremendous that it reached Mayblossom far across the island. She understood that the soldiers were coming and flew to protect her lover. Fanfaronade had very little courage of his own, so he gladly let the Princess place herself between him and danger.
        - id: ch05-b05
          speaker: mayblossom
          text: Stand behind me. I will hold up the carbuncle and make us invisible. If the soldiers come near, I can protect you with the King's dagger.
        - id: ch05-b06
          speaker: narrator
          text: The soldiers came ashore in their boats and spread across the beach, but they could see no enemy anywhere. Mayblossom held the carbuncle before her, keeping herself and Fanfaronade hidden from every eye. As each soldier approached, she touched him with the King's dagger. One after another, the men fell senseless onto the sand. At last Admiral Cocked-Hat realized that he was fighting some invisible enchantment. He hastily ordered the retreat to be sounded. His men ran back to their boats in the greatest confusion and rowed away from shore.
        - id: ch05-b07
          speaker: narrator
          text: Once the soldiers had gone and Fanfaronade was alone with the Princess again, he began making a secret plan. He wanted the carbuncle that could hide him and the dagger that could defeat his enemies, but he no longer wanted Mayblossom. If he could get rid of her and keep both treasures, he believed he could escape wherever he pleased. As they walked back together over the high cliffs, he suddenly gave the Princess a violent push, hoping she would fall straight into the sea.
        - id: ch05-b08
          speaker: narrator
          text: Mayblossom happened to step aside so quickly that his hands missed their mark. Fanfaronade's own force carried him forward. He lost his balance, pitched over the edge of the cliff, and plunged into the sea below. He sank to the bottom like a lump of lead and was never heard of again. Mayblossom remained at the cliff's edge, staring after the man she had loved and watching in horror.
        - id: ch05-b09
          speaker: narrator
          text: Then a rushing sound swept over her head. Two chariots raced toward each other through the sky. One shone brilliantly and was drawn by swans and peacocks. In it sat a fairy as beautiful as a sunbeam. The other chariot was pulled by bats and ravens. It carried a dreadful little dwarf dressed in snakeskin, with a great toad worn as a hood.
        - id: ch05-b10
          speaker: narrator
          text: The two chariots rushed together and met in midair with a terrible crash. Mayblossom watched in breathless anxiety while a furious battle began above her. The beautiful fairy drove forward with a golden lance. The hideous dwarf fought back with a rusty pike while bats and ravens beat their wings around her. Very soon, it became clear that the shining fairy was winning. The dwarf wheeled her bats around and fluttered away in complete disorder. The swans and peacocks circled down toward the island, and the victorious fairy stepped from her chariot to stand beside Mayblossom with a smile.
        - id: ch05-b11
          speaker: fifth_fairy
          text: You see, Princess, I have completely defeated that spiteful Carabosse. Would you believe she meant to rule your life forever because you left the tower four days before your twenty years were complete? I have ended her claim. I hope you will be happy now and enjoy the freedom I have won for you.
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: Mayblossom thanked the fairy with all her heart. Then the fairy sent one of her peacocks flying to her palace to fetch a magnificent robe. Mayblossom badly needed one, for the thorns and briars had torn her own clothes to shreds. A second peacock flew out to the fleet and told the Admiral that he could now land in perfect safety. Admiral Cocked-Hat came ashore at once and brought all his men with him, even Jack-the-Chatterer. As Jack hurried past the place where the Admiral's dinner was roasting, he saw the loaded spit, snatched it from the fire, and carried the whole meal along.
    - id: ch06
      title: Mayblossom Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Admiral Cocked-Hat was amazed when he came upon the golden chariot. He was even more astonished to see two lovely ladies walking beneath the trees a little farther on. As soon as he drew near, he recognized Mayblossom. He dropped to his knees and kissed her hand with delight. The Princess presented him to the fairy and told him how Carabosse had finally been defeated. The Admiral thanked their rescuer, congratulated her on the victory, and found her most gracious. While they were still talking together, the fairy suddenly lifted her head and sniffed the air.
        - id: ch06-b02
          speaker: fifth_fairy
          text: Why, I believe I smell a delicious dinner.
          emotion: surprised
        - id: ch06-b03
          speaker: jack
          text: You do indeed, madam. Here it is, with every pheasant and partridge still sizzling. Would Your Highness care to taste one?
        - id: ch06-b04
          speaker: fifth_fairy
          text: Gladly. The Princess must be longing for a proper meal.
        - id: ch06-b05
          speaker: narrator
          text: The Admiral sent men back to his ship for plates, cups, and everything else the meal required. Then the whole company sat beneath the trees and feasted merrily on the hot pheasants and partridges. By the time they finished, the peacock had returned from the fairy's palace with Mayblossom's new clothes. The fairy dressed her in a robe of green and gold brocade, richly embroidered with pearls and rubies. She gathered the Princess's long golden hair and tied it back with strings of diamonds and emeralds. Last of all, she crowned Mayblossom with fresh flowers.
        - id: ch06-b06
          speaker: narrator
          text: Mayblossom climbed into the golden chariot beside the fairy, and together they rose from the island. The swans and peacocks carried them out over the water and brought them down upon the deck of the Admiral's ship. There the fairy said farewell. She sent many warm messages of friendship to the Queen and told Mayblossom to explain that her rescuer was the fifth fairy who had attended the christening long ago.
        - id: ch06-b07
          speaker: narrator
          text: Cannons fired their salute, the fleet raised anchor, and every ship sailed for home. Soon they reached the port, where the King and Queen were waiting. They welcomed their daughter with such joy and kindness that Mayblossom could not find a moment to say how sorry she was for running away with such a cowardly ambassador. Still, perhaps Carabosse had caused it all.
        - id: ch06-b08
          speaker: narrator
          text: At that fortunate moment, King Merlin's son arrived. No news had come from his ambassador, so he had set out to discover what was wrong. A splendid escort rode with him, including one thousand horsemen and thirty bodyguards dressed in scarlet and gold.
        - id: ch06-b09
          speaker: narrator
          text: The Prince was one hundred times handsomer and braver than Fanfaronade. Mayblossom found that she could like him very much indeed. Their wedding took place at once, with such magnificence and rejoicing that everyone forgot the troubles that had come before.
