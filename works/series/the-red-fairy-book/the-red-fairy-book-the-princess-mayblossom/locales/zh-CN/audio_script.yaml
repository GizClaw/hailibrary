        timbre: 轻盈悦耳
        pace: 中等偏快
        pitch: 高
    jack:
      display_name: 草靴话匣子杰克
      tts:
        delivery: 活络麻利，话音清楚
        timbre: 明亮轻快
        pace: 稍快
        pitch: 中等
  chapters:
    - id: ch01
      title: 诅咒与高塔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后的孩子一个接一个夭折，最后只留下一个年幼的女儿。王后愁得不知如何是好，一心想找个真正可靠的乳母，好好照料并抚养这个孩子。传令官便走遍全国，在每个街角吹响号角，请最好的乳母前来。到了指定的那一天，四面八方赶来自荐的人挤满王宫。王后怕看不完，就让她们到宫旁幽凉的树林里排队等候。
        - id: ch01-b02
          speaker: narrator
          text: 乳母们行过屈膝礼，站成一列。她们大都白净丰腴，只有一个女人皮肤黝黑，相貌丑陋，嘴里还说着谁也听不懂的话。王后觉得她根本不合适，当场赶她离开。女人含糊地咕哝几句，转身藏进一棵空心树，暗中盯着外面。
        - id: ch01-b03
          speaker: narrator
          text: 王后把丑女人抛在脑后，很快挑中一位面颊红润的漂亮乳母。谁知人刚选定，草丛里忽然蹿出一条蛇，咬了她的脚。她立刻倒在地上，像死了一样。王后被这场意外弄得很烦恼，却很快又选了一人。第二位刚向前迈步，一只飞过的鹰便丢下一只大乌龟，正砸在她头上，脑袋顿时裂得像蛋壳。王后吓坏了，可还是第三次作出选择。那乳母走得太急，一头撞上树枝，尖刺戳瞎了她的眼睛。
        - id: ch01-b04
          speaker: queen
          text: 这里一定有邪恶的力量作祟！今天不选了，我们回宫！
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 王后刚起身，背后就传来恶毒的大笑。原来那个丑女人一直躲着看热闹，如今把众人挨个嘲弄，尤其不肯放过王后。王后气得正要叫人抓她，她却挥起魔杖敲了两下。一辆烈焰战车从天而降，前面拉车的是飞龙。女人尖声威胁着众人，乘车卷上天空。国王终于认出了她。
        - id: ch01-b06
          speaker: king
          text: 唉，我们这回真要完了！她就是卡拉博斯仙女。我小时候胡闹，往她的粥里放过硫黄，她一直记恨到今天。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 王后听完哭了起来。
        - id: ch01-b08
          speaker: queen
          text: 要是早知道是她，我无论如何也会设法同她和解。现在恐怕一切都来不及了。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 国王后悔把妻子吓成这样，便提议召集会议，商量怎样躲过卡拉博斯必定会降在小公主身上的灾难。所有大臣都被召进王宫。议事以前，宫里先关紧每一扇门窗，连每个钥匙孔都严严实实地塞住，免得有人偷听。最后大家决定，邀请方圆一千里内的每位仙女参加公主的洗礼，却把仪式日期严格保密，不让卡拉博斯听见风声，也生出前来参加的念头。
        - id: ch01-b10
          speaker: narrator
          text: 王后和侍女为客人准备了蓝丝绒斗篷、杏黄色缎裙、高跟鞋、锋利的针和金剪刀。到了那天，只有五位仙女能来。第一位赐给公主绝世的美貌，第二位让她凡事听人讲一遍就会明白，第三位给她夜莺般的歌声，第四位让她无论做什么都能成功。
        - id: ch01-b11
          speaker: narrator
          text: 第五位仙女刚要开口，烟囱里突然隆隆作响。卡拉博斯滚了下来，浑身沾满煤灰。
        - id: ch01-b12
          speaker: carabosse
          text: 我要她在二十岁以前，做全世界最倒霉的人！
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 王后和仙女们苦苦哀求，说小公主从没得罪过她，请她收回诅咒。卡拉博斯只哼了一声。还没送出祝福的第五位仙女赶紧补救。
        - id: ch01-b14
          speaker: fifth_fairy
          text: 等公主熬过这段危险的年月，她往后的一生都会长久幸福。
          emotion: calm
        - id: ch01-b15
          speaker: narrator
          text: 卡拉博斯恶狠狠地笑着，又从烟囱爬走，只留下满屋惊惶不安的人。王后尤其忧虑，却仍用极丰盛的筵席款待仙女，还在原先的礼物之外送给她们各自喜爱的漂亮缎带。临别时，最年长的仙女说，她们都认为最稳妥的办法，是在公主满二十岁以前，把她和贴身侍女关在一个地方，绝不能让她见到其他任何人。
        - id: ch01-b16
          speaker: narrator
          text: 国王于是造起一座高塔。塔上没有窗户，只点蜡烛照明。唯一的入口通向地下，沿路每隔二十英尺便有一道铁门，处处都有守卫。小公主名叫五月花，因为她像春天一样清新明艳。她渐渐长成高挑美丽的姑娘，一言一行都惹人喜爱。国王和王后每次探望她，都比上一次更爱她。
        - id: ch01-b17
          speaker: narrator
          text: 可五月花早就厌倦了高塔，常求父母带她出去，他们始终不答应。乳母从未离开她，偶尔会讲起外面的世界。公主从没亲眼见过那些东西，却凭着仙女的恩赐，听一遍就能懂。国王因此十分得意。
        - id: ch01-b18
          speaker: king
          text: 看来我们到底比卡拉博斯聪明。不管她怎样预言，我们的五月花还是会幸福。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 王后想到他们骗过了老仙女，也总是笑个不停。离公主二十岁生日只差四天时，他们把她的肖像送往邻国宫廷，准备为她选丈夫。全城都盼着公主恢复自由。梅林国王也派来使臣，要替儿子求婚，百姓更是欢喜。
    - id: ch02
      title: 一眼倾心
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 乳母把城里的每件新鲜事都讲给公主听，自然少不了这件与她最有关的事。她绘声绘色地说起使臣范法罗纳德进城的盛况，公主听得无论如何也想亲眼看看。
        - id: ch02-b02
          speaker: princess
          text: 我一定是世上最不幸的人！我又没犯过罪，为什么要关在这座阴沉的塔里？太阳、星星、马、猴子和狮子，我都只见过画。父王母后说等我二十岁就放我出去，可他们多半只是在哄我，根本不想让我离开。
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: 她哭了起来。乳母、乳母的女儿、摇摇篮的女仆和育儿女仆都真心爱她，也跟着抽泣叹气。公主见大家如此心疼自己，就说，要是不让她看看范法罗纳德入城，她宁可绝食死去。
        - id: ch02-b04
          speaker: princess
          text: 你们若真的爱我，一定能想出办法。只要谁都不说，父王母后永远不会知道。
        - id: ch02-b05
          speaker: narrator
          text: 她们越劝，公主越坚定，最后只得答应在高塔朝城门的一面凿个小洞。众人刮了一天一夜，才挖出一个细得连长针也难穿过的孔。公主第一次从那里望见日光，眼前的一切叫她目眩神迷。她一刻也舍不得移开眼睛，终于等到了使臣的队伍。
        - id: ch02-b06
          speaker: narrator
          text: 范法罗纳德走在最前面。他骑着白马，马儿随着号角腾跃起舞。他的外套几乎被珍珠和钻石的刺绣铺满，靴子是纯金的，头盔上飘着鲜红羽饰。公主看他一眼就失去了理智，认定自己非他不嫁。
        - id: ch02-b07
          speaker: princess
          text: 他的主人一定没有他一半英俊，也没有他一半可爱。我又不贪图什么。反正我一辈子都困在这座乏味的塔里，只要能和范法罗纳德在一起，住乡下小屋也好，吃清水面包也好，都胜过跟别人吃烤鸡和糖果。
        - id: ch02-b08
          speaker: narrator
          text: 她说个不停，侍女们都惊讶她哪来这么多话。她们提醒公主身份尊贵，不可能这样做，公主却一句也不听，只叫她们闭嘴。使臣刚到王宫，王后便来接女儿。街上铺满地毯，窗边挤着贵妇。她们提着花朵和糖果，等着公主经过时撒下去。
        - id: ch02-b09
          speaker: narrator
          text: 众人才开始替公主梳妆，一名骑着大象的侏儒便奉五位仙女之命赶来。他带来一顶王冠、一根权杖、一件金锦长袍和一条衬裙，裙上用蝴蝶翅膀绣出了奇妙的花纹。他还带来一匣世间从未见过的华美珠宝。王后一打开匣子，就被耀眼的宝光迷住。公主心里只有范法罗纳德，对这些珍宝几乎连一眼也不看。
        - id: ch02-b10
          speaker: narrator
          text: 侏儒得了一枚金币，身上还系满缎带，多得几乎看不见人。公主回赠每位仙女一架新纺车和一根雪松木纺纱杆，王后也答应从珍藏里再挑可爱的礼物。公主穿上仙女送来的衣饰，显得比往日更美。她走过街道时，人群一齐欢呼。
        - id: ch02-b11
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 她多美呀！她多美呀！
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: 王后和公主走在队伍中，身后是六十位与五月花同宗的公主，还有一百二十位从邻国来的公主。这样一支长长的队伍庄严而缓慢地向前行进，天空却一点点暗了下来。雷声忽然在头顶低吼，暴雨夹着冰雹倾盆而下。王后赶紧把王袍蒙在头上，其余公主也纷纷举起长裙拖地的后摆，遮住自己的脑袋。
        - id: ch02-b13
          speaker: narrator
          text: 五月花正要照做，空中传来可怕的鸟鸣，像乌鸦、秃鼻乌鸦、渡鸦、鸣角鸮和所有不祥的鸟同时嘶叫。一只巨大的猫头鹰飞到她身旁，把蛛网织成、蝙蝠翅膀绣花的披巾罩在她肩上。天空随即响起嘲笑声。众人都明白，这又是卡拉博斯的恶作剧。
        - id: ch02-b14
          speaker: narrator
          text: 王后吓得伸手去扯黑披巾，可它像钉住一样牢牢粘着。
        - id: ch02-b15
          speaker: queen
          text: 唉，到底怎样才能叫这个仇人消气？我送了她五十多磅糖果，又送了同样多的上等砂糖，还有两只威斯特伐利亚火腿。可这一切有什么用？她还是气成这样！
          emotion: fearful
        - id: ch02-b16
          speaker: narrator
          text: 王后不停哀叹，众人全被淋得像刚从河里捞出来。公主却只想着使臣。恰好范法罗纳德陪国王来到她面前，号角齐鸣，百姓的欢呼也更加响亮。使臣平日从不缺话，可公主比他想象中更美、更有威仪，他竟结巴起来，把练了几个月、梦里也会背的演说忘得干净。
        - id: ch02-b17
          speaker: narrator
          text: 为了拖延时间，好想起演说，他接连向公主深深鞠躬。公主也不假思索地屈膝回礼六次，随后主动替他解围。
        - id: ch02-b18
          speaker: princess
          text: 使臣先生，这番话既然由您来说，想必一定非常动听。不过，我们还是先进宫吧。雨这么大，卡拉博斯看见我们站在这里浑身滴水，准会得意。等进了屋，我们就能反过来笑她了。
        - id: ch02-b19
          speaker: narrator
          text: 范法罗纳德终于找回舌头。他殷勤地说，仙女一定早就知道，公主明亮的眼睛会点起熊熊火焰，所以才放下洪水来灭火。说完，他伸手引公主前行。公主压低声音对他说出心事。
        - id: ch02-b20
          speaker: princess
          text: 范法罗纳德先生，您猜不到我有多喜欢您，我只好亲口告诉您。自从看见您骑着那匹漂亮的马进城，我就一直遗憾，您为什么替别人求婚，而不是替自己。要是您也喜欢我，我就不嫁您的主人，改嫁给您。您虽然不是王子，我也会像爱王子那样爱您。我们去找个安静舒适的角落，从早到晚，天天幸福。
        - id: ch02-b21
          speaker: narrator
          text: 使臣以为自己在做梦，简直不敢相信。他没有回答，只把公主的手越握越紧，连她的小指都捏痛了，公主也没出声。到了王宫，国王亲了女儿的两边面颊。
        - id: ch02-b22
          speaker: king
          text: 我的小羊羔，你愿不愿意嫁给伟大的梅林国王之子？这位使臣就是奉命来接你的。
        - id: ch02-b23
          speaker: princess
          text: 只要陛下愿意，我就愿意。
        - id: ch02-b24
          speaker: queen
          text: 我也同意。马上准备宴席吧。
          emotion: happy
        - id: ch02-b25
          speaker: narrator
          text: 宴席立刻摆好。人人都尽情吃喝，只有五月花和范法罗纳德彼此凝望，把其他一切忘得干净。
    - id: ch03
      title: 夜奔松鼠岛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 宴席过后是舞会，接着又演芭蕾。最后，人人都累得坐在哪里便睡在哪里。只有两个恋人还清醒得像小老鼠。公主见四下再没什么可怕的，便向范法罗纳德提议。
        - id: ch03-b02
          speaker: princess
          text: 我们快逃吧！再也找不到比现在更好的机会了。
        - id: ch03-b03
          speaker: narrator
          text: 她拿走国王那把装在钻石鞘里的匕首，又取来王后的颈巾，把手交给提灯笼的范法罗纳德。两人跑出宫门，踏过泥泞的街道，一直来到海边。他们登上一条小船，船上可怜的老船夫还在睡觉。老人醒来，看见一位戴满钻石、披着蛛网披巾的美丽公主，完全猜不出发生了什么。
        - id: ch03-b04
          speaker: narrator
          text: 公主命他开船，他马上照办。夜空没有月亮，也没有星星，可王后颈巾上的红宝石放出强光，抵得上五十支火把。范法罗纳德问公主要去哪里，她说只要有他相伴，哪里都可以。使臣却不敢回梅林国王的宫廷。
        - id: ch03-b05
          speaker: fanfaronade
          text: 公主，我可不敢带您回去。梅林国王若知道这件事，一定觉得绞死我都太便宜了。
          emotion: fearful
        - id: ch03-b06
          speaker: princess
          text: 那我们就去松鼠岛吧。那里又偏僻又遥远，谁也追不到我们。
        - id: ch03-b07
          speaker: narrator
          text: 公主便叫老船夫驶向松鼠岛。与此同时，天渐渐亮了。国王、王后和宫臣陆续醒来，揉着眼睛，准备继续操办婚礼。王后叫人拿颈巾来梳妆，宫里立刻忙成一团。众人从衣柜找到火炉，王后亲自从阁楼跑到地窖，哪里都没有颈巾。
        - id: ch03-b08
          speaker: narrator
          text: 这时，国王也发现自己的匕首不见了，众人只好从头重新搜查。他们打开许多尘封已久的箱笼，有些箱子的钥匙已经丢了一百年。大家从里面翻出不少稀奇古怪的东西，却始终没有找到那把匕首。国王急得直揪自己的胡子，王后也不停扯自己的头发，因为那条颈巾和那把匕首正是全国最贵重的两件宝物。直到再也没有地方可找，国王才不得不放弃。
        - id: ch03-b09
          speaker: king
          text: 算了，还是赶快把婚礼办完吧，免得又丢掉别的东西。公主在哪里？
        - id: ch03-b10
          speaker: nurse
          text: 陛下，我已经找了她两个钟头，可是什么地方都找不到。
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 王后惊叫一声，当场昏倒。众人往她身上浇了整整两桶古龙水，她才醒来。宫里陷入极度的恐慌，所有人又开始找公主，可她仍不见踪影。
        - id: ch03-b12
          speaker: king
          text: 去把范法罗纳德使臣找来。他一定睡在哪个角落，把这个坏消息告诉他。
        - id: ch03-b13
          speaker: narrator
          text: 侍从到处寻找，范法罗纳德却和公主、匕首、颈巾一样，消失得无影无踪。国王召集大臣和卫兵，与王后一同走进大殿。他来不及准备演说，便先叫众人安静三个小时。三个小时过去，他终于开口。
        - id: ch03-b14
          speaker: king
          text: 不论身份高低，大家听好！我亲爱的女儿五月花失踪了。我不知道她是被人劫走，还是自己离开。王后的颈巾和我的匕首也丢了，那都是价值连城的宝物。更糟的是，范法罗纳德使臣也找不到。他的主人等不到消息，恐怕会亲自来，指控我们把使臣剁成了肉馅。若我还有钱，或许也能忍受，可这场婚礼已经让我破产。亲爱的臣民，请告诉我，怎样才能找回女儿、使臣和其他失物？
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: 这是国王一生中最雄辩的演说。众人赞叹一番，首相才恭敬回答。
        - id: ch03-b16
          speaker: prime_minister
          text: 陛下，见您这样悲痛，我们也都难过。只要能除去您悲伤的根源，我们愿献出世上珍爱的一切。不过，这件事看起来又像卡拉博斯的诡计。公主倒霉的二十年还差几天才结束。而且，我曾留意到公主和范法罗纳德彼此很是倾慕，这也许能解释他们为何同时失踪。
        - id: ch03-b17
          speaker: queen
          text: 先生，请你说话谨慎些。五月花公主教养极好，绝不会爱上一名使臣。
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: 乳母走上前跪下，坦白她们怎样在塔上凿出针眼般的小孔，又说公主看见使臣以后，亲口宣布非他不嫁。王后勃然大怒，把乳母、摇篮女仆和育儿女仆骂得在鞋子里直发抖。戴三角帽的海军上将打断了她。
        - id: ch03-b19
          speaker: admiral
          text: 赶快去追范法罗纳德那个无赖！毫无疑问，就是他拐走了公主。
          emotion: angry
        - id: ch03-b20
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 对，马上去追他！
        - id: ch03-b21
          speaker: narrator
          text: 有些人乘船出海，另一些人跑遍一个又一个王国，一路敲鼓吹号。只要见到人群，他们就高声宣布，谁能说出范法罗纳德把五月花公主藏在哪里，谁就能得到漂亮娃娃、各种糖果、一把小剪刀、一件金袍和一顶缎帽。可无论走到哪里，人们都回答说没见过他们，叫队伍再往前走。
        - id: ch03-b22
          speaker: narrator
          text: 出海的人运气好些。他们航行一阵，看见远处有一道光，夜里烧得像大火。起初没人敢靠近，后来那道光停在松鼠岛上空不动。那正是红宝石发出的光。公主和范法罗纳德登岛时，给了船夫一百枚金币，要他发誓保守秘密。偏偏船夫一离岛就撞进舰队中间，上将立刻派小艇截住他。
        - id: ch03-b23
          speaker: narrator
          text: 人们从船夫口袋里搜出金币。这是为公主大婚新铸的钱，上将认定公主用它们收买了船夫。老人却装聋作哑，不肯回答。
        - id: ch03-b24
          speaker: admiral
          text: 哦，他又聋又哑？把他捆到桅杆上，让他尝尝九尾鞭！我还没见过比这更灵的治聋哑药。
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: 老船夫见他动了真格，只得把知道的全说出来。
        - id: ch03-b26
          speaker: boatman
          text: 我送过一位骑士和一位贵妇。他们就在松鼠岛上。
          emotion: fearful
        - id: ch03-b27
          speaker: narrator
          text: 上将立刻明白那是谁，下令舰队包围整座岛。
    - id: ch04
      title: 荒岛上的真心
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 五月花困得厉害，已经在树荫下的草坡上沉沉睡去。范法罗纳德不困，却饿了。他把公主叫醒，满肚子火气。
        - id: ch04-b02
          speaker: fanfaronade
          text: 夫人，您还要在这里待多久？这地方连一点吃的都没有。您再迷人，我只望着您，也一样会饿死。
          emotion: angry
        - id: ch04-b03
          speaker: princess
          text: 什么？有我陪着你，你还需要别的东西吗？你应该时时刻刻想着自己有多幸福才对。
          emotion: surprised
        - id: ch04-b04
          speaker: fanfaronade
          text: 幸福？分明是不幸！我真希望你还关在那座黑塔里。
          emotion: angry
        - id: ch04-b05
          speaker: princess
          text: 亲爱的，别生气。我去找找，看能不能给你摘些野果。
        - id: ch04-b06
          speaker: fanfaronade
          text: 我倒希望你找到一匹狼，让它把你吃掉！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 公主吓坏了，却还是在林中四处奔走，替范法罗纳德寻找食物。树枝扯破了她的裙子，荆棘刺伤她漂亮的白手，可她怎么找也找不到能吃的东西。最后，她只能伤心地空手回到范法罗纳德身边。他一见她什么也没带，便站起来离开，一路自言自语，不停地抱怨。
        - id: ch04-b08
          speaker: narrator
          text: 第二天，两人重新寻找，仍旧一无所获。
        - id: ch04-b09
          speaker: princess
          text: 唉，只要能替你找到吃的，就算让我自己挨饿也没关系。
          emotion: sad
        - id: ch04-b10
          speaker: fanfaronade
          text: 很好，那我也不在意。
        - id: ch04-b11
          speaker: princess
          text: 难道我饿死了，你也不在乎？范法罗纳德，你说过爱我呀！
          emotion: sad
        - id: ch04-b12
          speaker: fanfaronade
          text: 那是在别的地方，而且那时我不饿。如今困在荒岛上，又饿又渴，人的想法当然会变。
        - id: ch04-b13
          speaker: narrator
          text: 公主伤透了心，坐在一丛白玫瑰下痛哭。她心想，玫瑰只须在阳光下开放，供人欣赏，从没有谁对它们刻薄，它们可真幸福。泪珠沿着她的面颊滚落，滴在花根上。整丛玫瑰忽然沙沙摇动，最美的花苞里响起一个轻柔声音。
        - id: ch04-b14
          speaker: rose
          text: 可怜的公主，去看看那棵树的树洞，里面有一块蜂巢。不过这一次可别犯傻，千万不要分给范法罗纳德。
        - id: ch04-b15
          speaker: narrator
          text: 五月花跑到树边，果然找到蜂蜜。她一刻也没耽搁，捧着蜂巢跑回范法罗纳德身边。
        - id: ch04-b16
          speaker: princess
          text: 快看，我找到了一块蜂巢。我原本可以自己吃完，可我更愿意和你一起吃。
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 范法罗纳德不看她，也不道谢，一把夺走蜂巢，把蜂蜜吃得干干净净，连一口也没留下。公主低声求他分一点，他反倒嘲笑说，蜂蜜对她太甜，会把牙齿吃坏。
        - id: ch04-b18
          speaker: narrator
          text: 五月花比先前更沮丧。她走到一棵橡树下坐着，哭声和叹息实在可怜。橡树摇动沙沙作响的叶子，替她扇风。
        - id: ch04-b19
          speaker: oak
          text: 鼓起勇气，美丽的公主，事情还没有完。把这壶牛奶喝光吧，无论如何也别给范法罗纳德留下一滴。
          emotion: calm
        - id: ch04-b20
          speaker: narrator
          text: 公主惊讶地四下寻找，果真发现满满一大壶牛奶。可她还没喝，就想到范法罗纳德吃了至少十五磅蜂蜜，一定渴得要命，于是赶紧跑回去。
        - id: ch04-b21
          speaker: princess
          text: 我找到一壶牛奶。你一定很渴，快喝一点吧。可是求你给我留些，我又饿又渴，已经快要死了。
        - id: ch04-b22
          speaker: narrator
          text: 他夺过壶，一口气喝光牛奶，又把壶摔向最近的石头，砸得粉碎。他恶意地笑起来。
        - id: ch04-b23
          speaker: fanfaronade
          text: 你什么都没吃，当然不会觉得渴。
        - id: ch04-b24
          speaker: princess
          text: 唉，我辜负了父王母后，又跟一个根本不了解的使臣私奔。如今受这样的惩罚，也是我应得的。
          emotion: sad
        - id: ch04-b25
          speaker: narrator
          text: 她独自走进树林深处，在一棵荆棘树下坐下。树上有只夜莺正在唱歌，不久，那歌声变成了话语。
        - id: ch04-b26
          speaker: nightingale
          text: 公主，去灌木下面找找。那里有糖、杏仁和馅饼。这回别再傻得拿给范法罗纳德了。
        - id: ch04-b27
          speaker: narrator
          text: 公主饿得快昏倒了，这一次终于听从劝告，独自吃掉找到的食物。范法罗纳德见她有好吃的却不分给自己，怒气冲冲地追来。公主连忙取出王后的红宝石。这颗宝石能让遇险的人隐去身形。她安全地从使臣眼前消失，这才温和地责备他太无情。
    - id: ch05
      title: 追兵与背叛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 与此同时，戴三角帽的上将派首相的常任信使草靴话匣子杰克回宫禀报，说公主和使臣已经登上松鼠岛。只是上将不熟悉那里的情形，担心岛上藏着设伏的敌人，贸然登陆会被俘虏，所以暂时还没有追上去。国王和王后听见女儿的消息，立刻欣喜若狂。国王命人取来一部大得惊人的书，每一页都有八厄尔长。
        - id: ch05-b02
          speaker: narrator
          text: 那本书出自一位极聪明的仙女，记载着全世界的情形。国王很快查明，松鼠岛根本无人居住。
        - id: ch05-b03
          speaker: king
          text: 去告诉上将，立刻登陆。他竟然没有早点上岸，实在叫我惊讶。
        - id: ch05-b04
          speaker: narrator
          text: 杰克把消息带回舰队，众人便声势浩大地做好作战准备，连公主都听见了。她马上飞奔去保护恋人。范法罗纳德并不勇敢，很乐意躲在她的保护之下。
        - id: ch05-b05
          speaker: princess
          text: 你站到我身后。我举起红宝石，我们就不会被人看见。我再用父王的匕首护住你，不让敌人靠近。
        - id: ch05-b06
          speaker: narrator
          text: 士兵们登上松鼠岛，向四处张望，却什么人也看不见。隐去身形的公主守在范法罗纳德身前，用匕首逐个碰了他们一下。他们一挨到匕首就失去知觉，接二连三倒在沙滩上。最后，上将终于看出岛上有魔法，急忙命人吹响撤退号，把剩下的士兵乱哄哄地带回船上。
        - id: ch05-b07
          speaker: narrator
          text: 岛上又只剩公主和范法罗纳德。使臣暗中盘算，只要除掉公主，夺走红宝石和匕首，自己便能逃走。两人沿悬崖往回走时，他突然猛推公主，想让她跌进海里。
        - id: ch05-b08
          speaker: narrator
          text: 可公主闪得太快。范法罗纳德反而失去平衡，一头栽下悬崖，像铅块一样沉入海底，从此再没有消息。公主仍惊恐地望着他沉没的地方，头顶忽然传来一阵呼啸。
        - id: ch05-b09
          speaker: narrator
          text: 她抬头看见两辆战车从相反方向疾驰而来。一辆光辉灿烂，由天鹅和孔雀牵引，车上的仙女美得像一道阳光。另一辆由蝙蝠和渡鸦牵着，里面坐着一个骇人的小侏儒。她穿着蛇皮，头上顶着大癞蛤蟆当风帽。两辆车在半空轰然撞到一起。
        - id: ch05-b10
          speaker: narrator
          text: 美丽仙女挺起金矛，丑陋侏儒挥舞锈长枪，一场恶战就此展开。公主屏住呼吸，焦急地望着。很快，美丽仙女明显占了上风。侏儒掉转蝙蝠的脑袋，狼狈地扑闪着逃走。仙女降到公主身边，微笑着开口。
        - id: ch05-b11
          speaker: fifth_fairy
          text: 你看，公主，我已经把恶毒的老卡拉博斯彻底击退。只因为你在二十年期满前四天离开高塔，她竟想永远控制你。现在，她那无理的要求已经由我解决了。愿你从今以后幸福，好好享受我替你赢来的自由。
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: 公主由衷地向她道谢。
    - id: ch06
      title: 自由与婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 仙女派一只孔雀飞回王宫，替五月花取一件华丽长袍。公主确实需要新衣，她原来的裙袍已经被荆棘撕成碎片。另一只孔雀则去通知上将，现在可以放心登陆。上将立刻领着所有士兵上岛，连话匣子杰克也跟了来。杰克经过烤着上将晚餐的烤肉叉，顺手把它一并带上。
        - id: ch06-b02
          speaker: narrator
          text: 戴三角帽的上将先看见金色战车，已经惊讶万分。随后又发现不远处有两位美丽女子在林下散步，更觉得不可思议。他走近认出公主，欢欢喜喜地跪下亲吻她的手。公主把仙女介绍给他，又讲了卡拉博斯怎样终于败退。上将向仙女道谢道贺，仙女对他也十分和蔼。
        - id: ch06-b03
          speaker: fifth_fairy
          text: 我敢说，我闻到了一顿香喷喷的晚餐。
          emotion: happy
        - id: ch06-b04
          speaker: jack
          text: 没错，夫人，就在这里。烤肉叉上有野鸡和山鹑，还在滋滋冒油呢。殿下愿不愿尝一点？
        - id: ch06-b05
          speaker: fifth_fairy
          text: 当然愿意。公主也一定很想好好吃上一顿。
        - id: ch06-b06
          speaker: narrator
          text: 上将派人回船取来需要的一切，众人就在树下快快乐乐地饱餐一顿。吃完时，孔雀已经替公主带回长袍。仙女亲手为她穿上。长袍用绿金锦缎制成，上面绣满珍珠和红宝石。公主的金色长发由一串串钻石和祖母绿束在脑后，头上还戴着花冠。
        - id: ch06-b07
          speaker: narrator
          text: 仙女让公主坐在自己身边，乘金色战车来到上将的船上。临别前，她托公主替自己向王后送上许多亲切问候，还叫她告诉王后，自己就是洗礼那天到场的第五位仙女。
        - id: ch06-b08
          speaker: narrator
          text: 礼炮一齐轰鸣，舰队拔锚启程，不久便回到港口。国王和王后早已在那里等候女儿。他们见她平安回来，又是欢喜，又是疼爱，一刻不停地同她说话，害得公主连一句也插不进来。她本想告诉父母，自己多么后悔跟那个懦弱无能的使臣私奔，却一直没有机会开口。不过说到底，这件事准是卡拉博斯的过错。
        - id: ch06-b09
          speaker: narrator
          text: 就在这个幸运的时刻，梅林国王的儿子竟亲自来到了这里。他迟迟等不到使臣送回消息，心里越来越不安，便带上一千名骑兵，又带了三十名身穿金红制服的贴身卫士，组成一支十分华丽的队伍，亲自前来查明究竟发生了什么。
        - id: ch06-b10
          speaker: narrator
          text: 王子比范法罗纳德英俊一百倍，也勇敢一百倍。五月花一见他，便发现自己非常喜欢这位真正的王子。于是，婚礼当场举行。仪式的场面盛大极了，随后的欢庆也热烈极了。到了最后，每个人都沉浸在喜悦里，先前发生过的一切不幸，全被忘得干干净净。
