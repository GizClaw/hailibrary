        timbre: 柔润清晰
        pace: 中等
        pitch: 中高
    carabosse:
      display_name: 卡拉博斯仙女
      tts:
        delivery: 尖刻恶毒，带着嘲弄意味
        timbre: 粗哑干涩
        pace: 稍快
        pitch: 高
    fifth_fairy:
      display_name: 第五位仙女
      tts:
        delivery: 从容仁慈，话语坚定
        timbre: 明净温暖
        pace: 舒缓
        pitch: 中高
    princess:
      display_name: 五月花公主
      tts:
        delivery: 真挚明快，情感热烈而年轻
        timbre: 清亮柔美
        pace: 中等偏快
        pitch: 中高
    nurse:
      display_name: 乳母
      tts:
        delivery: 忠厚关切，带着长辈的谨慎
        timbre: 温厚柔和
        pace: 中等偏慢
        pitch: 中等
    fanfaronade:
      display_name: 范法罗纳德
      tts:
        delivery: 起初殷勤浮夸，受挫后冷酷暴躁
        timbre: 圆润有力
        pace: 中等
        pitch: 中等
    boatman:
      display_name: 老船夫
      tts:
        delivery: 朴实胆怯，说话干脆
        timbre: 苍老沙哑
        pace: 偏慢
        pitch: 低
    prime_minister:
      display_name: 首相
      tts:
        delivery: 谨慎恭敬，措辞周全
        timbre: 沉稳清晰
        pace: 中等偏慢
        pitch: 中低
    admiral:
      display_name: 海军上将
      tts:
        delivery: 洪亮果断，带着军人的急脾气
        timbre: 粗犷有力
        pace: 稍快
        pitch: 中低
    townsman_1:
      display_name: 百姓甲
      tts:
        delivery: 热情直率
        timbre: 明亮
        pace: 中等
        pitch: 中等
    townsman_2:
      display_name: 百姓乙
      tts:
        delivery: 热情爽朗
        timbre: 清脆
        pace: 中等
        pitch: 中高
    townsman_3:
      display_name: 百姓丙
      tts:
        delivery: 热情响亮
        timbre: 饱满
        pace: 中等
        pitch: 中低
    rose:
      display_name: 白玫瑰
      tts:
        delivery: 轻柔怜悯，像微风里的低语
        timbre: 纤细清甜
        pace: 舒缓
        pitch: 高
