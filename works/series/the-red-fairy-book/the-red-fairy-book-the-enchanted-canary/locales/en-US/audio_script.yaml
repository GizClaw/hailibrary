  chapters:
    - id: ch01
      title: I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, when King Cambrinus ruled, one of his lords lived at Avesnes. He was the finest man in Flanders, if by finest you mean fattest. He ate four meals each day, slept for twelve hours, and spent his waking time shooting arrows at little birds.
        - id: ch01-b02
          speaker: narrator
          text: Practice did not make him a good shot. He grew so heavy that he finally had to stop walking and let people pull him around in a wheeled chair. Everyone laughed and called him Lord Tubby.
        - id: ch01-b03
          speaker: narrator
          text: His only worry was his beloved son, Désiré. Father and son could hardly have looked less alike. The young prince was as thin as a cuckoo. All through his father's lands, young ladies did everything they could to win his heart, but he wanted nothing to do with any of them. Instead of sitting and talking with them at dusk, he left them behind and wandered through the woods, whispering to the moon. They thought him very strange, but that only made them like him more. Because he had been named Désiré at birth, they called him d'Amour Désiré.
        - id: ch01-b04
          speaker: tubby
          text: What is wrong with you? You have a good bed, plenty of food, and barrels of beer. All you need is a wife with broad, rich lands. Then you can grow as fat as a pig and be perfectly happy.
        - id: ch01-b05
          speaker: desire
          text: I would gladly marry, but I have never met a woman I could love. Every girl here is pink and white. I am tired of all those lilies and roses.
        - id: ch01-b06
          speaker: tubby
          text: Good heavens! Do you mean to marry a black woman and give me grandchildren as ugly as monkeys and as foolish as owls?
          emotion: surprised
        - id: ch01-b07
          speaker: desire
          text: No, Father. But somewhere there must be women who are neither pink nor white. I will marry only when I find one who is exactly right for me.
    - id: ch02
      title: II
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Some time later, the prior of Saint Amand sent Lord Tubby a basket of oranges and a beautifully written letter. These golden fruits were new to Flanders, the letter said, and came from a country where the sun always shone. Tubby and Désiré ate them at supper and found them delicious.
        - id: ch02-b02
          speaker: narrator
          text: Dawn had barely begun the next morning when Désiré went down to the stable. He saddled his pretty white horse, dressed himself for a long journey, and went to his father's bedside. Tubby was still in bed, calmly smoking the first pipe of the day.
        - id: ch02-b03
          speaker: desire
          text: Father, I have come to say farewell. Last night I dreamed of a forest where golden apples grew. I opened one, and a lovely princess with golden skin stepped out. She is the wife I want, and I am going to find her.
        - id: ch02-b04
          speaker: narrator
          text: Tubby was so startled that he dropped his pipe on the floor. Then he pictured his son marrying a yellow woman who had been shut inside an orange. The idea struck him as so funny that he roared with laughter. Désiré waited to say goodbye, but his father showed no sign of stopping. At last the prince gently took his hand and kissed it. In a twinkling he was through the door and down the stairs. He sprang lightly onto his horse and had ridden a full mile before Tubby's laughter finally ended.
        - id: ch02-b05
          speaker: tubby
          text: A yellow wife! The boy has lost his mind. Hurry after him and bring him back!
          emotion: surprised
        - id: ch02-b06
          speaker: narrator
          text: The servants rode out at once. Since they did not know which way Désiré had gone, they searched every road but the right one. At nightfall they returned alone, with dusty, exhausted horses.
    - id: ch03
      title: III
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once Désiré was sure no one could catch him, he slowed his horse to a walk. He knew that a long road lay ahead, and he meant to spare the animal's strength. For many weeks they passed one village after another, crossed busy towns, climbed mountains, descended into valleys, and rode over wide plains. All the while Désiré kept moving south, where each day the sun seemed hotter and more brilliant.
        - id: ch03-b02
          speaker: narrator
          text: At last, one evening near sunset, the warmth made him think he must be close to the land from his dream. Just then he reached the corner of a wood. A little hut stood there, and his horse stopped at its door without being told. An old man with a white beard sat on the doorstep enjoying the fresh evening air. Désiré dismounted and politely asked if he might rest there.
        - id: ch03-b03
          speaker: old_man
          text: Come in, young friend. My home is small, but there is room enough for a stranger.
        - id: ch03-b04
          speaker: narrator
          text: The old man served him a simple meal. When Désiré had eaten, his host asked where such a distant traveler was going.
        - id: ch03-b05
          speaker: desire
          text: I will tell you, though you may laugh. I dreamed of an orange grove in the land of the sun. Inside one orange, I am to find the beautiful princess who will be my wife. I have come to search for her.
        - id: ch03-b06
          speaker: old_man
          text: Why would I laugh? A young person's madness can be true wisdom. Follow your dream. Even if you never find the happiness you seek, you will have known the happiness of seeking it.
    - id: ch04
      title: IV
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Désiré rose early the next morning, made ready for the road, and thanked his host before taking leave. The old man did not send him away without help. He told the prince that the forest from his dream truly existed and was not far from the little hut.
        - id: ch04-b02
          speaker: old_man
          text: Follow this road deep into the forest. You will find a great walled park and a castle where a dreadful witch lives. She lets no living creature through her doors. The orange grove lies behind her castle.
        - id: ch04-b03
          speaker: old_man
          text: Walk along the wall until you reach a heavy iron gate. Do not force it. Oil its hinges with this little bottle, and it will open. A huge dog will rush at you with open jaws. Throw him this oatcake. Then give this brush to the giant baker leaning over her hot oven.
        - id: ch04-b04
          speaker: old_man
          text: You will also see a well on your left. Pull up its bucket rope and spread the rope in the sun. Do not enter the castle. Go around it, take three oranges from the grove, and hurry back through the gate. Leave the forest by the far side.
        - id: ch04-b05
          speaker: old_man
          text: Listen carefully. Whatever happens, do not open an orange until you are beside a river or fountain. A princess will come from each one, and you may choose your bride. Once you choose her, never leave her alone. The danger you should fear most is never the one you expect.
    - id: ch05
      title: V
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Désiré thanked the old man warmly and followed the road he had shown him. In less than an hour, the towering wall rose before him. He jumped down, fastened his horse securely to a tree, and walked along until he found the iron gate. Remembering every instruction, he took out the small bottle and carefully oiled the hinges. The heavy gate swung open by itself. Beyond it stood the ancient castle, and Désiré stepped boldly into its courtyard.
        - id: ch05-b02
          speaker: narrator
          text: Without warning, fierce howls broke out. A dog as tall as a donkey charged toward him with its great mouth open. Its eyes were as round as billiard balls, and its bared teeth looked like the prongs of a fork. Désiré did not turn or draw a weapon. He flung the oatcake straight to the beast. The dog snapped it up at once, and while it ate, the young prince passed quietly on.
        - id: ch05-b03
          speaker: narrator
          text: A few yards farther on stood a huge oven with a wide, red-hot mouth. A woman as tall as a giant leaned over the heat. Désiré offered her the brush, and she accepted it without a word. Next he reached the well on his left. He drew up the bucket rope, saw that it was half rotten, and stretched it out carefully in the sunshine. Only then did he go around the castle and plunge into the orange grove. He searched among the branches, chose the three most beautiful oranges he could find, and turned back toward the gate.
        - id: ch05-b04
          speaker: narrator
          text: At once the sun went dark and the ground shook. A voice rang out.
        - id: ch05-b05
          speaker: witch
          text: Baker, seize him by the feet and throw him into your oven!
          emotion: angry
        - id: ch05-b06
          speaker: baker
          text: No. For years I scrubbed this oven with my bare flesh, and you never gave me a brush. He did. Let him pass in peace.
        - id: ch05-b07
          speaker: witch
          text: Rope, wrap yourself around his neck and choke him!
          emotion: angry
        - id: ch05-b08
          speaker: rope
          text: No. You left me in the damp for years until I began to rot. He spread me in the sun. Let him pass in peace.
        - id: ch05-b09
          speaker: witch
          text: Good dog, leap at his throat and devour him!
          emotion: angry
        - id: ch05-b10
          speaker: dog
          text: No. I served you for years, but you never gave me bread. He gave me all I wanted. Let him pass in peace.
        - id: ch05-b11
          speaker: witch
          text: Iron gate, fall on him and crush him into dust!
          emotion: angry
        - id: ch05-b12
          speaker: iron_gate
          text: No. You left me rusting for a hundred years. He oiled my hinges. Let him pass in peace.
    - id: ch06
      title: VI
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Once he was safely outside the gate, Désiré tucked all three oranges into a bag hanging from his saddle. He mounted and rode quickly through the forest, leaving it by the opposite side just as the old man had told him. He longed to see the hidden princesses and watched eagerly for water. Yet hour after hour passed without the smallest river or fountain. He did not lose heart. He believed he had already survived the hardest part of the adventure, and everything left to do would be easy.
        - id: ch06-b02
          speaker: narrator
          text: At noon he entered a sandy plain blazing beneath the sun. Terrible thirst seized him. He lifted his drinking gourd, only to find it empty. In his excitement, he had forgotten to fill it.
        - id: ch06-b03
          speaker: narrator
          text: He struggled onward beneath the fierce sun, trying to master his suffering, but at last he could bear no more. He let himself slide from the saddle and lay beside his horse on the burning ground. His throat felt like fire. His chest rose and fell, and the whole plain seemed to spin around his head. He already felt death drawing near when his eyes settled on the saddlebag, where the bright oranges were peeping out. Poor Désiré had faced every danger to win the lady from his dream, yet at that moment he would have traded all the princesses in the world, pink or golden, for a single drop of water.
        - id: ch06-b04
          speaker: desire
          text: If only these were ordinary oranges, cool and juicy like the ones in Flanders. But perhaps they are. Who can tell?
        - id: ch06-b05
          speaker: narrator
          text: The thought gave him enough strength to sit up. He took out an orange and cut it open. The prettiest little female canary anyone had ever seen flew out.
        - id: ch06-b06
          speaker: canary_1
          text: Please give me a drink. I am dying of thirst.
        - id: ch06-b07
          speaker: desire
          text: Wait. I will find something for you.
        - id: ch06-b08
          speaker: narrator
          text: He was so amazed that he forgot his own thirst and opened a second orange without thinking. Another canary flew free.
        - id: ch06-b09
          speaker: canary_2
          text: Water, please! I am dying of thirst.
        - id: ch06-b10
          speaker: narrator
          text: Désiré understood his mistake too late. The two birds flew away, and his last effort left him senseless on the sand.
    - id: ch07
      title: VII
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When Désiré came to himself, a pleasant coolness lay all around him. Night had fallen while he was unconscious. The sky sparkled with stars, and a heavy dew covered the earth. The fresh damp air gave the traveler back his strength. He climbed onto his horse and rode on through the darkness. At the very first streak of dawn, he saw a stream dancing across his path. He bent over the water and drank his fill.
        - id: ch07-b02
          speaker: narrator
          text: He hardly dared open the final orange. He had disobeyed the old man once. Perhaps the witch had sent his thirst, and perhaps even here beside the stream the princess would not appear. At last, he took his knife and cut the orange open. A third little canary flew out.
        - id: ch07-b03
          speaker: zizi
          text: I am so thirsty. Please give me a drink.
        - id: ch07-b04
          speaker: narrator
          text: Désiré's disappointment was great. Three oranges had produced three birds, and the first two were already lost. This time, however, he was determined not to let the canary escape. He knelt beside the stream, scooped water into the palm of his hand, and held it up to her tiny beak. She had scarcely swallowed before her feathers vanished. In the bird's place stood a beautiful girl, tall and straight as a poplar tree, with shining black eyes and golden skin. Désiré gazed at her in delight. Never in his life had he seen anyone half so lovely.
        - id: ch07-b05
          speaker: narrator
          text: The girl looked quite bewildered by the stream, the open sky, and her own sudden freedom. Still, her eyes were happy, and she showed no fear of the young man who had delivered her. When Désiré asked her name, she told him she was Princess Zizi and was about sixteen years old. For ten of those years, the witch had kept her shut inside an orange in the shape of a canary.
        - id: ch07-b06
          speaker: desire
          text: Then come with me, dear Zizi. Let us hurry away before the wicked witch can reach us.
        - id: ch07-b07
          speaker: zizi
          text: Where will you take me?
        - id: ch07-b08
          speaker: desire
          text: To my father's castle.
        - id: ch07-b09
          speaker: narrator
          text: Désiré mounted and lifted Zizi onto the horse before him. Holding her carefully, he began the journey home.
    - id: ch08
      title: VIII
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: Everything Zizi saw along the road was new to her. As they crossed mountains and valleys and passed through towns, she wanted to know the name and purpose of everything. She asked not one question but a thousand. Désiré never tired of answering. He was charmed by her wonder, for it is a special delight to teach someone you love.
        - id: ch08-b02
          speaker: zizi
          text: What are the girls like in your country?
        - id: ch08-b03
          speaker: desire
          text: They have pink-and-white skin and blue eyes.
        - id: ch08-b04
          speaker: zizi
          text: Do you like blue eyes?
        - id: ch08-b05
          speaker: narrator
          text: Désiré saw a chance to learn what was in her heart, so he said nothing.
        - id: ch08-b06
          speaker: zizi
          text: I suppose one of those girls is waiting to marry you.
        - id: ch08-b07
          speaker: narrator
          text: Again he kept quiet, and Zizi sat up proudly.
        - id: ch08-b08
          speaker: desire
          text: No. Not one of them is beautiful to me. That is why I went searching for a wife in the land of the sun. Tell me, lovely Zizi, was I wrong?
        - id: ch08-b09
          speaker: narrator
          text: Now it was Zizi who gave no answer.
    - id: ch09
      title: IX
      blocks:
        - id: ch09-b01
          speaker: narrator
          text: Talking in this way, they came at last within sight of home. When they were only about four stone-throws from the castle gates, Désiré guided the horse into the forest. There, beside a clear fountain, both travelers dismounted.
        - id: ch09-b02
          speaker: desire
          text: Dear Zizi, we cannot walk into my father's castle like two ordinary people returning from a stroll. A princess deserves ceremony. Wait here. Within an hour I will bring fine carriages and horses for you.
        - id: ch09-b03
          speaker: zizi
          text: Please do not stay away long.
        - id: ch09-b04
          speaker: narrator
          text: Zizi watched him leave with longing eyes until he disappeared among the trees. Then the poor girl began to feel afraid. She was alone for the first time in her life, and this first lonely place was the middle of a thick forest. Suddenly a noise stirred among the trees. Thinking a wolf might be coming, she hurried into the hollow trunk of a willow that leaned over the fountain. The opening was large enough to hide her whole body. She still peeped out to see what had made the sound, and her lovely face appeared in the clear water below.
        - id: ch09-b05
          speaker: narrator
          text: The creature approaching was no wolf, but it was every bit as ugly and wicked.
    - id: ch10
      title: X
      blocks:
        - id: ch10-b01
          speaker: narrator
          text: A family of bricklayers lived not far from the fountain. Fifteen years earlier, the father had been walking through the forest when he found a small gypsy girl who had been abandoned there. He carried her home. His good wife felt sorry for the child and brought her up beside her own sons. As the years passed, the girl became remarkable for her strength and cunning, but not for good sense or beauty. She had a low forehead, a flat nose, thick lips, coarse hair, and skin the color of clay rather than Zizi's gold.
        - id: ch10-b02
          speaker: narrator
          text: People teased her about her complexion until she became noisy and cross as a titmouse, so they called her Titty. Proud and lazy, she hated being sent to fetch water. It was Titty who had frightened Zizi. When she bent over the fountain with her pitcher, she saw Zizi's reflection.
        - id: ch10-b03
          speaker: titty
          text: What a beautiful face! That must be mine. How could anyone call me ugly? I am much too pretty to carry water for them.
        - id: ch10-b04
          speaker: narrator
          text: Titty smashed the pitcher and went home.
        - id: ch10-b05
          speaker: bricklayer
          text: Where is the pitcher?
        - id: ch10-b06
          speaker: titty
          text: You know what people say. A pitcher can go to the well again and again...
        - id: ch10-b07
          speaker: bricklayer
          text: Until it breaks. Very well. Take this bucket instead. It will not break.
        - id: ch10-b08
          speaker: narrator
          text: Back at the fountain, Titty spoke again to Zizi's reflection.
        - id: ch10-b09
          speaker: titty
          text: No. I refuse to be their beast of burden any longer.
        - id: ch10-b10
          speaker: narrator
          text: She hurled the bucket upward, and it lodged in an oak tree.
        - id: ch10-b11
          speaker: titty
          text: A wolf attacked me, so I broke the bucket across its nose.
        - id: ch10-b12
          speaker: narrator
          text: The bricklayer asked nothing more. He took down a broom and beat her until some of her pride was gone. Then he handed her an old copper milk can.
        - id: ch10-b13
          speaker: bricklayer
          text: Bring this back full, or your bones will pay for it.
    - id: ch11
      title: XI
      blocks:
        - id: ch11-b01
          speaker: narrator
          text: Titty set off once more, rubbing her sore sides and nursing a foul temper. After the beating, she did not dare return without water. But filling the old milk can was no easy matter. It was so large and round that it would not go down into the well. She lowered it, twisted it, and tried again and again. By the time she finally forced it beneath the water, her arms were exhausted. She had no strength left to haul it up, and the heavy can slipped away and rolled all the way to the bottom.
        - id: ch11-b02
          speaker: narrator
          text: Titty's miserable face made Zizi burst out laughing. Titty spun around, understood whose reflection she had seen, and decided on revenge.
        - id: ch11-b03
          speaker: titty
          text: What are you doing up there, you lovely thing?
        - id: ch11-b04
          speaker: zizi
          text: I am waiting for the man I love.
        - id: ch11-b05
          speaker: narrator
          text: Zizi had been a canary until very recently and knew nothing of deceit. With complete innocence, she told Titty her whole story, from the orange grove to Désiré's promise to return in state. Titty already knew the prince by sight. She had often watched him pass with a gun over his shoulder when he went out hunting crows. Her rags and ugliness meant he had never once noticed her, but she had admired him from afar, though in her opinion he might have been a little fatter.
        - id: ch11-b06
          speaker: titty
          text: So he likes women with golden skin. My skin is yellow too. If only I could find a way...
        - id: ch11-b07
          speaker: narrator
          text: The way soon came to her.
        - id: ch11-b08
          speaker: titty
          text: They are bringing a grand procession to meet you, and you mean to face all those lords and ladies with your hair loose? Come down, poor child. Let me arrange it properly.
        - id: ch11-b09
          speaker: narrator
          text: Trusting Zizi climbed down. Titty began combing her long brown hair, then pulled a pin from her clothing and drove it into Zizi's head, as a titmouse drives its beak into smaller birds. At the prick, Zizi became a canary and flew away.
        - id: ch11-b10
          speaker: titty
          text: Nicely done. Let us see how clever the prince is at finding his bride.
        - id: ch11-b11
          speaker: narrator
          text: Titty straightened her dress and sat on the grass to wait for Désiré.
    - id: ch12
      title: XII
      blocks:
        - id: ch12-b01
          speaker: narrator
          text: Désiré was racing back, fifty yards ahead of the lords and ladies Tubby had sent to welcome Zizi. When he saw Titty, surprise and horror left him speechless.
        - id: ch12-b02
          speaker: titty
          text: Oh, Désiré, do you not know your poor Zizi? The wicked witch came while you were gone and changed me into this. If you are brave enough to marry me, my beauty will return.
          emotion: sad
        - id: ch12-b03
          speaker: narrator
          text: Titty began to weep bitterly. Désiré was as softhearted as he was brave, and her tears overcame his horror. He told himself that the change was not Zizi's fault. It was his own fault for ignoring the old man's warning and leaving her alone. He also believed the spell depended on him. If marrying her would restore her beauty, he loved her too much to condemn her to remain in that dreadful shape.
        - id: ch12-b04
          speaker: narrator
          text: Désiré presented Titty to the assembled lords and ladies as his beautiful bride under a terrible enchantment. Every courtier pretended to believe the explanation. The ladies immediately brought out the rich garments and jewels they had carried for Zizi and dressed the false princess in them. Then they perched her high on a magnificent ambling horse and started toward the castle. Unfortunately, silk, gold, and jewels only made Titty look uglier. Désiré could not help growing hot and uncomfortable as he rode beside her into the city.
        - id: ch12-b05
          speaker: narrator
          text: Bells pealed and chimes rang as the procession entered Avesnes. People packed the streets, leaned from windows, and stood in every doorway to watch it pass. They could hardly believe their eyes when they saw the strange bride their prince had chosen. Tubby meant to show her the greatest honor, so he came down to meet her at the foot of the great marble staircase. But one look at Titty nearly knocked him backward.
        - id: ch12-b06
          speaker: tubby
          text: What? This is the marvelous beauty you promised us?
          emotion: surprised
        - id: ch12-b07
          speaker: desire
          text: Yes, Father. A wicked sorceress changed her. She cannot become beautiful again until she is my wife.
        - id: ch12-b08
          speaker: tubby
          text: Is that what she says? If you believe it, you may as well drink cold water and pretend it is bacon.
          emotion: angry
        - id: ch12-b09
          speaker: narrator
          text: Yet Tubby adored his son. He gave Titty his hand and led her into the great hall, where the wedding feast waited.
    - id: ch13
      title: XIII
      blocks:
        - id: ch13-b01
          speaker: narrator
          text: The bridal feast was excellent, though Désiré hardly touched a bite. The other guests ate greedily enough to make up for him, and as for Tubby, no shock or sorrow had ever taken away his appetite. At last the moment came to serve the roast goose. The company waited, but the great dish did not appear. A long pause followed. Tubby managed to put down his knife and fork for a little while, then sent his head carver to the kitchen to discover what was wrong.
        - id: ch13-b02
          speaker: narrator
          text: This was what had delayed the meal. In the kitchen, the first goose had been turning nicely on the spit while the head scullion watched it roast. Then a beautiful little canary flew through the warm air and landed on the sill of the open window.
        - id: ch13-b03
          speaker: zizi
          text: Good morning, my fine cook.
        - id: ch13-b04
          speaker: head_scallion
          text: Good morning, lovely golden bird.
        - id: ch13-b05
          speaker: zizi
          text: May Heaven send you to sleep, and may the goose burn so there is none for Titty.
        - id: ch13-b06
          speaker: narrator
          text: The prayer took effect at once. The head scullion fell fast asleep beside the turning spit, while the forgotten goose blackened and burned to a cinder. When he finally woke and saw the ruin, he was horrified. There was no saving the bird, so he hurriedly ordered another goose to be plucked, stuffed with chestnuts, and placed on the spit.
        - id: ch13-b07
          speaker: narrator
          text: When Tubby asked for his meal again, the Master Cook went upstairs to apologize and beg for patience. Tubby answered by scolding his son under his breath.
        - id: ch13-b08
          speaker: tubby
          text: First the boy brings home a penniless hag, and now the goose burns. That is no bride. He has brought Famine herself into my house.
          emotion: angry
    - id: ch14
      title: XIV
      blocks:
        - id: ch14-b01
          speaker: narrator
          text: While the Master Cook was upstairs, the golden canary returned. Another scullion was watching the second goose, and no one had warned him.
        - id: ch14-b02
          speaker: zizi
          text: Good morning, my fine scullion.
        - id: ch14-b03
          speaker: head_scallion
          text: Good morning, lovely golden bird.
        - id: ch14-b04
          speaker: zizi
          text: May Heaven send you to sleep, and may the goose burn so there is none for Titty.
        - id: ch14-b05
          speaker: narrator
          text: The scullion fell fast asleep before the fire, and the second goose burned while he dreamed. When the Master Cook came back downstairs, he found it as black as the kitchen chimney. He flew into a fury and shook the scullion awake. To save himself from taking all the blame, the frightened servant told the whole story of the golden bird and her strange prayer.
        - id: ch14-b06
          speaker: master_cook
          text: That cursed bird will cost me my place. Hide yourselves. If it comes back, catch it and wring its neck.
          emotion: angry
        - id: ch14-b07
          speaker: narrator
          text: The Master Cook put a third goose on the spit, piled the hearth into a huge fire, and took his own place beside it. Other servants hid nearby, ready to spring. Before long the golden bird came for the third time and settled innocently on the window sill.
        - id: ch14-b08
          speaker: zizi
          text: Good morning, my fine cook.
        - id: ch14-b09
          speaker: master_cook
          text: Good morning, lovely golden bird.
        - id: ch14-b10
          speaker: zizi
          text: May Heaven send you to sleep, and may—
        - id: ch14-b11
          speaker: narrator
          text: Before she could finish her prayer, a scullion hidden outside rushed forward and slammed the shutters. The trapped canary darted into the kitchen and flew from corner to corner. Every cook and scullion sprang after her, jumping, shouting, and swatting at her with their aprons. At last one servant closed his hands around the bird. He was just about to wring her neck when Tubby marched into the kitchen, waving his scepter. The hungry lord had come to learn for himself why no roast goose had ever reached his table. At the sight of him, the scullion stopped at once.
    - id: ch15
      title: XV
      blocks:
        - id: ch15-b01
          speaker: tubby
          text: Will someone please explain what is happening here?
          emotion: angry
        - id: ch15-b02
          speaker: head_scallion
          text: Your Excellency, this bird caused it all.
        - id: ch15-b03
          speaker: narrator
          text: The scullion placed the canary in Tubby's hand.
        - id: ch15-b04
          speaker: tubby
          text: Nonsense. What a lovely little bird!
        - id: ch15-b05
          speaker: narrator
          text: As Tubby stroked her head, his fingers found a pin among the feathers. He pulled it free. In an instant, the canary became a beautiful girl with golden skin and sprang lightly to the floor.
        - id: ch15-b06
          speaker: tubby
          text: Good gracious! What a pretty girl!
          emotion: surprised
        - id: ch15-b07
          speaker: desire
          text: Father, it is Zizi! My darling Zizi, how happy I am to have you back!
          emotion: happy
        - id: ch15-b08
          speaker: narrator
          text: Désiré had entered at that very moment and swept Zizi into his arms.
        - id: ch15-b09
          speaker: tubby
          text: Then what about the other one?
        - id: ch15-b10
          speaker: narrator
          text: Titty was quietly creeping toward the door.
        - id: ch15-b11
          speaker: tubby
          text: Stop her! We will decide her case right now.
        - id: ch15-b12
          speaker: narrator
          text: Tubby ordered the servants to catch Titty before she escaped. Then he seated himself solemnly on top of the oven, as if it were a judge's throne, and heard the matter at once. He pronounced Titty guilty and sentenced her to be burned alive. When the judgment was finished, all the lords and all the cooks arranged themselves in two proper lines. With the whole strange court looking on, Tubby formally promised Désiré and the true Princess Zizi to one another.
    - id: ch16
      title: XVI
      blocks:
        - id: ch16-b01
          speaker: narrator
          text: Only a few days later, Désiré and Zizi were married. The celebration drew people from across the countryside. Every country boy came dressed for the occasion, carrying a wooden sword and wearing grand shoulder ornaments cut from gilded paper.
        - id: ch16-b02
          speaker: narrator
          text: Zizi won a pardon for Titty. The girl was sent back to the brickfields while all the boys followed and jeered at her. That, the tale says, is why country boys still throw stones at a titmouse.
        - id: ch16-b03
          speaker: narrator
          text: On the evening of the wedding day, another wonder came over the land. By enchantment, the larders, cellars, cupboards, and tables of every household were loaded with food and drink. The poorest people received the same bounty as the rich. Everywhere there was bread, wine, beer, cakes, tarts, roast larks, and even plenty of geese. At last Lord Tubby had no reason to complain that his son had married Famine.
        - id: ch16-b04
          speaker: narrator
          text: From that time on, the country never lacked good food. And among the fair-haired, blue-eyed women of Flanders, there have always been a few beauties with black eyes and golden skin. They are the descendants of Zizi.
