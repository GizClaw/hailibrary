        pitch: 低
  chapters:
    - id: ch01
      title: 预言与高塔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后有两个漂亮的儿子，还有一个小女儿。小公主十分可爱，谁见了都喜欢。她受洗那天，王后请来所有仙女观礼，仪式之后又摆下盛宴。宴会结束，仙女们正要告辞，王后叫住了她们。
        - id: ch01-b02
          speaker: queen
          text: 先别走呀。请照你们一向的规矩，告诉我罗塞特将来会遇到什么。
        - id: ch01-b03
          speaker: narrator
          text: 小公主的名字正是罗塞特。仙女们却推说把魔法书忘在家里了，改日再来。王后一听，更加不安。
        - id: ch01-b04
          speaker: queen
          text: 唉，我明白了。你们一定看见了不好的事。可无论是什么，至少别瞒着我。
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 仙女们越是推辞，王后越觉得她们一定看见了可怕的事。她不肯让她们就这样离开，一遍又一遍地央求。最后，仙女们实在无法再隐瞒，只好把预言说出来。
        - id: ch01-b06
          speakers: [fairy_1, fairy_2]
          ensemble: duo
          text: 陛下，我们只看见罗塞特会给两个哥哥招来大祸，他们甚至可能因为她丧命。没法告诉您更好的消息，我们实在很难过。
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: 仙女们走后，王后独自伤心，连国王也看出了不对。他问了又问，她先说炉火烧掉了纺锤杆上的亚麻。国王便从阁楼搬下够她纺一百年的亚麻。她还是发愁，又说绿缎子拖鞋掉进河里。国王召来全国的鞋匠，给她做了一万只。可她仍旧愁眉不展，最后竟说自己喝粥时吞下了结婚戒指。国王摊开手，戒指明明就在他的钱袋里。
        - id: ch01-b08
          speaker: old_king
          text: 你没有对我说实话。瞧，你的戒指就在我这里。
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 王后又羞愧又害怕，只好说出仙女的预言，请国王想办法避开灾祸。国王也发起愁来，沉默了很久才开口。
        - id: ch01-b10
          speaker: old_king
          text: 要保住两个儿子的命，恐怕只有趁罗塞特年纪还小，砍掉她的脑袋。
        - id: ch01-b11
          speaker: narrator
          text: 王后听完放声大哭。她说，若一定要有人丧命，她宁可让人砍掉自己的头，也绝不许国王伤害罗塞特。她求国王另想办法，两个人想来想去，却始终没有主意。后来，王后听说城堡附近有一片大森林，林中住着一个老隐士。他把一棵空心树当作家，远近的人遇上难事，都会去向他请教。
        - id: ch01-b12
          speaker: queen
          text: 我去听听他的指点。也许他知道怎样躲过这个预言。
        - id: ch01-b13
          speaker: narrator
          text: 第二天一早，王后骑上一头漂亮的小白骡。骡子的蹄铁是纯金打的，两位侍女骑着骏马跟在后面。进了森林，树木越长越密，坐骑再也无法通行。她们只好下马，一路步行到那棵空心树前。隐士远远看见几个女人走来，脸上很不高兴，因为他一向不喜欢女人。等他认出走在前面的是王后，态度才变得客气起来。
        - id: ch01-b14
          speaker: hermit
          text: 欢迎您，王后。您想来问我什么？
        - id: ch01-b15
          speaker: narrator
          text: 王后讲完预言，隐士告诉她，必须把公主关进一座高塔，永远不许她出来。王后重重酬谢了他，赶回去禀告国王。国王立刻命人建塔，把罗塞特关在里面。为了不让她寂寞，父母和两个哥哥每天都来看她。大哥叫大王子，弟弟叫小王子。他们深爱这个妹妹，因为她又甜美又漂亮，一个微笑便胜过一百枚金币。罗塞特十五岁时，两个哥哥分别问父母，是不是该让妹妹成亲了。父母觉得有趣，却没有回答。
        - id: ch01-b16
          speaker: narrator
          text: 不久，国王和王后一同病倒，又在同一天去世。全国的钟都敲起丧钟，罗塞特尤其悲痛。后来，公爵和大臣扶大王子登上金色宝座，为他戴上钻石王冠。到处开始宴饮庆祝，新国王便和弟弟商量起妹妹的事。
        - id: ch01-b17
          speaker: king
          text: 现在由我们做主了。快把妹妹从阴沉沉的高塔里接出来吧，她在那里早就待够了。
        - id: ch01-b18
          speaker: narrator
          text: 兄弟俩穿过花园，来到孤零零的高塔。罗塞特正在刺绣，一看见他们，立刻拉住国王的手。
        - id: ch01-b19
          speaker: rosette
          text: 早安，亲爱的哥哥。现在你做了国王，求你带我离开这座沉闷的塔吧。我真的一天也不想再待了。
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: 她说着哭了起来。国王吻了她，叫她擦干眼泪，因为他们正是来接她回城堡的。小王子也亮出特意带来的一袋糖果。
        - id: ch01-b21
          speaker: prince
          text: 快走吧，我们离开这座难看的塔。用不了多久，哥哥还会替你办一场盛大的婚礼呢。
        - id: ch01-b22
          speaker: narrator
          text: 罗塞特第一次走进花园，只见鲜花开得到处都是，枝头挂满果实，脚下的草地一片碧绿，喷泉在阳光里闪闪发亮。她一生从未见过这些，惊得一句话也说不出来，只顾四处张望，又跑来跑去采花摘果。她那只叫弗里斯克的小狗浑身碧绿，只有一只耳朵。它在前面汪汪大叫，一会儿跳舞，一会儿翻跟头，把所有人都逗笑了。忽然，弗里斯克钻进一片小树林。罗塞特紧跟过去，看见一只孔雀正迎着阳光展开尾屏。那是她见过的最漂亮的东西，她站在那里，眼睛一刻也舍不得移开。两个哥哥赶来问她为什么这样高兴。她指着孔雀问那是什么，哥哥们告诉她，这是一种有时会被人杀来吃掉的鸟。
        - id: ch01-b23
          speaker: rosette
          text: 什么？这么美的鸟，他们也敢杀来吃？我发誓，我只嫁给孔雀王。等我做了王后，谁也不许吃我的臣民。
          emotion: surprised
        - id: ch01-b24
          speaker: king
          text: 可是，小妹妹，我们到哪里去找孔雀王呢？
        - id: ch01-b25
          speaker: rosette
          text: 陛下，你们愿意到哪里找都行。反正除了孔雀王，我谁也不嫁。
    - id: ch02
      title: 寻找孔雀王
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 兄弟俩把罗塞特接回城堡，也把那只孔雀带了回去，让它每天在她窗外的露台上散步，这样她想看时随时都能看见。宫里的贵妇们纷纷来拜见公主。她们带来漂亮的衣裙和缎带，还有糖果、钻石、珍珠、娃娃和绣花拖鞋。罗塞特教养极好，对每一份礼物都认真道谢。她那一声谢谢说得又甜又美，待人也总是和和气气，所以人人离开时都喜欢上了她。与此同时，两个哥哥却在反复琢磨，世上若真有孔雀王，该去哪里找他。他们先请人给妹妹画了一幅肖像。那画像实在太逼真了，就算画中人忽然开口和你说话，你也不会觉得奇怪。
        - id: ch02-b02
          speaker: king
          text: 既然你非孔雀王不嫁，我们就到广阔的世界里去找他。能找到他，我们当然高兴。我们不在的时候，你要好好照管国家。
        - id: ch02-b03
          speaker: narrator
          text: 罗塞特感谢哥哥们，答应把国家管好。她说自己只会看看孔雀，再逗弗里斯克跳舞，别的什么也不做。兄弟俩带着画像出发，遇见谁都打听孔雀王，可每个人都说不知道。他们走得比世上任何人都远，终于来到金龟子王国。那里嗡嗡作响，国王几乎以为自己要聋了。他拦住一只最体面的金龟子，问起去路。
        - id: ch02-b04
          speaker: beetle
          text: 陛下，孔雀王国离这里还有三万里格。你们可是绕了最远的一条路。
        - id: ch02-b05
          speaker: king
          text: 你怎么会知道？
        - id: ch02-b06
          speaker: beetle
          text: 我们当然熟悉您。每年，我们都要到您的花园住上两三个月呢。
        - id: ch02-b07
          speaker: narrator
          text: 国王和小王子听了，立刻和这只金龟子成了好朋友。大家挽着手一起散步，又坐在一起吃饭。饭后，金龟子领他们四处参观，让他们看这个奇异国度里的种种奇观。这里的东西贵得惊人，哪怕最小的一片绿叶，也要卖一枚金币，有时还不止一枚。随后，兄弟俩告别朋友，照着他指的方向继续赶路。这次他们没有再绕远，没过多久便到了目的地。他们一眼就知道地方对了，因为每棵树上都栖着孔雀，叫声隔着老远也能听见。走进城里，兄弟俩又发现，无论男人还是女人，从头到脚都穿着孔雀羽毛做的衣裳。显然，当地人觉得世上再没有比孔雀羽毛更美的东西。
        - id: ch02-b08
          speaker: narrator
          text: 兄弟俩很快遇见孔雀王。他坐在镶满钻石的金色小马车里，由十二只孔雀拉着飞奔。他有金色鬈发，面色雪白，头戴孔雀羽冠，生得俊美极了。孔雀王看出他们来自异乡，便停下车，召他们上前。
        - id: ch02-b09
          speakers: [king, prince]
          ensemble: duo
          text: 陛下，我们从很远的地方赶来，想请您看一幅美丽的肖像。
        - id: ch02-b10
          speaker: narrator
          text: 兄弟俩从旅行袋里取出妹妹的画像。孔雀王一声不响，看了很久。
        - id: ch02-b11
          speaker: peacock_king
          text: 我真不敢相信，世上会有这么美丽的公主！
          emotion: surprised
        - id: ch02-b12
          speakers: [king, prince]
          ensemble: duo
          text: 她本人比画像还要美一百倍。
        - id: ch02-b13
          speaker: peacock_king
          text: 你们是在拿我寻开心吧。
        - id: ch02-b14
          speaker: prince
          text: 陛下，我哥哥和您一样是一位国王，我是王子。画中是我们的妹妹罗塞特公主。我们来问您愿不愿意娶她。她不但美，心地也善良，我们还会给她一蒲式耳金币作嫁妆。
        - id: ch02-b15
          speaker: peacock_king
          text: 我当然愿意。我会让她幸福，给她想要的一切，也会深深爱她。不过我得先说清楚，要是她没有你们讲的那么美，我就砍掉你们的脑袋。
        - id: ch02-b16
          speakers: [king, prince]
          ensemble: duo
          text: 当然，我们答应。
        - id: ch02-b17
          speaker: peacock_king
          text: 很好。你们现在就进监牢，等公主来到这里。
        - id: ch02-b18
          speaker: narrator
          text: 兄弟俩深信罗塞特本人远胜画像，所以听见这道命令，一点也没有害怕。他们二话不说，跟着人进了监牢，只等妹妹来到孔雀王国。那间牢房并不难熬，他们在里面受到很好的款待。孔雀王还担心客人烦闷，时常亲自来看望他们，陪他们说话。至于罗塞特的画像，早已被送进王宫。孔雀王日日夜夜守在画像旁边，怎么看也看不够。国王和小王子既然暂时不能离开，只好写信给妹妹。他们催她把所有珍宝收拾好，尽快赶来会合，因为孔雀王已经答应婚事，正等着娶她。兄弟俩唯恐罗塞特担心，信中一个字也没有提自己身在监牢。
        - id: ch02-b19
          speaker: narrator
          text: 罗塞特收到信，高兴得在宫里四处奔跑，见到谁都告诉他，孔雀王已经找到了，她马上就要嫁给他。城中礼炮轰鸣，焰火升上天空，人人想吃多少蛋糕和糖果都可以。整整三天，每个来拜访公主的人，都能分到一片果酱面包、一枚夜莺蛋和一些香料葡萄酒。款待过朋友以后，罗塞特把自己的娃娃一一送给大家，又把哥哥的王国托付给城里最有智慧的老人。她嘱咐他们凡事留心，不要随便花钱，要把钱一直存到国王回来，尤其不能忘记喂她的孔雀。安排好一切，她才带着乳母、乳母的女儿和弗里斯克上了路。
    - id: ch03
      title: 海上的背叛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 罗塞特一行登船出海，船上带着一蒲式耳金币，还有多得惊人的衣裙。那些衣裙足够公主穿上十年，哪怕她每天换两件，也怎么都穿不完。起初旅途十分愉快，船在海上向前行驶，大家一路说笑唱歌，谁也没有想到危险已经近了。乳母却暗中打着坏主意。她走到船夫身边，故意用重复的话问他。
        - id: ch03-b02
          speaker: nurse
          text: 你能不能带我们到孔雀王国？能不能？
        - id: ch03-b03
          speaker: boatman
          text: 不能，不能。
        - id: ch03-b04
          speaker: nurse
          text: 你非带我们去不可，一定得去。
        - id: ch03-b05
          speaker: boatman
          text: 快到了，快到了。
        - id: ch03-b06
          speaker: nurse
          text: 你到底带不带我们去？
        - id: ch03-b07
          speaker: boatman
          text: 带，带。
        - id: ch03-b08
          speaker: narrator
          text: 乳母凑到船夫耳边，压低了声音。
        - id: ch03-b09
          speaker: nurse
          text: 你想不想发财？
        - id: ch03-b10
          speaker: boatman
          text: 当然想。
        - id: ch03-b11
          speaker: nurse
          text: 我有个法子，能让你挣到一袋金子。
        - id: ch03-b12
          speaker: boatman
          text: 那正合我的心意。
        - id: ch03-b13
          speaker: nurse
          text: 今晚等公主睡着，你帮我把她扔进海里。她淹死后，我把她的衣裳穿在女儿身上，再带女儿去见孔雀王。他一定很想娶她。我会送你满满一船钻石作酬劳。
        - id: ch03-b14
          speaker: boatman
          text: 这么漂亮的公主，要把她淹死，实在太可惜了！
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: 船夫起初还觉得不忍心，可乳母不断用金子和钻石诱惑他，最后还是说服了他。夜深以后，罗塞特像平常一样沉沉睡去，弗里斯克蜷在床脚自己的小垫子上。恶毒的乳母叫来船夫和女儿，三个人轻轻抬起整张床，连羽毛褥子、床垫、枕头和毯子一起扔进海里，竟然没有惊醒公主。幸好罗塞特的褥子填满了凤凰羽毛。这种羽毛极其稀有，而且永远不会沉进水里。于是整张床稳稳浮在海面，公主就像坐在一条船中，随着海水漂来漂去。过了一会儿，夜风让她觉得很冷。她在床上翻来覆去，终于惊醒了弗里斯克。小狗的鼻子很灵，立刻闻到鳎鱼和鲱鱼就在身旁，便又急又响地叫个不停。它叫醒了附近的鱼群。鱼儿纷纷游到床边，用大脑袋一下一下顶着这张奇怪的小船。
        - id: ch03-b16
          speaker: rosette
          text: 今晚船摇得可真厉害，叫人难受。幸好不是天天这样。
        - id: ch03-b17
          speaker: narrator
          text: 那时，乳母和船夫早已驶出很远。他们听见狗叫，便互相嘲笑。
        - id: ch03-b18
          speakers: [nurse, boatman]
          ensemble: duo
          text: 那只讨厌的小狗和它的女主人，这会儿正在喝海水，祝我们健康呢。快靠岸吧，孔雀王的城就在附近了。
    - id: ch04
      title: 假新娘与死刑期限
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 孔雀王派出整整一百辆马车迎接公主，每辆车都由一种奇异的动物拉着。队伍里有狮子、熊、狼、雄鹿、马、水牛，还有鹰和孔雀。专门给罗塞特预备的马车最特别，由六只蓝猴子牵引。它们会翻跟头，会走绳索，还会许多逗人的把戏。猴子的挽具全用深红色天鹅绒制成，上面缀满金扣。马车后还跟着六十位美丽的贵妇，全是孔雀王亲自挑选的。她们要一路侍候罗塞特，也要在公主觉得烦闷时陪她说话解闷。
        - id: ch04-b02
          speaker: narrator
          text: 乳母把罗塞特最漂亮的衣裙穿在女儿身上，又给她挂满钻石，可她怎么打扮也不好看。她脾气阴沉暴躁，一路抱怨。迎亲的人看清她的脸，个个惊得说不出话。
        - id: ch04-b03
          speaker: nurse_daughter
          text: 还不快点！再不给我拿吃的来，我就把你们的脑袋全砍掉！
          emotion: angry
        - id: ch04-b04
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: 这可糟透了。她不但长得难看，心肠也坏。可怜的国王竟要娶这样的新娘，千里迢迢把她接来，真是不值。
        - id: ch04-b05
          speaker: narrator
          text: 假公主一路把所有人指使得团团转。别人明明没有犯错，她也会抓住谁就扇一记耳光，或是狠狠掐上一把。迎亲队伍实在太长，只能慢慢向王宫前进。乳母的女儿端端正正坐在华丽的马车里，竭力摆出王后的架子。道路两旁，每棵树上都栖着孔雀，等候向未来的新娘致意。它们原本早已商量好，只要公主出现，就一齐高呼美丽的王后万岁。可是等马车来到眼前，它们看清了假新娘的模样，实在忍不住，只好把准备好的颂词换成了另一句话。
        - id: ch04-b06
          speakers: [peacock_1, peacock_2]
          ensemble: duo
          text: 啊，她可真丑！
          emotion: surprised
        - id: ch04-b07
          speaker: nurse_daughter
          text: 卫兵，快把这些敢侮辱我的无礼孔雀全杀掉！
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: 孔雀们笑着飞走了。船夫见事情不妙，悄悄对乳母说。
        - id: ch04-b09
          speaker: boatman
          text: 老朋友，这可不好办。你女儿要是能漂亮一点就好了。
        - id: ch04-b10
          speaker: nurse
          text: 闭嘴吧，蠢货！不然一切都会被你毁掉。
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 这时，有人来禀告孔雀王，公主就要到了。
        - id: ch04-b12
          speaker: peacock_king
          text: 她的哥哥说了实话吗？她真的比画像更美？
        - id: ch04-b13
          speaker: messenger
          text: 陛下，她要是能有画像那么美，也就很好了。
        - id: ch04-b14
          speaker: peacock_king
          text: 说得也是。只要她像画像，我就心满意足了。我们去迎接她吧。
        - id: ch04-b15
          speaker: narrator
          text: 远处传来喧闹声，孔雀王仿佛听见众人喊着她好丑。他还以为大家说的是公主身边的某个侏儒，怎么也没想到说的就是新娘。罗塞特的画像走在队伍最前面，孔雀王在群臣簇拥下跟着画像，急不可耐地等着见她。可一看见乳母的女儿，他顿时勃然大怒，一步也不肯再往前。
        - id: ch04-b16
          speaker: peacock_king
          text: 什么！牢里那两个无赖竟敢这样骗我，要我娶这个可怕的丑八怪？把她关进高塔，她的乳母和带她来的人也一起关进去。至于那两个家伙，我要砍掉他们的脑袋！
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: 国王和小王子以为妹妹已经到了，早早穿戴整齐，等人来召他们迎接。没想到狱卒带着士兵，把他们押进漆黑的地牢。那里全是癞蛤蟆和蝙蝠，水一直淹到脖子。兄弟俩又惊讶又绝望。
        - id: ch04-b18
          speakers: [king, prince]
          ensemble: duo
          text: 这场婚礼真是凄惨。到底出了什么事，他们为什么这样对我们？他们一定是想杀了我们。
          emotion: fearful
        - id: ch04-b19
          speaker: narrator
          text: 三天以后，他们才听到一点消息。孔雀王来到墙外，隔着洞口痛骂他们。
        - id: ch04-b20
          speaker: peacock_king
          text: 你们自称国王和王子，想骗我娶你们的妹妹，其实只是两个连水都不配喝的乞丐！我会好好收拾你们，砍头的剑已经在磨了！
          emotion: angry
        - id: ch04-b21
          speaker: king
          text: 孔雀王，你最好当心。我和你一样，是真正的国王。我有华美的王国、礼服和王冠，还有取用不尽的赤金。你说要砍我们的头，是在开玩笑吗？我们难道偷过你的东西？
          emotion: angry
        - id: ch04-b22
          speaker: narrator
          text: 孔雀王被这番大胆的话镇住了。他一时真想把兄弟俩和乳母那些人全都赶出国境，让事情就此结束。首相却坚决反对。他说，这样的骗局若不惩罚，以后人人都会嘲笑国王。于是他们正式写下罪状，指控兄弟俩冒充王族，还许诺把一位美丽的公主嫁给孔雀王，可等所谓的公主来到眼前，原来只是个丑陋的乡下姑娘。罪状拿到牢里，当着兄弟俩的面宣读。两人立刻高声申辩，说他们讲的句句属实，妹妹确实是一位比白昼还美的公主。如今出了这种事，其中一定藏着一个他们猜不透的秘密。为了证明清白，他们请求孔雀王宽限七天。孔雀王还在气头上，几乎连这点时间也不肯给，最后听了众人再三劝说，才勉强答应。
    - id: ch05
      title: 获救与团圆
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王宫里闹成一团的时候，再说说真正的公主。天色渐渐亮了，罗塞特终于看清四周。她和弗里斯克仍在床上，可床正孤零零漂在大海中央。附近没有船，远处也没有人来救他们。公主和小狗都惊呆了。罗塞特不知道昨夜究竟发生了什么，只觉得自己被整个世界抛下。她哭了一遍又一遍，哭得那么伤心，连水里的鱼儿看了也替她难过。
        - id: ch05-b02
          speaker: rosette
          text: 唉，孔雀王一定改变了主意，不愿娶我，才让人把我扔进海里。可他为什么这样做？我本来会那么爱他，我们也会一起过得很幸福！
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: 她越想越伤心，因为即便到了这一步，她还是忍不住爱着孔雀王。罗塞特和弗里斯克就在海面上起起伏伏，一连漂了两天。海水不断打湿他们，夜风又冷得刺骨，他们冻得浑身发抖，肚子也饿得难受。罗塞特看见水边有几只牡蛎，便伸手捞来，和弗里斯克一人一点分着吃。牡蛎的味道并不好，公主不喜欢，小狗也不喜欢，可他们实在没有别的食物。等到夜色再次落下，四周黑沉沉的，罗塞特越来越害怕。
        - id: ch05-b04
          speaker: rosette
          text: 弗里斯克，求你一直叫吧，别让鳎鱼游过来吃掉我们！
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: 这时，他们已经漂到离岸不远的地方。岸边的小屋里独自住着一个穷老人。他听见狗叫，想到平时绝不会有狗经过这里，立刻猜到有人遇了海难。老人走出门，看见罗塞特和弗里斯克随着海浪漂来漂去。公主向他伸出双手。
        - id: ch05-b06
          speaker: rosette
          text: 好心的老人家，快救救我吧！不然我就要冻死、饿死了！
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: 老人听见她喊得这样凄惨，心里十分怜悯。他赶忙跑回屋，取来一根长长的船钩，又一步步走进海里。海水很快淹到他的下巴，中间有一两次，他差点被浪打倒，险些溺水。老人还是没有回头，最后终于用船钩勾住公主的床，把整张床慢慢拖上岸。罗塞特和弗里斯克重新踩到陆地，高兴得不得了。公主诚心诚意向老人道谢，然后用毯子裹紧身体，赤着一双小脚，小心地走进小屋。老人点起一堆稻草火，让她暖和起来，又从旧箱子里找出亡妻留下的衣裳和鞋子。罗塞特换上这些粗陋的衣物，看上去仍旧美丽动人。弗里斯克也在她面前卖力跳舞，想让她重新开心起来。
        - id: ch05-b08
          speaker: narrator
          text: 老人看见床上的缎子和金饰，知道她出身高贵，便请她放心说出身世。罗塞特讲完一切，想到自己竟是奉孔雀王的命令被扔进海里，又哭了起来。
        - id: ch05-b09
          speaker: old_man
          text: 我的孩子，现在该怎么办呢？你是尊贵的公主，一向吃精美的食物。我这里却只有黑面包和萝卜，实在不合你的口味。要不要我去告诉孔雀王你在这里？他只要见到你，一定愿意娶你。
        - id: ch05-b10
          speaker: rosette
          text: 不！他既然想淹死我，一定是坏人。我们别告诉他。不过，你若有一只小篮子，请送给我吧。
        - id: ch05-b11
          speaker: narrator
          text: 老人给了她一只篮子。罗塞特把篮子系在弗里斯克颈上。
        - id: ch05-b12
          speaker: rosette
          text: 到城里去，找到最好的一口锅，把锅里的东西带回来。
        - id: ch05-b13
          speaker: narrator
          text: 弗里斯克飞快进城。全城最好的晚餐当然在国王那里。它揭开锅盖，把食物全装进篮子，送到公主面前。
        - id: ch05-b14
          speaker: rosette
          text: 现在去食品储藏室，把那里最好的东西都拿来。
        - id: ch05-b15
          speaker: narrator
          text: 小狗又带回白面包、红葡萄酒和各式糖果，篮子重得几乎背不动。孔雀王要吃午饭时，锅和储藏室都空了。群臣惊慌失措，国王气得要命。
        - id: ch05-b16
          speaker: peacock_king
          text: 好吧，没有饭，我自然吃不成。不过你们留心，晚餐一定要多烤些东西。
        - id: ch05-b17
          speaker: narrator
          text: 傍晚，罗塞特又叫弗里斯克去最好的厨房，把烤叉上最香的肉带回来。小狗仍旧溜进王宫厨房，趁厨师转身，拿走刚烤好的肉。它送回去以后，又依照公主的话，把国王晚餐的馅饼和糖果也取走了。孔雀王饿着大半个肚子上床，脾气坏到了极点。第二天、第三天还是一样。整整三天，他每到吃饭时，食物都会神秘消失。
        - id: ch05-b18
          speaker: narrator
          text: 首相终于担心国王会活活饿死，便藏进厨房一个阴暗的角落，眼睛一刻也不离开那口锅。没过多久，他惊讶地看见一只独耳绿毛小狗悄悄溜进来。小狗熟练地揭开锅盖，把里面的东西全倒进颈上的篮子，转身就逃。首相赶忙跟上，一路穿过城镇，亲眼看着它跑进好心老人的小屋。他没有惊动屋里的人，立刻返回王宫，把午饭和晚饭的去向禀告国王。孔雀王听完十分惊讶，决定亲自去看。他带上首相和一队弓箭手赶到小屋，正好撞见老人和公主快要吃完他的饭菜。
        - id: ch05-b19
          speaker: narrator
          text: 孔雀王下令捆住老人、公主和弗里斯克，把他们押回王宫。这时，有人提醒他，今天正是那两个骗子的最后期限。
        - id: ch05-b20
          speaker: peacock_king
          text: 把那两个骗子带来，和这些偷饭菜的贼一起砍头。
        - id: ch05-b21
          speaker: narrator
          text: 老人立刻跪下，请求一点时间把真相讲清。孔雀王听他说话时，见公主哭得可怜，第一次仔细看了看她。等他听见她叫罗塞特，又知道她遭人暗算，被扔进海里，便不顾自己饿得浑身无力，一口气翻了三个跟头，跑过去抱住她。他亲手解开绳索，宣告自己全心全意爱她。
        - id: ch05-b22
          speaker: narrator
          text: 使者奉命去接两位王子。兄弟俩还以为马上就要受刑，满怀悲伤地来到殿上。乳母、她的女儿和船夫也被带来。罗塞特一看见哥哥们，便跑去拥抱他们。三个叛徒扑倒在她脚下，哀求她饶命。孔雀王和公主欢喜极了，宽厚地赦免了他们。好心老人得到重赏，从此住在王宫。孔雀王也竭力补偿兄弟俩受过的折磨，让他们知道自己有多么后悔。
        - id: ch05-b23
          speaker: narrator
          text: 乳母归还了罗塞特的衣裙、珠宝和那一蒲式耳金币。婚礼立刻举行。从此，大家永远幸福地生活在一起，连弗里斯克也不例外。它享尽荣华，此后一生每顿饭吃到最差的东西，也不过是一只鹧鸪的翅膀。
