  chapters:
    - id: ch01
      title: The King's Debt
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Drakestail was a very little duck, and that was how he got his name. Small as he was, he knew exactly what he was doing. He began with nothing and managed to save a hundred crowns.
        - id: ch01-b02
          speaker: narrator
          text: The King of that country spent money as fast as he got it and never saved a thing. When he heard about Drakestail's hundred crowns, he came in person to borrow the whole sum. Drakestail was proud indeed to have the King for his debtor.
        - id: ch01-b03
          speaker: narrator
          text: But one year passed, and then another. The King never paid him back. He did not even think of paying the interest. At last Drakestail grew uneasy and decided to collect the debt himself.
        - id: ch01-b04
          speaker: narrator
          text: One fine morning, he set off looking spruce and fresh. As he walked, he sang his little song.
        - id: ch01-b05
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
    - id: ch02
      title: Friends Along the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, Drakestail met Friend Fox making his rounds.
        - id: ch02-b02
          speaker: fox
          text: Good morning, neighbor. Where are you going so early?
        - id: ch02-b03
          speaker: drakestail
          text: I'm going to the King to collect what he owes me.
        - id: ch02-b04
          speaker: fox
          text: Oh, take me with you!
        - id: ch02-b05
          speaker: narrator
          text: Drakestail thought that a fellow could never have too many friends.
        - id: ch02-b06
          speaker: drakestail
          text: Come along, then. But you'll soon get tired walking on all fours. Make yourself tiny, slip down my throat, and settle inside my gizzard. I'll carry you.
        - id: ch02-b07
          speaker: fox
          text: What a splendid idea!
        - id: ch02-b08
          speaker: narrator
          text: Fox gathered up all his belongings and vanished into Drakestail's gizzard as neatly as a letter going into the post. Drakestail went on, spruce and fresh, singing his song.
        - id: ch02-b09
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
        - id: ch02-b10
          speaker: narrator
          text: Next he came upon Lady Ladder, leaning against her wall.
        - id: ch02-b11
          speaker: ladder
          text: Good morning, my duckling. Where are you marching so boldly?
        - id: ch02-b12
          speaker: drakestail
          text: I'm going to the King to collect what he owes me.
        - id: ch02-b13
          speaker: ladder
          text: Oh, take me with you!
        - id: ch02-b14
          speaker: narrator
          text: Again Drakestail thought that he could never have too many friends.
        - id: ch02-b15
          speaker: drakestail
          text: Come with me. Those wooden legs will soon grow tired. Make yourself tiny, slip down my throat, and join Fox inside my gizzard. I'll carry you.
        - id: ch02-b16
          speaker: ladder
          text: What a happy thought!
        - id: ch02-b17
          speaker: narrator
          text: Ladder quickly packed herself up and went to keep Fox company. Drakestail walked on, as jaunty as ever, quacking his song.
        - id: ch02-b18
          speaker: narrator
          text: A little farther along, he met his dear friend River, wandering quietly in the sunshine.
        - id: ch02-b19
          speaker: river
          text: My dear, where are you going all alone, with your tail curled high above this muddy road?
        - id: ch02-b20
          speaker: drakestail
          text: I'm going to the King, you know, to collect what he owes me.
        - id: ch02-b21
          speaker: river
          text: Oh, take me with you!
        - id: ch02-b22
          speaker: narrator
          text: Drakestail decided there was always room for another friend.
        - id: ch02-b23
          speaker: drakestail
          text: Come along. But you seem to sleep while you walk, so you'll soon be tired. Make yourself tiny, slip down my throat, and settle inside my gizzard. I'll carry you.
        - id: ch02-b24
          speaker: river
          text: Ah, what a happy thought!
        - id: ch02-b25
          speaker: narrator
          text: River gathered up her belongings and went glug, glug, glug into the space between Fox and Ladder. Then Drakestail went on singing.
        - id: ch02-b26
          speaker: narrator
          text: Farther down the road, he found Comrade Wasp's-nest drilling all his wasps.
        - id: ch02-b27
          speaker: wasps_nest
          text: Good morning, Friend Drakestail. Where are we bound, looking so spruce and fresh?
        - id: ch02-b28
          speaker: drakestail
          text: I'm going to the King to collect what he owes me.
        - id: ch02-b29
          speaker: wasps_nest
          text: Oh, take me with you!
        - id: ch02-b30
          speaker: narrator
          text: Once more Drakestail thought that he could never have too many friends.
        - id: ch02-b31
          speaker: drakestail
          text: Come along. Dragging that whole battalion will soon wear you out. Make yourself tiny, go down my throat, and get into my gizzard. I'll carry you.
        - id: ch02-b32
          speaker: wasps_nest
          text: By Jove, that's a fine idea!
        - id: ch02-b33
          speaker: narrator
          text: Wasp's-nest called his troop into line and joined the others. There was hardly any room left, but they all squeezed closer and managed. Drakestail continued toward the capital, still singing as he went.
    - id: ch03
      title: Trouble in the Poultry Yard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Drakestail reached the capital and hurried straight up the High Street. The townspeople stared as he ran past, singing at the top of his voice.
        - id: ch03-b02
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
        - id: ch03-b03
          speaker: narrator
          text: At the palace, he struck the door with the knocker. Knock, knock! The porter put his head through the little gate.
        - id: ch03-b04
          speaker: porter
          text: Who's there?
        - id: ch03-b05
          speaker: drakestail
          text: It's Drakestail. I want to speak to the King.
        - id: ch03-b06
          speaker: porter
          text: Speak to the King? That's easy to say. His Majesty is dining, and he won't be disturbed.
        - id: ch03-b07
          speaker: drakestail
          text: Tell him it's me. He knows very well why I've come.
        - id: ch03-b08
          speaker: narrator
          text: The porter shut the gate and went upstairs. The King had just sat down to dinner with his napkin around his neck and all his ministers beside him.
        - id: ch03-b09
          speaker: king
          text: Good, good! I know what he wants. Let him in, and put him with the turkeys and chickens.
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: The King laughed, and the porter went back downstairs.
        - id: ch03-b11
          speaker: porter
          text: You may come in.
        - id: ch03-b12
          speaker: drakestail
          text: Good! Now I'll see how they dine at court.
        - id: ch03-b13
          speaker: porter
          text: This way. One more step. There you are.
        - id: ch03-b14
          speaker: drakestail
          text: What? You've put me in the poultry yard?
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: Drakestail was terribly vexed.
        - id: ch03-b16
          speaker: drakestail
          text: So that's your game! Just wait. I'll make you receive me. Quack, quack, quack! When shall I get my money back?
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: Turkeys and chickens do not care for strangers who look different from them. When they saw how Drakestail was made and heard him calling out, they glared at him.
        - id: ch03-b18
          speakers: [turkey, chicken]
          ensemble: duo
          text: What is this stranger doing here? What does he want?
        - id: ch03-b19
          speaker: narrator
          text: At last, the whole flock rushed at Drakestail together. They meant to overwhelm the little duck beneath a storm of pecks.
        - id: ch03-b20
          speaker: drakestail
          text: I'm lost! Reynard, Reynard, come out of your earth, or Drakestail's life is of little worth!
          emotion: fearful
        - id: ch03-b21
          speaker: narrator
          text: Fox had been waiting for those words. He sprang out and fell upon the wicked birds. Quick as could be, he tore through the flock. In five minutes, not one bird was left alive.
        - id: ch03-b22
          speaker: narrator
          text: Drakestail was quite content. Once again, he began his song.
        - id: ch03-b23
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
    - id: ch04
      title: The Well and the Furnace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The King was still eating when he heard that same tune. Then the poultry woman came and told him what had happened in the yard. He was terribly annoyed.
        - id: ch04-b02
          speaker: narrator
          text: He ordered his servants to throw that tail of a drake into the well and finish him. They obeyed at once.
        - id: ch04-b03
          speaker: narrator
          text: At the bottom of that deep hole, Drakestail could see no way out. Then he remembered Lady Ladder.
        - id: ch04-b04
          speaker: drakestail
          text: Ladder, Ladder, come out of your hold, or Drakestail's days will soon be told!
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: Ladder was ready. She hurried out and rested her two arms on the rim of the well. Drakestail scrambled up her back and hopped into the yard. There he sang even louder than before.
        - id: ch04-b06
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
        - id: ch04-b07
          speaker: narrator
          text: The King was still at the table, laughing over the trick he thought he had played on his creditor. When he heard Drakestail demanding his money again, his face went pale with rage.
        - id: ch04-b08
          speaker: narrator
          text: He ordered the servants to heat the furnace and throw in that tail of a drake. Surely the creature must be a sorcerer.
        - id: ch04-b09
          speaker: narrator
          text: Soon the furnace was blazing. This time Drakestail was less afraid, because he was counting on his dear friend River.
        - id: ch04-b10
          speaker: drakestail
          text: River, River, outward flow, or to his death must Drakestail go!
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: River rushed out with a roar and poured herself into the furnace. She flooded the fire and everyone who had lit it. Then she swept onward, growling into the palace hall until the water stood more than four feet high.
        - id: ch04-b12
          speaker: narrator
          text: Drakestail happily began to swim. His song rang out louder than ever.
        - id: ch04-b13
          speaker: drakestail
          text: Quack, quack, quack! When shall I get my money back?
    - id: ch05
      title: Drakestail Takes the Throne
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The King remained at the dinner table, certain he had won. When Drakestail's song reached him once more and he learned what had happened, he leaped up and shook his fists in fury.
        - id: ch05-b02
          speaker: king
          text: Bring him here, and I'll cut his throat! Bring him here at once!
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: Two footmen hurried away to fetch Drakestail. As the little duck climbed the grand staircase, he thought they had finally agreed to receive him.
        - id: ch05-b04
          speaker: narrator
          text: But when he entered, the King was as red as a turkey cock. Every minister stood waiting with a sword in hand. Drakestail was terrified. He thought his end had come. Then he remembered his one remaining friend.
        - id: ch05-b05
          speaker: drakestail
          text: Wasp's-nest, Wasp's-nest, charge from the rally, or Drakestail nevermore may rally!
          emotion: fearful
        - id: ch05-b06
          speaker: wasps_nest
          text: Buzz, buzz! Fix bayonets!
        - id: ch05-b07
          speaker: narrator
          text: Brave Wasp's-nest burst out with all his wasps. They flew at the furious King and his ministers and stung their faces fiercely. The men lost their heads. Not knowing where to hide, they all jumped through the window in a jumble and broke their necks on the pavement below.
        - id: ch05-b08
          speaker: narrator
          text: Drakestail stood alone in the great hall, master of the field. He could hardly believe it. Before long, though, he remembered why he had come. He searched for his dear money, pulling open every drawer he could find. It was no use. The King had spent it all.
        - id: ch05-b09
          speaker: narrator
          text: Drakestail went from room to room until he reached the throne room. Tired from the search, he sat on the throne to think over his adventure.
        - id: ch05-b10
          speaker: narrator
          text: Meanwhile, the townspeople had found their King and ministers lying with their feet in the air. They entered the palace to discover what had happened. When the crowd reached the throne room and saw someone already sitting in the royal seat, they cried out in surprise and joy.
        - id: ch05-b11
          speakers: [people_1, people_2, people_3]
          ensemble: chorus
          text: The King is dead! Long live the King! Heaven has sent this ruler down to us!
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: By then, nothing surprised Drakestail. He accepted their cheers as if he had been doing it all his life.
        - id: ch05-b13
          speaker: narrator
          text: A few people did mutter that a Drakestail would make a fine sort of king. But those who knew him answered that a clever Drakestail was worthier than the spendthrift lying on the pavement. So they took the crown from the dead King's head and set it upon Drakestail's. It fitted him like wax.
        - id: ch05-b14
          speaker: narrator
          text: And that was how Drakestail became King.
        - id: ch05-b15
          speaker: drakestail
          text: Now then, ladies and gentlemen, let's go to supper. I'm so hungry!
