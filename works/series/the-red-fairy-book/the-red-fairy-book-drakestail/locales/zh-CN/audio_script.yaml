audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    drakestail:
      display_name: 小鸭尾
      tts:
        delivery: 聪明神气，遇到危险也透着机灵劲儿
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 傲慢暴躁，发怒时蛮横凶狠
        timbre: 厚重威严
        pace: 急促有力
        pitch: 中低
    fox:
      display_name: 狐狸朋友
      tts:
        delivery: 热情爽快，行动时干脆利落
        timbre: 灵活温暖
        pace: 稍快
        pitch: 中等
    ladder:
      display_name: 梯子女士
      tts:
        delivery: 亲切爽朗，说话轻快又实在
        timbre: 轻盈清晰
        pace: 适中
        pitch: 中高
    river:
      display_name: 河流朋友
      tts:
        delivery: 温柔舒缓，声音带着流动感
        timbre: 圆润清澈
        pace: 稍慢
        pitch: 中等
    wasps_nest:
      display_name: 蜂巢战友
      tts:
        delivery: 军人般爽快振奋，号令短促有力
        timbre: 尖亮有嗡鸣感
        pace: 稍快
        pitch: 中高
    porter:
      display_name: 门房
      tts:
        delivery: 公事公办，带着不耐烦的冷淡
        timbre: 干涩清楚
        pace: 适中
        pitch: 中低
    turkey:
      display_name: 火鸡
      tts:
        delivery: 多疑好斗，问话粗声粗气
        timbre: 粗哑浑厚
        pace: 稍快
        pitch: 中低
    chicken:
      display_name: 母鸡
      tts:
        delivery: 多疑好斗，语气尖刻急躁
        timbre: 尖细清脆
        pace: 快
        pitch: 高
    people_1:
      display_name: 市民甲
      tts:
        delivery: 惊喜热烈，欢呼时充满朝气
        timbre: 明亮年轻
        pace: 轻快
        pitch: 中高
    people_2:
      display_name: 市民乙
      tts:
        delivery: 惊喜热烈，声音真诚洪亮
        timbre: 温暖成熟
        pace: 轻快
        pitch: 中等
    people_3:
      display_name: 市民丙
      tts:
        delivery: 稳重直率，赞同时坚定有力
        timbre: 饱满沧桑
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 国王欠下的钱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小鸭尾的个头很小，所以大家才这样叫他。可别因为他小就轻看他。他脑筋灵，做起事来心里也很有数。他原本什么都没有，后来竟一点点攒下了一百克朗。
        - id: ch01-b02
          speaker: narrator
          text: 这个国家的国王特别会花钱，手里从来留不住半个子儿。听说小鸭尾有积蓄，他亲自找上门，把那一百克朗全借走了。小鸭尾能把钱借给国王，心里着实得意。
        - id: ch01-b03
          speaker: narrator
          text: 可一年过去了，两年也过去了，王宫里谁都没提过还钱，连该付的利息也压根儿没人想过。小鸭尾越等越不安，终于决定亲自去见国王，把钱讨回来。一个晴朗的早晨，他打扮得精神利落，唱着歌上路了。
        - id: ch01-b04
          speaker: drakestail
          text: 嘎，嘎，嘎，我的钱几时还给我呀？
    - id: ch02
      title: 路上的四位朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小鸭尾没走多远，就遇见了正在附近转悠的狐狸朋友。
        - id: ch02-b02
          speaker: fox
          text: 早上好，邻居！这么早要去哪里？
        - id: ch02-b03
          speaker: drakestail
          text: 我去找国王，把他欠我的钱讨回来。
        - id: ch02-b04
          speaker: fox
          text: 那带上我吧！
        - id: ch02-b05
          speaker: narrator
          text: 小鸭尾一想，朋友当然越多越好。
        - id: ch02-b06
          speaker: drakestail
          text: 好，你跟我走。不过你用四条腿赶路，很快就会累。把自己变小，顺着我的喉咙钻进胗里，我驮你去。
        - id: ch02-b07
          speaker: fox
          text: 这办法真妙！
        - id: ch02-b08
          speaker: narrator
          text: 狐狸把大包小包一收，嗖地钻了进去，就像一封信投进邮筒，转眼便不见了。小鸭尾又迈开脚步，还是那样精神又神气，还是唱着那支歌。
        - id: ch02-b09
          speaker: drakestail
          text: 嘎，嘎，嘎，我的钱几时还给我呀？
        - id: ch02-b10
          speaker: narrator
          text: 接着，他遇见了倚在墙边的梯子女士。
        - id: ch02-b11
          speaker: ladder
          text: 早上好，我的小鸭子！你这么神气，要去哪里呀？
        - id: ch02-b12
          speaker: drakestail
          text: 我去找国王，把他欠我的钱讨回来。
        - id: ch02-b13
          speaker: ladder
          text: 那也带上我吧！
        - id: ch02-b14
          speaker: narrator
          text: 小鸭尾还是觉得，朋友越多越好。
        - id: ch02-b15
          speaker: drakestail
          text: 来吧。不过你那两条木头腿走不了多远。把自己变小，钻进我的胗里陪狐狸，我带你一起去。
        - id: ch02-b16
          speaker: ladder
          text: 好主意！
        - id: ch02-b17
          speaker: narrator
          text: 梯子收好大包小包，利利索索地钻进去，陪狐狸待在一起。小鸭尾照旧精神抖擞，唱着歌又走了一段路。阳光底下，他那位心爱的河流朋友正安安静静地流淌。
        - id: ch02-b18
          speaker: river
          text: 我的小天使，你翘着尾巴，一个人走在泥路上，这是要去哪里？
        - id: ch02-b19
          speaker: drakestail
          text: 你知道的，我要去找国王讨债。
        - id: ch02-b20
          speaker: river
          text: 把我也带上吧！
        - id: ch02-b21
          speaker: narrator
          text: 小鸭尾觉得，再多一个朋友也装得下。
        - id: ch02-b22
          speaker: drakestail
          text: 那就来吧。可你走起路来像在睡觉，很快就会累。变小一点，钻进我的胗里，我来驮你。
        - id: ch02-b23
          speaker: river
          text: 啊，这个办法好！
        - id: ch02-b24
          speaker: narrator
          text: 河流带上自己的大包小包，咕噜，咕噜，咕噜地钻进去，正好挤在狐狸和梯子中间。小鸭尾又唱起“嘎，嘎，嘎”，继续赶路。
        - id: ch02-b25
          speaker: narrator
          text: 再往前，他看见蜂巢战友正在操练手下的黄蜂。
        - id: ch02-b26
          speaker: wasps_nest
          text: 早上好，小鸭尾朋友！你这样精神，咱们要去哪里？
        - id: ch02-b27
          speaker: drakestail
          text: 我去找国王，把他欠我的钱讨回来。
        - id: ch02-b28
          speaker: wasps_nest
          text: 带我一起去吧！
        - id: ch02-b29
          speaker: narrator
          text: 小鸭尾又想，朋友总不会嫌多。
        - id: ch02-b30
          speaker: drakestail
          text: 好。不过你拖着整支队伍，走一会儿就累了。把自己变小，带着他们钻进我的胗里，我驮你们去。
        - id: ch02-b31
          speaker: wasps_nest
          text: 老天，这主意真不错！
        - id: ch02-b32
          speaker: narrator
          text: 蜂巢一声号令，让队伍向左转，带着所有黄蜂沿同一条路进去和大家会合。小鸭尾的胗里只剩下一点地方，可他们彼此挤紧一些，总算全装下了。小鸭尾又唱着歌，继续朝京城走去。
    - id: ch03
      title: 禽舍和深井
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小鸭尾终于进了京城。他沿着大街一直往王宫跑，边跑边唱他的讨债歌。街上的善良市民从没见过这样的场面，一个个惊奇地回头看他。到了王宫门前，他才停下来，拿起门环敲了两下。
        - id: ch03-b02
          speaker: drakestail
          text: 笃！笃！
        - id: ch03-b03
          speaker: porter
          text: 谁呀？
        - id: ch03-b04
          speaker: narrator
          text: 门房从小窗里探出了头。
        - id: ch03-b05
          speaker: drakestail
          text: 是我，小鸭尾。我要见国王。
        - id: ch03-b06
          speaker: porter
          text: 见国王？你说得倒轻巧。国王正在吃饭，谁也不能打扰。
        - id: ch03-b07
          speaker: drakestail
          text: 你只管告诉他是我来了。我来做什么，他明白。
        - id: ch03-b08
          speaker: narrator
          text: 门房关上小窗，上楼禀报。国王才在餐桌旁坐下，脖子上还系着餐巾，大臣们全陪在身边。
        - id: ch03-b09
          speaker: king
          text: 好，好！我知道他来干什么。放他进来，把他关到火鸡和母鸡那边！
        - id: ch03-b10
          speaker: narrator
          text: 国王笑得很开心。门房下楼，请小鸭尾进去。
        - id: ch03-b11
          speaker: drakestail
          text: 太好了！这下能看看宫里人怎么吃饭了。
        - id: ch03-b12
          speaker: porter
          text: 往这边走。再走一步……好了，你就待在这里。
        - id: ch03-b13
          speaker: drakestail
          text: 什么？这里不是禽舍吗？
        - id: ch03-b14
          speaker: narrator
          text: 小鸭尾气坏了。他本以为自己能去看看宫廷怎样吃饭，没想到却被送进禽舍。他明白国王是在捉弄他，便发誓非让国王接见自己不可，又大声唱起讨债歌。火鸡和母鸡最不喜欢长得和自己不同的家伙。他们围着这个陌生人打量，再听他没完没了地嘎嘎叫，脸色越来越难看。
        - id: ch03-b15
          speakers: [turkey, chicken]
          ensemble: duo
          text: 这是什么东西？他想干什么？
        - id: ch03-b16
          speaker: narrator
          text: 家禽们一齐冲上来，想用尖嘴把小鸭尾活活啄死。他觉得自己完了。幸好，他及时想起了狐狸朋友。
        - id: ch03-b17
          speaker: drakestail
          text: 狐狸呀狐狸，快出洞，不然小鸭尾命要送！
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: 狐狸早就在等这句话。他飞快冲出来，扑向那些凶恶的家禽。只听一阵撕咬，一阵扑腾，还有一片嘎嘎乱叫。不到五分钟，火鸡和母鸡一个也没活下来。小鸭尾看见危险过去，心满意足，又唱起了他的歌。
        - id: ch03-b19
          speaker: drakestail
          text: 嘎，嘎，嘎，我的钱几时还给我呀？
        - id: ch03-b20
          speaker: narrator
          text: 国王还在吃饭。他听见歌声，又听管禽舍的女人讲了院子里的事，顿时恼火极了。他下令把这个鸭尾巴扔进井里，彻底要了他的命。
        - id: ch03-b21
          speaker: narrator
          text: 手下人照办了。井深得吓人，小鸭尾正绝望地想着，这回再也爬不出去了，忽然记起梯子女士。
        - id: ch03-b22
          speaker: drakestail
          text: 梯子呀梯子，快出来，不然小鸭尾命难挨！
          emotion: fearful
        - id: ch03-b23
          speaker: narrator
          text: 梯子也一直等着这句话。她马上从小鸭尾的胗里出来，把两条长胳膊稳稳搭住井沿。小鸭尾顺着她的背麻利地往上爬，轻轻一跃便回到院子。他又唱起来，声音比从前还响。
    - id: ch04
      title: 炉火和最后一位朋友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王仍在餐桌边，还为捉弄了债主暗自发笑。谁知讨债歌又响起来，他气得脸色铁青，立刻叫人把炉火烧旺。他说这个鸭尾巴一定是巫师，非把他扔进火里不可。
        - id: ch04-b02
          speaker: narrator
          text: 炉子很快烧得滚烫。这次小鸭尾没有那么害怕，因为他知道河流朋友一定能帮忙。
        - id: ch04-b03
          speaker: drakestail
          text: 河流呀河流，快涌出，不然小鸭尾要呜呼！
        - id: ch04-b04
          speaker: narrator
          text: 河流一下冲出来，轰地扑进烧得滚烫的炉膛。大水立刻灌满炉子，火灭了，那些负责点火的人也全被淹在水里。接着，她又咆哮着涌进王宫大厅，越涨越高，水深足有四英尺多。
        - id: ch04-b05
          speaker: narrator
          text: 小鸭尾高兴地游起泳来，扯开嗓门唱得震耳欲聋。
        - id: ch04-b06
          speaker: drakestail
          text: 嘎，嘎，嘎，我的钱几时还给我呀？
        - id: ch04-b07
          speaker: narrator
          text: 国王以为这一次肯定得手了。可歌声又一次传来，手下还把发生的事全告诉了他。他猛地从餐桌旁站起来，挥着拳头大发雷霆。
        - id: ch04-b08
          speaker: king
          text: 把他抓来，我亲手割断他的喉咙！快去！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 两个男仆马上跑去抓小鸭尾。小鸭尾跟着他们登上宽阔的楼梯，还以为事情终于有了转机。
        - id: ch04-b10
          speaker: drakestail
          text: 总算肯见我了。
        - id: ch04-b11
          speaker: narrator
          text: 可一进门，他就看见国王的脸红得像只火鸡公。大臣们站在两旁，人人手里举着剑。小鸭尾吓坏了，以为这一次真的活不成了。就在这时，他想起自己还有最后一位朋友。
        - id: ch04-b12
          speaker: drakestail
          text: 蜂巢呀蜂巢，快出征，不然小鸭尾活不成！
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: 局面立刻翻转。勇敢的蜂巢大喊着“嗡，嗡，上刺刀”，带领整支黄蜂队伍冲了出来。他们直扑暴怒的国王和那些举剑的大臣，朝着这些人的脸拼命蜇。国王和大臣被蜇得晕头转向，慌乱中怎么也找不到藏身的地方，竟一个跟着一个跳出窗外，全在下面的石板路上摔断了脖子。
        - id: ch04-b14
          speaker: narrator
          text: 转眼间，宽敞的大厅里只剩下小鸭尾。他大获全胜，却惊讶得怎么也不敢相信。
    - id: ch05
      title: 小鸭尾登上王座
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 过了一会儿，小鸭尾终于想起自己进宫的目的。他趁机寻找那笔钱，把所有抽屉都翻遍了，却什么也没找到。国王早把钱花得一干二净。
        - id: ch05-b02
          speaker: narrator
          text: 小鸭尾一间屋子接一间屋子地搜，最后来到摆着王座的大厅。他实在累了，便坐上王座，慢慢回想一路上的遭遇。与此同时，百姓发现国王和大臣倒在外面的石板路上，一个个双脚朝天。他们弄不明白出了什么事，便一齐涌进王宫寻找答案。
        - id: ch05-b03
          speaker: narrator
          text: 人们走进王座厅，一眼看见王座上已经有人，顿时又惊又喜，齐声欢呼起来。
        - id: ch05-b04
          speakers: [people_1, people_2, people_3]
          ensemble: chorus
          text: 老国王死，新国王立！这是上天赐下的奇迹！
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: 到了这会儿，小鸭尾什么都不觉得稀奇了。他从容地接受欢呼，仿佛一辈子都在当国王。
        - id: ch05-b06
          speaker: narrator
          text: 当然，也有几个人小声议论，让一个小鸭尾坐上王位，这算什么样子？认识他的人马上回答，聪明的小鸭尾远比那个躺在石板路上的败家子配当国王。大家听了，便跑出去取下死去国王的王冠，再把它戴到小鸭尾头上。那顶王冠像蜡做的，贴得严丝合缝。
        - id: ch05-b07
          speaker: narrator
          text: 就这样，小鸭尾成了国王。加冕仪式一结束，他马上宣布了登基后的第一件事。
        - id: ch05-b08
          speaker: drakestail
          text: 好了，女士们，先生们，咱们去吃晚饭吧。我都快饿坏了！
