audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    husband:
      display_name: 丈夫
      tts:
        delivery: 忠厚温和，慌乱时仍带着恳求
        timbre: 成熟朴实
        pace: 适中
        pitch: 中低
    wife:
      display_name: 妻子
      tts:
        delivery: 柔弱忧郁，渴求时急切而真诚
        timbre: 成熟柔和
        pace: 稍慢
        pitch: 中等
    witch:
      display_name: 女巫
      tts:
        delivery: 冷酷强势，发怒和嘲弄时尖刻逼人
        timbre: 苍老锐利
        pace: 稍慢
        pitch: 中低
    rapunzel:
      display_name: 莴苣姑娘
      tts:
        delivery: 纯真柔和，从胆怯逐渐变得坚定
        timbre: 年轻清亮
        pace: 适中
        pitch: 中高
    prince:
      display_name: 王子
      tts:
        delivery: 真挚温柔，悲痛时深沉克制
        timbre: 年轻清朗
        pace: 适中
        pitch: 中等
  chapters:
    - id: ch01
      title: 高墙后的莴苣
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对夫妻一直盼着有个孩子，却怎么也盼不来。两人因此十分苦恼。他们家后墙开着一扇小窗，窗外是一座美丽的花园，鲜花和蔬菜样样都有。可花园四周筑着高墙，谁也不敢进去。园子的主人是一位法力高强的女巫，世上的人都怕她。一天，妻子站在窗前，看见园里有一畦鲜嫩碧绿的莴苣，心里忽然馋得厉害。她明知道自己得不到，想吃的念头却一天比一天强。后来，她脸色苍白，整个人都憔悴了。丈夫看得担心，赶紧问她。
        - id: ch01-b02
          speaker: husband
          text: 亲爱的，你怎么了？哪里不舒服？
        - id: ch01-b03
          speaker: wife
          text: 我要是吃不到屋后花园里的莴苣，恐怕就活不成了。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 丈夫深爱妻子。他想，无论付出什么代价，也不能眼看着她死去。黄昏时，他翻过高墙，匆匆摘了一把莴苣叶，带回家交给妻子。妻子拌成沙拉，吃完只觉得滋味好极了，对这禁物也更加渴望。为了让她安心，丈夫第二天黄昏只好再次翻墙。谁知刚落进园里，他就吓得退了一步。老女巫正站在面前，怒狠狠地盯着他。
        - id: ch01-b05
          speaker: witch
          text: 你好大的胆子！竟敢翻进我的花园，像小偷一样盗走我的莴苣。我要叫你为这莽撞的事付出代价！
          emotion: angry
        - id: ch01-b06
          speaker: husband
          text: 求您原谅我这一次。我实在是没有别的办法。妻子从窗口看见这些莴苣，馋得一天比一天憔悴。要是不能尝上一口，她真的会死。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 女巫听完，怒气稍稍平息了。
        - id: ch01-b08
          speaker: witch
          text: 如果真是这样，你想拿多少莴苣都可以。不过，我有一个条件。你妻子很快会生下孩子，你必须把孩子交给我。我会让孩子平安长大，也会像母亲一样照料她。
        - id: ch01-b09
          speaker: narrator
          text: 男人吓破了胆，只能全部答应。孩子一出生，女巫果然来了。她给女孩取名莴苣姑娘，因为这个名字就是莴苣的意思。随后，她抱走了孩子。
    - id: ch02
      title: 塔顶的歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 莴苣姑娘长成了天底下最美丽的孩子。十二岁那年，女巫把她关进大森林中央的一座高塔。塔上没有楼梯，也没有门，只有最顶上开着一扇小窗。女巫每次想上去，就站在塔下喊她。
        - id: ch02-b02
          speaker: witch
          text: 莴苣姑娘，莴苣姑娘，放下你的金色长发。
        - id: ch02-b03
          speaker: narrator
          text: 莴苣姑娘的头发又细又软，像金丝一样，还长得惊人。听见女巫的呼唤，她便解开辫子，从窗口垂下去。长发落到二十码下的地面附近，女巫就攀着它爬上高塔。
        - id: ch02-b04
          speaker: narrator
          text: 这样的日子过了几年。一天，一位王子骑马经过高塔，忽然听见无比甜美的歌声。他像着了魔一样停下来，静静地听着。那是莴苣姑娘在唱歌。她独自住得寂寞，只能让歌声飘进树林，打发漫长的时光。王子很想见见唱歌的人，可他绕着塔找了又找，始终看不见门，只好回去。那歌声一直留在他心里，于是他每天都来林中聆听。有一天，他藏在树后，看见老女巫走到塔下呼唤。
        - id: ch02-b05
          speaker: witch
          text: 莴苣姑娘，莴苣姑娘，放下你的金色长发。
        - id: ch02-b06
          speaker: narrator
          text: 莴苣姑娘放下辫子，女巫顺着它爬上去了。王子终于明白了其中的秘密。
        - id: ch02-b07
          speaker: prince
          text: 原来这就是上塔的楼梯。那我也去试一试运气。
        - id: ch02-b08
          speaker: narrator
          text: 第二天黄昏，王子来到塔下，照着女巫的话喊道。
        - id: ch02-b09
          speaker: prince
          text: 莴苣姑娘，莴苣姑娘，放下你的金色长发。
        - id: ch02-b10
          speaker: narrator
          text: 长发刚垂下来，王子便攀了上去。
    - id: ch03
      title: 丝线编成的梯子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 莴苣姑娘从来没有见过男人。王子突然出现在眼前，她吓得要命。王子却待她十分温柔，还告诉她，那阵歌声深深打动了他的心。若不能亲眼见到唱歌的人，他就一刻也不能安宁。莴苣姑娘很快不再害怕。王子问她愿不愿意嫁给自己，她立刻答应了。她觉得王子年轻又英俊，跟他在一起，准会比跟老女巫在一起幸福。莴苣姑娘把手放进王子手中。
        - id: ch03-b02
          speaker: rapunzel
          text: 我愿意跟你走。可是，我怎么才能离开高塔呢？以后你每次来看我，都带一绞丝线来。我会把丝线编成梯子。等梯子编好，我就爬下去，再和你一起骑马离开。
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 两人说好，梯子编成以前，王子每天傍晚都来。老女巫白天总陪着莴苣姑娘，所以对这件事毫不知情。直到有一天，莴苣姑娘一时没留神，说漏了嘴。
        - id: ch03-b04
          speaker: rapunzel
          text: 好妈妈，为什么拉您上来要费这么大的劲，拉那位年轻王子却轻松多了？他总是一转眼就到了我身边。
        - id: ch03-b05
          speaker: witch
          text: 你这个坏孩子！你刚才说什么？我还以为已经把你藏得谁也找不到，没想到你还是骗了我！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 女巫怒火中烧，一把抓住莴苣姑娘的长发，在左手上绕了一圈又一圈，右手拿起剪刀。只听咔嚓一声，美丽的辫子落到了地上。女巫还把莴苣姑娘带去荒无人烟的旷野，把她独自扔在那里，让她在孤苦中受尽煎熬。
    - id: ch04
      title: 高塔上的陷阱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就在赶走莴苣姑娘的那天晚上，女巫把剪下的辫子系在窗边的钩子上。王子来到塔下，像往常一样呼唤。
        - id: ch04-b02
          speaker: prince
          text: 莴苣姑娘，莴苣姑娘，放下你的金色长发。
        - id: ch04-b03
          speaker: narrator
          text: 女巫放下辫子。王子照旧爬上去，却没有见到心爱的人。老女巫站在那里，用邪恶而闪亮的双眼盯着他，满脸都是嘲弄。
        - id: ch04-b04
          speaker: witch
          text: 哈，哈！你还以为能见到心上人吗？那只漂亮的小鸟已经飞走，再也不会唱歌了。猫儿捉住了她，还会把你的眼睛也抓出来！你永远失去莴苣姑娘了，再也见不到她！
        - id: ch04-b05
          speaker: narrator
          text: 王子悲痛欲狂，绝望地从高塔上跳了下去。他保住了性命，却落进荆棘丛，尖刺扎瞎了他的双眼。从此，他又盲目又痛苦，只能在树林中流浪，靠草根和浆果充饥。他天天哭泣，哀叹自己失去了心爱的未婚妻。
    - id: ch05
      title: 两滴眼泪
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子在外漂泊了好几年，受尽了苦楚。最后，他来到莴苣姑娘生活的荒野。忽然，一个说不出的熟悉声音传到耳边。他急忙循声走去。等王子来到近前，莴苣姑娘认出了他，扑上去抱住他的脖子，流下眼泪。两滴泪正好落在王子的眼睛上。他的双眼立刻恢复清明，视力和从前一样好了。后来，王子带着莴苣姑娘回到自己的王国。臣民们满怀喜悦地迎接他们。从此，两个人幸福地生活在一起。
