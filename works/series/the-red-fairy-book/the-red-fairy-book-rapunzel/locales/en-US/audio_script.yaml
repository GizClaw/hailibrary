  chapters:
    - id: ch01
      title: The Garden of Rampion
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a good man and his wife lived in great unhappiness because they had no children. At the back of their house was a little window. It looked into the loveliest garden, where every sort of beautiful flower and vegetable grew in abundance. But a high wall surrounded the garden, and no one dared go inside. It belonged to a powerful witch whom the whole world feared.
        - id: ch01-b02
          speaker: narrator
          text: One day, the wife stood at that window and looked down. She saw a bed of the finest rampion. Its leaves were so fresh and green that she longed to taste them. Day after day, the longing grew. She knew she could never get any, and that only made it worse. Soon she was pale and miserable, and seemed to be wasting away. Her husband became alarmed.
        - id: ch01-b03
          speaker: husband
          text: Dear wife, what is wrong with you?
        - id: ch01-b04
          speaker: wife
          text: If I cannot eat some of the rampion from the garden behind our house, I know I shall die.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: The man loved her dearly. He decided that, whatever it cost him, he would fetch the rampion rather than let his wife die. At dusk, he climbed over the wall into the witch's garden. He quickly gathered a handful of leaves and carried them home.
        - id: ch01-b06
          speaker: narrator
          text: His wife made the leaves into a salad. It tasted so good that she wanted the forbidden food more than ever. She could find no peace until her husband agreed to go back for more. So at dusk, he climbed over the garden wall again. The moment he reached the other side, he drew back in terror. The old witch stood before him.
        - id: ch01-b07
          speaker: witch
          text: How dare you climb into my garden and steal my rampion like a common thief! You will suffer for this foolish deed.
          emotion: angry
        - id: ch01-b08
          speaker: husband
          text: Oh, please forgive me. I came only because I had no choice. My wife saw your rampion from our window and wanted it so badly that she would surely have died if she had not tasted it.
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: The witch's anger softened a little.
        - id: ch01-b10
          speaker: witch
          text: If that is true, you may take all the rampion you wish. But I have one condition. You must give me the child your wife will soon bring into the world. No harm will come to the child. I shall care for it like a mother.
        - id: ch01-b11
          speaker: narrator
          text: The man was so frightened that he agreed to everything. As soon as the baby was born, the witch appeared. She named the child Rapunzel, which means rampion, and carried her away.
    - id: ch02
      title: The Tower in the Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rapunzel grew into the most beautiful child under the sun. When she was twelve, the witch shut her inside a tower in the middle of a great wood. The tower had no stairs and no door. High at the very top, there was only one small window.
        - id: ch02-b02
          speaker: narrator
          text: Whenever the old witch wanted to enter, she stood below the window and called up.
        - id: ch02-b03
          speaker: witch
          text: Rapunzel, Rapunzel, let down your golden hair.
        - id: ch02-b04
          speaker: narrator
          text: Rapunzel's wonderful hair was as fine as spun gold. Each time she heard the witch's voice, she loosened her long plaits and dropped them from the window. They fell nearly twenty yards to the ground, and the old witch climbed all the way up by them.
        - id: ch02-b05
          speaker: narrator
          text: Several years passed this way. Then one day, a prince rode through the wood and came near the tower. He heard someone singing so sweetly that he stopped as if under a spell. Rapunzel was singing in her loneliness to help the hours pass, and her lovely voice rang through the trees.
        - id: ch02-b06
          speaker: narrator
          text: The prince longed to see the singer. He searched all around the tower, but there was no doorway anywhere. He rode home, yet the song stayed with him. Every day he returned to the wood and listened.
        - id: ch02-b07
          speaker: narrator
          text: One day, as he waited behind a tree, the old witch approached the tower. He heard her call.
        - id: ch02-b08
          speaker: witch
          text: Rapunzel, Rapunzel, let down your golden hair.
        - id: ch02-b09
          speaker: narrator
          text: Rapunzel lowered her plaits, and the witch climbed up.
        - id: ch02-b10
          speaker: prince
          text: So that is the staircase. Then I will climb it too and see what fortune brings.
        - id: ch02-b11
          speaker: narrator
          text: At dusk the next day, he stood at the foot of the tower and called.
        - id: ch02-b12
          speaker: prince
          text: Rapunzel, Rapunzel, let down your golden hair.
        - id: ch02-b13
          speaker: narrator
          text: As soon as Rapunzel lowered her hair, the prince climbed up.
    - id: ch03
      title: The Prince's Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Rapunzel was terrified when a man entered the window. She had never seen a man before in all her life. But the prince spoke with such kindness that her fear soon faded. He told her that her singing had touched his heart so deeply that he could find no peace until he saw her.
        - id: ch03-b02
          speaker: narrator
          text: Before long, Rapunzel felt at ease with him. When he asked her to marry him, she agreed at once. She thought he was young and handsome, and that she would surely be happier with him than with the old witch. She placed her hand in his.
        - id: ch03-b03
          speaker: rapunzel
          text: Yes, I will gladly go with you. But how can I get down from this tower? Each time you visit, bring me a skein of silk. I will weave them into a ladder. When it is finished, I shall climb down, and you can carry me away on your horse.
        - id: ch03-b04
          speaker: narrator
          text: They agreed that the prince would come every evening until the ladder was ready, because the old woman visited Rapunzel during the day. The witch knew nothing about their plan.
    - id: ch04
      title: The Witch Discovers the Secret
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then one day, Rapunzel spoke without thinking.
        - id: ch04-b02
          speaker: rapunzel
          text: Good mother, why are you so much harder to pull up than the young prince? He reaches me in no time at all.
        - id: ch04-b03
          speaker: witch
          text: You wicked child! What have I just heard? I thought I had hidden you safely from the whole world, yet you have deceived me!
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: In her fury, the witch seized Rapunzel's beautiful hair and wound it around her left hand. With her right hand she took up a pair of scissors. Snip, snap! The hair came off, and the lovely plaits fell to the floor.
        - id: ch04-b05
          speaker: narrator
          text: Worse still, the hard-hearted witch carried Rapunzel away to a lonely desert place. There she abandoned her to a life of misery and solitude.
        - id: ch04-b06
          speaker: narrator
          text: That same evening, the witch tied the cut plaits to a hook beside the tower window. When the prince arrived below, he called as usual.
        - id: ch04-b07
          speaker: prince
          text: Rapunzel, Rapunzel, let down your golden hair.
        - id: ch04-b08
          speaker: narrator
          text: The witch lowered the plaits, and the prince climbed up. Instead of his beloved Rapunzel, he found the old witch staring at him with evil, glittering eyes. She mocked him.
        - id: ch04-b09
          speaker: witch
          text: Ah! You expected to find your beloved, but the pretty bird has flown, and her song is silent. The cat has caught her, and it will scratch out your eyes as well. Rapunzel is lost to you forever. You will never see her again.
        - id: ch04-b10
          speaker: narrator
          text: The prince was overcome with grief. In despair, he threw himself from the tower. He survived the fall, but the thorns below pierced both his eyes.
    - id: ch05
      title: Rapunzel Found Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Blind and miserable, the prince wandered through the wood with no one beside him. He ate nothing but roots and berries, and wept as he mourned the loss of his lovely bride. For several years he roamed in sorrow. At last, he reached the lonely desert place where Rapunzel lived.
        - id: ch05-b02
          speaker: narrator
          text: Suddenly, he heard a voice that seemed strangely familiar. He hurried toward the sound. When he came close, Rapunzel recognized him. She threw her arms around his neck and wept.
        - id: ch05-b03
          speaker: narrator
          text: Two of her tears fell into his eyes. At once, his eyes became clear again, and he could see as well as ever.
        - id: ch05-b04
          speaker: narrator
          text: Then the prince led Rapunzel to his kingdom. They were welcomed there with great joy, and they lived happily ever after.
