audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    father:
      display_name: 父亲
      tts:
        delivery: 犹豫迟疑，说话缺少主见
        timbre: 温厚低沉
        pace: 偏慢
        pitch: 中低
    stepmother:
      display_name: 继母
      tts:
        delivery: 刻薄专横，伪装关切时透着虚假
        timbre: 冷硬尖利
        pace: 适中
        pitch: 中高
    kind_girl:
      display_name: 善良的姑娘
      tts:
        delivery: 温顺真诚，受苦时仍然朴实坚定
        timbre: 年轻清亮
        pace: 适中
        pitch: 中高
    stepsister:
      display_name: 继姐
      tts:
        delivery: 骄纵贪婪，言语粗鲁傲慢
        timbre: 年轻偏尖
        pace: 稍快
        pitch: 高
    dwarf_1:
      display_name: 第一个小矮人
      tts:
        delivery: 公正爽直，说话简洁有力
        timbre: 苍老浑厚
        pace: 稳健
        pitch: 中低
    dwarf_2:
      display_name: 第二个小矮人
      tts:
        delivery: 沉着清楚，带着神秘的庄重
        timbre: 苍老清晰
        pace: 从容
        pitch: 中等
    dwarf_3:
      display_name: 第三个小矮人
      tts:
        delivery: 果断郑重，像在宣布不可更改的命运
        timbre: 苍老明亮
        pace: 稳健
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严端正，面对苦难时温和体恤
        timbre: 成熟洪亮
        pace: 从容
        pitch: 中低
    scullion:
      display_name: 灶房小工
      tts:
        delivery: 朴实谨慎，回答时真诚温和
        timbre: 年轻自然
        pace: 适中
        pitch: 中等
  chapters:
    - id: ch01
      title: 一只漏水的靴子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个男人死了妻子，另有一个女人死了丈夫。两人各有一个女儿，两个姑娘很要好，常在一起玩。一天，女人把男人的女儿叫到跟前。
        - id: ch01-b02
          speaker: stepmother
          text: 去告诉你父亲，我愿意嫁给他。到那时，我让你用牛奶洗脸、喝葡萄酒，我自己的女儿却只配用清水洗脸、喝清水。
        - id: ch01-b03
          speaker: narrator
          text: 姑娘马上回家，把这些话原原本本告诉了父亲。
        - id: ch01-b04
          speaker: father
          text: 这可叫我怎么办？婚姻这回事，要么如意，要么糟糕，谁说得准呢？
        - id: ch01-b05
          speaker: narrator
          text: 他一向拿不定主意，想了又想，最后脱下一只靴子，交给女儿。
        - id: ch01-b06
          speaker: father
          text: 这靴底破了个洞。你把它挂在干草棚的钉子上，再往里灌水。水要是漏不掉，我就再娶。水要是漏了，我就不娶。
        - id: ch01-b07
          speaker: narrator
          text: 姑娘把破靴子挂到干草棚的钉子上，照父亲的话往里倒水。谁知水一浸下去，靴底的破洞竟慢慢合拢，水一直装到了靴口。她赶忙去报告结果。父亲起身亲眼察看，知道没有弄错，只好认命。他向寡妇求婚，两人很快结成夫妻。
        - id: ch01-b08
          speaker: narrator
          text: 婚后第一个早晨，男人的女儿果真有牛奶洗脸，还有葡萄酒喝。女人的女儿却只有清水。第二天，男人的女儿也只得到清水。第三天，两人的待遇完全倒了过来。从那以后，继女天天只能用清水，继母自己的女儿却享用牛奶和葡萄酒。
        - id: ch01-b09
          speaker: narrator
          text: 继母打心眼里恨这个姑娘，处处叫她难受。继女越长越美，也越惹人喜爱，自己的女儿却又丑又讨人嫌。继母看在眼里，嫉妒得不得了。
    - id: ch02
      title: 白雪里的草莓
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一个滴水成冰的冬日，山谷和山岭全被大雪盖住。继母用纸做成一条裙子，拿到继女面前。
        - id: ch02-b02
          speaker: stepmother
          text: 穿上它，到树林里去。没有采满一篮草莓，不许回来！
        - id: ch02-b03
          speaker: kind_girl
          text: 老天啊，冬天根本不长草莓。土地都冻硬了，雪也盖住了一切。外面冷得呼出的气都要结冰，风会钻透纸裙子，荆棘也会把它撕破。您怎么能让我这样出去呢？
        - id: ch02-b04
          speaker: stepmother
          text: 你还敢顶嘴！马上走，篮子装不满草莓，就别让我再看见你！
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 继母只扔给她一块又干又硬的面包皮，说这些足够她吃一整天。她暗暗盼着姑娘在外面又冻又饿，就此送命，从此再也不用为她烦心。
        - id: ch02-b06
          speaker: narrator
          text: 姑娘一向听话，只得穿上纸裙子，挎着篮子走进茫茫白雪。四下连一根绿草也没有。到了树林深处，她看见一幢小屋，三个小矮人正在里面朝外张望。
        - id: ch02-b07
          speaker: narrator
          text: 姑娘先向三个小矮人问好，再规规矩矩地轻轻敲门。听见他们请自己进去，她才走进屋，坐到炉边的凳子上。她只想烤暖冻僵的身子，再吃掉那点可怜的早饭。
        - id: ch02-b08
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: 能分一点吃的给我们吗？
        - id: ch02-b09
          speaker: kind_girl
          text: 当然可以，我们一人一半吧。
        - id: ch02-b10
          speaker: narrator
          text: 她掰开最后一块面包，分给他们一半。小矮人问她，为什么大冬天只穿着薄薄的纸裙子出来。
        - id: ch02-b11
          speaker: kind_girl
          text: 他们叫我采一篮草莓。要是不带草莓回去，我就不能进家门。
        - id: ch02-b12
          speaker: narrator
          text: 姑娘吃完面包，小矮人递给她一把扫帚，请她扫掉后门外的积雪。她刚出去，三个人就商量该怎样奖赏她。这个姑娘又善良又可爱，连仅有的面包也肯分给他们。
        - id: ch02-b13
          speaker: dwarf_1
          text: 愿她一天比一天美丽。
        - id: ch02-b14
          speaker: dwarf_2
          text: 愿她一开口，就有一枚金币从嘴里落下。
        - id: ch02-b15
          speaker: dwarf_3
          text: 愿一位国王前来，娶她做王后。
        - id: ch02-b16
          speaker: narrator
          text: 姑娘还在后门扫雪。雪层一打开，下面竟露出一堆堆鲜美熟透的草莓。深红的果子映着白雪，鲜亮极了。她高兴地采满篮子，谢过小矮人的好意，又同三个人一一握手告别，匆匆赶回家，把继母要的东西送去。
        - id: ch02-b17
          speaker: kind_girl
          text: 晚上好！
        - id: ch02-b18
          speaker: narrator
          text: 话音才落，一枚金币就从她嘴里掉下来。她讲起树林里的经过，每说一个字，便落下一枚金币，很快铺满了房间。
        - id: ch02-b19
          speaker: stepsister
          text: 她这样到处乱吐金币，看来钱倒比脑子多！
        - id: ch02-b20
          speaker: narrator
          text: 继姐嘴上讥讽，心里却嫉妒得发酸，也非要进树林采草莓不可。
        - id: ch02-b21
          speaker: stepmother
          text: 我的宝贝，外面冷得厉害，你会冻死的。
        - id: ch02-b22
          speaker: narrator
          text: 女儿纠缠不休，母亲只好答应。她给女儿披上漂亮的毛皮斗篷，又带足黄油面包和糕饼，这才放她上路。
    - id: ch03
      title: 三个诅咒
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 继姐径直来到林中小屋，三个小矮人仍和先前一样，在窗口向外张望。她看见他们却理也不理，连一句“请问”或“劳驾”也没有，便气势汹汹地闯进屋，坐在炉火旁大吃黄油面包和糕饼。
        - id: ch03-b02
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: 请分一点吃的给我们吧。
        - id: ch03-b03
          speaker: stepsister
          text: 不给！这些还不够我吃呢，我才不会分给你们。
        - id: ch03-b04
          speaker: narrator
          text: 她吃完以后，小矮人指了指一旁的扫帚。
        - id: ch03-b05
          speakers: [dwarf_1, dwarf_2, dwarf_3]
          ensemble: chorus
          text: 拿上扫帚，把我们后门外的雪清一清吧。
        - id: ch03-b06
          speaker: stepsister
          text: 想得美！你们自己去扫，我可不是你们的仆人。
        - id: ch03-b07
          speaker: narrator
          text: 她等不到礼物，便气冲冲地走了。三个小矮人看透了她的坏心肠。这个姑娘又贪婪又恶毒，别人交一点好运，她都不肯容忍。于是，他们也为她定下三种命运。
        - id: ch03-b08
          speaker: dwarf_1
          text: 愿她一天比一天丑陋。
        - id: ch03-b09
          speaker: dwarf_2
          text: 愿她每次说话，都有一只癞蛤蟆从嘴里跳出来。
        - id: ch03-b10
          speaker: dwarf_3
          text: 愿她最后死得无比凄惨。
        - id: ch03-b11
          speaker: narrator
          text: 继姐在树林里找了半天，一颗草莓也没见到。她满肚子火气地回了家，刚张嘴要向母亲诉苦，一只癞蛤蟆就跳了出来。人人都恶心得躲着她。
        - id: ch03-b12
          speaker: narrator
          text: 继母气得更加厉害，整天只顾盘算怎样谋害继女，可那姑娘还是一天比一天漂亮。后来，继母架起一口大锅，把一捆毛线放进水里煮。毛线彻底烫透时，她把它搭到可怜的姑娘肩上，又递给她一把斧子。
        - id: ch03-b13
          speaker: stepmother
          text: 到结冰的河上凿个窟窿，把这些毛线洗干净。
        - id: ch03-b14
          speaker: narrator
          text: 姑娘仍旧服从。她凿开冰面，正要把洗过的毛线拧干，一辆华丽的马车经过河边。车里的国王叫马车停下，望着冰上的姑娘。
        - id: ch03-b15
          speaker: king
          text: 姑娘，你是谁？这么冷的天气，你在这里做什么？
        - id: ch03-b16
          speaker: kind_girl
          text: 我只是个穷苦的姑娘，在河水里漂洗毛线。
        - id: ch03-b17
          speaker: narrator
          text: 国王很同情她，又发现她美丽得惊人。
        - id: ch03-b18
          speaker: king
          text: 你愿不愿意跟我一起离开这里？
        - id: ch03-b19
          speaker: kind_girl
          text: 我非常愿意。
        - id: ch03-b20
          speaker: narrator
          text: 姑娘早想离开继母和继姐，也知道那两个人巴不得摆脱她。她登上马车，同国王一道离开冰封的河面。等他们抵达王宫，那里举行了一场无比盛大的婚礼。三个小矮人的话，就这样全都应验了。
    - id: ch04
      title: 河里游来的鸭子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一年后，王后生下一个小王子。继母得知她的好运，带着女儿进宫拜访，索性住了下来。一天，国王出门，周围也没有别人。继母抓住王后的头，继姐抓住她的脚，两人把她拖下床，从窗口扔进下面的河里。
        - id: ch04-b02
          speaker: narrator
          text: 她们让丑陋的继姐躺到王后的床上，再拿被褥把她盖得一点儿也看不见。国王回来，想同妻子说话，继母连忙拦住他。
        - id: ch04-b03
          speaker: stepmother
          text: 轻一点，千万别惊动她！你妻子病得很重，今天必须好好休息。
        - id: ch04-b04
          speaker: narrator
          text: 国王一点也没有怀疑，依言离开，第二天早晨才再来看妻子。可床上的人一开口，嘴里掉出的不是平常那枚金币，而是一只癞蛤蟆。国王惊讶地追问原因，继母只说王后身体虚弱，过不了多久就会恢复正常。
        - id: ch04-b05
          speaker: narrator
          text: 当天晚上，灶房小工看见一只鸭子沿排水沟游来。鸭子从他身边经过，开口唱道。
        - id: ch04-b06
          speaker: kind_girl
          text: 请你告诉我，国王怎么样？他还醒着，还是已入梦乡？
        - id: ch04-b07
          speaker: narrator
          text: 小工没有回答。鸭子便继续问他。
        - id: ch04-b08
          speaker: kind_girl
          text: 我的宾客们，也都睡了吗？
        - id: ch04-b09
          speaker: scullion
          text: 一个也没醒，全都沉沉睡下。
        - id: ch04-b10
          speaker: kind_girl
          text: 那么，我亲爱的宝宝怎么样？
        - id: ch04-b11
          speaker: scullion
          text: 他睡得又香又甜，你尽管放心吧。
        - id: ch04-b12
          speaker: narrator
          text: 鸭子随即变回王后，上楼来到孩子的房间，把摇篮里的宝宝舒舒服服地安顿好。做完这些，她又化作鸭子，沿着排水沟游走。这样的事情接连发生了两个晚上。到了第三晚，她停在灶房小工面前，仔细吩咐他。
        - id: ch04-b13
          speaker: kind_girl
          text: 去告诉国王，请他站在门槛上方，用剑朝我挥三下。
        - id: ch04-b14
          speaker: narrator
          text: 小工依言禀告。国王带着剑来到门口，朝鸭子上方连挥三次。刹那间，鸭子不见了，他的妻子活生生地站在面前，仍像从前一样美丽动人。
    - id: ch05
      title: 自己宣判的命运
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 国王看见妻子失而复得，欢喜极了，却仍把王后悄悄藏起来，一直等到星期日给小王子举行洗礼。洗礼仪式结束以后，他才当着众人的面问道。
        - id: ch05-b02
          speaker: king
          text: 要是有人把另一个人拖下床，再扔进水里，不论被扔的是男人还是女人，凶手该受什么惩罚？
        - id: ch05-b03
          speaker: narrator
          text: 恶毒的老继母毫不迟疑地回答了他。
        - id: ch05-b04
          speaker: stepmother
          text: 应该把凶手塞进钉满尖钉的木桶，再让木桶从山坡一直滚进水里。这才是最合适的下场。
        - id: ch05-b05
          speaker: king
          text: 你已经亲口宣判了自己的命运。
        - id: ch05-b06
          speaker: narrator
          text: 国王命人造好一只内壁钉满尖钉的木桶，把恶毒的继母和她的女儿一同塞了进去。桶盖牢牢钉死，木桶从山坡滚下去，最后掉进河中。这个故事出自《格林童话》。
