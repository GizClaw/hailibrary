audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    brother:
      display_name: 哥哥
      tts:
        delivery: 少年般直率活泼，变成小鹿后仍保留稚气与冲动
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高
    sister:
      display_name: 妹妹
      tts:
        delivery: 温柔善良，面对危险时坚定而勇敢
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
    first_brook:
      display_name: 第一条小溪
      tts:
        delivery: 像流水反复低唱，警告清楚而神秘
        timbre: 清冷轻盈
        pace: 稍慢
        pitch: 高
    second_brook:
      display_name: 第二条小溪
      tts:
        delivery: 像流水反复低唱，警告清楚而神秘
        timbre: 清冷轻盈
        pace: 稍慢
        pitch: 高
    third_brook:
      display_name: 第三条小溪
      tts:
        delivery: 像流水反复低唱，警告清楚而神秘
        timbre: 清冷轻盈
        pace: 稍慢
        pitch: 高
    king:
      display_name: 国王
      tts:
        delivery: 宽厚深情，悲伤时克制沉重
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低
    stepmother:
      display_name: 继母
      tts:
        delivery: 狠毒狡诈，伪装时殷勤急切
        timbre: 干涩阴冷
        pace: 稍快
        pitch: 中低
    stepsister:
      display_name: 继姐
      tts:
        delivery: 嫉妒刻薄，抱怨时尖锐不平
        timbre: 尖细生硬
        pace: 适中
        pitch: 高
    guard_1:
      display_name: 守卫甲
      tts:
        delivery: 忠于职守，回答简短明确
        timbre: 沉稳清晰
        pace: 适中
        pitch: 中低
    guard_2:
      display_name: 守卫乙
      tts:
        delivery: 忠于职守，回答简短明确
        timbre: 朴实清晰
        pace: 适中
        pitch: 中等
    guard_3:
      display_name: 守卫丙
      tts:
        delivery: 忠于职守，回答简短明确
        timbre: 年轻清晰
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 逃进森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一对兄妹。母亲去世以后，他们在继母手下受尽折磨，再也没有过上一天快活日子。这一天，哥哥牵起妹妹的手，终于说出了压在心里的话。
        - id: ch01-b02
          speaker: brother
          text: 自从妈妈不在了，我们连一个时辰的好日子都没有。继母天天打我们，我们一走近，她就把我们踢开。她只给我们又干又硬的面包皮，桌子底下那条狗都比我们强，偶尔还能吃到一两块好东西。要是妈妈知道这些，该多难过啊！妹妹，我们一起离开这里，到外面的世界去吧。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 兄妹俩就这样出发了。他们穿过田野和草地，翻过篱笆，越过沟渠，一刻不停地走了一整天。后来，天空下起了雨。
        - id: ch01-b04
          speaker: sister
          text: 天空在哭，我们的心也在哭。
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: 到了傍晚，他们走进一片大森林。饥饿、赶路和所有的苦难，早已耗尽了两人的力气。他们钻进一棵空心树，很快便沉沉睡去。第二天醒来时，太阳已经升得很高，温暖明亮的光照进树洞。哥哥渴得难受，侧耳听了听。
        - id: ch01-b06
          speaker: brother
          text: 妹妹，我渴得厉害。要是能找到一条小溪，我一定得喝点水。你听，我好像听见水声了。
        - id: ch01-b07
          speaker: narrator
          text: 他跳起来，牵着妹妹去找溪流。可他们不知道，狠心的继母其实是个女巫。她早已发现两个孩子逃走了，便偷偷追进森林，给每一条溪流都施了魔法。没过多久，兄妹俩看见一条小溪。水花在石头上跳跃，闪闪发亮。哥哥刚想俯身喝水，妹妹却听见溪水在低声唱。
        - id: ch01-b08
          speaker: first_brook
          text: 谁喝我的水，就会变老虎！谁喝我的水，就会变老虎！
        - id: ch01-b09
          speaker: sister
          text: 好哥哥，千万别喝！你会变成猛兽，把我撕碎的。
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 哥哥渴得要命，还是忍住了。
        - id: ch01-b11
          speaker: brother
          text: 好吧，我等到了下一眼泉水再喝。
        - id: ch01-b12
          speaker: narrator
          text: 他们又来到第二条小溪。妹妹听见流水仍在反复低唱。
        - id: ch01-b13
          speaker: second_brook
          text: 谁喝我的水，就会变恶狼！谁喝我的水，就会变恶狼！
        - id: ch01-b14
          speaker: sister
          text: 哥哥，这条溪里的水也不能喝！你会变成狼，把我吃掉的。
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 哥哥又忍了一回，可那股干渴越来越难熬。
        - id: ch01-b16
          speaker: brother
          text: 我再坚持一会儿，等到下一条溪。可到了那里，不管你说什么，我都一定要喝。我真的再也忍不住了。
        - id: ch01-b17
          speaker: narrator
          text: 第三条小溪很快出现在眼前。水流奔过去时，妹妹听见了新的警告。
        - id: ch01-b18
          speaker: third_brook
          text: 谁喝我的水，就会变小鹿！谁喝我的水，就会变小鹿！
        - id: ch01-b19
          speaker: sister
          text: 哥哥，再忍一忍，别喝呀！你会变成小鹿，离开我跑掉的。
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: 可哥哥已经跪在溪边，俯下身去。他的嘴唇刚碰到水，整个人便倒在草地上，变成了一只小雄鹿。妹妹望着中了魔法的哥哥，伤心得放声大哭。小鹿也流着泪，凄凉地坐在她身边。哭了许久，妹妹擦去眼泪，对他说。
        - id: ch01-b21
          speaker: sister
          text: 别怕，亲爱的小鹿，我永远不会把你丢下。
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: 她解下金色袜带，系在小鹿颈上，又采来灯心草，编成柔软的绳子，拴在这只金色颈圈上。妹妹牵起哥哥，一直走进森林深处。走了很久很久，他们终于遇见一座空荡荡的小屋。
        - id: ch01-b23
          speaker: sister
          text: 这里没有别人，也许我们可以住下来。
        - id: ch01-b24
          speaker: narrator
          text: 妹妹找来树叶和苔藓，给小鹿铺了一张软床。每天早晚，她都出门采集草根、坚果和浆果，留给自己的同时，也为小鹿带回鲜嫩的青草。小鹿从她手上吃草，在她身边快活地玩耍。晚上，妹妹做过祷告，就把头枕在哥哥背上睡觉。倘若哥哥还是原来的模样，这样的日子真能算得上美满了。
    - id: ch02
      title: 金色颈圈的小鹿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 兄妹俩在森林里住了一段日子。有一天，这个国家的国王带人进森林举行盛大的围猎。号角声、猎犬的吠声，还有猎人们欢快的呼喊，响遍林间。小鹿听着听着，也想跟他们一起奔跑。
        - id: ch02-b02
          speaker: brother
          text: 妹妹，让我出去参加围猎吧！我真的一刻也待不住了。
        - id: ch02-b03
          speaker: narrator
          text: 他一遍遍央求，妹妹终于点了头，却先认真叮嘱他。
        - id: ch02-b04
          speaker: sister
          text: 傍晚一定要回来。我害怕那些凶猛的猎人，会把门锁得紧紧的。你回来就敲门，说：“好妹妹，开开门，哥哥回来啦。”这样我才知道是你。你不出声，我绝不会开门。
        - id: ch02-b05
          speaker: narrator
          text: 小鹿一下蹦了出去。来到自由开阔的天地里，他浑身都舒畅起来。国王和猎人很快发现了这头漂亮的小鹿，立刻追在后面。可他们怎么也赶不上。每次眼看就要捉住它，小鹿便猛地往旁边一跃，钻进灌木丛，转眼没了踪影。天黑以后，它跑回小屋，敲响了门。
        - id: ch02-b06
          speaker: brother
          text: 好妹妹，开开门，哥哥回来啦。
        - id: ch02-b07
          speaker: narrator
          text: 门开了。小鹿跑进屋，在柔软的苔藓床上睡了一夜。第二天早晨，围猎又开始了。号角一响，猎人们“嗬！嗬！”地吆喝起来，小鹿再也安静不下来。
        - id: ch02-b08
          speaker: brother
          text: 妹妹，开门吧，我一定得出去。
        - id: ch02-b09
          speaker: sister
          text: 那你要记牢，天黑前回来，还得念我们约好的暗语。
        - id: ch02-b10
          speaker: narrator
          text: 妹妹放它出了门。国王和猎人再次看见那只戴着金色颈圈的小鹿，全都策马追去。小鹿又快又灵巧，他们追了整整一天，还是抓不到它。可到了傍晚，猎人们渐渐从四周包围过来。其中一人轻轻射伤了小鹿的脚，它只好一瘸一拐，慢慢逃走。那个猎人悄悄尾随，一路跟到了小屋。
        - id: ch02-b11
          speaker: brother
          text: 好妹妹，开开门，哥哥回来啦。
        - id: ch02-b12
          speaker: narrator
          text: 猎人听清了暗语，也看见门一打开，小鹿跑进去，门便马上关了。他牢牢记下这一切，径直回去，把所见所闻全都禀告国王。
        - id: ch02-b13
          speaker: king
          text: 明天，我们再来围猎。
        - id: ch02-b14
          speaker: narrator
          text: 妹妹看见小鹿受伤，吓得厉害。她洗掉脚上的血，用草药把伤处包好。
        - id: ch02-b15
          speaker: sister
          text: 好了，亲爱的。快躺下来歇一歇，让伤口好好长起来。
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: 伤势本来就轻，第二天已经痊愈，小鹿一点也不疼了。林中刚传来围猎的声音，他立刻叫起来。
        - id: ch02-b17
          speaker: brother
          text: 我受不了了，我也得到那里去！这回我会小心，绝不让他们捉住。
        - id: ch02-b18
          speaker: sister
          text: 他们一定会杀了你！到时候，我就会孤零零地留在森林里，世上再没有人陪我。我不能放你走，说什么也不能。
          emotion: sad
        - id: ch02-b19
          speaker: brother
          text: 你要是不让我去，我会活活伤心死的。每次听见号角，我都觉得自己非从这身皮毛里跳出去不可。
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: 妹妹实在没有别的办法，只得沉着一颗心打开门。小鹿却精神十足，欢欢喜喜地冲进森林。国王一看见它，马上吩咐猎人。
        - id: ch02-b21
          speaker: king
          text: 追吧，从现在一直追到傍晚。不过千万当心，不许伤着它。
        - id: ch02-b22
          speaker: narrator
          text: 等太阳落山，国王又叫来那个发现小屋的猎人。
        - id: ch02-b23
          speaker: king
          text: 现在带我去林中那座小屋。
        - id: ch02-b24
          speaker: narrator
          text: 猎人领着国王来到门前。国王照着学来的暗语敲响了门。
        - id: ch02-b25
          speaker: king
          text: 好妹妹，开开门，哥哥回来啦。
        - id: ch02-b26
          speaker: narrator
          text: 门应声打开。国王走进屋，看见一位姑娘站在里面。那是他一生见过的女子中最美的一位。姑娘满以为回来的会是小鹿，看见的却是一个头戴金冠的男人，不由得吃了一惊。国王亲切地看着她，伸出了手。
        - id: ch02-b27
          speaker: king
          text: 你愿意跟我回城堡，做我的妻子吗？
        - id: ch02-b28
          speaker: sister
          text: 我愿意。可是我的小鹿也必须跟我走，我绝不能把它抛下。
        - id: ch02-b29
          speaker: king
          text: 只要你活着，它就永远陪着你，也永远不会缺少任何东西。
        - id: ch02-b30
          speaker: narrator
          text: 这时，小鹿蹦蹦跳跳地回来了。妹妹重新把灯心草绳拴上金色颈圈，手里牵着另一头。国王扶这位孤苦的姑娘上马，大家一起离开森林小屋，回到城堡。那里举行了一场极其盛大的婚礼。小鹿也备受宠爱，可以在王宫花园里随意奔跑。
    - id: ch03
      title: 假王后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 兄妹俩过上幸福富足的生活时，狠毒的继母还以为妹妹早被野兽撕碎，哥哥也在变成小鹿以后叫猎人射死了。等她听说真相，心里只剩下嫉妒和仇恨，日夜想着怎样再给他们降下一场灾祸。她的亲生女儿长得像黑夜一样丑陋，而且只有一只眼睛。这女儿也妒火中烧，埋怨起母亲来。
        - id: ch03-b02
          speaker: stepsister
          text: 这样的好运本来该是我的！当上王后的人也该是我。
          emotion: angry
        - id: ch03-b03
          speaker: stepmother
          text: 闭嘴。等时机到了，我自然会在那里。
        - id: ch03-b04
          speaker: narrator
          text: 过了一段日子，一天，国王外出打猎，王后生下了一个漂亮的小男孩。老女巫觉得机会终于来了。她变成侍女的模样，匆匆闯进王后休养的房间。那时王后还虚弱地躺在床上。
        - id: ch03-b05
          speaker: stepmother
          text: 浴水全都准备好了。洗个澡，您的身体会恢复得快些。我们快走吧，水凉了就不好了。
        - id: ch03-b06
          speaker: narrator
          text: 女巫的女儿也守在近旁。母女俩一起抬起仍很虚弱的王后，把她送进浴室，放进浴盆，然后锁上门逃走。她们早在浴盆底下燃起了熊熊烈火，要把年轻美丽的王后活活闷死。
        - id: ch03-b07
          speaker: narrator
          text: 确信王后已经死去，老女巫便给女儿戴上睡帽，让她躺到王后的床上。她用法术改变女儿的身形和相貌，叫她看起来几乎和王后一模一样。可是，女巫的魔法再强，也变不回女儿缺少的那只眼睛。她只好让女儿侧身躺着，把没有眼睛的那一面压在床上，免得国王看出破绽。
        - id: ch03-b08
          speaker: narrator
          text: 傍晚，国王回到宫中，听说儿子出生，欢喜极了。他坚持马上去妻子床边，看看她身体怎样。老女巫却挡住他，大声阻拦。
        - id: ch03-b09
          speaker: stepmother
          text: 小心，把帷幔拉严！千万别让光照到王后的眼睛。她现在需要彻底安静，不能受一点打扰。
        - id: ch03-b10
          speaker: narrator
          text: 国王只得离开。他丝毫不知道，床上躺着的是个假王后。
    - id: ch04
      title: 午夜的来客
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了午夜，整座宫殿都沉入梦乡。育婴室里，只有保姆独自守着孩子的摇篮。忽然，房门轻轻打开。走进来的不是别人，正是真正的王后。她从摇篮里抱起孩子，让他躺在臂弯里，给他喂了好一阵奶。随后，她拍松小床上的枕头，把婴儿放回去，又仔细掖好四周的被子。
        - id: ch04-b02
          speaker: narrator
          text: 王后没有忘记小鹿。她走到小鹿躺着的墙角，轻轻抚摸它的后背，然后一言不发地离开房间。第二天早晨，保姆问守卫，昨夜可曾看见什么人进入城堡。
        - id: ch04-b03
          speakers: [guard_1, guard_2, guard_3]
          ensemble: chorus
          text: 没有，我们谁也没有看见。
        - id: ch04-b04
          speaker: narrator
          text: 此后许多个夜晚，王后都用同样的方式回来。她始终不开口，保姆也害怕得不敢向别人说起这位深夜来客。又过了一些日子，一天夜里，王后终于说话了。
        - id: ch04-b05
          speaker: sister
          text: 我的孩子可安好？我的小鹿可安好？再来两回，从此我便永远走掉。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 保姆没有回答。等王后消失以后，她马上去见国王，把这些夜晚发生的事全说了出来。
        - id: ch04-b07
          speaker: king
          text: 天哪！你说的是真的吗？今晚，我要亲自守在孩子床边。
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: 傍晚，国王来到育婴室。午夜时分，真正的王后果然再次出现。
        - id: ch04-b09
          speaker: sister
          text: 我的孩子可安好？我的小鹿可安好？再来一回，从此我便永远走掉。
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 她像往常一样抱起孩子，给他喂奶，温柔地疼爱他，随后又消失了。国王生怕惊走她，始终没敢开口。第二天夜里，他再次守在育婴室。
        - id: ch04-b11
          speaker: narrator
          text: 午夜一到，王后第三次出现在他眼前。她望着自己的孩子和小鹿，说出了最后的告别。
        - id: ch04-b12
          speaker: sister
          text: 我的孩子可安好？我的小鹿可安好？今夜来过，从此我便永远走掉。
          emotion: sad
    - id: ch05
      title: 魔法消散
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这一次，国王再也忍耐不住。他从藏身的地方一跃而出，冲到王后身边。
        - id: ch05-b02
          speaker: king
          text: 你不可能是别人，你就是我亲爱的妻子！
          emotion: surprised
        - id: ch05-b03
          speaker: sister
          text: 是的，我就是你亲爱的妻子！
        - id: ch05-b04
          speaker: narrator
          text: 就在她说出这句话的瞬间，王后重新活了过来。她恢复了从前的健康，面颊红润，容貌也依旧美丽。她把狠毒女巫和女巫女儿做下的所有恶事，一件不漏地告诉了国王。
        - id: ch05-b05
          speaker: narrator
          text: 国王立刻派人逮捕母女俩，把她们交给法庭审判。两人都被判处死刑。女巫的女儿被带进森林，让野兽撕成碎片。老女巫则被绑上火刑柱，烈火把她烧成了灰烬。
        - id: ch05-b06
          speaker: narrator
          text: 老女巫刚化成灰，小鹿身上的魔法便解除了。哥哥终于恢复了原来的模样。从此以后，兄妹俩一直过着幸福的生活。
