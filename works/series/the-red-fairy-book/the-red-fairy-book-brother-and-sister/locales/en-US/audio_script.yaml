  chapters:
    - id: ch01
      title: Into the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Brother took Sister by the hand. Since their mother had died, the children had not known one happy hour. Their stepmother beat them every day and kicked them away if they came near her. She gave them nothing to eat but hard, dry crusts, while the dog beneath the table sometimes got a good mouthful.
        - id: ch01-b02
          speaker: brother
          text: Just look at how we live. Even the dog is better off than we are. Oh, if only our dear mother knew! Come with me, Sister. We'll go out into the wide world together.
        - id: ch01-b03
          speaker: narrator
          text: They set off across fields and meadows, over hedges and ditches, and walked all day. When the rain began, Sister looked up sadly.
        - id: ch01-b04
          speaker: sister
          text: Heaven is crying with our hearts.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Toward evening they reached a great forest. Hunger, the long road, and all their sorrow had worn them out. They crawled into a hollow tree and fell fast asleep.
        - id: ch01-b06
          speaker: narrator
          text: By the time they woke the next morning, the sun stood high and shone warm and bright into the tree.
        - id: ch01-b07
          speaker: brother
          text: Sister, I'm terribly thirsty. If I knew where there was a stream, I'd go and drink. Wait, I think I hear one.
        - id: ch01-b08
          speaker: narrator
          text: He sprang up, took her hand, and went looking for the water. But their cruel stepmother was really a witch. She knew the children had run away, and she had followed them in secret and laid a spell on every stream in the forest.
        - id: ch01-b09
          speaker: narrator
          text: Soon the children found a brook dancing and sparkling over the stones. Brother bent eagerly toward it, but Sister heard the water murmur as it hurried by.
        - id: ch01-b10
          speaker: first_brook
          text: Drink from me, and you will become a tiger! Drink from me, and you will become a tiger!
        - id: ch01-b11
          speaker: sister
          text: Oh, Brother, please don't drink! You'll turn into a wild beast and tear me apart.
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Brother was painfully thirsty, but he obeyed her.
        - id: ch01-b13
          speaker: brother
          text: All right. I'll wait until we find the next spring.
        - id: ch01-b14
          speaker: narrator
          text: At the second brook, Sister again heard a warning in the rushing water.
        - id: ch01-b15
          speaker: second_brook
          text: Drink from me, and you will become a wolf! Drink from me, and you will become a wolf!
        - id: ch01-b16
          speaker: sister
          text: Please don't drink here either, Brother! You'll become a wolf and eat me.
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: Once more, Brother went without drinking.
        - id: ch01-b18
          speaker: brother
          text: I'll wait until the next stream. But then I have to drink, no matter what you say. I can't bear this thirst much longer.
        - id: ch01-b19
          speaker: narrator
          text: When they reached the third brook, Sister heard its message as it swept past.
        - id: ch01-b20
          speaker: third_brook
          text: Drink from me, and you will become a roe! Drink from me, and you will become a roe!
        - id: ch01-b21
          speaker: sister
          text: Oh, Brother, not yet! If you drink, you'll become a roe and run away from me.
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: But Brother was already on his knees, leaning over the brook. The moment the water touched his lips, he fell onto the grass as a little roebuck.
        - id: ch01-b23
          speaker: narrator
          text: Sister wept bitterly for her enchanted brother. The little Roe wept too and sat sadly beside her. At last, she spoke to him.
        - id: ch01-b24
          speaker: sister
          text: Don't be afraid, my dear little fawn. I will never leave you.
          emotion: calm
        - id: ch01-b25
          speaker: narrator
          text: She took off her golden garter and tied it around the Roe's neck. Then she gathered rushes, braided them into a soft cord, and fastened it to the collar. Holding the cord, she led him deeper and deeper into the forest.
        - id: ch01-b26
          speaker: narrator
          text: After a very long way, they found a little house. Sister looked inside and saw that it was completely empty, so she thought they might stay and live there. She gathered leaves and moss and made the Roe a soft bed. Every morning and evening, she went out for roots, nuts, and berries for herself, and tender young grass for him. He ate from her hand, played around her, and seemed quite happy.
        - id: ch01-b27
          speaker: narrator
          text: Each night, when Sister was tired, she said her prayers. Then she rested her head on the fawn's back and slept with him for a pillow. If Brother had only been in his own form, it would have been a delightful life.
    - id: ch02
      title: The King's Hunt
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Brother and Sister lived that way for some time. Then the King of the country held a great hunt in the woods. Horns rang out, dogs bayed, and huntsmen shouted with delight. When the little Roe heard all that noise, he longed to join them.
        - id: ch02-b02
          speaker: brother
          text: Oh, Sister, please let me go to the hunt! I can't stay still any longer.
        - id: ch02-b03
          speaker: narrator
          text: He pleaded until Sister finally agreed.
        - id: ch02-b04
          speaker: sister
          text: You must come back this evening. I'll lock the door because I'm afraid of those wild huntsmen. Knock and say, “My sister dear, open. I'm here.” If you don't say those words, I won't open the door.
        - id: ch02-b05
          speaker: narrator
          text: The little Roe bounded away. Out in the open air, he felt well and happy. The King and his huntsmen soon spotted the beautiful creature and chased him. They could never catch up. Whenever they thought they had him, he leaped sideways into the bushes and vanished.
        - id: ch02-b06
          speaker: narrator
          text: At nightfall, the Roe ran home and knocked on the cottage door.
        - id: ch02-b07
          speaker: brother
          text: My sister dear, open. I'm here.
        - id: ch02-b08
          speaker: narrator
          text: Sister opened the door. He hurried inside and spent the night resting on his soft bed of moss.
        - id: ch02-b09
          speaker: narrator
          text: The hunt began again the next morning. As soon as Brother heard the horns and the huntsmen calling, he could not rest for another moment.
        - id: ch02-b10
          speaker: brother
          text: Open the door, Sister. I have to get out!
        - id: ch02-b11
          speaker: sister
          text: Then be sure you're back before night, and remember your little rhyme.
        - id: ch02-b12
          speaker: narrator
          text: She opened the door and let him go. The moment the King and his men saw the Roe with his golden collar, they all galloped after him. He was far too quick and nimble for them. The chase went on throughout the day. But toward evening, the huntsmen slowly formed a circle around him. One of them wounded him slightly in the foot, and the Roe began to limp and could only run away slowly.
        - id: ch02-b13
          speaker: narrator
          text: The huntsman followed in secret all the way to the little house. He heard the Roe call at the door.
        - id: ch02-b14
          speaker: brother
          text: My sister dear, open. I'm here.
        - id: ch02-b15
          speaker: narrator
          text: The door opened, and as soon as the fawn was inside, it shut again. The huntsman carefully remembered everything he had seen and heard. Then he went straight to the King and told him.
        - id: ch02-b16
          speaker: king
          text: Tomorrow, we will hunt once more.
        - id: ch02-b17
          speaker: narrator
          text: Sister was terribly frightened when she saw her wounded fawn. She washed away the blood and wrapped healing herbs around his foot.
        - id: ch02-b18
          speaker: sister
          text: Lie down and rest now, dear one. Your foot needs time to heal.
          emotion: calm
        - id: ch02-b19
          speaker: narrator
          text: The wound was so slight that by the next day it had healed, and the Roe felt nothing at all. Then the sounds of the hunt came through the forest again.
        - id: ch02-b20
          speaker: brother
          text: I can't bear it. I have to be there! I'll make sure they don't catch me.
        - id: ch02-b21
          speaker: narrator
          text: Sister began to cry.
        - id: ch02-b22
          speaker: sister
          text: They are sure to kill you. Then I'll be alone in the forest, with everyone gone. I can't let you out. I won't!
          emotion: fearful
        - id: ch02-b23
          speaker: brother
          text: Then I'll die from grief. Whenever I hear that horn, I feel as if I have to leap right out of my skin.
          emotion: sad
        - id: ch02-b24
          speaker: narrator
          text: Sister saw that nothing could stop him. With a heavy heart, she opened the door, and the Roe dashed joyfully into the forest, healthy and strong again.
        - id: ch02-b25
          speaker: narrator
          text: As soon as the King saw him, he gave an order to his huntsmen.
        - id: ch02-b26
          speaker: king
          text: Chase him until evening, but take care. No one is to hurt him.
        - id: ch02-b27
          speaker: narrator
          text: When the sun had set, the King called the huntsman to him.
        - id: ch02-b28
          speaker: king
          text: Now show me that little house in the woods.
        - id: ch02-b29
          speaker: narrator
          text: At the cottage, the King knocked and repeated the words he had learned.
        - id: ch02-b30
          speaker: king
          text: My sister dear, open. I'm here.
        - id: ch02-b31
          speaker: narrator
          text: The door opened. The King walked in and found the loveliest maiden he had ever seen. Sister had expected her little Roe, so she was startled to see a man wearing a golden crown. The King looked at her kindly and held out his hand.
        - id: ch02-b32
          speaker: king
          text: Will you come to my castle and become my dear wife?
        - id: ch02-b33
          speaker: sister
          text: Oh, yes! But my Roe must come with us. I could never leave him behind.
        - id: ch02-b34
          speaker: king
          text: He will stay with you all your life, and he will never lack anything.
        - id: ch02-b35
          speaker: narrator
          text: Just then the Roe bounded in. Sister tied the rush cord to his collar again and took the end in her hand. Together, they left the little house in the forest.
    - id: ch03
      title: The False Queen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The King lifted the lonely maiden onto his horse and took her to his castle. Their wedding was celebrated with great splendor. Everyone petted and caressed the Roe, and he roamed freely through the palace gardens.
        - id: ch03-b02
          speaker: narrator
          text: All this time, the wicked stepmother, who had caused the children's troubles and dangerous adventures, believed that wild beasts had torn Sister apart and that hunters had shot Brother in the form of a Roe. When she learned that the two were alive, happy, and prosperous, envy and hatred filled her heart. From then on, she could think of nothing but bringing some fresh misfortune upon them.
        - id: ch03-b03
          speaker: narrator
          text: The witch's own daughter was as hideous as night and had only one eye. She complained to her mother.
        - id: ch03-b04
          speaker: stepsister
          text: I should have had all this good fortune. I should have been the Queen!
          emotion: angry
        - id: ch03-b05
          speaker: stepmother
          text: Be quiet. When the right time comes, I'll be ready.
        - id: ch03-b06
          speaker: narrator
          text: Some time later, while the King was away hunting, the Queen gave birth to a beautiful little boy. The old witch saw her chance. She took the shape of the Queen's lady in waiting and hurried into the room where the Queen lay weak in bed.
        - id: ch03-b07
          speaker: stepmother
          text: Your bath is ready. It will help you grow strong again. Come quickly, before the water gets cold.
        - id: ch03-b08
          speaker: narrator
          text: The witch's daughter was waiting nearby. Together they carried the weakened Queen into the bathroom and lowered her into the bath. Then they locked the door and ran away. Beforehand, they had built a blazing fire beneath the bath so that the lovely young Queen would suffocate.
        - id: ch03-b09
          speaker: narrator
          text: When they were certain she was dead, the witch tied a cap over her daughter's head and put her in the Queen's bed. Her magic made the girl's figure and general appearance look like the Queen's. But even the witch could not give back the missing eye, so she made her daughter lie on that side to hide it from the King.
        - id: ch03-b10
          speaker: narrator
          text: That evening the King came home. When he heard that his son had been born, joy filled him, and he insisted on seeing his dear wife at once. The old witch stopped him.
        - id: ch03-b11
          speaker: stepmother
          text: Take care! Keep the curtains closed. The light must not reach the Queen's eyes, and she needs complete quiet.
        - id: ch03-b12
          speaker: narrator
          text: The King went away without discovering that a false Queen lay in the bed.
    - id: ch04
      title: The Midnight Visitor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At midnight, everyone in the palace was asleep except the nurse beside the baby's cradle. She saw the nursery door open softly, and the real Queen came in. The Queen lifted her child, held him in her arms, and nursed him for a while. Then she shook out the little bed's pillows, laid the baby down, and tucked the coverlet carefully around him.
        - id: ch04-b02
          speaker: narrator
          text: She remembered the little Roe as well. She crossed to his corner and gently stroked his back. Then she left without a sound.
        - id: ch04-b03
          speaker: narrator
          text: In the morning, the nurse questioned the sentries. She asked whether anyone had entered the castle during the night.
        - id: ch04-b04
          speakers: [sentry_1, sentry_2, sentry_3]
          ensemble: chorus
          text: No. We didn't see anyone at all.
        - id: ch04-b05
          speaker: narrator
          text: For many nights, the Queen came through the nursery door in just the same way. Each time, she cared for the baby and the little Roe, but she never spoke a word. The nurse was so frightened by these silent visits that she did not dare tell anyone what she had seen.
        - id: ch04-b06
          speaker: narrator
          text: After some time had passed, the Queen came one night and finally spoke.
        - id: ch04-b07
          speaker: sister
          text: Is my child well? Is my Roe well? I'll come back twice, and then farewell.
        - id: ch04-b08
          speaker: narrator
          text: The nurse did not answer. But as soon as the Queen vanished, she went to the King and told him everything.
        - id: ch04-b09
          speaker: king
          text: Good heavens! What are you telling me? Tonight, I will keep watch beside the child's bed myself.
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: That evening, the King went to the nursery. At midnight, the Queen appeared again.
        - id: ch04-b11
          speaker: sister
          text: Is my child well? Is my Roe well? I'll come back once, and then farewell.
        - id: ch04-b12
          speaker: narrator
          text: As always, she nursed and tended the baby before she disappeared. The King did not dare speak to her. The following night, he returned to keep watch once more.
        - id: ch04-b13
          speaker: narrator
          text: At midnight, the Queen entered for the last time.
        - id: ch04-b14
          speaker: sister
          text: Is my child well? Is my Roe well? I've come this once, and now farewell.
        - id: ch04-b15
          speaker: narrator
          text: The King could hold himself back no longer. He sprang to her side.
        - id: ch04-b16
          speaker: king
          text: You can only be my dear wife!
        - id: ch04-b17
          speaker: sister
          text: Yes. I am your dear wife!
        - id: ch04-b18
          speaker: narrator
          text: At that very moment, she came back to life. She stood fresh, healthy, and rosy before him, just as she had been before.
    - id: ch05
      title: The Spell Is Broken
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Queen told the King every cruel thing the wicked witch and her daughter had done. He had both of them arrested at once and brought to trial. They were found guilty and condemned to death.
        - id: ch05-b02
          speaker: narrator
          text: The daughter was taken into the forest, where wild beasts tore her to pieces. The old witch was burned at the stake.
        - id: ch05-b03
          speaker: narrator
          text: As soon as the witch had turned to ashes, her spell broke. The little Roe changed back into Brother's natural shape.
        - id: ch05-b04
          speaker: narrator
          text: And so Brother and Sister lived happily ever after.
