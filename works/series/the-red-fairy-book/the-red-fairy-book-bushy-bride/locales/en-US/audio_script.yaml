  chapters:
    - id: ch01
      title: The Three Heads in the Brook
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a widower with a son and daughter from his first marriage. The children were good and loved each other with all their hearts. In time, their father married a widow who had a daughter of her own. Both the woman and her daughter were ugly and wicked. From the day they entered the house, the first two children had no peace. There was not one corner where they could rest. At last, the boy decided that his best hope was to go out into the world and earn his own living.
        - id: ch01-b02
          speaker: narrator
          text: After wandering for a while, he reached the King's palace and found work under the coachman. He was quick and hardworking. The horses in his care grew so fat and sleek that their coats shone.
        - id: ch01-b03
          speaker: narrator
          text: His sister stayed at home, and her life only grew harder. Her stepmother and stepsister found fault with her wherever she went and whatever she did. They scolded and mistreated her so often that she never had a peaceful hour. All the hardest work fell to her. She heard cruel words from early morning until late at night, and those words came with very little food.
        - id: ch01-b04
          speaker: narrator
          text: One day, they sent her to fetch water from the brook. An ugly, dreadful head rose out of the water and spoke to her.
        - id: ch01-b05
          speaker: first_head
          text: Girl, wash me!
        - id: ch01-b06
          speaker: stepdaughter
          text: Yes, I will. I will gladly wash you and do the task well.
        - id: ch01-b07
          speaker: narrator
          text: She scrubbed the ugly face well, though the task was very unpleasant. As soon as she finished, a second head appeared. It was uglier than the first.
        - id: ch01-b08
          speaker: second_head
          text: Girl, brush me!
        - id: ch01-b09
          speaker: stepdaughter
          text: Yes, I will. I will brush you gladly.
        - id: ch01-b10
          speaker: narrator
          text: She worked at its tangled hair until it was brushed, though this task was no more pleasant than the last. Then a third head rose from the brook. It was the ugliest and most horrible of all.
        - id: ch01-b11
          speaker: third_head
          text: Girl, kiss me!
        - id: ch01-b12
          speaker: stepdaughter
          text: Yes, I will kiss you.
        - id: ch01-b13
          speaker: narrator
          text: She kissed it, though she thought it was the worst task she had ever done. Then the three heads talked about how they might reward such a kind girl.
        - id: ch01-b14
          speaker: first_head
          text: She will be the prettiest girl who ever lived, as fair and bright as day.
        - id: ch01-b15
          speaker: second_head
          text: Whenever she brushes her hair, gold will fall from it.
        - id: ch01-b16
          speaker: third_head
          text: Whenever she speaks, gold will fall from her mouth.
        - id: ch01-b17
          speaker: narrator
          text: The girl returned home as beautiful and bright as day. The sight made her stepmother and stepsister more ill-tempered than ever. Things grew worse when she began to speak and they saw gold coins drop from her mouth. Her stepmother flew into a towering rage and drove her into the pigsty.
        - id: ch01-b18
          speaker: stepmother
          text: You can stay out there with all your fine gold! I will not allow you to set foot inside this house again!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: Before long, the woman sent her own daughter to bring water from the brook. The girl reached the bank with her pails, and the first head rose from the water.
        - id: ch01-b20
          speaker: first_head
          text: Girl, wash me!
        - id: ch01-b21
          speaker: stepsister
          text: Wash yourself!
        - id: ch01-b22
          speaker: narrator
          text: The second head appeared next.
        - id: ch01-b23
          speaker: second_head
          text: Girl, brush me!
        - id: ch01-b24
          speaker: stepsister
          text: Brush yourself!
        - id: ch01-b25
          speaker: narrator
          text: That head sank away, and the third one came up.
        - id: ch01-b26
          speaker: third_head
          text: Girl, kiss me!
        - id: ch01-b27
          speaker: stepsister
          text: Why would I kiss that ugly mouth?
          emotion: disgusted
        - id: ch01-b28
          speaker: narrator
          text: The heads talked again. This girl was ill-tempered and thought far too much of herself, so they chose her reward. Her nose would be four ells long, her jaw three ells long, and a fir bush would grow from the middle of her forehead. Ashes would fall from her mouth whenever she spoke.
        - id: ch01-b29
          speaker: narrator
          text: When she returned with the pails, she stopped outside the cottage and called to her mother.
        - id: ch01-b30
          speaker: stepsister
          text: Open the door!
        - id: ch01-b31
          speaker: stepmother
          text: Open it yourself, my own dear child!
        - id: ch01-b32
          speaker: stepsister
          text: I cannot get close enough. My nose is in the way!
        - id: ch01-b33
          speaker: narrator
          text: Her mother came out, saw what had happened, and screamed and wailed. But all her noise could not shorten the nose or the jaw at all.
    - id: ch02
      title: The Portrait at the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the brother had painted a portrait of his sister and carried it away with him to the palace. He loved her so dearly that every morning and every evening he knelt before the picture and prayed for her.
        - id: ch02-b02
          speaker: narrator
          text: The other stable boys heard him praying. They peeped through his keyhole and saw him kneeling before the portrait. Soon they were telling everyone that the young man prayed to an idol every morning and evening. At last, they went to the King and asked him to look through the keyhole for himself. The King did not believe their story at first. But they went on asking for a long, long time. Finally, he crept to the door on tiptoe and looked inside. There was the brother, on his knees with his hands clasped before the picture on the wall.
        - id: ch02-b03
          speaker: king
          text: Open the door!
        - id: ch02-b04
          speaker: narrator
          text: The young man was praying too fervently to hear him. The King called again, but still there was no answer.
        - id: ch02-b05
          speaker: king
          text: Open this door! It is the King, and I want to come in!
        - id: ch02-b06
          speaker: narrator
          text: The brother sprang up and unlocked the door. In his hurry, he forgot to hide the portrait. The King entered and caught sight of it. He stopped as though chains held him to the spot and could not move, because the woman in the picture seemed so beautiful.
        - id: ch02-b07
          speaker: king
          text: No woman anywhere on earth could be as beautiful as this!
          emotion: surprised
        - id: ch02-b08
          speaker: brother
          text: She is my sister, Your Majesty, and I painted that portrait. She may be even prettier than the picture, but she is certainly no less beautiful.
        - id: ch02-b09
          speaker: king
          text: If she truly looks like that, she will be my Queen. Go home and bring her here. Leave at once, and return as quickly as you can.
        - id: ch02-b10
          speaker: narrator
          text: The brother promised to hurry and set out from the palace.
    - id: ch03
      title: The Voyage of Betrayal
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the brother reached home to fetch his sister, the stepmother and stepsister insisted on going too. So all four set out together. His sister carried a casket that held her gold, and beside her went a dog named Little Snow. The casket and the dog were the only things she had inherited from her mother.
        - id: ch03-b02
          speaker: narrator
          text: After traveling for some time, they came to the sea and had to cross it. The brother took the helm. The stepmother and the two young women sat together at the front of the ship, far from him. They sailed a long, long way until at last they saw land.
        - id: ch03-b03
          speaker: brother
          text: Look at that white shore. That is where we will land.
        - id: ch03-b04
          speaker: stepdaughter
          text: What did my brother say?
        - id: ch03-b05
          speaker: stepmother
          text: He told you to throw your casket into the sea.
        - id: ch03-b06
          speaker: stepdaughter
          text: If my brother told me to do it, then I must.
        - id: ch03-b07
          speaker: narrator
          text: She threw the casket overboard. After they had sailed farther, her brother pointed across the water again.
        - id: ch03-b08
          speaker: brother
          text: There is the palace we are sailing toward.
        - id: ch03-b09
          speaker: stepdaughter
          text: What is my brother saying now?
        - id: ch03-b10
          speaker: stepmother
          text: He says you must throw your dog into the sea.
        - id: ch03-b11
          speaker: narrator
          text: The young woman wept. Little Snow was the dearest thing she had in the world, and she could hardly bear to lose him. In the end, she threw him overboard.
        - id: ch03-b12
          speaker: stepdaughter
          text: If my brother says I must, I will do it. But Heaven knows how much it hurts me to throw you out, Little Snow!
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: The ship went on for a long while. Then her brother pointed toward the shore once more.
        - id: ch03-b14
          speaker: brother
          text: Look, the King is coming to meet you!
        - id: ch03-b15
          speaker: stepdaughter
          text: What did my brother say?
        - id: ch03-b16
          speaker: stepmother
          text: He says you must hurry and throw yourself overboard.
        - id: ch03-b17
          speaker: narrator
          text: She wept and wailed. Yet she believed the command had come from her brother, so she leaped into the sea.
        - id: ch03-b18
          speaker: narrator
          text: At the palace, the King found a bride with a four-ell nose, a three-ell jaw, and a bush growing from the middle of her forehead. The sight terrified him. But everything for the feast had already been brewed and baked. All the wedding guests were seated and waiting, so the King was forced to marry her, ugly as she was.
        - id: ch03-b19
          speaker: narrator
          text: The King was furious, and he ordered the brother to be thrown into a pit full of snakes.
    - id: ch04
      title: Three Thursday Nights
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the first Thursday night after the wedding, a beautiful maiden entered the palace kitchen. The kitchen maid slept there, and the stranger asked very sweetly if she might borrow her brush. The maid agreed and handed it to her. Then the maiden brushed her hair, and gold dropped down around her.
        - id: ch04-b02
          speaker: stepdaughter
          text: Go outside, Little Snow, and see if day is coming soon!
        - id: ch04-b03
          speaker: narrator
          text: She sent the little dog out to look three times. The third time, he found that dawn was very near. The maiden could stay no longer. As she left the kitchen, she spoke these words.
        - id: ch04-b04
          speaker: stepdaughter
          text: Shame on you, ugly Bushy Bride, sleeping so softly by the young King's side. I make my bed on sand and stones, while my brother lies with the cold snake, unpitied and unwept. I will come twice more, and then never again.
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: In the morning, the kitchen maid told the King everything she had seen and heard.
        - id: ch04-b06
          speaker: kitchen_maid
          text: A beautiful maiden came into the kitchen last night. Gold fell as she brushed her hair. She had a little dog with her, and before dawn she spoke of the Bushy Bride and her brother in the snake pit. She said she would return only twice more.
        - id: ch04-b07
          speaker: king
          text: Next Thursday night, I will watch in the kitchen and see whether this is true.
        - id: ch04-b08
          speaker: narrator
          text: When the next Thursday grew dark, the King went to the kitchen to keep watch with the maid. He rubbed his eyes and did everything he could think of to stay awake. It was all in vain. The Bushy Bride crooned and sang until his eyes closed tightly. By the time the beautiful maiden arrived, he was sound asleep and snoring.
        - id: ch04-b09
          speaker: narrator
          text: Just as before, the maiden borrowed the kitchen maid's brush. She drew it through her hair, and gold fell with every stroke. Again she sent Little Snow outside three times. When dawn arrived, she had to go.
        - id: ch04-b10
          speaker: stepdaughter
          text: Shame on you, ugly Bushy Bride, sleeping so softly by the young King's side. I make my bed on sand and stones, while my brother lies with the cold snake, unpitied and unwept. I will come once more, and then never again.
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: On the third Thursday night, the King insisted on watching once more. This time, he ordered two men to hold him by the arms. If he began to fall asleep, they were to shake and jerk him awake. Two more men were set to watch the Bushy Bride.
        - id: ch04-b12
          speaker: narrator
          text: As the night passed, the Bushy Bride began to croon and sing again. The King's eyes started to close, and his head drooped to one side. Then the lovely maiden entered the kitchen. She got the brush and drew it through her hair until gold fell from it. Three times she sent Little Snow outside to see whether day was near. When the dog went out for the third time, the sky was just beginning to grow light.
        - id: ch04-b13
          speaker: stepdaughter
          text: Shame on you, ugly Bushy Bride, sleeping so softly by the young King's side. I make my bed on sand and stones, while my brother lies with the cold snake, unpitied and unwept. Now I shall never come again.
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: With those final words, she turned to leave. The two men who held the King seized his hands, forced a knife into his grasp, and guided it across her little finger. They cut only deeply enough to draw a drop of blood.
    - id: ch05
      title: The True Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At once, the true bride was freed from what had held her. The King woke, and she told him everything that had happened from the beginning. She explained how her stepmother and stepsister had betrayed her on the journey.
        - id: ch05-b02
          speaker: narrator
          text: The brother was brought out of the snake pit immediately. Not one snake had touched him. The stepmother and stepsister were thrown into the pit in his place.
        - id: ch05-b03
          speaker: narrator
          text: No one could say how delighted the King was. The hideous Bushy Bride was gone, and his true Queen stood before him, as bright and beautiful as day itself.
        - id: ch05-b04
          speaker: narrator
          text: Then the true wedding was held at last. It was celebrated so grandly that people heard of it and talked about it throughout seven kingdoms. The King and his bride rode to church together, and Little Snow rode in the carriage too. Once the blessing had been given, they all went home again. After that, I never saw any of them again.
