audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    brother:
      display_name: 哥哥
      tts:
        delivery: 善良勤恳，对妹妹满怀关爱
        timbre: 清朗年轻
        pace: 适中
        pitch: 中等
    true_bride:
      display_name: 真新娘
      tts:
        delivery: 温柔顺从，苦难中仍保有善意
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高
    stepmother:
      display_name: 继母
      tts:
        delivery: 刻薄阴险，哄骗时故作自然
        timbre: 冷硬低哑
        pace: 适中
        pitch: 中低
    bushy_bride:
      display_name: 树丛新娘
      tts:
        delivery: 骄横无礼，开口总带着不耐烦
        timbre: 尖利粗涩
        pace: 偏快
        pitch: 中高
    first_head:
      display_name: 第一颗脑袋
      tts:
        delivery: 古怪威严，命令简短直接
        timbre: 空洞沙哑
        pace: 缓慢
        pitch: 中低
    second_head:
      display_name: 第二颗脑袋
      tts:
        delivery: 古怪冷静，说话不紧不慢
        timbre: 干涩低沉
        pace: 缓慢
        pitch: 中等
    third_head:
      display_name: 第三颗脑袋
      tts:
        delivery: 神秘郑重，语气带着考验意味
        timbre: 轻柔幽深
        pace: 缓慢
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 庄重威严，悲喜都深沉
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
    kitchen_maid:
      display_name: 厨房女仆
      tts:
        delivery: 实在爽利，待人热心却不失警觉
        timbre: 温暖朴实
        pace: 轻快
        pitch: 中等
  chapters:
    - id: ch01
      title: 三颗水中脑袋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个鳏夫，前妻给他留下一儿一女。两个孩子心地善良，彼此也真心相爱。过了一阵，父亲又娶了一个寡妇。新妻子带着自己的女儿进了家门，母女俩不仅模样丑陋，心肠也坏。从她进门的第一天起，兄妹俩再没过上一刻安生日子，屋里屋外连个能让他们歇脚的角落都找不到。哥哥想来想去，觉得最好的办法就是离家闯荡，设法挣口饭吃。
        - id: ch01-b02
          speaker: narrator
          text: 他漂泊了一阵，来到国王的宫殿，在马车夫手下谋到差事。小伙子手脚麻利，干活又勤快。他照料的马匹头头膘肥毛亮，身上都泛着光。
        - id: ch01-b03
          speaker: narrator
          text: 留在家里的妹妹却越来越苦。她不管做什么、走到哪里，继母和继姐总要挑错，再把她狠狠骂上一顿，让她连一个时辰的安宁也没有。所有苦活都归她，恶言恶语从早跟到晚，随那些恶语一起给她的饭食却少得可怜。
        - id: ch01-b04
          speaker: narrator
          text: 一天，她们叫女孩去溪边打水。她才走到岸边，一颗丑陋骇人的脑袋便从水里升了起来。
        - id: ch01-b05
          speaker: first_head
          text: 姑娘，给我洗洗！
        - id: ch01-b06
          speaker: true_bride
          text: 好，我愿意替你洗。
        - id: ch01-b07
          speaker: narrator
          text: 女孩动手洗刷那张难看的脸。她心里实在不好受，还是仔仔细细把它洗干净了。这时，第二颗脑袋冒出水面，模样比第一颗更丑。
        - id: ch01-b08
          speaker: second_head
          text: 姑娘，给我梳梳！
        - id: ch01-b09
          speaker: true_bride
          text: 好，我愿意替你梳。
        - id: ch01-b10
          speaker: narrator
          text: 她耐着性子梳理那团纠结的头发。这也不是什么舒服的活儿。等头发终于理顺，第三颗脑袋又浮了上来。它比前两个更加丑陋，也更加吓人。
        - id: ch01-b11
          speaker: third_head
          text: 姑娘，亲亲我！
        - id: ch01-b12
          speaker: true_bride
          text: 好，我会亲你的。
        - id: ch01-b13
          speaker: narrator
          text: 女孩真的亲了那颗脑袋，只觉得这比自己一生做过的所有苦差都更难熬。三颗脑袋见她如此善良，便商量起该送她什么。
        - id: ch01-b14
          speaker: first_head
          text: 我要让她成为世上最美的姑娘，像白昼一样明艳光亮。
        - id: ch01-b15
          speaker: second_head
          text: 她每次梳头，金子都会从发间落下。
        - id: ch01-b16
          speaker: third_head
          text: 她每次开口，金子都会从嘴里落下。
        - id: ch01-b17
          speaker: narrator
          text: 女孩回到家时，果真美得像明亮的白昼。继母和继姐见了，气得脾气越发坏。等她们又看到女孩一开口，一枚枚金币便从嘴里落下，更是暴跳如雷。继母把她赶进猪圈，还说她尽管留在那里炫耀自己的满地金子，却休想再踏进屋门一步。
        - id: ch01-b18
          speaker: narrator
          text: 没过多久，继母也叫亲生女儿去溪边打水。女孩提着桶来到岸边，第一颗脑袋便从近旁的水里冒了出来。
        - id: ch01-b19
          speaker: first_head
          text: 姑娘，给我洗洗！
        - id: ch01-b20
          speaker: bushy_bride
          text: 你自己洗！
        - id: ch01-b21
          speaker: narrator
          text: 第二颗脑袋接着出现了。
        - id: ch01-b22
          speaker: second_head
          text: 姑娘，给我梳梳！
        - id: ch01-b23
          speaker: bushy_bride
          text: 你自己梳！
        - id: ch01-b24
          speaker: narrator
          text: 第二颗脑袋沉了下去，第三颗又浮上来。
        - id: ch01-b25
          speaker: third_head
          text: 姑娘，亲亲我！
        - id: ch01-b26
          speaker: bushy_bride
          text: 我才不亲你那张丑嘴！
        - id: ch01-b27
          speaker: narrator
          text: 三颗脑袋再次商量起来。这个女孩脾气坏，又自以为了不起，该怎样对待她呢？最后，它们议定一份回报。她的鼻子要长到四厄尔，下巴要长到三厄尔，额头正中还要生出一丛冷杉。每逢她开口，嘴里都会掉出灰烬。
        - id: ch01-b28
          speaker: narrator
          text: 她提着水桶回到小屋，却被自己的长鼻子挡在门外，只好朝屋里大喊。
        - id: ch01-b29
          speaker: bushy_bride
          text: 妈妈，给我开门！
        - id: ch01-b30
          speaker: stepmother
          text: 我的心肝宝贝，你自己开呀！
        - id: ch01-b31
          speaker: bushy_bride
          text: 鼻子挡在前面，我根本碰不到门！
        - id: ch01-b32
          speaker: narrator
          text: 母亲出来一看，惊得又尖叫又哀号。可任凭她怎么哭，那根长鼻子和长下巴也没有缩短半分。
    - id: ch02
      title: 画像与海上的骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这时，哥哥已经在王宫当差。他离家前曾为妹妹画下一幅肖像，也把画带在身边。因为实在挂念妹妹，他每天早晚都跪在画像前，为她祷告。
        - id: ch02-b02
          speaker: narrator
          text: 马厩里的其他小伙子听见了，便从钥匙孔往里偷看。他们见哥哥对着一幅画跪拜，便逢人就说，这个年轻人每天早晚都向自己供奉的偶像祷告。最后，他们还跑去求国王也从钥匙孔瞧一眼，亲自看看年轻人究竟在做什么。国王起初不肯相信，可那些人劝了又劝，劝了很久很久，终于把他劝动了。他踮着脚来到门外，从钥匙孔看见年轻人双膝跪地，两手握紧，正对着墙上的画像专心祈祷。
        - id: ch02-b03
          speaker: king
          text: 开门！
        - id: ch02-b04
          speaker: narrator
          text: 年轻人没有听见。国王又叫一次，他还是沉浸在祷告里，毫无反应。
        - id: ch02-b05
          speaker: king
          text: 我叫你开门！是我，我要进去！
        - id: ch02-b06
          speaker: narrator
          text: 年轻人猛地跳起来，赶紧打开门锁，却在慌忙中忘了藏起画像。国王一进门便看到了它。他像被锁链捆住一样立在原地，一步也挪不开。画中的女子实在太美了。
        - id: ch02-b07
          speaker: king
          text: 世上再也找不出这样美丽的女子！
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: 年轻人解释说，画中人是他的妹妹，画像也是他亲手画的。妹妹即使不比画里更美，也绝不会比画像逊色。
        - id: ch02-b09
          speaker: king
          text: 她真有这么美，我就娶她做王后。你马上回家接她，一刻也别耽搁，回来时也要尽快。
        - id: ch02-b10
          speaker: narrator
          text: 哥哥答应一路加紧，立刻离开王宫启程回家。他本想只接妹妹进宫，可继母和继姐硬要同行，于是四个人一同上路。妹妹带上存放金子的匣子，又牵着一条名叫小雪的狗。这两样东西，是她从亲生母亲那里继承的全部遗物。
        - id: ch02-b11
          speaker: narrator
          text: 一行人走到海边，登船继续赶路。哥哥在船尾掌舵，三个女人待在船头。航行了很久以后，他们终于望见陆地。
        - id: ch02-b12
          speaker: brother
          text: 瞧那片白色的海滩，我们就要在那里上岸。
        - id: ch02-b13
          speaker: true_bride
          text: 哥哥说什么？
        - id: ch02-b14
          speaker: stepmother
          text: 他说，要你把匣子扔进海里。
        - id: ch02-b15
          speaker: true_bride
          text: 既然哥哥这样说，我只能照办。
        - id: ch02-b16
          speaker: narrator
          text: 她把匣子抛进大海。船又走了一阵，哥哥再次指向海对面。
        - id: ch02-b17
          speaker: brother
          text: 看见了吗？那就是我们要去的宫殿。
        - id: ch02-b18
          speaker: true_bride
          text: 哥哥这回说什么？
        - id: ch02-b19
          speaker: stepmother
          text: 他说，要你把狗扔进海里。
        - id: ch02-b20
          speaker: narrator
          text: 妹妹哭了起来。小雪是她在世上最珍爱的东西，可她最后还是把狗抛下了船。
        - id: ch02-b21
          speaker: true_bride
          text: 哥哥既然这样说，我只能照办。可是天知道，我多么舍不得把你扔下去啊，小雪！
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: 船继续航行，向前走了很远。
        - id: ch02-b23
          speaker: brother
          text: 看哪，国王已经出来迎接你了。
        - id: ch02-b24
          speaker: true_bride
          text: 哥哥又说什么？
        - id: ch02-b25
          speaker: stepmother
          text: 他说，要你赶紧跳进海里。
        - id: ch02-b26
          speaker: narrator
          text: 妹妹又哭又哀号。可她以为这是哥哥的吩咐，觉得自己必须听从，便纵身跳进大海。
        - id: ch02-b27
          speaker: narrator
          text: 到了王宫，国王看见那位假新娘，吓得魂不附体。她的鼻子足有四厄尔长，下巴足有三厄尔长，额头正中还顶着一丛树。可婚宴的一切早已准备妥当，该酿的酒已经酿好，该烤的饼也已经出炉，所有宾客都坐在那里等候。无论新娘有多丑，他都不得不娶她。
        - id: ch02-b28
          speaker: narrator
          text: 国王怒不可遏，这也怪不得他。眼前的新娘如此丑陋，婚宴却早已办到这个地步。他把怒气全落在哥哥身上，命人将年轻人扔进一座爬满毒蛇的深坑。
    - id: ch03
      title: 星期四夜里的访客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 婚礼后的第一个星期四夜里，一位美丽的少女来到王宫厨房。厨房女仆平日就睡在那里。少女十分客气地向她借一把梳子，女仆听她求得这样有礼貌，便答应了。少女拿起梳子梳理头发，金子随即从发间纷纷落下。
        - id: ch03-b02
          speaker: narrator
          text: 她身边还跟着一条小狗。
        - id: ch03-b03
          speaker: true_bride
          text: 小雪，出去瞧瞧，天是不是快亮了！
        - id: ch03-b04
          speaker: narrator
          text: 少女一共派小雪出去三次。第三次时，天已经快亮了，她不得不离开。临走之前，她唱起一首哀伤的歌。
        - id: ch03-b05
          speaker: true_bride
          text: 树丛新娘，丑东西，偎着年轻国王睡得香甜。我的床铺是沙土和石块，我的哥哥与冰冷毒蛇同眠，无人怜悯，也无人哀挽。
          emotion: sad
        - id: ch03-b06
          speaker: true_bride
          text: 我还会再来两次，之后便永远不来了。
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: 清晨，厨房女仆把昨夜看到和听到的一切告诉国王。国王决定，下个星期四要亲自守在厨房，看这件事是真是假。天一黑，他便来到女仆身边。可任凭他一次次揉眼睛，使尽各种办法保持清醒，也全都没有用。树丛新娘低声哼着曲子，又轻轻唱起歌，直到他的眼皮紧紧合上。美丽的少女出现时，国王已经睡熟，鼾声大作。
        - id: ch03-b08
          speaker: narrator
          text: 少女仍像上次一样，向厨房女仆借来梳子梳头。她每梳一下，金子便从发间落下。她又接连三次派小雪出去查看天色。第三次时，黎明已经来到，她只好再次离去。
        - id: ch03-b09
          speaker: true_bride
          text: 我还会再来一次，之后便永远不来了。
          emotion: sad
    - id: ch04
      title: 真新娘归来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第三个星期四夜里，国王仍坚持亲自守候。这回，他叫两个男人扶住自己，一人抓住一条胳膊。只要他显出困意，他们就得拉扯摇晃他的手臂。他还另外派了两个人看守树丛新娘。
        - id: ch04-b02
          speaker: narrator
          text: 夜渐渐深了。树丛新娘又哼起曲子，国王的眼睛开始合拢，脑袋也歪向一边。美丽的少女随即来到厨房，拿起借来的梳子，一下一下梳理头发，金子不断从发间落下。她又三次派小雪去查看天色。第三次时，天边刚刚泛白。少女唱起那首歌。
        - id: ch04-b03
          speaker: true_bride
          text: 树丛新娘，丑东西，偎着年轻国王睡得香甜。我的床铺是沙土和石块，我的哥哥与冰冷毒蛇同眠，无人怜悯，也无人哀挽。
          emotion: sad
        - id: ch04-b04
          speaker: true_bride
          text: 这次以后，我再也不会来了。
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 少女转身要走。扶着国王的两个男人立刻抓住他的双手，把一把刀硬塞进他掌中，再握着他的手，让刀锋轻轻割破少女的小手指，刚好渗出血来。
        - id: ch04-b06
          speaker: narrator
          text: 真正的新娘就这样得到了解救。国王随即醒来。少女把所有经过从头到尾告诉他，也说出继母和继姐怎样欺骗并背叛了自己。人们马上把哥哥从蛇坑里救出来。尽管他一直和那些冰冷的蛇待在一起，蛇却从来没有碰过他。接着，继母和继姐被扔进坑里，代替了哥哥。
        - id: ch04-b07
          speaker: narrator
          text: 国王总算摆脱了那个丑陋可怕的树丛新娘，又迎来真正的新娘。她像白昼一样光彩照人，美丽极了。国王心里有多欢喜，谁也说不尽。
        - id: ch04-b08
          speaker: narrator
          text: 真正的婚礼这才举行。它办得无比盛大，整整七个王国都听说了，人们到处谈论。国王和新娘乘马车去教堂，小雪也坐在车里。接受祝福以后，他们一同回到王宫。从那以后，我便再也没有见过他们。
