audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    master_thief:
      display_name: 神偷
      tts:
        delivery: 机灵大胆，遇事胸有成竹，玩笑里带着锋芒
        timbre: 年轻清亮
        pace: 明快灵活
        pitch: 中等
    father:
      display_name: 父亲
      tts:
        delivery: 朴实怯懦，忧愁时带着哭腔
        timbre: 粗朴苍老
        pace: 稍慢
        pitch: 中低
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 沉静笃定，揭开往事时郑重清楚
        timbre: 苍老温和
        pace: 缓慢
        pitch: 中低
    robber_1:
      display_name: 强盗甲
      tts:
        delivery: 粗野多疑，说话直截了当
        timbre: 粗哑厚实
        pace: 适中
        pitch: 中低
    robber_2:
      display_name: 强盗乙
      tts:
        delivery: 冷硬精明，发问时咄咄逼人
        timbre: 干涩低沉
        pace: 稍快
        pitch: 低
    farmer:
      display_name: 赶牛的庄稼汉
      tts:
        delivery: 老实絮叨，受骗后又急又恼
        timbre: 朴厚响亮
        pace: 适中
        pitch: 中等
    governor:
      display_name: 省长
      tts:
        delivery: 自负威严，被捉弄时渐显狼狈
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低
    priest:
      display_name: 劳伦斯神父
      tts:
        delivery: 自鸣得意，受骗后惊慌尖厉
        timbre: 圆润偏高
        pace: 适中
        pitch: 中高
    goose_girl:
      display_name: 看鹅姑娘
      tts:
        delivery: 直爽善良，惊讶时仍说得清楚
        timbre: 年轻清脆
        pace: 明快
        pitch: 中高
    groom_1:
      display_name: 马童甲
      tts:
        delivery: 粗声粗气，守夜时不耐烦
        timbre: 年轻粗亮
        pace: 稍快
        pitch: 中等
    groom_2:
      display_name: 马童乙
      tts:
        delivery: 心软随和，说话带着朴实热心
        timbre: 年轻温厚
        pace: 适中
        pitch: 中等
    groom_3:
      display_name: 马童丙
      tts:
        delivery: 爽快直白，冷得厉害时有些急切
        timbre: 清朗结实
        pace: 明快
        pitch: 中等
    groom_4:
      display_name: 马童丁
      tts:
        delivery: 随声应和，语气活跃
        timbre: 略高明亮
        pace: 稍快
        pitch: 中高
    beggar_woman:
      display_name: 乞老婆子
      tts:
        delivery: 贫苦爽利，按约行事时十分认真
        timbre: 苍老沙哑
        pace: 稍慢
        pitch: 中低
    governor_wife:
      display_name: 省长夫人
      tts:
        delivery: 亲近自然，担忧时语气急切
        timbre: 成熟柔和
        pace: 适中
        pitch: 中等
  chapters:
    - id: ch01
      title: 风雨夜里的强盗屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个庄稼汉养了三个儿子。他没有产业留给孩子，也没本事替他们找生计，只好让他们各自挑喜欢的行当，想去哪里就去哪里。他陪儿子们走到三岔路口，看着三个人各选一条路，这才告别回家。两个哥哥后来怎么样，讲故事的人始终没有打听到。只有小儿子走南闯北，去过许多地方。
        - id: ch01-b02
          speaker: narrator
          text: 一天夜里，小儿子正在穿过一片大森林，忽然撞上了可怕的暴风雨。风刮得猛烈，雨下得又密，打得他连眼睛都睁不开。不知不觉间，他完全迷了路，既找不到大道，也看不见小径，只能摸索着继续往前走。后来，他终于看见森林深处有一点灯光，心想无论如何也要走到那里。他又走了好久好久，总算来到灯光前。眼前是一座大房子，屋里的炉火烧得通明，一看便知道主人还没有睡。他走进去，只见一位老妇人正在忙活。
        - id: ch01-b03
          speaker: master_thief
          text: 晚上好，大娘！呼，外面的天气真吓人。能让我在这里睡一晚，避避风雨吗？
        - id: ch01-b04
          speaker: old_woman
          text: 晚上好。天气确实坏透了，可你最好别留下。这屋里的人回来要是发现你，会把咱们两个一起杀掉。
        - id: ch01-b05
          speaker: master_thief
          text: 这里住的到底是什么人？
        - id: ch01-b06
          speaker: old_woman
          text: 唉，不过是一群强盗。我小时候就被他们抢到这里，从那以后一直替他们看家。
        - id: ch01-b07
          speaker: master_thief
          text: 不管他们是谁，我今晚都要睡在这里。外头风雨这么大，出了什么事，我也绝不再走。
        - id: ch01-b08
          speaker: old_woman
          text: 好吧，真要吃亏，也是你自己吃亏。
        - id: ch01-b09
          speaker: narrator
          text: 年轻人在旁边一张床上躺下，却始终不敢睡。果然，强盗们回来了。老妇人说，有个陌生年轻人闯进屋，她怎么赶也赶不走。
        - id: ch01-b10
          speakers: [robber_1, robber_2]
          ensemble: duo
          text: 他身上有钱吗？
        - id: ch01-b11
          speaker: old_woman
          text: 他明明就是个流浪汉，哪像有钱的人？身上有几件衣服就不错了。
        - id: ch01-b12
          speaker: narrator
          text: 强盗们躲到一旁，低声商量是把年轻人一刀杀掉，还是换个法子处置。年轻人听见了，索性起身同他们攀谈，问这里缺不缺一个男仆。
        - id: ch01-b13
          speaker: master_thief
          text: 要是你们肯收留我，我愿意替你们干活。
        - id: ch01-b14
          speaker: robber_1
          text: 只要你肯干我们这一行，这里就有你的位置。
        - id: ch01-b15
          speaker: master_thief
          text: 什么行当都行。我离家时，父亲已经答应让我自己挑。
        - id: ch01-b16
          speaker: robber_2
          text: 那么，你也愿意偷东西？
        - id: ch01-b17
          speaker: master_thief
          text: 愿意。这门本事，我想不用多久就能学会。
        - id: ch01-b18
          speaker: narrator
          text: 附近有个庄稼汉，养着三头牛，正打算牵一头进城去卖。强盗们听说以后，便拿这件事考验年轻人。他必须在路上神不知鬼不觉地偷走那头牛，还不能伤害主人。只要做得到，他们就准他留下做仆人。
    - id: ch02
      title: 三头牛和一身将军服
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 年轻人出门时，顺手拿了一只镶着银扣的漂亮鞋子。他把鞋放在庄稼汉必经的路上，自己藏进灌木丛。庄稼汉赶牛走近，一眼就看见了它。
        - id: ch02-b02
          speaker: farmer
          text: 好漂亮的鞋！要是另一只也在，我就把一双带回家，说不定我家老婆子还会高兴一回。
        - id: ch02-b03
          speaker: narrator
          text: 庄稼汉的妻子脾气坏，动不动就揍他。可只有一只鞋没有用，他便把它留在原地。年轻人马上捡起鞋，穿过林子抢到前面，又把它放在路上。庄稼汉再次看见那只鞋，懊恼自己刚才太蠢。
        - id: ch02-b04
          speaker: farmer
          text: 我这就回去找另一只。凑成一双带回家，老婆子也许肯夸我一句。
        - id: ch02-b05
          speaker: narrator
          text: 他回头找了又找，找了好久好久，哪里还有第一只鞋的影子。最后，他只能拿着手里这一只往回走。就在这段工夫，年轻人已经牵走了牛。庄稼汉回来发现牛不见了，顿时哭天抢地。他怕老婆子知道以后会要了他的命，急得不知怎么办才好。忽然，他想到可以回家再牵一头牛去城里，只要把头一头牛丢失的事万万瞒住妻子就好。他果真偷偷回家，趁妻子不知道，牵出第二头牛又上了路。
        - id: ch02-b06
          speaker: narrator
          text: 强盗们施展魔法，把这些事看得一清二楚。他们说，年轻人若能照旧偷走第二头牛，既不让主人察觉，也不伤他，就能同大家平起平坐。年轻人觉得并不难。他拿一根绳子从腋下绕过，把自己吊在庄稼汉要走的路上。
        - id: ch02-b07
          speaker: farmer
          text: 你得有多命苦，才会上吊啊！唉，你就挂着吧，我可没办法让死人活过来。
        - id: ch02-b08
          speaker: narrator
          text: 庄稼汉说完便赶着牛继续往前。年轻人立即跳下树，穿过树林抄近路，抢先跑到他前面，又把绳子绕在身上，吊在路旁另一棵树上，看起来仍像一具上吊的身子。
        - id: ch02-b09
          speaker: farmer
          text: 我倒想知道，你也是伤心透了才上吊，还是一个挡路的妖怪？算了，不管你是什么，都挂着吧。
        - id: ch02-b10
          speaker: narrator
          text: 年轻人又跳下来，第三次赶到前头，把自己吊在大路正中的树上。庄稼汉再次看见他，终于觉得不对劲了。
        - id: ch02-b11
          speaker: farmer
          text: 难道真有三个人一起上吊？不，我才不信，准是妖法！我要回去看看。前面那两个还在，这就是真的。他们要是不见了，那就是妖怪作祟。
        - id: ch02-b12
          speaker: narrator
          text: 他把牛拴好，沿路往回跑，还一路仰头检查每一棵树，想看看前两个上吊的人究竟还在不在。年轻人等他走远，立刻从树上跳下来，牵走了第二头牛。庄稼汉回来发现牛又没了，气成什么样，谁都能想得到。他一会儿哭，一会儿发火，最后只能安慰自己，眼下最好的办法，还是瞒着妻子回家牵出第三头牛，再想法子卖个好价钱。
        - id: ch02-b13
          speaker: narrator
          text: 强盗们用魔法看见这一切，便许诺说，如果年轻人连第三头牛也能像前两头一样偷走，就让他做整伙人的头领。年轻人先钻进树林，等庄稼汉经过，便藏在里面，学着一头大牛放声哞叫。庄稼汉听了大喜，以为认出了自家大公牛的叫声，心想这次不但能找回大公牛，也许连另一头牛也能一起找回来。他急忙把第三头牛拴在路边，离开道路，跑进林中寻找。年轻人便趁这个机会出来，牵走了第三头牛。
        - id: ch02-b14
          speaker: narrator
          text: 庄稼汉回来，见最后一头牛也没了，气得没了边。他又哭又号，好多天都不敢回家，唯恐老婆子真的把他打死。强盗们也十分不痛快，因为他们不得不承认，这个新来的年轻人比整伙人都高明。一天，他们决定合伙去干一桩料定他办不到的事。强盗们全体出门上路，只把年轻人一个人留在家里。
        - id: ch02-b15
          speaker: narrator
          text: 强盗们一走，年轻人先把三头牛赶上大路，让它们全都跑回主人家。庄稼汉看见牛回来，高兴极了。接着，年轻人牵出强盗们所有的马，把金银器皿、衣服和各种贵重物件装上马背。
        - id: ch02-b16
          speaker: master_thief
          text: 大娘，请替我向他们问好，也替我谢谢他们。告诉他们，我已经走了。他们要想再找到我，只怕不容易。
        - id: ch02-b17
          speaker: narrator
          text: 年轻人赶着马离开，走了很久很久，终于回到当初前来投奔强盗时走过的那条路。离故乡越来越近，远远望见父亲的小屋时，他从强盗的财物里翻出一套制服穿上。那身衣服看起来俨然是将军的装束。他就这样像个大人物一样赶着一群驮满财宝的马进了院子，随后走进屋里，问能不能在这里借宿。
        - id: ch02-b18
          speaker: father
          text: 那怎么成！我哪里招待得起您这样的贵人？就连自己的衣裳和铺盖，我都凑不齐，就算有也是破破烂烂的。
        - id: ch02-b19
          speaker: master_thief
          text: 你从前就狠心，现在还是一样，连亲生儿子都不肯让进屋。
        - id: ch02-b20
          speaker: father
          text: 你是我的儿子？
        - id: ch02-b21
          speaker: master_thief
          text: 怎么，你连我也认不出来了？
        - id: ch02-b22
          speaker: narrator
          text: 父亲这才认出他，忙问他做了什么营生，怎么这么快就成了大人物。
        - id: ch02-b23
          speaker: master_thief
          text: 这就告诉你。你说过我想做什么都行，所以我拜一伙强盗为师。现在我已经出师，成了神偷。
    - id: ch03
      title: 烤肉、天使和炼狱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 省长就住在父亲的小屋附近。他的宅子大得惊人，钱财多得连自己也数不清。他还有个女儿，生得漂亮娇美，又善良聪慧。神偷一回来就决意娶她做妻子，便让父亲亲自去见省长，替自己求娶他的女儿。他还特意嘱咐父亲，如果省长问起他做什么行当，一定要照实说，他是个神偷。
        - id: ch03-b02
          speaker: father
          text: 我看你准是疯了！省长那么富有，什么财宝没有？你偏让我去说这种蠢话，我可不敢。
        - id: ch03-b03
          speaker: master_thief
          text: 你非去不可。好好劝你不肯听，我很快就会换个厉害的办法逼你去。
        - id: ch03-b04
          speaker: narrator
          text: 父亲还是不肯，怎么劝也不愿到省长面前说这种话。神偷便拿起一根粗大的桦木棍，紧紧跟在父亲身后，一路拿棍子威吓他。父亲没有别的办法，只得哭哭啼啼地走到省长的大宅，硬着头皮进了门。
        - id: ch03-b05
          speaker: governor
          text: 喂，老兄，你出了什么事？
        - id: ch03-b06
          speaker: father
          text: 我有三个儿子，他们早先全都离开了家。我准他们想去哪里就去哪里，想做什么就做什么。如今小儿子回来了，硬逼我来替他求娶您的女儿，还非让我告诉您，他是个神偷。
          emotion: sad
        - id: ch03-b07
          speaker: governor
          text: 别哭了，老兄。让他先显一点真本事。星期日，我们所有人都会守在厨房。他若能当着大家的面，把烤叉上的肉偷走，我就把女儿嫁给他。你把这话带给他吧。
        - id: ch03-b08
          speaker: narrator
          text: 父亲果然把省长的话带了回来。年轻人听完，觉得这件事容易得很。他设法活捉三只野兔，把它们一起装进口袋，又换上一身破烂衣裳，把自己打扮得穷困潦倒，叫人看了都觉得可怜。星期日上午，他扮成一个小乞丐，背着口袋偷偷溜进走廊。省长本人和宅子里所有的人都待在厨房，眼睛紧盯着烤叉上的肉。趁他们看守时，年轻人悄悄放出第一只野兔。兔子一落地，立刻绕着院子飞跑起来。
        - id: ch03-b09
          speakers: [groom_1, groom_2, groom_3]
          ensemble: chorus
          text: 快看，那儿有只野兔！咱们快去捉！
        - id: ch03-b10
          speaker: governor
          text: 算了，由它去吧。兔子已经跑起来了，哪里还追得上？
        - id: ch03-b11
          speaker: narrator
          text: 没过多久，年轻人又放出第二只野兔。厨房里的人看见了，还以为是刚才那只，便再次嚷着要出去捉。省长还是说追也没用，不许任何人离开。又过一会儿，年轻人才放走第三只。它在院子里一圈又一圈地飞跑，众人以为同一只兔子一直在外面打转，怎么也不肯离开，便第三次吵着要出去抓住它。
        - id: ch03-b12
          speaker: governor
          text: 这只兔子可真肥！来，大家一起追，看这回能不能捉住它。
        - id: ch03-b13
          speaker: narrator
          text: 省长带头冲出去，其他人全跟着追。野兔拼命逃，他们也拼命追。神偷趁机拿走烤肉，飞快地跑了。省长那天中午有没有肉吃，谁也不知道。只知道他追得又热又累，却连一口兔肉也没尝到。
        - id: ch03-b14
          speaker: narrator
          text: 到了正午，劳伦斯神父来了。省长把受骗的经过说给他听，神父便没完没了地取笑他。
        - id: ch03-b15
          speaker: priest
          text: 换成我，绝不会让那种家伙把我当傻瓜耍！
        - id: ch03-b16
          speaker: governor
          text: 那你可得多加小心。说不定你还没察觉，他已经找上门了。
        - id: ch03-b17
          speaker: narrator
          text: 神父根本不听，只管重复那番话，笑省长被骗得太狼狈。下午，神偷来讨省长许下的女儿。
        - id: ch03-b18
          speaker: governor
          text: 你还得再显几手，今天这事算不上多了不起。神父正在里面骂我傻。你能不能狠狠捉弄他一次？
        - id: ch03-b19
          speaker: master_thief
          text: 这事也不难。
        - id: ch03-b20
          speaker: narrator
          text: 神偷披上巨大的白布，又在背后安了两只鹅翅膀，把自己扮成一只鸟。他爬上神父花园里的大枫树，等傍晚神父回家，便从树上高声叫他的名字。
        - id: ch03-b21
          speaker: master_thief
          text: 劳伦斯神父！劳伦斯神父！
        - id: ch03-b22
          speaker: priest
          text: 是谁在叫我？
        - id: ch03-b23
          speaker: master_thief
          text: 我是上天派来的天使，特来告诉你，你一向虔诚，可以带着肉身升入天堂。下星期一夜里，你愿意准备好启程吗？到时我来接你，把你装进口袋带走。你还得把所有金银和尘世的财物，都堆在家里最好的客厅。
        - id: ch03-b24
          speaker: narrator
          text: 劳伦斯神父当即跪在这个天使面前，向他道谢。接下来的星期日，他特意讲了一篇告别布道。他告诉众人，一位天使降临在自家花园的大枫树上，宣布他因为品行正直，将会活着升入天堂。他一面讲这件奇迹，一面向大家布道，教堂里的男女老少听说神父就要离开人间，无不落泪。
        - id: ch03-b25
          speaker: narrator
          text: 星期一夜里，神偷再次扮成天使。神父先跪下道谢，然后钻进口袋。等他装稳，神偷立刻拖着袋子翻过树桩，滚过乱石，一路往前走。
        - id: ch03-b26
          speaker: priest
          text: 哎哟！哎哟！你这是要带我去哪里？
        - id: ch03-b27
          speaker: master_thief
          text: 这就是去天堂的路。通往天堂的路可不好走。
        - id: ch03-b28
          speaker: narrator
          text: 神偷继续拖着袋子，几乎折腾掉神父半条命，最后把他扔进省长家的鹅棚。鹅群对着他嘶叫，还不停地啄他，把他弄得只剩一口气。
        - id: ch03-b29
          speaker: priest
          text: 哎哟！哎哟！哎哟！我这是到了什么地方？
        - id: ch03-b30
          speaker: master_thief
          text: 你现在到了炼狱。
        - id: ch03-b31
          speaker: narrator
          text: 神偷转身去了神父家，把上等客厅里的金银和一切贵重物品全拿走。第二天清早，看鹅姑娘来放鹅，听见有人躺在鹅棚的口袋里哀号。
        - id: ch03-b32
          speaker: goose_girl
          text: 天哪！袋子里是谁？你怎么了？
        - id: ch03-b33
          speaker: priest
          text: 你要是天堂来的天使，求你放我出去，让我回到人间吧！世上没有比这里更可怕的地方，那些小魔鬼拿钳子夹得我好疼！
          emotion: fearful
        - id: ch03-b34
          speaker: goose_girl
          text: 我可不是天使，只是替省长看鹅的。把您夹疼的那些小魔鬼，就是这些鹅。
        - id: ch03-b35
          speaker: priest
          text: 是神偷干的！哎呀，我的金子，我的银子，还有我最好的衣裳！
          emotion: angry
        - id: ch03-b36
          speaker: narrator
          text: 神父气得发狂，一路飞奔回家，看鹅姑娘还以为他突然疯了。省长听说神父怎样被装进口袋，怎样在鹅棚里受罪，笑得险些背过气去。可是等神偷前来索要他答应的女儿时，省长却又换了一副样子。他只拿好听话哄着神偷，继续搪塞，不肯立刻兑现承诺。
    - id: ch04
      title: 十二个马童守不住的马
      blocks:
        - id: ch04-b01
          speaker: governor
          text: 你还得再让我见识一回，我才能判断你究竟有多大能耐。我的马厩里有十二匹马，我会派十二个马童守着，每人骑一匹。你若能从他们胯下把马偷走，我再看看能替你做些什么。
        - id: ch04-b02
          speaker: master_thief
          text: 这件事我办得到。不过办成以后，我真能娶您的女儿吗？
        - id: ch04-b03
          speaker: governor
          text: 能。只要你做得到，我一定尽力成全你。
        - id: ch04-b04
          speaker: narrator
          text: 神偷走进一家商店，买来足够装满两只随身酒壶的白兰地。他在其中一壶里掺进安眠药，另一壶却只装白兰地。他又雇了十一个男人，让他们当天夜里藏在省长的马厩后面，等着自己的招呼。随后，他找到一位老妇人，用好话和丰厚的酬劳，从她那里借来一件破烂长袍和一件短上衣。
        - id: ch04-b05
          speaker: narrator
          text: 傍晚，神偷穿上老妇人的衣服，拄着棍子，背着袋子，一瘸一拐走向马厩。十二个马童正忙着给马喂夜水，忙得不可开交。
        - id: ch04-b06
          speaker: groom_1
          text: 你跑到这里来干什么？
        - id: ch04-b07
          speaker: master_thief
          text: 哎哟，今晚太冷了！再这么冻下去，可怜的老婆子就要没命啦。看在老天的分上，让我坐在马厩门里避一避吧。
          emotion: sad
        - id: ch04-b08
          speaker: groom_1
          text: 想也别想，马上走！省长若看见你在这里，我们全要倒霉。
        - id: ch04-b09
          speaker: groom_2
          text: 她又老又可怜，哪里伤得了谁？就让她坐一会儿吧。
        - id: ch04-b10
          speaker: narrator
          text: 其余马童都不赞成。可他们一边争论，一边还得照料马匹。神偷便一点点往里挪，最后坐到了门后。从此再也没人理会这个老婆子。
        - id: ch04-b11
          speaker: narrator
          text: 夜越来越深，马童们始终骑在马背上，渐渐冷得受不了。
        - id: ch04-b12
          speaker: groom_1
          text: 呼，真是冷得吓人！
        - id: ch04-b13
          speaker: groom_2
          text: 可不是嘛，我的牙都在打战。
        - id: ch04-b14
          speaker: groom_3
          text: 要是能有一点烟草就好了。
        - id: ch04-b15
          speaker: narrator
          text: 正好有人带着一点烟草，便分给大家。虽然每个人只分到一点，他们还是放进嘴里嚼，暂时暖和了一会儿。没过多久，众人又冷得直打哆嗦。
        - id: ch04-b16
          speaker: groom_1
          text: 呼，还是冷得要命！
        - id: ch04-b17
          speaker: master_thief
          text: 呼，我这把老骨头也快冻僵了。
        - id: ch04-b18
          speaker: narrator
          text: 神偷拿出那壶没有下药的白兰地，故意让手抖个不停，把瓶子晃来晃去。喝酒时，他还让喉咙响亮地咕咚了一声。
        - id: ch04-b19
          speaker: groom_3
          text: 老婆子，你壶里装的什么？
        - id: ch04-b20
          speaker: master_thief
          text: 哦，老爷，不过是一小口白兰地。
        - id: ch04-b21
          speakers: [groom_1, groom_2, groom_3, groom_4]
          ensemble: chorus
          text: 白兰地？快给我一口！我也要喝一口！
        - id: ch04-b22
          speaker: master_thief
          text: 唉，我只有这么一点，连你们每个人的嘴都沾不湿。
        - id: ch04-b23
          speaker: narrator
          text: 可马童们非喝不可，神偷装出没有办法的样子，只得答应。他收起刚才自己喝过的酒，取出掺了安眠药的那壶，先递到第一个人唇边。这一回，他的手再也不抖了。他稳稳托着酒壶，挨个送过去，让每个人都喝到正好的分量。等轮到最后一个人时，第十二个人还没有喝完，第一个已经坐在马背上打起了呼噜。
        - id: ch04-b24
          speaker: narrator
          text: 神偷见药力已经发作，便脱掉乞丐的破衣服。他把十二个熟睡的马童一个接一个从马背上抱下来，又轻轻放到分隔马栏的木板上，让每个人都像骑马一样骑坐着。安排妥当以后，他叫来一直等在外面的十一个帮手。十二个人一人骑上一匹省长的马，悄无声息地离开马厩，随后扬长而去。
        - id: ch04-b25
          speaker: narrator
          text: 第二天早晨，省长来到马厩查看时，十二个马童才刚刚恢复知觉。他们迷迷糊糊，还不知道马早就不见了，只顾用马刺猛踢身下的马栏隔板，踢得木屑飞得到处都是。折腾了一阵，有几个马童从板上摔了下来，还有几个仍旧骑坐在上面，一个个神情呆傻。
        - id: ch04-b26
          speaker: governor
          text: 好啦，一看就知道谁来过。你们真是一群没用的家伙！人家从你们胯下偷走了马，你们还骑在这里发呆！
          emotion: angry
        - id: ch04-b27
          speaker: narrator
          text: 十二个马童因为没守好夜，每人都挨了一顿打。当天下午，神偷来讲自己做过的事，再次要求省长兑现诺言。省长只给了他一百块钱，又说必须办成一件更了不起的事。
    - id: ch05
      title: 一桶蜂蜜酒
      blocks:
        - id: ch05-b01
          speaker: governor
          text: 我骑马外出的时候，你能从我胯下把马偷走吗？
        - id: ch05-b02
          speaker: master_thief
          text: 这个嘛，也许办得到。只是我得完完全全确定，事成以后真能娶到您的女儿。
        - id: ch05-b03
          speaker: narrator
          text: 省长说自己会尽量想办法，还告诉神偷，约定那天，他会骑马去士兵操练的大片公地。
        - id: ch05-b04
          speaker: narrator
          text: 神偷马上弄来一匹衰老不堪的母马，用青柳条和金雀花枝给它编了一副轭，又买来一辆破旧马车和一只大桶。他找到一个穷苦的乞老婆子，答应给她十块钱，请她钻进桶里，张大嘴守在龙头脱落的孔洞后面，而他会从外面把一根手指塞进洞中。他告诉她，这件事绝不会让她受伤，不过是坐车到处转一小会儿。要是他把手指抽出来不止一次，就会再给她十块钱。
        - id: ch05-b05
          speaker: narrator
          text: 安排好一切，神偷换上破衣服，把烟灰涂满身体，又戴上假发和山羊毛做的大胡子，叫谁也认不出他。他赶车来到操练场，省长早已骑着马转悠了很久。
        - id: ch05-b06
          speaker: narrator
          text: 神偷赶到以后，老母马走得又慢又安静，那辆破车简直像钉在原地。母马先费力向前拖动一点，又向后退回一点，接着便彻底停住。过一会儿，它再向前挪动一点，每一步都拉得万分吃力。省长看了半天，根本没有想到这个满身烟灰、胡子蓬乱的赶车人会是神偷。他径直骑到马车前，问那人有没有看见谁藏在附近的一片树林里。
        - id: ch05-b07
          speaker: master_thief
          text: 没有，我什么人也没看见。
        - id: ch05-b08
          speaker: governor
          text: 这样吧，你骑我的马进林子仔细搜一遍。看看那里有没有藏着人。只要你肯去，我不但把马借给你，还会给你一笔好酬劳。
        - id: ch05-b09
          speaker: master_thief
          text: 我不敢说自己能去。这桶蜂蜜酒刚取来，要送到婚宴上，可龙头半路掉了。我赶车时，只能一直用手指堵着这个洞。
        - id: ch05-b10
          speaker: governor
          text: 你只管骑马去。桶和这匹老母马都交给我照看。
        - id: ch05-b11
          speaker: master_thief
          text: 那好。不过我一抽出手指，您得立刻把自己的手指塞进去，千万小心，别让酒漏了。
        - id: ch05-b12
          speaker: narrator
          text: 省长答应一定会尽力而为。神偷再三请求他千万小心，随后抽出自己的手指。省长赶紧用手指堵住孔洞，神偷便骑上了他的马，朝那片树林走去。时间一点一点过去，天色越来越晚，赶车人却始终没有回来。省长只能站在破马车旁，一直用手指堵着孔洞。最后，他累得忍无可忍，实在顾不上所谓的蜂蜜酒，只好把手指抽了出来。
        - id: ch05-b13
          speaker: beggar_woman
          text: 这下我可以再拿十块钱啦！
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: 省长这才明白，桶里装的是哪一种“蜂蜜酒”，只得动身回家。他才走出一小段，就碰见自家仆人牵着马迎面而来。原来神偷早已把马送回省长家。
        - id: ch05-b15
          speaker: narrator
          text: 第二天，神偷来到省长面前，再次要求他依照诺言，把女儿嫁给自己。省长又说了一番好话，把他敷衍过去，只给了他三百块钱。接着，省长说他还必须完成最后一件杰作。只要这最后一件事也能办到，便再没有别的考验，可以娶走他的女儿。
    - id: ch06
      title: 床单和睡衣
      blocks:
        - id: ch06-b01
          speaker: master_thief
          text: 先说说究竟是什么事吧。也许我能办成。
        - id: ch06-b02
          speaker: governor
          text: 你有本事偷走我们床上的床单，还有我妻子的睡衣吗？
        - id: ch06-b03
          speaker: master_thief
          text: 这件事当然不是办不到。但愿我娶您的女儿，也能这么容易。
        - id: ch06-b04
          speaker: narrator
          text: 深夜，神偷来到绞刑架下，把一个吊死的强盗从绳子上割下来，扛在自己肩上带走。接着，他找来一架长梯，搭在省长卧房的窗外。他顺着梯子爬上去，把死人的脑袋举到窗边，一上一下地晃动。那颗脑袋一会儿冒出来，一会儿又缩回去，看起来就像真有人站在窗外偷偷窥视。
        - id: ch06-b05
          speaker: governor
          text: 孩子他娘，神偷就在窗外！这一回，我非开枪打死他不可！
          emotion: angry
        - id: ch06-b06
          speaker: narrator
          text: 省长拿起早就放在床边的步枪。
        - id: ch06-b07
          speaker: governor_wife
          text: 哎呀，不行，你不能开枪！明明是你自己同他约好，让他来这里的呀。
          emotion: fearful
        - id: ch06-b08
          speaker: governor
          text: 不，孩子他娘，我一定要打死他。
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: 省长躺在床上，对着窗外瞄了又瞄。可每次那颗脑袋刚一冒出来，被他瞧见，神偷便又把它缩回去。这样来回好几次，省长终于抓住机会，扣动了扳机。死尸砰的一声从梯子上重重摔在地上，神偷也用最快的速度爬下梯子，躲到一旁。
        - id: ch06-b10
          speaker: governor
          text: 我虽是这里最有权势的人，可闲话传得最快。别人要是看见这具死尸，实在太难堪。我还是出去把他埋掉吧。
        - id: ch06-b11
          speaker: governor_wife
          text: 孩子他爹，你觉得怎么妥当，就怎么办吧。
        - id: ch06-b12
          speaker: narrator
          text: 省长起床下楼，走出宅子，准备趁着夜色把那具尸体埋起来。他刚一出门，一直躲在外面的神偷就悄悄溜进屋，没有耽搁，径直上楼来到省长夫人面前。屋里昏暗，夫人果然把他当成了刚刚离开的丈夫。
        - id: ch06-b13
          speaker: governor_wife
          text: 亲爱的，孩子他爹，这么快就弄完了吗？
        - id: ch06-b14
          speaker: master_thief
          text: 是啊。我只是把他扔进一个坑，随手盖了点土。今晚外面的天气太可怕，我只能先这样，以后再好好埋他。快把床单递给我擦一擦。他一直流血，我搬他的时候，弄得满身都是血。
        - id: ch06-b15
          speaker: narrator
          text: 省长夫人把床单交给了他。
        - id: ch06-b16
          speaker: master_thief
          text: 你的睡衣也借我用用吧。只有一条床单，恐怕还不够。
        - id: ch06-b17
          speaker: narrator
          text: 省长夫人又把睡衣递给他。这时，假扮省长的神偷忽然说，自己忘了锁门，得先下楼把门锁好，才能回来睡觉。于是他带着床单和睡衣走了。
        - id: ch06-b18
          speaker: narrator
          text: 一个小时以后，真正的省长回到卧房。
        - id: ch06-b19
          speaker: governor_wife
          text: 孩子他爹，你锁一道门，怎么花了这么久？床单和睡衣又放到哪里去了？
        - id: ch06-b20
          speaker: governor
          text: 你在说什么？
        - id: ch06-b21
          speaker: governor_wife
          text: 我问的是，你刚才拿去擦身上鲜血的床单和睡衣，究竟放到哪里去了？
        - id: ch06-b22
          speaker: governor
          text: 老天啊！他竟然又胜了我一次？
          emotion: surprised
        - id: ch06-b23
          speaker: narrator
          text: 天一亮，神偷便来到省长面前，要求他按照承诺把女儿嫁给自己。这一次，省长再也不敢拿好话推托，只得交出女儿，还另外送给两人许多钱。他唯恐自己不答应，神偷下一回会连他脑袋里的眼珠子都偷走，也怕天下人知道自己一次次受骗，永远拿这件事说他的坏话。
        - id: ch06-b24
          speaker: narrator
          text: 从此，神偷过上了富足幸福的生活。至于后来他有没有再偷东西，我可没法告诉你。就算偷过，也不过是为了消遣罢了。
