  chapters:
    - id: ch01
      title: The Birch on the Grave
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man and his wife, and they had one daughter, their only child. One day, one of the family's sheep wandered away into the wood. The man and woman both set out to find it. They searched and searched among the trees, each of them taking a different part of the forest.
        - id: ch01-b02
          speaker: narrator
          text: The wife met a witch among the trees. The witch stopped her and spoke a strange threat.
        - id: ch01-b03
          speaker: witch
          text: You wretched creature! Spit into my knife sheath, or run between my legs, and I'll turn you into a black sheep.
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: The woman did neither one. Even so, the witch turned her into a sheep. Then the witch made herself look exactly like the woman and called to the husband.
        - id: ch01-b05
          speaker: witch
          text: Ho there, old man! I've found the sheep!
        - id: ch01-b06
          speaker: narrator
          text: The man believed the witch was his wife. He had no idea that the black sheep beside her was his real wife. Glad that the lost animal had been found, he went home with them both.
        - id: ch01-b07
          speaker: witch
          text: Listen, old man. We ought to kill this sheep before it runs off into the wood again.
        - id: ch01-b08
          speaker: narrator
          text: The man was quiet and peaceable. He raised no objection.
        - id: ch01-b09
          speaker: father
          text: Very well. That's what we'll do.
        - id: ch01-b10
          speaker: narrator
          text: But his daughter had heard them. She ran out to the flock and cried aloud.
        - id: ch01-b11
          speaker: girl
          text: Oh, dear Mother! They're going to kill you!
          emotion: sad
        - id: ch01-b12
          speaker: mother
          text: If they do, don't eat any of my meat or broth. Gather every one of my bones and bury them at the edge of the field.
        - id: ch01-b13
          speaker: narrator
          text: Soon afterward, they took the black sheep away from the flock and killed it. The witch made pea soup from the sheep and set a bowl before the girl. But the girl remembered every word of her mother's warning. She would not taste the meat or touch the broth. She gathered all the bones, carried them to the edge of the field, and buried them in the earth. On that very spot, a birch sprang up, and it was a wonderfully beautiful tree.
        - id: ch01-b14
          speaker: narrator
          text: Time passed. No one could have said exactly how long. Meanwhile, the witch had a child of her own. She came to hate the man's daughter and tormented her in every way she could.
    - id: ch02
      title: The First Feast
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then the King announced a grand festival at the palace. He commanded that everyone be invited and that the news be proclaimed throughout the land. The poor and outcast came driving toward the feast. So did people who were blind, crippled, or unable to walk, traveling by horse or by sea if they could.
        - id: ch02-b02
          speaker: herald
          text: Come, all you people, poor and wretched, blind or lame! Mount your horses or come by sea. Every one of you is welcome!
        - id: ch02-b03
          speaker: narrator
          text: The man's household prepared for the feast as well. The witch sent him ahead with their younger child.
        - id: ch02-b04
          speaker: witch
          text: Go on before me, old man, and take the little one. I'll leave the elder girl some work so she won't grow bored while we're gone.
        - id: ch02-b05
          speaker: narrator
          text: After they left, the witch lit the hearth. She tossed a whole pot of barley into the cinders.
        - id: ch02-b06
          speaker: witch
          text: Pick every grain out of those ashes and put it back in the pot before dark. If you don't, I'll eat you!
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: The witch hurried after the others. Left alone, the poor girl wept. She tried to gather the barley, but the task was hopeless. In her misery, she went to the birch on her mother's grave. She cried there because her mother lay beneath the earth and could no longer help her. Then, in the middle of her grief, her mother's voice rose from the grave.
        - id: ch02-b08
          speaker: mother
          text: Why are you crying, little daughter?
        - id: ch02-b09
          speaker: girl
          text: The witch scattered barley all over the hearth and ordered me to pick it from the ashes. Dear Mother, that's why I'm crying.
          emotion: sad
        - id: ch02-b10
          speaker: mother
          text: Don't cry. Break off one of my branches and strike it across the hearth. Everything will be set right.
          emotion: calm
        - id: ch02-b11
          speaker: narrator
          text: The girl broke off a birch branch and struck the hearth crosswise. At once, every grain of barley flew into the pot, and the hearth was clean. She returned the branch to the grave. Her mother told her to bathe on one side of the trunk, dry herself on another, and dress on the third.
        - id: ch02-b12
          speaker: narrator
          text: When she had done it all, she was more beautiful than anyone on earth. She received splendid clothes and a horse whose hair shone partly gold, partly silver, and partly with something more precious still. She leaped into the saddle and flew like an arrow toward the palace.
        - id: ch02-b13
          speaker: narrator
          text: As she turned into the castle courtyard, the Prince came out to meet her. He tied her horse to a pillar and led her inside. He never left her side as they walked through the castle rooms. All the guests gazed at her. They wondered who this lovely maiden was and which castle she had come from, but no one recognized her or knew anything about her.
        - id: ch02-b14
          speaker: narrator
          text: At the banquet, the Prince seated her beside him in the place of honor. Under the table, the witch's daughter gnawed on bones. The Prince did not see her and thought a dog was down there. He shoved her away with his foot and broke her arm. The poor child was not to blame for having a witch as her mother.
        - id: ch02-b15
          speaker: narrator
          text: Toward evening, the girl decided to go home. The Prince had smeared the door latch with tar, and her ring caught on it as she passed. She had no time to pull it free. She untied her horse and sped beyond the castle walls like an arrow.
        - id: ch02-b16
          speaker: narrator
          text: At the birch, she took off her fine clothes and left the horse. Then she hurried back to her place behind the stove. Soon her father and the witch came home.
        - id: ch02-b17
          speaker: witch
          text: Ah, there you are, you poor thing! You can't imagine what a wonderful time we had. The Prince carried my daughter about, but the poor child fell and broke her arm.
        - id: ch02-b18
          speaker: narrator
          text: The girl knew exactly what had happened, but she acted as though she knew nothing. She sat silently behind the stove.
    - id: ch03
      title: Two More Feasts
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, they were invited to another royal banquet.
        - id: ch03-b02
          speaker: witch
          text: Hurry and dress, old man. We're invited back to the feast. Take the child with you. I'll give the other girl work to keep her busy.
        - id: ch03-b03
          speaker: narrator
          text: The witch lit the fire and scattered a pot of hemp seed among the ashes.
        - id: ch03-b04
          speaker: witch
          text: Sort out every seed and put it back in this pot. If you fail, I'll kill you!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: The girl wept bitterly. Then she went to the birch, washed on one side of the tree, and dried herself on the other. This time, the tree gave her clothes even finer than before and a horse of wonderful beauty. She broke off a birch branch and struck the hearth with it. Every hemp seed flew out of the ashes and into the pot. With her impossible task finished, she hurried away to the castle.
        - id: ch03-b06
          speaker: narrator
          text: Again, the Prince met her in the courtyard, tied her horse to a pillar, and led her to the banquet hall. She sat beside him in the place of honor, just as she had the day before.
        - id: ch03-b07
          speaker: narrator
          text: Once again, the witch's daughter crawled under the table, gnawing bones among the guests' feet. The Prince never noticed her. When he pushed her away by mistake, he broke her leg. She had the worst of luck.
        - id: ch03-b08
          speaker: narrator
          text: The girl left early again. This time, the Prince had covered the doorposts with tar. Her golden circlet stuck fast as she went through. She could not stop to find it. She mounted her horse and raced like an arrow back to the birch.
        - id: ch03-b09
          speaker: girl
          text: Mother, I lost my circlet at the castle. It stuck to the tar on the doorpost.
        - id: ch03-b10
          speaker: mother
          text: Even if you had lost two circlets, I could give you finer ones.
        - id: ch03-b11
          speaker: narrator
          text: The girl hurried home. By the time her father and the witch returned, she was back in her usual place behind the stove.
        - id: ch03-b12
          speaker: witch
          text: Poor thing, you should have seen what we saw! The Prince carried my daughter from room to room. He did drop her, though, and now her foot is broken.
        - id: ch03-b13
          speaker: narrator
          text: The man's daughter said nothing and kept working around the hearth.
        - id: ch03-b14
          speaker: narrator
          text: At dawn the following morning, the witch woke her husband and announced that they had been invited to the palace once more. She gave him the younger child and promised to leave the elder girl work so she would not grow tired of being alone.
        - id: ch03-b15
          speaker: narrator
          text: This time, the witch poured a dish of milk over the ashes.
        - id: ch03-b16
          speaker: witch
          text: Get every drop of that milk back into the dish before I return, or you'll suffer for it.
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: The girl was more frightened than ever. She ran to the birch, and its magic completed the task. Then, dressed in finery again, she rode to the palace.
        - id: ch03-b18
          speaker: narrator
          text: The Prince was already waiting for her in the courtyard. He brought her into the hall, where everyone treated her with great honor. Under the table, the witch's daughter sucked on bones and crawled among the guests' feet. No one noticed her there. In the confusion beneath the table, someone struck her and knocked out one of her eyes. The poor child had suffered another terrible misfortune.
        - id: ch03-b19
          speaker: narrator
          text: Still, no one knew the beautiful maiden or where she came from. The Prince had spread tar across the threshold. When she fled, her golden slippers stuck there. She reached the birch without them and put aside her fine clothes.
        - id: ch03-b20
          speaker: girl
          text: Oh, dear Mother! I've lost my golden slippers.
          emotion: sad
        - id: ch03-b21
          speaker: mother
          text: Leave them there. If you need more, I'll give you finer ones.
          emotion: calm
        - id: ch03-b22
          speaker: narrator
          text: The girl had barely returned to her place behind the stove when her father and the witch came home.
        - id: ch03-b23
          speaker: witch
          text: Ah, you poor fool! There's nothing for you to see here, while we saw marvelous things at the palace. My little girl was carried about again, but she fell and lost an eye. What could a stupid thing like you know of any of it?
        - id: ch03-b24
          speaker: girl
          text: That's true. What could I know? I had enough work just getting the hearth clean.
    - id: ch04
      title: The Prince Chooses a Bride
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Prince had kept the ring, circlet, and slippers. On the fourth day, he held a great banquet and invited everyone to the palace so he could find their owner.
        - id: ch04-b02
          speaker: narrator
          text: The witch prepared her daughter for the feast. She fastened a wooden beetle where the girl's foot had been, a log where her arm had been, and a lump of dirt in the empty eye socket. Then she took her to the castle.
        - id: ch04-b03
          speaker: narrator
          text: When the crowd had gathered, the Prince stepped among them and made his promise.
        - id: ch04-b04
          speaker: prince
          text: The maiden whose finger fits this ring, whose head fits this golden circlet, and whose foot fits this slipper will become my bride.
        - id: ch04-b05
          speaker: narrator
          text: Everyone tried the three things. They did not fit a single person.
        - id: ch04-b06
          speaker: prince
          text: The cinder girl isn't here. Bring her to me and let her try them.
        - id: ch04-b07
          speaker: narrator
          text: They fetched the girl. The Prince was about to offer her the ornaments when the witch held him back.
        - id: ch04-b08
          speaker: witch
          text: Don't hand those to her! She'll cover them in ashes. Give them to my daughter instead.
        - id: ch04-b09
          speaker: narrator
          text: So the Prince gave the ring to the witch's daughter. The witch filed and pared at her daughter's finger until the ring finally went on. Then came the golden circlet and the slippers. The witch still refused to let the cinder girl try them. She worked at her own daughter's head and feet until she forced the circlet and shoes into place too.
        - id: ch04-b10
          speaker: narrator
          text: What could the Prince do now? He had promised to marry the maiden who could wear all three things, so he had to accept the witch's daughter as his bride. Yet he was ashamed to hold wedding festivities at the palace with such a strange bride. Instead, he slipped away with her to her father's house.
        - id: ch04-b11
          speaker: narrator
          text: Several days passed. At last, the Prince had to bring his bride back to the palace. As they took their leave, the cinder girl jumped down from her place by the stove. Pretending she needed something from the cowhouse, she passed the Prince in the yard and whispered to him.
        - id: ch04-b12
          speaker: girl
          text: Dear Prince, please don't take away my silver and gold.
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: At once, the Prince recognized her. He took both girls with him and set out. When they reached a river, he threw the witch's daughter across it to serve as a bridge. Then he crossed over with the cinder girl.
        - id: ch04-b14
          speaker: narrator
          text: The witch's daughter lay across the river and could not move. No one was near to help her, and her heart was full of grief. At last, she cried out in anguish.
        - id: ch04-b15
          speaker: witch_daughter
          text: Let a golden hemlock grow from my body. Perhaps my mother will see it and know it's me.
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: The moment she spoke, a golden hemlock rose from her body and stood upon the bridge.
        - id: ch04-b17
          speaker: narrator
          text: Once the witch's daughter was gone, the Prince welcomed the cinder girl as his true bride. They traveled together to the wonderful birch that grew over her mother's grave. There the girl received treasures and riches of every kind. There were three whole sacks of gold, an equal amount of silver, and a splendid horse. The horse carried the bride and all those riches safely home to the palace.
        - id: ch04-b18
          speaker: narrator
          text: The Prince and his wife lived there for a long while, and in time she bore him a son.
    - id: ch05
      title: The Reindeer in the Wood
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: News reached the witch that her daughter had given birth to a boy. Everyone still believed the young Queen was the witch's daughter.
        - id: ch05-b02
          speaker: witch
          text: So, so. I'd better take my gift to the new baby.
        - id: ch05-b03
          speaker: narrator
          text: The witch set off for the palace. At the river, she saw the beautiful golden hemlock growing from the middle of the bridge. She began cutting it down to take to her grandchild, but a voice moaned from the tree.
        - id: ch05-b04
          speaker: witch_daughter
          text: Oh, Mother, please don't cut me like that!
          emotion: sad
        - id: ch05-b05
          speaker: witch
          text: Is that you in there?
          emotion: surprised
        - id: ch05-b06
          speaker: witch_daughter
          text: Yes, dear Mother. They threw me across the river and made a bridge out of me.
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: In an instant, the witch shattered the bridge into pieces. Then she rushed on to the palace and went straight to the young Queen's bed. There she began working her magic.
        - id: ch05-b08
          speaker: witch
          text: Spit on the blade of my knife, you wretch. Enchant the blade for me, and I'll turn you into a reindeer of the forest.
          emotion: angry
        - id: ch05-b09
          speaker: girl
          text: Have you come back to make trouble for me again?
        - id: ch05-b10
          speaker: narrator
          text: The young woman did not spit on the blade. She did nothing the witch demanded. That did not stop the magic. The witch turned her into a reindeer and sent her away to the forest. Then she smuggled her own daughter into the Queen's place and passed her off as the Prince's wife.
        - id: ch05-b11
          speaker: narrator
          text: The baby soon grew restless. He missed his mother's care and cried without end. They carried him out into the court and tried every possible way to soothe him. Wherever they carried him, they held him, tended him, and did all they could, but his crying never ceased.
        - id: ch05-b12
          speaker: prince
          text: Why is the child so restless?
        - id: ch05-b13
          speaker: narrator
          text: The Prince went to a wise widow and asked for her advice.
        - id: ch05-b14
          speaker: widow
          text: Ah, your real wife isn't at home. She's living as a reindeer in the wood. The woman in your palace is the witch's daughter, and the witch is your mother-in-law.
        - id: ch05-b15
          speaker: prince
          text: Is there any way to bring my true wife back from the forest?
        - id: ch05-b16
          speaker: widow
          text: Give me the baby. Tomorrow, when I drive the cows to the wood, I'll take him with me. I'll rustle the birch leaves and shake the aspens. Perhaps those sounds will quiet him.
        - id: ch05-b17
          speaker: prince
          text: Yes, take him with you into the wood. See if you can soothe him there.
        - id: ch05-b18
          speaker: narrator
          text: The Prince brought the widow into the castle. The witch heard what they planned and tried to stop them.
        - id: ch05-b19
          speaker: witch
          text: What's this? You're sending the baby away into the forest?
        - id: ch05-b20
          speaker: prince
          text: Carry him through the wood. Perhaps the fresh air will calm him.
        - id: ch05-b21
          speaker: narrator
          text: The widow took the child to the wood and came to the edge of a marsh. When she saw a herd of reindeer, she began to sing.
        - id: ch05-b22
          speaker: widow
          text: Little Bright-eyes, little Redskin, come nurse the child you bore. That bloodthirsty monster, that grim man-eater, shall tend him no more. They may threaten and force him still, but he turns from her and shrinks away.
        - id: ch05-b23
          speaker: narrator
          text: At once, one reindeer left the herd and came near. She nursed and cared for the child all day. At nightfall, she had to follow the herd again.
        - id: ch05-b24
          speaker: girl
          text: Bring me the child tomorrow and the day after that. Then I must roam far away with the herd to other lands.
          emotion: sad
        - id: ch05-b25
          speaker: narrator
          text: The next morning, the widow returned to the castle for the baby. As before, the witch objected.
        - id: ch05-b26
          speaker: prince
          text: Take him into the open air. He was quieter last night after spending the day in the wood.
        - id: ch05-b27
          speaker: narrator
          text: The widow carried the child in her arms all the way back to the marsh. There she sang the same song she had sung the day before. At once, the reindeer left the herd and came to her baby. She nursed him and tended him for the whole day, just as she had before. With that care, the child thrived until no finer boy could be found anywhere.
    - id: ch06
      title: The Queen Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: All this time, the Prince had been thinking over what had happened. At last, he spoke to the widow.
        - id: ch06-b02
          speaker: prince
          text: Can the reindeer ever be changed back into a woman?
        - id: ch06-b03
          speaker: widow
          text: I can't say for certain. Come into the wood with me. When she removes her reindeer skin, I'll comb her hair. While I do that, you must burn the skin.
        - id: ch06-b04
          speaker: narrator
          text: The Prince and widow went into the forest with the baby. Before long, the reindeer appeared and nursed the child as usual.
        - id: ch06-b05
          speaker: widow
          text: You're going far away tomorrow, and I may never see you again. Let me comb your hair one last time, so I'll have something to remember you by.
          emotion: sad
        - id: ch06-b06
          speaker: narrator
          text: The young woman slipped off her reindeer skin and let the widow comb her hair. While they were occupied, the Prince quietly threw the skin into the fire.
        - id: ch06-b07
          speaker: girl
          text: What is that burning smell?
        - id: ch06-b08
          speaker: narrator
          text: She turned and saw her own husband. Then she saw the burning skin.
        - id: ch06-b09
          speaker: girl
          text: Oh, no! You burned my skin. Why did you do it?
          emotion: surprised
        - id: ch06-b10
          speaker: prince
          text: So you could have your human form again.
        - id: ch06-b11
          speaker: girl
          text: But now I have nothing to cover me. What am I going to do?
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: With no skin to cover her, the young woman began changing shape. First she became a distaff. Then she became a wooden beetle, and after that a spindle. She took on one form after another, every kind of shape imaginable. Each time she changed, the Prince destroyed that shape too. He went on until there were no more shapes left, and she stood before him in her own human form again.
        - id: ch06-b13
          speaker: girl
          text: Why would you take me home? The witch is sure to eat me!
          emotion: fearful
        - id: ch06-b14
          speaker: prince
          text: She will not eat you.
        - id: ch06-b15
          speaker: narrator
          text: The Prince, his wife, and their child left the forest and started home together. When the false wife and her witch mother saw the true Queen returning in her human form, they did not stay to face her. The witch and her daughter turned and ran away together. If the witch has never stopped since that day, she must still be running now, though she has grown very old.
        - id: ch06-b16
          speaker: narrator
          text: The Prince, his true wife, and their baby lived happily ever after.
