audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    witch:
      display_name: 女巫
      tts:
        delivery: 阴狠专横，假装亲热时透着虚伪
        timbre: 干涩低沉
        pace: 适中
        pitch: 中低
    good_man:
      display_name: 老实人
      tts:
        delivery: 温顺朴实，说话简短而迟缓
        timbre: 温厚平实
        pace: 稍慢
        pitch: 中低
    girl:
      display_name: 姑娘
      tts:
        delivery: 善良坚忍，悲伤时真切，面对亲人时柔软
        timbre: 年轻清澈
        pace: 适中
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱安定，带着来自远处的温柔力量
        timbre: 柔和温暖
        pace: 从容
        pitch: 中等
    herald:
      display_name: 传令官
      tts:
        delivery: 洪亮庄重，像在广场上宣读王命
        timbre: 清亮有力
        pace: 稳健
        pitch: 中等
    prince:
      display_name: 王子
      tts:
        delivery: 年轻坚定，困惑时坦率，认清真相后果断
        timbre: 清朗明亮
        pace: 适中
        pitch: 中等
    witch_daughter:
      display_name: 女巫的女儿
      tts:
        delivery: 受苦时悲切，对母亲说话仍带依赖
        timbre: 年轻偏细
        pace: 适中
        pitch: 中高
    wise_widow:
      display_name: 聪明的寡妇
      tts:
        delivery: 见多识广，语气直白沉稳
        timbre: 苍老温和
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 黑羊与白桦树
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一对夫妻，只生了一个女儿。一天，家里有只羊走丢了。夫妻俩便进森林寻找，一个朝这边走，一个朝那边走，找了又找。妻子找着找着，忽然遇见了一个女巫。
        - id: ch01-b02
          speaker: witch
          text: 你这个贱东西，敢吐唾沫，敢把唾沫吐进我的刀鞘，或是敢从我两腿中间钻过去，我就把你变成黑羊。
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 女人既没有吐唾沫，也没有从女巫两腿中间钻过，可女巫还是把她变成了一只黑羊。随后，女巫又施展法术，变得跟她一模一样，朝远处的男人大喊。
        - id: ch01-b04
          speaker: witch
          text: 喂，老头子！我已经找到那只羊啦！
        - id: ch01-b05
          speaker: narrator
          text: 男人把女巫当成了妻子，根本不知道身旁那只黑羊才是自己的妻子。他见走失的羊找回来了，心里十分高兴，便跟着女巫回了家。两人平安到家以后，女巫马上劝他杀羊，免得羊再逃进森林。
        - id: ch01-b06
          speaker: good_man
          text: 好，那就这么办吧。
        - id: ch01-b07
          speaker: narrator
          text: 男人生性温顺，毫不反对。女儿却听见了他们的话。她跑进羊群，哭着扑到黑羊身边。
        - id: ch01-b08
          speaker: girl
          text: 亲爱的小妈妈，他们要把你杀掉了！
          emotion: sad
        - id: ch01-b09
          speaker: mother
          text: 好孩子，要是他们真杀了我，你别吃我的肉，也别喝拿我煮的汤。把我的骨头全收好，埋到田边去。
        - id: ch01-b10
          speaker: narrator
          text: 不久，他们从羊群里牵出黑羊，把它杀掉了。女巫用羊肉煮成一锅豌豆汤，特意端到姑娘面前。姑娘牢牢记得母亲的话，肉没有吃，汤也一口没碰。她把所有骨头收好，带到田边埋进土里。就在那个地方，长出一棵白桦树，一棵美丽极了的白桦树。
        - id: ch01-b11
          speaker: narrator
          text: 日子一天天过去，谁也说不清他们在那里又住了多久。这期间，女巫生下一个女儿。后来，她越来越憎恨男人的大女儿，想尽各种办法折磨她。恰在这时，王宫要举行一场盛大的庆典。国王下令，所有百姓都要受到邀请，还让传令官四处宣告。
        - id: ch01-b12
          speaker: herald
          text: 百姓们，都来吧！穷人苦人都来吧！瞎眼瘸腿也别怕，骑马乘船进宫吧。
        - id: ch01-b13
          speaker: narrator
          text: 无家可归的人、残疾人、跛脚的人和失明的人，全都乘车赶去参加国王的宴会。老实人家里也忙着准备进宫。女巫叫男人带着他们的小女儿先走，说自己要给大女儿留点活儿，免得一家人都不在时，她一个人无聊。
        - id: ch01-b14
          speaker: narrator
          text: 等男人一走，女巫点起炉火，把满满一锅大麦撒进灰烬。
        - id: ch01-b15
          speaker: witch
          text: 天黑以前，你要是不能把大麦一粒粒挑出来，全装回锅里，我就吃了你！
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 女巫说完便匆匆追赶其他人，留下可怜的姑娘独自在家哭泣。姑娘也试着从灰里捡起麦粒，可没过多久，她就明白这番辛苦根本不会有用。她伤心极了，只好来到母亲坟上的白桦树下，哭了又哭。母亲埋在泥土里，再也不能帮她了。可她正哭得悲痛，坟中忽然传来母亲的声音。
        - id: ch01-b17
          speaker: mother
          text: 小女儿，你为什么哭呀？
        - id: ch01-b18
          speaker: girl
          text: 女巫把大麦撒进炉膛，要我从灰里全捡出来。亲爱的小妈妈，我就是为这个才哭的。
          emotion: sad
        - id: ch01-b19
          speaker: mother
          text: 别哭。折下我的一根树枝，横一下、竖一下地抽打炉膛，一切就会好起来。
          emotion: calm
        - id: ch01-b20
          speaker: narrator
          text: 姑娘照着做了。白桦枝横一下、竖一下地打过炉膛，大麦便全飞回锅里，炉膛也变得干干净净。她回到白桦树下，把树枝放在坟上。母亲又让她到树干的一边洗澡，另一边擦干身体，第三边穿衣。姑娘一一照办。转眼间，她变得世间无人能比的美丽，还得到一身华服和一匹奇异的骏马。马毛有金的，有银的，还有一部分比金银更珍贵。
    - id: ch02
      title: 三次王宫宴会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姑娘跃上马背，像箭一样赶到王宫。她刚转进城堡的庭院，王子便迎了出来，亲手把马拴在柱子上，再领她入内。两人走过一间间厅堂，王子始终陪在她身旁。所有人都盯着姑娘看，猜不出她究竟是谁，又来自哪一座城堡。可谁也不认得她，谁也说不出她的来历。
        - id: ch02-b02
          speaker: narrator
          text: 宴席上，王子请她坐在自己身边。女巫的女儿却躲在桌下啃骨头。王子没看见她，还以为那里有条狗，抬脚一推，竟把她的胳膊弄断了。你是不是也觉得她可怜？母亲是女巫，可不是她的错。
        - id: ch02-b03
          speaker: narrator
          text: 到了傍晚，姑娘觉得该回家了。她走到门边，戒指忽然钩在门闩上。原来，王子早叫人在那里涂了焦油。姑娘顾不得把戒指取下来，赶紧解开柱子旁的马，骑上去冲出城堡。她像箭一样飞奔到白桦树旁，脱下华服，把骏马留在那里，又急忙钻回炉子后面的老地方。没多久，女巫也回家了，一进门便向她夸耀。
        - id: ch02-b04
          speaker: witch
          text: 哟，你这个可怜虫，果然还在这儿！你哪知道我们在王宫玩得多快活。国王的儿子一直抱着我的女儿，可怜的孩子却摔断了胳膊。
        - id: ch02-b05
          speaker: narrator
          text: 姑娘很清楚事情究竟怎样，却装作什么也不知道，一声不响地坐在炉后。第二天，他们再次受邀赴宴。女巫催男人快把衣服穿好，带上小女儿先走。她说要给另一个姑娘留点活儿，免得她发闷。等两人离开，女巫点起火，把一锅大麻籽倒进炉灰，威胁姑娘，要是不能全部挑回锅里，就杀了她。
        - id: ch02-b06
          speaker: narrator
          text: 姑娘伤心地哭了一场，又来到白桦树下。她在树的一边洗净身子，到另一边擦干，随后得到比昨天更加华丽的衣裳和一匹更美的骏马。她折下一根白桦枝，朝炉膛一打，所有种子立刻飞回锅里。姑娘随即赶到城堡。王子照旧出来迎接，把马拴好，领她进入宴会大厅，还请她坐在自己身旁的贵宾席上。女巫的女儿仍在桌下啃骨头。王子始终没看见她在人们脚边爬，一不小心又把她的腿弄断了。她的运气实在糟透了。
        - id: ch02-b07
          speaker: narrator
          text: 姑娘早早离席，可门柱也被涂了焦油，她的金环粘在上面。她只好把它留下，骑马回到白桦树下。
        - id: ch02-b08
          speaker: girl
          text: 小妈妈，我把金环丢在城堡了。门柱上有焦油，它粘得牢牢的。
        - id: ch02-b09
          speaker: mother
          text: 别担心。就算丢了两个，我也能给你更漂亮的。
          emotion: calm
        - id: ch02-b10
          speaker: narrator
          text: 姑娘急忙回家，在父亲和女巫回来之前，坐回炉子后面的老地方。女巫一进门便又来嘲弄她，说家里没什么可看，远远比不上王宫。她还吹嘘王子抱着自己的女儿，从一个房间走到另一个房间，只是不小心把她摔下来，跌断了脚。姑娘始终不作声，只顾在炉膛边忙活。
        - id: ch02-b11
          speaker: narrator
          text: 第三天刚亮，女巫又叫男人带小女儿进宫。这一回，她把一碟牛奶全泼进灰里，命令姑娘在自己回家以前，一滴不少地收回碟中，否则就要她吃苦头。
        - id: ch02-b12
          speaker: narrator
          text: 这一回，姑娘真的吓坏了。她跑到白桦树下，靠白桦的魔力完成了差事，随后又像前两次那样换上华服，骑马赶往王宫。她来到庭院时，王子早已在那里等候。他领姑娘进入大厅，让她受到最高的礼遇。桌子底下，女巫的女儿吮着骨头，又缩在人们脚边爬来爬去，结果可怜巴巴地被撞瞎了一只眼睛。
        - id: ch02-b13
          speaker: narrator
          text: 宴会上的人和从前一样，谁也认不出这位美丽的姑娘，更不知道她来自哪里。王子这次又叫人在门槛上涂了焦油。姑娘匆忙离开时，一双金鞋牢牢粘在那里。她不敢停留，只好赶回白桦树旁，脱下华服，再向母亲哭诉。
        - id: ch02-b14
          speaker: girl
          text: 哎呀，小妈妈，我把金鞋丢了！
          emotion: sad
        - id: ch02-b15
          speaker: mother
          text: 随它去吧。你若需要，我会给你更漂亮的。
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: 姑娘刚坐回炉子后面，女巫就回来了。她嘲笑姑娘什么也没见识，还吹嘘自己的女儿又被王子抱来抱去，只是倒霉摔瞎了一只眼睛。
        - id: ch02-b17
          speaker: witch
          text: 你这个蠢东西，懂得什么？
        - id: ch02-b18
          speaker: girl
          text: 是啊，我能懂什么呢？我光顾着把炉膛弄干净，就够忙的了。
    - id: ch03
      title: 金银饰物的主人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子把姑娘三次丢下的戒指、金环和金鞋全都收好，决定找出它们真正的主人。第四天，他又举办了一场盛宴，邀请所有百姓来到王宫。女巫也准备赴宴。她把木杵绑在女儿断脚的位置，用一根木头接上她的断臂，再往空眼窝里塞进一团泥巴，就这样带着女儿来到城堡。
        - id: ch03-b02
          speaker: prince
          text: 哪位姑娘能戴上这枚戒指，让金环正好箍住她的头，脚也正好穿进金鞋，她就是我的新娘。
        - id: ch03-b03
          speaker: narrator
          text: 人人争着试戴试穿，可谁也戴不上，谁也穿不了。王子这才发现烧火丫头没来，命人把她叫来。正要把饰物交给姑娘，女巫拦住了他。
        - id: ch03-b04
          speaker: witch
          text: 别给她！她身上全是炉灰，碰什么都弄脏。还是让我女儿试吧。
        - id: ch03-b05
          speaker: narrator
          text: 王子只好先交出戒指。女巫拿着工具又锉又削，把女儿的手指磨细，直到戒指硬生生套了进去。金环和金鞋也是一样。她死活不肯让烧火丫头试，反倒又去削砍自己女儿的脑袋和脚，终于把三样东西都强行套上。这下怎么办呢？王子不愿意也得娶她。可他实在羞于在王宫为这样古怪的新娘办婚礼，只得悄悄跟她去了她父亲家。
        - id: ch03-b06
          speaker: narrator
          text: 几天后，王子终究要带新娘回宫。临行时，烧火丫头假称要去牛棚取东西，从炉边跳下来，经过院子时在王子耳边低声说。
        - id: ch03-b07
          speaker: girl
          text: 亲爱的王子，请别夺走我的金银。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 王子一听这句话，一下认出了满身炉灰的姑娘。他把两个姑娘都带走，一起踏上归途。走出一段路，他们来到一条河边。王子把女巫的女儿横架在河上，让她充当一座桥，自己带着烧火丫头从她身上走过河去。女巫的女儿就这样横在河面上，一动也不能动，心中悲痛得像火烧一样。四下又没有人来救她，她只得在痛苦中哭喊。
        - id: ch03-b09
          speaker: witch_daughter
          text: 愿我的身体长出一株金色毒芹！也许母亲看见这个记号，就能认出我。
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: 她刚说完，身上便长出一株金色毒芹，高高立在桥上。王子摆脱了她，这才亲热地问候烧火丫头，把她当作真正的新娘。两人一同来到母亲坟上的白桦树下，在那里得到了各式各样的财宝，有三口袋黄金，有同样多的白银，还有一匹神骏非凡的马。骏马驮着他们回到王宫。两人在宫中共同生活了很久。后来，年轻的王妃为王子生下一个男孩。人人都以为她就是女巫的女儿，所以消息也传到了女巫耳中。
        - id: ch03-b11
          speaker: witch
          text: 好啊，好啊。我最好赶紧去给小娃娃送份礼物。
        - id: ch03-b12
          speaker: narrator
          text: 女巫说走就走。来到河岸时，她看见一株美丽的金色毒芹，正长在桥中央。她觉得这正好可以送给外孙，便动手砍了起来。可刀刃刚落下，毒芹中就传出一声痛苦的哀叫。
        - id: ch03-b13
          speaker: witch_daughter
          text: 亲爱的小妈妈，别这样砍我！
          emotion: sad
        - id: ch03-b14
          speaker: witch
          text: 你在这里吗？
          emotion: surprised
        - id: ch03-b15
          speaker: witch_daughter
          text: 我真的在这里，小妈妈。他们把我横架在河上，拿我当桥。
          emotion: sad
        - id: ch03-b16
          speaker: narrator
          text: 女巫听完，立刻把那座桥砸得粉碎，把女儿从桥中救了出来。随后，她匆匆赶往王宫，径直走到年轻王妃的床前。就像从前在森林里一样，她又对王妃施起了魔法。
        - id: ch03-b17
          speaker: witch
          text: 你这个贱东西，往我的刀刃上吐唾沫！替刀刃施个魔法，我就把你变成森林里的驯鹿。
          emotion: angry
        - id: ch03-b18
          speaker: girl
          text: 你又来害我了吗？
        - id: ch03-b19
          speaker: narrator
          text: 王妃没有吐唾沫，也没有照女巫的话做任何事，女巫仍旧把她变成了一头驯鹿。随后，她偷偷把自己的女儿送到王妃的位置上，让她取代真正的妻子。孩子得不到母亲的照料，立刻变得烦躁不安，整日哭个不停。人们把他抱到宫廷里，想尽一切能够想到的办法哄他，可他的哭声始终没有停下。
    - id: ch04
      title: 森林里的母亲
      blocks:
        - id: ch04-b01
          speaker: prince
          text: 孩子为什么总是这样不安？
        - id: ch04-b02
          speaker: narrator
          text: 王子去请教一位聪明的寡妇。寡妇听完，立刻说出了真相。
        - id: ch04-b03
          speaker: wise_widow
          text: 唉呀，你真正的妻子根本不在家。她变成驯鹿，住在森林里。现在跟你做夫妻的是女巫的女儿，女巫倒成了你的岳母。
        - id: ch04-b04
          speaker: prince
          text: 那我怎样才能把真正的妻子带回来？
        - id: ch04-b05
          speaker: wise_widow
          text: 把孩子交给我。明天赶牛进森林，我带他一起去。我会拨得白桦叶沙沙响，让白杨叶轻轻颤。也许他听着这些声音，就能安静了。
        - id: ch04-b06
          speaker: prince
          text: 好，你把孩子带去森林里哄一哄。
        - id: ch04-b07
          speaker: narrator
          text: 王子把寡妇领进城堡。女巫听说孩子要去森林，立刻起了疑心，想要阻拦。王子却坚持自己的命令。
        - id: ch04-b08
          speaker: prince
          text: 抱着孩子在林子里走走吧，也许他就不哭了。
        - id: ch04-b09
          speaker: narrator
          text: 寡妇抱着孩子来到森林，走到沼泽边，看见那里有一群驯鹿，便唱起歌来。
        - id: ch04-b10
          speaker: wise_widow
          text: 亮眼睛呀，红皮肤，快来照料亲生儿！嗜血的妖怪，吃人的恶魔，再不能喂他照看他。任凭她威逼又强迫，孩子见她只会躲！
        - id: ch04-b11
          speaker: narrator
          text: 歌声刚落，一头驯鹿便离开鹿群，走到孩子身旁。她给孩子喂奶，又细心照料他，就这样陪了孩子整整一天。到了夜晚，她再舍不得也必须跟随鹿群离开。临走以前，她特意叮嘱寡妇。
        - id: ch04-b12
          speaker: girl
          text: 明天把孩子带来，后天也再来一次。过了后天，我就得跟鹿群远走，到别的国度去了。
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: 第二天早上，寡妇又去接孩子。女巫自然百般阻拦，王子却发现，孩子白天只要在森林里待过，晚上确实安静许多，便准许寡妇再带他出去。
        - id: ch04-b14
          speaker: narrator
          text: 寡妇抱着孩子，再次来到森林里的沼泽边，唱起头一天那支歌。驯鹿立刻离开鹿群，来到孩子身旁，像前一天那样喂他、照料他。孩子就这样一天天长得强壮，任凭到哪里，也找不出比他更健美的男孩。王子一直把这些事情放在心里，想了又想，终于开口询问寡妇。
        - id: ch04-b15
          speaker: prince
          text: 难道没有办法让驯鹿重新变回人吗？
        - id: ch04-b16
          speaker: wise_widow
          text: 我也不大清楚。不过，你跟我进森林吧。等她脱下鹿皮，我替她梳头。趁我梳头的时候，你一定要烧掉那张皮。
    - id: ch05
      title: 恢复人形
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，王子和寡妇带着孩子一同进了森林。他们刚到不久，驯鹿便从鹿群中出现，走到孩子身边，像从前一样给他喂奶、照料他。等母子俩安静地待在一起，寡妇走到驯鹿身旁，对她说起分别的话。
        - id: ch05-b02
          speaker: wise_widow
          text: 你明天就要远走，往后我们再也见不到了。让我最后替你梳一次头，留作纪念吧。
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: 年轻的王妃答应了这个请求。她从身上脱下驯鹿皮，重新显出人的模样，坐下来让寡妇替自己梳头。就在寡妇梳头的时候，躲在一旁的王子悄悄拿起鹿皮，把它扔进了火里。
        - id: ch05-b04
          speaker: girl
          text: 这里怎么有股烧焦的味道？苦啊，原来是你！你为什么烧掉我的皮？
          emotion: surprised
        - id: ch05-b05
          speaker: prince
          text: 为了让你重新变回人。
        - id: ch05-b06
          speaker: girl
          text: 哎呀，我这个可怜人，现在连遮身的东西都没有了！
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: 王妃先把自己变成一根纺线杆，接着变成一只木杵，然后又变成纺锤。她还不停变化，变成种种能够想象出来的模样。可无论她变成什么，王子都把那样东西毁掉。直到所有形态都被破除，她才终于恢复原形，以人的模样重新站在丈夫面前。
        - id: ch05-b08
          speaker: girl
          text: 你为什么还要带我回家？女巫一定会吃掉我的！
          emotion: fearful
        - id: ch05-b09
          speaker: prince
          text: 她不会吃掉你。
          emotion: calm
        - id: ch05-b10
          speaker: narrator
          text: 于是，夫妻俩带着孩子踏上归途。女巫假扮的妻子看见他们回来，立刻带着女儿逃跑了。要是她至今还没停下，如今年纪一大把，也仍在奔逃呢。王子、妻子和孩子从此幸福地生活在一起。这个故事采自俄罗斯—卡累利阿地区。
