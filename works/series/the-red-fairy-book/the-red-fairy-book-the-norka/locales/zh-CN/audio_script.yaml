audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严而慈爱，忧虑时仍保持克制
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低
    prince_ivan:
      display_name: 伊凡王子
      tts:
        delivery: 质朴勇敢，面对险境时果断坚定
        timbre: 年轻清朗
        pace: 适中
        pitch: 中等
    eldest_prince:
      display_name: 大王子
      tts:
        delivery: 自负懒散，起坏心时压低声音
        timbre: 成熟明亮
        pace: 适中
        pitch: 中等
    second_prince:
      display_name: 二王子
      tts:
        delivery: 轻率胆怯，附和兄长时显得急切
        timbre: 年轻偏亮
        pace: 稍快
        pitch: 中等
    norka:
      display_name: 诺尔卡
      tts:
        delivery: 凶猛粗野，受挫时仍带着挑衅
        timbre: 粗砺低沉
        pace: 稍慢
        pitch: 低
    enchanted_horse:
      display_name: 神奇的马
      tts:
        delivery: 忠诚恭敬，语气沉着
        timbre: 清晰厚实
        pace: 适中
        pitch: 中低
    copper_princess:
      display_name: 铜宫公主
      tts:
        delivery: 热情坦率，言谈带着古老童话的庄重
        timbre: 柔和明亮
        pace: 从容
        pitch: 中高
    youngest_princess:
      display_name: 金宫公主
      tts:
        delivery: 聪慧坚定，关键时刻勇敢直言
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    great_bird:
      display_name: 巨鸟
      tts:
        delivery: 威严爽直，对恩人怀着真诚感激
        timbre: 宽厚有力
        pace: 稍慢
        pitch: 低
    tailor:
      display_name: 裁缝
      tts:
        delivery: 老实谨慎，遇到难事时局促不安
        timbre: 朴实温和
        pace: 适中
        pitch: 中等
  chapters:
    - id: ch01
      title: 鹿苑里的怪兽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后有三个儿子。两个哥哥头脑聪明，小儿子却被人当成傻小子。国王的鹿苑里养着许多野兽，可一头叫诺尔卡的庞然怪兽总在夜里闯进来，每回都要吞吃几只。国王用尽办法也除不掉它，只好召来三个儿子。
        - id: ch01-b02
          speaker: king
          text: 你们谁能杀死诺尔卡，我就把半壁江山赐给谁。
        - id: ch01-b03
          speaker: narrator
          text: 大王子先接下差事。天黑后，他带着兵器出门，还没到鹿苑，却先进了酒馆。他在那里纵情作乐，整整闹了一夜。等他清醒过来，天早已大亮。他知道自己在父王面前丢尽了脸，却再也无法挽回。第二天，二王子照样去了，也照样在酒馆里过了一夜。父王把两人狠狠训了一顿，这事便算完了。
        - id: ch01-b04
          speaker: narrator
          text: 第三天轮到小王子。众人都笑他愚笨，认定他什么也做不成。他没有理会，只管带着兵器走进鹿苑。他坐在草地上，把兵器支在身旁，只要一打瞌睡，尖刃就会把自己扎醒。
        - id: ch01-b05
          speaker: narrator
          text: 午夜钟声一响，大地便震颤起来。诺尔卡猛冲过来，仗着身躯巨大，一下撞破围栏。小王子定住心神，跳起身，在胸前画了个十字，迎面冲向怪兽。诺尔卡转身就逃，他紧追了一阵，发觉靠双腿根本赶不上，便冲进马厩，骑走最好的一匹马。
        - id: ch01-b06
          speaker: narrator
          text: 王子很快追上诺尔卡，双方打了又打。他先刺伤怪兽三次，直到一人一兽都筋疲力尽，只好躺下休息。可他刚合眼，诺尔卡便跳起来逃了。幸亏坐骑将他唤醒，他立刻翻身而起，再次追上怪兽，与它打了起来。王子又刺伤它三次，双方便第二次躺下休息。诺尔卡仍趁他睡着逃跑，王子赶上去，又给它添了三处伤口。
        - id: ch01-b07
          speaker: narrator
          text: 王子第四次追赶时，诺尔卡忽然奔到一块巨大的白石旁。它掀开石头，钻进地下世界，临走还冲他喊了一声。
        - id: ch01-b08
          speaker: norka
          text: 想打败我，你就到这里面来！
        - id: ch01-b09
          speaker: narrator
          text: 王子回宫禀明一切，请父王命人编一条能垂到地下世界的长皮绳。绳子备好以后，他叫上两个哥哥，带着仆人和足够用一整年的东西，来到那块白石旁。他们就地盖了一座宫殿，住了一阵。等万事齐备，小王子问哥哥们。
        - id: ch01-b10
          speaker: prince_ivan
          text: 哥哥们，现在谁来搬开这块石头？
        - id: ch01-b11
          speaker: narrator
          text: 两个哥哥使尽力气，石头仍纹丝不动。小王子伸手一碰，那块大得像山一样的巨石竟飞出老远。他又问了一句。
        - id: ch01-b12
          speaker: prince_ivan
          text: 那么，谁愿意下去除掉诺尔卡？
        - id: ch01-b13
          speaker: narrator
          text: 两人还是谁也不肯。小王子笑他们胆小，便向他们告别。
        - id: ch01-b14
          speaker: prince_ivan
          text: 把我放到地下世界去，你们守在这里别走。只要绳子一动，马上把它拉起来。
    - id: ch02
      title: 地下世界的三座宫殿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个哥哥用绳子把他放进地底。小王子独自向前，走了很久，忽然看见一匹披着华美鞍辔的骏马。那匹马开口招呼他。
        - id: ch02-b02
          speaker: enchanted_horse
          text: 向您致敬，伊凡王子！我已经等您很久了！
        - id: ch02-b03
          speaker: narrator
          text: 伊凡王子骑上马，继续赶路。前方渐渐出现一座铜宫。他进了庭院，拴好坐骑，又走进屋里。一间房摆着饭菜，他吃饱以后，便到卧房的床上歇息。不久，一位美得只有童话中才会出现的姑娘走了进来。
        - id: ch02-b04
          speaker: copper_princess
          text: 来到我家的人，请现身告诉我你是谁！你若是老人，就做我的父亲。若是中年男子，就做我的哥哥。若是年轻男子，就做我亲爱的丈夫。你若是女人，年老的做我的祖母，中年的做我的母亲，年轻姑娘就做我的亲姐妹。
        - id: ch02-b05
          speaker: narrator
          text: 王子从藏身处走了出来。姑娘看见他，满心欢喜。
        - id: ch02-b06
          speaker: copper_princess
          text: 伊凡王子，你会成为我亲爱的丈夫！可你为什么会来到这里？
        - id: ch02-b07
          speaker: narrator
          text: 王子把一路发生的事都告诉了她。姑娘这才说出诺尔卡的去向。
        - id: ch02-b08
          speaker: copper_princess
          text: 你要打败的怪兽是我的哥哥。他现在住在我二姐的银宫，离这里不远。你刺出的九处伤口，有三处是我替他包扎的。
        - id: ch02-b09
          speaker: narrator
          text: 两人喝了酒，也亲热地谈了许久。王子告别铜宫公主，又来到二姐的银宫。他也在这里住了一阵，与二姐相谈。二姐告诉他，诺尔卡已经去了小妹那里。于是王子继续赶路，来到小妹居住的金宫。小妹告诉他，怪兽此刻正在蓝色大海上沉睡。她送给王子一柄钢剑，又让他喝下一口力量之水，嘱咐他只用一剑便砍下诺尔卡的头。王子听完，这才再次上路。
        - id: ch02-b10
          speaker: narrator
          text: 伊凡王子来到蓝色大海边。诺尔卡正睡在海中央的石头上，每打一个鼾，方圆七英里的海水都跟着翻腾。王子画了个十字，走到怪兽身边，一剑朝它头上砍去。脑袋应声飞起，一路滚进大海，嘴里还叫着。
        - id: ch02-b11
          speaker: norka
          text: 好吧，这回我可完了！
        - id: ch02-b12
          speaker: narrator
          text: 除掉诺尔卡以后，王子踏上归途，沿路接上三姐妹，要带她们回到上面的人间。三姐妹都爱他，不愿与他分离。她们原来都是女巫，各自把自己的宫殿变成一枚蛋。她们又把变化的诀窍教给王子，让他既能把蛋变回宫殿，也能把宫殿重新收进蛋里，最后将三枚蛋都交给了他。
        - id: ch02-b13
          speaker: narrator
          text: 众人回到绳索下面。王子把三位姑娘缚在绳上，扯了扯，两个哥哥便从上面将她们拉了出去。他们一见三位美貌非凡的姑娘，立刻走到一旁，低声商量起来。
        - id: ch02-b14
          speakers: [eldest_prince, second_prince]
          ensemble: duo
          text: 把绳子放下去，等弟弟升到半空，我们就割断它。他也许会摔死。就算不死，也永远不能把这三位美人许给我们做妻子了。
    - id: ch03
      title: 巨鸟的报答
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个哥哥定下毒计，把绳子放回地下。可伊凡王子并不傻。他猜到两人的打算，把绳子缚在一块石头上，随后扯了扯。哥哥们将石头拉到高处，果然割断绳子。石头坠回地面，摔得粉碎。王子看着这一幕，流下眼泪，只能独自离开。
        - id: ch03-b02
          speaker: narrator
          text: 他走啊走，忽然赶上一场暴风雨。雷声轰鸣，电光闪烁，大雨直往下泼。王子来到树下避雨，看见枝头几只雏鸟被淋得湿透，便脱下外衣盖住它们，自己坐在树下挨淋。
        - id: ch03-b03
          speaker: narrator
          text: 不久，一只巨鸟飞了回来。它庞大得遮住光亮，让本就昏暗的四周变得更暗。原来，它正是雏鸟们的母亲。巨鸟看到孩子们身上的衣服，先问是谁把它们裹了起来，接着便发现了王子。
        - id: ch03-b04
          speaker: great_bird
          text: 是你保护了我的孩子吗？多谢你！想要什么报答，只管说吧。不论什么事，我都愿意替你办。
        - id: ch03-b05
          speaker: prince_ivan
          text: 那就请你把我带回上面的人间。
        - id: ch03-b06
          speaker: great_bird
          text: 你先做一只大槽，在中间隔开。一边装上各样野味，另一边盛满水，好让我一路有肉吃，也有水喝。
        - id: ch03-b07
          speaker: narrator
          text: 王子把大槽、野味和清水全都准备妥当。巨鸟将大槽驮在背上，让王子坐在正中，便带着一路的食物和饮水展翅起飞。飞过很长一段路，它终于把王子送到目的地。巨鸟同他告别，独自飞了回去。
        - id: ch03-b08
          speaker: narrator
          text: 王子来到一个裁缝家，给人家当起帮工。这一路已经把他折腾得满身风霜，模样也彻底变了，任谁来看，都猜不到他是一位王子。
    - id: ch04
      title: 王子做帮工
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 伊凡王子向裁缝师傅打听，这个国家最近出了什么事。师傅便把宫里的难题说了出来。
        - id: ch04-b02
          speaker: tailor
          text: 我国两位王子从地下世界带回了新娘，第三位王子却失踪了。两位王子想成婚，新娘们偏偏不答应。她们要先备齐婚礼衣裳，还说每一件都必须和她们在地下世界穿过的一样，又不许工匠量尺寸。国王召来全国的工匠，可谁也不敢接下这份差事。
        - id: ch04-b03
          speaker: prince_ivan
          text: 师傅，您去见国王，就说裁缝该做的东西，您全能备齐。
        - id: ch04-b04
          speaker: tailor
          text: 我平日只给普通人缝衣服，哪有本事做出那样的衣裳？
        - id: ch04-b05
          speaker: prince_ivan
          text: 您只管去，一切都由我担着。
        - id: ch04-b06
          speaker: narrator
          text: 裁缝只好进宫。国王见终于有人肯接，十分高兴，裁缝要多少钱，他便给多少钱。师傅谈妥条件，回家以后，王子又嘱咐他。
        - id: ch04-b07
          speaker: prince_ivan
          text: 您向上天祈祷过，就安心睡吧。明天早晨，一切都会准备好。
        - id: ch04-b08
          speaker: narrator
          text: 裁缝听话睡下了。午夜钟声响起，王子走到城外的田野上，从口袋里拿出三枚蛋。照着姑娘们教的办法，他把蛋变成三座宫殿，逐一进去取出她们的衣裳，再把宫殿变回蛋。回到裁缝家，他将衣裳挂满墙壁，这才上床休息。
        - id: ch04-b09
          speaker: narrator
          text: 清早，裁缝睁眼一看，墙上的华服金光银光闪耀，还缀满了珠宝，全是他从未见过的式样。他喜出望外，抱着衣裳送进王宫。三位公主一眼认出旧日衣裳，也猜到伊凡王子已经回到人间。她们互相使了个眼色，却什么也没说。
        - id: ch04-b10
          speaker: narrator
          text: 裁缝交完衣服回到家，亲爱的伙计已经不见了。原来，王子又去了鞋匠家，让鞋匠接下国王的差事。随后，他用同样的办法走遍各行工匠的家。工匠们靠他的帮助得到国王的重赏，个个都来向他道谢。
    - id: ch05
      title: 三场婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 等伊凡王子把各行工匠都走遍，三位公主也拿到了自己要求的一切。每一样衣饰，都和她们在地下世界用过的完全相同。可伊凡王子始终没有现身，她们为此伤心痛哭。如今再也找不到理由拖延，婚事非办不可了。婚礼即将举行，最小的公主便在成婚前向国王提出一个请求。
        - id: ch05-b02
          speaker: youngest_princess
          text: 父王，请准许我出去给穷人施舍。
        - id: ch05-b03
          speaker: narrator
          text: 国王答应了。小公主走进穷人中间，一边施舍，一边仔细看着每一张脸。她来到一个乞丐面前，正要给钱，忽然看见他手上戴着三枚戒指。一枚是自己送给伊凡王子的，另外两枚属于两个姐姐。眼前这个衣衫褴褛的人，原来正是她们等候的王子。
        - id: ch05-b04
          speaker: narrator
          text: 小公主立刻抓住他的手，把他带进大厅，当着国王的面揭开了真相。
        - id: ch05-b05
          speaker: youngest_princess
          text: 就是他把我们从地下世界救了出来。他的哥哥们不准我们说他还活着，还威胁说，只要我们开口，就会杀了我们。
        - id: ch05-b06
          speaker: narrator
          text: 国王得知两个儿子的所作所为，勃然大怒，按照自己的心意惩罚了他们。此后，宫中一连举行了三场婚礼。
