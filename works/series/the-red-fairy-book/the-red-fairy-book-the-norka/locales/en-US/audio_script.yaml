  chapters:
    - id: ch01
      title: The Beast in the Deer Park
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King and Queen with three sons. The two elder sons were thought clever, while everyone called the youngest a simpleton. The King kept a deer park filled with wild animals of many kinds. But each night a huge beast called the Norka broke in, killed some of the animals, and left terrible ruin behind. Nothing the King tried could stop it.
        - id: ch01-b02
          speaker: king
          text: The son who destroys the Norka will have half my kingdom.
        - id: ch01-b03
          speaker: narrator
          text: The eldest son offered to go first. He armed himself and set out at night, but he stopped at a tavern before he ever reached the park. He spent the whole night feasting and making merry. By the time he came to his senses, daylight had come. He knew he had disgraced himself before his father, but it was too late to mend matters.
        - id: ch01-b04
          speaker: narrator
          text: The second son went the following night and did exactly the same thing. He stopped at the tavern, wasted the night in revelry, and returned after dawn without ever facing the beast. The King gave both brothers a sound scolding, and that ended their attempts.
        - id: ch01-b05
          speaker: narrator
          text: On the third day, the youngest son took up the task. Everyone laughed at him. They were certain that a supposed simpleton could do nothing. Still, he carried his weapons straight into the park. He sat on the grass so that if he nodded off, the points of his weapons would prick him awake.
        - id: ch01-b06
          speaker: narrator
          text: At midnight, the ground began to shake. The Norka charged toward the park and smashed through the fence by its enormous weight. The Prince mastered his fear, sprang up, crossed himself, and rushed straight at the beast.
        - id: ch01-b07
          speaker: narrator
          text: The Norka turned and fled. Ivan chased it, but soon knew that he could never catch it on foot. He hurried to the stable, seized the finest horse there, and galloped after it. When he drew alongside, the fight began.
        - id: ch01-b08
          speaker: narrator
          text: They fought until Ivan had dealt the beast three wounds. Both of them were so worn out that they lay down for a brief rest. The instant Ivan shut his eyes, the Norka leaped up and ran. His horse woke him, and he was in the saddle at once.
        - id: ch01-b09
          speaker: narrator
          text: Ivan caught the beast and fought it again, giving it three more wounds. Once more they lay down exhausted, and once more the Norka slipped away. Ivan overtook it a third time and struck three further wounds.
        - id: ch01-b10
          speaker: narrator
          text: As Ivan began the fourth pursuit, the Norka raced to a great white stone. It tipped the stone aside and plunged through the opening into the world beneath the earth.
        - id: ch01-b11
          speaker: norka
          text: You will never defeat me unless you follow me in here!
    - id: ch02
      title: Into the Other World
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Ivan returned home and told his father everything. He asked for a leather rope long enough to reach the other world, and the King ordered one to be braided. When it was ready, Ivan summoned his brothers. The three princes took servants and enough supplies for a year, then traveled to the white stone.
        - id: ch02-b02
          speaker: narrator
          text: They built a palace on that very spot and lived there while they made their preparations. At last Ivan stood before the stone and turned to his brothers.
        - id: ch02-b03
          speaker: prince_ivan
          text: Brothers, which of us will lift this stone?
        - id: ch02-b04
          speaker: narrator
          text: Neither elder brother could move it at all. But as soon as Ivan laid a hand on it, he hurled it far away, though it was as large as a hill.
        - id: ch02-b05
          speaker: prince_ivan
          text: Now which of us will go down to the other world and defeat the Norka?
        - id: ch02-b06
          speaker: narrator
          text: Neither brother volunteered. Ivan laughed at their cowardice.
        - id: ch02-b07
          speaker: prince_ivan
          text: Then farewell, brothers. Lower me into the other world. Stay here, and when I jerk the rope, pull it up.
        - id: ch02-b08
          speaker: narrator
          text: His brothers lowered him beneath the earth. When Ivan reached the bottom, he set off along the road. After a long walk, he saw a horse covered in splendid trappings.
        - id: ch02-b09
          speaker: enchanted_horse
          text: Welcome, Prince Ivan! I have been waiting a long time for you.
        - id: ch02-b10
          speaker: narrator
          text: Ivan mounted, and the horse carried him onward until a copper palace rose before them. He tied the horse in the courtyard and entered. A meal stood ready in one room, so he ate. Then he found a bedroom, lay down, and rested.
        - id: ch02-b11
          speaker: narrator
          text: Before long, a lady entered. She was more beautiful than anyone could be outside a fairy tale. She called to the stranger hidden in her house.
        - id: ch02-b12
          speaker: eldest_sister
          text: Whoever you are, come out and tell me. If you are an old man, you shall be my father. If you are middle-aged, you shall be my brother. If you are young, you shall be my dear husband. If you are a woman, then an old woman shall be my grandmother, a middle-aged woman my mother, and a girl my own sister.
        - id: ch02-b13
          speaker: narrator
          text: Ivan stepped out. The lady was delighted when she saw him.
        - id: ch02-b14
          speaker: eldest_sister
          text: Prince Ivan, you shall be my dear husband. But tell me, why have you come here?
          emotion: happy
        - id: ch02-b15
          speaker: narrator
          text: He told her the whole story.
        - id: ch02-b16
          speaker: eldest_sister
          text: The beast you seek is my brother. He is staying now with my second sister, not far away in her silver palace. I bandaged three of the wounds you gave him.
        - id: ch02-b17
          speaker: narrator
          text: They drank together, enjoyed one another's company, and talked fondly for a while. Then Ivan said goodbye and rode to the second sister's silver palace. He stayed with her for a time, and she told him that the Norka had gone on to their youngest sister.
        - id: ch02-b18
          speaker: second_sister
          text: Our brother is with our youngest sister now. You will find her in the golden palace.
        - id: ch02-b19
          speaker: narrator
          text: Ivan rode on to the golden palace. The youngest sister told him that the Norka was sleeping on the blue sea. She gave Ivan a steel sword and a drink of the Water of Strength.
        - id: ch02-b20
          speaker: youngest_sister
          text: When you find my brother, cut off his head with a single stroke.
        - id: ch02-b21
          speaker: narrator
          text: Ivan listened carefully and went on his way.
    - id: ch03
      title: The Norka's End
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Ivan reached the blue sea, he saw the Norka asleep on a stone in the middle of the water. Each time the beast snored, the sea heaved and churned for seven miles around.
        - id: ch03-b02
          speaker: narrator
          text: Ivan crossed himself, approached the sleeping beast, and swung the steel sword at its neck. The head flew off and rolled far away into the sea.
        - id: ch03-b03
          speaker: norka
          text: Well, that finishes me!
        - id: ch03-b04
          speaker: narrator
          text: With the Norka dead, Ivan began his return journey. He stopped at the golden, silver, and copper palaces and gathered all three sisters. They all loved him and would not be parted from him, and Ivan meant to take them into the upper world. Each sister was an enchantress. Each turned her palace into an egg, taught Ivan how to change it back into a palace and then into an egg again, and placed the egg in his hands.
        - id: ch03-b05
          speaker: narrator
          text: Together they reached the place below the rope. Ivan fastened the three maidens securely to it and gave the signal. Far above, his brothers began to haul them up.
        - id: ch03-b06
          speaker: narrator
          text: When the elder princes saw the wondrous maidens, they drew aside to speak in secret.
        - id: ch03-b07
          speaker: eldest_prince
          text: We should lower the rope and pull our brother partway up. Then we'll cut it. The fall may kill him, and even if it doesn't, he can never give these beauties to us as wives.
        - id: ch03-b08
          speaker: narrator
          text: The second prince agreed. They lowered the rope, but Ivan was no fool. He guessed their plan and tied the end to a stone instead of climbing onto it. Then he tugged the signal.
        - id: ch03-b09
          speaker: narrator
          text: His brothers raised the stone high into the shaft and cut the rope. The stone crashed down and shattered. Ivan wept when he saw what they had done. Then he turned away and walked on through the world beneath the earth.
    - id: ch04
      title: The Great Bird
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Ivan walked until a storm rose around him. Lightning flashed, thunder rolled, and rain poured down. He went beneath a tree for shelter and noticed some young birds in its branches, soaked through by the rain.
        - id: ch04-b02
          speaker: narrator
          text: Ivan took off his coat and spread it over the nestlings. Then he settled under the tree without it. Soon an enormous bird flew toward him. Its wings blotted out the light. The underground world had been dark already, and now it grew darker still.
        - id: ch04-b03
          speaker: narrator
          text: The great bird was the nestlings' mother. She saw that someone had covered her little ones.
        - id: ch04-b04
          speaker: great_bird
          text: Who wrapped up my nestlings? Was it you? Thank you. Ask me for whatever you desire, and I will do it for you.
        - id: ch04-b05
          speaker: prince_ivan
          text: Carry me into the upper world.
        - id: ch04-b06
          speaker: great_bird
          text: Make a large vessel with a partition down the middle. Fill one half with every kind of game you can catch, and fill the other half with water. I will need meat and drink for the journey.
        - id: ch04-b07
          speaker: narrator
          text: Ivan did everything she asked. The bird took the vessel on her back, and Ivan sat in its middle. Then she spread her wings and flew. After carrying him a great distance, she brought him safely to the end of his journey. They said goodbye, and she flew back the way she had come.
        - id: ch04-b08
          speaker: narrator
          text: Ivan went to the house of a tailor and hired himself out as a servant. His clothes were worn, and his whole appearance had changed so much that no one would have guessed he was a prince.
    - id: ch05
      title: The Enchanted Wedding Clothes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Once Ivan had entered the tailor's service, he asked his master what was happening in the kingdom.
        - id: ch05-b02
          speaker: tailor
          text: We have only two princes now, because the third has disappeared. Those two brought brides back from the other world and mean to marry them, but the brides refuse. First they demand wedding clothes exactly like the ones they had below, and the clothes must be made without taking their measurements. The King has called together every workman in the land, but no one will accept the job.
        - id: ch05-b03
          speaker: prince_ivan
          text: Go to the King, master. Tell him you can provide everything a tailor should make.
        - id: ch05-b04
          speaker: tailor
          text: How could I promise clothes like that? I only sew for ordinary people.
        - id: ch05-b05
          speaker: prince_ivan
          text: Go on, master. I will answer for it all.
        - id: ch05-b06
          speaker: narrator
          text: The tailor went to the palace. The King was overjoyed that one good workman had finally been found and gave him all the money he asked for. When the arrangements were settled, the tailor returned home.
        - id: ch05-b07
          speaker: prince_ivan
          text: Now say your prayers and go to sleep. Everything will be ready tomorrow.
        - id: ch05-b08
          speaker: narrator
          text: The tailor trusted his servant and went to bed. At midnight, Ivan rose and walked beyond the city into the fields. He took the three eggs from his pocket and changed them into the copper, silver, and golden palaces, just as the sisters had taught him.
        - id: ch05-b09
          speaker: narrator
          text: Ivan entered each palace and collected the sisters' robes. Then he turned the palaces back into eggs and went home. He hung the robes on the wall and lay down to sleep.
        - id: ch05-b10
          speaker: narrator
          text: Early the next morning, the tailor awoke. On his wall hung garments finer than any he had ever seen, glittering with gold, silver, and precious stones. Delighted, he gathered them up and hurried to the King.
        - id: ch05-b11
          speaker: narrator
          text: The three Princesses recognized the clothes they had worn in the other world. At once, they knew that Prince Ivan must be somewhere in the kingdom. They exchanged glances but said nothing.
        - id: ch05-b12
          speaker: narrator
          text: The tailor delivered the robes and returned home, but his remarkable servant had vanished. Ivan had gone to work for a shoemaker. He sent that master to serve the King in the same way, then moved from one craftsman to another. Each time, Ivan supplied exactly what the Princesses remembered from below. Through his help, every craftsman completed the task that had seemed impossible. They all thanked him, for the King's rewards had made them rich.
    - id: ch06
      title: The True Prince Returns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: By the time Ivan had visited all the craftsmen, the Princesses had received everything they had asked for. Their clothes and belongings were just as they had been in the other world. Yet Ivan still had not appeared. The sisters wept bitterly. They could delay no longer, and now the weddings had to take place.
        - id: ch06-b02
          speaker: narrator
          text: When the wedding day came, the youngest bride went before the King.
        - id: ch06-b03
          speaker: youngest_sister
          text: Father, please allow me to give alms to the beggars before the wedding.
        - id: ch06-b04
          speaker: narrator
          text: The King gave his permission. She went among the beggars, offering them alms and studying every face. As she reached one poor-looking man and held out some money, she noticed the ring she had given Prince Ivan in the other world. He was also wearing her sisters' rings. The beggar was Ivan himself.
        - id: ch06-b05
          speaker: narrator
          text: The youngest Princess caught him by the hand and led him into the great hall. There she faced the King.
        - id: ch06-b06
          speaker: youngest_sister
          text: Here is the man who brought us out of the other world. His brothers threatened to kill us if we told anyone that he was still alive.
        - id: ch06-b07
          speaker: narrator
          text: The King was furious with his elder sons and punished them as he thought proper.
        - id: ch06-b08
          speaker: narrator
          text: After that, three weddings were celebrated.
