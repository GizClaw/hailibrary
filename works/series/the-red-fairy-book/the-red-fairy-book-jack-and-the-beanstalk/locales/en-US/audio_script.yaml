  chapters:
    - id: ch01
      title: Jack Sells the Cow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor widow lived in a little cottage with her only son, Jack. Jack was thoughtless and easily carried away, but he had a kind and loving heart.
        - id: ch01-b02
          speaker: narrator
          text: A hard winter came, and afterward his mother suffered badly from fever and chills. Jack was not working yet, so little by little they became desperately poor. At last, the widow saw only one way to keep them from starving. They would have to sell their cow.
        - id: ch01-b03
          speaker: mother
          text: Jack, I am too weak to go to market. You must take the cow and sell her for me.
        - id: ch01-b04
          speaker: narrator
          text: Jack was delighted to have the errand. On the road, he met a butcher holding some beautiful beans. Jack stopped to admire them.
        - id: ch01-b05
          speaker: butcher
          text: These beans are worth a great deal, lad. Give me your cow, and they can be yours.
        - id: ch01-b06
          speaker: narrator
          text: The butcher kept persuading him until the foolish boy agreed. Jack handed over the cow and carried the beans home.
        - id: ch01-b07
          speaker: narrator
          text: His mother had expected money for her fine cow. When she saw beans instead, she was terribly upset. She wept many tears and scolded Jack for being so foolish. Jack was truly sorry, and that night mother and son went sadly to bed. Their last hope seemed to be gone.
        - id: ch01-b08
          speaker: narrator
          text: At daybreak, Jack went into the garden.
        - id: ch01-b09
          speaker: jack
          text: I may as well plant these wonderful beans. Mother says they're only common scarlet runners, but I'll plant them anyway.
        - id: ch01-b10
          speaker: narrator
          text: He found a piece of stick, poked several holes in the earth, and planted the beans. That day, he and his mother had almost nothing for dinner. That evening, they went sadly to bed knowing there would be no food at all the next day. Grief and frustration kept Jack awake. As soon as dawn came, he rose and returned to the garden.
        - id: ch01-b11
          speaker: narrator
          text: What a sight met his eyes! In a single night, the beans had shot upward and covered the high cliff that sheltered the cottage. They climbed on until they vanished above it. The thick stalks had twined and twisted around one another so neatly that they formed a ladder.
        - id: ch01-b12
          speaker: jack
          text: That looks easy enough to climb.
        - id: ch01-b13
          speaker: narrator
          text: Once the idea came to him, Jack wanted to try it at once. He was a good climber and never waited long to carry out an experiment. Still, his mistake with the cow was fresh in his mind. This time, he decided he had better ask his mother before rushing ahead.
    - id: ch02
      title: The Wonderful Beanstalk
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Jack called his mother. Together they stared in silent wonder at the Beanstalk. It rose higher than they could see, and its woven stems were thick enough to hold Jack.
        - id: ch02-b02
          speaker: jack
          text: I wonder where it ends. I think I'll climb up and find out.
        - id: ch02-b03
          speaker: narrator
          text: His mother begged him not to risk himself on such a strange ladder. Jack coaxed and pleaded for her consent. He felt certain there must be something wonderful somewhere in the Beanstalk, and at last she gave in and allowed him to try.
        - id: ch02-b04
          speaker: narrator
          text: Jack began climbing at once. Up and up he went until the cottage, the village, and even the tall church tower looked tiny below him. Still, the top was nowhere in sight.
        - id: ch02-b05
          speaker: narrator
          text: He grew tired and wondered for a moment if he should turn back. But Jack could keep going when he set his mind to something, and he knew he would never succeed by giving up. He rested briefly, then climbed higher. Soon he was so far above the earth that he dared not look down for fear of becoming dizzy.
        - id: ch02-b06
          speaker: narrator
          text: At last he reached the top. Before him lay a beautiful country of woods and green meadows filled with sheep. A clear stream crossed the fields, and nearby stood a great, strong castle. Jack wondered why he had never seen or heard of it. Then he realized that the sheer cliff divided it from his village as completely as another land would.
        - id: ch02-b07
          speaker: narrator
          text: As he gazed at the castle, a strange-looking woman came from the wood. She wore a pointed cap of quilted red satin edged with ermine. Her hair flowed over her shoulders, and she carried a staff. Jack took off his cap and bowed.
        - id: ch02-b08
          speaker: jack
          text: Excuse me, ma'am. Is that your house?
        - id: ch02-b09
          speaker: fairy
          text: No. Listen, Jack, and I will tell you the story of that castle.
        - id: ch02-b10
          speaker: fairy
          text: Long ago, a noble knight lived there with his beloved wife and their children. The castle stands at the edge of Fairyland, and the little people nearby were his friends. They gave him many precious gifts.
        - id: ch02-b11
          speaker: fairy
          text: Word of those treasures reached a monstrous and wicked Giant who lived not far away. He bribed a false servant to let him into the castle while the knight slept. The Giant killed the knight in his bed. Then he went to the nursery and killed all the poor children he found there.
        - id: ch02-b12
          speaker: fairy
          text: The knight's wife escaped only because she was away. She had taken her baby son, just two or three months old, to visit her old nurse in the valley. A storm kept them there all night.
        - id: ch02-b13
          speaker: fairy
          text: At first light, a servant who had escaped came with the terrible news. The lady could scarcely believe him. She wanted to hurry home and die with those she loved. But her nurse wept and begged her to remember the baby who still needed her.
        - id: ch02-b14
          speaker: fairy
          text: The lady listened to her nurse and agreed to remain in the cottage, the safest hiding place they knew. The escaped servant had warned her that the Giant meant to kill both her and her baby if he found them. Years passed. At last the old nurse died, leaving the lady her humble cottage and the few pieces of furniture inside.
        - id: ch02-b15
          speaker: fairy
          text: The lady worked like a peasant for their daily bread. Her spinning wheel and the milk from a cow gave her and her son a scant living. They grew peas, beans, and cabbages in the little garden. At harvest time, she even gathered leftover grain in the fields to feed her boy.
        - id: ch02-b16
          speaker: fairy
          text: Jack, that lady is your mother. The castle belonged to your father, and it must become yours again.
        - id: ch02-b17
          speaker: narrator
          text: Jack cried out in astonishment.
        - id: ch02-b18
          speaker: jack
          text: My mother? Oh, ma'am, what must I do? My poor father, and my dear mother!
          emotion: surprised
        - id: ch02-b19
          speaker: fairy
          text: Your duty is to win the castle back for your mother. It will be dangerous and very difficult. Are you brave enough to try?
        - id: ch02-b20
          speaker: jack
          text: When I know I'm doing right, I'm not afraid.
        - id: ch02-b21
          speaker: fairy
          text: Then you are the kind who can slay giants. Enter the castle if you can. Try to recover a hen that lays golden eggs and a harp that can talk. Remember, everything the Giant owns is truly yours.
        - id: ch02-b22
          speaker: narrator
          text: The lady in the red cap vanished as soon as she finished speaking. Jack knew then that she was a fairy.
        - id: ch02-b23
          speaker: narrator
          text: He set out for the castle and blew the horn at its gate. After a minute or two, the door opened. A terrifying Giantess stood there with one huge eye in the middle of her forehead. Jack turned to flee, but she caught him and dragged him inside.
        - id: ch02-b24
          speaker: giantess
          text: Ho, ho! You never expected to find me here, did you? I won't let you go. I'm tired of working so hard, and I deserve a page like other ladies have. You'll be my boy. You'll clean the knives, black the boots, make the fires, and help whenever the Giant is away.
        - id: ch02-b25
          speaker: giantess
          text: When he's home, I'll have to hide you. He has eaten every page I've had before, and a little lad like you would make a tasty bite.
        - id: ch02-b26
          speaker: narrator
          text: All the while she spoke, the Giantess hauled Jack farther into the castle. The poor boy was terribly frightened, just as anyone in his place would have been. But he believed it was shameful to surrender to fear. He fought to master himself, show courage, and make the best of the danger.
        - id: ch02-b27
          speaker: jack
          text: I'll gladly help you in any way I can, ma'am. Only please hide me from your husband. I don't want to be eaten at all.
          emotion: fearful
        - id: ch02-b28
          speaker: giantess
          text: Good boy. You're lucky you didn't scream when you saw me. The other boys screamed, woke my husband, and became his breakfast. Get into my wardrobe. He never dares open that, so you'll be safe.
        - id: ch02-b29
          speaker: narrator
          text: The Giantess opened an enormous wardrobe in the great hall and shut Jack inside. Its keyhole was so large that plenty of air came through, and Jack could watch everything beyond the door.
        - id: ch02-b30
          speaker: narrator
          text: Before long, a heavy tread shook the stairs like a great cannon rolling past. Then a voice like thunder filled the hall.
        - id: ch02-b31
          speaker: giant
          text: Fe, fa, fi-fo-fum! I smell the breath of an Englishman. Let him be alive or let him be dead, I'll grind his bones to make my bread!
        - id: ch02-b32
          speaker: giant
          text: Wife, there is a man inside this castle. Bring him to me for breakfast!
        - id: ch02-b33
          speaker: giantess
          text: You've grown old and foolish. You only smell the fresh elephant steak I cooked for you. Sit down now and eat a good breakfast.
        - id: ch02-b34
          speaker: narrator
          text: She set down a huge dish of steaming meat. It pleased the Giant so much that he forgot about the Englishman. After breakfast, he went for a walk. The Giantess let Jack out, and he worked for her all day. She fed him well. When evening came, she hid him in the wardrobe again.
    - id: ch03
      title: The Hen That Lays Golden Eggs
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Giant came home for supper, and Jack watched every movement through the wardrobe keyhole. He stared in amazement as the enormous creature picked clean a wolf's bone and pushed half a chicken into his vast mouth in a single bite.
        - id: ch03-b02
          speaker: narrator
          text: When the meal was over, the Giant ordered his wife to fetch the hen that laid golden eggs.
        - id: ch03-b03
          speaker: giant
          text: She lays just as well as she did when that miserable knight owned her. Her eggs may be even heavier now.
        - id: ch03-b04
          speaker: narrator
          text: The Giantess soon returned with a little brown hen and set it on the table.
        - id: ch03-b05
          speaker: giantess
          text: If you don't need me anymore, dear, I'll go out for a walk.
        - id: ch03-b06
          speaker: giant
          text: Go ahead. I'll be ready for a nap soon.
        - id: ch03-b07
          speaker: narrator
          text: The Giant picked up the brown hen.
        - id: ch03-b08
          speaker: giant
          text: Lay me an egg!
        - id: ch03-b09
          speaker: narrator
          text: At once, the hen laid a golden egg.
        - id: ch03-b10
          speaker: giant
          text: Lay me another egg!
        - id: ch03-b11
          speaker: narrator
          text: A second golden egg appeared. The Giant ordered the hen to lay for a third time, and one more golden egg landed on the table. Watching through the keyhole, Jack had no doubt. This little brown hen was the very one the Fairy had told him to recover.
        - id: ch03-b12
          speaker: narrator
          text: After a while, the Giant put the hen on the floor. Soon he was fast asleep, snoring like thunder.
        - id: ch03-b13
          speaker: narrator
          text: Once Jack was sure the Giant slept, he eased open the wardrobe door and crept across the room without a sound. He picked up the hen and hurried out of the room. Jack remembered the way to the kitchen and found its door partly open. He slipped through, shut and locked it behind him, and flew back to the Beanstalk. Down he went as quickly as his feet could carry him.
        - id: ch03-b14
          speaker: narrator
          text: His mother wept with joy when he came through the cottage door. She had feared that fairies had carried him away, or that the Giant had caught him. Jack placed the brown hen before her and told her everything that had happened. She was overjoyed to see the hen, for now it could make them rich again.
    - id: ch04
      title: The Money Bags
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, while his mother was away at market, Jack decided to make a second journey up the Beanstalk. Before leaving, he dyed his hair and disguised himself. When he reached the castle, the Giantess did not recognize him. Just as she had before, she dragged him inside and set him to work.
        - id: ch04-b02
          speaker: narrator
          text: When she heard her husband approaching, she hid Jack in the wardrobe. She had no idea he was the boy who stole the hen. She warned him to keep perfectly still or the Giant would eat him.
        - id: ch04-b03
          speaker: giant
          text: Fe, fa, fi-fo-fum! I smell the breath of an Englishman. Let him be alive or let him be dead, I'll grind his bones to make my bread!
        - id: ch04-b04
          speaker: giantess
          text: Nonsense! You smell the roasted bullock I prepared as a special supper. Sit down, and I'll bring it at once.
        - id: ch04-b05
          speaker: narrator
          text: The Giant sat down. His wife brought in a whole roasted bullock on a great dish, and the two of them began to eat. Jack could hardly believe his eyes. They picked its bones as easily as if it were a tiny lark.
        - id: ch04-b06
          speaker: giantess
          text: With your permission, dear, I'll go upstairs and finish my story. Call me if you need anything.
        - id: ch04-b07
          speaker: giant
          text: Bring me my money bags first. I want to count my gold before I sleep.
        - id: ch04-b08
          speaker: narrator
          text: The Giantess obeyed. She returned carrying two large bags on her shoulders and dropped them beside him.
        - id: ch04-b09
          speaker: giantess
          text: There. That's all the knight's money you have left. Once it's gone, you'll have to capture another baron's castle.
        - id: ch04-b10
          speaker: jack
          text: Not if I can stop him.
        - id: ch04-b11
          speaker: narrator
          text: After his wife left, the Giant opened the bags and poured out heaps upon heaps of golden coins. He counted them one by one and built shining piles across the table until he finally grew tired of the amusement. Then one sweep of his hands sent every coin back into the bags. He leaned into his chair and fell fast asleep. His snores were so loud that Jack could hear nothing else.
        - id: ch04-b12
          speaker: narrator
          text: Jack slipped softly from the wardrobe and took up both money bags. They were his own by right, because the Giant had stolen every coin from Jack's father. He hurried out of the castle and carried them to the Beanstalk. The bags made the descent very difficult, but Jack held on until he reached the cottage and laid the gold across his mother's table.
        - id: ch04-b13
          speaker: narrator
          text: She had just returned from town and had been crying because Jack was gone.
        - id: ch04-b14
          speaker: jack
          text: Look, Mother. I've brought back the gold my father lost.
        - id: ch04-b15
          speaker: mother
          text: Oh, Jack, you are a good boy. But I wish you wouldn't risk your precious life in that castle. Tell me why you went there again.
        - id: ch04-b16
          speaker: narrator
          text: Jack told her the whole adventure. His mother was glad to have the money, but no treasure could make her welcome the danger he faced for her. Even so, after some time had passed, Jack decided he must visit the Giant's castle once more.
    - id: ch05
      title: The Talking Harp
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Jack climbed the Beanstalk for a third time and blew the horn at the castle gate. The Giantess soon opened the door. She was so foolish that she failed to recognize him, but this time she did hesitate before taking him inside. After two robberies, she had reason to be suspicious. Still, Jack's fresh face looked so innocent that she could not resist him. She let him enter and once more hid him in the wardrobe.
        - id: ch05-b02
          speaker: narrator
          text: The Giant came home before long. The moment he crossed the threshold, he roared.
        - id: ch05-b03
          speaker: giant
          text: Fe, fa, fi-fo-fum! I smell the breath of an Englishman. Let him be alive or let him be dead, I'll grind his bones to make my bread!
        - id: ch05-b04
          speaker: giantess
          text: You stupid old Giant. All you smell is the fine sheep I grilled for your dinner.
        - id: ch05-b05
          speaker: narrator
          text: The Giant sat down, and his wife brought him an entire sheep. He ate every bit of it.
        - id: ch05-b06
          speaker: giant
          text: Now fetch my harp. I'll listen to some music while you take your walk.
        - id: ch05-b07
          speaker: narrator
          text: The Giantess returned with a beautiful harp. Diamonds and rubies glittered across its frame, and every string was made of gold.
        - id: ch05-b08
          speaker: giant
          text: This is one of the finest treasures I took from the knight. I love music, and this harp serves me faithfully.
        - id: ch05-b09
          speaker: narrator
          text: He pulled the harp close.
        - id: ch05-b10
          speaker: giant
          text: Play me some music!
        - id: ch05-b11
          speaker: narrator
          text: The harp played a soft and sorrowful air.
        - id: ch05-b12
          speaker: giant
          text: Give me something cheerful!
        - id: ch05-b13
          speaker: narrator
          text: The music changed to a merry tune.
        - id: ch05-b14
          speaker: giant
          text: Now play a lullaby!
        - id: ch05-b15
          speaker: narrator
          text: The harp began a sweet lullaby, and before it ended, the Giant was asleep.
        - id: ch05-b16
          speaker: narrator
          text: Jack crept out of the wardrobe and first went into the enormous kitchen. He needed to make sure the Giantess had really left, and he found the room empty. Then he opened the outer door very softly. He knew it would be harder to manage once the harp was in his hands. With his path ready, he returned to the Giant's room, seized the harp, and ran.
        - id: ch05-b17
          speaker: harp
          text: Master! Master!
        - id: ch05-b18
          speaker: narrator
          text: The harp's cry rang out as Jack leaped across the threshold. The Giant woke and gave a tremendous roar. Two great strides carried him to the door.
        - id: ch05-b19
          speaker: narrator
          text: Jack was quick, and he fled like lightning with the harp in his arms. As he ran, he spoke to it, for he understood that it was a fairy harp. He told it that he was the son of its former master, the knight. Still, the Giant came on so fast that he was soon close behind poor Jack. One enormous hand stretched forward to seize him.
        - id: ch05-b20
          speaker: narrator
          text: At that very moment, the Giant planted his foot on a loose stone. He stumbled and crashed flat upon the ground, where he lay stretched out at full length. The accident gave Jack just enough time to reach the Beanstalk and hurry down. But when he finally dropped into his own garden, he looked up. The Giant was already descending after him.
        - id: ch05-b21
          speaker: jack
          text: Mother! Hurry! Bring me the axe!
        - id: ch05-b22
          speaker: narrator
          text: His mother ran out with a hatchet. One mighty blow from Jack sliced through every stem but one.
        - id: ch05-b23
          speaker: jack
          text: Stand back now, Mother!
    - id: ch06
      title: The Giant Breaks His Neck
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Jack's mother sprang away just in time. As the Giant grabbed the last stem, Jack cut straight through it and darted aside.
        - id: ch06-b02
          speaker: narrator
          text: The Giant plunged to the earth with a terrible crash. He landed on his head, broke his neck, and lay dead at the feet of the woman he had harmed so deeply.
        - id: ch06-b03
          speaker: narrator
          text: Before Jack and his mother could recover from their fright, a beautiful lady appeared before them.
        - id: ch06-b04
          speaker: fairy
          text: Jack, you have shown the courage of a knight's son. You deserve to have your inheritance restored. Bury the Giant, then go to the castle and kill the Giantess.
        - id: ch06-b05
          speaker: jack
          text: I couldn't kill someone who wasn't fighting me, and I could never draw my sword against a woman. Besides, the Giantess treated me kindly.
        - id: ch06-b06
          speaker: narrator
          text: The Fairy smiled at him.
        - id: ch06-b07
          speaker: fairy
          text: Your generous heart pleases me greatly. Still, return to the castle. When you arrive, do what you find necessary.
        - id: ch06-b08
          speaker: narrator
          text: Jack asked the Fairy how he could possibly return to the castle now that the Beanstalk lay on the ground. She told him that another road led there and offered to drive him in her chariot, which was drawn by two peacocks. Jack thanked her and took his seat beside her.
        - id: ch06-b09
          speaker: narrator
          text: Since they could no longer climb straight up the cliff, the Fairy drove a long way around it. At last they reached a village lying at the bottom of the castle hill. A crowd of miserable-looking men had gathered there, people who had lived under the Giant's cruelty and lost their animals to his hunger. The Fairy drew her peacock chariot to a stop and addressed them.
        - id: ch06-b10
          speaker: fairy
          text: My friends, the cruel Giant who oppressed you and devoured your flocks and herds is dead. This young man delivered you from him. He is the son of your good former master, the knight.
        - id: ch06-b11
          speaker: narrator
          text: The men answered with a mighty cheer. They pressed around Jack and declared that they would serve him as faithfully as they had once served his father. The Fairy told them to follow her, and the whole company marched up the hill toward the castle. When they reached the gate, Jack blew the hanging horn and demanded admittance.
        - id: ch06-b12
          speaker: narrator
          text: From a narrow window in the tower, the old Giantess saw them coming. She guessed that something had happened to her husband and became terribly frightened. Racing down the stairs, she caught her foot in her dress. She tumbled from top to bottom, broke her neck, and died.
        - id: ch06-b13
          speaker: narrator
          text: The company waited outside, but no one came to let them in. At last the men brought crowbars and forced the heavy gate open. They searched the great hall and found no one there. Then they went farther into the castle and discovered the Giantess lying dead at the foot of the stairs.
        - id: ch06-b14
          speaker: narrator
          text: And so Jack took possession of his father's castle. The Fairy went back for his mother and brought her there with the brown hen and the talking harp. Though the Giantess had died while fleeing from him, Jack remembered her kindness and had her buried. Then he did everything in his power to put right the wrongs the Giant had done to those he robbed.
        - id: ch06-b15
          speaker: narrator
          text: Before returning to Fairyland, the Fairy explained that she had sent the butcher to meet Jack with the beans. She had wanted to discover what kind of boy he was.
        - id: ch06-b16
          speaker: fairy
          text: If you had only stared foolishly at the enormous Beanstalk, I would have left you in your misfortune and merely returned your mother's cow. Instead, you showed curiosity, courage, and daring. You deserve to rise. When you climbed the Beanstalk, Jack, you climbed the Ladder of Fortune.
        - id: ch06-b17
          speaker: narrator
          text: Then the Fairy said farewell to Jack and his mother.
