audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    jack:
      display_name: 杰克
      tts:
        delivery: 少年般直率有朝气，冒险时勇敢坚定
        timbre: 年轻清亮
        pace: 适中偏快
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱朴实，忧虑时真切，欣慰时温柔
        timbre: 柔和温暖
        pace: 稍慢
        pitch: 中等
    butcher:
      display_name: 屠夫
      tts:
        delivery: 圆滑热络，劝诱时显得煞有介事
        timbre: 粗厚响亮
        pace: 适中
        pitch: 中低
    fairy:
      display_name: 仙女
      tts:
        delivery: 庄重沉着，指引杰克时清楚而坚定
        timbre: 清澈成熟
        pace: 从容
        pitch: 中等
    giantess:
      display_name: 女巨人
      tts:
        delivery: 嗓门粗大，凶悍中带着几分直爽
        timbre: 粗哑低沉
        pace: 适中
        pitch: 低
    giant:
      display_name: 巨人
      tts:
        delivery: 凶暴专横，吼叫时像雷声滚过
        timbre: 浑厚轰鸣
        pace: 稍慢
        pitch: 极低
    harp:
      display_name: 竖琴
      tts:
        delivery: 清脆敏锐，呼喊主人时急切响亮
        timbre: 明亮空灵
        pace: 适中
        pitch: 高
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 朴实激动，表达拥戴时响亮诚恳
        timbre: 粗厚
        pace: 适中
        pitch: 中低
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 朴实激动，表达拥戴时响亮诚恳
        timbre: 明朗
        pace: 适中
        pitch: 中等
    villager_3:
      display_name: 村民丙
      tts:
        delivery: 朴实激动，表达拥戴时响亮诚恳
        timbre: 沉稳
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 杰克卖牛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个穷寡妇带着独生子杰克，住在一间小屋里。杰克做事冒失，也不大用心，可他心地善良，跟母亲十分亲近。那年冬天冷得厉害。冬天过去，母亲又害起忽冷忽热的病。杰克还没做过工，家里一天比一天穷，眼看就要断粮。母亲实在没有别的办法，只能卖掉家里那头牛。
        - id: ch01-b02
          speaker: mother
          text: 杰克，我身子太弱，去不了集市。你替我把牛牵去卖了吧。
        - id: ch01-b03
          speaker: narrator
          text: 杰克很乐意接下这件事。可他走到半路，碰见一个手拿漂亮豆子的屠夫。杰克盯着那些豆子看个不停。屠夫把豆子夸得价值非凡，竟让这个傻孩子拿牛换走了。
        - id: ch01-b04
          speaker: butcher
          text: 这可不是普通豆子，每一颗都珍贵得很。把牛给我，这些豆子全归你。
        - id: ch01-b05
          speaker: narrator
          text: 母亲还以为杰克会带回卖牛的钱，见他手里只有几颗豆子，又气又伤心，流着泪骂他糊涂。杰克后悔极了。那一晚，母子俩满怀悲苦地上了床，觉得最后一点希望也没了。
        - id: ch01-b06
          speaker: narrator
          text: 天刚亮，杰克就来到园子里。他想，妈妈说这些只是普通的红花菜豆，可既然屠夫说它们神奇，不如种下去看看。他找来一截木棍，在地上戳了几个洞，把豆子一颗颗放进去。
        - id: ch01-b07
          speaker: jack
          text: 至少我还能把这些神奇的豆子种下去。说不定它们真有稀奇的地方。
        - id: ch01-b08
          speaker: narrator
          text: 那天，母子俩只吃到一点点东西。一想到明天就再没有食物，他们忧心重重地睡下了。杰克又难过又烦恼，怎么也睡不着。黎明时，他爬起来走进园子，眼前的景象让他一句话也说不出来。
        - id: ch01-b09
          speaker: narrator
          text: 豆子一夜之间长上了天。粗壮的豆茎越攀越高，遮住小屋后的高崖，又从崖顶消失了。一根根豆茎互相缠绕，像一架直通高处的梯子。
        - id: ch01-b10
          speaker: jack
          text: 这一定很好爬。
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 杰克很会攀爬，这个念头一出现，他立刻就想试试。不过，他刚在卖牛的事上犯过错，觉得这回应该先问母亲。
    - id: ch02
      title: 豆茎的奇异生长
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 杰克把母亲叫来。两个人一声不响，抬头望着奇异的豆茎。它不但高得看不到头，也粗壮得足以托住杰克。
        - id: ch02-b02
          speaker: jack
          text: 真不知道它通到哪儿。我想爬上去看看。
        - id: ch02-b03
          speaker: narrator
          text: 母亲不愿他冒险去爬这架古怪的梯子。杰克一再央求，说上面一定藏着奇妙的东西。母亲最后还是答应了。
        - id: ch02-b04
          speaker: narrator
          text: 杰克马上往上爬。他顺着梯子般的豆茎，爬了很久。小屋、村庄，连高高的教堂尖塔都在脚下变得很小，可豆茎顶端还是看不见。他渐渐累了，一度想要回去。不过，杰克做事很有毅力。他明白，要想成功，就不能半途而废。歇了一会儿，他又坚持往上爬。他越爬越高，再也不敢低头，生怕看一眼就会头晕。
        - id: ch02-b05
          speaker: narrator
          text: 最后，他终于爬到豆茎顶端，踏进一个美丽的国度。那里树木茂盛，羊群散布在秀美的草地上，一条水晶般清澈的溪流穿过牧场。不远处，立着一座坚固宏伟的城堡。城堡建在陡直的岩壁上，同下面的村庄完全隔绝，就像远在另一个国家。
        - id: ch02-b06
          speaker: narrator
          text: 杰克从没听说过这座城堡，也从来没见过它，心里诧异极了。他正站在那里望着，一个模样奇异的女人从树林里走了出来。她戴着红缎尖帽，帽子里面缝着软垫，翻起的帽檐镶着白鼬皮。她的长发披在肩上，手里还拄着一根杖。杰克摘下帽子，向她鞠了一躬。
        - id: ch02-b07
          speaker: jack
          text: 请问，太太，这里是您的家吗？
        - id: ch02-b08
          speaker: fairy
          text: 不是。你听好，我来告诉你这座城堡的故事。从前，一位高贵的骑士住在这里。城堡就在仙境边上。骑士有一位可爱的妻子和几个漂亮的孩子。附近的小仙人都跟他交好，还送给他许多珍贵的礼物。
        - id: ch02-b09
          speaker: fairy
          text: 宝物的消息传了出去。附近那个邪恶又丑陋的巨人，一心想把宝物夺走。他收买了一个不忠的仆人。趁骑士熟睡，仆人放他进了城堡。他杀死骑士，又闯进育儿室，把里面的孩子全杀了。
        - id: ch02-b10
          speaker: fairy
          text: 那晚，骑士夫人恰好带着两三个月大的小儿子，去山谷探望从前照顾她的老保姆。她遇上风暴，只能在那里过夜。第二天一早，一个逃出城堡的仆人赶来，把丈夫和孩子们的死讯告诉她。她起初怎么也不信，只想回去同亲人死在一起。老保姆流着泪劝她，她还有一个无辜的婴儿，为了这个孩子也该活下去。
        - id: ch02-b11
          speaker: fairy
          text: 夫人听从劝告，留在了老保姆家。那是最安全的藏身处，因为巨人发过誓，找到她以后，连她和婴儿一起杀死。多年后，老保姆去世，把小屋和屋里仅有的几件家具留给了她。她从此像农妇一样干活，每天只求挣到一口饭。她靠纺车纺线，还用随身仅有的一点钱买了奶牛，靠牛奶养活母子俩。她在屋边的小园子里种豌豆、豆子和卷心菜。到了收获的时候，她也不怕辛苦和难堪，去田里捡别人落下的麦穗，只求儿子有吃有穿。
        - id: ch02-b12
          speaker: fairy
          text: 杰克，那位可怜的夫人就是你的母亲。这座城堡原本属于你的父亲，也应该重新归你。
        - id: ch02-b13
          speaker: jack
          text: 我的母亲！我该怎么办？我可怜的父亲，还有我亲爱的母亲！
          emotion: surprised
        - id: ch02-b14
          speaker: fairy
          text: 你该替母亲夺回城堡。但这件事很难，到处都是危险。杰克，你敢承担吗？
        - id: ch02-b15
          speaker: jack
          text: 只要做的是正当的事，我什么都不怕。
        - id: ch02-b16
          speaker: fairy
          text: 那么，你就是能除掉巨人的人。你要进入城堡，尽力取回一只会下金蛋的母鸡，还有一把会说话的竖琴。别忘了，巨人手里的一切，本来都是你的。
        - id: ch02-b17
          speaker: narrator
          text: 红帽女人说完，忽然不见了。杰克这才明白，她是一位仙女。他立刻走到城堡前，吹响大门旁的号角。过了一会儿，一个可怕的女巨人开了门。她的额头正中只有一只巨眼。杰克转身就逃，却被她一把抓住，拖进了城堡。
        - id: ch02-b18
          speaker: giantess
          text: 呵，呵！没想到会在这儿见到我吧？我可不放你走。我早就受够这种整天干活的日子了。别的夫人都有侍童，我为什么不能有？你就留下来。巨人不在时，你替我擦刀、刷靴子、生火，再做些别的活儿。他一回来，我就把你藏好。以前的侍童都叫他吃了。像你这样的小家伙，他一定觉得味道不错。
        - id: ch02-b19
          speaker: narrator
          text: 她说着，把杰克拖进城堡深处。杰克吓坏了。换作你我，恐怕也会害怕。可他觉得男子汉不该被恐惧压倒，便强打起勇气，准备面对眼前的事。
        - id: ch02-b20
          speaker: jack
          text: 太太，我愿意帮忙，也会尽力替您做事。只求您行行好，别让您丈夫发现我。我可不想被他吃掉。
          emotion: fearful
        - id: ch02-b21
          speaker: giantess
          text: 这才是好孩子。幸好你刚才没像以前那些孩子一样尖叫，不然我丈夫早就被吵醒，把你也当成早饭吃了。快躲进大厅的大衣柜吧。他从来不敢打开那个柜子，你待在里面很安全。
        - id: ch02-b22
          speaker: narrator
          text: 女巨人把杰克关进衣柜。锁眼很大，里面不缺空气，他还可以从锁眼看见外面。不久，楼梯上传来沉重的脚步声，仿佛一门巨炮轰隆隆滚过。接着，巨人用雷鸣般的声音吼了起来。
        - id: ch02-b23
          speaker: giant
          text: 咿，呀，嗨、嗬、哼，英国人的气味我闻得真。不管活人还是死人，磨碎他的骨头做面饼！
        - id: ch02-b24
          speaker: giant
          text: 老婆，城堡里有人。把他拿来给我当早饭！
          emotion: angry
        - id: ch02-b25
          speaker: giantess
          text: 你这个又老又蠢的家伙。你闻见的是我刚煎好的象肉。快坐下，好好吃你的早饭。
        - id: ch02-b26
          speaker: narrator
          text: 女巨人端来一大盘热腾腾的肉。巨人吃得很满意，很快忘了英国人的气味。早饭后，他出去散步。女巨人放出杰克，让他帮忙。杰克干了一整天活，也吃得饱饱的。到了晚上，他又被藏回衣柜。
    - id: ch03
      title: 会下金蛋的母鸡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 巨人回来吃晚饭。杰克从锁眼里看见他啃着狼骨头，又把半只鸡一口塞进大嘴，心里十分吃惊。晚饭后，巨人叫妻子拿来那只会下金蛋的母鸡。
        - id: ch03-b02
          speaker: giant
          text: 它下的蛋还是和那卑贱骑士拥有它时一样好。我看，现在的蛋还更重了。
        - id: ch03-b03
          speaker: narrator
          text: 女巨人很快抱来一只棕色小母鸡，放在桌上。
        - id: ch03-b04
          speaker: giantess
          text: 亲爱的，你要是用不着我了，我想出去走走。
        - id: ch03-b05
          speaker: giant
          text: 去吧。我过一会儿正好睡一觉。
        - id: ch03-b06
          speaker: narrator
          text: 巨人把棕色母鸡捧到面前，命令它下蛋。
        - id: ch03-b07
          speaker: giant
          text: 给我下一枚金蛋！再下一枚！再来一枚！
        - id: ch03-b08
          speaker: narrator
          text: 每听到一次命令，母鸡就下一枚金蛋。很快，桌上便摆了三枚。杰克亲眼看见这一切，终于确信，它正是仙女要他取回的那只母鸡。
        - id: ch03-b09
          speaker: narrator
          text: 不久，巨人把母鸡放到地上，自己也睡熟了，鼾声像雷一样响。杰克等他睡沉，才轻轻推开柜门爬出来。他踮着脚穿过房间，小心抱起母鸡，匆匆离开。他认得通往厨房的路，发现厨房门正虚掩着，便推门出去，再从外面把门关严锁上。他拼命跑回豆茎旁，用最快的速度一路爬回地面。
        - id: ch03-b10
          speaker: narrator
          text: 母亲看见杰克走进家门，高兴得哭了。儿子离开的这段时间，她一直担心杰克被仙女带走，或是落进巨人手里。杰克把棕色母鸡放在她面前，又从攀上豆茎讲起，把自己怎样进入巨人的城堡，在那里看见什么、经历什么，全都告诉了母亲。母亲知道这只会下金蛋的母鸡能让他们重新富裕起来，欢喜极了。
    - id: ch04
      title: 钱袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天，母亲去赶集，杰克又爬上豆茎，来到巨人的城堡。他事先染过头发，又仔细乔装了一番。女巨人完全没有认出他，还像上次那样把他拉进去干活。听见丈夫快回来了，她照旧把杰克藏进衣柜，丝毫没想到眼前的孩子正是偷走母鸡的人。她还叮嘱杰克，在里面一动也别动，否则巨人一定会吃掉他。
        - id: ch04-b02
          speaker: giant
          text: 咿，呀，嗨、嗬、哼，英国人的气味我闻得真。不管活人还是死人，磨碎他的骨头做面饼！
        - id: ch04-b03
          speaker: giantess
          text: 胡说！你闻见的是我给你烤的一整头牛。大概是肉香把你馋坏了。快坐下，我马上端来。
        - id: ch04-b04
          speaker: narrator
          text: 巨人坐到桌边。妻子端来一整头烤牛，两个人吃起晚饭。杰克看他们啃牛骨头，就像啃一只小云雀，惊讶不已。饭后，女巨人站起身来。
        - id: ch04-b05
          speaker: giantess
          text: 亲爱的，你若准许，我想回房把那个故事读完。要用我时，你就叫一声。
        - id: ch04-b06
          speaker: giant
          text: 先把钱袋拿来。睡觉以前，我要数一数金币。
        - id: ch04-b07
          speaker: narrator
          text: 女巨人很快回来，两个肩膀上各扛着一只大钱袋。她把钱放在丈夫身旁。
        - id: ch04-b08
          speaker: giantess
          text: 喏，这就是那位骑士留下的全部钱财。等你花完，只好再去夺一位男爵的城堡了。
        - id: ch04-b09
          speaker: jack
          text: 只要我能阻止他，他就别想再抢别人的城堡。
        - id: ch04-b10
          speaker: narrator
          text: 妻子走后，巨人打开钱袋，把金币一堆又一堆倒出来。他一枚枚数过，再把它们垒成许多小堆。巨人数了很久，直到对这个游戏感到厌倦，才把金币统统扫回袋子里。他仰靠在椅子上，很快沉沉睡去。鼾声震得城堡发响，把周围所有声音都盖住了。
        - id: ch04-b11
          speaker: narrator
          text: 杰克溜出衣柜，提起两袋钱就跑。这本来就是巨人从他父亲手里抢走的。他费尽力气爬下豆茎，把金币放到母亲的桌上。母亲刚从镇上回来，见不到杰克，正急得哭泣。
        - id: ch04-b12
          speaker: jack
          text: 妈妈，你看，我把父亲失去的金子带回来了。
        - id: ch04-b13
          speaker: mother
          text: 啊，杰克，你是个好孩子。可我不愿你在巨人的城堡里拿性命冒险。快告诉我，你怎么又去那里了？
        - id: ch04-b14
          speaker: narrator
          text: 杰克把事情从头到尾讲给她听。母亲得到这些钱，当然十分高兴，可她不喜欢儿子为了自己一次次冒险。过了一阵，杰克还是决定再去巨人的城堡。
    - id: ch05
      title: 会说话的竖琴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 杰克第三次爬上豆茎，在巨人的大门外吹响号角。女巨人又没有认出他。她怕城堡再次失窃，开门时迟疑了一会儿，可杰克红润的脸实在显得天真无邪。她最终还是让他进来，把他藏进衣柜。
        - id: ch05-b02
          speaker: giant
          text: 咿，呀，嗨、嗬、哼，英国人的气味我闻得真。不管活人还是死人，磨碎他的骨头做面饼！
        - id: ch05-b03
          speaker: giantess
          text: 你这个愚蠢的老巨人。你闻见的只是我给你烤来当晚饭的肥羊。
        - id: ch05-b04
          speaker: narrator
          text: 巨人坐下来，把妻子端来的一整只羊吃得干干净净。
        - id: ch05-b05
          speaker: giant
          text: 把竖琴拿来。你出去走路的时候，我要听一会儿音乐。
        - id: ch05-b06
          speaker: narrator
          text: 女巨人照着丈夫的话，带来一把美丽的竖琴。琴架上的钻石和红宝石闪着光，琴弦全是金的。她把竖琴留在巨人面前，随后便出去散步了。
        - id: ch05-b07
          speaker: giant
          text: 这是我从那骑士手里夺来的宝物中最漂亮的一件。我喜欢音乐，这把竖琴也是个忠实的仆人。弹吧！
        - id: ch05-b08
          speaker: narrator
          text: 竖琴弹起一支轻柔哀伤的曲子。巨人又叫它换一支快乐的，它便奏出欢快的曲调。
        - id: ch05-b09
          speaker: giant
          text: 现在，给我弹一首摇篮曲！
        - id: ch05-b10
          speaker: narrator
          text: 竖琴奏起甜美的摇篮曲，巨人听着听着睡着了。杰克先溜进大厨房，确认女巨人已经外出。他轻轻打开大门，免得待会儿抱着竖琴腾不出手。随后，他回到房里，抓起竖琴就跑。
        - id: ch05-b11
          speaker: harp
          text: 主人，快醒醒！
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: 杰克刚抱着竖琴跳过门槛，它便忽然喊了起来。巨人立刻惊醒。他发出一声可怕的咆哮，从座位上一跃而起，只跨两大步就到了门口。杰克十分敏捷，抱着竖琴像闪电一样飞奔。他看出竖琴也是仙物，便一边跑，一边同它说话，告诉它，自己正是它从前那位主人，也就是那位骑士的儿子。
        - id: ch05-b13
          speaker: narrator
          text: 巨人追得飞快，越来越近，伸出大手就要抓住杰克。就在这时，他踩中一块松动的石头，直挺挺摔倒了。杰克趁机攀上豆茎，急急往下爬。可他刚到自家园子，回头一看，巨人竟也顺着豆茎追下来了。
        - id: ch05-b14
          speaker: jack
          text: 妈妈！妈妈！快把斧头给我！
          emotion: fearful
        - id: ch05-b15
          speaker: narrator
          text: 母亲拿着一柄小斧，奔到杰克身边。杰克猛劈一下，把豆茎一根根砍断，只留下最后一根。
        - id: ch05-b16
          speaker: jack
          text: 妈妈，快让开！
        - id: ch05-b17
          speaker: narrator
          text: 母亲连忙退开。幸好她及时躲远了。巨人刚抓住最后一根豆茎，杰克就一斧把它砍断，自己也飞身闪到一旁。
    - id: ch06
      title: 巨人摔断了脖子
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 巨人轰然坠地，发出一声可怕的巨响。他头朝下摔下来，折断脖子，死在那个受尽他伤害的女人脚边。杰克和母亲还没从惊吓和激动中缓过来，一位美丽的夫人已经出现在面前。
        - id: ch06-b02
          speaker: fairy
          text: 杰克，你的所作所为配得上勇敢骑士的儿子。你理应取回自己的家业。挖个坟墓埋掉巨人，然后去杀死女巨人。
        - id: ch06-b03
          speaker: jack
          text: 可是，除非同别人交战，我不能杀人。我也不能拔剑去对付一个女人。何况，女巨人一直待我很好。
        - id: ch06-b04
          speaker: narrator
          text: 仙女微笑着看向杰克。
        - id: ch06-b05
          speaker: fairy
          text: 你有这样宽厚的心，我很高兴。不过，你还是得回到城堡。到了那里，就做你认为非做不可的事。
        - id: ch06-b06
          speaker: narrator
          text: 豆茎已经倒了，杰克不知道怎样再去城堡，便请仙女指路。仙女说，可以用孔雀拉的车送他过去。杰克向她道过谢，和她一同坐上车。仙女驾着车绕了很远的路，最后来到山脚下的一个村庄。那里聚着许多男人。他们长年受巨人压迫，牛羊也被巨人吃光，因此个个面容凄苦。
        - id: ch06-b07
          speaker: fairy
          text: 朋友们，那个压迫你们、吃光你们牛羊的残忍巨人已经死了。你们能摆脱他，全靠这位年轻先生。他就是从前那位仁慈骑士的儿子。
        - id: ch06-b08
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: 我们愿意忠心侍奉他，就像从前侍奉他的父亲！
          emotion: happy
        - id: ch06-b09
          speaker: narrator
          text: 男人们听完，爆发出响亮的欢呼，纷纷围上前。仙女让大家跟她去城堡。众人一同出发，来到城堡大门外。杰克吹响挂在门边的号角，要求里面开门。
        - id: ch06-b10
          speaker: narrator
          text: 老女巨人从塔楼的箭孔里看见他们，吓得要命。她猜丈夫一定出了事，赶紧奔下楼梯，却被裙子绊住，从楼梯顶一直滚到底下，摔断了脖子。
        - id: ch06-b11
          speaker: narrator
          text: 外面的人等了很久，始终没人来开门，只好抬起铁撬，合力把城堡大门强行撬开。进去以后，四处看不见一个人影。直到众人穿过空荡荡的大厅，才在楼梯脚下发现女巨人的尸体。
        - id: ch06-b12
          speaker: narrator
          text: 杰克就这样接管了父亲留下的城堡。仙女去接他的母亲，把她带到城堡里，也把会下金蛋的母鸡和会说话的竖琴一同带来。杰克命人埋葬女巨人，又尽自己所能，补偿所有遭过巨人掠夺的人。
        - id: ch06-b13
          speaker: narrator
          text: 返回仙境以前，仙女告诉杰克，那个带着豆子的屠夫正是她派去的。她想借此看看，杰克究竟是怎样的孩子。
        - id: ch06-b14
          speaker: fairy
          text: 要是你只会呆望着巨大的豆茎，除了惊奇，什么也不做，我就会让你继续留在不幸把你推入的生活里，只把奶牛还给你母亲。可是，你有探究之心，也有非凡的勇气和进取精神，所以你应该向上攀登。登上豆茎时，你攀爬的正是命运的阶梯。
        - id: ch06-b15
          speaker: narrator
          text: 说完这些话，仙女便向杰克和他的母亲告别了。
