  chapters:
    - id: ch01
      title: I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, in the village of Montignies-sur-Roc, there lived a young cow-boy with no father or mother. His name was Michael, but everyone called him the Star Gazer. Whenever he drove the cows across the common to graze, he walked with his face turned toward the sky, staring at nothing at all.
        - id: ch01-b02
          speaker: narrator
          text: Michael had fair skin, blue eyes, and a head full of curls. The village girls often called after him.
        - id: ch01-b03
          speaker: village_girl_1
          text: Well, Star Gazer, what are you doing?
        - id: ch01-b04
          speaker: michael
          text: Oh, nothing.
        - id: ch01-b05
          speaker: narrator
          text: He would keep walking without even looking back at them. To tell the truth, he thought the girls were very ugly, with their sunburned necks, big red hands, rough skirts, and wooden shoes. Somewhere, he had heard, there were girls whose necks were white and whose hands were small. They always wore the finest silk and lace, and people called them princesses. His companions sat around the fire and saw only the usual shapes and fancies in the flames. Michael saw something else. He dreamed that one day he would have the happiness of marrying a princess.
    - id: ch02
      title: II
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One morning in the middle of August, the sun grew hottest around noon. Michael ate his whole dinner, which was nothing more than a piece of dry bread, and then lay down beneath an oak. Soon he was asleep. In his dream, a beautiful lady appeared before him, dressed in a gown made of golden cloth.
        - id: ch02-b02
          speaker: golden_lady
          text: Go to the castle of Beloeil. There you will marry a princess.
        - id: ch02-b03
          speaker: narrator
          text: That evening Michael told the farm people about the dream, for he had thought a great deal about the golden lady's advice. As anyone might expect, they only laughed at the Star Gazer.
        - id: ch02-b04
          speaker: narrator
          text: At the same hour next day, he slept beneath the same tree. Again the lady appeared.
        - id: ch02-b05
          speaker: golden_lady
          text: Go to the castle of Beloeil, and you will marry a princess.
        - id: ch02-b06
          speaker: narrator
          text: Michael told his friends that evening, and this time they laughed harder than ever.
        - id: ch02-b07
          speaker: michael
          text: Never mind. If she comes a third time, I'll do what she says.
        - id: ch02-b08
          speaker: narrator
          text: The following afternoon, to the whole village's surprise, they heard a voice singing at about two o'clock.
        - id: ch02-b09
          speaker: michael
          text: Raleô, raleô, how the cattle go!
        - id: ch02-b10
          speaker: narrator
          text: It was Michael, bringing the herd back to the byre. The farmer began scolding him furiously.
        - id: ch02-b11
          speaker: michael
          text: I'm going away.
        - id: ch02-b12
          speaker: narrator
          text: He tied his clothes into a bundle, said goodbye to every one of his friends, and boldly set off to seek his fortune. The whole village buzzed with excitement over his departure. People climbed to the top of the hill to watch. They held their sides with laughter as the Star Gazer marched bravely down the valley, with his little bundle hanging from the end of a stick. And really, it was enough to make anyone laugh.
    - id: ch03
      title: III
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Everyone for a full twenty miles around knew that twelve wonderfully beautiful princesses lived in Beloeil Castle. They were every bit as proud as they were lovely. Their blood was truly royal, and they were so extraordinarily sensitive that they would have felt a single pea beneath their beds, even if someone had piled mattress after mattress on top of it.
        - id: ch03-b02
          speaker: narrator
          text: People whispered that they lived exactly as princesses should. They slept late and never rose before noon. All twelve beds stood in one room. Yet although three bolts locked the sisters inside each night, every morning their satin shoes had holes worn through them.
        - id: ch03-b03
          speaker: narrator
          text: Whenever anyone asked what they had done all night, they said they had slept. No sound had come from the room. Still, those shoes could hardly wear themselves out.
        - id: ch03-b04
          speaker: narrator
          text: At last the Duke of Beloeil ordered trumpets sounded throughout the land. Whoever discovered how his daughters ruined their shoes could choose one of them as his wife.
        - id: ch03-b05
          speaker: narrator
          text: When the proclamation was heard, princes came from everywhere to try their luck. They took turns watching all night behind the open door of the princesses' room. Yet when morning came, every prince who had kept watch had disappeared. Not one person could say what had become of them.
    - id: ch04
      title: IV
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When Michael reached the castle, he went straight to the gardener and asked for work. The garden boy had just been dismissed. Michael did not look very strong, but the gardener thought his handsome face and golden curls would please the princesses, so he hired him.
        - id: ch04-b02
          speaker: narrator
          text: His first duty was to offer each princess a bouquet when she rose. Michael decided that if this was the worst task he faced, he would do very well.
        - id: ch04-b03
          speaker: narrator
          text: He waited behind their door with twelve bouquets in a basket and handed one to each sister. They took the flowers without even glancing at him. Only Lina, the youngest, looked at him with large black eyes as soft as velvet.
        - id: ch04-b04
          speaker: lina
          text: Oh, our new flower boy is so pretty!
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: The others burst out laughing.
        - id: ch04-b06
          speaker: eldest_princess
          text: A princess should never lower herself by looking at a garden boy.
        - id: ch04-b07
          speaker: narrator
          text: Michael knew perfectly well what had happened to every prince who had tried before him. Even so, Lina's beautiful eyes filled him with a powerful longing to take his own chance. Unfortunately, he did not dare step forward and make the attempt. He feared that everyone would jeer at such boldness from a garden boy. They might even drive him from the castle for being so impudent.
    - id: ch05
      title: V
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then the Star Gazer had another dream. The lady in gold stood before him again. In one hand she held two young trees, a cherry laurel and a rose laurel. In the other were a little golden rake, a little golden bucket, and a silken towel.
        - id: ch05-b02
          speaker: golden_lady
          text: Plant these laurels in two large pots. Tend them with the rake, the bucket, and the towel. When they stand as tall as a girl of fifteen, tell each tree how you cared for it. Then ask for whatever you choose, and the laurels will give it to you.
        - id: ch05-b03
          speaker: narrator
          text: Michael thanked her. When he woke, the two laurel bushes were beside him. He carefully followed every instruction she had given.
        - id: ch05-b04
          speaker: narrator
          text: The trees grew with astonishing speed. Michael kept tending them until both stood as tall as a girl of fifteen, just as the lady had promised. Then he went to the cherry laurel and spoke to it.
        - id: ch05-b05
          speaker: michael
          text: My lovely cherry laurel, I raked you with the golden rake, watered you with the golden bucket, and wiped you with the silken towel. Teach me how to become invisible.
        - id: ch05-b06
          speaker: narrator
          text: At once, a pretty white flower opened on the laurel before his eyes. Michael very carefully picked it and tucked it into his buttonhole.
    - id: ch06
      title: VI
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: That evening, when the princesses went upstairs to bed, Michael followed them in his bare feet so that he would make no sound. Once inside their shared room, he slipped beneath one of the twelve beds. There he could stay hidden without taking up much room.
        - id: ch06-b02
          speaker: narrator
          text: The sisters began opening their wardrobes and boxes at once. They drew out their most magnificent dresses and put them on while looking into the mirrors. When they had finished, they turned slowly all the way around to admire how they looked. Michael could see nothing from beneath the bed, but he could hear everything. He listened as the princesses laughed and jumped with pleasure.
        - id: ch06-b03
          speaker: eldest_princess
          text: Hurry, sisters. Our partners will be growing impatient.
        - id: ch06-b04
          speaker: narrator
          text: An hour later the room fell quiet. Michael peeped out. All twelve sisters stood there in splendid clothes, satin shoes on their feet and his bouquets in their hands.
        - id: ch06-b05
          speaker: eldest_princess
          text: Is everyone ready?
        - id: ch06-b06
          speakers: [princess_2, princess_3, princess_4, lina]
          ensemble: chorus
          text: Yes!
        - id: ch06-b07
          speaker: narrator
          text: They lined up behind the eldest. She clapped three times, and a trapdoor opened. The princesses vanished down a secret stairway, with Michael hurrying after them.
        - id: ch06-b08
          speaker: narrator
          text: He followed close behind Lina and accidentally stepped on her dress.
        - id: ch06-b09
          speaker: lina
          text: Someone is behind me! Something is holding my dress!
          emotion: fearful
        - id: ch06-b10
          speaker: eldest_princess
          text: Don't be silly. You're always frightened of something. Your dress only caught on a nail.
    - id: ch07
      title: VII
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Down and down they went until they reached a passage with a latched door at the end. The eldest opened it. Beyond lay a lovely little wood, where drops of silver spangled every leaf and shone beneath the brilliant moon.
        - id: ch07-b02
          speaker: narrator
          text: Next they crossed a wood with gold sprinkled over its leaves. Then came a third wood, where the leaves glittered with diamonds.
        - id: ch07-b03
          speaker: narrator
          text: At last Michael saw a great lake. Twelve little boats with awnings waited by the shore, each holding a prince with his hands on the oars.
        - id: ch07-b04
          speaker: narrator
          text: Every princess stepped into a boat, and Michael slipped into Lina's. The boats moved swiftly, but the extra weight kept hers behind the rest.
        - id: ch07-b05
          speaker: lina
          text: We've never gone this slowly. What could be wrong?
        - id: ch07-b06
          speaker: youngest_prince
          text: I don't know. I'm rowing as hard as I possibly can.
        - id: ch07-b07
          speaker: narrator
          text: Across the lake, Michael saw a beautiful castle ablaze with light. Lively music poured from its windows, with fiddles, kettledrums, and trumpets all playing. In another moment, the boats touched the opposite shore. Everyone jumped out. The princes fastened their boats securely, offered their arms to the princesses, and escorted them toward the shining castle.
    - id: ch08
      title: VIII
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: Michael entered the ballroom behind them. Mirrors, lights, flowers, and damask hangings filled every side, and their splendor quite overwhelmed him.
        - id: ch08-b02
          speaker: narrator
          text: He stood out of the way in a corner and watched the graceful princesses. Their beauty came in every kind. Some were fair and some were dark. Some had chestnut curls, some had hair darker still, and some had golden locks. Never had so many beautiful princesses gathered in one place at the same time. Yet to Michael, none was as beautiful or as fascinating as the little princess with eyes like velvet.
        - id: ch08-b03
          speaker: narrator
          text: How eagerly Lina danced! With one hand on her partner's shoulder, she swept past like a whirlwind. Her cheeks glowed and her eyes sparkled. Plainly, she loved dancing more than anything.
        - id: ch08-b04
          speaker: narrator
          text: The poor cow-boy envied every handsome young man who had the pleasure of dancing so gracefully with Lina. As he watched from the corner, he had no idea how little reason there really was to be jealous of any of them.
        - id: ch08-b05
          speaker: narrator
          text: Those young men were the very princes who had tried to discover the sisters' secret, fifty of them at least. The princesses had given them a magic drink. It froze their hearts and left them loving nothing but dancing.
    - id: ch09
      title: IX
      blocks:
        - id: ch09-b01
          speaker: narrator
          text: The dancing continued until every princess had worn holes right through her satin shoes. Then the rooster crowed for the third time, and at once the fiddles stopped. Young pages served a delicious supper. There were sugared orange blossoms, crystallized rose leaves, powdered violets, cracknels, wafers, and many other fine dishes. Everyone knows, of course, that these are the favorite foods of princesses.
        - id: ch09-b02
          speaker: narrator
          text: After supper, everyone returned to the boats. This time Michael rode with the eldest princess. They crossed the diamond wood, the golden wood, and then the silver wood. To prove what he had seen, Michael snapped a little branch from a silver-spangled tree. Lina turned at the sound.
        - id: ch09-b03
          speaker: lina
          text: What made that noise?
        - id: ch09-b04
          speaker: eldest_princess
          text: Nothing at all. It was only the barn owl that lives in a castle turret.
        - id: ch09-b05
          speaker: narrator
          text: While she answered, Michael slipped ahead. He raced up the stairs and reached the bedroom before the sisters. Then he opened the window, slid down the vine on the wall, and landed in the garden. The sun was beginning to rise, and it was already time for work.
    - id: ch10
      title: X
      blocks:
        - id: ch10-b01
          speaker: narrator
          text: That day, while making the twelve bouquets, Michael hid the silver branch inside the one meant for Lina. She was very surprised when she discovered it, but she said nothing at all to her sisters. Later, as she walked in the shade beneath the elm trees, she happened to meet the garden boy. Lina stopped suddenly as though she wanted to speak to him. Then she changed her mind and continued on her way.
        - id: ch10-b02
          speaker: narrator
          text: That evening the sisters returned to the ball. Michael followed and once more crossed the lake in Lina's boat. This time her prince complained.
        - id: ch10-b03
          speaker: youngest_prince
          text: The boat feels terribly heavy tonight.
        - id: ch10-b04
          speaker: lina
          text: It must be the heat. I've felt very warm myself.
        - id: ch10-b05
          speaker: narrator
          text: At the ball, Lina searched everywhere for the garden boy, but never saw him. On the way home, Michael broke a branch from the golden wood. Now the eldest sister heard it.
        - id: ch10-b06
          speaker: lina
          text: It's nothing. That's only the owl calling from the castle turret.
    - id: ch11
      title: XI
      blocks:
        - id: ch11-b01
          speaker: narrator
          text: As soon as Lina rose, she found the golden branch in her bouquet. She lingered after her sisters had gone downstairs and spoke to Michael.
        - id: ch11-b02
          speaker: lina
          text: Where did this branch come from?
        - id: ch11-b03
          speaker: michael
          text: Your Royal Highness knows the answer.
        - id: ch11-b04
          speaker: lina
          text: Then you followed us?
        - id: ch11-b05
          speaker: michael
          text: Yes, Princess.
        - id: ch11-b06
          speaker: lina
          text: How did you do it? None of us saw you.
        - id: ch11-b07
          speaker: michael
          text: I kept myself hidden.
        - id: ch11-b08
          speaker: narrator
          text: Lina paused.
        - id: ch11-b09
          speaker: lina
          text: You know our secret. Keep it, and take this for your silence.
        - id: ch11-b10
          speaker: narrator
          text: She tossed him a purse of gold.
        - id: ch11-b11
          speaker: michael
          text: My silence isn't for sale.
        - id: ch11-b12
          speaker: narrator
          text: He walked away without touching the purse. For three nights Lina neither saw nor heard anything strange. On the fourth, she heard a rustle in the diamond wood. The next day, a diamond-covered branch lay in her bouquet. She drew Michael aside and spoke harshly.
        - id: ch11-b13
          speaker: lina
          text: You know what my father promised in return for our secret, don't you?
          emotion: angry
        - id: ch11-b14
          speaker: michael
          text: I do, Princess.
        - id: ch11-b15
          speaker: lina
          text: Are you going to tell him?
        - id: ch11-b16
          speaker: michael
          text: I don't intend to.
        - id: ch11-b17
          speaker: lina
          text: Are you afraid?
        - id: ch11-b18
          speaker: michael
          text: No, Princess.
        - id: ch11-b19
          speaker: lina
          text: Then why are you keeping quiet?
        - id: ch11-b20
          speaker: narrator
          text: Michael gave her no answer.
    - id: ch12
      title: XII
      blocks:
        - id: ch12-b01
          speaker: narrator
          text: Lina's sisters had seen her talking to the little garden boy, and they mocked her for it.
        - id: ch12-b02
          speaker: eldest_princess
          text: Why don't you marry him? You could become a gardener too. You could live in a cottage at the end of the park, help your husband draw water from the well, and bring us bouquets when we get up. What a charming life!
        - id: ch12-b03
          speaker: narrator
          text: Lina was furious. When Michael offered her bouquet, she took it with great disdain. He remained perfectly respectful and never lifted his eyes to her. Yet through nearly the whole day, she felt him beside her without ever seeing him.
        - id: ch12-b04
          speaker: narrator
          text: At last she decided to tell the eldest everything.
        - id: ch12-b05
          speaker: eldest_princess
          text: What? That rogue knows our secret, and you never told me? We must get rid of him at once!
          emotion: angry
        - id: ch12-b06
          speaker: lina
          text: But how can we do that?
        - id: ch12-b07
          speaker: eldest_princess
          text: We'll have him taken to the dungeon tower, of course.
        - id: ch12-b08
          speaker: narrator
          text: In olden days, that was how beautiful princesses dealt with people who knew too much. But strange to say, the youngest sister did not care for this plan at all. After all, the garden boy had told their father nothing.
    - id: ch13
      title: XIII
      blocks:
        - id: ch13-b01
          speaker: narrator
          text: The sisters agreed to ask the other ten. Every one sided with the eldest. Lina then declared that if they laid one finger on Michael, she would tell their father herself why their shoes had holes.
        - id: ch13-b02
          speaker: narrator
          text: At last they decided to test him. They would take him to the ball and give him the magic drink after supper, enchanting him like all the princes before him.
        - id: ch13-b03
          speaker: narrator
          text: They summoned the Star Gazer and demanded to know how he had learned their secret. He still refused to say. Then the eldest gave him their command in her most commanding voice.
        - id: ch13-b04
          speaker: michael
          text: I will obey.
        - id: ch13-b05
          speaker: narrator
          text: The princesses did not know that Michael had been present at their council. The white flower had made him invisible, so he had stood among them and heard every word of their plan. Even knowing what the magic drink would do, he had made up his mind to swallow it. He was ready to sacrifice himself if that would bring happiness to the princess he loved.
        - id: ch13-b06
          speaker: narrator
          text: Still, he did not want to look foolish beside the other dancers. He went straight to the laurels.
        - id: ch13-b07
          speaker: michael
          text: My lovely rose laurel, I raked you with the golden rake, watered you with the golden bucket, and dried you with a silken towel. Dress me like a prince.
        - id: ch13-b08
          speaker: narrator
          text: A beautiful pink flower appeared. Michael picked it, and in an instant he wore black velvet, dark as Lina's eyes. A matching cap, a diamond plume, and a rose-laurel blossom completed his clothes.
        - id: ch13-b09
          speaker: narrator
          text: Dressed this way, he went before the Duke that evening and received permission to try to uncover the daughters' secret. He looked so distinguished that hardly anyone could have recognized him.
    - id: ch14
      title: XIV
      blocks:
        - id: ch14-b01
          speaker: narrator
          text: The twelve princesses went upstairs as usual, and Michael followed them. He waited behind their open door until they gave the secret signal to leave. On this journey, he did not cross the lake in Lina's boat. At the castle he offered his arm first to the eldest sister, then danced with every princess in turn. He was so graceful and such a fine partner that everyone there was delighted with him.
        - id: ch14-b02
          speaker: narrator
          text: At last it was Lina's turn. She thought him the finest partner in the world, though he did not dare say one word to her. As he led her back to her place, she mocked him.
        - id: ch14-b03
          speaker: lina
          text: Now you've reached the height of your wishes. Everyone is treating you like a prince.
        - id: ch14-b04
          speaker: michael
          text: Don't worry. You will never have to be a gardener's wife.
          emotion: calm
        - id: ch14-b05
          speaker: narrator
          text: Lina stared at him in fright, and he left before she could answer.
        - id: ch14-b06
          speaker: narrator
          text: Once their satin shoes wore through, the music stopped and the pages laid supper on the table. Michael sat beside the eldest princess and across from Lina. They offered him exquisite dishes and delicate wines. Compliments and flattery came at him from every side, all meant to turn his head. Yet neither the wine nor the praise intoxicated him.
    - id: ch15
      title: XV
      blocks:
        - id: ch15-b01
          speaker: narrator
          text: At last the eldest princess gave a signal, and one of the pages carried in a large golden cup.
        - id: ch15-b02
          speaker: eldest_princess
          text: The enchanted castle has no secrets left for you. Let us drink to your success.
        - id: ch15-b03
          speaker: narrator
          text: Michael looked long at Lina. Then, without hesitating, he raised the cup.
        - id: ch15-b04
          speaker: lina
          text: Don't drink it! I would rather marry a gardener!
          emotion: fearful
        - id: ch15-b05
          speaker: narrator
          text: As soon as she cried out, Lina burst into tears. Michael threw the contents of the golden cup behind him, sprang clear over the table, and fell at her feet. At that same instant, all the other princes dropped to their knees before the princesses. Each sister chose one of them for a husband and raised him to stand beside her. The magic that had frozen their hearts was broken.
        - id: ch15-b06
          speaker: narrator
          text: The twelve couples climbed into the little boats and crossed the lake. The boats had to travel back and forth many times before all the other princes had been carried over as well. Then the whole company passed through the diamond wood, the golden wood, and the silver wood. The moment they crossed the door into the underground passage, a tremendous crash sounded behind them. It seemed that the enchanted castle itself was crumbling to the earth.
        - id: ch15-b07
          speaker: narrator
          text: Without stopping anywhere else, they went straight to the room of the Duke of Beloeil. He had only just awakened. Michael still held the enchanted castle's golden cup in his hand, and with that proof before them all, he revealed the whole secret of the holes in his daughters' shoes.
        - id: ch15-b08
          speaker: duke
          text: Then choose whichever daughter you wish.
        - id: ch15-b09
          speaker: michael
          text: I have already chosen.
        - id: ch15-b10
          speaker: narrator
          text: The garden boy held out his hand to the youngest princess. Lina blushed and lowered her eyes.
    - id: ch16
      title: XVI
      blocks:
        - id: ch16-b01
          speaker: narrator
          text: Princess Lina did not become a gardener's wife. Instead, the Star Gazer became a prince. Before the wedding, however, Lina insisted that he tell her how he had discovered the secret.
        - id: ch16-b02
          speaker: narrator
          text: So Michael took her to the two laurels and showed her how the magical trees had helped him. Lina listened carefully. She was a prudent girl, and she decided that such trees would give her future husband far too much advantage over his wife. She cut both laurels down at the roots and threw them into the fire.
        - id: ch16-b03
          speaker: narrator
          text: And that is why country girls go singing, “We shall go to the woods no more. The laurels are cut down,” as they dance by moonlight in summer.
