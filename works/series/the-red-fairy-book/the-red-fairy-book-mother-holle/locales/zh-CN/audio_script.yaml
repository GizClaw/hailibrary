audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    diligent_daughter:
      display_name: 勤劳的姑娘
      tts:
        delivery: 善良诚恳，受委屈时柔弱却不失真挚
        timbre: 年轻清柔
        pace: 适中
        pitch: 中高
    stepmother:
      display_name: 继母
      tts:
        delivery: 偏心严厉，对亲生女儿则明显袒护
        timbre: 成熟尖冷
        pace: 稍快
        pitch: 中等
    bread:
      display_name: 面包
      tts:
        delivery: 焦急急切，反复呼求时清楚有力
        timbre: 明亮轻脆
        pace: 稍快
        pitch: 中高
    apple_tree:
      display_name: 苹果树
      tts:
        delivery: 热切直爽，带着成熟果实的丰足感
        timbre: 温润饱满
        pace: 适中
        pitch: 中等
    mother_holle:
      display_name: 霍勒大妈
      tts:
        delivery: 古老稳重，和善时亲切，裁断时不容置疑
        timbre: 苍老浑厚
        pace: 缓慢
        pitch: 中低
    hen:
      display_name: 老母鸡
      tts:
        delivery: 欢快响亮，像唱短短的报信歌谣
        timbre: 清脆高亮
        pace: 稍快
        pitch: 高
    lazy_daughter:
      display_name: 懒姑娘
      tts:
        delivery: 骄横懒散，想到奖赏时又贪心急切
        timbre: 年轻偏尖
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 掉进井里的纺锤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个寡妇养着两个女儿。一个姑娘漂亮聪明，却不是她亲生的。另一个又丑又懒，倒是她自己的女儿。寡妇偏爱亲生女儿，家里所有的活儿便都压在漂亮姑娘身上。她成天做粗活，活得就像家里的女仆。
        - id: ch01-b02
          speaker: narrator
          text: 每天，姑娘还得坐到大路边的井旁纺线，一直纺到手指又痛又破，常常渗出血来。一天，几滴血落在了纺锤上。她把纺锤伸进井水，想洗去血迹，谁知手上一滑，纺锤掉进井里去了。姑娘哭着告诉继母，换来的却是一顿狠骂。
        - id: ch01-b03
          speaker: stepmother
          text: 纺锤是你掉下去的，你就自己去捞。找不回来，别让我再看见你！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 可怜的姑娘回到井边，心里又苦又怕，完全不知道该怎么办。绝望之下，她竟跳进井里，一直往下沉。过了一阵，她什么也不知道了。等姑娘重新醒来，身下却不是冰冷的井底，而是一片美丽的草地。阳光在头顶照耀，脚边开着千万朵鲜花。
        - id: ch01-b05
          speaker: narrator
          text: 姑娘站起来，沿着这片神奇的草地向前走。她先看见一只面包烤炉，炉里装满了面包。她才走到旁边，面包就叫住了她。
        - id: ch01-b06
          speaker: bread
          text: 快把我拿出去！快一点，不然我就要烤成焦炭了。我早就熟透啦！
        - id: ch01-b07
          speaker: narrator
          text: 姑娘赶紧走到炉边，把面包一只接一只，全都取了出来。她继续往前走，又遇见一棵苹果树。树上结满红扑扑的苹果，好看极了。苹果树也向她喊起来。
        - id: ch01-b08
          speaker: apple_tree
          text: 快来摇摇我吧！我的苹果全都熟透了！
        - id: ch01-b09
          speaker: narrator
          text: 姑娘抱住树干用力摇。苹果像雨点一样落个不停，直到枝头一只也没有了。她把满地的苹果收拢成一堆，这才再次上路。
    - id: ch02
      title: 霍勒大妈的羽毛雪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姑娘最后来到一座小屋前。门边坐着一个老妇人，嘴里的牙齿大得吓人。姑娘心里一惊，转身就想逃。老妇人却在身后叫住了她。
        - id: ch02-b02
          speaker: mother_holle
          text: 好孩子，你怕什么呀？留下来陪我，做我的小女仆吧。只要你认真干活，我会好好酬谢你。替我铺床时一定要用心，把被褥抖到羽毛飞起来。下面人间的人看到那些羽毛，就会说下雪了。因为我就是霍勒大妈。
        - id: ch02-b03
          speaker: narrator
          text: 霍勒大妈说话十分和气，姑娘渐渐不怕了，也痛快地答应留下。她干什么都尽心尽力，总想让霍勒大妈满意。每次铺床，她都卖力抖动被褥，让羽毛像雪花一样四处飞舞。
        - id: ch02-b04
          speaker: narrator
          text: 姑娘在这里过得很安逸，从来没人责骂她，每天还能吃到最肥美的食物。可是日子一天天过去，她却越来越忧郁。起初，姑娘自己也说不清缘故。后来她终于明白，原来是想家了。于是，她去向霍勒大妈告别。
        - id: ch02-b05
          speaker: diligent_daughter
          text: 我知道，这里的日子比我以前好上一千倍。您待我这样好，可我还是很想回家。我实在不能再留下了，我得回到亲人身边去。
          emotion: sad
        - id: ch02-b06
          speaker: mother_holle
          text: 你想回家，我很高兴。你一直忠心地服侍我，我会亲自送你回到人间。
        - id: ch02-b07
          speaker: narrator
          text: 霍勒大妈牵着姑娘，来到一扇敞开的门前。姑娘刚刚跨过门槛，一阵沉甸甸的金雨便从头顶落下来。金子落遍全身，把她从头到脚裹得金光闪闪。
        - id: ch02-b08
          speaker: mother_holle
          text: 你是个勤劳的好姑娘，这些就是给你的奖赏。
        - id: ch02-b09
          speaker: narrator
          text: 霍勒大妈还把掉进井里的纺锤还给了她，随后关上门。姑娘一转身，发现自己已经回到人间，离家并不远。她走进自家院子，蹲在墙头的老母鸡一见她，马上唱了起来。
        - id: ch02-b10
          speaker: hen
          text: 咯咯，咯咯，咯咯哒，我们的金姑娘回家啦！
        - id: ch02-b11
          speaker: narrator
          text: 姑娘走进屋里。继母看她满身都是金子，立刻欢天喜地地把她迎回了家。
    - id: ch03
      title: 懒姑娘走上同一条路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘把井下发生的一切，从头到尾讲了一遍。继母听说那些金子是怎么来的，满心只想让自己又懒又丑的亲生女儿也得到同样的好运。她让懒姑娘坐到井边纺线。懒姑娘不愿辛苦磨破手指，竟把手伸进荆棘篱笆里，故意刺出血来。接着，她把染血的纺锤扔进井里，自己也跳了下去。
        - id: ch03-b02
          speaker: narrator
          text: 她和姐姐一样，醒来时躺在美丽的草地上，也沿着同一条路往前走。来到烤炉边，面包照样向她求救。
        - id: ch03-b03
          speaker: bread
          text: 快把我拿出去！再不拿，我就要烤成焦炭了。我已经熟透啦！
        - id: ch03-b04
          speaker: narrator
          text: 懒姑娘看也不想多看一眼，张口便回绝了。
        - id: ch03-b05
          speaker: lazy_daughter
          text: 真会说笑！难道还想让我为了你，把自己的手弄脏吗？
          emotion: disgusted
        - id: ch03-b06
          speaker: narrator
          text: 她把面包留在炉里，继续赶路。没过多久，那棵结满熟苹果的树出现在面前，也开口请她帮忙。
        - id: ch03-b07
          speaker: apple_tree
          text: 快来摇摇我吧！我的苹果全都熟透了！
        - id: ch03-b08
          speaker: lazy_daughter
          text: 我才不摇呢。万一有只苹果掉下来，砸到我的头怎么办？
        - id: ch03-b09
          speaker: narrator
          text: 懒姑娘就这样走了过去，终于来到霍勒大妈的小屋。姐姐已经告诉过她那两排大牙齿，所以她一点也不害怕，很快就答应留下做女仆。
        - id: ch03-b10
          speaker: narrator
          text: 第一天，她干得十分卖力。霍勒大妈吩咐什么，她就做什么，因为她一直惦记着将来会落到自己身上的金子。到了第二天，她便开始偷懒。第三天早晨，她连床也不肯起了。她不好好铺床，也从不肯使劲抖动被褥，羽毛自然飞不起来。
        - id: ch03-b11
          speaker: narrator
          text: 霍勒大妈很快厌倦了这个女仆，便叫她离开。懒姑娘听了不但不难过，反而喜出望外。她心里只有一个念头。
        - id: ch03-b12
          speaker: lazy_daughter
          text: 这下好了，金雨马上就要落到我身上了！
          emotion: happy
    - id: ch04
      title: 永远洗不掉的沥青
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 霍勒大妈领着懒姑娘，来到姐姐离开时走过的那扇门。懒姑娘满心等着金雨。可是她才跨过门槛，头顶落下来的根本不是金子，而是满满一大锅又黑又黏的沥青。沥青从头淋到脚，把她严严实实裹住了。
        - id: ch04-b02
          speaker: mother_holle
          text: 这就是你干活应得的报酬。
        - id: ch04-b03
          speaker: narrator
          text: 霍勒大妈说完，便在她身后关上了门。懒姑娘只得浑身带着沥青回家。她走进院子时，墙头那只老母鸡低头一看，又唱起了一支报信的歌。
        - id: ch04-b04
          speaker: hen
          text: 咯咯，咯咯，咯咯哒，我们的脏姑娘回家啦！
        - id: ch04-b05
          speaker: narrator
          text: 沥青牢牢粘在懒姑娘身上。从那一天起，直到她生命的最后一刻，那层沥青也没能洗掉。
