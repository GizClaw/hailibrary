  chapters:
    - id: ch01
      title: The Spindle in the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a widow with two daughters. One was her own child, and she was ugly and lazy. The other was her stepdaughter, a pretty, clever girl. The widow loved her own daughter much more, so the stepdaughter had to do every bit of work in the house. She was treated like a servant.
        - id: ch01-b02
          speaker: narrator
          text: Each day, the girl sat beside a well on the high road and spun thread until her fingers were sore and bleeding. One day, drops of blood stained her spindle. She lowered it into the well to rinse it, but it slipped from her hand and fell into the water.
        - id: ch01-b03
          speaker: narrator
          text: Crying, she ran to her stepmother and told her what had happened. The woman scolded her without mercy.
        - id: ch01-b04
          speaker: stepmother
          text: You dropped the spindle down there, so you can go after it. Do not show your face here again without it!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: The poor girl went back to the well. She was so miserable and desperate that she no longer knew what she was doing. She jumped in and sank to the bottom.
        - id: ch01-b06
          speaker: narrator
          text: For a while, she knew nothing at all. When she opened her eyes again, she was lying in a beautiful meadow. The sun shone above her, and a thousand flowers bloomed around her feet.
    - id: ch02
      title: The Road to Mother Holle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: She got up and walked through that enchanted place. Before long, she came to a baker's oven. It was full of loaves, and the bread called to her.
        - id: ch02-b02
          speaker: bread
          text: Please take us out! We will burn to cinders if we stay here. We are baked through already!
        - id: ch02-b03
          speaker: narrator
          text: The girl hurried to the oven and pulled out every loaf, one after another. Then she continued along the path.
        - id: ch02-b04
          speaker: narrator
          text: A little farther on stood an apple tree loaded with beautiful, rosy apples. The tree called down to her.
        - id: ch02-b05
          speaker: apple_tree
          text: Please shake me! All my apples are ripe and ready!
        - id: ch02-b06
          speaker: narrator
          text: She shook the tree until apples fell like rain and not one remained on a branch. She gathered every apple into a heap, then went on again.
        - id: ch02-b07
          speaker: narrator
          text: At last, she reached a little house. An old woman sat by the door. Her teeth were so large that the girl grew frightened and turned to run, but the old woman called after her.
        - id: ch02-b08
          speaker: mother_holle
          text: What frightens you, dear child? Stay here and work as my maid. Do your work well, and I will reward you generously. Take special care with my bed. Shake it hard enough to send the feathers flying. Then the people in the world below say that it is snowing, for I am Mother Holle.
        - id: ch02-b09
          speaker: narrator
          text: Mother Holle spoke so kindly that the girl found her courage. She agreed to stay and serve her.
    - id: ch03
      title: The Golden Maid
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The girl worked hard to please Mother Holle. Whenever she made the bed, she shook it with all her strength, and the feathers whirled through the air like snowflakes. She had an easy life there. No one scolded her, and she always had plenty to eat.
        - id: ch03-b02
          speaker: narrator
          text: After she had lived there for some time, sadness crept over her. At first, she could not understand it. Then she realized that she was homesick, and she went to Mother Holle.
        - id: ch03-b03
          speaker: stepdaughter
          text: I have a far better life here than I ever had at home. Even so, I long to go back. You have been very kind to me, but I cannot stay any longer. I must return to my own people.
          emotion: sad
        - id: ch03-b04
          speaker: mother_holle
          text: I am glad that you wish to go home. You have served me faithfully, so I will take you back to the world myself.
        - id: ch03-b05
          speaker: narrator
          text: Mother Holle took the girl by the hand and led her to an open doorway. As the girl stepped through, a heavy shower of gold poured over her. It covered her from head to foot.
        - id: ch03-b06
          speaker: mother_holle
          text: This is your reward for being such a good worker.
        - id: ch03-b07
          speaker: narrator
          text: Mother Holle also returned the spindle that had fallen into the well. Then she closed the door. The girl found herself back in her own world, close to home.
        - id: ch03-b08
          speaker: narrator
          text: When she entered the courtyard, the old hen on top of the wall called out.
        - id: ch03-b09
          speaker: hen
          text: Click, clock, clack! Our golden maid has come back!
        - id: ch03-b10
          speaker: narrator
          text: The girl went inside. When her stepmother saw all that gold, she welcomed her home. Then the girl told her everything that had happened.
    - id: ch04
      title: The Second Journey
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As soon as the widow heard where the riches had come from, she wanted the same good fortune for her own lazy daughter. She sent the girl to sit beside the well and spin.
        - id: ch04-b02
          speaker: narrator
          text: To stain the spindle with blood, the stepsister pushed her hand into a thorn hedge and pricked her finger. Then she threw the spindle into the well and jumped in after it.
        - id: ch04-b03
          speaker: narrator
          text: Like her sister, she awoke in the lovely meadow and followed the same path. When she reached the baker's oven, the bread called to her.
        - id: ch04-b04
          speaker: bread
          text: Please take us out! We will burn to cinders if we stay here. We are baked through already!
        - id: ch04-b05
          speaker: stepsister
          text: What a fine joke! As if I would dirty my hands for you.
        - id: ch04-b06
          speaker: narrator
          text: She walked on and soon came to the apple tree.
        - id: ch04-b07
          speaker: apple_tree
          text: Please shake me! All my apples are ripe and ready!
        - id: ch04-b08
          speaker: stepsister
          text: I certainly will not. One of those apples might fall on my head.
        - id: ch04-b09
          speaker: narrator
          text: She continued on her way. When she reached Mother Holle's house, she felt no fear at all. Her sister had already warned her about the old woman's large teeth, and she readily agreed to work as her maid.
    - id: ch05
      title: The Pitch-Covered Maid
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the first day, the stepsister worked very hard and obeyed every instruction. All the while, she was thinking about the gold Mother Holle would give her. On the second day, she began to grow lazy. On the third, she would not even get out of bed in the morning.
        - id: ch05-b02
          speaker: narrator
          text: She stopped making Mother Holle's bed properly and never shook it enough to send the feathers flying. Mother Holle soon grew tired of her and sent her away. The lazy girl was delighted.
        - id: ch05-b03
          speaker: stepsister
          text: Now the shower of gold will come!
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: Mother Holle led her to the same doorway. But when the girl stepped through, no gold fell. Instead, a whole kettleful of pitch poured down over her.
        - id: ch05-b05
          speaker: mother_holle
          text: This is your reward for the work you did.
        - id: ch05-b06
          speaker: narrator
          text: Mother Holle shut the door behind her. The lazy girl went home covered in pitch. When the hen on the wall saw her, it cried out.
        - id: ch05-b07
          speaker: hen
          text: Click, clock, clack! Our dirty maid has come back!
        - id: ch05-b08
          speaker: narrator
          text: The pitch stuck fast. For as long as the girl lived, it never came off.
