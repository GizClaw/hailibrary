  chapters:
    - id: ch01
      title: I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a great lord named Burchard lived at Quesnoy in Flanders. The country people called him Burchard the Wolf. His heart was so cruel that people whispered he harnessed peasants to his plough and whipped them until they tilled his land in bare feet.
        - id: ch01-b02
          speaker: narrator
          text: His wife was entirely different. She was always kind to poor and suffering people. Whenever she heard of another wrong her husband had done, she quietly went out and made things right. All through the countryside, people blessed her name. They loved the Countess as deeply as they hated the Count.
    - id: ch02
      title: II
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, while the Count was hunting, he passed through a forest. At the door of a lonely cottage, he saw a beautiful girl spinning hemp.
        - id: ch02-b02
          speaker: burchard
          text: What is your name?
        - id: ch02-b03
          speaker: renelde
          text: Renelde, my lord.
        - id: ch02-b04
          speaker: burchard
          text: You must grow tired of living in such a lonely place.
        - id: ch02-b05
          speaker: renelde
          text: I am used to being here, my lord. It does not trouble me.
        - id: ch02-b06
          speaker: burchard
          text: Even so, come to the castle. You can serve as the Countess's maid.
        - id: ch02-b07
          speaker: renelde
          text: I cannot, my lord. My grandmother is helpless, and I must care for her.
        - id: ch02-b08
          speaker: burchard
          text: I told you to come. I expect you at the castle this evening.
        - id: ch02-b09
          speaker: narrator
          text: Then he rode away. But Renelde had no thought of obeying him. She was promised in marriage to a young woodcutter named Guilbert, and she could not leave her grandmother.
        - id: ch02-b10
          speaker: narrator
          text: Three days later, the Count passed the cottage again.
        - id: ch02-b11
          speaker: burchard
          text: Why did you not come to the castle?
        - id: ch02-b12
          speaker: renelde
          text: I told you, my lord. I have to look after my grandmother.
        - id: ch02-b13
          speaker: burchard
          text: Come tomorrow. I will make you a lady-in-waiting to the Countess.
        - id: ch02-b14
          speaker: narrator
          text: Again he rode away, and again Renelde stayed home. The next time he came by, he made her a still greater offer.
        - id: ch02-b15
          speaker: burchard
          text: If you will only come, I will send the Countess away and marry you myself.
        - id: ch02-b16
          speaker: narrator
          text: Two years earlier, when Renelde's mother lay dying after a long illness, the Countess had remembered the family and helped them when they desperately needed it. So even if the Count truly meant to marry her, Renelde would always have refused him.
    - id: ch03
      title: III
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Several weeks passed without another visit from Burchard. Renelde hoped she was rid of him. Then one day he stopped at her door with a duck gun under his arm and a game bag over his shoulder. This time, she was spinning flax instead of hemp.
        - id: ch03-b02
          speaker: burchard
          text: What are you spinning there?
        - id: ch03-b03
          speaker: renelde
          text: My wedding shift, my lord.
        - id: ch03-b04
          speaker: burchard
          text: So you mean to marry?
        - id: ch03-b05
          speaker: renelde
          text: Yes, my lord, if you give me leave.
        - id: ch03-b06
          speaker: narrator
          text: In those days, no peasant could marry without the master's permission.
        - id: ch03-b07
          speaker: burchard
          text: I will allow it on one condition. Look at the tall nettles growing over the graves in the churchyard. Gather them and spin them into two fine shifts. One will be your wedding shift, and the other will be my burial shroud. You will marry on the day they lay me in my grave.
        - id: ch03-b08
          speaker: narrator
          text: The Count turned away with a mocking laugh. Renelde began to tremble. No one in all Locquignol had ever heard of spinning cloth from nettles. Besides, the Count seemed to be made of iron. He took great pride in his strength and often boasted that he would live to a hundred.
        - id: ch03-b09
          speaker: narrator
          text: Every evening, when Guilbert's work was done, he visited the young woman he hoped to marry. That evening Renelde told him exactly what Burchard had said.
        - id: ch03-b10
          speaker: guilbert
          text: Shall I wait for the Wolf and split his skull with my axe?
        - id: ch03-b11
          speaker: renelde
          text: No. I will not have blood on my wedding bouquet. We must not harm the Count, either. Remember how kind the Countess was to my mother.
        - id: ch03-b12
          speaker: narrator
          text: Then a very old woman spoke. She was the mother of Renelde's grandmother and more than ninety years old. All day she sat in her chair, nodding her head and never saying a word.
        - id: ch03-b13
          speaker: great_grandmother
          text: My children, in all my years I have never heard of anyone spinning a shift from nettles. But if God commands a thing, people can do it. Why shouldn't Renelde make the attempt?
    - id: ch04
      title: IV
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Renelde did make the attempt. To her amazement, once the nettles were crushed and prepared, they produced thread that was soft, light, and strong. Before long, she had spun enough for the first shift, the one she meant to wear at her wedding. She wove the cloth and cut it at once, hoping the Count would not make her start the other one.
        - id: ch04-b02
          speaker: narrator
          text: Just as she finished sewing, Burchard the Wolf passed the cottage.
        - id: ch04-b03
          speaker: burchard
          text: Well, how are those shifts coming along?
        - id: ch04-b04
          speaker: renelde
          text: Here is my wedding garment, my lord.
        - id: ch04-b05
          speaker: narrator
          text: She showed him the finest, whitest shift anyone had ever seen. The Count turned pale, but his answer was rough.
        - id: ch04-b06
          speaker: burchard
          text: Very well. Now start the other one.
        - id: ch04-b07
          speaker: narrator
          text: Renelde began to work. On his way back to the castle, a cold shiver ran through the Count. It felt, as the saying goes, as though someone had walked over his grave. He tried to eat supper, but he could not. He went to bed shaking with fever, lay awake all night, and could not rise in the morning.
        - id: ch04-b08
          speaker: narrator
          text: His sudden illness worsened by the moment, and fear took hold of him. Surely Renelde's spinning wheel knew the reason. If his burial cloth was being prepared, then perhaps his body was being prepared for the grave as well.
        - id: ch04-b09
          speaker: narrator
          text: The first thing Burchard did was send an order telling Renelde to stop her wheel. She obeyed. That evening, Guilbert came to the cottage.
        - id: ch04-b10
          speaker: guilbert
          text: Has the Count agreed to let us marry?
        - id: ch04-b11
          speaker: renelde
          text: No, he has not.
        - id: ch04-b12
          speaker: guilbert
          text: Then keep working, sweetheart. That is the only way to win his permission. After all, he set the condition himself.
    - id: ch05
      title: V
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, as soon as the house was in order, Renelde sat down at her wheel. Two hours later, some soldiers arrived. When they saw her spinning, they seized her, bound her arms and legs, and carried her to the riverbank. Recent rains had swollen the water.
        - id: ch05-b02
          speaker: narrator
          text: The soldiers threw her in and watched her sink. Then they went away. But Renelde rose to the surface. Though she could not swim, she struggled until she reached the bank. As soon as she was home, she sat down and began spinning again.
        - id: ch05-b03
          speaker: narrator
          text: The same two soldiers came back. Once more they seized Renelde and carried her to the river. This time they tied a stone around her neck before throwing her into the water.
        - id: ch05-b04
          speaker: narrator
          text: The moment they turned their backs, the stone untied itself. Renelde waded across the shallow ford, returned to the cottage, and took up her spinning again.
        - id: ch05-b05
          speaker: narrator
          text: Now the Count decided to go to Locquignol himself. He was too weak to walk, so servants carried him there in a litter. Still the spinner kept her wheel turning.
        - id: ch05-b06
          speaker: narrator
          text: When Burchard saw Renelde, he fired at her as if she were a wild animal. The bullet struck and bounced away without harming her. She went right on spinning.
        - id: ch05-b07
          speaker: narrator
          text: Burchard flew into such a rage that it nearly killed him. He smashed the wheel into a thousand pieces, then fainted and fell to the ground. They carried him back to the castle without his senses.
        - id: ch05-b08
          speaker: narrator
          text: By the next day, the wheel had been repaired, and Renelde was spinning again. The Count felt he was dying whenever she worked. He ordered his men to tie her hands and watch her every moment.
        - id: ch05-b09
          speaker: narrator
          text: But the guards fell asleep. Her bonds loosened by themselves, and the wheel turned on.
        - id: ch05-b10
          speaker: narrator
          text: Burchard ordered every nettle within three leagues pulled from the earth. No sooner were they uprooted than they sowed themselves again and sprang up before anyone's eyes.
        - id: ch05-b11
          speaker: narrator
          text: Nettles even pushed through the hard-packed floor of the cottage. Each time someone tore them out, Renelde's distaff drew in a fresh supply, already crushed and prepared for spinning. Day after day, Burchard grew weaker and watched his end draw near.
    - id: ch06
      title: VI
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The Countess pitied her husband. At last, she learned what had caused his illness and begged him to accept the cure. But the Count's pride only hardened. He still would not permit the marriage.
        - id: ch06-b02
          speaker: narrator
          text: So without telling him, the Countess went to ask mercy from the spinner. She pleaded in the name of Renelde's dead mother and begged the girl to stop her wheel. Renelde promised that she would.
        - id: ch06-b03
          speaker: narrator
          text: That evening, Guilbert came to the cottage. He saw that the cloth had not grown since the night before and asked why. Renelde told him the Countess had begged her not to let her husband die.
        - id: ch06-b04
          speaker: guilbert
          text: Has he agreed to our marriage?
        - id: ch06-b05
          speaker: renelde
          text: No, he still refuses.
        - id: ch06-b06
          speaker: guilbert
          text: Then he can die.
        - id: ch06-b07
          speaker: renelde
          text: And what am I to say to the Countess?
        - id: ch06-b08
          speaker: guilbert
          text: She will understand that you are not to blame. The Count is bringing death on himself.
        - id: ch06-b09
          speaker: renelde
          text: Give him more time. His heart may still soften.
        - id: ch06-b10
          speaker: narrator
          text: They waited one month, then two, then six, and finally a whole year. Renelde never returned to her spinning. The Count stopped persecuting her, but he still refused to let her marry. Guilbert's patience began to fail.
        - id: ch06-b11
          speaker: narrator
          text: Renelde loved him with her whole heart. Now she was more miserable than she had been when Burchard had only tormented her body.
        - id: ch06-b12
          speaker: guilbert
          text: We must put an end to this waiting.
        - id: ch06-b13
          speaker: renelde
          text: Please, wait just a little longer.
        - id: ch06-b14
          speaker: narrator
          text: But Guilbert grew tired of waiting. His visits to Locquignol became less frequent, and before long, he stopped coming at all. Renelde felt her heart would break, yet she kept her promise.
        - id: ch06-b15
          speaker: narrator
          text: One day she met the Count. She clasped her hands as if she were praying and cried out to him.
        - id: ch06-b16
          speaker: renelde
          text: My lord, please have mercy!
        - id: ch06-b17
          speaker: narrator
          text: Burchard the Wolf turned his head away and passed her. Renelde could have humbled his pride by going back to her wheel, but she did no such thing.
        - id: ch06-b18
          speaker: narrator
          text: Not long afterward, she learned that Guilbert had left the country. He had not even come to say goodbye. Still, she discovered the day and hour of his departure and hid beside the road so she could see him once more.
        - id: ch06-b19
          speaker: narrator
          text: When she returned home, she set her silent wheel in a corner. Then she cried for three days and three nights.
    - id: ch07
      title: VII
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Another year passed. Then the Count became ill. The Countess thought Renelde must have grown tired of waiting and started spinning again. But when she went to the cottage, she found the wheel silent.
        - id: ch07-b02
          speaker: narrator
          text: Even so, the Count grew worse until the doctors gave up hope. The bell was rung to announce that death was near, and Burchard lay waiting for Death to take him. But Death was farther away than the doctors believed, and the Count lingered.
        - id: ch07-b03
          speaker: narrator
          text: His condition was desperate, but it never changed. He could neither live nor die. His suffering was terrible, and he called loudly for Death to end his pain.
        - id: ch07-b04
          speaker: narrator
          text: At last, Burchard remembered what he had told the young spinner long ago. Perhaps Death was slow because the Count was not ready to follow him. He still had no shroud for his burial.
        - id: ch07-b05
          speaker: narrator
          text: He sent for Renelde, brought her to his bedside, and ordered her to finish spinning his shroud at once. The moment her wheel began to turn, his pains eased.
        - id: ch07-b06
          speaker: narrator
          text: At last his hard heart melted. He was sorry for all the evil his pride had made him do, and he begged Renelde to forgive him. She forgave him and kept spinning through the days and nights.
        - id: ch07-b07
          speaker: narrator
          text: When all the nettle thread was ready, Renelde wove it into cloth with her shuttle. Then she cut out the shroud and began to sew.
        - id: ch07-b08
          speaker: narrator
          text: As her needle moved, the Count's pain grew lighter and the life inside him slowly faded. When Renelde made the final stitch, Burchard breathed his last.
    - id: ch08
      title: VIII
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: At that very hour, Guilbert returned to the country. He had never stopped loving Renelde, and eight days later, they were married.
        - id: ch08-b02
          speaker: narrator
          text: Guilbert had lost two years of happiness. He comforted himself by remembering that his wife was a clever spinner and, much more rarely, a brave and good woman.
