audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    burchard:
      display_name: 比尔卡尔伯爵
      tts:
        delivery: 傲慢冷酷，命令别人时粗暴逼人
        timbre: 成熟低沉
        pace: 稍慢
        pitch: 中低
    renelde:
      display_name: 勒内尔德
      tts:
        delivery: 温柔坚贞，面对强权时谦恭却不屈服
        timbre: 年轻清澈
        pace: 适中
        pitch: 中高
    guilbert:
      display_name: 吉尔贝
      tts:
        delivery: 直率热烈，急躁时语气果断
        timbre: 年轻厚实
        pace: 适中
        pitch: 中等
    great_grandmother:
      display_name: 曾外祖母
      tts:
        delivery: 年迈安详，说话缓慢而笃定
        timbre: 苍老柔和
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，佛兰德斯的凯努瓦住着一位大领主，名叫比尔卡尔。乡下人都叫他“恶狼比尔卡尔”。他的心肠又狠又毒。据说，他竟把农民套在犁上，一边挥鞭抽打，一边逼他们光着脚替自己耕田。
        - id: ch01-b02
          speaker: narrator
          text: 伯爵夫人却完全不同。她总是怜惜穷苦无依的人。每次听说丈夫又做了恶事，她都会悄悄赶去补救。因此，四乡的人都为她祝福。人们有多爱戴伯爵夫人，就有多痛恨伯爵。
    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，伯爵打猎时穿过森林，看见一间孤零零的小屋。一个美丽的姑娘坐在门口纺麻。他停下来问她。
        - id: ch02-b02
          speaker: burchard
          text: 你叫什么名字？
        - id: ch02-b03
          speaker: renelde
          text: 我叫勒内尔德，老爷。
        - id: ch02-b04
          speaker: burchard
          text: 一个人住在这种偏僻地方，你一定闷坏了吧？
        - id: ch02-b05
          speaker: renelde
          text: 我早就习惯了，老爷，一点也不觉得闷。
        - id: ch02-b06
          speaker: burchard
          text: 那也罢。你到城堡来，给伯爵夫人做贴身女仆。
        - id: ch02-b07
          speaker: renelde
          text: 我不能去，老爷。我得照料祖母，她已经什么事都做不了了。
        - id: ch02-b08
          speaker: burchard
          text: 我叫你来，你就得来。今晚我在城堡等你。
        - id: ch02-b09
          speaker: narrator
          text: 伯爵说完便上路了。可勒内尔德已经和一个名叫吉尔贝的年轻樵夫订了婚，又必须照料祖母，根本没有听命的打算。三天后，伯爵再次经过小屋，看见美丽的纺娘还在那里，便质问她为什么没去。
        - id: ch02-b10
          speaker: renelde
          text: 我已经告诉过您了，老爷。我得照料祖母。
        - id: ch02-b11
          speaker: burchard
          text: 那就明天来。我让你给伯爵夫人做侍女。
        - id: ch02-b12
          speaker: narrator
          text: 这一次，勒内尔德照样没有去。伯爵后来又骑马经过，竟说只要她肯来，他便赶走伯爵夫人，娶她为妻。可两年前，勒内尔德的母亲久病将死，是伯爵夫人在母女俩最困难时帮助了她们。哪怕伯爵真的想娶她，她也绝不会答应。
    - id: ch03
      title: 第三章
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 几个星期过去，比尔卡尔一直没有露面。勒内尔德正以为摆脱了他，有一天，他却又站在门口，腋下夹着猎水鸟的枪，肩上挎着猎物袋。这一次，姑娘纺的是亚麻。
        - id: ch03-b02
          speaker: burchard
          text: 你在纺什么？
        - id: ch03-b03
          speaker: renelde
          text: 在纺我的新娘衬衣，老爷。
        - id: ch03-b04
          speaker: burchard
          text: 这么说，你要结婚了？
        - id: ch03-b05
          speaker: renelde
          text: 是的，老爷，只等您准许。
        - id: ch03-b06
          speaker: narrator
          text: 那个时候，农民没有主人的许可便不能成婚。伯爵答应给她许可，却提出了一个条件。
        - id: ch03-b07
          speaker: burchard
          text: 看见墓园坟头上的高大荨麻了吗？把它们采来，纺成两件好衬衣。一件让你出嫁时穿，另一件给我做裹尸衣。我下葬的那一天，才是你成婚的日子。
        - id: ch03-b08
          speaker: narrator
          text: 伯爵嘲弄地大笑着走了。勒内尔德吓得浑身发抖。整个洛基尼奥尔，从来没人听说过荨麻能纺线。何况伯爵像铁打的一样强健，又为自己的力气十分得意，还常吹嘘自己能活到一百岁。每天傍晚，吉尔贝做完活儿都会来看未婚妻。这天他也照常来了。听完伯爵的话，他气愤地问她。
        - id: ch03-b09
          speaker: guilbert
          text: 要不要我埋伏在路边？那头恶狼一来，我就用斧头劈开他的脑袋。
          emotion: angry
        - id: ch03-b10
          speaker: renelde
          text: 不行。我的新娘花束不能沾上血。我们也不能伤害伯爵。你别忘了，伯爵夫人从前待我母亲有多好。
        - id: ch03-b11
          speaker: narrator
          text: 这时，一位九十多岁的老妇人开口了。她是勒内尔德祖母的母亲，整天坐在椅子上点头，平时一句话也不说。
        - id: ch03-b12
          speaker: great_grandmother
          text: 孩子们，我活了这么多年，从没听说过荨麻做的衬衣。不过，只要是上帝吩咐的事，人就能办到。让勒内尔德试一试吧。
    - id: ch04
      title: 第四章
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 勒内尔德真的试了。荨麻捣碎、料理好以后，竟能抽出柔软、轻盈又结实的线。很快，她纺好了自己的新娘衬衣，又把布织好，裁好衣片。她盼着伯爵别再逼她做另一件。可她刚缝完，恶狼比尔卡尔就经过门前。
        - id: ch04-b02
          speaker: burchard
          text: 怎么样？那两件衬衣做到哪儿了？
        - id: ch04-b03
          speaker: renelde
          text: 老爷，我的新娘礼服已经做好了。
        - id: ch04-b04
          speaker: narrator
          text: 她拿出的衬衣精细洁白，世上从没有人见过更好的。伯爵一看，脸色顿时白了，却还粗声命令她。
        - id: ch04-b05
          speaker: burchard
          text: 很好。现在做另一件。
        - id: ch04-b06
          speaker: narrator
          text: 纺娘动了手。伯爵回城堡时突然打了个冷战。照人们的说法，就像有人正从他的坟头走过。晚饭他一口也吃不下，躺到床上又发着烧不停颤抖，整夜没有合眼。第二天早晨，他竟连床也起不来了。突如其来的病一刻比一刻沉重，叫他惶恐不安。他认定那架纺车知道原因。裹尸衣要做好，他的身体不也得准备下葬吗？
        - id: ch04-b07
          speaker: narrator
          text: 比尔卡尔立刻派人叫勒内尔德停下纺车。她依言停了手。到了晚上，吉尔贝问她，伯爵有没有准许他们结婚。
        - id: ch04-b08
          speaker: renelde
          text: 没有，他还是不答应。
        - id: ch04-b09
          speaker: guilbert
          text: 那就继续纺吧，心肝儿。只有这样，他才会答应。反正这是他亲口吩咐你的。
    - id: ch05
      title: 第五章
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天一早，勒内尔德收拾好屋子，便坐下来纺线。两小时后，几个士兵闯进来，看见她还在纺，立刻捆住她的手脚，把她抬到河边。连日下雨，河水涨得正急。他们把姑娘扔进河里，看着她沉下去才离开。可她又浮了上来。她明明不会游泳，却挣扎着爬上了岸。
        - id: ch05-b02
          speaker: narrator
          text: 勒内尔德刚回到家，马上又坐下纺线。那两个士兵再次来到小屋，抓住姑娘，又把她带到河边。他们在她颈上拴了一块石头，把她扔进涨得汹涌的河水里。士兵刚一转身，石头便自己松开了。勒内尔德从浅滩蹚过河，回到小屋，继续坐在纺车前。
        - id: ch05-b03
          speaker: narrator
          text: 伯爵这次决定亲自去洛基尼奥尔。可他虚弱得走不了路，只能叫人用轿子抬着。纺娘仍然没有停手。他一见到她，便像朝野兽开枪那样，对准姑娘开了一枪。子弹却反弹回去，勒内尔德毫发无伤，还是不停地纺。
        - id: ch05-b04
          speaker: narrator
          text: 比尔卡尔气得发狂，险些当场送命。他把纺车砸成无数碎片，自己也昏倒在地。人们把不省人事的他抬回了城堡。第二天，纺车修好了，纺娘再次动手。伯爵觉得她每纺一会儿，自己就更接近死亡，于是叫人捆住她的双手，还命令守卫一刻也不能让她离开视线。
        - id: ch05-b05
          speaker: narrator
          text: 可守卫全睡着了，绳索也自己松开，纺娘还是继续纺。比尔卡尔又命人拔光方圆三里格内的荨麻。谁知荨麻刚离开泥土，就自行播下种子，在人们眼前飞快长高。连小屋踩得硬邦邦的地上都冒出了荨麻。人们才拔掉一批，纺杆上又聚起一束料理妥当的荨麻，正好可以纺线。
        - id: ch05-b06
          speaker: narrator
          text: 比尔卡尔的病一天比一天重。他只能眼睁睁看着自己的末日逼近。
    - id: ch06
      title: 第六章
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 伯爵夫人可怜丈夫，终于查明了病因，求他让人救治。伯爵却傲慢不改，更加不肯准许那桩婚事。夫人只好瞒着他，亲自去求纺娘开恩。她以勒内尔德亡母的名义，请姑娘别再纺下去。勒内尔德答应了。
        - id: ch06-b02
          speaker: narrator
          text: 晚上，吉尔贝来到小屋，发现织物和前一天一模一样，便追问原因。勒内尔德告诉他，伯爵夫人求自己别让丈夫死去。吉尔贝只问了一件事。
        - id: ch06-b03
          speaker: guilbert
          text: 那他答应我们的婚事了吗？
        - id: ch06-b04
          speaker: renelde
          text: 没有，他不肯答应。
        - id: ch06-b05
          speaker: guilbert
          text: 那就让他死。
        - id: ch06-b06
          speaker: renelde
          text: 可伯爵夫人会怎么说呢？
        - id: ch06-b07
          speaker: guilbert
          text: 她会明白，这不是你的错。伯爵真要死了，也是他自己害死自己。
        - id: ch06-b08
          speaker: renelde
          text: 我们再等一等吧。也许他的心会软下来。
        - id: ch06-b09
          speaker: narrator
          text: 他们等了一个月、两个月、六个月，最后整整等了一年。纺娘没有再动手。伯爵不再迫害她，却还是不肯答应婚事。吉尔贝渐渐失去了耐心。勒内尔德全心爱着他，心里的痛苦反而比从前更深。那时候，比尔卡尔折磨的还只是她的身体。
        - id: ch06-b10
          speaker: guilbert
          text: 别再等了，我们把这件事了结吧。
        - id: ch06-b11
          speaker: renelde
          text: 求你再等一等。
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: 年轻人终于厌倦了。他来洛基尼奥尔的次数越来越少，很快便不再出现。勒内尔德觉得心都快碎了，却仍旧没有动摇。一天，她遇见伯爵，双手合在胸前，像祈祷一样求他。
        - id: ch06-b13
          speaker: renelde
          text: 老爷，求您可怜可怜我吧！
          emotion: sad
        - id: ch06-b14
          speaker: narrator
          text: 恶狼比尔卡尔把头扭向一旁，径直走了。勒内尔德只要重新纺线，本可以压倒他的傲气，可她没有这样做。不久，她听说吉尔贝已经离开此地，甚至没有来道别。她仍知道他启程的日子和时辰，便躲在路旁，只为再看他一眼。回家后，她把沉默的纺车放到角落，哭了三天三夜。
    - id: ch07
      title: 第七章
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 又过了一年，伯爵病倒了。伯爵夫人以为勒内尔德等得厌倦，又开始纺线，赶到小屋一看，纺车却仍然沉默。伯爵的病越来越重，最后连医生也放弃了。教堂敲响临终钟，他躺在床上等死神来带走自己。可死神并不像医生想的那么近，他始终咽不了气。
        - id: ch07-b02
          speaker: narrator
          text: 他的病看起来已经无可挽回，却既不见好，也不见坏。他活不成，也死不了，只能在可怕的折磨中大声呼唤死神，求死神结束痛苦。就在这时，他想起很久以前对小纺娘说的话。死神迟迟不来，也许正是因为裹尸衣还没做好，他不能跟着死神上路。
        - id: ch07-b03
          speaker: narrator
          text: 伯爵派人把勒内尔德叫来，让她坐在床边，马上继续纺那件裹尸衣。纺娘刚一动手，他便觉得疼痛减轻了。直到这一刻，那颗铁石心肠终于软下来。他懊悔自己因为傲慢犯下的恶行，恳求勒内尔德原谅。姑娘宽恕了他，从此日夜不停地纺线。
        - id: ch07-b04
          speaker: narrator
          text: 荨麻线纺成以后，她用梭子把线织成布，又裁出裹尸衣，开始缝制。和先前一样，她每缝一针，伯爵的疼痛就减轻一点，身体里的生命也沉下去一点。等她缝完最后一针，伯爵吐出了最后一口气。
    - id: ch08
      title: 第八章
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: 就在同一时刻，吉尔贝回到了这片乡土。他从来没有停止爱勒内尔德。八天以后，两人结了婚。
        - id: ch08-b02
          speaker: narrator
          text: 吉尔贝虽然失去了两年的幸福时光，却这样安慰自己：他的妻子不但是个心灵手巧的纺娘，还是一位更加难得的、勇敢而善良的女人。
