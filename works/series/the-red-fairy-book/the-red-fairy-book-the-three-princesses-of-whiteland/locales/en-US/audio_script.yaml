  chapters:
    - id: ch01
      title: The Road to Whiteland
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fisherman who lived near a palace and caught fish for the King's table. One day he worked from morning until evening without catching so much as a sprat. He tried everything he could with his rod and line, but his hook always came back bare. Just as the day was ending, a head rose from the water.
        - id: ch01-b02
          speaker: water_spirit
          text: Give me whatever your wife shows you when you reach home, and you will have all the fish you need.
        - id: ch01-b03
          speaker: narrator
          text: The fisherman agreed without stopping to think. At once he began catching fish in plenty. But when he went home that night, his wife showed him the baby boy who had just been born. She wept and wailed when she heard what he had promised, and the fisherman was miserable too.
        - id: ch01-b04
          speaker: narrator
          text: Word of their sorrow soon reached the palace. The King offered to take the child and try to save him. He raised the boy as his own son, and in time the child grew into a young man.
        - id: ch01-b05
          speaker: narrator
          text: One day the youth felt a powerful wish to go fishing with his father, and he begged the King for permission. The King was very unwilling to let him go, but at last he gave way. Father and son spent the whole day together, and everything went well until they came back to land that evening.
        - id: ch01-b06
          speaker: narrator
          text: Then the youth noticed that his handkerchief was missing. He stepped back into the boat to fetch it. At once the boat shot away so fast that foam flew on every side. He pulled hard at the oars, but nothing could stop it. The boat sped on all night and carried him to a white shore far away.
        - id: ch01-b07
          speaker: narrator
          text: He landed and walked until he met an old man with a long white beard.
        - id: ch01-b08
          speaker: young_king
          text: What country is this?
        - id: ch01-b09
          speaker: old_man
          text: This is Whiteland. Now tell me where you came from and what brought you here.
        - id: ch01-b10
          speaker: narrator
          text: The youth told him everything. Then the old man gave him a warning.
        - id: ch01-b11
          speaker: old_man
          text: Follow the shore and you will find three princesses buried in the earth with only their heads above ground. The eldest will call sweetly and ask you to help her. The second will do the same. Pass them both as though you cannot see or hear them. Go to the third princess and do exactly what she tells you. That will bring you good fortune.
        - id: ch01-b12
          speaker: narrator
          text: The eldest princess called and pleaded when he reached her, but he went straight past. He did the same when the second called. Then he came to the youngest and stopped beside her.
        - id: ch01-b13
          speaker: youngest_sister
          text: Do as I tell you, and afterward you may choose one of us three.
        - id: ch01-b14
          speaker: narrator
          text: The youth gladly agreed. She told him that three Trolls had planted the princesses in the earth. Before that, the sisters had lived in a castle he could see among the trees.
        - id: ch01-b15
          speaker: youngest_sister
          text: Go into that castle and endure one night's beating for each of us. If you can bear all three nights, you will set us free.
        - id: ch01-b16
          speaker: young_king
          text: I will do my best.
        - id: ch01-b17
          speaker: youngest_sister
          text: Two lions guard the doorway. Walk straight between them and they will not hurt you. Inside, go to the little dark room and lie on the bed. A Troll will come and beat you. When it is finished, take the flask from the wall and rub its ointment on every wound. You will be whole again. Then take the sword beside the flask and kill the Troll.
        - id: ch01-b18
          speaker: narrator
          text: The youth followed her directions. He walked between the lions without turning aside, entered the dark little room, and lay down on the bed.
    - id: ch02
      title: Three Nights in the Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: That first night, a Troll came in with three heads and three rods. It beat the youth without mercy, but he endured every blow. When the Troll was done, he rubbed the ointment over his wounds and was healed. Then he seized the sword and struck the Troll dead.
        - id: ch02-b02
          speaker: narrator
          text: In the morning he returned to the shore. All three princesses had risen from the ground as far as their waists.
        - id: ch02-b03
          speaker: narrator
          text: The second night, the youth returned to the little room. This time a Troll with six heads and six rods came in. Its beating was far worse than the first, but again he endured it to the end. He healed every wound with the ointment and killed the Troll with the sword. The next morning, only the princesses' legs below the knees remained in the earth.
        - id: ch02-b04
          speaker: narrator
          text: On the third night, the worst Troll came. It had nine heads and carried nine rods. It struck and flogged the youth for so long that at last he fainted. The Troll lifted him from the floor and hurled him against the wall. That blow knocked down the flask of ointment. It broke over him and splashed him from head to foot, and at once his strength returned.
        - id: ch02-b05
          speaker: narrator
          text: He wasted no time. He caught up the sword and killed the third Troll. When morning came, all three princesses stood completely free of the earth. The youth chose the youngest as his Queen, and for a long while they lived very happily together.
        - id: ch02-b06
          speaker: narrator
          text: At last he began to long for a short visit home so that he could see his parents again. His Queen did not like the thought of it. But the longing kept growing until he told her that he must go and would go.
        - id: ch02-b07
          speaker: youngest_sister
          text: Promise me one thing. Do what your father tells you, but do not do what your mother tells you.
        - id: ch02-b08
          speaker: narrator
          text: He gave her his promise. Then she placed a ring in his hand. Whoever wore it could make two wishes and have them come true. He used the first wish to go home and appeared there in an instant. His parents stared at his splendid clothes and could not stop wondering at the change in him.
        - id: ch02-b09
          speaker: narrator
          text: After he had stayed with them for several days, his mother wanted him to visit the palace and show the King what a great man he had become.
        - id: ch02-b10
          speaker: fisherman
          text: No, he must not go. If he does, we will lose the joy of having him with us this time.
        - id: ch02-b11
          speaker: narrator
          text: His warning did no good. The young man's mother kept begging until her son finally went to the palace.
        - id: ch02-b12
          speaker: narrator
          text: He arrived dressed more splendidly than the King himself, and everything about him seemed grander. The King did not like that at all.
        - id: ch02-b13
          speaker: king
          text: You can see what my Queen is like, but no one can see yours. I doubt your Queen is as beautiful as mine.
        - id: ch02-b14
          speaker: young_king
          text: If only she were standing here! Then you could see her for yourself.
        - id: ch02-b15
          speaker: narrator
          text: In that instant, his Queen appeared before them. But she looked deeply sorrowful.
        - id: ch02-b16
          speaker: youngest_sister
          text: Why did you forget my warning? You should have listened only to your father. Now I must go home at once, and both your wishes are gone.
          emotion: sad
        - id: ch02-b17
          speaker: narrator
          text: She tied a ring bearing her name into his hair, then wished herself home again.
        - id: ch02-b18
          speaker: narrator
          text: The young King was heartbroken. Day after day, he could think of nothing but finding his way back to his Queen. At last he decided to search the world for someone who knew the road to Whiteland, and he set out alone.
    - id: ch03
      title: The Lords of Beasts, Birds, and Fish
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After traveling some distance, the young King reached a mountain. There he met the lord of every beast in the forest. Whenever this man blew his horn, all the animals came to him. The young King asked him where Whiteland lay.
        - id: ch03-b02
          speaker: lord_of_beasts
          text: I do not know, but I will ask my beasts.
        - id: ch03-b03
          speaker: narrator
          text: He sounded the horn, and the beasts gathered. Not one of them knew the way to Whiteland.
        - id: ch03-b04
          speaker: lord_of_beasts
          text: Take these snowshoes. They will carry you hundreds of miles to my brother, the lord of all the birds in the air. Ask him. When you arrive, turn the shoes until their toes point back this way. They will return home by themselves.
        - id: ch03-b05
          speaker: narrator
          text: The young King put them on, reached the brother's home, and turned them around. The snowshoes sped back to their owner. Then he asked the lord of the birds about Whiteland.
        - id: ch03-b06
          speaker: narrator
          text: The man called every bird together and asked whether any of them knew the place. None did. Long after all the others had gathered, an old eagle finally arrived. It had been away for ten whole years. Still, the eagle knew no more about Whiteland than the rest.
        - id: ch03-b07
          speaker: lord_of_birds
          text: Then borrow my snowshoes. They will take you hundreds of miles to another brother of mine. He rules all the fish in the sea, so ask him. And remember to turn the shoes around when you get there.
        - id: ch03-b08
          speaker: narrator
          text: The young King thanked him and set off. When he reached the lord of the fish, he turned the snowshoes, and they traveled home without him. Once again he asked where Whiteland was.
        - id: ch03-b09
          speaker: narrator
          text: The lord of the fish blew his horn and called the fish from the sea. He questioned them one by one, but none knew anything about Whiteland. At last an ancient pike arrived. The lord of the fish had needed great effort to bring that old creature home to him.
        - id: ch03-b10
          speaker: pike
          text: Of course I know Whiteland. I have served as cook there for ten years. I must return tomorrow morning, because the Queen's King is away, and she is going to marry someone else.
        - id: ch03-b11
          speaker: lord_of_fish
          text: Then I have some advice for you. On a moor nearby, three brothers have spent a hundred years fighting over a hat, a cloak, and a pair of boots. With all three, a person can become invisible and reach any place simply by wishing. Tell the brothers you want to test the things so you can decide who should own them.
        - id: ch03-b12
          speaker: narrator
          text: The young King thanked him and went to the moor. Just as he had been told, three brothers stood there quarreling over the magical things.
        - id: ch03-b13
          speaker: young_king
          text: Why keep fighting forever? Let me try the hat, cloak, and boots. Then I can judge which one of you should have them.
        - id: ch03-b14
          speakers: [first_brother, second_brother, third_brother]
          ensemble: chorus
          text: Very well. Try them and decide for us.
        - id: ch03-b15
          speaker: narrator
          text: They handed over all three. Once the young King had put them on, he gave the brothers his answer.
        - id: ch03-b16
          speaker: young_king
          text: The next time we meet, I will tell you my decision.
        - id: ch03-b17
          speaker: narrator
          text: Then he wished himself away and went rushing through the air toward Whiteland.
    - id: ch04
      title: The North Wind's Plan
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As he flew through the air, the young King met the North Wind.
        - id: ch04-b02
          speaker: north_wind
          text: And where are you bound?
        - id: ch04-b03
          speaker: young_king
          text: I am going to Whiteland.
        - id: ch04-b04
          speaker: narrator
          text: He told the North Wind all that had happened.
        - id: ch04-b05
          speaker: north_wind
          text: You can travel a little faster than I can, because I must puff and blow into every corner. When you reach the castle, stand on the steps beside the door. I will come roaring in as though I mean to blow the whole castle down. The Prince who is to marry your Queen will come outside to see what is happening. Grab him by the throat and throw him out. Then I will do my best to carry him far from the court.
        - id: ch04-b06
          speaker: narrator
          text: The young King followed the North Wind's plan. He reached Whiteland first and took his place on the castle steps beside the door.
        - id: ch04-b07
          speaker: narrator
          text: Soon the North Wind came howling and roaring. It seized the roof and walls until the whole castle shook. The rival Prince hurried outside to learn what was wrong.
        - id: ch04-b08
          speaker: narrator
          text: The moment the Prince appeared, the young King caught him by the neck and flung him out. The North Wind seized him at once and carried him far away from the court.
    - id: ch05
      title: The Rightful Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Once his rival was gone, the young King entered the castle. His Queen did not recognize him at first. His long, sorrowful journey had left him thin and pale.
        - id: ch05-b02
          speaker: narrator
          text: Then she saw the ring with her name in his hair, and her heart filled with joy.
        - id: ch05-b03
          speaker: narrator
          text: At last the rightful wedding was held. It was such a wedding that people spoke of it far and wide.
