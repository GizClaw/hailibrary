audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    fisherman:
      display_name: 渔夫
      tts:
        delivery: 朴实憨直，忧愁时沉重不安
        timbre: 粗朴温厚
        pace: 适中
        pitch: 中低
    water_head:
      display_name: 水中怪客
      tts:
        delivery: 神秘冷淡，提出交易时不容置疑
        timbre: 空灵低沉
        pace: 稍慢
        pitch: 低
    young_king:
      display_name: 年轻的国王
      tts:
        delivery: 勇敢真诚，历经磨难后更显坚定
        timbre: 年轻清朗
        pace: 适中
        pitch: 中等
    old_man:
      display_name: 白胡子老人
      tts:
        delivery: 沉着睿智，指点时清楚郑重
        timbre: 苍老温厚
        pace: 从容
        pitch: 中低
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 聪慧温柔，告诫时认真而忧切
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    father:
      display_name: 父亲
      tts:
        delivery: 朴实谨慎，劝阻时焦急恳切
        timbre: 温厚略哑
        pace: 适中
        pitch: 中低
    palace_king:
      display_name: 宫中的国王
      tts:
        delivery: 骄傲好胜，言语中带着猜忌
        timbre: 成熟洪亮
        pace: 适中
        pitch: 中低
    beast_lord:
      display_name: 百兽之主
      tts:
        delivery: 豪爽稳重，乐于为旅人指路
        timbre: 宽厚有力
        pace: 适中
        pitch: 中低
    bird_lord:
      display_name: 百鸟之主
      tts:
        delivery: 从容友善，说话干脆明白
        timbre: 清亮成熟
        pace: 适中
        pitch: 中等
    fish_lord:
      display_name: 群鱼之主
      tts:
        delivery: 沉稳机敏，出主意时笃定周全
        timbre: 深沉清晰
        pace: 稍慢
        pitch: 中低
    old_pike:
      display_name: 老梭子鱼
      tts:
        delivery: 年迈见多识广，说话不紧不慢
        timbre: 苍老沙哑
        pace: 缓慢
        pitch: 低
    north_wind:
      display_name: 北风
      tts:
        delivery: 爽快豪迈，话音像强风般有力
        timbre: 浑厚辽阔
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 水中的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个渔夫住在王宫附近，专门捕鱼送上国王的餐桌。一天，他守着钓竿忙了很久，鱼钩上却连一条小鲱鱼也没有。天快黑时，水面忽然冒出一颗脑袋。
        - id: ch01-b02
          speaker: water_head
          text: 你回家以后，妻子拿什么给你看，你就把什么给我。答应了，我便叫你捕到足够多的鱼。
        - id: ch01-b03
          speaker: narrator
          text: 渔夫立刻答应，果然捕到了许多鱼。可是他回到家，妻子给他看的竟是刚刚降生的儿子。听完丈夫许下的诺言，妻子号啕大哭，渔夫也陷进深深的愁苦。
        - id: ch01-b04
          speaker: narrator
          text: 消息很快传进王宫。国王知道那位母亲为何哭得这样伤心，便决定亲自收养孩子，看看能不能把他从诺言中救下来。孩子在宫里长大，国王待他就像亲生儿子。成年以后，他心里忽然生出强烈的愿望，一定要随亲生父亲出海打鱼。国王很不情愿，几番阻拦，最后还是准了。
        - id: ch01-b05
          speaker: narrator
          text: 父子俩在海上一整天都平安顺利。傍晚靠岸以后，年轻人发现手帕丢了，便独自上船去找。谁知他才踏进船里，小船就载着他飞快离岸，四周的海水全泛起白沫。他拼命划桨，想把船拦住，却毫无用处，只能任它整夜不停地向前疾驶。
        - id: ch01-b06
          speaker: narrator
          text: 最后，小船停在一片遥远的白色海滩上。年轻人登岸走了一程，遇见一位留着长长白胡子的老人。
        - id: ch01-b07
          speaker: young_king
          text: 老人家，这是什么地方？
        - id: ch01-b08
          speaker: old_man
          text: 这里是白国。孩子，你从哪里来，又要到哪里去？
        - id: ch01-b09
          speaker: narrator
          text: 年轻人把自己的遭遇全说了。老人听完，便告诉他沿着海岸继续走，会看到三位公主埋在土中，只有头露在外面。
        - id: ch01-b10
          speaker: old_man
          text: 大公主和二公主都会叫你过去救她们。你不要靠近，只管往前走，就当什么也没看见，什么也没听见。到了三公主身边，她叫你做什么，你便做什么。这样才会有好运。
    - id: ch02
      title: 三夜试炼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 年轻人先后经过大公主和二公主。两人都柔声求他相救，他却没有停下，径直走到最小的公主面前。
        - id: ch02-b02
          speaker: youngest_princess
          text: 你若肯照我的话去做，我们三姐妹之中，你可以任意选一位。
        - id: ch02-b03
          speaker: narrator
          text: 年轻人答应了。小公主告诉他，三只巨魔把姐妹三人栽进土里，夺走了她们从前居住的林中城堡。
        - id: ch02-b04
          speaker: youngest_princess
          text: 你要进那座城堡，为我们每人挨一夜毒打。只要熬过三夜，就能救出我们。
        - id: ch02-b05
          speaker: young_king
          text: 好，我一定尽力。
        - id: ch02-b06
          speaker: youngest_princess
          text: 门口有两头狮子。你从它们中间笔直走过去，它们不会伤你。再进那间又小又黑的屋子，躺到床上。巨魔打完以后，用墙上瓶里的药膏涂遍伤处，你就会恢复如初。然后拿起瓶子旁边的宝剑，杀死巨魔。
        - id: ch02-b07
          speaker: narrator
          text: 年轻人完全照她说的去做。他看也不看门边的两头狮子，从它们中间笔直走进城堡，又在小黑屋的床上躺下。第一夜，一只三头巨魔拿着三根棍棒，毫不留情地毒打他。他一直忍到巨魔住手，才取下瓶子，把药膏涂遍伤处。身体刚恢复如初，他立刻抓起宝剑，杀死了巨魔。
        - id: ch02-b08
          speaker: narrator
          text: 早晨来到海边，他看见三位公主已经从土里露出了腰身。第二夜，一切又照原样发生。只是这回来的是六头巨魔，挥着六根棍棒，打得比第一只凶狠得多。年轻人仍旧熬到最后，用药治好伤，再拔剑杀死巨魔。第二天早晨，他走出城堡，三位公主已经从土里露到了膝盖。
        - id: ch02-b09
          speaker: narrator
          text: 第三夜，九头巨魔挥着九根棍棒，久久不停地抽打。年轻人终于昏死过去。巨魔把他抓起来，朝墙上猛地一扔。这一撞恰好震落药瓶，药汁泼满全身，他顿时恢复了所有力气。
        - id: ch02-b10
          speaker: narrator
          text: 他马上抓起宝剑，杀死九头巨魔。到了早晨，三位公主终于完完全全脱离泥土。年轻人选了最小的公主做王后，两人从此快乐地生活了很久。
    - id: ch03
      title: 用尽的愿望
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，年轻的国王越来越想念父母，打算回家住几天。王后不愿他离开，可他坚持非走不可。她只好要他先作一个保证。
        - id: ch03-b02
          speaker: youngest_princess
          text: 答应我，父亲叫你做的事可以做，母亲叫你做的事却不要做。
        - id: ch03-b03
          speaker: narrator
          text: 年轻的国王答应了。王后送他一枚戒指，戴着它可以实现两个愿望。他许下第一个愿望，转眼便回到家中。父母看见他华贵的衣饰，惊讶得怎么也说不出话。
        - id: ch03-b04
          speaker: narrator
          text: 几天以后，母亲要他进宫，让国王看看他如今有多么显赫。父亲马上反对。
        - id: ch03-b05
          speaker: father
          text: 不行，他不能去。他这一去，我们这回便再也留不住他了。
        - id: ch03-b06
          speaker: narrator
          text: 父亲怎样劝也没有用。母亲一遍遍地恳求，年轻的国王最后还是进了宫。他从衣着到气派，样样都胜过宫中的国王。那位国王见客人竟比自己还要华贵，心里很不痛快。
        - id: ch03-b07
          speaker: palace_king
          text: 我的王后是什么模样，你看得清清楚楚。你的王后呢？我可不信她有我的王后漂亮。
        - id: ch03-b08
          speaker: young_king
          text: 但愿上天让她现在就站在这里，好叫你亲眼看看！
        - id: ch03-b09
          speaker: narrator
          text: 第二个愿望随着这句话实现，王后立刻出现在众人面前。她却满面悲伤。
        - id: ch03-b10
          speaker: youngest_princess
          text: 你为什么忘了我的话，没有只听父亲的劝告？现在我必须马上回家，而你的两个愿望也全都白白用掉了。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 她把一枚刻着自己名字的戒指系进丈夫的头发，随即许愿回到了白国。年轻的国王痛苦万分。从早到晚，他心里再也装不下别的事，只想着怎样才能重回王后身边。最后，他决定离开家，走遍广阔的世界，去寻找白国的下落。
    - id: ch04
      title: 寻找白国
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 年轻的国王走到一座山前，遇见了百兽之主。那人只要吹响号角，森林里的野兽便会全部赶来。听完询问，他却摇了摇头。
        - id: ch04-b02
          speaker: beast_lord
          text: 我也不知道白国在哪里，不过可以替你问问我的野兽。
        - id: ch04-b03
          speaker: narrator
          text: 百兽之主吹响号角，森林里的动物全都聚到身边。他逐一询问，却没有一只听说过白国。于是，他送给年轻的国王一双雪鞋，让他去找自己的兄弟。
        - id: ch04-b04
          speaker: beast_lord
          text: 穿上这双鞋，你就能到几百英里外的兄弟那里。他是百鸟之主，你去问他。到了以后，把鞋尖转向我这里，雪鞋自己会回来。
        - id: ch04-b05
          speaker: narrator
          text: 年轻的国王穿上雪鞋，越过几百英里的路，来到百鸟之主那里。他按吩咐把鞋尖转向来路，雪鞋便自行返回。百鸟之主听完问题，召来空中所有鸟儿，挨个询问，还是没有谁知道白国。大家等了很久，一只离家整整十年的老鹰才赶到，可它知道的也不比别的鸟多。
        - id: ch04-b06
          speaker: bird_lord
          text: 那么，我也借你一双雪鞋。它会带你去几百英里外的兄弟那里。他是海中群鱼的主人，或许能回答你。别忘了把鞋转回来。
        - id: ch04-b07
          speaker: narrator
          text: 年轻的国王道了谢，又乘雪鞋越过几百英里，来到群鱼之主身边。他照旧把鞋转过来，看着它自行返回，随后第三次问起白国。群鱼之主吹响号角，召来海中所有鱼儿，可谁也不知道。直到最后，一条老得不能再老的梭子鱼才慢慢赶来，群鱼之主费了好大力气才把它叫到身边。
        - id: ch04-b08
          speaker: old_pike
          text: 白国我当然熟悉。我在那里当了十年厨子，明天早晨还得赶回去。国王一直没有回来，那里的王后就要嫁给别人了。
        - id: ch04-b09
          speaker: narrator
          text: 群鱼之主听了，便给年轻的国王出了个主意。
        - id: ch04-b10
          speaker: fish_lord
          text: 附近的荒原上有三兄弟，为一顶帽子、一件斗篷和一双靴子争了一百年。这三件宝物能让人隐去身形，还能把人送到心中想去的地方。你说要替他们试试宝物，再裁定该归谁所有。
        - id: ch04-b11
          speaker: narrator
          text: 年轻的国王谢过群鱼之主，很快便在荒原上找到那三兄弟。他问他们为什么没完没了地争斗，又提出由自己试用三件宝物，再替他们判断究竟该归谁所有。三兄弟欣然答应，把帽子、斗篷和靴子全都交给了他。
        - id: ch04-b12
          speaker: young_king
          text: 下次见面时，我再告诉你们裁定的结果。
        - id: ch04-b13
          speaker: narrator
          text: 他说完便动了一个念头，立刻消失在三兄弟眼前。三件宝物带着他飞过天空，途中恰好遇见北风。
        - id: ch04-b14
          speaker: north_wind
          text: 你要到哪里去？
        - id: ch04-b15
          speaker: young_king
          text: 我要去白国。
        - id: ch04-b16
          speaker: narrator
          text: 他把自己的遭遇讲给北风听。北风当即答应帮忙。
        - id: ch04-b17
          speaker: north_wind
          text: 你有这些宝物，当然走得比我快。我还得把每一个角落都吹遍呢。到了白国，你站在城堡大门旁的台阶上。我会呼啸着闯进去，装作要把城堡吹倒。那个要娶你王后的王子出来查看时，你就掐住他的脖子，把他扔给我。我来把他吹得远远的。
    - id: ch05
      title: 真正的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 年轻的国王比北风先赶到白国，按照约定站在城堡大门旁的台阶上。北风随即呼啸着冲进来，仿佛真要把整座城堡吹倒。它死死撼动屋顶和墙壁，震得上下不停摇晃。那位要娶王后的王子听见动静，果然出门查看。
        - id: ch05-b02
          speaker: narrator
          text: 年轻的国王一把揪住他的脖子，将他扔了出去。北风立刻卷住那人，把他远远带离王宫。碍事的人一消失，年轻的国王便走进城堡。
        - id: ch05-b03
          speaker: narrator
          text: 王后起初没有认出丈夫。漫长的旅途和日日相思的折磨，已经使他变得又瘦又苍白。直到她看见系在他头发里的戒指，又认出戒指上自己的名字，才终于知道眼前的人是谁，顿时满心欢喜。
        - id: ch05-b04
          speaker: narrator
          text: 随后，真正该举行的婚礼终于隆重举行了。那场婚礼无比盛大，婚礼的盛况传到很远很远的地方，四面八方的人都久久谈论着它。
