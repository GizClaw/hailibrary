  chapters:
    - id: ch01
      title: The Broken Sword
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This story is very old. The Danes who fought the English in King Alfred's day already knew it, and they carved scenes from it into rocks that can still be seen. It is an ancient and beautiful tale, but it is sad from beginning to end, filled with the fighting and killing of those old Danish times.
        - id: ch01-b02
          speaker: narrator
          text: Long ago, a king in the North had won many wars and grown old. He took a young wife, though another prince had hoped to marry her. That prince marched against him with a great army. The old king fought bravely, but his sword broke at last. He was wounded, and his men fled.
        - id: ch01-b03
          speaker: narrator
          text: When the battle ended and night fell, the king's young wife searched among the dead until she found him. She asked if his wounds could be healed.
        - id: ch01-b04
          speaker: sigmund
          text: No. My good fortune is gone, my sword is broken, and I must die. You will have a son, and he will grow into a great warrior. He will avenge me upon the king who has defeated me. Keep the broken pieces of my sword and have them made into a new blade for our son. Its name shall be Gram.
        - id: ch01-b05
          speaker: narrator
          text: Then the king died. His wife called her maid to her.
        - id: ch01-b06
          speaker: hiordis
          text: We must exchange clothes. You will take my name, and I will take yours, so that our enemy will not find us.
        - id: ch01-b07
          speaker: narrator
          text: They changed clothes and hid in a wood. Strangers found them there, carried them aboard a ship, and took them to Denmark. When they stood before the Danish king, he thought the woman dressed as a queen looked like a maid, while the supposed maid looked like a queen. He questioned the woman in royal clothes.
        - id: ch01-b08
          speaker: king_of_denmark
          text: In the darkness of night, how can you tell when morning is near?
        - id: ch01-b09
          speaker: maid
          text: When I was younger, I had to rise and light the fires. I still wake at that same hour.
        - id: ch01-b10
          speaker: narrator
          text: The king thought it strange that a queen should have lit the fires. Then he turned to the true queen, who wore a maid's dress.
        - id: ch01-b11
          speaker: king_of_denmark
          text: And how can you tell, in the dark of night, that dawn is drawing near?
        - id: ch01-b12
          speaker: hiordis
          text: My father gave me a gold ring. Just before dawn, it always grows cold on my finger.
        - id: ch01-b13
          speaker: king_of_denmark
          text: The maids in your home must have been rich indeed if they wore gold. You are no maid. You are a king's daughter.
        - id: ch01-b14
          speaker: narrator
          text: He treated her as a royal lady. In time, she had a son named Sigurd, a beautiful boy of great strength.
    - id: ch02
      title: Grani and the Hoard
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Sigurd had a tutor who stayed with him. One day, the tutor sent him to ask the king for a horse.
        - id: ch02-b02
          speaker: king_of_denmark
          text: Go and choose whichever horse you want.
        - id: ch02-b03
          speaker: narrator
          text: Sigurd went into the wood, where he met an old man with a white beard.
        - id: ch02-b04
          speaker: sigurd
          text: Come with me and help me choose a horse.
        - id: ch02-b05
          speaker: old_man
          text: Drive every horse into the river. Choose the one that swims across.
        - id: ch02-b06
          speaker: narrator
          text: Sigurd drove the horses into the water, and only one reached the other side. He chose that horse and called him Grani. Grani came from the line of Sleipnir, the horse of Odin, god of the North. Sleipnir ran as swiftly as the wind, and Grani was the finest horse in the world.
        - id: ch02-b07
          speaker: narrator
          text: A day or two later, the tutor spoke to Sigurd again.
        - id: ch02-b08
          speaker: regin
          text: A great treasure of gold lies hidden nearby. Winning it would be a deed worthy of you.
        - id: ch02-b09
          speaker: sigurd
          text: I know the tales about that treasure. The dragon Fafnir guards it, and he is so huge and wicked that no one dares approach him.
        - id: ch02-b10
          speaker: regin
          text: He is no larger than any other dragon. If you had your father's courage, you would not be afraid of him.
        - id: ch02-b11
          speaker: sigurd
          text: I am not a coward. Why are you so eager for me to fight this dragon?
        - id: ch02-b12
          speaker: narrator
          text: The tutor's name was Regin. He explained that the hoard of red gold had once belonged to his father, who had three sons. The eldest was Fafnir, now the dragon. The second was Otter, who could take an otter's shape whenever he wished. Regin was the third, a master smith who made swords.
        - id: ch02-b13
          speaker: narrator
          text: In those days, a dwarf named Andvari lived in a pool beneath a waterfall, where he hid a great store of gold. One day, Otter caught and ate a salmon there. He fell asleep on a stone in his otter shape. A traveller passing by threw a stone, killed him, stripped off his skin, and carried it to the home of Otter's father.
        - id: ch02-b14
          speaker: narrator
          text: The father knew that his son was dead. As punishment, he demanded that the killer fill Otter's skin with gold and cover every part of it with red gold. Otherwise, the killer would suffer a terrible fate. The traveller captured Andvari and took his treasure. He even seized the single ring the dwarf still wore.
        - id: ch02-b15
          speaker: narrator
          text: In his anger, the poor dwarf laid a curse upon the gold. It would bring nothing but misery to every man who owned it, for all time. The otter skin was filled and covered with gold, except for one hair. Andvari's last ring covered that.
        - id: ch02-b16
          speaker: narrator
          text: The treasure brought good fortune to no one. Fafnir killed his own father, took the gold, and lay upon it. He gave Regin nothing, and no other man dared come near.
        - id: ch02-b17
          speaker: sigurd
          text: Make me a strong sword, Regin. I will use it to kill the dragon.
        - id: ch02-b18
          speaker: narrator
          text: Regin forged a sword, but when Sigurd struck a lump of iron with it, the blade broke. Regin made a second sword, and Sigurd broke that one too. Then Sigurd went to his mother and asked for the shattered pieces of his father's blade. He brought them to Regin, who hammered and worked them into a new sword. It was so sharp that fire seemed to run along its edges.
        - id: ch02-b19
          speaker: narrator
          text: Sigurd struck the lump of iron. This time, the blade did not break. It split the iron in two. Next he tossed a lock of wool into the river. When the current carried it against the sword, the wool parted cleanly.
        - id: ch02-b20
          speaker: sigurd
          text: This sword will do.
        - id: ch02-b21
          speaker: narrator
          text: Before facing Fafnir, Sigurd led an army against the men who had killed his father. He slew their king, took his wealth, and returned home.
    - id: ch03
      title: Fafnir's Bane
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A few days later, Sigurd and Regin rode out one morning to the heath where Fafnir rested. Sigurd found the path the dragon took when he crawled to a cliff to drink. It looked as though a mighty river had once torn through the ground and left a deep valley behind.
        - id: ch03-b02
          speaker: narrator
          text: Sigurd climbed down into that hollow and dug several pits. He hid in one of them with his sword drawn. After a while, the earth began to shake beneath the dragon's weight as he dragged himself toward the water. He snorted and roared, driving a cloud of venom before him. Anyone standing in his path would have died.
        - id: ch03-b03
          speaker: narrator
          text: Sigurd waited until half of Fafnir's body had passed over the pit. Then he drove Gram straight into the dragon's heart. Fafnir thrashed his tail until stones split and trees crashed around him. As he lay dying, he spoke.
        - id: ch03-b04
          speaker: fafnir
          text: Whoever you are, you have killed me, but this gold will destroy you. It will destroy everyone who owns it.
        - id: ch03-b05
          speaker: sigurd
          text: I might leave the gold alone if that meant I would never die. But every man must die, and a brave man does not let death frighten him away from what he desires. Die now, Fafnir.
        - id: ch03-b06
          speaker: narrator
          text: Fafnir died. From then on, Sigurd was called Fafnir's Bane, the Dragonslayer.
        - id: ch03-b07
          speaker: narrator
          text: Sigurd rode back and found Regin waiting. Regin asked him to roast Fafnir's heart so that he could taste it. Sigurd placed the heart on a stake over the fire. While it cooked, he touched it with one finger and burned himself. He put the finger into his mouth, and so he tasted the dragon's heart.
        - id: ch03-b08
          speaker: narrator
          text: At once, Sigurd could understand the speech of birds. He heard four woodpeckers talking nearby.
        - id: ch03-b09
          speaker: woodpecker_1
          text: Look at Sigurd, roasting Fafnir's heart for someone else. He ought to taste it himself and gain all wisdom.
        - id: ch03-b10
          speaker: woodpecker_2
          text: Regin is lying there, ready to betray the man who trusts him.
        - id: ch03-b11
          speaker: woodpecker_3
          text: Sigurd should cut off Regin's head and keep the gold for himself.
        - id: ch03-b12
          speaker: woodpecker_4
          text: Yes, let him do that. Then he should ride across Hindfell to the place where Brynhild sleeps.
        - id: ch03-b13
          speaker: narrator
          text: Sigurd heard that Regin meant to betray him. With one stroke of Gram, he cut off Regin's head. Then all four birds began to sing together.
        - id: ch03-b14
          speakers: [woodpecker_1, woodpecker_2, woodpecker_3, woodpecker_4]
          ensemble: chorus
          text: We know a fair maiden who lies asleep. Do not be afraid, Sigurd. Go and win the bride Fortune is keeping for you. High above Hindfell, red fire burns around her dwelling. She will love you well, if you are strong enough to win her. There she must sleep until you come to wake her. Rise and ride to her now. She will make a vow and never fear to keep it.
        - id: ch03-b15
          speaker: narrator
          text: Sigurd remembered the tale of an enchanted lady far away. A spell held her asleep inside a castle ringed with flame. She would sleep forever unless a knight rode through the fire and woke her. Sigurd decided to seek her, but first he followed Fafnir's dreadful trail to its end.
        - id: ch03-b16
          speaker: narrator
          text: The dragon had lived behind iron doors in a cave dug deep beneath the earth. It was filled with golden bracelets, crowns, and rings. There Sigurd also found the Helm of Dread, a golden helmet that made its wearer invisible. He heaped everything onto faithful Grani's back and rode south toward Hindfell.
    - id: ch04
      title: The Maiden in the Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Night had fallen when Sigurd reached the hill. On its crest, red fire streamed up into the sky. Within the flames stood a castle, with a banner flying from its highest tower. Sigurd urged Grani toward the fire. The horse leaped through as lightly as if he were crossing open heather.
        - id: ch04-b02
          speaker: narrator
          text: Sigurd entered the castle and found someone asleep in full armor. He lifted the helmet from the sleeper's head and saw a woman of great beauty. She opened her eyes.
        - id: ch04-b03
          speaker: brynhild
          text: Ah, is it you, Sigurd, son of Sigmund? Have you broken the curse and come at last to wake me?
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: Long before, a thorn from the tree of sleep had pierced Brynhild's hand. Odin had sent it as punishment because she had displeased him. Brynhild was a warrior maiden who went armed into battle like a man. She had sworn never to marry anyone who knew fear or dared not cross the wall of flame.
        - id: ch04-b05
          speaker: narrator
          text: Now Sigurd and Brynhild fell in love and promised to remain true to each other. He gave her a ring. It was the last ring taken from the dwarf Andvari.
        - id: ch04-b06
          speaker: narrator
          text: Sigurd rode away and came to the home of another king. That king had a beautiful daughter named Gudrun, and Gudrun's mother was a witch. Gudrun fell in love with Sigurd, but he spoke constantly of Brynhild and of how beautiful and dear she was.
        - id: ch04-b07
          speaker: narrator
          text: One day, Gudrun's mother mixed poppies and drugs of forgetfulness into a magic cup. She told Sigurd to drink to Gudrun's health. He drank, and in that instant he forgot Brynhild. He loved Gudrun instead, and they married amid great rejoicing.
    - id: ch05
      title: The Second Ride Through the Flames
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Gudrun's mother wanted her son Gunnar to marry Brynhild. She told him to take Sigurd and go to ask for Brynhild's hand. The two men rode to the home of Brynhild's father. The witch's drink had swept Brynhild entirely from Sigurd's memory, though she still remembered and loved him.
        - id: ch05-b02
          speaker: brynhilds_father
          text: Brynhild will marry only the man who can ride through the flames before her enchanted tower.
        - id: ch05-b03
          speaker: narrator
          text: They rode to the tower. Gunnar urged his own horse toward the blaze, but the animal refused to face it. Then Gunnar tried Grani. Grani would not move with Gunnar on his back either.
        - id: ch05-b04
          speaker: narrator
          text: Gunnar remembered magic his mother had taught him. By that spell, Sigurd took Gunnar's exact appearance, while Gunnar looked exactly like Sigurd. Wearing Gunnar's shape and armor, Sigurd mounted Grani. This time, the horse sprang through the wall of fire.
        - id: ch05-b05
          speaker: narrator
          text: Sigurd found Brynhild within, but the drug in the witch's wine still kept him from remembering her. Brynhild had sworn to wed the man who crossed the flames. She believed Sigurd was Gunnar, so she had no choice but to promise to become Gunnar's wife.
        - id: ch05-b06
          speaker: narrator
          text: Sigurd gave her a ring. In return, Brynhild handed him the ring he had once given her in his own true shape, Andvari's last ring. Then Sigurd rode back through the fire. He and Gunnar removed the spell and returned to their own shapes.
        - id: ch05-b07
          speaker: narrator
          text: They went home to the witch queen's house, and Sigurd gave the dwarf's ring to Gudrun. Brynhild went to her father.
        - id: ch05-b08
          speaker: brynhild
          text: A king named Gunnar came and rode through the fire, so I must marry him. Yet I believed no one but Sigurd, Fafnir's Bane and my true love, could have done that deed. Sigurd has forgotten me, but I must keep my promise.
        - id: ch05-b09
          speaker: narrator
          text: So Gunnar and Brynhild were married, although Gunnar had not crossed the flames. Sigurd had done it while wearing Gunnar's shape.
        - id: ch05-b10
          speaker: narrator
          text: After the wedding and its feast were over, the witch's magic left Sigurd's mind. He remembered everything. He remembered waking Brynhild from her enchanted sleep and loving her. He remembered forgetting her, marrying another woman, and winning Brynhild as a bride for another man.
        - id: ch05-b11
          speaker: narrator
          text: Sigurd was brave. He said nothing that would make the others unhappy. But he could not hold back the curse bound to Andvari's treasure and the fatal golden ring.
    - id: ch06
      title: The Ring Reveals the Truth
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The curse soon reached them all. One day, Brynhild and Gudrun went bathing. Brynhild waded farther into the river than Gudrun and said this proved she stood above her. Her husband, she declared, had ridden through the fire when no other man dared face it.
        - id: ch06-b02
          speaker: gudrun
          text: Gunnar did not ride through those flames. Sigurd did. You gave Sigurd Andvari's ring when he came to you.
          emotion: angry
        - id: ch06-b03
          speaker: narrator
          text: Gudrun showed her the ring Sigurd had given her. Brynhild recognized it and understood the whole deception. She went as pale as a dead woman and returned home. She did not speak for the rest of that evening.
        - id: ch06-b04
          speaker: narrator
          text: The next day, Brynhild confronted her husband.
        - id: ch06-b05
          speaker: brynhild
          text: You are a coward and a liar, Gunnar. You never crossed the fire. You sent Sigurd in your place and claimed the deed as your own. You will never see me happy in your hall again. I will never drink wine, play chess, sew with golden thread, or speak a kind word there.
          emotion: angry
        - id: ch06-b06
          speaker: narrator
          text: She tore all her needlework apart and wept so loudly that everyone in the house heard. Her heart and her pride had broken together. She had lost her true love, Sigurd the Dragonslayer, and married a man who had deceived her.
        - id: ch06-b07
          speaker: narrator
          text: Sigurd came to comfort her, but Brynhild would not listen.
        - id: ch06-b08
          speaker: brynhild
          text: I wish a sword were buried deep in your heart.
          emotion: angry
        - id: ch06-b09
          speaker: sigurd
          text: You will not wait long before that bitter sword stands in my heart, and you will not live long after I am dead. But dear Brynhild, live and take comfort. Love Gunnar, your husband. I will give you all the gold in Fafnir's treasure.
          emotion: sad
        - id: ch06-b10
          speaker: brynhild
          text: It is too late.
          emotion: sad
        - id: ch06-b11
          speaker: narrator
          text: Sigurd's grief was so great that his heart swelled inside him and burst the steel rings of his mail shirt.
    - id: ch07
      title: The Ship of Flame
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Sigurd went away, and Brynhild resolved to kill him. She mixed serpent venom and wolf's flesh in one dish and gave it to Gunnar's younger brother. The moment he tasted it, madness seized him.
        - id: ch07-b02
          speaker: narrator
          text: He entered Sigurd's room while Sigurd slept and drove a sword through him, pinning him to the bed. Sigurd woke and seized Gram. As his attacker fled, Sigurd hurled the sword after him, and the blade cut the man in two.
        - id: ch07-b03
          speaker: narrator
          text: So Sigurd, Fafnir's Bane, died by treachery, though ten men together could not have killed him in a fair fight. Gudrun awoke and found him dead. She cried out in grief. Brynhild heard her and laughed, but faithful Grani lay down and died from sorrow.
        - id: ch07-b04
          speaker: narrator
          text: Then Brynhild began to weep until her own heart broke. They dressed Sigurd in all his golden armor and built a great mound of wood aboard his ship. At night, they laid the dead Sigurd upon it with Brynhild and the good horse Grani.
        - id: ch07-b05
          speaker: narrator
          text: They set the wood alight and launched the ship. The wind carried it blazing out to sea, a flame moving into the darkness.
        - id: ch07-b06
          speaker: narrator
          text: There Sigurd and Brynhild burned together, and the curse of the dwarf Andvari was fulfilled.
