audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖沉稳，童话感强
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中等
    old_king:
      display_name: 老国王
      tts:
        delivery: 威严坚毅，临终时虚弱而镇定
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 聪慧沉着，语气温和坚定
        timbre: 柔和清亮
        pace: 适中
        pitch: 中等
    maid:
      display_name: 侍女
      tts:
        delivery: 谨慎朴实，回答恭敬
        timbre: 清脆自然
        pace: 适中
        pitch: 中高
    danish_king:
      display_name: 丹麦国王
      tts:
        delivery: 机敏威严，判断果断
        timbre: 浑厚清晰
        pace: 适中
        pitch: 中低
    old_man:
      display_name: 白胡子老人
      tts:
        delivery: 神秘从容，指点简洁
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 低
    sigurd:
      display_name: 西格德
      tts:
        delivery: 勇敢坦率，年轻而有决断
        timbre: 明亮坚实
        pace: 适中
        pitch: 中等
    regin:
      display_name: 雷金
      tts:
        delivery: 老练劝诱，话里藏着算计
        timbre: 沙哑沉着
        pace: 稍慢
        pitch: 中低
    fafnir:
      display_name: 法夫尼尔
      tts:
        delivery: 凶狠阴沉，临死仍带威吓
        timbre: 粗粝厚重
        pace: 缓慢
        pitch: 低
    bird_1:
      display_name: 第一只啄木鸟
      tts:
        delivery: 清醒灵动，像在点破秘密
        timbre: 清脆轻盈
        pace: 稍快
        pitch: 高
    bird_2:
      display_name: 第二只啄木鸟
      tts:
        delivery: 警觉急切，提醒意味鲜明
        timbre: 清脆锐利
        pace: 稍快
        pitch: 高
    bird_3:
      display_name: 第三只啄木鸟
      tts:
        delivery: 果断直接，语气坚决
        timbre: 明亮短促
        pace: 稍快
        pitch: 中高
    bird_4:
      display_name: 第四只啄木鸟
      tts:
        delivery: 神秘笃定，像在指引道路
        timbre: 轻柔清亮
        pace: 适中
        pitch: 中高
    brynhild:
      display_name: 布伦希尔德
      tts:
        delivery: 高傲刚烈，深情中带着战士的坚毅
        timbre: 清澈有力
        pace: 适中
        pitch: 中等
    gudrun:
      display_name: 古德伦
      tts:
        delivery: 真挚敏感，受激时尖锐直率
        timbre: 柔亮清晰
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 断剑与王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这是一个古老得刻在岩石上的丹麦故事。早在阿尔弗雷德国王在位、丹麦人常与英格兰人交战时，人们就知道它了。那些岩画至今还能看见。故事很美，却也很悲伤，因为里面尽是征战与杀戮。北方有位年老的国王，打赢过许多战争。他后来又娶了一位年轻王后，另一个原想娶她的王子便率领大军来攻。老国王亲自出城，奋勇迎敌。可是打到最后，他的宝剑折断，自己也受了伤，部下纷纷逃散。
        - id: ch01-b02
          speaker: narrator
          text: 夜里，年轻王后在死者中找到丈夫，问他的伤还能不能治好。
        - id: ch01-b03
          speaker: old_king
          text: 治不好了。我的好运已经耗尽，剑也断了，我必须死。你会生下一个儿子，他将成为伟大的武士，替我向敌国国王报仇。收好断剑，将来为他铸成一把新剑，叫它格拉姆。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 国王把断剑与未出世的孩子托付给王后，说完便死了。为了不让敌人认出自己，王后把侍女叫到身边，想出一个逃命的办法。
        - id: ch01-b05
          speaker: queen
          text: 我们交换衣服。你用我的名字，我用你的名字。
        - id: ch01-b06
          speaker: narrator
          text: 王后与侍女换了衣服，也换了身份，随后藏进树林。可几个陌生人在林中遇见她们，把她们带上一艘船，掳到了丹麦。两人被带到丹麦国王面前。国王仔细一看，觉得穿王后衣服的侍女倒像侍女，穿侍女衣服的王后反而有王族气度，便问假王后怎样从黑夜里知道时辰正渐渐挨近清晨。
        - id: ch01-b07
          speaker: maid
          text: 我年轻时每天都要早起生火，所以现在还是会在那个时候醒来。
        - id: ch01-b08
          speaker: danish_king
          text: 亲自生火的王后，可真少见。
        - id: ch01-b09
          speaker: narrator
          text: 他又向穿侍女衣服的王后问了同一个问题。
        - id: ch01-b10
          speaker: queen
          text: 父亲送过我一枚金戒指。每当天快亮时，它戴在手上就会变冷。
        - id: ch01-b11
          speaker: danish_king
          text: 能让侍女戴金戒指的人家，可真富有。你不是侍女，你是国王的女儿。
        - id: ch01-b12
          speaker: narrator
          text: 丹麦国王听出两人的真实身份，从此以王室之礼待她。日子一天天过去，王后生下一个儿子，取名西格德。孩子长得俊美，力气也大。老师一直陪伴他长大。有一天，老师让西格德去见国王，向国王讨一匹马。国王答应了，让他到马群里自己挑选。西格德走进树林，在那里遇到一位白胡子老人，便请老人帮自己选马。
        - id: ch01-b13
          speaker: old_man
          text: 把马全赶进河里，选那匹能游到对岸的。
        - id: ch01-b14
          speaker: narrator
          text: 西格德把马群全赶进河里，只有一匹马奋力游到了对岸。他立刻选中它。那匹马名叫格拉尼，是斯莱普尼尔的后代。斯莱普尼尔是北方大神奥丁的坐骑，奔跑起来像风一样快。格拉尼继承了它的血统，是世上最好的骏马。
    - id: ch02
      title: 黄金的诅咒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一两天后，老师告诉西格德，附近藏着大批黄金，得到它才配得上他。
        - id: ch02-b02
          speaker: sigurd
          text: 我听说过那批财宝。恶龙法夫尼尔守着它，那条龙又大又凶，谁也不敢靠近。
        - id: ch02-b03
          speaker: regin
          text: 他并不比别的龙更大。你要像父亲一样勇敢，就不会怕他。
        - id: ch02-b04
          speaker: sigurd
          text: 我不是胆小鬼。可你为什么非要我去和他搏斗？
        - id: ch02-b05
          speaker: narrator
          text: 老师这才说出自己名叫雷金，也讲起财宝的来历。那一大堆赤金原本属于他的父亲。老人有三个儿子。长子便是如今的恶龙法夫尼尔。次子名叫奥特，只要他愿意，随时都能变成一只水獭。第三个儿子就是雷金自己，他是个了不起的铁匠，最擅长铸剑。
        - id: ch02-b06
          speaker: narrator
          text: 那时，瀑布下面住着一个名叫安德瓦里的侏儒。他把大批黄金藏在水潭里。一天，化作水獭的奥特来到潭边捕鱼。他捉住一条鲑鱼，吃饱以后便以水獭的模样躺在石头上睡觉。一个路人经过，拿石头砸死奥特，剥下獭皮，带到他父亲家里。老人一眼认出死的是自己的儿子，便要惩罚凶手。他命那人拿黄金装满獭皮，还得用赤金把整张皮盖得严严实实，否则便要叫他吃不了兜着走。那人只好下到水潭，捉住安德瓦里，夺走了全部财宝，连侏儒戴在手上的最后一枚戒指也没留下。
        - id: ch02-b07
          speaker: narrator
          text: 可怜的安德瓦里怒不可遏，便诅咒这批黄金，叫它从今以后无论落到谁手里，都只能给主人带去厄运。人们用黄金把獭皮装满，又用黄金盖住外面，最后还露着一根獭毛，只好拿侏儒最后那枚戒指遮住它。诅咒很快应验。法夫尼尔为了财宝杀死亲生父亲，接着独占黄金，整日躺在上面打滚，连一点也不肯分给弟弟。从此再也没有人敢走近那里。
        - id: ch02-b08
          speaker: sigurd
          text: 给我铸一把好剑，我要杀死法夫尼尔。
        - id: ch02-b09
          speaker: narrator
          text: 雷金先铸了一把剑。西格德朝铁块猛劈下去，剑当场折断。雷金又铸一把，还是被他劈断。西格德便去见母亲，取来父亲断剑的残片，交给雷金。雷金反复锤打，把残片重新锻造成格拉姆，剑刃锋利得仿佛有火在燃烧。西格德再去劈铁块，这回剑没有断，反倒把铁一劈为二。他又把一绺羊毛丢进河里。羊毛顺水漂来，刚碰上剑刃，也无声地断成了两截。
        - id: ch02-b10
          speaker: narrator
          text: 西格德说这把剑可以用了。不过，他先率兵讨伐杀父仇人，杀死敌国国王，夺取财富，替父亲报了仇，然后才回到家。
    - id: ch03
      title: 屠龙者与鸟语
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 西格德回家住了几天，一天清晨，他与雷金骑马来到恶龙栖息的荒原。法夫尼尔每次都从这里爬到悬崖边饮水。它留下的爬痕宽阔幽深，仿佛一条大河滚滚流过，冲出了一道山谷。西格德走进深沟，挖出许多陷坑，自己拔出格拉姆，藏进其中一个。等了不久，大地开始震颤，那是恶龙拖着沉重的身躯爬向水边。它一路喷鼻咆哮，毒雾滚滚涌在身前。谁若挡在那里，必定当场丧命。
        - id: ch03-b02
          speaker: narrator
          text: 西格德等到恶龙半截身子爬过头顶，猛地把格拉姆刺进它的心脏。法夫尼尔用尾巴疯狂抽打，石块崩裂，树木折倒。临死前，它开口诅咒西格德。
        - id: ch03-b03
          speaker: fafnir
          text: 杀我的人啊，这些黄金会毁掉你，也会毁掉以后每一个占有它的人。
          emotion: angry
        - id: ch03-b04
          speaker: sigurd
          text: 如果放弃黄金就能永远不死，我一件也不会碰。可人人都有一死，勇者绝不会因为怕死，就不去夺取自己渴望的东西。死吧，法夫尼尔！
        - id: ch03-b05
          speaker: narrator
          text: 法夫尼尔死了。从那一天起，人们都称西格德为法夫尼尔的克星、屠龙者。雷金要他烤熟龙心，让自己尝一尝。西格德把龙心穿在木签上，放到火上慢慢烤，不小心烫伤手指，便把手指放进嘴里。尝到龙心的一刻，他忽然听懂了鸟语。
        - id: ch03-b06
          speaker: bird_1
          text: 西格德竟在替别人烤法夫尼尔的心。他应该自己尝尝，得到世间的一切智慧。
        - id: ch03-b07
          speaker: bird_2
          text: 雷金正躺在那里，准备出卖信任他的西格德。
        - id: ch03-b08
          speaker: bird_3
          text: 让西格德砍下雷金的头，把黄金都留给自己。
        - id: ch03-b09
          speaker: bird_4
          text: 就该这样。然后让他越过辛德菲尔，去找沉睡的布伦希尔德。
        - id: ch03-b10
          speaker: narrator
          text: 四只鸟的话连在一起，让西格德明白雷金正图谋背叛自己。他没有再给雷金下手的机会，挥动格拉姆，一剑砍下了他的头。危险过去，所有鸟儿忽然一齐放声歌唱。
        - id: ch03-b11
          speakers: [bird_1, bird_2, bird_3, bird_4]
          ensemble: chorus
          text: 我们知道一位美丽姑娘，她还在沉睡。西格德呀，不要害怕，去赢得命运守候的姑娘。辛德菲尔山上燃着红色烈火，她住在火光中央，定会真心爱你。快去把她唤醒，她会许下永不背弃的誓言。
        - id: ch03-b12
          speaker: narrator
          text: 西格德想起远方那个流传已久的故事。有位美丽姑娘中了魔法，只能永远沉睡在烈火环绕的城堡里，除非有骑士穿过火焰，将她唤醒。他决定立刻前往那里。可在出发以前，他先沿恶龙留下的可怕爬痕一直走下去。法夫尼尔的巢穴是一座深埋地底、装着铁门的洞窟。洞里堆满金手镯、王冠和戒指。西格德还找到一顶金制的恐惧之盔，谁戴上它，谁就能隐去身形。他把这些财宝全都堆到忠诚的格拉尼背上，随后骑马向南，奔赴辛德菲尔。
    - id: ch04
      title: 烈火中的姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 夜里，西格德看见山巅的红色烈火直冲天空。火中矗立着一座城堡，最高的塔顶飘着旗帜。他催格拉尼冲向火焰。格拉尼轻盈一跃，仿佛越过石南花地。西格德走进城堡，看见一个全身披甲的人正在沉睡。他摘下头盔，眼前竟是一位美丽无比的姑娘。
        - id: ch04-b02
          speaker: brynhild
          text: 啊，你是西格蒙德之子西格德吗？是你破除了咒语，终于来唤醒我吗？
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 她就是布伦希尔德。很久以前，她得罪了奥丁大神，作为惩罚，睡眠之树的一根尖刺扎进她的手，咒语就此降临。她本是一位女战士，也像男子一样身披铠甲上阵作战。她还曾发誓，绝不嫁给一个懂得恐惧、不敢骑马穿过烈火围墙的男人。如今，布伦希尔德与西格德相爱了。两人许诺永不相负，西格德送她一枚戒指，正是从侏儒安德瓦里那里夺走的最后一枚戒指。
        - id: ch04-b04
          speaker: narrator
          text: 西格德后来骑马离开，来到另一位国王家中。国王有个美丽的女儿，名叫古德伦，她的母亲却是一个女巫。古德伦爱上了西格德，可西格德总在谈论布伦希尔德，说她多么美丽，多么叫人爱恋。一天，女巫把罂粟和使人遗忘的药放进一只魔法酒杯，让西格德为古德伦的健康举杯。西格德喝下魔酒，顿时忘掉可怜的布伦希尔德，转而爱上古德伦。两个人在一片欢庆声中结为夫妻。
    - id: ch05
      title: 被魔法偷换的婚约
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 女巫还想让儿子贡纳尔娶布伦希尔德，便叫他与西格德一同出发，向她求婚。两人骑马来到布伦希尔德父亲的家。女巫的失忆药让布伦希尔德从西格德心中完全消失，可她仍旧记得西格德，也仍旧爱着他。她的父亲告诉贡纳尔，女儿只肯嫁给能骑马穿过魔塔前熊熊烈火的人。于是他们一同来到火墙面前。
        - id: ch05-b02
          speaker: narrator
          text: 贡纳尔先催自己的马冲向火焰，可那匹马无论如何也不肯面对烈火。他又试着骑上西格德的格拉尼，格拉尼驮着贡纳尔时也一步不走。贡纳尔想起母亲教过的巫术，便施展魔法，让西格德变成自己的模样，自己则变成西格德的模样。披着贡纳尔铠甲的西格德骑上格拉尼，这一次，格拉尼纵身越过火墙。西格德来到布伦希尔德面前，可女巫酒杯里的失忆药仍在起效，他没有认出自己曾经唤醒的姑娘。
        - id: ch05-b03
          speaker: narrator
          text: 布伦希尔德以为眼前的人就是贡纳尔。她发过誓，要嫁给任何一个穿过烈火的人，如今再没有别的选择，只得答应做他的妻子。西格德送她一枚戒指，她则把从前西格德以本来面目送她的戒指还给了他，那正是安德瓦里的最后一枚戒指。西格德骑马离开火墙，与贡纳尔换回各自的形貌，两人一同回到女巫王后家中。西格德又把侏儒的戒指送给妻子古德伦。
        - id: ch05-b04
          speaker: brynhild
          text: 一个名叫贡纳尔的国王穿过了烈火，我必须嫁给他。可我一直以为，除了我真正爱过的西格德，再没有人能做到。西格德已经忘了我，我却必须守约。
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: 贡纳尔与布伦希尔德成了婚，尽管真正穿过烈火的并不是贡纳尔，而是披着贡纳尔形貌的西格德。婚礼与全部筵席结束以后，女巫魔酒的效力终于从西格德脑中消退，他记起了一切。他记起自己怎样闯过烈火，解开布伦希尔德的咒语，记起她才是自己真心所爱。可他也记起，自己怎样把她遗忘，娶了另一个女人，又替另一个男人赢得布伦希尔德做妻子。
        - id: ch05-b06
          speaker: narrator
          text: 西格德是个勇敢的人。他不愿说出真相，让身边的人全都陷入痛苦，因此始终没有向任何人吐露半个字。可是，凡是占有安德瓦里财宝与那枚致命金戒指的人，都逃不过它们带来的诅咒。即使西格德保持沉默，也无法把厄运挡在门外。
    - id: ch06
      title: 黑夜里的火船
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 一天，布伦希尔德与古德伦在河里洗澡。布伦希尔德走到更深的水中，说这表示自己比古德伦高贵，因为她的丈夫曾穿过无人敢面对的烈火。
        - id: ch06-b02
          speaker: gudrun
          text: 穿过烈火的不是贡纳尔，是西格德！从你那里拿走安德瓦里那枚戒指的人，也是西格德！
          emotion: angry
        - id: ch06-b03
          speaker: narrator
          text: 布伦希尔德看见古德伦手上的戒指，立刻认了出来，也在一瞬间明白了一切。她脸色像死人一样惨白，转身回到家中，整个晚上都没有说一句话。第二天，她指责丈夫贡纳尔是懦夫，是骗子，说他从未骑马穿过烈火，只是让西格德代替自己完成壮举，随后又冒认下来。她还说，从今往后，贡纳尔在厅堂里再也看不见她欢笑、饮酒、下棋、用金线刺绣，也再听不到她说一句温柔的话。
        - id: ch06-b04
          speaker: narrator
          text: 布伦希尔德把所有绣品撕得粉碎，随后放声痛哭，满屋的人都听见了。她的心和骄傲在同一个时刻破碎。她失去了真正爱的人，屠龙者、法夫尼尔的克星西格德，却嫁给了一个说谎的男人。西格德听见消息，赶来安慰她。布伦希尔德却一句也不肯听，只说自己恨不得看见一把剑深深扎进他的心脏。
        - id: ch06-b05
          speaker: sigurd
          text: 不会等太久，锋利的剑就会扎进我的心。我死以后，你也活不了多久。可是布伦希尔德，活下去吧，别再难过，好好爱贡纳尔。我愿把全部黄金，把法夫尼尔的宝藏都给你。
          emotion: sad
        - id: ch06-b06
          speaker: brynhild
          text: 太迟了。
          emotion: sad
        - id: ch06-b07
          speaker: narrator
          text: 西格德悲痛得心在胸中猛烈胀大，竟撑裂了锁子甲的钢环。他离开后，布伦希尔德决意杀他。她把蛇毒与狼肉放进一个盘子，送给贡纳尔的弟弟。那人吃过便发了狂，趁西格德熟睡闯进卧房，一剑将他钉在床上。
        - id: ch06-b08
          speaker: narrator
          text: 西格德从睡梦中惊醒，一把抓住格拉姆剑，向转身逃跑的凶手掷去。利剑追上那个人，把他当场劈成两半。可西格德受了致命伤，还是死去了。法夫尼尔的克星就这样遭人暗算而死。若是在光明正大的战斗中正面对敌，十个男人也杀不了他。
        - id: ch06-b09
          speaker: narrator
          text: 古德伦从睡梦中醒来，看见西格德已经死去，便放声哀号。布伦希尔德在远处听见她的哭声，却笑了起来。可忠诚的骏马格拉尼来到主人身边，卧倒在地，竟因过度悲痛而死。布伦希尔德随后也哭了起来，一直哭个不停，直到自己的心碎裂而亡。
        - id: ch06-b10
          speaker: narrator
          text: 人们给西格德穿上全副黄金铠甲，又在他的船上堆起高高的木柴。夜幕降临以后，他们把死去的西格德、死去的布伦希尔德和忠诚的格拉尼一同放到柴堆上。人们点燃大火，将船推入水中。风托着燃烧的船驶向大海，熊熊火光划进黑夜深处。西格德与布伦希尔德就这样在烈焰中一同焚化，侏儒安德瓦里对黄金发出的诅咒，也终于全部应验。
