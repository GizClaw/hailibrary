  chapters:
    - id: ch01
      title: The Land Without Death
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man whose one wish, and his constant prayer, was to become rich. He thought about nothing else by day or night. At last his prayers were answered, and he became very wealthy.
        - id: ch01-b02
          speaker: narrator
          text: The richer he became, the more he feared losing everything. He could not bear the thought of dying and leaving all his possessions behind. So he decided to search for a land where death did not exist. He prepared for the journey, said goodbye to his wife, and set out.
        - id: ch01-b03
          speaker: narrator
          text: In every new country, he asked the same question. Did people die there? Whenever the answer was yes, he continued his quest, no matter how far he had already traveled. At last he reached a country where people did not even know what the word death meant. The traveler was delighted, but one thing puzzled him.
        - id: ch01-b04
          speaker: wealthy_man
          text: If no one ever dies here, surely your land must be overflowing with people.
        - id: ch01-b05
          speakers: [countryman, countrywoman]
          ensemble: duo
          text: No, there aren't so many of us. From time to time, a voice calls one person and then another. Anyone who hears it gets up, goes away, and never returns.
        - id: ch01-b06
          speaker: wealthy_man
          text: When it calls, can people see whoever it is, or do they only hear the voice?
        - id: ch01-b07
          speakers: [countryman, countrywoman]
          ensemble: duo
          text: They see him, and they hear him too.
        - id: ch01-b08
          speaker: narrator
          text: The man was amazed that anyone could be foolish enough to follow that voice. They knew that once they went, they never came back. To him, that should have been warning enough.
        - id: ch01-b09
          speaker: narrator
          text: He returned home, gathered all he owned, and brought his wife and family to that country, resolved to make it their home. There, people did not die. They only heard a voice, followed it, and vanished into a land from which no one returned. The man had already settled what his family would do. No matter how loudly the voice called any of them, they would ignore it.
        - id: ch01-b10
          speaker: narrator
          text: When they had moved into their new home and put everything in order, he warned them once more. If they wanted to live, they must never listen when a voice called them.
    - id: ch02
      title: The Voice Calls His Wife
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Several years passed peacefully, and the family was happy in its new home. Then one day, while everyone sat together around the table, the man's wife sprang to her feet and cried out.
        - id: ch02-b02
          speaker: wife
          text: I'm coming! I'm coming!
        - id: ch02-b03
          speaker: narrator
          text: She looked around the room for her fur coat. Her husband leaped up, seized her hand, and held on firmly.
        - id: ch02-b04
          speaker: wealthy_man
          text: Have you forgotten my warning? Stay here, unless you want to die.
          emotion: fearful
        - id: ch02-b05
          speaker: wife
          text: Can't you hear that voice calling me? I only want to find out why it wants me. I'll be back at once.
        - id: ch02-b06
          speaker: narrator
          text: She fought to free herself and go wherever the voice was summoning her. Her husband refused to release her. He ordered every door in the house shut and bolted. When his wife saw that she could not get out, she gave in.
        - id: ch02-b07
          speaker: wife
          text: Very well, dear husband. I'll stay, just as you ask.
        - id: ch02-b08
          speaker: narrator
          text: He believed the danger had passed. He thought she had come to her senses and overcome that wild urge to obey the voice. But only a few minutes later, she dashed to a door, flung it open, and raced outside. Her husband ran after her.
        - id: ch02-b09
          speaker: narrator
          text: He caught hold of her fur coat and begged her not to go. If she went, he pleaded, she would certainly never return. She did not answer. Instead, she let her arms drop behind her, bent forward sharply, and slipped out of the coat. The empty coat remained in her husband's hands.
        - id: ch02-b10
          speaker: narrator
          text: The poor man stood as still as stone, watching her hurry away. As she ran, she called as loudly as she could.
        - id: ch02-b11
          speaker: wife
          text: I'm coming! I'm coming!
        - id: ch02-b12
          speaker: narrator
          text: She disappeared from sight. At last her husband recovered himself and went back indoors, muttering as he walked.
        - id: ch02-b13
          speaker: wealthy_man
          text: If she is foolish enough to want to die, there is nothing more I can do. I warned her. I begged her not to listen, however loudly that voice called.
    - id: ch03
      title: The Voice Calls the Man
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Days passed, then weeks, months, and years. Nothing else disturbed the household. One day, the man went to the barber for his usual shave. The shop was crowded, and the barber had just covered his chin with soap when the man suddenly jumped out of the chair and shouted.
        - id: ch03-b02
          speaker: wealthy_man
          text: I won't come! Do you hear me? I won't come!
        - id: ch03-b03
          speaker: narrator
          text: The barber and everyone else stared at him. No one understood whom he was answering. The man looked toward the door and called out again.
        - id: ch03-b04
          speaker: wealthy_man
          text: Listen carefully. I am not coming, and that is final. Now go away!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: A few minutes passed. Then he shouted once more.
        - id: ch03-b06
          speaker: wealthy_man
          text: Go away, or you'll be sorry! Call all you like. You will never make me follow you!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: His anger grew until anyone might have believed somebody was truly standing in the doorway and tormenting him. At last he sprang up and snatched the razor from the barber's hand.
        - id: ch03-b08
          speaker: wealthy_man
          text: Give me that razor. I'll teach him to leave people alone from now on!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: He rushed from the shop as though chasing someone no one else could see. The barber was determined not to lose his razor, so he ran after him. They raced at full speed until they were well beyond the town. Then, without warning, the man plunged headfirst over a precipice. He was never seen again.
        - id: ch03-b10
          speaker: narrator
          text: Just like all the others, he had been forced to follow the calling voice, even though he had fought against it.
    - id: ch04
      title: The Pit No One Could See
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The barber went home whistling, grateful for his own narrow escape. He told everyone what had happened. Soon the news had spread across the country. People now believed that everyone who had followed the voice and vanished had fallen into that same pit. Until then, no one had known where those people went.
        - id: ch04-b02
          speaker: narrator
          text: Crowds left the town to examine the ill-fated pit. It had swallowed so many people, yet it had never seemed to fill. But when they reached the place, they found nothing at all. Before them lay only a vast plain that looked as though it had been there since the beginning of the world.
        - id: ch04-b03
          speaker: narrator
          text: From that time on, the people of that country began to die, just like ordinary mortals everywhere else in the world.
