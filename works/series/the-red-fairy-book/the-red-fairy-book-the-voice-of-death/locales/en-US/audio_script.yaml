audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    wealthy_man:
      display_name: Wealthy Man
      tts:
        delivery: determined and self-assured
        timbre: full and mature
        pace: measured
        pitch: medium-low
    wife:
      display_name: Wife
      tts:
        delivery: warm but impulsive
        timbre: clear and mature
        pace: brisk
        pitch: medium
    countryman:
      display_name: Countryman
      tts:
        delivery: plain and matter-of-fact
        timbre: open and weathered
        pace: steady
        pitch: medium-low
    countrywoman:
      display_name: Countrywoman
      tts:
        delivery: direct and matter-of-fact
        timbre: clear and earthy
        pace: steady
