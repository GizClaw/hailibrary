audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖沉稳，童话感强
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中等
    musician:
      display_name: 乐师
      tts:
        delivery: 机敏从容，说话带着狡黠
        timbre: 明亮清晰
        pace: 适中
        pitch: 中等
    wolf:
      display_name: 狼
      tts:
        delivery: 殷勤自信，发怒时凶狠急切
        timbre: 粗厚低沉
        pace: 稍快
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 圆滑热切，求救时慌张
        timbre: 轻细灵活
        pace: 适中
        pitch: 中高
    hare:
      display_name: 小野兔
      tts:
        delivery: 天真有礼，语气轻快认真
        timbre: 轻柔稚嫩
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 狼想学小提琴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位神奇的乐师。一天，他独自在森林里闲逛，脑子里一会儿想着这件事，一会儿又想着那件事。到后来，能想的事情全想遍了，他觉得实在无聊。
        - id: ch01-b02
          speaker: musician
          text: 一个人待在森林里，时间过得真慢。我得找个讨人喜欢的伴儿。
        - id: ch01-b03
          speaker: narrator
          text: 他拿出小提琴，拉得四周都响起了回声。过了一会儿，灌木丛里钻出一匹狼，小跑着来到他面前。乐师一看，心里可不愿意让狼陪伴自己。
        - id: ch01-b04
          speaker: musician
          text: 哦，原来是一匹狼。我可半点儿也不想跟他做伴。
        - id: ch01-b05
          speaker: narrator
          text: 狼却走到跟前，殷勤地向他请教。
        - id: ch01-b06
          speaker: wolf
          text: 亲爱的乐师，你的琴拉得太动听了！请你教教我吧，我也想知道该怎么拉。
        - id: ch01-b07
          speaker: musician
          text: 这很容易。只要我说什么，你就一丝不差地照着做。
        - id: ch01-b08
          speaker: wolf
          text: 我当然照办。你很快就会知道，我这个学生学得有多快。
        - id: ch01-b09
          speaker: narrator
          text: 他们便结伴上路。走了一阵，前面出现一棵老橡树。树干里面已经空了，中间还裂着一道缝。
        - id: ch01-b10
          speaker: musician
          text: 你要是真想学小提琴，机会来了。把两只前爪都伸进树缝里。
        - id: ch01-b11
          speaker: narrator
          text: 狼乖乖伸进前爪。乐师马上搬来一块石头，紧紧楔进裂缝，把狼的两只前爪牢牢卡住。狼成了动弹不得的囚犯。
        - id: ch01-b12
          speaker: musician
          text: 你留在这里，等我回来吧。
        - id: ch01-b13
          speaker: narrator
          text: 说完，乐师独自走了。
    - id: ch02
      title: 狐狸也想学琴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又走了一阵，乐师再次觉得一个人在森林里十分无聊。
        - id: ch02-b02
          speaker: musician
          text: 时间过得这么慢，我还是再找个伴儿吧。
        - id: ch02-b03
          speaker: narrator
          text: 他抽出小提琴，起劲地拉起来。不一会儿，一只狐狸从树木间悄悄钻出。乐师看清来客，依旧不满意。
        - id: ch02-b04
          speaker: musician
          text: 哈，来的竟是一只狐狸。我可不想让他陪着我。
        - id: ch02-b05
          speaker: narrator
          text: 狐狸径直来到乐师面前。
        - id: ch02-b06
          speaker: fox
          text: 亲爱的朋友，你把小提琴拉得真好听。我也很想学会，你能教教我吗？
        - id: ch02-b07
          speaker: musician
          text: 那再容易不过。不过，我怎么吩咐，你就得怎么做。
        - id: ch02-b08
          speaker: fox
          text: 当然可以。你只管开口吩咐。
        - id: ch02-b09
          speaker: musician
          text: 好，那就跟我走。
        - id: ch02-b10
          speaker: narrator
          text: 他们走上一条小路，两边都是高高的树。乐师忽然停下。他把路旁一根粗壮的榛树枝压到地上，用脚踩住枝梢，又从另一边压下一根树枝。
        - id: ch02-b11
          speaker: musician
          text: 小狐狸，你若真心想学，就先把左前爪给我。
        - id: ch02-b12
          speaker: narrator
          text: 狐狸照办了。乐师把他的左前爪绑在一根树枝的末梢。
        - id: ch02-b13
          speaker: musician
          text: 很好，我的朋友。现在把右爪也给我。
        - id: ch02-b14
          speaker: narrator
          text: 右爪也被绑在另一根树枝上。乐师仔细检查过每一个绳结，确信全都牢靠，才把脚移开。两根树枝猛地弹回高处，可怜的狐狸也被吊到了半空。
        - id: ch02-b15
          speaker: musician
          text: 你就待在这儿，等我回来。
        - id: ch02-b16
          speaker: narrator
          text: 乐师说完，又一个人往前去了。
    - id: ch03
      title: 小野兔绕树奔跑
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，乐师第三次嫌独自在森林里太无聊，又想给自己找个伴儿。
        - id: ch03-b02
          speaker: musician
          text: 一个人待着，时间过得太慢了。我得再找个伴儿。
        - id: ch03-b03
          speaker: narrator
          text: 他拿出小提琴，拉得和先前一样欢快。一只小野兔听见琴声，很快跑到他面前。
        - id: ch03-b04
          speaker: musician
          text: 哦，这回来的是一只野兔。我也不想让他陪我。
        - id: ch03-b05
          speaker: hare
          text: 亲爱的乐师先生，你拉得真好听！我要是能学会这样拉琴，那该多好呀。
        - id: ch03-b06
          speaker: musician
          text: 想学会并不难。我叫你做什么，你就照着做。
        - id: ch03-b07
          speaker: hare
          text: 我一定听你的。你会发现，我学得可用心了。
        - id: ch03-b08
          speaker: narrator
          text: 他们结伴走了一段，来到森林里树木稀疏的地方。那里长着一棵白杨树。乐师取出一根长绳，绕在小野兔的脖子上，再把另一头系到树上。
        - id: ch03-b09
          speaker: musician
          text: 我快活的小朋友，现在绕着这棵树跑二十圈。
        - id: ch03-b10
          speaker: narrator
          text: 小野兔听话地跑了起来。一圈，两圈，一直跑满二十圈。长绳也在树干上缠了整整二十道，把他牢牢困住。可怜的小家伙拼命撕咬拉扯，还是逃不掉。绳子只会越收越紧，深深勒进他细嫩的脖子。
        - id: ch03-b11
          speaker: musician
          text: 留在这里，等我回来吧。
        - id: ch03-b12
          speaker: narrator
          text: 乐师丢下小野兔，继续赶自己的路。
    - id: ch04
      title: 三只野兽追来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 另一边，狼一直在拉扯、啃咬，还用爪子不停抓挠石头。最后，他终于拔出了两只前爪。狼气得发狂，立刻追赶乐师，决心抓到以后把他撕成碎片。
        - id: ch04-b02
          speaker: narrator
          text: 狐狸看见狼从树下跑过，连忙扯开嗓子求救。
        - id: ch04-b03
          speaker: fox
          text: 狼兄弟，快救救我！那个乐师也把我骗了！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 狼压下两根树枝，一口咬断绳子，把狐狸救了下来。两个家伙一起赶路，都发誓要向乐师报仇。接着，他们发现了被绳子困住的小野兔，也替他解开绳索。三只野兽便一同去寻找仇人。
        - id: ch04-b05
          speaker: narrator
          text: 这段时间里，乐师又拉起了小提琴。这一次，琴声引来的总算是他想找的伴儿。一个穷樵夫听见音乐，马上停下手里的活儿，把斧头夹在腋下，赶来听琴。
        - id: ch04-b06
          speaker: musician
          text: 这回才是合适的伴儿。我一直想找的是人，可不是森林里的野兽。
        - id: ch04-b07
          speaker: narrator
          text: 乐师奏出的曲调美妙极了。樵夫站在那里，仿佛中了魔法。琴声传进耳朵，他的心也欢喜得怦怦直跳。
        - id: ch04-b08
          speaker: narrator
          text: 正在这时，狼、狐狸和小野兔追到了。樵夫一看他们的样子，就明白他们不怀好意。他举起闪着亮光的斧头，挡到乐师身前。那架势分明是在警告他们，谁敢碰乐师一根头发，他就会叫谁付出代价。
        - id: ch04-b09
          speaker: narrator
          text: 三只野兽害怕了，一齐转身逃回森林。乐师为了答谢樵夫，给他拉了一首自己最拿手的曲子。拉完以后，他便告别樵夫，继续赶路去了。
