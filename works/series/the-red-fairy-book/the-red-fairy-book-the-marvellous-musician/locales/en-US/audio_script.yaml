audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    musician:
      display_name: Musician
      tts:
        delivery: clever and self-assured
        timbre: bright and smooth
        pace: measured
        pitch: medium
    wolf:
      display_name: Wolf
      tts:
        delivery: eager and forceful
        timbre: deep and rough
        pace: measured
        pitch: low
    fox:
      display_name: Fox
      tts:
        delivery: quick and ingratiating
        timbre: light and sly
        pace: lively
        pitch: medium-high
    hare:
      display_name: Hare
      tts:
        delivery: earnest and attentive
        timbre: soft and youthful
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: The Wolf's Lesson
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a marvellous musician. One day, he wandered through a wood all by himself. As he walked, he thought about one thing and then another. At last, there was simply nothing else left for him to think about.
        - id: ch01-b02
          speaker: musician
          text: Time passes very slowly when I am alone in the wood. I must find myself a pleasant companion.
        - id: ch01-b03
          speaker: narrator
          text: He took out his fiddle and played until the echoes woke all around him. Before long, a wolf pushed through the thicket and trotted over.
        - id: ch01-b04
          speaker: musician
          text: Oh, a wolf. I have no wish at all for his company.
        - id: ch01-b05
          speaker: wolf
          text: My dear musician, you play beautifully! Will you teach me how to do it?
        - id: ch01-b06
          speaker: musician
          text: You can learn easily enough. Just do exactly what I tell you.
        - id: ch01-b07
          speaker: wolf
          text: Of course I will. You will find me a very quick pupil.
        - id: ch01-b08
          speaker: narrator
          text: The musician and the wolf became travelling companions and went on together. After a time, they reached an old oak. The tree was hollow, with a crack down the middle of its trunk.
        - id: ch01-b09
          speaker: musician
          text: Here is your chance to learn the fiddle. Put your front paws into that crack.
        - id: ch01-b10
          speaker: narrator
          text: The wolf obeyed. At once, the musician grabbed a stone and drove it into the crack. Both front paws were wedged so tightly that the wolf could not move.
        - id: ch01-b11
          speaker: musician
          text: Wait there until I come back.
        - id: ch01-b12
          speaker: narrator
          text: And the musician went on alone.
    - id: ch02
      title: The Fox in the Branches
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After a while, the musician again felt how slowly time passed when he was alone in the wood. He decided that he must find another companion. Out came the fiddle, and he played with all his might. Soon a fox slipped between the trees and came straight up to him.
        - id: ch02-b02
          speaker: musician
          text: Aha, what is this? A fox. Well, I do not want his company either.
        - id: ch02-b03
          speaker: fox
          text: My dear friend, what beautiful fiddle music! I would love to learn how you play like that.
        - id: ch02-b04
          speaker: musician
          text: Nothing could be easier, if you promise to follow every word I say.
        - id: ch02-b05
          speaker: fox
          text: Certainly. You only have to tell me what to do.
        - id: ch02-b06
          speaker: musician
          text: Then come along with me.
        - id: ch02-b07
          speaker: narrator
          text: They walked together for part of the way, until they came to a path with tall trees on both sides. The musician stopped there. He bent a strong hazel branch from one side down to the ground and held its end beneath his foot. Then he pulled down a branch from the other side.
        - id: ch02-b08
          speaker: musician
          text: Give me your left front paw, little fox, if you truly want to learn.
        - id: ch02-b09
          speaker: narrator
          text: The fox held out his paw, and the musician tied it to one branch.
        - id: ch02-b10
          speaker: musician
          text: Now give me your right paw, my friend.
        - id: ch02-b11
          speaker: narrator
          text: He tied that paw to the other branch and checked every knot. Then he stepped off the branch ends. They sprang upward and left the poor fox hanging in the air.
        - id: ch02-b12
          speaker: musician
          text: Stay just where you are until I return.
        - id: ch02-b13
          speaker: narrator
          text: Once more, the musician walked away.
    - id: ch03
      title: The Hare Runs in Circles
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once again, the musician found that time dragged while he was alone in the wood. He decided to try once more to find a companion. He lifted his fiddle and played as merrily as before. This time, a little hare heard the music and came running toward him.
        - id: ch03-b02
          speaker: musician
          text: Oh, here comes a hare. I have no wish for his company either.
        - id: ch03-b03
          speaker: hare
          text: Dear Mr. Fiddler, you play so beautifully! I wish I knew how to do it.
        - id: ch03-b04
          speaker: musician
          text: It is easy to learn. You only need to do exactly what I tell you.
        - id: ch03-b05
          speaker: hare
          text: I will. You will see what an attentive pupil I can be.
        - id: ch03-b06
          speaker: narrator
          text: They went on together for a while, until they reached a thinner part of the wood. An aspen tree grew there. The musician took a long cord, tied one end around the little hare's neck, and fastened the other end to the tree.
        - id: ch03-b07
          speaker: musician
          text: Now, my merry little friend, run around the tree twenty times.
        - id: ch03-b08
          speaker: narrator
          text: The hare obeyed. After twenty circles, the cord had wound twenty times around the trunk. The poor little creature was trapped. He bit and tore at the cord, but he could not get free. Every struggle only made it cut into his tender neck.
        - id: ch03-b09
          speaker: musician
          text: Wait here until I come back.
        - id: ch03-b10
          speaker: narrator
          text: Then the musician continued on his way.
    - id: ch04
      title: The Animals Break Free
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, the wolf had been pulling, biting, and scratching at the stone. At last, he managed to drag his paws free. Full of anger, he raced after the musician. When he caught him, he meant to tear him to pieces.
        - id: ch04-b02
          speaker: narrator
          text: The fox saw the wolf running past and called as loudly as he could.
        - id: ch04-b03
          speaker: fox
          text: Brother Wolf, help me! The musician tricked me too!
        - id: ch04-b04
          speaker: narrator
          text: The wolf pulled the branches down and bit through the cord, setting the fox free. The two animals went on together, and both vowed to take revenge on the musician. They soon found the poor little hare still tied to the aspen and set him free as well. Then all three went off together to search for their enemy.
    - id: ch05
      title: The Right Companion
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: During all this, the musician had played his fiddle once more, and this time he had better luck. The sound carried to the ears of a poor woodman. The man stopped his work at once, tucked his hatchet under his arm, and came to listen to the music.
        - id: ch05-b02
          speaker: musician
          text: At last, I have found the right kind of companion. I wanted a human being all along, not a wild animal.
        - id: ch05-b03
          speaker: narrator
          text: The musician began to play for him. The tune was so enchanting that the poor woodman stood there as if under a spell. As he listened, his heart leaped for joy.
        - id: ch05-b04
          speaker: narrator
          text: While he stood there, the wolf, the fox, and the little hare arrived. The woodman saw at once that they meant mischief. He raised his glittering axe and stepped in front of the musician. He did not need to speak. His meaning was plain. If they touched one hair on the musician's head, they would have to answer to him.
        - id: ch05-b05
          speaker: narrator
          text: The sight of the woodman and his raised axe frightened all three animals. They turned and ran back into the wood. To thank the woodman, the musician played one of his finest tunes for him. Then he continued on his way.
