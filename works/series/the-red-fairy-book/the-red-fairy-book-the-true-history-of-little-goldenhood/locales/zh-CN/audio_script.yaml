audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    blanchette:
      display_name: 布朗谢特
      tts:
        delivery: 天真快活，遇险时惊慌但反应敏捷
        timbre: 稚嫩清亮
        pace: 轻快
        pitch: 高
    mother:
      display_name: 母亲
      tts:
        delivery: 关切认真，叮嘱时清楚坚定
        timbre: 温暖成熟
        pace: 适中
        pitch: 中等
    wolf:
      display_name: 狼
      tts:
        delivery: 狡猾油滑，伪装时故作亲切
        timbre: 粗哑低沉
        pace: 不紧不慢
        pitch: 低
    grandmother:
      display_name: 外婆
      tts:
        delivery: 勇敢果断，对外孙女慈爱爽直
        timbre: 苍老有力
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 真正的小金兜帽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你一定听过小红帽的故事。那可怜的孩子受了狼的骗，连糕饼、一小罐黄油和外婆一起被吞了。可我们如今知道，事情根本不是那样。小姑娘从前叫、现在也叫小金兜帽。最后被逮住吃掉的，也不是她和善良的外婆，而是那头恶狼。
        - id: ch01-b02
          speaker: narrator
          text: 且听我讲。故事开头，和你听过的倒有几分相像。
        - id: ch01-b03
          speaker: narrator
          text: 从前有个农家小姑娘，长得漂亮又可爱，正像当令时节的一颗明星。她本名布朗谢特。因为总披着一件奇妙的斗篷，帽兜金灿灿的，又像火一样鲜亮，所以大家更爱叫她小金兜帽。
        - id: ch01-b04
          speaker: narrator
          text: 这顶小帽兜是外婆送给她的。外婆的年纪实在太大，连自己活了多少岁都记不得了。她说，帽兜是用一缕阳光做成的，戴着它准能交好运。善良的老太太在人们眼里又像半个女巫，所以谁都猜想，这顶帽兜恐怕也施过魔法。它还真有，你很快就会知道。
        - id: ch01-b05
          speaker: mother
          text: 我的小金兜帽，让我看看你会不会独自认路。把这块糕饼送给外婆，留着明天过星期日吃。问问她身体怎么样，然后马上回来。路上别跟陌生人停下来闲聊。都听懂了吗？
        - id: ch01-b06
          speaker: blanchette
          text: 全听懂啦！
        - id: ch01-b07
          speaker: narrator
          text: 布朗谢特高高兴兴地带上那块糕饼，独自出发了。能替母亲办这件事，她心里很是得意。
    - id: ch02
      title: 林中的狼朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 外婆住在另一个村子，中间隔着一大片树林。布朗谢特走到林中一个拐弯处，忽然听见有人问她是谁。
        - id: ch02-b02
          speaker: wolf
          text: 是狼朋友。
        - id: ch02-b03
          speaker: narrator
          text: 这坏家伙早看见孩子独自出门，一直守在林中，正等着把她吃掉。偏巧这时附近来了几个伐木人，他怕自己的恶行被人看见，临时改了主意。他没有扑上去，反倒装成一条温顺的好狗，蹦蹦跳跳地迎了过来。
        - id: ch02-b04
          speaker: wolf
          text: 原来是你呀，我可爱的小金兜帽！
        - id: ch02-b05
          speaker: narrator
          text: 小姑娘根本不认识他，却停下了脚步。
        - id: ch02-b06
          speaker: blanchette
          text: 你认识我吗？那你叫什么名字？
        - id: ch02-b07
          speaker: wolf
          text: 我叫狼朋友。漂亮的小姑娘，你挎着篮子要去哪儿？
        - id: ch02-b08
          speaker: blanchette
          text: 去外婆家。我给她送一大块糕饼，明天过星期日时吃。
        - id: ch02-b09
          speaker: wolf
          text: 你外婆住在哪儿呀？
        - id: ch02-b10
          speaker: blanchette
          text: 就在树林那一边。进村第一所房子，挨着风车。
        - id: ch02-b11
          speaker: wolf
          text: 对，我想起来了！我正巧也去那里。你这两条小短腿准赶不上我。我先去告诉她，让她等着你。
        - id: ch02-b12
          speaker: narrator
          text: 狼说完便抄近路穿过树林，不到五分钟就到了外婆家。他笃笃敲门，没有回答。于是又敲得更响些，屋里还是没有人。他便用两条后腿直立起来，把两只前爪搭上门闩，门一下开了。
        - id: ch02-b13
          speaker: narrator
          text: 屋里一个人也没有。外婆一大早就起床进城卖草药去了。她出门时太匆忙，床铺还没来得及整理，那顶大睡帽也原样留在枕头上。
        - id: ch02-b14
          speaker: wolf
          text: 好极了！我知道该怎么办啦。
        - id: ch02-b15
          speaker: narrator
          text: 他关上门，把睡帽拉到眼睛上，伸直身子躺进床里，还拉好了床帘。
    - id: ch03
      title: 床帘后面的外婆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 好心的布朗谢特还在不慌不忙地赶路，像小姑娘们常做的那样，一路给自己找乐子。她一会儿采复活节雏菊，一会儿看小鸟怎样筑巢，一会儿又追着阳光里翩翩飞舞的蝴蝶跑。最后，她终于来到外婆门前，笃笃敲了两下。
        - id: ch03-b02
          speaker: wolf
          text: 谁呀？
        - id: ch03-b03
          speaker: narrator
          text: 狼竭力把粗嗓门压得柔和些。
        - id: ch03-b04
          speaker: blanchette
          text: 是我，外婆，你的小金兜帽。我带了一大块糕饼，给你明天过星期日吃。
        - id: ch03-b05
          speaker: wolf
          text: 手指按下门闩，再推一推，门就开了。
        - id: ch03-b06
          speaker: blanchette
          text: 咦，外婆，你是不是着凉了？
        - id: ch03-b07
          speaker: wolf
          text: 咳！有一点儿，就一点儿。把门关好，我的小羊羔。篮子放在桌上，脱掉裙子，到我身边躺会儿，也好歇一歇。
        - id: ch03-b08
          speaker: narrator
          text: 乖孩子脱下衣裳，却没有摘掉头上的小兜帽。她看清床上那副模样，吃惊极了。
        - id: ch03-b09
          speaker: blanchette
          text: 哎呀，外婆，你怎么这么像狼朋友？
          emotion: surprised
        - id: ch03-b10
          speaker: wolf
          text: 是这顶睡帽的缘故，孩子。
        - id: ch03-b11
          speaker: blanchette
          text: 外婆，你的胳膊怎么全是毛呀？
          emotion: surprised
        - id: ch03-b12
          speaker: wolf
          text: 这样抱你才抱得紧呀。
        - id: ch03-b13
          speaker: blanchette
          text: 外婆，你的舌头怎么那么大？
          emotion: surprised
        - id: ch03-b14
          speaker: wolf
          text: 这样才好回答你呀。
        - id: ch03-b15
          speaker: blanchette
          text: 外婆，你满嘴的白牙怎么那么大？
          emotion: surprised
        - id: ch03-b16
          speaker: wolf
          text: 这样才好把小孩子嚼碎！
        - id: ch03-b17
          speaker: narrator
          text: 狼猛地张大嘴，朝布朗谢特吞去。小姑娘赶紧低下脑袋。
        - id: ch03-b18
          speaker: blanchette
          text: 妈妈！妈妈！
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: 狼没能咬到孩子，只咬住了她的小兜帽。哎哟哟！他猛地缩了回去，一边大叫，一边拼命甩着下巴，活像吞下了烧红的炭。原来，那顶火焰颜色的帽兜灼伤了他的舌头，一直烧进喉咙深处。
        - id: ch03-b20
          speaker: narrator
          text: 你瞧，这正是旧时故事里常有的那种魔法帽，戴上它，有时能让人隐身，有时又能叫人刀枪不入。如今狼的喉咙烧坏了。他从床上跳下来，慌得到处寻找房门，嗷嗷叫个不停，仿佛全国所有的狗都紧紧追在身后。
    - id: ch04
      title: 外婆的大口袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就在这时，外婆从城里回来，肩上扛着卖空的长口袋。
        - id: ch04-b02
          speaker: grandmother
          text: 好你个强盗！站住别跑！
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: 老太太立刻撑开长口袋，把袋口横在门前。发了狂的狼只顾往外逃，根本来不及停，一头冲了进去，脑袋朝下直栽到袋底。这回轮到他被捉住、被吞掉了，就像一封信滑进邮筒。
        - id: ch04-b04
          speaker: narrator
          text: 勇敢的老太太当即扎紧袋口，扛着它跑到井边，再把袋子里的东西全倒下去。那个四处流窜的恶棍还在不停号叫，翻滚着跌进深井，最终淹死了。
        - id: ch04-b05
          speaker: grandmother
          text: 你这坏东西，还想嚼碎我的小外孙女！明天就拿你的皮给她做暖手筒。你的尸首也别浪费，正好给狗嚼去。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 外婆赶紧给布朗谢特穿好衣裳。可怜的孩子还躺在床上，吓得浑身发抖。
        - id: ch04-b07
          speaker: grandmother
          text: 宝贝，你想想，要是没有我送的小兜帽，你现在会在哪里呀？
        - id: ch04-b08
          speaker: narrator
          text: 为了让孩子重新鼓起勇气，两条发软的腿也恢复力气，外婆让她吃了一大块带来的糕饼，又喝下满满一杯葡萄酒。等她缓过来，外婆牵起她的手，一路把她送回了家。
    - id: ch05
      title: 晴天里的金兜帽
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 等事情全都弄明白，是谁责骂了布朗谢特呢？正是她的母亲。
        - id: ch05-b02
          speaker: narrator
          text: 不过，布朗谢特一遍又一遍地向母亲保证，自己往后无论如何也不会停下来听狼说话。她说了好多遍，母亲才终于原谅了她。
        - id: ch05-b03
          speaker: narrator
          text: 布朗谢特，也就是小金兜帽，果然信守了自己的诺言。直到今天，每逢天气晴朗，人们还能在田野里看见她走过，头上戴着那顶太阳颜色的漂亮小帽兜。
        - id: ch05-b04
          speaker: narrator
          text: 不过，要想见到她，你得早早起床。这个故事采自夏尔·马雷勒。
