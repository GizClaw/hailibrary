  chapters:
    - id: ch01
      title: The Golden Hood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: You know the tale of poor Little Red Riding Hood, whom the Wolf tricked and ate along with her cake, her little pot of butter, and her grandmother. Well, now we know that the true story happened quite differently. For one thing, the girl was called Little Golden Hood. For another, neither she nor her good grandmother was eaten. In the end, it was the wicked Wolf who was caught and devoured.
        - id: ch01-b02
          speaker: narrator
          text: Just listen.
        - id: ch01-b03
          speaker: narrator
          text: The beginning is rather like the tale you know. Once there was a little peasant girl, as pretty and sweet as a star in its season. Her real name was Blanchette, though most people called her Little Golden Hood. She always wore a marvelous little cloak with a hood the color of gold and fire.
        - id: ch01-b04
          speaker: narrator
          text: Her grandmother had given it to her. The old woman was so ancient that even she did not know her age. She said the hood was made from a ray of sunshine and ought to bring Blanchette good luck. People thought the grandmother was something of a witch, so everyone believed the hood had magic in it too.
        - id: ch01-b05
          speaker: narrator
          text: And it did, as you will see.
        - id: ch01-b06
          speaker: narrator
          text: One day, Blanchette's mother decided to find out whether the child could manage the journey to her grandmother's house alone.
        - id: ch01-b07
          speaker: mother
          text: Now then, my little Golden Hood, let's see if you can find the way by yourself. Take this fine piece of cake to Grandmother for her Sunday treat tomorrow. Ask how she is, then come straight home. Don't stop along the way to talk to strangers. Do you understand me?
        - id: ch01-b08
          speaker: blanchette
          text: Yes, I understand perfectly!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: Blanchette set off with the cake, very proud to have such an errand.
    - id: ch02
      title: Friend Wolf in the Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Grandmother lived in another village, and Blanchette had to cross a great wood to reach it. As she came around a bend in the road beneath the trees, a voice suddenly called out.
        - id: ch02-b02
          speaker: wolf
          text: Who goes there?
        - id: ch02-b03
          speaker: narrator
          text: It was Friend Wolf. He had watched the child set out alone, and the villain was waiting to eat her. But just then he noticed some woodcutters close enough to see him, so he changed his plan. Instead of springing on Blanchette, he bounded toward her like a friendly dog.
        - id: ch02-b04
          speaker: wolf
          text: Why, it's you, my sweet Little Golden Hood!
        - id: ch02-b05
          speaker: narrator
          text: Blanchette stopped to speak with him, though she did not know the Wolf at all.
        - id: ch02-b06
          speaker: blanchette
          text: Oh, so you know me! What's your name?
        - id: ch02-b07
          speaker: wolf
          text: They call me Friend Wolf. And where are you going, pretty one, with that little basket on your arm?
        - id: ch02-b08
          speaker: blanchette
          text: I'm taking Grandmother a nice piece of cake for her Sunday treat tomorrow.
        - id: ch02-b09
          speaker: wolf
          text: And where does your grandmother live?
        - id: ch02-b10
          speaker: blanchette
          text: On the far side of the wood, in the first house in the village. It's close to the windmill. You know the place, don't you?
        - id: ch02-b11
          speaker: wolf
          text: Ah, yes, now I remember. That's exactly where I'm going. With those short little legs of yours, I'm sure I'll arrive first. I'll tell her you're on your way, and then she'll be waiting for you.
        - id: ch02-b12
          speaker: narrator
          text: With that, the Wolf cut straight through the wood. Five minutes later, he stood outside Grandmother's house.
    - id: ch03
      title: The Wolf Arrives First
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Wolf knocked at the door. Toc, toc. No one answered. He knocked again, harder this time. Still no one came.
        - id: ch03-b02
          speaker: narrator
          text: Then he stood on his hind legs and set both front paws on the latch. The door opened. There was not a soul inside. Grandmother had risen early to sell herbs in town. She had left in such a hurry that her bed was still unmade, and her great nightcap lay on the pillow.
        - id: ch03-b03
          speaker: wolf
          text: Good. I know just what to do.
        - id: ch03-b04
          speaker: narrator
          text: He closed the door and pulled Grandmother's nightcap down over his eyes. Then he stretched himself out in her bed and drew the curtains around him.
        - id: ch03-b05
          speaker: narrator
          text: Meanwhile, good Blanchette wandered quietly along. As little girls sometimes do, she amused herself by picking Easter daisies, watching the small birds build their nests, and chasing butterflies that fluttered through the sunshine.
        - id: ch03-b06
          speaker: narrator
          text: At last she reached the house and knocked. Knock, knock.
        - id: ch03-b07
          speaker: wolf
          text: Who's there?
        - id: ch03-b08
          speaker: narrator
          text: The Wolf made his rough voice as soft as he could.
        - id: ch03-b09
          speaker: blanchette
          text: It's me, Granny, your little Golden Hood. I've brought you a big piece of cake for your Sunday treat tomorrow.
        - id: ch03-b10
          speaker: wolf
          text: Press the latch with your finger and push. The door will open.
        - id: ch03-b11
          speaker: blanchette
          text: Why, Granny, you sound as if you have a cold.
        - id: ch03-b12
          speaker: wolf
          text: Ahem! Only a little one, only a little. Close the door tightly, my little lamb. Set your basket on the table, take off your dress, and come lie beside me. You can have a little rest.
        - id: ch03-b13
          speaker: narrator
          text: The good child undressed. But notice this. She kept the little hood on her head. When she looked at the strange figure lying in Grandmother's bed, poor Blanchette was very surprised.
    - id: ch04
      title: The Hood of Fire
      blocks:
        - id: ch04-b01
          speaker: blanchette
          text: Oh! Grandmother, you look so much like Friend Wolf!
          emotion: surprised
        - id: ch04-b02
          speaker: wolf
          text: That's because of my nightcap, child.
        - id: ch04-b03
          speaker: blanchette
          text: Oh! Grandmother, your arms are so hairy!
          emotion: surprised
        - id: ch04-b04
          speaker: wolf
          text: Those arms are all the better for hugging you, my child.
        - id: ch04-b05
          speaker: blanchette
          text: Oh! Grandmother, what a huge tongue you have!
          emotion: surprised
        - id: ch04-b06
          speaker: wolf
          text: That tongue is all the better for answering you, child.
        - id: ch04-b07
          speaker: blanchette
          text: Oh! Grandmother, your mouth is full of enormous white teeth!
          emotion: surprised
        - id: ch04-b08
          speaker: wolf
          text: Those teeth are for crunching little children!
        - id: ch04-b09
          speaker: narrator
          text: The Wolf opened his jaws wide, ready to swallow Blanchette. But she ducked her head and cried out.
        - id: ch04-b10
          speaker: blanchette
          text: Mamma! Mamma!
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: The Wolf caught only her little hood. Then, oh dear, he jerked away. He cried out and shook his jaw as though he had swallowed burning coals. The fire-colored hood had scorched his tongue, right down his throat.
        - id: ch04-b12
          speaker: narrator
          text: You see, it was one of those magic caps from the old stories, the kind that could make a person invisible or protect them from harm.
        - id: ch04-b13
          speaker: narrator
          text: With his throat burning, the Wolf leaped from the bed and tried to find the door. He howled and howled as if every dog in the country were chasing him.
    - id: ch05
      title: The Wolf Is Caught
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At that very moment, Grandmother came home from town with her long, empty sack over her shoulder.
        - id: ch05-b02
          speaker: grandmother
          text: Ah, you villain! Just wait!
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: In an instant, she spread the mouth of the sack wide across the doorway. The maddened Wolf sprang straight into it, headfirst. Now he was the one who had been caught and swallowed, as neatly as a letter dropped into the post.
        - id: ch05-b04
          speaker: narrator
          text: The brave old woman tied the sack shut, just so. Then she ran to the well and emptied it. Still howling, the rascal tumbled down into the water and drowned.
        - id: ch05-b05
          speaker: grandmother
          text: You scoundrel! You thought you would crunch my little grandchild. Well, tomorrow we'll make her a muff from your skin, and you'll be crunched instead. We'll give your carcass to the dogs!
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: Then Grandmother hurried to dress poor Blanchette, who was still trembling with fear in the bed.
        - id: ch05-b07
          speaker: grandmother
          text: My darling, where would you be now without that little hood of mine?
        - id: ch05-b08
          speaker: narrator
          text: To put courage and strength back into the child, Grandmother gave her a good piece of cake and a hearty drink of wine. After that, she took Blanchette by the hand and led her home.
        - id: ch05-b09
          speaker: narrator
          text: And who do you think scolded Blanchette after hearing everything that had happened? Her mother did.
        - id: ch05-b10
          speaker: narrator
          text: But Blanchette promised again and again that she would never stop to listen to a Wolf anymore. At last, her mother forgave her.
        - id: ch05-b11
          speaker: narrator
          text: Blanchette, the Little Golden Hood, kept her word. When the weather is fine, you may still see her in the fields, wearing her lovely little hood the color of the sun.
        - id: ch05-b12
          speaker: narrator
          text: But if you want to see her, you must rise early.
