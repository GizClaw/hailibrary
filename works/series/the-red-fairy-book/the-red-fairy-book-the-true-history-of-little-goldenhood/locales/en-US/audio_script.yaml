audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storylike
        timbre: clear and mellow
        pace: measured
        pitch: medium
    blanchette:
      display_name: Blanchette
      tts:
        delivery: bright and sincere
        timbre: clear and youthful
        pace: lively
        pitch: high
    mother:
      display_name: Mother
      tts:
        delivery: caring and firm
        timbre: warm and clear
        pace: measured
        pitch: medium
    wolf:
      display_name: Friend Wolf
      tts:
        delivery: sly and theatrical
        timbre: rough and resonant
        pace: measured
