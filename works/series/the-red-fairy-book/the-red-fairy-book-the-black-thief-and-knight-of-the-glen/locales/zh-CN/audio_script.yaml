audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 宽厚深情，悲伤时克制沉重
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低
    first_queen:
      display_name: 先王后
      tts:
        delivery: 温柔端庄，临终嘱托坚定清楚
        timbre: 柔和微弱
        pace: 缓慢
        pitch: 中等
    queen:
      display_name: 王后
      tts:
        delivery: 表面优雅，内里善妒狠毒
        timbre: 清冷锐利
        pace: 适中
        pitch: 中高
    hen_wife:
      display_name: 养鸡妇人
      tts:
        delivery: 狡猾世故，说话胸有成竹
        timbre: 干涩低哑
        pace: 稍慢
        pitch: 中低
    youngest_prince:
      display_name: 三王子
      tts:
        delivery: 勇敢重情，遇险仍坦率坚定
        timbre: 年轻清亮
        pace: 明快稳健
        pitch: 中等
    black_thief:
      display_name: 黑帽大盗
      tts:
        delivery: 机敏豪爽，讲险遇时从容而有悬念
        timbre: 粗粝温暖
        pace: 张弛有度
        pitch: 中低
    knight:
      display_name: 峡谷骑士
      tts:
        delivery: 威严强硬，听故事时渐渐显出好奇与仁心
        timbre: 洪亮厚重
        pace: 稳健
        pitch: 低
    young_woman:
      display_name: 年轻女子
      tts:
        delivery: 善良忧惧，危急中反应利落
        timbre: 柔和清晰
        pace: 稍快
        pitch: 中高
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 沉静笃定，揭开往事时郑重清楚
        timbre: 苍老温和
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 高塔里的三位王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，爱尔兰南部有一位国王和一位王后。他们的三个儿子都还年幼，王后便病得快要离开人世。宫廷上下都在悲伤，国王更是谁也劝不住。王后知道时候到了，把丈夫叫到床前。
        - id: ch01-b02
          speaker: first_queen
          text: 我走以后，你还年轻，一定会再娶。我只求你做一件事。在海岛上建座高塔，让三个儿子住在那里，直到他们长大成人。别让别的女人管束他们，也别耽误他们学习王子该懂的知识、本领和游戏。请你一定答应我。永别了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 国王眼里含着泪，刚来得及答应事事照办，王后便在床上转过身，带着微笑咽了气。宫廷和整个王国从没经历过这样深重的哀悼，因为无论对穷人还是富人，世上再也找不到比她更仁厚的女子。人们用极其隆重的仪式安葬了王后。国王几乎无法从丧妻之痛中振作起来，却仍记得自己的诺言。他命人建好海岛上的高塔，请来可靠的师傅，把三个儿子安置在那里。
        - id: ch01-b04
          speaker: narrator
          text: 许多日子过去，国内的领主和骑士们见国王仍然年轻，便劝他不要再独自生活，应当另娶一位妻子。国王终于听从劝告，众人为他选中邻国国王的女儿。那位公主既富有又美丽，国王也十分宠爱她。没过多久，新王后生下一个漂亮的儿子。宫中大摆筵席，处处欢庆，已故的王后几乎被人彻底遗忘。此后风平浪静，国王和新王后一同安乐地过了好几年。
        - id: ch01-b05
          speaker: narrator
          text: 一天，王后为了办一件事，亲自去见宫里的养鸡妇人。两个人谈了很久，王后正要告辞，妇人竟当面祷告说，但愿王后下次再来找她时摔断脖子。一个身份最低微的臣民居然敢这样冒犯自己，王后勃然大怒，命她立刻说出缘由，不然就要把她处死。
        - id: ch01-b06
          speaker: hen_wife
          text: 娘娘，这个缘由关系到您和孩子的将来，您得好好酬谢我才行。
        - id: ch01-b07
          speaker: queen
          text: 你想要什么酬劳？
        - id: ch01-b08
          speaker: hen_wife
          text: 我要一大包羊毛、一老缸黄油，还有一整桶小麦，每一样都得装得满满的。那包羊毛，要七群羊和它们七年里繁殖出来的所有羊才够。那缸黄油，要七座乳牛场和它们七年里增产的全部黄油才够。至于那桶小麦，得拿七桶麦子作种，把七年里收获的麦子全交给我。
        - id: ch01-b09
          speaker: queen
          text: 这份酬劳可不轻。只要你的缘由真有那么要紧，我全都给你。
        - id: ch01-b10
          speaker: hen_wife
          text: 您真是太糊涂了，竟没发现一件对自己和孩子万分危险的事。国王和先王后还有三个俊美的儿子，一直关在高塔里。国王等他们成年，就要把王国分给他们，让您的儿子自己到外面去闯荡谋生。您若不想办法除掉他们，到头来，您的孩子甚至连您自己都会孤苦无依。
        - id: ch01-b11
          speaker: queen
          text: 那我该怎么做？我实在想不出办法。
        - id: ch01-b12
          speaker: hen_wife
          text: 您先告诉国王，自己刚听说他有三个儿子，很惊讶他竟瞒了您这么久。再说您想见见他们，他们也早该恢复自由了，请国王把他们接进宫。国王一定会答应，还会大摆筵席，安排各种游戏。众人开始取乐，您就请三位王子打牌。他们不会拒绝。您要当着众人的面讲好，若是您赢，他们就听您吩咐；若是他们赢，您也照他们的话做。这副牌给您，拿着它，您不会输。
        - id: ch01-b13
          speaker: narrator
          text: 王后接过纸牌，谢过妇人的指点，立刻回了王宫。她坐立不安，只等机会向国王谈起孩子。最后，她用温柔又得体的话开了口，没露出半点算计。国王爽快地答应了，立刻派人到高塔接儿子们。三个年轻人终于摆脱长年的幽禁，欢欢喜喜地来到宫中。他们个个仪表堂堂，又精通各种技艺、武艺和游戏，很快赢得所有人的喜爱与敬重。
        - id: ch01-b14
          speaker: narrator
          text: 王后见到他们，妒火烧得比从前更旺。她只嫌宴饮庆贺迟迟不结束，一心想提出赌局，因为她对养鸡妇人给的牌信心十足。等王室贵宾们开始玩起各种游戏，她便狡猾地挑战三位王子，又照妇人的吩咐定下赌约。大王子先和她对局，输了。二王子接着上场，也输了。三王子最后和她打牌，这一次却是王子获胜。王后没能把他也握在手里，心中恨得厉害，因为三兄弟中数他最英俊，也最受人爱戴。
        - id: ch01-b15
          speaker: queen
          text: 输给我的两位王子，必须带回峡谷骑士的铃铛骏马。不然，你们就拿脑袋偿还赌债。
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 满朝的人都急着听王后会提出什么要求，还不知道她心里藏着恶意。至于这主意是养鸡妇人教的，还是王后自己想出来的，谁也说不准。两位王子不知道这差事多么可怕，并不担忧。满朝众人却惊呆了，因为他们都明白，铃铛骏马根本不可能到手，过去凡是去夺它的人，全都丧了命。可赌约无法反悔，大家只好又请三王子说出他赢来的要求。
        - id: ch01-b17
          speaker: youngest_prince
          text: 哥哥们要走一条不认得的危险道路，我绝不会留在这里。无论遇见什么，我都和他们一起去。王后必须站到宫中最高的塔顶，只能吃谷穗、喝冷水，直到我们回来，或是确知我们已死。哪怕等上七年甚至更久，也不许下来。
        - id: ch01-b18
          speaker: narrator
          text: 一切安排妥当，三位王子便离开宫廷，出发寻找峡谷骑士的城堡。他们沿路前行，遇见一个上了些年纪、走路微跛的男人。双方很快攀谈起来。三王子见陌生人戴着一顶格外醒目的黑帽子，便问他叫什么名字，又问他为什么戴着这顶帽子。
        - id: ch01-b19
          speaker: black_thief
          text: 我叫斯隆大盗，也有人看见这顶帽子，就叫我黑帽大盗。你们三个又要到哪里去？
        - id: ch01-b20
          speaker: narrator
          text: 黑帽大盗先把自己大半生的奇遇说给王子听，又问三兄弟要往哪里去，准备做什么。王子不愿扫他的兴，便把王后的赌局、骏马和死刑从头到尾说了一遍，还承认他们虽然一直赶路，根本不知道方向对不对。
        - id: ch01-b21
          speaker: black_thief
          text: 勇敢的小伙子们，你们还不知道前面有多危险。我找那匹马整整七年了，到现在也偷不出来。它在马厩里披着丝绸罩布，上面缀着六十只铃铛。谁一靠近，它立刻就会察觉，抖动身体。铃声不但能惊醒骑士和他的卫兵，连四周乡野的人都听得见，所以谁也牵不走它。落在峡谷骑士手里的盗马人，都会被扔进烧得通红的炉子，活活煮死。
        - id: ch01-b22
          speaker: youngest_prince
          text: 我们空手回去也要掉脑袋，这可真是前后都没有活路了。
        - id: ch01-b23
          speaker: black_thief
          text: 换成我，宁可死在峡谷骑士手里，也不愿死在那个恶毒王后手里。再说，我会亲自跟你们去，也替你们指明道路。无论前面等着你们的是好运还是厄运，我都陪着你们一起承受。
    - id: ch02
      title: 铃声与火炉
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三位王子听见他愿意同行，诚心诚意地谢过这番好意。黑帽大盗对一路上的方向十分熟悉，领着他们不停赶路。没过多久，峡谷骑士的城堡便出现在远处，四个人已经能清楚望见它了。
        - id: ch02-b02
          speaker: black_thief
          text: 我们在这里等到深夜。城堡的路我都认得，只有等所有人睡熟才可能得手。骑士不设别的岗哨，那匹马就是他的守卫。
        - id: ch02-b03
          speaker: narrator
          text: 四个人一直等到夜深人静，才悄悄潜进城堡，摸向马厩。可他们还没走到跟前，骏马便发出可怕的嘶鸣，浑身猛抖，六十只铃铛同时震响。骑士和所有手下顷刻间全醒了。黑帽大盗和三位王子转身想逃，却立刻被卫兵团团围住，束手就擒。卫兵把他们押到宫殿里最阴森的地方。那里有一口永远沸腾的火炉，骑士把所有落在手里的犯人都扔进去，不消片刻便会烧得尸骨无存。
        - id: ch02-b04
          speaker: knight
          text: 好一群胆大包天的恶徒！你们竟敢来偷我的骏马，现在就看看这份愚蠢会换来什么报偿。我不会让你们一起死得痛快。为了让你们受更多折磨，我要一个接一个地煮，让暂时活着的人亲眼看着同伴怎样惨死。先煮看着最年长的王子，再依次往下。戴黑帽子的老家伙最后再煮。他像是你们的头领，看模样也经历过不少磨难。
          emotion: angry
        - id: ch02-b05
          speaker: black_thief
          text: 我也曾像这位王子一样离死不远，可我逃出来了。他也能逃过这一劫。
        - id: ch02-b06
          speaker: knight
          text: 你从没离死这么近。他再过两三分钟就没命了。
        - id: ch02-b07
          speaker: black_thief
          text: 我有一次离死只差片刻，现在不还站在这里吗？
        - id: ch02-b08
          speaker: knight
          text: 这怎么可能？我倒想听听。
        - id: ch02-b09
          speaker: black_thief
          text: 如果我的危险胜过眼前这位王子的处境，您愿意赦免他吗？
        - id: ch02-b10
          speaker: knight
          text: 我答应你。讲吧。
    - id: ch03
      title: 女巫的斧头
      blocks:
        - id: ch03-b01
          speaker: black_thief
          text: 我年轻时是个无法无天的小子，也闯过许多灾祸。有一晚，我四处游荡，天黑以后仍找不到住处。最后遇见一座废弃的烘窑，我累得走不动，便爬上窑架躺下。没过多久，三个女巫各背着一袋金子走进来。她们像要睡觉一样，把金袋分别垫在头下。一个还对同伴说，黑帽大盗要是趁她们睡着摸进来，保准一个子儿也不会留下。我这才知道，自己的名号已经挂在人人嘴边。我却屏住气，像死人一样安静。等她们沉沉睡熟，我悄悄爬下来，找了三块合适的草皮换走她们脑后的金袋，抓起金子便拼命逃跑。
        - id: ch03-b02
          speaker: black_thief
          text: 没跑多远，我看见一条灵缇、一只野兔和一只鹰追了上来。我猜那是三个女巫变的，好叫我无论走陆路还是水路，都躲不过她们的眼睛。她们的模样看着并不可怕，我好几次都想回身交战，以为凭手里的阔剑，轻易就能杀死她们。可转念一想，她们也许死后还能复活，我只得放弃交战，费力爬上一棵大树，把剑和三袋金子全带在身边。女巫追到树下，发现我的行踪，又使出邪术。一个变成铁匠的砧子，一个变成铁块，第三个拿它们很快打成一把斧头，接着砍起树来。
        - id: ch03-b03
          speaker: black_thief
          text: 一个钟头以后，大树在我身下摇晃起来，接着渐渐歪倒。我看得明白，最多再挨一两斧，树就会轰然倒地。想到这些使得出邪术的女巫马上就能取我性命，我认定自己必死无疑。可就在女巫举起斧头，要落下决定我命运的最后一击时，公鸡啼了。她们怕被人认出，只得恢复原形，转眼消失。我终于能带着三袋金子平安离开。
        - id: ch03-b04
          speaker: black_thief
          text: 骑士大人，斧头已经举起，只差一下就能要我的命，我最终还是逃了。这样的险境够不够换王子一命，请您评判。
        - id: ch03-b05
          speaker: knight
          text: 这件事确实非同寻常。我赦免第一个王子。现在把火烧旺，该煮第二个了。
        - id: ch03-b06
          speaker: black_thief
          text: 我看第二位王子这次也不会死。
        - id: ch03-b07
          speaker: knight
          text: 他怎么可能逃出去？
        - id: ch03-b08
          speaker: black_thief
          text: 我还曾用更不可思议的办法逃过一死。就算王子已经被抬到炉边，也不如我那一次凶险。我盼他也能像我一样。
        - id: ch03-b09
          speaker: knight
          text: 你还遇过一场大险？要是和刚才一样惊人，我也赦免这个年轻人。
    - id: ch04
      title: 幽暗墓穴
      blocks:
        - id: ch04-b01
          speaker: black_thief
          text: 我先前说过，过去靠的并不是什么正经营生。有一回，我的钱花得精光，又碰不上值得下手的买卖，日子十分窘迫。恰好附近死了一位富有的主教。我听说他下葬时身上戴着许多珠宝，还穿着贵重的法衣，便打算尽快把这一切据为己有。当天夜里，我来到墓地，得知主教葬在一条幽暗长墓穴的最深处。我放轻脚步，一点一点走了进去。
        - id: ch04-b02
          speaker: black_thief
          text: 没走多远，我听见急促的脚步迎面而来。我天生胆大，可想到死去的主教，又想到自己正在犯下的罪行，勇气顿时没了。我转身逃向入口，才退几步，却看见一个高大的黑衣人站在我和洞口的亮光之间。我吓得要命，又不知道怎样越过他，只好朝他开了一枪。那人应声横倒在洞口。我见他倒下以后仍是凡人的模样，才猜到他不可能是主教的鬼魂。
        - id: ch04-b03
          speaker: black_thief
          text: 我定了定神，壮着胆子走到墓穴深处，在那里发现一个大包裹。仔细一看，主教的遗体早被人洗劫，那个被我误认成鬼魂的黑衣人，只是主教手下的一名教士。我很后悔失手杀了他，可事情已经无法挽回。我拿起装着主教遗体上所有贵重物品的包裹，正要离开这个阴森地方，刚到入口，就看见守卫朝我走来。我听得清清楚楚，他们说要进墓穴查看，因为黑帽大盗若在附近，盗取尸体上的财物也算不了什么。
        - id: ch04-b04
          speaker: black_thief
          text: 我一时不知道该怎么办。那时所有人都在防着我，却也没人敢走进墓穴同我交手。我明白，只要他们瞧见我一眼，我就会像狗一样遭到枪杀。眼下不能再耽搁，我只好扶起死去的教士，让他像活人一样双脚站地，自己蹲在后面尽力托住他的身体。守卫一走近墓穴，立刻看见了黑衣人。一个人高喊那就是黑帽大盗，举枪便射。我趁着枪响放倒尸体，自己缩进入口旁一个幽暗的小角落。
        - id: ch04-b05
          speaker: black_thief
          text: 守卫见黑衣人中枪倒下，生怕墓穴里还藏着他的同伙，全都冲了进去，一直跑到最深处才停下。趁他们忙着检查尸体和墓穴，清点究竟丢失了什么东西，我悄悄从暗角溜出洞口，越跑越远。从那以后，他们再也没能把黑帽大盗抓在手里。
        - id: ch04-b06
          speaker: knight
          text: 勇敢的朋友，你确实闯过许多险境。两个故事已经救下两位王子，可最年轻的这个却要替所有人受死。若你还能讲出同样惊人的事，我也愿意饶他。我很同情他，若有办法，并不想杀死他。
        - id: ch04-b07
          speaker: black_thief
          text: 那正好。我最喜欢这位小王子，所以把最离奇的经历留到了最后。
        - id: ch04-b08
          speaker: knight
          text: 那就说来听听。
    - id: ch05
      title: 巨人的魔法戒指
      blocks:
        - id: ch05-b01
          speaker: black_thief
          text: 有一天，我在旅途中走进一片大森林，在林中转了很久，怎么也找不到出口。后来终于遇见一座大城堡。我实在疲惫难支，只好进去歇脚。里面没有仆人走动，也不见其他人影，只有一个年轻女子坐在那里，膝上抱着一个孩子，不停地哭。我见城堡里这样冷清，十分奇怪，便问她为什么哭，城堡主人又去了哪里。
        - id: ch05-b02
          speaker: young_woman
          text: 幸好主人不在家。他是个额头上只有一只眼睛的巨人，专吃人肉。他不知从哪里带来这个孩子，命我把孩子做成馅饼。我想到这件事，怎么能不哭？
          emotion: sad
        - id: ch05-b03
          speaker: black_thief
          text: 只要有安全的地方能托人照顾，我愿意把孩子送走，绝不能让怪物吃掉他。
        - id: ch05-b04
          speaker: young_woman
          text: 远处有座房子，那里的女人会照顾孩子。可是巨人要的馅饼怎么办？
        - id: ch05-b05
          speaker: black_thief
          text: 切下孩子一根手指。我去森林捉头小野猪，你把野猪当孩子做进馅饼，再把手指放在容易翻出来的地方。巨人若是起疑，看见手指就会相信。
        - id: ch05-b06
          speaker: narrator
          text: 年轻女子同意这个办法，切下孩子的一根手指。黑帽大盗照她指的方向，很快把孩子送到远处那座房子，交给人照料，又从森林里捉来一头小野猪，让女子拿它冒充孩子。女子随后做好馅饼。黑帽大盗自己也痛痛快快地吃喝了一顿。就在他准备向年轻女子告辞时，两个人忽然看见巨人穿过城堡大门，正朝他们走来。
        - id: ch05-b07
          speaker: young_woman
          text: 这下怎么办？快躲进堆放死人的屋子，脱掉衣服，躺在尸体中间。巨人就算进去，也认不出你来。
          emotion: fearful
        - id: ch05-b08
          speaker: black_thief
          text: 我听从她的劝告，脱下衣服，躺在尸体中间装死，等着看巨人会做什么。他一回来就大声索要馅饼。女子把馅饼端上去，他却赌咒说闻着分明是猪肉。女子知道手指藏在哪里，立刻把那一面翻给他看，他这才相信馅饼是孩子做的。那只馅饼没填饱他，反而让他胃口大开。我听见他磨起刀来，说还得割一两块肉吃。随后，他在尸堆里四处摸索，偏偏抓到了我，一刀割掉我半边臀肉，拿去烤着吃。
        - id: ch05-b09
          speaker: black_thief
          text: 那一刻我有多恐惧，你尽可以想象。我疼得难以忍受，却怕巨人发现我还活着，只能咬紧牙关，一声不出。巨人吃完烤肉，又喝了许多滚热的烈酒，很快连头也抬不起来，一头倒在专为自己编的大筐上，沉沉睡去。我听见他打起鼾，才忍着伤爬起来，请女子用手帕包住伤口。接着，我拿起巨人的烤肉铁签，在火中烧得通红，一下刺穿他的独眼，可惜还是没能杀死他。
        - id: ch05-b10
          speaker: black_thief
          text: 我让铁签留在他头上，拔腿就跑。巨人瞎了眼，还是追了过来。他把魔法戒指扔向我，戒指套住我的大脚趾，怎么也甩不掉。
        - id: ch05-b11
          speaker: black_thief
          text: 巨人高声问戒指在哪里。令我万分惊讶的是，那戒指竟从我的脚上出声回答。巨人顺着声音朝我猛扑过来，我幸好及时看出他的动作，才躲过这一扑。可我也明白，只要戒指还在脚上，跑得再快也救不了自己。我只好拔出长剑，砍掉被戒指套住的那根脚趾，再把脚趾和戒指一起扔进附近的大鱼池。
        - id: ch05-b12
          speaker: black_thief
          text: 巨人再次呼唤戒指。戒指受魔法驱使，仍从池水里回答。他不知道我砍掉了脚趾，还以为戒指仍在我身上，便朝声音传来的地方拼命一跃。结果他连头带脚跌进鱼池，活活淹死。骑士大人，您现在知道我闯过了多少危险，又怎样一次次逃出生天了。不过从那以后，我少了一根脚趾，走路也就一直有点跛。
        - id: ch05-b13
          speaker: old_woman
          text: 主人，我一直在旁边听着。他讲的故事千真万确，我再清楚不过。因为我就是当年住在巨人城堡里的那个女子，而您正是巨人命我做成馅饼的孩子。这位黑帽大盗就是救了您性命的人。您从小缺少一根手指，方才也听见了，那根手指正是为了欺骗巨人才切下来的。凭这一点，您就能认出自己的救命恩人。
        - id: ch05-b14
          speaker: narrator
          text: 峡谷骑士听完老妇人的话，震惊得说不出话来。他知道自己从小确实缺少一根手指。把这件事和黑帽大盗刚讲过的经历对在一起，他终于渐渐明白，那个听来难以置信的故事果然是真的。
        - id: ch05-b15
          speaker: knight
          text: 原来你就是我的救命恩人！勇敢的朋友，我不但赦免你们所有人的罪，还要请你留在这里，和我共同生活一辈子。从今以后，你会像王子一样享用盛宴。我身边有怎样周到的侍奉，你身边也一样都不会少。
          emotion: surprised
        - id: ch05-b16
          speaker: narrator
          text: 三位王子和黑帽大盗一齐跪下，向骑士道谢。黑帽大盗随后把王宫里那场赌局、王后的命令和高塔上的约定全说了出来。他说明四个人为什么非得冒险偷走铃铛骏马，也说出他们不能留在城堡、必须赶回家的苦衷。
        - id: ch05-b17
          speaker: knight
          text: 既然事情是这样，我宁愿把自己的铃铛骏马送给你们，也不能让我的救命恩人因为空手回去而送死。你们什么时候想走都可以，只要记得以后常常回来探望我。我们从前失散了这么多年，往后可得好好熟识。
        - id: ch05-b18
          speaker: narrator
          text: 他们答应以后，带着铃铛骏马，满心欢喜地动身返回王父的宫殿，黑帽大盗也和三位王子一起上路。恶毒的王后始终站在高塔上。这一天，她听见远方传来一阵又一阵铃声，立刻知道是三位王子带着骏马回来了。她又恨又恼，竟从最高的塔顶纵身跳下，摔得粉身碎骨。
        - id: ch05-b19
          speaker: narrator
          text: 老国王还在世的那些年里，三位王子一直过着幸福安乐的生活。他们没有忘记一路上同生共死的朋友，始终把黑帽大盗留在自己身边。至于老国王去世以后，三位王子和黑帽大盗又过着怎样的日子，就再也没有人知道了。这个故事收录在《爱尔兰故事集》中。
