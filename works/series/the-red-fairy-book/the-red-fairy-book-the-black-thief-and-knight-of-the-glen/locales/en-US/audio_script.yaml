  chapters:
    - id: ch01
      title: The Queen's Last Request
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a King and Queen lived in the south of Ireland with their three beautiful young sons. While the boys were still small, their mother became deathly ill. The whole court grieved, and no one could comfort the King. When the Queen knew her end was near, she called him to her bedside.
        - id: ch01-b02
          speaker: first_queen
          text: I must leave you now. You are still young, and after I die, you will surely marry again. I ask only one thing. Build a tower on an island in the sea, and keep our sons there until they are old enough to care for themselves. Then no other woman will have power over them. Give them the education their birth requires, and train them in every exercise and pastime a king's son should know. That is all. Farewell.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: With tears in his eyes, the King had only enough time to promise that every word would be obeyed. The Queen turned in her bed, smiled, and died. Never had the court or the whole kingdom known such mourning. Rich and poor alike had loved her, for no better woman could be found anywhere in the world. She was buried with all the pomp and ceremony due to a Queen. Her husband could hardly be consoled after losing her. Still, through all his grief, he remembered his promise. He had the tower built on the island and sent his three young sons to live there under the care of proper guardians.
        - id: ch01-b04
          speaker: narrator
          text: Years passed. The lords and knights of the kingdom reminded the King that he was still young. They urged him not to spend the rest of his life alone, but to take another wife. Their counsel finally prevailed. They chose a rich and beautiful princess for him, the daughter of a neighboring king, and the King became very fond of her. Before long, the new Queen gave birth to a fine son of her own. The court celebrated with such feasting and rejoicing that the first Queen and her sorrowful death were almost forgotten. For several years after that, the King and his new wife lived happily together.
    - id: ch02
      title: The Hen-Wife's Counsel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, after a long talk with the palace hen-wife, the Queen was about to leave. The hen-wife called after her and prayed that if she ever returned, she might break her neck. The Queen flew into a rage at such an insult from one of her humblest subjects. She demanded an explanation and threatened to have the woman put to death.
        - id: ch02-b02
          speaker: hen_wife
          text: The reason concerns you greatly, madam, and you ought to pay me well for it.
        - id: ch02-b03
          speaker: second_queen
          text: What payment do you want?
        - id: ch02-b04
          speaker: hen_wife
          text: Fill a whole pack with wool for me. Fill my old crock with butter, and fill one barrel with wheat.
        - id: ch02-b05
          speaker: second_queen
          text: How much wool will the pack hold?
        - id: ch02-b06
          speaker: hen_wife
          text: Seven herds of sheep, along with all their increase for seven years.
        - id: ch02-b07
          speaker: second_queen
          text: And the crock? How much butter will that take?
        - id: ch02-b08
          speaker: hen_wife
          text: The yield of seven dairies, with their increase for seven years.
        - id: ch02-b09
          speaker: second_queen
          text: Then how much wheat must go into your barrel?
        - id: ch02-b10
          speaker: hen_wife
          text: The increase from seven barrels of wheat over seven years.
        - id: ch02-b11
          speaker: second_queen
          text: That is an enormous price. Still, your reason must be extraordinary. Before I need it, I will give you everything you ask.
        - id: ch02-b12
          speaker: hen_wife
          text: Then hear it. You have been too foolish to notice what is happening around you, though it may bring great danger and harm to both you and your child. Your husband has three fine sons by his first Queen, and all this time he has kept them shut away in a tower until they come of age. When they are grown, he means to divide the kingdom among those three brothers and send your own son out to seek whatever fortune he can find for himself. Unless you discover some way to destroy those princes first, your child may be left desolate in the end, and the same fate may come upon you.
        - id: ch02-b13
          speaker: second_queen
          text: What do you advise? I have no idea how to act.
        - id: ch02-b14
          speaker: hen_wife
          text: Tell the King that you have heard about his sons and are greatly surprised that he concealed them from you for so long. Say that you long to see them, that they have spent enough time shut away, and that you want him to bring them to court. The King will do it. Their arrival will be celebrated with a great feast, followed by every kind of sport and amusement for the people. When the games begin, challenge all three princes to play cards with you. They will not refuse. Before the whole assembly, make them agree that if you win, they must do whatever you command, while if they win, you must obey whatever command they give you. Here is the pack you must use. I do not think these cards will let you lose.
        - id: ch02-b15
          speaker: narrator
          text: The Queen took the cards at once and thanked the hen-wife for her helpful counsel. When she returned to the palace, she was too uneasy to rest until she could speak to the King about his children. At last she found her chance. She raised the matter in such a polite and charming way that he could see no malice or secret design in it. He readily granted her wish and sent for his sons at the island tower. The princes came gladly, delighted to be released after so many years of confinement. All three had grown into handsome young men. Their guardians had made them expert in every art, sport, and exercise expected of princes, and everyone who saw them soon gave them love and respect.
    - id: ch03
      title: The Game of Cards
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Seeing how quickly the princes won everyone's love only made the Queen more jealous than before. The days of feasting and rejoicing seemed endless to her. She could hardly wait for them to finish so she could make her proposal and trust her success to the strange power of the hen-wife's cards. At last the royal company turned from feasting to sports and games of every kind. The Queen chose her moment carefully, challenged all three princes to play cards with her, and announced the bargain exactly as the hen-wife had instructed.
        - id: ch03-b02
          speaker: narrator
          text: The princes accepted. The eldest sat down for the first game, and the Queen won it. The second brother played next, and once again her cards brought her victory. Then the youngest prince faced her in the last game, but this time the prince won. The Queen was deeply grieved that she had failed to bring him under her power as well. Of the three brothers, he was by far the handsomest and the best loved, and now the bargain had placed him beyond her command.
        - id: ch03-b03
          speaker: narrator
          text: Everyone waited eagerly to hear what she would demand of the other two. No one suspected that she meant them harm. Whether the hen-wife had chosen the task or the Queen knew of it herself, the tale does not say.
        - id: ch03-b04
          speaker: second_queen
          text: You must bring me the Knight of the Glen's wild Steed of Bells. If you return without it, you will lose your heads.
        - id: ch03-b05
          speaker: narrator
          text: The two princes showed no concern because they had no idea what such a task meant. The rest of the court was horrified. Everyone there knew that taking the wild steed was considered impossible. Every person who had ever gone in search of him had perished in the attempt. But the bargain had been spoken before the whole assembly, so the brothers could not take it back or refuse the Queen's command. Then the company turned to the youngest prince, who had won his game, and asked what demand he wished to make upon the Queen.
        - id: ch03-b06
          speaker: youngest_prince
          text: My brothers must set out on a dangerous journey without knowing the road or what may befall them. I will not stay behind. Whatever happens, I am going with them. By our bargain, I command the Queen to stand on the palace's highest tower until we return, or until there is certain news that we are dead. She may have only sheaf corn to eat and cold water to drink, even if she must remain there seven years or longer.
        - id: ch03-b07
          speaker: narrator
          text: With everything settled, all three princes left the court to search for the Knight of the Glen's castle.
    - id: ch04
      title: The Steed of Bells
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The brothers traveled together along the road until they caught up with a stranger. He was somewhat advanced in years and walked with a slight limp. A remarkable black cap covered his head. The princes soon fell into conversation with him, and after they had talked awhile, the youngest brother asked who he was and why he wore so unusual a cap.
        - id: ch04-b02
          speaker: black_thief
          text: They call me the Thief of Sloan. Some call me the Black Thief because of this cap.
        - id: ch04-b03
          speaker: narrator
          text: After telling the prince about many of his adventures, the stranger asked where the brothers were going. The youngest prince told him their whole story.
        - id: ch04-b04
          speaker: youngest_prince
          text: So now we are traveling on, though we do not even know whether this is the right road.
        - id: ch04-b05
          speaker: black_thief
          text: Ah, brave fellows, you have no idea what danger lies ahead. I have tried to steal that steed for seven years. He wears a silk covering hung with sixty bells. The moment anyone comes near, he knows it and shakes himself. Those bells rouse the prince, his guards, and the whole countryside. Anyone the Knight of the Glen catches is boiled in a red-hot furnace.
        - id: ch04-b06
          speaker: youngest_prince
          text: Then what can we do? If we go home without the steed, we lose our heads. Death waits for us either way.
        - id: ch04-b07
          speaker: black_thief
          text: In your place, I would rather die by the Knight's hand than by that wicked Queen's. I will go with you and show you the road. Whatever fortune meets you, I will share it.
        - id: ch04-b08
          speaker: narrator
          text: The princes thanked him sincerely. He knew the road well and soon brought them within sight of the Knight's castle.
        - id: ch04-b09
          speaker: black_thief
          text: We must wait here for night. I know every way into this place, and our only chance will come when everyone is asleep. The steed himself is the only watchman the Knight needs.
        - id: ch04-b10
          speaker: narrator
          text: In the dead of night, the three princes and the Black Thief crept toward the stable. Before they reached it, the steed gave a terrible neigh and shook his body. Sixty bells rang so loudly that the Knight and all his men sprang up at once.
        - id: ch04-b11
          speaker: narrator
          text: The Black Thief and the King's sons turned to flee, but before they could escape, the Knight's guards closed around them on every side. All four were seized and taken prisoner. The guards dragged them into a dismal part of the palace where the Knight always kept a furnace burning and boiling. This was where he punished every offender who fell into his hands. Anyone thrown inside that red-hot furnace would be entirely consumed in only a few moments.
        - id: ch04-b12
          speaker: knight
          text: You brazen villains! How dare you try to steal my steed? Now you will earn the reward of your folly. I will not boil you together. You will go in one at a time, so each survivor can watch his companions suffer.
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: He ordered his servants to build up the fire.
        - id: ch04-b14
          speaker: knight
          text: Boil the eldest-looking young man first, then the next, and leave that old champion in the black cap until last. He looks like their captain, and like a man who has survived many hardships.
        - id: ch04-b15
          speaker: black_thief
          text: Once, I came as close to death as that prince is now, and I escaped. He may escape too.
        - id: ch04-b16
          speaker: knight
          text: Never. That prince is only two or three minutes from his end.
        - id: ch04-b17
          speaker: black_thief
          text: I was only one moment from mine, yet here I stand.
        - id: ch04-b18
          speaker: knight
          text: How did that happen? It seems impossible, and I would like to hear it.
        - id: ch04-b19
          speaker: black_thief
          text: If my danger was greater than this young man's, will you pardon him?
        - id: ch04-b20
          speaker: knight
          text: I will. Tell your story.
    - id: ch05
      title: One Blow from Death
      blocks:
        - id: ch05-b01
          speaker: black_thief
          text: I was a very wild boy in my youth, sir, and my wandering ways carried me through many troubles. One night in particular, darkness overtook me on the road. I searched everywhere but could find neither a house nor any other place where I might ask for lodging. At last I came upon an old kiln standing empty. By then I was so tired that I climbed to the top, stretched myself across the kiln's ribs, and settled there to spend the night.
        - id: ch05-b02
          speaker: black_thief
          text: I had not been lying there for long when three witches entered below me, each carrying a bag of gold. They meant to sleep in the kiln, and each witch placed her own heavy bag beneath her head for a pillow. As they talked, I heard one warn the others that if the Black Thief happened upon them in their sleep, he would not leave so much as a penny behind. From that conversation, I learned that my name was already in everyone's mouth. I made no answer and no movement. While they talked beneath me, I stayed as silent as death.
        - id: ch05-b03
          speaker: black_thief
          text: When they were sound asleep, I crept down. I found three pieces of turf and gently slipped one beneath each witch's head in place of her gold. Then I took the bags and ran as fast as I could.
        - id: ch05-b04
          speaker: black_thief
          text: Soon a greyhound, a hare, and a hawk came after me. I guessed the witches had changed their shapes so they could hunt me over land or water. More than once, I thought of fighting them with my broadsword. But if their magic could bring them back to life, fighting would do no good. I struggled up a tree with my sword and all three bags.
        - id: ch05-b05
          speaker: black_thief
          text: They followed my trail and found me in the tree. Then they used more of their wicked magic. One witch changed herself into a smith's anvil. The second became a bar of iron, and the third took that iron and forged it into a hatchet. As soon as the tool was ready, she attacked the trunk. She chopped without stopping, and within an hour the whole tree began shaking beneath me. At last it bent so far that one blow, or two at most, would bring it crashing down. After seeing what their magic could do, I knew that once they reached me, those witches would soon put an end to my life.
        - id: ch05-b06
          speaker: black_thief
          text: I watched the witch draw back the hatchet for the very stroke that would decide my fate. At that exact moment, a cock crowed. Morning had come. The witches were afraid someone might recognize them, so they resumed their natural shapes and disappeared. The fatal blow never fell, and I climbed down and got safely away with all three bags of gold. So, sir Knight, I stood within one blow of my end. The hatchet was already raised to strike, yet I escaped after all. I leave it to you to decide whether that danger was as great as any you have heard.
        - id: ch05-b07
          speaker: knight
          text: I admit that was extraordinary. For its sake, I pardon this young man. Now stir up the fire. It is time to boil the second.
        - id: ch05-b08
          speaker: black_thief
          text: I would like to think he will escape death this time too.
        - id: ch05-b09
          speaker: knight
          text: How could he? Escape is impossible now.
        - id: ch05-b10
          speaker: black_thief
          text: I once escaped death in a way even more remarkable than his escape from this furnace would be. I hope he has the same good fortune.
        - id: ch05-b11
          speaker: knight
          text: You have faced another great danger? Tell me that story as well. If it is as wonderful as the first, I will pardon this prince too.
    - id: ch06
      title: The Bishop's Vault
      blocks:
        - id: ch06-b01
          speaker: black_thief
          text: As I told you, sir, I did not live honestly. Once, when my money was gone and no worthwhile enterprise appeared, I became desperate. Then a rich bishop died nearby. People said he had been buried in costly robes and jewels, and I decided to make them mine.
        - id: ch06-b02
          speaker: black_thief
          text: That very night, I set out to take the bishop's treasure. At the burial place, I learned that his body had been laid at the far end of a long, dark vault. I entered carefully and moved forward one slow step at a time. I had not gone far when I heard the sound of a foot approaching at a quick pace. By nature I was bold and daring, but there in the darkness, I began thinking of the dead bishop and of the wicked crime that had brought me to his tomb. My courage deserted me. I turned at once and ran back toward the entrance.
        - id: ch06-b03
          speaker: black_thief
          text: After only a few steps, I saw a tall figure dressed in black standing between me and the light. I could not see how to pass him. In my fear, I fired my pistol, and he fell across the doorway. He still looked like an ordinary mortal, so I began to doubt he was the bishop's ghost.
        - id: ch06-b04
          speaker: black_thief
          text: I gathered my courage and went to the far end of the vault. There I found a large bundle. Someone had already robbed the bishop, and the supposed ghost was merely one of his own clergy. I was sorry I had killed the man, but nothing could undo it. I picked up the bundle containing everything valuable from the corpse and started to leave that dreadful place.
        - id: ch06-b05
          speaker: black_thief
          text: Just as I reached the mouth of the vault, I saw the guards coming toward me. I heard them clearly say that they meant to search the place, because if the Black Thief was anywhere nearby, he would think nothing of robbing the bishop's corpse. I had no idea what to do. Everyone in that country was watching for me, and the first person who caught sight of me would shoot me like a dog. Yet none of those guards was bold enough to enter alone and face me. I understood all that in a moment, but I had no time to waste.
        - id: ch06-b06
          speaker: black_thief
          text: I lifted the dead clergyman upright and crouched behind him, holding him on his feet. When the guards came close, they saw the man in black. One shouted that he was the Black Thief and fired. I let the body fall and slipped into a dark corner beside the entrance.
        - id: ch06-b07
          speaker: black_thief
          text: When the guards saw the black-clad figure fall, they all rushed past me into the vault. They did not stop until they reached the far end, perhaps because they feared other thieves were hiding with the man they believed they had killed. They crowded around the corpse and searched the chamber to discover what had been stolen. While every one of them was busy inside, I slipped out of my little corner, passed through the unguarded entrance, and ran. Once I was away, I kept going, and they have never had the Black Thief in their power from that day to this.
        - id: ch06-b08
          speaker: knight
          text: Brave fellow, you have survived many dangers. Your stories have freed two princes. Yet I am sorry that this youngest one must suffer for them all. If you can tell me one more tale as wonderful as the others, I will pardon him too. I pity the youth and would spare him if I could.
        - id: ch06-b09
          speaker: black_thief
          text: That suits me well. I like him best myself, so I saved my strangest adventure for his sake.
        - id: ch06-b10
          speaker: knight
          text: Then let us hear it.
    - id: ch07
      title: The One-Eyed Giant
      blocks:
        - id: ch07-b01
          speaker: black_thief
          text: One day, while I was traveling, I entered a great forest and lost my way. For a long time I wandered beneath the trees, trying every path I found, but I could discover no road that led me out. At last I came upon a large castle hidden in the forest. I was worn out from my wandering, so I went inside to ask for shelter. There I found a young woman sitting alone with a child on her knee, and she was crying. I asked what had made her weep. I also asked where the lord of such a great castle could be, for I had seen no servants, heard no voices, and noticed no other person moving anywhere in the place.
        - id: ch07-b02
          speaker: young_woman
          text: You are fortunate that he is away. The lord is a monstrous giant with one eye in the middle of his forehead, and he eats human flesh. He brought me this child from somewhere and ordered me to bake it in a pie. How could I help crying?
          emotion: sad
        - id: ch07-b03
          speaker: black_thief
          text: If you know a safe place where I can leave the child, I will take it there. I would rather do that than let such a monster kill it.
        - id: ch07-b04
          speaker: narrator
          text: The woman told him of a distant house where someone would care for the child.
        - id: ch07-b05
          speaker: young_woman
          text: But what am I to do about the pie?
        - id: ch07-b06
          speaker: black_thief
          text: Cut one finger from the child. I will catch a young wild pig in the forest, and you can bake that in the pie instead. Put the finger where you can turn it up quickly. If the giant suspects anything, show it to him, and he will believe he is eating the child.
        - id: ch07-b07
          speaker: black_thief
          text: The woman agreed to my plan. She cut one finger from the child, and following her directions, I carried the little one through the forest to the house she had named. There I found the woman who would keep the child safe. Then I hunted down a young wild pig and brought it back to the castle in the child's place. The woman made the pie just as we had arranged and kept the finger ready to show. With the child beyond the giant's reach and the trick prepared, I ate and drank heartily myself. I had just risen to say goodbye when we looked toward the gates and saw the giant coming into the castle.
        - id: ch07-b08
          speaker: young_woman
          text: What will you do now? Hurry into that room and lie among the dead bodies. Take off your clothes, so if he goes inside, he cannot tell you from the others.
          emotion: fearful
        - id: ch07-b09
          speaker: black_thief
          text: I followed her advice and lay as still as a corpse among the dead. The first thing I heard was the giant shouting for his pie. When the woman set it before him, he swore it smelled like pork. She knew where she had placed the finger, so she turned it up at once. That convinced him the pie was truly made from the child.
        - id: ch07-b10
          speaker: black_thief
          text: The pie only sharpened his hunger. I heard him whetting his knife and saying he needed another slice or two of flesh. Then he came feeling among the bodies. He chose me and cut half the flesh from my hip to roast. The pain was terrible, but fear of being killed kept me silent.
        - id: ch07-b11
          speaker: black_thief
          text: After the giant had eaten everything, he began drinking great quantities of hot liquor. In a short while, he could no longer hold up his head. He threw himself onto a large basket he had made for that purpose and fell fast asleep. I waited among the bodies until I heard him snoring. Then, wounded as I was, I rose and went to the woman. She bound the terrible cut in my hip with a handkerchief. I took the giant's own spit, heated it in the fire until it glowed red, and drove it straight through the one eye in his forehead. Even that was not enough to kill him.
        - id: ch07-b12
          speaker: black_thief
          text: I left the spit sticking in his head and ran for my life. Though I had blinded him, I soon discovered that he was following close behind. The giant owned an enchanted ring, and he hurled it after me. It struck my big toe, closed around it, and would not come loose. The giant called to the ring and demanded to know where it was. To my amazement, the ring answered him from my own foot. Guided by that voice, the blind giant made a great leap to seize me. By good fortune, I saw him coming and sprang clear of the danger.
        - id: ch07-b13
          speaker: black_thief
          text: Running could never save me while that ring kept telling him where I was. I drew my sword and cut off the toe around which it was fastened. Then I threw the severed toe and the ring together into a large fishpond close by. The giant called to his ring again, and by its enchantment, it answered him from the water. He did not know what I had done. Believing the ring was still fixed to my body, he gathered all his strength and made one violent leap to catch me. Instead, he plunged over his head and ears into the deep pond, and there he drowned.
        - id: ch07-b14
          speaker: black_thief
          text: So, sir Knight, you have heard the dangers I survived. And from that day onward, I have limped because I lost my toe.
    - id: ch08
      title: The Knight's Deliverer
      blocks:
        - id: ch08-b01
          speaker: old_woman
          text: My lord and master, every word of that story is true. I know because I am the woman who lived in the giant's castle. And you, my lord, are the child I was ordered to bake in the pie. This is the man who saved your life. You can prove it by the finger you have lacked since childhood, the very finger we used to deceive the giant.
        - id: ch08-b02
          speaker: narrator
          text: The Knight of the Glen stared at her in astonishment. He had indeed been missing a finger since childhood, and now he understood that the Black Thief's tale was true.
        - id: ch08-b03
          speaker: knight
          text: Is this truly the man who delivered me? Brave fellow, I pardon every one of you. More than that, you may stay with me for the rest of your life, feast like a prince, and receive every comfort that I have myself.
          emotion: surprised
        - id: ch08-b04
          speaker: narrator
          text: All four prisoners knelt and thanked him. Then the Black Thief explained why they had tried to steal the Steed of Bells and why the princes had to return home.
        - id: ch08-b05
          speaker: knight
          text: If that is your trouble, I give you my steed rather than let this brave man die. Leave whenever you please. Only come back to see me soon and often, so we may come to know each other well.
        - id: ch08-b06
          speaker: narrator
          text: They promised they would. Then the three princes set out joyfully for their father's palace, with the Black Thief beside them and the Steed of Bells carrying them home.
        - id: ch08-b07
          speaker: narrator
          text: All this time, the wicked Queen had stood on the tower. When she heard the bells ringing far away, she knew the princes were returning with the steed. In spite and fury, she threw herself from the tower and was shattered to pieces.
        - id: ch08-b08
          speaker: narrator
          text: The three princes lived happily through their father's reign, and they always kept the Black Thief with them. What happened after the old King's death is not known.
