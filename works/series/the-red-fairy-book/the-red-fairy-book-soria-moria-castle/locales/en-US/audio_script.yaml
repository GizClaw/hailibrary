  chapters:
    - id: ch01
      title: The Strange Coast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a couple whose son was named Halvor. From the time he was small, Halvor wanted nothing to do with work. He sat in the ashes by the chimney and poked around all day. His parents sent him out to learn one trade after another, but each time he stayed only two or three days. Then he ran away from his master, hurried home, and went straight back to the ashes.
        - id: ch01-b02
          speaker: narrator
          text: One day a sea captain came by and asked whether Halvor would like to sail with him and see foreign lands. That suited Halvor very well, and he was ready in no time.
        - id: ch01-b03
          speaker: narrator
          text: No one could say how long they sailed. After a long, long while, a terrible storm swept them far off course. When the storm passed and the sea grew calm again, they found themselves beside a strange coast. Not one of the sailors knew where they were. There was no wind at all, so the ship lay still on the water. Halvor asked the captain for permission to go ashore and look around. He would much rather explore than stay aboard and sleep.
        - id: ch01-b04
          speaker: sea_captain
          text: Do you really mean to let people see you dressed like that? Those rags are all you have!
        - id: ch01-b05
          speaker: narrator
          text: Halvor kept asking until the captain gave him leave. He was told to return the moment the wind rose.
        - id: ch01-b06
          speaker: narrator
          text: Ashore lay a beautiful country. Everywhere Halvor went, he found broad plains, green fields, and meadows, but he saw no people at all. Before long, the wind began to rise. Halvor knew he ought to return, yet he felt he had not seen nearly enough. He decided to walk a little farther and see whether he could meet someone. After a while he reached a great highway, so smooth that an egg could roll along it without breaking.
        - id: ch01-b07
          speaker: narrator
          text: Halvor followed the highway until evening drew near. Far in the distance, he saw lights shining from a huge castle. He had been walking the whole day and had brought nothing to eat, so by then he was terribly hungry. Even so, each step toward the castle made him a little more afraid.
        - id: ch01-b08
          speaker: narrator
          text: A fire was burning inside the castle. Halvor stepped into the kitchen and stared around him. It was more magnificent than any kitchen he had ever seen, with vessels of gold and silver on every side. Yet not one human being was there. He stood waiting for some time, but no one came out to meet him. At last he went farther in, opened a door, and found a princess sitting at her spinning wheel.
        - id: ch01-b09
          speaker: eldest_princess
          text: Oh! Can a Christian man truly have come here? You must leave at once, or the Troll will eat you. He lives here, and he has three heads.
          emotion: surprised
        - id: ch01-b10
          speaker: halvor
          text: He could have four more heads and I'd still be glad to see him. I won't leave when I've done no harm. But you must give me something to eat, because I'm starving.
        - id: ch01-b11
          speaker: narrator
          text: When Halvor had eaten all he wanted, the princess asked him to try the sword hanging on the wall. He could not swing it. He could not even lift it.
        - id: ch01-b12
          speaker: eldest_princess
          text: Then drink from the bottle beside it. That is what the Troll does whenever he goes out with the sword.
        - id: ch01-b13
          speaker: narrator
          text: Halvor took one drink from the bottle. In a moment, he could swing the great sword about with perfect ease. Now, he thought, it was high time for the Troll to show himself. At that very moment, the creature came panting toward the castle. Halvor slipped behind the door and waited there.
        - id: ch01-b14
          speaker: three_headed_troll
          text: Hutetu! It smells as though Christian blood is in here!
        - id: ch01-b15
          speaker: halvor
          text: Yes, and now you'll find out that it is!
        - id: ch01-b16
          speaker: narrator
          text: With that, Halvor cut off all three heads. The princess was so happy to be free that she danced and sang. Then she remembered her sisters.
        - id: ch01-b17
          speaker: eldest_princess
          text: If only my sisters could be free as well!
        - id: ch01-b18
          speaker: halvor
          text: Where are they?
        - id: ch01-b19
          speaker: narrator
          text: She told him that one sister had been carried to a Troll's castle six miles away. The other was held in another castle nine miles beyond that.
        - id: ch01-b20
          speaker: eldest_princess
          text: First, you must help me take this dead body away.
        - id: ch01-b21
          speaker: narrator
          text: Halvor's new strength made quick work of the heavy body. He carried everything away and soon had the castle clean and tidy again. Then he and the princess sat down together. They ate and drank, and for that night they were happy.
    - id: ch02
      title: The Second Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the gray light of dawn, Halvor set out for the second castle. He gave himself no rest along the way. For the whole long day, he either walked or ran. When the castle finally came into view, he felt a little fear again. It was much more splendid than the first one, but here too there was not a human being in sight. Halvor entered the kitchen. This time he did not linger there, but went straight on into the castle.
        - id: ch02-b02
          speaker: second_princess
          text: Oh! Has a Christian man dared to come here? I can't remember how long I've been here, and in all that time I haven't seen one. You had better leave now. The Troll who lives here has six heads.
          emotion: surprised
        - id: ch02-b03
          speaker: halvor
          text: No, I won't go. He could have six more heads and I still wouldn't leave.
        - id: ch02-b04
          speaker: second_princess
          text: He'll swallow you alive!
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: Nothing she said could move him. Halvor wanted food and drink after his long journey, so the princess gave him as much as he wished. Then she tried once more to send him away.
        - id: ch02-b06
          speaker: halvor
          text: I won't go. I've done nothing wrong, so I have no reason to be afraid.
        - id: ch02-b07
          speaker: second_princess
          text: The Troll won't stop to ask whether you've done wrong. He'll take you without right or permission. But if you refuse to leave, see whether you can swing the sword he uses in battle.
        - id: ch02-b08
          speaker: narrator
          text: Halvor could not move the sword. The princess told him to drink from the flask hanging beside it. Once he had taken a drink, he could wield the blade.
        - id: ch02-b09
          speaker: narrator
          text: Soon the Troll arrived. He was so broad and heavy that he had to turn sideways to squeeze through the doorway. As soon as his first head came inside, he roared.
        - id: ch02-b10
          speaker: six_headed_troll
          text: Hutetu! I smell Christian blood in here!
        - id: ch02-b11
          speaker: narrator
          text: Halvor cut off the first head, and then the next, until all six were gone. The princess was overjoyed to be free. Then she remembered her sisters and wished that they could be rescued too. Halvor thought he could manage that and wanted to set out immediately. First, though, he had to help the princess carry away the Troll's great body. The work took the rest of the night, so morning had come before Halvor could start again.
    - id: ch03
      title: The Nine-Headed Troll
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The last castle stood a long way off. Halvor walked when he had to and ran whenever he could, hoping to reach it in time. Late that evening he caught sight of it at last. It was far more magnificent than either of the other castles. This time Halvor did not feel the least bit afraid. He entered the kitchen and passed straight through into the castle.
        - id: ch03-b02
          speaker: narrator
          text: There sat a princess more beautiful than anyone he had ever seen. Like her sisters, she wondered that a Christian man had come there. She begged him to leave before the Troll swallowed him alive, and warned him that this Troll had nine heads.
        - id: ch03-b03
          speaker: halvor
          text: He could have nine heads, and nine more, and another nine after that. I still wouldn't go.
        - id: ch03-b04
          speaker: narrator
          text: Halvor went to stand beside the stove. The princess pleaded sweetly with him to escape before he was eaten.
        - id: ch03-b05
          speaker: halvor
          text: Let him come whenever he likes.
        - id: ch03-b06
          speaker: narrator
          text: She gave Halvor the Troll's sword and told him to drink from the flask so that he could wield it. Just then the Troll came breathing hard. He was much bigger and heavier than the other two, and he too had to enter the doorway sideways.
        - id: ch03-b07
          speaker: nine_headed_troll
          text: Hutetu! What a smell of Christian blood there is in here!
        - id: ch03-b08
          speaker: narrator
          text: Halvor struck off the first head. Then he cut off the second and kept fighting until eight of the nine were gone. The last head was tougher than all the others. Never in his life had Halvor worked so hard as he did to cut it off. Still, he believed there was enough strength left in him. He raised the sword again, and at last the final head fell.
        - id: ch03-b09
          speaker: narrator
          text: Now the other two princesses came to the youngest sister's castle. The three were together again at last, and they were happier than they had ever been in their lives. All the sisters delighted in Halvor, and he delighted in them. They told him he could choose whichever princess he liked best. Of the three, though, it was the youngest who loved him most.
        - id: ch03-b10
          speaker: narrator
          text: Before long, Halvor became quiet, sorrowful, and strange. The sisters asked what he longed for and whether he disliked living with them.
        - id: ch03-b11
          speaker: halvor
          text: I do like being here. We have all we need, and I'm very comfortable. But my father and mother are still alive, and I long to see them again.
        - id: ch03-b12
          speaker: narrator
          text: The princesses thought that could easily be arranged.
        - id: ch03-b13
          speakers: [eldest_princess, second_princess, youngest_princess]
          ensemble: chorus
          text: Follow our advice, and you'll go home and return in perfect safety.
        - id: ch03-b14
          speaker: halvor
          text: I won't do anything you don't want me to do.
        - id: ch03-b15
          speaker: narrator
          text: The sisters dressed Halvor in such splendid clothes that he looked like a king's son. Then they placed a ring on his finger. It was a wishing ring, and with it he could travel home and return to them again. But they warned him to guard it carefully. He must never throw the ring away, and he must never speak the princesses' names. If he broke either rule, all his magnificence would come to an end, and he would never see the sisters again.
        - id: ch03-b16
          speaker: halvor
          text: If only I were home again, or home were here!
        - id: ch03-b17
          speaker: narrator
          text: The wish was granted at once. Before Halvor understood what had happened, he stood outside his parents' cottage.
    - id: ch04
      title: Halvor Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Night was falling. When Halvor's father and mother saw such a grand and stately stranger enter, they were so startled that they bowed and curtsied to him. Halvor asked whether he might lodge there for the night.
        - id: ch04-b02
          speakers: [father, mother]
          ensemble: duo
          text: No, sir, we can't give you the things a great lord would need. Please go up to the farm. It isn't far, and they have plenty of everything.
        - id: ch04-b03
          speaker: narrator
          text: Halvor insisted on staying, but the old couple kept telling him to go to the farm. There he could have food and drink. They did not even own a chair fit to offer him.
        - id: ch04-b04
          speaker: halvor
          text: No. I won't go there until tomorrow morning. Let me spend tonight here. I can sit on the hearth.
        - id: ch04-b05
          speaker: narrator
          text: They could say nothing against that. Halvor settled on the hearth and began poking through the ashes. He looked just as he had in the old days, when he lay there idling his time away. The three of them talked for a long while about one thing and another. At last Halvor asked the old couple whether they had ever had a child of their own.
        - id: ch04-b06
          speakers: [father, mother]
          ensemble: duo
          text: Yes. We had a boy named Halvor, but we don't know where he went. We can't even tell whether he's alive or dead.
          emotion: sad
        - id: ch04-b07
          speaker: halvor
          text: Could I be that boy?
        - id: ch04-b08
          speaker: mother
          text: I'd know him well enough. Our Halvor was so lazy that he never did a thing. His clothes were all rags, with one hole running into the next. That boy could never have become a gentleman like you, sir.
        - id: ch04-b09
          speaker: narrator
          text: A little later, the old woman went to stir the fire. Its light fell across Halvor just as it used to when he sat among the ashes. In that glow, she knew him.
        - id: ch04-b10
          speaker: mother
          text: Good heavens! Halvor, is it really you?
          emotion: surprised
        - id: ch04-b11
          speaker: narrator
          text: Joy came over his parents without any limit. Now Halvor had to sit with them and tell the whole story of everything that had happened since he went away. His mother was so delighted and proud that she wanted to take him straight to the farm. She meant to show him to the girls who had once looked down on him. The old woman hurried there first to announce him, and Halvor followed behind her.
        - id: ch04-b12
          speaker: mother
          text: Halvor has come home! Just wait until you see how grand he looks. He's like a prince!
          emotion: happy
        - id: ch04-b13
          speakers: [farm_girl_1, farm_girl_2, farm_girl_3]
          ensemble: chorus
          text: We'll see the same ragged fellow he always was.
        - id: ch04-b14
          speaker: narrator
          text: The girls tossed their heads as they answered. At that very moment, Halvor walked into the room. They were so astonished that they left their dresses lying in the chimney corner and ran away wearing nothing but their petticoats. When they came back again, their faces were full of shame. They hardly dared to look at Halvor, whom they had always treated with such pride and scorn before.
        - id: ch04-b15
          speaker: halvor
          text: Ah, you've always thought you were so pretty and fine that no one could compare with you. You should see the eldest princess I freed. Beside her, you look like herders. The second is prettier still. But the youngest, my sweetheart, is more beautiful than the sun or moon. I wish they were here. Then you would see them for yourselves.
        - id: ch04-b16
          speaker: narrator
          text: The words were scarcely out of his mouth when all three princesses stood beside him. Then Halvor remembered their warning, and sorrow came over him.
        - id: ch04-b17
          speaker: narrator
          text: The farm prepared a great feast and treated the princesses with honor, but the sisters would not remain there.
        - id: ch04-b18
          speakers: [eldest_princess, second_princess, youngest_princess]
          ensemble: chorus
          text: We want to visit your parents. Come outside with us first, and we'll look around.
        - id: ch04-b19
          speaker: narrator
          text: Halvor followed the princesses out of the farmhouse. They came to a large pond nearby, with a pretty green bank close beside the water. The sisters chose that spot and said they would sit there for an hour. It would be pleasant, they told him, to rest on the grass and look out across the pond.
        - id: ch04-b20
          speaker: youngest_princess
          text: Halvor, let me comb your hair for a little while.
        - id: ch04-b21
          speaker: narrator
          text: Halvor rested his head in her lap while she combed. Soon he fell asleep. The youngest princess took her ring from his finger and put another in its place. Then she spoke to her sisters.
        - id: ch04-b22
          speaker: youngest_princess
          text: Hold on to me while I hold on to you. I wish we were at Soria Moria Castle.
        - id: ch04-b23
          speaker: narrator
          text: When Halvor woke, the princesses were gone.
    - id: ch05
      title: The Search Begins
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Halvor wept and mourned. He was so miserable that no one could comfort him. His father and mother begged him to stay, but he said farewell and left them.
        - id: ch05-b02
          speaker: halvor
          text: You'll never see me again. If I can't find the princess, life isn't worth living.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: Halvor once more had three hundred dollars. He put the money in his pocket and set off. After he had walked some distance, he met a man leading a fairly good horse. Halvor wanted the animal and began to bargain.
        - id: ch05-b04
          speaker: horse_seller
          text: I hadn't exactly planned to sell him. Still, if we can agree on a price, perhaps I will.
        - id: ch05-b05
          speaker: narrator
          text: Halvor asked what the man wanted for the horse.
        - id: ch05-b06
          speaker: horse_seller
          text: I didn't pay much, and he isn't worth much either. He's a fine riding horse, but he can't pull a thing. If you walk part of the way and ride part, he can always carry you and your food bag.
        - id: ch05-b07
          speaker: narrator
          text: At last the two men settled on a price. Halvor laid his bag of provisions across the horse and continued on his way, sometimes walking beside it and sometimes riding. That evening he came to a green field where a great tree stood alone. He sat down beneath its branches. Before sleeping, he took the food bag from the horse and let the animal loose to graze.
        - id: ch05-b08
          speaker: narrator
          text: At daybreak Halvor was moving again, for he felt he could not spare any time for rest. All day he walked and rode through a vast wood. Here and there, green clearings gleamed prettily between the trees. Halvor had no idea where he was or which way he ought to go. He never stayed anywhere longer than it took for the horse to crop a little grass while he took some food from his bag.
        - id: ch05-b09
          speaker: narrator
          text: The forest seemed as if it would never end. On the second evening, a light shone through the trees.
        - id: ch05-b10
          speaker: halvor
          text: If people live up there, perhaps I can warm myself and get something to eat.
        - id: ch05-b11
          speaker: narrator
          text: The light came from a miserable little cottage. Through one small pane, Halvor saw two very old people with hair as gray as a pigeon. The old woman's nose was so long that she sat by the chimney and stirred the fire with it.
        - id: ch05-b12
          speaker: old_woman
          text: Good evening, good evening! What could bring you here? No Christian person has passed this way for more than a hundred years.
          emotion: surprised
        - id: ch05-b13
          speaker: narrator
          text: Halvor told her he was trying to reach Soria Moria Castle and asked whether she knew the way.
        - id: ch05-b14
          speaker: old_woman
          text: No, I don't. But the Moon will be here soon, and I'll ask her. She shines on everything, so she should know.
    - id: ch06
      title: The Moon and the West Wind
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the Moon stood clear and bright over the treetops, the old woman went outside and called up to her.
        - id: ch06-b02
          speaker: old_woman
          text: Moon! Moon! Can you tell me the way to Soria Moria Castle?
        - id: ch06-b03
          speaker: moon
          text: No, I can't. When I shone there, a cloud stood in my way.
        - id: ch06-b04
          speaker: old_woman
          text: Wait a little longer, Halvor. The West Wind will be here soon. He must know the way, because he blows into every corner, gently or with all his strength.
        - id: ch06-b05
          speaker: narrator
          text: When the old woman came back inside, she noticed Halvor's horse.
        - id: ch06-b06
          speaker: old_woman
          text: What, you have a horse too? Let the poor thing into our little fenced pasture. Don't leave it hungry at the door. Better yet, trade it to me. I have a pair of old boots that travel fifteen quarters of a mile with every step. Take them for the horse, and you'll reach Soria Moria Castle much sooner.
        - id: ch06-b07
          speaker: narrator
          text: Halvor agreed at once. The old woman was so delighted with the horse that she nearly danced.
        - id: ch06-b08
          speaker: old_woman
          text: Now I can ride to church too!
          emotion: happy
        - id: ch06-b09
          speaker: narrator
          text: Halvor wanted to leave immediately, but she told him there was no need to hurry.
        - id: ch06-b10
          speaker: old_woman
          text: Lie down and sleep on the bench. We have no bed for you, but I'll keep watch for the West Wind.
        - id: ch06-b11
          speaker: narrator
          text: Before long, the West Wind came roaring so loudly that the cottage walls creaked. The old woman hurried out and shouted into the gale.
        - id: ch06-b12
          speaker: old_woman
          text: West Wind! West Wind! Do you know the way to Soria Moria Castle? Someone here needs to go there.
        - id: ch06-b13
          speaker: west_wind
          text: Yes, I know it well. I'm going there now to dry the clothes for a wedding. If he can move quickly enough, he may come with me.
        - id: ch06-b14
          speaker: narrator
          text: Halvor ran outside.
        - id: ch06-b15
          speaker: west_wind
          text: You'll have to hurry if you mean to keep up!
        - id: ch06-b16
          speaker: narrator
          text: Away the West Wind rushed, and Halvor sprang after it in the old boots. They raced over hills and down through valleys, across open moors and soggy marshes. The wind never slowed or looked back. Even with every step carrying him fifteen quarters of a mile, Halvor had all he could do to keep up.
        - id: ch06-b17
          speaker: west_wind
          text: I can't stay with you any longer. Before I reach the bleaching ground, I must go tear down a bit of spruce. Follow the hillside. You'll find some girls washing clothes, and from there Soria Moria Castle is not far.
        - id: ch06-b18
          speaker: narrator
          text: A short while later, Halvor found the washers standing over the clothes.
        - id: ch06-b19
          speakers: [washer_1, washer_2, washer_3]
          ensemble: chorus
          text: Have you seen the West Wind? He's supposed to come and dry the wedding clothes.
        - id: ch06-b20
          speaker: halvor
          text: Yes. He only went to break down a bit of spruce. He'll be here soon.
        - id: ch06-b21
          speaker: narrator
          text: Halvor asked the girls how to reach Soria Moria Castle, and they pointed him along the right road. He followed their directions up the hillside. Before he had walked much farther, the castle and the crowds around it came into view.
    - id: ch07
      title: The Wedding at Soria Moria Castle
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When Halvor reached the front of Soria Moria Castle, the place swarmed with horses and people. But following the West Wind through bushes and bogs had left his clothes ragged and torn. He stayed off to one side and would not mix with the grand crowd. There he waited until the final day of the celebration, when the wedding feast was to be held at noon.
        - id: ch07-b02
          speaker: narrator
          text: By custom, everyone had to drink to the bride and to the young women at the feast. The cupbearer filled a glass for each person in turn. Bride and bridegroom drank, then knights and servants. After a very long while, the cup reached Halvor.
        - id: ch07-b03
          speaker: narrator
          text: He drank to their health. Then he dropped into the glass the ring that the youngest princess had put on his finger beside the pond. He told the cupbearer to carry it to the bride and give her his greeting.
        - id: ch07-b04
          speaker: narrator
          text: The moment the princess saw the ring, she rose from the table.
        - id: ch07-b05
          speaker: youngest_princess
          text: Which man deserves one of us? Is it the man who freed us from the Trolls, or the man sitting here as bridegroom?
        - id: ch07-b06
          speaker: narrator
          text: There could be only one answer. Everyone at the feast agreed that the man who had delivered the sisters from the Trolls was the one who deserved the princess. When Halvor heard their judgment, he wasted no time. He flung off the beggar's rags that had hidden him from the crowd and arrayed himself as a bridegroom.
        - id: ch07-b07
          speaker: youngest_princess
          text: Yes! He is the right one!
          emotion: happy
        - id: ch07-b08
          speaker: narrator
          text: As soon as she saw him, the youngest princess threw the other bridegroom out of the window. Then she held her wedding with Halvor.
