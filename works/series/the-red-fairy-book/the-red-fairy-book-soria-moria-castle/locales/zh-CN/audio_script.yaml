        pitch: 中等
  chapters:
    - id: ch01
      title: 海外的三座城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对夫妇，儿子名叫哈尔沃。这个孩子从小什么活也不肯做，成天坐在炉灰里东扒西拨。父母送他出去学过好几门手艺，可他每次只待两三天，就从师傅那里逃回家，重新钻进壁炉角落翻弄炉灰。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，一位船长来问哈尔沃，愿不愿意跟船出海，看看外国是什么模样。哈尔沃倒很乐意，很快便收拾好上了船。他们航行了很久，后来遇上一场可怕的暴风。等海面平静下来，船已经漂到一片谁也不认识的海岸。
        - id: ch01-b03
          speaker: narrator
          text: 海上没有一丝风，船动弹不得。哈尔沃不愿躺着睡觉，便请求上岸看看。
        - id: ch01-b04
          speaker: captain
          text: 你穿着这一身破布，也好意思出去见人吗？
        - id: ch01-b05
          speaker: narrator
          text: 哈尔沃再三央求，船长终于答应，却叮嘱他，风一起就得马上回来。
        - id: ch01-b06
          speaker: narrator
          text: 岸上风光可爱，无论走到哪里，眼前都是开阔的平原、田野和草地，却没有半个人影。风渐渐起来，哈尔沃觉得自己还没看够，想再走一会儿，碰碰运气，看能不能遇见谁。他来到一条宽阔的大路，路面平滑得连鸡蛋滚过也不会磕破。哈尔沃顺着路走到傍晚，远远看见一座亮着灯的大城堡。他走了一整天，出门又没带吃的，早已饿得要命。可离城堡越近，心里反倒越害怕。
        - id: ch01-b07
          speaker: narrator
          text: 城堡里燃着火。哈尔沃走进厨房，只见那里富丽堂皇，胜过他平生见过的任何厨房。四周摆满金银器皿，却依然不见一个人。哈尔沃站了一会儿，始终没人出来，只好继续往里走。他推开一扇门，看见一位公主独自坐在纺车前纺线。
        - id: ch01-b08
          speaker: eldest_princess
          text: 天哪，基督徒怎么敢来这里？快走吧！这里住着一只有三个脑袋的山怪，他会把你吃掉的。
          emotion: fearful
        - id: ch01-b09
          speaker: halvor
          text: 他就是再多四个脑袋，我也正想见识见识。我没做坏事，不会走。你先给我些吃的吧，我快饿坏了。
        - id: ch01-b10
          speaker: narrator
          text: 哈尔沃吃饱后，公主让他试试墙上的剑。他连拿都拿不起来。
        - id: ch01-b11
          speaker: eldest_princess
          text: 喝一口剑旁边那只瓶子里的东西吧。山怪每回出门用剑，都先喝上一口。
        - id: ch01-b12
          speaker: narrator
          text: 哈尔沃从瓶里喝了一口。转眼间，那把刚才连拿也拿不起的剑，在他手中变得轻巧无比，可以随意挥舞。他想，山怪现在也该露面了。说来也巧，就在这时候，那家伙喘着粗气回来了。哈尔沃立刻躲到门后，握紧长剑，等他把脑袋伸进来。
        - id: ch01-b13
          speaker: troll_three
          text: 呼特图！这里怎么有基督徒鲜血的味道？
        - id: ch01-b14
          speaker: halvor
          text: 不错，马上就让你知道这里真有基督徒！
        - id: ch01-b15
          speaker: narrator
          text: 哈尔沃一剑砍掉了山怪所有的脑袋。公主重获自由，高兴得又唱又跳，随后却想起了两个姐妹。
        - id: ch01-b16
          speaker: eldest_princess
          text: 要是我的姐妹也能得救，该多好啊！
        - id: ch01-b17
          speaker: halvor
          text: 她们在哪里？
        - id: ch01-b18
          speaker: narrator
          text: 公主告诉他，一个姐姐被关在六英里外的城堡，另一个还要再远九英里。不过在出发以前，她请哈尔沃先帮忙搬走山怪的尸体。哈尔沃力气大，很快便把一切收拾得干干净净。两人吃吃喝喝，快活了一晚。第二天天刚蒙蒙亮，他便出发，整日不给自己歇息，不是走就是跑。等第二座城堡出现在眼前时，他心里又有了一点儿害怕。
        - id: ch01-b19
          speaker: narrator
          text: 第二座城堡比第一座更加辉煌，也同样空无一人。哈尔沃径直走进去，见到了二公主。
        - id: ch01-b20
          speaker: second_princess
          text: 我已经记不清被关在这里多久了，从没见过一个基督徒。快离开吧，这里的山怪有六个脑袋，会把你活吞下去。
          emotion: fearful
        - id: ch01-b21
          speaker: halvor
          text: 就算再添六个脑袋，我也不走。
        - id: ch01-b22
          speaker: second_princess
          text: 可他真会把你活吞掉！
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: 哈尔沃不肯听。他不怕山怪，只想先填饱肚子。公主让他尽情吃喝，吃完又劝他走。
        - id: ch01-b24
          speaker: halvor
          text: 我什么坏事也没做，没道理害怕，更不会走。
        - id: ch01-b25
          speaker: second_princess
          text: 山怪才不管你有没有道理。他抓住你就吃。既然你非留下不可，试试能不能挥动他打仗的剑吧。
        - id: ch01-b26
          speaker: narrator
          text: 哈尔沃照她的话试了试，还是挥不动那把剑。公主让他喝一口剑旁边挂着的瓶子。等那东西一下肚，他才有了足够的力气。不久，六头山怪便回来了。他长得又高又壮，身躯宽得连门也容不下，非得把身体侧过来，才能一点点挤进屋里。
        - id: ch01-b27
          speaker: troll_six
          text: 呼特图！这里有基督徒鲜血的味道！
        - id: ch01-b28
          speaker: narrator
          text: 第一个脑袋才探进门，哈尔沃便挥剑砍了下来，接着又把其余五个一一斩断。二公主欢喜极了，可她马上想起了两个姐妹，盼望她们也能重获自由。哈尔沃觉得这事办得到，当即就想去救人。不过，他还得先帮公主搬走山怪的尸体，所以直到第二天早晨才踏上去第三座城堡的路。
        - id: ch01-b29
          speaker: narrator
          text: 第三座城堡路途遥远。哈尔沃一路又走又跑，夜色已深才望见它。这座城堡比前两座不知富丽多少，他却一点儿也不害怕。他穿过厨房，径直走进城堡深处，看见一位世间无人能比的小公主。她说，自从自己被带来以后，从没有一个基督徒到过这里。她一次又一次苦苦相劝，请哈尔沃趁早离开，因为这里的山怪有九个脑袋，会把他活吞下去。
        - id: ch01-b30
          speaker: halvor
          text: 别说九个，就算九个再加九个，然后再添九个，我也不会走。随他什么时候来吧。
        - id: ch01-b31
          speaker: narrator
          text: 小公主仍旧温柔地央求他，生怕山怪回来把他吞掉。可哈尔沃毫不动摇。她只好把山怪的剑交给他，又让他喝下瓶里的东西，好获得挥剑的力气。就在同一个时刻，九头山怪喘着粗气回来。他比前两个更加高大粗壮，照样只能把庞大的身躯侧过来，才能挤进门。
        - id: ch01-b32
          speaker: troll_nine
          text: 呼特图！这里的基督徒鲜血味儿好浓！
        - id: ch01-b33
          speaker: narrator
          text: 哈尔沃先砍掉山怪的第一个脑袋，再一个接一个对付其余的。最后那个脑袋比所有脑袋都结实，也最难对付。哈尔沃费了平生最大的力气，才终于把它砍下来。哪怕最艰难的时候，他也始终相信自己的力量足够，一定能办到。
        - id: ch01-b34
          speaker: narrator
          text: 大公主和二公主也来到第三座城堡，三姐妹终于团聚，欢喜得胜过一生中的任何时候。她们都喜欢哈尔沃，哈尔沃也喜欢她们。三个人让他从中选择自己最喜欢的一位，而姐妹中最爱哈尔沃的，正是年纪最小、也最美的公主。
    - id: ch02
      title: 戒指与归乡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可哈尔沃渐渐变得沉默忧伤。公主们问他在想念什么，是不是不喜欢这里。他说，这里衣食无缺，日子也很舒服，只是父母还活着，他实在想回家见他们。
        - id: ch02-b02
          speakers: [eldest_princess, second_princess, youngest_princess]
          ensemble: chorus
          text: 这不难。只要照我们的话做，你一定能平安去，平安回来。
        - id: ch02-b03
          speaker: halvor
          text: 你们不愿我做的事，我一件也不做。
        - id: ch02-b04
          speaker: narrator
          text: 公主们替他穿上无比华贵的衣裳，把他打扮得像一位真正的王子，又给他手指上戴了一枚神奇戒指。只要借着戒指许愿，他就能到达想去的地方，也能安然回来。但她们郑重叮嘱，哈尔沃绝不能丢掉戒指，也不能说出三位公主的名字。只要犯了其中一条，他眼前的一切荣华都会消失，从此也永远见不到她们。
        - id: ch02-b05
          speaker: halvor
          text: 但愿我已经回到家，或者家就在这里！
        - id: ch02-b06
          speaker: narrator
          text: 愿望刚出口，便立刻实现了。哈尔沃还没弄清是怎么回事，已经站在父母的小屋外。夜色正在降临，父母看见一位衣着华美、气度不凡的陌生人走进屋，吓得一个鞠躬，一个屈膝行礼，怎么也没认出自己的儿子。哈尔沃便问他们，能不能让自己借宿一夜。
        - id: ch02-b07
          speakers: [father, mother]
          ensemble: duo
          text: 我们可招待不了您这样的大老爷。上面的农庄不远，从这里就能看见烟囱，那儿什么都有。
        - id: ch02-b08
          speaker: narrator
          text: 哈尔沃根本不肯听，执意要留在父母的小屋。两位老人也坚持原来的话，不住口地劝他去农庄。那里既有肉，也有饮料，足够招待贵客；他们自己的家却穷得什么都拿不出来，甚至没有一把像样的椅子可以请他坐。
        - id: ch02-b09
          speaker: halvor
          text: 我明早再去。今晚让我留下吧，我坐在炉边就行。
        - id: ch02-b10
          speaker: narrator
          text: 老人无法反对。哈尔沃坐到炉边，又像从前那样拨弄炉灰。三人谈了许多事，后来他问，老人是否有过孩子。
        - id: ch02-b11
          speakers: [father, mother]
          ensemble: duo
          text: 有过。我们有个儿子，叫哈尔沃，可我们不知道他去了哪里，是死是活也不知道。
          emotion: sad
        - id: ch02-b12
          speaker: halvor
          text: 我会不会就是他？
        - id: ch02-b13
          speaker: mother
          text: 我当然认得自己的儿子。他懒得什么也不肯做，衣服破得一个洞连着一个。那样的小子，哪能变成您这样的老爷？
        - id: ch02-b14
          speaker: narrator
          text: 老妇人走去拨火。火光照亮哈尔沃，也照出他从前坐在炉灰里的模样。母亲终于认出了他。
        - id: ch02-b15
          speaker: mother
          text: 天哪，真的是你吗，哈尔沃？
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: 两位老人欢喜得没有边。哈尔沃只得从头说起，把离家以后遇到的事情全讲了一遍。母亲听得又惊又喜，为儿子骄傲极了。她马上便要带哈尔沃到上面的农庄去，让那些从前总瞧不起他的姑娘们看看，他如今变成了怎样气派的人。母亲先跑去报信，哈尔沃随后跟来。
        - id: ch02-b17
          speaker: mother
          text: 哈尔沃回来了！你们快看看吧，他现在简直像一位王子。
          emotion: happy
        - id: ch02-b18
          speakers: [farm_girl_one, farm_girl_two]
          ensemble: duo
          text: 等着瞧吧，他准还是从前那个叫花子。
        - id: ch02-b19
          speaker: narrator
          text: 哈尔沃正好在这时走进门。姑娘们一看见他，惊得把脱在壁炉旁的上衣都忘了，身上只穿着衬裙便跑了出去。等她们重新穿好衣裳回到屋里，一个个羞窘得几乎不敢抬头看哈尔沃。她们从前在他面前，可总是那么骄傲，那么神气。
        - id: ch02-b20
          speaker: halvor
          text: 你们总觉得自己又漂亮又娇贵，谁都比不上。可跟我救出的大公主相比，你们只是放牛姑娘。二公主也远比你们美。至于我最爱的小公主，她比太阳和月亮还漂亮。要是三位公主此刻都在，你们就能亲眼见到了。
        - id: ch02-b21
          speaker: narrator
          text: 话音刚落，三位公主便站在他身边。哈尔沃想起她们先前不许他说出名字的警告，立刻明白自己闯了祸，心里悲痛万分。农庄赶紧备下一场盛宴，对公主们百般恭敬，可她们并不愿意留在那里。
        - id: ch02-b22
          speakers: [eldest_princess, second_princess, youngest_princess]
          ensemble: chorus
          text: 我们想去见你的父母。不过先陪我们到外面看看吧。
        - id: ch02-b23
          speaker: narrator
          text: 哈尔沃陪她们走出农舍，来到外面的一口大池塘。离水很近的地方，有一片秀丽柔软的绿坡。公主们说，坐在这里望着水面，一定十分惬意。她们想在绿坡上消磨一个钟头，再到哈尔沃父母家去。
        - id: ch02-b24
          speaker: youngest_princess
          text: 哈尔沃，让我替你梳梳头发吧。
        - id: ch02-b25
          speaker: narrator
          text: 哈尔沃便躺下来，把头枕在小公主腿上，让她慢慢替自己梳头。没过多久，他便睡熟了。小公主轻轻取下他手上的神奇戒指，把另一枚戒指戴回原处。随后，她拉住两个姐姐，也让姐姐们彼此拉紧。
        - id: ch02-b26
          speaker: youngest_princess
          text: 你们拉住我，就像我拉住你们一样。但愿我们现在就在索里亚莫里亚城堡。
        - id: ch02-b27
          speaker: narrator
          text: 哈尔沃醒来，看见三位公主全都不见了，也知道自己已经失去了她们。他痛哭哀号，伤心得谁也劝慰不了。父母苦苦央求他留在家里，他还是向他们告别。他说，自己再也不会回来，因为要是找不到小公主，活着也没有什么意思。
    - id: ch03
      title: 追随月亮与西风
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 哈尔沃带上三百块钱。走了一程，他遇到一个牵着马的人，很想买下那匹马。
        - id: ch03-b02
          speaker: horse_owner
          text: 我本来没打算卖，不过价钱合适，也不是不能商量。
        - id: ch03-b03
          speaker: narrator
          text: 哈尔沃问他要多少钱。
        - id: ch03-b04
          speaker: horse_owner
          text: 我买它没花多少钱，它也不算值钱。骑着倒不错，可一点儿也拉不动东西。你走一阵、骑一阵，它总能驮着你和干粮袋。
        - id: ch03-b05
          speaker: narrator
          text: 两人终于谈妥价钱。哈尔沃把干粮袋放上马背，时而走路，时而骑马。傍晚，他来到一片绿野，在一棵大树下坐下。他先从马背上取下袋子，再解开缰绳，让马自由吃草，自己才躺下睡觉。天一亮，他又赶路，一刻也不愿多歇。哈尔沃走走骑骑，整整穿行了一天。森林仿佛没有尽头，树木间却散落着许多青翠空地，闪着好看的光。他只在这些地方稍停，让马吃一点儿草，自己也从袋中拿些干粮。
        - id: ch03-b06
          speaker: narrator
          text: 到了第二天傍晚，树木之间终于透出一点灯光。
        - id: ch03-b07
          speaker: halvor
          text: 但愿那边住着人，让我暖暖身子，再找点东西吃。
        - id: ch03-b08
          speaker: narrator
          text: 哈尔沃循着灯光走到近前，发现那是一间破烂不堪的小屋。他从一块小小的玻璃窗望进去，看见屋里住着一对年迈的老人。他们年纪大极了，头发灰得像鸽子。老妇人的鼻子长得出奇，她坐在壁炉旁边，不用火钳，竟把长鼻子伸过去拨弄炉火。
        - id: ch03-b09
          speaker: old_woman
          text: 晚上好！你怎么会到这里来？一百多年了，这儿从没来过一个基督徒。
        - id: ch03-b10
          speaker: narrator
          text: 哈尔沃说，自己要去索里亚莫里亚城堡，问她是否认识路。
        - id: ch03-b11
          speaker: old_woman
          text: 我不认识。不过月亮马上就来，我替你问她。她照着世间万物，也许看得见那座城堡。
        - id: ch03-b12
          speaker: narrator
          text: 月亮清亮地升到树梢上方，老妇人走出屋子高声呼唤。
        - id: ch03-b13
          speaker: old_woman
          text: 月亮，月亮！你知道去索里亚莫里亚城堡的路吗？
        - id: ch03-b14
          speaker: moon
          text: 我不知道。我照到那里时，面前正好有一片云。
        - id: ch03-b15
          speaker: old_woman
          text: 那就再等等西风吧。每个角落，他不是轻轻吹过，就是呼啸而过，他一定知道。
        - id: ch03-b16
          speaker: narrator
          text: 老妇人回屋才发现哈尔沃还带着马。
        - id: ch03-b17
          speaker: old_woman
          text: 快把可怜的马放进我们的小牧场，别让它在门口挨饿。你愿意拿它换一双旧靴子吗？穿上这双靴子，一步就能跨过三又四分之三英里，你会更快到达城堡。
        - id: ch03-b18
          speaker: narrator
          text: 哈尔沃立刻答应了这桩交换。老妇人得到那匹马，高兴得几乎跳起舞来，说自己这下也能骑马去教堂了。哈尔沃一刻也不想休息，恨不得穿上靴子马上出发。老妇人却说不必着急，让他躺在长凳上睡一会儿，因为家里没有床可以招待他。她愿意替哈尔沃守着，留意西风什么时候到来。
        - id: ch03-b19
          speaker: narrator
          text: 不久，西风呼啸而来，震得墙壁吱嘎作响。老妇人又走到屋外。
        - id: ch03-b20
          speaker: old_woman
          text: 西风，西风！这里有人要去索里亚莫里亚城堡，你能告诉他怎么走吗？
        - id: ch03-b21
          speaker: west_wind
          text: 我当然知道。我正要去那里吹干婚礼用的衣裳。他要是跑得够快，就跟我来吧。
        - id: ch03-b22
          speaker: narrator
          text: 哈尔沃连忙跑出去。
        - id: ch03-b23
          speaker: west_wind
          text: 想跟上我，可得快一点儿！
        - id: ch03-b24
          speaker: narrator
          text: 西风说走便走，一下越过高山低谷，又呼啸着掠过荒野和沼泽。哈尔沃穿着神奇的旧靴子紧紧追赶，一步也不敢放慢。可西风实在太快，他还是得使出全身的力气，才勉强没有被远远甩在后面。
        - id: ch03-b25
          speaker: west_wind
          text: 我不能再陪你了。我得先刮倒几棵云杉，再去漂洗场吹衣裳。沿着山坡走，你会看见几个洗衣姑娘。从那里到城堡已经不远。
        - id: ch03-b26
          speaker: narrator
          text: 哈尔沃很快遇见洗衣姑娘。她们正等着西风来吹干婚礼要用的衣裳。
        - id: ch03-b27
          speaker: washer_girl
          text: 你有没有见到西风？他本来该到这里来了。
        - id: ch03-b28
          speaker: halvor
          text: 见到了。他只是去刮倒几棵云杉，很快就来。请告诉我，索里亚莫里亚城堡怎么走？
        - id: ch03-b29
          speaker: narrator
          text: 姑娘们替他指明了方向。哈尔沃沿着她们说的路继续前行，没走多久便来到城堡正面。只见四下人马云集，到处挤得密密麻麻，人人都在为婚礼忙碌。可他一路跟着西风穿过灌木和沼泽，衣裳早已撕得破破烂烂。这副模样实在不便走进人群，他只好一直躲在一旁，不肯让宾客看见自己。直到婚礼庆典的最后一天，正午的宴席就要开始，他才走进城堡。
    - id: ch04
      title: 真正的新郎
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 按当地的规矩和习俗，众人要轮流向新娘以及在场的年轻姑娘们祝酒。侍酒人依次斟满酒杯，从新娘、新郎到骑士和仆从，一个也不落。哈尔沃待在末尾，过了很久很久，酒杯终于送到他手中。他举杯祝新人与众人安康，随后取出那枚戒指。那正是三位公主离开前，坐在池塘边时，小公主换到他手上的戒指。哈尔沃把它轻轻投入杯中。
        - id: ch04-b02
          speaker: halvor
          text: 请把这杯酒送给新娘，替我向她问候。
        - id: ch04-b03
          speaker: narrator
          text: 侍酒人照哈尔沃的吩咐，把盛着戒指的酒杯穿过长长的宴席，送到新娘面前，也替这个衣衫褴褛的陌生人向她问候。小公主低头看见杯中的戒指，立刻认出它正是自己留给哈尔沃的那一枚，当场从桌边站起身来。
        - id: ch04-b04
          speaker: youngest_princess
          text: 谁更配娶我们姐妹中的一个？是把我们从山怪手里救出来的人，还是眼前这个新郎？
        - id: ch04-b05
          speaker: narrator
          text: 厅里的人听了这番话，都觉得答案再清楚不过，根本不可能有第二种意见。哈尔沃站在末尾，听见大家一致选择了救出公主的人，便不再隐藏身份。他立刻脱掉一路穿来的叫花子破衣，把自己装扮得整整齐齐，换上了真正新郎的华美礼服。
        - id: ch04-b06
          speaker: youngest_princess
          text: 对，他才是我该嫁的人！
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 小公主认定哈尔沃才是自己应当嫁的人。她把坐在席上的另一个新郎扔出窗外，随即同历尽艰辛、终于找到索里亚莫里亚城堡的哈尔沃举行了婚礼。这个故事选自 P. C. 阿斯比约恩森。
