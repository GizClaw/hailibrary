audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖沉稳，童话感强
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中等
    eldest_son:
      display_name: 大儿子
      tts:
        delivery: 自信轻率，受诱惑时很快松懈
        timbre: 年轻硬朗
        pace: 适中
        pitch: 中等
    second_son:
      display_name: 二儿子
      tts:
        delivery: 急于证明自己，口气自负
        timbre: 清晰年轻
        pace: 适中
        pitch: 中等
    cinderlad:
      display_name: 灰小子
      tts:
        delivery: 朴实坦率，语气坚定而不张扬
        timbre: 年轻温暖
        pace: 适中
        pitch: 中高
    father:
      display_name: 父亲
      tts:
        delivery: 严厉多疑，带着不耐烦
        timbre: 低沉粗粝
        pace: 稍慢
        pitch: 低
    mother:
      display_name: 母亲
      tts:
        delivery: 担忧慈爱，劝说时恳切
        timbre: 柔和疲惫
        pace: 适中
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严强硬，推托时十分勉强
        timbre: 浑厚有力
        pace: 适中
        pitch: 低
    old_woman:
      display_name: 老婆子
      tts:
        delivery: 甜言诱哄，暗藏狡猾
        timbre: 苍老沙哑
        pace: 稍慢
        pitch: 中低
    youngest_foal:
      display_name: 最小的小马
      tts:
        delivery: 清楚果断，语气沉着
        timbre: 明亮年轻
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 大儿子看守小马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对穷苦夫妻住在森林深处一间破得不成样的小屋里，四下离人烟远得很。他们每天只能勉强糊口，就连这样活下去也十分艰难。夫妻俩有三个儿子。最小的那个什么活也不干，成天只躺在炉灰旁拨弄灰烬，大家便叫他灰小子。
        - id: ch01-b02
          speaker: narrator
          text: 一天，大儿子要出门谋生。父母答应以后，他走了一整天，傍晚来到一座王宫。国王正站在门外的台阶上，问他要去哪里。
        - id: ch01-b03
          speaker: eldest_son
          text: 老爷，我正在四处找份差事。
        - id: ch01-b04
          speaker: king
          text: 那就替我看守七匹小马吧。你若能跟它们一整天，晚上告诉我它们吃什么、喝什么，我就把公主和半个王国给你。办不到，我便在你背上割三道血红的伤痕。
        - id: ch01-b05
          speaker: narrator
          text: 年轻人觉得，看守几匹小马再容易不过，自己一定干得好。第二天清早，天才蒙蒙亮，马倌便放出了七匹小马。它们拔腿飞奔，翻过山，越过谷，又穿过森林和沼泽。大儿子不知道会被带到哪里，只顾在后面追。跑了很久，他先是觉得累，又勉强撑了一阵，最后连看守它们的念头也厌烦了。正好前面有道岩缝，一个老婆子手拿纺纱杆，坐在那里纺线。
        - id: ch01-b06
          speaker: narrator
          text: 老婆子看见他满脸淌汗，便高声叫他。
        - id: ch01-b07
          speaker: old_woman
          text: 来吧，俊小伙儿。坐到我身边，让我替你梳梳头。
        - id: ch01-b08
          speaker: narrator
          text: 大儿子巴不得歇一歇。他挨着老婆子坐进岩缝，把头枕在她膝上，任她梳了一整天。七匹小马早已跑得无影无踪，他却舒舒服服躺在那里，什么也不愿管。快到晚上时，他才想起该走了。
        - id: ch01-b09
          speaker: eldest_son
          text: 我还是直接回家吧。现在去王宫也没用了。
        - id: ch01-b10
          speaker: old_woman
          text: 等到黄昏，小马会从这里回来。你跟着它们跑回去，谁会知道你在我这里躺了一整天？
        - id: ch01-b11
          speaker: narrator
          text: 黄昏时，小马果然又从岩缝前经过。老婆子拿出一瓶水和一小块苔藓，叫年轻人带回王宫，就说这正是七匹小马吃的和喝的。年轻人跟着小马赶回去，到了国王面前。国王问他，这一整天是不是始终忠实尽责地守着它们。
        - id: ch01-b12
          speaker: eldest_son
          text: 当然，我一点儿也没偷懒！
        - id: ch01-b13
          speaker: king
          text: 那你说说，我的七匹小马吃什么，喝什么？
        - id: ch01-b14
          speaker: eldest_son
          text: 您瞧，这块苔藓是它们吃的，这瓶水是它们喝的。
        - id: ch01-b15
          speaker: narrator
          text: 国王立刻明白了他所谓的看守是怎么一回事，顿时怒不可遏。他命人在年轻人背上割出三道血红的伤痕，往伤口里揉进盐，再把他一路赶回那间林中小屋。大儿子到家时有多痛苦，谁都想象得到。他说自己这辈子出门找过一回差事，永远也不会再找第二回了。
    - id: ch02
      title: 两个哥哥的教训
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，二儿子也要出门碰碰运气。父母指着哥哥的后背，想拦住他。
        - id: ch02-b02
          speakers: [father, mother]
          ensemble: duo
          text: 不行！看看你哥哥的背，还是留在家里吧。
        - id: ch02-b03
          speaker: narrator
          text: 二儿子不肯改变主意，坚持了很久很久，父母最后只好放他走。他也赶了一整天的路，傍晚来到王宫，看见国王站在门外的台阶上。他说自己想找份差事，国王便让他看守七匹小马。要是查清它们吃什么、喝什么，他就能娶公主，得到半个王国；要是失败，背上便要留下三道血红的伤痕。二儿子立刻答应了，满以为这件事轻而易举。
        - id: ch02-b04
          speaker: narrator
          text: 第二天晨光灰白，马倌放出小马，它们又翻山越岭地飞奔，二儿子一路追在后面。可他的遭遇同哥哥丝毫不差。追了很久以后，他又热又累，正好看见岩缝里的老婆子拿着纺纱杆。
        - id: ch02-b05
          speaker: old_woman
          text: 过来吧，过来吧，俊小伙儿，让我替你梳梳头。
        - id: ch02-b06
          speaker: narrator
          text: 二儿子一听便动了心，任凭小马爱跑到哪里，就到哪里。自己挨着老婆子坐下，把头枕在她腿上。她慢慢替他梳头，他就这样舒舒服服歇了漫长的一整天。傍晚，小马回来了。老婆子也给他一块苔藓和一瓶水，让他带回王宫，交给国王看。
        - id: ch02-b07
          speaker: king
          text: 你查清我的七匹小马吃什么、喝什么了吗？
        - id: ch02-b08
          speaker: second_son
          text: 查清了。这块苔藓是它们吃的，这瓶水是它们喝的。
        - id: ch02-b09
          speaker: narrator
          text: 国王又一次大怒，命人在二儿子背上割出三道血红的伤痕，把盐撒进伤口，随后立刻将他赶回家。二儿子回去以后，从头到尾讲了自己的遭遇。他也说，这辈子已经出门找过一次差事，以后再也不会去了。
        - id: ch02-b10
          speaker: narrator
          text: 到了第三天，灰小子也想出门。他告诉家人，自己很想亲自试试，看看能不能守住那七匹小马。两个哥哥一听，顿时哈哈大笑，只管拿他取乐。
        - id: ch02-b11
          speakers: [eldest_son, second_son]
          ensemble: duo
          text: 我们俩都失败了，你还以为自己能成？你除了躺在炉灰旁拨灰，还会做什么！
        - id: ch02-b12
          speaker: cinderlad
          text: 我还是要去。我已经拿定主意了。
        - id: ch02-b13
          speaker: narrator
          text: 两个哥哥继续取笑，父母也苦苦劝他别去，可谁也没能拦住他。灰小子终于上了路。他整整走了一天，暮色降临时来到王宫。国王仍站在门外的台阶上，问他要往哪里去。
        - id: ch02-b14
          speaker: cinderlad
          text: 我正在四处找份差事。
        - id: ch02-b15
          speaker: narrator
          text: 国王吃过两次亏，这回不肯随便收人做事，先问清灰小子从哪里来。灰小子如实说了家乡，又告诉国王，先前替他看守过七匹小马的两个人，正是自己的哥哥。接着，他请求国王让他在第二天也试一试。
        - id: ch02-b16
          speaker: king
          text: 原来你是他们的弟弟！那两个人一无是处，我已经受够这种家伙了。
          emotion: angry
        - id: ch02-b17
          speaker: cinderlad
          text: 可我既然来了，您就让我试一次吧。
        - id: ch02-b18
          speaker: king
          text: 好吧。你若一心想让人剥掉背上的皮，那便随你。
        - id: ch02-b19
          speaker: cinderlad
          text: 我还是更想得到公主。
    - id: ch03
      title: 白桦树后的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天清早，晨光刚刚泛白，马倌再次放出七匹小马。它们翻山越岭，穿过森林和沼泽，灰小子一路紧追。跑了很久以后，他也来到那道岩缝前。老婆子仍拿着纺纱杆坐在那里，一见他便叫起来。
        - id: ch03-b02
          speaker: old_woman
          text: 来吧，俊小伙儿，让我替你梳梳头。
        - id: ch03-b03
          speaker: cinderlad
          text: 那你过来呀，快过来呀！
        - id: ch03-b04
          speaker: narrator
          text: 灰小子一边回答，一边蹦跳着从她面前飞跑过去，手里始终牢牢抓着一匹小马的尾巴。等他们安然越过岩缝，最小的那匹马忽然开口说话了。
        - id: ch03-b05
          speaker: youngest_foal
          text: 骑到我背上来吧，我们还有很远的路要赶。
        - id: ch03-b06
          speaker: narrator
          text: 灰小子骑上马背，他们向前赶了很久很久。
        - id: ch03-b07
          speaker: youngest_foal
          text: 现在看见什么了吗？
        - id: ch03-b08
          speaker: cinderlad
          text: 没有，什么也没看见。
        - id: ch03-b09
          speaker: narrator
          text: 他们又往前走了好一阵，小马再次问他。
        - id: ch03-b10
          speaker: youngest_foal
          text: 现在呢，看见什么了吗？
        - id: ch03-b11
          speaker: cinderlad
          text: 还是没有。
        - id: ch03-b12
          speaker: narrator
          text: 又走了很久很久，小马第三次开口询问。灰小子朝远处仔细望去。
        - id: ch03-b13
          speaker: cinderlad
          text: 这回看见了。前面有个白色的东西，像一根又粗又大的白桦树干。
        - id: ch03-b14
          speaker: youngest_foal
          text: 对，我们就从那里进去。
        - id: ch03-b15
          speaker: narrator
          text: 到了白桦树干跟前，最大的小马把树干的一边撞倒，原先挡住的地方露出一扇门。门里有一间小屋，屋内几乎空无一物，只有一个小壁炉和两条长凳。可门后却挂着一柄锈迹斑斑的大剑，旁边还有一只小罐。
        - id: ch03-b16
          speaker: youngest_foal
          text: 你能挥动那柄剑吗？
        - id: ch03-b17
          speaker: narrator
          text: 灰小子拿起剑试了试，根本挥不动。他只好从小罐里喝一口，再喝一口，接着又喝了第三口。这回他重新举剑，挥动起来竟轻松自如。
        - id: ch03-b18
          speaker: youngest_foal
          text: 很好，现在把这柄剑带走。等你说出我们吃什么、喝什么，国王便会把公主嫁给你。我们正是那位公主的兄弟，从前也都是王子，是一个法力强大的山怪对我们施了魔法，才把我们变成今天的样子。到了婚礼那天，你要用这柄剑砍下我们七个的头，我们便能恢复原样。砍完以后，千万小心，把每颗头放到它原来那具身体的尾巴旁边。只有这样，山怪施在我们身上的魔法才会彻底失效。
        - id: ch03-b19
          speaker: narrator
          text: 灰小子认真听完，把小马交代的每一步都记在心里，答应到了婚礼那天一定照办。随后，他带着那柄大剑，骑在最小的小马背上，同它们继续向前赶路。
    - id: ch04
      title: 小马吃什么喝什么
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们又走了很久很久，小马开口问灰小子有没有看见什么。
        - id: ch04-b02
          speaker: youngest_foal
          text: 你看见什么了吗？
        - id: ch04-b03
          speaker: cinderlad
          text: 没有。
        - id: ch04-b04
          speaker: narrator
          text: 他们继续向前，走了很远，小马又问了一次。
        - id: ch04-b05
          speaker: youngest_foal
          text: 现在呢？还是什么也没看见吗？
        - id: ch04-b06
          speaker: cinderlad
          text: 唉，还是没有。
        - id: ch04-b07
          speaker: narrator
          text: 于是他们又翻山越岭，走过许多许多英里。小马第三次问起时，灰小子朝遥远的地平线望去，终于有了发现。
        - id: ch04-b08
          speaker: cinderlad
          text: 很远很远的地方，有一道淡蓝色的细线。
        - id: ch04-b09
          speaker: youngest_foal
          text: 那是一条河，我们得从河上过去。
        - id: ch04-b10
          speaker: narrator
          text: 河上架着一座又长又漂亮的桥。他们从桥上过了河，又沿着远路走了很久很久。小马再次问灰小子有没有看见什么，他朝远方望去。这一回，极远的地方出现了一个黑乎乎的东西，高高耸在那里，很像一座教堂的尖塔。
        - id: ch04-b11
          speaker: youngest_foal
          text: 没错，我们就要进那里。
        - id: ch04-b12
          speaker: narrator
          text: 七匹小马一踏进教堂墓园，全都变成了人，一个个都是国王儿子的模样。他们的衣服华美无比，闪着耀眼的光。七位王子走进教堂，灰小子也跟了进去。牧师正站在祭坛前，王子们从他那里领受了面包和葡萄酒。接着，牧师把手按在他们头上，念完祝福词，大家才一同离开教堂。灰小子出来时，手里带着一瓶葡萄酒和一些祝圣过的面包。
        - id: ch04-b13
          speaker: narrator
          text: 七位王子才踏进墓园，立刻又变成小马。灰小子骑上最小的那匹，沿原路返回。这一次，它们跑得快了许多许多。他们先越过长桥，又经过白桦树干，最后从岩缝前一闪而过。老婆子坐在那里纺线，在后面尖声叫骂。可他们跑得实在太快，灰小子听不清她喊些什么，只听得出她气坏了。
        - id: ch04-b14
          speaker: narrator
          text: 他们赶回王宫时，暮色已经很浓，天几乎全黑了。国王没有待在宫里，而是亲自站在院子中等候他们。
        - id: ch04-b15
          speaker: king
          text: 你今天一整天都尽责看守它们了吗？
        - id: ch04-b16
          speaker: cinderlad
          text: 我已经尽了全力。
        - id: ch04-b17
          speaker: king
          text: 那么，你能说出我的小马吃什么、喝什么了？
        - id: ch04-b18
          speaker: narrator
          text: 灰小子取出祝圣过的面包和那瓶葡萄酒，递给国王看。
        - id: ch04-b19
          speaker: cinderlad
          text: 您瞧，这就是它们吃的，这就是它们喝的。
        - id: ch04-b20
          speaker: king
          text: 你果然看守得勤勉又尽责。公主和半个王国都归你了。
    - id: ch05
      title: 七位王子与婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 众人立刻开始筹备婚礼。国王说，这场婚礼一定要办得无比庄严、无比盛大，要让所有人都听说过它，让人人都争相打听它的情形。
        - id: ch05-b02
          speaker: narrator
          text: 大家在婚宴上刚刚坐定，新郎忽然站起来，说自己忘了一件非照看不可的事，随后独自去了马厩。到了那里，他取出藏好的大剑，依照小马的嘱咐，先砍下最大那匹的头，再砍第二大的，然后按年岁一个接一个砍下去。他丝毫不敢大意，万分小心地把每颗头放到原来那匹马的尾巴旁边。
        - id: ch05-b03
          speaker: narrator
          text: 最后一颗头刚放好，山怪的魔法便失去了力量，七匹小马全都恢复了从前的王子模样。灰小子带着七位王子回到婚宴。国王看见儿子们归来，欢喜得又亲吻灰小子，又拍他的后背；新娘见自己的兄弟恢复原样，也比从前更加喜欢他。
        - id: ch05-b04
          speaker: king
          text: 我答应你的半个王国已经属于你。等我死后，另一半也交给你。我的儿子们如今恢复了王子身份，不必再分走这里的领土，他们自然能凭自己的本事，为自己取得别的土地和王国。
        - id: ch05-b05
          speaker: narrator
          text: 七位王子破除了魔法，灰小子也娶到了公主。所有应许的事都实现了。所以，想也想得到，那场盛大的婚礼从头到尾都是欢声笑语，人人都沉浸在喜悦之中。
