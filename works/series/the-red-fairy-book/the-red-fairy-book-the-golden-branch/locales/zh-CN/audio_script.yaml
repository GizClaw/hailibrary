audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    grumpy_king:
      display_name: 暴躁国王
      tts:
        delivery: 阴沉专横，发怒时粗暴强硬
        timbre: 粗重威严
        pace: 偏慢
        pitch: 低
    curl_prince:
      display_name: 卷卷王子
      tts:
        delivery: 聪慧善良，年轻坦率，历险后坚定温柔
        timbre: 清朗柔和
        pace: 适中
        pitch: 中高
    neighboring_king:
      display_name: 邻国国王
      tts:
        delivery: 务实自负，对女儿缺少体谅
        timbre: 成熟浑厚
        pace: 适中
        pitch: 中低
    cabbage_princess:
      display_name: 菜茎公主
      tts:
        delivery: 善良谦逊，受委屈时克制，获得自由后明亮真诚
        timbre: 柔美清澈
        pace: 适中
        pitch: 中高
    banquet_man:
      display_name: 宴席上的男子
      tts:
        delivery: 神秘急切，警告清楚有力
        timbre: 遥远沉稳
        pace: 适中
        pitch: 中低
    mysterious_voice:
      display_name: 神秘声音
      tts:
        delivery: 隐秘庄重，指引时简洁坚定
        timbre: 空灵清晰
        pace: 舒缓
        pitch: 中等
    douce_fairy:
      display_name: 杜丝琳仙女
      tts:
        delivery: 慈爱睿智，言语温柔而笃定
        timbre: 明亮温润
        pace: 从容
        pitch: 中高
    florimond:
      display_name: 弗洛里蒙
      tts:
        delivery: 高贵诚挚，感激时热切坦荡
        timbre: 清亮醇厚
        pace: 适中
        pitch: 中等
    magician:
      display_name: 邪恶魔法师
      tts:
        delivery: 阴险残忍，嘲弄时夸张得意
        timbre: 冷硬沙哑
        pace: 偏慢
        pitch: 低
    old_woman:
      display_name: 小老太太
      tts:
        delivery: 古雅和气，指点时亲切神秘
        timbre: 苍老柔和
        pace: 从容
        pitch: 中高
    comet_queen:
      display_name: 彗星女王
      tts:
        delivery: 傲慢魅惑，被拒后尖厉暴怒
        timbre: 尖细冰冷
        pace: 偏慢
        pitch: 高
    mouse_older:
      display_name: 胖老鼠公主
      tts:
        delivery: 彬彬有礼，奔逃后气喘却仍热心健谈
        timbre: 圆润成熟
        pace: 稍快
        pitch: 中等
    mouse_younger:
      display_name: 年轻老鼠公主
      tts:
        delivery: 活泼直率，惊魂未定却十分乐观
        timbre: 轻柔清亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 高塔里的王子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，阴郁又难相处。臣民都怕他，而且怕得很有道理。哪怕只犯一点小得不能再小的错，他也会叫人砍掉那人的脑袋。所以，大家都叫他暴躁国王。他的独生子却完全不同。要说聪明和善良，没有哪个王子比得过他。可惜，他的模样实在难看。他双腿弯曲，眼睛斜视，嘴歪向一边，背上还有个驼包。从没有这样美好的灵魂，住在这样难看的小小躯壳里。可不管他长什么样，人人都爱他。王后给他取名卷卷，只因为她很喜欢这个名字，也觉得它十分配自己的儿子。
        - id: ch01-b02
          speaker: narrator
          text: 暴躁国王只在乎自己的权势。他打算让卷卷迎娶邻国国王的女儿，好把两片相连的领地靠得更紧。那位公主也生得很丑，还跛得厉害，到哪儿都离不开拐杖，人们便叫她菜茎公主。可她其实是世上最善良可亲的人。
        - id: ch01-b03
          speaker: narrator
          text: 国王把公主的画像挂在大殿里，叫来卷卷，说画上就是他未来的新娘。王子只瞧了一眼，就轻蔑地转过脸。国王立刻恼了。
        - id: ch01-b04
          speaker: grumpy_king
          text: 怎么，你不满意她？
          emotion: angry
        - id: ch01-b05
          speaker: curl_prince
          text: 是的，父王。她又丑又跛，要我娶她，我怎么会高兴？
        - id: ch01-b06
          speaker: grumpy_king
          text: 你也配嫌弃别人？你自己这副模样，足够把人吓跑了。
        - id: ch01-b07
          speaker: curl_prince
          text: 就因为我自己已经这么丑，才想娶个不丑的人。我天天看着自己，早就看够了。
        - id: ch01-b08
          speaker: grumpy_king
          text: 我说了，你非娶她不可！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 王子知道再争也没用，只好行礼告退。国王从不容人反抗，便把儿子关进了专门囚禁叛逆王子的高塔。那座塔已经空了约两百年。里面的陈设又旧又稀奇，倒有一间藏书很多的书房。卷卷爱读书，获准想拿多少就拿多少，可书上的文字早已失传，他一个字也不认识，只能猜着玩。
        - id: ch01-b10
          speaker: narrator
          text: 国王认定牢狱很快就会让儿子厌倦，乖乖答应婚事，于是派使臣去接菜茎公主。他还向她父亲保证，卷卷一定会让她非常快乐。邻国国王觉得女儿命运不好，如今竟得到这样一门亲事，实在是天大的好运。不过说实话，送来的王子画像一点也不可爱。他仍把画摆到光线最好的地方，叫女儿来看。公主刚看一眼便扭过头，伤心地哭了起来。父亲见她这样嫌弃王子，心里很不痛快，便拿起镜子，直举到她面前。
        - id: ch01-b11
          speaker: neighboring_king
          text: 我看得出来，你嫌王子不英俊。先照照镜子吧，你真有资格挑剔他的相貌吗？
        - id: ch01-b12
          speaker: cabbage_princess
          text: 父王，我不是在抱怨。我只求您别逼我嫁人。我宁愿一辈子做不幸的菜茎公主，也不想让另一个人每天看着我这副模样，跟着受苦。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 国王根本不听，仍叫她跟使臣走了。
        - id: ch01-b14
          speaker: narrator
          text: 卷卷还被严严实实地锁在塔里。父亲不准人同他说话，也几乎不给他饭吃，存心叫他难熬。看守们却很爱王子，宁可违令，也尽力让他舒服些。
        - id: ch01-b15
          speaker: narrator
          text: 一天，卷卷在宽阔的长廊里来回走着。他想到自己生得这样丑，还得被迫迎娶一位同样丑陋的公主，心里苦闷极了。偶然抬头时，他发现彩绘玻璃窗亮得出奇。为了赶走这些悲伤的念头，他便一扇一扇细看起来。窗上的画似乎在讲一个人的一生，每扇窗里都有他，而且那人有点像卷卷。第一幅里，那人站在塔楼的角楼中。接着，他在墙缝里寻找什么，又用一把金钥匙打开旧柜子。这样的情景还有许多。看着看着，画中最显眼的人变成了一个高大英俊的青年。卷卷望着他挺拔强健的身体，心里十分欢喜，竟忘了时间。
        - id: ch01-b16
          speaker: narrator
          text: 不知不觉，天已经黑了。王子只好回到房间，随手拿起一本样式古怪的旧书，想靠插图解闷。他惊讶地发现，书里的情景竟和长廊窗上一模一样。更奇妙的是，那些图画仿佛全都活了。翻到乐师那页，他能看见一双双小手弹奏乐器，也能听见悦耳的乐声。舞会那页里，小小的舞者不停来来去去。再翻一页，宴席上的佳肴竟飘出浓香。一个男子忽然转过头，直直看着他。
        - id: ch01-b17
          speaker: banquet_man
          text: 卷卷，我们举杯祝你平安。想法子把王后还给我们。成功了，你会得到酬谢。办不到，你可要遭殃。
        - id: ch01-b18
          speaker: narrator
          text: 王子原本已经越看越惊奇，听见画中人亲口说话，顿时吓坏了。书砰的一声掉在地上，他自己也昏倒了。看守闻声赶来，等王子苏醒，连忙追问出了什么事。卷卷不敢说出真相，只说自己饿得头昏眼花，才会看见、听见种种怪事。看守们顾不上国王的禁令，马上送来一顿丰盛的晚餐。王子吃饱后鼓起勇气，再次翻开那本书。奇妙的图画却再也没有出现。他便认定，先前的一切不过是一场梦。
    - id: ch02
      title: 柜子里的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，卷卷又来到长廊，却发现彩窗里的人真的会走动。他看着那个像自己的人从墙缝取出钥匙，再打开柜子，决定照着试一试。他登上角楼，到处搜索，还一处一处敲墙。敲到一块石头时，声音是空的。他用锤子打掉一小块石头，后面果然藏着一把小金钥匙。
        - id: ch02-b02
          speaker: narrator
          text: 昏暗的角落里有只又破又旧的柜子。要不是事先从窗画上看见，谁也不会多瞧它一眼。起初，王子怎么也找不到钥匙孔。他弯下腰仔细察看，终于在繁复的雕花里发现一个暗孔。金钥匙插进去正合适。他用力一转，两扇柜门猛地弹开。柜子外面虽然丑陋破败，里面却华美得叫人难以相信。每个抽屉都由水晶、琥珀或其他宝石制成，里面装满各式各样的珍宝。卷卷欣喜万分，一个接一个拉开查看。最后，他找到一只极小的抽屉，里面没有珠宝，只有一把祖母绿钥匙。
        - id: ch02-b03
          speaker: curl_prince
          text: 它一定能打开中间那扇小金门。
        - id: ch02-b04
          speaker: narrator
          text: 钥匙一转，小门向后敞开，柔和的深红光芒照遍柜子。发光的是一只巨大红宝石做成的匣子。王子打开它，竟看见一只男人的手，手里还握着一幅画像。他吓得只想把匣子放回去，赶紧逃走。耳边却响起一个声音。
        - id: ch02-b05
          speaker: mysterious_voice
          text: 你能帮助这只手的主人，让他复原。看看那幅美丽的画像。画上的人正是我一切灾难的根源。你若愿意帮我，就立刻去大长廊。找阳光最明亮的地方，我的宝藏就在那里。
        - id: ch02-b06
          speaker: narrator
          text: 声音消失了。王子一连问了好几个问题，却没人回答。他只好收好匣子，锁上柜子，把金钥匙塞回墙缝，匆匆回到长廊。所有窗子都古怪地震颤着，格格作响。王子只顾寻找最亮的阳光，终于看见光落在一幅英俊青年的画像上。
        - id: ch02-b07
          speaker: narrator
          text: 画像靠着乌木镶金的护墙板。王子不知道下一步怎么办，便抬头向彩窗求助。最近的窗上，画中的他正把画像从墙上抬开。他立刻照做，画像后面竟露出一座摆满雕像的大理石厅堂。
        - id: ch02-b08
          speaker: narrator
          text: 他走进那座装点着雕像的大理石厅堂，又接连穿过许多华丽的房间，最后来到一间垂满蓝纱的屋子。四壁由绿松石砌成，低榻上躺着一位美丽女子，仿佛正在熟睡。她乌木般漆黑的长发铺满枕头，衬得脸庞洁白如象牙。王子看得出来，她睡得并不安稳。他怕惊醒她，放轻脚步慢慢走近。就在这时，他听见她先叹了口气，随后低声说起话来。
        - id: ch02-b09
          speaker: douce_fairy
          text: 你把我和心爱的弗洛里蒙拆散，又当着我的面砍下他那只本该受你敬重的手。你真以为这样就能得到我的爱吗？
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: 泪珠慢慢滚过她的脸颊。卷卷这才明白，她中了魔法，柜子里的正是她爱人的手。
        - id: ch02-b11
          speaker: narrator
          text: 一只巨鹰忽然飞进房间，爪中抓着一根金枝。枝上结满樱桃般的果实，每一颗都是灼灼发亮的红宝石。巨鹰把金枝交给王子。卷卷猜到，这也许能解除女子身上的魔法，便拿枝条轻轻碰了碰她。
        - id: ch02-b12
          speaker: curl_prince
          text: 美丽的姑娘，我不知道是什么魔法困住了你。现在，我以你深爱的弗洛里蒙之名呼唤你。回到那被你失去、却从没忘记的生命里来吧。
        - id: ch02-b13
          speaker: narrator
          text: 女子立刻睁开明亮的双眼。巨鹰还在她身边盘旋。
        - id: ch02-b14
          speaker: douce_fairy
          text: 亲爱的，留下来吧，求你留下！
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: 巨鹰悲鸣一声，展开宽阔的翅膀飞走了。女子转向卷卷。
        - id: ch02-b16
          speaker: douce_fairy
          text: 我知道，是你解开了困住我两百年的魔法。只要有事能报答你，尽管说吧。我会用全部仙力，让你幸福。
        - id: ch02-b17
          speaker: curl_prince
          text: 夫人，请让我帮助您深爱的弗洛里蒙恢复原样。我忘不了您为他流下的眼泪。
        - id: ch02-b18
          speaker: douce_fairy
          text: 善良的王子，这件事注定要由另一个人完成，我现在还不能解释。难道你自己没有愿望吗？
        - id: ch02-b19
          speaker: narrator
          text: 王子跪在她脚边。
        - id: ch02-b20
          speaker: curl_prince
          text: 夫人，请看看我吧。我叫卷卷，人人都嘲笑我的模样。求您别让我再这样可笑了。
          emotion: sad
        - id: ch02-b21
          speaker: douce_fairy
          text: 起来吧，王子。愿你的美貌和才华从此相称。以后，你就叫无双王子，因为现在只有这个名字配得上你。
        - id: ch02-b22
          speaker: narrator
          text: 仙女用金枝碰了碰他。王子欢喜得说不出话，只能亲吻她的手。他站起来，从四周的镜子里看见全新的自己，终于知道卷卷已经永远消失了。
        - id: ch02-b23
          speaker: douce_fairy
          text: 我真希望能告诉你将来会遇见什么，好让你提防路上的陷阱。可我不能。快逃出高塔吧。记住，杜丝琳仙女永远是你的朋友。
        - id: ch02-b24
          speaker: narrator
          text: 话音刚落，王子惊讶地发现自己已经离开高塔，落在至少一百里格外的一片密林里。我们先把他留在那里，去看看别处发生的事。
    - id: ch03
      title: 菜茎公主的选择
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了用餐的时候，看守发现王子没有像往常一样索要晚餐，便走进房间查看。他们见床上没人，顿时吓坏了。从角楼一直搜到最深的地牢，众人翻遍整座高塔，却连王子的影子也没找到。他们知道，国王一旦发现王子逃走，准会砍掉所有看守的脑袋。大家商量半天，只好谎称王子病了。他们让个子最小的看守尽量装扮成卷卷的模样，叫他躺到王子床上，再派人去禀报国王。
        - id: ch03-b02
          speaker: narrator
          text: 暴躁国王听说儿子病了，反倒很高兴，以为他很快就会答应婚事。他叫看守继续严厉对待王子，这正合众人的心意。就在这时，菜茎公主坐着肩舆到了王宫。
        - id: ch03-b03
          speaker: narrator
          text: 暴躁国王亲自出门迎接。他一眼看见公主乌龟似的皮肤，又看见她在大鼻子上方连成一线的粗眉，还有那张几乎一直咧到两只耳朵的大嘴，惊讶得再也忍不住，当着她的面就叫了起来。
        - id: ch03-b04
          speaker: grumpy_king
          text: 卷卷已经够丑了。要嫁给他，你可实在没什么好犹豫的。
        - id: ch03-b05
          speaker: cabbage_princess
          text: 陛下，我知道自己长什么样，您的话伤不了我。但我不想嫁给您的儿子。我宁可一直叫菜茎公主，也不愿成为卷卷王后。
        - id: ch03-b06
          speaker: narrator
          text: 国王顿时大发雷霆。
        - id: ch03-b07
          speaker: grumpy_king
          text: 你父亲送你来，就是叫你嫁给我儿子。我绝不会让你更改他的安排，害他蒙羞！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 可怜的公主受尽羞辱，被赶进自己的房间。侍奉她的贵妇也奉命劝她改变心意。不久，看守怕秘密败露，又禀告国王，说王子已经死了。国王立刻把责任全推到公主身上，下令把她关进高塔，顶替卷卷。
        - id: ch03-b09
          speaker: narrator
          text: 菜茎公主对这不公的惩罚又惊又委屈。她不断捎话向暴躁国王申辩，还一封接一封地给父亲写信。可国王正在盛怒中，没有人敢把她的话送进去，也没有人敢替她寄信。公主并不知道自己的消息全被拦住了，仍盼着很快就能回国。在那一天到来以前，她只好尽量替自己找些消遣。她每天沿着长长的画廊来回散步，也渐渐被彩窗上不断变化的画面吸引住了。后来，她竟在一个画中人身上认出了自己。
        - id: ch03-b10
          speaker: cabbage_princess
          text: 我一到这个国家，他们就忙着把我画进窗里，还特意画上我的拐杖，好衬得旁边那位年轻牧羊女更纤细、更可爱。唉，要是我也能像她那么美就好了。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 她照了照镜子，眼中含着泪，赶紧避开那副叫自己难过的模样。忽然，她发现身后站着一个戴便帽的小老太太。老太太比她丑上一倍，也跛得同她一样厉害。
        - id: ch03-b12
          speaker: old_woman
          text: 公主，你叹气叹得真叫人难过。我来让你在善良和美貌中选一样。你若要美貌，我可以满足你，可你会变得虚荣、任性又轻浮。你若留下现在的模样，就会一天比一天聪慧、善良而谦逊。
        - id: ch03-b13
          speaker: cabbage_princess
          text: 夫人，难道我不能既聪慧又美丽吗？
        - id: ch03-b14
          speaker: old_woman
          text: 不能，孩子。命运只许你选一样。我带来一个白黄两面的暖手筒。朝黄色那面呵气，你会变成你羡慕的牧羊女，也会得到那位英俊牧羊人的爱。我早看见你喜欢看他的画像了。朝白色那面呵气，你的模样不会变，却会越来越善良、越来越快乐。选吧。
        - id: ch03-b15
          speaker: cabbage_princess
          text: 好吧，人总不能什么都有。善良当然比漂亮更重要。
        - id: ch03-b16
          speaker: narrator
          text: 她朝白色那面呵了口气，谢过老仙女。仙女随即消失。菜茎公主又孤零零地留下来，心想父亲也该派军队来救她了。她想登上角楼眺望，却找不到楼梯。后来，她想到角楼里的大钟。钟锤的绳索一直垂到长廊，她便卸下一只钟锤，把自己绑在原处。大钟上弦时，她得意地升进了角楼。
        - id: ch03-b17
          speaker: narrator
          text: 远处什么也没有。公主坐下歇息，向后一靠，恰好碰到无双王子匆忙补过的墙。碎石连同金钥匙一起掉了下来。她猜钥匙属于角落里那只看不见锁孔的旧柜子。不久，她便打开柜门，惊叹着看遍珍宝，最后找到了红宝石匣子。
        - id: ch03-b18
          speaker: narrator
          text: 匣盖刚掀开，她便吓得发抖，想把它扔掉。一股神秘力量却让她怎么也松不开手。耳边传来轻轻的声音。
        - id: ch03-b19
          speaker: mysterious_voice
          text: 勇敢一点，公主。你未来的幸福，全系在这场冒险上。
        - id: ch03-b20
          speaker: cabbage_princess
          text: 我该怎么做？
          emotion: fearful
        - id: ch03-b21
          speaker: mysterious_voice
          text: 把匣子带走，藏在枕头下面。一看到巨鹰，就立刻把它交出去，一刻也别耽搁。
        - id: ch03-b22
          speaker: narrator
          text: 公主虽然害怕，还是毫不迟疑地照办了。她把匣子带回房间，藏到枕头底下，又赶紧把其他珍宝一件一件放回原处，丝毫不敢弄乱。这时，看守们正在四处找她。等他们发现公主竟然到了根本没有楼梯可走的角楼，人人都惊呆了，只当她一定会施魔法，才能跑到那里去。
        - id: ch03-b23
          speaker: narrator
          text: 第一天过去了，什么也没发生。第二天仍是一样。到了第三天夜里，公主终于听见窗外有东西振翅拍打。她拉开窗帘，借着月光看见一只巨鹰。公主想起神秘声音的嘱咐，用自己所能达到的最快速度，一瘸一拐地奔向窗边，把窗子推开。巨鹰鼓动双翼飞进房间，欢喜地拍打着翅膀。公主一刻也没有耽误，马上从枕下取出红宝石匣子递给它。巨鹰用利爪紧紧抓住匣子，转眼便消失了。原来的地方，却站着公主生平见过最英俊的王子。他身穿华服，头上戴着钻石王冠。
        - id: ch03-b24
          speaker: florimond
          text: 公主，一个邪恶魔法师困了我整整两百年。我们爱上同一位仙女，可她选择了我。他法力比我强，趁我不备，把我变成巨鹰，又让我的王后沉睡在魔法中。守护你命运的仙女告诉我，两百年后，一位王子会唤醒她，一位公主会把敌人砍下的手还给我，让我复原。也是她引你找到柜子，把我的手放在那里。现在，她准许我报答你。告诉我，你最渴望什么？要我让你的容貌和心灵一样美吗？
        - id: ch03-b25
          speaker: cabbage_princess
          text: 啊，您真的能做到吗？
          emotion: surprised
        - id: ch03-b26
          speaker: narrator
          text: 就在这时，她全身的骨头噼啪作响，身体长高了，腰背挺直了，也变得无比美丽。她的眼睛像星星，皮肤白得像牛奶。
        - id: ch03-b27
          speaker: cabbage_princess
          text: 太奇妙了！这真的是从前那个可怜的小小的我吗？
          emotion: surprised
        - id: ch03-b28
          speaker: narrator
          text: 她低头看见破旧的小拐杖躺在地上。
        - id: ch03-b29
          speaker: florimond
          text: 确实是你，公主。不过旧名字已经不适合你了。以后就叫阳光公主吧。你这样明亮迷人，完全配得上这个名字。
        - id: ch03-b30
          speaker: narrator
          text: 弗洛里蒙话音一落便消失了。公主甚至不知道自己是怎样离开高塔的。等她回过神来，已经走在浓密的树荫下，身旁流着一条清澈的河。她自然先俯身去看水中的倒影，想瞧瞧自己如今究竟是什么模样。
    - id: ch04
      title: 牧羊人与魔法师
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 阳光公主低头去看水中的倒影。她惊讶地发现，自己竟和彩窗里那位令人羡慕的牧羊女一模一样。她身上穿着画中那条白裙，头顶戴着同样的花环。为了让她和画中人毫无分别，一群绵羊也出现在四周，低头吃着青草。河岸边还放着一根漂亮的牧杖，上面缀满鲜花。接连经历这么多新奇又非凡的事情，公主实在疲惫，便在一棵树下坐下来休息，很快沉沉睡去。
        - id: ch04-b02
          speaker: narrator
          text: 无双王子恰好也被送到这个国家。公主熟睡时，他正在为自己的羊群寻找阴凉的草地。他一眼就认出她是彩窗上那位迷人的牧羊女。真人比画中更美，他庆幸自己偶然走到了这里。
        - id: ch04-b03
          speaker: narrator
          text: 公主睁开眼，也认出了他。两人很快成了亲密的朋友。公主请他帮忙找一户可以借住的农家。王子认识一位老太太，她的小屋舒适漂亮，正合适。两人便一同去了。
        - id: ch04-b04
          speaker: narrator
          text: 公主喜欢那位老太太，也喜欢她身边的一切。老太太很快在树荫下摆好晚餐。公主请王子一起吃奶油和黑面包。王子欣然答应，又从自己的园子带来草莓、樱桃、坚果和鲜花。两人一起坐下，过得非常快活。
        - id: ch04-b05
          speaker: narrator
          text: 从此，他们每天放牧时都会见面，日子幸福得不得了。无双王子越来越爱这位牧羊女，终于请求她嫁给自己，好让两人永远不再分开。阳光公主听了很想答应。可她看上去虽然只是个贫穷的牧羊女，心里却从没忘记自己是一位真正的公主。她不知道公主能不能嫁给一个卑微的牧羊人，也不敢只凭自己的心意作决定，因此迟迟没有答复。
        - id: ch04-b06
          speaker: narrator
          text: 她决定去请教一位魔法师，却没有告诉任何人。魔法师和他那位法力强大的仙女姐姐住在一座城堡里。路途很远，还要穿过密林。四面八方都有奇怪的声音呼唤她，她急着赶路，一声也没理，终于来到城堡的庭院。
        - id: ch04-b07
          speaker: narrator
          text: 院里的荒草和荆棘长得老高，看起来已经有一百年没人来过。公主费了很大力气才从中穿过，衣裳和皮肤都被划出不少伤痕。她走进一座阴暗沉闷的大厅，墙上只有一个极小的洞，勉强透进一点日光。四周的帷幔全由蝙蝠翅膀做成。天花板上吊着十二只猫，它们尖声号叫，刺得人耳朵发疼。长桌上还拴着十二只老鼠，每一只的尾巴都被牢牢系住。它们鼻子前各放着一片诱人的肥熏肉，距离却偏偏差一点，无论怎样挣扎都够不着。猫始终看得见老鼠，却碰不到它们。饥饿的老鼠也只能闻着、望着永远吃不到的美味，受尽折磨。
        - id: ch04-b08
          speaker: narrator
          text: 公主正惊骇地望着这些可怜的生灵，魔法师忽然走了进来。他身穿黑色长袍，头顶一条鳄鱼，手里握着一根由二十条长蛇做成的鞭子。每一条蛇都还活着，不停地扭动。公主一见，吓得魂都快没了，真希望自己从没到过这里。她一句话也没说，转身就往门口逃。门上却蒙着一张厚厚的蜘蛛网。她撕开这一张，后面又有一张，再往后还有一张。蜘蛛网层出不穷，怎么撕也撕不完。她的手臂已经酸痛，却丝毫没有靠近出口。魔法师一直站在身后，满怀恶意地放声大笑。
        - id: ch04-b09
          speaker: magician
          text: 你就算撕上一辈子，也休想出去。不过，你很年轻，也是我许久没见过的美人。嫁给我吧，那边的猫和老鼠也全送给你。它们本来是得罪过我的王子和公主。从前爱得越深，现在恨得越凶。让它们永远这样待着，多有意思！
        - id: ch04-b10
          speaker: cabbage_princess
          text: 那您还是把我也变成老鼠吧！
        - id: ch04-b11
          speaker: magician
          text: 哦，你不肯嫁给我？小傻瓜，你想变什么，我都能成全你。
        - id: ch04-b12
          speaker: cabbage_princess
          text: 不，绝不！什么也别想逼我嫁给您。我想，我这一生谁也不会爱！
          emotion: angry
        - id: ch04-b13
          speaker: magician
          text: 那你就变成一种非鱼非鸟的怪东西吧。身子轻飘飘的，颜色和草一样绿。走开，蚱蜢夫人！
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 魔法师伸手碰了碰她。眨眼间，公主变成世上最漂亮的绿色小蚱蜢。她重获自由，高高兴兴地跳进花园。可一脱离危险，她又开始为自己难过。
        - id: ch04-b15
          speaker: cabbage_princess
          text: 弗洛里蒙，这就是你的恩赐最后的模样吗？美貌果然不能长久。如今只剩这张滑稽的小脸和一身绿色。我真不如嫁给那位善良的牧羊人。我一定是因为骄傲，才被罚成蚱蜢，只能日夜在溪边草丛里唱歌，心里却明明更想哭。
          emotion: sad
    - id: ch05
      title: 蚱蜢与蟋蟀
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 与此同时，无双王子发现公主不见了，正在河边伤心。一个穿着古雅、戴轮状皱领和丝绒兜帽的小老太太忽然出现在他身边。雪白的头发从帽下露出来。
        - id: ch05-b02
          speaker: old_woman
          text: 孩子，你看起来很伤心。出了什么事？
        - id: ch05-b03
          speaker: curl_prince
          text: 婆婆，我失去了心爱的牧羊女。就算走遍世界，我也一定要找到她。
          emotion: sad
        - id: ch05-b04
          speaker: old_woman
          text: 沿那条通向城堡的小路走吧，孩子。我想，你很快就能追上她。
        - id: ch05-b05
          speaker: narrator
          text: 王子诚心谢过她，立即出发。他一路没有遇到任何阻拦，很快走进城堡四周的魔法森林。刚到那里，他就仿佛看见阳光公主正在前面的林木之间轻盈穿行。王子以为自己终于找到了她，马上用尽全力追赶。可不管他跑得多快，两人之间的距离都一点也没有缩短。
        - id: ch05-b06
          speaker: curl_prince
          text: 阳光，亲爱的，等等我！
        - id: ch05-b07
          speaker: narrator
          text: 那个幻影反倒越走越快。王子白白追了一整天。天黑时，他看见前方的城堡灯火通明，以为公主就在里面，连忙赶去。他轻易走进城堡，却在大厅碰上一位可怕的老仙女。她瘦得透光，眼睛亮得像灯，皮肤像鲨鱼皮，胳膊像木板条，手指像纺锤。她偏偏还涂了胭脂，贴着美人痣，披银锦斗篷，戴钻石王冠，裙上缀满珠宝和粉绿缎带。
        - id: ch05-b08
          speaker: comet_queen
          text: 王子，你终于来看我了。别再想着那个不值得你多看一眼的小牧羊女。我是彗星女王。只要娶我，你就能享尽尊荣。
        - id: ch05-b09
          speaker: curl_prince
          text: 娶您？不，我永远不会答应！
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: 老仙女气得挥了两下魔杖。大厅立刻挤满可怕的妖怪，逼得王子为了活命同它们搏斗。他只有一把短剑，却守得很好，一直没受伤。过了一会儿，老仙女叫停争斗，又问他肯不肯改变主意。王子坚定地拒绝了。
        - id: ch05-b11
          speaker: narrator
          text: 彗星女王便在大厅另一头变出阳光公主的幻影。
        - id: ch05-b12
          speaker: comet_queen
          text: 看见你爱的人了吗？好好想清楚。你再不肯娶我，我就让两只老虎把她撕碎。
        - id: ch05-b13
          speaker: narrator
          text: 王子仿佛听见心爱的牧羊女哭着求救，心神大乱，绝望地喊起来。
        - id: ch05-b14
          speaker: curl_prince
          text: 杜丝琳仙女！你一次次说会做我的朋友，难道现在要丢下我吗？快来救救我们！
          emotion: fearful
        - id: ch05-b15
          speaker: douce_fairy
          text: 无论发生什么，都要坚定。去寻找金枝。
          emotion: calm
        - id: ch05-b16
          speaker: narrator
          text: 耳边这道柔和的声音，让王子重新有了勇气。他想起杜丝琳仙女从前的承诺，也牢牢记住了金枝。无论彗星女王怎样威胁，他还是拒绝娶她。老仙女终于气得失去耐心，狂怒地举起魔杖。
        - id: ch05-b17
          speaker: comet_queen
          text: 顽固的王子，滚出我的视线！变成蟋蟀吧！
          emotion: angry
        - id: ch05-b18
          speaker: narrator
          text: 英俊的无双王子立刻成了一只可怜的黑蟋蟀。幸好他还记得杜丝琳仙女的指引，不然，他此刻只会想找个烧得旺旺的炉子，钻进后面的暖缝里。
        - id: ch05-b19
          speaker: narrator
          text: 他赶紧离开这座要命的城堡，到一棵空心树里找住处。树洞一角蜷着一只忧愁的小蚱蜢，伤心得连歌也唱不出来。王子原本没指望她回答，还是开了口。
        - id: ch05-b20
          speaker: curl_prince
          text: 蚱蜢大婶，您要上哪儿去？
        - id: ch05-b21
          speaker: cabbage_princess
          text: 那你呢，蟋蟀大叔？
        - id: ch05-b22
          speaker: curl_prince
          text: 什么？你会说话？
          emotion: surprised
        - id: ch05-b23
          speaker: cabbage_princess
          text: 我为什么不能像你一样说话？难道蚱蜢还比不上蟋蟀吗？
        - id: ch05-b24
          speaker: curl_prince
          text: 我能说话，是因为我从前是一位王子。
        - id: ch05-b25
          speaker: cabbage_princess
          text: 那我更该会说话了，因为我从前是一位公主。
        - id: ch05-b26
          speaker: curl_prince
          text: 原来我们的遭遇一样。你现在要去哪里？我们能不能结伴走？
        - id: ch05-b27
          speaker: cabbage_princess
          text: 我仿佛听见空中有声音说，无论发生什么，都要坚定，去寻找金枝。我以为这是给我的命令，就马上出发了，可我根本不知道该走哪条路。
        - id: ch05-b28
          speaker: narrator
          text: 两只老鼠突然冲进树洞，打断了他们。老鼠一路狂奔，累得上气不接下气，差点压扁蚱蜢和蟋蟀。幸好他们及时躲到昏暗的角落。
        - id: ch05-b29
          speaker: mouse_older
          text: 哎哟，夫人，我跑得太快，腰肋疼得厉害。殿下还好吗？
        - id: ch05-b30
          speaker: mouse_younger
          text: 我的尾巴扯断了。不过要是不扯断，我现在还摆在魔法师的桌上，所以我一点也不后悔。有人追来了吗？我们能逃掉，运气真好！
        - id: ch05-b31
          speaker: mouse_older
          text: 但愿我们躲得过猫和捕鼠夹，早点赶到金枝那里。
        - id: ch05-b32
          speaker: mouse_younger
          text: 这么说，你认识路？
        - id: ch05-b33
          speaker: mouse_older
          text: 当然，夫人。我熟悉那条路，就像熟悉回家的路。金枝真是奇迹。只要一片叶子，就能让人永远富有。它还能破除魔法，让每个靠近它的人恢复青春和美貌。天一亮，我们就出发。
        - id: ch05-b34
          speaker: cabbage_princess
          text: 能不能让我们也同行？就是这位体面的蟋蟀，还有我。我们也要去朝拜金枝。
        - id: ch05-b35
          speaker: narrator
          text: 两只老鼠彬彬有礼地答应了。四位同行者互相客套了好一阵，才各自在树洞里找好位置，一同睡下。蚱蜢和蟋蟀终于知道了方向，两只老鼠也多了同伴。大家只等天色一亮，就立刻动身去找金枝。
    - id: ch06
      title: 金枝花园
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 天刚蒙蒙亮，他们就踏上旅程。两只老鼠一路担心有人追来，也怕落进捕鼠夹，可四位同行者最终平安到达了金枝。
        - id: ch06-b02
          speaker: narrator
          text: 金枝长在一座奇妙花园的正中央。园中每一条小路，都撒满豌豆大小的珍珠。花木也没有一样平凡。玫瑰由深红钻石组成，叶子全是祖母绿。石榴树上结的是石榴石，金盏花是黄玉，水仙花是黄钻。紫罗兰闪着蓝宝石的光，矢车菊则是绿松石。每一朵郁金香，都由紫水晶、蛋白石和钻石一同组成。阳光照下来，整片花圃灼灼生辉，亮得叫人几乎睁不开眼。
        - id: ch06-b03
          speaker: narrator
          text: 金枝本身早已不是小小的枝条，而是长成了森林里那样高大的树。一直到最高、最细的枝梢，都挂满闪耀的红宝石樱桃。蚱蜢和蟋蟀走到树下，刚一碰到树干，魔法便从他们身上退去了。两人同时恢复原来的身体，也在同一刻认出了彼此。他们这才知道，苦苦寻找的正是对方，心里又惊讶又欢喜。
        - id: ch06-b04
          speaker: narrator
          text: 这时，弗洛里蒙和杜丝琳仙女乘着华美的车驾来到花园。仙女走下车，微笑着说。
        - id: ch06-b05
          speaker: douce_fairy
          text: 看来，你们又找到了彼此。不过，我还给你们留了一份惊喜。公主，别再犹豫了。尽管告诉这位一心爱你的牧羊人，你有多爱他吧。他正是你父亲要你嫁的那位王子。你们都过来，我为你们戴上王冠，婚礼马上举行。
          emotion: happy
        - id: ch06-b06
          speaker: narrator
          text: 王子和公主由衷感谢她，说自己的一切幸福都来自她的恩赐。那两位不久前还是老鼠的公主也走上前，请仙女解救仍被困在魔法师咒语里的可怜朋友。
        - id: ch06-b07
          speaker: douce_fairy
          text: 说真的，在这样喜庆的日子里，不管你们求我什么，我都不忍心拒绝。
          emotion: happy
        - id: ch06-b08
          speaker: narrator
          text: 她用魔杖在金枝上敲了三下。就在那一刻，魔法师城堡里所有被咒语困住的人都重获自由，飞快赶到这座奇妙花园。那些变成动物的人，一个接一个走到树前。每个人只要轻轻碰一下金枝，就恢复了原来的模样。失散已久的人们终于彼此相认，花园里到处都是欢庆的声音。
        - id: ch06-b09
          speaker: narrator
          text: 为了让这番慷慨的善举彻底圆满，杜丝琳仙女又把高塔里那只神奇的柜子，以及柜中所有珍宝，全都送给获救的人们。那是一笔难以想象的财富，至少抵得上十个王国。至于刚刚成婚的无双王子和阳光公主，仙女把金枝所在的宫殿和整座美丽花园送给了他们，让他们从此在那里生活。
        - id: ch06-b10
          speaker: narrator
          text: 两人富甲天下，也深受所有臣民爱戴，从此永远幸福地生活在那里。这个故事叫《金枝》，是奥努瓦夫人写的。
