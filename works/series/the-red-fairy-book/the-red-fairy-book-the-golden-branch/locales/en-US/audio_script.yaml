  chapters:
    - id: ch01
      title: King Grumpy's Command
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King so gloomy and disagreeable that all his subjects feared him. They had good reason. He would order a person's head cut off for the smallest offence. Everyone called him King Grumpy.
        - id: ch01-b02
          speaker: narrator
          text: His only son could not have been more different. No prince was cleverer or kinder than Prince Curlicue, and everyone loved him. Yet he was terribly ugly, with crooked legs, crossed eyes, a great mouth drawn to one side, and a hunched back. Never had so beautiful a soul lived in so unfortunate a little body. His mother had chosen the name Curlicue simply because she liked it and thought it suited him.
        - id: ch01-b03
          speaker: narrator
          text: King Grumpy cared far more about his own glory than his son's happiness. He decided that Curlicue must marry a neighboring King's daughter. Her father's great estates touched his own, and he believed the alliance would make him more powerful than ever. As for the bride, he thought she would suit Curlicue because she was just as ugly as he was. The Princess was as kind and pleasant as anyone could be, but there was no hiding her appearance. She was also so lame that she always walked with a crutch, and people called her Princess Cabbage-Stalk.
        - id: ch01-b04
          speaker: narrator
          text: The King obtained her portrait, hung it beneath a canopy in his great hall, and summoned his son. He pointed to the picture of Curlicue's future bride and said he hoped the Prince found her charming. Curlicue took one look, then turned away with such scorn that his father was deeply offended.
        - id: ch01-b05
          speaker: king_grumpy
          text: Am I to take it that she does not please you?
        - id: ch01-b06
          speaker: prince_curlicue
          text: No, sire. How could I be pleased about marrying a Princess who is both ugly and lame?
        - id: ch01-b07
          speaker: king_grumpy
          text: And you think you have the right to object? Why, you are ugly enough to frighten anyone who sees you.
        - id: ch01-b08
          speaker: prince_curlicue
          text: That is exactly why I want a wife who is not ugly. I already see quite enough ugliness whenever I look at myself.
        - id: ch01-b09
          speaker: king_grumpy
          text: You will marry her because I command it!
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Curlicue saw that arguing would do no good. He bowed and left. King Grumpy was not accustomed to anyone opposing him, so he ordered his son locked in the tower reserved for rebellious princes. No one had used it for two hundred years, because there had been no rebellious princes in all that time.
        - id: ch01-b11
          speaker: narrator
          text: The rooms and their furniture seemed strangely old-fashioned. Still, the tower had a fine library, and Curlicue loved to read. He soon gained permission to have all the books he wanted. Then he discovered that every one of them was written in a forgotten language. He could not understand a word, though he amused himself by trying.
        - id: ch01-b12
          speaker: narrator
          text: King Grumpy was certain that Curlicue would soon tire of prison and agree to the marriage. He sent ambassadors to the neighboring King, proposing that the Princess come and marry his son, who would make her perfectly happy. Her father was delighted by such a good offer for his unfortunate daughter. To tell the truth, though, he could find nothing at all to admire in the portrait of Curlicue that had been sent to him.
        - id: ch01-b13
          speaker: narrator
          text: He placed the portrait in its best possible light and called for the Princess. The instant she saw it, she turned away and began to cry. Her father, annoyed by her dislike, held a mirror before her face.
        - id: ch01-b14
          speaker: neighboring_king
          text: I can see that you do not consider the Prince handsome. But look at yourself. Do you truly have any right to complain about his appearance?
        - id: ch01-b15
          speaker: princess_cabbage_stalk
          text: Sire, I am not complaining. I only beg you not to make me marry anyone. I would rather remain unhappy Princess Cabbage-Stalk forever than force another person to look at my ugliness.
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: The King refused to listen. He sent her away with the ambassadors.
        - id: ch01-b17
          speaker: narrator
          text: Meanwhile, Curlicue remained locked in the tower. To make his days as dreary as possible, King Grumpy forbade anyone to speak to him and ordered that he receive almost nothing to eat. But the guards loved the Prince. In spite of the King, they did everything they dared to make his imprisonment easier.
    - id: ch02
      title: The Secret of the Tower
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day Curlicue paced through the long gallery, grieving over his ugliness and the marriage being forced upon him. Then the painted windows caught his eye. They shone so brightly and beautifully that he began studying them, hoping to turn his thoughts away from his troubles.
        - id: ch02-b02
          speaker: narrator
          text: The pictures seemed to show one man's life, and Curlicue thought the man looked rather like himself. That likeness drew him deeper into the story. In the first window, the figure stood in one of the tower turrets. Farther along, he searched inside a crack in the wall. In the next scene, he used a golden key to open an ancient cabinet. Many more scenes followed. Before long, Curlicue noticed a second figure who held the most important place in each picture. This one was a tall and handsome young man. The poor Prince took real pleasure in looking at someone so straight and strong.
        - id: ch02-b03
          speaker: narrator
          text: By then darkness had fallen, and Curlicue had to return to his room. To amuse himself, he picked up a curious old book and began studying its pictures. He was amazed to find the very same scenes he had seen in the gallery windows. More astonishing still, these pictures seemed alive. When he looked at the musicians, he saw their hands move and heard sweet music. At a painted ball, he could watch the tiny dancers come and go. He turned a page, and the rich smell of a delicious dinner rose from the book. One figure seated at the feast looked straight at him and spoke.
        - id: ch02-b04
          speaker: feast_figure
          text: We drink to your health, Curlicue. Try to return our Queen to us. Succeed, and you will be rewarded. Fail, and you will suffer for it.
        - id: ch02-b05
          speaker: narrator
          text: The Prince had grown more astonished with every page. Now terror overcame him. He dropped the book with a crash and fainted. The sound brought his guards running. When he came around, they asked what had happened.
        - id: ch02-b06
          speaker: prince_curlicue
          text: Hunger made me feel faint and dizzy. I imagined that I saw and heard all kinds of strange things.
        - id: ch02-b07
          speaker: narrator
          text: The guards disobeyed the King and gave him an excellent supper. After eating, Curlicue opened the book again. The wonderful pictures had vanished. He decided he must have dreamed them.
        - id: ch02-b08
          speaker: narrator
          text: Yet the next day, the painted windows moved before his eyes. Their figures came and went like living people. Curlicue watched the figure who resembled him take a key from a crack in the turret wall and unlock the old cabinet. He resolved to follow what he had seen.
        - id: ch02-b09
          speaker: narrator
          text: Curlicue climbed into the turret and began searching everywhere. He tapped one stretch of wall after another until he found a spot that sounded hollow. Taking a hammer, he broke away part of the stone and discovered a little golden key behind it. His next task was to find the cabinet. He soon came upon it hidden in a dark corner. It looked so old and battered that, without the scenes in the windows, he would never have given it a second glance.
        - id: ch02-b10
          speaker: narrator
          text: At first Curlicue could not find a keyhole. He searched every carving until he uncovered one cleverly hidden in the design. The golden key fitted it exactly. He gave the key a strong turn, and the doors flew open. The cabinet was ugly and worn on the outside, but nothing could have been richer or more beautiful within. Every drawer was made from crystal, amber, or some precious stone, and every one was packed with treasure. Delighted, Curlicue opened them one after another. At last he found a tiny drawer that held no riches at all, only a single emerald key.
        - id: ch02-b11
          speaker: prince_curlicue
          text: This must unlock the little golden door in the center.
        - id: ch02-b12
          speaker: narrator
          text: The emerald key did fit. The small door swung back, and a soft crimson glow filled the cabinet. It came from a huge shining carbuncle carved into a box. Curlicue opened it at once, then recoiled in horror. Inside lay a man's severed hand, holding a portrait.
        - id: ch02-b13
          speaker: narrator
          text: His first thought was to shut the dreadful box and flee. Then a voice spoke beside his ear.
        - id: ch02-b14
          speaker: hidden_voice
          text: This hand belonged to someone you can help and restore. Look at the beautiful portrait. Its original caused all my misfortunes. If you wish to help me, go at once to the great gallery. Find the place where the sunlight falls brightest, and there you will discover my treasure.
        - id: ch02-b15
          speaker: narrator
          text: The voice fell silent. Bewildered, Curlicue asked question after question, but no answer came. He returned the box, locked the cabinet, replaced the golden key inside the wall, and hurried down to the gallery.
        - id: ch02-b16
          speaker: narrator
          text: Every window shook and clattered when he entered. Curlicue paid no attention. He searched for the brightest patch of sunlight and found it resting upon the portrait of a splendidly handsome young man. The picture seemed fixed against the ebony-and-gold paneling like all the others. Curlicue did not know what to do until he glanced at a nearby window and saw his own likeness lifting the portrait from the wall.
        - id: ch02-b17
          speaker: narrator
          text: Curlicue understood the hint and lifted the portrait aside without difficulty. Behind it lay a marble hall decorated with statues. He crossed the hall, then walked through one magnificent room after another. At last he entered a chamber hung all around with blue gauze. Its walls were made of turquoise. A lovely lady lay upon a low couch as if asleep. Her hair, black as ebony, spread across the pillows and made her face look white as ivory. Yet she did not rest peacefully.
        - id: ch02-b18
          speaker: narrator
          text: Her sleep was troubled. Curlicue stepped closer as quietly as he could. He heard her sigh and speak through her tears.
        - id: ch02-b19
          speaker: fairy_douceline
          text: How could you think I would love you after you tore me from my dear Florimond? Before my eyes, you cut off the hand that even you should have feared and honored.
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: Tears rolled slowly down her cheeks. Curlicue understood that she was enchanted and that the hand in the box had belonged to her beloved.
        - id: ch02-b21
          speaker: narrator
          text: At that very moment, a huge Eagle flew into the room. In its talons it carried a Golden Branch. What looked like clusters of cherries grew upon it, but each separate cherry was a glowing ruby. The Eagle presented the branch to Curlicue. By now, the Prince understood that he had somehow been chosen to break the enchantment around the sleeping lady. He took the branch and touched her lightly with it.
        - id: ch02-b22
          speaker: prince_curlicue
          text: Fair lady, I do not know what spell holds you. But in the name of your beloved Florimond, I call you back to the life you lost but never forgot.
        - id: ch02-b23
          speaker: narrator
          text: At once, the lady opened her shining eyes and saw the Eagle hovering nearby.
        - id: ch02-b24
          speaker: fairy_douceline
          text: Oh, stay, my dear love! Please stay!
          emotion: sad
        - id: ch02-b25
          speaker: narrator
          text: The Eagle gave a sorrowful cry, beat its broad wings, and vanished. The lady turned to Curlicue.
        - id: ch02-b26
          speaker: fairy_douceline
          text: You have freed me from an enchantment that held me for two hundred years. Ask anything in return, and I will use all my fairy power to make you happy.
        - id: ch02-b27
          speaker: prince_curlicue
          text: Madam, let me restore your dear Florimond to his true form. I cannot forget the tears you shed for him.
        - id: ch02-b28
          speaker: fairy_douceline
          text: That is kind of you, dear Prince, but another person must restore him. I cannot tell you more yet. Is there truly nothing you want for yourself?
        - id: ch02-b29
          speaker: narrator
          text: Curlicue threw himself at her feet.
        - id: ch02-b30
          speaker: prince_curlicue
          text: Madam, only look at me. Everyone mocks my ugliness and calls me Curlicue. Please make me less ridiculous.
        - id: ch02-b31
          speaker: fairy_douceline
          text: Rise, Prince. Be as accomplished as you are handsome, and take the name Prince Peerless. No other title could suit you now.
        - id: ch02-b32
          speaker: narrator
          text: She touched him with the Golden Branch. Too joyful to speak, he kissed her hand. Then he rose and saw himself in the mirrors around the room. Curlicue was gone forever.
        - id: ch02-b33
          speaker: fairy_douceline
          text: I wish I could tell you what lies ahead and warn you about every trap in your path, but I am forbidden. Flee from this tower, Prince, and remember that Fairy Douceline will always be your friend.
        - id: ch02-b34
          speaker: narrator
          text: As she finished, the astonished Prince found himself far from the tower, in a thick forest at least a hundred leagues away. We must leave him there for a while and discover what happened elsewhere.
    - id: ch03
      title: Princess Cabbage-Stalk's Choice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That evening, Curlicue did not ask for his supper as he usually did. The guards went into his room and found it empty. Thoroughly alarmed, they searched every part of the tower, from the highest turret to the lowest dungeon, but found no trace of him. They knew King Grumpy would certainly have their heads cut off for allowing his son to escape. At last they agreed to pretend that the Prince was ill. They took the smallest guard, made him look as much like Curlicue as they could, tucked him into the Prince's bed, and sent word to the King.
        - id: ch03-b02
          speaker: narrator
          text: King Grumpy was delighted that his son was sick. He thought illness would make Curlicue obey him sooner. He ordered the guards to treat the Prince just as severely as before, which was exactly the answer they had hoped for.
        - id: ch03-b03
          speaker: narrator
          text: By then, Princess Cabbage-Stalk had arrived at the palace in a litter. King Grumpy came to meet her. Her skin reminded him of a tortoise. Thick eyebrows joined above her large nose, and her mouth stretched almost from ear to ear. The sight startled him into a cruel remark.
        - id: ch03-b04
          speaker: king_grumpy
          text: Curlicue may be ugly, but surely you had no reason to hesitate before agreeing to marry him.
        - id: ch03-b05
          speaker: princess_cabbage_stalk
          text: Sire, I know my appearance too well for your words to hurt me. But I do not want to marry your son. I would rather remain Princess Cabbage-Stalk than become Queen Curlicue.
        - id: ch03-b06
          speaker: narrator
          text: King Grumpy flew into a rage.
        - id: ch03-b07
          speaker: king_grumpy
          text: Your father sent you here to marry my son. I will not offend him by changing what he arranged.
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: The unhappy Princess was sent in disgrace to her rooms. Her attendants were ordered to change her mind.
        - id: ch03-b09
          speaker: narrator
          text: The guards were terrified that their trick would be discovered. At last they sent word that the King's son had died, which annoyed King Grumpy very much. He immediately decided that the death was entirely the Princess's fault and ordered her locked in the tower in Curlicue's place. Princess Cabbage-Stalk was astonished by such an unjust punishment. She sent protest after protest to the King, but his temper was so fierce that no one dared deliver them. She also wrote letters to her father, and no one dared send those either.
        - id: ch03-b10
          speaker: narrator
          text: The Princess did not know that every message had been stopped. She continued hoping that she would soon return to her own country and tried to amuse herself until that day arrived. Each day she walked up and down the long gallery. Before long, the ever-changing pictures in the windows caught her attention and held it. As she studied the moving scenes, she recognized herself among the painted figures.
        - id: ch03-b11
          speaker: princess_cabbage_stalk
          text: They seem to enjoy painting me in this country. Perhaps they put me and my crutch here just to make that slender young shepherdess beside me look even prettier. Oh, how lovely it would be to look like her.
        - id: ch03-b12
          speaker: narrator
          text: She glanced into a mirror, then quickly turned away with tears in her eyes. Suddenly she realized she was not alone. A tiny old woman stood behind her. She wore a cap, was twice as ugly as the Princess, and limped just as badly.
        - id: ch03-b13
          speaker: old_fairy
          text: Princess, your sorrow has brought me here. You must choose between goodness and beauty. If you choose beauty, you shall have it, but you will become vain, changeable, and foolish. Stay as you are, and you will grow wiser, kinder, and more modest.
        - id: ch03-b14
          speaker: princess_cabbage_stalk
          text: Oh, madam! Can no one be both wise and beautiful?
          emotion: sad
        - id: ch03-b15
          speaker: old_fairy
          text: Some can, child, but you are fated to choose. Here is my white-and-yellow muff. Breathe on the yellow side, and you will become the pretty shepherdess you admire. You will also win the love of the handsome shepherd whose picture has caught your eye. Breathe on the white side, and your looks will stay the same, but each day you will become better and happier. Now choose.
        - id: ch03-b16
          speaker: princess_cabbage_stalk
          text: Well, no one can have everything. It is surely better to be good than to be pretty.
        - id: ch03-b17
          speaker: narrator
          text: She breathed upon the white side and thanked the old Fairy, who vanished at once. Left alone, Princess Cabbage-Stalk felt very forlorn. She began to think it was time her father sent an army to rescue her.
        - id: ch03-b18
          speaker: princess_cabbage_stalk
          text: If only I could reach the turret and see whether anyone is coming.
        - id: ch03-b19
          speaker: narrator
          text: Climbing to the turret seemed impossible for someone who needed a crutch, but she soon devised a plan. She knew that the great clock itself stood high in the turret, while its heavy weights hung down into the gallery. The Princess removed one of those weights from its rope. Then she tied herself on in the weight's place. When someone wound the clock, the rope pulled her triumphantly all the way up into the turret.
        - id: ch03-b20
          speaker: narrator
          text: She first looked across the countryside. No one was coming, so she sat down to rest. By chance she leaned against the place Curlicue had hurriedly repaired. The loose stone tumbled out, followed by the golden key. Its clatter made her look down.
        - id: ch03-b21
          speaker: narrator
          text: After a moment's thought, she decided it must fit the curious cabinet in the corner, the one with no visible keyhole. Soon she had it open and was marveling at its treasures just as Curlicue had done. At last she reached the carbuncle box. The moment she opened it, she shuddered and tried to drop it. Some mysterious power forced her to hold on.
        - id: ch03-b22
          speaker: hidden_voice
          text: Take courage, Princess. Your future happiness depends upon this adventure.
          emotion: calm
        - id: ch03-b23
          speaker: princess_cabbage_stalk
          text: What must I do?
          emotion: fearful
        - id: ch03-b24
          speaker: hidden_voice
          text: Hide the box beneath your pillow. When you see an Eagle, give it to him at once.
        - id: ch03-b25
          speaker: narrator
          text: Though the Princess was terrified, she did not hesitate to obey. She hurried to hide the carbuncle box beneath her pillow. Before leaving the turret, she carefully returned every other precious object to exactly the place where she had found it. By that time, her guards were searching for her everywhere. They were amazed when they finally discovered her high in the turret. They could imagine no ordinary way she might have climbed there and said that she must have done it by magic.
        - id: ch03-b26
          speaker: narrator
          text: Three days passed. Then one night, something fluttered against her window. She drew back the curtains and saw an Eagle in the moonlight. Limping across the room as fast as she could, she opened the window. The great bird swept inside, beating its wings with joy.
        - id: ch03-b27
          speaker: narrator
          text: She offered it the carbuncle box without delay. The Eagle seized it in its talons and disappeared. In its place stood the most beautiful Prince she had ever seen, splendidly dressed and wearing a diamond crown.
        - id: ch03-b28
          speaker: florimond
          text: Princess, a wicked enchanter has held me here for two hundred years. He and I both loved the same Fairy, but she chose me. My rival was more powerful than I was. One moment when I was not on my guard, he changed me into an Eagle, while my Queen was left in an enchanted sleep. I knew that when two hundred years had passed, a Prince would call her back into the light of day. Then a Princess would restore the hand my enemy had cut off and, by doing so, give me back my natural form.
        - id: ch03-b29
          speaker: florimond
          text: The Fairy who guards your fate foretold it all. She led you to the cabinet where she had placed my hand. She also allows me to thank you by granting any favor you ask. Tell me what you desire most. Shall I make you as beautiful as you deserve to be?
        - id: ch03-b30
          speaker: princess_cabbage_stalk
          text: Oh, if you only would!
          emotion: happy
        - id: ch03-b31
          speaker: narrator
          text: At once she heard a crackling through every bone. She grew tall, straight, and lovely. Her eyes shone like stars, and her skin became white as milk.
        - id: ch03-b32
          speaker: princess_cabbage_stalk
          text: How wonderful! Can this truly be poor little me?
          emotion: surprised
        - id: ch03-b33
          speaker: narrator
          text: She stared in amazement at her tiny worn-out crutch lying on the floor.
        - id: ch03-b34
          speaker: florimond
          text: It truly is you, Princess. But your old name no longer fits. From now on, be Princess Sunbeam, because you are bright and charming enough to deserve it.
        - id: ch03-b35
          speaker: narrator
          text: With those words, Florimond vanished. Princess Sunbeam did not know what magic carried her away or how the journey happened. In the next moment, she found herself in another place entirely, walking beneath shady trees beside a clear and peaceful river.
    - id: ch04
      title: The Shepherdess and the Enchanter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Naturally, the first thing Sunbeam did was look at her reflection in the water. She was amazed to see that she looked exactly like the shepherdess she had admired so often in the painted windows. She even wore the same white dress and the same wreath of flowers. Then, as if to make the likeness complete, a flock of sheep appeared and began grazing around her. On the riverbank she found a bright shepherd's crook decorated with flowers.
        - id: ch04-b02
          speaker: narrator
          text: Worn out by so many wonders, she rested beneath a tree and fell sound asleep. This happened to be the same country where Prince Peerless had been placed. While Sunbeam slept, he came by, searching for a shady pasture for his own sheep.
        - id: ch04-b03
          speaker: narrator
          text: The moment Peerless saw the sleeping Princess, he recognized her as the charming shepherdess whose picture he had viewed again and again in the tower. She was far prettier than he remembered, and he was delighted that chance had brought him to that very spot. He was still standing nearby and admiring her when Sunbeam opened her eyes. She recognized him from the windows too. It was not long before the two of them had become great friends.
        - id: ch04-b04
          speaker: narrator
          text: She asked whether he knew a peasant who might give her lodging. Peerless told her about an old woman with a particularly pretty cottage. They went there together, and Sunbeam loved the old woman and everything about the place.
        - id: ch04-b05
          speaker: narrator
          text: The old woman soon laid supper for Sunbeam beneath a shady tree. The Princess invited Peerless to share the fresh cream and brown bread, and he gladly accepted. Before sitting down, he went to his own garden and gathered all the strawberries, cherries, nuts, and flowers he could find. He brought everything back to add to their feast. Then they sat beneath the tree, ate together, and passed a very merry evening.
        - id: ch04-b06
          speaker: narrator
          text: After that evening, they met every day while they guarded their flocks. They were so happy in one another's company that Peerless asked Sunbeam to marry him, so they would never have to part again. Sunbeam appeared to be nothing more than a poor shepherdess, but she never forgot that she was truly a Princess. She was not at all certain that a Princess ought to marry someone she believed was a humble shepherd. Even so, she knew very well that she wanted to marry him.
        - id: ch04-b07
          speaker: narrator
          text: Sunbeam decided to seek advice from an Enchanter she had heard a great deal about since becoming a shepherdess. He lived in a castle with his sister, who was herself a powerful Fairy. Sunbeam told no one where she meant to go. She simply set out to find the castle. The road was long and led through a thick wood. As she traveled, strange voices called to her from every side among the trees. She was in too much of a hurry to answer or investigate, so she never stopped.
        - id: ch04-b08
          speaker: narrator
          text: At last Sunbeam reached the courtyard of the Enchanter's castle. Grass and thorny brambles grew so high that the place seemed untouched for a hundred years. She pushed through them with great difficulty and collected many scratches before she finally reached the building. Inside, she entered a dark and gloomy hall. There were no bright windows. All the daylight had to creep through one tiny hole in the wall. Hangings made from bats' wings covered the walls, and twelve cats hung from the ceiling. Their piercing cries echoed through the shadowy hall without stopping.
        - id: ch04-b09
          speaker: narrator
          text: On the long table below, twelve mice had been fastened by their tails. Directly in front of each mouse's nose lay a tempting piece of fat bacon, but every morsel was placed just beyond reach. The cats above could always see the mice, though they could never touch them. The hungry mice were tormented in the same way. They could see and smell the delicious bacon every moment, but could never seize it. Sunbeam stood staring at all the poor creatures in horror and dismay.
        - id: ch04-b10
          speaker: narrator
          text: The Enchanter suddenly entered. He wore a long black robe and a crocodile upon his head. In one hand he carried a whip made from twenty living, twisting snakes. Sunbeam was so frightened that she wished with all her heart she had never come. She ran for the door without a word.
        - id: ch04-b11
          speaker: narrator
          text: A thick spiderweb covered the doorway. Sunbeam broke through it, only to find another web directly behind it. She tore through that one and found another, and then another. There seemed to be no end to them. She pulled and struggled until both her arms ached, but she came no closer to escaping from the hall. All the while, the wicked Enchanter stood behind her and laughed maliciously at her useless effort.
        - id: ch04-b12
          speaker: enchanter
          text: You could tear at those webs for the rest of your life and never get out. Still, you are young and prettier than anyone I have seen in a long while. Marry me, and I will give you those cats and mice as your own. They are princes and princesses who offended me. Once they loved one another as much as they hate each other now. Keeping them this way is a delightful revenge.
        - id: ch04-b13
          speaker: princess_cabbage_stalk
          text: Oh, please turn me into a mouse too!
        - id: ch04-b14
          speaker: enchanter
          text: So you refuse to marry me? Silly little thing, you could possess anything your heart desires.
        - id: ch04-b15
          speaker: princess_cabbage_stalk
          text: I certainly refuse. Nothing could make me marry you. I do not believe I shall ever love anyone at all.
        - id: ch04-b16
          speaker: enchanter
          text: Then you should become something that is neither fish nor bird. You shall be light as air and green as the grass where you live. Away with you, Madam Grasshopper!
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: He touched her, and Sunbeam became the prettiest little green Grasshopper in the world. Glad to be free, she hopped into the garden. Once she was safely outside, however, she began to pity herself.
        - id: ch04-b18
          speaker: princess_cabbage_stalk
          text: Oh, Florimond, is this how your gift ends? Beauty did not last long. Now I have this funny little face and a green gauze dress. I should have married my kind shepherd. My pride must have earned this punishment. I am condemned to sing day and night beside this brook when I would much rather cry.
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: Meanwhile, Peerless discovered that Sunbeam was gone. He mourned for her beside the river until he noticed a little old woman nearby. She wore an old-fashioned ruff and wide skirt, and a velvet hood covered her snow-white hair.
        - id: ch04-b20
          speaker: old_fairy
          text: You look sorrowful, my son. What troubles you?
        - id: ch04-b21
          speaker: prince_curlicue
          text: Alas, mother, I have lost my dear shepherdess. I will find her again, even if I must search the whole world.
          emotion: sad
        - id: ch04-b22
          speaker: old_fairy
          text: Take that path, my son. I believe you will catch up with her before long.
        - id: ch04-b23
          speaker: narrator
          text: Peerless thanked her warmly and set off. Nothing hindered him, and he soon entered the enchanted wood around the castle. Ahead among the trees, he thought he saw Princess Sunbeam. He ran after her as fast as he could, but never drew closer.
        - id: ch04-b24
          speaker: prince_curlicue
          text: Sunbeam, my darling! Wait just one moment for me!
        - id: ch04-b25
          speaker: narrator
          text: The phantom only fled faster. Peerless chased it in vain for the entire day. When night fell, he saw the castle blazing with light. Certain that Sunbeam must be inside, he hurried toward it.
        - id: ch04-b26
          speaker: narrator
          text: He entered easily and met a terrible old Fairy in the hall. She was so thin that light shone through her. Her eyes glowed like lamps, her skin was rough as a shark's, her arms were thin as wooden slats, and her fingers looked like spindles. Yet she wore rouge and beauty patches, a silver brocade mantle, and a diamond crown. Jewels and green-and-pink ribbons covered her gown.
        - id: ch04-b27
          speaker: queen_of_comets
          text: So you have finally come to visit me, Prince. Forget that little shepherdess. She is beneath your notice. I am the Queen of the Comets. Marry me, and I can raise you to great honor.
        - id: ch04-b28
          speaker: prince_curlicue
          text: Marry you, madam? Never. I will not agree to it.
        - id: ch04-b29
          speaker: narrator
          text: The Queen of the Comets flew into a rage. She struck twice with her wand, and the gallery filled with horrible goblins. Peerless had to fight for his life against the whole swarm. He carried no sword and had only his dagger to defend himself, but he fought so well that he escaped without a single injury. After a while, the old Fairy stopped the battle. She asked whether the attack had changed his mind. Peerless answered as firmly as before that he would never marry her.
        - id: ch04-b30
          speaker: narrator
          text: The Fairy made an image of Princess Sunbeam appear at the far end of the gallery.
        - id: ch04-b31
          speaker: queen_of_comets
          text: There stands your beloved. Think carefully. Refuse me once more, and two tigers will tear her to pieces.
        - id: ch04-b32
          speaker: narrator
          text: Peerless was frantic. He thought he heard his dear shepherdess weeping and begging him to save her. In despair, he called out.
        - id: ch04-b33
          speaker: prince_curlicue
          text: Fairy Douceline, have you abandoned me after promising to be my friend? Help us! Please help us now!
          emotion: fearful
        - id: ch04-b34
          speaker: hidden_voice
          text: Stand firm, whatever happens, and seek the Golden Branch.
          emotion: calm
        - id: ch04-b35
          speaker: narrator
          text: The soft voice in his ear gave Peerless courage. He still refused the Queen of the Comets.
        - id: ch04-b36
          speaker: queen_of_comets
          text: Leave my sight, you stubborn Prince! Become a Cricket!
          emotion: angry
        - id: ch04-b37
          speaker: narrator
          text: Instantly the handsome Peerless became a poor black Cricket. He might have thought of nothing but a warm crack beside a blazing hearth, but luckily he remembered Douceline's command to seek the Golden Branch. He hurried away from the dreadful castle and took shelter inside a hollow tree.
    - id: ch05
      title: The Golden Branch
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In one corner of the hollow tree, Peerless found a sad little Grasshopper, too miserable to sing. He did not expect any answer when he spoke to her.
        - id: ch05-b02
          speaker: prince_curlicue
          text: And where might you be going, Granny Grasshopper?
        - id: ch05-b03
          speaker: princess_cabbage_stalk
          text: Where are you going yourself, Grandpa Cricket?
        - id: ch05-b04
          speaker: prince_curlicue
          text: What? You can speak?
          emotion: surprised
        - id: ch05-b05
          speaker: princess_cabbage_stalk
          text: Why shouldn't I speak when you can? Is a Grasshopper any less worthy than a Cricket?
        - id: ch05-b06
          speaker: prince_curlicue
          text: I can talk because I used to be a Prince.
        - id: ch05-b07
          speaker: princess_cabbage_stalk
          text: Then I should talk even more than you, because I used to be a Princess.
        - id: ch05-b08
          speaker: prince_curlicue
          text: So the same thing happened to both of us. Where are you bound now? Could we travel together?
        - id: ch05-b09
          speaker: princess_cabbage_stalk
          text: I heard a voice in the air say, “Stand firm, whatever happens, and seek the Golden Branch.” I thought the command was meant for me, so I left at once, although I do not know the way.
        - id: ch05-b10
          speaker: narrator
          text: At that moment, two breathless mice rushed headfirst through the opening. They nearly crushed the Grasshopper and Cricket, who scrambled into a dark corner just in time.
        - id: ch05-b11
          speaker: elder_mouse
          text: Oh, madam, running so fast has given me a terrible pain in my side. And how is Your Highness feeling?
        - id: ch05-b12
          speaker: younger_mouse
          text: I pulled off my tail, but I would still be tied to the sorcerer's table if I had not. I cannot regret it. Do you think anyone followed us? How fortunate that we escaped!
        - id: ch05-b13
          speaker: elder_mouse
          text: I only hope we avoid cats and traps and reach the Golden Branch soon.
        - id: ch05-b14
          speaker: younger_mouse
          text: Then you know how to find it?
        - id: ch05-b15
          speaker: elder_mouse
          text: Oh yes, madam. I know the road as well as the way home. The Golden Branch is a true marvel. One leaf can make a person rich forever. It breaks enchantments and makes everyone who approaches it young and beautiful. We must leave at daybreak.
        - id: ch05-b16
          speaker: princess_cabbage_stalk
          text: May this respectable Cricket and I have the honor of going with you? We too are traveling in search of the Golden Branch.
        - id: ch05-b17
          speaker: narrator
          text: The two Mice agreed with great courtesy and welcomed the Grasshopper and Cricket into their party. After exchanging a great many polite speeches, all four settled down inside the hollow tree and fell asleep. They were awake again at the earliest light, ready to begin their journey. All along the way, the Mice feared that their pursuers might catch them or that they might stumble into a trap. In spite of those fears, the whole party reached the Golden Branch safely.
        - id: ch05-b18
          speaker: narrator
          text: The Golden Branch stood in the middle of a wondrous garden. Pearls as large as peas covered every path. The roses were crimson diamonds set among emerald leaves. Pomegranates shone like garnets, marigolds like topazes, and daffodils like yellow diamonds. The violets were sapphires, the cornflowers were turquoises, and the tulips gleamed with amethyst, opal, and diamond. Every garden bed flashed with precious stones, and the borders blazed as brightly as the sun.
        - id: ch05-b19
          speaker: narrator
          text: The Golden Branch had grown as tall as a forest tree. Ruby cherries glittered all the way to its highest twig. The instant the Grasshopper and Cricket touched it, their true forms returned. Their amazement turned to joy when Princess Sunbeam and Prince Peerless recognized one another.
        - id: ch05-b20
          speaker: narrator
          text: At that very moment, Florimond and Fairy Douceline appeared before the whole party in magnificent splendor. The Fairy stepped down from her splendid chariot with a smile.
        - id: ch05-b21
          speaker: fairy_douceline
          text: I see that you two have found each other again. But one surprise remains. Princess, do not be afraid to tell your devoted shepherd how dearly you love him. He is the very Prince your father sent you to marry. Come to me, both of you. I will crown you, and your wedding shall take place at once.
        - id: ch05-b22
          speaker: narrator
          text: The Prince and Princess thanked Douceline with all their hearts. They declared that every part of their happiness was due to her kindness and help. Then the two ladies who had so recently escaped in the forms of Mice came forward. They were truly Princesses as they had claimed. They begged Douceline to use her fairy power once more and release all their unfortunate friends who were still trapped in the Enchanter's castle under his spell.
        - id: ch05-b23
          speaker: fairy_douceline
          text: On such a happy day, I cannot bring myself to refuse you anything.
          emotion: happy
        - id: ch05-b24
          speaker: narrator
          text: Douceline struck the Golden Branch three times with her wand. At once, every prisoner in the Enchanter's castle found themselves free. They left the dreadful place and came with all possible speed to the marvelous garden. One after another, they touched the Golden Branch, and that single touch restored each captive to a natural form. Princes and Princesses recognized their old friends again, and everyone greeted one another with great rejoicing.
        - id: ch05-b25
          speaker: narrator
          text: Douceline had one more generous gift. She presented the rescued captives with the wonderful cabinet and every treasure inside it. Together, those riches were worth at least ten kingdoms. For Prince Peerless and Princess Sunbeam, she reserved the palace and the garden of the Golden Branch. The two made their home there. They were immensely rich, and all their subjects loved them dearly. In that splendid place, they lived happily ever after.
