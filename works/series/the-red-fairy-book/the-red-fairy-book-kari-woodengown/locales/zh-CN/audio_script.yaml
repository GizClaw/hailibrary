audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和郑重，带着向读者介绍全书的亲切口吻
        timbre: 温暖清晰
        pace: 从容舒展
        pitch: 中等
    princess:
      display_name: 王女卡丽
      tts:
        delivery: 善良坚忍，从忧伤怯弱渐渐变得沉着坚定
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高
    blue_bull:
      display_name: 蓝公牛
      tts:
        delivery: 忠厚沉稳，危急时果断无畏
        timbre: 低沉温暖
        pace: 稍慢
        pitch: 低
    troll_three:
      display_name: 三头巨怪
      tts:
        delivery: 暴躁凶狠，叫喊尖厉
        timbre: 粗粝刺耳
        pace: 稍快
        pitch: 中低
    troll_six:
      display_name: 六头巨怪
      tts:
        delivery: 狂怒好斗，语气咄咄逼人
        timbre: 浑厚粗哑
        pace: 稍快
        pitch: 低
    troll_nine:
      display_name: 九头巨怪
      tts:
        delivery: 可怖威严，怒吼带着压迫感
        timbre: 深沉轰鸣
        pace: 适中
        pitch: 极低
    cook:
      display_name: 厨师
      tts:
        delivery: 直率粗声，对新来的帮工不抱希望
        timbre: 厚实明亮
        pace: 适中
        pitch: 中低
    kitchen_worker_1:
      display_name: 厨房仆人甲
      tts:
        delivery: 爱取笑人，说话爽利刻薄
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    kitchen_worker_2:
      display_name: 厨房仆人乙
      tts:
        delivery: 势利多嘴，遇事喜欢随声附和
        timbre: 尖细清晰
        pace: 稍快
        pitch: 高
    prince:
      display_name: 王子
      tts:
        delivery: 起初傲慢急躁，后来痴情执着而真诚
        timbre: 清朗有力
        pace: 适中
        pitch: 中等
    rock_man:
      display_name: 岩中人
      tts:
        delivery: 平静简洁，仿佛早已知道来意
        timbre: 稳重清晰
        pace: 稍慢
        pitch: 中低
    bird:
      display_name: 小鸟
      tts:
        delivery: 清亮警醒，用歌声揭穿骗局
        timbre: 轻盈清脆
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 蓝公牛带她出逃
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，王后去世后，只给他留下一个女儿。王女聪慧又美丽，世上再难找到第二个。国王深爱妻子，失去她以后，长久沉浸在悲伤里。后来，他渐渐厌倦了独自生活，便娶了一位寡居的王后。新王后也带来一个女儿，可那姑娘长得有多丑陋，心肠就有多恶毒，正好和善良美丽的王女相反。
        - id: ch01-b02
          speaker: narrator
          text: 母女俩一看见王女的美貌便满心嫉妒。国王在宫里时，她们不敢伤害他疼爱的女儿。可战争一来，国王离开王宫，出征攻打另一位国王，新王后便再没有顾忌。她不给王女饭吃，还常常打她，把她从这间屋撵到那间屋，不许她有安身之处。最后，王后觉得什么好东西都不配给她，竟叫她去田野和树林里照管牛群。
        - id: ch01-b03
          speaker: narrator
          text: 王女每天跟着牛群四处放牧，却几乎没有东西吃。她渐渐变得苍白消瘦，总是伤心落泪。牛群中有一头高大的蓝公牛，皮毛总是洁净油亮。它常常主动来到王女身边，安静地让她抚摸。有一天，它又看见王女独自坐着哭，便问她为何总有那么多忧愁。王女仍旧没有回答，只是继续流泪。
        - id: ch01-b04
          speaker: blue_bull
          text: 你不说，我也明白。王后苛待你，还想让你活活饿死。不过，吃的不用发愁。我的左耳里藏着一块餐布。你把它拿出来铺好，想吃什么，餐布上就会有什么。
        - id: ch01-b05
          speaker: narrator
          text: 王女照它的话去做，草地上的餐布立刻摆满精美菜肴，还有葡萄酒、蜂蜜酒和糕饼。从此，她恢复了精神，脸色红润，身体也丰满起来，显得更加美丽。王后和她那瘦巴巴的女儿看在眼里，气得脸上一阵青一阵白。
        - id: ch01-b06
          speaker: narrator
          text: 王后越想越不明白。继女每天只能吃到那样糟糕的饭食，怎么反倒越来越健康？她认定有仆人在暗中送食物，便命一个侍女跟进树林，躲起来看个究竟。侍女亲眼看见王女从蓝公牛耳中取出餐布，又看见餐布一铺开便盛满美味。王女坐在那里尽情享用，侍女则悄悄溜回宫，把一切都报告给王后。
        - id: ch01-b07
          speaker: narrator
          text: 不久，国王打败敌人，凯旋而归。王宫里人人欢喜，王女尤其高兴。王后却躺下来装病。她用重金买通医生，要医生说，除非让她吃到蓝公牛的肉，否则这病永远不会好。王女和宫里所有喜爱蓝公牛的人都来询问，难道真没有别的救命办法？他们说，全国再也找不出这样好的公牛，又苦苦请求留下它的性命。可医生坚持说，除此之外别无办法，蓝公牛非杀不可。
        - id: ch01-b08
          speaker: narrator
          text: 王女悲痛地跑进牛棚。蓝公牛也垂着头，显得十分沮丧。她伏在它身上哭了起来。
        - id: ch01-b09
          speaker: blue_bull
          text: 你为什么这样伤心？
        - id: ch01-b10
          speaker: princess
          text: 父王回来了，可王后假装生病，还让医生说，她非吃你的肉不可。现在，他们就要来杀你了。
          emotion: sad
        - id: ch01-b11
          speaker: blue_bull
          text: 他们取了我的性命，很快也会来害你。你若愿意听我的，咱们就在今晚离开。
        - id: ch01-b12
          speaker: narrator
          text: 王女舍不得丢下父亲，可她更害怕留在王后身边，于是答应了。夜深后，所有人都睡了，她悄悄来到牛棚，骑上蓝公牛的背。蓝公牛迅速逃出宫院，带她远远离去。
        - id: ch01-b13
          speaker: narrator
          text: 第二天清晨，公鸡刚叫，人们便来到牛棚，准备宰杀蓝公牛，眼前却只剩一间空牛棚。国王起床后询问女儿在哪里，才发现她也不见了。他立即派出使者，让他们到王国的每个地方寻找，还叫各个教区的教堂都公告自己失去女儿的消息。可无论怎样搜寻，也没有一个人见过王女和蓝公牛。
    - id: ch02
      title: 铜树林与银树林
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蓝公牛驮着王女穿过许多国度。有一天，他们来到一片辽阔的铜树林。树干、枝条、叶片、花朵，目光所及的一切，全是铜做的。
        - id: ch02-b02
          speaker: blue_bull
          text: 进去以后，千万别碰这里的一片叶子。树林的主人是住在这里的三头巨怪。只要你碰了它的东西，咱们俩都要遭殃。
        - id: ch02-b03
          speaker: narrator
          text: 王女答应处处留神。她弯腰躲着枝条，又伸手轻轻推开挡路的树枝。可是林木密得几乎无法通行。无论她多么小心，最后还是扯下一片铜叶，落进手中。
        - id: ch02-b04
          speaker: blue_bull
          text: 哎呀，你怎么还是碰掉了一片！现在只能拼死打一场了。记住，这片叶子一定要收好。
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 他们刚到树林尽头，三头巨怪便猛冲过来。
        - id: ch02-b06
          speaker: troll_three
          text: 谁敢乱碰我的树林？
          emotion: angry
        - id: ch02-b07
          speaker: blue_bull
          text: 这树林既是你的，也是我的！
        - id: ch02-b08
          speaker: troll_three
          text: 那就较量一下，看它到底归谁！
          emotion: angry
        - id: ch02-b09
          speaker: blue_bull
          text: 来吧。
        - id: ch02-b10
          speaker: narrator
          text: 它们迎面撞上，厮杀了一整天。蓝公牛用尽全身力气，拿角一次次猛顶，又用蹄子狠踢，三头巨怪也打得和它一样凶猛。直到一天过去，蓝公牛才终于取了对手的性命。可它自己也遍体鳞伤，力气完全耗尽，连挪动身体都变得十分困难。
        - id: ch02-b11
          speaker: narrator
          text: 他们只好在那里停留一天。蓝公牛告诉王女，巨怪腰带上挂着一只盛药膏的角，让她取下来，把药仔细擦遍自己的伤口。王女照办以后，蓝公牛很快恢复了原来的模样。到了第二天，它又驮上王女，继续赶路。
        - id: ch02-b12
          speaker: narrator
          text: 许多天以后，他们来到一片银树林。那里的树木、枝杈、花叶，还有周围的一切，全都由银子做成。
        - id: ch02-b13
          speaker: blue_bull
          text: 看在上天的份上，这次什么都别碰，连一片叶子也不行。六头巨怪是这里的主人，它比先前那个强大一倍，我怕自己胜不了它。
        - id: ch02-b14
          speaker: princess
          text: 你不许我碰的东西，我一定仔细避开。
        - id: ch02-b15
          speaker: narrator
          text: 可银树林比铜树林更拥挤，树木之间几乎没有空隙。王女弯着身子躲闪，还用手推开迎面的枝条，可树枝不断抽打她的眼睛。她万分谨慎，到底还是失手扯下了一片银叶。
        - id: ch02-b16
          speaker: blue_bull
          text: 哎呀，这下又得拿性命去战斗了！六头巨怪有先前那个两倍的力气。你先把银叶仔细收好。
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: 蓝公牛的话才说完，六头巨怪就出现在面前。
        - id: ch02-b18
          speaker: troll_six
          text: 是谁动了我的树林？
          emotion: angry
        - id: ch02-b19
          speaker: blue_bull
          text: 它不只属于你，我也有一份！
        - id: ch02-b20
          speaker: troll_six
          text: 那就用一场恶战来分个明白！
          emotion: angry
        - id: ch02-b21
          speaker: blue_bull
          text: 正合我意。
        - id: ch02-b22
          speaker: narrator
          text: 蓝公牛冲上去，先顶瞎巨怪的眼睛，又把双角深深刺穿它的身体，连肚肠都涌了出来。可六头巨怪还是和它打得一样凶猛。这场战斗从白天打到黑夜，又从黑夜打到白天，整整持续了三天。蓝公牛终于夺走它的性命时，自己已经虚弱得站立不稳。伤口布满全身，鲜血不断流下，每动一下都痛苦万分。
        - id: ch02-b23
          speaker: narrator
          text: 王女依照吩咐，取下巨怪腰间的药膏角，仔细涂遍蓝公牛的身体。它这才慢慢恢复过来，却仍然走不了。他们只能留在原地。一天又一天过去，整整休养了一周，蓝公牛才有力气继续赶路。
    - id: ch03
      title: 金树林与最后的嘱托
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 蓝公牛依旧虚弱，只能慢慢走。王女说自己年轻，脚步也轻，愿意下来步行，不再累着它。蓝公牛却不肯，她只得坐回它背上。他们穿过一个又一个国度，终于来到一片金光四溢的树林。那里的纯金仿佛会从枝叶上滴落。
        - id: ch03-b02
          speaker: narrator
          text: 蓝公牛告诉她，这里属于九头巨怪。那怪物比先前两个加起来还要强大，自己恐怕无法取胜。王女郑重答应，这次绝不会碰任何东西。
        - id: ch03-b03
          speaker: narrator
          text: 然而金树林比银树林更加稠密。他们越往深处走，前方的路便越难找，枝条也越挤越紧。最后，王女觉得这里根本没有能够通过的空隙。她生怕折断什么，吓得在牛背上左躲右闪，一会儿扭向这边，一会儿转到那边。她伸手推开不断打向眼睛的树枝，根本看不清自己抓住了什么。等她回过神来，一个金苹果已经握在手里。
        - id: ch03-b04
          speaker: narrator
          text: 王女惊恐地哭了，想赶紧把苹果扔掉。蓝公牛叫她留下，好好保管，还竭力安慰她。可是它心里明白，前面会是一场可怕的苦战，自己未必能活下来。
        - id: ch03-b05
          speaker: narrator
          text: 九头巨怪就在这时出现了。它的模样恐怖得叫王女不敢抬眼。
        - id: ch03-b06
          speaker: troll_nine
          text: 是谁折断了我的树林？
          emotion: angry
        - id: ch03-b07
          speaker: blue_bull
          text: 这树林是你的，也是我的！
        - id: ch03-b08
          speaker: troll_nine
          text: 那就来一场你死我活的较量！
          emotion: angry
        - id: ch03-b09
          speaker: blue_bull
          text: 来吧。
        - id: ch03-b10
          speaker: narrator
          text: 双方猛扑过去，恶战立刻开始。那场面太可怕，王女看得险些昏倒。蓝公牛顶瞎巨怪的眼睛，又用角贯穿它的身躯。可是每当它顶死一个脑袋，其余脑袋就一齐朝那颗头吹进生气，让它重新活过来。蓝公牛只得一次又一次重新战斗。它们就这样足足打了一周，九头巨怪才终于倒下，再也没能站起来。
        - id: ch03-b11
          speaker: narrator
          text: 蓝公牛也耗尽了最后一丝力气。它全身像一整片裂开的伤口，连一句话都说不出来。王女不等吩咐，便从巨怪腰间取下药膏角，为它涂药。蓝公牛醒了，却又躺了三个星期，才勉强能够行动。
        - id: ch03-b12
          speaker: narrator
          text: 他们缓缓翻过高山，穿过密林，来到荒凉的高原。
        - id: ch03-b13
          speaker: blue_bull
          text: 你看见什么了吗？
        - id: ch03-b14
          speaker: princess
          text: 除了天空和荒野的山坡，我什么也没看见。
        - id: ch03-b15
          speaker: narrator
          text: 他们继续往更高的地方攀登，脚下的山地渐渐平坦，四周也看得越来越远，视野终于开阔起来。
        - id: ch03-b16
          speaker: blue_bull
          text: 现在呢？
        - id: ch03-b17
          speaker: princess
          text: 远处有一座小小的城堡。
        - id: ch03-b18
          speaker: blue_bull
          text: 它其实一点也不小。
        - id: ch03-b19
          speaker: narrator
          text: 他们又走了很久很久，远处那座小城堡也一点点显出真正的大小。最后，他们来到一座高山脚下，面前耸立着一道十分陡峭的岩壁。
        - id: ch03-b20
          speaker: blue_bull
          text: 这回看见了吗？
        - id: ch03-b21
          speaker: princess
          text: 看见了。城堡就在近处，原来这么大。
        - id: ch03-b22
          speaker: blue_bull
          text: 你要去那里。城堡下方有座猪圈，里面放着一件木衣。穿上它，再去宫里找活儿，就说你叫卡丽木衣姑娘。现在，你得用小刀割下我的头，剥下我的皮，把牛皮卷好藏在岩石下。铜叶、银叶和金苹果都压在下面。岩边有根木棍。往后需要我时，就拿它敲敲岩壁。
        - id: ch03-b23
          speaker: narrator
          text: 王女起初无论如何也不肯。蓝公牛却说，它为她做了这么多事，只想用这种方式得到回报。她再没有办法拒绝。尽管觉得这件事残忍得难以忍受，她还是拿起那把小刀，费尽力气，一下又一下地割着这头庞然大物，直到割下蓝公牛的头，又剥下它的皮。随后，她把牛皮折好放在岩壁下，再将铜叶、银叶和金苹果一起藏进牛皮里面。
        - id: ch03-b24
          speaker: narrator
          text: 做完这一切，王女向城堡下方的猪圈走去。她一路不停哭泣，心里充满了悲伤。到了猪圈，她找到蓝公牛所说的木衣，把它套在身上。随后，她独自走进王宫厨房，自称卡丽木衣姑娘，请求留在那里做工。
        - id: ch03-b25
          speaker: cook
          text: 先前洗碗的姑娘刚走，你正好接她的活儿。等你哪天干腻了，想必也会一走了之。
        - id: ch03-b26
          speaker: princess
          text: 不，我绝不会那样。
        - id: ch03-b27
          speaker: narrator
          text: 卡丽说到做到。她把碗碟和厨房都收拾得十分整洁。
    - id: ch04
      title: 铜裙姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了星期日，几位客人要来王宫。厨房里忙着为众人做准备，卡丽听说还得有人把洗澡水送到王子房里，便一次次请求，让她接下这份差事。
        - id: ch04-b02
          speakers: [kitchen_worker_1, kitchen_worker_2]
          ensemble: duo
          text: 你去做什么？难道王子会愿意看你这个丑八怪？
        - id: ch04-b03
          speaker: narrator
          text: 卡丽一再恳求，终于得到许可。她走上楼梯，木衣一路咔啦作响。王子闻声走了出来。
        - id: ch04-b04
          speaker: prince
          text: 你到底是个什么怪东西？
        - id: ch04-b05
          speaker: princess
          text: 我来给您送洗澡水。
        - id: ch04-b06
          speaker: prince
          text: 你送来的水，我怎么可能会用？
        - id: ch04-b07
          speaker: narrator
          text: 王子把水全泼在她身上。卡丽默默忍住，又请求去附近的教堂，厨房里的人答应了。她没有立刻去教堂，而是先来到岩壁前，用那根木棍轻轻一敲。一个男人当即从岩石里走了出来。
        - id: ch04-b08
          speaker: rock_man
          text: 你需要什么？
        - id: ch04-b09
          speaker: princess
          text: 他们准我去教堂听牧师讲道，可我没有合适的衣裳。
        - id: ch04-b10
          speaker: narrator
          text: 男人给她一条像铜树林般明亮的长裙，又牵来一匹备好马鞍的骏马。卡丽来到教堂时，美得叫人不敢相信，衣着也无比华丽。每个人都在暗暗猜测她究竟是谁，几乎没人再听牧师说什么。王子尤其喜欢她，眼睛始终追随着她，连一刻也舍不得移开。
        - id: ch04-b11
          speaker: narrator
          text: 卡丽走出教堂时，王子紧紧跟在她后面，又把门关上，借机将她的一只手套留在自己手中。卡丽没有停留，径直走过去，重新骑上马。王子仍不肯放弃，又一路追到马前，询问这位陌生小姐到底来自哪里。
        - id: ch04-b12
          speaker: princess
          text: 我从浴水国来。
        - id: ch04-b13
          speaker: narrator
          text: 王子拿出手套，想交还给她。卡丽念起咒语。
        - id: ch04-b14
          speaker: princess
          text: 黑暗留在我身后，光明照亮我前方，莫让王子看见我今日去往何乡！
        - id: ch04-b15
          speaker: narrator
          text: 她立刻消失在王子的视线里。王子从未见过那样精美的手套。他带着手套走了许多地方，到处询问浴水国在哪里，又打听那位骄傲的小姐去了何方。可是无论问谁，都没有一个人知道世上还有这样一个国家。
    - id: ch05
      title: 银裙姑娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 下个星期日，该有人给王子送毛巾了。卡丽又请求让她上楼。
        - id: ch05-b02
          speakers: [kitchen_worker_1, kitchen_worker_2]
          ensemble: duo
          text: 去了有什么用？你忘了上次挨的那一下吗？
        - id: ch05-b03
          speaker: narrator
          text: 卡丽始终不肯罢休，不断央求，终于还是拿到了毛巾。她抱着它跑上楼梯，木衣又咔啦咔啦地响个不停。王子听见声音走出来，一看送东西的又是卡丽，便从她手里夺过毛巾，劈面扔了回去。
        - id: ch05-b04
          speaker: prince
          text: 你这个丑陋的巨怪，马上滚开！你那双脏手碰过的毛巾，我才不会用！
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: 王子动身去教堂以后，卡丽也请求外出。众人笑她只穿着又黑又难看的木衣，去了也不能见人。
        - id: ch05-b06
          speaker: princess
          text: 牧师讲得那么好，他说的话对我很有益处，我还是想去听一听。
        - id: ch05-b07
          speaker: narrator
          text: 他们终于准了。卡丽来到岩壁前敲了敲，岩中人给她一条绣满银丝的长裙，光芒和银树林一样耀眼。他又送来一匹漂亮的马，马衣绣着银线，连辔头也用银子制成。
        - id: ch05-b08
          speaker: narrator
          text: 她到达时，众人都站在教堂外的山坡上。所有人都惊奇地望着她，谁也猜不出这位陌生小姐究竟是谁。王子一看见她便打起精神，马上迎上前去，伸手想替她扶住马匹，好让她安稳地下马。
        - id: ch05-b09
          speaker: princess
          text: 不用劳烦。我这匹马很听话，叫它停，它就不动。我一唤，它就回来。
        - id: ch05-b10
          speaker: narrator
          text: 大家一起进了教堂。仍然没什么人留心布道，他们的目光全在卡丽身上。王子也比上一回爱她更深。布道结束后，他再次追到正要上马的卡丽身边。
        - id: ch05-b11
          speaker: prince
          text: 请告诉我，你究竟来自哪里？
        - id: ch05-b12
          speaker: princess
          text: 我从毛巾国来。
        - id: ch05-b13
          speaker: narrator
          text: 卡丽故意掉下马鞭。趁王子低头去捡，她念道。
        - id: ch05-b14
          speaker: princess
          text: 黑暗留在我身后，光明照亮我前方，莫让王子看见我今日去往何乡！
        - id: ch05-b15
          speaker: narrator
          text: 王子抬起头时，她已经无影无踪，连去了哪个方向也看不出来。他又走遍许多地方，见人便问毛巾国在哪里，仍然没人说得出那个国家的方位。找来找去毫无结果，他只能回到宫中，耐心等待下一次机会。
    - id: ch06
      title: 金裙与金鞋
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 再下一个星期日，有人要给王子送梳子。卡丽又来请求。厨房里的人数落她，说她又黑又丑，上回已经受过羞辱，何必还让王子看见。
        - id: ch06-b02
          speaker: narrator
          text: 卡丽始终不放弃，终于把梳子送上楼。王子出来接过梳子，立刻朝她扔去，还命她赶快离开。等王子去了教堂，卡丽也再次告假。
        - id: ch06-b03
          speakers: [kitchen_worker_1, kitchen_worker_2]
          ensemble: duo
          text: 你没有一件能见人的衣服。要是王子或别人看见你，连我们都要跟着受罚！
        - id: ch06-b04
          speaker: princess
          text: 大家都有自己的事要做，不会只盯着我看。
        - id: ch06-b05
          speaker: narrator
          text: 她好不容易得到许可，又来到岩石前。岩中人这次拿出的长裙远比前两条华丽，几乎全由纯金和钻石做成。他还给她一匹高贵的马，配着金线绣成的马衣和金辔头。
        - id: ch06-b06
          speaker: narrator
          text: 卡丽来到教堂时，连牧师也和众人一起站在山坡上等她。大家显然都在盼着那位神秘小姐再次出现。王子一看见金光闪耀的她，立刻飞快跑过去，伸手要替她牵住马匹。
        - id: ch06-b07
          speaker: princess
          text: 不必了，谢谢您。只要我开口吩咐，我的马就会乖乖站住。
        - id: ch06-b08
          speaker: narrator
          text: 众人匆忙走进教堂。牧师登上讲坛，可谁也没听进去一个字。所有人都在看卡丽，猜她来自哪里。王子比前两回更加痴迷，心里再也装不下别的事。
        - id: ch06-b09
          speaker: narrator
          text: 王子事先叫人在门廊里倒了一小桶焦油。他以为卡丽经过时一定需要帮助，自己便能上前扶她。可卡丽丝毫不把焦油放在心上，一脚踏进正中央，随即纵身跳了过去。一只金鞋就这样粘在焦油里，她却已经来到马旁，翻身坐了上去。王子拿起那只鞋，匆匆追出教堂。
        - id: ch06-b10
          speaker: prince
          text: 你这次又是从哪里来的？
        - id: ch06-b11
          speaker: princess
          text: 从梳子国来。
        - id: ch06-b12
          speaker: narrator
          text: 王子想把金鞋还给她，卡丽已经念出了那句咒语。
        - id: ch06-b13
          speaker: princess
          text: 黑暗留在我身后，光明照亮我前方，莫让王子看见我今日去往何乡！
        - id: ch06-b14
          speaker: narrator
          text: 她又消失了，王子完全看不出她去了哪里。为了寻找梳子国，他踏上漫长而疲惫的旅途，走遍世界，沿途不停询问，却始终一无所获。最后，他只好带着那只金鞋回宫，并向四方宣告，不论是谁，只要能把它穿上，他就娶她为妻。
    - id: ch07
      title: 穿上金鞋的新娘
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 消息传开以后，各地的姑娘纷纷赶来，有美的，也有丑的。她们一个接一个试穿，可金鞋实在太小，谁也穿不进去。过了很久，卡丽那恶毒的继母终于带着亲生女儿赶来。金鞋竟然套上了继姐的脚。可是她相貌丑陋，神情更叫人厌恶，王子看着这个所谓的新娘，实在不愿履行自己的承诺。
        - id: ch07-b02
          speaker: narrator
          text: 尽管如此，王子已经当众许诺，婚礼的一切还是准备起来。继姐穿上新娘的礼服，同王子一起骑马前往教堂。队伍走在路上时，一只小鸟忽然落在旁边的树枝上，对着他们唱出一首歌。
        - id: ch07-b03
          speaker: bird
          text: 脚后跟削掉一片，脚趾头又削一片，卡丽木衣姑娘的鞋，一路盛满血鲜鲜！
        - id: ch07-b04
          speaker: narrator
          text: 众人赶紧低头检查那只金鞋。小鸟果然没有说错，鲜血正从鞋边一滴滴流出来。于是，所有侍女和城堡里的女人都被叫来试穿这只鞋。她们一个接一个地试过，还是没有任何人穿得合脚。
        - id: ch07-b05
          speaker: prince
          text: 卡丽木衣姑娘呢？怎么没有叫她来？
        - id: ch07-b06
          speaker: narrator
          text: 王子听得懂鸟语，此刻终于想起了小鸟歌里的名字。
        - id: ch07-b07
          speakers: [kitchen_worker_1, kitchen_worker_2]
          ensemble: duo
          text: 那个怪东西来有什么用？她的一双脚简直像马蹄！
        - id: ch07-b08
          speaker: prince
          text: 就算是这样，别人都试过了，也该让卡丽试试。
        - id: ch07-b09
          speaker: prince
          text: 卡丽，到这里来！
        - id: ch07-b10
          speaker: narrator
          text: 卡丽沿楼梯走上来，木衣发出震天的咔啦声，听着像一整团龙骑兵正在冲上楼。
        - id: ch07-b11
          speakers: [kitchen_worker_1, kitchen_worker_2]
          ensemble: duo
          text: 快来穿金鞋呀，穿上它，你就是王妃啦！
        - id: ch07-b12
          speaker: narrator
          text: 仆人们笑着拿她取乐。卡丽拿起金鞋，脚轻轻一伸，鞋便稳稳穿上了。她随即脱掉木衣，露出那条光芒如阳光般灿烂的金裙。她另一只脚上，正穿着与金鞋成对的那一只。
        - id: ch07-b13
          speaker: narrator
          text: 王子立刻认出她，欢喜地奔过去，把她紧紧抱进怀里，亲吻着她。听说卡丽本来就是一位王女，他更是喜出望外。随后，他们举行了婚礼。
        - id: ch07-b14
          speaker: narrator
          text: 这个故事采自P·C·阿斯比约恩森。
