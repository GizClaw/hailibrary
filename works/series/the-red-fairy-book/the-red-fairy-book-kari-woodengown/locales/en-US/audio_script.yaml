  chapters:
    - id: ch01
      title: The Blue Bull
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King whose wife had died. She left him one daughter, and no one could have been wiser or prettier. The King had loved his wife dearly, and for a long time he did nothing but mourn her. At last he grew tired of living alone. He married a widowed Queen who had a daughter of her own. That daughter was as ill-favored and wicked as the King's daughter was good and beautiful. The new Queen and her child both envied the girl for her beauty. Yet while the King remained at home, they dared not harm her, because they knew how much he loved her.
        - id: ch01-b02
          speaker: narrator
          text: Then the King went away to make war on another king. As soon as he was gone, the Queen believed she could do whatever she pleased. She starved the girl, beat her, and chased her into every corner. Before long, the Queen decided even the poorest comforts were too good for her. She sent the girl out to tend the cattle in the woods and fields. There she wandered with the herd all day. She received little food or none at all, until she grew pale and thin. Most of the time she was sad and weeping.
        - id: ch01-b03
          speaker: narrator
          text: One animal in the herd was a great blue bull, always sleek and handsome. He often came near and let her stroke him. One day he found her crying again and asked what troubled her, but she could not answer.
        - id: ch01-b04
          speaker: blue_bull
          text: You don't have to tell me. I know you're crying because the Queen treats you cruelly and means to starve you. But you needn't worry about food. There is a cloth inside my left ear. Take it out and spread it on the ground, and you may have all the dishes you want.
          emotion: calm
        - id: ch01-b05
          speaker: narrator
          text: The girl reached into the Bull's left ear, took out the cloth, and spread it on the grass. At once it was covered with the finest dishes anyone could wish for. There was wine and mead, and there was cake as well. She ate her fill. From then on she grew lively and healthy again. Soon she was rosy, plump, and fair, which made the Queen and her thin daughter turn blue and white with spite.
        - id: ch01-b06
          speaker: narrator
          text: The Queen could not understand how her stepdaughter looked so well while being given such miserable food. She suspected that one of the palace servants was secretly feeding her. To discover the truth, she ordered a handmaid to follow the girl into the wood and watch closely. The maid hid among the trees. She saw the girl draw the cloth from the Blue Bull's ear and spread it out. She saw the delicate dishes appear, and watched the girl enjoy her feast. Then the maid went home and told the Queen exactly what she had seen.
        - id: ch01-b07
          speaker: narrator
          text: Now the King returned home after defeating the king he had fought. There was great rejoicing throughout the palace, and no one was happier than his daughter. The Queen, however, lay down and pretended to be ill. She gave the doctor a large sum of money and told him what he must say about her sickness.
        - id: ch01-b08
          speaker: doctor
          text: The Queen will never recover unless she eats some flesh from the Blue Bull.
        - id: ch01-b09
          speaker: narrator
          text: The King's daughter and the people of the palace begged the doctor to find some other way to save the Queen. They pleaded for the Bull's life, because everyone was fond of him. They declared that no other bull in the whole country could equal him. Their pleading was useless. The Queen would accept no other cure. The Blue Bull had been sentenced to die, and die he must.
        - id: ch01-b10
          speaker: narrator
          text: The girl went weeping to the byre. The Bull stood with his head hanging low.
        - id: ch01-b11
          speaker: blue_bull
          text: Why are you crying?
        - id: ch01-b12
          speaker: girl
          text: Father has come home, but the Queen is only pretending to be ill. She paid the doctor to say that nothing can save her except your flesh. Now they're going to kill you.
          emotion: sad
        - id: ch01-b13
          speaker: blue_bull
          text: Once they have killed me, they will soon kill you too. If you agree, we must leave tonight.
        - id: ch01-b14
          speaker: narrator
          text: The girl thought it was a terrible thing to leave her father behind. But she knew it was worse to remain in the same house as the Queen, so she promised to go. That night, after everyone else had gone to bed, she crept softly down to the byre. The Bull lifted her onto his back and carried her out of the courtyard as quickly and quietly as he could.
        - id: ch01-b15
          speaker: narrator
          text: At cockcrow, the people came to kill the Bull and found him gone. When the King rose, his daughter was missing too. He sent messengers through every part of the kingdom and had the loss announced in every parish church. No one had seen either traveler.
    - id: ch02
      title: The Three Forests
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the Bull carried the King's daughter through one land after another. She rode safely on his back for many days. At last they came to a great copper forest. Its trees were copper, its branches and leaves were copper, and every flower and every other thing within it was made of copper too.
        - id: ch02-b02
          speaker: blue_bull
          text: Be very careful in this wood. Don't touch even one leaf. A three-headed Troll owns this place, and if anything is broken, it may be the end of us both.
        - id: ch02-b03
          speaker: narrator
          text: She promised to be on her guard and touch nothing. Once they entered, she watched every branch. She bent her body out of the way and carefully pushed the branches aside with her hands. But the trees grew so thickly that moving forward was almost impossible. Whatever she did, a copper leaf somehow tore loose and came away in her hand.
        - id: ch02-b04
          speaker: blue_bull
          text: Oh, what have you done? Now I must fight for both our lives. Keep that leaf safe.
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: At the forest's edge, the three-headed Troll rushed toward them.
        - id: ch02-b06
          speaker: three_headed_troll
          text: Who has dared to touch my wood?
          emotion: angry
        - id: ch02-b07
          speaker: blue_bull
          text: This wood belongs as much to me as it does to you.
        - id: ch02-b08
          speaker: three_headed_troll
          text: Then we'll fight for it!
          emotion: angry
        - id: ch02-b09
          speaker: blue_bull
          text: So be it.
        - id: ch02-b10
          speaker: narrator
          text: They rushed at each other. The Bull drove forward with his horns and kicked with all the strength in his body, while the Troll struck back just as fiercely. They fought from morning onward, and the whole day was gone before the Bull finally killed him. By then the Bull was covered in wounds and so exhausted that he could scarcely move. They had to remain there. He told the girl to take the horn of ointment hanging from the Troll's belt and rub it over him. She did, and his strength returned. After a full day of rest, they set out again.
        - id: ch02-b11
          speaker: narrator
          text: Many days later they came to a silver forest. Everything in it, from the trees to the smallest flower, shone with silver.
        - id: ch02-b12
          speaker: blue_bull
          text: For Heaven's sake, touch nothing here. Don't pull off so much as one leaf. A six-headed Troll owns this wood, and I don't believe I can defeat him.
          emotion: fearful
        - id: ch02-b13
          speaker: girl
          text: I'll watch carefully. I won't touch anything you have forbidden me to touch.
        - id: ch02-b14
          speaker: narrator
          text: Once inside, they found the silver trees crowded close together. There was barely room for the Bull to move between them. The girl took all the care she could. She bent away and pushed the branches from her face with both hands, but every moment another branch struck her eyes. In spite of all her care, her hand closed on a silver leaf and pulled it free.
        - id: ch02-b15
          speaker: blue_bull
          text: Oh, what have you done? This will cost us a fight for our lives. That Troll has six heads and twice the strength of the last one. Whatever happens, keep the leaf.
          emotion: fearful
        - id: ch02-b16
          speaker: narrator
          text: The six-headed Troll appeared at once.
        - id: ch02-b17
          speaker: six_headed_troll
          text: Who has been touching my wood?
          emotion: angry
        - id: ch02-b18
          speaker: blue_bull
          text: It belongs as much to me as it does to you.
        - id: ch02-b19
          speaker: six_headed_troll
          text: Then we'll settle that in a fight!
          emotion: angry
        - id: ch02-b20
          speaker: blue_bull
          text: So be it.
        - id: ch02-b21
          speaker: narrator
          text: The Bull rushed at the Troll. He gored out the creature's eyes and drove his horns straight through his body. Yet the Troll fought every bit as hard as the Bull, and the battle went on for three whole days before the Bull took his life. By then the Bull was weak beyond measure. He could move only with pain and effort, and blood streamed from the wounds covering him. He told the girl about the horn of ointment at the Troll's belt. She took it and anointed him. The medicine brought him back to himself, but even then they had to remain there for a week before he was able to go farther.
        - id: ch02-b22
          speaker: narrator
          text: When they finally went on, the Bull was still weak and could travel only slowly. The girl wanted to spare him. She said she was young and light on her feet and would gladly walk beside him. The Bull would not permit it, so once again she had to sit on his back. They crossed many lands, and she had no idea where he was taking her. After a very long journey, they reached a forest of gold. It was so golden that gold seemed to drip from it. Every tree, branch, flower, and leaf was pure gold.
        - id: ch02-b23
          speaker: narrator
          text: The Bull warned her that a nine-headed Troll owned this wood. He was larger and stronger than the first two Trolls together, and the Bull feared he could not overcome him. The girl promised to be more careful than ever.
        - id: ch02-b24
          speaker: narrator
          text: Yet the golden forest was thicker than the silver one. With every step, the way grew worse. At last the girl could see no path at all. Terrified of breaking something, she twisted first to one side and then the other, trying to escape the branches. She pushed at them with her hands, but they kept striking her eyes. She could no longer see what she was grasping. Before she knew what had happened, a golden apple had come away in her hand. She was so frightened that she began to cry and wanted to cast it from her.
        - id: ch02-b25
          speaker: blue_bull
          text: No, keep the apple and guard it well. I'll comfort you if I can, but this will be a terrible struggle. I don't know whether I shall win.
          emotion: fearful
        - id: ch02-b26
          speaker: narrator
          text: Just then the nine-headed Troll came. He was so dreadful that the girl could scarcely look at him.
        - id: ch02-b27
          speaker: nine_headed_troll
          text: Who is breaking my wood?
          emotion: angry
        - id: ch02-b28
          speaker: blue_bull
          text: It is as much mine as yours.
        - id: ch02-b29
          speaker: nine_headed_troll
          text: Then we'll fight for it!
          emotion: angry
        - id: ch02-b30
          speaker: blue_bull
          text: So be it.
        - id: ch02-b31
          speaker: narrator
          text: They hurled themselves at each other, and the battle was so dreadful that the girl nearly fainted at the sight. The Bull gored out the Troll's eyes and drove his horns straight through him. The Troll matched him blow for blow. Worse still, whenever the Bull killed one of the nine heads, the other heads breathed life into it again. The struggle went on day after day. A whole week passed before the Bull managed to kill the Troll for good.
        - id: ch02-b32
          speaker: narrator
          text: When it was over, the Bull was so worn out and weak that he could not move at all. His whole body seemed to be one great wound. He could not even speak to tell the girl about the ointment. But she remembered what had saved him after the other battles. Without waiting to be told, she removed the horn from the dead Troll's belt and rubbed the medicine over the Bull. He came back to himself, though he still had to lie beside the golden wood and rest for three weeks before he could move again.
        - id: ch02-b33
          speaker: narrator
          text: At last they continued by slow degrees. The Bull told her there was only a little farther to go, but they still crossed many high hills and thick woods. After traveling that way for some time, they came out upon the open fells.
        - id: ch02-b34
          speaker: blue_bull
          text: Can you see anything?
        - id: ch02-b35
          speaker: girl
          text: Nothing but the sky above us and the wild fellside.
        - id: ch02-b36
          speaker: narrator
          text: They climbed until the ground grew level and the view opened around them.
        - id: ch02-b37
          speaker: blue_bull
          text: What can you see now?
        - id: ch02-b38
          speaker: girl
          text: A small castle, very far away.
        - id: ch02-b39
          speaker: blue_bull
          text: It isn't so small as it looks.
        - id: ch02-b40
          speaker: narrator
          text: Much later they reached a high hill with a sheer wall of rock. The castle now stood close by and looked much larger.
        - id: ch02-b41
          speaker: blue_bull
          text: That is where you must go. Below the castle stands a pigsty. Inside it you'll find a wooden gown. Put it on, go to the castle, and ask for work under the name Kari Woodengown.
        - id: ch02-b42
          speaker: blue_bull
          text: But first, take your little knife and cut off my head. Skin me, roll up my hide, and lay it beneath this rock. Put the copper leaf, the silver leaf, and the golden apple beneath the hide. A stick stands nearby. Whenever you need me, strike the rock with it.
        - id: ch02-b43
          speaker: narrator
          text: At first the girl would not do such a thing. The Bull reminded her that this was the only reward he had asked for after all he had done. She could deny him no longer. Though the task seemed cruel beyond bearing, she worked and struggled with the little knife against the great animal. At last she cut off his head and removed his hide. Then she rolled the hide together and laid it beneath the mountain wall. Inside it she carefully placed the copper leaf, the silver leaf, and the golden apple.
        - id: ch02-b44
          speaker: narrator
          text: Weeping all the way, she went to the pigsty. There she put on the wooden gown and walked to the palace.
    - id: ch03
      title: Kari Woodengown Goes to Church
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When she reached the palace, she went straight into the kitchen and asked if there was work for her. She said her name was Kari Woodengown.
        - id: ch03-b02
          speaker: cook
          text: You can stay and start washing up at once. The last girl has just left. I expect you'll run away too, as soon as you're tired of the work.
        - id: ch03-b03
          speaker: girl
          text: No. I certainly won't.
        - id: ch03-b04
          speaker: narrator
          text: Kari began washing up at once. She cleaned everything carefully and did the work so neatly that no one could find fault with it.
        - id: ch03-b05
          speaker: narrator
          text: On the following Sunday, strangers were expected at the King's palace. Water had to be carried upstairs for the Prince's bath. Kari begged the others to let her take it. The kitchen servants looked at the black wooden gown and laughed at her request.
        - id: ch03-b06
          speakers: [kitchen_servant_1, kitchen_servant_2]
          ensemble: duo
          text: Why would you go up there? Do you imagine the Prince would look at someone as ugly as you?
        - id: ch03-b07
          speaker: narrator
          text: Kari would not give up. She went on asking until at last they let her carry the water. As she climbed the stairs, her wooden gown knocked against every step and made a tremendous clatter. The noise brought the Prince out to see what was coming.
        - id: ch03-b08
          speaker: prince
          text: What sort of creature are you?
        - id: ch03-b09
          speaker: girl
          text: I was told to bring you this water.
        - id: ch03-b10
          speaker: prince
          text: Do you think I would bathe in water brought by you?
        - id: ch03-b11
          speaker: narrator
          text: He seized the vessel and poured all the water over her. Kari had no choice but to bear it. Afterward she asked the kitchen servants for permission to attend church, which stood very near the palace. They allowed her to go. But instead of walking straight there, she first returned to the wall of rock. She found the stick the Bull had shown her and knocked against the stone. At once a man stepped out and asked what she wanted.
        - id: ch03-b12
          speaker: rock_man
          text: What do you need?
        - id: ch03-b13
          speaker: girl
          text: I have permission to hear the priest at church, but I have no clothes fit to wear there.
        - id: ch03-b14
          speaker: narrator
          text: The man brought her a gown that shone as brightly as the copper forest. He also gave her a horse and a saddle. Kari rode to church looking so beautiful and so splendidly dressed that everyone wondered who the unknown lady could be. They stared and whispered, trying to guess where she had come from. Hardly anyone listened to the priest, because their eyes kept turning toward her. The Prince himself admired her so greatly that he never looked away for an instant.
        - id: ch03-b15
          speaker: narrator
          text: When she walked out after the service, the Prince followed closely. He shut the church door behind her in such a way that one of her gloves remained in his hand. Kari continued to her horse and mounted. The Prince came after her once more and called out to ask what country she had ridden from.
        - id: ch03-b16
          speaker: girl
          text: I come from Bathland.
        - id: ch03-b17
          speaker: narrator
          text: The Prince drew out the glove and tried to return it.
        - id: ch03-b18
          speaker: girl
          text: Darkness behind me, but light on my way, so the Prince cannot see where I'm going today!
        - id: ch03-b19
          speaker: narrator
          text: As soon as she spoke, darkness fell behind her path while the way ahead stayed bright. She rode off, and the Prince could no longer see where she had gone. He had never seen anything equal to the glove she left behind. For a long time he traveled far and wide, asking everyone where Bathland lay. No one could tell him of such a country.
        - id: ch03-b20
          speaker: narrator
          text: On the next Sunday, someone had to take a towel upstairs. Kari begged to carry it.
        - id: ch03-b21
          speakers: [kitchen_servant_1, kitchen_servant_2]
          ensemble: duo
          text: What good will that do? You remember what happened last time.
        - id: ch03-b22
          speaker: narrator
          text: Kari would not accept their answer. She kept begging until they gave her permission. Then she ran upstairs, making her wooden gown clatter as loudly as before. The Prince came out at the sound. The moment he recognized Kari, he snatched the towel from her hands and flung it straight into her face.
        - id: ch03-b23
          speaker: prince
          text: Get away from me, you ugly Troll! Do you think I want a towel your dirty fingers have touched?
          emotion: disgusted
        - id: ch03-b24
          speaker: narrator
          text: Afterward, the Prince set off for church. Kari asked for leave to go as well. Everyone in the kitchen demanded to know why she would want to attend when she had nothing but that black and hideous wooden gown. They could not imagine her letting other people see her in it.
        - id: ch03-b25
          speaker: girl
          text: The priest preaches so well that his words do me good. Please let me go and hear him.
        - id: ch03-b26
          speaker: narrator
          text: Kari continued pleading until at last they agreed. Again she went to the rock and knocked with the stick. The man came out and brought her a gown much finer than the first. Silver embroidery covered it from top to bottom, and the whole dress shone like the silver wood. This time he also gave her a wonderfully beautiful horse. Its housings were embroidered with silver, and even its bridle was silver.
        - id: ch03-b27
          speaker: narrator
          text: When the King's daughter reached the church, all the people were still standing outside on the hillside. Every face turned toward her, and everyone wondered who on earth she could be. The Prince noticed her at once. He hurried forward and reached for the reins, hoping to hold her horse while she climbed down.
        - id: ch03-b28
          speaker: girl
          text: There's no need. My horse is so well trained that it stands when I tell it to and comes when I call.
        - id: ch03-b29
          speaker: narrator
          text: They all entered the church together. Once the priest began, scarcely anyone listened to what he was saying. The congregation was far too busy looking at the unknown lady in silver. The Prince watched her most of all, and he fell much more deeply in love with her than he had the Sunday before.
        - id: ch03-b30
          speaker: narrator
          text: When the service ended, he approached as she was about to mount and asked again where she came from.
        - id: ch03-b31
          speaker: girl
          text: I come from Towelland.
        - id: ch03-b32
          speaker: narrator
          text: She dropped her riding whip. As the Prince bent to pick it up, she spoke her charm.
        - id: ch03-b33
          speaker: girl
          text: Darkness behind me, but light on my way, so the Prince cannot see where I'm going today!
        - id: ch03-b34
          speaker: narrator
          text: Again, darkness hid the road behind her. By the time the Prince straightened with the whip, she was gone, and he could not see what had become of her. He traveled far and wide to ask about the country called Towelland. No one could tell him where it lay. There was nothing he could do but wait and hope she would return.
    - id: ch04
      title: The Golden Shoe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the third Sunday, someone had to bring the Prince a comb. Kari immediately asked if she might take it. The servants reminded her of everything that had happened before. They scolded her for wanting the Prince to see her when she looked so black and ugly in the wooden gown. But Kari refused to give up asking. In the end, they let her carry the comb upstairs.
        - id: ch04-b02
          speaker: narrator
          text: Her gown clattered up the stairs. The Prince came out, took the comb, threw it at her, and ordered her away as fast as she could.
        - id: ch04-b03
          speaker: narrator
          text: After the Prince had gone to church, Kari asked the kitchen servants to let her go too. Once again they asked what she could possibly do there without decent clothes. They warned that the Prince or someone else might easily catch sight of her in the wooden gown. If that happened, they said, Kari would suffer for it, and so would everyone who had allowed her to leave.
        - id: ch04-b04
          speaker: girl
          text: They have better things to do than stare at me. Please let me go.
        - id: ch04-b05
          speaker: narrator
          text: Kari answered that the people at church would have better things to do than look at her. She would not stop asking, so once more the servants consented. Everything then happened as it had on the first two Sundays. She went to the rock and struck it with the stick, and the man came out to help her. This time he gave her a gown far more magnificent than either of the others. It was made almost entirely of pure gold and diamonds. He also brought a noble horse whose housings were embroidered with gold and whose bridle was golden.
        - id: ch04-b06
          speaker: narrator
          text: When the King's daughter rode up, the priest and all the people were standing on the hillside outside the church, waiting for her. The Prince ran forward with the rest and tried to hold her horse while she dismounted.
        - id: ch04-b07
          speaker: girl
          text: No, thank you. My horse stands still when I tell it to.
        - id: ch04-b08
          speaker: narrator
          text: Everyone hurried into the church together, and the priest climbed into the pulpit. Still, no one paid attention to his sermon. They were too busy looking at the unknown lady and wondering where she had come from. The Prince was more deeply in love than on either of the earlier Sundays. He forgot everything except watching her.
        - id: ch04-b09
          speaker: narrator
          text: Before the service ended, the Prince had arranged a new plan to stop her. He ordered a whole barrel of tar to be emptied across the church porch. He meant to offer his hand and help her over it. But Kari showed no concern when she reached the sticky pool. She planted one foot in the middle and leaped across. When she landed, one of her golden shoes remained behind in the tar.
        - id: ch04-b10
          speaker: narrator
          text: She mounted her horse. The Prince ran after her with the shoe and asked where she came from.
        - id: ch04-b11
          speaker: girl
          text: I come from Combland. Darkness behind me, but light on my way, so the Prince cannot see where I'm going today!
        - id: ch04-b12
          speaker: narrator
          text: Darkness closed behind her once more, and the Prince could not discover where she went. He set out on another long and weary search, traveling all over the world and asking everyone where Combland might be. No one had heard of such a place. At last he gave up searching for the country. Instead, he had a proclamation carried everywhere. He promised to marry whichever woman could put on the golden shoe.
        - id: ch04-b13
          speaker: narrator
          text: Beautiful women and ugly women came from every region. Not one had a foot small enough. After a long while, Kari's wicked stepmother arrived with her own daughter. The shoe went onto the daughter's foot, though she was so ugly and unpleasant that the Prince hated the thought of keeping his promise.
        - id: ch04-b14
          speaker: narrator
          text: Even so, the wedding was prepared, and the stepdaughter was dressed as the bride. As they rode toward the church, a little bird perched in a tree and sang a warning.
        - id: ch04-b15
          speaker: bird
          text: A slice from her heel and a slice from her toes! Kari Woodengown's shoe fills with blood as she goes!
        - id: ch04-b16
          speaker: narrator
          text: They looked down and found that the bird had spoken truly. Blood was running from the shoe. Every waiting maid and every woman in the castle was brought forward to try it, but it fitted none of them.
    - id: ch05
      title: The True Bride
      blocks:
        - id: ch05-b01
          speaker: prince
          text: Where is Kari Woodengown? Hasn't she tried the shoe?
        - id: ch05-b02
          speaker: narrator
          text: The Prince understood the language of birds, and their song had brought Kari to his mind. The servants only laughed at the idea.
        - id: ch05-b03
          speakers: [kitchen_servant_1, kitchen_servant_2]
          ensemble: duo
          text: That creature? There's no point bringing her. Her feet are as big as a horse's!
        - id: ch05-b04
          speaker: prince
          text: Perhaps they are. But everyone else has tried the shoe, so Kari will try it too.
        - id: ch05-b05
          speaker: prince
          text: Kari! Come here!
        - id: ch05-b06
          speaker: narrator
          text: Kari came upstairs. Her wooden gown clattered as though a whole troop of cavalry were climbing behind her.
        - id: ch05-b07
          speakers: [kitchen_servant_1, kitchen_servant_2]
          ensemble: duo
          text: Go on, Kari! Put on the golden shoe and become a Princess!
        - id: ch05-b08
          speaker: narrator
          text: They laughed and mocked her. Kari picked up the shoe and slipped her foot into it with ease. Then she cast off the wooden gown. Beneath it she wore the golden dress, flashing like rays of sunlight, and the matching golden shoe was already on her other foot.
        - id: ch05-b09
          speaker: narrator
          text: The Prince knew her at once. Overjoyed, he ran to her, took her in his arms, and kissed her. When he learned that she was a King's daughter, his joy grew greater still.
        - id: ch05-b10
          speaker: narrator
          text: Then Kari Woodengown and the Prince were married.
