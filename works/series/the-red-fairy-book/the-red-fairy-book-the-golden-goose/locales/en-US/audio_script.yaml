  chapters:
    - id: ch01
      title: Three Sons in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with three sons. The youngest was called Dullhead. Whenever anyone had the chance, they sneered at him, mocked him, or pushed him aside.
        - id: ch01-b02
          speaker: narrator
          text: One day, the eldest son set out for the forest to cut wood. His mother packed him a fine rich cake and a bottle of wine, so he would not go hungry or thirsty.
        - id: ch01-b03
          speaker: narrator
          text: In the forest, he met a little old man dressed in grey. The old man wished him good morning and made a request.
        - id: ch01-b04
          speaker: little_grey_man
          text: Would you share a piece of the cake in your pocket and give me a drink of your wine? I am terribly hungry and thirsty.
        - id: ch01-b05
          speaker: eldest_son
          text: If I share my cake and wine with you, there will be nothing left for me. Go on your way.
        - id: ch01-b06
          speaker: narrator
          text: He left the little man behind and walked deeper into the forest. When he began chopping down a tree, his axe went wrong. It cut his arm so badly that he had to return home and have the wound bound.
        - id: ch01-b07
          speaker: narrator
          text: Next, the second son went to cut wood. His mother gave him a good cake and a bottle of wine, just as she had given his brother. The little grey man met him too and asked for a bite of cake and a drink of wine.
        - id: ch01-b08
          speaker: second_son
          text: Anything I give you is something I lose myself. Now please go away.
        - id: ch01-b09
          speaker: narrator
          text: His punishment soon came. He had struck the tree only a few times when his axe cut deep into his leg. The wound was so bad that someone had to carry him home.
        - id: ch01-b10
          speaker: dullhead
          text: Father, may I go out to cut the wood this time?
        - id: ch01-b11
          speaker: father
          text: Look what happened to both your brothers. You should stay away from that work. You do not know how to do it.
        - id: ch01-b12
          speaker: narrator
          text: Dullhead begged and begged until his father finally gave way.
        - id: ch01-b13
          speaker: father
          text: Very well, go then. Perhaps hurting yourself will teach you some sense.
        - id: ch01-b14
          speaker: narrator
          text: His mother gave him only a plain cake mixed with water and baked in the ashes, along with a bottle of sour beer.
        - id: ch01-b15
          speaker: narrator
          text: When Dullhead reached the forest, the little grey man greeted him and asked him to share his food and drink.
        - id: ch01-b16
          speaker: dullhead
          text: All I have is an ash cake and sour beer. But if you would like them, sit down with me and we will eat together.
        - id: ch01-b17
          speaker: narrator
          text: They sat down. When Dullhead took out his food, the plain cake had become a rich one, and the sour beer had turned into excellent wine. They ate and drank together. When they were done, the little man spoke.
        - id: ch01-b18
          speaker: little_grey_man
          text: You have a kind heart, and you willingly shared all you had. I will bring you good fortune. Cut down that old tree. You will find something among its roots.
        - id: ch01-b19
          speaker: narrator
          text: The little man left, and Dullhead began chopping at once. When the tree fell, he found a goose among the roots. Every feather on it was pure gold. He lifted the goose out and carried it to an inn, where he planned to spend the night.
    - id: ch02
      title: The Goose and the Three Sisters
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The man who kept the inn had three daughters. When they saw the goose, they could not stop wondering about such a marvelous bird. Each one longed to have one of its golden feathers for herself.
        - id: ch02-b02
          speaker: eldest_daughter
          text: I am sure I will soon get a chance to pull out one of those feathers.
        - id: ch02-b03
          speaker: narrator
          text: The first time Dullhead left the room, the eldest daughter saw her opportunity. She seized the goose by one wing. But the moment she touched it, her fingers stuck fast. Pull as she might, she could not take her hand away.
        - id: ch02-b04
          speaker: narrator
          text: Soon afterward, the second daughter came in. She too meant to pluck a golden feather for herself. But she had barely touched her older sister when she found that she was stuck as well.
        - id: ch02-b05
          speaker: narrator
          text: At last, the youngest sister arrived with the very same plan. The other two shouted at her.
        - id: ch02-b06
          speakers: [eldest_daughter, second_daughter]
          ensemble: duo
          text: Do not come near us! Please, stay back!
        - id: ch02-b07
          speaker: narrator
          text: The youngest could not understand why she should stay away.
        - id: ch02-b08
          speaker: third_daughter
          text: If both of you can stand there, why should I be left out?
        - id: ch02-b09
          speaker: narrator
          text: She sprang toward them anyway. No sooner had she touched one sister than she was stuck fast to her. There was no getting free, so all three daughters had to spend the whole night attached to the goose.
    - id: ch03
      title: The Strange Procession
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning, Dullhead tucked the goose under his arm and set off. He paid no attention at all to the three girls hanging behind it. They had to hurry after him, dodging right and left as best they could.
        - id: ch03-b02
          speaker: narrator
          text: In the middle of a field, they met the parson. He stared at the strange procession and called out to the girls.
        - id: ch03-b03
          speaker: parson
          text: You shameless girls! What are you doing, racing across the fields behind a young fellow? That is no way to behave!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: He grabbed the youngest girl by the hand and tried to pull her away from the others. The instant he touched her, he too was stuck fast. There was nothing he could do but run along with the rest.
        - id: ch03-b05
          speaker: narrator
          text: Before long, the clerk came by. He was astonished to see the parson hurrying after three girls.
        - id: ch03-b06
          speaker: clerk
          text: Where are you rushing off to, your reverence? You have not forgotten today's christening, have you?
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: The clerk ran after the parson and caught him by the sleeve. As soon as his hand closed on it, he too was stuck and had to follow wherever the procession went.
        - id: ch03-b08
          speaker: narrator
          text: Now five people trotted along one behind another. Two peasants were coming home from work with their hoes, and the parson begged them to rescue him and the clerk.
        - id: ch03-b09
          speaker: narrator
          text: But when the peasants touched the clerk, they stuck to him. So seven people went running after Dullhead and his golden goose.
        - id: ch03-b10
          speaker: narrator
          text: At last, they reached a town ruled by a King. The King's daughter was so grave and solemn that no one had ever made her laugh. The King had proclaimed that whoever could make her laugh would marry her.
        - id: ch03-b11
          speaker: narrator
          text: When Dullhead heard this, he marched past the Princess with the goose and all seven people trailing behind. The sight of them running after one another made her burst into laughter. Once she began, she could not stop.
        - id: ch03-b12
          speaker: narrator
          text: Dullhead claimed the Princess as his bride. But the King did not want him for a son-in-law. He raised objection after objection, then set Dullhead a new task. He must find a man who could drink an entire cellar full of wine.
    - id: ch04
      title: The Thirsty Man and the Hungry Man
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Dullhead remembered the little grey man and felt sure he could help. He returned to the forest. On the very spot where the old tree had stood, he found a man sitting with a terribly gloomy face.
        - id: ch04-b02
          speaker: dullhead
          text: What is troubling you so badly?
        - id: ch04-b03
          speaker: thirsty_man
          text: How will I ever quench this awful thirst? Cold water does me no good. I have emptied a whole barrel of wine, but that was no more than one drop on a hot stone.
          emotion: sad
        - id: ch04-b04
          speaker: dullhead
          text: I believe I can help. Come with me, and you may drink as much as you wish.
        - id: ch04-b05
          speaker: narrator
          text: Dullhead took him to the King's wine cellar. The man sat down before the enormous casks and began to drink. He drank and drank without stopping, and before the day was over, he had swallowed the whole contents of the cellar.
        - id: ch04-b06
          speaker: narrator
          text: Dullhead asked for his bride again. The King was vexed by the thought that a fellow everyone called Dullhead might carry off his daughter, so he made another condition. This time, Dullhead must find a man who could eat a mountain of bread.
        - id: ch04-b07
          speaker: narrator
          text: Dullhead went straight back to the forest. In the same place, he found a man pulling a strap as tight as he could around his body. The man's face looked miserable.
        - id: ch04-b08
          speaker: hungry_man
          text: I have eaten a whole oven full of loaves, but what good is that when I am this hungry? My stomach feels completely empty. I must tighten my belt, or I will starve to death.
          emotion: sad
        - id: ch04-b09
          speaker: dullhead
          text: Get up and come with me. You shall have more than enough to eat.
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: Dullhead brought the hungry man to the royal court. The King had ordered all the flour in his kingdom to be gathered and baked into one huge mountain of bread.
        - id: ch04-b11
          speaker: narrator
          text: The man from the forest took his place before that mountain and began to eat. He kept eating through the day. Before the day was over, the entire mountain had vanished.
    - id: ch05
      title: The Ship and the Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: For the third time, Dullhead asked to marry the Princess. Again the King tried to escape his promise. He demanded a ship that could sail over land as well as water.
        - id: ch05-b02
          speaker: king
          text: Come sailing to me in such a ship, and you shall have my daughter at once.
        - id: ch05-b03
          speaker: narrator
          text: Dullhead returned to the forest. There he found the little grey man with whom he had shared his cake.
        - id: ch05-b04
          speaker: little_grey_man
          text: I ate for you, and I drank for you. Now I will give you the ship. I have helped you because you treated me with kindness and mercy.
        - id: ch05-b05
          speaker: narrator
          text: The little man gave Dullhead a ship that could sail on land or water. When the King saw it, he knew he could no longer refuse to give him the Princess.
        - id: ch05-b06
          speaker: narrator
          text: The wedding was celebrated with great rejoicing. After the King died, Dullhead inherited the kingdom, and he and his wife lived happily together for many years.
