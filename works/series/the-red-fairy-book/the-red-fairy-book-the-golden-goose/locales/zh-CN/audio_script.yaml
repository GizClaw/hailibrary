audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖沉稳，童话感强
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中等
    eldest_son:
      display_name: 大儿子
      tts:
        delivery: 自负冷淡，拒人时毫不客气
        timbre: 年轻硬朗
        pace: 适中
        pitch: 中等
    second_son:
      display_name: 二儿子
      tts:
        delivery: 自以为是，说话简短生硬
        timbre: 清晰偏冷
        pace: 适中
        pitch: 中等
    dullhead:
      display_name: 笨头
      tts:
        delivery: 坦率厚道，始终朴实自然
        timbre: 年轻温暖
        pace: 适中
        pitch: 中等
    father:
      display_name: 父亲
      tts:
        delivery: 严厉多疑，带着不耐烦
        timbre: 低沉粗粝
        pace: 稍慢
        pitch: 低
    little_grey_man:
      display_name: 灰衣小老头
      tts:
        delivery: 温和从容，仿佛早已知道一切
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中高
    eldest_daughter:
      display_name: 客店老板的大女儿
      tts:
        delivery: 好奇又精于盘算
        timbre: 明亮清晰
        pace: 适中
        pitch: 中高
    second_daughter:
      display_name: 客店老板的二女儿
      tts:
        delivery: 急切冲动，反应很快
        timbre: 轻快活泼
        pace: 稍快
        pitch: 高
    third_daughter:
      display_name: 客店老板的三女儿
      tts:
        delivery: 任性好奇，不肯落在人后
        timbre: 年轻清脆
        pace: 稍快
        pitch: 高
    parson:
      display_name: 牧师
      tts:
        delivery: 一本正经，发怒时义正词严
        timbre: 洪亮浑厚
        pace: 适中
        pitch: 中低
    clerk:
      display_name: 教堂执事
      tts:
        delivery: 认真急切，惊讶时语速加快
        timbre: 清亮偏薄
        pace: 稍快
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严强硬，推托时十分勉强
        timbre: 浑厚有力
        pace: 适中
        pitch: 低
    thirsty_man:
      display_name: 口渴的人
      tts:
        delivery: 愁苦绝望，像永远解不了渴
        timbre: 干涩空洞
        pace: 稍慢
        pitch: 中低
    hungry_man:
      display_name: 饥饿的人
      tts:
        delivery: 愁眉苦脸，饿得有气无力
        timbre: 低厚紧绷
        pace: 适中
        pitch: 低
  chapters:
    - id: ch01
      title: 三兄弟进森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个人生了三个儿子。小儿子叫笨头。别人只要逮着机会，就要拿他取笑，奚落他几句，再给他一番冷脸。
        - id: ch01-b02
          speaker: narrator
          text: 一天，大儿子要进森林砍柴。临行前，母亲给他带上一块香甜松软的好蛋糕和一瓶葡萄酒，免得他在路上挨饿受渴。走进森林后，他遇见一个灰衣小老头。小老头先向他道了早安，才向他讨些吃喝。
        - id: ch01-b03
          speaker: little_grey_man
          text: 能分我一块你口袋里的蛋糕，再给我喝一口酒吗？我实在饿得很，也渴得很。
        - id: ch01-b04
          speaker: eldest_son
          text: 蛋糕和酒分给了你，我自己吃什么？你走你的吧。
        - id: ch01-b05
          speaker: narrator
          text: 大儿子把小老头独自丢在原地，继续往森林深处走。他才砍了没多久，斧头便落偏了，在自己的胳膊上砍出一道深伤口。他只得回家，请人包扎。
        - id: ch01-b06
          speaker: narrator
          text: 接着，二儿子也进了森林。母亲同样给他一块好蛋糕和一瓶葡萄酒。灰衣小老头又出现了，也向他讨一小块蛋糕和一口酒。
        - id: ch01-b07
          speaker: second_son
          text: 我给你多少，自己就少多少。劳驾，你还是走开吧。
        - id: ch01-b08
          speaker: narrator
          text: 惩罚很快就来了。二儿子只朝树干砍了两斧，便把自己的腿伤得厉害，最后只能让人抬回家。
        - id: ch01-b09
          speaker: dullhead
          text: 父亲，这次让我去砍柴吧。
        - id: ch01-b10
          speaker: father
          text: 你两个哥哥都伤成了这样。你还是别去了，那种活你根本不会干。
        - id: ch01-b11
          speaker: narrator
          text: 笨头苦苦央求，父亲终于答应了。
        - id: ch01-b12
          speaker: father
          text: 好吧，那你就去。等你也伤了自己，说不定能懂事一点。
        - id: ch01-b13
          speaker: narrator
          text: 母亲只给了笨头一块用清水和面、埋在灰烬里烤成的粗饼，还有一瓶酸啤酒。笨头来到森林，也遇见了灰衣小老头。老人问过好，又讨一块饼和一口喝的。
        - id: ch01-b14
          speaker: dullhead
          text: 我只有灰烬里烤的粗饼和一点酸啤酒。你要是不嫌弃，咱们就坐下一起吃吧。
        - id: ch01-b15
          speaker: narrator
          text: 两个人坐了下来。笨头一拿出粗饼，它竟变成了香甜松软的好蛋糕，酸啤酒也成了上等葡萄酒。他们一起吃饱喝足，小老头这才开口。
        - id: ch01-b16
          speaker: little_grey_man
          text: 你心地善良，愿意把自己有的东西分给别人，我要送你一份好运。去砍倒那棵老树吧，你会在树根中间找到一样东西。
        - id: ch01-b17
          speaker: narrator
          text: 小老头说完便告辞了。笨头立刻去砍那棵树。树倒以后，根须间果然露出一只鹅，每根羽毛都是纯金的。笨头把鹅抱出来，带着它走进一家客店，打算在那里住上一夜。
    - id: ch02
      title: 金鹅与三姐妹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 客店老板有三个女儿。她们看见这只神奇的鹅，好奇得不得了，人人都想弄到一根金羽毛。
        - id: ch02-b02
          speaker: eldest_daughter
          text: 我早晚能等到机会，从它身上拔一根下来。
        - id: ch02-b03
          speaker: narrator
          text: 笨头刚巧一离开房间，大女儿便抓住鹅翅膀。谁知怪事发生了，她的手指一下粘牢，任凭怎样拉扯也抽不回来。二女儿随后进来，也想替自己拔一根金羽毛。可她刚碰到姐姐，自己也粘住了。
        - id: ch02-b04
          speaker: narrator
          text: 最后，三女儿也带着同样的心思来了。两个姐姐赶忙朝她大喊。
        - id: ch02-b05
          speakers: [eldest_daughter, second_daughter]
          ensemble: duo
          text: 别过来！看在上帝的分上，千万别靠近！
        - id: ch02-b06
          speaker: narrator
          text: 小妹妹却不明白她们为什么拦着自己。
        - id: ch02-b07
          speaker: third_daughter
          text: 你们俩都在那里，为什么偏偏不让我过去？
        - id: ch02-b08
          speaker: narrator
          text: 她扑到姐姐们身边，手才碰到其中一个，也牢牢粘住了。三姐妹谁也挣不开，只好这样陪着金鹅过了一整夜。
    - id: ch03
      title: 奇怪的长队
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天一早，笨头夹起金鹅便上路了，根本不管粘在后面的三个姑娘。她们只好一路追着他，他朝左，她们跟着朝左，他转向右，她们又急忙转向右。
        - id: ch03-b02
          speaker: narrator
          text: 走到田野中央，他们遇见一位牧师。牧师瞧见这支古怪的队伍，立刻冲着姑娘们大声斥责。
        - id: ch03-b03
          speaker: parson
          text: 真不害臊！你们几个姑娘追着一个小伙子跑过田野，到底在干什么？哪有这样不守规矩的！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 牧师抓住小妹妹的手，想把她拉走。谁知手一碰到她，他也粘住了，只能跟着大家一起跑。
        - id: ch03-b05
          speaker: narrator
          text: 不久，教堂执事从那里经过。他发现牧师紧跟在三个姑娘后面，吃惊得赶紧喊起来。
        - id: ch03-b06
          speaker: clerk
          text: 牧师先生，您急急忙忙要去哪儿？今天还有一场洗礼，您可别忘了！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 执事追上去扯住牧师的袖子，自己马上也粘牢了。五个人一个接一个，继续往前小跑。迎面来了两个刚收工回家的农夫，肩上还扛着锄头。牧师一见他们，连忙求两人救救自己和执事。两个农夫刚碰到执事，便也粘了上去。如今，跟在笨头和金鹅后面奔跑的，足足有七个人。
        - id: ch03-b08
          speaker: narrator
          text: 他们终于来到一座城。城里那位国王的女儿总是严肃庄重，不管人们想什么办法，从没有谁能让她笑上一笑。国王已经颁下命令，谁能逗笑公主，谁就可以娶她。
        - id: ch03-b09
          speaker: narrator
          text: 笨头听到这个消息，便夹着金鹅，带着那一长串人，从公主面前走过去。七个人你追着我、我牵着你，一刻不停地往前跑。公主一看，顿时放声大笑，笑得怎么也停不下来。
        - id: ch03-b10
          speaker: narrator
          text: 笨头请国王照约定把公主嫁给他。国王却不想要这个女婿，找出种种借口推托，最后又出了一个难题。他要笨头找来一个人，把整整一酒窖的葡萄酒全部喝光。
    - id: ch04
      title: 喝不够的人与吃不饱的人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 笨头想起灰衣小老头，觉得他一定能帮忙。他回到森林，在那棵老树倒下的地方，看见一个人愁眉苦脸地坐着。
        - id: ch04-b02
          speaker: dullhead
          text: 什么事让你这么发愁？
        - id: ch04-b03
          speaker: thirsty_man
          text: 我渴得这么厉害，怎么喝得够呢？凉水一点也不管用。我已经喝空整整一桶葡萄酒，可那就像一滴水落在滚烫的石头上，转眼便没了。
          emotion: sad
        - id: ch04-b04
          speaker: dullhead
          text: 这件事我能帮你。跟我走，让你一次喝个痛快。
        - id: ch04-b05
          speaker: narrator
          text: 笨头把他领进国王的酒窖。那人坐在一排大酒桶前，一刻不停地喝呀喝，喝完一桶又喝一桶。天还没黑，整个酒窖已经一滴酒也不剩了。
        - id: ch04-b06
          speaker: narrator
          text: 笨头又去讨要新娘。国王想到人人口中的“笨头”竟要娶走自己的女儿，越想越恼火。他再次改变条件，要笨头找一个能吃下一座面包山的人。
        - id: ch04-b07
          speaker: narrator
          text: 笨头没有耽搁，直接回到森林。原来的地方坐着另一个人。他用一条带子死死勒着肚子，脸上满是愁苦。
        - id: ch04-b08
          speaker: hungry_man
          text: 我吃光了满满一炉面包，可我还是饿得要命，肚子里简直空空的。再不把腰带勒紧些，我就要活活饿死了。
          emotion: sad
        - id: ch04-b09
          speaker: dullhead
          text: 快起来，跟我走。到了那里，你尽管放开肚子吃。
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 笨头把这个人带到宫廷。国王早已下令，把全国所有的面粉都集中起来，烤成一座巨大的面包山。森林里来的那个人往山前一站，张嘴便吃。他整整吃了一天，最后，整座面包山一点也没剩下。
    - id: ch05
      title: 神奇的船与婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 笨头第三次请求迎娶公主。国王还是想赖掉承诺，又要他找来一艘既能在水里航行，也能在陆地上航行的船。
        - id: ch05-b02
          speaker: king
          text: 你坐着这样的船来到我面前，我马上把女儿嫁给你，绝不再拖延。
        - id: ch05-b03
          speaker: narrator
          text: 笨头再次回到森林，找到了曾经同他分享粗饼的灰衣小老头。
        - id: ch05-b04
          speaker: little_grey_man
          text: 我已经替你吃过，也替你喝过。现在，我要把那艘船送给你。我做这些，都是因为你待我善良，又有一颗慈悲的心。
        - id: ch05-b05
          speaker: narrator
          text: 小老头给了笨头一艘神奇的船，它能行过陆地，也能驶过水面。国王亲眼见到以后，再也找不到理由拒绝这门婚事。
        - id: ch05-b06
          speaker: narrator
          text: 笨头和公主欢欢喜喜地举行了婚礼。后来国王去世，笨头继承了王国，同妻子幸福地生活了许多年。
