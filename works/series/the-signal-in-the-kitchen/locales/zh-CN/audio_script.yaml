audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 冷静亲切，讲到谜团时带着好奇, timbre: 温暖清晰, pace: 舒展自然, pitch: 中音}}
    lin-yao: {display_name: 林遥, tts: {delivery: 谨慎认真，思路渐明时更坚定, timbre: 清亮自然, pace: 中等, pitch: 中高音}}
    tom-baird: {display_name: 汤姆, tts: {delivery: 务实直接，带一点冷幽默, timbre: 略粗而沉稳, pace: 不疾不徐, pitch: 中低音}}
    ruth-marlow: {display_name: 露丝, tts: {delivery: 简洁果断，始终克制, timbre: 坚实清楚, pace: 稳定, pitch: 中音}}
  chapters:
    - id: ch01
      title: 十三只眼睛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            2015年1月19日，是林遥在帕克斯射电望远镜值的第一个早班。天才蒙蒙亮，那面六十四米宽的白色巨碟已经转过桉树林上方。远远望着，它就像一只耳朵，转得慢到让人看不出它在动。控制室冷得她指尖发僵。她先把咖啡搁到离仪器最远的地方，再挨个查看接收机状态。毕竟才上班一周，她可不愿意留下什么叫人笑话的事故。

            快到中午，屏幕忽然跳出一道短弧。它先从高频落下来，低频随后才到，很像遥远的脉冲穿过稀薄等离子体以后留下的痕迹。信号一闪就没了，搜索程序却从背景噪声里抓住了它。林遥把椅子往前一滑。十三路波束，每一路都有，而且强得出奇。老接收机技师汤姆正端着一盒螺丝经过，林遥马上叫住了他。
        - {id: ch01-b02, speaker: lin-yao, text: 汤姆，这样的扫频你以前碰到过吗？}
        - {id: ch01-b03, speaker: narrator, text: 汤姆没急着看弧线，先看了看十三个小窗口。}
        - {id: ch01-b04, speaker: tom-baird, text: 十三路，一路都没落下？}
        - {id: ch01-b05, speaker: lin-yao, text: 对，全看到了。}
        - {id: ch01-b06, speaker: narrator, text: 汤姆把螺丝盒放了下来。}
        - {id: ch01-b07, speaker: tom-baird, text: 那它多半不是从碟面正对的那片天空过来的。天上的点源，哪会把十三扇门敲得一样响。}
        - id: ch01-b08
          speaker: narrator
          text: |-
            这个道理林遥当然明白。多波束接收机像十三只望向不同方向的眼睛。遥远的天体通常只会落进一只眼睛里，最多再带上旁边几只。附近的强干扰却能从侧面钻进来，一下照亮全部波束。可屏幕上的短弧，实在太像天文脉冲的色散扫频了。她把图放大，心里的那点兴奋还是没有凉下去。
        - {id: ch01-b09, speaker: lin-yao, text: 会不会是一种没见过的近场现象？也可能真有一个事件，只是接收机把它摊到了各路上。}
        - {id: ch01-b10, speaker: tom-baird, text: 你这儿有两个“可能”。先让它们老实排队，谁都别抢着冒充答案。}
        - id: ch01-b11
          speaker: narrator
          text: 林遥存好原始数据、天线指向和设备日志后，运行负责人露丝赶来了。她看完图，只问了一句。
        - {id: ch01-b12, speaker: ruth-marlow, text: 你能让它再出现吗？}
        - {id: ch01-b13, speaker: lin-yao, text: 现在还做不到。}
        - {id: ch01-b14, speaker: ruth-marlow, text: 那它目前只是候选信号，不能算发现。记住，天上不欠我们一个惊喜。}
        - id: ch01-b15
          speaker: narrator
          text: 露丝说着，把值班表压在桌上。那句话扎了林遥一下。她本想在第一周证明自己能从噪声里认出不寻常的东西。可现在，她只能在事件记录上写下：来源未知。
    - id: ch02
      title: 总在白天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            1月22日，那个信号又露面了。还是一闪而过的扫频，也还是十三路一起亮。两次记录看着相近，却没有严丝合缝地遵守冷等离子体的规律。再过一天，第三个事件在下午出现。新装的宽带监测器也同时有了动静。主系统在约1.4吉赫兹看到弧线，另一边则在2.3到2.5吉赫兹亮了起来。

            林遥用铅笔把两处频段连起来。她已经连续三次推迟午饭，桌上的苹果滚进电缆图下面，磕出了一块褐斑。
        - {id: ch02-b02, speaker: lin-yao, text: 两段频率是在同一刻出现的。要是这边的高频活动只有帕克斯才有，那东西应该就在附近。}
        - {id: ch02-b03, speaker: narrator, text: 汤姆正给一只接头套防尘帽。}
        - {id: ch02-b04, speaker: tom-baird, text: 附近可不算小。无线网络、工具、电源、来往的车，还有天气放电，全都值得查。}
        - {id: ch02-b05, speaker: lin-yao, text: 那天的天气很稳。}
        - {id: ch02-b06, speaker: tom-baird, text: 行，那就拿证据划掉它。其他嫌疑也一样，想留下就得拿证据。}
        - id: ch02-b07
          speaker: narrator
          text: |-
            他们查时钟、换备用线缆、对比天线指向，还让汤姆在设备间把可能的干扰源一台台开关。林遥盼着某个动作能把弧线叫回来，可屏幕上只有普通噪声。每失败一次，就吃掉一点宝贵的观测时间。第三天，露丝拿着下一组天文学家的计划站到门口。
        - {id: ch02-b08, speaker: ruth-marlow, text: 这些检查还得做多久？}
        - {id: ch02-b09, speaker: lin-yao, text: 主楼那几个电源，我还想再测一下。}
        - {id: ch02-b10, speaker: ruth-marlow, text: 昨天你也想测电源。}
        - {id: ch02-b11, speaker: lin-yao, text: 可我们还不能排除它们。}
        - {id: ch02-b12, speaker: ruth-marlow, text: 这样一直排除下去，整个台站都会成嫌疑人。先说一个预测，而且事实必须有机会证明你错。}
        - id: ch02-b13
          speaker: narrator
          text: |-
            露丝看着林遥那张画满箭头的纸。林遥一时答不上来。那晚，她把档案事件按本地时间重新排了一遍。这种信号叫peryton，名字来自虚构的带翅膀鹿，因为它看着来自天空，表现得却离地面很近。已知事件大多出现在工作日和办公时间，正午前后最密。

            这线索俗得让她有点难为情。宇宙不看钟表，机器却跟着人的作息开关。她盯着磕坏的苹果，想起三次事件里有两次，自己都等数据处理完才去吃饭。

            第二天一早，她终于交出一个能失败的预测。要是源头跟午间活动有关，2.3到2.5吉赫兹的尖峰应该白天多，晚上少。还有，许多时候应该只见高频活动，却不见1.4吉赫兹的扫频。他们从1月18日开始查记录。白天果然挤满尖峰，夜里就少得多。可高频活动足有几百次，真正的peryton却只有寥寥几个。也就是说，预测只中了半边。人的设备确实在发出信号，那个怪扫频却还需要别的条件。汤姆拿笔圈住食堂的方向。
        - {id: ch02-b14, speaker: tom-baird, text: 哪种机器会在每天中午忙起来，而且就在2.4吉赫兹附近工作？}
        - {id: ch02-b15, speaker: lin-yao, text: 是微波炉。, emotion: surprised}
    - id: ch03
      title: 一杯水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            帕克斯台站周围有好几台微波炉。塔楼有，访客中心和宿舍也有，还有一台在大家叫作“羊毛棚”的厨房里。微波炉靠磁控管加热食物，产生的能量大约在2.45吉赫兹。按理说，金属外壳和门上的网会把大部分能量关在炉子里面。这样一来，高频活动似乎说得通了。可主系统里1.4吉赫兹的短扫频，又是从哪儿来的呢？
        - {id: ch03-b02, speaker: lin-yao, text: 微波炉每天正常工作都会冒出高频尖峰。那peryton为什么只是偶尔才来？}
        - {id: ch03-b03, speaker: tom-baird, text: 所以测试不能空烧，也别拿大家的午饭凑数。}
        - id: ch03-b04
          speaker: narrator
          text: |-
            汤姆说着，把一只陶瓷杯放到水槽下。2月27日维护日，望远镜朝着天顶。得到批准后，他们往杯里装满水，让几台微波炉按不同功率运行十秒到一分钟。林遥在控制室盯着十三路数据，汤姆在厨房按下启动键，每次都等计时自然结束。监测器一遍遍看到2.4吉赫兹活动，主系统却始终没有弧线。

            午后，一个peryton忽然跳上屏幕。林遥猛地站起来，耳机线差点把杯子带倒。
        - {id: ch03-b05, speaker: lin-yao, text: 刚才开的是哪台？, emotion: surprised}
        - {id: ch03-b06, speaker: narrator, text: 对讲机里先响起一阵杂音。}
        - {id: ch03-b07, speaker: tom-baird, text: 塔楼那台刚测完。不过羊毛棚也有人，正在用微波炉热饭。}
        - id: ch03-b08
          speaker: narrator
          text: |-
            两个动作撞在一起，谁都不能单独负责。林遥把结果记成“混杂”，不是“成功”。她很想保住这次漂亮的波形，可漂亮也补不上缺失的控制条件。

            3月12日，他们把望远镜转向过去容易收到peryton的方向，又试了一轮。每台微波炉都正常跑完，什么也没发生。林遥第一次认真怀疑：厨房线索会不会只是午餐时间制造的巧合？
        - {id: ch03-b09, speaker: ruth-marlow, text: 就到这里吧。}
        - id: ch03-b10
          speaker: narrator
          text: 露丝没有责备，只把计划翻到下一页。林遥摘下耳机。汤姆靠在门框上，手里转着那只已经冷掉的水杯。
        - {id: ch03-b11, speaker: lin-yao, text: 再让我试一次。但我不想把今天重做一遍，我要找的是，平常用微波炉和档案里的事件到底哪里不一样。}
        - {id: ch03-b12, speaker: tom-baird, text: 平常有人会等不及提示音，提前把门拉开。这个动作我们没试。可它不能当普通厨房实验来做，只能让受过训练的工作人员，照露丝批准的维护方案操作。}
        - {id: ch03-b13, speaker: ruth-marlow, text: 所以你现在怀疑的，是一个动作，不是某一台机器。}
        - {id: ch03-b14, speaker: lin-yao, text: 对。磁控管要还在运转，门要提前打开，望远镜的角度也要合适。少了任何一项，都可能没有扫频。}
        - {id: ch03-b15, speaker: ruth-marlow, text: 给你二十分钟维护时间。先把步骤写清楚，杯子里一定要有水，而且每次只能改变一个条件。}
    - id: ch04
      title: 门开的一刻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            3月17日，羊毛棚厨房的百叶窗把阳光切成一道道亮带。米黄色的微波炉比林遥年纪还大，外壳满是细小磨痕。汤姆把装水的杯子放进去。林遥守在控制室，露丝站在两边之间用对讲机报时。这是维护期间的受控测试，只能由受过训练的工作人员来做。儿童和普通使用者绝不能打开或拆动正在运转的微波炉。

            第一次，汤姆让磁控管运行几秒，再拉开门。十三路波束同时亮了。林遥没有欢呼，只按下标记键，核对时间，让监测数据继续滚动。
        - {id: ch04-b02, speaker: lin-yao, text: 把天线方位记下来。设备复位，下一次换个等待时间。}
        - id: ch04-b03
          speaker: narrator
          text: 第二次，门一开弧线又来了。第三次也是。三个明亮的peryton都和开门时刻对上，形状像档案事件，高频监测器也同时抓到2.3到2.5吉赫兹的活动。这时，汤姆的声音从对讲机里传来。
        - {id: ch04-b04, speaker: tom-baird, text: 这一次，我们总能把它叫作答案了吧？}
        - id: ch04-b05
          speaker: narrator
          text: 林遥望着十三个同时发亮的窗口。几周前，它们像十三位替宇宙作证的人。现在却像十三根手指，一齐指回台站里面。
        - {id: ch04-b06, speaker: lin-yao, text: 只能说证据已经很强。我们还得换角度试，而且别忘了，这个信号并不是每回都会出来。}
        - id: ch04-b07
          speaker: narrator
          text: |-
            接下来，他们换了望远镜的方向。碟面挡在厨房和焦点舱之间时，就算照样提前开门，主系统也收不到peryton。只有相对角度合适，信号才比较容易进来。台站里的其他微波炉，在某些条件下也会造出相似事件，只是扫频参数并不一样。

            所以，谜底远不止“微波炉漏波”这么简单。磁控管关断的那一瞬间、提前拉开的炉门、逸出的能量，还有接收机刚好合适的位置，这些条件要连在一起。即便如此，信号也未必每次都来。不过，关断中的磁控管为什么会在1.4吉赫兹附近留下酷似天文色散的扫频，团队并没有装作已经弄懂。信号的源头找到了，波形怎样形成，仍旧没有答案。

            下午简报时，露丝投出最初三次记录。林遥主动站了起来。
        - {id: ch04-b08, speaker: lin-yao, text: 第一天，我一心觉得它可能是新的天文现象。十三路一起出现，本来就在反驳这个想法，我却还是更愿意相信它。是汤姆先把我叫住的。}
        - {id: ch04-b09, speaker: tom-baird, text: 我也查过电源，查过车辆，差不多把半个台站都拖下了水。别光挑体面的错误往自己身上揽。}
        - id: ch04-b10
          speaker: narrator
          text: |-
            屋里的人都笑了，林遥也笑了。她划掉“宇宙候选”，写上“台站射频干扰”。这没有让发现变小。它把真正的快速射电暴和模仿者分开，也留下了辨认办法：看多少路波束收到信号，扫频是否严格符合冷等离子体规律，高频监测器有没有本地活动，还要问天线朝哪儿、台站里的人在做什么。

            傍晚，观测重新开始，白色巨碟转向南方。旧微波炉贴上操作提醒，却没被当成荒唐证据藏起来。林遥终于去热早上没吃完的饭盒。她让计时器自然归零，听见普通的提示音，才打开门。

            回控制室时，她从六十四米巨碟旁走过。一个谜底来自厨房，并没有让夜空变小。恰恰相反，她第一次清楚地感觉到：想听见很远的声音，就得先诚实地认出身边每一种响动。

            新一段数据已经展开。林遥坐下，把“午餐时间”也写进新的观测日志。
