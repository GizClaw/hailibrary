audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 冷静而富有好奇心
        timbre: 温暖清晰
        pace: 从容
        pitch: 中音
    lin-yao:
      display_name: 林遥
      tts:
        delivery: 谨慎坚定，思考时略有停顿
        timbre: 清亮自然
        pace: 中等
        pitch: 中高音
    tom-baird:
      display_name: 汤姆
      tts:
        delivery: 务实直接，带干燥幽默
        timbre: 略粗而沉稳
        pace: 不疾不徐
        pitch: 中低音
    ruth-marlow:
      display_name: 露丝
      tts:
        delivery: 简洁果断，不夸张
        timbre: 坚实清楚
        pace: 稳定
        pitch: 中音
  chapters:
    - id: ch01
      title: 十三只眼睛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            2015年1月19日，林遥在帕克斯射电望远镜值第一班早班。天刚亮，六十四米口径的白色碟面从桉树林上方转过去，像一只慢得看不出动作的耳朵。控制室的空调吹得她指尖发冷。她把咖啡放到仪器架最远的一角，逐项核对接收机状态，决心不给新人工程师的第一周留下任何可笑的事故。

            中午前，屏幕突然亮出一道短促的弧。高频先到，低频稍后，形状像某个遥远脉冲穿过稀薄等离子体时留下的拖痕。它只持续了很短的一瞬，搜索程序却把它从背景噪声里举了出来。林遥把椅子滑近。十三路波束里都有它，亮得几乎蛮横。

            老接收机技师汤姆端着一盒螺丝经过。林遥叫住他：
        - id: ch01-b02
          speaker: lin-yao
          text: 你见过这种扫频吗？
        - id: ch01-b03
          speaker: narrator
          text: |-
            

            汤姆没先看弧线，先看十三个小窗口。
        - id: ch01-b04
          speaker: tom-baird
          text: |+
            全都看见了？

        - id: ch01-b05
          speaker: lin-yao
          text: |+
            全都。

        - id: ch01-b06
          speaker: tom-baird
          text: 那它不像从碟面正对的天空来。
        - id: ch01-b07
          speaker: narrator
          text: 他把螺丝盒放下，
        - id: ch01-b08
          speaker: tom-baird
          text: 天空里的点源通常不会平等地敲十三扇门。
        - id: ch01-b09
          speaker: narrator
          text: |+
            

            林遥知道这个道理。多波束接收机像十三只朝向略有差别的眼睛；远处的天体通常落进其中一只或相邻几只，而附近的强干扰可能从侧面闯进所有波束。可那条弧偏偏像天文脉冲的色散扫频。她放大图像，胸口仍有一点不肯熄灭的热。

        - id: ch01-b10
          speaker: lin-yao
          text: 也许是新的近场现象，
        - id: ch01-b11
          speaker: narrator
          text: 她说，
        - id: ch01-b12
          speaker: lin-yao
          text: 也许接收机把一个真正的事件铺开了。
        - id: ch01-b13
          speaker: narrator
          text: |-
            

            汤姆咧了下嘴。
        - id: ch01-b14
          speaker: tom-baird
          text: 两个也许。先给它们排队，别让谁插队当答案。
        - id: ch01-b15
          speaker: narrator
          text: |-
            

            运行负责人露丝赶来时，林遥已经保存了原始数据、天线指向和设备日志。露丝看完，只问：
        - id: ch01-b16
          speaker: ruth-marlow
          text: |+
            能复现吗？

        - id: ch01-b17
          speaker: lin-yao
          text: |+
            还不能。

        - id: ch01-b18
          speaker: ruth-marlow
          text: 那就叫它候选信号。
        - id: ch01-b19
          speaker: narrator
          text: 露丝把值班表压在桌上，
        - id: ch01-b20
          speaker: ruth-marlow
          text: 别叫发现。天上不欠我们一个惊喜。
        - id: ch01-b21
          speaker: narrator
          text: |-
            

            那句话刺了林遥一下。她原本想在第一周证明自己能从噪声里认出不同寻常的东西，如今她只能在事件记录上写：来源未知。
    - id: ch02
      title: 总在白天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            1月22日，信号又来了。仍是短促的扫频，仍在十三路中同时出现。林遥把两次记录叠在一起，发现它们相似，却不完全服从冷等离子体造成的精确规律。第二天，第三个事件在午后出现。新装的宽带干扰监测器还在另一段频率上记录到强烈活动：主接收系统在约1.4吉赫兹看到那道弧，监测器则在2.3到2.5吉赫兹附近同时变亮。

        - id: ch02-b02
          speaker: lin-yao
          text: 同一时刻，两处频段。
        - id: ch02-b03
          speaker: narrator
          text: 林遥用铅笔在纸上连线。她已经三次把午饭推迟，桌上的苹果滚进电缆图下面，表皮磕出一块褐斑。
        - id: ch02-b04
          speaker: lin-yao
          text: 如果高频活动只在帕克斯出现，源头就离我们不远。
        - id: ch02-b05
          speaker: narrator
          text: |-
            

            汤姆正给一只接头套防尘帽。
        - id: ch02-b06
          speaker: tom-baird
          text: |+
            离我们不远，范围还是很大。无线网络、工具、电源、车辆，甚至天气造成的放电，都可以先站进队里。

        - id: ch02-b07
          speaker: lin-yao
          text: |+
            天气那天很稳。

        - id: ch02-b08
          speaker: tom-baird
          text: 好，划掉要有证据，留下也要有证据。
        - id: ch02-b09
          speaker: narrator
          text: |+
            

            他们检查时钟，交换备用线缆，比较不同天线指向，还让汤姆在设备间逐台开关可能的干扰源。林遥希望某个动作能让弧线立刻回来，但屏幕只有普通噪声。每次失败都吃掉一小段宝贵的观测时间。露丝第三天站到门边，手里夹着下一组天文学家的计划。

        - id: ch02-b10
          speaker: ruth-marlow
          text: |+
            还要多久？

        - id: ch02-b11
          speaker: lin-yao
          text: 我想测试主楼的几个电源。
        - id: ch02-b12
          speaker: narrator
          text: |+
            林遥说。

        - id: ch02-b13
          speaker: ruth-marlow
          text: |+
            你昨天也想测试电源。

        - id: ch02-b14
          speaker: lin-yao
          text: 因为它们还没被排除。
        - id: ch02-b15
          speaker: narrator
          text: |-
            

            露丝看着她画满箭头的纸。
        - id: ch02-b16
          speaker: ruth-marlow
          text: 没有边界的排除，会把整个台站都变成嫌疑人。给我一个能失败的预测。
        - id: ch02-b17
          speaker: narrator
          text: |-
            

            林遥没能立刻回答。那天晚上，她把历次档案事件的本地时间重新排好。已知的peryton——这个名字来自一种虚构的带翅膀鹿，人们用它称呼这些看似来自天空、其实显得很近的怪信号——大多出现在工作日和办公时间。她把小时数一格格涂深，正午附近最密。

            她起初嫌这个线索太俗。宇宙不看钟表，机器却常跟着人的作息开关。她盯着那只磕坏的苹果，忽然想起三次事件里有两次，她都是等信号处理完才去吃饭。

            第二天一早，她把预测写给露丝：如果源头与人的午间活动有关，那么2.3到2.5吉赫兹的高频尖峰在白天会多于夜间，并且可能出现许多只有高频活动、没有1.4吉赫兹扫频的时刻。

            他们查了监测器从1月18日起的记录。白天的尖峰果然密集，夜里稀少；高频活动有几百次，真正的peryton却寥寥可数。林遥的预测只对了一半。人的设备正在发射什么，但产生怪信号还需要另一个条件。

            汤姆把食堂方向圈了出来。
        - id: ch02-b18
          speaker: tom-baird
          text: 2.4吉赫兹附近，有一种设备每天中午特别勤快。
        - id: ch02-b19
          speaker: narrator
          text: |-
            

            林遥抬头。
        - id: ch02-b20
          speaker: lin-yao
          text: 微波炉。
    - id: ch03
      title: 一杯水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            帕克斯台站附近有几台微波炉：塔楼、访客中心、宿舍，还有工作人员称作羊毛棚的厨房。微波炉里的磁控管在大约2.45吉赫兹附近产生能量来加热食物，金属外壳和门网本应把大部分能量留在里面。这个解释能接上监测器的高频活动，却还接不上1.4吉赫兹的短促扫频。

        - id: ch03-b02
          speaker: lin-yao
          text: 正常工作时天天有高频尖峰，
        - id: ch03-b03
          speaker: narrator
          text: 林遥说，
        - id: ch03-b04
          speaker: lin-yao
          text: 为什么怪信号只偶尔出现？
        - id: ch03-b05
          speaker: narrator
          text: |-
            

            汤姆把一只陶瓷杯放到水槽下。
        - id: ch03-b06
          speaker: tom-baird
          text: 所以别拿空炉子试。也别把午饭变成实验材料。
        - id: ch03-b07
          speaker: narrator
          text: |-
            

            2月27日维护日，望远镜朝向天顶。经批准后，他们给杯子装满水，分别让几台微波炉以不同功率运行十秒到一分钟。控制室里，林遥守着十三路数据。厨房里，汤姆按下启动键，等计时自然结束。一次又一次，监测器看到2.4吉赫兹附近的活动，主系统却没有那道弧。

            午后，一个peryton突然出现。林遥从椅子上站起来，耳机线差点把杯子带倒。
        - id: ch03-b08
          speaker: lin-yao
          text: 是哪一台？
        - id: ch03-b09
          speaker: narrator
          text: |-
            

            对讲机里先是一阵杂音，随后汤姆说：
        - id: ch03-b10
          speaker: tom-baird
          text: 塔楼测试刚结束，但羊毛棚里也有人在热午餐。
        - id: ch03-b11
          speaker: narrator
          text: |+
            

            这不是答案。两个动作重叠，谁也无法单独负责。林遥把结果记为混杂，而不是成功。她很想保住这次漂亮的波形，可漂亮不能替代控制条件。

            3月12日，他们把望远镜转到过去较容易接收到peryton的方向，重复试验。每台微波炉都正常跑完，什么也没有发生。林遥望着空白屏幕，第一次认真怀疑整条厨房假设是否只是午餐时间造成的巧合。

        - id: ch03-b12
          speaker: ruth-marlow
          text: 可以停了。
        - id: ch03-b13
          speaker: narrator
          text: |-
            露丝说。她没有责备，只把观测计划翻到下一页。

            林遥摘下耳机。
        - id: ch03-b14
          speaker: lin-yao
          text: 再给我一次。不是再重复今天。我想查正常使用与档案事件有什么不同。
        - id: ch03-b15
          speaker: narrator
          text: |-
            

            汤姆靠在门框上，转着那只已经冷掉的水杯。
        - id: ch03-b16
          speaker: tom-baird
          text: 日常使用里有个动作是我们没测过的：有人会在提示音前拉门。但这不是可以照着做的厨房实验。要复现，也只能由受过训练的工作人员按露丝批准的维护方案操作。
        - id: ch03-b17
          speaker: narrator
          text: |-
            

            露丝抬眼。
        - id: ch03-b18
          speaker: ruth-marlow
          text: |+
            你是在提出一个动作，不是在提出一台机器。

        - id: ch03-b19
          speaker: lin-yao
          text: 对。
        - id: ch03-b20
          speaker: narrator
          text: 林遥说，
        - id: ch03-b21
          speaker: lin-yao
          text: 预测是：只有磁控管正在工作、门被提前打开、望远镜角度又合适时，才可能出现扫频。三项条件缺一项，结果都可能是空白。
        - id: ch03-b22
          speaker: narrator
          text: |-
            

            露丝合上文件夹。
        - id: ch03-b23
          speaker: ruth-marlow
          text: 维护窗口给你二十分钟。先写操作顺序，杯里必须有水。一次只改一个条件。
    - id: ch04
      title: 门开的一刻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            3月17日，羊毛棚厨房的百叶窗把阳光切成一条条亮带。微波炉比林遥年纪还大，米黄色外壳边缘有细小磨痕。汤姆把装水的陶瓷杯放进去。林遥留在控制室，露丝站在两边之间用对讲机报时。这是维护期间的受控测试，只由受过训练的台站工作人员执行。儿童和普通使用者绝不能打开或拆动正在工作的微波炉。

            第一次，汤姆等磁控管运转几秒，拉开门。控制室的十三路波束同时亮了。

            林遥没有欢呼。她按下标记键，确认时间，又让监测器数据继续滚动。
        - id: ch04-b02
          speaker: lin-yao
          text: 记下天线方位。复位，换等待时间。
        - id: ch04-b03
          speaker: narrator
          text: |-
            

            第二次，门开，弧线又出现。第三次也是。三个明亮的peryton都与开门时刻重合，扫频形状和档案事件相近。高频监测器同时抓住2.3到2.5吉赫兹的活动。

            汤姆从对讲机里问：
        - id: ch04-b04
          speaker: tom-baird
          text: 现在能叫答案了吗？
        - id: ch04-b05
          speaker: narrator
          text: |-
            

            林遥望着十三个同时发亮的窗口。几周前，它们曾让她觉得像十三位见证人；此刻它们更像十三根指向台站内部的手指。
        - id: ch04-b06
          speaker: lin-yao
          text: 能叫证据很强。还要测试角度，也要记住它不是每次都会发生。
        - id: ch04-b07
          speaker: narrator
          text: |-
            

            他们改变望远镜方向。当天线的焦点舱与厨房之间被碟面挡住时，同样开门并没有产生主系统里的peryton；在合适的相对角度，信号才容易被接收。其他微波炉也能在某些条件下制造相似事件，但对应的扫频参数不同。谜底不是简单的微波炉漏波，而是一串同时成立的条件：磁控管关断的瞬间、门提前打开、能量逸出、接收机几何位置恰好合适。

            至于关断中的磁控管为什么会在1.4吉赫兹附近留下那种酷似天文色散的扫频，团队没有假装已经明白。源头找到了，波形形成的细节仍是问题。

            下午的简报会上，露丝把最初三次记录投到墙上。林遥主动站起来。
        - id: ch04-b08
          speaker: lin-yao
          text: 我第一天把它当成可能的新天文现象，而且在十三路同时出现这条反证面前，我仍然偏爱那个解释。汤姆先提醒了我。
        - id: ch04-b09
          speaker: narrator
          text: |-
            

            汤姆把铅笔搁在桌面。
        - id: ch04-b10
          speaker: tom-baird
          text: 我也把电源、车辆和半个台站拖进来过。别只认领最体面的错误。
        - id: ch04-b11
          speaker: narrator
          text: |-
            

            屋里有人笑了，林遥也笑。她把宇宙候选从图表上划掉，在旁边写下台站射频干扰。那一笔没有让发现变小。它把真正的快速射电暴从一种模仿者旁边分开，也让以后的人多了几种辨认办法：看信号落进多少波束，看它是否严格服从冷等离子体的色散规律，看高频监测器是否同时出现本地活动，还要问天线当时朝哪儿、台站里谁正做什么。

            傍晚，观测重新开始。白色巨碟缓缓转向南方，厨房的旧微波炉贴上了操作提醒，却没有被当作荒唐证据藏起来。林遥终于去热那只早上没吃完的饭盒。她让计时器自然归零，听见一声普通的提示音，才打开门。

            回控制室的路上，夜空没有因为一个谜底来自厨房而缩小。相反，她经过那面六十四米的碟时，第一次清楚地感觉到：要听见很远的声音，必须先诚实地认出身边每一种响动。

            屏幕上的下一段数据已经开始。林遥坐下，把午餐时间也写进了新的观测日志。
