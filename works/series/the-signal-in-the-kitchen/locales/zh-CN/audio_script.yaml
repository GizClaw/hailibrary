audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 冷静亲切，讲到谜团时带着好奇, timbre: 温暖清晰, pace: 舒展自然, pitch: 中音}}
    lin-yao: {display_name: 林遥, tts: {delivery: 谨慎认真，思路渐明时更坚定, timbre: 清亮自然, pace: 中等, pitch: 中高音}}
    tom-baird: {display_name: 汤姆, tts: {delivery: 务实直接，带一点冷幽默, timbre: 略粗而沉稳, pace: 不疾不徐, pitch: 中低音}}
    ruth-marlow: {display_name: 露丝, tts: {delivery: 简洁果断，始终克制, timbre: 坚实清楚, pace: 稳定, pitch: 中音}}
  chapters:
    - id: ch01
      title: 十三只眼睛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            2015年1月19日，林遥第一次在帕克斯射电望远镜值早班。天刚亮，六十四米宽的白色巨碟从桉树林上方慢慢转过去，像一只竖起来听声音的大耳朵。控制室的冷气吹得她指尖发凉。她把咖啡挪到离仪器最远的角落，又把接收机状态一项项核对过去。刚上班第一周，她可不想闹出什么可笑的事故。

            快到中午，屏幕上忽然闪过一道短短的弧线。高频先到，低频晚一点，像遥远脉冲穿过稀薄等离子体后留下的拖痕。它只出现了一瞬，却被程序从噪声里捞了出来。林遥滑到屏幕前。十三路波束全都看见了它，而且亮得不讲道理。老技师汤姆正抱着一盒螺丝走过，她赶紧叫住他。
        - {id: ch01-b02, speaker: lin-yao, text: 这种扫频，你见过吗？}
        - {id: ch01-b03, speaker: narrator, text: 汤姆没急着看弧线，先看了看十三个小窗口。}
        - {id: ch01-b04, speaker: tom-baird, text: 十三路都有？}
        - {id: ch01-b05, speaker: lin-yao, text: 都有。}
        - {id: ch01-b06, speaker: narrator, text: 汤姆把螺丝盒放了下来。}
        - {id: ch01-b07, speaker: tom-baird, text: 那就不像是从碟面正对的天空来的。天上的点源，通常不会一口气敲响十三扇门。}
        - id: ch01-b08
          speaker: narrator
          text: |-
            林遥懂这个道理。多波束接收机就像十三只朝向略有不同的眼睛。远处的天体通常只落进一只，或相邻几只；附近的强干扰却可能从侧面闯进来，把十三路一起照亮。可这条弧偏偏又像天文脉冲的色散扫频。她放大图像，心里那点兴奋怎么也压不灭。
        - {id: ch01-b09, speaker: lin-yao, text: 也许是新的近场现象。也许接收机把一个真实事件铺开了。}
        - {id: ch01-b10, speaker: tom-baird, text: 两个“也许”。让它们排好队，别让谁插队，把自己当成答案。}
        - id: ch01-b11
          speaker: narrator
          text: 林遥存好原始数据、天线指向和设备日志后，运行负责人露丝赶来了。她看完图，只问了一句。
        - {id: ch01-b12, speaker: ruth-marlow, text: 能复现吗？}
        - {id: ch01-b13, speaker: lin-yao, text: 还不能。}
        - {id: ch01-b14, speaker: ruth-marlow, text: 那就叫候选信号，别叫发现。天上不欠我们一个惊喜。}
        - id: ch01-b15
          speaker: narrator
          text: 露丝说着，把值班表压在桌上。那句话扎了林遥一下。她本想在第一周证明自己能从噪声里认出不寻常的东西。可现在，她只能在事件记录上写下：来源未知。
    - id: ch02
      title: 总在白天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            1月22日，信号又来了。还是短促的扫频，还是十三路同时出现。两次记录很像，却不完全符合冷等离子体的精确规律。第二天下午，第三个事件也来了。新装的监测器同时在另一段频率上抓到强烈活动：主系统在约1.4吉赫兹看见弧线，监测器则在2.3到2.5吉赫兹附近亮了起来。

            林遥用铅笔把两处频段连起来。她已经连续三次推迟午饭，桌上的苹果滚进电缆图下面，磕出了一块褐斑。
        - {id: ch02-b02, speaker: lin-yao, text: 同一个时刻，两处频段。要是高频活动只在帕克斯出现，源头就离我们不远。}
        - {id: ch02-b03, speaker: narrator, text: 汤姆正给一只接头套防尘帽。}
        - {id: ch02-b04, speaker: tom-baird, text: “不远”这个范围可大了。无线网络、工具、电源、车辆，连天气放电都能排进来。}
        - {id: ch02-b05, speaker: lin-yao, text: 那天的天气很稳。}
        - {id: ch02-b06, speaker: tom-baird, text: 好。划掉一个嫌疑要有证据，留下一个也得有证据。}
        - id: ch02-b07
          speaker: narrator
          text: |-
            他们查时钟、换备用线缆、对比天线指向，还让汤姆在设备间把可能的干扰源一台台开关。林遥盼着某个动作能把弧线叫回来，可屏幕上只有普通噪声。每失败一次，就吃掉一点宝贵的观测时间。第三天，露丝拿着下一组天文学家的计划站到门口。
        - {id: ch02-b08, speaker: ruth-marlow, text: 还要多久？}
        - {id: ch02-b09, speaker: lin-yao, text: 我还想测主楼的几个电源。}
        - {id: ch02-b10, speaker: ruth-marlow, text: 昨天你也想测电源。}
        - {id: ch02-b11, speaker: lin-yao, text: 因为它们还没被排除。}
        - {id: ch02-b12, speaker: ruth-marlow, text: 排除要是没有边界，整个台站都会变成嫌疑人。给我一个可能被事实推翻的预测。}
        - id: ch02-b13
          speaker: narrator
          text: |-
            露丝看着林遥那张画满箭头的纸。林遥一时答不上来。那晚，她把档案事件按本地时间重新排了一遍。这种信号叫peryton，名字来自虚构的带翅膀鹿，因为它看着来自天空，表现得却离地面很近。已知事件大多出现在工作日和办公时间，正午前后最密。

            这线索俗得让她有点难为情。宇宙不看钟表，机器却跟着人的作息开关。她盯着磕坏的苹果，想起三次事件里有两次，自己都等数据处理完才去吃饭。

            第二天，她把预测写给露丝：如果源头和午间活动有关，2.3到2.5吉赫兹的尖峰白天会比夜里多；而且会有很多只有高频活动、没有1.4吉赫兹扫频的时刻。他们查了监测器从1月18日起的记录。白天果然挤着几百次高频尖峰，夜里稀少，真正的peryton却寥寥无几。预测只对了一半。人的设备确实在发射什么，可怪信号还缺一个条件。汤姆圈出了食堂方向。
        - {id: ch02-b14, speaker: tom-baird, text: 2.4吉赫兹附近，有什么机器一到中午就特别忙？}
        - {id: ch02-b15, speaker: lin-yao, text: 微波炉。, emotion: surprised}
    - id: ch03
      title: 一杯水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            帕克斯附近有好几台微波炉：塔楼、访客中心、宿舍，还有大家叫“羊毛棚”的厨房。微波炉的磁控管会在约2.45吉赫兹产生能量，金属外壳和门网本该把大部分能量关在里面。这能解释高频活动，却解释不了1.4吉赫兹的短促扫频。
        - {id: ch03-b02, speaker: lin-yao, text: 微波炉天天都在用，为什么怪信号只偶尔出现？}
        - {id: ch03-b03, speaker: tom-baird, text: 所以别拿空炉子试，也别把谁的午饭当实验材料。}
        - id: ch03-b04
          speaker: narrator
          text: |-
            汤姆说着，把一只陶瓷杯放到水槽下。2月27日维护日，望远镜朝着天顶。得到批准后，他们往杯里装满水，让几台微波炉按不同功率运行十秒到一分钟。林遥在控制室盯着十三路数据，汤姆在厨房按下启动键，每次都等计时自然结束。监测器一遍遍看到2.4吉赫兹活动，主系统却始终没有弧线。

            午后，一个peryton忽然跳上屏幕。林遥猛地站起来，耳机线差点把杯子带倒。
        - {id: ch03-b05, speaker: lin-yao, text: 是哪一台？, emotion: surprised}
        - {id: ch03-b06, speaker: narrator, text: 对讲机里先响起一阵杂音。}
        - {id: ch03-b07, speaker: tom-baird, text: 塔楼测试刚结束，可羊毛棚里也有人在热午餐。}
        - id: ch03-b08
          speaker: narrator
          text: |-
            两个动作撞在一起，谁都不能单独负责。林遥把结果记成“混杂”，不是“成功”。她很想保住这次漂亮的波形，可漂亮也补不上缺失的控制条件。

            3月12日，他们把望远镜转向过去容易收到peryton的方向，又试了一轮。每台微波炉都正常跑完，什么也没发生。林遥第一次认真怀疑：厨房线索会不会只是午餐时间制造的巧合？
        - {id: ch03-b09, speaker: ruth-marlow, text: 可以停了。, emotion: calm}
        - id: ch03-b10
          speaker: narrator
          text: 露丝没有责备，只把计划翻到下一页。林遥摘下耳机。汤姆靠在门框上，手里转着那只已经冷掉的水杯。
        - {id: ch03-b11, speaker: lin-yao, text: 再给我一次。不是重复今天。我想知道，平时使用和我们的测试到底差在哪儿。}
        - {id: ch03-b12, speaker: tom-baird, text: 有人会在提示音前拉门，这个动作我们没测过。但不能让普通人照着做。真要复现，只能由受过训练的人按批准的维护方案操作。}
        - {id: ch03-b13, speaker: ruth-marlow, text: 你是在提出一个动作，不是在提出一台机器。}
        - {id: ch03-b14, speaker: lin-yao, text: 对。磁控管得正在工作，门得提前打开，望远镜角度也得合适。少一个条件，都可能什么也看不见。}
        - {id: ch03-b15, speaker: ruth-marlow, text: 给你二十分钟维护窗口。先写操作顺序，杯里必须有水，一次只改一个条件。}
    - id: ch04
      title: 门开的一刻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            3月17日，羊毛棚厨房的百叶窗把阳光切成一道道亮带。米黄色的微波炉比林遥年纪还大，外壳满是细小磨痕。汤姆把装水的杯子放进去。林遥守在控制室，露丝站在两边之间用对讲机报时。这是维护期间的受控测试，只能由受过训练的工作人员来做。儿童和普通使用者绝不能打开或拆动正在工作的微波炉。

            第一次，汤姆让磁控管运行几秒，再拉开门。十三路波束同时亮了。林遥没有欢呼，只按下标记键，核对时间，让监测数据继续滚动。
        - {id: ch04-b02, speaker: lin-yao, text: 记下天线方位。复位，换一个等待时间。, emotion: calm}
        - id: ch04-b03
          speaker: narrator
          text: 第二次，门一开弧线又来了。第三次也是。三个明亮的peryton都和开门时刻对上，形状像档案事件，高频监测器也同时抓到2.3到2.5吉赫兹的活动。这时，汤姆的声音从对讲机里传来。
        - {id: ch04-b04, speaker: tom-baird, text: 这回能叫答案了吗？}
        - id: ch04-b05
          speaker: narrator
          text: 林遥望着十三个同时发亮的窗口。几周前，它们像十三位替宇宙作证的人。现在却像十三根手指，一齐指回台站里面。
        - {id: ch04-b06, speaker: lin-yao, text: 可以说证据很强。但还要测角度，也得记清楚，它不是每次都会发生。, emotion: calm}
        - id: ch04-b07
          speaker: narrator
          text: |-
            他们改变望远镜方向。碟面挡住厨房和焦点舱时，同样提前开门，主系统里却没有peryton；相对角度合适，才更容易收到。其他微波炉在某些条件下也能制造相似事件，但扫频参数不同。

            所以谜底不只是“微波炉漏波”。磁控管关断、门提前打开、能量逸出、接收机几何位置合适，这串条件得同时成立。即使这样，信号也不保证每次出现。至于关断中的磁控管为什么会在1.4吉赫兹附近留下酷似天文色散的扫频，团队没有假装已经懂了。源头找到了，波形怎么形成仍是问题。

            下午简报时，露丝投出最初三次记录。林遥主动站了起来。
        - {id: ch04-b08, speaker: lin-yao, text: 第一天，我更愿意相信它是新的天文现象。十三路同时出现明明是反证，我还是偏爱那个解释。汤姆先提醒了我。}
        - {id: ch04-b09, speaker: tom-baird, text: 我也怀疑过电源、车辆，还有半个台站。别把那些比较体面的错误都抢走。}
        - id: ch04-b10
          speaker: narrator
          text: |-
            屋里的人都笑了，林遥也笑了。她划掉“宇宙候选”，写上“台站射频干扰”。这没有让发现变小。它把真正的快速射电暴和模仿者分开，也留下了辨认办法：看多少路波束收到信号，扫频是否严格符合冷等离子体规律，高频监测器有没有本地活动，还要问天线朝哪儿、台站里的人在做什么。

            傍晚，观测重新开始，白色巨碟转向南方。旧微波炉贴上操作提醒，却没被当成荒唐证据藏起来。林遥终于去热早上没吃完的饭盒。她让计时器自然归零，听见普通的提示音，才打开门。

            回控制室时，她从六十四米巨碟旁走过。一个谜底来自厨房，并没有让夜空变小。恰恰相反，她第一次清楚地感觉到：想听见很远的声音，就得先诚实地认出身边每一种响动。

            新一段数据已经展开。林遥坐下，把“午餐时间”也写进新的观测日志。
