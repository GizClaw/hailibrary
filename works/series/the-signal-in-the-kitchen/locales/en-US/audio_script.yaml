audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and quietly curious
        timbre: warm and clear
        pace: measured
        pitch: medium
    lin-yao:
      display_name: Mara Lin
      tts:
        delivery: careful and determined with thoughtful pauses
        timbre: clear and natural
        pace: medium
        pitch: medium-high
    tom-baird:
      display_name: Tom Baird
      tts:
        delivery: practical and direct with dry humor
        timbre: weathered and steady
        pace: unhurried
        pitch: medium-low
    ruth-marlow:
      display_name: Ruth Marlow
      tts:
        delivery: concise and decisive without exaggeration
        timbre: firm and clear
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: Thirteen Windows
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            On January 19, 2015, Mara Lin began her first dawn shift at the Parkes radio telescope. Beyond the control-room glass, the sixty-four-meter dish turned above the eucalyptus trees with a motion too slow to see. The air-conditioning made her fingertips cold. She moved her coffee to the far end of the equipment rack and checked every receiver status twice. A new engineer could survive being cautious. She was less sure she could survive spilling coffee into a national telescope.

            The morning passed in ordinary noise. Just before lunch, a curved streak flashed across the search display. High frequencies arrived first, lower frequencies later. The shape resembled the mark left by a distant radio pulse traveling through thin plasma between the stars. It lasted only a fraction of a second across the band, but the search software pulled it cleanly from the background.

            Mara rolled her chair closer. The event was bright in every one of the receiver's thirteen beams.

            Tom Baird, the senior receiver technician, came through carrying a divided box of screws. Mara stopped him. 
        - id: ch01-b02
          speaker: lin-yao
          text: Have you seen a sweep like this?
        - id: ch01-b03
          speaker: narrator
          text: |-
            

            He looked at the thirteen panels before he looked at the curve. 
        - id: ch01-b04
          speaker: tom-baird
          text: |+
            All the beams?

        - id: ch01-b05
          speaker: lin-yao
          text: |+
            All of them.

        - id: ch01-b06
          speaker: tom-baird
          text: Then it didn't knock politely on the front of the dish.
        - id: ch01-b07
          speaker: narrator
          text: " Tom set down his box. "
        - id: ch01-b08
          speaker: tom-baird
          text: A point in the sky usually favors one beam, maybe a few neighbors. This thing came through every window.
        - id: ch01-b09
          speaker: narrator
          text: |+
            

            Mara knew the principle. The multibeam receiver was like thirteen eyes aimed in slightly different directions. A faraway source focused by the dish should make a pattern across one eye or a small group. Strong interference nearby could enter from the side and light them all. Yet the sweep looked disturbingly like dispersion, the delay that cold plasma gives to a genuine pulse from space.

        - id: ch01-b10
          speaker: lin-yao
          text: The receiver could have spread a real event,
        - id: ch01-b11
          speaker: narrator
          text: " she said. "
        - id: ch01-b12
          speaker: lin-yao
          text: Or it could be a new kind of near-field transient.
        - id: ch01-b13
          speaker: narrator
          text: |-
            

            Tom's mouth tilted. 
        - id: ch01-b14
          speaker: tom-baird
          text: Two could-bes. Keep them in line. Don't let either one cut ahead and call itself the answer.
        - id: ch01-b15
          speaker: narrator
          text: |-
            

            Ruth Marlow, the operations lead, arrived after Mara had saved the raw data, antenna position, and equipment logs. She studied the plots and asked one question. 
        - id: ch01-b16
          speaker: ruth-marlow
          text: |+
            Can we make it happen again?

        - id: ch01-b17
          speaker: lin-yao
          text: |+
            Not yet.

        - id: ch01-b18
          speaker: ruth-marlow
          text: Then call it a candidate.
        - id: ch01-b19
          speaker: narrator
          text: " Ruth pinned the next observing schedule beneath her hand. "
        - id: ch01-b20
          speaker: ruth-marlow
          text: The sky does not owe us a surprise.
        - id: ch01-b21
          speaker: narrator
          text: |-
            

            The words stung. Mara had wanted her first week to prove that she could recognize something extraordinary. Instead, she typed source unknown into the event record.
    - id: ch02
      title: The Hours People Keep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Three days later, the signal returned. It was again brief, swept, and visible in the beams together. A third event appeared the following afternoon. This time a new broadband interference monitor caught strong activity in another frequency range at the same moment. The main system saw the strange curve near 1.4 gigahertz; the monitor brightened between 2.3 and 2.5 gigahertz.

            Mara drew a line between the two records in her notebook. She had postponed lunch for the third time, and an apple had rolled beneath a cable diagram and bruised there. 
        - id: ch02-b02
          speaker: lin-yao
          text: |+
            If the higher-frequency activity happened only here, the source must be close to Parkes.

        - id: ch02-b03
          speaker: tom-baird
          text: Close still covers a crowd,
        - id: ch02-b04
          speaker: narrator
          text: " Tom said as he capped a connector. "
        - id: ch02-b05
          speaker: tom-baird
          text: |+
            Wireless gear, tools, power supplies, vehicles. Electrical discharge if the weather turns.

        - id: ch02-b06
          speaker: lin-yao
          text: |+
            The weather was steady.

        - id: ch02-b07
          speaker: tom-baird
          text: Good. Evidence lets a suspect leave. Evidence also lets one stay.
        - id: ch02-b08
          speaker: narrator
          text: |-
            

            They compared clocks, swapped spare cables, checked antenna directions, and switched possible sources on and off in the equipment rooms. Mara kept expecting one action to summon the curved trace. The displays gave her only ordinary noise. Each failed test consumed a small piece of observing time that belonged to other astronomers.

            On the third day, Ruth stood in the doorway holding the next team's schedule. 
        - id: ch02-b09
          speaker: ruth-marlow
          text: |+
            How much longer?

        - id: ch02-b10
          speaker: lin-yao
          text: |+
            I want to test the power units in the main building.

        - id: ch02-b11
          speaker: ruth-marlow
          text: |+
            You wanted to test power units yesterday.

        - id: ch02-b12
          speaker: lin-yao
          text: Because we have not excluded them.
        - id: ch02-b13
          speaker: narrator
          text: |-
            

            Ruth glanced at the page webbed with Mara's arrows. 
        - id: ch02-b14
          speaker: ruth-marlow
          text: Exclusion without a boundary makes the whole observatory a suspect. Give me a prediction that can fail.
        - id: ch02-b15
          speaker: narrator
          text: |-
            

            Mara had none ready. That evening she sorted every archived peryton by local time. Peryton was the whimsical name given to these signals: a mythical winged deer for an event that seemed celestial but behaved as if it were near the ground. Most known events had occurred on weekdays during working hours. When Mara shaded a square for each event, the darkest cluster gathered around midday.

            At first the clue embarrassed her. The universe did not take lunch breaks. Human machines often followed human schedules. She looked at her bruised apple and remembered that twice she had waited for the event record to finish before going to the kitchen.

            The next morning she wrote a prediction for Ruth. If human activity caused the high-frequency emission, spikes between 2.3 and 2.5 gigahertz should be more common by day than by night. There should also be many high-frequency spikes without a matching peryton at 1.4 gigahertz, because the strange event was rare.

            They searched monitor records beginning on January 18. Hundreds of high-frequency spikes crowded the daytime hours and thinned at night. Only a few had matching perytons. Mara's prediction had succeeded and failed in useful ways. People were operating something, but another condition was needed to make the swept burst.

            Tom circled the staff buildings on a site map. 
        - id: ch02-b16
          speaker: tom-baird
          text: What machine near 2.4 gigahertz works hardest at noon?
        - id: ch02-b17
          speaker: narrator
          text: |-
            

            Mara stared at the kitchen square. 
        - id: ch02-b18
          speaker: lin-yao
          text: A microwave oven.
    - id: ch03
      title: A Mug of Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            Several microwave ovens stood near the Parkes dish: one in the tower, one in the visitors center, others in the observers' quarters, and one in the staff kitchen known as the Woolshed. A microwave oven's magnetron produces energy around 2.45 gigahertz to heat food. The metal case and mesh in the door are meant to keep most of that energy inside. This could explain the monitor spikes. It did not explain why a brief sweep sometimes appeared near 1.4 gigahertz.

        - id: ch03-b02
          speaker: lin-yao
          text: The ovens run every day,
        - id: ch03-b03
          speaker: narrator
          text: " Mara said. "
        - id: ch03-b04
          speaker: lin-yao
          text: Why don't we see perytons every day?
        - id: ch03-b05
          speaker: narrator
          text: |-
            

            Tom filled a ceramic mug at the sink. 
        - id: ch03-b06
          speaker: tom-baird
          text: That is why we test the action, not just admire the noun. And we do not run an empty oven.
        - id: ch03-b07
          speaker: narrator
          text: |-
            

            On February 27, during scheduled maintenance, the dish was parked toward the zenith. With permission, they placed the mug of water in each nearby oven and ran it at different power settings for ten to sixty seconds. Mara watched all thirteen data streams from the control room. Tom waited in each kitchen until the timer finished normally.

            Again and again, the interference monitor registered activity near 2.4 gigahertz. The main receiver showed no curved burst.

            Late in the session, a peryton suddenly crossed Mara's screen. She rose so fast that her headset cord nearly pulled over her cup. 
        - id: ch03-b08
          speaker: lin-yao
          text: Which oven?
        - id: ch03-b09
          speaker: narrator
          text: |-
            

            Static answered first. Then Tom said, 
        - id: ch03-b10
          speaker: tom-baird
          text: The tower test just ended, but somebody was heating lunch in the Woolshed.
        - id: ch03-b11
          speaker: narrator
          text: |+
            

            Two actions had overlapped. Neither could take responsibility alone. Mara labeled the result confounded, not success. She wanted to keep the beautiful waveform as proof, but beauty could not supply a missing control.

            On March 12 they pointed the telescope toward directions associated with earlier detections and repeated the tests. Every oven completed its cycle. No peryton appeared. For the first time Mara wondered whether the kitchen theory was only a coincidence shaped like lunchtime.

        - id: ch03-b12
          speaker: ruth-marlow
          text: We can stop,
        - id: ch03-b13
          speaker: narrator
          text: |2-
             Ruth said. She did not sound angry. She simply turned the observing schedule to its next page.

            Mara removed her headset. 
        - id: ch03-b14
          speaker: lin-yao
          text: Give me one more window. Not another repeat of today. I want to know what ordinary use does that our test does not.
        - id: ch03-b15
          speaker: narrator
          text: |-
            

            Tom leaned against the doorway, turning the cold mug between his palms. 
        - id: ch03-b16
          speaker: tom-baird
          text: Ordinary people don't always wait for the beep. If five seconds feel too long, they pull the door.
        - id: ch03-b17
          speaker: narrator
          text: |-
            

            Ruth looked up. 
        - id: ch03-b18
          speaker: ruth-marlow
          text: |+
            You are proposing an action, not a machine.

        - id: ch03-b19
          speaker: lin-yao
          text: Yes,
        - id: ch03-b20
          speaker: narrator
          text: " Mara said. "
        - id: ch03-b21
          speaker: lin-yao
          text: The prediction is specific. The magnetron must still be operating. The door must open before the cycle ends. The telescope geometry must also be favorable. Remove one condition and we may get nothing.
        - id: ch03-b22
          speaker: narrator
          text: |-
            

            Ruth closed the folder. 
        - id: ch03-b23
          speaker: ruth-marlow
          text: Twenty minutes in the maintenance window. Write the sequence first. Water in the mug. Change one condition at a time.
    - id: ch04
      title: When the Door Opened
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            On March 17, sunlight came through the Woolshed blinds in bright bars. The microwave was older than Mara, with fine scratches along its cream-colored case. Tom placed the mug of water inside. Mara remained at the control-room displays while Ruth stood between the two rooms with a radio and a clock.

            For the first run, Tom let the magnetron operate for several seconds. Then he pulled open the door.

            All thirteen beams lit at once.

            Mara did not cheer. She marked the time and kept the monitor recording. 
        - id: ch04-b02
          speaker: lin-yao
          text: Log the antenna position. Reset. Change the delay.
        - id: ch04-b03
          speaker: narrator
          text: |-
            

            The second early opening produced another curve. So did the third. Three bright perytons lined up with the moments the door opened. Their sweeps resembled the archived signals, while the broadband monitor caught simultaneous emission between 2.3 and 2.5 gigahertz.

            Tom's voice came through the radio. 
        - id: ch04-b04
          speaker: tom-baird
          text: Can we call it an answer now?
        - id: ch04-b05
          speaker: narrator
          text: |-
            

            Mara looked at the thirteen glowing panels. Weeks earlier, they had seemed like thirteen witnesses to a celestial mystery. Now they were thirteen fingers pointing back into the observatory. 
        - id: ch04-b06
          speaker: lin-yao
          text: We can call the evidence strong. We still test the angle. And we write down that it doesn't happen every time.
        - id: ch04-b07
          speaker: narrator
          text: |-
            

            They changed the telescope's direction. When the dish blocked the line of sight between the kitchen and the receiver cabin, the same early opening produced no peryton in the main system. At a favorable relative angle, the receiver was more likely to catch one. Other ovens could make similar events under some conditions, but with different apparent sweep values.

            The solution was not simply that an oven leaked. It was a chain: the magnetron was shutting down, the door had opened before the timer ended, radio energy escaped, and the receiver geometry happened to be right. Even then, the event was not guaranteed.

            One part remained unsolved. The team had identified the source and the conditions, but they did not pretend to understand every detail of why a magnetron shutting down could create a sweep near 1.4 gigahertz that imitated astronomical dispersion. A solved source left an honest question inside it.

            At the afternoon briefing, Ruth projected the first three detections. Mara stood before anyone asked her to. 
        - id: ch04-b08
          speaker: lin-yao
          text: On the first day, I preferred the idea of a new astronomical event. I kept preferring it after the thirteen beams had given us evidence against it. Tom warned me first.
        - id: ch04-b09
          speaker: narrator
          text: |-
            

            Tom laid his pencil on the table. 
        - id: ch04-b10
          speaker: tom-baird
          text: I accused power supplies, vehicles, and half the site. Don't claim all the respectable mistakes for yourself.
        - id: ch04-b11
          speaker: narrator
          text: |-
            

            The room laughed, and Mara did too. She crossed celestial candidate from the chart and wrote on-site radio interference beside it. The correction did not make the work smaller. Perytons had once cast doubt on fast radio bursts. Separating the mimic from genuine sky events gave observers better questions: How many beams saw it? Did its sweep precisely follow cold-plasma dispersion? Was local activity present at 2.3 to 2.5 gigahertz? Where was the dish pointing? What were people doing on site?

            Observing resumed that evening. The white dish turned slowly south. The old Woolshed microwave received an operating reminder, but nobody hid it as an embarrassing piece of evidence. Mara finally reheated the lunch she had abandoned that morning. She let the timer reach zero, waited for the ordinary beep, and opened the door.

            Outside, the night had not become smaller because one mystery ended in a kitchen. Walking beneath the sixty-four-meter dish, Mara felt the opposite. To hear something very far away, they first had to recognize every nearby sound without flattery or shame.

            The next stream of data was already crossing the displays when she returned. Mara sat down and added lunchtime to the new observing log.
