audio_script:
  language: en-US
  cast:
    narrator: {display_name: Narrator, tts: {delivery: warm and observant with quiet curiosity, timbre: clear and rounded, pace: conversational, pitch: medium}}
    lin-yao: {display_name: Mara Lin, tts: {delivery: "careful and intent, growing firmer as the evidence builds", timbre: clear and natural, pace: medium, pitch: medium-high}}
    tom-baird: {display_name: Tom Baird, tts: {delivery: practical and direct with dry humor, timbre: weathered and steady, pace: unhurried, pitch: medium-low}}
    ruth-marlow: {display_name: Ruth Marlow, tts: {delivery: concise and decisive without drama, timbre: firm and clear, pace: steady, pitch: medium}}
  chapters:
    - id: ch01
      title: Thirteen Windows
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            January 19, 2015, was Mara Lin's first dawn shift at the Parkes radio telescope. Outside the control room, the sixty-four-meter dish turned above the eucalyptus trees, moving too slowly for the eye to catch. The air-conditioning chilled her fingers. She put her coffee at the far end of the equipment rack and checked every receiver status twice. Being cautious wouldn't hurt a new engineer. Spilling coffee into a national telescope certainly would.

            The morning brought nothing but ordinary noise. Then, just before lunch, a curved streak flashed across the display. The high frequencies arrived first, the low ones later. It looked like the trail a distant radio pulse leaves after traveling through thin plasma between the stars. The whole thing lasted only a fraction of a second, but the search software pulled it cleanly out of the background.

            Mara rolled closer. The event was bright in all thirteen receiver beams. Senior technician Tom Baird walked by with a divided box of screws, and she stopped him.
        - {id: ch01-b02, speaker: lin-yao, text: "Have you ever seen a sweep like this?"}
        - {id: ch01-b03, speaker: narrator, text: Tom looked at the thirteen panels before he looked at the curve.}
        - {id: ch01-b04, speaker: tom-baird, text: "All the beams?"}
        - {id: ch01-b05, speaker: lin-yao, text: Every one.}
        - {id: ch01-b06, speaker: narrator, text: Tom set down his box of screws.}
        - {id: ch01-b07, speaker: tom-baird, text: "Then it didn't knock politely on the front of the dish. A point in the sky usually favors one beam, maybe a few neighbors. This thing came through every window."}
        - id: ch01-b08
          speaker: narrator
          text: |-
            Mara knew that. The multibeam receiver was like thirteen eyes, each aimed a little differently. A distant source focused by the dish should land in one eye or a small group. Strong interference nearby could slip in from the side and light them all. Still, the sweep looked disturbingly like the delay cold plasma gives a real pulse from space.
        - {id: ch01-b09, speaker: lin-yao, text: The receiver could've spread a real event. Or maybe it's a new kind of near-field transient.}
        - {id: ch01-b10, speaker: tom-baird, text: Two maybes. Keep them in line. Don't let either one cut ahead and call itself the answer.}
        - id: ch01-b11
          speaker: narrator
          text: By the time operations lead Ruth Marlow arrived, Mara had saved the raw data, antenna position, and equipment logs. Ruth studied the plots and asked one question.
        - {id: ch01-b12, speaker: ruth-marlow, text: "Can we make it happen again?"}
        - {id: ch01-b13, speaker: lin-yao, text: Not yet.}
        - {id: ch01-b14, speaker: ruth-marlow, text: "Then call it a candidate. The sky doesn't owe us a surprise."}
        - id: ch01-b15
          speaker: narrator
          text: Ruth pinned the next observing schedule beneath her hand. The words stung. Mara had wanted her first week to prove she could spot something extraordinary in the noise. Instead, she typed “source unknown” into the event record.
    - id: ch02
      title: The Hours People Keep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Three days later, the signal came back: brief, swept, and visible in the beams together. A third event appeared the next afternoon. This time, a new broadband interference monitor caught strong activity in another frequency range at the same moment. The main system saw the curve near 1.4 gigahertz. The monitor lit up between 2.3 and 2.5.

            Mara linked the two records in her notebook. She'd put off lunch for the third time, and an apple had rolled under a cable diagram and bruised there.
        - {id: ch02-b02, speaker: lin-yao, text: "If the higher-frequency activity only happened here, the source has to be close to Parkes."}
        - {id: ch02-b03, speaker: narrator, text: Tom was capping a connector.}
        - {id: ch02-b04, speaker: tom-baird, text: "Close still covers a crowd. Wireless gear, tools, power supplies, vehicles—even an electrical discharge if the weather turns."}
        - {id: ch02-b05, speaker: lin-yao, text: The weather was steady.}
        - {id: ch02-b06, speaker: tom-baird, text: "Good. Evidence lets a suspect leave. Evidence lets one stay, too."}
        - id: ch02-b07
          speaker: narrator
          text: |-
            They compared clocks, swapped spare cables, checked antenna directions, and had Tom switch possible sources on and off in the equipment rooms. Mara kept waiting for one action to summon the curve. All she got was ordinary noise. Every failed test used observing time that belonged to other astronomers. On the third day, Ruth appeared with the next team's schedule.
        - {id: ch02-b08, speaker: ruth-marlow, text: "How much longer?"}
        - {id: ch02-b09, speaker: lin-yao, text: I want to test the power units in the main building.}
        - {id: ch02-b10, speaker: ruth-marlow, text: You wanted to test power units yesterday.}
        - {id: ch02-b11, speaker: lin-yao, text: Because we haven't ruled them out.}
        - {id: ch02-b12, speaker: ruth-marlow, text: "If exclusion has no boundary, the whole observatory becomes a suspect. Give me a prediction that can fail."}
        - id: ch02-b13
          speaker: narrator
          text: |-
            Ruth glanced at Mara's page, webbed with arrows. Mara didn't have an answer ready. That evening, she sorted every archived peryton by local time. The name came from a mythical winged deer—a fitting name for signals that looked celestial but acted as if they were near the ground. Most known events had happened on weekdays, during working hours. The darkest cluster sat around noon.

            At first, the clue embarrassed her. The universe didn't take lunch breaks. Human machines did follow human schedules. She looked at the bruised apple and remembered that twice, she'd waited for the event record to finish before heading to the kitchen.

            The next morning she gave Ruth a prediction. If human activity caused the high-frequency emission, the 2.3-to-2.5-gigahertz spikes should be more common by day than by night. And there should be plenty of those spikes without a matching peryton at 1.4 gigahertz.

            Records going back to January 18 showed hundreds of high-frequency spikes in the daytime and far fewer at night. Only a handful matched perytons. Her prediction had worked and failed in a useful way. People were operating something, but the swept burst needed one more condition. Tom circled the staff buildings on a site map.
        - {id: ch02-b14, speaker: tom-baird, text: "What machine near 2.4 gigahertz works hardest at noon?"}
        - {id: ch02-b15, speaker: lin-yao, text: A microwave oven., emotion: surprised}
    - id: ch03
      title: A Mug of Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            There were several microwave ovens near the Parkes dish: in the tower, the visitors center, the observers' quarters, and the staff kitchen called the Woolshed. A microwave magnetron makes energy around 2.45 gigahertz to heat food. The metal case and door mesh are supposed to keep most of it inside. That could explain the monitor spikes. It couldn't explain the brief sweep near 1.4 gigahertz.
        - {id: ch03-b02, speaker: lin-yao, text: "The ovens run every day. Why don't we see perytons every day?"}
        - {id: ch03-b03, speaker: tom-baird, text: That's why we test the action instead of admiring the noun. And we don't run an empty oven.}
        - id: ch03-b04
          speaker: narrator
          text: |-
            Tom filled a ceramic mug at the sink. On February 27, during scheduled maintenance, the dish pointed at the zenith. With permission, they placed the mug in each nearby oven and ran it at different power settings for ten to sixty seconds. Mara watched all thirteen streams from the control room. Tom waited in each kitchen and let every timer finish normally. Again and again, the monitor saw activity near 2.4 gigahertz. The main receiver saw no curve.

            Late in the session, a peryton suddenly crossed Mara's screen. She jumped up so fast her headset cord nearly pulled over her cup.
        - {id: ch03-b05, speaker: lin-yao, text: "Which oven?", emotion: surprised}
        - {id: ch03-b06, speaker: narrator, text: Static came through the radio first.}
        - {id: ch03-b07, speaker: tom-baird, text: "The tower test just ended, but somebody was heating lunch in the Woolshed."}
        - id: ch03-b08
          speaker: narrator
          text: |-
            Two actions had overlapped. Neither could take the blame alone. Mara labeled the result “confounded,” not “success.” She wanted to keep the beautiful waveform as proof, but beauty couldn't replace a missing control.

            On March 12, they pointed the telescope toward directions linked to older detections and tried again. Every oven finished its cycle. Nothing happened. For the first time, Mara seriously wondered if the kitchen theory was only a lunchtime coincidence.
        - {id: ch03-b09, speaker: ruth-marlow, text: We can stop., emotion: calm}
        - id: ch03-b10
          speaker: narrator
          text: Ruth didn't scold her. She simply turned the observing schedule to the next page. Mara took off her headset. Tom leaned against the doorway, turning the cold mug between his palms.
        - {id: ch03-b11, speaker: lin-yao, text: Give me one more window—not another repeat of today. I want to know what ordinary use does that our test doesn't.}
        - {id: ch03-b12, speaker: tom-baird, text: Some people pull the door before the beep. We haven't tested that. But nobody should copy it as a kitchen experiment. Only trained staff can try it under Ruth's approved maintenance plan.}
        - {id: ch03-b13, speaker: ruth-marlow, text: "You're proposing an action, not a machine."}
        - {id: ch03-b14, speaker: lin-yao, text: "Right. The magnetron must still be running. The door must open early. The telescope geometry must be right. Take away one condition, and we may get nothing."}
        - {id: ch03-b15, speaker: ruth-marlow, text: You get twenty minutes in the maintenance window. Write the sequence first. Water in the mug. Change one condition at a time.}
    - id: ch04
      title: When the Door Opened
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            On March 17, the Woolshed blinds cut the sunlight into bright bars. The cream-colored microwave was older than Mara, with fine scratches around its case. Tom put the mug of water inside. Mara stayed at the control-room displays, and Ruth stood between the rooms with a radio and a clock. This was a controlled maintenance test for trained observatory staff. Children and ordinary kitchen users should never open or tamper with an operating microwave.

            On the first run, Tom let the magnetron work for several seconds, then pulled the door open. All thirteen beams lit at once. Mara didn't cheer. She marked the time and kept the monitor rolling.
        - {id: ch04-b02, speaker: lin-yao, text: Log the antenna position. Reset. Change the delay., emotion: calm}
        - id: ch04-b03
          speaker: narrator
          text: The second early opening made another curve. So did the third. Three bright perytons lined up with the moments the door opened. Their sweeps resembled the archived signals, and the monitor caught activity between 2.3 and 2.5 gigahertz at the same time. Then Tom's voice came through the radio.
        - {id: ch04-b04, speaker: tom-baird, text: "Can we call it an answer now?"}
        - id: ch04-b05
          speaker: narrator
          text: Mara looked at the thirteen glowing panels. Weeks ago, they'd seemed like thirteen witnesses to a celestial mystery. Now they looked like thirteen fingers pointing back into the observatory.
        - {id: ch04-b06, speaker: lin-yao, text: "We can call the evidence strong. We still test the angle, and we write down that it doesn't happen every time.", emotion: calm}
        - id: ch04-b07
          speaker: narrator
          text: |-
            They changed the telescope's direction. When the dish blocked the path between the kitchen and receiver cabin, the same early opening produced no peryton. At a favorable angle, the receiver was more likely to catch one. Other ovens could make similar events under some conditions, but their apparent sweep values differed.

            So the answer wasn't simply “the oven leaked.” It took a chain of conditions: the magnetron was shutting down, the door opened before the timer ended, radio energy escaped, and the receiver geometry happened to be right. Even then, an event wasn't guaranteed.

            One piece stayed unsolved. The team had found the source, but they didn't pretend to know exactly why a shutting-down magnetron could make a sweep near 1.4 gigahertz that mimicked astronomical dispersion. A solved source could still hold an honest question.

            At the afternoon briefing, Ruth projected the first three detections. Mara stood before anyone asked her to.
        - {id: ch04-b08, speaker: lin-yao, text: "On the first day, I preferred the idea of a new astronomical event. I kept preferring it after the thirteen beams gave us evidence against it. Tom warned me first."}
        - {id: ch04-b09, speaker: tom-baird, text: "I accused power supplies, vehicles, and half the site. Don't claim all the respectable mistakes for yourself."}
        - id: ch04-b10
          speaker: narrator
          text: |-
            Tom laid his pencil on the table. The room laughed, and Mara did too. She crossed out “celestial candidate” and wrote “on-site radio interference.” That didn't make the work smaller. Perytons had cast doubt on fast radio bursts. Separating the mimic from real sky events gave observers better questions: How many beams saw it? Did the sweep precisely follow cold-plasma dispersion? Was local activity present between 2.3 and 2.5 gigahertz? Where was the dish pointing? What were people doing on site?

            Observing resumed that evening. The white dish turned south. The old Woolshed microwave got an operating reminder, but nobody hid it like an embarrassing piece of evidence. Mara finally reheated the lunch she'd abandoned that morning. She let the timer reach zero, waited for the ordinary beep, and opened the door.

            Outside, the night hadn't grown smaller because one mystery ended in a kitchen. Walking beneath the sixty-four-meter dish, Mara felt the opposite. To hear something very far away, they first had to recognize every nearby sound without flattery or shame.

            When she returned to the control room, the next stream of data was already crossing the displays. Mara sat down and added lunchtime to the new observing log.
