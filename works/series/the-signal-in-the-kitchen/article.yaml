cover_prompt: |-
  A wordless wide exterior of the 64-meter Parkes radio telescope in rural New South Wales in early 2015, its immense white dish tilted beneath a midnight-blue star field. In the lower foreground, fictional young engineer Lin Yao stands beside the control-building window, a Chinese Australian woman in her late twenties with warm beige skin, a short black bob tucked behind one ear, a mustard-yellow field jacket over a navy work shirt, dark trousers, and a teal lanyard with a blank badge. One hand holds a small spiral notebook with its cover turned away; the other rests near a glowing amber desk lamp. Far behind her, a modest staff-kitchen window gives off one tiny warm rectangle of light, visually echoing a faint curved radio sweep in the sky without showing any symbols or data. Emphasize the contrast between the enormous dish, the quiet human buildings, and the deceptively ordinary kitchen. No visible text, letters, numbers, logos, captions, signs, screen glyphs, watermarks, or signatures.
