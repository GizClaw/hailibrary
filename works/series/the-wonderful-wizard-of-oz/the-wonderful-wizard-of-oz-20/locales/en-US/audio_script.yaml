  chapters:
    - id: ch01
      title: Chapter XIX Attacked by the Fighting Trees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next morning, Dorothy kissed the pretty green girl good-bye.
            Everyone shook hands with the soldier with the green whiskers, who
            had walked beside them all the way to the gate. The Guardian was
            amazed to see them leaving the beautiful City for more trouble.
            Still, he unlocked their spectacles at once, put them back in the
            green box, and wished the travelers well.
        - id: ch01-b02
          speaker: guardian
          text: >-
            You rule the City now, Scarecrow. You must come back to us as soon
            as you can.
        - id: ch01-b03
          speaker: scarecrow
          text: >-
            I certainly will, if I can. But first I have to help Dorothy find
            her way home.
        - id: ch01-b04
          speaker: narrator
          text: Dorothy said one last good-bye to the kind Guardian.
        - id: ch01-b05
          speaker: dorothy
          text: >-
            Everyone in your lovely City has treated me with such kindness. I
            can't begin to tell you how grateful I am.
        - id: ch01-b06
          speaker: guardian
          text: >-
            You don't have to try, my dear. We'd be happy to keep you here. But
            if you truly want to return to Kansas, I hope you find a way.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then he opened the outer gate, and the travelers set off on their
            journey.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Bright sunshine welcomed them as they turned toward the Land of the
            South. They laughed and talked as they walked, and everyone's
            spirits were high. Dorothy had fresh hope that she would get home.
            The Scarecrow and the Tin Woodman were glad to be useful to her.
            The Lion sniffed the fresh country air with delight and swished his
            tail from side to side. He was overjoyed to be out of the City.
            Toto raced around the group, barking merrily as he chased moths and
            butterflies.
        - id: ch01-b09
          speaker: cowardly_lion
          text: >-
            City life doesn't suit me at all. I've grown much thinner since I
            lived there. Now I want the chance to show the other beasts how
            brave I've become.
        - id: ch01-b10
          speaker: narrator
          text: >-
            They turned for one last look at the Emerald City. Beyond the green
            walls, they could see a great cluster of towers and steeples. High
            above them all rose the dome and spires of Oz's Palace.
        - id: ch01-b11
          speaker: tin_woodman
          text: >-
            Oz wasn't such a bad Wizard after all.
        - id: ch01-b12
          speaker: narrator
          text: His heart rattled inside his chest as he spoke.
        - id: ch01-b13
          speaker: scarecrow
          text: >-
            He knew how to give me brains, and they're very good brains, too.
        - id: ch01-b14
          speaker: cowardly_lion
          text: >-
            If Oz had swallowed a dose of the courage he gave me, he would've
            been a brave man himself.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Dorothy stayed quiet. Oz had failed to keep his promise to her, but
            she knew he had done his best, so she forgave him. What he had said
            about himself was true. He might have been a bad Wizard, but he was
            still a good man.
        - id: ch01-b16
          speaker: narrator
          text: >-
            All that first day, they traveled through the green fields and
            bright flowers that spread away from the Emerald City on every
            side. That night, there was no roof over them but the stars. They
            slept on the soft grass and rested very well.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The next morning, they went on until a thick forest blocked their
            path. It stretched as far as they could see in both directions.
            They couldn't go around it. Besides, they were afraid that if they
            changed the direction of their journey, they might lose their way.
            So they walked along the edge and searched for the easiest place to
            enter.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The Scarecrow led the way. At last, he found a huge tree whose
            branches spread so wide that the whole party could pass underneath.
            He stepped forward. The moment he came under the first branches,
            they bent down and wrapped around him. Then they lifted him off the
            ground and hurled him headfirst into the friends waiting behind him.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The Scarecrow wasn't hurt, but he was certainly startled. He looked
            rather dizzy when Dorothy picked him up.
        - id: ch01-b20
          speaker: cowardly_lion
          text: There's another opening between the trees over here.
        - id: ch01-b21
          speaker: scarecrow
          text: >-
            Let me go first. Being tossed around can't hurt me.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He walked toward the next tree. Its branches grabbed him at once
            and threw him back again.
        - id: ch01-b23
          speaker: dorothy
          text: What a strange thing! How are we going to get through?
          emotion: surprised
        - id: ch01-b24
          speaker: cowardly_lion
          text: >-
            These trees have decided to fight us. They mean to stop us from
            going any farther.
        - id: ch01-b25
          speaker: tin_woodman
          text: I'll try it myself.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Tin Woodman put his axe on his shoulder and marched toward the
            first tree, the one that had treated the Scarecrow so roughly. A
            thick branch bent down to seize him. He swung his axe fiercely and
            chopped the branch in two. At once, the tree began shaking every
            one of its branches as if it were in pain. While it trembled, the
            Tin Woodman walked safely underneath.
        - id: ch01-b27
          speaker: tin_woodman
          text: Come through! Hurry!
        - id: ch01-b28
          speaker: narrator
          text: >-
            They all dashed under the tree without being hurt. All except Toto.
            A small branch caught him and shook him until he howled. The Tin
            Woodman quickly cut off the branch and freed the little dog.
        - id: ch01-b29
          speaker: narrator
          text: >-
            None of the other trees tried to stop them. The travelers decided
            that only the first row could bend its branches. Those trees must
            be the policemen of the forest. They had probably been given this
            wonderful power so they could keep strangers from entering.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The four friends passed easily through the rest of the woods. But
            at the far edge, another surprise waited right in front of them. A
            high white wall stood in their way. It seemed to be made of china, and its
            surface was as smooth as the surface of a dish. When they stood
            before it, they could see that the wall rose higher than any of
            their heads.
        - id: ch01-b31
          speaker: dorothy
          text: What do we do now?
        - id: ch01-b32
          speaker: tin_woodman
          text: >-
            I'll build a ladder. We certainly have to climb over this wall.
