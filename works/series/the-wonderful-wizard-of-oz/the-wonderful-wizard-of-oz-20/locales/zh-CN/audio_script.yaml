audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    soldier:
      display_name: 绿胡子卫兵
      tts:
        delivery: 恭敬谨慎，回答问题时朴实坦白
        timbre: 清晰温厚
        pace: 平稳
        pitch: 中低音
    guardian:
      display_name: 城门守卫
      tts:
        delivery: 守礼而健谈，惊讶时直率爽快
        timbre: 明亮结实
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章　遭遇会打人的树
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，多萝茜吻别了漂亮的绿衣姑娘。绿胡子卫兵把大家一直送到城门口，伙伴们也一一同他握手告别。守门人看到他们回来，惊讶得不得了。他实在想不通，这群人为什么肯离开美丽的翡翠城，再出去招惹新的麻烦。不过，他还是马上打开眼镜上的锁，把眼镜收回绿盒子，又送给他们一连串美好的祝愿。
        - id: ch01-b02
          speaker: guardian
          text: 稻草人，现在你是我们的统治者了。你一定要尽快回来呀。
        - id: ch01-b03
          speaker: scarecrow
          text: 只要办得到，我一定回来。不过眼下，我得先帮多萝茜回家。
        - id: ch01-b04
          speaker: narrator
          text: 多萝茜最后一次向这位和气的守门人道别。
        - id: ch01-b05
          speaker: dorothy
          text: 在这座美丽的城里，你们一直待我特别亲切，每个人都对我很好。我心里这么感激，都不知道该怎么说才好。
        - id: ch01-b06
          speaker: guardian
          text: 那就别费心说了，亲爱的。我们都想留你住下。可你既然想回堪萨斯，我就祝你早日找到回家的路。
        - id: ch01-b07
          speaker: narrator
          text: 守门人打开外城墙的大门。伙伴们带着他的祝愿走出城去，就此踏上了新的旅程。
        - id: ch01-b08
          speaker: narrator
          text: 他们转向南方时，阳光正灿烂地照着大地。大家精神好极了，一路说说笑笑。多萝茜又有了回家的希望。稻草人和铁皮樵夫也很开心，因为他们又能帮她了。狮子使劲嗅着新鲜空气，尾巴快活地甩来甩去。他终于又回到乡野了。托托绕着大伙儿跑来跑去，一会儿追飞蛾，一会儿追蝴蝶，还不停地欢叫。
        - id: ch01-b09
          speaker: cowardly_lion
          text: 城里的生活真不适合我。我在那里住了一阵，身上的肉都少了不少。现在我只想找个机会，让别的野兽瞧瞧，我到底变得多勇敢了。
        - id: ch01-b10
          speaker: narrator
          text: 伙伴们回过头，最后看了一眼翡翠城。绿色城墙后面，只剩下一片高塔和尖顶。奥兹王宫的尖塔与圆顶，还高高耸立在所有屋顶之上。
        - id: ch01-b11
          speaker: narrator
          text: 铁皮樵夫胸膛里的心叮当响了几声。
        - id: ch01-b12
          speaker: tin_woodman
          text: 现在想想，奥兹这个魔法师其实也没有那么坏。
        - id: ch01-b13
          speaker: scarecrow
          text: 他知道怎么给我装上脑子，而且还是一副非常好的脑子。
        - id: ch01-b14
          speaker: cowardly_lion
          text: 奥兹要是也吃下一剂他给我的勇气，肯定会成为一个勇敢的人。
        - id: ch01-b15
          speaker: narrator
          text: 多萝茜没有说话。奥兹答应她的事没能做到，可他确实尽力了，所以她原谅了他。奥兹自己说得没错。他不是一个好魔法师，却是一个好人。
        - id: ch01-b16
          speaker: narrator
          text: 第一天，他们一路穿过绿色的田野和鲜艳的花丛。那些田野和花朵围绕着翡翠城，一直伸向四面八方。夜里，伙伴们就睡在草地上，头顶只有满天星光。大家都睡得很安稳。
        - id: ch01-b17
          speaker: narrator
          text: 第二天早晨，他们继续前进，没过多久，一片茂密的森林挡住了去路。森林向左右两边伸展，一眼望不到头，想绕也绕不过去。他们又怕迷路，不敢换个方向走，只好沿着林边寻找最容易进去的地方。
        - id: ch01-b18
          speaker: narrator
          text: 稻草人走在最前面。他终于看到一棵枝条铺得很开的大树，树下留出的空隙正好能让大家通过。可他刚走到最外面的树枝下面，那些枝条突然垂下来，紧紧缠住他。下一刻，稻草人被提到半空，又头朝下扔回伙伴们中间。
        - id: ch01-b19
          speaker: narrator
          text: 这一摔伤不到稻草人，却着实吓了他一跳。多萝茜把他扶起来时，他还有点晕头转向。
        - id: ch01-b20
          speaker: cowardly_lion
          text: 这边的两棵树之间也有空隙！
        - id: ch01-b21
          speaker: scarecrow
          text: 这回还是让我先试。反正摔来摔去，我也不会受伤。
        - id: ch01-b22
          speaker: narrator
          text: 稻草人说着便朝另一棵树走去。谁知那棵树的枝条立刻捉住他，又把他远远扔了回来。
        - id: ch01-b23
          speaker: dorothy
          text: 这也太奇怪了！我们现在怎么办？
          emotion: surprised
        - id: ch01-b24
          speaker: cowardly_lion
          text: 看样子，这些树一心要跟我们打架，非把我们的路堵住不可。
        - id: ch01-b25
          speaker: tin_woodman
          text: 我看，这次让我亲自试试。
        - id: ch01-b26
          speaker: narrator
          text: 铁皮樵夫把斧头往肩上一扛，大步走向第一棵粗暴扔开稻草人的树。一根粗树枝弯下来捉他。他猛地挥起斧头，一斧就把树枝砍成两段。大树立刻抖动所有枝条，好像疼得受不了。铁皮樵夫趁这个机会，平安走到了树下另一边。
        - id: ch01-b27
          speaker: tin_woodman
          text: 快过来！大家动作快！
        - id: ch01-b28
          speaker: narrator
          text: 伙伴们一齐冲了过去，谁也没有受伤，只有托托被一根小树枝抓住，摇得嗷嗷直叫。铁皮樵夫赶紧砍断那根树枝，把小狗救了下来。
        - id: ch01-b29
          speaker: narrator
          text: 森林里其余的树都没有拦他们。大家这才猜到，只有最外面一排树能弯下枝条。也许它们就是森林的守卫，才会有这种奇妙的本领，专门把陌生人挡在外面。
        - id: ch01-b30
          speaker: narrator
          text: 四位旅行者顺顺当当地穿过树林，来到了森林另一边。可眼前的东西又让他们吃了一惊。那里立着一道高墙，看起来像用白瓷做成的。墙面像盘子一样光滑，墙头还远远高过了他们。
        - id: ch01-b31
          speaker: dorothy
          text: 这下我们该怎么办？
        - id: ch01-b32
          speaker: tin_woodman
          text: 我来做一架梯子吧。无论如何，我们都得翻过这道墙。
