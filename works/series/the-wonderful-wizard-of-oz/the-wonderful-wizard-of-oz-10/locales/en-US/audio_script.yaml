  chapters:
    - id: ch01
      title: Chapter IX The Queen of the Field Mice
      blocks:
        - id: ch01-b01
          speaker: scarecrow
          text: >-
            We must be close to the yellow brick road now. We've traveled
            almost as far as the river swept us away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Tin Woodman was about to answer when a low growl made him turn
            his head on its smooth hinges. A strange beast was racing over the
            grass toward them. It was a huge yellow Wildcat, and it seemed to
            be chasing something. Its ears lay flat against its head. Its mouth
            gaped wide, showing two rows of ugly teeth, and its red eyes burned
            like balls of fire. As it drew closer, the Woodman saw a little
            gray field mouse fleeing ahead of it. He had no heart, but he knew
            it was wrong for the Wildcat to kill such a pretty, harmless
            creature.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The Woodman lifted his axe. As the Wildcat rushed past, he struck
            one quick blow and cut its head clean from its body. The beast
            tumbled at his feet in two pieces.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Safe from her enemy, the field mouse stopped. She slowly came up
            to the Woodman and spoke in a tiny, squeaky voice.
        - id: ch01-b05
          speaker: mouse_queen
          text: Thank you! Oh, thank you for saving my life!
        - id: ch01-b06
          speaker: tin_woodman
          text: >-
            Please, don't mention it. I have no heart, so I always try to help
            anyone who needs a friend, even a little mouse.
        - id: ch01-b07
          speaker: mouse_queen
          text: >-
            A little mouse? I am a queen! I am Queen of all the Field Mice!
          emotion: angry
        - id: ch01-b08
          speaker: tin_woodman
          text: Oh! I see.
        - id: ch01-b09
          speaker: narrator
          text: The Woodman gave her a bow.
        - id: ch01-b10
          speaker: mouse_queen
          text: Then saving me was not only brave. It was a great deed.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Just then, several mice came running as fast as their little legs
            could carry them. When they saw their Queen alive, they cried out.
        - id: ch01-b12
          speakers: [field_mouse_1, field_mouse_2, field_mouse_3, field_mouse_4]
          ensemble: chorus
          text: >-
            Your Majesty! We thought the Wildcat would kill you! How did you
            ever escape?
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: >-
            They bowed so low that they nearly stood on their heads.
        - id: ch01-b14
          speaker: mouse_queen
          text: >-
            This amusing tin man killed the Wildcat and rescued me. From now
            on, you must serve him and obey every wish he makes.
        - id: ch01-b15
          speakers: [field_mouse_1, field_mouse_2, field_mouse_3, field_mouse_4]
          ensemble: chorus
          text: We will!
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then all the mice dashed away in every direction. Toto had awakened
            from his sleep. The sight of so many mice delighted him. He barked
            once and sprang right into the middle of them. Back in Kansas, he
            had always loved chasing mice, and he saw nothing wrong with it.
            But the Tin Woodman caught Toto in his arms and held him tight.
        - id: ch01-b17
          speaker: tin_woodman
          text: Come back! All of you, come back! Toto won't hurt you.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The Queen poked her head out from beneath a clump of grass. Her
            voice was timid now.
        - id: ch01-b19
          speaker: mouse_queen
          text: Are you certain he won't bite us?
          emotion: fearful
        - id: ch01-b20
          speaker: tin_woodman
          text: I won't let him. You don't need to be afraid.
        - id: ch01-b21
          speaker: narrator
          text: >-
            One by one, the mice crept back. Toto did not bark again, though he
            struggled to escape the Woodman's arms. He would have bitten the
            Woodman if he had not known very well that the man was made of tin.
            At last, one of the largest mice spoke.
        - id: ch01-b22
          speaker: large_field_mouse
          text: >-
            Is there some way we can repay you for saving our Queen?
        - id: ch01-b23
          speaker: tin_woodman
          text: I can't think of anything.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The Scarecrow had been trying to think. That was difficult with a
            head stuffed full of straw, but suddenly he had an answer.
        - id: ch01-b25
          speaker: scarecrow
          text: >-
            Yes, there is! You can help save our friend, the Cowardly Lion. He
            is asleep in the poppy field.
        - id: ch01-b26
          speaker: mouse_queen
          text: A Lion? He would eat every one of us!
          emotion: fearful
        - id: ch01-b27
          speaker: scarecrow
          text: >-
            No, he wouldn't. This Lion is a coward.
        - id: ch01-b28
          speaker: mouse_queen
          text: Is that really true?
        - id: ch01-b29
          speaker: scarecrow
          text: >-
            He says it himself. And he would never harm anyone who is our
            friend. Help us rescue him, and I promise he will always be kind to
            you.
        - id: ch01-b30
          speaker: mouse_queen
          text: All right. We trust you. What do you need us to do?
        - id: ch01-b31
          speaker: scarecrow
          text: >-
            How many mice call you their Queen and will follow your orders?
        - id: ch01-b32
          speaker: mouse_queen
          text: Thousands of them.
        - id: ch01-b33
          speaker: scarecrow
          text: >-
            Then send for all of them. Tell them to come here as quickly as
            they can, and each one must bring a long piece of string.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The Queen turned to the mice who attended her and ordered them to
            gather all her people at once. The moment they heard her command,
            they raced away in every direction as fast as they could go.
        - id: ch01-b35
          speaker: scarecrow
          text: >-
            Now you must go to the trees beside the river and build a cart
            strong enough to carry the Lion.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The Tin Woodman went straight to the trees and set to work. He cut
            several limbs from the trees, then chopped away every leaf and
            branch. He built a cart from the bare wood and fastened it together
            with wooden pegs. For its four wheels, he cut short, round pieces
            from the trunk of a large tree. He worked so quickly and so well
            that the cart was ready by the time the mice began to arrive.
        - id: ch01-b37
          speaker: narrator
          text: >-
            They poured in from every direction by the thousands. There were
            big mice, small mice, and mice of every size between. Each carried
            a piece of string in its mouth.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Around then, Dorothy woke from her long sleep and opened her eyes.
            She was astonished to find herself on the grass with thousands of
            timid mice standing around her. The Scarecrow told her everything
            that had happened. Then he turned to the dignified little mouse.
        - id: ch01-b39
          speaker: scarecrow
          text: Dorothy, may I present Her Majesty, the Queen.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Dorothy gave the Queen a solemn nod. The Queen curtsied, and before
            long she and the girl were quite friendly.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The Scarecrow and the Woodman began harnessing the mice to the
            cart. They tied one end of each string around a mouse's neck and
            the other end to the cart. The cart was a thousand times larger
            than any one of those tiny animals. But once all the mice were
            harnessed together, their combined strength pulled it easily. The
            Scarecrow and the Tin Woodman even climbed aboard. Their strange
            little team drew them swiftly over the grass to the place where the
            Lion lay asleep.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The Lion was terribly heavy. It took a great deal of hard work to
            lift his great body off the ground and onto the cart. At last, they
            managed it. As soon as he was aboard, the Queen hurried her people
            along. She knew the poppies were dangerous, and she was afraid that
            if the mice stayed among them much longer, they would fall asleep
            too.
        - id: ch01-b43
          speaker: mouse_queen
          text: Start now! Quickly!
          emotion: fearful
        - id: ch01-b44
          speaker: narrator
          text: >-
            At first, even thousands of little mice could barely move the cart
            under the Lion's weight. The wheels hardly turned. Then the Woodman
            and the Scarecrow leaned against the back and pushed, and the cart
            began to roll more easily. Soon they carried the Lion all the way
            out of the poppy bed and into the green fields. There he could once
            again breathe sweet, fresh air instead of the poisonous scent of
            the flowers.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Dorothy came to meet them. She thanked the little mice warmly for
            saving her companion from death. She had become very fond of the
            great Lion and was overjoyed that he had been rescued.
        - id: ch01-b46
          speaker: dorothy
          text: Thank you, all of you, for bringing our dear friend to safety.
          emotion: happy
        - id: ch01-b47
          speaker: narrator
          text: >-
            They unharnessed the mice, and the little creatures scampered home
            through the grass. Their Queen was the last to go.
        - id: ch01-b48
          speaker: mouse_queen
          text: >-
            If you ever need us, come into the field and call. We will hear you
            and come help. Good-bye!
        - id: ch01-b49
          speakers: [dorothy, scarecrow, tin_woodman]
          ensemble: chorus
          text: Good-bye!
        - id: ch01-b50
          speaker: narrator
          text: >-
            The Queen ran away while Dorothy held Toto tightly so he could not
            chase her and frighten her.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Then the friends sat beside the Lion and waited for him to wake.
            The Scarecrow brought Dorothy fruit from a nearby tree, and she ate
            it for her dinner.
