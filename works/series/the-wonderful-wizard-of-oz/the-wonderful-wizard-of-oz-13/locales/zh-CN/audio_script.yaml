audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    gate_guardian:
      display_name: 守门人
      tts:
        delivery: 谨慎守礼，言及奥兹时庄严认真
        timbre: 清晰利落
        pace: 平稳
        pitch: 中高音
    wicked_witch:
      display_name: 西方恶女巫
      tts:
        delivery: 冷酷专横，愤怒时尖厉急促
        timbre: 干涩尖锐
        pace: 偏慢，发怒时加快
        pitch: 中高音
    wolf_king:
      display_name: 狼王
      tts:
        delivery: 凶悍服从，问话时带着迟疑
        timbre: 粗哑低沉
        pace: 简短有力
        pitch: 低音
    crow_king:
      display_name: 乌鸦王
      tts:
        delivery: 狂妄轻蔑，语气锐利
        timbre: 沙哑刺耳
        pace: 急促
        pitch: 中高音
    winged_monkey_leader:
      display_name: 飞猴首领
      tts:
        delivery: 威严守约，说话果断清楚
        timbre: 粗粝洪亮
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 向西而行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿胡子士兵领着多萝茜一行穿过翡翠城的大街，一直把他们送到守门人住的屋子。守门人逐一打开绿眼镜上的锁，将眼镜收回那只大箱子，这才客客气气地替朋友们打开城门，让他们离开。
        - id: ch01-b02
          speaker: dorothy
          text: 请问，哪条路能走到西方恶女巫那里？
        - id: ch01-b03
          speaker: gate_guardian
          text: 那里根本不通路，因为从来没有人愿意去找她。
        - id: ch01-b04
          speaker: dorothy
          text: 可是没有路，我们要怎样才能找到她呢？
        - id: ch01-b05
          speaker: gate_guardian
          text: 找到她并不难。只要她知道你们踏进了温基人的国土，就会亲自来抓你们，把你们变成奴隶。
        - id: ch01-b06
          speaker: scarecrow
          text: 恐怕不会如她所愿。我们这次去，就是要消灭她。
        - id: ch01-b07
          speaker: gate_guardian
          text: 原来如此。以前从来没人能消灭她，我才会以为你们也要落到她手里。不过，你们一定得当心。那个女巫又凶狠又邪恶，不会乖乖等着你们动手。朝着太阳落下的方向一直走，你们准能找到她。
        - id: ch01-b08
          speaker: narrator
          text: 伙伴们向守门人道谢告别，转身向西，走进一片柔软的草地。雏菊和毛茛花星星点点地散落在青草间。多萝茜身上还穿着宫殿里换上的漂亮丝裙，可她惊讶地发现，走出翡翠城以后，裙子不再碧绿，竟变成了纯白色。托托颈上的丝带也褪去了绿意，白得和她的裙子一样。
        - id: ch01-b09
          speaker: narrator
          text: 翡翠城很快被远远留在身后。越往西走，地面越荒凉崎岖，山丘也越来越多。这里看不见农场，找不到一座房屋，脚下全是从未开垦的土地。下午的太阳火辣辣地迎面晒来，四周没有一棵树可以遮阴。还没等到天黑，多萝茜、托托和狮子就累得躺倒在草地上，很快睡熟了。铁皮樵夫和稻草人不用睡觉，便守在他们身旁。
        - id: ch01-b10
          speaker: narrator
          text: 西方恶女巫只有一只眼睛，那只眼睛却像望远镜一样厉害，无论多远的地方都看得见。她正坐在城堡门口，随意朝四周一望，忽然发现远处躺着熟睡的多萝茜，伙伴们全在她身旁。那些人虽然还离得很远，可一想到陌生人竟敢闯入自己的国土，女巫就气极了。她举起挂在颈上的银哨，用力吹了一声。
    - id: ch02
      title: 女巫的三次袭击
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一群大狼从四面八方奔来。它们长着长腿、尖牙和一双双凶狠的眼睛。
        - id: ch02-b02
          speaker: wicked_witch
          text: 去追上那些人，把他们全都撕碎！
          emotion: angry
        - id: ch02-b03
          speaker: wolf_king
          text: 您不留下他们做奴隶吗？
        - id: ch02-b04
          speaker: wicked_witch
          text: 不必。一个是铁皮，一个是稻草，剩下的只是小姑娘和狮子，没有谁适合干活。把他们撕成碎片就行了。
        - id: ch02-b05
          speaker: wolf_king
          text: 好，我们这就去。
        - id: ch02-b06
          speaker: narrator
          text: 狼王带着群狼飞奔而去。幸好稻草人和铁皮樵夫一直醒着，远远便听见了奔跑声。
        - id: ch02-b07
          speaker: tin_woodman
          text: 这回让我来。你躲在我身后，它们来一只，我就挡下一只。
        - id: ch02-b08
          speaker: narrator
          text: 铁皮樵夫抓起那把早已磨得雪亮的斧头。狼王刚扑到眼前，他便挥动手臂，一斧砍下了它的头，狼王当场死去。他刚把斧头重新举起，第二只狼紧接着冲来，也倒在锋利的斧刃下。总共有四十只狼。铁皮樵夫一次次举斧，又一次次砍下，四十只狼就这样全被杀死。最后，它们的尸体在他面前堆成了一座小山。
        - id: ch02-b09
          speaker: scarecrow
          text: 朋友，你这一仗打得真好。
        - id: ch02-b10
          speaker: narrator
          text: 铁皮樵夫放下斧头，和稻草人坐在一起，等到第二天早晨多萝茜醒来。小姑娘一睁眼就看见那堆毛茸茸的死狼，着实吓了一大跳。铁皮樵夫把昨夜发生的事原原本本讲给她听。多萝茜感谢他救了大家，这才坐下来吃早饭。吃完以后，伙伴们又继续赶路。
        - id: ch02-b11
          speaker: narrator
          text: 恶女巫也在这时走到城堡门口。她看见群狼死尽，陌生人却仍在前进，怒火烧得更旺了。她拿起银哨，接连吹了两声。一大群乌鸦飞来，黑压压地遮住天空。
        - id: ch02-b12
          speaker: wicked_witch
          text: 立刻追上他们。啄瞎他们的眼睛，再把他们撕碎！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 乌鸦群朝多萝茜和伙伴们压了过去。小姑娘害怕起来，稻草人却已经有了主意。
        - id: ch02-b14
          speaker: scarecrow
          text: 这一回归我。你们全躺到我身边，乌鸦就伤不到你们。
        - id: ch02-b15
          speaker: narrator
          text: 大家伏在地上，只有稻草人站着，张开两条手臂。鸟儿天生害怕稻草人，乌鸦们一见他就不敢靠近。乌鸦王却从鸟群里冲了出来。
        - id: ch02-b16
          speaker: crow_king
          text: 那不过是个塞了稻草的假人，我这就啄掉他的眼睛！
        - id: ch02-b17
          speaker: narrator
          text: 乌鸦王直扑稻草人的眼睛，稻草人一把抓住它的脑袋，扭断了它的脖子。又一只乌鸦壮着胆子冲过来，也落得同样下场。四十只乌鸦一只接一只地飞来，稻草人便一次又一次伸手抓住它们，接连扭了四十次。最后，所有乌鸦都死了，横七竖八地倒在他脚边。稻草人这才招呼伙伴们站起来，大家重新踏上旅程。
        - id: ch02-b18
          speaker: narrator
          text: 女巫望见乌鸦的尸体堆在一起，气得发狂，又把银哨吹了三声。空中响起巨大的嗡嗡声，一群黑蜂迅速飞到她面前。
        - id: ch02-b19
          speaker: wicked_witch
          text: 快去，把那些陌生人统统蜇死！
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: 黑蜂转身追去。铁皮樵夫看见蜂群逼近时，稻草人已经想好对策。
        - id: ch02-b21
          speaker: scarecrow
          text: 快把我的稻草掏出来，盖住多萝茜、托托和狮子。稻草铺严了，蜜蜂就蜇不到他们。
        - id: ch02-b22
          speaker: narrator
          text: 铁皮樵夫赶紧把稻草一把把掏出来。多萝茜抱紧托托，贴着狮子躺下，他再用稻草把他们从头到脚遮得严严实实。黑蜂赶到以后，找不到多萝茜、托托和狮子，只有铁皮樵夫还站在外面。它们一齐扑向他，使劲把蜂刺扎向他的身体。可蜂刺一碰上坚硬的铁皮便纷纷折断，他一点也没受伤。蜜蜂失去刺以后却活不成，全都死在他身旁，密密麻麻地散落着，像一小堆一小堆细碎的煤末。
        - id: ch02-b23
          speaker: narrator
          text: 危险过去，多萝茜和狮子从稻草下面站起来。小姑娘和铁皮樵夫一起动手，把散落的稻草重新塞进稻草人的衣服和脑袋，仔细将他恢复成原来的样子。确认稻草人又完好无损以后，伙伴们才再次启程。
    - id: ch03
      title: 金帽召来飞猴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 恶女巫看见黑蜂变成满地煤末，气得跺脚、扯头发、咬牙齿。她叫来十二名温基人奴隶，给每人一支锋利的长矛，逼他们去消灭陌生人。温基人虽然害怕，也只能服从。可他们刚走近多萝茜，狮子便怒吼着扑来。可怜的温基人吓破了胆，拼命逃回城堡。
        - id: ch03-b02
          speaker: narrator
          text: 温基人逃回城堡，女巫气得用皮带狠狠抽打他们一顿，又把他们赶回去干活。随后，她独自坐下来苦苦思索。狼群失败了，乌鸦和黑蜂也失败了，就连拿着长矛的奴隶也被吓跑。她怎么也不明白，自己用来消灭陌生人的计策为何接连落空。不过，她不但邪恶，法力也十分强大，很快就拿定了最后一个主意。
        - id: ch03-b03
          speaker: narrator
          text: 她的橱柜里藏着一顶金帽，帽子四周镶着一整圈钻石和红宝石。金帽带着一道奇异的魔咒。无论谁拥有它，都可以召唤飞猴三次，吩咐它们去做任何事情，可同一个人绝不能召唤第四次。女巫已经用掉两次机会。第一次，她要温基人做自己的奴隶，并占据他们的国土称王，飞猴帮她办到了。第二次，她与伟大的奥兹交战。又是飞猴出手，把奥兹赶出了西方。
        - id: ch03-b04
          speaker: narrator
          text: 正因只剩一次机会，女巫始终舍不得动用金帽。如今凶狼、乌鸦和黑蜂都死了，奴隶也被胆小的狮子吓跑。除了飞猴，她再没有办法对付多萝茜一行。
        - id: ch03-b05
          speaker: narrator
          text: 女巫拿出金帽戴好，先用左脚单脚站立，慢慢念道：“埃佩，佩佩，卡克！”接着换成右脚，念出：“希洛，霍洛，赫洛！”最后，她双脚站稳，放声喊道：“齐兹，祖兹，齐克！”
        - id: ch03-b06
          speaker: narrator
          text: 魔咒立刻显灵。天空忽然暗了，低沉的隆隆声从空中滚过。无数翅膀拍打着呼啸而来，夹着一大片叽叽喳喳的吵闹和笑声。过了一会儿，阳光重新从黑暗的天空中露出来。恶女巫已经被飞猴团团围住，每只猴子的肩上，都生着一对巨大而有力的翅膀。其中有一只比别的猴子大得多，显然就是首领。它飞到女巫身边，等候最后一次命令。
        - id: ch03-b07
          speaker: winged_monkey_leader
          text: 你第三次召唤了我们，这也是最后一次。说吧，你要我们做什么？
        - id: ch03-b08
          speaker: wicked_witch
          text: 去消灭闯入我领地的陌生人，只留下那头狮子。把它带回来，我要像套马那样套住它，让它替我干活。
        - id: ch03-b09
          speaker: winged_monkey_leader
          text: 你的命令一定会得到执行。
        - id: ch03-b10
          speaker: narrator
          text: 飞猴们喧闹着冲上天空，直奔多萝茜和伙伴们。几只抓住铁皮樵夫，把他带到一片铺满尖石的荒地上空，再从高处扔下。他重重摔在岩石间，浑身撞得凹凸不平，既不能动，也发不出呻吟。
        - id: ch03-b11
          speaker: narrator
          text: 另一些飞猴抓住稻草人，用长手指掏空他衣服和脑袋里的稻草。随后，它们把帽子、靴子和衣服卷成小包，抛到一棵高树的顶端。
        - id: ch03-b12
          speaker: narrator
          text: 剩下的飞猴用粗绳一圈圈缠住狮子的身体、脑袋和四条腿。他不能咬，不能抓，也无法挣扎。飞猴把他抬进女巫的城堡，关在一座围着高铁栏的小院里。
        - id: ch03-b13
          speaker: narrator
          text: 多萝茜抱着托托，眼睁睁看伙伴们遭难，心想很快就会轮到自己。飞猴首领伸出毛茸茸的长臂，露出丑陋凶狠的笑脸，朝她扑来。可它一看见小姑娘额头上的吻痕，就猛地停住，挥手叫其他飞猴也别碰她。
        - id: ch03-b14
          speaker: winged_monkey_leader
          text: 我们不敢伤害她。善的力量保护着这个小姑娘，而善比恶更强大。我们只能把她送进恶女巫的城堡。
        - id: ch03-b15
          speaker: narrator
          text: 飞猴们小心翼翼地托起多萝茜，动作十分轻柔。它们带着小姑娘飞快穿过天空，一直来到恶女巫的城堡，再把她稳稳放在正门前的台阶上。飞猴首领飞到女巫面前，向她交代这次差事的结果。
        - id: ch03-b16
          speaker: winged_monkey_leader
          text: 我们已经尽力完成命令。铁皮樵夫和稻草人被毁掉了，狮子捆在你的院子里。这个小姑娘和她怀里的狗受着保护，我们不能伤害。你支配我们这一族的次数已经用完，从今以后，再也见不到我们了。
        - id: ch03-b17
          speaker: narrator
          text: 飞猴们又笑又叫，闹哄哄地飞走了，转眼便消失在天边。
    - id: ch04
      title: 城堡里的囚徒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 女巫认出了多萝茜额头上的印记，既吃惊又担忧。她清楚得很，不仅飞猴不敢伤害小姑娘，就连她自己也不敢动手。接着，她低头看见了那双银鞋，顿时怕得浑身发抖，因为她深知鞋里藏着多么强大的魔力。起初，她真想转身逃走。可她无意中望进多萝茜的眼睛，从那双单纯的眼睛里看出，小姑娘根本不知道银鞋给了自己怎样的力量，更不知道该怎样使用。
        - id: ch04-b02
          speaker: narrator
          text: 女巫暗暗笑了。既然多萝茜不懂自己的力量，她仍能逼小姑娘做奴隶。
        - id: ch04-b03
          speaker: wicked_witch
          text: 跟我走。我叫你做什么，你就得照做。要是不听话，我会像毁掉铁皮樵夫和稻草人那样毁掉你。
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 多萝茜只能跟着女巫往前走。她们穿过城堡里一间又一间华美的屋子，最后来到厨房。女巫命令她刷洗每一口锅和每一把水壶，清扫地板，还得不停搬来木柴，保证炉火不灭。小姑娘没有反抗，顺从地忙碌起来。她已经打定主意，要尽自己最大的力气工作。毕竟女巫没有杀她，想到这里，她甚至觉得有些庆幸。
        - id: ch04-b05
          speaker: narrator
          text: 女巫又去院里套狮子。她打算让狮子像马一样拉车，供自己出门取乐。可院门刚开，狮子便大吼着猛扑过去。女巫吓得转身逃走，急忙把门关紧。
        - id: ch04-b06
          speaker: wicked_witch
          text: 我套不住你，就把你活活饿服。只要你不肯听命令，我就什么也不给你吃。
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 从此，女巫不再给狮子送食物。她每天中午仍会站在院门外，问同一个问题。
        - id: ch04-b08
          speaker: wicked_witch
          text: 现在肯像马一样套上挽具了吗？
        - id: ch04-b09
          speaker: cowardly_lion
          text: 不肯。你只要踏进院子，我就咬你。
        - id: ch04-b10
          speaker: narrator
          text: 狮子始终没有屈服，也一直没有挨饿。每天夜里，等女巫睡着以后，多萝茜就悄悄从橱柜里取出食物，送到院子里给他吃。狮子吃饱以后，会躺回自己的稻草床。多萝茜依偎在他身旁，把头枕在那片柔软蓬松的鬃毛上。两个朋友谈着各自的困境，想了一个又一个逃跑办法，可他们始终找不到离开城堡的路。黄色的温基人日夜守在各处。他们是恶女巫的奴隶，因为太怕她，无论她吩咐什么，都不敢违抗。
        - id: ch04-b11
          speaker: narrator
          text: 多萝茜白天辛苦干活，女巫常用那把从不离手的旧雨伞威胁她。其实，额头上的印记保护着小姑娘，女巫根本不敢打她。多萝茜并不知道，每天都为自己和托托害怕。有一回，女巫用伞打了托托，勇敢的小狗立刻扑上去咬她的腿。伤口却没流出一滴血。女巫太邪恶，血早在许多年前就干了。
        - id: ch04-b12
          speaker: narrator
          text: 多萝茜越来越明白，自己要回到堪萨斯和爱姆婶婶身边，比从前更难了。她的日子变得十分悲惨，常常伤心地哭上几个钟头。托托就坐在她脚边，仰着头望进她的脸，发出凄凉的呜咽，仿佛要告诉小主人，它也一样难过。其实，只要多萝茜陪在身旁，托托从不在乎这里是堪萨斯还是奥兹国。可是它知道小姑娘不快乐，于是自己也再快乐不起来。
    - id: ch05
      title: 一桶水
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 恶女巫一直渴望把多萝茜的银鞋据为己有。她的狼、乌鸦和黑蜂都已经死去，尸体堆在那里渐渐干枯，金帽的三次魔力也全用完了。可要是能拿到那双银鞋，她获得的力量将胜过已经失去的一切。于是，女巫时刻盯着小姑娘的脚，想看看她会不会脱下鞋，好趁机偷偷拿走。
        - id: ch05-b02
          speaker: narrator
          text: 多萝茜很爱惜银鞋，只有睡觉和洗澡时才会脱下来。女巫怕黑，不敢夜里进她的房间。她更怕水，所以多萝茜洗澡时，她连靠近都不敢。这个老女巫一辈子从没碰过水，也绝不让水沾到身上。
        - id: ch05-b03
          speaker: narrator
          text: 狡猾的女巫终于想到一个诡计。她把一根铁条横放在厨房地板中央，再施展魔法，让人的眼睛完全看不见它。多萝茜从厨房走过，自然没发现脚下的铁条。她一下被绊住，整个人重重摔倒在地。好在她没有受什么伤，可摔倒时，一只银鞋从脚上掉了下来。小姑娘还没来得及伸手去捡，女巫已经抢先扑过去，一把夺走银鞋，套在自己干瘦的脚上。
        - id: ch05-b04
          speaker: narrator
          text: 诡计得逞，女巫得意极了。只要占有一只银鞋，她就握住了鞋里一半的魔力。即使多萝茜懂得使用，也不能再用这股力量对付她。
        - id: ch05-b05
          speaker: dorothy
          text: 把我的鞋还给我！
          emotion: angry
        - id: ch05-b06
          speaker: wicked_witch
          text: 不还。它已经归我，不再是你的了。
        - id: ch05-b07
          speaker: dorothy
          text: 你真坏！你没有权利抢走我的鞋！
          emotion: angry
        - id: ch05-b08
          speaker: wicked_witch
          text: 我就是要留下它。等着吧，早晚有一天，另一只鞋也会归我。
        - id: ch05-b09
          speaker: narrator
          text: 多萝茜气得再也忍不住了。她提起身旁的一桶水，猛地泼向女巫，把她从头到脚浇透。
        - id: ch05-b10
          speaker: narrator
          text: 女巫立刻发出惊恐的尖叫。多萝茜诧异地望着她，只见她的身体越来越小，渐渐塌了下去。
        - id: ch05-b11
          speaker: wicked_witch
          text: 看看你做了什么！再过一分钟，我就要融化了！
          emotion: fearful
        - id: ch05-b12
          speaker: dorothy
          text: 我真的很抱歉。
          emotion: fearful
        - id: ch05-b13
          speaker: narrator
          text: 女巫就在她眼前融化，像一块遇水的黄糖。多萝茜看得害怕极了。
        - id: ch05-b14
          speaker: wicked_witch
          text: 难道你不知道吗？水一碰到我，我就完了！
          emotion: fearful
        - id: ch05-b15
          speaker: dorothy
          text: 我当然不知道。我怎么可能知道呢？
        - id: ch05-b16
          speaker: wicked_witch
          text: 再过几分钟，我就会全部融掉，这座城堡也归你了。我这一生做过那么多坏事，可我从没想过，最后会被你这样的小姑娘融化，我的恶行也会断送在你手里。快让开，我要倒了！
          emotion: fearful
        - id: ch05-b17
          speaker: narrator
          text: 女巫话音刚落就倒了下去，化成一摊棕色、融化得不成形的东西，在干净的厨房地板上慢慢铺开。多萝茜站在旁边看着，直到确定她真的融化了，什么也没有剩下。接着，小姑娘又提来一桶水，倒在那摊黏糊糊的东西上，把它彻底冲散，再拿起扫帚，将残留的一切全都扫出门外。
        - id: ch05-b18
          speaker: narrator
          text: 老女巫留下的唯一一件东西，就是她刚抢走的那只银鞋。多萝茜从污水里把它捡出来，用布仔细擦洗干净，等它干了以后重新穿回脚上。如今，她终于自由了，可以随自己的心意行动。小姑娘立刻跑向院子，要把消息告诉狮子。西方恶女巫已经灭亡，他们再也不是这片陌生国土上的囚徒了。
