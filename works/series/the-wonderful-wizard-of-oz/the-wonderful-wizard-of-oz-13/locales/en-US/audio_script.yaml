  chapters:
    - id: ch01
      title: Chapter XII The Search for the Wicked Witch
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Soldier with the Green Whiskers led Dorothy and her friends
            through the Emerald City to the Guardian of the Gates. The
            Guardian unlocked their spectacles, returned them to his great
            box, and politely opened the gate.
        - id: ch01-b02
          speaker: dorothy
          text: Which way should we go to reach the Wicked Witch of the West?
        - id: ch01-b03
          speaker: guardian
          text: >-
            There isn't any road. No one wants to travel toward her country.
        - id: ch01-b04
          speaker: dorothy
          text: Then how are we supposed to find her?
        - id: ch01-b05
          speaker: guardian
          text: >-
            Finding her will be easy. Once she knows you're in the Winkies'
            country, she'll come looking for you and turn every one of you
            into her slave.
        - id: ch01-b06
          speaker: scarecrow
          text: She may not get the chance. We're going there to destroy her.
        - id: ch01-b07
          speaker: guardian
          text: >-
            Oh! Well, that's quite different. No one has ever destroyed her,
            so of course I thought she'd enslave you as she did everyone else.
            Be careful, though. She's fierce as well as wicked, and she may
            stop you before you can carry out your plan. Keep heading west,
            toward the sunset. You'll find her that way.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They thanked him, said good-bye, and set off toward the west. Soft
            grass spread beneath their feet, sprinkled with daisies and
            buttercups. Dorothy still had on the lovely silk dress from the
            palace. To her surprise, it was no longer green. It was pure white.
            Toto's ribbon had changed too, and now it was as white as her
            dress.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Soon the Emerald City was far behind them. The land grew rough and
            hilly. There were no farms or houses in the western country, and
            no one had worked the soil.
        - id: ch01-b10
          speaker: narrator
          text: >-
            That afternoon, the sun beat hot against their faces. Not a single
            tree stood nearby to give them shade. By nightfall, Dorothy, Toto,
            and the Lion were exhausted. They lay on the grass and fell asleep
            while the Scarecrow and the Tin Woodman kept watch.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The Wicked Witch of the West had only one eye, but it worked like
            a powerful telescope and could see everywhere. As she sat in her
            castle doorway, she looked across her country and spotted Dorothy
            asleep among her companions. They were still far away, but the
            sight of strangers in her land made her furious. She blew the
            silver whistle hanging from her neck.
        - id: ch01-b12
          speaker: narrator
          text: >-
            A pack of huge wolves came racing toward her from every direction.
            They had long legs, savage eyes, and sharp teeth.
        - id: ch01-b13
          speaker: wicked_witch
          text: Go after those travelers and tear them to pieces!
          emotion: angry
        - id: ch01-b14
          speaker: wolf_leader
          text: Aren't you going to keep them as your slaves?
        - id: ch01-b15
          speaker: wicked_witch
          text: >-
            No. One is made of tin and another is stuffed with straw. There's
            also a girl and a Lion. Not one of them is any use as a worker.
            Tear them into little pieces instead.
        - id: ch01-b16
          speaker: wolf_leader
          text: As you command.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The leader bounded away at full speed, and the whole pack raced
            after him. Luckily, the Scarecrow and the Tin Woodman were wide
            awake. They heard the wolves coming.
        - id: ch01-b18
          speaker: tin_woodman
          text: >-
            This fight belongs to me. Everyone get behind me. I'll face them
            one at a time as they come.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He gripped the axe he had sharpened so carefully. When the leader
            rushed at him, the Tin Woodman swung and cut off the wolf's head,
            killing it at once. Before he had more than enough time to lift
            the axe, another wolf was upon him. That one fell beneath the
            sharp edge too. The wolves kept charging, one behind another, and
            the Woodman met every attack in the same way. There were forty
            wolves in all. Forty times the Woodman struck, until the entire
            pack lay dead in a heap before him.
        - id: ch01-b20
          speaker: narrator
          text: The Tin Woodman lowered his axe and sat beside the Scarecrow.
        - id: ch01-b21
          speaker: scarecrow
          text: You fought well, my friend.
        - id: ch01-b22
          speaker: narrator
          text: >-
            They waited there until Dorothy woke the next morning. The sight
            of that great pile of shaggy wolves frightened her, but the Tin
            Woodman explained everything. She thanked him for saving them,
            ate her breakfast, and then the travelers started west again.
        - id: ch01-b23
          speaker: narrator
          text: >-
            That same morning, the Wicked Witch stood in her castle doorway
            and looked out through her far-seeing eye. Her wolves were dead,
            and the strangers were still crossing her country. Angrier than
            ever, she blew her silver whistle twice.
        - id: ch01-b24
          speaker: narrator
          text: >-
            A vast flock of wild crows swept toward the castle. There were so
            many that they darkened the sky.
        - id: ch01-b25
          speaker: wicked_witch
          text: >-
            King Crow, lead your flock to those strangers. Peck out their
            eyes, and rip them to pieces!
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: >-
            The crows flew as one great black flock toward Dorothy and her
            companions. Dorothy was afraid when she saw them coming.
        - id: ch01-b27
          speaker: scarecrow
          text: >-
            I'll handle this battle. Lie down close beside me, and they won't
            hurt you.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Everyone lay flat on the ground except the Scarecrow. He stood
            with both arms stretched wide. The crows were frightened when
            they saw him. Like all birds faced with a scarecrow, they would
            not come any closer.
        - id: ch01-b29
          speaker: king_crow
          text: He's nothing but a stuffed man. I'll tear out his eyes myself!
        - id: ch01-b30
          speaker: narrator
          text: >-
            The King Crow flew straight at him. The Scarecrow caught the bird
            by the head and twisted its neck until it died. With their king
            gone, another crow dared to fly at him. The Scarecrow caught that
            one and twisted its neck as well. One after another, the whole
            flock attacked him. There were forty crows, and he stopped all
            forty in the same way. At last, every bird lay dead beside him.
            He called for his friends to rise from the ground, and once more
            they went on their way.
        - id: ch01-b31
          speaker: narrator
          text: >-
            When the Witch looked out again and saw her crows piled together,
            she flew into a terrible rage. This time she blew the whistle
            three times.
        - id: ch01-b32
          speaker: narrator
          text: >-
            A tremendous buzzing filled the air. A swarm of black bees came
            flying toward her.
        - id: ch01-b33
          speaker: wicked_witch
          text: Find those strangers and sting them to death!
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: >-
            The bees turned and sped toward the travelers. The Tin Woodman
            spotted them, and the Scarecrow quickly formed a plan.
        - id: ch01-b35
          speaker: scarecrow
          text: >-
            Pull out my straw and spread it over Dorothy, Toto, and the Lion.
            If they're completely covered, the bees can't sting them.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The Woodman did as he asked. Dorothy curled up beside the Lion
            with Toto in her arms, and the straw hid all three of them.
        - id: ch01-b37
          speaker: narrator
          text: >-
            When the bees arrived, the only target they could find was the Tin
            Woodman. They flew at him from every side and tried to sting him.
            But every stinger broke against the tin without hurting him at
            all. Bees cannot survive after their stingers break away. Soon the
            whole black swarm lay scattered thickly around the Woodman, like
            little heaps of fine coal.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Dorothy and the Lion climbed out. Dorothy helped the Woodman pack
            every bit of straw back into the Scarecrow until he was as good as
            ever. Then the friends resumed their journey.
        - id: ch01-b39
          speaker: narrator
          text: >-
            When the Wicked Witch saw her black bees lying in heaps like fine
            coal, she stamped her foot, pulled at her hair, and ground her
            teeth with rage. She summoned twelve of her Winkie slaves, armed
            them with sharp spears, and ordered them to destroy the strangers.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The Winkies were not brave, but they had no choice except to obey.
            They marched out until they came close to Dorothy. Then the Lion
            gave a mighty roar and sprang toward them. The terrified Winkies
            turned and ran all the way back to the castle.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The Witch beat them soundly with a strap and sent them back to
            their work. Then she sat down alone to think about her next move.
            She could not understand how all her plans to destroy the
            strangers had failed. Still, she was a powerful Witch as well as
            a wicked one. She thought and thought, and before long she knew
            what to do next.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Inside her cupboard was a Golden Cap, circled with diamonds and
            rubies. A charm on the Cap allowed its owner to call the Winged
            Monkeys three times. Whenever they were called, they had to obey
            any order they were given. These were strange and powerful
            creatures, but even their obedience had a limit. No owner of the
            Cap could command them a fourth time.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The Witch had already used the charm twice. The first time, the
            Winged Monkeys helped her enslave the Winkies and seize their
            country so she could rule it herself. The second time, she used
            them in her fight against the Great Oz. The Monkeys drove Oz out
            of the western land for her. She had only one command left. That
            was why she had been unwilling to use it while any of her other
            powers remained.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Now her wolves, crows, and bees were dead, and the Lion had scared
            away her slaves. The Witch saw only one remaining way to destroy
            Dorothy and her friends. She took the Golden Cap from the cupboard
            and set it on her head. Balancing on her left foot, she slowly
            spoke the first words of the charm.
        - id: ch01-b45
          speaker: wicked_witch
          text: Ep-pe, pep-pe, kak-ke!
        - id: ch01-b46
          speaker: narrator
          text: Then she balanced on her right foot.
        - id: ch01-b47
          speaker: wicked_witch
          text: Hil-lo, hol-lo, hel-lo!
        - id: ch01-b48
          speaker: narrator
          text: At last she planted both feet and shouted.
        - id: ch01-b49
          speaker: wicked_witch
          text: Ziz-zy, zuz-zy, zik!
        - id: ch01-b50
          speaker: narrator
          text: >-
            The charm began to work. Darkness covered the sky, and a low
            rumble rolled through the air. Countless wings rushed overhead.
            Chattering and laughter sounded all around. Then the sun broke
            through, revealing a crowd of monkeys around the Witch. Each one
            had a pair of enormous, powerful wings on his shoulders.
        - id: ch01-b51
          speaker: narrator
          text: >-
            One monkey was much larger than the rest and appeared to be their
            leader. He flew close to the Witch.
        - id: ch01-b52
          speaker: winged_monkey_leader
          text: >-
            This is the third and final time you've called us. What is your
            command?
        - id: ch01-b53
          speaker: wicked_witch
          text: >-
            Go to the strangers in my country and destroy every one of them
            except the Lion. Bring him here. I want to harness him like a
            horse and force him to work for me.
        - id: ch01-b54
          speaker: winged_monkey_leader
          text: We will obey your command.
        - id: ch01-b55
          speaker: narrator
          text: >-
            With a storm of chattering and noise, the Winged Monkeys flew to
            the place where Dorothy and her friends were walking.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Some seized the Tin Woodman and carried him high above a region
            thickly covered with sharp rocks. Once they were directly over
            that cruel ground, they let him fall. He dropped a great distance
            before he struck the rocks below. The fall battered and dented
            him so badly that he could not move or even groan.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Other Monkeys grabbed the Scarecrow. Their long fingers pulled all
            the straw from his clothes and his head, leaving nothing behind
            but his empty covering. They gathered his hat, boots, and clothes
            into one small bundle. Then they carried it up and tossed it among
            the top branches of a tall tree.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The remaining Monkeys wrapped thick ropes around the Lion. Coil
            after coil bound his body, head, and legs until he could not bite,
            scratch, or struggle in any way. They lifted the helpless Lion
            into the air and carried him all the way to the Witch's castle.
            There they put him in a small yard enclosed by a high iron fence,
            tall enough to keep him from escaping.
        - id: ch01-b59
          speaker: narrator
          text: >-
            But the Monkeys did not hurt Dorothy. She held Toto and watched
            the terrible things happening to her friends, certain that her
            turn would come next. The leader swooped toward her with his long,
            hairy arms spread wide and an ugly grin on his face. Then he saw
            the Good Witch's kiss on Dorothy's forehead. He stopped at once
            and signaled for the others to leave her alone.
        - id: ch01-b60
          speaker: winged_monkey_leader
          text: >-
            We cannot harm this little girl. The Power of Good protects her,
            and that power is stronger than Evil. We can only carry her to the
            Wicked Witch's castle and leave her there.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The Monkeys lifted Dorothy carefully and gently. They carried her
            and Toto swiftly through the air to the castle and set them down
            on the front doorstep. Their leader spoke to the Witch.
        - id: ch01-b62
          speaker: winged_monkey_leader
          text: >-
            We obeyed as far as we could. The Tin Woodman and the Scarecrow
            have been destroyed, and the Lion is bound in your yard. We dare
            not hurt the girl or the dog in her arms. Your power over us has
            ended. You will never see our band again.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Laughing, chattering, and making a great noise, all the Winged
            Monkeys rose into the sky and soon vanished from sight.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The mark on Dorothy's forehead surprised and worried the Wicked
            Witch. She knew that neither she nor the Winged Monkeys dared hurt
            the girl. Then she noticed the Silver Shoes and began trembling,
            because she knew how powerful their charm was. For a moment, the
            Witch wanted to run away.
        - id: ch01-b65
          speaker: narrator
          text: >-
            But when she looked into Dorothy's eyes, she saw that the innocent
            child knew nothing about the power of the Shoes. The Witch laughed
            to herself. Dorothy had no idea what wonderful power she carried
            on her feet or how to call upon it. The Witch decided she could
            still make the girl her slave as long as that remained a secret.
        - id: ch01-b66
          speaker: wicked_witch
          text: >-
            Come with me, and obey every order I give you. If you don't, I'll
            finish you the way I finished the Tin Woodman and the Scarecrow.
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: >-
            Dorothy followed the Witch through many beautiful rooms until
            they reached the kitchen. There the Witch ordered her to scrub the
            pots and kettles, sweep the floor, and keep the fire supplied with
            wood.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Dorothy meekly began her chores and resolved to work as hard as
            she could. She was thankful that the Witch had chosen not to kill
            her.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Once Dorothy was busy, the Witch went to the courtyard to harness
            the Cowardly Lion like a horse. She thought it would be amusing to
            make him pull her chariot whenever she wanted a ride. But the
            moment she opened the gate, the Lion roared and leaped at her so
            fiercely that she fled and slammed the gate shut.
        - id: ch01-b70
          speaker: wicked_witch
          text: >-
            If I can't put a harness on you, then I'll starve you. You won't
            get a bite to eat until you give in!
          emotion: angry
        - id: ch01-b71
          speaker: narrator
          text: >-
            From then on, she brought the imprisoned Lion no food. Every day
            at noon, she came to his gate with the same question.
        - id: ch01-b72
          speaker: wicked_witch
          text: Are you ready to wear a harness and work like a horse?
        - id: ch01-b73
          speaker: cowardly_lion
          text: No! Step inside this yard, and I'll bite you.
        - id: ch01-b74
          speaker: narrator
          text: >-
            The Lion never had to surrender. Each night, after the Witch fell
            asleep, Dorothy brought him food from the cupboard. When he had
            eaten, he settled onto his straw bed. Dorothy lay beside him with
            her head against his soft, shaggy mane. Together they talked about
            all their troubles. Night after night, they tried to think of some
            way they might escape from the Witch.
        - id: ch01-b75
          speaker: narrator
          text: >-
            They could find no path out of the castle. Yellow Winkies guarded
            it at all times. The Winkies were the Witch's slaves, and they were
            far too frightened of her to disobey.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Dorothy worked hard all day. The Witch often threatened to beat
            her with the old umbrella she always carried. In truth, the mark
            on Dorothy's forehead made the Witch afraid to strike her. Dorothy
            did not know that the mark protected her. Each threat filled her
            with fear, both for herself and for Toto.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Once, the Witch hit Toto with the umbrella. The brave little dog
            sprang at her and bit her leg. No blood came from the bite. The
            Witch was so wicked that her blood had dried up years ago.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Dorothy's life grew terribly sad. Going home to Kansas and Aunt Em
            now seemed harder than ever, and she began to understand just how
            far away home might be. Sometimes she cried bitterly for hours as
            she thought about Aunt Em. Toto sat at her feet, watching her face
            and whining to show how sorry he was. He did not care whether he
            lived in Kansas or Oz as long as he was with Dorothy. But he knew
            the little girl was miserable, and her unhappiness made him
            unhappy too.
        - id: ch01-b79
          speaker: narrator
          text: >-
            More than anything, the Wicked Witch wanted Dorothy's Silver
            Shoes. Her wolves, crows, and bees lay dead, and the Golden Cap had
            no commands left. If she could take the Shoes, their power would
            be greater than all the other powers she had lost. She longed to
            claim that magic for herself.
        - id: ch01-b80
          speaker: narrator
          text: >-
            She watched closely for Dorothy to remove them, hoping for a
            chance to steal them. Dorothy loved the pretty Shoes and took them
            off only at night or when she bathed. The Witch was too afraid of
            the dark to enter her room at night. She feared water even more,
            so she stayed far away at bath time. In fact, she never touched
            water or allowed a drop to touch her.
        - id: ch01-b81
          speaker: narrator
          text: >-
            At last, the cunning Witch invented a trick. She laid an iron bar
            across the kitchen floor and used magic to make it invisible.
            Dorothy could not see it. When she crossed the room, she tripped
            over the bar and fell flat. She was hardly hurt, but one Silver
            Shoe slipped from her foot. Before Dorothy could grab it, the
            Witch snatched the Shoe and pulled it onto her own skinny foot.
        - id: ch01-b82
          speaker: narrator
          text: >-
            The Witch was delighted. Owning one Shoe gave her half the power
            of the charm. Even if Dorothy had known how to use the Shoes, she
            could no longer use that power against the Witch.
        - id: ch01-b83
          speaker: dorothy
          text: Give me my shoe back!
          emotion: angry
        - id: ch01-b84
          speaker: wicked_witch
          text: No. It belongs to me now, not you.
        - id: ch01-b85
          speaker: dorothy
          text: You're wicked! You had no right to steal my shoe!
          emotion: angry
        - id: ch01-b86
          speaker: wicked_witch
          text: >-
            I'm keeping it anyway. And one day, I'll take the other one too.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The Witch laughed at her. Dorothy became so angry that she picked
            up a nearby bucket of water and flung it over the Witch, soaking
            her from head to foot.
        - id: ch01-b88
          speaker: narrator
          text: >-
            The Witch screamed in terror. Before Dorothy's astonished eyes,
            the wicked woman began to shrink and collapse.
        - id: ch01-b89
          speaker: wicked_witch
          text: Look what you've done! In another minute, I'll melt away!
          emotion: fearful
        - id: ch01-b90
          speaker: dorothy
          text: I'm so sorry!
          emotion: fearful
        - id: ch01-b91
          speaker: narrator
          text: >-
            Dorothy truly was frightened. The Witch was melting like brown
            sugar right before her eyes.
        - id: ch01-b92
          speaker: wicked_witch
          text: Didn't you know that water would destroy me?
          emotion: sad
        - id: ch01-b93
          speaker: dorothy
          text: Of course I didn't. How could I have known?
        - id: ch01-b94
          speaker: wicked_witch
          text: >-
            In a few minutes, I'll be gone, and this whole castle will be
            yours. I've done many wicked things, but I never imagined a little
            girl would melt me and put an end to them. Watch out. Here I go!
          emotion: sad
        - id: ch01-b95
          speaker: narrator
          text: >-
            The Witch fell into a shapeless brown puddle that spread across
            the clean kitchen floor. When Dorothy saw that she had melted away
            completely, she fetched another bucket of water and washed the
            mess toward the door. Then she swept it outside.
        - id: ch01-b96
          speaker: narrator
          text: >-
            The Silver Shoe was all that remained of the old Witch. Dorothy
            picked it out, cleaned and dried it with a cloth, and put it back
            on her foot.
        - id: ch01-b97
          speaker: narrator
          text: >-
            At last, Dorothy was free to do as she pleased. She ran into the
            courtyard to tell the Lion that the Wicked Witch of the West was
            gone and that they were no longer prisoners in that strange land.
