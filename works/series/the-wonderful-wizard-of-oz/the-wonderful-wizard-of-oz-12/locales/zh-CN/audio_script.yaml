audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    gate_guardian:
      display_name: 城门守卫
      tts:
        delivery: 尽职爽直，通报时郑重清楚
        timbre: 明亮结实
        pace: 平稳
        pitch: 中音
    green_soldier:
      display_name: 绿胡子士兵
      tts:
        delivery: 礼貌守规矩，传令时干脆
        timbre: 稳重清晰
        pace: 中等
        pitch: 中低音
    green_maiden:
      display_name: 绿衣姑娘
      tts:
        delivery: 亲切周到，说话轻柔利落
        timbre: 清甜柔和
        pace: 轻快
        pitch: 中高音
    courtier:
      display_name: 宫廷侍从
      tts:
        delivery: 好奇谨慎，压低声音时略显敬畏
        timbre: 清润
        pace: 中等
        pitch: 中音
    oz:
      display_name: 奥兹
      tts:
        delivery: 神秘威严，随外形改变气势却始终不容置疑
        timbre: 深沉有穿透力
        pace: 缓慢有力
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章　奥兹的奇妙之城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 多萝茜和伙伴们虽然戴着绿眼镜，刚看见这座奇妙之城时，还是被眼前的光芒晃得睁不开眼。街道两旁的美丽房屋全用绿色大理石砌成，到处镶着闪亮的翡翠。他们走过的人行道也是同样的绿色大理石铺成的。每块石板相接的地方，都密密嵌着一排翡翠，在太阳底下闪闪发光。窗玻璃是绿色的，连城市上方的天空也泛着绿意，阳光照下来，都变成了一道道绿光。
        - id: ch01-b02
          speaker: narrator
          text: 街上到处是男人、女人和孩子。他们穿着绿衣裳，皮肤也微微发绿。人人看见多萝茜和这群搭配古怪的伙伴，都睁大眼睛，好奇地盯着他们。孩子们一见狮子，马上跑到母亲身后躲起来，却没有人上前说话。街边有许多店铺，多萝茜发现里面的样样东西都是绿色的。那里卖绿色糖果、绿色爆米花，还有绿色鞋子、绿色帽子和各种各样的绿色衣裳。一个男人在卖绿色柠檬水，孩子们买水喝时，多萝茜看见他们付的竟然也是绿色铜币。
        - id: ch01-b03
          speaker: narrator
          text: 城里似乎一匹马也没有，甚至看不见任何别的牲畜。男人们把东西装进绿色小车，推着车在城里来来往往。这里人人快活满足，看起来生活安稳，日子也都过得很富足。
        - id: ch01-b04
          speaker: narrator
          text: 城门守卫领着他们走过一条条街，来到城市正中央。那里有一座宏伟的宫殿，正是伟大魔法师奥兹的住处。门前站着一名士兵，穿绿色制服，还蓄着长长的绿胡子。
        - id: ch01-b05
          speaker: gate_guardian
          text: 这几位客人从外地来，要求拜见伟大的奥兹。
        - id: ch01-b06
          speaker: green_soldier
          text: 请进来吧，我去替各位通报。
        - id: ch01-b07
          speaker: narrator
          text: 他们穿过宫殿大门，被领进一间宽敞的大厅。地上铺着绿地毯，漂亮的绿色家具上镶满翡翠。进门以前，士兵先请每个人在一块绿色脚垫上把鞋擦干净。等大家都在大厅里坐下，他才客客气气地开口。
        - id: ch01-b08
          speaker: green_soldier
          text: 请各位安心休息。我到王座厅门口去告诉奥兹，你们已经到了。
        - id: ch01-b09
          speaker: narrator
          text: 他们等了很久，士兵才终于回来。多萝茜赶紧问他。
        - id: ch01-b10
          speaker: dorothy
          text: 你见到奥兹了吗？
        - id: ch01-b11
          speaker: green_soldier
          text: 没有，我从来没见过他。不过，他坐在屏风后面，我隔着屏风跟他说了话，也把各位的口信传给了他。他说，你们如果确实想见，他愿意召见。只是每次只能一个人进去，而且一天只见一位。各位得在宫里住上好几天，我会请人带你们到各自的房间去。一路走了这么久，你们也该舒舒服服地休息了。
        - id: ch01-b12
          speaker: dorothy
          text: 谢谢你。奥兹想得真周到。
        - id: ch01-b13
          speaker: narrator
          text: 士兵拿起一只绿色哨子吹响。一个年轻姑娘立刻走进大厅。她穿着一件漂亮的绿色丝裙，有一头秀丽的绿头发，一双眼睛也是绿色的。姑娘来到多萝茜面前，向她深深鞠了一躬。
        - id: ch01-b14
          speaker: green_maiden
          text: 请跟我走，我带你去房间。
        - id: ch01-b15
          speaker: narrator
          text: 多萝茜跟所有伙伴暂时道别，只把托托留在身边。她抱起小狗，跟绿衣姑娘穿过七条走廊，走上三段楼梯，来到宫殿前部的一间屋子。这恐怕是世上最可爱的小房间。床铺又软又舒服，上面有绿色丝绸床单和绿色天鹅绒床罩。屋子中央的小喷泉往空中喷出一蓬绿色香雾，又让它落进雕刻精美的绿色大理石水池。窗边摆着漂亮的绿色鲜花，架子上整齐放着一排绿色小书。后来多萝茜有空翻开它们，发现书里全是稀奇古怪的绿色图画，滑稽得让她直笑。
        - id: ch01-b16
          speaker: narrator
          text: 衣柜里还有许多绿裙子，有丝绸的，有缎子的，也有天鹅绒的。奇怪的是，每一件都正好合身。
        - id: ch01-b17
          speaker: green_maiden
          text: 把这里当成自己家吧。想要什么就摇铃。明天早晨，奥兹会叫你过去。
        - id: ch01-b18
          speaker: narrator
          text: 绿衣姑娘留下多萝茜，又回去把其他客人分别送进宫殿里舒适的房间。不过，这番殷勤对稻草人没有什么用。他独自进门以后，就呆呆站在门里，一动不动地等天亮。躺下不能让他休息，他也闭不上眼，只好盯着墙角一只正在结网的小蜘蛛，看了整整一夜，好像根本没有发现自己住在世上最奇妙的房间之一。
        - id: ch01-b19
          speaker: narrator
          text: 铁皮樵夫还记得自己从前有血有肉的日子，便照着老习惯躺到床上。可他根本睡不着，只能一整夜不停地上下活动各处关节，确保它们始终灵便好用。狮子更喜欢森林里铺满枯叶的床，也不愿被关在一间屋里。但他很明白，不值得为这种小事烦恼。他跳上床，像猫一样蜷起身子，呼噜呼噜地哄着自己，转眼就睡着了。
        - id: ch01-b20
          speaker: narrator
          text: 第二天吃过早饭，绿衣姑娘来接多萝茜。她从衣柜里挑出一件最漂亮的绿色织锦缎裙，替多萝茜穿好。多萝茜又系上一条绿色丝绸围裙，在托托脖子上扎了一根绿丝带，然后他们一起朝伟大奥兹的王座厅走去。
        - id: ch01-b21
          speaker: narrator
          text: 他们先走进一座大殿。许多衣着华贵的宫廷男女都等在那里。这些人每天无事可做，只能彼此聊天。奥兹从来不准他们进去拜见，他们却还是每天早晨来到王座厅外守候。多萝茜一走进来，大家便好奇地打量她。其中一个人压低声音，悄悄问了一句。
        - id: ch01-b22
          speaker: courtier
          text: 你真的要去看可怕的奥兹长什么样吗？
        - id: ch01-b23
          speaker: dorothy
          text: 当然，只要他肯见我。
        - id: ch01-b24
          speaker: green_soldier
          text: 他会见你的，不过他不喜欢有人求见。一开始他很生气，叫我把你们送回原来的地方。后来他问你长什么样。我说起你的银鞋，他马上有了兴趣。最后我又告诉他，你额头上有一个印记，他这才答应让你进去。
        - id: ch01-b25
          speaker: narrator
          text: 就在这时，铃声响了。
        - id: ch01-b26
          speaker: green_maiden
          text: 这是叫你的信号。你得一个人进去。
        - id: ch01-b27
          speaker: narrator
          text: 姑娘打开一扇小门。多萝茜勇敢地走过去，发现自己来到一个奇妙无比的地方。眼前是一座高大浑圆的厅堂，头顶的穹顶高高隆起。墙壁、地面和天花板全铺着一颗颗紧密相接的大翡翠。穹顶中央悬着一盏巨灯，亮得就像太阳，把满屋宝石照得异彩纷呈。
        - id: ch01-b28
          speaker: narrator
          text: 可最吸引多萝茜的，还是大厅中央那张绿色大理石王座。王座形如一把椅子，也像周围的一切那样闪着宝石的光。椅子正中放着一颗巨大无比的脑袋，下面没有身子，也完全没有胳膊和腿。它一根头发也没有，却长着眼睛、鼻子和嘴巴，比最高大的巨人那颗脑袋还要大得多。
        - id: ch01-b29
          speaker: narrator
          text: 多萝茜又害怕又惊奇地看着它。那双眼睛慢慢转过来，目光锐利地盯住她。接着，嘴巴动了。
        - id: ch01-b30
          speaker: oz
          text: 我是伟大而可怕的奥兹。你是谁？为什么来找我？
        - id: ch01-b31
          speaker: narrator
          text: 这声音并没有多萝茜想象中那么吓人。她鼓起了勇气。
        - id: ch01-b32
          speaker: dorothy
          text: 我是弱小温顺的多萝茜。我来请你帮助我。
        - id: ch01-b33
          speaker: narrator
          text: 那双眼睛若有所思地看了她足足一分钟。
        - id: ch01-b34
          speaker: oz
          text: 你的银鞋是从哪里来的？
        - id: ch01-b35
          speaker: dorothy
          text: 我的房子落下来，压死了东方恶女巫，我就得到了她的鞋。
        - id: ch01-b36
          speaker: oz
          text: 那你额头上的印记呢？
        - id: ch01-b37
          speaker: dorothy
          text: 北方好女巫向我道别，让我来找你时，在那里吻了我一下。
        - id: ch01-b38
          speaker: narrator
          text: 那双眼睛又紧紧盯住多萝茜，看出她没有撒谎。
        - id: ch01-b39
          speaker: oz
          text: 你想让我替你做什么？
        - id: ch01-b40
          speaker: dorothy
          text: 请把我送回堪萨斯，让我回到爱姆婶婶和亨利叔叔身边。你的国家虽然很美，我却不喜欢这里。我离开了这么久，爱姆婶婶一定担心得不得了。
        - id: ch01-b41
          speaker: narrator
          text: 那双眼睛眨了三下，先抬起来看看天花板，再低下去看看地面，然后古怪地四处转动，仿佛大厅里的每一个角落都被它们看遍了。最后，它们又重新望向多萝茜。
        - id: ch01-b42
          speaker: oz
          text: 我为什么要帮你？
        - id: ch01-b43
          speaker: dorothy
          text: 因为你很强大，我很弱小。你是伟大的魔法师，我只是一个小姑娘。
        - id: ch01-b44
          speaker: oz
          text: 可你有本事杀死东方恶女巫。
        - id: ch01-b45
          speaker: dorothy
          text: 那只是碰巧发生的。我也没有办法。
        - id: ch01-b46
          speaker: oz
          text: 那我就告诉你答案。你要我送你回堪萨斯，自己也得替我做一件事。在这个国家，想得到什么都要付出代价。先替我办事，我才会施展魔法送你回家。你帮我，我就帮你。
        - id: ch01-b47
          speaker: dorothy
          text: 那我要做什么？
        - id: ch01-b48
          speaker: oz
          text: 杀死西方恶女巫。
        - id: ch01-b49
          speaker: dorothy
          text: 可是我做不到！
          emotion: surprised
        - id: ch01-b50
          speaker: oz
          text: 你已经杀死了东方女巫，又穿着拥有强大魔力的银鞋。如今这里只剩下一个恶女巫。等你告诉我她死了，我才会送你回堪萨斯。在那以前，绝不可能。
        - id: ch01-b51
          speaker: narrator
          text: 小姑娘实在太失望，忍不住哭了起来。那双眼睛又眨了眨，不安地看着她，仿佛伟大的奥兹认定，只要多萝茜肯答应，就一定能帮他办成这件事。
        - id: ch01-b52
          speaker: dorothy
          text: 我从来没有故意杀过任何东西。就算我真想杀，我又怎么打得过西方恶女巫？你这么伟大，这么可怕，自己都杀不了她，怎么会觉得我能做到？
          emotion: sad
        - id: ch01-b53
          speaker: oz
          text: 我不知道，但这就是我的答复。恶女巫不死，你就见不到叔叔婶婶。记住，她非常坏，坏到了极点，本来就该死。现在走吧。等你完成这件事，再来见我。
        - id: ch01-b54
          speaker: narrator
          text: 多萝茜伤心地走出王座厅，回到伙伴们身边。狮子、稻草人和铁皮樵夫一直守在那里，全都急着想知道奥兹对她说了什么。
        - id: ch01-b55
          speaker: dorothy
          text: 我没有希望了。奥兹一定要等我杀死西方恶女巫，才肯送我回家，可我永远也办不到。
          emotion: sad
        - id: ch01-b56
          speaker: narrator
          text: 伙伴们听完都替她难过，可是谁也想不出办法，没法帮助她。多萝茜只好独自回到自己的房间，倒在那张柔软的床上，伤心地哭着，哭着哭着就睡着了。
        - id: ch01-b57
          speaker: narrator
          text: 第二天早晨，绿胡子士兵来找稻草人。
        - id: ch01-b58
          speaker: green_soldier
          text: 跟我来吧，奥兹召见你。
        - id: ch01-b59
          speaker: narrator
          text: 稻草人跟着士兵走进宏伟的王座厅，却看见一位美丽绝伦的女子坐在翡翠王座上。她穿着绿色薄纱长裙，披散的绿发上戴着一顶宝石王冠。她的肩头伸出一对色彩绚丽的翅膀。那对翅膀轻盈极了，只要有最微弱的一丝风吹来，就会轻轻颤动。
        - id: ch01-b60
          speaker: narrator
          text: 稻草人来到她面前，尽量不让肚里的稻草碍事，像模像样地鞠了一躬。美丽女子温柔地看着他。
        - id: ch01-b61
          speaker: oz
          text: 我是伟大而可怕的奥兹。你是谁？为什么来找我？
        - id: ch01-b62
          speaker: narrator
          text: 稻草人原以为会见到多萝茜说的巨头，心里惊讶极了，可他还是勇敢地回答。
        - id: ch01-b63
          speaker: scarecrow
          text: 我只是一个肚里装满稻草的稻草人，所以没有脑子。我求你把脑袋里的稻草换成脑子，让我能像你国土上的其他人一样，成为真正的人。
        - id: ch01-b64
          speaker: oz
          text: 我为什么要替你这样做？
        - id: ch01-b65
          speaker: scarecrow
          text: 因为你聪明又强大，除了你，没有人能帮助我。
        - id: ch01-b66
          speaker: oz
          text: 我从不白白满足别人的愿望。不过我可以答应你，只要你替我杀死西方恶女巫，我就给你许多顶好的脑子，让你成为整个奥兹国最聪明的人。
        - id: ch01-b67
          speaker: scarecrow
          text: 我还以为你已经叫多萝茜去杀她了。
          emotion: surprised
        - id: ch01-b68
          speaker: oz
          text: 是的。谁杀死她，我都不在乎。只要她还活着，我就不会实现你的愿望。走吧，等你挣到自己那么想要的脑子，再回来见我。
        - id: ch01-b69
          speaker: narrator
          text: 稻草人满心悲伤地回到伙伴们身边，把奥兹对他说的话从头到尾讲了一遍。多萝茜听说这位伟大的魔法师不是自己见过的巨头，反倒变成了一位美丽女子，惊讶得不得了。
        - id: ch01-b70
          speaker: scarecrow
          text: 不管她是什么模样，她跟铁皮樵夫一样需要一颗心。
        - id: ch01-b71
          speaker: narrator
          text: 又过了一夜，第二天早晨，绿胡子士兵来找铁皮樵夫。
        - id: ch01-b72
          speaker: green_soldier
          text: 奥兹召见你。跟我走吧。
        - id: ch01-b73
          speaker: narrator
          text: 铁皮樵夫跟着士兵走向王座厅，不知道奥兹会是美丽女子，还是一颗巨头。他暗暗希望见到那位女子。他想，要是只有一颗脑袋，我肯定得不到心。脑袋自己就没有心，当然不会同情我。可要是那位女子，我就苦苦求她，因为人们都说，女人天生有一副善良心肠。
        - id: ch01-b74
          speaker: narrator
          text: 可铁皮樵夫进门以后，既没看见巨头，也没看见女子。奥兹变成了一头可怕至极的野兽。它几乎和大象一样庞大，绿色王座仿佛都快承受不住它的重量。它长着犀牛般的脑袋，脸上却有五只眼睛。身体上伸出五条长胳膊，下面还有五条又细又长的腿。全身每个地方都盖满浓密卷毛，再也想不出比它更吓人的怪物了。
        - id: ch01-b75
          speaker: narrator
          text: 幸好铁皮樵夫这时没有心，不然那颗心早就因为恐惧，又快又响地狂跳起来了。他只是铁皮做的，所以一点也不害怕，不过看见这副模样的奥兹，心里还是十分失望。
        - id: ch01-b76
          speaker: oz
          text: 我是伟大而可怕的奥兹。你是谁？为什么来找我？
        - id: ch01-b77
          speaker: tin_woodman
          text: 我是铁皮做的樵夫，所以没有心，也不会爱。我求你给我一颗心，让我能跟其他人一样。
        - id: ch01-b78
          speaker: oz
          text: 我为什么要满足你？
        - id: ch01-b79
          speaker: tin_woodman
          text: 因为我来恳求你，而这件事只有你能办到。
        - id: ch01-b80
          speaker: narrator
          text: 奥兹听了，低低地咆哮一声，语气十分粗暴。
        - id: ch01-b81
          speaker: oz
          text: 你真想得到一颗心，就得自己挣来。
        - id: ch01-b82
          speaker: tin_woodman
          text: 我要怎么挣？
        - id: ch01-b83
          speaker: oz
          text: 帮助多萝茜杀死西方恶女巫。等女巫死了，再来见我。我会给你整个奥兹国最大、最善良、也最有爱的一颗心。
        - id: ch01-b84
          speaker: narrator
          text: 铁皮樵夫没有别的办法，只得难过地回到伙伴身边。他把奥兹的要求告诉大家，又仔细说起自己见到的那头可怕野兽。伙伴们听完都惊奇不已，怎么也没想到这位伟大的魔法师竟能变成这么多种完全不同的模样。
        - id: ch01-b85
          speaker: cowardly_lion
          text: 我去见他时，如果他是野兽，我就用最大的声音咆哮，把他吓得答应我的要求。如果他是美丽女子，我就假装扑向她，逼她照我的话做。如果他是巨头，那就更好办了。我会把那颗脑袋推得满屋乱滚，直到他答应给我们想要的东西。朋友们，打起精神吧，事情一定会好起来的。
        - id: ch01-b86
          speaker: narrator
          text: 再过一夜，第二天早晨，绿胡子士兵把狮子领到宏伟的王座厅门口，叫他独自进去拜见奥兹。狮子马上穿过那扇门，朝四周看了一眼，惊讶地发现王座前烧着一团烈火。火焰又凶又亮，刺得他几乎没法直视。他起初以为奥兹不小心着了火，正在被火焰烧光。可他试着走近，滚烫的热浪立刻灼焦了胡须，吓得他浑身发抖，只能慢慢退回靠近门口的地方。
        - id: ch01-b87
          speaker: narrator
          text: 这时，火球中传出一个低沉平静的声音。
        - id: ch01-b88
          speaker: oz
          text: 我是伟大而可怕的奥兹。你是谁？为什么来找我？
        - id: ch01-b89
          speaker: cowardly_lion
          text: 我是胆小的狮子，什么都怕。我来求你给我勇气，让我能真正成为人们所说的百兽之王。
        - id: ch01-b90
          speaker: oz
          text: 我为什么要给你勇气？
        - id: ch01-b91
          speaker: cowardly_lion
          text: 因为你是所有魔法师中最伟大的，只有你能实现我的愿望。
        - id: ch01-b92
          speaker: narrator
          text: 火球猛烈地燃烧了一阵，里面的声音又响了起来。
        - id: ch01-b93
          speaker: oz
          text: 拿西方恶女巫已死的证据来给我。你拿来的那一刻，我就赐给你勇气。只要她还活着，你就只能继续做一个胆小鬼。
        - id: ch01-b94
          speaker: narrator
          text: 狮子听了这番话非常生气，却找不到一句话反驳。他站在那里，一声不响地盯着火球。火焰烧得越来越凶，热得让他再也受不了。他只好掉转身子，飞快地冲出大厅。看见伙伴们还在外面等候，他高兴极了，马上把这场可怕的会面讲给大家听。
        - id: ch01-b95
          speaker: dorothy
          text: 那我们现在怎么办？
          emotion: sad
        - id: ch01-b96
          speaker: cowardly_lion
          text: 只有一个办法。我们得去温基人的国土，找到西方恶女巫，消灭她。
        - id: ch01-b97
          speaker: dorothy
          text: 可要是我们办不到呢？
        - id: ch01-b98
          speaker: cowardly_lion
          text: 那我永远也得不到勇气。
        - id: ch01-b99
          speaker: scarecrow
          text: 我也永远得不到脑子。
        - id: ch01-b100
          speaker: tin_woodman
          text: 我也永远得不到一颗心。
        - id: ch01-b101
          speaker: dorothy
          text: 我也永远见不到爱姆婶婶和亨利叔叔。
          emotion: sad
        - id: ch01-b102
          speaker: narrator
          text: 多萝茜又哭了起来。绿衣姑娘赶紧叫住她。
        - id: ch01-b103
          speaker: green_maiden
          text: 小心！眼泪落在绿色丝裙上，会留下斑点的。
        - id: ch01-b104
          speaker: narrator
          text: 多萝茜擦干了眼睛。
        - id: ch01-b105
          speaker: dorothy
          text: 看来我们只能试一试了。可就算为了再见爱姆婶婶，我也不愿意杀害任何人。
        - id: ch01-b106
          speaker: cowardly_lion
          text: 我会跟你去，不过我太胆小，杀不了那个女巫。
        - id: ch01-b107
          speaker: scarecrow
          text: 我也去。不过我这么笨，恐怕帮不了多少忙。
        - id: ch01-b108
          speaker: tin_woodman
          text: 我连伤害女巫都狠不下心。可是你要去，我当然跟你一起走。
        - id: ch01-b109
          speaker: narrator
          text: 大家就这样决定，第二天早晨出发。铁皮樵夫在一块绿色磨刀石上磨快斧头，又让人给所有关节好好上了一遍油。稻草人往身体里塞进新鲜稻草，多萝茜还替他的眼睛补了新漆，好叫他看得更清楚。亲切的绿衣姑娘替他们准备路上的东西。她把许多好吃的装进多萝茜的篮子，又用一根绿丝带，把一只小铃铛系在托托脖子上。
        - id: ch01-b110
          speaker: narrator
          text: 所有准备都做好以后，他们早早上了床，一觉睡得又沉又安稳，直到第二天天亮。宫殿后院里，一只绿色公鸡高声啼鸣，一只刚刚下了绿色鸡蛋的母鸡也咯咯叫起来。伙伴们听见这些声音，这才一个个从睡梦中醒来。
