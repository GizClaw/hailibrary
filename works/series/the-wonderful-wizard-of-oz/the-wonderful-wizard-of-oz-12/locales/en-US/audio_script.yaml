  chapters:
    - id: ch01
      title: Chapter XI The Wonderful City of Oz
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Even through their green spectacles, Dorothy and her friends were
            dazzled at first by the wonderful City. Beautiful houses of green
            marble lined the streets, and sparkling emeralds covered them.
            The pavement was green marble too. Close rows of emeralds filled
            every seam between the blocks and glittered in the sun. Green
            glass filled the windows. Even the sky had a green tint, and the
            sunshine itself looked green.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Men, women, and children walked everywhere in green clothes, and
            all of them had greenish skin. They stared at Dorothy and her
            strange group of companions. When the children saw the Lion, they
            ran and hid behind their mothers. Still, no one spoke to the
            travelers. The people only watched them pass with wide,
            wondering eyes.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The shops were full of green things. There was green candy, green
            popcorn, and every kind of green shoe, hat, and piece of clothing.
            One man sold green lemonade. Dorothy watched children buy it with
            green pennies. Everywhere she looked, the goods for sale carried
            the same color as the streets and the people.
        - id: ch01-b04
          speaker: narrator
          text: >-
            There were no horses or other animals in sight. Instead, men
            carried goods in little green carts that they pushed ahead of
            them. Everyone seemed happy, comfortable, and well provided for.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Guardian of the Gates led the friends through the streets. At
            the very center of the City stood a huge building. It was the
            palace of Oz, the Great Wizard. A soldier guarded the door. He
            wore a green uniform and had a long green beard.
        - id: ch01-b06
          speaker: guardian
          text: >-
            These strangers insist on seeing the Great Oz.
        - id: ch01-b07
          speaker: soldier
          text: >-
            Come inside. I'll take your message to him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They passed through the palace gates into a large room. A green
            carpet covered the floor, and emeralds decorated the lovely green
            furniture. Before they entered, the soldier made every one of
            them wipe their feet on a green mat. Once they were seated, he
            spoke politely.
        - id: ch01-b09
          speaker: soldier
          text: >-
            Please get comfortable. I'll go to the Throne Room door and tell
            Oz that you've arrived.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The friends waited a long time. At last the soldier returned, and
            Dorothy questioned him.
        - id: ch01-b11
          speaker: dorothy
          text: Did you see Oz?
        - id: ch01-b12
          speaker: soldier
          text: >-
            Oh, no. I've never seen him. He sat behind a screen while I gave
            him your message. He'll let you meet him if you still wish to.
            But each of you must go in alone, and he'll see only one of you
            each day. You'll be staying at the palace for several days, so
            I'll have someone show you to comfortable rooms where you can
            rest after your journey.
        - id: ch01-b13
          speaker: dorothy
          text: Thank you. That's very kind of Oz.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The soldier blew a green whistle. A young girl immediately came
            into the room. She wore a pretty green silk gown, and her hair and
            eyes were green. She bowed low before Dorothy.
        - id: ch01-b15
          speaker: green_maiden
          text: Come with me, and I'll take you to your room.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Dorothy said good-bye to her friends, though Toto stayed with her.
            She carried him through seven passages and up three flights of
            stairs behind the green maiden. They stopped at a front room in
            the palace. It was the sweetest little room in the world.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The comfortable bed had green silk sheets and a green velvet
            cover. In the middle of the room, a tiny fountain sprayed green
            perfume high into the air. The scented drops fell back into a
            beautifully carved basin of green marble. Beautiful green flowers
            stood in the windows, and little green books waited in a neat row
            on a shelf. When Dorothy had time to open them, she discovered
            they were filled with strange green pictures. The pictures were so
            funny that they made her laugh.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The wardrobe held many dresses made of green silk, satin, and
            velvet. Every one of them fit Dorothy perfectly.
        - id: ch01-b19
          speaker: green_maiden
          text: >-
            Make yourself right at home. If you need anything, just ring the
            bell. Oz will call for you tomorrow morning.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The maiden left Dorothy and returned for the others. Each friend
            received a pleasant room in the palace. All that comfort meant
            nothing to the Scarecrow. Once he was alone, he stood just inside
            his doorway and stayed there until morning. Lying down could not
            rest him, and he had no eyes to close. All night he watched a
            little spider weaving its web in a corner, as though his room
            were not one of the most wonderful rooms in the world.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The Tin Woodman lay on his bed out of habit, remembering the days
            when he had been made of flesh. He could not sleep, so he spent
            the entire night moving his joints up and down. He wanted to make
            certain that every one of them stayed in good working order. The
            Lion would much rather have slept on a bed of dry leaves in the
            forest. He did not like being shut inside four walls, but he had
            too much sense to let it trouble him. He sprang onto the bed,
            curled himself up like a cat, and purred himself to sleep in a
            minute.
        - id: ch01-b22
          speaker: narrator
          text: >-
            After breakfast the next morning, the green maiden came for
            Dorothy. She dressed her in a lovely gown of green patterned
            satin. Dorothy added a green silk apron and tied a green ribbon
            around Toto's neck. Then they set off for the Great Oz's Throne
            Room.
        - id: ch01-b23
          speaker: narrator
          text: >-
            First they entered a great hall filled with ladies and gentlemen
            of the court in rich clothes. They had nothing to do but talk
            among themselves. Every morning they gathered outside the Throne
            Room and waited there together, though none of them was ever
            allowed to see Oz. This morning was no different. When Dorothy
            entered the hall in her green satin gown with Toto beside her,
            they all studied her curiously. One courtier leaned near and
            whispered to her.
        - id: ch01-b24
          speaker: courtier
          text: Are you truly going to look at the face of Oz the Terrible?
        - id: ch01-b25
          speaker: dorothy
          text: Of course, if he'll agree to see me.
        - id: ch01-b26
          speaker: soldier
          text: >-
            Oh, he'll see you, though he doesn't like anyone asking for an
            audience. At first he was angry. He told me to send you back where
            you came from. Then he asked what you looked like. When I told him
            about your silver shoes, he became very interested. Finally, I
            mentioned the mark on your forehead, and he decided to let you
            enter.
        - id: ch01-b27
          speaker: narrator
          text: A bell rang just then.
        - id: ch01-b28
          speaker: green_maiden
          text: That's the signal. You have to enter the Throne Room alone.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The maiden opened a small door. Dorothy walked boldly through it
            and found herself in a marvelous place. The room was huge and
            round, with a high, arched roof. Great emeralds, fitted closely
            together without a gap, covered the walls, ceiling, and floor. A
            great light shone from the center of the roof. It was as bright as
            the sun, and its rays made all those emeralds glitter in a
            marvelous way.
        - id: ch01-b30
          speaker: narrator
          text: >-
            What caught Dorothy's attention most was the great green marble
            throne at the center of the room. It had the shape of a chair and
            glittered with gems like everything around it. On that chair sat
            an enormous Head with no body, arms, or legs. It had no hair, but
            it did have two eyes, a nose, and a mouth. The bare Head was far
            larger than the head of even the biggest giant Dorothy could have
            imagined.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Dorothy stared with wonder and fear. Slowly, the eyes turned and
            fixed their sharp gaze on her. The mouth began to move, and a
            voice spoke.
        - id: ch01-b32
          speaker: oz
          text: >-
            I am Oz, the Great and Terrible. Who are you? Why have you come to
            me?
        - id: ch01-b33
          speaker: narrator
          text: >-
            The voice was not as dreadful as Dorothy had expected from such a
            huge Head. She found her courage and answered.
        - id: ch01-b34
          speaker: dorothy
          text: I'm Dorothy, the Small and Meek. I came because I need your help.
        - id: ch01-b35
          speaker: narrator
          text: The eyes studied her for a full minute before Oz spoke again.
        - id: ch01-b36
          speaker: oz
          text: How did you get those silver shoes?
        - id: ch01-b37
          speaker: dorothy
          text: >-
            They belonged to the Wicked Witch of the East. My house fell on
            her and killed her, and that's how I got them.
        - id: ch01-b38
          speaker: oz
          text: And where did the mark on your forehead come from?
        - id: ch01-b39
          speaker: dorothy
          text: >-
            The Good Witch of the North kissed me there when she said good-bye
            and sent me to find you.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Again the eyes examined her closely. They could see that she was
            telling the truth.
        - id: ch01-b41
          speaker: oz
          text: What do you want me to do?
        - id: ch01-b42
          speaker: dorothy
          text: >-
            Please send me home to Kansas, where Aunt Em and Uncle Henry are.
            Your country is beautiful, but I don't like being here. Aunt Em
            must be terribly worried because I've been gone so long.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The eyes blinked three times. They looked up at the ceiling, down
            at the floor, and then rolled about so strangely that they seemed
            to take in every corner of the room. At last they faced Dorothy
            again.
        - id: ch01-b44
          speaker: oz
          text: Why should I do that for you?
        - id: ch01-b45
          speaker: dorothy
          text: >-
            Because you're strong and I'm weak. You're a Great Wizard, and
            I'm only a little girl.
        - id: ch01-b46
          speaker: oz
          text: Yet you were strong enough to kill the Wicked Witch of the East.
        - id: ch01-b47
          speaker: dorothy
          text: That was an accident. I couldn't stop it from happening.
        - id: ch01-b48
          speaker: oz
          text: >-
            Then here is my answer. You can't expect me to send you to Kansas
            unless you give me something in return. In this country, everyone
            pays for what they receive. If you want me to use my magic and
            send you home, you must do something for me first. Help me, and
            I'll help you.
        - id: ch01-b49
          speaker: dorothy
          text: What do I have to do?
        - id: ch01-b50
          speaker: oz
          text: Kill the Wicked Witch of the West.
        - id: ch01-b51
          speaker: dorothy
          text: But I can't!
          emotion: surprised
        - id: ch01-b52
          speaker: oz
          text: >-
            You killed the Witch of the East, and those silver shoes carry a
            powerful charm. Only one Wicked Witch remains in this whole land.
            When you can tell me she's dead, I'll send you to Kansas. I won't
            do it before then.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dorothy began to cry. She was bitterly disappointed. The eyes
            blinked and watched her anxiously, as if the Great Oz believed she
            could help him if only she chose to.
        - id: ch01-b54
          speaker: dorothy
          text: >-
            I've never killed anything on purpose. Even if I wanted to, how
            could I kill the Wicked Witch? You're Great and Terrible, and you
            can't kill her yourself. How can you expect me to do it?
          emotion: sad
        - id: ch01-b55
          speaker: oz
          text: >-
            I don't know. But that is my answer. Until the Wicked Witch dies,
            you won't see your aunt and uncle again. Remember, she is Wicked.
            She is terribly Wicked, and she ought to be killed. Now go. Don't
            ask to see me again until you've completed your task.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Dorothy sadly left the Throne Room. The Lion, the Scarecrow, and
            the Tin Woodman were waiting to hear what Oz had told her.
        - id: ch01-b57
          speaker: dorothy
          text: >-
            There's no hope for me. Oz won't send me home until I've killed
            the Wicked Witch of the West, and I could never do that.
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: >-
            Her friends felt sorry for her, but there was nothing they could
            do. Dorothy returned to her room, lay on the bed, and cried herself
            to sleep.
        - id: ch01-b59
          speaker: narrator
          text: >-
            The next morning, the soldier with the green whiskers came for the
            Scarecrow.
        - id: ch01-b60
          speaker: soldier
          text: Come with me. Oz has called for you.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The Scarecrow followed him into the great Throne Room. This time,
            a beautiful Lady sat upon the emerald throne. She wore green silk
            gauze, and a jeweled crown rested on her flowing green hair.
            Brilliant wings grew from her shoulders. They were so light that
            the faintest breath of air made them flutter.
        - id: ch01-b62
          speaker: narrator
          text: >-
            The Scarecrow bowed as gracefully as his stuffing of straw would
            allow. The lovely creature gazed at him sweetly.
        - id: ch01-b63
          speaker: oz
          text: >-
            I am Oz, the Great and Terrible. Who are you? Why have you come to
            me?
        - id: ch01-b64
          speaker: narrator
          text: >-
            Dorothy had told the Scarecrow about the great Head, so the Lady
            astonished him. Still, he answered bravely.
        - id: ch01-b65
          speaker: scarecrow
          text: >-
            I'm only a Scarecrow filled with straw, so I have no brains. I'm
            asking you to put brains into my head in place of the straw. Then
            I can be as much a man as anyone else in your country.
        - id: ch01-b66
          speaker: oz
          text: Why should I do that for you?
        - id: ch01-b67
          speaker: scarecrow
          text: Because you're wise and powerful, and no one else can help me.
        - id: ch01-b68
          speaker: oz
          text: >-
            I never grant a favor without receiving something in return. But
            I'll promise you this. Kill the Wicked Witch of the West for me,
            and I'll fill your head with a great many brains. They won't be
            ordinary brains, either. They'll be such excellent brains that
            you'll become the wisest man in all the Land of Oz.
        - id: ch01-b69
          speaker: scarecrow
          text: I thought you wanted Dorothy to kill the Witch.
          emotion: surprised
        - id: ch01-b70
          speaker: oz
          text: >-
            I did ask her. It doesn't matter to me who kills the Witch. Until
            she is dead, I won't give you what you want. Now leave, and don't
            come back until you've earned the brains you want so badly.
        - id: ch01-b71
          speaker: narrator
          text: >-
            The Scarecrow sadly returned to his friends and repeated what Oz
            had said. Dorothy was amazed to hear that the Great Wizard had
            appeared as a lovely Lady instead of the Head she had seen.
        - id: ch01-b72
          speaker: scarecrow
          text: >-
            Whatever she looks like, she needs a heart just as much as the Tin
            Woodman does.
        - id: ch01-b73
          speaker: narrator
          text: >-
            On the following morning, the soldier with the green whiskers came
            to the Tin Woodman.
        - id: ch01-b74
          speaker: soldier
          text: Oz has called for you. Come with me.
        - id: ch01-b75
          speaker: narrator
          text: >-
            The Tin Woodman followed him to the great Throne Room. He did not
            know whether Oz would be a Head or a lovely Lady, though he hoped
            for the Lady.
        - id: ch01-b76
          speaker: tin_woodman
          text: >-
            If Oz is the Head, I don't think I'll receive a heart. A head
            doesn't have a heart of its own, so it couldn't feel sorry for me.
            But if Oz is the lovely Lady, I'll plead as hard as I can. People
            say all ladies have kind hearts.
        - id: ch01-b77
          speaker: narrator
          text: >-
            When the Woodman entered, he found neither the Head nor the Lady.
            Oz had become a dreadful Beast. It was almost as large as an
            elephant, and the green throne hardly seemed strong enough to hold
            it. Its head looked like a rhinoceros's head, except that five eyes
            stared from its face. Five long arms grew from its body, along
            with five long, thin legs. Thick woolly hair covered it from end
            to end. The Woodman had never imagined that any monster could look
            so dreadful.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Luckily, the Tin Woodman had no heart. Otherwise, terror would
            have made it pound hard and fast. Since he was made only of tin,
            he felt no fear at all. He was disappointed, though.
        - id: ch01-b79
          speaker: oz
          text: >-
            I am Oz, the Great and Terrible! Who are you? Why have you come to
            me?
          emotion: angry
        - id: ch01-b80
          speaker: tin_woodman
          text: >-
            I'm a Woodman made of tin. I have no heart, and without one I
            can't love. Please give me a heart so I can be like other men.
        - id: ch01-b81
          speaker: oz
          text: Why should I do that?
        - id: ch01-b82
          speaker: tin_woodman
          text: Because I'm asking you, and you're the only one who can grant my wish.
        - id: ch01-b83
          speaker: narrator
          text: Oz gave a low growl before answering roughly.
        - id: ch01-b84
          speaker: oz
          text: If you truly want a heart, you must earn it.
        - id: ch01-b85
          speaker: tin_woodman
          text: How can I earn it?
        - id: ch01-b86
          speaker: oz
          text: >-
            Help Dorothy kill the Wicked Witch of the West. Once the Witch is
            dead, come back to me. I'll give you the biggest, kindest, most
            loving heart in the entire Land of Oz.
        - id: ch01-b87
          speaker: narrator
          text: >-
            The Tin Woodman had no choice but to return sadly to his friends.
            He told them about the terrible Beast. They all wondered how the
            Great Wizard could take so many different forms. The Lion tried to
            cheer them.
        - id: ch01-b88
          speaker: cowardly_lion
          text: >-
            If he's a Beast when I go in, I'll give my loudest roar and scare
            him into granting every wish. If he's the lovely Lady, I'll act as
            though I'm about to leap at her, and she'll have to do what I say.
            If he's the great Head, he'll be helpless. I'll roll him all over
            the room until he promises to give us what we want. Cheer up, my
            friends. Everything will work out yet.
        - id: ch01-b89
          speaker: narrator
          text: >-
            The next morning, the soldier with the green whiskers took the
            Lion to the great Throne Room and told him to enter Oz's presence.
            The Lion went through the door at once. He glanced around and saw
            something he had never expected. Before the throne blazed a Ball
            of Fire, so fierce and bright that he could hardly bear to look at
            it. Nothing else Oz had shown the travelers looked like this.
        - id: ch01-b90
          speaker: narrator
          text: >-
            At first, he thought Oz had somehow caught fire and was burning
            up. But when the Lion tried to move closer, the terrible heat
            singed his whiskers. He could not force himself any nearer.
            Trembling, he crept backward until he reached a place close to the
            door. Then a low, quiet voice came from the roaring flames.
        - id: ch01-b91
          speaker: oz
          text: >-
            I am Oz, the Great and Terrible. Who are you? Why have you come to
            me?
        - id: ch01-b92
          speaker: cowardly_lion
          text: >-
            I'm a Cowardly Lion, and everything frightens me. I've come to ask
            you for courage. Then I can truly become the King of Beasts, as
            people call me.
        - id: ch01-b93
          speaker: oz
          text: Why should I give you courage?
        - id: ch01-b94
          speaker: cowardly_lion
          text: >-
            Because you're the greatest of all Wizards. You're the only one
            with the power to grant my wish.
        - id: ch01-b95
          speaker: narrator
          text: The Ball of Fire burned fiercely for a while. Then the voice spoke.
        - id: ch01-b96
          speaker: oz
          text: >-
            Bring me proof that the Wicked Witch is dead, and I'll give you
            courage that very moment. As long as she remains alive, you must
            remain a coward.
        - id: ch01-b97
          speaker: narrator
          text: >-
            The Lion was angry, but he could think of no answer. While he
            silently watched the Ball of Fire, it grew so furiously hot that
            he turned and rushed from the room. He was relieved to find his
            friends still waiting for him outside. Once he was safely back
            with them, he told them all about his terrible meeting with the
            Wizard and the bargain Oz had demanded.
        - id: ch01-b98
          speaker: dorothy
          text: What can we do now?
          emotion: sad
        - id: ch01-b99
          speaker: cowardly_lion
          text: >-
            We can do only one thing. We must go to the land of the Winkies,
            find the Wicked Witch, and destroy her.
        - id: ch01-b100
          speaker: dorothy
          text: What if we can't do it?
        - id: ch01-b101
          speaker: cowardly_lion
          text: Then I'll never have courage.
        - id: ch01-b102
          speaker: scarecrow
          text: And I'll never have brains.
        - id: ch01-b103
          speaker: tin_woodman
          text: And I'll never have a heart.
        - id: ch01-b104
          speaker: dorothy
          text: And I'll never see Aunt Em and Uncle Henry again.
          emotion: sad
        - id: ch01-b105
          speaker: narrator
          text: Dorothy began to cry.
        - id: ch01-b106
          speaker: green_maiden
          text: >-
            Be careful! Your tears will land on that green silk gown and leave
            spots.
        - id: ch01-b107
          speaker: narrator
          text: Dorothy wiped her eyes.
        - id: ch01-b108
          speaker: dorothy
          text: >-
            I suppose we have to try. But I know I don't want to kill anyone,
            even if it means seeing Aunt Em again.
        - id: ch01-b109
          speaker: cowardly_lion
          text: >-
            I'll come with you. But I'm far too cowardly to kill the Witch.
        - id: ch01-b110
          speaker: scarecrow
          text: >-
            I'll come too, though I won't be much help. I'm such a fool.
        - id: ch01-b111
          speaker: tin_woodman
          text: >-
            I don't have the heart to hurt anyone, even a Witch. But if you
            go, I'll certainly go with you.
        - id: ch01-b112
          speaker: narrator
          text: >-
            So they decided to begin their journey the next morning. The Tin
            Woodman sharpened his axe on a green grindstone and had every
            joint properly oiled. The Scarecrow filled himself with fresh
            straw. Dorothy repainted his eyes so he could see better. The kind
            green maiden helped them prepare as well. She packed Dorothy's
            basket with good things to eat. Then she fastened a little bell
            around Toto's neck with a green ribbon.
        - id: ch01-b113
          speaker: narrator
          text: >-
            They went to bed early and slept soundly until daylight. Then a
            green rooster crowed in the palace yard, and a hen cackled after
            laying a green egg. The sounds woke them all.
