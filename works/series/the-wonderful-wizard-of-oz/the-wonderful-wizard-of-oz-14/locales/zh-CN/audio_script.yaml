audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    winkie:
      display_name: 温基人
      tts:
        delivery: 质朴热情，获得自由后充满喜悦
        timbre: 明朗敦厚
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十三章　营救
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 胆小的狮子听说，一桶水竟把恶女巫融化了，心里别提多高兴。多萝茜马上打开院门，放他出来。两人走进城堡以后，多萝茜先召集所有温基人，告诉大家，他们从此自由了，再也不用做奴隶。
        - id: ch01-b02
          speaker: narrator
          text: 黄色的温基人顿时欢腾起来。这些年，恶女巫逼他们做尽苦工，还一直残酷地折磨他们。大家当天摆下宴席，尽情跳舞。从此以后，他们年年都把这一天当作节日。
        - id: ch01-b03
          speaker: cowardly_lion
          text: 要是稻草人和铁皮樵夫也在这儿，我就真的什么遗憾都没有了。
        - id: ch01-b04
          speaker: dorothy
          text: 你说，我们有办法救回他们吗？
        - id: ch01-b05
          speaker: cowardly_lion
          text: 我们总可以试一试。
        - id: ch01-b06
          speaker: narrator
          text: 他们请温基人一起来救朋友。温基人说，多萝茜把大家从奴役中救了出来，他们愿意为她出尽全力。多萝茜选了几个最有见识的人，一行人就出发了。他们走了一整天，第二天又走了大半日，终于来到那片乱石平原。铁皮樵夫还躺在那里，浑身撞得又瘪又弯。斧头掉在一旁，斧刃生了锈，斧柄也断得只剩短短一截。
        - id: ch01-b07
          speaker: narrator
          text: 温基人小心地抱起他，一路抬回黄色城堡。老朋友落得这么凄惨，多萝茜忍不住掉了几滴泪，狮子也一路沉着脸，心里很难过。回到城堡，多萝茜赶紧打听。
        - id: ch01-b08
          speaker: dorothy
          text: 你们这里有会做白铁活的人吗？
        - id: ch01-b09
          speaker: winkie
          text: 有啊，我们有几位白铁匠，手艺可好了。
        - id: ch01-b10
          speaker: dorothy
          text: 那就请他们过来。
        - id: ch01-b11
          speaker: narrator
          text: 白铁匠们提着一篮篮工具赶来了。多萝茜指着朋友问他们。
        - id: ch01-b12
          speaker: dorothy
          text: 你们能敲平他身上的凹痕，让他变回原来的样子，再把断开的地方焊好吗？
        - id: ch01-b13
          speaker: narrator
          text: 白铁匠们把铁皮樵夫从头到脚看了一遍，觉得一定能让他恢复如初。他们在一间黄色大厅里整整忙了三天四夜，又敲，又扭，又弯，又焊，还不停擦亮和捶打他的脑袋、身子和双腿。最后，铁皮樵夫终于重新挺直，各处关节也跟以前一样灵活。身上虽然多了几块补丁，可工匠们补得很好，他又从来不爱漂亮，所以一点也不介意。
        - id: ch01-b14
          speaker: narrator
          text: 铁皮樵夫终于走进多萝茜的房间，向她道谢。他高兴得哭了，多萝茜连忙用围裙擦掉他脸上的每一滴泪，免得眼泪让关节生锈。她自己见到老朋友，也哭得泪珠直落，不过她的泪当然用不着擦。狮子更是拿尾巴尖擦了一次又一次，最后尾巴都湿透了。他只好走到院子里，把尾巴举在太阳底下晒干。
        - id: ch01-b15
          speaker: narrator
          text: 多萝茜把这些日子发生的事全讲给了铁皮樵夫听。听完以后，他只盼着另一位朋友也能回来。
        - id: ch01-b16
          speaker: tin_woodman
          text: 要是稻草人也能回到我们身边，我就再没有别的遗憾了。
        - id: ch01-b17
          speaker: dorothy
          text: 那我们一定要找到他。
        - id: ch01-b18
          speaker: narrator
          text: 多萝茜又请温基人来帮忙。大家走了一整天，第二天又走了大半日，终于找到了那棵高高的大树。飞猴把稻草人的衣服扔在枝头，如今它们还挂在那里。
        - id: ch01-b19
          speaker: narrator
          text: 树干太光滑，树又高得吓人，谁都爬不上去。铁皮樵夫一看，马上有了办法。
        - id: ch01-b20
          speaker: tin_woodman
          text: 我来砍倒这棵树。树一倒，我们就拿得到稻草人的衣服了。
        - id: ch01-b21
          speaker: narrator
          text: 修理铁皮樵夫时，一位当金匠的温基人还用纯金做了新斧柄，替他装在斧头上。其他人也擦净了斧刃上的锈。现在，那片斧刃亮得就像磨光的白银。
        - id: ch01-b22
          speaker: narrator
          text: 铁皮樵夫说砍就砍。没过多久，大树轰的一声倒下，稻草人的衣服从枝头跌落，滚到了地上。
        - id: ch01-b23
          speaker: narrator
          text: 多萝茜捡起衣服，让温基人带回城堡，在里面填满又好又干净的稻草。再一看，稻草人又完完整整地站在大家眼前了。他谢了一遍又一遍，怎么也谢不够。
        - id: ch01-b24
          speaker: narrator
          text: 伙伴们总算团聚了。他们在黄色城堡快活地住了几天。那里什么都有，大家过得舒服极了。
        - id: ch01-b25
          speaker: narrator
          text: 可有一天，多萝茜想起了爱姆婶婶。她知道，自己该继续赶路了。
        - id: ch01-b26
          speaker: dorothy
          text: 我们得回去找奥兹，让他兑现答应我们的事。
        - id: ch01-b27
          speaker: tin_woodman
          text: 对，我终于能得到一颗心了。
        - id: ch01-b28
          speaker: scarecrow
          text: 我也终于能有脑子啦！
          emotion: happy
        - id: ch01-b29
          speaker: cowardly_lion
          text: 我也能得到勇气了。
        - id: ch01-b30
          speaker: dorothy
          text: 我也能回堪萨斯了！我们明天就去翡翠城吧！
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: 多萝茜高兴得拍起手来，大家也都同意第二天动身。到了早晨，他们把温基人召集起来，一一告别。温基人实在舍不得他们走。这些天，大家已经非常爱戴铁皮樵夫，都求他留下来，做温基人和西方黄色国土的统治者。可伙伴们已经下定决心要离开，温基人只好拿出礼物为他们送行。
        - id: ch01-b32
          speaker: narrator
          text: 托托和狮子各得了一只金项圈。多萝茜得到一只镶满钻石的漂亮手镯。稻草人得到一根金头手杖，可以扶着它走路，免得绊倒。铁皮樵夫得到一只银油壶，上面镶着黄金和珍贵的宝石。
        - id: ch01-b33
          speaker: narrator
          text: 几位旅人也各自说了好听的话，向温基人致谢。接着，他们挨个儿和大家握手，握到最后，连胳膊都酸了。
        - id: ch01-b34
          speaker: narrator
          text: 多萝茜去女巫的橱柜里拿食物，把篮子装得满满的。她在那里发现了金帽，便拿起来戴了戴。帽子正好合适。多萝茜不知道它藏着什么魔力，只觉得很好看，就决定把它戴在头上，再把自己的遮阳帽收进篮子。
        - id: ch01-b35
          speaker: narrator
          text: 行装收拾好了，他们一同踏上前往翡翠城的路。身后，温基人为他们高声欢呼了三次，还送来许许多多美好的祝愿，陪着他们一路向前。
