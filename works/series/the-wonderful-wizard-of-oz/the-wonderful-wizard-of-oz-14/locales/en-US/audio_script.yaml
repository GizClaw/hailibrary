  chapters:
    - id: ch01
      title: Chapter XIII The Rescue
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Cowardly Lion was delighted to hear that a bucket of water
            had melted the Wicked Witch. Dorothy quickly unlocked his prison
            gate and freed him. Then they went into the castle, where the
            first thing Dorothy did was gather all the Winkies and tell them
            they were slaves no longer.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The yellow Winkies rejoiced. For many years, the Witch had forced
            them to work hard and had treated them cruelly. They made that day
            a holiday. From then on, they celebrated it every year with
            feasting and dancing.
        - id: ch01-b03
          speaker: cowardly_lion
          text: >-
            If only the Scarecrow and the Tin Woodman were here with us, I'd
            be completely happy.
        - id: ch01-b04
          speaker: dorothy
          text: Do you think we might be able to save them?
        - id: ch01-b05
          speaker: cowardly_lion
          text: We can certainly try.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Dorothy and the Lion asked the Winkies to help rescue their
            friends. The Winkies were eager to do anything they could for the
            girl who had freed them. Dorothy chose several who seemed to know
            the most and would be especially useful, and they all set out
            together.
        - id: ch01-b07
          speaker: narrator
          text: >-
            They traveled for the rest of that day and part of the next. At
            last, they reached the rocky plain. The Tin Woodman still lay
            there, battered and bent. His axe was beside him, but its blade
            had rusted and its handle had snapped off short.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The Winkies gently lifted him and carried him all the way back to
            the Yellow Castle. Dorothy shed a few tears when she saw how badly
            hurt her old friend was. The Lion looked solemn and sorry too.
        - id: ch01-b09
          speaker: dorothy
          text: Are any of the Winkies tinsmiths?
        - id: ch01-b10
          speakers: [winkie_1, winkie_2]
          ensemble: duo
          text: Oh, yes. Some of us are excellent tinsmiths.
        - id: ch01-b11
          speaker: dorothy
          text: Please bring them here.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The tinsmiths arrived with baskets full of tools. Dorothy showed
            them the Tin Woodman.
        - id: ch01-b13
          speaker: dorothy
          text: >-
            Can you smooth out all these dents, bend him back into shape, and
            solder the broken parts together?
        - id: ch01-b14
          speaker: narrator
          text: >-
            The tinsmiths examined him carefully. They believed they could
            make him as good as ever, so they got to work in one of the
            castle's great yellow rooms. They studied every dent and every
            broken place before beginning the difficult repair.
        - id: ch01-b15
          speaker: narrator
          text: >-
            For three days and four nights, they hammered, twisted, bent,
            soldered, polished, and pounded his legs, his body, and his head.
            At last, the Tin Woodman stood straight in his old shape, and all
            his joints moved as well as before. He did have several patches,
            but the tinsmiths had done fine work. The Woodman wasn't vain, so
            the patches didn't trouble him at all.
        - id: ch01-b16
          speaker: narrator
          text: >-
            At last, he walked into Dorothy's room and thanked her for saving
            him. He was so happy that he cried tears of joy. Dorothy carefully
            wiped every tear from his face with her apron before it could rust
            his joints. Her own tears came fast and thick, but those needed no
            wiping. The Lion dabbed his eyes with the tip of his tail so many
            times that it grew quite wet. He had to take it into the courtyard
            and hold it in the sunshine until it dried. Once Dorothy had told
            the Woodman everything that happened, he spoke.
        - id: ch01-b17
          speaker: tin_woodman
          text: >-
            Now, if we could only have the Scarecrow back with us, I'd be
            completely happy.
        - id: ch01-b18
          speaker: dorothy
          text: Then we have to try to find him.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Dorothy called on the Winkies once more. They walked throughout
            that day and into the next until they found the tall tree where
            the Winged Monkeys had thrown the Scarecrow's clothes among the
            branches.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The tree was extremely tall, and its trunk was too smooth for
            anyone to climb.
        - id: ch01-b21
          speaker: tin_woodman
          text: >-
            I'll cut the tree down. Once it falls, we can reach the
            Scarecrow's clothes.
        - id: ch01-b22
          speaker: narrator
          text: >-
            While the tinsmiths had repaired the Woodman, a Winkie goldsmith
            had made a solid-gold handle for his axe to replace the broken
            one. Other Winkies had polished away every bit of rust until the
            blade shone like bright silver.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The Tin Woodman began chopping at once. Before long, the tree
            crashed to the ground. The Scarecrow's clothes tumbled from the
            branches and rolled onto the earth.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Dorothy gathered them up, and the Winkies carried them back to
            the castle. There they filled the clothes with fresh, clean straw.
            And there stood the Scarecrow, as good as ever, thanking them
            again and again for rescuing him. With his clothes filled out
            once more, their familiar old friend was back.
        - id: ch01-b25
          speaker: narrator
          text: >-
            With everyone together again, Dorothy and her friends enjoyed a
            few happy days at the Yellow Castle. They found everything there
            that they needed to be comfortable. For those few days, none of
            them lacked a thing.
        - id: ch01-b26
          speaker: narrator
          text: But one day, Dorothy remembered Aunt Em.
        - id: ch01-b27
          speaker: dorothy
          text: We need to go back to Oz and ask him to keep his promise.
        - id: ch01-b28
          speaker: tin_woodman
          text: Yes. At last, I'll receive my heart.
        - id: ch01-b29
          speaker: scarecrow
          text: And I'll finally receive my brains!
          emotion: happy
        - id: ch01-b30
          speaker: cowardly_lion
          text: And I'll receive my courage.
        - id: ch01-b31
          speaker: dorothy
          text: >-
            And I'll go home to Kansas! Oh, let's leave for the Emerald City
            tomorrow!
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: >-
            Dorothy clapped her hands, and they all agreed. The next day, they
            gathered the Winkies and said good-bye. The Winkies were sorry to
            see them leave. They had become so fond of the Tin Woodman that
            they begged him to stay and rule over them and the Yellow Land of
            the West. But when they saw that the travelers meant to go, they
            brought farewell gifts.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Toto and the Lion each received a golden collar. Dorothy received
            a lovely bracelet set with diamonds. They gave the Scarecrow a
            walking stick with a golden head to help keep him from stumbling.
            For the Tin Woodman, they brought a silver oil can inlaid with
            gold and decorated with precious jewels.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Each traveler answered with a gracious little speech. Then they
            shook hands with the Winkies one after another, until everyone's
            arms ached from all those farewells.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Dorothy went to the Witch's cupboard and filled her basket with
            food for the journey. There she noticed the Golden Cap. She tried
            it on, and it fit her perfectly. Dorothy knew nothing about the
            Cap's charm. She simply thought it was pretty, so she decided to
            wear it and put her sunbonnet in the basket.
        - id: ch01-b36
          speaker: narrator
          text: >-
            When everything was ready, Dorothy and her friends set off for the
            Emerald City. Behind them, the Winkies sent three cheers and many
            good wishes along on their journey.
