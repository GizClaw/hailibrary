audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着童话讲述者的亲切与幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直率，情感自然流露
        timbre: 清亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    glinda:
      display_name: 格琳达
      tts:
        delivery: 和善端庄，说话笃定而亲切
        timbre: 明亮柔润
        pace: 从容平稳
        pitch: 中音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 机灵谦和，偶尔带一点天真的自我怀疑
        timbre: 轻柔松快
        pace: 灵活自然
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮人
      tts:
        delivery: 诚恳温厚，感情细腻
        timbre: 清脆中带温暖
        pace: 平稳稍慢
        pitch: 中音
    lion:
      display_name: 狮子
      tts:
        delivery: 浑厚坦率，勇敢中保留温柔
        timbre: 低沉宽厚
        pace: 稳健自然
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十三章　好女巫格琳达满足多萝茜的愿望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 去见格琳达以前，大家先被带到城堡的一间屋子里，好好收拾自己。多萝茜洗净脸，仔细梳好头发。狮子使劲抖着鬃毛，把藏在里面的灰尘全甩掉。稻草人从头到脚拍拍身子，尽力恢复最神气的模样。铁皮人把全身的铁皮擦得闪闪发亮，也给每一处关节添了油。
        - id: ch01-b02
          speaker: narrator
          text: 等每个人都收拾得体了，他们才跟着女兵走进一间宽阔的大厅。格琳达坐在红宝石宝座上。在大家眼中，她既年轻又美丽。浓红的头发卷成一道道流动的波浪，垂过肩头。她穿着纯白的长裙，一双蓝眼睛和和气气地看着多萝茜。
        - id: ch01-b03
          speaker: glinda
          text: 孩子，你想让我帮你做什么？
        - id: ch01-b04
          speaker: narrator
          text: 多萝茜把自己的经历从头讲起。旋风怎样把她卷到奥兹国，她怎样一个个结识了身边这些伙伴，大家又一路遇到过多少不可思议的冒险，她全都告诉了格琳达。
        - id: ch01-b05
          speaker: dorothy
          text: 我现在最想回到堪萨斯。艾姆婶婶一定以为我出了大事，还会为我穿丧服。可今年的收成要是不比去年好，亨利叔叔恐怕连丧服也买不起呢。
        - id: ch01-b06
          speaker: narrator
          text: 听完这些话，格琳达从宝座上俯下身，亲了亲多萝茜仰起的可爱脸庞。这个满怀爱意的小姑娘，心里惦记的总是她所爱的人。
        - id: ch01-b07
          speaker: glinda
          text: 你这心肠多好的孩子呀！我知道一个办法，可以让你回到堪萨斯。不过，你得把金冠送给我。
        - id: ch01-b08
          speaker: dorothy
          text: 我愿意！它对我已经没什么用了。交给你以后，你还能命令飞猴三次。
        - id: ch01-b09
          speaker: glinda
          text: 正好，我想请它们办三件事。
        - id: ch01-b10
          speaker: narrator
          text: 多萝茜马上把金冠交给格琳达。格琳达微笑着接过来，又把目光转向稻草人。
        - id: ch01-b11
          speaker: glinda
          text: 多萝茜走了以后，你准备去哪儿？
        - id: ch01-b12
          speaker: scarecrow
          text: 我想回翡翠城。奥兹让我在那里当统治者，百姓也喜欢我。可我不知道怎么才能越过锤头人的山，这件事最让我发愁。
        - id: ch01-b13
          speaker: glinda
          text: 我会借助金冠的力量，命令飞猴把你一直送到翡翠城门前。百姓这样喜欢你，要是让他们失去这么出色的统治者，那才叫可惜呢。
        - id: ch01-b14
          speaker: scarecrow
          text: 我真有那么出色吗？
        - id: ch01-b15
          speaker: glinda
          text: 你呀，的确很不寻常。
        - id: ch01-b16
          speaker: narrator
          text: 格琳达又转过身来，问铁皮人将来有什么打算。铁皮人靠着斧头，认真想了一小会儿。
        - id: ch01-b17
          speaker: tin_woodman
          text: 温基人对我非常好。恶女巫死后，他们就想让我统治西方国。我也喜欢他们。只要能回去，我最愿意永远做他们的统治者。
        - id: ch01-b18
          speaker: glinda
          text: 那么，我给飞猴的第二道命令，就是让它们把你平平安安送回温基人的国度。你的脑子看着也许没稻草人的大，可只要把你擦得锃亮，你其实比他还聪明。我相信，你会又聪明又妥善地治理温基人。
        - id: ch01-b19
          speaker: narrator
          text: 接下来，格琳达看着那头高大又毛茸茸的狮子。
        - id: ch01-b20
          speaker: glinda
          text: 多萝茜回家以后，你要去什么地方？
        - id: ch01-b21
          speaker: lion
          text: 锤头人的山那边，有一片古老又壮美的森林。那里的野兽已经推举我做国王。要是能回到森林，我就能在那里快活地过一辈子。
        - id: ch01-b22
          speaker: glinda
          text: 我的第三道命令，就是让飞猴送你回森林。三次命令用完以后，我会把金冠交给猴王。从此，它和伙伴们就永远自由了。
        - id: ch01-b23
          speaker: narrator
          text: 格琳达把三位伙伴将来的路都安排好了。稻草人、铁皮人和狮子听完，诚心诚意地感谢她这番好意。可是多萝茜还记着自己最要紧的事。
        - id: ch01-b24
          speaker: dorothy
          text: 你真的像你长得那么美一样善良！不过，你还没说我该怎么回堪萨斯呢。
        - id: ch01-b25
          speaker: glinda
          text: 你的银鞋能带你越过沙漠。你要是早知道它们有这种力量，来到奥兹国的第一天就能回到艾姆婶婶身边。
        - id: ch01-b26
          speaker: scarecrow
          text: 可那样的话，我哪能得到这副了不起的脑子！我大概会在农夫的玉米地里待上一辈子。
        - id: ch01-b27
          speaker: tin_woodman
          text: 我也不会得到这颗可爱的心。说不定我会站在森林里，一直生锈到世界末日。
        - id: ch01-b28
          speaker: lion
          text: 我更会永远是个胆小鬼。整座森林里，连一只肯夸我的野兽也不会有。
        - id: ch01-b29
          speaker: dorothy
          text: 你们说得对。能帮上这些好朋友，我很高兴。如今，大家都有了最想要的东西，还有自己的王国要治理，每个人都很幸福。现在，我也想回堪萨斯了。
        - id: ch01-b30
          speaker: glinda
          text: 银鞋的力量非常神奇。不管你想去世界上的哪个地方，它们三步就能送你到，而且每一步都只有眨眼那么快。把两只鞋跟碰三次，再告诉它们你要去哪儿，就够了。
        - id: ch01-b31
          speaker: dorothy
          text: 原来这么简单！那我现在就请它们送我回堪萨斯。
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: 多萝茜张开双臂搂住狮子的脖子，吻了他，又温柔地拍着他的大脑袋。她接着吻别铁皮人。铁皮人哭得泪水直流，怎么也停不下来。那些眼泪落在铁皮关节上，可实在太危险了。
        - id: ch01-b33
          speaker: narrator
          text: 到了稻草人面前，多萝茜没有去亲他那张涂画出来的脸。她把那个柔软的、塞满稻草的身子紧紧抱在怀里。一想到就要和这些亲爱的伙伴伤心地分别，她发现自己也哭了起来。
        - id: ch01-b34
          speaker: narrator
          text: 格琳达从红宝石宝座上走下来，吻别了多萝茜。多萝茜也感谢她帮助了自己和朋友们。
        - id: ch01-b35
          speaker: narrator
          text: 最后，多萝茜郑重地抱起托托。她向大家说完最后一声再见，把银鞋的鞋跟连碰三次。
        - id: ch01-b36
          speaker: dorothy
          text: 送我回艾姆婶婶家！
        - id: ch01-b37
          speaker: narrator
          text: 话刚出口，她立刻在空中飞旋起来。速度快得惊人，多萝茜什么也看不清，身体也感觉不到别的东西，只听见风从耳边呼啸而过。
        - id: ch01-b38
          speaker: narrator
          text: 银鞋总共只走了三步。接着，多萝茜猛地停下，在草地上翻滚了好几圈。等身子停住，她还不知道自己到了哪里。
        - id: ch01-b39
          speaker: narrator
          text: 过了一会儿，她坐起来，四处看了看。
        - id: ch01-b40
          speaker: dorothy
          text: 天哪！
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: 多萝茜正坐在辽阔的堪萨斯草原上。旋风卷走旧房子以后，亨利叔叔盖起的新农舍就在眼前。他正在牲口院里挤牛奶。托托早已跳出她的怀抱，朝牛棚飞跑过去，还一路大声叫着。
        - id: ch01-b42
          speaker: narrator
          text: 多萝茜站起来，才发现自己只穿着袜子。飞越天空的时候，银鞋从她脚上掉了下去，永远遗失在沙漠里。
