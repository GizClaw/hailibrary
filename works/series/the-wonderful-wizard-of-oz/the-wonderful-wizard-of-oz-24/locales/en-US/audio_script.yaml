  chapters:
    - id: ch01
      title: Glinda the Good Witch Grants Dorothy's Wish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Before going to see Glinda, the travelers were shown to a room in the castle so they could make themselves presentable. Dorothy washed her face and combed her hair. The Lion shook the dust from his mane. The Scarecrow patted his straw body into its best shape, while the Tin Woodman polished his tin and oiled every joint.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Once they were ready, they followed the Girl Soldier into a great room. Glinda sat there on a throne made of rubies. To them, the Witch looked both young and beautiful. Rich red curls flowed over her shoulders, and she wore a dress of pure white. Her blue eyes rested kindly on Dorothy.
        - id: ch01-b03
          speaker: glinda
          text: >-
            What may I do for you, my child?
        - id: ch01-b04
          speaker: narrator
          text: >-
            Dorothy told the Good Witch her whole story. She explained how the cyclone had carried her into the Land of Oz, how she had met each of her companions, and what wonderful adventures they had shared.
        - id: ch01-b05
          speaker: dorothy
          text: >-
            More than anything, I want to go home to Kansas. Aunt Em must think something terrible has happened to me. She'll put on mourning, and unless this year's crops are better than last year's, I'm sure Uncle Henry can't afford it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Glinda leaned forward and kissed the loving little girl's upturned face.
        - id: ch01-b07
          speaker: glinda
          text: >-
            Bless your dear heart. I know a way for you to return to Kansas. But if I tell you, you must give me the Golden Cap.
        - id: ch01-b08
          speaker: dorothy
          text: >-
            Gladly! It can't help me anymore, and with it, you can command the Winged Monkeys three times.
        - id: ch01-b09
          speaker: glinda
          text: >-
            And I believe I will need them exactly three times.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Glinda smiled, and Dorothy handed her the Golden Cap. Then the Witch turned to the Scarecrow.
        - id: ch01-b11
          speaker: glinda
          text: >-
            What will you do after Dorothy leaves us?
        - id: ch01-b12
          speaker: scarecrow
          text: >-
            I'll go back to the Emerald City. Oz made me its ruler, and the people there like me. I only worry about getting past the Hammer-Heads' hill.
        - id: ch01-b13
          speaker: glinda
          text: >-
            I will use the Golden Cap to order the Winged Monkeys to carry you straight to the gates of the Emerald City. It would be a shame for the people to lose such a wonderful ruler.
        - id: ch01-b14
          speaker: scarecrow
          text: >-
            Do you truly think I'm wonderful?
        - id: ch01-b15
          speaker: glinda
          text: >-
            I think you are unusual.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Next, Glinda turned to the Tin Woodman.
        - id: ch01-b17
          speaker: glinda
          text: >-
            And what will become of you once Dorothy has left this country?
        - id: ch01-b18
          speaker: narrator
          text: >-
            The Tin Woodman rested on his axe while he thought. After a moment, he answered.
        - id: ch01-b19
          speaker: tin_woodman
          text: >-
            The Winkies treated me very kindly. After the Wicked Witch died, they asked me to rule them. I've grown fond of the Winkies. If I could return to the Country of the West, nothing would please me more than ruling them for the rest of my life.
        - id: ch01-b20
          speaker: glinda
          text: >-
            Then my second order will be for the Winged Monkeys to carry you safely back to the Winkies. Your brain may not look as large as the Scarecrow's, but when you're well polished, you really are brighter than he is. I am certain you will rule the Winkies wisely and well.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Then Glinda looked toward the big, shaggy Lion.
        - id: ch01-b22
          speaker: glinda
          text: >-
            When Dorothy has gone home, what will you do?
        - id: ch01-b23
          speaker: cowardly_lion
          text: >-
            Beyond the Hammer-Heads' hill is a grand old forest. All the animals there chose me as their King. If only I could get back to that forest, I would spend the rest of my life there very happily.
        - id: ch01-b24
          speaker: glinda
          text: >-
            My third order will send the Winged Monkeys to carry you home to your forest. That will use all the magic in the Golden Cap. Then I'll give it to the Monkeys' King, so he and his band will be free forever.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The Scarecrow, the Tin Woodman, and the Lion thanked the Good Witch with all their hearts. Dorothy spoke up too.
        - id: ch01-b26
          speaker: dorothy
          text: >-
            You really are as good as you are beautiful! But you still haven't told me how I can get back to Kansas.
        - id: ch01-b27
          speaker: glinda
          text: >-
            Your Silver Shoes can carry you across the desert. If you had understood their power, you could have returned to Aunt Em on the very first day you came to Oz.
        - id: ch01-b28
          speaker: scarecrow
          text: >-
            But then I never would have gotten my wonderful brains! I might have spent my whole life standing in that farmer's cornfield.
        - id: ch01-b29
          speaker: tin_woodman
          text: >-
            And I would never have gotten my lovely heart. I might have stayed in the forest, rusting until the end of the world.
        - id: ch01-b30
          speaker: cowardly_lion
          text: >-
            And I would have been a coward forever. Not one animal in the forest would have had a kind word for me.
        - id: ch01-b31
          speaker: dorothy
          text: >-
            That's all true, and I'm glad I could help these dear friends. Now they each have what they wanted most, and each one has a kingdom that makes him happy. So I think it's time for me to go home to Kansas.
        - id: ch01-b32
          speaker: glinda
          text: >-
            The Silver Shoes have marvelous powers. Strangest of all, they can take you anywhere in the world in only three steps, and every step happens in the blink of an eye. Just knock the heels together three times. Then tell the shoes where you wish to go.
        - id: ch01-b33
          speaker: dorothy
          text: >-
            If they can do that, I'll ask them to take me straight back to Kansas!
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: >-
            Dorothy wrapped her arms around the Lion's neck. She kissed him and gently patted his great head. Then she kissed the Tin Woodman, who was crying so hard that his tears put his joints in danger. She did not kiss the Scarecrow's painted face. Instead, she held his soft, stuffed body tightly in her arms. Soon Dorothy was crying too. It was a sorrowful thing to part from the dear friends who had traveled beside her.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Glinda the Good came down from her ruby throne and kissed the little girl good-bye. Dorothy thanked the Witch for every kindness she had shown to Dorothy and her friends.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Then Dorothy lifted Toto solemnly into her arms. After one last good-bye, she knocked the heels of the Silver Shoes together three times and called out.
        - id: ch01-b37
          speaker: dorothy
          text: >-
            Take me home to Aunt Em!
        - id: ch01-b38
          speaker: narrator
          text: >-
            At once, Dorothy went spinning through the air. She flew so fast that she could see and feel nothing but the wind whistling past her ears.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The Silver Shoes took only three steps. Then Dorothy stopped with such a jolt that she tumbled over and over across the grass before she could tell where she was.
        - id: ch01-b40
          speaker: narrator
          text: >-
            At last, she sat up and looked around.
        - id: ch01-b41
          speaker: dorothy
          text: >-
            Good gracious!
          emotion: surprised
        - id: ch01-b42
          speaker: narrator
          text: >-
            Dorothy was sitting on the wide Kansas prairie. Right in front of her stood the new farmhouse Uncle Henry had built after the cyclone carried the old one away. Uncle Henry was in the barnyard milking the cows. Toto leaped from Dorothy's arms and raced toward the barn, barking as hard as he could.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dorothy rose and discovered that only her stockings covered her feet. The Silver Shoes had slipped off during her flight through the air. They were lost forever somewhere in the desert.
