audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    scarecrow:
      display_name: Scarecrow
      tts:
        delivery: friendly and guileless
        timbre: dry and husky
        pace: easy
        pitch: medium
    tin_woodman:
      display_name: Tin Woodman
      tts:
        delivery: courteous and earnest
        timbre: resonant and metallic
        pace: deliberate
        pitch: medium-low
    cowardly_lion:
      display_name: Cowardly Lion
      tts:
        delivery: hearty but uncertain
        timbre: deep and rumbling
        pace: natural
        pitch: low
    guardian_of_the_gates:
      display_name: Guardian of the Gates
      tts:
        delivery: watchful and proper
        timbre: crisp and mature
        pace: measured
        pitch: medium
    oz:
      display_name: Oz
      tts:
        delivery: theatrical but increasingly candid
        timbre: light and elderly
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Chapter XV The Discovery of Oz, the Terrible
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The four travelers reached the great gate of the Emerald City and
            rang the bell. They rang several times before the gate opened. It
            was the same Guardian of the Gates they had met before.
        - id: ch01-b02
          speaker: guardian_of_the_gates
          text: You're back? Already?
          emotion: surprised
        - id: ch01-b03
          speaker: scarecrow
          text: Can't you see that we're standing right here?
        - id: ch01-b04
          speaker: guardian_of_the_gates
          text: But I thought you went to see the Wicked Witch of the West.
        - id: ch01-b05
          speaker: scarecrow
          text: We did see her.
        - id: ch01-b06
          speaker: guardian_of_the_gates
          text: And she actually allowed you to leave?
          emotion: surprised
        - id: ch01-b07
          speaker: scarecrow
          text: She couldn't stop us. She melted.
        - id: ch01-b08
          speaker: guardian_of_the_gates
          text: Melted? That's wonderful news! Who did it?
          emotion: surprised
        - id: ch01-b09
          speaker: cowardly_lion
          text: Dorothy did.
        - id: ch01-b10
          speaker: guardian_of_the_gates
          text: Good gracious!
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            The Guardian bowed very low to Dorothy. Then he took them into his
            little room. Just as he had done on their first visit, he opened
            the great box, took out pairs of green spectacles, and locked one
            pair over each traveler's eyes. Then he led them through the gate
            and into the Emerald City. The people soon heard from the Guardian
            that Dorothy had melted the Wicked Witch of the West. They gathered
            around the travelers from every direction. Before long, a great
            crowd was following them all the way to the Palace of Oz.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The soldier with the green whiskers still guarded the palace
            door. He recognized the travelers and let them in at once. The
            beautiful green girl met them inside. She took each one back to
            the room they had stayed in before, so they could rest while they
            waited for the Great Oz to receive them.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The soldier sent word straight to Oz that Dorothy and her friends
            had returned after destroying the Wicked Witch. Oz gave no answer.
            The travelers expected him to call for them right away, but one
            day passed, and then another, and then another. Still, no message
            came from the Wizard at all.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They grew tired and angry. Oz had sent them into hardship and
            slavery, and after all they had suffered, he was treating them
            badly. At last, the Scarecrow asked the green girl to carry one
            more message. If Oz would not let them see him right away, they
            would summon the Winged Monkeys to help. With the Monkeys there,
            they would find out whether the Wizard meant to keep his promises.
        - id: ch01-b15
          speaker: narrator
          text: >-
            That frightened the Wizard. He had met the Winged Monkeys once in
            the Land of the West, and he had no wish to meet them again. He
            quickly sent word that the travelers could enter the Throne Room
            at four minutes after nine the next morning.
        - id: ch01-b16
          speaker: narrator
          text: >-
            None of the four travelers slept well that night. Each one kept
            thinking about the gift Oz had promised to give. Dorothy managed
            to fall asleep only once. Then she dreamed she was back home in
            Kansas. Aunt Em was there, telling Dorothy how glad she was to have
            her little girl home again.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At exactly nine the next morning, the green-whiskered soldier came
            for them. Four minutes later, the travelers entered the Great Oz's
            Throne Room.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Each expected to see the Wizard in the shape he had shown before.
            They looked all around, but the room was empty. They stayed close
            to the door and pressed even closer to one another. The silence in
            that empty room felt more frightening than any of the strange
            forms Oz had taken when he met them one by one.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Then a solemn voice sounded from somewhere near the top of the
            great dome.
        - id: ch01-b20
          speaker: oz
          text: I am Oz, the Great and Terrible. What do you want from me?
        - id: ch01-b21
          speaker: narrator
          text: They searched the room again, but there was still no one there.
        - id: ch01-b22
          speaker: dorothy
          text: Where are you?
        - id: ch01-b23
          speaker: oz
          text: >-
            I am everywhere, though ordinary people cannot see me. I will sit
            upon my throne now, so that we may speak.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The voice now seemed to come directly from the throne. The
            travelers approached it and stood together in a row.
        - id: ch01-b25
          speaker: dorothy
          text: We've come for what you promised us, Oz.
        - id: ch01-b26
          speaker: oz
          text: What did I promise?
        - id: ch01-b27
          speaker: dorothy
          text: >-
            You said you'd send me home to Kansas once the Wicked Witch was
            destroyed.
        - id: ch01-b28
          speaker: scarecrow
          text: You said you'd give me brains.
        - id: ch01-b29
          speaker: tin_woodman
          text: And you said you'd give me a heart.
        - id: ch01-b30
          speaker: cowardly_lion
          text: You promised me courage.
        - id: ch01-b31
          speaker: oz
          text: Is the Wicked Witch truly gone?
        - id: ch01-b32
          speaker: narrator
          text: Dorothy thought she heard a slight tremble in the voice.
        - id: ch01-b33
          speaker: dorothy
          text: Yes. I threw a bucket of water on her, and she melted.
        - id: ch01-b34
          speaker: oz
          text: >-
            Dear me! That happened so suddenly. Come back tomorrow. I need
            time to think.
          emotion: surprised
        - id: ch01-b35
          speaker: tin_woodman
          text: You've already had more than enough time.
          emotion: angry
        - id: ch01-b36
          speaker: scarecrow
          text: We're not waiting one more day.
        - id: ch01-b37
          speaker: dorothy
          text: You have to keep every promise you made us!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            The Lion decided a good fright might persuade the Wizard. He let
            out a huge roar, so fierce and loud that Toto jumped away from him
            in alarm. The little dog struck a screen that stood in one corner.
            It tipped over and crashed to the floor.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Everyone stared. Where the screen had stood, they saw a little old
            man with a bald head and a wrinkled face. He looked every bit as
            amazed as they did. They had expected a terrible Wizard, not this
            startled little man. The Tin Woodman raised his axe and rushed at
            him.
        - id: ch01-b40
          speaker: tin_woodman
          text: Who are you?
        - id: ch01-b41
          speaker: oz
          text: >-
            I'm Oz, the Great and Terrible! Please don't hit me. I'll do
            whatever you ask!
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: >-
            The friends stared at the little man. They were amazed to find him
            behind the screen, and dismayed that this trembling stranger might
            really be the great Wizard they had struggled so hard to reach.
        - id: ch01-b43
          speaker: dorothy
          text: But I saw Oz as a giant Head.
        - id: ch01-b44
          speaker: scarecrow
          text: I saw a beautiful Lady.
        - id: ch01-b45
          speaker: tin_woodman
          text: I saw a terrible Beast.
        - id: ch01-b46
          speaker: cowardly_lion
          text: And I saw a Ball of Fire!
        - id: ch01-b47
          speaker: oz
          text: You were all mistaken. I was only pretending.
        - id: ch01-b48
          speaker: dorothy
          text: Pretending? Then you're not a Great Wizard?
          emotion: surprised
        - id: ch01-b49
          speaker: oz
          text: >-
            Quiet, my dear. If anyone hears you, I'll be ruined. Everyone
            believes I'm a Great Wizard.
          emotion: fearful
        - id: ch01-b50
          speaker: dorothy
          text: But are you one?
        - id: ch01-b51
          speaker: oz
          text: Not at all, my dear. I'm only an ordinary man.
        - id: ch01-b52
          speaker: scarecrow
          text: You're worse than ordinary. You're a humbug.
          emotion: sad
        - id: ch01-b53
          speaker: oz
          text: Exactly! I am a humbug.
        - id: ch01-b54
          speaker: narrator
          text: The little man rubbed his hands together as if that pleased him.
        - id: ch01-b55
          speaker: tin_woodman
          text: This is terrible. How will I ever get my heart now?
          emotion: sad
        - id: ch01-b56
          speaker: cowardly_lion
          text: And what about my courage?
        - id: ch01-b57
          speaker: scarecrow
          text: What about my brains?
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Scarecrow's voice broke into a wail. Tears ran from his painted
            eyes, and he wiped them away with the sleeve of his coat.
        - id: ch01-b59
          speaker: oz
          text: >-
            My dear friends, don't worry about those little things. Think of
            me! I've been found out, and I'm in terrible trouble.
        - id: ch01-b60
          speaker: dorothy
          text: Does anybody else know you're a humbug?
        - id: ch01-b61
          speaker: oz
          text: >-
            No one but the four of you and me. I've fooled everyone for so
            long, I never thought anyone would discover me. Letting you into
            the Throne Room was a terrible mistake. I hardly ever meet even my
            own people. Because they never see me, they go on believing I must
            be something truly fearsome.
        - id: ch01-b62
          speaker: dorothy
          text: I still don't understand. How did you look like a giant Head?
        - id: ch01-b63
          speaker: oz
          text: That was one of my tricks. Come with me, and I'll show you.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Oz led them into a small room behind the Throne Room. In one
            corner lay the great Head. It was made from many layers of paper,
            pressed together to give it shape, and its face had been painted
            with great care.
        - id: ch01-b65
          speaker: oz
          text: >-
            I hung it from the ceiling on a wire. Then I hid behind the screen
            and pulled a thread to move its eyes and open its mouth.
        - id: ch01-b66
          speaker: dorothy
          text: Then how did the voice come from the Head?
        - id: ch01-b67
          speaker: oz
          text: >-
            I'm a ventriloquist. I can make my voice seem to come from any
            place I choose. That's why you heard the Head speaking. And here
            are the other things I used to fool you.
        - id: ch01-b68
          speaker: narrator
          text: >-
            He showed the Scarecrow the dress and mask that had made him look
            like the lovely Lady. The Tin Woodman's terrible Beast was only a
            collection of skins sewn together. Wooden slats inside held its
            sides out and gave it a fearsome shape. The false Wizard had also
            hung the Ball of Fire from the ceiling. That was really a ball of
            cotton. When he poured oil over it and lit it, the cotton burned
            fiercely.
        - id: ch01-b69
          speaker: scarecrow
          text: You should be ashamed of fooling everyone this way.
        - id: ch01-b70
          speaker: oz
          text: >-
            I am ashamed. Truly, I am. But I didn't know what else to do. Sit
            down. There are plenty of chairs, and I'll tell you my story.
          emotion: sad
        - id: ch01-b71
          speaker: narrator
          text: >-
            There were plenty of chairs in the little room, so the travelers
            sat down together. Then they listened as Oz began his tale.
        - id: ch01-b72
          speaker: oz
          text: I was born in Omaha.
        - id: ch01-b73
          speaker: dorothy
          text: Why, Omaha isn't very far from Kansas!
          emotion: surprised
        - id: ch01-b74
          speaker: oz
          text: >-
            No, but it's a long way from here. When I grew up, a great teacher
            trained me to be a ventriloquist. I learned to imitate every kind
            of bird and animal.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Oz mewed exactly like a kitten. Toto's ears pricked up, and he
            looked all around for the cat.
        - id: ch01-b76
          speaker: oz
          text: Later, I grew tired of that work and became a balloonist.
        - id: ch01-b77
          speaker: dorothy
          text: What's a balloonist?
        - id: ch01-b78
          speaker: oz
          text: >-
            On circus days, a balloonist goes up in a balloon to draw a crowd.
            Then the people pay to see the circus.
        - id: ch01-b79
          speaker: dorothy
          text: Oh, now I understand.
        - id: ch01-b80
          speaker: oz
          text: >-
            Well, I went up in a balloon one day, and the ropes became tangled.
            No matter what I did, I couldn't come down. The balloon kept rising
            until it was far above the clouds. Up there, a current of air
            caught it and swept it many, many miles away. I traveled through
            the sky for a whole day and a whole night. When I woke on the
            second morning, the balloon was floating over a country I had
            never seen before. It was strange and beautiful.
        - id: ch01-b81
          speaker: oz
          text: >-
            Little by little, the balloon came down, and I landed without being
            hurt at all. I found myself among a strange people. They had watched
            me descend from the clouds, so they decided I must be a powerful
            Wizard. Of course, I let them go on believing it. They were afraid
            of me, and they promised to do anything I wished.
        - id: ch01-b82
          speaker: oz
          text: >-
            To amuse myself and give those good people something to do, I told
            them to build this city and my palace. They gladly built both, and
            they did the work willingly and well. Since the country was so
            lovely and green, I decided to call the place the Emerald City.
            Then I made the name seem even more fitting. I put green spectacles
            on every person in the city, so everything they looked at appeared
            green.
        - id: ch01-b83
          speaker: dorothy
          text: You mean the things here aren't really green?
          emotion: surprised
        - id: ch01-b84
          speaker: oz
          text: >-
            They're no greener than things in any other city. Green spectacles
            naturally make everything you see look green. The city was built
            many years ago. I was still a young man when my balloon brought me
            here, and now I'm a very old man. My people have worn those green
            glasses for so many years that most of them truly believe this is
            an Emerald City made green through and through.
        - id: ch01-b85
          speaker: oz
          text: >-
            It is a beautiful place, though, full of jewels, precious metals,
            and every good thing people need to be happy. I've always treated
            my people well, and they like me. But from the time this palace was
            finished, I've kept myself shut inside. I wouldn't allow any of
            them to see me.
        - id: ch01-b86
          speaker: oz
          text: >-
            What frightened me most were the Witches. I had no magic at all,
            while they could do truly wonderful things. Four Witches ruled the
            people who lived in the North, South, East, and West. Luckily, the
            Witches of the North and South were good, and I knew they wouldn't
            harm me. But the Witches of the East and West were terribly wicked.
            If they hadn't believed I was more powerful than they were, they
            certainly would have destroyed me.
        - id: ch01-b87
          speaker: oz
          text: >-
            I lived in deadly fear of them for years. So you can imagine how
            pleased I was when I heard that your house had fallen on the Wicked
            Witch of the East. Then you came to me, and I saw a chance to be
            rid of the other wicked Witch. I was willing to promise anything
            if only you would destroy her. But now you've melted her, and I'm
            ashamed to admit that I cannot give you the things I promised.
          emotion: sad
        - id: ch01-b88
          speaker: dorothy
          text: I think you're a very bad man.
        - id: ch01-b89
          speaker: oz
          text: >-
            Oh, no, my dear. I'm a good man. But I have to admit I'm a very bad
            Wizard.
        - id: ch01-b90
          speaker: scarecrow
          text: Can't you give me any brains?
        - id: ch01-b91
          speaker: oz
          text: >-
            You don't need them. You're learning more every day. A baby has a
            brain, but a baby doesn't know much. Knowledge comes from
            experience, and the longer you live, the more experience you gain.
        - id: ch01-b92
          speaker: scarecrow
          text: >-
            That may be true. Even so, I'll be miserable unless you give me
            brains.
          emotion: sad
        - id: ch01-b93
          speaker: narrator
          text: The false Wizard studied the Scarecrow carefully and sighed.
        - id: ch01-b94
          speaker: oz
          text: >-
            As I told you, I'm not much of a magician. Still, come back
            tomorrow morning, and I'll fill your head with brains. I can't
            teach you how to use them. You'll have to work that out yourself.
        - id: ch01-b95
          speaker: scarecrow
          text: Thank you! I'll figure out how to use them. Just you wait!
          emotion: happy
        - id: ch01-b96
          speaker: cowardly_lion
          text: But what will you do about my courage?
        - id: ch01-b97
          speaker: oz
          text: >-
            I'm sure you already have plenty of courage. What you lack is
            confidence. Every living creature feels afraid when danger comes.
            No living thing can face danger without feeling fear. True courage
            means going forward to meet danger even while you're afraid. You
            have shown that kind of courage many times already.
        - id: ch01-b98
          speaker: cowardly_lion
          text: >-
            Maybe I have. I'm still afraid, though. I'll be miserable unless
            you give me the kind of courage that makes me forget my fear.
          emotion: sad
        - id: ch01-b99
          speaker: oz
          text: Very well. Tomorrow, I'll give you that kind of courage.
        - id: ch01-b100
          speaker: tin_woodman
          text: And my heart?
        - id: ch01-b101
          speaker: oz
          text: >-
            I think wanting a heart is a mistake. Hearts make most people
            unhappy. You're lucky not to have one, though you don't know it.
        - id: ch01-b102
          speaker: tin_woodman
          text: >-
            That's a matter of opinion. Give me a heart, and I'll bear all the
            unhappiness without complaining.
        - id: ch01-b103
          speaker: oz
          text: >-
            Very well. Come tomorrow, and you'll have a heart. I've pretended
            to be a Wizard for so many years that I may as well play the part a
            little longer.
        - id: ch01-b104
          speaker: dorothy
          text: Now, how will you send me back to Kansas?
        - id: ch01-b105
          speaker: oz
          text: >-
            We'll need to think about that. Give me two or three days, and I'll
            try to find some way to carry you safely across the desert. Until
            then, all of you will be my guests. As long as you live in the
            palace, my people will wait on you. They will obey even your
            smallest wish.
        - id: ch01-b106
          speaker: oz
          text: >-
            I ask only one thing in return for whatever help I can give. Keep
            my secret. You must not tell anyone that I'm a humbug.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The travelers agreed to tell no one what they had learned. Then
            they went back to their rooms, all of them in high spirits. Even
            Dorothy felt hopeful again. She now called Oz the Great and
            Terrible Humbug, but she believed he might still find a way to send
            her home to Kansas. If he could do that, she was willing to forgive
            him for everything.
