cover_prompt: |-
  A wordless cover scene on the yellow brick road shows Dorothy and her companions approaching the Emerald City across the original turn-of-the-century fairyland. Dorothy is a practical Kansas girl of about ten with brown braids, a blue-and-white checked cotton dress, plain sunbonnet, and silver shoes, designed from Baum's text rather than any film adaptation. Beside her walk a straw-stuffed Scarecrow in faded blue clothes, a jointed tin Woodman carrying an axe at rest, a large tawny Lion with a gentle face, and a small black terrier. Dorothy points toward distant green towers as the road bends through poppy fields, making the companions' shared forward journey the focal action. Use a low three-quarter view with the group in a strong readable line, monumental landscape depth, and broad calm sky above the city. Keep every costume, creature, and structure wholly original, child-friendly, and free from recognizable movie or commercial designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
