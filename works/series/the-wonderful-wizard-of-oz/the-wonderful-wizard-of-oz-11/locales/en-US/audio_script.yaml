  chapters:
    - id: ch01
      title: The Road Turns Green
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Cowardly Lion took a long time to wake. He had been lying among
            the poppies, breathing their deadly scent, for far too long. At
            last he opened his eyes and rolled off the truck. He was very glad
            to find that he was still alive.
        - id: ch01-b02
          speaker: cowardly_lion
          text: >-
            I ran as fast as I could, but those flowers were too strong for
            me. How did you ever get me out?
        - id: ch01-b03
          speaker: narrator
          text: >-
            He sat down with a great yawn while his friends told him about the
            field mice and how generously they had saved him from death. The
            Lion laughed.
        - id: ch01-b04
          speaker: cowardly_lion
          text: >-
            I've always thought I was so big and terrible. Then tiny flowers
            nearly killed me, and tiny mice saved my life! What a strange
            thing. Well, my friends, what should we do now?
        - id: ch01-b05
          speaker: dorothy
          text: >-
            We need to keep going until we find the yellow brick road again.
            Then we can follow it to the Emerald City.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Once the Lion felt rested and quite himself again, they all set
            out. They enjoyed the soft, fresh grass beneath their feet. Before
            long they found the yellow brick road and turned toward the
            Emerald City, where the Great Oz lived.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The road was smooth and well paved now, and the country around it
            was beautiful. The travelers were happy to leave the forest and
            all the dangers hidden in its gloomy shade far behind. Once again,
            fences appeared beside the road, but these fences were painted
            green. When they came to a little farmhouse where a farmer clearly
            lived, that house was painted green too.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They passed several more houses that afternoon. People came to
            their doors and stared as if they wanted to ask questions, but no
            one dared come closer or speak. They were all afraid of the great
            Lion walking with the travelers. Everyone they saw wore lovely
            emerald-green clothes. They also wore pointed hats shaped like the
            hats of the Munchkins.
        - id: ch01-b09
          speaker: dorothy
          text: >-
            This must be the Land of Oz. We must be getting close to the
            Emerald City now.
        - id: ch01-b10
          speaker: scarecrow
          text: >-
            I think so. Everything here is green, while blue was the favorite
            color in Munchkin Country. But these people aren't as friendly as
            the Munchkins. I'm afraid we may not find anywhere to spend the
            night.
        - id: ch01-b11
          speaker: dorothy
          text: >-
            I'd like to eat something besides fruit, and Toto must be almost
            starved. Let's stop at the next house and talk to the people.
        - id: ch01-b12
          speaker: narrator
          text: >-
            When they reached a good-sized farmhouse, Dorothy walked boldly to
            the door and knocked. A woman opened it only far enough to peek
            outside.
        - id: ch01-b13
          speaker: farm_woman
          text: >-
            What do you want, child? And why have you brought that enormous
            Lion with you?
        - id: ch01-b14
          speaker: dorothy
          text: >-
            We'd like to stay here tonight, if you'll let us. The Lion is our
            friend. He wouldn't hurt you for anything in the world.
        - id: ch01-b15
          speaker: farm_woman
          text: Is he tame?
        - id: ch01-b16
          speaker: narrator
          text: The woman opened the door a little wider.
        - id: ch01-b17
          speaker: dorothy
          text: >-
            Oh, yes. He's a great coward too. He'll be more frightened of you
            than you are of him.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The woman thought this over and took one more look at the Lion.
        - id: ch01-b19
          speaker: farm_woman
          text: >-
            If that's true, you may come in. I'll give you supper and a place
            to sleep.
    - id: ch02
      title: A Night at the Farmhouse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They all went inside. Two children lived there with the woman and
            a man who had hurt his leg. He lay on a couch in one corner. The
            whole family stared in amazement at such an unusual group of
            visitors. As the woman busied herself setting the table, the man
            spoke to them from the couch.
        - id: ch02-b02
          speaker: injured_man
          text: Where are all of you headed?
        - id: ch02-b03
          speaker: dorothy
          text: We're going to the Emerald City to meet the Great Oz.
        - id: ch02-b04
          speaker: injured_man
          text: Really? Are you certain Oz will agree to see you?
          emotion: surprised
        - id: ch02-b05
          speaker: dorothy
          text: Why wouldn't he?
        - id: ch02-b06
          speaker: injured_man
          text: >-
            People say he never allows anyone into his presence. I've visited
            the Emerald City many times. It's a beautiful, wonderful place,
            but I've never been allowed to see the Great Oz. I don't know a
            single living person who has ever seen him either.
        - id: ch02-b07
          speaker: scarecrow
          text: Doesn't he ever leave his palace?
        - id: ch02-b08
          speaker: injured_man
          text: >-
            Never. He stays in the great Throne Room day after day. Even the
            people who serve him never see him face to face.
        - id: ch02-b09
          speaker: dorothy
          text: Then what does he look like?
        - id: ch02-b10
          speaker: narrator
          text: The man considered the question.
        - id: ch02-b11
          speaker: injured_man
          text: >-
            That's hard to answer. Oz is a Great Wizard, so he can appear in
            any form he chooses. Some people say he looks like a bird. Others
            say he's an elephant or a cat. He may appear as a beautiful fairy,
            a brownie, or any other form that pleases him. But when he is in
            his own true form, no living person can tell you what the real Oz
            looks like.
        - id: ch02-b12
          speaker: dorothy
          text: >-
            How strange. Somehow, we still have to see him. Otherwise, this
            whole journey will have been for nothing.
        - id: ch02-b13
          speaker: injured_man
          text: Why do you want to meet the terrible Oz?
        - id: ch02-b14
          speaker: scarecrow
          text: I want him to give me some brains.
        - id: ch02-b15
          speaker: narrator
          text: The Scarecrow spoke eagerly.
        - id: ch02-b16
          speaker: injured_man
          text: >-
            Oh, Oz could manage that easily. He has more brains than he needs.
        - id: ch02-b17
          speaker: tin_woodman
          text: I want him to give me a heart.
        - id: ch02-b18
          speaker: injured_man
          text: >-
            That won't give him any trouble. Oz owns a large collection of
            hearts in every size and shape.
        - id: ch02-b19
          speaker: cowardly_lion
          text: I want him to give me courage.
        - id: ch02-b20
          speaker: injured_man
          text: >-
            Oz keeps a great pot of courage in his Throne Room. A golden plate
            covers it so the courage won't spill over. I'm sure he'll gladly
            give you some.
        - id: ch02-b21
          speaker: dorothy
          text: And I want him to send me home to Kansas.
        - id: ch02-b22
          speaker: injured_man
          text: Kansas? Where is that?
          emotion: surprised
        - id: ch02-b23
          speaker: dorothy
          text: >-
            I don't know. But Kansas is my home, and I know it must be
            somewhere.
          emotion: sad
        - id: ch02-b24
          speaker: injured_man
          text: >-
            I suppose it is. Well, Oz can do anything, so he should be able to
            find Kansas for you. First, though, you'll have to get him to see
            you. That will be difficult. The Great Wizard doesn't like
            visitors, and he usually gets his own way. But what about you,
            little dog? What do you want from Oz?
        - id: ch02-b25
          speaker: narrator
          text: >-
            Toto only wagged his tail. Strange as it may seem, he could not
            speak.
        - id: ch02-b26
          speaker: narrator
          text: >-
            Then the woman called everyone to supper. Dorothy sat at the table
            and happily ate delicious porridge, scrambled eggs, and a plate of
            fine white bread. She enjoyed every bite. The Lion tried some of
            the porridge, but he did not care for it at all.
        - id: ch02-b27
          speaker: cowardly_lion
          text: >-
            This porridge is made from oats. Oats are for horses, not lions.
        - id: ch02-b28
          speaker: narrator
          text: >-
            The Scarecrow and the Tin Woodman ate nothing at all. Toto tried a
            little of everything and was glad to have a good supper again.
        - id: ch02-b29
          speaker: narrator
          text: >-
            The woman gave Dorothy a bed, and Toto curled up beside her. The
            Lion guarded her door so no one would disturb her. All night long,
            the Scarecrow and the Tin Woodman stood quietly in a corner. Of
            course, neither of them could sleep.
    - id: ch03
      title: The Guardian of the Gates
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The next morning, the friends started on their way as soon as the
            sun came up. Before long, they saw a beautiful green glow in the
            sky directly ahead of them.
        - id: ch03-b02
          speaker: dorothy
          text: That must be the Emerald City.
        - id: ch03-b03
          speaker: narrator
          text: >-
            With every step, the green glow grew brighter. At last it seemed
            that the end of their journey was near. Still, afternoon had come
            before they reached the great wall around the City. The wall was
            high and thick, and its color was a brilliant green.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The yellow brick road ended at a huge gate. Emeralds covered it,
            sparkling so brightly in the sun that even the Scarecrow's painted
            eyes were dazzled.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Dorothy found a bell beside the gate and pressed its button. A
            silvery chime rang somewhere inside. Slowly, the enormous gate
            swung open. The travelers walked through and entered a tall room
            with a high, arched ceiling. Countless emeralds covered the walls
            and glittered all around them.
        - id: ch03-b06
          speaker: narrator
          text: >-
            A little man stood before them. He was about the size of a
            Munchkin, and he wore green from head to toe. Even his skin had a
            greenish color. Beside him sat a large green box.
        - id: ch03-b07
          speaker: guardian
          text: What do you want in the Emerald City?
        - id: ch03-b08
          speaker: dorothy
          text: We've come to see the Great Oz.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The little man was so astonished that he sat down to think about
            her answer. At last he shook his head, still puzzled.
        - id: ch03-b10
          speaker: guardian
          text: >-
            No one has asked me to see Oz in many years. He is powerful and
            terrible. If you've come with some silly, useless request and
            disturb the Great Wizard's wise thoughts, he may grow angry and
            destroy every one of you in an instant.
        - id: ch03-b11
          speaker: scarecrow
          text: >-
            Our request isn't silly or useless. It matters very much to us,
            and we've been told that Oz is a good Wizard.
        - id: ch03-b12
          speaker: guardian
          text: >-
            He is good, and he rules the Emerald City wisely. But if people
            come dishonestly or merely want to satisfy their curiosity, he can
            be terrifying. Very few people have ever dared to ask to see his
            face. I am the Guardian of the Gates. Since you insist on seeing
            the Great Oz, it is my duty to take you to his Palace. First,
            though, every one of you must put on the spectacles.
        - id: ch03-b13
          speaker: dorothy
          text: Why do we need them?
        - id: ch03-b14
          speaker: guardian
          text: >-
            Without spectacles, the brightness and glory of the Emerald City
            would blind you. Everyone who lives here wears them day and night.
            Each pair stays locked on because Oz ordered it when the City was
            first built. I carry the only key that can unlock them.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The Guardian opened the big green box. Inside were spectacles in
            every size and shape, and every pair had green lenses. He chose a
            pair that fit Dorothy and placed it over her eyes. Two golden bands
            fastened to the spectacles and went around the back of her head.
            He locked the bands together with a tiny key. That key hung from
            the end of a chain around his neck.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Dorothy could not have removed the spectacles even if she had
            wanted to. But she had no wish to be blinded by the Emerald City's
            glare, so she said nothing.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Next, the green man fitted spectacles onto the Scarecrow, the Tin
            Woodman, and the Lion. He even found a pair for little Toto. One by
            one, he fitted the green lenses over their eyes and locked every
            pair firmly in place with the little key from his chain.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Finally, the Guardian put on his own glasses and announced that he
            was ready to lead them to the Palace. He took a large golden key
            from a peg on the wall. With it, he unlocked and opened another
            gate.
        - id: ch03-b19
          speaker: narrator
          text: >-
            They followed him through the doorway and into the streets of the
            Emerald City.
