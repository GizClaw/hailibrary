audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    farm_woman:
      display_name: 农妇
      tts:
        delivery: 谨慎务实，消除戒心后显得热情
        timbre: 温厚朴实
        pace: 自然
        pitch: 中音
    farmer:
      display_name: 农夫
      tts:
        delivery: 见多识广，谈起奥兹时郑重而敬畏
        timbre: 沉稳温和
        pace: 从容
        pitch: 中低音
    gate_guardian:
      display_name: 守门人
      tts:
        delivery: 谨慎守礼，言及奥兹时庄严认真
        timbre: 清晰利落
        pace: 平稳
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十章　守门人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 胆小的狮子在罂粟花丛里躺了太久，吸进了许多致命的花香，所以迟迟没有醒来。过了好一阵，他才睁开眼，从车上滚到地面。发现自己竟然还活着，他真是高兴极了。
        - id: ch01-b02
          speaker: cowardly_lion
          text: 我已经使出全身力气往前跑了，可那些花实在太厉害，我还是倒下了。你们到底是怎么救我出来的？
        - id: ch01-b03
          speaker: narrator
          text: 狮子坐在地上，打着哈欠。伙伴们告诉他，田鼠怎样慷慨相助，把他从死亡边缘救了回来。听完以后，狮子哈哈大笑。
        - id: ch01-b04
          speaker: cowardly_lion
          text: 我一直觉得自己又高大又吓人。谁能想到，小小的花儿差点要了我的命，小小的老鼠却救了我！世上的事可真奇怪。伙伴们，接下来咱们怎么办？
        - id: ch01-b05
          speaker: dorothy
          text: 咱们继续往前走，先找到黄砖路，再顺着它一直走到翡翠城。
        - id: ch01-b06
          speaker: narrator
          text: 狮子已经歇够了，精神也完全恢复。大家重新出发，脚下是清新柔软的青草，走起来十分舒服。没过多久，他们就找到了黄砖路，又朝伟大的奥兹居住的翡翠城走去。
        - id: ch01-b07
          speaker: narrator
          text: 这一带的黄砖路平整又结实，砖块铺得整整齐齐，四周乡野也很美。他们终于把森林和幽暗林间遇到的种种危险都远远留在身后，个个心情轻快。路旁重新出现了围栏，不过这里的围栏都漆成绿色。他们经过一座农家小屋，一看便知道里面住着农人，连屋子也是绿的。整个下午，路边接连出现好几座这样的房子。
        - id: ch01-b08
          speaker: narrator
          text: 屋里的人有时会站到门口，好奇地望着他们，似乎很想问些什么。可是，那头大狮子实在叫人害怕，谁也不敢靠近，更没人开口。这里的人都穿着漂亮的翡翠绿衣裳，还戴着芒奇金人那样的尖顶帽。
        - id: ch01-b09
          speaker: dorothy
          text: 这儿一定是奥兹国。照这样看，我们离翡翠城肯定不远了。
        - id: ch01-b10
          speaker: scarecrow
          text: 没错。芒奇金人最喜欢蓝色，这里却到处都是绿色。不过，这里的人好像没那么友善。今晚恐怕没有人肯留我们过夜。
        - id: ch01-b11
          speaker: dorothy
          text: 我真想吃点水果以外的东西，托托也一定饿坏了。到下一户人家，咱们停下来问问吧。
        - id: ch01-b12
          speaker: narrator
          text: 前面出现一座颇大的农舍。多萝茜壮着胆子走到门边，敲了敲门。一个女人只把门开出一条缝，从里面探头张望。
        - id: ch01-b13
          speaker: farm_woman
          text: 孩子，你有什么事？那头大狮子为什么跟着你？
        - id: ch01-b14
          speaker: dorothy
          text: 您要是肯答应，我们想在这里住一晚。狮子是我的好朋友，也是我们的伙伴。他绝不会伤害您。
        - id: ch01-b15
          speaker: farm_woman
          text: 他已经驯服了吗？
        - id: ch01-b16
          speaker: narrator
          text: 女人听了，把门稍稍开大了一点。
        - id: ch01-b17
          speaker: dorothy
          text: 当然驯服了。而且他胆子特别小，见到您以后，他怕您准比您怕他更厉害。
        - id: ch01-b18
          speaker: narrator
          text: 女人又从门缝里瞧了瞧狮子，仔细想了一会儿。
        - id: ch01-b19
          speaker: farm_woman
          text: 既然是这样，你们都进来吧。我给你们准备晚饭，也找地方让你们睡觉。
        - id: ch01-b20
          speaker: narrator
          text: 大家进了屋。里面还有两个孩子，以及一个伤了腿、躺在墙角长榻上的男人。这家人从没见过如此古怪的一群客人，全都惊讶得不得了。女人忙着摆餐桌时，男人开口了。
        - id: ch01-b21
          speaker: farmer
          text: 你们这一大群，是要到哪儿去？
        - id: ch01-b22
          speaker: dorothy
          text: 我们要去翡翠城，拜见伟大的奥兹。
        - id: ch01-b23
          speaker: farmer
          text: 原来是这样！可是，你们真觉得奥兹会见你们吗？
          emotion: surprised
        - id: ch01-b24
          speaker: dorothy
          text: 他为什么不肯见我们？
        - id: ch01-b25
          speaker: farmer
          text: 大家都说，他从不让任何人走到自己面前。我去过翡翠城很多次，那地方又美丽又奇妙，可我从来没得到过奥兹的接见。我也没听说过有哪个活人见过他。
        - id: ch01-b26
          speaker: scarecrow
          text: 难道他一次也不出门？
        - id: ch01-b27
          speaker: farmer
          text: 一次也不出。他天天坐在宫殿那座宏伟的王座厅里。就连服侍他的人，也看不到他的真面目。
        - id: ch01-b28
          speaker: dorothy
          text: 那他到底长什么样？
        - id: ch01-b29
          speaker: farmer
          text: 这谁也说不清。奥兹是伟大的魔法师，想变成什么就能变成什么。有人看见的是鸟，有人看见的是大象，还有人说他像猫。他也会化成美丽的仙子、小精灵，或者别的任何模样。可奥兹自己的原形究竟是什么样，世上没有一个活人知道。
        - id: ch01-b30
          speaker: dorothy
          text: 真是奇怪。可我们无论如何都得设法见到他，不然这一路就全白走了。
        - id: ch01-b31
          speaker: farmer
          text: 那你们为什么非要见这位可怕的奥兹呢？
        - id: ch01-b32
          speaker: scarecrow
          text: 我想让他给我一些脑子。
        - id: ch01-b33
          speaker: farmer
          text: 这对奥兹再容易不过了。他的脑子多得自己都用不完。
        - id: ch01-b34
          speaker: tin_woodman
          text: 我想让他给我一颗心。
        - id: ch01-b35
          speaker: farmer
          text: 这也难不住他。奥兹收藏了很多颗心，大大小小、各种形状的都有。
        - id: ch01-b36
          speaker: cowardly_lion
          text: 我想请他给我勇气。
        - id: ch01-b37
          speaker: farmer
          text: 奥兹的王座厅里放着满满一大锅勇气。锅上还压着金盘子，免得里面的勇气漫出来。他一定乐意分给你一些。
        - id: ch01-b38
          speaker: dorothy
          text: 我想请他把我送回堪萨斯。
        - id: ch01-b39
          speaker: farmer
          text: 堪萨斯？那是什么地方？
          emotion: surprised
        - id: ch01-b40
          speaker: dorothy
          text: 我也不知道它在哪里。可那儿是我的家，我相信它一定就在什么地方。
          emotion: sad
        - id: ch01-b41
          speaker: farmer
          text: 那倒很可能。奥兹什么都做得到，我想他会替你找到堪萨斯。问题是，你们得先见到他，这可难了。伟大的魔法师不喜欢接见任何人，而且事情总得照他的意思来。
        - id: ch01-b42
          speaker: narrator
          text: 男人说着，把目光转向托托。
        - id: ch01-b43
          speaker: farmer
          text: 那么，你想向奥兹要什么？
        - id: ch01-b44
          speaker: narrator
          text: 托托只摇了摇尾巴。说来也怪，它偏偏不会说话。
        - id: ch01-b45
          speaker: narrator
          text: 这时，女人招呼大家吃饭。多萝茜围到桌边，吃了香喷喷的麦片粥、一盘炒鸡蛋，还有松软的白面包。这顿饭让她十分满足。狮子也尝了一点粥，却觉得不好吃。
        - id: ch01-b46
          speaker: cowardly_lion
          text: 这粥是燕麦做的。燕麦该给马吃，可不是狮子的食物。
        - id: ch01-b47
          speaker: narrator
          text: 稻草人和铁皮樵夫什么也没吃。托托倒是每样都尝了一点，能再吃上一顿丰盛的晚饭，它可高兴了。
        - id: ch01-b48
          speaker: narrator
          text: 晚上，女人给多萝茜安排了一张床，托托卧在她身边，狮子守在房门口，不让别人惊扰她。稻草人和铁皮樵夫安静地站在屋角。他们本来就不会睡觉，便在那里站了一整夜。
        - id: ch01-b49
          speaker: narrator
          text: 第二天，太阳才升起来，他们便重新上路。没走多远，正前方的天空中就出现了一道美丽的绿光。
        - id: ch01-b50
          speaker: dorothy
          text: 那一定就是翡翠城！
        - id: ch01-b51
          speaker: narrator
          text: 他们继续向前，天边的绿光越来越亮。这段漫长的旅程，似乎终于快走到尽头了。不过，直到下午，他们才抵达环绕翡翠城的高墙。那道墙又高又厚，闪着鲜亮的绿色。
        - id: ch01-b52
          speaker: narrator
          text: 黄砖路到了墙下便走完了。正前方立着一扇大门，门上镶满翡翠。阳光一照，宝石光芒四射，就连稻草人那双画上去的眼睛，也被晃得看不清东西。
        - id: ch01-b53
          speaker: narrator
          text: 门边有一只铃。多萝茜按下按钮，里面传来银铃般清脆的响声。大门随即慢慢打开。他们穿过门，走进一座高高的拱顶大厅。四面的墙壁上，无数翡翠闪闪发亮。
        - id: ch01-b54
          speaker: narrator
          text: 大厅里站着一个小个子男人，身量和芒奇金人差不多。他从头到脚都穿着绿色，甚至连皮肤也微微发绿。身旁还摆着一只绿色的大箱子。看到多萝茜和她那群模样各异的伙伴，他迎上来询问。
        - id: ch01-b55
          speaker: gate_guardian
          text: 你们来到翡翠城，想办什么事？
        - id: ch01-b56
          speaker: dorothy
          text: 我们是来拜见伟大的奥兹的。
        - id: ch01-b57
          speaker: narrator
          text: 这个请求完全出乎小个子男人的意料。他惊讶得坐了下来，困惑地摇了摇头，认认真真想了好一会儿。
        - id: ch01-b58
          speaker: gate_guardian
          text: 已经有很多年没人来找我，说要见奥兹了。他法力无边，又威严可畏。你们要是为了一件无聊透顶的傻事，跑来打扰伟大魔法师充满智慧的思考，他也许会动怒，一眨眼就把你们全毁掉。
        - id: ch01-b59
          speaker: scarecrow
          text: 我们的事一点也不愚蠢，更不是闲来无事。这件事非常重要。别人还告诉我们，奥兹是一位善良的魔法师。
        - id: ch01-b60
          speaker: gate_guardian
          text: 他的确善良，也把翡翠城治理得很好。可是，谁要是心怀不轨，或只是出于好奇来接近他，他就会变得非常可怕。所以，几乎没人敢提出要见他。我是这里的守门人。既然你们坚持拜见伟大的奥兹，我就得送你们到宫殿去。不过，你们必须先戴上眼镜。
        - id: ch01-b61
          speaker: dorothy
          text: 为什么一定要戴眼镜？
        - id: ch01-b62
          speaker: gate_guardian
          text: 因为翡翠城太明亮、太辉煌了。不戴眼镜，你们会被刺瞎双眼。就连城里的居民也得日夜戴着眼镜，而且每一副都要锁住。翡翠城刚建成时，奥兹就定下了这条规矩。能打开眼镜的钥匙，只有我这里有。
        - id: ch01-b63
          speaker: narrator
          text: 守门人打开大箱子，里面装满了各种大小、各种形状的眼镜，所有镜片都是绿色的。他仔细找出一副大小正合适的，替多萝茜戴好。眼镜两边各连着一条金带，绕过脑后，再用一把小钥匙锁在一起。那把钥匙就挂在守门人脖子上的链子末端。
        - id: ch01-b64
          speaker: narrator
          text: 现在，就算多萝茜想摘下眼镜，也办不到了。当然，她并不想让翡翠城的强光刺瞎眼睛，所以一句话也没说。
        - id: ch01-b65
          speaker: narrator
          text: 接下来，守门人给稻草人、铁皮樵夫和狮子都配好了眼镜，连小托托也戴上一副。他用那把钥匙，把每一副眼镜都锁得牢牢的。
        - id: ch01-b66
          speaker: narrator
          text: 守门人也戴好自己的眼镜，说可以带他们去宫殿了。他从墙上的木钉取下一把金色的大钥匙，打开另一扇门。多萝茜和伙伴们跟在他身后，跨过门槛，走进了翡翠城的街道。
