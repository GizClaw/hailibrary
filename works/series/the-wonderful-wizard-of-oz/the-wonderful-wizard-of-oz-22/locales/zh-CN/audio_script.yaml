audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    tiger:
      display_name: 老虎
      tts:
        delivery: 庄重恭敬，忧心中带着期盼
        timbre: 粗犷有力
        pace: 稍慢而清楚
        pitch: 低音
    bear:
      display_name: 熊
      tts:
        delivery: 诚恳有力，回应时坚定
        timbre: 厚重浑圆
        pace: 平稳
        pitch: 低音
    wolf:
      display_name: 狼
      tts:
        delivery: 警觉利落，回应时坚定
        timbre: 沙哑紧实
        pace: 稍快
        pitch: 中低音
    fox:
      display_name: 狐狸
      tts:
        delivery: 敏捷清楚，回应时坚定
        timbre: 轻巧明亮
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十一章　狮子成为百兽之王
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 伙伴们从瓷墙上下来，便走进了一片很不好走的地方。到处都是泥沼和湿地，又高又密的荒草把泥坑全遮住了。他们必须看准每一步，不然一脚就会陷进泥里，走起来实在很费力。大家小心地挑着落脚处，终于平安走到了硬实的地面上。
        - id: ch01-b02
          speaker: narrator
          text: 可到了硬实的地面，他们才发现这里比刚才还要荒凉。他们在乱蓬蓬的灌木丛里走了很久，个个累得够呛，才来到另一片森林。这里的树又高大又古老，比他们从前见过的任何树都更有年头。
        - id: ch01-b03
          speaker: cowardly_lion
          text: 这片森林可真好啊！我从来没见过这么美的地方。
          emotion: happy
        - id: ch01-b04
          speaker: scarecrow
          text: 我怎么觉得这里阴森森的。
        - id: ch01-b05
          speaker: cowardly_lion
          text: 哪里阴森了？我真想一辈子住在这儿。踩踩脚下的枯叶，多软啊。再看看这些老树上的苔藓，又浓又绿。野兽还能找到比这儿更舒服的家吗？
        - id: ch01-b06
          speaker: dorothy
          text: 没准这里已经住着野兽了。
        - id: ch01-b07
          speaker: cowardly_lion
          text: 我想也是，可我现在一头也没瞧见。
        - id: ch01-b08
          speaker: narrator
          text: 他们继续往森林深处走，一直走到四周黑得看不清路。多萝茜、托托和狮子只好躺下睡觉。稻草人和铁皮樵夫还和往常一样，留在旁边守着他们。
        - id: ch01-b09
          speaker: narrator
          text: 第二天一早，他们又上路了。没过多久，前方传来低沉的隆隆声，听起来像一大群野兽在一起咆哮。托托轻轻呜咽了几声，伙伴们却都不害怕。他们沿着一条踩得很实的小路继续走，来到了林间空地。
        - id: ch01-b10
          speaker: narrator
          text: 空地上聚集着几百头野兽。老虎、大象、熊、狼、狐狸，还有博物书里提到的各种动物，全都来了。多萝茜刚看见时有点害怕。狮子告诉她，动物们正在开会。听那一阵阵吼叫和咆哮，它们准是碰上了天大的麻烦。
        - id: ch01-b11
          speaker: narrator
          text: 正说着，几头野兽发现了狮子。庞大的兽群一下子安静下来，就像中了魔法。最大的一头老虎走上前，向狮子躬身行礼。
        - id: ch01-b12
          speaker: tiger
          text: 百兽之王，欢迎您！您来得太及时了。请打败我们的敌人，让森林里的动物重新过上安宁的日子吧。
        - id: ch01-b13
          speaker: cowardly_lion
          text: 你们到底遇上了什么麻烦？
        - id: ch01-b14
          speaker: tiger
          text: 最近，森林里闯进来一个凶恶的敌人，我们谁都逃不过它的威胁。那怪物长得像一只巨蛛，身子跟大象一样大，八条腿每一条都有树干那么长。它在林子里爬行时，会用一条腿抓住动物，拖到嘴边，再像蜘蛛吃苍蝇那样吃掉。只要它还活着，我们就谁也别想安全。今天大家聚在这里，本来是要商量怎样保住性命，没想到您正好来了。
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 狮子沉思了片刻。
        - id: ch01-b16
          speaker: cowardly_lion
          text: 这片森林里，还有别的狮子吗？
        - id: ch01-b17
          speaker: tiger
          text: 已经没有了。从前有过几头，可全让怪物吃掉了。再说，它们没有一头像您这么高大，这么勇敢。
        - id: ch01-b18
          speaker: cowardly_lion
          text: 要是我除掉了你们的敌人，你们愿意奉我为森林之王，向我俯首，听从我的命令吗？
        - id: ch01-b19
          speaker: tiger
          text: 我们当然愿意！
        - id: ch01-b20
          speakers: [tiger, bear, wolf, fox]
          ensemble: chorus
          text: 我们愿意！
        - id: ch01-b21
          speaker: cowardly_lion
          text: 那只巨蛛现在在哪儿？
        - id: ch01-b22
          speaker: tiger
          text: 就在那边的橡树林里。
        - id: ch01-b23
          speaker: narrator
          text: 老虎抬起一只前爪，朝那边指去。
        - id: ch01-b24
          speaker: cowardly_lion
          text: 请你们照看好我的朋友。我现在就去和怪物决斗。
        - id: ch01-b25
          speaker: narrator
          text: 狮子向伙伴们道别，随后昂首阔步地去迎战敌人。
        - id: ch01-b26
          speaker: narrator
          text: 狮子找到巨蛛时，怪物正睡得很沉。它丑得让狮子厌恶地皱起了鼻子。那些腿果然像老虎说的一样长。肥硕的身子上满是粗硬的黑毛，一张血盆大口里还排着一英尺长的尖牙。
        - id: ch01-b27
          speaker: narrator
          text: 不过，巨蛛的脑袋和胖大的身子之间，只连着一条细得像黄蜂腰肢的脖子。狮子一看就知道该从哪儿下手。他明白，趁怪物睡着进攻，比等它醒来容易得多。狮子猛地跃起，正落在怪物背上，接着挥出长满利爪的沉重前掌。只打了一下，巨蛛的脑袋就和身子分开了。
        - id: ch01-b28
          speaker: narrator
          text: 狮子跳回地面，站在旁边盯着怪物。等那些长腿终于不再抽动，他才确定巨蛛已经死透了。
        - id: ch01-b29
          speaker: narrator
          text: 狮子回到林间空地。所有野兽都守在空地上，等着他回来。他骄傲地站到大家面前。
        - id: ch01-b30
          speaker: cowardly_lion
          text: 以后，你们再也不必害怕那个敌人了。
        - id: ch01-b31
          speaker: narrator
          text: 野兽们全都向狮子俯首，奉他为王。狮子答应大家，等多萝茜平安踏上返回堪萨斯的路，他就回来统治这片森林。
