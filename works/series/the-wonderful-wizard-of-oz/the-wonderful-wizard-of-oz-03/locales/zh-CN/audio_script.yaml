audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 天真坦率，惊讶与担忧都自然流露
        timbre: 清亮稚嫩
        pace: 自然
        pitch: 中高音
    witch_of_the_north:
      display_name: 北方女巫
      tts:
        delivery: 慈祥笃定，带着古老魔法的神秘感
        timbre: 轻柔苍老
        pace: 从容
        pitch: 中高音
    munchkin_1:
      display_name: 第一个芒奇金人
      tts:
        delivery: 朴实谨慎，语气诚恳
        timbre: 明亮成熟
        pace: 平稳
        pitch: 中音
    munchkin_2:
      display_name: 第二个芒奇金人
      tts:
        delivery: 直率认真，说话简洁
        timbre: 清晰成熟
        pace: 平稳
        pitch: 中音
    munchkin_3:
      display_name: 第三个芒奇金人
      tts:
        delivery: 谨慎郑重，谈到危险时语气沉重
        timbre: 温厚成熟
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　与芒奇金人的商议
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一阵突如其来的猛烈震动，把多萝茜从梦中惊醒。幸亏她躺在柔软的床上，才没有受伤。她还是被震得倒吸一口气，弄不清发生了什么。托托把冰凉的小鼻子贴到她脸上，伤心地呜呜叫着。多萝茜坐起来一看，房子已经不动了。屋里也不黑，灿烂的阳光正从窗口涌进来。她一下跳下床，带着紧跟不放的托托，跑过去打开了门。
        - id: ch01-b02
          speaker: narrator
          text: >-
            门外的一切太奇妙了。小姑娘惊叫一声，四下张望，眼睛睁得越来越大。旋风已经把房子放在一个美丽得出奇的国度里。以旋风来说，这回放得还真算轻。四周是一片片可爱的绿草地，挺拔的大树上挂满鲜美多汁的果子。一丛丛绚丽的花开得到处都是，羽毛鲜艳而少见的鸟儿在树木和灌丛间飞来飞去，唱个不停。不远处还有一条小溪，在青翠的河岸间奔流，水面闪闪发亮。多萝茜在干旱灰暗的大草原上生活了那么久，如今听见潺潺水声，只觉得说不出的悦耳。
        - id: ch01-b03
          speaker: narrator
          text: >-
            她正看得入神，忽然发现一群人朝这里走来。这些人古怪极了。他们不像多萝茜见惯的成年人那么高，可也不算很矮，大约只和她一般高。多萝茜在同龄孩子中，本来就长得相当高。不过从相貌上看，他们全都比她年长许多。
        - id: ch01-b04
          speaker: narrator
          text: >-
            来的是三个男人和一个女人，人人都穿得很奇特。他们戴着圆帽，尖尖的帽顶足有一英尺高，帽檐四周挂着一圈小铃铛。每走一步，铃铛就悦耳地叮当作响。三个男人的帽子是蓝色的，身上的衣服也是同样的蓝色。他们脚穿擦得锃亮的靴子，靴筒上翻着宽宽的蓝边。小个子女人戴一顶白帽子，白袍从肩头垂下许多褶子，上面洒满小星星，在阳光里亮得像钻石。
        - id: ch01-b05
          speaker: narrator
          text: >-
            多萝茜看着那三个男人，觉得他们大概和亨利叔叔年纪相仿，因为其中两个留着胡子。那个小个子女人一定更老。她满脸皱纹，头发几乎全白，走起路来身子也有些僵硬。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他们走到房子附近，看到多萝茜站在门口，便停下来低声商量，好像不敢再靠近。只有那个小老太太走上前，对多萝茜深深鞠了一躬。
        - id: ch01-b07
          speaker: witch_of_the_north
          text: 尊贵的女魔法师，欢迎您来到芒奇金人的国度。您杀死东方恶女巫，救我们的人民脱离了奴役。我们真不知道该怎样感谢您才好。
        - id: ch01-b08
          speaker: narrator
          text: >-
            小老太太的声音很甜美，多萝茜却听得目瞪口呆。她为什么把自己叫作女魔法师？又为什么说自己杀了东方恶女巫？多萝茜只是个天真善良的小姑娘，被旋风带到了离家很远的地方。她一生中从没杀过任何东西。
        - id: ch01-b09
          speaker: narrator
          text: 小老太太还在等她回答，多萝茜只好迟疑着开口。
        - id: ch01-b10
          speaker: dorothy
          text: 您对我太客气了。可是，这里面一定弄错了什么。我什么也没杀过呀。
        - id: ch01-b11
          speaker: witch_of_the_north
          text: 反正是你的房子杀了她，这不是一样吗？你看房角那边，她的两只脚还从大木头下面伸着呢。
        - id: ch01-b12
          speaker: narrator
          text: >-
            小老太太笑着指向房角。多萝茜转头看去，吓得轻叫起来。房子压着的那根大横梁下面，果真伸出两只脚，脚上还穿着尖头银鞋。
        - id: ch01-b13
          speaker: dorothy
          text: 哎呀，哎呀！房子准是砸到她身上了。我们现在该怎么办？
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: 多萝茜惊慌地把两只手紧紧握在一起。小老太太却很平静。
        - id: ch01-b15
          speaker: witch_of_the_north
          text: 什么也不用办。
          emotion: calm
        - id: ch01-b16
          speaker: dorothy
          text: 可她到底是谁？
        - id: ch01-b17
          speaker: witch_of_the_north
          text: 我已经说过了，她就是东方恶女巫。这么多年来，她奴役着所有芒奇金人，逼他们白天黑夜替她干活。现在大家终于自由了，所以才这样感激你。
        - id: ch01-b18
          speaker: dorothy
          text: 芒奇金人是什么人？
        - id: ch01-b19
          speaker: witch_of_the_north
          text: 他们住在东方这片土地上，从前一直受那个恶女巫统治。
        - id: ch01-b20
          speaker: dorothy
          text: 那您也是芒奇金人吗？
        - id: ch01-b21
          speaker: witch_of_the_north
          text: >-
            不是。我住在北方，不过我是他们的朋友。芒奇金人发现东方女巫死了，就派了一个跑得飞快的信使来找我。我立刻赶到这里，因为我就是北方女巫。
        - id: ch01-b22
          speaker: dorothy
          text: 天哪！您真是一个女巫？
          emotion: surprised
        - id: ch01-b23
          speaker: witch_of_the_north
          text: >-
            当然。不过我是个好女巫，这里的人民都爱我。我的法力没有统治这里的恶女巫那么强。要不然，我早就亲手解救大家了。
        - id: ch01-b24
          speaker: narrator
          text: 多萝茜面对着一个真正的女巫，心里有点害怕。
        - id: ch01-b25
          speaker: dorothy
          text: 可我还以为，女巫全都是坏的呢。
        - id: ch01-b26
          speaker: witch_of_the_north
          text: >-
            不，那可完全错了。整个奥兹国只有四个女巫。住在北方和南方的两个都是好女巫。我自己就是其中一个，当然不会弄错。住在东方和西方的两个才是恶女巫。现在你杀死了东方的那个，奥兹国就只剩下一个恶女巫了，她住在西方。
        - id: ch01-b27
          speaker: narrator
          text: 多萝茜想了一会儿。
        - id: ch01-b28
          speaker: dorothy
          text: 可是艾姆婶婶说，所有女巫早在好多好多年前就已经死光了。
        - id: ch01-b29
          speaker: witch_of_the_north
          text: 艾姆婶婶是谁？
        - id: ch01-b30
          speaker: dorothy
          text: 她是我的婶婶，和我一起住在堪萨斯。我就是从那里来的。
        - id: ch01-b31
          speaker: narrator
          text: 北方女巫低下头，望着地面想了好一阵，才重新抬起头。
        - id: ch01-b32
          speaker: witch_of_the_north
          text: 我不知道堪萨斯在哪里，也从来没听人说起过那个地方。不过，你告诉我，堪萨斯是文明的国度吗？
        - id: ch01-b33
          speaker: dorothy
          text: 当然是呀。
        - id: ch01-b34
          speaker: witch_of_the_north
          text: >-
            那就难怪了。我想，文明的国度里已经没有女巫、男巫、女魔法师和魔法师。可是奥兹国和世上其他地方完全隔绝，从来没有开化过。所以，我们这里还住着女巫和男巫。
        - id: ch01-b35
          speaker: dorothy
          text: 那男巫是谁？
        - id: ch01-b36
          speaker: witch_of_the_north
          text: 奥兹本人就是大男巫。他的法力，比我们所有人加起来还要强。他住在翡翠城。
        - id: ch01-b37
          speaker: narrator
          text: >-
            说到奥兹，北方女巫把声音压得只剩耳语。多萝茜还想再问，三个一直静静站在旁边的芒奇金人却忽然大叫起来。他们一齐指向房角，东方恶女巫原来就躺在那里。
        - id: ch01-b38
          speaker: witch_of_the_north
          text: 出什么事了？
        - id: ch01-b39
          speaker: narrator
          text: >-
            小老太太回头一看，笑出了声。死去女巫的两只脚已经不见了，地上只剩那双银鞋。
        - id: ch01-b40
          speaker: witch_of_the_north
          text: >-
            她实在太老，太阳一晒，很快就干枯消散了。这回，她算是彻底完了。那双银鞋现在归你，你应该穿上它们。
        - id: ch01-b41
          speaker: narrator
          text: 北方女巫弯腰捡起银鞋，把里面的尘土抖干净，交给多萝茜。
        - id: ch01-b42
          speaker: munchkin_1
          text: 东方女巫一直为这双银鞋感到骄傲。鞋上有某种魔力，可我们谁也不知道那是什么。
        - id: ch01-b43
          speaker: narrator
          text: 多萝茜把银鞋拿进屋，放到桌上，又回到芒奇金人面前。
        - id: ch01-b44
          speaker: dorothy
          text: 我真想回到叔叔婶婶身边。他们现在一定很担心我。你们能不能帮我找到回家的路？
        - id: ch01-b45
          speaker: narrator
          text: 芒奇金人和女巫先互相看看，又望向多萝茜，最后都摇了摇头。
        - id: ch01-b46
          speaker: munchkin_1
          text: 从这里往东不远，就是一片大沙漠。没有人能活着穿过去。
        - id: ch01-b47
          speaker: munchkin_2
          text: 南边也是这样。我亲自去过，也亲眼见过。南方是奎德林人的国度。
        - id: ch01-b48
          speaker: munchkin_3
          text: >-
            听说西边也有同样的沙漠。那里住着温基人，统治他们的是西方恶女巫。你要从她的地盘经过，她一定会把你抓去当奴隶。
        - id: ch01-b49
          speaker: witch_of_the_north
          text: >-
            我的家在北方，可北方边境也有那片大沙漠。它把整个奥兹国都围住了。亲爱的，恐怕你只能留下来，和我们一起生活。
        - id: ch01-b50
          speaker: narrator
          text: >-
            多萝茜听完便抽泣起来。周围全是陌生人，她觉得自己孤单极了。善良的芒奇金人见她落泪，也难过起来。他们马上掏出手帕，陪着她一起哭。小老太太却摘下帽子，把尖尖的帽顶稳稳立在鼻尖上，然后用庄严的声音数了起来。
        - id: ch01-b51
          speaker: witch_of_the_north
          text: 一、二、三。
        - id: ch01-b52
          speaker: narrator
          text: >-
            帽子一下变成了一块石板，上面用白粉笔写着几个大字。那几个字说的是，让多萝茜去翡翠城。小老太太从鼻尖上取下石板，读完以后问她。
        - id: ch01-b53
          speaker: witch_of_the_north
          text: 亲爱的，你的名字是多萝茜吗？
        - id: ch01-b54
          speaker: narrator
          text: 孩子抬起头，擦掉眼泪。
        - id: ch01-b55
          speaker: dorothy
          text: 是的。
        - id: ch01-b56
          speaker: witch_of_the_north
          text: 那你一定要去翡翠城。也许奥兹能帮你。
        - id: ch01-b57
          speaker: dorothy
          text: 那座城在哪儿？
        - id: ch01-b58
          speaker: witch_of_the_north
          text: 就在这个国度正中央，由我刚才说过的大男巫奥兹统治。
        - id: ch01-b59
          speaker: dorothy
          text: 他是个好人吗？
        - id: ch01-b60
          speaker: narrator
          text: 多萝茜问得有些不安。
        - id: ch01-b61
          speaker: witch_of_the_north
          text: 他是个好男巫。不过他究竟是不是人，我可不知道，因为我从来没有见过他。
        - id: ch01-b62
          speaker: dorothy
          text: 那我要怎么走到那里？
        - id: ch01-b63
          speaker: witch_of_the_north
          text: >-
            你得一步一步走过去。这趟路很远，有些地方很美，有些地方却又黑暗又可怕。不过，我会用尽自己知道的法术，让你不受伤害。
        - id: ch01-b64
          speaker: narrator
          text: 多萝茜已经把小老太太当作自己唯一的朋友，便开口央求她。
        - id: ch01-b65
          speaker: dorothy
          text: 您不能陪我一起走吗？
        - id: ch01-b66
          speaker: witch_of_the_north
          text: >-
            不行，我不能陪你去。不过我会送你一个吻。只要谁受过北方女巫的吻，就再也没人敢伤害她。
        - id: ch01-b67
          speaker: narrator
          text: >-
            她走近多萝茜，轻轻吻了吻小姑娘的额头。嘴唇碰过的地方留下一个闪闪发亮的圆印，不过多萝茜过了一阵才发现那个印记。
        - id: ch01-b68
          speaker: witch_of_the_north
          text: >-
            去翡翠城的路铺着黄砖，你不会走错。等你见到奥兹，别怕他。把自己的经历告诉他，请他帮你。再见了，亲爱的。
        - id: ch01-b69
          speaker: narrator
          text: >-
            三个芒奇金人朝多萝茜深深鞠了一躬，祝她一路顺风，随后穿过树林离开了。北方女巫也亲切地点点头，用左脚跟原地转了三圈，眨眼间就消失不见。托托惊讶得不得了。女巫在的时候，它连低吼都不敢。等她一走，托托才冲着她消失的地方放声大叫。
        - id: ch01-b70
          speaker: narrator
          text: 多萝茜倒一点也不吃惊。她知道那是个女巫，早就料到女巫会用这样的方式消失。
