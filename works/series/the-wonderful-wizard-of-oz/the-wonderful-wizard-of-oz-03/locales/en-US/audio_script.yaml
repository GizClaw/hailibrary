  chapters:
    - id: ch01
      title: A Beautiful New Country
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A sudden, terrible shock woke Dorothy. If she had not been lying on
            the soft bed, she might have been hurt. The jolt made her catch her
            breath. For a moment, she could only wonder what had happened and what
            the house had struck. Toto pushed his cold little nose against her
            face and gave a long, miserable whine.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Dorothy sat up. The house had stopped moving, and the room was no
            longer dark. Bright sunlight poured through the window. She jumped
            from the bed, ran to the door with Toto at her heels, and opened it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Dorothy cried out in amazement. She stared around her, and her eyes
            grew wider and wider at everything she saw. Each way she turned, there
            was another strange and wonderful sight.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The cyclone had set the house down quite gently, at least for a
            cyclone. It stood in the middle of a wonderfully beautiful country.
            Green lawns spread around stately trees heavy with ripe fruit. Banks
            of brilliant flowers bloomed on every side. Birds with rare, dazzling
            feathers sang and fluttered among the trees and bushes. Nothing here
            looked like the bare country Dorothy had left behind.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Not far away, a little brook sparkled and hurried between green banks.
            Its soft murmur was a lovely sound to a girl who had lived so long on
            the dry, gray prairies.
        - id: ch01-b06
          speaker: narrator
          text: >-
            As Dorothy eagerly took in the strange sights, she noticed four very
            unusual people coming toward her. They were smaller than the grown-ups
            she knew, but they were not tiny. They stood about as tall as Dorothy,
            who was a well-grown child for her age. Still, their faces looked many
            years older than hers.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Three were men, and one was a woman. All four wore odd clothes. Their
            round hats rose to points a foot above their heads, and little bells
            around the brims chimed as they walked. The men's hats and clothes
            were blue. Their polished boots had thick blue rolls at the tops.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The woman's pointed hat was white. Her white gown fell in folds from
            her shoulders and was scattered with little stars that flashed like
            diamonds in the sun. Two of the men had beards, and Dorothy thought
            they looked about as old as Uncle Henry. The woman seemed much older.
            Wrinkles covered her face, her hair was almost white, and she moved
            with a stiff little walk.
        - id: ch01-b09
          speaker: narrator
          text: >-
            When they reached the house, they stopped near the doorway and
            whispered together. They seemed afraid to come any closer. Then the
            little old woman stepped forward, bowed low to Dorothy, and spoke in a
            sweet voice.
        - id: ch01-b10
          speaker: witch_of_the_north
          text: >-
            Welcome to the land of the Munchkins, noble Sorceress. We are deeply
            grateful. You killed the Wicked Witch of the East and freed our people
            from her rule.
    - id: ch02
      title: The Witch of the North
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Dorothy could hardly believe what she was hearing. Why did this woman
            call her a sorceress? How could she have killed the Wicked Witch of the
            East? Dorothy was only a harmless little girl whom a cyclone had
            carried far from home. She had never killed anything in her life.
            Still, the woman was waiting for an answer.
        - id: ch02-b02
          speaker: dorothy
          text: >-
            That's very kind of you, but you must be mistaken. I haven't killed
            anything.
        - id: ch02-b03
          speaker: witch_of_the_north
          text: >-
            Maybe you didn't, but your house did, and that comes to the same thing.
            Look at the corner over there. You can still see her two feet sticking
            out from under that great wooden beam.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The old woman laughed and pointed toward one corner of the house.
            Dorothy looked. Two feet really were sticking out beneath the huge
            beam that supported the house. They wore silver shoes with pointed
            toes. Dorothy gave a frightened little cry and clasped her hands.
        - id: ch02-b05
          speaker: dorothy
          text: >-
            Oh, dear! The house must have landed on her. What can we possibly do?
          emotion: fearful
        - id: ch02-b06
          speaker: witch_of_the_north
          text: There is nothing we can do now.
          emotion: calm
        - id: ch02-b07
          speaker: dorothy
          text: But who was she?
        - id: ch02-b08
          speaker: witch_of_the_north
          text: >-
            She was the Wicked Witch of the East. She kept every Munchkin in this
            land under her power for years and forced them to work for her day and
            night. Now her power is gone. They are all free, and they are grateful
            to you for what you have done.
        - id: ch02-b09
          speaker: dorothy
          text: Who are the Munchkins?
        - id: ch02-b10
          speaker: witch_of_the_north
          text: >-
            They are the people who live here in the eastern land, where the
            Wicked Witch ruled.
        - id: ch02-b11
          speaker: dorothy
          text: Are you a Munchkin, too?
        - id: ch02-b12
          speaker: witch_of_the_north
          text: >-
            No. I live in the North, but I am their friend. As soon as the
            Munchkins saw that the Witch of the East was dead, they sent a fast
            messenger to find me. I came here as quickly as I could. I am the Witch
            of the North.
        - id: ch02-b13
          speaker: dorothy
          text: Oh! Are you truly a witch?
          emotion: surprised
        - id: ch02-b14
          speaker: witch_of_the_north
          text: >-
            I certainly am. But I'm a good witch, and the people love me. I am not
            as powerful as the witch who ruled this place. If I were, I would have
            freed the Munchkins myself.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Standing before a real witch made Dorothy a little afraid.
        - id: ch02-b16
          speaker: dorothy
          text: I thought every witch was wicked.
        - id: ch02-b17
          speaker: witch_of_the_north
          text: >-
            Oh, no. That's a great mistake. There were only four witches in all
            the Land of Oz. The witches in the North and the South are good. I
            ought to know, since I am one of them. The witches in the East and the
            West truly were wicked. But now you have killed the one in the East.
            That leaves only one Wicked Witch in all of Oz, and she lives in the
            West.
        - id: ch02-b18
          speaker: narrator
          text: Dorothy thought for a moment.
        - id: ch02-b19
          speaker: dorothy
          text: >-
            But Aunt Em told me all the witches died years and years ago.
        - id: ch02-b20
          speaker: witch_of_the_north
          text: Who is Aunt Em?
        - id: ch02-b21
          speaker: dorothy
          text: She's my aunt. She lives in Kansas, where I come from.
        - id: ch02-b22
          speaker: narrator
          text: >-
            The Witch of the North lowered her head and studied the ground for a
            while. Then she looked up.
        - id: ch02-b23
          speaker: witch_of_the_north
          text: >-
            I've never heard of Kansas, so I don't know where it is. Tell me, is
            it a civilized country?
        - id: ch02-b24
          speaker: dorothy
          text: Oh, yes.
        - id: ch02-b25
          speaker: witch_of_the_north
          text: >-
            Well, that explains it. I believe civilized countries have no witches,
            wizards, sorceresses, or magicians left. But the Land of Oz is cut off
            from every other part of the world. It has never been civilized at
            all. So here in Oz, we still have witches and wizards among us.
        - id: ch02-b26
          speaker: dorothy
          text: Who are the wizards?
        - id: ch02-b27
          speaker: witch_of_the_north
          text: >-
            Oz himself is the Great Wizard. He is stronger than all the rest of us
            put together. He lives in the City of Emeralds.
    - id: ch03
      title: The Silver Shoes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The Witch's voice dropped to a whisper as she spoke of Oz. Dorothy was
            about to ask another question when the three Munchkins suddenly
            shouted and pointed at the corner of the house where the dead witch
            had been lying.
        - id: ch03-b02
          speaker: witch_of_the_north
          text: What's happened?
        - id: ch03-b03
          speaker: narrator
          text: >-
            The old woman looked, then began to laugh. The dead Witch's feet had
            vanished completely. There was no trace of her beneath the house now.
            Only the silver shoes remained on the ground.
        - id: ch03-b04
          speaker: witch_of_the_north
          text: >-
            She was so old that the sun dried her up at once. That's the end of
            her. The silver shoes belong to you now. You should wear them.
        - id: ch03-b05
          speaker: narrator
          text: >-
            She bent down, picked up the shoes, shook out the dust, and handed
            them to Dorothy.
        - id: ch03-b06
          speaker: munchkin_1
          text: >-
            The Witch of the East was very proud of those shoes. Some kind of
            magic is tied to them, but none of us ever learned what it is.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Dorothy carried the shoes inside and set them on the table. Then she
            returned to the Munchkins.
        - id: ch03-b08
          speaker: dorothy
          text: >-
            I need to get home to my aunt and uncle. I'm sure they're worried
            about me. Can you help me find the way back?
        - id: ch03-b09
          speaker: narrator
          text: >-
            The Witch and the Munchkins looked at one another. Then they looked at
            Dorothy, and one by one they shook their heads.
        - id: ch03-b10
          speaker: munchkin_1
          text: >-
            East of here, there is a great desert. No one could survive crossing
            it.
        - id: ch03-b11
          speaker: munchkin_2
          text: >-
            The South is the same. I've been there and seen the desert myself.
            Beyond it lies the country of the Quadlings.
        - id: ch03-b12
          speaker: munchkin_3
          text: >-
            I've heard there is another desert to the West. The Winkies live in
            that country, and the Wicked Witch of the West rules them. If you went
            that way, she would make you her slave.
        - id: ch03-b13
          speaker: witch_of_the_north
          text: >-
            My home is in the North, and the same great desert lies at its outer
            edge. That desert surrounds the whole Land of Oz. I'm afraid there is
            no way through it, my dear. You will have to stay here with us.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Dorothy began to sob. She felt terribly lonely among all these strange
            people. Her tears upset the kind Munchkins so much that each man pulled
            out a handkerchief and began to cry, too. Soon Dorothy and all three
            Munchkins were weeping together.
    - id: ch04
      title: The Road to the City of Emeralds
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The little old woman took off her pointed hat and balanced its tip on
            the end of her nose. In a solemn voice, she counted to three. At once,
            the hat changed into a slate. Across its dark surface, big white chalk
            letters appeared. The message said, "Let Dorothy go to the City of
            Emeralds."
        - id: ch04-b02
          speaker: narrator
          text: >-
            The old woman lifted the slate from her nose and read the words.
        - id: ch04-b03
          speaker: witch_of_the_north
          text: Is your name Dorothy, my dear?
        - id: ch04-b04
          speaker: narrator
          text: Dorothy looked up and wiped away her tears.
        - id: ch04-b05
          speaker: dorothy
          text: Yes.
        - id: ch04-b06
          speaker: witch_of_the_north
          text: >-
            Then you must travel to the City of Emeralds. Oz may be able to help
            you.
        - id: ch04-b07
          speaker: dorothy
          text: Where is the city?
        - id: ch04-b08
          speaker: witch_of_the_north
          text: >-
            It stands right in the center of this country. Oz, the Great Wizard I
            told you about, rules it.
        - id: ch04-b09
          speaker: dorothy
          text: Is he a good man?
        - id: ch04-b10
          speaker: witch_of_the_north
          text: >-
            He is a good Wizard. I can't say whether he is a man, because I have
            never seen him.
        - id: ch04-b11
          speaker: dorothy
          text: How do I get there?
        - id: ch04-b12
          speaker: witch_of_the_north
          text: >-
            You will have to walk. It's a long journey. Some of the country you'll
            pass through is pleasant, and some is dark and terrible. But I will
            use every bit of magic I know to keep you safe from harm along the
            way.
        - id: ch04-b13
          speaker: dorothy
          text: Won't you come with me?
        - id: ch04-b14
          speaker: narrator
          text: >-
            Dorothy pleaded with her. By now, the little old woman seemed like her
            only friend.
        - id: ch04-b15
          speaker: witch_of_the_north
          text: >-
            No, I can't go with you. But I will give you my kiss. No one will dare
            hurt someone who has been kissed by the Witch of the North.
        - id: ch04-b16
          speaker: narrator
          text: >-
            She stepped close and gently kissed Dorothy on the forehead. Her lips
            left a round, shining mark, though Dorothy did not discover it until
            later.
        - id: ch04-b17
          speaker: witch_of_the_north
          text: >-
            The road to the City of Emeralds is paved with yellow bricks, so you
            can't lose your way. When you reach Oz, don't be afraid. Tell him your
            story and ask him to help you. Good-bye, my dear.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The three Munchkins bowed low to Dorothy and wished her a pleasant
            journey. Then they walked away through the trees. The Witch gave
            Dorothy a friendly nod, spun three times on her left heel, and vanished
            at once, right before them.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Toto was astonished. Once the Witch was gone, he barked after her as
            loudly as he could. While she had been there, he had been too afraid
            even to growl.
        - id: ch04-b20
          speaker: narrator
          text: >-
            Dorothy was not surprised at all. She knew the old woman was a witch,
            and disappearing like that was exactly what she had expected.
