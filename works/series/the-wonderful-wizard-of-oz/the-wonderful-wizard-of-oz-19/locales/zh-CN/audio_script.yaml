audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    monkey_king:
      display_name: 猴王
      tts:
        delivery: 郑重有礼，说话干脆明白
        timbre: 清亮灵活
        pace: 稍快
        pitch: 中高音
    soldier:
      display_name: 绿胡子卫兵
      tts:
        delivery: 恭敬谨慎，回答问题时朴实坦白
        timbre: 清晰温厚
        pace: 平稳
        pitch: 中低音
    citizen_1:
      display_name: 市民甲
      tts:
        delivery: 诚恳亲切，带着由衷的自豪
        timbre: 清楚温和
        pace: 自然
        pitch: 中音
    citizen_2:
      display_name: 市民乙
      tts:
        delivery: 热情尊敬，语气明快
        timbre: 明亮圆润
        pace: 自然
        pitch: 中高音
    citizen_3:
      display_name: 市民丙
      tts:
        delivery: 认真稳重，话音坚定
        timbre: 饱满柔和
        pace: 平稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十八章　向南方去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 多萝茜回堪萨斯的希望，随着气球一同飞走了。她哭得非常伤心。可把事情从头到尾想过一遍以后，她又庆幸自己没有坐进那只气球。奥兹走了，她也觉得难过，伙伴们和她一样舍不得奥兹。
        - id: ch01-b02
          speaker: narrator
          text: 铁皮樵夫走到多萝茜面前。
        - id: ch01-b03
          speaker: tin_woodman
          text: 奥兹给了我这么好的一颗心。他走了，我要是不难过，那就太忘恩负义了。我想为他哭一会儿。你能替我擦眼泪吗？不然我会生锈的。
          emotion: sad
        - id: ch01-b04
          speaker: dorothy
          text: 当然可以。
        - id: ch01-b05
          speaker: narrator
          text: 多萝茜马上取来毛巾。铁皮樵夫哭了好几分钟，她一直小心盯着那些眼泪，一滴一滴及时擦掉。等他哭完，先客客气气地谢过多萝茜，又拿起那只镶着宝石的油壶，把全身上上下下都涂满了油，免得再出什么岔子。
        - id: ch01-b06
          speaker: narrator
          text: 翡翠城如今归稻草人治理。他虽然不会魔法，百姓还是为他感到骄傲。
        - id: ch01-b07
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 全世界再也找不到第二座城，会让一个稻草人来统治啦。
        - id: ch01-b08
          speaker: narrator
          text: 至少在他们知道的地方，这话确实没错。
        - id: ch01-b09
          speaker: narrator
          text: 奥兹乘着气球升上天空的第二天早晨，四位旅行者一起来到王座厅，商量接下来到底该怎么办。稻草人已经坐上高大的王座，另外三位则恭恭敬敬地站在他面前。
        - id: ch01-b10
          speaker: scarecrow
          text: 我们的运气其实不坏。王宫和翡翠城都归我们了，我们想做什么都行。不久前，我还挂在农夫玉米地的木杆上。现在，我竟然统治着这么美的一座城。我已经很知足了。
        - id: ch01-b11
          speaker: tin_woodman
          text: 我也很满意。我有了这颗新心，而它原本就是我在世上唯一想要的东西。
        - id: ch01-b12
          speaker: cowardly_lion
          text: 我知道自己不比任何野兽胆小，也许还比它们更勇敢。光是这一点，我就满足了。
        - id: ch01-b13
          speaker: scarecrow
          text: 要是多萝茜肯留在翡翠城，我们几个就能一直快快乐乐地生活在一起。
        - id: ch01-b14
          speaker: dorothy
          text: 可我不愿意住在这里！我想回堪萨斯，跟爱姆婶婶和亨利叔叔住在一起。
        - id: ch01-b15
          speaker: tin_woodman
          text: 那我们还能想什么办法呢？
        - id: ch01-b16
          speaker: narrator
          text: 稻草人决定好好动一动脑筋。他越想越用力，脑袋里的大头针和缝衣针竟然一根根冒了出来。终于，他想到了一个主意。
        - id: ch01-b17
          speaker: scarecrow
          text: 我们把飞猴叫来怎么样？可以请他们带你越过沙漠呀。
        - id: ch01-b18
          speaker: dorothy
          text: 我怎么把他们忘了！这个办法一定行。我马上去拿金冠。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 多萝茜把金冠拿到王座厅，念出咒语。没过多久，飞猴们便穿过敞开的窗户，飞进来落在她身边。
        - id: ch01-b20
          speaker: narrator
          text: 猴王先向小姑娘鞠了一躬。
        - id: ch01-b21
          speaker: monkey_king
          text: 这是你第二次叫我们来了。请问，你想让我们做什么？
        - id: ch01-b22
          speaker: dorothy
          text: 请你们带着我，一直飞到堪萨斯。
        - id: ch01-b23
          speaker: narrator
          text: 猴王听了，却摇摇头。
        - id: ch01-b24
          speaker: monkey_king
          text: 这可办不到。我们只属于这个国家，不能离开。以前从没有一只飞猴到过堪萨斯，以后大概也永远不会有，因为我们根本不属于那里。别的事情，只要在我们的能力以内，我们都很乐意效劳。可是这片沙漠，我们不能飞过去。告辞了。
        - id: ch01-b25
          speaker: narrator
          text: 猴王再次鞠躬，展开双翼，从窗户飞走了。那一大群飞猴也全都跟了出去。
        - id: ch01-b26
          speaker: narrator
          text: 多萝茜失望极了，眼泪差点又掉下来。
        - id: ch01-b27
          speaker: dorothy
          text: 金冠的一次法力，就这么白白用掉了。飞猴也没法帮我。
          emotion: sad
        - id: ch01-b28
          speaker: tin_woodman
          text: 唉，这实在太糟了！
          emotion: sad
        - id: ch01-b29
          speaker: narrator
          text: 稻草人又一次用力想起办法来。他的脑袋越鼓越大，样子吓人极了，多萝茜看着看着，真怕那颗脑袋会突然胀破。
        - id: ch01-b30
          speaker: scarecrow
          text: 去叫绿胡子卫兵进来吧。也许他能给我们出个主意。
        - id: ch01-b31
          speaker: narrator
          text: 大家把绿胡子卫兵叫来了。他畏畏缩缩地走进王座厅，因为奥兹还在这里的时候，他最多只能走到门口，从来不许跨过门槛，再往里迈上一步。
        - id: ch01-b32
          speaker: scarecrow
          text: 这个小姑娘想要越过沙漠。你知道她该怎么走吗？
        - id: ch01-b33
          speaker: soldier
          text: 我不知道。除了奥兹本人或许曾经过去，谁也没有越过那片沙漠。
        - id: ch01-b34
          speaker: dorothy
          text: 难道真的没有人能帮我吗？
        - id: ch01-b35
          speaker: soldier
          text: 格琳达也许有办法。
        - id: ch01-b36
          speaker: scarecrow
          text: 格琳达是谁？
        - id: ch01-b37
          speaker: soldier
          text: 她是南方女巫，也是所有女巫里法力最强的一位。南方的桂特林人都归她统治。她的城堡正好立在沙漠边上，所以她也许知道穿越沙漠的办法。
        - id: ch01-b38
          speaker: dorothy
          text: 格琳达是好女巫，对吗？
        - id: ch01-b39
          speaker: soldier
          text: 桂特林人都说她很好，她待每个人也很和善。我听人说，格琳达长得很美。虽然她已经活了许许多多年，却知道怎么让自己一直年轻。
        - id: ch01-b40
          speaker: dorothy
          text: 那我要怎么去她的城堡？
        - id: ch01-b41
          speaker: soldier
          text: 一直朝南走，路是直的。可是听说，对旅行的人来说，那条路到处都有危险。森林里藏着猛兽，还有一族古怪的人，不喜欢陌生人穿过他们的国家。正因为这样，从来没有桂特林人到翡翠城来。
        - id: ch01-b42
          speaker: narrator
          text: 卫兵说完就走了。稻草人又把大家的处境想了一遍。
        - id: ch01-b43
          speaker: scarecrow
          text: 这么看来，哪怕路上很危险，多萝茜也应该到南方国度去，请格琳达帮忙。她要是继续留在这里，就永远回不了堪萨斯。
        - id: ch01-b44
          speaker: tin_woodman
          text: 你刚才一定又用新脑子想过了。
        - id: ch01-b45
          speaker: scarecrow
          text: 是的，我想过了。
        - id: ch01-b46
          speaker: cowardly_lion
          text: 我要陪多萝茜去。我已经厌倦了这座城市，又想回森林和乡野了。别忘了，我本来就是一头野兽。再说，多萝茜也需要有人保护。
        - id: ch01-b47
          speaker: tin_woodman
          text: 没错。我的斧头也许能帮上忙，所以我也陪她到南方国度去。
        - id: ch01-b48
          speaker: scarecrow
          text: 那我们什么时候出发？
        - id: ch01-b49
          speakers: [dorothy, tin_woodman, cowardly_lion]
          ensemble: chorus
          text: 你也要去？
          emotion: surprised
        - id: ch01-b50
          speaker: scarecrow
          text: 当然要去。没有多萝茜，我就永远得不到脑子。她把我从玉米地的木杆上救下来，又带我来到翡翠城。我的好运全是她给的。直到她终于能回到堪萨斯，从此留在那里，我也绝不会离开她半步。
        - id: ch01-b51
          speaker: dorothy
          text: 谢谢你们。你们对我真好。不过，我还是想尽快出发。
        - id: ch01-b52
          speaker: scarecrow
          text: 那就明天早晨走。现在大家去做准备吧，前面可是很长的一段路。
