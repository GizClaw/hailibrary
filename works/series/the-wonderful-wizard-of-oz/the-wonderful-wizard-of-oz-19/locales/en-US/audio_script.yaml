  chapters:
    - id: ch01
      title: Chapter XVIII Away to the South
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dorothy cried bitterly when her hope of getting home to Kansas again
            disappeared with the balloon. But after she thought about it, she
            was glad she hadn't gone up in the basket. She was sorry to lose
            Oz, too, and all her friends felt the same way.
        - id: ch01-b02
          speaker: tin_woodman
          text: >-
            I would be terribly ungrateful if I didn't mourn the man who gave
            me this lovely heart. I'd like to cry for a little while because Oz
            is gone. Would you please wipe away my tears so I don't rust?
          emotion: sad
        - id: ch01-b03
          speaker: dorothy
          text: Of course I will.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Dorothy brought a towel right away. The Tin Woodman wept for
            several minutes while she watched every tear and carefully wiped it
            away. When he was done, he thanked her kindly and gave himself a thorough
            oiling with his jeweled oil can, just to make sure nothing went
            wrong, to guard against any mishap, and to make sure no trace of the
            tears made him rust.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Scarecrow was now the ruler of the Emerald City. He wasn't a
            Wizard, but the people were proud of him. A stuffed man on the
            throne made their city unlike any other city they knew.
        - id: ch01-b06
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: >-
            No other city in the whole world is ruled by a stuffed man.
        - id: ch01-b07
          speaker: narrator
          text: And as far as the people knew, they were exactly right.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The morning after Oz sailed away, the four travelers gathered in
            the Throne Room to decide what to do. The Scarecrow sat on the great
            throne. The others stood respectfully before him.
        - id: ch01-b09
          speaker: scarecrow
          text: >-
            We haven't been so unlucky. The Palace and the Emerald City belong
            to us now, so we may do whatever we like. Not long ago, I was stuck
            on a pole in a farmer's cornfield. Now I rule this beautiful city.
            I have every reason to be satisfied.
        - id: ch01-b10
          speaker: tin_woodman
          text: >-
            I'm very happy with my new heart as well. It was truly the only
            thing in the world I wanted.
        - id: ch01-b11
          speaker: cowardly_lion
          text: >-
            And I'm content because I know I'm as brave as any beast alive.
            Maybe even braver.
        - id: ch01-b12
          speaker: scarecrow
          text: >-
            If only Dorothy were willing to stay in the Emerald City, we could
            all be happy here together.
        - id: ch01-b13
          speaker: dorothy
          text: >-
            But I don't want to stay here! I want to go home to Kansas and live
            with Aunt Em and Uncle Henry.
        - id: ch01-b14
          speaker: tin_woodman
          text: Then what can we do?
        - id: ch01-b15
          speaker: narrator
          text: >-
            The Scarecrow began to think. He thought so hard that pins and
            needles started poking out of his brains. At last, he had an idea.
        - id: ch01-b16
          speaker: scarecrow
          text: >-
            Why don't we call the Winged Monkeys and ask them to carry you over
            the desert?
        - id: ch01-b17
          speaker: dorothy
          text: >-
            I never thought of that! That's exactly what we need. I'll get the
            Golden Cap right now.
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: >-
            Dorothy brought the cap into the Throne Room and spoke the magic
            words. Before long, the Winged Monkeys swept in through the open
            window and gathered beside her.
        - id: ch01-b19
          speaker: narrator
          text: The Monkey King bowed before the little girl.
        - id: ch01-b20
          speaker: monkey_king
          text: >-
            This is the second time you've called us. What would you like us to
            do?
        - id: ch01-b21
          speaker: dorothy
          text: I want you to fly me to Kansas.
        - id: ch01-b22
          speaker: narrator
          text: But the Monkey King shook his head.
        - id: ch01-b23
          speaker: monkey_king
          text: >-
            We can't do that. We belong only in this country, and we aren't
            able to leave it. No Winged Monkey has ever been in Kansas, and I
            don't suppose one ever will be. We don't belong there. We'll gladly
            serve you in any way we can, but crossing the desert is beyond our
            power. Good-bye.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He bowed once more, spread his wings, and flew out through the
            window. The whole band followed him.
        - id: ch01-b25
          speaker: narrator
          text: Dorothy was so disappointed that she was ready to cry.
        - id: ch01-b26
          speaker: dorothy
          text: >-
            I've used the Golden Cap's charm for nothing. The Winged Monkeys
            can't help me at all.
          emotion: sad
        - id: ch01-b27
          speaker: tin_woodman
          text: That really is too bad!
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: >-
            The Scarecrow started thinking again. His head swelled out so
            horribly that Dorothy was afraid it might burst.
        - id: ch01-b29
          speaker: scarecrow
          text: >-
            Let's send for the soldier with the green whiskers. Perhaps he can
            tell us what to do.
        - id: ch01-b30
          speaker: narrator
          text: >-
            They summoned the soldier, and he entered the Throne Room timidly.
            While Oz had ruled the city, the soldier had never been allowed to
            come any farther than the door. Now he found himself standing in
            front of the great throne and its new ruler.
        - id: ch01-b31
          speaker: scarecrow
          text: >-
            This little girl needs to cross the desert. Do you know how she can
            get across?
        - id: ch01-b32
          speaker: soldier
          text: >-
            I don't know. No one has ever crossed the desert, unless Oz himself
            did it.
        - id: ch01-b33
          speaker: dorothy
          text: Please, isn't there anyone at all who might help me?
        - id: ch01-b34
          speaker: soldier
          text: Glinda might be able to.
        - id: ch01-b35
          speaker: scarecrow
          text: Who is Glinda?
        - id: ch01-b36
          speaker: soldier
          text: >-
            She's the Witch of the South. She's the most powerful of all the
            Witches, and she rules the Quadlings. Her castle is right at the
            edge of the desert, so she may know how to cross it.
        - id: ch01-b37
          speaker: dorothy
          text: Glinda is a Good Witch, isn't she?
        - id: ch01-b38
          speaker: soldier
          text: >-
            The Quadlings believe she's good, and she's kind to everyone. I've
            heard that she's a beautiful woman who knows how to stay young,
            even though she has lived for many years.
        - id: ch01-b39
          speaker: dorothy
          text: How do I reach her castle?
        - id: ch01-b40
          speaker: soldier
          text: >-
            The road runs straight south, but people say it's a dangerous road
            for travelers. Wild beasts live in the woods. And there's a strange
            race of men who don't want strangers crossing their land. That's
            why the Quadlings never make the journey to the Emerald City.
        - id: ch01-b41
          speaker: narrator
          text: The soldier left them, and the Scarecrow spoke.
        - id: ch01-b42
          speaker: scarecrow
          text: >-
            Dangerous or not, Dorothy's best choice is to travel south and ask
            Glinda for help. It seems to me that this is the best thing she can
            do. If Dorothy stays here, she certainly won't get back to Kansas.
        - id: ch01-b43
          speaker: tin_woodman
          text: You've been thinking again, haven't you?
        - id: ch01-b44
          speaker: scarecrow
          text: I have.
        - id: ch01-b45
          speaker: cowardly_lion
          text: >-
            I'm going with Dorothy. I've had enough of the city, and I miss the
            woods and the open country. I am a wild beast, after all. Besides,
            Dorothy will need someone to protect her from the dangers along the
            road.
        - id: ch01-b46
          speaker: tin_woodman
          text: >-
            That's true. My axe might be useful to her, so I'll go south with
            her, too.
        - id: ch01-b47
          speaker: scarecrow
          text: When should we leave?
        - id: ch01-b48
          speakers: [dorothy, tin_woodman, cowardly_lion]
          ensemble: chorus
          text: You're coming with us?
          emotion: surprised
        - id: ch01-b49
          speaker: scarecrow
          text: >-
            Of course I am. Without Dorothy, I never would have gotten my
            brains. She took me down from the pole in the cornfield and brought
            me to the Emerald City. I owe all my good fortune to her. I won't
            leave her until she's finally on her way back to Kansas for good.
        - id: ch01-b50
          speaker: dorothy
          text: >-
            Thank you. You've all been very kind to me. But I want to start as
            soon as we can.
        - id: ch01-b51
          speaker: scarecrow
          text: >-
            Then we'll leave tomorrow morning. Now we'd better get ready. We
            have a long journey ahead of us.
