audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 天真坦率，惊讶与担忧都自然流露
        timbre: 清亮稚嫩
        pace: 自然
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 友善谦逊，带着初识世界的好奇和一点笨拙幽默
        timbre: 略带沙哑而轻软
        pace: 从容
        pitch: 中高音
    farmer:
      display_name: 农夫
      tts:
        delivery: 务实直爽，说话干脆
        timbre: 结实成熟
        pace: 平稳
        pitch: 中低音
    munchkin:
      display_name: 芒奇金人
      tts:
        delivery: 坦率随和，观察细致
        timbre: 轻快成熟
        pace: 自然
        pitch: 中高音
    old_crow:
      display_name: 老乌鸦
      tts:
        delivery: 老练自信，话里带着锐利的判断
        timbre: 粗哑苍老
        pace: 沉稳
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第四章　穿过森林的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            几个小时以后，路越来越难走。黄砖高一块，低一块，稻草人常常让它们绊倒。有的砖碎了，有的地方连砖都没了，只剩下一个个坑。托托会跳过去，多萝茜会绕开，可稻草人没有脑子，还是笔直朝前走。他一脚踩进坑里，便从头到脚直挺挺地扑倒在硬邦邦的砖面上。不过，他根本摔不疼。多萝茜每次把他扶起来，让他重新站稳，他都会和她一起快活地笑个不停。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这里的农田不如先前那些地方收拾得好。房屋越来越少，果树也越来越少。他们走得越远，四周就越荒凉，越冷清。
        - id: ch01-b03
          speaker: narrator
          text: >-
            到了中午，他们坐在路边的小溪旁休息。多萝茜打开篮子，拿出面包，也递给稻草人一块。他没有接。
        - id: ch01-b04
          speaker: scarecrow
          text: >-
            我从来不会饿，这可真幸运。我的嘴只是画出来的。要是剪个洞来吃东西，里面的稻草就全漏掉了，脑袋也会变形。
        - id: ch01-b05
          speaker: narrator
          text: >-
            多萝茜觉得这话很有道理，便点点头，独自吃完了面包。等她吃过午饭，稻草人想听听她的故事。
        - id: ch01-b06
          speaker: scarecrow
          text: 说说你自己吧。你来的那个地方是什么样的？
        - id: ch01-b07
          speaker: narrator
          text: >-
            多萝茜把自己的事全讲给他听。她说堪萨斯处处灰蒙蒙的，又说起那阵旋风怎样刮来，怎样把自己卷进这个古怪的奥兹国。稻草人一直认真听着。
        - id: ch01-b08
          speaker: scarecrow
          text: >-
            这里这么美，你为什么还要离开，回到那个又干又灰的堪萨斯去？我实在想不通。
        - id: ch01-b09
          speaker: dorothy
          text: >-
            因为你没有脑子呀。我们的家哪怕阴沉又灰暗，我们这些有血有肉的人，也宁愿住在家里，不愿搬到别的地方去。那地方再美也比不上家。世上没有一个地方比得上家。
        - id: ch01-b10
          speaker: narrator
          text: 稻草人听完，叹了一口气。
        - id: ch01-b11
          speaker: scarecrow
          text: >-
            我当然不懂。要是你们的脑袋都跟我一样塞着稻草，大家可能会去住那些美丽的地方，堪萨斯就没人了。幸亏堪萨斯人有脑子。
        - id: ch01-b12
          speaker: dorothy
          text: 我们还在休息，你给我讲个故事好吗？
        - id: ch01-b13
          speaker: narrator
          text: 稻草人像是受了埋怨似的看着她，这才讲起自己的来历。
        - id: ch01-b14
          speaker: scarecrow
          text: >-
            我前天才被造出来，活得这么短，哪里知道什么故事？在那以前，世上发生过什么，我全不知道。还好农夫很早就给我画上了耳朵，所以周围的话都能听见。那时另一个芒奇金人也在场。我这辈子听到的第一句话，就是农夫问他我的耳朵画得怎么样。
        - id: ch01-b15
          speaker: farmer
          text: 你看这双耳朵怎么样？
        - id: ch01-b16
          speaker: munchkin
          text: 这双耳朵长歪了。
        - id: ch01-b17
          speaker: farmer
          text: 歪了也不要紧，反正还是耳朵。
        - id: ch01-b18
          speaker: scarecrow
          text: 这话说得确实没错。
        - id: ch01-b19
          speaker: farmer
          text: 接下来，我该画眼睛了。
        - id: ch01-b20
          speaker: scarecrow
          text: >-
            他先画我的右眼。刚画好，我就看见了农夫，也看见了周围的一切。那是我第一次看见这个世界，我不停地东看西看，什么都觉得新鲜，什么都让我好奇。
        - id: ch01-b21
          speaker: munchkin
          text: 这只眼睛挺漂亮。眼睛就该用蓝色来画。
        - id: ch01-b22
          speaker: farmer
          text: 那我把另一只眼睛画得大一点。
        - id: ch01-b23
          speaker: scarecrow
          text: >-
            第二只眼睛一画好，我就看得更清楚了。农夫接着画出我的鼻子和嘴巴。那时我还不知道嘴巴有什么用，所以没有说话。我只觉得好玩，看着他们一点一点做出我的身体、胳膊和腿。最后，他们终于把我的脑袋装了上去。我骄傲得不得了，觉得自己和任何人都一样，是个真正的人。
        - id: ch01-b24
          speaker: farmer
          text: 这家伙肯定能把乌鸦赶跑。他看着跟真人一模一样。
        - id: ch01-b25
          speaker: munchkin
          text: 什么叫像？他本来就是个人。
        - id: ch01-b26
          speaker: scarecrow
          text: >-
            我听了十分赞成。农夫把我夹在胳膊下面，一路带进玉米地，再把我架到高高的木杆上。你后来就是在那里发现我的。没过多久，农夫和他的朋友一起走了，只剩我独自留在那里。
        - id: ch01-b27
          speaker: scarecrow
          text: >-
            我不喜欢让人这样丢下，就想走着追过去。可是双脚够不到地面，我只能留在那根木杆上。日子非常寂寞。我刚来到世上不久，脑袋里连一件可想的事都没有。
        - id: ch01-b28
          speaker: scarecrow
          text: >-
            乌鸦和别的鸟经常飞进玉米地。它们一看见我，以为我是芒奇金人，转身就飞跑了。我每次都很得意，觉得自己真是个重要人物。后来，一只老乌鸦飞过来。他把我仔细看了一遍，落到了我的肩膀上。
        - id: ch01-b29
          speaker: old_crow
          text: >-
            那个农夫真以为，这么笨的把戏能骗过我？只要有点见识，哪只乌鸦看不出你肚里只有稻草？
        - id: ch01-b30
          speaker: scarecrow
          text: >-
            说完，老乌鸦从我肩上跳到脚边，想吃多少玉米就吃多少。别的鸟亲眼看见他一点也没受伤，知道我拿它们没办法，也纷纷飞下来吃玉米。没过多久，我身边便围了一大群鸟。
        - id: ch01-b31
          speaker: scarecrow
          text: >-
            我难过极了。原来，我根本不是个称职的稻草人。老乌鸦看我这样，便安慰了我。
          emotion: sad
        - id: ch01-b32
          speaker: old_crow
          text: >-
            只要脑袋里有脑子，你就能跟任何人一样出色，甚至比有些人还强。不管你是乌鸦还是人，这世上只有脑子真正值得拥有。
        - id: ch01-b33
          speaker: scarecrow
          text: >-
            乌鸦们走后，我一直想着他的话，决定一定要设法弄到脑子。幸好你来了，把我从木杆上救下来。听你说了奥兹的事，我相信，等我们到了翡翠城，他一定会把脑子给我。
        - id: ch01-b34
          speaker: dorothy
          text: 希望他会答应。看得出来，你真的很想有脑子。
        - id: ch01-b35
          speaker: scarecrow
          text: 我当然想要。明知道自己是个傻瓜，心里实在太难受了。
        - id: ch01-b36
          speaker: dorothy
          text: 好啦，我们继续走吧。
        - id: ch01-b37
          speaker: narrator
          text: 多萝茜把篮子交给稻草人，两位伙伴又上路了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            这时，路边连一道篱笆也没有了。土地高低不平，到处没有开垦。傍晚，他们来到一片大森林。树木长得又高又密，两边的枝条伸到黄砖路上方，彼此交错在一起。阳光让它们严严实实地挡住了，树下几乎一片漆黑。可这几位旅行者没有停下，还是沿着路走进了森林。
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            这条路既然进得了森林，就一定也出得去。翡翠城在路的另一头，所以这条路带我们去哪里，我们就跟到哪里。
        - id: ch01-b40
          speaker: dorothy
          text: 这件事谁都知道。
        - id: ch01-b41
          speaker: scarecrow
          text: >-
            没错，所以我也知道。要是非得用脑子才能想出来，我肯定一句也说不出。
        - id: ch01-b42
          speaker: narrator
          text: >-
            大约一个小时过去，最后一点光也消失了。他们在黑暗里一路跌跌撞撞。多萝茜什么都看不见，托托却看得见，因为有些狗到了夜里，眼睛还是很灵。稻草人也说，自己夜里看得和白天一样清楚。多萝茜便紧紧挽住他的胳膊，靠他带路，总算还走得下去。
        - id: ch01-b43
          speaker: dorothy
          text: >-
            要是你看见房子，或者能过夜的地方，一定要告诉我。在黑暗里走路太难受了。
        - id: ch01-b44
          speaker: narrator
          text: 又走了一会儿，稻草人忽然停了下来。
        - id: ch01-b45
          speaker: scarecrow
          text: 右边有间小屋，是用圆木和树枝搭的。我们过去吗？
        - id: ch01-b46
          speaker: dorothy
          text: 好，我们快过去吧。我已经累得一点力气也没有了。
        - id: ch01-b47
          speaker: narrator
          text: >-
            稻草人领着多萝茜穿过一棵棵树，来到那间小屋。她走进去，看见屋里的一角铺着一床干树叶。她马上躺下，托托也依偎在身边。没过多久，多萝茜就沉沉地睡着了。
        - id: ch01-b48
          speaker: narrator
          text: 稻草人从来不会累。他站在另一个角落，耐心等着天亮。
