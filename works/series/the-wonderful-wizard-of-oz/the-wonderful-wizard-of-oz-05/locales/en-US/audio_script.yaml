  chapters:
    - id: ch01
      title: The Road Through the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After a few hours, the road turned rough. The yellow bricks were so
            uneven that the Scarecrow kept tripping over them. In places, bricks
            were broken or gone, leaving holes in the road. Toto jumped across
            them, and Dorothy walked around. But without any brains to guide him,
            the Scarecrow kept going straight ahead. He stepped right into the
            holes and fell flat on the hard bricks. Each time, it was a complete
            tumble from head to foot. It never hurt him, though. Dorothy simply
            helped him back up, and he laughed merrily with her about his mishap.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The farms here were not cared for nearly as well as the ones they had
            passed before. Houses and fruit trees grew scarce. The farther the
            travelers went, the lonelier and gloomier the country became.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At noon, they rested beside a little brook. Dorothy opened her basket
            and took out some bread. She offered a piece to the Scarecrow, but he
            would not take it.
        - id: ch01-b04
          speaker: scarecrow
          text: >-
            I never get hungry, and that's lucky for me. My mouth is only painted
            on. If I cut a hole so I could eat, all the straw inside me would
            spill out, and my head would lose its shape.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dorothy saw that he was right. She nodded and finished eating her
            bread. When her dinner was over, the Scarecrow asked her a question.
        - id: ch01-b06
          speaker: scarecrow
          text: Tell me about yourself. What is the country you came from like?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Dorothy told him about Kansas, where everything was gray. She also
            told him how the cyclone had carried her into the strange Land of Oz.
            The Scarecrow listened closely.
        - id: ch01-b08
          speaker: scarecrow
          text: >-
            I don't understand. Why would you leave this beautiful country to go
            back to that dry, gray place called Kansas?
        - id: ch01-b09
          speaker: dorothy
          text: >-
            That's because you don't have any brains. Our homes may be gray and
            dreary, but people made of flesh and blood would rather live at home
            than in the most beautiful country anywhere. There's no place like
            home.
        - id: ch01-b10
          speaker: narrator
          text: The Scarecrow sighed.
        - id: ch01-b11
          speaker: scarecrow
          text: >-
            Of course I can't understand. If all your heads were stuffed with
            straw like mine, you'd probably live in beautiful places. Then no one
            would live in Kansas at all. It's lucky for Kansas that you have
            brains.
        - id: ch01-b12
          speaker: dorothy
          text: Would you tell me a story while we rest?
        - id: ch01-b13
          speaker: narrator
          text: The Scarecrow gave her a reproachful look.
        - id: ch01-b14
          speaker: scarecrow
          text: >-
            My life has been so short that I hardly know anything. I was only
            made the day before yesterday. I know nothing about what happened in
            the world before then. But the farmer painted my ears right away, so
            I could hear what was happening. Another Munchkin was there with him.
            The first thing I ever heard was the farmer asking him about my ears.
        - id: ch01-b15
          speaker: farmer
          text: What do you think of those ears?
        - id: ch01-b16
          speaker: munchkin
          text: They're crooked.
        - id: ch01-b17
          speaker: farmer
          text: That doesn't matter. They're still ears.
        - id: ch01-b18
          speaker: scarecrow
          text: And he was right about that.
        - id: ch01-b19
          speaker: farmer
          text: Now I'll paint the eyes.
        - id: ch01-b20
          speaker: scarecrow
          text: >-
            He painted my right eye first. The moment it was done, I could see
            him and everything around me. I was very curious because it was my
            first look at the world.
        - id: ch01-b21
          speaker: munchkin
          text: That's a nice-looking eye. Blue is just the right color for it.
        - id: ch01-b22
          speaker: farmer
          text: I'll make the other eye a little bigger.
        - id: ch01-b23
          speaker: scarecrow
          text: >-
            When he finished my second eye, I could see much better. Next came my
            nose and mouth. I didn't speak yet because I had no idea what a mouth
            was meant for. All the while, I had the fun of watching them build my
            body and make my arms and legs.
            At last, they fastened my head in place. I felt very proud then. I
            thought I was as good a man as anyone else.
        - id: ch01-b24
          speaker: farmer
          text: This fellow will frighten the crows away. He looks exactly like a man.
        - id: ch01-b25
          speaker: munchkin
          text: Why, he is a man.
        - id: ch01-b26
          speaker: scarecrow
          text: >-
            I agreed with him completely. The farmer tucked me under his arm,
            carried me to the cornfield, and put me on a tall pole. That's where
            you found me. Then the farmer and his friend walked away and left me
            there alone soon afterward.
        - id: ch01-b27
          speaker: scarecrow
          text: >-
            I didn't like being left behind, so I tried to follow them. My feet
            couldn't reach the ground, though, and I had to stay on the pole. It
            was a lonely life. I had been made so recently that I had nothing to
            think about.
        - id: ch01-b28
          speaker: scarecrow
          text: >-
            Crows and other birds often flew into the cornfield. As soon as they
            saw me, they flew off again because they thought I was a Munchkin. I
            was pleased whenever that happened. It made me feel like a very
            important person. After a while, an old crow flew near. He looked me
            over carefully before landing on my shoulder.
        - id: ch01-b29
          speaker: old_crow
          text: >-
            Did that farmer really think this clumsy trick would fool me? Any
            sensible crow can tell you're only stuffed with straw.
        - id: ch01-b30
          speaker: scarecrow
          text: >-
            The old crow hopped down by my feet and ate as much corn as he wanted.
            When the other birds saw that I couldn't hurt him, they came to eat,
            too. Soon a great flock had gathered all around me.
        - id: ch01-b31
          speaker: scarecrow
          text: >-
            That made me sad. It proved I wasn't a very good Scarecrow after all.
            But the old crow tried to comfort me.
          emotion: sad
        - id: ch01-b32
          speaker: old_crow
          text: >-
            If you had brains in your head, you'd be as good a man as anyone, and
            better than some. Brains are the only thing worth having in this
            world, whether you're a crow or a man.
        - id: ch01-b33
          speaker: scarecrow
          text: >-
            After the crows left, I thought about his words. I decided I would do
            everything I could to get some brains. Luckily, you came along and
            lifted me off the pole. From what you've told me, I'm sure the Great
            Oz will give me brains when we reach the Emerald City.
        - id: ch01-b34
          speaker: dorothy
          text: I hope he does. You certainly seem to want them.
        - id: ch01-b35
          speaker: scarecrow
          text: >-
            Oh, I do. Knowing that you're a fool is a terribly uncomfortable
            feeling.
        - id: ch01-b36
          speaker: dorothy
          text: Well, let's get going.
        - id: ch01-b37
          speaker: narrator
          text: Dorothy handed the basket to the Scarecrow, and they went on.
        - id: ch01-b38
          speaker: narrator
          text: >-
            There were no fences beside the road now. The land was rough and had
            not been farmed. As evening drew near, they reached a great forest.
            The trees stood so tall and close that their branches met above the
            yellow brick road. Those thick branches shut out the daylight, making
            it almost dark beneath them. Still, the travelers did not stop. They
            continued into the forest.
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            If the road goes into the forest, it must come out again. The Emerald
            City is at the other end, so we have to follow wherever the road
            takes us.
        - id: ch01-b40
          speaker: dorothy
          text: Anyone could figure that out.
        - id: ch01-b41
          speaker: scarecrow
          text: >-
            Of course. That's how I figured it out. If it took brains, I never
            would have said it.
        - id: ch01-b42
          speaker: narrator
          text: >-
            An hour or so passed, and the last light faded. Soon they were
            stumbling through the dark. Dorothy could not see anything. Toto
            could, because some dogs see very well at night. The Scarecrow said he
            could see just as well as he did in daylight. Dorothy held his arm,
            and with his help, she managed to keep going.
        - id: ch01-b43
          speaker: dorothy
          text: >-
            Tell me if you see a house, or anywhere we can spend the night. It's
            very uncomfortable walking in the dark.
        - id: ch01-b44
          speaker: narrator
          text: A little while later, the Scarecrow stopped.
        - id: ch01-b45
          speaker: scarecrow
          text: >-
            There's a little cottage on our right. It's made of logs and
            branches. Should we go there?
        - id: ch01-b46
          speaker: dorothy
          text: Yes, please. I'm completely worn out.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The Scarecrow led Dorothy through the trees to the cottage. Inside,
            she found a bed of dried leaves in one corner. She lay down at once,
            and Toto curled up beside her. Before long, Dorothy was sound asleep.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The Scarecrow never grew tired. He stood in another corner and waited
            patiently for morning.
