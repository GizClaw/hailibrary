audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    oz:
      display_name: 奥兹
      tts:
        delivery: 起初故作威严，露馅后局促软弱又善于辩解
        timbre: 略显苍老，声音灵活
        pace: 中等，心虚时稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十六章　大骗子的魔法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，稻草人来向朋友们告别。他满心欢喜，因为盼了那么久的脑子，今天终于可以拿到了。
        - id: ch01-b02
          speaker: scarecrow
          text: 你们快恭喜我吧！我现在就去找奥兹拿脑子。等我回来，我就跟别人一样啦。
          emotion: happy
        - id: ch01-b03
          speaker: dorothy
          text: 可我一直都喜欢你本来的样子呀。
        - id: ch01-b04
          speaker: scarecrow
          text: 你连一个稻草人都肯喜欢，真好。不过，等我的新脑子想出许多妙主意，你一定会更看重我的。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 稻草人高高兴兴地告别大家，来到王座厅外面，抬手敲门。
        - id: ch01-b06
          speaker: oz
          text: 进来吧。
        - id: ch01-b07
          speaker: narrator
          text: 屋里，小老头正坐在窗边，低着头苦苦思索。稻草人走到他面前，心里忽然有些不安。
        - id: ch01-b08
          speaker: scarecrow
          text: 我来拿我的脑子了。
        - id: ch01-b09
          speaker: oz
          text: 哦，对。请坐在那把椅子上。我得把你的头取下来，才能把脑子放对地方，你可别介意。
        - id: ch01-b10
          speaker: scarecrow
          text: 我不介意。只要你装回去时，能让这颗头比原来更好，你尽管取吧。
        - id: ch01-b11
          speaker: narrator
          text: 奥兹解下稻草人的头，把里面的稻草全倒了出来。他走进后面的小屋，取来一量杯麦麸，往里面掺了许多大头针和缝衣针，又使劲摇了又摇，直到完全混匀。接着，他把这堆东西装进稻草人的头顶，再拿稻草塞住剩下的空隙，让新脑子牢牢待在里面。
        - id: ch01-b12
          speaker: narrator
          text: 奥兹把稻草人的头重新安回了身体。
        - id: ch01-b13
          speaker: oz
          text: 从现在起，你可就是个了不起的人了。我给你的，是满满一脑袋麦麸做的新脑子。
        - id: ch01-b14
          speaker: narrator
          text: 稻草人最大的心愿终于实现了。他又欢喜又自豪，热烈地向奥兹道了谢，赶忙回去见朋友们。多萝茜好奇地上上下下打量着他，只见那颗头被新脑子撑得顶上鼓鼓的。
        - id: ch01-b15
          speaker: dorothy
          text: 现在感觉怎么样？
        - id: ch01-b16
          speaker: scarecrow
          text: 我真的觉得自己很有智慧。等我习惯这副脑子，一定会什么都知道。
        - id: ch01-b17
          speaker: tin_woodman
          text: 可你的头上怎么伸出了那么多针？
        - id: ch01-b18
          speaker: cowardly_lion
          text: 这正好说明，他现在有一颗尖脑子嘛。
        - id: ch01-b19
          speaker: tin_woodman
          text: 那我也该去找奥兹，拿回我的心了。
        - id: ch01-b20
          speaker: narrator
          text: 铁皮樵夫走到王座厅门口，敲响了门。奥兹让他进去，他一进屋就说明了来意。
        - id: ch01-b21
          speaker: tin_woodman
          text: 我是来拿心的。
        - id: ch01-b22
          speaker: oz
          text: 好。不过，我得先在你胸口剪个洞，才能把心放进去。希望这不会弄疼你。
        - id: ch01-b23
          speaker: tin_woodman
          text: 不会，我一点儿也感觉不到。
        - id: ch01-b24
          speaker: narrator
          text: 奥兹拿来一把白铁匠用的大剪刀，在铁皮樵夫左边胸口剪出一个小小的方洞。随后，他走到一只五斗柜前，打开抽屉，拿出一颗漂亮的心。它完全是用丝绸缝成的，里面填满了锯末。
        - id: ch01-b25
          speaker: oz
          text: 你看，这颗心是不是很漂亮？
        - id: ch01-b26
          speaker: tin_woodman
          text: 真漂亮！我一看就喜欢。不过，它善良吗？
          emotion: happy
        - id: ch01-b27
          speaker: oz
          text: 当然，它善良得很。
        - id: ch01-b28
          speaker: narrator
          text: 奥兹把心放进铁皮樵夫的胸膛，又把剪下来的方铁片放回原处，沿着切口仔细焊好。
        - id: ch01-b29
          speaker: oz
          text: 好了。现在这颗心，任谁有了都会自豪。只是你的胸口得留下一块补丁，真对不起，可我也没有别的办法。
        - id: ch01-b30
          speaker: tin_woodman
          text: 有补丁也不要紧。我真不知道该怎么感谢你，你的好意，我永远都不会忘记。
          emotion: happy
        - id: ch01-b31
          speaker: oz
          text: 不用放在心上。
        - id: ch01-b32
          speaker: narrator
          text: 铁皮樵夫回到朋友们身边。大家看到他交上了这样的好运，都真心替他高兴，还祝他从今以后事事快乐。
        - id: ch01-b33
          speaker: narrator
          text: 接下来轮到狮子。他也走到王座厅，敲了敲门。听见奥兹叫他进去，他迈进屋里，立刻说出了自己的愿望。
        - id: ch01-b34
          speaker: cowardly_lion
          text: 我是来拿勇气的。
        - id: ch01-b35
          speaker: oz
          text: 好，我这就给你拿来。
        - id: ch01-b36
          speaker: narrator
          text: 奥兹走到橱柜前，从高高的搁板上取下一只绿色方瓶。他把瓶里的东西倒进一只雕刻精美、闪着绿金色光泽的碟子，然后摆到胆小的狮子面前。狮子凑过去闻了闻，看样子不太喜欢那个味道。
        - id: ch01-b37
          speaker: oz
          text: 把它喝下去吧。
        - id: ch01-b38
          speaker: cowardly_lion
          text: 这里面是什么？
        - id: ch01-b39
          speaker: oz
          text: 只要它进了你的肚子，它就是勇气。你也知道，勇气总得在身体里面。你还没咽下去，它就不能算是真正的勇气。所以，我劝你马上喝掉。
        - id: ch01-b40
          speaker: narrator
          text: 狮子这回不再迟疑。他低下头，一口接一口，把碟子喝得干干净净。
        - id: ch01-b41
          speaker: oz
          text: 现在感觉怎么样？
        - id: ch01-b42
          speaker: cowardly_lion
          text: 我肚子里已经装满勇气了！
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: 狮子欢天喜地地跑回朋友们身边，把自己的好运告诉了他们。
        - id: ch01-b44
          speaker: narrator
          text: 三位朋友走后，王座厅里只剩下奥兹一个人。他想到自己这回果真成功了，把稻草人、铁皮樵夫和狮子自以为想要的东西一样不差地给了他们，忍不住独自笑了起来。
        - id: ch01-b45
          speaker: oz
          text: 大家非逼我去做明明谁也办不到的事，我怎么可能不当骗子呢？哄稻草人、狮子和铁皮樵夫高兴，倒是很容易，因为他们心里认定我什么都能做。可要把多萝茜送回堪萨斯，光凭想象根本不行。这件事，我是真的一点办法也没有。
