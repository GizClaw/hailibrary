  chapters:
    - id: ch01
      title: Chapter XVI The Magic Art of the Great Humbug
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next morning, the Scarecrow came to his friends with an
            announcement.
        - id: ch01-b02
          speaker: scarecrow
          text: >-
            Congratulate me! At last, I'm going to Oz for my brains. When I
            come back, I'll be just like other men.
          emotion: happy
        - id: ch01-b03
          speaker: dorothy
          text: I always liked you just as you were.
        - id: ch01-b04
          speaker: scarecrow
          text: >-
            That's kind of you, especially since I'm only a Scarecrow. But
            wait until you hear all the wonderful thoughts my new brain comes
            up with. Then you'll think even more of me.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He cheerfully said good-bye to everyone and went to the Throne
            Room. When he knocked, Oz called for him to enter. The little man
            was sitting by the window, deep in thought.
        - id: ch01-b06
          speaker: scarecrow
          text: I've come to get my brains.
        - id: ch01-b07
          speaker: narrator
          text: The Scarecrow sounded a little uneasy.
        - id: ch01-b08
          speaker: oz
          text: >-
            Oh, yes. Please sit in that chair. You'll have to excuse me for
            taking off your head, but that's the only way I can put your
            brains where they belong.
        - id: ch01-b09
          speaker: scarecrow
          text: >-
            I don't mind. You may take my head off, as long as it's a better
            head when you put it back.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The Wizard unfastened the Scarecrow's head and emptied out its
            straw. Then he carried the empty head into the back room. There he
            measured out some bran and added a great many pins and needles. He
            shook them together until they were thoroughly mixed. That
            mixture went into the top of the Scarecrow's head. Oz filled all
            the space that remained with straw so the new brains would stay
            where he put them.
        - id: ch01-b11
          speaker: narrator
          text: Oz fastened the head back onto the Scarecrow's body.
        - id: ch01-b12
          speaker: oz
          text: >-
            From now on, you'll be a great man. I've given you plenty of
            bran-new brains.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The Scarecrow was proud and delighted. His greatest wish had come
            true at last. After thanking Oz warmly, he went straight back to
            his friends so they could see the result. Dorothy studied him with
            curiosity. His head had quite a bulge at the top now, because that
            was where Oz had put the brains.
        - id: ch01-b14
          speaker: dorothy
          text: How do you feel?
        - id: ch01-b15
          speaker: scarecrow
          text: >-
            Very wise indeed. Once I get used to having brains, I'll know
            everything.
        - id: ch01-b16
          speaker: tin_woodman
          text: Then why are pins and needles poking out of your head?
        - id: ch01-b17
          speaker: cowardly_lion
          text: They prove how sharp he is.
        - id: ch01-b18
          speaker: tin_woodman
          text: Well, now it's my turn. I'm going to Oz for my heart.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The Tin Woodman walked to the Throne Room and knocked. Oz called
            him inside, and the Woodman entered.
        - id: ch01-b20
          speaker: tin_woodman
          text: I've come to get my heart.
        - id: ch01-b21
          speaker: oz
          text: >-
            Very well. I'll need to cut a hole in your chest so I can put the
            heart in its proper place. I hope it won't hurt.
        - id: ch01-b22
          speaker: tin_woodman
          text: Oh, it won't. I won't feel a thing.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Oz fetched a pair of tinsmith's shears. He cut a small square hole
            in the left side of the Woodman's tin chest, right where the heart
            ought to go. Then he opened a chest of drawers and brought out a
            lovely heart. It was made entirely of silk and stuffed full of
            sawdust.
        - id: ch01-b24
          speaker: oz
          text: Isn't it beautiful?
        - id: ch01-b25
          speaker: tin_woodman
          text: It certainly is! But tell me, is it a kind heart?
          emotion: happy
        - id: ch01-b26
          speaker: oz
          text: Oh, it's very kind.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Oz placed the heart inside the Woodman's chest. Then he put the
            square piece of tin back and neatly soldered the cut closed.
        - id: ch01-b28
          speaker: oz
          text: >-
            There you are. Now you have a heart that would make any man proud.
            I'm sorry about the patch on your chest, but there was no other
            way.
        - id: ch01-b29
          speaker: tin_woodman
          text: >-
            The patch doesn't matter at all! I'm deeply grateful, and I'll
            never forget how kind you've been.
          emotion: happy
        - id: ch01-b30
          speaker: oz
          text: Think nothing of it.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The happy Tin Woodman returned to his friends. They all wished him
            joy in his good fortune.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Next, the Lion went to the Throne Room and knocked. Oz told him to
            come in.
        - id: ch01-b33
          speaker: cowardly_lion
          text: I've come for my courage.
        - id: ch01-b34
          speaker: oz
          text: Very well. I'll get it for you.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The little man went to a cupboard and reached up to a high shelf.
            From there, he took down a square green bottle. He poured
            everything in it into a green-and-gold dish covered in beautiful
            carvings. Oz placed the dish before the Cowardly Lion. The Lion
            sniffed at the liquid, and the smell did not seem to please him.
        - id: ch01-b36
          speaker: oz
          text: Drink it.
        - id: ch01-b37
          speaker: cowardly_lion
          text: What is it?
        - id: ch01-b38
          speaker: oz
          text: >-
            Once it's inside you, it will be courage. Courage always has to be
            inside a person, you know. So this can't truly be called courage
            until you swallow it. You'd better drink it right away.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The Lion stopped hesitating. He drank until the green-gold dish
            was empty.
        - id: ch01-b40
          speaker: oz
          text: How do you feel now?
        - id: ch01-b41
          speaker: cowardly_lion
          text: Full of courage!
          emotion: happy
        - id: ch01-b42
          speaker: narrator
          text: >-
            The Lion joyfully returned to his friends and told them about his
            good fortune.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Oz was alone again. He smiled over how well he had given the
            Scarecrow, the Tin Woodman, and the Lion exactly what each one
            believed he wanted. All three of them had left him completely
            satisfied.
        - id: ch01-b44
          speaker: oz
          text: >-
            How can I help being a humbug when everyone makes me do things
            that can't be done? Making the Scarecrow, the Lion, and the
            Woodman happy was easy. They believed I could do anything. But
            sending Dorothy back to Kansas will take more than imagination.
            And I'm certain I have no idea how it can be done.
