audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    oz:
      display_name: 奥兹
      tts:
        delivery: 起初故作威严，露馅后局促软弱又善于辩解
        timbre: 略显苍老，声音灵活
        pace: 中等，心虚时稍快
        pitch: 中音
    citizen_1:
      display_name: 翡翠城居民甲
      tts:
        delivery: 质朴热诚，满怀敬意
        timbre: 明亮温厚
        pace: 中等
        pitch: 中音
    citizen_2:
      display_name: 翡翠城居民乙
      tts:
        delivery: 诚恳直率，带着依依不舍
        timbre: 柔和清晰
        pace: 中等
        pitch: 中高音
    citizen_3:
      display_name: 翡翠城居民丙
      tts:
        delivery: 朴实沉稳，语气恭敬
        timbre: 醇厚清楚
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十七章　气球怎样升上了天空
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一连三天，多萝茜都没有等到奥兹的消息。这三天，她过得很难熬，朋友们倒是个个快活又满足。
        - id: ch01-b02
          speaker: scarecrow
          text: 我的脑袋里已经有好多绝妙的念头了。可我不能告诉你们，因为那些念头，除了我自己，谁也听不懂。
        - id: ch01-b03
          speaker: narrator
          text: 铁皮樵夫每走一步，都能感觉到那颗心在胸膛里轻轻晃荡。他仔细体会了一番，告诉多萝茜，这颗心比他从前那颗血肉做的心更善良，也更温柔。狮子也有话要说。
        - id: ch01-b04
          speaker: cowardly_lion
          text: 这世上已经没有什么能吓住我了！就算来一支大军，或是十二头凶猛的卡利达，我也敢迎上去。
        - id: ch01-b05
          speaker: narrator
          text: 就这样，伙伴们对自己新得到的本领都很满意。小小的队伍里，只有多萝茜还不满足。她比任何时候都更想回到堪萨斯。
        - id: ch01-b06
          speaker: narrator
          text: 到了第四天，奥兹终于派人来叫她。多萝茜听见消息，欢喜极了，赶忙走进王座厅。奥兹见到她，态度十分亲切，还请她坐下说话。
        - id: ch01-b07
          speaker: oz
          text: 我想出办法了。你可以离开这个国家了。
        - id: ch01-b08
          speaker: dorothy
          text: 那我能回堪萨斯了吗？
        - id: ch01-b09
          speaker: oz
          text: 这个嘛，我还不敢保证。我连堪萨斯在哪个方向都不知道。咱们得先越过沙漠，只要过了沙漠，你再找回家的路，应该就容易多了。
        - id: ch01-b10
          speaker: dorothy
          text: 可我要怎么越过沙漠呢？
        - id: ch01-b11
          speaker: oz
          text: 我是乘气球来到这里的，你呢，是被旋风从空中带来的。所以我觉得，越过沙漠最好的办法，还是从天上走。旋风我可造不出来，不过我想了又想，觉得自己能做一只气球。
        - id: ch01-b12
          speaker: dorothy
          text: 气球要怎么做？
        - id: ch01-b13
          speaker: oz
          text: 先用丝绸做成大袋子，再涂上胶，里面的气体就跑不掉了。王宫里的丝绸多得很，这一步不难。麻烦的是，整个国家都没有能灌进气球、让它飘起来的气体。
        - id: ch01-b14
          speaker: dorothy
          text: 要是气球不能飘起来，对我们还有什么用呢？
        - id: ch01-b15
          speaker: oz
          text: 说得对。不过，我们可以往里面灌热空气。只是热空气不如那种气体可靠。万一它冷下来，气球就会掉进沙漠，到时候我们可就迷路了。
        - id: ch01-b16
          speaker: dorothy
          text: 我们？你也要跟我一起走？
          emotion: surprised
        - id: ch01-b17
          speaker: oz
          text: 当然。我早就受够了当骗子的日子。我一走出王宫，百姓很快就会发现我根本不是魔法师。他们知道受了骗，一定会生我的气。所以，我只能一天到晚关在这些屋子里，实在太闷了。我宁可跟你回堪萨斯，再到马戏团里生活。
        - id: ch01-b18
          speaker: dorothy
          text: 有你陪我一起走，我很高兴。
          emotion: happy
        - id: ch01-b19
          speaker: oz
          text: 谢谢你。来帮我缝丝绸吧，咱们马上动手做气球。
        - id: ch01-b20
          speaker: narrator
          text: 多萝茜拿来针线。奥兹把丝绸裁成一条条合适的形状，她就在旁边一条接一条地缝，动作又快，针脚又整齐。先缝浅绿色，再缝深绿色，接下来是翡翠绿。奥兹喜欢周围这些深深浅浅的绿色，便把它们全用在了气球上。
        - id: ch01-b21
          speaker: narrator
          text: 他们足足忙了三天，才把所有绸条缝到一起。眼前出现了一只二十多英尺长的绿色大绸袋。奥兹又在袋子里面仔细刷上一层薄胶，好让整个绸袋密不透气。等胶涂完，他宣布，气球做好了。
        - id: ch01-b22
          speaker: oz
          text: 还少一只让我们乘坐的篮子。
        - id: ch01-b23
          speaker: narrator
          text: 他派绿胡子卫兵取来一只大衣篮，再用许多绳子把篮子牢牢系在气球下面。
        - id: ch01-b24
          speaker: narrator
          text: 一切准备停当，奥兹便派人告诉百姓，自己要去云层里拜访一位了不起的魔法师兄弟。消息飞快传遍全城，人人都赶到王宫前面来看这场奇观。
        - id: ch01-b25
          speaker: narrator
          text: 奥兹命人把气球抬到王宫前面。百姓好奇地围着它，看个不停。铁皮樵夫已经劈好一大堆木柴，这时点起了火。奥兹把气球底部举在火焰上方，让升起的热气钻进绸袋。
        - id: ch01-b26
          speaker: narrator
          text: 气球渐渐鼓了起来，慢慢升向空中。最后，只剩下面的篮子还刚好碰着地面。奥兹爬进篮子，提高声音，对所有人宣布他的安排。
        - id: ch01-b27
          speaker: oz
          text: 我要出门拜访朋友。我不在的时候，由稻草人来治理你们。你们要听从他的命令，就像从前听从我一样。
        - id: ch01-b28
          speaker: narrator
          text: 这时候，气球已经把拴在地上的绳索扯得紧紧的。袋子里的空气烧得很热，分量比外面的空气轻了许多。气球有了向上的力量，便使劲向天空挣去。
        - id: ch01-b29
          speaker: oz
          text: 多萝茜，快来！再不快点，气球就要飞走了！
        - id: ch01-b30
          speaker: dorothy
          text: 我找不到托托了！到处都没有他！
        - id: ch01-b31
          speaker: narrator
          text: 多萝茜不肯把小狗独自留下。原来，托托钻进人群里，正冲着一只小猫叫个不停。她终于找到了托托，一把将他抱起来，转身朝气球跑去。
        - id: ch01-b32
          speaker: narrator
          text: 只差几步了。奥兹也从篮子里伸出双手，正要拉多萝茜上去。就在这时，啪的一声，绳索断了。气球丢下她，径直升上天空。
        - id: ch01-b33
          speaker: dorothy
          text: 快回来！我也要走！
        - id: ch01-b34
          speaker: oz
          text: 我回不去了，亲爱的。再见！
        - id: ch01-b35
          speakers: [scarecrow, tin_woodman, cowardly_lion, citizen_1]
          ensemble: chorus
          text: 再见了，奥兹！
        - id: ch01-b36
          speaker: narrator
          text: 地上的所有人都抬起头，目光紧紧跟着魔法师。只见他站在篮子里，越升越高，越飞越远，最后只剩在高高的天空里。
        - id: ch01-b37
          speaker: narrator
          text: 从那以后，再也没有人见过伟大的魔法师奥兹。也许他平安飞到了奥马哈，如今还住在那里呢。这件事，谁也说不准。可是翡翠城的百姓一直深深记着他，常常这样彼此说道。
        - id: ch01-b38
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 奥兹永远是我们的朋友。他在这里的时候，为我们建造了美丽的翡翠城。如今他走了，又把聪明的稻草人留给我们，让他来治理这座城。
        - id: ch01-b39
          speaker: narrator
          text: 尽管这样，百姓还是为伟大魔法师的离去难过了许多天，谁也安慰不了他们。
