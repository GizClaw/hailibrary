  chapters:
    - id: ch01
      title: Chapter XVII How the Balloon Was Launched
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Three days passed, and Dorothy heard nothing from Oz. She was sad,
            and each day felt heavy to her. Her friends, though, were perfectly
            happy and content. The Scarecrow said his head was full of wonderful
            thoughts. He wouldn't tell anyone what they were, because he was
            sure no one else could understand them.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Whenever the Tin Woodman walked, he felt his new heart rattling in
            his chest. He told Dorothy it was kinder and more tender than the
            heart he'd had when he was made of flesh. The Lion said he wasn't
            afraid of anything on earth anymore. If he had to, he'd gladly face
            a whole army, or even a dozen of the fierce Kalidahs.
        - id: ch01-b03
          speaker: narrator
          text: >-
            So everyone in the little party was satisfied except Dorothy. She
            wanted to go home to Kansas more than ever.
        - id: ch01-b04
          speaker: narrator
          text: >-
            On the fourth day, Oz finally sent for her. Dorothy hurried to the
            Throne Room, and the little man welcomed her pleasantly.
        - id: ch01-b05
          speaker: oz
          text: >-
            Sit down, my dear. I think I've found a way to get you out of this
            country.
        - id: ch01-b06
          speaker: dorothy
          text: And will it get me back to Kansas?
        - id: ch01-b07
          speaker: oz
          text: >-
            I can't promise Kansas, because I have no idea which direction it
            is. First, you have to cross the desert. Once you're on the other
            side, finding your way home ought to be easy.
        - id: ch01-b08
          speaker: dorothy
          text: But how am I supposed to cross the desert?
        - id: ch01-b09
          speaker: oz
          text: >-
            Here's my idea. I arrived in this country in a balloon, and a
            cyclone carried you here through the air. So the best way across
            the desert may be through the air, too. I can't make a cyclone, of
            course. But after thinking it over, I believe I can build a balloon.
        - id: ch01-b10
          speaker: dorothy
          text: How would you do that?
        - id: ch01-b11
          speaker: oz
          text: >-
            You make a balloon from silk, then coat the silk with glue so the
            gas can't escape. There's plenty of silk here in the Palace, so
            making the balloon won't be hard. The trouble is, there's no gas
            anywhere in this country to fill it and lift it up.
        - id: ch01-b12
          speaker: dorothy
          text: If it can't rise, then it won't help us at all.
        - id: ch01-b13
          speaker: oz
          text: >-
            That's true. But we can fill it with hot air instead. Hot air isn't
            as good as gas. If it cools while we're over the desert, the balloon
            will come down, and we'll be lost.
        - id: ch01-b14
          speaker: dorothy
          text: We're going together? You're coming with me?
          emotion: surprised
        - id: ch01-b15
          speaker: oz
          text: >-
            Of course. I'm tired of pretending to be a Wizard. If I walk out of
            the Palace, my people will soon learn the truth, and they'll be
            angry that I fooled them. So I'm trapped in these rooms all day,
            day after day, and I'm weary of it. I'd rather go back to Kansas
            with you and join a circus again.
        - id: ch01-b16
          speaker: dorothy
          text: I'll be glad to have you along.
        - id: ch01-b17
          speaker: oz
          text: >-
            Thank you. Now, help me stitch the silk together, and we'll get to
            work on our balloon.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Dorothy picked up a needle and thread. Oz cut the silk into the
            right shapes, and as fast as he cut, she neatly sewed each piece to
            the next. First came a strip of light green silk, then one of dark
            green, and then one of emerald green. Oz liked the idea of making
            the balloon in different shades of the color all around them.
        - id: ch01-b19
          speaker: narrator
          text: >-
            It took them three full days to sew all the strips together. When
            they finished, they had a huge green silk bag more than twenty feet
            long. Oz painted the whole inside with a coat of thin glue so no air
            could escape. Then he declared that the balloon was ready.
        - id: ch01-b20
          speaker: oz
          text: We still need a basket to ride in.
        - id: ch01-b21
          speaker: narrator
          text: >-
            He sent the soldier with the green whiskers to fetch a large
            clothes basket, then tied it beneath the balloon with many ropes.
        - id: ch01-b22
          speaker: narrator
          text: >-
            When everything was prepared, Oz announced that he was going to
            visit a great brother Wizard who lived in the clouds. The news flew
            quickly from one person to another all through the city. Soon,
            everyone had come to watch the wonderful sight.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The balloon was carried to the front of the Palace, where the
            people stared at it curiously. The Tin Woodman chopped a great pile
            of wood and lit it. Oz held the mouth of the balloon above the fire
            so the rising hot air would fill the silk bag.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Slowly, the balloon swelled and lifted. At last, only the basket
            remained touching the ground. Oz climbed inside and called out to
            all his people.
        - id: ch01-b25
          speaker: oz
          text: >-
            I am leaving now to make my visit. While I'm away, the Scarecrow
            will be your ruler. You must obey him just as you have obeyed me.
        - id: ch01-b26
          speaker: narrator
          text: >-
            By then, the balloon was pulling hard against the rope that held it
            down. The air inside was hot and much lighter than the air outside,
            so the balloon strained to climb into the sky.
        - id: ch01-b27
          speaker: oz
          text: Dorothy, come on! Hurry, or the balloon will leave without us!
        - id: ch01-b28
          speaker: dorothy
          text: I can't find Toto! I won't leave my little dog behind.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Toto had darted into the crowd to bark at a kitten. Dorothy finally
            found him, scooped him up, and ran toward the balloon.
        - id: ch01-b30
          speaker: narrator
          text: >-
            She was only a few steps away. Oz reached out both hands to pull
            her into the basket. Then, with a sharp crack, the ropes broke. The
            balloon shot into the air without her.
        - id: ch01-b31
          speaker: dorothy
          text: Come back! I want to go with you!
        - id: ch01-b32
          speaker: oz
          text: I can't come back, my dear. Good-bye!
        - id: ch01-b33
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: Good-bye!
        - id: ch01-b34
          speaker: narrator
          text: >-
            Everyone looked up as the Wizard rode away in the basket, climbing
            higher and higher into the sky. Every eye followed him as he grew
            farther and farther away.
        - id: ch01-b35
          speaker: narrator
          text: >-
            No one ever saw Oz, the Wonderful Wizard, again. Perhaps he reached
            Omaha safely and is still there now, for all we know. The people
            remembered him with love, and spoke about him among themselves.
        - id: ch01-b36
          speaker: citizen_1
          text: >-
            Oz was always our friend. He built this beautiful Emerald City for
            us, and now that he's gone, he has left the Wise Scarecrow to rule
            us.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Still, the people grieved for many days over the loss of the
            Wonderful Wizard, and nothing could comfort them.
