audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
  chapters:
    - id: ch01
      title: 第七章　前往伟大奥兹的旅程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天夜里，附近找不到房子，大家只好睡在森林的一棵大树下。浓密的枝叶替他们挡住露水。铁皮樵夫劈来一大堆木柴，多萝茜生起旺旺的篝火。身上暖了，她心里也不那么孤单了。她和托托吃完最后一点面包，却不知道明早还能吃些什么。
        - id: ch01-b02
          speaker: cowardly_lion
          text: 你要是愿意，我就到林子里猎一头鹿。你们偏偏喜欢熟食，口味真奇怪。把鹿肉架在火上烤一烤，明早正好吃顿丰盛的早餐。
        - id: ch01-b03
          speaker: tin_woodman
          text: 别去，千万别去！你杀了可怜的鹿，我一定会哭。眼泪一流，我的下巴又要锈住了。
        - id: ch01-b04
          speaker: narrator
          text: 狮子还是钻进森林，自己找晚饭去了。谁也不知道他究竟吃了什么，他后来从没提过。稻草人找到一棵结满坚果的树，把多萝茜的篮子装得满满的，够她吃上很久。多萝茜觉得他又体贴又好心。可看着这个可怜的家伙弯腰捡坚果，她还是忍不住笑出了声。那双塞着填料的手实在太笨了，坚果偏偏又很小。他放进篮子多少，差不多就要掉出来多少。
        - id: ch01-b05
          speaker: narrator
          text: 稻草人并不在乎要花多久才能装满篮子。慢慢捡正合他的心意，这样他就能一直躲着篝火，免得一颗火星钻进稻草，把自己烧个精光。他始终站得离火焰远远的。直到多萝茜躺下睡觉，他才走过去，把干树叶盖在她身上。树叶裹得她又舒服又暖和，她沉沉睡去，一直睡到天亮。
        - id: ch01-b06
          speaker: narrator
          text: 天亮了，多萝茜在潺潺的小溪里洗过脸，大家没多久就重新出发，继续朝翡翠城走去。这一天，他们要遇上的事情可不少。
        - id: ch01-b07
          speaker: narrator
          text: 走了还不到一个钟头，一道大沟突然挡住去路。它横穿道路，也把森林分成两边。朝左看，朝右看，都望不到沟的尽头。大家小心爬到边沿，探头往下一看，这才发现它不但很宽，还深得吓人。沟底尽是尖利嶙峋的大石头，两面的沟壁又陡得谁也爬不下去。有那么一会儿，他们觉得这趟旅程只能停在这里了。
        - id: ch01-b08
          speaker: dorothy
          text: 这可怎么办？
          emotion: sad
        - id: ch01-b09
          speaker: tin_woodman
          text: 我真的一点办法都想不出来。
        - id: ch01-b10
          speaker: narrator
          text: 狮子摇了摇蓬松的鬃毛，望着深沟认真思索。稻草人倒先开了口。
        - id: ch01-b11
          speaker: scarecrow
          text: 我们不会飞，也爬不下去。要是连跳也跳不过这道沟，那就只能留在这里了。
        - id: ch01-b12
          speaker: narrator
          text: 胆小的狮子仔细估量了一番距离。
        - id: ch01-b13
          speaker: cowardly_lion
          text: 我想，我应该能跳到对面。
        - id: ch01-b14
          speaker: scarecrow
          text: 那就好办了。你背着我们，一个一个跳过去。
        - id: ch01-b15
          speaker: cowardly_lion
          text: 好吧，我试一试。谁愿意先来？
        - id: ch01-b16
          speaker: scarecrow
          text: 我先来。要是你跳不过去，多萝茜会摔死，铁皮樵夫也会撞在石头上，凹得不成样子。可我摔下去也不会受伤，背我最合适。
        - id: ch01-b17
          speaker: cowardly_lion
          text: 其实我也怕掉下去，怕得厉害。可除了试试，再没有别的办法了。你上来吧，我们跳一次。
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: 稻草人坐到狮子背上。狮子走到沟边，伏低了身子。
        - id: ch01-b19
          speaker: scarecrow
          text: 你怎么不先跑起来，再往前跳？
        - id: ch01-b20
          speaker: cowardly_lion
          text: 我们狮子跳远，从来不需要助跑。
        - id: ch01-b21
          speaker: narrator
          text: 狮子猛然一跃，飞过深沟，稳稳落到对面。大家见他跳得这样轻松，都高兴极了。稻草人下来以后，狮子又跳回原地。
        - id: ch01-b22
          speaker: narrator
          text: 接着轮到多萝茜。她把托托抱在怀里，爬到狮子背上，一只手紧紧抓住他的鬃毛。下一刻，她只觉得自己飞在空中。还没来得及想明白是怎么回事，就已经平安到了对岸。狮子第三次跳回去，把铁皮樵夫也接了过来。等伙伴们全都过了沟，大家坐下歇了一会儿。几次大跳让狮子上气不接下气，他喘得就像一条跑了太久的大狗。
        - id: ch01-b23
          speaker: narrator
          text: 深沟这一边的森林更加茂密，四周显得又黑又阴森。狮子休息好了，大家便沿着黄砖路继续往前走。一路上谁也没说话，心里却都在悄悄地想，他们究竟什么时候才能走出树林，再见到明亮的阳光。更叫人难受的是，没过多久，森林深处又传来一阵阵古怪的声响。狮子压低嗓门告诉大家，卡利达就住在这一带。
        - id: ch01-b24
          speaker: dorothy
          text: 卡利达是什么东西？
        - id: ch01-b25
          speaker: cowardly_lion
          text: 它们是怪兽，身子像熊，脑袋像老虎。那爪子又长又尖，撕开我就跟我咬死托托一样容易。我实在怕极了。
          emotion: fearful
        - id: ch01-b26
          speaker: dorothy
          text: 你会害怕也不奇怪。那一定是非常可怕的怪兽。
        - id: ch01-b27
          speaker: narrator
          text: 狮子正要回答，前面忽然又出现一道截断道路的深沟。这一道比刚才那道更宽，也更深。狮子只看一眼就知道，无论如何也跳不过去。大家只得坐下来，一起琢磨该怎么办。稻草人认真想了好一阵，终于有了主意。
        - id: ch01-b28
          speaker: scarecrow
          text: 沟边就有一棵大树。让铁皮樵夫把它砍倒，树干横到对岸，我们就能从上面走过去。
        - id: ch01-b29
          speaker: cowardly_lion
          text: 这主意真不错。听起来，你脑袋里装的简直像是脑子，不像稻草。
        - id: ch01-b30
          speaker: narrator
          text: 铁皮樵夫马上挥起斧头。斧刃十分锋利，没多久，树干就快断了。狮子用两条强壮的前腿抵住大树，拼尽力气往前推。大树一点点倒下，轰的一声架在深沟上，树冠刚好落在对岸。
        - id: ch01-b31
          speaker: narrator
          text: 大家刚走上这座奇怪的桥，一声尖厉的吼叫就让他们抬起了头。两头庞然大物正朝这里冲来，长着熊一样的身体和老虎一样的脑袋。看清它们，大家全吓坏了。
        - id: ch01-b32
          speaker: cowardly_lion
          text: 是卡利达！
          emotion: fearful
        - id: ch01-b33
          speaker: scarecrow
          text: 快，快过桥！
          emotion: fearful
        - id: ch01-b34
          speaker: narrator
          text: 多萝茜抱着托托，第一个走上树桥。铁皮樵夫紧随其后，接着轮到稻草人。狮子明明怕得发抖，却没有马上逃走。他转过身去，正面迎着两头卡利达，随后爆发出一声震耳欲聋的怒吼。多萝茜吓得尖叫起来，稻草人一下仰面摔倒。连那两头凶猛的怪兽也猛地停住脚步，惊讶地望着他。
        - id: ch01-b35
          speaker: narrator
          text: 可卡利达看出自己比狮子高大，还想到它们有两个，狮子只有一个，便再次猛扑上来。狮子跑过树桥，转身望着它们。两头猛兽片刻不停，也踏上树干追了过来。
        - id: ch01-b36
          speaker: cowardly_lion
          text: 我们逃不掉了。它们一定会用利爪把我们撕碎。多萝茜，你紧紧站在我身后。只要我还活着，就会一直跟它们打下去。
          emotion: fearful
        - id: ch01-b37
          speaker: scarecrow
          text: 先别慌，等一下！
        - id: ch01-b38
          speaker: narrator
          text: 稻草人刚才一直在想，怎样做才最好。这时，他赶紧叫铁皮樵夫砍断树干搭在他们这边的一头。铁皮樵夫马上挥起斧头。两头卡利达已经快走过来了，就在这时，大树轰隆一声坠进深沟，把那两头丑陋而咆哮的猛兽也一起带了下去。它们重重撞上沟底的尖石，全都摔得粉碎。
        - id: ch01-b39
          speaker: cowardly_lion
          text: 好了，看来我们还能再活一阵子。我真高兴，毕竟死掉一定很不好受。那两个家伙把我吓得够呛，我的心到现在还在跳。
        - id: ch01-b40
          speaker: tin_woodman
          text: 唉，我倒真希望自己也有一颗会跳的心。
          emotion: sad
        - id: ch01-b41
          speaker: narrator
          text: 这一场危险过去，大家比先前更想赶快离开森林。他们走得越来越快，多萝茜累得再也走不动了，只好骑到狮子的背上。越往前走，树木就变得越稀疏，所有人都为此高兴。到了下午，他们忽然来到一条宽阔的大河前。湍急的河水就在眼前奔流，把去路完全挡住了。
        - id: ch01-b42
          speaker: narrator
          text: 河对岸，黄砖路伸进一片美丽的乡野，一直通向远方。绿色的草地上开满鲜艳的花朵，道路两旁全是果树，枝头挂满了诱人的果实。看着眼前这片明亮又美好的地方，大家别提有多高兴了。
        - id: ch01-b43
          speaker: dorothy
          text: 我们要怎么过河呢？
        - id: ch01-b44
          speaker: scarecrow
          text: 这很容易。让铁皮樵夫造一只木筏，我们坐着它漂到对岸。
        - id: ch01-b45
          speaker: narrator
          text: 铁皮樵夫拿起斧头，砍下小树来造木筏。稻草人在河岸找到一棵果树，上面结满了好果子。多萝茜一整天只吃过坚果，这回可高兴了，摘下熟透的果子，饱饱吃了一顿。
        - id: ch01-b46
          speaker: narrator
          text: 可造木筏总要花些时间。就算铁皮樵夫既勤快又不知疲倦，夜幕降临时，木筏还是没能做好。大家便在树下找了个舒服的地方，安安稳稳睡到早晨。多萝茜梦见了翡翠城，也梦见了善良的奥兹大巫师。在梦里，奥兹很快就会把她送回自己的家乡。
