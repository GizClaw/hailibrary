audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    scarecrow:
      display_name: Scarecrow
      tts:
        delivery: friendly and guileless
        timbre: dry and husky
        pace: easy
        pitch: medium
    tin_woodman:
      display_name: Tin Woodman
      tts:
        delivery: courteous and earnest
        timbre: resonant and metallic
        pace: deliberate
        pitch: medium-low
    cowardly_lion:
      display_name: Cowardly Lion
      tts:
        delivery: grand but tenderhearted
        timbre: deep and rumbling
        pace: natural
        pitch: low
  chapters:
    - id: ch01
      title: A Night in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            That night, they had to camp beneath a large tree in the forest.
            There were no houses anywhere nearby. The tree's thick branches
            sheltered them from the dew. The Tin Woodman cut a great pile of
            firewood, and Dorothy built a splendid fire. Its warmth made her
            feel less lonely.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Dorothy and Toto ate the last of their bread. Now she had no idea
            what they would eat for breakfast.
        - id: ch01-b03
          speaker: cowardly_lion
          text: >-
            If you'd like, I'll go into the woods and kill a deer for you. You
            can roast it over the fire. Since you have the strange habit of
            eating cooked food, that should make you a fine breakfast.
        - id: ch01-b04
          speaker: tin_woodman
          text: >-
            Oh, please don't! If you killed a poor deer, I'd surely cry, and my
            jaws would rust again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Lion went into the forest anyway and found his own supper. No
            one ever learned what it was because he never said. Meanwhile, the
            Scarecrow found a tree covered with nuts. He began filling
            Dorothy's basket so she would have plenty to eat for a long while.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Dorothy thought that was wonderfully kind of him. Still, she
            couldn't help laughing at the clumsy way he gathered the nuts. His
            stuffed hands were much too awkward for anything so small. He
            dropped nearly as many nuts as he placed in the basket.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The Scarecrow didn't care how long the work took. Gathering nuts
            kept him safely away from the fire, where a single spark might set
            his straw alight. He stayed well back from the flames. Only when
            Dorothy lay down did he come close enough to cover her with dry
            leaves. They kept her snug and warm, and she slept soundly until
            morning.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At daylight, Dorothy washed her face in a little rippling brook.
            Soon afterward, they all set off again toward the Emerald City.
    - id: ch02
      title: Across the Great Ditch
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It was going to be an eventful day. They had walked for barely an
            hour when a great ditch appeared ahead of them. It cut straight
            across the road and divided the forest as far as they could see in
            either direction.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The ditch was terribly wide. When they crept to the edge and
            peered down, they saw that it was terribly deep as well. Big,
            jagged rocks covered the bottom. Its sides were too steep to climb,
            and for a moment it looked as though their journey had come to an
            end.
        - id: ch02-b03
          speaker: dorothy
          text: What can we possibly do now?
          emotion: sad
        - id: ch02-b04
          speaker: tin_woodman
          text: I haven't the slightest idea.
        - id: ch02-b05
          speaker: narrator
          text: The Lion shook his shaggy mane and thought hard.
        - id: ch02-b06
          speaker: scarecrow
          text: >-
            We certainly can't fly, and we can't climb down into that enormous
            ditch. If we can't jump across, we'll have to stop right here.
        - id: ch02-b07
          speaker: cowardly_lion
          text: I believe I could jump it.
        - id: ch02-b08
          speaker: narrator
          text: He had carefully judged the distance in his mind.
        - id: ch02-b09
          speaker: scarecrow
          text: >-
            Then our trouble is solved. You can take us across on your back,
            one at a time.
        - id: ch02-b10
          speaker: cowardly_lion
          text: Very well. I'll try. Who wants to go first?
        - id: ch02-b11
          speaker: scarecrow
          text: >-
            I do. If you can't make the jump with Dorothy, she could be killed.
            The Tin Woodman might be badly crushed on those rocks. But a fall
            wouldn't hurt me at all, so it matters much less if I go first.
        - id: ch02-b12
          speaker: cowardly_lion
          text: >-
            I'm terribly afraid of falling, too. But there seems to be nothing
            else we can do. Climb onto my back, and we'll try it.
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: >-
            The Scarecrow settled onto the Lion's back. The great beast walked
            to the very edge and crouched low.
        - id: ch02-b14
          speaker: scarecrow
          text: Aren't you going to take a running start?
        - id: ch02-b15
          speaker: cowardly_lion
          text: That isn't how Lions make a jump like this.
        - id: ch02-b16
          speaker: narrator
          text: >-
            With one mighty spring, the Lion sailed through the air and landed
            safely on the far side. Everyone was delighted by how easily he had
            done it. Once the Scarecrow climbed down, the Lion leaped back over
            the ditch.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Dorothy went next. She held Toto in her arms, climbed onto the
            Lion's back, and gripped his mane tightly with one hand. A moment
            later, she felt as if she were flying. Before she had time even to
            think, she and Toto were safe across.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The Lion returned a third time for the Tin Woodman. When everyone
            was together again, they sat down and let him rest. Those huge
            leaps had left him short of breath, and he panted like a big dog
            that had run too far.
    - id: ch03
      title: The Kalidahs
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            On this side of the ditch, the forest was even thicker. It looked
            dark and gloomy. After the Lion had caught his breath, they
            followed the yellow brick road again. Each traveler silently
            wondered whether the woods would ever end and the bright sunshine
            would ever return.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Before long, strange noises began to rise from deep among the
            trees, making the gloomy journey even more uncomfortable. The Lion
            lowered his voice and told the others that this was the part of the
            country where the Kalidahs lived.
        - id: ch03-b03
          speaker: dorothy
          text: What are Kalidahs?
        - id: ch03-b04
          speaker: cowardly_lion
          text: >-
            They're enormous beasts with bears' bodies and tigers' heads.
            Their claws are so long and sharp that they could rip me apart as
            easily as I could kill Toto. Kalidahs frighten me terribly.
          emotion: fearful
        - id: ch03-b05
          speaker: dorothy
          text: I can understand why. They sound dreadful.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Before the Lion could answer, they reached another gulf across the
            road. This one was so wide and so deep that he knew at once he
            could never leap over it.
        - id: ch03-b07
          speaker: narrator
          text: >-
            With no way to jump and no path around the gulf, they sat down
            together. For a long moment, they thought seriously about what
            they could possibly do.
        - id: ch03-b08
          speaker: scarecrow
          text: >-
            Look at that great tree beside the ditch. If the Tin Woodman chops
            it down so it falls across to the other side, we can simply walk
            over it.
        - id: ch03-b09
          speaker: cowardly_lion
          text: >-
            That's an excellent plan. Someone might almost think you had
            brains in your head instead of straw.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The Woodman started at once. His axe was so sharp that he soon cut
            nearly all the way through the trunk. Then the Lion braced his
            powerful front legs against the tree and pushed with all his
            strength. Slowly, the great tree tipped over. It crashed across the
            gulf, and its highest branches landed on the far side.
        - id: ch03-b11
          speaker: narrator
          text: >-
            They had only just stepped onto their strange new bridge when a
            sharp growl made everyone look back. Two huge creatures were
            racing straight toward them through the forest. The travelers
            stared in horror. The creatures had the bodies of bears and the
            heads of tigers, exactly as the Lion had described.
        - id: ch03-b12
          speaker: cowardly_lion
          text: Those are the Kalidahs!
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: The Lion began to tremble.
        - id: ch03-b14
          speaker: scarecrow
          text: Hurry! Everyone across!
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: >-
            Dorothy went first with Toto in her arms. The Tin Woodman followed,
            and then came the Scarecrow. The Lion was certainly afraid, but he
            turned and faced the Kalidahs. He let out such a loud and terrible
            roar that Dorothy screamed and the Scarecrow toppled backward.
            Even the fierce Kalidahs stopped and stared at him in surprise.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Then the beasts saw that they were larger than the Lion. There were
            two of them and only one of him. They charged again. The Lion
            hurried across the tree and turned to watch. Without pausing, the
            Kalidahs followed him onto the trunk.
        - id: ch03-b17
          speaker: cowardly_lion
          text: >-
            We're lost. They'll tear every one of us apart with those terrible
            claws. Stay close behind me. I'll fight them for as long as I'm
            alive.
          emotion: fearful
        - id: ch03-b18
          speaker: scarecrow
          text: Wait! Tin Woodman, chop through the end of the tree on our side!
        - id: ch03-b19
          speaker: narrator
          text: >-
            The Scarecrow had found their only chance. The Tin Woodman swung
            his axe immediately. Just as the two Kalidahs were almost across,
            the tree broke loose and plunged into the gulf. It carried the
            snarling beasts with it, and both were dashed to pieces on the
            sharp rocks far below.
        - id: ch03-b20
          speaker: narrator
          text: The Lion drew a long breath of relief.
        - id: ch03-b21
          speaker: cowardly_lion
          text: >-
            Well, it seems we'll stay alive a little longer. I'm glad, because
            not being alive must be very uncomfortable. Those creatures scared
            me so badly that my heart is still pounding.
        - id: ch03-b22
          speaker: tin_woodman
          text: Oh, how I wish I had a heart that could pound.
          emotion: sad
    - id: ch04
      title: The River
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After that adventure, the travelers wanted more than ever to escape
            the forest. They walked so quickly that Dorothy soon grew tired and
            had to ride on the Lion's back.
        - id: ch04-b02
          speaker: narrator
          text: >-
            To their great joy, the trees thinned as they went on. Then, during
            the afternoon, they suddenly came to a wide river flowing swiftly
            across their path.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Beyond the water, they could see the yellow brick road crossing a
            beautiful countryside. Green meadows were sprinkled with bright
            flowers. Trees heavy with delicious fruit lined both sides of the
            road. The sight of that lovely land filled them all with pleasure.
        - id: ch04-b04
          speaker: dorothy
          text: How are we going to get across the river?
        - id: ch04-b05
          speaker: scarecrow
          text: >-
            That part is simple. The Tin Woodman can build a raft, and we'll
            float across on it.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The Woodman took up his axe and began cutting down small trees for
            the raft. While he worked, the Scarecrow discovered a tree on the
            riverbank covered in fine fruit. Dorothy was delighted. She had
            eaten nothing but nuts all day, and now she made a hearty meal of
            the ripe fruit.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Even an industrious Woodman who never grew tired needed time to
            chop the small trees and fit them into a raft. He kept working, but
            night arrived before he could finish. The travelers could go no
            farther until the raft was ready. So they found a cozy spot beneath
            the trees and slept there peacefully until morning.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Dorothy dreamed of the Emerald City and the good Wizard Oz, who
            would soon send her home again.
