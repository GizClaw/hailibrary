  chapters:
    - id: ch01
      title: Introduction
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Folklore, legends, myths, and fairy tales have been part of childhood
            for ages. Every healthy young person has a natural love for stories
            that are fantastic, marvelous, and clearly unreal. The winged fairies
            of Grimm and Andersen have brought more happiness to children's hearts
            than any other creations people have made.
        - id: ch01-b02
          speaker: narrator
          text: >-
            But the old-fashioned fairy tale has served children for generations,
            and now it belongs to history in the children's library. The time has
            come for newer wonder tales. They can leave out the familiar genies,
            dwarfs, and fairies, along with the horrible, blood-curdling events
            their authors used to teach a frightening moral. Modern education
            already includes morality. So the modern child looks to wonder tales
            for entertainment and is glad to do without those unpleasant events.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That is why The Wonderful Wizard of Oz was written simply to please
            the children of today. It hopes to be a modern fairy tale, keeping the
            wonder and joy while leaving out the heartaches and nightmares.
        - id: ch01-b04
          speaker: narrator
          text: >-
            L. Frank Baum. Chicago, April 1900.
