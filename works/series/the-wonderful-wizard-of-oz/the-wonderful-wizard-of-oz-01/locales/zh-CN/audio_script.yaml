audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 孩子与奇妙故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 民间故事、传说、神话和童话，世世代代陪着孩子长大。健康的孩子都本能地喜爱奇幻、神妙、明知不是真的故事。这份喜爱纯真又自然。格林和安徒生笔下长翅膀的仙子，给孩子带来的欢乐，比人类其他任何创造都多。
    - id: ch02
      title: 新时代的童话
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不过，古老童话已经陪过一代又一代人。如今在儿童图书馆里，它们或许该算作“历史”了。现在，该有一批新的“奇妙故事”了。故事里不必再出现老一套的神怪、侏儒和仙子，也可以拿掉种种恐怖情节。过去的作者写这些，是想给每个故事配上一则吓人的教训。如今，现代教育本就教人道德。孩子们读奇妙故事，只想得到乐趣，也乐得不再碰见不愉快的事情。
    - id: ch03
      title: 写给今天的孩子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 正因为这样，我才写下《神奇的奥兹国巫师》。它只有一个心愿，就是让今天的孩子高兴。我盼望这会是一篇新式的童话，留下神奇和欢乐，不再留下伤心事和噩梦。
        - id: ch03-b02
          speaker: narrator
          text: 这篇序言的作者是莱曼·弗兰克·鲍姆。
        - id: ch03-b03
          speaker: narrator
          text: 他于1900年4月写于芝加哥。
