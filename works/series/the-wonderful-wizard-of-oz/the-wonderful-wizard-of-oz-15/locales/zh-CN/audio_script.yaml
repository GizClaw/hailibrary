audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    queen_of_field_mice:
      display_name: 田鼠女王
      tts:
        delivery: 亲切利落，语气聪敏而热心
        timbre: 细亮轻盈
        pace: 轻快
        pitch: 高音
    winged_monkey_king:
      display_name: 飞猴王
      tts:
        delivery: 爽朗洒脱，讲述往事时生动坦率
        timbre: 明亮而略带沙哑
        pace: 灵活而清楚
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十四章　飞猴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你一定还记得，西方恶女巫的城堡和翡翠城之间没有大路，连一条小径也没有。四位旅人来找女巫时，女巫远远看见了他们，派飞猴把他们抓去。如今要靠双脚穿过大片的毛茛和黄色雏菊，自己找路回去，可比让飞猴带着走难多了。他们知道该朝日出的东方一直走，刚出发时方向也没有错。可到了中午，太阳就在头顶，他们分不清哪边是东、哪边是西，便在无边的花田里迷了路。大家还是继续往前。夜里，月亮出来，把四周照得明亮。他们就在芳香的黄花丛里沉沉睡到天亮，只有稻草人和铁皮樵夫一直醒着。
        - id: ch01-b02
          speaker: narrator
          text: 第二天，太阳藏在云后。他们照样出发，装得好像人人都知道方向似的。
        - id: ch01-b03
          speaker: dorothy
          text: 只要一直走下去，我相信我们早晚能走到一个地方。
        - id: ch01-b04
          speaker: narrator
          text: 可是一天接着一天过去，前面始终只有鲜红的花田。稻草人忍不住抱怨起来。
        - id: ch01-b05
          speaker: scarecrow
          text: 我们肯定迷路了。要是不赶快找回正路，及时赶到翡翠城，我这辈子都拿不到脑子啦。
        - id: ch01-b06
          speaker: tin_woodman
          text: 我也拿不到心了。我真恨不得马上见到奥兹。你们说，这趟路是不是长得过分？
        - id: ch01-b07
          speaker: cowardly_lion
          text: 这样走个没完，却哪里也到不了，我可没有勇气永远走下去。
        - id: ch01-b08
          speaker: narrator
          text: 狮子说着，声音都带上了呜咽。多萝茜也泄了气，坐在草地上望着伙伴，伙伴们也一个个坐下来望着她。一只蝴蝶从托托头顶飞过，他有生以来第一次累得连追也不想追，只伸着舌头呼哧呼哧喘气。他一直看着多萝茜，那副模样就像是在问，接下来该怎么办呢？
        - id: ch01-b09
          speaker: dorothy
          text: 我们叫田鼠来，好不好？它们大概知道去翡翠城的路。
        - id: ch01-b10
          speaker: scarecrow
          text: 它们当然知道！我们怎么早没想到呢？
        - id: ch01-b11
          speaker: narrator
          text: 多萝茜一直把田鼠女王送的小哨子挂在脖子上。她吹响哨子，没过多久，细小的脚步声就嗒嗒地传来。许多灰色小田鼠跑到她面前，女王也来了。
        - id: ch01-b12
          speaker: queen_of_field_mice
          text: 朋友们，要我帮什么忙呀？
        - id: ch01-b13
          speaker: dorothy
          text: 我们迷路了。你知道翡翠城在哪边吗？
        - id: ch01-b14
          speaker: queen_of_field_mice
          text: 当然知道。不过离这里远得很，因为你们一路都在背对着它走。咦，你戴着金帽，怎么不念帽子里的咒语，把飞猴叫来？它们不用一个小时就能送你们到奥兹之城。
        - id: ch01-b15
          speaker: dorothy
          text: 原来帽子里还有咒语？是什么咒语？
          emotion: surprised
        - id: ch01-b16
          speaker: queen_of_field_mice
          text: 就写在金帽里面。不过你要召来飞猴，我们可得先跑。那些家伙淘气得很，最爱捉弄我们取乐。
        - id: ch01-b17
          speaker: dorothy
          text: 它们不会伤害我吧？
          emotion: fearful
        - id: ch01-b18
          speaker: queen_of_field_mice
          text: 不会。谁戴着帽子，它们就得服从谁。再见啦！
        - id: ch01-b19
          speaker: narrator
          text: 女王一溜烟跑得无影无踪，所有田鼠也匆匆跟了上去。多萝茜往金帽里一瞧，衬里上果然写着几句话。她猜那就是咒语，于是仔细看完念咒的办法，把帽子戴好。
        - id: ch01-b20
          speaker: dorothy
          text: 埃佩，佩佩，卡克！
        - id: ch01-b21
          speaker: narrator
          text: 她说这句话时，只用左脚站着。
        - id: ch01-b22
          speaker: scarecrow
          text: 你刚才说什么？
        - id: ch01-b23
          speaker: narrator
          text: 稻草人还不知道她在做什么。多萝茜换成右脚站立，接着往下念。
        - id: ch01-b24
          speaker: dorothy
          text: 希洛，霍洛，赫洛！
        - id: ch01-b25
          speaker: tin_woodman
          text: 你好！
        - id: ch01-b26
          speaker: narrator
          text: 铁皮樵夫平静地回了一声。多萝茜把两只脚都放回地面，念出最后一句。
        - id: ch01-b27
          speaker: dorothy
          text: 齐齐，祖齐，齐克！
        - id: ch01-b28
          speaker: narrator
          text: 咒语刚念完，响亮的吱喳声和翅膀扑扇声便从空中传来。一大群飞猴落到了他们面前。猴王向多萝茜深深鞠躬。
        - id: ch01-b29
          speaker: winged_monkey_king
          text: 您要我们做什么？
        - id: ch01-b30
          speaker: dorothy
          text: 我们想去翡翠城，可是找不到路了。
        - id: ch01-b31
          speaker: winged_monkey_king
          text: 我们送你们去。
        - id: ch01-b32
          speaker: narrator
          text: 猴王话音一落，两只飞猴就用胳膊托起多萝茜，带她飞走。别的飞猴带上了稻草人、铁皮樵夫和狮子。一只小飞猴抓住托托，也追了上去，托托却一直拼命想咬他。
        - id: ch01-b33
          speaker: narrator
          text: 稻草人和铁皮樵夫起初很害怕。他们还清楚记得，飞猴上次是怎样把他们拆散、扔下的。可这一次，他们看出飞猴没有伤害自己的意思，这才放下心来，快活地乘风前行。一路上，他们从高空俯望地面，还兴致勃勃地欣赏着下面漂亮的花园和树林。
        - id: ch01-b34
          speaker: narrator
          text: 多萝茜坐在两只大飞猴中间，其中一只就是猴王。两只飞猴的手臂搭成一把椅子，托得又稳又小心。
        - id: ch01-b35
          speaker: dorothy
          text: 你们为什么一定要听金帽咒语的命令呢？
        - id: ch01-b36
          speaker: winged_monkey_king
          text: 这个故事很长。不过我们的路也很长。你想听的话，我正好讲给你听，路上也不会闷。
        - id: ch01-b37
          speaker: narrator
          text: 猴王说完，发出了飞猴特有的笑声。
        - id: ch01-b38
          speaker: dorothy
          text: 我很想听听。
        - id: ch01-b39
          speaker: winged_monkey_king
          text: 很久以前，我们是自由的族群，快快活活地住在大森林里。我们从一棵树飞到另一棵树，吃着坚果和果子，爱做什么就做什么，从不需要叫谁主人。有些猴子偶尔淘气过了头，会飞下去扯那些没有翅膀的动物的尾巴，会追赶鸟儿，还会用坚果丢走在林子里的人。可我们那时候无忧无虑，满脑子都是玩闹，每一天都过得痛快。这件事发生在许多年前，那时奥兹还没从云端来到这片国土，更没有做这里的统治者。
        - id: ch01-b40
          speaker: winged_monkey_king
          text: 那时，遥远的北方住着美丽的盖莱特公主。她还是一位法力强大的女巫，总用魔法帮助别人，从来没有人听说她伤害过好人。她住在一座宏伟的宫殿里，那座宫殿是用一块块巨大的红宝石砌成的。人人都爱她，可她最大的悲哀，就是找不到一个自己也能爱的人。那些男人不是太蠢，就是太丑，谁也配不上她的美貌和智慧。后来，她终于遇到一个英俊、有气概的少年。少年虽然年纪不大，聪明才智却远远超过同龄人。盖莱特决定，等他长大成人，就让他做自己的丈夫。她把少年接进红宝石宫殿，用全部魔法让他变得强健、善良又可爱，成为任何女人都会称心的人。这个少年叫奎拉拉。等他成年，人们都说他是全国最好、最聪明的人，又生得英武俊美。盖莱特深深爱着他，马上开始筹备婚礼。
        - id: ch01-b41
          speaker: winged_monkey_king
          text: 我的祖父当时是飞猴之王，统领着盖莱特宫殿附近森林里的猴群。那老家伙爱开玩笑，胜过爱吃一顿美餐。就在婚礼前的一天，他带着猴群飞出去，看见奎拉拉沿着河边散步。奎拉拉穿着一身华贵的衣裳，粉红色丝绸配着紫色天鹅绒。祖父一看，便想试试能怎样捉弄他。他一声令下，整群飞猴马上俯冲下去，抓住奎拉拉，用胳膊托着他飞到河流正中央，再松开手，把他丢进水里。
        - id: ch01-b42
          speaker: winged_monkey_king
          text: 祖父还在上面喊，漂亮小伙子，游上来呀，顺便看看河水把你的衣裳弄花了没有！奎拉拉很聪明，当然不会傻到不肯游泳。虽说一直十分幸运，他却半点也没有被惯坏。他从水里冒出头时还笑了，然后自己游回岸边。可盖莱特匆匆赶来一看，他身上的丝绸和天鹅绒全让河水毁了。
        - id: ch01-b43
          speaker: winged_monkey_king
          text: 公主气坏了，当然也知道这是谁干的。她把所有飞猴抓到面前，起先说，要捆住我们的翅膀，也照我们对待奎拉拉的办法，把我们丢进河里。祖父拼命求饶，因为他知道，飞猴绑住翅膀掉进水里，一定会淹死。奎拉拉心地善良，也替我们说了好话。盖莱特终于答应饶命，但有一个条件。从今以后，不管谁拥有金帽，我们都得替帽子的主人完成三次命令。金帽本来是她送给奎拉拉的结婚礼物，据说花掉了她半个王国。祖父和其他猴子当然马上答应下来。所以，不论金帽落到谁手里，我们都要三次服从他，做他的奴仆。
        - id: ch01-b44
          speaker: dorothy
          text: 后来，他们怎么样了？
        - id: ch01-b45
          speaker: narrator
          text: 多萝茜已经完全听入了神。
        - id: ch01-b46
          speaker: winged_monkey_king
          text: 奎拉拉是金帽的第一位主人，也是第一个向我们提出要求的人。他和盖莱特结婚以后，因为新娘一看见我们就受不了，便把我们全都召到森林里，命令我们永远待在她看不见的地方，绝不能再让一只飞猴出现在她眼前。我们倒很乐意服从，因为大家都很怕她。
        - id: ch01-b47
          speaker: winged_monkey_king
          text: 这以后很长很长的许多年里，我们只需要遵守那一道命令。直到金帽落进西方恶女巫手中，她让我们奴役温基人，后来又命令我们把奥兹本人赶出西方国土。现在金帽属于你了，你同样有权命令我们三次。
        - id: ch01-b48
          speaker: narrator
          text: 猴王刚讲完，多萝茜低头一看，翡翠城闪闪发亮的绿色城墙已经到了眼前。她没想到飞猴能飞得这样快，心里十分惊奇。不过，更让她高兴的是，这段漫长的旅程终于结束了。奇异的飞猴们稳稳落地，小心地把每一位旅人放在城门前。猴王向多萝茜深深鞠了一躬，随即振翅飞去，整群飞猴也全都跟在他身后，很快就飞远了。
        - id: ch01-b49
          speaker: dorothy
          text: 这一路飞得真舒服。
        - id: ch01-b50
          speaker: cowardly_lion
          text: 是啊，一下子就让我们脱了困。多亏你把这顶神奇的帽子带来了！
