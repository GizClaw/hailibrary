  chapters:
    - id: ch01
      title: Chapter XIV The Winged Monkeys
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            You may remember that no road, or even a path, ran between the
            Wicked Witch's castle and the Emerald City. On the way to the
            castle, the Witch had spotted the four travelers and sent the
            Winged Monkeys to fetch them. Finding the way back on foot was much
            harder. All around them stretched great fields of buttercups and
            yellow daisies.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They knew the Emerald City lay straight east, toward the rising
            sun, so they began in the right direction. But by noon the sun was
            directly overhead. They could no longer tell east from west, and
            soon they were lost among the flowers. Still, they walked on. That
            night the moon shone brightly, and they lay down among the
            sweet-smelling yellow blossoms. Dorothy, Toto, and the Lion slept
            soundly until morning. The Scarecrow and the Tin Woodman, of
            course, did not sleep.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Clouds hid the sun the next morning. Even so, the travelers set
            off as though they knew exactly where they were headed.
        - id: ch01-b04
          speaker: dorothy
          text: >-
            If we keep walking long enough, we're bound to reach somewhere.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One day followed another, yet the scarlet fields still stretched
            ahead with nothing else in sight. Before long, the Scarecrow began
            to complain.
        - id: ch01-b06
          speaker: scarecrow
          text: >-
            We must have lost the way. If we don't find it soon enough to get
            back to the Emerald City, I'll never receive my brains.
        - id: ch01-b07
          speaker: tin_woodman
          text: >-
            And I'll never receive my heart. I can hardly bear waiting any
            longer to see Oz. This journey has gone on far too long.
        - id: ch01-b08
          speaker: cowardly_lion
          text: >-
            I don't have enough courage to tramp on forever when we never get
            anywhere.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            Dorothy's hope gave out. She sat on the grass and gazed at her
            friends. They sat down and gazed back. For the first time in his
            life, Toto was too tired to chase a butterfly that fluttered past
            his nose. He panted with his tongue out and looked to Dorothy as if
            he wanted to know what came next.
        - id: ch01-b10
          speaker: dorothy
          text: >-
            What if we call the field mice? They probably know how to reach the
            Emerald City.
        - id: ch01-b11
          speaker: scarecrow
          text: >-
            Of course they do! Why didn't that occur to us sooner?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Dorothy blew the little whistle she had worn around her neck ever
            since the Queen of the Field Mice gave it to her. Within minutes,
            tiny feet came pattering through the grass. A crowd of small gray
            mice ran up, with their Queen among them.
        - id: ch01-b13
          speaker: queen_of_the_field_mice
          text: How may I help my friends?
        - id: ch01-b14
          speaker: dorothy
          text: >-
            We're lost. Can you tell us which way the Emerald City is?
        - id: ch01-b15
          speaker: queen_of_the_field_mice
          text: >-
            Certainly, but it's very far away. You've been walking with the
            city behind you this entire time.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then the Queen noticed the Golden Cap that Dorothy carried.
        - id: ch01-b17
          speaker: queen_of_the_field_mice
          text: >-
            Why not use the Cap's charm to summon the Winged Monkeys? They can
            carry you to the City of Oz in less than an hour.
        - id: ch01-b18
          speaker: dorothy
          text: >-
            I had no idea the Cap held a charm. What is it?
          emotion: surprised
        - id: ch01-b19
          speaker: queen_of_the_field_mice
          text: >-
            You'll find it written inside the Golden Cap. But if you're going
            to call those Monkeys, we mice must hurry away. They're terribly
            mischievous, and they love tormenting us.
        - id: ch01-b20
          speaker: dorothy
          text: They won't hurt me, will they?
          emotion: fearful
        - id: ch01-b21
          speaker: queen_of_the_field_mice
          text: >-
            No, they have to obey whoever wears the Cap. Good-bye!
        - id: ch01-b22
          speaker: narrator
          text: >-
            The Queen scampered out of sight, and every mouse raced after her.
            Dorothy peered inside the Golden Cap. Words were written on its
            lining. She decided they must be the charm, read the directions
            with care, and placed the Cap on her head. Then she balanced on her
            left foot.
        - id: ch01-b23
          speaker: dorothy
          text: Ep-pe, pep-pe, kak-ke!
        - id: ch01-b24
          speaker: scarecrow
          text: What was that you said?
        - id: ch01-b25
          speaker: narrator
          text: >-
            The Scarecrow had no idea what Dorothy was doing. She switched to
            her right foot and continued.
        - id: ch01-b26
          speaker: dorothy
          text: Hil-lo, hol-lo, hel-lo!
        - id: ch01-b27
          speaker: tin_woodman
          text: Hello!
        - id: ch01-b28
          speaker: narrator
          text: >-
            The Tin Woodman answered quite calmly. Dorothy planted both feet
            on the ground and spoke the last words.
        - id: ch01-b29
          speaker: dorothy
          text: Ziz-zy, zuz-zy, zik!
        - id: ch01-b30
          speaker: narrator
          text: >-
            The charm was complete. A great clatter of voices and beating
            wings filled the air as the band of Winged Monkeys swept toward
            them. Their King bowed low before Dorothy.
        - id: ch01-b31
          speaker: winged_monkey_king
          text: What do you command?
        - id: ch01-b32
          speaker: dorothy
          text: >-
            We need to reach the Emerald City, and we've lost the way.
        - id: ch01-b33
          speaker: winged_monkey_king
          text: We'll carry you there.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The moment he finished speaking, two Monkeys caught Dorothy in
            their arms and flew off with her. Other Monkeys lifted the
            Scarecrow, the Tin Woodman, and the Lion. A small Monkey grabbed
            Toto and followed, though the little dog did his best to bite him.
        - id: ch01-b35
          speaker: narrator
          text: >-
            At first, the Scarecrow and Tin Woodman felt uneasy. They still
            remembered how roughly the Monkeys had treated them before. But it
            soon became clear that no one meant to hurt them. After that, they
            enjoyed the ride and cheerfully watched the lovely gardens and
            woods passing far below.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Dorothy rode comfortably between two of the largest Monkeys. One
            was the King himself. They joined their hands into a seat and took
            care not to hurt her.
        - id: ch01-b37
          speaker: dorothy
          text: >-
            Why does the Golden Cap's charm make you obey?
        - id: ch01-b38
          speaker: winged_monkey_king
          text: >-
            The answer is quite a story. Since our journey will be long, I can
            tell it to you along the way, if you'd like.
        - id: ch01-b39
          speaker: narrator
          text: >-
            A laugh seemed to flutter through the King's words.
        - id: ch01-b40
          speaker: dorothy
          text: I'd like that very much.
        - id: ch01-b41
          speaker: winged_monkey_king
          text: >-
            Long ago, we Winged Monkeys were free. We lived happily in the
            great forest, flew wherever we pleased, and ate nuts and fruit. We
            answered to no master. Some of us may have been a little too fond
            of mischief. We would swoop down and tug the tails of animals that
            couldn't fly. We chased birds and tossed nuts at people walking
            through the woods. But we were carefree, happy, and always ready
            for fun. This was many years ago, before Oz came down from the
            clouds to rule this land.
        - id: ch01-b42
          speaker: winged_monkey_king
          text: >-
            In those days, a beautiful princess lived far to the north. She
            was also a powerful sorceress named Gayelette. She used her magic
            to help people and never harmed anyone who was good. Her palace was
            built from huge blocks of ruby, and everyone loved her.
        - id: ch01-b43
          speaker: winged_monkey_king
          text: >-
            Yet Gayelette was unhappy because she could find no one she could
            love in return. Every man seemed far too foolish and ugly for a
            princess so beautiful and wise. Then she found a boy who was
            handsome, brave, and wise beyond his years. She decided that when
            he became a man, she would marry him.
        - id: ch01-b44
          speaker: winged_monkey_king
          text: >-
            Gayelette brought the boy to her ruby palace. With all her magic,
            she helped him grow as strong, good, and handsome as anyone could
            wish. His name was Quelala. By the time he became a man, people
            called him the finest and wisest man in the land. Gayelette loved
            him dearly and hurried to prepare their wedding.
        - id: ch01-b45
          speaker: winged_monkey_king
          text: >-
            Back then, my grandfather ruled the Winged Monkeys who lived in
            the forest near Gayelette's palace. That old fellow loved a joke
            more than he loved a good dinner. One day, shortly before the
            wedding, he and his band were flying over the forest when they saw
            Quelala beside the river. Quelala wore an expensive suit of pink
            silk and purple velvet. My grandfather decided to have some fun.
        - id: ch01-b46
          speaker: winged_monkey_king
          text: >-
            At his command, the Monkeys dove down and grabbed Quelala. They
            carried him above the middle of the river, then dropped him
            straight into the water.
        - id: ch01-b47
          speaker: winged_monkey_grandfather
          text: >-
            Swim for shore, fine fellow! Let's see what the water does to
            those grand clothes of yours!
        - id: ch01-b48
          speaker: winged_monkey_king
          text: >-
            Quelala was wise enough to swim, and all his good fortune had not
            made him proud. When his head came back above the water, he
            laughed. Then he swam to the bank. Gayelette came rushing out to
            meet him, but the river had completely ruined his silk and velvet.
        - id: ch01-b49
          speaker: winged_monkey_king
          text: >-
            The princess was furious, and of course she knew who had done it.
            She ordered every Winged Monkey brought before her. At first, she
            declared that our wings would be tied and we would be dropped into
            the river, just as we had dropped Quelala.
        - id: ch01-b50
          speaker: winged_monkey_king
          text: >-
            My grandfather begged her for mercy. He knew that Monkeys with
            their wings tied would drown. Quelala also spoke kindly for us. At
            last, Gayelette agreed to spare our lives, but only on one
            condition. From that day on, the Winged Monkeys must obey three
            commands from each owner of the Golden Cap.
        - id: ch01-b51
          speaker: winged_monkey_king
          text: >-
            Gayelette had made the Cap as a wedding gift for Quelala. People
            said it had cost her half her kingdom. My grandfather and all the
            other Monkeys quickly accepted her condition. And that is why,
            three times over, we become the servants of whoever owns the
            Golden Cap.
        - id: ch01-b52
          speaker: dorothy
          text: >-
            What happened to Gayelette and Quelala after that?
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dorothy had listened closely to every part of the story.
        - id: ch01-b54
          speaker: winged_monkey_king
          text: >-
            Quelala was the first owner of the Golden Cap, so he was also the
            first to command us. After the wedding, he called us together in
            the forest. His bride couldn't stand the sight of us, so he
            ordered us to remain wherever she would never see another Winged
            Monkey. We were glad to obey because we were all afraid of her.
        - id: ch01-b55
          speaker: winged_monkey_king
          text: >-
            That was the only command we ever received until the Golden Cap
            came into the hands of the Wicked Witch of the West. She made us
            enslave the Winkies. Later, she made us drive Oz himself out of
            the Land of the West. Now the Cap belongs to you, and you may give
            us three commands.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Just as the Monkey King finished, Dorothy looked down. Ahead of
            them stood the shining green walls of the Emerald City. She was
            amazed by the speed of the Monkeys, and glad their journey had
            ended.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The strange creatures gently set all the travelers down before the
            city gate. Their King bowed low to Dorothy. Then he sped away, with
            the entire band flying after him.
        - id: ch01-b58
          speaker: dorothy
          text: That was a wonderful ride.
        - id: ch01-b59
          speaker: cowardly_lion
          text: >-
            Yes, and it got us out of trouble in no time. How lucky you brought
            that marvelous Cap with you!
