audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    stork:
      display_name: 鹳
      tts:
        delivery: 爽快热心，说话干脆利落
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第八章　致命的罂粟花田
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，旅伴们醒来时精神十足，心里也满是希望。多萝茜从河边树上摘了桃子和李子，像一位公主那样美美吃了一顿。身后的黑森林虽然让他们吃尽苦头，总算已经平安走过。眼前阳光明亮，田野美丽，像是在招手请他们快些去翡翠城。
        - id: ch01-b02
          speaker: narrator
          text: 可宽阔的河还挡在面前，把他们和那片美景隔开了。好在木筏就要做好。铁皮樵夫再砍下几根木头，用木钉一根根连牢，大家便准备出发。多萝茜抱着托托坐在木筏中央。狮子又大又沉，一踏上去，木筏就歪得厉害。稻草人和铁皮樵夫赶紧站到另一头，合力把它稳住。他们手里各拿一根长篙，准备撑着木筏渡过河去。
        - id: ch01-b03
          speaker: narrator
          text: 开头还算顺利。可到了河心，急流一下卷住木筏，带着他们往下游越漂越远，离黄砖路也越来越远。河水很快深得连长篙都探不到底了。
        - id: ch01-b04
          speaker: tin_woodman
          text: 这可不好。要是靠不了岸，河水会把我们冲进西方恶女巫的国土。她会施魔法，把我们都抓去做奴隶。
          emotion: fearful
        - id: ch01-b05
          speaker: scarecrow
          text: 那我就再也得不到脑子了。
        - id: ch01-b06
          speaker: cowardly_lion
          text: 我也别想得到勇气了。
        - id: ch01-b07
          speaker: tin_woodman
          text: 我也不会有心了。
        - id: ch01-b08
          speaker: dorothy
          text: 我也永远回不了堪萨斯了。
        - id: ch01-b09
          speaker: scarecrow
          text: 只要还有一丁点办法，我们就非去翡翠城不可。
        - id: ch01-b10
          speaker: narrator
          text: 稻草人一边说，一边使劲撑篙。谁知篙头牢牢扎进了河底的淤泥。他还没拔出来，甚至没来得及松手，木筏已经顺水漂走。可怜的稻草人只能抱住长篙，独自留在河中央。
        - id: ch01-b11
          speaker: scarecrow
          text: 再见啦！
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 大家眼看着稻草人被留在后面，却没有办法停下，心里难过极了。铁皮樵夫甚至哭了起来。幸好他及时想起，眼泪一流，自己就可能生锈，于是赶紧拿多萝茜的围裙把泪擦干。
        - id: ch01-b13
          speaker: narrator
          text: 对稻草人来说，这当然糟透了。他心想，自己现在比初遇多萝茜时还要倒霉。那时，他虽然插在玉米地的木杆上，至少还能装模作样地吓唬乌鸦。如今却挂在河中央的长篙上，一个稻草人待在这里，能有什么用？他害怕自己终究得不到脑子了。
        - id: ch01-b14
          speaker: narrator
          text: 木筏不停向下游漂，稻草人的身影越来越远。狮子知道不能再这样下去了。
        - id: ch01-b15
          speaker: cowardly_lion
          text: 我们得救自己。我应该能游到岸边，再拖着木筏过去。你们只管抓牢我的尾巴尖。
        - id: ch01-b16
          speaker: narrator
          text: 狮子纵身跳进河里，铁皮樵夫一把抓牢他的尾巴。他拼尽全力朝岸边游。哪怕狮子这么高大强壮，这活儿也累得很。过了好一会儿，木筏终于被拖出急流。多萝茜拿起铁皮樵夫留下的长篙，也使劲帮忙，把木筏一点点撑到岸边。
        - id: ch01-b17
          speaker: narrator
          text: 大家终于靠岸，走下木筏，踏上漂亮的绿草地。这时，他们全都累得筋疲力尽。他们也很清楚，刚才已经被河水带出去很远，越过了通往翡翠城的黄砖路。狮子趴到草地上，让暖暖的太阳把一身湿毛慢慢晒干。
        - id: ch01-b18
          speaker: tin_woodman
          text: 接下来怎么办呢？
        - id: ch01-b19
          speaker: dorothy
          text: 无论如何，我们都得回到那条路上。
        - id: ch01-b20
          speaker: cowardly_lion
          text: 最好的办法是沿着河岸往回走，走到黄砖路为止。
        - id: ch01-b21
          speaker: narrator
          text: 大家休息好了，多萝茜重新提起篮子。他们沿着青草覆盖的河岸往回赶，要找到刚才被河水带离的黄砖路。这里到处是鲜花和果树，阳光也暖洋洋的，一路景色美极了。要不是一直为可怜的稻草人担心，他们本来可以非常快活。
        - id: ch01-b22
          speaker: narrator
          text: 他们走得很快。多萝茜一路只停过一次，摘下一朵漂亮的花。又走了一阵，铁皮樵夫突然叫大家快看。伙伴们望向河面，果然看见稻草人还挂在河中央的长篙上，看起来孤单又伤心。
        - id: ch01-b23
          speaker: dorothy
          text: 到底怎样才能把他救下来呢？
        - id: ch01-b24
          speaker: narrator
          text: 狮子和铁皮樵夫都摇头。他们想不出办法，只好坐在岸边，忧心忡忡地望着朋友。后来，一只鹳从天上飞过。她发现了这群人，便落到水边休息。
        - id: ch01-b25
          speaker: stork
          text: 你们是谁？这是要去什么地方？
        - id: ch01-b26
          speaker: dorothy
          text: 我叫多萝茜。这是我的朋友铁皮樵夫和胆小的狮子。我们正要去翡翠城。
        - id: ch01-b27
          speaker: narrator
          text: 鹳扭过长长的脖子，把这群古怪的旅伴仔细看了一遍。
        - id: ch01-b28
          speaker: stork
          text: 可这儿根本不是去翡翠城的路呀。
        - id: ch01-b29
          speaker: dorothy
          text: 我知道。可是我们的稻草人丢了，我们正在想办法把他找回来。
        - id: ch01-b30
          speaker: stork
          text: 他在哪儿？
        - id: ch01-b31
          speaker: dorothy
          text: 就在那边的河里。
        - id: ch01-b32
          speaker: stork
          text: 要不是他那么大、那么重，我倒能替你们把他带回来。
        - id: ch01-b33
          speaker: dorothy
          text: 他一点也不重，肚子里全是稻草。请你把他救回来吧，我们永远都会感激你的。
        - id: ch01-b34
          speaker: stork
          text: 好，我来试试。不过，要是他重得抓不住，我就只能把他重新丢进河里了。
        - id: ch01-b35
          speaker: narrator
          text: 大鸟振翅飞过河面，来到稻草人的长篙旁。她用两只大爪子抓住他的一条胳膊，把他提到空中，带回多萝茜、狮子、铁皮樵夫和托托等待的岸边。
        - id: ch01-b36
          speaker: narrator
          text: 稻草人回到伙伴中间，高兴得谁都抱了一遍，连狮子和托托也没落下。再次赶路时，他每迈一步，就唱一声“托——德——里——德——哦！”快活得不得了。
        - id: ch01-b37
          speaker: scarecrow
          text: 我真怕自己要一辈子留在河里。幸亏好心的鹳救了我。等我得到脑子，一定会再找到她，也替她做一件好事。
          emotion: happy
        - id: ch01-b38
          speaker: stork
          text: 没什么，我本来就喜欢帮助遇到困难的人。可我得回去了，孩子们还在巢里等我呢。祝你们顺利找到翡翠城，也祝奥兹肯帮助你们。
        - id: ch01-b39
          speaker: dorothy
          text: 谢谢你！
        - id: ch01-b40
          speaker: narrator
          text: 好心的鹳飞上天空，很快就看不见了。旅伴们继续前行，一边听羽毛鲜艳的鸟儿唱歌，一边看路旁美丽的花。花朵越开越密，几乎盖住了地面。大片黄花、白花、蓝花和紫花，把大地铺成绚丽的花毯。花丛里还有一簇簇鲜红的罂粟。那颜色实在太明亮，多萝茜看着看着，眼睛几乎都被晃花了。
        - id: ch01-b41
          speaker: dorothy
          text: 这些花真美，对不对？
        - id: ch01-b42
          speaker: narrator
          text: 多萝茜说着，深深吸进一口花朵辛香的气息。
        - id: ch01-b43
          speaker: scarecrow
          text: 大概很美吧。等我有了脑子，也许会更喜欢它们。
        - id: ch01-b44
          speaker: tin_woodman
          text: 要是我有一颗心，我一定会爱上这些花。
        - id: ch01-b45
          speaker: cowardly_lion
          text: 我一直都喜欢花。它们这么柔弱，一点也保护不了自己。森林里的花可没有这些鲜艳。
        - id: ch01-b46
          speaker: narrator
          text: 再往前走，硕大的红罂粟越来越多，别的花却越来越少。很快，他们就到了大片罂粟花田的中央。这种花只要一大片聚在一起，香气就会强得可怕。谁把花香吸进去，谁就会昏昏沉沉地睡着。要是没人及时把睡着的人带离花香，他就会一直睡下去，再也醒不过来。
        - id: ch01-b47
          speaker: narrator
          text: 多萝茜并不知道。四周到处都是鲜红的花，她也无处可躲。渐渐地，她的眼皮越来越沉，只想坐下来歇一歇，好好睡上一觉。铁皮樵夫却不许她停下。
        - id: ch01-b48
          speaker: tin_woodman
          text: 得赶快走。天黑以前，我们必须回到黄砖路上。
        - id: ch01-b49
          speaker: narrator
          text: 稻草人也同意。大家继续赶路，可多萝茜终于再也站不住了。她的眼睛自己合了起来，连身在何处都忘了。随后，她倒进罂粟花丛，沉沉睡去。
        - id: ch01-b50
          speaker: tin_woodman
          text: 现在该怎么办？
        - id: ch01-b51
          speaker: cowardly_lion
          text: 把她留在这儿，她会死的。这花香正在要我们的命。连我也快睁不开眼睛了，小狗已经睡着了。
          emotion: fearful
        - id: ch01-b52
          speaker: narrator
          text: 托托果然倒在小主人身边。稻草人和铁皮樵夫并非血肉之躯，所以花香对他们不起作用。
        - id: ch01-b53
          speaker: scarecrow
          text: 快跑，尽快冲出这片要命的花田。我们会带上小女孩。可你要是也睡着了，个头这么大，我们根本抬不动。
        - id: ch01-b54
          speaker: narrator
          text: 狮子拼命振作起来，飞快地向前奔去，转眼就没了踪影。
        - id: ch01-b55
          speaker: scarecrow
          text: 我们把手和胳膊搭成椅子，抬她走。
        - id: ch01-b56
          speaker: narrator
          text: 他们先抱起托托，把小狗放在多萝茜腿上。然后两人用手托住她，再用手臂护住两旁，抬着沉睡的女孩穿过花丛。
        - id: ch01-b57
          speaker: narrator
          text: 他们走啊，走啊，四周那张致命的花毯仿佛永远没有尽头。两人沿着弯曲的河岸前进，最后终于看见了朋友狮子。他倒在罂粟丛里，已经睡得很沉。浓烈的花香连这头巨兽也压倒了。他到底没能支撑住，倒下的地方离花田尽头只差一点点。就在前方，柔软清新的草地已经铺展开来，一片片美丽的绿野近在眼前。
        - id: ch01-b58
          speaker: tin_woodman
          text: 我们救不了他。他太重了，我们根本抬不起来。只能把他留在这儿，让他永远睡下去。也许在梦里，他终于能觉得自己有了勇气。
          emotion: sad
        - id: ch01-b59
          speaker: scarecrow
          text: 我真难过。狮子虽说胆小，却是个非常好的伙伴。我们继续走吧。
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: 他们抬着熟睡的多萝茜，终于来到河边一处美丽又安静的地方。这里离罂粟花田已经够远，多萝茜不会再吸进花朵的毒气。两人轻轻把她放在柔软的草地上，静静守候在她身边，等河畔清新的微风吹来，把她从沉睡中唤醒。
