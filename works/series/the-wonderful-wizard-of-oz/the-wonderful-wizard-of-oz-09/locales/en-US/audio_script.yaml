  chapters:
    - id: ch01
      title: Chapter VIII The Deadly Poppy Field
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The travelers woke the next morning feeling rested and hopeful.
            Dorothy ate peaches and plums from the trees beside the river and
            breakfasted like a princess. The dark forest and all its troubles
            lay safely behind them. They had faced one discouragement after
            another in that forest, but they had made it through. Ahead, a
            lovely sunny country seemed to call them onward toward the Emerald
            City.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The broad river still stood between them and that beautiful land,
            but their raft was almost finished. The Tin Woodman cut a few more
            logs and fastened them together with wooden pins. Then they were
            ready. Dorothy sat in the middle with Toto in her arms. When the
            Cowardly Lion climbed aboard, his weight made the raft tip badly.
            The Scarecrow and the Tin Woodman moved to the other end to balance
            it. Each carried a long pole to push against the river bottom.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At first, they made good progress. But in the middle of the river,
            the swift current caught the raft and swept it downstream, farther
            and farther from the yellow brick road. Soon the water was too deep
            for their poles to reach the bottom.
        - id: ch01-b04
          speaker: tin_woodman
          text: >-
            This is terrible. If we can't reach the shore, the river will carry
            us into the Wicked Witch of the West's country. She'll put us under
            a spell and make us her slaves.
        - id: ch01-b05
          speaker: scarecrow
          text: Then I'll never get my brains.
        - id: ch01-b06
          speaker: cowardly_lion
          text: And I'll never get my courage.
        - id: ch01-b07
          speaker: tin_woodman
          text: And I'll never get my heart.
        - id: ch01-b08
          speaker: dorothy
          text: And I'll never make it home to Kansas.
        - id: ch01-b09
          speaker: scarecrow
          text: We have to reach the Emerald City somehow.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The Scarecrow shoved his pole down with all his strength. It stuck
            fast in the mud. Before he could pull it loose or let go, the raft
            swept on without him. He was left clinging to the pole in the
            middle of the river.
        - id: ch01-b11
          speaker: scarecrow
          text: Good-bye!
        - id: ch01-b12
          speaker: narrator
          text: >-
            His friends hated to leave him. The Tin Woodman even began to cry.
            Then he remembered that tears could make him rust, so he dried them
            on Dorothy's apron.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The Scarecrow was in a dreadful position. He thought that he was
            worse off now than when Dorothy first found him. Back then, he had
            been stuck on a pole in a cornfield, where he could at least pretend
            to frighten crows. A scarecrow on a pole in the middle of a river
            was no use at all. As he clung there alone, he feared that after all
            this, he would never get any brains.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The raft drifted on, leaving him far behind. Then the Lion spoke.
        - id: ch01-b15
          speaker: cowardly_lion
          text: >-
            We have to save ourselves. I think I can swim to shore and tow the
            raft. Just hold tight to the end of my tail.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He leaped into the river, and the Tin Woodman gripped his tail. The
            Lion swam toward shore with all his might. Even for such a large
            animal, fighting the water was hard work. Little by little, he
            pulled the raft out of the swift current. Then Dorothy picked up the
            Tin Woodman's long pole. Now that it could touch bottom again, she
            helped push the raft the rest of the way to land.
        - id: ch01-b17
          speaker: narrator
          text: >-
            They stepped onto the pretty green grass completely worn out. The
            river had carried them far beyond the yellow brick road. The Lion
            lay in the sun to dry.
        - id: ch01-b18
          speaker: tin_woodman
          text: What do we do now?
        - id: ch01-b19
          speaker: dorothy
          text: We have to find our way back to the road.
        - id: ch01-b20
          speaker: cowardly_lion
          text: Our best chance is to follow the riverbank until we reach it again.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Once they had rested, Dorothy picked up her basket, and they set
            off along the grassy bank. Flowers, fruit trees, and sunshine filled
            the lovely country and should have cheered them. They might have
            been very happy there, but they could only think of the poor
            Scarecrow left behind in the river.
        - id: ch01-b22
          speaker: narrator
          text: >-
            They followed the riverbank as quickly as they could, searching for
            the road that the current had carried them past. Dorothy paused only
            once to pick a beautiful flower. After a while, the Tin Woodman
            suddenly called out.
        - id: ch01-b23
          speaker: tin_woodman
          text: Look!
        - id: ch01-b24
          speaker: narrator
          text: >-
            They looked toward the river. There was the Scarecrow, perched on
            his pole in the middle of the water, lonely and miserable.
        - id: ch01-b25
          speaker: dorothy
          text: How can we rescue him?
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Lion and the Tin Woodman could only shake their heads. They sat
            on the bank with no answer, gazing longingly at their lonely friend.
            Just then, a Stork flew past. She noticed the travelers below,
            stopped her flight, and landed at the water's edge to rest.
        - id: ch01-b27
          speaker: stork
          text: Who are you, and where are you headed?
        - id: ch01-b28
          speaker: dorothy
          text: >-
            I'm Dorothy. These are my friends, the Tin Woodman and the Cowardly
            Lion. We're on our way to the Emerald City.
        - id: ch01-b29
          speaker: stork
          text: >-
            Well, this isn't the road to the Emerald City.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The Stork twisted her long neck and studied the strange little
            group.
        - id: ch01-b31
          speaker: dorothy
          text: >-
            I know. We lost the Scarecrow, and we're trying to figure out how
            to get him back.
        - id: ch01-b32
          speaker: stork
          text: Where is he?
        - id: ch01-b33
          speaker: dorothy
          text: Out there in the river.
        - id: ch01-b34
          speaker: stork
          text: If he weren't so big and heavy, I could fetch him for you.
        - id: ch01-b35
          speaker: dorothy
          text: >-
            Oh, he doesn't weigh much at all. He's stuffed with straw. If you
            bring him back, we'll be grateful forever and ever.
        - id: ch01-b36
          speaker: stork
          text: >-
            All right, I'll try. But if he's too heavy for me, I'll have to drop
            him back into the river.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The great bird flew over the water to the Scarecrow's pole. She
            reached down with her great claws and caught him firmly by one arm.
            Then she lifted him right off the pole, carried him through the air,
            and brought him safely back to the bank. Dorothy, the Lion, the Tin
            Woodman, and Toto were all sitting there waiting for him.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The Scarecrow was so delighted to be among his friends again that
            he hugged every one of them, even the Lion and Toto. As they went on
            their way, he sang, “Tol-de-ri-de-oh!” with every step.
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            I thought I'd be stuck in that river forever. But the kind Stork
            saved me. If I ever get my brains, I'll find her again and repay her
            kindness.
        - id: ch01-b40
          speaker: stork
          text: >-
            That's all right. I'm always glad to help someone in trouble. I
            have to go now because my babies are waiting in their nest. I hope
            you find the Emerald City, and I hope Oz helps you.
        - id: ch01-b41
          speaker: dorothy
          text: Thank you.
        - id: ch01-b42
          speaker: narrator
          text: The kind Stork flew away and soon disappeared from sight.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The travelers went on, listening to brightly colored birds sing and
            admiring the flowers. The blossoms grew so thick that they covered
            the ground like a carpet beneath their feet. There were large yellow
            and white blossoms, blue ones and purple ones, and great clusters of
            scarlet poppies. Those poppies shone with such brilliant color that
            they almost dazzled Dorothy's eyes.
        - id: ch01-b44
          speaker: dorothy
          text: Aren't they beautiful?
        - id: ch01-b45
          speaker: narrator
          text: Dorothy breathed in the bright flowers' spicy scent.
        - id: ch01-b46
          speaker: scarecrow
          text: >-
            I suppose they are. Maybe I'll enjoy them more when I have brains.
        - id: ch01-b47
          speaker: tin_woodman
          text: If I had a heart, I know I would love them.
        - id: ch01-b48
          speaker: cowardly_lion
          text: >-
            I've always liked flowers. They look so helpless and delicate. But
            none of the flowers in the forest are as bright as these.
        - id: ch01-b49
          speaker: narrator
          text: >-
            As they walked on, the scarlet poppies became more and more
            plentiful. The other flowers slowly vanished. Before long, the
            travelers stood in the middle of a vast poppy meadow.
        - id: ch01-b50
          speaker: narrator
          text: >-
            When many poppies grow together, their scent becomes so powerful
            that anyone who breathes it falls asleep. Unless the sleeper is
            carried away from the scent, that sleep goes on and on forever.
            Dorothy knew nothing about this danger. The bright red flowers were
            everywhere around her, and there was no way for her to get away from
            them. Soon her eyelids grew heavy. More than anything, she wanted to
            sit down, rest, and give in to sleep.
        - id: ch01-b51
          speaker: narrator
          text: The Tin Woodman would not let her stop.
        - id: ch01-b52
          speaker: tin_woodman
          text: >-
            We need to hurry. We must reach the yellow brick road before it gets
            dark.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The Scarecrow agreed, and they pressed on. At last, Dorothy could
            not stand any longer. Her eyes closed no matter how hard she fought
            to keep them open. She forgot where she was. Then she sank down
            among the poppies and fell fast asleep.
        - id: ch01-b54
          speaker: tin_woodman
          text: What are we going to do?
        - id: ch01-b55
          speaker: cowardly_lion
          text: >-
            If we leave her here, she'll die. The flowers' smell is killing all
            of us. I can hardly keep my own eyes open, and Toto has already
            fallen asleep.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Toto lay beside Dorothy. But the Scarecrow and the Tin Woodman were
            not made of flesh, so the poppies' scent did not affect them.
        - id: ch01-b57
          speaker: scarecrow
          text: >-
            Run as fast as you can and get out of this deadly field. We'll carry
            Dorothy with us. If you fall asleep, you're much too big for us to
            move.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The Lion forced himself awake and bounded forward as fast as he
            could. In moments, he was out of sight.
        - id: ch01-b59
          speaker: scarecrow
          text: We can make a chair with our hands and carry her between us.
        - id: ch01-b60
          speaker: narrator
          text: >-
            They lifted Toto and placed him in Dorothy's lap. Then they joined
            their hands for a seat and used their arms for its sides. With the
            sleeping girl between them, they carried her through the flowers.
        - id: ch01-b61
          speaker: narrator
          text: >-
            They went on and on. The deadly carpet of blossoms seemed endless.
            All around them, the great field stretched on as if it would never
            end. They followed a bend in the river and finally came upon their
            friend the Lion. He lay fast asleep among the poppies. The flowers
            had been too strong even for that huge beast. He had fought his way
            almost through, then fallen only a short distance from the edge of
            the poppy bed. Just beyond him, sweet grass spread out into
            beautiful green fields.
        - id: ch01-b62
          speaker: tin_woodman
          text: >-
            We can't help him. He's far too heavy for us to lift. We'll have to
            leave him here to sleep forever. Maybe he'll dream that he finally
            found his courage.
          emotion: sad
        - id: ch01-b63
          speaker: scarecrow
          text: >-
            I'm sorry. For someone so cowardly, the Lion was a very good friend.
            But we have to keep going.
          emotion: sad
        - id: ch01-b64
          speaker: narrator
          text: >-
            They carried Dorothy to a pretty place beside the river, far enough
            from the poppy field that she could no longer breathe its poison.
            There they laid her gently on the soft grass and waited for the
            fresh breeze to wake her.
