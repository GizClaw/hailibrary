audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着童话讲述者的亲切与幽默
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直率，情感自然流露
        timbre: 清亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    aunt_em:
      display_name: 艾姆婶婶
      tts:
        delivery: 干练克制，危急时急促有力
        timbre: 清瘦成熟
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十四章　重返家园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 艾姆婶婶刚走出屋子，正要给卷心菜浇水。她抬头一看，多萝茜正朝她跑来。
        - id: ch01-b02
          speaker: aunt_em
          text: 我的宝贝孩子！
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: 她喊着把小姑娘搂进怀里，亲了又亲。
        - id: ch01-b04
          speaker: aunt_em
          text: 你到底是从哪儿回来的？
        - id: ch01-b05
          speaker: narrator
          text: 多萝茜神情认真地回答。
        - id: ch01-b06
          speaker: dorothy
          text: 我从奥兹国回来。托托也回来了。啊，艾姆婶婶！我终于回到家了，真高兴！
          emotion: happy
