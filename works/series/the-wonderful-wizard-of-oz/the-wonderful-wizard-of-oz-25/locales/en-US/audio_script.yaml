audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    aunt_em:
      display_name: Aunt Em
      tts:
        delivery: loving and plainspoken
        timbre: warm and mature
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: Home Again
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Aunt Em had just stepped out of the house to water the cabbages. She looked up and saw Dorothy running straight toward her.
        - id: ch01-b02
          speaker: aunt_em
          text: >-
            My darling child!
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            Aunt Em swept the little girl into her arms and covered her face with kisses.
        - id: ch01-b04
          speaker: aunt_em
          text: >-
            Where in the world have you been?
          emotion: surprised
        - id: ch01-b05
          speaker: dorothy
          text: >-
            I came from the Land of Oz. Toto is here, too. Oh, Aunt Em, I'm so happy to be home again!
          emotion: happy
