audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 天真坦率，惊讶与担忧都自然流露
        timbre: 清亮稚嫩
        pace: 自然
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 友善谦逊，带着初识世界的好奇和一点笨拙幽默
        timbre: 略带沙哑而轻软
        pace: 从容
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 彬彬有礼，真诚敏感，讲起往事时带着克制的忧伤
        timbre: 清脆坚实，略带金属般的明亮感
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 外表威猛却真诚羞怯，低落时带着坦白的自嘲
        timbre: 浑厚宽广
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第六章　胆小的狮子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            多萝茜和伙伴们一直走在茂密的森林里。黄砖路还在脚下，可路面铺满了树上掉落的枯枝和败叶，每一步都走得很费劲。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这一带几乎没有鸟儿。鸟儿喜欢阳光充足的开阔地方，不爱待在这样阴密的林子里。树木深处倒会时不时传来野兽的低吼。多萝茜不知道是谁在叫，听得心跳越来越快。托托却像是明白。他紧挨着多萝茜走，连一声都不敢回吠。
        - id: ch01-b03
          speaker: dorothy
          text: 我们还要多久才能走出森林？
        - id: ch01-b04
          speaker: tin_woodman
          text: >-
            我也不知道。我从没去过翡翠城。小时候，父亲倒去过一回。他说路很远，还要经过危险的地方。不过，越靠近奥兹住的城，四周就越美。只要带着油壶，我就不怕。稻草人也不会受伤。你额头上还有好女巫亲过的印记，它会保护你。
        - id: ch01-b05
          speaker: dorothy
          text: 可托托怎么办？谁来保护他？
        - id: ch01-b06
          speaker: tin_woodman
          text: 他真遇到危险，就让我们来保护他。
        - id: ch01-b07
          speaker: narrator
          text: >-
            铁皮樵夫刚说完，森林里突然爆出一声可怕的怒吼。一头大狮子紧跟着跃上黄砖路。他挥出一爪，把稻草人打得翻了一个跟头又一个跟头，一直滚到路边。然后，他亮出尖利的爪子，朝铁皮樵夫狠狠抓去。铁皮樵夫被打倒在路中央，躺着一动不动，可那身铁皮连一道爪痕也没留下。狮子没想到自己的利爪毫无用处，自己反倒愣住了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            托托见敌人就在眼前，叫着冲了过去。狮子张开大嘴，眼看就要咬住他。多萝茜怕托托被咬死，再也顾不上危险。她扑到狮子面前，用尽力气打了他的鼻子一巴掌。
        - id: ch01-b09
          speaker: dorothy
          text: >-
            你敢咬托托！你这么大，却来欺负一只可怜的小狗，不觉得害臊吗？
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 狮子用爪子揉着挨打的鼻子。
        - id: ch01-b11
          speaker: cowardly_lion
          text: 可我并没有咬他呀。
        - id: ch01-b12
          speaker: dorothy
          text: 你是还没咬到！你就是个大懦夫。
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 狮子羞愧地低下了头。
        - id: ch01-b14
          speaker: cowardly_lion
          text: >-
            我知道。我早就知道自己是个懦夫。可我能怎么办呢？
          emotion: sad
        - id: ch01-b15
          speaker: dorothy
          text: 我哪知道！你连一个肚子里塞着稻草的人都打。看看可怜的稻草人吧！
        - id: ch01-b16
          speaker: cowardly_lion
          text: 他肚子里是塞出来的？
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            多萝茜把稻草人从地上抱起来，让他重新站好，又把他全身拍了又拍，直到他恢复原来的样子。狮子站在一旁，惊讶地看着这一切。
        - id: ch01-b18
          speaker: dorothy
          text: 他当然是塞出来的。
        - id: ch01-b19
          speaker: cowardly_lion
          text: >-
            怪不得我一爪下去，他就那么容易飞了出去，还一圈接一圈地转个不停。我真给吓了一跳。那边那个也是塞出来的吗？
        - id: ch01-b20
          speaker: dorothy
          text: 不是。他是铁皮做的。
        - id: ch01-b21
          speaker: narrator
          text: 多萝茜说着，又把铁皮樵夫扶了起来。
        - id: ch01-b22
          speaker: cowardly_lion
          text: >-
            难怪我的爪子差点磨钝了。爪尖一刮到铁皮，我整条背脊都凉得发颤。你那么护着的那只小动物又是什么？
        - id: ch01-b23
          speaker: dorothy
          text: 他是我的小狗，叫托托。
        - id: ch01-b24
          speaker: cowardly_lion
          text: 那他是铁皮做的，还是肚子里塞了东西？
        - id: ch01-b25
          speaker: dorothy
          text: 都不是。他是……他是血肉做的小狗。
        - id: ch01-b26
          speaker: cowardly_lion
          text: >-
            原来是这样！这小动物真稀奇。现在仔细看看，他小得不得了。除了我这种懦夫，谁会想咬这么小的东西呢？
          emotion: sad
        - id: ch01-b27
          speaker: narrator
          text: 多萝茜仰头打量着眼前这头巨兽，心里十分惊奇。他足有一匹小马那么大。
        - id: ch01-b28
          speaker: dorothy
          text: 你为什么这么胆小？
        - id: ch01-b29
          speaker: cowardly_lion
          text: >-
            连我自己也弄不明白。也许我生来就胆小。森林里的其他动物一见我，就认定我天生应该勇敢，因为无论走到哪里，大家都把狮子叫作百兽之王。我后来发现，只要大声一吼，所有活物都会害怕，马上躲开，给我让出路来。
        - id: ch01-b30
          speaker: cowardly_lion
          text: >-
            我每次碰见人，其实都怕得要命。可我只要朝他吼一声，他就会拼命逃走。大象、老虎和熊要是真敢跟我动手，逃跑的准是我。可他们一听我吼，自己先跑了。我当然就放他们走啦。
        - id: ch01-b31
          speaker: scarecrow
          text: 这可不对。百兽之王不该是个懦夫。
        - id: ch01-b32
          speaker: narrator
          text: 狮子用尾巴尖擦掉眼里的一滴泪。
        - id: ch01-b33
          speaker: cowardly_lion
          text: >-
            我知道。这是我最难受的事，害得我每天都不快活。可危险一来，我的心就会怦怦乱跳。
          emotion: sad
        - id: ch01-b34
          speaker: tin_woodman
          text: 也许你有心脏病。
        - id: ch01-b35
          speaker: cowardly_lion
          text: 也许真有。
        - id: ch01-b36
          speaker: tin_woodman
          text: >-
            那你反而该高兴，因为这证明你确实有一颗心。我自己没有心，当然也不会得心脏病。
        - id: ch01-b37
          speaker: cowardly_lion
          text: 这么说来，要是没有心，我说不定就不胆小了。
        - id: ch01-b38
          speaker: scarecrow
          text: 你有脑子吗？
        - id: ch01-b39
          speaker: cowardly_lion
          text: 大概有吧。反正我从没打开看过。
        - id: ch01-b40
          speaker: scarecrow
          text: >-
            我要去找伟大的奥兹，请他给我一些脑子。我这颗脑袋里只有稻草。
        - id: ch01-b41
          speaker: tin_woodman
          text: 我要请他给我一颗心。
        - id: ch01-b42
          speaker: dorothy
          text: 我要请他送我和托托回堪萨斯。
        - id: ch01-b43
          speaker: cowardly_lion
          text: 你们觉得，奥兹也能给我一点勇气吗？
        - id: ch01-b44
          speaker: scarecrow
          text: 当然能。这不会比给我脑子更难。
        - id: ch01-b45
          speaker: tin_woodman
          text: 也不会比给我一颗心更难。
        - id: ch01-b46
          speaker: dorothy
          text: 更不会比送我回堪萨斯难。
        - id: ch01-b47
          speaker: cowardly_lion
          text: >-
            那么，你们要是不介意，就让我也跟着吧。没有一点勇气，这种日子我实在过不下去了。
        - id: ch01-b48
          speaker: dorothy
          text: >-
            我们很欢迎你。有你在，别的野兽就不敢接近我们了。它们那么容易被你吓跑，我看它们一定比你更胆小。
        - id: ch01-b49
          speaker: cowardly_lion
          text: >-
            它们确实胆小，可这也不能让我多一点勇气。只要我还知道自己是个懦夫，我就不会快活。
        - id: ch01-b50
          speaker: narrator
          text: >-
            于是，小小的队伍又出发了。狮子迈着庄严的步子，走在多萝茜身边。托托起初一点也不喜欢这个新伙伴。他忘不了刚才那张大嘴差点合拢，把自己咬碎在两排巨大的牙齿之间。可走了一阵，托托慢慢放松下来。没过多久，他和胆小的狮子便成了好朋友。
        - id: ch01-b51
          speaker: narrator
          text: >-
            那一天剩下的路途都很平静，再没有什么意外搅扰他们。只出了一件小事。铁皮樵夫不小心踩到一只正从路上爬过的甲虫，把这个可怜的小东西踩死了。他一向非常留神，不愿伤害任何活物，这下难过极了，边走边掉下几滴又悲伤又后悔的眼泪。
        - id: ch01-b52
          speaker: narrator
          text: >-
            泪水沿着他的脸，慢慢流到下巴的关节上，让那里生了锈。不久，多萝茜问他一件事，他却连嘴都张不开，上下颌已经紧紧锈住了。铁皮樵夫吓得连连比画，一次又一次地请多萝茜帮忙，可她怎么也看不懂。狮子也猜不出发生了什么。幸好稻草人从多萝茜的篮子里拿出油壶，替樵夫的下巴上了油。过了一会儿，他终于又能说话了。
        - id: ch01-b53
          speaker: tin_woodman
          text: >-
            这件事可教训了我。以后走路，我一定得看清脚下。万一再踩死一只小虫或甲虫，我肯定又会掉眼泪。眼泪一流，下巴就生锈，我也就说不了话了。
        - id: ch01-b54
          speaker: narrator
          text: >-
            从那以后，铁皮樵夫每一步都走得格外小心，眼睛始终盯着路。哪怕看见一只小蚂蚁正辛苦地往前爬，他也会特意抬起脚，从它身上跨过去，绝不伤它。他很清楚自己没有心，所以更得处处留意，绝不能对任何生命残忍，也不能做出半点不善良的事。
        - id: ch01-b55
          speaker: tin_woodman
          text: >-
            你们有心，心里自然会有东西指引你们，不会做错事。可我没有心，只能处处小心。等奥兹送给我一颗心，我当然就不用这么留神了。
