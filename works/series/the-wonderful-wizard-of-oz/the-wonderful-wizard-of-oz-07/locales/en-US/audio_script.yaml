audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    scarecrow:
      display_name: Scarecrow
      tts:
        delivery: friendly and guileless
        timbre: dry and husky
        pace: easy
        pitch: medium
    tin_woodman:
      display_name: Tin Woodman
      tts:
        delivery: courteous and earnest
        timbre: resonant and metallic
        pace: deliberate
        pitch: medium-low
    cowardly_lion:
      display_name: Cowardly Lion
      tts:
        delivery: grand but tenderhearted
        timbre: deep and rumbling
        pace: natural
        pitch: low
  chapters:
    - id: ch01
      title: The Cowardly Lion
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dorothy and her companions were still making their way through the
            thick woods. Yellow bricks covered the road beneath their feet, but
            fallen branches and dead leaves lay over them, making every step
            difficult.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Few birds lived in that part of the forest. Birds preferred open
            country filled with sunshine. Here, every so often, a deep growl
            came from some wild animal hidden among the trees. Each growl made
            Dorothy's heart pound because she couldn't tell what had made it.
            Toto seemed to know. He stayed close beside her and didn't bark
            back even once.
        - id: ch01-b03
          speaker: dorothy
          text: How much longer will it take us to get out of this forest?
        - id: ch01-b04
          speaker: tin_woodman
          text: >-
            I can't say. I've never been to the Emerald City. My father went
            there once, when I was a boy. He told me the road was long and the
            country was dangerous, though it grew beautiful near the city where
            Oz lives. Still, I'm not afraid as long as I have my oil can. No one
            can hurt the Scarecrow, and the Good Witch's kiss left a mark on
            your forehead that will keep you safe.
        - id: ch01-b05
          speaker: dorothy
          text: But what about Toto? Who will keep him safe?
          emotion: fearful
        - id: ch01-b06
          speaker: tin_woodman
          text: If Toto is in danger, we'll have to protect him ourselves.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At that very moment, a terrible roar burst from the forest. A huge
            Lion sprang into the road. One swipe of his paw sent the Scarecrow
            tumbling over and over to the roadside. Then the Lion slashed at
            the Tin Woodman with his sharp claws. To his surprise, they left no
            mark on the tin, though the blow knocked the Woodman down and left
            him lying still in the road.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Now that Toto had an enemy in front of him, the little dog charged,
            barking. The Lion opened his mouth to bite. Dorothy was sure Toto
            would be killed. Forgetting the danger to herself, she rushed
            forward, slapped the Lion on the nose with all her strength, and
            shouted at him.
        - id: ch01-b09
          speaker: dorothy
          text: >-
            Don't you dare bite Toto! A great big beast like you ought to be
            ashamed of trying to hurt one little dog!
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: The Lion rubbed the place where Dorothy had struck him.
        - id: ch01-b11
          speaker: cowardly_lion
          text: But I didn't bite him.
        - id: ch01-b12
          speaker: dorothy
          text: No, but you were about to. You're nothing but a great coward.
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: The Lion lowered his head in shame.
        - id: ch01-b14
          speaker: cowardly_lion
          text: >-
            I know. I've known it all my life. But what can I possibly do about
            it?
          emotion: sad
        - id: ch01-b15
          speaker: dorothy
          text: >-
            I certainly don't know. Just think of it! You knocked down a poor
            man who's stuffed with straw.
          emotion: angry
        - id: ch01-b16
          speaker: cowardly_lion
          text: He's stuffed?
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            The Lion watched as Dorothy picked up the Scarecrow, set him on his
            feet, and patted him back into shape.
        - id: ch01-b18
          speaker: dorothy
          text: Of course he is.
          emotion: angry
        - id: ch01-b19
          speaker: cowardly_lion
          text: >-
            So that's why he flew away so easily. I couldn't believe how he
            spun around. Is your other friend stuffed, too?
        - id: ch01-b20
          speaker: dorothy
          text: No. He's made of tin.
        - id: ch01-b21
          speaker: narrator
          text: As she answered, Dorothy helped the Tin Woodman to his feet.
        - id: ch01-b22
          speaker: cowardly_lion
          text: >-
            That explains why I nearly ruined my claws. Scraping them over that
            tin sent a cold shiver right down my back. And what is that little
            animal you care so much about?
        - id: ch01-b23
          speaker: dorothy
          text: He's my dog, Toto.
        - id: ch01-b24
          speaker: cowardly_lion
          text: Is he tin, or is he stuffed?
        - id: ch01-b25
          speaker: dorothy
          text: Neither one. He's... he's... he's a meat dog.
        - id: ch01-b26
          speaker: cowardly_lion
          text: >-
            Oh! What an odd animal. Now that I look closely, he's very small.
            Nobody but a coward like me would ever think of biting such a tiny
            thing.
          emotion: sad
        - id: ch01-b27
          speaker: dorothy
          text: Why are you a coward?
        - id: ch01-b28
          speaker: narrator
          text: >-
            Dorothy stared up at him in wonder. The great beast was as large as
            a small horse.
        - id: ch01-b29
          speaker: cowardly_lion
          text: >-
            It's a mystery to me. I suppose I was born this way. Every other
            animal in the forest expects me to be brave because everyone calls
            the Lion the King of Beasts. I found out that when I roar loudly,
            every living creature gets frightened and runs out of my way.
            Whenever I've come across a man, I've been terribly afraid. But I
            roar, and he runs away as fast as he can. If the elephants, tigers,
            or bears ever tried to fight me, I'd be the one running. That's how
            cowardly I am. But the moment they hear my roar, they all hurry off,
            so naturally I let them go.
        - id: ch01-b30
          speaker: scarecrow
          text: >-
            But that isn't the way things should be. The King of Beasts ought
            to be brave.
        - id: ch01-b31
          speaker: narrator
          text: The Lion brushed a tear from his eye with the tip of his tail.
        - id: ch01-b32
          speaker: cowardly_lion
          text: >-
            I know. It's the greatest sorrow I have, and it makes my whole life
            miserable. Whenever danger comes near, my heart starts pounding.
          emotion: sad
        - id: ch01-b33
          speaker: tin_woodman
          text: Perhaps there's something wrong with your heart.
        - id: ch01-b34
          speaker: cowardly_lion
          text: Perhaps there is.
        - id: ch01-b35
          speaker: tin_woodman
          text: >-
            If there is, you should be glad. It proves you have a heart. I don't
            have one at all, so there's no chance of anything being wrong with
            mine.
        - id: ch01-b36
          speaker: cowardly_lion
          text: Maybe I wouldn't be a coward if I didn't have a heart.
        - id: ch01-b37
          speaker: scarecrow
          text: Do you have any brains?
        - id: ch01-b38
          speaker: cowardly_lion
          text: I suppose I do. I've never checked.
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            I'm on my way to ask the Great Oz for brains because my head is full
            of straw.
        - id: ch01-b40
          speaker: tin_woodman
          text: And I'm going to ask him for a heart.
        - id: ch01-b41
          speaker: dorothy
          text: I'm going to ask him to send Toto and me home to Kansas.
        - id: ch01-b42
          speaker: cowardly_lion
          text: Do you think Oz could give me courage?
        - id: ch01-b43
          speaker: scarecrow
          text: It should be just as easy as giving me brains.
        - id: ch01-b44
          speaker: tin_woodman
          text: Or giving me a heart.
        - id: ch01-b45
          speaker: dorothy
          text: Or sending me home to Kansas.
        - id: ch01-b46
          speaker: cowardly_lion
          text: >-
            Then, if none of you object, I'd like to come along. Life without
            even a little courage is more than I can bear.
          emotion: sad
        - id: ch01-b47
          speaker: dorothy
          text: >-
            We'd be glad to have you. You can frighten away the other wild
            animals. They must be even more cowardly than you if your roar
            scares them off so easily.
        - id: ch01-b48
          speaker: cowardly_lion
          text: >-
            They are, but knowing that doesn't make me any braver. As long as I
            know I'm a coward, I can never be happy.
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: >-
            And so the little company started down the road again. The Lion
            walked beside Dorothy with long, stately steps. At first, Toto did
            not care for their new companion. He still remembered how close he
            had come to being crushed in those enormous jaws. After a while,
            though, Toto relaxed. Before long, he and the Cowardly Lion were
            good friends.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The rest of that day's journey was peaceful, except for one sad
            accident. The Tin Woodman stepped on a beetle crawling across the
            road and killed the poor little creature. He was always careful not
            to hurt anything alive, so what he had done made him terribly
            unhappy. As he walked, tears of sorrow and regret rolled down his
            face. They trickled over the hinges of his jaw, and the hinges
            rusted.
        - id: ch01-b51
          speaker: narrator
          text: >-
            A little later, Dorothy asked him a question. The Woodman tried to
            answer, but his jaws were rusted tightly shut. He couldn't open his
            mouth. This frightened him badly, and he waved and pointed, trying
            to show Dorothy what he needed. She couldn't understand him. The
            Lion was puzzled, too.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Then the Scarecrow grabbed the oil can from Dorothy's basket and
            oiled the Woodman's jaws. In a few moments, the Tin Woodman could
            speak as well as ever.
        - id: ch01-b53
          speaker: tin_woodman
          text: >-
            I've learned my lesson. From now on, I'll watch where I put my feet.
            If I kill another bug or beetle, I'll surely cry again. Then my
            tears will rust my jaws, and I won't be able to talk.
        - id: ch01-b54
          speaker: narrator
          text: >-
            From then on, he watched the road with every step. Whenever he saw a
            tiny ant working its way along, he stepped over it carefully so he
            wouldn't cause it any harm. The Tin Woodman knew very well that he
            had no heart. That was why he took such care never to be cruel or
            unkind to any living thing.
        - id: ch01-b55
          speaker: tin_woodman
          text: >-
            Those of you with hearts have something to guide you, so you never
            need to do wrong. I have no heart, which means I must be especially
            careful. Of course, once Oz gives me a heart, I won't have to worry
            quite so much.
