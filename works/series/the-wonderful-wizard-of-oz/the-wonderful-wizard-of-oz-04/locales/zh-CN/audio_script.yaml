audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 天真坦率，惊讶与担忧都自然流露
        timbre: 清亮稚嫩
        pace: 自然
        pitch: 中高音
    boq:
      display_name: 博克
      tts:
        delivery: 热情周到，谈到奥兹时认真谨慎
        timbre: 温厚明亮
        pace: 平稳
        pitch: 中音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 友善谦逊，带着初识世界的好奇和一点笨拙幽默
        timbre: 略带沙哑而轻软
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　多萝茜怎样救下稻草人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            大家都走了，只留下多萝茜一个人。她渐渐觉得肚子饿了，就从橱柜里切了些面包，在面包上抹好黄油，也分给托托一点。她又从架子上拿下一只水桶，提到小溪边，装满清亮闪光的水。托托跑到树下，冲着停在枝头的鸟儿叫起来。多萝茜过去找它，正好看见枝头挂满诱人的果子。她摘了一些，这正是早餐里还缺的东西。
        - id: ch01-b02
          speaker: narrator
          text: >-
            回到屋里，她和托托都喝足了清凉的溪水。接下来，该为去翡翠城的旅程做准备了。多萝茜还有一条洗得干干净净的裙子，挂在床边的木钉上。裙子是蓝白格子的，蓝色已经洗得有点褪了，可还是很好看。
        - id: ch01-b03
          speaker: narrator
          text: >-
            她仔细洗净身子，换上那条干净的花格布裙，再把粉红色的遮阳帽系在头上。她拿来一只小篮子，把橱柜里的面包装得满满的，又在上面盖上一块白布。可等她低头看看自己的双脚，才发现脚上的鞋已经又旧又破。
        - id: ch01-b04
          speaker: dorothy
          text: 托托，这双鞋肯定走不了那么远。
        - id: ch01-b05
          speaker: narrator
          text: 托托仰起脸，用黑亮的小眼睛望着她，还摇了摇尾巴，表示自己听懂了。
        - id: ch01-b06
          speaker: narrator
          text: 这时，多萝茜瞧见桌上那双银鞋。那是东方女巫留下的。
        - id: ch01-b07
          speaker: dorothy
          text: 不知道我穿着合不合脚。它们永远穿不坏，用来走远路正合适。
        - id: ch01-b08
          speaker: narrator
          text: >-
            她脱下旧皮鞋，把银鞋穿到脚上。鞋子无比合脚，简直像专门为她做的。多萝茜提起篮子，一切都准备好了。
        - id: ch01-b09
          speaker: dorothy
          text: 走吧，托托。我们去翡翠城，请伟大的奥兹告诉我怎么回堪萨斯。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她关上门，锁好房子，再把钥匙小心放进裙子口袋。多萝茜就这样出发了，托托神情严肃地跟在后面，小步跑着。
        - id: ch01-b11
          speaker: narrator
          text: >-
            附近的路有好几条，不过她没花多少工夫，就找到了铺着黄砖的那一条。没过多久，她已经迈着轻快的脚步，朝翡翠城走去。银鞋踏在坚硬的黄色路面上，一路发出欢快的叮当声。太阳明亮地照着，鸟儿唱得悦耳。这个小姑娘突然让旋风卷离故乡，落进一片陌生的土地，心情却不像你以为的那么难过。
        - id: ch01-b12
          speaker: narrator
          text: >-
            一路上的乡野美得让她吃惊。道路两旁立着整整齐齐的篱笆，都漆成淡雅的蓝色。篱笆外面，是大片种满谷物和蔬菜的田地，庄稼长得十分丰盛。看来芒奇金人都是种田的好手，能够收获很多粮食。
        - id: ch01-b13
          speaker: narrator
          text: >-
            她偶尔经过一所房子，屋里的人就会出来看她，还会在她走过时深深鞠躬。大家都知道，是她除掉恶女巫，让他们不再受奴役。这里的房子也很特别，每一座都是圆的，上面顶着一个大圆屋顶。房子全漆成蓝色，因为东方国度的人最喜欢蓝色。
        - id: ch01-b14
          speaker: narrator
          text: >-
            快到傍晚时，多萝茜已经走了很久，双腿也累了，开始琢磨晚上该住在哪里。她来到一所比别家都大的房子前，看见许多男女在屋前碧绿的草坪上跳舞。五个小提琴手使足了劲儿演奏，大家一边笑，一边唱。旁边的大桌子上堆满美味的水果、坚果、馅饼、蛋糕，还有许许多多好吃的东西。
        - id: ch01-b15
          speaker: narrator
          text: >-
            人们亲切地欢迎多萝茜，请她吃晚饭，也请她留下过夜。原来，这里住着国内一位最富有的芒奇金人。他和朋友们聚在一起，正庆祝大家终于摆脱了恶女巫。
        - id: ch01-b16
          speaker: narrator
          text: >-
            多萝茜饱饱地吃了一顿晚饭。那位富有的芒奇金人亲自在桌边照料她，他的名字叫博克。吃过饭，多萝茜坐到一张长椅上，看着人们继续跳舞。博克一眼看见了她脚上的银鞋。
        - id: ch01-b17
          speaker: boq
          text: 您一定是位法力高强的女魔法师。
        - id: ch01-b18
          speaker: dorothy
          text: 为什么这么说？
        - id: ch01-b19
          speaker: boq
          text: 您穿着银鞋，又杀死了恶女巫。而且您的裙子上有白色，只有女巫和女魔法师才穿白色。
        - id: ch01-b20
          speaker: dorothy
          text: 可我的裙子是蓝白格子的呀。
        - id: ch01-b21
          speaker: narrator
          text: 多萝茜说着，把裙子上的褶皱轻轻抚平。
        - id: ch01-b22
          speaker: boq
          text: >-
            您肯穿这两个颜色，真是太好了。蓝色属于芒奇金人，白色属于女巫。所以我们知道，您是一位友善的女巫。
        - id: ch01-b23
          speaker: narrator
          text: >-
            多萝茜不知道该怎么回答。人人都好像认定她是女巫，可她明明只是个普通的小姑娘，碰巧让旋风带到了陌生的国度。
        - id: ch01-b24
          speaker: narrator
          text: >-
            等她看舞看累了，博克便领她走进屋里，把一个房间给她住。房间里摆着一张漂亮的床，床单是蓝布做的。多萝茜躺在里面，一觉安稳地睡到天亮。托托蜷在床边的蓝地毯上，也睡得很香。
        - id: ch01-b25
          speaker: narrator
          text: >-
            第二天早晨，多萝茜吃过一顿丰盛的早餐，又看见一个小小的芒奇金婴儿和托托玩。小娃娃扯托托的尾巴，咿咿呀呀地笑个不停，把她逗得非常开心。这里的人从没见过狗，大家都觉得托托稀奇极了。
        - id: ch01-b26
          speaker: dorothy
          text: 翡翠城离这里有多远？
        - id: ch01-b27
          speaker: boq
          text: >-
            我不知道，我从来没去过。除非真有事情要找奥兹，否则最好离他远一点。翡翠城离这里很远，你得走上许多天。我们这里富饶又舒服，可你还要穿过一些崎岖又危险的地方，才能走到终点。
        - id: ch01-b28
          speaker: narrator
          text: >-
            博克说得很认真，多萝茜听了有些担心。可是她知道，只有伟大的奥兹能帮她回到堪萨斯。所以，她还是勇敢地决定继续往前，绝不回头。
        - id: ch01-b29
          speaker: narrator
          text: >-
            她向新朋友们告别，再次踏上黄砖路。走过好几英里，她想停下来歇歇，就爬到路边的篱笆顶上坐下。篱笆后面是一大片玉米地。不远处，有个稻草人高高架在木杆上，替人们赶走偷吃熟玉米的鸟儿。
        - id: ch01-b30
          speaker: narrator
          text: >-
            多萝茜用手托着下巴，仔细打量它。稻草人的脑袋是一个塞满稻草的小布袋，袋子上画着眼睛、鼻子和嘴巴，凑成一张脸。它歪戴着一顶破旧的尖顶蓝帽子，那帽子以前大概属于某个芒奇金人。它身上那套破旧褪色的蓝衣服，里面也塞得满满的。脚上的旧靴子镶着宽宽的蓝边，这个国度里的男人都穿这种靴子。插在它背后的木杆，把整个身子高高撑在玉米秆上方。
        - id: ch01-b31
          speaker: narrator
          text: >-
            多萝茜正全神贯注地盯着那张古怪的彩绘面孔，忽然看见它有一只眼睛朝自己慢慢眨了一下。她起先以为自己看错了，堪萨斯的稻草人可从来不会眨眼。可没过多久，它又友好地朝她点了点头。多萝茜赶紧从篱笆上爬下来，走到它面前。托托绕着木杆跑来跑去，不停地汪汪叫。
        - id: ch01-b32
          speaker: scarecrow
          text: 您好。
        - id: ch01-b33
          speaker: narrator
          text: 稻草人的声音有些沙哑，多萝茜惊奇地望着它。
        - id: ch01-b34
          speaker: dorothy
          text: 刚才是你在说话吗？
          emotion: surprised
        - id: ch01-b35
          speaker: scarecrow
          text: 当然是我。你过得怎么样？
        - id: ch01-b36
          speaker: dorothy
          text: 我很好，谢谢你。你呢？
        - id: ch01-b37
          speaker: scarecrow
          text: 我可不太好。没日没夜地待在这根杆子上赶乌鸦，实在无聊透了。
        - id: ch01-b38
          speaker: narrator
          text: 稻草人说这话时还微笑着。
        - id: ch01-b39
          speaker: dorothy
          text: 你自己下不来吗？
        - id: ch01-b40
          speaker: scarecrow
          text: >-
            下不来，这根木杆插在我的背后。请你帮我把它拿开吧，那我可要好好谢谢你。
        - id: ch01-b41
          speaker: narrator
          text: 多萝茜伸出双臂，把稻草人从杆子上抬了下来。因为肚里塞的全是稻草，它轻得很，多萝茜几乎没费什么力气。
        - id: ch01-b42
          speaker: scarecrow
          text: 太谢谢你了！落到地上以后，我简直像换了一个人。
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: >-
            多萝茜听得很困惑。一个肚里塞满稻草的人，居然会说话，会鞠躬，还能走在她身边，实在太古怪了。稻草人伸伸四肢，又打了个哈欠。
        - id: ch01-b44
          speaker: scarecrow
          text: 你是谁？要到哪里去？
        - id: ch01-b45
          speaker: dorothy
          text: 我叫多萝茜。我要去翡翠城，请伟大的奥兹送我回堪萨斯。
        - id: ch01-b46
          speaker: scarecrow
          text: 翡翠城在哪里？奥兹又是谁？
        - id: ch01-b47
          speaker: dorothy
          text: 怎么，你连这个也不知道吗？
          emotion: surprised
        - id: ch01-b48
          speaker: scarecrow
          text: >-
            我真的不知道。我什么都不懂。你看，我脑袋里塞的是稻草，一点脑子也没有。
          emotion: sad
        - id: ch01-b49
          speaker: dorothy
          text: 唉，你真可怜。
          emotion: sad
        - id: ch01-b50
          speaker: scarecrow
          text: 要是我跟你一起去翡翠城，你说奥兹会给我一些脑子吗？
        - id: ch01-b51
          speaker: dorothy
          text: >-
            我也说不准。不过你想来的话，就和我一起走吧。就算奥兹不给你脑子，你也不会比现在更糟。
        - id: ch01-b52
          speaker: scarecrow
          text: >-
            这倒是真的。悄悄告诉你，我不在乎腿、胳膊和身子里塞着稻草，因为我不会受伤。有人踩到我的脚趾，或者拿针扎我，我都感觉不到。可是，我不想让别人叫我傻瓜。我的脑袋要是一直塞着稻草，不像你的脑袋里装着脑子，我怎么可能懂得事情呢？
        - id: ch01-b53
          speaker: narrator
          text: 稻草人压低声音，说出了自己的心事。多萝茜听了，确实很同情它。
        - id: ch01-b54
          speaker: dorothy
          text: 我明白你的感受。你跟我来吧，我会请奥兹尽力帮你。
        - id: ch01-b55
          speaker: scarecrow
          text: 谢谢你。
        - id: ch01-b56
          speaker: narrator
          text: >-
            稻草人满怀感激。他们一起回到路边，多萝茜帮它翻过篱笆。随后，两人沿着黄砖小路，朝翡翠城走去。
        - id: ch01-b57
          speaker: narrator
          text: >-
            托托起初不太喜欢这位新伙伴。它围着稻草人闻来闻去，好像怀疑稻草里藏着一窝老鼠，还常常不友好地冲它低吼。
        - id: ch01-b58
          speaker: dorothy
          text: 别在意托托，它从来不咬人。
        - id: ch01-b59
          speaker: scarecrow
          text: >-
            我不怕，它伤不到稻草。让我替你提篮子吧，反正我不会累。再告诉你一个秘密，这世上只有一样东西能让我害怕。
        - id: ch01-b60
          speaker: dorothy
          text: 是什么？是那个把你做出来的芒奇金农夫吗？
        - id: ch01-b61
          speaker: scarecrow
          text: 不是，是点燃的火柴。
