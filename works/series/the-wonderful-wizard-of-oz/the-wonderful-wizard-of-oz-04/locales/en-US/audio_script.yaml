audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    boq:
      display_name: Boq
      tts:
        delivery: gracious and earnest
        timbre: warm and mature
        pace: measured
        pitch: medium
    scarecrow:
      display_name: Scarecrow
      tts:
        delivery: friendly and guileless
        timbre: dry and husky
        pace: easy
        pitch: medium
  chapters:
    - id: ch01
      title: How Dorothy Saved the Scarecrow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once Dorothy was alone, she began to get hungry. She cut some bread
            from the cupboard, spread butter on it, and shared it with Toto. Then
            she took a pail down to the little brook and filled it with clear,
            sparkling water. Toto ran toward the trees and barked at the birds.
            When Dorothy went after him, she noticed delicious fruit hanging from
            the branches. She gathered some and found it was just what she wanted
            to go with their bread and make a good breakfast.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Back at the house, Dorothy and Toto drank their fill of the cool
            water. Then Dorothy got ready for the journey to the Emerald City.
        - id: ch01-b03
          speaker: narrator
          text: >-
            She had only one other dress. Luckily, it was clean and hung on a peg
            beside her bed. It was blue-and-white gingham. The blue checks had
            faded after many washings, but the dress was still pretty. Dorothy
            washed carefully, put it on, and tied her pink sunbonnet over her
            head. She took a little basket, filled it with bread from the
            cupboard, and laid a white cloth neatly over the top. Only then did
            she look down at her feet and notice how old and worn her shoes had
            become.
        - id: ch01-b04
          speaker: dorothy
          text: Those shoes won't last through a long journey, Toto.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Toto looked into her face with his little black eyes and wagged his
            tail, as if he understood. Just then, Dorothy spotted the silver shoes
            of the Witch of the East lying on the table.
        - id: ch01-b06
          speaker: dorothy
          text: >-
            I wonder if those would fit me. They'd be perfect for a long walk,
            because they could never wear out.
        - id: ch01-b07
          speaker: narrator
          text: >-
            She slipped off her old leather shoes and tried on the silver pair.
            They fit as though they had been made for her. At last, Dorothy picked
            up her basket.
        - id: ch01-b08
          speaker: dorothy
          text: >-
            Come on, Toto. We'll go to the Emerald City and ask the Great Oz to
            help me get back to Kansas.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Dorothy shut and locked the door, then tucked the key safely into her
            dress pocket. With Toto trotting soberly behind her, she began her
            journey.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Several roads ran near the house, but Dorothy soon found the one paved
            with yellow bricks. Before long, she was walking briskly toward the
            Emerald City. Her silver shoes tinkled merrily against the hard yellow
            road. The sun shone, and the birds sang. Dorothy felt much less unhappy
            than you might expect of a little girl who had suddenly been carried
            away from her own country and dropped into the middle of a strange
            land where everything was new to her.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The country around her was surprisingly pretty. Neat blue fences ran
            beside the road. Beyond them, fields were thick with grain and
            vegetables. The Munchkins clearly knew how to farm and raise fine
            crops. Every so often, Dorothy passed a house. The people came outside
            to watch her and bowed low as she went by. They all knew she had freed
            them by destroying the Wicked Witch who had kept them in bondage.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The Munchkin houses looked unusual. Each one was round, with a large
            domed roof, and every house was painted blue. Here in the eastern
            country, blue was the favorite color.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Evening drew near. Dorothy was tired after her long walk and had begun
            to wonder where she could spend the night. Then she reached a house
            that was larger than the others. Men and women danced on its green
            lawn while five little fiddlers played as loudly as they could.
            Everyone laughed and sang. Nearby, a big table stood loaded with fruit
            and nuts, pies and cakes, and many more good things to eat. It was a
            joyful feast, and the dancing filled the lawn.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The people welcomed Dorothy warmly. They asked her to stay for supper
            and spend the night. The house belonged to Boq, one of the richest
            Munchkins in the land. His friends had gathered there to celebrate
            because the Wicked Witch no longer held them in bondage. Dorothy was
            welcome to share both their meal and their celebration.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Dorothy ate a hearty supper, and Boq himself waited on her. Afterward,
            she sat on a settee and watched the dancing. Boq noticed her silver
            shoes.
        - id: ch01-b16
          speaker: boq
          text: You must be a very powerful sorceress.
        - id: ch01-b17
          speaker: dorothy
          text: Why do you think that?
        - id: ch01-b18
          speaker: boq
          text: >-
            You're wearing silver shoes, and you killed the Wicked Witch. And your
            dress has white in it. Only witches and sorceresses wear white here.
        - id: ch01-b19
          speaker: narrator
          text: Dorothy smoothed the wrinkles in her dress.
        - id: ch01-b20
          speaker: dorothy
          text: But my dress has blue checks, too. It's blue and white.
        - id: ch01-b21
          speaker: boq
          text: >-
            It's kind of you to wear those colors. Blue belongs to the Munchkins,
            and white belongs to witches. That tells us you're a friendly witch.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Dorothy had no answer. Everyone here seemed certain she was a witch,
            but she knew she was only an ordinary little girl. A cyclone had
            simply carried her into this strange land.
        - id: ch01-b23
          speaker: narrator
          text: >-
            When Dorothy grew tired of the dancing, Boq took her inside and gave
            her a room with a pretty bed. Its sheets were blue. Dorothy slept
            soundly until morning, with Toto curled up on the blue rug beside her.
        - id: ch01-b24
          speaker: narrator
          text: >-
            After a hearty breakfast, Dorothy watched a tiny Munchkin baby play
            with Toto. The baby pulled his tail, crowed, and laughed, and Dorothy
            found it very funny. Everyone was fascinated by Toto because no one
            there had ever seen a dog before. To the Munchkins, he was a strange
            and wonderful little creature.
        - id: ch01-b25
          speaker: dorothy
          text: How far away is the Emerald City?
        - id: ch01-b26
          speaker: narrator
          text: Boq answered gravely.
        - id: ch01-b27
          speaker: boq
          text: >-
            I don't know. I've never been there. People are better off staying
            away from Oz unless they have a reason to see him. The Emerald City is
            a long way from here, and your trip will take many days. This part of
            the country is rich and pleasant. But before your journey is over,
            you'll have to cross rough and dangerous places.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Dorothy was a little worried. Still, only the Great Oz could help her
            return to Kansas. She bravely decided she would not turn back. She
            said goodbye to her new friends and set off once more along the yellow
            brick road.
        - id: ch01-b29
          speaker: narrator
          text: >-
            After walking several miles, Dorothy decided to rest. She climbed onto
            the fence beside the road and sat on top. A great cornfield stretched
            out beyond it. Not far away, a Scarecrow stood high on a pole to frighten
            birds away from the ripe corn. From the fence, Dorothy could see his
            whole figure rising above the tall stalks.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Dorothy rested her chin on her hand and studied him. His head was a
            small sack stuffed with straw. Eyes, a nose, and a mouth had been
            painted on it to make a face. An old pointed blue hat, once owned by a
            Munchkin, sat on his head. His faded blue suit and the old boots with
            blue tops on his feet were stuffed with straw, too. They were the kind
            of boots every man in that country wore. The pole ran up his back and
            held him high above the corn.
        - id: ch01-b31
          speaker: narrator
          text: >-
            As Dorothy stared into that strange painted face, one eye slowly
            winked at her. She thought she must be mistaken. Scarecrows in Kansas
            never winked, and for a moment she could hardly believe her eyes. But
            then the figure gave her a friendly nod. There could be no mistake
            about that. Dorothy climbed down and walked toward him while Toto
            raced around the pole, barking.
        - id: ch01-b32
          speaker: scarecrow
          text: Good day.
        - id: ch01-b33
          speaker: narrator
          text: His voice sounded rather husky. Dorothy stared in wonder.
        - id: ch01-b34
          speaker: dorothy
          text: Did you just speak?
          emotion: surprised
        - id: ch01-b35
          speaker: scarecrow
          text: Of course. How are you?
        - id: ch01-b36
          speaker: dorothy
          text: I'm doing pretty well, thank you. And how are you?
        - id: ch01-b37
          speaker: scarecrow
          text: >-
            Not very well, though I can still smile about it. Sitting up here all
            day and all night to scare crows gets awfully tiresome.
        - id: ch01-b38
          speaker: dorothy
          text: Can't you climb down?
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            No. This pole is stuck up my back. If you'd pull it out, I'd be very
            grateful.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Dorothy reached up with both arms and lifted him free. He was easy to
            move because he weighed so little. He was stuffed with straw, after
            all. She set him on the ground.
        - id: ch01-b41
          speaker: scarecrow
          text: Thank you so much. I feel like a whole new man.
          emotion: happy
        - id: ch01-b42
          speaker: narrator
          text: >-
            Dorothy found that rather puzzling. It was strange enough to hear a
            stuffed man talk. Now he bowed and walked beside her, too. The
            Scarecrow stretched his newly freed arms and legs, then gave a long
            yawn before turning to Dorothy.
        - id: ch01-b43
          speaker: scarecrow
          text: Who are you, and where are you headed?
        - id: ch01-b44
          speaker: dorothy
          text: >-
            I'm Dorothy. I'm going to the Emerald City to ask the Great Oz to send
            me home to Kansas.
        - id: ch01-b45
          speaker: scarecrow
          text: Where is the Emerald City? And who's Oz?
        - id: ch01-b46
          speaker: dorothy
          text: You really don't know?
          emotion: surprised
        - id: ch01-b47
          speaker: scarecrow
          text: >-
            No, I truly don't know anything. My head is stuffed, so I haven't got
            any brains at all.
          emotion: sad
        - id: ch01-b48
          speaker: dorothy
          text: Oh. I'm so sorry.
          emotion: sad
        - id: ch01-b49
          speaker: scarecrow
          text: >-
            If I went to the Emerald City with you, do you think Oz might give me
            some brains?
        - id: ch01-b50
          speaker: dorothy
          text: >-
            I don't know, but you're welcome to come with me. Even if Oz won't
            give you brains, you won't be any worse off than you are now.
        - id: ch01-b51
          speaker: scarecrow
          text: >-
            That's true. I don't mind having straw in my arms, legs, and body. It
            means I can't be hurt. Someone could step on my toes or stick a pin in
            me, and I wouldn't feel a thing. But I don't want people calling me a
            fool. If my head stays full of straw instead of brains like yours, how
            will I ever learn anything?
          emotion: sad
        - id: ch01-b52
          speaker: narrator
          text: Dorothy truly felt sorry for him.
        - id: ch01-b53
          speaker: dorothy
          text: >-
            I understand. Come with me, and I'll ask Oz to do everything he can
            for you.
        - id: ch01-b54
          speaker: scarecrow
          text: Thank you.
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: >-
            They returned to the road. Dorothy helped the Scarecrow over the
            fence, and together they started along the yellow brick path toward
            the Emerald City.
        - id: ch01-b56
          speaker: narrator
          text: >-
            At first, Toto did not like their new companion. He sniffed all around
            the stuffed man, as though rats might be nesting in the straw. Again
            and again, he growled at the Scarecrow in an unfriendly way. The
            Scarecrow kept walking beside Dorothy while Toto inspected him.
        - id: ch01-b57
          speaker: dorothy
          text: Don't worry about Toto. He never bites.
        - id: ch01-b58
          speaker: scarecrow
          text: >-
            I'm not afraid. He can't hurt straw. Here, let me carry your basket. I
            won't mind, because I never get tired. And I'll tell you a secret.
            There's only one thing in the whole world that frightens me.
        - id: ch01-b59
          speaker: dorothy
          text: What is it? The Munchkin farmer who made you?
        - id: ch01-b60
          speaker: scarecrow
          text: No. It's a lighted match.
