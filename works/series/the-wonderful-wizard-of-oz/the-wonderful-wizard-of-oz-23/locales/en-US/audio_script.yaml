  chapters:
    - id: ch01
      title: The Country of the Quadlings
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The four travelers made it safely through the rest of the forest. When they stepped out of the shadows, a steep hill rose ahead of them. Great rocks covered it from top to bottom.
        - id: ch01-b02
          speaker: scarecrow
          text: >-
            That climb won't be easy. Still, we have to get over the hill.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The Scarecrow led the way, and the others followed. Just before they reached the first rock, a rough voice called out.
        - id: ch01-b04
          speaker: hammer_head
          text: >-
            Stay back!
          emotion: angry
        - id: ch01-b05
          speaker: scarecrow
          text: >-
            Who are you?
        - id: ch01-b06
          speaker: narrator
          text: >-
            A head appeared above the rock.
        - id: ch01-b07
          speaker: hammer_head
          text: >-
            This hill is ours. Nobody is allowed to cross it.
        - id: ch01-b08
          speaker: scarecrow
          text: >-
            We have to cross. We're on our way to the country of the Quadlings.
        - id: ch01-b09
          speaker: hammer_head
          text: >-
            You will not cross!
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            The strangest man the travelers had ever seen stepped out from behind the rock. He was short and stout, with a huge head that was flat on top. A thick neck, covered in wrinkles, held it up. But the man had no arms at all. When the Scarecrow saw that, he felt no fear. He could not imagine how such a helpless-looking creature could keep them from climbing the hill.
        - id: ch01-b11
          speaker: scarecrow
          text: >-
            I'm sorry you don't want us here, but we're going over this hill whether you like it or not.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He strode forward boldly. In a flash, the man's head shot out as his neck stretched long. The flat top struck the Scarecrow squarely in the middle and sent him tumbling over and over down the hill. The head snapped back almost as fast as it had come, and the man gave a harsh laugh.
        - id: ch01-b13
          speaker: hammer_head
          text: >-
            Not so easy, is it?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Wild, boisterous laughter burst from all the other rocks. Dorothy could now see hundreds of armless Hammer-Heads spread across the hillside, with one hiding behind every rock. They were all laughing at the Scarecrow's tumble. That made the Lion furious. He gave a mighty roar that echoed like thunder, then charged up the hill.
        - id: ch01-b15
          speakers: [hammer_head, hammer_head_2, hammer_head_3, hammer_head_4]
          ensemble: chorus
          text: >-
            Ha, ha, ha!
        - id: ch01-b16
          speaker: narrator
          text: >-
            Another head flew out. It hit the great Lion so hard that he rolled down the slope as if a cannonball had struck him. Dorothy hurried down and helped the Scarecrow stand. The Lion came over, bruised and sore.
        - id: ch01-b17
          speaker: cowardly_lion
          text: >-
            There's no use fighting people who can shoot their heads at us. Nobody could stand against that.
        - id: ch01-b18
          speaker: dorothy
          text: >-
            Then what can we do?
        - id: ch01-b19
          speaker: tin_woodman
          text: >-
            Call the Winged Monkeys. You still have one command left.
        - id: ch01-b20
          speaker: dorothy
          text: >-
            All right.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Dorothy put on the Golden Cap and spoke the magic words. The Monkeys answered as quickly as ever. In only a few moments, the whole band stood before her. Their King bowed low.
        - id: ch01-b22
          speaker: winged_monkey_king
          text: >-
            What do you command?
        - id: ch01-b23
          speaker: dorothy
          text: >-
            Please carry us over the hill and into the country of the Quadlings.
        - id: ch01-b24
          speaker: winged_monkey_king
          text: >-
            It will be done.
        - id: ch01-b25
          speaker: narrator
          text: >-
            At once, the Winged Monkeys took the four travelers and Toto in their arms and flew away with them. The Hammer-Heads shouted in anger as they passed overhead. Again and again, their long necks sprang up and their flat heads shot high into the air. But even at full stretch, they could not reach the flying Monkeys. Dorothy and her friends went safely over the hill and were set down in the beautiful country of the Quadlings.
        - id: ch01-b26
          speaker: winged_monkey_king
          text: >-
            That was your last command. So goodbye, Dorothy, and good luck.
        - id: ch01-b27
          speaker: dorothy
          text: >-
            Goodbye, and thank you so much.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The Monkeys rose into the sky and vanished almost at once.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The Quadlings' country looked rich and happy. Fields of ripening grain stretched one after another, with well-paved roads running between them. Pretty brooks rippled beneath strong bridges. Every fence, house, and bridge was painted bright red. In the Winkies' country those things had been yellow, and in the Munchkins' country they had been blue. The Quadlings themselves were short and round, with chubby, good-natured faces. They dressed all in red, which shone against the green grass and golden grain.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The Monkeys had left the travelers near a farmhouse, so they went to the door and knocked. The farmer's wife answered. When Dorothy asked for food, she served them a fine dinner with three kinds of cake and four kinds of cookies. Toto even got his own bowl of milk.
        - id: ch01-b31
          speaker: dorothy
          text: >-
            How much farther is Glinda's Castle?
        - id: ch01-b32
          speaker: farmers_wife
          text: >-
            It isn't far. Follow the road south, and you'll be there soon.
        - id: ch01-b33
          speaker: narrator
          text: >-
            They thanked the kind woman and started on their way again. They walked beside the fields and crossed the lovely bridges. Before long, a beautiful Castle came into view. Three young girls stood at its gates, wearing handsome red uniforms trimmed with gold braid. As Dorothy came closer, one of them spoke.
        - id: ch01-b34
          speaker: girl_soldier
          text: >-
            What brings you to the South Country?
        - id: ch01-b35
          speaker: dorothy
          text: >-
            We've come to see the Good Witch who rules here. Will you take me to her?
        - id: ch01-b36
          speaker: girl_soldier
          text: >-
            Tell me your names, and I'll ask Glinda if she will see you.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The travelers gave their names, and the girl soldier went inside the Castle. A few moments later, she returned with word that Dorothy and all her companions were to come in at once.
