audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    hammer_head:
      display_name: 锤头人
      tts:
        delivery: 粗暴蛮横，带着挑衅和嘲弄
        timbre: 粗哑结实
        pace: 干脆有力
        pitch: 中低音
    monkey_king:
      display_name: 猴王
      tts:
        delivery: 郑重有礼，说话干脆明白
        timbre: 清亮灵活
        pace: 稍快
        pitch: 中高音
    farmers_wife:
      display_name: 农夫的妻子
      tts:
        delivery: 热情爽朗，待客亲切自然
        timbre: 温暖朴实
        pace: 自然平稳
        pitch: 中音
    girl_soldier:
      display_name: 女兵
      tts:
        delivery: 礼貌警觉，问话清楚利落
        timbre: 清脆明亮
        pace: 平稳
        pitch: 中高音
  chapters:
    - id: ch01
      title: 锤头人的山冈
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 四位旅行者平平安安走完了剩下的森林。刚从阴暗的树丛里出来，他们就看见一座陡峭的山冈挡在前面。从山脚一直到山顶，遍地都是巨大的岩石。
        - id: ch01-b02
          speaker: scarecrow
          text: 这座山可难爬了。不过再难，我们也得翻过去。
        - id: ch01-b03
          speaker: narrator
          text: 稻草人在前面领路，伙伴们跟着他。眼看就要走到第一块岩石跟前，一个粗哑的声音忽然喝住了他们。
        - id: ch01-b04
          speaker: hammer_head
          text: 退回去！
        - id: ch01-b05
          speaker: scarecrow
          text: 你是谁？
        - id: ch01-b06
          speaker: narrator
          text: 岩石顶上露出一颗脑袋，那个粗哑的声音又响了起来。
        - id: ch01-b07
          speaker: hammer_head
          text: 这座山归我们。谁都别想从这里过去。
        - id: ch01-b08
          speaker: scarecrow
          text: 可我们非过去不可。我们要去桂特林人的国度。
        - id: ch01-b09
          speaker: hammer_head
          text: 想都别想！
        - id: ch01-b10
          speaker: narrator
          text: 岩石后面走出一个怪人。旅行者们一路上见过不少奇事，可谁也没见过这样的模样。他身材矮胖，顶着一颗大脑袋，头顶平得出奇。满是皱褶的粗脖子托着那颗脑袋，身上却连一条胳膊也没有。
        - id: ch01-b11
          speaker: narrator
          text: 稻草人一看，心里就不怕了。一个连手臂都没有的人，难道还拦得住他们爬山吗？
        - id: ch01-b12
          speaker: scarecrow
          text: 不能照你的意思办，我很抱歉。可不管你乐不乐意，我们今天都要翻过这座山。
        - id: ch01-b13
          speaker: narrator
          text: 说完，稻草人就大胆地往前走。谁知那人的脑袋像闪电一样射了出来，脖子也猛地伸长了。平平的头顶撞中稻草人胸口，把他撞得一连翻了好几个跟头，直滚下山坡。紧接着，那颗脑袋又飞快地缩了回去。怪人刺耳地笑了。
        - id: ch01-b14
          speaker: hammer_head
          text: 现在知道了吧？事情才没你想得那么容易！
        - id: ch01-b15
          speaker: narrator
          text: 四周的岩石后面爆发出一阵放肆的笑声。多萝茜这才看清，山坡上竟藏着几百个没有胳膊的锤头人，每块岩石后面都有一个。
        - id: ch01-b16
          speaker: narrator
          text: 狮子见稻草人摔了跟头，还被他们这样取笑，气得大吼一声。吼声像雷鸣一样在山间回荡，他随即向山上猛冲。又一颗脑袋射了出来，正中庞大的狮子。他就像挨了一发炮弹，翻滚着摔下山坡。
        - id: ch01-b17
          speaker: narrator
          text: 多萝茜赶紧跑下去，扶起稻草人。狮子也走过来，身上被撞得又酸又疼。
        - id: ch01-b18
          speaker: cowardly_lion
          text: 这些人能把脑袋射出来，跟他们打也没用。根本没人挡得住。
        - id: ch01-b19
          speaker: dorothy
          text: 那我们还能怎么办？
    - id: ch02
      title: 最后一次召唤
      blocks:
        - id: ch02-b01
          speaker: tin_woodman
          text: 召唤飞猴吧。你不是还剩最后一次命令他们的机会吗？
        - id: ch02-b02
          speaker: dorothy
          text: 好，就这么办。
        - id: ch02-b03
          speaker: narrator
          text: 多萝茜戴上金冠，念出了咒语。飞猴还是像以前那样来得飞快。没过一会儿，整群飞猴都落在她面前，猴王向她深深鞠了一躬。
        - id: ch02-b04
          speaker: monkey_king
          text: 请问，您要我们做什么？
        - id: ch02-b05
          speaker: dorothy
          text: 请带我们飞过这座山，送到桂特林人的国度。
        - id: ch02-b06
          speaker: monkey_king
          text: 一定照办。
        - id: ch02-b07
          speaker: narrator
          text: 飞猴们马上抱起四位旅行者和托托，飞上了天空。经过山顶时，锤头人气得在下面又喊又叫，还把脑袋一个个高高射到空中。可是他们怎么也碰不到飞猴。
        - id: ch02-b08
          speaker: narrator
          text: 飞猴带着多萝茜和伙伴们越过山冈，稳稳落在美丽的桂特林国土上，又把他们放了下来。
        - id: ch02-b09
          speaker: monkey_king
          text: 这是您最后一次召唤我们了。就此告别，祝您好运。
        - id: ch02-b10
          speaker: dorothy
          text: 再见。真的太感谢你们了！
        - id: ch02-b11
          speaker: narrator
          text: 飞猴们再次升上天空，转眼就不见了。
    - id: ch03
      title: 红色的国度
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 桂特林人的国度看起来富足又快乐。快成熟的谷物铺满一片片田野，田间有平整的道路。清澈的小溪泛着波纹，上面架着结实的桥。篱笆、房屋和桥梁全都漆成亮红色，就像温基人的国度处处是黄色，芒奇金人的国度处处是蓝色。
        - id: ch03-b02
          speaker: narrator
          text: 桂特林人一个个又矮又胖，模样敦厚和气。他们全身穿着红衣服，站在绿草和渐渐变黄的谷物之间，颜色格外鲜亮。
        - id: ch03-b03
          speaker: narrator
          text: 飞猴把伙伴们放在一座农舍附近。他们走过去敲门，开门的是农夫的妻子。多萝茜问能不能给大家一点吃的，她便让客人们饱餐了一顿。桌上有三种蛋糕、四种饼干，托托还得到了一碗牛奶。
        - id: ch03-b04
          speaker: dorothy
          text: 请问，到格琳达的城堡还有多远？
        - id: ch03-b05
          speaker: farmers_wife
          text: 没有多远。顺着这条路一直往南走，很快就能到了。
        - id: ch03-b06
          speaker: narrator
          text: 大家谢过这位好心的女人，又一次上路了。他们沿着田野走过一座美丽的小桥，又走过一座。没过多久，一座华美的城堡出现在前方。
        - id: ch03-b07
          speaker: narrator
          text: 城门前站着三个年轻姑娘。她们穿着漂亮的红色制服，衣服上还镶着金色饰带。多萝茜刚走近，其中一个姑娘便开口询问。
        - id: ch03-b08
          speaker: girl_soldier
          text: 你们为什么到南方国度来？
        - id: ch03-b09
          speaker: dorothy
          text: 我来拜见统治这里的好女巫。你能带我去见她吗？
        - id: ch03-b10
          speaker: girl_soldier
          text: 请告诉我你们的名字。我去问问格琳达，看她愿不愿意见你们。
        - id: ch03-b11
          speaker: narrator
          text: 伙伴们一一报上姓名，女兵便进了城堡。过了一会儿，她回来告诉大家，格琳达请多萝茜和其他伙伴马上进去。
