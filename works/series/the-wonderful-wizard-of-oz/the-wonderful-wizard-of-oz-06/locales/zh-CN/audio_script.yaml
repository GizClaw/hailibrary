audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 天真坦率，惊讶与担忧都自然流露
        timbre: 清亮稚嫩
        pace: 自然
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 友善谦逊，带着初识世界的好奇和一点笨拙幽默
        timbre: 略带沙哑而轻软
        pace: 从容
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 彬彬有礼，真诚敏感，讲起往事时带着克制的忧伤
        timbre: 清脆坚实，略带金属般的明亮感
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章　救出铁皮樵夫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            多萝茜醒来时，阳光已经从树叶间照进小屋。托托早就跑出去追鸟儿和松鼠了。她坐起来看看四周，只见稻草人还守在角落里，一直耐心等着她。
        - id: ch01-b02
          speaker: dorothy
          text: 我们得找些水去。
        - id: ch01-b03
          speaker: scarecrow
          text: 找水做什么？
        - id: ch01-b04
          speaker: dorothy
          text: 我脸上沾了好多尘土，得洗一洗，还得喝点水。不然吃干面包的时候，准会噎住。
        - id: ch01-b05
          speaker: scarecrow
          text: >-
            身体是血肉做的，真不方便。既要睡觉，又要吃饭喝水。不过，你有脑子呀。只要能好好想事情，多费点力气也值得。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他们走出小屋，在一棵棵树之间找来找去，终于发现一眼清亮的小泉。多萝茜先喝了水，又洗干净脸，坐下来吃早饭。她低头看看篮子，里面已经没剩多少面包了，勉强只够她和托托再吃一天。想到稻草人一点东西也不用吃，她心里不免有些庆幸。
        - id: ch01-b07
          speaker: narrator
          text: >-
            多萝茜吃完，正准备回黄砖路上，近处忽然响起一声低沉的呻吟。她吓了一跳。
        - id: ch01-b08
          speaker: dorothy
          text: 那是什么声音？
        - id: ch01-b09
          speaker: scarecrow
          text: 我也猜不出。我们过去找找吧。
        - id: ch01-b10
          speaker: narrator
          text: >-
            身后又传来一声呻吟。他们转身走进树林。没走几步，多萝茜便看见一束阳光从树间落下来，里面有个东西亮闪闪的。她跑到跟前，忽然停住，惊讶地叫了一声。
        - id: ch01-b11
          speaker: narrator
          text: >-
            一棵大树被砍进去了一半。树旁站着一个全由铁皮做成的人，双手把斧头高高举在空中。他的头、胳膊和腿都用关节接在身体上，可这时全身僵住了，连一点也不能动。多萝茜和稻草人都吃惊地望着他。托托却冲着那双铁皮腿尖声叫个不停，还张嘴咬了一口，反倒把自己的牙硌疼了。
        - id: ch01-b12
          speaker: dorothy
          text: 是你在呻吟吗？
        - id: ch01-b13
          speaker: tin_woodman
          text: >-
            是我。我这样呻吟了一年多，可从来没有人听见，也没有人来救我。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 那声音听来十分悲伤，多萝茜心里很不好受，便轻声问他。
        - id: ch01-b15
          speaker: dorothy
          text: 我怎么才能帮你？
        - id: ch01-b16
          speaker: tin_woodman
          text: >-
            请你去拿油壶，给这些关节上油。它们锈得太厉害，我完全动不了。好好上过油，我很快就能恢复。油壶在我的小屋里，就放在架子上。
        - id: ch01-b17
          speaker: narrator
          text: 多萝茜立刻跑回小屋，找到油壶，又匆匆赶了回来。
        - id: ch01-b18
          speaker: dorothy
          text: 你的关节在哪儿？我先给哪里上油？
        - id: ch01-b19
          speaker: tin_woodman
          text: 先从脖子开始吧。
        - id: ch01-b20
          speaker: narrator
          text: >-
            多萝茜把油滴在他的脖子上。那里锈得很重，稻草人便捧住铁皮脑袋，慢慢左右转动。关节终于松开了，铁皮樵夫可以自己转头了。
        - id: ch01-b21
          speaker: tin_woodman
          text: 接着请给我的胳膊上油。
        - id: ch01-b22
          speaker: narrator
          text: >-
            多萝茜又往胳膊的关节里滴油，稻草人小心地把它们弯来弯去。等锈迹全松了，那双胳膊也像新的一样好使。铁皮樵夫舒服地叹了口气，终于放下始终举着的斧头，把它靠在树上。
        - id: ch01-b23
          speaker: tin_woodman
          text: >-
            这下舒服多了！我一锈住，就只能一直举着这把斧头。现在总算可以放下啦。再替我的腿上点油，我就完全好了。
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: >-
            他们接着给他的两条腿上油，一边滴油，一边轻轻活动那些关节，直到两条腿都能自由弯曲。铁皮樵夫终于彻底摆脱了锈迹。他非常有礼貌，也真心感激这两位伙伴，一遍又一遍地向他们道谢。
        - id: ch01-b25
          speaker: tin_woodman
          text: >-
            要不是你们经过，我也许会永远站在那里。你们真的救了我的命。你们为什么会走到这儿来？
        - id: ch01-b26
          speaker: dorothy
          text: 我们正去翡翠城见伟大的奥兹。昨晚走到你的小屋，就在那里睡了一夜。
        - id: ch01-b27
          speaker: tin_woodman
          text: 你们找奥兹做什么？
        - id: ch01-b28
          speaker: dorothy
          text: 我想请他送我回堪萨斯。稻草人想让他往自己的脑袋里放些脑子。
        - id: ch01-b29
          speaker: narrator
          text: 铁皮樵夫认真想了一会儿。
        - id: ch01-b30
          speaker: tin_woodman
          text: 你说，奥兹会不会也能给我一颗心？
        - id: ch01-b31
          speaker: dorothy
          text: 我想他能。给你一颗心，应该不会比给稻草人脑子更难。
        - id: ch01-b32
          speaker: tin_woodman
          text: >-
            是啊。要是你们愿意带上我，我也去翡翠城，请奥兹帮我。
        - id: ch01-b33
          speaker: scarecrow
          text: 那就跟我们一起来！
        - id: ch01-b34
          speaker: narrator
          text: >-
            多萝茜也说，有他作伴，她会很高兴。铁皮樵夫听完，便把斧头扛到肩上，和大家一起穿过森林，重新回到铺着黄砖的路上。临走前，他还特意请多萝茜把油壶收进篮子。
        - id: ch01-b35
          speaker: tin_woodman
          text: 万一下雨把我淋锈了，我可少不了这只油壶。
        - id: ch01-b36
          speaker: narrator
          text: >-
            有了这位新伙伴，他们的运气真不错。重新上路没多久，前方的树木和枝条便越长越密，最后把整条路都堵住了，大家谁也过不去。铁皮樵夫马上动手。他的斧头用得十分利落，一下又一下，很快就替所有伙伴清出一条路来。
        - id: ch01-b37
          speaker: narrator
          text: >-
            多萝茜继续往前走，心里一直认真想着事情。稻草人一脚绊进路上的坑里，翻倒以后又滚到了路边，她竟然一点也没有发觉。稻草人自己起不来，只好大声叫住她，请她回来把自己重新扶好。
        - id: ch01-b38
          speaker: tin_woodman
          text: 你怎么不绕过那个坑呢？
        - id: ch01-b39
          speaker: scarecrow
          text: >-
            因为我知道得太少了。我脑袋里全是稻草，所以才要去找奥兹，请他送我些脑子。
        - id: ch01-b40
          speaker: tin_woodman
          text: 我明白了。不过，脑子也不一定是世上最好的东西。
        - id: ch01-b41
          speaker: scarecrow
          text: 你自己有脑子吗？
        - id: ch01-b42
          speaker: tin_woodman
          text: >-
            没有，我的脑袋是空的。可我以前既有脑子，也有心。这两样我都用过，要我来选，我更愿意要一颗心。
        - id: ch01-b43
          speaker: scarecrow
          text: 为什么呢？
        - id: ch01-b44
          speaker: tin_woodman
          text: 听完我的故事，你就知道了。
        - id: ch01-b45
          speaker: narrator
          text: 他们继续在森林里赶路。铁皮樵夫一边走，一边说起自己的过去。
        - id: ch01-b46
          speaker: tin_woodman
          text: >-
            我的父亲靠砍树、卖木柴过日子。我长大以后，也成了一名樵夫。父亲去世了，我便照顾年老的母亲，直到她也离开。后来，我不想独自过一辈子，就决定娶个妻子。
        - id: ch01-b47
          speaker: tin_woodman
          text: >-
            那时有位很美的芒奇金姑娘，我很快就全心爱上了她。她答应我，只要我挣到足够的钱，给她盖一所更好的房子，就嫁给我。我听了，干活比以前更卖力。
        - id: ch01-b48
          speaker: tin_woodman
          text: >-
            可她和一个老妇人住在一起。老妇人太懒了，想把姑娘永远留在身边，替她做饭、收拾屋子，所以不肯让她嫁人。她去求东方恶女巫帮忙，还答应送女巫两只羊和一头牛。女巫便对我的斧头施了魔法。
        - id: ch01-b49
          speaker: tin_woodman
          text: >-
            有一天，我一心想快点盖好新房，早点娶到妻子，正拼命地砍树。斧头突然一滑，把我的左腿砍断了。我以为这下糟了。只剩一条腿的人，怎么还能好好砍树呢？
        - id: ch01-b50
          speaker: tin_woodman
          text: >-
            我找到一位锡匠，请他做了一条新的铁皮腿。刚开始还有些不习惯，后来它就好使得很。东方恶女巫知道后却生了气。她答应过老妇人，一定不让我娶那个漂亮姑娘。等我重新拿起斧头砍树，它又滑了，这次砍断了右腿。我只得再次去找锡匠，他也再次给我装上一条铁皮腿。
        - id: ch01-b51
          speaker: tin_woodman
          text: >-
            接下来，那把中了魔法的斧头又一次次滑脱，先砍掉一条胳膊，再砍掉另一条。我一点也没有灰心，请锡匠把它们逐一换成铁皮胳膊。女巫仍旧不肯罢休，又让斧头砍掉我的脑袋。我原以为自己这次真的没命了，偏巧锡匠从那里经过，又替我做了一颗新的铁皮脑袋。
        - id: ch01-b52
          speaker: tin_woodman
          text: >-
            我以为自己赢了，干活比从前还努力。可我根本没想到，女巫会那么残忍。她想让那份爱情彻底消失，就再次叫斧头滑脱。这一斧穿过我的身子，把我劈成两半。
        - id: ch01-b53
          speaker: tin_woodman
          text: >-
            锡匠又一次赶来救我。他做出一副铁皮身体，再用关节把我的铁皮脑袋、胳膊和腿全接到身体上。我又能像过去那样自由行动了。可是，唉，我再也没有心。对芒奇金姑娘的爱也跟着消失了，娶不娶她，我都不再在意。我想，她大概还陪着那个老妇人，一直等我去接她。
          emotion: sad
        - id: ch01-b54
          speaker: tin_woodman
          text: >-
            我的铁皮身体在阳光下闪闪发亮，我看着很得意。斧头再怎么滑，也伤不了我。唯一怕的，就是关节生锈。所以我在小屋里放了油壶，需要时就给自己上油。
        - id: ch01-b55
          speaker: tin_woodman
          text: >-
            可有一天，我偏偏忘了上油，又在外面赶上一场大雨。我一开始根本没想到生锈的危险，等我想起来，所有关节已经锈死了。我只能一直站在树林里，动也不能动，直到你们来救我。这段经历实在可怕。不过站在那里的整整一年，我有的是时间想事情。我终于明白，自己失去的一切里，最要紧的就是那颗心。
          emotion: sad
        - id: ch01-b56
          speaker: tin_woodman
          text: >-
            爱着她的时候，我是世上最幸福的人。可没有心，就没法再去爱。所以，我一定要请奥兹给我一颗心。只要他肯，我就回去找那位芒奇金姑娘，和她结婚。
        - id: ch01-b57
          speaker: narrator
          text: >-
            多萝茜和稻草人都听得出了神。直到这时，他们才知道铁皮樵夫为什么那么盼望得到一颗新心。
        - id: ch01-b58
          speaker: scarecrow
          text: >-
            可我还是选脑子，不选心。一个傻瓜就算有心，也不会知道该怎么用它。
        - id: ch01-b59
          speaker: tin_woodman
          text: >-
            我还是要心。脑子不能叫人幸福，幸福才是世上最好的东西。
        - id: ch01-b60
          speaker: narrator
          text: >-
            多萝茜没有说话。两位朋友谁说得对，她实在想不明白。她只想回到堪萨斯，回到爱姆婶婶身边。至于铁皮樵夫没有脑子，稻草人没有心，还是他们最后都得到想要的东西，好像都没那么重要。
        - id: ch01-b61
          speaker: narrator
          text: >-
            真正叫她担心的是，面包快要吃光了。她和托托再吃一顿，篮子就会空空的。铁皮樵夫和稻草人都不用吃东西，可多萝茜不是铁皮做的，也不是稻草做的。没有食物，她可活不下去。
