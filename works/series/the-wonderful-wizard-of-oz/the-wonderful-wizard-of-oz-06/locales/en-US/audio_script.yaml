audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    dorothy:
      display_name: Dorothy
      tts:
        delivery: openhearted and direct
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    scarecrow:
      display_name: Scarecrow
      tts:
        delivery: friendly and guileless
        timbre: dry and husky
        pace: easy
        pitch: medium
    tin_woodman:
      display_name: Tin Woodman
      tts:
        delivery: courteous and earnest
        timbre: resonant and metallic
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Rescue of the Tin Woodman
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dorothy woke to sunlight streaming through the trees. Toto had been
            up for some time, chasing birds and squirrels. When she sat up and
            looked around, she found the Scarecrow standing patiently in his
            corner, just where he had waited all night.
        - id: ch01-b02
          speaker: dorothy
          text: We need to find some water.
        - id: ch01-b03
          speaker: scarecrow
          text: What do you need water for?
        - id: ch01-b04
          speaker: dorothy
          text: >-
            I need to wash the road dust off my face and get a drink. Otherwise,
            that dry bread will stick in my throat.
        - id: ch01-b05
          speaker: scarecrow
          text: >-
            Being made of flesh must be quite a bother. You have to sleep, eat,
            and drink. Still, you have brains. Thinking properly must be worth
            all that trouble.
        - id: ch01-b06
          speaker: narrator
          text: >-
            They left the cottage and made their way through the trees. Before
            long, they found a small spring of clear water. Dorothy drank, washed
            her face, and ate breakfast. There was very little bread left in the
            basket. She was thankful the Scarecrow needed no food, because there
            was barely enough for her and Toto to last the day.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After her meal, Dorothy was about to return to the yellow brick road
            when a deep groan nearby made her jump.
        - id: ch01-b08
          speaker: dorothy
          text: What was that?
          emotion: fearful
        - id: ch01-b09
          speaker: scarecrow
          text: I have no idea. Let's go find out.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Another groan came from behind them. They turned and walked a few
            steps into the forest. A ray of sunshine fell between the trees, and
            something in it gleamed. Dorothy ran toward the shining object. The
            moment she saw what it was, she stopped short with a little cry of
            surprise.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A large tree had been chopped partway through. Beside it stood a man
            made entirely of tin, holding an axe above his head. His head, arms,
            and legs were joined to his body, but he was perfectly still. He
            could not move at all.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Dorothy and the Scarecrow stared at him. Toto barked fiercely and
            snapped at one of the tin legs, only to hurt his teeth.
        - id: ch01-b13
          speaker: dorothy
          text: Were you the one groaning?
        - id: ch01-b14
          speaker: tin_woodman
          text: >-
            Yes, that was me. I've been groaning for over a year, but until now,
            nobody ever heard me or came to help.
          emotion: sad
        - id: ch01-b15
          speaker: dorothy
          text: What can I do to help you?
        - id: ch01-b16
          speaker: narrator
          text: His sad voice had touched her, and she spoke very gently.
        - id: ch01-b17
          speaker: tin_woodman
          text: >-
            Please get the oil can and put some oil on my joints. They've rusted
            so badly that I can't move. Once I'm oiled, I'll soon be all right.
            The oil can is on a shelf inside my cottage.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Dorothy ran straight back to the cottage. She found the oil can,
            hurried to the tin man, and looked over his rigid body.
        - id: ch01-b19
          speaker: dorothy
          text: Where should I put the oil?
        - id: ch01-b20
          speaker: tin_woodman
          text: Start with my neck.
        - id: ch01-b21
          speaker: narrator
          text: >-
            His neck was badly rusted. After Dorothy oiled it, the Scarecrow took
            hold of the tin head and gently moved it from side to side. Soon the
            rusted joint loosened and worked freely. Then the Tin Woodman could
            turn his head from side to side all by himself.
        - id: ch01-b22
          speaker: tin_woodman
          text: Now, please oil the joints in my arms.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Dorothy did, and the Scarecrow carefully bent each arm until the rust
            was gone and both moved as well as ever. The Tin Woodman sighed with
            relief. At last he lowered the axe and leaned it against the tree.
        - id: ch01-b24
          speaker: tin_woodman
          text: >-
            What a relief! I've held that axe up ever since I rusted. It feels
            wonderful to put it down at last. If you'll oil my leg joints now,
            I'll be myself again.
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: >-
            They oiled his legs until he could move them freely. He thanked them
            over and over for setting him free. He was a very polite creature,
            and deeply grateful.
        - id: ch01-b26
          speaker: tin_woodman
          text: >-
            If you hadn't come this way, I might have stood there forever. You
            truly saved my life. What brought you here?
        - id: ch01-b27
          speaker: dorothy
          text: >-
            We're going to the Emerald City to see the Great Oz. We stayed in
            your cottage last night.
        - id: ch01-b28
          speaker: tin_woodman
          text: Why do you want to see Oz?
        - id: ch01-b29
          speaker: dorothy
          text: >-
            I want him to send me home to Kansas, and the Scarecrow wants Oz to
            put some brains in his head.
        - id: ch01-b30
          speaker: narrator
          text: The Tin Woodman stood thinking for a moment.
        - id: ch01-b31
          speaker: tin_woodman
          text: Do you think Oz could give me a heart?
        - id: ch01-b32
          speaker: dorothy
          text: >-
            I suppose he could. Giving you a heart should be no harder than
            giving the Scarecrow brains.
        - id: ch01-b33
          speaker: tin_woodman
          text: >-
            That's true. Then, if you'll let me come with you, I'll go to the
            Emerald City and ask Oz to help me, too.
        - id: ch01-b34
          speaker: scarecrow
          text: Come with us!
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: >-
            Dorothy said she would be glad to have him along. The Tin Woodman
            lifted his axe onto his shoulder, and they all went through the
            forest until they reached the yellow brick road.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Before they left, the Tin Woodman had asked Dorothy to put the oil
            can in her basket.
        - id: ch01-b37
          speaker: tin_woodman
          text: >-
            If the rain catches me and I rust again, I'll need that oil can very
            badly.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Having their new companion soon proved lucky. Thick trees and
            branches grew across the road ahead until there was no way through.
            The travelers could not pass them. The Tin Woodman went right to
            work with his axe. He chopped so skillfully that before long, he had
            cleared a path wide enough for the whole party.
        - id: ch01-b39
          speaker: narrator
          text: >-
            As they walked on, Dorothy became so lost in thought that she never
            saw the Scarecrow step into a hole. He tumbled over beside the road
            and could not get back on his feet. He had to call out before Dorothy
            noticed him and came to help him up again.
        - id: ch01-b40
          speaker: tin_woodman
          text: Why didn't you go around that hole?
        - id: ch01-b41
          speaker: scarecrow
          text: >-
            I don't know enough to do that. My head is stuffed with straw,
            remember? I can't tell when I should walk around something. That's
            why I'm going to Oz to ask him for brains.
        - id: ch01-b42
          speaker: tin_woodman
          text: I understand. Still, brains aren't the finest thing in the world.
        - id: ch01-b43
          speaker: scarecrow
          text: Do you have any brains?
        - id: ch01-b44
          speaker: tin_woodman
          text: >-
            No. My head is completely empty. But I once had both brains and a
            heart. I've tried them both, and I would much rather have a heart.
        - id: ch01-b45
          speaker: scarecrow
          text: Why would you choose a heart?
        - id: ch01-b46
          speaker: tin_woodman
          text: Let me tell you my story. Then you'll understand.
        - id: ch01-b47
          speaker: narrator
          text: As they continued through the forest, the Tin Woodman began.
        - id: ch01-b48
          speaker: tin_woodman
          text: >-
            My father was a woodman. He cut down trees in this forest and sold
            the wood to earn a living. When I grew up, I became a wood-chopper,
            too. After my father died, I took care of my old mother for the rest
            of her life. When she was gone, I decided I would marry. I did not
            want to spend all my years living alone.
        - id: ch01-b49
          speaker: tin_woodman
          text: >-
            I fell in love with a beautiful Munchkin girl. She promised to marry
            me as soon as I earned enough money to build her a better house, so I
            worked harder than ever.
        - id: ch01-b50
          speaker: tin_woodman
          text: >-
            But she lived with an old woman who wanted to keep her there. The old
            woman was lazy and made the girl do all the cooking and housework.
            She did not want the girl to marry anyone. So she went to the Wicked
            Witch of the East and promised her two sheep and a cow if she would
            stop our wedding. The Witch agreed and put an enchantment on my axe.
        - id: ch01-b51
          speaker: tin_woodman
          text: >-
            One day, I was chopping as hard as I could. I wanted to finish the
            house and marry my sweetheart soon. Without warning, the enchanted
            axe slipped and cut off my left leg.
        - id: ch01-b52
          speaker: tin_woodman
          text: >-
            That seemed like a terrible disaster. A man with only one leg could
            hardly work as a wood-chopper. I went to a tinsmith, and he made me a
            new leg out of tin. Once I got used to it, the leg worked very well.
        - id: ch01-b53
          speaker: tin_woodman
          text: >-
            That made the Wicked Witch angry. She had promised the old woman I
            would never marry the Munchkin girl. When I returned to chopping, the
            axe slipped again and took off my right leg. The tinsmith made me
            another tin leg.
        - id: ch01-b54
          speaker: tin_woodman
          text: >-
            Next, the enchanted axe cut off my arms, one after the other. I did
            not let that stop me. Each time, I had the tinsmith replace the lost
            arm with one made of tin. Then the Witch made the axe slip once more,
            and it cut off my head. At first, I thought that must be the end of
            me. But the tinsmith happened to come along. He made me a new tin
            head, and I could go on working.
        - id: ch01-b55
          speaker: tin_woodman
          text: >-
            I believed I had beaten the Wicked Witch, and I worked even harder.
            I didn't know how cruel she could be. She found another way to
            destroy my love for the Munchkin girl. Once more, she made my axe
            slip. This time it cut straight through my body and split me in two.
        - id: ch01-b56
          speaker: tin_woodman
          text: >-
            The tinsmith helped me again. He made a body of tin and fastened my
            tin head, arms, and legs to it with joints. I could move just as well
            as before. But now I had no heart. Without it, all my love for the
            Munchkin girl disappeared. I no longer cared whether we married. I
            suppose she is still with that old woman, waiting for me to return.
          emotion: sad
        - id: ch01-b57
          speaker: tin_woodman
          text: >-
            My tin body gleamed so brightly in the sun that I felt very proud of
            it. I no longer worried about the axe slipping, because it couldn't
            cut through the tin. Rust was the only danger left. I kept an oil can
            in my cottage and took care to oil every joint whenever it needed it.
        - id: ch01-b58
          speaker: tin_woodman
          text: >-
            Then one day, I forgot. A rainstorm caught me before I remembered the
            danger. Before I could protect myself, all my joints rusted tight. I
            could do nothing but stand helpless in the woods until you found me.
            Being trapped there for so long was a terrible thing to endure.
        - id: ch01-b59
          speaker: tin_woodman
          text: >-
            During that whole year, I had plenty of time to think. The greatest
            loss I had ever suffered was the loss of my heart. When I was in
            love, I was the happiest man on earth. But without a heart, no one
            can love. So I mean to ask Oz for one. If he gives me a heart, I'll
            return to the Munchkin girl and marry her.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Dorothy and the Scarecrow had listened with great interest. At last,
            they understood why the Tin Woodman wanted a new heart so badly.
        - id: ch01-b61
          speaker: scarecrow
          text: >-
            Even so, I'm going to ask for brains instead of a heart. A fool
            wouldn't know what to do with a heart, even if he had one.
        - id: ch01-b62
          speaker: tin_woodman
          text: >-
            And I will choose the heart. Brains can't make a person happy, and
            happiness is the best thing in the world.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Dorothy said nothing. She could not decide which friend was right.
            If she could only return to Kansas and Aunt Em, she thought it would
            not matter very much whether the Woodman had no brains and the
            Scarecrow had no heart, or whether each one received what he wanted.
        - id: ch01-b64
          speaker: narrator
          text: >-
            What worried Dorothy most was the food. The bread was almost gone.
            One more meal for her and Toto would empty the basket. The Woodman
            and the Scarecrow never needed to eat, but Dorothy was not made of
            tin or straw. She could not live without food.
