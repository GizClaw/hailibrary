  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and thoughtful
        timbre: clear and welcoming
        pace: measured
        pitch: medium
    uncle_henry:
      display_name: Uncle Henry
      tts:
        delivery: plainspoken and serious
        timbre: low and weathered
