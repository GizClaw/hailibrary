  chapters:
    - id: ch01
      title: Chapter I The Cyclone
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Dorothy lived in the middle of the great Kansas prairies with Uncle
            Henry, a farmer, and Aunt Em, his wife. Their house was small because
            every piece of lumber had to travel many miles by wagon. Four walls, a
            floor, and a roof made one room. Inside stood a rusty-looking cookstove,
            a dish cupboard, a table, three or four chairs, and the beds. Uncle
            Henry and Aunt Em shared a big bed in one corner. Dorothy's little bed
            stood in another.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There was no attic and no real cellar. The only space below the house
            was a small, dark hole called a cyclone cellar. If one of the huge
            whirlwinds came, strong enough to crush any building in its path, the
            family could hide there. A trapdoor in the middle of the floor opened
            onto a ladder that led down into the hole.
        - id: ch01-b03
          speaker: narrator
          text: >-
            From the doorway, Dorothy could see the great gray prairie stretching
            away on every side. No tree or house broke the wide, flat sweep of land
            that reached all the way to the sky. The sun had baked the plowed earth
            into a cracked gray mass. It had burned the tops of the long grass
            until they were gray, too. The house had once been painted, but the sun
            blistered the paint and the rain washed it off. Now the house looked as
            dull and gray as everything around it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Aunt Em had been young and pretty when she first came to live there.
            The sun and wind had changed her. The sparkle had gone from her eyes,
            leaving them a sober gray. The red had gone from her cheeks and lips.
            She was thin and worn, and she never smiled anymore.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dorothy was an orphan. When she first came to Aunt Em, the little girl's
            laughter startled her aunt so badly that Aunt Em would cry out and
            press a hand to her heart whenever Dorothy's merry voice rang through
            the house. Even now, Aunt Em looked at Dorothy and wondered how the
            child could find anything to laugh about.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Uncle Henry never laughed at all. He worked hard from morning until
            night and knew nothing of joy. He was gray from his long beard down to
            his rough boots. He looked stern and solemn, and he hardly ever spoke.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Toto kept Dorothy from turning as gray as everything else. He was a
            little black dog with long, silky hair and bright black eyes beside his
            funny little nose. Toto played all day, and Dorothy played with him.
            She loved him dearly.
        - id: ch01-b08
          speaker: narrator
          text: >-
            But they were not playing that day. Uncle Henry sat on the doorstep,
            watching the sky with an anxious face. It looked grayer than usual.
            Dorothy stood in the doorway with Toto in her arms and watched it, too.
            Aunt Em was washing the dishes.
        - id: ch01-b09
          speaker: narrator
          text: >-
            A low moan of wind came from far to the north. Uncle Henry and Dorothy
            saw the long grass bend in waves ahead of the storm. Then a sharp
            whistle cut through the air from the south. When they looked that way,
            they saw ripples moving through the grass there, too.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Uncle Henry jumped to his feet.
        - id: ch01-b11
          speaker: uncle_henry
          text: >-
            Em, a cyclone's coming! I'm going to see to the animals.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He ran toward the sheds where the cows and horses were kept. Aunt Em
            dropped what she was doing and hurried to the door. One look was enough.
            The danger was almost upon them.
        - id: ch01-b13
          speaker: aunt_em
          text: >-
            Hurry, Dorothy! Get into the cellar!
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            Toto leaped from Dorothy's arms and hid under the bed. Dorothy went
            after him. Terrified, Aunt Em flung open the trapdoor and climbed down
            the ladder into the dark little hole. At last Dorothy caught Toto and
            started after her. But halfway across the room, the wind gave a terrible
            shriek. The house shook so violently that Dorothy lost her balance and
            dropped onto the floor.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Then something strange happened. The house spun around two or three
            times and slowly rose into the air. Dorothy felt as though she were
            floating up in a balloon.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The winds from the north and south had met right where the house stood,
            putting it in the exact center of the cyclone. The air in the middle of
            a cyclone is usually still. But the wind pressing against every side of
            the house lifted it higher and higher. It rose all the way to the top of
            the cyclone. There it stayed, carried for miles as easily as you might
            carry a feather.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Darkness surrounded Dorothy, and the wind howled horribly outside. Yet
            the ride itself felt surprisingly easy. After the first few spins, and
            one more moment when the house tipped badly, it began to rock her as
            gently as a cradle rocks a baby.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Toto did not enjoy the ride. He dashed from one side of the room to the
            other, barking loudly. Dorothy stayed very still on the floor and waited
            to see what would happen.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Once, Toto ran too close to the open trapdoor and tumbled through it.
            For a moment, Dorothy thought he was gone. Then she spotted one ear
            poking up through the opening. The powerful air below was holding him
            up, so he could not fall. Dorothy crawled over, caught Toto by the ear,
            and pulled him back into the room. After that, she closed the trapdoor
            so nothing else could happen.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The hours went by. Little by little, Dorothy's fear faded, though she
            felt very lonely. The wind screamed so loudly around her that it nearly
            deafened her. At first, she had wondered if the house would crash down
            and smash to pieces. But nothing terrible happened. So she stopped
            worrying. She would wait quietly and find out what came next.
        - id: ch01-b21
          speaker: narrator
          text: >-
            At last, Dorothy crawled across the swaying floor to her bed and lay
            down. Toto followed and curled up beside her.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The house kept rocking, and the wind kept wailing. Even so, Dorothy
            soon closed her eyes and fell fast asleep.
