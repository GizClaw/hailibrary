audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和从容，带着童话序幕般的诚恳
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    uncle_henry:
      display_name: 亨利叔叔
      tts:
        delivery: 朴实严肃，话语简短
        timbre: 低沉粗粝
        pace: 平稳
        pitch: 低音
    aunt_em:
      display_name: 艾姆婶婶
      tts:
        delivery: 干练克制，危急时急促有力
        timbre: 清瘦成熟
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第一章　旋风
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            多萝茜住在辽阔的堪萨斯大草原上，和她同住的是务农的亨利叔叔，还有叔叔的妻子艾姆婶婶。盖房子的木料要坐大车走上很远才能运到，所以他们的家很小。四面墙，一片地板，一个屋顶，这就是整间屋子。里面放着锈迹斑斑的炉灶、装餐具的碗橱、一张桌子、三四把椅子，还有床。叔叔婶婶的大床在一个墙角，多萝茜的小床在另一个墙角。
        - id: ch01-b02
          speaker: narrator
          text: >-
            屋里没有阁楼，真正的地窖也没有。地面下只挖了一个又小又黑的洞，大家管它叫旋风避难窖。要是威力惊人的旋风来了，沿路连房子都能摧毁，一家人就可以躲进这个洞。屋子中央有扇活板门，打开门，顺着梯子就能爬下去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            多萝茜站在门口，不管往哪边看，眼前都是灰色的大草原。平地一直铺到天边，中间既没有树，也没有房子。太阳把耕地烤成灰扑扑的一大片，地上裂出一道道细缝。长草也不绿，草尖早被晒焦，到处都是同样的灰色。房子以前刷过漆，可太阳晒起了漆皮，雨水又把漆冲走。如今，它也和四周一样灰暗无光。
        - id: ch01-b04
          speaker: narrator
          text: >-
            艾姆婶婶刚搬来时，年轻又漂亮。可日晒风吹也改变了她。她眼中的光彩不见了，只留下一片沉静的灰。脸颊和嘴唇失去了红润，也变得灰白。她瘦削憔悴，再也不笑。多萝茜是个孤儿，才来到婶婶身边时，笑声总会把婶婶吓得惊叫起来，赶紧按住胸口。就是到了现在，婶婶看着这个小姑娘，还是不明白她怎么能找到值得发笑的事情。
        - id: ch01-b05
          speaker: narrator
          text: >-
            亨利叔叔也从不发笑。他每天从早忙到晚，根本不懂欢乐是什么。他从长胡子到粗靴子，浑身都显得灰扑扑的。那张脸又严肃又庄重，嘴里也难得冒出一句话。
        - id: ch01-b06
          speaker: narrator
          text: >-
            只有托托能逗多萝茜笑，让她没有跟周围的一切一起变灰。托托可不是灰的。它是一只小黑狗，长着柔软光滑的长毛。滑稽的小鼻子两边，一双乌黑的小眼睛快活地闪着亮光。托托一天到晚都在玩，多萝茜就陪它玩。她爱极了这只小狗。
        - id: ch01-b07
          speaker: narrator
          text: >-
            但这一天，他们没有玩。亨利叔叔坐在门阶上，担忧地盯着天空。天色比平常还要灰暗。多萝茜抱着托托站在门口，也跟着望向天空。艾姆婶婶正在洗碗。
        - id: ch01-b08
          speaker: narrator
          text: >-
            北边很远的地方，传来了风低低的呜咽。风暴还没到，前方的长草已经一浪接一浪地倒伏下去。亨利叔叔和多萝茜都看见了。紧接着，南边又响起尖厉的风哨声。他们转头一看，那边的草丛里竟然也翻起了层层波纹。
        - id: ch01-b09
          speaker: narrator
          text: 亨利叔叔一下站了起来。
        - id: ch01-b10
          speaker: uncle_henry
          text: 艾姆，旋风要来了！我去管好那些牲口。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他立刻跑向关着牛马的棚屋。艾姆婶婶放下手里的活，赶到门口。她只朝外看了一眼，就知道危险已经近在眼前。
        - id: ch01-b12
          speaker: aunt_em
          text: 多萝茜，快！快躲进地窖！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            托托从多萝茜怀里跳出去，钻到了床底下。多萝茜赶紧去捉它。艾姆婶婶怕极了，她猛地掀起地板上的活板门，沿梯子爬进漆黑的小洞。多萝茜总算抓住托托，也要跟着下去。可她刚走到半路，狂风突然发出一声刺耳的尖啸。整座房子摇得太厉害，多萝茜站立不稳，一下坐在地板上。
        - id: ch01-b14
          speaker: narrator
          text: >-
            就在这时，怪事发生了。房子先转了两三圈，接着慢慢升到空中。多萝茜觉得，自己就像坐上气球，正往天上飘。
        - id: ch01-b15
          speaker: narrator
          text: >-
            原来，南北两股风正好在房子这里相遇，让房子落在了旋风的正中心。旋风中央通常没有风，可四周的狂风一齐挤压房子，把它越托越高，一直托到旋风顶端。房子留在那里，被风带着走出一英里又一英里，轻松得就像人手里带着一根羽毛。
        - id: ch01-b16
          speaker: narrator
          text: >-
            多萝茜周围漆黑一片，外面的风发出可怕的号叫，可房子飞起来以后倒不算太颠。起先，它转了几圈。后来还有一回，屋子猛地歪向一边。除此以外，多萝茜只觉得自己在轻轻摇荡，就像躺在摇篮里的婴儿。
        - id: ch01-b17
          speaker: narrator
          text: >-
            托托一点也不喜欢这趟旅程。它在屋里东奔西跑，叫个不停。多萝茜却静静坐在地板上，等着瞧下一刻会出什么事。
        - id: ch01-b18
          speaker: narrator
          text: >-
            有一次，托托跑到了敞开的活板门旁边，一脚掉了进去。多萝茜起初以为它已经不见了，很快却发现，一只耳朵还露在洞口。洞里的气流很强，正好托着托托，所以它掉不下去。多萝茜爬过去，抓住那只耳朵，把小狗拖回屋里。接着，她关好活板门，免得再发生意外。
        - id: ch01-b19
          speaker: narrator
          text: >-
            时间一个钟头一个钟头地过去，多萝茜也慢慢没那么怕了。只是她觉得很孤单，四周的风又叫得那么响，差一点就要震聋她。起先，她担心房子落下去时会摔个粉碎。可是过了好几个钟头，什么可怕的事也没发生。于是她放下心来，决定安静地等着，看以后到底会怎样。最后，她爬过摇摆不停的地板，来到床边躺下。托托也跟过来，卧在她身旁。
        - id: ch01-b20
          speaker: narrator
          text: >-
            房子依旧摇摇晃晃，风还在不停哀号。尽管这样，多萝茜很快闭上眼睛，沉沉地睡着了。
