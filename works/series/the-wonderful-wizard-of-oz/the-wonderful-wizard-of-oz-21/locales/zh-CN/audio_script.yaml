audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着童话讲述者的悬念感
        timbre: 清澈柔和
        pace: 舒缓而富于变化
        pitch: 中音
    dorothy:
      display_name: 多萝茜
      tts:
        delivery: 真诚直接，遇到危险时仍显坚定
        timbre: 清亮稚嫩
        pace: 自然而轻快
        pitch: 中高音
    scarecrow:
      display_name: 稻草人
      tts:
        delivery: 朴实机敏，思考时认真而坦率
        timbre: 轻柔干爽
        pace: 稍慢而清楚
        pitch: 中高音
    tin_woodman:
      display_name: 铁皮樵夫
      tts:
        delivery: 温和善良，话语诚恳而略带忧郁
        timbre: 清脆而温润
        pace: 平稳
        pitch: 中音
    cowardly_lion:
      display_name: 胆小的狮子
      tts:
        delivery: 浑厚坦率，威猛中总透出不安
        timbre: 低沉宽厚
        pace: 稍慢，紧张时加快
        pitch: 低音
    milkmaid:
      display_name: 挤奶姑娘
      tts:
        delivery: 伶俐直率，生气时尖锐而干脆
        timbre: 清脆明亮
        pace: 中等偏快
        pitch: 中高音
    china_princess:
      display_name: 瓷公主
      tts:
        delivery: 优雅谨慎，语气柔和而真诚
        timbre: 细腻清亮
        pace: 从容
        pitch: 中高音
    mr_joker:
      display_name: 滑稽先生
      tts:
        delivery: 顽皮夸张，念韵文时轻快俏皮
        timbre: 明亮而略带滑稽感
        pace: 轻快多变
        pitch: 高音
  chapters:
    - id: ch01
      title: 第二十章　精美的瓷器国
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 铁皮樵夫在森林里找来木头，动手做起了梯子。多萝茜走了很远的路，早已累坏了，便躺下睡了一觉。狮子也蜷起身子睡着了，托托就卧在他旁边。
        - id: ch01-b02
          speaker: narrator
          text: 稻草人守在铁皮樵夫身边，看着他忙活。
        - id: ch01-b03
          speaker: scarecrow
          text: 我真弄不懂，这里为什么会有一道墙。它究竟是什么做的呢？
        - id: ch01-b04
          speaker: tin_woodman
          text: 先让你的脑子歇会儿吧，别老惦记这道墙。等翻过去，我们就能看到那边有什么了。
        - id: ch01-b05
          speaker: narrator
          text: 过了一阵，梯子做好了。模样虽然笨重，铁皮樵夫却很有把握，觉得它够结实，正好能派上用场。稻草人叫醒多萝茜、狮子和托托，告诉他们可以出发了。他第一个爬上去，动作却笨手笨脚。多萝茜只好紧跟在后面护着，免得他掉下来。等脑袋探过墙头，稻草人忍不住叫了一声。
        - id: ch01-b06
          speaker: scarecrow
          text: 哎呀！
          emotion: surprised
        - id: ch01-b07
          speaker: dorothy
          text: 别停呀，继续往上爬！
        - id: ch01-b08
          speaker: narrator
          text: 稻草人又爬了几步，在墙顶坐稳。多萝茜把头探到墙外一看，也跟着叫了声“哎呀”。托托接着爬上来，一露头便汪汪直叫，多萝茜赶紧让他安静。随后是狮子，最后才轮到铁皮樵夫。他们两个刚望过墙头，也都叫了声“哎呀”。伙伴们在墙头一字排开，朝下面望去，看到了一片从未见过的奇景。
        - id: ch01-b09
          speaker: narrator
          text: 墙外铺着一大片雪白的土地，又亮又滑，简直像一只大盘子的盘底。地上散落着许多小房子，全是瓷做的，还涂着最鲜艳的颜色。最高的一座，也只到多萝茜腰间。四周还有漂亮的小谷仓，每座谷仓外面都围着瓷篱笆。一群群牛、羊、马、猪和鸡站在各处，也都是瓷的。
        - id: ch01-b10
          speaker: narrator
          text: 不过，那里最奇妙的还是居民。挤奶姑娘和牧羊姑娘穿着鲜亮的紧身上衣，裙上点着金色圆斑。公主们穿的是银色、金色和紫色的华美衣裙。牧羊人的及膝短裤上，有一道道粉红、明黄和蔚蓝的条纹，鞋子扣着金搭扣。王子们戴着镶嵌宝石的王冠，披着白鼬皮长袍，里面还穿着缎子紧身上衣。小丑则套着褶边袍子，两边脸颊各有一块红圆斑，帽子又高又尖。最不可思议的是，他们连身体带衣服，全由瓷器制成。个头还那么小，最高的人也不到多萝茜膝盖。
        - id: ch01-b11
          speaker: narrator
          text: 起初，没有一个人抬头看旅行者。只有一只紫色的小瓷狗跑到墙边，顶着一颗大得出奇的脑袋，用细细的声音冲他们叫了几声，随后又跑远了。
        - id: ch01-b12
          speaker: dorothy
          text: 可我们该怎么下去呢？
        - id: ch01-b13
          speaker: narrator
          text: 梯子太重了，谁也拉不上来。他们只好让稻草人先从墙上摔下去，再一个接一个跳到他身上，免得坚硬的地面硌伤脚。大家落脚时都小心避开他的脑袋，可不想让大头针扎进脚底。等所有人都安全下来，他们扶起身体已经压得扁扁的稻草人，重新拍匀他身上的稻草，让他恢复原样。
        - id: ch01-b14
          speaker: dorothy
          text: 想走到墙的另一边，就得穿过这个古怪的地方。我们必须一直向南，改走别的方向可不聪明。
        - id: ch01-b15
          speaker: narrator
          text: 伙伴们走进瓷人国，最先看见一个瓷姑娘，正替一头瓷牛挤奶。他们刚一靠近，瓷牛突然抬腿一踢。凳子倒了，奶桶翻了，连挤奶姑娘也摔在瓷地面上，所有东西撞在一起，顿时响起一阵刺耳的叮当声。
        - id: ch01-b16
          speaker: narrator
          text: 多萝茜吓了一跳。瓷牛摔断了一条腿，奶桶碎成好几片，那个可怜的姑娘左手肘上也缺了一小块。
        - id: ch01-b17
          speaker: milkmaid
          text: 瞧瞧你们做了什么！我的牛把腿摔断了，我还得送它去修补店，把断腿重新粘上。你们干吗闯进来，把我的牛吓成这样？
          emotion: angry
        - id: ch01-b18
          speaker: dorothy
          text: 真对不起。请你原谅我们吧。
        - id: ch01-b19
          speaker: narrator
          text: 漂亮的挤奶姑娘还在气头上，根本不肯回答。她闷闷不乐地捡起那条断腿，牵着瓷牛离开。可怜的牛只能靠三条腿一瘸一拐地走。姑娘把磕破的手肘紧紧护在身旁，还一再回头，责怪地瞪着这些笨拙的陌生人。多萝茜为这场意外难过极了。
        - id: ch01-b20
          speaker: tin_woodman
          text: 在这里可得格外当心。要是伤了这些漂亮的小人儿，也许他们一辈子都修不好了。
        - id: ch01-b21
          speaker: narrator
          text: 再往前走了一会儿，多萝茜遇见一位衣着华丽的年轻公主。公主猛然看到陌生人，立刻停住脚，转身就想逃走。多萝茜想把她看得更仔细些，便追了过去。瓷姑娘吓得叫起来。
        - id: ch01-b22
          speaker: china_princess
          text: 别追我！求你别再追了！
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: 那声音又细又害怕，多萝茜听了，马上停下脚步。
        - id: ch01-b24
          speaker: dorothy
          text: 我为什么不能追你呢？
        - id: ch01-b25
          speaker: china_princess
          text: 因为我一跑，就可能摔倒，把自己摔成碎片呀。
        - id: ch01-b26
          speaker: narrator
          text: 公主也停了下来，不过仍旧和多萝茜隔着一段安全的距离。
        - id: ch01-b27
          speaker: dorothy
          text: 那你不能再修好吗？
        - id: ch01-b28
          speaker: china_princess
          text: 修当然能修。可一旦补过，就再也没有原来那么漂亮了。
        - id: ch01-b29
          speaker: dorothy
          text: 我想，确实会这样。
        - id: ch01-b30
          speaker: china_princess
          text: 你看，我们这儿有个小丑，大家叫他滑稽先生。他老爱倒立，不知道把自己摔碎过多少回。现在身上足足补了一百处，早就不好看了。他正往这边走，你亲眼看看就知道。
        - id: ch01-b31
          speaker: narrator
          text: 一个快活的小丑果然朝她们走了过来。他身上的衣服有红、有黄、也有绿，原本漂亮得很。可多萝茜看得清清楚楚，他全身上下都爬满了裂纹。那些纹路横一道、竖一道，明明白白地告诉别人，他已经被修补过许多次。小丑把双手插进口袋，先鼓起腮帮子，又冲她们顽皮地点点头，接着念起一段顺口溜。
        - id: ch01-b32
          speaker: mr_joker
          text: 美丽小姑娘，为何细端详？可怜滑稽老先生，你却挺得直又僵，一脸严肃的模样，莫非吞了根火钳，才会这般硬邦邦？
          emotion: happy
        - id: ch01-b33
          speaker: china_princess
          text: 先生，请安静一点！你没看见他们是远道来的客人吗？对客人应该有礼貌。
        - id: ch01-b34
          speaker: mr_joker
          text: 要我猜呀，我这就叫有礼貌！
        - id: ch01-b35
          speaker: narrator
          text: 说完，他立刻倒立起来。
        - id: ch01-b36
          speaker: china_princess
          text: 别理滑稽先生。他的脑袋裂得太厉害，所以才总干傻事。
        - id: ch01-b37
          speaker: dorothy
          text: 我才不介意他呢。倒是你这么美，我一定会很喜欢你。让我把你带回堪萨斯，好不好？我可以把你装进篮子，再摆到爱姆婶婶家的壁炉台上。
        - id: ch01-b38
          speaker: china_princess
          text: 那样我会很不快乐。我们留在自己的国度里，日子过得很满足，想说话就说话，想走动就走动。可只要有人把我们带走，我们的关节马上就会僵住，从此只能直直地站在那里，给人看着。摆在壁炉台、陈列柜或客厅桌子上的瓷像，本来就只需要这样。可我们还是留在家乡活得更开心。
        - id: ch01-b39
          speaker: dorothy
          text: 不管拿什么来换，我都不愿意让你伤心。那我就只跟你说声再见吧！
        - id: ch01-b40
          speaker: china_princess
          text: 再见。
        - id: ch01-b41
          speaker: narrator
          text: 他们一路小心地穿过瓷器国。那些瓷人和小动物一看见他们，就纷纷跑到一旁，生怕这些陌生人撞过来，把自己碰成碎片。大约过了一个钟头，旅行者终于到了国土另一头，面前又出现一道瓷墙。
        - id: ch01-b42
          speaker: narrator
          text: 好在第二道墙没有第一道那么高。伙伴们一个接一个踩到狮子的背上，费了一番力气，总算全都攀上了墙头。狮子把四条腿往身下一收，接着纵身跃上墙去。可就在他起跳的时候，那条尾巴扫倒了一座瓷教堂，整座教堂一下摔得粉碎。
        - id: ch01-b43
          speaker: dorothy
          text: 这可真糟糕。不过仔细想想，我们只弄断了一条牛腿，又打碎了一座教堂，没有伤到更多小人儿，也算很走运了。他们实在太容易碎啦！
        - id: ch01-b44
          speaker: scarecrow
          text: 一点没错。我真庆幸自己是稻草做的，不会轻易受损。世上还有许多事情，比当一个稻草人更糟呢。
