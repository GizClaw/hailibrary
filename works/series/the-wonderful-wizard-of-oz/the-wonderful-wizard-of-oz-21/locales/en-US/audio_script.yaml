  chapters:
    - id: ch01
      title: The Dainty China Country
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Tin Woodman found some wood in the forest and began making a ladder. Dorothy was worn out from their long walk, so she lay down and went to sleep. The Lion curled up for a nap too, with Toto beside him. The Scarecrow stayed awake and watched the Woodman work.
        - id: ch01-b02
          speaker: scarecrow
          text: >-
            I can't imagine why anyone put this wall here. And what could it be made of?
        - id: ch01-b03
          speaker: tin_woodman
          text: >-
            Give your brains a rest. There's no use worrying about the wall. Once we climb over it, we'll find out what's on the other side.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At last the ladder was done. It looked awkward, but the Tin Woodman felt sure it was sturdy enough. The Scarecrow woke Dorothy, the Lion, and Toto, and told them it was ready. He went up first. He climbed so clumsily that Dorothy had to stay right behind him and keep him from tumbling off. The moment his head rose above the wall, he stared over the top.
        - id: ch01-b05
          speaker: scarecrow
          text: Oh, my!
          emotion: surprised
        - id: ch01-b06
          speaker: dorothy
          text: Keep going!
        - id: ch01-b07
          speaker: narrator
          text: >-
            The Scarecrow climbed the rest of the way and sat on top of the wall. Dorothy raised her head above it and saw what he had seen.
        - id: ch01-b08
          speaker: dorothy
          text: Oh, my!
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: >-
            Toto came up next and started barking at once, but Dorothy quieted him. Then the Lion climbed the ladder, and the Tin Woodman came last. Each of them cried, “Oh, my!” when he looked over. Soon all the travelers were sitting in a row along the top, gazing down at a very strange sight.
        - id: ch01-b10
          speaker: narrator
          text: >-
            A wide country stretched out before them. Its floor was smooth, shining, and white, like the bottom of a huge platter. Brightly painted houses stood here and there, and every one was made entirely of china. Even the largest house came only to Dorothy's waist. There were lovely little barns surrounded by china fences. China cows, sheep, horses, pigs, and chickens stood around them in groups.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Stranger still were the people. Milkmaids and shepherdesses wore colorful bodices and gowns dotted with gold. Princesses had splendid dresses of silver, gold, and purple. The shepherds wore knee breeches striped in pink, yellow, and blue, with golden buckles on their shoes. Princes walked about in jeweled crowns, ermine robes, and satin doublets. There were funny clowns too, dressed in ruffles, with round red spots on their cheeks and tall pointed caps. The people, their clothes, and everything about them were made of china. The tallest one reached no higher than Dorothy's knee.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At first, none of them even looked toward the travelers. Only a little purple china dog noticed them. Its head was much too large for its body. It ran to the wall, barked in a tiny voice, and hurried away again.
        - id: ch01-b13
          speaker: dorothy
          text: How are we going to get down?
        - id: ch01-b14
          speaker: narrator
          text: >-
            The ladder was too heavy for them to pull up. So the Scarecrow dropped from the wall first. Everyone else jumped down on top of him, letting his soft body protect their feet from the hard floor. They were careful not to land on his head, where his pins might stick them. Once everyone was safely down, they lifted the flattened Scarecrow and patted his straw back into shape.
        - id: ch01-b15
          speaker: dorothy
          text: >-
            We have to cross this strange country to reach the other side. It wouldn't be wise to turn away from our path south.
        - id: ch01-b16
          speaker: narrator
          text: >-
            They started through the land of the china people. Before long, they came upon a china milkmaid who was milking a china cow. As the travelers approached, the cow suddenly kicked out. She knocked over the stool and the pail, and even sent the milkmaid tumbling down. Everything struck the china floor with a terrible clatter.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Dorothy was horrified. One of the cow's legs had broken off. The pail lay in several little pieces, and the poor milkmaid had chipped her left elbow.
        - id: ch01-b18
          speaker: milkmaid
          text: >-
            Now look what you've done! My cow has broken a leg. I'll have to take her to the mender's shop and get it glued back on. Why did you come here and scare her like that?
          emotion: angry
        - id: ch01-b19
          speaker: dorothy
          text: >-
            I'm so sorry. Please forgive us.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The pretty milkmaid was far too upset to answer. She picked up the broken leg with a sulky look and led her cow away. The poor cow limped along on three legs. Again and again, the milkmaid looked back at the clumsy strangers as if to blame them. She kept her chipped elbow pressed close to her side. The accident left Dorothy feeling very sorry.
        - id: ch01-b21
          speaker: tin_woodman
          text: >-
            We must be extremely careful here. If we hurt these lovely little people, they may never recover from it.
        - id: ch01-b22
          speaker: narrator
          text: >-
            A little farther on, Dorothy met a young Princess in the most beautiful clothes. The Princess stopped the instant she saw the strangers, then turned to run. Dorothy wanted a closer look at her, so she ran after the china girl.
        - id: ch01-b23
          speaker: china_princess
          text: >-
            Please don't chase me! Don't!
          emotion: fearful
        - id: ch01-b24
          speaker: narrator
          text: >-
            Her small voice sounded so frightened that Dorothy stopped at once.
        - id: ch01-b25
          speaker: dorothy
          text: Why shouldn't I?
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Princess stopped too, though she kept a safe distance between them.
        - id: ch01-b27
          speaker: china_princess
          text: >-
            Because I might fall and break if I run.
        - id: ch01-b28
          speaker: dorothy
          text: Couldn't someone mend you afterward?
        - id: ch01-b29
          speaker: china_princess
          text: >-
            Oh, yes, they could. But once you've been mended, you're never quite as pretty again.
        - id: ch01-b30
          speaker: dorothy
          text: I suppose that's true.
        - id: ch01-b31
          speaker: china_princess
          text: >-
            Take Mr. Joker, one of our clowns. He's forever trying to balance on his head. He has broken so many times that he's been patched in a hundred places, and now he isn't pretty at all. He's coming this way. You can see for yourself.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Sure enough, a cheerful little clown came walking toward them. His clothes were a lovely mix of red, yellow, and green. But cracks covered him from head to toe, running every which way. Anyone could see that he had been mended over and over. Mr. Joker shoved his hands into his pockets, puffed out his cheeks, and gave them a saucy nod.
        - id: ch01-b33
          speaker: mr_joker
          text: |-
            My lady fair,
            why do you stare
            at poor old Mr. Joker?
            You're stiff and prim,
            from toe to chin,
            as if you'd swallowed a poker!
        - id: ch01-b34
          speaker: china_princess
          text: >-
            That will do, sir! These visitors are strangers. You ought to show them some respect.
        - id: ch01-b35
          speaker: mr_joker
          text: >-
            Well, I expect that was respect!
        - id: ch01-b36
          speaker: narrator
          text: >-
            And with that, the clown stood on his head.
        - id: ch01-b37
          speaker: china_princess
          text: >-
            Pay no attention to Mr. Joker. His head has been cracked quite badly, and that's why he acts so foolish.
        - id: ch01-b38
          speaker: dorothy
          text: >-
            Oh, he doesn't bother me. But you're so beautiful, I know I could love you dearly. Would you let me take you home to Kansas and put you on Aunt Em's mantel? I could carry you in my basket.
        - id: ch01-b39
          speaker: china_princess
          text: >-
            That would make me very unhappy. Here in our own country, we're content. We can talk and move wherever we like. But as soon as one of us is taken away, our joints grow stiff. After that, we can only stand up straight and look pretty. I know that's all anyone expects from us on mantels, inside cabinets, or on drawing-room tables. Still, life is much nicer for us right here at home.
          emotion: sad
        - id: ch01-b40
          speaker: dorothy
          text: >-
            I wouldn't make you unhappy for anything in the world! I'll just say goodbye, then.
        - id: ch01-b41
          speaker: china_princess
          text: Goodbye.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The travelers continued carefully through the china country. All the little people and animals hurried out of their path, afraid the strangers might break them. After an hour or so, Dorothy and her friends reached the far side of the country. Another china wall stood before them.
        - id: ch01-b43
          speaker: narrator
          text: >-
            This second wall was made of china too, but it was not nearly as high as the first one. One by one, they stood on the Lion's back and scrambled up to the top. Then the Lion crouched, gathered his legs beneath him, and leaped onto the wall. As he landed, his tail struck a china church. The little building fell and shattered into pieces.
        - id: ch01-b44
          speaker: dorothy
          text: >-
            What a shame. Still, I think we were lucky. We crossed the whole country and only broke a cow's leg and one church. These little people are so terribly brittle!
        - id: ch01-b45
          speaker: scarecrow
          text: >-
            They certainly are. I'm grateful to be made of straw, because straw isn't easily damaged. Being a Scarecrow isn't the worst thing in the world after all.
