audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and storybook-like
        timbre: clear and gentle
        pace: measured
        pitch: medium
    blue_beard:
      display_name: Blue Beard
      tts:
        delivery: commanding and cold
        timbre: deep and heavy
        pace: deliberate
        pitch: low
    wife:
      display_name: Blue Beard's Wife
      tts:
        delivery: gentle and earnest
        timbre: clear and soft
        pace: natural
        pitch: medium-high
    sister_anne:
      display_name: Sister Anne
      tts:
        delivery: attentive and direct
        timbre: bright and clear
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Man with the Blue Beard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a man who owned beautiful houses in town and in the country. He had silver and gold dishes, finely carved furniture, and coaches covered all over in gleaming gold. But this rich man had a blue beard. It made him look so ugly and frightening that every woman and girl ran away from him.
        - id: ch01-b02
          speaker: narrator
          text: A noblewoman who lived nearby had two beautiful daughters. Blue Beard asked to marry one of them and told their mother she could choose which daughter it would be. Neither young woman wanted him. Each kept passing the offer to her sister, because neither could bear the thought of marrying a man with a blue beard. They were troubled by something else too. Blue Beard had already married several wives, and no one knew what had happened to them.
        - id: ch01-b03
          speaker: narrator
          text: Blue Beard wanted the family to know him better, so he invited the two daughters, their mother, three or four of their closest friends, and several young people from the neighborhood to one of his country houses for a week. Every day brought another pleasure party. They hunted, fished, danced, laughed, and feasted. At night, no one went to bed. They all stayed awake playing tricks on one another.
        - id: ch01-b04
          speaker: narrator
          text: Everything during that week went so well that the younger daughter began to think their host's beard was not really so blue after all. The hunting, dancing, jokes, and feasts had changed how she saw him. She decided he was a very courteous gentleman. As soon as everyone returned home, she and Blue Beard were married.
        - id: ch01-b05
          speaker: narrator
          text: About a month later, Blue Beard told his wife that important business would take him into the country for at least six weeks. While he was gone, she should enjoy herself. She could invite her friends, bring them to the country house if she liked, and live as well as she pleased. Then he showed her his keys.
        - id: ch01-b06
          speaker: blue_beard
          text: These keys open the two large storerooms where I keep my finest furniture. These are for the room that holds the silver and gold dishes we don't use every day. These open my safes of gold and silver, and these are for my jewel boxes. This large key opens all my rooms.
        - id: ch01-b07
          speaker: blue_beard
          text: But this little key opens the closet at the end of the long gallery downstairs. You may unlock everything else and go wherever you wish. I forbid you to enter that closet. If you open it, you can expect the full force of my anger.
        - id: ch01-b08
          speaker: narrator
          text: His wife promised to follow every order exactly. Blue Beard embraced her, climbed into his coach, and began his journey.
    - id: ch02
      title: The Forbidden Closet
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The new bride's neighbors and friends did not wait for an invitation. They were so eager to see the treasures in her house that they came at once. They had never dared visit while Blue Beard was there, because his blue beard frightened them.
        - id: ch02-b02
          speaker: narrator
          text: The guests hurried through every room, closet, and wardrobe. Each one seemed finer and richer than the last, and they could hardly decide which they admired most. Then they went upstairs to the great storerooms where Blue Beard kept his best furniture. They marveled at the number and beauty of the tapestries, beds, couches, cabinets, stands, and tables. They admired enormous mirrors that showed a person from head to toe. Some had glass frames. Others had frames of silver, either plain or gilded. The women had never seen anything so magnificent.
        - id: ch02-b03
          speaker: narrator
          text: They kept praising their friend's good fortune, and they envied her too. But the bride took no pleasure in all those riches. She could think only of the little closet downstairs.
        - id: ch02-b04
          speaker: narrator
          text: Her curiosity became so strong that she left her guests behind and rushed down a narrow back staircase. She went so fast that two or three times she nearly broke her neck. At the closet door, she stopped. She remembered her husband's command and thought about the misery that might follow if she disobeyed him. Still, the temptation was stronger than she was. Trembling, she put the little key in the lock and opened the door.
        - id: ch02-b05
          speaker: narrator
          text: At first, she could make out nothing because the windows were closed. Then her eyes adjusted. Several dead women lay scattered across the floor. They were all the wives Blue Beard had married and murdered, one after another, because they had disobeyed his order about that closet.
        - id: ch02-b06
          speaker: narrator
          text: The young woman thought she would die of fear. As she pulled the key from the lock, it dropped from her hand. After the first shock had passed, she picked it up, locked the door again, and went upstairs to her room. She tried to compose herself, but she was too frightened to rest.
        - id: ch02-b07
          speaker: narrator
          text: Then she noticed a stain on the little key. She wiped it two or three times, but the mark would not come off. She washed the key and even scrubbed it with soap and sand. Nothing worked. It was a magic key. Whenever the stain vanished from one side, it appeared again on the other.
    - id: ch03
      title: The Stain on the Key
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Blue Beard came home that very evening. He explained that letters had reached him while he was still on the road. The important business that had called him away was already settled in his favor, so there had been no reason to continue his journey. His wife did everything she could to convince him that she was delighted by his early return.
        - id: ch03-b02
          speaker: narrator
          text: The next morning, Blue Beard asked for his keys. She handed them over with such a trembling hand that he easily guessed what had happened.
        - id: ch03-b03
          speaker: blue_beard
          text: Why isn't the key to my closet here with the others?
        - id: ch03-b04
          speaker: wife
          text: I must have left it upstairs on the table.
        - id: ch03-b05
          speaker: blue_beard
          text: Bring it to me at once.
        - id: ch03-b06
          speaker: narrator
          text: She delayed several times, but at last she had no choice. She brought him the little key. Blue Beard looked it over carefully.
        - id: ch03-b07
          speaker: blue_beard
          text: Where did this stain come from?
        - id: ch03-b08
          speaker: wife
          text: I don't know.
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: The poor woman had turned pale as death.
        - id: ch03-b10
          speaker: blue_beard
          text: You don't know? Well, I do. You wanted to enter that closet. Very well, madam. You will go back there and take your place among the women you saw inside.
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: Weeping, she threw herself at her husband's feet. She begged him to forgive her and showed how truly sorry she was for disobeying him. Her beauty and sorrow might have melted a rock, but Blue Beard's heart was harder than stone.
        - id: ch03-b12
          speaker: blue_beard
          text: You must die, madam. You must die now.
          emotion: angry
        - id: ch03-b13
          speaker: wife
          text: If I must die, please give me a little time to say my prayers.
          emotion: fearful
        - id: ch03-b14
          speaker: blue_beard
          text: You may have seven and a half minutes. Not one moment more.
    - id: ch04
      title: Sister Anne at the Tower
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the wife was alone, she called to her sister.
        - id: ch04-b02
          speaker: wife
          text: Sister Anne, please climb to the top of the tower and see whether our brothers are coming. They promised to visit today. If you see them, signal for them to hurry.
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: Sister Anne went to the top of the tower. From time to time, the suffering wife called up to her.
        - id: ch04-b04
          speaker: wife
          text: Anne, Sister Anne, do you see anyone coming?
          emotion: fearful
        - id: ch04-b05
          speaker: sister_anne
          text: I see only the sun making dust shine in the air, and the green grass below.
        - id: ch04-b06
          speaker: narrator
          text: Meanwhile, Blue Beard stood with a great sword in his hand and shouted as loudly as he could.
        - id: ch04-b07
          speaker: blue_beard
          text: Come down this instant, or I'll come up and get you!
          emotion: angry
        - id: ch04-b08
          speaker: wife
          text: Please, just one more moment.
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: Then, very softly, she called to her sister again.
        - id: ch04-b10
          speaker: wife
          text: Anne, Sister Anne, can you see anyone coming?
          emotion: fearful
        - id: ch04-b11
          speaker: sister_anne
          text: I see only the sun making dust shine in the air, and the grass growing green.
        - id: ch04-b12
          speaker: blue_beard
          text: Come down quickly, or I'm coming up!
          emotion: angry
        - id: ch04-b13
          speaker: wife
          text: I'm coming.
        - id: ch04-b14
          speaker: wife
          text: Anne, Sister Anne, don't you see anyone coming?
          emotion: fearful
        - id: ch04-b15
          speaker: sister_anne
          text: I see a great cloud of dust coming from one side.
        - id: ch04-b16
          speaker: wife
          text: Is it our brothers?
        - id: ch04-b17
          speaker: sister_anne
          text: Oh, no, sister. It's a flock of sheep.
        - id: ch04-b18
          speaker: blue_beard
          text: Are you coming down or not?
          emotion: angry
        - id: ch04-b19
          speaker: wife
          text: One more moment.
          emotion: fearful
        - id: ch04-b20
          speaker: wife
          text: Anne, Sister Anne, do you see anybody coming now?
          emotion: fearful
        - id: ch04-b21
          speaker: sister_anne
          text: I see two horsemen, but they're still far away.
        - id: ch04-b22
          speaker: wife
          text: Thank God! Those are our brothers. Signal them any way you can. Tell them to hurry!
          emotion: happy
    - id: ch05
      title: The Brothers Arrive
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Blue Beard roared so loudly that the whole house trembled. His terrified wife came downstairs. Her hair hung loose around her shoulders, and tears covered her face. Once more, she fell at his feet.
        - id: ch05-b02
          speaker: blue_beard
          text: None of that will help you. You must die.
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: He seized her hair with one hand. With the other, he raised his sword and prepared to cut off her head. The poor woman turned toward him and looked at him with dying eyes.
        - id: ch05-b04
          speaker: wife
          text: Please, give me one last moment to gather my thoughts.
          emotion: fearful
        - id: ch05-b05
          speaker: blue_beard
          text: No. No. Commend yourself to God.
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: He lifted his arm again. At that very moment, someone knocked so loudly at the gate that Blue Beard stopped short.
        - id: ch05-b07
          speaker: narrator
          text: The gate opened, and two horsemen rushed inside with swords in their hands. They were the wife's brothers. One was a dragoon, and the other was a musketeer. They ran straight toward Blue Beard.
        - id: ch05-b08
          speaker: narrator
          text: Blue Beard recognized them and fled at once. The brothers followed close behind. Before he could reach the porch steps, they caught him. There they ran their swords through him and left him dead.
        - id: ch05-b09
          speaker: narrator
          text: The wife was nearly as lifeless as her husband. She did not even have the strength to rise and welcome her brothers.
        - id: ch05-b10
          speaker: narrator
          text: Blue Beard had no heirs, so his wife became mistress of his entire estate. She used one part of the fortune to help Sister Anne marry a young gentleman who had loved her for a long time. She used another part to buy captains' commissions for her brothers. With what remained, she married a worthy gentleman who made her forget the sorrowful time she had spent with Blue Beard.
