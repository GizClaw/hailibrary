audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳克制，带着古老童话的幽暗气息
        timbre: 温暖清晰
        pace: 从容，在危急处自然加快
        pitch: 中
    blue_beard:
      display_name: 蓝胡子
      tts:
        delivery: 外表客气，命令时冷酷凶狠
        timbre: 低沉厚重
        pace: 缓慢而有压迫感
        pitch: 低
    wife:
      display_name: 蓝胡子的妻子
      tts:
        delivery: 年轻真挚，从不安渐渐转为惊恐急切
        timbre: 清亮柔和
        pace: 中等，慌乱时加快
        pitch: 中高
    sister_anne:
      display_name: 安妮姐姐
      tts:
        delivery: 关切专注，回答清楚直接
        timbre: 柔和明亮
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 蓝胡子的婚事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个富有的男人。城里乡下，他都有漂亮的宅子。家里摆满金银餐具和雕花家具，就连马车也从头到尾镀着金。可这么多财富，也遮不住他那把蓝胡子。那胡子让他显得又丑又可怕，女人和姑娘们一见到他，转身就逃。
        - id: ch01-b02
          speaker: narrator
          text: 他有位贵妇邻居，膝下两个女儿都美得出众。蓝胡子登门求婚，请母亲从姐妹俩中挑一个嫁给他。可母亲还没法作出选择，姐姐已经把他推给妹妹，妹妹又把他推回姐姐。谁也不愿嫁给一个长着蓝胡子的男人。更叫姐妹俩厌恶的是，他从前已经娶过好几位妻子，那些女人后来去了哪里，竟没有一个人知道。
        - id: ch01-b03
          speaker: narrator
          text: 蓝胡子为了让大家多了解自己，邀了母女三人、三四位最要好的朋友，还有附近的一些年轻人，到他的乡间庄园住上一整个星期。白天，他们游乐、打猎、钓鱼、跳舞，席间总是欢声笑语。到了夜里，众人也不肯睡，只顾互相捉弄取乐。样样事情都那么称心，小女儿渐渐觉得，主人的胡子好像也没那么蓝了，这位绅士待人还十分有礼。大家刚一回家，婚事就定了下来。
    - id: ch02
      title: 那把小钥匙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 婚后大约一个月，蓝胡子说有件极重要的事要去乡下处理，至少六个星期才能回来。他让妻子别闷在家里，只管请朋友们来玩。她若喜欢，还可以带大家到乡下住。不管住在哪里，都要吃得好，玩得尽兴。
        - id: ch02-b02
          speaker: blue_beard
          text: 这些钥匙，你都收好。这几把开两间大库房，那里放着我最好的家具。这几把开的是餐具室，里面那些金银器皿平日并不用。还有保险柜里的金银钱币，珠宝匣里的首饰，它们也各有钥匙。这把最大的，是所有房间的总钥匙。最后是这把小钥匙。它开的是底层大长廊尽头那间小屋。别处你都能去，别的门你都能开，唯独不许走进那间小屋。你要是开了门，我发起怒来，什么事都做得出。
        - id: ch02-b03
          speaker: narrator
          text: 妻子郑重答应，丈夫说的每一条，她都会照办。蓝胡子抱了抱她，便登上马车，出门赶路去了。
        - id: ch02-b04
          speaker: narrator
          text: 邻居和好友们早就想来看看这座宅子的珍宝。蓝胡子那把胡子太吓人，他在时谁也不敢登门。如今她们没等新婚的女主人邀请就赶来了。她们跑遍每一间房、每一间小屋和每一只衣橱。处处都富丽堂皇，而且每推开一扇门，眼前的房间似乎总比上一间更华丽。楼上的库房更不得了。壁毯、床铺、长榻、橱柜、台架、桌子，还有能把人从头照到脚的穿衣镜，多得数不清，也美得看不够。镜框有玻璃的，有素银的，也有镀金的。她们从没见过这么精美气派的东西。
        - id: ch02-b05
          speaker: narrator
          text: 客人们不停地称赞，也羡慕朋友的好福气，女主人却根本没心思看。她只惦记着底层那间小屋。好奇心越来越强，她连把客人丢下有多失礼都顾不得，顺着偏僻的小楼梯飞奔下去。她跑得实在太急，有两三次差点摔断脖子。到了门前，她又站着想了一会儿。丈夫的禁令还在耳边，违抗他也许真会招来灾祸。可那诱惑太强了，她最后还是拿出小钥匙，浑身发抖地开了门。
        - id: ch02-b06
          speaker: narrator
          text: 窗户紧闭，屋里很暗。起初，她什么都看不清。过了一会儿，眼睛渐渐适应，她才发现地板上横七竖八地躺着好几个死去的女人。她们全是蓝胡子从前娶过的妻子。每个人都因为没有服从禁令，打开了这间小屋，被他一个接一个地杀死。年轻的妻子吓得以为自己也要死了，刚拔出锁孔的钥匙一下掉在地上。
        - id: ch02-b07
          speaker: narrator
          text: 她好不容易从惊吓中缓过来，捡起钥匙，重新锁上门，然后回到楼上的卧室，想叫自己镇定下来。可她实在怕得厉害，怎么也安不下心。小钥匙沾了污迹，她擦了两三遍，又用水洗，还拿肥皂和沙子使劲擦，全是白费力气。这是一把有魔法的钥匙。一面的痕迹才消失，另一面立刻又冒了出来，永远也洗不干净。
    - id: ch03
      title: 蓝胡子归来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 偏偏就在当天晚上，蓝胡子从旅途中回来了。他说自己在路上收到几封信，信上说，那件叫他离家的要紧事已经办妥，而且结果对他十分有利。妻子只能竭力装出高兴的样子，好让他相信，她很欢喜丈夫这么快回家。
        - id: ch03-b02
          speaker: narrator
          text: 第二天早晨，蓝胡子伸手要回所有钥匙。妻子只得把它们交出去，可她的手抖得太厉害了。蓝胡子一看，便猜出家里发生了什么事。
        - id: ch03-b03
          speaker: blue_beard
          text: 我那间小屋的钥匙呢？怎么没和其他钥匙放在一起？
        - id: ch03-b04
          speaker: wife
          text: 我想，我一定把它忘在楼上的桌子上了。
        - id: ch03-b05
          speaker: blue_beard
          text: 那就立刻拿来。别再忘了。
        - id: ch03-b06
          speaker: narrator
          text: 她嘴上答应着，却一次又一次找借口拖延。最后实在拖不过去，只得把小钥匙拿来。蓝胡子接过钥匙，翻来覆去仔细看了一遍。
        - id: ch03-b07
          speaker: blue_beard
          text: 这上面的污迹，是怎么弄上去的？
        - id: ch03-b08
          speaker: wife
          text: 我不知道。
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: 可怜的女人脸色惨白，像死人一样。
        - id: ch03-b10
          speaker: blue_beard
          text: 你不知道？我却清楚得很。你进过那间小屋。很好，夫人，你也进去吧，去陪你在那里见到的那些太太。
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 妻子哭着扑在丈夫脚边，请他原谅。她说自己真的后悔违抗了命令，神情和举动也都显出了悔意。她那么美，又那么悲伤，哪怕石头见了也会心软。可蓝胡子的心，比任何石头还硬。
        - id: ch03-b12
          speaker: blue_beard
          text: 夫人，你必须死。现在就死。
          emotion: angry
        - id: ch03-b13
          speaker: wife
          text: 既然我一定要死，请给我一点时间，让我做完祷告。
          emotion: fearful
        - id: ch03-b14
          speaker: blue_beard
          text: 我给你半刻钟。一刻也不会多。
    - id: ch04
      title: 安妮姐姐，你看见了吗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 蓝胡子暂时离开后，妻子只剩下一个人。她不敢耽搁，赶紧高声呼唤姐姐。她的姐姐名叫安妮。
        - id: ch04-b02
          speaker: wife
          text: 安妮姐姐，求你快到塔顶看看，我的两个哥哥来了没有。他们答应今天来看我。你一见到他们，就赶紧打信号，叫他们快些！
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: 安妮听完便登上塔顶，朝远处张望。可怜的妻子悲痛又焦急，只能留在下面等着。每隔一会儿，她就朝塔顶喊一次。
        - id: ch04-b04
          speaker: wife
          text: 安妮，安妮姐姐，你看见有人来了吗？
          emotion: fearful
        - id: ch04-b05
          speaker: sister_anne
          text: 我只看见太阳照得尘土发亮，青草一片碧绿。
        - id: ch04-b06
          speaker: narrator
          text: 蓝胡子握着一把大马刀，在屋里扯开嗓门，用尽力气催她。
        - id: ch04-b07
          speaker: blue_beard
          text: 马上下来！你不下来，我就上去找你！
          emotion: angry
        - id: ch04-b08
          speaker: wife
          text: 求你再等一小会儿。
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: 她又压低了声音，朝塔顶问。
        - id: ch04-b10
          speaker: wife
          text: 安妮，安妮姐姐，你看见有人来了吗？
          emotion: fearful
        - id: ch04-b11
          speaker: sister_anne
          text: 我只看见太阳照得尘土发亮，青草一片碧绿。
        - id: ch04-b12
          speaker: blue_beard
          text: 快下来！再不下来，我就上去了！
          emotion: angry
        - id: ch04-b13
          speaker: wife
          text: 我这就来。安妮，安妮姐姐，你还没看见有人来吗？
          emotion: fearful
        - id: ch04-b14
          speaker: sister_anne
          text: 我看见那边扬起了一大片尘土。
        - id: ch04-b15
          speaker: wife
          text: 是我的哥哥们吗？
        - id: ch04-b16
          speaker: sister_anne
          text: 唉，不是，妹妹。那只是一群羊。
        - id: ch04-b17
          speaker: blue_beard
          text: 你到底还下不下来？
          emotion: angry
        - id: ch04-b18
          speaker: wife
          text: 再等一小会儿。安妮，安妮姐姐，你还是没看见有人来吗？
          emotion: fearful
        - id: ch04-b19
          speaker: sister_anne
          text: 我看见两个骑马的人，可他们还远得很。
        - id: ch04-b20
          speaker: wife
          text: 谢天谢地，是我的哥哥们！我马上给他们打信号，叫他们快些赶来！
          emotion: happy
    - id: ch05
      title: 门外的骑手
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 蓝胡子忽然放声大吼，声音大得震动了整座房子。走投无路的妻子只得下楼。她的头发散落在肩头，满脸都是眼泪，又一次扑倒在丈夫脚边。
        - id: ch05-b02
          speaker: blue_beard
          text: 这样也救不了你。你非死不可。
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: 他一手揪住妻子的头发，另一只手把刀高高举到空中，眼看就要砍下她的头。可怜的女人艰难地转过身，用一双像要死去的眼睛望着他，只求再给自己一小会儿，让她收拢心神，想完最后一点事情。
        - id: ch05-b04
          speaker: blue_beard
          text: 不行。向上帝交代你的灵魂吧。
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: 蓝胡子又一次举起手臂。就在这一刻，大门忽然被敲得震天响，他猛地停住。门很快打开，两名骑手手持利剑冲进屋里，直奔蓝胡子。他认出那是妻子的两个哥哥，一个是龙骑兵，一个是火枪手，立刻转身逃走。
        - id: ch05-b06
          speaker: narrator
          text: 两兄弟紧紧追在后面。蓝胡子还没来得及逃到门廊的台阶，就被他们赶上。两人把剑刺穿他的身体，将他留在那里，断了气。妻子也吓得和死去的丈夫相差无几，连站起来迎接哥哥们的力气都没有。
        - id: ch05-b07
          speaker: narrator
          text: 蓝胡子没有留下继承人，所有产业便都归了妻子。她拿出一部分，为安妮姐姐置办婚事，让姐姐嫁给那位爱慕她很久的年轻绅士。她又拿出一部分，为两个哥哥买下军官的职位。最后，她带着剩下的财产，嫁给了一位品行高尚的绅士。从那以后，她终于忘掉了和蓝胡子一起度过的悲惨日子。
