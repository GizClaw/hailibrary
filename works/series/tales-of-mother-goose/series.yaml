cover_prompt: |-
  A wordless cover gathers motifs from Perrault's seventeenth-century French tales within a palace garden and shadowed woodland. A clever booted cat in a plumed hat bows beside a young miller's son, a tiny boy leaves white pebbles along a forest path, a sleeping princess rests beyond a wall of roses, and a kind girl offers water from a jug to an old traveler. The cat's theatrical bow before a distant carriage is the focal action, while the other stories appear as smaller discoveries in layered clearings. Use a gently elevated stage-like composition with palace towers low on the horizon and generous open dawn sky above. Keep court clothing and rural garments inspired by late-seventeenth-century France, and make every character original rather than resembling later films or animation. Treat darker story elements only through mystery and distance, with no weapons, injury, or frightening faces. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
