  chapters:
    - id: ch01
      title: Two Royal Gifts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a Queen had a son so ugly and misshapen that people argued for a long while over whether he even looked human. But a fairy who attended his birth said the child would be lovable in spite of his appearance, because he would have uncommon good sense. She had also given him a remarkable gift. He could bestow as much sense as he wished upon the person he loved best. This comforted the poor Queen somewhat.
        - id: ch01-b02
          speaker: narrator
          text: As soon as the boy learned to talk, he began saying a thousand charming things. Every action showed such intelligence that those around him found him delightful. There was one more thing about the child. He had been born with a small tuft of hair on his head, so they called him Riquet with the Tuft. Riquet was his family name.
        - id: ch01-b03
          speaker: narrator
          text: Seven or eight years later, the Queen of a neighboring kingdom gave birth to twin daughters. The first was more beautiful than the day itself. The Queen was so joyful that everyone feared her happiness might overwhelm her. The same fairy who had been present at Riquet's birth was there too. To temper the Queen's delight, she declared that this little Princess would have no sense at all. She would be as foolish as she was pretty. The Queen was deeply upset. Then the second daughter was born, and she was very ugly. That brought the Queen even greater sorrow.
        - id: ch01-b04
          speaker: fairy
          text: Please don't grieve so much, madam. Your younger daughter will have her reward. She'll possess so much good sense that people will hardly notice her lack of beauty.
        - id: ch01-b05
          speaker: queen
          text: May God grant it. But can't you give my beautiful older daughter any sense at all?
        - id: ch01-b06
          speaker: fairy
          text: I can do nothing about her sense, madam, but I can do everything about beauty. I would do anything to make you happy, so I give her this power. She will be able to make the person who pleases her most handsome.
        - id: ch01-b07
          speaker: narrator
          text: As the princesses grew, their finest qualities grew with them. Everyone talked about the older sister's beauty and the younger sister's rare good sense. But their faults grew too. The younger one became uglier each day, while the older one became more and more foolish. Ask the elder Princess a question, and sometimes she gave no answer at all. When she did answer, she often said something silly. She was terribly clumsy too. She could not set four pieces of china on a mantel without breaking one, or drink a glass of water without spilling half of it down her clothes.
        - id: ch01-b08
          speaker: narrator
          text: Beauty is a great advantage for a young person, yet people always preferred the younger sister's company. At first they gathered around the Beauty just to look at and admire her. Before long, they turned away and went to hear the clever sister say a thousand entertaining and delightful things. It was astonishing. In less than fifteen minutes, the elder Princess would be left without a soul near her while the whole company crowded around the younger one.
        - id: ch01-b09
          speaker: narrator
          text: Even with so little sense, the beautiful Princess noticed what happened. She would gladly have traded all her beauty for half her sister's wit. The Queen was a sensible woman, but she still scolded her daughter several times for being so foolish. Her words nearly made the poor Princess die of grief.
    - id: ch02
      title: A Promise in the Woods
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the Princess hid in a wood to mourn her unhappiness. There she saw a very unpleasant-looking little man coming toward her, dressed in magnificent clothes. It was the young Prince Riquet with the Tuft. He had fallen in love after seeing her portrait, copies of which had traveled all over the world. He had left his father's kingdom for the pleasure of seeing her and speaking with her.
        - id: ch02-b02
          speaker: narrator
          text: Riquet was delighted to find the Princess alone. He approached her with all the courtesy and respect anyone could imagine. First, he offered the polite compliments expected of a prince. Then he noticed just how miserable she looked and spoke to her about her sorrow.
        - id: ch02-b03
          speaker: riquet
          text: Madam, I can't understand how someone as beautiful as you could be as sorrowful as you seem. I've seen a great many wonderfully charming ladies, and I can truly say that not one of them came close to your beauty.
        - id: ch02-b04
          speaker: princess
          text: That's kind of you to say.
        - id: ch02-b05
          speaker: narrator
          text: Then the Princess could think of nothing more to add.
        - id: ch02-b06
          speaker: riquet
          text: Beauty is such a great advantage that it should come before everything else. You possess that treasure completely. I can't see how anything could possibly trouble you so deeply.
        - id: ch02-b07
          speaker: princess
          text: I'd much rather be as ugly as you and have good sense than be as beautiful as I am and so terribly stupid.
          emotion: sad
        - id: ch02-b08
          speaker: riquet
          text: Nothing shows better sense than believing we have too little of it. That's the nature of good sense. The more people have, the more they think they lack.
        - id: ch02-b09
          speaker: princess
          text: I don't know about that. I only know I'm very foolish, and it upsets me terribly.
          emotion: sad
        - id: ch02-b10
          speaker: riquet
          text: If that's all that's troubling you, madam, I can easily end your unhappiness.
        - id: ch02-b11
          speaker: princess
          text: How could you possibly do that?
          emotion: surprised
        - id: ch02-b12
          speaker: riquet
          text: I have the power to give as much good sense as anyone could possess to the person I love best. You are that person. You may have as much sense as anyone alive, if you agree to marry me.
        - id: ch02-b13
          speaker: narrator
          text: The Princess was completely confused by this offer. She could not find a single word to answer him.
        - id: ch02-b14
          speaker: riquet
          text: I can see that my proposal doesn't please you, and I don't blame you. I'll give you a whole year to think about it.
        - id: ch02-b15
          speaker: narrator
          text: The Princess had very little sense, and at the same time she longed desperately to have some. She imagined that the end of a whole year would never arrive. So she accepted Riquet's proposal.
        - id: ch02-b16
          speaker: narrator
          text: The moment she promised to marry him on that same date one year later, she became a different person. Suddenly she could express every thought in her mind with grace, ease, and perfect naturalness.
        - id: ch02-b17
          speaker: narrator
          text: Right away, she began a lively and clever conversation with Riquet. She spoke so brilliantly that he wondered whether he had given her more sense than he had kept for himself.
    - id: ch03
      title: The Forgotten Year
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the Princess returned to the palace, the whole court was amazed by her sudden and extraordinary change. Before, they had heard nothing from her but foolish, senseless remarks. Now she could speak wisely about anything, and one wonderfully witty phrase followed another. The court's delight was beyond imagining. Only her younger sister was displeased. She no longer had the advantage in cleverness, and beside her brilliant older sister, she now seemed plain and disagreeable.
        - id: ch03-b02
          speaker: narrator
          text: The King began to govern according to his elder daughter's advice. Sometimes he even held a council in her apartment. News of her transformation spread everywhere. Young princes from neighboring kingdoms did everything they could to win her favor, and nearly all of them asked to marry her. She gave every prince a fair hearing, but she found that not one had enough sense for her. She would not promise herself to any of them.
        - id: ch03-b03
          speaker: narrator
          text: At last, a prince came who was powerful and rich, as well as witty and handsome. She could not help feeling strongly drawn to him. Her father noticed. He told her that the choice of a husband was hers to make and that she could tell him what she intended to do. The Princess thanked her father, but she asked for time to consider her answer.
        - id: ch03-b04
          speaker: narrator
          text: By chance, she went walking in the same wood where she had met Riquet with the Tuft. There she could think more easily about what to do. As she walked deep in thought, she heard a confused noise beneath her feet. It sounded like a great many people rushing back and forth.
        - id: ch03-b05
          speaker: cook_1
          text: Bring me that pot!
        - id: ch03-b06
          speaker: cook_2
          text: Hand me that kettle!
        - id: ch03-b07
          speaker: cook_3
          text: Put more wood on the fire!
        - id: ch03-b08
          speaker: narrator
          text: Just then, the ground opened. Below her was a huge kitchen filled with cooks, kitchen helpers, and every kind of servant needed for a magnificent feast. Twenty or thirty cooks climbed out and took their places around a very long table that had been set up in the forest. Each held a larding pin and wore a fox tail in his cap. Then all of them began to work in time to a beautiful tune.
        - id: ch03-b09
          speaker: narrator
          text: Astonished by what she saw, the Princess asked whom they were working for.
        - id: ch03-b10
          speaker: chief_cook
          text: For Prince Riquet with the Tuft. He's getting married tomorrow.
        - id: ch03-b11
          speaker: narrator
          text: The Princess was more startled than ever. All at once, she remembered that this was the very date when she had promised to marry Riquet, one year before. She nearly sank into the ground.
        - id: ch03-b12
          speaker: narrator
          text: She had forgotten because she had been very foolish when she made the promise. Once Riquet gave her such an abundance of sense, everything she had done in her foolish days slipped entirely from her mind.
        - id: ch03-b13
          speaker: narrator
          text: She continued along the path, still thinking about what had happened. Before she had gone thirty steps, Riquet with the Tuft appeared before her. He was dressed with great elegance and splendor, exactly like a prince on his way to be married.
    - id: ch04
      title: Riquet Asks for a Reason
      blocks:
        - id: ch04-b01
          speaker: riquet
          text: As you see, madam, I've kept my word exactly. I don't doubt that you've come here to keep your promise too.
        - id: ch04-b02
          speaker: princess
          text: I'll speak honestly. I still haven't made up my mind, and I don't believe I can give you the answer you want.
        - id: ch04-b03
          speaker: riquet
          text: Madam, I never expected this. You astonish me.
          emotion: surprised
        - id: ch04-b04
          speaker: princess
          text: I can understand why. If you were a rude man with no sense, I wouldn't know what to say. You might tell me, “A princess always keeps her word. You promised to marry me, so you must.” But I'm speaking to the wisest, most sensible man in the world, and I know you'll listen to reason.
        - id: ch04-b05
          speaker: princess
          text: Even when I was foolish, I could hardly bring myself to agree to marry you. Why should I make that choice now, when I have all the judgment you gave me? If you truly wanted me as your wife, you made a great mistake by taking away my foolish simplicity. Now I see things much more clearly than I did before.
        - id: ch04-b06
          speaker: riquet
          text: You say a senseless man would be allowed to blame you for breaking your word. Then why won't you allow me the same argument, when all the happiness of my life is at stake? Is it reasonable for people with sense and judgment to be treated worse than those who have none? Can you truly claim that, when you possess so much sense yourself and once wanted it so earnestly?
        - id: ch04-b07
          speaker: riquet
          text: But please, let's come to the real question. Put aside my ugliness and my misshapen body. Is there anything in me that displeases you? Are you unhappy with my birth? Do you dislike my wit, my temper, or my manners?
        - id: ch04-b08
          speaker: princess
          text: Not at all. I love and respect you for everything you've named.
        - id: ch04-b09
          speaker: riquet
          text: Then I'm happy, because you have the power to make me the most lovable of men.
        - id: ch04-b10
          speaker: princess
          text: How could I do that?
        - id: ch04-b11
          speaker: riquet
          text: It will be done if you love me enough to wish for it. And so you won't doubt what I'm saying, I'll tell you the truth. The same fairy who came to my birth gave me the power to make the person I love wise and sensible. She gave you a gift as well. You can make the man you love, the man you choose to favor, extremely handsome.
    - id: ch05
      title: The Princess's Gift
      blocks:
        - id: ch05-b01
          speaker: princess
          text: If that's true, then with all my heart I wish for you to become the most lovable prince in the world. I give you my gift with all the power I have.
        - id: ch05-b02
          speaker: narrator
          text: The Princess had barely finished speaking when Riquet with the Tuft appeared to her as the finest prince on earth. In that instant, he became the handsomest and most lovable man she had ever seen.
        - id: ch05-b03
          speaker: narrator
          text: Some people insist that no fairy spell caused this remarkable change at all. They say it was love, and love alone, that did it.
    - id: ch06
      title: The Wedding
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: They say the Princess thought carefully about her lover's perseverance, his discretion, and all the fine qualities of his mind. She considered his wit and judgment too. After that, she no longer saw the misshapen form of his body or the ugliness of his face. His hump seemed no more than the grand bearing of a man with a broad back. Before, she had thought his limp was horrible. Now she saw only a charming way of stepping to one side.
        - id: ch06-b02
          speaker: narrator
          text: They also say that his badly crossed eyes now looked wonderfully bright and sparkling to her. She took their unevenness as a sign of the warmth of his affection. Even his great red nose seemed brave, martial, and heroic in her eyes.
        - id: ch06-b03
          speaker: narrator
          text: However the change happened, the Princess immediately promised to marry Riquet, on the condition that he first gained the King's consent. The King knew how highly his daughter respected Riquet with the Tuft. He also knew Riquet himself to be a wise and sensible prince. With great pleasure, he welcomed him as his son-in-law.
        - id: ch06-b04
          speaker: narrator
          text: The very next morning, the wedding was celebrated. Everything happened just as Riquet with the Tuft had foreseen, and every part of the celebration followed the orders he had given long before.
