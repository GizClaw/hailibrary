  chapters:
    - id: ch01
      title: The Two Sisters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a widow with two daughters. The older girl had her mother's looks and her mother's character. Anyone who saw the daughter felt as if they were seeing the mother too. Both of them were so proud and disagreeable that no one could bear living with them.
        - id: ch01-b02
          speaker: narrator
          text: The younger daughter was just like her father. She had his sweet nature and his goodness, and she was also one of the loveliest girls anyone had ever seen. People tend to love those who resemble them, so the widow adored her older daughter. But she could hardly stand the younger one. She made the poor girl eat alone in the kitchen and work all the time.
        - id: ch01-b03
          speaker: narrator
          text: Among her many chores, the younger girl had to walk more than a mile and a half to a fountain twice each day. There she filled a pitcher and carried it all the way home. One day, while she was at the fountain, a poor country woman came up and begged the girl to let her drink.
        - id: ch01-b04
          speaker: younger_sister
          text: Of course, Goody. I'd be glad to give you some.
        - id: ch01-b05
          speaker: narrator
          text: The girl rinsed the pitcher, filled it with the clearest water, and held it up so the woman could drink easily.
        - id: ch01-b06
          speaker: fairy
          text: You are so lovely, kind, and courteous that I must give you a gift.
        - id: ch01-b07
          speaker: narrator
          text: The country woman was really a fairy in disguise. She had come to discover just how courteous and well-mannered the girl would be.
        - id: ch01-b08
          speaker: fairy
          text: From now on, whenever you speak, either a flower or a jewel will fall from your mouth.
    - id: ch02
      title: Flowers and Jewels
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the girl reached home from the fountain, her mother scolded her for being gone so long.
        - id: ch02-b02
          speaker: younger_sister
          text: Please forgive me, Mamma. I'm sorry I didn't hurry.
        - id: ch02-b03
          speaker: narrator
          text: As she spoke, two roses, two pearls, and two large diamonds fell from her mouth.
        - id: ch02-b04
          speaker: widow
          text: What am I seeing? Pearls and diamonds are coming from the girl's mouth! How did this happen, my child?
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: It was the first time the widow had ever called her younger daughter "my child." The girl honestly told her everything that had happened. All the while, one diamond after another dropped from her mouth.
        - id: ch02-b06
          speaker: widow
          text: Then I must send my own dear daughter there. Fanny, see what falls from your sister's mouth whenever she talks! Wouldn't you like the same gift? Just go draw water from the fountain. If a poor woman asks for a drink, serve her very politely.
        - id: ch02-b07
          speaker: elder_sister
          text: Me, go all the way to the fountain for water? I'd like to see that!
        - id: ch02-b08
          speaker: widow
          text: You will go. I insist. Go this instant.
        - id: ch02-b09
          speaker: narrator
          text: So the elder daughter set out, grumbling the whole way. She took the finest silver tankard in the house with her.
    - id: ch03
      title: The Second Gift
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The elder girl had barely reached the fountain when a magnificently dressed lady came out of the woods and asked her for a drink. It was the same fairy who had met her sister. This time, though, the fairy had the manner and clothing of a princess. She had changed her appearance to discover just how rude the older girl would be.
        - id: ch03-b02
          speaker: elder_sister
          text: Do you think I came here just to serve you water? Was this silver tankard brought especially for your ladyship? Well, drink from it if you really want to.
        - id: ch03-b03
          speaker: fairy
          text: You are hardly polite. Since you are so unkind, here is your gift. Every time you speak, either a snake or a toad will come from your mouth.
        - id: ch03-b04
          speaker: narrator
          text: The fairy spoke without anger. Then the elder daughter went home.
    - id: ch04
      title: Driven into the Forest
      blocks:
        - id: ch04-b01
          speaker: widow
          text: Well, daughter?
        - id: ch04-b02
          speaker: elder_sister
          text: Well, Mother?
        - id: ch04-b03
          speaker: narrator
          text: A viper and a toad dropped from the unhappy girl's mouth.
        - id: ch04-b04
          speaker: widow
          text: Mercy! What is this? Her sister caused it, and she'll pay for what she's done!
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: The widow ran at once to beat her younger daughter. The poor girl escaped and hid in the nearby forest.
        - id: ch04-b06
          speaker: narrator
          text: The King's son was returning from the hunt when he met her. He saw how beautiful she was and asked what she was doing alone in the woods and why she was crying.
        - id: ch04-b07
          speaker: younger_sister
          text: Oh, sir, my mother has driven me out of the house.
          emotion: sad
    - id: ch05
      title: Two Endings
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As the girl answered, five or six pearls and just as many diamonds fell from her mouth. The King's son asked her how such a thing had happened, and she told him the whole story.
        - id: ch05-b02
          speaker: narrator
          text: The prince fell in love with her. He thought her marvelous gift was worth more than any marriage fortune another bride might bring. So he led her to the palace of his father, the King, and married her there.
        - id: ch05-b03
          speaker: narrator
          text: Her elder sister, meanwhile, made herself so hated that even her own mother drove her from the house. The miserable girl wandered about, but no one would take her in.
        - id: ch05-b04
          speaker: narrator
          text: At last, she went to a corner of the woods, and there she died.
