audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而清晰的童话讲述
        timbre: 温暖明亮
        pace: 舒缓
        pitch: 中音
    younger_daughter:
      display_name: 小女儿
      tts:
        delivery: 温柔真诚，言语谦和
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 尖刻强势，偏爱时格外热切
        timbre: 粗厉
        pace: 偏快
        pitch: 中音
    fairy:
      display_name: 仙女
      tts:
        delivery: 沉着端庄，判断分明
        timbre: 清亮稳重
        pace: 从容
        pitch: 中音
    elder_daughter:
      display_name: 范妮
      tts:
        delivery: 傲慢不耐烦，语气生硬
        timbre: 尖亮
        pace: 偏快
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 诚恳有礼，语气关切
        timbre: 清朗
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 两个女儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个寡妇养着两个女儿。大女儿从长相到脾气都像母亲，谁见到女儿，就像见到了母亲。母女俩一样傲慢，一样叫人厌烦，根本没法跟她们相处。小女儿却像父亲，性情温柔，心地善良，还是人们见过的最美丽的姑娘之一。人总喜欢像自己的人，母亲也不例外。她把大女儿宠上了天，却厌恶小女儿，让她在厨房吃饭，还整天使唤她干活。
        - id: ch01-b02
          speaker: narrator
          text: 小女儿每天还要走一英里半多的路，到泉边打两次水。每一趟，她都得装满一大罐，再沉甸甸地提回家。一天，她正在泉边取水，一位穷苦妇人走过来，求她给自己喝一口。
        - id: ch01-b03
          speaker: younger_daughter
          text: “可以呀，大娘，我很愿意给您水喝。”
        - id: ch01-b04
          speaker: narrator
          text: 姑娘马上涮净水罐，舀了最清的泉水递过去。妇人喝水的时候，她一直在旁边托着罐子，好让对方喝得轻松些。
    - id: ch02
      title: 泉边的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 妇人喝完水，便要送给姑娘一件礼物。原来，她是仙女变成的乡下穷妇人，特意来试试这位美丽的姑娘待人究竟有多亲切、多有礼貌。
        - id: ch02-b02
          speaker: fairy
          text: “你这么美丽，又这样善良有礼，我一定要送你一件礼物。从现在起，你每说一个字，嘴里都会落出一朵花，或者一颗宝石。”
        - id: ch02-b03
          speaker: narrator
          text: 姑娘回到家，因为在泉边待得太久，立刻挨了母亲一顿骂。
        - id: ch02-b04
          speaker: younger_daughter
          text: “妈妈，对不起，我回来晚了。”
        - id: ch02-b05
          speaker: narrator
          text: 话刚说完，两朵玫瑰、两颗珍珠和两颗大钻石，就从她嘴里落了出来。
        - id: ch02-b06
          speaker: mother
          text: “这是怎么回事？这丫头嘴里竟然掉出了珍珠和钻石！孩子，快告诉我，到底发生了什么？”
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 母亲还是头一次称她为“孩子”。姑娘毫不隐瞒，老老实实把经过从头到尾全说了。她每说几句话，嘴里便落下许多大钻石。
    - id: ch03
      title: 范妮也去打水
      blocks:
        - id: ch03-b01
          speaker: mother
          text: “我这就让我的宝贝女儿也去。范妮，你看妹妹一说话，嘴里会掉出多少好东西。你当然也想得到这份礼物。去泉边打水吧，要是有穷妇人讨水，你就客客气气地给她喝。”
        - id: ch03-b02
          speaker: elder_daughter
          text: “让我去泉边打水？我才不会去呢！”
        - id: ch03-b03
          speaker: mother
          text: “我说你必须去，而且现在就走。”
        - id: ch03-b04
          speaker: narrator
          text: 范妮只得带上家里最好的银杯，一路发着牢骚来到泉边。她刚到，就见一位衣着华贵、神态像公主的夫人从树林里走来，向她讨水。这还是那位仙女。她换了模样，是要看看范妮究竟会有多无礼。
        - id: ch03-b05
          speaker: elder_daughter
          text: “难道我特地跑到这里，就是为了伺候你喝水？这只银杯想必也是专门给夫人您带的吧？你真想喝，那就拿去喝好了。”
        - id: ch03-b06
          speaker: narrator
          text: 仙女听了并没有动怒，只是平静地回答她。
        - id: ch03-b07
          speaker: fairy
          text: “你实在算不上有礼貌。既然你这样不肯帮忙，我也送你一件礼物。从今往后，你每说一个字，嘴里都会掉出一条蛇，或者一只癞蛤蟆。”
    - id: ch04
      title: 森林里的相遇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 母亲远远看见范妮回来，马上朝她喊了起来。
        - id: ch04-b02
          speaker: mother
          text: “怎么样，女儿？”
        - id: ch04-b03
          speaker: elder_daughter
          text: “还能怎么样，母亲？”
        - id: ch04-b04
          speaker: narrator
          text: 范妮一开口，一条毒蛇和一只癞蛤蟆就从她嘴里掉了下来。
        - id: ch04-b05
          speaker: mother
          text: “天哪，这是什么？一定是她妹妹害了你！我非叫她付出代价不可！”
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 母亲立刻冲过去要打小女儿。可怜的姑娘逃出家门，躲进附近的森林。国王的儿子打猎归来，正好遇见她。他看姑娘如此美丽，便问她为何独自待在林中，又为什么流泪。
        - id: ch04-b07
          speaker: younger_daughter
          text: “唉，殿下，是我母亲把我赶出了家门。”
          emotion: sad
    - id: ch05
      title: 两种结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子看见她说话时，嘴里落出五六颗珍珠，还有同样多的钻石，便请她说说，这件奇事是怎么发生的。姑娘没有隐瞒，把从受苦到遇见仙女的全部经过都告诉了他。王子爱上了她，也觉得这样的礼物胜过别的新娘能带来的任何嫁妆。于是，他领姑娘进了父王的宫殿，在那里娶她为妻。
        - id: ch05-b02
          speaker: narrator
          text: 再说范妮，她惹得人人厌恶，最后连亲生母亲也把她赶了出去。这个不幸的姑娘四处漂泊了很久，始终没有人肯收留她。后来，她走到树林的一角，死在了那里。
