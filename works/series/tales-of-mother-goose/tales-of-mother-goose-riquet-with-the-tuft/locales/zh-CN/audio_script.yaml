audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温厚从容，带着古老童话含蓄的幽默
        timbre: 温暖清澈
        pace: 舒缓而有起伏
        pitch: 中
    fairy:
      display_name: 仙女
      tts:
        delivery: 笃定而不失体贴
        timbre: 明亮沉静
        pace: 从容
        pitch: 中高
    queen:
      display_name: 王后
      tts:
        delivery: 高贵端庄，关切时真情流露
        timbre: 柔和丰润
        pace: 适中
        pitch: 中
    elder_princess:
      display_name: 大公主
      tts:
        delivery: 从迟疑羞怯渐变为机敏坚定
        timbre: 年轻柔美
        pace: 自然灵动
        pitch: 中高
    riquet:
      display_name: 卷发里凯
      tts:
        delivery: 彬彬有礼，聪慧自持，言辞真挚
        timbre: 清朗温厚
        pace: 稳健
        pitch: 中
    kitchen_worker_1:
      display_name: 厨工甲
      tts:
        delivery: 忙碌利落，招呼同伴时干脆响亮
        timbre: 清亮
        pace: 明快
        pitch: 中
    kitchen_worker_2:
      display_name: 厨工乙
      tts:
        delivery: 手脚麻利，催促时短促有力
        timbre: 浑厚
        pace: 轻快
        pitch: 中低
    kitchen_worker_3:
      display_name: 厨工丙
      tts:
        delivery: 忙中有序，吩咐时爽朗急切
        timbre: 明亮
        pace: 稍快
        pitch: 中高
    head_cook:
      display_name: 厨师长
      tts:
        delivery: 干练直接
        timbre: 洪亮
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 两位仙女的赠礼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位王后生下了一个儿子。孩子又丑又畸形，人们为此争论了很久，甚至不知道他究竟还算不算人的模样。守在孩子出生时的仙女却说，他虽然难看，将来一定很讨人喜欢，因为他会聪明得不同寻常。她还当场送给孩子一种天赋。他可以随自己的心意，把想给的智慧送给自己最爱的人。可怜的王后听了，总算得到一点安慰。
        - id: ch01-b02
          speaker: narrator
          text: 果然，孩子刚会说话，就能讲出无数动听的话。他的一举一动都显得十分机敏，那份聪明很是迷人。对了，他出生时，头顶还长着一小绺卷发，所以大家叫他卷发里凯。里凯是他们家族的姓。
        - id: ch01-b03
          speaker: narrator
          text: 七八年过去，邻国的王后生下了一对双胞胎女儿。先出生的姐姐美得胜过白昼，王后高兴得近乎忘形，在场的人都怕她欢喜过了头，反而伤到身体。里凯出生时的那位仙女也来了。她为了压一压王后的狂喜，宣布这位美丽的小公主不会有半点头脑，生得多美，就会有多愚笨。王后伤心极了。可妹妹出生后，她更加难过，因为这个孩子实在太丑。
        - id: ch01-b04
          speaker: fairy
          text: 夫人，别太伤心。这个女儿会得到补偿。她将来会聪明非凡，叫人几乎看不见她容貌上的缺憾。
        - id: ch01-b05
          speaker: queen
          text: 但愿上帝保佑，真能如此。可我那美丽的大女儿呢？难道没有办法让她也聪明一点吗？
        - id: ch01-b06
          speaker: fairy
          text: 智慧这件事，我帮不了她。不过说到美貌，我什么都能做到。只要能让您称心，我什么都愿意做。我就送她一种天赋吧。她最中意谁，就能让谁变得英俊。
        - id: ch01-b07
          speaker: narrator
          text: 两位公主一天天长大，她们的长处也越来越出众。姐姐越来越美，妹妹越来越聪明，人人谈论的都是姐姐的容貌和妹妹少见的才智。可她们的缺点也越来越明显。妹妹越长越丑，姐姐却越长越糊涂。别人问话，她不是一句也答不出来，就是说出傻得出奇的话。她还笨手笨脚，往壁炉台上摆四件瓷器总要打碎一件，喝一杯水也会把半杯洒在衣服上。
        - id: ch01-b08
          speaker: narrator
          text: 美貌对年轻人当然是很大的好处，可众人聚在一起时，妹妹总是更受欢迎。人们先走近姐姐，看看她有多美，也当面赞叹一番。可没过多久，他们就会围到妹妹身边，听她说那些有趣又动听的话。不到一刻钟，姐姐身边便空无一人。她虽然愚笨，却不可能看不见这些。只要能换来妹妹一半的才智，她会毫不惋惜地交出全部美貌。就连一向明理的王后，也忍不住几次责备她太过愚笨，叫可怜的公主伤心得几乎活不下去。
    - id: ch02
      title: 林中的约定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，大公主躲进树林，为自己的不幸哭泣。这时，一个模样难看、衣着却华丽非凡的小个子向她走来。那正是卷发里凯王子。他看过公主的画像。这样的画像有许多幅，早已传到世界各地，他也从此爱上了她。里凯特地离开父亲的王国，只为亲眼见她，同她说说话。如今见她独自在这里，他喜出望外，便带着能有的全部礼貌与敬意上前问候。说过几句寻常的客套话，他发现公主满脸忧愁。
        - id: ch02-b02
          speaker: riquet
          text: 夫人，我实在不明白，像您这样美丽的人，怎么会如此伤心。我见过许多容貌出众的女子，却从没见过谁能像您这么美。
        - id: ch02-b03
          speaker: elder_princess
          text: 您过奖了。
        - id: ch02-b04
          speaker: narrator
          text: 公主说完这几个字，就再也接不下去了。
        - id: ch02-b05
          speaker: riquet
          text: 美貌是极大的优势，理应胜过其他一切。您既然拥有这样的珍宝，我真想不出，还有什么能让您这么难过。
        - id: ch02-b06
          speaker: elder_princess
          text: 我宁可像您一样丑，却有头脑，也不愿只有现在这副美貌，自己却这么愚笨。
          emotion: sad
        - id: ch02-b07
          speaker: riquet
          text: 能看出自己不够聪明，恰恰说明一个人有头脑。智慧就是这样。拥有得越多，越觉得自己还不够聪明。
        - id: ch02-b08
          speaker: elder_princess
          text: 这我不知道。我只知道自己一点头脑也没有，这件事快把我苦恼死了。
          emotion: sad
        - id: ch02-b09
          speaker: riquet
          text: 如果您烦恼的只有这个，我很容易就能替您解除痛苦。
        - id: ch02-b10
          speaker: elder_princess
          text: 您怎么做得到？
        - id: ch02-b11
          speaker: riquet
          text: 我能把世上最好的智慧，送给自己最爱的人。而我最爱的人就是您。只要您肯嫁给我，就能拥有不逊于任何人的智慧。愿不愿意，全由您选择。
        - id: ch02-b12
          speaker: narrator
          text: 公主听完这番话，一时窘迫极了，一句话也说不出来。
        - id: ch02-b13
          speaker: riquet
          text: 我看得出，这个提议并不合您的心意。我并不奇怪。您不必马上回答，我给您整整一年考虑。
        - id: ch02-b14
          speaker: narrator
          text: 公主的头脑太少了，想得到智慧的愿望却太强。她觉得一年期满的那一天永远也不会来，便答应了里凯。
        - id: ch02-b15
          speaker: narrator
          text: 她刚承诺一年后的今天嫁给他，立刻就像变了一个人。心里无论有什么想法，她都能说得得体、从容又自然，这份本领简直不可思议。她当场同里凯畅谈起来，不但谈吐优雅，还能一直把话题接下去。她的言语如此机敏，连里凯也怀疑，自己送给她的智慧是不是比留下的还多。
    - id: ch03
      title: 聪慧的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 公主一回到王宫，满朝上下都不知道该怎样看待这场突如其来的惊人变化。从前，她只会说愚蠢荒唐的胡话。现在，她句句通情达理，还不断冒出机锋妙语。所有人都欢喜得难以形容，只有妹妹不高兴。妹妹在才智上再也没有胜过姐姐的优势，和姐姐站在一起，便显得既难看又不讨人喜欢。
        - id: ch03-b02
          speaker: narrator
          text: 国王开始听从大公主的意见，有时还在她房中召集大臣议事。公主改变的消息传遍四方，邻国的年轻王子们都使尽办法讨她欢心，几乎人人都来求婚。公主让每个人都有机会陈说心意，却觉得没有一个人的才智配得上自己，所以不肯对其中任何一人作出承诺。
        - id: ch03-b03
          speaker: narrator
          text: 后来，一位王子来到了宫廷。他有权有势，十分富有，既聪明又英俊。公主不由得对他大为倾心。国王看出了女儿的心意，便告诉她，选择丈夫这件事完全由她自己做主，她随时可以说出自己的打算。公主谢过父亲，却没有立刻答应这位王子，只请父亲给自己一点时间，让她好好考虑。
    - id: ch04
      title: 一年后的赴约
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 为了安静想清楚这件事，公主信步走进了当初遇见里凯的树林。她正沉思着，脚下忽然传来一片嘈杂，像有一大群人忙忙碌碌地跑来跑去。她仔细一听，听见了几声吆喝。
        - id: ch04-b02
          speaker: kitchen_worker_1
          text: 把那口锅拿来！
        - id: ch04-b03
          speaker: kitchen_worker_2
          text: 把那把壶给我！
        - id: ch04-b04
          speaker: kitchen_worker_3
          text: 快往火里添些木柴！
        - id: ch04-b05
          speaker: narrator
          text: 地面随即裂开。公主看见脚下有一座巨大的厨房，里面挤满厨师、厨工，还有筹办一场盛大宴席所需要的各色管事。二三十名厨师从地下走出来，围着树林里一张早已摆好的长桌各就各位。他们手拿穿肥肉的针，帽子插着狐狸尾巴，跟着一支十分悦耳的曲子打起拍子，忙了起来。公主看得目瞪口呆，便问他们究竟在为谁做事。
        - id: ch04-b06
          speaker: head_cook
          text: 为卷发里凯王子。他明天就要结婚了。
        - id: ch04-b07
          speaker: narrator
          text: 公主比刚才更加震惊了。她猛然想起，今天正是整整一年前，自己答应嫁给里凯的日子。她当场恨不得陷进地里。她会把这件事忘掉，是因为作出承诺时还十分愚笨。后来，王子送给她满腹智慧，她变得聪明起来，竟把自己糊涂时做过的事全都忘得一干二净。
        - id: ch04-b08
          speaker: narrator
          text: 公主继续向前，还没走出三十步，里凯便出现了。他风度翩翩，衣着华贵，完全是一位即将成婚的王子。
        - id: ch04-b09
          speaker: riquet
          text: 夫人，您看，我准时来了。我一向说话算数。我相信您来到这里，也是为了履行承诺。
        - id: ch04-b10
          speaker: elder_princess
          text: 我坦白告诉您，这件事我还没拿定主意。我想，自己永远也作不出您希望的决定。
        - id: ch04-b11
          speaker: riquet
          text: 夫人，您真叫我吃惊。
          emotion: surprised
        - id: ch04-b12
          speaker: elder_princess
          text: 我相信。如果您是个粗野无知、毫无头脑的人，我现在一定会进退两难。您大可以对我说，公主向来一诺千金，我既然答应嫁给您，就非嫁不可。可我面对的是世上最有智慧、最明事理的人，我相信您愿意听道理。我还愚笨的时候，都很难下决心嫁给您。如今有了您赐给我的这么多智慧，反倒要我作出当时都不肯接受的决定，这又是为什么？如果您真心想娶我，当初就不该让我摆脱那份浑浑噩噩的天真，也不该让我把一切看得比从前清楚这么多。
        - id: ch04-b13
          speaker: riquet
          text: 按您刚才的说法，一个没头脑的人若责怪您不守信用，您还会觉得他有资格这样说。那么，这件事关系到我一生的幸福，您为什么不肯让我得到同样的待遇？难道聪明人反而该比糊涂人处境更糟吗？您有这么多智慧，又曾那样热切地渴望得到它，真会这样主张吗？不过，我们还是说事情本身吧。先把我的丑陋和畸形放在一边，我还有什么地方让您不喜欢？您不满意的是我的出身、才智、性情，还是举止？
        - id: ch04-b14
          speaker: elder_princess
          text: 都不是。您说的这些，我全都喜爱，也全都敬重。
        - id: ch04-b15
          speaker: riquet
          text: 那我就幸福了，因为您有能力使我成为世上最可爱的人。
        - id: ch04-b16
          speaker: elder_princess
          text: 我怎么会有这种能力？
    - id: ch05
      title: 爱情的魔法
      blocks:
        - id: ch05-b01
          speaker: riquet
          text: 只要您足够爱我，真心希望我变成那样，就做得到。您还记得那位仙女吗？我出生那天，她让我能使自己最中意的人聪慧明理。她也用同样的方式赐给了您一种天赋。您所爱、也愿意垂青的人，会因您而变得无比英俊。现在，您不必再怀疑我的话了。
        - id: ch05-b02
          speaker: elder_princess
          text: 如果真是这样，我全心全意希望您成为世上最可爱的王子。我愿尽自己全部的力量，把这份天赋送给您。
        - id: ch05-b03
          speaker: narrator
          text: 公主的话音刚落，卷发里凯在她眼中便完全变了。他成了世上最出色的王子，是她平生见过的最英俊、也最可爱的人。不过，有人坚称，真正带来这场变化的并不是仙女施下的魔法，而只有爱情本身。
        - id: ch05-b04
          speaker: narrator
          text: 人们说，公主认真想过爱人长久以来的执着，想过他的明辨通达，也想过他心灵里的种种美好、聪慧与见识。于是，她眼中再也没有他畸形的身体，也没有他丑陋的面孔。背上的驼峰，在她看来不过是宽阔肩背带来的一派堂皇气度。从前，她觉得他瘸得十分厉害，如今却觉得那只是一种微微侧身的走路姿态，甚至让她着迷。
        - id: ch05-b05
          speaker: narrator
          text: 人们还说，他原本斜视得很厉害的双眼，在公主看来竟明亮而闪耀。两只眼睛并不对称，她却把这看成感情炽烈的证明。总而言之，就连他那只又大又红的鼻子，她也不再觉得难看，反而认为它带着几分武士般的英勇气概。
        - id: ch05-b06
          speaker: narrator
          text: 无论真相究竟是什么，公主立刻答应嫁给里凯，只提出一个条件，就是他要先取得国王的同意。国王知道女儿十分敬重里凯，也早就知道他是一位极其睿智明理的王子，便欢欢喜喜地接受他做女婿。第二天早晨，他们举行了婚礼。一切都和里凯早已预见的一样，也完全照着他许久以前就下达的命令办妥了。
