  chapters:
    - id: ch01
      title: The Seven Fairy Godmothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a king and queen who longed for a child. Their sorrow was greater than words could tell. At last, the Queen gave birth to a daughter, and the kingdom celebrated with a splendid christening. The Princess was given seven fairy godmothers, every fairy the royal family could find throughout the whole kingdom. Each one would bless her with a gift, as fairies did in those days, and together they would give the child every perfection they could imagine.
        - id: ch01-b02
          speaker: narrator
          text: After the christening, everyone returned to the palace for a great feast. Each fairy had a magnificent place setting and a case of solid gold. Inside lay a gold spoon, knife, and fork, all set with diamonds and rubies. But just as the fairies sat down, a very old fairy entered the hall. No one had invited her. She had stayed inside a tower for more than fifty years, and everyone believed she was dead or under an enchantment.
        - id: ch01-b03
          speaker: narrator
          text: The King ordered a place set for her, but he could not give her a golden case. Only seven had been made. The old fairy thought this was an insult, and she muttered threats under her breath. A young fairy nearby heard her. Afraid that the old fairy meant to give the baby a dreadful gift, she slipped behind the curtains when dinner ended. She would speak last and undo as much harm as she could.
        - id: ch01-b04
          speaker: narrator
          text: While the young fairy waited behind the curtains, the others began presenting their gifts. The youngest promised that the Princess would be the most beautiful person in the world. The next gave her the wit of an angel. The third promised grace in everything she did. The fourth gave her perfect skill in dancing, the fifth a singing voice like a nightingale, and the sixth the power to play every kind of musical instrument beautifully.
        - id: ch01-b05
          speaker: narrator
          text: Then the old fairy took her turn. Her head shook more from spite than from age.
        - id: ch01-b06
          speaker: old_fairy
          text: The Princess will pierce her hand on a spindle, and the wound will kill her.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: The terrible gift made the whole company tremble, and everyone began to cry. At once, the young fairy stepped out from behind the curtains and spoke in a clear, strong voice.
        - id: ch01-b08
          speaker: young_fairy
          text: Do not despair, Your Majesties. Your daughter will not die. I cannot completely undo what the elder fairy has done. The Princess will prick her hand on a spindle, but instead of dying, she will fall into a deep sleep for one hundred years. At the end of that time, a king's son will come and wake her.
          emotion: calm
    - id: ch02
      title: The Spindle and the Hundred-Year Sleep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The King tried to prevent the old fairy's prophecy. He ordered that no one in the kingdom could spin with a distaff and spindle or even keep a spindle at home. Anyone who disobeyed would be put to death.
        - id: ch02-b02
          speaker: narrator
          text: About fifteen or sixteen years passed. One day, while the King and Queen were away at a country home, the young Princess roamed all through the palace. She went from one room to another until she reached a tiny attic at the top of a tower. There, an old woman sat alone, spinning with a spindle. The woman had never heard the King's command.
        - id: ch02-b03
          speaker: princess
          text: What are you doing, good woman?
        - id: ch02-b04
          speaker: old_woman
          text: I'm spinning, my pretty child.
        - id: ch02-b05
          speaker: narrator
          text: The old woman had no idea that the girl was the Princess.
        - id: ch02-b06
          speaker: princess
          text: Oh, how lovely! How does it work? Let me hold it. I want to try.
        - id: ch02-b07
          speaker: narrator
          text: The moment the Princess took the spindle, it pierced her hand. Perhaps she had moved too quickly and carelessly, or perhaps the fairy's decree had made it happen. She fell unconscious on the floor.
        - id: ch02-b08
          speaker: narrator
          text: The old woman had no idea what to do, so she cried for help. People rushed in from every direction. They splashed water on the Princess's face, loosened her clothes, struck the palms of her hands, and rubbed perfume on her temples. Nothing woke her.
        - id: ch02-b09
          speaker: narrator
          text: When the King heard the commotion, he came upstairs and remembered the fairies' prophecy. He knew the promised event had arrived. He had the Princess carried into the finest room in the palace and placed on a bed embroidered with gold and silver.
        - id: ch02-b10
          speaker: narrator
          text: She looked like a little angel. Her faint had not dimmed her beauty. Her cheeks were pink, and her lips were red as coral. Though her eyes were closed, she breathed softly. Everyone could see that she was alive. The King ordered them to let her sleep in peace until the day she was meant to wake.
        - id: ch02-b11
          speaker: narrator
          text: The good young fairy who had saved the Princess was far away in the kingdom of Matakin when the accident happened, twelve thousand leagues from the palace. A little dwarf brought her the news. He wore seven-league boots, which carried him across seven leagues of ground in a single stride. The fairy set off immediately and arrived about an hour later in a flaming chariot pulled by dragons.
        - id: ch02-b12
          speaker: narrator
          text: The King helped her from the chariot, and she approved of everything he had done. Still, with her gift of foresight, she realized the Princess would be lost and alone if she woke in an empty, ancient palace.
        - id: ch02-b13
          speaker: narrator
          text: So the fairy raised her wand. She touched everyone in the palace except the King and Queen. Governesses and maids, ladies and gentlemen, officers and stewards, cooks and kitchen maids, guards, gatekeepers, pages, and footmen all felt the wand's touch. She touched the stable horses, the cart horses, the hunting horses, and the saddle horses. She touched the grooms, the great dogs in the outer court, and even Mopsey, the Princess's little spaniel, lying on the bed.
        - id: ch02-b14
          speaker: narrator
          text: Each one fell asleep at once. They would wake only when their mistress did, ready to serve her again. Even the roasting spits, loaded with partridges and pheasants, went to sleep, and so did the fire. It all happened in a moment. Fairies do not take long to do their work.
        - id: ch02-b15
          speaker: narrator
          text: The King and Queen kissed their dear child without waking her. Then they left the palace and ordered everyone to keep away.
        - id: ch02-b16
          speaker: narrator
          text: No order was needed. Within fifteen minutes, trees of every size sprang up around the park. Bushes and thorny vines twisted tightly together until no person or animal could pass. From far away, only the tops of the palace towers could be seen. Everyone understood that the fairy had made the forest. While the Princess slept, no curious stranger could reach her.
    - id: ch03
      title: The Prince in the Sleeping Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One hundred years later, a prince was hunting in that part of the country. His father now ruled the land and belonged to a different royal family. When the Prince saw towers rising from the middle of a thick wood, he asked what they were.
        - id: ch03-b02
          speaker: narrator
          text: Everyone had heard a different tale. Some called the place a haunted castle. Others said the witches of the country held their midnight celebrations there. Most people believed an ogre lived inside. They said he carried away every child he could catch and ate them where no one could follow, because only he could cross the wood.
        - id: ch03-b03
          speaker: narrator
          text: The Prince did not know which tale to believe. Then a very old countryman stepped forward.
        - id: ch03-b04
          speaker: countryman
          text: Your Royal Highness, more than fifty years ago, my father told me about that castle. He said the most beautiful princess anyone had ever seen was sleeping there. She must sleep for one hundred years, and then a king's son, the one meant for her, would wake her.
        - id: ch03-b05
          speaker: narrator
          text: At those words, the Prince's heart caught fire. Without stopping to consider the danger, he believed he could bring this marvelous adventure to its end. Love and the hope of glory drove him on, and he decided to enter the wood at once.
        - id: ch03-b06
          speaker: narrator
          text: As he approached, the great trees, bushes, and brambles moved aside on their own. A broad avenue opened before him, leading straight to the castle. But once he had passed, the trees closed behind him. None of his people could follow. When he looked back and saw that he was alone, the Prince was deeply surprised. Still, he kept walking toward the castle. A young prince searching for glory does not easily turn back.
        - id: ch03-b07
          speaker: narrator
          text: In the wide outer court, he stopped in horror. A dreadful silence covered everything. Men and animals lay stretched out as if death had passed through the palace. Then he noticed the gatekeepers' red cheeks and blotchy noses. They were sleeping, not dead. A little wine still remained in their cups. They had fallen asleep while they drank.
        - id: ch03-b08
          speaker: narrator
          text: He crossed a court paved with marble and climbed the stairs. In the guardroom, soldiers still stood in their ranks with muskets resting on their shoulders. They were snoring as loudly as they could. Beyond them, he passed through one room after another, all filled with ladies and gentlemen. Some had fallen asleep standing, and others sat in their places, but every one of them slept.
        - id: ch03-b09
          speaker: narrator
          text: At last, the Prince entered a gilded room. The curtains around a bed stood open, revealing the most beautiful sight he had ever seen. There lay a princess who seemed fifteen or sixteen years old. Her shining beauty seemed almost heavenly. Trembling with wonder, he came near and knelt beside her.
        - id: ch03-b10
          speaker: narrator
          text: The enchantment had reached its end. The Princess opened her eyes. She looked at him with a tenderness no one would expect at a first meeting.
        - id: ch03-b11
          speaker: princess
          text: Is it really you, my Prince? You have kept me waiting a long time.
        - id: ch03-b12
          speaker: narrator
          text: Her words and the way she said them delighted him. He struggled to express his joy and gratitude.
        - id: ch03-b13
          speaker: prince
          text: I love you more than I love my own life.
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: Their conversation wandered, but that only made them happier. When love is deep, fine speeches matter very little. The Prince had more trouble finding words than the Princess did. She had enjoyed pleasant dreams during her long sleep, thanks, it seems, to the good fairy, though history says nothing about it. They talked for four hours and still did not say half of what they wished to say.
        - id: ch03-b15
          speaker: narrator
          text: Meanwhile, the entire palace woke with the Princess. Everyone remembered the work waiting for them. Since none of them was in love, they soon felt desperately hungry. The lady of honor was as hungry as anyone, and she finally called out to the Princess.
        - id: ch03-b16
          speaker: lady_of_honor
          text: Your Highness, dinner is served.
        - id: ch03-b17
          speaker: narrator
          text: The Prince helped the Princess rise. She was already dressed in magnificent clothes. He carefully avoided mentioning that her high collar and gown looked like something his great-grandmother might have worn. They did not make her any less beautiful.
        - id: ch03-b18
          speaker: narrator
          text: Together they entered the great hall of mirrors and sat down to supper. The officers of the Princess's household served them, while violins and oboes played old tunes. No one had performed those tunes for one hundred years, but they still sounded excellent. When the meal ended, they wasted no time. The palace chaplain married them in the castle chapel. They slept very little that night. The Princess, after all, had hardly any need for more sleep.
    - id: ch04
      title: The Prince's Secret Family
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the Prince left the Princess and returned to the city. His father had been terribly worried about him.
        - id: ch04-b02
          speaker: prince
          text: I lost my way in the forest while I was hunting. I spent the night in a charcoal burner's cottage, and he gave me brown bread and cheese.
        - id: ch04-b03
          speaker: narrator
          text: His father was a good man, and he believed the story about the cottage, the cheese, and the brown bread. His mother could not be persuaded. The Prince began going hunting almost every day. He always found some excuse for leaving, even when he had stayed away for three or four nights at a time. Before long, his mother suspected that he had married in secret.
        - id: ch04-b04
          speaker: narrator
          text: For more than two years, the Prince lived this way with the Princess. They had two children. Their elder child was a daughter named Dawn. Their younger child was a son named Day, because he was even more handsome than his sister.
        - id: ch04-b05
          speaker: narrator
          text: The Queen questioned her son many times, hoping to learn how he spent his days. She told him that, as her son, it was his duty to give her an answer. But though the Prince loved his mother, he feared her and never trusted her with his secret. She came from a family of ogres, and his father had married her only because she was enormously rich. People at court even whispered that she had an ogre's appetite. Whenever she saw little children passing by, she had to struggle not to fall upon them.
        - id: ch04-b06
          speaker: narrator
          text: About two years later, the old King died. The Prince became King and could finally declare his marriage in public. With great ceremony, he brought his Queen to the royal palace. She entered the capital riding between Dawn and Day.
        - id: ch04-b07
          speaker: narrator
          text: Not long afterward, the new King went to war against his neighbor, Emperor Cantalabutte. He left his mother in charge of the kingdom and begged her to care for his wife and children. The war would keep him away all summer.
        - id: ch04-b08
          speaker: narrator
          text: As soon as he had gone, the Queen Mother sent the young Queen and her children to a country house in the woods. There, she thought, she could satisfy her horrible hunger more easily. A few days later, she went to the house herself and summoned the head cook.
    - id: ch05
      title: The Queen Mother's Horrible Orders
      blocks:
        - id: ch05-b01
          speaker: queen_mother
          text: Tomorrow, I mean to have little Dawn for my dinner.
        - id: ch05-b02
          speaker: head_cook
          text: Oh, madam, no!
          emotion: fearful
        - id: ch05-b03
          speaker: queen_mother
          text: I will have it. Serve her with a sharp sauce.
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: She spoke with an ogress's hunger for fresh meat. The poor cook knew better than to play tricks with an ogress. He took his great knife and went to Dawn's room. The little girl was almost four. She ran to him, laughing and jumping, threw her arms around his neck, and asked him for candy.
        - id: ch05-b05
          speaker: dawn
          text: Do you have some candy for me?
        - id: ch05-b06
          speaker: narrator
          text: The cook began to weep, and the knife dropped from his hand. He went into the backyard and killed a little lamb instead. He prepared it with such a fine sauce that the Queen Mother said she had never tasted anything better. Meanwhile, he carried Dawn to his wife and hid the child in their rooms at the far end of the courtyard.
        - id: ch05-b07
          speaker: narrator
          text: Eight days passed. Then the wicked Queen Mother called for the cook again.
        - id: ch05-b08
          speaker: queen_mother
          text: Tonight, I will eat little Day.
        - id: ch05-b09
          speaker: narrator
          text: The cook said nothing. He had already decided to fool her as he had before. He found three-year-old Day with a practice sword in his hand, fencing with a large monkey. The cook picked the little boy up in his arms and carried him to his wife. She hid him in her room with his sister. Then the cook prepared a young and very tender goat in Day's place. The ogress ate it and declared that it was wonderfully good.
        - id: ch05-b10
          speaker: narrator
          text: Everything had gone well so far. But one evening, the Queen Mother gave the cook a third command.
        - id: ch05-b11
          speaker: queen_mother
          text: I will eat the young Queen with the same sauce you used for her children.
        - id: ch05-b12
          speaker: narrator
          text: The poor cook fell into despair. He could not imagine how to deceive the ogress this time. The young Queen was more than twenty years old, without counting the hundred years she had spent asleep. Finding anything that could take her place seemed impossible. At last, the cook feared that his own life would be lost if he disobeyed. He decided he must cut the Queen's throat. He worked himself into as much fury as he could, took his dagger in his hand, and went straight to her room. Even then, he would not deceive her. With great respect, he told her exactly what the Queen Mother had ordered.
        - id: ch05-b13
          speaker: princess
          text: Then do it. Carry out your orders. After that, I can go to my poor children. I loved them so dearly.
          emotion: sad
        - id: ch05-b14
          speaker: narrator
          text: She stretched out her neck. Because the children had been taken without her knowledge, she believed they were dead.
        - id: ch05-b15
          speaker: head_cook
          text: No, no, Your Majesty! You will not die. You will see your children this very moment. But you must come to my rooms, where I've hidden them. I will fool the Queen Mother once more and serve her a young deer instead.
          emotion: sad
        - id: ch05-b16
          speaker: narrator
          text: The cook took her straight to his rooms at the end of the courtyard. There she found Dawn and Day alive. He left the mother embracing her children and crying with them, then went to prepare a young deer with the same sauce. The Queen Mother ate it for supper and devoured it with as much appetite as if it truly were the young Queen.
        - id: ch05-b17
          speaker: narrator
          text: Pleased with all her cruelty, the Queen Mother invented a story for her son's return. She would tell him that mad wolves had eaten his wife and both children.
    - id: ch06
      title: The Family Is Saved
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One evening, as usual, the Queen Mother wandered through the palace courts and yards, sniffing for fresh meat. From a ground-floor room, she heard little Day crying. His mother was about to punish him because he had been naughty. At the same time, Dawn was begging her mother to spare her brother.
        - id: ch06-b02
          speaker: dawn
          text: Please, Mama, don't punish Day!
        - id: ch06-b03
          speaker: narrator
          text: The ogress recognized the voices of the young Queen and both children. Furious that she had been deceived, she gave a terrible order in a voice that made everyone tremble.
        - id: ch06-b04
          speaker: queen_mother
          text: At daybreak, fill a huge tub in the middle of the courtyard with toads, vipers, snakes, and every kind of serpent. Tie the hands of the Queen, her children, the head cook, his wife, and their maid. Then throw them all in!
          emotion: angry
        - id: ch06-b05
          speaker: narrator
          text: At daybreak, the young Queen and her children were brought into the courtyard. The cook, his wife, and their maid stood with them, and all had their hands tied behind their backs. The executioners moved toward the great tub and were just about to throw everyone in. At that very moment, the King rode into the court on horseback. No one had expected him home so soon. He stared at the horrible scene in utter astonishment and demanded to know what it meant.
        - id: ch06-b06
          speaker: prince
          text: What is happening here?
          emotion: surprised
        - id: ch06-b07
          speaker: narrator
          text: No one dared answer. When the enraged ogress saw that her plan had failed, she threw herself headfirst into the tub. The ugly creatures she had gathered to kill the others devoured her at once.
        - id: ch06-b08
          speaker: narrator
          text: The King was deeply sorry, because she was his mother. But before long, he found comfort in his beautiful wife and his lovely children.
