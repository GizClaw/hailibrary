audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而富有童话色彩
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中等
    young_fairy:
      display_name: 年轻仙女
      tts:
        delivery: 坚定而令人安心
        timbre: 明亮柔和
        pace: 从容
        pitch: 中高
    princess:
      display_name: 公主
      tts:
        delivery: 天真而真挚
        timbre: 清亮柔美
        pace: 自然
        pitch: 中高
    old_woman:
      display_name: 老婆婆
      tts:
        delivery: 朴实亲切
        timbre: 苍老柔和
        pace: 缓慢
        pitch: 中低
    countryman:
      display_name: 老乡人
      tts:
        delivery: 恭敬而笃定
        timbre: 苍老粗粝
        pace: 不疾不徐
        pitch: 低
    lady_of_honor:
      display_name: 掌礼女官
      tts:
        delivery: 端庄而直率
        timbre: 清晰沉稳
        pace: 稍快
        pitch: 中等
    queen_mother:
      display_name: 王太后
      tts:
        delivery: 冷酷而威严
        timbre: 低沉锐利
        pace: 缓慢
        pitch: 中低
    head_cook:
      display_name: 御厨
      tts:
        delivery: 忠厚而诚恳
        timbre: 浑厚朴实
        pace: 自然
        pitch: 中低
  chapters:
    - id: ch01
      title: 仙女的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王和一位王后。他们一直没有孩子，心里的难过，真是怎么说也说不尽。后来，王后终于生下一个女儿。小公主受洗那天，宫里热闹非凡。国王和王后请来全国能找到的七位仙女做她的教母。照那时的规矩，每位仙女都要送她一样天赋，好叫公主拥有世间一切美好的禀赋。
        - id: ch01-b02
          speaker: narrator
          text: 仪式结束后，宾客们回到王宫。宫里为仙女们摆下盛宴，每个人面前都有一套餐具，还有一只镶着钻石和红宝石的纯金匣子，里面放着金勺、金刀和金叉。大家才要入席，一位年迈的仙女忽然走进大厅。她五十多年没离开过自己住的那座塔，人们以为她早已死去，或是中了魔法，所以根本没有请她。
        - id: ch01-b03
          speaker: narrator
          text: 国王赶紧叫人添一套餐具，可金匣子只做了七只，再也拿不出第八只。老仙女认定自己受了轻慢，咬着牙低声威胁。坐在近旁的年轻仙女听见了，猜到她会送公主一份不祥的礼物。宴席一散，年轻仙女便躲到帷幕后面，准备最后一个开口，好尽力挽回老仙女造成的灾祸。
        - id: ch01-b04
          speaker: narrator
          text: 仙女们开始赠送礼物。公主会成为世上最美丽的人，会有天使般的聪慧，一举一动都优雅动人。她会跳最美的舞，会唱出夜莺般的歌声，还能把各种乐器都演奏得尽善尽美。
        - id: ch01-b05
          speaker: narrator
          text: 轮到老仙女时，她的头抖个不停。与其说是年老，倒不如说是心里的怨恨在发作。她宣告，公主将被纺锤刺破手掌，还会死于这处伤口。在场的人吓得浑身发颤，全都哭了起来。就在这时，年轻仙女从帷幕后走出来，高声说话。
        - id: ch01-b06
          speaker: young_fairy
          text: 国王陛下，王后殿下，请放心。你们的女儿不会死。我无法彻底解除前辈定下的命运，公主的手仍会被纺锤刺破，但她只会沉沉睡去。等一百年过去，会有一位王子来唤醒她。
          emotion: calm
        - id: ch01-b07
          speaker: narrator
          text: 为了避开老仙女预言的灾难，国王立刻下令，谁敢用纺杆和纺锤纺线，或在家里藏着纺锤，就要被处死。十五六年过去了。一天，国王和王后去了乡间的一处别宫，年轻的公主独自在王宫里四处游逛。她跑上跑下，从一个房间逛到另一个房间，最后爬上高塔，走进塔顶的一间小阁楼。里面坐着一位善良的老婆婆，独自拿着纺锤纺线。她从来没听说过国王禁止使用纺锤的命令。
        - id: ch01-b08
          speaker: princess
          text: 好婆婆，你在做什么呀？
        - id: ch01-b09
          speaker: old_woman
          text: 我在纺线呀，漂亮姑娘。
        - id: ch01-b10
          speaker: princess
          text: 这个真有意思！你是怎么纺的？给我试试看吧。
        - id: ch01-b11
          speaker: narrator
          text: 公主刚把纺锤接到手里，也不知是动作太急，一时大意，还是仙女定下的命运终于到了，纺锤尖忽然一下刺进她的手掌。她当场昏倒在地，完全失去了知觉。
    - id: ch02
      title: 沉睡的宫殿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 善良的老婆婆不知道该怎么办，只好慌忙呼救。人们听见喊声，从四面八方赶来。有人往公主脸上泼水，有人解开她的衣带，有人用力拍打她的手心，还有人拿科隆香水揉她的太阳穴。大家想尽了办法，可是不管怎样，都唤不醒她。
        - id: ch02-b02
          speaker: narrator
          text: 国王听见喧闹声，赶到阁楼。他想起仙女们的预言，也明白既然仙女早已这样说过，这件事就注定会发生。于是，他命人把公主抬进宫中最华美的房间，放在一张绣满金线银线的床上。她美得像个小天使。昏睡没有让她的脸失去光彩，双颊仍像石竹花一样红，嘴唇仍像珊瑚一样艳。她闭着眼，却还有轻柔的呼吸，大家听见后，这才确信她并没有死。
        - id: ch02-b03
          speaker: narrator
          text: 国王吩咐众人不要惊动她，只等苏醒的时刻到来。那位救了公主的年轻仙女，当时正在一万二千里外的马塔金王国。一个穿七里靴的小矮人马上送去了消息。那双靴子每跨一步，就能越过七里。仙女随即乘上一辆飞龙牵引的烈焰马车，大约一个钟头后便赶到了。
        - id: ch02-b04
          speaker: narrator
          text: 国王亲自扶她下车。仙女赞许国王所做的一切，却凭着自己的远见想到，公主百年后若独自醒在这座古老的宫殿里，一定会不知所措。她便挥起魔杖，把宫里的人一一碰过。女教师、宫女、内廷女官、贵族、官员、管家、厨师、厨工、厨娘、卫兵、守门人、侍童和男仆，全都没有漏下。只有国王和王后不在其中。
        - id: ch02-b05
          speaker: narrator
          text: 马厩里的车马、猎马和坐骑，还有马夫、外院的大狗，也都被魔杖点到了。就连公主床上的小长耳猎犬莫普西也不例外。魔杖碰到谁，谁就睡去，在公主醒来以前，谁也不会醒来。这样，她需要服侍时，所有人都能立刻守在身边。炉火上那些塞满山鹑和野鸡的烤肉叉也睡着了，连火焰也一同睡去。这些事转眼就完成了。仙女做事，从来用不了多少工夫。
        - id: ch02-b06
          speaker: narrator
          text: 国王和王后最后吻了吻心爱的女儿，没有惊醒她。他们离开王宫，下令任何人都不准靠近。其实这道命令并不需要。不到一刻钟，园林四周就长满了无数大大小小的树木、灌丛和荆棘。枝蔓一层层交缠起来，人和野兽都无法穿过。远远望去，只能看见宫殿塔楼的尖顶，除此之外什么也看不到。谁都知道，这也是仙女的法术。她不愿让好奇的人惊扰沉睡的公主。
    - id: ch03
      title: 百年后的王子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一百年过去了。此时统治这个国家的国王来自另一个家族，并不是沉睡公主的亲族。一天，他的儿子来附近打猎，看见浓密的森林中央露出几座塔楼，便问那是什么地方。人们都照着听来的传闻回答。有人说那是闹鬼的古堡，有人说全国的巫婆都在那里午夜狂欢。更多人却说，那里住着一个吃人妖怪。他会把抓到的小孩子全带回去，躲在森林里慢慢吃掉。谁也追不上他，因为只有他能在那片密林中开出路来。
        - id: ch03-b02
          speaker: narrator
          text: 王子不知该信谁。一位年迈的乡下人走过来，向他行礼。
        - id: ch03-b03
          speaker: countryman
          text: 王子殿下，我父亲五十多年前告诉过我，这座城堡里住着世上最美丽的公主。她必须沉睡一百年，最后会由一位王子唤醒。她一直等候的，就是那个人。
        - id: ch03-b04
          speaker: narrator
          text: 王子听完这番话，心里顿时像燃起一团火。他根本没有停下来仔细思量，就认定自己能够结束这场非凡的奇遇。还没见到公主，爱情已经在催促他，建功扬名的渴望也在催促他。他当即下定决心，一定要亲自去看个究竟，便马上朝森林走去。
        - id: ch03-b05
          speaker: narrator
          text: 王子一走近，高树、灌丛和荆棘便自行分开，给他让出路来。他沿着宽阔的林中大道走向城堡。回头一看，随从一个也没有跟来，因为树木在他身后重新合拢了。王子虽然吃惊，却没有停步。追求荣耀的年轻王子，总是勇气十足的。
        - id: ch03-b06
          speaker: narrator
          text: 他走进宽广的外院，眼前的景象叫人浑身冰凉。可怕的寂静笼罩四周，地上横躺着人和牲畜，仿佛死亡占据了一切。王子仔细看了看。守门人的脸色红润，鼻尖还冒着酒刺，杯里也剩着几滴酒。原来，他们只是喝到一半睡着了。
        - id: ch03-b07
          speaker: narrator
          text: 王子接着穿过铺着大理石的庭院，登上楼梯。卫兵们肩扛火枪，整齐地站在卫兵厅里，却一个个鼾声震天。他又走过好几个房间，里面全是贵族男女。有人站着，有人坐着，但都睡得很熟。最后，他走进一间金碧辉煌的卧房。床幔全向两边敞开，中间躺着他一生见过最美的姑娘。她约莫十五六岁，光彩照人的美丽仿佛带着神圣的光辉。王子又惊叹又颤抖，慢慢走到床前，跪在她身旁。
        - id: ch03-b08
          speaker: narrator
          text: 就在这时，魔法的期限到了。公主睁开眼睛，温柔地望着王子。
        - id: ch03-b09
          speaker: princess
          text: 是你吗，我的王子？你让我等了好久。
        - id: ch03-b10
          speaker: narrator
          text: 王子被这句话和她说话的神情迷住，不知怎样表达喜悦和感激，只一再保证，爱她胜过爱自己的生命。他们说得颠三倒四，心里却更加甜蜜。爱情越深，漂亮话往往越少。王子比公主更不知所措，这也难怪。公主有很长时间想好该说什么。虽然史书没提，善良的仙女想必在漫长的睡梦里送给过她许多美梦。两人足足谈了四个钟头，要说的话还没说到一半。
        - id: ch03-b11
          speaker: narrator
          text: 整座宫殿也跟着公主醒了。人人都想起自己的差事。他们没有坠入爱河，很快就饿得要命。掌礼女官也饥肠辘辘，终于忍不住高声提醒公主。
        - id: ch03-b12
          speaker: lady_of_honor
          text: 殿下，晚餐已经摆好了。
        - id: ch03-b13
          speaker: narrator
          text: 王子扶公主起身。她早已穿戴齐整，衣饰华丽非凡。王子很识趣，没有告诉她，那身带着高领的衣裳，活像自己曾祖母的打扮。可她一点也没有因此少了妩媚和美丽。两人来到四壁镶镜的大厅，由公主宫中的侍从服侍着用餐。小提琴和双簧管奏起一百年无人演奏的古老曲调，听来仍然美妙。晚餐一结束，他们片刻也没耽搁，宫廷司祭就在城堡的小教堂里为两人主持了婚礼。
        - id: ch03-b14
          speaker: narrator
          text: 那一夜，他们几乎没有睡，公主本来也不太需要睡眠。第二天早晨，王子告别了她，动身回到城里。他的父亲正为儿子担心得不得了。王子却没有说出实情，只告诉父亲，自己打猎时在森林迷了路，只好在一个烧炭人的小屋里过夜。那个烧炭人拿出奶酪和黑面包招待了他。
    - id: ch04
      title: 王太后的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子的父亲是个厚道人，相信了这番话。母亲却怎么也不肯相信。她见儿子几乎天天去打猎，每次都有现成的借口，有时甚至三四夜不回家，便渐渐怀疑他已经结婚。其实，王子和公主已经共同生活了整整两年，其间还有了两个孩子。大的是女儿，名叫曙光。小的是儿子，名叫白昼，因为弟弟生得比姐姐还要漂亮。
        - id: ch04-b02
          speaker: narrator
          text: 王后几次追问儿子去了哪里，想知道他究竟怎样消磨时光，还说儿子理当对母亲说出实情。可王子始终不敢透露秘密。他虽然爱母亲，却也怕她，因为她出身于吃人妖怪一族。国王当初娶她，只是看中了她的巨额财富。宫里甚至有人私下传言，她生来就有吃人妖怪的癖性。每次看见小孩子从眼前走过，她都要费尽力气忍住，才不会扑上去。
        - id: ch04-b03
          speaker: narrator
          text: 又过了大约两年，老国王去世，王子继承王位。他终于公开婚事，用盛大的仪仗接妻子入宫。王后骑马走在两个孩子中间，一家人风风光光地进了都城。
        - id: ch04-b04
          speaker: narrator
          text: 不久，国王同邻国的康塔拉比特皇帝开战。他把王国交给母亲治理，又郑重托付她照料自己的妻儿。国王要在外征战一整个夏天。他刚离开，王太后就把儿媳和两个孩子送到林间的乡间别墅，好让自己更容易满足那可怕的欲望。几天后，她也来到别墅，对御厨下令。
        - id: ch04-b05
          speaker: queen_mother
          text: 明天午餐，我要吃小曙光。
        - id: ch04-b06
          speaker: head_cook
          text: 啊！殿下！
          emotion: fearful
        - id: ch04-b07
          speaker: queen_mother
          text: 我说要吃，就一定要吃。给她配上辣味浓烈的酱汁。
        - id: ch04-b08
          speaker: narrator
          text: 她说话的腔调，完全是个馋鲜肉的吃人女妖。御厨知道不能和她作对，只好提起大刀，走进小曙光的房间。女孩还不到四岁，一见他就蹦蹦跳跳地跑来，搂住他的脖子，问他要糖果。御厨哭了，大刀掉在地上。他去后院杀了一只小羊羔，配上极好的酱汁。王太后吃后，还说一辈子从没吃过这么美味的东西。御厨早已把小曙光交给妻子，藏在庭院尽头的住处。
        - id: ch04-b09
          speaker: narrator
          text: 八天后，王太后又吩咐御厨。
        - id: ch04-b10
          speaker: queen_mother
          text: 今天晚餐，我要吃小白昼。
        - id: ch04-b11
          speaker: narrator
          text: 御厨一句话也没有回答，心里却已经决定，要像上次一样再骗她一次。他去找小白昼，看见孩子手里拿着一柄练习剑，正在同一只大猴子比剑。那时，小白昼才三岁。御厨把他抱在怀里，送到妻子那里，让她把弟弟和姐姐一起藏在房中。随后，他烹调了一只又小又嫩的山羊羔，用它代替小白昼端上餐桌。吃人女妖尝过以后，觉得滋味好极了。
        - id: ch04-b12
          speaker: narrator
          text: 一切原本都很顺利。可是一天晚上，王太后又开口了。
        - id: ch04-b13
          speaker: queen_mother
          text: 我要用烹调那两个孩子的酱汁来烹调王后，再把她吃掉。
        - id: ch04-b14
          speaker: narrator
          text: 御厨彻底绝望了。年轻王后二十多岁，那沉睡的一百年当然不算在内。他上哪儿找一样东西来冒充她呢？为了保住自己的性命，御厨决定割断王后的喉咙。他握着匕首，拼命装出凶狠的样子，冲进王后的房间。可他不愿欺瞒她，还是恭恭敬敬地说出了王太后的命令。
        - id: ch04-b15
          speaker: princess
          text: 动手吧。照她的命令做。这样我就能去见我的孩子，去见我那两个可怜的孩子了。我曾那么深、那么温柔地爱着他们。
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 孩子被带走时，王后毫不知情。她一直以为他们已经死了。
        - id: ch04-b17
          speaker: head_cook
          text: 不，殿下，您不会死！您马上就能见到孩子。他们都藏在我的住处，请跟我来。我再骗王太后一次，拿一只小母鹿代替您。
        - id: ch04-b18
          speaker: narrator
          text: 御厨泪流满面，立刻领她来到自己的房间。王后见到孩子，紧紧抱住他们，母子三人一起哭泣。御厨把他们留在那里，自己转身去烹调一只小母鹿。王太后晚餐时把它吃得精光，胃口之好，就像吃的真是年轻王后。她对自己的残忍行径十分满意，还编好一套谎话，准备等国王回来时告诉他，他的妻子和两个孩子全被一群疯狼吃掉了。
    - id: ch05
      title: 国王归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天晚上，王太后照例在宫殿的院落间游荡，想闻闻哪里有鲜肉。她忽然听见底层的房间里，小白昼正在哭。原来他淘气，母亲正要打他。与此同时，小曙光在替弟弟求情。
        - id: ch05-b02
          speaker: narrator
          text: 吃人女妖立刻认出王后和两个孩子的声音。她发现自己被骗，气得发狂。她用叫所有人发抖的声音命令，第二天天一亮，要在大院中央放一口大缸，装满癞蛤蟆、蝰蛇、长蛇和各种毒蛇。王后、两个孩子、御厨、御厨的妻子和女仆，都要反绑双手，扔进缸里。
        - id: ch05-b03
          speaker: narrator
          text: 第二天，他们果然全被反绑双手，押到院子中央。刽子手正要把他们扔进装满毒物的大缸，谁也没料到国王会在此刻骑马回来。他原本不会这么快归来。国王一进庭院，就望见这场可怕的景象。他惊愕万分，厉声追问究竟发生了什么。
        - id: ch05-b04
          speaker: narrator
          text: 没有人敢回答。吃人女妖眼看事情败露，怒不可遏，一头栽进大缸。那些原本奉她的命令，用来害人的丑恶毒物，转眼便把她吞食了。国王当然十分悲伤，因为她毕竟是他的母亲。不过，有美丽的妻子和可爱的孩子陪伴，他很快便得到了安慰。
