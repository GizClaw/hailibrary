  chapters:
    - id: ch01
      title: The Youngest Son's Share
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a miller died and left his three sons only a mill, a donkey, and a cat. They divided everything without calling in a lawyer or an attorney. Those men would soon have eaten up the little property there was. The oldest son took the mill. The second took the donkey. All the youngest received was the cat.
        - id: ch01-b02
          speaker: narrator
          text: The youngest son was miserable with such a poor share.
        - id: ch01-b03
          speaker: youngest_son
          text: My brothers can put their shares together and make a good living. But what can I do? Once I've eaten my cat and made a muff from his skin, I'll have nothing left. I'll starve.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: The Cat heard every word, though he acted as if he had not been listening. Then he spoke with a very serious look.
        - id: ch01-b05
          speaker: puss
          text: Don't be so troubled, master. Just give me a bag and have a pair of boots made for me. Then I can run through the brambles. You'll soon see that I'm worth far more than you think.
        - id: ch01-b06
          speaker: narrator
          text: The young man did not expect much from this promise. Still, he had watched the Cat catch rats and mice with clever tricks. The Cat would hang by his heels or hide in the meal and pretend to be dead. So his master could not help hoping that the Cat might save him from his misery.
        - id: ch01-b07
          speaker: narrator
          text: As soon as he had the things he wanted, the Cat pulled on his boots with great style. He slung the bag around his neck and held its strings in his two front paws. Then he went to a warren where many rabbits lived. He filled the bag with bran and sow thistle, stretched out flat as if he were dead, and waited. He hoped that one of the young rabbits, still innocent of the world's tricks, would climb in and search for the food.
    - id: ch02
      title: Gifts for the King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Cat had barely settled down when he got exactly what he wanted. A rash and foolish young rabbit hopped into the bag and began nosing through the food. At once, Puss pulled the strings tight, caught the rabbit, and killed it. Proud of his prize, he carried it to the palace and asked to speak with the King. The servants took him upstairs to the King's own apartment, where he made a deep bow.
        - id: ch02-b02
          speaker: puss
          text: Your Majesty, my noble lord, the Marquis of Carabas, has ordered me to present you with this rabbit.
        - id: ch02-b03
          speaker: narrator
          text: The Marquis of Carabas was only a grand title Puss had invented for his master.
        - id: ch02-b04
          speaker: king
          text: Tell your master that I thank him. His gift pleases me very much.
        - id: ch02-b05
          speaker: narrator
          text: Another day, Puss hid among tall, standing grain and once again left his bag open. Two partridges ran inside. He pulled the strings shut and caught them both. Then he took the birds to the palace as another gift from the Marquis. The King received the partridges with just as much pleasure as the rabbit and ordered his servants to reward the Cat.
        - id: ch02-b06
          speaker: narrator
          text: For the next two or three months, Puss kept bringing the King game from time to time, always saying it came from his master.
    - id: ch03
      title: The Plan by the River
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One day, Puss learned that the King would be riding beside the river with his daughter, the most beautiful princess in the world. He went straight to his master.
        - id: ch03-b02
          speaker: puss
          text: Take my advice, and your fortune is made. Go bathe in the river at the place I'll show you. Leave everything else to me.
        - id: ch03-b03
          speaker: narrator
          text: The Marquis of Carabas did as the Cat told him, though he had no idea how a swim could help. While he was in the water, the King's coach came by. The Cat shouted with all his strength.
        - id: ch03-b04
          speaker: puss
          text: Help! Help! My lord, the Marquis of Carabas, is drowning!
        - id: ch03-b05
          speaker: narrator
          text: The King leaned out of the coach window. He recognized the Cat who had brought him so much game and ordered his guards to rescue the Marquis at once.
        - id: ch03-b06
          speaker: narrator
          text: As the guards pulled the poor Marquis from the river, Puss hurried to the coach. He told the King that thieves had stolen his master's clothes while he was bathing. His master had shouted, "Thieves!" again and again, but the rogues had escaped. In truth, the cunning Cat had hidden the clothes under a large stone.
        - id: ch03-b07
          speaker: narrator
          text: The story moved the King to act at once. He sent officers from his own wardrobe racing off to fetch one of his finest suits for the Marquis of Carabas. Soon the young man stood before him dressed like a nobleman.
        - id: ch03-b08
          speaker: narrator
          text: The King treated the young man with great courtesy. The splendid clothes made the handsome, well-built Marquis look even finer, and the Princess liked him very much. When he gave her two or three respectful, tender looks, she fell wildly in love with him. The King invited the Marquis into the coach to join their ride.
        - id: ch03-b09
          speaker: narrator
          text: Puss was delighted to see his plan beginning to work. He hurried ahead until he found some countrymen mowing a meadow.
    - id: ch04
      title: The Marquis's Great Estate
      blocks:
        - id: ch04-b01
          speaker: puss
          text: Listen, good mowers. When the King asks, you must say this meadow belongs to my lord, the Marquis of Carabas. If you don't, you'll be chopped as fine as herbs for the cooking pot.
        - id: ch04-b02
          speaker: narrator
          text: Sure enough, when the King's coach arrived, he asked the mowers who owned the meadow.
        - id: ch04-b03
          speakers: [mower_1, mower_2, mower_3]
          ensemble: chorus
          text: It belongs to my lord, the Marquis of Carabas!
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: They answered together because the Cat's threat had frightened them.
        - id: ch04-b05
          speaker: king
          text: You own a fine piece of land here, my lord Marquis.
        - id: ch04-b06
          speaker: youngest_son
          text: As you can see, Your Majesty, this meadow gives a rich harvest every year.
        - id: ch04-b07
          speaker: narrator
          text: Puss kept ahead of the coach. Next he came upon some reapers working in a field of grain.
        - id: ch04-b08
          speaker: puss
          text: Listen, good reapers. You must tell the King that all this grain belongs to the Marquis of Carabas. If you don't, you'll be chopped as fine as herbs for the cooking pot.
        - id: ch04-b09
          speaker: narrator
          text: A moment later, the King passed by and asked who owned all the grain before him.
        - id: ch04-b10
          speakers: [reaper_1, reaper_2, reaper_3]
          ensemble: chorus
          text: It belongs to my lord, the Marquis of Carabas!
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: The answer pleased the King, and he congratulated the Marquis on such a fine crop. Puss kept going ahead of the coach. Every time he met more workers, he gave them the same warning, and each time the King heard that the land belonged to the Marquis. Before long, the King was amazed by the enormous estate of the Marquis of Carabas.
    - id: ch05
      title: The Ogre's Castle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, Puss reached a magnificent castle. Its master was the richest Ogre anyone had ever known. The castle, the meadows, the grain fields, and all the other land the King had just passed truly belonged to him. Before coming, the Cat had carefully found out who this Ogre was and what powers he possessed. Now he asked for an audience. He said he could never pass so close to the Ogre's castle without stopping to pay his respects.
        - id: ch05-b02
          speaker: narrator
          text: The Ogre welcomed him as politely as an Ogre could and offered him a seat.
        - id: ch05-b03
          speaker: puss
          text: I've been told you can turn yourself into any creature you choose. They say you can become a lion, an elephant, or anything else you like.
        - id: ch05-b04
          speaker: ogre
          text: It's true. To prove it, I'll become a lion right now.
        - id: ch05-b05
          speaker: narrator
          text: Suddenly there was a lion beside Puss. The Cat was so terrified that he scrambled up to the gutter. It was a dangerous climb, and his boots were no help at all on the roof tiles. After a while, the Ogre returned to his usual shape. Puss climbed down and admitted how badly the lion had frightened him.
        - id: ch05-b06
          speaker: puss
          text: I've heard something else, but I can't believe it. Can you really take the shape of the smallest animals too? Could you turn yourself into a rat or a mouse? That seems impossible.
        - id: ch05-b07
          speaker: ogre
          text: Impossible? Watch me!
        - id: ch05-b08
          speaker: narrator
          text: At once, the Ogre became a mouse and began running across the floor. The moment Puss saw him, he pounced and ate him up.
        - id: ch05-b09
          speaker: narrator
          text: Meanwhile, the King had noticed the Ogre's beautiful castle and decided to visit it. Puss heard the royal coach rumbling over the drawbridge. He ran outside to meet it.
        - id: ch05-b10
          speaker: puss
          text: Welcome, Your Majesty, to the castle of my lord, the Marquis of Carabas.
        - id: ch05-b11
          speaker: king
          text: What, my lord Marquis? This castle belongs to you as well? Nothing could be finer than this courtyard and the grand buildings around it. Please, let us see inside.
          emotion: surprised
        - id: ch05-b12
          speaker: narrator
          text: The Marquis offered his hand to the young Princess and followed the King into the castle. In the great hall, they found a magnificent feast. The Ogre had prepared it for friends who were coming that very day. But when those guests learned the King was inside, they did not dare enter.
        - id: ch05-b13
          speaker: narrator
          text: The King was charmed by the Marquis's fine qualities. His daughter, already deeply in love, was charmed too. And now the King believed the young man owned a vast estate.
        - id: ch05-b14
          speaker: king
          text: My lord Marquis, whether you become my son-in-law is entirely up to you.
        - id: ch05-b15
          speaker: narrator
          text: With many low bows, the Marquis accepted the honor the King offered him. That very same day, he married the Princess.
        - id: ch05-b16
          speaker: narrator
          text: Puss became a great lord, and from then on, he chased mice only for amusement.
