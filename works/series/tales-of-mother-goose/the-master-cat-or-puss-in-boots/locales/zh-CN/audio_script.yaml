audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳而带有温和调侃的童话讲述
        timbre: 温暖清晰
        pace: 舒缓中有起伏
        pitch: 中音
    youngest_son:
      display_name: 磨坊主的小儿子
      tts:
        delivery: 诚实质朴，从沮丧逐渐转为自信
        timbre: 年轻清朗
        pace: 中等
        pitch: 中高音
    cat:
      display_name: 穿靴子的猫
      tts:
        delivery: 机敏从容，说话庄重又带一点得意
        timbre: 明亮利落
        pace: 轻快而有分寸
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严直爽，兴致来时爽朗
        timbre: 浑厚清楚
        pace: 从容
        pitch: 中低音
    mowers:
      display_name: 割草人
      tts:
        delivery: 小心拘谨，带着害怕
        timbre: 朴实粗糙
        pace: 稍快
        pitch: 中音
    reapers:
      display_name: 收割人
      tts:
        delivery: 朴实拘谨，回答干脆
        timbre: 厚实
        pace: 中等
        pitch: 中音
    ogre:
      display_name: 食人妖
      tts:
        delivery: 粗暴自负，爱炫耀自己的本领
        timbre: 低沉粗哑
        pace: 缓慢有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 小儿子的遗产
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个磨坊主死后，只给三个儿子留下磨坊、驴和猫。兄弟们很快分好了家产，连律师和诉讼代理人都没请。否则，那两位怕是会先把这点东西吃个精光。老大拿了磨坊，老二牵走驴，最小的儿子只分到一只猫。
        - id: ch01-b02
          speaker: narrator
          text: 小儿子看着自己寒酸的一份，怎么能不伤心呢？
        - id: ch01-b03
          speaker: youngest_son
          text: 哥哥们把家产凑到一起，日子还能过得很不错。我却只能先吃了这只猫，再用猫皮做个手筒。等这些都用完，我就得饿死了。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 猫听得一清二楚，脸上却像什么也没听见。过了一会儿，它庄重地开了口。
        - id: ch01-b05
          speaker: cat
          text: 主人，别再为这事难过了。给我一只口袋，再做一双能让我穿过荆棘的靴子。等我出去跑一趟，您就会明白，得到我并没有想象中那么可怜。
        - id: ch01-b06
          speaker: narrator
          text: 小儿子并不大相信。可他亲眼见过这只猫捉老鼠的狡猾手段。它会用后腿倒挂起来，还会藏在面粉里装死。也许，它真能在穷困中帮上忙。
        - id: ch01-b07
          speaker: narrator
          text: 猫拿到口袋和靴子，立刻穿戴得威风凛凛。它把口袋挂在脖子上，前爪拎住拉绳，跑到一处兔子很多的养兔场。它在袋里放了麦麸和苦菜，然后躺得直挺挺的，就像死了一样。它等着没见过世面的小兔子来翻食物。
        - id: ch01-b08
          speaker: narrator
          text: 它才刚躺好，一只又鲁莽又愚的小兔子就跳进了口袋。猫先生赶紧拉紧绳子，当场捉住它，把它咬死了。
        - id: ch01-b09
          speaker: narrator
          text: 猫得意地带着猎物来到王宫，请求觐见国王。侍从领它上楼，走进国王的寝宫。猫向国王深深行了一礼。
        - id: ch01-b10
          speaker: cat
          text: 陛下，我带来一只兔子。我那位尊贵的主人，卡拉巴斯侯爵，特意吩咐我代他献给您。
        - id: ch01-b11
          speaker: narrator
          text: 当然，“卡拉巴斯侯爵”这个头衔，是猫随自己高兴给主人封的。
        - id: ch01-b12
          speaker: king
          text: 回去告诉你的主人，我谢谢他。他送的礼物，我很喜欢。
    - id: ch02
      title: 河边的巧计
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，猫又藏到一片没收割的麦田里，依旧敞开口袋。两只鹧鸪一跑进去，它就收紧绳子，把它们一起捉住了。猫把鹧鸪也献给国王，就像上回献兔子一样。国王收得十分高兴，还让仆人给猫赏赐。
        - id: ch02-b02
          speaker: narrator
          text: 接下来的两三个月，猫常常把猎物送到王宫，每回都说是主人打来的。一天，它听说国王要带世界上最美的公主沿河出游，便去找主人。
        - id: ch02-b03
          speaker: cat
          text: 主人，要是肯听我的，您的好运就要来了。请到我指定的地方下河洗澡。接下来怎么做，您全都不用管。
        - id: ch02-b04
          speaker: narrator
          text: 这位刚有了名号的卡拉巴斯侯爵不知道猫想做什么，还是照办了。他正在河里洗澡，国王的马车恰好从旁边经过。猫用尽力气大喊起来。
        - id: ch02-b05
          speaker: cat
          text: 救命啊！快救命！我家卡拉巴斯侯爵要淹死了！
        - id: ch02-b06
          speaker: narrator
          text: 国王从车窗里探出头，一眼认出这是常来送猎物的猫。他马上叫卫兵们跑去，救起那位卡拉巴斯侯爵。
        - id: ch02-b07
          speaker: narrator
          text: 卫兵们正忙着把可怜的侯爵拉上岸，猫赶到国王车前。它说，主人下水后，有几个恶棍抢走了他的衣服。主人明明用最大的声音喊过好几次“抓贼”，却还是没能留住他们。
        - id: ch02-b08
          speaker: narrator
          text: 可真相是，衣服全让这只狡猾的猫藏在了一块大石头下。国王当即命令掌管服饰的侍从，去取一套他最好的衣服给侯爵穿。
        - id: ch02-b09
          speaker: narrator
          text: 国王对侯爵殷勤得很。那套华丽的衣服一上身，年轻人本来就匀称英俊的身材更显出众了。公主一看就十分喜欢。侯爵不过恭敬又温柔地望了她两三眼，她就爱得无法自拔。
        - id: ch02-b10
          speaker: narrator
          text: 国王请侯爵登上马车，和他们一起出游。猫看见自己的安排终于有了成效，欢喜得不得了，赶紧跑到队伍前面。
    - id: ch03
      title: 侯爵的广阔庄园
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猫遇到一群乡下人，他们正在草地上割草。它走上前去，毫不客气地警告他们。
        - id: ch03-b02
          speaker: cat
          text: 各位，国王要是问这片草地是谁的，你们必须说它属于卡拉巴斯侯爵。谁要是说错了，我就把他剁得像下锅的菜那么碎！
        - id: ch03-b03
          speaker: narrator
          text: 国王的马车果然到了。他问割草人，眼前这片草地究竟属于谁。
        - id: ch03-b04
          speaker: mowers
          text: 这片草地是卡拉巴斯侯爵大人的。
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 割草人已经被猫的威胁吓坏了，回答得整整齐齐。
        - id: ch03-b06
          speaker: king
          text: 侯爵大人，您在这里的产业可真不错。
        - id: ch03-b07
          speaker: youngest_son
          text: 陛下，您看，这片草地每年的收成都十分丰厚。
        - id: ch03-b08
          speaker: narrator
          text: 猫大师没有停步，又在前方遇见一群正收割麦子的人。
        - id: ch03-b09
          speaker: cat
          text: 你们听好了。国王问起这些麦子，就说它们全是卡拉巴斯侯爵的。要是不照我的话说，我就把你们剁成下锅的碎菜！
        - id: ch03-b10
          speaker: narrator
          text: 不一会儿，国王来到麦田边，果然问这片庄稼属于谁。
        - id: ch03-b11
          speaker: reapers
          text: 陛下，这些全是卡拉巴斯侯爵大人的。
        - id: ch03-b12
          speaker: narrator
          text: 这答案让国王很满意，侯爵听着也很高兴。国王还特意向他道喜。猫始终在马车前方跑着，见到谁就向谁交代同样的话。一路走下来，国王以为自己看到的广阔田地都属于卡拉巴斯侯爵，对他的财富惊叹不已。
    - id: ch04
      title: 食人妖的城堡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最后，猫先生跑到一座气派的城堡前。城堡的主人是个食人妖，富有得无人可比。国王刚才一路看到的土地，其实全属于这座城堡。猫早就问清了食人妖的身份和本领，便请求进去见他。它说，既然已经来到城堡附近，要是不特意前来问候，未免太失礼了。
        - id: ch04-b02
          speaker: narrator
          text: 食人妖拿出一个食人妖所能有的最好态度接待它，还叫它坐下说话。
        - id: ch04-b03
          speaker: cat
          text: 我听说，您能随心所欲地变成各种动物。狮子、大象，不管是什么，您想变就能变，真有这回事吗？
        - id: ch04-b04
          speaker: ogre
          text: 当然是真的。你要是不信，我现在就变成狮子让你开开眼！
        - id: ch04-b05
          speaker: narrator
          text: 一头狮子突然出现在这么近的地方，猫吓得立刻往屋檐的水槽上爬。可它脚上穿着靴子，踩在屋瓦上一点也不顶用。它好不容易才攀上去，一路又危险又艰难。
        - id: ch04-b06
          speaker: narrator
          text: 过了片刻，食人妖变回本来的样子。猫看见了，这才从高处下来，坦白说刚才那一幕实在把它吓得不轻。
        - id: ch04-b07
          speaker: cat
          text: 不过，我还听说，您也能变成最小的动物，像老鼠或小白鼠那样。这叫人怎么信呢？说真的，我觉得这事根本办不到。
        - id: ch04-b08
          speaker: ogre
          text: 办不到？那你就睁大眼睛看好了！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 食人妖说完，当场变成一只小白鼠，在地板上跑来跑去。猫一看见它，立刻扑上去，把它吃了。
    - id: ch05
      title: 卡拉巴斯侯爵的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 与此同时，国王经过这座美丽的城堡，心里很想进去看看。猫听到国王的马车驶过吊桥，赶紧跑到外面迎接。
        - id: ch05-b02
          speaker: cat
          text: 陛下，欢迎您来到我家卡拉巴斯侯爵的城堡。
        - id: ch05-b03
          speaker: king
          text: 侯爵大人，连这座城堡也是你的吗？这庭院真气派，四周的建筑也都宏伟极了。如果你愿意，就带我们到里面看看吧。
          emotion: surprised
        - id: ch05-b04
          speaker: narrator
          text: 侯爵挽着年轻公主的手，跟随国王走进城堡。国王走在最前面。他们进入大厅，眼前摆着一桌十分丰盛的酒宴。
        - id: ch05-b05
          speaker: narrator
          text: 这桌酒宴本是食人妖为朋友们准备的，他们当天正要前来拜访。可是，那些朋友知道国王已经在城堡里，一个也不敢进门。
        - id: ch05-b06
          speaker: narrator
          text: 国王觉得卡拉巴斯侯爵品性出众，而且拥有这么广阔的庄园，真是对他喜欢得不得了。公主早已经深深爱上了他。国王便当面向侯爵开了口。
        - id: ch05-b07
          speaker: king
          text: 侯爵大人，如果你最后没有成为我的女婿，那只会是你自己不愿意。
        - id: ch05-b08
          speaker: narrator
          text: 侯爵一连深深鞠了几躬，接受了国王给他的这份荣幸。就在当天，他和公主举行了婚礼。
        - id: ch05-b09
          speaker: narrator
          text: 从此以后，穿靴子的猫也成了一位大人物。它再也不需要追老鼠了。偶尔去追一只，也只是为了玩一玩。
