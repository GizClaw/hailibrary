audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着而富有童话讲述感
        timbre: 温暖清晰
        pace: 从容而有变化
        pitch: 中音
    little_thumb:
      display_name: 小拇指
      tts:
        delivery: 年幼却机敏坚定
        timbre: 清亮纤细
        pace: 稍慢而清楚
        pitch: 偏高
    father:
      display_name: 父亲威廉
      tts:
        delivery: 疲惫压抑而粗直
        timbre: 低沉沙哑
        pace: 缓慢
        pitch: 低音
    mother:
      display_name: 母亲
      tts:
        delivery: 朴实而感情外露
        timbre: 柔和略哑
        pace: 中等
        pitch: 中音
    brothers:
      display_name: 哥哥们
      tts:
        delivery: 稚嫩而齐声应答
        timbre: 清脆多声部
        pace: 稍快
        pitch: 偏高
    ogress:
      display_name: 食人魔的妻子
      tts:
        delivery: 善良谨慎而带忧色
        timbre: 成熟女中音
        pace: 中等
        pitch: 中音
    ogre:
      display_name: 食人魔
      tts:
        delivery: 粗暴凶狠而自负
        timbre: 浑厚粗粝
        pace: 沉重有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 白石子铺成的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一个樵夫和妻子生了七个男孩。老大才十岁，老幺只有七岁。家里穷得揭不开锅，孩子们又都小，谁也不能养活自己。最叫夫妻俩操心的，是那个最小的儿子。他身子弱，很少说话。旁人以为他笨，其实，他什么都听，什么都想，只是不轻易开口。他出生时还没有一根拇指大，大家便叫他小拇指。
        - id: ch01-b02
          speaker: narrator
          text: 小拇指在家里专做苦活，不管有什么麻烦，挨怪的也总是他。可七兄弟当中，偏偏是他头脑最亮，做事最稳当。后来碰上一个荒年，饥荒越来越重。父母再也看不见养活孩子的指望，竟想把七个儿子丢掉。
        - id: ch01-b03
          speaker: narrator
          text: 一天夜里，孩子们已经上床，夫妻俩还守在炉边。父亲想到接下来要说的话，心都快碎了。
        - id: ch01-b04
          speaker: father
          text: 你看，我们已经拿不出东西给孩子们吃了。我不能坐在这里，看着他们一个个饿死。明天把他们领到树林里去吧。等他们忙着捆柴，我们悄悄从小路离开，他们不会看见的。
          emotion: sad
        - id: ch01-b05
          speaker: mother
          text: 你真能亲手把孩子们带进树林，再把他们丢下吗？
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: 父亲反复说，家里已经穷到没有别的路。母亲怎么也不肯点头。她一无所有，可她是孩子们的母亲。后来，她想到七个孩子若在自己眼前活活饿死，痛苦只会更深，终于哭着答应了。
        - id: ch01-b07
          speaker: narrator
          text: 这些话，小拇指听得清清楚楚。父母刚开始商量，他便从床上溜下来，藏到父亲的座位下面。听完以后，他重新躺下，一夜没有合眼，只想着怎样救哥哥们。天一亮，他跑到溪边，把白色的小石子装满衣袋，然后若无其事地回了家。他没有把秘密告诉任何一个哥哥。
        - id: ch01-b08
          speaker: narrator
          text: 一家人走进密林。那里的树挤得那么紧，隔开十步，就看不清对面的人。父亲砍树，孩子们捡枝条捆柴。夫妻俩见他们都低头忙着，便偷偷拐进一条曲折的小路，拼命跑远了。
        - id: ch01-b09
          speaker: narrator
          text: 七个孩子发现父母不见了，全都扯开嗓子哭。小拇指却不慌。他来的时候，每走一段路，就丢下一颗白石子。回家的方向，他早已替大家留下了。
        - id: ch01-b10
          speaker: little_thumb
          text: 哥哥们，别怕。爸爸妈妈把我们留在这里了，不过我知道怎么回家。你们跟紧我就行。
          emotion: calm
        - id: ch01-b11
          speaker: narrator
          text: 哥哥们跟着小拇指，沿白石子指的路，一步步走出森林。到了家门口，谁也不敢进去。他们贴在门外，听见父母正在屋里说话。
        - id: ch01-b12
          speaker: narrator
          text: 原来夫妻俩才回家，领主就送来了十枚克朗。那是拖欠他们许久的一笔钱，他们早就不敢指望了。两个饿得发昏的人顿时有了精神。父亲让母亲马上去买肉。她太久没有好好吃过一顿，一口气买回够两个人吃三顿的分量。吃饱以后，她望着剩下的肉，想起了孩子。
        - id: ch01-b13
          speaker: mother
          text: 我们那些可怜的孩子，现在会在哪里？这些剩肉，够他们美美吃一顿了。威廉，是你非要把他们丢掉。我说过，我们一定会后悔。也许狼已经把他们吃了！你怎么忍心这样对自己的孩子？
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 她把这些话翻来覆去说了二十遍。父亲其实不比她好受，却被她责怪得再也忍不住，威胁她若不住口，就要打她。母亲仍旧伤心地哭喊。
        - id: ch01-b15
          speaker: mother
          text: 我的孩子们究竟在哪里？我那些可怜的孩子啊！
          emotion: sad
        - id: ch01-b16
          speaker: brothers
          text: 我们在这里！我们都在这里！
        - id: ch01-b17
          speaker: narrator
          text: 母亲听见门外的声音，立刻冲过去开门，把孩子们一个个抱在怀里。
        - id: ch01-b18
          speaker: mother
          text: 你们真的回来了！我太高兴了。瞧你们，又累又饿。可怜的彼得，你身上全是泥。快进屋，妈妈给你擦干净。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 彼得是长子，和母亲一样长着红头发，所以母亲最偏爱他。七个孩子坐到桌边，狼吞虎咽地吃起来，还争着诉说自己在林中有多害怕。父母看着失而复得的儿子，也满心欢喜。然而，十枚克朗一花光，这份欢喜也跟着没了。贫穷重新逼到眼前，夫妻俩又决定把孩子丢掉。这次，他们要走得比上次远得多，免得孩子再找回来。
    - id: ch02
      title: 森林深处的灯火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夫妻俩说得很小声，还是瞒不过小拇指。他打算再捡一袋石子，可清早起来一看，门上竟落了两道锁。他出不去，只能另想办法。父亲分给每个孩子一片面包当早饭。小拇指没有吃，把面包装进口袋，准备沿途撒下碎屑。
        - id: ch02-b02
          speaker: narrator
          text: 这一次，父母一直把他们带到树林最黑、最密的地方，才从一条岔路偷偷离开。小拇指相信面包屑会领他们回家，所以并不十分害怕。可是他低头一找，地上一点碎屑也没有。林中的鸟早就把面包吃光了。
        - id: ch02-b03
          speaker: narrator
          text: 孩子们越找路，走得越深。黑夜降下来，大风在树林里呼啸。他们听着四周的声响，总觉得狼正从每个方向赶来，要把他们吞掉。他们不敢说话，连回头看一眼也不敢。很快又下起暴雨，衣服全湿透了。脚下的泥又湿又滑，他们走一步摔一步，连手上也糊满泥，不知道该怎么办。
        - id: ch02-b04
          speaker: narrator
          text: 小拇指爬上一棵大树，朝森林外张望。很远的地方，终于闪出一点烛火似的微光。他赶紧爬下来，可双脚才碰到地，那点光便消失了。他很难过，却还是领着哥哥们向那个方向摸索。走了很久，他们出了树林，远处的亮光又出现了。
        - id: ch02-b05
          speaker: narrator
          text: 孩子们向灯火走去。路上每逢经过低洼地，光就会从眼前消失，吓得他们以为方向又错了。这样走走停停，他们总算到了那座房子。小拇指敲响门，一位面目和善的女人走了出来。
        - id: ch02-b06
          speaker: ogress
          text: 你们几个孩子来到这里，是想找什么？
        - id: ch02-b07
          speaker: little_thumb
          text: 我们在森林里迷路了。请您可怜可怜我们，让我们在这里住一晚吧。
        - id: ch02-b08
          speaker: narrator
          text: 女人看着七个漂亮的孩子，眼泪落了下来。
        - id: ch02-b09
          speaker: ogress
          text: 可怜的孩子们，你们从哪儿来的？这里住着一个凶狠的食人魔，他最爱吃的就是小孩子。你们知道吗？
          emotion: fearful
        - id: ch02-b10
          speaker: little_thumb
          text: 好太太，那我们还能去哪儿呢？您不让我们进屋，今晚的狼一定会吃掉我们。与其落进狼嘴里，我们宁可冒险留在这里。求您替我们说几句话，也许那位老爷会饶过我们。
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: 小拇指说话时，七兄弟都在发抖。食人魔的妻子心想，只要把他们藏好，也许能瞒到天亮。她让孩子们进门，到旺旺的炉火边取暖。火上烤着一整只羊，那正是食人魔的晚饭。
        - id: ch02-b12
          speaker: narrator
          text: 孩子们才烤暖一点，大门就传来三四下重重的敲击。食人魔回来了。妻子急忙把七个孩子塞进床底，才去给他开门。食人魔进屋便问晚饭和酒准备好没有，然后坐到桌前。羊肉还没有烤熟，他倒觉得这样更合胃口。他一面吃，一面向左右不停地嗅。
        - id: ch02-b13
          speaker: ogre
          text: 屋里有鲜肉的气味。
        - id: ch02-b14
          speaker: ogress
          text: 你闻到的准是那头小牛。我刚刚杀了它，还剥了皮。
        - id: ch02-b15
          speaker: ogre
          text: 我说有鲜肉，就一定有。屋里藏着什么，你没有告诉我。
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 食人魔恶狠狠地看着妻子，突然离开餐桌，直奔床边。他弯腰一看，就把孩子们全找到了。
        - id: ch02-b17
          speaker: ogre
          text: 原来你想骗我！我真该连你也吃了，只可惜你的肉太老。至于这些小东西，来得正是时候。再过一两天，我有三个食人魔朋友来做客，可以拿他们当好菜。
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: 食人魔把孩子们一个个拖出床底。七兄弟跪在地上苦苦求饶，他却是食人魔里最残忍的一个，哪里肯动半点恻隐之心。他已经在想他们的滋味，还吩咐妻子，到时候一定要调一份好酱汁。
        - id: ch02-b19
          speaker: narrator
          text: 他拿出一把大刀，走到孩子们面前，左手举着磨刀石，右手来回磨刀。刀锋霍霍作响。他刚抓住一个孩子，妻子便拦住他。
        - id: ch02-b20
          speaker: ogress
          text: 为什么非要今晚杀他们？明天再动手，不是一样来得及吗？
        - id: ch02-b21
          speaker: ogre
          text: 别再啰唆！现在杀掉，肉吃起来才嫩。
          emotion: angry
        - id: ch02-b22
          speaker: ogress
          text: 家里的肉已经够多了。还有一头小牛、两只羊和半头猪呢。
        - id: ch02-b23
          speaker: ogre
          text: 这倒是真的。先喂他们一顿，别让他们饿瘦了，然后送他们去睡觉。
        - id: ch02-b24
          speaker: narrator
          text: 女人听了，心里别提多高兴，赶紧给孩子们端上一顿好饭。七兄弟怕得吃不下半口。食人魔却又坐回桌边喝酒。他想到自己有了招待朋友的食物，越想越得意，一下比平时多喝了十二杯。酒全涌上头，他再也撑不住，只能上床睡觉。
    - id: ch03
      title: 金冠与小帽子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 食人魔也有七个孩子，恰好全是女儿，而且年纪都不大。女孩们脸色红润，却生着圆溜溜的灰眼睛、弯钩一样的鼻子和一张大嘴。嘴里那些牙又长又尖，彼此隔得很开。她们还没有变得和父亲一样坏，不过已经会咬别的小孩，往后的模样也就不难猜了。
        - id: ch03-b02
          speaker: narrator
          text: 七个小女食人魔早早挤在一张床上睡了，每个人头顶都戴着一顶金冠。房里另有一张同样大小的床。食人魔的妻子把七个男孩安顿在那里，自己也去睡了。
        - id: ch03-b03
          speaker: narrator
          text: 小拇指一直记着那七顶金冠。他担心食人魔会反悔，不肯等到天亮。到了半夜，他悄悄起床，收起自己和哥哥们的小帽子，再蹑手蹑脚走到女孩床边。他摘掉她们的金冠，给她们换上男孩的帽子，然后把金冠一顶顶戴在自己和哥哥们头上。黑暗中，食人魔若伸手来摸，就会把男孩当成女儿，把亲生女儿当成猎物。
        - id: ch03-b04
          speaker: narrator
          text: 果然，食人魔睡到半夜突然醒了。他后悔没有趁晚上把事情办完，跳下床便抓起大刀。
        - id: ch03-b05
          speaker: ogre
          text: 我去看看那几个小坏蛋睡得怎样。今晚动手，正好不用忙两回。
        - id: ch03-b06
          speaker: narrator
          text: 他摸黑上楼，走进女儿们的房间，先来到男孩睡的床边。哥哥们睡得很沉，只有小拇指醒着。食人魔的手从每个孩子头上摸过去。那只手落到自己头顶时，小拇指吓得几乎不能呼吸。食人魔摸见的，却是一顶顶金冠。
        - id: ch03-b07
          speaker: ogre
          text: 我差点儿干出一件漂亮事来！昨晚的酒，果然喝得太多了。
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 他又摸到另一张床，手下碰见了七顶小帽子。
        - id: ch03-b09
          speaker: ogre
          text: 好哇，你们几个快活的小子躲在这里！这回我可以放心动手了。
        - id: ch03-b10
          speaker: narrator
          text: 食人魔说完，便残忍地杀死了自己的七个女儿。他对这件事十分得意，收起刀，回到床上继续睡觉。
        - id: ch03-b11
          speaker: narrator
          text: 鼾声一响，小拇指立刻叫醒哥哥们，让他们穿好衣服，赶紧跟自己走。兄弟七人溜进花园，翻过围墙，在黑夜里不停地跑。他们一路发抖，根本分不清自己跑向了什么地方。
        - id: ch03-b12
          speaker: narrator
          text: 天亮以后，食人魔醒来，吩咐妻子上楼去替昨晚来的小坏蛋穿衣服。妻子听了十分诧异，还以为丈夫突然生出了善心。她哪会想到，这句话另有一层可怕的意思。她走进房间，眼前却是七个死去的女儿。
        - id: ch03-b13
          speaker: narrator
          text: 她当场昏倒了，这原是再自然不过的反应。食人魔等得不耐烦，自己上楼来帮忙。看见那番景象，他也惊呆了。
        - id: ch03-b14
          speaker: ogre
          text: 我究竟干了什么？那几个小畜生必须偿命，现在就得偿命！
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: 食人魔把一罐水泼到妻子脸上，等她醒转过来，马上又朝她大吼。
        - id: ch03-b16
          speaker: ogre
          text: 快拿我的七里靴来！我要追上他们！
          emotion: angry
    - id: ch04
      title: 七里靴带来的前程
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 食人魔穿上七里靴，冲到野外，朝各个方向追赶。最后，他竟来到了孩子们所在的路上。那时，七兄弟离父亲的家只差不到一百步。他们回头一看，只见食人魔每迈一步，就越过一座山。横在面前的河流再宽，他跨过去也像越过一条窄溪。
        - id: ch04-b02
          speaker: narrator
          text: 小拇指发现附近有一块空心岩石，马上让哥哥们钻进去，自己也挤在最后。他一刻不停地盯着外面，看食人魔接下来会怎样。
        - id: ch04-b03
          speaker: narrator
          text: 食人魔找了很久，始终没有收获，终于累得走不动了。七里靴虽然神奇，每一步都要耗掉穿靴人的许多力气。他想找地方坐下，偏偏选中了孩子们藏身的岩石。他实在太疲倦，很快便睡熟了。过了一阵，鼾声像雷一样响起来。孩子们听着那鼾声，心里和先前看见他举刀时一样害怕。
        - id: ch04-b04
          speaker: narrator
          text: 小拇指胆子比哥哥们大。他低声告诉大家，食人魔睡得这么沉，正是逃走的时候。哥哥们不必管他，只要一直朝家跑。大家听了他的话，很快就回到了父亲身边。
        - id: ch04-b05
          speaker: narrator
          text: 小拇指独自走近食人魔，轻轻脱下七里靴，套到自己腿上。靴子本来又粗又长，可它是仙靴，会依照主人的腿脚改变大小。一穿到小拇指脚上，它立刻变得严丝合缝，好像原本就是为他做的。
        - id: ch04-b06
          speaker: narrator
          text: 小拇指穿着靴子赶到食人魔家里。食人魔的妻子正守着死去的女儿，哭得十分伤心。
        - id: ch04-b07
          speaker: little_thumb
          text: 你的丈夫落到强盗手里了。他们把短刀架在他脖子上，说他若不交出所有金银，就马上杀了他。他看见我，求我赶来告诉你。你得把家里值钱的东西全交给我，一件也别留下，不然强盗绝不会饶他。事情紧急，他才让我穿上这双七里靴赶路。你看见靴子，就该知道我没有骗你。
        - id: ch04-b08
          speaker: narrator
          text: 女人听了大惊失色，把家里所有财物都交了出来。食人魔虽然吃小孩子，对妻子却一直是个好丈夫。小拇指带着全部钱财回到家，父母和哥哥们欢欢喜喜地迎接他。
        - id: ch04-b09
          speaker: narrator
          text: 不过，也有许多人说，事情根本不是这样。他们坚持认为，小拇指没有抢走食人魔的钱，只取走了那双七里靴。这也不算不公道，因为食人魔拿靴子只做一件事，就是追赶小孩子。讲这种说法的人还保证，自己的消息绝对可信。他们常去樵夫家吃饭喝酒，怎么会弄错呢？
        - id: ch04-b10
          speaker: narrator
          text: 按他们的说法，小拇指脱下七里靴以后，直接去了王宫。他在那里听见，国王正为远方的军队焦急。军队驻扎在两百里外，一场大战刚刚打过，胜负还没有消息。小拇指便去见国王，说只要国王需要，他能在天黑前把军情带回来。
        - id: ch04-b11
          speaker: narrator
          text: 国王答应，只要小拇指办得到，就给他一大笔钱。当天晚上，小拇指果然赶回王宫，带来了战场的消息。第一趟差事之后，他的本领传开了。从此，国王花重金请他向军中传令，许多贵妇也托他送信。凭着七里靴，小拇指想赚多少就能赚多少。
        - id: ch04-b12
          speaker: narrator
          text: 他做了一段时间的信使，挣下许多钱，终于回到父亲家中。一家人见到他，欢喜得没有言语能够形容。小拇指让父母和哥哥们从此衣食无忧，还替父亲和每个哥哥买了职位，把他们都安顿得体体面面。他自己也继续向前走，终于闯出了一条顺遂的路。
