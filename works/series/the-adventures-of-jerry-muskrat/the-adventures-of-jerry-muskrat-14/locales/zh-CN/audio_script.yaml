audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十四章　斑点龟一直向前走
      blocks:
        - id: ch01-b01
          speaker: spotty_turtle
          text: 一步、两步、三步，走呀走！四步、五步、六步，不停留！一直向前，尽力去做。别人歇脚时，也许你已赢在前头。
        - id: ch01-b02
          speaker: narrator
          text: 斑点龟沿着欢笑小溪的河床，吃力地往前爬。每当有点泄气，他就念一遍这几句话。念过以后，心里果然好受多了。
        - id: ch01-b03
          speaker: spotty_turtle
          text: 一步、两步，接着走！
        - id: ch01-b04
          speaker: narrator
          text: 他每念一步，就真的迈出一步，再迈一步。斑点龟的腿很短，所以每一步都短得可怜。可不管多短，毕竟还是朝前挪了一点。他相信，自己离要找的东西也近了一点。至少，他盼着真是这样。
        - id: ch01-b05
          speaker: narrator
          text: 欢笑小溪要是从此不再笑，微笑池塘也不再微笑，大家就只能搬到大河去住。谁都舍不得离开，尤其是青蛙曾祖父和斑点龟。
        - id: ch01-b06
          speaker: narrator
          text: 水貂比利比小水獭乔快，小乔比麝鼠杰里快，杰里比青蛙曾祖父快，青蛙曾祖父又比斑点龟快。大家都争着第一个找出麻烦，谁也不肯等身后的伙伴。斑点龟还背着自己的房子，早就远远落在最后了。可他一直没有停。
        - id: ch01-b07
          speaker: spotty_turtle
          text: 一步、两步、三步，走呀走！
        - id: ch01-b08
          speaker: narrator
          text: 什么也拦不住他。树枝挡路，他就爬过去。大石头挡路，他就绕过去。碰到一小汪水，他便游过去。这时候可轻松多了，因为他游水比走路快。
        - id: ch01-b09
          speaker: narrator
          text: 过了很久很久，他来到一汪小水潭边。阳光暖暖地落在水上，叫人真想停下来歇歇。水潭中央有块长着青苔的石头，青蛙曾祖父正坐在上面熟睡。他以为自己领先斑点龟很远，疲倦的双腿尽可以放心休息。
        - id: ch01-b10
          speaker: narrator
          text: 斑点龟也想爬到石头上，挨着他睡一觉。可他只是咧嘴笑了笑，接着往前走。
        - id: ch01-b11
          speaker: spotty_turtle
          text: 一步、两步、三步，走呀走！
        - id: ch01-b12
          speaker: narrator
          text: 青蛙曾祖父呢，还在呼呼大睡。
        - id: ch01-b13
          speaker: narrator
          text: 又过了很久很久，斑点龟走到另一汪小水潭边。麝鼠杰里正在那里忙着撬淡水蚌，撬开一个就吃一个。他光顾着享用美餐，根本没发现斑点龟。斑点龟也没有出声。虽然馋得肚子发慌，他还是继续赶路。
        - id: ch01-b14
          speaker: narrator
          text: 又过了很久很久，他来到第三汪小水潭。潭边有一道又高又光滑的岸坡。小水獭乔把那里当成了溜滑道，正一回又一回地滑进水里，玩得别提多痛快了。
        - id: ch01-b15
          speaker: narrator
          text: 斑点龟真想也滑一次，就一次。可他忍住了，连小乔都没有发现他经过。他仍旧朝前爬去。
        - id: ch01-b16
          speaker: spotty_turtle
          text: 一步、两步、三步，走呀走！
        - id: ch01-b17
          speaker: narrator
          text: 又过了很久很久，斑点龟来到一截空心木头旁。他往里面一瞧，有个人蜷成一团，睡得正香。还能是谁？当然是水貂比利。比利觉得自己领先得够远了，正好舒舒服服地歇一阵。他还真就这么歇下了。
        - id: ch01-b18
          speaker: narrator
          text: 斑点龟没有叫醒比利。他还是照着这一天的老样子，不慌不忙，一步一步地往前走。等到快活、浑圆、红彤彤的太阳先生要去紫色群山后面睡觉时，斑点龟终于找到了麻烦的根源。正是它，让欢笑小溪没了笑声，也让微笑池塘没了笑脸。
