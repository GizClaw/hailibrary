  chapters:
    - id: ch01
      title: "CHAPTER XIV: Spotty The Turtle Keeps Right On Going"
      blocks:
        - id: ch01-b01
          speaker: spotty_turtle
          text: One step, two steps, three steps, so! Four steps, five steps, six steps go! Keep right on and do your best. Mayhap you'll win while others rest.
        - id: ch01-b02
          speaker: narrator
          text: Whenever Spotty the Turtle felt a little downhearted, he repeated those words to himself. He was plodding along the bed of the Laughing Brook, and the rhyme always made him feel better. He kept saying, “One step, two steps,” and with every word, he took one more step. His legs were very short, so his steps were very short indeed. Still, every step carried him a little farther. He knew it brought him closer to what he was looking for. At least, he hoped it did.
        - id: ch01-b03
          speaker: narrator
          text: If the Laughing Brook never laughed again, and the Smiling Pool never smiled again, there was only one thing to do. Everyone would have to move down to the Big River. No one wanted that, especially Grandfather Frog and Spotty the Turtle.
        - id: ch01-b04
          speaker: narrator
          text: Billy Mink could travel faster than Little Joe Otter. Little Joe could go faster than Jerry Muskrat, Jerry could go faster than Grandfather Frog, and Grandfather Frog could go faster than Spotty. Each one wanted to find the trouble first, so no one waited for whoever was behind. Spotty had to carry his house with him, and soon he was far, far behind all the others. But he kept right on going.
        - id: ch01-b05
          speaker: spotty_turtle
          text: One step, two steps, three steps, so!
        - id: ch01-b06
          speaker: narrator
          text: Nothing could make him stop. He crawled over sticks and made his way around big stones. Now and then, he found a little pool and swam across it. He always felt better in the water because he could swim faster than he could walk.
        - id: ch01-b07
          speaker: narrator
          text: A long, long time later, Spotty reached a little pool where the warm sunshine looked very inviting. Grandfather Frog sat fast asleep on a mossy stone in the middle. He had believed he was so far ahead of Spotty that he could safely give his tired legs a rest. Spotty wanted to climb onto the stone beside him and take a nap too. But he didn't. He only grinned and went right on.
        - id: ch01-b08
          speaker: spotty_turtle
          text: One step, two steps, three steps, so!
        - id: ch01-b09
          speaker: narrator
          text: Grandfather Frog went on sleeping. After another long, long while, Spotty came to a second little pool. There was Jerry Muskrat, busy opening freshwater clams and eating them. Jerry was enjoying his meal so much that he never noticed Spotty. Spotty said nothing and kept moving, even though the sight of that feast had made him terribly hungry.
        - id: ch01-b10
          speaker: narrator
          text: A long, long time after that, Spotty reached a third little pool. It had a high, smooth bank, and Little Joe Otter had turned that bank into a slippery slide. He was having a wonderful time sliding down into the water. Spotty would have liked to take just one turn. But he didn't. He slipped by without letting Little Joe see him and kept right on going.
        - id: ch01-b11
          speaker: spotty_turtle
          text: One step, two steps, three steps, so!
        - id: ch01-b12
          speaker: narrator
          text: Much later, Spotty came upon a hollow log. He happened to peek inside and saw someone curled up, fast asleep. Who was it? Billy Mink, of course! Billy had thought he was so far ahead that he could take things easy. And that was exactly what he was doing.
        - id: ch01-b13
          speaker: narrator
          text: Spotty didn't wake him. He simply went on in the same slow way he had traveled all day.
        - id: ch01-b14
          speaker: narrator
          text: And just as jolly, round, red Mr. Sun was going to bed behind the Purple Hills, Spotty the Turtle found the cause of the trouble in the Laughing Brook and the Smiling Pool.
