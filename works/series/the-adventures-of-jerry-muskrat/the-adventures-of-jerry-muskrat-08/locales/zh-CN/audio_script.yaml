audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    mr_redwing:
      display_name: 红翼先生
      tts:
        delivery: 欢快悦耳，打趣时轻松活泼
        timbre: 明亮清脆
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第八章　青蛙曾祖父盯着自己的脚趾
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙曾祖父坐在微笑池塘边的香蒲丛里。红翼先生就在他头顶唱着歌，春天带来的欢喜塞满了他的心，仿佛随时都会涌出来。
        - id: ch01-b02
          speaker: mr_redwing
          text: 特啦啦啦哩，快看我，快看我！我的心里多欢喜！从早到晚喜洋洋，所以唱起快乐的歌儿！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 红翼先生当然快活。春天这么美，又是一年里最让人高兴的时节，快乐会悄悄钻进每一个人的心里，他怎么会不快活呢？青蛙曾祖父听着歌，点了点头。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 咕咕隆！我也很快活。
        - id: ch01-b05
          speaker: narrator
          text: 可他刚说完，眼神里就透出一丝忧虑。那忧色从鼓鼓的大眼睛一路爬到了大嘴角，原本咧开的笑容慢慢缩小，最后一点儿也不剩了。是的，一点儿也没有。他嘴上说着快活，看上去却实在不快活。
        - id: ch01-b06
          speaker: narrator
          text: 原来，青蛙曾祖父怎么也忘不了麝鼠杰里和小水獭乔说过的话。他们说，微笑池塘出了问题。青蛙曾祖父一个字也不信。至少，他一直想让自己觉得，他一个字也不信。
        - id: ch01-b07
          speaker: narrator
          text: 杰里和小乔说，池水正在越变越浅，就像到了盛夏最炎热的时候。可青蛙曾祖父活了这么久，也懂得那么多，从没听说春天会有这种事。他就是不肯相信。偏偏心里那股不踏实的感觉一直赶不走，好像真有哪里出了岔子。
        - id: ch01-b08
          speaker: narrator
          text: 忽然，他明白问题在哪儿了。刚才池水明明还没到腰间，现在却只淹着他的脚趾。可他完全不记得自己挪过地方！
        - id: ch01-b09
          speaker: grandfather_frog
          text: 一定是我没留神，挪了地方也不知道。
        - id: ch01-b10
          speaker: narrator
          text: 青蛙曾祖父低声嘟囔着，脸上的忧色却没有散。任凭他怎么努力，也没法相信那件他一心想相信的事。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 咕咕隆！有办法了。我就盯着自己的脚趾！
        - id: ch01-b12
          speaker: narrator
          text: 他蹚进池塘，等水没过双脚，便坐下来盯住脚趾。红翼先生低头一看，只见青蛙曾祖父目不转睛地瞧着自己的脚，那副模样实在好笑。他连歌也顾不上唱了，开口问道。
        - id: ch01-b13
          speaker: mr_redwing
          text: 青蛙曾祖父，你在下面做什么呀？
        - id: ch01-b14
          speaker: grandfather_frog
          text: 我在盯着自己的脚趾。
        - id: ch01-b15
          speaker: narrator
          text: 青蛙曾祖父的回答粗声粗气。红翼先生听了，却忍不住笑起来。
        - id: ch01-b16
          speaker: mr_redwing
          text: 盯着你的脚趾？呵，呵，呵！哪有这种怪事？青蛙曾祖父，你怕它们从你脚上跑掉吗？
        - id: ch01-b17
          speaker: narrator
          text: 青蛙曾祖父不回答，还是一动不动地盯着。红翼先生飞走了。他逢人便说，青蛙曾祖父变傻了，竟然坐在那里看守自己的脚趾。
        - id: ch01-b18
          speaker: narrator
          text: 太阳照得又明亮又暖和。没过多久，青蛙曾祖父那双鼓鼓的大眼睛就一眨一眨的，脑袋也开始一点一点。接下来嘛，他就睡得什么也不知道了。
        - id: ch01-b19
          speaker: narrator
          text: 过了一阵，青蛙曾祖父猛地惊醒，低头看向脚趾。脚趾哪里还泡在水里！池水早已退到老远，足足要使劲跳上一大步才能够着。
        - id: ch01-b20
          speaker: grandfather_frog
          text: 咕咕隆！微笑池塘真的出问题了！
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: 青蛙曾祖父纵身一跃，跳进水中，朝大岩石游去。
