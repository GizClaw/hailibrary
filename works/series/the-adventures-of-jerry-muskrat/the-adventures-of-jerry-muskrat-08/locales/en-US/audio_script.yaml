audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: gruff, dignified, and thoughtful
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    mr_redwing:
      display_name: Mr. Redwing
      tts:
        delivery: cheerful, musical, and teasing
        timbre: bright and ringing
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: "CHAPTER VIII: Grandfather Frog Watches His Toes"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog sat among the bulrushes at the edge of the Smiling Pool. Above him, Mr. Redwing sang as though his heart might burst with the joy of spring.
        - id: ch01-b02
          speaker: mr_redwing
          text: Tra-la-la-lee, look at me! Look at me! I'm as happy as happy can be! I'm happy all day long, and that's why I sing my glad song.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Of course Mr. Redwing was happy. Why wouldn't he be? Beautiful spring had come, the happiest season of the year, when happiness seemed to creep into every heart. Grandfather Frog listened and nodded.
        - id: ch01-b04
          speaker: grandfather_frog
          text: Chugarum! I'm happy too.
        - id: ch01-b05
          speaker: narrator
          text: But as he said it, worry slipped into his big, goggly eyes and crept down toward the corners of his mouth. Only a moment before, that mouth had been stretched wide in a smile. Now the smile slowly shrank until it vanished. No, sir, there was no smile left at all. Grandfather Frog said he was happy, but he looked decidedly unhappy.
        - id: ch01-b06
          speaker: narrator
          text: He could not forget what Jerry Muskrat and Little Joe Otter had told him. Something was wrong with the Smiling Pool. Grandfather Frog did not believe a word of it. At least, he kept trying to convince himself that he did not.
        - id: ch01-b07
          speaker: narrator
          text: They had said the water was dropping lower and lower, just as it did during the hottest part of summer. But Grandfather Frog was very old and very wise, and he had never heard of that happening in spring. He would not believe it now. Still, an uneasy feeling told him that something was wrong.
        - id: ch01-b08
          speaker: narrator
          text: Then he understood why. He had been sitting with the water halfway up his body. Now only his toes were in it, and he could not remember changing his position at all.
        - id: ch01-b09
          speaker: grandfather_frog
          text: Of course I moved without noticing what I was doing.
        - id: ch01-b10
          speaker: narrator
          text: Grandfather Frog muttered the words, but the worried look stayed on his face. Try as he might, he simply could not believe what he wanted to believe.
        - id: ch01-b11
          speaker: grandfather_frog
          text: Chugarum! I know what to do. I'll keep my eyes on my toes!
        - id: ch01-b12
          speaker: narrator
          text: He waded out until the water covered his feet. Then he sat down and began watching his toes. Mr. Redwing glanced down. Grandfather Frog looked so funny staring at his own feet that Mr. Redwing stopped singing to question him.
        - id: ch01-b13
          speaker: mr_redwing
          text: What are you doing down there, Grandfather Frog?
        - id: ch01-b14
          speaker: grandfather_frog
          text: I'm keeping watch over my toes.
        - id: ch01-b15
          speaker: narrator
          text: His answer came out gruffly, but Mr. Redwing only laughed at the strange sight.
        - id: ch01-b16
          speaker: mr_redwing
          text: You're watching your toes? Ho, ho, ho! Who ever heard of that? Do you think they might run away from you?
        - id: ch01-b17
          speaker: narrator
          text: Grandfather Frog said nothing. He went right on watching. Mr. Redwing flew off to tell everyone he met that Grandfather Frog had turned foolish and was sitting there watching his toes.
        - id: ch01-b18
          speaker: narrator
          text: The sun shone warm and bright. Before long, Grandfather Frog's big eyes began to blink. His head started to nod. And then, why, Grandfather Frog fell sound asleep.
        - id: ch01-b19
          speaker: narrator
          text: After a while, Grandfather Frog woke with a start. He looked straight down at his toes. They were not in the water at all! Indeed, the water was now a good long jump away.
        - id: ch01-b20
          speaker: grandfather_frog
          text: Chugarum! There really is something wrong with the Smiling Pool!
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: Grandfather Frog made one long leap into the water and began swimming toward the Big Rock.
