  chapters:
    - id: ch01
      title: "CHAPTER II: The Convention At The Big Rock"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jolly, round, red Mr. Sun looked down at the Smiling Pool. What he saw was so interesting that he almost forgot to keep climbing through the blue sky. And what was happening down there? The strangest convention he had ever seen was gathering at the Big Rock. Your papa might have called it a mass meeting of angry citizens, but that is a very long name. Mother Muskrat called it a convention. She ought to know, because she was the one who called everyone together.
        - id: ch01-b02
          speaker: narrator
          text: Jerry Muskrat was there, of course, along with his uncles, his aunts, and every one of his cousins. Billy Mink came with all his relations. Even old Grandfather Mink had joined them, though he had lost most of his teeth and could not hear very well.
        - id: ch01-b03
          speaker: narrator
          text: Little Joe Otter was there too. His father and mother came, and so did all the rest of the Otters, right down to his third cousins. Bobby Coon had brought every Coon he knew who had ever fished in the Smiling Pool or along the Laughing Brook. Every face looked solemn. Very solemn indeed.
        - id: ch01-b04
          speaker: narrator
          text: At last, everyone had arrived. Mother Muskrat climbed onto the Big Rock and called Jerry up beside her so the whole gathering could see him. Then she began her speech.
        - id: ch01-b05
          speaker: mother_muskrat
          text: Friends from the Smiling Pool and the Laughing Brook, I asked you to come because of what happened to my son Jerry. I want you to see it, and I need your advice.
        - id: ch01-b06
          speaker: narrator
          text: Mother Muskrat stopped and pointed at Jerry's sore tail.
        - id: ch01-b07
          speaker: mother_muskrat
          text: What do you think could have done that?
        - id: ch01-b08
          speaker: narrator
          text: Bobby Coon spoke to his neighbor. Bobby was a graceless young scamp, and he did not always treat his neighbors with the respect he should.
        - id: ch01-b09
          speaker: bobby_coon
          text: I suppose Jerry picked a fight and lost.
        - id: ch01-b10
          speaker: narrator
          text: Mother Muskrat had heard him. She glared at Bobby, then raised one hand until everyone was quiet.
        - id: ch01-b11
          speaker: mother_muskrat
          text: Friends, a trap did this. Farmer Brown's boy set it! And that trap was meant to catch you, or me, or one of our children!
          emotion: angry
        - id: ch01-b12
          speaker: mother_muskrat
          text: Our little ones are not safe playing around the Smiling Pool or beside the Laughing Brook anymore. What are we going to do?
        - id: ch01-b13
          speaker: narrator
          text: Everyone stared at everyone else in dismay. Then they all started talking at the same time. If Farmer Brown's boy had heard what they said about him, his cheeks would surely have burned. They might even have blistered.
        - id: ch01-b14
          speaker: narrator
          text: What an uproar! Every creature had a different idea, and no one would listen to anyone else. Grandfather Mink lost his temper and turned on Grandpa Otter.
        - id: ch01-b15
          speaker: grandfather_mink
          text: You are a meddling know-nothing!
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: The convention seemed ready to end in one sad quarrel. Then Mr. Coon climbed onto the Big Rock and pounded a stick until the crowd fell silent.
        - id: ch01-b17
          speaker: mr_coon
          text: We cannot agree among ourselves, so I say we tell Great-Grandfather Frog about this danger and ask what he thinks. He is very old and very wise. He can remember when the world was young. If you agree, raise your right hand.
        - id: ch01-b18
          speaker: narrator
          text: In an instant, hands filled the air, and everyone became good-natured again. It was settled. They would ask Great-Grandfather Frog for advice.
