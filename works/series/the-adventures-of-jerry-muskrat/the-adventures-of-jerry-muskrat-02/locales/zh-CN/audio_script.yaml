audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    mother_muskrat:
      display_name: 麝鼠妈妈
      tts:
        delivery: 稳重关切，责问时严肃但不失慈爱
        timbre: 温厚沉静
        pace: 从容
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 淘气顽皮，说俏皮话时带着毫不拘束的坏笑
        timbre: 明快灵巧
        pace: 稍快
        pitch: 中高音
    mr_coon:
      display_name: 浣熊先生
      tts:
        delivery: 务实稳重，主持议事时清楚而有分量
        timbre: 浑厚清晰
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　大岩石上的大会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 圆滚滚、红彤彤的太阳公公，正笑呵呵地望着微笑池塘。池塘里的事情太有趣，他差点儿忘了继续往蓝天上爬。你猜他看见了什么？大岩石上正在开一场从没见过的稀奇大会。你爸爸也许会管它叫“愤怒居民群众集会”。这个名字可真够长的！麝鼠妈妈说，这是大会。既然人是她召集来的，当然该听她的。
        - id: ch01-b02
          speaker: narrator
          text: 麝鼠杰瑞来了，他的叔叔婶婶、姑姑姨姨，还有所有表亲堂亲也来了。水貂比利带来了全家亲戚，就连牙齿掉了大半、耳朵不太灵光的水貂老爷爷也没有缺席。
        - id: ch01-b03
          speaker: narrator
          text: 小水獭乔跟爸爸妈妈一起来了。他家的亲戚从近到远，连隔了三层的远亲都到了。浣熊博比也把认识的浣熊全叫了来。这些浣熊都曾在微笑池塘或欢笑溪边捉过鱼。大家的脸色一个比一个严肃。
        - id: ch01-b04
          speaker: narrator
          text: 等最后一位到场，麝鼠妈妈爬上大岩石，又让杰瑞站在身边，好叫大家都看清楚。接着，她开口了。
        - id: ch01-b05
          speaker: mother_muskrat
          text: 微笑池塘和欢笑溪的朋友们，我请大家来，是要让你们看看我儿子杰瑞出了什么事，也想请各位帮忙拿个主意。
        - id: ch01-b06
          speaker: narrator
          text: 麝鼠妈妈停下来，指了指杰瑞受伤的尾巴。
        - id: ch01-b07
          speaker: mother_muskrat
          text: 你们想想，这伤是谁弄的？
        - id: ch01-b08
          speaker: narrator
          text: 浣熊博比凑到邻居身旁，低声说了一句。
        - id: ch01-b09
          speaker: bobby_coon
          text: 准是杰瑞跟谁打了一架，结果没打赢吧。
        - id: ch01-b10
          speaker: narrator
          text: 博比就是这么个没规矩的小淘气，对邻居也不总是那么尊重。偏偏这句话让麝鼠妈妈听见了。她狠狠瞪了博比一眼，又抬起一只手，让大家安静下来。
        - id: ch01-b11
          speaker: mother_muskrat
          text: 朋友们，杰瑞碰上的是捕兽夹！那是布朗农夫家的男孩设下的。他想捉住你们，捉住我们，还想捉住我们的孩子！
        - id: ch01-b12
          speaker: narrator
          text: 麝鼠妈妈说得十分严肃。
        - id: ch01-b13
          speaker: mother_muskrat
          text: 从今以后，小家伙们在微笑池塘边不能安心玩，到欢笑溪沿岸也不能安心玩。大家说，我们该怎么办？
        - id: ch01-b14
          speaker: narrator
          text: 众人顿时慌了神，你看看我，我看看你。下一刻，所有人一齐嚷起来。要是布朗农夫家的男孩听见那些话，脸颊一定会烧得通红，说不定还会烫出水泡呢！
        - id: ch01-b15
          speaker: narrator
          text: 场面乱成一团。每个人都有自己的主意，却没有谁肯听别人的。水貂老爷爷发了火，骂水獭爷爷爱管闲事，还是个什么都不懂的糊涂蛋。眼看这场大会就要吵得不欢而散，浣熊先生爬上大岩石，拿木棍敲了几下，请大家听他说。
        - id: ch01-b16
          speaker: mr_coon
          text: 我有个提议。既然谁也说服不了谁，我们就把这个危险从头到尾告诉青蛙曾祖父，请他来拿主意。他活了很久，懂得也多，还记得世界年轻时候的事。赞成的，请举起右手。
        - id: ch01-b17
          speaker: narrator
          text: 一眨眼，空中到处都是举起的手。大家又和和气气了。于是，大伙儿一致同意，请青蛙曾祖父来帮忙商议。
