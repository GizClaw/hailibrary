audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰瑞
      tts:
        delivery: 年轻自信，逞强时神气十足，受惊后显出稚气
        timbre: 明亮灵活
        pace: 偏快
        pitch: 中高音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 热心直爽，提醒朋友时干脆利落
        timbre: 轻快清脆
        pace: 稍快
        pitch: 高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
    mother_muskrat:
      display_name: 麝鼠妈妈
      tts:
        delivery: 稳重关切，责问时严肃但不失慈爱
        timbre: 温厚沉静
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　麝鼠杰瑞吓坏了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 麝鼠妈妈说起布朗农夫家的男孩和捕兽夹时，到底叮嘱过什么？麝鼠杰瑞坐在大岩石边上，晃着脚后跟，怎么也想不起来。妈妈说话时，他满脑子都是别的事，根本没有认真听。何况他总觉得，妈妈常常紧张过了头。
        - id: ch01-b02
          speaker: jerry_muskrat
          text: 呸！难道我离开妈妈就没法照顾自己了？布朗农夫家的男孩不过是在微笑池塘边放几个捕兽夹，有什么可怕的？他骗不了杰瑞大叔。他自以为聪明，可我随时都能耍他！
        - id: ch01-b03
          speaker: narrator
          text: 杰瑞得意地笑了。他还记得，自己有一次把布朗农夫家的男孩骗得真以为鱼钩上咬住了一条大鳟鱼。
        - id: ch01-b04
          speaker: narrator
          text: 他慢慢滑进微笑池塘，朝最喜欢的老木头游去。兔子彼得从岸边探出头来，远远地叫住了他。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 嗨，杰瑞！昨晚我看见布朗农夫家的男孩往这边走，手里带着好多捕兽夹。你千万留神！
        - id: ch01-b06
          speaker: jerry_muskrat
          text: 你还是操心自己吧，兔子彼得。我用不着别人提醒。
        - id: ch01-b07
          speaker: narrator
          text: 杰瑞的口气有点儿不耐烦。彼得冲他做了个怪相，转身去找那片香甜的苜蓿地。彼得刚走得没影，水貂比利和浣熊博比就一起顺着欢笑溪赶来。他俩一副急切的样子，看见杰瑞，连忙招手叫他过去。杰瑞一到跟前，他们便同时说起布朗农夫家的男孩，还有那些捕兽夹。
        - id: ch01-b08
          speaker: billy_mink
          text: 杰瑞，你可一定要当心。
        - id: ch01-b09
          speaker: narrator
          text: 水貂比利去过许多地方，见过的事情也多，这话说得很认真。
        - id: ch01-b10
          speaker: jerry_muskrat
          text: 噢，我自己完全应付得来。
        - id: ch01-b11
          speaker: narrator
          text: 杰瑞满不在乎地丢下这句话，又游向那根老木头。可他游着游着，心里想的却是：捕兽夹到底长什么样？方才话说得那么神气，其实连该防着什么，他都不知道。
        - id: ch01-b12
          speaker: narrator
          text: 快到老木头时，一股香味钻进鼻子，挠得他直发痒。杰瑞停下来闻了又闻。真香啊！气味好像就是从老木头上飘来的。他立刻加快速度，没多久便爬了上去。杰瑞揉了三次眼睛，才敢相信自己没看错。眼前竟摆着一块又一块鲜嫩多汁的胡萝卜。
        - id: ch01-b13
          speaker: narrator
          text: 杰瑞最爱的就是胡萝卜。他哪里还顾得上想，这些美味为什么会出现在这里？他抓起最近的一块吃掉，又把下一块也吃了。高兴之下，他还跳了一支滑稽的小舞。一直跳到喘不过气，才坐下来休息。
        - id: ch01-b14
          speaker: narrator
          text: 就在这时，只听咔嚓一声，有个东西死死夹住了杰瑞的尾巴！他疼得尖叫，也吓坏了。他拼命扭动身体，却怎么也挣不开，回头又瞧不见夹住自己的究竟是什么。
        - id: ch01-b15
          speaker: narrator
          text: 杰瑞只好用力往前拉，一下又一下，尾巴简直快被扯掉了。幸好尾巴没有断。他接着使劲，那个东西忽然松开了。杰瑞收不住身子，一头栽进水里。
        - id: ch01-b16
          speaker: narrator
          text: 回到家以后，麝鼠妈妈替他包扎好疼痛的尾巴，然后板起脸问他。
        - id: ch01-b17
          speaker: mother_muskrat
          text: 我跟你说过捕兽夹的事，你还记得吗？
        - id: ch01-b18
          speaker: narrator
          text: 杰瑞一下子不哭了。
        - id: ch01-b19
          speaker: jerry_muskrat
          text: 原来刚才那个就是捕兽夹吗？
        - id: ch01-b20
          speaker: narrator
          text: 问完这句话，他才想起，自己当时只顾着害怕，连那东西一眼也没看。
        - id: ch01-b21
          speaker: jerry_muskrat
          text: 唉，就算今天再遇见一个，我还是认不出它呀。
