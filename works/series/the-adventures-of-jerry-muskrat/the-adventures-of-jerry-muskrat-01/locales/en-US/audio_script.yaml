  chapters:
    - id: ch01
      title: "CHAPTER I: Jerry Muskrat Has A Fright"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What had Mother Muskrat told him about Farmer Brown's boy and those traps? Jerry Muskrat sat on the edge of the Big Rock, kicking his heels and trying to remember. The truth was, he had barely listened. His mind had been somewhere else. And besides, Jerry thought Mother Muskrat worried over far too many things.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: Pooh! I can take care of myself without hanging on to my mother's apron strings. So what if Farmer Brown's boy is putting traps around the Smiling Pool? He can't fool your Uncle Jerry. He thinks he's smart, but I can outwit him any day.
        - id: ch01-b03
          speaker: narrator
          text: Jerry puffed out his chest and chuckled. He was remembering the time he had fooled Farmer Brown's boy into believing there was a big trout on his hook.
        - id: ch01-b04
          speaker: narrator
          text: Then Jerry slipped slowly into the Smiling Pool and headed for his favorite log. Peter Rabbit poked his head over the bank.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Hey, Jerry! I saw Farmer Brown's boy coming this way last night with a whole lot of traps. You'd better be careful!
        - id: ch01-b06
          speaker: jerry_muskrat
          text: Oh, go chase yourself, Peter Rabbit. I know how to look after myself.
        - id: ch01-b07
          speaker: narrator
          text: Jerry sounded a little cross. Peter pulled a face and set off toward the sweet clover patch.
        - id: ch01-b08
          speaker: narrator
          text: Peter had hardly disappeared when Billy Mink and Bobby Coon came down the Laughing Brook together. Both of them looked terribly excited. The moment they spotted Jerry, they waved him over. As soon as he reached them, they began talking at the same time. They had both come to warn him about Farmer Brown's boy and his traps.
        - id: ch01-b09
          speakers: [billy_mink, bobby_coon]
          ensemble: duo
          text: Farmer Brown's boy has brought traps to the Smiling Pool!
        - id: ch01-b10
          speaker: billy_mink
          text: You really need to watch out, Jerry.
        - id: ch01-b11
          speaker: narrator
          text: Billy Mink knew what he was talking about. He traveled widely and had plenty of experience.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: Oh, I'm perfectly able to take care of myself.
        - id: ch01-b13
          speaker: narrator
          text: Jerry tossed off the answer as if none of it mattered, then started once more toward his favorite log.
        - id: ch01-b14
          speaker: narrator
          text: But what do you think was going through his mind as he swam? For all his bragging, Jerry wished he knew what a trap looked like. He did not even know what he was supposed to watch for.
        - id: ch01-b15
          speaker: narrator
          text: As he came close to the old log, a smell tickled his nose. Jerry stopped and sniffed, then sniffed again. My, it smelled good! And it seemed to be coming straight from the log. He swam as fast as he could and soon scrambled up onto it.
        - id: ch01-b16
          speaker: narrator
          text: Jerry rubbed his eyes once, twice, three times, just to make sure. Right there in front of him lay several delicious pieces of carrot.
        - id: ch01-b17
          speaker: narrator
          text: There was nothing Jerry Muskrat liked better than carrot. He never stopped to ask how it had gotten there. He reached for the nearest piece and ate it. Then he took the next piece and ate that one too.
        - id: ch01-b18
          speaker: narrator
          text: Jerry was so delighted that he did a funny little dance. When he ran out of breath, he sat down to rest.
        - id: ch01-b19
          speaker: narrator
          text: Snap! Something caught Jerry Muskrat by the tail. He squealed from fright and pain. Oh, how it hurt! He twisted one way and then the other, but something held him tight, and he could not see what it was.
        - id: ch01-b20
          speaker: narrator
          text: Jerry pulled and pulled until he thought his tail might come right off. It did not. He kept on pulling. Then the thing suddenly let go, and Jerry tumbled headfirst into the water.
        - id: ch01-b21
          speaker: narrator
          text: When Jerry finally got home, Mother Muskrat tended his sore tail.
        - id: ch01-b22
          speaker: mother_muskrat
          text: What did I tell you about traps?
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: She spoke severely, and Jerry stopped crying.
        - id: ch01-b24
          speaker: jerry_muskrat
          text: Was that thing a trap?
        - id: ch01-b25
          speaker: narrator
          text: Then Jerry realized that he had been too frightened even to look at it.
        - id: ch01-b26
          speaker: jerry_muskrat
          text: Oh, dear. If I came across one today, I still wouldn't know what it was.
          emotion: sad
