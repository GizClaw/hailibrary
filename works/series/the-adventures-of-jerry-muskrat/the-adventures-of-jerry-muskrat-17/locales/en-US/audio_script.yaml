  chapters:
    - id: ch01
      title: "CHAPTER XVII: Who Had Made The Strange Pond?"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Who had made the strange pond? Spotty the Turtle wanted to know, and so did Billy Mink. Little Joe Otter, Jerry Muskrat, and Grandfather Frog wondered the same thing when they arrived. High in the blue, blue sky, Ol' Mistah Buzzard looked down and wondered too.
        - id: ch01-b02
          speaker: narrator
          text: It was strange indeed. There had never been a pond in that part of the Green Forest. Even when Sister South Wind melted the snow so quickly that the Laughing Brook spilled over its banks and the Smiling Pool grew twice as large as it should, no pond had ever formed there.
        - id: ch01-b03
          speaker: narrator
          text: Someone must have made it. Spotty had known that from the moment he saw the pond. In a flash, he understood why the wall of logs, brush, and mud crossed the Laughing Brook. It stopped the water from flowing downstream.
        - id: ch01-b04
          speaker: narrator
          text: If the water could no longer run and laugh on its way to the Smiling Pool, it had nowhere to go. It would stand still, spread farther, and become a pond. Of course! Spotty felt very proud when he worked that out all by himself.
        - id: ch01-b05
          speaker: narrator
          text: For a long time, no one said a word. They all sat on the wall. At last, Spotty spoke.
        - id: ch01-b06
          speaker: spotty_turtle
          text: This wall we're sitting on is what made the pond.
        - id: ch01-b07
          speaker: billy_mink
          text: Well, imagine that! However did you figure it out? Are you absolutely sure the pond didn't make the wall?
        - id: ch01-b08
          speaker: narrator
          text: Spotty knew Billy was teasing him. But Spotty was too good-natured to get angry over such a small thing. He tried to think of a clever answer. Spotty was as slow at thinking as he was at walking, and Billy began again before an answer came to him.
        - id: ch01-b09
          speaker: billy_mink
          text: Farmer Brown's boy calls this kind of wall a dam. I've seen plenty of places in my travels, and dams are built to stop water from going where it isn't wanted or to send it where someone does want it. But who would want a pond way back here in the Green Forest? What could it be for? Grandfather Frog, who do you think built this dam?
        - id: ch01-b10
          speaker: narrator
          text: Grandfather Frog shook his head. He stared at the new pond, and his big, goggly eyes looked more goggly than ever.
        - id: ch01-b11
          speaker: grandfather_frog
          text: I don't know. I truly don't know what to think.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: Why, it had to be Farmer Brown's boy, or else Farmer Brown himself.
        - id: ch01-b13
          speaker: little_joe_otter
          text: Of course it was.
        - id: ch01-b14
          speaker: narrator
          text: Little Joe spoke as though he knew everything about it. But Grandfather Frog still shook his head. He did not seem to agree.
        - id: ch01-b15
          speaker: grandfather_frog
          text: I don't know. It just doesn't look that way to me.
        - id: ch01-b16
          speaker: narrator
          text: Billy Mink ran along the top of the dam and down the far side. He studied the whole thing with his sharp little eyes. Then he came back.
        - id: ch01-b17
          speaker: billy_mink
          text: Grandfather Frog is right. This doesn't look like something Farmer Brown or his boy built. But if they didn't build it, who did? Who else could have done it?
        - id: ch01-b18
          speaker: grandfather_frog
          text: I don't know.
        - id: ch01-b19
          speaker: narrator
          text: This time, Grandfather Frog sounded lost in thought. Spotty looked at him. Grandfather Frog's face had the faraway look it always wore when he told stories about the days when the world was young.
        - id: ch01-b20
          speaker: grandfather_frog
          text: I don't know, but this looks very much like the work of...
        - id: ch01-b21
          speaker: narrator
          text: Grandfather Frog stopped in the middle of his sentence and turned toward Jerry Muskrat. Then he spoke so sharply that Jerry nearly lost his balance in surprise.
        - id: ch01-b22
          speaker: grandfather_frog
          text: Jerry Muskrat, has your big cousin come down from the North?
