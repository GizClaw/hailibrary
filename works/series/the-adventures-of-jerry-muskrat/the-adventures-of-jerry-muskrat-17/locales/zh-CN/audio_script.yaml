audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　是谁造出了这个怪池塘？
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这个怪池塘究竟是谁造的？斑点龟想知道，水貂比利也想知道。小水獭乔、麝鼠杰里和青蛙曾祖父赶来以后，心里想的也是这件事。就连老秃鹫先生从湛蓝湛蓝的高空往下看，也弄不明白。
        - id: ch01-b02
          speaker: narrator
          text: 这事真是奇怪透了。绿森林这一带从来没有过池塘。哪怕南风姐姐飞快地融掉积雪，欢笑小溪涨出两岸，微笑池塘大到平时的两倍，这里也没有池塘。
        - id: ch01-b03
          speaker: narrator
          text: 所以，眼前这个池塘肯定是谁造出来的。斑点龟一见到它，马上想明白了。横在欢笑小溪上的那堵墙，是用圆木、树枝和泥巴筑成的。它把溪水拦住，不让水继续往下流。
        - id: ch01-b04
          speaker: narrator
          text: 溪水没法一路流着、笑着，赶去微笑池塘，只能留在这里。水越积越多，就成了池塘。除此之外，它还能怎么办呢？这全是斑点龟自己想通的，他心里可得意了。
        - id: ch01-b05
          speaker: narrator
          text: 大家半天没有说话。后来，斑点龟终于开了口。
        - id: ch01-b06
          speaker: spotty_turtle
          text: 原来是我们坐着的这堵墙，把池塘造出来了。
        - id: ch01-b07
          speaker: billy_mink
          text: 是吗？你到底怎么猜出来的？你真能肯定，不是池塘反过来造了这堵墙？
        - id: ch01-b08
          speaker: narrator
          text: 斑点龟听得出来，比利在拿他开玩笑。不过，他的脾气一向温厚，不会为了这点小事发火。他很想回一句机灵话，可他走路慢，想事情也慢。还没想好该说什么，比利已经又开口了。
        - id: ch01-b09
          speaker: billy_mink
          text: 布朗农夫家的男孩说，这种墙叫水坝。我去过不少地方，知道人们为什么筑坝。有时是不让水流到不该去的地方，有时是要把水送去需要它的地方。
        - id: ch01-b10
          speaker: billy_mink
          text: 可我就不懂了，谁会想在绿森林这么偏远的地方弄个池塘？这个池塘又有什么用？青蛙曾祖父，你觉得这道坝是谁筑的？
        - id: ch01-b11
          speaker: narrator
          text: 青蛙曾祖父摇摇头，盯着绿森林里的新池塘。他那双本来就鼓鼓的大眼睛，这会儿好像鼓得更厉害了。
        - id: ch01-b12
          speaker: grandfather_frog
          text: 我不知道。我真想不出该怎么解释。
        - id: ch01-b13
          speaker: jerry_muskrat
          text: 那还用说？准是布朗农夫家的男孩干的，要不就是布朗农夫自己。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 对，肯定是他们。
        - id: ch01-b15
          speaker: narrator
          text: 小水獭乔说得像是什么都知道。可青蛙曾祖父还是摇头。他显然不赞成。
        - id: ch01-b16
          speaker: grandfather_frog
          text: 我不知道，真的不知道。我看着可不像他们干的。
        - id: ch01-b17
          speaker: narrator
          text: 水貂比利从坝顶一路跑过去，又下到背面。他用那双锐利的小眼睛，把整道坝从头到尾查看了一遍，然后跑了回来。
        - id: ch01-b18
          speaker: billy_mink
          text: 青蛙曾祖父说得没错。这不是布朗农夫的手艺，也不像他家男孩造的。可要不是他们，那会是谁？还有谁造得出这样的水坝？
        - id: ch01-b19
          speaker: grandfather_frog
          text: 我不知道。
        - id: ch01-b20
          speaker: narrator
          text: 青蛙曾祖父的声音听起来像是在出神。斑点龟望着他，发现他的目光已经落到了远方。每次要讲世界还年轻时的旧故事，青蛙曾祖父都会露出这样的神情。
        - id: ch01-b21
          speaker: grandfather_frog
          text: 我不知道。不过照我看，这道坝很像是……
        - id: ch01-b22
          speaker: narrator
          text: 话还没说完，青蛙曾祖父突然停住，转头看向麝鼠杰里。接着，他猛地问了一句，杰里吃了一惊，差点没站稳。
        - id: ch01-b23
          speaker: grandfather_frog
          text: 麝鼠杰里，你那位住在北方的大表亲到这里来了吗？
