  chapters:
    - id: ch01
      title: "CHAPTER XIX: Jerry Muskrat Has A Busy Day"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There stood the strange pond in the Green Forest. There stood the dam that had made it, built from logs, sticks, and mud. But the one who had built that dam was nowhere to be seen. Billy Mink, Little Joe Otter, Jerry Muskrat, Grandfather Frog, and Spotty the Turtle looked this way and that. They looked as hard as they could, but found no one. It was very queer. The longer they wondered about it, the stranger it seemed.
        - id: ch01-b02
          speaker: grandfather_frog
          text: One thing is certain. Whoever made this dam didn't give a single thought to anyone living in the Laughing Brook or the Smiling Pool. That builder is selfish, just plain everyday selfish! As long as this dam stops the water, the Laughing Brook cannot laugh and the Smiling Pool cannot smile. So...
        - id: ch01-b03
          speaker: narrator
          text: Grandfather Frog stopped there and looked at his four friends.
        - id: ch01-b04
          speaker: billy_mink
          text: So what do we do?
        - id: ch01-b05
          speaker: grandfather_frog
          text: We tear into this dam. We have to open a way for the water to get through.
        - id: ch01-b06
          speakers: [little_joe_otter, billy_mink, jerry_muskrat, spotty_turtle]
          ensemble: chorus
          text: Of course! That's exactly what we should do!
        - id: ch01-b07
          speaker: narrator
          text: Little Joe looked at Billy. Billy looked at Jerry. Jerry looked at Spotty. Then all four stared at Grandfather Frog and asked the same question together.
        - id: ch01-b08
          speakers: [little_joe_otter, billy_mink, jerry_muskrat, spotty_turtle]
          ensemble: chorus
          text: But how can we do it?
        - id: ch01-b09
          speaker: narrator
          text: Grandfather Frog scratched his head and studied the dam for a long while. At last, a wide smile spread across his big mouth.
        - id: ch01-b10
          speaker: grandfather_frog
          text: Why, it's easy. Jerry knows how to dig, so he'll make a big opening near the bottom. The rest of us will stand watch and make sure nothing harms him.
        - id: ch01-b11
          speakers: [little_joe_otter, billy_mink, spotty_turtle]
          ensemble: chorus
          text: Yes! That's the way to do it!
        - id: ch01-b12
          speaker: narrator
          text: Jerry did not think that plan was fair at all. It left every bit of the real work to him. But then he thought about his dear Smiling Pool. It would be terrible if the pool never smiled again. So Jerry did not complain. Without another word, he went straight to work.
        - id: ch01-b13
          speaker: narrator
          text: Now, Jerry Muskrat was a fine worker. He had dug many long tunnels into the bank all around the Smiling Pool. A hole through this dam seemed like a job he knew how to do, and he had no doubt it would be finished soon. But Jerry had hardly begun when he ran into real trouble. Yes, sir, it was real trouble.
        - id: ch01-b14
          speaker: narrator
          text: You see, this dam was made mostly of sticks instead of mud. Jerry could not simply dig his way in as he did in the soft bank around the Smiling Pool. Every few minutes, another stick blocked his path. He had to stop his digging and gnaw that stick apart before he could go on.
        - id: ch01-b15
          speaker: narrator
          text: It was hard work, the hardest kind of hard work. But Jerry Muskrat never gave up because a job was difficult. The harder the work became, the more determined he was to finish it.
        - id: ch01-b16
          speaker: narrator
          text: So Jerry worked and worked and worked. Meanwhile, Grandfather Frog sat on one end of the dam. He pretended to keep watch, but he was really taking a nap in the warm sunshine. Spotty the Turtle sat on the other end of the dam, and before long, he was doing exactly the same thing. Billy Mink and Little Joe Otter were supposed to be watching too. Instead, they swam around the strange pond and enjoyed themselves while Jerry kept working.
        - id: ch01-b17
          speaker: narrator
          text: At last, jolly, round, red Mr. Sun began to sink behind the Purple Hills. Just then, Jerry broke through into the strange pond. Water poured into the Laughing Brook, and once again the brook began to run.
