audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十九章　麝鼠杰里忙碌的一天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里的怪池塘还在，那道用圆木、树枝和泥巴筑成的水坝也还在。可水貂比利、小水獭乔、麝鼠杰里、青蛙曾祖父和斑点龟找来找去，始终不见筑坝的人。这事实在古怪。他们越想越不明白，只好一会儿瞧瞧这边，一会儿望望那边。
        - id: ch01-b02
          speaker: grandfather_frog
          text: 有件事倒是再清楚不过。不管是谁筑了这道坝，他根本没替欢笑小溪和微笑池塘里的伙伴着想。他就是自私，普普通通、彻头彻尾的自私！水都叫大坝拦住了，欢笑小溪怎么笑？微笑池塘又怎么露出笑脸？所以……
        - id: ch01-b03
          speaker: narrator
          text: 青蛙曾祖父忽然住了口，转头看了看身边的四位朋友。
        - id: ch01-b04
          speaker: billy_mink
          text: 所以到底该怎么样？
        - id: ch01-b05
          speaker: narrator
          text: 水貂比利已经等得不耐烦了。
        - id: ch01-b06
          speaker: grandfather_frog
          text: 所以，我们得把水坝弄坏，开出一个缺口，好让水重新流过去。
        - id: ch01-b07
          speakers: [little_joe_otter, billy_mink, jerry_muskrat, spotty_turtle]
          ensemble: chorus
          text: 对呀！就得这么办！
        - id: ch01-b08
          speaker: narrator
          text: 四个伙伴喊完，小水獭乔先看看水貂比利，比利又看看麝鼠杰里，杰里接着望向斑点龟。到最后，他们一起把目光对准了青蛙曾祖父。
        - id: ch01-b09
          speakers: [little_joe_otter, billy_mink, jerry_muskrat, spotty_turtle]
          ensemble: chorus
          text: 可我们究竟要怎么做？
        - id: ch01-b10
          speaker: narrator
          text: 青蛙曾祖父一边挠头，一边对着那道圆木、树枝和泥巴筑成的水坝琢磨了半天。慢慢地，他的大嘴越咧越开，终于露出一个大大的笑容。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 嗨，办法简单得很。杰里会打洞，就让他在靠近坝底的地方凿个大洞。我们几个在旁边守着，别让危险靠近他。
        - id: ch01-b12
          speakers: [little_joe_otter, billy_mink, spotty_turtle]
          ensemble: chorus
          text: 这个办法好！
        - id: ch01-b13
          speaker: narrator
          text: 小水獭乔、水貂比利和斑点龟都很赞成，杰里心里却不大服气。真正的苦活，全落到他一个人身上了。可他一想到亲爱的微笑池塘，想到它也许再也笑不起来，便一句话也没说，马上动手干了起来。
        - id: ch01-b14
          speaker: narrator
          text: 麝鼠杰里一向很会干活。他在微笑池塘四周的岸坡里挖过许多长地道，当然觉得自己很快就能把这道坝挖穿。没想到，他刚开始就碰上了麻烦。对，先生，是真正的麻烦。
        - id: ch01-b15
          speaker: narrator
          text: 原来，这道坝大部分是树枝，泥巴并不多。杰里没法像挖岸坡那样一直往里掘。每过几分钟，他都得停下来，把拦在前面的树枝一根一根啃断。
        - id: ch01-b16
          speaker: narrator
          text: 这活儿太辛苦了，简直是最难干的苦活。可杰里有股不服输的劲儿，事情越难，他越是非做成不可。
        - id: ch01-b17
          speaker: narrator
          text: 青蛙曾祖父坐在水坝的一头，嘴上说是替杰里守望，其实晒着暖洋洋的太阳，很快便打起了盹。斑点龟坐在另一头，做的也是同一件事。
        - id: ch01-b18
          speaker: narrator
          text: 水貂比利和小水獭乔呢？他们在怪池塘里游来游去，玩得别提多快活了。只有麝鼠杰里还在干，干呀，干呀，一刻也不停。
        - id: ch01-b19
          speaker: narrator
          text: 后来，快活、滚圆、红彤彤的太阳先生开始往紫山背后落下。就在这时候，杰里终于挖穿了水坝，洞口通进了怪池塘。
        - id: ch01-b20
          speaker: narrator
          text: 水从洞里流了出去，又一次奔进欢笑小溪。欢笑小溪终于重新流淌起来了。
