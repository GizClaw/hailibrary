audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十八章　麝鼠杰里的大表亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 叮叮咚咚，嘀哩嘟噜！哪儿见过这么一团糊涂？嘟噜嘀哩，咚咚叮叮！谁能把谜底说个分明？
        - id: ch01-b02
          speaker: narrator
          text: 欢笑小溪就在这里，却不笑了。微笑池塘也还在，却没了笑脸。绿森林里冒出一个崭新的深水池塘，还有一道圆木、灌木和泥巴筑成的水坝。谁筑的？谁也没见过。青蛙曾祖父偏偏又问麝鼠杰里，他那位大表亲是不是从北方来了。可杰里连自己有这么一位亲戚都不知道。
        - id: ch01-b03
          speaker: narrator
          text: 这个问题来得太突然，杰里惊得愣了好一会儿。等他总算回过神来，说话都结巴了。
        - id: ch01-b04
          speaker: jerry_muskrat
          text: 我……我根本没有什么大表亲呀。
          emotion: surprised
        - id: ch01-b05
          speaker: grandfather_frog
          text: 咕咕隆！
        - id: ch01-b06
          speaker: narrator
          text: 青蛙曾祖父说话的口气满是轻蔑，杰里听了，只觉得自己一下子矮了半截，简直小得不能再小。
        - id: ch01-b07
          speaker: grandfather_frog
          text: 咕咕隆！你在北方当然有一位大表亲。麝鼠杰里，你不会连这个都不知道吧？
        - id: ch01-b08
          speaker: narrator
          text: 杰里只得承认，他对那位大表亲确实一无所知。不过，青蛙曾祖父既然说有，那就一定错不了。他年纪很大，又很有智慧，世上的事情知道得可多了。即便如此，杰里还是觉得难以相信。自己真会有一位从来没听人提过的大表亲吗？
        - id: ch01-b09
          speaker: jerry_muskrat
          text: 青蛙曾祖父，您……您见过他吗？
        - id: ch01-b10
          speaker: grandfather_frog
          text: 没见过！我一次也没见过他，可他的事情我全知道。你这位大表亲是个了不起的干活能手，像我们现在坐着的这种水坝，他就会造。
        - id: ch01-b11
          speaker: billy_mink
          text: 我不信！麝鼠杰里的表亲才造不出这样的水坝。你们看看最底下那根大树干！除了布朗农夫和他家男孩，谁能把它拖到这儿来？青蛙曾祖父，您一定是糊涂了，彻彻底底糊涂了。
        - id: ch01-b12
          speaker: narrator
          text: 水貂比利有时候就是这样，一点儿也不尊敬青蛙曾祖父。
        - id: ch01-b13
          speaker: grandfather_frog
          text: 咕咕隆！我年纪确实大了，可还没老到学不会东西，不像有些人。还有，我几时说过那根树干是拖来的？
        - id: ch01-b14
          speaker: narrator
          text: 青蛙曾祖父一边说，一边狠狠瞪着水貂比利。
        - id: ch01-b15
          speaker: billy_mink
          text: 您是没说。可它要不是拖来的，又怎么会跑到这里？您不是聪明得很吗？那就告诉我呀！
        - id: ch01-b16
          speaker: narrator
          text: 青蛙曾祖父眨了眨两只鼓鼓的大眼睛，那神情仿佛在替比利惋惜。
        - id: ch01-b17
          speaker: grandfather_frog
          text: 水貂比利，你的眼睛又亮又尖，只可惜一直没学会怎么用。那棵树根本不是拖来的。有人把它砍断，让它正好倒在现在躺着的地方。你自己看看那边的树桩。
        - id: ch01-b18
          speaker: narrator
          text: 青蛙曾祖父指了指留下的树桩。比利一看，这才知道他说得没错。
        - id: ch01-b19
          speaker: narrator
          text: 可比利和许多人一样，非要抢到最后一句话才甘心。他忽然大笑起来。
        - id: ch01-b20
          speaker: billy_mink
          text: 哈，哈，哈！呵，呵，呵！呵，呵，呵！哈，哈，哈！
          emotion: happy
        - id: ch01-b21
          speaker: grandfather_frog
          text: 到底有什么这么好笑？
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 青蛙曾祖父最受不了别人笑话他，这下真生气了。
        - id: ch01-b23
          speaker: billy_mink
          text: 难道除了布朗农夫和他家男孩，还有谁砍得倒那么粗的大树？砍树跟把树拖到这里一样难呀。
        - id: ch01-b24
          speaker: grandfather_frog
          text: 麝鼠杰里那位从北方来的大表亲就能办到，而且我相信，这棵树正是他砍的。现在，我们已经知道欢笑小溪和微笑池塘为什么出了问题。接下来该怎么办呢？
