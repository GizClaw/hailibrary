audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: gruff, dignified, and thoughtful
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: earnest, curious, and good-natured
        timbre: light and clear
        pace: moderate
        pitch: medium-high
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: quick, teasing, and self-assured
        timbre: bright and lively
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: "CHAPTER XVIII: Jerry Muskrat's Big Cousin"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Fiddle, faddle, feedle, fuddle! Was there ever such a muddle? Fuddle, feedle, faddle, fiddle! Who is there to solve the riddle?
        - id: ch01-b02
          speaker: narrator
          text: The Laughing Brook was no longer laughing, and the Smiling Pool was no longer smiling. A brand-new pond lay deep in the Green Forest. Across it stood a wall of logs, bushes, and mud. It was a dam, but no one had seen who built it. Then Grandfather Frog asked Jerry Muskrat whether his big cousin had come down from the North. Jerry did not even know he had a big cousin.
        - id: ch01-b03
          speaker: jerry_muskrat
          text: I... I don't have any big cousin.
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: Jerry had finally recovered enough from the question to answer.
        - id: ch01-b05
          speaker: grandfather_frog
          text: Chugarum!
        - id: ch01-b06
          speaker: narrator
          text: Grandfather Frog said it with such scorn that Jerry felt very small.
        - id: ch01-b07
          speaker: grandfather_frog
          text: Chugarum! Of course you have a big cousin up North. Are you telling me you truly didn't know that, Jerry Muskrat?
        - id: ch01-b08
          speaker: narrator
          text: Jerry had to admit that he knew nothing at all about this cousin. Still, if Grandfather Frog said the cousin existed, then it must be true. Grandfather Frog was very old and very wise, and he knew a great deal. Even so, Jerry found it hard to believe he had a big cousin. He had never heard anyone mention such a cousin before.
        - id: ch01-b09
          speaker: jerry_muskrat
          text: Have you... have you ever seen him, Grandfather Frog?
        - id: ch01-b10
          speaker: grandfather_frog
          text: No! I haven't seen him, but I know all about him. This big cousin of yours is a great worker. He builds dams just like the one we're sitting on.
        - id: ch01-b11
          speaker: narrator
          text: Grandfather Frog snapped out his answer.
        - id: ch01-b12
          speaker: billy_mink
          text: I don't believe a word of it! A cousin of Jerry's couldn't build anything like this dam. Just look at that enormous tree trunk underneath it. Nobody but Farmer Brown or his boy could drag it here. Grandfather Frog, you're crazy. Plain crazy!
        - id: ch01-b13
          speaker: narrator
          text: Billy Mink could be very disrespectful to Grandfather Frog sometimes.
        - id: ch01-b14
          speaker: grandfather_frog
          text: Chugarum! I may be pretty old, but I'm not too old to learn. Some folks seem to be.
        - id: ch01-b15
          speaker: narrator
          text: Grandfather Frog stared hard at Billy Mink.
        - id: ch01-b16
          speaker: grandfather_frog
          text: Did I say anyone dragged that tree trunk here?
        - id: ch01-b17
          speaker: billy_mink
          text: No. But then how did the tree get here? You're the clever one, Grandfather Frog. Go on, explain that!
        - id: ch01-b18
          speaker: narrator
          text: Grandfather Frog blinked his great goggly eyes at Billy. He looked as if he felt very, very sorry for him.
        - id: ch01-b19
          speaker: grandfather_frog
          text: Billy Mink, your eyes are bright and sharp. It's a great pity you never learned to use them. Nobody dragged that tree here. It was cut so it would fall exactly where it lies.
        - id: ch01-b20
          speaker: narrator
          text: Grandfather Frog pointed toward the tree stump. Billy looked, and he saw that Grandfather Frog was right. But Billy was like many other people. He dearly loved to have the last word, so all at once he began to laugh.
        - id: ch01-b21
          speaker: billy_mink
          text: Ha, ha, ha! Ho, ho, ho! Ho, ho, ho! Ha, ha, ha!
          emotion: happy
        - id: ch01-b22
          speaker: grandfather_frog
          text: What is so funny?
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: Grandfather Frog snapped again. Nothing made him as angry as being laughed at.
        - id: ch01-b24
          speaker: billy_mink
          text: Do you really think anyone except Farmer Brown or his boy could bring down such a big tree? Cutting it down would be every bit as hard as hauling it here!
        - id: ch01-b25
          speaker: grandfather_frog
          text: Jerry Muskrat's big cousin from the North could do it, and I believe he did. Now we've found what caused the trouble in the Laughing Brook and the Smiling Pool. What are we going to do about it?
