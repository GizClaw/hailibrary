audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成持重，故作威严时带着一点诙谐
        timbre: 粗厚低沉
        pace: 缓慢
        pitch: 低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 淘气顽皮，说俏皮话时带着毫不拘束的坏笑
        timbre: 明快灵巧
        pace: 稍快
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四章　青蛙曾祖父的妙计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西风婆婆领着快乐小微风，从紫山那边下来了。快活、圆滚滚、红彤彤的太阳公公也摘下睡帽，开始慢慢往蓝天上爬。就在这时候，青蛙曾祖父登上了微笑池塘里的大岩石。
        - id: ch01-b02
          speaker: narrator
          text: 天还很早，可住在欢笑溪沿岸和微笑池塘周围的小动物，一个不少，都在等他。浣熊博比已经找到了两只布朗农夫家的男孩布下的捕兽夹，水貂比利又差一点踩进第三只。大家再也不敢放心了，偏偏谁也不知道该怎么办，只能等青蛙曾祖父出主意。你知道，大伙儿都说他聪明得不得了。
        - id: ch01-b03
          speaker: narrator
          text: 青蛙曾祖父先清了清嗓子。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 咕呱隆！布朗农夫家的男孩究竟放了多少捕兽夹，你们得一只不漏，全找出来。
        - id: ch01-b05
          speaker: bobby_coon
          text: 可我们该怎么把它们找出来？
        - id: ch01-b06
          speaker: grandfather_frog
          text: 当然是睁大眼睛去找。
        - id: ch01-b07
          speaker: narrator
          text: 青蛙曾祖父回答得很不耐烦。博比一下子难为情起来，悄悄溜到妈妈身后，把自己藏了起来。
        - id: ch01-b08
          speaker: grandfather_frog
          text: 浣熊和水貂都去搜欢笑溪两岸，麝鼠和水獭则去搜微笑池塘岸边。不光要仔细看，还要仔细闻。要是以前从没找到过食物的地方，忽然冒出了好吃的，马上当心！鼻子刚闻到人的气味，也马上当心！
        - id: ch01-b09
          speaker: grandfather_frog
          text: 水貂比利，你身子小，跑得快，眼睛也尖。你留在大岩石上，等着布朗农夫家的男孩。等他一来，你就躲进香蒲丛。你能瞧见他，他却瞧不见你。
        - id: ch01-b10
          speaker: grandfather_frog
          text: 他绕着微笑池塘走也好，顺着欢笑溪走也好，你都跟在后面。这样一来，他还不知道有人盯着呢，就会亲自领你找到每一只捕兽夹。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 等夹子全找齐了，就朝每一只里面扔根树枝，或者扔块石头，让它啪地合上。这样，它们就伤不到谁了。然后，再把夹子深深埋进泥里。
        - id: ch01-b12
          speaker: grandfather_frog
          text: 不过，你们记住，夹子还没全部合上以前，谁也不准吃那些食物。要不然，说不定反倒会把自己送进夹子里。
        - id: ch01-b13
          speaker: grandfather_frog
          text: 等所有夹子都收拾好了，大家再把旁边那些好吃的带到大岩石来，热热闹闹地吃上一大顿，不好吗？
        - id: ch01-b14
          speaker: little_joe_otter
          text: 青蛙曾祖父万岁！这个办法太棒啦！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 小水獭乔兴奋地高声欢呼，还在水里翻了个跟头。大家全都赞成他的话，当场商量起一场搜寻捕兽夹的大行动。
        - id: ch01-b16
          speaker: narrator
          text: 麝鼠和水獭立刻出发，沿着微笑池塘的岸边寻找。浣熊和水貂也赶往欢笑溪，只有比利留了下来。
        - id: ch01-b17
          speaker: narrator
          text: 比利爬到大岩石上放哨。青蛙曾祖父呢，又慢悠悠地游回那片宽大的绿睡莲叶。他要在那里等几只傻乎乎的绿苍蝇自己送上门，好给他当早餐。
