  chapters:
    - id: ch01
      title: "CHAPTER IV: Grandfather Frog's Plan"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Morning came to the Smiling Pool. Old Mother West Wind and her Merry Little Breezes swept down from the Purple Hills. Jolly, round, red Mr. Sun tossed away his nightcap and started his daily climb through the blue sky. At that very moment, Great-Grandfather Frog climbed onto the Big Rock.
        - id: ch01-b02
          speaker: narrator
          text: He was early, but all the little people from the Laughing Brook and the Smiling Pool were already waiting. Bobby Coon had discovered two traps set by Farmer Brown's boy, and Billy Mink had nearly stepped into a third. Nobody felt safe now. Nobody knew what to do. So they had come for advice from Great-Grandfather Frog, whom everyone believed to be very, very wise.
        - id: ch01-b03
          speaker: narrator
          text: Grandfather Frog cleared his throat.
        - id: ch01-b04
          speaker: grandfather_frog
          text: Chugarum! You must find every trap Farmer Brown's boy has set.
        - id: ch01-b05
          speaker: bobby_coon
          text: But how can we find them?
        - id: ch01-b06
          speaker: grandfather_frog
          text: You find them by looking for them.
        - id: ch01-b07
          speaker: narrator
          text: Grandfather Frog answered sharply. Bobby Coon felt foolish and slipped behind his mother, where no one could see him.
        - id: ch01-b08
          speaker: grandfather_frog
          text: Every Coon and every Mink must search the banks of the Laughing Brook. Every Muskrat and every Otter must search the banks of the Smiling Pool. Use your eyes, and use your noses. If you find something good to eat in a place where you have never found food before, be careful! If you catch even the first whiff of man-smell, be careful!
        - id: ch01-b09
          speaker: grandfather_frog
          text: Billy Mink, you are small and quick, and you have sharp eyes. Stay here on the Big Rock until Farmer Brown's boy comes. Then hide among the bulrushes. You must be able to watch him without letting him see you. Follow him wherever he goes around the Smiling Pool and along the Laughing Brook. He will not know it, but he will lead you to every hidden trap.
        - id: ch01-b10
          speaker: grandfather_frog
          text: Once you have found all the traps, drop a stick or a stone into each one. That will make it spring, so it cannot hurt anyone. After that, bury it deep in the mud. Do not eat any of the food before every trap has been sprung. If you do, you may be caught.
        - id: ch01-b11
          speaker: grandfather_frog
          text: And when the traps are all sprung, gather up the good things you find beside them. Why not bring everything here to the Big Rock and have a grand feast?
        - id: ch01-b12
          speaker: little_joe_otter
          text: Hurrah for Grandfather Frog! What a wonderful plan!
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: Little Joe Otter shouted and turned a somersault in the water. Everyone agreed with him. At once, they began planning a grand hunt for the traps that Farmer Brown's boy had set.
        - id: ch01-b14
          speaker: narrator
          text: The Muskrats and the Otters went off to search the banks of the Smiling Pool. The Coons and the Minks headed for the Laughing Brook, with Billy Mink staying behind. Billy climbed onto the Big Rock to keep watch.
        - id: ch01-b15
          speaker: narrator
          text: Grandfather Frog slowly swam back to his big green lily pad. There he settled down to wait for some foolish green flies to become his breakfast.
