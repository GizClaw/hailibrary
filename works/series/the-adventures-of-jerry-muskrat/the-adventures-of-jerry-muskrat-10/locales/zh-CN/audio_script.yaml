audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十章　杰里为何觉得世界颠倒了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 微笑池塘已经笑不出来了。麝鼠杰里坐在池塘的大岩石上，双手抱着疼痛的脑袋。他想啊想，一遍又一遍地想，想得脑袋都快裂开了。可是费了这么多心思，他还是和一开始一样，什么也没想明白。在杰里眼里，他的小小世界已经乱了套。没错，简直整个儿颠倒了，他完全不明白怎么会变成这样。
        - id: ch01-b02
          speaker: narrator
          text: 微笑池塘、欢笑小溪和绿草原，就是杰里的整个世界。他从大岩石上望出去，绿草原依旧美丽，看不出一点变化。可欢笑小溪不笑了，微笑池塘也不微笑了。小溪和池塘剩下的水实在太少，已经笑不出声，也露不出笑脸。
        - id: ch01-b03
          speaker: narrator
          text: 这太可怕了。杰里望着那座曾令自己无比自豪的家。为了住得安全，他特意把门口修在水下。除了能潜水的比利水貂和小水獭乔，谁也到不了那里。杰里原先住在里面，觉得再安全不过。如今池塘缩得太小，整座房子都露在水外。门口明明白白地摆在那里，无论谁想进去，都能进去。
        - id: ch01-b04
          speaker: narrator
          text: 更糟的是，杰里还有一处最隐秘的秘密，如今也藏不住了。大山核桃树的根底下有一座城堡，一条长隧道通向那里。从前，只有杰里知道隧道的秘密入口在哪儿。可现在，那个入口就摆在大家眼前，全世界谁来看，都能看得见。
        - id: ch01-b05
          speaker: narrator
          text: 岸下那些奇妙的洞穴、地洞和藏身处，也全暴露了。过去，它们的洞口一直没在水下，所以只有麝鼠杰里、比利水貂和小水獭乔知道那些地方。现在，每一个洞口都清清楚楚地露着，谁都能找到。
        - id: ch01-b06
          speaker: narrator
          text: 从前池水含着笑，荡起一圈圈涟漪。杰里现在望见的，却只有烂泥。烂泥，烂泥，到处都是烂泥！香蒲的脚原本泡在水里，如今只踩着正在飞快干裂的泥。睡莲叶拖着长长的叶柄，摊在泥地上，叶边卷起了一半，看上去病得很重，很重。
        - id: ch01-b07
          speaker: narrator
          text: 杰里转头看向欢笑小溪。溪床中央只剩一股细得不能再细的水流，正慢慢往下淌。这里一洼，那里一洼，小水坑里挤满了惊慌的鳟鱼和小鱼。欢笑小溪的秘密也和微笑池塘的秘密一样，全都暴露了。杰里知道，现在要找比利水貂的藏身处太容易了。他只要沿着欢笑小溪一路走上去，一路看过去，就能全都找到。
        - id: ch01-b08
          speaker: jerry_muskrat
          text: 没错，整个世界真的颠倒了。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 杰里的声音听起来十分哀伤。青蛙曾祖父正待在大岩石脚下仅剩的一小洼水里。他抬起头，看着杰里。
        - id: ch01-b10
          speaker: grandfather_frog
          text: 嗯，我也觉得世界颠倒了。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 它肯定颠倒了！可它以后还会不会重新正过来呢？
        - id: ch01-b12
          speaker: grandfather_frog
          text: 要是再也正不过来，你准备怎么办？
        - id: ch01-b13
          speaker: jerry_muskrat
          text: 我也不知道。你看，小水獭乔和比利水貂过来了。咱们问问他们有什么打算吧。
