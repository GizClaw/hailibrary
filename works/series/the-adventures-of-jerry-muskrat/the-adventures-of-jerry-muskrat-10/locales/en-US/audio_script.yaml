  chapters:
    - id: ch01
      title: "CHAPTER X: Why The World Seemed Upside Down To Jerry Muskrat"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jerry Muskrat sat on the Big Rock in the Smiling Pool, though the pool was not smiling anymore. He held his aching head in both hands. He had thought and thought until it felt as if his head might split. Yet after all that thinking, he understood no more than he had at the start. Jerry's little world had gone topsy-turvy. Yes, sir, it seemed to him that the whole world had turned upside down, and he could not make sense of it at all.
        - id: ch01-b02
          speaker: narrator
          text: Jerry's little world was made up of the Smiling Pool, the Laughing Brook, and the Green Meadows. From the Big Rock, he looked all around. The Green Meadows were just as lovely as ever. He could see no change there. But the Laughing Brook had stopped laughing, and the Smiling Pool had stopped smiling. The truth was, too little of the brook remained for it to laugh, and too little of the pool remained for it to smile.
        - id: ch01-b03
          speaker: narrator
          text: It was dreadful. Jerry looked across at the house he had once been so proud of. He had built its doorway under the water. That had made him feel perfectly safe, because only Billy Mink or Little Joe Otter could swim underwater and reach him. Now the Smiling Pool had shrunk so much that Jerry's house stood out of the water. Anyone who wished to go inside could do it. The doorway was there in plain sight.
        - id: ch01-b04
          speaker: narrator
          text: Worse than that, the secret entrance to the long tunnel beneath the roots of the Big Hickory-tree was showing. The tunnel led to Jerry's castle. That entrance had been Jerry's most secret secret, and now the whole world could see it. The same thing had happened to all the wonderful caves, holes, and hiding places under the bank. Only Jerry Muskrat, Billy Mink, and Little Joe Otter had known about them, because their openings had always been underwater. Now those openings were easy for anyone to find.
        - id: ch01-b05
          speaker: narrator
          text: Where smiling, dimpling water had always been, Jerry saw nothing but mud. Mud, mud, mud was everywhere. The bulrushes had always stood with their feet in the water. Now their feet were only in mud, and even that mud was drying fast. The lily pads lay on the mud at the ends of their long stems. Their edges had curled halfway up, and they looked very, very sick.
        - id: ch01-b06
          speaker: narrator
          text: Jerry turned toward the Laughing Brook. Only a teeny, weeny trickle of water ran down its middle. Here and there was a tiny pool packed with frightened trout and minnows. Every secret of the Laughing Brook was uncovered, just like every secret of the Smiling Pool. Jerry knew he could find Billy Mink's hiding places now. All he had to do was walk up the Laughing Brook and look.
        - id: ch01-b07
          speaker: jerry_muskrat
          text: Yes, sir. The whole world really has turned upside down.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Jerry's voice was mournful. Grandfather Frog looked up from the little bit of water that remained at the foot of the Big Rock.
        - id: ch01-b09
          speaker: grandfather_frog
          text: I believe you're right. It has.
        - id: ch01-b10
          speaker: jerry_muskrat
          text: I know I'm right! But will the world ever turn right side up again?
        - id: ch01-b11
          speaker: grandfather_frog
          text: And if it doesn't, what will you do then?
        - id: ch01-b12
          speaker: jerry_muskrat
          text: I don't know. Here come Little Joe Otter and Billy Mink. Let's ask what they plan to do.
