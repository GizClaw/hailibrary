audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 坦率友善，沉稳中带着北方来客的爽朗
        timbre: 宽厚结实
        pace: 从容
        pitch: 中低音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十四章　快快活活回家去
      blocks:
        - id: ch01-b01
          speaker: jerry_muskrat
          text: 欢笑小溪真欢畅，我也一样喜洋洋！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷说，他也一样快活。大家都知道，斑点龟也是满心欢喜。
        - id: ch01-b03
          speaker: narrator
          text: 不久前，绿森林里的树还泡在那个怪池塘里。如今池水退去了，树根全都湿漉漉地露了出来。海狸帕迪筑起的水坝上，多了一个大洞。这个洞，正是帕迪亲手挖开的。
        - id: ch01-b04
          speaker: narrator
          text: 溪水重新在两岸之间深深地流着，欢笑声传遍了绿森林。青蛙爷爷、麝鼠杰里和斑点龟心里也都笑开了。微笑池塘马上就会再露出笑脸，他们也能平平安安、快快乐乐地回家了。
        - id: ch01-b05
          speaker: narrator
          text: 还有一位也在笑。你猜是谁？当然是海狸帕迪。他笑得最开心，因为正是他把快乐送还给了大家。
        - id: ch01-b06
          speaker: jerry_muskrat
          text: 斑点龟，上山来水坝这里，你赶在了我前头。可回微笑池塘去，你绝对赢不了我！
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 斑点龟听了，只是好脾气地笑笑。
        - id: ch01-b08
          speaker: spotty_turtle
          text: 那你一路上可别停下来吃东西，也别只顾着玩，更不能睡觉。我会不停地往前走。我早就发现了，想走到一个地方，只有一直走才行。
        - id: ch01-b09
          speaker: grandfather_frog
          text: 大家一起顺着溪水回去吧。哪段路不好走，我们还能彼此搭把手。
        - id: ch01-b10
          speaker: narrator
          text: 杰里一想到青蛙爷爷和斑点龟也能帮自己的忙，就笑得肚子发疼，不得不捂住两肋。不过杰里脾气随和，还是答应跟大家一起走。帕迪也要同行，于是四位伙伴出发了。杰里和帕迪并排游在前头，青蛙爷爷和斑点龟跟在后面。
        - id: ch01-b11
          speaker: narrator
          text: 斑点龟在岸上走得很慢，在水里可没那么慢。没过多久，落在后面的反而成了青蛙爷爷。他很会跳水，也能一下子游得很快，可他游不远，很快便会累。
        - id: ch01-b12
          speaker: narrator
          text: 青蛙爷爷喘得呼哧呼哧的，离伙伴们越来越远。斑点龟回头一看，他正从一道小瀑布上头朝下翻过去。再浮上来时，他呛得直喘，两条长腿也蹬不动了。
        - id: ch01-b13
          speaker: narrator
          text: 斑点龟爬上一块岩石，在那里等着，又把青蛙爷爷拉了上来。等青蛙爷爷终于把气喘匀，斑点龟竟让他骑到自己背上，就这么驮着他继续赶路。
        - id: ch01-b14
          speaker: narrator
          text: 杰里和帕迪都是游水的好手，早已游得不见影了。忽然，杰里想起大家明明说好要一起回去。他回头找了又找，哪儿也看不见青蛙爷爷和斑点龟，心里便有点过意不去。于是，他和帕迪停下来等候。
        - id: ch01-b15
          speaker: narrator
          text: 他们仿佛等了很久，才看见一个奇怪的东西在水上一浮一沉，慢慢朝这边过来。
        - id: ch01-b16
          speaker: paddy_beaver
          text: 那是青蛙爷爷！
        - id: ch01-b17
          speaker: jerry_muskrat
          text: 不对，明明是斑点龟。
        - id: ch01-b18
          speaker: paddy_beaver
          text: 哈，是他们两个！
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 帕迪笑了起来。恰在这时，斑点龟没看见前面还有一道瀑布，一下子翻了下去。青蛙爷爷当然也跟着栽进水里，再也抓不住斑点龟的背了。
        - id: ch01-b20
          speaker: paddy_beaver
          text: 我想到办法啦！
        - id: ch01-b21
          speaker: jerry_muskrat
          text: 什么办法？
        - id: ch01-b22
          speaker: paddy_beaver
          text: 让青蛙爷爷坐到我的扁尾巴上。这样我就得游慢一点，斑点龟也能跟上我们了。
        - id: ch01-b23
          speaker: narrator
          text: 就这样，第一缕月光刚刚亲吻微笑池塘，一支世上最快乐的队伍便从欢笑小溪里游了出来。
        - id: ch01-b24
          speaker: grandfather_frog
          text: 恰格朗！回家的滋味真好。不过，要是出门时总能把海狸帕迪的尾巴当小船坐，我倒真愿意常常出去走走。
          emotion: happy
