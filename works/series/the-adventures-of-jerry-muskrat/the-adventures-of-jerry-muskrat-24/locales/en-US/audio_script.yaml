  chapters:
    - id: ch01
      title: "CHAPTER XXIV: A Merry Home-Going"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Laughing Brook was merry, and Jerry cried that he was merry too. Grandfather Frog said he felt the same. Everyone knew that Spotty was merry as well.
        - id: ch01-b02
          speaker: narrator
          text: The trees stood with wet feet in the Green Forest. Only a little while before, Paddy the Beaver's strange pond had covered the ground around them. Now a great hole stood open in the dam, and Paddy himself had made it.
        - id: ch01-b03
          speaker: narrator
          text: The laughter of the Laughing Brook rang through the forest as the water once again ran deep between its banks. Grandfather Frog, Jerry Muskrat, and Spotty the Turtle had laughter in their hearts too. The Smiling Pool would smile again, and they could go home happy and at peace.
        - id: ch01-b04
          speaker: narrator
          text: Someone else laughed with them. Who was it? Paddy the Beaver, of course. His laugh was the best of all, because he had brought happiness to the others.
        - id: ch01-b05
          speaker: jerry_muskrat
          text: You reached the dam before I did, Spotty, but you won't get back to the Smiling Pool before me!
        - id: ch01-b06
          speaker: narrator
          text: Spotty laughed and took the challenge in good humor.
        - id: ch01-b07
          speaker: spotty_turtle
          text: Then you'd better not pause for food or fun or a nap. I plan to keep moving the whole way. That's the only way I've found to get anywhere.
        - id: ch01-b08
          speaker: grandfather_frog
          text: Let's all make the trip together. When we reach a difficult place, we can help one another across.
        - id: ch01-b09
          speaker: narrator
          text: The thought of Grandfather Frog or Spotty helping him made Jerry laugh so hard that he had to hold his sides. Still, Jerry was good-natured, and he agreed that they would all travel together. Paddy said he would come too.
        - id: ch01-b10
          speaker: narrator
          text: So the four friends set out. Jerry Muskrat and Paddy the Beaver swam side by side. Grandfather Frog and Spotty the Turtle followed behind them.
        - id: ch01-b11
          speaker: narrator
          text: Spotty traveled very slowly on land, but he was not nearly so slow in the water. Before long, Grandfather Frog was the one who could not keep up. He could dive wonderfully and swim fast for a short way, but he soon grew tired.
        - id: ch01-b12
          speaker: narrator
          text: Soon Grandfather Frog was puffing and blowing. He fell farther and farther behind. After a while, Spotty looked back and saw him tumble headfirst over a little waterfall. Grandfather Frog came up choking and gasping, and his long legs could hardly kick.
        - id: ch01-b13
          speaker: narrator
          text: Spotty climbed onto a rock and waited. He helped Grandfather Frog out of the water and up beside him. Once Grandfather Frog could breathe again, Spotty did something you might not expect. He put Grandfather Frog on his back and started forward once more.
        - id: ch01-b14
          speaker: narrator
          text: Jerry Muskrat and Paddy the Beaver were such strong swimmers that they soon disappeared from sight. Then Jerry suddenly remembered their promise to travel home together. When he looked back and could see neither Grandfather Frog nor Spotty, he felt a little mean inside.
        - id: ch01-b15
          speaker: narrator
          text: Jerry and Paddy stopped to wait. A long while seemed to pass. At last, they spotted something odd bobbing along through the water.
        - id: ch01-b16
          speaker: paddy_beaver
          text: That's Grandfather Frog!
          emotion: surprised
        - id: ch01-b17
          speaker: jerry_muskrat
          text: No, that's Spotty the Turtle!
          emotion: surprised
        - id: ch01-b18
          speaker: paddy_beaver
          text: Why, it's both of them!
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: Paddy began to laugh. At that very moment, Spotty went over another waterfall that he had not noticed. Grandfather Frog tumbled with him and lost his grip on Spotty's back.
        - id: ch01-b20
          speaker: paddy_beaver
          text: I've got an idea!
        - id: ch01-b21
          speaker: jerry_muskrat
          text: What are you thinking?
        - id: ch01-b22
          speaker: paddy_beaver
          text: Grandfather Frog can use my flat tail as a boat. Then we'll move slowly enough for Spotty to stay with us.
        - id: ch01-b23
          speaker: narrator
          text: And that is what they did. The first moonbeams were kissing the Smiling Pool when the merriest party anyone had ever seen came swimming out of the Laughing Brook.
        - id: ch01-b24
          speaker: grandfather_frog
          text: Chugarum! It is good to be home. I might travel more often if I could always use Paddy the Beaver's tail for a boat.
          emotion: happy
