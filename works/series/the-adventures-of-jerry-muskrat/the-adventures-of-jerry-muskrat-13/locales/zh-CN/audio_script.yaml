audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    ol_mistah_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠闲随和，带着亲切的乡土口吻
        timbre: 沙哑醇厚
        pace: 舒缓
        pitch: 中低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十三章　老秃鹫先生看见了什么
      blocks:
        - id: ch01-b01
          speaker: little_joe_otter
          text: 比利，等等我呀！
        - id: ch01-b02
          speaker: narrator
          text: 可水貂比利急着赶路，压根儿没有停下，反倒越跑越快。
        - id: ch01-b03
          speaker: jerry_muskrat
          text: 小乔，你也等等我！
        - id: ch01-b04
          speaker: narrator
          text: 小水獭乔同样急得很。他不但没等麝鼠杰里，脚下还跑得更快了。
        - id: ch01-b05
          speaker: grandfather_frog
          text: 杰里，等等我！
        - id: ch01-b06
          speaker: narrator
          text: 麝鼠杰里也只顾往前赶。他没有等青蛙曾祖父，反而加快了脚步。
        - id: ch01-b07
          speaker: spotty_turtle
          text: 青蛙曾祖父，请等等我！
        - id: ch01-b08
          speaker: narrator
          text: 可青蛙曾祖父也忙着赶路。他顾不上身后的斑点龟，一跳比一跳快。
        - id: ch01-b09
          speaker: narrator
          text: 就这样，跑的跑，走的走，跳的跳，爬的爬。水貂比利、小水獭乔、麝鼠杰里、青蛙曾祖父和斑点龟，沿着欢笑小溪匆匆赶往上游。他们都想弄明白，小溪为什么再也笑不出来了。
        - id: ch01-b10
          speaker: narrator
          text: 在他们头顶上，老秃鹫先生正飞过湛蓝湛蓝的高空。他也在寻找那场麻烦。就是这场麻烦，夺走了欢笑小溪的笑声，也叫微笑池塘没了笑脸。
        - id: ch01-b11
          speaker: narrator
          text: 老秃鹫先生的眼睛尖得很。他从高空往下一望，绿色草原和绿色森林里发生的事，差不多都能看清。他还有一双宽大的翅膀。只要他想快，转眼就能飞出去老远。
        - id: ch01-b12
          speaker: narrator
          text: 这一看，他发现水貂比利不肯等小水獭乔。可小乔也不肯等麝鼠杰里，杰里又不肯等青蛙曾祖父。就连青蛙曾祖父，都把慢吞吞的斑点龟丢在了后面。大家只顾自己赶路，谁也不肯等一等后面的伙伴。
        - id: ch01-b13
          speaker: ol_mistah_buzzard
          text: 我还是赶紧飞到前头，自己把麻烦查明白，再回来告诉龟兄弟吧。这样一来，他可就省下好大一番力气了。水貂兄弟不肯等他。要是他反而比水貂兄弟先知道欢笑小溪出了什么事，那才叫活该呢。
        - id: ch01-b14
          speaker: narrator
          text: 话音一落，老秃鹫先生便朝绿色森林深处飞去。欢笑小溪正是从那个方向流出来的。他远远越过水貂比利，没过几分钟，已经把比利甩在后面老远。那段距离，正好和比利领先斑点龟的距离一样远。
        - id: ch01-b15
          speaker: narrator
          text: 翅膀总比双腿快得多。
        - id: ch01-b16
          speaker: narrator
          text: 不论赶路是为了什么，都是这样。
        - id: ch01-b17
          speaker: narrator
          text: 要是一心去做件好事，那双翅膀更会飞得加倍迅疾，也不会疲倦。
        - id: ch01-b18
          speaker: narrator
          text: 所以，最先查清欢笑小溪为何不再欢笑、微笑池塘为何不再微笑的，正是老秃鹫先生。可真相就在眼前时，他吃惊得把斑点龟忘了，也忘了自己本该飞回去报信。他满脑子只剩下惊讶，一连眨了好多次眼睛，好确认自己不是在做梦。
        - id: ch01-b19
          speaker: narrator
          text: 接着，他绕着绿色森林一圈又一圈地盘旋，不住地朝树丛里张望，嘴里还把同一句话说了一遍又一遍。
        - id: ch01-b20
          speaker: ol_mistah_buzzard
          text: 你见过这种事吗？反正我从没见过！你见过这种事吗？反正我从没见过！
          emotion: surprised
