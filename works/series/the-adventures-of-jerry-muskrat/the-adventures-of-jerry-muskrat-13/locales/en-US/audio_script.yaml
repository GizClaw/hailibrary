  chapters:
    - id: ch01
      title: "CHAPTER XIII: Ol' Mistah Buzzard Sees Something"
      blocks:
        - id: ch01-b01
          speaker: little_joe_otter
          text: Billy Mink, wait for me!
        - id: ch01-b02
          speaker: narrator
          text: Little Joe called after him, but Billy was in too much of a hurry. He only ran faster.
        - id: ch01-b03
          speaker: jerry_muskrat
          text: Little Joe, wait for me!
        - id: ch01-b04
          speaker: narrator
          text: Jerry called after Little Joe. But Little Joe was rushing too, and he only ran faster.
        - id: ch01-b05
          speaker: grandfather_frog
          text: Jerry Muskrat, wait for me!
        - id: ch01-b06
          speaker: narrator
          text: Grandfather Frog called after Jerry. Jerry was in such a hurry that he only walked faster.
        - id: ch01-b07
          speaker: spotty_turtle
          text: Grandfather Frog, please wait for me!
        - id: ch01-b08
          speaker: narrator
          text: Spotty called after him, but Grandfather Frog was in too much of a hurry. He only jumped faster.
        - id: ch01-b09
          speaker: narrator
          text: And so they hurried up the Laughing Brook, each in his own way. Billy Mink and Little Joe ran. Jerry walked. Grandfather Frog jumped, and Spotty the Turtle crawled. They all wanted to learn why the brook had stopped laughing. High above them, in the blue, blue sky, Ol' Mistah Buzzard sailed along. He, too, was looking for the trouble that had taken the laugh from the Laughing Brook and the smile from the Smiling Pool.
        - id: ch01-b10
          speaker: narrator
          text: Ol' Mistah Buzzard had very sharp eyes. Even from far up in the sky, he could see a great deal. He could watch everything happening down on the Green Meadows and in the Green Forest. His broad wings could carry him swiftly through the air whenever he chose.
        - id: ch01-b11
          speaker: narrator
          text: As he looked down, he saw Billy selfishly racing ahead instead of waiting for Little Joe. Little Joe wouldn't wait for Jerry. Jerry wouldn't wait for Grandfather Frog, and Grandfather Frog wouldn't wait for Spotty.
        - id: ch01-b12
          speaker: ol_mistah_buzzard
          text: Ah reckon Ah'll hurry on and find that trouble mahself. Then Ah'll fly back and tell Brer Turtle. It'll save him a powerful lot of work. And it'll serve Brer Mink right if Brer Turtle learns first what's wrong with the Laughing Brook.
        - id: ch01-b13
          speaker: narrator
          text: With that, Ol' Mistah Buzzard shot far ahead over the Green Forest. He flew toward the part of the forest where the Laughing Brook begins. It took him only a few minutes to get as far ahead of Billy Mink as Billy was ahead of Spotty the Turtle.
        - id: ch01-b14
          speaker: narrator
          text: Wings are much swifter than legs, whatever the journey may be. But wings on a kindly errand are swifter still, and they never seem to tire.
        - id: ch01-b15
          speaker: narrator
          text: That was how Ol' Mistah Buzzard became the first to discover what had stopped the Laughing Brook from laughing and the Smiling Pool from smiling.
        - id: ch01-b16
          speaker: narrator
          text: But what he found surprised him so much that he forgot his plan to fly back and tell Spotty. He forgot everything except his own great surprise. He blinked again and again, making sure he wasn't dreaming.
        - id: ch01-b17
          speaker: narrator
          text: Then he sailed round and round in circles, staring down between the trees of the Green Forest. Over and over, he said the same words to himself.
        - id: ch01-b18
          speaker: ol_mistah_buzzard
          text: Did yo' ever? No, Ah never! Did yo' ever? No, Ah never!
          emotion: surprised
