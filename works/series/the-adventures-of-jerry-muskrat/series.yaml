cover_prompt: |-
  A wordless cover scene beside a woodland pond in rural early-twentieth-century America shows a small muskrat watching his much larger beaver cousin open a gap in a log-stick-and-mud dam. The muskrat has brown fur, funny little short ears, and sharp teeth, while the beaver looks much like him but ever so much bigger and has a very broad flat tail. Clear water rushes through the new opening toward the winding brook as an old frog with a white-and-yellow underside and a small turtle wait together on a low rock downstream. The beaver's kind act of releasing the water is the focal action, with the smaller animals visibly relieved and the scene adventurous but gentle. Use a wide child-height view through reeds and wet forest plants, with the pond, dam, and laughing brook forming one clear path through the composition and broad calm sky at the top. Keep every animal anatomically believable, the landscape natural, and all designs independent of film or animation adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
