audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 坦率友善，沉稳中带着北方来客的爽朗
        timbre: 宽厚结实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十一章　麝鼠杰里守夜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 若想把事情弄个明白，也想知道四周出了什么动静，那就睁大两只眼睛，再让两只耳朵时刻醒着。
        - id: ch01-b02
          speaker: narrator
          text: 麝鼠杰里就是这么说的。他舒舒服服地坐在新水坝的一头。水坝横断了绿森林深处的欢笑小溪，在后面蓄起一个陌生的池塘。杰里看着幽暗的影子在水面上越伸越远。
        - id: ch01-b03
          speaker: jerry_muskrat
          text: 我非查清楚不可！这道坝是谁筑的？我挖出的洞又是谁堵上的？就算要搬到这里，住上一整个夏天，我也一定要弄明白！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 杰里说完，狠狠咬紧牙齿。看他那副样子，这些话可不是随口说说。
        - id: ch01-b05
          speaker: narrator
          text: 原来，杰里又累了整整一天，好不容易才把坝上的洞挖开。可等他睡醒，洞又被堵死了。这一次，他再也忍不下去了。他没有继续挖，而是决定守在这里，亲眼看看是谁在捉弄他。
        - id: ch01-b06
          speaker: narrator
          text: 他要一直等到对方出现。只要来者没有他高大，数量也不太多，他就要……唉，听听杰里把尖牙磨得咯咯响，便知道他准没打算客气。
        - id: ch01-b07
          speaker: narrator
          text: 水貂比利和小水獭乔已经厌烦透了，动身去了大河。他们本来就常常远行。欢笑小溪和微笑池塘快没水了，对他们来说倒不算太难办。
        - id: ch01-b08
          speaker: narrator
          text: 青蛙曾祖父和斑点龟走得太慢，觉得大河实在太远，只好暂时留在这个陌生的池塘里。这里当然远不如他们亲爱的微笑池塘舒服。此刻，他们已经各自躲进夜里安全的秘密藏身处，睡着了。
        - id: ch01-b09
          speaker: narrator
          text: 于是，麝鼠杰里独自坐在那里守望。黑影一点一点爬过池塘，越铺越远，也越来越浓。杰里一点儿也不怕黑。你也知道，他的眼睛天生就能在黑暗里看清东西，而且夜晚本来就是他最喜欢的时候。
        - id: ch01-b10
          speaker: narrator
          text: 他一动不动，已经坐了很久，只管仔细听，仔细看。过了一阵，水面上忽然出现一道细细的银线，笔直朝水坝游来。杰里一下屏住呼吸，眼里冒出了怒火。他知道，那是有人游水划出的波纹。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 哈！这下可要见分晓了！
        - id: ch01-b12
          speaker: narrator
          text: 银线越来越近，越来越近。接着，杰里看清了游水者的脑袋。他的怒气一下子全没了，因为一阵巨大的恐惧挤进心里，再也容不下别的东西。
        - id: ch01-b13
          speaker: narrator
          text: 那颗脑袋，比杰里见过的任何一只麝鼠的脑袋都大，甚至比水貂比利任何一个亲戚的脑袋还大。这是个陌生人，身形大得惊人。杰里顿时觉得自己小极了，只盼对方千万别发现他。
        - id: ch01-b14
          speaker: narrator
          text: 陌生人从身边游过时，杰里屏住呼吸。对方随即爬上水坝。他看起来很像杰里，只不过大了不知多少倍。还有那条尾巴！杰里从没见过这样的尾巴，又宽又扁。
        - id: ch01-b15
          speaker: narrator
          text: 突然，那个高大的陌生人转过身，直直望向杰里。
        - id: ch01-b16
          speaker: paddy_beaver
          text: 你好啊，麝鼠杰里！怎么，你不认识我吗？
        - id: ch01-b17
          speaker: narrator
          text: 杰里吓得一句话也说不出来。
        - id: ch01-b18
          speaker: paddy_beaver
          text: 我是你那个从北方来的大个子表亲，海狸帕迪。只要你别再碰我的水坝，我想咱们会成为好朋友的。
        - id: ch01-b19
          speaker: jerry_muskrat
          text: 我——我——我也希望这样。
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: 杰里的声音轻得几乎听不见。他竭力想显得有礼貌，可牙齿还是怕得直打颤。
