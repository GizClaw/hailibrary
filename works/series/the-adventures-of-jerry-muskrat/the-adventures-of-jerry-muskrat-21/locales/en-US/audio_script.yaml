  chapters:
    - id: ch01
      title: "CHAPTER XXI: Jerry Muskrat Keeps Watch"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The way to find out what is happening all around is to keep both eyes peeled and both ears open. That was what Jerry Muskrat said as he made himself comfortable on one end of the new dam. The dam crossed the Laughing Brook, deep in the Green Forest. Jerry watched the dark shadows stretch farther and farther across the strange pond behind it.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: I'm going to learn who built this dam and who filled the hole I made in it! Even if I have to move up here and stay all summer, I'll find out!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: Jerry snapped his teeth together. He meant every word. He had spent another long, tiring day opening the hole in the dam, only to find it closed again after he slept. That was enough. He would not try once more. This time, he would watch until the trickster came. If whoever came was no bigger than Jerry, and if there were not too many of them, then Jerry would... Well, the way he ground those sharp teeth made it sound as though he meant to do something very bad.
        - id: ch01-b04
          speaker: narrator
          text: Billy Mink and Little Joe Otter had given up in disgust and left for the Big River. They traveled often, so they did not mind too much that the Laughing Brook and the Smiling Pool no longer held enough water. Grandfather Frog and Spotty the Turtle moved very, very slowly. The Big River was too far for them, so they had decided to live in the strange pond for a while. It was not nearly as pleasant as their dear Smiling Pool, but they would stay. Now each of them was asleep in a secret place where he would be safe through the night.
        - id: ch01-b05
          speaker: narrator
          text: Jerry sat there alone, keeping watch through the night. The shadows reached farther across the pond and turned darker and darker. Jerry did not mind. His eyes were made to see at night, and he dearly loved the darkness. For a long time, he never moved. He simply watched and listened.
        - id: ch01-b06
          speaker: narrator
          text: At last, something caught his eye. Jerry drew in his breath, and anger flashed in his eyes. A thin silver line was moving over the water, straight toward the dam beneath him. Jerry knew what made a line like that. Someone was swimming across the pond toward him.
        - id: ch01-b07
          speaker: jerry_muskrat
          text: Ha! Now we'll see!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: The silver line came closer and closer. Soon Jerry could see the swimmer's head. All at once, his anger vanished. There was no room left for it, because a great fear had pushed it out. That head was larger than the head of any muskrat Jerry had ever seen. It was even bigger than the head of any relative of Billy Mink. This was a stranger, and such a huge one that Jerry suddenly felt very, very small. With all his heart, he hoped the stranger would not notice him.
        - id: ch01-b09
          speaker: narrator
          text: Jerry held his breath while the stranger swam past him and climbed onto the dam. He looked a great deal like Jerry, only ever and ever so much bigger. And what a tail he had! Jerry had never seen one like it. The tail was very broad and flat. Then the big stranger turned and looked directly at Jerry.
        - id: ch01-b10
          speaker: paddy_beaver
          text: Hello, Jerry Muskrat! Don't you recognize me?
        - id: ch01-b11
          speaker: narrator
          text: Jerry was too frightened to answer.
        - id: ch01-b12
          speaker: paddy_beaver
          text: I'm your big cousin from the North. I'm Paddy the Beaver. Leave my dam alone, and I think you and I will be good friends.
        - id: ch01-b13
          speaker: narrator
          text: Jerry tried his best to be polite, but his teeth were chattering with fear.
        - id: ch01-b14
          speaker: jerry_muskrat
          text: I—I—I hope so.
          emotion: fearful
