  chapters:
    - id: ch01
      title: "CHAPTER XV: What Spotty The Turtle Found"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Spotty the Turtle stared and stared. He stared so hard that his eyes seemed ready to pop right out of his funny little head. He knew he could trust his own eyes. Even so, what he saw was almost impossible to believe. If someone else had told him about it, he would never have believed them. No, Sir. It simply didn't seem as though such a thing could really be there.
        - id: ch01-b02
          speaker: narrator
          text: Perhaps the sun was shining in his eyes and making him see something that wasn't there. Spotty moved carefully to another place and looked again. The sight did not change. Now he knew it was real. He had found what was wrong with the Laughing Brook. This was what had stopped the brook from laughing and the Smiling Pool from smiling.
        - id: ch01-b03
          speaker: narrator
          text: Spotty felt good about that. In fact, he felt very good indeed. He believed he was the first to discover what had happened to the Laughing Brook, and he was the first of all the little people from the Smiling Pool to get there. Ol' Mistah Buzzard had arrived before him, but Spotty didn't count him. With those broad wings, all the old buzzard had to do was sail above the Green Forest and look down.
        - id: ch01-b04
          speaker: narrator
          text: The ones who really counted were Billy Mink, Little Joe Otter, Jerry Muskrat, and Grandfather Frog. Billy had stopped to take a nap. Little Joe had stopped to play. Jerry had stopped for something to eat. Grandfather Frog had stopped for a nap in the sun. Spotty alone had kept moving, and now he was the first of them to reach the source of the trouble. Of course he was proud. Of course he was happy.
        - id: ch01-b05
          speaker: narrator
          text: Spotty kept on going that day, and that was how he won the race.
        - id: ch01-b06
          speaker: narrator
          text: Before long, though, Spotty began wishing the others would hurry. He wanted to hear what they thought, and he wanted to talk the whole thing over with them. What he had found was so surprising that he couldn't make head or tail of it by himself. What would the others say when they saw it? Long black shadows were already creeping through the Green Forest. If his friends did not arrive soon, they would have to wait until morning.
        - id: ch01-b07
          speaker: narrator
          text: So Spotty found a good place to spend the night. He settled down there to watch and wait. The strange thing he had discovered stood right in front of him. And what was it? It was a wall. Yes, Sir, a wall made of logs and sticks and mud. It stretched straight across the Laughing Brook where the banks rose steep and narrow.
        - id: ch01-b08
          speaker: narrator
          text: No wonder the Laughing Brook could not laugh anymore. So little water could pass through that wall of logs, sticks, and mud that the brook couldn't manage even the beginning of a laugh. Spotty wondered what might be behind the wall. He wondered who had built it, and why. One question led to another, and he was still wondering when he fell asleep.
