audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十五章　斑点龟发现了什么
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 斑点龟瞪着眼前的东西，看了又看，眼珠子简直快从那颗滑稽的小脑袋里蹦出来了。他当然相信自己的眼睛。可是，可是，话又说回来，要是换成别人看见这一幕，再回来讲给他听，他绝对不会信。对，先生，他怎么也不会信。因为眼前的事，实在不像真的呀。
        - id: ch01-b02
          speaker: narrator
          text: 他想，也许是阳光照进眼睛，才让自己看见了并不存在的东西。于是，他小心地挪了挪位置。可眼前一点也没变。斑点龟这才确定，自己看到的确实是真的。他也终于找到了欢笑小溪出麻烦的原因。就是这个原因，让小溪没了笑声，也让微笑池塘没了笑脸。
        - id: ch01-b03
          speaker: narrator
          text: 斑点龟心里别提多得意了。因为欢笑小溪究竟出了什么事，是他第一个查出来的。至少，他觉得自己是第一个。在住在微笑池塘的小伙伴当中，他的确最先到达这里。老秃鹫先生倒是比他来得早，可那不算。老秃鹫先生的翅膀那么宽，只要飞过绿森林，朝下面看一眼就行。真正该比一比的，是水貂比利、小水獭乔、麝鼠杰里和青蛙曾祖父。比利停下来睡觉，小乔停下来玩，杰里停下来吃东西，青蛙曾祖父也停下来晒太阳打盹。只有斑点龟没有停。他一直向前，终于第一个找到了欢笑小溪出麻烦的原因。难怪他又骄傲，又快活。
        - id: ch01-b04
          speaker: narrator
          text: 坚持到底，就是诀窍。
        - id: ch01-b05
          speaker: narrator
          text: 斑点那天，赢了赛跑。
        - id: ch01-b06
          speaker: narrator
          text: 不过现在，斑点龟开始盼着伙伴们快点赶来了。他很想听听大家怎么说，也想和他们一起把这件事好好琢磨清楚。眼前的发现太叫人吃惊，连他自己都理不出头绪。他只好猜着，伙伴们见了会说些什么。绿森林里，一道道长长的黑影已经慢慢爬了进来。要是大家不能赶快到这里，那就只能等明天了。
        - id: ch01-b07
          speaker: narrator
          text: 斑点龟找好过夜的地方，便坐下来守着，也等着。那个让他怎么也想不明白的东西，就在眼前。那是什么呢？是一堵墙。对，先生，真的是一堵墙。这堵墙用圆木、树枝和泥巴筑成，正好横在欢笑小溪上。那一段的两岸很陡，河道又窄。欢笑小溪当然笑不出来了。能从这堵圆木、树枝和泥巴墙里穿过去的水少得可怜，连一点点笑声也激不起来。斑点龟想知道墙后面有什么，也想知道这堵墙是谁筑的，为什么要筑。他还想了好多好多别的问题。就这样，他想着，想着，最后睡着了。
