audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 坦率友善，沉稳中带着北方来客的爽朗
        timbre: 宽厚结实
        pace: 从容
        pitch: 中低音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十五章　海狸帕迪决定留下来
      blocks:
        - id: ch01-b01
          speaker: jerry_muskrat
          text: 绿草地辽阔又美丽，微笑池塘连着欢笑小溪。处处叫我们欢欣又自豪，每个隐秘角落都惹人怜惜。
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 杰里念完这几句，爬上了微笑池塘中央的大岩石。帕迪陪在他身边。他们望着亲爱的微笑池塘，看月光下的水面泛起细细的波纹，又露出了从前的笑脸。那场大灾难发生以前，杰里常常看见的就是这番景象。
        - id: ch01-b03
          speaker: grandfather_frog
          text: 恰格朗！福分没有失而复得过，谁也不知道它有多珍贵。
        - id: ch01-b04
          speaker: narrator
          text: 青蛙爷爷低沉洪亮的声音，从香蒲丛里传了出来。香蒲也轻轻点着头，仿佛赞同他的话。它们的脚终于又泡进了清凉的水里。
        - id: ch01-b05
          speaker: narrator
          text: 帕迪完全明白大家此刻的心情。这些朋友才刚刚认识，可看见他们一个个如此快乐，他也悄悄笑了。
        - id: ch01-b06
          speaker: paddy_beaver
          text: 这里确实很好，难怪你们舍不得走。给大家惹来那么多麻烦，还害得你们担心，真对不起。可那时候，我确实不知道呀。
        - id: ch01-b07
          speaker: jerry_muskrat
          text: 没事，都过去了。现在你也知道这里有多好啦。留下来吧，把家安在这儿，好不好？
        - id: ch01-b08
          speaker: narrator
          text: 杰里如今为这位大个子表哥骄傲极了。帕迪却回过头，望着绿森林投下的巨大黑影。森林深处，远远传来了猫头鹰胡迪捕猎的叫声。
        - id: ch01-b09
          speaker: narrator
          text: 他又望向绿草地。遥远的另一边，狐狸雷迪叫了一声。农夫布朗家门前的猎犬鲍泽，立刻用低沉的大嗓门回应。帕迪听见这声音，竟微微打了个寒战。
        - id: ch01-b10
          speaker: narrator
          text: 绿森林和绿草地上的小动物听见胡迪叫，也会这样发抖。帕迪倒不怕胡迪，也不怕雷迪，可鲍泽的声音，他从来没听过。不知怎么，光是听见那吠声，他就害怕起来。
        - id: ch01-b11
          speaker: narrator
          text: 这片绿草地既陌生又空旷，帕迪一点儿也没有回家的感觉。他真正喜欢的地方，还是绿森林最幽深的那一带。
        - id: ch01-b12
          speaker: paddy_beaver
          text: 不行，我怎么也不能住在微笑池塘。杰里表弟，这池塘虽好，却不适合我。住在这里，我没有一刻能安心。再说，这儿也没有我吃的东西。
        - id: ch01-b13
          speaker: jerry_muskrat
          text: 怎么没有？这里有睡莲根，还有最好吃的淡水蛤蜊，还有……
        - id: ch01-b14
          speaker: paddy_beaver
          text: 可这里没有树呀。你知道，我不能没有树。
        - id: ch01-b15
          speaker: narrator
          text: 杰里盯着帕迪，怎么也听不明白。过了一会儿，他才结结巴巴地问出口。
        - id: ch01-b16
          speaker: jerry_muskrat
          text: 你……你难道吃树吗？
        - id: ch01-b17
          speaker: narrator
          text: 帕迪笑了起来。
        - id: ch01-b18
          speaker: paddy_beaver
          text: 我只吃树皮，而且每天都得吃很多。
        - id: ch01-b19
          speaker: narrator
          text: 杰里有多失望，脸上就显得有多失望。
        - id: ch01-b20
          speaker: jerry_muskrat
          text: 那你当然不能留下了。可我原来还想着，我们能在一起痛痛快快地玩呢。
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: 帕迪的眼睛里闪起了笑意。
        - id: ch01-b22
          speaker: paddy_beaver
          text: 也许我们照样能一起玩。我差不多决定了，要在绿森林里的欢笑小溪边住一阵。你可以去看我。顺流下来时，我看见岸上有个很不错的洞，眼下拿来当房子正合适。等我住进去，你就可以上那儿来找我。
        - id: ch01-b23
          speaker: paddy_beaver
          text: 不过，我要是真的留下，你、青蛙爷爷和斑点龟都得替我保密。谁也不能知道我在那里。你们能答应吗？
        - id: ch01-b24
          speakers: [jerry_muskrat, grandfather_frog, spotty_turtle]
          ensemble: chorus
          text: 我们当然答应！
        - id: ch01-b25
          speaker: paddy_beaver
          text: 那我就留下来。
        - id: ch01-b26
          speaker: narrator
          text: 帕迪说完，扑通一声跃进微笑池塘，溅起了一大片水花。
        - id: ch01-b27
          speaker: narrator
          text: 就这样，杰里许多了不起的历险中，有一场结束了。在这场历险里，他找到了自己个头最大的表哥，海狸帕迪。
        - id: ch01-b28
          speaker: narrator
          text: 杰里的表亲可不少。有一位住在绿草地上，离微笑池塘不远，名叫草原鼠丹尼。丹尼也总在经历冒险，每天都有新鲜事。要是你愿意读，下一本书就会讲到他的几场历险。
