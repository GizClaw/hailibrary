audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: alert and determined, becoming timid when frightened
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: friendly, confident, and straightforward
        timbre: broad and sturdy
        pace: unhurried
        pitch: medium-low
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified and deliberate
        timbre: deep and resonant
        pace: slow
        pitch: low
