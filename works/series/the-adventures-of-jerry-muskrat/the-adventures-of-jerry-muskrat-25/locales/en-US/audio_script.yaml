  chapters:
    - id: ch01
      title: "CHAPTER XXV: Paddy The Beaver Decides To Stay"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jerry Muskrat climbed onto the Big Rock in the middle of the Smiling Pool, with Paddy the Beaver beside him. They watched the dear old pool dimple and smile in the moonlight. Jerry had seen it that way many times before the great trouble came, and the sight moved him to speak.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: The Green Meadows stretch so wide. The Smiling Pool and Laughing Brook fill us with joy and pride. We love every hidden nook.
          emotion: happy
        - id: ch01-b03
          speaker: grandfather_frog
          text: Chugarum! You never know how great your blessings are until you lose them and find them again.
        - id: ch01-b04
          speaker: narrator
          text: The bulrushes nodded as though they were thinking the same thing. Their feet were back in the cool water at last, where they belonged. Paddy seemed to understand exactly how everyone felt. He smiled to himself when he saw how happy all his new friends were.
        - id: ch01-b05
          speaker: paddy_beaver
          text: This truly is a lovely place. Now I understand why you couldn't bear to leave. I'm sorry I caused so much trouble and worry. I simply didn't know.
        - id: ch01-b06
          speaker: jerry_muskrat
          text: That's all right. Now that you've seen how nice it is, I hope you'll stay and make your home here.
        - id: ch01-b07
          speaker: narrator
          text: Jerry was very proud of his big cousin. Paddy turned toward the great black shadow behind them. He knew it was the Green Forest. From somewhere near the middle came the hunting call of Hooty the Owl. Then Paddy gazed out over the Green Meadows. From the far side came the bark of Reddy Fox. Bowser the Hound answered in his deep voice from Farmer Brown's dooryard.
        - id: ch01-b08
          speaker: narrator
          text: That last sound made Paddy shiver a little. Hooty's voice made the smaller folk of the forest and meadows shiver in much the same way. Paddy wasn't afraid of Hooty or Reddy, but Bowser's great voice was new to him. Somehow its very sound frightened him. The wide, open Green Meadows felt strange. Paddy loved the deepest part of the Green Forest, and out here he didn't feel at home at all.
        - id: ch01-b09
          speaker: paddy_beaver
          text: No, Cousin Jerry. I simply can't live in the Smiling Pool. It's a very nice pool, but it wouldn't suit me at all. I wouldn't feel safe here for even a minute. And there's nothing here for me to eat.
        - id: ch01-b10
          speaker: jerry_muskrat
          text: Of course there is! We have lily roots and the very best freshwater clams, and—
        - id: ch01-b11
          speaker: paddy_beaver
          text: But there aren't any trees, and you know I need trees.
        - id: ch01-b12
          speaker: narrator
          text: Jerry stared at Paddy as though he couldn't make sense of that at all. He thought about it for a moment before he finally asked his question.
        - id: ch01-b13
          speaker: jerry_muskrat
          text: Do—do you eat trees?
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: Paddy laughed.
        - id: ch01-b15
          speaker: paddy_beaver
          text: I eat only the bark, not the whole tree, but I need a great deal of it.
        - id: ch01-b16
          speaker: narrator
          text: Jerry looked just as disappointed as he felt.
        - id: ch01-b17
          speaker: jerry_muskrat
          text: Then of course you can't stay. And I thought we could have such good times together.
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: Paddy's eyes twinkled.
        - id: ch01-b19
          speaker: paddy_beaver
          text: We may still have them. I've nearly decided to stay for a while beside the Laughing Brook, up in the Green Forest. You can come and visit me there. On our way down, I noticed a very nice hole in the bank. I think it will make a good home for now, and you can come up to see me. But if I do stay, you, Grandfather Frog, and Spotty the Turtle must keep me a secret. No one can know I'm there. Will you promise?
        - id: ch01-b20
          speakers: [jerry_muskrat, grandfather_frog, spotty_the_turtle]
          ensemble: chorus
          text: Of course we will!
        - id: ch01-b21
          speaker: paddy_beaver
          text: Then I'll stay.
        - id: ch01-b22
          speaker: narrator
          text: Paddy dived into the Smiling Pool with a great splash.
        - id: ch01-b23
          speaker: narrator
          text: And that is how one of Jerry Muskrat's greatest adventures came to an end. Through all the trouble, he had found his biggest cousin, Paddy the Beaver.
        - id: ch01-b24
          speaker: narrator
          text: Jerry has a great many other cousins. One of them lives on the Green Meadows, not far from the Smiling Pool. His name is Danny Meadow Mouse. Danny is forever getting into adventures of his own. In fact, he has them every day. The next book will tell you about some of those adventures, if you would like to hear them.
