audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 活泼自信，情绪变化直率鲜明
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第六章　布朗农夫家的男孩想不明白
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布朗农夫家的男孩吹着欢快的口哨，大步穿过绿草原。欢乐小风一瞧见他，就争先恐后地跑去微笑池塘，给比利水貂报信。男孩是来查看捕兽夹的。他满心以为，今天准能逮住比利、小水獭乔、麝鼠杰里，没准儿还有浣熊博比。
        - id: ch01-b02
          speaker: narrator
          text: 比利水貂正坐在大岩石顶上。他先看见欢乐小风飞过草原，接着又看见了后面的男孩。比利马上头朝下一扎，钻进微笑池塘，接着游到杰里家报信。随后，他和杰里一起找到小水獭乔。三个披着棕色皮毛的小淘气躲进香蒲丛，从那里偷偷看着男孩。
        - id: ch01-b03
          speaker: narrator
          text: 男孩先来到杰里的老木头旁。他小心翼翼地探过岸沿，往下面一看，捕兽夹竟然不见了。
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: 好哇！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 男孩兴奋得一把抓住链子的末端。那条链子把捕兽夹牢牢拴在老木头上。他认定这回终于逮住了杰里。可是，夹子拉上来以后，里面什么也没有。夹口间只有几根毛和一小块皮，那是杰里用尾巴触发夹子时留下的。
        - id: ch01-b06
          speaker: narrator
          text: 空空的捕兽夹让男孩失望极了。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: 没关系，明天我总能逮到他。
        - id: ch01-b08
          speaker: narrator
          text: 他接着去看下一只捕兽夹，却连夹子的影子也找不到。他一拉链子，激动得浑身发抖。夹子没有马上出来。他一下又一下地拉着，忽然，沾满泥的捕兽夹冒了出来，里面只夹着小水獭乔的一小片爪尖。
        - id: ch01-b09
          speaker: narrator
          text: 男孩十分仔细地把夹子重新布好。要是他能看见香蒲丛里的乔、比利和杰里，正一边盯着他，一边乐得直笑，他就不会那么肯定下次能逮住乔了。
        - id: ch01-b10
          speaker: narrator
          text: 男孩绕着微笑池塘走了一圈，又沿欢笑溪上上下下走了个遍。他找到的每一只捕兽夹都已经触发，还被埋进了泥里。这时，他不再吹口哨了，那张长着雀斑的脸上，眉头困惑地皱了起来。
        - id: ch01-b11
          speaker: narrator
          text: 这到底是怎么回事？难道有别的男孩发现了这些夹子，故意把它们全弄响，跟他开玩笑？
        - id: ch01-b12
          speaker: narrator
          text: 他越想，心里越糊涂。你瞧，他哪里知道，水貂、水獭、麝鼠和浣熊们头一天曾经忙活了整整一天呢。
        - id: ch01-b13
          speaker: narrator
          text: 男孩大步穿过绿草原，渐渐走远。青蛙曾祖父坐在宽大的绿睡莲叶上，抚平身上那件黄白相间的背心，又朝快活、浑圆、红彤彤的太阳先生眨了眨眼。
        - id: ch01-b14
          speaker: narrator
          text: 他一口吞下一只傻乎乎的绿苍蝇。
        - id: ch01-b15
          speaker: grandfather_frog
          text: 咕咕隆！你再把那些捕兽夹布置好，又能有什么用！
        - id: ch01-b16
          speaker: narrator
          text: 接着，青蛙曾祖父叫来比利水貂，让他通知微笑池塘和欢笑溪的其他小居民。大家得马上行动，照先前那样，再把所有捕兽夹触发一遍。
        - id: ch01-b17
          speaker: narrator
          text: 这回事情容易多了，因为大家已经知道夹子都在哪里。他们忙了整整一天，把树枝和石块丢进夹子，让每一只再次合拢。然后，大家准备好好享用一顿盛宴，吃掉男孩散放在捕兽夹周围的那些美食。
