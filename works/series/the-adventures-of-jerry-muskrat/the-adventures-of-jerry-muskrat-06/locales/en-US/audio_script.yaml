  chapters:
    - id: ch01
      title: "CHAPTER VI: Farmer Brown's Boy Is Puzzled"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy came tramping across the Green Meadows, whistling merrily. The Merry Little Breezes saw him and raced ahead to the Smiling Pool to warn Billy Mink. The boy was on his way to check his traps. He felt sure he would find Billy Mink, Little Joe Otter, Jerry Muskrat, or perhaps Bobby Coon in one of them.
        - id: ch01-b02
          speaker: narrator
          text: Billy Mink was sitting on top of the Big Rock. He spotted the Breezes racing over the meadows, and behind them came Farmer Brown's boy. Billy plunged headfirst into the Smiling Pool. He swam straight to Jerry Muskrat's house and gave him the warning. Together they found Little Joe Otter. Then the three brown scamps hid among the bulrushes, where they could watch the boy.
        - id: ch01-b03
          speaker: narrator
          text: The boy went first to Jerry Muskrat's old log. He crept up to the bank and peered over the edge. The trap was gone!
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: Hurrah!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: Trembling with excitement, he grabbed the chain that fastened the trap to the old log. At last, he thought, he had caught Jerry Muskrat. But when he hauled the trap up, it was empty. A few hairs and a scrap of skin were caught between its jaws. Jerry had left them behind when he sprang the trap with his tail.
        - id: ch01-b06
          speaker: narrator
          text: The boy was disappointed.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: Well, I'll catch him tomorrow anyway.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: He moved on to the next trap, but that one had vanished too. He pulled its chain with trembling hands. At first the trap would not come. He tugged and tugged until it suddenly came up, thick with mud. Inside was one small claw from Little Joe Otter.
        - id: ch01-b09
          speaker: narrator
          text: Farmer Brown's boy carefully set the trap again. If he could have seen into the bulrushes, he would have found Little Joe, Billy, and Jerry watching him, tickling one another and laughing. Then he might not have felt so sure he would catch Little Joe next time.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy tramped all around the Smiling Pool, then up and down the Laughing Brook. Every trap he found had been sprung and buried in mud. By now his whistling had stopped. A puzzled frown spread across his freckled face. What could it mean? Had another boy found the traps and sprung them all as a trick? The more he wondered, the less he understood.
        - id: ch01-b11
          speaker: narrator
          text: He knew nothing about how hard the Minks, Otters, Muskrats, and Coons had worked the day before.
        - id: ch01-b12
          speaker: narrator
          text: Old Grandfather Frog sat on his big green lily pad. As the boy tramped away across the Green Meadows, Grandfather Frog smoothed his white-and-yellow waistcoat and winked up at jolly, round, red Mr. Sun.
        - id: ch01-b13
          speaker: narrator
          text: He snapped up a foolish green fly.
        - id: ch01-b14
          speaker: grandfather_frog
          text: Chugarum! Setting those traps again won't do you much good!
        - id: ch01-b15
          speaker: narrator
          text: Then Grandfather Frog called Billy Mink over. He sent Billy to warn all the other little people of the Smiling Pool and the Laughing Brook. They needed to hurry and spring every trap again, just as they had before.
        - id: ch01-b16
          speaker: narrator
          text: This time the work was easy because they knew exactly where the traps were. All day long, they dropped sticks and stones into them until every trap had sprung once more.
        - id: ch01-b17
          speaker: narrator
          text: Then they got ready for a grand feast on all the good things Farmer Brown's boy had scattered around the traps.
