audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: lively, boastful, and youthful
        timbre: bright and nimble
        pace: quick
        pitch: medium-high
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified, knowing, and gruff
        timbre: deep and resonant
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: "CHAPTER IX: The Laughing Brook Stops Laughing"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Something was wrong. Grandfather Frog knew it the moment he got up that morning, but at first he couldn't tell what it was. He sat with only his head above the water. As he tried to think, he blinked his great goggly eyes.
        - id: ch01-b02
          speaker: narrator
          text: Then Grandfather Frog noticed how still everything was. He had never known stillness quite like this. Something was missing, but what? It wasn't Mr. Redwing's song. There were plenty of times when Grandfather Frog couldn't hear that. All at once, he understood. He gave a startled jump and landed on the shore.
        - id: ch01-b03
          speaker: grandfather_frog
          text: Chugarum! It's the Laughing Brook! The Laughing Brook has stopped laughing!
          emotion: surprised
        - id: ch01-b04
          speaker: narrator
          text: Could that really be true? No one had ever heard of such a thing, except when Jack Frost covered the Laughing Brook with hard black ice. In spring, summer, and fall, the brook had always laughed its merry, happy laugh. It had been laughing for as long as Grandfather Frog could remember. And he could remember far back into the long ago, because he was very old and very wise.
        - id: ch01-b05
          speaker: narrator
          text: Not once in all those years had the Laughing Brook failed to laugh. Surely it couldn't have stopped now. Grandfather Frog put one hand behind his ear. He listened and listened, but he couldn't hear a sound.
        - id: ch01-b06
          speaker: grandfather_frog
          text: Chugarum! The trouble must be with me. I must be getting old and deaf. I'll go ask Jerry Muskrat.
        - id: ch01-b07
          speaker: narrator
          text: Grandfather Frog dove into the water and started swimming across the middle of the Smiling Pool toward Jerry Muskrat's house. Jerry and Little Joe Otter had warned him the day before that something was very, very wrong with the pool. Only now, as he swam through the middle of it, did Grandfather Frog finally see how true their warning was.
        - id: ch01-b08
          speaker: narrator
          text: He stopped swimming and looked around. His great goggly eyes seemed ready to pop right out of his head. Yes, Sir, they truly did. The Smiling Pool had grown so small that there wasn't enough water left for it to smile.
        - id: ch01-b09
          speaker: jerry_muskrat
          text: Where are you going, Grandfather Frog?
        - id: ch01-b10
          speaker: narrator
          text: The voice came from above him. Grandfather Frog looked up and saw Jerry Muskrat peering down from the edge of the Big Rock. That edge now stood twice as high above the water as Grandfather Frog had ever seen it.
        - id: ch01-b11
          speaker: grandfather_frog
          text: I... I was swimming over to your house to see you.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: That won't do any good, because I'm not there. Besides, you couldn't swim to my house now, even if you tried.
        - id: ch01-b13
          speaker: grandfather_frog
          text: Why couldn't I?
          emotion: surprised
        - id: ch01-b14
          speaker: jerry_muskrat
          text: Because my house isn't in the water anymore. It's sitting far up on dry land.
          emotion: sad
        - id: ch01-b15
          speaker: grandfather_frog
          text: What did you say?
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: Grandfather Frog sounded as though he couldn't believe his own ears.
        - id: ch01-b17
          speaker: jerry_muskrat
          text: It's as true as the fact that I'm sitting right here.
          emotion: sad
        - id: ch01-b18
          speaker: grandfather_frog
          text: Listen carefully, Jerry Muskrat, and tell me the truth. Can you hear the Laughing Brook laughing?
        - id: ch01-b19
          speaker: jerry_muskrat
          text: No. The Laughing Brook has stopped laughing. The Smiling Pool has stopped smiling. I think the whole world has turned upside down.
          emotion: sad
