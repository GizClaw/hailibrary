audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第九章　欢笑小溪不笑了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天早晨，青蛙曾祖父刚一起身，就知道有什么地方不对劲。可究竟出了什么事，他一时又想不明白。他坐在水里，只把脑袋露在水面上，眨巴着那双鼓鼓的大眼睛，想啊，想啊。
        - id: ch01-b02
          speaker: narrator
          text: 忽然，他发现四周静得出奇。这种寂静，他从前从没遇到过。平日里一定有什么熟悉的声音，现在不见了，可少的究竟是什么呢？不是红翼先生的歌声。青蛙曾祖父本来就常有听不到他唱歌的时候。那会是什么呢？
        - id: ch01-b03
          speaker: narrator
          text: 青蛙曾祖父一下子想到了。他吓得猛然一跳，蹦上岸去。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 咕咕隆！是欢笑小溪！欢笑小溪不笑了！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 这怎么可能呢？除了寒霜杰克用坚硬的黑冰把小溪牢牢封住的时候，谁听说过这样的怪事？春天也好，夏天也好，秋天也好，欢笑小溪总是笑个不停，笑得又欢快又开心。
        - id: ch01-b06
          speaker: narrator
          text: 从青蛙曾祖父记事起，小溪就一直这样笑。你可别忘了，他年纪很大，也很有智慧，能记起很久很久以前的事。可在那么长的岁月里，欢笑小溪一次也没有忘记笑。今天当然也不可能！
        - id: ch01-b07
          speaker: narrator
          text: 青蛙曾祖父把一只手拢到耳后，仔仔细细地听。他听了又听，却连一点儿声音都没有听见。
        - id: ch01-b08
          speaker: grandfather_frog
          text: 咕咕隆！一定是我自己的耳朵坏了。准是我上了年纪，耳朵也聋了。我去问问麝鼠杰里。
        - id: ch01-b09
          speaker: narrator
          text: 青蛙曾祖父潜进水里，朝微笑池塘中央游去，想去杰里家找他。这时，他才真正明白，杰里和小水獭乔昨天说的都是真的。微笑池塘确实出了很大很大的问题。
        - id: ch01-b10
          speaker: narrator
          text: 他停下来，朝四周一看，那双鼓鼓的大眼睛简直快从脑袋里蹦出来了。真的，看上去马上就要蹦出来了！微笑池塘竟然缩得那么小，剩下的水连一张笑脸也露不出来啦。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 青蛙曾祖父，你要去哪儿？
        - id: ch01-b12
          speaker: narrator
          text: 声音从头顶传来。青蛙曾祖父抬头一看，原来麝鼠杰里正坐在大岩石的边缘，探头往下望着他。那块大岩石露出水面的高度，竟有青蛙曾祖父从前见过的两倍。
        - id: ch01-b13
          speaker: grandfather_frog
          text: 我……我正想游到你家去找你。
        - id: ch01-b14
          speaker: jerry_muskrat
          text: 去了也没用，我又不在家。再说，你现在根本游不到那儿。
        - id: ch01-b15
          speaker: grandfather_frog
          text: 为什么？
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: 青蛙曾祖父听了，惊讶极了。
        - id: ch01-b17
          speaker: jerry_muskrat
          text: 因为我的家已经不在水里了。它现在远远落在干地上。
          emotion: sad
        - id: ch01-b18
          speaker: grandfather_frog
          text: 你说什么？
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: 青蛙曾祖父简直不敢相信自己的耳朵。
        - id: ch01-b20
          speaker: jerry_muskrat
          text: 这是真的，就跟我现在坐在这里一样真。
          emotion: sad
        - id: ch01-b21
          speaker: grandfather_frog
          text: 麝鼠杰里，你给我仔细听清楚，再老老实实告诉我，欢笑小溪还在笑吗？
        - id: ch01-b22
          speaker: jerry_muskrat
          text: 不笑了。欢笑小溪不笑了，微笑池塘也不笑了。我看呀，这个世界准是整个儿颠倒过来了。
