  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: gruff, dignified, and thoughtful
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    ol_mistah_buzzard:
      display_name: Ol' Mistah Buzzard
