  chapters:
    - id: ch01
      title: "CHAPTER XII: A Hunt For Trouble"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: High in the blue, blue sky, Ol' Mistah Buzzard looked down and saw a funny sight. Yes, sir, it truly was funny. Five of his friends from the Smiling Pool were moving along in a little procession.
        - id: ch01-b02
          speaker: narrator
          text: Billy Mink led the way. He was so slim and nimble, and moved so fast, that he could be hard to follow. Little Joe Otter came next. His legs were so short, he almost looked as if he had none. Jerry Muskrat followed him. Jerry traveled much better in water than he did on land.
        - id: ch01-b03
          speaker: narrator
          text: Behind Jerry came Grandfather Frog. He did not walk or run. He got along in great big jumps. Spotty the Turtle brought up the rear, moving very, very slowly because, as you know, he carried his house with him. All five were heading up the Laughing Brook. But the brook was not laughing now. There was too little water left in it.
        - id: ch01-b04
          speaker: narrator
          text: Ol' Mistah Buzzard had not visited the Smiling Pool for some time. He had not heard that the pool had stopped smiling or that the brook had stopped laughing. Now he could see that nearly all the water was gone. The trout and minnows barely had enough to live in. He was so surprised that he kept saying the same thing to himself.
        - id: ch01-b05
          speaker: ol_mistah_buzzard
          text: Fo' the lan's sake! Fo' the lan's sake!
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: Then he noticed his five little friends marching upstream. He guessed at once that their journey must have something to do with the trouble at the Smiling Pool. Ol' Mistah Buzzard turned his broad wings and glided down from the blue, blue sky. Down he came until he was right above Grandfather Frog.
        - id: ch01-b07
          speaker: ol_mistah_buzzard
          text: Where are all of you headed?
        - id: ch01-b08
          speaker: grandfather_frog
          text: Chugarum! We're going to find out what's wrong with the Laughing Brook.
        - id: ch01-b09
          speaker: ol_mistah_buzzard
          text: Then I'll help you look.
        - id: ch01-b10
          speaker: narrator
          text: Ol' Mistah Buzzard sailed back up into the blue, blue sky. Grandfather Frog watched until he was no more than a speck.
        - id: ch01-b11
          speaker: grandfather_frog
          text: I wish I had wings.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: Grandfather Frog sighed, then began hopping up the bed of the Laughing Brook once more.
        - id: ch01-b13
          speaker: narrator
          text: The Laughing Brook flowed out of the Green Forest. Before reaching the Smiling Pool, it twisted through the Green Meadows for a little way. Sunshine filled that stretch of the brook. Grandfather Frog did not mind the journey there, even though his legs were growing tired.
        - id: ch01-b14
          speaker: narrator
          text: But everything changed when the friends entered the Green Forest. It seemed dark and gloomy to Grandfather Frog. Spotty the Turtle thought so too, because both of them dearly loved the sunshine. Still, they went on. They felt they had to discover what was wrong with the Laughing Brook. Once they found that trouble, they would also know what was wrong with the Smiling Pool.
        - id: ch01-b15
          speaker: narrator
          text: And so Billy Mink jumped and skipped far ahead. Little Joe Otter ran. Jerry Muskrat walked, because traveling over land soon tired him. Grandfather Frog hopped, and Spotty the Turtle crawled. Far, far above them, Ol' Mistah Buzzard flew through the blue, blue sky. Every one of them was hunting for the trouble that had stopped the Laughing Brook from laughing and the Smiling Pool from smiling.
