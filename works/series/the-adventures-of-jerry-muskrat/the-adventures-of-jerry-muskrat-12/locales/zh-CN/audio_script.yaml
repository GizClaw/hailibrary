audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    ol_mistah_buzzard:
      display_name: 老秃鹫先生
      tts:
        delivery: 悠闲随和，带着亲切的乡土口吻
        timbre: 沙哑醇厚
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十二章　追查麻烦的根源
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老秃鹫先生飞在湛蓝湛蓝的高空，低头看见了一幅有趣的景象。真的，那模样实在有趣。微笑池塘的五位朋友排成一支小队，正沿着欢笑小溪赶路。
        - id: ch01-b02
          speaker: narrator
          text: 水貂比利走在最前面。他身子细长，动作又灵活，跑得快起来，别人简直跟不上。后面是小水獭乔，他的腿短得几乎像没长腿。麝鼠杰里跟在小乔身后。杰里在水里游得好，到了陆地上，赶路就没那么轻松了。
        - id: ch01-b03
          speaker: narrator
          text: 再往后是青蛙曾祖父。他不会走，也不会跑，只能一下接一下地大跳。斑点龟落在最后，走得慢极了。你也知道，他到哪儿都得背着自己的房子。五个伙伴都在向上游进发。可欢笑小溪已经笑不出来了，溪里的水实在太少。
        - id: ch01-b04
          speaker: narrator
          text: 老秃鹫先生有些日子没来微笑池塘附近了。他还不知道，池塘已经不再微笑，小溪也不再欢笑。这会儿他从空中一看，才发现水几乎全干了，剩下的那一点儿，连鳟鱼和小鱼都快没法活下去。他吃惊极了，嘴里不停地念叨着同一句话。
        - id: ch01-b05
          speaker: ol_mistah_buzzard
          text: 我的老天爷呀！我的老天爷呀！
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: 接着，他瞧见五位小朋友排着队往上游走，马上猜到，这趟路一定和微笑池塘的麻烦有关。老秃鹫先生把宽大的翅膀一转，从高空一路滑翔下来，越飞越低，来到了青蛙曾祖父头顶上方。
        - id: ch01-b07
          speaker: ol_mistah_buzzard
          text: 你们几个要上哪儿去呀？
        - id: ch01-b08
          speaker: grandfather_frog
          text: 咕咕隆！我们要去查清楚，欢笑小溪究竟出了什么事。
        - id: ch01-b09
          speaker: ol_mistah_buzzard
          text: 那我也来帮你们找。
        - id: ch01-b10
          speaker: narrator
          text: 老秃鹫先生说完，又飞回湛蓝湛蓝的高空。青蛙曾祖父一直望着，直到他变成一个小黑点。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 我要是也有翅膀，那该多好啊。
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 青蛙曾祖父叹了口气，又沿着欢笑小溪的河床，一跳一跳地往上游赶。
        - id: ch01-b13
          speaker: narrator
          text: 欢笑小溪从绿色森林里流出来，先在绿色草原上弯弯曲曲地流了一小段，才来到微笑池塘。草原上的阳光直照进溪里。青蛙曾祖父的两条腿虽说渐渐累了，他倒也不在意。
        - id: ch01-b14
          speaker: narrator
          text: 可伙伴们一进绿色森林，四周就变得又暗又阴沉。青蛙曾祖父这么觉得，斑点龟也一样，因为他们俩都特别喜欢阳光。不过，他们还是继续赶路。他们非得找出欢笑小溪的麻烦不可。找到了它，也就能找到微笑池塘的麻烦。
        - id: ch01-b15
          speaker: narrator
          text: 就这样，水貂比利又蹦又跳，远远跑在前面。小水獭乔撒腿飞奔。麝鼠杰里走着，因为他在陆地上很快就会累。青蛙曾祖父一路跳，斑点龟慢慢爬。湛蓝湛蓝的高空中，老秃鹫先生也一路飞着。大家都在追查那场麻烦。正是它，让欢笑小溪没了笑声，也让微笑池塘失去了笑脸。
