audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机灵活泼，警觉时说话急切而直截了当
        timbre: 清脆灵巧
        pace: 稍快
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第七章　麝鼠杰里的新发现
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 美丽的春天到了。它给微笑池塘带来了许多欢乐，绿草原和绿森林也是一样，到处都喜气洋洋。青蛙曾祖父在泥土深处那张专属的小床上，睡过了漫长的冬天。醒来以后，他的胃口大得不得了。有一阵子，他好像除了自己的肚皮，什么也想不了。
        - id: ch01-b02
          speaker: narrator
          text: 麝鼠杰里呢，只觉得春意钻进了骨头。他沿着欢笑溪上上下下，到各种地方探头探脑，只因为发现新鲜事物实在有趣。小水獭乔也比平时更加贪玩了——要是他还能更加贪玩的话。红翼先生和太太离开遥远而温暖的南方越冬地，飞回香蒲丛住下。每一个人都快活极了，简直再也不能更快活。
        - id: ch01-b03
          speaker: narrator
          text: 一个阳光灿烂的早晨，杰里坐在微笑池塘中央的大岩石上。他想着每一个人有多快活，又看着小乔在水里翻来滚去，耍出一个又一个花样，忍不住发笑。突然，杰里那双锐利的眼睛瞧见了什么。他困惑地皱起额头，一遍一遍望着对岸，最后朝小乔喊起来。
        - id: ch01-b04
          speaker: jerry_muskrat
          text: 嗨，小乔！到这儿来一下！
        - id: ch01-b05
          speaker: narrator
          text: 小乔在水里翻了个跟头。
        - id: ch01-b06
          speaker: little_joe_otter
          text: 找我做什么？
        - id: ch01-b07
          speaker: jerry_muskrat
          text: 你帮我看看，我这双眼睛是不是出了毛病。
        - id: ch01-b08
          speaker: narrator
          text: 小乔不游了。他抬头盯着杰里，又开始往大岩石上爬。
        - id: ch01-b09
          speaker: little_joe_otter
          text: 我看你的眼睛好好的呀。
        - id: ch01-b10
          speaker: jerry_muskrat
          text: 看着当然没问题。我是想知道，它们看东西还准不准。你瞧瞧对面的河岸。
        - id: ch01-b11
          speaker: narrator
          text: 小乔转头望向对岸，盯着那里看了又看，却没发现任何不寻常的地方。那片河岸看起来和平常完全一样，他便把这话告诉了杰里。
        - id: ch01-b12
          speaker: jerry_muskrat
          text: 那准是我的眼睛有毛病，一定是。可我怎么看着，今天池水爬上河岸的位置，没有昨天那么高呢？
        - id: ch01-b13
          speaker: narrator
          text: 小乔再仔细一瞧，眼睛一下睁得滚圆。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 杰里，你说得对！你的眼睛好着呢。现在的水已经低得不能再低了，连盛夏最热的时候也不过这么低。这到底是怎么回事？
          emotion: surprised
        - id: ch01-b15
          speaker: jerry_muskrat
          text: 我也不知道。真怪，实在太怪了！咱们去问青蛙曾祖父吧。他年纪大，懂得又多，说不定知道这是怎么回事。
        - id: ch01-b16
          speaker: narrator
          text: 扑通一声，杰里和小乔一头扎进微笑池塘。他们立刻游了起来，还要比赛谁能先赶到青蛙曾祖父那里。青蛙曾祖父正坐在池边的香蒲丛中。睡莲叶还没长得足够大，他坐上去可不舒服。
        - id: ch01-b17
          speaker: narrator
          text: 杰里和小乔赶到时，都已经累得喘不过气了。他们一起喊道。
        - id: ch01-b18
          speakers: [jerry_muskrat, little_joe_otter]
          ensemble: duo
          text: 青蛙曾祖父，微笑池塘怎么啦？
        - id: ch01-b19
          speaker: grandfather_frog
          text: 咕咕隆！微笑池塘好得很，什么事也没有。这儿可是全世界最好的地方。
        - id: ch01-b20
          speaker: jerry_muskrat
          text: 可它真的不对劲。
        - id: ch01-b21
          speaker: narrator
          text: 杰里坚持这么说，随后把自己的发现从头讲了一遍。
        - id: ch01-b22
          speaker: grandfather_frog
          text: 我不信。春天里会有这种事，我活了这么久，还从来没听说过。
