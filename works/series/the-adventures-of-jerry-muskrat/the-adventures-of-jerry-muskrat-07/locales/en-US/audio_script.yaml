  chapters:
    - id: ch01
      title: "CHAPTER VII: Jerry Muskrat Makes A Discovery"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Beautiful springtime had brought happiness everywhere. The Smiling Pool was happy, and so were the Green Meadows and the Green Forest. Great-Grandfather Frog had spent the whole long winter asleep in his own special bed, far down in the mud. Now he was awake with such a huge appetite that, for a while, he could hardly think of anything but his stomach.
        - id: ch01-b02
          speaker: narrator
          text: Jerry Muskrat could feel spring fever in his bones. He roamed up and down the Laughing Brook, poking into all kinds of places simply because it was fun to see something new. Little Joe Otter was fuller of fun than ever, if that was possible. Mr. and Mrs. Redwing had come home to the bulrushes after spending winter far away in the warm Southland. Everybody was happy, just as happy as could be.
        - id: ch01-b03
          speaker: narrator
          text: One sunny morning, Jerry sat on the Big Rock in the middle of the Smiling Pool. He was thinking about how happy everyone was and laughing as Little Joe Otter cut one caper after another in the water. Then his sharp eyes caught something across the Pool. Jerry wrinkled his forehead in a puzzled frown. He looked and looked at the opposite bank. At last, he called out to Little Joe.
        - id: ch01-b04
          speaker: jerry_muskrat
          text: Hi, Little Joe! Come over here!
        - id: ch01-b05
          speaker: narrator
          text: Little Joe turned a somersault in the water.
        - id: ch01-b06
          speaker: little_joe_otter
          text: What do you want?
        - id: ch01-b07
          speaker: jerry_muskrat
          text: I need you to tell me if something is wrong with my eyes.
        - id: ch01-b08
          speaker: narrator
          text: Little Joe stopped swimming and stared up at Jerry.
        - id: ch01-b09
          speaker: little_joe_otter
          text: They look all right to me.
        - id: ch01-b10
          speaker: narrator
          text: He started climbing onto the Big Rock.
        - id: ch01-b11
          speaker: jerry_muskrat
          text: Of course they look all right. But are they seeing properly? Look at that bank over there.
        - id: ch01-b12
          speaker: narrator
          text: Little Joe looked across the Pool. He studied one part of the bank and then another. He stared and stared, but nothing seemed unusual. The bank looked exactly the way it always did, and he said so.
        - id: ch01-b13
          speaker: little_joe_otter
          text: I don't see anything different, Jerry.
        - id: ch01-b14
          speaker: jerry_muskrat
          text: Then it must be my eyes. It certainly has to be. The water doesn't seem to come as high up the bank as it did yesterday.
        - id: ch01-b15
          speaker: narrator
          text: Little Joe turned back toward the bank and took another long look. This time, his eyes opened wide.
        - id: ch01-b16
          speaker: little_joe_otter
          text: You're right, Jerry Muskrat! Your eyes are fine. Why, the water is as low as it ever gets, even in the middle of summer. What could that mean?
          emotion: surprised
        - id: ch01-b17
          speaker: jerry_muskrat
          text: I don't know. It's strange. Very strange. Let's ask Grandfather Frog. He's very old and very wise. Maybe he can tell us what it means.
        - id: ch01-b18
          speaker: narrator
          text: Splash! Jerry Muskrat and Little Joe Otter dived into the Smiling Pool. Then they raced to see who could reach Grandfather Frog first. He sat among the bulrushes at the edge of the Pool. The lily pads were still too small for him to sit on comfortably.
        - id: ch01-b19
          speaker: narrator
          text: Jerry and Little Joe came up quite out of breath.
        - id: ch01-b20
          speakers: [jerry_muskrat, little_joe_otter]
          ensemble: duo
          text: Oh, Grandfather Frog, what's wrong with the Smiling Pool?
        - id: ch01-b21
          speaker: grandfather_frog
          text: Chugarum! Nothing is wrong with the Smiling Pool. It's the best place in the whole world.
        - id: ch01-b22
          speaker: narrator
          text: Grandfather Frog answered gruffly.
        - id: ch01-b23
          speaker: jerry_muskrat
          text: But something is wrong.
        - id: ch01-b24
          speaker: narrator
          text: Jerry told him what he had noticed.
        - id: ch01-b25
          speaker: grandfather_frog
          text: I don't believe it. I've never heard of the water getting so low in springtime.
