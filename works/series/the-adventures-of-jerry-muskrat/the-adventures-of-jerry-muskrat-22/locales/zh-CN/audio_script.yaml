audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 坦率友善，沉稳中带着北方来客的爽朗
        timbre: 宽厚结实
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十二章　杰里不再害怕
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 请告诉我，你，还有你，还有你。你们可曾听谁讲过？世间奇妙而伟大的事物那么多，最伟大的，莫过于说出口的话。
        - id: ch01-b02
          speaker: narrator
          text: 这是真的，再没有比这更真的事了。你若不信，只管去问麝鼠杰里。他会告诉你这是真的，因为杰里心里明白。
        - id: ch01-b03
          speaker: narrator
          text: 话语可不只是声音。哎呀，当然不只是！每一句话都是个小小的信使，一旦派出去，就再也叫不回来了。是的，先生，谁也叫不回来。有时，这实在让人难过，因为它们已经把带着的东西送到了别人那里。
        - id: ch01-b04
          speaker: narrator
          text: 这些小信使总会把东西带给别人。它们也许带去愤怒、仇恨、恐惧，或是一句假话。世上的许多麻烦，就是这么惹出来的。可它们也能带去爱、体谅、援手和善意，而这些东西，又能平息世上的许多麻烦。
        - id: ch01-b05
          speaker: narrator
          text: 就说麝鼠杰里吧。他坐在绿森林里的新水坝上。正是这道坝蓄起了那个陌生的池塘。一个陌生人正往坝上爬，个头比杰里大得多，也大得吓人。杰里浑身发抖，牙齿不停地打颤。
        - id: ch01-b06
          speaker: narrator
          text: 他亲眼见过，陌生人游得和自己一样好。这里又没有杰里的秘密地洞。就算杰里想逃，也根本逃不过对方。虽然没人说，杰里却知道，这道坝就是陌生人筑的。
        - id: ch01-b07
          speaker: narrator
          text: 可杰里已经两次挖开水坝，把陌生池塘里的水放进欢笑小溪。他心里很清楚，如果自己筑的坝被人破坏，他一定会气坏。而他偏偏就对这位陌生人做了同样的事。杰里坐在那里，怕得连逃都不敢逃。
        - id: ch01-b08
          speaker: jerry_muskrat
          text: 早知道这样，我真该让别人来守着。
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: 就在这时，那个高大的陌生人开了口。
        - id: ch01-b10
          speaker: paddy_beaver
          text: 你好，麝鼠杰里！怎么，你认不出我了？
        - id: ch01-b11
          speaker: narrator
          text: 那声音里一点儿怒气也没有。陌生人告诉杰里，自己是他的大个子表亲海狸帕迪，还说希望两个人能交个朋友。
        - id: ch01-b12
          speaker: narrator
          text: 周围的一切都没有变。陌生的池塘还在那里，水坝还在那里，杰里、高大的陌生人和夜色里的黑影也都没有动。可几句和气的话说出口以后，一切似乎又完全不同了。
        - id: ch01-b13
          speaker: narrator
          text: 杰里心里那份巨大的恐惧从心头彻底退了下去，一个大大的希望冒了出来。说不定，他们根本不会起冲突。杰里赶紧用自己最客气的口吻回答帕迪，帕迪对他也同样客气。
        - id: ch01-b14
          speaker: narrator
          text: 杰里原本认定，找到筑坝的人以后，他们准会变成敌人。可他还没弄明白是怎么回事，两个人竟成了最要好的朋友。只因为海狸帕迪说对了话，也用对了口气。
        - id: ch01-b15
          speaker: paddy_beaver
          text: 不过，杰里表弟，你还没跟我说呢。你为什么要在我的水坝上挖出那些洞？
        - id: ch01-b16
          speaker: narrator
          text: 杰里一时不知该怎么答。他太喜欢这位刚认识的大个子表亲了，不愿直说这道坝根本不该拦住欢笑小溪。他生怕这样一说，就会伤了帕迪的心。
        - id: ch01-b17
          speaker: narrator
          text: 可他又想让帕迪知道，欢笑小溪和微笑池塘已经被弄成了什么样。最后，杰里拿定主意，要把事情从头到尾全说出来。
