  chapters:
    - id: ch01
      title: "CHAPTER XXII: Jerry Loses His Fear"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Oh, tell me, each and every one. Have you ever heard it said that, of all the things both great and wonderful, the spoken word is greatest?
        - id: ch01-b02
          speaker: narrator
          text: It is true. In fact, Jerry Muskrat would tell you it is the truest thing there is. Jerry knows that words are more than sounds. They are little messengers. Once you send them out, you can never call them back.
        - id: ch01-b03
          speaker: narrator
          text: Sometimes that is very sad. Those messengers may carry anger, hate, fear, or something untrue to someone else. Things like those cause most of the trouble in this world. But words may carry love, sympathy, helpfulness, or kindness instead. Things like those bring most troubles to an end.
        - id: ch01-b04
          speaker: narrator
          text: Just think about Jerry Muskrat. He was sitting on the new dam that had formed the strange pond in the Green Forest. A stranger much, much bigger than Jerry was climbing onto the dam, and Jerry shook so hard with fear that his teeth chattered.
        - id: ch01-b05
          speaker: narrator
          text: Jerry had already seen that the stranger could swim just as well as he could. Jerry had no secret burrows in that pond, so if he needed to escape, there was nowhere for him to go.
        - id: ch01-b06
          speaker: narrator
          text: Somehow, no one had to tell Jerry that this stranger had built the dam. And Jerry had opened a hole in it twice, letting the strange pond drain into the Laughing Brook. If Jerry had built that dam himself, he knew he would be terribly angry with anyone who tried to ruin it. Yet that was exactly what Jerry had tried to do. He was too frightened even to run.
        - id: ch01-b07
          speaker: jerry_muskrat
          text: I should have let someone else stand watch.
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: Then the big stranger spoke, and there was not a bit of anger in his voice.
        - id: ch01-b09
          speaker: paddy_beaver
          text: Why, hello, Jerry Muskrat! Don't you recognize me? I'm Paddy the Beaver, your big cousin, and I hope we can be friends.
        - id: ch01-b10
          speaker: narrator
          text: Nothing around them had changed. The strange pond and the dam were the same. Jerry and the big stranger were still there under the black shadows of night. Yet a few pleasant words made everything feel different. Jerry's great fear fell away, and a great hope took its place. Maybe there would be no trouble after all.
        - id: ch01-b11
          speaker: narrator
          text: Jerry answered as politely as he could, and Paddy was just as polite in return. Jerry had been certain that he and the dam's builder would be enemies. Instead, he and Paddy were quickly becoming the best of friends. Paddy had simply said the right thing in the right way.
        - id: ch01-b12
          speaker: paddy_beaver
          text: But Cousin Jerry, you still haven't told me why you made those holes in my dam.
        - id: ch01-b13
          speaker: narrator
          text: Jerry was not sure what to say. He was so pleased with his big new cousin that he did not want to hurt Paddy's feelings. He did not want to say that the dam had no business crossing the Laughing Brook. But he also wanted Paddy to understand what the dam had done to the Laughing Brook and the Smiling Pool.
        - id: ch01-b14
          speaker: narrator
          text: At last, Jerry decided to tell him the whole story.
