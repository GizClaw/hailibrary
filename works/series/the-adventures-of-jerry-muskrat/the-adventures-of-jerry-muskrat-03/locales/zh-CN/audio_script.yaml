audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成持重，故作威严时带着一点诙谐
        timbre: 粗厚低沉
        pace: 缓慢
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰瑞
      tts:
        delivery: 有礼而机灵，着急时语气诚恳急切
        timbre: 清脆灵活
        pace: 稍快
        pitch: 中高音
    mother_muskrat:
      display_name: 麝鼠妈妈
      tts:
        delivery: 稳重关切，责问时严肃但不失慈爱
        timbre: 温厚沉静
        pace: 从容
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 淘气顽皮，说俏皮话时带着毫不拘束的坏笑
        timbre: 明快灵巧
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　微笑池塘的大智者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙曾祖父坐在一片宽大的绿睡莲叶上，半闭着眼睛。瞧他的样子，好像根本不知道大岩石上正在开会。其实哪能呢？微笑池塘四周的事，就算他没有亲眼瞧见，也总能听说。
        - id: ch01-b02
          speaker: narrator
          text: 快乐小微风一会儿在这儿，一会儿在那儿，到处飞来飞去，早把会上的一切全都告诉了他。所以，麝鼠杰瑞和小水獭乔刚朝这边游来，他就猜到了他们的来意。可杰瑞客客气气地问候他时，他偏偏装得十分惊讶。
        - id: ch01-b03
          speaker: jerry_muskrat
          text: 早上好，青蛙曾祖父。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 早上好，麝鼠杰瑞。今天这么早，你就出来啦。
        - id: ch01-b05
          speaker: jerry_muskrat
          text: 大家都在大岩石那边等着，请您过去一趟。
        - id: ch01-b06
          speaker: narrator
          text: 青蛙曾祖父眼里分明闪着笑，却故意把嗓门压得又粗又沉。
        - id: ch01-b07
          speaker: grandfather_frog
          text: 咕呱隆！麝鼠杰瑞，你是个小淘气，小水獭乔也不例外。说吧，这回又打算怎么捉弄我？
        - id: ch01-b08
          speaker: narrator
          text: 杰瑞和小乔听了，都有些难为情。他们平时的确没少对青蛙曾祖父耍花招。
        - id: ch01-b09
          speaker: jerry_muskrat
          text: 青蛙曾祖父，这一回真不是花招。大家在大岩石上开会，想办法阻止布朗农夫家的男孩，别让他再往微笑池塘周围和欢笑溪沿岸放捕兽夹。您年纪最大，见识也最多，大家都盼着您来出主意。请您过去吧。
        - id: ch01-b10
          speaker: narrator
          text: 青蛙曾祖父抚平黄白相间的背心，装作认真思量的样子。杰瑞和小乔等得不耐烦，急得动来动去。好半天，他才开了口。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 麝鼠杰瑞，你说得不错，我的年纪确实大了。可是从这里到大岩石，路可不近哪。
        - id: ch01-b12
          speaker: jerry_muskrat
          text: 那您就坐到我背上，我这就驮您过去！
        - id: ch01-b13
          speaker: grandfather_frog
          text: 我只怕你游到半路，会把我摔下去。
        - id: ch01-b14
          speaker: jerry_muskrat
          text: 我绝不会摔着您。您上来试试嘛！
        - id: ch01-b15
          speaker: narrator
          text: 青蛙曾祖父这才爬上杰瑞的背。杰瑞用最快的速度，驮着他游向大岩石。所有水貂、水獭、浣熊和麝鼠远远看见他们，立刻一起欢呼起来。大家有时会叫青蛙曾祖父“微笑池塘的大智者”。所谓大智者，就是特别有智慧的人。
        - id: ch01-b16
          speaker: narrator
          text: 浣熊博比扶青蛙曾祖父登上大岩石，让他舒舒服服地坐稳。随后，麝鼠妈妈说起了布朗农夫家的男孩和那些捕兽夹，也说到杰瑞的尾巴怎样被夹住。她把事情从头到尾讲完，便请青蛙曾祖父替大伙儿拿个主意。谁都知道，他是最有智慧的。
        - id: ch01-b17
          speaker: narrator
          text: 这句话一出口，青蛙曾祖父把胸脯鼓得高高的，黄白相间的背心眼看就要绷裂了。他静静坐了一会儿，直望着快活、圆滚滚、红彤彤的太阳公公，眼睛连眨也不眨。最后，他用极其低沉的声音宣布：
        - id: ch01-b18
          speaker: grandfather_frog
          text: 明天早晨，太阳升起来的时候，我会告诉你们该怎么做。
        - id: ch01-b19
          speaker: narrator
          text: 说完这句话，他便闭口不言。大家再怎么问，也没能让他多说半个字。
