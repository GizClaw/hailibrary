  chapters:
    - id: ch01
      title: "CHAPTER III: The Oracle Of The Smiling Pool"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog sat on his big green lily pad with his eyes half closed. Anyone looking at him might have thought he knew nothing about the meeting at the Big Rock. But of course he knew. Very little happened around the Smiling Pool without Grandfather Frog seeing it or hearing about it. The Merry Little Breezes went everywhere, and they had told him all the news. So when Jerry Muskrat and Little Joe Otter came swimming toward him, he knew exactly why they had come. Still, he acted very surprised when Jerry greeted him politely.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: Good morning, Grandfather Frog.
        - id: ch01-b03
          speaker: grandfather_frog
          text: Good morning, Jerry Muskrat. You're up and about early today.
        - id: ch01-b04
          speaker: jerry_muskrat
          text: If you please, everyone needs you over at the Big Rock.
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog's eyes twinkled. Then he made his voice sound deep and gruff.
        - id: ch01-b06
          speaker: grandfather_frog
          text: Chugarum! You're a rascal, Jerry Muskrat, and so is Little Joe Otter. What sort of trick are you two trying to play on me now?
        - id: ch01-b07
          speaker: narrator
          text: Jerry and Little Joe looked a little ashamed. They were always trying to play tricks on Grandfather Frog.
        - id: ch01-b08
          speaker: jerry_muskrat
          text: Honest, Grandfather Frog, this time it isn't a trick. Everyone is meeting at the Big Rock. We're trying to decide how to stop Farmer Brown's boy from setting traps around the Smiling Pool and beside the Laughing Brook. We all want your advice because you're so old and wise. Please come with us.
        - id: ch01-b09
          speaker: narrator
          text: Grandfather Frog smoothed his white and yellow waistcoat. He pretended to think very hard while Jerry and Little Joe fidgeted and waited. At last, he answered.
        - id: ch01-b10
          speaker: grandfather_frog
          text: As you said, Jerry Muskrat, I am very old. And the Big Rock is a long way from here.
        - id: ch01-b11
          speaker: jerry_muskrat
          text: Climb onto my back. I'll carry you straight over there!
        - id: ch01-b12
          speaker: grandfather_frog
          text: I fear you might tip me off into the water.
        - id: ch01-b13
          speaker: jerry_muskrat
          text: I won't, I promise. Just climb on and you'll see.
        - id: ch01-b14
          speaker: narrator
          text: Grandfather Frog climbed onto Jerry's back, and Jerry hurried toward the Big Rock as fast as he could. All the Minks, Otters, Coons, and Muskrats cheered when they saw them coming. Grandfather Frog was sometimes called the oracle of the Smiling Pool. An oracle is someone known for being very wise.
        - id: ch01-b15
          speaker: narrator
          text: Bobby Coon helped Grandfather Frog climb onto the Big Rock. Once the old frog was settled comfortably, Mother Muskrat explained everything. She told him about Farmer Brown's boy and the traps. She told him how one trap had caught Jerry by the tail. Then she asked what they should do, because everyone trusted his wisdom.
        - id: ch01-b16
          speaker: mother_muskrat
          text: Grandfather Frog, what do you advise us to do?
        - id: ch01-b17
          speaker: narrator
          text: At those words, Grandfather Frog puffed himself up so proudly that his white and yellow waistcoat looked ready to burst. For a while, he sat perfectly still. He stared straight at jolly, round, red Mr. Sun without blinking even once. Then, in a very deep voice, he gave his answer.
        - id: ch01-b18
          speaker: grandfather_frog
          text: Tomorrow morning, when the sun rises, I will tell you what to do.
        - id: ch01-b19
          speaker: narrator
          text: And after that, they could not get another word out of him.
