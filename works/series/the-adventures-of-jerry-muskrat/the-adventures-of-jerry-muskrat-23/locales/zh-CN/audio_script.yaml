audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 坦率友善，沉稳中带着北方来客的爽朗
        timbre: 宽厚结实
        pace: 从容
        pitch: 中低音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十三章　海狸帕迪做了件好事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海狸帕迪静静地听着。小表弟麝鼠杰里把事情从头讲起，告诉他，这道水坝给欢笑小溪和微笑池塘惹来了多少麻烦。
        - id: ch01-b02
          speaker: jerry_muskrat
          text: 你看，住在微笑池塘的伙伴们都真心喜欢那里，谁都不想走。可欢笑小溪要是断了水，微笑池塘也会消失，我们就只能搬去大河。正因为这样，我才想挖坏你的水坝。
        - id: ch01-b03
          speaker: narrator
          text: 帕迪听完，眼睛里闪着笑意。
        - id: ch01-b04
          speaker: paddy_beaver
          text: 好吧，你现在也明白了。你弄不坏这道坝，我比你高大，能把你拦下来。那你接下来准备怎么办？
        - id: ch01-b05
          speaker: jerry_muskrat
          text: 我不知道。我真的想不出别的办法。你又高又壮，当然想做什么都行。可我们已经在这里住了这么久，只因为你这个外来的客人碰巧想住下，我们就非得搬走，离开自己最喜欢的一切。这实在不公平。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 忽然，一个新主意跳进了杰里的脑袋。他的眼睛一下亮了。
        - id: ch01-b07
          speaker: jerry_muskrat
          text: 有了！你搬到下面去，跟我们一起住在微笑池塘，不就行了吗？我敢说，那里的地方肯定够大！
        - id: ch01-b08
          speaker: narrator
          text: 帕迪摇了摇头。
        - id: ch01-b09
          speaker: paddy_beaver
          text: 不行。
        - id: ch01-b10
          speaker: narrator
          text: 杰里的心顿时沉了下去。
        - id: ch01-b11
          speaker: paddy_beaver
          text: 我没法搬过去，那里没有我爱吃的食物。而且住在微笑池塘，我一点儿也不会安心。你知道，我一向住在树林里，所以真的不能搬去那里。不过，杰里表弟，让你操了这么多心，我确实很抱歉。我会让你看到，我是真心这么想的。你坐在这儿，等我回来。
        - id: ch01-b12
          speaker: narrator
          text: 杰里还没猜到帕迪想干什么，帕迪就一头扎进池塘。潜下去时，他那条宽尾巴啪地拍在水面上，把杰里吓了一跳。紧接着，水底响起一阵忙乱的动静。
        - id: ch01-b13
          speaker: narrator
          text: 没过几分钟，一根树枝浮了上来，又一根树枝浮了上来。池水越来越浑，杰里根本看不清水底发生了什么。帕迪在水下待了那么久，杰里忍不住纳闷，他不呼吸，怎么受得了呢？
        - id: ch01-b14
          speaker: narrator
          text: 其实，帕迪一直在逗他。他会悄悄浮上来，只把鼻子尖露出水面。等肺里重新装满新鲜空气，他又潜了下去。
        - id: ch01-b15
          speaker: narrator
          text: 忽然，杰里听见了一个声音。他那双滑稽的短耳朵马上竖了起来，身子猛地一转，越过水坝望向另一边的欢笑小溪。
        - id: ch01-b16
          speaker: narrator
          text: 你猜他听见了什么？是水奔流起来的声音。杰里已经好久没听过这么悦耳的声音了。水坝上出现了一个大洞，溪水正从洞里冲下去，欢笑小溪终于又笑了起来。
        - id: ch01-b17
          speaker: paddy_beaver
          text: 怎么样，杰里表弟？你喜欢这样吗？
        - id: ch01-b18
          speaker: narrator
          text: 声音就在杰里耳边。原来帕迪已经爬上岸，站到了他身旁，两眼还闪着笑意。
        - id: ch01-b19
          speaker: jerry_muskrat
          text: 太……太好了！可是，你把自己的水坝挖坏了呀！
          emotion: surprised
        - id: ch01-b20
          speaker: paddy_beaver
          text: 噢，这没什么。我现在本来也不需要它。每年到了这个时候，我通常都不筑坝。只是这里看起来很适合拦一道坝，我才造着玩儿的。
        - id: ch01-b21
          speaker: paddy_beaver
          text: 我原本只是从这里经过，觉得这个地方不错，便想住上一阵。我根本不知道微笑池塘会受影响。现在，我该继续赶路了。我要找个不会打扰别人的地方，等秋天来了，再筑坝蓄一片池塘。我不喜欢别人打扰我，也不愿给别人添麻烦。绿森林真是个好地方。
        - id: ch01-b22
          speaker: jerry_muskrat
          text: 是全世界最好的地方！当然啦，绿草地和微笑池塘除外。帕迪表哥，你就留下来吧，好不好？我敢说，大伙儿都会欢迎你。
        - id: ch01-b23
          speaker: grandfather_frog
          text: 我们当然欢迎你。
        - id: ch01-b24
          speaker: narrator
          text: 一个粗哑的声音突然从他们身边传来。说话的是青蛙曾祖父。帕迪望着前方，认真想了想。
        - id: ch01-b25
          speaker: paddy_beaver
          text: 也许我会留下。只要能在欢笑小溪里找到几个适合藏身的地方。
