  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: practical, steady, and good-natured
        timbre: warm and sturdy
        pace: moderate
        pitch: medium
    paddy_beaver:
      display_name: Paddy the Beaver
      tts:
        delivery: capable, friendly, and quietly amused
        timbre: broad and mellow
