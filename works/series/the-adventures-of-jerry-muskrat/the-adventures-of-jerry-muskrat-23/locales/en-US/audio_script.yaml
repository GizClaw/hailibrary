  chapters:
    - id: ch01
      title: "CHAPTER XXIII: Paddy The Beaver Does A Kind Deed"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Paddy the Beaver listened as his little cousin Jerry Muskrat explained all the trouble Paddy's dam had caused in the Laughing Brook and the Smiling Pool.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: You see, those of us who live in the Smiling Pool love our home. We don't want to leave it. But if water can't come down the Laughing Brook, there won't be any Smiling Pool. Then we'll have to move away to the Big River. That's why I tried to tear open your dam.
        - id: ch01-b03
          speaker: narrator
          text: Paddy's eyes twinkled when he answered.
        - id: ch01-b04
          speaker: paddy_beaver
          text: Well, you've learned that you can't tear it open. I'm bigger than you, and I can stop you. So what will you do now?
        - id: ch01-b05
          speaker: jerry_muskrat
          text: I don't know. I can't see anything we can do. You're big and strong, so of course you can have your way. But those of us in the Smiling Pool have lived here a long, long time. It doesn't seem right that we should lose our home and everything we love just because a stranger wants to live here.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: Then a new idea came to Jerry, and his eyes began to sparkle.
        - id: ch01-b07
          speaker: jerry_muskrat
          text: Wait, I have an idea! Could you come live with us in the Smiling Pool? I'm sure there's plenty of room for you!
        - id: ch01-b08
          speaker: narrator
          text: Paddy shook his head.
        - id: ch01-b09
          speaker: paddy_beaver
          text: No, I can't do that.
        - id: ch01-b10
          speaker: narrator
          text: Jerry's heart sank. Then Paddy explained.
        - id: ch01-b11
          speaker: paddy_beaver
          text: The food I eat doesn't grow down there. And I wouldn't feel safe in the Smiling Pool. I always make my home in the woods, so I simply couldn't live down there. But Cousin Jerry, I truly am sorry I've caused you so much worry. I'll prove it, too. Sit right here and wait for me to come back.
        - id: ch01-b12
          speaker: narrator
          text: Before Jerry could guess what Paddy meant to do, the Beaver dived into the pond. As he disappeared, his broad tail struck the water with such a loud slap that Jerry jumped.
        - id: ch01-b13
          speaker: narrator
          text: Then something began stirring up the water below. A stick bobbed to the surface. Another came up after it, and then another. Soon the water was so muddy that Jerry couldn't see what was happening underneath.
        - id: ch01-b14
          speaker: narrator
          text: Paddy stayed out of sight for a long time. Jerry wondered how anyone could remain underwater for so long without breathing. But Paddy was only fooling him. Every so often, Paddy rose just enough to poke his nose above the surface and fill his lungs with fresh air. Then down he went again.
        - id: ch01-b15
          speaker: narrator
          text: All at once, Jerry heard a sound that made his funny little short ears stand up. He spun around and looked over the far side of the dam toward the Laughing Brook.
        - id: ch01-b16
          speaker: narrator
          text: Can you guess what Jerry heard? It was rushing water, and no sound had seemed so sweet to him in a very long time. A great hole now opened through the dam. Water hurried into the Laughing Brook, and already the brook was beginning to laugh again.
        - id: ch01-b17
          speaker: paddy_beaver
          text: Well, Cousin Jerry, how do you like that?
        - id: ch01-b18
          speaker: narrator
          text: The voice came from right beside Jerry's ear. Paddy had climbed onto the dam beside him, and his eyes were twinkling.
        - id: ch01-b19
          speaker: jerry_muskrat
          text: I... I think it's wonderful! But Paddy, you've ruined your own dam!
          emotion: surprised
        - id: ch01-b20
          speaker: paddy_beaver
          text: Oh, that's all right. I didn't truly need this dam. I don't usually build one at this time of year. This spot looked so good for a dam that I made one just for fun. I was traveling through the Green Forest, and I liked the place enough to stay awhile. I knew nothing about the Smiling Pool.
        - id: ch01-b21
          speaker: paddy_beaver
          text: Now I suppose I'll keep traveling. In the fall, I'll find a place where I can make a pond without causing trouble for anyone else. I don't enjoy being troubled myself, so I don't want to trouble other people. The Green Forest certainly is a fine place.
        - id: ch01-b22
          speaker: jerry_muskrat
          text: It's the finest place in the whole world, except for the Green Meadows and the Smiling Pool! Won't you stay, Cousin Paddy? I'm sure everyone would be glad to have you here.
        - id: ch01-b23
          speaker: grandfather_frog
          text: Of course we would.
        - id: ch01-b24
          speaker: narrator
          text: The gruff voice came from right beside them. It belonged to Grandfather Frog. Paddy looked thoughtful for a moment.
        - id: ch01-b25
          speaker: paddy_beaver
          text: Perhaps I will stay, if I can find some good places to hide along the Laughing Brook.
