  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: lively, boastful, and youthful
        timbre: bright and nimble
        pace: quick
        pitch: medium-high
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: eager and playful
        timbre: bright and lively
