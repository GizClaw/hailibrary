  chapters:
    - id: ch01
      title: "CHAPTER V: A Busy Day At The Smiling Pool"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everybody was excited. Yes, Sir, everyone in the Smiling Pool and along the Laughing Brook was bubbling over with it. Even Spotty the Turtle climbed to the highest point of an old log so he could see what was happening. Spotty usually took things so calmly that some people thought he was stupid.
        - id: ch01-b02
          speaker: narrator
          text: Only Grandfather Frog seemed not to notice anything unusual. He sat on his big green lily pad, watching for foolish green flies to eat for breakfast. Really, he was every bit as excited as the others. But he was very old and thought to be very wise, so he felt he must not show it.
        - id: ch01-b03
          speaker: narrator
          text: What had stirred everyone up? All the Minks, Coons, Otters, and Muskrats who lived and played around the pool and brook were searching for traps. They were hunting for the traps Farmer Brown's boy had set, just as Grandfather Frog had advised them to do.
        - id: ch01-b04
          speaker: narrator
          text: Jerry Muskrat and Little Joe Otter searched together. They swam close to the bank where the Laughing Brook leaves the Smiling Pool. Then Jerry wrinkled his funny little nose and stopped. He sniffed once, twice, three times. Cold shivers ran all the way down his back and out to the tip of his tail.
        - id: ch01-b05
          speaker: little_joe_otter
          text: What do you smell?
        - id: ch01-b06
          speaker: jerry_muskrat
          text: It's that man-smell.
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: Just then Little Joe took one long sniff.
        - id: ch01-b08
          speaker: little_joe_otter
          text: Why, that's fish! I can smell fish!
        - id: ch01-b09
          speaker: narrator
          text: His eyes sparkled, and off he went toward the smell. Little Joe could swim faster than Jerry. In no time, he was calling back with delight.
        - id: ch01-b10
          speaker: little_joe_otter
          text: Jerry, come see! Someone left a fish right at the edge of the bank. We're going to have a feast!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Jerry swam as fast as he could. The closer he came, the stronger that dreadful man-smell grew. His eyes opened wide with fright.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: Don't touch that fish! Leave it alone, Joe!
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: Little Joe only laughed. He reached toward the fish.
        - id: ch01-b14
          speaker: little_joe_otter
          text: What's wrong, Jerry? Are you afraid I'll finish it before you get here?
        - id: ch01-b15
          speaker: jerry_muskrat
          text: Stop right there!
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Jerry shrieked and shoved Little Joe at the very moment Little Joe touched the fish. Snap! A pair of wicked steel jaws flew shut and caught the claw on one of Little Joe's toes. Without Jerry's push, the trap would have caught his whole foot.
        - id: ch01-b17
          speaker: little_joe_otter
          text: Oh, my toe! It hurts!
        - id: ch01-b18
          speaker: jerry_muskrat
          text: Maybe next time you'll remember Grandfather Frog's warning. When you find food where there never was any before, you have to watch out.
        - id: ch01-b19
          speaker: narrator
          text: Jerry helped Little Joe pull free. Little Joe escaped, but the claw stayed in the trap, and his toe was terribly sore afterward. Then the two of them buried the trap deep in the mud and went searching for another one.
        - id: ch01-b20
          speaker: narrator
          text: Their cousins, uncles, aunts, and friends were just as busy all around the Smiling Pool and along the Laughing Brook. Every now and then, one of them came as close to being caught as Little Joe had.
        - id: ch01-b21
          speaker: narrator
          text: All that time, up at the farmhouse, Farmer Brown's boy was planning what he would do with the skins of the little animals he felt sure his traps would catch.
