audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机灵活泼，警觉时说话急切而直截了当
        timbre: 清脆灵巧
        pace: 稍快
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　微笑池塘忙碌的一天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一天，大家全都激动极了。是的，先生，微笑池塘里和欢笑溪沿岸的每一个居民，都兴奋得像要冒出泡来。斑点龟平时总是慢吞吞、不慌不忙，常有人觉得他傻乎乎的。可这回，连他也爬上一根老木头的最高处，想把发生的事看个清楚。
        - id: ch01-b02
          speaker: narrator
          text: 只有青蛙曾祖父像是什么也没察觉。他坐在宽大的绿睡莲叶上，只顾等傻乎乎的绿苍蝇来当早餐。其实，他心里一点儿也不比别人平静。可他年纪那么大，大家又都说他聪明得不得了，怎么好把激动写在脸上呢？
        - id: ch01-b03
          speaker: narrator
          text: 到底出了什么事？原来，住在微笑池塘和欢笑溪四周的水貂、浣熊、水獭和麝鼠，全都忙着找捕兽夹。他们照青蛙曾祖父的吩咐，四处寻找布朗农夫家的男孩设下的夹子。
        - id: ch01-b04
          speaker: narrator
          text: 麝鼠杰里和小水獭乔结伴搜寻。他们贴着岸边游到欢笑溪流出微笑池塘的地方，杰里忽然皱起小鼻子，不游了。他一下、两下、三下，使劲嗅着。一阵冰凉的寒颤顺着脊背窜下去，一直窜到了尾巴尖。
        - id: ch01-b05
          speaker: little_joe_otter
          text: 你闻到什么了？
        - id: ch01-b06
          speaker: jerry_muskrat
          text: 有人的气味。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 小水獭乔也长长地吸了吸鼻子，眼睛一下亮了起来。
        - id: ch01-b08
          speaker: little_joe_otter
          text: 哎呀，是鱼！我闻到鱼味啦！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 他马上朝着气味游去。乔比杰里游得快，转眼就冲到了前头，欢天喜地地喊起来。
        - id: ch01-b10
          speaker: little_joe_otter
          text: 嗨，杰里！岸边有人落下一条鱼。咱们可以美美吃上一顿啦！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 杰里拼命往前游。离那条鱼越近，人的气味就越浓，也越叫他害怕。他吓得眼睛都快瞪出来了，一边喘气一边大喊。
        - id: ch01-b12
          speaker: jerry_muskrat
          text: 别碰那条鱼！乔，千万别碰！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 小水獭乔却笑了，还伸出爪子去拿鱼。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 杰里，你慌什么？怕我不等你过来，就把鱼全吃光吗？
        - id: ch01-b15
          speaker: jerry_muskrat
          text: 快住手！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 杰里尖叫着冲上去。就在乔碰到鱼的一刹那，他猛地推了乔一把。啪！一对凶狠的钢铁夹口飞快合拢，咬住了乔一根脚趾上的爪尖。要不是杰里那一推，夹住的可就是整只脚了。
        - id: ch01-b17
          speaker: little_joe_otter
          text: 哎哟！哎哟！疼死我啦！
        - id: ch01-b18
          speaker: jerry_muskrat
          text: 下次再在从来没有食物的地方发现好吃的，你总该记得青蛙曾祖父为什么叫我们当心了吧。
        - id: ch01-b19
          speaker: narrator
          text: 杰里帮乔挣脱了捕兽夹。乔总算脱了身，爪尖却留在夹子里，脚趾疼得厉害。随后，他们把捕兽夹深深埋进泥里，又去寻找下一只。
        - id: ch01-b20
          speaker: narrator
          text: 微笑池塘四周和欢笑溪沿岸，大家的堂表兄弟、叔伯舅父、姑姨婶母和朋友们也都忙个不停。时不时就有谁跟乔一样，差点儿被夹个正着。
        - id: ch01-b21
          speaker: narrator
          text: 可就在这段时间里，农舍那边的布朗农夫家的男孩还在盘算。他认定那些小动物逃不出自己的夹子，已经想着捉住它们以后，该拿它们的毛皮做些什么了。
