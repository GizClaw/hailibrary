audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十章　杰里大失所望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上的事，没有一桩准得了。任你怎样盘算筹谋，到头来也只能尽力而为，把能做的做到最好。
        - id: ch01-b02
          speaker: narrator
          text: 麝鼠杰里蜷起身子，准备睡上一夜。他累坏了，眼睛都快睁不开，好不容易才找到舒服的睡处。可他心里真快活。因为他听见，欢笑小溪又在笑了。那笑声还很轻，只在水里咕噜咕噜地响。不过杰里知道，再等一会儿，小溪就会放声大笑。笑声会唱遍绿森林，让每个听见它的人都跟着高兴。
        - id: ch01-b03
          speaker: narrator
          text: 杰里当然高兴。欢笑小溪能重新笑起来，不就是他的功劳吗？有人横着小溪筑起一道坝，拦住了溪水，也叫它没法再笑。杰里整整忙了一天，终于在坝上凿开一个洞。现在水又流起来了。用不了多久，坝后那个陌生的池塘就会消失，欢笑小溪和微笑池塘也会恢复从前美丽的模样。
        - id: ch01-b04
          speaker: narrator
          text: 白天实在太累，杰里这才早早睡下。换作平常，他总爱白天睡一阵，晚上再出去活动。
        - id: ch01-b05
          speaker: narrator
          text: 那天夜里，杰里做了一个香甜的梦。他梦见亲爱的微笑池塘又露出了笑脸，就跟这场麻烦还没发生时一样，也是他从小看到大的模样。
        - id: ch01-b06
          speaker: narrator
          text: 等斑点龟找到杰里，把他叫醒，天已经大亮了。杰里打个哈欠，伸伸懒腰，又躺着听了一会儿。他想听欢笑小溪悦耳的水声，可四周静悄悄的，什么也听不见。
        - id: ch01-b07
          speaker: narrator
          text: 杰里心里犯起了嘀咕，难道自己还在做梦？他转头看看斑点龟，马上就知道自己醒着。斑点龟的脸上，分明写满了担心。
        - id: ch01-b08
          speaker: spotty_turtle
          text: 快起来吧，杰里。去瞧瞧你昨天在坝上挖的洞。你那活儿恐怕没做好，洞又堵住了，现在一点水也流不出去。
        - id: ch01-b09
          speaker: jerry_muskrat
          text: 我怎么没做好！我已经把自己的本事全使出来了。你们这些懒家伙，只会坐着晒太阳、打瞌睡，还说是在替我守望。要是嫌我干得不好，你们倒是自己动手呀！
          emotion: angry
        - id: ch01-b10
          speaker: spotty_turtle
          text: 我——我向你道歉，杰里。我不是想那么说。你知道，我们大家都急坏了。昨晚还想着，等今天早晨一到，欢笑小溪就会重新装满水。到时候，我们想回微笑池塘就能回去。谁知道，现在还是跟原来一样糟。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 也许只是树枝和草顺着水漂下来，又把洞堵上了。一定是这样。
        - id: ch01-b12
          speaker: narrator
          text: 杰里又有了希望，急忙赶到水坝跟前。他先站在欢笑小溪这边，仔仔细细看了一遍。接着，他游到水坝另一边，潜进了水里。
        - id: ch01-b13
          speaker: narrator
          text: 杰里在水下待了好久。水貂比利正要潜下去，看看他究竟出了什么事，杰里终于浮了上来。
        - id: ch01-b14
          speakers: [spotty_turtle, grandfather_frog, billy_mink, little_joe_otter]
          ensemble: chorus
          text: 到底出了什么事？是不是水里漂来的东西又把洞堵住了？
        - id: ch01-b15
          speaker: narrator
          text: 杰里慢慢爬出水面，摇了摇头。
        - id: ch01-b16
          speaker: jerry_muskrat
          text: 不是。堵住洞的根本不是水冲来的杂物。有人拿树枝和泥巴，特意把洞塞住了。昨天我费了那么大的力气才把它挖开，现在又让人堵死了。我还得再干整整一天，才能重新挖通。
        - id: ch01-b17
          speaker: narrator
          text: 青蛙曾祖父、斑点龟、水貂比利、小水獭乔，还有麝鼠杰里，你看看我，我看看你。过了好半天，谁也没有说一句话。
