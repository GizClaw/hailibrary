  chapters:
    - id: ch01
      title: "CHAPTER XX: Jerry Has A Dreadful Disappointment"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Nothing in this world is certain, however carefully we scheme and plan. All we can do is try our very best, and be content with that.
        - id: ch01-b02
          speaker: narrator
          text: Jerry Muskrat curled up for the night. He was so tired that he could scarcely keep his eyes open long enough to find a comfortable place. Still, Jerry was happy. Yes, indeed, he was happy. He could hear the Laughing Brook beginning to laugh once more. For now, it was only a low little gurgle. But Jerry knew that before long it would become the full, merry laugh that made music through the Green Forest and brought happiness to everyone who heard it.
        - id: ch01-b03
          speaker: narrator
          text: And hadn't Jerry helped the brook begin to laugh again? He had worked through the whole long day, digging a hole in the dam that someone had built across the Laughing Brook. That dam had stopped its laughter. Now the water was flowing again. Soon the strange new pond behind the dam would disappear from the Green Forest. Then the Laughing Brook and the Smiling Pool would be their own beautiful selves again.
        - id: ch01-b04
          speaker: narrator
          text: All that hard work was why Jerry was going to sleep at night. Usually, he preferred to sleep for part of the day and go out after dark.
        - id: ch01-b05
          speaker: narrator
          text: Jerry had very pleasant dreams that night. He dreamed of his dear Smiling Pool, smiling just as it always had before this trouble began. He was still dreaming in broad daylight when Spotty the Turtle found him and woke him.
        - id: ch01-b06
          speaker: narrator
          text: Jerry yawned and stretched. Then he lay quiet for a moment, listening for the pleasant murmur of the Laughing Brook. He heard no murmur. He heard nothing at all. For a moment, Jerry wondered whether he was truly awake. Then he saw the worried look on Spotty's face, and he knew he was.
        - id: ch01-b07
          speaker: spotty_the_turtle
          text: Get up, Jerry Muskrat. You need to come see the hole you made in the dam yesterday. The hole has filled up, and the water has stopped running. I'm afraid you may not have done the job very well.
        - id: ch01-b08
          speaker: narrator
          text: Jerry snapped at him crossly.
        - id: ch01-b09
          speaker: jerry_muskrat
          text: I did do it well! I did it as well as I possibly could. If you lazy folks don't like my work, stop sitting around taking naps in the sun while you pretend to keep watch. Get busy and do some work yourselves!
          emotion: angry
        - id: ch01-b10
          speaker: spotty_the_turtle
          text: I—I beg your pardon, Jerry Muskrat. I didn't mean it the way it sounded. We're all worried. Last night, we thought the Laughing Brook would be full of water again by morning. We thought we could return to the Smiling Pool whenever we pleased. But now everything is just as bad as it was before.
        - id: ch01-b11
          speaker: jerry_muskrat
          text: Maybe some sticks and grass floated down with the water and clogged my hole. Yes, that must be what happened.
        - id: ch01-b12
          speaker: narrator
          text: Jerry spoke hopefully as he hurried toward the dam. First, he examined it carefully from the Laughing Brook side. Then he went around to the other side and dived beneath the water.
        - id: ch01-b13
          speaker: narrator
          text: He stayed underwater for a long time. Billy Mink was just about to dive in and find out what had happened to him when Jerry finally came back up.
        - id: ch01-b14
          speakers: [spotty_the_turtle, grandfather_frog, billy_mink, little_joe_otter]
          ensemble: chorus
          text: What's wrong? Did things floating in the water clog the hole?
        - id: ch01-b15
          speaker: narrator
          text: Jerry shook his head and slowly climbed out of the water.
        - id: ch01-b16
          speaker: jerry_muskrat
          text: No. The water didn't carry anything into the hole. Someone packed it full of sticks and mud. Somebody filled the hole I worked so hard to make yesterday. Now it will take me the whole day to open it again.
        - id: ch01-b17
          speaker: narrator
          text: Grandfather Frog, Spotty the Turtle, Billy Mink, Little Joe Otter, and Jerry Muskrat stared at one another. For a long time, not one of them spoke a word.
