  chapters:
    - id: ch01
      title: "CHAPTER XI: Five Heads Together"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Something had to be done. Jerry Muskrat said so. Grandfather Frog, Billy Mink, and Little Joe Otter said so too. Even Spotty the Turtle agreed. The Laughing Brook could no longer laugh, and the Smiling Pool could no longer smile. There wasn't enough water left in either one for that. No one knew whether there would ever be enough water again. They had never known anything like this to happen before. They didn't know what to think, and they didn't know what to do. But every one of them felt sure they had to do something.
        - id: ch01-b02
          speaker: grandfather_frog
          text: What do you think we should do, Billy Mink?
        - id: ch01-b03
          speaker: narrator
          text: Billy looked down from the top of the Big Rock. Below him was the little pool of water that was all the Smiling Pool had left. He could see a dozen fat trout in it. Usually Billy would have wanted to catch them, and now it would have been easy. There was nowhere for the trout to swim away from him. Somehow, though, Billy didn't want to catch them. Nearly all the water had run away from the Laughing Brook and the Smiling Pool. The trout were already frightened almost to death, and Billy felt sorry for them.
        - id: ch01-b04
          speaker: billy_mink
          text: Our best choice is to move down to the Big River. I've been there, and the river is fine.
        - id: ch01-b05
          speaker: little_joe_otter
          text: I agree. The Big River isn't going to dry up.
        - id: ch01-b06
          speaker: jerry_muskrat
          text: How can you be sure? The Laughing Brook and the Smiling Pool had never gone dry before, either.
        - id: ch01-b07
          speaker: spotty_turtle
          text: And the Big River is a very, very long way from here.
        - id: ch01-b08
          speaker: narrator
          text: Spotty broke into the discussion. He traveled very, very slowly, and wherever he went, he carried his house along with him.
        - id: ch01-b09
          speaker: grandfather_frog
          text: Chugarum! I, for one, don't want to leave the Smiling Pool until we find out what's wrong. You know that nothing happens without a cause to make it so. There must be some cause, some reason, for this terrible trouble at the Smiling Pool. If we can find that reason, perhaps we'll know better what to do.
        - id: ch01-b10
          speaker: narrator
          text: Jerry Muskrat nodded.
        - id: ch01-b11
          speaker: jerry_muskrat
          text: Grandfather Frog is right. There must be a cause. But where should we look? I've searched the whole Smiling Pool, and I'm sure the trouble isn't here.
        - id: ch01-b12
          speaker: narrator
          text: Grandfather Frog actually smiled.
        - id: ch01-b13
          speaker: grandfather_frog
          text: Chugarum! Of course the trouble isn't in the Smiling Pool. Anyone should know that!
        - id: ch01-b14
          speaker: jerry_muskrat
          text: If you know so much, then tell us where it is!
          emotion: angry
        - id: ch01-b15
          speaker: grandfather_frog
          text: Why, it's in the Laughing Brook, of course.
        - id: ch01-b16
          speaker: billy_mink
          text: It can't be! I followed the Laughing Brook all the way down to the Big River, and I found nothing wrong.
        - id: ch01-b17
          speaker: grandfather_frog
          text: But did you follow it all the way up to the place where it begins?
        - id: ch01-b18
          speaker: billy_mink
          text: No-o, I didn't.
        - id: ch01-b19
          speaker: grandfather_frog
          text: Then that's where we'll find the cause of all this trouble. Water flows down the Laughing Brook and fills the Smiling Pool. The pool couldn't dry up unless the brook stopped running first.
        - id: ch01-b20
          speaker: narrator
          text: Grandfather Frog said this just as if he knew all about the trouble and had understood it from the start.
        - id: ch01-b21
          speaker: little_joe_otter
          text: That's true! I never thought of it that way. Billy Mink and I can go far up the Laughing Brook and see what we find.
          emotion: surprised
        - id: ch01-b22
          speaker: grandfather_frog
          text: Chugarum! We should all go.
        - id: ch01-b23
          speaker: narrator
          text: So the five of them put their heads together. They decided to travel up the Laughing Brook and hunt for the cause of the trouble.
