audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙曾祖父
      tts:
        delivery: 老成悠然，说话慢条斯理，略带诙谐
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 机敏直率，忧虑时语气低落而真诚
        timbre: 温和清晰
        pace: 中等
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼爽朗，兴奋时热情奔放
        timbre: 明亮有朝气
        pace: 明快
        pitch: 中高音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章　五个脑袋凑到一起
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家都觉得，非得想个办法不可。麝鼠杰里这么说，青蛙曾祖父这么说，比利水貂这么说，小水獭乔也这么说，就连斑点龟都赞成。欢笑小溪笑不出来了，微笑池塘也露不出笑脸。它们剩下的水太少，而且谁也不知道，以后究竟还能不能重新欢笑。从前谁也没见过这样的怪事，大家不知道该怎么想，更不知道该怎么办。可有一点谁都明白，他们必须想个办法。
        - id: ch01-b02
          speaker: grandfather_frog
          text: 比利水貂，你觉得该怎么办？
        - id: ch01-b03
          speaker: narrator
          text: 比利站在大岩石顶上，望着微笑池塘仅剩的那一小洼水。水里有十来条肥美的鳟鱼，已经无处可逃。它们根本没有地方能从比利身边游开，所以他想抓哪条都易如反掌。可比利偏偏不想抓。池塘和小溪里的水几乎全跑光了，鳟鱼早已吓得半死。比利看着它们，心里竟有些不忍。
        - id: ch01-b04
          speaker: billy_mink
          text: 我看，我们能做的最好选择就是搬到下游的大河去。我亲自去过那儿，那边一切都好。
        - id: ch01-b05
          speaker: little_joe_otter
          text: 我也赞成。大河一点儿干掉的危险也没有。
        - id: ch01-b06
          speaker: jerry_muskrat
          text: 你怎么知道？欢笑小溪和微笑池塘以前也从没干过呀。
        - id: ch01-b07
          speaker: spotty_turtle
          text: 可是，要到大河去，得走好远好远呢。
        - id: ch01-b08
          speaker: narrator
          text: 斑点龟走起路来慢极了，慢极了，而且无论走到哪里，都得把自己的房子背在身上。
        - id: ch01-b09
          speaker: grandfather_frog
          text: 咕咕隆！反正我不愿意就这么离开微笑池塘。咱们得先弄清楚，这场麻烦到底是怎么来的。你们都知道，世间万事皆有因，无因无果不成真。
        - id: ch01-b10
          speaker: grandfather_frog
          text: 微笑池塘遭了这么大的难，背后一定有缘故，也一定有个起因。要是能把它找出来，也许咱们就能看得更明白，知道下一步该怎么办了。
        - id: ch01-b11
          speaker: narrator
          text: 麝鼠杰里听完，点了点头。
        - id: ch01-b12
          speaker: jerry_muskrat
          text: 青蛙曾祖父说得对，事情当然有起因。可我们该去哪里找呢？微笑池塘的每个角落我都去过了，我敢肯定，问题不在这里。
        - id: ch01-b13
          speaker: narrator
          text: 青蛙曾祖父听了，居然笑起来。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 咕咕隆！所有麻烦的起因当然不在微笑池塘。这个道理，谁都该明白！
        - id: ch01-b15
          speaker: jerry_muskrat
          text: 既然你什么都懂，那就告诉我们，问题到底在哪里！
          emotion: angry
        - id: ch01-b16
          speaker: grandfather_frog
          text: 当然是在欢笑小溪里。
        - id: ch01-b17
          speaker: billy_mink
          text: 不可能！我已经顺着欢笑小溪一路往下走，直走到大河，路上什么也没发现。
        - id: ch01-b18
          speaker: grandfather_frog
          text: 那你往上游走过吗？一直走到欢笑小溪发源的地方？
        - id: ch01-b19
          speaker: billy_mink
          text: 没有，我还没去过上游。
        - id: ch01-b20
          speaker: grandfather_frog
          text: 那就对了，所有麻烦的起因就在上游。
        - id: ch01-b21
          speaker: narrator
          text: 青蛙曾祖父说得煞有介事，仿佛早就把事情全弄明白了。
        - id: ch01-b22
          speaker: grandfather_frog
          text: 微笑池塘里的水，全是欢笑小溪一路送下来的。只要小溪不停流，池塘就绝不可能先干掉。
        - id: ch01-b23
          speaker: little_joe_otter
          text: 对呀！我以前怎么没想到？这样吧，我和比利沿着欢笑小溪一直往上走，看看能找到什么。
          emotion: surprised
        - id: ch01-b24
          speaker: grandfather_frog
          text: 咕咕隆！咱们五个全都去。
        - id: ch01-b25
          speaker: narrator
          text: 于是，五个脑袋凑到一起商量了一番。他们最后决定，沿欢笑小溪逆流而上，去找出这场麻烦的根源。
