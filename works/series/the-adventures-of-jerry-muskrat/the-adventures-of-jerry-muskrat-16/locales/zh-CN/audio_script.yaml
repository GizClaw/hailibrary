audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着亲切而略含调侃的讲故事口吻
        timbre: 清亮柔和
        pace: 舒缓而富有变化
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 沉稳朴实，说话不紧不慢
        timbre: 温厚略哑
        pace: 缓慢
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 见多识广，说话直接而认真
        timbre: 清晰利落
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十六章　绿森林里的池塘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳刚刚升起，第一缕晨光才钻进绿森林，斑点龟就醒了。他已经沿着欢笑小溪走到很远很远的上游，来到一个从未到过的地方。他打着哈欠，伸了伸身子，心里还在怀疑，昨晚那堵横在小溪上的怪墙，会不会只是一场梦。
        - id: ch01-b02
          speaker: narrator
          text: 他揉干净眼里的最后一点睡意，再朝前看。没错，那堵用圆木、树枝和泥巴筑成的墙还在那里，和昨晚一模一样。这不是梦。斑点龟又想，墙那边会有什么呢？
        - id: ch01-b03
          speaker: spotty_turtle
          text: 我肯定爬不上去。我这双腿呀，生来就不是爬高的。唉，要是我也有快乐杰克那么会爬，该多好！
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 斑点龟低头瞧着自己那双滑稽的小黑脚，满脸难过。可一个念头忽然蹦了出来，脸上的愁容也跟着不见了。
        - id: ch01-b05
          speaker: spotty_turtle
          text: 说不定，快乐杰克也常盼着能像我一样游水呢。这么一想，我们正好扯平。我爬不了树，他下不了水。老惦记着自己天生不会的本领，真傻！
        - id: ch01-b06
          speaker: narrator
          text: 这么一想，斑点龟心里舒坦了。他不再抱怨，开始盘算怎么用好自己的短腿，还有那股怎么也不肯放弃的劲儿。你早就知道，这股劲儿他可多得很。他左看看，右瞧瞧，很快有了主意。只要先爬到欢笑小溪一边的岸顶，就能走上那堵怪墙，再看清墙后面到底藏着什么。
        - id: ch01-b07
          speaker: narrator
          text: 斑点龟不再空想，挑了一处看起来最容易的地方，动身往岸上爬。哎呀，这活儿可真累！别忘了，他走到哪儿都得背着自己的房子。就算不背东西，这道河岸也够难爬的了。
        - id: ch01-b08
          speaker: narrator
          text: 他好不容易爬上三步，转眼又滑下两步。可他没有停，还是呼哧呼哧地往上挪，嘴里一遍遍给自己打气。
        - id: ch01-b09
          speaker: spotty_turtle
          text: 只要我肯干，我就一定行！照这个法子来，准能爬上顶。
        - id: ch01-b10
          speaker: narrator
          text: 刚爬到一半，斑点龟没站稳。背上的房子把他向后一带，他便骨碌骨碌滚下河岸，一直滚回刚出发的地方。
        - id: ch01-b11
          speaker: spotty_turtle
          text: 正好，我也该凉快凉快了。
        - id: ch01-b12
          speaker: narrator
          text: 斑点龟说完，滑进一个小水洼。凉快过后，他又去爬那道河岸。和第一次一样，每爬三步，就会滑下两步。他把嘴闭得紧紧的，一声不吭，只顾往上爬。慢慢地，他又回到了刚才摔落的地方，这才停下来喘口气。
        - id: ch01-b13
          speaker: spotty_turtle
          text: 只要我肯干，我就一定行！照这个法子来，准能爬上顶。
        - id: ch01-b14
          speaker: narrator
          text: 喘过气，他继续向上。后来又有两回，他从岸上一路滚到底。可每一次，他都只是笑笑自己，爬起来再试。到最后，他终于登上了岸顶。
        - id: ch01-b15
          speaker: spotty_turtle
          text: 我说过，只要我肯干，我就一定行。只要我一定行，我就肯干。瞧，我真的做到了！
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 斑点龟赶忙走过去，要看看怪墙后面是什么。你猜他看见了什么？一个池塘！对，先生，绿森林正中央真的有一个池塘。池塘中央，一棵棵树竟从水里直直长出来，可那确确实实是一片池水。斑点龟看了又看，还是不敢相信自己的眼睛。发现那堵横在欢笑小溪上的墙时，他已经够吃惊了，可眼前这个池塘更叫他难以相信。
        - id: ch01-b17
          speaker: spotty_turtle
          text: 这、这、这究竟是怎么回事？
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: 就在这时，水貂比利急匆匆地赶到斑点龟跟前。
        - id: ch01-b19
          speaker: billy_mink
          text: 我也正想知道是怎么回事呢！
