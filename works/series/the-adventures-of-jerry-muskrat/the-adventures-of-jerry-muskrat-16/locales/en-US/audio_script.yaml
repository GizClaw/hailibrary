audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    spotty_turtle:
      display_name: Spotty the Turtle
      tts:
        delivery: thoughtful and plainspoken
        timbre: mellow and sturdy
        pace: slow
        pitch: medium-low
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: confident and quick-witted
        timbre: sleek and lively
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: "CHAPTER XVI: The Pond In The Green Forest"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Spotty the Turtle was awake when the first rays of sunrise began creeping through the Green Forest. He was far, far up the Laughing Brook, much farther than he had ever gone before. As he yawned and stretched, he wondered whether he had only dreamed about that wall of logs, sticks, and mud across the brook.
        - id: ch01-b02
          speaker: narrator
          text: But after he rubbed the last bit of sleep from his eyes, he looked again. The wall was still there, just as he had seen it the night before. Now Spotty knew it was real, and he began wondering what might be on the other side.
        - id: ch01-b03
          speaker: spotty_turtle
          text: I can't climb that wall. My legs were never made for climbing. Oh, dear! I wish I could climb like Happy Jack Squirrel.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: Spotty looked sadly at his funny little black feet. Then a thought popped into his head, and the little frown on his face disappeared.
        - id: ch01-b05
          speaker: spotty_turtle
          text: Maybe Happy Jack sometimes wishes he could swim the way I can. So I suppose we're even. I can't climb, but he can't swim. How silly it is to wish for things that were never meant for you!
        - id: ch01-b06
          speaker: narrator
          text: With that, Spotty was no longer unhappy. He began thinking about how to make the best use of his short legs and his great perseverance. You already know that Spotty had plenty of that. He looked one way, then the other. If he could reach the top of the bank beside the Laughing Brook, he could walk straight out onto the strange wall. From there, he could see what lay beyond it.
        - id: ch01-b07
          speaker: narrator
          text: Spotty stopped wasting time wishing he could do something he was never meant to do. He chose the place where the bank looked easiest to climb, and up he started. My, my, my, what hard work it was! Spotty had to carry his house wherever he went, and climbing that bank would have been hard enough without carrying anything at all.
        - id: ch01-b08
          speaker: narrator
          text: Each time Spotty climbed three steps, he slipped back two. Still, he kept trying. He puffed and blew as he repeated the same words to himself.
        - id: ch01-b09
          speaker: spotty_turtle
          text: I can if I will, and will if I can! I'm sure to get there if I follow this plan.
        - id: ch01-b10
          speaker: narrator
          text: Halfway up the bank, Spotty lost his balance. The house on his back tipped him over backward, and down he rolled until he reached the very place where he had begun.
        - id: ch01-b11
          speaker: spotty_turtle
          text: I needed to cool off anyway.
        - id: ch01-b12
          speaker: narrator
          text: Spotty slid into a little pool of water. Then he tried the bank once more. Again, he slipped back two steps for every three he climbed. But he pressed his mouth shut and kept going. After a while, he reached the place where he had tumbled. There he paused to catch his breath.
        - id: ch01-b13
          speaker: spotty_turtle
          text: I can if I will, and will if I can! I'm sure to get there if I follow this plan.
        - id: ch01-b14
          speaker: narrator
          text: Then Spotty started upward again. Twice more, he tumbled all the way back to the bottom. Each time, he laughed at himself and tried once more. At last, he reached the top of the bank.
        - id: ch01-b15
          speaker: spotty_turtle
          text: I said I could if I would, and I would if I could. And I did!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Spotty hurried over to see what was behind the strange wall. And what do you think he found? A pond! Yes, sir, there was a pond right in the middle of the Green Forest. Trees rose straight out of its water, but it was a real pond. Spotty could hardly believe his own eyes. In fact, this was even harder to believe than the strange wall across the Laughing Brook had been.
        - id: ch01-b17
          speaker: spotty_turtle
          text: Why, why, why! What can this mean?
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: Just then, Billy Mink came hurrying up.
        - id: ch01-b19
          speaker: billy_mink
          text: That's exactly what I want to know!
