schema_version: 1
required: true
sources:
  - url: "https://ctext.org/liezi/tang-wen"
    authority: "Chinese Text Project digital transcription of the received Liezi, Tang Wen, based on the Sibu Congkan edition"
    claims:
      - The traditional tale places the Taihang and Wangwu mountains before Old Man Yu's home and makes their obstruction of travel the reason for his plan.
      - Yu's wife questions his strength and asks where the removed earth and stone will go.
      - Old Man Zhi doubts the work; Yu answers that later generations can continue while the mountains do not grow.
      - "A mountain deity reports the unending work to the Ruler of Heaven, who commands the two sons of Kua'e to carry the mountains away."
  - url: "https://iep.utm.edu/liezi/"
    authority: Internet Encyclopedia of Philosophy scholarly overview by Steve Coutinho
    claims:
      - Tang Wen is chapter five of the received eight-chapter Liezi.
      - "The received text contains myths and folk tales, and its date, compilation, and attributed authorship remain disputed."
  - url: "https://pages.ucsd.edu/~dkjordan/chin/chtxts/FoolishOldMan.html"
    authority: "David K. Jordan's bilingual teaching translation, hosted by UC San Diego; Jordan is Professor Emeritus of Anthropology at UC San Diego"
    claims:
      - The tale identifies Taihang and Wangwu as the mountains obstructing travel from Old Man Yu's home and gives that obstruction as the reason for his plan.
      - Yu's wife questions whether he can damage the mountains and asks where the earth and stones can be placed.
      - Old Man Zhi doubts the work; Yu answers that his descendants can continue while the mountains do not grow.
      - "The mountain god reports the unending work to the celestial emperor, who orders the two sons of Kua'e to carry the mountains away."
notes:
  - "The work is explicitly framed as a legend, not a historical account; the supernatural guardian, heavenly ruler, and sons of Kua'e belong to that legendary ending."
  - "Retained traditional elements are the blocking mountains, Yu's proposal, Lian's practical questions, Zhi's doubt, work continued by younger people, the guardian's report, and the supernatural removal of the mountains."
  - "HaiLibrary inventions include the sick neighbor child whose delayed journey prompts Yu, Zhi's proposed move and the three adults' trial cart journey south, Lian's work-and-rest plan, Jun's small basket and safe role, the gradual paving of the muddy road, Zhi's eventual move south, and his return along the new road."
  - "The English locale independently reconstructs scenes and dialogue from the premise and retained beats. It does not translate the Chinese article sentence by sentence and does not use a modern translation, textbook, film, or picture-book retelling as a prose model."
  - Ancient measurements and precise regional destinations in the received text are omitted because they are unnecessary to this original story's action; no uncertain date or authorship is asserted as settled fact.
