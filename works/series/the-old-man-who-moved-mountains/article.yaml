schema_version: 1
id: the-old-man-who-moved-mountains
category: fiction
genre: folktale
style: woodblock-print
labels: {topics: [culture, fantasy], themes: [perseverance, cooperation, tradition], moods: [hopeful, reflective]}
research: required
premise: >
  改编自《列子·汤问》的传说。两座大山挡住村子南行的路，年迈的愚公提议开山。
  妻子阿莲追问力气和土石往哪里送；邻居智叟主张搬到山南，还带愚公和阿莲试走了一趟。
  愚公选择留下开路，工程一年年进行，孩子和村民陆续接手。守山神听见锤声年年逼近，
  禀告天帝，天帝命夸娥氏二子背走两山。要明确这是传说；不在结尾点明寓意。
characters:
  - {id: yugong, description: 年迈村民，想开一条全村都能走的路}
  - {id: lian, description: 愚公的妻子，用力气、路程和家务来检验每个计划}
  - {id: zhisou, description: 邻居智叟，认为搬家比开山实际，不是嘲笑者}
  - {id: jun, description: 邻家孩子，从捡碎石开始加入}
  - {id: guardian, description: 传说中的守山神}
locales:
