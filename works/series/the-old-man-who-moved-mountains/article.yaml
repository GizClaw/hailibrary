schema_version: 1
id: the-old-man-who-moved-mountains
category: fiction
genre: folktale
style: woodblock-print
cover_prompt: >
  Wide 3:2 wordless cover composition for the ancient Chinese legend of Yugong moving the mountains.
  Two immense adjoining mountains dominate the background and block the road south from a small village.
  In the foreground, Yugong, an elderly Chinese villager with swept-back white hair, a short white beard,
  an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff,
  points toward a narrow hand-cut opening in the rock while resting one hand on a hammer. Beside him, Lian,
  an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket,
  mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, steadies a basket
  of broken stone and studies the work ahead. Jun, a Chinese village girl with two short black braids tied
  with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a
  tiny round woven basket, carries one small stone toward a short gravel road made by the villagers. At one
  side, Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest,
  an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, pauses on the rough detour
  and looks from the growing road to the workers. High among curling mountain clouds, barely noticed by the
  people below, a tall mountain guardian spirit with a weathered stone-gray face, long cloudlike white brows,
  an indigo layered robe edged in forest green, and a crooked pine-wood staff watches the repeated labor with
  concern. Arrange the figures in a clear visual path from village to gravel road to opening, keep the human
  actions and expressions readable while preserving the mountains' overwhelming scale, and leave calm open
  sky near the upper center without placing anything in it. Maintain consistent ancient clothing, tools,
  baskets, handcart, village, and mountain geography. No visible text, letters, numbers, calligraphy, seals,
  logos, captions, signs, speech bubbles, signatures, borders, watermarks, modern objects, or anachronisms.
labels: {topics: [culture, fantasy], themes: [perseverance, cooperation, tradition], moods: [hopeful, reflective]}
research: required
premise: >
  改编自《列子·汤问》的传说。两座大山挡住村子南行的路，年迈的愚公提议开山。
  妻子阿莲追问力气和土石往哪里送；邻居智叟主张搬到山南，还带愚公和阿莲试走了一趟。
  愚公选择留下开路，工程一年年进行，孩子和村民陆续接手。守山神听见锤声年年逼近，
  禀告天帝，天帝命夸娥氏二子背走两山。要明确这是传说；不在结尾点明寓意。
characters:
  - {id: yugong, description: 年迈村民，想开一条全村都能走的路}
  - {id: lian, description: 愚公的妻子，用力气、路程和家务来检验每个计划}
  - {id: zhisou, description: 邻居智叟，认为搬家比开山实际，不是嘲笑者}
  - {id: jun, description: 邻家孩子，从捡碎石开始加入}
  - {id: guardian, description: 传说中的守山神}
