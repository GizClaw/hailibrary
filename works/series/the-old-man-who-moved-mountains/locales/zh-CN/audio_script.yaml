audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 像围炉讲古一样沉静自然，画面清楚, timbre: 温厚沉稳, pace: 舒缓，关键处稍作停顿, pitch: 中低音}
    yugong:
      display_name: 愚公
      tts: {delivery: 朴实从容，话不多但拿得定主意, timbre: 苍老厚实, pace: 偏慢, pitch: 低音}
    lian:
      display_name: 阿莲
      tts: {delivery: 务实利落，关心里带着分寸, timbre: 温暖清亮, pace: 自然适中, pitch: 中音}
    zhisou:
      display_name: 智叟
      tts: {delivery: 直率讲理，偶有玩笑，后来多些迟疑, timbre: 略带沙哑, pace: 适中, pitch: 中低音}
    jun:
      display_name: 小君
      tts: {delivery: 真诚活泼，说话干脆, timbre: 清脆明亮, pace: 轻快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 山挡住的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            很久以前，一座村子的南面，横着太行、王屋两座大山。传说中，那山高得望不见顶，沿着山脚走一天，也走不出山影。村里人要去南边的田地、集市，或者走亲戚，都得先向东绕，爬过乱石坡，再从窄窄的谷口折回来。

            天还没亮，路上常常就响起车轮声。等赶路的人回来，山顶最后一点日光也没了。

            那年秋天，雨一场接一场。愚公站在家门口，看见邻居的车陷进泥坑。车上躺着个发烧的孩子。母亲在前头拽，父亲弯腰推，泥点溅了满背。大伙儿好不容易把车抬出来，赶到山南找到医者时，月亮都升过山肩了。

            第二天一早，愚公拿了根直木棍，走到两山相接的地方。他在泥地上画了一条线，一头连着村口，一头直指南方。高处的风吹散了他的白发。他眯着眼，看了那面石壁很久。

            吃晚饭时，他把木棍横在桌边，开了口。
        - id: ch01-b02
          speaker: yugong
          text: 我想从两座山中间，开一条路。
        - id: ch01-b03
          speaker: narrator
          text: 屋里一下安静了。儿孙们看看山，又看看他。有人以为他在说笑，可愚公的手指沿着桌面，一点点往南移。阿莲把热汤放到他面前，先把难处一件件问了出来。
        - id: ch01-b04
          speaker: lian
          text: 你今天上个坡，还歇了三回。那是石头，不是土块，锄头砸上去只冒火星。就算凿下来了，往哪儿放？
        - id: ch01-b05
          speaker: yugong
          text: 山外有水边，也有荒洼。土填洼地，碎石拿来垫路。
        - id: ch01-b06
          speaker: narrator
          text: 阿莲举起墙边的旧筐，让他看筐沿上磨断的篾条。
        - id: ch01-b07
          speaker: lian
          text: 说得轻巧。一筐石头多沉？水边多远？你去凿山，家里的柴谁劈，冬粮谁看？
        - id: ch01-b08
          speaker: narrator
          text: 愚公喝了一口已经不烫的汤。他没说总会有办法，只认真答了一句。
        - id: ch01-b09
          speaker: yugong
          text: 这些都得算。明早咱们一起去看。
        - id: ch01-b10
          speaker: narrator
          text: |-
            第二天，一家人来到山脚。愚公找了处稍低的石壁，用炭画下记号。阿莲抓起一把土，搓开一看，底下很快就露出青灰色的硬石。她又装了半筐碎石。才走十几步，筐绳就勒进了掌心。

            这时，身后传来智叟的声音。他拄着木杖，旁边停着一辆小车。车上捆了两只箱笼、一卷席子和一口锅。他早就想搬到山南去。那里离集市近，冬天也少挨山影里的寒气。说着，他还拍了拍车辕。
        - id: ch01-b11
          speaker: zhisou
          text: 先别忙着砸山。我有个省力些的办法。一家人的东西，多跑几趟总能搬完。搬到山南，就不用开路了。你们要是愿意，我先带你们走一趟。
        - id: ch01-b12
          speaker: narrator
          text: 阿莲看了看愚公。她也想知道，搬家到底要费多少力，又能换来什么。愚公没有拒绝。他卸下一只沉箱，只留下锅、席子和几包衣服。
        - id: ch01-b13
          speaker: yugong
          text: 那就先试轻一点。把车送到山南，再作打算。
        - id: ch01-b14
          speaker: narrator
          text: |-
            三个人趁着早晨凉快出发。智叟在前面拉，愚公和阿莲在后面推。刚开始，路还算平。到了乱石坡，车轮一会儿悬空，一会儿卡死。愚公用肩膀顶车，鞋底在湿土上直打滑。阿莲一次次蹲下搬石头，起身时腰疼得发紧。智叟怕锅颠碎，走一阵就得停下重绑绳子。

            太阳都过头顶了，他们还没走出太行山的阴影。等三个人终于绕出谷口，已经是傍晚。夕阳铺在南面的田野上，风里都是晒谷子的香味。智叟松开车绳。手上磨出了两个水泡，他却笑了。
        - id: ch01-b15
          speaker: zhisou
          text: 你们看，到了。再跑几趟，床、柜子、农具，都能搬来。累是累，可总有个完。
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 愚公回头一看，山脊压住了半边天。山北的炊烟、屋顶，还有那条陷过车的泥路，全都看不见了。阿莲捶了捶酸麻的肩膀。
        - id: ch01-b17
          speaker: lian
          text: 咱们搬过来了，村里其他人怎么办？老周的母亲走不了远路，小君家又只有她母亲一个大人。大家都搬，谁先帮谁？旧屋、井和田，也全不要了？
        - id: ch01-b18
          speaker: narrator
          text: 智叟把锅往车里扶正。
        - id: ch01-b19
          speaker: zhisou
          text: 各家有各家的打算。谁想来，也可以搬。
        - id: ch01-b20
          speaker: narrator
          text: 智叟说完，不再笑了。他望着自己的箱笼，过了一会儿，才又开口。
        - id: ch01-b21
          speaker: zhisou
          text: 可你们开山，也许忙上一辈子，最后还是只看见一个坑。
        - id: ch01-b22
          speaker: yugong
          text: 那也得先看看，这个坑该不该挖。
        - id: ch01-b23
          speaker: narrator
          text: |-
            回去时，天黑得很快。三个人轮流扶车，摸着石壁绕回村里。智叟把车停在门口，行李没有卸。愚公和阿莲回到家，也没马上谈山。阿莲先烧水，挑破两人脚上的血泡，又把一天落下的活补完。夜深了，她才剪下一段新麻绳，穿进旧筐的筐沿。
        - id: ch01-b24
          speaker: lian
          text: 我不是怕别人笑你。我是怕山还没动，你先倒下。真要做，就不能只凭一口气。早上干多少，午后干多少，谁守家，谁运石，都得说清楚。
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: 愚公把磨钝的凿子摆到灯下。
        - id: ch01-b26
          speaker: yugong
          text: 什么时候歇，你来定。
        - id: ch01-b27
          speaker: lian
          text: 你要是不听呢？
        - id: ch01-b28
          speaker: yugong
          text: 那你就把筐藏起来。
        - id: ch01-b29
          speaker: narrator
          text: 阿莲这才笑了一声。
        - id: ch01-b30
          speaker: lian
          text: 锄头也藏。
          emotion: happy
    - id: ch02
      title: 第一凿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            霜降以前，他们敲下了第一凿。铁碰石头，清亮的一声沿着山壁滚出去，惊飞了草里的鸟。愚公的手震得发麻，第二凿只掉下一粒豆子大的石屑。

            儿孙们轮流打凿、刨土。阿莲把石块分好：平整的铺泥路，细碎的装筐，送到远处的荒洼和水边。每一趟都很慢。扁担吱呀作响，汗珠掉进尘土，洇出一个个深色小点。

            第一天收工，石壁只少了一个小角。智叟拄杖来看，还拿杖头量了量。
        - id: ch02-b02
          speaker: zhisou
          text: 照这个速度，等你凿穿太行，王屋怕是早就等烦了。
        - id: ch02-b03
          speaker: yugong
          text: 它要真会着急，自己走了，倒给我们省事。
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 智叟没忍住笑了。笑过以后，他又认真起来。
        - id: ch02-b05
          speaker: zhisou
          text: 我不是等着看你笑话。你比我年纪还大，人能有几个秋天？今天掉这一角，明年也不过再掉一角。
        - id: ch02-b06
          speaker: yugong
          text: 那明年，就从第二角接着凿。
        - id: ch02-b07
          speaker: narrator
          text: 愚公没请智叟留下，智叟也没再劝。他那辆行李车还停在院里，下雨盖席，天晴揭开。他舍不得轻易丢下旧屋，又不愿承认，那一趟试走并没有解决所有问题。他只等路干些，好自己再推一趟。
    - id: ch03
      title: 越来越多的手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            邻家的孩子小君常蹲在远处看。她想帮忙，可母亲怕碎石砸伤她，只许她送水。

            有一天，愚公他们撬动一块石头，石头滚下来，正好停在小君脚边。她没碰，转身跑回家。第二天，她带来一只小筐，才比饭盆大一点。
        - id: ch03-b02
          speaker: jun
          text: 我不靠近凿子。我只捡他们已经敲下来的石头。
        - id: ch03-b03
          speaker: narrator
          text: |-
            母亲还是皱着眉。小君就装进三块小石头，沿着新铺的路走了一趟，一步也没跑。回来后，母亲替她收短筐绳，又在肩上垫了一块布。

            小君第一次把石子倒进荒洼，声音像一阵短短的雨。她嫌声音不够响，第二趟就想多装一点。阿莲伸手拿掉了一半。
        - id: ch03-b04
          speaker: lian
          text: 能背着走十趟的筐，别一趟就把人压坏。
        - id: ch03-b05
          speaker: narrator
          text: |-
            小君还有点不服，可走到半路就明白了。她把筐换到另一边肩上，回头看见石壁上的缺口已经能放下一只脚。第三天，她又来了。

            缺口一天比一天宽。最早来帮忙的，是那些常在泥坑里抬车的村民。他们不觉得大山马上会消失，只是发现，铺过碎石的那段路，下雨以后不再一脚一个坑。

            有人带锤子，有人做木楔，有人午饭多煮一份。有人只干半天，就回家照看田地；也有人十天才来一回。愚公从不问他们能坚持多久。他只把工具递过去，告诉他们哪块石头已经松了。
    - id: ch04
      title: 一年又一年
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 冬天封住山路，凿石头的声音也停了。风把雪末吹进缺口，在石缝里冻成薄冰。愚公坐在屋里换锄把，手指冻僵了，麻绳绕两遍也系不紧。阿莲替他打结，这才发现，他的右手比去年抖得更厉害。
        - id: ch04-b02
          speaker: lian
          text: 开春以后，你少抡几下锤子。
        - id: ch04-b03
          speaker: yugong
          text: 我少抡几下，别人就得多抡几下。
        - id: ch04-b04
          speaker: lian
          text: 那就让别人多抡几下。路又不认是谁凿的。
        - id: ch04-b05
          speaker: narrator
          text: |-
            窗外，小君正和几个孩子拿树枝扒开积雪，露出他们铺好的第一段石路。他们争着说，开春还要把路接长。

            雪化以后，愚公来到山脚，那里已经有人在干活。小君长高了，旧筐看着更小了。她母亲在修独轮车，老周家的两个儿子在扫冻裂的石片。没人等愚公发话。铁锤落下，木楔钉进裂缝。阳光照着新露出来的石面，亮得晃眼。

            就这样，春去秋来。草绿了又黄，鸟在崖缝里做窝，又带着新鸟飞走。山路上的声音也跟着季节变：夏天，锤声混着蝉鸣；秋天，筐底擦过枯叶；冬天，只剩风在缺口里打转。第二年春暖，一下、一下的敲击声，又从更深处响起来。

            智叟终于挑了个晴天，把车绳勒紧，打算搬去山南。他经过工地时，愚公正扶着锄头喘气，半天直不起腰。小君和几个年轻人从他身后走过，一筐接一筐地往外运石头。智叟停下了车。
        - id: ch04-b06
          speaker: zhisou
          text: 你看看自己。手在抖，腰也弯了。就算还能多凿几步，你又能守着这个坑几年？
        - id: ch04-b07
          speaker: narrator
          text: 愚公没有马上回答。他先等自己喘匀。小君背起空筐，催伙伴给她让路。一个年轻人接过愚公的锤子，朝他刚才指的石缝砸下去。更远处，还有人在把碎石压进路基。
        - id: ch04-b08
          speaker: yugong
          text: 我年轻时，总觉得日子还长。能绕路就绕路，绕一回也不算什么。如今我的日子短了，才看明白，这条绕路比谁的日子都长。
        - id: ch04-b09
          speaker: zhisou
          text: 所以我才说，别把剩下的年月都扔进山里。
        - id: ch04-b10
          speaker: narrator
          text: 愚公看看小君，又看看那些年轻的手。
        - id: ch04-b11
          speaker: yugong
          text: 我的年月会用完，这我知道。可他们还会接着过日子，以后也会有孩子。今天凿下来的石头，不会再长回去。明天来的人，也不用从第一凿重新开始。山只会少，不会多；人却会一代一代走到这里来。
        - id: ch04-b12
          speaker: narrator
          text: 智叟张了张嘴。他想说，后人未必肯继续，风雨会毁掉路，世上的事也不能全押在没见过的人身上。可小君刚好从两人中间挤过去，回头喊了一声。
        - id: ch04-b13
          speaker: jun
          text: 智爷爷，车别停这儿，挡着空筐啦！
        - id: ch04-b14
          speaker: narrator
          text: 智叟把车挪开。车轮落在大伙儿铺的碎石路上，稳稳的，一点没陷。他低头看了一会儿，什么也没说，又推着行李继续绕山。后来，他又走了几趟，总算搬到山南。只是每次经过坡口，他都会回头看一眼。
    - id: ch05
      title: 守山神的禀告
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            这个古老传说还说，两座山里住着一位守山神。

            一开始，他根本没把山脚下那几声脆响放在心上。大山见过雷劈、洪水和地动。凡人的铁锤，比啄木鸟还轻。

            可一个暖季过去，声音停了；寒风走后，它又回来。第二年，声音往山腹里近了一点。到了第三年，连守山神坐着的石座，都能感觉到轻轻的震动。

            守山神走遍两座山。他看见旧缺口后面又添了新缺口，去年的路接上今年的路。挥锤子的老人慢了，运石头的孩子却长高了。有些熟面孔不再出现，新的面孔又站到石壁前。没人说得出哪天一定能完工，可也没人肯把已经打开的路再填回去。

            守山神第一次不安起来。他不怕哪一个凡人。人会老，会累，也会改主意。可前一双手做完，给后一双手留下了接着做的位置。这样下去，哪怕寒来暑往千百次，锤声也可能一直敲到山心。

            于是，他乘云而上，把这些年听到、看到的，全都禀告给天帝。他没夸大那道缺口，只说它一年比一年深。他也没说愚公不会死，只说老人身后，已经有人接过锤子。

            天帝听完，久久望着云下。后来，他召来力大无穷的夸娥氏二子，命他们把太行、王屋背走。
    - id: ch06
      title: 南方的光
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            那一夜，村里谁也没看见神人降临。小君只在梦里听见一声闷响，像远处的春雷滚过屋顶。阿莲醒来时，碗里的水轻轻晃着。愚公摸黑坐起来，侧耳听了听，可山脚下没有石头滚落的声音。

            第二天清晨，第一个出门的人走到村口，忽然站住了。

            南方的光再也没有遮挡，一直照进村里，照亮井台、屋檐，还有一张张惊讶的脸。原来两山相接的地方，只剩下一条平坦开阔的路，直通田野。太行和王屋已经到了遥远的天边，一座在东面，一座在南面。山影再也压不到村口了。

            村民们涌上新路。有人提水桶，有人推空车，还有人走出老远又折回来，就为了试试这条不用爬坡、不用拐弯的路。

            小君跑得最快。跑到一半，她忽然停下来，找从前那个能放下一只脚的缺口。缺口已经跟着山一起远去了。可村边那段碎石路还在，石缝里甚至长出了一株细草。

            快到中午时，智叟从山南回来了。他把几件行李又装上小车，沿着新路回旧村看看。车轮跑得轻快，锅和箱笼一点也不颠。阿莲看见他，问了一句。
        - id: ch06-b02
          speaker: lian
          text: 怎么又把东西带回来了？
        - id: ch06-b03
          speaker: narrator
          text: 智叟抹了抹汗，话说得又快又硬，像怕谁再追问。
        - id: ch06-b04
          speaker: zhisou
          text: 路都短了，我还搬什么？
        - id: ch06-b05
          speaker: narrator
          text: |-
            到了那段碎石路上，他还是停了车，低头看着稳稳的车轮。

            愚公站在路边，没有笑他。阿莲也没说什么，只替他把松开的绳结重新勒紧。小君提着空筐，从三个人身边跑过。筐底一跳一跳，轻得几乎没声音。

            新路上，从南边来的人已经能望见村口；从村里出发的人，也能望见南方。智叟调转车头，愚公替他扶住车辕。两个老人并肩推着车，沿着清晨才显露出来的新路，慢慢往家走去。
