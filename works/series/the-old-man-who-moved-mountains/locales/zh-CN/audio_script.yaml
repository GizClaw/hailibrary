audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静清晰，带古老传说的从容感
        timbre: 温厚稳重
        pace: 舒缓而有推进感
        pitch: 中低音
    yugong:
      display_name: 愚公
      tts:
        delivery: 朴实坚定，不夸张
        timbre: 苍老厚实
        pace: 从容偏慢
        pitch: 低音
    lian:
      display_name: 阿莲
      tts:
        delivery: 务实敏锐，关切而不软弱
        timbre: 温暖清亮
        pace: 自然适中
        pitch: 中音
    zhisou:
      display_name: 智叟
      tts:
        delivery: 理性直率，后段多一分沉思
        timbre: 略沙哑
        pace: 适中
        pitch: 中低音
    jun:
      display_name: 小君
      tts:
        delivery: 活泼真诚，清楚自然
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 山挡住的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            很久以前，太行、王屋两座山横在一座村子的南面。那是传说里的山：抬头望不见峰顶，沿着山脚走，一整天也走不出它们投下的影子。村里人要去南边的田地、集市和亲戚家，不能直着走，只得顺山势向东绕，爬过乱石坡，再从一道狭窄的谷口折回来。
            天还没亮，路上常已有车轮声。等赶路人回来，山顶最后一点日光也灭了。
            那年秋天，连下了几场雨。愚公站在自家门前，看见邻居的车陷进泥坑。车上躺着个发烧的孩子，孩子的母亲在前面拽，父亲弯腰推，泥浆一直溅到他们背上。几个人帮着把车抬出来，赶到山南找医者时，月亮已经升过山肩。
            第二天清早，愚公拿一根直木棍，走到两山相接的地方。他在泥地里画了一条线，线的一头对着村口，另一头指向被山挡住的南方。风从高处落下来，把他的白发吹散了。他眯眼望着石壁，站了很久。
            晚饭时，他把木棍横在桌边，说：
        - id: ch01-b02
          speaker: yugong
          text: 我想从山中间开一条路。
        - id: ch01-b03
          speaker: narrator
          text: |-
            屋里静了一下。儿孙们先看山，又看他。有人以为他在说笑，可愚公的手指按着桌面，沿那条并不存在的路慢慢向南移。
            妻子阿莲把热汤放到他面前，没有顺着众人的兴奋点头。她问：
        - id: ch01-b04
          speaker: lian
          text: 你今天上坡还歇了三回。石头不是土块，锄头碰上去只冒火星。就算真凿下来，往哪儿放？
        - id: ch01-b05
          speaker: yugong
          text: 山外远处有水边，也有荒洼。
        - id: ch01-b06
          speaker: narrator
          text: 愚公说，
        - id: ch01-b07
          speaker: yugong
          text: 土归洼地，碎石可以垫路。
        - id: ch01-b08
          speaker: lian
          text: 说得轻巧。
        - id: ch01-b09
          speaker: narrator
          text: 阿莲掀开墙边一只旧筐，指给他看磨断的篾条，
        - id: ch01-b10
          speaker: lian
          text: 一筐石头有多重？走到水边有多远？家里的柴谁劈，冬粮谁看？
        - id: ch01-b11
          speaker: narrator
          text: 愚公低头喝了一口已经不烫的汤。他没说总会有办法，只说：
        - id: ch01-b12
          speaker: yugong
          text: 这些都得算。明早一起去看。
        - id: ch01-b13
          speaker: narrator
          text: 第二天，一家人来到山脚。愚公选中一处较低的石壁，用炭画了记号。阿莲蹲下抓了一把土，在手心搓开，下面很快露出青灰色的硬石。她又往筐里装了半筐碎石，才走十几步，筐绳便勒进手掌。
        - id: ch01-b14
          speaker: zhisou
          text: 先别急着砸山，
        - id: ch01-b15
          speaker: narrator
          text: 身后有人说，
        - id: ch01-b16
          speaker: zhisou
          text: 我有个更省力的办法。
        - id: ch01-b17
          speaker: narrator
          text: |-
            说话的是河曲的智叟。他拄着木杖，身旁停着一辆小车。车上捆了两只箱笼、一卷席子和一口锅。他早已打算搬到山南去，那里离集市近，冬日也少受山影里的寒气。
            智叟拍拍车辕：
        - id: ch01-b18
          speaker: zhisou
          text: 一家人的东西，分几趟总能运完。搬过去，路就不用开了。你们若愿意，我先带你们走一趟。
        - id: ch01-b19
          speaker: narrator
          text: 阿莲看了看愚公。她确实想知道：搬家要吃多少力气，又能换来什么。愚公也没有拒绝。他从车上卸下一只沉箱，只留下锅、席子和几包衣物，说：
        - id: ch01-b20
          speaker: yugong
          text: 那就试轻一点。先把车送到山南，再作打算。
        - id: ch01-b21
          speaker: narrator
          text: |-
            三人趁晨凉出发。智叟在前面拉，愚公和阿莲在后面推。开始的一段路还算平整，到了乱石坡，车轮便一会儿悬空，一会儿卡死。愚公用肩膀顶车，鞋底在湿土上直打滑；阿莲蹲下搬走轮前的石头，腰一起身就疼得发紧。智叟怕锅被颠碎，隔一阵便要停下重新捆绳。
            太阳越过头顶时，他们还在太行山的阴影里。傍晚，三人才绕出谷口。南面的田野铺在夕阳下，风里有晒谷子的香味。智叟松开车绳，掌心磨出了两个水泡，却还是笑了：
        - id: ch01-b22
          speaker: zhisou
          text: 你们看，到了。再走几趟，床、柜、农具都能搬来。累是累，总有个完。
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: |-
            愚公回头，只看见山脊压住半边天。山北的炊烟、屋顶和那条陷过车的泥路，全被挡得严严实实。
            阿莲捶着酸麻的肩，问：
        - id: ch01-b24
          speaker: lian
          text: 咱们搬来了，村里其他人呢？
        - id: ch01-b25
          speaker: narrator
          text: 智叟把锅往车里扶正：
        - id: ch01-b26
          speaker: zhisou
          text: 各家有各家的打算。谁想来，也可以搬。
        - id: ch01-b27
          speaker: lian
          text: 老周家的母亲走不了远路，小君家又只有她母亲一个大人。
        - id: ch01-b28
          speaker: narrator
          text: 阿莲说，
        - id: ch01-b29
          speaker: lian
          text: 都搬，谁先帮谁？旧屋、井、田，又都丢下？
        - id: ch01-b30
          speaker: narrator
          text: 智叟不再笑了。他望着自己的箱笼，过了一会儿才说：
        - id: ch01-b31
          speaker: zhisou
          text: 可你们要开山，兴许忙一辈子，还是只能看见一个坑。
        - id: ch01-b32
          speaker: yugong
          text: 那也得先看这个坑该不该挖。
        - id: ch01-b33
          speaker: narrator
          text: |-
            愚公说。
            回程时天黑得很快。三个人轮流扶车，摸着石壁绕回村中。智叟把车停在门口，没有卸下行李；愚公和阿莲到家，也没有立刻谈山。阿莲先烧水，挑破两人脚上的血泡，又把当天漏做的活一件件补上。直到夜深，她才剪下一段新麻绳，穿过旧筐的筐沿。
        - id: ch01-b34
          speaker: lian
          text: 我不是怕你被人笑。
        - id: ch01-b35
          speaker: narrator
          text: 她低着头打结，
        - id: ch01-b36
          speaker: lian
          text: 我怕山没动，你先倒下。要做，就不能只凭一口气。早晨干多少，午后干多少；谁守家，谁运石，都得说清楚。
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: 愚公把磨钝的凿子摆到灯下：
        - id: ch01-b38
          speaker: yugong
          text: 你来定歇息的时候。
        - id: ch01-b39
          speaker: lian
          text: 你若不听呢？
        - id: ch01-b40
          speaker: yugong
          text: 你就把筐藏起来。
        - id: ch01-b41
          speaker: narrator
          text: 阿莲这才笑了一声：
        - id: ch01-b42
          speaker: lian
          text: 锄头也藏。
          emotion: happy
    - id: ch02
      title: 第一凿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            霜降前，他们动了第一凿。铁碰石头，清亮的一声沿山壁滚出去，惊飞了草丛里的鸟。愚公的手被震得发麻，第二凿只敲下一粒豆大的石屑。儿孙们轮换着打凿、刨土，阿莲把石块按大小分开：平整的铺在泥路上，细碎的装筐，送往远处的荒洼和水边。每一趟都很慢。肩上的扁担吱呀作响，汗从下巴滴到尘土里，立刻洇出一个深色小点。
            第一天收工，石壁只少了一小角。智叟拄杖来看，用杖头量了量那个缺口。
        - id: ch02-b02
          speaker: zhisou
          text: 照这个样子，
        - id: ch02-b03
          speaker: narrator
          text: 他说，
        - id: ch02-b04
          speaker: zhisou
          text: 等你把太行凿穿，王屋怕是早等得不耐烦了。
        - id: ch02-b05
          speaker: narrator
          text: 愚公坐在石头上揉手腕：
        - id: ch02-b06
          speaker: yugong
          text: 它若会着急，倒省了我们的事。
        - id: ch02-b07
          speaker: narrator
          text: 智叟本想劝他，听见这话却没忍住笑。笑完，他又认真起来：
        - id: ch02-b08
          speaker: zhisou
          text: 我不是等着看你出丑。你年纪比我还大。人能有几个秋天？今天掉下这一角，明年也不过再掉一角。
        - id: ch02-b09
          speaker: yugong
          text: 那明年就从第二角往下凿。
        - id: ch02-b10
          speaker: narrator
          text: |-
            愚公说。
            他没有请智叟留下，智叟也没有再劝。那辆装着行李的小车仍停在智叟院中，遇雨盖席，天晴揭开。智叟舍不得把旧屋轻易丢下，又不肯承认自己那趟试走并没有解决所有事。他只等路干些，好独自再推一趟。
    - id: ch03
      title: 接过石头的人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 邻家的孩子小君常蹲在远处看。她想去帮忙，母亲却怕碎石砸伤她，只许她送水。有一天，愚公他们撬动一块石头，石头滚下来，正停在小君脚边。她没有碰它，转身跑回家，第二天带来一只比饭盆大不了多少的小筐。
        - id: ch03-b02
          speaker: jun
          text: 我不站在凿子旁边，
        - id: ch03-b03
          speaker: narrator
          text: 她对母亲说，
        - id: ch03-b04
          speaker: jun
          text: 我只捡他们已经敲下来的。
        - id: ch03-b05
          speaker: narrator
          text: |-
            母亲仍皱着眉。小君便把筐放在地上，装进三块小石头，沿着新铺的泥路走了一趟。她一步也没有跑。回来后，母亲替她把筐绳收短，又在肩头垫了块布。
            小君第一次把石子倒进荒洼时，声音像一阵短短的雨。她觉得不够响，第二趟便想多装些。阿莲伸手拿掉一半：
        - id: ch03-b06
          speaker: lian
          text: 能走十趟的筐，别一趟就把人压坏。
        - id: ch03-b07
          speaker: narrator
          text: |-
            小君有些不服，走到半路却明白了。她把筐换到另一边肩上，回头望见石壁上的缺口已经能放下一只脚。第三天，她又来了。
            缺口一天天变宽。最先加入的是常在泥坑里抬车的几个村民。他们并非相信山很快会消失，只是发现垫过碎石的那段路，下雨后不再一踩一个坑。有人带来铁锤，有人做了木楔，有人把午饭多煮一份。也有人只干半天，回家照看田地；还有人隔十天才来一次。愚公不问他们能坚持多久，只把工具递过去，告诉他们哪一处石头已经松了。
    - id: ch04
      title: 一代又一代
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 冬天封住山路时，凿击声停了。风把雪粉推进缺口，又在岩缝间冻成薄冰。愚公在屋里换锄把，手指僵硬，麻绳绕了两次也系不紧。阿莲接过来替他打结，发现他的右手抖得比去年厉害。
        - id: ch04-b02
          speaker: lian
          text: 开春后，你少抡锤。
        - id: ch04-b03
          speaker: narrator
          text: |-
            她说。
            愚公盯着炉火：
        - id: ch04-b04
          speaker: yugong
          text: 少抡几下，别人就得多抡几下。
        - id: ch04-b05
          speaker: lian
          text: 那就让别人多抡几下。路又不认是谁凿的。
        - id: ch04-b06
          speaker: narrator
          text: |-
            愚公抬起头。窗外，小君正和几个孩子用树枝扒开积雪，露出他们铺好的第一段石路。孩子们争着说，开春要把路再接长一些。
            雪化后，愚公到山脚时，那里已经有人了。小君长高了一点，旧筐显得更小；她母亲在修独轮车，老周家的两个儿子正把冻裂的石片扫到一边。没人等愚公发话。铁锤落下，木楔钉进裂缝，阳光照在新露出的石面上，亮得刺眼。
            春去秋来，草绿了又黄，鸟在崖缝里做窝，又带着新鸟飞走。山路上的声音也有季节：夏天，锤声混着蝉鸣；秋天，筐底擦过枯叶；冬天一到，只剩风在空缺口里打转；第二年春暖，那一下、一下的敲击又从更深处响起来。
            智叟终于选了个晴日，把车上的绳索全都勒紧。他推车经过工地，愚公正扶着锄头喘气，半天没有直起腰。小君和几个年轻人从他身后走过，一筐一筐往外运石。
            智叟停下车：
        - id: ch04-b07
          speaker: zhisou
          text: 你看看自己。手抖，腰也弯了。就算这里能多凿几步，你还能守着它几年？
        - id: ch04-b08
          speaker: narrator
          text: 愚公没有立刻回答。他在等那阵喘息过去。小君把空筐套上肩，催伙伴给她让路；一个年轻人接过愚公的锤，照着他刚才指的缝隙敲下去。更远处，有人在把碎石压进路基。
        - id: ch04-b09
          speaker: yugong
          text: 我年轻时，总觉得自己的日子还长。
        - id: ch04-b10
          speaker: narrator
          text: 愚公终于开口，
        - id: ch04-b11
          speaker: yugong
          text: 所以能绕就绕，绕一次也没什么。如今我的日子短了，才看见这条绕路比谁的日子都长。
        - id: ch04-b12
          speaker: narrator
          text: 智叟握紧车把：
        - id: ch04-b13
          speaker: zhisou
          text: 所以我才说，别把剩下的年月扔进山里。
        - id: ch04-b14
          speaker: yugong
          text: 我的年月会用完，这我知道。
        - id: ch04-b15
          speaker: narrator
          text: 愚公看向小君，又看向那些年轻的手，
        - id: ch04-b16
          speaker: yugong
          text: 可他们会接着过日子。他们以后也会有孩子。今天凿下来的石头不会长回去，明天来的人不必从第一凿开始。山只会少，不会添；人却会一代一代走到这里来。
        - id: ch04-b17
          speaker: narrator
          text: 智叟张了张嘴。他想说后人未必肯做，想说风雨会毁路，想说世上的事不能全押给没见过的人。可小君恰好从两人中间挤过去，回头叫道：
        - id: ch04-b18
          speaker: jun
          text: 智爷爷，车别停在这儿，挡着空筐啦！
        - id: ch04-b19
          speaker: narrator
          text: 智叟把车往旁边挪了挪。车轮落到众人铺的碎石路上，稳稳当当，没有陷下去。他低头看了一会儿，什么也没说，推着那车行李继续绕山。此后，他又走了几趟，终于搬到山南住下。只是每次经过坡口，他都会回头看一眼。
    - id: ch05
      title: 守山神的禀告
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            在这个古老传说里，山中还住着一位守山神。起初，他并不在意山脚的几声脆响。山见过雷劈、洪水和地动，一群凡人的铁锤，比啄木鸟还轻。可一个暖季过去，声音停了；寒风走后，它又回来。第二年，声音离山腹近了一点。第三年，连守山神歇息的石座都能感到细微的震动。
            他走遍两座山，发现旧缺口后面又有新缺口，去年的路接着今年的路。挥锤的老人慢下来了，运石的孩子却长高了；有些熟悉的面孔不再出现，另一些新面孔又站到石壁前。没人说哪一天一定能够完工，也没人肯把已经开出的路重新填上。
            守山神第一次感到不安。凡人会衰老，会疲倦，会改变主意，他从不怕某一个人。可山脚下延续的并不是某一个人的力气，而是前一双手留给后一双手的位置。照这样下去，哪怕千百次寒暑轮换，锤声也可能来到山心。
            于是他乘云而上，把这些年听见和看见的事禀告天帝。他没有夸大那道缺口，只说它一年比一年深；也没有说愚公不会死，只说老人身后已经有人接过锤子。
        - id: ch05-b02
          speaker: narrator
          text: 传说中，天帝听完，久久望着云下。后来，他召来力大无穷的夸娥氏二子，命他们把太行、王屋背走。
    - id: ch06
      title: 南方的光
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            那一夜，村里没有人看见神人降临。小君只在睡梦中听见一声闷响，仿佛遥远的春雷滚过屋顶。阿莲醒来时，碗里的水轻轻晃着。愚公摸黑坐起，侧耳听了听，山脚却没有落石的声音。
            第二天清晨，最先出门的人站在村口不动了。
            南方的光无遮无拦地照进来，照亮井台、屋檐和一张张惊讶的脸。原先两山相接的地方，只剩一条平坦开阔的路，直伸向田野。太行、王屋已经到了遥远的天边，一座立在很远的东面，一座落在很远的南方，山影再也压不到村口。
            村民们涌上新路。有人提着水桶，有人推着空车，有人走出很远又折回来，只为试试脚下这条不用攀坡、不用拐弯的路。小君跑得最快，跑到一半忽然停住，低头找从前那个能放下一只脚的缺口。它随山一起远去了；可村边那段用碎石铺成的小路还在，石缝里甚至冒出了一株细草。
            日上三竿时，智叟从山南回来了。他把几件行李重新装上小车，沿清晨出现的新路回旧村看看。车轮轻快，锅和箱笼一点也没有颠。
            阿莲看见他，问：
        - id: ch06-b02
          speaker: lian
          text: 东西怎么又带回来了？
        - id: ch06-b03
          speaker: narrator
          text: 智叟抹去额头的汗：
        - id: ch06-b04
          speaker: zhisou
          text: 路短了，我还搬什么？
        - id: ch06-b05
          speaker: narrator
          text: |-
            他的话说得又快又硬，像怕谁接着追问。可经过那段碎石路时，他停下车，低头看了看稳稳的车轮。
            愚公站在路旁，没有笑他。阿莲也只是走过去，帮他重新勒紧松开的绳结。小君提着空筐从三人身边跑过，筐底一跳一跳，轻得几乎没有声音。
            新路上，南来的人已经望得见村口，村里出发的人也望得见南方。智叟调转车头，愚公替他扶了一下车辕。两个老人并肩推着车，沿那条清晨才显露出来的路，慢慢往家走去。
