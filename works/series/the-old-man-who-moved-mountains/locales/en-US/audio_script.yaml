  chapters:
    - id: ch01
      title: The Mountains in the Way
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            In the old legend, two mountains stood south of a village, shoulder to shoulder. Their peaks disappeared into weather. Their shadows arrived early and left late, and anyone bound for the southern fields had to follow a stony trail east, squeeze through a ravine, and double back.
            One wet autumn evening, Yu heard a cart before he saw it. A wheel spun in the mud outside his gate. The neighbor’s daughter lay under a quilt, shaking with fever, while her parents pushed and pulled.
        - id: ch01-b02
          speaker: neighbor_father
          text: The healer is across the mountains,
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: |2-
             her father gasped.
            Yu and three others lifted the wheel free. Mud filled his sandals. Long after darkness covered the village, he could still hear the cart knocking against stones on the long way around.
            At dawn he walked to the place where Taihang and Wangwu met. With a straight stick, he drew a line from the village road toward the hidden south. Wind streamed down the rock face and lifted his white hair.
            At supper he laid the stick beside the bowls. 
        - id: ch01-b04
          speaker: yugong
          text: I want to open a road between the mountains.
        - id: ch01-b05
          speaker: narrator
          text: His sons stared. His grandchildren stopped chewing. Lian, his wife, set the soup in front of him.
        - id: ch01-b06
          speaker: lian
          text: You rested three times climbing the lower slope yesterday,
        - id: ch01-b07
          speaker: narrator
          text: " she said. "
        - id: ch01-b08
          speaker: lian
          text: A hoe strikes that rock and throws sparks. Suppose you break some loose. Where does it go?
        - id: ch01-b09
          speaker: yugong
          text: Soil to the hollow ground. Flat stones on the road. The rest can be carried toward the distant water.
        - id: ch01-b10
          speaker: narrator
          text: "Lian lifted an old basket. Two strips had split along its rim. "
        - id: ch01-b11
          speaker: lian
          text: How far can you carry this full? Who cuts winter wood while you walk? Who tends the grain?
        - id: ch01-b12
          speaker: narrator
          text: "Yu tasted his cooling soup. "
        - id: ch01-b13
          speaker: yugong
          text: We count all of that tomorrow.
        - id: ch01-b14
          speaker: narrator
          text: They were measuring the lowest rock face next morning when Old Zhi appeared with a handcart. A sleeping mat, two chests, and a cooking pot were tied on top.
        - id: ch01-b15
          speaker: zhisou
          text: Before you attack a mountain,
        - id: ch01-b16
          speaker: narrator
          text: " he said, "
        - id: ch01-b17
          speaker: zhisou
          text: try my smaller plan. Move south. The market is near, the winter sun lasts longer, and a household can be carried a load at a time.
        - id: ch01-b18
          speaker: narrator
          text: |-
            Lian wanted to know what such a move would truly cost. Yu took the heavier chest off Zhi’s cart. They left the pot, mat, and clothes and set out while the air was cool.
            At the loose-stone slope, the cart lurched from one hole to another. Zhi hauled the shafts. Yu pushed with his shoulder. Lian crouched again and again to clear rocks from the wheels. By noon they were still inside Taihang’s shadow. Each time the pot began to knock, Zhi stopped to tighten its rope.
            They reached the southern fields near sunset. Grain drying on mats scented the warm air. Zhi opened blistered hands and smiled anyway.
        - id: ch01-b19
          speaker: zhisou
          text: There. A few more trips, and it ends.
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: |-
            Yu looked back. The ridge hid every roof in the village.
            Lian rubbed her shoulder. 
        - id: ch01-b21
          speaker: lian
          text: If we come here, what about Jun and her mother? Old Zhou’s mother cannot walk this route. Who moves first, and who goes back to help the next family?
        - id: ch01-b22
          speaker: narrator
          text: "Zhi steadied his pot. "
        - id: ch01-b23
          speaker: zhisou
          text: Each family must choose. Your road may consume your whole life and still be a dent.
        - id: ch01-b24
          speaker: yugong
          text: Then we should find out whether the dent is worth making,
        - id: ch01-b25
          speaker: narrator
          text: |2-
             Yu said.
            They returned by moonlight. At home Lian tended the blisters on Yu’s feet, finished the work they had missed, and replaced the broken strips on the basket.
        - id: ch01-b26
          speaker: lian
          text: I’m not afraid people will laugh,
        - id: ch01-b27
          speaker: narrator
          text: " she said. "
        - id: ch01-b28
          speaker: lian
          text: I’m afraid the mountain will remain and you won’t. If we do this, we measure the loads. We divide the days. I decide when you rest.
          emotion: fearful
        - id: ch01-b29
          speaker: yugong
          text: And if I refuse?
        - id: ch01-b30
          speaker: lian
          text: I hide the baskets.
        - id: ch01-b31
          speaker: yugong
          text: You would not.
        - id: ch01-b32
          speaker: lian
          text: The hammers too.
    - id: ch02
      title: The First Blow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Before the first frost, iron rang against stone. Yu’s first strike numbed his fingers and freed a chip no bigger than a bean. His family loosened earth, drove wooden wedges, and carried rubble away. Lian sorted the pieces. Broad stones went into the muddy village road; small ones filled baskets. At dusk, the mountain had lost one corner.
            Zhi measured it with the end of his cane. 
        - id: ch02-b02
          speaker: zhisou
          text: At this pace, Wangwu will grow bored waiting for you to finish Taihang.
        - id: ch02-b03
          speaker: yugong
          text: If it walks away from boredom, we save ourselves some labor.
        - id: ch02-b04
          speaker: narrator
          text: "Zhi laughed, then frowned. "
        - id: ch02-b05
          speaker: zhisou
          text: I don’t want to watch you ruin your last years. Tomorrow you remove another corner. How many tomorrows do you own?
        - id: ch02-b06
          speaker: yugong
          text: I only need the next one,
        - id: ch02-b07
          speaker: narrator
          text: |2-
             Yu said.
            Zhi’s loaded cart remained in his yard, covered in rain and uncovered in sun. He disliked abandoning his old house. He disliked admitting that one hard trip had not answered every question.
    - id: ch03
      title: Hands That Follow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jun, the neighbor’s child, watched the work from a safe distance. Her mother allowed her to carry water but not to approach the hammers. One afternoon a loosened rock rolled to Jun’s feet. She did not touch it. The next morning she returned with a basket barely larger than a soup bowl.
        - id: ch03-b02
          speaker: jun
          text: I’ll pick up only the pieces already broken,
        - id: ch03-b03
          speaker: narrator
          text: |2-
             she told her mother.
            She put in three stones and walked the new stretch of road without running. Her mother shortened the strap and folded cloth beneath it.
            The stones made a brief rain sound when Jun emptied them into a hollow. On her second trip she piled the basket high. Lian removed half.
        - id: ch03-b04
          speaker: lian
          text: A load you can carry ten times is better than one that carries you down.
        - id: ch03-b05
          speaker: narrator
          text: |-
            Jun scowled until halfway there. Then she shifted the strap to her other shoulder. The next day she came back.
            Other villagers came too, not because they expected the mountains to vanish soon, but because the stone-covered road no longer swallowed wheels after rain. One brought a hammer. Another shaped wedges. Some stayed an hour; some returned once every ten days. Yu did not ask for promises. He showed them which cracks had opened.
    - id: ch04
      title: One Season After Another
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Winter silenced the hammers. Yu repaired handles by the fire, but his right hand trembled and the cord slipped from his fingers. Lian took it and tied the knot.
        - id: ch04-b02
          speaker: lian
          text: Less hammering in spring,
        - id: ch04-b03
          speaker: narrator
          text: " she said."
        - id: ch04-b04
          speaker: yugong
          text: Then someone else must do more.
        - id: ch04-b05
          speaker: lian
          text: Let them. A road does not remember whose arm struck it.
        - id: ch04-b06
          speaker: narrator
          text: |-
            Outside, Jun and other children scraped snow from the first paved section with branches. Their voices came through the wall. They were deciding where to extend it when the ground softened.
            In spring, workers were already at the mountain when Yu arrived. Jun’s basket looked smaller because she had grown. Young hands lifted the hammer when Yu’s breath ran short.
            Seasons changed. Summer blows mixed with cicadas. Baskets whispered through autumn leaves. Snow filled the cut, then melted, and the ringing began from a little deeper inside.
            At last Zhi chose a clear morning to move his belongings south. He stopped his cart beside Yu, who leaned on a hoe and waited for his breathing to settle.
        - id: ch04-b07
          speaker: zhisou
          text: Look at your hands,
        - id: ch04-b08
          speaker: narrator
          text: " Zhi said. "
        - id: ch04-b09
          speaker: zhisou
          text: Look at your back. How many more years can you guard this hole?
        - id: ch04-b10
          speaker: narrator
          text: A young man took the hammer from Yu and struck the seam Yu had marked. Jun passed with an empty basket. Farther down, two women pressed gravel into the roadbed.
        - id: ch04-b11
          speaker: yugong
          text: When I was young,
        - id: ch04-b12
          speaker: narrator
          text: " Yu said, "
        - id: ch04-b13
          speaker: yugong
          text: one trip around the mountains seemed cheap. I thought I had endless time to spend on detours. Now my time is short, and I see that this detour outlives everyone.
        - id: ch04-b14
          speaker: zhisou
          text: Which is why you shouldn’t throw your remaining years at it.
        - id: ch04-b15
          speaker: yugong
          text: My years will end. That stone we removed will not grow back. Whoever comes tomorrow starts after our last blow, not before our first.
        - id: ch04-b16
          speaker: narrator
          text: Zhi opened his mouth. He might have said that children make different choices, or storms ruin roads, or no sensible man bets on people not yet born. Jun squeezed between them.
        - id: ch04-b17
          speaker: jun
          text: Grandfather Zhi, your cart is blocking the baskets.
        - id: ch04-b18
          speaker: narrator
          text: He rolled it aside. Its wheels settled firmly on the gravel the workers had laid. Zhi looked down, then began the long route south.
    - id: ch05
      title: The Guardian’s Report
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            The old tale says a guardian spirit lived in the mountains. At first he ignored the tapping below. Mountains had endured lightning, floods, and earthquakes; iron hammers were lighter than woodpeckers.
            But the sound returned after every winter. It crept inward. The old man slowed while the child grew. Some faces disappeared and new ones took their places. No one could name the day the road would be finished. No one filled the opening already made.
            For the first time, the guardian was afraid. A single human tired, aged, or changed his mind. This labor had learned how to pass from one pair of hands to another.
            He rose through the clouds and reported to the Ruler of Heaven. He did not pretend the opening was greater than it was. He said only that it deepened each year, and that younger hands had taken up the old man’s tools.
            In the legend, the Ruler of Heaven called the two mighty sons of Kua’e and ordered them to carry Taihang and Wangwu away.
    - id: ch06
      title: The Southern Light
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            No villager saw them arrive. During the night, Jun woke to a low sound like spring thunder traveling beneath the floor. Water trembled in Lian’s bowl. Yu sat up in darkness and listened.
            At sunrise, the first person through the village gate stopped.
            Southern light lay across the well, the roofs, and the faces gathering in the road. Where the mountains had met, level ground ran straight toward the fields. Taihang stood impossibly far to the east; Wangwu rested at the distant southern horizon. Their shadows could no longer touch the village.
            People rolled carts down the open road and walked halfway to the fields simply to turn and walk back. Jun ran farthest. She searched for the first notch that had held one of her feet, but it had gone with the mountains. Beside the village, the short gravel road remained. A thin green shoot rose between its stones.
            Late that morning, Zhi came from the south with part of his household loaded on his cart.
            Lian eyed the chests. 
        - id: ch06-b02
          speaker: lian
          text: Bringing everything back?
        - id: ch06-b03
          speaker: zhisou
          text: The road is short now,
        - id: ch06-b04
          speaker: narrator
          text: " he said quickly. "
        - id: ch06-b05
          speaker: zhisou
          text: Why should I live away?
        - id: ch06-b06
          speaker: narrator
          text: |-
            At the gravel, one rope came loose. Lian tightened it. Yu took hold of the cart shaft without smiling, and Zhi did not explain further.
            Jun passed them with her little basket swinging empty from one shoulder. The two old men turned the cart toward home and pushed it together along the new road.
