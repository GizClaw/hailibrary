premise: >
  依古希腊《奥德赛》第七卷新写的阅读版。身无长物的奥德修斯必须进入陌生王宫求取归航帮助。
  他接受雅典娜的引路，向阿瑞忒求助；衣物引来的追问迫使他交代海难与瑙西卡的援手。
  得到留居邀请后，他仍选择归家，终于从炉灰旁走向为客人铺好的床。
