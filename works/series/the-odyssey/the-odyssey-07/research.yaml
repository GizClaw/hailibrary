  - "Retained: Nausicaa returning and nurse Eurymedusa awarded as a prize; Athena's concealing mist and water-girl disguise, including her claimed nearby father; hostility to strangers and supernatural ships; Periboea/Poseidon ancestry, Eurymedon's destruction of the giants and himself, Apollo killing Rhexenor, Arete marrying her uncle; queen's authority; immortal guards and ever-bearing orchard; invisibility ending at clasped knees; hearth ashes, Echeneus's intervention and Laodamas's seat; escort and subsequent fate, king's suspicion of divinity, hunger and desire to see property/slaves; Arete recognizing clothes; Zeus destroying ship, nine-day drift and tenth-night arrival, seven years/eighth-year release with uncertainty about Zeus's order; raft, storm, landing and leaf sleep; daughter's help; king's rebuke and Odysseus's misleading cover account; voluntary marriage/estate offer and unconditional passage; Rhadamanthus/Tityus voyage boast; bed above gate and royal couple's rest."
  - "Compressed: the nurse's geographic background beyond Apeira, Athena's Marathon/Erechtheus itinerary, full palace metalwork and textile inventories, four-acre garden dimensions, spring plumbing, exact libation service, repeated blessings and bedding procedures. Actions inside the ancestry and earlier shipwreck account remain rather than being discarded as genealogy or repetition."
  - "Claim inventory: provenance is documentary. Divine mist, ageless artifacts, perpetual fruit and thought-swift ships are myth. Royal incest and captive servants remain narrative facts, not approved social guidance. Odysseus does not know why Calypso changed and does not disclose his name. His explanation about Nausicaa is not substituted for her actual Book VI instructions. The escort is promised, not yet performed."
  - "Deleted unsupported queen's follow-up questions, hand/cloak movements, premature sleep timing and speculative royal reactions. The entire source was rewritten after fidelity findings; each script was then newly told from its own final locale. No media changes."
