audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定清楚", timbre: "清晰稳定", pace: "舒缓", pitch: "中音"}
    echeneus:
      display_name: 厄刻纽斯
      tts: {delivery: "坦率庄重", timbre: "苍老而有共鸣", pace: "从容", pitch: "低音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    arete:
      display_name: 阿瑞忒
      tts: {delivery: "深思直率", timbre: "成熟清晰", pace: "舒缓", pitch: "中音"}
    bed_maid_1:
      display_name: 通报床铺的女仆甲
      tts: {delivery: "礼貌平实", timbre: "清晰", pace: "平稳", pitch: "中音"}
    bed_maid_2:
      display_name: 通报床铺的女仆乙
      tts: {delivery: "礼貌平实", timbre: "柔和", pace: "平稳", pitch: "中高音"}
    bed_maid_3:
      display_name: 通报床铺的女仆丙
      tts: {delivery: "礼貌平实", timbre: "温暖", pace: "平稳", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "雾中的向导"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯仍在等候，向神祈求，姑娘已驾车进城。来到父亲家，她在门口停下。兄弟们长得像神一样好看，都围过来，解开拉车的骡子，把衣服抱进屋。她自己回卧室，欧律墨杜萨在那里给她生火，还送进晚饭。
            这位老女仆出身阿佩拉，当年从海路带来，被挑出给国王作奖赏。阿尔基诺奥斯统治费埃克斯，百姓听他的，仿佛听神的话。欧律墨杜萨以前给瑙西卡做乳母，如今还这样照料她。
            不久，奥德修斯也动身往城里走。雅典娜让浓雾把他包住，免得骄傲的城里人碰见，出口不逊，或者查问来历。城门快到了，一名提水罐的小姑娘迎过来，站在正前方，其实那就是雅典娜。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            小姑娘，能不能领我去阿尔基诺奥斯国王家？我是个外地人，遭了难才到这里，你们这一国、这一城，谁也不认识。
        - id: ch01-b03
          speaker: athena
          text: >-
            老客人，我领你走。他家离我父亲住处很近。跟在我后面，但一路别开口，不要看着谁，也不要问人。这里的人不待见外来人，不喜欢别国的男人。他们天天驾船走海路，波塞冬保佑他们的船，快得像一个念头闪过，又像空中的鸟。
        - id: ch01-b04
          speaker: narrator
          text: >-
            女神先走，奥德修斯照着她的脚步跟过去。他从城里的人中间穿行，却没有人望见。雅典娜有意护他，黑黑的浓雾把他藏得严实。他一路看港口、看船、看集会的场地，再看那些高墙，上头还加着木栅，觉得实在壮观。到了宫前，向导又说。
        - id: ch01-b05
          speaker: athena
          text: >-
            这就是你要找的地方，老客人。好些有地位的人正在里面用饭。别怕，直走进去，人在异乡也一样，肯拿出胆量，事情更容易成功。先找王后，她叫阿瑞忒，和丈夫本是同族，都出于波塞冬一脉。波塞冬与美丽的佩里玻娅生了瑙西托奥斯。佩里玻娅是巨人王欧律墨冬最小的女儿。那位王毁了自己不幸的人民，自己的命也没保住。可波塞冬同欧律墨冬的女儿在一起，生下的瑙西托奥斯，后来成了我们的大王。
            瑙西托奥斯生了瑞克塞诺尔和阿尔基诺奥斯两个儿子。前一个还在新婚，尚无儿子，就让阿波罗杀了，留下一位女儿阿瑞忒。阿尔基诺奥斯娶了她，待她特别尊敬，同丈夫一起过家的女人，没有谁得到这样尊敬。
            儿女们爱重她，国王自己也爱重她，全国人从前如此，现在仍是如此。她走到城里，人们都向她问好，把她看成女神。她的心好，脑子也好。跟她是朋友的女子，连丈夫之间有争执，她都会帮着分解。她若肯照顾你，你就有望再见自己的朋友，安稳回到国土和家里。
        - id: ch01-b06
          speaker: narrator
          text: >-
            说完，雅典娜离开斯刻里亚，越海去马拉松，再到街道宽广的雅典，进了厄瑞克透斯的居所。奥德修斯继续往宫里走，青铜门槛就在前头，他停了一会儿，心里想了许多。宫中光辉像太阳，又像月亮。左右的墙全是青铜，上沿镶蓝色珐琅，金门挂在银柱之间，柱底是青铜地面，门上的横楣银制，钩子则用金。
            门两边立着金狗、银狗，是赫淮斯托斯凭精妙手艺特为王宫造的獒犬，守门的它们既不会死，也不会老。沿墙一路摆着座椅，盖着女人们亲手织的好料子。首领们常坐这里吃喝，四时都有好食物。有些金铸少年站在台座上，手中火把烧着，晚宴便靠它们照亮。
            宫里五十名女仆，各自忙着自己的工作。一些人不停地转磨，把金黄饱满的谷粒磨成粉。另一些人在织机前劳作，还有些坐着纺线。梭子一来一往，仿佛白杨的叶子在翻飞。织出的亚麻布那么紧密，哪怕油泼上去，也透不过布面。费埃克斯男人的航海本领举世无双，这里的女子纺织也超过世间其他人。雅典娜传给她们各种有用的技艺，她们自己又都聪明，懂得怎样做好。

            外院门外是四面围起的大园，足有四英亩左右。梨、石榴、甜苹果长在漂亮的树上，无花果甘美，橄榄也长得茂盛。这里冬夏都不会缺果，也没有腐果。气候温柔，新果成熟时，旧的还没掉下来，梨接梨，苹果接苹果，无花果接无花果。
            葡萄园也是如此。一片平地正在晒葡萄干，一片正忙着摘，有些葡萄在酒槽让人踩榨。再往前的藤上，花刚谢，小果才出，有的又开始变颜色。地最远处，花畦排得齐整，一年都有花开。两道水经过园地，一道分到沟渠，浇遍花园，一道走外院地下，通到屋里，城里人也来打水。这些繁盛美景，都是神赐给国王家的。
    - id: ch02
      title: "炉边的客人"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            奥德修斯站着观赏过，才跨进门槛。屋里首领们正向赫尔墨斯献酒。每夜要离开，最后都有这道礼。他仍在黑雾保护下，走过院子，到国王和王后面前，抱住阿瑞忒的膝。雾立刻消散，大家忽然看见眼前的人，都呆得说不出话。他先求告起来。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            瑞克塞诺尔的女儿，阿瑞忒王后，我受苦太多，求你帮忙，也求你丈夫和诸位贵客。祝他们活得长久、过得幸福，把财富和国中给的荣誉都传给下一代。请快点送我到祖国去，我离开朋友，遭难漂泊，已经够久了。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他坐进炉边的灰烬里。大家依旧没说话，直到老英雄厄刻纽斯打破安静。这位长老在费埃克斯人里能言善道，说起话也坦诚。
        - id: ch02-b04
          speaker: echeneus
          text: >-
            阿尔基诺奥斯，客人蹲坐在你家炉灰中，叫人看着不光彩。所有人都等你开口呢。扶他起来，给张镶银的椅子，再让侍从把水酒调好。我们敬掌管雷霆的宙斯，他保护那些善意来求助的人。女管事也该拿些家里食物，让这人吃顿饭。
        - id: ch02-b05
          speaker: narrator
          text: >-
            国王牵着奥德修斯的手，从炉旁扶起，安排到自己最疼的儿子拉奥达马斯的位置，就在身边。女仆端来金壶、银盆，倒水让他洗手，又拉过干净的桌。女管事给面包，给家中各色美食，奥德修斯吃喝起来。国王对仆人吩咐。
        - id: ch02-b06
          speaker: alcinous
          text: >-
            蓬托诺奥斯，把酒兑好，传给大家，我们要向宙斯敬献。他掌雷，也庇护每一位诚心求援的客人。
        - id: ch02-b07
          speaker: narrator
          text: >-
            蓬托诺奥斯把水和酒调好，先给各人敬神用的，再把酒分送。众人敬罢，喝到尽意，阿尔基诺奥斯又讲话。
        - id: ch02-b08
          speaker: alcinous
          text: >-
            长老们、议事的诸位，饭已经用过，都先回家睡吧。明天再邀更多长老，为客人祭神、开宴，然后一同商议送行。不论他的家有多远，都要尽快送回，叫他高兴，叫他不受麻烦、不觉劳顿。路上也必须平安。真到了家，他出生时定下的命运，该好该坏，就跟别人一样去承受。不过这人也许是天神，特地来看我们。那神的做法就变了。从前献上百牛大祭，他们总现出真身，坐在席间，如同自家人。就连单独走路的人偶遇他们，他们都不躲。我们的祖先与神相近，好比独眼巨人和凶蛮的巨人族一样。
        - id: ch02-b09
          speaker: odysseus
          text: >-
            国王，请不要把我想成神。不论身体还是心思，都不过凡人。你所知受苦最多的人，才跟我相似。若一一讲完上天给我的痛，你还会觉得我比他们更苦。但先让我吃一点。人再悲伤，空肚子也不肯安静，非要引起你的注意。我如此难过，它却硬要我喝、要我吃，叫我把烦恼全忘掉，心里只留填饱肚子这一件。明早请你们照方才说的，动手帮我归去。能再看一眼我的财产、我的奴仆、我家的盛况，随后死去，也就满足了。
    - id: ch03
      title: "七年的岛与归程"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这些话大家都赞同，认为有道理，该给他护送。又献酒，又各自饮足，宾客便散去回家。仆人收拾桌面，廊下只剩国王、王后和奥德修斯。阿瑞忒认出他身上好衣服与披风，都是自己和女仆做的，先问起来。
        - id: ch03-b02
          speaker: arete
          text: >-
            客人，先答我一个疑问。你叫什么，从哪里来？这一身衣裳是哪个送的？你不是说，是从海那边过来的吗？
        - id: ch03-b03
          speaker: odysseus
          text: >-
            夫人，遭遇全讲完，恐怕很长，上天压在我身上的苦太重。不过这件事我能说。在很远的海上，有座奥吉吉亚岛。阿特拉斯的女儿卡吕普索住那里，强大又聪慧，独自一人，旁边不住凡人，也不住神。我来到她炉前时，孤单得一无所有。因为宙斯在大海中央用雷击碎我的船，勇敢的伙伴全淹死。我抱船的龙骨，漂来漂去九天，到第十夜黑暗中，诸神才送我上她的岛。她接纳我，十分善待，还想让我成为不死的，永远年轻，但我没有同意。

            这一住整整七年，她给我的好衣服，没少浸透眼泪。第八年来到，她自己愿意放我。可能宙斯下了命令，也可能她改主意。她让我乘木筏出发，上边存足面包和酒，再给结实衣裳，还有又暖又顺的风。我在海里漂航十七天，第十八天望见你们这边的山，刚露点形状，就让我大喜。可麻烦仍在前方。波塞冬不让我过，刮来大风。巨浪太高，筏没法待，又让狂风打碎，我只能下水游，任风浪把我带向这岸。

            我一度想爬上去，浪却往岩石上砸我，那地方不好，根本上不成岸。只得掉头继续游，直到一条河出现在前面，没石头，又挡风，看来最合适。我终于出了水，神智慢慢回来。天要暗了，我从河旁钻进灌木，用叶子满身盖好，神就让我沉睡。身体苦，心里也苦，我一直睡过夜晚，连次日大半天都睡掉。日头向西沉时才醒，看见你女儿和女仆在滩上玩，她在众人中真像女神。我求助，她待人好得很，好过一般年轻人，因为这个年纪容易想事不周。她拿来许多面包和酒，让我在河里洗，再给这一身衣服。事情就是如此，虽痛苦，我仍全说实话。
        - id: ch03-b04
          speaker: alcinous
          text: >-
            你首先找女儿帮忙，她却不立刻带你跟女仆们到我家来，这一步不应该。
        - id: ch03-b05
          speaker: odysseus
          text: >-
            别怪她，该怪我。她的确叫我同行，是我脸薄，又担心你看到会生气。人难免会起猜疑，难免有火气。
        - id: ch03-b06
          speaker: alcinous
          text: >-
            我不会没理由便发脾气，讲道理总是对的。不过向宙斯父神、雅典娜和阿波罗发誓，你这样的人，想法与我这么近，我倒真想留你，娶我女儿作女婿。愿意的话，房屋田地我都给。但不愿意，就谁也不许强留，上天也别容这种事。明日我即办送行，让你不必疑虑。在船上你想睡多久就睡多久，海面平平稳稳，船员会把你送回家，或者去想去的地方。远过欧波亚也不怕。我们的人以前送金发拉达曼提斯去看盖娅之子提堤俄斯，见过那地方，都说它最远。可他们一天完成航程，并不疲劳，随后便回来。你就等着看，我们船如何高过其他船，我们的桨手又如何了不起。
        - id: ch03-b07
          speaker: narrator
          text: >-
            奥德修斯高兴，立刻大声祈求。
        - id: ch03-b08
          speaker: odysseus
          text: >-
            宙斯父神，叫国王刚说的一一成真吧。他的名声会永远在人间流传，我也可以到家了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            阿瑞忒这时吩咐备床，在门房的屋子里铺上好红毯，再盖被褥，羊毛披风也拿来，让客人裹着。女仆们举火把去铺好，回来招呼。
        - id: ch03-b10
          speakers: [bed_maid_1, bed_maid_2, bed_maid_3]
          ensemble: chorus
          text: >-
            外乡的客人，请跟我们起身走吧，歇息的床已经收拾好了。
        - id: ch03-b11
          speaker: narrator
          text: >-
            他巴不得去安歇，欣然随她们去了。

            奥德修斯就在大门上方的房里睡下，门道下回声响荡。国王则回宅院内深处，和妻子王后同床歇息。
