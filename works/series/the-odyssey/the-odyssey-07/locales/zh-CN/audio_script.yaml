audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定清楚", timbre: "清晰稳定", pace: "舒缓", pitch: "中音"}
    echeneus:
      display_name: 厄刻纽斯
      tts: {delivery: "坦率庄重", timbre: "苍老而有共鸣", pace: "从容", pitch: "低音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    arete:
      display_name: 阿瑞忒
      tts: {delivery: "深思直率", timbre: "成熟清晰", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: 提水的小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            瑙西卡回家，兄弟们上前卸骡子，把衣物抬进屋里。她回了自己的房间，乳母欧律墨杜萨替她生火，又送来晚饭。这老妇人从前是从阿佩拉掳来的，被当成战利品给了国王。

            另一边，奥德修斯离开白杨林，向城中出发。雅典娜把他藏进浓雾，免得当地人盘问或冒犯。到了城门，她变作提水罐的小姑娘。他向她问国王的家在哪。
        - id: ch01-b02
          speaker: athena
          text: |
            我知道，他家靠近我父亲的家，跟我来吧。路上别问人，别搭话，这里不喜欢外乡人。不过，他们的船得到波塞冬帮助，快得像念头，像飞鸟。
        - id: ch01-b03
          speaker: narrator
          text: |
            她带他走过人群，谁也看不见他。他看到了港口、船只、集会的场地，还有高城墙。宫门到了，姑娘叫他大胆往里走，先求阿瑞忒王后。
        - id: ch01-b04
          speaker: athena
          text: |
            王后其实是国王的侄女。她父亲瑞克塞诺尔被阿波罗杀了，没有儿子，只留下她，后来便嫁给叔叔阿尔基诺奥斯。国王的父亲是瑙西托奥斯，他的父母是波塞冬和佩里玻娅。佩里玻娅的父亲欧律墨冬当过巨人之王，最后毁了自己的族人，自己也死了。
            如今，丈夫、孩子，还有城里的百姓，都很尊敬王后。别人有了争执，她也常帮着调解。你只要得到她的帮助，回家就有指望了。
        - id: ch01-b05
          speaker: narrator
          text: |
            雅典娜离开斯刻里亚，去了雅典。奥德修斯在宫门前停了一会儿。铜墙、金门、银柱闪着光，门旁的金狗、银狗是赫淮斯托斯铸的，永远不会老。屋里，金铸的青年举着火把照亮座席，女仆们忙着磨粮和织布。外头的果园不论什么季节都有果子，这一茬还没摘完，下一茬就熟了。葡萄有的还在长，有的摘下了，有的已踩成汁酿酒。国王一家有这样的家业，都是诸神给的福分。
            贵人们正在向赫尔墨斯献酒，准备回去。他仍罩在雾中，走到王后面前，抱她的膝盖。雾一下散去，客人们惊讶得没人出声。
        - id: ch01-b06
          speaker: odysseus
          text: |
            阿瑞忒王后，请您和丈夫、各位宾客帮我归乡。我受苦太久，离开亲人也太久了。愿你们长寿平安，家业传给子孙，他们也能享有你们今天的地位。
        - id: ch01-b07
          speaker: narrator
          text: |
            他求完，退到炉边，坐进灰里。厄刻纽斯是位长者，先开口提醒国王。
        - id: ch01-b08
          speaker: echeneus
          text: |
            大家都等你说话呢，阿尔基诺奥斯。别让求助的人坐在灰里了，请他上席，给他食物，再向保护求助者的宙斯献酒。
    - id: ch02
      title: 王后认出了衣服
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            国王把奥德修斯拉起，让他坐在自己最宠爱的儿子拉奥达马斯原先的座位上。仆人端来洗手的水，再送上面包和肉，他便吃了起来。主人请大家向宙斯献酒，今晚各自回家，明天再多请些人，给客人摆宴席，也商量怎样送他回去。
        - id: ch02-b02
          speaker: alcinous
          text: |
            不管家乡多远，都要让他安全到达。回去以后是好是坏，就看他自己的命。但这人是不是神？神往常来参加宴席，都是公开露面的。我们和独眼巨人、巨人族一样，跟神亲近。
        - id: ch02-b03
          speaker: odysseus
          text: |
            别把我当成神，我只是一个吃尽苦的凡人。人再伤心，肚子一空，也得想着吃饭。让我把这顿饭吃完，明天再请你们送我走。只要还能见一次自己的田产、奴仆和家里的屋子，就是死了，我也甘愿。
        - id: ch02-b04
          speaker: narrator
          text: |
            众人同意，献完酒便回去了。仆人正收拾桌上的东西，王后认出客人的衣服，是她和女仆织的。
        - id: ch02-b05
          speaker: arete
          text: |
            你究竟是什么人？这些衣服是谁给的？你是从海上过来的吧？
        - id: ch02-b06
          speaker: narrator
          text: |
            他便讲起自己在遥远的俄古癸亚岛上的经历。
        - id: ch02-b07
          speaker: odysseus
          text: |
            宙斯的雷电毁了我的船，伙伴们全都淹死了。我抱着船底漂了九天，到第十个夜里，才上了卡吕普索的岛。她收留了我，想让我永远不老不死，可我没答应。七年里，我一直流着泪。她直到第八年才肯放我，究竟是宙斯的命令，还是她自己改了主意，我也不知道。
            我坐筏出海，她备粮酒、送衣服和好风。十七天后，第十八天，我见到了你们的山。可波塞冬起了风暴，木筏碎了。我想靠岩石上岸，浪却推我回海里，最后才找到避风的河口。我钻进树丛，盖着落叶，睡过一夜，又睡到第二天下午。
            我醒来时，您的女儿和女仆正在水边玩。我去求救，她虽年轻，却很懂得照顾人，给面包、酒，叫我洗浴，再拿来我穿的衣服。
    - id: ch03
      title: 留下还是离开
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            阿尔基诺奥斯责怪女儿，应该把人直接带回家才对。
        - id: ch03-b02
          speaker: odysseus
          text: |
            不怪她。她让我同女仆一道来，是我不好意思，怕您见我跟她同行，会不高兴。
        - id: ch03-b03
          speaker: narrator
          text: |
            姑娘担心有人说闲话，特意安排他等在白杨林，错开入城。这层缘故，他没讲给她父亲听。
        - id: ch03-b04
          speaker: alcinous
          text: |
            我不会平白无故生气的。你的想法很合我的心意，我倒希望你做我的女婿。留下来娶我的女儿吧，我给你田地、屋子。不过谁都不准强留你。明天我安排船送你回去，你尽管睡，水手们会把你送到。哪怕比欧玻亚更远，也没关系。他们曾送拉达曼提斯去那里见提堤奥斯，一天就到了。
        - id: ch03-b05
          speaker: narrator
          text: |
            奥德修斯很高兴。他向宙斯祈求，愿国王守诺，这样自己回得了家，主人也能留下长久的好名声。
            王后叫侍女去门楼铺床，拿出红毯、被褥和羊毛披衣。侍女们举着火把，把床铺好，再来请他休息。

            他高兴地去睡了。国王和王后一同睡在内室。
