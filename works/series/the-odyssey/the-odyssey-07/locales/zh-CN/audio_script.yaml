audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定清楚", timbre: "清晰稳定", pace: "舒缓", pitch: "中音"}
    echeneus:
      display_name: 厄刻纽斯
      tts: {delivery: "坦率庄重", timbre: "苍老而有共鸣", pace: "从容", pitch: "低音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    arete:
      display_name: 阿瑞忒
      tts: {delivery: "深思直率", timbre: "成熟清晰", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: 雾中的向导
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            瑙西卡到家了。哥哥们卸下骡子，搬走衣服。她的乳母欧律墨杜萨生了火，把晚饭送进房。这位老妇人，原来从阿佩拉被人带走，作为战利品给了国王。
            奥德修斯离开白杨林，向城里走。雅典娜用浓雾藏住他，免得本地人找他麻烦，问他的来历。城门边，女神变成一个提水罐的小姑娘。他上前问国王住哪儿。
        - id: ch01-b02
          speaker: athena
          text: |
            跟我来，他家就在我父亲住处旁边。沿路别跟人说话，别问问题。他们不喜欢外乡人。不过这里的船有波塞冬帮助，快得像一个念头，像飞过的鸟。
        - id: ch01-b03
          speaker: narrator
          text: |
            他藏在雾里，走过港口、船只、集会场和高高的城墙。到了宫前，姑娘叫他大胆进去，先找阿瑞忒。
        - id: ch01-b04
          speaker: athena
          text: |
            王后和丈夫都是波塞冬的后代。海神和佩里玻娅生了瑙西托奥斯。佩里玻娅的父亲欧律墨冬，当过巨人之王，却毁了族人，自己也死了。瑙西托奥斯生了阿尔基诺奥斯和瑞克塞诺尔。瑞克塞诺尔被阿波罗杀了，没有儿子，只有女儿阿瑞忒。她后来嫁给了叔叔。丈夫、孩子和百姓都敬重她，她也帮人平息争执。求得帮助，你就有望回家。
        - id: ch01-b05
          speaker: narrator
          text: |
            雅典娜去雅典了。奥德修斯停下来，看着铜墙、金门和银柱。金银的守犬是赫淮斯托斯造的，永远不老。金铸的青年举火把，照亮座位。女人们在屋里磨粮、织布。果园里四季都有果子，熟的还没摘完，新的就长了。葡萄有的刚长成，有的正在采，有的已经踩成汁。神给国王的生活很丰足。
            贵人们正向赫尔墨斯奠酒，快要散席。奥德修斯穿过大厅，抱住王后的膝盖。雾一下消失，所有人都惊讶得不出声。
        - id: ch01-b06
          speaker: odysseus
          text: |
            阿瑞忒王后，请帮我回家。我也求您的丈夫和诸位宾客。愿你们长寿安乐，让子孙继承财产和荣誉。我离开亲人，受苦太久了。
        - id: ch01-b07
          speaker: narrator
          text: |
            他坐进炉边的灰里。长者厄刻纽斯先说话了。
        - id: ch01-b08
          speaker: echeneus
          text: |
            哪能让求助的人坐在那里？这让我们没脸。请他上座，拿饭给他，再向保护求助者的宙斯献酒吧。
    - id: ch02
      title: 衣服的来处
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            国王伸手拉起他，让他坐到自己最宠爱的儿子拉奥达马斯原来的座位。仆人拿来水、面包和肉。客人开始吃，国王叫大家向宙斯献酒，再吩咐众人。
        - id: ch02-b02
          speaker: alcinous
          text: |
            今晚先回去。明天多叫些人，为客人设宴，商量怎么送他。不管多远，都要让他平安到家。之后的命运，才由他自己承担。除非他是神？神往常来我们宴上，总是公开露面。我们跟独眼巨人、巨人族一样，都和神亲近。
        - id: ch02-b03
          speaker: odysseus
          text: |
            我不是神，只是个苦命的凡人。再悲伤，也得吃饭。先让我吃完，明天再送我走吧。只要再见到产业、奴仆和自己的屋子，我死也甘心。
        - id: ch02-b04
          speaker: narrator
          text: |
            贵人们答应，奠过酒就走了。仆人收拾时，王后看出，客人身上的衣服是自己和女仆织的。
        - id: ch02-b05
          speaker: arete
          text: |
            你是谁？这衣服谁给的？你不是说从海上来的吗？
        - id: ch02-b06
          speaker: narrator
          text: |
            奥德修斯开始说起遥远的俄古癸亚岛。
        - id: ch02-b07
          speaker: odysseus
          text: |
            宙斯用雷电劈碎我的船，同伴全死了。我抱着船底漂了九天，到第十夜，才上了卡吕普索的岛。她收留我，想让我永生，我没答应。七年，我总在流泪。到了第八年，她才放人。是宙斯命令，还是她改了主意，我不知道。
            她给木筏备了粮酒、衣服，又送顺风。我走了十七天，第十八天见到你们的山，波塞冬却打散了木筏。我游向岸，被岩石和浪推回去，最后才到了避风的河口。我用树叶盖着自己，睡过一夜，又睡到第二天下午。
            你们的女儿和女仆在水边玩，我醒了就去求助。她虽年轻，却很周到。面包、酒、洗浴，还有这身衣服，都是她给的。
    - id: ch03
      title: 回家的承诺
      blocks:
        - id: ch03-b01
          speaker: alcinous
          text: |
            她本来应该直接带你回家。
        - id: ch03-b02
          speaker: odysseus
          text: |
            请别怪她。她让我跟着女仆。是我害羞，又怕同她一道来，惹您不高兴。
        - id: ch03-b03
          speaker: narrator
          text: |
            他这样说，没有告诉父亲，姑娘是为了避开闲话才另作安排。
        - id: ch03-b04
          speaker: alcinous
          text: |
            我不会无缘无故生气。你想法跟我合得来。愿意留下，娶我的女儿吗？我会给你田和屋子。但谁也不许强留你。明天我就安排护送。你尽管睡，水手能送你去任何地方，比欧玻亚还远也行。他们送拉达曼提斯去欧玻亚见提堤奥斯，一天就到了。
        - id: ch03-b05
          speaker: narrator
          text: |
            奥德修斯很高兴，向宙斯求告，愿国王兑现承诺。他就能回家，国王也会因此留下不朽的名声。
            阿瑞忒叫人在门楼铺床，拿出红毯、被褥和羊毛披衣。侍女举着火把，准备好以后，就来叫旅人。

            奥德修斯高兴地去休息了。国王和王后则一同睡在内室。
