  chapters:
    - id: ch01
      title: A guide through the city
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Nausicaa got home. Her brothers took out the mules and carried in the clothes. In her room, her nurse Eurymedusa made a fire and brought her supper. Long ago, the old woman had been taken from Apeira and given to the king as a prize.
            Odysseus left the grove. Athena covered him with mist so nobody would question or insult him. At the city entrance she appeared as a little girl with a pitcher. He asked where Alcinous lived.
        - id: ch01-b02
          speaker: athena
          text: |
            Follow me. He lives close to my father. Don't stop and talk to anybody or ask questions. They don't like strangers here. Poseidon helps their ships move as fast as thought, or birds in flight.
        - id: ch01-b03
          speaker: narrator
          text: |
            He followed, hidden from everyone he passed. He saw the harbors, ships, meeting places and tall walls. At the palace, she told him to enter boldly and find Arete first.
        - id: ch01-b04
          speaker: athena
          text: |
            She and the king are descended from Poseidon. He had a son, Nausithous, with Periboea. Her father Eurymedon had ruled the giants, but destroyed his people and died himself. Nausithous had Alcinous and Rhexenor. Apollo killed Rhexenor before he had a boy. His only child was Arete, who married her uncle Alcinous. Her husband, children and people honor her. She settles disputes. Get her help, and you have hope of home.
        - id: ch01-b05
          speaker: narrator
          text: |
            Athena left for Athens. Odysseus stopped to look at the palace. Bronze walls shone around gold doors and silver pillars. Gold and silver dogs guarded it. Hephaestus had made them immortal. Golden youths held torches above the seats. Inside, women ground grain and wove cloth. The orchard had ripe fruit and new fruit growing together. Some grapes ripened, some were picked, and others were pressed. The gods kept Alcinous well supplied in every season.
            The chiefs were making their last offering to Hermes before going home. Still hidden, Odysseus walked through the hall and grasped the queen's knees. Then the mist vanished. Everyone stared without speaking.
        - id: ch01-b06
          speaker: odysseus
          text: |
            Queen Arete, please help me get home. I ask your husband and your guests too. May the gods give you long and happy lives, and let your children inherit your property and honors. I've been away from my friends and in trouble for so long.
        - id: ch01-b07
          speaker: narrator
          text: |
            He sat in the ashes by the hearth. An elderly counselor, Echeneus, spoke up.
        - id: ch01-b08
          speaker: echeneus
          text: |
            We ought to be ashamed, leaving him there. Give him a seat and supper. Pour wine for Zeus, who protects those asking for help.
    - id: ch02
      title: A man's hunger
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Alcinous took his hand and lifted him. He gave the guest his favorite son Laodamas's place beside him. Servants brought water, bread and meat. As Odysseus ate, Alcinous ordered wine poured for Zeus. Then he addressed the chiefs.
        - id: ch02-b02
          speaker: alcinous
          text: |
            Go home tonight. Tomorrow we'll call more men and feast for our guest. We'll arrange to get him safely to his country, however far it is. Once he's there, he must face his own fate. Perhaps he's a god? They usually show themselves plainly at our feasts. We're close to them, like the Cyclopes and the giants.
        - id: ch02-b03
          speaker: odysseus
          text: |
            I'm no god, just a man who's suffered. Even a grieving man has to eat. Let me finish, then help me away tomorrow. I could die content if I first saw my property, my slaves and my house again.
        - id: ch02-b04
          speaker: narrator
          text: |
            The chiefs agreed. They poured another offering, then went home. The king and queen stayed while servants cleared the meal. Arete knew the clothes her guest wore. She and her women had made them.
        - id: ch02-b05
          speaker: arete
          text: |
            Who are you, and where did you get those clothes? Didn't you say you'd come over the sea?
        - id: ch02-b06
          speaker: narrator
          text: |
            Odysseus began with Ogygia, a distant island.
        - id: ch02-b07
          speaker: odysseus
          text: |
            Zeus smashed my ship with lightning. Every companion drowned. I held to the keel for nine days. On the tenth night I reached Calypso. She welcomed me and offered a life that would never end. I wouldn't take it. I spent seven years there in tears. In the eighth, she let me go. I don't know whether Zeus ordered her to, or she'd changed her mind.
            I left on a raft. She loaded it with food, wine and clothes, and sent a good wind. I sailed seventeen days. On the eighteenth, I saw your mountains. Then Poseidon broke the raft in a storm. I swam to the rocks and was driven away. At last I landed in a river mouth out of the wind. I lay under leaves, sleeping all night and most of the next day.
            In the afternoon I woke. Your daughter and her women were playing near the water. I asked her help. She was unusually thoughtful for her age. She gave me bread and wine, let me wash, and supplied these clothes.
    - id: ch03
      title: The promise of a ship
      blocks:
        - id: ch03-b01
          speaker: alcinous
          text: |
            She should have brought you here herself.
        - id: ch03-b02
          speaker: odysseus
          text: |
            Please don't blame her. She told me to come with the women. I hung back. I was ashamed, and afraid you might resent seeing me beside her.
        - id: ch03-b03
          speaker: narrator
          text: |
            He gave that explanation, keeping Nausicaa's concern about gossip from her father.
        - id: ch03-b04
          speaker: alcinous
          text: |
            I don't get angry without cause. I like the way you think. Stay and marry my daughter, and I'll give you land and a house. But nobody will force you to remain. Tomorrow I'll arrange your passage. Sleep while our sailors take you. They can go farther than Euboea. They once carried Rhadamanthus there to see Tityus, and reached it in a day.
        - id: ch03-b05
          speaker: narrator
          text: |
            Odysseus was glad. He prayed that Zeus would let the king keep his promise. He would reach home, and Alcinous would win lasting honor.
            Arete had a bed prepared above the gateway, with red rugs, covers and woollen cloaks. The women went ahead with torches. When all was ready, they called him.

            Odysseus gladly went to rest. Alcinous slept in the inner rooms beside Arete.
