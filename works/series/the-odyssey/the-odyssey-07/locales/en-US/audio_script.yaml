  chapters:
    - id: ch01
      title: "A guide through the town"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Ulysses waited and prayed while the girl drove on towards town. At her father's house she stopped the wagon by the gateway. Her brothers, handsome as gods, came round her. They unhitched the mules and carried the clothes indoors. Nausicaa went to her room. Her old nurse Eurymedusa had lit a fire for her there and brought her supper.
            Eurymedusa came from Apeira. She had been brought across the sea and chosen as a prize for Alcinous, because he ruled the Phaeacians. His people obeyed him as if he were a god. She had cared for Nausicaa in infancy, and now she was serving her in her own room.
            After a while Ulysses rose and started towards the town. Minerva wrapped a thick mist around him. She meant to keep the proud Phaeacians from seeing him, insulting him, or stopping him to ask his name. At the entrance to the town she met him in another shape, a little girl carrying a water pitcher. She came and stood directly in his path.
        - id: ch01-b02
          speaker: odysseus
          text: >-
            My dear girl, could you show me where King Alcinous lives? I'm a stranger here, and misfortune has brought me trouble. I don't know a single person in this town or in your country.
        - id: ch01-b03
          speaker: athena
          text: >-
            Yes, old friend. I'll take you to the house you're looking for. Alcinous lives near my father's home. Follow me, and I'll lead you there. But keep quiet on the way. Don't stare at anyone or stop to ask questions. The people here dislike strangers. They don't welcome men arriving from other lands. They're people of the sea. By Neptune's favour they sail in ships that move as swiftly as a thought, or as a bird through the air.
        - id: ch01-b04
          speaker: narrator
          text: >-
            She went ahead, and Ulysses followed in her footsteps. He passed right among the Phaeacians as he crossed the town, but not one could see him. The great goddess had hidden him in a dark, thick cloud because she wished him well. He looked with wonder at their harbours, their ships, and the places where they met in assembly. Their high city walls, topped with a wooden palisade, were impressive to see. When they came to the palace, Minerva spoke again.
        - id: ch01-b05
          speaker: athena
          text: |-
            Here it is, old stranger, the house you asked me to find. Inside you'll see many important people at their meal. Don't let them frighten you. Go straight in. A bold man is more likely to get what he seeks, even in a country that isn't his own. First look for the queen. Her name is Arete, and her family is also the family of her husband, Alcinous. Both can trace their line back to Neptune. He fathered Nausithous with Periboea, a very beautiful woman. She was the youngest daughter of Eurymedon, who once ruled the giants. He brought his unfortunate people to ruin and lost his own life as well.
            Neptune lay with that king's daughter, and their son was the great Nausithous, ruler of the Phaeacians. Nausithous had two sons, Rhexenor and Alcinous. Apollo killed Rhexenor while he was still newly married, before he had a son. But he left a daughter, Arete. Alcinous married her. No other wife who shares her husband's household receives the honour he gives to her.
            Her children, her husband, and all the people have always respected her deeply, and they still do. They think of her as a goddess and greet her whenever she walks through the town. Her mind is wise and her heart is good. If she is friends with a woman, she'll even help that woman's husband settle his quarrels. Win her favour, and you have every reason to hope you'll see your friends again and return safely to your own country and home.
    - id: ch02
      title: "The palace and the suppliant"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Minerva left Scheria and passed across the sea. She went to Marathon, then to the broad streets of Athens, where she entered the dwelling of Erechtheus. Ulysses went on towards Alcinous's house. Before he crossed its bronze threshold, he paused and thought over what lay before him. The palace shone like the sun or the moon. On both sides, bronze walls ran from end to end, beneath a cornice of blue enamel. Gold doors hung on silver pillars rising from a bronze floor. The lintel was silver too, while the door's hook was gold.
            Gold and silver mastiffs stood on either side. Vulcan had shaped them with all his skill for one purpose, to watch over Alcinous's palace. They could never die or grow old. Seats stood along the walls from one end to the other. Over them lay finely woven covers made by the women of the house. Here the Phaeacian leaders sat to eat and drink, with plenty for them in every season. Golden figures of young men stood on raised bases, holding burning torches to light the diners at night.
            The house had fifty women servants. Some kept working at the mills, turning rich yellow grain into meal. Others worked at their looms, while still others sat and spun thread. The shuttles travelled backwards and forwards, flickering like the leaves of an aspen. Such close, fine linen came from their looms that it could turn away oil without letting it through. The Phaeacian men were better sailors than any others in the world. In the same way their women were better weavers than other women. Minerva had taught them all sorts of useful arts, and their own minds were intelligent and skillful.
            Outside the gate into the outer court lay a large garden, about four acres in size. A wall enclosed it on every side. Its lovely trees bore pears, pomegranates, and the most delicious apples. Sweet figs grew there as well, and olive trees stood in full growth. These fruits never spoiled, and they never ran out. It was the same in winter as in summer. The air was so mild that before the old crop could fall from the branches, another had already ripened. One harvest of pears followed another, and so it was with the apples and the figs.
            Grapes came in the same abundance in a vineyard of wonderful quality. One part had level ground where grapes were spread to dry into raisins. In another, ripe bunches were being gathered. Some had already reached the wine tubs, where people were treading out their juice. Yet farther on there were vines whose flowers had only just fallen and whose fruit was beginning to form. Others bore grapes just starting to change colour. At the far end of the grounds, flower beds were laid out in beautiful order. They kept their blossoms in every season. Two separate streams ran through the property. Channels carried one of them throughout the whole garden. The other flowed beneath the ground of the outer court into the house itself. That was the water the people of the town came to draw. Such riches and splendour had the gods bestowed on Alcinous's home.

            Ulysses stood looking until he had seen enough. Then he crossed the threshold and went into the house. The chief men of the Phaeacians were pouring offerings to Mercury, the last thing they always did before leaving for the night. Still covered by Minerva's darkness, Ulysses went directly across the court to Arete and Alcinous. He put his hands on the queen's knees. At that instant the mist fell away, and everyone could see him. The sudden appearance of a man left them speechless. Ulysses began his plea at once.
        - id: ch02-b02
          speaker: odysseus
          text: >-
            Queen Arete, daughter of mighty Rhexenor, I ask humbly for your help in my distress. I ask your husband and these guests too. May the gods give them long and happy lives, and let their children inherit their property and every honour their city has given them. Please help me reach my own land as soon as you can. I've been suffering for a long time, far from my friends.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He sat down in the ashes beside the hearth. The company remained silent, until old Echeneus spoke. He was a hero and one of the Phaeacian elders, known for speaking well. His words were frank and honest.
        - id: ch02-b04
          speaker: echeneus
          text: >-
            Alcinous, it does you no credit to leave a stranger sitting among your hearth ashes. Everyone is waiting for you to answer him. Ask him to rise. Give him one of the silver-inlaid seats. Tell the servants to mix wine with water, so we can pour an offering to Jove, lord of thunder. He guards those who come seeking help with honest hearts. And have the housekeeper bring the man supper from whatever food is in the house.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Alcinous heard the old man's advice and took the stranger by the hand. He lifted Ulysses up from his place among the ashes at the hearth, then invited him to sit beside him. That seat had belonged to Laodamas, the son the king loved best. A woman servant now brought water in a beautifully made golden jug. She poured it into a basin of silver so that Ulysses could wash his hands before the meal. When that was done, she drew a clean table up close to his seat. The woman in charge of the household came with bread and offered him many of the good foods they had in the house. Ulysses began to eat and drink what had been set before him. Then Alcinous called to one of his servants.
        - id: ch02-b06
          speaker: alcinous
          text: >-
            Pontonous, mix some wine and serve it round. We must make offerings to Jove who rules the thunder, the god who protects all honest people asking for shelter.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Pontonous mixed the wine and water. He gave each man his offering and handed the wine round. After they had poured their offerings and drunk as much as they wanted, the king spoke to the company.
        - id: ch02-b08
          speaker: alcinous
          text: >-
            Elders and councillors of the Phaeacians, listen. You have eaten, so go home now and rest. Tomorrow I'll invite still more of our elders. We'll hold a feast and make sacrifices in our guest's honour. Then we can arrange his passage. However far his country is, we must send him there promptly, glad to be going and free of trouble or discomfort. No harm must reach him on that voyage. Once he is home, he must accept the good and bad that were his lot from birth, like any other man. Unless, of course, this guest is one of the immortals, come from heaven to visit us. If so, the gods have changed their ways. Before now, when we offered a hundred cattle, they showed themselves plainly. They sat at our feasts like members of our own people. Even if a lone traveller happened to meet a god on the road, the god made no effort to hide. We are close to the gods in kinship, just as the Cyclopes and the wild giants are.
        - id: ch02-b09
          speaker: odysseus
          text: >-
            Alcinous, please put that thought aside. There's nothing divine about either my body or my mind. Compare me with the most troubled people you know. If I told you every burden heaven has laid on me, you would say I've suffered even more than they have. Still, let me eat, unhappy as I am. An empty belly won't leave a man alone. Whatever terrible sorrow he carries, it demands his attention. I'm deep in grief, but my stomach insists on food and drink. It tells me to forget everything else and think only of filling it. Please do as you've proposed. At daybreak, help me get home. Let me once more see my belongings, my slaves, and the greatness of my house. After that, I'd be content even to die.
    - id: ch03
      title: "The clothes the queen recognised"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The guests agreed. Ulysses had spoken reasonably, and they approved of giving him an escort. They poured their offerings, finished as much wine as each wanted, and went home to their own beds. Ulysses stayed in the cloister with the king and queen while the servants cleared supper away. Arete spoke first. She had recognised the fine shirt and cloak he was wearing. They were work that she and her women had made.
        - id: ch03-b02
          speaker: arete
          text: >-
            Stranger, before we talk of anything else, tell me something. Who are you, and where do you come from? Who gave you those clothes? Didn't you say you had come here from across the sea?
        - id: ch03-b03
          speaker: odysseus
          text: |-
            Madam, the full account of my troubles would take a long time. Heaven has pressed its hand heavily on me. But I can answer your question. Far out at sea is the island called Ogygia. Calypso lives there, the powerful and clever daughter of Atlas. She lives alone, far from any neighbour, god or human. Fate brought me to her hearth with no companion and nothing left. Out in the middle of the ocean, Jove struck my ship with his bolts and shattered it. Every one of my brave companions drowned. I held on to the keel. For nine days I drifted here and there. In the darkness of the tenth night, the gods brought me to Calypso's island. She welcomed me and cared for me as kindly as anyone could. She even offered to make me immortal, with no old age to come. But she couldn't persuade me to accept.
            For seven full years I remained with her. Throughout those years my tears soaked the fine clothes she gave me. When the eighth year came, she willingly told me to leave. Perhaps Jove had commanded her, or perhaps she had changed her mind. She sent me away on a raft with plenty of bread and wine. She gave me strong, good clothes too, and a warm wind blowing in the right direction. I sailed for seventeen days. On the eighteenth, I began to see the shapes of the mountains along your coast. How glad I was to find land in sight! But there was more suffering ahead. Neptune stopped me there and sent a fierce storm. The sea rose so high that I couldn't stay on the raft. The wind broke it apart, and I had to swim. Wind and current brought me towards your shore.
            I tried to come ashore, but the place was dangerous. Waves flung me against the rocks, and I couldn't get out. I turned back into the sea and kept swimming until I found a river. That looked the best place to land. There were no rocks, and it was sheltered from the wind. I climbed out there and began to gather my senses. Night was approaching. I left the riverbank, found a thicket, and covered myself from head to foot with leaves. Then heaven gave me a deep sleep. Worn and miserable as I was, I slept through that night and the next day until afternoon. When I awoke, the sun was sinking west. Your daughter's maids were playing on the beach. Your daughter stood among them, looking like a goddess. I asked her to help me. She showed a goodness far beyond what I'd expect in someone so young. Young people are often careless. She gave me plenty to eat and drink, bread and wine. She had me wash in the river and gave me the clothes you see on me now. There is the whole truth, though it has hurt to tell it.
    - id: ch04
      title: "The promise of a passage home"
      blocks:
        - id: ch04-b01
          speaker: alcinous
          text: >-
            Stranger, my daughter did wrong there. Since you first asked her for help, she should have brought you straight to my house along with her maids.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Please don't blame her. She did ask me to follow with the women. I was the one who felt shy and afraid. I thought you might be angry to see me there. Every man can be suspicious and quick-tempered at times.
        - id: ch04-b03
          speaker: alcinous
          text: >-
            I'm not a man to take offence without cause. It's better to use good sense. But by Father Jove, Minerva, and Apollo, now I've seen the sort of man you are and how much we think alike, I wish you'd remain. Marry my daughter and become my son-in-law. Stay, and I'll give you a house and land. Yet no one shall force you to stay against your will. May heaven forbid such a thing. To make you certain of it, I'll arrange your escort tomorrow. You can sleep the whole way if you choose. My men will carry you over quiet waters to your home, or wherever else you wish, even if it's much farther off than Euboea. Some of my people saw that land when they took fair-haired Rhadamanthus to visit Tityus, Gaia's son. They say it's the farthest place of all. Yet they completed the voyage in a single day without tiring themselves, and came back afterwards. You'll see how our ships surpass all others, and what wonderful oarsmen my sailors are.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Ulysses was delighted. He prayed aloud to Jove.
        - id: ch04-b05
          speaker: odysseus
          text: >-
            Father Jove, let Alcinous carry out every promise he has made. His fame among men will never perish, and I will see my own land again.
        - id: ch04-b06
          speaker: narrator
          text: >-
            While they talked, Arete ordered a bed to be made in the gatehouse room. The maids were to lay good red rugs, spread coverlets over them, and bring woollen cloaks for Ulysses to wrap around himself. The women went out carrying torches. When the bed was ready, they returned to invite him to it.
        - id: ch04-b07
          speakers: [bed_maid_1, bed_maid_2, bed_maid_3]
          ensemble: chorus
          text: >-
            Sir, please get up and come with us. Your bed is ready for you now.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Ulysses was very glad to go and rest.

            He slept in the room above the gateway, where sounds echoed below. Alcinous lay farther inside the house, with the queen, his wife, beside him.
