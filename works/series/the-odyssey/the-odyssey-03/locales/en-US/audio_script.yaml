  chapters:
    - id: ch01
      title: The sacrifice on the shore
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The sun was rising from the lovely sea into the sky, bringing light to mortals and immortals. The ship reached Pylos, the city of Neleus. On the shore, the people had gathered to sacrifice black bulls to Neptune, the god who shakes the earth. There were nine companies, each five hundred strong. Each company had nine bulls to offer. They were eating the inward parts and burning the thigh bones over the embers for Neptune when Telemachus arrived with his crew. The men lowered and gathered the sails, anchored the ship and went ashore. Minerva walked in front, with Telemachus following her.
        - id: ch01-b02
          speaker: athena
          text: |-
            Telemachus, do not be shy or frightened. You crossed the sea to discover where your father is buried and how his life ended. Go directly to Nestor, and we will hear what he can tell us. Ask him for the truth. He is a good man, and he will not deceive you.
        - id: ch01-b03
          speaker: telemachus
          text: |-
            Mentor, how can I walk up to Nestor? What should I say to him? I have never learned how to talk at length with people. It embarrasses me to question someone so much older than I am.
        - id: ch01-b04
          speaker: athena
          text: |-
            Some of the words will come from your own heart. Heaven will give you the rest. I am certain the gods have cared for you ever since the day you were born.
        - id: ch01-b05
          speaker: narrator
          text: |-
            She walked on quickly. Telemachus followed until they reached the assembled companies of the Pylians. Nestor sat among his sons. Around them, people were preparing the meal, threading pieces of meat onto spits while other pieces were already cooking. When they noticed the strangers, they crowded around, clasped their hands and invited them to sit.

            Nestor's son Pisistratus took each visitor by the hand himself. He seated them on soft sheepskins spread on the sand beside his father and his brother Thrasymedes. He gave them their shares of the inward meat and filled a golden cup with wine. With a greeting, he offered it first to Minerva.
        - id: ch01-b06
          speaker: pisistratus
          text: |-
            Sir, please pray to King Neptune. This feast is being held in his honor. When you have prayed and poured your offering, give the cup to your friend so he can do the same. I am sure he too raises his hands in prayer. No man can live in this world without God. But he is younger than you, about my age. It is right that you should go first.
        - id: ch01-b07
          speaker: narrator
          text: |-
            He passed her the cup. Minerva approved of his manners in offering it to her before the younger guest. She prayed earnestly to Neptune.
        - id: ch01-b08
          speaker: athena
          text: |-
            God whose waters surround the earth, listen to those who serve you and grant our prayers. First, bless Nestor and his sons. Then give all the other Pylians a generous reward for the splendid sacrifice they offer you. And let Telemachus and me succeed in the business that has brought us here by ship.
        - id: ch01-b09
          speaker: narrator
          text: |-
            When she finished, she passed the cup to Telemachus, and he prayed as she had. Soon the rest of the meat was roasted and taken from the spits. The carvers gave everyone a portion, and the company enjoyed a fine meal. Once they had eaten and drunk enough, Nestor, the horseman of Gerene, addressed the strangers.
        - id: ch01-b10
          speaker: nestor
          text: |-
            Our visitors have finished eating. Now we may ask who they are. Tell us, strangers, who are you? What harbor did you sail from? Do you trade, or do you travel the seas as raiders, attacking everyone and finding everyone against you?
        - id: ch01-b11
          speaker: narrator
          text: |-
            Telemachus answered without fear. Minerva had made him brave enough to ask about his father and win respect for himself.
        - id: ch01-b12
          speaker: telemachus
          text: |-
            Nestor, son of Neleus, you bring honor to all the Achaeans. I will answer your question. We come from Ithaca, beneath Mount Neritum. I have come on a private matter, with no public business. I want news of my unfortunate father Ulysses. People say he helped you take the city of Troy. We know what happened to the other heroes who fought there. But the gods have hidden even this from us about my father. Is he dead at all? No one can tell us for certain where he died. Was he killed fighting on the mainland, or did he drown in Amphitrite's waves?

            I ask for your help here at your knees. Tell me about his unhappy end, if you saw it yourself or heard about it from another traveler. He seems to have been born for trouble. Do not spare my feelings by softening the truth. Tell me plainly what you saw. If my brave father ever helped you faithfully, in words or actions, while the Achaeans were hard pressed among the Trojans, remember that kindness now. Do this for his son, and hide nothing from me.
    - id: ch02
      title: The long return from Troy
      blocks:
        - id: ch02-b01
          speaker: nestor
          text: |-
            My friend, the years you ask about hold so much sorrow for me. The brave Achaeans suffered on the sea when they followed Achilles on his raids. We suffered again in the fighting outside King Priam's great city. All our finest men fell there. Ajax and Achilles, Patroclus whose counsel was as wise as a god's, and my own dear son Antilochus. He was wonderfully swift on his feet and brave when he fought. Yet our suffering went far beyond even those losses. How could any mortal tell the whole of it? Suppose you stayed here asking me questions for five years, or even six. I would still have more to tell about what the Achaeans endured. You would have grown tired of the story and turned toward home before I could finish it.

            We tried every plan we could for nine long years, with heaven working against us. Through all that time, nobody could equal your father's cunning. If you really are his son, I can scarcely believe what I see. You even speak like him. Who would expect such similar voices from men so far apart in age? Your father and I agreed from first to last. We never quarreled in the camp or in council. We shared one purpose, to advise the Argives on the best way to order everything.

            After we took Priam's city, heaven scattered us, and we began sailing home. Then Jove decided to bring trouble on the Argives during the voyage. Not all our men had acted wisely or shown good sense. Many met a terrible end because Minerva, Jove's daughter, was angry. She made the two sons of Atreus quarrel.

            The brothers chose entirely the wrong time to call their assembly. It was already sunset, and the Achaeans had drunk so much wine that their heads were heavy with it. The brothers explained why they had called us together. Menelaus wanted us to launch our ships and make for home at once. That displeased Agamemnon. He wanted us to stay until we had offered sacrifices of a hundred beasts to appease Minerva. Foolish man. He ought to have understood that he would never persuade her. Once gods have made a decision, they are not quick to change their minds. The brothers stood facing one another, throwing harsh words back and forth. The Achaeans sprang up, shouting so loudly the air rang with it. They were divided over what to do next.

            We lay down that night still nursing our anger. Jove was planning further harm. In the morning, some of us launched our ships and loaded our possessions and our women. About half the army stayed with Agamemnon. The rest of us boarded and sailed away. The gods had calmed the sea, and our ships made good progress. At Tenedos we offered sacrifices, eager as we were to reach our homes. But cruel Jove did not intend to let us return yet. Another quarrel broke out. Some men turned their ships around and followed Ulysses back to make peace with Agamemnon. I could see more trouble ahead, so I kept going, with all the ships that followed me. The son of Tydeus sailed with us too, with his crews.

            Menelaus caught up with us later at Lesbos. We were trying to choose our route. Should we pass outside Chios, near the island of Psyra, leaving Psyra on our left? Or should we sail inside Chios, opposite the stormy headland of Mimas? We asked heaven for a sign. The answer showed that our quickest escape from danger was to cross the open sea toward Euboea. We followed it. A good wind came up and carried us swiftly through the night to Geraestus. There we made many offerings to Neptune for bringing us so far. Four days later, Diomed and his men moored in Argos. I continued toward Pylos. The wind never weakened after the gods first turned it in my favor.

            So, my young friend, I reached home without learning what happened to the others. I cannot say who returned safely or who was lost. But I owe you everything I have heard since coming back to my house, and I will tell it freely. They say the Myrmidons came home safely with Achilles' son Neoptolemus. Philoctetes, the brave son of Poias, returned too. Idomeneus lost nobody at sea. Every man who had survived the fighting reached Crete with him. And however far you live from the rest of the world, you must have heard how Aegisthus killed Agamemnon, and what a dreadful price he paid for it afterward.

            A man does well to leave a son behind. Look at Orestes. He killed the treacherous Aegisthus, the murderer of his noble father. You are a tall, fine-looking young fellow yourself. Show your courage. Win a name that later generations will remember.
        - id: ch02-b02
          speaker: telemachus
          text: |-
            Nestor, son of Neleus, honored among the Achaeans, Orestes avenged his father gloriously. All our people praise him, and they will remember him forever. I wish the gods would give me that kind of revenge against the wicked suitors. They treat me shamefully and plan to destroy me. But heaven has promised no such happiness to my father or to me. We have to endure as well as we can.
        - id: ch02-b03
          speaker: nestor
          text: |-
            Now you mention it, my friend, I remember hearing about your mother's many suitors. They are hostile to you and ruining your property. Are you simply letting them do it? Or have the people and the will of heaven turned against you? Who can say that Ulysses will not return and punish them all? He could do it alone, or bring Achaeans to help him. If only Minerva loved you as much as she loved him outside Troy. I have never seen a god show affection for anyone so openly as she did for your father. If she cared for you that way, some of these suitors would soon forget all about courting your mother.
        - id: ch02-b04
          speaker: telemachus
          text: |-
            That is more than I can hope for. I cannot let myself imagine it. Such good fortune could never come to me, even if the gods themselves wanted it.
        - id: ch02-b05
          speaker: athena
          text: |-
            Telemachus, how can you say that? Heaven has a long arm when it wants to save someone. I would endure any hardship on the way home, if I could be safe once I arrived. That would be better than a quick journey ending like Agamemnon's. He reached his own house only to be murdered through the treachery of Aegisthus and his wife. Yet no one escapes death forever. When a man's appointed time arrives, even the gods who love him cannot save him.
        - id: ch02-b06
          speaker: telemachus
          text: |-
            Mentor, let us leave that subject. My father will never return. The gods decided long ago to destroy him. But I want to ask Nestor something else. He knows more than anyone. They say he has ruled through three generations. Speaking with him is like speaking with an immortal. Nestor, tell me truly how Agamemnon died in that terrible way. What was Menelaus doing then? How could that false Aegisthus kill a man so much better than himself? Was Menelaus away from Achaean Argos, sailing among other peoples? Is that what gave Aegisthus the courage to kill Agamemnon?
    - id: ch03
      title: Agamemnon's fate
      blocks:
        - id: ch03-b01
          speaker: nestor
          text: |-
            You shall hear the truth. You have already guessed how it happened. If Menelaus had returned from Troy and found Aegisthus alive at home, nobody would have raised a burial mound for that man. His corpse would have been thrown outside the city for the dogs and vultures. Not a woman would have mourned him. His crime was too wicked. But we were far away, fighting hard at Troy. Aegisthus lived comfortably in the heart of Argos. He kept flattering Clytemnestra, Agamemnon's wife, and trying to win her over.

            In the beginning, she wanted nothing to do with his wicked scheme. Her own nature was good. There was also a bard staying with her. When Agamemnon sailed away to Troy, he gave that man strict instructions to guard his wife. But the time came when heaven decided she must be ruined. Aegisthus took the bard away to a deserted island and left him for the crows and seagulls to feast on. Once he was gone, Clytemnestra was willing enough to enter Aegisthus's house. Then Aegisthus offered many burned sacrifices to the gods. He hung tapestries in their temples and decorated them with gold. Things had turned out better for him than he had ever expected.

            Meanwhile, Menelaus and I were sailing home from Troy as friends. When we reached Sunium, the headland of Athens, Apollo struck down Menelaus's steersman with one of his painless arrows. The man was Phrontis. Nobody knew better how to steer a ship through bad weather. He died on the spot with the tiller still in his hand. Menelaus wanted badly to continue, but he had to stay and bury his companion with all the proper rites.

            When he could finally sail again, he reached the Malean headlands. There Jove turned against him. He raised a wind so fierce that waves towered like mountains. The fleet split in two. One part was driven toward Crete, where the Cydonians live around the river Iardanus. Near there, a high headland runs out into the sea from a place called Gortyn. When the south wind blows, the water is rough along that whole coast as far as Phaestus. Beyond Phaestus it is calmer. Even a small headland can shelter a wide stretch of water. That part of the fleet was hurled onto rocks and wrecked there. The crews barely managed to save their lives.

            The other five ships were swept by wind and sea to Egypt. There Menelaus collected great quantities of gold and other wealth among people who spoke a foreign language. Back at home, Aegisthus was planning his crime. After killing Agamemnon, he ruled Mycene for seven years, and the people obeyed him. In the eighth year Orestes returned from Athens and destroyed him. He killed his father's murderer. Then he held a public feast for the people of Argos as part of the funeral rites for his mother and the treacherous Aegisthus. On that very day, Menelaus came home. His ships held all the treasure they could carry.

            So listen to my advice. Do not wander too long so far from home. You must not leave your possessions in the hands of dangerous people staying in your house. They will consume it all between them, and your journey will have been wasted. Even so, I urge you to visit Menelaus. He has only recently returned from peoples so far away that a man blown off course among them could scarcely hope to come back. The seas he would have to cross are vast and terrible. A bird could not fly that distance in twelve months.

            Go to him by sea with your own men, if you wish. If you prefer the land, I can give you a chariot and horses. My sons are here. One can take you to Lacedaemon, where Menelaus lives. Ask him for a truthful account. He is a good man, and you will hear no lies from him.
    - id: ch04
      title: A guest takes wing
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            As Nestor spoke, the sun went down and darkness came. Minerva answered him.
        - id: ch04-b02
          speaker: athena
          text: |-
            Sir, your advice is good. But now have the tongues cut from the sacrificed animals, and order wine to be mixed. We can pour our offerings to Neptune and the other immortals, then go to our beds. It is time for sleep. At a holy festival, people should leave early instead of staying up late.
        - id: ch04-b03
          speaker: narrator
          text: |-
            They did as Jove's daughter advised. Servants poured water over the guests' hands. The pages mixed wine and water in the bowls, set aside each person's portion for an offering and passed the drink around. The tongues were thrown into the fire. Everyone stood to pour wine to the gods. Once they had made the offerings and drunk as much as they wished, Minerva and Telemachus prepared to go back to their ship. Nestor hurried after them and stopped them.
        - id: ch04-b04
          speaker: nestor
          text: |-
            Heaven and the immortal gods forbid it. You must not leave my house to sleep aboard a ship. Do you think I am so poor that I have no clothes or cloaks to spare? Do you imagine I cannot make a comfortable bed for myself and my guests? I have plenty of rugs and cloaks. The son of my old friend Ulysses will not sleep on a ship's deck while I am alive. Nor will he after I am gone. My sons will welcome guests into this house as I do.
        - id: ch04-b05
          speaker: athena
          text: |-
            You are right, sir. Telemachus will be better off accepting your offer. Let him go home with you and sleep in your house. I must return to the crew, give them their instructions and keep their spirits up. I am the only older person aboard. The rest are young men, Telemachus's age, who have sailed with him out of friendship. So I must sleep on the ship. Tomorrow I need to visit the Cauconians as well. They owe me a large sum of money, and it has been due for a long time. Telemachus is your guest now. Send him to Lacedaemon by chariot, with one of your sons for company. Please give them your finest and fastest horses.
        - id: ch04-b06
          speaker: narrator
          text: |-
            Then she changed into an eagle and flew away. Everyone marveled at the sight. Nestor was astonished. He clasped Telemachus by the hand.
        - id: ch04-b07
          speaker: nestor
          text: |-
            My friend, you will become a great hero one day. The gods are already caring for you like this while you are so young. That could only have been Jove's mighty daughter, the Trito-born goddess. She showed such favor to your brave father among the Argives. Holy queen, bless me, my good wife and my children. I will give you a year-old heifer in return, with a broad forehead, still untrained and never yoked by any man. I will cover her horns with gold and offer her in sacrifice to you.
        - id: ch04-b08
          speaker: narrator
          text: |-
            That was Nestor's prayer, and Minerva heard it. He went ahead to his own house, with his sons and sons-in-law following him. Once they were inside, they took their places on the benches and chairs. The housekeeper lifted the lid from a jar of sweet wine. The wine had aged for eleven years when she opened it. Nestor mixed a bowl for everyone. As he prepared it, he prayed again and again and poured offerings to Minerva, the daughter of Jove who carries the aegis. After the offerings, each man drank his fill. The others left to sleep in their own homes. Nestor gave Telemachus a bed in the room above the gateway, alongside Pisistratus, his only son who remained unmarried. He himself slept in an inner room, with his wife the queen beside him.
    - id: ch05
      title: The offering and the chariot
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Morning's child, rosy-fingered Dawn, appeared again. Nestor left his bed and went to the benches standing in front of his house. They were made of white marble, polished smooth. In earlier days Neleus had sat on those benches. The counsel he gave was as wise as a god's. But Neleus was dead now, gone down to the house of Hades. Nestor sat in the place his father had occupied. He held his scepter as the man entrusted with the welfare of all the people.

            His sons left their rooms and gathered around their father. Echephron came, and Stratius, Perseus, Aretus and Thrasymedes. There was a sixth son too, Pisistratus. Then Telemachus joined them. They asked him to take a seat with the family, and Nestor began giving his sons their instructions.
        - id: ch05-b02
          speaker: nestor
          text: |-
            Hurry and do as I tell you, my sons. First of all, we must honor great Minerva. Yesterday at the feast she let me see her plainly. One of you go to the plain. Tell the herdsman to choose a heifer and bring it here at once. Another go to Telemachus's ship. Invite the whole crew, leaving just two men to guard the vessel. Someone must fetch Laerceus, the goldsmith, to gild the heifer's horns. The rest stay here. Tell the maids to prepare an excellent meal and bring out the seats. We need logs for the sacrifice, too, and clear water from a spring.
        - id: ch05-b03
          speaker: narrator
          text: |-
            They hurried away on their different errands. The heifer was brought from the fields, and Telemachus's men arrived from the ship. The goldsmith came with the anvil, hammer and tongs he used to shape gold. Minerva herself came to receive the sacrifice. Nestor supplied the gold, and the smith covered the heifer's horns with it. Their beauty was meant to please the goddess.

            Stratius and Echephron led the animal in by its horns. Aretus brought water from the house in a jug patterned with flowers. In his other hand he carried a basket of barley meal. Strong Thrasymedes waited with a sharp axe, ready to strike. Perseus held a bucket. Nestor washed his hands and scattered the barley meal. He threw a lock of hair from the heifer's head into the fire, offering many prayers to Minerva.

            When the prayers and the scattering of barley were finished, Thrasymedes swung the axe. The blow cut through the tendons at the base of the neck, and the heifer fell. Nestor's daughters and his daughters-in-law cried out in delight. So did his honored wife Eurydice, the eldest daughter of Clymenus. They lifted the animal's head from the ground, and Pisistratus slit its throat. Once it had bled out and was dead, they cut it into pieces. Following the proper order, they removed the thigh bones and wrapped them in two layers of fat, with pieces of raw meat on top. Nestor laid them on the wood fire and poured wine over them. The young men stood beside him holding five-pronged spits. After the thigh bones had burned and they had tasted the inward meat, they chopped the rest into small pieces, threaded them on spits and roasted them over the fire.

            Meanwhile, Nestor's beautiful youngest daughter Polycaste washed Telemachus. She rubbed him with oil after his bath and brought him a fine cloak and shirt. He came out looking like a god and took his place beside Nestor. When the remaining meat had cooked, it was pulled from the spits and everyone sat down to eat. Faithful servants attended them, keeping their golden cups filled with wine. Once the meal and the drinking were finished, Nestor gave another order.
        - id: ch05-b04
          speaker: nestor
          text: |-
            Sons, harness the horses to Telemachus's chariot. Let him set out now.
        - id: ch05-b05
          speaker: narrator
          text: |-
            The sons carried out his order and harnessed the swift horses to the chariot. The housekeeper made ready their food for the journey. She packed bread, wine and sweet things worthy of princes' sons. Telemachus climbed into the chariot. Pisistratus gathered the reins in his hands and took his place at the young man's side. He struck the horses with his whip, and they eagerly ran out into the open country. Behind them stood the high citadel of Pylos. The horses kept going all that day, with the yoke moving to and fro on their necks. At last the sun went down and darkness covered the land.

            They reached Pherae, where Diocles lived. He was the son of Ortilochus and the grandson of Alpheus. He welcomed them generously, and they spent the night with him. At the next appearance of rosy-fingered Dawn, they harnessed the horses again and drove out through the gate, beneath the echoing gatehouse. Pisistratus used the whip, and the horses willingly sped on. Soon they were passing through fields of grain in the open country. Their horses carried them so well that, in time, they came to the end of the journey.

            And when the sun had set and darkness lay over the land,
