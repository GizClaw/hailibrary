audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: measured epic storytelling in plain speech, timbre: warm and clear, pace: unhurried with varied breaths, pitch: medium}
    athena:
      display_name: Athena
      tts: {delivery: assured and perceptive, timbre: clear and firm, pace: measured, pitch: medium}
    telemachus:
      display_name: Telemachus
      tts: {delivery: direct and youthful, timbre: clear and lightly textured, pace: natural with decisive pauses, pitch: medium}
    pisistratus:
      display_name: Pisistratus
      tts: {delivery: courteous and direct, timbre: young and clear, pace: steady, pitch: medium}
    nestor:
      display_name: Nestor
      tts: {delivery: experienced and hospitable, timbre: aged and resonant, pace: unhurried, pitch: medium low}
  chapters:
    - id: ch01
      title: Asking the old king
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            By the time they reached Pylos, people filled the beach. Smoke hung over a feast in Poseidon's honor. Telemachus came ashore, searching the crowd for Nestor.
            Athena still looked like Mentor. She told him to ask Nestor for the truth about his father. He wasn't used to long conversations, especially with someone so much older.
        - id: ch01-b02
          speaker: telemachus
          text: |
            How do I even begin talking to him?
        - id: ch01-b03
          speaker: athena
          text: |
            Some words will come to you. The gods will help you find the others.
        - id: ch01-b04
          speaker: narrator
          text: |
            Athena led him over. Nestor's son Pisistratus greeted them by the hand, found seats on sheepskins beside his father and brother, and brought them food. He handed the cup to the older guest first.
        - id: ch01-b05
          speaker: pisistratus
          text: |
            This feast is for Poseidon. Please pray with us.
        - id: ch01-b06
          speaker: narrator
          text: |
            Athena prayed for Nestor and his family, the people at the feast, and the travelers' errand. Telemachus took the cup next and prayed as she had. They let him eat before asking why he'd come. After the meal, Nestor spoke.
        - id: ch01-b07
          speaker: nestor
          text: |
            What country did you leave to come here?
        - id: ch01-b08
          speaker: telemachus
          text: |
            We've come from Ithaca. Odysseus is my father. I'm trying to find out what's happened to him.
        - id: ch01-b09
          speaker: narrator
          text: |
            Athena gave him the courage to speak plainly.
        - id: ch01-b10
          speaker: telemachus
          text: |
            Please don't spare me anything. If the news is bad, I need to hear it. I'd rather know the truth.
        - id: ch01-b11
          speaker: narrator
          text: |
            Nestor remembered Troy. Achilles, Ajax, Patroclus, and his own son Antilochus had died there. The long war had cost so many lives. Odysseus had been cleverer than anyone. He and Nestor always agreed when they spoke in council.
        - id: ch01-b12
          speaker: nestor
          text: |
            It startled me, hearing you. Your voice is so much like his.
        - id: ch01-b13
          speaker: narrator
          text: |
            The old king described the quarrel after Troy fell. Menelaus wanted to go home at once. Agamemnon insisted they stay to make offerings to Athena, who was angry with the army. The meeting took place late in the day. Men had been drinking, and the argument split them into two groups.
            Nestor sailed with those who wanted to leave. Odysseus was with him. But at Tenedos they quarreled again. Odysseus took some ships back to Agamemnon. Nestor went on. He feared what another delay might bring, and eventually reached Pylos safely.
        - id: ch01-b14
          speaker: nestor
          text: |
            That's all I saw for myself. Once we'd gone our separate ways, I never saw him again.
    - id: ch02
      title: Danger at home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Nestor had heard news of the other men since coming back. Some had brought their crews home safely. Agamemnon had arrived only to be killed by Aegisthus, the man who'd taken his place with Clytemnestra. Later, Agamemnon's son Orestes returned and killed the murderer.
            Nestor praised Orestes and urged Telemachus to make a name himself. The young man wished the gods would let him take revenge like that on the suitors plotting to destroy him. But he believed the gods meant no such good fortune for him and his father.
            Nestor knew about his trouble. Why did Ithaca allow the suitors to go on? Perhaps Odysseus would return after all. Athena had helped the father openly at Troy. She might help the son.
        - id: ch02-b02
          speaker: telemachus
          text: |
            I wish I could believe it. I can't.
        - id: ch02-b03
          speaker: narrator
          text: |
            The companion beside him replied before the king could answer.
        - id: ch02-b04
          speaker: athena
          text: |
            A god can bring help from far away. I'd rather suffer on the way and reach home safely than get back quickly and be murdered.
        - id: ch02-b05
          speaker: narrator
          text: |
            She pointed out that a long, painful journey could end in safety. Agamemnon had come back sooner, only to be murdered at home. The gods could reach a man far away and help him. But they couldn't spare any mortal his appointed death, however much they loved him.
            Telemachus let the question of hope go. Instead, he asked about Agamemnon. How had this happened in his own house? Where had Menelaus been?
            Nestor said that if Menelaus had found Aegisthus alive, he'd have had no grave. Dogs and vultures would have eaten him. Aegisthus had pursued Clytemnestra during the war. At first she refused. Agamemnon had left a singer to watch her. Aegisthus put him on an empty island to die, leaving his body for birds. Then Clytemnestra willingly went with him. He made offerings to celebrate. Together they betrayed her returning husband.
            Menelaus had been delayed. Apollo killed his helmsman Phrontis while he held the steering oar. Menelaus stopped to bury him. Then Zeus sent a storm that broke up the fleet. Some ships were wrecked on Crete, but their crews lived. Menelaus and five ships reached Egypt. There he gathered treasure, far from his murdered brother's country.
            Aegisthus ruled for seven years. In the eighth, Orestes returned. The funeral feast for Aegisthus and Clytemnestra was taking place when Menelaus finally came home. Everything had happened before he could act. Nestor paused, then spoke about Telemachus's next move.
        - id: ch02-b06
          speaker: nestor
          text: |
            Menelaus is the man to ask. He's traveled much farther than I have. Just don't leave your house in those men's hands for too long.
        - id: ch02-b07
          speaker: narrator
          text: |
            If Telemachus chose to travel by land, Nestor would lend him horses and a chariot. One of his sons would drive him.
    - id: ch03
      title: A bed and a road onward
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            By the end of the feast it was dark. The visitors got up to go back to their ship, but Nestor stopped them.
        - id: ch03-b02
          speaker: nestor
          text: |
            Surely I haven't made you feel unwelcome! I've plenty of blankets. My old friend's son won't spend tonight on a ship's deck.
        - id: ch03-b03
          speaker: narrator
          text: |
            Athena agreed that Telemachus should stay. As Mentor, she said she must look after the young sailors, then collect an old debt from the Cauconians. Nestor should send the young man on with his best horses.
            She flew away as an eagle. Nestor took Telemachus's hand. He knew that was Athena. Such help from a god promised great things for the young man. He prayed for his family and promised her a heifer with gilded horns.
            Back in the house, they drank wine and made more offerings. Telemachus slept above the gateway with Pisistratus.
            Early the next day, Nestor began preparing his offering. They brought in a heifer from the fields. A goldsmith gilded the horns, and Nestor's sons brought water and made the fire ready. The sailors joined them from the harbor, leaving two men to watch their ship.
            After prayer, Thrasymedes brought the axe down on the heifer's neck. Nestor's wife and daughters shouted with delight. Pisistratus cut its throat and let the blood drain. They burned some portions as an offering, and cooked the rest to eat. Meanwhile Polycaste, Nestor's daughter, washed Telemachus, rubbed him with oil, and gave him clothes. He came back to sit beside Nestor.
            After the meal, they harnessed the horses and packed bread, wine and delicacies. Pisistratus took the reins. Telemachus climbed up beside him.

            They drove all day and spent the night with Diocles in Pherae. At dawn they set off again. The horses took them across the farmland, until evening drew near once more.
