audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    pisistratus:
      display_name: 庇西斯特拉托斯
      tts: {delivery: 有礼而直接, timbre: 年轻清澈, pace: 平稳, pitch: 中音}
    nestor:
      display_name: 涅斯托尔
      tts: {delivery: 阅历丰富而热忱, timbre: 苍老浑厚, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 皮洛斯海边的祭宴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            太阳从美丽的海上升起，把光明带给凡人，也带给不朽的神。他们的船来到了皮洛斯，那是涅琉斯的城邦。海边聚满了人，正要献出黑公牛，祭祀那位能撼动大地的波塞冬。民众分成九团，每团有五百人，各自献上九头牛。大家正在吃内脏，把腿骨放在炭火上烧给波塞冬。忒勒马科斯和船员们收好帆，抛锚，上了岸。雅典娜走在前头，他在后面跟着。
        - id: ch01-b02
          speaker: athena
          text: |-
            忒勒马科斯，不用害羞，更不用害怕。你大老远渡海来，不就是想问问父亲埋在哪里，又怎样死的吗？直接去见涅斯托尔，看他知道什么。请他说真话，他一定不骗你，他是位好人。
        - id: ch01-b03
          speaker: telemachus
          text: |-
            门托尔，我怎么敢就这么过去？我该跟他说些什么？我还不习惯和别人谈那么久。他比我年长那么多，我哪里好意思开口问啊。
        - id: ch01-b04
          speaker: athena
          text: |-
            到时候，有些话你自己就会想到，其他的，神会提醒你。我相信，你从出生一直到现在，都有诸神照顾。
        - id: ch01-b05
          speaker: narrator
          text: |-
            她加快脚步，忒勒马科斯随着她，来到民众聚会处。涅斯托尔和儿子们正坐在一起，身边的人忙着备饭。有些肉在烤，有些刚往叉子上串。人们一见客人，便围过来握手，请他们坐下。庇西斯特拉托斯是涅斯托尔的儿子，他马上分别拉住两人的手，请他们坐到沙滩上柔软的羊皮上。旁边就是父亲和兄长特拉叙墨得斯。他分给客人内脏肉，把酒倒进金杯，向雅典娜致意，先请她接杯。
        - id: ch01-b06
          speaker: pisistratus
          text: |-
            先生，先向波塞冬王祈祷吧。这是为他举行的祭宴，您也来参加了。等您祈祷、奠过酒，再把杯子给朋友，他也该这样做。我想他一定也会举手求神，人在世上，离不了神明。不过，他比您年轻，跟我年岁相近，还是您先来。
        - id: ch01-b07
          speaker: narrator
          text: |-
            庇西斯特拉托斯递来杯子，雅典娜觉得他让自己先用，十分懂礼，便认真向波塞冬祷告。
        - id: ch01-b08
          speaker: athena
          text: |-
            环抱大地的神啊，请成全仆人的祈求。先请您照拂涅斯托尔，还有他的儿子们。皮洛斯的民众献了这样好的百牲祭，也请您厚厚赐福。最后，保佑我和忒勒马科斯，让我们坐船来皮洛斯想办的事，有个好结果。
        - id: ch01-b09
          speaker: narrator
          text: |-
            她祷告完，把杯子给忒勒马科斯，他也照着祈祷。一会儿，外层的肉烤好了，众人从烤叉上取下，负责分肉的人给大家一人一份。这顿饭吃得很美。吃饱喝够，来自革瑞涅的骑士涅斯托尔开了口。
        - id: ch01-b10
          speaker: nestor
          text: |-
            诸位客人已经用过饭，现在可以问问身份了。两位从外地来的先生，你们是谁？从哪个港口来？做生意吗？还是海上劫掠的人？海盗攻打所有人，所有人也都会反抗他们。
        - id: ch01-b11
          speaker: narrator
          text: |-
            雅典娜给了忒勒马科斯胆量，让他敢问父亲的事，也能赢得人们的尊重。他大胆地回答。
        - id: ch01-b12
          speaker: telemachus
          text: |-
            涅琉斯的儿子涅斯托尔，您是阿开亚人的荣耀。我告诉您，我们从涅里同山下的伊萨卡来。我不是办公事，是为了自己家里的事。我想找不幸的父亲奥德修斯。听说，他曾跟您一道攻下特洛伊。别的英雄在那儿打过仗，后来怎样了，我们都清楚，只有父亲连死没死，神也不让我们知道。没人说得准，他究竟死在大陆的战场，还是落入安菲特里忒的海浪。

            我在您膝前求您，把他悲惨的结局告诉我吧。您亲眼见过也好，别的旅人讲给您也好。他生来就多灾多难。您别因为可怜我、怕我伤心，就把事情说得好听些。您亲眼看到了什么，请都明明白白说出来。当年阿开亚人在特洛伊人那里艰苦作战，我英勇的父亲，若曾用言语或行动忠心帮助您，如今就请记着这份情，照顾他的儿子，把实情全告诉我。
    - id: ch02
      title: 战后的消息
      blocks:
        - id: ch02-b01
          speaker: nestor
          text: |-
            朋友，你提起这些事，我就又想起那些充满悲伤的岁月。勇敢的阿开亚人，跟阿喀琉斯到海上劫掠时吃尽了苦头，在普里阿摩斯那座大城前打仗，也一直受苦。最出色的英雄全死在那里了。埃阿斯、阿喀琉斯，像神一样善于谋划的帕特罗克洛斯，还有我亲爱的儿子安提洛科斯。他跑得那么快，打仗又那么勇猛。可我们受的苦，远远不止这些。一个凡人，哪里能把这些遭遇全讲出来？你就算在这里待五年，甚至六年，不停地问我，我也说不尽阿开亚人的苦难。没等我讲到结尾，你就会听累了，想要回家去。

            九年啊，我们用尽计策，天却总不助我们。论想办法，没人比得过你父亲。你真是他儿子？我简直不敢信自己看见的。连说话也那么像。相差这么多年岁的人，竟会有一样的谈吐。我与他在军营里、在议事时，从头到尾都没争过。我们心意相同，都想让阿尔戈斯人的事情得到最好的安排。

            后来打下了普里阿摩斯的城，我们按照上天的安排分头登船，准备回家。可宙斯还想叫阿尔戈斯人吃苦。军中不是谁都明智懂事，有许多人惹怒了雅典娜，没能有好下场。女神让阿特柔斯的两个儿子起了争执。

            那两兄弟叫大家开会，挑的时辰太不好了。太阳都要落了，阿开亚人喝了很多酒，头脑昏沉。问明缘由，原来墨涅拉奥斯主张马上回航，阿伽门农不乐意，要先献百牲祭，让雅典娜息怒。傻啊，他哪能说服女神呢？神明决定了的事，不会轻易变。他们站着互相骂起来，众人也跳起来喊，声音把天都震响了。该走还是该留，大家意见分开了。

            那晚，我们躺下，心里的气还没消，宙斯却在酝酿更多坏事。次日一早，差不多一半人留下陪阿伽门农，我们这一半把船推出去，装上财物和女人，动身了。诸神让海面很平，船行得顺。到忒涅多斯，我们又献祭，都盼着早回家。可残酷的宙斯还不答应，又起了一场争执。有些人调转船头，跟着奥德修斯去找阿伽门农，想与他和好。我看出不妙，带自己的船队往前走。堤丢斯的儿子也带部下与我同行。

            到莱斯博斯，墨涅拉奥斯追上了我们。我们正在拿不定航路。是走希俄斯外面，经过普叙拉，把这岛留在左边？还是走希俄斯里面，面对那个老起风暴的弥马斯海角？我们请神给个指示。征兆让我们横越外海，直奔欧波亚，这样最快脱险。我们就照做。顺风一起，一晚上船就到了革赖斯托斯。波塞冬帮我们走了这么远，我们在那里向他多多献祭。四天以后，狄奥墨得斯和船员把船停在阿尔戈斯，我接着往皮洛斯。从上天送来这股好风开始，它就没有减弱过。

            年轻朋友，我就是这样回来的，途中没听见其他人的消息。谁到了家，谁死了，我都不知道。可我回家以后听说的，应该全告诉你。人们说，阿喀琉斯的儿子涅俄普托勒摩斯带着密耳弥多涅斯人平安回去了。波亚斯的儿子，勇敢的菲洛克忒忒斯，也是如此。伊多墨纽斯在海上一个人没损失，凡是从战场活下来的，都随他回到克里特。至于阿伽门农怎样死在埃癸斯托斯手里，还有那恶人后来付出的可怕代价，你住得再偏僻也听说过吧。

            有个儿子留下来，真好。俄瑞斯忒斯杀了害死高贵父亲的凶手，把奸诈的埃癸斯托斯除掉了。你长得高大，也英俊，拿出勇气，留个让后人记住的名声吧。
        - id: ch02-b02
          speaker: telemachus
          text: |-
            涅琉斯的儿子涅斯托尔，阿开亚人的荣耀，大家都称赞俄瑞斯忒斯。他为父亲复仇，做得那么好，名字会永远传下去。我真盼着诸神也让我报仇，那些求婚人太坏，欺负我，还打算害我。可神没有给我和父亲这份福气，我们只能忍着。
        - id: ch02-b03
          speaker: nestor
          text: |-
            你一说，我记起来了，听说你母亲有很多求婚人，他们对你不善，正在败你的家。你就这么任他们欺负？还是百姓与上天都反对你？谁知道奥德修斯会不会回来呢？也许一个人，也许带阿开亚人一道，把这些坏人全收拾了。若雅典娜像偏爱你父亲那样偏爱你就好了。在特洛伊，我从没见神明那么明显地护着谁。她对他真是好。如果对你也这样，求婚人中有几个很快就顾不上求婚了。
        - id: ch02-b04
          speaker: telemachus
          text: |-
            不可能吧。这盼望太大，我不敢想。就算诸神都乐意帮忙，我也遇不到这么好的事。
        - id: ch02-b05
          speaker: athena
          text: |-
            忒勒马科斯，你怎么这么说？上天想救人，再远也伸得出手。要是我，只要回到家能保平安，路上多受苦也甘心。总比赶紧回去，却像阿伽门农那样，叫自己的妻子和埃癸斯托斯合谋杀死在家里好。但人终究要死，命中的时辰到了，诸神再疼爱，也救不回他。
        - id: ch02-b06
          speaker: telemachus
          text: |-
            门托尔，先别说了。父亲是回不来的，诸神早定好要毁了他。我倒想问涅斯托尔另一件事。他懂得最多，听说做了三代人的国王，和他谈话就像在向神请教。涅斯托尔，阿伽门农到底怎么死的？墨涅拉奥斯那时干什么去了？埃癸斯托斯比他差那么远，怎么害得了他？是不是墨涅拉奥斯离开阿开亚人的阿尔戈斯，出海去别的民族那里了，这恶人才敢下手？请您说实话。
        - id: ch02-b07
          speaker: nestor
          text: |-
            我不会瞒你。你猜得就是事情的经过。如果墨涅拉奥斯从特洛伊回去，埃癸斯托斯还在家活着，那人就别想死后得到坟墓。他会被扔出城，喂狗和兀鹫，没有女人肯为他流泪。他干的是那么恶毒的事。可我们还在特洛伊辛苦作战，他却待在阿尔戈斯腹地，日子过得轻松舒服，天天说甜言蜜语，哄阿伽门农的妻子克吕泰涅斯特拉。

            起初她不肯，本来心性是好的，不想做这种事。而且有个歌人陪着她。阿伽门农出发前，严令歌人看护妻子。后来，上天决定了她的毁灭。埃癸斯托斯带走歌人，把他丢到无人荒岛，任乌鸦和海鸥吃他。没了这个人，克吕泰涅斯特拉就甘愿去埃癸斯托斯家了。事情顺心得超过指望，他便烧献好多祭品，又用金饰和织锦，布置了许多神庙。

            我与墨涅拉奥斯当时一道从特洛伊回航，我们相处得很好。到了雅典的苏尼翁海角，阿波罗发出神箭，那箭不会使人痛苦，却取走了舵手弗戎提斯的性命。他替墨涅拉奥斯掌舵，在风浪里驾船的本领，没有谁比他更好。他当场就死了，手还握着舵。墨涅拉奥斯虽然非常急着继续赶路，也不得不停下来，埋葬自己的伙伴，把他应得的葬礼办好。

            他终于又能出海，航到了马勒亚那些海角，宙斯却要让他受难。风刮得极猛，浪像山一样高，船队被分成两部分。一部分被风浪推向克里特，基多尼亚人住在那儿的伊阿尔达诺斯河周围。戈尔廷有一处高海角，伸进水里，从那儿一直到费斯托斯，南风一吹，整个海岸都大浪翻滚。过了费斯托斯才好些，小小海角也能挡出很大的避风处。这部分船在那里撞上石头，全毁了，船员勉强逃生。

            另外五艘船被风浪带到埃及。墨涅拉奥斯在语言不同的人们中间，聚了很多黄金和财物。埃癸斯托斯却在国内谋划行凶，杀阿伽门农之后，在迈锡尼统治七年，百姓都听他的话。第八年，俄瑞斯忒斯从雅典回来，杀了害父的凶手，结束了他的日子。后来他给母亲和奸诈的埃癸斯托斯办葬礼，请阿尔戈斯人吃饭。就在那一天，墨涅拉奥斯也到了家，船里装得满满，宝物多得再也装不下。

            所以你听我一句，别在这么远的外面待太久。那些人那么危险，你不该把家业留在他们手中。他们一起把财产吃光，你出门就白费工夫了。不过，墨涅拉奥斯还是一定要见。他刚从遥远的异族那里回来。人要是让风吹得离航线那么远，哪敢想还有回家的日子。那片海又大又可怕，就是鸟儿飞十二个月，也飞不过去。

            你可以带船员从海上去。喜欢陆路，我也给你马车、给你马。我的儿子可以陪你到拉刻代蒙，他就住那里。请他说真话吧，这人好，不会骗你。
    - id: ch03
      title: 化作鹰的客人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            谈话间，太阳已落山，天黑了。雅典娜接过话。
        - id: ch03-b02
          speaker: athena
          text: |-
            先生，您这些话都对。不过，时候不早了，吩咐人把祭牲的舌头割下，调好酒吧。向波塞冬和其他永生的神奠过酒，我们也该休息了。宗教祭典上，大家最好早点散，别待到深夜。
        - id: ch03-b03
          speaker: narrator
          text: |-
            大家照宙斯的女儿说的去做。男仆给客人浇水洗手，侍童兑好酒和水，给每人留出祭神的一份，再把酒传给大家。他们把祭牲的舌头扔进火里，起身奠酒。等奠过酒，各人也喝得尽兴，雅典娜和忒勒马科斯就想回船去，涅斯托尔立刻追过来，不让他们走。
        - id: ch03-b04
          speaker: nestor
          text: |-
            天和神都不会答应这种事！你们怎么能从我家离开，跑到船上睡呢？难道觉得我很穷，缺衣服，少斗篷，没法给自己和客人准备舒服的床？我毯子有的是，斗篷也足够。奥德修斯是我老友，我活着一天，就不能叫他儿子睡在船板上。往后我的儿子们也会这样，继续把家门敞开，请客人住进来。
        - id: ch03-b05
          speaker: athena
          text: |-
            您有道理，忒勒马科斯听您的更好，就请他跟您回家睡吧。我得去船上，给船员交代事情，安安他们的心。大家全是他的同龄朋友，为交情才来这一趟，只有我一个年长的。所以我必须回去留宿。再说，明天我还要到考科涅斯人那里。他们欠我的一大笔钱，拖了很久没有还，得去收。忒勒马科斯既然做了您的客人，就请您给他车，送他到拉刻代蒙，让一个儿子陪他，马也要最好的、跑得最快的。
        - id: ch03-b06
          speaker: narrator
          text: |-
            她说完，就化成一只鹰飞走了。人人都看得惊奇。涅斯托尔也震惊不已，握住忒勒马科斯的手。
        - id: ch03-b07
          speaker: nestor
          text: |-
            朋友，你年纪轻轻就让神如此护佑，日后一定会成为大英雄。刚才那位，必定是宙斯威严的女儿，那位特里托所生的女神。从前在阿尔戈斯人的军中，她就很眷顾你勇敢的父亲。神圣的女王啊，也照顾我、我的好妻子和孩子们吧。我要还愿，献一头一岁小母牛给您，额头宽，从没驯过，也没让谁套过轭。我会把牛角镀成金色，再献给您。
        - id: ch03-b08
          speaker: narrator
          text: |-
            雅典娜听到了这番祷告。涅斯托尔带大家回家，儿子和女婿跟着。众人坐上椅子、长凳，女管家揭开一罐甜酒，那酒已存了十一年。涅斯托尔兑好一缸，一面再三祈求，一面向雅典娜献酒。她是那位持神盾的宙斯的女儿。奠完酒，各人想喝多少，便喝多少。后来，其他人各回各家安歇，忒勒马科斯则住在门楼上方的房间，与庇西斯特拉托斯同住。他是涅斯托尔家里唯一还没娶妻的儿子。涅斯托尔自己在内室睡下，王后妻子就在身旁。
    - id: ch04
      title: 金角祭牛与上路的马车
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            清晨的女儿、玫瑰指的黎明又来了。涅斯托尔起床，到房子前面，坐在打磨光滑的白色大理石凳上。当年坐在这里的是涅琉斯，他的谋略像神一样高明。如今，他已死去，到了哈得斯的宫中。涅斯托尔坐着父亲的位子，拿着权杖，为民众的福祉负责。

            他的儿子们走出来，聚到他周围。厄刻弗戎、斯特拉提奥斯、珀耳修斯、阿瑞托斯、特拉叙墨得斯，还有第六个，庇西斯特拉托斯。忒勒马科斯来了，他们请他坐在一起。父亲开始吩咐他们。
        - id: ch04-b02
          speaker: nestor
          text: |-
            儿子们，快去办几件事。首先要好好供奉伟大的雅典娜，昨天祭宴上，我亲眼看到了她显现。一个人去平原，找牧人挑头小母牛，马上带来。另一个去船上，请忒勒马科斯的船员都来，只留两人守船。再有一个快去叫金匠拉厄尔刻斯来镀牛角。其余人先别走，告诉女仆，备顿好饭，拿座椅和祭祀用的木柴过来，再打点清澈的泉水。
        - id: ch04-b03
          speaker: narrator
          text: |-
            大家赶紧各自去了。小母牛牵来，船员也到了，金匠带来铁砧、锤子、钳子，那是他加工黄金的工具。雅典娜亲自来接受祭礼。涅斯托尔拿出金子，匠人便把双角镀上，好让女神看见这份美丽而欢喜。

            斯特拉提奥斯和厄刻弗戎牵着牛角，把牛领进来。阿瑞托斯拿绘着花纹的水壶，从屋里取来水，另一只手提一篮大麦粉。特拉叙墨得斯很强壮，举着锋利的斧头，站好等着砍牛。珀耳修斯拿着一只桶。涅斯托尔洗手，撒麦粉，把牛头上一绺毛扔进火里，一次次向雅典娜祷告。

            祷告完，麦粉也撒好了，特拉叙墨得斯挥下斧子。一斧砍断颈根的筋，牛倒了。涅斯托尔的女儿和儿媳都欢喜地叫起来，妻子欧律狄刻也一样。这位年长受尊敬的妇人，是克吕墨诺斯的长女。众人抬起牛头，庇西斯特拉托斯割开牛喉。等血流净，牛彻底死去，才动手切肉。他们按礼把腿骨取出来，包上两层油脂，再搁几片生肉。涅斯托尔放到柴火上，倒酒上去。青年们守在旁边，每人拿着五齿叉。腿骨烧完，大家尝过内脏肉，又把其他部位切成小块，串起来烤。

            这时，涅斯托尔最小的女儿，漂亮的波吕卡斯忒，正替忒勒马科斯洗澡。她洗好，给他抹油，再拿来好看的斗篷和衬衣。他出来时如同天神，坐到涅斯托尔身边。外层的肉熟了，大家把它从叉上拿下来，坐下吃饭。忠实的随从在旁伺候，一直往金杯里添酒。吃喝够了，涅斯托尔又发话。
        - id: ch04-b04
          speaker: nestor
          text: |-
            儿子们，把马给忒勒马科斯的车套上，他这就要出发。
        - id: ch04-b05
          speaker: narrator
          text: |-
            儿子们把快马套好。女管家装了路上要吃的面包、葡萄酒和甜美食物，这些都配得上王子。忒勒马科斯坐上车，庇西斯特拉托斯拿好缰绳，坐到他身旁。他一挥鞭催马，马儿欢快地向辽阔的原野奔去，把皮洛斯的高城堡留在后面。马跑了一整天，脖子上的轭一路晃动，直到日头沉下，天都黑了。

            两人到达费赖。当地住着狄奥克勒斯，他父亲是奥尔提洛科斯，祖父是阿尔斐奥斯。他热情接待客人，让他们住了一夜。清晨的女儿、玫瑰指的黎明再现时，两人重新给马套车，穿过城门，在门楼下留下回响。庇西斯特拉托斯又挥鞭，马儿情愿地奔跑。很快，车到了辽阔乡间的麦田地带。好马拉着他们一路疾行，终于到了旅程的终点。

            等到太阳落山，黑暗罩住了大地的时候，
