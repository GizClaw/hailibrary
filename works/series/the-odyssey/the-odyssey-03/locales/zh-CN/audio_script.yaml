audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    nestor:
      display_name: 涅斯托尔
      tts: {delivery: 阅历丰富而热忱, timbre: 苍老浑厚, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 先吃饭再说
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            日出时，他们到了皮洛斯。岸上的人在祭祀波塞冬，火上烤着牛肉。雅典娜还是门托尔的模样，叫青年去问涅斯托尔。青年没惯过跟人长谈，尤其不敢盘问老人。女神说，有些话他自己就会想出来，其余的话，神会帮他找到。
            两人走过去，庇西斯特拉托斯就握住他们的手，欢迎他们。这是涅斯托尔的儿子。他把客人请到父亲和哥哥身边，坐在羊皮上，又送来吃的。
            如今坐下了，吃的也拿来了。涅斯托尔就在旁边，却没追问他的身份。庇西斯特拉托斯先请年长的客人举杯祈祷，再把杯子交给青年。雅典娜仍是门托尔的样子，她求海神赐福给主人和皮洛斯人，也求这次出行顺利。忒勒马科斯跟着祈祷。饭后，老国王才来问他。
        - id: ch01-b02
          speaker: nestor
          text: |
            你们从什么地方来？是要来找人吗？
        - id: ch01-b03
          speaker: telemachus
          text: |
            我从伊萨卡来。奥德修斯是我的父亲。
        - id: ch01-b04
          speaker: narrator
          text: |
            雅典娜给了他勇气，他继续问。
        - id: ch01-b05
          speaker: telemachus
          text: |
            您跟他一起去过特洛伊。我想知道之后发生了什么。要是他死了，也请告诉我。我年轻，可我还是想知道实话。
        - id: ch01-b06
          speaker: narrator
          text: |
            涅斯托尔想到了阿喀琉斯、埃阿斯、帕特罗克洛斯，还有自己的儿子安提洛科斯。他们都死在特洛伊。战争拖了太久，死的人也太多。奥德修斯的计谋谁也比不了，他跟涅斯托尔议事，从没有过不同的意见。
        - id: ch01-b07
          speaker: nestor
          text: |
            刚才你一说话，我真像是又听到他了。
        - id: ch01-b08
          speaker: narrator
          text: |
            老人接着说，特洛伊陷落后，两位统帅闹翻了。阿伽门农要留下来献祭，平息雅典娜的怒气。墨涅拉奥斯要马上回家。那次会开在傍晚，人们喝了酒，越吵越凶，最后舰队分开了。
            涅斯托尔先走，奥德修斯也跟着。可在忒涅多斯，又有人争起来。奥德修斯带部分船折回去找阿伽门农。涅斯托尔怕再耽误，继续往家走，两人就此分手。
        - id: ch01-b09
          speaker: nestor
          text: |
            后面我就没见过他了。剩下的，都是我回来以后听人说的。
    - id: ch02
      title: 回家以后的危险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            有人回家很平安，阿伽门农却在家中被杀。埃癸斯托斯趁他打仗，接近克吕泰涅斯特拉，后来和她一起害了归来的丈夫。直到阿伽门农的儿子俄瑞斯忒斯回来，才杀死了这个凶手。
            涅斯托尔赞扬俄瑞斯忒斯，让青年也争取留下名声。青年说，他也想这样报仇，杀死要毁掉自己的求婚人，可神没给他和父亲这样的福分。老人问起伊萨卡人怎么会纵容求婚人，又说雅典娜当年多么帮助奥德修斯。女神若也帮儿子，情形就不同了。
        - id: ch02-b02
          speaker: telemachus
          text: |
            我哪敢想这样的好事。就是神愿意，也不会轮到我。
        - id: ch02-b03
          speaker: narrator
          text: |
            身旁那个像门托尔的人接过了话。
        - id: ch02-b04
          speaker: athena
          text: |
            神要是愿意，隔着远路也能救人。我宁愿归途吃苦，最后平安回去，也不愿很快到家，却被妻子和埃癸斯托斯杀死，像阿伽门农一样。
        - id: ch02-b05
          speaker: narrator
          text: |
            雅典娜说，归途艰难，最后也可能安全到家。早回来，却可能遇上家里的杀身之祸。神能帮人，但凡人的死期到了，神也不能替他改掉。
            青年不想再谈希望，转而问起阿伽门农。出事时，弟弟在哪里？谁都没能拦住吗？老人就把经过再说给他听。
            老人说，墨涅拉奥斯若找得到埃癸斯托斯，他别想有坟，尸体只能让狗和秃鹰吃。克吕泰涅斯特拉原先拒绝那人，丈夫留下的歌者也守着她。埃癸斯托斯把歌者扔到荒岛，让他死在那里，被鸟吃掉。之后王后自愿跟了他，他还献祭庆祝。归途中，阿波罗杀死墨涅拉奥斯的舵手。他停船安葬，又遇上宙斯送来的风暴，船队被冲散。有的船在克里特撞毁，人逃出来。他自己带五艘船去了埃及，积累财宝。
            埃癸斯托斯统治七年，到第八年，俄瑞斯忒斯回去复仇。墨涅拉奥斯回来那天，人们正在为埃癸斯托斯和克吕泰涅斯特拉办葬后的宴席。老人望着青年，提议他继续赶路。
        - id: ch02-b06
          speaker: nestor
          text: |
            你该去找墨涅拉奥斯。他跑得远，遇见的人也多。不过尽快回来吧，你家里还有那群人呢。
        - id: ch02-b07
          speaker: narrator
          text: |
            若青年愿意走陆路，他就借出快马和车，还让自己的儿子陪着去斯巴达。
    - id: ch03
      title: 留下的一夜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            到了天黑，客人起身准备回船。涅斯托尔立刻拦住他们。
        - id: ch03-b02
          speaker: nestor
          text: |
            我这里有床有毯子，哪能让奥德修斯的儿子到甲板上过夜？今晚就在家里住。
        - id: ch03-b03
          speaker: narrator
          text: |
            雅典娜答应让青年留下。她装作门托尔，说自己得去照顾那些年轻船员，明天还要向考科尼亚人讨一笔旧债。她请主人准备快马，接着就变成鹰飞走了。
            涅斯托尔握着青年的手，认出了雅典娜。他说，这么年轻就有神帮忙，往后必有出息。他许诺献一头镀金角的小母牛，求女神照顾家人。回到屋里，他们喝酒，又向女神献祭。
            他和庇西斯特拉托斯睡在门楼上。第二天清早，涅斯托尔开始安排祭礼。儿子们牵来牛，请来金匠，准备水和火。船员也来了，只留两个人看船。
            牛角镀好金，大家祈祷完，特拉叙墨德斯就挥斧砍中了牛颈。主人的妻子、女儿高兴地喊着，庇西斯特拉托斯割开牛喉，放尽了血。一部分肉烧给女神，余下的烤来吃。波吕卡斯忒是主人的女儿，她给青年洗了澡，涂上油，再换好衣服。青年回去坐在老人旁边。
            吃好后，他们把面包和酒装上马车。庇西斯特拉托斯拿着缰绳，青年在他身旁坐稳。他们驶出院子，离皮洛斯越来越远。

            他们赶了一天路，晚上在费赖受狄奥克勒斯招待。天亮后，两人继续前行，马车穿过田野，直到又到了傍晚。
