audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    nestor:
      display_name: 涅斯托尔
      tts: {delivery: 阅历丰富而热忱, timbre: 苍老浑厚, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 老国王知道多少
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            太阳刚从海上升起，船到了皮洛斯。岸边聚了许多人，都在向波塞冬献祭，烤牛肉的烟升到众人头顶。雅典娜仍扮作门托尔，带忒勒马科斯下船，催他上前，去找这里的老国王涅斯托尔。
        - id: ch01-b02
          speaker: telemachus
          text: |
            我能跟他怎么说？这么大的事，我从没同人谈过。他年纪那么大，我总不好追着问。
        - id: ch01-b03
          speaker: athena
          text: |
            有的话你会自己想出来，还有的话，神会提示你。
        - id: ch01-b04
          speaker: narrator
          text: |
            她仍是门托尔的模样，领着青年走了过去。主人的儿子庇西斯特拉托斯握住他们的手，把两人请到父亲和哥哥旁边，坐在羊皮褥上。他送上食物，先给年长的客人倒酒，请他向海神祈祷。
            雅典娜求神照顾主人一家和皮洛斯人，让这次寻访顺利，再把酒杯交给青年。两人吃好了，老国王这才打听他们的来处。
        - id: ch01-b05
          speaker: telemachus
          text: |
            从伊萨卡来。奥德修斯是我父亲。您和他打过特洛伊，我想问问，后来他怎么样了。亲眼见的也好，听说的也好，都请告诉我。哪怕他已经死了，也别因为可怜我就瞒着。
        - id: ch01-b06
          speaker: narrator
          text: |
            青年能问出这些话，是雅典娜给了他勇气。这个问题却让老人想起了战死的人，阿喀琉斯、埃阿斯、帕特罗克洛斯，还有自己的儿子安提洛科斯。打了那么多年，苦难一时哪里讲得完。可说到奥德修斯，老人满是赞赏，谁想得出比他更好的计谋？两人在一起商量事情，也从没意见不合。
        - id: ch01-b07
          speaker: nestor
          text: |
            你这一开口，真像你父亲。城破以后，大家急着回家，两个统帅却吵翻了。墨涅拉奥斯要马上走，阿伽门农要留着献祭，平息雅典娜的怒气。傍晚开的会，许多人喝醉了，最后船队分成两路。
            我跟先走的人出海，你父亲也在一起。到了忒涅多斯，又吵起来，他就带几条船折返，跟阿伽门农和解。我不想再等，继续走，平安回了皮洛斯。
            我和你父亲就是在那儿分开的。后来的事，我没亲眼看见，只能把这些年听来的消息告诉你。
    - id: ch02
      title: 回家也会有危险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            有的人和部下都平安到家了。阿伽门农却被害。打仗时，埃癸斯托斯勾引他的妻子克吕泰涅斯特拉，国王回来，两人一起杀了他。直到儿子俄瑞斯忒斯回来，才杀了弑父仇人。老人赞他报仇报得好，也劝青年做出些事，留下好名声。
        - id: ch02-b02
          speaker: telemachus
          text: |
            我也想报仇。那些求婚人欺负我，还想毁了我，可神没给我和父亲这样的福分。
        - id: ch02-b03
          speaker: narrator
          text: |
            老人听过他家的事，问伊萨卡人怎么会由着他们胡来。也许奥德修斯还能回家，雅典娜也可能像当年帮父亲那样，帮帮儿子。
        - id: ch02-b04
          speaker: telemachus
          text: |
            这样的好事，我不敢想。就是神想帮，怕也不会轮到我。
        - id: ch02-b05
          speaker: athena
          text: |
            神要救你，再远也能做到。我宁可一路吃苦，最后平安到家，也不愿早早回去，被妻子和埃癸斯托斯杀掉，像阿伽门农那样。可人到了死期，就是神再喜欢他，也没法留住。
        - id: ch02-b06
          speaker: narrator
          text: |
            青年不再谈父亲能不能回，问起阿伽门农怎么遇害，墨涅拉奥斯去了哪儿，怎么会让凶手得逞。老人说，要是他及时赶到，埃癸斯托斯连坟也别想有，尸体只能给狗和秃鹰。
            克吕泰涅斯特拉原先拒绝那人。丈夫出征时留下歌者，托他看守妻子。埃癸斯托斯就把歌者丢到荒岛，让他死去，给鸟吃。此后，王后自愿跟他走。他得了手，还向神献祭庆祝。
            那时，墨涅拉奥斯的舵手在归途中被阿波罗杀死。他停下来安葬，出海又碰上宙斯掀的风暴。船队散了，一些船撞毁在克里特，人勉强活下来。他自己的五条船到了埃及，后来在异乡攒起许多财富。
            埃癸斯托斯杀了国王，掌权七年。第八年，俄瑞斯忒斯回家报仇。等墨涅拉奥斯回来，人们正在办埃癸斯托斯和克吕泰涅斯特拉葬礼后的宴席。
        - id: ch02-b07
          speaker: nestor
          text: |
            去问他吧。他走得比我远，也许知道得更多。但你要快些回来，别把产业丢给那群人太久。不想坐船的话，我借马车，让儿子陪你去斯巴达。
    - id: ch03
      title: 快马与一夜留宿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            天色晚了，客人要回船，老人拦住了他们。
        - id: ch03-b02
          speaker: nestor
          text: |
            我难道连床和毯子都拿不出？奥德修斯的儿子来我家，哪能还睡在甲板上！
        - id: ch03-b03
          speaker: narrator
          text: |
            雅典娜答应让青年住在这里，自己却还扮着门托尔，说要回船去照看年轻船员。明天，她还要去考科尼亚人那里讨旧债。她请主人拿出最好的快马，送青年去斯巴达，刚说完，便化成鹰飞走了。
            涅斯托尔这才认出是雅典娜。他握着忒勒马科斯的手，说这么年轻就得到女神亲自照顾，将来一定不凡。他向女神求福，许诺献一头没套过轭的小母牛，还要把牛角镀上金。
            回到王宫，众人饮酒，再向女神献祭。两个青年在门楼睡了一夜。次日清早，主人就叫家人准备还愿。有的牵牛，有的请金匠，其余的人备水、生火。他还把船员请来，船上只留两个人看守。
            牛角镀好了金，祈祷也结束了，特拉叙墨德斯便举斧砍中牛颈，家里的妻女欢呼起来。庇西斯特拉托斯割开牛喉，把血放尽。一部分肉投入火中献祭，其余的烤熟了吃。
            波吕卡斯忒是主人的女儿，她给青年洗澡，抹油，换上干净衣服。他吃饭时坐在老人旁边。饭后，马已套好，车上放着面包和酒。

            庇西斯特拉托斯手拿缰绳，青年坐到他旁边。当天，他们赶到费赖，在狄奥克勒斯家住了一夜。第二天早上，两人再上路，快马拉车穿过田野，直到日落还在赶路。
