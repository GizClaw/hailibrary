notes:
  - "Exact comparison source: git show 1208d108:works/series/the-odyssey/the-odyssey-03/locales/en-US/article.md, read in full. The consulted translator is Butler, but these new English sentences are not his imported text."
  - "The user's task exception authorizes compressed reading prose while preserving classic, Homer / 荷马 and both homer Writer IDs. No dedication, preface or numbered footnote appears. This edition does not claim to be unabridged or a literal Chinese translation; new prose has no misleading import source_url or translator field."
  - "Retained: Poseidon's feast and hospitality before questions; the son's hesitation and divine encouragement; fallen comrades and Nestor's agreement with Odysseus; the late drunken council, Menelaus/Agamemnon split and second quarrel at Tenedos; Odysseus turning back; limits of Nestor's eyewitness knowledge; Orestes's revenge and the son's desire for equivalent killing; Athena's ability to save and inability to cancel appointed death; Nestor's hypothetical denial of burial to Aegisthus; Clytemnestra's initial refusal, singer's deliberate abandonment to die, her willing adultery and Aegisthus's celebratory offerings; Apollo killing Phrontis, funeral delay, Zeus's storm, wrecks and Egypt; seven-year rule, eighth-year revenge and Menelaus arriving for the double funeral; warning against long absence; Athena's claimed crew duty and debt collection, eagle departure; promised gilded heifer, axe blow, cut throat and blood; Polycaste washing/anointing; chariot through Pherae."
  - "Compressed: exact sacrificial crowd and bull totals, the detailed Lesbos/Chios/Euboea fleet route, named safe-return catalogues, Cretan coastal description, repeated exhortations, altar equipment and full roasting procedure, Nestor's sons' list and wine age. These compress inventories and routes, not the causal acts in the murder narrative."
  - "Claim inventory in both locales: edition and traditional origin are supported above. Nestor distinguishes firsthand fleet memory from later reports; he does not establish Odysseus's survival. Gods, bird-form departure and supernatural killings are mythology. Sacrifice, slavery and revenge remain this narrative's conduct rather than approved custom or instruction. Time, location, gifts, washing and overnight travel are consistent."
  - "Removed unsupported cup gestures, speculative army motive, invented thoughts at departure and a softened account of the abandoned singer and queen's agency. Each script comes only from its own final article. No media changes."
