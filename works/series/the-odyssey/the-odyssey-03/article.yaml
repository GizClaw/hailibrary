premise: "At Pylos, Telemachus overcomes his hesitation and asks Nestor for the truth. The old king cannot tell him where his father is, but his account of the broken homeward fleet and his practical hospitality give the young traveler a way onward."
characters:
  - {id: telemachus, description: "The young visitor seeking an answer he fears to hear."}
  - {id: nestor, description: "The old king of Pylos, a survivor who distinguishes his memory from later reports."}
  - {id: athena, description: "The goddess accompanying the son in Mentor's form before revealing herself."}
  - {id: pisistratus, description: "Nestor's son, who welcomes Telemachus and drives him towards Sparta."}
  - {id: odysseus, description: "Nestor's absent comrade, last seen turning back towards Agamemnon."}
  - {id: agamemnon, description: "The returned commander whose murder makes home itself seem dangerous."}
  - {id: menelaus, description: "A recently returned traveler whom Nestor recommends questioning."}
  - {id: aegisthus, description: "The man who took Agamemnon's place and killed him."}
  - {id: clytemnestra, description: "Agamemnon's wife, who first resists Aegisthus and then willingly joins him."}
  - {id: orestes, description: "Agamemnon's son, who returned to kill his father's murderer."}
  - {id: polycaste, description: "Nestor's daughter, who washes and anoints the visitor and gives him clothes."}
  - {id: diocles, description: "The host who shelters the travelers at Pherae."}
