  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler, The Odyssey, Book XV; translation published in 1900, transcription including the 1921 second-edition preface"
    claims:
      - "Athena urges Telemachus home, warns him about the ambush, and directs him to Eumaeus; Menelaus and Helen provide parting gifts, and Helen interprets an eagle carrying a goose."
      - "Pisistratus brings Telemachus directly to his ship; the fugitive seer Theoclymenus receives passage; the ship reaches Ithaca safely."
      - "Eumaeus discourages his guest from serving the suitors, describes Laertes and Anticlea, and recounts his childhood abduction from Syra by his nurse and a merchant crew."
      - "After a second bird omen, Telemachus entrusts the seer to Piraeus and walks to the swineherd's hut."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute, Cultural Objects Names Authority"
    claims:
      - "The Odyssey is an ancient Greek mythological epic in twenty-four books traditionally attributed to Homer."
  - url: "https://www.metmuseum.org/perspectives/discovering-homer-odyssey"
    authority: "The Metropolitan Museum of Art, Department of Greek and Roman Art"
    claims:
      - "The museum places the Odyssey in Greek epic and oral tradition and describes Odysseus's journey, Athena's aid and the return to his household."
notes:
  - "Task-scoped user exception to classic's verbatim-import default: keep classic and Homer / 荷马 attribution while preparing new HaiLibrary reading prose. The complete Book XV at git 1208d108 and the live Gutenberg edition are plot evidence, not the wording of either new locale. Locale source_url and translator do not falsely label the writing as Butler's translation."
  - "Retained: Athena's route and warning; requested departure and farewell gifts; Helen's interpretation; the avoided visit to Nestor; the fugitive's passage; Eumaeus's refusal to send the guest to hostile suitors; news of the parents; the nurse's wish to return home and decision to traffic the child; the necklace signal and three stolen cups; six days at sea and the seventh-day death; sale to Laertes; safe landing, second omen, Piraeus's hospitality and the path inland."
  - "Retained conflicts: Athena names Eurymachus and his gifts and makes a hostile generalization about remarried women; these remain her words. The nurse is sexually seduced, obtains an oath, warns that her master would imprison her and kill the crew, and offers the child for sale. Odysseus describes Eumaeus's new slave-owning household as good fortune. Telemachus first suggests Eurymachus's lodging, then after the bird omen entrusts the seer to Piraeus."
  - "Retained ancestral actions: Neleus expels Melampus from Pylos and takes his property; Phylacus imprisons him, a Fury afflicts him, and he recovers the cattle, takes revenge and wins Neleus's daughter for his brother; Amphiaraus dies through a woman's gifts; Dawn takes Cleitus among immortals; Polypheides quarrels and moves to Hyperesia. Condensed: the connecting Antiphates / Mantius / Oicleus and descendants' name chain, gift craftsmanship and royal donor beyond Sidon, coastal itinerary, Syra's idealized crop and painless-death catalogue, and repeated ceremonial speeches."
  - "The bird signs remain Helen's and Theoclymenus's interpretations within a myth. Athena's assistance and Eumaeus's attribution of the nurse's death to Artemis are mythic events and beliefs, not natural-history or medical claims."
  - "The nurse's earlier abduction, sexual encounter, deliberate child trafficking and death all remain. The text retains Athena's prejudice and Odysseus's slave-owner comparison as character statements; neither is asserted in research as a modern truth or silently corrected into a morally improved personality. Narrative blanket ethnic judgments are not generalized to living peoples."
  - "The concurrent return voyage and hut conversation do not assert a modern itinerary, precise travel speed or independently dated chronology."
