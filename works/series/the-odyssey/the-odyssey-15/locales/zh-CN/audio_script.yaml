audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    pisistratus:
      display_name: 庇西斯特拉托斯
      tts: {delivery: "友善务实", timbre: "年轻稳实", pace: "自然", pitch: "中音"}
    helen:
      display_name: 海伦
      tts: {delivery: "亲切自信", timbre: "清晰圆润", pace: "从容", pitch: "中音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "诚恳专注", timbre: "清楚坚定", pace: "缓而分明", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "热心待客，说话朴直而有主见", timbre: "成熟厚实，带乡野质感", pace: "舒缓", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "坦率年轻", timbre: "清朗略带稚气", pace: "自然而有果断的停顿", pitch: "中音"}
  chapters:
    - id: ch01
      title: 天亮就走
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            忒勒马科斯躺在斯巴达，还没有睡。雅典娜来了，催他动身，说母亲的父亲和兄弟都在劝她嫁给欧律马科斯，因为他出的聘礼最多。女神又说，女人嫁了新丈夫，就只替新人打算，忘记前夫的孩子，也不再念着死去的前夫。他得快回去，免得家产也被带走。在他自己成婚以前，就先交给一个靠得住的女仆保管。
            还有海上的伏兵。求婚人已经派船守在伊萨卡和萨摩斯间的海峡，打算截杀他。女神要他离岛远一些，日夜赶路，保护他的神会给他顺风。到家后，船和同伴先回城，他自己去见欧迈奥斯，再让牧猪人通知母亲。
            忒勒马科斯推醒庇西斯特拉托斯。
        - id: ch01-b02
          speaker: telemachus
          text: 快起来，套好马，我们这就上路。
        - id: ch01-b03
          speaker: pisistratus
          text: 这么黑，车可怎么走？还是等天亮，让国王送我们出门，也该谢过他才走啊。
        - id: ch01-b04
          speaker: narrator
          text: 忒勒马科斯只好等着。这里是好，可他多住一天，家里就多被糟蹋一天。早上他立刻向墨涅拉奥斯辞行。国王没拦，还说可以陪他们游览各城，多收些礼物回乡。忒勒马科斯谢过，还是要回家。墨涅拉奥斯便吩咐备饭，拿来酒杯，另送一只金口沿的银碗，那是他从西顿得的。海伦也送了件自己绣的袍子。
        - id: ch01-b05
          speaker: helen
          text: 等你结婚，给新娘穿吧。眼下带回去，请母亲好好收着。
        - id: ch01-b06
          speaker: narrator
          text: 饭吃完，礼物装好，两人就要上车，国王举酒送行，还托他们问候涅斯托尔。这时，右边飞过一只鹰，抓着刚从院子抢走的大白鹅。人们追着喊，鹰还是飞远了。朋友问这是谁的兆头，国王还没想好，海伦已经说，奥德修斯也会像这只鹰，从远处回到家里，向霸占家宅的人报仇。说不定，他已经回去筹划了。忒勒马科斯但愿她说得对，便驾车离开。
    - id: ch02
      title: 港口的逃亡者
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            两人先在费赖住一夜，次日才到皮洛斯。快到海边，忒勒马科斯请朋友直接送他上船，免得涅斯托尔见到，又要留他吃饭过夜。庇西斯特拉托斯帮着把礼物搬到船尾，说回去会向父亲解释，接着催他走。
        - id: ch02-b02
          speaker: pisistratus
          text: 趁我还没回去，你赶紧开船。父亲若知道了，一定到海边来，不把你接回家，他可不会走。
        - id: ch02-b03
          speaker: narrator
          text: |-
            朋友驾车走了，忒勒马科斯叫齐船员，向雅典娜祈祷。船边却又来了一位逃亡者，名叫忒奥克吕墨诺斯。他家世代有人会预言，自己却在阿尔戈斯杀了亲族，对方家人势大，正追来要他的命。
            说起他的祖先墨兰普斯，也吃过不少苦。涅琉斯赶他出皮洛斯，夺了他的家财，他又为涅琉斯女儿和牛群的事，被菲拉科斯关了一年，还受复仇女神折磨。后来脱了身，赶回牛群，报过仇，让兄弟娶了那女子，自己到阿尔戈斯做了国王。
            家里还有安菲阿拉奥斯，宙斯和阿波罗都喜欢他，可因为一个女人收了礼物，他在忒拜送了命。另一个叫克勒托斯，长得俊美，被黎明女神接去，从此和不死的神一起住。
            逃亡者的父亲波吕斐得斯，在安菲阿拉奥斯死后，受阿波罗赐福，成了最出色的先知。但他同父亲吵了架，后来搬去许珀瑞西亚，为人占卜。
            忒奥克吕墨诺斯问清船主是谁。青年告诉他，自己家在伊萨卡，是奥德修斯的儿子，来问父亲的消息，却怕父亲早已丧命。逃亡者便求他收留。
        - id: ch02-b04
          speaker: theoclymenus
          text: 让我上船吧。那些人要杀我，还在后面追。
        - id: ch02-b05
          speaker: narrator
          text: 忒勒马科斯答应，把他的矛放到甲板，请他同坐船尾。众人解开缆绳，升起帆，雅典娜送来顺风，入夜也没停船。越近家乡，也就越近那条埋伏的船。
    - id: ch03
      title: 再留一夜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            奥德修斯此时还在猪棚，与欧迈奥斯一起吃晚饭。他想看看对方还愿不愿留客，就说明早要去城里讨饭，省得一直打扰。他生火劈柴、切肉倒酒都行，也许求婚人肯用他，给他吃的。欧迈奥斯却急了。
        - id: ch03-b02
          speaker: eumaeus
          text: 那可去不得！他们身边只要年轻体面的仆人，会拿你好好相待吗？留下来，没人嫌你。等少主人一到，给你穿的，再送你上路。
        - id: ch03-b03
          speaker: narrator
          text: |-
            奥德修斯谢过他，又问起旧主人的父母。欧迈奥斯说，老王拉厄尔忒斯还在，妻子却因想念儿子去世了。儿子失踪，本已让他难受，丧了妻，他更老了，只肯待在乡下。
            说起那位王后，欧迈奥斯记得她一直对自己很好。他从小跟王后的女儿克提墨涅一起长大，两个孩子都是王后养大的。姑娘后来嫁到萨墨，王后给他新衣、新鞋，派去乡下干活，也仍然疼他。那时还能回宫见她，如今求婚人占着大厅，他连佩涅洛佩一句关心的话都很难听到了。过去，仆人喜欢见女主人，说话、吃喝，拿点礼物再回乡下，有这些照顾，日子也开心些。
            奥德修斯还是没说自己是谁，又问他小时候为何来到伊萨卡，可是家乡被攻破了？
        - id: ch03-b04
          speaker: eumaeus
          text: 夜还长着呢，咱们慢慢聊。其他人想歇了，就先去睡吧。
    - id: ch04
      title: 被带走的孩子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            欧迈奥斯的家在叙拉岛，父亲本是那里的国王。他还是小孩，不懂外头的事。带他的保姆来自西顿，是富人阿律巴斯的女儿，却被塔福斯海盗抓去卖了，才到了这里。
            一天，腓尼基商船停在岛上。保姆在船边洗东西，一个船员引诱她，两人睡在了一起。之后，那人说她父母还活着，愿意带她回乡。她先让全船人起了誓，保证途中不伤她，接着叮嘱他们，平日在街上或井边，都不许跟她说话。主人知道了，会把她关起来，杀了他们。
            她说要拿金器抵船费，还要把自己照看的男孩一起带走，那是国王的儿子，可以卖个好价钱。商船停了整整一年，货才装全。临行，一个商人拿金子和琥珀串成的项链进宫，趁孩子的母亲和侍女围着看时，向保姆使了暗号。
            黄昏时，国王仍在外聚会，保姆拿走三只杯子，牵起欧迈奥斯就往港口去。
        - id: ch04-b02
          speaker: eumaeus
          text: 她牵着，我就走了。船一离岸，我连怎么回家都不知道。
        - id: ch04-b03
          speaker: narrator
          text: |-
            六天六夜过去，到第七天，欧迈奥斯说，是阿耳忒弥斯杀了保姆。船员把她的尸体扔下海。孩子孤零零的，周围全是陌生人。船开到伊萨卡，拉厄尔忒斯把他买下，安提克勒娅照顾他长大。他再没有回过叙拉岛。
            奥德修斯听得同情，又说，宙斯也给过他好处，有好主人，有得吃喝，总好过自己四处讨饭。这次讲的身世是真的，听的那个人，却始终不肯报上真名。他们聊到深夜，只能睡一小会儿了。
    - id: ch05
      title: 走向猪棚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            忒勒马科斯终于平安靠岸，避开了伏兵。众人吃过早饭，他吩咐同伴带礼物和船回城，自己去看乡下的牧人。
            新客人问该往哪住。他说自己不在家，母亲又躲着求婚人，在楼上织布，不方便招待客人。可以去欧律马科斯家，那人在岛上很受尊重，也最想娶母亲。只是婚事未成，求婚人会不会先死，得由宙斯决定。
            话音未落，右边飞过一只鹰，爪子里抓着鸽子，羽毛往下掉，落在众人和船之间。先知把青年拉到一旁，说这就预告他家在伊萨卡依旧强盛。忒勒马科斯盼能应验，随后找来可信的船员庇莱奥斯，托他先招待客人，自己回来再接。庇莱奥斯答应，带着客人上船。

            忒勒马科斯系紧鞋子，提起矛，独自朝猪棚走去。
