audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 用朴素的语言从容讲述史诗
        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    athena:
      display_name: 雅典娜
      tts:
        delivery: 自信清楚
        timbre: 明亮沉静
        pace: 从容
        pitch: 中音
    telemachus:
      display_name: 忒勒马科斯
      tts:
        delivery: 年轻直率
        timbre: 清澈诚恳
        pace: 利落有分寸
        pitch: 中音
    pisistratus:
      display_name: 庇西斯特拉托斯
      tts:
        delivery: 友善务实
        timbre: 年轻稳实
        pace: 自然
        pitch: 中音
    menelaus:
      display_name: 墨涅拉奥斯
      tts:
        delivery: 慷慨而审慎
        timbre: 成熟饱满
        pace: 稳健
        pitch: 中低音
    helen:
      display_name: 海伦
      tts:
        delivery: 亲切自信
        timbre: 清晰圆润
        pace: 从容
        pitch: 中音
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts:
        delivery: 诚恳专注
        timbre: 清楚坚定
        pace: 缓而分明
        pitch: 中低音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，措辞有分寸
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    eumaeus:
      display_name: 欧迈奥斯
      tts:
        delivery: 热心待客，说话朴直而有主见
        timbre: 成熟厚实，带乡野质感
        pace: 舒缓
        pitch: 中低音
    phoenician_nurse:
      display_name: 腓尼基乳母
      tts:
        delivery: 直接而工于盘算
        timbre: 饱满清楚
        pace: 有条不紊
        pitch: 中音
    phoenician_trader:
      display_name: 腓尼基商人
      tts:
        delivery: 圆滑而善于劝说
        timbre: 温和略带干涩
        pace: 从容
        pitch: 中低音
    piraeus:
      display_name: 庇莱奥斯
      tts:
        delivery: 诚恳可靠
        timbre: 年轻结实
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 黎明前的催促
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            雅典娜到了美丽的拉刻代蒙，来叫奥德修斯的儿子赶紧回家。墨涅拉奥斯屋前的庭院里，两个年轻人正在过夜。庇西斯特拉托斯睡熟了，忒勒马科斯却挂念苦命的父亲，整夜睡不着。女神走到他身边。
        - id: ch01-b02
          speaker: athena
          text: |
            忒勒马科斯，离家这么远，不能再待下去。财产交在那群危险的人手里，会被吃光，最后你白跑一趟。快请墨涅拉奥斯送回去吧，要想见母亲仍在家，得抓紧。她的父兄都在催她嫁欧律马科斯，他比别人出手大方，还不断增加聘礼。但愿家里贵重东西没被人违着你的心愿搬走。你知道女人怎样，总替新丈夫打算，前一个丈夫的孩子，连同死去的那个父亲，就不再放在心上。

            回家后，交给最稳妥的女仆管理一切，等上天肯送你妻子。还得注意一件事，求婚人的头领，埋伏在伊萨卡和萨摩斯之间的海峡，准备在你抵家以前杀你。我看他们不大能成，反倒吃你家业的人，会有几个先入土。船要白天黑夜不停走，远离那些岛。照看你的神会送好风。到伊萨卡，让船员带船进城，你自己去牧猪人那里，他忠于你。在那儿睡一晚，再叫他报给佩涅洛佩，说你从皮洛斯平安归来了。
        - id: ch01-b03
          speaker: narrator
          text: |
            女神回奥林波斯去了。青年用脚跟碰醒同伴。
        - id: ch01-b04
          speaker: telemachus
          text: |
            咱们该动身回家了。庇西斯特拉托斯，起来把马套到车上吧。
        - id: ch01-b05
          speaker: pisistratus
          text: |
            再着急，也不能摸黑赶车。天快亮了，等等墨涅拉奥斯，让他把礼物装好，再好好道别。客人受过主人的情，一辈子都该记着。
        - id: ch01-b06
          speaker: narrator
          text: |
            天色就在这时开始亮。墨涅拉奥斯留下海伦继续睡，自己起床朝两人过来。忒勒马科斯一看，赶忙穿衣，披上大斗篷，出去迎接。
        - id: ch01-b07
          speaker: telemachus
          text: |
            我的心早到家乡去了，墨涅拉奥斯。请现在送我回去吧。
        - id: ch01-b08
          speaker: menelaus
          text: |
            忒勒马科斯，你坚持要走，我不拦。主人黏着客人不放，或是冷冰冰赶人，我都不喜欢。该有个分寸。人要走，却扣着不让，跟人要留，却赶出门，同样不好。住在家里就好好招待，想动身就帮他动身。

            不过等一等，礼物得拿来让你看看，再放上车。我叫女人们用现成食材做顿足够的饭，这么远的路，吃过再走，合礼，也让你少花钱。要是愿意游一游希腊或伯罗奔尼撒，我还可以亲自套马，陪你走遍大城。谁也不会让咱们空手出门，青铜鼎、两头骡子、金杯，总会送些。
        - id: ch01-b09
          speaker: telemachus
          text: |
            我还是想马上归家，墨涅拉奥斯。出门后，产业没人守。怕父亲没找到，自己先毁了，或回去看，值钱的已被偷。
        - id: ch01-b10
          speaker: narrator
          text: |
            听他这样说，墨涅拉奥斯立刻吩咐妻子和仆人，拿家里现有的食物，为客人好好备一餐。厄忒俄纽斯这时来了，他住在近处，刚起床就过来。国王叫他点火，把肉烤上，他马上照办。国王自己往库房走，那地方散发着香气。他不是独自去，海伦和墨伽彭忒斯也跟在身边。到了存放珍宝之处，选出一只双耳杯，又叫儿子带上一只银制的调酒碗。海伦则打开藏衣的箱子，里面全是亲手做的好衣服。她取的那件，在箱子最底下，比其他都大，绣花也最美，光芒像天上一颗星。他们拿好礼物，穿过房屋，回到忒勒马科斯跟前。
        - id: ch01-b11
          speaker: menelaus
          text: |
            孩子，愿赫拉强大的丈夫宙斯，满足心愿，保你安返。我把全家最美、最贵的器皿送你。调酒碗是纯银的，边口嵌金，赫淮斯托斯亲制。我回家途中去看西顿王斐狄摩斯，他送的。如今给你。
        - id: ch01-b12
          speaker: narrator
          text: |
            双耳杯先交到手中，墨伽彭忒斯再摆下调酒碗，美丽的海伦在旁捧着衣袍。
        - id: ch01-b13
          speaker: helen
          text: |
            我也给你一样亲手的纪念，别忘了海伦。留给你结婚时的新娘穿。成婚以前，请母亲保管。愿你带着欢喜回到国中，回到家里。
        - id: ch01-b14
          speaker: narrator
          text: |
            青年高兴地收下，朋友把东西装车，每一样都赞叹。国王再领他们进屋吃饭。侍女用漂亮的金壶倒水到银盆，供他们洗手，桌子也摆得干净。女管事拿上面包和家里各种美食，厄忒俄纽斯切肉分份，墨伽彭忒斯倒酒。两人吃喝够，便套马坐车，出内门，穿过回声很响的外院门楼。国王右手端金杯跟来，让他们出发前奠酒。他站在马前举杯相送。
        - id: ch01-b15
          speaker: menelaus
          text: |
            二位一路好。见涅斯托尔，把我怎样待你们告诉他。当年阿开亚人打特洛伊，他真像父亲一样疼我。
        - id: ch01-b16
          speaker: telemachus
          text: |
            大王，一见面我们就全部说清。要是回伊萨卡见到父亲已归，也能这么确定就好了。我想告诉他，您多么亲切，还有这么多好礼物跟我回家。
    - id: ch02
      title: 鹰的征兆
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            话还在说，右边飞来一只鹰，爪中大白鹅刚从农庄的院子抢来。男女都在追，边追边叫。鹰近近掠过，飞到马前，又朝右边去了。大家看了高兴，心中安慰许多。
        - id: ch02-b02
          speaker: pisistratus
          text: |
            墨涅拉奥斯，请解释一下，天神的征兆是给我们，还是给您？
        - id: ch02-b03
          speaker: narrator
          text: |
            国王还在斟酌怎么答，海伦已经抢先说了。
        - id: ch02-b04
          speaker: helen
          text: |
            神把意思放进我心里，我照着讲，我相信会成真。鹰是从山里来，那里养大了它，也有它的窝。奥德修斯会像它一样，远行多年，吃尽苦，终于回去报仇。或者人早就在家，正想办法收拾求婚人。
        - id: ch02-b05
          speaker: telemachus
          text: |
            愿宙斯允准！真成了，回家以后，我也会像向神那样，向您许愿。
        - id: ch02-b06
          speaker: narrator
          text: |
            说着他挥鞭，马儿带着颈上摇摆的轭，一路疾驰，过了城市到原野。整天赶路，到日落天黑，来到费赖。狄奥克勒斯住这里，他是奥尔提洛科斯之子，祖父是阿尔斐奥斯。两位来客受了好款待，过一夜。次日，清晨的孩子、玫瑰色手指的黎明一出现，又套马登车，经过内门，驶过回声响亮的外门楼。庇西斯特拉托斯催马，马也乐意往前奔。不多久，到皮洛斯了。
        - id: ch02-b07
          speaker: telemachus
          text: |
            庇西斯特拉托斯，求你帮个忙，希望答应。父辈交情那么久，我们又同龄，一同走过这段路，更亲了。车到我船边，就放我下去，别带过去。见了你父亲，他那么好客，一定留我。可我必须立刻走。
        - id: ch02-b08
          speaker: narrator
          text: |
            朋友考虑过，觉得照办最好，就转车到船旁，将金子和衣裳安放船尾。
        - id: ch02-b09
          speaker: pisistratus
          text: |
            趁我回家报给父亲以前，赶紧上船，船员也都上。我知道他固执，说不放便不放，会亲自赶来找你，没带到人，就不肯回。可他也会大怒的。
        - id: ch02-b10
          speaker: narrator
          text: |
            说完，他驾好马回皮洛斯城，很快到家。忒勒马科斯把人招拢，发下命令。
        - id: ch02-b11
          speaker: telemachus
          text: |
            各位，把船收拾好，咱们回家去。
    - id: ch03
      title: 前来求助的先知
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            船员听命登船。忒勒马科斯还在忙，边忙边在船尾向雅典娜祈祷献祭。有个远方来人走近，是位先知，在阿尔戈斯杀了人，正逃命。他的祖先名叫墨兰普斯。

            墨兰普斯原住多羊的皮洛斯，家财多，房子大，却被强大的涅琉斯王赶走。王占了他财产一年，那时他正关在菲拉科斯王家，守得很严。为涅琉斯的女儿，加上可怕的复仇女神施下深深悲苦，他心里受尽折磨。最后终于活着逃脱，把牛从菲拉刻赶回皮洛斯，报了受辱的仇，还替兄弟娶了涅琉斯的女儿。之后去了阿尔戈斯，命运定他统治许多人，就成家安顿，生了两个有名的儿子。

            这两个儿子，一个叫安提法忒斯，另一个叫曼提奥斯。先说安提法忒斯，他生了俄伊克勒斯，俄伊克勒斯的儿子，就是安菲阿拉奥斯。宙斯和阿波罗两位神，都十分喜爱安菲阿拉奥斯。可他没能活到老，因为一个女人收礼的事，在忒拜丧生。他也有两个儿子，名字分别是阿尔克迈翁、安菲洛科斯。

            再说墨兰普斯的另一个儿子曼提奥斯，他的两个孩子叫波吕斐得斯和克勒托斯。坐着金色宝座的黎明女神，看中了克勒托斯的美貌，把他带走，让他从此跟不朽的神住在一起。至于波吕斐得斯，安菲阿拉奥斯死后，阿波罗就让他做了世上最出色的先知。后来他与父亲争吵，离开故地，去许珀瑞西亚居住。他一直留在那里，替众人预言将来的事。如今走到忒勒马科斯船边，求他帮忙的人，便是波吕斐得斯的儿子，忒奥克吕墨诺斯。
        - id: ch03-b02
          speaker: theoclymenus
          text: |
            朋友，你正奠酒祈祷，我就以这些祭品、以受祭的神恳求你。也以你和同行人的头恳求，务必告诉真话，一点不假。你是什么人，从哪儿来，父母、家乡又怎样？
        - id: ch03-b03
          speaker: telemachus
          text: |
            我实话告诉你，来自伊萨卡，奥德修斯确实是父亲。他曾在世，如今却遭了悲惨的下场。我才有这条船，这些伙伴，到外面探听消息。他离开实在太久。
        - id: ch03-b04
          speaker: theoclymenus
          text: |
            我也在流亡，杀了自己族里的人。他在阿尔戈斯有许多兄弟亲人，势力很强。我不想死在他们手里，只好四处逃，注定要浪迹天下了。求你收留到船上，免得我被杀。他们已经追来了，我知道。
        - id: ch03-b05
          speaker: telemachus
          text: |
            愿意跟我们，就不会被拒绝。来吧，到伊萨卡，有什么就拿什么招待你。
        - id: ch03-b06
          speaker: narrator
          text: |
            他接过来客的矛，放甲板，自己在船尾坐下，请客人陪坐。水手解缆，他叫众人抓好绳索，大家动作很快，把桅杆放进横梁的桅座，竖起，再用前支索固定。随后拉牛皮拧成的帆索，升好白帆。雅典娜送来清新的强风，顺着航向，把船尽可能快地推去。他们经过克鲁诺伊，再过卡尔基斯。

            日落了，地上黑下来。船迅速到斐亚，再至厄利斯，那里由埃佩奥斯人作主。然后船头向飞掠般的群岛驶去。忒勒马科斯想的却是，自己会逃出性命，还是被捉住呢？
    - id: ch04
      title: 棚屋里的身世之问
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            这时候，奥德修斯、欧迈奥斯和帮手们在棚里用晚饭。吃喝好了，客人想再试主人，会继续好心收留在牧场，还是打发他去城里。
        - id: ch04-b02
          speaker: odysseus
          text: |
            欧迈奥斯，还有各位，明日我想出发，进城要饭，别再麻烦大家。替我想想办法，派个可靠的人领路吧。只能挨街去讨，看谁赏点酒，给块面包。我也想进奥德修斯的屋，给王后说她丈夫的消息。然后去求婚人那儿，他们东西多，说不定能给顿吃的。

            要我做仆人，很快什么都能干好。听我说，得信我，这是赫尔墨斯的赐福，让人的工作有光彩、有名声。我干杂活，活着的人里没谁更利落。给火添柴，劈柴，切肉，做饭，倒酒，穷人侍候贵人该做的，全行。
        - id: ch04-b03
          speaker: narrator
          text: |
            牧猪人听得十分不安。
        - id: ch04-b04
          speaker: eumaeus
          text: |
            神啊，你怎么想的？靠近那群求婚人，准得毁了。他们的狂妄冲上天，根本不会拿你这样的人当仆役。身边都是年轻俊俏的小伙，穿得齐整，披风内衣都好，发也梳得整洁。桌子干净得很，上面堆满肉、面包和酒。你安心住着，不碍人。我不嫌，其他人也不嫌。等忒勒马科斯回家，衣服会给，想去哪，他也会送。
        - id: ch04-b05
          speaker: odysseus
          text: |
            愿神像我一样爱你！不让我出去乱走，又招祸了。常年漂泊，真没什么比这更糟。可人落魄，为这可怜的肚皮，什么艰难也只能受。既然一定留我等少主人，那问问奥德修斯的父母吧。母亲如何？出征特洛伊时，父亲已经将入老年，现在还活着吗，还是两位都进哈得斯了？
        - id: ch04-b06
          speaker: eumaeus
          text: |
            都告诉你。拉厄尔忒斯在世，可只求死在家里，走得安稳。儿子远去，一直痛。妻子再一死，伤心得更老，比其他苦都催人老。她念儿子，念到不幸断了气。对我好的朋友、邻居，愿谁也别受这结局。

            她还在时，虽然总愁，我却爱去问候，见一见她。她带我长大，和最小女儿克提墨涅一起。一男一女，差不多一视同仁。我们成人，小姐送到萨墨出嫁，收了很多聘礼。我呢，女主人给好内衣披风、给凉鞋，叫到乡下来，仍一样喜爱。那些日子没了。

            眼下倒还好，上天让我这份差事干得顺，有够吃够喝，也有些可分正经的外乡客人。可女主人那头，再难有一句暖话、一点关怀，房子在坏人手里。仆人有时总想见主母，聊几句，在家里吃喝一点，再带点回牧场，有这些，心就舒坦了。
        - id: ch04-b07
          speaker: odysseus
          text: |
            欧迈奥斯，你那时肯定很小，才会离父母家乡那么远。实说给我，是城被打下来、抢空了，还是你独自放牛羊，敌人把你劫了，海上运来，按主人给的价卖掉？
        - id: ch04-b08
          speaker: eumaeus
          text: |
            既然问，就好好坐着，舒服喝酒听吧。现在夜最长，够睡，也够坐着说话。不到睡的时候别急，睡过头跟睡不够同样不好。其他人想睡就去，明早吃完饭，还能放主人的猪。咱们两个留这儿，一边吃喝，一边讲受过的罪。人若经了许多折磨，在世上飘来荡去，过去很久的悲哀，想起来也有乐趣。我的故事是这样。
    - id: ch05
      title: 离开叙拉岛的小孩
      blocks:
        - id: ch05-b01
          speaker: eumaeus
          text: |
            有个叙拉岛，听过吗？在奥尔堤吉亚上方，从那儿起，大地转向另一边。人并不密，土却肥，牛羊的草场多，酒和麦也多。没有饥荒，也没有病。等人老了，阿波罗跟阿耳忒弥斯来，用不痛的箭把他们带走。两个城邦把整个岛分作两部，都由父亲统治。他名叫克忒西奥斯，俄尔墨诺斯的儿子，是能和神相比的人。

            一批精明腓尼基商人驾船到来，腓尼基人是会航海的，船货全是各种小饰物。恰好父亲家有个腓尼基女仆，高得很，长得好，又能干。她到船边洗衣，这群坏蛋就来引诱，把她勾到手，花言巧语，女人本性再好也难挡。勾引她的那人，问了姓名来处，她就把父亲报出来。
        - id: ch05-b02
          speaker: phoenician_nurse
          text: |
            我是西顿人，父亲阿里巴斯，有的是钱。一天从乡下进城，塔福斯海盗捉了我，坐船带来这里，卖给这家主人。价钱他们要的，他也照付了。
        - id: ch05-b03
          speaker: phoenician_trader
          text: |
            那跟我们去看看父母的家，见见他们本人，愿不愿意？两位还在，据说家里也富得很。
        - id: ch05-b04
          speaker: phoenician_nurse
          text: |
            愿意极了。但你们先向我发重誓，海上一路，谁也不能害我。
        - id: ch05-b05
          speaker: eumaeus
          text: |
            商人都按她的话发誓。等说完，她又叮嘱。
        - id: ch05-b06
          speaker: phoenician_nurse
          text: |
            安静些。街头或井边碰见，你们哪个都别跟我讲话。传到主人耳里，就要生疑，我被关，你们全被杀。谁也别泄漏，赶快买够货，装船完毕，来通知。我能摸到多少金子，就带多少。船费还有个东西可付，我是这家好主人年幼儿子的乳母，那是个有趣小娃，刚会到处跑。我把孩子领上船，拿去外国卖，你们就有许多钱了。
        - id: ch05-b07
          speaker: eumaeus
          text: |
            女人回到了家。腓尼基商人还在岛上待满一年，买下许多贵重货品，一样样装进船。等货装得足够，他们才派人过来通知。信使是个很精明的家伙，走进我父亲的宅子，手里拿一串金项链，金子之间串着琥珀珠。母亲和侍女都围着看，把项链放在手里欣赏，跟他商量价钱。他趁这工夫，悄悄给那女人一个眼色，转身就回了船。她随即牵起我的手，领着我往屋外走。

            前面房间桌上，宾客的杯还摆着。这些人陪父亲宴饮，是来侍奉他的，此刻却全去了民众集会。她一把取三只杯，塞进胸口的衣裳，我哪里懂，跟着就走。太阳已下去，大地黑了，我们越走越快，赶到港边，腓尼基船就在那里。登上船，他们带我们出海，宙斯还帮着送顺风。连续六天六夜，到第七日，阿耳忒弥斯出手击她，她像海鸥落水，猛倒在舱底。众人直接扔下海，让海豹和鱼去吃。我就孤单一人，伤心地留着。

            风和浪后来把船送到伊萨卡，拉厄尔忒斯用一些财物买我。头一次看见这国家，就是这么来的。
        - id: ch05-b08
          speaker: odysseus
          text: |
            欧迈奥斯，你受的苦，听得我动心，也怜惜。可宙斯有祸也有福，终究让你遇上好主人，吃喝永不缺，如今过着好日子。我还得一座城又一座城，四处乞讨。
    - id: ch06
      title: 登岸以后
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |
            聊到这里，能睡的时间很少了，眼看天要亮。另一边，忒勒马科斯的船已靠近岸。大家松帆落桅，划进港，抛下系泊石，缆绳拴好，再上海滩，调酒做饭。吃饱喝足，青年开口吩咐。
        - id: ch06-b02
          speaker: telemachus
          text: |
            船往城里开，我在此下。我想到自己一处牧场看看牧人，该看的看遍，到傍晚就进城。明早拿好肉好酒，请大伙吃一餐，酬谢这一趟辛苦。
        - id: ch06-b03
          speaker: theoclymenus
          text: |
            亲爱的年轻朋友，我该如何呢？投哪位大人物的家，还是直接去见你母亲，到你家住？
        - id: ch06-b04
          speaker: telemachus
          text: |
            换平时，我当然请去自己家，吃喝款待不用愁。现在却不合适，我不在，母亲又不肯见客。她连求婚人也少见，躲在楼上守织机，离他们远远的。倒有一家可去，波吕波斯之子欧律马科斯那里。伊萨卡众人很看重他，求母亲、想接奥德修斯位置的人中，他最好，也最不肯放弃。但婚事以前，这些人会不会先倒大霉，天上只有宙斯知道。
        - id: ch06-b05
          speaker: narrator
          text: |
            话还没停，右边又飞来鸟，是阿波罗使者鹰隼。爪中鸽子被扯掉羽毛，纷纷落在青年和船之间。先知把他拉到一旁，紧握住手。
        - id: ch06-b06
          speaker: theoclymenus
          text: |
            忒勒马科斯，鸟从右边来，不会无缘无故，一定是神遣送。一眼我就懂，这是个预兆。你的家族会强盛下去，伊萨卡没有别家王族，比你们更尊贵。
        - id: ch06-b07
          speaker: telemachus
          text: |
            愿你说的成真！我会给你厚礼，好好照顾。到时候，人人见你都该来道喜。
        - id: ch06-b08
          speaker: narrator
          text: |
            他转向自己的朋友庇莱奥斯。
        - id: ch06-b09
          speaker: telemachus
          text: |
            克吕提奥斯的儿子庇莱奥斯，跟我去皮洛斯的人里，一路最肯帮忙的是你。劳驾把客人带到你家，热情招待，等我去接。
        - id: ch06-b10
          speaker: piraeus
          text: |
            客人交给我，吃住款待都由我照顾周全。忒勒马科斯，你想留多久就留多久。
        - id: ch06-b11
          speaker: narrator
          text: |
            庇莱奥斯说完便登上船，吩咐其他人也上来，把缆绳解开。船员纷纷回自己的位置。忒勒马科斯却先把凉鞋系牢，再从甲板取出长矛。矛又长又结实，铜制的矛头磨得锋利。水手松开系缆，把船撑离陆地，按照交代往城里驶。他自己大步走着，尽可能走得快些，直到来到那处牧场。自家数不清的猪在那里觅食，那个格外忠于主人的好牧猪人，就在这里居住。
