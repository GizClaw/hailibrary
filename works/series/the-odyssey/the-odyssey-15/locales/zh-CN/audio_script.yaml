audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    pisistratus:
      display_name: 庇西斯特拉托斯
      tts: {delivery: "友善务实", timbre: "年轻稳实", pace: "自然", pitch: "中音"}
    helen:
      display_name: 海伦
      tts: {delivery: "亲切自信", timbre: "清晰圆润", pace: "从容", pitch: "中音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "诚恳专注", timbre: "清楚坚定", pace: "缓而分明", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "热心待客，说话朴直而有主见", timbre: "成熟厚实，带乡野质感", pace: "舒缓", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "不再久留"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            天没亮，忒勒马科斯就起来了。他推醒庇西斯特拉托斯，催朋友赶快套马。庇西斯特拉托斯揉着眼睛回答。
        - id: ch01-b02
          speaker: pisistratus
          text: >-
            外头黑成这样，路都看不见。等一等吧，天亮了也好跟主人道别。
        - id: ch01-b03
          speaker: narrator
          text: |-
            忒勒马科斯只好等。雅典娜刚来催过，说外祖父和舅舅们劝母亲嫁欧律马科斯，因为他聘礼最多。她说，女人嫁了新人，就替新人着想，忘了前夫的孩子和死去的前夫。他得先赶回去，别让财物被人拿走，没娶妻前，交给可靠的女仆管。
            求婚人还派船守在伊萨卡与萨摩斯间，要杀他。女神叫他离岛远点，昼夜航行，自有神送来顺风。到了岸边，同伴把船送进城，他先去欧迈奥斯那里，请牧猪人告诉母亲他平安回来。斯巴达虽好，可再住一天，家里就多耗一天。

            早上，他开口告辞。墨涅拉奥斯愿意陪他去各城看看，多带些礼物回去。年轻人感谢主人，却坚持要动身。国王便叫人备饭，取出酒杯，又送了一只银碗，碗口镶着金边。这是他在西顿得到的宝物。海伦还拿来一件自己绣的袍子。
        - id: ch01-b04
          speaker: helen
          text: >-
            这件袍子留给你将来的妻子吧。成婚以前，可以请你母亲替你收着。
        - id: ch01-b05
          speaker: narrator
          text: >-
            礼物上了车，马也预备好了。墨涅拉奥斯举酒告别，请他们代为问候涅斯托尔。就在这时，一只鹰从右边飞过去，抓着一只大白鹅。院里的人追着喊，它却越飞越高。庇西斯特拉托斯问，这是给谁看的兆头。海伦说，奥德修斯会像这只鹰，回到自己的地方，惩罚霸占家园的人。也许他已经到了，正做准备呢。忒勒马科斯盼她说中了。他握着缰绳，一心只想上路。
    - id: ch02
      title: "带上一个逃亡者"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            两人在费赖住了一夜，次日到了皮洛斯。靠近海港时，忒勒马科斯请朋友别再送他进宫，直接去船边。涅斯托尔热情好客，见了他，准会又留吃饭又留住宿。他可不能再等了。庇西斯特拉托斯帮忙把礼物放在船尾，答应向父亲解释。他还催朋友快开船，否则老人知道了，说不定亲自来接。车子走远后，忒勒马科斯召来船员，向雅典娜祈祷。

            这时忒奥克吕墨诺斯到了船边。他家世代有先知，可他在阿尔戈斯杀了亲族，死者家属有势力，追得他只能逃。
            墨兰普斯是他的祖先，曾被涅琉斯赶出皮洛斯，又为涅琉斯女儿和牛群的事，被菲拉科斯关了一年。涅琉斯夺走他的财物，复仇女神也使他痛苦。后来他逃出，赶回牛，报仇，把女子嫁给兄弟，自己去阿尔戈斯当国王。家里还有安菲阿拉奥斯，宙斯和阿波罗都喜欢他，却为一个女人收礼的事，在忒拜死了。美貌的克勒托斯被黎明女神接走，同不死的神住着。安菲阿拉奥斯死后，阿波罗给波吕斐得斯最强的预言能力。他同父亲吵架，搬到许珀瑞西亚占卜。他就是忒奥克吕墨诺斯的父亲。
            问过年轻人的身份，这个逃亡者请求搭船离开。
        - id: ch02-b02
          speaker: theoclymenus
          text: >-
            请带上我。他们追到这儿，也不会罢手。
        - id: ch02-b03
          speaker: narrator
          text: >-
            忒勒马科斯收下这位客人，把他的矛放到甲板上，让他坐在自己旁边。船帆升起，雅典娜送来了顺风。海岸往后退，到了夜里，船还在向前走。忒勒马科斯一直望着前头。他离家越来越近，也就离敌人的埋伏越来越近。
    - id: ch03
      title: "欧迈奥斯的往事"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            奥德修斯还在猪棚旁的茅屋住着。一天吃晚饭，他试探主人，说自己明早可以去城里讨饭，免得老是打扰。他能劈柴生火，也会切肉倒酒，也许能替求婚人干活，换点食物。欧迈奥斯着急了。
        - id: ch03-b02
          speaker: eumaeus
          text: >-
            那里去不得！他们只喜欢年轻、穿得体面的仆人，不会好好待你。你就住在这儿，忒勒马科斯回来以后，会给你衣服，帮你安排路上的事。
        - id: ch03-b03
          speaker: narrator
          text: |-
            奥德修斯试出了他的意思，便不再说要走。他问起老王和王后。拉厄尔忒斯还在世，却躲开了人群。儿子没有消息，妻子又死了，他的身体越来越弱。王后正是思念儿子，忧伤太深，才离开人世的。

            他声音低了下来。王后当年把他同女儿克提墨涅一块养大。姑娘嫁到萨墨后，她给他新衣裳和鞋，送他到乡下干活，还是一样疼他。那时还能回宫看看她。现在求婚人控制着屋子，佩涅洛佩连句关心话也难给他。仆人总喜欢去见女主人，说说心里话，在家里吃喝些，再带点东西回乡下，会觉得受了照应。奥德修斯听着，仍没说这是自己的亲人，只问他小时候怎样到了伊萨卡，是不是家乡被人打破了。
        - id: ch03-b04
          speaker: eumaeus
          text: >-
            你们困的先睡。我这段往事，一时说不完。
        - id: ch03-b05
          speaker: narrator
          text: |-
            欧迈奥斯父亲是叙拉岛的国王。他那时小，还不知家外的天地。保姆却是西顿富人阿律巴斯的女儿，被塔福斯海盗掳走卖来的。腓尼基船来了，她在船旁洗东西，一个男人诱她上床。睡过以后，他说她父母健在，可以带她回去。她先让所有船员发誓，保证途中不害她。誓发过了，她才叮嘱他们，谁也不能在街上或井边同她说话。主人一发觉，会关住她，杀掉船员。她愿拿金器付船费，也把男孩带上卖。国王的儿子，能卖好价。

            商船就在岛上整整待了一年，这才把货物备齐，准备开走。一个男人拿着金子和琥珀做的项链来宫里，趁母亲和侍女看首饰，给照料孩子的女人递了信号。那天黄昏，父亲出去聚会没回来。她偷了三个杯子，牵上小男孩，就往港口走。
        - id: ch03-b06
          speaker: eumaeus
          text: >-
            她拉着我，我就跟去了。船开走了，我根本不知道怎么回家。
        - id: ch03-b07
          speaker: narrator
          text: |-
            船在海上航行六天六夜。到了第七天，欧迈奥斯说，阿耳忒弥斯让那个女人死了。水手把尸身扔下海，从此他身旁全是陌生人。船到了伊萨卡，拉厄尔忒斯把他买走。安提克勒娅照顾他长大，但他出生的那座岛，他再也没回去过。

            奥德修斯同情他，又说，宙斯也给了他好处，眼下有个好主人，吃得饱喝得足，自己却还在四处讨饭。这一次身世是真的，客人的真名仍没说。他们谈到很晚，剩下睡觉的时间不多了。
    - id: ch04
      title: "往猪棚去"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            忒勒马科斯平安上岸了。吃完早饭，让船员把礼物和船带回城，他自己要先看牧人。忒奥克吕墨诺斯问住哪儿，他说母亲在楼上织布，躲着求婚人，自己也不在，不便接客。他建议去欧律马科斯家，说那人在岛上最受重视，求娶母亲也最坚决。可办婚事之前，他们会不会先死掉，那就得问宙斯了。

            一只鹰从他们右边经过，爪子里抓着鸽子，羽毛落在船旁。预言者把忒勒马科斯叫到一边，告诉他，这个兆头说明他的家族在伊萨卡仍会兴盛。年轻人盼着那话成真，但眼下得先让客人有个住处。他请可靠的同伴庇莱奥斯接待忒奥克吕墨诺斯，等自己回来再接他。庇莱奥斯应下，带客人回了船上。

            忒勒马科斯系好鞋带，拿起长矛，一个人沿小路向猪棚走去。
