  chapters:
    - id: ch01
      title: "Time to leave"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Pisistratus was asleep, but Telemachus lay awake beside him in Sparta. Menelaus had treated them well. Still, Telemachus couldn't stop thinking about the suitors back home, eating in his father's hall. He had left to find out whether Odysseus was alive. While he searched, nobody was watching his house.

            Athena came in the darkness. He must go, she said. Penelope's father and brothers wanted her to marry Eurymachus, who offered the most valuable gifts. She said women cared for a new husband and forgot their earlier children and dead husbands. Telemachus should return before his property was carried off. Until he married, a trusted maid should look after it.
            There was an ambush too. The suitors' ship waited between Ithaca and Samos to kill him. He must sail day and night, away from the islands. His protecting god would give him wind. Back on Ithaca, the crew should take the ship to town. He should go to Eumaeus and send him to tell his mother he was safe. Telemachus woke his friend.
        - id: ch01-b02
          speaker: telemachus
          text: >-
            Wake up! We should get the horses ready and go.
        - id: ch01-b03
          speaker: pisistratus
          text: >-
            It's still dark. We can't drive yet. Let's wait for morning and say goodbye to Menelaus.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Telemachus waited, without getting any more sleep. At dawn, he asked to leave. Menelaus wouldn't keep a guest who wanted to go. He even offered to go with the young men to visit other cities and bring home more presents. Telemachus refused. He had to look after his own property. So the king ordered breakfast and brought him a cup and a silver bowl edged with gold. The bowl had been a precious gift from Sidon. Helen brought a robe she had embroidered herself.
        - id: ch01-b05
          speaker: helen
          text: >-
            Give this to your bride when you marry. Your mother can keep it safe for you until then.
        - id: ch01-b06
          speaker: narrator
          text: >-
            They folded the robe with the other gifts, ate, and had the horses brought out. Menelaus poured wine for the farewell and sent his greeting to Nestor. Then an eagle flew past on their right. It was carrying a large white goose. People ran shouting after it from the farmyard, but it flew higher and away. Pisistratus asked what the bird meant. Menelaus was considering his answer when Helen spoke. The eagle had left the wild heights and caught its prey in a yard. She believed Odysseus would return in the same way and attack the men who had taken his home. He might even be there already, making his plans.
        - id: ch01-b07
          speaker: telemachus
          text: >-
            I hope you're right.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The travelers drove all day, stayed the night at Pherae, and reached Pylos the following day. Near the harbor, Telemachus asked Pisistratus for a favor. If he went to see Nestor, the old king would insist on another meal, perhaps another stay. Telemachus couldn't wait any longer.
        - id: ch01-b09
          speaker: telemachus
          text: >-
            Take me straight to the ship. Will you explain to your father why I left?
        - id: ch01-b10
          speaker: narrator
          text: >-
            His friend agreed and helped put the gifts in the stern. He told Telemachus to set off before Nestor learned he was back. Then the chariot headed for the palace, and Telemachus gathered his crew.
    - id: ch02
      title: "Two guests"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            As Telemachus prayed to Athena, Theoclymenus approached. He came from a family of seers, but had killed a relative in Argos. The dead man's powerful family was pursuing him, and he needed passage away.
            Neleus had forced his ancestor Melampus out of Pylos. Phylacus kept him in prison for a year, over Neleus's daughter and the cattle. Neleus had taken his wealth, and a Fury brought him grief. He'd escaped, brought the herd back, got his revenge and won the girl for his brother. Then he'd gone to rule in Argos. Amphiaraus belonged to that family. Zeus and Apollo loved him, but he died at Thebes because of a woman's gifts. Dawn took handsome Cleitus to live with the gods. After Amphiaraus died, Apollo made Polypheides his greatest prophet. A quarrel with his father sent him to Hyperesia. He was Theoclymenus's father.
            Telemachus explained who he was. He'd been searching for his father Odysseus, though he feared he was dead.
        - id: ch02-b02
          speaker: theoclymenus
          text: >-
            Let me sail with you. My pursuers won't give up when they reach this place.
        - id: ch02-b03
          speaker: narrator
          text: |-
            Telemachus welcomed him beside the stern and put his spear on deck. The crew cast off. Athena gave them a fair wind, and the land fell behind them. They sailed on by day and through the dark. Telemachus kept looking ahead. An enemy ship was waiting somewhere near his home.

            Meanwhile, Odysseus was eating in Eumaeus's hut. He still looked like an old beggar. His host had told him a great deal, but he wanted to test how long he could stay. He suggested going to town the next morning. He could work for the suitors in return for food. He could chop firewood, keep a fire going, cut up meat, and serve wine. Eumaeus interrupted him.
        - id: ch02-b04
          speaker: eumaeus
          text: >-
            They don't want your help. They like young, good-looking servants, and they won't treat you well. Stay with us until Telemachus comes back. He'll get you clothes and help you travel on.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Odysseus thanked him and asked about the king's father and mother. Laertes still lived, Eumaeus said, keeping away from people. His wife had grieved to death for her son. Losing her made the old man's grief even worse. The queen had raised Eumaeus beside her daughter Ctimene. When she married on Same, the queen gave him clothes and shoes and sent him to work in the country. She loved him as much as before. He could still come to see her then. Now the suitors controlled the house, and even a kind word from Penelope was hard to get. Servants liked to visit their mistress, talk with her, eat in her house and carry something back to the country. Those visits had made them happy. Odysseus kept listening. He didn't tell Eumaeus why the familiar names hurt. At last he asked how he'd come to Ithaca as a child. Had his home been taken in a war?
    - id: ch03
      title: "The swineherd's first home"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Eumaeus said the others could sleep. There was time for him to tell his guest one more story.
        - id: ch03-b02
          speaker: eumaeus
          text: >-
            I was a king's son, on an island called Syra. I was little then. I had no idea how far away other places might be.
        - id: ch03-b03
          speaker: narrator
          text: |-
            His nurse came from Sidon. Her father Arybas had been wealthy, but Taphian pirates had taken her and sold her to the king. When a Phoenician ship arrived, one sailor seduced her as she washed near it. After they slept together, he offered to take her home. Her parents were still living, he said. The crew swore to protect her on the way.

            Nobody must speak to her outside, she warned. If her master found out, he'd lock her up and kill the sailors. She'd bring gold to pay her fare. She would bring the child too. A king's son would fetch a good price. The ship stayed on the island and traded for a whole year. At last the cargo was ready. A man brought a gold and amber necklace to the house. While Eumaeus's mother and the servants admired it, he signaled to the nurse. That evening, with the father at a gathering, she took three cups and led the boy to the waiting ship. They sailed before anyone fetched him.
        - id: ch03-b04
          speaker: eumaeus
          text: >-
            We were at sea for six days and nights. On the seventh day, Artemis killed the woman. The sailors threw her overboard. Then I had only strangers around me.
        - id: ch03-b05
          speaker: narrator
          text: |-
            They brought him to Ithaca, where Laertes bought him. He had been a king's child. Now he served in another king's house. Anticlea looked after him as he grew up. But he never sailed back to the island he came from.

            This was a real history, unlike Odysseus's inventions. He sympathized, but said Zeus had given Eumaeus good fortune too. He had a good master now, and plenty to eat, while the stranger still begged from place to place. Odysseus kept his name secret. They talked until little time was left for sleep.
    - id: ch04
      title: "The path inland"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Telemachus landed safely on Ithaca. After breakfast, he told the crew to take the gifts and ship to town. He would see the herdsmen first. Theoclymenus asked where to stay. Telemachus would be away, and his mother stayed upstairs, avoiding the suitors. His house wouldn't do. He suggested Eurymachus instead, the man everyone respected and the most determined suitor. But Zeus alone knew whether the suitors would die before a wedding. Then a hawk passed on their right with a dove. Feathers fell between them and the ship. Theoclymenus took him aside.
        - id: ch04-b02
          speaker: theoclymenus
          text: >-
            That bird tells me your family will keep its power on this island. I'm sure of what I've seen.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Telemachus hoped so. He called his trusted companion Piraeus and asked him to take care of the traveler until he could fetch him. Piraeus agreed. Theoclymenus boarded the ship again with the others.

            Telemachus fastened his sandals, picked up his spear, and set off inland for Eumaeus's hut.
