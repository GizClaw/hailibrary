  chapters:
    - id: ch01
      title: The summons from home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Minerva traveled to the beautiful city of Lacedaemon. She had come to tell the son of Ulysses that he must set out for home at once. She found the two young men, Telemachus and Pisistratus, lying in the forecourt of Menelaus's house. Pisistratus was deep in sleep. Telemachus had found no rest through the whole night. His thoughts kept returning to his father and all the misery that had overtaken him. The goddess came right up to the wakeful young man and began to speak.
        - id: ch01-b02
          speaker: athena
          text: |
            Telemachus, you have stayed far from home long enough. Your possessions are in a house full of dangerous men. They will eat everything between them, and this journey of yours will have been for nothing. Ask Menelaus to send you back at once, if you want to find your good mother still at home when you arrive. Her father and her brothers are already pressing her to marry Eurymachus. He has given her more than any rival, and keeps adding to his wedding gifts. I hope nothing valuable has been carried out of your house against your wishes. But you know how women are. They want to do all they can for the man they marry, and forget the children of the first husband, and the children's father too once he is dead and gone.

            Go home and leave your property in the care of the most trustworthy woman servant you have, until heaven sends you a wife of your own. There is something else you must take seriously. The leading suitors are waiting for you in the strait between Ithaca and Samos. They intend to kill you before you reach home. I doubt they will manage it. Some of the men eating up your wealth are more likely to find graves themselves. Sail through the night as well as the day, and stay well clear of the islands. The god who watches and protects you will give you a favorable wind. Once you land in Ithaca, send the ship and its crew on to the town. You must go straight to the man tending your pigs. He is loyal to you. Spend the night with him, then send him to Penelope to say you have returned safely from Pylos.
        - id: ch01-b03
          speaker: narrator
          text: |
            The goddess returned to Olympus. Telemachus nudged Pisistratus with his heel to wake him.
        - id: ch01-b04
          speaker: telemachus
          text: |
            Wake up, Pisistratus. We must put the horses to the chariot and set off for home.
        - id: ch01-b05
          speaker: pisistratus
          text: |
            However urgent it is, we cannot drive in the dark. Daylight will be here soon. Wait for Menelaus to bring his gifts and put them in the chariot, and let him say a proper farewell. A guest should remember a kind host for the rest of his life.
        - id: ch01-b06
          speaker: narrator
          text: |
            Dawn was beginning as he spoke. Menelaus had risen, leaving Helen in bed, and came towards them. Telemachus saw him, hurried into his shirt, threw a large cloak over his shoulders and went out to meet him.
        - id: ch01-b07
          speaker: telemachus
          text: |
            My thoughts are all on home, Menelaus. Please send me back to my country now.
        - id: ch01-b08
          speaker: menelaus
          text: |
            If you are determined to leave, Telemachus, I will not keep you. I dislike a host who clings to a guest as much as one who treats him rudely. We need to get the balance right. Holding someone who wants to leave is as wrong as sending away someone who wants to stay. While a guest is under your roof, care for him. When he wishes to depart, help him on his way.

            Just wait until you have seen the fine gifts I mean to give you and I have put them in your chariot. I will ask the women to make you a good meal from the food we have. Before a long journey, eating here will be both more fitting and less costly for you. And if you would like to travel round Hellas or the Peloponnese, I will harness my horses and take you myself through our chief cities. Nobody will let us leave empty-handed. Each will give us something, perhaps a bronze tripod, a pair of mules or a golden cup.
        - id: ch01-b09
          speaker: telemachus
          text: |
            Menelaus, I need to go home directly. I left my property without protection. I am afraid that while I search for my father, I may ruin myself, or find valuable things stolen while I have been away.
        - id: ch01-b10
          speaker: narrator
          text: |
            Menelaus immediately told his wife and servants to prepare a plentiful meal from what was in the house. Eteoneus arrived just then. He lived close by and had only just got up. The king told him to light a fire and cook meat, and he set to it at once.

            Menelaus went down to the fragrant storeroom with Helen and Megapenthes. Among the treasures of his household he chose a double cup and told his son to bring a silver mixing bowl as well. Helen opened the chest holding the lovely robes she had made with her own hands. From the very bottom she took the largest, the one with the richest embroidery. It shone like a star. Then all three returned through the house to Telemachus, and Menelaus addressed him.
        - id: ch01-b11
          speaker: menelaus
          text: |
            Telemachus, may Jove, the mighty husband of Juno, bring you home safely as you wish. I will give you the most beautiful and valuable vessel I possess. This mixing bowl is pure silver, with a rim inlaid with gold. Vulcan made it. Phaedimus, king of the Sidonians, gave it to me when I visited him on my journey home. Now I want you to have it.
        - id: ch01-b12
          speaker: narrator
          text: |
            He put the double cup into Telemachus's hands while Megapenthes set the fine mixing bowl before him. Beautiful Helen stood nearby, holding the robe ready.
        - id: ch01-b13
          speaker: helen
          text: |
            My son, here is something from my own hands to remember Helen by. Give it to your bride to wear on the day of your wedding. Until then, ask your dear mother to keep it for you. May you return happily to your country and your home.
        - id: ch01-b14
          speaker: narrator
          text: |
            Helen handed the robe to Telemachus, and he received it with delight. Pisistratus took charge of loading the presents into the chariot. As he put each one away, he looked at it with admiration. Menelaus then led both young men back through the house and had them sit down to their meal. A maid came carrying water in a beautiful jug of gold. She poured it into a silver basin so they could wash their hands, and brought a clean table to stand beside them. A senior servant brought the bread and offered many other good things from the household's stores. Eteoneus cut up the meat, giving each guest his own share, while Megapenthes went about pouring their wine.

            When they had eaten and drunk enough, Telemachus and Pisistratus harnessed the horses and climbed into the chariot. They drove through the inner gate and beneath the echoing gatehouse of the outer court. Menelaus followed, carrying a golden cup of wine in his right hand so they could pour an offering before departure. He stood before the horses and drank to them.
        - id: ch01-b15
          speaker: menelaus
          text: |
            Have a good journey, both of you. I want Nestor to hear what I have done for you here. At Troy, when we fought with the Achaeans, no father could have treated me more kindly than he did.
        - id: ch01-b16
          speaker: telemachus
          text: |
            Sir, as soon as we see him, we will tell him everything. I wish I could be equally sure of finding Ulysses at home when I reach Ithaca. Then I could tell him how generous you have been, and show him all the beautiful gifts I am bringing back.
        - id: ch01-b17
          speaker: narrator
          text: |
            As he spoke, a bird appeared on his right. It was an eagle carrying a large white goose in its claws, taken from the farmyard. Men and women ran after it, shouting. It flew close to the travelers, then away on their right in front of the horses. The sight delighted them and gave them courage. Pisistratus asked about it.
        - id: ch01-b18
          speaker: pisistratus
          text: |
            Menelaus, tell us what that means. Has heaven sent the sign for us, or for you?
        - id: ch01-b19
          speaker: narrator
          text: |
            Menelaus considered the best answer. Before he could give it, Helen spoke.
        - id: ch01-b20
          speaker: helen
          text: |
            I will explain it as heaven has put the meaning in my heart. I believe this will come true. The eagle came from the mountain where it was born and where it keeps its nest. In the same way, Ulysses will come back after far travels and great suffering to take revenge. Perhaps he has returned already and is preparing trouble for the suitors.
        - id: ch01-b21
          speaker: telemachus
          text: |
            May Jove make it so. If it happens, I will offer vows to you as to a goddess, even when I am back in my own home.
    - id: ch02
      title: A fugitive at Pylos
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Telemachus touched the horses with the whip. They raced through the town and out into the countryside, the yoke swaying on their necks. They traveled all day until the sun went down and darkness covered the land. At Pherae they came to the house of Diocles, the son of Ortilochus and grandson of Alpheus. They spent the night there and were warmly welcomed.

            At the coming of rosy-fingered Dawn, the child of morning, they harnessed the team again and took their places. The chariot passed through the inner gate and under the echoing outer gatehouse. Pisistratus urged the horses on, and they went willingly at speed. Before long they reached Pylos. Telemachus spoke to his friend.
        - id: ch02-b02
          speaker: telemachus
          text: |
            Pisistratus, I hope you will agree to what I ask. Our fathers were friends before we were. We are the same age, and traveling together has brought us closer. So please stop at my ship. Do not drive me past it. If I go to your father's house, his kindness will make him keep me there. I must leave for home at once.
        - id: ch02-b03
          speaker: narrator
          text: |
            Pisistratus considered how to help. At last he turned the horses towards the ship and placed Menelaus's gifts of gold and clothing in the stern.
        - id: ch02-b04
          speaker: pisistratus
          text: |
            Get aboard now, and bring your men aboard too. Leave before I reach home and tell my father. I know how stubborn he is. He will not let you go. He will come down here himself and refuse to return without you. He will be very angry.
        - id: ch02-b05
          speaker: narrator
          text: |
            He drove his fine horses back to the city and soon reached home. Telemachus gathered the sailors to give his orders.
        - id: ch02-b06
          speaker: telemachus
          text: |
            Men, put everything in order aboard. We are setting out for home.
        - id: ch02-b07
          speaker: narrator
          text: |
            They boarded as he had ordered. While Telemachus was busy at the stern, praying and sacrificing to Minerva, a man from far away approached. He was a prophet fleeing Argos after killing a man. His family descended from Melampus, who had once lived in Pylos, the country of sheep.

            Melampus had possessed considerable wealth and a great house of his own. But Neleus, the powerful king, drove him from his country into exile. The king took possession of his goods and kept them for a whole year. Throughout that year Melampus was a closely guarded prisoner in the house of King Phylacus. His mind was troubled over the daughter of Neleus, and he was also pursued by a great sorrow laid upon him by the terrible Erinys. At last he managed to escape with his life. He drove the cattle all the way from Phylace to Pylos, avenged the injuries he had suffered, and gave Neleus's daughter in marriage to his brother. After that he left the country and went to Argos. There it was his appointed fate to become ruler over many people. He settled there, took a wife and established a household. Two sons made that family famous, Antiphates and Mantius.

            Antiphates had a son called Oicleus. Oicleus in turn was the father of Amphiaraus, whom both Jove and Apollo dearly loved. But Amphiaraus did not grow old. A woman's gifts brought him to his death in Thebes. His sons were Alcmaeon and Amphilochus. Melampus's other son, Mantius, became the father of Polypheides and Cleitus. Aurora, seated on her golden throne, carried Cleitus away for his beauty and gave him a place among the immortals. After Amphiaraus died, Apollo made Polypheides the greatest prophet anywhere in the world. He quarreled with his father and moved to Hyperesia, where he stayed and foretold the future for everyone.

            It was his son, Theoclymenus, who now stood before Telemachus as the young man poured offerings and prayed aboard the ship.
        - id: ch02-b08
          speaker: theoclymenus
          text: |
            Friend, I have found you offering sacrifice, so I beg you by the sacrifice itself and by the god receiving it. I beg you too by your own head and the heads of the men with you. Tell me the truth, and nothing else. Who are you? Where have you come from? What is your town, and who are your parents?
        - id: ch02-b09
          speaker: telemachus
          text: |
            I will give you an honest answer. Ithaca is where I come from, and Ulysses is my father. There is no doubt about that. But he has met a terrible end. I brought these men together and took this ship abroad in the hope of hearing some news of him. He has been away from home for so long.
        - id: ch02-b10
          speaker: theoclymenus
          text: |
            I too am a man in exile. I killed someone of my own people. He has many brothers and relatives in Argos, powerful men among the Argives. I am escaping from them before they kill me. Now I must wander the earth. I ask you for protection. Take me aboard and save my life. I know they are coming after me.
        - id: ch02-b11
          speaker: telemachus
          text: |
            Then you shall travel with us. I will not deny you that. In Ithaca you will be our guest, and we will offer whatever we can provide.
        - id: ch02-b12
          speaker: narrator
          text: |
            Telemachus received the spear from his guest and put it down on the deck. He climbed into the ship, took his seat in the stern and invited Theoclymenus to sit at his side. The crew released the mooring cables. Telemachus told them to take hold of the ropes, and they hastened to obey. The mast went into the socket in the crossbeam. They lifted it upright and fixed it firmly with the stays running forward. Then they raised the white sails using sheets made from twisted strips of oxhide. Minerva gave them a favorable wind, fresh and powerful, to carry the vessel along the course they needed as fast as it could travel. In this way they sailed past Crouni and then Chalcis.

            Soon the sun set and darkness covered the land. The ship made a swift passage to Pheae, then on to Elis, the land ruled by the Epeans. Telemachus turned towards the flying islands, wondering whether he would escape death or be captured.
    - id: ch03
      title: Stories in the hut
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Meanwhile Ulysses, Eumaeus and the other men ate supper in the hut. When they had eaten and drunk enough, Ulysses decided to test his host again. Would the swineherd remain kind and ask him to stay, or send him away to the town?
        - id: ch03-b02
          speaker: odysseus
          text: |
            Eumaeus, and all of you, tomorrow I want to leave and beg around the town. I must not go on troubling you and your men. Tell me what you advise, and give me a reliable guide to show the road. I have no choice but to walk through the streets, asking whether anyone will give me a drink and a little bread. I would like to visit Ulysses' house as well and bring Queen Penelope news of her husband. Then I could go among the suitors and see if, with all they have, they might give me a meal.

            I would soon be useful to them as a servant in all sorts of tasks. Listen, and believe what I say. Mercury, who gives skill and honor to men's work, has blessed me. No one alive would be a handier servant. I can put wood on a fire, chop fuel, carve meat, cook and pour wine. I can do all the work poor men must do for those above them.
        - id: ch03-b03
          speaker: narrator
          text: |
            Eumaeus was deeply troubled to hear this.
        - id: ch03-b04
          speaker: eumaeus
          text: |
            Heaven help us, what put that idea into your head? Go near those suitors and you will surely be ruined. Their arrogance reaches the sky. They would never employ a man like you. Their servants are young, handsome fellows, neatly dressed in fine shirts and cloaks, with tidy hair. The tables are kept spotless and covered with bread, meat and wine. Stay here. You are in nobody's way. I do not object, and neither does anyone else. When Telemachus comes home, he will give you clothes and send you wherever you want to go.
        - id: ch03-b05
          speaker: odysseus
          text: |
            May the gods love you as I do. You have saved me from wandering into more trouble. There is nothing worse than always being on the road. Yet once a man has fallen in the world, he will endure almost anything for his poor hungry stomach. Since you urge me to stay and wait for Telemachus, tell me about Ulysses' parents. What of his mother, and the father he left at the beginning of old age when he went to Troy? Are they still living, or have they both gone down to Hades?
        - id: ch03-b06
          speaker: eumaeus
          text: |
            I can tell you everything. Laertes is alive, but he prays for a peaceful death in his own house. His missing son causes him terrible pain. Losing his wife has hurt him deeply too, and aged him more than anything else. She died unhappily from sorrow for her son. May none of the friends or neighbors who have been kind to me ever end like that.

            While she lived, sad as she always was, I liked to see her and ask how she was. She brought me up beside her youngest daughter, Ctimene. We were a little boy and girl together, and she treated us almost alike. When we were grown, the family sent Ctimene to Same to marry and received splendid marriage gifts for her. My mistress gave me a fine shirt and cloak and sandals, and sent me out to the country. But she remained as fond of me as before.

            All of that is over. Still, heaven has made my work prosper in the position I hold now. I have enough food and wine for myself, and can spare something for any decent stranger who visits. But there is no getting a kind word or a kindness from my mistress now. The house has fallen into wicked hands. Servants sometimes want to see the woman they serve and have a conversation with her. They like to eat and drink at the house, and take something back to the country. That is what keeps servants happy.
        - id: ch03-b07
          speaker: odysseus
          text: |
            Then you must have been very small, Eumaeus, when you were taken so far from your parents and your home. Tell me the truth. Was your parents' town attacked and plundered? Or did enemies carry you away while you were out alone with sheep or cattle, bring you here by ship and sell you for whatever your master offered?
        - id: ch03-b08
          speaker: eumaeus
          text: |
            Stranger, make yourself comfortable, stay seated and drink your wine. I will answer your question. The nights are longest now. There is time enough for sleep, and for sitting together talking. No need to go to bed before bedtime. Too much sleep is as bad as too little. If any of the others wants to sleep, let him go. After breakfast tomorrow he can take our master's pigs out. You and I can sit here with food and wine, telling each other what we have suffered. When a man has endured much and been driven about the world, there is pleasure in remembering sorrows that are long past. Here is how it happened to me.
    - id: ch04
      title: Eumaeus remembers his childhood
      blocks:
        - id: ch04-b01
          speaker: eumaeus
          text: |
            Perhaps you know of an island called Syra. It lies beyond Ortygia, where the land turns and faces another way. Not many people live there, but the earth is fertile. There is plenty of pasture for cattle and sheep, and plenty of wheat and wine. Hunger never reaches that island. Illness does not trouble the people either. When they grow old, Apollo and Diana come and kill them with painless arrows. The island has two communities, with all its land divided between them. My father ruled both. He was Ctesius, son of Ormenus, a man worthy to be compared with the gods.

            Some clever traders from Phoenicia came there in a ship loaded with all kinds of ornaments and trinkets. Phoenicians are skilled sailors. A woman from their country served in my father's house. She was tall, beautiful and very capable at her work. One day she was washing near their ship, and those scoundrels got hold of her. One seduced her, and they coaxed her with the sort of talk no woman can resist, however good her nature. The man who had seduced her asked who she was and where she came from. She told him her father's name.
        - id: ch04-b02
          speaker: phoenician_nurse
          text: |
            I am from Sidon, the daughter of Arybas. My father has enormous wealth. I was coming into town from the country when Taphian pirates seized me. They brought me across the sea to this place and sold me to the owner of this house. He paid the price they wanted.
        - id: ch04-b03
          speaker: phoenician_trader
          text: |
            Would you like to sail with us and see your parents' home again? You could see your mother and father themselves. They are both living, and people say they are still prosperous.
        - id: ch04-b04
          speaker: phoenician_nurse
          text: |
            Gladly, if all of you first swear a solemn oath that you will not harm me during the voyage.
        - id: ch04-b05
          speaker: eumaeus
          text: |
            They all swore as she required. Once their oath was complete, she gave them her instructions.
        - id: ch04-b06
          speaker: phoenician_nurse
          text: |
            Keep this quiet. If any of you meets me in the street or at the well, do not speak to me. Someone might report it to my master and make him suspicious. He would imprison me and have every one of you killed. Say nothing, buy your goods quickly, and send word when the ship is loaded. I will bring as much gold as I can get hold of. I have another way to pay for my passage too. I am nurse to the good master's son, a funny little boy just old enough to run about. I will bring him aboard. Take him abroad and sell him, and you will get a great deal of money.
        - id: ch04-b07
          speaker: eumaeus
          text: |
            The woman went back to the house. Those Phoenicians remained on the island for a full year, until they had filled their ship with a large cargo of precious merchandise. When they had bought enough and finished the loading, they sent someone to let her know. Their messenger was a very cunning man. He came to my father's house carrying a necklace made of gold, with beads of amber strung among the golden pieces. My mother and the women servants took it into their hands and admired its workmanship. They were still discussing what price they would pay for it when the messenger quietly gave the nurse a sign. Then he left them and went back down to the ship. The woman took me by the hand and led me out of our house.

            As we passed through the front of the house, she noticed the tables where guests had been feasting with my father. These were the men attending him, and their cups were still standing there. The guests themselves had all left for a meeting of the people. She quickly picked up three cups and pushed them inside the breast of her dress. I went after her because I was too little to understand any better. By now the sun was down and darkness lay over the whole country. We hurried along as fast as our feet would take us, until we came to the harbor where the Phoenician vessel waited. They took us aboard and sailed out across the sea. Jove sent a wind to help them on their way. We sailed for six days, through every night as well as every day. Then, on the seventh, Diana struck the woman down. She dropped heavily into the hold, like a sea-gull alighting on the water. The sailors cast her into the sea for the seals and the fishes. I was left without her, alone and full of sorrow.

            The winds and waves brought us to Ithaca. Laertes gave some of his own possessions to buy me. That was how I first came to see this country.
        - id: ch04-b08
          speaker: odysseus
          text: |
            Eumaeus, I have listened with deep interest and pity to all you endured. But Jove has given you some good along with the bad. In spite of everything, you have a good master who makes sure you have enough to eat and drink, and your life is comfortable. I am still begging my way from one city to another.
    - id: ch05
      title: The hawk at the landing place
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |
            Their conversation had left them very little time to sleep. Before long it would be daybreak. Meanwhile the ship carrying Telemachus and his companions was drawing close to land. The men loosened and lowered the sails, brought the mast down and took to the oars to bring the vessel into the harbor. They threw out the mooring stones and secured the ship with her cables. Then they climbed out onto the seashore, mixed their wine and prepared a meal. Once every man had eaten and drunk enough, Telemachus spoke to the crew.
        - id: ch05-b02
          speaker: telemachus
          text: |
            Take the ship on to the town, but leave me here. I want to see the herdsmen at one of my farms. Once I have looked into everything, I will come to town this evening. Tomorrow morning I will give you all a good meal of meat and wine to thank you for your work.
        - id: ch05-b03
          speaker: theoclymenus
          text: |
            My young friend, what should I do? Which of your leading men should I stay with? Or shall I go straight to your own house and your mother?
        - id: ch05-b04
          speaker: telemachus
          text: |
            If you had come at any other time, I would have told you to go straight to my own home. You would have found all the hospitality you could ask for. But just now you would not be at ease in that house. I will be absent, and you will not get to see my mother. She hardly ever shows herself even to the men who want to marry her. Instead she stays out of their way in an upstairs room, sitting at her loom and weaving. There is another man I can name whose house you could visit. I mean Eurymachus, Polybus's son. Everyone in Ithaca holds him in the highest respect. Of all the men seeking my mother's hand and hoping to step into Ulysses' place, he is by far the best, and the one who keeps pressing his suit most persistently. Yet only Jove, up in heaven, can know what will happen. Those men may come to a bad end before the marriage can ever take place.
        - id: ch05-b05
          speaker: narrator
          text: |
            As he spoke, another bird flew on his right. This time it was a hawk, Apollo's messenger, holding a dove in its claws. It tore out feathers that drifted to the ground between Telemachus and the ship. Theoclymenus drew the young man aside and caught his hand.
        - id: ch05-b06
          speaker: theoclymenus
          text: |
            Telemachus, some god sent that bird to your right. It did not fly there by chance. I recognized the omen the moment I saw it. Your house will remain powerful. No family in Ithaca will have a greater claim to kingship than yours.
        - id: ch05-b07
          speaker: telemachus
          text: |
            May that prediction come true. If it does, I will look after you generously. My gifts will give everyone you meet a reason to congratulate you.
        - id: ch05-b08
          speaker: narrator
          text: |
            Then Telemachus turned to his friend Piraeus.
        - id: ch05-b09
          speaker: telemachus
          text: |
            Piraeus, son of Clytius, of all the men who went with me to Pylos, you have been the readiest to help throughout. Take this stranger to your house, please, and welcome him well until I come for him.
        - id: ch05-b10
          speaker: piraeus
          text: |
            Leave his welcome to me, Telemachus. I will take care of him and provide all the hospitality he needs. Stay away for as long as you choose.
        - id: ch05-b11
          speaker: narrator
          text: |
            Piraeus went aboard and told the others to follow and cast off. They took their places in the ship. Telemachus fastened his sandals and took a long, strong spear from the deck, its bronze head sharpened to a point. The sailors released the ropes, pushed off from land and made for town as ordered. Telemachus set out on foot as quickly as he could. He came to the farm where his countless pigs were feeding, the home of the good swineherd who was so faithful to his master.
