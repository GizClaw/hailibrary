schema_version: 1
id: the-odyssey-15
style: epic-fantasy-illumination
research: required
labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
premise: >-
  荷马史诗第十五卷的阅读整理。忒勒马科斯从斯巴达动身，接纳逃亡的预言者并平安回到伊萨卡；
  仍隐去身份的奥德修斯则在猪棚听见欧迈奥斯被拐离故乡的真实经历。
  两条归路在牧猪人的住所前即将相接。
characters:
  - {id: telemachus, description: "急于回家的年轻人，在危险中学习安排自己的行程并接待求助者"}
  - {id: athena, description: "指点返乡路线、帮助船只顺风航行的女神"}
  - {id: pisistratus, description: "涅斯托尔之子，务实地帮助朋友告别和启程"}
  - {id: menelaus, description: "接待远客的斯巴达国王，尊重年轻人归去的决定"}
  - {id: helen, description: "送出绣袍，并把院边的鸟兆解作奥德修斯将归的主人"}
  - {id: theoclymenus, description: "因杀死亲族而逃亡的预言者，得到忒勒马科斯庇护"}
  - {id: odysseus, description: "披着乞丐外貌听取家事的归乡者"}
  - {id: eumaeus, description: "失去出生家庭、在伊萨卡长大的牧猪人"}
  - {id: piraeus, description: "答应接待预言者的可靠船伴"}
titles:
  en-US: "The Road Back to Ithaca"
  zh-CN: "两条归路"
