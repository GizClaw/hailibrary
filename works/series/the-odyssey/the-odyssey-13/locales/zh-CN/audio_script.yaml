audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，措辞有分寸", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "自信清楚", timbre: "明亮沉静", pace: "从容", pitch: "中音"}
  chapters:
    - id: ch01
      title: 睡着回到家乡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            历险说完了，奥德修斯盼着赶快天黑，他就能坐船回家。

            阿尔基诺奥斯保证送他平安到家，还让每位贵族多送一只鼎、一口锅。至于这笔钱，国王说可以向百姓征，不用赠礼的人全掏。他亲自上船，把铜器摆稳，免得路上来回滚，碰伤划桨的人。最后还要吃一顿饭，听一场歌，奥德修斯却老看天，等太阳下山。
            到了晚上，他谢过大家，祝他们一家人幸福，也盼自己妻子还平安。众人给神奠酒，他将杯子交给阿瑞忒，祝福王后一家，才告辞。王后派人送他到船边，把衣裳、食物、箱子都带上。船尾有现成的被褥，他一躺下，桨才划动，就睡熟了。
            船驶得很快，快天亮时，进了伊萨卡的避风港。船员认得地方，把客人连毯子抬到沙滩上，人都没醒。礼物放在橄榄树下，路人不容易看见。他们便调头，开回自己的家乡。
    - id: ch02
      title: 归船变成石头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            这趟航行，却惹怒了波塞冬。宙斯已经同意让奥德修斯归乡，海神原也没想过永远拦住他，只想多给他些苦吃。怎么自己的后裔费埃克斯人，倒让仇人睡着到了家，还白拿一大笔财宝？波塞冬去找宙斯诉说，人都这样藐视他了，诸神还会敬重他吗？
            他打算毁掉那条归船，再用山埋了费埃克斯人的城。宙斯建议，先当着岸上百姓的面，让船在近岸变成石头，之后再埋城。船驶回斯刻里亚，大家眼看就要迎到它，忽然，它不动了，成了一块船形的巨石，牢牢扎进海底。
            国王想到父亲从前的预言。海神因为他们替外乡人护航，已经罚了归船，下一步还可能把城埋掉。他连忙让大家停止护送外乡人，备好十二头公牛献祭，恳求波塞冬别毁掉城市。
            人们还在围着祭坛祈求，伊萨卡那头，奥德修斯终于醒来。他不知道恩人正受灾，只看见岸上雾蒙蒙的。
    - id: ch03
      title: 牧人是谁
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            路不对，树不对，连山崖也不像故乡。奥德修斯四下看，越来越不安。费埃克斯人难道骗了他，丢在别的地方？他一面怨恨，一面求宙斯罚他们，又去数礼物。黄金、铜器、衣裳，一件都在。
            可他拿不了这么多，丢下又怕人偷，沿海岸走着，也不知去哪儿。这时，一个衣裳齐整、提着标枪的年轻牧人走来。他便上前求助，请对方替自己照看东西，再问这是什么地方。
        - id: ch03-b02
          speaker: athena
          text: 是伊萨卡啊。这岛很有名，你没听过吗？
        - id: ch03-b03
          speaker: narrator
          text: 奥德修斯心里高兴，却仍不肯吐露实情。
        - id: ch03-b04
          speaker: odysseus
          text: 我在克里特的时候，听人说过。
        - id: ch03-b05
          speaker: narrator
          text: |-
            接着，他又编出了故事。说自己杀过克里特国王伊多墨纽斯的儿子，那王子叫俄耳西洛科斯，跑得飞快。他从特洛伊带回战利品，王子却要夺走，说他在军中不肯听伊多墨纽斯指挥，偏要自己带队。他便带上一个人，夜间埋伏，用矛杀了王子，谁也没瞧见。
            逃走时，他花钱雇腓尼基的船，原说去皮洛斯或者厄利斯，却被风送来这里。他睡着以后，船员将财物卸下，自己往西顿去了。他把逃亡和财宝都解释了一遍，却一直没说自己究竟是谁。
            年轻牧人笑了，伸手抚着他，转眼就变成一个女子。

            是雅典娜。
        - id: ch03-b06
          speaker: athena
          text: 都回家了，怎么还在编故事？
        - id: ch03-b07
          speaker: odysseus
          text: 您老是变模样，我哪认得出来。在特洛伊，您确实帮过我，可后来那些年，我受了多少苦，哪里找得到您？现在您说我到了家，这里看着可不像伊萨卡。
        - id: ch03-b08
          speaker: narrator
          text: 女神解释，这雾就是她放的，免得有人认出他，他们也有时间筹划。她一直知道他能安全到家，只是同伴会全死。以前没来，是不愿和波塞冬闹翻。奥德修斯弄瞎了海神儿子的眼睛，海神那股恨还没消。
        - id: ch03-b09
          speaker: athena
          text: 看，这是福耳库斯港，那边是橄榄树。你以前给水中仙女献祭的洞，就在那儿。
        - id: ch03-b10
          speaker: narrator
          text: 雾一散，涅里同山上的树林也出来了。奥德修斯认出了故乡，低头亲吻土地，向仙女举手许愿。只要雅典娜保住自己的性命，儿子能长大，他一定再来献礼。
    - id: ch04
      title: 先做个乞丐
      blocks:
        - id: ch04-b01
          speaker: athena
          text: 来，把礼物藏起来再说。
        - id: ch04-b02
          speaker: narrator
          text: 他们一起搬进洞，找个隐蔽地方放好，用石头堵住洞口，才坐到橄榄树下。求婚人霸占奥德修斯家已经三年了，逼他妻子再嫁，喝着他的酒，吃着他的粮。佩涅洛佩给每个人留点盼头，心里却另有主意，仍日夜为丈夫伤心。奥德修斯听了，便想起阿伽门农。自己若不知情就回家，也许会落得一样的死法。
        - id: ch04-b03
          speaker: odysseus
          text: 请您像当年在特洛伊一样，再帮帮我。该怎样报仇？只要您在，对方有三百个人，我也敢动手。
        - id: ch04-b04
          speaker: athena
          text: 我会帮你的。那些拿你家的粮酒白吃白喝的人，会死得满地都是血和脑浆。现在先藏住身份，受了欺负也要忍耐。去找牧猪人欧迈奥斯，他对你的妻儿一直忠心。住下来，问问情形，再等我们动手。
        - id: ch04-b05
          speaker: odysseus
          text: 儿子在哪里？
        - id: ch04-b06
          speaker: athena
          text: 斯巴达，在墨涅拉奥斯家，打听你的下落。
        - id: ch04-b07
          speaker: odysseus
          text: 您明知道我活着，还要他出远门？
        - id: ch04-b08
          speaker: athena
          text: 这趟远行会让他有个好名声，他在那里也过得很好。
        - id: ch04-b09
          speaker: narrator
          text: |-
            她也没瞒着返程的危险。求婚人派了船，打算在海上杀忒勒马科斯。不过她觉得他们不会成功，倒是吃奥德修斯家产的人，要先死几个。
            奥德修斯照办，打算先摸清家里的事，等机会复仇。女神用杖碰他，皮肤立刻起了皱，头发少了，眼睛也不再明亮。好衣裳换成烟熏过的破布，身上还披着粗皮，手里拿着拐杖和破袋。别人一看，只会当他是老乞丐。

            他们各自出发。奥德修斯去猪棚，雅典娜则到斯巴达，去接忒勒马科斯。
