audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 用朴素的语言从容讲述史诗
        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，措辞有分寸
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    alcinous:
      display_name: 阿尔基诺奥斯
      tts:
        delivery: 慷慨果断
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
    poseidon:
      display_name: 波塞冬
      tts:
        delivery: 笃定威严
        timbre: 低沉饱满
        pace: 平稳
        pitch: 低音
    zeus:
      display_name: 宙斯
      tts:
        delivery: 笃定而不容置疑
        timbre: 深沉饱满
        pace: 从容
        pitch: 低音
    athena:
      display_name: 雅典娜
      tts:
        delivery: 自信清楚
        timbre: 明亮沉静
        pace: 从容
        pitch: 中音
    phaeacian_1:
      display_name: 一名费埃克斯人
      tts:
        delivery: 直率发问
        timbre: 结实清晰
        pace: 自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 归程终于开始
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            故事讲完，回廊里的客人都沉默着，听得入了迷。过一会儿，阿尔基诺奥斯才出声。
        - id: ch01-b02
          speaker: alcinous
          text: |
            奥德修斯，你已经来到我的屋檐下。从前不管受了多少罪，我相信接下来就能顺顺利利，平安回家。至于各位，天天晚上来这里喝我最好的酒，听我的歌者演唱，我有个要求，这件事一定得办。各位赠送的衣裳、打造精美的黄金物件，还有其他贵重礼品，我们的客人已经收拾好。现在请每个人再添一口大鼎、一只锅。如此丰厚的赠礼，指望个人拿出全部费用，也实在太重。以后由民众出一笔公款，我们再用来补还这次的花费。
        - id: ch01-b03
          speaker: narrator
          text: |
            众人答应，便回各自家中睡觉。清晨的孩子、玫瑰色手指的黎明来了，大家赶紧带锅下到船边。国王亲自上去查看，要收稳在坐凳下面，不能晃出来伤桨手。随后又回王家吃饭，宰一头牛祭给掌管一切的宙斯。肉排烤好，这顿饭吃得好极了。人人喜欢的得摩多科斯，受神启发的歌者，接着唱歌。

            奥德修斯却不断看太阳，仿佛想把它看落下去，心里急着出发。一个人驾两头牛，犁了一整天休耕地，腿累得快走不动，满脑子是晚饭，终于天黑可以回家，多么高兴。日落时，他就是那样欢喜。他向大家开口，尤其对着国王。
        - id: ch01-b04
          speaker: odysseus
          text: |
            国王，各位，再见了。奠过酒，便送我高高兴兴上路吧。有人护送，又得了这些礼物，我想要的已全有了。愿神让我把礼物用好，回去见到贤良的妻子，正和亲友平安过活。也愿各位让自家妻儿高兴，天上所有福分都赐给你们，族人不遇任何灾祸。
        - id: ch01-b05
          speaker: narrator
          text: |
            听众全觉得他说得好，也有道理，该派船护送了。国王就叫自己的仆人。
        - id: ch01-b06
          speaker: alcinous
          text: |
            蓬托诺奥斯，把酒调好，送到每个人手里。我们向父亲宙斯祷告，然后让客人出发。
        - id: ch01-b07
          speaker: narrator
          text: |
            酒调好，依次分来。众人坐着向天上诸神奠酒，奥德修斯却起身，把双耳杯交给王后阿瑞忒。
        - id: ch01-b08
          speaker: odysseus
          text: |
            王后，告辞了。往后的日子，愿您一直安好，直到谁都逃不过的衰老和死亡来临。我要走了，愿您和儿女、族人，还有阿尔基诺奥斯王，在这里过得幸福。
        - id: ch01-b09
          speaker: narrator
          text: |
            说完，他便迈出门槛。阿尔基诺奥斯派一人同行，一直带到海岸，再领到船边。阿瑞忒也叫几位侍女相送。一个捧着干净的内衣和披风，一个拿着结实的箱子，第三个带来谷物与酒。到了水边，船员从她们手里接过东西，把食物、酒水和行李全装进船。又专为奥德修斯在船尾甲板铺上毯子，展好亚麻床单，让他有地方安安稳稳睡一觉。他也登了船，没说一个字，就在那儿躺下。每个船员坐回自己的位置，再解下缆绳，绳子原来绑在岸边穿孔的石头上。等他们划着桨，船开始往海里走，奥德修斯便陷入甜甜的深睡，沉静得近乎死亡。

            船猛地向前，像四匹马拉的战车在赛道挨了鞭，疾奔出去。船头扬起，像雄马昂着脖子，后面卷着一大波深蓝海水。沿途稳稳前进，最快的隼也追不上。这条破水的船，载着心机能比天神的人，他却宁静地睡着，把战场和无边海路的劳苦，全忘记了。
    - id: ch02
      title: 岸边的石船
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            那颗报知黎明将到的明亮星辰，才在天上出现，船已经靠近陆地。伊萨卡有座港，属于老海神福耳库斯。两个海角探进海里，把港湾围在里头，外面狂风恶浪再大，也冲不进来。因此只要到了港内，连绳缆都不必系，船就能安稳停着。最深处长一株高大的橄榄树，离树不远，有一座美丽的洞，顶拱起来，是那伊阿得斯仙女的圣地。里面放调酒的碗，石头做的酒罐，蜜蜂也在那里安家。还有很大的石织机，仙女们用它织海紫色的衣袍，真是稀奇的景象。洞里什么时候都有水。入口分两个，朝北的供凡人走下去。朝南那个更神秘，凡人无论如何进不去，是神行走的通道。

            船员认得此地，直接开了进去，速度太快，半条船冲上沙滩。先把睡熟的客人，连毯子床单一起抬下，放在沙上。又搬出所有礼物，那些都是女神劝族人送给归乡客人的。东西堆在橄榄树根，避开路，免得行人趁他未醒偷走。做完，众人尽快返回。

            波塞冬没忘记从前威胁奥德修斯的话，找宙斯商议。
        - id: ch02-b02
          speaker: poseidon
          text: |
            父亲宙斯，凡人也这样对我，还是我的亲族费埃克斯人！那么轻慢，诸神以后还会尊敬我吗？我只说要让他受够罪才归家，没说永不许回。我知道你已点头答应。可他们让他睡着，一船送到伊萨卡，给这么多铜器、金子、衣服。就算他从特洛伊拿足战利品，平安回航，也带不回比这更好的东西！
        - id: ch02-b03
          speaker: zeus
          text: |
            震地的神，你怎么这样讲？神谁不敬你？你年长，又这么受尊崇，谁敢侮辱，才叫不像话。至于凡人，有谁傲慢不敬，你自己愿意怎样处置就怎样，本来就是你的权力。
        - id: ch02-b04
          speaker: poseidon
          text: |
            不怕让你不高兴的话，我早做了。现在我要毁掉护送完客人、回航的费埃克斯船，看他们以后还送不送人。还要搬座大山，埋掉整座城。
        - id: ch02-b05
          speaker: zeus
          text: |
            好朋友，等城里人正看船过来，把它变成石头吧。石头就在近岸，模样仍是船，人人会吃惊。之后再拿山埋城。
        - id: ch02-b06
          speaker: narrator
          text: |
            环绕大地的波塞冬听罢，去了斯刻里亚，留在那里等。船正飞快驶来，近岸时，他上前把船化作石头，掌心一压，深深扎在地底，再离去。族人见了议论，有人问身旁邻居。
        - id: ch02-b07
          speaker: phaeacian_1
          text: |
            刚才整条船还清清楚楚，眼看进港了，怎么就钉在海里？到底是谁干的？
        - id: ch02-b08
          speaker: narrator
          text: |
            他们说着，谁也不明白。阿尔基诺奥斯开口了。
        - id: ch02-b09
          speaker: alcinous
          text: |
            父亲说过的预言，我想起来了。我们送人过海，每个都平安，波塞冬会生气。有一天，护送完回来的一艘船要被毁，还要有大山把城压住。父亲从前的话，现在真来了。大家听我安排，第一，以后不再送上门的客人渡海。第二，挑十二头最好的公牛献给波塞冬，求他同情我们，别让大山压城。
        - id: ch02-b10
          speaker: narrator
          text: |
            大家害怕，照着去挑牛。首领与统治者围住神坛，向波塞冬王求告。同一时候，奥德修斯已经在故乡醒了。离开太久，他认不得。雅典娜又使这里全是雾，不让人知道他回来，要先亲自把情形讲清。他惩罚求婚人之前，不论妻子、乡人、朋友，都不能认出。

            他起身望去，长而直的路，港口，陡崖，漂亮的树，样样像变了。两手拍着大腿，绝望地叫起来。
        - id: ch02-b11
          speaker: odysseus
          text: |
            唉，这是什么人的地方！会是凶残野人，还是肯招待客人的好人？宝贝搁哪，我自己又往哪去？还不如留在费埃克斯那里，或另找个大首领，也许人家肯好好待我，送我回去。现在没地方藏东西，也不能放着让别人拿。他们的首领太不公道，说送伊萨卡，却弄到别国来了。愿宙斯替求助的人作主，罚他们！谁做坏事，他都看见，也都会惩罚。可先得点点东西，看船员带走什么没有。
    - id: ch03
      title: 牧人与女神
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            精美的铜器和锅，金子，还有全部衣物，他一件件点清，什么也没丢。可是，没回到家乡的念头仍让他伤心。海浪响着，他沿岸来来回回走，悲叹自己的不幸。这时雅典娜靠近，化作年轻牧人，长相秀雅，透着王子一样的气度。肩上披风质地很好，折了双层，脚也秀美，穿一双凉鞋，手里还握着标枪。奥德修斯一见，心里高兴，马上迎过去。
        - id: ch03-b02
          speaker: odysseus
          text: |
            朋友，到这里头一个遇见的就是你，我先向你问好，也求你好心。护住财物，再护住我吧。我抱着你的膝，像对神那样祈求。告诉我实话，这是哪国、哪片土地？住的什么人？是岛，还是大陆的海岸？
        - id: ch03-b03
          speaker: athena
          text: |
            外乡人，连这地方也不认得，不是太单纯，就是从极远处来。这里名气大，东边西边都知道。确实不平，不适合跑车，但也是很好的岛。有雨有露，谷物和葡萄酒都多，又能养牛羊，各样树木都长，水源从来不枯。先生，伊萨卡这名字，特洛伊都听过。听说特洛伊离我们阿开亚很远呢。
        - id: ch03-b04
          speaker: narrator
          text: |
            奥德修斯听说这正是家乡，心里欢喜。可一开口，又不是实话。他天生多心机，编出了一个故事。
        - id: ch03-b05
          speaker: odysseus
          text: |
            在海外克里特，我就听说伊萨卡。看样子，如今带着财宝到了。我给孩子留下的，还跟这里一样多。不过我在逃命，因为杀了奥尔西洛科斯，伊多墨纽斯的儿子，克里特跑得最快的就是他。他要抢我从特洛伊弄来的战利品。那些可是在战场、在累人的海上，吃够苦受够险才拿到的。他非说，我出征时没忠心效劳父亲，没按属臣规矩办事，自己做起了首领。于是我带一个随从，守在路边。等他从乡村往城里来，一矛杀了。

            天很黑，没人见，我们干的事也没人知道。我直接去找船，是腓尼基人的，给够报酬，请他们带我到皮洛斯，或埃佩奥斯人统治的厄利斯。他们没使坏，风却推偏了路，到夜里走来此地。好容易才进港，大家饿得慌，也没提晚饭，上了岸，照原样躺下。我一累，就睡了。他们拿出我的财物，放在身边的沙上，自己开船去了西顿。我被留着，心里实在不好过。
        - id: ch03-b06
          speaker: narrator
          text: |
            雅典娜笑了，手抚着他，转眼变成一位漂亮庄重、神情睿智的女人。
        - id: ch03-b07
          speaker: athena
          text: |
            要胜过你的诡计，哪怕对手是神，也得是最会说谎的滑头。你真大胆，心眼那么多，骗起人来从不嫌累。到了自己家乡，还不肯把那些天生的假话花招放下！算了，不说这个。咱们两个，必要时都会骗人。人间论谋划、论说话，你最强，神中论交涉、论机变，我也没对手。

            还没认出我？宙斯的女儿雅典娜呀。一路困难我都守护着你，也是我让费埃克斯人那么喜欢你。如今再来帮忙，与你商议，藏好我叫他们送的财宝。你家里的祸事，我都要告诉你，得面对它们。但谁也不能知道你回家了，男的女的都不行。再难也忍，谁来侮辱都受着，不出声。
        - id: ch03-b08
          speaker: odysseus
          text: |
            女神，再有见识的人，碰到你变来变去的模样，也认不准啊。不过特洛伊打仗时，你对阿开亚人很好，我清楚。可是攻破普里阿摩斯的城，上船，天神把人吹散，从那时便不见你，也想不起你曾到船上帮我。我病着，愁着，到处漂，等神肯解救，才到费埃克斯城。那回你鼓励我，领我进去，我记得。现在我以你父亲的名义求，究竟是不是伊萨卡？我还不信，怕在别国，你只用这些话欺我、逗我。真回家了吗？
        - id: ch03-b09
          speaker: athena
          text: |
            你总往这些地方想，这就是我不能丢下你的原因。善于说话，又精明，又多心计。别人海上这么多年，一回来早跑去见妻儿。你却不急着打听，倒先想试试妻子。她在家徒劳地哭，白天晚上都不得安宁。

            我没露面，是从不怕你出事，知道会回来，虽然同伴都要失去。我也不想惹叔父波塞冬生气，毕竟你瞎了他儿子的眼，他始终不原谅。看看这些地方，就该信了。这是老福耳库斯的港，尽头这棵橄榄树，再过去是那伊阿得斯的圣洞。就是那拱顶山洞，你多次在那里献百牲祭，仙女们都喜欢。那座长满树的山，正是涅里同。
        - id: ch03-b10
          speaker: narrator
          text: |
            她一边讲，一边散开雾。国土露出来了，他欢喜地亲吻肥沃的大地，举起手向仙女们求告。
        - id: ch03-b11
          speaker: odysseus
          text: |
            宙斯的女儿，那伊阿得斯仙女，我以为永远也见不到各位了。现在怀着所有爱意向你们问候。只要宙斯那强大的女儿留住我的命，让儿子长成人，我还像从前那样，送来祭品。
    - id: ch04
      title: 藏起宝物，改换容貌
      blocks:
        - id: ch04-b01
          speaker: athena
          text: |
            放心，这些不必忧愁。先赶紧把东西搬进山洞，那里稳妥。一起看看怎样安置最好。
        - id: ch04-b02
          speaker: narrator
          text: |
            女神下洞找最保险的藏处，奥德修斯搬来黄金、铜器和好衣裳，都是族人给的。仔细摆好，又用石头堵口。两人坐到大橄榄树根边，要商量怎么除去邪恶求婚人。
        - id: ch04-b03
          speaker: athena
          text: |
            尊贵的奥德修斯，拉厄尔忒斯的儿子，想个办法抓住这群无耻人。他们在家里霸了三年，追求你妻子，送她婚礼。她却只是想你，伤心。每人都让她给了希望，收过鼓励的话，可心意跟说的全相反。
        - id: ch04-b04
          speaker: odysseus
          text: |
            你告诉得及时，不然我的下场，就像阿伽门农，死在自己家。女神，教我怎样报仇吧。陪着我，把勇气给我，像摘掉特洛伊额头那美丽冠冕时一样。像当年那样帮我，有你在，我敢打三百人。
        - id: ch04-b05
          speaker: athena
          text: |
            这事你可以完全信任我。咱们一旦动手，你便一直在我眼前，我不会不管。我想，那些眼下还在吃你家产的，总会有人把鲜血和脑浆洒在石地上。现在先替你伪装，叫任何凡人都辨认不出。浑身肌肤都起皱纹，满头黄发一根也不留。给你穿一件叫人看了就厌恶的衣服，把你那双好看的眼睛也变得昏暗。到那时候，求婚人、你妻子，还有你当初留在家的儿子，见到的全是个难看的陌生人。

            然后去找牧猪人，他一直忠心，又爱护佩涅洛佩和儿子。乌鸦岩旁，阿瑞图萨泉那里能找着，猪在那里吃山毛榉果、喝泉水，长得很肥。先跟他住，问清事情。我去斯巴达看儿子。他为了探听你是否活着，去了拉刻代蒙的墨涅拉奥斯那里。
        - id: ch04-b06
          speaker: odysseus
          text: |
            那你全知道，为什么不直接说？还要他海上流浪受苦，让人白吃财产吗？
        - id: ch04-b07
          speaker: athena
          text: |
            先别为他发愁。这趟远行是我让他去的，要使大家因他肯走这一遭，称赞他的作为。现在他一点困境也没有，正在墨涅拉奥斯家舒适地住着，身边吃的用的，各样东西都丰足。求婚人倒真开了船，埋伏海上，想拦在归途把他杀掉，不让他抵家。我却不认为他们能成功。反而是如今还吞吃你财产的人，恐怕会有几个先给自己找到坟地。
        - id: ch04-b08
          speaker: narrator
          text: |
            女神说着，拿魔杖碰到他身上。皱纹布满全身，原先金黄的头发一根不剩，浑身皮肉都干枯了。那双原本十分漂亮的眼睛，也被她变得昏花。她替他换了衣物，一块旧破布裹在外面，短衣又破又脏，烟熏得乌黑。最外层再搭一张没有鞣过的鹿皮。她又给他拐杖，一个到处破洞的袋子，配一根拧紧的皮绳，让袋子能从肩头挂下去。

            商量妥当，两人各走各的。女神直去拉刻代蒙接忒勒马科斯。
