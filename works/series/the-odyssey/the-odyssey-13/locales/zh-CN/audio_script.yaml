audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，措辞有分寸", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "自信清楚", timbre: "明亮沉静", pace: "从容", pitch: "中音"}
  chapters:
    - id: ch01
      title: "醒来的岸"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            奥德修斯醒过来，先摸到下面的沙，再摸到身上盖的毯子。

            那条船不在了。雾气里先露出一截树根，铜器和装衣服的箱子都堆在旁边。奥德修斯站起来，朝海面望去，一张帆也没有，桨划水的声音也没有。他想看清周围，可那条路究竟通向哪里，树后又是哪座山？沿岸走出几步，仍旧满眼陌生。他认不出这里。

            可昨夜离开王宫时，他还以为，那些等待总算到头了。阿尔基诺奥斯听完历险，答应把他平安送回家，还叫每位贵族添送一只鼎和一口锅。国王说，这笔钱可以向百姓征，不用全让赠礼的人承担。他自己上船看过，把沉重的铜器放稳，免得在海上滚起来，撞到划桨的人。奥德修斯吃着最后一顿饭，等歌唱完，却只盼太阳快些下山。

            终于日落。他向主人们感谢礼物，也感谢安排归船，祝他们与妻儿好好相处，也希望自己家里的妻子平安。大家给神倒下祭酒，他起身把杯子交到阿瑞忒王后手里，祝她一家幸福。王后派人送衣裳、吃食和行李去海边，陪他走过去。船尾被褥铺好了，他一躺下，船员就解缆，桨声才响，他已睡沉。

            船很快过了海。黎明前，水手来到伊萨卡的避风港，他们认识这个地方。客人连同毯子被抬到沙上，礼物藏在橄榄树根附近，路人不容易看见。随后船就返回费埃克斯人的国土。

            波塞冬却恼怒这次平安护送。宙斯允许奥德修斯归家，他不能永远拦住，但自己的后裔竟送仇人安睡到家，带着这么多财物。他向宙斯申诉，凡人不把他的威严当回事，诸神还怎样尊重他？

            波塞冬要毁船，还要用山埋城。宙斯让他在百姓面前把归船变成石头，之后再埋城。船快到时，费埃克斯人正看着，它却停在海里，成了扎进海底的石头。国王想起父亲的预言，要大家停止护送，备十二头公牛献给海神，求他别再埋城。奥德修斯根本不知道。

            他在雾里认不出故乡，怪费埃克斯人骗他，还求宙斯罚他们。他打开箱子，数过金子、衣服、铜器，一件也没少。东西留下了，他却仍不信这就是伊萨卡。一个口袋能背，这么多箱子却怎么走？留下又怕被偷。他看一眼山路，再回头看行李，没有离开，别人的礼物反倒把他留在这片陌生岸上。
    - id: ch02
      title: "雾里的牧人"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            这时一个年轻牧人走来，衣服整齐，手握标枪。奥德修斯上前，请对方帮忙看管财物，又打听自己到了哪里。
        - id: ch02-b02
          speaker: athena
          text: >-
            这是伊萨卡呀。名声这么大的岛，你没听说？
        - id: ch02-b03
          speaker: narrator
          text: >-
            他听得喉咙发紧，差点说出自己的身份，可又忍住了。谁知道这人会把消息传到哪里。
        - id: ch02-b04
          speaker: odysseus
          text: >-
            克里特那边也说起过。我是从那里来的。
        - id: ch02-b05
          speaker: narrator
          text: >-
            他开始编身世，声称自己杀了克里特王伊多墨纽斯的儿子俄耳西洛科斯。那王子善跑，要抢他从特洛伊带回来的战利品，理由是他在军中不服父王的号令，非要自己领队。他便带一个伙伴，夜里藏在路旁，拿矛杀了王子，没有人看到。他又付钱请腓尼基船员送去皮洛斯或厄利斯，风却把船吹到了这里。他睡着时，船员把财物摆在他旁边，继续去西顿。这番话既解释了钱财，也解释了逃亡，自己的真名却藏着。牧人笑了，年轻面孔变作女子，正是雅典娜。
        - id: ch02-b06
          speaker: athena
          text: >-
            你已回到故乡，怎么还不肯说实话？
        - id: ch02-b07
          speaker: odysseus
          text: >-
            你总能换模样，换一次我就信一次吗？特洛伊那时候，我知道你帮我。可后来很多年，找也找不到。现在你说到了家，眼前又不像我的家。
        - id: ch02-b08
          speaker: narrator
          text: >-
            雅典娜说明，雾让岛上人发现不了他。她早知他能活着回来，同伴却会一个不剩。她之前避开，是怕与波塞冬争吵，他还恨着儿子被弄瞎的事。
        - id: ch02-b09
          speaker: athena
          text: >-
            往这边看一看。
        - id: ch02-b10
          speaker: narrator
          text: |-
            雾退开一层，女神指给他看福耳库斯港，指给他看那棵古老的橄榄树。供奉水中仙女的洞窟也露出来了，远处还有涅里同山的一片树林。这些地方终于一一认得，他真的回到了家乡。

            奥德修斯亲了亲泥土，举手向仙女们问好。他说，只要雅典娜保他活着，也让儿子长大成人，他就会像从前那样献礼。
        - id: ch02-b11
          speaker: athena
          text: >-
            现在先把这些行李藏起来。
    - id: ch03
      title: "先去猪棚"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            箱子和铜器一起搬进了洞，他们挑隐蔽的地方放妥，女神再用石块封住洞口。坐到树根旁，奥德修斯望向城里，等她告诉自己家里的事。求婚人已盘踞三年，粮和酒任他们吃用，还逼佩涅洛佩改嫁。妻子不断拖着，话里留些希望，却始终没有应允，思念与眼泪仍伴着她。门后等着的不是团聚。若鲁莽闯进去，他可能同阿伽门农一样，熬过战场，反在自己家里丢命。
        - id: ch03-b02
          speaker: odysseus
          text: >-
            告诉我怎样报仇吧。你像在特洛伊那样帮我，三百个人我也敢打。
        - id: ch03-b03
          speaker: athena
          text: >-
            我会帮你。他们中有人要把血和脑浆溅上地面。我先给你变个模样，去见欧迈奥斯吧，牧猪人对你妻儿忠心。别报名字，先探问，受了侮辱也忍住，等到动手杀求婚人的时候。
        - id: ch03-b04
          speaker: odysseus
          text: >-
            儿子在什么地方？
        - id: ch03-b05
          speaker: athena
          text: >-
            斯巴达，跟墨涅拉奥斯在一起。他去找你的消息。
        - id: ch03-b06
          speaker: narrator
          text: >-
            奥德修斯转头看她。
        - id: ch03-b07
          speaker: odysseus
          text: >-
            既然知道我没死，为什么还让他出海？
        - id: ch03-b08
          speaker: athena
          text: >-
            我让他远行，是要为他赢得好名声。墨涅拉奥斯待他很好。
        - id: ch03-b09
          speaker: narrator
          text: |-
            女神也没有瞒着危险。求婚人已经派出一条船，在儿子回家的路上埋伏，要杀掉他。可雅典娜料想他们不会得手。那些正在吃奥德修斯家产的人，倒可能有几个先丢命。

            奥德修斯接受了这个复仇安排。他得先换掉面貌，弄清家里怎样了，忍着别动，等到能够杀死求婚人的时候再出手。雅典娜拿杖一碰，他的头发变稀，皮肤皱起来，眼睛也没了光。好衣裳换成熏着烟灰的破布，外头还有粗皮，手里拿着拐杖和破口袋。谁看见，都会认作上门讨饭的老人。

            商量好下一步，两人便分开。他先到猪棚去了解家里的消息，雅典娜赶往斯巴达，去接他的儿子。
