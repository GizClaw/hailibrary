  chapters:
    - id: ch01
      title: The last feast in Scheria
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Ulysses had finished. Everyone in the covered walk remained silent, held by the charm of his story. At last Alcinous spoke.
        - id: ch01-b02
          speaker: alcinous
          text: |
            Ulysses, now that you have found your way to my house, I have no doubt that you will reach home without another disaster. Whatever hardships lay behind you, that is what I expect for you now. But for the rest of you, who come to this house night after night to drink the finest wine I have and listen to my singer, there is something I must insist on. Our guest has already put away the clothes, the carefully worked gold and the other valuable gifts you brought him. We must now add something more. Every one of us should give him a large tripod and a cauldron. Afterwards we can repay ourselves by collecting a contribution from the whole people. It is too much to ask private men to pay on their own for a present as generous as this.
        - id: ch01-b03
          speaker: narrator
          text: |
            They all agreed and went home to sleep in their own houses. When rosy-fingered Dawn, the child of morning, appeared, they hurried to the ship with their cauldrons. Alcinous went aboard to make sure everything was firmly stowed beneath the benches. Nothing must slide loose and hurt the rowers. Then they returned to his house for a meal. He sacrificed a bull to Jove, the ruler of all. They grilled the steaks and enjoyed an excellent dinner. Afterwards Demodocus, the inspired singer everyone loved, sang for them.

            But Ulysses kept looking towards the sun, as though his gaze could hurry it down. He longed to leave. Think of a man who has spent the day ploughing a fallow field behind two oxen. His legs can barely carry him, and he can think only of supper. How glad he is when night comes and he can go home to eat. Ulysses was just as glad when the sun set. At once he addressed the Phaeacians, speaking especially to Alcinous.
        - id: ch01-b04
          speaker: odysseus
          text: |
            My lord, and all of you, farewell. Pour your offerings and send me happily on my way. You have given me everything I hoped for, an escort home and all these gifts. May heaven let me make good use of them. May I find my good wife living peacefully among friends. And may you who stay behind bring happiness to your wives and children. May the gods give you every blessing, and keep all evil from your people.
        - id: ch01-b05
          speaker: narrator
          text: |
            Everyone approved his words. His request was reasonable, and they agreed the escort should take him home. Alcinous turned to his servant.
        - id: ch01-b06
          speaker: alcinous
          text: |
            Pontonous, mix some wine and give it to everyone. Let us pray to Father Jove and send our guest on his journey.
        - id: ch01-b07
          speaker: narrator
          text: |
            Pontonous prepared the wine and passed it to each person in turn. From their seats, they all poured offerings to the blessed gods of heaven. Ulysses stood up. He put the double cup into Queen Arete's hands.
        - id: ch01-b08
          speaker: odysseus
          text: |
            Farewell, queen. May all be well with you, now and always, until old age and death come, as they must come to everyone. I take my leave. May you live happily here with your children and people, and with King Alcinous.
        - id: ch01-b09
          speaker: narrator
          text: |
            As he said his farewell, Ulysses crossed the threshold. Alcinous sent one of his men to guide him all the way down to the shore and show him to the ship. Arete sent several of her maids to accompany him as well. The first brought a clean shirt and cloak. The second carried his strongbox, and the third came with grain and wine. When they reached the water, the crew received these things and put them safely aboard, along with all the other food and drink. For Ulysses himself they laid out a rug and a linen sheet on the deck, making a place at the stern where he could sleep soundly. He went aboard after them and lay on it without saying a word. The sailors each settled into their own place. They loosened the great cable from the hole in the stone to which it had been tied. As soon as they began rowing the vessel out to sea, sleep settled over Ulysses. It was deep and sweet, a stillness that was almost like death.

            The ship leaped forward like a four-horse chariot racing when the horses feel the whip. Her bow rose and curved like a stallion's neck. A great wave of dark blue water boiled behind her. She kept steadily to her course, so fast that even a falcon, the swiftest bird, could not have caught her. She cut through the sea carrying a man whose cunning matched the gods. Now he slept in peace, forgetting all the suffering he had known on battlefields and on the weary waves.
    - id: ch02
      title: The ship turned to stone
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            The bright star that announces dawn had begun to show when the ship approached land. In Ithaca there is a harbor belonging to Phorcys, the old sea-god. Two headlands reach into the sea and enclose it. They shelter it from the wind and waves raging outside. Once inside, a ship can rest without even being tied up. At the head of the harbor stands a large olive tree. Nearby is a beautiful cave with an arched roof, sacred to the nymphs called Naiads. Within are mixing bowls and stone wine jars, and bees make their home there. There are great stone looms too. On them the nymphs weave garments of sea-purple, a wonderful sight to see. Water is always present in the cave. It has two entrances. The northern one lets mortals come down into it. The southern entrance is more mysterious. No mortal can enter that way. It is the path used by the gods.

            The men knew this place well, so they steered their ship into the harbor. There was still so much speed in her that she ran half her own length up onto the shore. Once they had stepped ashore, their first task was to lift Ulysses from the ship. They carried him together with the rug and the linen sheet and set him down on the sand, still fast asleep. Next they brought out the presents given for his journey home, all those gifts Minerva had encouraged the Phaeacians to offer him. They gathered everything at the foot of the olive tree and kept it away from the road. They feared that someone passing along might take the treasure before the sleeping man awoke. With that done, they set off on their return and made for home as fast as possible.

            But Neptune had not forgotten the threats he had made against Ulysses. He went to discuss the matter with Jove.
        - id: ch02-b02
          speaker: poseidon
          text: |
            Father Jove, how can I keep any honor among the gods if even the Phaeacians show me so little respect? They are mortals, and my own kin. I said Ulysses could go home once he had suffered enough. I never said he must stay away for ever. I knew you had already nodded your agreement and promised he would return. Yet they have brought him to Ithaca fast asleep in their ship. They have given him bronze and gold and clothes more splendid than he could have brought from Troy, even if he had taken his share of the plunder and sailed home without trouble.
        - id: ch02-b03
          speaker: zeus
          text: |
            Lord of the Earthquake, what are you saying? The gods do respect you. It would be outrageous to insult a god as old and honored as you. As for mortals, if anyone behaves insolently and refuses you respect, you have always had the right to punish him as you think best. Do whatever you wish.
        - id: ch02-b04
          speaker: poseidon
          text: |
            I would have acted at once, but I did not want to displease you. Now I mean to destroy that Phaeacian ship as she returns from carrying him home. That will stop them providing escorts in future. I also want to bury their city under a huge mountain.
        - id: ch02-b05
          speaker: zeus
          text: |
            My friend, I suggest you wait until the people in the city are watching the ship approach. Then turn her into a rock near the shore, still shaped like a ship. They will all be astonished. Afterwards you can bury the city under the mountain.
        - id: ch02-b06
          speaker: narrator
          text: |
            Hearing that, Neptune, who encircles the earth, went to Scheria, the Phaeacians' home. He waited until the swiftly moving ship was close to land. Then he stepped up, made her stone, and pressed down with his palm until she was rooted in the seabed. Having done it, he went away. The Phaeacians began asking one another what had happened. One man would turn to his neighbor.
        - id: ch02-b07
          speaker: phaeacian_1
          text: |
            What in the world has fixed our ship in the sea? She was just entering the harbor. A moment ago we could see all of her clearly.
        - id: ch02-b08
          speaker: narrator
          text: |
            They talked like that, with no idea of the cause. Alcinous spoke to them.
        - id: ch02-b09
          speaker: alcinous
          text: |
            I remember my father's old prophecy now. He said Neptune would be angry with us for taking everyone safely over the sea. One day he would destroy a ship returning from an escort and bury our city beneath a high mountain. My father used to say it, and now it is coming true. Listen, all of you. We must stop offering passage to people who come here. Then we must sacrifice twelve of our finest bulls to Neptune. Perhaps he will pity us and spare the city from the mountain.
        - id: ch02-b10
          speaker: narrator
          text: |
            Fear took hold of the people, and they prepared the bulls. The Phaeacian leaders gathered round Neptune's altar and prayed to him as their king.
    - id: ch03
      title: A stranger in his own country
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            At that very moment, Ulysses was waking on the earth of his own country. So many years had passed since he left that he could not recognize the place. Besides, Minerva, the daughter of Jove, had covered it with fog. She wanted his return to remain unknown, so that she could tell him everything in secret. His wife, his friends and the other people of Ithaca must not recognize him until he had taken revenge on the wicked suitors. He started up and looked about him, but every part of his homeland seemed different. The long and straight tracks had changed. So had the harbors, the steep cliffs and all the fine trees. In despair he struck his thighs with the flat of both hands and cried aloud.
        - id: ch03-b02
          speaker: odysseus
          text: |
            What sort of people have I come among? Are they cruel savages, or kind people who welcome strangers? Where am I to put these treasures? Which way should I go? I wish I had stayed with the Phaeacians. Or I could have sought another great chief who would have treated me well and sent me home. Now there is nowhere to store my goods. I dare not leave them here for someone else to take. Those Phaeacian rulers have not dealt honestly with me. They promised Ithaca and left me in the wrong country. May Jove, who protects those seeking help, punish them. He watches everyone and calls wrongdoers to account. Still, I had better count my things. Perhaps the crew have carried some away.
        - id: ch03-b03
          speaker: narrator
          text: |
            He counted his fine copper vessels and cauldrons, the gold and every piece of clothing. Nothing was missing. Yet he went on grieving because he thought himself far from home. He walked up and down beside the sounding sea, lamenting his fate. Then Minerva approached in the shape of a young shepherd, graceful and looking like a prince. A fine cloak lay doubled over her shoulders. She wore sandals on her lovely feet and carried a javelin. Ulysses was pleased to see someone and went directly to her.
        - id: ch03-b04
          speaker: odysseus
          text: |
            Friend, you are the first person I have met here. I greet you and ask for your kindness. Keep my belongings safe, and protect me as well. I clasp your knees and pray to you as if you were a god. Tell me truly, what country is this, and who lives here? Is this an island, or have I reached the coast of a mainland?
        - id: ch03-b05
          speaker: athena
          text: |
            Stranger, you must be very innocent, or have traveled a great distance, if you do not know this place. It is famous, known everywhere to east and west. The ground is rough, no good for driving chariots. But for what it is, it is a fine island. It produces plenty of grain and wine, fed by rain and dew. Cattle and goats thrive here too. There is timber of every kind, and places to draw water that never run dry. The name of Ithaca is known even in Troy, sir. I hear that is a long way from our Achaean country.
        - id: ch03-b06
          speaker: narrator
          text: |
            Minerva's words made Ulysses glad. He was in his own country after all. But when he answered, he did not tell the truth. The cunning that came so naturally to him supplied a made-up story.
        - id: ch03-b07
          speaker: odysseus
          text: |
            I heard of Ithaca while I was in Crete across the sea. Now it seems I have come here with all these treasures. I left as much again for my children. I am running away because I killed Orsilochus, Idomeneus's son, the fastest runner in Crete. He tried to take the plunder I had brought from Troy. I earned it through danger and hard work, in battle and on the weary sea. He said I had failed to serve his father loyally as a vassal at Troy, and had acted as a ruler on my own. So one of my followers and I waited beside the road. As Orsilochus came in from the country to the town, I killed him with my spear.

            It was such a dark night that nobody could see us. That was why no one knew who had killed him. As soon as it was done, I went to a ship and begged its owners, who were Phoenicians, to let me sail with them. I asked them to take me either to Pylos or to Elis, the country ruled by the Epeans. I gave them as much of my plunder as they wanted in payment. They had no plan to deceive me. It was the wind that carried them away from their intended course. We went on sailing until we arrived here after dark. We only just managed to get inside the harbor. All of us wanted supper badly, but not one of us said a word about eating. Instead we landed and lay down on the shore exactly as we were. I was terribly tired, and sleep came as soon as I lay down. While I slept, the sailors carried my property out of the ship and set it next to me on the sand. After that they sailed on to Sidonia, and here I was left, with all this worry on my mind.
    - id: ch04
      title: Minerva reveals herself
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            Minerva smiled at his story and stroked him with her hand. She changed into a woman, beautiful, dignified and wise.
        - id: ch04-b02
          speaker: athena
          text: |
            Anyone who beat you at lying and trickery would have to be very slippery indeed, even if that opponent were a god. You reckless man, always plotting, never weary of deception. Can you not set aside those tricks and lies, even now you are back in your own country? But enough of that. We both know how to deceive when we need to. Among men, no one is a better adviser or speaker than you. Among the gods, no one can match my skill in negotiation and cunning.

            Did you fail to recognize me, Minerva, Jove's daughter? I have been beside you, watching over you through your troubles. I made the Phaeacians so fond of you. Now I have come to plan with you and hide the gifts I persuaded them to give. I must tell you what awaits you at home. There are troubles you have to face. Tell no one, man or woman, that you have returned. Endure everything. However anyone insults you, bear it without a word.
        - id: ch04-b03
          speaker: odysseus
          text: |
            Goddess, a man can have learned a great deal and still find it hard to recognize you. Your appearance changes so often that when he meets you, how can he tell whether it is really you? Yet one thing I know very well. Throughout the time we Achaeans fought before Troy, you were kind to me. But then we destroyed Priam's city, boarded our ships, and heaven scattered us across the sea. From that day, Minerva, I saw nothing of you. I cannot remember a single occasion when you came to my ship and helped me through a difficulty. I had to wander on, ill and unhappy, until the gods released me from those troubles and I reached the city of the Phaeacians. There you gave me courage and led me into the town. Now I beg you in your father's name to speak the truth. I still do not believe I have returned to Ithaca. I fear I am in some other country, and that everything you say is meant to mock and mislead me. Please tell me plainly. Is this truly my own home?
        - id: ch04-b04
          speaker: athena
          text: |
            That is how your mind always works. It is why I cannot abandon you in trouble. You are so convincing, so sharp and so full of devices. Another man after such a long voyage would run home to his wife and children. You hardly seem interested in asking about them or hearing their news until you have tested your wife. She is at home grieving for you, with no rest from her tears by day or night.

            As for staying away, I was never worried. I knew you would return safely, though all your companions would be lost. I did not want a quarrel with my uncle Neptune, who has never forgiven the blinding of his son. Now let me show you the landmarks, and perhaps you will believe me. This is the harbor of old Phorcys. Here is the olive tree at its head. Nearby is the cave sacred to the Naiads, the arched cave where you offered the nymphs so many welcome sacrifices of a hundred beasts. And there is forest-covered Mount Neritum.
        - id: ch04-b05
          speaker: narrator
          text: |
            As she spoke, Minerva cleared the mist, and the country became visible. Ulysses rejoiced to find himself home. He kissed the generous earth and raised his hands to the nymphs in prayer.
        - id: ch04-b06
          speaker: odysseus
          text: |
            Naiads, daughters of Jove, I thought I would never see you again. Now I greet you with all my love. I will bring offerings as I used to, if Jove's mighty daughter keeps me alive and brings my son to manhood.
        - id: ch04-b07
          speaker: athena
          text: |
            Take courage. You need not worry about that. Let us put your possessions in the cave at once, where they will be safe. We can work out the best way to arrange everything.
        - id: ch04-b08
          speaker: narrator
          text: |
            She went down into the cave to find the safest places to hide the treasure. Ulysses brought the gold, bronze and fine clothes the Phaeacians had given him. They stored it all carefully, and Minerva placed a stone across the cave entrance. Then they sat beside the great olive tree to plan the wicked suitors' destruction.
    - id: ch05
      title: The beggar's disguise
      blocks:
        - id: ch05-b01
          speaker: athena
          text: |
            Ulysses, noble son of Laertes, think how to get your hands on these shameless men. For three years they have ruled your house, courting your wife and offering marriage gifts. She does nothing but mourn you. She gives each one hope and sends encouraging messages, while meaning the very opposite in her heart.
        - id: ch05-b02
          speaker: odysseus
          text: |
            Goddess, without this timely warning, I might have met Agamemnon's fate under my own roof. Tell me how best to take revenge. Stand beside me and put your courage into me, as when we loosened Troy's beautiful crown from her brow. Help me as you did then. With you beside me, I will fight three hundred men.
        - id: ch05-b03
          speaker: athena
          text: |
            You may be certain of my help. Once we begin this work together, I will not let you pass out of my sight. I believe some of the men who are now consuming your wealth will end by splashing that floor with their blood and brains. But first I must give you a disguise that no human being can see through. I will draw wrinkles over your whole body, and every bit of that yellow hair will disappear. I will dress you in clothing that makes everyone who sees it turn away in disgust. Those beautiful eyes of yours will look dim and clouded. The suitors will find you ugly to look at. So will your wife, and even the son you left at home will see only this unpleasant figure.

            Then go straight to the swineherd who tends your pigs. He has always been loyal to you and devoted to Penelope and your son. Look for him near Raven rock, by the spring of Arethusa. The pigs are growing fat there on beech nuts and spring water, as pigs do. Stay with him and learn what is happening. I will go to Sparta for your son. He is with Menelaus in Lacedaemon, where he went to discover whether you are alive.
        - id: ch05-b04
          speaker: odysseus
          text: |
            But you knew everything. Why didn't you tell him? Did you want him to wander the seas in misery too, while other men ate up his estate?
        - id: ch05-b05
          speaker: athena
          text: |
            Do not worry about him. I sent him so that people would praise him for making the journey. He is not suffering. He is comfortable with Menelaus, with an abundance of everything. The suitors have sailed out to wait for him and kill him before he reaches home. I doubt they will succeed. I think some of those living off your wealth will find their own graves first.
        - id: ch05-b06
          speaker: narrator
          text: |
            While she spoke, Minerva reached out with her wand and touched him. His skin became covered in wrinkles. She took away all his yellow hair and made the flesh of his entire body look withered. His eyes were naturally beautiful, but she clouded and dimmed them. Then she replaced his clothing. Round him she threw an old rag of a wrap, and she dressed him in a tunic that was torn, filthy and dark with smoke. An untanned deerskin served as his outer garment. Finally she provided him with a walking staff and a bag so worn that it was full of holes. A twisted leather thong went with the bag, allowing him to hang it from his shoulder.

            Once the two of them had settled all their plans in this way, they separated. Minerva went directly to Lacedaemon to fetch Telemachus and bring him back.
