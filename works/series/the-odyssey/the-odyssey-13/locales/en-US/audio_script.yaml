audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "unhurried", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered and resonant", pace: "measured with varied breaths", pitch: "medium-low"}
    alcinous:
      display_name: Alcinous
      tts: {delivery: "generous and decisive", timbre: "full and warm", pace: "measured", pitch: "medium-low"}
    athena:
      display_name: Athena
      tts: {delivery: "assured and clear", timbre: "bright and composed", pace: "measured", pitch: "medium"}
  chapters:
    - id: ch01
      title: "One last evening"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Odysseus had told his whole story. Now he wanted the sun to go down.

            He watched the light moving across Alcinous's hall. The meal went on. So did the singing, and people kept bringing gifts for his journey. He thanked them, but his eyes went back to the door. The ship was outside. Perhaps this time it really would take him to his own house.
        - id: ch01-b02
          speaker: alcinous
          text: >-
            I'll see you safely home. Each lord must add a tripod and a cauldron to your gifts. We can recover the cost through a levy on the people.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Before evening, the king went aboard to check the loading. The bronze vessels were tied securely under the benches where the men would row. The clothes and gold were packed so they couldn't move about and strike anyone. Odysseus had come here with nothing. Now there was more to carry than one man could lift.

            At sunset, Odysseus thanked everyone for the gifts and passage home. He wished happiness to their families and safety to his wife. They poured an offering to the gods. He put his cup in Arete's hands and wished the queen happiness with her family. She sent his chest, fresh clothes and food down to the shore.

            The crew had laid out a bed at the stern. He lay down without speaking. Almost as soon as they began to row, he was asleep. For now, the war and all his hardships left him in peace.

            Water rushed past without waking him. He missed the last star before morning and the sight of land opening around the ship. The sailors knew this quiet harbor on Ithaca. They lifted him out, still in his bedding, and left him sleeping on the sand. His gifts went under an olive tree away from the path, where a passerby wouldn't easily find them. Then the sailors set out for home.

            Poseidon had seen that safe journey. Zeus had already permitted Odysseus to return. The sea god couldn't keep him wandering forever, but he had wanted the return to be hard. Instead his own descendants, the Phaeacians, had carried the man home asleep and rich with presents. Poseidon complained to Zeus. If people could treat his anger as nothing, what authority would he have left?

            Poseidon wanted to wreck their ship on its way back and cover their city with a mountain. Zeus gave him a way to do it. Turn the ship to stone near the shore, he advised, with the people watching. Afterwards, bury the city. Everyone would see the warning against giving strangers passage home.

            On Scheria, people were watching their ship come in. It moved swiftly toward land, then stopped. The familiar hull and prow had become a rock fixed in the water. Alcinous remembered what his father had once foretold. A ship returning from an escort would be struck, because they took strangers home so freely. The warning was coming true.
        - id: ch01-b04
          speaker: alcinous
          text: >-
            We must stop taking passengers. Choose twelve fine bulls to sacrifice to Poseidon. Pray that he spares the city.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His frightened people gathered at the altar. Odysseus knew nothing of what his hosts were suffering. Far away, on the sand, he woke up.
    - id: ch02
      title: "The name of the island"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            There was mist everywhere. He sat up, searching for something he recognized. The trees looked wrong. A road showed through the white air, then vanished again. All those years at sea, and he seemed no closer to home.

            He accused the Phaeacians of breaking their promise and leaving him in the wrong country. He called on Zeus to punish the hosts who'd deceived him. Then he counted their gifts under the olive, the bronze, the clothes and the gold. Nothing had been taken. Yet he still couldn't believe they'd brought him home.

            As he walked along the water, a young shepherd appeared. The youth was neatly dressed and carried a light spear. Odysseus approached without letting the treasure out of his sight.
        - id: ch02-b02
          speaker: odysseus
          text: >-
            Can you help a stranger? Tell me the name of this place.
        - id: ch02-b03
          speaker: athena
          text: >-
            This is Ithaca. Surely you've heard of it?
        - id: ch02-b04
          speaker: narrator
          text: >-
            That name had stayed with him in dreams, through storms, and after the fighting stopped. He nearly told the shepherd so. Then caution caught him. He didn't know where this stranger would repeat his words.
        - id: ch02-b05
          speaker: odysseus
          text: >-
            They spoke of Ithaca where I came from, in Crete.
        - id: ch02-b06
          speaker: narrator
          text: >-
            He gave the shepherd a false history. He'd killed Orsilochus, King Idomeneus's fast-running son, he said. The prince wanted his loot from Troy. He said Odysseus had refused his father's command and fought as his own captain. Odysseus claimed he'd hidden beside the road with another man and speared the prince at night. Nobody had seen it. Then he'd paid Phoenician sailors to take him to Pylos or Elis. Wind had brought them here instead. They'd unloaded his goods beside him while he slept and gone on to Sidonia. That was his account of his treasure and escape, without his real identity. The shepherd smiled. The youth changed into a woman, and Odysseus knew Athena.
        - id: ch02-b07
          speaker: athena
          text: >-
            Must you invent another identity even now? You're back on your own island.
        - id: ch02-b08
          speaker: odysseus
          text: >-
            And how many identities have you worn? How am I to know which face to believe?
        - id: ch02-b09
          speaker: narrator
          text: >-
            She praised their shared gift for deception, his among men, hers among gods. He remembered her help at Troy, but also the years afterwards when he'd needed her and couldn't find her. Yes, she'd guided him among the Phaeacians. But he still didn't know this shore.
        - id: ch02-b10
          speaker: odysseus
          text: >-
            Give me something I can recognize. I need more than your word.
        - id: ch02-b11
          speaker: narrator
          text: |-
            Athena told him she'd made the mist to hide his arrival while they planned. She'd always known he would get back, though he'd lose every companion. But she hadn't wanted to fight with Poseidon, who still bore a grudge for his son's eye.

            She pointed out the harbor of Phorcys, the olive, and the cave belonging to the water nymphs. He used to bring offerings there. The mist began to clear, and the wooded shape of Neritum showed beyond the shore. There was the cave. There was the tree. It was the place he knew after all.

            Odysseus kissed the ground and raised his hands to greet the nymphs. He'd bring them offerings again, he promised, if Athena kept him alive and let his son grow to manhood.
        - id: ch02-b12
          speaker: athena
          text: >-
            Now we must put your gifts somewhere safe.
    - id: ch03
      title: "The path away from the palace"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Athena found a place in the cave. Odysseus carried the treasure in, and they hid it. She closed the entrance with a stone. Then they sat under the olive and talked about his house. The suitors had spent three years eating his stores as though they owned them. Penelope sent hopeful messages she didn't mean, putting them off while she grieved. He couldn't simply walk in and expect a welcome. Agamemnon had survived Troy and been murdered at home.
        - id: ch03-b02
          speaker: odysseus
          text: >-
            Help me plan my revenge. Stay beside me as you did at Troy, and I'll fight three hundred men.
        - id: ch03-b03
          speaker: athena
          text: >-
            I'll be with you. Some of those men will leave their blood and brains on your floor. First I'll disguise you. Go to Eumaeus, your swineherd. He's loyal to Penelope and your son. Listen to what's happening, bear every insult and keep your name hidden while we prepare to kill the suitors.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            Where is my son now?
        - id: ch03-b05
          speaker: athena
          text: >-
            With Menelaus in Sparta. He left home to look for news of you.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Odysseus turned toward her sharply.
        - id: ch03-b07
          speaker: odysseus
          text: >-
            You already knew I was alive. Why let him risk that voyage?
        - id: ch03-b08
          speaker: athena
          text: >-
            I sent him so people would speak well of him. Menelaus is looking after him well.
        - id: ch03-b09
          speaker: narrator
          text: |-
            She told him about the danger too. Some suitors had taken a ship out to wait for Telemachus. They planned to kill him before he reached home. She expected them to fail. Some of the men eating his stores would die first.

            Odysseus accepted their plan for revenge. Hidden behind another face, he would find out what was happening and wait for his chance to strike.

            Athena touched him with her wand. His skin wrinkled, his hair grew thin, and his eyes lost their brightness. She gave him smoke-stained rags and a rough hide instead of fine clothes, and handed him a staff and a torn bag. He looked like an old beggar. Even his wife and son wouldn't recognize him.

            Athena set off for Sparta. Odysseus left the palace road and walked toward the pig pens.
