labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
premise: >-
  荷马史诗《奥德赛》第十三卷的阅读整理。奥德修斯终于被送回伊萨卡，
  却把被神雾遮住的故乡当成陌生海岸；他试探陌生牧人，认出雅典娜后确认归处，
  得知家中危机，选择隐藏姓名、以老乞丐的样子先去寻找忠实的牧猪人。
characters:
  - {id: odysseus, description: "终于归乡的伊萨卡国王，渴望团聚，却必须决定如何安全进入自己的家"}
  - {id: athena, description: "帮助奥德修斯的女神，以雾与变形保护他的归来，并要求他保持耐心"}
  - {id: alcinous, description: "兑现护送承诺的费埃克斯国王，随后面对海神的惩罚与百姓的恐惧"}
  - {id: arete, description: "为离去的客人准备衣物和行囊的费埃克斯王后"}
  - {id: poseidon, description: "因自己的权威遭到轻视而愤怒的海神，阻断费埃克斯人的护送船"}
  - {id: zeus, description: "已允奥德修斯返乡，又允许波塞冬向费埃克斯人显威的神"}
titles:
  en-US: "Home Behind the Mist"
  zh-CN: "故乡藏在雾里"
