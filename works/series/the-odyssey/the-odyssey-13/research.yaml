  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "The Odyssey, Samuel Butler prose translation, Book XIII; Gutenberg transcription of the edition with Henry Festing Jones's 1921 preface"
    claims:
      - "The consulted version is Butler's translation first published in 1900; the second-edition preface dated 4 December 1921 identifies its corrections and reprint history."
      - "Book XIII supplies the departure from Scheria, sleeping arrival with gifts on Ithaca, Poseidon's petrification of the returning ship, and the Phaeacians' response."
      - "Athena conceals Ithaca in mist, hears Odysseus's false identity, reveals the familiar landscape, helps hide the treasure, explains the suitors and Telemachus's danger, and disguises him before sending him to Eumaeus."
