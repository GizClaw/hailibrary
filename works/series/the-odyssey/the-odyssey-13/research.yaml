    authority: "The Metropolitan Museum of Art, Department of Greek and Roman Art"
    claims:
      - "The museum independently locates the epic in ancient Greek tradition, describes its oral performance history, and identifies Athena's assistance and Odysseus's beggar disguise."
notes:
  - "Task-scoped user exception to classic's verbatim-import default: classic and Homer / 荷马 remain the public type and author, while both locales are newly written HaiLibrary reading prose. The complete Book XIII at git 1208d108 and the live Gutenberg edition supply plot evidence. No locale source_url or Butler translator credit claims that this new prose reproduces his translation."
  - "Retained beats: farewell and laden ship; sleep through the crossing; landing beside the olive and nymphs' cave; ship turned to stone and threatened mountain; distrust on the misty shore; invented Cretan identity; recognition of Athena and Ithaca; concealed treasure; danger at home; disguise and the separate missions to Eumaeus and Telemachus."
  - "Retained specifics: the tripod and cauldron levy, Zeus's recommendation to petrify the ship and then bury the city, twelve bulls offered to avert the threatened burial, and Odysseus's false claim to have ambushed Orsilochus, Idomeneus's son, over plunder and disputed military authority. The Phoenician departure places and intact goods remain part of that lie. Athena's promised bloody revenge, the boast about fighting three hundred, and her stated reason for Telemachus's voyage, a good name, are explicit."
  - "Condensed: longer gift catalogues and farewell formulas, the cave's stone vessels, weaving and two entrances, the false traveler's claim to a second fortune left for children, repeated comparisons of cunning and repeated sacrificial assurances. Odysseus's actual voyage and his invented Cretan history remain distinct."
  - "The city's burial remains a threat for which the Phaeacians seek mercy; this episode does not assert that it occurred. Odysseus does not witness the ship's fate."
  - "Ship enchantment, divine mist, petrification and bodily disguise are declared mythic rules, not claims about navigation, geology or human physiology. No precise modern identification of the legendary harbour is asserted."
  - "Both locales were written independently from the retained events; scene emphasis, paragraph structure and dialogue are new. No modern adaptation, film, textbook or published Chinese translation was used as a prose model."
