labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
premise: >-
  荷马史诗第十四卷的阅读整理。隐去身份的奥德修斯在猪棚得到欧迈奥斯照料，
  却无法用归乡消息打动这个屡次失望的人；夜里，他以一段寒夜旧事试探是否能借到披风，
  看见对方在怀疑之外仍保有判断与情义。
characters:
  - {id: odysseus, description: "隐去身份的归乡者，在保护秘密的同时观察家中人的忠诚与判断"}
  - {id: eumaeus, description: "牧猪人，受到求婚人的盘剥，思念主人，却拒绝为希望付出判断力"}
titles:
  en-US: "The Swineherd's Spare Cloak"
  zh-CN: "炉火边的陌生人"
