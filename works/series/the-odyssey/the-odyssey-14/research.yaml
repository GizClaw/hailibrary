notes:
  - "Task-scoped user exception to classic's verbatim-import default: keep classic and Homer / 荷马 authorship, with newly authored HaiLibrary reading prose. The complete Book XIV at git 1208d108 and the live Gutenberg edition were consulted as plot evidence. Locale metadata does not present this retelling as Butler's translation or a literal Chinese rendering."
  - "Retained spine: dangerous arrival; immediate food and shelter; pigs taken for the palace; grief mixed with distrust of rumors; the invented Cretan traveller; rejected oath and cruel wager; evening hospitality; the cloak story; Eumaeus keeping his watch outside."
  - "Retained within the false biography: enslaved concubine mother, unequal inheritance, rich marriage and nine raids; Idomeneus and the Trojan war; nine ships to Egypt and the followers' killing and abduction; forced labor and the king's protection; seven years in Egypt, the Phoenician's year and slave-sale scheme; shipwreck and Pheidon's son's rescue; Dodona and the treasure for ten generations; a second sale scheme en route to Acastus on Dulichium, rags, bonds, swimming and hiding. The cloak story preserves Menelaus, the claimed co-command, a false divine dream, Agamemnon's reinforcements and Thoas's abandoned cloak."
  - "Retained Eumaeus's morally specific statements and acts: he curses Helen's family, says losing his master pains him more than separation from his parents, recalls the fugitive Aetolian's false news, refuses a lethal wager, and has himself purchased Mesaulius. Odysseus claims to hate poverty-driven lying while telling a cover story, and ends pleased at a servant guarding his property."
  - "Condensed: enclosure and herd inventories, Castor / Hylax's paternal names, exact early voyage and feasting-day counts, descriptions of the various weapons and fittings, repeated oath formulas, slaughter procedure and seven exact meat shares. The long invented life is shortened in expression, not replaced by an anonymous hardship summary."
  - "The guest's Cretan, Egyptian and merchant adventures are explicitly presented as a cover story he constructs, not as his actual biography or a claim about those peoples. Individual traders' misconduct does not describe an ethnic group."
  - "The hut's welcome is Eumaeus's choice and religious conviction in this story, not a universal statement about ancient Greek customs. Slavery and unequal ownership remain part of the setting without being offered as a moral ideal."
  - "The dogs' attack is interrupted by their keeper; the scene supplies no general technique for safely approaching guard dogs. Rain and cold belong to this fictional night, not a weather rule."
  - "The cloth at the end is lent for the night, preserving the stranger's ragged disguise and the continuity of the following episodes."
