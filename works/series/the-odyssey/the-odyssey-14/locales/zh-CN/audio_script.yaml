audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，措辞有分寸", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "热心待客，说话朴直而有主见", timbre: "成熟厚实，带乡野质感", pace: "舒缓", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 牧猪人的饭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            猪棚就在眼前，狗却迎着奥德修斯扑来。他赶紧坐下，把杖松开。欧迈奥斯正在裁牛皮做鞋，见状扔下手里的活，跑出围栏，扔石头呵斥，才赶走狗。
        - id: ch01-b02
          speaker: eumaeus
          text: 老人家，到屋里来吧。先把肚子吃饱，再慢慢说你的来历。
        - id: ch01-b03
          speaker: narrator
          text: 奥德修斯跟着进了屋。外面的猪栏，是他离家后欧迈奥斯造的，猪也本来属于他，他却不点破。牧猪人铺好草垫，把自己睡觉用的厚皮拿给客人坐，再杀两头小猪，烤肉，兑酒。这顿饭很合奥德修斯的意。
        - id: ch01-b04
          speaker: odysseus
          text: 愿诸神都听你的心愿，让你事事如意。
        - id: ch01-b05
          speaker: narrator
          text: 欧迈奥斯说，来的人再穷，他也该照顾。外乡人和乞丐有宙斯庇护，他敬畏神，也可怜这位老人。只是仆人在年轻的主人手下过日子，总有些怕，拿得出的也就这些。他想念从前的主人，奥德修斯若能留在家里活到老，自己干了这么多年，本可以得到一间房、一块田，还能娶个妻子。可主人去了战场。他又咒骂海伦，愿她全家死绝，多少好人都为她丢了命。现在，自己养的好猪还得一头头送到城里，给求婚人吃。
        - id: ch01-b06
          speaker: eumaeus
          text: 好猪全归他们，只剩瘦的给我们吃。来，吃肉吧。
        - id: ch01-b07
          speaker: narrator
          text: 奥德修斯没接话，大口吃喝，心里却已经想着报仇。欧迈奥斯递来酒碗，他才装作不知道，问起来。
        - id: ch01-b08
          speaker: odysseus
          text: 那个买你回来的人叫什么？我去过的地方不少，说不定听过他的下落。
        - id: ch01-b09
          speaker: eumaeus
          text: 叫奥德修斯。不过，别说你也见过他，只为从我这儿得件衣服。
    - id: ch02
      title: 不肯相信的好消息
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            欧迈奥斯已经听过太多了。那些流浪人来报好消息，不过想混到衣服和住处。可佩涅洛佩总接待他们，追问丈夫的事，边听边哭。他说，就算回到父母身边，也再找不着这样好的主人了。他想念父母，可主人的失踪更叫他难过。
            从前来过一个埃托利亚的逃犯，杀了人，跑到这里。他说奥德修斯在克里特，正与伊多墨纽斯一起修理风暴打坏的船，入夏或者到了秋天，就会回来。可季节过去了，人也没来。
        - id: ch02-b02
          speaker: odysseus
          text: 我可不要你先送东西。我也恨那些一穷就拿谎话骗人的人。我向神发誓，旧月一过，新月一来，他便会回家报仇，收拾欺侮他妻儿的人。等应验了，你再给衣裳好了。
        - id: ch02-b03
          speaker: narrator
          text: 欧迈奥斯还是不信。他也盼主人回来，可提起这些只会伤心，不愿听空话。何况眼下还得担心忒勒马科斯，少主人出海找父亲，求婚人却准备半路伏击，杀了他。
        - id: ch02-b04
          speaker: eumaeus
          text: 不谈这些了。你自己呢？怎么走到这里来的？
        - id: ch02-b05
          speaker: narrator
          text: |-
            奥德修斯又编出一段经历。他说自己是克里特人，父亲是贵族，母亲却是个买来的女奴，做了妾。父亲在时，待他同那些婚生儿子一样，父亲一死，兄弟只肯分很少的财产。他靠作战的本领娶到富家女，九回出海劫掠，才攒起家业。他从不喜欢耕地养孩子，只爱带船打仗。
            后来，克里特人请他和伊多墨纽斯带兵，到特洛伊打了九年，第十年攻下城。回去只住了一个月，又带九条船去埃及。同伴却不肯听命，杀男人，抢女人孩子，夺财物。埃及人来打他们，死的死，剩下的都抓去做苦工。他扔了兵器，抱国王的膝求饶。国王因敬畏宙斯，把他留下，还拦住那些想拿矛刺他的人。
            他说，自己在埃及得了不少财物，一住七年，之后信了腓尼基商人的话，随他回家，又住一年。那商人再请他同去利比亚运货，实际上要卖他。他已有疑心，却没法不去。结果宙斯劈碎了船，他抓着桅杆漂过九天，到第十夜才在忒斯普罗提亚上岸。
            他当时又冷又饿，幸亏斐冬国王的儿子救了他，带回家，给他吃住，还给衣服。他又把奥德修斯编进身世里，说国王给他看过奥德修斯的财宝，够一个家族用上十代。奥德修斯则去了多多纳，问宙斯该公开回家，还是悄悄回去。接他的船，已经准备妥当。
            斐冬国王先送这位落难客人去杜利基翁，拜见阿卡斯托斯。谁知船员也想卖人，剥走好衣服，只给破布。船到伊萨卡，还把他绑了。等他们上岸吃饭，诸神替他松了绳子，他沿着船舵滑进海，游到岸边，藏进树林。船员找不着，只得开船离去，他才来到猪棚。
    - id: ch03
      title: 不拿性命打赌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 长长的故事听完了，欧迈奥斯仍不信奥德修斯快回家。
        - id: ch03-b02
          speaker: eumaeus
          text: 你受了这么多罪，真叫人难过。可说到我主人，你就别指望我相信了。
        - id: ch03-b03
          speaker: narrator
          text: 奥德修斯竟提议打赌。主人若回来，就送他衣裳，让他上路，若没回来，把他这骗子从山崖扔下去。欧迈奥斯放下碗。
        - id: ch03-b04
          speaker: eumaeus
          text: 你进了我家，我还去要你的命？不，这赌我不会打。
        - id: ch03-b05
          speaker: narrator
          text: |-
            外面传来赶猪的声音，其他牧人回来了。大家关上猪栏，欧迈奥斯挑了头肥壮的公猪做晚饭，先给诸神分一份，再分给众人，客人分到的还是块好肉。
            端面包的是墨绍利奥斯。他也是被买来的，是主人离家后，欧迈奥斯用自己的钱买的，没问王后，也没问拉厄尔忒斯。奥德修斯感谢款待，欧迈奥斯请他只管吃，说神愿给什么、拿走什么，都由神自己决定。
    - id: ch04
      title: 一件厚披风
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            天黑了，没有月亮，外头又刮风又下雨。奥德修斯穿得单薄，冻得难受，就想试探欧迈奥斯肯不肯拿件衣服。他没直接讨要，又说了一个特洛伊的故事。
            故事里，他同墨涅拉奥斯、奥德修斯领人埋伏在芦苇里。北风卷着雪扑来，他却忘记带披风。到了后半夜，实在受不了，就碰旁边的奥德修斯，低声求他想个办法。故事里的奥德修斯先叫他别说出去，又对士兵们说，自己做了神赐的梦，需要派人回船，请阿伽门农增援。托阿斯一听，起身跑去，把披风留了下来。那个受冻的人便捡来裹住，一直熬到天亮。
            故事说完，客人扯了扯身上的破布。
        - id: ch04-b02
          speaker: odysseus
          text: 唉，年轻的时候，总还有人肯帮帮我。
        - id: ch04-b03
          speaker: narrator
          text: 欧迈奥斯站了起来。
        - id: ch04-b04
          speaker: eumaeus
          text: 今夜你只管睡，不会冻着的。不过这儿多余的衣服少，明早还得穿回你那身。等少主人回来，会给你备一套，也会帮你去想去的地方。
        - id: ch04-b05
          speaker: narrator
          text: |-
            欧迈奥斯把兽皮往火边一铺，给客人盖上备用的厚披风。其他人都在炉边躺下了，他却不肯让猪群无人看守。他穿自己的厚披风，提上矛，到岩石下面，守着猪过夜。

            奥德修斯躺着，盖着借来的披风，看到自己不在时，仆人仍替他这样照管财产，心里很满意。
