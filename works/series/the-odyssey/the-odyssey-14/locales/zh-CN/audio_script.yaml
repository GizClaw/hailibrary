audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 用朴素的语言从容讲述史诗
        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，措辞有分寸
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    eumaeus:
      display_name: 欧迈奥斯
      tts:
        delivery: 热心待客，说话朴直而有主见
        timbre: 成熟厚实，带乡野质感
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 牧猪人的棚屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯从港边离开，顺着崎岖小路上山，穿过成片的树林，翻过山岭，才到雅典娜说的地方。管理猪群的仆人就住这里，他是家中最会照管财物的人。客人看见他坐在棚屋前，旁边是亲手筑的圈院，位置很显眼，在远处也望得到。圈院又大又整齐好看，四周留了地方，供猪自由活动。主人离开以后，他从地里拣来石块，亲手建成，也没有跟佩涅洛佩或拉厄尔忒斯提起。墙上还围荆棘，院外再立一圈结实的木栏，用劈开的橡木桩挨得很近地排着。里面十二间猪圈彼此相邻，母猪在那儿躺卧。每一圈都有五十头打滚的猪，全用来产仔。公猪却睡在院外，求婚人老是吃，他又被迫不断挑最好的送去，数目就比母猪少得多，如今有三百六十头。养猪人还有四条猎犬，凶猛不下于狼，每晚都陪公猪睡。

            眼下，他手里拿着一张上好的厚牛皮，正在裁制一双凉鞋。三个帮手分在不同的地方，放牧各自照管的猪。第四个已经被叫去城里，送一头公猪给求婚人，让他们先祭神，再吃个饱。这又是他不得不交出的牲畜。

            狗见了奥德修斯，大叫着扑去。他懂怎么应付，坐下，把手里的棍子放开。可还是险些在自家地方被撕碎。牧人扔下牛皮，从院门急奔出来，边吼边扔石头，才赶走狗。
        - id: ch01-b02
          speaker: eumaeus
          text: |
            老人家，差点让狗把你咬死！那我可惹祸了。神给的烦恼够多，别再来一桩。我最好的主人失去了，心里一直为他痛。猪养大给旁人吃，主人若还活在世上，却不知在多远的地方挨饿。先进来，面包和酒管够，吃好再讲讲家乡，讲讲你受的苦。
        - id: ch01-b03
          speaker: narrator
          text: |
            他领客人进屋，请坐下。地面铺厚厚的灯心草，再放自己夜里睡的岩羚羊皮，又大又厚，毛蓬蓬的。客人见这么周到，心中欢喜。
        - id: ch01-b04
          speaker: odysseus
          text: |
            朋友，你这样善待我，愿宙斯和各位神报答，让你想什么就成什么。
        - id: ch01-b05
          speaker: narrator
          text: |
            欧迈奥斯啊，牧猪的你这样回答。
        - id: ch01-b06
          speaker: eumaeus
          text: |
            外乡人，就算再穷些的人来，我也不能欺侮。客人也好，乞丐也好，都有宙斯保护。我给得起这些，就请你将就。年轻主子管事，仆人过得提心吊胆，我如今就是。神不让那好主人回来，他若在，肯定一直待我好。会给房屋、给一块地、给个好看妻子，慷慨主人该给勤劳仆人的，都会给。我的工作又得神保佑，照管的事情有成效，主人要在家老去，会大大酬劳。可人没了！真希望海伦全族都灭掉，她害了多少好人。主人就是为她，去了出产骏马的伊利昂，替阿伽门农王打特洛伊。
        - id: ch01-b07
          speaker: narrator
          text: |
            说着，他系腰带，去乳猪圈选两只，带回来宰献，烧掉毛，切开穿叉。肉熟，还热着、还在叉上，就端到客人面前。奥德修斯洒白大麦粉，欧迈奥斯用常春藤木碗调酒，坐对面请他吃。
        - id: ch01-b08
          speaker: eumaeus
          text: |
            吃吧，这种猪肉归仆人，肥猪可都进求婚人的肚子。吃得没羞没臊，什么都不管。神不喜欢这种人，喜欢守法、行得正的人。连最凶的海盗，抢别人土地，蒙宙斯准许装满财物，回家心里还发虚，怕受罚。可这群人，好像有神说过奥德修斯死了，所以不回家按正常办法求婚，只管占着家产乱花，一点也不害怕。每天每夜，上天刚送来新一天，他们就杀牲口，一两头还不够，酒也随便喝。

            主人真有钱，全伊萨卡、全大陆的贵人，都没他多，二十个人凑一起才比得上。大陆上十二群牛，十二群绵羊，十二群猪，还有十二大群山羊，分布很广，自己的牧人和外雇的人一起管。伊萨卡的远端也有大羊群，山羊牧人很能干，但每一个每天都得交去最好的羊。我守这里这些猪，也只能不断选好的送给求婚人。
        - id: ch01-b09
          speaker: narrator
          text: |
            客人默默大吃大喝，心里想着复仇。吃得够了，牧人给自己常用的碗斟满酒，递过去。奥德修斯欢喜地接过。
        - id: ch01-b10
          speaker: odysseus
          text: |
            朋友，花钱买下你的主人，究竟叫什么？这么富，这么有势力，你还说为阿伽门农死了。说出来，说不定我遇到过。诸神和宙斯知道，走这么多地方，没准能有点消息给你。
        - id: ch01-b11
          speaker: eumaeus
          text: |
            老人家，再有旅人报信，他的妻子儿子也不信了。可想混个住处的流浪汉，还总带一嘴谎话来，没一句真。谁到伊萨卡，都找女主人胡说，她还接待，给好东西，问这问那，不停地哭。丢了丈夫的女人总这样。你恐怕也能为了内衣披风，编得天花乱坠。

            主人呢，早给狼和猛禽吃了，或死在鱼肚子里，骨头藏在外国海边的深沙下。他死了，所有亲友都不幸，我最不幸。走到哪里，哪怕回父母身旁，回出生长大的家乡，也找不到那么好的主人。我想见爹娘，很想，可现在牵挂得还不如主人。提起奥德修斯，纵然已不在，我仍得恭敬。他对我好，照顾得周全。不论在哪里，这份敬意永远不改。
    - id: ch02
      title: 谁肯相信归来的消息
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            朋友，你真认准他不回，怎么也劝不信啊。我却不光说，还要发誓，主人就会归来。真回来以前，别付报信酬劳，等到那时，你愿意，就给我结实耐穿的内衣披风。虽然我穷，也不提前拿。因为穷便撒谎的人，我像恨地狱火那样恨。我以宙斯王、待客的规矩，以及眼下奥德修斯家的炉火起誓，准会照说的发生。这一年，这个月完、下个月刚开始，他就到家，惩罚那些害妻儿的人。
        - id: ch02-b02
          speaker: narrator
          text: |
            牧猪人欧迈奥斯，你又这样答话。
        - id: ch02-b03
          speaker: eumaeus
          text: |
            老人家，酬劳你拿不到，人也不会回。安安静静喝酒吧，换个话题。谁一提尊敬的主人，我就难受，别让我总想。誓言先不说，我跟佩涅洛佩、拉厄尔忒斯、忒勒马科斯一样，都盼他回来。

            那个儿子也叫人担心，长得快，眼看成人，脸和身子都像父亲那样好，却有人搅乱心意，不知是人是神，让他去皮洛斯找父亲。求婚人埋伏归路，要叫阿尔刻西奥斯家在伊萨卡断了根。唉，也别说了，或者遭擒，或者克洛诺斯之子肯伸手保他，让他逃脱。说说你吧，自己是谁，住哪里，父母、家乡怎样？船什么样，怎样送你到此，船员又说自己哪国人？你可没法从陆上走来。
        - id: ch02-b04
          speaker: odysseus
          text: |
            那我都说。若有足够肉和酒，咱们坐在棚里，别人干活，自己只管吃喝，我能说上一年，还讲不完天神让我经历的苦。

            我老家在克里特。父亲有钱，正妻生了许多儿子，我的母亲却是买来当妾的女奴。但父亲仍把我同兄弟平等看待。他叫卡斯托尔，是许拉克斯的儿子，我就认这份血统。父亲在克里特极受敬重，有财富，家业旺，儿子们又能打。他死后到了哈得斯，兄弟抽签分财产，我只拿一块地和很少的别物。可我凭勇敢，娶到了有钱人家的姑娘。我不爱夸口，也不在阵前后退。如今不行了，但看禾秆，还能知道从前谷穗什么样。我受苦实在太多。

            阿瑞斯、雅典娜让我敢打仗，我挑人去伏击敌军，从没把死放在心上。总先跳出，追上谁，就拿矛扎谁。打仗我在行，可农活、勤俭持家养孩子，我不爱。我爱上船，爱战斗，爱标枪与箭。别人想到这些便怕，我偏天生喜欢。人各有喜好嘛。去特洛伊之前，九回由我领人带船出海外征，钱财赚得多。战利品先挑，轮到分配，还多拿一份。

            家里越来越富，我在克里特成了要人。可宙斯计划了那趟害死许多人的可怕远征，民众非让我和伊多墨纽斯领船不可，没法推托。打了九整年，第十年才夺下普里阿摩斯的城。上船回去，诸神把众人分散，宙斯也开始害我。妻子孩子和产业身边，只过了一个月舒服日子，我又想出兵埃及。便备好船队，招足人马，九条好船，人争着来坐。

            先宴饮六天，许多牲畜由我供应，给神祭，也给大家吃。第七天，顺着北风离开克里特，虽说船在河里往下走。航行没事，没人病，坐好让舵手与风带路。第五天到埃古普托斯河，我停船，叫人守着，另派斥候到各处有利地方察看。可他们偏不听，按自己的意思抢埃及田地，杀人，捉妻子孩子。城里很快听到警报，天刚亮，战号一响，人全涌出，骑马的、步行的，甲光闪闪，布满平原。宙斯又使我们恐慌，眼看被围，部下不肯迎战。许多遭杀，其余活捉去做苦工。

            宙斯给我一个念头，其实倒不如当时死在埃及，后来还有那么多苦。我摘头盔，卸盾牌，扔矛，直接奔国王战车，抱膝亲吻。国王饶了我，叫上车，我一路哭着被带到他家。许多人气愤，挺白蜡木矛要刺我，国王却拦住，因为害怕宙斯，这位神庇护外客，惩罚恶人。
    - id: ch03
      title: 漂泊的身世
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            我住埃及七年，人人给东西，攒了一大笔。第八年快到，来了腓尼基骗子，奸诈得很，什么恶事都干过。他劝我去腓尼基，同他回自己的房屋和产业。我在那里又留十二个月，日子一天天过，同样的季节再来时，他叫我上去利比亚的船，说一起送货，其实要卖我当奴隶，钱归他。我怀疑，可无路可走，还是登船。

            北风很劲，送到克里特和利比亚之间的海。宙斯在这里定意灭掉他们。刚远离克里特，只剩海天，黑云便罩船，水也变暗。他掷霹雳，闪电一打，船不断转，满船火和硫磺。大家跌下海，像海鸥围船浮着，神终于不让他们再有归家的机会。我怕坏了，可宙斯又把桅杆送来，够得着，救我活命。我紧抓它，顺狂风飘，过了九天，第十夜一片黑，大浪把我推上忒斯普罗提亚岸。

            斐冬王热情招待，不要分文。原来王子发现我时，冻和累快把我弄死，他握手扶起，带去父亲屋，给衣服穿。主人奥德修斯的事，就是在那里听来的。王说，这位回家路上的客人，他好好招待过，又指给我看积下的黄金和精工铁器。留在王家的财宝，养十代人都够。

            可奥德修斯去了多多纳，听那棵神的高橡树传达宙斯心意，要知道离家这么久，该公开回去，还是暗回。王还当着我，在家里奠酒起誓，说船靠好了，船员备齐，准备送奥德修斯回本国。他回来前，王先送我走了，因为刚好有艘船去盛产麦的杜利基翁，就叮嘱船长，一定平安送去阿卡斯托斯王那里。

            谁知船上人算计我，差点弄得无比凄惨。航离岸不远，就要卖我作奴，把内衣披风扒了，换成你见到这些烂布。傍晚到了伊萨卡有田地的地方，粗绳牢牢捆我在船，他们上海边吃饭。神却很快把绳解开。我拿破衣蒙过头，顺船舵滑下海，猛游，离他们够远才上岸，旁边密林正好藏。逃掉了，他们发怒，到处寻，找得没法才退回船去。诸神轻易替我掩藏，如今又送到好人门前，看来还没到死的时候。
        - id: ch03-b02
          speaker: narrator
          text: |
            欧迈奥斯啊，你这位牧猪人，听后这样说。
        - id: ch03-b03
          speaker: eumaeus
          text: |
            可怜的客人，你的遭遇真苦，听得我很动心。可是奥德修斯的部分不对，怎么也不能相信。何苦你这样的人，还在外头说谎？主人回不回，我清楚。各位神全厌恶他，不然该让他在特洛伊死，或打完仗，朋友陪在身边时死。阿开亚人能立坟，儿子能承他的名誉，多好。如今却被风卷走，不知去向。

            我躲在这边陪猪，不进城，除非有消息来，佩涅洛佩叫去。那时所有人围着发问，有人难过，有人却喜欢主人不在，吃他的不用付钱。我呢，让埃托利亚人骗过，便不再问别人。他杀人逃命，远远走来这猪场，我待他好。他说在克里特见主人同伊多墨纽斯一道，修被风浪坏掉的船，又说下个夏天或秋天就带人回，财物也多。老人家，你已经这么不幸，命运又送到我门前，别再用没根据的盼望讨好。我给好待遇，是敬畏保护客人的宙斯，也是同情你，不为报信。
        - id: ch03-b04
          speaker: odysseus
          text: |
            起了誓也不肯信，你实在疑心。那么当着天上所有神，定个约吧。人回来，给我结实衣服和披风，送我去想去的杜利基翁。不照我说的回，你就叫帮手把我扔下悬崖，让到处撒谎的流浪人看看下场。
        - id: ch03-b05
          speaker: eumaeus
          text: |
            那我真要出大名！把人请进屋，当客人招待，却又杀了，眼下、以后，谁不传？真做这事，我还不得拼命求神！先吃晚饭吧，到时候了，盼我的人赶快回来，一起做点香的。
    - id: ch04
      title: 炉火旁的晚饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            两人说着，牧人们赶猪回来，往圈里收，准备过夜，猪叫得震天。欧迈奥斯喊住他们。
        - id: ch04-b02
          speaker: eumaeus
          text: |
            把最好的一头带来，为客人献祭，咱们也吃一份。养这么久，辛苦都是我们的，好处却让别人拿了。
        - id: ch04-b03
          speaker: narrator
          text: |
            他劈柴，其他人带来肥壮的五岁公猪，牵到祭坛。牧人为人正，不忘诸神，先剪脸上的猪鬃丢火里，向神祈祷，求奥德修斯归来。劈柴时留下一块橡木，拿来把猪打昏，再由旁人宰杀、燎毛、切肉。每个部位切一点生肉放脂肪上，他洒些大麦粉，送进炭火。其余切小块，上叉烤，熟了撤叉，把肉堆到案板。

            他站起公平分配，共七份，一份留给迈娅之子赫尔墨斯和仙女，分时还祈祷。剩下逐个给人。客人得到顺着腰脊纵切的好肉，是特别尊重，心里十分高兴。
        - id: ch04-b04
          speaker: odysseus
          text: |
            欧迈奥斯，你这样敬重我这个流落的人，愿宙斯对你也像我一样，满怀好意。
        - id: ch04-b05
          speaker: narrator
          text: |
            牧猪人欧迈奥斯啊，你如此答道。
        - id: ch04-b06
          speaker: eumaeus
          text: |
            好朋友，饭菜就这些，尽兴吃吧。神愿给什么就给什么，另一件不给，也由他的意，什么都照他的心愿。
        - id: ch04-b07
          speaker: narrator
          text: |
            他切下头一片，烧给永生诸神，又奠酒，把杯送客人，再坐着吃自己的份。墨绍利奥斯送来面包。这人是主人不在时，牧人用自家钱，从塔福斯人那里买的，没向女主人和拉厄尔忒斯说。大伙享用好饭，足吃足喝，余下的面包由墨绍利奥斯拿走。丰盛的晚饭过后，众人各自睡下。
    - id: ch05
      title: 一件披风
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |
            夜又黑又险，没有月亮，雨下不停，潮湿西边的风吹得厉害。客人要试试，这位周到的主人会不会脱披风给他，或叫帮手让一件。
        - id: ch05-b02
          speaker: odysseus
          text: |
            欧迈奥斯，各位，听我说。我许个愿，再讲些事。都是酒让我多话，聪明人喝了也会唱，也会笑，会跳舞，还会说不该说的。不过开头了，就讲下去。真想变回当年在特洛伊设伏时的年轻壮实啊。墨涅拉奥斯与奥德修斯领队，我也算，他们都坚持让我当。

            到城墙近旁，我们缩在铠甲底下，藏进沼泽四周的浓芦苇、厚灌木。北风刮起，天冻了，细细的雪像霜撒下，盾牌结一层厚霜。别人穿着内衣，有披风，拿盾围住肩，睡得舒坦。我粗心，以为不至于多冷，就没带披风，只穿内衣，拿盾出门。等夜过三分之二，星换了地方，我用肘碰身边的奥德修斯，他立即听我讲。

            我说，奥德修斯，没有披风，这天气会冻死人！不知哪位神让我糊涂，只一件内衣就跑来，怎么办？他既有勇气也有办法，立刻想到了。压低声叫我别动，别让旁人听见，然后用肘撑起，抬头对大家说，朋友们，我刚睡着梦到神的启示。离船好远，希望有人去叫阿伽门农，赶紧派更多人过来。

            安德赖蒙的儿子托阿斯就脱掉披风，往船跑。我顺手拿来，裹着舒服睡到天亮。我若还年轻力壮，像那时候，你们中准有一位肯给件披风，或出于善意，或敬重勇敢战士。现在穿得破，人就不把我放眼里了。
        - id: ch05-b03
          speaker: eumaeus
          text: |
            老人家，故事好，话也合适。今夜该给落难客人的，什么也不少，衣服当然有。不过明天一早，还是得把自家破布披上。我们这里备用的衣服披风不多，一人也只一件。等主人儿子到家，他会给内衣披风，再送往你想去之处。
        - id: ch05-b04
          speaker: narrator
          text: |
            答应了客人，欧迈奥斯就站起来替他安床。他把几张山羊皮、几张绵羊皮摊在地上，位置就在炉火跟前，让奥德修斯躺好。接着取来一件又大又厚实的披风，仔细盖在客人身上。那是他自己留作替换的衣物，只有遇到特别糟糕的天气，才用得着。奥德修斯便睡在那里，几个年轻人也在身旁躺下。

            可牧猪人不愿离自己的猪过夜，预备出去。主人虽然不在，还守家业这么尽心，奥德修斯很高兴。他把剑挂到结实肩膀，披厚衣挡风，再取肥壮大山羊的皮、拿标枪，防备人或狗来袭。装备好了，便去猪群的栖息地睡，上头悬着岩石，能挡住北风。
