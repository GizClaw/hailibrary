audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，措辞有分寸", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "热心待客，说话朴直而有主见", timbre: "成熟厚实，带乡野质感", pace: "舒缓", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "先给一顿饭"
      blocks:
        - id: ch01-b01
          speaker: eumaeus
          text: >-
            过来烤烤火，坐稳了再讲。
        - id: ch01-b02
          speaker: narrator
          text: |-
            欧迈奥斯在草垫上铺好厚皮，请破衣老人歇着。刚刚，狗群还把来人围住狂叫。他丢下做了一半的皮鞋，跑出去，边喊边扔石头，赶开了狗。客人已经进来，他还没问姓名。

            奥德修斯满意地坐下，没用主人的口气。他得藏住身份，在这里打听家里的事。欧迈奥斯拿出自己的睡皮让他休息，又去照管饭食。

            牧猪人杀了两头小猪，烤好，再兑上酒，请客人吃。
        - id: ch01-b03
          speaker: odysseus
          text: >-
            愿诸神满足你的心愿。
        - id: ch01-b04
          speaker: narrator
          text: >-
            欧迈奥斯说，即使更穷的人来，也该好好待他。外乡人和乞丐归宙斯庇护，自己怕神，也同情老人。年轻主人治下，仆人只能提心吊胆，拿出眼下所有。他本来盼着主人回来，好得到房屋、土地和妻子，可战争带走了主人。他咒海伦全家都毁灭，说死了太多好人。活还照做，最好的猪却每天送给求婚人。
        - id: ch01-b05
          speaker: eumaeus
          text: >-
            养是我们养，吃让他们吃。我们这份瘦些，但你先吃饱。
        - id: ch01-b06
          speaker: narrator
          text: >-
            热肉端上来，奥德修斯大口吃喝，不作声，心里却在打算报仇。欧迈奥斯不知面前就是主人。围栏是他在主人走后造的，希望少了，活却没少。城里照样要肉，哪怕主人在远处受饿。客人接过酒碗，问买下这位牧猪人的主人是谁。
        - id: ch01-b07
          speaker: odysseus
          text: >-
            我去的地方多，兴许知道一些他的事。
        - id: ch01-b08
          speaker: eumaeus
          text: >-
            他叫奥德修斯。可别为了刚才的食物，就说你曾经见过他。
    - id: ch02
      title: "不拿希望作交换"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            牧猪人看着客人。来讨衣物食宿的人，总说有好消息，佩涅洛佩便边问边哭。欧迈奥斯说，哪怕回到自己的父母那里，也再找不到这样的主人。父母他很想见，失去奥德修斯却让他更伤心。他以前收留过一个逃亡的埃托利亚杀人者，听他说在克里特见过主人，和伊多墨纽斯修风暴损坏的船，夏天或秋天就回来。他把那季节等完，国王仍不见踪影，再也不愿这样相信。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            不用现在给衣物。我恨因为穷就撒谎的人。我发誓，这轮月结束，下一轮月到来，奥德修斯就会回来，向欺压妻儿的人报仇。到时再送我衣服。
        - id: ch02-b03
          speaker: eumaeus
          text: >-
            我想他能回来，可这不等于我肯信你的保证。
        - id: ch02-b04
          speaker: narrator
          text: >-
            欧迈奥斯不愿继续这个话题。主人的名字一说出口，他脑子里便是那张恐怕永远见不到的脸。可是说到少主人，心又悬起来，那张年轻的脸会不会也从此消失？忒勒马科斯为了打听父亲才出海，求婚人竟在途中等着下手，要使儿子也回不了家。欧迈奥斯守在这间猪棚里，有心去帮，却连该向哪里伸手都不知道。
        - id: ch02-b05
          speaker: eumaeus
          text: >-
            还是讲你自己。怎么走到这儿的？
        - id: ch02-b06
          speaker: narrator
          text: |-
            奥德修斯编了一生。他说父亲是克里特贵族，母亲是买来的女奴，给父亲作妾。父亲待他同婚生儿子一样，父亲死后，兄弟却只分给他一点产业。凭勇武他娶了有钱人家的女子，九次抢掠让他富起来。他不喜欢耕地养孩子，只爱船和战争。克里特人让他与伊多墨纽斯统兵，打了九年，第十年攻下特洛伊。他回家才一个月，又带九船去埃及。
            他声称，手下不听话，杀了男人，掳走女人和孩子，埃及人出兵反击，杀掉一批，抓一批干苦活。他扔下武器，抱住国王的膝盖。国王敬畏宙斯，护着他，还拦下那些仍要拿矛刺他的人。
            在埃及积财七年后，他随一个腓尼基人回乡，住了一年。商人带他去利比亚，嘴上说运货，其实想卖他。他看出了，却没法不去。宙斯把船击碎，他抱着桅杆漂了九天，第十夜来到忒斯普罗提亚。斐冬王的儿子救起冷得快死的他，领进王宫，给衣服食宿。

            接着就谈到主人，说斐冬王给他看了奥德修斯留下的财物，十代人也花不完。奥德修斯正去多多纳，问宙斯该明着还是暗着回去，船早备好了。国王先安排他去杜利基翁见阿卡斯托斯，船员却要卖他，拿走好衣服，换成破布，在伊萨卡把他绑住。他们去岸上吃饭，神松开绳子，他便滑下船舵游走，藏进树林。那些人找不到，只好走了，他这才到猪棚。

            这一长段经历，藏住了他的真正身世。欧迈奥斯一直听到最后，没有赶走客人，可也不肯相信那一点希望。
        - id: ch02-b07
          speaker: eumaeus
          text: >-
            我知道你受过苦。但关于我主人的消息，不用再让我相信了。
        - id: ch02-b08
          speaker: narrator
          text: >-
            客人竟想赌一场。真应验，给衣裳，送自己走。不应验，让人把这说谎的老汉扔下山崖。欧迈奥斯放下碗，立刻拒绝。
        - id: ch02-b09
          speaker: eumaeus
          text: >-
            我不做这赌约。你来屋里求照应，我不会拿你的命去检验你说得对不对。
        - id: ch02-b10
          speaker: narrator
          text: >-
            牧人赶猪回来，关好圈。欧迈奥斯选了肥壮的公猪作晚饭，给神留一份，再给人公平分肉，客人得了好的一块。墨绍利奥斯送来面包，他是欧迈奥斯拿私房钱买来的，王后与拉厄尔忒斯都没被问过。客人谢他，牧猪人请他吃，说神给什么、不给什么，都由神定。
    - id: ch03
      title: "借衣的故事"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            天黑下雨，没有月亮，风往屋里钻。奥德修斯衣服薄，挡不住冷。他想试一试欧迈奥斯肯照顾到什么地步，便又讲起故事，说在特洛伊有过一夜受冻。

            他声称同墨涅拉奥斯、奥德修斯一起领队。北风吹雪，众人藏在苇丛，他没带披风，快冻死了。后半夜，他碰身边的奥德修斯，低声求助。将领叫他别出声，随后说，自己做了神赐的梦，需要人去请阿伽门农增兵。托阿斯就起身跑了，把披风留下，挨冻的人得以裹住熬到天亮。说完，客人又拉近身上的破布。
        - id: ch03-b02
          speaker: odysseus
          text: >-
            我那时候年轻，别人还乐意伸把手。
        - id: ch03-b03
          speaker: narrator
          text: >-
            欧迈奥斯站起来。
        - id: ch03-b04
          speaker: eumaeus
          text: >-
            从前先不忙谈，眼下这夜得暖着过。
        - id: ch03-b05
          speaker: narrator
          text: |-
            他在火前安排好兽皮卧处，拿出备用的厚披风。不过这是借给客人今晚用的。这里的衣服并不富余，明天还得换回旧衣，等忒勒马科斯回来，才能让客人有一身好穿的，也能安排往下走。

            奥德修斯躺好，欧迈奥斯替他遮上。旁人就在炉边睡，牧猪人自己却穿厚衣、拿长矛，要去看守牲畜。岩石底下还能避一点风，他宁可在那里过夜，不愿猪群没有人照管。

            奥德修斯盖着借来的披风，见仆人在自己不在时仍守着财产，心里很满意。
