  chapters:
    - id: ch01
      title: The swineherd's welcome
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Ulysses left the harbor and followed a rough path through the woods and over the mountain ridge. He reached the place Minerva had described, where the swineherd lived, the servant who managed his property most carefully. The man was sitting outside his hut. Beside it stood the yards he had built on a spot visible from far away. They were spacious and well made, with room for the pigs to run around them. While his master was absent, he had collected stones from the ground and built the walls himself, saying nothing about it to Penelope or Laertes. Thorn bushes lined the top. Outside he had made a strong fence from split oak posts set close together. Inside stood twelve neighboring pens for the sows. Fifty pigs wallowed in each, all breeding females. The males slept outside. There were fewer of them because the suitors kept eating them, forcing the swineherd to send his best again and again. Three hundred and sixty boars remained. Four fierce dogs, as savage as wolves, always slept among them.

            Just then he was cutting a pair of sandals from a fine thick oxhide. Three of his men were away tending pigs in different places. The fourth had been sent to town with a boar for the suitors, who demanded it for their sacrifice and their dinner.

            The moment the dogs caught sight of Ulysses, they began barking fiercely and hurled themselves at him. He had enough cunning to sit down at once and let his hand release the stick he was carrying. Still, he would have been torn to pieces there on his own property if the swineherd had not seen the danger. The man dropped the oxhide he was working on and ran at full speed through the gate of the yard. Shouting at the dogs and flinging stones at them, he drove them back from the stranger. Then he turned to speak to him.
        - id: ch01-b02
          speaker: eumaeus
          text: |
            Old man, those dogs were very close to making an end of you. And think what trouble that would have brought on me. The gods have burdened me with enough worries already, without adding that one. I have lost the finest master there ever was, and there is not a time when I am free from grief for him. Here I am looking after swine, only for other men to eat them. Meanwhile my master, if he is still alive to see the sun, must be going hungry in some country far away. But come into my hut. Let me give you bread and wine until you have had enough. After that you can tell me where you have traveled from and explain all the misfortunes that brought you here.
        - id: ch01-b03
          speaker: narrator
          text: |
            He led the way inside and offered Ulysses a seat. He spread a thick layer of rushes on the ground, then threw his own great shaggy chamois skin over them, the skin he slept on at night. Ulysses was pleased with such a welcome.
        - id: ch01-b04
          speaker: odysseus
          text: |
            Friend, may Jove and all the gods give you what your heart desires, in return for the kindness you have shown me.
        - id: ch01-b05
          speaker: narrator
          text: |
            Eumaeus, swineherd, this was your answer.
        - id: ch01-b06
          speaker: eumaeus
          text: |
            Stranger, even if someone poorer than you came here, I would have no right to mistreat him. All strangers and beggars belong to Jove. You must accept what I can offer. Servants have to live in fear when young masters rule them, and that is my trouble now. Heaven has kept away the man who would always have treated me well. He would have given me a house of my own, some land and a good-looking wife. A generous master rewards a servant who works hard and whose work the gods make prosper, as they have made mine prosper here. If he had grown old at home, he would have done a great deal for me. But he is gone. I wish Helen's whole family had been wiped out. She has caused the death of so many good men. It was because of her that my master went to Ilius, where the noble horses are, to fight the Trojans for King Agamemnon.
        - id: ch01-b07
          speaker: narrator
          text: |
            While he said this, the swineherd tightened his belt around his waist and went to the enclosure where the young pigs were still suckling. He picked out two of them, brought them back with him and killed them for the sacrifice. He burned off their hair, cut the carcasses into pieces and threaded the meat onto spits. As soon as it was done, he carried the whole meal into the hut. The pork was still hot and still on its spits when he set it in front of Ulysses. His guest scattered white barley meal over it. Eumaeus then prepared wine in a bowl made of ivy wood, took a seat across from Ulysses and told him to start eating.
        - id: ch01-b08
          speaker: eumaeus
          text: |
            Eat, stranger. This is the pork a servant gets. The fat pigs must go to the suitors, and they eat without shame or a thought of right and wrong. The blessed gods do not love behavior like that. They honor people who keep the law and do what is right. Even savage raiders, after Jove lets them plunder someone else's country, fill their ships and return home, feel their consciences trouble them. They watch in fear for punishment. But some god seems to have told these men that Ulysses is dead for good. They will not return to their own homes and court his wife properly. They seize his estate and spend without limit or fear. Every day and night that heaven sends, they sacrifice far more than one or two animals and drink his wine as they please.

            He was extraordinarily wealthy. No lord in Ithaca or on the mainland had as much. His property would equal that of twenty men put together. Let me describe it. On the mainland there are twelve herds of cattle and twelve flocks of sheep, along with twelve droves of pigs. Twelve great herds of goats are spread over the country, tended by his own workers and hired foreigners. At the far end of Ithaca he has large goat flocks too, with excellent herdsmen caring for them. Every herdsman sends the suitors his best goat each day. As for me, I look after the pigs you see here, and must keep choosing the finest to send them.
        - id: ch01-b09
          speaker: narrator
          text: |
            While Eumaeus talked, Ulysses ate and drank hungrily without saying a word, thinking over his revenge. When he was satisfied, the swineherd filled the cup he used himself and handed it to his guest. Ulysses took it gladly.
        - id: ch01-b10
          speaker: odysseus
          text: |
            Friend, who was this master who paid to buy you, this rich and powerful man you describe? You say he died fighting for King Agamemnon. Tell me his name. Perhaps I have met him somewhere. Jove and the other gods know, but I may have news for you. I have traveled far.
        - id: ch01-b11
          speaker: eumaeus
          text: |
            Old man, no traveler bringing news can make Ulysses' wife and son believe him now. Yet wanderers needing a bed keep coming with mouths full of lies and not one true word. Whoever reaches Ithaca goes to my mistress with a story. She welcomes them, treats them well and asks endless questions. All the while she cries, as women do when their husbands are lost. You too could invent a fine tale for a shirt and cloak, old man. But wolves and carrion birds tore Ulysses apart long ago, or fish have eaten him and his bones lie deep in the sand of some foreign shore. He is dead and gone. Every friend suffers for it, and I suffer most.

            Wherever I go, I shall never find another master so good. Not even if I returned to my mother and father in the country where I was born and brought up. I would dearly love to see my parents at home again, but even they are not my greatest concern now. It is losing Ulysses that hurts most. I cannot name him without respect, though he is no longer here. He loved me and cared for me so well. Wherever he may be, I will always honor his memory.
    - id: ch02
      title: A promise and a Cretan story
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            My friend, you have made up your mind so firmly that it is hard for you to believe your master could ever come back. Yet I am ready to do more than tell you he is coming. I am willing to swear an oath that he will return. Do not pay me anything at all for the news until the man himself has arrived. Once he is here, you can give me a shirt and cloak of good, hard-wearing cloth, if that is what you wish. I am badly in need, but until then I refuse to take a single thing. A man who uses his poverty as a reason to tell lies is as hateful to me as the very fires of hell. I swear by Jove our king, by the sacred duties between guest and host, and by the hearth of Ulysses to which I have come, that what I have promised will take place. Ulysses will return before this year is out. At the ending of this moon and the beginning of the next, he will be here to avenge the suffering those men are causing his wife and son.
        - id: ch02-b02
          speaker: narrator
          text: |
            And you answered him, Eumaeus the swineherd.
        - id: ch02-b03
          speaker: eumaeus
          text: |
            Old man, you will not be paid for good news, and Ulysses will not come home. Drink your wine quietly and let us speak of something else. Do not keep bringing it back to me. It hurts whenever anyone talks of my dear master. We will leave your oath alone. I wish he would return, just as Penelope wishes it, and old Laertes and Telemachus. That boy grieves me terribly too. He was growing fast into a man, with a face and figure as fine as his father's. But someone, god or man, has disturbed his mind. He has gone to Pylos seeking news of his father. The suitors wait in ambush for his return. They hope to wipe the name of Arceisius's house from Ithaca. But enough of him. Let him be caught, or escape if the son of Saturn stretches his hand over him.

            Tell me about yourself instead. Who are you, and where are you from? What is your town, and who are your parents? What sort of ship brought you, and how did its crew land you in Ithaca? What country did they say they belonged to? You cannot have walked here overland.
        - id: ch02-b04
          speaker: odysseus
          text: |
            I will tell you everything. If we had enough meat and wine, and could sit here doing nothing but eating and drinking while the others worked, I could talk for twelve months without finishing all the sorrows heaven has sent me.

            I was born in Crete. My father was a wealthy man with many sons by his wife. My mother was a slave he had bought as a concubine. Still, he treated me like my brothers born in marriage. My father was Castor, the son of Hylax, and that is the family I claim. The Cretans honored him greatly for his wealth, his thriving household and his brave sons. When death took him down to Hades, the sons divided his property by lot. They gave me a piece of land and little more. But my courage won me a wife from a rich family. I was no boaster, and I never hung back in battle. Those days are gone. Yet even from the straw you can judge what the ear of grain once was. I have endured more than enough trouble.

            Mars and Minerva made me bold in war. When I picked men to ambush the enemy, death never entered my thoughts. I was the first to spring out and spear anyone I could overtake. That was how I fought. But I had no love for farming, or for the careful household life of people raising children. Ships, battles, javelins and arrows were what I loved, the things most men shrink from thinking about. One man likes one thing, another likes something else. This was my natural bent. Before the Achaeans sailed to Troy, I led ships and men abroad nine times and gained a great deal of wealth. I chose from the spoils first, and received still more when the shares were divided.

            My household grew rich, and I became an important man among the Cretans. Then Jove planned that terrible expedition in which so many died. The people demanded that I and Idomeneus lead their ships to Troy. They insisted, and there was no way to refuse. We fought there for nine whole years. In the tenth we took Priam's city and sailed for home, while heaven scattered us. That was when Jove began planning trouble for me. I had only a month of happiness with my wife, children and possessions. Then I thought of raiding Egypt. I prepared a fine fleet and filled it with men. There were nine ships, and people crowded to join them. We feasted for six days. I supplied plenty of animals for sacrifices and for the men's meals. On the seventh we boarded and left Crete with a favorable North wind, though we were sailing down a river. Every ship went safely, and no one fell ill. We stayed in our places and let the wind and steersmen carry us. On the fifth day we reached the river Aegyptus. I stationed the ships there and ordered the men to stay and guard them, while I sent scouts to look out from every useful vantage point.

            But my men would not obey. They followed their own plans, plundered Egyptian land, killed the men and carried off women and children. The alarm reached the city quickly. At the battle cry, the people came out at dawn until the plain was full of horsemen, foot soldiers and shining armor. Jove filled my men with panic. They found themselves surrounded and would not stand against the enemy. Many were killed. The rest were captured and put to forced labor. Jove put a plan into my mind. How I wish I had died there in Egypt instead, for so much suffering still awaited me.

            I took off my helmet and shield and let my spear fall. Then I went straight to the king's chariot, clasped his knees and kissed them. He spared me and told me to climb beside him. I was weeping as he took me to his house. Many Egyptians lunged at me with ash-wood spears, furious and eager to kill. But the king protected me. He feared Jove, the guardian of strangers, who punishes men for doing wrong.
    - id: ch03
      title: Slavery and rumors of home
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            I made my home among the Egyptians for seven years, and in that time I gathered a considerable amount of money. Everyone there gave me something. As we were coming to the eighth year, a certain man arrived from Phoenicia. He was a cunning rogue who had already practiced every kind of wickedness. He talked me into leaving with him for his own country, where he had his house and all his belongings. I stayed with him for twelve whole months. Day followed day, month followed month, until the same season came back round. At that point he took me onto a ship sailing for Libya. He pretended that I was to help carry a load of goods with him to that country. His real plan was to sell me to someone as a slave and put the money in his own hands. I had my suspicions about what he intended. But I could see no way to avoid it, and boarded the ship with him.

            A fresh North wind carried us into the sea between Crete and Libya. There Jove decided to destroy them. Once Crete was far behind and only sky and water could be seen, a black cloud rose over the ship and darkened the sea beneath it. Jove flung his thunderbolts. Lightning struck the ship, sending her round and round, filling her with flame and sulfur. Everyone fell into the water and drifted round the wreck like sea-gulls. Soon the god ended all their hopes of home. I was terrified. But Jove sent the mast within my reach and saved my life. I held on as the furious wind drove me. For nine days I drifted. In the darkness of the tenth night, a great wave carried me to the Thesprotian shore.

            Pheidon, king of the Thesprotians, took me in kindly and asked nothing in return. His son had found me almost dead from cold and exhaustion. He took my hand, helped me up, led me to his father's house and gave me clothes. There I learned about Ulysses. The king said he had welcomed him generously on his journey home. He showed me the gold and finely worked iron Ulysses had gathered. There was enough treasure in Pheidon's house to support his family for ten generations.

            But Ulysses had gone to Dodona, the king said. He wanted to hear Jove's will from the tall sacred oak and learn whether, after such a long absence, he should return to Ithaca openly or in secret. In my presence, Pheidon poured offerings in his own house and swore that a ship waited by the water, with its crew ready to take Ulysses home. He sent me away before Ulysses returned. A Thesprotian ship happened to be leaving for the wheat-growing island of Dulichium. The king told its captain to deliver me safely to King Acastus.

            The men on that ship had their own scheme against me, one that would have made my misery worse than ever. We were only a little way out from the coast when they decided they would sell me as a slave. They pulled off the shirt and cloak I had been wearing and made me put on the old torn rags you see on me now. Towards nightfall they came to the cultivated land of Ithaca. There they tied me fast inside the ship with a stout rope, while they went ashore to cook their supper by the sea. The gods soon freed me from those bonds. I drew the rags up over my head, slid down along the rudder into the water and began to swim with all my strength. I kept going until I was far enough away, then came out beside a dense wood and concealed myself among it. The sailors were furious when they found I had escaped. They searched all around, but at last decided there was no more use in looking and went back to the vessel. The gods had hidden me without difficulty. Now they have led me to the door of a good man. Apparently I am to be allowed a little more time before I die.
        - id: ch03-b02
          speaker: narrator
          text: |
            Swineherd Eumaeus, you replied to him like this.
        - id: ch03-b03
          speaker: eumaeus
          text: |
            Poor stranger, what an unhappy life. Your story has held my attention. But what you say about Ulysses is wrong, and I will never believe it. Why should a man like you travel about telling such lies? I know what to think about my master's return. Every god hates him. Otherwise they would have let him die at Troy, or among friends once the fighting was over. Then the Achaeans would have raised a mound over his ashes, and his son would have inherited his fame. Instead the storm winds have snatched him away, and nobody knows where.

            I keep out of the way here with my pigs. I never go to town unless news of Ulysses arrives and Penelope sends for me. Then everybody sits round asking questions. Some mourn his absence. Others are glad, because they can consume his wealth without paying. I myself have stopped asking travelers since an Aetolian deceived me. He had killed a man and journeyed a long way before reaching my place. I treated him very kindly. He claimed to have seen Ulysses in Crete with Idomeneus, repairing ships damaged in a storm. He said our master would return the following summer or autumn with his men and great riches. So now, unhappy old man, fate has brought you here, but do not flatter me with empty hopes. That is not why I will treat you well. I fear and respect Jove, the god who protects guests, and I feel pity for you.
        - id: ch03-b04
          speaker: odysseus
          text: |
            I see you find it hard to believe. Even my oath has not persuaded you. Let us make a bargain, with all the gods of heaven as witnesses. If your master returns, give me a lasting shirt and cloak and send me to Dulichium, where I want to go. If he does not come as I promise, set your men on me. Have them throw me over that cliff, as a warning to wanderers who roam the country telling lies.
        - id: ch03-b05
          speaker: eumaeus
          text: |
            What a fine name that would give me, now and in the future! I bring you into my hut and welcome you, then kill you. I would certainly have to pray hard after that. But supper time is here. I hope my men will soon return so we can cook something good.
    - id: ch04
      title: Seven portions
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            As they talked, the herdsmen came back with the pigs. They shut them into their pens for the night, driving them in amid a tremendous squealing. Eumaeus called to his men.
        - id: ch04-b02
          speaker: eumaeus
          text: |
            Bring the finest pig you have. I will sacrifice it for our guest, and we will have our share too. We have worked hard enough all this time raising pigs, while other people enjoy the results.
        - id: ch04-b03
          speaker: narrator
          text: |
            He began chopping wood. The others brought a fine fat boar, five years old, and placed it at the altar. Eumaeus was a good man who remembered the gods. First he cut bristles from the animal's face and cast them into the fire, praying to every god that Ulysses might return. He had saved a piece of oak while chopping the wood. With it he struck and stunned the pig. The others killed it, singed off the hair and cut it into joints. Eumaeus took raw meat from each joint, laid it on some fat, sprinkled it with barley meal and placed it on the embers. They cut the rest small, threaded it onto spits and roasted it. Once cooked, it was taken off the spits and heaped on the dresser.

            The swineherd stood to divide the food, and he divided fairly. He made seven portions. One he set apart for Mercury, Maia's son, and for the nymphs, praying to them as he did so. The rest he gave to the men, each his share. For Ulysses he cut slices along the loin as a special honor. Ulysses was delighted.
        - id: ch04-b04
          speaker: odysseus
          text: |
            Eumaeus, I hope Jove feels as kindly towards you as I do. You have shown such respect to an outcast like me.
        - id: ch04-b05
          speaker: narrator
          text: |
            And this was your reply, Eumaeus the swineherd.
        - id: ch04-b06
          speaker: eumaeus
          text: |
            Eat, good friend, and enjoy what supper we have. God gives one thing and holds back another as he thinks best. He can do whatever he chooses.
        - id: ch04-b07
          speaker: narrator
          text: |
            As he spoke, he cut the first piece and burned it as an offering to the immortal gods. He poured a drink-offering, handed the cup to Ulysses and sat down to his own share. Mesaulius brought the bread. While his master was away, Eumaeus had bought this man from the Taphians with his own money. He had told neither his mistress nor Laertes about it. They all ate the good food before them. When they had had enough to eat and drink, Mesaulius removed the remaining bread. After their hearty supper, they went to bed.
    - id: ch05
      title: The borrowed cloak
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |
            Night came on with storm and deep darkness. There was no moon to give any light. The rain went on pouring without a break, and a powerful wind blew from the west, the quarter that brings wet weather. Ulysses began to wonder how far the swineherd's excellent care would go. He decided to try him. Would Eumaeus take the cloak off his own shoulders and offer it to his guest? Or would he make one of the men hand over a cloak for him instead?
        - id: ch05-b02
          speaker: odysseus
          text: |
            Listen, Eumaeus, and all of you. I will make a wish and tell you something. The wine is making me talk like this. Wine can make even a wise man sing, laugh and dance, and say things better left unsaid. Still, I have begun, so I will go on. I wish I had the youth and strength I had when we laid an ambush before Troy. Menelaus and Ulysses were in command. I was a commander too, because both of them insisted.

            We came near the city wall and crouched beneath our armor, hidden among the thick reeds and bushes around a marsh. A North wind brought freezing cold. Fine snow fell like hoarfrost, and a thick coating of ice formed on our shields. The others had shirts and cloaks and slept comfortably with their shields around their shoulders. I had foolishly left my cloak behind, thinking I would not get too cold. I had gone out with only my shirt and shield. Two-thirds of the night had passed, and the stars had shifted in the sky. I nudged Ulysses beside me with my elbow, and he listened at once.

            Ulysses, I told him, this cold will kill me. I have no cloak. Some god must have fooled me into coming with nothing but a shirt, and I cannot think what to do.

            He was as clever as he was brave, and he thought of a plan. Keep quiet, he whispered, or the others will hear. Then he propped himself on his elbow and raised his head. Friends, he said, heaven has sent me a dream in my sleep. We are far from the ships. I wish someone would go and tell Agamemnon to send more men to us immediately.

            Thoas, Andraemon's son, threw off his cloak and ran down to the ships. I took the cloak and wrapped myself in it, sleeping comfortably until morning. If only I still had my strength and youth from those days. One of you swineherds would give me a cloak then, out of kindness and respect for a brave fighting man. But now these shabby clothes make people despise me.
        - id: ch05-b03
          speaker: eumaeus
          text: |
            Old man, that was a fine story. Everything you have said has been quite proper. Tonight you will lack neither clothes nor anything else a stranger in trouble may fairly expect. But tomorrow you must wrap those old rags round yourself again. We have few spare shirts or cloaks here. Each man has only one. When Ulysses' son returns, he will give you a shirt and cloak and send you wherever you wish.
        - id: ch05-b04
          speaker: narrator
          text: |
            With that promise, Eumaeus got to his feet and began making a bed for Ulysses. He laid out goatskins and sheepskins on the floor in front of the fire. Ulysses stretched himself on them. The swineherd then spread a large, thick cloak over his guest, a spare cloak he kept for the times when the weather was particularly bad.

            Ulysses went to sleep there, with the young men sleeping close beside him. But the swineherd was unwilling to pass the night at a distance from the animals in his charge, so he made ready to go outside. Ulysses was glad to see how faithfully the man looked after his property while his master was away. Eumaeus first slung his sword over his strong shoulders. He wrapped himself in a thick cloak to keep the wind from his body, and took the hide of a large goat that had been well fed. He also carried a javelin, so that he would be prepared if either men or dogs came against him. With this equipment he went to his sleeping place among the pigs. They were lying beneath a rock that projected over them and gave protection against the North wind.
