audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "unhurried", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered and resonant", pace: "measured with varied breaths", pitch: "medium-low"}
    eumaeus:
      display_name: Eumaeus
      tts: {delivery: "hospitable and plainspoken with firm judgment", timbre: "mature and earthy", pace: "unhurried", pitch: "medium-low"}
  chapters:
    - id: ch01
      title: "Through the gate"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Before Eumaeus noticed a visitor, his dogs did. They rushed out of the pig pens, barking louder than the animals inside. Odysseus crouched low and released his staff.

            Eumaeus had been cutting oxhide for a sandal. He dropped it and ran through the gate. With shouts and stones he drove the dogs away.
        - id: ch01-b02
          speaker: eumaeus
          text: >-
            Come into the hut. You can tell me who you are later.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Odysseus followed him past the pens he'd built while his master was away. Inside, Eumaeus put his own thick sleeping skin over rushes for the guest. He killed two young pigs and roasted them, then mixed wine. He still hadn't asked a name.
        - id: ch01-b04
          speaker: odysseus
          text: >-
            I hope the gods give you whatever you most wish for.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Eumaeus said a poorer stranger would have received the same welcome. He feared Zeus and felt pity for his guest.
        - id: ch01-b06
          speaker: eumaeus
          text: >-
            Strangers and beggars come under Zeus's care. Servants have to live fearfully under young masters. I can only offer what I have.
        - id: ch01-b07
          speaker: narrator
          text: >-
            If Odysseus had grown old at home, Eumaeus thought, his work would have earned a house, land and a wife. Instead the war had taken him away. Eumaeus cursed Helen's whole family for so many deaths. He still cared for the pigs. Every day the suitors took the best for dinner, while the workers ate what remained. He served the hot meat without making excuses for its size.
        - id: ch01-b08
          speaker: eumaeus
          text: >-
            This will satisfy your hunger. At least we can still offer that.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Odysseus ate and drank hungrily, without a word. He was planning revenge as he heard how his estate was being wasted. Eumaeus offered him the wine bowl. Odysseus asked something he already knew.
        - id: ch01-b10
          speaker: odysseus
          text: >-
            Who was the master who bought you? You say he went to Troy. I've been many places. Maybe I've heard about him.
        - id: ch01-b11
          speaker: eumaeus
          text: >-
            Odysseus. But don't invent a meeting with him to repay your supper.
    - id: ch02
      title: "News that could not be bought"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Eumaeus watched his guest across the bowl. Wanderers had come with news to earn clothes or a bed. Penelope questioned them in tears. Even back with his own father and mother, Eumaeus said, he couldn't find another master like Odysseus. He missed his parents, but missed his master more. Once he'd sheltered an Aetolian who'd killed a man and fled. He claimed he'd seen Odysseus in Crete with Idomeneus, repairing ships damaged by a storm. He'd be back in summer or autumn, the fugitive promised. The season passed, but no ship brought the king home.
        - id: ch02-b02
          speaker: odysseus
          text: >-
            Don't pay me until he arrives. Then you can give me a cloak. I hate a man who lies because he's poor.
        - id: ch02-b03
          speaker: eumaeus
          text: >-
            I'd be happier if you didn't make me that promise.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The guest swore that when this moon ended and the next began, Odysseus would come back to take revenge for his wife and son. Eumaeus didn't believe it. He wished it were true, like Penelope and Laertes, but wishing hadn't brought the king back. Now Telemachus had gone to find news, and the suitors were waiting to attack his ship. From this hut, Eumaeus couldn't help. He grieved for a master he thought dead and feared his son would be killed too.
        - id: ch02-b05
          speaker: eumaeus
          text: >-
            Let me hear your own history. How did you end up here, dressed like this?
        - id: ch02-b06
          speaker: narrator
          text: |-
            Odysseus told a made-up life. His father had been a Cretan nobleman, he said, his mother an enslaved concubine. His father had treated him as an equal to his brothers. After the father's death, they'd left him little. He fought well enough to marry into a wealthy family. He'd gone raiding nine times and become rich on the plunder. He didn't want to stay home with a farm and children. He wanted to go to sea and fight. The Cretans made him and Idomeneus lead them to Troy. They fought nine years and took the city in the tenth. Back home, he stayed a month, then left with nine ships for Egypt.
            His men disobeyed him there, he claimed. They killed the men and carried off women and children. The Egyptians attacked, killed some and took others for forced work. He threw down his arms and clasped the king's knees. The king feared Zeus and protected him, even from people who still tried to spear him.
            After seven years of gathering wealth in Egypt, he went with a Phoenician to his country. A year later the man brought him aboard for Libya, pretending they would carry goods. He really meant to sell him. The traveler suspected it, but couldn't refuse. Zeus wrecked the ship. He floated on its mast for nine days. On the tenth night he reached Thesprotia. King Pheidon's son found him almost frozen and exhausted. He brought him to his father's house, where the traveler received clothes and a place to stay.
            Pheidon had shown him Odysseus's treasure, he said, enough for ten generations. Odysseus was at Dodona asking Zeus whether to come home openly or secretly, with a ship waiting for him. Pheidon sent the traveler ahead to Acastus on Dulichium. That crew also planned to sell him. They took his good clothes, put him in rags and tied him up at Ithaca. While they ate on land, the gods released his ropes. He slipped down the rudder, swam away and hid in the woods. They searched, then gave up. And that, he said, was how he'd arrived here.

            He'd kept his real identity hidden behind that tale. Eumaeus listened until it ended.
        - id: ch02-b07
          speaker: eumaeus
          text: >-
            You've suffered. I can see that for myself. The news of my master is another matter. A longer story won't make that part true.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Odysseus proposed a bargain. If the master returned, Eumaeus could clothe him and send him on. If not, he could have his men throw this lying guest off a cliff. Eumaeus set down the bowl.
        - id: ch02-b09
          speaker: eumaeus
          text: >-
            I won't do that. You asked me for shelter. Your life isn't something I'm willing to bet on.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Squealing announced the pigs' return. Eumaeus went to the pens, leaving the bowl by his guest. The argument stopped. The other men shut the pigs in, and Eumaeus chose a fine boar for dinner. He reserved a share for the gods and divided the rest fairly. For the guest, he chose a particularly good cut of meat. Mesaulius brought bread. Eumaeus had bought him with his own money while Odysseus was away, without asking Penelope or Laertes. When Odysseus thanked him, Eumaeus said to eat. The gods gave or withheld what they wished.
    - id: ch03
      title: "A story for a cold night"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Rain struck the hut after supper. There was no moon, and the wind pressed against the walls. Odysseus could feel the cold through Athena's thin clothing. He wanted to find out how much care Eumaeus would offer. Rather than simply ask for a covering, he began another story.
        - id: ch03-b02
          speaker: odysseus
          text: >-
            Once, near Troy, I went out for the night and forgot my cloak.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Menelaus and Odysseus had led the ambush, he said, with him as another leader. They lay in reeds, in snow and a bitter wind. He nudged Odysseus beside him and said he couldn't bear the cold. Odysseus hushed him. Then he told everyone he'd had a dream from the gods. Someone must ask Agamemnon to send more men. Thoas ran off and left his cloak. The freezing soldier picked up the cloak Thoas had left and kept it around him until morning. Finishing his story, Odysseus drew his rags closer.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            I was young in those days. A soldier could expect somebody to help him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Eumaeus stood up.
        - id: ch03-b06
          speaker: eumaeus
          text: >-
            Get warm first. Another tale can wait.
        - id: ch03-b07
          speaker: narrator
          text: |-
            He spread skins before the fire and fetched the heavy cloak he kept for very bad weather. He explained that he could lend it for this night. There weren't many spare clothes here, so the stranger must put his own on again in the morning. When Telemachus came back, he could provide proper clothing and arrange the next journey.

            Odysseus lay down, and Eumaeus put the cloak over him. The other men settled by the fire, but the swineherd prepared to go out. He dressed in his thick cloak and took his spear. He would sleep beside the pigs under an overhanging rock. Odysseus watched from the doorway as he went to guard the animals through the rain and dark.

            Beneath the borrowed cloak, Odysseus was pleased. His servant was still guarding his property while he was away.
