labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
premise: >-
  佩涅洛佩用奥德修斯留下的弓考验求婚人。儿子依父亲暗示放弃试弓， 两名忠仆在院外认出主人并承担各自任务。遭到众人反对的客人终于拿到弓， 一箭穿过斧孔，忒勒马科斯站到他身边。
characters:
  - { id: odysseus, description: "仍在大厅隐瞒身份的归乡者，在院外向两名忠仆表明身份。" }
  - { id: penelope, description: "提出比弓条件并维护客人试弓权利的女主人。" }
  - { id: telemachus, description: "配合父亲暗号、决定把弓交给客人的儿子。" }
  - { id: antinous, description: "试图维持求婚人体面、把失败推迟到明天的首领。" }
  - { id: eurymachus, description: "因无法拉弓而担心受人耻笑的求婚人。" }
  - { id: eumaeus, description: "认出主人后顶住辱骂送弓，并给乳母传话的养猪人。" }
  - { id: philoetius, description: "认出主人后负责关闭院门的牛倌。" }
  - { id: euryclea, description: "接收关门命令，让女仆听见争斗也留在内室的乳母。" }
  - { id: athena, description: "使佩涅洛佩睡去的神话女神。" }
