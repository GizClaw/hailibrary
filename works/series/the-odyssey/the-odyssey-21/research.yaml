  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XXI"
    claims:
      - "The bow came from Iphitus, whom Odysseus met seeking sheep and shepherds seized from Ithaca. Iphitus sought mares; Heracles later killed his guest and kept the mares."
      - "Penelope announces the bow-and-twelve-axe contest. Telemachus attempts it to prevent her departure; he would succeed on the fourth attempt but stops at his father's signal."
      - "Leiodes dislikes the suitors' wrongdoing but cannot string the bow; his warning is rejected. The bow is warmed and greased, yet the men fail."
      - "Outside the gate, Odysseus tests the herdsmen's loyalty, promises wives, homes and land, reveals his scar, and assigns the bow and door-guard tasks."
      - "Antinous invokes the centaur Eurytion's ear-and-nose mutilation and threatens to send the successful beggar to Echetus. Penelope offers clothes, arms and an escort; Telemachus asserts men's authority and sends her upstairs."
      - "Suitors threaten Eumaeus with his dogs; Telemachus threatens to stone him. The gates and women's doors are secured. Odysseus strings the bow, hears thunder, shoots through twelve axes while seated, and signals his son to arm beside him."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute"
    claims:
      - "The Greek epic is traditionally attributed to Homer."
notes:
  - "2026-10-11: newly phrased HaiLibrary reading edition under the user's explicit task-scoped exception to classic's verbatim-import default. Both locale writers remain homer. Complete Book XXI was compared with the saved Butler source at git commit 1208d108."
  - "Condensed boundaries: bow-gift genealogy and exact sheep/mare counts, the storeroom's carpentry and textiles, axe-setting geometry, suitor order and names beyond the consequential Leiodes/Eurymachus/Antinous, and repetitions of insult and praise. Captured shepherds, Iphitus's killing, threatened mutilation, patriarchal command, and threatened stoning are retained."
  - "Claim classification: events are supported literary plot; Athena's plan, sleep and thunder are declared myth. Antinous's Eurytion story and threat remain his speech, not narrator-endorsed treatment. No claim about a real archery device is taught."
  - "Knowledge continuity: the herdsmen recognize the scar only outside; the men inside do not witness the agreement. Penelope goes upstairs and sleeps before the bow is passed. The bow has been left in Ithaca, not carried at Troy. Telemachus obeys the concealed father's signal."
  - "The promise of homes and wives precedes the scar proof; return is separate, outer gates are secured by Philoetius, women by Euryclea, and the final shot is seated. No notes, modern translation or screen adaptation supplies the prose. Media bytes are unchanged."
