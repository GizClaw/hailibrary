  chapters:
    - id: ch01
      title: "The bow of a lost friend"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Minerva put a new resolve into Penelope's mind. She was to bring out the bow and the iron axes and have the suitors compete against each other. The contest would test their skill, and the goddess would use it to bring about their ruin. Penelope went upstairs and fetched the key to the storeroom. The key itself was bronze, with a handle made of ivory. Her maids went with her to the room at the far end of the house. Inside were the treasures her husband had collected, things made of gold and bronze and wrought iron. His bow was kept there too, beside a quiver packed with arrows that could take a man's life.
            The bow and quiver were a present from a friend Ulysses had met in Lacedaemon. The friend's name was Iphitus, and his father was Eurytus. Ulysses and Iphitus had come across one another in Messene, in Ortilochus's house. Ulysses was staying there on a particular errand. The people of Messene owed a debt that he had come to recover. They had raided Ithaca, driven off three hundred sheep, and taken the shepherds who tended them. Then they had sailed away with both men and animals. Ulysses was quite young when his father and the other chiefs chose him to go after them. The journey to demand their return was a long one.
            Iphitus had come with a search of his own. Twelve of his breeding mares were missing. The mule foals that ran along with the mares were missing too, and he wanted them back. Those same mares would in the end bring about his death. Looking for them, he visited the house of Hercules, the powerful son of Jove. Hercules had performed astonishing deeds of bravery. Yet in this he acted shamefully. Iphitus was his guest, and he killed him. He gave no thought to the vengeance of heaven. Nor did he respect the table at which he had set a meal before Iphitus. In spite of all that, he took the man's life and kept the mares for himself.
            Before that happened, the search for those animals had brought Iphitus to Ulysses. That was when he gave Ulysses the bow once carried by mighty Eurytus. When Eurytus died, he had left it to his son. Ulysses offered a sword and a spear in exchange, and a close friendship began between them. They never had the pleasure of visiting one another at home, however. Jove's son killed Iphitus before either visit could happen. So the bow had stayed with Ulysses as a gift to remember a dear friend by. While he lived at home he used it. When he sailed away to Troy, he did not take it with him. He left that keepsake in the house.
            Now Penelope came to the storeroom's oak threshold. The carpenter had carefully planed the wood and stretched a line along it to make it truly straight. Into that threshold he had fitted the posts, and on them he had hung the doors. Penelope loosened the strap attached to the handle. She inserted the key and pushed it straight in, sliding back the bolts that held the doors shut. They swung open with a noise like a bull bellowing in a meadow.
            Inside was a raised platform where the storage chests stood. Those chests held lovely linen and clothing, laid away with fragrant herbs. Penelope stepped up and reached from there to the peg where the bow hung inside its case. She lifted it down and sat with it across her knees. As she slipped the bow out, she wept bitterly. Only after her tears had brought her some relief did she go to face the suitors. She carried the bow and the quiver, with its many deadly arrows still inside. Behind her the maids carried a chest full of bronze and iron things her husband had won as prizes. In the cloister she stood beside a pillar that carried the roof. She held a veil in front of her face, with one maid standing to each side, and addressed the men.
        - id: ch01-b02
          speaker: penelope
          text: >-
            Listen, all of you who seek to marry me. My husband has been away a long time, and you've used that absence to abuse this house's welcome. Your only excuse is that you want me for a wife. Very well. If that is the prize you're competing for, here is Ulysses' powerful bow. The man who strings it most easily and sends an arrow through each of twelve axes shall have me follow him. I'll leave my lawful husband's fine house with all its wealth. Even then, I know it will come back to me in my dreams.
        - id: ch01-b03
          speaker: narrator
          text: >-
            She told Eumaeus to set the bow and the iron before the men. He took them from her in tears. Nearby, the stockman also wept at the sight of his master's bow. Antinous began to scold them.
        - id: ch01-b04
          speaker: antinous
          text: >-
            You pair of country fools! Haven't you the sense to stop crying? Your mistress has grief enough over her husband. Why add to it? Sit down and eat without a sound, or go outside if you have to weep. Leave the bow here. We suitors must put all our strength into this contest. Stringing a bow like that won't be easy. None of us is another Ulysses. I saw him myself, and I still remember him, though I was a child then.
        - id: ch01-b05
          speaker: narrator
          text: >-
            That was what Antinous said. In his own mind he expected to string the bow and shoot through the iron. Instead, he would be the first to feel an arrow from Ulysses' hand. He had dishonoured Ulysses in his own home and urged the others to do the same. Now Telemachus spoke.
        - id: ch01-b06
          speaker: telemachus
          text: >-
            Great gods, Jove must have taken away my wits! My dear mother, the best of women, says she'll leave this house and marry again. Yet here I am laughing and enjoying myself, as though nothing had happened. Still, the contest is settled, so let's begin. You are competing for a woman whose equal you won't find in Pylos, Argos, Mycene, Ithaca, or the mainland. You all know that as well as I do. Why should I need to praise her? Come, no excuses and no more delay. Let's find out who can string the bow. I'll try it too. If I can bend it and shoot through the iron, I won't let my mother go away with a stranger. Not if I can win the prizes my father won before me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Telemachus sprang up from the place where he had been sitting. He threw his crimson cloak aside and lifted the sword off his shoulder. Before trying the bow, he had to place the axes. He dug a long channel in the earth and stretched a line along it to keep it straight. Then he set the axes in that channel, one after another in a row. He stamped down the soil round each one to make it firm. Everyone watching was surprised at how neatly he had arranged them. He had never even seen anyone set up this kind of trial before.
            With the axes ready, he moved onto the stone paving and took the bow. He pulled as hard as he could, trying to draw the string into place. Three separate times he made the attempt, and each time he had to stop, although he hoped to string it and send an arrow through the iron. On the fourth attempt he would have succeeded. His father saw it and gave a sign to hold him back. Eager as he was, Telemachus obeyed.
        - id: ch01-b08
          speaker: telemachus
          text: >-
            Ah, perhaps I'll always be weak and useless. Or perhaps I'm simply too young, and not yet strong enough to defend myself against an attacker. Let the rest of you try. You're stronger than I am. Settle the contest among yourselves.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He leaned the bow against the door into the house, with the arrow resting upright at its tip. Then he returned to his seat. Antinous gave the order for the trials.
        - id: ch01-b10
          speaker: antinous
          text: >-
            We'll go one at a time towards the right. Start where the cupbearer begins when he brings the wine round.
    - id: ch02
      title: "The two faithful herdsmen"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The men agreed. Leiodes, son of Oenops, rose first. He served as their sacrificing priest and sat in a corner beside the mixing bowl. He alone hated the suitors' wrongdoing and felt anger at the others. Now he picked up the bow and arrow and stepped onto the paving. But his hands were weak, unused to heavy work. They soon tired, and he could not bend the bow.
        - id: ch02-b02
          speaker: leiodes
          text: >-
            Friends, I can't do it. Let another man take his turn. This bow will rob many a chief here of life and spirit. Better to die than live after losing the prize we've struggled for, the prize that has kept us together all this time. Even now, someone here is hoping and praying to marry Penelope. But once he's seen this bow and tried it, let him seek another wife and offer wedding gifts elsewhere. Let Penelope go to the man who offers most and is destined to win her.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Leiodes put the bow against the door again and stood the arrow at its tip. He went back to his chair. Antinous rebuked him.
        - id: ch02-b04
          speaker: antinous
          text: >-
            Leiodes, what an outrageous thing to say! I can't listen to such nonsense without anger. Because you can't bend the bow, it must cost many of us our lives? You were never made to be an archer, that's plain. Other men will soon get the string on. Melanthius, be quick. Make a fire in the court and put a seat beside it with a sheepskin over it. Fetch a large lump of lard from the house. We'll warm the bow and rub it with grease, then try once more and finish this competition.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Melanthius lit the fire. He placed a seat covered with sheepskins beside it and brought a large lump of lard. The suitors warmed the bow and tried again. Not one came near having enough strength. Antinous and Eurymachus had still to try. Those two were the leaders, far ahead of the others.
            Eumaeus and Philoetius now left the cloister together. Ulysses followed. Beyond the outer court and its gates, he spoke to them quietly.
        - id: ch02-b06
          speaker: odysseus
          text: >-
            Herdsman, and you, swineherd, there's something I hardly know whether to say. But I think I will. Suppose a god suddenly brought Ulysses back here. How would you stand with him? Tell me honestly. Would you fight for the suitors, or would you help Ulysses?
        - id: ch02-b07
          speaker: philoetius
          text: >-
            Father Jove, if only you would grant that! If a god brought my master home, you'd see me fight for him with every bit of strength I have.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Eumaeus made the same prayer to all the gods. Ulysses was certain now of what both men felt.
        - id: ch02-b09
          speaker: odysseus
          text: >-
            I am Ulysses. I'm here before you. I've suffered much, but in the twentieth year I've reached my own land again. Of all my servants, only you two have shown you're glad I should return. I haven't heard anyone else praying for me to come back. So I'll tell you what will happen. If the gods give the suitors into my hands, I'll find a wife for each of you. I'll give you houses and land close to mine. You'll be friends and brothers to Telemachus in my eyes. And I'll give you proof, so you can be sure of who I am. Look at this scar. A boar's tusk tore my leg when I hunted on Mount Parnassus with the sons of Autolycus.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Ulysses drew back the rags covering the great scar and let the men see it. Both looked carefully at the mark. Once they had examined it thoroughly, they broke into tears around their master. Each embraced him. They kissed his head and his shoulders, and Ulysses answered their welcome by kissing their hands and faces. Their weeping might have lasted until the sun went down. He had to interrupt them and call them back to what they must do.
        - id: ch02-b11
          speaker: odysseus
          text: >-
            Enough tears. Someone might come out, see us, and tell the men inside. Don't go back together. I'll enter first, and you follow separately. Here's what we must agree. The suitors will try to keep me from the bow and quiver. Eumaeus, when you carry them round, put them directly in my hands. Tell the women to shut the doors of their rooms. Even if they hear cries and the noise of men fighting in the house, they mustn't come out. They must stay quietly at their work. Philoetius, your task is to fasten the outer gates. Tie them shut securely, and do it at once.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Ulysses returned to the house and sat in the place he had left. Before long, the two servants came in after him.
    - id: ch03
      title: "A request to try"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Eurymachus was holding the bow by the fire, warming it. Still he couldn't fit the string. He was deeply troubled and let out a heavy sigh.
        - id: ch03-b02
          speaker: eurymachus
          text: >-
            I'm sorry for myself and for all of us. Losing the marriage hurts, but not nearly as much as something else. There are plenty of women in Ithaca and beyond. What shames me is how far below Ulysses we are in strength. We can't even string his bow. People who aren't born yet will hear of our disgrace.
        - id: ch03-b03
          speaker: antinous
          text: >-
            You know that won't happen, Eurymachus. Today the whole country is celebrating Apollo. Who can string a bow on his feast day? Put it aside for now. Leave the axes where they stand. Nobody's likely to come here and steal them. Bring the cups round, and we'll pour our offerings and let the bow rest. Tomorrow Melanthius can bring his finest goats. We'll burn their thigh bones for Apollo, the mighty archer, and try again. That will settle the contest.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The others approved. Male servants poured water for their hands. The pages filled the mixing bowls with wine and water, then served each man his offering and passed the wine round. When all had made their offerings and drunk as much as they wished, Ulysses spoke with careful cunning.
        - id: ch03-b05
          speaker: odysseus
          text: >-
            Men who court this famous queen, please hear what I have in mind. Especially you, Eurymachus, and Antinous, who has just spoken so reasonably. Stop the shooting for today and leave it with the gods. Tomorrow let heaven choose the winner. But for now, lend me the bow. I'd like to test my hands before you all. Have they kept their old strength, or have wandering and hard living used it up?
        - id: ch03-b06
          speaker: narrator
          text: >-
            His request angered them all. They were afraid he might succeed. Antinous attacked him with fierce words.
        - id: ch03-b07
          speaker: antinous
          emotion: angry
          text: >-
            Miserable fool, haven't you any sense at all? You should count yourself fortunate. You eat unharmed beside your betters. You get portions as large as ours, and we even let you listen to our private talk. No other beggar or wandering stranger has had that privilege. The wine must have turned your head. That's what happens when a man drinks too much. Wine drove the Centaur Eurytion mad when he visited Peirithous among the Lapithae. Once it took hold of him, he committed wicked acts in his host's own house. The heroes there were furious. They rushed at him, cut off his ears and nostrils, and dragged him out through the door. Away he went, crazed and senseless, carrying the punishment for his crime. From that time humans and centaurs were at war. His own drunkenness had brought it on him. So listen to my warning. If you string this bow, you'll suffer badly. No one here will show you mercy. We'll put you aboard a ship immediately and send you to Echetus, the king who kills anyone who comes near him. You won't get away alive. Drink quietly, and stop picking a fight with men younger than yourself.
        - id: ch03-b08
          speaker: penelope
          text: >-
            Antinous, a guest of Telemachus has a right to decent treatment in this house. Suppose this man is strong enough to bend Ulysses' bow. Do you really imagine he'll lead me home and make me his wife? He can't imagine that himself. None of you should let such an absurd fear spoil his meal.
        - id: ch03-b09
          speaker: eurymachus
          text: >-
            Queen Penelope, we know he won't take you away. That can't happen. We fear what the common people will say, men and women among the Achaeans who like to spread talk. I can hear a gossip saying something like this.
        - id: ch03-b10
          speaker: hypothetical_gossip
          text: >-
            What weaklings those suitors are! They wanted a brave man's wife, yet none could put the string on his bow. Then a ragged beggar came into the house, bent it at once, and shot through all the iron.
        - id: ch03-b11
          speaker: eurymachus
          text: >-
            That's the tale people will tell. We'll never escape the shame of it.
        - id: ch03-b12
          speaker: penelope
          text: >-
            Eurymachus, men who keep eating away a great chief's wealth and dishonouring his home can't expect a good name. Why worry about that particular talk? This stranger looks strong and well made. He says he's nobly born too. Hand him the bow and let him try. Here's a promise I'll keep. If Apollo grants him the honour of stringing it, I'll give him a good cloak and shirt that will last. He'll have a javelin to fend off dogs and robbers, a sharp sword, and sandals. I'll also have him taken safely wherever he wants to go.
        - id: ch03-b13
          speaker: telemachus
          text: >-
            Mother, nobody in Ithaca or the islands facing Elis has more right over this bow than I do. I'm the one who decides whether to let a man use it. No one can force my choice. I could even give the whole bow to the stranger and let him carry it away. Go indoors and tend your own work, the loom, the distaff, and your women. The bow belongs to the men's business, above all mine. I'm the master in this house.
    - id: ch04
      title: "The doors are closed"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Penelope went back into the house in wonder, keeping her son's words in her heart. She climbed the stairs to her room with her maids. There she mourned her dear husband until Minerva brought sweet sleep to her eyes.
            The swineherd lifted the bow to take it to Ulysses. Shouts came at him from every side of the cloister. One suitor threatened him.
        - id: ch04-b02
          speaker: suitor_threatening
          text: >-
            Idiot, where do you think you're carrying that bow? Are you mad? If Apollo and the gods hear our prayers, the hunting dogs you keep will corner you somewhere quiet and tear you to death.
        - id: ch04-b03
          speaker: narrator
          text: >-
            All that shouting frightened Eumaeus. He set the bow down where he stood. Across the cloister, Telemachus shouted a threat of his own.
        - id: ch04-b04
          speaker: telemachus
          text: >-
            Father Eumaeus, bring it on. Never mind those men. If you don't, young as I am, I'll throw stones at you all the way back to the country. I'm stronger than you. I only wish I were as much stronger than every suitor here. I'd send some of them away hurting soon enough. They mean us harm.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The suitors all laughed heartily. Their temper towards Telemachus softened. So Eumaeus carried the bow forward and put it into Ulysses' hands. Then he called Euryclea aside.
        - id: ch04-b06
          speaker: eumaeus
          text: >-
            Euryclea, Telemachus says the women's rooms must be shut. If they hear groans or a commotion that sounds like men fighting, they aren't to leave. Let them stay quiet and keep doing their work.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Euryclea obeyed and closed the doors of the women's quarters.
            Philoetius meanwhile made his way out quietly, without drawing attention. He fastened the gates that opened into the outer court. A cable used on a ship lay in the gatehouse, woven from papyrus fibre. He took that cable and bound the gates securely shut. Then he went indoors once more and sat in the same place he had occupied before. From his seat he kept watching Ulysses.
            Ulysses now held the bow. He turned it over and examined every part, checking whether worms had damaged its two horns while he was away. One suitor turned to his neighbour.
        - id: ch04-b08
          speaker: suitor_bow_observer
          text: >-
            This old fellow knows bows. Either he keeps one like it at home or he wants to build one. Look how skillfully the old tramp handles it.
        - id: ch04-b09
          speaker: suitor_bow_scoffer
          text: >-
            I hope he does as badly at everything else as I expect him to do at stringing that bow.
    - id: ch05
      title: "The arrow through twelve axes"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Ulysses had taken up the bow and turned it about, examining every part of it. When the examination was finished, he fitted the string with ease. A practiced singer takes a twisted gut string, winds it onto a fresh peg on his lyre, and secures the two ends. Ulysses strung the bow just as readily. He took it in his right hand to test the string. At his touch it gave a lovely note, clear and sweet as a swallow calling. The suitors heard that note. Alarm came over them and the colour left their faces. Just then Jove sent a great peal of thunder as a sign. Ulysses heard the omen from cunning Saturn's son, and his heart was glad.
            There was an arrow on the table, and he took that one. The arrows that the Achaeans would so soon be made to feel still lay within the quiver. Ulysses stayed seated. He laid the arrow against the middle of the bow, set its notch to the string, and drew both back towards himself. Then he sighted along his aim and released it. From the first axe onward, the arrow pierced each hole where a handle would go. Not one of the twelve stopped it. Through the whole row it flew, and on into the outer courtyard. Ulysses then turned his words to Telemachus.
        - id: ch05-b02
          speaker: odysseus
          text: >-
            Telemachus, your guest hasn't brought you shame. I hit the mark, and I didn't take long to string the bow. I still have strength, whatever the suitors may say to mock me. Now, while the daylight lasts, it's time for the Achaeans to prepare their supper. Afterwards they can enjoy songs and dancing. Those are the finest things to complete a feast.
        - id: ch05-b03
          speaker: narrator
          text: >-
            He gave a signal with his eyebrows. Telemachus fastened on his sword, took hold of his spear, and stood fully armed beside his father's chair.
