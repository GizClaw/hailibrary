audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "measured", pitch: "medium"}
    penelope:
      display_name: Penelope
      tts: {delivery: "thoughtful and controlled", timbre: "clear", pace: "measured", pitch: "medium"}
    antinous:
      display_name: Antinous
      tts: {delivery: "commanding and scornful", timbre: "full and edged", pace: "firm", pitch: "medium-low"}
    telemachus:
      display_name: Telemachus
      tts: {delivery: "direct and youthful", timbre: "clear and youthful", pace: "steady", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered", pace: "unhurried", pitch: "medium-low"}
  chapters:
    - id: ch01
      title: The first attempts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Penelope took the key upstairs to the locked storeroom. The suitors hadn't used up everything in there. Fine cloth and metal remained, with her husband's bow. Iphitus gave him that bow, which had belonged to his own father. They met in Messene. Odysseus was looking for sheep and shepherds taken from Ithaca. Iphitus was searching for lost mares. Odysseus gave him a sword and spear in return, and their friendship began. They never visited each other's homes. Heracles killed Iphitus, even though he'd received him as a guest, and took the mares. So Odysseus kept the bow as a memory of his friend. He left it home when he sailed to Troy. Penelope took the case off its peg and rested it on her knees, crying. When she could stand, she brought the bow and arrows into the hall. The men's talk stopped. Athena had prompted this contest, meaning it to destroy them.
        - id: ch01-b02
          speaker: penelope
          text: >-
            You've spent years asking me to choose a husband. Now I'll tell you how I will decide. String my husband's bow. Send an arrow through the twelve axes. If a man can do both, I'll leave with him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Eumaeus and Philoetius couldn't hold back their tears. Antinous told them not to upset their mistress. He said this wouldn't be an easy test, though he hoped he might win it. Telemachus arranged the axes in a straight line. He made sure they were secure and the openings lined up. Then he took the bow himself.
        - id: ch01-b04
          speaker: telemachus
          text: I'll have a turn too. If I can do what Father did, Mother won't need to go away with a stranger.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The first try got him nowhere. The second failed too, then the third. On his fourth attempt, the bow started to bend. His father looked straight at him. Telemachus relaxed his grip on the bow.
        - id: ch01-b06
          speaker: telemachus
          text: Well, I can't do it yet. I must need a few more years.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The others underestimated him again. Leiodes tried next. He carried out their sacrifices and alone disliked their misconduct. His hands weren't strong enough. He said this bow would take the life and heart out of many men. Better death than losing the marriage they had wanted so long. Antinous angrily told him not to judge everyone by his own weakness. He ordered a fire and fat. They warmed and rubbed the bow, but the others still couldn't bend it. Antinous and Eurymachus were the only ones left to try.
    - id: ch02
      title: Outside the courtyard
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            While the men in the hall watched the contest, Eumaeus and Philoetius went outside. Odysseus followed them. Only when they were beyond the courtyard gates did he ask his question.
        - id: ch02-b02
          speaker: odysseus
          text: If Odysseus walked in today, which side would you choose? His, or theirs?
        - id: ch02-b03
          speaker: narrator
          text: >-
            Philoetius prayed that Zeus would let that happen. Eumaeus was just as eager to see his master. Neither man had to think about the answer.
        - id: ch02-b04
          speaker: odysseus
          text: >-
            Look at me. I'm Odysseus, home after twenty years. Only you have prayed for me to return. If the gods give me victory, I'll find you wives and give you houses and land near mine. You'll be brothers and friends to Telemachus.
        - id: ch02-b05
          speaker: narrator
          text: >-
            They stared at the aged face above the rags. Odysseus pulled the clothes aside and showed them his scar. They knew the story of that wound. Both men came to him, holding him and crying. For a moment he stayed in their arms, then drew away.
        - id: ch02-b06
          speaker: odysseus
          text: We must go in. Anyone could come out and find us here.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Now Eumaeus must bring him the bow, however much the suitors protested. He must ask Euryclea to shut the women in their rooms. Even cries or fighting were no reason to open the doors. Philoetius must fasten the courtyard gates. They returned one at a time. Odysseus sat by the entrance again. The men inside didn't know what the three had agreed.
    - id: ch03
      title: The guest asks for a turn
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Eurymachus was now struggling with the bow. Even warming it didn't help. He had to stop. There were other women to marry, but what angered him most was the story people would tell. None of them could match a man who hadn't been here for years. Antinous came up with a way for everyone to put an end to the attempts.
        - id: ch03-b02
          speaker: antinous
          text: We're celebrating Apollo today. This isn't the time for shooting contests. Leave everything ready. We'll make our offerings and have another go tomorrow.
        - id: ch03-b03
          speaker: narrator
          text: The men liked that. They had more wine and prepared to enjoy the rest of the afternoon. Then the stranger spoke.
        - id: ch03-b04
          speaker: odysseus
          text: Before you put it away, could I try? I'd like to find out whether my hands still have any strength.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Everyone shouted at once. Antinous said the guest was drunk and should be content with his food. He recalled the centaur Eurytion. Drunk at Peirithous's house, he went wild, and they cut his ears and nose off and dragged him out. If the beggar bent the bow, they would send him to Echetus. He wouldn't leave alive. The queen interrupted.
        - id: ch03-b06
          speaker: penelope
          text: He's here as my son's guest. Give him a chance. He knows this doesn't mean he gets to marry me.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Eurymachus admitted what bothered them. Suppose people heard that the suitors had all failed, and a beggar had succeeded. That would be a story they could never escape.
        - id: ch03-b08
          speaker: penelope
          text: >-
            People know you live on someone else's food. Why worry about gossip now? Let him try. If he succeeds, I'll give him clothes, shoes, a sword and spear, and a safe journey wherever he chooses.
        - id: ch03-b09
          speaker: telemachus
          text: It's our bow. I decide who gets to use it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            He told his mother to go back to her loom and servants. Bows were men's business, especially his, since he was master here. Surprised at his firmness, she went upstairs with the women. She cried for her husband until Athena let her sleep.
    - id: ch04
      title: The string sounds
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Eumaeus lifted the bow. The men wished his own hunting dogs would tear him apart. Afraid, he put it down.
        - id: ch04-b02
          speaker: telemachus
          text: >-
            Take it to him! Or I'll throw stones at you all the way back to the country. If I were as strong against these men as I am against you, they'd suffer for it.
        - id: ch04-b03
          speaker: narrator
          text: |-
            The men laughed, and their anger at Telemachus eased. Eumaeus put the bow into the guest's hands, then went to the nurse with his message. Philoetius slipped outside and tied the gates shut with rope. Back in his seat, he watched Odysseus.

            Odysseus slowly turned the bow over, looking for damage. That made the suitors joke again. Did he make bows himself? Did he want a model to copy?

            He gave no answer. He remembered exactly how this wood felt. He bent the bow and fitted the string without hauling at it as they had done.
        - id: ch04-b04
          speaker: narrator
          text: |-
            He tested the string with his finger.

            It gave a clear call, like a swallow in the hall.

            The men went pale. Thunder sounded outside, and Odysseus took it as a welcome sign. Still in his chair, he picked up the arrow lying on the table and drew the string.

            The arrow passed through all twelve openings. Nobody moved for a moment.
        - id: ch04-b05
          speaker: odysseus
          text: >-
            Telemachus, I haven't let you down. There's strength in these hands yet. It's still light. Let the men get supper ready. Then they can sing and dance.
        - id: ch04-b06
          speaker: narrator
          text: >-
            At his father's small signal, Telemachus collected his sword and spear. He took his place beside the chair.
        - id: ch04-b07
          speaker: narrator
          text: Odysseus held his own bow again.
