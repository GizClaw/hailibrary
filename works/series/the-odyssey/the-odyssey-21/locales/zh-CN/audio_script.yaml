audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "颐指气使而轻蔑", timbre: "浑厚带锋芒", pace: "果断", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    leiodes:
      display_name: 雷奥德斯
      tts: {delivery: "谨慎而诚恳", timbre: "轻而清晰", pace: "平缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: "谁能张开弓"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            佩涅洛佩拿上钥匙，领着侍女去了储藏室。用丈夫留下的弓来比试，是雅典娜让她想到的。女神要借这个机会杀掉求婚人。

            这弓原来是朋友伊菲托斯送给奥德修斯的。当年，伊萨卡的羊被抢走，牧人也被掳去，奥德修斯到墨塞涅追讨。伊菲托斯则来找丢失的母马，两人就这样认识了。伊菲托斯把父亲留下的弓送给他，换来一把剑和一支矛。他们还没去对方家里作过客，赫拉克勒斯就杀了到自己家作客的伊菲托斯，把母马留给自己。奥德修斯很珍惜这弓，一直留在家里，出征也没有带走。

            王后取下弓匣，抱在膝上哭了一阵，才拿着弓和箭走进大厅。
        - id: ch01-b02
          speaker: penelope
          text: "既然非要我再嫁，就来试。谁能张开这弓，一箭穿过十二个斧孔，我就跟他离家。"
        - id: ch01-b03
          speaker: narrator
          text: >-
            欧迈奥斯和菲洛伊提奥斯一见主人的弓，就掉下泪来。安提诺奥斯骂他们，说别再让王后伤心了，叫他们不许哭。他嘴上说弓难张开，心里却觉得自己能赢。

            忒勒马科斯把斧头排成一条直线，压稳斧柄，让孔一个对着一个。众人没想到他能摆得这样整齐。他还要亲自试一试。
        - id: ch01-b04
          speaker: telemachus
          text: "我也来。若能拉开父亲的弓，把箭射过去，母亲就不必跟陌生人走了。"
        - id: ch01-b05
          speaker: narrator
          text: >-
            三次都没张开。到第四次，弓身开始弯下去，父亲却递眼色。他立刻停手，装作力气还不够，把弓让给求婚人。雷奥德斯先试。他主持这群人的祭礼，也只有他看不惯同伴的恶行，可手上没有力气，很快就败了。
        - id: ch01-b06
          speaker: leiodes
          text: "这弓恐怕要让好些人丢命。为了娶她，我们等了这么多年，最后要是白等，还不如死了。"
        - id: ch01-b07
          speaker: narrator
          text: "安提诺奥斯生气地骂他，自己做不到，凭什么说别人也做不到？他叫人升起火，拿来油脂，把弓烘暖，再抹上油。可男人们试了一个又一个，还是都失败了，最后只剩他和欧律马科斯没试。"
    - id: ch02
      title: "院门外的旧疤"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            两名牧人离开大厅，奥德修斯跟着他们走到院门外。他问，主人若现在回来，两人会帮主人，还是帮求婚人？牛倌立即向宙斯祈祷，盼主人真能回来，牧猪人也有同样的心愿。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            我就是奥德修斯。二十年了，我终于回家。还盼着我的，只有你们。神要是让我打赢，我就替你们娶妻，把我家附近的屋子和土地分给你们。你们就像忒勒马科斯的兄弟，也是他的朋友。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他掀起破衣，露出腿上的疤。两人都知道他是怎么受的伤，这才扑上来抱住他，哭着不肯松手。过了一会儿，他让两人别再哭了，怕有人出来看见，把相认的消息传进屋里。

            眼下，他得靠两人帮忙。求婚人肯定不愿把弓给他，欧迈奥斯无论听到什么叫骂，都得亲手送过来。随后还要告诉乳母，关好女仆的房门，听见打斗和呻吟，也不准出来。菲洛伊提奥斯则要把外面的院门拴紧。

            三人分开回了大厅，奥德修斯仍坐在门边。求婚人还不知道院外发生了什么。
    - id: ch03
      title: "客人也要试"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            欧律马科斯又烘又拉，仍张不开弓。娶不到王后，还可以娶别人，最丢脸的是，他们竟全不及奥德修斯，往后少不了耻笑。安提诺奥斯替大家找出一个停手的理由。
        - id: ch03-b02
          speaker: antinous
          text: "今天祭阿波罗，不该比箭。斧头先留着吧。现在献酒，等明天祭过神再来试。"
        - id: ch03-b03
          speaker: narrator
          text: "众人乐得停下，又喝起酒。老人却在这时提出请求。"
        - id: ch03-b04
          speaker: odysseus
          text: "给我也试一回。我想看看，这么多年，两只手还有没有以前的力气。"
        - id: ch03-b05
          speaker: narrator
          text: >-
            安提诺奥斯骂他喝多了，又讲起半人马欧律提翁的事。欧律提翁在庇里托奥斯家喝醉发狂，让人割掉耳朵和鼻子，拖出了门。老人若真张开弓，他们就送他去厄刻托斯王那里，别想活着回来。

            王后不准他们这样对待儿子的客人。老人自己也知道，就算试成了，王后也不会嫁给他。欧律马科斯解释，他们怕外面传闲话，所有求婚人都拉不开的弓，竟让一个流浪乞丐拉开了。
        - id: ch03-b06
          speaker: penelope
          text: >-
            你们整天花别人家的东西，外头难道不知道？这会儿还怕人议论？把弓给他。要是拉开了，我给他衣服、鞋子，还有剑和矛，再送他平安到他想去的地方。
        - id: ch03-b07
          speaker: narrator
          text: >-
            儿子说，弓交给谁由他决定。他叫母亲回去管织机、女仆，这是男人的事，自己又是主人，更该自己管。母亲惊讶于他的坚决，把话记住，带侍女上楼。她为丈夫哭，直到雅典娜送来睡意。
    - id: ch04
      title: "弓弦响了"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "欧迈奥斯拿起弓，众人就咒他，愿他被自家的猎狗咬死。他怕了，放下弓。忒勒马科斯却高声命令。"
        - id: ch04-b02
          speaker: telemachus
          text: "送过去！不然我拿石头把你一路砸回乡下。要对他们也有对你这份力气，我早让他们受苦了。"
        - id: ch04-b03
          speaker: narrator
          text: |-
            众人哈哈笑，对少主反倒和气些。牧猪人把弓交到客人手里，再去找乳母传话。牛倌悄悄出去，用绳索拴紧院门，回来望着奥德修斯。

            奥德修斯翻看弓身，看看哪儿坏了没有。旁人又笑他，也许是个做弓的匠人，想照样造一张。

            他没回答。

            他轻松弯好弓，装上弦，再用指头拨了一下。

            弦响得清亮，像燕子的叫声。

            求婚人脸色变了。外面响雷，他听出这是好兆头。他还坐着，从桌上拿起箭，搭上弦，拉开了弓。

            箭穿过十二个斧孔。
        - id: ch04-b04
          speaker: odysseus
          text: "忒勒马科斯，这客人没叫你丢脸吧？手上力气还在。天还亮，叫大家准备晚饭，再唱歌跳舞。"
        - id: ch04-b05
          speaker: narrator
          text: "他稍一示意，儿子便佩上剑，拿好长矛，站到父亲椅子旁。"
        - id: ch04-b06
          speaker: narrator
          text: "弓又回到了主人手上。"
