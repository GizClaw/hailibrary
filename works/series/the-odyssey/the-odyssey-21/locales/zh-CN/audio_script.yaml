audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "颐指气使而轻蔑", timbre: "浑厚带锋芒", pace: "果断", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 儿子先试
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            佩涅洛佩拿钥匙，带着侍女往储藏室走。雅典娜使她想到试弓，要用这个办法毁灭求婚人。那弓原是伊菲托斯的父亲留下的，后来送给了奥德修斯。两人在墨塞涅相识，一个在找失去的母马，一个在找从伊萨卡被掳走的羊和牧人。奥德修斯拿剑和矛回赠，两人做了朋友，却没能去彼此家里。赫拉克勒斯后来竟杀了来作客的伊菲托斯，把马留给自己。这张弓，奥德修斯一直当朋友的纪念，去特洛伊也没有带走。王后开锁拿出弓匣，放在膝上哭，等能起身了，才带弓箭到厅里。
        - id: ch01-b02
          speaker: penelope
          text: 你们一定要我选个人嫁。那就来试。能拉开这张弓，一箭穿过十二个斧孔的人，我就随他离开。
        - id: ch01-b03
          speaker: narrator
          text: >-
            欧迈奥斯和菲洛伊提奥斯看着主人的旧弓，都忍不住掉泪。安提诺奥斯叫他们别再让女主人难受。他说这事不容易，心里却觉得自己也许能赢。忒勒马科斯先去摆斧头。他把斧柄固定好，把孔排成一条直线。旁人没想到他会弄得这么整齐。
        - id: ch01-b04
          speaker: telemachus
          text: "我也试。若能做到父亲做到的，母亲就不必跟陌生人走。"
        - id: ch01-b05
          speaker: narrator
          text: >-
            忒勒马科斯用力拉，没成。第二回，第三回，弓还不肯弯。他仍不愿放，重新调好姿势，又试第四回。这一下，弓身终于开始屈下去。就在他将要成功时，父亲递了个眼色。年轻人立刻听懂，把手松开，没再继续。
        - id: ch01-b06
          speaker: telemachus
          text: 我的力气看来还不够。
        - id: ch01-b07
          speaker: narrator
          text: >-
            主持祭礼的雷奥德斯先试。他独自不喜欢求婚人的恶行，可手上没力气。他说，这弓会夺掉许多人的生命和心气，苦求多年的婚事落空，还不如死去。安提诺奥斯怒斥，自己不行，不能算大家都不行。他让人升火拿油脂，烘暖弓，抹上油，可试过的人仍拉不开，只剩他和欧律马科斯还没试。
    - id: ch02
      title: 门外相认
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            欧迈奥斯和菲洛伊提奥斯离开大厅，奥德修斯跟过去。直到出了院门，他才问，若主人此刻归来，两人会帮主人，还是帮屋里那群人？牛倌毫不迟疑地祈求宙斯，盼主人真能出现，到时自己会出力相助。牧猪人也向神说了同样的愿望。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            看看我，我就是奥德修斯，二十年才到家。只有你们盼我归来。神若让我赢，我会找妻子给你们，分房屋和地，就在我家附近。你们会是忒勒马科斯的兄弟朋友。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他露出腿上的伤疤。两人都知道那道疤的来历，一起扑来抱住他，哭得不愿放手。奥德修斯让他们哭了一会儿，就把两人轻轻推开。
        - id: ch02-b04
          speaker: odysseus
          text: 别让人看见。万一有人出来，秘密就保不住了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            眼下的事他要两人帮忙。欧迈奥斯须亲手送弓来，求婚人再骂也不能退，又须告诉乳母，把女仆留在关好的门内，听见争斗和呻吟也不准出。菲洛伊提奥斯要去闩牢外面的院门。三个人不是一起进屋，而是各走各的。奥德修斯坐回原来门边的位置，屋里人没看出什么变化，不知道他们刚才已经定好安排。
    - id: ch03
      title: 客人也要试弓
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            欧律马科斯烘弓，再用力拉，最终还是只能放下。他心里难受，不只是因为娶不到王后。别的女人也能娶，可别人会一直记住，这么多求婚人，力气竟全不及奥德修斯。安提诺奥斯这时提了个办法，给大家停手的理由。
        - id: ch03-b02
          speaker: antinous
          text: 今天祭阿波罗，不该在今天比箭。斧头不用收。等献了祭，明天再比。
        - id: ch03-b03
          speaker: narrator
          text: "大家乐意听这主意，酒重新斟好，像是能先把比输的事放在旁边。门边那个客人却开口请求。"
        - id: ch03-b04
          speaker: odysseus
          text: 暂时别把弓拿走。给我试试，看看这些年过来，手上还有没有力气。
        - id: ch03-b05
          speaker: narrator
          text: >-
            安提诺奥斯骂他酒喝多了，吃饱还想比。他拿半人马欧律提翁做例子。那人在庇里托奥斯家醉酒发狂，被人割去耳鼻，拖到门外。乞丐真拉开弓，就送到厄刻托斯王那里，再也别想活回来。佩涅洛佩护着客人，说他又不以为会娶她，试试有什么？欧律马科斯怕别人传，所有求婚人输给了一个乞丐。
        - id: ch03-b06
          speaker: penelope
          text: >-
            外头谁不知道你们吃别人家的东西？现在才怕议论？让他试，真成功了，我给衣服鞋子，给剑和矛，送他安全去他想去的地方。
        - id: ch03-b07
          speaker: telemachus
          text: 弓属于我家，交给谁由我说了算。
        - id: ch03-b08
          speaker: narrator
          text: >-
            他让母亲回去管织机和女仆，弓是男人的事，自己是主人，更该由自己管。王后把儿子的话记住，带女仆上楼，哭着思念丈夫，直到雅典娜让她睡着。
    - id: ch04
      title: 箭穿过斧孔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "欧迈奥斯拿起弓，求婚人就咒他被自己的猎狗咬死。他怕了，把弓搁下。"
        - id: ch04-b02
          speaker: telemachus
          text: >-
            送过去！不然我用石头一路砸你回乡下。我对他们要有对你这么大的力气，早让他们好受了。
        - id: ch04-b03
          speaker: narrator
          text: |-
            众人哈哈大笑，对忒勒马科斯的态度倒缓和些。欧迈奥斯把弓送到老人身边，放在他手上，再去找欧律克勒娅，传达刚才说定的关门安排。菲洛伊提奥斯则悄悄出去，用绳索拴紧院门，回来继续守着门边的客人。

            奥德修斯把弓慢慢翻转，仔细看有没有损坏。求婚人又笑他，也许他是造弓的，想照样子学着做一张。

            他没有回答。

            木头在手里的感觉，他一直记着。他弯好弓，把弦装上，不必像他们那样苦苦用力。
        - id: ch04-b04
          speaker: narrator
          text: |-
            他用手指试了一下弦。

            一声清脆的响音，像燕子叫，传进大厅。

            求婚人脸色变了，外面也响起雷。奥德修斯认作好兆头，仍坐在椅上，拿起桌上的一支箭，搭弦拉弓。

            箭穿过了十二个孔。
        - id: ch04-b05
          speaker: odysseus
          text: >-
            忒勒马科斯，我没给你丢脸，手上的力气还在。天还亮，叫他们准备晚饭吧，然后再唱歌跳舞。
        - id: ch04-b06
          speaker: narrator
          text: "父亲朝儿子作了个小小的示意。忒勒马科斯拿起长矛，佩好剑，不再坐原来的位置，走到父亲椅子旁站着。"
        - id: ch04-b07
          speaker: narrator
          text: 那张离家时留下的弓，终于又让原来的主人奥德修斯握在了手里。
