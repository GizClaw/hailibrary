audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "诚恳热心", timbre: "粗粝温厚", pace: "从容", pitch: "低音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "颐指气使而轻蔑", timbre: "浑厚带锋芒", pace: "果断", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    leiodes:
      display_name: 勒奥得斯
      tts: {delivery: "思虑而克制", timbre: "柔和微哑", pace: "沉稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    philoetius:
      display_name: 菲洛伊提奥斯
      tts: {delivery: "忠实坦率", timbre: "浑圆而有风霜感", pace: "稳重", pitch: "低音"}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    hypothetical_gossip:
      display_name: 设想中的议论者
      tts: {delivery: "直白嘲弄", timbre: "明亮清晰", pace: "轻快", pitch: "中音"}
    suitor_threatening:
      display_name: 恐吓牧猪人的求婚人
      tts: {delivery: "强硬轻蔑", timbre: "粗重", pace: "急促", pitch: "中低音"}
    suitor_bow_observer:
      display_name: 议论弓的求婚人
      tts: {delivery: "好奇而嘲弄", timbre: "清楚", pace: "平稳", pitch: "中音"}
    suitor_bow_scoffer:
      display_name: 嘲弄试弓的求婚人
      tts: {delivery: "冷淡轻慢", timbre: "粗哑", pace: "从容", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "取出旧弓"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            雅典娜让佩涅洛佩决定，把弓和铁斧拿出来，让求婚人争个高下，也借此送他们走向死亡。王后上楼取了青铜钥匙，钥匙柄是象牙的。女仆陪着她，到宅子末端的储藏室。丈夫的金、铜、锻铁宝物存在那里，弓也在，箭囊中装满足以致命的箭。
            弓是朋友所赠，那人是奥德修斯在拉刻代蒙结识的伊菲托斯，欧律托斯的儿子。两人在墨塞涅、奥尔提洛科斯家里相遇。奥德修斯去那里，是找全体墨塞涅人讨还债。那些人从伊萨卡抢走三百只羊，还把牧人也一起掳上船。所以父亲和其他首领让年轻的奥德修斯远行一趟，追回人和羊。伊菲托斯也为丢失的牲畜而来，十二匹种用母马，身边还有骡驹。
            寻马却寻出一场杀身灾。他去宙斯之子赫拉克勒斯家，这位大力士做过许多惊人的勇武壮举，偏偏又做了可耻的事。伊菲托斯是他的客人，他既不畏惧神惩罚，也不敬重自己摆给客人的饭桌，竟把人杀掉，母马留了下来。伊菲托斯正是寻马时碰见奥德修斯，把父亲常用、死后传给自己的弓送他。奥德修斯回送剑和矛，两人由此结成好友。可尚未来得及到彼此家里做客，伊菲托斯就被赫拉克勒斯杀死。奥德修斯留在家时用这弓，去特洛伊却没有带，珍藏着当朋友的纪念。
            佩涅洛佩走到储藏室的橡木门槛前。这门槛当年经过木匠细细刨过，他还拉起墨线，对得笔直，才往里面安门柱，把门挂上去。她解掉门把上的皮带，把钥匙往锁里伸，直直推到头，关门的闩便退开了。两扇门响着打开，声音好比草场有头公牛正在吼叫。屋内有片高起来的地方，上面排着箱子。上好亚麻布和衣裳就存在箱内，同芳香草叶放在一起。她踩上高处，够到悬挂弓的木钉，把弓连套一同取下，放到自己膝上，坐着抽出弓来，眼泪止不住往下落。痛哭使悲伤缓和些以后，她才拿起这弓，还有装着许多致命利箭的箭囊，去见廊里的求婚人。女仆跟在她后面，合力抬一口箱，箱内是丈夫从前赢来的奖品，铜的铁的都有许多。她面对众人站定，就在那根撑屋顶的柱旁，把面纱挡在脸前，两边各站着一个女仆，随后开始说话。
        - id: ch01-b02
          speaker: penelope
          text: >-
            各位听着，你们欺这家的主人走得久，不断糟蹋我们待客的好意。嘴里说要娶我，再没有别的理由。你们要争这个奖，那就用奥德修斯的大弓来争。谁上弦最容易，一箭穿过十二把斧，我就随他走，离开亲夫这所好房子，留下这么多财物。可离开以后，恐怕梦里也还忘不了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            王后要欧迈奥斯把弓和铁器交给求婚人。他接过东西，便流下泪来。牧牛人在不远处，看见主人的弓，也忍不住哭。安提诺奥斯斥骂两人。
        - id: ch01-b04
          speaker: antinous
          text: >-
            两个乡下傻子，哭什么？主人丈夫没了，本就难受，你们还叫她更难受。闭嘴吃饭，要哭出去哭，弓得留下。我们还要拼尽力气争胜呢。这么厉害的弓，谁说能随便拉？这里有谁比得上奥德修斯？我虽在小时候见过他，样子可没忘。
        - id: ch01-b05
          speaker: narrator
          text: >-
            安提诺奥斯心里倒以为，能上弦、能穿铁斧的就是自己。可将来第一个被奥德修斯箭射中的，也是他。他在奥德修斯的家侮辱主人，还叫别人跟着干。忒勒马科斯这时发了话。
        - id: ch01-b06
          speaker: telemachus
          text: >-
            宙斯怕把我弄糊涂了！我那么好的母亲，亲爱的母亲，就要离家再嫁，我还这么快活，好像事情没发生。既然定下比赛，就开始。诸位，你们求的女子，在皮洛斯、阿尔戈斯、迈锡尼，在伊萨卡或大陆，可都找不到相当的。这用得着我夸吗？你们自己也知道。别借故拖了，轮流拉一拉，看看本领。我也试。如果我能做到父亲做过的事，张好弓，再射穿斧头，赢到他赢过的奖，我就不许母亲跟外人离开。
        - id: ch01-b07
          speaker: narrator
          text: >-
            说罢，他站起，甩开红披风，从肩上卸下剑。他挖一条长沟，拉墨线校好，逐把放斧头，再踩紧附近的土。这事他以前从没见过，却摆得这么齐，人人看着惊奇。到石板地上，他开始试弓。全身力气使上，三回拉，三回放弃，始终想着要张开、穿过斧头。第四回本来能成，父亲却一个眼色拦住他的热望。
        - id: ch01-b08
          speaker: telemachus
          text: >-
            唉，是我终归软弱，永远没用？还是现在小，尚未长成，人家打来，我还不能还手？你们力气比我大，接着试，把胜负分了吧。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他把弓靠在通内屋的门边，箭立在弓尖处，回到椅上。安提诺奥斯开口。
        - id: ch01-b10
          speaker: antinous
          text: >-
            从平时斟酒递杯的起点开始，向右一个接一个，按顺序来。
        - id: ch01-b11
          speaker: narrator
          text: >-
            大家应允。第一个是欧诺普斯的儿子勒奥得斯，求婚人的祭司。他常坐在调酒缸边的角落，只有他厌恶那些恶行，对其他人感到愤慨。他拿上弓箭站到石地上，却上不成弦，手又弱，又没干惯重活，一下就累了。
        - id: ch01-b12
          speaker: leiodes
          text: >-
            朋友们，换一个人吧，我张不开。这弓会要咱们不少首领的命，把魂也夺走。为个奖聚这么久，争这么久，拿不到以后，活着不如死。现在可能还有人祈求娶到佩涅洛佩。可等他看过、试过这张弓，就该去别家送聘礼，另选妻子了。王后让给礼物最丰厚、命里该赢的人吧。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他把弓和箭照原样放在门边，坐回去。安提诺奥斯责骂他。
        - id: ch01-b14
          speaker: antinous
          text: >-
            勒奥得斯，讲这荒谬话，听着就气人！你自己不会，咱们许多人就得给这弓弄死？我知道你不是做射手的料，可另有人马上就能办到。墨兰提奥斯，快生一堆院火，把座椅摆在旁边，铺羊皮。屋里拿大团猪油出来，烤热弓，抹油，再来一次，比赛就有结果了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            墨兰提奥斯照办，火和披羊皮的椅子齐了，油也取来。求婚人把弓暖过又试，力气却全差得远。还剩最出众的两个首领，安提诺奥斯、欧律马科斯，没有轮到。
    - id: ch02
      title: "伤疤为证"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            牧猪人、牧牛人一齐往外走，奥德修斯跟着。过了外院，再出大门，他压低声音问。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            你们两个牧人，我有件心事，原不知说不说，还是讲吧。假如神忽然送奥德修斯回来，你们肯怎么帮忙？站哪边，是他，还是那些求婚人？
        - id: ch02-b03
          speaker: philoetius
          text: >-
            宙斯父亲，但愿真有这一天！神把主人带来，我就拼命替他打，你会亲眼看见。
        - id: ch02-b04
          speaker: narrator
          text: >-
            欧迈奥斯也向众神许着同样的愿。奥德修斯确认了两人忠心，便说出身份。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            我就在这里，我是奥德修斯。二十年到了，受尽苦以后，总算回来。我家的仆人里面，只听你们两个愿我归来，其他人没谁这样祈祷。所以我把未来的事说定。只要上天许我解决求婚人，就给你俩找妻子，分房子和田地，靠近我的家。你们在我看来，就是忒勒马科斯的朋友、兄弟。再给你们确实的证据。看看这伤疤，帕尔纳索斯山上，我和奥托吕科斯的儿子们一起猎野猪，让它的獠牙划出来的。
        - id: ch02-b06
          speaker: narrator
          text: >-
            奥德修斯把身上的烂衣服掀开，那条很大的伤疤便显出来。两个人凑着仔细看，确认了以后，都围住主人落泪。他们把双臂搂在他身上，亲吻他的头和肩膀。奥德修斯也伸过去，亲他们的手和脸。这样彼此流泪，恐怕真能一直流到太阳落山，幸而主人开口把他们拦住。
        - id: ch02-b07
          speaker: odysseus
          text: >-
            眼泪先收住吧，万一有人从里面出来，看见，再告诉那些人，就不好了。回去也别结伴，我走前面，你们各自跟上。还有个约定，求婚人肯定拦我拿弓和箭。欧迈奥斯，你传的时候，就往我手里递。再叫女人们把自己房门锁好。听见打斗、呻吟、吵嚷也别出来，留在原来的地方，安静干活。菲洛伊提奥斯，你马上把外院大门关严，用绳子好好扎住。
        - id: ch02-b08
          speaker: narrator
          text: >-
            奥德修斯说完回屋，坐到刚才的位置。两个仆人随后也进去了。
    - id: ch03
      title: "外乡人想试弓"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            此时欧律马科斯正把弓放在火前烘，还是没能上弦。他心里难受，长长叹息。
        - id: ch03-b02
          speaker: eurymachus
          text: >-
            我为自己也为大家难过。娶不到她，是可惜，可别处、伊萨卡，女人多的是，那还不算最大伤心。叫人抬不起头的是力气，我们比奥德修斯差那么远，连他的弓都张不开！将来没出生的人，也会知道这丢人的事。
        - id: ch03-b03
          speaker: antinous
          text: >-
            欧律马科斯，你知道不会这样。今天全国庆祝阿波罗，节日里，谁能拉弓？今天先放下。斧就留着，没人会来家里偷。让斟酒人递杯，我们给神献酒，别管弓了。明日叫墨兰提奥斯送几只最好的山羊，烧腿骨给大射手阿波罗，再比，一定能比完。
        - id: ch03-b04
          speaker: narrator
          text: >-
            人人赞成，男仆给客人倒水洗手，侍童把水和酒兑好，装满调酒缸，先递各人的奠酒，然后满席斟送。神也敬过，酒也喝够，奥德修斯带着巧妙心思开口。
        - id: ch03-b05
          speaker: odysseus
          text: >-
            向这位声名远扬的王后求婚的各位，请听听我的心里话。我特别想请欧律马科斯听，也请安提诺奥斯听，他刚才讲得很有道理。射箭就暂时放一放，留给诸神决定。等到明早，上天愿谁得胜，就让谁得胜。不过此刻，还请把弓交我一试。我想当着你们的面，看看这双手还有多少力量，从前的力气是不是仍在，还是一路飘零、缺少照料，已经把它耗去了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            求婚人都怒了，因为怕他真能拉动。安提诺奥斯严厉地骂道。
        - id: ch03-b07
          speaker: antinous
          emotion: angry
          text: >-
            你这个没脑子的穷汉！在高贵的人中间好好吃饭，没人伤你，给你的也没少，还准你听我们讲话，多走运！别的流浪人可没有偷听私话的资格。肯定酒让你犯傻了，喝过头的人都这样。半人马欧律提翁到拉庇泰人那里，在庇里托奥斯家，便是吃酒吃昏了，疯疯癫癫做坏事。那里的英雄生气，扑上去，割他耳朵、鼻孔，再从门口拖出去。他带着罪行的苦果，糊涂着走了。从那以后，人类与半人马族开战，都是他贪杯自找。你也一样，真上了弦，就等着倒大霉。没人会救你，我们立刻送你出海，到厄刻托斯王那里。那王逢人便杀，去了你别想活着走。老实喝酒，别再招惹比你年轻的人。
        - id: ch03-b08
          speaker: penelope
          text: >-
            安提诺奥斯，儿子的客人来到我家，就不该受你这种对待。就算这人真张得开强弓，你以为我会做他妻子，跟去他家？连他也不会这么想。为这种不合道理的担心，毁了吃饭的兴致，何必？
        - id: ch03-b09
          speaker: eurymachus
          text: >-
            王后，我们当然没想过他娶你，这不可能。只是阿开亚那些低下男女喜欢传闲话。怕他们跑出去，就这样说。
        - id: ch03-b10
          speaker: hypothetical_gossip
          text: >-
            真是一群软骨头！求勇士的妻子，却没人张得了勇士的弓。穷乞丐一进门，倒一下拉好，一箭就穿过了斧头！
        - id: ch03-b11
          speaker: eurymachus
          text: >-
            人家会如此谈论，咱们名声就坏透了。
        - id: ch03-b12
          speaker: penelope
          text: >-
            欧律马科斯，你们耗着领袖的财产，坏人家的门风，还指望有好名声？哪用怕这一桩闲话。客人身子结实，又说自己是贵族出身。给他试，成不成都看得到。我说话算数，若阿波罗让他成功，我送好披风、好衣裳，都耐穿。再拿标枪，遇狗、遇贼能挡，还有快剑、凉鞋。他要去哪里，我都会送他平安去。
        - id: ch03-b13
          speaker: telemachus
          text: >-
            母亲，能定这弓给不给人的，只有我。伊萨卡和厄利斯对面那些岛上，谁都不能强迫。就是我要把弓全送他，让他拿走，也不准干涉。你回内屋去，管织布纺线，安排女仆的事。弓交给男人，尤其交给我，我是这家的主人。
        - id: ch03-b14
          speaker: narrator
          text: >-
            佩涅洛佩惊异地回屋，把这番话藏进心里。女仆陪她上楼，她回到自己的房间，又想丈夫、又落泪，直至雅典娜让她甜甜睡去。
    - id: ch04
      title: "弦响如燕鸣"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            欧迈奥斯拿起弓，要往奥德修斯那边送，廊里四面喊叫都冲着他。其中一个求婚人骂道。
        - id: ch04-b02
          speaker: suitor_threatening
          text: >-
            傻瓜，拿去哪儿？发疯了吧！但愿阿波罗和众神满足我们的心愿，让你自己的猎狗在僻静地方把你咬死！
        - id: ch04-b03
          speaker: narrator
          text: >-
            那片叫嚷把欧迈奥斯吓住，弓就地放下。回廊另一头，忒勒马科斯也对他大喊。
        - id: ch04-b04
          speaker: telemachus
          text: >-
            欧迈奥斯老伯，别理他们，送来！不然我年纪小，也比你强，会用石头把你一直打回乡下。我多想比这些求婚人也强出这么多！那我早把几个恶人打得苦不堪言，让他们滚了。
        - id: ch04-b05
          speaker: narrator
          text: >-
            求婚人倒全笑起来，对年轻主人的火气小了点。欧迈奥斯把弓拿过去，亲自放进奥德修斯手里，随后把乳母叫到旁边。
        - id: ch04-b06
          speaker: eumaeus
          text: >-
            欧律克勒娅，少主人要你关好女眷房门。里面女人听到呻吟、听到厮打吵闹，都不要出来，留在各自的地方，安静地做事。
        - id: ch04-b07
          speaker: narrator
          text: >-
            欧律克勒娅按吩咐去关上门。
            菲洛伊提奥斯暗暗出去，闩住外院的大门。门房有纸莎草纤维制的船缆，他再用缆把门扎牢，回去坐原位，盯着主人。奥德修斯正拿弓翻看，仔细查着两端的角，想知道离家这么久，有没有被虫蛀坏。一位求婚人转脸对旁人议论。
        - id: ch04-b08
          speaker: suitor_bow_observer
          text: >-
            老头怕是个精通弓的，家里有同样一张？还是打算做一张？你看这个老流浪汉，摆弄得多在行。
        - id: ch04-b09
          speaker: suitor_bow_scoffer
          text: >-
            这弓他怕是张不了，愿他干别的事也一样没运气。
        - id: ch04-b10
          speaker: narrator
          text: >-
            把弓拿在手里，从头到尾检查完毕，奥德修斯就动手上弦。他竟毫不吃力。熟练的歌人会把捻好的肠弦绕在里拉琴的新弦轴上，把两头固定好，他的动作也这样轻松。随后他用右手拨试，指头一触，弓弦就唱出清甜的音，像只燕子在鸣叫。那声音一响，求婚人都变了脸色，吓得苍白。恰好此刻，宙斯轰然一声雷，把预兆送下来。听见这来自多谋克洛诺斯之子的讯号，奥德修斯心里高兴。
            他从桌面取了一支箭。其他的箭仍在箭囊里，很快阿开亚人就要尝到它们的滋味。奥德修斯一直坐着，没有起身，箭放到弓的中央，箭尾缺口扣着弦，一起向身前拉。瞄准后松开，那箭便从第一把斧的柄孔穿进去，接着一把，又一把，十二把全部穿过，飞入外院。主人这才向儿子说话。
        - id: ch04-b11
          speaker: odysseus
          text: >-
            忒勒马科斯，客人没叫你羞愧。想中的地方中了，张弓也快，力气还没丢，可不是他们嘴里说的那种人。现在趁天还亮，阿开亚人也该做晚饭了。吃完，换着唱歌跳舞，再添些快乐，那是宴会最出彩的事。
        - id: ch04-b12
          speaker: narrator
          text: >-
            他眉毛一动，给了暗号。忒勒马科斯系剑、握矛，全身武装，站在父亲椅子旁。
