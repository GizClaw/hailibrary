premise: >-
  荷马史诗第十七卷的阅读整理。奥德修斯扮作乞丐走进自己的城镇和家宅， 老犬认出他，家中人却在施舍与欺辱中暴露各自的态度；他忍住反击， 等待日落后与佩涅洛佩交谈。
characters:
  - { id: odysseus, description: "以乞丐身份走入自家、为守秘密接连忍受侮辱的归乡者" }
  - { id: telemachus, description: "已知父亲归来，向母亲隐去秘密并强忍怒气的儿子" }
  - { id: penelope, description: "担心家人、期待消息，反对求婚人欺辱客人的女主人" }
  - { id: eumaeus, description: "为客人引路、辩护和传话，仍未认出主人的牧猪人" }
  - { id: melanthius, description: "把牲口送给求婚人，并在泉边踢打和辱骂客人的牧羊人" }
  - { id: antinous, description: "拒绝施舍并用脚凳打伤客人的求婚人" }
  - { id: theoclymenus, description: "依据鸟兆断言奥德修斯已归的预言者" }
  - { id: argos, description: "年老而被忽略的猎犬，临死前认出了久别的主人" }
