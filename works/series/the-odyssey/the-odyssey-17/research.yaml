required: true
sources:
  - url: "https://www.gutenberg.org/ebooks/1727"
    authority: "Project Gutenberg catalogue, ebook 1727"
    claims:
      - "The consulted text is Homer's Odyssey in Samuel Butler's English prose translation; the catalogue marks it public domain in the USA."
  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XVII; 1900 translation in the consulted transcription with the 1921 second-edition preface"
    claims:
      - "Telemachus greets his mother, leaves the Spartan gifts with Piraeus, and reports older news from Menelaus while concealing his meeting with his father. Theoclymenus declares Odysseus is already in Ithaca."
      - "Melanthius kicks Odysseus. Odysseus considers killing him but restrains himself; Melanthius threatens to sell Eumaeus and wishes Telemachus dead."
      - "Argos recognizes Odysseus, cannot approach, and dies. Odysseus hides his tears."
      - "Odysseus invents an Egyptian raid involving killing, capture, enslavement, and removal to Cyprus. Antinous strikes his right shoulder with a stool and threatens flaying alive."
      - "Penelope and Eurynome wish the suitors dead. Penelope takes her son's sneeze as a sign that every suitor will be killed. The guest postpones their interview until sunset."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute, Cultural Objects Names Authority"
    claims:
      - "The ancient Greek epic comprises twenty-four books and is traditionally attributed to Homer."
  - url: "https://www.metmuseum.org/perspectives/discovering-homer-odyssey"
    authority: "The Metropolitan Museum of Art, Department of Greek and Roman Art"
    claims:
      - "The museum identifies the Greek epic and its disguised, violent homecoming as literary tradition."
notes:
  - "2026-10-11: independent HaiLibrary reading prose in both locales, publicly attributed to Homer / 荷马. The user explicitly requested rewriting rather than verbatim import or paragraph-matched translation, while retaining classic. This is a task-scoped exception to the classic import default, not a change to that global type."
  - "Complete Book XVII was compared with the saved Butler source at git commit 1208d108 and the consulted Gutenberg edition. This edition is condensed, not unabridged."
  - "Condensed boundaries: repeated travel reports, feast service and livestock lists, names of the fountain's founders, detailed Egyptian geography and names, extended insults, and generalized claims about enslaved people's character. The Egyptian killing and enslavement remain in the clearly invented cover story."
  - "Claim classification: homecoming events are supported literary plot, divine actions are declared myth, and the bird and sneeze are character interpretations. No omen is offered as a real prediction. Melanthius's, Antinous's, and Penelope's violent intentions remain their own."
  - "Knowledge continuity: the son knows the guest is his father; Penelope and Eumaeus do not. The mother receives the older Calypso report, not the son's current secret. The promised interview is not yet conducted."
  - "Dedication, prefaces, footnotes, translator commentary, and reference numerals are omitted. No modern copyrighted translation or screen version is used as a prose model. Media bytes are unchanged."
