  chapters:
    - id: ch01
      title: "What the son could tell"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            At dawn, Telemachus left for town. He spoke in front of Eumaeus as though he had no time for the old stranger's troubles. The swineherd could bring him along later. He would find more people to beg from there. Odysseus agreed. He wanted to get warm first. His thin clothes wouldn't keep out the cold along that rough path. They gave Eumaeus no hint that they had recognized each other as father and son and planned their revenge.

            Euryclea was the first to see Telemachus at the palace. She ran to him, and the other women came round. Penelope hurried down and held her son. She cried with relief, but blamed him for leaving without telling her. She had feared he would never return.
        - id: ch01-b02
          speaker: telemachus
          text: >-
            Mother, I've only just got back alive. Give me a little time, and pray for us. There's a man who sailed with me. I need to bring him here.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He went to the meeting place, staying clear of the suitors. They greeted him kindly, though he knew they still wished him harm. Piraeus brought Theoclymenus and offered to send the gifts from Sparta to the house. Telemachus told him to keep them safe a while longer. If the suitors killed him, he wanted his friend to have the gifts, not them. He took the seer home. They washed and ate, with Penelope spinning opposite. Now she wanted to hear about the journey. Her son described Nestor's welcome, as warm as a father's, but said he had known nothing of Odysseus. Menelaus had told him what he heard from the old sea god. Odysseus was alive with Calypso, unable to leave her island without a ship and sailors. That was all Telemachus told her. He kept the meeting at the hut secret. Theoclymenus was much more certain.
        - id: ch01-b04
          speaker: theoclymenus
          text: >-
            Odysseus has already come to Ithaca. He's finding out what these men have been doing, and getting ready to punish them. I saw that in the bird's sign.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Penelope said she would reward him if he proved right. His words gave her hope, but others had done that before.
    - id: ch02
      title: "Someone who knew him"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Back in the country, Eumaeus found a walking stick for the guest. Odysseus put the old bag over his shoulder and followed him down the steep ground. Outside town, they reached the fountain under the poplars. Cold water ran from the rock, and an altar stood nearby for the nymphs.

            Melanthius came up with goats for the feast. He was bringing the best ones to the suitors. He sneered at the stranger. Eumaeus had found yet another mouth to feed. This man would rather ask for food than earn it. If he entered the palace, people would hurl stools until he went away. Passing him, Melanthius kicked him on the hip. Odysseus didn't move. He thought of beating the man to death with his stick, or throwing him down and breaking his skull. He made himself hold back. Eumaeus stood up to the goatherd. He called on the nymphs to return Odysseus and put a stop to such bullying. Melanthius threatened to ship Eumaeus abroad and sell him. He wished Telemachus dead, said the king was never coming home, and hurried off to join the suitors' meal.

            At the palace, Odysseus paused outside the walls. There was roasting meat in the air, and Phemius was beginning to sing. Odysseus praised the doors and buildings as if he had never seen them. He had been away from this house for twenty years. Eumaeus suggested entering first, with the guest following him.

            By the stable, a dog raised his head.

            This was Argos, the dog Odysseus had raised before he sailed to Troy. In those days, young men took him hunting. Once he followed a creature's scent, it could hardly escape him. Now he was old and covered in fleas. Nobody cared for him properly. He lay on dung piled up for taking to the fields. He heard the men, looked at his master, and lowered his ears. His tail began to wag.

            He hadn't the strength to get up and go to him.

            Odysseus turned away and wiped the tears from his face before the swineherd could see.
        - id: ch02-b02
          speaker: odysseus
          text: >-
            That's a fine-looking dog. Did he used to hunt, or was he just there to look handsome?
        - id: ch02-b03
          speaker: narrator
          text: |-
            Eumaeus told him how fast the dog had once been. He had belonged to Odysseus. With the master gone and nobody looking after him, he had grown weak like this. Then Eumaeus went inside.

            Argos had recognized his master one last time. As Odysseus entered the house, the dog died.
    - id: ch03
      title: "The stool"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Telemachus called Eumaeus to sit beside him. Soon the old beggar came in and sat on the threshold against a post. Telemachus sent him bread and meat through the swineherd, with word that he should ask the other men as well. Odysseus blessed the young man and ate to the sound of Phemius's song. When it ended, Athena prompted him to go round the tables and see how each suitor behaved. She meant to let none of them survive. He stretched out his hands for food. Some men gave him something. Others wanted to know where he came from. Melanthius said Eumaeus had brought him, and Antinous started abusing the swineherd.
        - id: ch03-b02
          speaker: antinous
          text: >-
            There are enough beggars here already. Why invite one more to use up your master's food?
        - id: ch03-b03
          speaker: narrator
          text: >-
            Eumaeus tried to answer him. Telemachus stopped their argument, then spoke very politely to Antinous, making his meaning clear.
        - id: ch03-b04
          speaker: telemachus
          text: >-
            How careful you are with my belongings. Why don't you give him some food yourself? You have my permission.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Antinous dragged out his footstool. He said the beggar wouldn't return for months if everyone gave what he meant to give. Odysseus had a bag full of food, but went to him anyway. Someone who looked like a leader should give generously. He had once been wealthy himself, feeding travelers without questions. Then came a different invented past. In Egypt his men ignored his orders, killed men, and seized women and children. The Egyptians fought back, killed some and enslaved the rest. He was handed to a man who took him to Cyprus. Now he had only rags. Antinous ordered him away. The others could give because they didn't own this food. Odysseus replied as he left.
        - id: ch03-b06
          speaker: odysseus
          text: >-
            And you won't even give away somebody else's bread. If this were your house, I doubt I'd get so much as a grain of salt.
        - id: ch03-b07
          speaker: narrator
          text: |-
            Antinous hurled the stool. It hit Odysseus high on his right shoulder. He didn't stagger. He only shook his head, then took his bag back to the threshold. He told the room he had been hit for trying to fill his stomach. If any gods watched over the poor, he hoped Antinous would die before he could marry. Antinous threatened to have servants seize his hands and feet, drag him through the courts, and skin him alive unless he stopped talking. Even the other suitors protested. One warned that a traveler could be a god who had changed his appearance. Antinous ignored him.

            Telemachus watched his father take the blow. It hurt him to see it, but he didn't cry or speak. Their plan required him to keep silent.
    - id: ch04
      title: "An invitation at sunset"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Penelope heard the story upstairs and wished Apollo would strike Antinous. Eurynome said that, if their prayers came true, none of these men would live to see morning. Penelope hated them all, and Antinous more than any. She called Eumaeus. This guest had seen many places. Perhaps he knew something of her husband. The swineherd said the man's stories held him spellbound. He had stayed three days and nights, and had still not finished telling his troubles. He claimed he knew Odysseus and had heard he was alive nearby. Penelope wanted to meet him. If her husband came back, she said, he and their son could punish these men ruining the house.

            Telemachus sneezed so loudly that the sound carried through the building. Penelope laughed. She took it to mean that the suitors would all be killed. Nobody would escape. She promised the stranger a cloak and tunic if he told her the truth. Eumaeus brought the invitation, but Odysseus asked to wait until sundown. He knew about her husband. First, though, he had to get safely past the suitors. He had just been struck, and nobody had defended him. Could she give him a place by the fire later? Then he would answer her questions. Penelope agreed. She could see why he wanted to stay away from the men in the hall.

            Eumaeus told Telemachus to take care, ate the rest of his meal, and left to look after the pigs. Tomorrow he would bring more animals for the feast. The suitors began to sing and dance, and evening came closer.

            Odysseus sat on his own threshold and waited for it to grow dark.
