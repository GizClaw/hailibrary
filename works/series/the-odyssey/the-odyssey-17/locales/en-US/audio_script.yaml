  chapters:
    - id: ch01
      title: "The son comes home"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Morning's child appeared, rosy-fingered Dawn. Telemachus strapped his sandals onto his feet and picked up a sturdy spear, one that rested comfortably in his hands. He wanted to make his way into the town. Before setting out, he spoke to his old friend the swineherd.
        - id: ch01-b02
          speaker: telemachus
          text: >-
            Old friend, I'm going to let my mother see me. Until she does, she won't stop grieving. Take this unfortunate stranger into town too. He can ask anyone willing to help for something to drink and a piece of bread. I have enough troubles of my own. I can't take on everyone else's. If he resents that, I can't help it. I prefer to speak plainly.
        - id: ch01-b03
          speaker: odysseus
          text: >-
            Sir, I have no wish to stay here. A beggar fares better in a town than out in the country. Anyone who chooses can spare him something. I'm too old to settle here and answer every call from a master. So let this man take me, just as you've told him. First let me warm myself beside the fire, and let the day grow warmer too. These clothes are terribly thin. On a frosty morning like this I could freeze, especially when the town is so far away, as you say.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Telemachus strode through the yards, thinking of revenge on the suitors. At home he leaned his spear against a pillar in the cloister, crossed the stone paving, and went indoors.
            His nurse Euryclea caught sight of him long before anyone else in the house. She was putting woolly fleeces over the seats. As she ran up to meet him, she burst into tears. All the other maids came crowding round as well. Their kisses covered his head and both his shoulders. Penelope came out of her room, looking as beautiful as Diana or Venus. She was weeping too as she threw her arms round her son. She kissed his forehead, then each of his lovely eyes, and spoke to him with all her love.
        - id: ch01-b05
          speaker: penelope
          text: >-
            Light of my eyes, you're home! I thought I would never see you again. You went all the way to Pylos without a word to me, without asking whether I agreed. Come, tell me what you found there.
        - id: ch01-b06
          speaker: telemachus
          text: >-
            Mother, please don't blame me or trouble me now. I've only just escaped with my life. Wash your face and change your clothes. Go upstairs with your women. Promise all the gods full offerings of a hundred cattle, if Jove will grant us revenge on the suitors. I must go to the assembly place. There's a stranger I brought back from Pylos, and I want to invite him here. I sent him ahead with the crew and asked Piraeus to take him home and care for him until I could fetch him myself.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Penelope did as her son asked. She washed, changed her clothes, and promised the gods those generous offerings if they would let her take revenge.
            Telemachus went out through the cloister carrying his spear. His two swift dogs went with him. Minerva gave him a beauty and presence like a god's. People stared in wonder as he passed. The suitors gathered round him with pleasant words, though their hearts were full of malice. He kept clear of them. Instead he sat with Mentor, Antiphus, and Halitherses, old friends of his father's household. They asked him to tell everything that had happened. Then Piraeus arrived. He had brought Theoclymenus through the town to the assembly place. Telemachus went straight to meet them, and Piraeus spoke first.
        - id: ch01-b08
          speaker: piraeus
          text: >-
            Telemachus, send some of your women over to my house, will you? They can collect those gifts Menelaus gave you.
        - id: ch01-b09
          speaker: telemachus
          text: >-
            Piraeus, there's no knowing what will happen. The suitors may kill me in my own house and share out my belongings. If that happens, I'd rather you kept the gifts than let any of them have them. But if I succeed in killing the suitors, I'll be grateful if you'll bring the gifts to me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            After this answer to Piraeus, Telemachus took Theoclymenus to his own home. Once inside, they laid their cloaks on the benches and chairs and went to wash in the baths. The maids washed their bodies, rubbed them with oil, and brought shirts and cloaks for them to put on. Then the two men took their places at the table. A maid carried water in a beautiful golden jug and poured it into a silver basin so that they could wash their hands. She drew a clean table up beside them. The housekeeper brought bread and offered them many of the good things kept in the house. Across from them sat Penelope. She was spinning as she rested on a couch beside one of the pillars that held up the cloister. The men reached for the food before them. When they had finished eating and had drunk as much as they wanted, she spoke to her son.
        - id: ch01-b11
          speaker: penelope
          text: >-
            Telemachus, I shall go upstairs and lie on that sorrowful couch. I've soaked it with tears ever since Ulysses sailed for Troy with the sons of Atreus. Yet you still haven't told me plainly, before the suitors come back here, whether you heard anything about your father's return.
        - id: ch01-b12
          speaker: telemachus
          text: >-
            Here is what happened, Mother. At Pylos we met Nestor. He took me into his home as warmly as if I were his own son, home after a long absence. His sons welcomed me in just the same way. But he hadn't heard a word from anyone about Ulysses. He didn't know whether he was alive or dead. So he gave me horses and a chariot and sent me to Menelaus. There I saw Helen. For her sake the gods had decided that so many Argives and Trojans must suffer. Menelaus wanted to know why I'd come to Lacedaemon. I told him everything truthfully. This was his answer.
        - id: ch01-b13
          speaker: menelaus
          text: >-
            So those cowards mean to take over a brave man's bed! A hind might leave her newborn young in a lion's den and wander off to graze in the woods or a grassy hollow. When the lion comes home, he'll make short work of mother and young. That's how Ulysses will deal with these suitors. By father Jove, Minerva, and Apollo, may he still be the man he was on Lesbos! He wrestled Philomeleides there and hurled him down so hard that all the Greeks cheered. Let a man like that meet these suitors, and their lives will be short. Their wedding will be a wretched one. But you asked me for news, and I won't dodge your question or mislead you. I'll tell you everything the old man of the sea told me. He said he could see Ulysses weeping in great sorrow on an island, in the home of the nymph Calypso. She was keeping him there against his will. He couldn't get home. He had neither a ship nor sailors to carry him across the sea.
        - id: ch01-b14
          speaker: telemachus
          text: >-
            Those were Menelaus's words. After hearing them I set off again. The gods gave me a fair wind and brought me safely home in little time.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Penelope was deeply moved by what her son had said. Then Theoclymenus spoke to her.
        - id: ch01-b16
          speaker: theoclymenus
          text: >-
            Lady, wife of Ulysses, Telemachus doesn't know how to read these signs. Please hear me instead. I can read them with certainty, and I'll keep nothing back. Let Jove, king of heaven, bear witness. Let the laws of hospitality witness it, and the hearth of Ulysses that I have come to. Ulysses himself is already here in Ithaca. Whether he's travelling about or staying in one place, he's finding out what these men have done and preparing the day when the suitors must answer for it. An omen I saw aboard the ship told me this. I explained it to Telemachus then.
        - id: ch01-b17
          speaker: penelope
          text: >-
            May you be right! If what you say comes true, you'll have such gifts and friendship from me that everyone who sees you will tell you how fortunate you are.
    - id: ch02
      title: "The road to town"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            While they talked, the suitors were outside on the level ground before the house. Some threw discs. Others aimed their spears at a target. They were as insolent as ever. Then it was time to eat. Sheep and goats were coming into town from the surrounding country, with their shepherds, as they usually did. Medon, the servant they liked so much and who waited on them at table, called to them.
        - id: ch02-b02
          speaker: medon
          text: >-
            Young masters, that's enough sport for now. Come inside so we can prepare your dinner. When dinner time comes round, dinner's no bad thing.
        - id: ch02-b03
          speaker: narrator
          text: >-
            They stopped their games and went in. They left their cloaks on the benches and chairs and sacrificed sheep, goats, pigs, and a young cow. The animals were all well grown and fat. So the meal was prepared.
            Meanwhile Ulysses and the swineherd were getting ready to leave for town. Eumaeus spoke to his guest.
        - id: ch02-b04
          speaker: eumaeus
          text: >-
            Stranger, you still intend to go into town today, I suppose. That's what my master said you were to do. If it were up to me, I would have liked you to stay here and work as a hand on the farm. But I must carry out what my master tells me, or I'll hear his reproaches later. When your own master scolds you, that's something you have to take seriously. We'd better set out. The day is already well advanced. Before we know it, it will be night again, and you'll feel the cold still more.
        - id: ch02-b05
          speaker: odysseus
          text: >-
            I understand you. You needn't explain any more. Let's go. If you have a stick already cut, give it to me to lean on. You've told me how rough the road is.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Ulysses slung his old, torn bag over his shoulder by its cord. Eumaeus found him a stick he liked. They left the farm to the dogs and the herdsmen who stayed behind, and set out. The swineherd went ahead. His master followed, bent over his staff, his clothes in rags, looking like a worn-out old tramp.
            They crossed the steep, stony ground and came near the town. There was the fountain where the townspeople fetched their water. Ithacus, Neritus, and Polyctor had built it. Water-loving poplars formed a circle round it. Clear, cold water flowed down from a high rock. Above the spring stood an altar to the nymphs, where travellers offered sacrifices.
            Here Melanthius, the son of Dolius, caught up with them. He was driving some of his best goats down for the suitors' meal, with two shepherds beside him. When he saw Eumaeus and Ulysses he poured out foul insults. They made Ulysses very angry.
        - id: ch02-b07
          speaker: melanthius
          text: >-
            Well, look at you two! What a fine pair. The gods certainly know how to bring like to like. Master swineherd, where are you taking that miserable creature? The sight of him at a dinner table would turn anyone's stomach. I doubt he's ever won a prize for anything. He'll rub his shoulders on every doorpost in town, begging as he goes. Not for swords and cauldrons, as a man might, but for scraps too poor to ask for. Give him to me at the farm. He could clean the pens and bring sweet feed for the kids. He could drink enough whey to grow fat about the thighs. But no, he's got into bad habits and won't do a stroke of work. All he wants is to beg from one end of town to the other and stuff that belly of his that never has enough. I'll tell you what will happen, and you can count on it. Let him go to Ulysses' house, and they'll break his head with stools. They'll keep throwing them until he's out of the place.
        - id: ch02-b08
          speaker: narrator
          text: >-
            As Melanthius passed, he kicked Ulysses on the hip for no reason at all. Ulysses stayed firm on the path. He thought of leaping at the man and killing him with his staff, or throwing him down and beating out his brains. But he chose to bear the insult and hold himself back. Eumaeus faced Melanthius. He raised his hands to heaven and answered him with a prayer.
        - id: ch02-b09
          speaker: eumaeus
          text: >-
            Nymphs of this fountain, daughters of Jove, hear me! If Ulysses ever burned the thigh bones of lambs or kids for you, wrapped in fat, grant me this. Let heaven bring him home. He'd soon silence the swaggering threats of men like you, Melanthius. You go about insulting people, wandering all over town, while your flocks suffer because their shepherd doesn't care for them.
        - id: ch02-b10
          speaker: melanthius
          text: >-
            You foul-tempered dog, what nonsense is this? One day I'll put you on a ship and take you abroad. I'll sell you there and keep what you fetch. I'm certain Ulysses is never coming home. I only wish I could be as certain that Apollo would kill Telemachus today, or that the suitors would do it for him.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Melanthius hurried ahead, leaving Ulysses and Eumaeus to come on as slowly as they pleased. He soon reached the house that belonged to his master. He went in and took a seat among the suitors, opposite Eurymachus. Eurymachus liked him more than any of the other suitors did. The servants brought his portion of meat, and the woman in charge of the household put bread before him so he could eat.
            A little later, Ulysses and Eumaeus reached the house and stood outside it, with music sounding all round them. Phemius was just beginning his song for the suitors. Ulysses reached out, took the swineherd by the hand, and spoke about the house before them.
        - id: ch02-b12
          speaker: odysseus
          text: >-
            Eumaeus, this is a splendid house Ulysses has. Travel as far as you like, and you'll find few to match it. One building follows another. All round the outer yard there's a wall topped with battlements. The double doors are finely made. It would be hard to force a way in with weapons. A good many people must be feasting inside too. I can smell the roasting meat and hear the music. The gods made music to accompany a feast.
        - id: ch02-b13
          speaker: eumaeus
          text: >-
            You've seen it rightly. You usually do. Now, how shall we go in? Would you rather enter first and join the suitors while I stay behind? Or will you wait and let me go before you? Don't wait too long, though. Someone might notice you hanging about outside and throw something at you. Think which way you'd prefer.
        - id: ch02-b14
          speaker: odysseus
          text: >-
            I understand. You go first. I'll stay here for now. Blows and things thrown at me are nothing new. War and the sea have battered me so much that I've grown hard to it. This can take its place beside the rest. But no man can hide the hunger in his belly. That's an enemy that brings trouble to us all. It drives men to fit out ships, cross the seas, and make war in someone else's country.
    - id: ch03
      title: "A dog remembers"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            While they were talking, a sleeping dog lifted his head and pricked up his ears. This was Argos. Ulysses had reared him before leaving for Troy, but had never had the chance to work him. Once the young men used to take him out to hunt wild goats, deer, and hares. Now his master was gone, and no one cared for him. He lay in front of the stable doors, on a heap of dung from the cattle and mules. The heap was waiting to be carted away as manure for the great enclosed field. Fleas covered the old dog.
            Argos saw Ulysses. His ears dropped and his tail began to wag, but he could not get to his master. Across the yard, Ulysses saw him too. He wiped away a tear before Eumaeus could notice.
        - id: ch03-b02
          speaker: odysseus
          text: >-
            That's a noble-looking hound on the dung heap, Eumaeus. What a splendid body he has. Does his skill match his looks? Or is he one of those dogs kept only to look handsome and beg round the table?
        - id: ch03-b03
          speaker: eumaeus
          text: >-
            He belonged to the man who died far from home. If you could have seen him when Ulysses sailed for Troy, you'd have known what he could do. Once he picked up a trail, no wild creature in the woods could escape him. But things have gone badly for him now. His master's dead and gone, and the women don't look after him. Servants leave their work undone when the master's no longer there to see to it. When Jove makes a man a slave, he takes away half the good in him.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Eumaeus went into the buildings and on to the cloister where the suitors sat. Argos had recognised his master. Then he died.
            Telemachus noticed Eumaeus well before anyone else and beckoned him over to sit. The swineherd looked about for a seat. He found one near the man carving portions for the suitors, carried it to Telemachus's table, and sat across from him. A servant brought his share of meat and some bread from the basket.
            Ulysses came in just after him. Leaning on his staff in his rags, he looked like a wretched old beggar. Just inside the doors between the outer and inner yards was an ash-wood threshold. He sat there against a cypress pillar. A carpenter had smoothed that pillar with his plane and fitted it precisely with rule and line. Telemachus took a whole loaf from the basket and as much meat as his two hands could hold. He spoke to Eumaeus.
        - id: ch03-b05
          speaker: telemachus
          text: >-
            Bring this to the stranger. Tell him to go from suitor to suitor and ask them for food. A beggar can't afford to be shy.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Eumaeus carried the food over to Ulysses.
        - id: ch03-b07
          speaker: eumaeus
          text: >-
            Telemachus sends you this, stranger. He says you should ask each of the suitors for something. Beggars must put their shyness aside.
        - id: ch03-b08
          speaker: odysseus
          text: >-
            May Jove our king give Telemachus every happiness, and bring about what his heart desires.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Ulysses received the food in both hands and set it on the filthy old bag at his feet. He ate as the bard sang. The meal and the song ended together. The suitors applauded. Then Minerva came to Ulysses and urged him to beg a piece of bread from every suitor. That way he could learn their characters and see which were good and which were bad. Whatever he discovered, she meant to spare none of them.
            So he moved round them from left to right, holding out his hands as a practiced beggar would. Some felt sorry for him. Some wondered who he was, and asked each other where he could have come from. Melanthius the goatherd answered them.
        - id: ch03-b10
          speaker: melanthius
          text: >-
            You gentlemen who court my noble mistress, I know something of this man. I've seen him before. The swineherd brought him here. But who he is himself, or where he comes from, I can't tell you.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Antinous turned his insults on the swineherd.
        - id: ch03-b12
          speaker: antinous
          text: >-
            What a fool you are! Why bring him into town? Aren't there enough tramps and beggars pestering us every time we eat? All these people gather here and consume your master's property. Doesn't that seem enough to you? You have to bring another one?
        - id: ch03-b13
          speaker: eumaeus
          text: >-
            Your family is noble, Antinous. Your words aren't. I didn't invite this man from abroad. Who would bring a stranger here unless he had some skill to offer everyone? A prophet, a healer, a carpenter, or a singer whose songs hold you listening, men like those are welcome anywhere. No one sends for a beggar just to have another worry. You treat Ulysses' servants worse than any suitor here, and me worst of all. But so long as Penelope and Telemachus are alive and here with us, I don't care.
        - id: ch03-b14
          speaker: telemachus
          text: >-
            Enough, Eumaeus. Don't answer him. Of all these men, Antinous has the cruelest tongue, and he encourages the rest.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Telemachus turned to Antinous.
        - id: ch03-b16
          speaker: telemachus
          text: >-
            How carefully you protect my interests, Antinous! Anyone would think I was your son. Why are you so eager to throw this stranger out? May the gods never let that happen. Take some food and give it to him yourself. I don't begrudge it. I'm telling you to take it. You needn't worry about my mother or any of the servants. But I know you won't. You'd sooner eat things yourself than offer them to someone else.
        - id: ch03-b17
          speaker: antinous
          text: >-
            Telemachus, what's all this boasting meant to prove? If the other suitors gave him as much as I'm ready to give him, he'd stay away from this house for three months.
        - id: ch03-b18
          speaker: narrator
          text: >-
            He pulled the stool from under the table, where his delicate feet had been resting. He made a motion as though to throw it at Ulysses. The other suitors all gave something. Soon the bag was full of bread and meat. Ulysses was ready to return to the threshold and eat what they had given. First, though, he approached Antinous.
    - id: ch04
      title: "The thrown stool"
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: >-
            Spare me a little, sir. Surely you're not the poorest man here. You look like a leader, the first among these men. You ought to give more than the rest, and I'll tell people everywhere how generous you are. I too once had wealth and a fine house. In those days I helped many a wanderer such as I've now become. It made no difference who he was or what he needed. I had servants beyond counting, and everything else that belongs to a prosperous household. Then Jove decided to strip it all away. He sent me with a band of sea robbers on a long voyage to Egypt. That journey ruined me. I moored my ships in the river Aegyptus. I told the men to stay beside them and guard them, while I sent scouts out to look over the country from every good vantage point.
            But the men ignored my orders. They went their own way and began plundering the Egyptians' land. They killed the men and carried off the women and children. Word quickly reached the city. At dawn the people heard the call to battle and came pouring out. The plain filled with mounted soldiers and men on foot, their armour shining. Jove filled my men with terror. They saw enemies on every side and wouldn't stand and fight. The Egyptians killed many of us. The rest were taken alive and forced to work for them. They handed me to a friend they happened to meet, to take away to Cyprus. He was Dmetor, son of Iasus, a powerful man there. From Cyprus I've made my way here, in the miserable state you see.
        - id: ch04-b02
          speaker: antinous
          text: >-
            What god sent this plague to spoil our dinner? Out with you, into the uncovered yard! Keep up your begging and your insolence, and I'll give you something to remember Egypt and Cyprus by. You've asked everyone else already. They've been lavish, because they're surrounded by plenty. It's easy to hand things out when there's lots of another man's property at hand.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Ulysses began to turn away.
        - id: ch04-b04
          speaker: odysseus
          text: >-
            A handsome man you may be, sir, but your manners don't match your face. In your own house I doubt you'd part with a pinch of salt for a poor man. Here you sit in someone else's home with food all round you, and you can't even spare a piece of bread.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Antinous glared at him, furious.
        - id: ch04-b06
          speaker: antinous
          emotion: angry
          text: >-
            You'll pay for that before you're out of this yard!
        - id: ch04-b07
          speaker: narrator
          text: >-
            He hurled the footstool. It struck Ulysses high on the back, on his right shoulder blade. Ulysses stood firm as a rock. The blow did not even make him sway. He shook his head without a word and thought of his revenge. Then he went back to the threshold, sat down, and placed his full bag at his feet. He called to the suitors.
        - id: ch04-b08
          speaker: odysseus
          text: >-
            Listen, you men who court Queen Penelope. I'm going to say what I think. When a man takes a blow defending his money or his cattle and sheep, he hardly feels the hurt. But Antinous has struck me for trying to serve this miserable belly of mine. It brings people trouble without end. Still, if poor men have gods to protect them, if any powers avenge their wrongs, let Antinous meet an evil death before his wedding day.
        - id: ch04-b09
          speaker: antinous
          emotion: angry
          text: >-
            Eat quietly where you are, or go somewhere else! One more word, and I'll have you hauled through the yards by your hands and feet. The servants will strip your skin off while you're still alive.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The other suitors strongly disapproved. One young man answered him.
        - id: ch04-b11
          speaker: suitor_young
          text: >-
            Antinous, striking that poor beggar was wrong. And if he turns out to be a god, it'll be worse for you. You know the gods take all kinds of disguises. They appear as travellers from abroad and go through the world, watching who behaves justly and who does wrong.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Those were the suitors' words, but Antinous would not listen to them. Telemachus was furious at what had happened to his father, at that blow the stranger had been made to bear. Yet he did not shed a single tear. He shook his head without saying anything and turned his thoughts to the revenge he would take.
    - id: ch05
      title: "Penelope sends for the stranger"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Penelope heard that the beggar had been struck in the cloister where the men were eating. In front of her maids, she spoke against Antinous.
        - id: ch05-b02
          speaker: penelope
          text: >-
            May Apollo strike you just as hard, Antinous!
        - id: ch05-b03
          speaker: eurynome
          text: >-
            If the gods heard our prayers, none of these suitors would live to see another sunrise.
        - id: ch05-b04
          speaker: penelope
          text: >-
            Nurse, I hate them all. They want nothing but evil. But I hate Antinous as I hate the darkness of death. A poor man has come begging here because he has nothing to live on. Everyone else has put something in his bag. Antinous alone threw a footstool at him and struck his right shoulder blade.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Penelope sat in her room talking to the women. Meanwhile Ulysses was eating. She sent for the swineherd.
        - id: ch05-b06
          speaker: penelope
          text: >-
            Eumaeus, ask the stranger to come here. I'd like to see him and question him. He seems to have travelled far. Perhaps he's seen my unhappy husband, or heard some news of him.
        - id: ch05-b07
          speaker: eumaeus
          text: >-
            Madam, if those Achaeans would only be quiet, his adventures would keep you listening in wonder. He stayed three days and three nights in my hut. It was the first place he reached after escaping from his ship. Even then he hadn't finished telling all his troubles. I sat and listened, held by his words. The finest singer ever taught by heaven couldn't have held me more, though everyone hung on his song. He says his family and Ulysses' family have long been friends. He comes from Crete, where the descendants of Minos live. Every sort of misfortune has driven him here and there before he reached us. He also says he's heard that Ulysses is alive, close by among the Thesprotians, and coming home with a great fortune.
        - id: ch05-b08
          speaker: penelope
          text: >-
            Fetch him, then. I want to hear this for myself. Let the suitors enjoy themselves inside or outside, wherever they please. They have no worries. Their grain and wine lie safely at home, with only their servants using them. But day after day they linger in our house, slaughtering our cattle, sheep, and fat goats for their feasts. They never stop to think how much wine they're drinking. No estate can bear that kind of waste. We have no Ulysses here to defend us. If he came back, he and his son would soon make them pay.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Just then Telemachus sneezed. It was so loud that the whole house echoed. Penelope heard it and laughed. She turned again to Eumaeus.
        - id: ch05-b10
          speaker: penelope
          text: >-
            Go and call the stranger. Did you hear my son sneeze just as I spoke? It means the suitors will all be killed. Not one will get away. And remember this too. If I'm convinced the stranger tells the truth, I'll give him a good, lasting shirt and cloak.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Eumaeus went directly to Ulysses with her message.
        - id: ch05-b12
          speaker: eumaeus
          text: >-
            Old friend, my mistress Penelope, Telemachus's mother, wants to see you. She's deeply unhappy, but she hopes you can tell her something about her husband. If she believes your account is true, she'll give you a shirt and a cloak. You need those more than anything. As for bread, you can get enough to satisfy your hunger by asking round the town. Those who choose can give you some.
        - id: ch05-b13
          speaker: odysseus
          text: >-
            I'll tell Penelope the exact truth. I know her husband's story well. I've suffered alongside him. But I dread going through that crowd of cruel suitors. Their arrogance and insolence reach the sky. Only a moment ago I was walking about the house, harming no one, when a man struck me a painful blow. Neither Telemachus nor anyone else defended me. Ask Penelope to wait patiently until the sun goes down. Then let her put me by the fire. My clothes are worn terribly thin. You know that yourself. You've seen them ever since I first came to you for help. Once I'm there, she can ask me about her husband's return.
        - id: ch05-b14
          speaker: narrator
          text: >-
            Eumaeus took the answer back. Penelope saw him crossing the threshold without the stranger.
        - id: ch05-b15
          speaker: penelope
          text: >-
            Why haven't you brought him, Eumaeus? Is he afraid someone will mistreat him? Or does he feel shy about coming farther into the house? A beggar shouldn't let shyness stop him.
        - id: ch05-b16
          speaker: eumaeus
          text: >-
            His reasons are sound, madam. He's keeping away from the suitors, just as anyone would. He asks you to wait until sunset. It would be better for you too. Then you could have him to yourself and hear his story and ask whatever you wish.
        - id: ch05-b17
          speaker: penelope
          text: >-
            He has sense. Things could easily be as he fears. There aren't more hateful men anywhere in the world than these.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Eumaeus had explained everything. When Penelope finished, he went back to where the suitors were. He came close to Telemachus and spoke into his ear, too softly for anyone else to hear.
        - id: ch05-b19
          speaker: eumaeus
          text: >-
            My young master, I'm going back to the pigs now, to tend your property and do my work. You'll watch what happens here. Above all, keep yourself safe. Plenty of men wish you harm. May Jove destroy them before they can hurt us.
        - id: ch05-b20
          speaker: telemachus
          text: >-
            Very well. Eat before you leave. Tomorrow morning bring in the animals for the day's sacrifice. Let the gods and me look after the rest.
        - id: ch05-b21
          speaker: narrator
          text: >-
            Eumaeus sat down again. When he had eaten, he left the courts and cloister, where the men were still at table, and went back to his pigs.
            Before long the suitors turned to singing and dancing for amusement. Evening was drawing near.
