audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "审慎而有主见", timbre: "成熟清楚", pace: "从容", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "傲慢而咄咄逼人", timbre: "粗厚", pace: "有力", pitch: "中低音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "笃定直接", timbre: "清亮有共鸣", pace: "平稳", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "儿子先回家"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "天刚亮，忒勒马科斯就准备回城。他跟牧猪人欧迈奥斯说起了安排。"
        - id: ch01-b02
          speaker: telemachus
          text: >-
            我先去见母亲。这位老人，晚些由你领进城，让他在那里讨饭。我自己还有一堆事，实在照顾不过来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            奥德修斯没有反对。他穿得太薄，想在火边暖一暖，等外头不那么冷再走。欧迈奥斯完全没想到，两人已经认了父子，还定好了报仇的计划。

            少主回家时，欧律克勒娅正在铺皮褥。她迎过去，其他女人也围来。母亲下楼抱紧他，哭着责备。他连招呼都没打就走了，她真以为以后再见不到。
        - id: ch01-b04
          speaker: telemachus
          text: >-
            母亲，我刚从危险里逃回来，别再怪我了。请替我们祈祷。我去把一起回来的客人接到家里。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他来到集会处，没有理睬求婚人的假客气。朋友庇莱奥斯带着预言者忒奥克吕墨诺斯过来，问从斯巴达带回的礼物要不要送进宫。少主让朋友暂时保管。如果自己被杀，也宁可让朋友留着，不给求婚人分。

            他带先知回去，洗过，坐下用饭。王后在对面纺线，问一路打听到了什么。他说，涅斯托尔款待了自己，墨涅拉奥斯又从海中老神那里听说，父亲被留在卡吕普索的岛上，没有船和水手送回。至于昨天已在猪棚见到父亲，他瞒住了。先知的说法却不同。
        - id: ch01-b06
          speaker: theoclymenus
          text: >-
            奥德修斯就在伊萨卡。他在看这些人做了什么，要向他们报仇。这些，是鸟兆告诉我的。
        - id: ch01-b07
          speaker: narrator
          text: "佩涅洛佩答应，若消息应验，会好好谢他。"
    - id: ch02
      title: "老狗认出了谁"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            在乡下，牧猪人备了手杖。奥德修斯背好破袋，跟着他下山，山路很不好走。快进城时，两人经过一处泉水。白杨树围在周围，水从岩壁流下来，旁边有宁芙的祭坛。

            墨兰提奥斯赶着最好的山羊来，要给求婚人吃。他见了便骂，说牧猪人又添个白吃饭的老人，懒得干活，只会讨要。去了宫里，也会让人用凳子砸出来。说着，他踢了奥德修斯的胯侧。

            奥德修斯站着没动，真想拿杖打死他，或者把他摔在地上，砸碎他的头。但他还是忍了。牧猪人向宁芙祈求，让主人早日回来，别再发生这样的欺凌。牧羊人却说，要把欧迈奥斯装船运去外乡卖掉，还咒少主死，断言主人不可能回家。他先走了，去跟那些人吃饭。

            两人来到宫外，闻到烤肉香，也听见斐弥奥斯的歌声。奥德修斯看着高墙、厚门，还有一间连着一间的屋子，装成头一回来，夸这宅子结实。欧迈奥斯先进去，让他随后跟上。

            马厩边，老狗抬头了。

            那是阿尔戈斯，主人出征前养大的狗。它年轻时，人们常带它打猎，被它盯上的猎物很难逃掉。如今它老了，没有人照顾，满身跳蚤，躺在准备运去肥田的牛马粪上。它认出了主人，垂下耳朵，摇起尾巴。

            可它已经站不起来，走不到他身边了。

            奥德修斯把脸偏开，擦去泪，没让牧猪人看见。
        - id: ch02-b02
          speaker: odysseus
          text: "这狗骨架很好啊。以前拿来打猎吗，还是只因为好看才养着？"
        - id: ch02-b03
          speaker: narrator
          text: |-
            牧猪人说，它从前跑得快，追踪也好。主人走了，没有人好好照看，才成了今天这样。他进了屋。

            阿尔戈斯终于等到了主人。奥德修斯踏进家门，它便死去。
    - id: ch03
      title: "门槛上的客人"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            儿子让牧猪人坐到身边。父亲也进来了，穿着破衣，靠着门柱坐在门槛上。少主拿来面包和肉，交给欧迈奥斯送过去，又叫客人向别人讨些食物。奥德修斯祝福他，吃完这份饭。歌声一停，雅典娜要他挨桌讨饭，看看谁会怎样待他。可她已经打定主意，一个也不让活。

            有人给食物，有人问来处。牧羊人说老人是欧迈奥斯带的，安提诺奥斯便骂牧猪人又招来白吃的人。少主拦住牧人，自己开口。
        - id: ch03-b02
          speaker: telemachus
          text: "你倒替我心疼财产。那也给他一点吧，我准你拿。"
        - id: ch03-b03
          speaker: narrator
          text: >-
            安提诺奥斯拖出凳子，说别人若照他的样子给，老人几个月不敢再来。客人的袋里已经有吃的，还是向他伸手，说看着像个首领，总该大方些。他说自己从前也有钱，也招待过穷困的旅人，接着又编起身世。他远征埃及，手下却不听命令，杀男人，抢走女人和孩子。埃及人打回来，杀了他的一些手下，把剩下的变成奴隶。他被人带到塞浦路斯，才落到如今这地步。安提诺奥斯不听，催他走，说别人拿不归自己的食物送人，自然舍得。奥德修斯转身还了一句。
        - id: ch03-b04
          speaker: odysseus
          text: "可你连别人家的面包都不给。换你自己的，怕是一粒盐也舍不得。"
        - id: ch03-b05
          speaker: narrator
          text: >-
            安提诺奥斯把凳子扔过去，打在奥德修斯右肩上方。老人站得稳稳的，一点没晃，只摇了摇头，提着破袋回到门边。他告诉大家，自己不过饿了，想讨些吃的，却挨了这一下。
        - id: ch03-b06
          speaker: odysseus
          text: "要是有神肯替穷人作主，就让安提诺奥斯还没结婚，先丢了命。"
        - id: ch03-b07
          speaker: antinous
          text: >-
            还不闭嘴！再说一句，我就让仆人抓着你的手脚，拖过院子，活活剥掉你的皮。
        - id: ch03-b08
          speaker: narrator
          text: >-
            其他求婚人也觉得过分，有人提醒，神有时也会装成旅客来访。安提诺奥斯仍不听。忒勒马科斯看父亲受这一击，心里愤怒，却硬忍住了。他没有流泪，也没有为父亲说一句话。
    - id: ch04
      title: "等到日落"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            王后在楼上听说了，便向阿波罗祈祷，求他惩罚安提诺奥斯。管事欧律诺墨说，要是她们的祷告有用，求婚人就全活不过明天。王后恨这群人，最恨安提诺奥斯。

            她叫来牧猪人，想见那位客人，问丈夫的消息。牧人说，听了三天三夜，客人的遭遇还没说完。他自称认识主人，说他活着，就在附近。王后让他快叫，又说，丈夫回来，会同儿子惩罚这群败家人。儿子恰好打了个响亮的喷嚏，王后听得笑了。
        - id: ch04-b02
          speaker: penelope
          text: "这就是说，他们全会被杀，没有人逃得了。客人的话要是真的，我送他衣服，内衣外袍都有。"
        - id: ch04-b03
          speaker: narrator
          text: >-
            欧迈奥斯把邀请告诉他，客人却不马上去见王后。他说，自己知道她丈夫的消息，只是求婚人太凶，刚才挨了打，连个保护他的人也没有。让王后等到日落，给他一个靠火的座位，再问也不迟。佩涅洛佩听了回话，理解他为什么要避开众人，答应等候。

            牧猪人提醒少主小心，吃完饭，回去管猪群，约好明天带牲畜来。求婚人又唱又跳，天渐渐黑了。
        - id: ch04-b04
          speaker: narrator
          text: "奥德修斯坐在自己的门槛上，等黑夜来临。"
