audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    piraeus:
      display_name: 庇莱奥斯
      tts: {delivery: "友善务实", timbre: "开朗清亮", pace: "平稳", pitch: "中音"}
    menelaus:
      display_name: 墨涅拉奥斯
      tts: {delivery: "直率而有威严", timbre: "成熟浑厚", pace: "稳重", pitch: "低音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "笃定庄重", timbre: "清晰有共鸣", pace: "从容", pitch: "中低音"}
    medon:
      display_name: 墨冬
      tts: {delivery: "熟稔务实", timbre: "质朴清楚", pace: "轻快", pitch: "中音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "诚恳热心", timbre: "粗粝温厚", pace: "从容", pitch: "低音"}
    melanthius:
      display_name: 墨兰提奥斯
      tts: {delivery: "傲慢轻蔑", timbre: "粗硬", pace: "利落", pitch: "中低音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "颐指气使而轻蔑", timbre: "浑厚带锋芒", pace: "果断", pitch: "中低音"}
    suitor_young:
      display_name: 年轻求婚人
      tts: {delivery: "直言劝告", timbre: "年轻清晰", pace: "平稳", pitch: "中音"}
    eurynome:
      display_name: 欧律诺墨
      tts: {delivery: "坦率体贴", timbre: "成熟温暖", pace: "舒缓", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "母子重逢"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            清晨的女儿来了，黎明伸出玫瑰色的手指。忒勒马科斯系好凉鞋，拿上一杆结实、握着顺手的长矛，要进城去。他先告诉牧猪人自己的打算。
        - id: ch01-b02
          speaker: telemachus
          text: >-
            老朋友，我得去让母亲见见我。她一天看不到我，就一天不能停止伤心。这位外乡人的遭遇很可怜，你把他也带进城吧。谁肯施舍，他就向谁要点喝的、要块面包。我自己的麻烦已经够多，实在担不起别人的事。他听着不高兴，也只好由他。我宁愿把话说明白。
        - id: ch01-b03
          speaker: odysseus
          text: >-
            公子，我正想走呢。讨饭在城里比在乡下好，总有人愿意给点东西。年纪这么大了，我不想留在这里，听主人随时吩咐。就让这位按你说的，领我去吧。不过先等我烤烤火，也等太阳把天气晒暖一点。这身衣服太薄，早上又结着霜，走这么远，我怕要冻坏了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            忒勒马科斯大步穿过院子，心里一直想着向求婚人报仇。回到家，他把矛靠在回廊的柱子上，走过石板地，进了屋。
            最先看见他的是乳母欧律克勒娅。她正在椅子上铺羊毛皮，一见他，就哭着跑过来。其他女仆也围上去，不住地亲吻他的头和肩膀。佩涅洛佩从房间里出来，美得像阿耳忒弥斯，又像阿佛洛狄忒。她流着泪抱住儿子，吻他的额头，吻那双好看的眼睛。
        - id: ch01-b05
          speaker: penelope
          text: >-
            我眼里的光啊，终于把你盼回来了！我以为永远也看不到你了。你怎么一声都不告诉我，也不问我愿不愿意，就去了皮洛斯？来，把在那里见到的事说给我听。
        - id: ch01-b06
          speaker: telemachus
          text: >-
            母亲，我好不容易才保住命回来，你就别责备我，别让我更难受了。先去洗脸换衣服，带女仆们到楼上，向诸神许个愿。只要宙斯准我们向求婚人报仇，就给众神献上丰盛齐备的百牛大祭。我还得去一趟集会场，请个客人来。他从皮洛斯跟我回来，我让他先随船员走，请庇莱奥斯接到家里照料，等我亲自去请。
        - id: ch01-b07
          speaker: narrator
          text: >-
            佩涅洛佩照着儿子的话去做。她洗过脸，换了衣服，许下丰盛的百牛大祭，只要神灵让她向求婚人报仇。
            忒勒马科斯拿着矛穿过回廊出去，两条跑得很快的狗跟在身边。雅典娜让他的仪容像神一样俊美，人们看到他，都惊讶地望着。求婚人围过来说好话，可心里尽是恶意。他躲开他们，和门托尔、安提福斯、哈利忒尔塞斯坐到了一起。他们是父亲家的老朋友，都要听他讲一路的遭遇。这时，庇莱奥斯陪着忒奥克吕墨诺斯走过城里，来到集会场。忒勒马科斯赶紧迎上去。
        - id: ch01-b08
          speaker: piraeus
          text: >-
            忒勒马科斯，你派几名女仆到我家来吧，把墨涅拉奥斯送你的那些礼物取回去。
        - id: ch01-b09
          speaker: telemachus
          text: >-
            往后的事还说不准，庇莱奥斯。万一求婚人在我家把我杀了，再分掉我的财产，那些礼物我宁可留给你，也不愿落到他们手上。如果我能杀死他们，那时再麻烦你送过来，我会感谢你的。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他把忒奥克吕墨诺斯领回家。两个人把披风放在长凳和椅子上，到浴室洗澡。女仆替他们洗净、涂好油，送来贴身衣服和披风，他们就坐到桌边。一名女仆从精美的金壶里倒水，倒进银盆让他们洗手，又在旁边放好干净的桌子。女管事拿来面包和家里各种好吃的。对面，佩涅洛佩倚在回廊柱边的榻上纺线。两人伸手吃起来，等吃饱喝足，她才问儿子。
        - id: ch01-b11
          speaker: penelope
          text: >-
            我又要上楼，躺回那张让我伤心的床了。你父亲随阿特柔斯的儿子们去特洛伊以后，我天天都用眼泪浸湿它。可求婚人就要回来，你还没好好告诉我，你究竟听没听到父亲回家的消息？
    - id: ch02
      title: "归来的消息"
      blocks:
        - id: ch02-b01
          speaker: telemachus
          text: >-
            母亲，事情是这样的。到了皮洛斯，我们见着涅斯托尔。他带我回家，把我当成远行很久刚回来的亲儿子，他的儿子们也待我一样好。可是你丈夫的消息，他从任何人那里都没听到过，连是死是活也不知道。他就给我备好车马，送我去墨涅拉奥斯那里。我见到了海伦，正是为了她，上天让这么多阿尔戈斯人和特洛伊人受苦。墨涅拉奥斯问我，为什么来拉刻代蒙，我把实情全告诉了他。他这样回答我。
        - id: ch02-b02
          speaker: menelaus
          text: >-
            这些胆小鬼居然想占勇士的床！这就像母鹿把刚生下的小鹿放在狮子窝里，自己去林子里、长着青草的山谷里吃草。狮子回家，那母子哪还有活路？奥德修斯回来，对求婚人也是一样。我向父亲宙斯、雅典娜和阿波罗起誓，只要他还有当年的本领！他在莱斯博斯和菲洛墨勒伊德斯摔跤，把对方重重摔倒，希腊人都给他喝彩。这样的奥德修斯一旦回来，那些人的日子就没几天了，婚礼也要变成惨事。你问的消息，我不会绕着说，也不瞒你。海中老人怎么告诉我，我就怎么告诉你。他看见奥德修斯在一个岛上，在仙女卡吕普索家里痛哭。她把他关在那里。他没有船，也没人替他驾船渡海，所以一直回不来。
        - id: ch02-b03
          speaker: telemachus
          text: >-
            墨涅拉奥斯说的就是这些。听完以后，我便动身回程。诸神送来好风，没过多久，我就平平安安到家了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            佩涅洛佩听得心中一阵感动。忒奥克吕墨诺斯接过话来。
        - id: ch02-b05
          speaker: theoclymenus
          text: >-
            夫人，奥德修斯的妻子，忒勒马科斯还不懂得看征兆，你听我说。我能看明白，而且会把知道的全告诉你。请天上的君王宙斯、请我们待客的礼法，也请这座我来投奔的奥德修斯家的炉灶，为我作证。奥德修斯已经在伊萨卡了。他也许在各地走，也许留在某处，正在查这些恶人干过什么，准备跟求婚人算账。我在船上看到了征兆，指的就是这件事。我当时就讲给忒勒马科斯听了。
        - id: ch02-b06
          speaker: penelope
          text: >-
            但愿你说得对！这话果然成真，我一定厚厚送礼，真心待你。谁见了你，都会庆贺你的好运。
        - id: ch02-b07
          speaker: narrator
          text: >-
            屋里的人这样谈着，求婚人却在屋前平地上掷铁饼，拿长矛投靶，像平时一样横行无忌。该吃饭了，周围乡间的羊群也照常由牧人赶进城来，有绵羊，也有山羊。侍从墨冬很得求婚人喜欢，席间也由他伺候。他招呼众人进去。
        - id: ch02-b08
          speaker: medon
          text: >-
            各位年轻的主人，游戏先玩到这里吧。回屋，我们好开饭。到了吃饭的时候，吃一顿可没什么不好。
        - id: ch02-b09
          speaker: narrator
          text: >-
            大家停下手，走进屋，脱下披风放在长凳和座椅上。为了这顿饭，他们宰献了绵羊、山羊、猪和一头小母牛，都是肥壮、长得好的牲畜。
            这时候，奥德修斯和欧迈奥斯也准备从牧场出发了。
        - id: ch02-b10
          speaker: eumaeus
          text: >-
            外乡人，你还是想今天进城吧？小主人也是这么吩咐的。照我的想法，倒希望你留在牧场干活。可主人的话不能不听，否则回来要责骂我。挨主人的骂，不是闹着玩的。我们这就走吧，天已经大亮了，不多久又要黑，晚上你会更冷。
        - id: ch02-b11
          speaker: odysseus
          text: >-
            你的意思我都懂，不用再解释。走吧。如果手边有削好的木棍，就给我拿来拄着。听你说，路上并不好走。
    - id: ch03
      title: "山泉边的辱骂与老狗"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            奥德修斯用那根绳子，把破褡裢挎上肩头。欧迈奥斯找来一根他用着合适的棍子。两人把牧场留给牧人和狗，动身了。牧猪人领路，主人却跟在后头，穿着破衣、靠着手杖，像个衰弱潦倒的老流浪汉。
            他们走过陡峭的山路，快进城时，到了一处供城里人取水的泉边。它是伊萨科斯、涅里托斯、波吕克托尔修建的。爱水的白杨树围成一圈，清凉的泉水从高高的岩石上流下来。上方有仙女的祭坛，过路的人都常在这里献祭。
            多利奥斯的儿子墨兰提奥斯正好追上来。他带着两个牧人，赶了些羊群里最好的山羊，给求婚人送饭食。他看见两个人，就用很难听的话大骂起来，奥德修斯听得怒火直冒。
        - id: ch03-b02
          speaker: melanthius
          text: >-
            你们俩倒配得很！上天也知道什么人该跟什么人凑一对。牧猪的大爷，你领着这可怜虫去哪儿？叫这种人上桌，谁看着都要反胃。他靠什么本事赢过奖？无非是一路蹭着人家的门柱，家家去讨。他求的可不是男人该求的宝剑、大釜，只是些不值一提的残食。把他交给我吧，在牧场扫扫羊栏，给小羊送点鲜美的草，乳清随他喝，喝得大腿肥起来都成。可这种人学了坏习惯，根本不肯工作，只愿满城要饭，填那永远吃不饱的肚子。我告诉你，一定会这样。他敢进奥德修斯家，人家扔来的凳子会把他脑袋砸破，直到把他赶出去！
        - id: ch03-b03
          speaker: narrator
          text: >-
            从身边走过时，墨兰提奥斯还无缘无故往奥德修斯臀侧踢了一脚。奥德修斯没有挪步。他一度想扑过去，拿棍子打死他，或者把他摔倒，砸出脑浆。可他到底忍住，控制住了自己。欧迈奥斯盯住墨兰提奥斯，举起双手，向上天祷告，也向他发出责骂。
        - id: ch03-b04
          speaker: eumaeus
          text: >-
            泉里的仙女，宙斯的女儿们，要是奥德修斯曾把羊羔、小山羊的腿骨裹着肥脂烧献给你们，就答应我的祈求，求上天把他送回来。他回来，就能叫墨兰提奥斯这样的人闭嘴。他们只会四处吓唬、辱骂人，整天在城里乱逛，羊却没人好好照料，眼看着衰败！
        - id: ch03-b05
          speaker: melanthius
          text: >-
            你这坏脾气的狗，在嚷什么？哪天我把你装船运走，到外国卖掉，卖的钱就归我。奥德修斯绝不可能回来了，这我很有把握。我真希望今天阿波罗就杀掉忒勒马科斯，或者那些求婚人杀了他，也跟这件事一样有把握！
        - id: ch03-b06
          speaker: narrator
          text: >-
            他急匆匆先走，任两人在后面慢慢赶路。很快，他便进了主人的屋子，在求婚人中坐下，正对着最喜欢他的欧律马科斯。仆人给他肉，女管事端来面包。
            奥德修斯和欧迈奥斯随后也到了。屋里传来乐声，斐弥奥斯才开始给求婚人唱歌。奥德修斯拉住欧迈奥斯的手。
        - id: ch03-b07
          speaker: odysseus
          text: >-
            这就是奥德修斯的家，欧迈奥斯，真是一所好宅子。天下走遍，也很难找到几个这样的。一座房子挨着一座，外院四周的墙都带着垛口。那两扇大门也做得好，要动武打进去，怕是不容易。里面吃饭的人肯定不少，烤肉的味道都飘出来了，还有乐声。神造出音乐，本来就是给宴饮作伴的。
        - id: ch03-b08
          speaker: eumaeus
          text: >-
            平常你就很会看，这回也看对了。不过先想想怎么进去吧。你先去，坐到求婚人当中，我留着随后来？还是我先，你在门外等一会儿？可千万别等太久，有人看你在这里徘徊，可能会拿东西砸你。你选个主意吧。
        - id: ch03-b09
          speaker: odysseus
          text: >-
            好，我听明白了。你进去，我等着。被打、被人扔东西，我都习惯了。打仗和航海吃过那么多苦，早磨得皮实，再加这一回也无妨。可肚子饿，谁也掩饰不了。它就像仇敌，让人人受罪。人之所以造好船出海，去攻打别人，往往就是为了它。
        - id: ch03-b10
          speaker: narrator
          text: >-
            正说话，一条睡着的狗抬起头，耳朵竖了起来。它叫阿尔戈斯。奥德修斯去特洛伊前把它养大，却还没能亲自带它打猎。从前，小伙子们猎野山羊、鹿、野兔，都带着它。现在主人不在，谁也不照料。它满身跳蚤，躺在牲口棚门口的骡粪和牛粪上。那些粪等着人来运走，给大片围起来的田地施肥。
            看见奥德修斯，阿尔戈斯垂下耳朵，摇着尾巴，可它没力气走到主人身边。奥德修斯隔着院子望见它，悄悄擦掉一滴眼泪，没让欧迈奥斯看到。
        - id: ch03-b11
          speaker: odysseus
          text: >-
            粪堆上那条猎狗，长得真好，欧迈奥斯。它的本领也这么好吗？还是只养着给人看，平常跟着饭桌讨吃的？
        - id: ch03-b12
          speaker: eumaeus
          text: >-
            它的主人已经死在远方了。奥德修斯出海的时候，这条狗可了不得。只要让它嗅到踪迹，林里什么野兽都跑不了。如今可苦了它，主人死了，女人们谁也不管。奴仆没有主人在旁督促，就不会好好办事。宙斯让一个人做奴隶时，连他一半的美德也会拿走。
        - id: ch03-b13
          speaker: narrator
          text: >-
            欧迈奥斯说着，走进屋子，去求婚人待着的回廊。阿尔戈斯认出了主人。随后，它死去了。
    - id: ch04
      title: "挨席讨饭"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            忒勒马科斯最早看见欧迈奥斯，招手让他坐过来。欧迈奥斯找了找，看见替求婚人切肉的人旁边有张凳子，就搬到忒勒马科斯桌前，在他对面坐好。侍从分给他肉，又从篮里拿了面包。
            奥德修斯紧跟着进来，衣服破破烂烂，拄着棍子，模样是个可怜的老乞丐。他坐在外院通往内院的门内，那道门槛是梣木做的。身后是柏木柱子，木匠刨得光滑，用尺和墨线对准，接得很严密。忒勒马科斯拿起整块面包，又捧起两手能拿下的肉，叫欧迈奥斯送过去。
        - id: ch04-b02
          speaker: telemachus
          text: >-
            给外乡人带去。再告诉他，绕着席间向那些求婚人挨个要点。要当乞丐，就别怕难为情。
        - id: ch04-b03
          speaker: narrator
          text: >-
            欧迈奥斯来到奥德修斯跟前。
        - id: ch04-b04
          speaker: eumaeus
          text: >-
            这是忒勒马科斯给你的。他还说，向求婚人一个一个讨些食物吧，乞丐不能因为害羞就不开口。
        - id: ch04-b05
          speaker: odysseus
          text: >-
            愿宙斯君王把幸福赐给他，让忒勒马科斯心里想的事都能实现。
        - id: ch04-b06
          speaker: narrator
          text: >-
            奥德修斯伸出双手接住，把吃的放在脚边肮脏的旧褡裢上。歌人唱着，他便吃着，等歌曲唱完，他也吃好了。求婚人一片喝彩。雅典娜走近奥德修斯，让他向每个求婚人讨面包，从而看看他们谁好谁坏。不过结果怎样都一样，她没打算放过任何一个。
            他从左边开始，一个个伸手讨要，样子和真的乞丐一模一样。有的人可怜他，又觉得好奇，就彼此打听这是谁，是哪儿来的。牧羊人墨兰提奥斯对众人说起来。
        - id: ch04-b07
          speaker: melanthius
          text: >-
            向我那高贵女主人求婚的诸位，我能说一点他的来历，我先前见过他。是牧猪人带来的。至于这人到底什么身份、什么地方来的，我不知道。
        - id: ch04-b08
          speaker: narrator
          text: >-
            安提诺奥斯听了，便冲着牧猪人骂。
        - id: ch04-b09
          speaker: antinous
          text: >-
            你真是个蠢货！干什么把他往城里带？讨饭的、流浪的还嫌少吗？吃顿饭都给他们缠住。这些人围着你主人的家产糟蹋，你觉得还不够，还要添一个？
        - id: ch04-b10
          speaker: eumaeus
          text: >-
            安提诺奥斯，你家世虽好，嘴上却不干净。他可不是我专门请来的。谁会跑到外国请个人回来，除非那人有本事帮大家？譬如会占卜、会治伤、会做木工，或会唱歌，让人听得入迷。这些人在哪儿都有人欢迎，谁会请个乞丐来给自己添愁？你对奥德修斯的仆人，比别的求婚人都坏，对我更坏。可佩涅洛佩和忒勒马科斯只要还活着、还住在这里，我就不怕。
        - id: ch04-b11
          speaker: telemachus
          text: >-
            欧迈奥斯，不用说了，别跟他争。安提诺奥斯的嘴在这些人里最毒，还带坏了其他人。
        - id: ch04-b12
          speaker: narrator
          text: >-
            忒勒马科斯又向安提诺奥斯开了口。
        - id: ch04-b13
          speaker: telemachus
          text: >-
            你这么替我精打细算，安提诺奥斯，莫非把我看作你的儿子？何苦一定要赶外乡人走？但愿诸神不准！你就自己拿些食物给他，我乐意，我准你拿。用不着担心我母亲，也不用理会家里的仆人。可我看你不会拿的，你宁可把东西吃进自己嘴里，哪会给人。
        - id: ch04-b14
          speaker: antinous
          text: >-
            忒勒马科斯，摆这么大的口气，是想说什么？我们每个人都像我打算给的那样，给他一份，他至少得三个月不来这儿。
        - id: ch04-b15
          speaker: narrator
          text: >-
            他把桌子下面垫脚的凳子拖出来，那双脚倒是娇贵。他摆出要砸奥德修斯的架势。其他求婚人却都施舍了一些，褡裢里装满了肉和面包。奥德修斯打算回门槛吃饭，可回去之前，他先来到安提诺奥斯面前。
    - id: ch05
      title: "砸来的脚凳"
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: >-
            老爷，你也分我一点。这里最穷的总不是你吧？看起来，你倒像个首领，比众人都强。那你也该多给一些，我到哪儿都会传你的好名声。我从前家产也多，住着好房子，接济过不少像现在的我这样的穷人。不管什么来路，想要什么，我都给。家里仆人多得数不完，富人所有的东西，我也都有。可是宙斯不肯让我留着，样样都拿走了。他叫我跟着一群到处抢劫的海盗，去了一趟遥远的埃及。这一趟就把我毁了。我们的船停在埃古普托斯河，我要手下留在船边看守，又派探子去各处能看得清的地方，察看地形。
            可手下不肯听话，自作主张去劫掠埃及人。他们杀男人，抢走妻子和孩子。城里很快知道了，听到迎战的喊声，天一亮，人们就全出来。平地上到处是骑马和步行的士兵，盔甲亮闪闪。宙斯让我们心里害怕，手下一看四面都给围住，再也不肯打。许多人让埃及人杀了，剩下的被捉去干苦活。我被他们交给一个正巧遇见的朋友，让他带往塞浦路斯。他叫德墨托尔，父亲是伊阿索斯，在塞浦路斯是个大人物。从那儿到这儿，我就成了眼前这个倒霉样子。
        - id: ch05-b02
          speaker: antinous
          text: >-
            哪位神给我们送来这么个祸害，吃饭也不让清静！给我到院子没屋顶的地方去！这么纠缠，这么没礼貌，我还让你尝尝埃及、塞浦路斯那套。别人你都求过，别人也都给得多。他们手边东西多呀，反正是别人的财产，花起来有什么心疼的！
        - id: ch05-b03
          speaker: narrator
          text: >-
            奥德修斯转身，一边离开一边回答。
        - id: ch05-b04
          speaker: odysseus
          text: >-
            老爷，你这张脸，可比你这副心肠体面。在别人家里，东西堆着，你连一片面包都不肯分给穷人。换成你自己家，怕是一撮盐也讨不到。
        - id: ch05-b05
          speaker: narrator
          text: >-
            安提诺奥斯气坏了，瞪着他。
        - id: ch05-b06
          speaker: antinous
          emotion: angry
          text: >-
            说这话，就别想好好走出院子！我让你付出代价！
        - id: ch05-b07
          speaker: narrator
          text: >-
            他把脚凳扔了过去，砸在奥德修斯后背上方的右肩胛。奥德修斯像岩石一样站住，连身子也没晃。他默默摇头，心里想着怎么报仇，随后回到门槛上坐好，把满满的褡裢放在脚边，朝求婚人喊起来。
        - id: ch05-b08
          speaker: odysseus
          text: >-
            来向佩涅洛佩王后求婚的人，都听听我的心里话。护着自己的财物、自己的牛羊挨了打，人也不觉得痛。可我为这可怜肚子奔波，安提诺奥斯就打我。肚子总把人拖进麻烦里。倘若穷人也有神来护着，也有神替他伸冤，我就请这些神让安提诺奥斯在成亲以前遭到恶报，死得凄惨。
        - id: ch05-b09
          speaker: antinous
          emotion: angry
          text: >-
            要吃就老老实实坐着吃，要不就滚！再开口，我叫人抓住你手脚，在院子里拖，让仆人把你活活剥皮！
        - id: ch05-b10
          speaker: narrator
          text: >-
            别的求婚人都很不赞同。一个年轻人出来劝他。
        - id: ch05-b11
          speaker: suitor_young
          text: >-
            安提诺奥斯，这么穷苦的流浪汉，你不该动手。万一他是哪位神，你就更倒霉了。神常常扮作异国来的旅客，我们都知道。他们换着各样身份走遍世间，看谁做坏事，谁做正当的事。
        - id: ch05-b12
          speaker: narrator
          text: >-
            安提诺奥斯不把他们的劝告放在心上。忒勒马科斯看见父亲挨打，愤怒得很，却始终没有掉泪。他一声不响地摇头，也在盘算着复仇。
    - id: ch06
      title: "等到日落"
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            佩涅洛佩听到消息，那乞丐在宴客的回廊受了殴打。她当着女仆们的面，诅咒安提诺奥斯。
        - id: ch06-b02
          speaker: penelope
          text: >-
            但愿阿波罗照样给你一击，安提诺奥斯！
        - id: ch06-b03
          speaker: eurynome
          text: >-
            神灵若肯答应我们的祈求，那群求婚人就别想有谁还能活到太阳再升起来。
        - id: ch06-b04
          speaker: penelope
          text: >-
            乳母，他们没有一个不想干坏事，我没有一个不恨。不过安提诺奥斯最让我痛恨，像死亡的黑暗一样。一个外乡人走投无路，到这里求点饭吃，大家都往他褡裢里放了东西，唯独安提诺奥斯，竟拿脚凳打他的右肩胛！
        - id: ch06-b05
          speaker: narrator
          text: >-
            她在房里和女仆谈着，奥德修斯这时正在吃饭。佩涅洛佩把欧迈奥斯叫了来。
        - id: ch06-b06
          speaker: penelope
          text: >-
            去请那位外乡人，我有事想问他，也想见见他。他去过的地方看来不少，或许见过我那不幸的丈夫，或听过他的消息。
        - id: ch06-b07
          speaker: eumaeus
          text: >-
            夫人，要是阿开亚人不吵，你听他的经历，一定会听住。他从船上逃走以后，第一个就找到了我的小屋，住了整整三天三夜，受过的那些苦都没讲完。我坐着听，听得入神。就是神亲自教出来的最好的歌人，让所有人都舍不得错过一个字，也只能让我这样入迷。他说他家和奥德修斯家是老交情，自己出身克里特，就是弥诺斯后人居住的岛。一路灾祸把他赶来赶去，才到了这儿。而且他听说，奥德修斯还活着，就在不远处忒斯普罗提亚人那儿，要带很多财宝回来。
        - id: ch06-b08
          speaker: penelope
          text: >-
            那快请来，我也要听。求婚人爱在里面玩还是外面玩，都由他们，他们哪里有什么愁？粮和酒好端端留在自己家，只有家里仆人在吃用。他们每天耗在我们这里，杀我们的牛、绵羊、肥山羊开宴，喝掉的酒多少也从不在意。这样的败法，哪家能撑得下去？奥德修斯又不在，没人护着我们。只要他回来，父子俩很快就能报仇。
        - id: ch06-b09
          speaker: narrator
          text: >-
            话到这里，忒勒马科斯打了个大喷嚏，响声传遍整所房子。佩涅洛佩一听笑了，又叫欧迈奥斯。
        - id: ch06-b10
          speaker: penelope
          text: >-
            去吧，把外乡人带来。刚才我说话时，儿子打喷嚏，你听到了吧？这分明说求婚人都会死，一个不留。你还记住，外乡人要是说实话，让我信得过，我就送他耐穿的衣服，一件贴身的，一件披风。
        - id: ch06-b11
          speaker: narrator
          text: >-
            欧迈奥斯立刻赶去传话。
        - id: ch06-b12
          speaker: eumaeus
          text: >-
            老客人，忒勒马科斯的母亲，我的女主人佩涅洛佩，有请。她心里难过，盼着听你讲丈夫的消息。你要让她相信话是真的，她会把贴身衣裳、披风送给你，你缺的正是这两样。至于吃饭，城里挨户讨一点，愿意的人总会给，够你吃饱。
        - id: ch06-b13
          speaker: odysseus
          text: >-
            告诉她的事，我一定不会掺假。她丈夫的经历我很清楚，我跟他一起吃过苦。不过，穿过这些求婚人，我怕。他们这么残忍，横得连天都够得着。刚才我好好走着，没有害谁，就狠狠挨了一下，疼得很。忒勒马科斯也好，别人也好，都没替我挡。所以还是请佩涅洛佩等一等，到太阳落山再见。让我坐在火边吧，衣服太薄了。你从我头回求你帮忙，就见过这一身。坐下以后，她尽管问丈夫归来的事。
        - id: ch06-b14
          speaker: narrator
          text: >-
            欧迈奥斯回去，才跨进门，佩涅洛佩就问。
        - id: ch06-b15
          speaker: penelope
          text: >-
            人怎么没有来，欧迈奥斯？怕有人对他不好？还是不敢进内屋，觉得不好意思？讨饭的人哪能总顾着害羞。
        - id: ch06-b16
          speaker: eumaeus
          text: >-
            他想得有道理，夫人。这些求婚人，谁不想躲开呢？他希望你等到日落。那时单独谈，你想听多少、问多少都行，比现在强。
        - id: ch06-b17
          speaker: penelope
          text: >-
            他倒是个聪明人，担心的事也确实会发生。世上哪里还能找到比这群人更坏的！
        - id: ch06-b18
          speaker: narrator
          text: >-
            事情都解释清楚，欧迈奥斯便回到求婚人那边。他走到忒勒马科斯耳边，用旁人听不到的声音叮嘱。
        - id: ch06-b19
          speaker: eumaeus
          text: >-
            公子，我回去管猪，照料你的家产，做我该做的。你在这里看好一切，头一件就是别遇险。想害你的人多得很。愿宙斯在他们动手之前，先让他们遭到恶报。
        - id: ch06-b20
          speaker: telemachus
          text: >-
            行，吃完再走。明天一早带上当天献祭用的牲口来，剩下的就交给诸神和我。
        - id: ch06-b21
          speaker: narrator
          text: >-
            欧迈奥斯重新坐下，吃好饭，离开院子和回廊。那群人还在桌旁，他已回去照看猪群了。天快晚了，求婚人又开始唱歌、跳舞，尽情取乐。
