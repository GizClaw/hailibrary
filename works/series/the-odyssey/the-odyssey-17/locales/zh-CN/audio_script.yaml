audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "先回家的人"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            天一亮，忒勒马科斯便要走了。他对欧迈奥斯说，自己事情太多，顾不上这位客人，可以晚些带老人进城，那儿讨饭方便。奥德修斯答应，只想先烤烤火，等外头暖些再动身。两人故意像不熟悉一样说话，牧猪人没发现他们的秘密。

            年轻人回到家，欧律克勒娅正在座位上铺皮褥，最先跑过来。其他侍女也围拢了。佩涅洛佩从楼上下来，抱住儿子，哭着责备他。他离开时一句话也没说，她以为这辈子见不着他了。
        - id: ch01-b02
          speaker: telemachus
          text: >-
            母亲，我好不容易回来，你先别怪我。请替我们祈求神明。我去接一下跟我来的客人。
        - id: ch01-b03
          speaker: narrator
          text: |-
            忒勒马科斯走到集会的地方，没有理会求婚人那些假装亲切的话。庇莱奥斯陪着预言者忒奥克吕墨诺斯来了，问礼物要不要送回宫里。年轻人让他继续收着。如果自己被害，礼物宁可归朋友，也别落到求婚人手里。

            他把预言者带回家，洗漱吃饭。母亲在对面纺线，等着听父亲的消息。他讲涅斯托尔怎样款待自己，也说到墨涅拉奥斯从海中老神那里得来的消息。奥德修斯活着，卡吕普索把他留在岛上，既无船只，也没水手能送他回来。猪棚里已经相认的事，儿子没有透露。忒奥克吕墨诺斯却说，鸟兆告诉他，奥德修斯已在伊萨卡，察看着求婚人的罪过，要向他们报仇。佩涅洛佩很想信他，又不敢马上放心。她许诺，若这话应验，会好好酬谢。
    - id: ch02
      title: "泉水旁和宫门前"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            欧迈奥斯给客人备了手杖。奥德修斯背好破袋，跟他下了山。快进城时，他们经过白杨树围着的泉水，水从石壁流下，边上是宁芙的祭坛。墨兰提奥斯赶着好山羊追了上来，要送去给求婚人吃。他嘲笑欧迈奥斯又找了个人白吃饭，还说老人懒得做事，只会讨要。进了宫，自然有人用凳子把他砸出来。他经过奥德修斯身边，竟踢了他的胯侧一脚。

            奥德修斯一步没退。他想过用手杖把这个人打死，或摔在地上，砸碎他的头，最后还是强忍住了。欧迈奥斯向宁芙祈祷，盼奥德修斯回来，让这人再不能横行。墨兰提奥斯威胁把牧猪人卖到海外，咒少主死，又说主人永远回不来了，便赶着去跟求婚人一起吃饭。

            到了宫外，奥德修斯闻见烤肉味，听见斐弥奥斯唱歌。他望着高墙、厚门和一重重房屋，却像第一次来的人，夸赞这地方盖得牢固又漂亮。欧迈奥斯准备先进去，再让客人跟上。

            马厩边的老狗抬头了。

            它叫阿尔戈斯，是奥德修斯出征前养大的。年轻时，人们带它去打猎，猎物很难甩掉它。如今它老了，身上生着跳蚤，睡在一堆准备运到田里的粪肥上，也没人照料。听到声音，它认出了主人，垂下耳朵，摇了摇尾巴。

            可它站不起来，没法走到主人脚边。

            奥德修斯转开脸，不让欧迈奥斯看见眼泪，抹掉之后才问。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            那条狗体形很好啊，以前会打猎吗？还是只因为好看才养着？
        - id: ch02-b03
          speaker: narrator
          text: |-
            欧迈奥斯说，它原是主人的猎犬，跑得快，也会追踪。主人走了，没有人照顾它，就成了眼前的样子。说完，他进了屋。

            阿尔戈斯总算又见到了主人。奥德修斯进门的时候，它便死了。
    - id: ch03
      title: "忍住那一下"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            忒勒马科斯让牧猪人坐在自己旁边。随后，老人穿着破衣进来，靠着门柱，在门槛上坐下。儿子让欧迈奥斯送去面包和肉，还请客人向其他人讨一些。奥德修斯祝愿少主有福，吃了这顿饭。唱歌停下后，雅典娜叫他逐桌走一遍，看看各人如何待他。可她早已打定主意，一个也不会让他们活下来。有的给他食物，有的问他来处。墨兰提奥斯说，他是牧猪人带来的。安提诺奥斯便骂欧迈奥斯，为什么还招人来白白吃掉主人的东西。牧猪人想反驳，忒勒马科斯拦住他，自己回答。
        - id: ch03-b02
          speaker: telemachus
          text: >-
            你这么替我的财产操心，就也分些给他吧。我同意你拿。
        - id: ch03-b03
          speaker: narrator
          text: >-
            安提诺奥斯拖出脚凳，说人人像他这么给，老头几个月都不会再来。奥德修斯已有不少吃的，还去找他，说当首领该更慷慨。他曾富有，也款待过穷客，接着又编故事。到了埃及，部下违令抢掠，杀了男人，抓走女人孩子，埃及人还击，杀一些，把其余当奴隶。他被交给人，带到塞浦路斯，如今才这么穷。安提诺奥斯催他走，说别人施舍，是东西本来不归自己。老人转身回话。
        - id: ch03-b04
          speaker: odysseus
          text: >-
            可你连他人的面包都不愿给。要是自己的，恐怕一粒盐也舍不得吧。
        - id: ch03-b05
          speaker: narrator
          text: |-
            安提诺奥斯抡起凳子扔来，砸中他的右肩上方。奥德修斯身子都没晃，只摇摇头，带着袋子回去坐下。他告诉众人，自己想填饱肚子，竟挨了一下。倘若有神替穷人主持公道，就让安提诺奥斯还没结婚便送命。那人又扬言，仆人会抓住他的手脚，拖着穿过院子，活剥他的皮。连其他求婚人也不赞成了。有一个提醒他，神也可能扮成陌生人来做客。安提诺奥斯听不进去。忒勒马科斯看见这一切，愤怒极了，仍忍着泪，没说一句话。
    - id: ch04
      title: "等到天黑"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            佩涅洛佩在楼上听说了这事，求阿波罗狠狠惩击安提诺奥斯。欧律诺墨说，如果她们的祈祷应验，这些人全都活不到明天。王后憎恨他们，最恨的就是安提诺奥斯。她又把欧迈奥斯叫来，想见那位去过许多地方的客人，问他丈夫的下落。牧猪人说，听了三天三夜，也没听完这人的遭遇。他自称认识奥德修斯，还说主人仍活着，就在附近。王后催欧迈奥斯去叫他，又说若丈夫真回来了，他和儿子一定能惩罚这些糟蹋家产的人。

            正说到这里，忒勒马科斯打了个大喷嚏，满屋都听得见。佩涅洛佩笑了。她认为这表明求婚人都会被杀，谁也逃不掉。她还答应，如果客人说的是真话，就送他内衣和外袍。牧猪人下去传话，老人却没有起来。他请等到太阳落山。丈夫的消息他知道，只是这些人太凶，刚挨了凳子，也没人护着他。他想晚一点在火边坐下，再回答王后的问题。她听完回话，明白客人的担心，答应等。

            欧迈奥斯让忒勒马科斯当心，吃完饭，回乡下照顾猪群，约好明天再送牲口过来。求婚人开始唱歌跳舞，暮色渐渐到了门前。

            奥德修斯仍坐在自己的门槛上，等夜色降下来。
