  - {id: elpenor, description: "未被安葬的船员，要求把生前的桨立在坟上"}
  - {id: tiresias, description: "死后仍保有先知神智的忒拜人，指出牛羊禁令及以后的旅程"}
  - {id: anticlea, description: "奥德修斯的母亲，讲述思念和家人近况"}
  - {id: alcinous, description: "宴席中的国王，请客人继续讲战友的消息"}
  - {id: agamemnon, description: "在家中宴席遇害的统帅，仍盼听到儿子的消息"}
  - {id: achilles, description: "看重活着胜于死后荣耀的英雄，牵挂老父亲与儿子"}
  - {id: ajax, description: "仍不肯原谅铠甲裁决、保持沉默的亡魂"}
  - {id: heracles, description: "留在冥府的英雄之影，讲述艰苦劳役与神的援助"}
