labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
research: required
premise: >
  为寻归路，奥德修斯抵达亡魂聚集的岸边。未葬同伴索求一个坟，先知留下禁令与尚未结束的行程，
  母亲说出家的消息却无法拥抱。战友们的遗憾、牵挂与沉默，让他带着这些声音返回活人的船。
characters:
