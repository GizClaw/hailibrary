  chapters:
    - id: ch01
      title: Blood beside Oceanus
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            Once we were down at the shore, we drew our ship into the water and brought her mast and sails aboard. We put the sheep into the ship as well. Then we took our places, weeping and filled with misery. Circe, that powerful and cunning goddess, gave us a favorable wind blowing straight from behind. It followed us steadily, keeping every sail stretched full all the time. We did whatever work was needed on the ship's equipment, then let her run in the direction set by the wind and the man at the rudder. Through the whole day she held her course across the sea, her sails still full. At last the sun went down, and darkness spread across the earth. We entered the deep waters of the river Oceanus, where the land and city of the Cimmerians lie. Thick mist and darkness surround those people. No ray of sunlight can break through to them, either when the sun rises or when it descends again from heaven. The poor creatures live in one unending night of sadness. There we pulled our ship up onto the shore and took the sheep out. We walked beside the waters of Oceanus until we came to the very place Circe had described.

            Perimedes and Eurylochus held the animals while I drew my sword and dug the trench. It was a cubit long, a cubit wide and a cubit deep. I poured offerings for all the dead, first honey and milk, then wine, and finally water. Over it all I scattered white barley meal. I prayed earnestly to the helpless ghosts and promised that when I returned to Ithaca, I would offer them the best barren heifer I owned and pile good things on their fire. I made a special promise to Teiresias too. He would have a black sheep all to himself, the best in my flocks. After those prayers I cut the throats of both sheep and let their blood flow into the trench.

            The ghosts began pouring out of Erebus. There were brides and young unmarried men, old men worn out with work, girls disappointed in love, and warriors killed in battle, with blood still staining their armor. They came from every direction and drifted round the trench. Their strange screams made me go pale with fear. Seeing them come, I told the men to hurry. They must skin the dead sheep and burn them in sacrifice, praying as they did so to Hades and Proserpine. I stayed beside the blood with my sword drawn. Not one of those poor ghosts could come near until Teiresias had answered me.

            The first spirit I saw was our companion Elpenor. He had not yet been put into the earth. We had been too busy with other things and had left his body at Circe's house, without either a wake or a burial. I felt such pity that I cried at the sight of him. Elpenor, I asked, how have you come to this dark place? You have reached it on foot before I could get here in my ship. He groaned as he answered.
        - id: ch01-b02
          speaker: elpenor
          text: |
            Sir, it was my bad fortune, and the shameful way I got drunk. I was asleep on Circe's roof. When I got up, I never thought of using the great staircase. I fell straight off and broke my neck, and my soul came down to Hades. Now I beg you by the people you have left at home, although they are not here with us. Think of your wife, and of the father who raised you, and Telemachus, the one hope of your household. For their sake, grant what I am asking.

            I know that after you leave this place of the dead, you will sail back to Aeaea. Do not leave me there again without a wake or a grave. Otherwise I may bring the gods' anger on you. Burn my body with whatever armor I have. Raise a mound for me by the sea, so that people in years to come will know how unlucky I was. Put my oar on top of my grave, the oar I used when I was alive and rowing with my companions.
        - id: ch01-b03
          speaker: odysseus
          text: |
            My poor friend, I told him, everything you ask will be done. So we sat there speaking sadly to each other. I was on one side of the trench with my sword held above the blood, and his ghost spoke to me from the other side.

            Then I saw the spirit of my mother, Anticlea, the daughter of Autolycus. She had been alive when I left for Troy. Seeing her brought tears to my eyes. Yet even then, with all that sorrow in me, I would not let her near the blood until I had spoken to Teiresias. Soon the Theban prophet's spirit appeared, carrying his golden scepter. He recognized me.
        - id: ch01-b04
          speaker: tiresias
          text: |
            Ulysses, noble son of Laertes, why have you left the daylight, poor man, to visit the dead in this unhappy place? Step back from the trench and put away your sword. Let me drink the blood, and I will give you truthful answers.
        - id: ch01-b05
          speaker: odysseus
          text: |
            I stepped aside and sheathed my sword. He drank the blood, and then he began to tell my future.
        - id: ch01-b06
          speaker: tiresias
          text: |
            You want to know how to return home. The gods will make that hard for you. I do not think you can avoid Neptune's watchful eye. He has not let go of his bitter anger over the son you blinded. Still, after much hardship, you may reach home. When your ship comes to Thrinacia, you must control yourself and your companions. The Sun keeps his cattle and sheep there, and he hears and sees everything. Leave those animals unharmed and keep your minds on reaching home. If you do that, you may get back to Ithaca after all your suffering. If you hurt them, I warn you now that your ship and crew will be destroyed. Even if you escape, you will come home in misery, with every companion lost, in a ship belonging to someone else. Trouble will be waiting in your house. Arrogant men will have overrun it and will be eating up your wealth, pretending to court your wife and offer her gifts.

            Once you are home, you will take revenge on the suitors. After you have killed them in your own house, by strength or cunning, take a well-made oar and carry it inland. Keep going until you reach people who have never heard of the sea. They put no salt in their food. They know nothing of ships, or of the oars that serve a ship as wings. I will give you a sign you cannot mistake. A traveler will meet you and say that you are carrying a winnowing shovel on your shoulder. When that happens, plant the oar in the earth. Sacrifice a ram, a bull and a boar to Neptune. Then go home and offer a hundred beasts to each of the gods in heaven, one after another.

            Your own death will come from the sea. It will take you very gently, when you are old and your mind is at peace, and your people will bless you. Everything I have told you will come to pass.
        - id: ch01-b07
          speaker: odysseus
          text: |
            Let it be as heaven chooses, I answered. But tell me this. Please tell me, and tell me truly. My poor mother's spirit is sitting nearby, beside the blood. She does not say a word. I am her own son, but she neither recognizes me nor speaks to me. Sir, how can I make her know who I am?
        - id: ch01-b08
          speaker: tiresias
          text: |
            That is easy to explain. Any spirit you allow to taste the blood will speak to you with understanding. If you refuse to let a ghost drink it, that ghost will go away.
    - id: ch02
      title: My mother's arms
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            Having delivered his prophecy, Teiresias went back to the house of Hades. I stayed where I was until my mother came forward and tasted the blood. At once she knew me, and spoke with love.
        - id: ch02-b02
          speaker: anticlea
          text: |
            My son, how have you reached this darkness while you are still alive? It is very hard for living people to see these places. Great and terrible waters lie between their world and ours. There is Oceanus too. No man can walk across it. He needs a good ship to bring him. Have you been trying to return from Troy all this time? Have you still not reached Ithaca and seen your wife in your own home?
        - id: ch02-b03
          speaker: odysseus
          text: |
            Mother, I had to come here to ask the Theban prophet Teiresias for advice. I have never come near Achaean land, never set foot on my own country's soil. From the day I went with Agamemnon to fight the Trojans at Ilius, the land of noble horses, I have met one disaster after another. But tell me the truth about yourself. How did you die? Was it a long illness, or did heaven let you pass gently and easily into death? And what of my father and the son I left behind? Do they still hold my property, or has someone taken it, believing I will never return to claim it? Tell me what my wife is thinking and what she plans to do. Is she living with our son and keeping my estate safe, or has she found the best husband she could and married again?
        - id: ch02-b04
          speaker: anticlea
          text: |
            Your wife remains in your house. But she suffers terribly in her mind. Day and night she does nothing but weep. No one has taken your fine property yet. Telemachus still holds your lands without disturbance. He gives many feasts, as a man in his position must. He has the duties of a magistrate, and everyone invites him to dine with them as well.

            Your father has remained in his old place out in the country. He never even goes near the town. There is no comfortable bed for him, and no comfortable bedding either. During winter he goes about in rags. When he sleeps, he lies on the floor before the fire along with the servants. Then summer comes and the weather turns warm again. He goes out to the vineyard, throws a heap of vine leaves onto the ground without any care, and makes his bed on those. All the time he is grieving because you have still not come home. Growing old only makes that suffering worse and worse for him.

            As for me, heaven did not carry me away quickly and painlessly in my house. I had none of the illnesses that slowly wear a person down and kill them. I was longing to know what you were doing. I loved you so deeply and missed you so much. That is what took my life.
        - id: ch02-b05
          speaker: odysseus
          text: |
            I tried to put my arms round my poor mother's spirit. Three times I sprang towards her. Three times she slipped out of my embrace, like a dream or a shadow. It hurt me to the heart. Mother, I said, why won't you stay when I try to hold you? If we could embrace, we could comfort each other in our sorrow, even here in Hades. Is Proserpine tormenting me still further? Has she sent me only an image of you?
        - id: ch02-b06
          speaker: anticlea
          text: |
            My son, most unfortunate of men, Proserpine is not deceiving you. This is what happens to everyone after death. The sinews no longer bind the flesh to the bones. Once life has left the body, the fierce fire consumes them, and the soul flies away like a dream. Now return to the daylight as soon as you can. Remember everything you have seen, so you can tell your wife about it later.
    - id: ch03
      title: The women of old stories
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            As we were talking, Proserpine sent up the spirits of the wives and daughters of the most famous men. They crowded round the blood. I had to find a way to question them separately. I decided to draw the sharp sword hanging beside my strong thigh and prevent them from all drinking at once. They approached one at a time, and when I asked, each told me her people and her family.

            The first was Tyro. Her father was Salmoneus, and her husband was Cretheus, the son of Aeolus. She had fallen in love with Enipeus, the most beautiful river in the world. One day, when she was walking beside him as she often did, Neptune took her lover's appearance and lay with her at the river mouth. A great blue wave rose like a mountain and arched over them, hiding both the god and the woman. He loosened her virgin's girdle and sent her into a deep sleep. After the act of love, he took her hand and spoke.
        - id: ch03-b02
          speaker: poseidon
          text: |
            Be glad with all your heart, Tyro. The embrace of a god is never without fruit. About this time next year, you will bear beautiful twins. Look after them well. I am Neptune. Go home now, but keep this secret. Say nothing to anyone.
        - id: ch03-b03
          speaker: odysseus
          text: |
            He plunged beneath the sea. In due time she gave birth to Pelias and Neleus, and both served Jove with all their strength. Pelias bred great flocks of sheep and lived at Iolcus. Neleus lived at Pylos. Tyro's other children were by Cretheus. They were Aeson, Pheres and Amythaon, a mighty fighter and driver of chariots.

            Beside her I saw Antiope, the daughter of Asopus. She could boast that Jove himself had held her in his arms. She bore him two sons, Amphion and Zethus. They founded Thebes with its seven gates and built a wall around it. Strong as they were, they could not keep hold of the city without walls.

            Next came Alcmena, Amphitryon's wife. She too had borne a son to Jove, the unconquerable Hercules. I saw Megara as well, the daughter of the great King Creon. She had married that fearsome son of Amphitryon.

            There was beautiful Epicaste, the mother of King Oedipodes. What a terrible fate she had. Without knowing it, she married her own son. He had killed his father before marrying her. The gods revealed the whole story to the world. Oedipodes remained king in Thebes, grieving bitterly over the harm the gods had done him. But Epicaste hanged herself in her sorrow and went to the house of Hades, that mighty keeper of the dead. Spirits who avenge a wronged mother haunted her son, bringing him bitter suffering afterwards.

            Then I saw Chloris. Neleus had paid priceless gifts to marry her because she was so beautiful. She was the youngest daughter of Amphion, the son of Iasus, who ruled Minyan Orchomenus. She became queen in Pylos and bore Nestor, Chromius and Periclymenus. Her daughter was Pero, a woman of astonishing beauty. Men from all the country round sought her in marriage. But Neleus would give her only to a man who could seize Iphicles' cattle from the pastures of Phylace. That was a difficult task. Only one man, an excellent prophet, was willing to attempt it. Heaven was against him. The keepers of the cattle caught him and put him in prison. A full year passed, and the same season returned. After the seer had explained all the gods' oracles, Iphicles let him go. So Jove's will was carried out.

            I saw Leda, the wife of Tyndarus. She bore him two famous sons. Castor was a breaker of horses, and Pollux a powerful boxer. Both heroes lie beneath the earth, yet both are alive. Jove gave them a special favor. Each dies and comes back to life on alternate days, for all time, and they have the standing of gods.

            After her came Iphimedeia, the wife of Aloeus. She boasted that Neptune had embraced her. She had two sons, Otus and Ephialtes, but neither lived long. They were the finest children ever born on earth. No one but Orion could equal their looks. By the age of nine, they were nine fathoms tall, and their chests measured nine cubits around. They threatened war against the gods on Olympus. They tried to pile Mount Ossa on Olympus, and Mount Pelion on Ossa, so they could climb into heaven itself. Had they lived to grow up, they would have managed it. But Apollo, the son of Leto, killed them both before a trace of beard appeared on their cheeks or chins.

            I saw Phaedra and Procris, and lovely Ariadne, the daughter of Minos the magician. Theseus was taking her from Crete to Athens, but never came to enjoy her. Before that could happen, Diana killed her on the island of Dia because of what Bacchus had said against her. There were Maera and Clymene too, and hateful Eriphyle, who sold her own husband for gold.

            It would take the whole night to name every hero's wife and daughter I met. It is time for me to sleep, either here or aboard my ship with the crew. As for taking me home, I leave that to heaven and to you.
    - id: ch04
      title: The feast and the murdered king
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            Ulysses stopped. All the guests sat silent in the covered walk, held spellbound by his story. Arete spoke to them.
        - id: ch04-b02
          speaker: arete
          text: |
            Phaeacians, what do you think of this man? Look at his height and his handsome face, and think of his intelligence. He is my guest, but the honor of hosting him belongs to all of us. Do not hurry to send him away. Do not be sparing with gifts for someone in such need. Heaven has given every one of you plenty.
        - id: ch04-b03
          speaker: narrator
          text: |
            The old hero Echeneus, one of the oldest men present, answered her.
        - id: ch04-b04
          speaker: echeneus
          text: |
            Friends, our noble queen has spoken sensibly and to the point. We should follow her advice. Still, the final decision, both about what we say and what we do, rests with King Alcinous.
        - id: ch04-b05
          speaker: alcinous
          text: |
            Then we shall do it. As surely as I am alive and king of the Phaeacians, it will be done. Our guest is eager to reach home, I know. But we must persuade him to stay until tomorrow. By then I can gather all the gifts I mean him to have. Providing his escort is the responsibility of us all, and most of all mine, as your king.
        - id: ch04-b06
          speaker: odysseus
          text: |
            King Alcinous, even if you asked me to remain a whole year, then sent me home with these fine gifts, I would gladly obey. I would gain much by it. I could return to my people with more in my hands, and everyone who saw me back in Ithaca would love and respect me all the more.
        - id: ch04-b07
          speaker: alcinous
          text: |
            Ulysses, none of us looking at you takes you for a fraud or a cheat. I know that many people wander about telling stories so believable that it is hard to see through them. But the way you speak convinces me of your good nature. You have described your own troubles and the Argives' troubles like a skilled singer. Tell me truly, did you see any of the great heroes who went to Troy with you and died there? The evenings are long just now, and it is not bedtime yet. Go on with this wonderful tale. If you keep telling your adventures, I could listen here until morning.
        - id: ch04-b08
          speaker: odysseus
          text: |
            Alcinous, there is a time for talking and a time for sleep. But since you want to hear it, I will tell you something sadder still. These companions did not die fighting the Trojans. They came home, and a wicked woman's betrayal brought them to their deaths.

            When Proserpine had sent the women's spirits away, Agamemnon's ghost approached me in sorrow. He was the son of Atreus, and around him were the men killed with him in Aegisthus's house. As soon as he tasted the blood, he recognized me. He wept bitterly and held out his arms to embrace me, but there was no longer strength or substance in him. I too wept with pity as I looked at him. King Agamemnon, I asked, how were you killed? Did Neptune bring winds and waves against you at sea? Or did enemies kill you on land, when you were raiding their cattle or sheep? Were they defending their wives and their city against you?
        - id: ch04-b09
          speaker: agamemnon
          text: |
            Noble Ulysses, son of Laertes, no storm of Neptune's drowned me. No enemy on the mainland killed me. Aegisthus and my wicked wife did it together. He invited me to his house and gave me a feast. Then he butchered me like a fat animal in a slaughterhouse. Around me they killed my companions like sheep and pigs for a wedding meal, a feast outdoors or a great lord's banquet. You have seen many men die in battle, in the fighting of armies or in single combat. But you have never seen anything so pitiful as our deaths in that covered walk. The mixing bowl and the tables loaded with food lay all around, and the ground stank of our blood.

            I heard Cassandra, Priam's daughter, scream beside me as Clytemnestra killed her. I lay dying on the floor, the sword still in my body. I raised my hands to kill that murdering whore, but she slipped away. She would not even close my mouth or shut my eyes as I died. Nothing in the world is more cruel or shameless than a woman who has sunk to guilt like hers. To murder her own husband! I thought my children and servants would welcome me home. Her hateful crime has shamed not just herself but every woman who comes after her, even the good ones.
        - id: ch04-b10
          speaker: odysseus
          text: |
            Truly, I said, Jove has hated the house of Atreus from beginning to end through the schemes of its women. Think how many of us died for Helen. And while you were away, Clytemnestra was planning evil against you too.
        - id: ch04-b11
          speaker: agamemnon
          text: |
            Then take care. Do not put too much trust even in your own wife. Do not tell her everything you know. Tell her some of it and keep the rest to yourself. Not that Penelope is likely to murder you, Ulysses. She is an admirable woman, with a fine nature. When we sailed for Troy, she was a young bride with a baby at her breast. That child must have grown happily into a man by now. You and he will meet with joy and put your arms round each other, as father and son should. My wicked wife would not even allow me the pleasure of looking at my boy. She killed me before I could see him.

            Remember this advice as well. When your ship reaches Ithaca, tell no one. Arrive secretly and get ahead of them. After what happened to me, women cannot be trusted. But now tell me the truth. Have you heard anything about my son Orestes? Is he in Orchomenus or Pylos? Or is he staying with Menelaus in Sparta? I suppose he is still alive.
        - id: ch04-b12
          speaker: odysseus
          text: |
            Agamemnon, why ask me? I do not know if your son is alive or dead. It is wrong to speak as if you know when you do not.
    - id: ch05
      title: Achilles and Ajax
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: |
            While the two of us sat talking and weeping, Achilles' spirit came near. Patroclus, Antilochus and Ajax came with him. Among all the Danaans, Ajax had been the finest and best-looking man after Achilles, the son of Peleus. The swift descendant of Aeacus recognized me and spoke with sorrow.
        - id: ch05-b02
          speaker: achilles
          text: |
            Ulysses, noble son of Laertes, what will you dare to do next? You have come all the way down to Hades, among us helpless dead. We are only the shadows of men whose strength and work are finished.
        - id: ch05-b03
          speaker: odysseus
          text: |
            Achilles, son of Peleus, greatest fighter of the Achaeans, I came to ask Teiresias for advice on getting back to Ithaca. I still cannot reach Achaean shores or set foot in my own country. Trouble has followed me everywhere. But no man has ever been as fortunate as you, and no man ever will. While you lived, all of us Argives honored you like a god. Now you are a mighty ruler among the dead. Do not grieve so deeply over being dead.
        - id: ch05-b04
          speaker: achilles
          text: |
            Do not praise death to me. I would rather be a hired servant in a poor man's house, alive above the earth, than king over all the dead. Tell me about my son. Has he gone to war? Will he be a great soldier, or has that not happened? And have you heard about my father Peleus? Does he still rule the Myrmidons? Or do the people of Hellas and Phthia no longer respect him because he is old and his limbs have failed?

            If only I could stand beside him in daylight again. If I had the strength I used on the plains of Troy, when I killed the bravest of our enemies, and could go to my father's house even for a little while, anyone who tried to hurt him or take his place would soon regret it.
        - id: ch05-b05
          speaker: odysseus
          text: |
            I have heard nothing about Peleus, I told him. But I can tell you all about your son Neoptolemus. I brought him from Scyros in my own ship with the Achaeans. At our war councils before Troy, he was always first to speak. His judgment never went wrong. Only Nestor and I could do better. In battle he would never stay back with his own men. He rushed far ahead of them, braver than anyone. He killed many enemies for the Argives. I cannot name every man, but I will tell you of Eurypylus, the brave son of Telephus. Apart from Memnon, he was the handsomest man I ever saw, and your son killed him. Many other Ceteians died around him because a woman had been bribed.

            When our bravest men climbed into the wooden horse Epeus had built, I was the one who decided when the door of our hiding place should open or stay shut. The other Danaan chiefs wiped tears from their eyes and trembled in every limb. I never once saw your son's face turn pale or saw him wipe away a tear. He kept urging me to break out of the horse. His hands were on his sword hilt and bronze-tipped spear, and he was breathing fury at the enemy. After we sacked Priam's city, he received a handsome share of the prize money and boarded his ship without a wound. No thrown spear had struck him, and no close fight had hurt him. Such is the fortune of war. Where Mars sends his rage is a matter of chance.

            When I finished, Achilles' spirit strode away across the meadow of asphodel, rejoicing in what I had told him of his son's courage.

            The other dead stood nearby, each telling me his sad story. Only Ajax, the son of Telamon, kept his distance. He was still angry that I had won our contest for Achilles' armor. Thetis had offered it as a prize, and the Trojan captives and Minerva had judged between us. I wish I had never won that dispute. It cost Ajax his life. In size and courage, no Danaan but the son of Peleus had surpassed him. I tried to soothe him.

            Ajax, I said, can you not forgive and forget, even now you are dead? Does the decision over that hateful armor still wound you? We Argives paid dearly enough when we lost a man who stood like a tower of strength for us. We mourned you as deeply as we mourned Achilles himself. There is nothing to blame but Jove's hatred of the Danaans. That was why he planned your destruction. Come here. Set aside your pride and hear what I have to say.

            He said nothing. He turned away to Erebus and the other ghosts. Angry as he was, I might still have made him answer, or gone on speaking to him. But there were other dead people I wanted to see.
    - id: ch06
      title: The restless dead
      blocks:
        - id: ch06-b01
          speaker: odysseus
          text: |
            I saw Minos, the son of Jove. He sat with his golden scepter in his hand, judging the dead. Spirits gathered round him in the great house of Hades, some standing and some sitting, waiting to hear his judgments on them.

            Beyond him was enormous Orion, driving across a meadow of asphodel the ghosts of the beasts he had killed in the mountains. He carried a great bronze club that could never, ever break.

            Then I saw Tityus, the son of Gaia. His body lay stretched out across the plain, covering about nine acres of ground. There were two vultures, one on either side of him. They kept digging their beaks into his liver. He lifted his hands again and again, trying to beat the birds away, but he could not drive them off. This was because he had violated Leto, the woman Jove loved, while she was passing through Panopeus on her journey to Pytho.

            I saw Tantalus in dreadful misery. He stood in a lake with the water up to his chin. He was desperate with thirst, but could never get a drink. Whenever the poor creature bent towards the water, it dried up and disappeared. Dry ground was all that remained, parched by heaven's malice. Tall trees hung their fruit over his head. There were pears, pomegranates, apples, sweet figs and juicy olives. Every time he reached to pick one, the wind lifted the branches back towards the clouds.

            I saw Sisyphus struggling with a task that never ends. Both his hands were working to raise an enormous stone. He strained with his feet as well as his hands, trying to roll it all the way up the hill. Each time he nearly reached the top. But before he could force it over the ridge and down the other side, its weight became more than he could bear. The pitiless stone went thundering back down to the plain. Then he had to start the climb again, trying to push that great weight uphill once more. Sweat ran from his body, and steam rose behind him as he worked.

            After that I saw mighty Hercules, but only his ghost. Hercules himself feasts for ever with the immortal gods. His wife is beautiful Hebe, the daughter of Jove and Juno. The dead screamed all around his image, like frightened birds flying in every direction. He was dark as night, holding his uncovered bow with an arrow on the string. He glared around as if he were always about to take aim. Across his chest he wore a wonderful golden belt. Its workmanship was extraordinary, showing bears, wild boars and lions with flashing eyes. It showed war and fighting and death as well. Whoever made it could never make another to match it, however hard he tried. Hercules knew me immediately and spoke with pity.
        - id: ch06-b02
          speaker: heracles
          text: |
            Poor Ulysses, noble son of Laertes, are you suffering the same kind of life I suffered above the earth? I was Jove's son, yet my troubles had no end. I became a servant to a man far beneath me, a worthless fellow who set me all kinds of labors. Once he sent me here to fetch the hound of hell. He thought he could devise no harder task. But I brought the hound up from Hades and took it to him. Mercury and Minerva helped me do it.
        - id: ch06-b03
          speaker: odysseus
          text: |
            Hercules went down again into the house of Hades. I stayed, hoping another of the mighty dead might come. I would have seen more of those who had passed away, men I longed to meet, Theseus and Pirithous, glorious children of the gods. But thousands upon thousands of spirits crowded round, making such fearful cries that panic seized me. I thought Proserpine might send up the head of that terrible creature, the Gorgon, from the house of Hades.

            I hurried to the ship and ordered everyone aboard at once. They must cast off without delay. They climbed in and took their seats, and our ship moved down the stream of Oceanus. At first we had to use the oars. Then a fair wind rose to carry us.
