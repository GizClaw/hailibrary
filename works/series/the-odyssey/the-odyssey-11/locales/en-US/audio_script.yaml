  chapters:
    - id: ch01
      title: The oar and the warning
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            The wind Circe sent kept us moving all day. At dusk, we came to Oceanus and the Cimmerians' land. The sun never broke through its darkness and mist. We beached the ship and took our offerings to the place Circe had told us about.
            Perimedes and Eurylochus kept hold of the sheep as I dug. Into the hollow I poured honey mixed with milk, then wine and water, and scattered grain. I promised more sacrifices back on Ithaca, including a black sheep for Tiresias. I cut the throats of the two sheep. As blood filled the hollow, spirits crowded towards it. Brides, old people, young people and fallen warriors came crying. I went pale with fear. My men were to burn the sheep for Hades and Persephone. I guarded the blood with my sword. Tiresias had to come first.
            But the first one I recognized was Elpenor. How had he got there ahead of our ship?
            He told me he'd drunk too much and gone to sleep on the roof. On waking he'd forgotten the stairs and fallen. In our haste, we'd left his body at Circe's without a burial.
        - id: ch01-b02
          speaker: elpenor
          text: |
            Think of your wife and father, and your son. When you go back, don't leave me unburied. The gods may punish you for it. Burn me with my armor, and raise a grave by the shore. Put the oar I used above it, so people who pass will know I was there.
        - id: ch01-b03
          speaker: odysseus
          text: |
            I gave him my word. We talked across the hollow while I held my sword over the blood. Then my mother appeared. Anticlea had been alive when I sailed for Troy. This was the first I'd heard of her death. I wanted her beside me, but I made her wait too.
            Tiresias came carrying a staff of gold. He already knew me. He asked me to put my sword aside and let him drink before he answered me. I put it away, and he drank.
        - id: ch01-b04
          speaker: tiresias
          text: |
            Poseidon won't forget his son's lost eye. Getting home will be difficult. But if you and your crew leave the Sun's cattle and sheep alone on Thrinacia, you may yet arrive. Harm them, and you'll lose your men and ship. You might survive, but you'll be alone, delayed, and sailing in someone else's vessel.
        - id: ch01-b05
          speaker: odysseus
          text: |
            I'd heard words like those from Polyphemus. The prophet hadn't finished.
        - id: ch01-b06
          speaker: tiresias
          text: |
            Suitors are consuming your wealth and trying to marry your wife. You'll kill them after you return. Then take an oar and walk inland until you meet people who don't know the sea. When a traveler thinks your oar is a winnowing shovel for grain, plant it in the ground. Sacrifice to Poseidon there. Afterwards, go home and honor all the gods. You'll grow old, and death will come gently from the sea. Your people will be at peace.
        - id: ch01-b07
          speaker: odysseus
          text: |
            I'd wanted directions home. He'd given me a warning, enemies at home and another journey beyond it. I asked how my mother could know me. Let her taste the blood, he told me. Any spirit I allowed to drink could speak with me. When he had gone, I let her approach.
    - id: ch02
      title: Arms that closed on air
      blocks:
        - id: ch02-b01
          speaker: anticlea
          text: |
            My son, haven't you got back from Troy yet? How can you be here, still alive?
        - id: ch02-b02
          speaker: odysseus
          text: |
            I came to ask Tiresias for help. I haven't seen Ithaca. How is Penelope? And my son? Mother, how did this happen to you?
            She told me Penelope was waiting in sorrow, day and night. Telemachus still held our property and was joining the company of grown men. My father lived in the country. He didn't want a proper bed or good clothing any more. He slept by the winter fire, or on leaves in the vineyard when summer came. He was getting old, and still longing for my return.
            But what about you, Mother? Were you sick?
        - id: ch02-b03
          speaker: anticlea
          text: |
            No, I wasn't ill. I waited for news of you, and waited. Missing you wore away my life.
        - id: ch02-b04
          speaker: odysseus
          text: |
            I tried to put my arms around her. There was nothing to hold. Three times I reached for her. She passed through my arms like a dream each time.
            Why won't you stay here with me? Is someone tricking me with a shadow?
        - id: ch02-b05
          speaker: anticlea
          text: |
            No one is tricking you. We who are dead have no body left to embrace. Return to the sunlight as soon as you can. Remember what you've seen here, to tell your wife when you get home.
        - id: ch02-b06
          speaker: odysseus
          text: |
            Then more women approached. I let each one drink separately and tell me about her family. Tyro was married to Cretheus but loved Enipeus, the river god. Poseidon made himself look like Enipeus and slept with her, hidden by a great wave. Only afterwards did he tell her who he was. She would have twins, he said, and must tell no one. Pelias and Neleus were their sons.
            Antiope's sons by Zeus had founded Thebes and built its walls. There were Alcmena, who bore Heracles, and Megara, who married him. Epicaste had married Oedipus. She hadn't known he was her son or that he'd killed his father. The gods made the truth known, and she hanged herself. Oedipus remained king, tormented by his mother's avenging spirits.
            Chloris had married Neleus and borne Nestor and Pero. Neleus would give Pero only for Iphicles's stolen cattle. A prophet tried to steal them and was caught. After a year, Iphicles freed him for interpreting the gods' words. Leda told of her twins, Castor and Polydeuces. Zeus let them alternate between life and death, a day at a time. Iphimedeia was Aloeus's wife. Her huge sons by Poseidon, Otus and Ephialtes, tried to stack mountains to heaven and attack the gods. Apollo killed them before they were men.
            I saw Phaedra and Procris. Ariadne had been on her way from Crete to Athens with Theseus. Dionysus accused her, and Artemis killed her on Dia. Maera and Clymene were there, and Eriphyle, who sold her husband for gold. I couldn't finish all their family stories and sorrows before dawn.
    - id: ch03
      title: News for the fathers
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Odysseus paused, and the hall fell silent. Arete urged the Phaeacians to give him generous presents. The old man Echeneus agreed, but said Alcinous must decide. The king asked his guest to wait another day while he gathered the gifts and arranged his passage.
            Odysseus said he'd gladly wait a year for a return like that. Wealth would bring him a warmer welcome and more respect at home. Alcinous praised his storytelling. He believed him, unlike the wandering people who invented convincing tales. But he wanted to hear more.
        - id: ch03-b02
          speaker: alcinous
          text: |
            Tell us a little longer. Did you see the men who were with you at Troy?
        - id: ch03-b03
          speaker: narrator
          text: |
            Odysseus took up the story again.
        - id: ch03-b04
          speaker: odysseus
          text: |
            Agamemnon arrived with the men who'd died alongside him. He drank and knew me, but when he stretched out his arms, there was no strength in them. I asked whether he'd drowned in a storm or been killed on land.
        - id: ch03-b05
          speaker: agamemnon
          text: |
            I was invited to eat at Aegisthus's house. He and Clytemnestra killed me at the feast. My men fell beside the tables. I heard Cassandra scream as my wife murdered her next to me. With a sword in my body, I tried to strike my wife, but she got away. She wouldn't even shut my eyes as I died. I'd come home expecting to see my boy.
        - id: ch03-b06
          speaker: odysseus
          text: |
            He blamed more than the killers. His wife had disgraced every woman, he said, even the good ones. I told him Zeus had ruined Atreus's family through women. We'd lost so many men for Helen, and now Clytemnestra had done this. He warned me not to tell my wife everything. I should keep some things back and arrive secretly, because women couldn't be trusted. Yet he didn't expect Penelope to kill me. He remembered the young woman with her baby whom we'd left behind. That baby would be a man now. I could still embrace my son, though he couldn't embrace his.
        - id: ch03-b07
          speaker: agamemnon
          text: |
            Do you know anything of Orestes? Is my son still living?
        - id: ch03-b08
          speaker: odysseus
          text: |
            I knew nothing and wouldn't pretend I did.
            Achilles approached with Patroclus and the other comrades. Why had I ventured among the dead? I explained that I'd come to seek Tiresias. Then I tried to ease his sadness. We'd all honored him in life. Now he was like a king here.
        - id: ch03-b09
          speaker: achilles
          text: |
            That doesn't help me. I'd rather be alive, working for a poor man, than king over all the dead.
        - id: ch03-b10
          speaker: odysseus
          text: |
            He asked about Peleus, his father. Was the old man still respected? If only he could return with his old strength, even for a moment. Anyone who hurt his father or took his place would regret it. I had no news of his father, but I did know his son, Neoptolemus.
            I'd brought the young man to Troy. He offered good counsel and charged ahead in battle. He killed many men, Eurypylus among them. Inside the horse, others were trembling, but he kept urging me to let them out. When Troy fell, he sailed off with his share of the spoils and no wound on him.
            Achilles strode away across the meadow, happy to hear how his son had done.
    - id: ch04
      title: The one who would not answer
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            Ajax kept apart. Thetis had offered Achilles' armor as a prize. Athena and the captive Trojans had awarded it to me. He hadn't forgiven that judgment. Winning it had cost us his life. I wished I'd lost that contest. I called to him.
            Ajax, even here you won't speak to me? We grieved for you as we grieved for Achilles. Come closer. Let us talk.
            But he went back into the darkness with the others, saying nothing.
            Elsewhere I saw Minos judging the dead, and Orion hunting the ghosts of beasts he'd once killed. Tityus lay on the ground. Two vultures were eating his liver, and he couldn't stop them. He'd sexually attacked Leto as she traveled to Pytho. This was his punishment.
            Tantalus stood in water that vanished whenever he bent to drink. Fruit trees shaded him, but the branches drew back from his hand. Sisyphus pushed a rock nearly to the summit of a hill. It rolled all the way down again, and he followed to start over.
            Heracles appeared with his bow. Only his image was here. He lived with the gods, married to Hebe. He knew such suffering. Zeus was his father, but he'd been made a servant to an inferior man who gave him dreadful tasks. His master had thought bringing back the hound of the dead would be the hardest. He'd done it with Hermes and Athena's help.
            I stayed after his departure, hoping to see other heroes. Instead the ghosts pressed closer and closer, crying around me. I feared Persephone would send out the Gorgon's head. I ran for the ship and told my crew to get aboard at once.
            We rowed away down Oceanus, until a wind rose and filled the sail.
