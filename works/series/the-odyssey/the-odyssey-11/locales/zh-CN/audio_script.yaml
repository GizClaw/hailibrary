audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    elpenor:
      display_name: 埃尔佩诺尔
      tts: {delivery: "朴实恳求", timbre: "年轻单薄", pace: "犹疑而清楚", pitch: "中音"}
    tiresias:
      display_name: 忒瑞西阿斯
      tts: {delivery: "确定而严谨", timbre: "苍老深厚", pace: "从容", pitch: "低音"}
    anticlea:
      display_name: 安提克勒娅
      tts: {delivery: "慈爱而坦诚", timbre: "成熟柔和", pace: "舒缓", pitch: "中音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "慷慨果断", timbre: "厚实温暖", pace: "稳健", pitch: "中低音"}
    agamemnon:
      display_name: 阿伽门农
      tts: {delivery: "有力而深含伤痛", timbre: "凝重粗砺", pace: "缓而分明", pitch: "低音"}
    achilles:
      display_name: 阿喀琉斯
      tts: {delivery: "直率强烈", timbre: "有力清晰", pace: "果断", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 亡魂围了过来
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |-
            喀耳刻给我们的顺风，一直吹到太阳落山。我们到了俄刻阿诺斯，驶进基墨里亚人的土地。那里不论日出日落，都照不到阳光，只看得见雾和黑暗。
            船停下后，我们牵着羊沿岸走。找到她说的地方，我叫珀里墨得斯和欧律洛科斯牵牢羊，自己挖坑，把蜂蜜拌牛奶倒进去，再倒酒和水，撒上谷物。我向死者许愿，回家还要献祭，给忒瑞西阿斯另备一只黑羊。
            我割开两只羊的喉咙，血流进坑，亡魂就围过来了。有老人和年轻人，有才结婚的女子，还有战死的人。他们一齐叫，我吓得脸都白了。我叫两个同伴把羊烧给哈得斯和珀耳塞福涅，自己拿剑守着血，不让亡魂喝，要先等先知。

            可头一个来的，竟是埃尔佩诺尔。
            你怎么来的，竟比船还早到？出了什么事？
            他才告诉我，自己喝醉了睡在屋顶，醒来忘了楼梯，一跌就死了。我们急着启程，尸体还留在喀耳刻家中。
        - id: ch01-b02
          speaker: elpenor
          text: 看在你的妻子、父亲和儿子的分上，求你回去葬了我吧。别把我扔在那儿，让神怪罪你。把我和铠甲一起烧了，海边堆个坟，再插上我的桨。有人路过，也能知道这里葬着人。
        - id: ch01-b03
          speaker: odysseus
          text: 我隔着血坑，答应了他。接下来走近的，是我的母亲安提克勒娅。离家时她明明活着，我这才知道，母亲已经不在了。可先知没来，我再伤心，也只能拦着她。
    - id: ch02
      title: 回家之后还有一段路
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: 忒瑞西阿斯拿着金杖来了。他还没喝血，就叫出了我是谁。让我收好剑，他才喝下血，说起怎样回家。
        - id: ch02-b02
          speaker: tiresias
          text: 波塞冬还恨你弄瞎了他的儿子，路不会好走。等船到特里纳基亚，你和船员一定得克制住，别动太阳神的牛羊。留着它们，你们还有机会回去。杀了它们，船和人就都保不住了。即使你能逃命，也要过很久，才能一个人搭着别人的船回家。
        - id: ch02-b03
          speaker: odysseus
          text: 我像又听到了独眼巨人那番诅咒。先知接着说。
        - id: ch02-b04
          speaker: tiresias
          text: 你家里有些人，想娶你的妻子，还拿你的家产吃喝。你回去会杀了他们，之后还得拿一支桨，到内陆去，走到没人听说过海的地方。有个人会把船桨看成扬谷用的铲，你就在那儿插下桨，祭祀波塞冬，再回去供奉诸神。到你老了，死亡会从海上慢慢来到，那时你的百姓生活安稳。
        - id: ch02-b05
          speaker: odysseus
          text: 连到家以后的路，原来也没走完。我又求他教我，怎样让母亲认出我。他说，谁喝了血，谁就能和我说话。他走后，母亲终于喝到了血，一眼认出自己的儿子。
    - id: ch03
      title: 三次伸出手
      blocks:
        - id: ch03-b01
          speaker: anticlea
          text: 孩子，你还没回家？这里是死者来的地方，你活着，怎么也来了？
        - id: ch03-b02
          speaker: odysseus
          text: 我说是来请先知指路的，急着问起家里人，妻子、儿子和父亲可好，她又是怎么死的。母亲说，佩涅洛佩还在等，天天流泪。儿子管着家产，也开始同成年男子来往了。父亲却不进城，只留在乡下，好衣服不穿，好床也不睡。冬天躺在火边，夏天睡在葡萄园的叶子堆上。他年纪越来越大，仍等着我。
        - id: ch03-b03
          speaker: anticlea
          text: 不是病。你的消息，我一直等着，可就是等不到。天天想着你，熬着熬着，就再也撑不下去了。
        - id: ch03-b04
          speaker: odysseus
          text: 我想把母亲抱住，一伸手，却空了。第二次，第三次，手臂里还是没有她。母亲，怎么总抱不到你？难道眼前这个影子是假的，是拿来骗我的？
        - id: ch03-b05
          speaker: anticlea
          text: 没人骗你，孩子。我这样的亡魂没有活人的血肉，哪还能让你抱住？快回有阳光的地方去吧。记下这里的事，往后讲给你妻子听。
        - id: ch03-b06
          speaker: odysseus
          text: |-
            母亲之后，又来了许多女子。我让她们轮着喝血，一个个讲自己的遭遇。
            堤罗嫁给了克瑞透斯，却爱上河神厄尼佩乌斯。波塞冬便化成那河神的模样，与她交合，又用一道拱起的大浪挡住两人。事后才说出自己是谁，预告她会生双生子，让她守住秘密。后来生下的，就是珀利阿斯和涅琉斯。
            安提俄佩和宙斯生的两个儿子，建起忒拜，又筑了城墙。赫拉克勒斯的母亲阿尔克墨涅也在，还有他的妻子墨伽拉。
            厄庇卡斯忒嫁给俄狄浦斯，根本不知道丈夫竟是儿子，而且已经杀了他自己的父亲。诸神一揭露，她就上吊死了。儿子仍当着忒拜国王，母亲的复仇之灵却不断让他受苦。
            克洛里斯是涅琉斯的妻子，也是涅斯托尔的母亲。她还有个美丽的女儿佩罗，父亲说，谁抢来伊菲克勒斯的牛，谁才能娶她。有位先知去了，却被关了一年，直到解开神谕，伊菲克勒斯才放人。
            勒达有一对双生子，卡斯托尔和波吕丢刻斯。宙斯让他们活一天、死一天，就这样不断交替。
            阿洛欧斯的妻子伊菲墨得娅，也为波塞冬生了两个巨人，俄托斯和厄菲阿尔忒斯。他们想把山叠到天上，去攻打诸神，没等长大，就让阿波罗杀了。
            我看到了淮德拉和普罗克里斯，也看到了阿里阿德涅。忒修斯带她从克里特去雅典，途中狄俄尼索斯指控她，阿耳忒弥斯便在狄亚岛把她杀死。迈拉、克吕墨涅也在，还有为了黄金出卖丈夫的厄里菲勒。

            要讲完这些人的事，一夜哪够啊。
    - id: ch04
      title: 宴席上的死者
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 奥德修斯停住了，大厅安静了一会儿。阿瑞忒王后请大家多送些礼物，长者厄刻涅俄斯也赞同，但仍由国王做主。阿尔基诺奥斯答应安排船护送，让客人再留一天，好凑齐礼物。奥德修斯很愿意，说等一年也行，带着这么多东西回乡，大家会更尊重、更喜欢他。国王听了，夸他讲得像个好歌者，相信他不是那种到处编谎的流浪人，还想请他继续讲。
        - id: ch04-b02
          speaker: alcinous
          text: 那些曾和你同去特洛伊的人，你见到过没有？
        - id: ch04-b03
          speaker: narrator
          text: 奥德修斯又说起来。
        - id: ch04-b04
          speaker: odysseus
          text: 阿伽门农来了，和他一起被杀的人也在。他喝完血才认出我，伸开双臂，却没力气拥抱。我问他，是海上的风暴，还是陆地上的敌人害了他。
        - id: ch04-b05
          speaker: agamemnon
          text: 不是风暴，也不是敌军。埃癸斯托斯摆宴请我，和我妻子克吕泰涅斯特拉合谋，就在吃饭时杀了我。我的人都倒在桌子边。妻子还杀了卡珊德拉，我听见她在旁边惨叫，身上插着剑，还想伸手杀我妻子。她躲开，连我死后的眼睛都不肯合上。我以为回来，能见着儿子的。
        - id: ch04-b06
          speaker: odysseus
          text: 他恨透了妻子，骂她连好女人的名声都毁了。我也说，宙斯总借女人害阿特柔斯一家，为海伦已死了那么多人，又来了克吕泰涅斯特拉。他劝我回家别惊动别人，也别全信妻子，能藏的话还要藏些，说女人不能信。可一提佩涅洛佩，他又说，她应当不会杀我。当年我们出征，她还是个抱婴儿的年轻妻子。如今我能见到长大的儿子，他却没这机会了。
        - id: ch04-b07
          speaker: agamemnon
          text: 我那儿子俄瑞斯忒斯，有他的消息吗？
        - id: ch04-b08
          speaker: odysseus
          text: 我什么也不知道，不能编话给他听。
    - id: ch05
      title: 阿喀琉斯与埃阿斯
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: 阿喀琉斯和帕特罗克洛斯，还有别的战友也来了。他惊讶我敢到冥府，我告诉他，是来问先知的。我还想安慰他，大家在他生前那么敬重他，如今他到了这里，也像个王。
        - id: ch05-b02
          speaker: achilles
          text: 别这么安慰我了。只要能活着，我宁愿给穷人干活，也不愿做这些死者的王。
        - id: ch05-b03
          speaker: odysseus
          text: |-
            他惦记老父亲珀琉斯，想知道人们还敬不敬重他。他说，要能找回过去的力量，回家哪怕一会儿，谁敢欺负父亲、抢他的位置，他也绝不会放过。可我没有那老人的消息，只知道阿喀琉斯的儿子，涅俄普托勒摩斯。我曾接那年轻人去特洛伊，议事时很有见识，杀敌时总冲在前头，杀了不少人，连欧律皮洛斯也死在他手下。藏进木马，旁人吓得发抖，他却催我开门。最后城破了，他带着战利品上船，竟一点也没受伤。
            阿喀琉斯听完儿子的消息，便高兴地走过草地，离开了。埃阿斯却不肯靠近，还在为铠甲的事记恨我。阿喀琉斯死后，忒提斯把他的铠甲拿出来，作为奖赏。我和埃阿斯争，雅典娜跟特洛伊俘虏判我赢了，可这场争夺让埃阿斯丢了命。我真希望自己从没赢过。便叫他，难道死后还不肯原谅？我们失去你，哭得和失去阿喀琉斯一样。过来，说句话吧。

            他一句话也没有，转身又走进亡魂里面。
    - id: ch06
      title: 离开黑暗
      blocks:
        - id: ch06-b01
          speaker: odysseus
          text: |-
            我又看见弥诺斯在审判死者。俄里翁追逐着野兽的影子，那些都是他生前打过的猎物。提堤俄斯横躺在地上，身躯庞大，却赶不走啄肝的两只秃鹫。他曾在勒托前往皮托的路上性侵犯她，因此才受罚。
            坦塔罗斯站在水中，想低头喝，水就退。头上有果子，他去摘，树枝又抬起来。西绪福斯则不断往山上推石头，快到顶，巨石就滚落。他还得追到山下，从头再推。
            后来，我看见赫拉克勒斯，手里拿着弓。这里的只是影子，他本人已与诸神同住，还娶了赫柏。他说，虽然宙斯是他父亲，他却得给一个不如他的人当奴仆，被逼着做尽苦差。那人觉得冥府的狗最难捉，又要他来带走。是赫尔墨斯和雅典娜帮了忙，他才抓得到。
            他走后，我还想等别的英雄，可亡魂越围越多，处处是喊声。我怕珀耳塞福涅放出戈耳工的头颅，赶紧回船，叫大家上来解缆离开。

            我们沿着俄刻阿诺斯划，后来有了风，船帆又鼓起来了。
