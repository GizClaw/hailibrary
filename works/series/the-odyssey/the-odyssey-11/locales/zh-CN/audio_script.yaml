audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 用朴素的语言从容讲述史诗
        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，直接讲述亲身经历
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    elpenor:
      display_name: 埃尔佩诺尔
      tts:
        delivery: 朴实恳求
        timbre: 年轻单薄
        pace: 犹疑而清楚
        pitch: 中音
    tiresias:
      display_name: 忒瑞西阿斯
      tts:
        delivery: 确定而严谨
        timbre: 苍老深厚
        pace: 从容
        pitch: 低音
    anticlea:
      display_name: 安提克勒娅
      tts:
        delivery: 慈爱而坦诚
        timbre: 成熟柔和
        pace: 舒缓
        pitch: 中音
    poseidon:
      display_name: 波塞冬
      tts:
        delivery: 笃定威严
        timbre: 低沉饱满
        pace: 平稳
        pitch: 低音
    arete:
      display_name: 阿瑞忒
      tts:
        delivery: 深思而有威信
        timbre: 沉静清楚
        pace: 从容
        pitch: 中音
    echeneus:
      display_name: 厄刻纽斯
      tts:
        delivery: 老练恭敬
        timbre: 苍老干涩
        pace: 舒缓
        pitch: 中低音
    alcinous:
      display_name: 阿尔基诺奥斯
      tts:
        delivery: 慷慨果断
        timbre: 厚实温暖
        pace: 稳健
        pitch: 中低音
    agamemnon:
      display_name: 阿伽门农
      tts:
        delivery: 有力而深含伤痛
        timbre: 凝重粗砺
        pace: 缓而分明
        pitch: 低音
    achilles:
      display_name: 阿喀琉斯
      tts:
        delivery: 直率强烈
        timbre: 有力清晰
        pace: 果断
        pitch: 中低音
    heracles:
      display_name: 赫拉克勒斯
      tts:
        delivery: 朴直厚重
        timbre: 雄厚而沧桑
        pace: 平稳
        pitch: 低音
  chapters:
    - id: ch01
      title: 血坑边的预言
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            我们下到海边，推船入水，把桅杆和帆装上，又把羊带进去。坐到船上的时候，大家还在哭，满心苦痛。喀耳刻这位机巧而强大的女神，送了顺风给我们。风从正后方吹，稳稳跟着，把帆一直鼓满。船具上该料理的，我们都料理好，就让风和舵手带船前行。一整天，船顺着航线过海，帆都张得满满的。太阳落下，大地黑了，我们才进了俄刻阿诺斯河的深水。这里有基墨里亚人的城和土地，常年遮着雾，陷在黑暗中。不论太阳初升，还是从天上落下，光线都照不进去。可怜的居民，一直住在那漫长而悲凉的夜里。我们靠岸，拖船上滩，牵出羊，再沿河走到喀耳刻说的地方。

            珀里墨得斯和欧律洛科斯抓住祭牲，我拔剑挖坑，长一肘，宽一肘，深也是一肘。先把牛奶调蜂蜜倒进去，再倒酒，最后倒水，献给全部死者。上面还要洒白大麦粉。我向那些衰弱无力的亡魂恳切祈祷，答应回家就把最好的一头不孕小母牛献给他们，祭火堆满好东西。给忒瑞西阿斯，也特别许了一头黑羊，是全群最好的，只献给他。祈求够了，我割开两只羊的脖子，让血流进坑里。

            亡魂从厄瑞玻斯来了，一群又一群。有新嫁的女子，有没娶妻的青年，有累了一生的老人，有情路不顺的少女，还有身披血甲、死在战场的勇士。四面全涌过来，围着坑飘荡，尖叫声怪得吓人，我脸都白了。赶紧叫伙伴剥下死羊的皮，拿来烧祭，再向哈得斯和珀耳塞福涅反复祷告。我自己举剑守在血边，先知没回答以前，不准其他魂靠近。

            第一个来的，却是埃尔佩诺尔。他还没入土。我们忙着许多事，把他留在喀耳刻家，没守灵，也没埋葬。我看见他，心疼得哭了，说，你怎么到了这黑暗地方？步行竟比我开船还快！他呻吟着回答。
        - id: ch01-b02
          speaker: elpenor
          text: |
            大人，是恶运害了我，还有我那说不出口的醉酒。我睡在喀耳刻家的房顶，醒来，没想到该走大楼梯，一下掉出屋顶，折了脖子，魂就来哈得斯这里了。现在求你想想，你留在家里的亲人。虽然他们不在眼前，还是请你看在妻子、养大你的父亲，还有家中唯一的希望忒勒马科斯的分上，答应我这件事。

            你离开这里，还会开船回埃埃亚岛，我知道。到时别再把我扔着，无人守灵，无人下葬，否则我也许会让天神发怒，怪罪到你。把我和我有的铠甲一同烧了，在海边堆个坟，让以后的人知道，有过我这么一个苦命人。坟上插我的桨，就是活着的时候，跟伙伴们坐船划水的那支桨。
        - id: ch01-b03
          speaker: odysseus
          text: |
            我告诉他，可怜的伙伴，你说的我全答应。我们悲伤地坐着交谈，我在血坑这边持剑，他在那边说话。随后，母亲安提克勒娅的魂来了，她是奥托吕科斯的女儿。我离家打特洛伊时，她还活着啊。看见她，眼泪又涌出。但再伤心，我也拦着母亲，没向忒瑞西阿斯问清，就不能喝血。

            忒拜的先知终于到了，手里还是那根金杖。他认出我，开了口。
        - id: ch01-b04
          speaker: tiresias
          text: |
            奥德修斯，拉厄尔忒斯尊贵的儿子，你真苦命。怎么离开光明，跑到这悲苦地方看死者？离血坑远一点，把剑收起来。让我喝血，才能如实告诉你想知道的事。
        - id: ch01-b05
          speaker: odysseus
          text: |
            我退开，收剑入鞘。他喝了血，就开始说预言。
        - id: ch01-b06
          speaker: tiresias
          text: |
            你问怎么回家，可天神会让你很难回去。波塞冬的眼睛，你恐怕躲不开。他儿子被你弄瞎，他心里还恨得厉害。不过，苦头吃尽之后，也许仍能到家。船到了特里纳基亚岛，你得管住自己，也管好伙伴。太阳神的牛羊在那里，他看得到一切，听得到一切。别伤牛羊，只想着归家，那你受过苦以后，还有机会到伊萨卡。若碰了它们，我先说明，船会毁掉，伙伴都会死。就算你自己逃脱，也要死光同伴，坐别人的船，狼狈回去。家里还会有麻烦，一群蛮横的人占了房屋，打着求婚、给你妻子送礼的名义，吃光你的财产。

            你回去会报仇，用武力或计谋，在自己屋里杀死那些求婚人。做完，就取一支做得很好的桨，背着不停往前走。一直走到有人从没听过海，吃饭不放盐，不懂船为何物，也不认识像船的翅膀一样的桨。怎么知道走到了？我给你一个看得明白的信号。路上有人遇见你，说你肩上扛的应该是扬谷的木铲。这时候，就把桨插进土里，拿公羊、公牛、公猪各一头，向波塞冬献祭。然后回家，给天上的每一位神，依次举行百牲祭。

            你的死会从海上来，很轻、很柔。到那时你年纪已经大了，心也安定，生命就慢慢流尽。你的人民会给你祝福。我说的，全会应验。
        - id: ch01-b07
          speaker: odysseus
          text: |
            我说，那就依上天的安排吧。可还有件事，请讲，请一定告诉我实话。母亲就在我们旁边，坐在血边不吭声。我是她儿子，她却不认我，不肯跟我说话。先知，该怎么让她知道是我？
        - id: ch01-b08
          speaker: tiresias
          text: |
            这事容易。你让哪个魂喝血，哪个就会明白事理，跟你交谈。不让喝，他自己会走开。
    - id: ch02
      title: 母亲和英雄的妻女
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            预言说完，忒瑞西阿斯回到哈得斯那里。我继续等，母亲上来尝了血，马上知道我是谁，慈爱地唤我。
        - id: ch02-b02
          speaker: anticlea
          text: |
            我的孩子，你还活着，怎么能到这黑暗之地？活人要来看我们，多么不容易。中间有又大又可怕的水域，还有俄刻阿诺斯河，谁也走不过来，得靠一条好船。难道从特洛伊离开以后，你一直在找回家的路？到现在还没到伊萨卡，没在家里见到妻子？
        - id: ch02-b03
          speaker: odysseus
          text: |
            母亲，我是不得不来求问忒拜先知。我连阿开亚的海岸都没靠近，故土一步也没踏上。跟阿伽门农去盛产好马的伊利昂，同特洛伊人开战，从出发那天起，苦难就没停过。但你先说说，你怎样死的，要讲真话。病了很久吗？还是上天让你轻轻松松、安安稳稳地离去？父亲怎么样，我留在家的儿子呢？产业还归他们吗，还是别人认定我回不来讨要，就抢了去？妻子心里怎样想，打算怎么办？她还陪着儿子住，替我守家吗？还是找了最好的婚事，又嫁人了？
        - id: ch02-b04
          speaker: anticlea
          text: |
            妻子还在你家中。可是她痛苦得很，白天也哭，夜里也哭，整日只有泪。你的家业好好的，还没人拿走，忒勒马科斯的土地也没人侵扰。他常招待人吃饭，按他的执政身份，这很应该，何况别人也常请他。

            父亲待在乡下老地方，城边都不走。他没有好床，也没有好被褥。天冷了，穿着破衣服，和仆人一起睡在炉火前的地上。夏天一暖，就睡到葡萄园，随便拿些藤叶堆在地面，当作床。你总不回来，他不断伤心，人越老，心里越苦。

            我自己的死，并不是上天让我在家很快、很安稳地闭眼，也不是得了那种拖垮人、慢慢要人性命的病。我只想知道你到底在做什么，心里太爱你，思念太深。就是这样想你，才把我想死了。
        - id: ch02-b05
          speaker: odysseus
          text: |
            我想抱母亲，三次冲上前，三次张开胳膊，怀里的她却都像梦一样飘散了。我心痛得很，说，母亲，为什么不肯停着让我抱？就算在哈得斯的家，两个人抱着，一起哭一哭，也有些安慰啊。是不是珀耳塞福涅又来折磨我，只派个幻影，让我更难受？
        - id: ch02-b06
          speaker: anticlea
          text: |
            孩子，你真是人间最不幸的人。不是珀耳塞福涅哄骗你，死了的人都这样。筋已经连不住骨头和肉，生命一离开，凶猛的火就把这些全烧尽，魂便像梦那样飞走。你现在快回阳光底下去，尽早走。把见过的全记在心上，将来好讲给妻子听。
        - id: ch02-b07
          speaker: odysseus
          text: |
            我们正说着，珀耳塞福涅又送来亡魂，都是大英雄的妻子和女儿。她们围住血坑，挤作一团。我琢磨怎样才能一个个询问，就拔出腿边的快剑，阻止她们一齐喝血。这样，众人轮流过来，我逐一问，每人都讲了自己的族属和来历。

            第一位是堤罗，父亲叫萨尔摩纽斯，丈夫是埃奥洛斯的儿子克瑞透斯。她爱上厄尼佩乌斯河，那条河美得世上没有第二条。一天，她照常在河边走。波塞冬变成她所爱的模样，在河口同她交合。蓝色巨浪拱得像山，把神和女子遮在下面。他解开她处女的腰带，让她沉沉睡去。欢爱过后，他握住她的手说话。
        - id: ch02-b08
          speaker: poseidon
          text: |
            堤罗，高兴吧，安心高兴吧。神同人相爱，不会没有结果。明年的这个时候，你会有两个漂亮的双生孩子，要好好养大他们。我是波塞冬。你回家去，可这事谁也别说，藏在心里。
        - id: ch02-b09
          speaker: odysseus
          text: |
            神潜到海下。后来，堤罗生了珀利阿斯和涅琉斯，两人都用全部力量侍奉宙斯。珀利阿斯在伊奥尔科斯养了大群羊，涅琉斯住皮洛斯。她和丈夫克瑞透斯还有几个孩子，是埃宋、斐瑞斯，还有勇猛善战、能驾战车的阿密塔翁。

            接下来是安提俄佩，阿索波斯的女儿。连宙斯都曾拥她在怀，她很以此自豪。她的两个儿子叫安菲翁和泽托斯，也是宙斯的孩子。他们建起七道城门的忒拜，又修了围墙。两人虽强，没有墙，还是保不住这城。

            我看见安菲特律翁的妻子阿尔克墨涅。她也同宙斯生了孩子，就是无人能制服的赫拉克勒斯。还有墨伽拉，大王克瑞翁的女儿，嫁给了安菲特律翁那个令人敬畏的儿子。

            美丽的厄庇卡斯忒也在那里，她是俄狄浦斯王的母亲。可怕的命运，让她不知道实情，竟嫁给亲儿子。儿子先杀了父亲，再娶她，后来诸神把真相告诉了世人。俄狄浦斯继续做忒拜的王，却为诸神这样害他，悲痛不已。厄庇卡斯忒受不了，上吊自杀，去了那位强大的禁锢者哈得斯那里。替受辱母亲报仇的灵魂，从此缠着儿子，叫他往后苦苦悔恨。

            后来是克洛里斯。涅琉斯看中她的美，付出无价的礼物娶她。她父亲安菲翁，是伊阿索斯的儿子，做弥倪亚人的奥尔科墨诺斯的国王，她是家里最小的女儿。后来做皮洛斯王后，生下涅斯托尔、克罗弥奥斯、珀里克吕墨诺斯，还有美得惊人的女儿珀罗。周围的人都想娶珀罗，可涅琉斯只要一个条件，谁能从菲拉刻牧场抢来伊菲克勒斯的牛，才给谁。这事太难，只有一位出色先知肯去。天神却不助他，牧人抓住他，送进监牢。一年满了，又到同样的季节，先知解释完所有神谕，伊菲克勒斯才放他自由，宙斯的意愿也就完成了。

            我又见到廷达瑞奥斯的妻子勒达。她给丈夫生了两位有名的儿子，会驯马的卡斯托尔，会打拳的波吕丢刻斯。他们两个躺在地下，却也活着。宙斯特别准许，每隔一天死去，再隔一天活过来，永远这样，并且享受神的地位。

            再后面是阿洛欧斯的妻子伊菲墨得娅，也自夸曾让波塞冬拥抱。她生了俄托斯和厄菲阿尔忒斯，可孩子都很短命。世上没见过这么健美的孩子，长相只有俄里翁可比。才九岁，就长到九噚高，胸围也有九肘。他们要同奥林波斯诸神打仗，想把奥萨山搬上奥林波斯山，再把珀利翁山搬到奥萨山顶，这样攀上天。真长大了，是能做成的。可是勒托的儿子阿波罗杀了他们，那时脸颊、下巴连一点胡须都没长。

            我还见到费德拉、普罗克里斯，还有美丽的阿里阿德涅，她父亲是善用法术的弥诺斯。忒修斯正带她离开克里特，前往雅典，却没能享有她。因为阿耳忒弥斯听了狄俄尼索斯对她的指责，先在狄亚岛把她杀了。还有迈拉、克吕墨涅，以及那个可恨的厄里菲勒，为了黄金，竟卖掉自己的丈夫。

            这些英雄的妻子和女儿，若一个个说出姓名，一夜也不够。该睡了，我可以回船陪伙伴睡，也可以留在这里。至于送我回家，就交给天神和诸位。
    - id: ch03
      title: 筵席中断，悲剧继续
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            奥德修斯停住了话。回廊里，客人们都听得出了神，坐在那里，一句话也没有。阿瑞忒对大家说。
        - id: ch03-b02
          speaker: arete
          text: |
            费埃克斯的各位，觉得他怎么样？身材高，模样好，又有才智，不是吗？他虽是我请来的客人，这份荣光却人人都有。不要忙着送走他。天神给各位这么多财富，对一位这样需要帮助的人，送礼也别小气。
        - id: ch03-b03
          speaker: narrator
          text: |
            老英雄厄刻纽斯接着开口。他是席间最年长的几个人之一。
        - id: ch03-b04
          speaker: echeneus
          text: |
            朋友们，尊贵王后的话有道理，也正说到了点上，我们该照办。不过，到底说什么、做什么，最后由阿尔基诺奥斯王作主。
        - id: ch03-b05
          speaker: alcinous
          text: |
            那就办！只要我活着，还是费埃克斯人的王，就一定办成。我知道客人归心很急，但仍得劝他多留一晚。明天，我要送的东西就能全备齐。护送是大家的事，而我作为首领，责任尤其重。
        - id: ch03-b06
          speaker: odysseus
          text: |
            阿尔基诺奥斯王，哪怕您叫我留整整一年，再满载这些好礼物送我回去，我也愿意。这样对我很有益。我带的财物多，回到伊萨卡，族人见了，就会更加爱我、敬重我。
        - id: ch03-b07
          speaker: alcinous
          text: |
            奥德修斯，这里没有人觉得你在骗人，或是冒充什么。我知道外头有人到处走，编的故事太可信，很难拆穿。可你的谈吐有种风采，叫我相信你的为人。自己的灾难，阿尔戈斯人的灾难，你讲得像熟练的歌者。那么请告诉我真话，那些与你一起去特洛伊、死在那里的大英雄，你见到了吗？现在夜很长，还早着呢。接着讲这些神奇经历，只要你讲，我能听到明天早上。
        - id: ch03-b08
          speaker: odysseus
          text: |
            阿尔基诺奥斯，该说的时候说，该睡的时候睡。不过您这么想听，那我就讲更伤心的一段。有些同伴没倒在特洛伊人面前，反而回来后，死在恶女人的阴谋下。

            珀耳塞福涅把那些女魂遣散，阿特柔斯之子阿伽门农便悲伤地来了。周围跟着的，是在埃癸斯托斯家和他一同遇害的人。刚喝到血，他就认出我，痛哭着想伸手来抱。可他已没力量，也没了身体。我见了也哭，实在心疼，问，阿伽门农王，是谁害你？在海上遭到波塞冬的狂风巨浪吗？还是上岸抢牛抢羊，对方反抗，又或他们保卫妻子和城池，杀了你？
        - id: ch03-b09
          speaker: agamemnon
          text: |
            拉厄尔忒斯尊贵的儿子，我不是死在波塞冬的风浪中，也不是陆地上的敌人杀了我。埃癸斯托斯跟我的恶妻，两人合谋要了命。他叫我去做客，拿酒菜招待，却当场把我屠宰，像宰牲场杀肥畜。周围的同伴，也像贵人办婚宴、办野宴、办盛大筵席时杀的猪羊，一个个丢命。你见惯打仗，军队交战也好，两人决斗也好，死多少人都见过，但不会有比我们更惨的。我们倒在回廊，旁边是调酒的大碗、满桌饭菜，地上流满带着腥气的血。

            普里阿摩斯的女儿卡珊德拉，就死在我身边，被克吕泰涅斯特拉杀了，我听得见尖叫。我躺着快断气，剑还插在身体里，举手去杀那个行凶荡妇，她却溜开。我快死了，她连嘴和眼也不肯替我合上。女人犯下这样的罪，还有谁能比她更残忍、更不要脸？杀自己的丈夫啊！我本来想着，会有孩子和仆人迎接。结果她那桩可憎的罪，不只害自己蒙羞，也叫以后的所有女人蒙羞，好女人都受连累。
        - id: ch03-b10
          speaker: odysseus
          text: |
            我告诉他，在女人的计谋这件事上，宙斯真是一直恨着阿特柔斯家。为了海伦，我们死了多少人！现在又知道，你离家的时候，克吕泰涅斯特拉一直在谋划害你。
        - id: ch03-b11
          speaker: agamemnon
          text: |
            所以，对自家妻子也不能太亲近，别把知道的全说。说一点，其他的自己留心。不过，你家那位倒不像会杀你。奥德修斯，佩涅洛佩是个极好的人，品性真好。我们出征时，她才嫁给你不久，抱着吃奶的孩子。那孩子现在应该平平安安，长成男子汉了。你们父子见面会有多高兴，两个人抱一抱，正是应该的。可我连亲儿子的面都没见着，恶妻先把我杀了。

            还得听好，到伊萨卡不要告诉人，悄悄靠岸，抢在他们前头。我受了这样的事，女人真不能信。现在你给我说实话，有没有我儿子俄瑞斯忒斯的消息？是在奥尔科墨诺斯，还是皮洛斯？又或跟墨涅拉奥斯住斯巴达？我想他还活着。
        - id: ch03-b12
          speaker: odysseus
          text: |
            阿伽门农，你问我又有什么用？他的生死，我全不清楚。不知道就不该乱讲。
    - id: ch04
      title: 英雄心中的牵挂
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            我们两人哭着，伤心地谈着，阿喀琉斯来了。同他一起的还有帕特罗克洛斯、安提洛科斯，以及埃阿斯。所有达那奥斯人中，除了珀琉斯的儿子，就属埃阿斯最好看、最出色。那位双脚飞快的埃阿科斯后裔认出我，带着悲伤开口。
        - id: ch04-b02
          speaker: achilles
          text: |
            奥德修斯，拉厄尔忒斯尊贵的儿子，你还想做什么大胆事？连哈得斯的屋子都敢来！到我们这群无知无力的死者中间，我们不过是再也做不了事的人的影子。
        - id: ch04-b03
          speaker: odysseus
          text: |
            珀琉斯的儿子，阿开亚人最伟大的战士，我来找忒瑞西阿斯，想知道能不能请他指条回伊萨卡的路。我的脚还没踩过故土，连阿开亚都没到，麻烦从没断过。可你，阿喀琉斯，没有人有你这样的好运，从前没有，将来也没有。活着我们把你当神敬，如今死了，你又是亡魂的王。何必因死去就这样难过？
        - id: ch04-b04
          speaker: achilles
          text: |
            别说死亡的好话。我宁可在地上活着，给穷人做雇工，也不愿在死者中做万王之王。儿子怎么样？上战场了没，会是大勇士吗，还是做不到？父亲珀琉斯呢，听过消息吗？他还管着密耳弥多涅斯人吗？或者希腊和佛提亚的人，看他老了、手脚不行，就不尊敬？

            我若还能陪在他身边，在日光下，拿出当年在特洛伊平原杀死最勇敌人的力量，多好啊。只要恢复那时的本领，哪怕回家短短一会，谁敢侮辱父亲，谁敢夺他的位置，我就让他后悔。
        - id: ch04-b05
          speaker: odysseus
          text: |
            我说，珀琉斯的事没听过，涅俄普托勒摩斯却能细说。我和阿开亚人去斯库罗斯岛，用我自己的船接他。商量怎么打特洛伊，他总第一个说话，判断从不走偏，只有我和涅斯托尔能超过。平原上打起来，他不肯跟着队伍，总往前冲，远在其他人前面，谁也比不上那份勇敢。他为阿尔戈斯人杀了很多敌军，我没法把姓名全背出来。只说一个，忒勒福斯的儿子欧律皮洛斯，那位勇士也死在他手上。除了门农，我见过的人里，没有比他更俊的。因一个女人受贿，许多刻忒亚人也跟着死在他周围。

            最勇敢的人进了厄佩奥斯造的木马，何时开门，何时关住躲藏的地方，听我决定。别的达那奥斯首领，个个擦眼泪，浑身发抖。唯独你儿子，我没见他苍白过，连一滴泪也没擦。他紧握剑柄和铜矛，满腔怒气对着敌人，不停催我冲出去。等攻破普里阿摩斯的城，他拿了大笔分到的战利金，上船回去，身上却毫发无伤。投来的矛没打中，近战也没伤着。战争就是这回事，阿瑞斯的怒火往哪落，很看运气。

            阿喀琉斯听我说完，高兴得很，儿子那么勇猛，他便大步走过开满日光兰的草地。

            其他亡魂在近处，各说各的苦事。只有忒拉蒙的儿子埃阿斯，独自站远。他还恨我，当年争阿喀琉斯的铠甲，我赢了。铠甲由忒提斯拿来当奖品，雅典娜和特洛伊俘虏作判。我真盼从没赢过！因为这件事，埃阿斯竟丢掉性命。论身材，论勇力，达那奥斯人除了珀琉斯之子，谁都不如他。我想安慰他，叫他别再生气。

            我说，埃阿斯，连死后也不肯忘掉，不肯宽恕吗？那可恨铠甲的判决，怎么还让你痛心？我们丢了你这根支柱，代价太大。为你哀悼，就像为阿喀琉斯哀悼一样。只能怪宙斯害达那奥斯人的恶意，所以他才打算毁了你。过来听我说一说，把那骄傲的脾气放一放吧。

            他不回答，转身回厄瑞玻斯，走向别的亡魂。他虽那么恨，我原可以设法叫他开口，或者接着说下去。不过，另一些死者，我也想见。
    - id: ch05
      title: 永不休止的劳苦
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: |
            先看到宙斯之子弥诺斯，他拿金杖，坐着审判。哈得斯宫殿很宽敞，亡魂有的站，有的坐，全聚在他周围，听对自己的裁决。

            再过去是巨大的俄里翁，手里拿一根永远折不断的大铜棍，在日光兰的草地驱赶野兽的魂。那些都是他从前在山中杀过的兽。

            盖娅的儿子提堤俄斯，身躯摊在平原上，占了九英亩左右。两边各一只秃鹫，把嘴扎进肝里啄。他一再用手赶，怎么也赶不掉。这是因为勒托经过帕诺佩乌斯去皮托的时候，他强暴了这位宙斯的爱人。

            坦塔罗斯的命也可怕，站在湖里，水到了下巴，渴得快死却喝不着。一低头想喝，水就不见，湖干了，只有干燥的泥土，那是上天怀着恶意，把地晒焦。头顶大树还垂着果子，梨、石榴、苹果、甜无花果，汁水丰富的橄榄，全有。可怜的人伸手摘，风又把枝条甩回高高的云间。

            我看到西绪福斯，双手举起一块巨石，没完没了地干活。他手脚全使上，要推到山上。可每次快翻过顶，重量又超过他能承受的，那无情的石头轰隆滚回平地。他只好重新推，汗不停流，热气在身后升起来。

            之后是伟大的赫拉克勒斯，不过只是影子。他本人一直和不死诸神宴饮，妻子是美丽的赫柏，宙斯与赫拉的女儿。亡魂围着他的影子乱叫，像受惊的鸟满天乱飞。他黑沉沉的，像深夜，手执拿掉弓套的弓，箭已经搭弦。瞪眼四处看，像随时要瞄准。胸前一条奇妙金带，上面做得精细极了，有熊、野猪、眼中闪亮的狮子，也有打仗、厮杀和死亡。造这带子的工匠，不论再怎么做，都造不出同样一条。他一见我就认得，怜悯地开口。
        - id: ch05-b02
          speaker: heracles
          text: |
            可怜的奥德修斯，拉厄尔忒斯尊贵的儿子，你也在过苦日子，跟我活着时一样吗？我可是宙斯之子，受的折磨却无穷无尽。一个比我差得远的坏人，让我做他的奴役，什么苦活都交给我。他还叫我来这里，带回那头地狱恶犬，觉得再找不出比这更难的差事。可我把犬从哈得斯带出去，交到他手里了，是赫尔墨斯和雅典娜帮我的。
        - id: ch05-b03
          speaker: odysseus
          text: |
            赫拉克勒斯回了哈得斯的宫殿，我仍留着，等别的伟大亡者。我本能再看见些自己想见的英雄，那些神的光荣后代，像忒修斯和庇里托奥斯。可成千上万的魂挤过来，叫声太吓人了，我惊慌起来，怕珀耳塞福涅把可怕的戈耳工的头，从宫殿里送出。

            我赶紧奔回船，叫大家马上登船，把缆解开。他们上船坐定，船便沿俄刻阿诺斯的河水往下走。开始靠桨划，过了不久，顺风终于来了。
