audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    elpenor:
      display_name: 埃尔佩诺尔
      tts: {delivery: "朴实恳求", timbre: "年轻单薄", pace: "犹疑而清楚", pitch: "中音"}
    tiresias:
      display_name: 忒瑞西阿斯
      tts: {delivery: "确定而严谨", timbre: "苍老深厚", pace: "从容", pitch: "低音"}
    anticlea:
      display_name: 安提克勒娅
      tts: {delivery: "慈爱而坦诚", timbre: "成熟柔和", pace: "舒缓", pitch: "中音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "慷慨果断", timbre: "厚实温暖", pace: "稳健", pitch: "中低音"}
    agamemnon:
      display_name: 阿伽门农
      tts: {delivery: "有力而深含伤痛", timbre: "凝重粗砺", pace: "缓而分明", pitch: "低音"}
    achilles:
      display_name: 阿喀琉斯
      tts: {delivery: "直率强烈", timbre: "有力清晰", pace: "果断", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 先来的是未葬的同伴
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            喀耳刻送的风吹了一整天。天黑时，我们到了俄刻阿诺斯，岸上是基墨里亚人的地方。那里终日都是雾和黑暗，太阳从来照不透。
            我们把船停好，带着祭牲找到地方。珀里墨得斯和欧律洛科斯拉着羊，我掘好坑，把蜂蜜牛奶、酒和水倒进去，再撒上谷物。我答应到家后还会献祭，给忒瑞西阿斯单留一只黑羊。两只羊的喉咙割开，血流下来，亡魂便从四面围来。老人、年轻人、新娘、战死的勇士，那些声音叫得我脸都白了。我让伙伴烧羊祭祀哈得斯与珀耳塞福涅，自己用剑挡着，不准亡魂先喝血。
            我认出的第一个人，是埃尔佩诺尔。我问他，怎么比我们的船还先到，究竟出了什么事。
            他便说了醉酒睡屋顶、醒来忘了楼梯、跌下去送命的经过。我们忙着走，竟把他的身体留在那里，还没下葬。
        - id: ch01-b02
          speaker: elpenor
          text: |
            想想你的妻子、父亲和儿子吧。回喀耳刻那里以后，别丢下我不葬，神会怪罪你的。把我的身体和铠甲烧在一起，坟垒在海边，再立上我的船桨。让以后走过的人，知道有过我这个人。
        - id: ch01-b03
          speaker: odysseus
          text: |
            我向他保证。我们隔着血坑谈过之后，母亲来了。是安提克勒娅，出征时她还好好的，我根本不知道她已经不在人世。虽然想哭，我也只能让她等着，因为先知还没出现。
            忒瑞西阿斯拿着金杖来了。不等喝血，他就叫出我的名字。他让我把剑收起，给他饮血，他好讲我的归路。我收了剑，他这才喝下祭血。
        - id: ch01-b04
          speaker: tiresias
          text: |
            波塞冬不会忘了他儿子的眼睛。去到特里纳基亚，别碰太阳神的牛羊。你们能克制，还有机会到家。若伤了它们，你的船和人就全毁了。你本人也许活着，可得迟迟才回去，独自坐着别人的船。
        - id: ch01-b05
          speaker: odysseus
          text: |
            听起来，像又听见巨人在洞外发出的诅咒。先知继续说。
        - id: ch01-b06
          speaker: tiresias
          text: |
            有人要娶你的妻子，还在吃你的家产。你回去会杀死他们。之后，带一支桨到内陆，一直走到人们连海都不知道的地方。等有人说你扛的是扬谷的铲，就把桨立在那里，献祭给波塞冬，再回家祭祀其他神。等你老了，死会从海上缓缓到来，那时族人会过得平安。
        - id: ch01-b07
          speaker: odysseus
          text: |
            我本想问回家怎么走，谁知回去还要战斗，之后还要再走一趟。我又问，怎样让母亲认出我？他说，让她饮血，就能和我说话。
            他走后，我把母亲让到近旁。
    - id: ch02
      title: 三次伸手
      blocks:
        - id: ch02-b01
          speaker: anticlea
          text: |
            孩子，你还没到家啊？活着的人，怎么会走到这里？
        - id: ch02-b02
          speaker: odysseus
          text: |
            我说，得来向先知求助。我急着知道佩涅洛佩怎样了，儿子怎样了，父亲怎样了，也想知道母亲为什么死。
            她告诉我，佩涅洛佩还守在家里，日夜挂念。忒勒马科斯管着产业，已经和成年男子来往。父亲只住乡下，不肯穿好的，也不肯睡床。冬天挨着火，夏天躺在葡萄园的落叶上。他越来越老，一直盼着我。
        - id: ch02-b03
          speaker: anticlea
          text: |
            我不是病死的。我就想听听你的消息，一直等不到。想你想得久了，人也就熬不下去了。
        - id: ch02-b04
          speaker: odysseus
          text: |
            我想搂住母亲，可两只手臂抱在一起，里面空空的。第二次、第三次，还是没有用。
            母亲，怎么不让我抱住？难道这不是你，只是拿来骗我的影子？
        - id: ch02-b05
          speaker: anticlea
          text: |
            没骗你，真的是我。我们死了，就没有让你抱住的身子了。赶紧回阳光下去吧，把这儿见到的记下来，以后告诉妻子。
        - id: ch02-b06
          speaker: odysseus
          text: |
            接着，其他女子轮流上前，讲各家的事。堤罗嫁给克瑞透斯，却爱上河神厄尼佩乌斯，来的却是变成河神的波塞冬。他同她交合，还用大浪挡住两人。完事后才说自己是谁，告诉她会生双生子，叫她别对人讲。后来生下的，就是珀利阿斯和涅琉斯。
            安提俄佩和宙斯的两个儿子建起忒拜，又筑了城墙。阿尔克墨涅生下赫拉克勒斯，墨伽拉嫁给了他。厄庇卡斯忒却嫁给了自己的儿子俄狄浦斯。她不知他是谁，更不知他杀了父亲。神把事揭穿，她便吊死了。儿子继续作忒拜国王，受着母亲的复仇之灵折磨。
            克洛里斯嫁了涅琉斯，生下涅斯托尔和佩罗。父亲要人抢来伊菲克勒斯的牛，才肯嫁女儿。一位先知去抢，被关了一年，靠解释神谕，伊菲克勒斯才放他出来。勒达的两个儿子是卡斯托尔和波吕丢刻斯。宙斯让他们生死轮换，每隔一天换一次。阿洛欧斯的妻子伊菲墨得娅，为波塞冬生的巨人俄托斯和厄菲阿尔忒斯，竟想叠山上天，同诸神开战，没长大就让阿波罗杀了。
            我又见到淮德拉、普罗克里斯。还有阿里阿德涅，忒修斯原要带她从克里特去雅典，狄俄尼索斯指控她，阿耳忒弥斯就在狄亚岛杀了她。迈拉、克吕墨涅也在，还有厄里菲勒，她拿丈夫换了黄金。这些家族的故事和苦处，一夜哪能说完。
    - id: ch03
      title: 战友惦念的人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            奥德修斯停住了，大家也没出声。阿瑞忒请众人多送些礼物，老厄刻涅俄斯赞成，仍请国王决定。阿尔基诺奥斯让客人再等一天，把礼物和护送都备好。
            奥德修斯说，能这样回去，等一年也值得。钱财多了，回家便更受喜爱、更有体面。国王称赞他讲得好，像熟练的歌者，也信他没有像那些流浪客一样，靠编故事骗人。可国王还想听。
        - id: ch03-b02
          speaker: alcinous
          text: |
            跟您一起去特洛伊的那些人，也在那里吗？您见到他们没有？
        - id: ch03-b03
          speaker: narrator
          text: |
            奥德修斯继续往下讲。
        - id: ch03-b04
          speaker: odysseus
          text: |
            阿伽门农和一起遇害的同伴来了。他喝了血才认出我，伸开手臂，却无力拥抱。我问他，是不是在风浪里丧命，或者被岸上的敌人杀了。
        - id: ch03-b05
          speaker: agamemnon
          text: |
            是一顿饭要了我的命。埃癸斯托斯请客，和我的妻子克吕泰涅斯特拉合谋杀我。我的人倒在餐桌边，她又杀了卡珊德拉，我还听见那声喊。剑插在我身上，我还想杀妻子，她却躲了。她连我的眼也不肯合上。我本来以为能见到儿子啊。
        - id: ch03-b06
          speaker: odysseus
          text: |
            他骂着骂着，连天下女人都骂了，说妻子干的事，连好女人也跟着丢脸。我说，宙斯老是借女人害阿特柔斯一家，海伦让我们死了多少人，如今又来一个克吕泰涅斯特拉。他叫我别把所有话都告诉妻子，藏起一些，还得悄悄回乡，说女人都不能信。可佩涅洛佩，他又说她不会杀我。他记得我们出征时，她还抱着孩子，那孩子如今长大了。我还有希望和儿子见面，紧紧抱一抱。他却再也做不到。
        - id: ch03-b07
          speaker: agamemnon
          text: |
            俄瑞斯忒斯，我的儿子，你知道他现在怎么样吗？
        - id: ch03-b08
          speaker: odysseus
          text: |
            我不知道，就不能胡说。
            阿喀琉斯也来了，身边有帕特罗克洛斯等人。他问我怎么敢来。我说明自己要向先知问路，又想安慰他。以前大家那样敬重他，即使到了死者中，他也如同国王。
        - id: ch03-b09
          speaker: achilles
          text: |
            这可安慰不了我。活着替穷人干活，也比在这里统治所有死者强。
        - id: ch03-b10
          speaker: odysseus
          text: |
            他想知道父亲珀琉斯老了，还有没有人尊敬。要是能带着以前的力气回去，哪怕一小会儿，谁敢欺负父亲、夺他的位子，他一定叫那人吃苦头。我没有老人的消息，但知道他儿子涅俄普托勒摩斯的事。
            那年轻人是我接到特洛伊去的。商议事情，他说得在理，上战场便冲在最前头，杀了不少人，包括欧律皮洛斯。进了木马，别人发抖，他却催我打开出口。城破后，他拿了应得的战利品上船，没有受伤。
            阿喀琉斯听见儿子的好消息，高高兴兴地走过草地。
    - id: ch04
      title: 没有答复的呼唤
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            埃阿斯不肯走近。忒提斯拿出阿喀琉斯的铠甲作奖品，我和他都想要。雅典娜同特洛伊俘虏判给了我，可这一来，我们失去了他。我宁可没赢那一回。我喊他。
            埃阿斯，连到了这里都不肯同我说话吗？你死后，我们像失去阿喀琉斯一样悲痛。过来吧。
            他一句没答，回到别的亡魂中去了。
            我还看见弥诺斯给死者作裁断，俄里翁追逐野兽的影子，那些兽是他活着时猎过的。提堤俄斯摊在地上，两只秃鹫在啄他的肝，怎样也赶不走。他曾在勒托去皮托的路上性侵犯她，所以受了这个罚。
            坦塔罗斯明明站在水里，想喝，水却退了。头上结着果子，想摘，枝条又升了上去。西绪福斯把大石推到快近坡顶，石头就滚落，他只好下去再来一遍。
            赫拉克勒斯持弓出现，这里只是影子，他本人同诸神生活，娶了赫柏。他说宙斯虽是父亲，他却给不如自己的人当奴仆，被逼干苦工。主人觉得冥府的狗最难抓，才派他来带走。赫尔墨斯和雅典娜帮助，他终于做到了。
            等他走了，我原想留下见更多英雄。可亡魂挤过来，四下都是叫声。我怕珀耳塞福涅真要把戈耳工头颅放出来，便跑回船边，让大家赶紧解绳上船。
            我们沿着俄刻阿诺斯划走，后来风起了，船帆重新张满。
