notes:
  - "Task-scoped user exception to classic's verbatim-import default: retain classic and Homer / 荷马 authorship but prepare new HaiLibrary reading prose. The complete Book XI at git 1208d108 and the live Gutenberg edition supply plot evidence. Neither locale is Butler's wording or a literal Chinese translation, and locale source_url / translator do not falsely describe it as such."
  - "Retained: unburied Elpenor and the oar, the conditional cattle warning and further inland journey, the unexpected mother and three failed embraces, the hosts' interruption, Agamemnon's homecoming murder and unknown son's fate, Achilles preferring life and hearing news of his son, Ajax's refusal, judgment and recurring punishments, Heracles's shadow and the flight to the ship."
  - "Retained nested actions: Poseidon impersonates Enipeus to sleep with the married Tyro and orders secrecy; Antiope's sons build Thebes; Epicaste unknowingly marries her patricidal son, hangs herself when it is exposed, and Oedipus suffers her avenging spirits; Pero's cattle bride-price leads to a seer's imprisonment and release; Leda's twins alternate life and death; Iphimedeia's sons threaten the gods and Apollo kills them; Artemis kills Ariadne on Dionysus's accusation; Eriphyle sells her husband for gold. Tityus's sexual assault and liver-eating punishment, and Heracles's humiliating service and hound task, remain explicit."
  - "Condensed: ritual dimensions and the exact species of future Poseidon sacrifices; extended ancestral chains, secondary sons and the giant boys' measurements; Neoptolemus's longer victim catalogue and comparative beauty rankings; exact acreage and fruit list of the punishments; Heracles's belt ornament catalogue and repeated court compliments. All named women in the consulted list still appear, but the text does not claim full wording or all genealogical links."
  - "Claim inventory, both locales: perpetual darkness at this mythical border, spirits drinking sacrificial blood, foreknowledge, incorporeal embraces, divine punishments and Heracles's simultaneous shadow and divine life are established mythology, not geography, medicine or claims about death in reality."
  - "Anticlea's death through longing remains her own account, not medical advice. Agamemnon's condemnation of all women, including innocent women, his instruction to keep secrets from a wife, and Odysseus's agreement about Helen and Clytemnestra are retained as those characters' speech. Their prejudice is not silently rewritten into modern fairness or presented as independently supported knowledge about women. His exception for Penelope remains."
  - "Odysseus gives no invented news of Orestes or Peleus. The hero's uncertainty and Ajax's silence remain unresolved. The episode does not invent a reconciliation, resurrection or proof of Homeric biography. No modern retelling supplied prose."
