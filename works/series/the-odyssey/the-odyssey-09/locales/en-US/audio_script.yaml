  chapters:
    - id: ch01
      title: My name and my home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Ulysses gave the king his answer."
        - id: ch01-b02
          speaker: odysseus
          text: |
            King Alcinous, what a pleasure it is to sit and listen to this singer, with that beautiful voice the gods have blessed him with. I know no greater happiness than seeing a whole people gathered to celebrate together. The guests sit in their proper places, listening to the song. Bread and meat are piled high on the tables, while the man serving wine draws it out and goes from guest to guest, filling each man's cup. You could hardly ask to see a lovelier sight in all your life. But now you ask me to tell you about my sufferings, and all those sad memories begin to burn inside me again. The gods have laid so much misery on me that I hardly know where to start. How am I to go on telling it? How can I ever bring the tale to an end?

            Let me first give you my name. Then you will know who I am, and if I survive these troubles, perhaps you can visit me one day. My home is far from yours, but I could still welcome you there. I am Ulysses, son of Laertes. Men everywhere know the many tricks I can devise, and my fame reaches heaven. My home is Ithaca. The high mountain Neritum stands there, covered in forest. Close by are several islands lying near one another. There is Dulichium, and Same, and wooded Zacynthus. Ithaca sits low against the horizon, furthest out towards the setting sun. The other islands lie away from it towards the dawn. It is rough country, but it raises brave men, and there is nothing my eyes would rather look upon. Calypso kept me in her cave and wanted me for her husband. Circe, that clever goddess on Aeaea, wanted the same. Neither could win me over. A man holds nothing dearer than his own land and his parents. Give him the finest house abroad, and he still takes no joy in it if he is far from his father and mother. Now I will tell you the dangers Jove sent me through on the voyage back from Troy.

            When I sailed from Troy, the wind first carried us to Ismarus, a city of the Cicons. I stormed the town and killed its people with the sword. We carried off their wives and a great deal of plunder. We shared everything fairly, so no man could complain. Then I told the men we ought to leave at once. They were foolish enough to refuse. They stayed on the shore drinking wine and slaughtering plenty of sheep and cattle. Meanwhile the Cicons called for help from their people further inland. These were stronger men, with greater numbers and more skill in war. They could fight from their chariots or on foot, as the battle demanded. By morning they were coming at us as thick as summer leaves and flowers. Heaven was against us, and they pressed us hard. They drew up near our ships. The two armies faced each other with their bronze-tipped spears. While the morning lasted and the sun was still climbing, we held our ground, though they outnumbered us. But the sun began to sink. By the hour when men unyoke their oxen, the Cicons had beaten us. We lost six men from every ship, and escaped with the survivors.

            We sailed away with heavy hearts, grieving for the friends we had lost, though we were thankful to have escaped death ourselves. We would not leave that shore until we had called three times for every poor man the Cicons had killed. Then Jove turned the North wind against our ships, making it blow until it became a hurricane. Thick clouds hid both the land and the sky, and night seemed to leap out of heaven. At first we let the ships run before the gale, but the force of it ripped our sails to pieces. Afraid the ships would be wrecked, we pulled the sails down and rowed towards land with all our strength. For two days and two nights we stayed ashore. The suffering in our minds was as great as the weariness in our bodies. On the morning of the third day we raised our masts again, spread our sails and took our places in the ships. We left our course to the wind and the men working the rudders. I would have reached home safely then. But while I was rounding Cape Malea, the North wind and the currents worked against me. They pushed me off the course I meant to follow, close to the island of Cythera.

            Bad winds pushed me across the sea for nine days. On the tenth we came to the Lotus-eaters. Those people live on food from a certain kind of flower. We landed for fresh water, and the crews ate their midday meal on the shore beside the ships. Afterwards I sent two men to discover what the people were like, with a third man to attend them. They went straight off and met the Lotus-eaters. No one harmed them. Instead, they were given lotus to eat. It tasted so good that anyone who tried it stopped caring about home. They did not even want to come back and tell us what had happened. They wanted only to stay there eating lotus with the Lotus-eaters, forgetting all about the voyage back. I had to force them down to the ships. They wept bitterly, but I tied them beneath the benches. Then I ordered everyone else aboard at once. If another man tasted the lotus, he too might lose all wish to go home. They sat at their oars and struck the grey sea.
    - id: ch02
      title: The island and the cave
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            Still full of sorrow, we sailed on until we reached the land of the Cyclopes. They are a brutal people who live without law. They neither sow nor plough. They leave everything to heaven and eat the wheat, barley and grapes that spring up without anyone tending them. The wild vines give them wine, growing in the sun and rain. They have no laws and never gather to settle their affairs. They live in caves high in the mountains. Each man rules his own family and pays no attention to his neighbors.

            A wooded, fertile island lies off their harbor, not right against their shore, but not far away. Wild goats breed there in great numbers. No human foot disturbs them. Hunters will endure all kinds of hardship in forests and on steep mountains, but they never come here. No one ploughs the island or turns animals loose to graze it bare. Year after year it lies wild, unsown and untilled, with nothing living there but goats. The Cyclopes have no ships, and no builders who could make them. They cannot sail from city to city, or cross the sea to other countries as people with ships do. If they could, they would have settled this island. It is fine land, able to provide everything in its season. Well-watered meadows full of rich grass reach right down to the sea in places. Vines would flourish there. There is flat ground for ploughing, with deep soil that would give a heavy harvest every year. The harbor is excellent too. You need no cable or anchor, and there is no need to tie your ship to anything. Just pull her ashore and stay until a fair wind comes to take you out again. At the head of the harbor a clear spring runs out of a cave, with poplars growing around it.

            We brought our ships into that harbor. There must have been a god guiding us as we came in, because the night was utterly dark and nothing could be seen. Thick mist hung on every side of the ships, while a great mass of cloud covered the moon. Even a man looking carefully for the island could not have found it with his eyes. Nor did we hear breakers to warn us we were approaching shore. We knew nothing of the land until our ships were already upon it. Once we had pulled the vessels up onto the beach, we took down their sails and stepped ashore. We made our camp there on the sand and stayed until daylight.

            When rosy-fingered Dawn, the child of morning, appeared, we wandered over the island, admiring it. The nymphs, Jove's daughters, stirred up the wild goats so that we might have meat for our meal. We fetched spears and bows and arrows from the ships and split into three hunting parties. Heaven gave us fine hunting. I had twelve ships. Each received nine goats, and my own received ten. We ate and drank all day until sunset. There was still plenty of wine. Every man had brought away many jars when we sacked the Cicons' city, and we had not finished them. During the feast we kept looking across at the Cyclopes' land nearby. We could see smoke rising from their stubble fires. We almost imagined we heard them talking, and heard their sheep and goats bleating. At sunset, when darkness came, we slept on the beach. In the morning I gathered everyone to talk.

            I told them, Brave friends, the rest of you must stay here. I will take my own ship across and look at these people myself. I want to find out whether they are cruel savages or decent people who welcome strangers.

            I went aboard and told my crew to join me and cast off. They took their seats and drove their oars through the grey sea. We did not have far to go. On a cliff beside the water we saw a great cave, with laurel branches hanging over it. Many sheep and goats were kept there. Outside stood a large yard surrounded by a high wall. It was made of stones sunk into the earth, with pine and oak trees. An enormous monster lived there. He was away tending his flock. He kept clear of other people and lived outside all law. He was terrible to look at, nothing like a man. He looked more like a great crag standing against the sky on a mountain top.

            I told the crew to beach the ship and wait there. Only the twelve best men would come with me. I took a goatskin full of sweet dark wine. Maron, the son of Euanthes, had given it to me. He was Apollo's priest at Ismarus, where Apollo was the city's guardian. He lived among the trees in the temple grounds. When we took the city, we treated him with respect and spared him, his wife and his child. In return he gave me valuable gifts. There were seven talents of pure gold and a silver bowl, and twelve jars of sweet, unmixed wine with an extraordinary flavor. None of his servants, man or woman, knew about that wine. Only he, his wife and one housekeeper knew it was there. He used twenty measures of water for every measure of wine he drank. Even then, the scent rose so sweetly from the mixing bowl that you could not resist drinking. I filled a large skin with it and packed a bag of food. Something in me feared I would meet a powerful savage who cared nothing for right or law.

            We soon reached the cave. Its owner was still out with the sheep, so we went inside to look about. Cheese covered the racks. The pens could hardly hold all the lambs and kids. They were divided by age, the yearlings in one place, the older lambs in another, and the youngest kept apart again. All the bowls and vessels and milking pails in the dairy were full of whey. My men begged me to let them steal some cheeses and carry them to the ship. Then they could come back for the lambs and kids, drive them down, load them aboard and sail away. How much better that would have been. But I would not listen. I wanted to meet the owner, hoping he might give me a gift. When he did appear, my poor companions learned how badly he could treat them.

            We made a fire, offered some cheese in sacrifice and ate the rest. Then we sat waiting for the Cyclops and his sheep. He came carrying a huge pile of dry wood for his supper fire. He threw it onto the cave floor with such a crash that we fled in terror to the back. He drove in the ewes and the she-goats he meant to milk, leaving the rams and he-goats in the yards outside. Then he rolled an enormous stone across the entrance. Twenty-two strong four-wheeled wagons could not have dragged that stone from the doorway. He sat down and milked the ewes and goats in order, then put each mother's young beside her. He made half the milk into curds and set them in wicker strainers. The rest he poured into bowls to drink with his supper. Once he had finished all his work, he lit the fire. Then he noticed us.
    - id: ch03
      title: A gift for Noman
      blocks:
        - id: ch03-b01
          speaker: polyphemus
          text: "Strangers, tell me who you are and where you sailed from. Are you here to trade? Or do you roam the seas as robbers, attacking everyone and making everyone your enemy?"
        - id: ch03-b02
          speaker: odysseus
          text: |
            The thunder of his voice and the enormous shape of him nearly frightened the sense out of us. But I managed to make myself answer him. We are Achaeans, I said, on our way home from Troy. By Jove's will, the terrible weather has driven us far from the course we wanted to sail. We belong to the army of Agamemnon, the son of Atreus. His name is famous throughout the whole world, because he captured that mighty city and killed so many of its people. So we ask you humbly to welcome us into your home. Give us the gifts that a visiting stranger may properly hope to receive. My lord, remember the anger that can come from heaven. We stand here as men asking for your protection. Jove himself watches over honest travelers. When strangers far from home, or people begging for help, are mistreated, he is the one who punishes those who hurt them. But the Cyclops showed no pity when he answered.
        - id: ch03-b03
          speaker: polyphemus
          text: "You must be a fool, stranger. Or perhaps you know nothing about this country. You tell me to fear the gods and keep clear of their anger? We Cyclopes care nothing for Jove or any of those blessed gods of yours. We are far stronger than they are. I will not spare you or your companions to please Jove. I will do it only if I feel like it. Now, where did you leave your ship when you landed? Is it beyond the headland, or just out there off the shore?"
        - id: ch03-b04
          speaker: odysseus
          text: |
            He wanted to trick the truth out of me, but I had too much cunning to be caught by a question like that. Instead, I told him a lie. Neptune wrecked my ship, I said. He drove her against the rocks at the furthest end of your country. We were swept onto them from the open sea, but I and the men standing here with me escaped from the jaws of death.

            The cruel creature gave no answer. He suddenly seized two of my men and dashed them to the ground as if they were puppies. Their brains scattered, and their blood soaked the earth. He tore them apart for supper. Like a lion out in the wild, he swallowed their flesh, their bones, their marrow and their entrails. He left nothing. We wept and raised our hands to heaven. There was nothing else we could think to do as we watched that horror. When he had filled his great belly with human flesh, he drank plain milk to wash it down. Then he stretched out on the ground among his sheep and fell asleep. My first thought was to draw my sword and drive it into his body. But then I saw what that would mean. We would all die there. None of us could shift the stone he had placed across the door. So we remained where we were, sobbing and sighing until morning.

            At the coming of rosy-fingered Dawn, the child of morning, he lit the fire again. He milked his goats and ewes in their proper order and let each mother have her young. When his chores were done, he grabbed two more of my men and ate them for breakfast. After that he rolled the stone aside with no effort and let the sheep out. He put it back as easily as you might close the lid of an arrow case. Then he shouted, shoo, shoo, and drove the flock up the mountain. I was left in the cave to find some way of taking revenge and winning honor for myself.

            This was the plan I settled on. Near a sheep pen lay the Cyclops' great club. He had cut it from a living olive tree and meant to use it as a walking staff when it dried. It was so enormous that it looked to us like the mast of a twenty-oared trading ship, a large ship fit to carry heavy cargo across the open sea. I cut a piece about six feet long from it. I gave that to the men and told them to smooth down one end evenly. When they had done it, I sharpened the point myself and hardened it in the fire. Then I hid it beneath the dung that lay all over the cave. I told the men to draw lots. Four would have to help me lift the wood and bore it into the monster's eye while he slept. The lot chose exactly the four I would have picked myself. With me, that made five of us.

            That evening the wretch came back with his flock. This time he brought every animal inside. Not one stayed in the yards. Perhaps it was a sudden whim, or perhaps a god prompted him. He rolled the stone back against the entrance, sat down to milk the ewes and goats in order, and let their young go to them. When he had finished, he caught two more men and made his supper of them. I took an ivy-wood bowl of dark wine and approached him with it in my hands.

            Cyclops, I said, you have eaten a good deal of human meat. Take this bowl and have some wine with it. Then you can taste the kind of drink we had aboard my ship. I brought it here as an offering for you, hoping you would feel some pity for me and help me on the journey home. Instead, you go on raging and behaving so cruelly that no one can bear it. You ought to feel ashamed of yourself. How can you expect anyone else to visit you, when you treat the people who come to your house like this? He took the bowl and drank. He loved the taste so much that he begged for another full bowl.
        - id: ch03-b05
          speaker: polyphemus
          text: "Give me another bowl, would you? And tell me your name. Tell me now. I have a present for you, one you will enjoy. We have wine of our own here. Grapes grow in our soil and ripen in the sun. But yours tastes like Nectar and Ambrosia mixed together."
        - id: ch03-b06
          speaker: odysseus
          text: "I poured more wine for him. Three times I filled the bowl, and three times he emptied every drop, with no thought of caution or danger. When I could see that the wine had gone to his head, I made my voice sound as convincing as I could. Cyclops, you wanted to know my name. I will tell you now, and you must give me the present you said I would have. My name is Noman. My mother and father have always called me that, and it is what all my friends call me too."
        - id: ch03-b07
          speaker: polyphemus
          text: "Noman's friends will be eaten first. Noman himself can wait until the end. That is the gift I have for him."
        - id: ch03-b08
          speaker: odysseus
          text: "As the cruel brute said it, he swayed and fell flat on his back. His heavy neck dropped backwards, and sleep took hold of him. Then he was sick. He brought up wine and the lumps of human flesh he had stuffed himself with. He was completely drunk."
    - id: ch04
      title: Through the doorway
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            I pushed the wooden stake deep into the embers to heat it. I encouraged the men, so none would lose heart. Although the wood was still green, it was nearly ready to catch fire when I pulled it out, glowing hot. The men gathered round. Heaven had put courage into them. Together we drove the sharp point into the Cyclops' eye. I pressed down with all my weight and kept twisting. It was like using an auger to drill through a ship's plank. Two men turn a wheel and strap, and the tool keeps spinning for as long as they work it. That was how we turned the burning wood in his eye. Boiling blood bubbled round it. Steam rose from the burning eyeball and scorched his brows and lids. The roots of the eye spat in the heat. You know how a smith hardens an axe or hatchet by plunging the iron into cold water. The iron gains its strength that way, and it hisses loudly as it goes in. So the Cyclops' eye hissed around the olive stake. His terrible screams rang through the cave.

            We ran from him in fear. He dragged the blood-soaked stake out of his eye and flung it away, mad with pain and anger. He shouted for the other Cyclopes living on the bare headlands nearby. They heard him and came from every direction to his cave, calling to ask what was wrong.
        - id: ch04-b02
          speakers: [cyclops_1, cyclops_2, cyclops_3]
          ensemble: chorus
          text: "Polyphemus, what has happened to you? Why are you shouting like this in the middle of the night? You have broken the quiet and we cannot sleep. Surely no man is stealing your sheep? Is anyone trying to kill you, by a trick or by force?"
        - id: ch04-b03
          speaker: odysseus
          text: "Polyphemus shouted his answer from inside the cave."
        - id: ch04-b04
          speaker: polyphemus
          text: "Noman is killing me by fraud. No man is killing me by force!"
        - id: ch04-b05
          speakers: [cyclops_1, cyclops_2, cyclops_3]
          ensemble: chorus
          text: "If nobody is attacking you, you must be sick. When Jove sends an illness, no one can do anything about it. You had better ask your father Neptune for help."
        - id: ch04-b06
          speaker: odysseus
          text: |
            They went away. I laughed to myself. My name and my clever trick had worked. But the Cyclops was still groaning in terrible pain. He groped around until his hands found the stone, and moved it away from the door. Then he sat in the entrance with his hands stretched out. He meant to catch anyone trying to walk out with the sheep. He thought I might be fool enough to do that.

            All the while I kept trying to find the best way to save my own life and the lives of my companions. I turned one plan after another over in my mind, as a man does when he knows his life depends on it. The danger we were in was terrible. In the end I chose this plan. The male sheep were fully grown and carried heavy fleeces of black wool. Without making a sound, I tied them together in groups of three, using some of the flexible branches on which the wicked creature used to sleep. One man would be fastened underneath the sheep in the middle. The sheep on either side would keep him hidden. That meant three sheep were needed to take each man out. For myself, I chose a ram finer than all the others. I caught hold of his back and worked my way underneath, nestling into the thick wool along his belly. I hung there with my face upwards, holding firmly to the fleece. I had to be patient and keep that grip all the time.

            We waited in fear for the morning. When rosy-fingered Dawn, the child of morning, appeared, the rams hurried out to pasture. The ewes stayed bleating round the pens. They needed milking, and their udders were almost bursting. In spite of his pain, the Cyclops felt along the backs of every sheep as it stood before him. He never guessed that men were underneath their bellies. My ram came last, weighed down by his great fleece and by me with all my tricks. Polyphemus caught hold of him as he was going out.
        - id: ch04-b07
          speaker: polyphemus
          text: "My good ram, why are you the last out this morning? You never let the ewes lead you. You always run ahead of the flock to the fields of flowers or the bubbling spring. At night you come home first. Yet here you are, behind them all. Do you know that your master has lost his eye? Are you sorry for me? That wicked Noman and his hateful friends got me drunk and blinded me. But I will kill him yet. If only you could understand and speak. You could tell me where that wretch is hiding. I would smash his head on the ground and scatter his brains through the cave. That would give me some comfort for what that worthless Noman has done to me."
        - id: ch04-b08
          speaker: odysseus
          text: |
            He finished speaking and drove the ram out. Once we were a little beyond the cave and its yards, I let myself down from under the ram and freed my friends. The sheep were very fat. We kept turning them the way we wanted, and managed to drive them down to the ship. The crew were overjoyed to see us alive, but they wept for those the Cyclops had killed. I nodded and frowned at them to stop the crying. I ordered them to get every sheep aboard at once and take the ship to sea. They climbed in, sat at their oars and struck the grey water.

            When we were just far enough out for my voice still to reach him, I began to taunt the Cyclops.
    - id: ch05
      title: The name and the curse
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: |
            Cyclops, I shouted, you should have found out what sort of man you faced before eating his friends in your cave. You villain, eating guests under your own roof! Did you think you would get away with that? Now Jove and the other gods have punished you.

            Hearing me made him still more furious. He tore the top from a high mountain and hurled it in front of the ship. It almost struck the tip of the rudder. The rock shook the sea as it fell, and its great wave swept us back towards the mainland, forcing us close to shore. I seized a long pole and pushed the ship away. I nodded to the men that they must row for their lives, and they pulled with all their strength. When we were twice as far out as before, I wanted to shout another insult. But my men begged me to keep quiet.
        - id: ch05-b02
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: "Do not be so mad! Stop provoking that savage. He has already hurled one rock and driven us back to the mainland. We thought we were dead. If he had heard another voice then, he would have thrown more of those jagged rocks. He would have crushed our heads and the ship's timbers to a pulp. He can throw them a very long way."
        - id: ch05-b03
          speaker: odysseus
          text: "I refused to listen to their pleas. In my anger I shouted across the water, Cyclops, if anyone asks who took away your sight and ruined your looks, give them my name. Tell them it was the brave warrior Ulysses, son of Laertes, who has his home in Ithaca. He groaned when he heard it, and cried out to me."
        - id: ch05-b04
          speaker: polyphemus
          text: "Oh, no! The old prophecy has come true. We once had a prophet here, Telemus, the son of Eurymus. He was tall and brave, and a great seer. He kept telling the Cyclopes their future until he was an old man. He said this would happen to me. He said Ulysses would take away my sight. All this time I have expected a splendid-looking man with strength beyond any human being. Instead, a puny little weakling blinds me by catching me drunk. Come back, Ulysses. Let me welcome you with gifts. I will ask Neptune to help you on your voyage. He is my father, and I am his son. If he chooses, he can heal me. No other god or man can do that."
        - id: ch05-b05
          speaker: odysseus
          text: "I answered him, I only wish I were as certain of killing you and sending you straight down to Hades as I am that Neptune himself cannot heal your eye. Then he raised both hands towards the sky and prayed."
        - id: ch05-b06
          speaker: polyphemus
          text: "Great Neptune, listen to me. If I really am your own son, keep Ulysses from ever reaching home alive. But if he must return to his friends in the end, let him come late and in misery, with all his men lost. Let him come in another man's ship, and let him find trouble waiting in his own house."
        - id: ch05-b07
          speaker: odysseus
          text: |
            Neptune heard his prayer. Then the Cyclops took up another rock, much bigger than the first one he had thrown. He swung it high above him and hurled it with tremendous force. It fell just short of the ship, coming very close to striking the end of the rudder. The sea shook where the great rock plunged into it. This time the wave it raised swept us onwards, carrying us towards the shore of the island.

            At last we reached the island where our other ships waited. Our friends had been mourning us and watching anxiously for our return. We ran the ship onto the sand and stepped ashore. We brought the Cyclops' sheep down too, and divided them fairly, leaving no man anything to complain of. Everyone agreed I should have the great ram as an extra share. I killed it on the shore as a sacrifice and burned its thigh bones for Jove, the ruler of all. But he paid no attention to my offering. He was thinking only of destroying my ships and my companions.

            We spent the whole day eating and drinking until sunset. When darkness came, we slept on the beach. Then rosy-fingered Dawn, the child of morning, appeared, and I told the men to board the ships and cast off. They took their places and struck the grey sea with their oars. We sailed on with sorrow in our hearts, but glad to have escaped death though we had lost our comrades.
