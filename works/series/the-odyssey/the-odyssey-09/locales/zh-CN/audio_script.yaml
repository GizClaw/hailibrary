audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    polyphemus:
      display_name: 波吕斐摩斯
      tts: {delivery: "粗直强横", timbre: "低沉粗砺", pace: "缓慢而有压迫感", pitch: "低音"}
    cyclops_1:
      display_name: 邻近的独眼巨人甲
      tts: {delivery: "直截了当", timbre: "粗厚", pace: "平稳", pitch: "低音"}
    cyclops_2:
      display_name: 邻近的独眼巨人乙
      tts: {delivery: "急躁干脆", timbre: "沙哑有力", pace: "稍快", pitch: "中低音"}
    crew_1:
      display_name: 船员甲
      tts: {delivery: "诚恳直率", timbre: "清楚略带沙哑", pace: "利落", pitch: "中音"}
    crew_2:
      display_name: 船员乙
      tts: {delivery: "急切而务实", timbre: "干涩有力", pace: "稍快", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 十二条船出发的时候
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯向国王说出了姓名。
        - id: ch01-b02
          speaker: odysseus
          text: |
            王啊，歌里那个奥德修斯，就是我。我父亲叫拉厄尔忒斯，家在伊萨卡。那里石头多，山上有树林，外乡人未必觉得多好看。可我去过许多岛，哪一个也比不上它。卡吕普索和喀耳刻都想留我，我还是要回家。
            离开特洛伊时，我身边还有十二条船。
            我们打进伊斯马罗斯，杀了人，抢了财物，还把女子掳走。这是基科涅斯人的城。我分完东西就催着出发，可同伴们在海边烤牛肉，喝着抢到的酒，不愿走。逃出去的人到内陆搬来救兵。我们从早打到晚，一条船死了六个人，才把剩下的人带走。
            在海上，我们喊着死去同伴的名字。不久，又有风暴把帆撕坏，只好上岸躲避。重新出海，风和海流把船冲离回家的方向，到第十天才看见食莲人的土地。
            我让三个人去探问。当地人请他们吃莲果，没有伤害他们。可吃了那东西，他们连家都不想了，留在那里，也不回来报告。我把人强拉回来，绑在桨凳底下。他们一直哭，要回去再吃。我怕别人也尝到，赶紧叫大家离开。
    - id: ch02
      title: 巨石封住了洞口
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            再后来，船队停在一个有很多野山羊的岛上。有水喝，有肉吃，船也安全。隔着水，看得见另一边的烟，听得到羊叫和人声。我想去见见那边的人。
            我留下别的船，带自己的船过去，让十二个同伴陪我上岸。我还拿着一袋又烈又香的酒。马隆是伊斯马罗斯的阿波罗祭司，破城时，我没杀他，也放过了他妻子和孩子。这酒就是他的谢礼。
            我们走进一座空洞穴，里面摆着奶酪，圈着小羊，还有挤奶用的东西。大家不想等主人。
        - id: ch02-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: |
            拿点奶酪，赶些羊上船，走吧！
        - id: ch02-b03
          speaker: odysseus
          text: |
            我不肯。我以为主人会招待我们，说不定还肯送礼物，就吃着他的奶酪，留在那里。
            一声巨响，独眼巨人扔下了带回来的柴。我们往暗处躲。他赶羊进洞，要给它们挤奶，又拿巨石堵住入口。那石头，我们所有人合力也推不开。
            羊群照管完，他生起火，一眼看到了我们。
        - id: ch02-b04
          speaker: polyphemus
          text: |
            你们是谁？来我洞里干什么？
        - id: ch02-b05
          speaker: odysseus
          text: |
            我解释说，从特洛伊回来，遭风偏了方向。我们跟着阿伽门农打仗，他带军队攻破了特洛伊。我求巨人帮忙，还提醒他，宙斯护着向人求援的旅客。
        - id: ch02-b06
          speaker: polyphemus
          text: |
            放不放你，由我说了算，宙斯管不着。你的船在哪儿？
        - id: ch02-b07
          speaker: odysseus
          text: |
            我说，船让波塞冬打坏了，只有我们活下来。这当然是假话，我得保住留在海边的人。
            他抓住两个同伴，摔在地上，又撕开尸体吃下去。我们只能哭着求神，没有办法救人。他睡后，我握着剑想冲过去，忽然又想到那块大石头。杀死他，我们也就永远出不去了。
            第二天早上，他再吃两人，然后开门放羊，又把洞封住。我们还困在那里。
    - id: ch03
      title: 没有人在害我
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            要出去，得留着他开门。我发现羊圈边有根橄榄木，是他打算用来作手杖的。我们拿它做成木桩，先藏好，抽签找出四人帮我，等到晚上。
            他这次把全部的羊都赶进来，又吃了两个同伴。进洞的十二人，已经死了一半。
            我端着马隆的酒走上前，告诉他，本来想用这酒换他帮忙回家，请他尝一尝。
            他喝了就要加，连喝三碗，说话都不清楚了，还要问我的名字。
        - id: ch03-b02
          speaker: polyphemus
          text: |
            你叫什么？我得送你件东西。
        - id: ch03-b03
          speaker: odysseus
          text: |
            我是没有人。我的父母朋友，一向这样叫我。
        - id: ch03-b04
          speaker: polyphemus
          text: |
            行，先吃别人，最后才吃没有人。就送你这个。
        - id: ch03-b05
          speaker: odysseus
          text: |
            他往后一倒，把酒和吃下的人肉都吐了出来，才睡沉了。我们拿出木桩，把尖头烧热，合力刺进他的眼睛。他一声惨叫，拔出木桩，我们赶紧躲散。洞外传来邻居的喊声。
        - id: ch03-b06
          speakers: [cyclops_1, cyclops_2]
          ensemble: duo
          text: |
            波吕斐摩斯，是谁害你啊？
        - id: ch03-b07
          speaker: polyphemus
          text: |
            没有人用诡计害我！是没有人！
        - id: ch03-b08
          speaker: odysseus
          text: |
            他们以为，既然没有人来害他，那就是神让他病了，叫他求父亲波塞冬帮忙，便走开了。
            假名字起了作用，我差点笑出来。可波吕斐摩斯还是守住了出口。他推开石头，坐在那里，双手伸着，要捉逃出去的人。
    - id: ch04
      title: 真名传过了海面
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            我把主意打到了羊身上。三只一组，把人绑在中间那只的肚子下面，两边的羊挡住他。我自己挑最大的公羊，攥着它腹下的长毛，仰面吊住，熬到天亮。
            羊往外走，他就摸它们的背。我们近在他手下，却没被摸到。驮我的那只走得慢，留在最后。他拦了下来。
        - id: ch04-b02
          speaker: polyphemus
          text: |
            平时你总跑第一个，怎么今天落后了？你也替我伤心吗？要是能开口，告诉我那个没有人躲在哪儿，多好啊。我把他的头往地上砸碎，也能出出气！
        - id: ch04-b03
          speaker: odysseus
          text: |
            我不敢动，等那只手松开。公羊终于把我带出去。出了院子，我从羊下爬出来，解开其他人，把羊赶去船边。等着的同伴起初欢喜，发现有人没回来，便哭了。我赶紧摆手，叫他们先别出声，上船划走再说。
            可离岸不远，我自己却朝洞口喊，吃客人的人，别以为逃得掉惩罚。
            一块大石头从岸上飞来，落在船后。巨人是朝我的声音扔的。浪把船推回海边，我用长竿撑开，大家使劲划，总算又划远了。他们求我。
        - id: ch04-b04
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: |
            别喊了！他能听见你，再扔一块，我们的船就保不住了！
        - id: ch04-b05
          speaker: odysseus
          text: |
            我明明靠假名才活着逃走，这时却一定要让他记得我是谁。我喊回去，要是有人问，就说弄瞎他的是伊萨卡的奥德修斯，拉厄尔忒斯的儿子。
            他痛苦地叫起来。从前的预言说，奥德修斯会让他失明。他以为会遇到一个力气惊人的英雄，没想到是个拿酒骗他的小个子。他要我回去，说会好好招待，还愿请父亲保佑我回家。
            我却说，他那只眼睛，连波塞冬也没法治。我只恨不能像认定这件事一样，认定能把他杀死，送去见死者。他举起手，向天上求告。
        - id: ch04-b06
          speaker: polyphemus
          text: |
            波塞冬，父亲！如果我确是你的儿子，就叫奥德修斯回不了家。他要是一定得回去，也让他耽搁很久，丢掉所有人，坐别人的船到家，再碰上家里的祸事。
        - id: ch04-b07
          speaker: odysseus
          text: |
            波塞冬把这话听进去了。
            巨人又扔来一块石头。这回的浪把我们送向前方，总算回到其他船等候的岛上。我们分了羊，我把那只最大的公羊献给宙斯，可我的祈求没被接受。宙斯想的，是怎么把船和我的同伴都毁掉。
            第二天，活着的人坐回桨位。十二条船又出了海。
