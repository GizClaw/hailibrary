  chapters:
    - id: ch01
      title: 从故乡说起
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 奥德修斯这样回答国王。
        - id: ch01-b02
          speaker: odysseus
          text: |
            阿尔基诺奥斯王，这位歌者的嗓子仿佛得了天神的赐福，听他唱歌，实在叫人欢喜。人们聚在一起庆贺，客人一个个坐好听歌，桌上摆满面包和肉，侍酒的人替大家把杯子斟满。还有什么景象比这更美，什么事比这更让人快活呢？可您现在问起我的苦难，又把那些伤心的回忆唤醒了。天神给我的折磨太多，我都不知道从哪里开头，又怎样讲下去，怎样讲到最后。

            我先说说名字吧。让各位知道我是谁，往后，假如我能熬过这些灾难，虽说我家离得远，也能请你们去做客。我叫奥德修斯，是拉厄尔忒斯的儿子。我有各种谋略，人间早已传遍了我的名声，连天上都听得到。我的家是伊萨卡，那里有座高高的涅里同山，山上都是森林。附近几座岛靠得很近，有杜利基翁，有萨墨，还有满岛树木的扎金索斯。伊萨卡低低地伏在天边，最靠日落的方向，其他岛离它较远，在太阳升起的那一边。我们那座岛虽然崎岖，却养育了勇敢的人。我看过的地方，再没有一个比它更叫我喜爱。卡吕普索女神把我留在洞里，想让我娶她。埃埃亚岛的喀耳刻很会使法术，也想留下我做丈夫。可她们谁都劝不动我。一个人最牵挂的，还是父母和故乡。在外国，哪怕住得再富贵，离父母那么远，也不能让他满足。接下来我要讲的，就是宙斯让我在离开特洛伊、回家的路上，经历的那些危险。

            刚从特洛伊出海，风就把我们带到伊斯马罗斯，那是基科涅斯人的城。我攻破城池，用刀剑杀死居民，掳走他们的妻子，还抢得大批财物。我们把战利品公平分给每一个人，没有谁能说自己吃了亏。我说，得赶紧走了。可伙伴们真傻，偏偏不肯听。他们还留在海边，喝掉许多葡萄酒，又宰杀大批牛羊来吃。这时，城里人已经向内陆的同族求救。赶来帮忙的，人更多，身体更强，也更熟悉打仗的本领。他们可以在战车上作战，也能按战场的需要，下车用步兵的打法。清早，人就涌了过来，像夏天的花和叶子一样多。天神又在跟我们作对，我们被逼得很紧。两军在船边摆开阵势，把装着青铜矛头的长枪对准对方。上午，太阳还在向上升，我们虽然人少，还顶得住。等太阳渐渐落下，到了人们给耕牛卸掉轭的时候，基科涅斯人打赢了。每条船都死了六个人，我们只能带着剩下的人逃走。

            走的时候，大家心里难受，却也为活着逃出来而庆幸。那些死在基科涅斯人手里的伙伴，我们一个个叫着名字，每个人都叫了三遍，才开船。宙斯随后掀起北风，风越来越大，刮成了飓风。厚云遮住大地和天空，黑夜好像一下子从天上扑来。我们先顺风行船，可风把船帆撕烂了。怕船毁掉，只好收下帆，拼命往陆地划。我们在岸上躺了两天两夜，身子累透，心里也苦透。第三天一早，才又把桅杆竖起，扬起帆，回到各自的位置，让风和舵手带着船走。我原本可以就这样平安到家。可船绕过马勒亚海角时，北风和海流又迎面来了，把我推离航线，赶到基西拉岛附近。

            接着，逆风让我们在海上漂了九天。第十天，我们到了食莲人的地方。他们吃的是一种花结出来的果子。我们上岸取淡水，船员们在船旁的岸上吃午饭。吃喝完，我派出两个同伴，另带一个随从，去看看这里住着怎样的人。他们马上出发，遇见了食莲人。人家没有害他们，只拿莲果给他们吃。那果子太甜美了，吃了的人连故乡也不想了，更不愿回来告诉我发生了什么，只想着留在那里，和食莲人一道吃果子，再也不提回家。我只好硬拖他们回船。他们哭得厉害，我还是把人绑在坐凳底下。接着叫其余人赶快登船，免得又有人吃了莲果，不愿回家。大家坐定，船桨划开了灰色的海。
    - id: ch02
      title: 洞穴的主人
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            我们就这样忧愁地航行，后来到了独眼巨人的土地。那里的巨人既不讲法，也不讲人情。他们不播种，不耕田，全靠天过日子。小麦、大麦和葡萄自己长出来，没有人照料，野葡萄受了阳光雨水，也能拿来酿酒。他们没有法律，也不开集会，各自住在高山的洞里，只管在自己家中做主，邻居的事全不理。

            他们的港口外还有一座小岛，树多，地也肥。它没紧挨着他们的陆地，可也不远。岛上野山羊多极了，繁殖得很快，从来没有人来惊扰。猎人平日里肯走森林、攀险崖、吃尽苦头，却没有人到这里。也没人耕地，没人放牲口把草吃尽。土地一年一年荒着，不犁也不播，除了山羊，没有别的生灵。独眼巨人既没有船，也没有会造船的人，不能从这座城航到那座城，跨过海去别的国家。要是有船，他们应该早来这里住了。这岛实在好，每个季节都能出产东西。草地水足草嫩，有些一直延伸到海边。葡萄种在这里会长得好，平地可以耕种，土层又深，年年该有好收成。港口也省事，不必系缆，不必下锚，也不用拴船。把船拖上滩，住着等顺风就行。港湾最里面，有清水从一个洞里流出，泉边围着白杨树。

            我们进去时，夜黑得伸手不见五指，一定是有位神引路。浓雾包围船只，月亮又藏在云后，就算瞪大眼睛寻找，也看不到小岛。岸边也没有碎浪声，让我们知道靠近了。一直等船着陆，才发现已经到岸。我们把船拖上沙滩，降下帆，登岸过夜，直到天明。

            清晨的孩子、玫瑰色手指的黎明到来了。我们四处看这座美丽的小岛。宙斯的女儿，那些山林水泽的仙女，把野山羊赶了出来，好让我们猎些肉吃。我们从船里取出弓箭和长矛，分成三组打猎。上天帮忙，收获很好。我共有十二条船，每条分到九只山羊，我自己的船分到十只。我们从早吃喝到日落，尽情饱餐。酒还剩得多。攻打基科涅斯人的城时，大家搬了许多罐，现在还没有喝完。吃着饭，我们不断向附近巨人的土地张望，看见他们烧禾茬的烟，甚至好像能听见人声，还有山羊绵羊的叫声。天黑以后，我们又在海滩上睡下。第二天一早，我叫大家来商量。

            我说，勇敢的伙伴们，你们其余的人留在这里，我带自己的船过去，看看那些人到底怎样。是凶恶的野人，还是懂待客、讲人情的人？我登了船，也叫自己船上的人上来解缆。大家入座划桨，在灰色的海上前进。没多久就到了。海边的崖壁上，有个大洞，月桂枝叶垂在洞口，许多山羊绵羊养在里面。外头是个大院子，高墙用埋进地里的石头和松木、橡木围成。住在那里的怪物非常庞大，当时正在外面放羊。他不跟旁人来往，什么规矩也不守。模样不像人，倒像高山顶上突出的一大块岩石，直耸到天空。

            我让船员把船拖上岸，原地看守，挑了最好的十二个人跟我走。我带了甜醇的黑葡萄酒，装在羊皮袋里。酒是欧安忒斯的儿子马隆给的。他是阿波罗的祭司，而阿波罗庇护伊斯马罗斯城。马隆住在神庙的树林里。破城时，我们敬重他，放过他、妻子和孩子，他便送来厚礼，有七塔兰特纯金，一只银碗，还有十二罐味道绝好的甜酒，完全没兑水。男仆女仆都不知道这酒，只有他、妻子和一个女管家知道。他喝一份酒，会加二十份水，可香气还是从调酒碗里飘出来，叫人忍不住想喝。我装满一大袋，又背上干粮。心里总觉得，恐怕要遇见力气极大，却既不讲理、也不守法的人。

            我们没走多久就到了洞口。主人还在外面放羊，于是走进洞，把能看见的东西都查看了一遍。乳酪架上堆满乳酪，小绵羊和小山羊多得羊圈几乎装不下。它们还分了不同的群。一岁的养在一处，幼羔里年岁大些的在一处，最小的又关在另一处，彼此全不混杂。再看奶房，盛奶的器皿，碗盆，还有挤奶的桶，每一样都装满乳清。伙伴们看见这些，就央求我，先偷乳酪带回船，再回来把小羊都赶下去，装船以后马上离开。真要听他们的，可就好得多了！但我偏没答应，总想先见到主人，盼他亲手给我一份礼物。等到真见了面，我那群可怜的同伴才明白，这主人有多不好对付。

            我们生火，拿些乳酪祭神，再吃一些，然后坐等巨人回家。他带了一大捆干柴，要烧火做晚饭，往洞里一摔，那声音吓得我们全躲到最深处。他把母绵羊和要挤奶的母山羊赶进洞，公羊都留在外面的院里。又滚来一块巨石，把门堵严。那石头，拿二十二辆结实的四轮车来拖，也拖不动。他坐下，挨个给羊挤奶，再让小羊找自己的母亲。一半奶凝成乳酪，装在柳条滤篮里，一半倒进碗里，晚饭时喝。干完活，他点起火，这才看见我们。
        - id: ch02-b02
          speaker: polyphemus
          text: 你们这些外乡人，从哪里航来？究竟是谁？做生意的，还是海盗？走到哪里抢到哪里，跟天下人都结了仇？
        - id: ch02-b03
          speaker: odysseus
          text: 他的嗓门，再加上那个大身躯，把我们吓得几乎失去神智。我还是勉强说，我们是阿开亚人，从特洛伊回家。宙斯要这样，风浪又把我们推得离航路很远。我们跟随阿特柔斯的儿子阿伽门农，他攻破那么大的城，杀了那么多人，天下都知道他的名声。现在求您照待客的规矩收留我们，给我们应得的礼物。尊贵的主人，请想想天神的怒火。我们是来求助的，宙斯保护正派旅人，落难的外乡人和求告者受了欺侮，他会惩罚欺侮他们的人。可巨人的回答，半点怜悯也没有。
        - id: ch02-b04
          speaker: polyphemus
          text: 你这外乡人，不是傻，就是根本不懂这里的事！还教我怕天神，躲他们的怒气？我们独眼巨人，比宙斯和你那些神强多了，谁在乎他们！我饶不饶你们，只看自己高不高兴，才不管宙斯。说吧，船停在哪里？绕到海角背后了，还是就在这边海上？
        - id: ch02-b05
          speaker: odysseus
          text: |
            他想套我的话，我可不上当。我骗他说，波塞冬把船从外海推上你们这片土地尽头的礁石，撞得粉碎。只有我和这几个同伴活着逃出来。他一个字也没回，忽然抓起两个人，像摔小狗一样往地上摔。脑浆飞出来，血把泥土浸湿。他把两人撕开，吃起晚饭，简直像荒野里的狮子，肉、骨、骨髓、内脏，什么都吞下，一点不留。我们看着这幅惨景，只会哭，举起双手向天祈求，再想不出办法。他吃饱人肉，再喝纯奶顺下肚，就在羊群里伸开身体睡了。我差点拔剑刺进他的要害，可一想，杀了他，我们也得死。堵门的石头没人移得动。只好留在原处，哭着叹气，等天亮。

            玫瑰色手指的黎明，这清晨的孩子，又出现了。巨人照常生火挤奶，把小羊放回母羊身边。做完就又抓两个人当早饭。接着他轻易挪开巨石，赶出羊群，再堵上洞口，像给装满箭的筒子盖上盖一样省力。他喊着嘘、嘘，把羊赶上山。剩下我在洞里想办法，我要报仇，也要挣得荣誉。
    - id: ch03
      title: 没有人
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            我终于想好了。羊圈旁有根大橄榄木棍，刚砍下来，巨人准备晒干当手杖。它大得像二十桨商船的桅杆，那种船能装重货，能开进外海。我截下六英尺左右的一段，叫伙伴把一头削匀。我自己再把头削尖，用火烤硬，藏进满洞都有的粪堆。接着抽签，选出四个人，跟我一同趁他熟睡把木桩扎进眼睛。选中的，正是我最想要的四个，加上我，五个人动手。

            晚上巨人回来，这次把所有羊都赶进洞，外面一只不留。也许他忽然这么想，也许是神叫他这样。他堵好门，照例挤奶，放小羊吃奶，接着又抓两人当晚饭。我端起常春藤木碗，盛满黑葡萄酒走上前，说，独眼巨人，吃了这么多人肉，也喝点酒，尝尝我们船上的东西。我本来要献给你，希望你同情我，帮我回家。可你一直凶暴地胡来，实在让人受不了。你该羞愧！照这样待客，谁还肯来看你？他拿过碗喝下，太喜欢那滋味了，赶着向我要更多。
        - id: ch03-b02
          speaker: polyphemus
          text: 好心再倒一碗，快说你叫什么！我给你个好礼物，准保你喜欢。我们这里也长葡萄，太阳晒熟了，我们也酿酒。可是你这酒，就像把神酒和神食调到一起！
        - id: ch03-b03
          speaker: odysseus
          text: 我又倒给他，总共倒了三碗，他一碗碗全喝干，毫不提防。酒劲上头，我便尽可能装得可信，对他说，你问名字，我告诉你，也请你给我答应的礼物。我叫没有人，父亲母亲，还有朋友，一直都这么叫我。
        - id: ch03-b04
          speaker: polyphemus
          text: 那我就把没有人的朋友先吃完，把没有人留到最后吃。这就是送他的礼物。
        - id: ch03-b05
          speaker: odysseus
          text: |
            这恶徒说着便晃倒了，仰面朝天，粗脖子沉沉往后一垂，睡死过去。他醉得呕吐，把酒和那些嚼过的人肉块都吐了出来。我把木桩深深插进炭火，同时鼓励伙伴，不能胆怯。木头虽然还湿，眼看也要烧着。我把通红的木桩抽出来，大家聚在身边，天神给了他们勇气。我们把尖头刺进巨人的眼，我压上全身的重量，一圈一圈地转。像在船板上打孔那样，两个工人拉着轮和皮带，能让钻子一直转下去。我们这样搅动滚热的木桩，热血在上面冒泡。眼球烧出的蒸气，烫焦他的眼皮眉毛，眼根噼啪作响。铁匠把斧或锛浸进凉水，让铁变硬，会发出很响的嘶声。橄榄木周围的眼睛，就那么嘶嘶响着。巨人惨叫，满洞都是回声。

            我们吓得跑开。他把沾满血的木桩拔出，疼得发狂，怒不可遏，猛地扔掉，喊来附近荒凉海角上的其他巨人。邻人听见叫喊，从各处跑来，围在洞外问他。
        - id: ch03-b06
          speakers: [cyclops_1, cyclops_2, cyclops_3]
          ensemble: chorus
          text: 波吕斐摩斯，你怎么回事？半夜里吼成这样，把清静全搅了，我们还睡不睡？有人偷羊吗？还是有人想杀你？使了诡计，还是动了武？
        - id: ch03-b07
          speaker: odysseus
          text: 波吕斐摩斯在洞里大吼着回答。
        - id: ch03-b08
          speaker: polyphemus
          text: 没有人用诡计杀我！没有人用蛮力杀我！
        - id: ch03-b09
          speakers: [cyclops_1, cyclops_2, cyclops_3]
          ensemble: chorus
          text: 没有人害你，那就是生病了。宙斯让人生病，谁也没办法。求你父亲波塞冬去吧。
        - id: ch03-b10
          speaker: odysseus
          text: |
            他们就走了。我心里暗笑，这条计策成了。巨人疼得呻吟，伸手乱摸，找到石头后把它挪开，自己坐在洞口，双手伸在面前，等着捉人。他以为我会笨得跟着羊群走出去。

            我还在拼命想，怎样才能把自己和同伴的命保下来。我一个办法接一个办法地琢磨，知道危险就在眼前，大家能不能活，全看这主意了。最后，我看中了洞里那些公羊。它们已经长大，身强体壮，披着厚厚的黑毛。我拿来恶徒铺着睡觉的柔软枝条，尽量不发出一点声音，把羊三只一组捆住。每一组中间的羊，腹下绑一个同伴，两边的羊负责遮挡。三只羊，藏一个人。给自己选的，是全群最出色的公羊。我攀着它的背，钻进肚子底下浓密的毛里，脸朝上悬着，两手紧紧攥住羊毛。我耐着性子，一直握住，一刻也不能松手。

            我们害怕地等了一夜。玫瑰色手指的黎明来了，公羊急着出去吃草，母羊的奶胀得快破了，还在圈边叫，等主人来挤。巨人忍痛，摸过每一只站在面前的羊背，却没想到人会在羊肚子下面。我那只羊毛厚，还驮着我这个满腹诡计的家伙，走在最后。到门口时，波吕斐摩斯抓住了它。
        - id: ch03-b11
          speaker: polyphemus
          text: 好公羊，今天怎么落在最后？你平常哪里肯让母羊先走！到花开的草地，到冒水的泉边，都是你跑在前面，夜里也是你先回家。今天却拖在后头。你知道主人瞎了，在替我难受吗？可恶的没有人和他的混账朋友，灌醉我，弄瞎我。不过我还要他的命！你要听得懂，又能说话，就能告诉我他藏哪里了。我会把他脑袋往地上砸，砸得满洞脑浆。这个坏透了的没有人这样害我，也好让我稍稍解点恨。
        - id: ch03-b12
          speaker: odysseus
          text: |
            他把羊赶了出去。等离开洞和院子一小段，我先从羊腹下钻出，再解开伙伴。这些羊很肥，我们一路把它们拦往该走的方向，终于赶到船边。留守的人见我们活着，欢喜得很，又为死去的伙伴哭。我皱眉点头，示意他们别哭出声，赶紧把羊装船，马上出海。大家登船坐好，用桨划着灰色的海水。

            船划到我喊话还能传去的地方，我开始嘲笑那独眼巨人。
    - id: ch04
      title: 喊出的真名
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            我喊，独眼巨人，你吃别人伙伴以前，就该看看自己惹的是谁！在家吞吃来客，你这恶徒！还以为不会有报应吗？宙斯和众神已经罚你了。

            他越听越怒，扯下一座高山的山头扔过来，落在船前，几乎打中舵尾。石头把海震动了，大浪倒推我们，逼回岸边。我拿起长篙撑住船，点头叫大家使劲划，保住性命。大家尽力向外划，划到原来两倍远，我又想骂他。伙伴们却求我，千万闭嘴。
        - id: ch04-b02
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: 别再犯傻惹他！刚才一块石头就把船冲回陆地，我们以为命都没了。那时他要是再听见一声，还会扔来那些尖石头，把脑袋和船板都砸烂。他可是能扔得很远！
        - id: ch04-b03
          speaker: odysseus
          text: 我没听劝，气冲冲地喊，谁要问你，是谁弄瞎你的眼，毁了你的模样，就说是伊萨卡的勇士奥德修斯，拉厄尔忒斯的儿子！他呻吟着喊起来。
        - id: ch04-b04
          speaker: polyphemus
          text: 唉，原来的预言真应验了！过去有个先知住在这里，叫忒勒摩斯，是欧律摩斯的儿子。他高大勇敢，很会预言，替我们占卜了一辈子，直到老了。他说有一天我会受这灾，会给奥德修斯弄瞎。我始终以为，来的一定是个气派威武、力大超人的人物。结果却是个不起眼的小弱汉，趁我醉了下手！奥德修斯，过来吧，我送你礼物，好好招待你，还会请波塞冬帮你上路。他是我父亲，我是他亲儿子。他要愿意，就能治好我，别的神和人都不能。
        - id: ch04-b05
          speaker: odysseus
          text: 我对他说，波塞冬也治不了你的眼，这一点我很确定。真希望我也能那么确定，自己能立刻杀死你，把你送到哈得斯那里！他把两只手举向天，向神祈祷。
        - id: ch04-b06
          speaker: polyphemus
          text: 伟大的波塞冬，请听我说。若我确实是你亲生儿子，就别让奥德修斯活着回家。如果注定他终究要见亲人，就让他很迟才回去，吃尽苦，死光伙伴。让他坐别人的船到家，家里还要有祸等着他。
        - id: ch04-b07
          speaker: odysseus
          text: |
            波塞冬听到了祷告。巨人又举起一块石头，比刚才那块还大，高高抡起，猛力扔来。石头没到船边就落下，却又差点撞到舵尾。海水被震动，激起的大浪这次向前推着我们，送往小岛的岸边。

            我们终于到了小岛，其余的船都还在那里。伙伴们正伤心地惦记着我们，焦急盼着我们回来。我们把船驶上沙滩，从船里走到海岸，也把独眼巨人的羊运下来，公平分给众人，让谁都没有理由埋怨。大家一致说，那只大公羊应当额外分给我。我便在海边把它宰作祭品，烧起腿骨，献给掌管一切的宙斯。可他根本没有理睬这份祭礼。他心里只想着，要怎样把我的船和我的伙伴全都毁掉。

            这一天，大家又吃喝到日落，天黑就在海滩睡下。清晨的孩子、玫瑰色手指的黎明出现，我叫船员登船解缆。大家坐到桨位上，划开灰色海水。我们带着伤痛继续走，失去了同伴，却也庆幸自己死里逃生。
