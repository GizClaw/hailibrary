audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    polyphemus:
      display_name: 波吕斐摩斯
      tts: {delivery: "粗直强横", timbre: "低沉粗砺", pace: "缓慢而有压迫感", pitch: "低音"}
    cyclops_1:
      display_name: 邻近的独眼巨人甲
      tts: {delivery: "直截了当", timbre: "粗厚", pace: "平稳", pitch: "低音"}
    cyclops_2:
      display_name: 邻近的独眼巨人乙
      tts: {delivery: "急躁干脆", timbre: "沙哑有力", pace: "稍快", pitch: "中低音"}
    crew_1:
      display_name: 船员甲
      tts: {delivery: "诚恳直率", timbre: "清楚略带沙哑", pace: "利落", pitch: "中音"}
    crew_2:
      display_name: 船员乙
      tts: {delivery: "急切而务实", timbre: "干涩有力", pace: "稍快", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 十二条船
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |-
            阿尔基诺奥斯王，我也该说说自己的来历了。我是奥德修斯，父亲叫拉厄尔忒斯，家乡就是伊萨卡。岛上尽是岩石，山里有茂密的树林，别人也许看不上，我却走到哪里都惦记它。卡吕普索和喀耳刻都想留下我，可谁也没能让我忘记回家。

            您看我现在一个人，当初离开特洛伊，我可是带着十二条船的。

            风把船吹到了基科涅斯人的伊斯马罗斯城。我们杀进城，杀死男人，把女人和财物都抢走了。我分好战利品，催大家马上开船。他们不肯，还在岸上宰牛烤肉，喝抢来的酒。逃走的城里人去内陆搬了救兵，第二天一早便来反攻。我们靠着船抵挡，打到傍晚还是败了。最后逃出去时，每条船已经死了六个人。
            离岸以后，我们呼喊那些死者的名字。没多久，又来了风暴，船帆撕破，只能上岸躲。等我们重新出发，风和海流却把船带错了方向。漂过九天，第十天，到了食莲人的地方。
            我派三人上岸。那里的人倒不害他们，只拿莲果给他们吃。他们一尝，就不想家了，也忘了回来报信，非留着继续吃不可。我把他们拖回船，绑到桨凳底下，他们还哭着要回去。别人可不能再碰这东西了，我连忙叫大家上船，赶快走。
    - id: ch02
      title: 堵在洞口的巨石
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |-
            后来，我们停在一座有许多野山羊的岛上。这里能打猎，有淡水，也方便停船。隔海那边升起了烟，能听到人说话、羊在叫。我想知道住着什么人，便留下其余船，只开自己的船过去，带十二个同伴上岸。
            我还带了一袋又香又烈的酒。那是马隆给我的，他在伊斯马罗斯侍奉阿波罗。破城时，我放过了他和妻儿，他送酒就是为了谢我。
            我们找到了一个洞，主人还没回来，里面有奶酪、小羊，还有挤奶用的器具。同伴劝我赶快离开。
        - id: ch02-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: 带上些奶酪和羊，回船去吧。
        - id: ch02-b03
          speaker: odysseus
          text: 我却想等主人，好让他招待我们，送些礼物。大家就吃着人家的奶酪，在洞里等。回来的是个独眼巨人，一捆柴扔下来，我们全吓得躲进暗处。他赶羊入洞，准备给羊挤奶，又拿一块大石头封住洞口。那石头，我们所有人一起也推不动。他安顿好羊，点上火，终于看到了我们。
        - id: ch02-b04
          speaker: polyphemus
          text: 哪里来的人？到这儿做什么？
        - id: ch02-b05
          speaker: odysseus
          text: 我告诉他，我们曾跟随阿伽门农攻破特洛伊，现在想回家，却被风吹到了这里。我求他收留，提醒他宙斯会保护求助的外乡人。
        - id: ch02-b06
          speaker: polyphemus
          text: 我怎么对你们，还轮不到宙斯做主。说，你们把船藏哪儿了？
        - id: ch02-b07
          speaker: odysseus
          text: 我骗他说，波塞冬打碎了船，我们才逃了命。岸边还有人，我不能让他找到。可他不再说话，抓起两个同伴摔死，撕碎了吃。我们只能哭着求神。等他吃饱睡下，我握剑想杀他，却又想起那块石头。他死了，我们也出不去。天一亮，他又吃掉两人，开门赶羊上山，再把洞封上。
    - id: ch03
      title: 没有人
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |-
            巨人得留着命，我们才有机会出去。我在羊圈旁找到一根橄榄木，那是他准备做手杖的。大家把它做成尖桩，藏起来，再抽签选出四个人帮我，等他回来动手。
            到了晚上，他赶进所有的羊，又吃了两人。跟我进洞的十二个人，已经死了一半。我端酒走到他面前。
            您先喝口酒。我带来这份礼物，就是盼着您肯帮我们回家。
            他一碗接一碗，喝到第三碗，说话已经不清楚，还要问名字。
        - id: ch03-b02
          speaker: polyphemus
          text: 你叫什么？我也有礼物送你。
        - id: ch03-b03
          speaker: odysseus
          text: 我叫没有人。父母和朋友都这么叫我。
        - id: ch03-b04
          speaker: polyphemus
          text: 好啊，别的人先吃，没有人最后吃。礼物就是这个！
        - id: ch03-b05
          speaker: odysseus
          text: 他倒了下去，吐出人肉和酒，睡熟了。我们把木桩的尖头烧热，合力刺进他的眼睛。他惨叫着拔出木桩，我们四下躲开。外面的巨人听见叫声，赶来问他。
        - id: ch03-b06
          speakers: [cyclops_1, cyclops_2]
          ensemble: duo
          text: 波吕斐摩斯！谁害了你？
        - id: ch03-b07
          speaker: polyphemus
          text: 没有人！没有人用诡计杀我！
        - id: ch03-b08
          speaker: odysseus
          text: 他们以为没有凶手，是神让他生了病，便劝他求父亲波塞冬，接着走了。假名管用了，路却还堵着。巨人移开石头，坐在洞口，伸手要捉随羊逃出去的人。我把羊三只一组绑起来，让同伴吊在中间那只的肚子下面，两边有羊挡着。我自己选最大的公羊，攥住它肚下的长毛，仰面吊着，等到天亮。羊往外走，他只摸背，没往下找。带着我的公羊慢了些，最后出门，又被他拦住。
        - id: ch03-b09
          speaker: polyphemus
          text: 往日你总抢着出去，今天为什么落在后头？替我的眼睛伤心吗？唉，你要能开口，告诉我没有人躲在哪儿，我就砸烂他的头，把这口气出了！
        - id: ch03-b10
          speaker: odysseus
          text: 我紧紧抓着羊毛，一动不动。他终于放行。出了院子，我才从羊下爬出来，解开同伴，赶羊回海边。船上的人看见我们很高兴，可再一看，少了六个人，又哭了。我让他们先别出声，装上羊，马上划走。
    - id: ch04
      title: 喊给海神听见的名字
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: 船刚划开，我自己却忍不住，朝岸上喊了起来。你吃掉求助的客人，就不怕报应吗？他听见了，把一块大石扔过来。石头落在船后，浪又把我们推回岸边。我拿长竿撑，大家拼命划，总算重新离岸。同伴们急着拦我。
        - id: ch04-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: 别出声！他能听到，再砸一次，我们就全完了！
        - id: ch04-b03
          speaker: odysseus
          text: |-
            我偏不肯。假名救了命，这会儿我却要他记住真名。谁要问起你的眼睛，就告诉他，是伊萨卡的奥德修斯弄瞎的，是拉厄尔忒斯的儿子！
            他呻吟着，说预言过这件事的人早已告诉过他。可他以为奥德修斯会是个高大强壮的英雄，怎么也没想到，是我这个拿酒骗他的小个子。他又叫我回去，说愿款待我，求父亲保佑我归乡。我却骂他，真想把他杀了送进冥府，那只眼睛，连波塞冬都别想治好！他举起双手，向父亲求告。
        - id: ch04-b04
          speaker: polyphemus
          text: 波塞冬，我若是你的亲生儿子，就别让奥德修斯活着回家！若他命里非回家不可，那就让他失去全部同伴，拖到很久以后，乘别人的船回去。到了家，也要有灾难等着他！
        - id: ch04-b05
          speaker: odysseus
          text: |-
            海神听到了。他又掷来大石，掀起的浪这回倒把我们推远了。回到船队等着的岛上，我们分掉羊。我把带我逃命的大公羊献给宙斯，可他不肯听我的祈求，已打算毁掉船只和同伴。

            第二天，活下来的人拿起船桨，十二条船再次离岸。
