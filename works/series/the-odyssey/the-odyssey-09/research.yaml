notes:
  - "Task-scoped user exception to classic's verbatim-import default: retain classic and Homer / 荷马 authorship while preparing a HaiLibrary reading retelling. Both locales contain new prose, not Butler's wording or a literal Chinese translation. The complete Book IX at git 1208d108 and the live Gutenberg edition were consulted as plot evidence; locale metadata therefore does not label the new text with Butler as translator or source_url."
  - "Retained: the twelve ships, acknowledged violence at Ismarus and six losses per ship, three lotus scouts forcibly returned, the choice to wait in the cave, twelve entrants and six deaths, inability to move the boulder, wine from spared Maron, Nobody wordplay, the sheep, two shouted challenges and thrown rocks, the true name and the father's curse."
  - "Retained violence and intent: the Ismarus attackers kill men and carry off women; Polyphemus smashes and dismembers two victims, vomits wine and human flesh, and threatens to crush Nobody's head. Odysseus threatens death and denies Poseidon's ability to heal the eye; Zeus plans the ships' and companions' destruction. The wine is Maron's strong wine, not an invented poison."
  - "Condensed: neighboring-island geography and farming possibilities, exact goat allotments and dairy inventory, Maron's gold and dilution ratio, the extended drilling and smithing comparisons, repeated feast ritual, the seer's lineage and repeated taunts. These are declared reading-edition omissions, not a claim of an unabridged import."
  - "Claim inventory, both locale bodies: lotus-induced loss of homeward desire, one-eyed giants, superhuman rocks and divine hearing are myth, not ordinary botany, physiology or mechanics. No present-day site is identified as the cave or lotus country."
  - "The narrator admits his own raid, refusal to leave and later dangerous boast. Polyphemus's acts are those of the named mythical character, not a claim about an ethnic group. Hospitality and sacrifice describe the epic's actions, not a universal rule about living cultures."
  - "The false-name exchange is necessary to the traditional plot. Surrounding scene language and dialogue were independently authored without modern translations or film adaptations as expressive models."
