premise: >
  奥德修斯向主人报出姓名，从十二条船尚在的归程讲起。劫掠后的贪恋使船队失去同伴，
  莲果又让人忘记归乡。在独眼巨人洞里，他以假名与计策救出幸存者，
  却在逃脱后违背同伴劝阻喊出真名，让海神的诅咒找到归路。
characters:
