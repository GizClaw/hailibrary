  zh-CN: "门外的雷声"
style: epic-fantasy-illumination
research: required
labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
premise: >-
  比弓之前，奥德修斯忍住怒气并试探可信任的人。女神的许诺、雷声和磨坊女工的祈求 给他坚持下去的理由。儿子公开保护客人，先知却被求婚人嘲笑，只能自行离开宴席。
characters:
  - { id: odysseus, description: "隐瞒身份的归乡者，等待行动并判断谁值得信任。" }
  - { id: athena, description: "神话中的女神，许诺保护奥德修斯，使求婚人看不清危险。" }
  - { id: penelope, description: "被等待与婚事折磨的妻子，仍不知道丈夫就在楼下。" }
  - { id: telemachus, description: "公开承担主人责任、保护客人的年轻人。" }
  - { id: miller_woman, description: "疲惫的磨谷女工，只求不再替求婚人准备饭食。" }
  - { id: eumaeus, description: "忠心而关心客人的养猪人。" }
  - { id: philoetius, description: "为忒勒马科斯留下照管牛群的牛倌。" }
  - { id: ctesippus, description: "以投掷牛蹄来羞辱客人的求婚人。" }
  - { id: theoclymenus, description: "在宴席上看见不祥征兆并自行离开的先知。" }
