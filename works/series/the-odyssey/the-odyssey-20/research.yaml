  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XX"
    claims:
      - "Odysseus considers killing the women who leave to sleep with suitors, restrains himself, worries about the number of enemies and avengers, and is put to sleep by Athena."
      - "Penelope asks Artemis to kill her or a whirlwind to take her, recalling Pandareus's daughters, the gods' killing of their parents, divine upbringing, Aphrodite's marriage errand, and abduction to serve the Furies."
      - "Odysseus requests two signs. Zeus thunders, and the exhausted mill woman wishes this the suitors' last meal anywhere."
      - "Eumaeus and Philoetius show loyalty while Melanthius threatens a fight. Odysseus promises the cowherd will see his return and killing of the suitors. An eagle on the left interrupts the plot to kill Telemachus."
      - "Ctesippus throws a hoof; Telemachus threatens to spear him, prefers death to guests beaten and women dragged about, and refuses to drive his mother out against her will."
      - "Athena brings forced laughter, bloodied meat, tears and dread. Theoclymenus sees blood and ghosts, warns no one will escape, leaves for Piraeus, and is mocked. A suitor proposes selling the visitors to the Sicels."
