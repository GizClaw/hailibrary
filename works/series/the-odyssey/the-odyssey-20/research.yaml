    authority: "Getty Research Institute"
    claims:
      - "The Odyssey's ancient Greek mythological homecoming narrative is traditionally attributed to Homer."
notes:
  - "2026-10-11: task-scoped reading retelling required by the user, with classic and Homer / 荷马 unchanged. Complete Book XX was compared with the Butler source saved at git commit 1208d108."
  - "Condensed boundaries: the sausage-at-the-fire comparison, the goddesses' individual food/beauty gifts to Pandareus's daughters, ritual and household labor inventories, herd statistics, and repeated abuse. The daughters' consequential marriage-errand/abduction sequence remains."
  - "Claim classification: the supernatural events and visions are declared myth; the omen is Amphinomus's interpretation. Penelope's death wish is her experience, not guidance. The narrative preserves sexual coercion as a character's accusation without turning it into a general claim about women or servants."
  - "Knowledge continuity: Philoetius and Eumaeus still do not recognize Odysseus. The disguised guest stays silent under Melanthius's abuse; the hoof misses, and the son's threat is conditional. Theoclymenus exits to Piraeus rather than witnessing the next contest."
  - "Both locales follow night restraint, Athena's sleep, Penelope's waking prayer, dawn signs, arrivals, murder-plot omen, feast and ignored vision in order. No footnote, translator commentary, modern published retelling or screen model is retained. Media bytes are unchanged."
