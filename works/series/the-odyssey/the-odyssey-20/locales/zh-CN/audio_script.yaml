audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    miller_woman:
      display_name: 磨谷女工
      tts: {delivery: "疲惫而诚恳", timbre: "质朴沙哑", pace: "缓慢", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    philoetius:
      display_name: 菲洛伊提奥斯
      tts: {delivery: "忠实坦率", timbre: "浑圆而有风霜感", pace: "稳重", pitch: "低音"}
    ctesippus:
      display_name: 克忒西波斯
      tts: {delivery: "粗俗自大", timbre: "沙哑厚重", pace: "利落", pitch: "中低音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "笃定庄重", timbre: "清晰有共鸣", pace: "从容", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "这一夜睡不着"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯躺在粗硬的兽皮上，睡不着。女仆们笑着出门，要去跟求婚人过夜。他想，现在就把她们杀了，还是再留她们活一夜？他捶着胸口，逼自己忍住。当年在独眼巨人的洞里，看着同伴被吃，他也是等到想出办法，才逃了出去。雅典娜化成一个女人，来到他床边，问妻子、儿子都在家，怎么还睡不安稳。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            他们人数太多了。就算我们杀了他们，家人也会报仇。我又能去什么地方躲？
        - id: ch01-b03
          speaker: narrator
          text: >-
            女神说会继续相助。哪怕五十队敌人来围攻，她也能让他夺走对方的牛羊。她让他沉沉睡去，自己回奥林匹斯。楼上的妻子却醒了。她刚梦到丈夫在身边，还是离家前那样，几乎信以为真。醒来，她哭着求阿耳忒弥斯，一箭射穿自己的心，或者让旋风把她卷入大洋。

            她想起潘达瑞奥斯的女儿们，父母被神杀死，她们由女神养大。后来，阿佛洛狄忒去找宙斯商量她们的婚事。就在女神离开时，风暴把女孩掳走，送去侍奉复仇女神。佩涅洛佩宁肯下到地下，仍只想着奥德修斯，也不愿跟一个不如丈夫的男人。白天已经很苦，连睡着做梦也忘不掉痛苦。
    - id: ch02
      title: "天上的雷，屋里的话"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            天快亮，奥德修斯听到妻子哭，好像她已经认出了自己，就在身边。他收铺盖，向宙斯求信号，一个来自天外，一个要屋里有人开口。

            雷声来了。

            磨坊里还有个女人在做工。她力气不及旁人，别人已磨好粮去休息，她还没完成。雷在晴空响起，她停手祈求。
        - id: ch02-b02
          speaker: miller_woman
          text: >-
            宙斯，晴天忽然打雷，总是给谁的信号吧？也请听听我。替求婚人磨粮，快累死我了。让今天这顿，成为他们在这里的最后一顿。愿他们以后不管到哪儿，都再吃不上晚饭！
        - id: ch02-b03
          speaker: narrator
          text: >-
            奥德修斯觉得，雷和她的话都是回答，宙斯同意让自己报仇。家里开始为宴席忙。有人去取水，有人擦桌，有人搬柴。儿子问乳母客人昨晚有没有安顿好，听说母亲备好了床，是客人不愿睡。

            欧迈奥斯带猪来了，先问客人受没受欺负。墨兰提奥斯送羊来，却又赶人，威胁两人打一场才肯罢休。奥德修斯只低头听，记下不同的态度。

            牛倌菲洛伊提奥斯随后送牲畜。看见陌生人一身破衣，他握住这人的手。
        - id: ch02-b04
          speaker: philoetius
          text: >-
            我的主人奥德修斯，若还在世，也许就像你现在这般。
        - id: ch02-b05
          speaker: narrator
          text: >-
            他还是孩子时，主人就把牛群交给他。牛养得越来越多，奥德修斯却一直没回来。如今这些牲畜要送给求婚人吃，那些人不关心主人，连少主也不在乎。
        - id: ch02-b06
          speaker: philoetius
          text: >-
            有时我也想，赶着牛到别处过日子。可少主还在这里，我走了，他就又少个帮手。我只能留下，盼主人哪一天回来。
        - id: ch02-b07
          speaker: odysseus
          text: "我向宙斯和这座炉火发誓，你走以前，奥德修斯会到家。你要是留下，就能看着他杀掉求婚人。"
        - id: ch02-b08
          speaker: narrator
          text: "牛倌愿意帮主人一起打，牧猪人也盼着主人回来。奥德修斯却还没有说出自己的身份。"
    - id: ch03
      title: "一只牛蹄"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            求婚人还在偷偷商量怎么杀少主。一只鹰叼着鸽子，从左边飞过去。安菲诺摩斯觉得这是坏兆头，让大家先别杀人，去吃饭。那天是祭阿波罗的日子，酒肉摆好。忒勒马科斯给父亲在门边放了小桌、椅子，吩咐食物要给够，又告诉众人，这是自己家的客人，谁也不许打他，更不许辱骂。

            求婚人都咬着嘴唇。安提诺奥斯让大家先忍了。他说，要不是宙斯拦着，少主早闭嘴了。儿子没理会。雅典娜偏让求婚人更傲慢，要激起父亲的怒气。富有的克忒西波斯又取笑起客人来。
        - id: ch03-b02
          speaker: ctesippus
          text: "来了贵客，得送礼啊。我也给他一件！"
        - id: ch03-b03
          speaker: narrator
          text: "他抓牛蹄扔来。奥德修斯把头偏开，东西打在墙上。儿子却站了起来。"
        - id: ch03-b04
          speaker: telemachus
          text: >-
            幸亏他躲开了。要是打中，我会用矛刺死你，等你的只有葬礼，哪还有婚礼！你们人多，我敌不过，只能忍着自己的东西被拿走。若想杀我，就杀吧。我宁愿死，也不愿每天看客人挨打，女人被拖来拖去。
        - id: ch03-b05
          speaker: narrator
          text: >-
            众人一时无话可说。阿革拉奥斯劝他们别再伤害客人和仆人，又让少主跟母亲谈谈，挑个条件最好的丈夫。他说，奥德修斯看来回不来了，母亲再嫁，儿子也能安安心心守着家产。忒勒马科斯说，自己一直在劝，也愿意给她厚礼。但母亲不想走，他绝不会把她赶出家门。
    - id: ch04
      title: "谁也不信的灾难"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            他们又笑了，这回却笑得勉强。雅典娜扰乱了他们的心神。他们眼里流着泪，手中的肉沾着血，心里压着一股不祥的恐惧。先知忒奥克吕墨诺斯站起身，脸色变了。
        - id: ch04-b02
          speaker: theoclymenus
          text: >-
            你们浑身罩着黑暗，到处是哀叫，墙和梁滴血。门口、院里全是走向冥府的鬼魂，太阳也没了。
        - id: ch04-b03
          speaker: narrator
          text: "众人越笑越凶。欧律马科斯说，看这里这么黑，就叫人送先知出门。"
        - id: ch04-b04
          speaker: theoclymenus
          text: "我能看，能听，脚能走，头脑也清楚，用不着你们送。可我看到的灾难，你们没一个逃得了。"
        - id: ch04-b05
          speaker: narrator
          text: >-
            他走到庇莱奥斯家，得到招待。厅里的人又取笑少主，招来两个客人，一个只吃饭，一个疯疯癫癫，还说自己会预言。不如装船，卖给西刻尔人。忒勒马科斯没有应这些话，只望着父亲。王后在旁边听，酒肉还不断送上来。
        - id: ch04-b06
          speaker: narrator
          text: "奥德修斯仍在门边，等着那张弓。"
