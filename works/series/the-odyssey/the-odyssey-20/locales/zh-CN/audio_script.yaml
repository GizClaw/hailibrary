      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    suitor_insolent:
      display_name: 无礼的求婚人
      tts: {delivery: "讥讽直白", timbre: "明亮粗硬", pace: "轻快", pitch: "中音"}
  chapters:
    - id: ch01
      title: "长夜与清晨的祈祷"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯在廊下躺着，垫了一张没鞣过的牛皮，上面又是几张羊皮，都是求婚人吃掉的羊。欧律诺墨替他盖了披风。他没有睡，一心想着怎样杀求婚人。那几个和求婚人私通的女人，这时嘻嘻哈哈出了屋。他气极了，想马上起身全杀掉，又想，不如放她们去睡最后一晚。
            心在他胸中发出怒吼，像母狗守着幼犬，朝陌生人龇牙低叫。那些恶事叫他这样愤怒，他却敲着胸口，跟自己的心说话。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            心啊，忍住。独眼巨人那么可怕，把勇敢的伙伴一个个吃了，那时不是比现在更难吗？你以为命保不住，却还是忍着不发声，后来靠着机智，才平安出了山洞。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他把自己的心劝住，身体却一面一面地翻。烤肚囊的人想快点烤熟，总把那装了血和油的肚囊在旺火前转来转去。他也是这样，想来想去，一个人怎么敌得过那么多求婚人？这时雅典娜化作女人，从天上落下来，停在他头上。
        - id: ch01-b04
          speaker: athena
          text: >-
            可怜的人，你怎么不睡？已在自己家里了。妻子好好待在屋内，儿子也好好的，哪个父亲有这么个儿子不会骄傲？
        - id: ch01-b05
          speaker: odysseus
          text: >-
            女神，你说得没错。不过敌人这么多，我独自怎样下手，还是个难题。而且还有更难的。即便宙斯和你助我，真杀光他们，要来报仇的人追上门，我该逃到哪儿？请你把这一步也替我想想。
        - id: ch01-b06
          speaker: athena
          text: >-
            这就不像话了。换个凡人帮手，智慧不如我，本事不如我，别人都肯信。何况我是神，你那些灾难里，哪一次不是我护着？告诉你，就算五十队人围着，拼命要杀我们，你也能把他们的牛羊全部抢走，赶着出去。睡吧，别整夜睁眼，这对你不好。烦恼很快就完了。
        - id: ch01-b07
          speaker: narrator
          text: >-
            她说着，使奥德修斯睡去，自己回到奥林波斯。他睡得深，痛苦也轻了。佩涅洛佩却醒来，在床上坐着哭。哭过一场，她就求阿耳忒弥斯。
        - id: ch01-b08
          speaker: penelope
          text: >-
            伟大的阿耳忒弥斯，宙斯的女儿，把箭射进我的心，叫我死吧！或者旋风来，把我带过黑暗的路，扔到俄刻阿诺斯汹涌的河口，像当年潘达瑞奥斯的女儿们一样。她们父母都让神杀了，成了孤儿。阿佛洛狄忒细心照顾她们，用乳酪、蜂蜜和甜酒养育。赫拉使她们又美又聪明，胜过世上女人，阿耳忒弥斯给她们高贵的仪表，雅典娜教会各种本领。一天阿佛洛狄忒去了奥林波斯，找宙斯安排她们的婚姻。每个人将遇到什么，绝遇不到什么，宙斯都明白。可那时，风暴卷走了姑娘们，给可怕的复仇女神当奴婢。也愿天神把我带走，藏到凡人看不见处，或愿美丽的阿耳忒弥斯动手。我只要还一心向着奥德修斯，不用嫁比他差的男人，去苦难大地的地下，也愿意。人白天愁得再深，晚上能睡就撑得住。一闭眼，好事坏事便都忘了。可我的悲伤追到梦里不放。刚才这夜，梦见一个人陪我躺着，像丈夫跟军队出征时的样子。我高兴啊，竟以为那是真事，根本不是梦。
        - id: ch01-b09
          speaker: narrator
          text: >-
            天亮时，奥德修斯听见妻子哭，还疑惑起来，仿佛她就在身旁，已经认出了他。他把披风、羊皮收好，放在廊下的椅子上，牛皮则拿到露天处。双手抬起，他向天求告。
        - id: ch01-b10
          speaker: odysseus
          text: >-
            父亲宙斯，你让我受了那么多苦，也终于让我走过陆地大海回家。再给个预兆吧，屋里谁醒了，就让谁口中说出来。再在外边，也给一个信号。
        - id: ch01-b11
          speaker: narrator
          text: >-
            祈求传到宙斯那里，他立刻在辉煌的奥林波斯山上方，向着高空云间打响雷。奥德修斯喜在心头。同时附近磨房里，一个女人说起话，另一重征兆也来了。
            那里十二个女工磨大麦和小麦，磨人们活命的粮。别人做完份内的事都去歇息，这女人力气小，还在磨。听雷响，她停下手，说了这些话，给自己的主人送来征兆。
        - id: ch01-b12
          speaker: miller_woman
          text: >-
            宙斯父神，你管着地，也管着天，今天这么晴，一点云影没有，却打起雷来，肯定要告诉什么人什么事。听听我这受苦仆人的愿望吧。叫求婚人在奥德修斯家的饭，到今天为止。我替他们磨粉，快累死了。往后，最好哪儿也吃不上下一餐！
        - id: ch01-b13
          speaker: narrator
          text: >-
            女人说的话，还有雷声，都叫奥德修斯欢喜。他知道，自己能向求婚人报仇了。
    - id: ch02
      title: "三位牧人"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            家里的女仆陆续起来，生好灶火。忒勒马科斯也起床着装，把剑挂上肩，漂亮的双脚穿好凉鞋，拿起结实的长矛，矛头青铜磨得锋利。他来到回廊的门槛，问乳母。
        - id: ch02-b02
          speaker: telemachus
          text: >-
            那位客人晚上吃住好不好，都照应了吗？可别让他自己凑合。母亲是个好人，但有时候把普通人照料得过了头，真正有本领的人却冷落了。
        - id: ch02-b03
          speaker: euryclea
          text: >-
            没做错，就不要怪人，孩子。客人爱喝多少、爱坐多久都可以，你母亲还问面包够不够，他说不用加。要睡时她让人铺床，他却说自己流落受苦惯了，不肯用床和被褥，只要廊下铺牛生皮、羊皮。披风还是我给盖的呢。
        - id: ch02-b04
          speaker: narrator
          text: >-
            忒勒马科斯出门，带着矛和两条狗，到阿开亚人的集会场。乳母留下，招呼女仆。
        - id: ch02-b05
          speaker: euryclea
          text: >-
            快醒醒，扫廊子，洒点水，免得灰起来。把座位盖好。有几个人拿湿海绵抹桌子，酒缸杯子都洗净，再马上到泉那边取水。今天过节，求婚人会早到，一转眼就要来了。
        - id: ch02-b06
          speaker: narrator
          text: >-
            二十个女仆去打水，其他人忙屋里的活。伺候求婚人的男人也到场劈柴。女人们打水回来，欧迈奥斯接着赶到了，带着最好的一共三头猪。他把猪留在附近吃食，和气地向奥德修斯询问。
        - id: ch02-b07
          speaker: eumaeus
          text: >-
            外乡人，他们对你可好一点了？还是同昨天一样横？
        - id: ch02-b08
          speaker: odysseus
          text: >-
            他们在别人家里这么作恶，脸都不要，愿诸神把应得的报应还给他们。
        - id: ch02-b09
          speaker: narrator
          text: >-
            说着，墨兰提奥斯也来了。他和两个牧羊人赶来最好的山羊，供求婚人吃。他们拴好羊，就在门房底下。墨兰提奥斯又开始骂。
        - id: ch02-b10
          speaker: melanthius
          text: >-
            外乡人，还没走？满屋纠缠，四处要吃的，不能换个地方吗？不跟我打一架，看来就讲不通了。你讨饭一点也不知分寸。阿开亚人办宴会，难道别家都不办？
        - id: ch02-b11
          speaker: narrator
          text: >-
            奥德修斯没有答话，只垂下头，继续想着心事。接着到的是第三位牧人，菲洛伊提奥斯。他带来几头山羊，还带着一头不能生小牛的母牛。这些牲口刚由船夫渡送过来。那些船夫就在渡口，谁前去求他们载一程，他们都会载。菲洛伊提奥斯先把小母牛和山羊在门房下拴牢，随后才走向欧迈奥斯，打听这位陌生人。
        - id: ch02-b12
          speaker: philoetius
          text: >-
            牧猪人，这位新来的是谁？是跟着你的人吗？老家在哪儿，父母家族又是谁？瞧这模样，很像当过大人物，可现在真可怜。诸神想降苦难，管你是不是国王，都躲不过。
        - id: ch02-b13
          speaker: narrator
          text: >-
            他走近奥德修斯，伸出右手问好。
        - id: ch02-b14
          speaker: philoetius
          text: >-
            老客人，愿你平安。今天虽然不好过，以后可要过好些。父亲宙斯，你比别的神都凶狠！明明我们是你的孩子，却一点也不疼惜。我看见这个人，汗都冒了出来，泪也忍不住。他太叫我想念奥德修斯。主人要是还活着，怕也是这身破衣，漂来漂去。若已经死去，在哈得斯的家，那我真为他悲哀。他是个好主人，我在刻法勒尼亚人中还很小，他便叫我管牛。如今牛群多到数不了，像麦穗繁盛，谁也不会比我放得好。可我还得把它们送来给外人吃，家里有他的儿子，他们却不放在眼里，也不怕神责罚。只因主人离开太久，就争着想分家产。我不知想过几次，带着牛去异国算了。但儿子还在，这么做怎么对得起？可是留下管别人牛还挨欺负，比出走更难受。这日子实在不能过，本该早跑去投靠别的首领。唯一留我到今天的，就是相信可怜的主人会回来，把求婚人全赶跑。
        - id: ch02-b15
          speaker: odysseus
          text: >-
            牧牛人，你的人品好，说话也懂道理。我告诉你件事，再向最尊大的宙斯和眼前奥德修斯家的炉灶起誓。你还没离开，这家的主人就回来了。只要你想看，就能看见他怎样杀掉现在这些当家作主的求婚人。
        - id: ch02-b16
          speaker: philoetius
          text: >-
            宙斯真肯办到，你就看着吧，我一定把力气全使出来帮他。
        - id: ch02-b17
          speaker: narrator
          text: >-
            欧迈奥斯也祈求同样的事，盼奥德修斯回到家里。
    - id: ch03
      title: "席间的牛蹄"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们说着话，求婚人则在密谋忒勒马科斯的死。一只鹰爪里抓着鸽子，从左边飞来。安菲诺摩斯看在眼里。
        - id: ch03-b02
          speaker: amphinomus
          text: >-
            朋友们，看来杀忒勒马科斯这计划，行不通了。先去吃饭吧。
        - id: ch03-b03
          speaker: narrator
          text: >-
            其他求婚人听了，都愿意照办，便一同进屋，把各自的披风搁在长凳和椅子上。他们宰了绵羊、山羊、猪，还有小母牛来献祭。内脏烤好了，再给每个人送上一份。酒在调酒缸里调好，牧猪人把酒杯挨个递到众人手中，菲洛伊提奥斯提着面包篮分食物，墨兰提奥斯接着把酒斟满。眼前都是好吃的，他们便伸手取用。
            忒勒马科斯是特意选了回廊铺石板的那一段。他让奥德修斯坐在一把样子破旧的椅子上，旁边摆着供他独用的小桌。属于他的那份内脏送到了，金杯盛着的酒也摆上桌。
        - id: ch03-b04
          speaker: telemachus
          text: >-
            你就在这里陪大人物们喝酒。谁打你、骂你，我会拦下。这可不是谁都能来的客店，是奥德修斯的家，他又传给了我。所以各位，收住手，也收住嘴，再闹就有麻烦。
        - id: ch03-b05
          speaker: narrator
          text: >-
            求婚人咬紧嘴唇，惊叹他如此大胆。安提诺奥斯对众人开口。
        - id: ch03-b06
          speaker: antinous
          text: >-
            这话虽然不中听，还是忍吧。忒勒马科斯这番恐吓可是当真。要有宙斯许可，早不让他说这些狠话了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            忒勒马科斯根本不答理。外面，传令官带着百牛大祭的牲口穿过街道，阿开亚人聚在阿波罗那片浓阴的树林下。屋里，外层的肉已经烤熟，从叉子上卸下，各分一份，人人吃得尽兴。因为忒勒马科斯特意吩咐，奥德修斯的肉分量也跟别人一样。
            雅典娜让求婚人的蛮横继续，要把奥德修斯对他们的恨再加重。里面有个来自萨墨的克忒西波斯，是个粗俗放荡的人，靠着钱多，就想娶奥德修斯的妻子。他对席上的人说。
        - id: ch03-b08
          speaker: ctesippus
          text: >-
            我说一句，这位外来的客人，吃得和我们一样多，好得很。忒勒马科斯接来的，当然不能委屈，虐待客人没道理，也不应该。我还另送一份礼吧，好让他拿去赏那个替他洗澡的女人，或赏主人家的别的仆人。
        - id: ch03-b09
          speaker: narrator
          text: >-
            他手伸进肉篮，拿起母牛蹄就朝奥德修斯砸去。奥德修斯把头轻轻一偏，牛蹄飞过去砸墙。他躲的时候，露出撒丁人那样的阴冷笑容。忒勒马科斯气势汹汹地斥责克忒西波斯。
        - id: ch03-b10
          speaker: telemachus
          emotion: angry
          text: >-
            多亏客人偏过脸，没挨上，算你好运。真中了，我的矛早穿透你了。你父亲哪还给你在这家办婚礼，得改办你的葬礼！这种没规矩的事，都给我停。我现在知道善恶，知道你们在做什么，早不是不懂事的小孩。羊让你们杀，粮食、酒随你们糟蹋，我看了很久。我忍，只因自己一个人，你们这么多。别再欺负到我头上。真要杀我，就杀。我情愿死，也不愿天天看客人挨骂，看男人在家里毫不知耻地拖着女仆走。
        - id: ch03-b11
          speaker: narrator
          text: >-
            没有人出声。过后，达马斯托尔之子阿革拉奥斯接了话。
        - id: ch03-b12
          speaker: agelaus
          text: >-
            不要生气，更别顶撞，刚才他讲得合理。外乡人和家里的仆人，都别再欺凌。不过我也有个为母子俩好的主意，希望你们听得进。忒勒马科斯，有盼头的时候，你们等奥德修斯，让求婚人待着，别人不能怪。能回来当然最好，可现在分明不会回来。你跟母亲好好谈谈，请她嫁最好的男人，找出价最好的人。这样家业全归你料理，饭和酒也能清静享用。母亲就去替另一个人管家，用不着留你这儿了。
        - id: ch03-b13
          speaker: telemachus
          text: >-
            阿革拉奥斯，我对宙斯起誓，也对父亲那些苦难起誓，他不是死在远处，就是还在遥远的国土漂泊。我不拦母亲出嫁，反倒劝她选喜欢的，还愿意给她多得数不尽的礼物。但是违背她心意，强要她走，我做不来。上天也别让我做这种事。
    - id: ch04
      title: "先知眼中的黑暗"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            雅典娜叫求婚人笑个不住，连神志都错乱了。笑声却是硬挤出来的，肉上沾着血，眼眶满是泪，心里压着不祥。忒奥克吕墨诺斯看出了这些景象。
        - id: ch04-b02
          speaker: theoclymenus
          text: >-
            可怜的人们，你们怎么会这样？从头到脚，黑暗像裹尸布把你们蒙住。脸上全是眼泪，四处全是哭声。墙和屋梁都在往下淌血！廊下门前、院子里面，亡魂挤满了，一群一群往冥府的黑夜走。太阳在天上没了，整片土地都盖在会带来枯亡的阴暗里。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他讲完，求婚人反倒大笑，欧律马科斯叫仆人。
        - id: ch04-b04
          speaker: eurymachus
          text: >-
            这才来的客人疯了！既然屋里这么黑，你们就送他到街上去。
        - id: ch04-b05
          speaker: theoclymenus
          text: >-
            欧律马科斯，派人倒不必。我自有眼、有耳、有两条腿，也有懂道理的脑子。我会带着它们自己走。我看到灾难就在你们上方。在奥德修斯屋里侮辱人、策划恶事的你们，谁也不可能逃出。
        - id: ch04-b06
          speaker: narrator
          text: >-
            他边说边出去，回庇莱奥斯家，那里欢迎他。求婚人却你看我我看你，拿外乡人取笑，存心惹忒勒马科斯生气。有个无礼的家伙向他嘲弄。
        - id: ch04-b07
          speaker: suitor_insolent
          text: >-
            你这客人可真不妙，忒勒马科斯！先来个招人烦的，光要面包、要酒。论活不会干，论硬仗不会打，一点用处也没有。接着又来个装先知的。我劝你，把他俩装船，运给西刻尔人，能卖什么价卖什么价，那样还划算些。
        - id: ch04-b08
          speaker: narrator
          text: >-
            忒勒马科斯不听这些话，安静地望着父亲，时时等他向求婚人动手。
            佩涅洛佩这位明智的伊卡里奥斯之女，已让人摆好华丽的椅子，朝向院落回廊，能把大家的话听清。备这顿饭时，有很多笑声，牲畜也宰了很多，吃食又多又好。可是晚饭还没上。一位女神与一位勇士将为他们准备的那一餐，没有什么能比它更惨烈。是他们亲手给自己招来了这结局。
