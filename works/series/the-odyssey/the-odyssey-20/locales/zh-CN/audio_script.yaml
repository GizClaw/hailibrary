audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    miller_woman:
      display_name: 磨谷女工
      tts: {delivery: "疲惫而诚恳", timbre: "质朴沙哑", pace: "缓慢", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    philoetius:
      display_name: 菲洛伊提奥斯
      tts: {delivery: "忠实坦率", timbre: "浑圆而有风霜感", pace: "稳重", pitch: "低音"}
    ctesippus:
      display_name: 克忒西波斯
      tts: {delivery: "粗俗自大", timbre: "沙哑厚重", pace: "利落", pitch: "中低音"}
    theoclymenus:
      display_name: 忒奥克吕墨诺斯
      tts: {delivery: "笃定庄重", timbre: "清晰有共鸣", pace: "从容", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "难熬的夜与两个征兆"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯躺在兽皮上，怎么也睡不着。女仆笑着出去，要陪求婚人过夜。他想，是否现在起来全杀了，还是让她们再活一晚？他捶胸，逼自己忍住。独眼巨人当年吃掉同伴，他也是忍到想出办法，才终于逃走。
        - id: ch01-b02
          speaker: narrator
          text: "雅典娜化成女人来到床边，问他妻儿都在家，为什么还不肯睡。"
        - id: ch01-b03
          speaker: narrator
          text: >-
            奥德修斯担心，眼前敌人多，就算杀了，以后还有亲友报仇，自己该逃去哪儿？雅典娜答应，仍站在他这一边。哪怕五十队人来围攻，她也能让他取走敌人的牛羊。她使他好好睡去，自己回奥林匹斯。楼上的佩涅洛佩却在这时醒了。梦里丈夫躺在身边，模样跟去特洛伊以前一样，她差点信以为真。她哭着求阿耳忒弥斯射穿自己的心，或者让旋风带走她，丢进大洋。她想起潘达瑞奥斯的女儿们，父母被神杀死，受女神养大。阿佛洛狄忒去见宙斯，想为她们找丈夫，就在她离开时，风暴却把女孩掳走，让她们去给复仇女神当仆人。她宁愿入地下，也要只想着丈夫，不肯跟另一个不如他的男人。如今连睡着时，苦痛也追着她。
        - id: ch01-b04
          speaker: narrator
          text: >-
            到天亮，奥德修斯听见她哭，竟像她已经认出他，就在身边。他收起铺盖，向宙斯要两个信号，天外一个，屋里人的话一个。雷响了。磨粮的女工较弱，别人做完，她还在忙。听到雷声，她停手祈求。
        - id: ch01-b05
          speaker: miller_woman
          text: >-
            宙斯，天上明明晴着，怎么会打雷？这总是给谁的信号吧？也请听听我的愿望。求婚人在这儿吃的这顿，让它是最后一顿。替他们磨粮把我们累坏了，愿他们到哪儿都再也吃不上晚饭！
        - id: ch01-b06
          speaker: narrator
          text: "奥德修斯觉得，这句话加上雷声，正是宙斯答应他复仇的信号。"
    - id: ch02
      title: 没有离开的牛倌
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            大厅忙起来了，有人取水，有人擦桌子，有人抱来木柴。忒勒马科斯问乳母，昨天晚上，客人有没有受到好好照顾？她说，女主人给他安排床，是他自己坚持不肯睡。欧迈奥斯赶猪来，先关心客人还受不受求婚人欺辱。墨兰提奥斯赶着羊来，开口却仍是赶人，还要动拳头才肯了事。奥德修斯没有和他争，只低头记住眼前这些态度。
        - id: ch02-b02
          speaker: narrator
          text: 随后菲洛伊提奥斯把牲畜送到。牛倌看着陌生人的破衣服，伸手握住了他。
        - id: ch02-b03
          speaker: philoetius
          text: 我的主人奥德修斯，若如今还活着，兴许也衣衫破旧，像你眼前这副样子。
        - id: ch02-b04
          speaker: narrator
          text: >-
            菲洛伊提奥斯还是个孩子时，主人就让他照管牛。这些年牲畜越来越多，奥德修斯却一直不回来看。他现在养大的牛，又得一头接一头送进屋，让那些人吃。他们不关心主人是否能回来，连留在家里的少主也不在乎。
        - id: ch02-b05
          speaker: philoetius
          text: >-
            有时我真想赶着牛另找个地方。可我一走，忒勒马科斯身边又少了个帮手。想到他，我就只好留下。我总觉得，他父亲也许哪天就回来了。
        - id: ch02-b06
          speaker: odysseus
          text: "我拿宙斯和炉火发誓。你走之前，他就回来了。你留下，还能看他杀死求婚人。"
        - id: ch02-b07
          speaker: philoetius
          text: 要是奥德修斯回来，我就跟他一起干。他会知道，我还有力气帮他。
        - id: ch02-b08
          speaker: narrator
          text: 欧迈奥斯也是这么盼着的。奥德修斯没说自己是谁，只把两人的心意记了下来。
    - id: ch03
      title: 不能再欺负他
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            求婚人又谋划杀忒勒马科斯。一只鹰抓着鸽子，从左边飞过，安菲诺摩斯觉得不祥，劝他们先去吃饭。那天祭祀阿波罗，酒肉都好了。男人坐进厅里，仍像主人一般。忒勒马科斯让客人坐在门边的小桌前，好好吃饭。
        - id: ch03-b02
          speaker: telemachus
          text: 这人由我招待。谁也别想再找他的麻烦。
        - id: ch03-b03
          speaker: narrator
          text: >-
            男人们咬着嘴唇。安提诺奥斯说，先忍了吧，要不是宙斯不许，他们早就让这小子闭嘴了。忒勒马科斯不理他。雅典娜还让他们更傲慢，好让奥德修斯愈加愤怒。富有的克忒西波斯又要取笑客人。
        - id: ch03-b04
          speaker: ctesippus
          text: 那我也送客人一件东西吧。
        - id: ch03-b05
          speaker: narrator
          text: 他拿起牛蹄扔了过去。奥德修斯把头偏开，东西砸在墙上。父亲坐着没动，儿子却起身了。
        - id: ch03-b06
          speaker: telemachus
          text: >-
            幸亏他躲了。打中了，我会用矛刺死你，办的就是葬礼，不是婚礼了。我一个敌不过你们这么多，只能忍着。你们要杀我，就杀吧。看着客人挨打，女人在屋里被拖来拖去，我宁愿死！
        - id: ch03-b07
          speaker: narrator
          text: >-
            阿革拉奥斯让众人别再伤害客人，也别伤害仆人。可他又劝少主，父亲看来是回不来了，母亲应从他们中间选出条件最好的人。等她嫁了，儿子也可以安安稳稳过日子，享有自己的家产。忒勒马科斯说，自己并没阻止，早在劝母亲选择，也愿给她厚礼。但她若不愿，就绝不能逼她离家。
    - id: ch04
      title: 先知走出大厅
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            求婚人又笑起来，这回笑得很勉强，听着越来越古怪。雅典娜使他们失去正常的心智，肉沾满血，眼睛流泪，心里压着害怕的感觉。先知忒奥克吕墨诺斯突然站起，望向大厅，面色变了。
        - id: ch04-b02
          speaker: theoclymenus
          text: >-
            你们从头到脚全是黑暗。到处有人哭，墙和梁都在滴血。院子和门口挤着鬼魂，正往冥府走，太阳也没了。
        - id: ch04-b03
          speaker: narrator
          text: 欧律马科斯和众人觉得更可笑了。他提议，既然这人连亮光都看不见，不如把他带到屋外。
        - id: ch04-b04
          speaker: theoclymenus
          text: "我有眼睛，有耳朵，双脚也能走，头脑还能判断。不必送，我自己出门。可我看到的祸事，你们一个都逃不掉。"
        - id: ch04-b05
          speaker: narrator
          text: >-
            先知去庇莱奥斯家，受到欢迎。求婚人又笑少主，招来一个废物，一个疯先知，不如装船卖给西刻尔人。他不再接这些话，只望着父亲。佩涅洛佩也在旁听着，酒肉还在往桌上送。
        - id: ch04-b06
          speaker: narrator
          text: 奥德修斯坐在门边，等弓送到自己面前。
