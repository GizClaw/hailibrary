  chapters:
    - id: ch01
      title: A long night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Odysseus turned over on the skins, unable to settle. He heard women laughing and doors opening. They were going to sleep with the suitors. Should he kill them all now, or allow them this last night? He struck his chest and made himself wait. In the Cyclops's cave, he had watched his companions die. Losing his temper hadn't saved him. A plan had.
        - id: ch01-b02
          speaker: narrator
          text: Then he saw a woman standing beside his bed. It was Athena.
        - id: ch01-b03
          speaker: athena
          text: You made it home. Your wife and your son are both here. What's keeping you awake?
        - id: ch01-b04
          speaker: odysseus
          text: >-
            The numbers. There are so many men against us. And suppose we beat them. Their people won't just forget. Someone will come for every man we kill.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Athena promised to stay beside him. He had trusted mortal men before, though they had less power to protect him. Now a goddess was helping. Even fifty bands of enemies couldn't keep her from letting him escape with their cattle. She sent him into deep sleep and returned to Olympus. Upstairs, Penelope woke from a dream. Her husband had been beside her, looking just as he did before he sailed for Troy. While she slept, she believed it was happening. She cried and begged Artemis to send an arrow through her heart. Or let a whirlwind lift her and drop her in the Ocean. She remembered the daughters of Pandareus. Gods killed their parents, and goddesses brought them up. Aphrodite went to Zeus to find husbands for them. In her absence, storm winds carried them away to be servants of the Furies. She would rather lie under the earth, still loving Odysseus, than give herself to a lesser man. Even asleep, she couldn't get away from sorrow.
        - id: ch01-b06
          speaker: narrator
          text: >-
            As dawn came, Odysseus heard his wife crying. For a moment it seemed she knew him already and was right beside him. He gathered the bedding, then prayed to Zeus. Give him one sign from the sky and one in words spoken by somebody in the house. Thunder answered. Then a woman spoke from the grinding room. The others had finished their grain, but she was weaker and hadn't completed her share. She stopped when she heard the unexpected sound.
        - id: ch01-b07
          speaker: miller_woman
          text: >-
            Zeus, that thunder came from a clear sky. It must be a sign. Let this be the suitors' last meal here. We're worn out feeding them. May they never eat another supper anywhere.
        - id: ch01-b08
          speaker: narrator
          text: Odysseus heard the woman's words with joy. Together with the thunder, he took them for the answer Zeus had sent to his prayer. Revenge would be his.
    - id: ch02
      title: The men who stayed
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The household woke. People fetched water, cleaned tables, and brought wood. Telemachus asked about the guest. Euryclea explained that Penelope had offered a bed, but he refused it. Eumaeus arrived with pigs and asked how the men had treated his fellow traveler. Melanthius came with goats and ordered him out. They would have to fight with their fists before they agreed, he said. Odysseus lowered his head and didn't reply. He kept learning how men behaved when they expected no reward.
        - id: ch02-b02
          speaker: narrator
          text: The cowherd Philoetius brought cattle and goats. He studied the stranger in his rags, then clasped his hand.
        - id: ch02-b03
          speaker: philoetius
          text: If my master is still alive, perhaps this is what's become of him. Perhaps he looks like you.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Odysseus had given him the cattle to look after when he was a boy. The herds had grown since then. Yet the owner had never returned to see them. Now Philoetius had to bring those animals here for men who had no concern for Odysseus or his son.
        - id: ch02-b05
          speaker: philoetius
          text: >-
            Sometimes I want to take the cattle and go. Start somewhere else. Then I think of the boy. How can I leave Telemachus without them? So I keep going, and I keep hoping his father will come back.
        - id: ch02-b06
          speaker: odysseus
          text: >-
            I swear by Zeus and this hearth that he'll return before you leave. If you stay, you'll watch him killing the suitors.
        - id: ch02-b07
          speaker: philoetius
          text: I'll gladly stay for that. And he'll see I haven't forgotten how to fight.
        - id: ch02-b08
          speaker: narrator
          text: Eumaeus wanted his master home just as much. Odysseus still didn't reveal himself. He had heard what he needed from men who didn't know whom they were speaking to.
    - id: ch03
      title: The thrown gift
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Meanwhile, the suitors again plotted to kill Telemachus. An eagle passed on their left with a dove in its claws. Amphinomus read it as a warning and urged them to go to dinner instead. This was Apollo's holy day. They sat in their usual places, with meat and wine before them. Telemachus set out a plain chair and small table by the doorway, making sure his father got a proper portion.
        - id: ch03-b02
          speaker: telemachus
          text: He's my guest. I won't have anyone disturbing him while he eats.
        - id: ch03-b03
          speaker: narrator
          text: >-
            They bit their lips. Antinous said they would put up with his orders for now. If Zeus had allowed it, they would already have stopped his talk. Telemachus ignored him. Athena kept provoking the men, wanting Odysseus to grow angrier. Rich Ctesippus decided to make a joke of the guest.
        - id: ch03-b04
          speaker: ctesippus
          text: Then we ought to give the guest something. This is for him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He picked up an ox's hoof and hurled it. Odysseus ducked his head. The hoof hit the wall. He remained in his chair, but Telemachus stood up.
        - id: ch03-b06
          speaker: telemachus
          text: >-
            You can thank him for moving. If you'd hit him, I'd have speared you. You'd have a funeral instead of a wedding. I've endured your stealing because I'm one against many. If you mean to kill me, do it. I'd rather die than watch guests beaten and women dragged about the house.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Nobody answered at first. Telemachus looked around. Agelaus told the men to stop abusing guests and servants. Then he urged the son to speak to Penelope. Odysseus would never return now, he said. Let her choose the best offer, and the son could enjoy his own inheritance. Telemachus said he already encouraged her to choose and would give her presents. But he would never order her out against her wishes.
    - id: ch04
      title: A man leaves the feast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            They laughed again, but it sounded wrong. Athena confused their minds. Blood smeared the meat in their hands. They laughed through tears, with dread in their hearts. The seer Theoclymenus stood and stared round the room.
        - id: ch04-b02
          speaker: theoclymenus
          text: >-
            You're covered in darkness, head to foot. I hear crying. Blood drips from the walls and beams. Ghosts fill the doorway and court, going down to Hades. The sun is gone.
        - id: ch04-b03
          speaker: narrator
          text: >-
            They laughed at his warning. Eurymachus said that someone ought to lead the man outside if he couldn't find daylight in here.
        - id: ch04-b04
          speaker: theoclymenus
          text: I can take my eyes, ears, feet, and good sense out of here myself. None of you will get away from the disaster I see.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Theoclymenus went to Piraeus and found a welcome there. Back in the hall, the men mocked the guests again. Telemachus had brought them a useless beggar and a mad prophet. One suggested putting both on a ship and selling them to the Sicels. They wanted to provoke the son into answering, but he didn't argue over their insults. His attention stayed on his father.
        - id: ch04-b06
          speaker: narrator
          text: Nearby, Penelope heard the feasting continue. The men went on eating. At his small table beside the door, Odysseus waited for his bow.
