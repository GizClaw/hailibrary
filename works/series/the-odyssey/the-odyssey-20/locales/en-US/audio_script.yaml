  chapters:
    - id: ch01
      title: "The restless heart"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Ulysses had made his sleeping place in the cloister. He put down the untreated hide of a bullock and spread several sheepskins on top. The sheep had been eaten at the suitors' feasts. Once he was lying there, Eurynome came and put a cloak over him. But sleep did not come. He lay awake turning over the question of how to kill the suitors. After a while, the women who were in the habit of sleeping with them left the house. They were giggling as they went, laughing with one another.
            The sight made Ulysses very angry. For a moment he considered rising from his bedding and killing all those women there and then. Or should he let them spend one more night with the suitors, the last night they would ever have? His heart growled within him. A mother dog guarding her puppies sees a stranger, bares her teeth, and growls. His heart growled like that at the evil being done. He struck his breast with his hand and addressed his own heart.
        - id: ch01-b02
          speaker: odysseus
          text: >-
            Be still, my heart. You've endured worse. Remember when the terrible Cyclops ate your brave friends. You were certain you would die, but you kept silent and held on. Your cunning brought you safely out of that cave.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He scolded his heart into patience, yet he could not keep his body still. Think of a stomach stuffed with blood and fat, roasting before a hot fire. The cook keeps turning it from one side to the other, hoping to have it done quickly. Ulysses turned that way on his bedding, over and over. How could one man kill so many wicked suitors?
            Then Minerva came down from heaven in the shape of a woman. She hovered above his head.
        - id: ch01-b04
          speaker: athena
          text: >-
            You poor, troubled man, why stay awake like this? You're in your own home. Your wife is safe inside, and your son is here too. Any father would be proud of a young man like him.
        - id: ch01-b05
          speaker: odysseus
          text: >-
            Goddess, you're right about all of that. But I still can't see how I can kill the suitors by myself. There are always so many of them. And an even harder question troubles me. Suppose you and Jove help me, and I do kill them. When it's over, their people will want revenge. Where am I to escape? Please consider that as well.
        - id: ch01-b06
          speaker: athena
          text: >-
            You should be ashamed to doubt me. Another man would trust a far poorer ally, even a mortal with less wisdom than I have. Am I not a goddess? Haven't I guarded you through all your sufferings? Let me tell you plainly. Even if fifty companies of men surrounded us, eager to kill us, you could still take every sheep and cow they owned and drive them off. Now sleep. It's bad for you to lie awake the whole night. Before long your troubles will be over.
        - id: ch01-b07
          speaker: narrator
          text: >-
            As she spoke, Minerva laid sleep over his eyes. Then she returned to Olympus.
    - id: ch02
      title: "The prayers before dawn"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Ulysses sank into deep sleep, and the weight of his troubles eased. But his admirable wife awoke. She sat up in bed and cried. When her tears had brought some relief, she prayed to Diana.
        - id: ch02-b02
          speaker: penelope
          text: >-
            Great Diana, daughter of Jove, send an arrow into my heart. Let me die. Or let a whirlwind lift me and carry me down dark paths, then drop me into the mouths of overflowing Oceanus. That's what happened to the daughters of Pandareus. The gods killed their father and mother, leaving them orphans. Venus cared for them and fed them cheese, honey, and sweet wine. Juno taught them to surpass every woman in beauty and understanding. Diana gave them a noble presence, and Minerva every kind of skill. Then Venus went to Olympus to speak to Jove about their marriages. He knows all that will happen to each of us, and what will never happen. While she was away, the storm winds snatched the girls off to serve the terrible Erinyes. Let the gods in heaven hide me from human eyes like that. Or let beautiful Diana strike me dead. I'd willingly go below this sorrowful earth, if I could keep my thoughts on Ulysses alone and never give myself to a lesser man. However hard someone's day may be, he can endure it if he can sleep at night. When our eyes close, we forget the good along with the bad. But sorrow follows me into sleep as well. Only tonight I dreamed there was a man beside me, just like Ulysses when he left with the army. I was so happy. I thought it was real, that I wasn't dreaming at all.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Day was breaking. Ulysses heard Penelope crying, and the sound confused him. It seemed as if she had already recognised him and was beside him. He gathered his cloak and the fleeces he'd lain on, and put them on a seat in the cloister. He carried the bullock's hide outside into the open. Then he lifted his hands towards heaven.
        - id: ch02-b04
          speaker: odysseus
          text: >-
            Father Jove, you have brought me across land and sea to my home after all the suffering you sent me. Now give me a sign. Let someone who is waking in this house say words that carry it. And give me another sign outside the house as well.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Jove heard the prayer that Ulysses offered. Straight away, thunder sounded high among the clouds, coming from the splendour of Olympus. Ulysses welcomed the sound with joy. At that same time, inside the house, someone was speaking in the mill room nearby. One of the women who ground the grain raised her voice. Through her, he received a second sign.
            There were twelve women assigned to that work. They ground wheat and barley, the food on which human life depends. All but one had finished the amount they were required to grind and had gone off to rest. This last woman hadn't completed hers, because she was weaker than the others. She heard the thunder and stopped turning the mill. Then she spoke the words that would be a sign for her master.
        - id: ch02-b06
          speaker: miller_woman
          text: >-
            Father Jove, you rule earth and heaven. You've made thunder in a clear sky, with not even a cloud to be seen. That must mean something for someone. Hear me, your poor servant, calling on you. Let this be the last day those suitors eat at Ulysses' house. Grinding their flour has worn me out. May they never eat another dinner anywhere again.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The thunder and the woman's prayer filled Ulysses with joy. He understood both omens. He would take his revenge on the suitors.
    - id: ch03
      title: "The servants arrive"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The other maids got up and lit the hearth fire. Telemachus rose and dressed too. He fastened his sword belt over his shoulder, strapped sandals onto his handsome feet, and took a strong spear tipped with sharpened bronze. At the cloister threshold he questioned Euryclea.
        - id: ch03-b02
          speaker: telemachus
          text: >-
            Nurse, was the stranger given proper food and a comfortable place to sleep? Or was he left to see to himself? My mother is a good woman, but sometimes she lavishes care on people who don't deserve so much and overlooks men who are far better.
        - id: ch03-b03
          speaker: euryclea
          text: >-
            Don't blame anyone without a reason, child. He sat drinking for as long as he wanted. Your mother asked if he needed more bread, and he said no. When he wished to sleep, she told the servants to prepare a bed. But he said he was a miserable wanderer and wouldn't lie in a bed under blankets. He insisted on a raw bullock's hide and sheepskins here in the cloister. I covered him with a cloak myself.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Telemachus left the courtyard for the Achaeans' assembly. He carried his spear, and his two dogs went along with him. Euryclea called the maids to work.
        - id: ch03-b05
          speaker: euryclea
          text: >-
            Up now, all of you. Sweep the cloisters, then sprinkle water to keep the dust down. Put the covers on the seats. Some of you take a wet sponge and clean the tables. Wash the mixing bowls and the cups. Go to the fountain for water at once. It's a feast day, so the suitors will come early. They'll be here before long.
        - id: ch03-b06
          speaker: narrator
          text: >-
            They did as she said. Twenty women went to fetch water, while the rest hurried through the work inside. The men attending the suitors also arrived and began chopping wood. Soon the women came back from the fountain. Eumaeus followed them with the three best pigs he could find. He let the pigs feed around the place and spoke kindly to Ulysses.
        - id: ch03-b07
          speaker: eumaeus
          text: >-
            Stranger, have the suitors begun treating you a little better? Or are they still as rude as before?
        - id: ch03-b08
          speaker: odysseus
          text: >-
            May the gods pay them back for the wrong they do. Here they are in another man's house, ruling it by force without a trace of shame.
        - id: ch03-b09
          speaker: narrator
          text: >-
            While they talked, Melanthius the goatherd arrived with two shepherds. He too had selected his best goats for the suitors' meal. They tied the animals under the gatehouse. Then Melanthius began jeering at Ulysses.
        - id: ch03-b10
          speaker: melanthius
          text: >-
            Still here, stranger? Still roaming the house begging and bothering people? Why not find somewhere else? You and I won't understand one another until we've tried our fists. You've no decency about your begging. Plenty of Achaeans hold feasts. This isn't the only house with food.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Ulysses said nothing. He lowered his head and kept his thoughts to himself. A third herdsman arrived, Philoetius. He had brought a barren heifer and some goats across the water. The ferrymen had carried them over, as they did for anyone who came needing passage. Philoetius secured his animals under the gatehouse, then went over to Eumaeus.
        - id: ch03-b12
          speaker: philoetius
          text: >-
            Swineherd, who's this man who has just arrived? Do you know him as one of your own men? What family is he from, and what country? Poor man, he looks as though he was someone important once. But the gods give suffering wherever they choose. They can bring it even to kings.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Philoetius went to Ulysses and offered his right hand in greeting.
        - id: ch03-b14
          speaker: philoetius
          text: >-
            Good day, old friend. Things look hard for you now. I hope your fortunes improve. Father Jove, you're the cruelest of the gods! We are your children, but you show us no pity when we're suffering. When I saw this man I broke into a sweat, and my eyes filled with tears. He makes me think of Ulysses. If my master is alive, perhaps he's wandering in rags like these. And if he's dead, in the house of Hades, then I must mourn that good man. He put me in charge of his cattle among the Cephallenians when I was only young. Now the cattle are beyond counting. No one could have tended them better. They've multiplied like ears of corn. Yet I must keep bringing them here for other men to eat. His son is in this house, but they pay no attention to him. They don't fear heaven's anger either. Because Ulysses has been gone so long, they already want to share his wealth among themselves. I've often thought of taking the cattle and going abroad. But while his son is alive, it would be wrong. Wrong as leaving would be, it's harder still to stay and be abused while tending another man's herds. I can't bear my position. I'd have fled long ago and asked another chief to shelter me, except that I still believe my poor master will return. I believe he'll send these suitors running from his house.
        - id: ch03-b15
          speaker: odysseus
          text: >-
            Herdsman, you seem a good-hearted man, and you have sound judgement. I'll tell you something and swear to it. By Jove, the first of the gods, and by Ulysses' hearth that I've come to, Ulysses will be back before you leave this place. If you wish, you'll be here to see him kill the suitors who rule the house now.
        - id: ch03-b16
          speaker: philoetius
          text: >-
            If Jove makes that happen, you'll see what help I can give. I'll use every bit of strength I have for him.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Eumaeus too prayed that Ulysses would come home.
    - id: ch04
      title: "The guest at the feast"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            While the three men talked, the suitors were planning to murder Telemachus. An eagle flew close on their left, holding a dove in its claws. Amphinomus spoke when he saw it.
        - id: ch04-b02
          speaker: amphinomus
          text: >-
            Friends, this plan to kill Telemachus won't succeed. Let's leave it and go to dinner.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The other suitors accepted his advice and went indoors. They laid their cloaks over the benches and chairs. Sheep, goats, and pigs were killed for the sacrifice, along with the heifer. Once the inward parts of the animals had been cooked, portions were carried round to everyone. Wine was prepared in the great mixing bowls. Eumaeus, the swineherd, put a cup into each man's hands. Philoetius carried the baskets of bread round the company, while Melanthius filled their cups with wine. With everything ready, the men reached for the good things on their tables.
            Telemachus took particular care over where Ulysses sat. He chose the stretch of cloister where the floor was made of stone. There he gave the stranger a rather shabby chair, beside a small table for him alone. Servants brought his share of the inward meats to that table and set his wine before him in a golden cup.
        - id: ch04-b04
          speaker: telemachus
          text: >-
            Sit here and drink among these great men. I'll stop the suitors from mocking or striking you. This house isn't an inn. It belongs to Ulysses, and he has passed it on to me. So all you suitors, watch your hands and watch your tongues. Otherwise there'll be trouble.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The suitors bit their lips. They were amazed at his boldness. Antinous spoke to the others.
        - id: ch04-b06
          speaker: antinous
          text: >-
            We may not like that kind of talk, but we'll endure it. Telemachus really means to threaten us. If Jove had allowed it, we'd have silenced his boasting long before this.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Telemachus paid Antinous no attention. Outside, heralds were leading the sacred offering of a hundred cattle through the town. The Achaeans gathered in Apollo's shady grove.
            The outer portions of meat were now roasted and taken off the spits. Each man was served, and they ate as much as they wanted. The servants brought Ulysses the same portion as everyone else. Telemachus had expressly told them to do that.
            Minerva kept the suitors' insolence alive. She wanted Ulysses' anger against them to grow still stronger. One of the company was Ctesippus of Same, a coarse, foul-mouthed man. He counted on his great wealth as he courted Ulysses' wife. He addressed the others.
        - id: ch04-b08
          speaker: ctesippus
          text: >-
            Let me have a word. This stranger has received as much food as any of us. Quite right too. We shouldn't mistreat a visitor whom Telemachus welcomes here. That wouldn't be fair or proper. Still, I'd like to give him a present of my own. Then he'll have something for the woman who bathes him, or another of Ulysses' servants.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Ctesippus reached into the meat basket, picked up a heifer's foot, and threw it at Ulysses. Ulysses moved his head just aside. The foot missed and struck the wall. As he dodged it, he gave a grim smile in the Sardinian manner. Telemachus spoke fiercely to Ctesippus.
        - id: ch04-b10
          speaker: telemachus
          emotion: angry
          text: >-
            You're lucky he turned his head and you missed. If you'd struck him, my spear would have gone through you. Your father would have been arranging your funeral, not your wedding in this house. I want no more disgraceful conduct from any of you. I'm grown now. I know right from wrong and can see what's going on. I'm not the child I used to be. I've watched you kill my sheep and help yourselves to my grain and wine. I've borne it because one man can't fight so many. But don't do me any more violence. If you mean to kill me, then kill me. I'd rather die than watch this shame every day, guests insulted and women servants dragged about the house in such a disgraceful way.
        - id: ch04-b11
          speaker: narrator
          text: >-
            For a while none of them answered. At last Agelaus, son of Damastor, spoke.
        - id: ch04-b12
          speaker: agelaus
          text: >-
            There's no reason to resent what Telemachus has said, or argue against it. He's right. Stop mistreating this stranger or any of the servants here. But I have some friendly advice for him and his mother. I hope they'll both agree with it. Telemachus, while you could still hope Ulysses would come back, nobody could blame you for waiting and letting the suitors remain. It would have been better if he had returned. Now, though, it's clear that he never will. Speak quietly with your mother about it. Ask her to marry the best man, the one who offers her the most. Then you can look after your inheritance yourself and eat and drink in peace. Your mother can care for her new husband's household instead of yours.
        - id: ch04-b13
          speaker: telemachus
          text: >-
            Agelaus, I swear by Jove and by everything my unhappy father has suffered, whether he's dead far from Ithaca or wandering in some distant country, I haven't stood in the way of my mother's marriage. I urge her to choose any man she likes. I'll give her gifts without number as well. But I won't command her to leave this house when she doesn't want to go. May the gods never let me do that.
    - id: ch05
      title: "The prophet sees darkness"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Minerva drove the suitors into wild laughter and muddled their minds. Yet the laughter sounded forced. Blood smeared the meat they ate. Tears filled their eyes, and a sense of approaching evil lay heavy in their hearts. Theoclymenus saw what was happening.
        - id: ch05-b02
          speaker: theoclymenus
          text: >-
            Unhappy men, what's come over you? Darkness covers you like a shroud, from your heads to your feet. Your cheeks are wet with tears. Cries of mourning fill the air. Blood runs down the walls and the roof beams. Look at the entrance to the cloister and the court beyond. They're crowded with ghosts, going in troops into the dark night below. The sun has vanished from heaven. A deadly gloom covers the land.
        - id: ch05-b03
          speaker: narrator
          text: >-
            His words only made them laugh heartily. Eurymachus answered.
        - id: ch05-b04
          speaker: eurymachus
          text: >-
            Our newest stranger has lost his mind. Servants, put him out into the street, since he thinks it's so dark in here.
        - id: ch05-b05
          speaker: theoclymenus
          text: >-
            No need to send anyone along, Eurymachus. I have my own eyes, my own ears, and two feet, as well as a mind that understands. I'll take them away from this house myself. I can see the disaster hanging over you. Not one of you will escape, you men who insult people and plan wickedness under Ulysses' roof.
        - id: ch05-b06
          speaker: narrator
          text: >-
            As he spoke, he went out and returned to Piraeus, who welcomed him. The suitors kept glancing at one another. They laughed at the visitors to provoke Telemachus. One insolent man taunted him.
        - id: ch05-b07
          speaker: suitor_insolent
          text: >-
            Telemachus, your guests aren't much of a success. First there's that pest of a beggar, asking for bread and wine. No skill at work, no strength for fighting, no use to anyone. Now you've found another man who pretends to be a prophet. Take my advice. You'd do better to put both aboard a ship and send them to the Sicels. Sell them for whatever you can get.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Telemachus ignored him. He sat quietly watching his father, expecting him to attack the suitors at any moment.
            Meanwhile Penelope, the wise daughter of Icarius, had asked for a richly made seat. It had been put where she could face both the courtyard and the cloister. Sitting there, she could hear what every person was saying. There had been plenty of merriment while this dinner was being made. The food was good, and there was a great deal of it, because so many animals had been sacrificed for the feast. But the evening meal had still to be served. A goddess and a courageous man were preparing that supper for them. No one could imagine a meal more dreadful than it would be. These men had called down their own destruction.
