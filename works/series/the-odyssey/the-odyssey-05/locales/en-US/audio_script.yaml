  chapters:
    - id: ch01
      title: Permission to leave
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Athena had spoken again on Olympus. Odysseus was still a captive, and now his son was in danger too. Zeus told her to protect Telemachus. He sent Hermes to order Calypso to release the father. Odysseus would sail on a raft towards the Phaeacians, and they would take him home.
            Hermes arrived to find Calypso singing at her loom. Cedar smoke filled the cave. There were vines, running streams and birds in the trees outside. He stopped to admire it. Odysseus wasn't there. He was grieving by the sea.
            Calypso received Hermes and gave him the food and drink of the gods. She waited to hear his errand, and he explained why he'd come.
        - id: ch01-b02
          speaker: hermes
          text: |
            You must let Odysseus leave. That's Zeus's command. He is to go beyond this island.
        - id: ch01-b03
          speaker: narrator
          text: |
            Calypso shook with anger.
        - id: ch01-b04
          speaker: calypso
          text: |
            Is a goddess forbidden to live with a mortal she loves?
        - id: ch01-b05
          speaker: narrator
          text: |
            Zeus had destroyed his ship and drowned his men. She'd rescued him and offered to make him immortal. She remembered other goddesses' lovers. Artemis had killed Orion, whom Dawn loved. Zeus had struck Demeter's lover Iasion with lightning. Now the gods wanted her man taken away too.
            She couldn't resist the order. She had no ship or sailors, but she promised honest advice. Hermes warned that Zeus would punish her if she didn't obey. Then he left, and she went to the shore.
            Odysseus was grieving there, as he did every day. At night, she made him share her bed when he didn't want to. In daylight he went to the rocks. At least he could look towards the home he couldn't reach.
        - id: ch01-b06
          speaker: calypso
          text: |
            I'll let you leave now. Make yourself a raft. You can have tools, supplies and clothes, and I'll send a wind to help you start.
        - id: ch01-b07
          speaker: narrator
          text: |
            Her proposal made him shudder.
        - id: ch01-b08
          speaker: odysseus
          text: |
            You want me to cross that sea on a raft? Before I agree, give me your oath. Tell me this isn't a plan to kill me.
        - id: ch01-b09
          speaker: narrator
          text: |
            She smiled at his caution and touched him. By the earth, the sky and the river Styx, she swore she meant him no harm. In his position, she would do as she advised him.
            Back inside, he ate a mortal's meal while she ate divine food. Afterwards, she tried again to keep him.
        - id: ch01-b10
          speaker: calypso
          text: |
            There is suffering ahead. If you knew how much, you might choose to stay. Here, you never need grow old.
        - id: ch01-b11
          speaker: narrator
          text: |
            She knew he was always thinking of Penelope. How could a mortal wife compare with a goddess?
        - id: ch01-b12
          speaker: odysseus
          text: |
            Penelope isn't as tall or as beautiful as you. I know that. She's mortal, and you're a goddess. But I want to go home all the same.
        - id: ch01-b13
          speaker: narrator
          text: |
            He'd suffered so much already. If a god sent more trouble, he'd endure that as well. When night came, he and Calypso went to bed together in the cave.
    - id: ch02
      title: What the raft could carry
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Next morning she gave him an axe and showed him the trees. He felled twenty, squared and smoothed the wood, and made a broad raft. She supplied drills and sailcloth. He built a deck, put up a mast and steering oar, and fenced the sides against waves. He used levers to get it into the water.
            It took four days. On day five, he washed and changed, loaded water, wine and food, and set out. Calypso sent a gentle wind. His sail filled as the island fell behind him.
            She'd told him which stars to watch. He stayed awake, steering with the Bear on his left. He sailed seventeen days. On the eighteenth, the mountains looked like a shield on the horizon. He was near the Phaeacians' land.
            Poseidon saw him too. The sea god was returning from his travels. He realized the other gods had helped Odysseus while he was away.
        - id: ch02-b02
          speaker: poseidon
          text: |
            You've got almost to safety, have you?
        - id: ch02-b03
          speaker: narrator
          text: |
            His trident churned the sea. Winds fought each other, and clouds covered the sky. Darkness fell over the water.
            He thought of Calypso's warning. If he'd fallen at Troy, someone would have buried him. People who knew him would know how he died. Out here, he could vanish without a trace.
            A wave knocked him into the sea. The mast snapped, and the sail and yard fell with it. His clothes made swimming difficult. At last he reached the surface and spat out seawater. He found the raft, swam towards it, and pulled himself back on.
            He couldn't steer now. The winds tossed the raft about. A figure came up from the sea and sat near him. It was Ino. She'd once been human and was now a sea goddess. She had seen what was happening to him.
        - id: ch02-b04
          speaker: ino
          text: |
            You must swim from here. Leave the raft and your clothes. This veil will keep you safe if you bind it around your chest. Make for the land. When you reach it, return the veil to the water.
        - id: ch02-b05
          speaker: narrator
          text: |
            She handed it over and disappeared under the sea. Odysseus hesitated, holding the cloth. One god had kept him prisoner. Another wanted to drown him. Could he trust this one when she told him to give up the raft? The coast still looked so far away.
            He decided to wait while the timbers held. Once they broke, he'd have to swim.
            Poseidon raised another huge wave. It crashed down, scattering the raft. Odysseus straddled a plank, removed the clothes Calypso had given him, and tied the veil under his arms. Then he entered the water.
            Poseidon watched, satisfied that the man was suffering, and left for his own halls. Athena stopped the winds from fighting. She kept a north wind blowing to calm the sea and help Odysseus reach the Phaeacian coast.
    - id: ch03
      title: A place to land
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Two days and two nights passed as he swam and drifted. On the third morning the wind died down. From the top of a wave he could see trees. He swam towards them with what strength he had left.

            Then the sound of surf reached him.
            There was rock ahead, not a beach. Waves struck it and flew into spray. He couldn't find a foothold. If he tried climbing out, he might be smashed against the stone. If he kept swimming, he might be swept back to sea. He was afraid of what lived below the water, as well as Poseidon's anger.
            Before he decided, a wave carried him straight at the cliff. Athena prompted him to grab it. He held on with both hands while the water fell back. Then another surge pulled him away, scraping his palms raw and drawing him under.
            He surfaced and changed his approach. Athena helped him think clearly. He swam out beyond the breakers and looked for another way in along the shore.
            A river mouth offered shelter. No cliff blocked it, and the wind couldn't reach it easily. The current was against him, though. He prayed to the river god without knowing its name.
        - id: ch03-b02
          speaker: odysseus
          text: |
            Please let me reach your shore. I've come out of the sea god's reach, and I can't go any farther.
        - id: ch03-b03
          speaker: narrator
          text: |
            The god slowed the river and quieted its mouth. Odysseus came into the shallows and collapsed. His body was swollen, his mouth full of salt water. For a while he could hardly breathe, let alone speak.
            Once he recovered enough to move, he removed the veil and threw it into the stream. The water carried it back to Ino. He crawled through the reeds and pressed his lips to the earth.
            There was still the night to survive. The riverbank was cold and wet. But higher up, wild animals might be hiding in the woods. He considered both dangers and chose the trees.
            He found two olive growths tangled together above thick leaves. Wind and rain could hardly get in. He made a bed under them and covered himself. It was like hiding a spark under ashes to keep it alive.

            Athena closed his eyes and let him sleep, forgetting his pain.
