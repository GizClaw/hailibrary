  chapters:
    - id: ch01
      title: The order to release Ulysses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Dawn rose from her bed beside Tithonus, bringing light to mortals and immortals alike. The gods met again in council. Jove, their king and lord of thunder, was among them. Minerva spoke about Ulysses and the many things he had suffered. She pitied him, so far away in the nymph Calypso's house.
        - id: ch01-b02
          speaker: athena
          text: |-
            Father Jove, and all you gods who live in unending happiness, I hope we never see another kindly ruler. Let no king govern fairly again. From now on, let them all be cruel and unjust. Not one of Ulysses' subjects remembers him, though he ruled them like a father. He lies suffering on Calypso's island, and she will not release him. He cannot find a ship or sailors to carry him home across the sea. Now wicked men are planning to murder his only son as well. Telemachus is returning from Pylos and Lacedaemon, where he went to seek news of his father.
        - id: ch01-b03
          speaker: zeus
          text: |-
            My dear child, what do you mean? You sent him there yourself. You believed it would help Ulysses come home and punish the suitors. You have the power to keep Telemachus safe and bring him back. The suitors can come rushing home in confusion, without having killed him.
        - id: ch01-b04
          speaker: narrator
          text: |-
            Then Jove turned to his son Mercury and gave him an order.
        - id: ch01-b05
          speaker: zeus
          text: |-
            Mercury, you carry our messages. Go to Calypso and tell her what we have decided. Poor Ulysses must return home. No god or mortal will escort him. He must make a dangerous journey of twenty days on a raft, until he reaches fertile Scheria, the country of the Phaeacians. They are close kin to the gods. They will honor him as though he were one of us, and send him home aboard a ship. They will give him bronze, gold and clothing, more than he would have brought from Troy if he had carried all his prizes safely home without disaster. That is the way we have chosen to restore him to his country and his friends.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Mercury obeyed. He was the guardian and guide, the god who had killed Argus. He fastened on his shining golden sandals, which carried him like the wind across land and water. He took his wand. With it he could close a man's eyes in sleep or wake him whenever he wished. Holding it, he flew over Pieria and swooped down through the sky to the surface of the sea. He skimmed the waves like a cormorant fishing through every corner of the ocean, its thick feathers drenched with spray. He flew over wave after endless wave. At last he reached the island he had been sent to. He left the water and crossed the land to Calypso's cave.

            The nymph was at home. A great fire burned on her hearth. The smoke of cedar and sandalwood smelled sweet even from far away. Calypso sat working at her loom, passing a golden shuttle through the threads and singing in a beautiful voice. Thick woods surrounded the cave. Alders and poplars grew there, and fragrant cypress trees. Great birds nested among them, owls and hawks and noisy sea-crows that found their living in the water. A flourishing vine, heavy with grapes, climbed around the cave's entrance. Four streams ran in channels cut close together, turning this way and that to water beds of violets and rich green plants. Even a god could feel delight in such a place. Mercury stopped to look. Once he had admired it enough, he stepped inside.

            Calypso recognized him immediately. The gods know one another, however far apart their homes may be. Ulysses was not there. He was on the shore as usual, staring at the empty sea, groaning and weeping until his heart seemed to break. Calypso offered Mercury a seat.
        - id: ch01-b07
          speaker: calypso
          text: |-
            Mercury, you are honored here and always welcome. What has brought you to see me? You so seldom visit. Tell me what you need. If I have the power, and the thing can be done, I will do it at once. But come farther in first. Let me give you something to eat and drink.
        - id: ch01-b08
          speaker: narrator
          text: |-
            She brought a table laden with ambrosia close to him and mixed red nectar for his drink. Mercury ate until he was satisfied and drank his fill. Then he told her why he had come.
        - id: ch01-b09
          speaker: hermes
          text: |-
            We speak as one god to another, and you have asked for the truth. Jove sent me. I did not choose this journey. Who would willingly cross all that sea, with no crowded cities along the way to offer sacrifices and fine offerings of a hundred beasts? But I had to come. None of us can oppose Jove or disobey his commands.

            He says you are keeping here the unluckiest of all the men who fought for nine years outside Priam's city. In the tenth year they took the city and sailed for home. On the voyage they offended Minerva. She raised the winds and waves against them. Every one of this man's brave companions died. Wind and tide brought him alone to your island. Jove commands you to let him leave now. His fate is not to die here, far from his own people. He is to reach his house and country, and see his friends again.
        - id: ch01-b10
          speaker: narrator
          text: |-
            Calypso shook with anger at his words.
        - id: ch01-b11
          speaker: calypso
          emotion: angry
          text: |-
            You gods should be ashamed. You are jealous whenever a goddess loves a mortal and openly lives with him as his wife. When rosy-fingered Dawn took Orion as her lover, all you fine gods were furious. You were not satisfied until Diana killed him in Ortygia. And when Ceres loved Iasion and lay with him in a field ploughed three times, Jove soon heard about it. He struck Iasion dead with his lightning.

            Now you are angry with me because a man lives here. I found the poor creature all alone, riding a ship's keel. Jove had shattered his vessel with a thunderbolt and sunk it in the middle of the sea. Every member of the crew drowned. Only he was driven here by the wind and water. I came to love him and cared for him. I wanted to make him immortal, so he would never grow old. But I cannot defy Jove or overturn his decision. If he insists, let Ulysses cross the sea again. I cannot take him anywhere myself. I have neither ships nor sailors to carry him. Still, I will gladly advise him honestly and help him find the safest way to his own country.
        - id: ch01-b12
          speaker: hermes
          text: |-
            Then release him. Otherwise Jove will be angry with you and make you suffer for it.
    - id: ch02
      title: The raft and the stars
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Mercury took his leave. Calypso had heard the message Jove sent, and now she went outside to find Ulysses. There he was on the beach again, with tears constantly filling his eyes. He missed his home so painfully that the longing seemed to be killing him. Calypso herself had become wearisome to him. Each night he was forced to lie with her in the cave. She was the one who wanted their bed together. He did not. Each day he spent on the rocks or at the edge of the sea, weeping and calling out in his hopelessness. All the time, he kept his eyes turned toward the water. Calypso approached him where he sat.
        - id: ch02-b02
          speaker: calypso
          text: |-
            Poor man, you will not stay here grieving yourself to death any longer. I have decided of my own free will to let you go. Cut some timbers and build a broad raft, with a deck above it to carry you safely over the sea. I will give you bread, wine and water so you do not starve. You shall have clothes as well, and I will send a fair wind to help you home, if the gods above permit it. They know more about such things than I do and have greater power to decide them.
        - id: ch02-b03
          speaker: narrator
          text: |-
            Ulysses shuddered when he heard the proposal.
        - id: ch02-b04
          speaker: odysseus
          text: |-
            Goddess, there must be something hidden in this. If you truly wanted to help me return, you would not ask me to do so frightening a thing as cross the sea on a raft. Even a well-equipped ship, with the wind behind her, could not dare such a long passage. Nothing you say will persuade me to board it until you swear a solemn oath that you intend no harm.
        - id: ch02-b05
          speaker: narrator
          text: |-
            Calypso smiled and stroked him with her hand.
        - id: ch02-b06
          speaker: calypso
          text: |-
            You know a great deal, but this time you have mistaken me. Let the sky above, the earth below and the waters of Styx witness my oath. No blessed god can swear anything more solemn. I mean you no harm at all. I am telling you exactly what I would do if I stood in your place. I am being honest with you. My heart is not made of iron. I truly pity you.
        - id: ch02-b07
          speaker: narrator
          text: |-
            She set off quickly, leading him back to the cave. Ulysses followed her. Goddess and man reached her home, and he sat where Mercury had been sitting a little before. Calypso brought him the food and drink that mortals eat. Her maids served ambrosia and nectar to her. They helped themselves to what was set before them. After they had eaten and drunk enough, Calypso spoke again.
        - id: ch02-b08
          speaker: calypso
          text: |-
            Ulysses, noble son of Laertes, are you really so eager to leave for your country at once? May good fortune travel with you. But if you knew how much you must endure before you get there, you would choose to stay in this house with me. You would let me give you immortal life, however badly you longed for the wife you think about every day. I do not believe I am any less tall or beautiful than she is. A mortal woman can hardly expect to match a goddess in beauty.
        - id: ch02-b09
          speaker: odysseus
          text: |-
            Goddess, please don't be angry. I know very well that Penelope is not as tall or as lovely as you. She is a mortal woman, and you can never die. Even so, I want my home. I think of nothing else. If another god wrecks me at sea, I will endure it as well as I can. I have suffered more than I can count, on land and on water. Let this be one more hardship among the rest.
        - id: ch02-b10
          speaker: narrator
          text: |-
            The sun went down, and darkness came. They retired to the inner part of the cave and lay down together.

            Morning's child, rosy-fingered Dawn, appeared. Ulysses dressed in his shirt and cloak. The goddess wore a graceful dress woven from cloth as fine and light as gossamer. She put a beautiful golden belt around her waist and covered her head with a veil. At once she began to consider what would help Ulysses on his way. She gave him a large bronze axe, just right for his hands. Its blade was sharp on both sides. The fine handle was made of olive wood and fitted tightly into place. She also supplied a sharp adze. Then she led him across to the farthest part of the island, where the biggest trees grew. Alders, poplars and pines towered toward the sky. Their wood had dried and seasoned well, so it would ride lightly on the water. She pointed out the best trees to use and went back to her home, leaving him to fell them.

            It did not take him long to cut the trees down. There were twenty altogether. With the adze he smoothed their surfaces, then measured and squared them by a rule. It was the careful work of a capable craftsman. Meanwhile Calypso returned carrying augers. He used these to bore holes, fitted the pieces of timber together, and secured them with bolts and rivets. He built the raft as broad across as an expert shipbuilder would make a large vessel. On top of its ribs he laid a deck, then ran a raised edge all around it. He made a mast with a yard across it, and a rudder for steering. Around the outside he fastened barriers of woven branches to guard him from the waves. Then he put on a load of wood. Calypso next brought linen to use for sails. He made the sails excellently and fastened them with braces and sheets, the ropes used to turn the sails and hold their corners. When everything was finished, he used levers to move the raft down into the sea.

            All the work took four days. On the fifth, Calypso washed him, gave him clean clothes and sent him away from the island. She supplied a goatskin filled with dark wine and a larger skin full of water. He had a bag of provisions and plenty of good meat. She sent a warm, favorable wind. Gladly Ulysses spread his sail before it. He sat at the rudder and steered with great skill. He never closed his eyes. He watched the Pleiads, and Bootes that sets late, and the Bear. People also call the Bear the Wain. It turns around in one place, facing Orion, and is the only one that never sinks into the waters of Oceanus. Calypso had told him to keep it on his left. For seventeen days he sailed. On the eighteenth, faint mountains appeared on the nearest part of the Phaeacian coast, rising like a shield on the horizon.
    - id: ch03
      title: Neptune breaks the raft
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            King Neptune was returning from the Ethiopians. From the mountains of the Solymi he saw Ulysses far away, sailing across the sea. Anger seized him. He shook his head and muttered to himself.
        - id: ch03-b02
          speaker: poseidon
          emotion: angry
          text: |-
            So the gods have changed their minds about Ulysses while I have been in Ethiopia. Now he is nearly at the country of the Phaeacians, where fate says he will escape these disasters. But before he is finished, I can still give him plenty to suffer.
        - id: ch03-b03
          speaker: narrator
          text: |-
            He gathered clouds and took hold of his trident. Stirring it through the sea, he called up every wind in fury. Clouds hid the earth, the sea and the sky. Night seemed to burst out of heaven. East, south, north and west winds struck together, raising an enormous sea. Ulysses began to lose heart. In his fear, he spoke to himself.
        - id: ch03-b04
          speaker: odysseus
          emotion: fearful
          text: |-
            What will happen to me now? I fear Calypso spoke truly when she warned me of more trouble at sea before I reached home. Here it is. Jove has blackened the sky with clouds, and winds from every side are piling up these waves. My death must be certain. How blessed those Danaans were, three times blessed, who died before Troy fighting for the sons of Atreus. I wish I had died when the Trojans pressed around me beside Achilles' body. Then I would have had a proper burial. The Achaeans would have honored my name. Instead I seem bound for the most miserable death of all.
        - id: ch03-b05
          speaker: narrator
          text: |-
            He was still speaking when an immense wave burst over him. It hit so violently that the raft rocked beneath him and threw him a long way out into the sea. He lost his grip on the rudder. The force of the hurricane broke the mast halfway up, and both the yard and the sail fell into the water. Ulysses stayed under for a long time. He fought with all the strength he had to rise again, but the clothes Calypso had given him were weighing him down. Finally he managed to lift his head above the surface. Water poured down his face in streams. He spat out mouthfuls of bitter brine.

            Through it all he kept sight of the raft. He swam toward it as fast as he could, caught hold and climbed back aboard, saving himself from drowning. The water tossed the raft around like thistledown whirled along a road by autumn winds. North, south, east and west seemed to be batting it between them like a shuttlecock.

            Ino saw his distress. She was the daughter of Cadmus, also called Leucothea. Once she had been a mortal woman, but now she was a goddess of the sea. She pitied Ulysses in his terrible trouble. Rising from the waves like a gull, she settled on his raft.
        - id: ch03-b06
          speaker: ino
          text: |-
            Poor good man, why is Neptune so angry with you? He is making you suffer, but however fiercely he rages, he will not kill you. You seem sensible, so listen. Take off your clothes. Leave the raft to the wind and swim toward the Phaeacian shore. Better fortune waits for you there. Take this veil and wrap it around your chest. It has magic in it. While you wear it, you cannot be harmed. Once your feet touch land, take it off. Throw it as far as you can back into the sea, and then leave that place.
        - id: ch03-b07
          speaker: narrator
          text: |-
            She removed her veil and gave it to him. Then, like a gull, she dived again and disappeared beneath the dark blue water. Ulysses could not decide what to believe. He spoke to himself in distress.
        - id: ch03-b08
          speaker: odysseus
          text: |-
            This must be another god trying to lure me to my death. Why else tell me to abandon the raft? I will not leave it yet. The land where she promised an end to my troubles still looks far away. I know the best thing to do. Whatever comes, I will stay here as long as the timbers hold together. If the sea breaks them apart, then I will swim. I cannot see a better course than that.
        - id: ch03-b09
          speaker: narrator
          text: |-
            While he hesitated, Neptune sent a tremendous wave. It rose above his head and fell across the raft. The timbers scattered like dry chaff in a whirlwind. Ulysses straddled a plank as though riding a horse. He stripped off Calypso's clothes, tied Ino's veil beneath his arms and threw himself into the sea to swim ashore. Neptune watched him, shaking his head and talking under his breath.
        - id: ch03-b10
          speaker: poseidon
          text: |-
            There you are. Swim about as best you can until you find those prosperous people. You will hardly be able to say I let you off easily.
        - id: ch03-b11
          speaker: narrator
          text: |-
            Then he lashed his horses and drove away to his palace at Aegae. Minerva was determined to help Ulysses. She closed off the paths of every wind but one and made them lie still. From the north she raised a strong breeze to settle the water, until he could reach the Phaeacians and be safe.
    - id: ch04
      title: A place on the earth
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Two nights passed, and two days, with Ulysses still drifting in the sea. Heavy swells kept rolling through the water, and death seemed to be looking him in the face. When the third day dawned, the wind finally died away. Everything was still. There was not even a faint breath moving through the air. A swell lifted him, and he looked eagerly ahead from its top. He could see land, and this time it was close.

            Think of children watching their beloved father recover after a long and painful illness. An angry spirit has afflicted him, but the gods rescue him at last. Ulysses felt that same joy and gratitude when he saw the land and its trees again. He swam with all his remaining strength, longing to stand on dry ground. But when he came near enough to hear the shore, a terrible sound met him. Waves thundered against the rocks. The swell broke with a tremendous roar, and spray covered everything. There was no harbor for a ship and no shelter of any sort. Only headlands, low rocks and mountain peaks rose before him.
        - id: ch04-b02
          speaker: odysseus
          emotion: fearful
          text: |-
            I have swum such a long way that I had stopped hoping altogether. Now Jove allows me to see land, but I cannot find a place to get ashore. Waves break against nothing but rock. Those rocks are smooth, rising straight up from the water. The sea is deep right at their base. There is no foothold to let me climb out. I am afraid that as I try to leave the water, a great wave will sweep my feet away and hurl me against the stone. That would be a wretched way to land. Yet if I swim on, searching for a beach that slopes gently or a harbor, another hurricane may drag me back out to sea, however I resist it. Or heaven may send some enormous creature from the depths to seize me. Amphitrite has bred many such monsters, and I know how furiously Neptune hates me.
        - id: ch04-b03
          speaker: narrator
          text: |-
            A wave caught him while he was wondering what to do and flung him against the rocks. He would have been broken and torn apart if Minerva had not shown him how to act. He seized the rock with both hands and clung to it, groaning with pain, until the water drew back. He survived that wave. But the next came and dragged him far out to sea. The rocks tore the skin from his powerful hands, as an octopus's suckers tear when someone pulls it from its bed and stones come away with it. Then the water forced him deep beneath the surface.

            He would have died there, despite the fate appointed for him, if Minerva had not helped him keep his wits. He swam farther out, beyond the breaking waves. All the while he watched the coast for a harbor or a point of land that met the waves at an angle. At last he reached a river mouth. Here there were no rocks, and the place sheltered him from the wind. It seemed the best place to come ashore. He felt the river's current and prayed silently to its god.
        - id: ch04-b04
          speaker: odysseus
          text: |-
            King of this river, whoever you may be, hear me. I come to you in prayer. Save me from Neptune's anger. A man who has lost his way has a claim on the gods themselves. In my suffering I approach your water and cling to your divine knees. Show me mercy, lord. I place myself before you as one asking for protection.
        - id: ch04-b05
          speaker: narrator
          text: |-
            The river god stopped the force of his current and quieted the waves around it. He made the water in front of Ulysses calm and guided him safely into the river mouth. There the strength finally went out of his knees and his powerful hands. His struggle with the sea had worn him down completely. His entire body was swollen. Salt water ran from his mouth and from both nostrils, pouring like a river. He could not draw a breath or speak a word. Utter exhaustion overcame him, and he lay in a faint. After a time his breathing returned, and he became aware of himself again. He removed the veil Ino had given him and cast it into the salty water flowing from the river. The wave that took it carried it to Ino, and she caught it in her own hands. Then Ulysses made his way out of the stream. He lay down among the rushes and pressed a kiss upon the earth that gives so generously.
        - id: ch04-b06
          speaker: odysseus
          text: |-
            What happens now? Where will all this end? If I remain on this riverbank through the long night, cold and damp may kill me in my weakened state. Near sunrise a bitter wind will blow off the water. But if I climb the slope and shelter in the woods, sleeping in a thicket, I may escape the cold and get a good night's rest. Then some wild beast may find me helpless and eat me.
        - id: ch04-b07
          speaker: narrator
          text: |-
            In the end, he chose the woods as the best place to go. He found them on a rise of ground close to the water. There he crept beneath two shoots of olive growing from a single trunk. One shoot had been grafted. The other was growing without a graft. The two were woven so closely into one another that the fiercest wind could not get through their cover. Neither sunlight nor rain could penetrate it. Ulysses crawled underneath and began to prepare a place to sleep. A great quantity of dead leaves lay around him. There were enough to keep two or three men covered even in the hard weather of winter. He was delighted to see that shelter waiting for him. He lay down and heaped the leaves all around his body.

            Think of a man who lives alone in the countryside, far away from anyone else's house. He buries a glowing piece of wood under ashes, keeping it as a seed from which another fire can grow. That way he saves himself the need to go somewhere else for a light. In just that way, Ulysses hid himself beneath the leaves. Minerva brought a gentle, welcome sleep over his eyes. She closed his eyelids and took from him, for that sleep, every memory of his troubles.
