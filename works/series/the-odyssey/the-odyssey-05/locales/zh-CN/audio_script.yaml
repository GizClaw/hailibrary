audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    zeus:
      display_name: 宙斯
      tts: {delivery: 沉稳直接而有威严, timbre: 浑厚成熟, pace: 从容, pitch: 低音}
    hermes:
      display_name: 赫尔墨斯
      tts: {delivery: 明确而果断, timbre: 明亮清晰, pace: 流畅, pitch: 中音}
    calypso:
      display_name: 卡吕普索
      tts: {delivery: 自信而富于感情, timbre: 丰润柔和, pace: 稳健, pitch: 中音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    poseidon:
      display_name: 波塞冬
      tts: {delivery: 强硬而笃定, timbre: 深沉粗厚, pace: 有力舒缓, pitch: 低音}
    ino:
      display_name: 伊诺
      tts: {delivery: 怜惜而务实, timbre: 轻盈清晰, pace: 稳定, pitch: 中高音}
  chapters:
    - id: ch01
      title: 众神派来的使者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            黎明在提托诺斯身旁起了床，把光送给凡人和不朽的神。诸神又聚到一起，掌管雷霆的王宙斯也来了。雅典娜心疼奥德修斯还困在远处、住在卡吕普索家，便向众神讲起他的苦难。
        - id: ch01-b02
          speaker: athena
          text: |-
            父亲宙斯，还有永享安乐的诸神，我真愿以后再没有仁厚、公正的君王，个个都残酷，都不讲理。奥德修斯从前像父亲一样待臣民，如今有谁记得他？他在岛上痛苦地躺着，仙女卡吕普索不放人，自己又没船、没水手，怎么越海回国？现在连独子忒勒马科斯也有人要杀。那孩子去皮洛斯和拉刻代蒙问父亲的消息，正要回来，恶人却在那里等着。
        - id: ch01-b03
          speaker: zeus
          text: |-
            孩子，这又是什么话？当初你自己送他出去，不就是为了帮奥德修斯回家，再让求婚人受罚吗？你完全可以保护儿子，让他平安到家。那群人杀不成，只有狼狈地赶回来。
        - id: ch01-b04
          speaker: narrator
          text: |-
            宙斯说过，又对自己的儿子赫尔墨斯下令。
        - id: ch01-b05
          speaker: zeus
          text: |-
            赫尔墨斯，你是使者，去卡吕普索那里传话。我们定下了，可怜的奥德修斯必须回家。但没有神，也没有凡人去护送。他得乘木筏，熬过二十天危险的航行，来到丰饶的斯刻里亚。费埃克斯人住在那里，和神亲近，会把他当神一样尊敬。他们会用船送他返乡，送的铜、金子、衣物，比他在特洛伊拿齐所有战利品、平平安安归航所得的还要多。我们就这样安排他回到祖国，再见亲友。
        - id: ch01-b06
          speaker: narrator
          text: |-
            曾杀死阿尔戈斯、为人引路护佑的赫尔墨斯立刻照办。他系好闪光的金凉鞋，穿着它，飞过海洋和陆地都像风一样快。手里拿上神杖，要谁睡，谁就合眼，要谁醒，谁就醒。他飞过庇厄里亚，从高天俯冲，贴着海面前进，好比一只鸬鹚飞遍海的角落捉鱼，厚羽毛让浪花打得透湿。他越过一道又一道海浪，终于抵达目的地的小岛，离开水面，走到仙女的洞穴。

            卡吕普索就在家里。炉中火很大，烧的是雪松、檀木，远处就闻到香。她坐在织机边，金梭从经线间来来回回，唱得很美。洞外有密密的树林，桤木、杨树、带香气的柏树，高大的鸟儿在那里筑巢，猫头鹰、鹰隼，还有到水里找食、叫个不停的海鸦。门口葡萄藤长得茂盛，上头全是果子。四股流水顺着挨得很近的沟渠走，弯来转去，浇灌紫罗兰和繁密草木。这景色连神也忍不住喜欢。赫尔墨斯站着看了好一会儿，才进洞。

            卡吕普索马上认出来客。神明哪怕住得再远，也彼此认识。奥德修斯却不在。他照常守在岸上，望着空荡荡的海，哭泣、呻吟，难过得心都碎了。女神让客人坐。
        - id: ch01-b07
          speaker: calypso
          text: |-
            尊贵的赫尔墨斯，你随时来，我都欢迎。不过你不常上门，今天是有什么事？需要我做什么就说，只要事情办得成，我也做得到，一定马上帮忙。先到里面吧，我给你吃的喝的。
        - id: ch01-b08
          speaker: narrator
          text: |-
            她把盛满神食的桌子拉到客人身边，又调好红色的神酒。赫尔墨斯吃喝满意了，这才说出来意。
        - id: ch01-b09
          speaker: hermes
          text: |-
            你是女神，我也是神，既问了，我就把真话说给你。是宙斯派我来，我自己可不愿意。谁想渡这么远的海？一路没有人烟众多的城，给我献祭品，备好百牲祭。但我必须听令。宙斯的话，其他神谁能反抗，谁敢违反？

            他说，有个人留在你这里。当年那些英雄，在普里阿摩斯城前打了九年，第十年破城返航，这个人在他们中间最不幸。他们在回程得罪雅典娜，风浪就被女神唤起，勇敢的同伴全死了，只剩他自己被海潮和风送到这里。宙斯让你立刻放他。他命中不会离开亲人死在此处，而要回家，回祖国，再见朋友。
        - id: ch01-b10
          speaker: narrator
          text: |-
            卡吕普索听得浑身发抖，那是怒气。
        - id: ch01-b11
          speaker: calypso
          emotion: angry
          text: |-
            你们这些神不觉得羞愧吗？女神爱一个凡人，明明白白同他做夫妻，你们就妒忌，见不得。玫瑰指的黎明喜欢俄里翁，你们全都大发脾气，直到阿耳忒弥斯到奥尔堤吉亚杀了他。得墨忒耳爱上伊阿西翁，在翻犁三次的休耕地里与他同欢，宙斯不久听见，马上用雷电把他劈死。

            今天轮到我，因为家里有男人，也惹你们不高兴。是我找到了他，孤身骑在一截龙骨上，可怜得很。宙斯的雷劈中船，让它在深海沉下，船员全淹死。只有他被风浪冲到我的岛。我爱他、照顾他，满心想让他变成永生的，从今往后不衰老。可我又斗不过宙斯，也没法让他的决定作废。他非这样不可，就放这人越海离开吧。我没有船，更没有水手，不能亲自送走。我只能诚心教他，哪条路最有希望安全到家。
        - id: ch01-b12
          speaker: hermes
          text: |-
            那就让他动身。否则，宙斯发了火，你要受惩罚的。
    - id: ch02
      title: 回家的木筏
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            赫尔墨斯走了。卡吕普索听完宙斯的命令，出去找奥德修斯。岸上的他双眼总有泪，想念家乡，想得几乎要死。他厌倦了女神，夜里却不得不在洞中与她同床。愿意的是她，他并不愿意。白天，他待在海边或岩石上，流泪，绝望地大哭，一直望着海。女神走近了。
        - id: ch02-b02
          speaker: calypso
          text: |-
            可怜的人，不能再让你留着，把命都愁没了。我自己决定送你走。你去伐木，造个大筏子，上面铺甲板，就能托着你平安过海。我会准备面包、酒和水，不让你饿肚子，也给你衣服，给你顺风。只要天上诸神允许，你便能回去。他们懂得更多，也比我更有权力安排。
        - id: ch02-b03
          speaker: narrator
          text: |-
            奥德修斯一听，打了个寒战。
        - id: ch02-b04
          speaker: odysseus
          text: |-
            女神，事情没这么简单，你还有打算吧？让我坐木筏横渡大海，这多危险，哪像真要帮我回家？就是好好装备的一艘船，赶上顺风，也不敢航行那么远。你不先郑重发誓，说绝不害我，我就不上去。怎么劝都没用。
        - id: ch02-b05
          speaker: narrator
          text: |-
            女神笑了笑，伸手抚摸他。
        - id: ch02-b06
          speaker: calypso
          text: |-
            你很懂得分辨，可这次判断错了。我请上面的天、下面的地，还有斯堤克斯的河水作证。神明立誓，没有比这更郑重的。我半点都不想害你，只是说，如果我处在你的位置，自己也会这么做。没有什么隐瞒，我的心又不是铁。我是真为你难过。
        - id: ch02-b07
          speaker: narrator
          text: |-
            她快步往回走，他跟在后面，一位女神、一个凡人，就这样回了洞穴。奥德修斯坐在赫尔墨斯方才的座位。卡吕普索给他准备人吃的饭与酒，自己的侍女则端来神食、神酒供她享用。两人吃喝好，女神又说。
        - id: ch02-b08
          speaker: calypso
          text: |-
            拉厄尔忒斯的高贵儿子奥德修斯，你真一刻也不想等，就要回国？那我祝你顺利。但到家前的苦难，要是你都知道了，就会选择留下，跟我过日子，让我给你不死的生命。不管多想见妻子，不管一天到晚都惦记她，也该这样。我可不认为自己的身段、相貌，哪一点比她差。一个凡间女人，怎么和女神比美呢？
        - id: ch02-b09
          speaker: odysseus
          text: |-
            请别生气，女神。我清楚，佩涅洛佩没有你高挑，也没有你漂亮。她会老会死，你却是永生的。但我还是只想回家，什么也替不了这个念头。海上若再有神打碎我的船，我受着，尽量撑过去。以前陆上和海里的苦，已经不知多少，就再添这一场好了。
        - id: ch02-b10
          speaker: narrator
          text: |-
            太阳落了，天黑下来，两人到洞深处躺下。

            第二天玫瑰指的黎明一来，奥德修斯穿上衬衣、斗篷。女神穿的衣裙轻薄得像蛛丝，又精致又优美，腰上有金腰带，头上罩面纱。她马上为他的离开忙碌，拿来一把称手的大铜斧，两边都磨利，装着牢靠而好看的橄榄木柄。还有一把锋利的锛。她领他去岛的另一端，大树全在那里，桤木、杨树和高入云的松树。木料干得透，正好放在水里轻轻浮行。她指给他哪里最好，便回去，留下他砍。

            没多久，二十棵树都砍倒了。他用锛削平，再照尺规做方正，像熟练匠人的活。女神又送来钻子，他钻孔，以栓和铆钉连接木料。筏子宽得像大船的船身，是好船匠才会取的宽度。他在肋架上安甲板，周边装舷缘，做桅杆和横桁，也做了舵。又拿编成的枝条篱障围住四周，好挡海浪，放上许多木料。卡吕普索拿亚麻布来，他做了极好的帆，用转帆索、帆脚索固定，最后以撬杠帮助，把筏移到水里。

            这些工夫花了四天。第五天，卡吕普索替他洗澡，给干净衣裳，就送他出岛。一皮袋黑葡萄酒，一只更大的皮囊装水，还有装满吃食的袋子，好肉也不少。她送来暖暖的顺风，他高兴地张帆，坐着熟练掌舵，半点不闭眼，只看星星。昴星团、落得很晚的牧夫座，还有大熊星座。大熊也叫大车星，在原处转动，对着俄里翁，是唯一不落入俄刻阿诺斯水中的星座。女神让他把它留在左手边。他走了十七天，十八天时，看见费埃克斯海岸最近那一带的山，淡淡的轮廓从天边露出，像一面盾牌。
    - id: ch03
      title: 波塞冬的怒气
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            波塞冬刚从埃塞俄比亚人那里回来，在索吕摩伊人的山上，远远看到海中行驶的筏子和奥德修斯。他一看便怒了，晃着脑袋，自言自语。
        - id: ch03-b02
          speaker: poseidon
          emotion: angry
          text: |-
            好哇，我去趟埃塞俄比亚，众神就对奥德修斯改了心。现在他快到费埃克斯人的岸了，命运注定他能在那里脱离这些灾难。不过，在那之前，他还得多吃些苦。
        - id: ch03-b03
          speaker: narrator
          text: |-
            他把乌云招来，紧握三叉戟搅海，四面的风都被激怒。天地和大海一齐裹进云中，夜色从天顶涌下。东、西、南、北，四股风同时击来，海水涨起可怕的大浪。奥德修斯害怕起来，对自己说话。
        - id: ch03-b04
          speaker: odysseus
          emotion: fearful
          text: |-
            唉，往下我会怎么样？卡吕普索说，回去前还得在海上受罪，恐怕真让她说中了。全应验了。宙斯的乌云遮得这么黑，风从每个方向来，浪高成这样，我死定了。为阿特柔斯的儿子们战死在特洛伊的达那奥斯人，有福啊，三倍的有福。那时守着阿喀琉斯尸体，特洛伊人压得那么紧，我若也死去多好。至少人们会给我安葬，阿开亚人会敬我的名字。现在却要死得如此凄凉。
        - id: ch03-b05
          speaker: narrator
          text: |-
            一道巨浪就在这时打下来，木筏晃得厉害，他被抛出去，落到很远的水里。他手松开舵，狂风又从中间折断桅杆，横桁和帆一同沉海。他在水下待了很久，几乎用尽力气才浮起。女神给的衣服太沉，一直向下拖着。终于头露出海面，苦咸的水沿脸流，他大口吐掉。

            受着这样的罪，他也没忘盯住木筏，赶紧游过去，攀上去，重新离开会淹死自己的水。海却把筏子扔来扔去，像秋风在路上卷着蓟絮转圈。仿佛四方的风都拿着拍子，把它当羽毽互相抽打。
    - id: ch04
      title: 海鸥送来的面纱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            卡德摩斯的女儿伊诺看见了这一幕。人们也叫她琉科忒娅，她原先是凡人，后来才成了海上女神。奥德修斯那么苦，她实在不忍，就像一只海鸥从浪里升起，坐到了筏上。
        - id: ch04-b02
          speaker: ino
          text: |-
            可怜的好人，怎么波塞冬对你这样狂怒？他为难得够厉害，可再发威也要不了你的命。你像个聪明人，听我的话吧，脱去衣服，让木筏随风去，你游到费埃克斯人那里，上了岸就有好运。拿这块面纱，围住胸口，它有神力，戴着就不会受伤害。脚一碰到土地，马上脱下来，尽力往海里扔远，然后自己离开。
        - id: ch04-b03
          speaker: narrator
          text: |-
            她摘下面纱给他，随后又像海鸥那样潜入深蓝的水中，不见了。奥德修斯却不知道该信不信，惊疑地暗想。
        - id: ch04-b04
          speaker: odysseus
          text: |-
            这一定又是哪个神想害我，叫我丢掉筏子，掉进死路。我现在不下去。她说那陆地能救命，可看起来还远。最稳妥的，就是不管出什么事，只要木头没散，就抓住筏子。海浪真把它拆了，我再游。再找不出更好的办法。
        - id: ch04-b05
          speaker: narrator
          text: |-
            他还没拿定主意，波塞冬便送来另一股大浪，高耸在头上，然后整片砸落。木筏散了，像干糠遇着旋风。奥德修斯骑住一块板，像骑马那样，才脱掉卡吕普索给的衣裳，把面纱系在两腋下面，跳进海里，要游向陆地。波塞冬看见，摇摇头，低声说道。
        - id: ch04-b06
          speaker: poseidon
          text: |-
            这就游吧，随你到处游，直到找到那些富足的人。你总不能说，我没让你吃够苦，就放你走了。
        - id: ch04-b07
          speaker: narrator
          text: |-
            他扬鞭抽马，驾车回埃盖的宫去了。雅典娜决定帮奥德修斯，把四周风的道路堵住，让它们静下来，只放开北边。她鼓起强劲的北风，要压平水势，好让他到费埃克斯人的岸边，获得平安。
    - id: ch05
      title: 土地与枯叶
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            他就这样在大浪里漂了两天两夜，死亡始终贴在眼前。第三天一亮，风停了，静得没有一丝空气流动。他随波升高，急忙往前看，陆地近了。

            就好像父亲被恼怒的精灵折磨，病得很久、很苦，终于由神救回，孩子见他慢慢好转，心里欣喜。奥德修斯看到树和陆地，也同样感激。他把全身力气用来游水，想再站到干地上。可游近到能听见岸边声音，响起的却是海浪轰击岩石的声音。水砸得震天，浪花四处都是。没有港口供船停靠，没有挡风避浪之处，只见突出的海角、低矮礁石，还有山头。
        - id: ch05-b02
          speaker: odysseus
          emotion: fearful
          text: |-
            我游了这么远，都绝望了，宙斯又给我看见土地，可哪里能上去？石头被浪猛拍，滑溜溜，直立在水边，下面又那么深，脚踩不到地方，没法爬。我要是刚想离水，一下又被浪托起，往石上撞，那可真是糟透的登岸。可继续游，去找斜坡沙滩、找港口，也许暴风会把我再卷出去，或有神派海怪来吃我。安菲特里忒养了那么多怪物，波塞冬又恨我得很。
        - id: ch05-b03
          speaker: narrator
          text: |-
            正想着，一股浪便把他推上了岩石。冲得那么重，若非雅典娜教他怎么做，早已撞裂撕碎。他用双手扒住岩壁，疼得直哼，也不松开，等水退去，逃过这一下。但另一浪接着来，又把他拖回远处的海。岩石扯烂手上的皮，好比人拔起石床上的章鱼，吸盘撕裂，还带下许多石子。他那强健的手，也被这样剥伤，随即整个人又让浪按到深水中。

            哪怕命运原来另有安排，他也险些在这里死去。还是雅典娜帮他保持头脑清醒。他向外游，避开冲向岸的浪，又不停地朝陆地方向找，看有没有港湾，或可以斜着挡浪的沙嘴。终于到了一条河的出口，这里没有石头，还可以躲风，是最适合靠岸的地方。他感觉到河水正流过，便在心里求告。
        - id: ch05-b04
          speaker: odysseus
          text: |-
            河流的君王，不管您是谁，听我说吧。我诚心求您，救我脱出波塞冬的怒气。人在迷路时，连神也应该让他求助。我受了这些苦，靠近您的水，抱住河神的膝盖。请可怜我，我把自己作为求助的人，交给您了。
        - id: ch05-b05
          speaker: narrator
          text: |-
            河神便止住水流，平息浪涛，让他面前处处安静，护着他安全进了河口。他强健的双手和膝盖却再也撑不住，海水已经耗尽他的力量。全身肿胀，嘴和鼻孔流的海水简直像河，喘不了气，说不出话，累得昏了过去。过些时候，呼吸回来，人醒了，他解下面纱，扔回河中带咸味的水流。浪把它送到伊诺手里，她接住了。他离开河道，躺进芦苇间，吻了一下这片慷慨的土地。
        - id: ch05-b06
          speaker: odysseus
          text: |-
            唉，往后还会如何，怎样才算到头？夜里若一直待在河床旁，我这么累，冷气、湿气也许就把命夺了。天快亮时，河上还有刺骨的风。要是去山坡上找树林，钻进灌木睡觉，可以少受寒，歇个好觉，却又怕野兽趁我没力气，把我吃了。
        - id: ch05-b07
          speaker: narrator
          text: |-
            最后，他还是选了林子。在离水不远的高地，他找到树林，钻进两枝橄榄树下面。这两枝同根而生，一枝嫁接过，另一枝没有。枝叶互相缠绕得紧，烈风透不进，阳光照不到，雨也打不来。他在下头铺床，四周落叶很厚，冬天也够盖住两三个人。看见这些，他高兴极了，躺下来，把叶子往身上、四周堆。

            独自住在乡间的人，离所有邻居都很远。他会把仍带着火的木头埋入灰中，留下火的种子，省得以后要生火，又得去别处求取。奥德修斯把自己藏在叶子下面，正像那人把火种藏好一样。雅典娜让甜美的睡意罩住双眼，合上他的眼皮，让他忘掉了所有苦恼。
