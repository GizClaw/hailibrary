audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    calypso:
      display_name: 卡吕普索
      tts: {delivery: 自信而富于感情, timbre: 丰润柔和, pace: 稳健, pitch: 中音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    ino:
      display_name: 伊诺
      tts: {delivery: 怜惜而务实, timbre: 轻盈清晰, pace: 稳定, pitch: 中高音}
  chapters:
    - id: ch01
      title: 他没有马上答应
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            雅典娜又替奥德修斯向诸神求助，还说有人想杀他的儿子。宙斯叫她保护青年，再派赫尔墨斯到卡吕普索那里传令，必须放人。奥德修斯要坐木筏过海，到费埃克斯人的国土，由他们送回家。
            使者在洞外看了一会儿。那里有藤蔓，有栖着鸟的树林，卡吕普索烧着香木，唱着歌织布。她款待了使者，听完命令，却气得发抖。她说，是宙斯劈毁了船，淹死了同伴，是她救下奥德修斯，还愿让他不老。可是神容不下女神和凡人相爱。黎明女神爱的俄里翁，被阿耳忒弥斯杀了。得墨忒耳爱的伊阿西翁，被宙斯用雷电杀了。
            她没法抗命，只能答应诚心指点，自己却没有船和水手。赫尔墨斯警告，不听话就会受宙斯处罚，说完才走。
            女神去岸边找奥德修斯。白天，他在岩石上哭着想家。夜里，他被迫回洞里跟她同床，并不是自己愿意。
        - id: ch01-b02
          speaker: calypso
          text: |
            去造个木筏吧。我替你装上吃的、酒和水，给你衣服，再送一阵风，助你出海。
        - id: ch01-b03
          speaker: odysseus
          text: |
            就靠木头拼的筏子？要我过那么远的海，你得先保证，没有打算害我。
        - id: ch01-b04
          speaker: narrator
          text: |
            这个主意让他发抖。女神笑着摸了摸他，又向天地和斯堤克斯河发誓，自己不想害他。换作自己，也会这么做。
            回到洞里，两人各吃各的，一个用凡人的食物，一个用神食。饭后，女神又劝他留下。前路苦难很多，跟她在一起，却能永远年轻。佩涅洛佩是凡人，怎能和她相比？
        - id: ch01-b05
          speaker: odysseus
          text: |
            我明白，她没你高，也没你美。她是凡人，你是神。可我还是想回家。别的神要让我受苦，我就再受一次。
        - id: ch01-b06
          speaker: narrator
          text: |
            当晚，两人还是一起进洞里睡下。第二天，女神给他斧子，领他去看造筏子的树。
            他砍倒二十棵，削好木料，连成宽筏。女神又拿来钻具和帆布。他铺甲板，装桅杆、长桨，围上挡浪的边栏，再用杠杆把木筏弄下水。
            干了四天，第五天可以走了。女神替他洗浴，给他换新衣服，备齐食物和水，再送来好风。木筏向外行，岛屿渐渐远了。
    - id: ch02
      title: 木筏散开的时候
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            入夜，他按女神说的观察星星，把大熊星座留在左边，用桨掌着方向。十七天后，到第十八天，他看到了远山，费埃克斯人的陆地快到了。
            刚回来的波塞冬也发现了他。自己不在时，其他神竟把人放出来了。海神挥起三叉戟，搅动海水，召来四面的风，不许他轻松上岸。
            黑云遮住天地，海上暗了下来。奥德修斯想起卡吕普索的警告。要是在特洛伊战死，还有人安葬他，传颂他的名声。如今，却要凄惨地死在海里了。
            一个大浪把他卷下木筏。桅杆断了，帆和横杆落水。衣服妨碍他游动，他好容易才冒出头，吐掉海水，找到木筏，又游过去爬上来。但这时，木筏已经无法操纵。
            浪里升起一位女神，叫伊诺。她以前也是凡人，如今见他困在这里，便交给他一条面纱。
        - id: ch02-b02
          speaker: ino
          text: |
            你得弃筏游过去。脱掉衣服，把这条纱围在胸口，它会保护你。到岸以后，一定把它扔回海中。
        - id: ch02-b03
          speaker: narrator
          text: |
            她说完又潜了下去。奥德修斯握着面纱，没急着动。岸还那么远，脚下的筏子至少能浮。他怕神又在骗他，便决定，木头还能连着，就留在上面。等它真的破了，再游。
            大浪立刻压下来，木筏碎散了。他跨到一块板上，脱去女神给的衣服，从腋下系住面纱，这才下水。
            波塞冬看着他，过了一阵便走了。雅典娜让那些风停息，只留下北风，慢慢平静海面，帮助他到岸。奥德修斯在水中度过两夜两天。第三天早上，风静了。他被浪托高，看见陆地上的树，就朝那边游去。
    - id: ch03
      title: 河口之后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            游得近了，他听见巨大的浪声。前面没有沙滩，只有光滑的陡壁。贴近了会被撞伤，游远了可能回不了岸，水底又不知有什么。他还没决定，一股浪已把他推到石头跟前。
            雅典娜提醒他抓紧。他两手攀住岩石，忍痛等水退，却又被回卷的浪扯走，手掌磨破，还被拖进水里。
            再上来时，他换了办法。女神让他保持清醒，他游出碎浪拍打的地方，顺着海岸找能上去的地方。终于，他看见了河口，那里没有峭壁，也避风，只是水正往外流。他不知河神叫什么，也顾不得，向它求救。
        - id: ch03-b02
          speaker: odysseus
          text: |
            请让我上去吧。我刚从海神那里逃出来，已经游不动了。
        - id: ch03-b03
          speaker: narrator
          text: |
            河神把水流放缓。他进了河口，碰到浅水，双腿就软了，整个人倒下去。身体肿胀，鼻子嘴里都是海水，想说话也说不了。过了很久，才喘过气。
            他没有忘记伊诺的面纱，解下来投进河里，水又送回女神手中。他爬到芦苇边，亲吻脚下的土地。
            还得熬过今晚。河边又潮又冷，他担心睡下就起不来。林中倒能避寒，却可能有野兽。想了想，他还是往树林挪去。
            两丛橄榄枝长在一起，底下厚厚的落叶，能挡住风雨。他钻进去，铺好树叶，盖住光着的身体。就像把火种埋进灰里，留下那一点生机。

            雅典娜让他合上眼睛，睡了过去，暂时忘了苦难。
