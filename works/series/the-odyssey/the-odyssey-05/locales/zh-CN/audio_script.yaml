audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    calypso:
      display_name: 卡吕普索
      tts: {delivery: 自信而富于感情, timbre: 丰润柔和, pace: 稳健, pitch: 中音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    ino:
      display_name: 伊诺
      tts: {delivery: 怜惜而务实, timbre: 轻盈清晰, pace: 稳定, pitch: 中高音}
  chapters:
    - id: ch01
      title: 女神不能留下他了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            雅典娜又替奥德修斯向众神求助。他被留在卡吕普索的岛上，想家，想走，却既没有船，也没有能送他的水手。如今，儿子出门寻找父亲，连儿子也遭到求婚人的算计。

            宙斯叫她保护青年，再派赫尔墨斯去命令卡吕普索放人。奥德修斯得坐木筏过海，吃尽苦头，才能到费埃克斯人的地方，再由他们送回故乡。

            使者飞越大海，停在洞前。树林有鸟，藤上有葡萄，泉水穿过花草，洞里烧着香木。女神边织布边唱。奥德修斯却在岸边哭。女神请使者坐，给他神食和酒。一听命令，就气得发抖。
        - id: ch01-b02
          speaker: calypso
          text: |
            你们就是不许女神爱凡人！俄里翁同黎明女神相爱，让阿耳忒弥斯杀了。得墨忒耳爱伊阿西翁，宙斯又用雷劈死他。现在轮到我。宙斯毁了船，淹死伙伴，是我救下奥德修斯，我还愿意让他永远不老。你们偏要把他带走！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: |
            女神再生气，也不敢违抗宙斯，便答应诚心告诉他怎样回家，只是自己拿不出船和水手。赫尔墨斯在离开前还警告她，不照命令办，宙斯一定会处罚。
            她来到岸边。奥德修斯白天总在岩石上望海流泪。每到夜晚，他又得回洞里与她同床。他早不情愿了，可女神仍要留着他，不许他走。
        - id: ch01-b04
          speaker: calypso
          text: |
            别再哭了。你能走了，去砍树造个大筏子吧。粮食、酒、水、衣服，我都给你，还送一阵好风。
        - id: ch01-b05
          speaker: narrator
          text: |
            听到这个办法，他反而发抖。
        - id: ch01-b06
          speaker: odysseus
          text: |
            靠筏子渡这么大的海？好船都不一定受得住。你先起誓，不是想害我。你不发誓，我不会走。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: |
            女神笑着摸他，向天地和斯堤克斯河发誓，自己没有坏心。换作她，也会用这办法。回到洞里，奥德修斯吃凡人的食物，卡吕普索吃神食。饭后她还要劝。
        - id: ch01-b08
          speaker: calypso
          text: |
            前头的苦，你要是全知道，肯定愿意跟我过下去，让我使你永生。你天天念着的妻子，比我还美吗？
        - id: ch01-b09
          speaker: odysseus
          text: |
            请别生气。她确实比你矮，长得也没有你美。她是凡人，你却永远不会老。可我想的还是回家。真有神再把我打进海里，我也能撑住。陆上、海上的苦，这些年已经吃够了，多受一回，我也承受得住。
        - id: ch01-b10
          speaker: narrator
          text: |
            夜里，两人仍一起进洞睡下。
    - id: ch02
      title: 木筏上的十八天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            第二天，女神拿斧子给他，又带路，去找适合造筏的树。他砍下二十棵，削平、整理木料，用卡吕普索送来的钻具，把它们连在一起。接着铺甲板，立桅杆，装上用来掌握方向的长桨，再沿四边围好挡浪的栏。女神拿来帆布，他做好帆，最后用杠杆把整只木筏推下水。

            四天做完，第五天出发。女神给他洗浴更衣，备齐粮酒和水，又送顺风。他升帆离岛，照她的话看星星，让大熊留在左侧，守着长桨不睡。这样过了十七天。第十八天，山影从海平线上低低浮起，像一面盾牌，费埃克斯人的岸快到了。
            波塞冬刚从远方赴宴归来，也看见了。他发现其他神趁他不在，竟让奥德修斯靠近这片陆地，便举起三叉戟搅海，召来四面的狂风。乌云一下压过来，天上、海上都黑了。奥德修斯想起卡吕普索的预告，后悔没有战死在特洛伊。那样至少有人替他安葬，传颂他的名字，如今却要凄惨地葬身海底。
            巨浪把他卷下去，桅杆断了，帆和横杆落水。衣服沉重，裹得他浮不起来。他勉强冒出头，吐了水，又找到木筏，游回去爬上。
            木筏已经不听指挥，在乱风里不停翻转。伊诺看他可怜，便从海浪中升起，坐到木筏上。她从前也是凡人，后来才成了海上的女神。
        - id: ch02-b02
          speaker: ino
          text: |
            衣服脱掉，别再守着木筏，游向那边的陆地吧。这条面纱你系在胸前，靠它护着你。等上了岸，就把它还到海里。
        - id: ch02-b03
          speaker: narrator
          text: |
            伊诺交给他面纱，就又潜回水下。奥德修斯怕这也是神的骗局。岸还远，不能轻易扔掉木筏。只要没散，就留着，散了再游。
            波塞冬又卷来一道巨浪，把木筏砸碎。他跨上一块木板，脱下卡吕普索给的衣服，从腋下系牢面纱，这才跳进海里。海神看他这样受苦，才驾车离开。雅典娜压住其他的风，只留下北风，慢慢平息海浪，帮他靠近岸边。
    - id: ch03
      title: 河边与落叶下
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            两天两夜，他都在水里。第三天早上，风停了。浪把他托高，他看见岸上的树，便使劲游。越近，越听见拍岸的巨响。那儿没有沙滩，光滑的陡岩没处踩脚。

            贴近石壁会撞死，往外游又可能被推回大海，水下还有怪物也说不定。他还没决定，一股浪已经把他抛向岩石。雅典娜提醒了他，他赶紧双手攀住，等浪退去。可回卷的浪又把他扯下来，手掌的皮也剥破了，人又被拖进水里。
            女神让他还能想清楚该怎么办。他避开碎浪，沿岸找地方，最后看到河口。没有石头，也避风，可水流向外。他连河神的名字都不知道，就开口求救。
        - id: ch03-b02
          speaker: odysseus
          text: |
            求你收留我。我正在逃避波塞冬的怒火，实在撑不下去了。我是个无处可去的人，请你怜惜。
        - id: ch03-b03
          speaker: narrator
          text: |
            河神放缓水流，平息了河口的浪，让他进入河口，抵达岸边。他双腿一软，倒在浅水里。全身肿胀，口鼻灌满海水，想说话说不出，连气也喘不上来。好不容易缓过气，他才解下面纱，投进河里，水又把它送回伊诺手中。他爬出河口，在芦苇旁吻了吻土地。
            还得找地方过夜。河边潮冷，可能要命。树林里，又怕被野兽吃掉。他还是上山，在两丛交错的橄榄枝下找到了落叶。风雨透不进来。他拿叶子铺床盖身，像独居的人把火种埋在灰中，留着以后用。

            雅典娜合上他的眼睛。他睡沉了，暂时忘掉了这一路的苦。
