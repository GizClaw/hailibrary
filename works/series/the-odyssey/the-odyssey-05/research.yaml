  - "Retained: Athena's concern for father and endangered son; Zeus's protection instruction and Hermes's release message; beautiful island and grieving captive; Calypso's anger at unequal treatment of goddess lovers, Orion killed by Artemis and Iasion by Zeus; Zeus's prior ship destruction, rescue and offered immortality; Hermes's punishment warning; explicit nightly coerced sex; raft proposal, fear of a trap and Styx oath; beauty/mortality comparison, choice of home despite danger and going to bed together that night; twenty trees, four days' work and fifth-day departure; Bear kept left, seventeen days and land on eighteenth; Poseidon's storm, broken mast and clothes dragging him down; Ino's veil and initial distrust; raft breakup, stripping, two nights/days afloat, Athena's wind help; rock impact and torn palms; river prayer, god calming current, collapse, returned veil; cold versus animal danger, olive shelter and sleep."
  - "Compressed: divine titles and messenger itinerary, botanical species, full star catalogue, detailed fastenings and tool construction, Poseidon's spoken taunt, repeated self-address and the extended recovered-father comparison. The final spark-under-ashes image remains."
  - "Claim inventory: provenance is supported above. Immortality, magical wind control, protective veil, river god and extraordinary survival are declared myth, not medical or navigation advice. Calypso's claim to kindness does not remove her coercion. Her no-harm oath and Poseidon's later attack remain different agents. Ordinary construction precedes launch, stripping precedes swimming, veil return follows landing, injuries persist through shelter."
  - "Removed invented joint-testing, creaking-raft observations and final sea-listening actions. Source scenes are chronological in both locales. Scripts are independently spoken from their own final prose. No media changes."
