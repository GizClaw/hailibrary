  - "Chinese rework after f60bc6c: complete native zh-CN reading prose and an independently told Chinese script replace the previous Chinese wording. English files/en-US metadata and media remain byte-identical. Homer / 荷马 and homer remain public author/Writer, with the task-specific classic exception and existing compression boundary retained. Final Chinese counts and examples are recorded in audit.md."
