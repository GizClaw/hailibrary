premise: "Released from Calypso's island, Odysseus chooses a mortal home over an endless life and builds his own raft. Poseidon's storm strips it away, leaving him to accept divine help while finding a way to survive the shore."
characters:
  - {id: odysseus, description: "The captive traveler whose wish for home survives loss, suspicion and exhaustion."}
  - {id: calypso, description: "The goddess who has kept Odysseus on her island and must now help him leave."}
  - {id: hermes, description: "Zeus's messenger, carrying the command that ends the captivity."}
  - {id: zeus, description: "The ruler of the gods who assigns the next stage of the homecoming."}
  - {id: athena, description: "The goddess advocating for father and son and later easing the survivor's ordeal."}
  - {id: poseidon, description: "The sea god who sees the escape and raises the destructive storm."}
  - {id: ino, description: "The sea goddess who gives a protective veil and requires its return."}
