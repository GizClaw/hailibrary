  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XXIV"
    claims:
      - "Hermes leads the suitors' souls to Hades. Agamemnon recounts Achilles's funeral, seventeen days of mourning, eighteenth-day burning, bones with Patroclus and separate Antilochus, mound and Thetis's funeral games."
      - "Amphimedon describes the suitors' end and blames a Penelope/Odysseus trap; this is his account, not the narrator's correction of the earlier books."
      - "Odysseus tests Laertes with a false hosting story that includes four enslaved women as gifts. The father pours dust over his head before the son reveals himself. The scar and thirteen pears, ten apples, forty figs, and promised fifty vine rows provide proof."
      - "Laertes remembers taking Nericum; Dolius and his six sons return, fetched by their mother, and learn Penelope already knows."
      - "The dead are returned to their families; Eupeithes demands revenge, while Medon reports divine help and Halitherses recalls ignored warnings. More than half withdraw from the assembly."
      - "Zeus proposes continued kingship and divinely caused forgetting. Laertes kills Eupeithes, father and son attack, Athena orders a halt, Odysseus pursues the fugitives until Zeus's thunderbolt and her warning stop him, and Athena imposes an oath."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute"
    claims:
      - "The Odyssey is a twenty-four-book Greek epic traditionally attributed to Homer."
notes:
  - "2026-10-11: independently phrased HaiLibrary reading prose as explicitly requested by the user, retaining classic and Homer / 荷马. Complete Book XXIV was compared with the Butler source saved at git commit 1208d108; no unabridged or verbatim-import claim is made."
  - "Condensed boundaries: the underworld route's individual landmarks, minor hero epithets, funeral-offering and armor catalogues, the false host's gift inventory beyond consequential gold/cloth/enslaved people, and repeated speeches. Funeral actions, parental testing, enslavement in the invented tale, precise fruit-tree counts, deaths, pursuit and imposed peace remain."
  - "Claim classification: Hermes's route, divine rejuvenation and memory alteration are declared myth. Amphimedon's allegation, Agamemnon's condemnation of all women, and Eupeithes's blame are attributed character viewpoints; none becomes an objective modern statement. The hosting story is explicitly invented."
  - "Knowledge continuity: the souls do not know their families are already learning the news in the living world. Penelope knows the return before Dolius asks. The oar prophecy remains unfulfilled offstage; no new quest or completed peaceful old age is attached to the ending."
  - "The final cessation follows divine coercion, not an added human decision that revenge is morally wrong. Zeus sends the fiery bolt; Athena warns and binds the parties. Odysseus gladly obeys after pursuing despite the first halt."
  - "No front matter, footnote, reference numeral, translator commentary, modern copyrighted translation or screen adaptation is used as the reading prose. Media bytes are unchanged."
