audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "以平实口吻从容讲述古老史诗", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    achilles:
      display_name: 阿喀琉斯
      tts: {delivery: "直率而沉思", timbre: "饱满有共鸣", pace: "稳健", pitch: "中低音"}
    agamemnon:
      display_name: 阿伽门农
      tts: {delivery: "有统帅的威严，也有深重的悲伤", timbre: "浑厚略粗粝", pace: "沉稳", pitch: "低音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "深思后开口，坚定而含着温情", timbre: "略带风霜的厚实声音", pace: "沉着", pitch: "中低音"}
    laertes:
      display_name: 拉厄尔忒斯
      tts: {delivery: "由疲倦悲伤渐渐转为亲切有力", timbre: "苍老略哑", pace: "较慢而清楚", pitch: "低音"}
    dolius:
      display_name: 多利奥斯
      tts: {delivery: "朴实亲切", timbre: "苍老粗厚", pace: "适中", pitch: "中低音"}
    eupeithes:
      display_name: 欧佩忒斯
      tts: {delivery: "悲痛而执拗", timbre: "粗粝饱满", pace: "有力清楚", pitch: "低音"}
    halitherses:
      display_name: 哈利忒尔塞斯
      tts: {delivery: "坦率审慎", timbre: "苍老干涩", pace: "从容", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定直接", timbre: "清亮而有穿透力", pace: "稳健", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，态度鲜明", timbre: "清亮有力", pace: "适中", pitch: "中音"}
  chapters:
    - id: ch01
      title: 亡魂带来的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            赫尔墨斯拿着金杖，引求婚人的亡魂走。他们叫得又细又尖，像一群蝙蝠。越过俄刻阿诺斯，再穿过梦的国度，就到了日光兰原野，英雄的亡魂都在那里。
            阿喀琉斯同阿伽门农正在说话。昔日指挥大军的国王，身旁站着和他一起在归家宴席上遇害的人。
        - id: ch01-b02
          speaker: achilles
          text: |
            要是你倒在特洛伊，我们会给你造一座坟。你儿子也能继承你留下的名声。
        - id: ch01-b03
          speaker: narrator
          text: |
            阿伽门农回想阿喀琉斯的葬礼。众人为了抢回遗体，打了整整一天，直到风暴来才停。遗体送到船边，洗干净，母亲忒提斯和海里的仙女也赶来。哭声传过海面，士兵怕得要逃，涅斯托尔说明是母亲来哭儿子，他们才安稳。缪斯唱挽歌，神和人哀悼十七天。第十八天，才把他放上火堆，献牲畜，焚烧蜂蜜、树脂，战士绕着火走。后来，阿喀琉斯的骨头跟帕特罗克洛斯合放在母亲带来的金器中，安提洛科斯的则分开放。海边的高坟，坐船从远处经过也看得见。忒提斯还送来厚奖，举行悼念儿子的比赛。
        - id: ch01-b04
          speaker: agamemnon
          text: |
            你的名字还在人间。我从战场活着回去，却死在埃癸斯托斯和妻子手里。
        - id: ch01-b05
          speaker: narrator
          text: |
            他认出安菲墨冬。当年和墨涅拉奥斯劝奥德修斯出征，花了一个月，这人曾款待他们。
        - id: ch01-b06
          speaker: agamemnon
          text: |
            怎么一下来了这么多人？你们遭遇了什么？
        - id: ch01-b07
          speaker: narrator
          text: |
            安菲墨冬说，王后三年白天织、夜里拆，到第四年女仆告密，只好织完。他怪她设圈套，又说父子在猪棚见面，先后进城，把武器藏了，是丈夫让她办试弓。那个受骂挨打的乞丐拉开弓，射穿斧孔，先杀安提诺奥斯，再射他们。有神在帮助父子。他说尸体还在屋里，家人不知道，没人替他们洗掉血，哭着安葬。
            阿伽门农又想到自己没能得到的团聚。
        - id: ch01-b08
          speaker: agamemnon
          text: |
            佩涅洛佩忠于丈夫，后人会歌唱她。我的妻子杀害我，歌里只有可憎，还使所有女人，连好女人都蒙羞。
    - id: ch02
      title: 父亲记得的树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            亡魂谈着这些，奥德修斯到了父亲的庄园。他把铠甲交给牧人，让他们陪儿子先进屋做饭。自己去果园，想试试父亲还认不认得他。
            工人们在别处砍荆棘作篱笆。拉厄尔忒斯一个人锄地，低着腰，穿一身补丁衣服。胳膊和小腿包着皮革，免得刺伤，头上是旧羊皮帽。他把花木照顾得好，自己却憔悴不堪，儿子几乎不忍看。
            奥德修斯在梨树下落泪。走过去叫一声父亲，就能结束这二十年的等待，可他偏要先藏住身份。
        - id: ch02-b02
          speaker: odysseus
          text: |
            你把树照顾得真好，怎么自己不管了？这里是伊萨卡吗？我曾款待拉厄尔忒斯的儿子，送他金、银杯、衣料，还让他挑了四名女奴。
        - id: ch02-b03
          speaker: narrator
          text: |
            拉厄尔忒斯哭了。
        - id: ch02-b04
          speaker: laertes
          text: |
            那就是我儿子。他要还在，一定好好报答你。可人死在哪里都不知道，我和他母亲没替他裹上尸衣，妻子也没能给他合眼。你见到他，有多久了？
        - id: ch02-b05
          speaker: narrator
          text: |
            他又自称阿吕巴斯的厄佩里托斯，阿斐达斯的儿子，说客人走了五年，临别鸟飞右侧，两人都盼再见。名字和故事都是假的。
            老父亲抓起土，撒在灰白的头发上，哀叫起来。奥德修斯再试探不下去，跑过去抱他，吻他。
        - id: ch02-b06
          speaker: odysseus
          text: |
            父亲，我在这儿！二十年了，我终于回来了。求婚人已经被我杀死。
        - id: ch02-b07
          speaker: laertes
          text: |
            是我儿子，就让我看个明白。拿出凭据来。
        - id: ch02-b08
          speaker: narrator
          text: |
            奥德修斯把腿上的疤指给他看。去外祖父那回，野猪留下了这道伤。他再指着树，说起小时候的事。
        - id: ch02-b09
          speaker: odysseus
          text: |
            我跟你走在园里，什么都问，你教我树叫什么，给我十三棵梨，十棵苹果，四十棵无花果，还答应给我五十行葡萄，行间种粮，葡萄好多种。都是你带我认的。
        - id: ch02-b10
          speaker: narrator
          text: |
            父亲听完，膝盖软下去，张开手臂紧抱儿子。奥德修斯撑着，等他慢慢回过神，能重新站好。拉厄尔忒斯先谢宙斯，又想，死者有父亲、有兄弟，城里人一定会追来。
            奥德修斯让他先回屋，孙儿和牧人都在那里等。
    - id: ch03
      title: 来客与追兵
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            老妇人洗净拉厄尔忒斯，给他好披风，雅典娜使他高大强壮。老人想，当年攻下涅里科斯的本领若还在，昨天就能替儿子杀好多求婚人。
            老妇人又是多利奥斯六个儿子的母亲，去把他们从干活的地方叫来。他们见主人愣了。他招呼吃饭，多利奥斯握手亲腕，说几乎不敢盼这一天。
        - id: ch03-b02
          speaker: dolius
          text: |
            夫人听说了吗？需要找人送个信吗？
        - id: ch03-b03
          speaker: odysseus
          text: |
            她已经听说了。
        - id: ch03-b04
          speaker: narrator
          text: |
            多利奥斯的六个儿子，也一个接一个走到归人面前相迎。招呼过后，他们才各自坐下，家里人终于围在一起。
            城里早闹起来了。家属从王宫领走死者。本地人安葬自己家里的，别的岛上来的，就用渔船送回去。大家到会场商议，欧佩忒斯流着泪站起，他是安提诺奥斯的父亲。
        - id: ch03-b05
          speaker: eupeithes
          text: |
            他丢了我们的壮士和船，又回来杀儿子们，再让他跑掉，永远没脸见人。不报仇，我宁愿死。别让他到大陆，快追！
        - id: ch03-b06
          speaker: narrator
          text: |
            墨冬和歌者来了，大家惊讶他们活着。墨冬说，神化作门托尔，鼓励奥德修斯，亲自攻击求婚人，杀人的事没有违背天意。大家怕了，先知哈利忒尔塞斯接着说。
        - id: ch03-b07
          speaker: halitherses
          text: |
            早就叫你们管教儿子了，你们肯听吗？看着他们糟蹋人家的财物，羞辱人家的妻子，都不阻止。再去动手，还要给自己招祸。
        - id: ch03-b08
          speaker: narrator
          text: |
            一多半的人散去了。留下的还拥护欧佩忒斯，拿了武器，要到庄园报仇。
            雅典娜向宙斯问，要不要让他们再打下去。宙斯认为复仇已经够了，奥德修斯应继续当王，双方要发誓讲和。神会让亲属忘记这场流血，让大家再一起生活。雅典娜听了，就下到伊萨卡。
    - id: ch04
      title: 雷电之后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            庄园里吃完饭，奥德修斯派人查看。多利奥斯的一个儿子到门边，看见持械的人已经很近，便喊大家快披甲。
            奥德修斯、忒勒马科斯、欧迈奥斯、菲洛伊提奥斯，赶紧各自披甲。多利奥斯的六个儿子也拿好兵器，连多利奥斯和拉厄尔忒斯这两个白发老人，也不得不再做战士。院门一开，由奥德修斯领头出去。雅典娜这时来到他们身边，变的是门托尔的面貌和声音。奥德修斯便向儿子交代。
        - id: ch04-b02
          speaker: odysseus
          text: |
            今天可要拿出勇气，别让祖先蒙羞。
        - id: ch04-b03
          speaker: telemachus
          text: |
            父亲，你看着我就是。
        - id: ch04-b04
          speaker: narrator
          text: |
            拉厄尔忒斯听得欢喜。儿子和孙子都在跟前，都要奋勇争先。雅典娜到他身旁，把力量给了他，让他求雅典娜和宙斯保佑，然后把矛掷出去。
            老人祷告投矛，刺透欧佩忒斯的头盔。他死了，铠甲摔得响。父子冲向前排，女神若不喊停，便会让他们全死，谁也回不了家。
        - id: ch04-b05
          speaker: athena
          text: |
            伊萨卡人，够了！都住手，不许再流血！
        - id: ch04-b06
          speaker: narrator
          text: |
            来攻的人吓掉武器，逃回城。奥德修斯大喊着追，宙斯忽然投下火焰雷霆，落在雅典娜面前。
        - id: ch04-b07
          speaker: athena
          text: |
            奥德修斯，停下吧。别惹宙斯生气。
        - id: ch04-b08
          speaker: narrator
          text: |
            听见女神叫停，奥德修斯高兴地照办了，停在原处，不再向逃走的人追去。
            雅典娜还是门托尔的模样，用门托尔的声音，让双方立誓讲和。
