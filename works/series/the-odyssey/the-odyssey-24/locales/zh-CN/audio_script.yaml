audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "以平实口吻从容讲述古老史诗", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    achilles:
      display_name: 阿喀琉斯
      tts: {delivery: "直率而沉思", timbre: "饱满有共鸣", pace: "稳健", pitch: "中低音"}
    agamemnon:
      display_name: 阿伽门农
      tts: {delivery: "有统帅的威严，也有深重的悲伤", timbre: "浑厚略粗粝", pace: "沉稳", pitch: "低音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "深思后开口，坚定而含着温情", timbre: "略带风霜的厚实声音", pace: "沉着", pitch: "中低音"}
    laertes:
      display_name: 拉厄尔忒斯
      tts: {delivery: "由疲倦悲伤渐渐转为亲切有力", timbre: "苍老略哑", pace: "较慢而清楚", pitch: "低音"}
    dolius:
      display_name: 多利奥斯
      tts: {delivery: "朴实亲切", timbre: "苍老粗厚", pace: "适中", pitch: "中低音"}
    eupeithes:
      display_name: 欧佩忒斯
      tts: {delivery: "悲痛而执拗", timbre: "粗粝饱满", pace: "有力清楚", pitch: "低音"}
    halitherses:
      display_name: 哈利忒尔塞斯
      tts: {delivery: "坦率审慎", timbre: "苍老干涩", pace: "从容", pitch: "中低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定直接", timbre: "清亮而有穿透力", pace: "稳健", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，态度鲜明", timbre: "清亮有力", pace: "适中", pitch: "中音"}
    amphimedon:
      display_name: 安菲墨冬
      tts: {delivery: "辩解而执着", timbre: "年轻清晰", pace: "有起伏", pitch: "中音"}
    medon:
      display_name: 墨冬
      tts: {delivery: "认真而肯定", timbre: "清楚质朴", pace: "平稳", pitch: "中音"}
    zeus:
      display_name: 宙斯
      tts: {delivery: "从容而有权威", timbre: "深厚", pace: "沉稳", pitch: "低音"}
  chapters:
    - id: ch01
      title: "亡魂说起归乡"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            赫尔墨斯举着金杖，领走求婚人的亡魂。他们一路细细地叫着，像山洞里的蝙蝠。他们越过俄刻阿诺斯，穿过梦的国度，来到日光兰原野。英雄们的亡魂都聚在这里。

            阿喀琉斯正在跟阿伽门农说话。阿伽门农从前统率大军，如今站在身边的，是那些回家以后跟他一起被杀的人。
        - id: ch01-b02
          speaker: achilles
          text: "你要是在特洛伊死去，我们会替你造坟，儿子也能接过你留下的荣耀。谁能想到，最后会是这样的结局。"
        - id: ch01-b03
          speaker: agamemnon
          text: >-
            你的命运跟我不一样。为抢回你的遗体，我们足足打了一天，直到风暴来了，才不得不停手。我们把你送到船边，洗好身子，你母亲忒提斯和海仙女就来了。哭声吓得士兵想逃，涅斯托尔说清来的是谁，大家才放下心。

            缪斯唱起挽歌，神和人哭了十七天，到第十八天才烧遗体。我们献上牲畜，烧蜂蜜和树脂，战士们围着火堆走。你的骨头跟帕特罗克洛斯的放在一起，装进母亲带来的金器里，安提洛科斯的另外放。大墓修在海边，远远经过的船都能看见。你母亲还拿来奖品，让大家比赛。你死了，名声还留着。我却活着回家，让妻子和埃癸斯托斯杀了。
        - id: ch01-b04
          speaker: narrator
          text: "求婚人到了，阿伽门农认出安菲墨冬。他当年跟墨涅拉奥斯来劝奥德修斯出征，停了一个月，便由这人款待。"
        - id: ch01-b05
          speaker: agamemnon
          text: "你们这一群人，怎么会一起来这里？"
        - id: ch01-b06
          speaker: amphimedon
          text: >-
            我们向她求婚，她白天织布，晚上又拆，骗了我们三年。到了第四年，女仆告密，我们才逼她织完。这是她设的圈套！奥德修斯跟儿子在猪棚见面，先后进城，藏起武器，又让妻子提出比试弓箭。那个被我们骂、被我们打的乞丐，竟拉开了弓，把箭射过斧孔，先杀安提诺奥斯，再来射我们。神也帮着父子。我们的身体到现在还在屋里，家人还不知道，没人来洗掉血，没人哀悼，也没人安葬。
        - id: ch01-b07
          speaker: narrator
          text: "阿伽门农却夸佩涅洛佩一直忠于丈夫，以后的人一定会为她唱歌。他又痛骂自己的妻子，说她杀了丈夫，留下的歌只会让人憎恨，还说连好女人也受她牵连，所有女人都跟着蒙羞。"
    - id: ch02
      title: "父亲抓起一把土"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            亡魂在地下说着话，奥德修斯和三个同伴已经来到父亲的庄园。他把铠甲交给两名牧人，让他们陪儿子先进屋准备饭，自己去果园，看看父亲还认不认得自己。

            其他人正在远处砍荆棘，准备做篱笆。拉厄尔忒斯一个人弯着腰锄地，穿着打了补丁的衣服，手臂和小腿上裹了皮革，好挡住刺，头上戴着旧羊皮帽。园子里的花木照料得很好，可老人自己已经憔悴得不成样子。

            儿子在梨树下哭了。本来可以立刻过去相认，可他还是决定先试探。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            你可真是用心照看这园子了。自己怎么倒弄成这样？请问，这儿是伊萨卡吗？我以前招待过一个人，他说自己是拉厄尔忒斯的儿子。临走，我送了金子、银杯和衣料，还让他选了四个女奴带走。
        - id: ch02-b03
          speaker: narrator
          text: "老父亲听得流泪。"
        - id: ch02-b04
          speaker: laertes
          text: >-
            那人就是我儿子。你要能在这儿见到他，他一定会回报你。可如今，他死在哪儿都不知道。我和他母亲没能替他办后事，妻子连他的眼睛也没能合上。你最后一回见他，是什么时候？
        - id: ch02-b05
          speaker: narrator
          text: >-
            奥德修斯继续撒谎，说自己叫厄佩里托斯，父亲是阿斐达斯，家在阿吕巴斯。那个客人已经走了五年，分别时，鸟从右边飞过，两人都盼着能再见。

            老人两手抓起泥土，往灰白的头发上撒，痛苦地呻吟起来。儿子终于瞒不下去了，扑过去抱住父亲，亲吻他。
        - id: ch02-b06
          speaker: odysseus
          text: "就是我，父亲！二十年终于走回家，求婚人全让我杀了。"
        - id: ch02-b07
          speaker: laertes
          text: "你真是我的儿子，就拿点能证明的东西给我看。"
        - id: ch02-b08
          speaker: narrator
          text: "他把腿上那道旧疤给父亲看，讲起到外祖父家时，被野猪伤了腿，又指向园里的树，说起小时候的事。"
        - id: ch02-b09
          speaker: odysseus
          text: >-
            小时候，我总跟在你后面，问这是什么树，那是什么树，是你一棵棵教我认的。你给过我十三棵梨树，十棵苹果树，四十棵无花果树，还答应给五十行葡萄。葡萄有许多种，行间还种粮食。咱们一起走过，都是你告诉我的。
        - id: ch02-b10
          speaker: narrator
          text: >-
            父亲站不住，伸出胳膊抱住儿子。儿子扶着他，等他缓过来。他向宙斯道谢，又担心城里的人追来，死者可都有家人。奥德修斯让他先回屋，饭正在准备。
    - id: ch03
      title: "家里与城里"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            照料老人的妇人替他洗澡，换上好披风，雅典娜也让他高大强壮。他想起自己当年攻下涅里科斯城堡的本领。昨天要是还有那份力气，一定能帮儿子杀死许多求婚人。

            老妇人又把多利奥斯和六个儿子叫回来，那六个都是她的孩子。他们看见主人在眼前，惊得说不出话。奥德修斯让大家吃饭，多利奥斯握住他的手，在手腕上亲了一下，说大家几乎已经不盼他回来了。
        - id: ch03-b02
          speaker: dolius
          text: "夫人知道你到家了吗？要不要派人去说一声？"
        - id: ch03-b03
          speaker: odysseus
          text: "她已经知道，不用去了。"
        - id: ch03-b04
          speaker: narrator
          text: >-
            六个儿子一个接一个问候，然后坐下。城里也传开了消息，家属到宫门前领回死者。本地人各自安葬亲人，外岛来的，用渔船送回故乡。人们随后到会场集合，安提诺奥斯的父亲欧佩忒斯含着泪站起来。
        - id: ch03-b05
          speaker: eupeithes
          text: >-
            奥德修斯带我们的壮士去打仗，人和船全丢了，如今回来，又杀我们的儿子。让他跑了，我们永远没脸见人。不报仇，我宁愿死。趁他还没到大陆，追上去！
        - id: ch03-b06
          speaker: narrator
          text: "传令官墨冬和歌者斐弥奥斯从宫里来了，大家没想到，他们竟然还活着。"
        - id: ch03-b07
          speaker: medon
          text: "我亲眼看见一位神变成门托尔的样子，一会儿鼓励奥德修斯，一会儿出手攻击求婚人。这些事，并没有违背天意。"
        - id: ch03-b08
          speaker: narrator
          text: "人群害怕了，老先知哈利忒尔塞斯也劝他们别去追杀。"
        - id: ch03-b09
          speaker: halitherses
          text: >-
            我和门托尔早劝过，得管住你们的儿子。他们花别人家的财物，欺辱人家的妻子，你们偏不听。现在还要去打，只会再给自己惹祸。
        - id: ch03-b10
          speaker: narrator
          text: "超过一半的人离开了会场，剩下的还是支持欧佩忒斯，拿好武器，跟他往庄园去。"
    - id: ch04
      title: "神要停战"
      blocks:
        - id: ch04-b01
          speaker: athena
          text: "宙斯，还要让他们这样打下去吗？"
        - id: ch04-b02
          speaker: zeus
          text: >-
            该讲和了。奥德修斯报过仇，可以继续当王。让两边立下誓言，我们让死者的家人忘掉这场杀戮，大家再像从前一样过日子。
        - id: ch04-b03
          speaker: narrator
          text: >-
            雅典娜也正盼着讲和，立即下到伊萨卡。庄园里的饭刚吃完，奥德修斯叫人出去看。多利奥斯的一个儿子站到门口，发现追兵已经快到了，赶紧喊大家穿上铠甲。

            父子和两名牧人拿起武器，多利奥斯与六个儿子也一样。拉厄尔忒斯也披上甲，两位白头发的老人，只得再次上阵。
    - id: ch05
      title: "雷霆落下来"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "门打开，奥德修斯领人出去。雅典娜用门托尔的模样出现，父亲便对儿子说。"
        - id: ch05-b02
          speaker: odysseus
          text: "今天别给祖辈丢脸，要拿出他们的勇气来。"
        - id: ch05-b03
          speaker: telemachus
          text: "你会看见的，我不让你失望。"
        - id: ch05-b04
          speaker: narrator
          text: >-
            祖父听得高兴，儿子和孙子都不肯示弱。女神走近老人，给他力气，让他先向雅典娜和宙斯祈祷，再把矛投出去。矛刺穿欧佩忒斯的头盔，他倒地死了，铠甲响了一阵。父子冲向敌阵前列，要不是女神叫停，追来的这些人就全会被杀，谁也回不了家。
        - id: ch05-b05
          speaker: athena
          text: "够了，伊萨卡人！别再流血，都住手！"
        - id: ch05-b06
          speaker: narrator
          text: "追来的人吓得丢下武器，往城里逃。奥德修斯却大喊着追赶。宙斯立刻投下火焰雷霆，落在雅典娜面前。"
        - id: ch05-b07
          speaker: athena
          text: "奥德修斯，停下，不许再杀。你再不停，宙斯就会动怒。"
        - id: ch05-b08
          speaker: narrator
          text: |-
            他乐意听命，不再追赶。

            雅典娜仍扮作门托尔，用他的声音，让两边都立下和平誓约。
