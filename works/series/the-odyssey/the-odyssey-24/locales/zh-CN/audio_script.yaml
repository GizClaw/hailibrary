  chapters:
    - id: ch01
      title: 冥府里的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            库勒涅的赫尔墨斯，把求婚人的亡魂召到一起。他手里拿着美丽的金杖。想让谁睡，就合上谁的眼睛，想让谁醒，也办得到。现在，他用金杖唤动亡魂，领着他们往前走。身后一路哀叫，夹杂着听不清的声音。

            洞里一大群蝙蝠挤在一处倒挂，要是一只掉了下来，其余的就会吱吱叫着乱飞。这些亡魂发出的，就是那种尖叫。抚慰悲伤的赫尔墨斯，带他们进入死者幽暗的住所，经过俄刻阿诺斯的水流、琉卡斯岩，又来到太阳之门和梦的国度。最后是一片日光兰草地。死去的人再也不能劳作，他们的魂和影子，都住在那里。

            他们遇见了珀琉斯的儿子阿喀琉斯，以及帕特罗克洛斯、安提洛科斯和埃阿斯。这些人里，除了阿喀琉斯，埃阿斯在达那奥斯人中最出色，也最英俊。亡魂围住阿喀琉斯，悲痛的阿伽门农也过来了。他周围跟着的，是在埃癸斯托斯家里和他一起遇害的人。阿喀琉斯先说话。
        - id: ch01-b02
          speaker: achilles
          text: >-
            阿特柔斯之子，从前我们都以为，宙斯对所有英雄中最偏爱的人，一直就是你。在特洛伊城外打仗时，你带领着那么多勇士。可死亡来得太早了，那只手，谁也躲不过。你要是在特洛伊战死，在声名最盛的时候死去，多好。阿开亚人会为你的骨灰堆起大坟，你儿子也能继承你的美名。偏偏你落得这么悲惨的结局。
        - id: ch01-b03
          speaker: agamemnon
          text: >-
            珀琉斯之子，你才有福气。你远离阿尔戈斯，死在特洛伊。双方最勇敢的人，为了争你的遗体，在你身边一个接一个倒下。尘土翻滚，你那么高大的身躯躺在里面，却再也不在乎自己多英勇了。我们打了一整天，要不是宙斯降下飓风叫我们停手，还不肯罢休。好不容易把你从战场送回船边，我们让你躺到床上，拿温水、香油替你洗身。达那奥斯人一边扯自己的头发，一边围着你痛哭。

            你母亲知道后，带不朽的宁芙从海里赶来。哀哭声传遍水面，把阿开亚人吓得发抖。他们都要逃回船上了，是涅斯托尔拦住大家。他老而有智慧，出主意最可靠。那时他这么说。
        - id: ch01-b04
          speaker: nestor
          text: >-
            阿尔戈斯人，站住！阿开亚人的儿子们，别跑。那是他的母亲，和不朽的宁芙一起来看儿子的遗体了。
        - id: ch01-b05
          speaker: agamemnon
          text: >-
            大家听明白，才不再怕。海中老人的女儿们围着你哭，把神的衣服穿在你身上。九位缪斯也到了，一声接一声，互相应答，唱起动听的挽歌。听着那歌，阿尔戈斯人哪个不悲伤，哪个不流泪？凡人和神一起悼念，足足十七天十七夜。第十八天，我们把你交给火。周围宰了许多肥羊和牛，都是祭你的。

            你穿着神的衣裳，在树脂和蜂蜜中焚烧。英雄们有的骑马，有的步行，绕着火堆撞响铠甲，踏步声像千军万马。天火烧完，黎明时我们拾出白骨，放在香油和纯酒里。你母亲送来一只金瓮，是狄俄尼索斯给她的，出自赫淮斯托斯的手。你和帕特罗克洛斯的骨头放到一起，他比你先走。安提洛科斯的骨头也收进来，另外放。自从帕特罗克洛斯不在，其余同伴里，你跟他最亲。

            我们在骨殖上修起大墓，位置就在伸向赫勒斯蓬托斯海面的岬角。如今的人也好，后世的人也好，在远海上就能望见。你母亲又向神求来奖品，让最高贵的阿开亚人来比试争取。大首领死后，青年束紧腰带，参加葬礼竞技，这样的场面，你一定见过许多。可银足忒提斯为你拿出的奖品，别处哪能见到？神确实爱你。阿喀琉斯，死也没夺去你的荣名，世世代代的人都会记着你。轮到我，仗打完了，又有什么安慰？我一到家，宙斯就要让我死，借的是埃癸斯托斯和我那个恶妻的手。
        - id: ch01-b06
          speaker: narrator
          text: >-
            正说着，赫尔墨斯带那些死在奥德修斯手里的求婚人过来。阿喀琉斯和阿伽门农十分吃惊，马上迎过去。阿伽门农认出了一个人，是墨拉纽斯的儿子安菲墨冬，住在伊萨卡，从前接待过他。
        - id: ch01-b07
          speaker: agamemnon
          text: >-
            安菲墨冬，你们这是怎么了？这么多好青年，年纪差不多，全到了地下。随便哪个城，都挑不出比你们更出色的人。是在海上，让波塞冬的风浪袭击了？还是去陆地抢牛抢羊，让敌人杀了？或者他们在保卫妻子、保卫城池？我在你家做过客，告诉我吧。那次我跟墨涅拉奥斯去，劝奥德修斯带船一起打特洛伊，你还记得吗？劝他可不容易，整整一个月，我们才又能上路。
        - id: ch01-b08
          speaker: amphimedon
          text: >-
            阿伽门农，阿特柔斯之子，我们的王，你说的我都记得。我们到底怎么死，我也全部告诉你。奥德修斯走了很久，我们向他妻子求婚。她从没明说不嫁，却又一直拖着，因为她想害死我们。她骗我们的办法，就是在房里支起一个大绷架，织一件又大又精细的东西。她当时这样跟我们说。
        - id: ch01-b09
          speaker: penelope
          text: >-
            各位亲爱的求婚人，奥德修斯已经死了，可别急着叫我再嫁。让我先给英雄拉厄尔忒斯织好殓布，等死亡来带他走时能用上。我这手针线，总不能白白埋没。他那么有钱，下葬时却没块殓布，本地女人会怎么说？请你们等一等。
        - id: ch01-b10
          speaker: amphimedon
          text: >-
            我们答应了。白天，她总在织，夜里又点起火把，把线拆掉。这样整整三年，我们都没察觉。过了一天又一天，月亮亏了又亏，到第四年，一个知情的女仆告诉了我们。我们抓住她正在拆布，逼她做完，不情愿也得做。织成的衣料洗好了，拿出来一看，像日头、月亮一样明亮。

            接着，不知哪个恶神，把奥德修斯送到高处的农庄，就是牧猪人那里。他儿子从皮洛斯乘船回来，也去了。父子俩商量好杀我们的办法，才进城。忒勒马科斯先来，他后到，由牧猪人带着。他穿着破衣，拄根木杖，跟一个穷苦的老乞丐没两样。我们谁会想到他突然回来？年长的也没认出。大家骂他，朝他扔东西。他在自己的家里，又挨打又受辱，却一句话不说，硬忍着。

            后来，拿神盾的宙斯给他打定了主意。他和忒勒马科斯，把武器藏到里间，门也闩上了。再设法让他妻子拿出弓和铁器，说让我们比试。我们这些倒霉人，从那时起就完了。那把弓，我们谁都上不了弦，离拉开差得远。眼看要传给他，所有人都叫，不能给他，说什么也不能给。可是忒勒马科斯偏要给。

            他拿在手里，轻轻松松就绷好了弦，一箭穿过铁器。再站到回廊的地上，把箭倒在脚边，凶狠地看着四周。先杀的是安提诺奥斯，然后他向正前方放箭，一支支都是要命的。人倒下去，一个压着一个。他们肯定有神帮忙，在回廊里到处冲杀。我们的脑袋被打碎，惨叫呻吟，血把地面都翻滚起来。阿伽门农，我们就是这么死的。尸体还扔在奥德修斯家里，没人管。亲友不知道消息，不能替我们停灵，不能洗去伤上的黑血，也没法照死者应得的礼数，哭悼我们。
        - id: ch01-b11
          speaker: agamemnon
          text: >-
            奥德修斯，拉厄尔忒斯之子，你真是有福！妻子那么聪慧，还对丈夫如此忠贞。伊卡里奥斯的女儿佩涅洛佩，她的美名永远不会消失。神会把这份忠贞编进歌里，人人爱听。廷达瑞奥斯的女儿可就相反，那恶女人杀了自己的丈夫。唱到她，人人都会厌恶。她使天下女人都蒙羞，连好女人也逃不开。
    - id: ch02
      title: 果园里的父亲
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            冥府深在地下，亡魂还在那里谈论。奥德修斯和伙伴们已经出了城，很快走到拉厄尔忒斯的农庄。田园整齐又美好，是老人费了无数心血开垦的。屋子周围搭了一圈棚，干活的奴仆在那里吃饭、歇息、睡觉。屋里住着西库尔老妇，负责在农庄照顾老人。奥德修斯对儿子和另外两个人说。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            你们进屋，挑最好的猪杀一头，做饭。我先去看看父亲。分开这么久，他会不会连我都认不出来了？
        - id: ch02-b03
          speaker: narrator
          text: >-
            奥德修斯脱了铠甲，交给欧迈奥斯和菲洛伊提奥斯。两人往房子走，他转进葡萄园，想试试父亲。大果园里，不见多利奥斯，也不见几个儿子和其余奴仆。他们正按老人的吩咐，到指定的地方采荆棘，要给葡萄园扎篱笆。只有父亲，独自在一株葡萄旁锄土。

            那衬衣脏而破，补过好多块。老人腿上缠牛皮，怕荆棘扎，手臂套着皮袖，头顶一顶羊皮帽，模样愁苦极了。奥德修斯在高高的梨树底下停住，望着父亲。他竟老了这么多，疲倦、悲伤，叫人看得落泪。奥德修斯想，马上过去抱抱他，亲亲他，告诉他自己回来了吗？还是先问点什么，听听他的回答？他最后选了后一个办法，决定先耍个小计，走到弯腰挖土的父亲跟前。
        - id: ch02-b04
          speaker: odysseus
          text: >-
            老人家，这园子种得真好，你花了多少心思啊。无花果、葡萄、橄榄、梨树，花圃也一样，每一处都打理过。不过，我说句话，你别介意。你管园子这么用心，对自己怎么这么差？年纪大了，衣服破成这样，身上的气味也不好。主人总不会因为你偷懒，才这样对待你吧？我看你的脸，还有身材，根本不像奴仆，倒像出身高贵的人。你这样的老人，本该洗得清清爽爽，吃好饭，晚上舒舒服服躺下。

            你老实告诉我，这是谁的园子，你是谁家的奴仆？我还有一件事想问，我真到伊萨卡了吗？刚才遇见的人这么说，可他糊涂，又没耐心。我想打听一个老朋友是活着，还是死了进了冥府，他都不肯听完。你相信我，那人从前来我故乡，在我家做过客。我待过那么多外乡人，没有谁比他更讨我喜欢。他说家在伊萨卡，父亲叫拉厄尔忒斯，是阿尔刻西奥斯的儿子。

            我热热情情招待，家里好东西多，都让他享用。临走送礼，礼数也没缺。七个塔兰同的纯金，一只刻着花的纯银杯，十二件轻斗篷、十二幅挂毯。还有十二件单层斗篷，十二条毯子，十二件好外袍和十二件衬衣。最后再给四个女子，容貌好，各种手艺都会，由他自己挑。
        - id: ch02-b05
          speaker: narrator
          text: >-
            拉厄尔忒斯流着泪回答。
        - id: ch02-b06
          speaker: laertes
          text: >-
            客人，是的，这里就是伊萨卡，可惜让恶人占住了。你那么多礼物，白给了。他要还活着，就在这里，该怎么好好待你啊。回礼也一定丰厚，你已经给过那么多，这才合礼。不过，接待他是几年前的事？你告诉我，别瞒我。那是我的儿子，可怜的孩子！他早死在远方，不是海里的鱼吃了，就是大陆上的鸟兽吃了。

            我们生了他，养了他，可他母亲不能抱着他，我这个父亲也不能，连殓衣都没法替他裹上。佩涅洛佩那么贤惠，带来那么多嫁妆，却不能在丈夫临终时守着哭，不能按规矩合上他的眼。现在，说说你吧，你到底是谁？哪座城的人？父母是谁？带你和伙伴来伊萨卡的船，靠在哪里？还是你搭的别人的船，他们把你留下，就接着走了？
        - id: ch02-b07
          speaker: odysseus
          text: >-
            我照实说。我叫埃佩里托斯，住在阿吕巴斯，有所很好的房子。父亲是阿斐达斯国王，祖父叫波吕佩蒙。我从西坎尼亚出航，神让我偏了方向，不想来也给漂到这里。船就在那边，城外开阔的海岸旁。奥德修斯离开我的国家，到现在是第五年。可怜啊，走时的兆头明明好得很，鸟都在右手边飞。分别那天，他和我看着都高兴，想的是以后还会相见，还能做客，还能互送礼物。
        - id: ch02-b08
          speaker: narrator
          text: >-
            悲伤的乌云压到拉厄尔忒斯心头。他抓了两手尘土，往灰白的头上撒，一声声沉重地呻吟。看着父亲，奥德修斯心里痛，鼻翼都颤起来了。他猛扑过去，抱紧老人，亲吻他。
        - id: ch02-b09
          speaker: odysseus
          text: >-
            父亲，你问的就是我。二十年了，我回来了！可现在别再哭，别再叹气，我们没有时间。还要告诉你，我在家里杀了求婚人。他们狂妄，干尽坏事，这就是惩罚。
        - id: ch02-b10
          speaker: laertes
          text: >-
            你真是奥德修斯？我的儿子真回来了？那拿个凭据给我看，要让我明白，让我信得过。
        - id: ch02-b11
          speaker: odysseus
          text: >-
            先看这个疤。我在帕尔纳索斯山打猎，被野猪的獠牙伤了。那次你和母亲叫我去外祖父奥托吕科斯家，拿他答应的礼物。他来过我们家，亲口答应送我的。还有园里的树，我指给你看，哪些是你给我的。小时候，我跟在你后面转，一棵棵地问。你带我全看过，叫什么，是什么，都告诉了我。十三棵梨树，十棵苹果树，四十棵无花果树，你还答应给五十行葡萄。行间都种了谷物，等太阳晒得够热，各样葡萄就长出来了。
        - id: ch02-b12
          speaker: narrator
          text: >-
            听了这些凭据，老人再没疑心，浑身却没了力气，双臂抱住儿子。奥德修斯赶紧扶稳，要不父亲就昏过去了。缓过一口气，神志清楚些，拉厄尔忒斯才又能说话。
        - id: ch02-b13
          speaker: laertes
          text: >-
            父亲宙斯啊，那些求婚人真的为狂妄糊涂受了罚！可见你们这些神，还在奥林波斯。可我怕，伊萨卡人马上全赶过来。他们还会送信到刻法勒尼亚所有的城去。
        - id: ch02-b14
          speaker: odysseus
          text: >-
            别怕，父亲，振作起来。这事先别担心，进园边的屋子吧。我早让忒勒马科斯、菲洛伊提奥斯和欧迈奥斯过去，叫他们尽快备饭了。
    - id: ch03
      title: 农庄与城里
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            父子俩一路说着，到了屋里。忒勒马科斯跟牧牛人、牧猪人正切肉，又把酒和水调好。西库尔老妇把拉厄尔忒斯带进去，洗干净，抹好油，拿出一件好斗篷给他披上。雅典娜也来了，给老人添了威严，使他更高大、更健壮。等他出来，奥德修斯都吃了一惊，父亲怎么像位神了？
        - id: ch03-b02
          speaker: odysseus
          text: >-
            亲爱的父亲，准是哪位神帮了你。你变得高大了，也好看多了。
        - id: ch03-b03
          speaker: laertes
          text: >-
            父亲宙斯、雅典娜，还有阿波罗啊，真想回到从前！我那时统治刻法勒尼亚人，还攻下过海岬上的涅里科斯，多坚固的城啊。要是我还有当年的劲，昨天穿着铠甲在家，就能站在你旁边打那些求婚人。我一定能杀掉一大批，叫你好好高兴一回。
        - id: ch03-b04
          speaker: narrator
          text: >-
            两人聊着，其他人把手里的活干完，宴席准备好了。大家不再忙碌，各就各位，在长凳和椅子上坐下，开始吃饭。不久，老多利奥斯和儿子们也来了。是儿子们的母亲去叫他们来的。他们放下了手里的活。这位西库尔老妇，正是照顾年老拉厄尔忒斯的人。父子几个认出奥德修斯，惊得呆站着不动。他带点责备，又亲亲热热地说。
        - id: ch03-b05
          speaker: odysseus
          text: >-
            老人家，坐下来吃呀，先别只顾着吃惊。我们早想开饭了，就等你们呢。
        - id: ch03-b06
          speaker: narrator
          text: >-
            多利奥斯伸出两只手，迎上前，握住主人的手，在手腕处亲了一下。
        - id: ch03-b07
          speaker: dolius
          text: >-
            主人啊，我们盼得太久了，都不敢再指望，神却把您送回来。欢迎您回来，愿诸神让您事事兴盛！不过，佩涅洛佩知道了吗？要不要叫个人去告诉她？
        - id: ch03-b08
          speaker: odysseus
          text: >-
            她知道了，老人家，这个不用你操心。
        - id: ch03-b09
          speaker: narrator
          text: >-
            多利奥斯坐下，儿子们一个接一个走到奥德修斯身边，问候他，拥抱他，再按次序坐到父亲旁边。

            农庄忙着备饭时，消息已经传遍伊萨卡。求婚人死得这么惨，人们听了，从各处赶往奥德修斯家，在门前哭喊哀号。他们把死者带走，自家的亲人自己安葬。外地人的尸体就交给渔人，放上渔船，逐个送回故乡。随后，大家聚到议事场，满心愤怒。欧佩忒斯站起来说话。奥德修斯杀的头一个，是他儿子安提诺奥斯。他伤心得受不了，边哭边说。
        - id: ch03-b10
          speaker: eupeithes
          text: >-
            朋友们，这个人给我们阿开亚人造了多少孽！最好的子弟，他带走了一大批，结果呢，船没了，人也没了。好不容易回来，又杀了刻法勒尼亚最要紧的人。赶紧追啊，不能等他逃到皮洛斯，或埃佩奥斯人管的厄利斯。放他走，我们一辈子都抬不起头！儿子和兄弟让人杀了，不报仇，就是永远的耻辱。我是活着也没乐趣，宁愿现在就死。大家起来，追上他们，别让他们过海去大陆！
        - id: ch03-b11
          speaker: narrator
          text: >-
            看他一边说一边流泪，众人都可怜他。这时，墨冬与歌手斐弥奥斯醒了，从奥德修斯家走出来。人们看见两人，十分吃惊。他们站到会场中央，墨冬开了口。
        - id: ch03-b12
          speaker: medon
          text: >-
            伊萨卡人，听我一句。这不是奥德修斯违背神意做的。我亲眼见过，一位神变成门托尔，在他旁边站着。一会儿走到他面前鼓励他，一会儿怒气冲冲地扑向院里的求婚人。那些人就一片片倒了，压在彼此身上。
        - id: ch03-b13
          speaker: narrator
          text: >-
            人们脸色都白了。马斯托尔的儿子，老哈利忒尔塞斯，站了起来。过去的事、将来的事，在场只有他都知道。他没有隐瞒，坦坦白白地告诉大家。
        - id: ch03-b14
          speaker: halitherses
          text: >-
            伊萨卡人，今天这样，还不是你们自己造成的？我和门托尔早劝过，管住儿子们，别让他们胡闹。你们谁听了？他们以为首领回不来，就任着坏心思，糟蹋他的家产，侮辱他的妻子。现在总该听我一回了。别去找奥德修斯打仗，不然，你们是在给自己招祸。
        - id: ch03-b15
          speaker: narrator
          text: >-
            大半的人高喊着，立刻散了。剩下的却不高兴听老人的话，选择跟欧佩忒斯走。他们匆匆取回武器，穿戴齐整，到城外会合。欧佩忒斯带着他们，继续做这件蠢事。他以为能替儿子报仇，却不知道，自己也会死在这一趟，再也回不来了。
    - id: ch04
      title: 停下来的战斗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            雅典娜问宙斯。
        - id: ch04-b02
          speaker: athena
          text: >-
            父亲，克洛诺斯之子，众王之王，你告诉我，准备怎么办？让他们再打下去，还是使双方和平相处？
        - id: ch04-b03
          speaker: zeus
          text: >-
            孩子，怎么又来问我？奥德修斯回家报仇，本来就是你安排的。你看着办。不过，我觉得最合适的是这样。他的仇已经报了，让大家立个郑重的誓约，仍由他做国王。我们使另一方忘记、原谅亲人被杀的事，儿子和兄弟的死，都不再追究。以后重新做朋友，像从前一样，大家平平安安，日子富足。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这正是雅典娜急着想做的。她从奥林波斯最高的山峰，飞了下来。

            拉厄尔忒斯他们吃过饭，奥德修斯先说道。
        - id: ch04-b05
          speaker: odysseus
          text: >-
            谁出去瞧瞧，那些人是不是快到跟前了？
        - id: ch04-b06
          speaker: narrator
          text: >-
            多利奥斯的一个儿子照办，走到门槛，已看见一群人在近处。
        - id: ch04-b07
          speaker: dolius_son
          text: >-
            他们到了！快穿铠甲！
        - id: ch04-b08
          speaker: narrator
          text: >-
            奥德修斯与三个伙伴，多利奥斯的六个儿子，都赶紧武装起来。拉厄尔忒斯和多利奥斯也披了甲。白头发的老人，眼下也不得不当战士。准备妥当，奥德修斯领着大家开门出去。

            宙斯的女儿雅典娜到了，模样和声音都成了门托尔的。看见她，奥德修斯高兴，对儿子说。
        - id: ch04-b09
          speaker: odysseus
          text: >-
            忒勒马科斯，现在就看本事了。这一仗，谁有多少勇气，都会显出来。祖先们的力量和胆量，全天下都知道，你可别让他们蒙羞。
        - id: ch04-b10
          speaker: telemachus
          text: >-
            父亲，说得对。你只管看着，我绝不会有意辱没你的家族。
        - id: ch04-b11
          speaker: narrator
          text: >-
            拉厄尔忒斯听得欢喜极了。
        - id: ch04-b12
          speaker: laertes
          emotion: happy
          text: >-
            上天啊，今天太叫人高兴了！儿子和孙子在比，谁更勇敢。我听着，真是快活！
        - id: ch04-b13
          speaker: narrator
          text: >-
            雅典娜凑到老人身边。
        - id: ch04-b14
          speaker: athena
          text: >-
            阿尔刻西奥斯之子，你是我世上最好的朋友。向蓝眼睛的少女祈祷，再向她父亲宙斯祈祷。然后把矛举稳，投出去。
        - id: ch04-b15
          speaker: narrator
          text: >-
            一边说，她一边给老人添了力量。他向她祷告完，稳住长矛，用力一掷。矛打中欧佩忒斯的头盔，直穿了过去，头盔根本没挡住。欧佩忒斯重重倒地，身上的铠甲撞得铿锵响。奥德修斯与忒勒马科斯也扑向敌人前排，用剑和矛厮杀。这样下去，对方一个都活不了，谁也别想回家。雅典娜却突然高喊，叫所有人都停了下来。
        - id: ch04-b16
          speaker: athena
          text: >-
            伊萨卡人，别再打这种可怕的仗了！马上把事情了结，不能再流血！
        - id: ch04-b17
          speaker: narrator
          text: >-
            女神一出声，人人都吓白了脸，武器脱手，掉在地上。为了活命，他们转身往城里逃。奥德修斯却大叫，鼓起全身力量，像飞翔的鹰一样往下扑。这时，克洛诺斯之子送来一道火焰雷霆，正落在雅典娜前面。女神转向奥德修斯。
        - id: ch04-b18
          speaker: athena
          text: >-
            奥德修斯，拉厄尔忒斯高贵的儿子，停止争斗。再打，宙斯就要对你发怒了。
        - id: ch04-b19
          speaker: narrator
          text: >-
            奥德修斯痛痛快快地听从了她。

            雅典娜随后借着门托尔的样貌和声音，让交战的两方，订下了和平的盟约。
