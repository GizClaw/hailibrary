  chapters:
    - id: ch01
      title: The Souls Beneath the Earth
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mercury of Cyllene called the dead suitors together. He carried his beautiful golden wand. Whenever he wished, that wand could close a man's eyes in sleep or wake him again. Now he used it to stir the ghosts and lead them away. They trailed after him, whining and making strange, broken sounds.

            In the hollow of a great cave, bats hang together in a cluster. If one drops out, the others fly about squealing. That was the sound these spirits made as Mercury, the god who eases sorrow, brought them into death's dark dwelling. They passed the waters of Oceanus and the rock called Leucas. Beyond the gates of the sun and the country of dreams, they reached the asphodel meadow. There live the souls and shadows of people whose work is over for ever.

            They found Achilles, Peleus' son, with Patroclus, Antilochus and Ajax. Of all the Danaans, only Achilles himself had been a finer or handsomer man than Ajax. The ghosts gathered around Peleus' son. Agamemnon joined them in bitter sorrow, with the men who'd died beside him in Aegisthus' house gathered around him. Achilles was the first to speak.
        - id: ch01-b02
          speaker: achilles
          text: >-
            Son of Atreus, we always thought Jove favoured you above every other hero, from the beginning right through to the end. You commanded so many brave men when we all fought outside Troy. Yet death laid its hand on you too soon, that hand no mortal ever escapes. It would have been better to die at Troy, when your fame was greatest. The Achaeans would have raised a mound over your ashes, and your son would have inherited your honour. Instead, you've been given the most wretched end.
        - id: ch01-b03
          speaker: agamemnon
          text: >-
            You were fortunate, son of Peleus. You died at Troy, far away from Argos. Around your body, the bravest Trojans and Achaeans fought and fell. You lay there in a cloud of whirling dust, so huge and powerful, yet caring nothing now for all your courage. We battled over you the whole day long. We'd never have stopped if Jove hadn't sent a hurricane to drive us apart. We carried you out of the fighting and back to the ships. Then we laid you on your bed and washed your beautiful skin with warm water and fragrant oils. Around you the Danaans wept bitterly and tore at their hair.

            Your mother heard what had happened and came out of the sea with her immortal nymphs. Their cry of mourning rolled over the water. It frightened the Achaeans so badly that they trembled. They would have run to their ships in panic if old Nestor hadn't stopped them. He was wise, and his advice had always been the soundest. He called out to us.
        - id: ch01-b04
          speaker: nestor
          text: >-
            Stay where you are, Argives! Sons of the Achaeans, don't run away. This is his mother, coming from the sea with her deathless nymphs. She's coming to look upon her son's body.
        - id: ch01-b05
          speaker: agamemnon
          text: >-
            That was what Nestor said, and we weren't afraid any longer. The daughters of the old sea god surrounded you, crying, and dressed you in clothes made for immortals. All nine Muses came too. They sang a lament in their lovely voices, one calling and another answering. Not one Argive heard that song without weeping at its sadness. For seventeen days and seventeen nights, gods and mortals mourned you together. On the eighteenth day we laid you in the fire. Around your body we sacrificed many fat sheep and many cattle.

            You burned in the garments of the gods, with rich resins and honey. While the fire blazed, heroes on horseback and on foot moved around the pyre, clashing their armour. Their tread sounded like a great crowd marching. When the fire from heaven had done its work, we came at dawn to gather your white bones. We laid them in sweet oils and unmixed wine. Your mother brought a golden jar to keep them in. Bacchus had given it to her, and Vulcan himself had made it. In that jar we mixed your pale bones with the bones of Patroclus, who'd died before you. We also put in Antilochus' bones, kept separate from the others. Since Patroclus' death, he'd been nearer to you than any of your other friends.

            Over those remains, the army of the Argives raised a magnificent tomb. It stood on a point of land stretching out over the open Hellespont. Sailors could see it from far out at sea, people living then and people still to be born. Your mother asked the gods for prizes, and set them out for the noblest Achaeans to compete for. You've attended heroes' funerals before. You know how young men fasten their belts and prepare to win prizes when a great leader has died. But you've never seen prizes like the ones silver-footed Thetis offered in your honour. The gods loved you dearly.

            So death hasn't taken away your fame, Achilles. Your name will live for ever among men. But what comfort was there for me when my fighting days were over? Jove decided I should come home only to be destroyed, by Aegisthus and my own wicked wife.
    - id: ch02
      title: What the Suitors Told
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            While the two ghosts spoke together, Mercury approached with the suitors Ulysses had killed. Achilles and Agamemnon stared in astonishment, then went straight towards them. Agamemnon recognised Amphimedon, the son of Melaneus. He lived in Ithaca, and Agamemnon had once been his guest.
        - id: ch02-b02
          speaker: agamemnon
          text: >-
            Amphimedon, what happened? So many fine young men, all about the same age, arriving here beneath the earth together. No city could offer a better company. Did Neptune attack you with wind and waves at sea? Or were you raiding on the mainland, stealing cattle or sheep, when your enemies killed you? Were they defending their wives and their town? Tell me. I've been a guest in your house. Don't you remember Menelaus coming there with me? We wanted to persuade Ulysses to bring his ships and join our attack on Troy. A whole month passed before we could sail again. It was hard work getting him to agree to come.
        - id: ch02-b03
          speaker: amphimedon
          text: >-
            Agamemnon, king of men and son of Atreus, I remember all of it. I'll tell you exactly how we met our deaths. Ulysses had been gone for years, and we were asking his wife to marry us. She never said plainly that she wouldn't marry, yet she wouldn't settle anything either. She meant to destroy us. This was the trick she used. In her room she put up a great frame for needlework and began making an enormous piece of fine cloth. Then she spoke to us.
        - id: ch02-b04
          speaker: penelope
          text: >-
            My dear suitors, Ulysses is dead, I know. But don't hurry me into another marriage just yet. Wait until I've finished a burial cloth for the hero Laertes, ready for the day death takes him. I don't want all my skill with a needle to come to nothing. He's a wealthy man. What would the women here say if he were laid out without a shroud?
        - id: ch02-b05
          speaker: amphimedon
          text: >-
            We agreed to what she'd asked. Through the day we could see her working at the great web. But by torchlight at night, she undid the stitches she'd made. She kept us fooled for three years. We discovered nothing. Then time went by, the moons waned and many more days passed, until it was the fourth year. One of her maids knew the secret and told us. We caught Penelope unpicking the cloth herself. Like it or not, she had to finish it then. She washed the completed robe and showed it to us. It shone as brightly as the sun or the moon.

            Then some spiteful god brought Ulysses to the farm up in the hills, where his swineherd lives. His son came there too, back from a voyage to Pylos. They made their plan to kill us, and came into town. Telemachus arrived first. Afterwards the swineherd brought Ulysses. He was in rags, leaning on a stick, looking like a miserable old beggar. We weren't expecting him. Nobody recognised him, not even the older men among us. We insulted him and flung things at him. There he was in his own house, being hit and abused, and he took it without a word.

            At last Jove, the god who bears the aegis, put his purpose into him. He and Telemachus carried the weapons into an inner room, hid them there, and bolted the doors behind them. Then he used his cunning on his wife. He made her bring out his bow and a set of iron pieces, to hold a contest for us unlucky suitors. That was where our destruction began. None of us could put a string on the bow. We couldn't even come close. When the bow was about to be passed to Ulysses, we all shouted against it. Whatever he said, he mustn't be allowed to have it. But Telemachus insisted.

            Ulysses took it in his hands, strung it without any difficulty, and shot an arrow through the iron. He stood on the cloister floor, tipped his arrows out onto the ground, and looked fiercely round at us. Antinous was the first man he killed. After that he aimed straight ahead and kept firing those deadly arrows. The men fell over one another. Clearly a god was helping him and his companions. They rushed at us with all their strength, attacking us throughout the cloisters. We groaned terribly as they smashed our heads, and our blood ran and seethed over the ground.

            That's how we died, Agamemnon. Our bodies are still lying in Ulysses' house with no one to care for them. Our friends and families haven't heard what happened. They can't lay us out, wash the dark blood from our wounds, or mourn for us with the rites the dead should have.
        - id: ch02-b06
          speaker: agamemnon
          text: >-
            How fortunate you are, Ulysses, son of Laertes! What a blessing to have such a wife. Penelope, Icarius' daughter, has rare good sense, and she's been true to the man she married. The fame of her goodness will never fade. The immortals will make a song of her faithfulness, a song everyone will delight to hear. How different from Tyndareus' wicked daughter. She killed her lawful husband. Men will hate the song of that woman, for she's brought shame on all women, even the good ones.
    - id: ch03
      title: The Father in the Orchard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That was their conversation in Hades, far down inside the earth. Meanwhile Ulysses and his companions had left the town. They soon arrived at Laertes' fine, carefully tended farm. He'd reclaimed it himself with endless hard work. His house stood there with a lean-to all around it. The slaves who worked for him sat, ate and slept in that shelter. Inside the house lived an old Sicel woman, who cared for him on his country farm. Ulysses turned to his son and the two other men.
        - id: ch03-b02
          speaker: odysseus
          text: >-
            Go into the house. Find the best pig you can and kill it for our dinner. First I want to see my father. Will he know who I am, or have all these years apart made me a stranger to him?
        - id: ch03-b03
          speaker: narrator
          text: >-
            He took his armour off and handed it to Eumaeus and Philoetius. They went straight to the house. Ulysses turned towards the vineyard, intending to test his father. As he entered the great orchard, there was no sign of Dolius, his sons, or the other slaves. They were all at the place the old man had sent them, collecting thorn branches for a fence around the vineyard. Laertes was there alone, hoeing the earth around a vine.

            He wore an old, dirty shirt, patched and worn to rags. Strips of oxhide were wrapped round his legs to protect them from brambles, and leather sleeves covered his arms. On his head was a goatskin cap. He looked deeply miserable. Ulysses saw how worn and old his father had become, and how much sorrow he carried. He stopped beneath a tall pear tree and cried. Should he run to him, kiss and embrace him, and tell him he'd come home? Or should he ask some questions first and hear what the old man said? He decided to use a little cunning. He went over to his father, who was bent low, digging around a plant.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            Sir, you certainly know how to care for a garden. You must take tremendous trouble with it. I can see your work on every plant. Not a fig tree, a vine, an olive or a pear tree has been neglected, not even a bed of flowers. But please don't be offended if I say you care for the garden better than you care for yourself. You're old, your body smells unpleasant, and your clothes are very poor. Your master can't be neglecting you because you're lazy. In fact, your face and the shape of your body don't look like a slave's at all. They show a man of noble birth. I'd have thought you belonged among those old men who deserve to be well washed, well fed and comfortably bedded at night.

            But tell me the truth. Whose slave are you, and whose garden is this? There's another thing I'd like to know. Have I really arrived in Ithaca? A man I met just now told me so, but he was a dull sort of fellow. I tried to ask about an old friend, whether he was still living or had died and gone down to Hades. The man wouldn't even hear my whole story. Believe me, that friend once visited my house in my own country. Of all the strangers I've welcomed, I never liked anyone better. He told me he came from Ithaca. His father, he said, was Laertes, son of Arceisius.

            I gave him a warm welcome and let him share in everything my well-stocked house could offer. When he left, I gave him all the gifts a guest should receive. There were seven talents of pure gold, and a cup of solid silver with flowers worked into its surface. I gave him twelve light cloaks and twelve pieces of tapestry. Then twelve single-fold cloaks, twelve rugs, twelve fine mantles, and twelve shirts as well. Besides all of those things, I gave him four beautiful women who were skilled at every useful craft. I let him choose which women he wanted.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Tears ran down Laertes' face as he answered the stranger.
        - id: ch03-b06
          speaker: laertes
          text: >-
            Sir, this is indeed the country you name. But wicked men have taken it over. All those rich presents of yours were wasted. If only you'd found your friend alive here in Ithaca. He would have made you welcome, and sent you away with handsome gifts in return. After all you'd given him, that would only have been right. But how many years ago was it that you received this guest? Tell me truly. He was my son, my unhappy son. He's died far from his own land. Fish have eaten him in the sea, or birds and wild beasts have fed on him somewhere on the mainland.

            His mother couldn't hold him in her arms or wrap him in a shroud, and neither could I, his own father. We were the ones who gave him life. Nor could Penelope, his good wife with her rich dowry, stand by her dying husband and grieve as a wife should. She couldn't close his eyes, as the dead have a right to expect. But I want to know about you now. Tell me honestly who you are and where you've come from. What's your town, and who are your parents? Where have you left the ship that brought you and your men to Ithaca? Or did you travel on another man's ship? Have the people who brought you here sailed on and left you behind?
        - id: ch03-b07
          speaker: odysseus
          text: >-
            I'll answer all of that truthfully. I'm from Alybas, where I have a fine house of my own. My father is King Apheidas, and his father was Polypemon. I'm called Eperitus. When I sailed away from Sicania, the gods drove me off course. I was brought here against my will. My ship is over there, along the open shore outside the town. As for Ulysses, this is the fifth year since he left my country. Poor man. The signs at his departure looked so promising. All the birds flew to our right. We were both pleased by that as we said goodbye. We fully expected to meet again as friends and exchange presents once more.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Grief covered Laertes like a dark cloud. He scooped dust from the ground with both hands and poured it over his grey head, groaning heavily. The sight touched Ulysses to the heart. His nostrils trembled as he looked at his father. Then he sprang forward, put his arms around him and kissed him.
        - id: ch03-b09
          speaker: odysseus
          text: >-
            Father, I'm the man you're asking about. I'm home again, after twenty years away. But stop your crying and sighing now. We can't lose any time. You need to know that I've killed the suitors in my house, as punishment for their crimes and their insolence.
        - id: ch03-b10
          speaker: laertes
          text: >-
            If you truly are my son Ulysses, returned at last, give me a clear sign. Show me something that will prove it and leave me certain.
        - id: ch03-b11
          speaker: odysseus
          text: >-
            Look first at this scar. A boar's tusk made it when I was hunting on Mount Parnassus. You and my mother sent me to visit her father, Autolycus. He'd promised me presents when he came here, and I went to collect them. And I can show you the trees you gave me in the vineyard. I followed you through the garden asking about them. We went round them all together, and you told me what each one was and what it was called. You gave me thirteen pear trees, ten apple trees and forty fig trees. You promised fifty rows of vines too. Corn grew between the rows. Those vines produce every sort of grape when the heat from heaven falls heavily on them.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The proof was certain. Hearing it, Laertes lost his strength and threw his arms around his son. Ulysses held him up. Without that support, the old man would have fainted. As his senses returned and he began to recover, he spoke again.
        - id: ch03-b13
          speaker: laertes
          text: >-
            Father Jove! So the gods are still on Olympus after all, if those men have paid for their folly and arrogance. But I'm frightened. The whole of Ithaca may be here any moment. They'll send messengers out to all the Cephallenian towns as well.
        - id: ch03-b14
          speaker: odysseus
          text: >-
            Be brave, Father. Don't let that trouble you now. Let's go to the house beside the garden. I've sent Telemachus, Philoetius and Eumaeus ahead already. I told them to have dinner ready as soon as they could.
    - id: ch04
      title: A Meal and a Gathering
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Father and son walked towards the house, talking as they went. They found Telemachus, the stockman and the swineherd cutting up the meat and mixing water into the wine. The old Sicel woman led Laertes inside. She washed him, rubbed him with oil and dressed him in a good cloak. Minerva came to him as well. She made his presence more impressive, his body taller and more robust than before. When he returned, Ulysses was astonished. His father looked like an immortal.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Dear Father, one of the gods must have been at work on you. You're so much taller now, and you look so much better.
        - id: ch04-b03
          speaker: laertes
          text: >-
            By Father Jove, Minerva and Apollo, I wish I were the man I used to be! I ruled the Cephallenians then. I captured Nericum, that strong fortress out on the headland. If I still had that strength, and had been at home in my armour yesterday, I could have stood beside you against the suitors. I'd have killed many of them. It would have done you good to see it.
        - id: ch04-b04
          speaker: narrator
          text: >-
            They went on talking. The others finished their tasks and had the feast ready. They stopped work and took their proper places on the seats and benches. The meal began. Soon old Dolius and his sons came in from their work. The sons' mother, the Sicel woman who cared for Laertes in his old age, had gone to fetch them. They saw Ulysses and knew it really was him, but stood there too amazed to move. He gave them a friendly scolding.
        - id: ch04-b05
          speaker: odysseus
          text: >-
            Sit down and eat, old friend. Don't spend all your time staring in surprise. We've been ready to start for a while. We've been waiting for you.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Dolius reached out both hands and approached his master. He took Ulysses' hand and kissed him at the wrist.
        - id: ch04-b07
          speaker: dolius
          text: >-
            Sir, we've wished for your return for so long. Just when we'd given up hope, the gods have brought you back to us. Welcome home, and may they bless you with good fortune. Tell me, does Penelope know you're here? Shall we send someone to take her the news?
        - id: ch04-b08
          speaker: odysseus
          text: >-
            She already knows, old man. There's no need to worry about that.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Dolius sat down. His sons gathered around Ulysses, greeting and embracing him one at a time. Then they sat in their proper order beside their father.

            While dinner was being prepared at the farm, the terrible news about the suitors spread through the town. People came from every direction to Ulysses' house, wailing and shouting. They took away the dead. Each family buried its own men. The bodies of men from other places were put aboard fishing boats. The fishermen were to take every one back to his own home. Afterwards, the angry townspeople gathered at the meeting place. Eupeithes got up to speak. His son Antinous had been the first man Ulysses killed, and the father's grief overwhelmed him. He spoke through bitter tears.
        - id: ch04-b10
          speaker: eupeithes
          text: >-
            Friends, this man has brought terrible harm on the Achaeans. He took so many of our finest men away aboard his ships. Now he's lost the fleet and everyone who sailed in it. And what does he do when he returns? He kills the leading men of the Cephallenians. We must act before he escapes to Pylos, or to Elis, where the Epeans rule. If we let him go, we'll live in shame for ever. Our sons and brothers have been murdered. If we don't avenge them, that disgrace will never leave us. I could find no pleasure in being alive then. I'd sooner die this moment. So come, let's go after them, before they can cross to the mainland.
        - id: ch04-b11
          speaker: narrator
          text: >-
            He was still crying as he spoke, and everyone felt sorry for him. By now Medon and Phemius the singer had woken and come from Ulysses' house. The crowd was astonished to see them. They stood in the middle of the gathering, and Medon spoke.
        - id: ch04-b12
          speaker: medon
          text: >-
            Men of Ithaca, listen to me. Ulysses wasn't acting against the gods' wishes. I saw an immortal with my own eyes. The god looked like Mentor and stood beside him. Sometimes he was in front of Ulysses, urging him on. Then he rushed furiously through the court, attacking the suitors, and they fell on top of each other.
        - id: ch04-b13
          speaker: narrator
          text: >-
            The people went pale with fear. Old Halitherses rose. He was Mastor's son, and among all those people, he alone understood both what had happened and what was to come. He addressed them frankly, holding nothing back.
        - id: ch04-b14
          speaker: halitherses
          text: >-
            People of Ithaca, you've brought this on yourselves. You wouldn't listen to me or to Mentor. We told you to stop your sons' foolishness. They were running wild and doing terrible wrongs, wasting their chief's wealth and dishonouring his wife because they thought he wouldn't return. This time, listen and do as I say. Don't go out to attack Ulysses. You may find that all you've done is bring disaster on your own heads.
        - id: ch04-b15
          speaker: narrator
          text: >-
            More than half the gathering shouted loudly and left at once. The rest stayed. They disliked Halitherses' advice and chose to follow Eupeithes. They hurried off to fetch their armour, put it on and assembled outside the city. Eupeithes led them forward in their folly. He thought he was going to avenge his son. In truth, he would never return. The attempt itself would cost him his life.
    - id: ch05
      title: The Covenant of Peace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Minerva now spoke to Jove.
        - id: ch05-b02
          speaker: athena
          text: >-
            Father, son of Saturn, king above all kings, tell me your plan. Will you let them go on fighting, or bring peace between them?
        - id: ch05-b03
          speaker: zeus
          text: >-
            My child, why do you ask me? Wasn't it your own plan that Ulysses should get home and punish the suitors? Do as you choose. But here's what seems most reasonable to me. He's had his revenge now. Let both sides swear a solemn oath that he will remain their ruler. We'll make the others forgive and forget the killing of their sons and brothers. Then they can be friends again, as they were before, and live in peace and plenty.
        - id: ch05-b04
          speaker: narrator
          text: >-
            This was just what Minerva already wanted. She darted down from the highest peaks of Olympus.

            Laertes and the others had finished their dinner. Ulysses spoke first.
        - id: ch05-b05
          speaker: odysseus
          text: >-
            Someone go outside and see whether they're getting near us.
        - id: ch05-b06
          speaker: narrator
          text: >-
            One of Dolius' sons went to look. From the threshold he could see the whole company close by.
        - id: ch05-b07
          speaker: dolius_son
          text: >-
            They're here! We must put our armour on now.
        - id: ch05-b08
          speaker: narrator
          text: >-
            They armed as quickly as they could. Ulysses and his three companions did so, and the six sons of Dolius. Laertes and Dolius armed themselves too. Grey-haired as they were, necessity had made them warriors. When everyone was ready, they opened the gate and went out, led by Ulysses.

            Jove's daughter Minerva came to them in Mentor's shape, speaking with Mentor's voice. Ulysses was glad to see her. He spoke to Telemachus.
        - id: ch05-b09
          speaker: odysseus
          text: >-
            Telemachus, this fight will show what each man is made of. Don't let down your ancestors. Their courage and strength were famous throughout the world.
        - id: ch05-b10
          speaker: telemachus
          text: >-
            You're right, Father. Watch me if you wish. You'll see that I have no intention of bringing shame on your family.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Laertes was delighted to hear them.
        - id: ch05-b12
          speaker: laertes
          emotion: happy
          text: >-
            Gods above, what a day this is for me! My son and grandson are trying to outdo each other in courage. It makes me so happy to hear them.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Minerva stepped close to the old man.
        - id: ch05-b14
          speaker: athena
          text: >-
            Son of Arceisius, my dearest friend in all the world, pray to the blue-eyed maiden and to her father Jove. Then balance your spear, take aim and throw it.
        - id: ch05-b15
          speaker: narrator
          text: >-
            As she spoke, she filled him with new strength. Laertes prayed to her, steadied his spear and cast it. The point struck Eupeithes' helmet and went straight through. The helmet couldn't stop it. Eupeithes crashed to the earth, his armour ringing and rattling around him. Meanwhile Ulysses and his son attacked the enemy's front rank, striking with swords and spears. They would have killed every one of those men. None would have gone home again. But Minerva called out loudly, stopping everyone.
        - id: ch05-b16
          speaker: athena
          text: >-
            Men of Ithaca, end this dreadful fighting. Settle your dispute now. No more blood must be shed.
        - id: ch05-b17
          speaker: narrator
          text: >-
            At the goddess's voice, terror seized them. Their faces went pale. Weapons slipped from their hands and clattered to the ground, and they ran back towards the city to save their lives. Ulysses let out a great shout. He gathered his strength and swooped after them like an eagle in flight. Then Saturn's son sent down a bolt of fire. It struck the ground just in front of Minerva. She turned to Ulysses.
        - id: ch05-b18
          speaker: athena
          text: >-
            Ulysses, noble son of Laertes, stop this battle. If you go on, Jove will be angry with you.
        - id: ch05-b19
          speaker: narrator
          text: >-
            Ulysses willingly obeyed her.

            Then Minerva took Mentor's form and voice. She brought the two opposing sides together in a covenant of peace.
