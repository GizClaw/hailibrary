  chapters:
    - id: ch01
      title: The new arrivals among the dead
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Hermes gathered the dead suitors with his golden wand and led them out of Odysseus's house. They cried behind him, thinly, like bats. He took them past Oceanus and the land of dreams to the meadow of the dead.
            Achilles was talking to Agamemnon. The king who had commanded the army now stood with the companions murdered at his homecoming.
        - id: ch01-b02
          speaker: achilles
          text: |
            If you'd fallen at Troy, we would have built your tomb there. Your son would have had that honor to remember you by.
        - id: ch01-b03
          speaker: narrator
          text: |
            Agamemnon remembered the funeral. Both armies fought for Achilles' body until a storm stopped them. They carried him to the ships and washed him. His mother Thetis came from the sea with the nymphs. Their cries scared the soldiers, but Nestor told them who it was. The Muses sang. People and gods mourned seventeen days. On the eighteenth, they burned him with sacrifices, resin, and honey, warriors moving round the fire. His mother brought a golden vessel for his bones and Patroclus's, with Antilochus's bones kept apart. They raised a tomb visible far out at sea. Thetis gave splendid prizes for games in his honor.
        - id: ch01-b04
          speaker: agamemnon
          text: |
            They're still speaking your name. I lived through Troy, only for Aegisthus and my wife to kill me when I got home.
        - id: ch01-b05
          speaker: narrator
          text: |
            He recognized Amphimedon. He had welcomed Agamemnon and Menelaus when they came to ask Odysseus to sail for Troy. Persuading him had taken a month in Ithaca.
        - id: ch01-b06
          speaker: agamemnon
          text: |
            How did all of you come to die together?
        - id: ch01-b07
          speaker: narrator
          text: |
            Amphimedon told of courting Penelope. For three years she had woven by day and undone the shroud at night. A maid exposed her in the fourth year, and they forced her to finish. He accused her of trapping them. Father and son met at the pig farm, came separately to town, and hid the weapons. As he told it, Odysseus had made her propose the bow contest. The beggar they'd insulted strung the bow and shot through the axes. Then he killed Antinous and attacked them all. A god helped the father and son. Their bodies were still at the house, he said. Their families couldn't wash, mourn, or bury them, since they didn't know.
            Hearing of Penelope brought Agamemnon back to his own homecoming.
        - id: ch01-b08
          speaker: agamemnon
          text: |
            Penelope kept faith with Odysseus. There'll be songs of her goodness. My wife killed her husband. Her hateful story has shamed every woman, even good ones.
    - id: ch02
      title: The trees a boy was given
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Up in the living world, Odysseus and his three companions reached Laertes' farm. He handed his armor to the two herdsmen and sent them with Telemachus to prepare food. He went into the orchard alone. Would his father recognize him?
            The workers were elsewhere, cutting thorns for a fence. Laertes bent over a vine in a patched shirt and goatskin cap. Leather covered him against the brambles. He'd looked after every plant, but scarcely looked after himself.
            Odysseus stood under a pear tree, crying. He could walk up and tell him at once. Instead, he decided to keep his identity hidden a little longer.
        - id: ch02-b02
          speaker: odysseus
          text: |
            You've cared for these trees so well. Why neglect yourself? Is this Ithaca? A man from here stayed with me once, Laertes' son. I gave him gold, a silver cup, cloth, and four enslaved women he chose.
        - id: ch02-b03
          speaker: narrator
          text: |
            Tears ran down the old man's face.
        - id: ch02-b04
          speaker: laertes
          text: |
            You're speaking of my son. If he were alive here, he'd repay all your kindness. But we don't even know where his body is. His mother and I never laid him out. His wife couldn't close his eyes. How long ago did you see him?
        - id: ch02-b05
          speaker: narrator
          text: |
            Odysseus said he was Eperitus from Alybas, with Apheidas for a father. His guest had left five years before. Birds flew on their right as they parted, giving them hope of meeting again. It was all made up.
            Laertes gathered dust in both hands and scattered it over his gray hair, groaning. Odysseus couldn't go on. He hurried to him, kissed him and held him close.
        - id: ch02-b06
          speaker: odysseus
          text: |
            Father, I'm your son. Twenty years away, and now I'm back. I've killed the suitors at home and punished what they did.
        - id: ch02-b07
          speaker: narrator
          text: |
            Laertes studied the face before him.
        - id: ch02-b08
          speaker: laertes
          text: |
            Help me be certain. Give me proof that you're my son.
        - id: ch02-b09
          speaker: narrator
          text: |
            Odysseus showed him the boar scar on his leg, from the visit to his mother's father. Then he turned to the trees.
        - id: ch02-b10
          speaker: odysseus
          text: |
            I followed you here as a boy, asking every tree's name. You showed me and explained. You gave me thirteen pear trees, ten apple trees, forty fig trees, and promised fifty rows of vines. Grain grew between the rows, with all kinds of grapes above.
        - id: ch02-b11
          speaker: narrator
          text: |
            Laertes' legs gave way when he heard the proof. He clung to his son, and Odysseus had to hold him upright. Only when his senses and strength returned could he stand. He gave thanks to Zeus, then remembered what there was to fear.
        - id: ch02-b12
          speaker: laertes
          text: |
            The people in town will be after us. Think of the dead men's families.
        - id: ch02-b13
          speaker: odysseus
          text: |
            First, come into the house. Telemachus and our friends are waiting there.
    - id: ch03
      title: The families in the square
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Inside, the food was being prepared. Laertes' old attendant washed him and put a fine cloak round him. Athena made him taller and stronger, astonishing his son. Laertes remembered taking Nericum's fortress. If he'd had that strength yesterday, he said, he would have killed many suitors beside Odysseus.
            The old attendant was also the mother of Dolius's six sons. She fetched them and their father from work. They stopped in amazement at Odysseus. He invited them to eat. Dolius held his hand and kissed his wrist.
        - id: ch03-b02
          speaker: dolius
          text: |
            We'd almost lost hope of seeing you again. Does your wife know yet? Should we send word?
        - id: ch03-b03
          speaker: odysseus
          text: |
            No need. Penelope already knows.
        - id: ch03-b04
          speaker: narrator
          text: |
            Dolius's sons greeted him too, and everyone sat down together.
            In town, the dead men's relatives had heard the news. They collected the bodies from the house. Those who belonged to Ithaca were buried by their families. The bodies from other islands were put on fishing boats to be taken home.
            The mourners gathered in the assembly. Antinous's father, Eupeithes, stood up in tears.
        - id: ch03-b05
          speaker: eupeithes
          text: |
            He lost our men and ships at Troy, then came back to kill our sons. Let him escape, and we're shamed forever. I'd rather die than go without revenge. Follow him before he reaches the mainland!
        - id: ch03-b06
          speaker: narrator
          text: |
            Medon and the singer Phemius arrived alive from the house. People stared. Medon spoke to them.
        - id: ch03-b07
          speaker: medon
          text: |
            I saw a god looking like Mentor, urging Odysseus on and striking the suitors. Heaven didn't oppose what happened.
        - id: ch03-b08
          speaker: narrator
          text: |
            That frightened the crowd. The seer Halitherses rose next.
        - id: ch03-b09
          speaker: halitherses
          text: |
            Mentor and I told you to stop your sons, and you ignored us. You let them waste his wealth and insult his wife. If you attack him now, you'll bring still more suffering on yourselves.
        - id: ch03-b10
          speaker: narrator
          text: |
            Over half the people left the gathering. The rest took Eupeithes' side. They fetched their weapons and headed for the farm.
            Athena asked Zeus whether the war should go on.
        - id: ch03-b11
          speaker: zeus
          text: |
            The suitors have been punished. Odysseus should keep his throne. Let both sides promise peace, and we'll make the families forget the bloodshed. They can be neighbors again.
        - id: ch03-b12
          speaker: narrator
          text: |
            Athena had been eager for this settlement already. She now left Olympus and went down to Ithaca.
    - id: ch04
      title: The command to stop
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            After the meal, Odysseus asked someone to look outside. One of Dolius's sons saw armed men coming and called the others to get ready.
            Odysseus put on armor with Telemachus, Eumaeus and Philoetius. Dolius and his six sons armed themselves too, and so did Laertes. Both old men were warriors again. They opened the gate and followed Odysseus out.
            Athena joined them disguised as Mentor. Odysseus addressed his son.
        - id: ch04-b02
          speaker: odysseus
          text: |
            We'll stand together today. Be as brave as the men of our family have always been.
        - id: ch04-b03
          speaker: telemachus
          text: |
            Watch me, Father. I won't let you down.
        - id: ch04-b04
          speaker: narrator
          text: |
            Laertes was delighted to hear his son and grandson competing in courage. Athena approached him, gave him fresh strength and told him to pray to her and Zeus before throwing his spear.
            He prayed and cast it. The point went through Eupeithes' helmet. Antinous's father fell dead, armor clattering. Odysseus and Telemachus attacked the front ranks. None would have got home alive if Athena hadn't called out.
        - id: ch04-b05
          speaker: athena
          text: |
            Stop, men of Ithaca! No more war. Settle this without more deaths.
        - id: ch04-b06
          speaker: narrator
          text: |
            In terror, the attackers let their weapons drop and ran towards town. Odysseus cried out and chased them.
            Zeus hurled a burning thunderbolt down in front of Athena.
        - id: ch04-b07
          speaker: athena
          text: |
            Odysseus, stop now, or you'll anger Zeus.
        - id: ch04-b08
          speaker: narrator
          text: |
            Odysseus gladly obeyed and stopped.
            Still speaking with Mentor's voice and wearing his face, Athena bound the men who had fought one another to an oath of peace.
