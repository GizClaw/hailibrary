style: epic-fantasy-illumination
titles: { en-US: "The Orchard and the Oath", zh-CN: "果园里的相认" }
labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
research: required
premise: >
  求婚人的亡魂把伊萨卡的结局带到死者中，不同的归乡命运再次相照。奥德修斯在果园试探父亲， 直到悲痛使他放下伪装，以旧疤和幼年树木的记忆相认。死者家属追来，老人再次披甲， 雅典娜与宙斯制止继续报复，使双方立下誓约。
characters:
  - { id: odysseus, description: "归乡者，认父后面对死者家属，最终服从止战命令" }
  - { id: laertes, description: "在果园中衰老的父亲，以旧疤和儿时记忆确认儿子" }
  - { id: telemachus, description: "已与父亲相认、在最后交锋中站在他身边的儿子" }
  - { id: achilles, description: "亡魂中的英雄，与阿伽门农谈不同的身后命运" }
  - { id: agamemnon, description: "归家遇害的统帅，从新来的亡魂那里得知佩涅洛佩的坚守" }
  - { id: amphimedon, description: "求婚人亡魂，将自己的遭遇说成佩涅洛佩设下的圈套" }
  - { id: dolius, description: "庄园中的老仆，与六个儿子迎接归人并参加防守" }
  - { id: eupeithes, description: "安提诺奥斯的父亲，悲痛中率领部分家属追击" }
  - { id: medon, description: "幸存的传令者，在集会中报告神的介入" }
  - { id: halitherses, description: "曾劝阻求婚人行为的老先知，再次阻止报复" }
  - { id: athena, description: "化作门托尔帮助父子祖孙，并执行止战与立约的女神" }
  - { id: zeus, description: "准许王权延续并以雷霆制止追杀的神" }
