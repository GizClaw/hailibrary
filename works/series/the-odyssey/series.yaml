cover_prompt: |-
  A wordless cover for an ancient Greek epic about the long return home. A
  weathered middle-aged seafarer with curly dark hair streaked with grey, a
  short beard, an undyed linen tunic, and a faded russet wool cloak stands on
  a rocky shore beside an old olive tree. Seen from behind at three-quarter
  view, he looks across a narrow blue bay toward a modest ancient island
  settlement on a low ridge, with a faint thread of hearth smoke above its
  roofs. A small wooden oared sailing vessel with one square linen sail rests
  offshore, below a vast unsettled sky opening to warm dawn light. Make the
  man's longing and the distant inhabited shore the central relationship.
  Compose a spacious horizontal 3:2 scene with the figure and olive tree in
  the left foreground, the winding shore guiding the eye toward the homes,
  and the sea occupying the middle distance. Use original character and ship
  designs grounded in ancient Mediterranean materials, without modern objects,
  medieval castles, recognizable screen costumes, or franchise imagery.
  No embedded text, letters, numbers, inscriptions, labels, logos, captions,
  speech bubbles, signatures, or watermarks.
