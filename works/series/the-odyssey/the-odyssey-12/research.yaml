notes:
  - "Task-scoped user exception to classic's verbatim-import default: preserve classic and Homer / 荷马 authorship while creating a HaiLibrary reading retelling. The complete Book XII at git 1208d108 and the live Gutenberg edition supply plot evidence. New locale prose is not Butler's translation or a literal Chinese rendering; source_url and translator do not mislabel it as an import."
  - "Retained: the promised oar burial, the two Sirens and tightened bonds, the route choice and Argo exception, Scylla's six heads and six victims, concealed danger and futile armor, the oath on landing, a month trapped by winds, hunger and Eurylochus's argument, the captain's divinely sent sleep, the gods' reported exchange, six days of eating, shipwreck and only survivor, return to Charybdis, the tree and timbers, nine-day drift and the tenth-night arrival."
  - "Retained in the instructions: the Wandering Rocks / strait choice, Argo and Hera, six victims versus the whole crew, Crataiis as the means to stop a second attack, and the Sun's seven herds and seven flocks of fifty cared for by Phaethusa and Lampetie. Scylla eats the men alive as they scream; Odysseus conceals her danger and disobeys the armor warning. Lampetie reports the slaughter to her father."
  - "Condensed: cliff and monster measurements, the rows of teeth and hunting comparisons, Charybdis's three daily cycles, the daughters' maternal genealogy, sacrificial anatomy and repeated feast descriptions. No different route, rescue, survivor or divine-information channel replaces the original."
  - "Claim inventory, both locale bodies: Siren song, the destructive rocks, immortal Scylla, Charybdis, the Sun's vengeance, moving hides, divine sleep and protection are mythology. They are not presented as real navigation, animal behavior, medicine or survival instruction."
  - "The Sirens' promise of future knowledge remains their enticing claim. Odysseus reports the divine conversation through Calypso and Hermes instead of witnessing it at sea. The conventional mythical Oceanus is not identified with a modern ocean current."
  - "The hungry crew's decision and the captain's concealment are preserved without adding moral commentary. Violent losses remain explicit but are not expanded with gore. The ending returns to the already narrated Calypso episode and closes the long first-person account."
