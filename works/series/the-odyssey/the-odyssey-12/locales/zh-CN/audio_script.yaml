audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    circe:
      display_name: 喀耳刻
      tts: {delivery: "笃定从容", timbre: "圆润深稳", pace: "舒缓", pitch: "中音"}
    siren_1:
      display_name: 塞壬甲
      tts: {delivery: "温柔邀引，富于韵律", timbre: "清亮流畅", pace: "舒展绵长", pitch: "中高音"}
    siren_2:
      display_name: 塞壬乙
      tts: {delivery: "轻柔邀引，音调连贯", timbre: "柔和圆润", pace: "舒展绵长", pitch: "中音"}
    eurylochus:
      display_name: 欧律洛科斯
      tts: {delivery: "警惕务实，说话坚持己见", timbre: "紧绷粗涩", pace: "稳中带急", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 岸边立起船桨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯继续讲离开亡魂之后的旅程。
        - id: ch01-b02
          speaker: odysseus
          text: |
            我们回到埃埃亚，先替埃尔佩诺尔办葬礼。不能再让他等了。身体和铠甲一同烧掉，海边垒了坟，把他用过的桨竖上去。
            喀耳刻送来食物。晚上，其他人睡在船边，她单独听我说了死者的事，再告诉我，接下来还会遇到什么。
            首先是塞壬。人一旦停下听歌，就再也回不到家人身边。她们的草地旁，都是被引去的人的遗体。
        - id: ch01-b03
          speaker: circe
          text: |
            船员要用蜡塞耳朵。你想听也行，让他们把你绑牢在桅杆上。到时你越求着松绑，他们越得收紧绳子。
        - id: ch01-b04
          speaker: odysseus
          text: |
            过了那里，可以走两条航道。一边是漂移岩，海浪和火会毁船，只有伊阿宋乘的阿耳戈号受赫拉帮助，才过去了。另一边夹在斯库拉和卡律布狄斯中间。
            斯库拉在高洞里，六条长脖子伸着六个头，一伸下来便取走六个人。卡律布狄斯在对面低处，把水一阵吸进，一阵吐出。若连船一起吸进去，谁也活不了。
        - id: ch01-b05
          speaker: circe
          text: |
            靠斯库拉那一侧快划。损失六人，总好过大家都死。
        - id: ch01-b06
          speaker: odysseus
          text: |
            那我就不能避着漩涡，同时挡住她？
        - id: ch01-b07
          speaker: circe
          text: |
            你杀不了她，还披什么甲？拖久了，她再伸一次，又是六个人。叫她母亲克拉泰伊斯来帮忙，拦住她，别让她再抓第二回。
        - id: ch01-b08
          speaker: odysseus
          text: |
            她还说到特里纳基亚。太阳神在那里有七群牛、七群羊，各五十头，女儿法厄图莎和兰佩提厄看管着。它们不生小的，也不自己死去。杀了它们，就得失去船和同伴。先知说过的危险，到阳光下还是没有变。
    - id: ch02
      title: 听见歌声的人
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            第二天走时，我向大家讲明塞壬的事，嘱咐怎样绑我。后来风停了，船员收帆划桨。我封住他们的耳朵，他们把我绑着，立在桅杆旁。两位塞壬看见船，就唱了起来。
        - id: ch02-b02
          speakers: [siren_1, siren_2]
          ensemble: duo
          text: |
            来呀，奥德修斯。希腊人、特洛伊人吃过多少苦，我们知道。听我们的歌，就会明白更多，连世间以后发生什么，也能告诉你。
        - id: ch02-b03
          speaker: odysseus
          text: |
            听着听着，我不想走了，使眼色叫他们放我开。他们反倒加快了桨。欧律洛科斯和珀里墨得斯又来加绳，捆得更紧。船远得听不见歌声，大家才拔出蜡，把我松开。
            前头忽然轰隆作响，水花往高处喷。众人一怕，连桨都丢开，船停住了。我赶紧一个个催。
            连独眼巨人的洞都逃出来了，再使劲划！别靠那翻滚的水，贴着岩石走。
            我没把斯库拉的危险告诉他们，怕他们知道后不肯动桨。而我自己也没听劝，套了甲，拿着两根矛守在船头，想从崖上找出敌人。
            漩涡吸走海水，底下的黑泥都看得见。就在我们望着它时，斯库拉从另一边抓来，六个同伴一下被举到高处。他们向我伸手，呼喊我的名字。她把活人送到洞旁，开始吃，他们还在惨叫着抓向我，我却救不了。那几只手，比一路见到的什么都让我痛苦。
    - id: ch03
      title: 誓言守到粮食耗尽
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            海峡过去，太阳神的岛近了。我听见牛叫，想起两位的警告，叫掌舵人不要停。欧律洛科斯却反对。
        - id: ch03-b02
          speaker: eurylochus
          text: |
            你是铁打的，我们会累会饿啊。让大家上岸吃一顿，睡一觉吧。天黑赶路碰上大风，怎么办？早晨再走。
        - id: ch03-b03
          speaker: odysseus
          text: |
            大家都赞成他，我只好答应。但每个人必须先发誓，不动那些牛羊，只用喀耳刻给的口粮。
            誓发完，我们在有淡水的地方停船。吃饱了，又想到死去的六人，说着哭着，才睡着。
            夜里大风起来，早晨把船拖去山洞躲避。我再提醒牛羊的事，他们又保证了一回。可一个月过后，风还拦着，粮酒却没有了，只能钓鱼捕鸟，找任何能吃的东西。
            我想请神指一条离岛的路，就走到内陆，避开风，离开众人祈祷。神偏让我睡了过去。这时欧律洛科斯在船边劝大家。
        - id: ch03-b04
          speaker: eurylochus
          text: |
            守着牛群挨饿？挑最好的献祭吧。能回家，我们就给太阳神建庙赔罪。他真要毁船，我宁可痛快淹死，也不要一点点饿死。
        - id: ch03-b05
          speaker: odysseus
          text: |
            同伴同意了，赶牛来，祈祷后便动手宰。粮食和酒没有，祭祀就用嫩叶和水。我醒过来往岸边去，先闻到了烤肉味。
            我向诸神喊，怨他们让我在那时入睡。回去把大家挨个问了一遍，已经太迟，牛死了。
            后来卡吕普索转告我神之间的话，是赫尔墨斯讲给她的。兰佩提厄先去告诉父亲，牛群被杀了。太阳神要补偿，不给，就到死者那里发光，不再照耀天空。宙斯保证，等船出海，用雷把它打碎。
            岛上也不对劲了。牛皮自己爬，烤着的肉、生的肉，全发出牛叫。他们还是吃了六天。第七天风弱下来，我们才动身。
    - id: ch04
      title: 漩涡上方的一棵树
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            陆地看不见了，云却黑压压罩在船顶。风扯断绳索，桅杆倒下，砸死掌舵的同伴。接着雷劈中了船，它燃烧着，旋转着，碎裂了。我的同伴落进海里，没有一个活下来。
            我还抓着龙骨，船壳已散开。漂来的桅杆上挂着皮绳，我用它把两根木头缚在一起，跨上去。风一转，又将我往漩涡那边送。
            天亮，卡律布狄斯把断木也吸了下去。我攀住无花果树，挂在上头，脚无处可踩，只能等。等到桅杆和龙骨再浮起来，我才松手跳进水，爬回木头上，用手划着离开。宙斯护着，斯库拉没再发现我。
            我漂过九天，在第十个夜晚到了卡吕普索的岛。她收留了我。这以后怎样，昨天已经讲给王与王后听了。
            故事绕回那一处海岸了。我不想再从头说了。
