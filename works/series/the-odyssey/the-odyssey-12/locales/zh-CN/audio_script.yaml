audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 用朴素的语言从容讲述史诗
        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，直接讲述亲身经历
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    circe:
      display_name: 喀耳刻
      tts:
        delivery: 笃定从容
        timbre: 圆润深稳
        pace: 舒缓
        pitch: 中音
    siren_1:
      display_name: 塞壬甲
      tts:
        delivery: 温柔邀引，富于韵律
        timbre: 清亮流畅
        pace: 舒展绵长
        pitch: 中高音
    siren_2:
      display_name: 塞壬乙
      tts:
        delivery: 轻柔邀引，音调连贯
        timbre: 柔和圆润
        pace: 舒展绵长
        pitch: 中音
    eurylochus:
      display_name: 欧律洛科斯
      tts:
        delivery: 警惕务实，说话坚持己见
        timbre: 紧绷粗涩
        pace: 稳中带急
        pitch: 中低音
    hyperion:
      display_name: 太阳神
      tts:
        delivery: 高傲威严
        timbre: 明亮强劲
        pace: 缓而有力
        pitch: 中音
    zeus:
      display_name: 宙斯
      tts:
        delivery: 笃定而不容置疑
        timbre: 深沉饱满
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 最后的叮嘱
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            船出了俄刻阿诺斯河，重回海上，我们继续航行，到了埃埃亚岛。那里同别处一样，看得到黎明，也看得到日出。把船拖到沙滩，我们上岸睡觉，等天亮。玫瑰色手指的黎明，这清晨的孩子，出现以后，我叫几个人去喀耳刻家，把埃尔佩诺尔的身体取来。伸进海里的海角上有树林，我们在那里砍柴，哭着悼念他，再办葬礼。尸体和铠甲烧成灰，就堆坟，立石头，把他用过的桨插在坟顶。

            喀耳刻知道我们从哈得斯归来，穿好衣服急忙来看。侍女跟着，拿来面包、肉和酒。她站在我们中间说话。
        - id: ch01-b02
          speaker: circe
          text: |
            活着就敢去哈得斯的宫殿，你们真有胆量！别人只经历一回死亡，你们却要经历两回。今天余下的时间，都留在这里，尽情吃喝，吃饱喝足。等明天天刚亮，再登船继续航行。我会把要走的路全交代给奥德修斯，每一处都讲明白，免得你们在陆上、海上再遇祸事。
        - id: ch01-b03
          speaker: odysseus
          text: |
            大家听她的，吃喝了一天。日头下去，天黑了，伙伴们就在船尾的绳缆旁睡下。她拉住我的手，让我去离人群远一点的地方坐，自己斜靠身边，问这一趟经历。我全部讲完，她又叮嘱我。
        - id: ch01-b04
          speaker: circe
          text: |
            到现在还顺利，往下这些话，你要细听，天神也会让你记住。前面先遇塞壬，她们能把靠近的人全迷住。谁不小心，驶近了，听到歌，家里妻子孩子就再也等不到他。塞壬坐在绿草地，歌甜得把人唱死。身边都是死人骨头，肉还挂着腐烂。你们要从旁经过，用蜡堵好每个人的耳朵，别听。你若愿意，可以自己听。让伙伴把你直立着绑在桅杆半腰的横木上，绳子的两头拴牢桅杆，这才有听歌的乐趣。你越求着解开，他们就越要绑紧。

            过了她们，有两条路，该选哪条，我没法给你一条清清楚楚的指示。我讲两种情形，你自己想。一边的岩石往外伸，安菲特里忒深蓝的海浪砸在上面，凶猛极了，诸神叫它漂移岩。鸟也过不去，连送神食给父亲宙斯的温驯鸽子，每回都让绝壁夺走一只，宙斯还得补一只。船到了那里，就没有再逃出的，海浪和旋转的火焰中，全是残船和死人。只阿耳戈号曾穿过，是那艘从埃厄忒斯那里回来的名船。要不是赫拉为了喜爱的伊阿宋带路，它也会撞在大石上。

            两块岩石当中，一块一直高到天上，顶端全藏在黑云中。那云从不离开，哪怕夏天和刚入秋，山顶还是看不清。就算人长着二十只手、二十只脚，也找不到能踏住的地方，爬不上去。岩壁直立，又光滑，像仔细磨过。半腰有个大洞，口朝西方，向着厄瑞玻斯，船必须从这面过。但洞太高，力气最大的弓手，也不能把箭送进洞里。斯库拉就藏在那里，声音听起来是小狗在叫，实际却是可怕的怪物，连神亲眼见了也会发抖。她有十二只长歪的脚，还有六条极长的脖子，每条脖子各顶一个吓人的脑袋。嘴里长三排牙齿，挤得紧紧的，片刻就能把人嚼死。她坐在洞的阴影深处，头却探出，向岩壁周围四面张望。海豚、狗鲨，连比它们更大的海兽，只要抓得着，就成了她的食物。安菲特里忒的水里，这些成千上万。她六个头同时出手，一张嘴带走一人。船从旁经过，没有哪条能让全船人平安。

            另一块矮些，相距不过一箭。上面一棵大无花果树，叶子很密，底下是卡律布狄斯的吸水漩涡。一天吐三回水，又吸三回。她吸的时候别过去，不然波塞冬也保不住你。贴紧斯库拉这边，越快越好地划。死六个人，总比全船死好。
        - id: ch01-b05
          speaker: odysseus
          text: |
            我问她，能不能躲开卡律布狄斯，又在斯库拉来伤人的时候，把她打退？
        - id: ch01-b06
          speaker: circe
          text: |
            你这不要命的，怎么总要打打杀杀！面对永生的神，也不愿服输。斯库拉死不了，又凶恶、又野蛮、又残忍，根本打不赢。只能快走，这才有机会。你若在崖下穿铠甲磨蹭，她再伸六个头，便又死六个。赶紧往前冲，大声喊她那个该遭殃的母亲克拉泰伊斯，让母亲拦她，不再扑第二回。

            然后你们会到特里纳基亚岛。太阳神在那里养七群牛、七群羊，每群五十，不会生幼崽，也从不减少。法厄图萨、兰佩提厄两位女神照看，是许珀里翁太阳神与涅埃拉的女儿。母亲把她们生下，喂到断奶，就送去那遥远海岛，让她们住下，照料父亲的牲畜。不伤它们，只想着回家，你们吃完苦，还有希望到伊萨卡。若伤了，先警告你，船和同伴都会毁。即使你还活着，也会丢尽伙伴，苦得很，拖到很晚才回去。
    - id: ch02
      title: 听见塞壬
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            她说完，坐着金色宝座的黎明已在天边出现，便回岛内。我上船叫大家解缆，船员入座，桨击灰色的海。那位机巧又强大的女神再送顺风，从后面稳定地吹着，把帆撑满。我们整理船具，交给风和舵手引路。

            心里有忧虑，我告诉大家，朋友们，不能只一两个人知道预言。我全说出来，大家无论死活，都明白将遇到什么。先要避开塞壬，她们坐在鲜花里，歌好听极了，只有我能听。你们把我立着绑在桅杆中段的横木，扎得不能挣脱，绳头系桅杆。我要是苦求松开，你们反而得绑紧。

            风顺得很，话刚讲完，船就到两位塞壬的岛边。忽然一点风也没有了，水面平得不起纹。大家卷帆收好，拿桨划出白色泡沫。我用剑把一大轮蜡切小，用有力的双手揉软，揉捏加上许珀里翁之子太阳神的光照，很快就软了。我逐个堵住他们的耳，众人绑住我的手脚，把我立在横木上系好，自己继续划。船驶得快，很快近得听见岛上的声音。塞壬发现我们靠岸，就唱起来。
        - id: ch02-b02
          speakers: [siren_1, siren_2]
          ensemble: duo
          text: |
            来呀，闻名的奥德修斯，阿开亚人的荣耀，听我们两个唱。驶过的人，谁不停下听这甜美的歌？听过以后，再走时会带着欢喜，也带着智慧。神在特洛伊城前，让阿尔戈斯人和特洛伊人吃过的苦，我们知道得清清楚楚。世上以后发生什么，都能告诉你。
        - id: ch02-b03
          speaker: odysseus
          text: |
            她们唱得太动听，我只想接着听，皱眉示意大家放我。大家却划快了，欧律洛科斯和珀里墨得斯又拿更结实的绳子加绑。直到歌再也听不到，他们才掏耳朵里的蜡，把我解开。
    - id: ch03
      title: 两处险境之间
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            刚过岛，就有大浪和水雾映入眼帘，轰鸣声震耳。整个海都响着冲水声，众人怕得松了桨。没人再划，船停在那儿。我挨个走去打气，说，朋友们，不是头一回危险了！比独眼巨人关住我们时，还差得远。那次靠我的勇气和办法活下来，这次也能活，过后再回想。现在听吩咐，信任宙斯，使劲划。舵手，尤其记住，船归你掌管，转开那些冒水雾的急流，贴着岩石走。不然一不留神，船就溜到那边，大家可全毁在你手里！

            众人依照命令行事。我仍没说出斯库拉的危险，知道只要听见，他们就会扔下桨，挤进船舱躲着。我只违背了一条严令，还是把自己的铠甲穿上了。手里再拿两支结实的长矛，站到船头。我想，我会先在那里看见岩中那头怪物，那头将害苦我伙伴的怪物。可是我盯着阴暗的崖壁，来回看了不知多少遍，眼睛望得发酸，始终不见她。

            我们恐惧地进了海峡，斯库拉在一侧，卡律布狄斯在另一侧吸进海水。她吐水，像大火烧的锅沸腾，溢出的水沫冲到两边崖顶。她再吸，水就在里头团团打旋，砸石头，响得耳朵发震。底下黑黑的沙泥都看得见，大家吓得魂都没了，只顾着盯那儿，觉得下一刻便没命。斯库拉就在这时突然扑下，抓去六个最好的伙伴。我既看船，也照看人，猛一抬眼，便是他们的手脚，在高处的空中挣扎，被怪物带走。他们最后绝望地喊我的名字。

            渔夫坐在突出海的石头上，拿长矛，投些饵骗小鱼，再用牛角做尖头的矛，一条条刺起来，把还喘气的鱼扔上岸。她就这样提着人，放上岩石，在洞口嚼起来。伙伴们痛得惨叫，临死还把手向我伸。这是我全部航程中，最让我难受、最叫人想吐的景象。
    - id: ch04
      title: 太阳神的牛
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            漂移岩、斯库拉、卡律布狄斯都过去了，我们来到太阳神的好岛。许珀里翁那些健壮的牛羊，在这里生活。我还没下船，就听见牛归圈的哞声，还有羊叫。忒瑞西阿斯的预言和喀耳刻的叮嘱，全想起来了。我忧虑地告诉伙伴，知道大家辛苦，但要听清，先知和埃埃亚女神都提醒过，得避开这受祝福的太阳神的岛，最可怕的危险在这里。把船转开。

            大家绝望了，欧律洛科斯更立刻顶撞我，半点不客气。
        - id: ch04-b02
          speaker: eurylochus
          text: |
            奥德修斯，你太狠了！你壮得不会累，好像铁铸的，可我们干这么多活，连睡都睡不够。你不肯让人上岸做顿好饭，却要黑夜里继续漂，白耗力气。晚上风最凶，最容易出事，突然来股西南风或西风，怎么逃？神只要不高兴，这种风常常毁船。还是顺着夜晚的要求，在船边弄晚饭，等明早再出海吧。
        - id: ch04-b03
          speaker: odysseus
          text: |
            大家都觉得他说得对。我明白，上天要害我们。我说，你们一群人对我一个，我只好听。但各位都得郑重发誓，遇着牛群、大羊群，绝不犯傻，一头也不杀。喀耳刻给的食物，吃那些就够。

            人们照办，誓发完了，船系进淡水溪边的港，众人上岸做饭。吃喝够了，又说起那六个可怜伙伴，被斯库拉带走吃掉。越说越哭，一直哭到睡熟。

            第三更，星星移过了天，宙斯忽然刮起风，转眼成了飓风。陆地和海罩上厚云，夜从天上扑来。清晨的孩子、玫瑰色手指的黎明来了，我们把船搬上陆地，拉到海仙女聚会跳舞的洞里。我又召来众人，说，船有酒食，千万别伤牛，不然要遭罪。这是无所不闻、无所不见的太阳神的牛羊。大家又答应听话。

            整整一个月，南风不停，始终没有别的方向，吹来的只有南风和东风。船里的谷物和酒还够时，伙伴即使饿，也不动牛群。等储存的食物全进了肚子，只能往更远处搜寻。他们带线和钩钓鱼，也捕鸟，遇见什么能吃的就抓什么，饥饿已经快把人逼死了。有一天，我往岛内走，想向上天求一条离开的路。把伙伴都留在身后，走到足够远，我找到一块风吹不着的地方，洗净手，向住在奥林波斯的各位神祈祷。没过多久，神便使我沉沉睡去，睡得很香。正是在我睡着的时候，欧律洛科斯给伙伴出了坏主意。
        - id: ch04-b04
          speaker: eurylochus
          text: |
            可怜的伙伴们，听我一句。怎么死都不好，饿死最糟！把最好的牛赶来，献给永生诸神，不行吗？若回了伊萨卡，替太阳神修座好庙，摆满各样贵重装饰。如果他非要报牛的仇，毁我们的船，众神也帮他，那就让它沉。我宁可吞下咸水，一下死干净，也不想在这荒岛一点点饿死。
        - id: ch04-b05
          speaker: odysseus
          text: |
            众人都赞同。健美的牛群就在船边不远吃草，他们挑最好的赶来，围着祈求。大麦没有了，拿嫩橡枝替大麦粉。祷告完，杀牛剖开，取出腿骨，包两层脂肪，上面放生肉。没有酒浇祭品，就不时浇些水，旁边烤着内脏。骨头烧完，内脏尝过，再把其余肉切小，串在叉上。

            我醒了，向海岸和船走近，闻见烤肉香，便呻吟着求告诸神，说，父亲宙斯，还有永远享福的诸神，这场睡眠真把我害苦了！我不在，你们看，这些人干了什么！

            兰佩提厄已经赶去告诉太阳神，说我们宰了牛。他气极了，向诸神喊。
        - id: ch04-b06
          speaker: hyperion
          text: |
            父亲宙斯，各位永享幸福的神，奥德修斯船上的人，我非惩罚不可。他们竟敢宰我的牛！每天升上天，或是往下落，那些牛都是我最喜欢看的。他们不赔我，我就下去哈得斯，给死人照亮。
        - id: ch04-b07
          speaker: zeus
          text: |
            太阳，你仍照着我们，照着肥沃土地上的人。我等他们出海，就送一道白霹雳，把船劈碎。
        - id: ch04-b08
          speaker: odysseus
          text: |
            后来卡吕普索把这些话告诉我。她说是赫尔墨斯亲口讲的。
    - id: ch05
      title: 最后一人
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: |
            到海岸，回到船上，我把伙伴一个个骂了，可牛已经死，没有办法挽回。神马上显了异兆，牛皮在地上爬，叉上的肉开始哞叫，不管熟了还是生的，全跟牛一样叫个不停。

            这群人一连六天，专挑最好的牛赶来，宰杀饱餐。克洛诺斯之子宙斯又添上了第七天，狂风的劲头才减弱。我们这才重新上船，竖起桅杆，张开帆，驶进大海。等离岛很远了，四周只能看见天和水，宙斯忽然把黑云聚到船顶，海面在云下也暗了。没再前行多远，一阵猛烈西风便撞来，扯断桅杆前面的支索。桅杆向船尾倒去，船上用具全跌进舱底。舵手在尾部，被桅杆迎头砸中，头骨碎裂，整个人像跳水似的掉出船去，命已经没了。

            宙斯再扔下霹雳，电光击船，船不停打转，里面满是火和硫磺。人都掉进水中，像一群海鸥，围着船浮动。神终于把他们回家的希望全夺去了。

            我一直攀住船。浪把两侧船板从龙骨拆开，龙骨独自漂着，桅杆也打脱，漂到它那边。桅杆上还带着结实的牛皮后支索，我用这根索捆好桅杆和龙骨，跨着漂，风想带去哪儿，就去哪儿。

            西来的大风耗尽了力气，风向转南。我害怕这样一吹，又要退回卡律布狄斯那吞人的漩涡。还真让我担心中了。波浪推着我过了一整夜，太阳升起来，斯库拉的岩石和漩涡已在眼前。她正在吸海里的咸水，浪却把我送高了，送到那株无花果树边。我赶快抓住，像蝙蝠那样悬吊。两只脚找不到能踩实的地方，根在很远处。那些覆盖整个水潭的巨大树枝，又太高，枝间距离也大，伸手也攀不着。我只能忍住，牢牢挂在那里，等漩涡把吞下的桅杆和木筏还给我。这一等，觉得长得没有尽头。

            陪审的人，在法庭被麻烦案子拖了许久，好不容易轮到回家吃晚饭，那该多么欢喜。可是他也不会比我更欢喜，因为我终于看见木筏开始从漩涡里浮上来了。

            我终于松了手脚，重重掉进筏旁的海，爬上去，用双手划。至于斯库拉，神与人的父亲让她看不见我，不然绝活不了。

            又漂了九天，第十天的夜里，诸神把我送上奥吉吉亚岛，强大的卡吕普索女神住那里。她把我收留，待我很亲切。可不用再讲了，昨天都告诉您和尊贵的王后了。同一个故事说一遍又一遍，我不喜欢。
