audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    circe:
      display_name: 喀耳刻
      tts: {delivery: "笃定从容", timbre: "圆润深稳", pace: "舒缓", pitch: "中音"}
    siren_1:
      display_name: 塞壬甲
      tts: {delivery: "温柔邀引，富于韵律", timbre: "清亮流畅", pace: "舒展绵长", pitch: "中高音"}
    siren_2:
      display_name: 塞壬乙
      tts: {delivery: "轻柔邀引，音调连贯", timbre: "柔和圆润", pace: "舒展绵长", pitch: "中音"}
    eurylochus:
      display_name: 欧律洛科斯
      tts: {delivery: "警惕务实，说话坚持己见", timbre: "紧绷粗涩", pace: "稳中带急", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 喀耳刻的叮嘱
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |-
            再到埃埃亚岛，我先派人带回埃尔佩诺尔的尸体，不能又把他落下。我们连同他的铠甲一起火化，在岸边堆好坟，再插上他用过的桨。
            喀耳刻拿来了食物。入夜，船员睡在船边，她让我到一边坐下，听完冥府的事，便说起接下来会遇到什么。
            第一处是塞壬。她们唱歌引来船上的人，听了不肯走的，妻儿就再也等不到他们。塞壬坐着的草地旁，全是死人的骨头。
        - id: ch01-b02
          speaker: circe
          text: 给船员的耳朵塞上蜡。你自己要听也行，叫人把你捆在桅杆上。千万告诉他们，你怎么求都别给你松绑，反倒得把绳子越捆越紧。
        - id: ch01-b03
          speaker: odysseus
          text: 塞壬之后，要选一条路。一条有漂移岩，浪和火焰会把过往船只毁掉。只有阿耳戈号过去了，那是赫拉帮伊阿宋，特地保护了船。另一条路，两边都有怪物。高高的山崖上，有个洞，斯库拉就住在那里。她伸着六条长脖子，六个头各能抓走一个人。对面低崖下面是卡律布狄斯，海水一会儿吞进去，一会儿吐出来。船要吸进去了，可没人救得了。
        - id: ch01-b04
          speaker: circe
          text: 靠斯库拉那边，能划多快就划多快。死六个人，总好过整船人都死。
        - id: ch01-b05
          speaker: odysseus
          text: 躲开漩涡的时候，就不能也挡一挡她？
        - id: ch01-b06
          speaker: circe
          text: 还想着打仗？她可杀不死。你别披甲应战，耽搁得太久，她还会再抓六个人。向她母亲克拉泰伊斯求救，让母亲拦住她，别抓第二次。
        - id: ch01-b07
          speaker: odysseus
          text: 她最后交代，特里纳基亚岛上养着太阳神的牛羊，七群牛，七群羊，每群五十头。他的两个女儿法厄图莎和兰佩提厄在看管。这些牛羊既不繁殖，也不会自然死去。我们绝对不能伤它们，否则船和人都得毁掉。这番话，先知已经警告过我一遍。
    - id: ch02
      title: 歌声与悬崖
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |-
            第二天启程，我先让大家明白塞壬的危险，说明该怎么捆我。快到时，海面没了风，只能收帆动桨。我塞好他们的耳朵，他们也把我直挺挺地绑在桅杆上。
            船一近，两位塞壬就唱歌叫我。
        - id: ch02-b02
          speakers: [siren_1, siren_2]
          ensemble: duo
          text: 奥德修斯，来这边听听吧。特洛伊人和希腊人受的那些苦，我们全知道。听完这支歌，你就能懂得更多，连世上将来的事，我们也能告诉你。
        - id: ch02-b03
          speaker: odysseus
          text: |-
            我哪里还肯走，马上使眼色，让同伴解开我。他们却更用力地划，欧律洛科斯跟珀里墨得斯还来加紧绳子。一直到歌声消失，他们才摘下耳蜡，给我松绑。
            刚过去，前面又轰隆作响，浪花直往高处喷。大家吓得连桨都握不住了，船停下来。我挨个催，独眼巨人都没能困住咱们，这回也能过去。拿起桨，躲开翻滚的水，朝岩壁划！
            我没告诉他们，斯库拉会捉走人。说了，他们或许缩在那里，再不肯动了。可我自己也没听劝，仍旧披甲，拿了两根矛站到船头，想找到她。
            卡律布狄斯一口吸下海水，黑色的泥底都露了出来。大家正害怕，斯库拉从另一边伸头过来，六个同伴就被提上了半空。他们向我伸手，叫着我的名字，被拖到洞口，活活吃掉。他们还在惨叫，还想抓住我，我却救不了。一路那么多灾难，这一幕最叫我痛苦。
    - id: ch03
      title: 不能碰的牛群
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: 船终于过了海峡。特里纳基亚就在前面，连牛叫都听清了。我记得两次警告，叫掌舵的继续开，不许上岸。欧律洛科斯却反对。
        - id: ch03-b02
          speaker: eurylochus
          text: 你像铁打的一样，我们可不行。大家又困又饿，让我们上岸吃顿饭吧。夜里航行，碰到风暴呢？睡一晚，明早再走。
        - id: ch03-b03
          speaker: odysseus
          text: |-
            大家都听他的，我只好让步，但先叫他们保证，一只牛羊都不杀，只吃喀耳刻给的食物。发了誓，我们才在淡水旁靠岸。吃罢饭，想起斯库拉抓走的人，又哭起来，哭累了就睡了。夜里风很大，早上拖船进洞，我再三警告别碰牛羊，他们也一再答应。可风向一个月都没变，我们走不成，口粮、酒都没了，只能捉鸟钓鱼，想尽办法找食物。
            有一天，我往岛里走，想找诸神祈祷，好让我们离开。找了个没人又避风的地方，刚开口，诸神就叫我睡着了。我不在时，欧律洛科斯又劝起大家。
        - id: ch03-b04
          speaker: eurylochus
          text: 怎么死也比饿死强。不如挑最好的牛献祭，能回伊萨卡，我们给太阳神建座好庙。若他非要报复，我宁愿一下子淹死，也不在这儿慢慢熬着。
        - id: ch03-b05
          speaker: odysseus
          text: |-
            众人答应，赶来牛，做过祈祷就杀。祭祀的谷物没有，用嫩叶代替，酒也没了，就往上洒水。我一觉醒来往回走，还没到岸边，就闻到了烤肉香。我怨宙斯，怨众神，为什么偏在这个时候让我睡着。到了船旁，又责问每个人。可牛已经杀了，问也迟了。
            诸神那边的事，是后来卡吕普索讲给我听的，她是听赫尔墨斯说的。兰佩提厄向父亲告状，太阳神索要赔偿，要有人替他的牛报仇。否则，他就不照耀天上，改去照冥府。宙斯答应了，等船一出海，就用雷电劈碎它。
            其实怪事就在眼前。牛皮在爬，烤架上的肉哞哞叫，生肉熟肉全在叫。他们却照吃不误，一连吃了六天。第七天，风终于减弱，我们才出海。
    - id: ch04
      title: 海上只剩一个人
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |-
            陆地看不见了，只剩海和天。一片黑云罩住船，狂风吹断支索，桅杆倒下，砸死掌舵的人。接着就是宙斯的雷电，船烧了起来，打着转碎掉。同伴全落进海里，谁也没活。
            我抓住船的龙骨，见断下的桅杆也漂近了，还带着皮绳，就把两根木头捆在一起，爬上去漂。风却又转了，带着我回到卡律布狄斯。又漂了一夜，天亮时刚好赶上它吸水，连木头也吞了。我攀住上方的无花果树，脚下踩不到东西，只好吊着等。
            等了好久，龙骨和桅杆才重新浮上来。我松手落水，爬回断木，用两只手划着离开。宙斯没让斯库拉瞧见，我这才保住命。
            漂满九天，第十夜才到卡吕普索的岛，她收留了我。后来的事，昨天已经说给王和王后听了。

            讲过的，我就不想再从头说一遍了。
