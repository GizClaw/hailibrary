  chapters:
    - id: ch01
      title: Circe's last directions
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            Once we were clear of Oceanus and back in the open sea, we sailed on to Aeaea. Dawn and sunrise come to that island as they do elsewhere. We drew the ship up onto the sand, stepped ashore and slept there until daybreak.

            When rosy-fingered Dawn, the child of morning, appeared, I sent men to Circe's house for Elpenor's body. We cut wood from the trees on a headland reaching into the sea. We wept for him and mourned him, then carried out his funeral. After his body and armor had burned to ash, we piled up a mound and set a stone upon it. At the top we planted the oar he had used in life.

            While we were doing this, Circe learned we had returned from Hades. She dressed and hurried down to us. Her servants came too, bringing bread, meat and wine. Standing among us, she spoke.
        - id: ch01-b02
          speaker: circe
          text: |
            You have dared to enter Hades while you were alive. Other people die once, but you will have died twice. Stay here for the rest of today and feast as much as you wish. Tomorrow, at dawn, you can sail again. Meanwhile I will explain the route to Ulysses. I will tell him everything, so that you can avoid disaster on the land and on the sea.
        - id: ch01-b03
          speaker: odysseus
          text: |
            We agreed to do everything she suggested. For the rest of that day we feasted, eating our fill and drinking until the sun went down. Once the sun had set and the darkness came, the men stretched out beside the cables at the stern of our ship and went to sleep. Circe took hold of my hand and asked me to sit with her some distance from the others. She lay down beside me there and questioned me about everything we had experienced. When I had finished telling her our adventures, she answered me.
        - id: ch01-b04
          speaker: circe
          text: |
            So far, all is well. Now listen carefully. Heaven itself will help you remember what I say. First you will meet the Sirens. Their song can enchant anyone who comes near. If a man draws too close without taking care and hears them, his wife and children will never welcome him home again. The Sirens sit in a green field, singing so sweetly that they sing their listeners to death. All around them are heaps of human bones, with flesh still rotting on them. Sail past. Put wax in your men's ears so none can hear. But if you wish, you may listen yourself. Have the crew tie you upright to the crosspiece halfway up the mast. They must fasten the ends of the ropes to the mast itself. Then you can enjoy the song. If you beg them to let you go, they must tie you more tightly.

            Beyond the Sirens, there are two possible ways. I cannot give you clear directions about which one to choose. I will describe them both and leave you to decide. On one side there are rocks that hang over the water. The deep blue waves of Amphitrite strike them with terrible force. The gods call them the Wanderers. Not even birds can pass safely there. Even the gentle doves bringing ambrosia to Father Jove lose one of their number to that sheer rock. Jove has to send another to fill its place. No ship that ever reached those rocks has escaped. The waves and whirling fires carry broken ships and the bodies of men. Only one vessel ever passed through, the famous Argo, returning from Aetes' house. She too would have struck the great rocks, if Juno had not guided her because she loved Jason.

            Of the two rocks, one reaches up to heaven, with its peak hidden in dark cloud. That cloud never clears, even in summer or early autumn. A man with twenty hands and twenty feet could not find a foothold to climb it. It rises straight up and is as smooth as polished stone. Halfway up is a great cave, facing west towards Erebus. You must take your ship along that side. But the cave is so high that even the strongest bowman could not shoot an arrow into it. Scylla lives inside. Her yelp sounds like a young dog's, but she is a dreadful monster. Even a god would tremble at the sight of her. She has twelve misshapen feet and six enormously long necks. On each neck sits a terrible head, with three tightly packed rows of teeth in its mouth. Those teeth could crush a man in a moment. She stays deep in the shadow of her cave and stretches her heads out, watching the rock on every side. She catches dolphins, dogfish and any larger sea creatures she can reach, among the thousands living in Amphitrite's waters. No ship passes her without losing men. She darts all six heads out at once, and each mouth carries one man away.

            You will find the other rock much lower than this one. Yet the two are so close together that the distance between them is no more than an arrow could travel. A large fig tree grows on that lower rock, with all its leaves spread out. Beneath the tree is Charybdis, the whirlpool that sucks the sea into itself. Three times every day she throws the water out, and three times she swallows it back down. Make sure you are not there when she begins to draw it in. If you are, not even Neptune will be able to rescue you. You must keep your ship close against the rock on Scylla's side and force her through as quickly as possible. It is better to lose six of your men than to lose everyone aboard.
        - id: ch01-b05
          speaker: odysseus
          text: |
            I asked her, Is there really no way for us to get clear of Charybdis and still keep Scylla from taking my men? Can't I hold her off when she attacks them?
        - id: ch01-b06
          speaker: circe
          text: |
            You reckless man. Must you always fight someone or something? You cannot bear to give way even to an immortal. Scylla cannot die. She is savage, violent, cruel and impossible to defeat. There is no remedy. Your best hope is to get past her at once. If you linger by the rock while you put your armor on, she can strike with those six heads again and take six more men. Sail past at full speed. Shout loudly to her mother, Crataiis, a curse on her. The mother will stop Scylla from attacking a second time.

            After that you will come to Thrinacia. The Sun has many cattle and sheep there, seven herds of cattle and seven flocks of sheep, with fifty animals in each. They never breed, and their numbers never fall. Two goddesses tend them, Phaethusa and Lampetie. Their father is Hyperion the Sun, and their mother is Neaera. When Neaera had borne and nursed them, she sent them to that distant island to live and look after their father's animals. Leave those flocks unharmed and think only of getting home. Then, after great hardship, you may reach Ithaca. But harm them, and I warn you that the ship and your companions will be destroyed. Even if you escape, you will arrive late and in misery, with every one of your men lost.
    - id: ch02
      title: Song and the straits
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            When she finished, Dawn began to show in the sky on her golden throne. Circe went back inland. I boarded the ship and ordered the men to cast off. They climbed in at once, took their places and struck the grey sea with their oars. Soon the great and clever goddess sent a fair wind to help us. It blew from straight behind and followed us steadily, keeping the sails full. We put the ship's gear in order and let the wind and the helmsman guide her.

            My mind was deeply troubled as I spoke to the crew. Friends, I said, what Circe has predicted should not be known to just one or two of us. You must all hear what she told me. Then, whether we are to live or die, we will know what we are facing. Her first warning was to keep away from the Sirens. They sit in a field of flowers, singing with extraordinary beauty. She said I could hear them, provided that nobody else listened. Take me and bind me to the crosspiece halfway up the mast, with my body standing upright. Make the bonds so strong that there is no chance of my breaking loose. Fasten both ends of the ropes to the mast itself. If I beg you to free me, no matter how much I plead, you must make those bonds tighter still.

            The fair wind had carried us on so well that I had hardly finished explaining all this before we reached the island where the two Sirens lived. Then the wind dropped without warning. Not the slightest breath stirred the air, and not a ripple moved across the water. The men rolled up the sails and stowed them safely, then settled to the oars. As they pulled, the water turned white with the foam of their rowing. I took a large round cake of wax and cut it into little pieces with my sword. With my strong hands I kept kneading those pieces until they softened. They soon yielded to the working of my fingers and the warmth of the Sun, the son of Hyperion. I used the softened wax to block the ears of every man. Then they tied me by my hands and feet to the mast, standing upright on its crosspiece, while they went back to their rowing. The ship was moving quickly when we came within hearing distance of the shore. The Sirens saw how close we were coming to their island, and they began their song.
        - id: ch02-b02
          speakers: [siren_1, siren_2]
          ensemble: duo
          text: |
            Come nearer, famous Ulysses, glory of the Achaeans. Hear our two voices. No one sails past us without stopping to listen to our sweet, enchanting song. The one who listens leaves delighted, and wiser too. We know every sorrow the gods brought on the Argives and Trojans at Troy. We can tell you all that will happen throughout the world.
        - id: ch02-b03
          speaker: odysseus
          text: |
            They sang so beautifully that I longed to keep listening. I frowned and signaled to the men to set me free. They rowed faster instead. Eurylochus and Perimedes tied me with stronger ropes. Only when we could no longer hear the Sirens did the crew take the wax from their ears and loosen my bonds.

            Immediately beyond the island I saw a great wave throwing up spray and heard a tremendous roar. The noise of rushing water filled the sea. The men were so frightened they let go of their oars. With no one rowing, the ship stood still. I went from man to man, urging them not to lose courage.

            Friends, I said, we have faced danger before. This is nowhere near as bad as being trapped in the Cyclops' cave. My courage and judgment saved us then, and we will live to remember this danger too. Now follow my orders. Trust Jove and pull with all your strength. Helmsman, listen closely. The ship is in your hands. Turn her away from those steaming rapids and keep her close to the rock. Otherwise she will slip out of your control, and before you know it she will be over there, and you will have killed us all.

            They obeyed. I said nothing about Scylla. If they knew of that terrible monster, they would abandon the oars and crowd together in the hold. I disobeyed Circe's strict command in just one thing. I put on my armor. Taking two strong spears, I stood at the bow. I expected to see the monster first from there, the creature in the rock who would do my men such harm. I searched the dark cliff again and again, straining my eyes, but could not see her anywhere.

            In great fear we entered the straits. Scylla was on one side, and on the other Charybdis was drawing down the salt water. When she threw it up, it boiled like a cauldron overflowing on a great fire. Spray flew to the tops of the rocks on either side. When she swallowed again, the water inside spun round and round. It crashed against the rocks with a deafening roar. We could see the bottom of the whirlpool, black with sand and mud. The men were frantic with fear. While all our attention was fixed on it, certain that any moment could be our last, Scylla struck. She snatched away my six best men. I was trying to watch the ship and the crew together. Suddenly I saw their hands and feet high above me, struggling in the air as she lifted them away. They called my name in one last desperate cry.

            A fisherman sits with his spear on a jutting rock and drops bait into the water to fool the little fish. His spear is tipped with an ox's horn. He catches the fish one by one and throws them gasping onto the land. Scylla lifted my men to her rock in just that way, still panting. At the mouth of her cave she chewed them up, while they screamed and held their hands towards me in their dying agony. In all my voyages, I never saw anything so sickening.
    - id: ch03
      title: The cattle of the Sun
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            Beyond the Wandering rocks, beyond Scylla and dreadful Charybdis, we reached the Sun's fine island. Hyperion's splendid cattle and sheep lived there. While we were still at sea, I heard the cows lowing as they returned to their yards, and the sheep bleating. I remembered the blind Theban prophet Teiresias and the careful warning Circe had given me to avoid this sacred island. I spoke anxiously to the men. I know how hard things have been for you, I said. But listen to the prophecy Teiresias gave me, and to Circe's warning about the Sun's island. She said our greatest danger would be here. Turn the ship away.

            The men were in despair. Eurylochus answered me at once, speaking insolently.
        - id: ch03-b02
          speaker: eurylochus
          text: |
            Ulysses, you are cruel. You are strong and never tire, as if you were made of iron. But your men are exhausted from work and lack of sleep. Now you won't let them land here and cook a proper supper. You order them back to sea, to wear themselves out through the hours of the night. The winds blow hardest at night, and do the most damage. What chance have we if a squall suddenly comes from the southwest or the west? Those winds so often destroy a ship when the gods turn against us. Let us do what the night calls for. We can prepare supper here beside the ship, and go aboard and sail again in the morning.
        - id: ch03-b03
          speaker: odysseus
          text: |
            The crew agreed with him. I could see that heaven meant to harm us. You leave me no choice, I told them. There are many of you and only one of me. But each of you must swear a solemn oath. If you see cattle or a large flock of sheep, you will not be mad enough to kill even one. You must be content with the supplies Circe gave us.

            They all swore. When the oath was finished, we moored in a harbor near a stream of fresh water. The men went ashore and cooked. After eating and drinking enough, they began talking about the poor companions Scylla had seized and eaten. That brought on their tears. They cried until they fell into a deep sleep.

            During the third watch of the night, after the stars had moved across the sky, Jove raised a wind that became a hurricane. Heavy clouds covered land and sea, and night leaped out of heaven. At the coming of rosy-fingered Dawn, the child of morning, we hauled the ship onto land and drew her into a cave where the sea-nymphs meet and dance. I gathered the men to speak to them again.

            Friends, there is food and wine aboard, I said. Take care not to touch the cattle, or we will suffer. Those animals and the sheep belong to the mighty Sun, who sees and hears everything. Once more, they promised to obey.

            The South wind continued without a break for an entire month. No other wind came to help us, only winds from the south and east. As long as we still had grain and wine aboard, the men kept away from the cattle when hunger came. But at last they had eaten everything the ship carried. They were forced to search further afield. They used hooks and fishing lines, caught birds and seized whatever else they could lay hands on, for they were close to starvation. One day I went up into the island to pray that heaven would show me some way for us to leave. I kept walking until I was far from every one of my men. There I found a place well protected from the wind. I washed my hands and prayed to all the gods who live on Olympus. After a while, the gods let me sink into a sweet and peaceful sleep.

            While I slept, Eurylochus was giving the others bad advice.
        - id: ch03-b04
          speaker: eurylochus
          text: |
            Listen, my poor friends. Every death is bad, but none is worse than starving. Why don't we take the best of these cows and sacrifice them to the immortal gods? If we get back to Ithaca, we can build a beautiful temple for the Sun and fill it with every kind of rich ornament. If he chooses to avenge these horned cattle by sinking our ship, and the other gods agree with him, then let it happen. I would rather swallow salt water and die at once than waste away from hunger on a deserted island like this.
        - id: ch03-b05
          speaker: odysseus
          text: |
            The other men agreed with Eurylochus. The beautiful cattle were feeding only a short way from the ship, so the men went out and drove in the finest of them. They all stood round the animals to say their prayers. There was no barley left to grind, so they substituted tender young shoots of oak for the barley meal. Once they had finished praying, they slaughtered the cows and prepared the carcasses. They cut the thigh bones out, covered them with two layers of fat, and placed pieces of uncooked flesh over the top. They had no wine left to pour as an offering over the sacrifice while it was roasting. From time to time they poured on a little water instead, as the entrails grilled over the fire. At last the thigh bones were burned, and the men tasted the cooked inner parts. Then they cut the remaining meat into small pieces and threaded them onto spits.

            By then my deep sleep was over, and I was walking back to the ship and shore. As I approached, I smelled roasting meat. I groaned and prayed. Father Jove, and all the gods who live in endless happiness, I said, you have done me a cruel injury by sending me to sleep. Look what my men have done while I was away.

            Meanwhile Lampetie went straight to the Sun and told him we had killed his cattle. He flew into a rage and spoke to the immortals.
        - id: ch03-b06
          speaker: hyperion
          text: |
            Father Jove, and all you gods who live in everlasting bliss, I demand revenge on the crew of Ulysses' ship. They dared to kill my cows. Those cattle were my greatest delight to look at, whether I was rising into heaven or coming down again. If they do not pay for what they have taken, I will descend to Hades and shine among the dead.
        - id: ch03-b07
          speaker: zeus
          text: |
            Sun, keep shining on us gods and on the people of the fruitful earth. As soon as those men put out to sea, I will strike their ship with white lightning and smash it into pieces.
        - id: ch03-b08
          speaker: odysseus
          text: |
            Calypso told me all this afterwards. She said she had heard it from Mercury himself.
    - id: ch04
      title: Alone on the sea
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            As soon as I came down to the shore and reached my ship, I went to each of the men separately and reproached him for what he had done. But none of us could see any way of putting things right now. The cattle had already been killed. The gods began at once to show us signs of their power, strange things happening among us. The skins taken from the cattle began crawling over the ground. The joints of meat threaded onto the spits gave out the lowing of cows. It did not matter whether the flesh was raw or had already been cooked. It went on making those sounds, just as the living cattle had done.

            For six days the men brought in the best animals and feasted on them. On the seventh day, Jove, the son of Saturn, let the storm die down. We went aboard, raised the mast, spread the sail and set off. Once the island was far behind and nothing was visible but sea and sky, Saturn's son gathered a black cloud over the ship. The sea darkened beneath it. We sailed little further. A terrible squall came from the west and broke the ropes supporting the front of the mast. The mast fell backwards, and all the ship's equipment crashed down into the hull. It struck the helmsman's head at the stern and shattered his skull. He fell overboard as if diving, already dead.

            Then Jove hurled his thunderbolts. Lightning hit the ship. She spun round and round, filled with flame and sulfur. All the men fell into the water. They drifted round the ship like sea-gulls, until the god took away every chance they had of reaching home.

            I clung to what remained of the ship until the blows of the sea knocked her sides right away from the keel. The keel was left floating on its own. The waves then struck the mast out of the wreck and sent it drifting towards the keel. There was still a strong oxhide rope, one of the mast's backstays, hanging from it. I took that rope and bound the mast and keel firmly together. Then I climbed astride the two pieces and let the wind carry me whichever way it chose.

            The gale from the west had finally used up its strength, and the wind began blowing from the south again. That frightened me. I feared being carried back into the dreadful whirlpool of Charybdis, and that was exactly where I went. Through the whole night the waves bore me along. At sunrise I was back at the rock of Scylla, beside the whirlpool. Charybdis was then drawing the salt water down. But I was carried high enough towards the fig tree to seize hold of it, and I hung there like a bat. I could find nowhere to plant my feet and make myself secure. The roots were far out of reach. The enormous branches spreading over the whole pool were too high above me, and too far from one another for my hands to grasp them. I had to hang there patiently, waiting for the pool to throw my mast and raft back out. How long that waiting seemed.

            A juryman kept in court by difficult cases is glad when he can finally go home to supper. He could not be more glad than I was when I saw my raft begin to work its way out again. At last I let go with hands and feet and dropped heavily into the sea beside it. I climbed back on and paddled with my hands. The father of gods and men kept Scylla from seeing me again. Otherwise I would certainly have died.

            I drifted for nine more days. On the tenth night the gods cast me ashore on Ogygia, where the great and powerful Calypso lives. She welcomed me and treated me kindly. I need not tell you that part again. Yesterday I told it all to you and your noble wife, and I dislike going over the same story again and again.
