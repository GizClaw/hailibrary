premise: >
  安葬同伴后，奥德修斯听取喀耳刻的指引。绳索让他经过塞壬，无法抵挡的斯库拉夺走六人。
  风将幸存者困在太阳神的岛，饥饿使誓言破裂；雷霆毁去最后一船，独自漂流的他抵达卡吕普索的岸。
