labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
premise: >-
  奥德修斯和儿子收走大厅的武器后，他以陌生客人的身份与妻子交谈。
  佩涅洛佩用衣物细节试探来客，老乳母却在洗脚时认出了旧伤。
  他抓住乳母喉咙，威胁泄密便连她也杀，再听妻子决定用丈夫的弓挑选求婚人。
characters:
  - { id: odysseus, description: "归来的丈夫，仍以乞丐装束隐瞒身份，等待反击的时机。" }
  - { id: telemachus, description: "知道父亲已归来的儿子，协助收走武器。" }
  - { id: penelope, description: "久候丈夫的女主人，用可验证的往事试探客人，准备以弓决断婚事。" }
  - { id: euryclea, description: "从旧伤认出自己喂养过的奥德修斯，在他抓喉威胁后承诺守密的老乳母。" }
  - { id: athena, description: "古希腊神话中的女神，协助父子行动并使秘密暂不泄露。" }
