    authority: "Getty Research Institute"
    claims:
      - "The Odyssey is traditionally attributed to Homer and has twenty-four books."
notes:
  - "2026-10-11: the user's task-specific request authorizes natural reading prose under classic / Homer, not verbatim import. Both locales are newly phrased reading retellings. The complete Book XIX at git commit 1208d108 is the comparison source."
  - "Condensed boundaries: the blameless-king agricultural comparison, Cretan population and language lists, detailed gifts and banquet preparation, repeated lamentations, and the nightingale's inset genealogy. The nurse's recognition and violent suppression are not replaced by a comforting handclasp or a generic warning about safety."
  - "Claim classification: Aethon's ancestry, hosting claim, wealth delay, Pheidon and Dodona report are explicitly invented cover-story claims, not confirmed travel history. Actual shipwreck and Phaeacian aid remain distinct. The scar's naming explanation and healing charm are literary genealogy and declared myth, not taught etymology or medical treatment."
  - "Knowledge continuity: Telemachus and Euryclea know the identity, Penelope does not. Athena diverts her attention during the basin accident. Odysseus's scar is covered again, and the bow contest is set for the following day."
  - "Bed-making refusal, Penelope's parents and son pressing marriage, the dream's dead geese versus waking live geese, and all-suitor death interpretation were checked in each locale. No translator commentary, numerical note, modern translation, or screen version is used. Media bytes are unchanged."
