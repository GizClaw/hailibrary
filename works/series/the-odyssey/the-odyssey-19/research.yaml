    authority: "Samuel Butler translation, Book XIX; 1900 translation in the consulted second-edition transcription"
    claims:
      - "Father and son remove the arms while women are locked away and Athena carries a golden lamp. Melantho again threatens the guest; Penelope rebukes her."
      - "Penelope recounts weaving and unweaving Laertes's shroud, pressure to remarry, and tests the visitor's story with clothing, the clasp, and Eurybates."
      - "The invented Aethon biography and false Thesprotian report are mixed with actual voyage events. Odysseus claims delay for wealth and an oracle consultation about open or secret return."
      - "Euryclea recognizes the boar scar. The episode recalls Autolycus, the naming, the hunt, wound, boar's death, treatment, gifts, and return to the parents."
      - "Odysseus grabs his nurse's throat, pulls her close, and threatens not to spare her during the killing of women if she reveals him. She offers a list of guilty and innocent women, which he rejects."
      - "Penelope's eagle-and-geese dream, horn and ivory gates, and the announced twelve-axe bow contest follow the recognition. Athena finally sends her sleep."
