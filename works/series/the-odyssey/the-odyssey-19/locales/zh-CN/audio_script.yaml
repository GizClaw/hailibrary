audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切坚定", timbre: "苍老温暖", pace: "沉稳", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    melantho:
      display_name: 墨兰托
      tts: {delivery: "尖锐轻慢", timbre: "清亮锋利", pace: "利落", pitch: "中高音"}
    autolycus:
      display_name: 奥托吕科斯
      tts: {delivery: "老练自信", timbre: "粗厚有共鸣", pace: "从容", pitch: "低音"}
  chapters:
    - id: ch01
      title: "收起武器"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯还在回廊里，心里想的是怎样靠雅典娜帮助，杀掉求婚人。过了一会儿，他叫住儿子。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            忒勒马科斯，把武器集中起来，我们往里面搬。他们问起，你就找个说法。告诉他们，搬走是为了免得烟熏。奥德修斯走的时候，这些武器可没这么脏，现在烟灰沾得到处都是。尤其要加上一点，怕宙斯使他们醉后吵架，拿武器伤了彼此，宴席和求婚都丢尽脸。眼前摆着武器，人有时就会忍不住动手。
        - id: ch01-b03
          speaker: narrator
          text: >-
            忒勒马科斯同意，便把乳母欧律克勒娅唤来。
        - id: ch01-b04
          speaker: telemachus
          text: >-
            乳母，先把女人们关到房里。我得把父亲留下的盔甲武器送进储藏室。我从小到大，父亲不在，这些东西就没人管，都成了黑的。搬进去，烟就熏不到了。
        - id: ch01-b05
          speaker: euryclea
          text: >-
            孩子，我倒愿你什么都亲自管，好好把整个家和所有财产照料起来。不过女仆都关住了，谁陪你去库房，谁替你提灯呢？她们本可以去的。
        - id: ch01-b06
          speaker: telemachus
          text: >-
            请那外乡人照明。吃了我家的饭，总得干点活，不论从哪儿来的都一样。
        - id: ch01-b07
          speaker: narrator
          text: >-
            乳母把女人们锁好。父子俩加快手脚，把头盔、长矛和盾送进去。雅典娜提着一盏金灯，在前面领路，光很柔和，又格外亮。忒勒马科斯看着周围，惊讶起来。
        - id: ch01-b08
          speaker: telemachus
          text: >-
            父亲，真奇怪！墙和椽木，还有横梁、支柱，全亮得像着了火。一定是天上的神下来了，就在我们这里。
        - id: ch01-b09
          speaker: odysseus
          text: >-
            嘘，别问，也别说。神做事就是这样。去睡觉吧，我留下来同你母亲和女仆们谈谈。你母亲心里难受，肯定要问我很多事。
        - id: ch01-b10
          speaker: narrator
          text: >-
            忒勒马科斯顺着火把的亮光，走过内院，到另一头自己平常住的房间。他躺到床上，一直睡到天亮。奥德修斯留在廊下，继续想如何和雅典娜一起收拾求婚人。
            佩涅洛佩下楼了，美貌像阿佛洛狄忒，也像阿耳忒弥斯。她惯常坐在火边，仆人便把椅子摆过去。银和象牙镶成卷曲花纹，那是伊克马利奥斯造的椅子，连着一体的脚凳，上面铺了厚羊皮。王后坐好，女仆们从女眷房出来。她们收走坏人们用过的桌子、剩下的面包和酒杯，倒掉火盆余烬，多添些柴，好让屋里明亮又暖和。墨兰托却又朝客人发起火。
        - id: ch01-b11
          speaker: melantho
          text: >-
            外乡人，你准备纠缠一整晚，还要偷看屋里的女人不成？到外头去吃你那顿饭！还不走，我拿着火的木头轰你！
        - id: ch01-b12
          speaker: narrator
          text: >-
            奥德修斯瞪着墨兰托。
        - id: ch01-b13
          speaker: odysseus
          text: >-
            姑娘，何必要冲我生这么大气？嫌我脏，嫌我穿得破？还是讨厌我跟一般流浪汉一样，没办法只好要饭？我以前也富，房子也好，帮助过许多如今我这样的人。不论谁来，不论要什么，我都愿意给。我家里仆人多，富裕人家的东西全有，可宙斯要拿走，便什么都不剩。所以你也留神。今天你仗着地位和傲气，在同伴头上作威作福，有一天也会失去。女主人可能不再信任你，奥德修斯也可能回来。这机会还没有断。退一步，照你的想法他死了，阿波罗也给他留着儿子。忒勒马科斯现在是成人了，女仆干坏事，他会知道。
        - id: ch01-b14
          speaker: narrator
          text: >-
            佩涅洛佩听到，转而斥责墨兰托。
        - id: ch01-b15
          speaker: penelope
          text: >-
            真是个不知羞耻的丫头！你做的好事，我看得清楚，有你好受的。我明明跟你说过，要问这位客人关于我丈夫的事。我总为丈夫伤心，你不是不知道。
        - id: ch01-b16
          speaker: narrator
          text: >-
            王后又吩咐女侍长欧律诺墨。
        - id: ch01-b17
          speaker: penelope
          text: >-
            给客人搬张椅子，铺上羊皮。他坐下来，能讲自己的经历，也能听我问话。我有些事情想知道。
        - id: ch01-b18
          speaker: narrator
          text: >-
            椅子很快搬来，羊毛皮也铺好了。奥德修斯坐下，佩涅洛佩问起他的来历。
        - id: ch01-b19
          speaker: penelope
          text: >-
            客人，先说说你叫什么，家在什么地方。你属于哪座城，父母又是谁？
        - id: ch01-b20
          speaker: odysseus
          text: >-
            夫人，在这世上走遍各处，又有谁敢说你的不是？你的好名声都传到天上了。我想到一位从来不做坏事的国王，他治理着强大勇敢的人民，遇事总是主持公道。正因为他这么有德行，土地长出许多小麦、大麦，树枝挂满果子，母羊不断生下羊羔，大海里也有数不尽的鱼。百姓在这样的王统治下，自然也做好事。不过，此刻我在你家做客，想请你暂且问别的事情，别提我的出身，别提我家里那些人。往事一被勾起来，心里的伤痛就会加重。我本来已满身愁苦，在别人家里坐着，不能整天流眼泪、发哀声，长久这么难受也不是办法。仆人可能会抱怨，甚至连你也受不了，觉得我两眼尽是泪，是因为酒喝得太多，脑袋发沉了。
    - id: ch02
      title: "织物与往事"
      blocks:
        - id: ch02-b01
          speaker: penelope
          text: >-
            外乡人，阿尔戈斯人出海去特洛伊，我丈夫也走的那一天，我的容貌身姿就都让神夺去了。他能回家管事，我在外人面前也会更好看、更受敬重。如今只有操心，只有上天给我的重重痛苦。那些岛上的首领，杜利基翁、萨墨、扎金索斯的，加上伊萨卡本地的，都来求婚，我又不愿嫁。他们就耗在我家，糟蹋财产。哪还能顾得上外来的客人、求救的人，甚至有本领的工匠？我一刻不停地思念奥德修斯。他们逼我马上再嫁，我就只好动脑筋拖。起先神让我想到了一个办法，我在屋里架起大绣架，动手织一大幅精细的布。我告诉他们，各位爱慕我的人，虽然奥德修斯确已去世，也别立刻要我嫁。让我把手上这件做完，总别让一身针线本事白白没了。我给英雄拉厄尔忒斯做块裹尸布，预备死神带走他那天用。他那么富，安葬时没有裹尸布，女人们一定要议论。求婚人听了，都愿意等。于是白天织，晚上点着火把又拆。我瞒了三年，他们始终不知道。月亮一轮轮亏缺，日子越过越多，进了第四年，家里那些坏丫头出卖了我。求婚人闯进屋，把我当场抓住，大发脾气，非叫我织完，我不愿也不行。现在实在没新办法了。父母催得紧，儿子看着他们糟蹋自己的财产，也气得受不住。他长大了，已经懂得怎样管家，有能力做，上天还给他很好的性情。不过我的事说完了，你还是回答我吧。你的父母总不会没有，难道你是石头、橡树生出来的？
        - id: ch02-b02
          speaker: odysseus
          text: >-
            夫人，既是奥德修斯的妻子一定要知道，那再痛我也说。流落这么多年，在许多民族中间遭那么多难，谁回想都要难受。你所问的，我全部讲给你听。海中央有个富饶漂亮的克里特岛，人口密密，城有九十座，语言也多，各种话杂在一起。有阿开亚人，有勇敢的埃忒俄克里特人，有分成三支的多利安人，还有高贵的佩拉斯吉人。克诺索斯是座大城，从前由弥诺斯统治，每九年，他能亲自和宙斯交谈。弥诺斯的儿子叫丢卡利翁，就是我的父亲。他生了两个儿子，哥哥伊多墨纽斯去了特洛伊，我是弟弟，叫埃通。哥哥的勇气也胜过我。我在克里特接待过奥德修斯，他去特洛伊时，被风从马勒亚海角吹偏，到了厄勒梯亚洞窟前的阿姆尼索斯。那地方难进港，风又这么急，几乎没处躲。一上岸，他便到城里找我哥哥，自称两人是亲厚的老朋友。可哥哥已经出发十天或十二天了。我只好亲自招待，带他回家，家里东西丰足，自然什么都拿出来。我还为他的部下从公仓取大麦粉，请众人捐出酒和牛，让他们要怎么祭神，就怎么祭神。北边的风刮得人站在陆地都站不稳，他们就留了十二天。我想，是哪个敌视他们的神兴起了风。直到第十三天风才停，他们也才驶走。
        - id: ch02-b03
          speaker: narrator
          text: >-
            奥德修斯还讲了不少这样听来可信的故事。佩涅洛佩的心软下来，不断流泪。山顶的雪遇上东南风和西风，就融化成水，涨满河道。她为丈夫流的泪，也是这样漫过脸颊，而丈夫明明就坐在她旁边。奥德修斯很心疼，却把双眼定住，硬得像兽角，像铁，一下也不颤，凭本领把泪强忍着。佩涅洛佩哭过稍好，便开口试他。
        - id: ch02-b04
          speaker: penelope
          text: >-
            你说款待过我丈夫和同行的人，我想证实一下。能说出他的衣着和长相吗？他的伙伴，你也描述描述。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            他从我家走开到别的地方，已经二十年了，夫人。太久，我只能把还记得的讲出来。身上是紫羊毛的披风，衬里双层，靠一枚金胸针扣合，针有两个扣环。胸针上刻着狗和一头带斑点的小鹿。狗用前爪夹着小鹿，往下盯，小鹿倒地喘气，挣扎得浑身抖，想从狗扼住它的地方逃掉。金子做得如此活灵活现，人人称奇。贴身的衣服很柔，像洋葱皮那样贴合，太阳一照就发亮，女人看了都羡慕。不过有一点，我可不知道这身衣服是他家里带出来的，还是伙伴途中给的，或某位留宿的主人送的。他朋友多，阿开亚人里也少有谁能比得上。我另外送了他青铜剑，好看的双层衬里紫披风，还送一件长到脚面的衣服，恭恭敬敬地把他送上船。他跟前有个仆人，比他年长一点，肩背驼着，皮肤黑，头发又浓又卷，叫欧律巴忒斯。这人最合他性情，所以比旁人都亲密。
        - id: ch02-b06
          speaker: narrator
          text: >-
            这些细节没法怀疑，佩涅洛佩更加动情。又一阵泪落下，等心里缓了些，她回答。
        - id: ch02-b07
          speaker: penelope
          text: >-
            我原来就可怜你，今后在这个家，你会得到敬重，随时受欢迎。你讲的衣裳是我送的，从库里取出，亲手叠好，还有那枚金针，也是我给他的饰物。可我再没有机会接他回家。去那座可恨的城，真是坏命运！连那城的名字，我都不愿意说。
    - id: ch03
      title: "归期与洗脚的老妇"
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: >-
            奥德修斯的妻子，夫人，请别这样把自己愁得憔悴。话虽如此，我哪能怪你？爱过丈夫，又给他生下孩子，他不在了，哪怕还远远比不上神一样的奥德修斯，也会让妻子难过。不过先收收泪，听我的消息。我一句不瞒，所说的都是真事。最近我听到，奥德修斯仍活着，在回家的路上。他在忒斯普罗提亚人那里，向这个向那个求得很多珍宝，要带着回来。只是从特里纳基亚岛出来后，他的船和同伴都没了。部下杀了太阳神的牛，宙斯和太阳神发怒，所有船员都淹死，一个没剩。奥德修斯抱着龙骨，漂到了费埃克斯。他们和不死的神灵沾亲，待他跟待神一样，送许多礼，还打算安全送他回家。本来早该回来了，可他宁愿各国走走，多积点财。世上还活着的人，谁也没有他那么机灵，算计得那么巧。消息是他们的国王斐冬告诉我的，他在宫里奠酒的时候还发过誓，说海边船已经齐备，送他回国的人也齐了。碰巧有船驶往种小麦的杜利基翁，斐冬先让我搭船走。走前让我看奥德修斯的财宝，全放在王宫，够家里十代人享用。奥德修斯当时去了多多纳，要从高大的橡树那里问宙斯，离家多年，如今该公开归来，还是暗暗回来。所以你知道，他没有危险，近得很，也快得很，不能老在外面。我再请最强、居首的神宙斯，和我面前你家的炉灶作证，话一定应验。今年内，他必到，就在这个月转到下个月的时候。
        - id: ch03-b02
          speaker: penelope
          text: >-
            如果是真的，该多好。到时我给你的厚礼和友情，会让人人看见都来贺喜。但我知道结果，丈夫不会归来，也没有人能护送你上路。世上曾有奥德修斯，这确定无疑。可家里如今再没有这种主人，能招待体面的外乡人，护送他们回家。女仆们，给客人洗洗脚，再铺一张榻，毯子被褥都备好，让他温暖安稳地睡到清晨。天亮再帮他洗浴擦油，来廊下跟忒勒马科斯吃饭。那群可恶的人，谁欺负他，我就不许谁再踏进家门，不愿意也不行。客人，要是我任你一身脏污、衣服破烂，在廊下吃东西，你怎么知道我心地、见识比别的女人好不好？人一生那么短，狠心对别人，活着有人骂，死了也有人轻视。心正，行为公道，人就会把好名声传到各国，很多人也会称他有福。
        - id: ch03-b03
          speaker: odysseus
          text: >-
            夫人，离开克里特积雪的山、坐上船以后，我就不再用被子毯子。我过去许多晚睡不着，就那样在简陋的地方等天明，如今也照旧。我也不想洗脚，更不会让年轻丫头碰。要是你这里有个上了岁数、品行好的女人，也像我这么受过苦，我倒肯让她洗。
        - id: ch03-b04
          speaker: penelope
          text: >-
            来过我家的客人，讲起话没有谁像你这样句句妥帖。我有这样一位老仆，十分可靠。可怜的丈夫出生那晚，就是她把他抱住，小时候又喂奶养大。现在虽然没力气了，洗脚还是能做。欧律克勒娅，来，替主人这个同龄人洗洗。我想奥德修斯的手脚如今也老成这样，苦难催人老得太厉害。
        - id: ch03-b05
          speaker: narrator
          text: >-
            老乳母拿两手遮住脸，流泪哀叹起来。
        - id: ch03-b06
          speaker: euryclea
          text: >-
            我的好孩子，想起你，我真无计可施。谁都不如你敬神，为什么宙斯还恨你？给他烧腿骨，有谁比你多，献百牛祭，又有谁比你的好？你只想健壮地活到老，看儿子长成像你的人。可偏是你，宙斯不让回家。假如奥德修斯去了哪一国宫殿，我看那里的女人也一定拿他取笑，像我们这些坏丫头对待你一样，客人。她们嘴那么坏，你不肯让她们伺候，我懂。主人让我给你洗，我很乐意。既为佩涅洛佩，也为了你，你太让我怜惜了。而且有句话，你得听。家里来过那么多遭难的人，还真没人身子、声音、脚，都像你这样，简直和奥德修斯一样。
        - id: ch03-b07
          speaker: odysseus
          text: >-
            以前有人同时见过我们，也常说像得少见。今天连你也看出了相像。
    - id: ch04
      title: "那道旧伤疤"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            欧律克勒娅把洗脚盆搬来，先添许多冷水，再兑热的，调到温温的。奥德修斯原本坐在火边，这时忽然想到腿上的疤，赶紧把身子转开，避着亮处。乳母摸到腿，万一认出来，一切都会暴露。
            她果然认得，手刚开始洗，那伤疤就让她知道是谁了。伤是野猪造成的，地点在帕尔纳索斯山，奥德修斯当年跟外祖父和舅舅们在那儿打猎。外祖父奥托吕科斯真是了不起，论偷东西、作假誓，谁也比不过他。那本事还是赫尔墨斯给的。他常烧山羊和小山羊的腿骨献给神，所以赫尔墨斯喜欢与他往来。
            有一次，奥托吕科斯来到伊萨卡，女儿才生下婴儿。他吃过晚饭，欧律克勒娅就把小孩子放到他腿上。
        - id: ch04-b02
          speaker: euryclea
          text: >-
            给外孙起个名吧，奥托吕科斯，你盼这么一个孩子可盼了很久。
        - id: ch04-b03
          speaker: autolycus
          text: >-
            女儿、女婿，听我的。我这些年，对各地许多人都怀着愤怒，男的女的都有。就叫奥德修斯，叫怒意之子吧。他长大，来母亲娘家探亲，到我的帕尔纳索斯山庄园，我会有礼物给他，叫他高高兴兴回去。
        - id: ch04-b04
          speaker: narrator
          text: >-
            为了这份许诺的礼，奥德修斯长大后便去了帕尔纳索斯。奥托吕科斯和儿子们握着他的手欢迎，外祖母安菲忒娅搂住他，亲头，亲他美丽的双眼。外祖父让儿子们做饭，他们就牵来一头五岁公牛，剥皮料理，切成大块，再细切成小块，穿上烤叉。烤熟分开，各人都拿到足够一份。大家从白天吃到太阳落山，个个尽兴。天一黑，就去上床，享受好睡眠。
            黎明来了，清晨的女儿伸出玫瑰色的手指。舅舅们带狗上山，奥德修斯也跟去。他们沿着林木茂盛的山坡爬，很快到了有风吹过的高谷。太阳刚从俄刻阿诺斯静静、缓缓的水流中升起，照上田野，猎人就进了一道山沟。猎狗在前追踪，他们在后面紧跟，奥德修斯拿着长矛，也紧挨狗群。
            灌木里面，有一头很大的野猪窝着。枝叶长得挤在一起，风吹不进去，雨也落不进去，连太阳的光都进不去，下面铺了一层又一层落叶。猎人越来越近，野猪听到四面的狗叫，也听到人踩过地面的脚步。它一下冲出藏身的地方，脖子上的鬃毛根根立起，眼里像在冒火，站定准备迎战。奥德修斯是头一个举矛刺过去的，可野猪比他还快，从侧面猛冲，把他膝盖上方撕出一道深口子。伤很深，好在没有碰到骨头。他朝野猪右肩还了一矛，尖头直穿过去。野猪跌进尘土，不住呻吟，终于没了气。舅舅们一边料理野猪的尸体，一边给奥德修斯裹好伤口，还念出咒语让血止住。接着，大家能走多快就走多快，赶回了家。外祖父和儿子们替他把伤完全医治好，又拿出精美的厚礼。双方满怀亲情道别，奥德修斯才回到伊萨卡。父母迎到儿子，心里十分欢喜，要听一路的经历，也想知道为什么伤了腿、留下这个疤。他便说起和奥托吕科斯、舅舅们在帕尔纳索斯山狩猎，野猪怎么冲过来，把自己撕伤的经过。
            现在，乳母双手握着这条带疤的腿，刚认出，脚便脱手落下。水盆当啷一声，翻倒，水泼了一地。她又难过又欢喜，眼中全是泪，半晌不能说话，然后抓住他的胡子。
        - id: ch04-b05
          speaker: euryclea
          text: >-
            你是我的孩子，是奥德修斯啊！直到真的用手摸着，我才认得你。
        - id: ch04-b06
          speaker: narrator
          text: >-
            她朝佩涅洛佩望，似乎要把丈夫已到家的事告诉她。但雅典娜引开了王后的注意，她没朝这边看，也不知道眼前发生什么。奥德修斯右手抓住乳母喉咙，左手把她拢近。
        - id: ch04-b07
          speaker: odysseus
          text: >-
            乳母，我吃你的奶长大，你难道要害我？二十年漂泊，终于进了家门。神既叫你识破，就别开口，更别向别人说。一旦泄露，只要神让我杀掉求婚人，我杀那些女人的时候，也不会放过你。你是乳母也不例外，这话一定算数。
        - id: ch04-b08
          speaker: euryclea
          text: >-
            孩子，你何必这么讲？我有多牢靠，你还不知道？我像石头、像铁，折不弯，也折不断，秘密绝不出去。你还记着，等神让你打败求婚人，我会把女仆谁有罪、谁无辜，都告诉你。
        - id: ch04-b09
          speaker: odysseus
          text: >-
            不用讲这些，乳母。每个女人怎样，我自己能判断。你保持安静，其余的听诸神安排。
        - id: ch04-b10
          speaker: narrator
          text: >-
            欧律克勒娅去取另一盆水，因为刚才全倒了。她把脚洗好，涂上油。奥德修斯把椅子往火跟前挪来暖身，用破衣把伤疤盖严。这时候，佩涅洛佩又对他说话。
    - id: ch05
      title: "梦的门与十二把斧"
      blocks:
        - id: ch05-b01
          speaker: penelope
          text: >-
            客人，我还想简单讲件事。该歇息了，至少有的人虽伤心，还睡得着。可上天给我的痛，简直没有尽头。白天干活、照管仆人时，我都不断哭，不断叹气。到了晚上，大家都睡了，我还睁眼想，心里受尽折磨。我想到那只褐夜莺，潘达瑞奥斯的女儿。初春，她藏在最密的树荫下，一声一声变着哀调啼唱，哭的是她误杀了自己的儿子伊堤洛斯，孩子的父亲泽托斯是位王。我的心就和那歌声一样辗转。到底是守着世人的看法、守着亡夫的记忆，留下来同儿子保护财产、奴仆、家门的尊严，还是选求婚人里最好的跟着走？他们又讨好我，又拿好礼物来。孩子小的时候，我一说离开父亲的家，他就不答应。现在长大了，倒一心求我嫁人，因为那些人不停吃他的家产，他恨得很。还有个梦，请你听，也替我想想意思。我养着二十只鹅，平常让它们在槽里吃糊料，我可喜欢了。梦中来了只大鹰，从山上冲下来，把弯嘴扎进鹅脖子，一只只全杀死。它自己飞上天，院里丢下一地死鹅。我在梦里哭得太悲切，女仆都围了过来。可那鹰后来又回来，站在伸出的屋椽上，说起了人话，叫我别再哭。
        - id: ch05-b02
          speaker: odysseus
          text: >-
            伊卡里奥斯的女儿，别害怕，拿出勇气。这并非寻常的梦，而是一定实现的好预兆。鹅就是求婚人，我也不是鹰了，我是回到你身边的丈夫。那些求婚人，我会让他们丢脸地死去。
        - id: ch05-b03
          speaker: penelope
          text: >-
            随后我就醒了。往外一看，鹅全在，像每天一样吃着槽里的食。
        - id: ch05-b04
          speaker: odysseus
          text: >-
            夫人，用不着另找说法。丈夫在梦里已亲口说过结果。那是指这些求婚人要死，任何一个都跑不了。
        - id: ch05-b05
          speaker: penelope
          text: >-
            客人，梦这种东西很奇怪，想把意思弄懂也难，绝不能以为每一个都会应验。那些看不见形体的幻象，各从两道门中的一道来到我们面前。一道是角造的，另一道是象牙造的。象牙门放出来的梦，只会骗人，终究是一场空。角门来的，却会让梦里所见变成事实。但我自己的这场梦，我不觉得它走了角门。如果它真的来自那里，儿子和我都会感激得不得了，多么希望能这样！另外，还有件事请你牢牢记住。下一回黎明来，就是个不好的日子，我要从奥德修斯家离开了。我要办一场用斧头的竞赛。从前丈夫在这院子里放上十二把斧，一个接一个立好，就像造船时候下面撑着的一排架子。他站到离它们远的地方，再用一支箭，射穿全部十二把。我会叫求婚人也照着试。谁最轻易给弓上弦，再把箭穿过每一把斧，我就跟他离开。我合法丈夫的宅子，这么美，又有这么多财富，我也得留下。可走了以后，我相信，连做梦时都会想起它。
        - id: ch05-b06
          speaker: odysseus
          text: >-
            夫人，就照你定的比，不要往后拖。无论那些人怎么弄，没等他们把弓张好、让箭穿过铁斧，奥德修斯已经回来了。
        - id: ch05-b07
          speaker: penelope
          text: >-
            你要肯一直讲，我就肯一直坐着听，不想睡。不过人总不能永远醒着，神给地上的人安排了万事的时辰。我也该上楼，回那张床去。丈夫去那座讨厌的城以后，那张床没有一天不湿着我的泪。
        - id: ch05-b08
          speaker: narrator
          text: >-
            佩涅洛佩和女仆们上楼，回到她自己的卧房。她在那里为心爱的丈夫哭泣，直到雅典娜让甜甜的睡意盖住了她的双眼。
