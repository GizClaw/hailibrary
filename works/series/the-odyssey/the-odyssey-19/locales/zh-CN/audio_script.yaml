audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切坚定", timbre: "苍老温暖", pace: "沉稳", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: "先收起武器"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            求婚人全走了，厅里静下来，只听见柴火轻轻响。奥德修斯朝墙边示意，忒勒马科斯便明白，该趁母亲下楼以前藏好武器。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            若有人追问，你告诉他们，盔甲让烟熏坏了，得换个地方存放。还有，喝过酒的人容易吵起来，刀和矛偏又伸手就能拿。万一伤了人，怎么是好？把兵器收起来，也防这件事。
        - id: ch01-b03
          speaker: narrator
          text: >-
            儿子让欧律克勒娅锁好女仆们的房间。她问谁来举灯，他便说，客人不能白吃饭，该做点事。父子把盔甲盾矛搬进储藏室，雅典娜在前面提着金灯，墙和梁全亮了。
        - id: ch01-b04
          speaker: telemachus
          text: "快看，上面简直像着了火！"
        - id: ch01-b05
          speaker: narrator
          text: "那是雅典娜在照路。"
        - id: ch01-b06
          speaker: odysseus
          text: "别出声，神的事别打听。你去睡吧，母亲还得向我问话。"
        - id: ch01-b07
          speaker: narrator
          text: >-
            东西收好，儿子去睡了，奥德修斯又回到火边。他终于能与妻子说话，却不能让她认出自己。
    - id: ch02
      title: "知道紫斗篷的客人"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            佩涅洛佩走到楼下，女仆们正在收走剩酒和杯盘。墨兰托又冲老人发作，说他不出去，就用烧着的柴把他赶走。奥德修斯警告，别因为自己有财物、受女主人喜爱，就总以为不会失去。她的男主人还有回来的可能。即使他不在了，留下的儿子如今已成人，会留意女仆们怎样做事。王后也斥责墨兰托，自己明明告诉过她，今晚要见客人，打听丈夫。欧律诺墨这才拿来椅子，垫上羊皮，让老人坐在王后对面。
        - id: ch02-b02
          speaker: penelope
          text: "听说你去过许多地方。你的家乡是哪儿？"
        - id: ch02-b03
          speaker: odysseus
          text: "我不愿再说从前的家。"
        - id: ch02-b04
          speaker: penelope
          text: >-
            我家的事你也听够了吧。他们天天逼我选丈夫。东西吃光了，还能给儿子留下什么？
        - id: ch02-b05
          speaker: narrator
          text: >-
            她曾许诺先给年老的拉厄尔忒斯织完寿衣，再谈婚事。老人就是丈夫的父亲。大家白天看着她织，晚上她却把线拆掉。这样撑了三年，一个女仆泄密，求婚人夜里闯来，撞见她拆线，只好把布织完。
        - id: ch02-b06
          speaker: penelope
          text: >-
            忒勒马科斯已不是孩子，看得懂那些人怎样糟蹋财产，却不能挡住他们。连我父母也在催，要我拿定主意。可我现在想问的是你。你总有自己的父母，有从小长大的地方，也一定能说出家乡叫什么。
        - id: ch02-b07
          speaker: narrator
          text: >-
            奥德修斯编起身世，说自己叫埃同，父亲丢卡利翁，哥哥伊多墨纽斯，家在克里特。奥德修斯当年去特洛伊，被风吹来找哥哥，可哥哥已出海了。自己招待了他和船员，等到第十三天才得以开船。佩涅洛佩听得直哭，丈夫心里难过，却把眼泪忍住了。她要试一试这番话。
        - id: ch02-b08
          speaker: penelope
          text: "他穿的什么？"
        - id: ch02-b09
          speaker: odysseus
          text: "紫斗篷，两层叠着，用金扣别好。"
        - id: ch02-b10
          speaker: penelope
          text: "扣子什么样？"
        - id: ch02-b11
          speaker: odysseus
          text: "一条狗咬着小鹿。做得像活的，鹿要挣脱，狗却不松口。"
        - id: ch02-b12
          speaker: narrator
          text: >-
            佩涅洛佩把手停在膝上。紫斗篷是自己叠过的，金扣也是自己替丈夫选的。她再问内衫，老人又答得对。连丈夫带着的随从，他也说得清楚。欧律巴忒斯比奥德修斯年纪稍大，肩背微驼，肤色深，头发卷曲，主人尤其信任他。佩涅洛佩低头，眼泪又落下来。她终于肯定，来客见过丈夫，愿意在家里厚待他。可真正的丈夫就坐在对面，她还是不敢盼他归来。
        - id: ch02-b13
          speaker: penelope
          text: "至少，你真见过他。"
        - id: ch02-b14
          speaker: odysseus
          text: "我还听过他后来的事。"
        - id: ch02-b15
          speaker: narrator
          text: >-
            奥德修斯继续把真经历和假消息混起来讲。部下杀太阳神的牛，惹得宙斯毁船，所有同伴都死了。他独自漂到费埃克斯人那里，受到款待，拿到厚礼。随后他又编造，奥德修斯为多得些财富，才把回家的日子往后拖。忒斯普洛提亚的斐冬王给自己看过那些宝物，也备了送他回乡的船。那人却去了多多纳，向宙斯的橡树打听，到底该让人看见自己回来，还是暗中归来。他拿宙斯起誓，也拿眼前这座炉火起誓，保证她丈夫回家。
        - id: ch02-b16
          speaker: odysseus
          text: "等旧月过去，新月刚来，他就回家了。"
        - id: ch02-b17
          speaker: penelope
          text: "真有这消息，我会重谢。可这么多年，保证我实在听了太多。"
    - id: ch03
      title: "摸到旧伤"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            佩涅洛佩仍请人给来客铺好床，他却谢绝，说粗硬的睡处自己早已习惯。她要找人洗脚，他只肯让年老的女仆碰，说吃过苦的人才懂得照顾另一个苦命人。王后把欧律克勒娅叫来，这老人当年在他出生的夜里就抱着他。她哭着念叨，主人敬神献祭，怎么偏不能回家？没准他在外乡，也同眼前的老人一样，受女人嘲弄。乳母取来水，却没有立即蹲下，先看了看这张风霜满面的脸。
        - id: ch03-b02
          speaker: euryclea
          text: "我见过那么多人，没一个像你这么像他。"
        - id: ch03-b03
          speaker: odysseus
          text: "别人也这样说过。"
        - id: ch03-b04
          speaker: narrator
          text: >-
            奥德修斯往阴影里挪动腿，乳母却还是摸到了膝盖上方的旧疤。伤是在帕耳那索斯山留下的。外祖父奥托吕科斯得到赫尔墨斯眷顾，会偷窃，也会作伪誓。他曾对许多人怀着怒意，所以为新生的外孙取名奥德修斯，还答应，等孩子大了来看他，一定赠礼。少年去作客，跟舅舅们上山打猎，手里拿长矛，紧跟猎狗。一头野猪从灌木里猛冲出来，划开他的腿，幸而没有碰骨头。他随即把矛刺穿野猪右肩，杀死了它。舅舅们包起伤口，用咒语止住血。家人等他养好了，才送礼物，送他回家。父母见了疤，问怎样受的伤，他便从头讲了经过。
        - id: ch03-b05
          speaker: narrator
          text: >-
            欧律克勒娅认出疤，松了手，脚掉进盆里，水翻了一地。她流着泪抓住他的胡须。
        - id: ch03-b06
          speaker: euryclea
          text: "真是你啊，奥德修斯！亲手摸到了，我才认出你。"
        - id: ch03-b07
          speaker: narrator
          text: >-
            她想叫王后看过来，雅典娜却不让佩涅洛佩留意这边。奥德修斯右手抓住乳母喉咙，左手把她拽近。
        - id: ch03-b08
          speaker: odysseus
          text: >-
            你亲自喂养过我啊！我流浪二十年才回家，你现在要毁掉我吗？一个人也不许告诉！若神让我杀死求婚人，等到处死其余女人时，你敢泄密，我也不饶你。即便是我的乳母，也不能例外。
        - id: ch03-b09
          speaker: narrator
          text: >-
            欧律克勒娅答应守住秘密。她像铁、像石头，不会弯折，谁都不能动摇。等求婚人败了，她愿意为他指出，家中哪个女人做过坏事，哪个无罪。奥德修斯不让她说，自己能判断每一个人，只要她闭口，把别的事留给神。乳母又去取水，洗好脚，再涂上油。奥德修斯挪回火边，用破旧衣衫把膝上的伤盖住。
    - id: ch04
      title: "梦里的鹅，明天的弓"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            佩涅洛佩说起夜里的不安。自己该留下，照顾儿子和这座家，还是跟一个求婚人走？孩子已大，生气家产不断流失，也开始催她再嫁。她又想请客人解梦。二十只鹅在院里，平日她总喜欢看它们吃食。突然，一只鹰从山上下来，全杀掉了。她哭，侍女们来到身边，鹰却返回屋梁，开口说，鹅便是求婚人，自己是她归家的丈夫，要杀死这些人。这事必定会成真。可她醒来一看，鹅还都好好地吃着。
        - id: ch04-b02
          speaker: odysseus
          text: "你丈夫自己都解释了。求婚人全会死，一个也活不了。"
        - id: ch04-b03
          speaker: penelope
          text: >-
            梦有两扇门，象牙门出来的会骗人，角门出来的才是真的。我也盼这梦经过角门，可我不敢信。
        - id: ch04-b04
          speaker: narrator
          text: "她看着火，静了一会儿，便说起明天的决定。"
        - id: ch04-b05
          speaker: penelope
          text: >-
            我拿出他的弓，摆好十二把斧。谁能张弓，把箭射过斧孔，我就嫁给谁，跟他走。这房子，做梦我也忘不掉。
        - id: ch04-b06
          speaker: narrator
          text: "她摸着椅边。他听到弓，手指仿佛又碰到了熟悉的弦。"
        - id: ch04-b07
          speaker: odysseus
          text: "就照这个安排，让求婚人来比。他们还没拉开弓，把箭射过全部十二把斧，奥德修斯就已经回家了。"
        - id: ch04-b08
          speaker: narrator
          text: "佩涅洛佩还愿意跟他说，可人不能永远不睡。她起身走上楼，女仆跟在后面。那张床，这些年不知流过多少泪，她今晚又回到那里。"
        - id: ch04-b09
          speaker: narrator
          text: "佩涅洛佩在床上又为丈夫流泪，直到雅典娜把睡意放在她眼皮上。"
