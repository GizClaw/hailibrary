audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切坚定", timbre: "苍老温暖", pace: "沉稳", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: "兵器先藏起来"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "求婚人离开，父亲立刻让儿子收起厅里的盔甲兵器。"
        - id: ch01-b02
          speaker: odysseus
          text: >-
            谁问起来，你就说，盔甲已经让烟熏坏了。还有，那些人喝醉了容易吵起来，刀枪就在手边，万一杀了人，连吃酒办婚事都要闹坏。
        - id: ch01-b03
          speaker: narrator
          text: >-
            忒勒马科斯让乳母把女仆们锁在屋里。她问，谁来举灯？他说，客人既然吃了饭，也该帮着做点事。父子把头盔、盾牌和长矛搬进储藏室。雅典娜提着金灯走在前面，连高高的屋梁都亮了。
        - id: ch01-b04
          speaker: telemachus
          text: "父亲，你看上面的屋梁，都像着了火。"
        - id: ch01-b05
          speaker: odysseus
          text: "别出声，也别问了，是神让这里亮起来的。你去睡吧。我留下来，回答你母亲的问题。"
        - id: ch01-b06
          speaker: narrator
          text: >-
            兵器全收好，儿子才去睡。父亲还穿着那身破衣，坐回火边。王后下楼时，女人们正在收杯盘、添柴。墨兰托又要赶老人出去，不走就拿烧着的木头赶。奥德修斯警告她，眼下有人宠着她，可别以为一切都丢不了。主人也许还会回来，即使他死了，留下的儿子也已经长大，会管这些事。王后斥责这女仆，明知自己要见客人，还这样无礼。欧律诺墨搬来椅子，垫上羊皮，让客人坐在王后对面。
    - id: ch02
      title: "她要听凭据"
      blocks:
        - id: ch02-b01
          speaker: penelope
          text: "你原来住在哪里？叫什么名字，父母是谁？"
        - id: ch02-b02
          speaker: narrator
          text: >-
            奥德修斯不肯提身世，怕一想起来，自己会更难过。佩涅洛佩便谈起家里的事。求婚人逼她选择，又快把财物吃光了。她曾说，得先替老公公织好寿衣。白天织出的布，晚上就拆掉，这样瞒了三年。到了第四年，一个女仆告密，男人们半夜闯来，撞见她拆线，逼着她把布织完。
        - id: ch02-b03
          speaker: penelope
          text: >-
            儿子懂事了，却挡不住他们耗家产，连我父母也催婚。可先说说你吧。你总该有家乡，有自己的父母。
        - id: ch02-b04
          speaker: narrator
          text: >-
            奥德修斯于是编起自己的来历。他说自己叫埃同，家在克里特，父亲是丢卡利翁，哥哥是伊多墨纽斯。照他编的故事，奥德修斯去特洛伊时，被风吹到岛上，要找伊多墨纽斯，可那人已经出征。埃同便招待了客人和船员，等到第十三天，逆风过去了，才送他们走。妻子边听边哭，丈夫看着难过，却忍住泪，连眼神都没变。她还想试试这番话。
        - id: ch02-b05
          speaker: penelope
          text: "你既见过他，告诉我，他穿什么？一起的人长什么样？"
        - id: ch02-b06
          speaker: odysseus
          text: >-
            他披着紫斗篷，两层的，用一枚金扣别住。扣上是一条狗，咬住挣扎的小鹿，不肯松口。内衫又轻又滑。跟着他的是欧律巴忒斯，比他年长一点，肩背有些驼，皮肤较深，头发是卷的。奥德修斯很信任这个人。
        - id: ch02-b07
          speaker: narrator
          text: >-
            紫斗篷是王后亲手叠的，金扣也是她给的。她知道，这客人见过丈夫。她哭过一阵，答应好好待他，却还是不信丈夫能回家。奥德修斯要她再听些近来的事。他把实话和谎话混着讲。同伴杀了太阳神的牛，宙斯毁掉船，伙伴全死了，只有奥德修斯活下来，漂到费埃克斯人那里，得了厚礼。可他为了再多得些财宝，又推迟回乡。忒斯普洛提亚的斐冬王曾给客人看那些宝物，也备好了船。奥德修斯则去了多多纳，向宙斯的橡树打听，该公开回来，还是先藏好身份。
        - id: ch02-b08
          speaker: odysseus
          text: "我拿宙斯和眼前的炉火发誓。这个月结束，下个月刚来，你丈夫就会归家。"
        - id: ch02-b09
          speaker: narrator
          text: "消息要是真的，王后愿好好谢他。可这些保证听过太多次，她不敢再全信了。"
    - id: ch03
      title: "一摸到旧疤"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            她让人备好床，给客人洗脚。客人不肯睡好床，说自己早睡惯了粗硬的铺盖。他也不愿让年轻女仆碰脚，只肯让上了年纪、吃过苦的女人来。王后叫来乳母。欧律克勒娅在他出生那夜就抱过他。她哭着说，主人那么敬神，献了那么多祭，却偏偏不能回家，也许正像这客人，在外乡被女仆嘲笑。她拿来水，仔细看他。
        - id: ch03-b02
          speaker: euryclea
          text: "我见过那么多客人，还没有谁像你这样，和奥德修斯那么相像。"
        - id: ch03-b03
          speaker: odysseus
          text: "别的见过我和他的人，也说过这话。"
        - id: ch03-b04
          speaker: narrator
          text: |-
            他把腿挪出火光，乳母托着脚往上洗，还是摸到了膝盖上方的疤。那是年轻时受的伤。他外祖父叫奥托吕科斯，住在帕耳那索斯山，赫尔墨斯很照顾他。他很会偷东西，也很会发假誓。他那时对许多人生气，就给刚出生的外孙取名奥德修斯，还答应等孩子长大来找自己，要送他礼物。

            少年后来去作客，跟舅舅们上山打猎，拿着长矛走在猎犬后面。野猪从灌木里猛冲出来，划开他的腿，没伤到骨头。他把矛刺穿野猪右肩，杀死了它。舅舅们包扎伤口，又念咒止血。等伤养好，舅舅们给了礼物，送他回乡。父母见了那道疤，问起来，他才讲了打猎受伤的经过。

            乳母一摸就认出来，手松了，脚落进盆里，盆翻了，水流了一地。她抓住他的胡须，满眼是泪。
        - id: ch03-b05
          speaker: euryclea
          text: "你真回来了！不亲手摸到，我还不认得。"
        - id: ch03-b06
          speaker: narrator
          text: "她想叫王后看，可雅典娜没让佩涅洛佩留意。奥德修斯右手猛地扣住乳母的喉咙，左手把她拉近。"
        - id: ch03-b07
          speaker: odysseus
          text: >-
            你亲手喂大我，我走了二十年才回来，如今你倒要毁了我吗？谁都不许告诉。神要是让我杀掉求婚人，等我处死其他女人时，你敢说出去，我也不会因为你是乳母就饶过你。
        - id: ch03-b08
          speaker: narrator
          text: >-
            欧律克勒娅答应保密，说自己像石头、像铁，谁也休想撬开她的嘴。她还愿意说出家中哪些女人有罪，哪些清白。奥德修斯却没有答应，他自己能判断。她只管守密，别的交给神。乳母重新取来水，把脚洗完，再抹上油。他坐近火边，拿破衣遮住那道疤。
    - id: ch04
      title: "明天用弓来比"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            佩涅洛佩又说，晚上总拿不定主意，是守着儿子和家，还是再嫁离开。儿子已经长大，眼看财产被人花掉，也在催她。她又请客人解释一个梦。她爱看的二十只鹅正在院子里吃食，一只鹰从山上来，把鹅全杀了。她哭起来，侍女围过来，鹰却回到梁上，用人的声音告诉她，鹅就是求婚人，自己是归家的丈夫，来杀这些人，还说这事一定会成真。可是醒来，鹅全在好好吃食。
        - id: ch04-b02
          speaker: odysseus
          text: "你丈夫已经在梦里说清楚了。求婚人一个都活不了。"
        - id: ch04-b03
          speaker: penelope
          text: >-
            梦从两扇门出来，象牙门会骗人，角门才送真梦。我也想信，却不能认定这梦真会应验。
        - id: ch04-b04
          speaker: narrator
          text: >-
            她看着炉火，过了一会儿，告诉客人，明天要拿出丈夫的弓，再摆十二把斧。哪一个男人能拉开弓，让箭穿过斧孔，她就嫁给他，跟他离家。可她说，连梦里也忘不了这座房子。
        - id: ch04-b05
          speaker: odysseus
          text: "就这样安排吧。他们还没张开那弓、射过十二把斧，奥德修斯就会回来。"
        - id: ch04-b06
          speaker: narrator
          text: "佩涅洛佩还想谈，可人总得睡觉。她领侍女上楼，回到那张床上。这些年，她在床上流过许多眼泪。这一回，她又为丈夫哭了起来。"
        - id: ch04-b07
          speaker: narrator
          text: "最后，雅典娜让她合上眼，睡着了。"
