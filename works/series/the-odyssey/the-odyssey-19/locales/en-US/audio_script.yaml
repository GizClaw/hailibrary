  chapters:
    - id: ch01
      title: "The armour is put away"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Ulysses stayed in the cloister. He was thinking how, with Minerva beside him, he could kill the suitors. After a while he spoke to his son.
        - id: ch01-b02
          speaker: odysseus
          text: >-
            Telemachus, we must collect the armour and carry it into the inner rooms. When the suitors ask why it's gone, give them an excuse. Tell them you're protecting it from the smoke. Say it doesn't look as it did when Ulysses left. Soot and smoke have made it dirty and black. And be sure to add something else. You're afraid Jove might make them quarrel when they've been drinking. They could hurt one another and bring shame on both their feasting and their courtship. Sometimes, just seeing weapons puts it into a man's head to use them.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Telemachus agreed with his father. He called for his nurse Euryclea.
        - id: ch01-b04
          speaker: telemachus
          text: >-
            Nurse, keep the women locked in their room while I move my father's armour into the storeroom. Since he went away, no one has cared for it. Through all the years I was a child, it's been collecting soot. I want to put it somewhere smoke can't reach.
        - id: ch01-b05
          speaker: euryclea
          text: >-
            Child, I wish you'd take charge of the whole house and look after everything yourself. But who's going to carry a light for you on the way to the storeroom? The maids could have helped, only you won't let them come.
        - id: ch01-b06
          speaker: telemachus
          text: >-
            The stranger can hold the light. Whoever eats my bread has to do something to earn it. It makes no difference where he comes from.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Euryclea bolted the women into their room as she had been told. Ulysses and Telemachus hurried to bring the helmets, shields, and spears inside. Minerva walked in front of them, carrying a golden lamp. Its light was soft and brilliantly clear. Telemachus looked about him in wonder.
        - id: ch01-b08
          speaker: telemachus
          text: >-
            Father, look at this marvel! The walls are shining as though they're on fire. So are the rafters, the crossbeams, and the pillars that hold them. A god must have come down from heaven and be here with us.
        - id: ch01-b09
          speaker: odysseus
          text: >-
            Quiet now. Don't say more or ask questions. This is how the gods do things. Go to bed. I'll stay to talk with your mother and the women. With all her grief, your mother will have many things to ask me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            By torchlight, Telemachus crossed to the other side of the inner court. He went into his usual bedroom and lay down there until morning. Ulysses remained in the cloister, turning over his plans to kill the suitors with Minerva's help.
    - id: ch02
      title: "Beside Penelope's fire"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Penelope came down from the room upstairs. Anyone looking at her might have thought of Venus or Diana. The servants placed her chair near the fire, in the spot where she usually sat. Patterns shaped like curling scrolls were worked into the chair with silver and ivory. The craftsman Icmalius had made it. Its footstool was joined to the chair itself as a single piece. A thick woolly fleece lay over the seat. Penelope settled into it. Then the maids left the women's quarters and came to attend her.
            Their first work was to clear away the tables used by those wicked suitors. There was bread left on them, and the cups the men had been drinking from. The women carried those away. They tipped the remaining embers out of the braziers, then piled on a large supply of wood. The fresh fires would give them heat as well as light. Amid this work, Melantho began insulting Ulysses for the second time.
        - id: ch02-b02
          speaker: melantho
          text: >-
            Stranger, are you planning to annoy us all night? Hanging about this house and watching the women! Get outside, you wretch, and eat your supper there. Otherwise you'll be chased out with a burning stick.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Ulysses glared back at her.
        - id: ch02-b04
          speaker: odysseus
          text: >-
            Woman, what have I done to make you so angry? Is it the dirt on me? My torn clothes? Or that I have to go about asking for food, as any beggar or wanderer does? I had wealth once, and a fine home of my own. I gave to plenty of people as badly off as I am now. Whoever they were, whatever they asked for, I helped them. I had servants without number and everything that makes a man prosperous and comfortable. Jove decided to take it all. So be careful. You could lose your position too, and that pride you use to hold yourself above the others. Don't lose your mistress's favour. And remember, Ulysses may still return. There's a chance of it yet. Even if he's dead, as you believe, Apollo has allowed him to leave a son. Telemachus is here. He'll see what the maids in this house do wrong. He's a child no longer.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Penelope heard Ulysses and rebuked the maid.
        - id: ch02-b06
          speaker: penelope
          text: >-
            Insolent girl! I've seen your disgraceful behaviour, and you'll suffer for it. You knew I meant to speak to this stranger. I told you myself I wanted news of my husband, the man I grieve for all the time.
        - id: ch02-b07
          speaker: narrator
          text: >-
            She turned to Eurynome, her chief waiting woman.
        - id: ch02-b08
          speaker: penelope
          text: >-
            Bring a chair for the stranger and put a fleece on it. He needs somewhere to sit while he tells me his story and hears what I have to say. There are things I wish to ask him.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Eurynome fetched the chair at once and spread a fleece over it. When Ulysses was seated, Penelope began her questions.
        - id: ch02-b10
          speaker: penelope
          text: >-
            First tell me who you are, stranger, and where you've come from. What town is yours? Who were your parents?
        - id: ch02-b11
          speaker: odysseus
          text: >-
            Madam, where on the face of this earth is anyone who could dare find fault with you? People speak so well of you that your fame reaches the heights of heaven. I think of a king who has done no wrong, a king who upholds justice while ruling a great nation of brave people. His goodness makes the land yield wheat and barley. Fruit weighs down the branches of the trees. The ewes give birth to their lambs, and the sea has fish in abundance. Under such a ruler, the people themselves do good. But now that I am sitting as your guest, please put a different question to me. Don't make me recall my family and the people I belong to. Those memories will stir up all my grief and make it heavier still. There's already sorrow enough inside me. It isn't fitting to come into another person's house and sit there crying and lamenting. Nor can anyone go on grieving all the time. Your servants might grow tired of it. You yourself might complain that my eyes were swimming with tears because the wine had made me heavy-headed.
        - id: ch02-b12
          speaker: penelope
          text: >-
            Stranger, the gods took away the beauty of my face and body when the Argives sailed for Troy and my dear husband went with them. If he came home to care for my affairs, I would be honoured more, and I would look better before the world. Instead I have all these worries and the troubles heaven has laid on me. The chiefs of our islands are here against my will, seeking to marry me. They come from Dulichium, Same, Zacynthus, and from Ithaca itself. They're wasting my estate. That leaves me no care to spare for visitors, for people seeking shelter, or even men who offer useful skills. My heart is always broken over Ulysses. The suitors demand that I marry at once. I have to find ways to trick them. First, heaven gave me an idea. I set up a great frame in my room and began an enormous piece of fine needlework. I told them this. My sweethearts, Ulysses is dead, but don't rush me into another marriage. Let me finish this work. I don't want all my skill with a needle to be lost without anything to show for it. I'm making a shroud for the hero Laertes, ready for the day death takes him. A man so wealthy must not be buried without a shroud, or the women here will talk. The suitors agreed to wait. All day I worked on that great cloth. Every night, by torchlight, I undid the stitches. For three years I kept the secret from them. Then the months passed, and more days went by, and I was in the fourth year. Those worthless maids betrayed me. They told the suitors, who burst in and caught me at it. The men were furious. I had to finish the cloth, willing or unwilling. Now I've run out of ways to escape the marriage. My parents press me hard. My son resents the suitors for consuming his inheritance. He's old enough now to know what's happening and able to manage his own affairs. The gods have given him an excellent nature. But for all that, I still ask you to tell me about yourself. Who are you? Where are you from? You must have had a mother and father. You can't have been born from an oak tree or a rock.
    - id: ch03
      title: "The stranger's account"
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: >-
            Lady, wife of Ulysses, if you're determined to hear of my family, I'll tell you, however much it hurts. No man could wander in exile for so long, or suffer among so many different peoples, without pain when he looks back. Still, I'll answer what you've asked. Far out in the sea there's a beautiful, fertile island called Crete. It has many people and ninety cities. You hear different languages mingled together there. There are Achaeans, brave Eteocretans, the three branches of the Dorians, and the noble Pelasgi. One great city is Cnossus. Minos ruled there, and every nine years he spoke with Jove himself. Minos was the father of Deucalion, my own father. Deucalion had two sons, Idomeneus and me. Idomeneus sailed to Troy. I'm the younger, and my name is Aethon. My brother was older and braver than I was. It was in Crete that I met Ulysses and welcomed him into my home. He was sailing towards Troy, but winds carried him off his course from Cape Malea. They left him at Amnisus, by the cave of Ilithuia. Those harbours are hard to enter. With the wind raging, he could scarcely find a sheltered place. As soon as he landed he went into the town asking for Idomeneus. He said he was an old, close friend. But my brother had sailed for Troy ten or twelve days before. So I received Ulysses myself and gave him all the hospitality I could. There was plenty of everything in my house. I also provided barley meal from the public stores for his men. I gathered contributions of wine and oxen, so they could sacrifice as freely as they wished. They stayed with me for twelve days. A gale from the north blew so fiercely that even a man on dry land could scarcely stand. I suppose a hostile god had stirred it up against them. On the thirteenth day it eased, and they were able to sail.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Ulysses went on telling convincing stories. As Penelope listened, her heart melted, and she wept. Snow on the mountain peaks thaws when the southeast wind and the west wind breathe over it. The melting water fills the rivers to their banks. Just so, tears streamed down Penelope's cheeks for the husband who was sitting beside her all the while. Ulysses felt pity and sorrow for her. But his eyes stayed hard as horn or iron. They did not even tremble. He was skillful enough to hold the tears in. When Penelope had wept and found a little relief, she spoke again.
        - id: ch03-b03
          speaker: penelope
          text: >-
            Stranger, let me test what you've said. Did you really entertain my husband and the men with him? Describe his clothes to me. Tell me what he looked like, and what his companions looked like too.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            Madam, it was a very long time ago. Twenty years have passed since he left my house and went on elsewhere. I'll do my best to remember. He wore a purple woollen cloak with a double lining. A golden brooch held it closed, with two catches for the pin. On the front of the brooch was a dog holding a spotted fawn between its forepaws. The dog looked down at it as it lay panting on the ground. The little creature twisted and struggled to get free while the dog watched and strangled it. People marvelled that gold could show all of that. His shirt was so soft against his body that it lay like an onion's skin. It shone in sunlight, and every woman who saw it admired it. But please understand one thing. I don't know whether he brought those clothes from home. A companion may have given them to him on the voyage. Or someone he was staying with could have offered them. He had so many friends, and few Achaeans could match him. I myself gave him a bronze sword, a fine purple cloak with a double lining, and a shirt that reached to his feet. I sent him aboard his ship with every honour I could show. He had a servant a little older than he was. I remember that man too. His shoulders were hunched, his skin was dark, and he had thick, curly hair. His name was Eurybates. Ulysses was more at ease with him than with the others, because the two of them thought so much alike.
        - id: ch03-b05
          speaker: narrator
          text: >-
            These were details Penelope could not doubt. They moved her more deeply still. She cried again, until the tears brought her some relief.
        - id: ch03-b06
          speaker: penelope
          text: >-
            I felt pity for you before, stranger. From now on you'll be honoured and welcome under my roof. Those clothes you described were my gifts to Ulysses. I fetched them from the storeroom and folded them with my own hands. I gave him the gold brooch too, to wear as an ornament. Oh, I shall never welcome him home again. What an evil fate sent him to that hateful city! I can't bear even to say its name.
        - id: ch03-b07
          speaker: odysseus
          text: >-
            Lady, wife of Ulysses, please don't wear yourself away with such bitter grief. I can hardly blame you for it, though. Any woman who loved her husband and bore his children would mourn his loss. Even if he were far less worthy than Ulysses, whom people compare to a god. Still, dry your tears for a moment and listen. I have news, and I won't conceal any of it. I can tell you in all truth that I've lately heard Ulysses is alive and making his way home. He's with the Thesprotians, bringing valuable treasures that one man after another has given him when he asked. But his ship and all his crew were lost after they left the Thrinacian island. His men killed the Sun-god's cattle. Jove and the Sun-god were angry, and every last man drowned. Ulysses clung to the ship's keel and drifted to the Phaeacians. Those people are close kin to the immortal gods. They received him as if he were a god himself, gave him many gifts, and wanted to escort him safely home. He could have been back long ago. Instead he thought it better to visit more countries and collect more wealth. There's no man alive with his cunning. No one can come close to him. Pheidon, the king of the Thesprotians, told me this. In his own house, while pouring an offering, he swore that a ship was ready at the shore, with a crew found to take Ulysses home. He sent me ahead of him. A Thesprotian ship happened to be leaving for Dulichium, the island where wheat grows. Before I left, Pheidon showed me the treasure Ulysses had collected. There was enough in that king's house to support Ulysses' family for ten generations. The king said Ulysses himself had gone to Dodona. He wanted to hear Jove's will from the tall oak there. After so long away, should he return openly to Ithaca, or come in secret? So you may be sure he's safe. He is close at hand, and he won't remain away much longer. Let me add an oath to what I've said. I call Jove, the greatest and strongest of the gods, and this hearth of Ulysses where I have found shelter, to witness that my words will come true. He'll return within this very year. At the ending of this month, as the next month begins, Ulysses will be here.
    - id: ch04
      title: "The nurse and the old wound"
      blocks:
        - id: ch04-b01
          speaker: penelope
          text: >-
            If only that could be so! If your promise comes true, my gifts and friendship will make everyone congratulate you. But I know what will happen. Ulysses won't return, and you won't find the escort you need to leave. As surely as Ulysses once lived, there is no master like him left in this house, no one to welcome worthy strangers and help them on their homeward way. Now, women, wash his feet. Prepare a couch with rugs and blankets so he can rest warmly and quietly until morning. At dawn, bathe him and rub him with oil again. Then he can eat with Telemachus in the cloister. Any of those hateful men who mistreats him will suffer for it. Whether he likes it or not, he'll no longer be welcome here. Sir, how would you judge my kindness and my understanding against those of other women if I let you eat in my cloister dirty and dressed in rags? We humans don't live long. Treat others harshly, and they'll curse you while you live and despise you after death. But when someone acts fairly and does what's right, people carry his praise to other lands, and many speak of his good fortune.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Madam, I've given up rugs and blankets ever since I left the snowy mountains of Crete and boarded a ship. I'll sleep as I've slept through many a wakeful night. I've lain wherever I could, on rough bedding, waiting for morning to come. I don't care to have my feet washed either. None of the young women in this house shall put her hands on them. But if there's a decent old woman here, someone who's suffered as much as I have, I would let her do it.
        - id: ch04-b03
          speaker: penelope
          text: >-
            Dear sir, of all the guests who have come here, none has spoken with such good judgement in everything he says. We do have a very honourable old woman. She took my poor husband into her arms on the night he was born and nursed him as a baby. She's frail now, but she can wash your feet. Euryclea, come here. Wash the feet of this man, who's about your master's age. I imagine Ulysses' hands and feet look much the same now. Trouble makes us all grow old so quickly.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The old nurse covered her face with her hands. Tears came, and she cried out for Ulysses.
        - id: ch04-b05
          speaker: euryclea
          text: >-
            My dear child, I don't know what to do when I think of you. No man feared the gods more than you did, yet Jove hates you. Who ever burned him more thigh bones? Who offered greater sacrifices of a hundred cattle? You prayed to reach a healthy old age and to see your son grow up like you. And you alone he has kept from your own home. I suppose the women in some foreign palace mock Ulysses now, just as these shameful girls have mocked you, stranger. After their insults, I understand why you won't let them wash you. I'll gladly do it myself, as Penelope has asked. I'll do it for her and for you too. You've stirred the deepest pity in me. And there's something else I must tell you. Listen. We've sheltered all kinds of troubled strangers, but none has ever looked so much like Ulysses. Your build, your voice, even your feet are like his.
        - id: ch04-b06
          speaker: odysseus
          text: >-
            People who've seen us together have often said the likeness was extraordinary. Now you've found it for yourself.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The old nurse picked up the basin she meant to use for his feet. She filled it generously with cold water, then poured in hot water until she had the right warmth for washing. Ulysses was sitting close to the fire, but before long he shifted round, turning away from the glow. He had remembered something. Once Euryclea took hold of his leg, her hands might find a certain scar. If she recognised it, everything he was concealing would be revealed.
            She did recognise it. Almost as soon as she began washing the man who was her master, she knew the mark. It was the wound a wild boar had left when Ulysses was hunting on Mount Parnassus. With him had been his remarkable grandfather Autolycus and the old man's sons. Autolycus had no equal anywhere in the world when it came to stealing and swearing false oaths. Those gifts came from Mercury himself. Autolycus used to burn the thigh bones of full-grown goats and young kids as offerings to Mercury, and the god was pleased to keep his company.
            On a visit to Ithaca, Autolycus had found his daughter's baby newly born. Supper had just ended when Euryclea brought the infant to him, sat the little one on his knees, and asked him to choose a name.
        - id: ch04-b08
          speaker: euryclea
          text: >-
            Autolycus, you must choose your grandson's name. You've wanted a grandson for so long.
        - id: ch04-b09
          speaker: autolycus
          text: >-
            My daughter, my son-in-law, here is the name to give him. I've been angry with a great many people, men and women in place after place. Call the child Ulysses, the child of anger. When he's grown, let him visit his mother's family on Mount Parnassus, where I have my property. I'll give him a present and send him home happy.
        - id: ch04-b10
          speaker: narrator
          text: >-
            So when Ulysses grew older, he made the journey to Parnassus to collect the presents promised by his grandfather. Autolycus welcomed him, and so did each of the old man's sons. They clasped his hand in greeting. His grandmother, Amphithea, put both arms round him. She kissed his head and each of his beautiful eyes. Autolycus then asked his sons to prepare a meal for their guest. They followed his instructions. First they brought in a bull that was five years old. They took off its hide, prepared the body, and divided it into joints. Those joints were carefully cut again into smaller pieces, which they threaded on spits. They roasted the meat until it was done, then carried round a portion to each man. The whole day passed in feasting, right up to the setting sun. Everyone received all the food that was his share. No one at the meal went unsatisfied. At last the sun went down and darkness fell. They went to their beds and took the rest that sleep gives.
            Rosy-fingered Dawn, morning's child, appeared. Autolycus's sons took their hounds hunting, and Ulysses went along. They climbed Parnassus through the wooded slopes to the high valleys where the wind blew. The sun had just risen from the slow, still waters of Oceanus and was beginning to shine on the fields when they reached a mountain hollow. The dogs went ahead searching for the beast's tracks. Autolycus's sons followed close behind. Ulysses was among them, carrying a long spear.
            This was where a huge boar had made its hiding place, deep among the bushes. The branches grew so thickly together that neither wind nor rain could get through. Even the sun's rays could not enter. Below the brush lay a deep covering of fallen leaves. As the hunters approached, the boar heard feet coming over the ground. It heard the hounds baying all round it. It burst out of the thicket, with the bristles along its neck raised and fire flashing in its eyes. There it stood, facing the hunters. Ulysses was the first to raise a spear and try to drive it into the animal. But the boar was quicker. It rushed at him from the side and ripped open his leg above the knee. The wound went deep, though it stopped short of the bone. Ulysses struck back, driving his spear into the boar's right shoulder. The sharp point passed right through its body. The animal collapsed into the dust. It lay groaning there until its life left it.
            Autolycus's sons dealt with the carcass and bound the wound on Ulysses' leg. They said a charm to stop the blood and hurried home as fast as they could. His grandfather and uncles cared for him until the wound was fully healed. Then they gave him splendid presents and sent him back to Ithaca, with affection on both sides. His mother and father rejoiced to see him. They wanted the whole story, including how he had come by the scar. He told them about the hunt on Parnassus with Autolycus and his sons, and how the boar had torn his leg.
    - id: ch05
      title: "Recognition and a dream"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Now that scarred leg was in Euryclea's hands. She had a firm hold of it, and at once she knew. She let the foot fall. It struck the basin with a clang, overturning it and spilling all the water onto the floor. Joy and sorrow filled her eyes with tears. For a moment she could say nothing. Then she caught Ulysses by his beard.
        - id: ch05-b02
          speaker: euryclea
          text: >-
            My dear child, it is you, Ulysses! I didn't know you until my own hands had touched you.
        - id: ch05-b03
          speaker: narrator
          text: >-
            She looked towards Penelope, as if to tell her that the husband she loved was home. But Minerva had turned Penelope's attention elsewhere. She could not look that way and notice what was happening. Ulysses gripped the nurse's throat with his right hand and drew her close with his left.
        - id: ch05-b04
          speaker: odysseus
          text: >-
            Nurse, will you be my ruin? You fed me at your own breast. Now I've come home at last, after twenty years of wandering. Heaven has let you recognise me. Keep silent. Don't tell anyone else in the house. Here is a promise I will carry out. If you betray me, and the gods let me kill these suitors, you won't be spared when I kill the other women. Not even because you were my nurse.
        - id: ch05-b05
          speaker: euryclea
          text: >-
            Child, how can you speak like that? You know nothing can make me bend or break. I'll be silent as stone or iron. And remember this. When heaven puts the suitors in your hands, I'll tell you which women have done wrong and which are innocent.
        - id: ch05-b06
          speaker: odysseus
          text: >-
            Don't offer that, nurse. I can judge every one of them for myself. Keep your silence and let heaven see to the rest.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Euryclea left the cloister to fetch fresh water. The first basinful was all over the floor. She finished washing him and rubbed him with oil. Ulysses moved his chair nearer the fire to warm himself, pulling his rags over the scar. Penelope began to speak again.
        - id: ch05-b08
          speaker: penelope
          text: >-
            Stranger, there's one more thing I'd like to talk about for a little while. It's nearly time for bed, at least for people who can sleep with sorrow in their hearts. Heaven has given me more pain than I can measure. In the daytime, even as I do my work and watch over the servants, I keep weeping and grieving. At night, when we all lie down, I stay awake with my thoughts. They torment my heart without a pause. Think of the brown nightingale, Pandareus's daughter. In early spring she sits hidden in the deepest shade and sings. Her voice turns through one mournful note after another, telling how she accidentally killed her own child, Itylus, the son of King Zethus. That's how my thoughts keep turning, never settling on an answer. Should I stay with my son? Should I guard my wealth, my slaves, and the honour of this house, for the sake of what people say and the memory of my dead husband? Or should I now go with the best of the men who court me and offer such splendid gifts? When my son was little and didn't yet understand, he wouldn't hear of my leaving his father's home. Now he's grown, and he begs me to go. He's so angry at the way the suitors are eating his property away. Listen to a dream I've had. Perhaps you can tell me what it means. I keep twenty geese here. They eat mash from a trough, and I'm very fond of them. In my dream, a great eagle swept down from a mountain. It drove its hooked beak into their necks, one by one, until every goose was dead. Then it flew up into the sky and left their bodies in the yard. I cried in my dream. I mourned the geese so bitterly that all my maids gathered round me. Then the eagle returned. It perched on a rafter that stuck out from the roof and spoke in a human voice. It told me not to cry.
        - id: ch05-b09
          speaker: odysseus
          text: >-
            Take courage, daughter of Icarius. This isn't a dream. It's a sign of good things that will surely happen. The geese are the suitors. And I am an eagle no longer. I am your husband, home again beside you, and I will bring those suitors to a shameful death.
        - id: ch05-b10
          speaker: penelope
          text: >-
            Then I woke up. When I looked outside, my geese were eating their mash at the trough, just as usual.
        - id: ch05-b11
          speaker: odysseus
          text: >-
            Madam, there's only one way to read that dream. Ulysses himself has already explained how it will come true. It foretells the suitors' deaths. Not one of them will escape.
    - id: ch06
      title: "The trial of the bow"
      blocks:
        - id: ch06-b01
          speaker: penelope
          text: >-
            Dreams are strange things, stranger. They're hard to understand, and they don't always come true. These bodiless visions come through two gates. One is made of horn, and one of ivory. Dreams from the ivory gate deceive us. The ones from the gate of horn come true for those who see them. But I don't believe mine came through the horn gate, much as my son and I would thank the gods if it did. There's something else I want you to remember. Tomorrow's dawn brings the unhappy day that will part me from Ulysses' home. I'm going to hold a contest with axes. My husband used to stand twelve axes in the court, one behind the other, like the supports used for building a ship. Then he'd stand back and send a single arrow through all twelve. I'll ask the suitors to do that. Whichever man can string the bow most easily and shoot through every one of the twelve axes, I'll follow him. I'll leave this lovely, wealthy house of my lawful husband. Even then, I know I'll remember it in my dreams.
        - id: ch06-b02
          speaker: odysseus
          text: >-
            Lady, wife of Ulysses, go ahead with your contest. No need to put it off. Before the suitors manage to bend that bow and send an arrow through the iron, however they handle it, Ulysses will be home.
        - id: ch06-b03
          speaker: penelope
          text: >-
            If you stayed here talking to me, sir, I'd never feel the wish to leave you and go to bed. But no one can go without sleep for ever. Heaven gives us who live on earth a time for everything. So I must go upstairs and lie on that couch. Ever since Ulysses left for the city whose name I hate, my tears have never stopped soaking it.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Penelope went upstairs to her room, with her maids beside her. There she mourned her dear husband, until Minerva laid sweet sleep upon her eyelids.
