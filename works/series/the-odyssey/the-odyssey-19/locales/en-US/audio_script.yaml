audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "measured", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered", pace: "unhurried", pitch: "medium-low"}
    telemachus:
      display_name: Telemachus
      tts: {delivery: "direct and youthful", timbre: "clear and youthful", pace: "steady", pitch: "medium"}
    euryclea:
      display_name: Euryclea
      tts: {delivery: "affectionate and resolute", timbre: "aged and warm", pace: "measured", pitch: "medium-low"}
    penelope:
      display_name: Penelope
      tts: {delivery: "thoughtful and controlled", timbre: "clear", pace: "measured", pitch: "medium"}
  chapters:
    - id: ch01
      title: "Hiding the weapons"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At last, every suitor had left. Odysseus sat in his rags beside the fire and could hear it burning. Telemachus watched the door. Before Penelope came down, they needed to put the helmets, spears, and shields out of reach.
        - id: ch01-b02
          speaker: odysseus
          text: >-
            If they ask, say the smoke was ruining the metal. Tell them you're worried about drunken quarrels too. Nobody should be able to reach for a weapon.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Telemachus told Euryclea to lock the women in their room. Who would carry a light for him, she asked? The guest must work for his food, he said. Father and son carried the weapons to the storeroom. Athena walked in front with a gold lamp. Light spread over the walls and beams.
        - id: ch01-b04
          speaker: telemachus
          text: "Look up there. Even the beams are shining!"
        - id: ch01-b05
          speaker: odysseus
          text: >-
            Keep quiet. Don't ask how the gods do things. Go and get some sleep. Your mother will have questions for me.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Once the weapons were put away, Telemachus went to bed. Odysseus stayed by the hearth. He would finally speak with his wife, but she must still think him a stranger.
    - id: ch02
      title: "A husband described"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Penelope came downstairs. The women cleared the tables and brought fresh wood. Melantho threatened the guest again. She would chase him out with burning wood. Odysseus warned her that wealth and favor could be lost. Her master might return. Even if he died, Telemachus was old enough to notice the women's behavior. Penelope scolded the maid. She had told her she wanted to question this guest. Eurynome set out a chair with fleece on it. Odysseus sat facing his wife, still disguised.
        - id: ch02-b02
          speaker: penelope
          text: "You've been here all day. Now tell me something about yourself. Who are you?"
        - id: ch02-b03
          speaker: odysseus
          text: "Can we talk about something else? Remembering my distant home only brings me sorrow."
        - id: ch02-b04
          speaker: penelope
          text: >-
            I know what that feels like. Those men at the tables want me to choose a husband. Every day I must find some way of delaying them.
        - id: ch02-b05
          speaker: narrator
          text: >-
            She had promised to finish a shroud for Laertes, her husband's old father. All day people watched her weave. At night she took the threads apart. It saved her from choosing for three years. Then a servant betrayed her. The suitors caught her undoing the cloth and forced her to finish.
        - id: ch02-b06
          speaker: penelope
          text: >-
            My son understands now what they're taking from his inheritance. My parents keep pressing me to decide. I can't find another way out. But I asked about you. You had parents and a home where people knew your name.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Odysseus kept his hands beneath his cloak. He made up a name and family. He was Aethon, he said, Deucalion's son and younger brother of Idomeneus, from Crete. Odysseus had been blown there while sailing to Troy. He asked for Idomeneus, but the brother had left already. So Aethon fed the men until the wind changed. They sailed on the thirteenth day. Penelope wept at the tale. Her husband pitied her but kept his eyes dry and still. She decided to test him. He waited for the question.
        - id: ch02-b08
          speaker: penelope
          text: "What clothes did he have on?"
        - id: ch02-b09
          speaker: odysseus
          text: >-
            A purple cloak, doubled over, with a gold clasp. The clasp showed a dog gripping a fawn. The creatures looked almost alive.
        - id: ch02-b10
          speaker: narrator
          text: "She lowered her eyes and asked about the shirt."
        - id: ch02-b11
          speaker: odysseus
          text: "Very smooth and light. People couldn't help noticing it."
        - id: ch02-b12
          speaker: penelope
          text: "Who came with him?"
        - id: ch02-b13
          speaker: odysseus
          text: >-
            Eurybates. A little older, with rounded shoulders, dark skin, and curls. Your husband trusted him above the others.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Penelope covered her face. She had folded that cloak and chosen that clasp herself. Her husband sat close enough to hear her catching her breath. She would honor this guest now. Still, she didn't believe she would ever welcome Odysseus back.
        - id: ch02-b15
          speaker: penelope
          text: "So you really did meet him."
        - id: ch02-b16
          speaker: odysseus
          text: "I've heard news of him since then."
        - id: ch02-b17
          speaker: narrator
          text: >-
            Some of what he said had happened. Some he made up. The crew had killed the Sun's cattle, and Zeus wrecked their ship. Every companion drowned. Odysseus alone survived, and the Phaeacians helped him and gave him riches. Then came the false report. He said Odysseus could have come home sooner, but stayed away to gather more wealth. King Pheidon had shown him the treasure and prepared a ship. Odysseus was at Dodona, asking Zeus's oak how to return. Should he come openly, or hide himself? The guest swore by Zeus and by the hearth where they sat that her husband would come.
        - id: ch02-b18
          speaker: odysseus
          text: "He'll be home as this moon ends and the next begins."
        - id: ch02-b19
          speaker: penelope
          text: >-
            I'd reward news like that. But after so many nights, I know what hope can do. It can keep you awake.
    - id: ch03
      title: "Hands on the scar"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Penelope ordered a comfortable bed. The guest refused. He was used to sleeping rough. He would let someone wash his feet, but only an older woman who knew hardship. She called Euryclea, who held Odysseus the night he was born. The nurse cried for her master. He had honored the gods, yet couldn't come home. Perhaps foreign servants mocked him as these women mocked the guest. She brought water, then looked closely at his face.
        - id: ch03-b02
          speaker: euryclea
          text: "Of all the people I've seen, nobody has reminded me of him as much as you."
        - id: ch03-b03
          speaker: odysseus
          text: "Others have noticed it too."
        - id: ch03-b04
          speaker: narrator
          text: >-
            He moved his leg away from the light, but couldn't turn her away now. She washed his foot and ankle. Then she felt the scar above his knee. It came from Mount Parnassus, where his mother's family lived. His grandfather Autolycus was a thief and oath-breaker favored by Hermes. He had named the newborn Odysseus for his own anger against many people, and promised him gifts when he grew up and visited. On that visit, Odysseus hunted with his uncles, following the dogs with a spear. A boar rushed out and tore his leg without reaching the bone. Odysseus drove his spear through its shoulder and killed it. His uncles bound his wound and said a charm to stop the blood. After he healed, they gave him presents and sent him home. His parents asked about the scar, and he told them what happened.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Euryclea had been holding his scarred leg. Now she let go. The foot dropped into the basin with a clang, tipping it over. Warm water spilled across the floor. She caught him by the beard. Her eyes filled with tears as she spoke.
        - id: ch03-b06
          speaker: euryclea
          text: "It is you, Odysseus! I only knew when I touched you."
        - id: ch03-b07
          speaker: narrator
          text: >-
            She looked toward Penelope, wanting to tell her. Athena kept the queen from noticing. Odysseus grabbed the nurse's throat with his right hand and pulled her close with his left.
        - id: ch03-b08
          speaker: odysseus
          text: >-
            You fed me from your breast. Would you ruin me now, when I've come back after twenty years? Keep this to yourself. If the gods let me kill these men and then the women, I won't spare even you if you give me away, though you are my nurse.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Euryclea said he couldn't break her silence. She would hold firm as iron or stone. She offered to name the women who were guilty and those who were innocent. He refused. He could judge them himself. She must say nothing and leave the rest to the gods. She brought fresh water, washed him, and put oil on his feet. He moved nearer the fire and covered the scar with his rags.
    - id: ch04
      title: "Dreams and the bow"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Penelope spoke of the decision that kept her awake. Should she stay to protect her son and the house, or marry a suitor and leave? Her son was grown now, and angry at the wasting of his property. He urged her to marry. Then she asked about a dream.
        - id: ch04-b02
          speaker: penelope
          text: >-
            I dreamed of twenty geese I loved to watch feeding in the yard. An eagle came from the mountain and killed them. I cried, and my women gathered round. Then it came back to a roof beam and spoke. It said the geese were the suitors. It was my husband, home to kill them. This was a vision that would come true. But when I woke, the geese were still eating, unharmed.
        - id: ch04-b03
          speaker: odysseus
          text: "Your husband told you what it means. None of the suitors will survive."
        - id: ch04-b04
          speaker: penelope
          text: >-
            Dreams come through ivory or horn. Those from the ivory gate deceive us. Those from horn come true. I'd like to believe mine came through horn, but I can't.
        - id: ch04-b05
          speaker: narrator
          text: "The fire settled. She was quiet a while, then said she would bring out her husband's bow the next day. He waited."
        - id: ch04-b06
          speaker: penelope
          text: >-
            I'll set up twelve axes. Whoever strings the bow and shoots an arrow through them can marry me. Then I'll leave this house.
        - id: ch04-b07
          speaker: narrator
          text: "She ran her hand over the edge of her chair. He knew that bow so well that his fingers almost felt its weight as he listened."
        - id: ch04-b08
          speaker: odysseus
          text: "You needn't put off the contest. Let them try. Odysseus will be home before any one of those men can string his bow and send an arrow through all twelve axes."
        - id: ch04-b09
          speaker: narrator
          text: |-
            Penelope would have been happy to keep talking to this guest. But she knew people couldn't go on without sleep. She rose, and her attendants followed her up the stairs. There was the bed she had so often soaked with her tears.

            Again she cried for her husband, until Athena let her sleep.
