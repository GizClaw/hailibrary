notes:
  - "Task-scoped user exception to classic's verbatim-import default: retain classic and Homer / 荷马 authorship, with newly authored HaiLibrary reading prose. The complete Book X at git 1208d108 and the live Gutenberg edition were consulted as plot evidence. Neither locale is Butler's text or a literal Chinese translation; source_url and translator are not used to mislabel the new writing."
  - "Retained: Ithaca visible before sleep, suspicion and released winds, Aeolus's refusal, the ship moored outside and all other ships lost, twenty-two scouts led by Eurylochus, his limited knowledge, moly's protection, Circe's oath before intimacy, refusal to eat before rescue, the angry conflict with Eurylochus, a full year, the living journey to the dead and the unburied Elpenor."
  - "Retained ethical conflicts and threats: Aeolus marries his six sons to his six daughters; the Laestrygonians spear people and take them home to eat; Hermes tells Odysseus to threaten Circe with death and secure her oath before sex because she could take his manhood when he is naked. Odysseus repeats that fear, shares her bed only after the oath, and later considers beheading his kinsman Eurylochus."
  - "Condensed: Aeolus's repeated feast description, distant daylight speculation, the mechanics of killing and carrying the stag, furniture and servant-service inventories, ritual measurements and names of the converging tributaries. The family marriages, coercion, sex, restoration and year-long stay are not omitted."
  - "Claim inventory, both locales: the floating island, wind in a bag, giants, drug-induced transformation and divine herb are declared mythology, not botany, medical advice or physical explanation. The domestic behavior of wolves and lions is explicitly caused by Circe's spell."
  - "The narrative distinguishes Eurylochus's observations outside the house from the transformed men's experience inside. Odysseus narrates retrospectively and identifies Elpenor's later testimony as the account of his fall."
  - "No modern adaptation or translation was used as a prose model, and no present-day geographic identification of Aeaea or the underworld entrance is asserted. Traditional authorship is attributed rather than biographically proved."
