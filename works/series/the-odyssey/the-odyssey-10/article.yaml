style: epic-fantasy-illumination
titles: {en-US: "The Bag and the Open Door", zh-CN: "风袋与敞开的门"}
labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
research: required
premise: >
  归乡近在眼前，风袋却因猜疑被打开。船队随后毁于巨人的港口，幸存者又落入喀耳刻的法术。
  奥德修斯接受神的援助，要求誓约与同伴获救；安逸的一年后，归路反要先通向死者。
characters:
  - {id: odysseus, description: "继续自述的船长，既冒险救人，也须面对同伴对其固执的指责"}
  - {id: aeolus, description: "替宙斯看守风的岛主，先援助后拒绝再次放行"}
  - {id: eurylochus, description: "留在石屋门外的侦察队长，惧怕再次失去同伴"}
  - {id: hermes, description: "以年轻人形貌送来摩吕与应对法术办法的神"}
  - {id: circe, description: "能改变人形的女神，起誓后归还同伴并指明下一段行程"}
  - {id: elpenor, description: "临行前从屋顶跌落的年轻船员"}
  - {id: crew_1, description: "风袋前生疑、后来催促归家的船员"}
  - {id: crew_2, description: "与同伴一起要求启程的船员"}
