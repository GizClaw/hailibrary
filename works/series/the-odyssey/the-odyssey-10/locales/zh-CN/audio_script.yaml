audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    aeolus:
      display_name: 埃奥洛斯
      tts: {delivery: "自信果断", timbre: "厚实坚定", pace: "平稳", pitch: "中低音"}
    crew_1:
      display_name: 船员甲
      tts: {delivery: "诚恳直率", timbre: "清楚略带沙哑", pace: "利落", pitch: "中音"}
    crew_2:
      display_name: 船员乙
      tts: {delivery: "急切而务实", timbre: "干涩有力", pace: "稍快", pitch: "中低音"}
    eurylochus:
      display_name: 欧律洛科斯
      tts: {delivery: "警惕务实，说话坚持己见", timbre: "紧绷粗涩", pace: "稳中带急", pitch: "中低音"}
    hermes:
      display_name: 赫尔墨斯
      tts: {delivery: "自信清楚，指点准确", timbre: "年轻清亮", pace: "轻快而不仓促", pitch: "中音"}
    circe:
      display_name: 喀耳刻
      tts: {delivery: "笃定从容", timbre: "圆润深稳", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: 岸上的火已经看得见了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯接着向国王讲述。
        - id: ch01-b02
          speaker: odysseus
          text: |
            有一回，我们已经能看见伊萨卡岸上的火。要是没睡那一觉，也许就到家了。
            埃奥洛斯住的岛浮在海上，外边有一道金属墙。他有六个儿子，六个女儿，儿子各娶了一个自己的姐妹，和父母住在一处，一起吃喝。宙斯让他管着各方的风。他请我们住下，听了一个月特洛伊的故事。临走，他把不利的风全装进牛皮袋，扎好银绳，只留西风吹，送我们向家走。
            我九天九夜守着船舵。第十天，家乡出来了，连火光都望得见。我实在太累，睡过去了。同伴却觉得那袋子装的是金银，有人起了疑心。
        - id: ch01-b03
          speaker: crew_1
          text: |
            到哪儿他都能收礼，我们一起遭了那么多罪，倒是空手。把袋子打开，看看他得了什么。
        - id: ch01-b04
          speaker: odysseus
          text: |
            袋口一开，风就卷住船帆，把家乡越推越远。我在哭喊和风暴里醒来，一度想跳进海里。可我还是留着，用披风盖住头，听大家哭，被吹回埃奥洛斯那儿。
            我把经过告诉他，求他再帮一回。他却拒绝了。
        - id: ch01-b05
          speaker: aeolus
          text: |
            我把你送走，神却要你回来。神不喜欢的人，我也不帮。离开这里吧。
        - id: ch01-b06
          speaker: odysseus
          text: |
            我们只好靠桨划。六天过去，第七天到了莱斯特律戈涅斯人的港湾。入口窄，两边都是高崖，里面倒安静，没风没浪。别的船都进去，我把船留在外边系好，叫三个人去问路。
            取水的女孩给他们指了父亲安提法忒斯王的家。屋里的王后大得吓人，她喊来丈夫，国王抓起一个人就吃。另两个急忙逃回船，巨人们听见叫喊，涌到崖上。
            大石头往港里砸，船挤在一起碎了。巨人拿矛来刺我的同伴，像叉鱼，叉中了就带回去吃。我砍断缆绳，让大家赶快划。我们逃出了他们扔石头的范围，可港内的船，一条也没逃出。
    - id: ch02
      title: 留在门外的人
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            只剩这条船，到了埃埃亚岛。我们在沙滩上歇了两天，我才上去探看。林子里有人家冒烟，回去的路上，我又打了一头鹿，扛给大家吃。要见下一个陌生主人，总得先吃些东西。
            他们听说那阵烟，便想到独眼巨人，也想到刚才失去的船。我分成两队，让大家抽签。欧律洛科斯带着二十二人走进林子。
            石屋外有狼和狮子，见人却像狗一样凑上来。喀耳刻施了法术，让它们变得听话。屋内有织布的声音，还听得见女人唱歌。我很信任波利忒斯，他让大家叫门。大家一喊，她就来请人进去。
            欧律洛科斯不放心，独自留在外面。酒食里有让人不想家的药，其他人吃下去，又被她的杖碰到，就变了猪的模样。他们还会想事，也记得自己是谁，却只能被关进圈里，吃她扔来的果实。
            外面的欧律洛科斯没看见这些。他等不到同伴出来，便跑回船，哭得话都说不清。我听明白后，拿起武器让他领路。他紧紧抓住我。
        - id: ch02-b02
          speaker: eurylochus
          text: |
            别让我再回去了。你也会没命的。趁现在，带着剩下这些人逃走吧。
        - id: ch02-b03
          speaker: odysseus
          text: |
            你不去，就留在这儿。我得去找人。
            将到屋前，一个年轻人握住了我的手。他是赫尔墨斯。他告诉我同伴变了猪，拔起一株黑根白花的草给我，神把它叫作摩吕。
        - id: ch02-b04
          speaker: hermes
          text: |
            把这个带上，她的药就不起作用了。等她拿杖打你，你就拔剑扑过去，装作要杀她。她会叫你上床。你还要她救人，别一口回绝，先让她对众神起誓。否则等你衣服脱了，她会毁掉你作男人的能力。一定叫她答应，不再害你。
    - id: ch03
      title: 同伴还没有回来
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            我一个人进了屋，喝下喀耳刻给的饮料。她伸杖碰我，我还好好地站着。
        - id: ch03-b02
          speaker: circe
          text: |
            到猪圈里去吧。
        - id: ch03-b03
          speaker: odysseus
          text: |
            我举剑冲过去，像真要杀她。她惊叫着抱住我的膝盖，说赫尔墨斯早告诉过她，奥德修斯会来，如今认出就是我了。
        - id: ch03-b04
          speaker: circe
          text: |
            别拿着剑了。来与我同床，我们就能信任对方。
        - id: ch03-b05
          speaker: odysseus
          text: |
            我的朋友还是猪呢，你却要我脱了衣服上床，好毁掉我作男人的能力？你先起誓不会害我，不然我不跟你睡。
            她发誓了，我才和她同床。后来有人给我洗澡，拿来干净衣服，又摆上饭。我没有动。
        - id: ch03-b06
          speaker: circe
          text: |
            我都发誓了，你还是不信吗？
        - id: ch03-b07
          speaker: odysseus
          text: |
            我得亲眼看见同伴变回来，才能吃饭。
            她拿另一种药去涂在猪身上，鬃毛掉了，大家恢复成人，甚至更年轻强壮。一看见我，他们就抓着我的手哭。喀耳刻也被打动，让我接船边的人来。
            那些人看我回来，围着我，高兴得像到了家。我让他们安顿好船，藏好东西，去见被救出的同伴。欧律洛科斯却挡住了大家。
        - id: ch03-b08
          speaker: eurylochus
          text: |
            去给她变成野兽吗？还记得洞里死的人吧，都是他不肯听劝害的。
        - id: ch03-b09
          speaker: odysseus
          text: |
            我连亲族也顾不上了，真想拔剑把他的头砍下来。大家劝住我，说他愿意，就让他守船，带别人过去。他被我斥责后害怕了，最后还是跟着走。
            大家在屋里团聚，拥着彼此流泪。喀耳刻说，这一路的苦还在折磨我们，先安心吃喝，养好身体和精神。
    - id: ch04
      title: 先知在死者中
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            我们就住了下来。日子一天天过去，竟过了整整一年。船员把我叫到旁边。
        - id: ch04-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: |
            伊萨卡，你还想不想了？要回去，咱们就得走啊。
        - id: ch04-b03
          speaker: odysseus
          text: |
            我当晚去求喀耳刻，她肯放人，却要我们先去死者那里。
        - id: ch04-b04
          speaker: circe
          text: |
            去见忒瑞西阿斯，问你的归路。死后他仍能明白事理，那是珀耳塞福涅特许的。
        - id: ch04-b05
          speaker: odysseus
          text: |
            我听得坐起来，哭着问，活人能到那个地方吗？谁能替我们领路？
            她说北风能把船送过俄刻阿诺斯。我们要在死者国度边的树林上岸，走到河水交汇的地方，献祭。亡魂会来，但得先拦着，别让他们靠近祭血，要等先知回答完。
            天快亮了，她才交代完。我叫大家起身准备。埃尔佩诺尔昨夜喝了酒，睡在屋顶，这时被动静惊醒，忘记还有楼梯，摔下去把脖子折断了。等到死者那里，我会听他亲口讲这件事。
            其他人聚来，还以为这趟就奔伊萨卡。我告诉他们真正先要去的地方，他们倒在地上哭，后来才起身，跟我走到海边。祭牲已经由喀耳刻送来，她怎样经过我们身旁，竟没有人看见。
            我们把用品装上船。这一趟，谁都不愿去，却得动身了。
