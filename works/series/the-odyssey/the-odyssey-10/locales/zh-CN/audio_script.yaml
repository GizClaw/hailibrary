        timbre: 年轻清亮
        pace: 轻快而不仓促
        pitch: 中音
    circe:
      display_name: 喀耳刻
      tts:
        delivery: 笃定从容
        timbre: 圆润深稳
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 已经看见故乡
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            我们接着航行，到了埃奥利亚岛。希波塔斯的儿子埃奥洛斯住在那里，永生的诸神都宠爱他。岛仿佛浮在海上，四周围着一圈铁墙。他有六个女儿、六个壮实的儿子，让儿子们分别娶了女儿们。一家人跟亲爱的父母住在一起，整日宴饮，能想到的奢华享受都有。烤肉的香气整天充满房屋，欢宴的声响连院子里都是。夜里，儿子们各自陪着妻子，钻进铺得好好的床上，同被而睡。这就是我们到访的那一家。

            埃奥洛斯留我住了一个月，不停问特洛伊怎样了，阿尔戈斯人的船队怎样了，阿开亚人怎样回家。我都照事情本来的样子告诉他。后来我说该出发了，求他帮一把，他马上答应，着手安排。他取一张上等牛皮做成袋子，把各路咆哮的风都关了进去。宙斯让他掌管风，什么时候吹，什么时候停，随他说了算。他把袋子放到船里，用银线紧紧扎住口，任何方向都漏不出一丝风。只有能送我们回去的西风，他让它自在地吹。可他的一番心思，后来全白费了，我们又被自己的愚蠢毁了。

            船走了九天九夜，第十天，故乡出现在天边。我们近得连田里烧禾茬的火都看得清。我始终亲自掌舵，不肯交人，只想早点到家，这时候累得实在撑不住，昏昏睡下。船员便议论起来，觉得埃奥洛斯送我的袋子，装着要带回家的金银。有人转过身，对旁边的人这样说。
        - id: ch01-b02
          speaker: crew_1
          text: |
            瞧瞧，他去哪个国家、哪座城，都有人尊敬，都有人做朋友！从特洛伊拿了多少好东西回来！我们走的路一点不比他少，结果呢，空着手出去，又空着手回家。现在埃奥洛斯还给了他一大袋。快打开看看，到底是什么？送他的袋子里，藏了多少金银？
        - id: ch01-b03
          speaker: odysseus
          text: |
            这样说着，他们真听了坏主意，把袋子打开。风一下子呼啸着冲出来，刮成暴风，把我们从故乡旁卷回海上。众人哭起来。我醒了，只想，是跳海死了算了，还是忍着继续活？最后，我还是忍住，蒙起头躺在船里。伙伴们哭得伤心，狂风却把整支船队吹回埃奥利亚岛。

            到岸后，我们下船取水，在船旁吃饭。刚吃完，我就带一个传令官和一个同伴，直接去了埃奥洛斯家。他正陪妻儿吃喝。我们像求告的人那样坐在门槛上，家里人一看，惊讶极了。
        - id: ch01-b04
          speakers: [aeolus_family_1, aeolus_family_2, aeolus_family_3]
          ensemble: chorus
          text: |
            奥德修斯，怎么又回来了？是哪位神这样害你？我们花了那么多心思，帮你回伊萨卡，或是你想去的任何地方呀！
        - id: ch01-b05
          speaker: odysseus
          text: |
            我难过地告诉他们，是我的人害了我，再加上那场可恨的睡眠。朋友们，你们愿意的话，就能帮我把这祸事挽回来，请帮帮我。我尽力说得让人动心，众人却没吭声。最后，埃奥洛斯开口了。
        - id: ch01-b06
          speaker: aeolus
          text: |
            你这个最下贱的人，马上离开我的岛！天神恨的人，我不会帮。快走，你身上带着上天的憎恨，又来这里了！
        - id: ch01-b07
          speaker: odysseus
          text: |
            他就这样把我赶出家门。我伤心地走了。
    - id: ch02
      title: 只剩一条船
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            我们又在悲苦中出海。没有风相助，只有用桨。划了又划，费尽力气也没用，人全累坏了。熬过六天六夜，第七天，我们来到拉摩斯岩石围起的要塞，莱斯特律戈涅斯人的城，忒勒皮洛斯。这里的牧人，赶羊回来挤奶时，会向正赶羊出去吃草的人打招呼，对方也回应。在这个地方，若人不用睡觉，就能挣两份钱，牧牛挣一份，牧羊再挣一份，因为晚上和白天干的活差不多。

            港口在高崖底下，陆地把它围住，只在两个海角之间留了一道窄口。船长们都把船开进去，一条紧挨一条地系好。里面从没有一丝风，水总是平静的。我却把自己的船放在外面，系在海角最尽头的岩石上。再爬上一块高岩查看，没有人，没有牛，只见地上升起一缕烟。我便派两个人带一个随从，打听这里的居民。

            他们登岸走上一条平路，当地人把山里的柴运进城，走的正是这条路。路上遇见取水的少女，她是莱斯特律戈涅斯人安提法忒斯的女儿，正往阿尔塔基亚泉去，大家都在那里取水。我的人上前问，这里的国王是谁，统治的是怎样的人。她就指了父亲的房屋给他们。可一进去，他们看见王的妻子，竟是个像山一样大的女巨人，吓坏了。

            女巨人把丈夫从集会的地方叫来。安提法忒斯一回来就抓人，抓起一个，当场拿来吃午饭。剩下两个人拼命跑回船边。他在后面大喊，召来帮手，四面八方冒出几千个强壮的莱斯特律戈涅斯人。这哪是人，简直是食人怪物！他们从高崖扔下巨石，跟扔小石子一样。我听见船撞在一起、木头破碎的声音，听见伙伴临死的惨叫。巨人还像穿鱼那样用矛刺穿人，带回家吃。港里正屠杀的时候，我拔剑割断缆绳，叫船员赶紧拼命划，不然大家也一样。大家用尽力气，终于划进外海，离开了巨石能打到的地方。我们真是庆幸。至于其他的人，全都没有了。

            带着失去同伴的悲痛，又为逃出性命而庆幸，我们到了埃埃亚岛。住在这里的喀耳刻是一位厉害而聪明的女神。魔法师埃厄忒斯是她同父同母的兄弟，两人的父亲是太阳神，母亲是俄刻阿诺斯的女儿珀尔塞。有一位神引路，我们一句话没说，把船带进安全的港湾。上岸以后，身心实在太累，躺了整整两天两夜。第三天一早，我拿着矛和剑去察看，想找点人做的东西，或是听见人声。我爬上高处，看见密林中有烟升起，那是喀耳刻家。我拿不定主意，要不要现在就过去看。最后觉得，先回去让同伴吃饭，再派几个人探察，比自己过去好些。

            快回到船边，一位神可怜我独自一人，把一头大鹿送到我面前的路上。鹿角非常漂亮。太阳太热，逼得它离开林中吃草的地方，下河喝水。它走过时，我一矛刺进背心，铜矛尖穿透身体。大鹿倒在尘土里呻吟，渐渐没了命。我一脚踩着，把矛抽出放下，再采粗草和灯心草，拧成约一噚长的粗绳。把四只脚绑好，我就把这漂亮野兽挂到脖子上，拄矛回去。它太大，没法只扛一边肩，再用一只手扶着。我把它扔到船前，叫伙伴来，一个个鼓励。我说，朋友们，看来还不会这么早死。至少船里还有吃的喝的，我们就饿不死。大家掀开蒙头的衣服，在岸上看这头鹿，赞不绝口。它确实漂亮，等看够了，大家才洗手，把它做成一餐。

            我们一整天留在那里，吃饱喝足，直到日落。天黑了，就在海岸睡下。
    - id: ch03
      title: 猪圈里的伙伴
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            清晨的孩子、玫瑰色手指的黎明来了。我把人召集起来，说，朋友们，我们的麻烦不小，听清楚。连太阳从哪边升、哪边落，我们都不知道，东西也分不清。我看不到出路，但还得设法找。这里肯定是岛，今天早上我爬到最高处，四面都是海，一直连到天边。岛很低，中间有密密的树林，我看见林子里有烟。

            众人一听，心都沉了。安提法忒斯和凶恶的波吕斐摩斯对我们做的事，他们还记得清清楚楚。大家吓得痛哭。可哭没用，我把人分两队，一队让我带，一队交给欧律洛科斯。再把签放进头盔里抽。欧律洛科斯抽中了，带着二十二个人出发。他们边走边流泪，我们留下的也哭。

            喀耳刻的房屋在森林当中，是用整齐凿好的石头建的，离很远就能看到。屋外有山狼，有狮子，走来走去。可怜的兽，它们中了魔法，又被药控制了，听女神摆布。它们不来咬人，只摇大尾巴，亲近我的伙伴，还拿鼻子温柔地蹭他们。就像狗见主人吃完饭回来，知道他会带吃的，马上围拢。这些长着大爪的狼和狮子，也这么讨好他们。可是看到这样的怪事，伙伴们怕极了。走到门前，又听见喀耳刻在屋里织布，边织边唱，歌声美得很。她织的东西细软，颜色耀眼，除了女神，谁也织不出。我最看重、最信任的伙伴波利忒斯，这时说了话。
        - id: ch03-b02
          speaker: polites
          text: |
            里面有人在织布，歌也唱得真好，屋里到处都听得到。我们叫她一声，看看她究竟是女人还是女神吧。
        - id: ch03-b03
          speaker: odysseus
          text: |
            大家喊她，她就下来拔开门闩，请他们进屋。众人没往坏处想，都跟去了。只有欧律洛科斯疑心有问题，等在外面。她让进去的人坐在椅上、长凳上，拿乳酪、蜂蜜、麦粉和普拉姆涅葡萄酒调成饮食，又放进恶毒的药，让他们忘掉故乡。等他们喝下，她用杖一打，全变成猪，关进猪圈。脑袋和毛发都是猪，叫声也一样，可心里跟以前毫无区别，什么都记得，什么都明白。

            他们在圈里尖叫，喀耳刻扔下猪吃的橡子和山毛榉果。欧律洛科斯赶回来，要告诉我伙伴遭了殃，可惊得太厉害，话到嘴边，一个字也说不出。眼睛里尽是泪，只会抽噎叹气。我们逼着问，他才慢慢讲出来。
        - id: ch03-b04
          speaker: eurylochus
          text: |
            我们按你说的穿过森林，林子中间有一座美丽的石屋，很显眼，远远就能看见。里头有个女人，也可能是女神，边织布边唱歌，唱得很好听。大家叫她，她马上下来开门，请我们进去。其他人没想到会有坏事，都进屋了。我留在原地，觉得也许藏着阴谋。后来就再也没见他们。我坐那里等了好久，一个人也没出来。
        - id: ch03-b05
          speaker: odysseus
          text: |
            我把青铜剑背到肩上，拿起弓，要欧律洛科斯跟我回去带路。他却双手抓紧我，苦苦哀求。
        - id: ch03-b06
          speaker: eurylochus
          text: |
            大人，别逼我再去，让我留在这儿吧！你救不出他们，一个也救不出，连你自己也回不来。还不如想想，我们能不能带剩下这几个人逃走，至少性命也许保得住。
        - id: ch03-b07
          speaker: odysseus
          text: |
            我说，那你在船边吃喝，留着好了。这事我必须去办，不能不去。我离开船，往岛里走，穿过中了法术的林子，快到喀耳刻的大屋时，赫尔墨斯迎面来了。他手里拿金杖，变成俊美的年轻人，正当青春，脸上刚长出软软的胡须。他走来握住我的手。
        - id: ch03-b08
          speaker: hermes
          text: |
            可怜的人，你受的苦够多了。独自翻过山头，连路都不认识，要到哪里去？伙伴们都关在喀耳刻的猪圈里，像野猪困在窝中。你还想救他们？我告诉你，你去了也出不来，只能跟他们关在一起。不过放心，我来护着你，帮你渡过这关。拿着这株药草，去她家时随身带上。它的力量很强，什么祸都能替你挡。

            她会用什么邪术，我也告诉你。她会给你调一杯喝的，在麦粉里下药。可是迷不倒你，我给你的药草能挡住法术。你记好怎么做。她拿杖打你，你立刻拔剑，扑过去，装成要杀她。她怕了，就会叫你上床。这时不能直接拒绝，还要靠她放人，还要她好好待你呢。先叫她向所有受祝福的神郑重起誓，不能再害你。不然等你没了衣服，她会夺掉你的男子之力，让你变成废人。
        - id: ch03-b09
          speaker: odysseus
          text: |
            说着，他把药草拔出地面，让我仔细看。根黑黑的，花却像牛奶一样白。诸神叫它摩吕，凡人拔不出，但神想做的事，没有做不到的。
    - id: ch04
      title: 神誓与解救
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            赫尔墨斯越过满是树木的小岛，回到高高的奥林波斯山。我往喀耳刻家继续走，心里像压着浓云，到门前站住，呼唤她。她听见便开门，请我进去。我满心忧虑地跟上。她给我一把装饰华美、镶着银的椅子，脚下还有凳。又用金杯调东西给我喝，里面下了药，打算害我。我喝下却没中法术。她拿杖敲我，叫了起来。
        - id: ch04-b02
          speaker: circe
          text: |
            走吧，进猪圈去，跟他们一起趴着！
        - id: ch04-b03
          speaker: odysseus
          text: |
            我拔出剑朝她扑去，像要取她性命。她尖叫一声，倒下抱住我的膝盖，哀求我。
        - id: ch04-b04
          speaker: circe
          text: |
            你是什么人？从哪来，哪一族的？药怎么对你没用？从前的人，只要尝一点，就没有能抵挡的。你一定不怕咒术。你就是勇敢的奥德修斯吧！赫尔墨斯早说过，你从特洛伊回家的路上，会驾船来我这儿。好啦，收起剑，到床上来。让我们做朋友，彼此信任。
        - id: ch04-b05
          speaker: odysseus
          text: |
            我说，喀耳刻，你刚把我的人变成猪，还让我相信你？现在我也进来了，你邀我上床，还不是要加害，夺去我的男子之力，叫我什么也做不成！先郑重发誓，不再谋害我，我才肯同你上床。她马上照办。等誓言全说完，我才跟她上床。

            她的四个侍女这时开始做家务。她们是树林、泉水和流进大海的神圣水流的女儿。一个拿漂亮紫布铺在座位上，再把地毯铺在下面。一个搬银桌到椅旁，桌上放金篮。第三个在银碗里兑好甜酒和水，把金杯摆到桌上。第四个提水，点旺火，把大锅架上。水开了，她兑些凉水，温度调得正合我的意，让我坐进澡盆，用锅里的水洗头和肩，消掉四肢的疲乏僵硬。洗好、抹了油，又给我穿上漂亮的衣服和披风，领回那把华美的嵌银椅，脚下仍有脚凳。一个侍女拿漂亮金壶，把水倒在银盆里给我洗手，再搬一张干净桌子到面前。女管事端来面包，摆上家里许多食物。喀耳刻请我吃，我却不碰，闷闷地坐着，不管面前有什么，心里还是猜疑。

            见我坐着不吃，那么难过，她走过来问。
        - id: ch04-b06
          speaker: circe
          text: |
            奥德修斯，怎么不说话，像个哑巴一样坐着？光在心里折磨自己，也不吃，也不喝，还是不放心？我都郑重发誓不会伤害你了，何必还疑心呢？
        - id: ch04-b07
          speaker: odysseus
          text: |
            我告诉她，一个人稍微懂点情义，朋友还没放出来、还没亲眼看到，怎么有心在你这儿吃喝？你要我吃饭，就把人放了，领到我面前，让我看看。她马上拿着杖走过院子，打开猪圈。伙伴们一头头出来，还是肥壮的猪，站着望她。她挨个抹另一种药，原来的毒药长出的鬃毛就掉了。大家变回人身，甚至更年轻，比从前高大，也好看多了。一眼认出我，人人来握我的手，欢喜得大哭，喊声充满房屋。连喀耳刻也心软，怜悯起他们，走来对我说。
        - id: ch04-b08
          speaker: circe
          text: |
            尊贵的奥德修斯，拉厄尔忒斯的儿子，快去停船的海岸。把船先拉上陆地，船上的用具和所有财物都藏进山洞，然后带着其余伙伴到我家来。
    - id: ch05
      title: 在喀耳刻家的一年
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: |
            我答应，回到海边。守船的人哭得很惨。看见我回来了，这群哭得稀里哗啦的傻伙伴，围着我直跳。就像母牛出去吃一天草，晚上回来等人挤奶，小牛挣脱束缚，奔到母亲身边蹦跳，叫声在整个农庄响起。他们高兴得好像已经回到了自己出生长大的故乡，回到了崎岖的伊萨卡。他们满怀亲热地对我说。
        - id: ch05-b02
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: |
            大人，看见你平安回来，我们像回了伊萨卡一样快活！可其他人呢？到底出了什么事，告诉我们吧。
        - id: ch05-b03
          speaker: odysseus
          text: |
            我好言安慰他们，说，我们先拖船上岸，把船具财物都藏到一个洞里。你们全跟我去喀耳刻家，越快越好。伙伴们已经在那里，面前食物和酒多得很，正吃着喝着。大家一听就想走，可欧律洛科斯拦住了。
        - id: ch05-b04
          speaker: eurylochus
          text: |
            唉，我们这群倒霉人，还不知有什么下场！别急着去喀耳刻家送命。她会把人变成猪，变成狼或狮子，让我们看守屋子。独眼巨人怎样害我们的，忘了吗？同伴们跟奥德修斯一起进洞，还不是死了！全怪他蠢，才把那些人的命送掉。
        - id: ch05-b05
          speaker: odysseus
          text: |
            我听了，真拿不准要不要拔出大腿旁挂的利剑，把他脑袋砍下，哪怕他是我的近亲。可伙伴们替他求情。
        - id: ch05-b06
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: |
            大人，你若肯答应，就让他留着看船吧。带我们其他人去喀耳刻那里。
        - id: ch05-b07
          speaker: odysseus
          text: |
            我们就一起往内陆走。欧律洛科斯最后也没有留在船边，我那一顿严厉责骂把他吓住了，他也跟来。

            我走的时候，喀耳刻已让留下的伙伴洗澡、抹橄榄油，又给他们羊毛披风和内衣。我们一到，看见大家舒舒服服吃着饭。两边面对面，认出彼此，又忍不住高兴地大哭。喊声响遍整座宫殿。喀耳刻这时走到我身边。
        - id: ch05-b08
          speaker: circe
          text: |
            拉厄尔忒斯尊贵的儿子，叫大家别哭了。我知道你们在海上有多苦，也知道陆上那些凶残野人如何对待你们。现在都过去了，住在这儿，好好吃喝，养回离开伊萨卡时的健壮精神。你们身体累坏了，心也累坏了，老想着途中遭的罪，半点欢喜都没有了。
        - id: ch05-b09
          speaker: odysseus
          text: |
            我们听她的，整整住下十二个月。肉和酒多得数不清，大家不停享用。月亮圆了又缺，一年过去，日子又长了。伙伴们叫我到一旁。
        - id: ch05-b10
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: |
            大人，如果还有命回到家里，见自己的故土，也该想想启程了。
        - id: ch05-b11
          speaker: odysseus
          text: |
            我答应了。那天仍旧从早到太阳下山，尽情吃喝。夜色来了，伙伴们去有顶的走廊躺下。我却在同喀耳刻上床后，抱住她的膝盖恳求，女神听着。我说，请兑现答应我的事，帮助我回家。我想回去，伙伴也想。你只要一转身，他们就来抱怨，不停缠我。
    - id: ch06
      title: 通往死者的国度
      blocks:
        - id: ch06-b01
          speaker: circe
          text: |
            奥德修斯，拉厄尔忒斯尊贵的儿子，你们若不想住，一个也不必留下。可回家之前，还有一次航行必须完成。你得先去哈得斯和可怕的珀耳塞福涅那里，见忒拜的盲先知忒瑞西阿斯的亡魂，向他问路。他心智仍然清明，珀耳塞福涅只让他一个死后还懂得事理，其他亡魂只是没有目的地到处飘荡。
        - id: ch06-b02
          speaker: odysseus
          text: |
            我听了，惊得全没了希望，坐在床上哭起来，连活下去、再看阳光都不愿。折腾累了，也哭累了，才问她，那谁给我领航呢？哈得斯的住所，不是船能驶到的港口啊。
        - id: ch06-b03
          speaker: circe
          text: |
            不用人带路。你竖起桅杆，撑开白帆，然后静静坐好。北风自己会带你过去。船穿过俄刻阿诺斯的水域，就到珀耳塞福涅国度肥沃的岸边。那里有成林的高白杨，也有果实还没到时候就掉下的柳树。把船拖上俄刻阿诺斯岸边，直接去哈得斯幽暗的住所。皮里弗勒革同河和科库托斯河在那里流进阿刻戎河，住所就在附近。科库托斯河还是斯堤克斯河的一条支流。你会看见一块岩石，就在两条咆哮的河会合处。

            到了那个地点，照我说的挖坑，长、宽、深都大约一肘。给所有死者献上饮料，倒进坑里。先是蜂蜜调牛奶，再倒酒，最后倒水，面上撒白大麦粉。对那些虚弱可怜的亡魂，要多多祈祷。答应他们，等你回伊萨卡，就把家里最好的一头不孕小母牛拿来献祭，祭火上摆满好东西。还要特地答应忒瑞西阿斯，把羊群中最好的黑羊单独献给他。

            祈求完了，再杀一只公羊、一只黑母羊，羊头对着厄瑞玻斯，你自己转向另一边，脸朝河。许多死者的亡魂就会过来。让伙伴把刚杀的两只羊剥皮，放到火上烧，献给哈得斯和珀耳塞福涅，并向他们祈祷。接着你拔剑坐好，在忒瑞西阿斯回答之前，不准其他亡魂接近地上的血。先知很快会来，告诉你路上分几程、经过哪里，如何渡海才能回到家。
        - id: ch06-b04
          speaker: odysseus
          text: |
            她讲完，天亮了，给我穿上内衣和披风。她自己披一件很美、薄得像蛛丝的衣料，腰间系金带，头上罩披巾。我在屋里四处找伙伴，每个人都和气地叫一声，说，不能再睡，得出发啦，喀耳刻已经把事情都告诉我。大家就按我说的起身。

            可离开前，还是出了意外。有个年轻人，叫埃尔佩诺尔，说不上聪明，也没什么勇气。他喝醉了，躲开众人，到屋顶凉快处睡觉，想把酒意睡掉。听见大家忙起来的动静，他一下跳起，忘记该从正梯下楼，直接摔下房顶，折断脖子，魂魄去了哈得斯那里。

            我把船员召来，说，你们以为这就回家了，可喀耳刻交代，我们先得去哈得斯和珀耳塞福涅的宫殿，求问忒拜先知忒瑞西阿斯的亡魂。

            大家伤心得心都碎了，扑在地上呻吟，扯着自己的头发，可再哭也改不了。我们一路悲叹，哀怨自己的命，来到海边。喀耳刻带来公羊和母羊，我们系在船旁。她就从人群中经过，我们竟都没察觉。神若不愿被人看见，谁又看得见她的来去呢？
