audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts: {delivery: "用朴素的语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有起伏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏，直接讲述亲身经历", timbre: "饱经风霜，厚实清楚", pace: "稳健，停顿长短有变化", pitch: "中低音"}
    aeolus:
      display_name: 埃奥洛斯
      tts: {delivery: "自信果断", timbre: "厚实坚定", pace: "平稳", pitch: "中低音"}
    crew_1:
      display_name: 船员甲
      tts: {delivery: "诚恳直率", timbre: "清楚略带沙哑", pace: "利落", pitch: "中音"}
    crew_2:
      display_name: 船员乙
      tts: {delivery: "急切而务实", timbre: "干涩有力", pace: "稍快", pitch: "中低音"}
    eurylochus:
      display_name: 欧律洛科斯
      tts: {delivery: "警惕务实，说话坚持己见", timbre: "紧绷粗涩", pace: "稳中带急", pitch: "中低音"}
    hermes:
      display_name: 赫尔墨斯
      tts: {delivery: "自信清楚，指点准确", timbre: "年轻清亮", pace: "轻快而不仓促", pitch: "中音"}
    circe:
      display_name: 喀耳刻
      tts: {delivery: "笃定从容", timbre: "圆润深稳", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: 家乡就在前面
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |-
            王啊，伊萨卡岸上的火，我都看见过了。离家已经那么近，偏偏我在那时候睡着了。

            那以前，我们去过埃奥洛斯的岛。那岛浮在海面，外面围着金属做的墙。他有六儿六女，让儿子分别娶了自己的姐妹，儿女们全留在家里，天天吃喝。他请我们住了一个月，总要听特洛伊的故事。
            宙斯让他管着风。送我们走的时候，他拿牛皮袋装好所有妨碍航行的风，用银绳扎牢，放到船上。只剩西风在吹，送我们往家走。我掌舵掌了九天九夜，第十天，望见故乡了，终于累得睡过去。同伴却以为牛皮袋里有金银，盯着不放。
        - id: ch01-b02
          speaker: crew_1
          text: 我们跟他走这么远，什么也没捞着，他倒四处收礼。拆开瞧瞧，这次他拿了什么。
        - id: ch01-b03
          speaker: odysseus
          text: 绳一解开，袋里的风全刮出来，船队又被卷走。我醒过来，听着风声和同伴的哭喊，差一点就跳海求死了。最后还是忍住，把披风拉过头，随船漂回了埃奥洛斯的岛。我再去求他，他却不肯帮忙。
        - id: ch01-b04
          speaker: aeolus
          text: 我都送你回乡了，神又把你赶回来，摆明了不肯容你。我哪里还敢帮忙！走吧！
    - id: ch02
      title: 只剩一条船
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |-
            没有顺风可用，我们只能划。足足划了六天，第七天才到莱斯特律戈涅斯人的港口。高崖夹着狭窄的入口，港内却很平静。其他船都开进去，我的留在外头。我派三个人探路，他们遇上一个打水的姑娘，姑娘的父亲就是安提法忒斯王，便给他们指了家门。
            一进屋，他们就吓住了，王后也是个巨人。她又叫来国王。国王抓住一个人吃了，另外两个赶紧跑，背后已经响起了国王的呼喊。巨人们赶到崖上，往下投石。港里的船挤成一团，被撞碎了，他们还像叉鱼那样刺中我的人，带回家吃。
            我割缆绳，催大家拼命划。进港的船一条都没能出来，只有我们这条逃走了。

            到了埃埃亚岛，我们在岸边躺了两天。我上山看见林里有烟，回来时打到一头鹿，大家总算能吃个饱，再去见这位陌生的主人。可是同伴一听那里有人，就想起独眼巨人，又想起刚才的惨事。
            我把大家分成两队，抽签派人。抽中的是欧律洛科斯，他带二十二人去，找到了喀耳刻的石头房子。房子外的狼和狮子都受过法术，像狗一样过来蹭人，竟不扑咬。屋里，喀耳刻织着布，唱着歌。我很信任的波利忒斯让大家叫门，她便出来请人进去。
            欧律洛科斯不放心，一个人等在门外。其余人吃了她的东西，喝了她的饮料，里面都下了忘家的药。她再拿杖碰一碰，人就变成了猪，心里却仍记得过去，还是人的心思。她把他们关起来，只给猪吃的果子。
            这些事，门外的人可不知道。他只见大家进去，再没出来。等不下去了，便跑回船边，哭了好久，才向我讲明白。我拿了武器，叫他带路，他却抓住我恳求。
        - id: ch02-b02
          speaker: eurylochus
          text: 别让我去！他们回不来了，你去了也会死的。我们还有人活着，带他们逃命吧。
          emotion: fearful
        - id: ch02-b03
          speaker: odysseus
          text: 你不去，就留在这里。我得去救他们。
    - id: ch03
      title: 黑根白花的草
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: 快到她家时，有个年轻人握住我的手。他是赫尔墨斯，告诉我同伴已经成了猪，又拔出一株草给我。根是黑的，花是白的，神叫它摩吕。
        - id: ch03-b02
          speaker: hermes
          text: 带着这株草，喝她的药也不会变成猪。等她拿杖打来，你拔剑扑过去，让她以为你要杀她。她会请你上床，你要救人，就别推辞。不过，先叫她向众神起誓，保证不伤你。不然你一脱衣服，她就会让你再也做不成男人。
        - id: ch03-b03
          speaker: odysseus
          text: 我走进石屋，喀耳刻让我坐下，递来掺了药的饮料。我喝完，她就举杖打我。
        - id: ch03-b04
          speaker: circe
          text: 到猪圈去，找你的同伴吧。
        - id: ch03-b05
          speaker: odysseus
          text: 可我还是人。我拔剑冲去，她惊叫一声，抱住我的膝盖，终于认出来了。赫尔墨斯早说过，奥德修斯回家时会来这里。
        - id: ch03-b06
          speaker: circe
          text: 把剑放下。到床上来，我们也好信任彼此。
        - id: ch03-b07
          speaker: odysseus
          text: |-
            你把我的人变成猪，还叫我放心脱衣服？想趁机让我做不成男人吗？除非你先发誓不害我，否则别想。

            她发了誓，我才和她睡在一起。之后，仆人帮我洗澡，换上干净衣裳，端来饭。我却一口没吃。
        - id: ch03-b08
          speaker: circe
          text: 为什么不吃？我都起过誓了，你还信不过？
        - id: ch03-b09
          speaker: odysseus
          text: |-
            先把我的同伴放出来。我要见到他们，才吃得下这顿饭。

            她到猪圈去，拿另一种药涂在他们身上。毛落了，人又回来了，还比先前年轻壮实。他们拉着我的手大哭，喀耳刻也受了感动，叫我把船边的人接来。岸上的同伴看我活着，欢喜得像回到家一样。我让他们拖好船，藏好东西，再去和获救的人团聚。欧律洛科斯却又拦住大家。
        - id: ch03-b10
          speaker: eurylochus
          text: 还跟他走？你们也想变成野兽吗？洞里死的那些人，不就是让他的固执害死的吗？
        - id: ch03-b11
          speaker: odysseus
          text: 我想拔剑砍了他的头，什么亲族也不顾了。大家忙来拦我，说让他留下守船就好。我斥责了他，他害怕，后来还是跟着去了。两队人在屋里相见，抱头痛哭。喀耳刻说，那些苦难还在折磨我们，先好好休息吃饭，把身子养好再说。
    - id: ch04
      title: 还要去死者那里
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: 这一住，竟住满一年。同伴终于把我拉到一旁。
        - id: ch04-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: 也该想想家了吧。你还想不想见伊萨卡？
        - id: ch04-b03
          speaker: odysseus
          text: 那晚，我求喀耳刻帮我们回家。她答应放人，却说眼下还不能走那条路。
        - id: ch04-b04
          speaker: circe
          text: 去冥府找忒瑞西阿斯吧。珀耳塞福涅让这位先知死后也能明白事理。要找回家的路，你得去问他。
        - id: ch04-b05
          speaker: odysseus
          text: |-
            我坐起来哭。活人要怎样去冥府，又找谁带路？她便告诉我，北风会送船过俄刻阿诺斯，在死者国度旁的树林靠岸。我得找到河流相交处，献祭，再拔剑守着血，不让聚来的亡魂靠近，先听先知说话。
            她一直说到天快亮。我起身叫同伴，忙乱中，年轻的埃尔佩诺尔从屋顶跌下，折了脖子。他喝醉后睡在上面，惊醒时忘了楼梯。这番经过，要到冥府见了他，我才知道。
            大家聚过来，都以为能回家了。我却说，我们先要去找死者。他们倒在地上哭，最后又跟着我往海边走。喀耳刻送来了献祭的牲畜，没人看见她怎么穿过人群的。

            我们把东西装上船，准备去那谁都不愿去的地方。
