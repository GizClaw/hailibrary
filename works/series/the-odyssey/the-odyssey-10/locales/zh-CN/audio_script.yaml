        timbre: 温暖清晰
        pace: 舒缓有起伏
        pitch: 中音
    odysseus:
      display_name: 奥德修斯
      tts:
        delivery: 沉着机敏，直接讲述亲身经历
        timbre: 饱经风霜，厚实清楚
        pace: 稳健，停顿长短有变化
        pitch: 中低音
    aeolus:
      display_name: 埃奥洛斯
      tts:
        delivery: 自信果断
        timbre: 厚实坚定
        pace: 平稳
        pitch: 中低音
    aeolus_family_1:
      display_name: 埃奥洛斯的家人甲
      tts:
        delivery: 直率清楚
        timbre: 轻而清晰
        pace: 舒缓
        pitch: 中音
    aeolus_family_2:
      display_name: 埃奥洛斯的家人乙
      tts:
        delivery: 坦率自然
        timbre: 明亮柔和
        pace: 平稳
        pitch: 中高音
    aeolus_family_3:
      display_name: 埃奥洛斯的家人丙
      tts:
        delivery: 干脆有力
        timbre: 饱满清楚
        pace: 舒缓
        pitch: 中低音
    crew_1:
      display_name: 船员甲
      tts:
        delivery: 诚恳直率
        timbre: 清楚略带沙哑
        pace: 利落
        pitch: 中音
    crew_2:
      display_name: 船员乙
      tts:
        delivery: 急切而务实
        timbre: 干涩有力
        pace: 稍快
        pitch: 中低音
    crew_3:
      display_name: 船员丙
      tts:
        delivery: 坦率恳切
        timbre: 明亮粗实
        pace: 平稳
        pitch: 中音
    eurylochus:
      display_name: 欧律洛科斯
      tts:
        delivery: 警惕务实，说话坚持己见
        timbre: 紧绷粗涩
        pace: 稳中带急
        pitch: 中低音
