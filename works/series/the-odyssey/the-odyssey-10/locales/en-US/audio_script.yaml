  chapters:
    - id: ch01
      title: Home in sight
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Odysseus went on with his account.
        - id: ch01-b02
          speaker: odysseus
          text: |
            Alcinous, Aeolus gave me what I needed to reach home. We found him on an island that floated, surrounded by a metal wall. He'd married his six sons to his six daughters. They all lived and feasted with their father and mother. We stayed a month with that family. He kept asking me about Troy, and when I was ready to sail, he gave us something better than treasure.
            Zeus had made him keeper of the winds. He put every wind that might hinder us into an oxhide bag and tied it shut with silver cord. Only the west wind was allowed to blow. It took us straight towards Ithaca.
            I steered for nine days. On the tenth, we could see our homeland, even the fires on it. Then I fell asleep, worn out. The crew noticed the bag and thought I was keeping gifts of silver and gold from them. One man spoke up.
        - id: ch01-b03
          speaker: crew_1
          text: |
            Everyone gives him presents. We've traveled just as far. Let's open that bag and see what he's taking back.
        - id: ch01-b04
          speaker: odysseus
          text: |
            They untied it. Out rushed the winds, filling our sails and carrying us away from home. I woke to shouting and a storm. I almost threw myself into the sea. But I stayed aboard, covered myself with my cloak and bore it while we were swept back to Aeolus.
            He could hardly believe I was at his door again. I explained and asked him for another chance.
        - id: ch01-b05
          speaker: aeolus
          text: |
            I won't help you this time. I sent you safely off, and the gods sent you back. I won't oppose them. Go.
        - id: ch01-b06
          speaker: odysseus
          text: |
            We left under oars. On the seventh day, we found the Laestrygonians' harbor. Steep cliffs stood on either side of its narrow entrance. My captains took their ships into the still water. I fastened mine outside by a rock and sent three men to meet the inhabitants.
            A girl drawing water pointed them to her father, King Antiphates. They went in and saw his enormous wife. She called her husband, who seized one visitor and started eating him. The other two ran back.
            Giants came to the alarm and hurled rocks from the cliffs. Inside the harbor, vessels smashed together. The giants drove spears into my men as though they were fishing, and took them home to eat. I cut our rope and ordered everyone to row. We escaped the falling rocks. Not one of the other ships escaped.
    - id: ch02
      title: The men who never came out
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            We had just one ship when we reached Aeaea. For two days we lay exhausted on the beach. Then I went inland, climbed up and saw smoke among the trees. Coming back, I killed a stag for our dinner. At least we wouldn't approach the next strange house hungry.
            My men were afraid when I mentioned the smoke. They remembered Polyphemus and those cliffs. But we had to find out where we were. I made two groups, and we drew lots. Eurylochus went with twenty-two men.
            They came to a stone house. Lions and wolves wandered about it, coming close and rubbing against them like tame dogs. Circe had bewitched them. From indoors, a woman sang as she wove.
            Polites was a man I trusted deeply. He suggested they call out, and when they did, Circe opened the door to welcome them. Eurylochus distrusted the place and stayed outside. Everyone else went in.
            Circe put drugs in their meal and wine to make them forget home. She struck them with her wand, and they turned into pigs. Yet they could still think and remember as men. She shut them in a sty and fed them as pigs.
            Eurylochus hadn't seen that happen. He only knew none of his men came out again. He ran back to me, almost unable to talk through his tears. I armed myself and told him to show me the way. He held onto me with both hands.
        - id: ch02-b02
          speaker: eurylochus
          text: |
            Please don't take me back there. We should save the men who are still here. You'll be lost as well.
        - id: ch02-b03
          speaker: odysseus
          text: |
            You can wait here. I must go after them.
            Near the house, a young man took my hand. He was Hermes. He told me about the pigs and pulled up a plant with a black root and a white flower. Moly, the gods called it.
        - id: ch02-b04
          speaker: hermes
          text: |
            Carry this, and her drink won't transform you. When her wand hits you, charge at her with your sword as if you're going to kill her. She'll ask you into her bed. You need her to free your friends, so don't turn her down. First get her oath by the gods, though. Once you're undressed, she may take away your manhood. Make her promise not to harm you.
    - id: ch03
      title: The oath and the empty plate
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            I reached the house alone. Circe offered me a drink. I drank it, and she touched me with the wand. Nothing changed.
        - id: ch03-b02
          speaker: circe
          text: |
            Go and join the pigs now.
        - id: ch03-b03
          speaker: odysseus
          text: |
            I rushed at her with my sword as though I meant to kill her. She screamed and clung to my knees. She knew now who I was. Hermes had told her Odysseus would arrive one day.
        - id: ch03-b04
          speaker: circe
          text: |
            Sheathe that sword. Share my bed, and we'll come to trust one another.
        - id: ch03-b05
          speaker: odysseus
          text: |
            How can I trust you? My friends are pigs, and now you want me naked in your bed. You could destroy my manhood there. Give me your oath not to hurt me, or I won't lie with you.
            She swore, and I went to bed with her. Afterwards, her servants gave me a bath and fresh clothes. They put a meal on the table, but I wouldn't touch it.
        - id: ch03-b06
          speaker: circe
          text: |
            I've given you my oath. Are you still afraid to trust me?
        - id: ch03-b07
          speaker: odysseus
          text: |
            My friends aren't here. Let me see them safe before I eat your food.
            She went out to the sty and treated them with a different drug. Their bristles disappeared, and they stood upright as men, looking younger and stronger. They seized my hands and cried with relief. Even Circe was touched. She told me to bring the others from the beach.
            Those waiting there crowded round when I returned. I told them to secure the ship, hide our things and come to join their friends. Eurylochus tried to hold them back.
        - id: ch03-b08
          speaker: eurylochus
          text: |
            Do you want to become animals too? Remember how his stubbornness got our friends killed in the cave.
        - id: ch03-b09
          speaker: odysseus
          text: |
            I thought of pulling out my sword and taking his head off, relative or not. The others stepped in. They asked me to leave him guarding the ship and take them to Circe. But after my rebuke, he was afraid to stay, and followed us.
            Inside the house, the two parties embraced and wept. Circe said we should eat and rest until we were ourselves again. We were still suffering from every hardship we'd passed through.
    - id: ch04
      title: A voyage to the dead
      blocks:
        - id: ch04-b01
          speaker: odysseus
          text: |
            With shelter, food and wine, the months slipped by. After a year my men took me aside.
        - id: ch04-b02
          speakers: [crew_1, crew_2]
          ensemble: duo
          text: |
            What about Ithaca? If we're going home at all, it's time to go.
        - id: ch04-b03
          speaker: odysseus
          text: |
            That night I asked Circe for help leaving. She was willing to let us go. But she named a journey I'd never thought of making.
        - id: ch04-b04
          speaker: circe
          text: |
            You'll have to visit the dead first. Tiresias can tell you about your way home. Persephone has allowed him to keep his reason, even after death.
        - id: ch04-b05
          speaker: odysseus
          text: |
            I sat up in tears. How could we sail there while we were alive? Who knew the way?
        - id: ch04-b06
          speaker: circe
          text: |
            The north wind will take you across Oceanus. Beach your ship near the groves, at the edge of the dead's country. Go to where the rivers meet and make offerings. The spirits will come. Keep them from the blood until Tiresias has spoken to you.
        - id: ch04-b07
          speaker: odysseus
          text: |
            By morning she'd explained everything. I went to wake the men. In the bustle, Elpenor fell from the roof where he'd slept after drinking. The noise woke him suddenly. He forgot the stairs, fell and broke his neck. I would hear what had happened from him among the dead.
            The others gathered, expecting to head for Ithaca. When I told them our first destination, they dropped to the ground and cried. At last they rose and came to the shore with me. Unseen, Circe had walked among us and brought the animals for our offering.
            We put our supplies aboard for a journey none of us wanted.
