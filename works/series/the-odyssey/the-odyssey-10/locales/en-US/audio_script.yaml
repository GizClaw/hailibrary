  chapters:
    - id: ch01
      title: The bag of winds
      blocks:
        - id: ch01-b01
          speaker: odysseus
          text: |
            Our next voyage brought us to the Aeolian island. Aeolus lived there, the son of Hippotas, a man dear to the immortal gods. The island seems to float on the sea, and an iron wall runs right around it. Aeolus had six daughters and six strong sons. He had married the sons to the daughters, and they all lived with their beloved father and mother. They feasted together, enjoying every luxury you could think of. All day, the smell of roasting meat filled the house. The whole place, even the yard, rang with their feasting. At night each son slept beside his wife, under the blankets of a well-made bed. That was the household we had come to.

            Aeolus kept me as his guest for a month. He never tired of asking about Troy, about the Argive ships and about the Achaeans returning home. I told him exactly how it had all happened. When I said I must leave and asked for help with my journey, he agreed without hesitation. He went straight to work for me. He skinned a fine ox and made a sack of its hide, shutting up the paths of the roaring winds inside. Jove had put him in charge of the winds. He could set any of them blowing or bring it to rest, just as he pleased. He placed the sack in my ship and tied its mouth with silver thread. It was bound so tightly that not a breath of wind could escape from any side. Only the West wind was left free, because that would carry us the way we wanted to go. But all his care came to nothing. Our own foolishness ruined us.

            For nine days and nine nights we sailed. On the tenth, our homeland appeared on the horizon. We came close enough to make out the fires burning the stubble in the fields. By then I was utterly exhausted and drifted into a light sleep. I had kept my own hands on the rudder the whole time, wanting to bring us home as quickly as possible. While I slept, the men began whispering together. They thought the bag Aeolus had given me was full of gold and silver. One man would turn to his neighbor and say this.
        - id: ch01-b02
          speaker: crew_1
          text: "Just look at him. Wherever he goes, whatever town or country he visits, everyone honors him and makes him their friend. Look at the splendid prizes he is bringing back from Troy. We have been every bit as far as he has, and we come home with nothing in our hands, just as we left. Now Aeolus has given him a whole lot more. Come on, let's open that bag. Let's see what's in it and find out how much gold and silver he has been given."
        - id: ch01-b03
          speaker: odysseus
          text: |
            That was the talk, and they followed the bad advice. They untied the sack. The winds rushed out howling and raised a storm. We wept as it swept us back into the open sea, away from our own country. I woke up. For a moment I could not decide whether to throw myself into the water or keep living and bear what had happened. I chose to bear it. I covered myself up and lay down in the ship. The men cried bitterly while the fierce winds drove our fleet all the way back to the Aeolian island.

            When we arrived, we landed to fetch water and ate beside the ships. As soon as the meal was over, I took a herald and one of my companions straight to Aeolus's house. He was there at a feast with his wife and children. We sat down on the threshold as men begging for help. The family stared at us in astonishment.
        - id: ch01-b04
          speakers: [aeolus_family_1, aeolus_family_2, aeolus_family_3]
          ensemble: chorus
          text: "Ulysses, why have you come back here? Which god has treated you like this? We did everything we could to help you reach Ithaca, or any other place you wished to go."
        - id: ch01-b05
          speaker: odysseus
          text: "I answered them in sorrow. My own men have been my ruin, I said. My men, and that cruel sleep. Friends, put this disaster right for me. You have the power, if you are willing. I tried to move their hearts, but no one said a word. At last their father answered."
        - id: ch01-b06
          speaker: aeolus
          text: "Get off my island at once, you miserable creature. I will give no help to a man the gods hate. Go away. You have come back here with heaven against you."
        - id: ch01-b07
          speaker: odysseus
          text: "With that, he drove me from his door, full of grief."
    - id: ch02
      title: The harbor of the giants
      blocks:
        - id: ch02-b01
          speaker: odysseus
          text: |
            We sailed away sadly. There was no wind left to help us, and the men wore themselves out with long, fruitless rowing. We worked for six days and nights. On the seventh we reached Lamus's rocky stronghold, Telepylus, the city of the Laestrygonians. In that country a shepherd bringing his flock in to be milked calls to the shepherd taking his animals out to feed, and the other calls back. If a man could live without sleep there, he could earn two men's wages. He could tend cattle for one wage and sheep for the other. They work at night much as they do by day.

            The harbor was enclosed by land beneath steep cliffs. Two headlands stood close together, leaving only a narrow way in. All my captains took their ships inside and tied them up side by side. There was never even a puff of wind in that harbor. The water was always perfectly still. But I left my own ship outside and fastened her to a rock at the very tip of the point. I climbed a high rock to look about. I saw no people and no cattle, only smoke rising from the ground. So I sent two companions, with a man to attend them, to find out who lived there.

            After landing, they followed a level road. The people used it to haul firewood down from the mountains into the town. Soon they met a girl who had come out for water. She was the daughter of a Laestrygonian called Antiphates. She was on her way to the spring of Artacia, where the townspeople fetched their water. My men went up and asked who ruled this country and what sort of people he ruled over. She pointed them to her father's house. When they reached it, they found his wife there. She was a giantess, huge as a mountain. The sight of her terrified them.

            She called her husband Antiphates back from the meeting place. He set upon my men at once. He grabbed one of them and began eating him for dinner, right there. The other two ran to the ships as fast as their legs could carry them. But Antiphates raised the alarm, shouting after them. Thousands of powerful Laestrygonians sprang up from every side. They were monsters who ate men, not ordinary people. From the cliffs they threw enormous rocks as easily as throwing pebbles. I heard the dreadful crunch of ships smashing against one another and my men's cries as they died. The giants speared them as if they were fish, then carried them home to eat. While this slaughter went on inside the harbor, I drew my sword and cut my ship's cable. I told the crew to pull with all their strength unless they wanted the same fate. They rowed for their lives. How thankful we were to get out into open water, beyond the reach of those rocks. Of all the others, not one was left.

            We sailed on grieving for our companions, but glad to be alive. We came to the island of Aeaea. Circe lives there, a powerful and cunning goddess. The magician Aeetes is her full brother. The Sun is their father, and their mother is Perse, the daughter of Oceanus. Some god guided our ship into a safe harbor, and we brought her in without a word. Once we had landed, we lay there for two days and two nights, exhausted in mind and body. On the third morning I took my spear and sword and went out from the ship to explore. I hoped to find some work done by human hands, or hear people talking. From a high lookout I saw smoke rising among the thick trees. It came from Circe's house. Now that I had seen it, I wondered whether I should go straight there and learn more. But I decided it would be wiser to return, give the men their meal and send some of them to look instead.

            I was nearly back at the ship when a god took pity on me, alone as I was, and sent a magnificent stag into my path. He had fine antlers. The heat of the sun was driving him down from his feeding ground in the forest to drink at the river. As he passed, I thrust my spear into the middle of his back. The bronze point went right through him. He fell in the dust, groaning until his life left him. I set a foot on him, pulled the spear out of the wound and put it down. Then I gathered coarse grass and rushes and twisted them into a strong rope, about a fathom long. I tied the splendid animal's four feet together and hung him round my neck. I walked back using my spear as a staff. He was much too big to carry on one shoulder and steady with a single hand.

            I threw him down in front of the ship and called the men, speaking cheerfully to each one. Friends, I told them, it seems we are not going to die so far before our time after all. At least we will not starve while there is food and drink left aboard. They uncovered their heads where they lay on the shore and admired the stag. He really was a splendid creature. When they had looked at him long enough, they washed their hands and set about cooking their dinner.

            We stayed there all day, eating and drinking as much as we wished, until the sun went down. When darkness came, we slept on the shore.
    - id: ch03
      title: The house among the trees
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |
            Rosy-fingered Dawn, the child of morning, appeared. I called the men together. Listen to me, friends, I said. We are in serious trouble. We do not know where the sun rises or where it sets. We cannot even tell east from west. I can see no way out, but we must try to find one. One thing is certain. This is an island. I climbed as high as I could this morning and saw the sea all around it, right out to the horizon. The island lies low, but towards its middle I saw smoke coming out of a thick forest.

            Their hearts sank at that. They remembered Antiphates the Laestrygonian and the savage Polyphemus, and how those monsters had treated us. They wept bitterly in their fear. But crying would do no good, so I divided them into two parties and gave each a captain. Eurylochus would lead one. I would lead the other. We put our lots into a helmet, and Eurylochus's lot came out. He set off with twenty-two men. They went weeping, and those of us who stayed behind wept too.

            Circe's house stood in the forest, built of cut stone, in a place visible from a long way off. Mountain wolves and lions wandered round it. Poor creatures, she had bewitched them, tamed them with her spells and brought them under control with drugs. They did not attack the men. They wagged their great tails and fawned on them, rubbing their noses against them affectionately. Dogs crowd round their master when he comes from a meal, knowing he will bring them something. That was how these wolves and lions with their great claws greeted my men. But such strange behavior from such animals frightened the men terribly. They came to the doors and heard Circe singing inside, singing beautifully as she worked her loom. The cloth she was weaving was wonderfully soft and fine, with brilliant colors that only a goddess could weave. Polites spoke. Of all my companions, he was the one I trusted and valued most.
        - id: ch03-b02
          speaker: polites
          text: "Someone in there is weaving and singing. What a beautiful voice. You can hear it through the whole house. Let's call to her and find out whether she is a woman or a goddess."
        - id: ch03-b03
          speaker: odysseus
          text: |
            They called, and she came down, undid the door and invited them inside. They suspected nothing and followed her. All except Eurylochus. He thought there might be danger and stayed outside. She seated the others on chairs and benches and made them a mixture of cheese, honey, meal and Pramnian wine. Into it she put harmful drugs that would make them forget their homes. Once they had drunk, she struck them with her wand and changed them into pigs. Then she shut them into her pigsties. Their heads were pigs' heads, their hair was pigs' hair, and they grunted like pigs. Everything had changed except their minds. They still understood and remembered everything.

            They squealed inside the pens while Circe threw them acorns and beech nuts, the food pigs eat. Eurylochus hurried back to tell me the dreadful fate of our friends. He was so distraught he could hardly speak. He tried, but no words came. His eyes filled with tears, and all he could do was sob and sigh. We kept pressing him until at last he told us what had happened.
        - id: ch03-b04
          speaker: eurylochus
          text: "We went through the forest as you ordered. In the middle was a fine stone house, standing where you could see it from far away. There was a woman inside, or perhaps a goddess. She was at her loom, singing sweetly. The men called out to her. She came straight down, opened the door and asked us in. The others had no thought of a trap and went inside with her. I suspected treachery, so I stayed where I was. After that I never saw them again. I waited a long time, watching the house, but not one of them came out."
        - id: ch03-b05
          speaker: odysseus
          text: "I slung my bronze sword over my shoulder and took my bow. I told Eurylochus to go back with me and show me the way. But he caught hold of me with both hands and begged me pitifully."
        - id: ch03-b06
          speaker: eurylochus
          text: "Sir, please don't make me go. Leave me here. I know you won't bring any of them back, and you won't come back alive yourself. Let's try to escape with the few men we still have. There may yet be a way to save our lives."
        - id: ch03-b07
          speaker: odysseus
          text: "Then stay here, I told him. Eat and drink by the ship if you wish. But I must go. I cannot leave this undone. I left the ship and made my way inland. I passed through the enchanted grove and was nearing Circe's great house when I met Mercury carrying his golden wand. He had the shape of a handsome young man, just at the height of youth, with the first soft hair on his face. He came up and took my hand in his."
    - id: ch04
      title: The herb and the oath
      blocks:
        - id: ch04-b01
          speaker: hermes
          text: |
            Poor man, you have had so much suffering. Where are you going across this hilltop, all alone and not even knowing the way? Your companions are shut in Circe's pigsties, like wild boars in their dens. Do you really think you can free them? If you go there, you will never come back. You will be kept with the others. But take heart. I will protect you and help you out of this trouble. Carry this herb with you into Circe's house. Its power is great, and it will guard you from every kind of harm.

            I will tell you what wicked magic she plans to use. She will prepare a drink for you, putting drugs into the meal she mixes with it. But she will not be able to bewitch you. The herb I give you will stop her spell from taking hold. Here is what you must do. When she strikes you with her wand, draw your sword and leap at her as if you mean to kill her. She will be frightened and ask you to lie with her. You must not refuse her outright. You need her to free your friends, and you need her to treat you well. But first make her swear a solemn oath by all the blessed gods that she will plan no further harm. Otherwise, when she has you naked, she may take away your manhood and leave you useless.
        - id: ch04-b02
          speaker: odysseus
          text: |
            As he spoke, he pulled the plant from the earth and showed it to me. Its root was black and its flower as white as milk. The gods call it Moly. Men cannot tear it from the ground, but the gods can do whatever they wish.

            Mercury went back across the wooded island to high Olympus. I walked on to Circe's house, with worry darkening my heart. At her doors I stood and called. The goddess heard me, came down at once, opened the door and invited me in. I followed, still deeply troubled. She gave me a finely decorated chair inlaid with silver, with a stool beneath my feet. Then she mixed a drink in a golden cup and handed it to me. There were drugs in it. She intended to harm me. I drank, and the spell did nothing. Then she struck me with the wand and called out.
        - id: ch04-b03
          speaker: circe
          text: "Off with you now. Go to the pigsty and lie there with the rest of them."
        - id: ch04-b04
          speaker: odysseus
          text: "I drew my sword and rushed at her as if I were about to kill her. She screamed and fell down, clasping my knees. Then she pleaded with me."
        - id: ch04-b05
          speaker: circe
          text: "Who are you? Where did you come from, and who are your people? How can my drugs have no power over you? No man has ever resisted even a taste of what I gave you. Spells must have no hold on you. You must be Ulysses, the bold hero. Mercury always told me you would come here one day in your ship, on your way back from Troy. Very well. Put your sword away and come to bed with me. Let us become friends and learn to trust one another."
        - id: ch04-b06
          speaker: odysseus
          text: |
            How can I trust you, Circe, I answered, when you have just changed all my men into pigs? Now you have me here too. You invite me into your bed because you mean to harm me, to rob me of my manhood and make me useless. I will not lie with you until you swear a solemn oath that you will do me no more harm. She took the oath at once, just as I demanded. Once she had sworn it, I went to bed with her.

            Meanwhile, her four household servants began their work. They are daughters of the woods and springs and the holy waters that run down to the sea. One laid a beautiful purple cloth over a seat and spread a carpet beneath it. Another brought silver tables beside the chairs and put golden baskets on them. The third mixed sweet wine with water in a silver bowl and set gold cups on the tables. The fourth brought water, lit a good fire and put a large cauldron over it. When it boiled, she added cold water until the heat was just as I liked it. She seated me in a bath and poured water from the cauldron over my head and shoulders, easing the tiredness and stiffness from my limbs. After washing me, she rubbed me with oil and dressed me in a fine shirt and cloak. She led me to a decorated silver-inlaid chair, with a footstool beneath it. A maid brought a beautiful gold jug and poured water into a silver basin so I could wash my hands. She drew a clean table up to me. An upper servant brought bread and offered me many of the foods they had in the house. Circe invited me to eat. But I would not touch it. I sat there, gloomy and suspicious, paying no attention to the food.

            Circe saw me sitting in such grief and refusing to eat. She came over to me.
        - id: ch04-b07
          speaker: circe
          text: "Ulysses, why sit there without a word, as though you could not speak? You are tormenting yourself and will neither eat nor drink. Do you still mistrust me? There is no need. I have already sworn solemnly that I will not hurt you."
        - id: ch04-b08
          speaker: odysseus
          text: "Circe, I said, what man who knows what is right could think about eating and drinking here while his friends are prisoners? You must set them free and let me see them first. If you want me to share your food and wine, release my men and bring them here before my own eyes. She took her wand and went straight across the courtyard to open the pigsties. My companions came out as fat, fine pigs and stood looking at her. She went among them and rubbed each one with a different drug. The bristles caused by the first drug fell away. They became men again, younger than before, much taller and more handsome. They recognized me at once. Each seized my hand, and they wept with joy. Their shouting and crying filled the house. Even Circe felt pity for them. She came to me and spoke."
        - id: ch04-b09
          speaker: circe
          text: "Noble Ulysses, son of Laertes, go straight back to the shore where your ship is waiting. First pull her onto dry land. Hide all her equipment and all your possessions in a cave. Then bring the rest of your men here with you."
    - id: ch05
      title: A year and another journey
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: "I agreed and went back to the sea. The men beside the ship were weeping and wailing pitifully. When they saw me, those foolish, tearful fellows leaped round me. They were like calves breaking loose when their mothers return to be milked after a whole day at pasture. The calves run and leap round the cows, and their lowing fills the farm. That was how my men welcomed me. They seemed as happy as if they had reached rugged Ithaca itself, the home where they had been born and raised. With all that affection, they spoke to me."
        - id: ch05-b02
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: "Sir, seeing you back makes us as glad as if we had come safely home to Ithaca. But what about our companions? Tell us everything that happened to them."
        - id: ch05-b03
          speaker: odysseus
          text: "I spoke to comfort them. First we must pull the ship ashore, I said, and hide her equipment and all our belongings in a cave. Then come with me, every one of you, as quickly as you can, to Circe's house. You will find your friends there, eating and drinking with more than enough of everything. They were ready to follow me at once. But Eurylochus tried to stop them."
        - id: ch05-b04
          speaker: eurylochus
          text: "Oh, what is to become of us, miserable men that we are? Don't rush to your deaths in Circe's house. She will make us all into pigs, or wolves or lions, and put us on guard outside her doors. Remember the Cyclops. Our friends went into his cave, and Ulysses went with them. You know what happened. Those men died because of his sheer stupidity."
        - id: ch05-b05
          speaker: odysseus
          text: "I heard that and nearly drew the sharp sword hanging at my strong thigh. I thought of cutting off his head, even though he was a close relation of mine. But the men pleaded for him."
        - id: ch05-b06
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: "Sir, if you will allow it, leave him here to watch the ship. Take the rest of us with you to Circe's house."
        - id: ch05-b07
          speaker: odysseus
          text: |
            So we set out together. Eurylochus did not stay behind after all. My stern rebuke had frightened him, and he came too.

            While I was away, Circe had made sure our companions were washed and rubbed with olive oil. She had given them woolen cloaks and shirts. When we arrived, we found them sitting comfortably at dinner in her house. As soon as the two parties saw one another and recognized their friends, they cried out and wept with joy. The sound rang through the whole palace. Then Circe came up to me.
        - id: ch05-b08
          speaker: circe
          text: "Noble son of Laertes, tell your men to stop crying. I know what you have all suffered on the sea, and how cruelly the savages on the mainland treated you. Those troubles are past now. Stay here, eat and drink, until you have the health and strength you had when you left Ithaca. You are worn down in body and mind. You keep thinking about everything you endured on your travels, and there is no gladness left in you."
        - id: ch05-b09
          speaker: odysseus
          text: "We agreed to stay. A whole twelve months passed while we feasted in Circe's house, with more meat and wine than I could tell you. The moons came and waned, the year went round, and the long days returned. Then my companions called me aside."
        - id: ch05-b10
          speakers: [crew_1, crew_2, crew_3]
          ensemble: chorus
          text: "Sir, you ought to begin thinking about home. If you are ever to live to see your own house and country again, it is time."
        - id: ch05-b11
          speaker: odysseus
          text: |
            I agreed with them. That day we still sat eating meat and drinking wine until we were satisfied, right up to sunset. When it grew dark, the men lay down to sleep in the covered walks. I went to bed with Circe. Then I clasped her knees and begged her, and she listened to me.

            Circe, I said, please keep your promise to help me on my journey home. I long to go back, and so do my men. The moment your back is turned, they press me with complaints and will not leave me alone.
        - id: ch05-b12
          speaker: circe
          text: "Ulysses, noble son of Laertes, none of you need stay here if you wish to go. But before you sail for home, you must make another journey. You have to visit the house of Hades and dreadful Proserpine. There you must question the ghost of Teiresias, the blind prophet from Thebes. His mind is still sound. Proserpine has allowed him alone to keep his understanding after death. The other spirits can only drift about without purpose."
        - id: ch05-b13
          speaker: odysseus
          text: "I was overwhelmed when I heard that. I sat up in bed and wept. I no longer wanted to live and see the sunlight. At last I had worn myself out with weeping and tossing about, and I asked her, Who will guide me on that voyage? No ship can reach a harbor in the house of Hades."
        - id: ch05-b14
          speaker: circe
          text: |
            You will not need a guide. Raise your mast and spread the white sails. Then sit still. The North Wind will carry you there by itself. Once your ship has crossed the waters of Oceanus, you will reach the rich shore of Proserpine's country. There are groves of tall poplars, and willows that lose their fruit before its time. Pull your ship onto the shore of Oceanus and walk straight to the dark dwelling of Hades. It stands near the place where Pyriphlegethon and Cocytus flow into Acheron. Cocytus is a branch of the Styx. Close by, you will see a rock where the two roaring rivers meet.

            When you get there, do exactly as I tell you. Dig a trench about a cubit long, a cubit wide and a cubit deep. Pour offerings into it for all the dead. First pour honey mixed with milk, then wine, and after that water. Sprinkle white barley meal over everything. Pray again and again to those poor, weak spirits. Promise that when you return to Ithaca you will sacrifice the best barren heifer you own, and heap good things on the fire for them. Make a special promise for Teiresias. He must have a black sheep all to himself, the finest of your entire flock.

            After you have prayed to the ghosts, sacrifice a ram and a black ewe. Turn their heads towards Erebus, while you yourself face away from them, towards the river. The ghosts of many dead people will come to you. Tell your men to skin the two sheep you have killed and burn them as an offering, praying to Hades and Proserpine. Then draw your sword and sit there. Do not let any other poor spirit near the blood until Teiresias has answered your questions. The prophet will soon come. He will explain your voyage, the stages along the way, and how to cross the sea so that you can reach your home.
        - id: ch05-b15
          speaker: odysseus
          text: |
            By the time she finished, dawn had come. She dressed me in my shirt and cloak. For herself, she put a lovely, light, delicate cloth over her shoulders, tied it at the waist with a golden belt, and covered her head with a mantle. I went through the house to find the men, speaking kindly to every one of them. You cannot stay asleep here any longer, I told them. We must set out. Circe has explained everything to me. They did as I asked.

            Even then, I could not bring everyone away without disaster. A young man called Elpenor was with us. He was not especially brave or wise. He had got drunk and gone up onto the roof, away from the rest, to sleep off the wine in the cool air. When he heard the men moving about, he jumped up suddenly. He forgot the main stairs that he should have used to get down. He fell straight off the roof and broke his neck. His soul went down to the house of Hades.

            I gathered the men and told them, You think we are setting out for home. But Circe has explained that we must first go to the house of Hades and Proserpine. We must speak to the ghost of Teiresias, the prophet of Thebes.

            It broke their hearts. They threw themselves down, groaning and tearing their hair. But their tears could not change it. We reached the shore weeping and lamenting what lay before us. Circe brought the ram and ewe, and we tied them close beside the ship. She had passed right through our company without anyone noticing. For who can see a god coming or going, if the god does not wish to be seen?
