premise: "A day of washing brings Nausicaa to the exhausted stranger asleep near the river. Odysseus must ask without frightening her; she chooses to help while finding a way for him to enter her father's house without making her the subject of gossip."
characters:
  - {id: odysseus, description: "The shipwrecked man who has lost everything except his judgment and ability to ask."}
  - {id: nausicaa, description: "Alcinous's daughter, who stays when the other women flee and chooses how to help the stranger."}
  - {id: athena, description: "The goddess who prompts the washing trip in a friend's dream appearance and strengthens both travelers."}
  - {id: alcinous, description: "The Phaeacian king who provides his daughter's cart and whose house may offer passage home."}
  - {id: arete, description: "The queen whom Nausicaa tells the stranger to approach first."}
  - {id: nausithous, description: "The former king who led the Phaeacians away from the Cyclopes to Scheria."}
