notes:
  - "Chinese rework after f60bc6c: both the entire Chinese article and its separate spoken adaptation were rewritten in native Chinese. English files and en-US metadata, public attribution, titles, classic/14+ and media remain unchanged. Homer / 荷马 is still author and homer is writer. Existing compression boundaries and task exception stand; current Chinese data are in audit.md's final section."
  - "The washing/play sequence, initial distant appeal, nakedness/privacy, marriage wish, Nausicaa's own prejudice, queen-first knee supplication and unseen Athena are retained. No reassuring exchange or modern moral is invented. A spoken claim about shipbuilding was removed because the finalized Chinese speaks of ships and voyaging; Athena has a new individual cast entry for direct dream speech. 百径灯 is an internal language-editing reference only."
  - "Exact local source: git show 1208d108:works/series/the-odyssey/the-odyssey-06/locales/en-US/article.md, read in full."
  - "Task-specific user exception: newly phrased and compressed HaiLibrary reading prose preserves classic and Homer / 荷马; both locale Writers remain homer. It does not claim an unabridged import, Butler's English wording or a literal Chinese translation. No front matter or numbered footnotes appear, and no locale import source_url/translator field makes a false provenance claim."
  - "Retained: Cyclops raids and Nausithous's migration; Athena appearing as a friend in the marriage/laundry dream; father's understanding of the unspoken wedding motive; mother's provisions; washing, drying, bathing, meal and play in order; missed ball and awakened Odysseus; covered nakedness, maids fleeing, divine courage for Nausicaa; his choice of distant words rather than clasping her knees, Artemis praise, Delos palm memory and marriage blessing; twenty-day ordeal, first local encounter, clothes and route request; Nausicaa's identity, Zeus's protection of strangers, private washing, changed divine appearance and her wish to marry such a man; food; fear of gossip and her own disapproval of unmarried girls associating with men against parents; wait in grove; maritime city; explicit instruction to pass the father and clasp the mother's knees; slow cart, final prayer and Athena's fear of Poseidon."
  - "Compressed: household and maid genealogies, five brothers' marital breakdown, laundry and oil-vessel inventories, Olympus landscape, long Artemis comparison, full hypothetical gossip speech, detailed harbor layout and palace room description. The Delos memory remains, not listed as discarded praise."
  - "Claim inventory: divine dream, supernatural appearance and intervention are declared myth. Marriage expectations and prejudice are attributed to Nausicaa, not approved universal customs. The migration is epic narrative rather than verified history. Ordinary washing/drying/packing, clothing and cart-versus-foot travel are coherent. Odysseus's name is not disclosed, and no voyage is yet granted."
  - "Removed invented thanks, stinging hands during bathing, repeated internal rehearsal, refusal to pressure the princess and unsupported explanations about what her parents would hear. Audio uses only its own final locale article. No media changes."
