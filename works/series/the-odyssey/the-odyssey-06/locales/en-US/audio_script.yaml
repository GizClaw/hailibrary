  chapters:
    - id: ch01
      title: A cart for the washing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Odysseus was asleep under the leaves. Meanwhile, Athena entered the bedroom of Alcinous's daughter. Nausicaa dreamed that one of her friends was beside the bed.
        - id: ch01-b02
          speaker: athena
          text: |
            You should get those clothes washed. What if your wedding guests arrive and nothing's ready? Borrow the cart tomorrow, and we'll go to the river.
        - id: ch01-b03
          speaker: narrator
          text: |
            Nausicaa recognized the face, but the visitor was really Athena. These were the lands of the Phaeacians. Long ago, the Cyclopes had raided them, so King Nausithous moved his people to Scheria and founded a city. Alcinous ruled it now. There were ships in its harbors, just what the sleeping stranger needed.
            In the morning, Nausicaa remembered the dream. Her mother was spinning at the hearth. Her father was about to leave for the council, and she stopped him.
        - id: ch01-b04
          speaker: nausicaa
          text: |
            Could I use the large cart? I'd like to wash your clothes today. And my brothers always want clean things when there's a dance.
        - id: ch01-b05
          speaker: narrator
          text: |
            She didn't mention her own marriage. Her father understood. He agreed to the cart and mules. Her mother packed food, wine and oil. Nausicaa loaded the clothes, took the reins, and left with her maids.
            At the river, they let the mules graze. They trod the clothes in the pools, competing to get them clean, then spread them on stones by the sea. They washed themselves, ate, and waited for the sun to dry the cloth.
            Then they played ball, with Nausicaa singing. When it was almost time to go, they began folding the clothes. Athena arranged one last throw. The ball flew past a maid and landed in deep water. The women shouted, and Odysseus woke.
    - id: ch02
      title: Keeping his distance
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            He sat up and listened. Women were calling. Would they help him, or was he in danger again? He broke a leafy branch, held it over his naked body and left the bushes.
            The maids saw him, dirty with salt, and ran away. Nausicaa alone stayed where she was. Athena had given her courage. She stood watching him come towards her.
            He thought of clasping her knees to beg for help. But coming so close might offend her. He stayed farther away and spoke.
        - id: ch02-b02
          speaker: odysseus
          text: |
            Lady, I beg you to help me. Are you a goddess, or a woman?
        - id: ch02-b03
          speaker: narrator
          text: |
            He praised her beauty. She was like Artemis. If she was mortal, her family must be proud, and her future husband happiest of all. She reminded him of a young palm beside Apollo's altar at Delos. He'd admired that just as he admired her now. He wished her a husband and a peaceful home together. Then he asked for what he needed.
        - id: ch02-b04
          speaker: odysseus
          text: |
            I was at sea for twenty days, and only landed yesterday. I haven't met anyone here before you. Can you tell me how to find the town? And could you give me cloth to cover myself? Even a wrapper for your washing would do.
        - id: ch02-b05
          speaker: narrator
          text: |
            Nausicaa could hear how carefully he spoke, despite all his misery.
        - id: ch02-b06
          speaker: nausicaa
          text: |
            We'll find you proper clothes and give you help. I'll show you the way into town. You're among the Phaeacians. Alcinous, the king, is my father.
        - id: ch02-b07
          speaker: narrator
          text: |
            She called the others back. They couldn't leave a shipwrecked man without help. Zeus watched over people in such distress. She sent them for food, water, oil and clothes, and told them to find him somewhere out of the wind by the stream.
            The women returned with clothes and oil. He asked them to let him wash alone. He was ashamed to stand naked before young women. They withdrew.
            He washed the salt from his hair and shoulders, rubbed himself with oil, and dressed. Athena made him taller and stronger, with thick curls. He sat on the beach a little apart. Nausicaa admired him. She said he looked like a god now, and the gods must have sent him.
        - id: ch02-b08
          speaker: nausicaa
          text: |
            A man like him is someone I'd want to marry. I wish he meant to stay. Now, please take him his food.
        - id: ch02-b09
          speaker: narrator
          text: |
            Odysseus was too hungry to hide his eagerness. He hadn't eaten for so long. While he ate, the women packed the rest of the linen, and Nausicaa had the mules harnessed again.
    - id: ch03
      title: Directions to the queen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            He'd asked for the town. Nausicaa had to think about how to bring him there.
        - id: ch03-b02
          speaker: nausicaa
          text: |
            Walk behind us through the fields. But stop before we enter the city.
        - id: ch03-b03
          speaker: narrator
          text: |
            People would say she'd refused the local suitors and chosen a foreign husband. She admitted she'd disapprove herself if an unmarried girl went about with men against the wishes of her living parents.
        - id: ch03-b04
          speaker: nausicaa
          text: |
            I want to help you reach my family. I just can't have you coming into town at my side.
        - id: ch03-b05
          speaker: narrator
          text: |
            She told him about a poplar grove beside the road, dedicated to Athena. There was a spring, and her father had land nearby. He should rest there until they got home. Then he could enter the city and ask anyone for the palace.
            She described the harbors and the market, where men made ropes and oars. Her people were proud of their ships and sailing. They weren't skilled archers.
        - id: ch03-b06
          speaker: nausicaa
          text: |
            Inside, find my mother by the fire. She'll be spinning, with her women behind her. Father sits nearby, but pass him. Go and clasp Mother's knees. Win her help, and you may get home, however far away it is.
        - id: ch03-b07
          speaker: narrator
          text: |
            She drove slowly enough for Odysseus and the women to follow on foot.
            Towards sunset they came to the grove. He stayed among the trees while the cart went on. He prayed to Athena. He hadn't seen her help during the storm. Now he asked her to make the townspeople welcome him.

            Athena heard him, but wouldn't appear openly. She feared her uncle Poseidon, who still meant to stop him getting home.
