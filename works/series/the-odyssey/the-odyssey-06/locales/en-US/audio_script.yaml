  chapters:
    - id: ch01
      title: A dream and a washing day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Ulysses lay asleep where we left him, completely overcome by weariness and the need for rest. Minerva meanwhile made her way to the country of the Phaeacians and their city. Once these people had lived in the lovely town of Hypereia. Their neighbors there were the Cyclopes, who respected no law. The Cyclopes had the greater strength, and used it to rob the Phaeacians. So their king, Nausithous, brought his people away from that place and settled them in Scheria, a long way from everyone else. He enclosed the new city in a wall, built homes and temples, and shared out the land among his subjects. Nausithous had since died and gone to the house of Hades. Alcinous was king now, and heaven inspired the advice and decisions he gave. It was to this king's home that Minerva went, hoping to move Ulysses closer to his return.

            She entered a beautifully furnished bedroom. Nausicaa, the king's daughter, lay asleep there, as lovely as a goddess. Two pretty maids slept nearby, one on each side of the closed double doors. Minerva took the shape of the daughter of Dymas, the famous sea captain. This girl was Nausicaa's closest friend and the same age as she was. Like a breath of wind, the goddess came to the bedside, hovered above the sleeper and spoke.
        - id: ch01-b02
          speaker: athena
          text: |-
            Nausicaa, how has your mother let you grow so careless? All your clothes are lying in a muddle, and you will be getting married very soon. You need fine clothes for yourself and for everyone who attends you. That is how you win a good name and give your parents something to be proud of. Let us make tomorrow a washing day. We can set out as soon as it is light. I will help you, so we finish everything as quickly as possible. All the finest young men among our people are already courting you. You won't remain an unmarried girl much longer.

            Ask your father to have a wagon and mules ready at dawn. We can carry the rugs, robes and belts on it, and you can ride too. That will be pleasanter than walking. The washing pools are quite a way from the town.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Having given her instructions, Minerva returned to Olympus. People say it is the everlasting home of the gods. No harsh wind beats against it. Neither rain nor snow falls there. It remains in eternal sunshine, in a great stillness of light that shines upon the blessed gods forever.

            Morning came and woke Nausicaa. She wondered at the dream and went to the other end of the house to tell her parents about it. She found them in their room. Her mother sat at the fire, spinning purple yarn with her maids around her. Her father was just leaving for a meeting called by the Phaeacian elders. Nausicaa caught him before he went and made her request.
        - id: ch01-b04
          speaker: nausicaa
          text: |-
            Dear Papa, could you let me use a good big wagon? I want to take our dirty clothes to the river and wash them. You lead our people, so you ought to wear a clean shirt to the council. And you have five sons at home. Two are married, and three are handsome young men who have not married yet. You know how they like fresh linen for a dance. I've been thinking about all these things.
        - id: ch01-b05
          speaker: narrator
          text: |-
            She did not mention her own marriage. She felt too shy to speak of it. Her father understood all the same.
        - id: ch01-b06
          speaker: alcinous
          text: |-
            My dear girl, you may have the mules and anything else you want. Off you go. The men will bring you a strong, well-made wagon, with a body large enough for all those clothes.
        - id: ch01-b07
          speaker: narrator
          text: |-
            He gave the servants their orders. They brought out the wagon and harnessed the mules, while Nausicaa carried clothing from the linen room and loaded it. Her mother packed a basket full of good food and a goatskin of wine. As the girl climbed into the wagon, her mother added a golden flask of oil for her and her women to rub on their skin. Nausicaa took the whip and reins and lashed the mules. They set off with their hoofs clattering on the road. They pulled without tiring, carrying the girl, all the clothes, and the maids traveling with her.

            They reached the waterside and made their way to the pools used for washing. Pure water flowed through these pools all the time. There was enough to wash any quantity of linen, no matter how much dirt it carried. The women took the harness off the mules and let them feed on the sweet, juicy plants growing beside the water. They lifted the clothes out of the wagon and put them into the washing pools. Each woman tried to outdo the others as they trod on the cloth to force out the dirt. When the washing was finished and every piece was quite clean, they laid it all along the sea's edge. The waves had heaped up a high bank of pebbles there. Next the women washed their own bodies and spread olive oil on their skin. They settled beside the stream to eat, leaving the sun to finish drying the clothes. After the meal they took off the veils that covered their heads and began their game of ball, with Nausicaa singing for them.

            She outshone her maids as Diana shines among the woodland nymphs. The huntress goes over Taygetus or Erymanthus in search of boar and deer, with those daughters of Jove, the god who bears the aegis, playing beside her. Leto is proud to see her own daughter a whole head taller than the rest. Even the loveliest of that company of beauties cannot match her. Nausicaa stood out among her women in just that way.
    - id: ch02
      title: The stranger behind the leaves
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            It was time to go home. The women were folding the clothes and loading the wagon when Minerva considered how to wake Ulysses. He must see the beautiful girl who would guide him to the Phaeacian city. So Nausicaa threw the ball toward a maid. It missed and fell into deep water. All the girls cried out. Their shouting woke Ulysses. He sat up in his bed of leaves, trying to understand what he had heard.
        - id: ch02-b02
          speaker: odysseus
          text: |-
            What sort of people have I landed among? Are they cruel and wild, with no respect for others? Or will they welcome a stranger and treat him kindly? Those sound like young women's voices. They might be nymphs living on mountaintops, at river springs or in green meadows. Whatever they are, I have come to a place where men and women live. I must try to see them for myself.
        - id: ch02-b03
          speaker: narrator
          text: |-
            With that, he crept out of his hiding place beneath the bush. He broke off a branch with thick leaves still on it and held it to hide his nakedness. Picture a lion out in the wild country, roaming in the confidence of its own strength. Wind and rain do not frighten it. Its eyes shine fiercely as it searches for cattle or sheep or a deer. When hunger drives it, even a farm enclosed by a strong fence will not keep it from trying to reach the sheep. That was how Ulysses looked to the young women. His need was great, and he came toward them with no clothing on his body.

            The other women saw his uncombed hair and his body caked with sea salt, and ran along the tongues of sand stretching into the water. Only Alcinous's daughter stayed where she was. Minerva had filled her heart with courage and taken away her fear. Nausicaa stood directly before him. Ulysses considered whether to approach, fall at her feet and clasp her knees as a beggar for help. Or should he keep his distance and ask for clothing and the way to town? He chose to speak from where he stood. Coming close enough to touch her knees might offend the girl. So he chose gentle words meant to persuade her.
        - id: ch02-b04
          speaker: odysseus
          text: |-
            Queen, I beg for your help. But first, are you a goddess or a mortal woman? If you belong to heaven, I would take you for Diana, Jove's daughter. Your face and figure could belong to no other. If you live on earth as a mortal, then your parents are three times fortunate. Your brothers and sisters are three times fortunate too. They must feel such pride and joy when they see a daughter of their house so beautiful, setting out to dance. Happiest of all will be the man whose wedding gifts are richest and who brings you to his home.

            I have never seen anyone like you, woman or man. I can only stand and marvel. Once, in Delos, I saw a young palm beside Apollo's altar. That is the only thing I can compare you with. I went there with many followers on the journey that brought me all my suffering. Never had such a young tree grown out of the earth. I stood admiring it, astonished, just as I admire you now. I dare not clasp your knees, though my trouble is great. Yesterday was my twentieth day tossed about at sea. Wind and water brought me all the way from Ogygia. Now fate has thrown me on this coast to suffer still more. I do not think my hardships are finished. Heaven must have other evils waiting for me.

            Please take pity on me, queen. You are the first person I have met here. There is nobody else in this country whom I know. Show me which way to go to the town. Give me anything you may have brought along to wrap these clothes in. May the gods grant whatever your heart wishes for, a husband and a house, with happiness and peace at home. There is no better life than a husband and wife sharing one home with their hearts in agreement. People who hate them are dismayed to see it. Their friends are happy for them. And the husband and wife themselves know better than anyone else how good that life can be.
        - id: ch02-b05
          speaker: nausicaa
          text: |-
            Stranger, you seem thoughtful and kind. Nobody can account for fortune. Jove gives happiness to rich and poor however he chooses. We must accept what he sends and bear it as best we can. But now that you are here, you will have clothes and everything else a traveler in trouble can reasonably ask for. I will show you the town and tell you who we are. Our people are the Phaeacians. My father is Alcinous, and all the power of the country is in his hands.
        - id: ch02-b06
          speaker: narrator
          text: |-
            Then she called her maids back.
        - id: ch02-b07
          speaker: nausicaa
          text: |-
            Stay here, girls. Must you run away whenever you see a man? Do you think he is a thief or a murderer? He cannot harm us, and neither can anyone else who comes to our country. The gods love the Phaeacians. We live apart, at the edge of the land that runs into the roaring sea, and have nothing to do with other peoples. This is simply a poor man who has lost his way. We must treat him kindly. Jove protects strangers and travelers in distress. They accept whatever they are given and feel grateful. Bring him food and drink. Take him to wash in the stream, somewhere out of the wind.
    - id: ch03
      title: After the washing
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            The maids stopped running and called one another back. As Nausicaa had directed, they seated Ulysses in a sheltered place. They brought him a shirt and cloak, and the little golden flask of oil. Then they told him to wash in the stream. He answered them.
        - id: ch03-b02
          speaker: odysseus
          text: |-
            Young women, please stand aside for a little while. Let me wash the salt from my shoulders and rub oil onto my skin. It has been a long time since any oil touched it. I cannot bathe with all of you standing there. I am ashamed to undress before so many lovely young women.
        - id: ch03-b03
          speaker: narrator
          text: |-
            They moved away and went to tell their mistress. Ulysses washed in the stream, scrubbing the salt from his back and broad shoulders. He cleaned his whole body and washed the brine from his hair, then rubbed on the oil and put on the shirt and cloak she had supplied. Minerva made him seem taller and stronger. His hair grew thick over his head and fell in curls like hyacinth flowers. She made his head and shoulders shine with beauty, just as a craftsman skilled in all the arts of Vulcan and Minerva gilds silver to make a beautiful work. He went a short distance along the beach and sat down, looking young and handsome. Nausicaa watched him with admiration, then spoke to her maids.
        - id: ch03-b04
          speaker: nausicaa
          text: |-
            Quiet, my dears. I want to tell you something. I believe the heavenly gods sent this man to us. At first I thought him plain. Now he looks like one of the gods themselves. I would like a husband just like him, if he would stay here instead of going away. But first, give him food and something to drink.
        - id: ch03-b05
          speaker: narrator
          text: |-
            They put the food before him as she ordered. Ulysses ate and drank ravenously. It had been a long time since he had eaten anything at all. Nausicaa turned to another task. She had the linen folded and loaded, then harnessed the mules. As she climbed into the wagon, she called Ulysses.
    - id: ch04
      title: The way to the palace
      blocks:
        - id: ch04-b01
          speaker: nausicaa
          text: |-
            Stranger, get up. We should start back to town. I will bring you to my good father's house, where you will meet the finest people among the Phaeacians. You seem sensible, so be sure to follow my advice. While we pass through the fields and farms, walk briskly behind the wagon with the maids. I will lead you.

            Before long, we will reach the town itself. A high wall runs all the way around it. There is a good harbor on each side, and the entrance into the city is narrow. You will see ships drawn up along the edge of the road, because every owner has his own place to keep a vessel. In the market stands a temple to Neptune, right in the middle. The ground is paved with great stones sunk into the earth. There people buy and sell every kind of equipment a ship needs, such as cables and sails. There are workshops for making oars as well. The Phaeacians do not make their name as archers. We know nothing of using bows and arrows. Our lives are spent at sea. We are proud of our ships, their masts and their oars, which carry us on long journeys over the water.

            I worry about the gossip that could follow me. People here are unkind. Some rude fellow might see us together and start talking like this.
        - id: ch04-b02
          speaker: imagined_townsman
          text: |-
            Who is that handsome stranger walking with Nausicaa? Where did she find him? She must mean to marry him. Perhaps she picked up a wandering sailor from a foreign ship. We have no neighbors here, after all. Or perhaps a god finally answered her prayers and came down from heaven, and she plans to live with him for the rest of her life. Good. Let her go and find a husband somewhere else. There are plenty of fine young Phaeacians who love her, but she won't consider any of them.
        - id: ch04-b03
          speaker: nausicaa
          text: |-
            That is the sort of cruel remark they could make, and I could hardly complain. I would disapprove myself if another girl behaved that way. Her parents still alive, no marriage before everyone, yet she goes about with men in spite of what anyone thinks.

            So if you want my father to give you an escort and send you home, do this. Beside the road you will see a beautiful grove of poplars belonging to Minerva. There is a well inside it and meadow around it. My father has a rich garden field there. It lies only as far from the town as a man's shout can carry. Sit down in that place and wait until the rest of us have entered the city and reached my father's house. When you think enough time has passed, follow us into town and ask for Alcinous's home. Any child can show you. Nobody else has a house so fine.

            Once you have passed the gates, go through the outer courtyard. Keep going straight across the inner court until you reach my mother. She will be seated beside the fire, spinning her purple wool by its light. Her back rests against one of the great posts that bear the roof, and all her maids are lined up behind her. She makes a fine sight there. My father's seat stands close to hers. He sits upon it and drinks deeply, like one of the immortal gods. Pay no attention to him. Go to my mother and put your hands on her knees, if you wish to get home without delay. If you can persuade her to help, there is hope that you will see your own country again, however far from here it may be.
        - id: ch04-b04
          speaker: narrator
          text: |-
            She lashed the mules with her whip, and they left the river. They pulled strongly, their hoofs rising and falling on the road. Nausicaa was careful not to drive too fast. Ulysses and the maids had to follow on foot, so she used the whip with judgment. The sun was sinking when they reached Minerva's sacred grove. Ulysses sat down there and prayed to Jove's mighty daughter.
        - id: ch04-b05
          speaker: odysseus
          text: |-
            Hear me, tireless daughter of Jove who bears the aegis. Listen to me now. When Neptune wrecked me, you did not answer my prayers. Take pity on me this time. Let me find friends among the Phaeacians and a kindly welcome in their land.
        - id: ch04-b06
          speaker: narrator
          text: |-
            Minerva heard his prayer, but she would not appear before him openly. She feared her uncle Neptune. He was still furious, still doing all he could to keep Ulysses from returning home.
