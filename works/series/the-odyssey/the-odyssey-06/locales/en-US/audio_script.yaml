    athena:
      display_name: Athena
      tts: {delivery: assured and perceptive, timbre: clear and firm, pace: measured, pitch: medium}
    nausicaa:
      display_name: Nausicaa
      tts: {delivery: open and considerate, timbre: youthful and clear, pace: natural and lively, pitch: medium high}
    odysseus:
