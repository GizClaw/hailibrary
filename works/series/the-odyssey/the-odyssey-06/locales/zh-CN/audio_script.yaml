audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: 坦然体贴, timbre: 年轻清亮, pace: 自然活泼, pitch: 中高音}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: 笃定而慈爱, timbre: 成熟厚实, pace: 从容, pitch: 中低音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
  chapters:
    - id: ch01
      title: 把衣服拉到河边
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯还睡在叶子底下，雅典娜已经去找瑙西卡，变成好友的样子进入她梦里。她说，婚事快到了，该备好衣服，明天就借车去河边洗。
            这里是费埃克斯人的国土。他们以前受独眼巨人劫掠，瑙西托奥斯才带大家迁来斯刻里亚，筑城，建屋，修神庙。现在，国王是阿尔基诺奥斯。
            女儿瑙西卡醒来就去借车，却没提自己的婚事，只谈家人的衣服。
        - id: ch01-b02
          speaker: nausicaa
          text: |
            您开会得穿整洁的衣服，哥哥们跳舞也总要换干净的。我今天带到河边洗干净，好不好？
        - id: ch01-b03
          speaker: narrator
          text: |
            阿尔基诺奥斯停住出门的脚步。他明白女儿还有话没说，但没有追问。
        - id: ch01-b04
          speaker: alcinous
          text: |
            可以。那辆大车很牢靠，你把东西都装上。我让人把骡子备好。
        - id: ch01-b05
          speaker: narrator
          text: |
            她去装好衣物。母亲原在火边纺线，这时替她备好食物、酒和油。她带着女仆驾车出发。
            到了水边，她们卸下衣服，让骡子吃草，把布放进清水池里踩洗，争着洗净。衣服摊到石子上晒，她们也洗浴、抹油，坐下来吃饭。等着晒干时，女人们开始玩球，瑙西卡一边唱歌。
            后来开始叠衣服，准备回去。雅典娜让瑙西卡把一球抛偏了，球落进深水，众人都喊起来。

            橄榄丛下，奥德修斯醒了。
    - id: ch02
      title: 隔着空地开口
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            他听到女人的声音，猜不出这里的人会不会帮他。但一直躲着也不行。他折下带叶的枝条挡住身体，走了出来。满身盐渍、乱发的陌生人一出现，女仆全跑开了。只有瑙西卡还在。雅典娜让她定下心，留下来看他有什么举动。
            奥德修斯想了想，是上前抱住她的膝盖求助，还是隔远一点说话？走得太近可能冒犯她，他就留在原处。
        - id: ch02-b02
          speaker: odysseus
          text: |
            请您救助我。您是女神，还是凡间女子？
        - id: ch02-b03
          speaker: narrator
          text: |
            他称赞她像阿耳忒弥斯。若是凡人，父母兄弟该多骄傲，将来丈夫更有福。他记得在得洛斯见过一株小棕榈，就在阿波罗的祭坛旁。姑娘也使他那么惊叹。他祝她婚姻和睦，才说起自己。出海二十天，昨天才到岸，没衣服，谁也不认识。
        - id: ch02-b04
          speaker: odysseus
          text: |
            能不能指一指，城在什么地方？我还想求你分一点布给我。哪怕只是拿来包衣服的，也能让我遮住身体。
        - id: ch02-b05
          speaker: narrator
          text: |
            瑙西卡听他开口，就知道这人虽然困苦，并不粗鲁。
        - id: ch02-b06
          speaker: nausicaa
          text: |
            别担心衣服。这里是费埃克斯人的地方，阿尔基诺奥斯是我父亲。我也会给你指路。
        - id: ch02-b07
          speaker: narrator
          text: |
            她叫回女仆，说这人不是强盗，只是流落异乡。宙斯照看受难的外乡人，她们也该帮忙。她叫人找个避风处，送来食物、饮水、油和衣服。
            女仆互相招呼着回来，把长衣和斗篷留下。他还拿着树枝遮身，开口请她们退开。
        - id: ch02-b08
          speaker: odysseus
          text: |
            我想自己洗，能不能请你们先往旁边走走？你们不在这里，我才好把身上的盐洗干净。
        - id: ch02-b09
          speaker: narrator
          text: |
            他羞于当着年轻姑娘露出身体。女人们退开，回去告诉瑙西卡。他洗掉肩背和头发里的盐，抹油，穿好衣服。雅典娜让他肩背高大，头发浓密卷曲。
            他在远一点的沙地坐下。瑙西卡看了又看。这人刚才那么狼狈，现在竟有些像神。她小声猜，也许他就是诸神送来的。
        - id: ch02-b10
          speaker: nausicaa
          text: |
            这样的人要肯住下来，我真愿意嫁给他。快把饭送过去吧。
        - id: ch02-b11
          speaker: narrator
          text: |
            奥德修斯饿了太久，吃得很急。女人们就在这时候把衣服折好，装回车里，再给骡子套上车。
    - id: ch03
      title: 先向母亲求助
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            瑙西卡要他先跟车走，到城边再停下。她怕人看见，议论她不选本地求婚人，却选了外乡丈夫。她也承认，姑娘若没结婚、父母尚在，就不听家人，与男人来往，她也会觉得不体面。
        - id: ch03-b02
          speaker: nausicaa
          text: |
            我会帮忙，可咱们不能一起进城。
        - id: ch03-b03
          speaker: narrator
          text: |
            城外有雅典娜的白杨林，附近有泉和王家的田。他可以等在那里，让她们先回家，再进城问路，人人都知道国王的住处。
            她说，城有墙，两边是港口，海神庙旁有人做船具。本国人擅长航海，重视桅杆、船桨，不擅长弓箭。最后，她叮嘱他进门该怎么办。
        - id: ch03-b04
          speaker: nausicaa
          text: |
            进门之后，先到母亲那里。她坐在火边纺线，女仆就在身后。父亲的座位离得很近，可你先别找他。抱住母亲的膝盖，请她相助。她肯帮忙，哪怕你的家乡很远，也有希望回去。
        - id: ch03-b05
          speaker: narrator
          text: |
            她上车，没有催骡子快跑，好让奥德修斯和女仆们跟得上。
            快到傍晚时，他们进了白杨林。瑙西卡驾车继续走，他留在林子里求雅典娜。他在海难中没有见到她，如今便请她让这里的人愿意接待自己。

            雅典娜听见了，却不敢公开现身。她怕叔父波塞冬，他仍在愤怒地阻挡奥德修斯回家。
