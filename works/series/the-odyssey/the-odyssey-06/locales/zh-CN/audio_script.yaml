audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: 坦然体贴, timbre: 年轻清亮, pace: 自然活泼, pitch: 中高音}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: 笃定而慈爱, timbre: 成熟厚实, pace: 从容, pitch: 中低音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    imagined_townsman:
      display_name: 瑙西卡设想的粗鄙城民
      tts: {delivery: 随口讥讽, timbre: 粗哑略带鼻音, pace: 流畅, pitch: 中音}
  chapters:
    - id: ch01
      title: 梦里的洗衣约定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            奥德修斯累极了，仍在叶子下熟睡。雅典娜却去了费埃克斯人的国度。那里的人从前住在漂亮的希佩瑞亚，邻居是无法无天的独眼巨人。巨人力大，经常劫掠他们。国王瑙西托奥斯便领着百姓迁走，到了远离其他民族的斯刻里亚。他筑城墙，盖房、造庙，把土地分给人们。如今他已经死去，住进哈得斯的宫殿。现任国王阿尔基诺奥斯的决策，受上天启发。女神为了帮奥德修斯回家，就去了他那里。

            她进入布置精美的卧室，国王的女儿瑙西卡睡在里头，像女神一样美。两个漂亮女仆分睡在门口两侧，精致的双扇门紧闭着。雅典娜变成了著名船长狄马斯的女儿。那是瑙西卡同岁的密友。她像一缕风接近床边，停在女孩头顶，对她说话。
        - id: ch01-b02
          speaker: athena
          text: |-
            瑙西卡，你母亲怎么让女儿这么懒呀？衣服堆得乱，你很快就要嫁人了，不光自己得穿得好，跟着你的人也得有好衣裳。这样才有名声，父母才觉得光荣。咱们明天洗衣去吧，天刚亮就动身。我帮你，快点把东西都备好。族里最好的年轻人个个来求婚，你当姑娘的日子没多少了。

            去请爸爸准备骡子和大车，黎明时就要。毯子、袍子、腰带都能装上，你也坐车，比走着舒服。洗衣池离城毕竟远呢。
        - id: ch01-b03
          speaker: narrator
          text: |-
            吩咐完少女，女神回了奥林波斯。传说诸神永远住在那里。没有猛烈的风，也没有雨，没有雪，只有长在的阳光，一大片宁静明亮。有福的神，一直沐浴在这样的光里。

            不久，早晨把瑙西卡唤醒。她对梦感到奇怪，走去房子另一头，要找父母说说。他们在自己的房间里，母亲靠着炉火，纺紫色的线，女仆在周围。父亲正准备去参加城邦长老召集的会议。她趁他没走，上前叫住。
        - id: ch01-b04
          speaker: nausicaa
          text: |-
            亲爱的爸爸，给我弄辆好用的大车，行吗？我想把脏衣服统统拉去河边洗。您是首领，议事时总得穿干净衬衣呀。家里还有五个儿子，两个已经结婚，三个俊俏的还没娶妻。您知道，他们跳舞都喜欢穿洁净的亚麻衣。这些事我一直记在心里呢。
        - id: ch01-b05
          speaker: narrator
          text: |-
            她羞于谈自己的婚事，所以没提半个字。不过父亲懂得她的心思。
        - id: ch01-b06
          speaker: alcinous
          text: |-
            好女儿，骡子当然给你。还需要什么，也都可以。去吧，我让人准备结实的大车，车厢装得下你们所有的衣服。
        - id: ch01-b07
          speaker: narrator
          text: |-
            他让仆人推出车，把骡子套好。瑙西卡从储放衣物的房间取来东西，装上车。母亲收拾一篮各色好食物，再给一羊皮袋酒。女儿上车，还接到一只金瓶，里面是她和女仆擦身用的油。她拿好缰绳，挥鞭抽骡，车启程了。蹄子踏着路，响个不停，骡子一点不松劲，拉着少女、要洗的衣服和同行侍女。

            到了洗衣池，她们卸下骡子，让它们去吃岸边鲜嫩的草木。清水总从池中流过，脏衣服再多，再难洗，也够用。姑娘们搬下衣物，放进水里，比着使劲踩，踩去污垢。彻底洗净，便铺到海边高高的卵石滩，那是海浪堆出来的。随后她们自己洗澡，擦橄榄油，坐在溪流旁吃饭，等太阳把衣服晒透。吃完摘下头纱，开始抛球，瑙西卡给大家唱歌。

            她在人群里，像阿耳忒弥斯站在仙女中间。猎神去泰格托斯山，或去厄律曼托斯山追野猪和鹿。那些山林仙女，是持神盾的宙斯的女儿，她们也一起玩耍。勒托见自己的女儿比众人高一整个头，连最美的也比不过她，心里自然骄傲。瑙西卡也这样盖过了侍女们。
    - id: ch02
      title: 林中走来的陌生人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            她们准备回去了，正把衣服折叠装车。雅典娜却在想，该让奥德修斯醒来，见到这位会引他入城的美丽少女。瑙西卡便把球扔向女仆，没接上，球掉入深水，大家一齐惊叫。奥德修斯被吵醒，在枯叶床上坐起来，不知道外面发生了什么。
        - id: ch02-b02
          speaker: odysseus
          text: |-
            唉，这地方的人到底怎样？凶狠野蛮，没规矩，还是待人厚道、肯欢迎生客？我听着像少女的声音，仿佛山顶、河流源头或绿草地的仙女。无论怎样，总算来到有人生活的地方。我去看看能不能见到他们。
        - id: ch02-b03
          speaker: narrator
          text: |-
            他爬出灌木，折一根叶子很密的树枝，遮住裸露的身体。那样子像荒野的狮子，凭着力气强健，风雨也不怕。它瞪眼搜寻牛羊、鹿，实在饿了，连围得牢牢的农庄也敢闯，就为了里面的羊。奥德修斯同样急需帮助，赤裸着走来，落在少女眼里，便像这头狮子。

            他浑身海盐，头发蓬乱，其他姑娘一见，都顺着突出海面的沙嘴跑了。只剩国王女儿站在面前，雅典娜让她有了勇气，一点不怕。奥德修斯拿不定主意，要不要过去跪倒，抱她双膝求助，还是远远请她给衣服、指路？最后他觉得，靠近碰膝也许会冒犯，就在原处求吧。他挑了温柔好听的话开口。
        - id: ch02-b04
          speaker: odysseus
          text: |-
            女王，我请求您帮助。但您到底是神，还是凡人呢？若是天上的女神，我只能猜阿耳忒弥斯，宙斯的女儿。这脸、这身形，只有她有。若是人间女子，父母该有三倍的福，兄弟姐妹也有三倍的福。他们看见自家的女儿那么美，去参加舞会，多高兴、多骄傲！最有福的，是备最丰盛聘礼，迎娶您回家的那个人。

            男人女人我都见过，却没一个像您这样，让我惊叹。只有一棵小棕榈能比，那是在提洛岛，阿波罗祭坛旁长着的。我带很多人也到过那里，那趟远行给我带来了一切苦难。从没见过那样的小树从土里长起，我当时怎样看着赞叹，如今就怎样看着您。我不敢伸手抱膝，可真是走投无路。昨天已经是在海上漂流的第二十天，风浪一路从奥吉吉亚送我到这儿，命运现在把我扔上岸，恐怕还要让我受罪。苦还没完，上天想必另有许多灾祸。

            请可怜我，女王。这里第一个相遇的人就是您，旁人我谁也不识。请告诉我怎么进城，再给块带来包衣服的布也好。愿诸神满足您的心愿，让您有丈夫、有房屋，家庭又幸福，又平静。世上最好的，便是夫妻住在一处，心也在一处。仇人因此烦恼，好友看了欢喜，至于夫妻自己，那份好，谁都没他们懂得深。
        - id: ch02-b05
          speaker: nausicaa
          text: |-
            外乡人，你像个聪明、善良的人。命运没法说，宙斯想给富人、穷人什么，就给什么，我们只能担起他给的事，尽量承受。不过你既然到这里，衣服自然会有，困苦旅人应得到的其他帮助，也少不了。我会告诉你进城的路。我们这个民族，叫费埃克斯人，我父亲阿尔基诺奥斯，掌管整个国度。
        - id: ch02-b06
          speaker: narrator
          text: |-
            她接着大声叫住那些女仆。
        - id: ch02-b07
          speaker: nausicaa
          text: |-
            姑娘们，别跑了！看见男人就逃，为什么呀？以为是劫匪，或者杀人的？他也好，别人也好，都伤不到我们费埃克斯人。诸神喜欢我们，这里独在尽头，伸进响着涛声的大海，与别的民族毫无往来。这不过是个迷路的苦命人，该好好招待。外国客人和受苦的陌生人有宙斯保护，给他们一点，就会感激。先拿吃的喝的来，再领他到溪边没风的地方洗洗。
        - id: ch02-b08
          speaker: narrator
          text: |-
            女仆不跑了，互相叫回来，照吩咐请客人在避风处坐，取来衬衣、斗篷，也拿来那只小金油瓶，让他下溪水清洗。
        - id: ch02-b09
          speaker: odysseus
          text: |-
            各位姑娘，麻烦往旁边站站，让我把肩上的盐洗掉，再擦点油。我好久没让皮肤沾过油了。你们站着看，我没法洗。当那么多美丽姑娘的面脱衣服，我不好意思。
        - id: ch02-b10
          speaker: narrator
          text: |-
            她们走开，去向瑙西卡说了。奥德修斯在溪中把背和宽肩上的盐渍洗净，头发也洗透了，涂上油，穿好少女送的衣服。雅典娜让他显得更高、更有力，头顶的发丝浓密，卷下来像风信子花。她把他的头肩装点得光彩夺目，好比工匠在赫淮斯托斯、雅典娜那里学会所有本领，给银器镀上黄金，作品便美得动人。他到不远的滩上坐着，年轻又英俊。瑙西卡看得赞赏，对女仆说。
        - id: ch02-b11
          speaker: nausicaa
          text: |-
            静一下，姐妹们，我想说句话。这人应该是诸神送到费埃克斯来的。刚才看着普普通通，转眼竟美得像天神。我要能有个这样的丈夫多好，只要愿意留在这里，不再走。现在先给他些吃喝吧。
        - id: ch02-b12
          speaker: narrator
          text: |-
            她们把食物端上，奥德修斯吃得急，喝得也急，已经不知多久没有任何东西入口。瑙西卡又去安排衣物，让人叠好装车，把骡子套起。她坐到车上，叫他同行。
    - id: ch03
      title: 通往王家的路
      blocks:
        - id: ch03-b01
          speaker: nausicaa
          text: |-
            外乡人，起来吧，回城了。我带你到好父亲的家里，你会见到本族最杰出的人。你既懂道理，就按我的吩咐做。在农庄田地之间，跟女仆一起，快步走在车后，我给你们领路。

            到城边，就能看见绕城的高墙，左右各有港，通道却窄。路边拉上岸的都是船，每个船主有自己的停泊位置。市集中央是波塞冬神庙，脚下大石块嵌在土里。那里什么船具都有得买卖，缆索、帆，还有做桨的作坊。我们不会射箭，不懂弓，长处是航海。那些桅杆、桨和船，让我们很骄傲，我们靠它们走很远的海路。

            不过，我怕以后有人传坏话。这里的人心肠不好，哪个粗鲁家伙一看见，可能就这样议论。
        - id: ch03-b02
          speaker: imagined_townsman
          text: |-
            那个跟着瑙西卡的漂亮外乡人是谁？从哪儿找来的？准是想嫁他吧。也许她从外国船上领了个漂泊水手，我们这儿又没有邻邦。或者一直求神，总算有位从天上下来，要陪她过一辈子。她去别处找个丈夫才好呢！明明那么多费埃克斯好青年爱她，她连一个也不喜欢。
        - id: ch03-b03
          speaker: nausicaa
          text: |-
            他们会这样损我，我也不能抱怨。因为若看见别的姑娘父母尚在，又没当着大家正式嫁人，就不顾别人，跟男人来往，我自己也不赞成。

            想请父亲派人送你归乡，就得听我的。路旁会见到一片献给雅典娜的美丽杨树林，中间有井，四周草地，父亲有块肥美的园地也在那儿。离城多远呢，大约一声喊，城里就听得见。你先去坐下，等我们入城，回到父亲家。觉得差不多了，再出发进城，打听阿尔基诺奥斯的宅子。小孩子都能指出来，没有谁家能和他家一样好。

            进大门，走过外院，再穿内院去找母亲。她在炉旁借火光纺紫色羊毛，靠着承柱，后面整整齐齐站着侍女，很好看。父亲的座位紧挨她的，他在那里畅饮，如同不朽的神。别忙着找他，去母亲面前，抱住她双膝。要想早点到家，就先说服她。她愿帮忙，你再远的故乡也有望看见了。
        - id: ch03-b04
          speaker: narrator
          text: |-
            说好后，她抽打骡子，赶车离河。骡子拉得稳当，蹄子在路面一上一下。她不让车太快，奥德修斯和侍女还步行跟着，所以用鞭很有分寸。天将晚，大家到了雅典娜的圣林。奥德修斯坐下来，向宙斯那位强大的女儿祈求。
        - id: ch03-b05
          speaker: odysseus
          text: |-
            永不疲倦的女神，持神盾的宙斯的女儿，现在请听我。波塞冬砸毁木筏时，我求您，您没理会。这一次请怜悯我，让费埃克斯人做我的朋友，愿意好好接待我。
        - id: ch03-b06
          speaker: narrator
          text: |-
            雅典娜听到了，仍不肯在他面前公开露面。她畏惧波塞冬，那是父亲的兄弟。海神依旧满腔怒气，想尽办法阻止奥德修斯归家。
