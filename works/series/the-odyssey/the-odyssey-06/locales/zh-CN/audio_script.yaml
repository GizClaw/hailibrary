audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: 坦然体贴, timbre: 年轻清亮, pace: 自然活泼, pitch: 中高音}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: 笃定而慈爱, timbre: 成熟厚实, pace: 从容, pitch: 中低音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定而亲近, timbre: 清亮稳定, pace: 自然从容, pitch: 中音}
  chapters:
    - id: ch01
      title: 洗衣的一天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            奥德修斯还在落叶里睡着，雅典娜就进了费埃克斯王宫。本地人以前总受独眼巨人抢掠，老国王瑙西托奥斯带大家搬来斯刻里亚，修了城墙、房屋和神庙。现在，阿尔基诺奥斯做国王。

            他的女儿瑙西卡在梦里见到好友，其实是雅典娜变的。她来催姑娘准备衣服。
        - id: ch01-b02
          speaker: athena
          text: |
            就快结婚了，你的衣服，还有陪你去婚礼的人的衣服，都得洗好。明早找你父亲借辆车，我们去河边，我来帮你。
        - id: ch01-b03
          speaker: narrator
          text: |
            瑙西卡醒了，去见父母。母亲在炉旁纺线，父亲正要出门议事，她先开口借车。
        - id: ch01-b04
          speaker: nausicaa
          text: |
            您开会要干净衣服，哥哥们跳舞也得换洗。今天让我带上家里的衣物，坐大车去河边洗吧。
        - id: ch01-b05
          speaker: narrator
          text: |
            自己的婚事，她没好意思说，父亲却懂得，答应给车和骡子。
        - id: ch01-b06
          speaker: alcinous
          text: |
            去吧，什么用得着，就带什么。
        - id: ch01-b07
          speaker: narrator
          text: |
            衣服装了车，母亲又备食物、酒和油。女儿带女仆驾车出城。在河边，她们放骡子吃草，把衣服放到清水池踩洗，争着洗净，再摊到海边石子上晒。她们自己洗过澡、抹过油，坐在水边吃饭。
            衣服还在太阳下晒着，她们便玩起球，瑙西卡也唱起歌。后来，大家开始叠衣装车，雅典娜却让瑙西卡把球传偏，掉进了深水。女人们齐声惊叫，灌木下的奥德修斯就这样醒了。
    - id: ch02
      title: 留下来的姑娘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            奥德修斯听出了女人的声音，却不知道这里的人肯不肯善待外乡客。他折了根叶子浓密的树枝，遮住赤裸的身体，走出灌木。

            这个满身盐、头发蓬乱的男人一出现，女仆们都跑了。瑙西卡却留在原地。雅典娜给她勇气，让她不再害怕。
            他想抱她的膝盖求救，又怕走太近惹她不快，便远远说话。
        - id: ch02-b02
          speaker: odysseus
          text: |
            请帮帮我。您是女神，还是凡间的姑娘？若是女神，您的模样一定很像阿耳忒弥斯。若是凡人，父母和兄弟有您在家，该多么骄傲，往后的丈夫更有福气。我在得洛斯见过一株小棕榈，长在阿波罗的祭坛边。当时，我也是这样惊叹。
            我漂了二十天，昨天才上岸。您是第一个我遇见的人。请给我指条进城的路，再找块布让我遮身，包衣服的布也够用。愿您嫁给称心的人，夫妻相处得好，一家平平安安。
        - id: ch02-b03
          speaker: narrator
          text: |
            听着这些话，瑙西卡知道他并不粗鲁。
        - id: ch02-b04
          speaker: nausicaa
          text: |
            到这里就有衣服，也有该给的帮助。我们是费埃克斯人，我父亲是国王阿尔基诺奥斯。路我会告诉你。
        - id: ch02-b05
          speaker: narrator
          text: |
            她叫女仆回来，告诉她们，这人遇了难，别当他是强盗。流落在外、没处求助的人受宙斯保护，她们也该帮忙。她让人找个避风处，送来饭、水、衣服和油，让他洗去身上的海盐。
            女仆互相招呼回来，拿着长衣、斗篷和油。他却请她们站开，想自己洗。年轻姑娘在场，他不好意思脱掉遮身的东西。
            女仆们回到瑙西卡身边。奥德修斯洗净头发、肩膀和后背，抹上油，再穿好衣服。雅典娜又让他变得高大健壮，头发也变得浓密卷曲。他到稍远的沙地上坐下。瑙西卡看着眼前这个人，十分赞叹。
        - id: ch02-b06
          speaker: nausicaa
          text: |
            刚来时那么狼狈，这会儿倒像神了。也许是神送他来的。真希望将来能嫁给这样的人，只要他愿意留下。快把饭送去吧。
        - id: ch02-b07
          speaker: narrator
          text: |
            奥德修斯饿得久，吃得急。姑娘装好剩下的衣服，套骡子，叫他跟着走，先把进城的办法告诉他。
    - id: ch03
      title: 宫门要怎样进去
      blocks:
        - id: ch03-b01
          speaker: nausicaa
          text: |
            穿过田野时，你和女仆跟在车后面。快到城门，咱们就得分开了。别人要是看见，会说我嫌本地求婚的人不好，自己找了个外来的丈夫。说实在的，换成别的姑娘，父母还在，又没成婚，就不顾家里人的意思同男人来往，我也看不惯。
            城外有雅典娜的白杨林，附近有泉和父亲的田。你等一等，等我们回了家再进城。王宫在哪，随便问谁都知道。
        - id: ch03-b02
          speaker: narrator
          text: |
            她还告诉他，城墙很高，两边都是港口。海神庙旁边是集市，有人在那里做船桨、缆绳和船帆。弓箭不是他们的长处，他们最得意的是船，还有远航的本事。
        - id: ch03-b03
          speaker: nausicaa
          text: |
            进屋先找母亲。她在火边纺线，女仆在后面，父亲也坐得近。先别找他。抱住母亲的膝盖，请她帮忙。她要是答应，不管你家多远，都有希望回去。
        - id: ch03-b04
          speaker: narrator
          text: |
            姑娘驾车走在前面，特意压住骡子的速度，让后面步行的人能跟得上。快到日落，他们来到白杨林。瑙西卡继续朝城里去，奥德修斯照约定留在林中，向雅典娜祈祷，希望费埃克斯人肯接待这个外来人。

            女神听见了，却不敢露面相见。她的叔父波塞冬还在发怒，打定主意拦住奥德修斯，不让他回家。
