audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "从容讲述古老故事，随人物处境自然转折", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切直率，着急时说得分明有力", timbre: "略显苍老而有活力", pace: "轻快", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "审慎克制，情感藏在语气深处", timbre: "成熟清澈", pace: "沉稳", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，态度鲜明", timbre: "清亮有力", pace: "适中", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "深思后开口，坚定而含着温情", timbre: "略带风霜的厚实声音", pace: "沉着", pitch: "中低音"}
    townsman_1:
      display_name: 第一位城中男子
      tts: {delivery: "随口议论，带着责备", timbre: "粗粝干涩", pace: "适中", pitch: "低音"}
    townswoman_1:
      display_name: 城中女子
      tts: {delivery: "随口议论，带着责备", timbre: "明亮轻盈", pace: "适中", pitch: "中高音"}
    townsman_2:
      display_name: 第二位城中男子
      tts: {delivery: "随口议论，带着责备", timbre: "柔和略沙哑", pace: "适中", pitch: "中音"}
  chapters:
    - id: ch01
      title: "难信的消息"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "乳母笑着跑上楼，老膝盖仿佛又有了年轻时的劲。她凑近床边，叫醒王后。"
        - id: ch01-b02
          speaker: euryclea
          emotion: happy
          text: "快来看！你丈夫真回来了，求婚人让他全杀了！"
        - id: ch01-b03
          speaker: narrator
          text: >-
            丈夫去特洛伊以后，佩涅洛佩没睡过这么安稳的一觉。乳母却把她叫醒，说起不可能的事。她已经够苦了，怎能再受这种欺骗？她觉得，神一定使原本明理的老人失去了理智。若是个年轻人，早被她骂走，不过年纪大才没追究。乳母还说，挨欺负的外乡人就是奥德修斯，儿子早已知情，为报仇才瞒着。王后高兴得跳下床，抱住她哭。可她随即又问，单独一个人，怎么对付屋里那么多人？
        - id: ch01-b04
          speaker: euryclea
          text: >-
            我没亲眼看见。我们锁在房里，挤成一团，只听见哭叫。你儿子带我出去时，他就站在尸体中，像头沾满血的狮子。你见了也会欢喜。现在尸体搬去门房，他拿硫磺熏屋，叫你下去。妻儿都平安，他在自家报了仇。
        - id: ch01-b05
          speaker: narrator
          text: >-
            佩涅洛佩还觉得，是神惩治了求婚人，丈夫早死在远处。乳母又说，洗脚时她摸到旧疤，想说，他不许。若她骗人，女主人想用多残酷的死法杀她，都可以。
        - id: ch01-b06
          speaker: penelope
          text: "神的事谁能全懂？我还是下去，看看儿子、死掉的人，再看看是谁动的手。"
    - id: ch02
      title: "床的根"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            下楼时她想，先问话还是先拥抱？到了火边，只坐在对面。他垂眼等着，她看脸像丈夫，看破衣又觉得陌生。儿子急了。
        - id: ch02-b02
          speaker: telemachus
          text: "他受苦二十年才回来，你还不靠近。哪有妻子这样？你的心是石头吗？"
        - id: ch02-b03
          speaker: penelope
          text: "我惊得说不出话。他真是你父亲，我们会认得。有些凭据，旁人不知道。"
        - id: ch02-b04
          speaker: narrator
          text: >-
            奥德修斯笑了，让儿子容母亲慢慢试。可眼下还有危险，杀一人也可能被亲友复仇，得逃出国。他们却杀了伊萨卡最有势力的一群青年。儿子让父亲拿主意，自己只要有力气，就会跟随。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            先洗身换衣，女人也打扮好。叫斐弥奥斯奏舞曲，外面会以为是婚礼。等到我们走进自家树林，再想神留下什么出路，别让杀人的消息先传开。
        - id: ch02-b06
          speaker: narrator
          text: "他们跳起舞，外头果然误会，怪王后不肯替丈夫守家。"
        - id: ch02-b07
          speakers: [townsman_1, townswoman_1, townsman_2]
          ensemble: chorus
          text: "到底嫁人了，连家产也不肯替他守到归来！"
        - id: ch02-b08
          speaker: narrator
          text: >-
            他们哪知道屋里的事。欧律诺墨替归人洗浴、抹油、穿衣，雅典娜又使他高大强壮、卷发浓密，肩颈像镀金银器一样闪着光。他重新坐下，妻子仍不肯靠近。
        - id: ch02-b09
          speaker: odysseus
          text: "二十年才回来，你还这样。乳母，让我单独睡吧。她的心是铁。"
        - id: ch02-b10
          speaker: narrator
          text: "佩涅洛佩平静地说，自己没有骄傲，也没看轻他，仍记得他出海的模样。她转向乳母。"
        - id: ch02-b11
          speaker: penelope
          text: "把他亲手造的房里那张床搬出去，铺好皮褥被子。"
        - id: ch02-b12
          speaker: narrator
          text: "这一下，奥德修斯发怒了。"
        - id: ch02-b13
          speaker: odysseus
          emotion: angry
          text: >-
            谁动过我的床？再有力气也搬不了，除非砍断！院子那棵橄榄树，有柱子这么粗。我围着它，把石墙砌好，加屋顶，门也安得牢牢的，再砍去上头的枝叶，修好留在地里的树干，做成床柱。我从这儿打孔，造好床的其余部分，镶上金银，再绷红皮革。它还在原地吧？难道有人把树从根砍了？
        - id: ch02-b14
          speaker: narrator
          text: "王后再不怀疑，扑过去搂住他的脖子，一面吻，一面哭。"
        - id: ch02-b15
          speaker: penelope
          text: >-
            别对我生气。神不让我们年轻时相依，也不让我们一同老去。我一直担心，会有人编出故事来骗我。海伦若知道阿开亚人会追来把她带回，哪肯委身外乡人？神让她做错，苦难才跟着来。可这张床，只有你、我，还有当年出嫁时父亲陪送给我的女仆见过。你知道得这样清楚，我再也不能疑心了。
        - id: ch02-b16
          speaker: narrator
          text: |-
            丈夫也哭着抱她。她像从海难里游出来，终于踩到陆地，怎么也不肯放手。

            雅典娜让夜晚继续停在这里，曙光不许离开大洋，也不许套好那些把白昼送到人间的马。
    - id: ch03
      title: "还得扛桨远行"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            奥德修斯说，苦还没受完。在冥府，先知忒瑞西阿斯交代过，自己还得长途跋涉。现在他想跟妻子去睡。可妻子要听，反正以后也得知道，不如现在讲。他不愿说，仍没有瞒。
        - id: ch03-b02
          speaker: odysseus
          text: >-
            我得扛桨往内陆走，找到没听说过海、吃东西不加盐的人。有路人会问，我肩上是不是扬谷铲。我就在那儿把桨插入土里，给波塞冬献公羊、公牛、公猪。然后回家，一位接一位祭神。先知说，到我年老安稳，人民幸福时，死亡会从海上来，轻轻带走我。
        - id: ch03-b03
          speaker: penelope
          text: "神若肯让你老来安稳，总有能从厄运中歇一歇的时候。"
        - id: ch03-b04
          speaker: narrator
          text: >-
            远行还没做。两个女人举火把铺床，乳母先去休息，女管事领他们入房，也退出。夫妻高高兴兴回到旧床，重新享受亲密。回廊里，儿子和牧人停舞，让女仆歇下，自己也睡了。
    - id: ch04
      title: "相聚，天明，再出发"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            两人尽了欢爱，又说起各自分离的岁月。佩涅洛佩讲，看求婚人把家里塞满，宰掉那么多牛羊，喝空那么多酒，是怎样的痛苦。奥德修斯说自己经受的苦，也说自己给别人带来的苦。妻子不肯睡，要全部听完。他讲劫掠基科涅斯人，到了食莲人那儿。独眼巨人吞掉同伴，他又刺瞎巨人。埃奥洛斯款待他，助他出海，暴风却把他吹离家乡。莱斯特律戈涅斯人毁掉整支船队和船员，只剩他自己的船逃出去。
        - id: ch04-b02
          speaker: narrator
          text: >-
            再是喀耳刻的法术，去冥府问先知，见战友与母亲。随后他讲塞壬歌声、险礁、卡律布狄斯和斯库拉。伙伴杀太阳神的牛，宙斯便毁船，让他们全死。独自到了卡吕普索那儿，她留他在岛上，许婚姻、不老不死，他没答应。又经历苦难，费埃克斯人送他金、铜、衣服，拿船送他回家。
        - id: ch04-b03
          speaker: narrator
          text: "讲完，他才睡得深了，悲伤也暂时松开。"
        - id: ch04-b04
          speaker: narrator
          text: >-
            雅典娜让他有足够时间和妻子相聚，也给了他休息，随后才放出曙光。奥德修斯起来，对妻子交代，留在屋里的财物要由她照料。求婚人吃掉的牛羊，他会强行取自别人，再命阿开亚人补其余的，直到栏里全养满。现在，他要到乡间去，看受了多年伤心的父亲。
        - id: ch04-b05
          speaker: odysseus
          text: "天一亮，死人的消息就传开。你们留在楼上，不见客，也别打听。"
        - id: ch04-b06
          speaker: narrator
          text: |-
            他披好甲，叫醒儿子和两个牧人。四个人拿好兵器，开门，由他领着出去。

            外面已经是白昼，雅典娜却把四个持着兵器的人藏在黑暗里，由自己领着，迅速走出了城。
