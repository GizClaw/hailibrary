audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "从容讲述古老故事，随人物处境自然转折", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切直率，着急时说得分明有力", timbre: "略显苍老而有活力", pace: "轻快", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "审慎克制，情感藏在语气深处", timbre: "成熟清澈", pace: "沉稳", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，态度鲜明", timbre: "清亮有力", pace: "适中", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "深思后开口，坚定而含着温情", timbre: "略带风霜的厚实声音", pace: "沉着", pitch: "中低音"}
    townsman_1:
      display_name: 第一位城中男子
      tts: {delivery: "随口议论，带着责备", timbre: "粗粝干涩", pace: "适中", pitch: "低音"}
    townswoman_1:
      display_name: 城中女子
      tts: {delivery: "随口议论，带着责备", timbre: "明亮轻盈", pace: "适中", pitch: "中高音"}
    townsman_2:
      display_name: 第二位城中男子
      tts: {delivery: "随口议论，带着责备", timbre: "柔和略沙哑", pace: "适中", pitch: "中音"}
  chapters:
    - id: ch01
      title: 乳母带来的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            欧律克勒娅笑着往楼上赶。她要告诉女主人，盼了那么久的丈夫回来了。老太太高兴得脚步都轻了，膝盖好像也年轻了许多。到了床边，她弯下身，凑到佩涅洛佩头旁。
        - id: ch01-b02
          speaker: euryclea
          emotion: happy
          text: >-
            佩涅洛佩，孩子，快醒醒！你一直盼的事，自己来看吧。奥德修斯回来了，真回来了！那些在家里闹事、耗尽家产、欺负你儿子的求婚人，已经让他杀了。
        - id: ch01-b03
          speaker: penelope
          text: >-
            乳母，你怎么糊涂了？神能让聪明人失去理智，也能让糊涂人明白过来。你从前多懂道理，他们一定把你的心智弄乱了。我已经这么苦，你还拿胡话来骗我。刚才那一觉多甜，我的眼睛终于闭上了，你却把我叫醒。自从我那可怜的丈夫去了名字不吉利的那座城，我都没睡过这么安稳的一觉。回女仆房去吧。换个人这样叫醒我，说这种荒唐话，我早就狠狠训她，再赶她走了。也就是看在你年纪大，我才不追究。
        - id: ch01-b04
          speaker: euryclea
          text: >-
            孩子，这种事我怎么会骗你？我说的都是真的。他就是那个外乡人，在回廊里老受他们欺负的那个人。忒勒马科斯一直知道，却没说破父亲的身份，好让他找这些恶人报仇。
        - id: ch01-b05
          speaker: narrator
          text: >-
            佩涅洛佩一下跳下床，搂住乳母，高兴得哭了出来。
        - id: ch01-b06
          speaker: penelope
          text: >-
            好乳母，可你告诉我，他一个人怎么对付得了他们？那些求婚人那么凶，人又多。他真回来了，又是怎么打赢的？
        - id: ch01-b07
          speaker: euryclea
          text: >-
            怎么杀的，我没看见。我只听见他们临死前的呻吟。我们把女仆房的门关上，都蹲在角落里，挤作一团。后来你儿子来叫我，是他父亲让他来的。我出去时，奥德修斯就站在死人堆里，脚下到处是尸体，堆得一层压着一层。他满身都是血和脏东西，像一头狮子。你看了，一定觉得痛快。现在尸体都搬走了，堆在外院门楼。屋里升了大火，他正用硫黄净屋呢。他让我带你过去。走吧，你们吃尽了苦头，总算能一起高兴一回了。你盼的事已经成了。丈夫回到家，妻子儿子都好好的，还在自己的屋里，向那些害他的求婚人报了仇。
        - id: ch01-b08
          speaker: penelope
          text: >-
            你先别把话说得那么满。奥德修斯回来，谁会不高兴？最盼他的，就是我和我们的儿子。可这事不会是真的。那些人谁也不尊重，走到他们面前的，不管有钱没钱，都受欺负。他们作恶太多，一定惹怒了哪位神，让神杀了。这是他们自己招来的下场。奥德修斯已经死在远离阿开亚的地方了，他不会回来了。
        - id: ch01-b09
          speaker: euryclea
          text: >-
            你这孩子，怎么就是不信？你们认准他回不来，可他现在就在家，坐在自己的炉火旁。我还有证据。我给他洗脚的时候，看见了野猪当年留下的那道伤疤。本来想告诉你，可他想得周到，两只手把我的嘴捂住了。跟我去吧，我跟你说定了。我要是骗你，你就用最残酷的办法杀了我，你想到什么办法都成。
        - id: ch01-b10
          speaker: penelope
          text: >-
            好乳母，你再明白，也猜不透神的打算。那我们就去找我儿子。我去看看那些尸体，再看看动手的人。
    - id: ch02
      title: 橄榄树做的床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            下楼时，佩涅洛佩还拿不定主意。是隔远一点，先问几句话，还是马上过去抱住丈夫？穿过回廊的石地，她在炉边坐了下来。她背后的墙，和进门时那道墙成直角。奥德修斯坐在对面的一根柱子旁，低着眼睛，等他坚强的妻子开口。

            她却一直沉默着，像是惊呆了。有时盯住他的脸，有时又看见那身破衣服，不敢相认。忒勒马科斯终于忍不住责备她。
        - id: ch02-b02
          speaker: telemachus
          text: >-
            母亲，你这样冷酷，我真不想这么叫你！你干吗躲得远远的？到父亲身边坐呀，跟他说说话，问问他的经历。他走了二十年，遭了那么多罪才回来，哪有别的妻子会这样待他？你的心从来就像石头一样。
        - id: ch02-b03
          speaker: penelope
          text: >-
            孩子，我现在太吃惊，话都不会说了。想问，问不出来，想回答，也回答不了，连正眼看他都做不到。不过，他要真是奥德修斯，我们总会认出对方。有些事情，只属于我们两个人，别人怎么也不会知道。
        - id: ch02-b04
          speaker: narrator
          text: >-
            听到这话，奥德修斯笑了。他对儿子说。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            她想怎么试，就让她试吧，很快她就知道了。我穿成这样，浑身脏，她才以为我是旁人，不肯认。现在先想想后面的事。杀一个人，哪怕那人没几个朋友肯报仇，动手的也得离开亲友，逃到别处。可我们杀的是全城最重要的人，是伊萨卡最出色的青年。这件事，你可要想明白。
        - id: ch02-b06
          speaker: telemachus
          text: >-
            父亲，还是你来定吧。论出主意，谁也比不过你，大家都这么说。我们愿意跟着你，只要还有力气，就不会叫你失望。
        - id: ch02-b07
          speaker: odysseus
          text: >-
            那就听我说。你们先去洗洗，穿好衬衣。女仆也回自己的房间，把衣服换好。斐弥奥斯拿琴来，弹一支舞曲。邻居也好，门口经过的人也好，听见就会当我们在办婚礼。这样，等我们进了自家田地上的树林，城里还没听说求婚人死了。到了自家田地的林子里，再来商量怎么办。看看上天还给我们留了哪些路，从中挑出最明智的一条。
        - id: ch02-b08
          speaker: narrator
          text: >-
            他们照办了。男人洗过身子，套上衬衣，女人也换好了衣服。斐弥奥斯拨起琴弦，大家都想唱动听的歌，跳庄重的舞。屋里到处响着男女的舞步。外面的人听到这些声音，便议论起来。
        - id: ch02-b09
          speakers: [townsman_1, townswoman_1, townsman_2]
          ensemble: chorus
          text: >-
            王后到底还是改嫁了。丈夫还没到家，她就不替他守着财产，真不知羞。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他们哪里知道，屋里刚发生过什么。奥德修斯在自己家中洗了澡，主管家务的欧律诺墨替他抹油，给他拿来衬衣和斗篷。雅典娜又让他看起来比从前更高大、更强壮，头发浓密，一绺绺卷下来，好像风信子的花。头颈和双肩也焕发出光彩，就像精巧的工匠给银器镀金。那工匠跟赫淮斯托斯或雅典娜学全了本领，做出来的东西，没有一件不美。

            他从浴室出来，简直像位神，又坐回原来那把椅子，面向妻子。
        - id: ch02-b11
          speaker: odysseus
          text: >-
            亲爱的，你这颗心可真硬，神从没给别的女人这么硬的心。丈夫走了二十年，吃尽苦头，今天才回来，谁会像你这样不肯靠近？乳母，给我铺床吧。我一个人睡。她的心是铁做的。
        - id: ch02-b12
          speaker: penelope
          text: >-
            我不是故意摆架子，也不是瞧不起你。你现在这个样子，倒没有让我惊讶。我一直记得，当年离开伊萨卡时，你是什么模样。欧律克勒娅，把他的床搬出来吧，搬到他亲手盖的卧房外面，铺好毛皮、好被子，还有毯子。
        - id: ch02-b13
          speaker: narrator
          text: >-
            这句话是说来试他的。奥德修斯一下就发了火。
        - id: ch02-b14
          speaker: odysseus
          emotion: angry
          text: >-
            你说什么？谁动了我的床？手艺再好的人也很难搬走，除非有神帮忙。不管多年轻、多有力气，人是挪不动它的。我亲手造的这张床，可不是寻常东西。院里长过一棵橄榄树，正茂盛，树干像柱子那么粗。我围着它造屋，用结实的石头砌墙，加上屋顶，门也做得牢牢的，关得严丝合缝。然后砍去上面的枝条，把树桩留下，从树根往上修。我用木匠工具一点点做好，拉一道线，照着线把木头修直，做成床柱，再往正中钻一个孔，让它成了床中央的柱子。接着把整张床做完，镶上金银，再把红皮革从这边绷到那边。这张床怎么来的，我全知道。你告诉我，它到底还在不在？难道有人把树从根上砍断，连床一起搬了？
        - id: ch02-b15
          speaker: narrator
          text: >-
            这些话把佩涅洛佩最后的疑心打消了。她再也撑不住，流着泪扑过去，抱住丈夫的脖子，亲吻他。
        - id: ch02-b16
          speaker: penelope
          text: >-
            奥德修斯，别怪我。你比谁都明白事理。我们受的苦太多，神不让我们年轻时相守，也不让我们一起老去。我没一见面就抱你，你别难受，也别恼我。我一直怕，怕有人编出故事骗我，想到就发抖。外面的坏人实在多。你看海伦，她是宙斯的女儿。要是早知道阿开亚人的儿子会追来，把她带回去，她怎么会跟一个外邦男人在一起？是神让她动了邪念，她根本没想到那份罪过。我们这些苦，全是从那里来的。可现在，我信你了。我们的床，除了你我，只被一个女仆见过。她是阿克托尔的女儿，我出嫁时父亲把她送给我，卧房的门就是她守着。床的事你说得分毫不差，我再不容易相信人，也不能怀疑你了。
        - id: ch02-b17
          speaker: narrator
          text: >-
            奥德修斯的心也软了，搂住亲爱而忠贞的妻子，陪着她哭。

            海上的船遇上波塞冬掀起的狂风巨浪，被打碎了，人只好向岸边游。能活着上岸的没有几个，个个满身咸水。忽然见到陆地，脚底终于踏稳，不再有危险，那会是怎样的欢喜和感激？佩涅洛佩眼里的丈夫，就像那片陆地。她美丽的双臂搂着他的脖子，怎么也舍不得放开。

            要不是雅典娜另有安排，他们会这样流着泪，一直等到玫瑰色手指的黎明。女神把黑夜拖在遥远的西方，不让曙光离开俄刻阿诺斯，也不许她套马。兰波斯和法厄同这两匹马，本来是载着曙光往前，给人间带来白昼的。
    - id: ch03
      title: 天亮前后的话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            过了一阵，奥德修斯终于开口。
        - id: ch03-b02
          speaker: odysseus
          text: >-
            妻子啊，我们还没熬到头。我不知道还有多少苦差等着，又长又难，却一定得去做。当初我下冥府，问自己和伙伴怎么回家，忒瑞西阿斯的魂就是这么告诉我的。不过，现在我们先去睡吧。一起躺下来，好好享受能安心睡觉的福气。
        - id: ch03-b03
          speaker: penelope
          text: >-
            你想睡，随时都可以。神总算把你送回家，送回故乡了。不过，既然让你想起了这件事，就告诉我吧。以后还要做什么？反正迟早得知道，不如现在听。
        - id: ch03-b04
          speaker: odysseus
          text: >-
            你何必非要听呢？好吧，我不瞒你。这话你不爱听，我自己也不喜欢。忒瑞西阿斯让我扛一支船桨，往很远的地方走，走到有人连海都没听说过的地方。他们吃东西不放盐，不认识船，也没见过船的翅膀，就是船桨。他告诉我一个信得过的凭据，我也说给你听。有个路人会迎面过来，问我肩上是不是扛着扬谷铲。我就在那儿把桨插进地里，给波塞冬献一只公羊、一头公牛、一头公猪。然后回家，天上的神，一个接一个，都要献上百牲祭。他还说，到我年纪很大、心里安宁的时候，死亡会从海上来，轻轻带走我的命。我的人民会为我祝福。他说，这些事全都会发生。
        - id: ch03-b05
          speaker: penelope
          text: >-
            要是神肯让你老来过些好日子，那总能盼着从厄运里歇一歇了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            夫妻俩说着话，欧律诺墨和乳母已经举起火把，铺好柔软的被褥。乳母回屋歇了，照料卧房的欧律诺墨留下，拿着火把送他们进去，再退出来。他们欢欢喜喜地回到那张旧床，重享夫妻的亲密。

            忒勒马科斯、菲洛伊提奥斯和牧猪人也停了舞步，让女人们别再跳了。随后，他们就在回廊里睡下。

            夫妻尽享欢爱，便躺着说起各自的遭遇。佩涅洛佩讲，家里塞满求婚人，为了她，他们杀了那么多牛羊，喝了那么多桶酒，看着这些，她心里有多苦。奥德修斯也告诉她自己受过什么罪，又让别人吃了多少苦。所有的事，他都一一说了。她高兴地听着，直到最后也舍不得睡。
        - id: ch03-b07
          speaker: narrator
          text: >-
            他先讲打败基科涅斯人，后来到了食莲人富饶的地方。独眼巨人怎样吃掉勇敢的同伴，他又怎样惩罚那怪物，也全讲了。再往后，是埃奥洛斯热情地接待他，帮他上路。可他还是回不了家，暴风把他吹回海里，叫他伤心极了。到了莱斯特律戈涅斯人的忒勒皮洛斯城，整支船队和船员都遭到毁灭，只有他自己那条船留下。

            接着是喀耳刻，她的狡诈和法术。再接着，他驶进冰冷的冥府，找忒拜的先知忒瑞西阿斯。以前一同作战的朋友，以及生他、养他长大的母亲，都在那里被他遇见。后来他听到了塞壬美妙的歌，经过游移礁、凶险的卡律布狄斯，还有斯库拉。从没哪个人能安全地从她身边经过。同伴们吃了太阳神的牛，宙斯因此用雷霆击毁了他们的船，所有人都死了，只剩他。

            终于到了奥吉吉亚，卡吕普索把他留在洞里，给他吃的，想嫁给他。他答应，她就让他永远不老，永远不死。可她说服不了他。他又受了许多苦，才遇到费埃克斯人。他们拿他当神一样敬重，送来大量黄金、青铜和衣服，用船把他送回故乡。讲到这里，故事结束了，睡意也深深地袭来，让他卸下了悲伤。
        - id: ch03-b08
          speaker: narrator
          text: >-
            雅典娜开始安排另一件事了。她觉得奥德修斯与妻子相聚得够了，也睡够了，就命坐金座的曙光从俄刻阿诺斯升起来，把人间照亮。奥德修斯起身，离开舒服的床，对妻子说。
        - id: ch03-b09
          speaker: odysseus
          text: >-
            我们都受够了。你在家里为我伤心，我在外面想回来，怎么也回不来。现在终于见面，你就照管好屋里的财物。那些求婚人吃掉的绵羊和山羊，我去别人那里夺些来，再叫阿开亚人把其余的补齐，直到所有畜栏都满了。我要到乡下有树林的田里，看望父亲，他为我难过太久。有几句话，虽然你不用我教，我还是说一声。太阳出来，求婚人死在我手里的消息就传开了。你带着女仆上楼，待在那里。别见人，也别问事。
        - id: ch03-b10
          speaker: narrator
          text: >-
            说话间，奥德修斯已经把铠甲穿上。然后叫醒儿子，还有菲洛伊提奥斯和欧迈奥斯，让他们也披甲拿好武器。三人照办，准备好了，一起开门出去，由他领路。

            外面已经是白天，雅典娜却用黑暗掩住四个人，很快便带他们离开了城。
