audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "从容讲述古老故事，随人物处境自然转折", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切直率，着急时说得分明有力", timbre: "略显苍老而有活力", pace: "轻快", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "审慎克制，情感藏在语气深处", timbre: "成熟清澈", pace: "沉稳", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，态度鲜明", timbre: "清亮有力", pace: "适中", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "深思后开口，坚定而含着温情", timbre: "略带风霜的厚实声音", pace: "沉着", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "她不敢相信"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "欧律克勒娅笑着跑上楼，脚步轻快得让人看不出她老了。她伏在佩涅洛佩床边，叫醒了王后。"
        - id: ch01-b02
          speaker: euryclea
          emotion: happy
          text: "夫人，快来看！奥德修斯到了，那群求婚人已经全被他杀死。"
        - id: ch01-b03
          speaker: penelope
          text: >-
            乳母，你这是糊涂了吗？准是神让你说胡话。我受的苦已经够多了，你又来骗我。丈夫去特洛伊以后，我还没睡过这么好的一觉。好不容易睡安稳了，你又把我叫醒。换个年轻人这样，我早就骂走了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            乳母坚持说，没有骗她。那个被打被骂的陌生人就是主人，儿子一直知道，只是为了报仇才保守秘密。佩涅洛佩一下跳下床，抱住乳母，高兴得流泪。可转眼她又不敢信了，丈夫一个人，怎么对付得了那么多求婚人？
        - id: ch01-b05
          speaker: euryclea
          text: >-
            我没见他动手。我们锁在女仆房，挤作一团，听人呻吟。你儿子出来叫我，我才看见他站在尸体中，血满身都是，跟头狮子一样。你看了也会痛快。死人搬去门房了，他在熏屋，叫你下去。你和儿子好好的，人也到家了，闹得家里不安宁的那群人全死了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王后仍说，也许是神惩罚这些恶人，丈夫早死在远处。乳母又用旧疤作证，说洗脚时摸到，却被主人拦着，不让她报信。如果她骗了，女主人怎样残酷地杀她都行。佩涅洛佩说，神的心思谁也猜不透，不过，她愿下楼看儿子，看尸体，也看动手的人。
    - id: ch02
      title: "拿床来试他"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            下楼的时候，她还没想好，是站远一点，先问他几句，还是直接过去抱他。到了炉边，她在对面坐了下来。丈夫低着眼等她，她却始终不开口。有时看他的脸，觉得这就是丈夫，目光落到破衣上，又不敢认了。儿子终于忍不住。
        - id: ch02-b02
          speaker: telemachus
          text: "父亲受罪二十年才回家，你还不靠近。哪有别的妻子这样？你的心怎么像石头一样硬。"
        - id: ch02-b03
          speaker: penelope
          text: "我惊得都不知道怎么说话了。他要真是奥德修斯，我们总能认出彼此。有些事，只有我们两个知道，可以拿来作凭据。"
        - id: ch02-b04
          speaker: narrator
          text: >-
            奥德修斯笑着让儿子别催，母亲要怎么试，都由她，她总会认出来的。可是眼下还有件大事。杀一个人，就可能得躲开他的亲友，逃到外乡去。如今他们杀的，却是伊萨卡最有势力的一群青年。儿子愿意听父亲安排，只要还有力气，就跟着他。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            大家去洗澡，换身衣服，女仆们也一样。让斐弥奥斯奏舞曲，街上听见，会以为这儿在办婚礼。我们得先到自家的树林里，再商量怎么办。杀人的消息，不能在这以前传出去。
        - id: ch02-b06
          speaker: narrator
          text: "屋里很快响起歌声，男人女人都跳起舞来。外头听见，果然以为王后嫁了别人，怪她不肯再替丈夫守着家产。他们根本不知道里面出了什么事。"
        - id: ch02-b07
          speaker: narrator
          text: >-
            欧律诺墨替奥德修斯洗了澡，抹上油，给他换了干净衣服。雅典娜又让他显得高大强健，头发浓密，卷了起来，肩膀和脖子像银器镀了金，显出光彩。他回来，还是坐在妻子对面。
        - id: ch02-b08
          speaker: odysseus
          text: "我走了二十年才到家，你还是不肯靠近。乳母，另给我铺张床，我一个人睡吧。她的心真是铁做的。"
        - id: ch02-b09
          speaker: narrator
          text: "王后说，自己没有摆架子，也没看不起他。他出征前什么样，自己一直记着。接着，她便吩咐乳母。"
        - id: ch02-b10
          speaker: penelope
          text: "乳母，把他的床搬出来。他自己造的那间卧房里，有他的床。搬到外头，铺上毛皮和被子吧。"
        - id: ch02-b11
          speaker: narrator
          text: "她是在试探，奥德修斯却怒了。"
        - id: ch02-b12
          speaker: odysseus
          emotion: angry
          text: >-
            谁动了我的床？不把它砍断，谁有那么大的力气搬走！院子里有一棵橄榄树，树干粗得像柱子。我就在树周围砌石墙，盖屋顶，安上门，再砍掉枝叶，把扎着根的树干修成床柱。从这根柱子上打孔，才做出整张床来。我镶上金银，绷好红皮革。它还在那儿吧？难道谁把树根砍断了，搬走了床？
        - id: ch02-b13
          speaker: narrator
          text: "佩涅洛佩这才跑来，搂住脖子，一面流泪一面吻他。"
        - id: ch02-b14
          speaker: penelope
          text: >-
            别怪我了。咱们本该年轻时就在一起，一直过到老，神却把咱们分开了这么多年。我总怕有人编故事骗我。海伦要知道阿开亚人会追过去，把她带回来，怎么还会跟外乡男人在一起？是神让她犯错，我们才受了这些苦。可这床，只有你我，还有出嫁时父亲给我的女仆见过。你说得这样清楚，我再也不能怀疑了。
        - id: ch02-b15
          speaker: narrator
          text: |-
            他也哭，紧紧抱住妻子。她好比遇海难的人，拼命游到岸上，脚底终于踩稳，怎么都不肯撒手。

            雅典娜让黑夜继续，曙光没法从大洋升起来，也不能套上给人间带来白天的马。
    - id: ch03
      title: "那趟路还没走"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            过了一会儿，奥德修斯说，眼下还不能过安稳日子。他在冥府见到的忒瑞西阿斯交代过，自己还得走一趟远路，又长又难。不过现在，他想先跟妻子上床歇一歇。佩涅洛佩却要马上听，反正迟早要知道，何必等以后？他不愿提，却还是把话全说了。
        - id: ch03-b02
          speaker: odysseus
          text: >-
            我得扛一支船桨，一直往内陆走，走到那些不知道大海、吃东西不加盐的人那里。有人会把肩上的桨当成扬谷铲。就在那地方，我得把桨插进地里，向波塞冬献公羊、公牛，还有公猪，然后回家，把诸神一个个祭拜过。先知还说，我的晚年会安稳，死的时候也平静，百姓都过着好日子。至于我的死，他说会从海上来。
        - id: ch03-b03
          speaker: penelope
          text: "神若肯给你安稳的晚年，我们就还有盼望，总有能从苦难里歇下的时候。"
        - id: ch03-b04
          speaker: narrator
          text: >-
            那趟远路还没走。乳母和欧律诺墨已经举着火把，铺好了床。乳母先去休息，管事领夫妻进房，也退了出去。两人满心欢喜，在熟悉的婚床上做爱。儿子和牧人则不再跳舞，让女仆也去休息，自己睡在回廊里。
    - id: ch04
      title: "离别的年月"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            亲热过后，两人躺着讲这些年的事。妻子眼看求婚人把房子挤满，杀掉那么多牛羊，喝光那么多酒，不知道有多难过。丈夫讲自己受的罪，也讲给别人造成的苦。妻子不肯睡，要把话全听完。

            他先说劫掠基科涅斯人，到了食莲人的地方。独眼巨人吃掉同伴，他刺瞎了巨人的眼睛。埃奥洛斯招待他，帮他往家开船，风暴却又把船吹离家乡。莱斯特律戈涅斯人毁掉其他船只和船员，只有他这条船逃掉了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            接着说到喀耳刻的法术，还有去冥府见先知、战友和母亲的事。后来是塞壬的歌声，是险礁、卡律布狄斯和斯库拉。船员杀了太阳神的牛，宙斯毁掉船，伙伴全死了。他独自到了卡吕普索的岛，女神留住他，愿意跟他成婚，让他不老不死，他却没答应。又受了许多苦，费埃克斯人才好好招待他，送来黄金、铜和衣服，再用船送他回家。
        - id: ch04-b03
          speaker: narrator
          text: "讲到这里，他才沉沉睡着，暂时放下了悲伤。"
    - id: ch05
      title: "天亮再出门"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            雅典娜等他与妻子相聚，也睡够了，才让黎明到来。他起床叫妻子照管剩下的财物。被吃掉的牲畜，他会去抢别人的，再逼阿开亚人补齐，直到畜栏重新满起来。现在，他要去乡下看父亲。
        - id: ch05-b02
          speaker: odysseus
          text: "一到天亮，消息就传开了。你带着女人留在楼上，不见外人，不要打听。"
        - id: ch05-b03
          speaker: narrator
          text: |-
            他披甲，叫醒儿子和两个牧人，四人拿好武器，开门走，由他在前领路。

            天虽亮了，雅典娜却把他们罩进黑暗，迅速带出城。
