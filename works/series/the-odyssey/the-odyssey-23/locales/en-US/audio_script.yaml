  chapters:
    - id: ch01
      title: News in the Upper Room
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Laughing with delight, Euryclea climbed the stairs to her mistress. She had news that Penelope's beloved husband was home. Joy put new life into the old nurse's knees, and her feet moved nimbly. She reached the bed and leaned over Penelope's head.
        - id: ch01-b02
          speaker: euryclea
          emotion: happy
          text: >-
            Penelope, child, wake up! Come and see what you've waited for all these years. Ulysses really is back. He's killed the men who were making trouble in his house, eating through his property and mistreating his son.
        - id: ch01-b03
          speaker: penelope
          text: >-
            Nurse, you've lost your senses. The gods sometimes take people with perfectly good sense and send them out of their minds. And they can make foolish people sensible. That must be what they've done to you. You were always a reasonable woman before this. Haven't I enough sorrow already? Why torment me with this nonsense? Such a lovely sleep had settled over my eyes and closed them, and now you've woken me. I've never slept so deeply since my poor husband left for that city with its dreadful name. Go back to the women's room. If anyone else had woken me with a foolish story like this, I'd have scolded her sharply and sent her away. Only your age saves you.
        - id: ch01-b04
          speaker: euryclea
          text: >-
            My child, I wouldn't make a joke of this. I'm telling you the truth. Ulysses is here. He was that stranger they treated so cruelly in the cloister. Telemachus knew his father had returned. He kept the secret so his father could punish those wicked men.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Penelope jumped from her couch and wrapped her arms around Euryclea. She was crying with happiness.
        - id: ch01-b06
          speaker: penelope
          text: >-
            But tell me, dear nurse. Suppose he really has returned, just as you say. How could he beat all those terrible men on his own? There were always so many of them.
        - id: ch01-b07
          speaker: euryclea
          text: >-
            I can't tell you how it happened. I wasn't there. All I heard was their groaning as they died. We had shut the doors of the women's room and were crouching together in a corner. Then your son came for me. His father had sent him. When I went out, Ulysses was standing among the dead. Their bodies lay all around him, heaped one over another. You'd have been glad to see him there, spattered with blood and dirt, looking just like a lion. But none of the bodies are lying there now. They've carried them out and piled them all together in the gatehouse, the one in the outer court. Ulysses has lit a great fire. He's using sulphur to purify the house. He told me to bring you down. Come with me, and after everything you've borne, you can be happy together. What you wished for has finally happened. Your husband has come home, and his wife and son are both alive and safe. In his own house he's taken revenge on the suitors who wronged him.
        - id: ch01-b08
          speaker: penelope
          text: >-
            Don't be so sure that it's time to rejoice, nurse. You know how happy his return would make us all. Most of all me, and the son we have together. But your story can't be true. Some god must have been angered by the suitors' wickedness and destroyed them. They had no respect for anyone who came near them, rich or poor, anywhere in the world. Their own wrongs have brought them to this end. Ulysses has died far from the Achaeans' country. He isn't coming home.
        - id: ch01-b09
          speaker: euryclea
          text: >-
            Child, how can you say that? You simply refuse to believe it. You've decided your husband will never return, when at this very moment he's in the house beside his own fire. And you don't have to take my word alone. I can give you another proof. As I washed him, I noticed the scar where the wild boar had wounded him. I wanted to tell you what I'd found. But he was wise enough to stop me, and covered my mouth with both hands so I couldn't speak. Come downstairs. I'll make you this promise. If I've deceived you, have me put to death in the cruelest way you can imagine.
        - id: ch01-b10
          speaker: penelope
          text: >-
            Dear nurse, you may be wise, but even you can't see all the gods' plans. Still, let's go and find my son. I'll look at the suitors' bodies and at the man who killed them.
    - id: ch02
      title: The Sound of a Wedding
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Penelope left her upstairs room. On the way down, she wondered what to do. Should she stay back and question her husband, or go straight to him and put her arms around him? She crossed the stone floor of the cloister and took a seat beside the fire, opposite Ulysses. The wall behind her stood at a right angle to the wall she had come past. He sat by one of the posts that held up the roof, looking down. He was waiting to hear what his brave wife would say when she saw him.

            For a long while, she said nothing. She seemed lost in astonishment. Sometimes she looked straight into his face. Then his ragged clothes confused her again, and she couldn't recognise him. At last Telemachus reproached her.
        - id: ch02-b02
          speaker: telemachus
          text: >-
            Mother! You're so hardhearted I can hardly call you that. Why sit all this way from my father? Go beside him. Talk to him. Ask him what happened. What other woman could stay apart from her husband after twenty years away and all the things he's suffered? But you've always had a heart of stone.
        - id: ch02-b03
          speaker: penelope
          text: >-
            Son, I'm so astonished I can't find anything to say. I can't ask questions or answer them. I can't even look properly at his face. But if this is Ulysses, and he truly has come home, we'll know each other soon enough. We have signs that only the two of us understand, things no other person has ever known. We can recognise each other by those.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Ulysses smiled when he heard that. He turned to his son.
        - id: ch02-b05
          speaker: odysseus
          text: >-
            Your mother can test me in any way she chooses. She'll decide before long. For the moment she won't accept me. With all this dirt on me, and these miserable clothes, she thinks I must be somebody else. But we must think about what comes next. A man who kills one other man has to leave his friends and flee his country. That's true even if the dead man leaves few friends to avenge him. We've killed the men this whole town depended on, the finest young men in Ithaca. Think what that means for us.
        - id: ch02-b06
          speaker: telemachus
          text: >-
            Father, you must decide. Everyone says no one in the world gives wiser advice than you. They say there's no other mortal anywhere who can compare with you. Whatever you decide, we'll follow you, willingly and with all our hearts. We'll do everything our strength allows, and you won't find us failing you.
        - id: ch02-b07
          speaker: odysseus
          text: >-
            Here's what I think we should do. Wash yourselves first and put on your shirts. Send the maids to their rooms to dress as well. Then Phemius must play a dance on his lyre. Anyone listening outside, a neighbour or a person passing in the street, will think there's a wedding here. That should keep word of the suitors' deaths from spreading through town until we've escaped to the woods on my land. Once we reach those woods, we can consider the choices the gods have left us and decide which course would be wisest.
        - id: ch02-b08
          speaker: narrator
          text: >-
            They followed his instructions. The men washed and put on their shirts, and the women dressed. Phemius picked up his lyre. His music made them long for beautiful singing and a stately dance. The steps of men and women echoed through the house. People outside heard them and began talking.
        - id: ch02-b09
          speakers: [townsman_1, townswoman_1, townsman_2]
          ensemble: chorus
          text: >-
            The queen must be marrying at last. Shame on her, giving up on guarding her husband's possessions before he's even come home.
        - id: ch02-b10
          speaker: narrator
          text: >-
            They said this without knowing what had really happened. Inside his own house, Ulysses was washed and rubbed with oil by Eurynome, the chief servant. Then she gave him a shirt and a cloak to put on. Minerva changed his appearance. He looked taller than before and stronger too. His hair grew thick over his head and fell down in curls like hyacinth blossoms. His head and shoulders shone with the beauty she gave him. It was like a fine craftsman gilding a piece of silver. Vulcan or Minerva has taught the man every skill, and everything he makes is beautiful.

            Ulysses came out of the bath looking like an immortal. He returned to the seat he had left, across from his wife.
        - id: ch02-b11
          speaker: odysseus
          text: >-
            Dear wife, the gods have given you a harder heart than any woman ever had. What other wife could stay so far from a husband who's suffered so much and finally returned after twenty years? Nurse, make up a bed for me. I'll sleep by myself. This woman has a heart of iron.
    - id: ch03
      title: The Olive Tree Bed
      blocks:
        - id: ch03-b01
          speaker: penelope
          text: >-
            My dear, I'm not trying to act above you or make you seem less. And the way you look doesn't astonish me. I remember you when you sailed away from Ithaca. I know very well what sort of man you were then. Euryclea, bring his bed out of the bedroom he built himself. Put it outside the room and make it up with fleeces, fine covers and blankets.
        - id: ch03-b02
          speaker: narrator
          text: >-
            She was testing him. Her words made Ulysses furious.
        - id: ch03-b03
          speaker: odysseus
          emotion: angry
          text: >-
            Wife, I don't like what you've just said. Who's moved my bed? Even the cleverest craftsman would have had a hard time, unless a god came to help him shift it. No man alive could move it, however young and strong he was. It's a remarkable piece of work, and I made it with these hands. There was an olive tree growing inside the grounds. It was young and vigorous, with a trunk as thick as a roof post. I built a room around it, put up solid stone walls, roofed them over, and fitted doors that were strong and tight. Then I cut the upper branches off the tree and left the trunk standing. I shaped it roughly, working up from the roots. After that I used my carpenter's tools to work it carefully and well. I drew a line along the wood to keep it straight and made it into a bedpost. I bored a hole down its middle and used it as the central post of the bed. I kept working until the whole bed was finished, inlaid with gold and silver. Then I stretched crimson leather across it from side to side. So I know exactly how that bed was made. Tell me, is it still standing there? Or has someone cut the olive tree off at the roots and carried it away?
        - id: ch03-b04
          speaker: narrator
          text: >-
            Now Penelope had proof she could trust, and she broke down. Crying, she rushed to Ulysses, threw her arms around his neck and kissed him.
        - id: ch03-b05
          speaker: penelope
          text: >-
            Ulysses, don't be angry. You understand more than any other man. We've both suffered. The gods denied us the happiness of spending our young years together, and of growing old beside each other. So please don't be hurt by what I've done. Don't hold it against me that I didn't put my arms around you at once, as I'm doing now. I've been trembling with fear that someone would come and trick me with a lie. There are so many wicked people wandering about. Helen, Jove's daughter, would never have gone to a foreign man if she'd known that the Achaeans' sons would follow and bring her back. The gods put that wrong into her heart. She gave no thought to the sin that brought us all this misery. But you know our bed. You've proved it now. No one has ever seen it except you and me, and one servant, Actor's daughter. My father gave her to me when I married, and she guards the doors of our room. I've found it hard to believe, but I can't doubt you any longer.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Ulysses gave way too. He drew his dear, faithful wife against his chest and wept.

            Think of men struggling towards land after Neptune has smashed their ship with furious winds and waves. Only a few reach the shore. Salt water covers them, and they are thankful beyond measure to stand on firm ground, safe at last. That was how welcome her husband was to Penelope as she looked at him. She couldn't bear to take her lovely arms from his neck. They would have stayed like that, giving way to their grief until rosy-fingered morning came. But Minerva decided otherwise. Far in the west she held back the night. Dawn had to stay at Oceanus. The goddess wouldn't let her harness Lampus and Phaethon, the two horses that carry her forward to bring daylight to the world.
    - id: ch04
      title: The Journey Still to Come
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last Ulysses spoke again.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Wife, our troubles aren't finished. There's more work ahead of me, though I don't know how much. It will be long and hard, and I can't escape it. That was what Teiresias' ghost told me when I went down to Hades to ask about my return and my companions'. But now let's go to bed. We can lie down and enjoy the blessing of sleep.
        - id: ch04-b03
          speaker: penelope
          text: >-
            Go to bed whenever you're ready. The gods have brought you back to your own good home and country. But since they've made you think of this, tell me what still lies ahead. I'll have to hear it sometime. I'd rather know now.
        - id: ch04-b04
          speaker: odysseus
          text: >-
            Dear wife, why make me tell it? But I won't hide it from you. You won't be pleased, and I'm no happier about it. Teiresias told me to take an oar and travel far away. I must keep going until I reach people who've never heard of the sea, people who don't even put salt in their food. They know nothing of ships, or of the oars that are a ship's wings. He gave me a sign I could be certain of, and I'll tell you that as well. A traveller will meet me and ask if I'm carrying a winnowing shovel on my shoulder. Then I must plant the oar in the ground. I must offer Neptune a ram, a bull and a boar. Then I can go home. There I must honour every god in heaven with a hecatomb sacrifice, giving each one their offering in turn. Death, he said, will come to me from the sea. It won't take me roughly. My life will ebb away little by little, very gently, when I've lived to a great age and have peace in my heart. My people will speak their blessings over me. Teiresias said these things were certain to happen to me.
        - id: ch04-b05
          speaker: penelope
          text: >-
            If the gods mean to give you a happier old age, then you can hope for some rest from all this suffering.
        - id: ch04-b06
          speaker: narrator
          text: >-
            While they talked, Eurynome and the nurse carried torches and spread soft covers on the bed. Once it was ready, the nurse went back into the house to rest. Eurynome, who looked after the bedchamber, stayed to lead the couple there by torchlight. She left when she'd brought them to their room. In their own old bed, Ulysses and Penelope joyfully made love.

            Telemachus, Philoetius and the swineherd stopped dancing, and told the women to stop as well. Then they settled down to sleep in the cloisters.

            When the husband and wife had satisfied their longing for each other, they began to talk. Penelope described what she'd suffered, watching their house fill with wicked men. Because of her, those suitors had slaughtered so many sheep and cattle and drunk so many casks of wine. Ulysses told her what he had endured, and the troubles he'd caused other people too. He left nothing out. She was so glad to listen that she stayed awake until he had told the whole tale.
        - id: ch04-b07
          speaker: narrator
          text: >-
            He started with his victory over the Cicons, then his arrival in the rich country of the Lotus-eaters. He described the Cyclops, the brave companions the monster had cruelly eaten, and the punishment he'd given him. Next came Aeolus. He'd welcomed Ulysses and helped him on his way, but home was still out of reach. To Ulysses' great sorrow, a violent storm drove him back out to sea. Then came Telepylos, the Laestrygonians' city. Its people destroyed the other ships and all their crews. They'd destroyed the whole fleet and the men who sailed in it. Only Ulysses and the ship he was aboard had escaped that destruction.

            He told her about Circe's cunning and her magic. He'd sailed to the cold halls of Hades to question the dead prophet Teiresias of Thebes. There he'd seen old friends from the war, and the mother who'd borne him and cared for him as a child. Afterwards he'd heard the astonishing voices of the Sirens. He'd passed the wandering rocks, terrible Charybdis, and Scylla, whom no man had ever passed unharmed. His men had eaten the Sun-god's cattle. Jove struck their ship with thunderbolts for it. The crew died together, and Ulysses alone survived.

            At last he'd reached Ogygia, where the nymph Calypso lived. She'd kept him in a cave and fed him. She wanted to marry him and, if he agreed, give him endless life without old age. She couldn't persuade him to accept it. After further suffering, he'd reached the Phaeacians. They'd treated him as though he were one of the gods. They'd given him gifts in abundance, gold and bronze and clothes to wear. Then they'd put him aboard a ship and sent him back to his own country. That was the last part he told. Deep sleep took him then, and lightened the weight of his sorrow.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Minerva now turned to something else. When she judged that Ulysses had had enough time with his wife and enough rest, she called on gold-throned Dawn to rise from Oceanus and bring light to the world. Ulysses got up from his comfortable bed and spoke to Penelope.
        - id: ch04-b09
          speaker: odysseus
          text: >-
            Wife, we've both had our share of sorrow. You were here mourning my absence. For all those years I was kept from home, even though I was longing to return the whole time. Now that we've finally found each other, look after what's in the house. As for the sheep and goats those wicked men ate, I'll take many from other people by force. I'll make the Achaeans supply the rest until every yard is full again. I'm going out to the wooded farmland to see my father. He's grieved over me for so long. You scarcely need advice, but I'll give you these instructions. As soon as the sun rises, everyone will hear that I've killed the suitors. Go upstairs and stay there with your women. Don't receive anyone, and don't ask questions.
        - id: ch04-b10
          speaker: narrator
          text: >-
            As he spoke, he put on his armour. He woke Telemachus, Philoetius and Eumaeus and told them to arm themselves too. They did as he asked. Ready at last, they opened the gates and went out, with Ulysses ahead of them.

            Daylight had come. Even so, Minerva wrapped them in darkness and quickly led them out of town.
