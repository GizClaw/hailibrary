    claims:
      - "Euryclea reports the homecoming but did not see the fight; Penelope alternates joy and doubt. The son reproaches her; she reserves private proofs."
      - "Odysseus fears avengers and stages music and dancing to suggest a wedding before leaving town. Outsiders wrongly blame Penelope for remarriage."
      - "After a bath, Odysseus still finds his wife distant. Her bed-moving order tests him; he describes the rooted olive-tree bed and she accepts the proof."
      - "Penelope attributes Helen's error to a god and explains fear of deception. Husband and wife embrace and weep, Athena delays Dawn, and the couple later make love in their own bed."
      - "The inland oar journey, stranger's winnowing-shovel mistake, Poseidon sacrifice, return sacrifices, and promised gentle death are still future obligations."
      - "After love, both recount their separated lives, including Odysseus's inflicted as well as endured suffering. At dawn he plans forced replenishment of livestock, leaves his wife upstairs, and goes armed with the three companions toward his father."
