premise: >-
  佩涅洛佩不肯仅凭归来的外貌相信丈夫，以扎根橄榄树的婚床试出真身。 夫妻重享亲密、互述苦难，奥德修斯却仍背负未完成的持桨远行； 天明时，他留下妻子守家，与儿子和牧人披甲出城探父。
characters:
