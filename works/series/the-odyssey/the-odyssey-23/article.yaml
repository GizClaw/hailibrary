  - { id: penelope, description: "因害怕受骗而谨慎试探，最后与丈夫相认的妻子" }
  - { id: euryclea, description: "以亲见归人和摸到旧疤为凭，急切报信的乳母" }
  - { id: telemachus, description: "不理解母亲犹疑，继而服从父亲出城安排的儿子" }
  - { id: eurynome, description: "为归人洗浴、更衣、引夫妻入房的女管事" }
  - { id: phemius, description: "奏出舞曲，让外人误认屋内正在办婚礼的歌者" }
  - { id: eumaeus, description: "与父子一起披甲出城的牧猪人" }
  - { id: philoetius, description: "与父子一起披甲出城的牛倌" }
  - { id: athena, description: "延长团聚之夜，又用黑暗掩护归人出城的女神" }
