audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "measured", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered", pace: "unhurried", pitch: "medium-low"}
    eurymachus:
      display_name: Eurymachus
      tts: {delivery: "smooth and self-assured", timbre: "resonant and polished", pace: "steady", pitch: "medium-low"}
    telemachus:
      display_name: Telemachus
      tts: {delivery: "direct and youthful", timbre: "clear and youthful", pace: "steady", pitch: "medium"}
  chapters:
    - id: ch01
      title: They know him now
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Odysseus got to his feet and dropped the ragged clothes from his shoulders. He stood in the doorway, bow in hand, with his arrows spilled out at his feet.
        - id: ch01-b02
          speaker: odysseus
          text: No more contest.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Antinous lifted his cup. An arrow went through his throat and neck. He fell bleeding, kicked the table over, and sent food and cup across the floor. The others jumped up. Some thought the shot a terrible mistake. Some searched the walls for weapons. There were none. Odysseus faced them from the entrance.
        - id: ch01-b04
          speaker: odysseus
          text: >-
            You counted on my never coming back from Troy. You ate my goods, forced the women to sleep with you, and tried to marry my wife while I was alive. You feared no god or man. Now I'll kill you.
        - id: ch01-b05
          speaker: narrator
          text: They knew him now. Eurymachus spoke quickly, pointing at Antinous.
        - id: ch01-b06
          speaker: eurymachus
          text: >-
            We wronged you, yes, but he started it all. Marriage wasn't what he wanted. He meant to kill your son and rule the island. He's dead now. Let us pay back what we took.
        - id: ch01-b07
          speaker: narrator
          text: Each man would pay the worth of twenty oxen, he said. They would add gold and bronze until Odysseus was satisfied.
        - id: ch01-b08
          speaker: odysseus
          text: >-
            Give me all you have now and all you'll ever have. It won't save you. I'll go on till every one is dead. Fight, or try to run. Nobody will get away.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Eurymachus drew his sword. He told the men to hold tables in front of them and force their way past the bow. Once outside, they could summon help from the town. He rushed forward, but an arrow stopped him before he reached Odysseus. Amphinomus tried next. Telemachus drove a spear into him from behind. The son couldn't risk taking time to pull it out. He ran back to his father.
        - id: ch01-b10
          speaker: telemachus
          text: We have to get the armor.
        - id: ch01-b11
          speaker: odysseus
          text: Hurry, then.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Odysseus held the entrance alone while Telemachus fetched equipment for all four of them. The two herdsmen took their shields, helmets, and spears. When the arrows ran out, Odysseus rested the bow against the wall and armed himself the same way.
    - id: ch02
      title: The storeroom door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            There was a side door into a narrow passage. Odysseus put Philoetius there to guard it, since one man could hold the way. Agelaus wanted someone to slip outside and call the town. Melanthius said the passage came too close to the guarded entrance. He would fetch arms instead. Now Odysseus saw new weapons among the suitors and turned to his son. The goatherd knew the back passages and had reached the storeroom.
        - id: ch02-b02
          speaker: telemachus
          text: I didn't close the door. I'm to blame.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Eumaeus saw Melanthius going for more weapons. Odysseus ordered the herdsmen to bind his hands and feet behind him and hang him near the rafters. He wanted him alive and in pain. Father and son held off the men while they went. The herdsmen waited by the storeroom door, caught Melanthius coming out, and pulled him back by his hair. They tied him and hauled him up as ordered. Eumaeus mocked him. What a soft bed he had now. He would know when morning came and he should bring the goats. They left him suffering and shut the door. Back in the hall, the four still faced many enemies, holding just a strip of floor in Odysseus's own home.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Mentor appeared, or someone with his face and voice. Odysseus knew it was Athena. Agelaus threatened to kill this ally after father and son, take his property, and drive out his children and widow. The goddess stayed. She challenged Odysseus to show his courage from Troy. Then she turned into a swallow on a beam. She would help, but not give them victory before they had proved themselves.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Six spears flew together. Athena sent them into doors, posts, and walls. Each defender killed a man, then pulled his spear free. Most of the second volley missed too. Amphimedon grazed Telemachus's wrist. Ctesippus cut Eumaeus's shoulder above the shield. Neither gave way. Philoetius speared Ctesippus in the chest. Here was his return gift for that ox's hoof, he told him. Agelaus and Leocritus fell with others. Furniture lay overturned, and men searched for a way out. Athena raised the deadly aegis. They panicked and ran, but there was no escape. Odysseus and his men struck them down until blood covered the floor.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Leiodes held Odysseus's knees. He had never harmed the women, he pleaded, and had tried to stop the others. Must he die just for serving as their priest? Odysseus said their priest must have prayed to keep him away and hoped to marry his wife and have children with her. He took Agelaus's fallen sword and cut Leiodes's head off before he finished speaking.
    - id: ch03
      title: Two men are spared
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Not every man there had come willingly. Phemius laid his instrument down and knelt before Odysseus. The suitors had forced him to sing, he said. He hadn't chosen to entertain them. Let Telemachus tell his father whether that was true.
        - id: ch03-b02
          speaker: telemachus
          text: >-
            Please spare him. He hasn't tried to hurt our family. And Medon was kind to me when I was little. If he's still living, let him go as well.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Medon heard his name. He came from under the covering where he had hidden near a seat while the fighting went on around him. He appealed to Telemachus, then anxiously waited for the father's answer. Odysseus sent both herald and singer outside. They hurried to the courtyard, frightened even though he'd spared them. The king walked through the hall, searching for anybody concealed or still able to stand. Blood stained his skin and clothes. He stepped round the long tables that had once held the feasts. Then he told his son to fetch Euryclea.
    - id: ch04
      title: The women bring lights
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Euryclea came into the hall and saw the result of the fighting. Her master had won. Relief swept over the old nurse, and she was on the point of shouting for joy when Odysseus stopped her.
        - id: ch04-b02
          speaker: odysseus
          text: Keep your joy to yourself. Don't shout over the men who have died here.
        - id: ch04-b03
          speaker: narrator
          text: >-
            He said the gods and the men's own wrongdoing had destroyed them. Then he asked which women were innocent and which had behaved badly. Euryclea counted fifty in the household. Twelve, she said, had slept with suitors and disrespected her and Penelope. They hadn't disobeyed Telemachus. Only recently had his mother let him give them orders. She wanted to wake Penelope, but Odysseus wouldn't allow it yet.

            Odysseus called his son and the herdsmen. They must make these twelve women carry out the dead and wash the furniture. When that was finished, they were to lead them outside and kill them with swords, so their secret lovemaking with the suitors would end. The women came down crying and wailing. Odysseus drove them to work quickly. They took the bodies to the gatehouse and cleaned the chairs and tables. While the men scraped blood and dirt off the floor, the women carried it out of doors.

            Then the three men penned them in a narrow enclosure. Telemachus wouldn't use swords as his father ordered. He said they didn't deserve a clean death after insulting him and his mother and sleeping with these men. He fixed a ship's rope high enough to keep their feet off the ground and hanged all twelve. Their feet struggled a little, then stopped.

            They dragged Melanthius to the inner court. They cut his ears, nose, and genitals off and gave the genitals to the dogs raw. Then they chopped off his hands and feet. He died that way. The men washed and went indoors. Odysseus called for fire and sulfur to cleanse the hall. The nurse offered clean clothing, but he wanted the room dealt with first. Smoke spread through the places where men had feasted and fought.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The loyal women came in with lights. They had heard of his return and gathered around him. They held his hands and touched his shoulders, looking for the master they remembered after so many years away.
        - id: ch04-b05
          speaker: narrator
          text: He knew every one of those faces. For so long he had forced himself to hold everything back. Now, with the women around him, Odysseus almost began to cry.
