audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    suitor_shouting_1:
      display_name: 第一名叫喊的求婚人
      tts: {delivery: "强硬激动", timbre: "浑厚粗厉", pace: "急切", pitch: "中低音"}
    suitor_shouting_2:
      display_name: 第二名叫喊的求婚人
      tts: {delivery: "强硬激动", timbre: "明亮尖锐", pace: "急切", pitch: "中音"}
    suitor_shouting_3:
      display_name: 第三名叫喊的求婚人
      tts: {delivery: "强硬激动", timbre: "粗粝而有共鸣", pace: "急切", pitch: "低音"}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    agelaus:
      display_name: 阿革拉奥斯
      tts: {delivery: "强势地讲道理", timbre: "清楚坚定", pace: "沉稳", pitch: "中音"}
    melanthius:
      display_name: 墨兰提奥斯
      tts: {delivery: "傲慢轻蔑", timbre: "粗硬", pace: "利落", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "诚恳热心", timbre: "粗粝温厚", pace: "从容", pitch: "低音"}
    philoetius:
      display_name: 菲洛伊提奥斯
      tts: {delivery: "忠实坦率", timbre: "浑圆而有风霜感", pace: "稳重", pitch: "低音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定清楚", timbre: "清晰稳定", pace: "舒缓", pitch: "中音"}
    leiodes:
      display_name: 勒奥得斯
      tts: {delivery: "思虑而克制", timbre: "柔和微哑", pace: "沉稳", pitch: "中音"}
    phemius:
      display_name: 斐弥奥斯
      tts: {delivery: "诚恳清楚", timbre: "悦耳温润", pace: "舒缓", pitch: "中音"}
    medon:
      display_name: 墨冬
      tts: {delivery: "熟稔务实", timbre: "质朴清楚", pace: "轻快", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切坚定", timbre: "苍老温暖", pace: "沉稳", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "新的靶子"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥德修斯把破衣扯掉，带弓和满满的箭囊，跳上宽敞的石地，箭一倾，散在脚下。
        - id: ch01-b02
          speaker: odysseus
          text: >-
            比弓这场大事，结束了。我要射个新靶，以前没人射过。看阿波罗准不准我打中。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他瞄着安提诺奥斯。安提诺奥斯把两柄金杯拿到手里，正准备举杯喝酒，一点也没想过会死。这里这么多饮酒的人，谁会相信一个人再勇，也敢孤身站出来杀他？箭却已经穿入咽喉，从脖子另一端透出。他倒下，杯子掉落，鼻孔里浓血直流。脚一踢，桌子翻了，面包烤肉撒到地面，弄得脏污不堪。
            一个人中箭，满屋乱起来。求婚人惊叫着离座，向四壁到处寻找，矛没有，盾也没有，便愤怒地冲奥德修斯责骂。
        - id: ch01-b04
          speakers: [suitor_shouting_1, suitor_shouting_2, suitor_shouting_3]
          ensemble: chorus
          emotion: angry
          text: >-
            外乡人，射箭杀人，要你偿命！还想比下一场？你活不成了。你杀的是伊萨卡最好的青年，秃鹫会把你吃光！
        - id: ch01-b05
          speaker: narrator
          text: >-
            他们还当他失了手，根本不知道自己也在死亡下面。奥德修斯瞪住他们。
        - id: ch01-b06
          speaker: odysseus
          text: >-
            狗东西！你们以为去了特洛伊，我就回不来？我的财富让你们吃掉，女仆让你们逼着同床，我没死，你们就争娶我妻子。神和人，你们谁也不放在眼里。如今一个也别想活！
        - id: ch01-b07
          speaker: narrator
          text: >-
            恐惧让每个人脸色发白，四下找逃路。欧律马科斯独自说了话。
        - id: ch01-b08
          speaker: eurymachus
          text: >-
            若真是奥德修斯，你骂得没错。家里、田里，我们坏事做了不少。可领头作恶的安提诺奥斯已死，这一切都是他干的。他并不怎么想娶王后，打的是别的算盘，要杀你儿子，自己当伊萨卡的首领，宙斯才没让他如愿。他已遭报，请饶乡人的命。我们会凑齐，把吃喝用掉的全补给你。每人另赔二十头牛的价，再给金、给铜，直到你息怒。没赔完前，你生气谁都无话可说。
        - id: ch01-b09
          speaker: narrator
          text: >-
            奥德修斯仍旧狠狠盯着他。
        - id: ch01-b10
          speaker: odysseus
          text: >-
            现在有的，将来还能有的，你们全给我，也挡不住我这只手。每一个我都要清算。要活就打，或者逃。可是逃路，一个人也没有。
        - id: ch01-b11
          speaker: narrator
          text: >-
            求婚人的心彻底沉下去。欧律马科斯向同伴喊话。
        - id: ch01-b12
          speaker: eurymachus
          text: >-
            他谁也不会放过，站在那儿就能把我们射光。拿剑，用桌子当盾挡住箭，一齐冲！把他推出门口、推离石地，就能逃进城大声求援，让他射不下去。
        - id: ch01-b13
          speaker: narrator
          text: >-
            青铜剑两面开刃，欧律马科斯拔出来，大叫着扑上去。奥德修斯马上射他，箭从乳头边穿进胸膛，扎到肝脏。剑掉在地，他腰一折，扑到桌上，杯子和肉全滚下来。临死的痛让他额头撞地，脚把凳子踢来踢去，最后眼睛黑了，闭上。
            安菲诺摩斯也执剑冲来，想迫使奥德修斯离开门。忒勒马科斯更快，背后一矛，从双肩之间透过胸。他砰地倒下，额头打着地面。年轻人不敢停下拔矛，怕别的阿开亚人会拿剑砍他，或把他撞翻。他跳开，矛留在尸体里，自己跑回父亲身旁。
        - id: ch01-b14
          speaker: telemachus
          text: >-
            父亲，我去拿盾、两支矛，再拿铜盔护头。我也穿盔甲，两个牧人也给装备，还是大家都武装起来妥当。
        - id: ch01-b15
          speaker: odysseus
          text: >-
            赶快，我还有箭。等箭没有，独自在门口，我就可能守不住。
        - id: ch01-b16
          speaker: narrator
          text: >-
            忒勒马科斯照父亲的吩咐奔到库房，那里放着他们收起的武器。他挑出四面盾、八支矛，又拿四顶铜头盔，每顶都有马鬃的冠饰。他尽快拿着这些返回，先替自己披挂起来。牧猪人和牧牛人也穿戴好，来奥德修斯身边就位。父亲只要还有箭，就不断向求婚人逐个射击。他们一个接一个倒下，尸体越压越多。等最后的箭用光，他把弓竖靠在屋子尽头的墙壁，旁边便是门柱。他往肩上挂一面四层兽皮制成的盾，精制的头盔扣在俊美的头上，顶端马鬃前后晃着，看上去十分凶猛。双手中又握起两支带铜尖的强矛。
    - id: ch02
      title: "储藏室的出入口"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            墙上有一扇活门，石地一端又有条窄过道，结实的门挡着出口。奥德修斯让菲洛伊提奥斯守在那里，一次只能一个敌人冲来。阿革拉奥斯叫其他人。
        - id: ch02-b02
          speaker: agelaus
          text: >-
            赶快，谁上活门那里告诉城里人？有人援助，我们马上就能制住他，停掉他的弓箭！
        - id: ch02-b03
          speaker: melanthius
          text: >-
            阿革拉奥斯，这招不行。窄过道的口贴着外院入口，太险，一个厉害的人就能拦住再多人。我知道该怎么办，去库房拿兵器。他们父子一定把东西藏在那儿。
        - id: ch02-b04
          speaker: narrator
          text: >-
            墨兰提奥斯沿宅后通道去取来十二套盾和盔，十二支矛，飞快分给求婚人。奥德修斯看见敌人披甲挥矛，心里发虚，知道险情严重了。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            有女人从里面在帮他们，忒勒马科斯。或者，是墨兰提奥斯。
        - id: ch02-b06
          speaker: telemachus
          text: >-
            父亲，都怪我，没别人错。库房门是我忘了关，敌人比我警醒。欧迈奥斯去锁好，再看看谁干的。女人，还是我猜的那个，多利奥斯之子墨兰提奥斯？
        - id: ch02-b07
          speaker: narrator
          text: >-
            墨兰提奥斯又要取武器，欧迈奥斯正好望见，便告诉身边主人。
        - id: ch02-b08
          speaker: eumaeus
          text: >-
            拉厄尔忒斯高贵的儿子，就是那恶棍，果然在往库房走。你吩咐吧，我若抓住，是杀掉，还是带到这里，让你亲手惩罚他在家里做的罪行？
        - id: ch02-b09
          speaker: odysseus
          text: >-
            我跟儿子挡住他们，你们两个去。让他的手脚反到后头，绑紧，丢进库房，把门关牢。再套根绳吊起身子，挂高柱，直到挨着屋顶椽木。叫他在苦里多熬一会儿。
        - id: ch02-b10
          speaker: narrator
          text: >-
            两人进去时，墨兰提奥斯还在深处翻找，没发现。他们左右堵门等着。随后他一手盔、一手旧盾，走了过来。盾是拉厄尔忒斯年轻时候用的，扔掉许多年，干得腐烂，连皮带缝线也散了。两位牧人扑住他，揪头发拖回去，把挣扎的他摔倒，胳膊腿扭到背后，照主人的话紧捆，痛得厉害。然后用绳套住身体，从高柱往上吊，直到贴近椽木。欧迈奥斯在下面嘲弄。
        - id: ch02-b11
          speaker: eumaeus
          text: >-
            墨兰提奥斯，今晚软床给你享受，正是该得的。等黎明从俄刻阿诺斯的水上来，你准看得清楚，到时别忘赶山羊，让求婚人开饭！
        - id: ch02-b12
          speaker: narrator
          text: >-
            墨兰提奥斯就这样吊着，忍受残酷的绳结。两个牧人穿甲、关门，回主人身边，四人满怀怒气站在廊里。不过院中对手还很多，也还有胆量。
            宙斯的女儿雅典娜这时出现，外表和声音都是门托尔。奥德修斯一见十分高兴。
        - id: ch02-b13
          speaker: odysseus
          text: >-
            门托尔，帮帮我！我们老朋友了，我替你做过多少事，你别忘。我俩还是同岁的人。
        - id: ch02-b14
          speaker: narrator
          text: >-
            心里，他却知道这是雅典娜。求婚人看见她就喊，头一个是阿革拉奥斯。
        - id: ch02-b15
          speaker: agelaus
          text: >-
            门托尔，别听奥德修斯的，别来跟我们作对。父子俩杀完，就轮到你，我们要你的头！你一死，屋内屋外所有东西，跟奥德修斯的一起归我们分。你的儿女休想在家里住，你的寡妻也别想待在伊萨卡城！
        - id: ch02-b16
          speaker: narrator
          text: >-
            雅典娜更加恼火，严厉地骂起奥德修斯。
        - id: ch02-b17
          speaker: athena
          emotion: angry
          text: >-
            奥德修斯，为海伦在特洛伊打九年仗时的本事，到哪里去了？那时你杀多少敌人，还用计拿下普里阿摩斯的城。怎么现在站自己家、自己土地，面对这些人，反而差这么远？过来，跟我站好，看阿尔基摩斯之子门托尔如何帮你，回报你以前的恩情。
        - id: ch02-b18
          speaker: narrator
          text: >-
            女神还没打算把完全的胜利送他，她要再看父子俩到底多勇敢。于是她变作燕子，飞上回廊屋顶的一根椽木，停在那里。
    - id: ch03
      title: "长矛与神盾"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            求婚人那一边主战的，是达马斯托尔之子阿革拉奥斯、欧律诺摩斯、安菲墨冬、得摩普托勒摩斯、庇珊德罗斯，还有波吕克托尔之子波吕波斯。其余已经中箭倒下，这几个人是在求活的众人里最勇的。阿革拉奥斯号令他们。
        - id: ch03-b02
          speaker: agelaus
          text: >-
            朋友们，他很快就没法再逞强。门托尔只吹牛，没帮忙就走了，现在门边几个人没援助。别一窝蜂全投，先六个人出手，杀了奥德修斯，名声就是你们的。他没了，其他人算什么？
        - id: ch03-b03
          speaker: narrator
          text: >-
            长矛掷来，雅典娜使它们都没中。一支扎门柱，一支碰门板，一支尖头打在墙上。奥德修斯四人躲过这一轮，他便叫伙伴们回击。
        - id: ch03-b04
          speaker: odysseus
          text: >-
            朋友，朝他们当中投吧。要不他们害我们这么久，到头来还把命拿去！
        - id: ch03-b05
          speaker: narrator
          text: >-
            四人正面掷矛，奥德修斯杀掉得摩普托勒摩斯，儿子杀掉欧律阿得斯，欧迈奥斯杀掉厄拉托斯，菲洛伊提奥斯杀掉庇珊德罗斯。四具身体倒下，剩下的人退到角落。他们就扑去，从尸身拔回兵器。
            又一轮敌人的长矛来了，雅典娜仍让大多无用，落到廊柱、门扇和墙上。但安菲墨冬擦破忒勒马科斯腕上的皮，克忒西波斯的矛越过盾，擦中欧迈奥斯肩，才落地。四人再向人群掷出，奥德修斯中了欧律达马斯，忒勒马科斯中了安菲墨冬，欧迈奥斯中了波吕波斯。牧牛人随后一矛进克忒西波斯胸前，还向他回敬了一番话。
        - id: ch03-b06
          speaker: philoetius
          text: >-
            波吕忒尔塞斯的坏嘴儿子，以后别傻到乱讲恶话。把嘴交给诸神管，他们比人强得多。我送你这条忠告，算回你以前那份礼，那只你丢给奥德修斯的牛蹄。他当时是在自己的家要饭啊。
        - id: ch03-b07
          speaker: narrator
          text: >-
            奥德修斯近身击中达马斯托尔的儿子，忒勒马科斯把矛刺入欧厄诺尔之子勒奥克里托斯腹内，穿透了，他脸冲下倒地。雅典娜在梁上亮起致命的神盾，求婚人的胆一下没了。他们逃去院子另一头，像初夏最长的日子里，被牛虻叮得乱窜的牛。
            山里秃鹫，爪子弯钩、嘴像鹰，向地上瑟缩成堆的小鸟俯冲。小鸟既跑不了，又斗不过，只能任它们啄杀，旁边看的人倒觉得好玩。这四个男人也像秃鹫，四面追杀。求婚人头颅挨打，脑浆击碎，惨叫呻吟，血在地面翻涌。
    - id: ch04
      title: "求饶的人"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            勒奥得斯抱住奥德修斯膝头，苦苦恳求。
        - id: ch04-b02
          speaker: leiodes
          text: >-
            请放我一命，奥德修斯。我没用言语、也没用行动害过你家的女人，还劝过其他人别做。看他们胡来，我就劝，可他们不听，今天才得下场。我是给他们主持献祭的，杀我，就是杀无辜，好事做了也得不着报偿。
        - id: ch04-b03
          speaker: narrator
          text: >-
            奥德修斯冷厉地望着他。
        - id: ch04-b04
          speaker: odysseus
          text: >-
            既是祭司，那就一定祈求过许多次，要我不要回家，好自己娶我妻子，让她给你生孩子。那你还是该死。
        - id: ch04-b05
          speaker: narrator
          text: >-
            阿革拉奥斯临死掉下的剑就在地上。奥德修斯捡起来，朝勒奥得斯的后颈砍下。他还在说话，头便滚在尘埃里。
            忒尔佩斯的儿子斐弥奥斯也在想保住命。他就是让求婚人逼着唱歌的歌人，手抱里拉琴，在活门旁边站着。不知该跑到外院宙斯的祭坛坐下，还是直接来抱奥德修斯的膝。那祭坛上，主人和拉厄尔忒斯献过不少牛腿骨。最后，他选了后一个办法，把琴放在调酒缸和银钉座椅之间，自己走来，双手抱住主人的膝。
        - id: ch04-b06
          speaker: phemius
          text: >-
            饶命，奥德修斯。像我这样既能向神、又能向人歌唱的，杀掉你会后悔。我自己编每一支歌，神又赐我种种灵感。我也会像歌颂神那样为你唱，不要急着砍头。问问儿子就知道，我不想来给这些人饭后助兴，实在是他们多、他们强，逼我才如此。
        - id: ch04-b07
          speaker: narrator
          text: >-
            忒勒马科斯听到，立即走上前。
        - id: ch04-b08
          speaker: telemachus
          text: >-
            父亲，先停！他没有做错，不可杀。墨冬也要留，他待小时候的我一直很好。但愿两位牧人还没杀他，你在院里杀得怒起时，他也还没遇上你。
        - id: ch04-b09
          speaker: narrator
          text: >-
            墨冬也听见了。他躲在座椅底下，身上盖着新剥的小母牛皮，蜷着身体。这时掀开牛皮，赶来抱忒勒马科斯的腿。
        - id: ch04-b10
          speaker: medon
          text: >-
            我在这儿，公子，别动手，快告诉你父亲。他因为家产被吞，因为这些人愚蠢地不把你当回事，发了大怒，会顺手把我杀掉。
        - id: ch04-b11
          speaker: narrator
          text: >-
            奥德修斯朝墨冬微笑。
        - id: ch04-b12
          speaker: odysseus
          text: >-
            不用怕，儿子替你保了性命。记住，往后也说给别人听，行善比作恶的结果好得多。你和歌人一起出去，到回廊外的院里，避着这些杀戮，等我把屋里的事情办完。
        - id: ch04-b13
          speaker: narrator
          text: >-
            两个人赶紧离开，坐在宙斯那大祭坛边，还惊恐地左右看，依然害怕会被杀。奥德修斯走遍整个院落，仔仔细细搜，看有没有活人藏着。没有了，求婚人都躺在土和血中，挤得一具压一具。渔夫撒网，鱼被拉上海滩，嘴张着求水，最后给太阳烤死。他们的样子就像那些鱼。
    - id: ch05
      title: "清洗与火光"
      blocks:
        - id: ch05-b01
          speaker: odysseus
          text: >-
            忒勒马科斯，把乳母叫出来，我还要跟她说几件事。
        - id: ch05-b02
          speaker: narrator
          text: >-
            儿子来到女眷的门外，敲着门。
        - id: ch05-b03
          speaker: telemachus
          text: >-
            老乳母，你掌管这里的女仆，快来，父亲找你说话。
        - id: ch05-b04
          speaker: narrator
          text: >-
            欧律克勒娅开闩，跟他出来，看到奥德修斯站在一片死人之间，浑身血污。好像狮子刚吃过一头牛，两边脸和胸前沾满鲜血，望着令人害怕。奥德修斯从脚到头就是那样。乳母看见尸体、看见血，知道大事终于成功，忍不住要高声欢呼，主人马上拦下。
        - id: ch05-b05
          speaker: odysseus
          text: >-
            老人家，乐在心里就够了，别叫，收一收。死人面前夸耀，神不喜欢。上天判了他们，也有他们自己做的坏事。他们谁都不敬，穷人富人来到跟前，统统受到冒犯。愚昧又作恶，才得如此报应。现在你告诉我，女人里哪些有罪，哪些没做错事？
        - id: ch05-b06
          speaker: euryclea
          text: >-
            孩子，我会把自己知道的实情告诉你。家里一共五十名女人，我们教她们如何梳理羊毛，也教她们做各式各样的家务。其中有十二个行为不规矩，不尊重我，也不尊重佩涅洛佩。她们倒没有冒犯忒勒马科斯，因为他才刚刚成年，他母亲以前也从不准他吩咐女仆做事。可是先让我到楼上去，把这里发生的一切报给你妻子。一定有哪位神使她睡着，直到现在还没有醒来。
        - id: ch05-b07
          speaker: odysseus
          text: >-
            让她先睡。叫那做过坏事的女仆，都到我这里来。
        - id: ch05-b08
          speaker: narrator
          text: >-
            乳母去传召。奥德修斯另对儿子和两个牧人吩咐。
        - id: ch05-b09
          speaker: odysseus
          text: >-
            先把死的抬出，让她们帮忙。清水和海绵拿来，桌子椅子洗干净。整条回廊收拾好，就把女人带去圆顶屋和外院墙夹着的地方，用剑刺死，直到没有活的，叫她们把爱情、把偷偷跟求婚人睡觉的事，忘得干净。
        - id: ch05-b10
          speaker: narrator
          text: >-
            女人们哭喊着一齐下来，先搬运尸体，运到门房，靠着彼此叠放。主人一直催她们，必须快做，她们就不断抬出去。接着用水和海绵擦净桌椅。三名男人把地上的血污用铲弄起，女人再拿到屋外扔掉。
            全部整理干净，女人们被带到圆顶屋墙和院墙之间，窄窄地圈住，没法逃。忒勒马科斯向两人说。
        - id: ch05-b11
          speaker: telemachus
          text: >-
            她们跟那些人睡，还冒犯我和母亲，我可不会让她们死得干净。
        - id: ch05-b12
          speaker: narrator
          text: >-
            忒勒马科斯找来船上的缆绳，固定在一根撑住圆顶屋的柱子上，再环着建筑扎牢。绳子安得够高，任何一个女人的脚都踩不到地面。鸫鸟、鸽子原本正要回自己的巢，谁知灌木里已有人布下网，它们撞进去，徒然拍打着，等待的是可怕的死。眼前女人也如此，一个又一个被迫把头伸入绳套，遭受悲惨的死亡。她们的脚还抽动了片刻。只是片刻，很快便停了。
            墨兰提奥斯被拉过回廊，到了内院。他们把鼻子耳朵切掉，再掏出内脏，生生给狗吃，还满怀怒气，砍下他的手和脚。
            一切完结后，他们洗好自己的手脚，回到屋里。奥德修斯又吩咐他亲爱的老乳母。
        - id: ch05-b13
          speaker: odysseus
          text: >-
            欧律克勒娅，取硫黄和火来，硫黄能除污，我要烧它，把回廊净一净。再去请佩涅洛佩和她身边的侍女，也把其他女仆一起请来。
        - id: ch05-b14
          speaker: euryclea
          text: >-
            你说的自然都对，只是先换衣裳吧。我去拿干净的贴身衣和披风，总这么一身烂布穿着，可不适宜。
        - id: ch05-b15
          speaker: odysseus
          text: >-
            先把火给我生起来。
        - id: ch05-b16
          speaker: narrator
          text: >-
            欧律克勒娅照他的吩咐，把火和硫黄带到跟前。奥德修斯烧起硫黄，把回廊一处处熏净，内院、外院也都完全净除污秽。事情做完，老乳母才走进内屋，召集女仆，把刚才发生的经过告诉她们。女仆们离开自己的房间，手中举着火把，来到主人身旁。她们围上来抱住奥德修斯，亲他的头，亲他的两边肩膀，还握住他的手。见到这一张张面孔，他心里也涌起要流泪的感觉。从前这些女人，每一个他都还记得。
