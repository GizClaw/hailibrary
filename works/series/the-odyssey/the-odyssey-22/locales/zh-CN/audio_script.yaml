audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
  chapters:
    - id: ch01
      title: 他回来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            安提诺奥斯还握着杯子，门边的人已经站起身。奥德修斯脱去破衣，把箭倒在脚下，举弓守着入口。
        - id: ch01-b02
          speaker: odysseus
          text: 试弓，到此为止。
        - id: ch01-b03
          speaker: narrator
          text: >-
            安提诺奥斯举杯要喝，箭却已穿进他的喉咙。他倒地时血涌出来，脚把桌踢翻，杯盘和肉滚满地。求婚人跳起，有人大声责骂，以为老人射错了目标。有的人伸手去摸从前一直挂在墙上的兵器，手里却空空的，一件盾、一支矛也没找到。
        - id: ch01-b04
          speaker: odysseus
          text: >-
            你们当我不能从特洛伊回来，就吃我的财物，逼屋里的女人陪你们睡，我还活着，就想娶我的妻子。神和人你们都不怕，现在全得死！
        - id: ch01-b05
          speaker: narrator
          text: 大家终于明白他的身份，再不能把门口这人当作讨饭的乞丐。欧律马科斯急着伸手，指向地上的安提诺奥斯。
        - id: ch01-b06
          speaker: eurymachus
          text: >-
            我们做错了，可全是他带头。他不在乎娶妻，想杀掉你儿子，统治伊萨卡。现在他死了，让我们赔。每人拿值二十头牛的东西，再献金和铜，直到你满意。
        - id: ch01-b07
          speaker: odysseus
          text: "你们现在有的、将来有的，全拿来，也挡不住我。我要杀光你们。打也好，跑也好，谁都别想逃。"
        - id: ch01-b08
          speaker: narrator
          text: >-
            欧律马科斯拔剑，叫众人用桌子挡箭，一起冲出去，再找城里的人帮忙。他先冲，却先中箭，没能跑到门边。安菲诺摩斯又扑上来，想从旁边突破。忒勒马科斯从他身后刺出长矛，没工夫拔回，便跑向父亲。
        - id: ch01-b09
          speaker: telemachus
          text: 我们需要盾牌和铠甲。
        - id: ch01-b10
          speaker: odysseus
          text: 赶快拿来。
        - id: ch01-b11
          speaker: narrator
          text: >-
            儿子去取武器，父亲一个人拦住入口。等铠甲、盾牌和长矛拿来，两名牧人也把自己保护好，拿着武器，站到父子身边。等箭用完，奥德修斯把弓放在墙边，拿上长矛和盾。
    - id: ch02
      title: 没关好的门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            侧门外有条窄过道，奥德修斯叫牛倌去守，一个人就能堵住。阿革拉奥斯想派人出去，叫城里人帮忙。墨兰提奥斯说，过道挨着有人守的入口，太险了，不如他去取兵器。随后，奥德修斯看见对面也有了盾和矛，才知道牧羊人走熟悉的通道，偷偷搬了储藏室的东西。
        - id: ch02-b02
          speaker: telemachus
          text: 门没关，是我忘了。这件事怪我。
        - id: ch02-b03
          speaker: narrator
          text: >-
            欧迈奥斯看见他又要搬，奥德修斯叫两个牧人反捆他的手脚，吊到梁下，故意让他慢慢痛苦。两人守在门旁，等他出来，便抓着头发拖回去，捆好吊起。欧迈奥斯笑他睡上了软床，明天一定知道何时该赶羊来。两人锁门回去，留下活着受刑的墨兰提奥斯。父子守住入口，敌人还很多，四个人只能守着自家门前这块地方。
        - id: ch02-b04
          speaker: narrator
          text: >-
            门托尔的面孔和声音出现了，奥德修斯却知道是雅典娜。阿革拉奥斯威胁，杀掉父子，还要杀他，夺财物，把子女遗孀赶出家门和城。女神更生气，反问奥德修斯，他在特洛伊的勇气哪里去了？她变成燕子落上梁，还不肯送来胜利，要考验父子能不能撑住。
        - id: ch02-b05
          speaker: narrator
          text: >-
            六支矛齐来，被雅典娜引到墙、门和柱子上。守门四人各杀一个，再拔回矛。第二回敌人的矛大多仍不中，安菲墨冬却擦伤少主的手腕，克忒西波斯划破牧猪人盾牌上方的肩。两人不退。牛倌一矛刺中克忒西波斯的胸，告诉他，这便是回送那只牛蹄的礼物。阿革拉奥斯、雷奥克里托斯等人接着死去。女神举起可怕的埃癸斯，敌人乱跑，门却关上了。四人追杀他们，地上全是血。
        - id: ch02-b06
          speaker: narrator
          text: >-
            雷奥德斯抱住奥德修斯的膝，求他饶命。他说自己没在话语或行动上伤过女人，还尝试拦住旁人。难道替他们主持祭祀，就必须死？奥德修斯却说，为求婚人祭祀，便一定祷告自己不能回家，盼娶自己的妻子，跟她生育。他捡起阿革拉奥斯落下的剑，雷奥德斯还来不及说完，就被砍掉了头。
    - id: ch03
      title: 儿子替他们求情
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            也有一些人，原本就不愿参加那些宴席。斐弥奥斯放下乐器，跪着解释，唱歌是被求婚人逼的，忒勒马科斯知道。
        - id: ch03-b02
          speaker: telemachus
          text: >-
            留他一命吧，他没想伤害我们。还有墨冬，我小时候他就照顾我。他要是还在，也别杀他。
        - id: ch03-b03
          speaker: narrator
          text: >-
            墨冬一直在座位附近躲着，身上盖了东西。他听到少主的话，便从下面钻出，求忒勒马科斯救命，再等父亲答应。奥德修斯让歌者和传令官出去，到院子里避开杀戮。两人急忙往外走。虽已答应饶命，他们仍怕有人跟来杀他们。
    - id: ch04
      title: 灯光照见旧面孔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            奥德修斯在厅里走了一遍，看有没有活人藏着，或是还能站起来。他满身血污，得绕开以前用来摆宴席的长桌。随后，他叫儿子带乳母过来。欧律克勒娅走进来，终于看清了大厅里的情形。主人胜了，她几乎要高声欢呼起来。
        - id: ch04-b02
          speaker: odysseus
          text: 人已经死了，别在他们旁边欢呼。
        - id: ch04-b03
          speaker: narrator
          text: >-
            奥德修斯说，是神的裁断，也是这些人自己的恶行，把他们送到这种结局。随后他问起家里的女人，哪些做过坏事，哪些清白。乳母说，总共五十个女仆，十二人私下跟求婚人睡觉，对她和王后也不尊敬。她们倒没违抗少主，因为直到最近，王后一直不让儿子给女仆下命令。乳母想上楼叫醒王后，奥德修斯还不答应。

            他让儿子和两个牧人，先逼十二个女人搬走死人，擦洗桌椅。等全做完，再带到外面窄处，拿剑杀她们，结束她们和求婚人的私情。女人们哭着走来，奥德修斯催她们快干。她们把尸体送进门房，擦干净桌子椅子，再把男人从地上铲起的血污，一点点运出屋。

            等一切洗净，三人带她们到窄处，围住出口，不让谁能逃掉。忒勒马科斯拒绝父亲用剑的安排。他说，这些女人侮辱过自己和母亲，又同求婚人睡觉，不配有干净的死法。他把船缆系得很高，让脚够不着地，将十二个人吊了起来。她们脚还挣扎一会儿，随后便静了，全死了。

            墨兰提奥斯又被拖到内院。三人割掉鼻子、耳朵和生殖器，把生殖器生着给狗吃，又砍掉手脚。他就这样死去。他们洗手脚，回屋。奥德修斯要硫磺和火，把厅里熏过。乳母拿干净衣服，他先要她管屋子。烟经过方才饮宴和杀人的地方。
        - id: ch04-b04
          speaker: narrator
          text: >-
            忠于主人的女仆听说了消息，提灯进来。她们围到奥德修斯身边，握住他的手，碰他的肩膀，仔仔细细地看他。多年没见，她们正认着记忆里的那个主人。
        - id: ch04-b05
          speaker: narrator
          text: 那些脸，他全都认得。这一次，奥德修斯的眼泪险些落下来。
