audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    leiodes:
      display_name: 雷奥德斯
      tts: {delivery: "谨慎而诚恳", timbre: "轻而清晰", pace: "平缓", pitch: "中音"}
    phemius:
      display_name: 斐弥奥斯
      tts: {delivery: "恳切而急迫", timbre: "清亮", pace: "清楚而有起伏", pitch: "中音"}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: "亲切坚定", timbre: "苍老温暖", pace: "沉稳", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "他不是乞丐"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "奥德修斯扯掉破衣，带着弓箭跳到门口。他把箭倒在脚边。"
        - id: ch01-b02
          speaker: odysseus
          text: "比试结束了。"
        - id: ch01-b03
          speaker: narrator
          text: >-
            安提诺奥斯正举杯要喝，箭就射穿了他的喉咙。他倒下去，血涌出来，脚踢翻了桌子，杯子和食物滚了一地。其他人全跳起来，有人以为老人射错了，大声骂他，有人去找挂在墙上的武器，却一件也没找到。奥德修斯瞪着他们。
        - id: ch01-b04
          speaker: odysseus
          text: >-
            你们以为我从特洛伊回不来了，就拿我的东西吃喝，逼我家里的女人陪你们睡。我还没死，你们就想娶我的妻子。神和人，你们都不怕。现在全得死。
        - id: ch01-b05
          speaker: narrator
          text: "他们知道了他的身份。欧律马科斯急忙指向安提诺奥斯。"
        - id: ch01-b06
          speaker: eurymachus
          text: >-
            我们做错了，可都是他带的头。他不在乎婚事，想杀了你儿子，自己统治伊萨卡。现在他死了，让我们赔吧。每人拿出值二十头牛的财物，再给你金子和铜，直到你满意。
        - id: ch01-b07
          speaker: odysseus
          text: "现在有的、将来有的，全拿出来也不行。我非杀光不可。你们打也好，逃也好，一个都活不了。"
        - id: ch01-b08
          speaker: narrator
          text: >-
            欧律马科斯拔出剑，叫大家拿桌子挡箭，一起冲开门口，到外面找城里人帮忙。他先冲过去，也先被箭射倒了。安菲诺摩斯跟着扑来，忒勒马科斯从背后把矛刺进他身体，来不及拔出来，便跑回父亲身边。

            儿子要去取盔甲和盾牌，父亲催他赶快，自己守在门口，一箭接一箭地射，直到四个人的武器都送来。欧迈奥斯和菲洛伊提奥斯也披上甲，站在父子一边。等箭全用完，奥德修斯才把弓靠在墙上，换了盾和长矛。
    - id: ch02
      title: "储藏室的门"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            奥德修斯又让牛倌守住侧门。外面的过道很窄，一个人就能挡住进攻。阿革拉奥斯想派人溜出去，找城里人来帮忙。墨兰提奥斯却说，过道离有人守着的入口太近，不如自己去拿武器。

            没过多久，求婚人也有了盾牌和长矛。牧羊人熟悉后面的通道，偷偷进储藏室，把武器搬了出来。
        - id: ch02-b02
          speaker: telemachus
          text: "父亲，是我忘了关门。怪我。"
        - id: ch02-b03
          speaker: narrator
          text: >-
            欧迈奥斯看见墨兰提奥斯又往储藏室走。奥德修斯让两个牧人去，把他的手脚反捆起来，吊到屋梁边，留着命慢慢受苦。自己和儿子继续对付敌人。

            两名牧人在库门旁等着，见他出来，就揪住头发拖回去，捆紧手脚，吊在梁下。欧迈奥斯还嘲笑他睡上了软床，说到明早，他就知道该什么时候赶羊来给求婚人吃了。两人把库门关上，回到大厅，留下牧羊人活着受刑。

            敌人还是比他们多得多。奥德修斯在自己家中，却只能守着门前这点地方。

            这时，他们看见门托尔的面貌，也听见他的声音。奥德修斯知道，是雅典娜来了。阿革拉奥斯扬言，杀了父子之后，还要杀这个帮手，抢走财产，把他的儿女和遗孀赶出家门、赶出城。女神更生气了，问奥德修斯，他在特洛伊时的勇气去哪儿了？随后，她变成燕子，落在梁上。她还要考验父子，不肯立即让他们打赢。

            六支矛一齐飞来，被雅典娜引到了门、柱子和墙上。守门的四个人各杀了一人，又从尸体上拔回自己的矛。第二轮大半又落空了，可安菲墨冬擦伤了少主的手腕，克忒西波斯划破了欧迈奥斯盾牌上方的肩膀。

            牛倌把矛刺进克忒西波斯胸口，说这是回送那只牛蹄的礼物。阿革拉奥斯、雷奥克里托斯等人也接连倒下。女神举起埃癸斯，求婚人吓得在屋里到处逃，可门已经关紧了。奥德修斯和同伴追杀过去，地上到处是血。
    - id: ch03
      title: "谁得到饶命"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "雷奥德斯抱住奥德修斯的膝，跪地求饶。"
        - id: ch03-b02
          speaker: leiodes
          text: "我从来没伤害过屋里的女人，还拦过别人。难道替他们主持祭礼，也得送命吗？请饶了我吧。"
        - id: ch03-b03
          speaker: odysseus
          text: "你替他们祭神，一定盼我回不来，好娶我的妻子，同她生孩子。"
        - id: ch03-b04
          speaker: narrator
          text: "他拿起阿革拉奥斯落地的剑，雷奥德斯话还没说完，头就被砍了下来。歌者斐弥奥斯也放下琴，跪着求他留下自己的命。"
        - id: ch03-b05
          speaker: phemius
          text: "那些歌不是我想唱，是他们逼我。忒勒马科斯能作证。"
        - id: ch03-b06
          speaker: telemachus
          text: "不要杀他，他没害我们。还有墨冬，我小时候他一直照顾我。只要没死，也请饶他。"
        - id: ch03-b07
          speaker: narrator
          text: >-
            墨冬躲在座位旁，身上盖着东西。他听见这话，就钻出来求救，等主人决定。奥德修斯终于让歌者和传令官去外院。他们赶紧离开，虽说已经饶了命，还是怕有人追出来杀他们。

            主人满身血污，在厅里一处处找，看有没有人还活着，或藏了起来。摆宴席的桌子挡着路，他得绕过去走。随后，他叫儿子把乳母带来。
    - id: ch04
      title: "十二个女人"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "乳母见主人打赢，差点欢呼起来。奥德修斯拦住她，让她别对着死去的人欢呼。他说，死者会有这个下场，是神定的，也是他们自己作恶招来的。随后，他问女仆里谁有罪，谁清白。"
        - id: ch04-b02
          speaker: euryclea
          text: >-
            五十个女仆里，有十二个跟求婚人私通，她们既不尊重我，也不尊重夫人。倒没有违抗过少主，因为直到最近，夫人还不让他管她们。我想去叫醒夫人。
        - id: ch04-b03
          speaker: narrator
          text: >-
            奥德修斯暂且不准。他让儿子和牧人，逼十二个女人先搬死者，洗净桌椅，再带去外面窄处，用剑杀死，结束和求婚人的私情。她们哭着来，被他催着干活，搬尸体到门房，洗家具，把男人铲起来的血污运出去。

            洗完了，三人把她们赶到狭窄的地方，围得无路可逃。忒勒马科斯却不肯照父亲的话用剑杀。他说，这些人骂过自己和母亲，又同求婚人睡觉，不配死得干净。他把船缆系在高处，让这些女人的脚够不着地，绞死了十二个人。她们的脚挣扎了一会儿，就不动了。

            儿子和牧人又把墨兰提奥斯拖到内院，割去鼻子、耳朵和生殖器，生殖器给狗生吃，接着砍掉手脚。墨兰提奥斯丢了命。三人洗过手脚，回到屋里。主人要硫磺和火熏屋，乳母想先拿干净衣裳，他坚持先熏。烟升起来，经过刚才吃喝和杀人的地方。

            还活着的女仆听说主人回来，提着灯围到他身边，握住他的手，碰着他的肩膀，要认一认这张多年没见的脸。
        - id: ch04-b04
          speaker: narrator
          text: "他认出了每一张脸。"
        - id: ch04-b05
          speaker: narrator
          text: "这一次，奥德修斯差点掉下眼泪。"
