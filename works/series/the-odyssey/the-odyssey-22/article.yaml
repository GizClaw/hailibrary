schema_version: 1
id: the-odyssey-22
titles:
  en-US: "The Doors Are Shut"
  zh-CN: "门已经关上"
style: epic-fantasy-illumination
research: required
labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
premise: >-
  奥德修斯在大厅表明身份，拒绝求婚人的赔偿，以儿子和两名忠仆为援夺回家宅。
  储藏室未关的失误使敌人得到武器。墨兰提奥斯被吊起受刑，随后遭肢解而死。
  父亲听取儿子求情，赦免被迫唱歌的斐弥奥斯和照顾过儿子的墨冬；十二女仆先被迫清场，
  父亲命用剑杀，儿子却改为绞死。幸存女仆举灯与主人相见。
characters:
  - { id: odysseus, description: "在家中表明身份、率领反击并决定谁能获赦的国王。" }
  - { id: telemachus, description: "承认储藏室失误并为歌者和传令官求情，却拒绝父亲用剑杀女仆的方案、改为绞死她们的儿子。" }
  - { id: antinous, description: "第一个中箭倒下的求婚人首领。" }
  - { id: eurymachus, description: "先试图以赔偿求生，继而率先冲向门口的求婚人。" }
  - { id: eumaeus, description: "协助守门和截住叛徒的忠诚养猪人。" }
  - { id: philoetius, description: "与养猪人并肩协助主人的牛倌。" }
  - { id: melanthius, description: "为求婚人搬运武器，被吊起受刑、后来遭肢解杀死的牧羊人。" }
  - { id: athena, description: "以门托尔与燕子的形象帮助父子的神话女神。" }
  - { id: phemius, description: "被迫为求婚人唱歌，得到忒勒马科斯作证的歌者。" }
  - { id: medon, description: "曾照料忒勒马科斯、躲过厮杀并获赦的传令官。" }
  - { id: euryclea, description: "见证家宅被夺回、指认仆人并协助清理的老乳母。" }
