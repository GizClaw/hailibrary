required: true
sources:
  - url: "https://www.gutenberg.org/ebooks/1727"
    authority: "Project Gutenberg catalogue, ebook 1727"
    claims:
      - "The consulted Butler translation of Homer's Odyssey is public domain in the USA."
  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XXII"
    claims:
      - "Odysseus shoots Antinous, accuses the suitors of consuming his goods, forcing the women to sleep with them, and courting his living wife. Eurymachus blames Antinous and offers compensation; Odysseus refuses all possible payment."
      - "Eurymachus and Amphinomus are killed. Telemachus fetches arms but leaves the storeroom open; Melanthius supplies the suitors. The side passage is guarded, and the goatherd is suspended alive in pain on Odysseus's order."
      - "Athena tests the defenders, deflects spears, and raises the aegis. Telemachus's wrist and Eumaeus's shoulder are grazed. Philoetius kills Ctesippus as repayment for the hoof."
      - "Leiodes pleads innocence and is beheaded while speaking. Phemius and Medon are spared at Telemachus's intervention."
      - "Euryclea identifies twelve of fifty women. Odysseus orders forced cleanup followed by sword killing; Telemachus rejects a clean death and hangs the twelve instead."
      - "Melanthius is mutilated in his nose, ears, what Butler calls vitals, and limbs. The house is cleansed with sulfur, and the surviving women greet Odysseus; the Greek lexical source below resolves the organ wording."
  - url: "https://atlas.perseus.tufts.edu/nodes/urn:cts:greekLit:tlg0012.tlg002.perseus-grc2:22.476/"
    authority: "Tufts Perseus / Scaife ATLAS, Odyssey 22.476, Greek text with LSJ/Cunliffe lexical evidence for μήδεα"
    claims:
      - "The mutilated organ is the male genitals. This edition corrects the ambiguous Butler word vitals to genitals / 生殖器, matching the Greek rather than introducing intestines."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute"
    claims:
      - "The Odyssey is an ancient twenty-four-book Greek epic traditionally attributed to Homer."
notes:
  - "2026-10-11: task-scoped HaiLibrary reading prose, not Butler's verbatim text or an unabridged edition. Classic / Homer is retained. The complete saved Butler Book XXII at git commit 1208d108 supplies the comparison; the coordinating author checked the Greek organ term separately."
  - "Condensed boundaries: repeated body-damage similes, precise armor lists, every minor combatant and kill, architectural measurements, and repeated exhortations. The actors and sequence of each principal death, torture, mercy, female-servant punishment and cleanup are explicit."
  - "Claim classification: the killings are literary events, divine aid is declared myth, and the claims concerning women are attributed to Odysseus, Euryclea, or Telemachus. The original tension between the forced-sex accusation and punishment for sexual betrayal is preserved, not resolved by invented consent or innocence findings."
  - "Responsibility continuity: the father orders swords, the son chooses hanging; the herdsmen execute the goatherd's torture with the father's earlier order; no vague generic servant punishment replaces the twelve deaths. Euryclea says the women had not disobeyed the son; he nonetheless accuses them of insulting him."
  - "Phemius and Medon leave alive; Penelope remains asleep and is not brought to witness the executions. Fire and sulfur are the story's ritual, not a household disinfection recommendation. No footnotes or modern translation is retained. Media bytes are unchanged."
