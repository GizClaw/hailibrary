schema_version: 1
id: the-odyssey-16
style: epic-fantasy-illumination
research: required
labels: {topics: [adventure, travel], themes: [perseverance, identity], moods: [reflective]}
premise: >-
  荷马史诗第十六卷的阅读整理。忒勒马科斯在牧猪人的茅屋与父亲相认；
  两人商量如何隐去归来的消息并面对求婚人。城里的敌人另谋杀机，佩涅洛佩当面质问，
  茅屋则在看似如常的晚餐中保存父子共同的秘密。
characters:
  - {id: odysseus, description: "终于向儿子说明身份的归乡父亲，制定隐忍与夺回家园的计划"}
  - {id: telemachus, description: "从惊疑走向相认，也能向父亲提出不同判断的儿子"}
  - {id: eumaeus, description: "护送消息并真心关怀少主、仍不知客人身份的牧猪人"}
  - {id: athena, description: "安排相认并暂时撤去、恢复乞丐外貌的女神"}
  - {id: penelope, description: "得知儿子平安后，直接质问谋害他的求婚人"}
  - {id: antinous, description: "伏击失手后谋划在陆上杀人的求婚人"}
  - {id: amphinomus, description: "要求先问神意，暂缓杀害忒勒马科斯的求婚人"}
  - {id: eurymachus, description: "口头许诺保护少主、实际参与阴谋的求婚人"}
titles:
  en-US: "A Father in the Doorway"
  zh-CN: "茅屋里的父亲"
locales:
