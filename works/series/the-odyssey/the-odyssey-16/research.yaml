notes:
  - "Task-scoped user exception to classic's verbatim-import default: preserve classic and Homer / 荷马 authorship while writing a HaiLibrary reading retelling. The complete Book XVI at git 1208d108 and the live Gutenberg edition provide plot evidence. Neither locale is Butler's translation or a literal Chinese rendering, and metadata does not label it with a misleading source_url / translator claim."
  - "Retained: dogs' welcome; Eumaeus's embrace; proposed protection of the stranger; only-son isolation; private message to Penelope; Athena's unseen visit and transformation; initial disbelief, reunion and tears; Phaeacian arrival and hidden gifts; numerical disadvantage; agreed concealment and removal of weapons; the son's objection; simultaneous news in town; renewed conspiracy; the queen's challenge and false reassurance; restored disguise and shared secret at supper."
  - "Retained tactical and political specifics: 52 / 24 / 20 / 12 suitors, totaling 108, with six Dulichian servants, Medon, the bard and two carvers; Athena's prompt and the nod, smoke and drunken-quarrel excuses, one sword and spear each plus two shields; trial of the women now and proposed postponement of the distant men; murder before an assembly, threatened exile, division of land with the house for the queen and new husband, and Antinous's alternative of courting from home."
  - "Retained moral choices: the father's preference for lethal resistance and denunciation of indecent abuse of enslaved women; Amphinomus would personally kill and encourage the others if Zeus approved; Antinous's father's Taphian raid against friendly Thesprotians; Eurymachus's assurance, divine-death caveat and concealed complicity. Condensed: Arceisius's additional ancestral name, repeated oath formulas, the long similes for weeping, exact meal service and minor messenger / assembly choreography."
  - "The twenty-year interval refers to absence from Ithaca, including war and travel, not twenty years of postwar wandering."
  - "Divine visibility, transformation and protection belong to the myth. The planned weapon removal remains a narrative event without added practical tactics."
  - "Amphinomus's objection is conditional on divine signs, not an invented absolute rejection of murder. Eurymachus's promise is expressly deceptive, and Eumaeus does not claim certainty about the ship he sees."
