    claims:
      - "Eumaeus welcomes Telemachus; the stranger questions his inability to resist the suitors; Eumaeus is sent to tell Penelope that her son is safe."
      - "Athena changes Odysseus's appearance, allowing father and son to recognize each other; they discuss the suitors' numbers, divine assistance, concealment, weapons and testing the household."
      - "Telemachus objects to spending too much time testing distant servants while the suitors consume the estate."
      - "The failed ambushers return; Antinous proposes another murder attempt; Amphinomus requires divine approval; Penelope rebukes Antinous and receives a deceptive assurance from Eurymachus."
      - "Athena restores the disguise before Eumaeus can recognize Odysseus; the swineherd gives an uncertain report of an armed ship; father and son keep their secret."
