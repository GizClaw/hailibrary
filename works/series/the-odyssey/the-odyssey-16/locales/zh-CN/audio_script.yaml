audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: 沉着而机敏, timbre: 沧桑清楚, pace: 从容而有变化, pitch: 中低音}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: 亲切直率, timbre: 温厚沧桑, pace: 舒缓, pitch: 中低音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    telemachus_messenger:
      display_name: 船上报信的仆人
      tts: {delivery: 平实恭敬, timbre: 清楚轻亮, pace: 自然, pitch: 中音}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: 圆滑自信, timbre: 圆润清楚, pace: 平稳, pitch: 中音}
    amphinomus:
      display_name: 安菲诺摩斯
      tts: {delivery: 坦诚而深思, timbre: 温润清晰, pace: 稳健, pitch: 中音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: 深思而克制, timbre: 清晰温润, pace: 舒缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 棚屋里的重逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            天亮时，奥德修斯与牧猪人已生了火，正在棚子里备早饭，帮手都出去放猪了。忒勒马科斯一来，狗却不叫，亲热地迎着他。奥德修斯听到脚步，又见狗不吠，便开口说。
        - id: ch01-b02
          speaker: odysseus
          text: |-
            欧迈奥斯，有人走过来了。狗这么讨好，大概是你的帮手，或者哪个熟人吧。一声都没叫呢。
        - id: ch01-b03
          speaker: narrator
          text: |-
            话还没落，儿子已站到门口。欧迈奥斯跳起来，调酒的碗从手里掉了，自己却奔向少主人，亲他的头，亲两只漂亮的眼睛，欢喜得流泪。

            那样子，就像一个老来得子的父亲，唯一的儿子离开十年，在外国吃尽苦头，终于回家。父亲再怎么开心，也不过如此。欧迈奥斯紧抱着青年，亲了又亲，仿佛把人从死者中迎回来一样，满怀疼爱地说话。
        - id: ch01-b04
          speaker: eumaeus
          emotion: happy
          text: |-
            忒勒马科斯，我眼里的光，你真的回来了！听说去了皮洛斯，我还以为再也看不见你。快进屋，好孩子，坐下让我仔细看看。你不常到乡下看我们这些牧人，总在城里。想必觉得，要守在那里，看着求婚人的动静吧。
        - id: ch01-b05
          speaker: telemachus
          text: |-
            是啊，老朋友。但我今天想来看你，也问问母亲。她还在家里吗？还是嫁给别人，把奥德修斯的床空下，没了被褥，结起蛛网？
        - id: ch01-b06
          speaker: eumaeus
          text: |-
            她没走，仍待在家中。伤心都要把她折碎了，白天哭，夜里也哭，总不停。
        - id: ch01-b07
          speaker: narrator
          text: |-
            说着，他接过青年手中的矛。忒勒马科斯跨过石头门槛，走进屋。奥德修斯起来想让座，却被他拦住。
        - id: ch01-b08
          speaker: telemachus
          text: |-
            客人，不必起身。我另外坐就行，这里有人替我安排。
        - id: ch01-b09
          speaker: narrator
          text: |-
            奥德修斯坐了回去。欧迈奥斯在地上垫些青枝，再铺羊皮，给青年作座位。接着端来前一天剩的冷肉，把面包篮赶快装满，用常春藤木碗调好酒，自己坐在奥德修斯对面。大家吃喝饱了，忒勒马科斯才问。
        - id: ch01-b10
          speaker: telemachus
          text: |-
            老朋友，这客人是什么地方来的？船员都是谁，怎样把他带到伊萨卡？当然，他不会是沿着陆地走来的。
        - id: ch01-b11
          speaker: narrator
          text: |-
            欧迈奥斯，你这位牧猪人，给了他这样的答复。
        - id: ch01-b12
          speaker: eumaeus
          text: |-
            孩子，我全照实说。他告诉我，他是克里特人，走过很多地方。现在刚从忒斯普罗提亚的船逃出来，藏到我这儿。我把人交给你，怎么处置都听你的。不过要记得，他来是请你保护的。
        - id: ch01-b13
          speaker: telemachus
          text: |-
            这真叫我难办。我怎么接他进家？年纪还轻，有谁来动手，我也挡不住。母亲正犹豫，惦着丈夫，顾着旁人的议论，想留下管家。可又想，是不是该选个最好的求婚人，谁给的礼最多，就嫁谁。

            不过既然他投到你这里，耐穿的内衣、披风，我会送来，再给剑和鞋，想往哪里去，也送他去。你愿意留下他的话，我提供衣服、食物，不让你和帮手多受负担。唯独不能往求婚人那里带。他们太坏，必定欺负客人，我见了要难受。单独一个人再能打，也敌不了一大群。
        - id: ch01-b14
          speaker: odysseus
          text: |-
            少主人，请让我也说几句。你这样的人被他们欺侮，我听着很吃惊。是你甘愿忍，还是神把民众变成你的敌人？兄弟怎么不帮忙？再大的争端，做兄弟的也该支持啊。

            真愿我能保有如今的心志，却像你一样年轻。若我是奥德修斯的儿子，或是他本人，哪怕脑袋让人砍掉，也要走进那屋子，除尽他们。就算他们人多，我一个应付不了，我也宁可在家战死。总好过天天眼见来客被辱，女仆被拉来拖去，酒随便舀，面包白白浪费，就为了一个永不会实现的目的。
        - id: ch01-b15
          speaker: telemachus
          text: |-
            我把缘由告诉你。百姓没有和我结仇，也不是兄弟不相助。人有难，本该能靠兄弟，可宙斯让我们家代代只有一个儿子。阿尔刻西奥斯只有拉厄尔忒斯，拉厄尔忒斯只有奥德修斯，我又是父亲的独子。他出门留下我，我没能替他做过任何事。

            所以一群强徒占了家。附近岛上的首领都来了，有杜利基翁的，有萨墨的，有扎金索斯的。伊萨卡的头面人物也一样，借求婚吃掉我家的东西。母亲既不拒绝，又不下决心，他们就一直毁家产，不久还会毁掉我。最后怎样，得看上天。

            欧迈奥斯，老朋友，你马上去找佩涅洛佩。告诉她，我从皮洛斯平安回来了。只说给她，别让旁人知道，然后就回来。打主意害我的人很多。
        - id: ch01-b16
          speaker: eumaeus
          text: |-
            我明白，会听你的，不用再说。不过既然走这条路，要不要顺便看拉厄尔忒斯，给他报个信？老人从前虽担忧奥德修斯，也还管田庄，想吃喝时，就跟仆人一起。可听说你去皮洛斯以后，他不肯好好吃饭喝酒，农事也放下了。只顾哭，肉都快从骨头上瘦光。
        - id: ch01-b17
          speaker: telemachus
          text: |-
            老人真可怜，我也伤心。但眼下，先让他独自待着吧。人若要什么有什么，我最想要的就是父亲回来。你先去把信送到，快些返回，别绕路找他。让母亲悄悄派一个女人，马上去说，他就知道了。
    - id: ch02
      title: 父亲终于归来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            欧迈奥斯拿鞋，系在脚上，动身进城。等他已离牧场很远，雅典娜才过来。她变成一位美丽、端庄又聪慧的女人，站在门边，向奥德修斯显露。儿子却看不到，也不知道她在这里，神并不让每个人都看见。狗倒是看见了，不敢叫，呜咽着退去院子的另一头。

            她点头，眉毛一动示意。奥德修斯走出棚屋，来到院外大墙旁，站到她面前。
        - id: ch02-b02
          speaker: athena
          text: |-
            拉厄尔忒斯的高贵儿子，现在该告诉儿子你的身份了。把真相说给他，别再瞒着。你们商量好除掉求婚人的办法，就往城里走。我很快会来，也等不及要加入这场战斗了。
        - id: ch02-b03
          speaker: narrator
          text: |-
            雅典娜一边说，一边用金杖碰他。先给肩头披了漂亮洁净的内衣、披风，再让他变年轻，显得更有威严。脸色恢复，两颊饱满，连胡子也重新黑了。女神随后走了，奥德修斯回屋。忒勒马科斯惊得移开目光，怕眼前是一位神。
        - id: ch02-b04
          speaker: telemachus
          emotion: fearful
          text: |-
            客人，你怎么变成这样？才一转眼，穿的不一样，脸色也不一样了。你是哪位天神吗？若真是，请待我好些，让我有机会献合适的祭品，送精工打造的金器。请怜悯我。
        - id: ch02-b05
          speaker: odysseus
          text: |-
            我不是神啊，为什么这样想？我就是你的父亲。你为了我伤心，也因为我，受那帮无法无天的人欺凌。
        - id: ch02-b06
          speaker: narrator
          text: |-
            他说着亲了儿子。一滴泪从脸上落到地面，在这之前，他一直没让自己哭。忒勒马科斯还是不信。
        - id: ch02-b07
          speaker: telemachus
          text: |-
            你不是父亲。是神给我虚假的盼头，好叫我以后更难受吧？没人能靠自己忽老忽少，除非有神帮助。刚才还是破衣服裹着的老人，现在就像天上下来的一位神了。
        - id: ch02-b08
          speaker: odysseus
          text: |-
            忒勒马科斯，我真的到了，不用惊讶成这样。以后不会再来另一个奥德修斯。无论你看见我什么样，眼前就是你父亲。我流浪那么久，吃了那么多苦，第二十年才回到自己的国土。让你不解的变化，是雅典娜的本事。那位强大的女神想怎么改我，就怎么改。上一刻是乞丐，下一刻便成了体面穿戴的青年。天上的神要一个人显得富有或贫穷，容易得很。
        - id: ch02-b09
          speaker: narrator
          text: |-
            他坐下，忒勒马科斯搂住父亲，哭了起来。两人都忍不住放声痛哭，像弯爪的鹰或秃鹫，羽毛还未长齐的幼鸟被农人夺走，只能哀鸣。若不是儿子突然问话，他们恐怕要一直哭到太阳下山。
        - id: ch02-b10
          speaker: telemachus
          text: |-
            父亲，什么船把你送来？船员说他们是哪一国的？你肯定没法从陆地走到伊萨卡呀。
        - id: ch02-b11
          speaker: odysseus
          text: |-
            孩子，是费埃克斯人。他们很会航海，惯常护送来到海岸的旅客。我睡得沉，他们就带着我越海，把我送上伊萨卡。还送了很多青铜、黄金、衣物。有上天照顾，如今都藏在洞里。雅典娜叫我到这儿，跟你合计怎样杀掉仇人。

            先把求婚人的名字和数目告诉我。弄明白都是谁、多少人，再想想，咱们两个够不够，还是必须添些援手。
        - id: ch02-b12
          speaker: telemachus
          text: |-
            父亲，你在战场和议事时的名声，我向来听人称道。但这事太大，想想都怕。两人怎能敌一群勇士？他们不只是十个、二十个，是很多倍啊。我报给你听，杜利基翁来了五十二个优秀青年，带六个仆人。萨墨二十四，扎金索斯二十个年轻阿开亚人，本岛十二个，都是好出身。另外还有仆人墨冬，一个歌人，两个切肉的侍者。这么多人，恐怕会叫你后悔回乡报仇的。再想一想，能找谁来帮忙？
        - id: ch02-b13
          speaker: odysseus
          text: |-
            那你听听，雅典娜和她父亲宙斯，这两位够不够帮我们？还是还得去找别人？
        - id: ch02-b14
          speaker: telemachus
          text: |-
            当然是好帮手。他们虽然高在云端，可神和人，都由他们掌管。
        - id: ch02-b15
          speaker: odysseus
          text: |-
            交起手来，他们不会让咱们在家里独战太久。明天一早，你先回去，在求婚人中间照常来往。稍后欧迈奥斯会带我进城，我还是可怜的老乞丐模样。你看见他们侮辱我，千万忍住。就是拖住脚把我拉出屋，或者朝我扔东西，也不能出手。顶多轻声叫他们守规矩。他们不会肯听的，清算的时刻就要到了。

            还有，牢记我的话。等雅典娜启发我，我就向你点头。你看见，就把家里所有武器、铠甲收好，藏进坚固的库房。他们问缘故，就找个借口，说防止烟熏。父亲走时东西不是这样，如今已让烟尘弄得又黑又脏。尤其要说，怕宙斯让他们喝酒吵起来，彼此弄伤，宴席也丢脸，求婚也丢脸。武器放在眼前，有时人就想用。

            但咱们各自的一把剑、一支矛，要留下，再留两面牛皮盾，随时拿得到。宙斯和雅典娜会很快叫他们闭嘴。再有一件，你若真是我儿子，身上流着我的血，谁也别告诉。拉厄尔忒斯、欧迈奥斯、所有仆人，连佩涅洛佩都不能知道我已回到家里。女仆咱们自己考察，也试一试别的男仆，看看忠于谁，谁跟我们作对。
        - id: ch02-b16
          speaker: telemachus
          text: |-
            父亲，等你多了解我一些，就知道我守得住秘密。可是刚才那办法，恐怕不全有利。逐个田庄跑，去试男仆，要耗掉多少时间？这当中求婚人照样随意花家产，既不知羞，也不用受罚。女仆可以查，谁不忠，谁没有过错，分清楚。但走遍牧场考察男仆，我不赞成。若真有宙斯相助的征兆，那些以后再办也行。
    - id: ch03
      title: 船只回港后的密议
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            他们谈着，载忒勒马科斯从皮洛斯回来的船也到了城里。进港后，众人拖船上岸，仆人接走铠甲，礼物全放在克吕提奥斯家。他们派一个仆人去找佩涅洛佩，说儿子下乡去了，船已送来，不用担惊受怕。

            报信人恰好遇见欧迈奥斯，两个人是为同一件事去的。到了王家，船上来的仆人站起来，当着侍女，对王后说。
        - id: ch03-b02
          speaker: telemachus_messenger
          text: |-
            夫人，您的儿子已经从皮洛斯回来了。
        - id: ch03-b03
          speaker: narrator
          text: |-
            欧迈奥斯却凑近女主人，悄悄把她儿子交代的全说了。随后离开正屋、附屋，回自己的猪群那里去。

            求婚人得知消息，又惊又恼，到外院大墙的外面，在正门边商议。波吕波斯的儿子欧律马科斯先说话。
        - id: ch03-b04
          speaker: eurymachus
          text: |-
            朋友们，忒勒马科斯这一趟，真把事情弄严重了。我们以为他办不成，结果却这样。赶紧把船推下水，找些船员去通知其余同伴，叫他们尽快回来。
        - id: ch03-b05
          speaker: narrator
          text: |-
            这话刚说完，安菲诺摩斯转头，就看见那条船进了港，船员正在落帆、收桨。他笑着招呼大家。
        - id: ch03-b06
          speaker: amphinomus
          text: |-
            不必通知，都来了。可能有神报过信，或是他们看见船过去，却没追上。
        - id: ch03-b07
          speaker: narrator
          text: |-
            一伙人起身往水边去。船员把船拖上岸，让仆人接下武器，随后大家一同到集会场。除了他们，老的少的，谁也不许在这里坐下。欧佩忒斯的儿子安提诺奥斯首先开口。
        - id: ch03-b08
          speaker: antinous
          text: |-
            看，诸神竟救了他！我们一整天在海角轮班盯守，天黑也不上岸去睡，整夜耗在船里，等到早上，想逮住杀掉他。可神偏把他送回来了。

            得另想办法，这人一定要除。只要活着，我们的事就难成。他聪明，百姓又不全帮咱们。行动要快，赶在他开阿开亚大会以前。他正在气头上，不会耽搁，一定把我们谋杀又没捉到人的事说给所有人。民众听完能高兴？咱们得防着，别被人害，别被逐出国家，成了流亡者。

            要不就在城外田庄抓他，或守住他进城的路。杀了以后，大家分财物，屋子留给母亲和新丈夫。不想这么干，非要让他活着，保住父亲的家产，那我们就不能再聚在这里白吃白喝了。各自回去求婚，让她嫁给给得最多、又命里该娶她的那个。
        - id: ch03-b09
          speaker: narrator
          text: |-
            众人没作声，直到安菲诺摩斯起来。他父亲是尼索斯，祖父是阿瑞提阿斯王。他在杜利基翁来的求婚人中领头，那岛小麦丰收，牧草也好。佩涅洛佩最喜欢听他说话，胜过别人，因为他本性温厚。他直率地说明自己的意思。
        - id: ch03-b10
          speaker: amphinomus
          text: |-
            朋友们，我反对杀忒勒马科斯。杀贵族后人，是大恶事。先问神吧。如果宙斯的神谕赞成，我亲自帮着杀，也会让大家加入。可若神说不许，我劝所有人收手。
        - id: ch03-b11
          speaker: narrator
          text: |-
            这话大家爱听，便站起，回奥德修斯宅里，在自己惯常的地方坐下。
    - id: ch04
      title: 王后的责问与父子的微笑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            佩涅洛佩要去见求婚人。墨冬已经听到他们秘密的计议，告诉了她。她带侍女下楼，到庭院，在撑着回廊屋顶的柱边站住，面纱挡在脸前，向安提诺奥斯责备起来。
        - id: ch04-b02
          speaker: penelope
          emotion: angry
          text: |-
            安提诺奥斯，你这傲慢的阴谋家！都说伊萨卡同龄人里，你最会讲话，最会出主意，可根本不是。你疯了吗，竟要杀忒勒马科斯？别人来求助，宙斯亲自作证，你连这份情都不管？人与人哪能如此算计！

            你父亲怎样逃来这家，忘了吗？他跟塔福斯的海盗去抢忒斯普罗提亚人，那可是与我们和平来往的。百姓生气，要把他撕碎，吃掉全部财产，他吓得跑来。是奥德修斯把怒气冲冲的人拦住。如今你不花钱吃他的东西，想娶他的妻，又要杀他的儿子，叫我心碎。你自己停手，也叫别人停下！
        - id: ch04-b03
          speaker: eurymachus
          emotion: calm
          text: |-
            伊卡里奥斯的女儿，佩涅洛佩王后，振作点，别担心这些。我活在世上一天，就没人敢碰您儿子。这样的人还没出生，将来也不会有。我把话说明，谁敢动，血就会染红我的矛。

            奥德修斯从前多少次抱我坐在膝头，把酒递到我唇边，把肉放在我手里。所以忒勒马科斯是我最亲爱的朋友，他用不着害怕我们这些求婚人。要是神决定了他的死亡，那自然没人躲得开。
        - id: ch04-b04
          speaker: narrator
          text: |-
            他这样说，只为让她安心，可心里仍在盘算害她的儿子。

            佩涅洛佩回楼上，仍为丈夫伤心，直到雅典娜送来睡意。傍晚，欧迈奥斯回来了。父子俩刚献祭一头一岁小猪，正互相帮忙，张罗晚饭。雅典娜用神杖碰了奥德修斯，让他又成了老人，穿回破烂衣物。她怕牧猪人认出真相，没能保住秘密，跑去告诉佩涅洛佩。儿子先问起话。
        - id: ch04-b05
          speaker: telemachus
          text: |-
            欧迈奥斯，回来了。城里有什么消息？求婚人已到，还是在海那边埋伏，要等我回去捉住？
        - id: ch04-b06
          speaker: eumaeus
          text: |-
            我没想着问，只顾把话送到，赶紧返回。路上遇见和你同去皮洛斯的人派来的仆人，他先告诉了你母亲。可是亲眼看到的，我能说。刚到城上方赫尔墨斯山的山脊，便见一艘船进港，上面好些人，盾牌、长矛也不少。我猜是求婚人，不过不敢保证。
        - id: ch04-b07
          speaker: narrator
          text: |-
            忒勒马科斯向父亲微微笑了笑，藏着没让欧迈奥斯看见。

            事情忙完，晚饭也做好了。大家吃起来，每人分得足够，个个满足。酒足饭饱，他们便躺下，享受睡眠带来的安歇。
