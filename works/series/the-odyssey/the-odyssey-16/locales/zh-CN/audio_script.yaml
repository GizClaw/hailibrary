audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实的话从容讲述古老史诗", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着而机敏", timbre: "沧桑清楚", pace: "从容而有变化", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "亲切直率", timbre: "温厚沧桑", pace: "舒缓", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "坦率年轻", timbre: "清朗略带稚气", pace: "自然而有果断的停顿", pitch: "中音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定敏锐", timbre: "清亮坚定", pace: "稳健", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰温润", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: "来人是少主"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            欧迈奥斯看见门口的人，手里的酒碗都掉了。他跑过去，抱住忒勒马科斯，又亲他的额头，又亲他的眼睛，眼泪一直往下流。狗也迎着这个熟人摇尾巴，没有吠叫。奥德修斯在火边，早就听见儿子的脚步了。他却只能坐着，让牧猪人先抱住儿子。
        - id: ch01-b02
          speaker: eumaeus
          text: >-
            你真回来了！我还以为再也看不到你了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            忒勒马科斯让他仔细看了看，接着问母亲怎么样。她还住在家里，伤心地等着丈夫。听完这些，年轻人才进屋。老客人要起身让座，他赶紧阻止。
        - id: ch01-b04
          speaker: telemachus
          text: >-
            不用起来。你坐你的，我也有地方坐。
        - id: ch01-b05
          speaker: narrator
          text: >-
            欧迈奥斯给他铺上青枝和羊皮，拿来面包、昨天的肉，还有兑好的酒。吃完饭，忒勒马科斯打听客人的来历。牧猪人把那套克里特故事转述一遍，请少主照顾这个来避难的人。年轻人为难了。衣服、鞋、吃的和兵器，他可以供给，也愿意让客人住在这里，等着安排下一段行程。但家中求婚人又多又凶，他没法保证老人进去不受欺负。
        - id: ch01-b06
          speaker: odysseus
          text: >-
            难道岛上没人支持你？你的兄弟也不能帮你吗？
        - id: ch01-b07
          speaker: narrator
          text: >-
            老人声音变强了。忒勒马科斯说，祖父、父亲、自己都是独子，没有兄弟。求婚人从各岛过来，母亲不选，他们不走，吃完家产，还可能杀他。奥德修斯很怒。他说，若年轻些，若是奥德修斯的儿子，或者奥德修斯本人，哪怕有人砍他的头，他也要杀那些人。与其看客人被欺、女奴被拖扯猥亵、东西白白耗掉，宁可在家里战死。话虽坚决，人数却没因此改变。
    - id: ch02
      title: "父亲就在眼前"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他让欧迈奥斯进城，单独告诉母亲，自己已经平安回来，办完赶快回。牧猪人担心拉厄尔忒斯，老人自从孙子出海，饭也吃不好了。忒勒马科斯说，请母亲另派一个可信的人去，欧迈奥斯就别绕路。等牧猪人走远，雅典娜出现在院子外。狗都缩着尾巴退开了。儿子看不见她，奥德修斯却看见她招手，走出了围墙。
        - id: ch02-b02
          speaker: athena
          text: >-
            告诉儿子你是谁，一起想怎样杀求婚人，再进城。我也会来帮你们打。
        - id: ch02-b03
          speaker: narrator
          text: >-
            女神用金杖一碰，他的破衣就成了整洁的袍子，脸不再干瘪，胡子也变黑了。奥德修斯回到屋里。忒勒马科斯立即把目光移开，不敢再看。
        - id: ch02-b04
          speaker: telemachus
          text: >-
            你一定是神吧？你刚才可不是这样。请别伤害我。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            我是你的父亲。
        - id: ch02-b06
          speaker: narrator
          text: >-
            奥德修斯亲吻儿子，泪水落到了地上。年轻人还没敢靠过去。他警惕地打量着这个人。老人怎么一下就变得强壮了？或许又是神给他希望，再收回去，让他多受一次苦。奥德修斯坐回原来的地方，向他解释。
        - id: ch02-b07
          speaker: odysseus
          text: >-
            是雅典娜让我变了样。你等不到另一个奥德修斯了。我离开二十年，如今终于回到家里。
        - id: ch02-b08
          speaker: narrator
          text: |-
            忒勒马科斯这才扑进父亲怀里。两个人抱在一起，放声大哭。父亲走时，儿子还是个婴儿。他从别人的讲述中想象父亲，现在这个人就在眼前，他却一句话也说不出来。

            过了些时候，他才问父亲怎么回来的。奥德修斯说，费埃克斯人趁他睡着，把他渡过大海，送回伊萨卡，又给了许多礼物，都已收在洞里。雅典娜叫他来找儿子，一起商量杀死求婚人的办法。
    - id: ch03
      title: "暂时守住秘密"
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: >-
            求婚人总共有几个？
        - id: ch03-b02
          speaker: narrator
          text: >-
            他一个岛一个岛数。杜利基翁五十二，萨墨二十四，扎金索斯二十，伊萨卡十二，合起来一百零八。杜利基翁人还带六名仆从，另有墨冬、歌者和两个切肉的人。父亲的本事他知道，可两个人怎么打？
        - id: ch03-b03
          speaker: telemachus
          text: >-
            我们需要别人来帮忙。
        - id: ch03-b04
          speaker: odysseus
          text: >-
            要是有雅典娜和宙斯相助呢？
        - id: ch03-b05
          speaker: narrator
          text: |-
            儿子说，这两位当然有本领。父亲开始安排接下来的事。明天早上，忒勒马科斯先回去。欧迈奥斯随后带他进宫，他仍是乞丐模样。儿子必须忍住，不管那些人怎么骂，拿东西砸，甚至把他拖出去，都不能冲上去护着他，泄露他的身份。

            雅典娜提示父亲，父亲就点头，让儿子把武器收进库房。有人问，就说烟熏得太脏，或者怕醉汉争斗，拿武器伤人。父子各留一把剑、一支矛，再留两面牛皮盾，随时能拿到。真身份谁也不能说，连母亲、祖父和牧猪人也不行。他们还要试试仆人，谁肯帮忙。

            忒勒马科斯不同意跑遍农庄试男仆。时间全耗在那里，家产还会被求婚人吃掉。他说先试屋里的女仆，男仆以后再说，还得是宙斯确实肯帮他们才行。儿子能守秘密，也有自己的主意了。
    - id: ch04
      title: "城里的另一场商议"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            船已进城，信使和欧迈奥斯都去见佩涅洛佩。信使当众说她儿子回来了，牧猪人传完私话就走。求婚人刚知道，埋伏的船也回来了。安提诺奥斯恼火，白天夜里都守，怎么还漏了？他要赶在年轻人开会揭发之前，在农庄或路上把人杀掉，免得大家被百姓放逐。之后分产业，房屋留给王后和新丈夫。若不肯杀，就各回各家求婚，别再吃人家的东西。安菲诺摩斯说先问神。宙斯答应，他会自己杀，也催大家杀。神不许，就住手。他们赞同，回到大厅。

            墨冬把阴谋告诉了王后。佩涅洛佩带侍女下楼，在柱旁责问安提诺奥斯。
        - id: ch04-b02
          speaker: penelope
          text: >-
            你父亲伙同塔福斯海盗，去抢同我们友好的忒斯普罗提亚人。百姓要杀他，还要他的财产。他逃来，是奥德修斯护住他。如今你花他的钱，求娶他的妻子，还要杀他的儿子。就这样报恩吗？住手，也叫别人停下！
        - id: ch04-b03
          speaker: narrator
          text: |-
            欧律马科斯急忙保证，有他在，求婚人就没人敢害忒勒马科斯。他小时候受过奥德修斯喂酒喂肉，一定会护住他的儿子。不过，他又说，神要谁死，谁也躲不过。他说得亲热，却藏着自己也在策划杀忒勒马科斯的事实。佩涅洛佩回到楼上，雅典娜后来让她睡着，忧愁才暂时停下。

            茅屋里，父子正一起做晚饭。欧迈奥斯回家前，雅典娜又让奥德修斯满脸皱纹，穿回破衣。牧猪人什么变化也没发现。忒勒马科斯问，埋伏的人是不是回来了。他没有停下来问，只看到城外山岗下，有一条坐着武装人员的船进港。他猜是那些人，却不能肯定。忒勒马科斯趁牧猪人没注意，朝父亲笑了笑。他们吃过饭，各自躺下。

            忒勒马科斯在火边躺着，心里知道，父亲就在旁边。
