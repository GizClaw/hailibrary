audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实的话从容讲述古老史诗", timbre: "温暖清晰", pace: "舒缓而有变化", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着而机敏", timbre: "沧桑清楚", pace: "从容而有变化", pitch: "中低音"}
    eumaeus:
      display_name: 欧迈奥斯
      tts: {delivery: "亲切直率", timbre: "温厚沧桑", pace: "舒缓", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "坦率年轻", timbre: "清朗略带稚气", pace: "自然而有果断的停顿", pitch: "中音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定敏锐", timbre: "清亮坚定", pace: "稳健", pitch: "中音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰温润", pace: "舒缓", pitch: "中音"}
  chapters:
    - id: ch01
      title: 少主人回来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            门外有脚步声，狗却不叫，只管摇尾巴。奥德修斯想看看谁来了，欧迈奥斯的酒碗已经脱手落地。

            站在门口的，是忒勒马科斯。

            牧猪人冲去搂住他，亲额头，亲眼睛，哭得停不住。奥德修斯坐在火旁，看着亲生儿子，仍不能相认。
        - id: ch01-b02
          speaker: eumaeus
          text: 你终于回来了，孩子！我都怕这辈子见不到你了。
        - id: ch01-b03
          speaker: narrator
          text: 等牧猪人稍稍平静，青年就问母亲可好。得知她还留在家里，日夜伤心，他才进屋。老乞丐站起身让位，他连忙拦住。
        - id: ch01-b04
          speaker: telemachus
          text: 您不用让。我这边有地方坐。
        - id: ch01-b05
          speaker: narrator
          text: 欧迈奥斯拿青枝和羊皮铺出座位，给他端来面包、剩下的肉，还有兑水的酒。吃过饭，青年问老人的身份，牧猪人便转述了克里特那段身世，想请少主人照料这位落难客人。
        - id: ch01-b06
          speaker: telemachus
          text: 鞋子衣服，还有吃的和兵器，我都愿意送。他先住这儿，我再替他安排去处。可是你也知道求婚人多横暴，带回家，我怕护不住他。
        - id: ch01-b07
          speaker: narrator
          text: 奥德修斯越听越气，忍不住开口。
        - id: ch01-b08
          speaker: odysseus
          text: 就让他们这样欺侮你？岛上没人肯帮忙？你没有兄弟能帮你吗？我若还年轻，若是奥德修斯的儿子，甚至就是他本人回来，一定冲进家门把他们杀掉。做不到，谁都可以来砍我的头！他们人多，打不过，大不了死在自己家，总比天天看着客人受辱，女奴被人拉扯猥亵，家产被白白糟蹋强！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: |-
            忒勒马科斯解释，百姓并没与他作对，也不是兄弟不帮。他的祖父是独子，父亲也是，他自己一样没有兄弟。求婚人从四周岛上来，逼母亲再嫁，吃着他的家产，母亲始终定不了主意。他们赖在那里，等吃光用光，只怕下一步就要他的命。
            他让欧迈奥斯赶快去城里，只对母亲说自己平安到家，说完便回来。牧猪人却还想通知拉厄尔忒斯，孙子出海后，老人越发难过，连饭都吃不下了。
        - id: ch01-b10
          speaker: telemachus
          text: 请母亲另外派个可靠的侍女去。你别绕路，报完信就回来。
    - id: ch02
      title: 不是神，是父亲
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            牧猪人一走，雅典娜出现在院外。狗吓得夹着尾巴退开，青年却看不见女神。奥德修斯看见她招手，就出了围墙。
        - id: ch02-b02
          speaker: athena
          text: 该告诉儿子你是谁了。你们一起商量，怎样杀掉求婚人，再回城去，我也会帮着作战。
        - id: ch02-b03
          speaker: narrator
          text: 金杖一碰，奥德修斯身上的破布换成干净袍子，脸颊也丰满了，胡须重新变黑。他走进屋，儿子却不敢直视，移开了眼睛。
        - id: ch02-b04
          speaker: telemachus
          text: 您是哪一位神？刚才还那么老，怎么就变了？别伤害我！
          emotion: fearful
        - id: ch02-b05
          speaker: odysseus
          text: 我不是神。我是你的父亲。
        - id: ch02-b06
          speaker: narrator
          text: 他亲着儿子，眼泪都滴到地上了，忒勒马科斯却还信不过。
        - id: ch02-b07
          speaker: telemachus
          text: 不，你不可能是我父亲。是神故意来骗我，让我更难过吧。一个凡人，怎么说年轻就年轻，说老就老？
        - id: ch02-b08
          speaker: narrator
          text: 奥德修斯在原先的位置坐下。
        - id: ch02-b09
          speaker: odysseus
          text: 是雅典娜帮我变的。老也好，年轻也好，她都做得到。儿子，别再等另外一个奥德修斯了。我在外二十年，受够了苦，现在回来了。
        - id: ch02-b10
          speaker: narrator
          text: |-
            这回，忒勒马科斯抱住了父亲，两个人都放声大哭。父亲离家那会儿，儿子还是个婴儿，如今终于能抱在一起了。他们哭了很久，说不出话。
            后来，儿子才问归来的经过。父亲说，自己还在熟睡，费埃克斯人就把他送上了伊萨卡，还赠送财宝，如今藏在洞里。雅典娜让他来见儿子，就是要父子一起准备，杀掉那些求婚人。
    - id: ch03
      title: 父子的约定
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: 先告诉我，他们一共有多少人？
        - id: ch03-b02
          speaker: telemachus
          text: 杜利基翁五十二个，萨墨二十四个，扎金索斯二十个，本岛十二个，加起来就是一百零八个求婚人。杜利基翁那边另带六名仆人，再有墨冬、一个歌者和两个切肉的侍者。您是有本事，可咱们才两人，怎么对付得了？得请帮手才行。
        - id: ch03-b03
          speaker: odysseus
          text: 雅典娜和宙斯算不算好帮手？有他们，还不够吗？
        - id: ch03-b04
          speaker: narrator
          text: 儿子当然相信这两位的力量。父亲让他明早先回城，自己晚些由欧迈奥斯领进宫，仍装乞丐。
        - id: ch03-b05
          speaker: odysseus
          text: |-
            他们骂我也好，扔东西砸我也好，哪怕把我拖出门，你都得忍，别为了护我暴露身份。等雅典娜示意，我便向你点头，你马上将厅内兵器收进库房。

            若谁追问，告诉他让烟熏坏了，得收起来。也可以说，万一喝醉争吵，伸手有兵器，要闹出人命的。两把剑、两支矛、两面牛皮盾留下，咱们各一份，放到随手能拿的地方。
        - id: ch03-b06
          speaker: narrator
          text: 回家的事必须保密，连佩涅洛佩、老父亲、欧迈奥斯也不能说。他们还要试试仆人，看看谁忠心，谁早就不顾这个家了。但忒勒马科斯不赞成逐个到农庄查男仆，那得耽误多少天？父子要是在乡下到处跑，求婚人还在家里吃喝。他主张先查家里女仆，男仆的事，只要宙斯肯帮忙，就往后再说。
    - id: ch04
      title: 城里还在谋划杀人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            城里，船员派来报信的人与欧迈奥斯先后见到了王后。报信人当众报平安，牧猪人却贴近佩涅洛佩，私下说完话，便往回走了。
            消息也传到求婚人那里。埋伏的船正好进港，安提诺奥斯气坏了。白天有人守岬角，夜里大家在船上等着，竟让青年逃过！他要赶在忒勒马科斯召集百姓揭发以前，在路上或农庄杀人，否则他们的阴谋传开，说不定会让百姓把他们全赶出去。
            人一杀，产业大家分，屋子则留给佩涅洛佩和新丈夫。他说若不敢，就各自回家送礼求婚，不能仍在这里混吃混喝。安菲诺摩斯提出先看神意。宙斯答应，他亲手杀也可以，还会催大家动手，宙斯反对，就别做了。众人接受，返回大厅。
            墨冬已经把阴谋告诉王后。佩涅洛佩带侍女下来，站在柱子旁斥责安提诺奥斯。
        - id: ch04-b02
          speaker: penelope
          text: 你父亲曾跟塔福斯海盗去抢忒斯普罗提亚人，那可是我们的朋友。百姓要他的命，还要没收财产，是他跑进这个家，奥德修斯才救下了他。如今你吃着恩人的家产，逼他妻子嫁给你，还要杀他儿子！你竟这样报恩？马上住手，也不许旁人再干！
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: |-
            欧律马科斯赶紧说，只要自己还有命，就不会让求婚人害忒勒马科斯。他小的时候，奥德修斯把他抱在膝上，喂过酒肉，恩人的儿子，他一定护着。不过若是神要人死，那谁也没办法。他嘴上护着青年，心里却也在盘算怎么杀他。
            佩涅洛佩回到楼上，又为丈夫流泪。雅典娜让她入睡，她才停下。
    - id: ch05
      title: 火边的三个人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            猪棚那边，父子正准备晚饭。欧迈奥斯没回来之前，女神又让奥德修斯变老，身上又换回了那套破衣服。牧猪人进屋，看不出父子已经相认。
            少主人问伏击的船是否返港，他说自己没留下打听，只在城外山上，看见一条装着矛和盾的船进港。看着像求婚人，他却不能肯定。
            忒勒马科斯避开欧迈奥斯的目光，朝父亲一笑。他们三人吃过饭，便各自躺下。

            青年躺在火边，知道父亲就在旁边。
