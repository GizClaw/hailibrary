  chapters:
    - id: ch01
      title: A welcome at the swineherd's hut
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            At daybreak, Ulysses and the swineherd lit a fire and began preparing breakfast in the hut. The other men had gone out with the pigs. When Telemachus approached, the dogs did not bark. They fawned on him. Ulysses heard the footsteps and noticed the welcome the dogs were giving.
        - id: ch01-b02
          speaker: odysseus
          text: |-
            Eumaeus, someone is coming. I can hear his feet. It must be one of your men or someone you know. The dogs are greeting him instead of barking.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Ulysses had barely finished speaking when his son stood in the doorway. Eumaeus jumped to his feet. He had been holding the bowls in which he mixed the wine, but they dropped from his hands as he rushed toward his master. He kissed Telemachus on the head, then on both of his beautiful eyes. Tears of happiness were running down his face.

            Imagine a father who has only one son, born to him in old age. The son returns after ten years abroad, after many hardships. Such a father could hardly be happier than Eumaeus was. He held Telemachus and kissed him again and again, as though he had returned from the dead. Then he spoke with deep affection.
        - id: ch01-b04
          speaker: eumaeus
          emotion: happy
          text: |-
            Telemachus, the light of my eyes, you have come back. When I heard you had sailed to Pylos, I thought I would never see you again. Come inside, my dear boy, and sit down. Let me look at you properly now you are home. You do not often come out to the country to see us herdsmen. Usually you stay close to the town. I suppose you think it wiser to watch what the suitors are doing.
        - id: ch01-b05
          speaker: telemachus
          text: |-
            That is true, old friend. But now I wanted to see you, and to hear about my mother. Is she still in her own home? Or has another man married her, leaving Ulysses' bed bare of its coverings, with cobwebs over it?
        - id: ch01-b06
          speaker: eumaeus
          text: |-
            She is still there. Grief is breaking her heart. Day and night she does nothing but weep.
        - id: ch01-b07
          speaker: narrator
          text: |-
            Eumaeus took his spear as he answered. Telemachus stepped across the stone threshold. Ulysses stood to give him his seat, but the young man stopped him.
        - id: ch01-b08
          speaker: telemachus
          text: |-
            Keep your seat, stranger. There will be another place for me. Someone here can make it ready.
        - id: ch01-b09
          speaker: narrator
          text: |-
            Ulysses sat down again. Eumaeus scattered fresh brushwood on the floor and laid a sheepskin over it for Telemachus. He brought platters of cold meat left from the previous day's meal and quickly filled baskets with bread. He mixed wine in bowls made of ivy wood, then sat opposite Ulysses. They ate the good food before them. When they had eaten and drunk enough, Telemachus asked about their guest.
        - id: ch01-b10
          speaker: telemachus
          text: |-
            Old friend, where has this stranger come from? What crew brought him to Ithaca, and who were they? He certainly did not arrive by land.
        - id: ch01-b11
          speaker: narrator
          text: |-
            Eumaeus, this was the answer you gave him.
        - id: ch01-b12
          speaker: eumaeus
          text: |-
            My son, here is the truth of what he told me. He says he comes from Crete and has traveled far. He has just escaped from a Thesprotian ship and taken shelter at my station. I place him in your care now. Decide what to do with him, but remember that he has come asking for your protection.
        - id: ch01-b13
          speaker: telemachus
          text: |-
            What you have told me troubles me greatly. How am I to receive this stranger in my own house? I am only a young man. If someone lays hands on me, I do not yet have the strength to defend myself against him. My mother cannot settle her mind either. She thinks of what people will say, and remembers her husband. Should she stay where she is and take care of his house? Or is it time now to choose the best of the men who want to marry her, the one who can make her the most favorable offer?

            Still, he has come to your station asking for shelter. I shall get him a well-made cloak and shirt that will wear for a long time. He shall have a sword and a pair of sandals too, and I will arrange for him to go wherever he wishes. Or, if you prefer, let him stay here with you. I will send clothing and provisions, so providing for him need not burden either you or any of your men. What I will not do is bring him close to the suitors. Their insolence has no restraint, and they will certainly treat him badly. That would cause me great sorrow. One man may be as brave as you please, but he cannot overcome so many. Their numbers will give them too much strength.
        - id: ch01-b14
          speaker: odysseus
          text: |-
            Sir, I ought to speak for myself too. I am appalled to hear that these suitors treat a man like you with such insolence. Do you simply endure it? Has some god turned your people against you? Or have your brothers failed you? A man ought to be able to depend on his brothers, however fierce his quarrel becomes.

            If only I had your youth and the mind I have now. If I were Ulysses' son, or Ulysses himself, I would go into that house and destroy every one of them, even if someone were to cut off my head. If their numbers overwhelmed me fighting alone, I would sooner die in my own home than watch such shameful things day after day. Guests mistreated, women servants dragged about the house, wine poured away without care, bread wasted for nothing, all for a purpose that will never come to pass.
        - id: ch01-b15
          speaker: telemachus
          text: |-
            I will give you the truth. My people have no quarrel with me, and I cannot blame any brothers for refusing to help. Brothers should support a man in a great dispute, but Jove has made ours a family of only sons. Laertes was the only son of Arceisius. Ulysses was Laertes' only son, and I am the only son of Ulysses. He left me behind when he went away. I have never been able to do anything for him.

            So our house is full of plunderers. The chiefs from the neighboring islands of Dulichium, Same and Zacynthus are here, and all the leading men of Ithaca have joined them. They say they are courting Mother, and eat away our home. She neither refuses them outright nor settles the matter. They are ruining my property, and soon they will ruin me as well. The outcome is in heaven's hands.

            Eumaeus, old friend, go to Penelope at once. Tell her I am safe and have come back from Pylos. Tell her alone, and return here. No one else must hear, for many people are plotting to harm me.
        - id: ch01-b16
          speaker: eumaeus
          text: |-
            I understand. I will do as you ask, and you need not explain again. But since I am going that way, should I tell poor Laertes too? In spite of his sorrow for Ulysses, he used to look after the farm work and eat and drink with his servants when he wanted. I hear that since you left for Pylos, he has hardly eaten or drunk properly. He does not attend to the farm. He only sits crying, wasting away until there is scarcely flesh on his bones.
        - id: ch01-b17
          speaker: telemachus
          text: |-
            That is pitiful, and I am sorry for him. But for now we must leave him by himself. If everyone could choose exactly what they wished, the first thing I would choose is my father's return. Deliver the message and hurry back. Don't go out of your way to visit Laertes. Ask Mother to send one of her women secretly to him at once, so he can hear the news from her.
    - id: ch02
      title: Father and son
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Eumaeus took his sandals and tied them onto his feet. Then he started on the road to town. Minerva watched him until he was well clear of the swineherd's station. Only then did she approach, in the form of a beautiful woman with a dignified manner and a wise appearance. She stood to one side of the entrance and made herself visible to Ulysses. Telemachus did not see her and had no idea she was there. The gods do not allow everybody to look upon them. The dogs could see her. They made no barking sound, but whined with fear and moved away to the other side of the yards.

            Minerva nodded and signaled to Ulysses with her eyebrows. He left the hut and stood before her, outside the main wall of the yards.
        - id: ch02-b02
          speaker: athena
          text: |-
            Ulysses, noble son of Laertes, tell your son the truth now. Keep it from him no longer. Together, plan how to destroy the suitors, then go to the town. I will join you soon. I too am eager to enter this fight.
        - id: ch02-b03
          speaker: narrator
          text: |-
            While she was speaking, she touched him with the golden wand. First she laid a handsome, clean shirt and cloak about his shoulders. Then she restored his youth and gave him a more commanding presence. Healthy color came back into his face. His cheeks were full again, and his beard was once more dark. When she had done this, the goddess left. Ulysses returned to the hut. Telemachus was astonished by what he saw. He turned his eyes aside, afraid to keep looking at someone who might be a god.
        - id: ch02-b04
          speaker: telemachus
          emotion: fearful
          text: |-
            Stranger, a moment ago you looked completely different. Your clothes have changed, and so has your complexion. Are you one of the gods from heaven? If you are, be kind to me until I can offer the proper sacrifices and gifts of worked gold. Have mercy on me.
        - id: ch02-b05
          speaker: odysseus
          text: |-
            I am not a god. Why do you think I am? I am your father, the one you grieve for, the one whose absence has left you suffering at the hands of lawless men.
        - id: ch02-b06
          speaker: narrator
          text: |-
            He kissed his son as he spoke. A tear fell from his cheek to the ground. Until that moment, he had held all his tears back. But Telemachus still could not believe this was his father.
        - id: ch02-b07
          speaker: telemachus
          text: |-
            You cannot be my father. A god must be playing with me, offering false hope so I will suffer more afterward. No mortal could change his own age like that in an instant, unless a god helped him. Just now you were old and dressed in rags. Now you look like a god who has stepped down from heaven.
        - id: ch02-b08
          speaker: odysseus
          text: |-
            Telemachus, don't be so overwhelmed by seeing me here. No other Ulysses will come after me. This is your father, as I am now, home at last in the twentieth year after long wandering and terrible hardship. The change you wonder at was Minerva's doing. That mighty goddess can make me look however she wishes. One moment I am a beggar. The next I seem a young man in good clothes. To the gods in heaven, making someone look rich or poor is a simple thing.
        - id: ch02-b09
          speaker: narrator
          text: |-
            He sat down. Telemachus put his arms around him and wept. Both were overcome, crying aloud like eagles or crooked-clawed vultures whose young, still only half fledged, have been taken by farmers. Their grief would have lasted until sunset if Telemachus had not suddenly asked a question.
        - id: ch02-b10
          speaker: telemachus
          text: |-
            Dear Father, what ship brought you to Ithaca? Who were the sailors? What country did they say they came from? You cannot have arrived by land.
    - id: ch03
      title: The plan for the house
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: |-
            My son, you shall hear exactly how it happened. The Phaeacians were the people who carried me here. They are very skilled sailors, and their custom is to give an escort to anyone who reaches their coast. I slept deeply while they sailed me across the sea, and they set me down on Ithaca. They had given me a great many presents, bronze and gold and fine clothing. Thanks to heaven's kindness, all those things are hidden in a cave now. Minerva advised me to come to this place so that you and I could decide together how to kill our enemies.

            First tell me who the suitors are and how many there are. Give me their names and numbers. Then I can think whether the two of us can face them alone, or whether we need more help.
        - id: ch03-b02
          speaker: telemachus
          text: |-
            Father, I have always heard how great your name is, both on the battlefield and when men meet to decide things in council. But the task you are proposing is a tremendous one. Just thinking about it makes me afraid. Two men cannot stand up to a large number of opponents who are brave fighters themselves. These suitors do not number ten, or even twice ten. There are ten many times over.

            I can tell you the numbers straight away. Dulichium has sent fifty-two of its chosen young men, and six servants came with them. There are twenty-four from Same. Zacynthus has sent twenty young Achaeans. Ithaca itself has supplied twelve, every one of those men from a noble family. They also have Medon to serve them, a bard to sing, and two men who carve the meat at their table. If you and I face them all, you may bitterly wish you had never returned to attempt this revenge. Think whether there is anyone else who would be willing to come to our aid.
        - id: ch03-b03
          speaker: odysseus
          text: |-
            Consider this, then. Would Minerva and her father Jove be enough, or should I look for someone else as well?
        - id: ch03-b04
          speaker: telemachus
          text: |-
            Those are two strong allies. Though they live high among the clouds, their power reaches both gods and men.
        - id: ch03-b05
          speaker: odysseus
          text: |-
            When we fight the suitors in my house, those two will not remain outside the struggle for long. Early tomorrow, you must return home and move among the suitors as usual. Later Eumaeus will bring me to town, disguised as a miserable old beggar. If they mistreat me, make yourself bear it. Even if they drag me out feet first or throw things at me, watch and do nothing. You may speak gently and try to make them behave better, but go no further. They will not listen. Their day of punishment is near.

            Take these next words to heart and remember them. When Minerva gives me the thought, I shall nod to you. The moment you see the signal, collect all the armor and weapons that are in the house. Put them out of sight in the strong storeroom. The suitors may ask why you are carrying everything away. You will need a reason to give them. Say that you want to keep it clear of the smoke. It is no longer in the condition it was when Ulysses left home. Smoke and soot have stained it and made it dirty. Above all, say you fear that Jove might make them quarrel while they drink. They might wound each other and bring shame on both the feast and their suit for your mother. Sometimes the sight of weapons makes people want to use them.

            Keep back one sword and one spear for each of us, and two shields made of ox hide. We must be able to seize them at a moment's notice. Jove and Minerva will soon silence these men. One more thing. If you truly are my son and carry my blood, let no one learn that Ulysses is in the house. Not Laertes, not the swineherd or any servant, not even Penelope. You and I will test the women by ourselves. We will also try some of the men, to discover who stands with us and who works against us.
        - id: ch03-b06
          speaker: telemachus
          text: |-
            Father, when you know me better, you will see that I can keep a secret. But I don't think all of this plan will serve either of us well. Think about how long it would take to visit every farm and test the men. All that time the suitors would be wasting your property without punishment or a moment's regret. Certainly examine the women, and find who is disloyal and who has done no wrong. I do not favor going around to question the men. That can wait until later, if you truly have a sign from Jove that he is on our side.
    - id: ch04
      title: News reaches the town
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            While father and son talked, the ship that had brought Telemachus from Pylos reached the town of Ithaca. The men entered the harbor and pulled her onto the land. Servants took their armor, and all the gifts were left at Clytius's house. They sent a messenger to Penelope. He was to explain that Telemachus had gone into the country but sent his ship to the town, so she need not be frightened or unhappy.

            This messenger met Eumaeus on the way. Both were carrying news to Penelope. When they reached the house, the servant stood up and spoke before the queen and her waiting women.
        - id: ch04-b02
          speaker: telemachus_messenger
          text: |-
            Madam, your son has returned from Pylos.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Eumaeus went close to Penelope and privately told her everything her son had entrusted to him. With his message delivered, he left the house and its outbuildings and went back toward his pigs.

            The suitors were surprised and angry. They went beyond the great wall around the outer court and held a meeting near the main entrance. Eurymachus, son of Polybus, spoke first.
        - id: ch04-b04
          speaker: eurymachus
          text: |-
            Friends, Telemachus's voyage has become a serious problem. We were certain it would fail. Launch a ship now and gather a crew. Send them after our other men and tell them to return as quickly as they can.
        - id: ch04-b05
          speaker: narrator
          text: |-
            As soon as he finished, Amphinomus turned and saw the ship already in the harbor. Her men were lowering the sails and putting away their oars. He laughed as he spoke to the others.
        - id: ch04-b06
          speaker: amphinomus
          text: |-
            There is no need to send a message. They are here already. A god must have told them, or they saw the other ship pass and could not catch her.
        - id: ch04-b07
          speaker: narrator
          text: |-
            They got up and went to the water. The crew hauled their ship ashore, and servants took away their armor. Then all the men went together to the meeting place. They would let no one else sit among them, young or old. Antinous, son of Eupeithes, began to speak.
        - id: ch04-b08
          speaker: antinous
          text: |-
            See what the gods have done. They have saved him from destruction. The whole day long we had scouts on the headlands, one taking over from another. Once the sun was down, we did not go to shore and find somewhere to sleep. We spent every hour until morning aboard the ship, waiting for the chance to catch him and kill him. Yet a god has carried him safely home, against all our efforts.

            Now we must consider how to put an end to him. We must not let him get away from us. While Telemachus is alive, we have little hope of bringing our own business to a happy conclusion. He is very shrewd, and public feeling is certainly not all in our favor. We need to hurry, before he summons the Achaeans to an assembly. He will not wait long. He will be furious with us and tell everyone how we planned his murder, only to fail to catch him. Once the people hear that account, they will not like it. We must take care that they do not turn on us and hurt us, or force us out of our own country to live in exile.

            Let us catch him on his farm outside the town, or on the road coming here. Afterward, we can divide his property and leave the house to his mother and the man she marries. If you don't like that, and would rather let Telemachus live and keep his father's estate, then we must stop gathering here to eat it away. Each of us must court Penelope from his own house. Let her marry the man who offers most, the one whose fate it is to win her.
        - id: ch04-b09
          speaker: narrator
          text: |-
            No one answered until Amphinomus stood. He was the son of Nisus and grandson of King Aretias, the leading suitor from the island of Dulichium, where wheat and rich pasture grew. Penelope preferred his conversation to that of the others. His nature was kindly. He gave the men his honest opinion.
        - id: ch04-b10
          speaker: amphinomus
          text: |-
            Friends, I do not support killing Telemachus. Murdering someone of noble birth is a terrible crime. Ask the gods first. If Jove's oracles command it, I will help kill him myself and urge you all to join me. But if the gods warn against it, I want you to stop.
        - id: ch04-b11
          speaker: narrator
          text: |-
            His words pleased them. They rose and returned to Ulysses' house, where they sat in their usual places.
    - id: ch05
      title: Words of comfort and a hidden smile
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Penelope decided to face the suitors. Medon had overheard their private meeting and told her of the plan against Telemachus. With her maids beside her, she came down into the court. She stood by a pillar supporting the covered walk, holding her veil before her face, and rebuked Antinous.
        - id: ch05-b02
          speaker: penelope
          emotion: angry
          text: |-
            Antinous, you arrogant, wicked plotter. People say no man your age in Ithaca speaks or advises better. They are wrong. You madman, why plan my son's death? Have you no regard for people who ask for protection, when Jove himself witnesses their plea? You must not scheme against one another like this.

            Do you no longer remember what happened to your own father? He came running to this very house because he was afraid of the people. He had gone with a band of Taphian pirates to plunder the Thesprotians, though those people were at peace with us. The anger against him was terrible. They wanted to tear his body to pieces and eat away all his property. Ulysses stopped them, though they were still enraged. Now you consume his possessions and pay nothing for them. You seek to marry his wife and murder his son, and the pain of it breaks my heart. Stop these things yourself, and make the other men stop as well.
        - id: ch05-b03
          speaker: eurymachus
          emotion: calm
          text: |-
            Queen Penelope, daughter of Icarius, take courage. Don't distress yourself over this. As long as I am alive on this earth, no man will touch Telemachus. Such a man has never been born and never will be. I promise that anyone who tries will feel my spear, and it will be red with his blood.

            Many times Ulysses sat me on his knees, lifted wine to my mouth and put pieces of meat into my hands. Telemachus is therefore my dearest friend. He has nothing to fear from any of us suitors. Of course, if the gods send death, no one can escape them.
        - id: ch05-b04
          speaker: narrator
          text: |-
            He said this to soothe her. In truth, he was still plotting against her son.

            Penelope went upstairs and grieved for her husband until Minerva sent sleep over her eyes. In the evening, Eumaeus came back to Ulysses and Telemachus. They had sacrificed a year-old pig and were helping each other prepare supper. Minerva came to Ulysses and touched him with her wand. He became old again and wore his former rags. She feared that Eumaeus might recognize him, fail to keep the secret and tell Penelope. Telemachus spoke first.
        - id: ch05-b05
          speaker: telemachus
          text: |-
            You are back, Eumaeus. What news is there from town? Have the suitors returned, or are they still waiting out there to catch me on my way home?
        - id: ch05-b06
          speaker: eumaeus
          text: |-
            When I was in town, it never occurred to me to ask about that. I was thinking only of giving your message and coming back as quickly as I could. I met a servant sent by the men who traveled with you to Pylos. He was the one who first announced your return to your mother. Still, I can report what my own eyes saw. I had just come onto the ridge of Mercury's hill, above the town, when I saw a vessel entering the harbor. She was carrying a number of men, and they had many shields and spears with them. I thought they must be the suitors. But I cannot say for sure.
        - id: ch05-b07
          speaker: narrator
          text: |-
            Telemachus smiled at his father, keeping the smile hidden from Eumaeus.

            At last their work was finished, and supper was ready. They ate, each man receiving his full share, until every one of them was satisfied. After they had eaten and drunk as much as they needed, they lay down to rest and enjoy the welcome gift of sleep.
