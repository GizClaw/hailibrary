  chapters:
    - id: ch01
      title: "The young man returns"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The dogs ran to Telemachus without barking and pressed round his legs. Odysseus looked up from the fire where breakfast was being made.
        - id: ch01-b02
          speaker: odysseus
          text: >-
            Eumaeus, whoever's coming must be a friend of yours.
        - id: ch01-b03
          speaker: narrator
          text: >-
            His son came through the doorway. Eumaeus let his bowls fall and hurried to hold him. He kissed the young man's head and eyes. He could hardly speak for crying. Odysseus had to sit by the fire and watch somebody else welcome his son.
        - id: ch01-b04
          speaker: eumaeus
          text: >-
            I was afraid I'd lost you. I thought you wouldn't come back.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Telemachus held the swineherd and asked if his mother was still at home. Eumaeus assured him she was. She hadn't stopped grieving or waiting. He took Telemachus's spear. Odysseus got up to offer his seat, but the young man stopped him.
        - id: ch01-b06
          speaker: telemachus
          text: >-
            Don't get up, stranger. We can all sit here.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Eumaeus made him a place with brushwood covered by a sheepskin. They ate bread and meat left from the day before, with mixed wine. Afterward, Telemachus asked who the guest was. The swineherd told the story about Crete that he had heard, and asked his young master to protect this man. Telemachus was uneasy. He could give him food, clothes, sandals, and a sword. He could also pay for him to stay here until somebody could send him on his way. But he couldn't promise to keep him safe among the many suitors at home.
        - id: ch01-b08
          speaker: odysseus
          text: >-
            Have the people turned against you? What about your brothers? Can't they help?
        - id: ch01-b09
          speaker: telemachus
          text: >-
            I haven't any. My father was an only son, and I'm his only child. Those men come from all the islands nearby. Mother can't decide to marry one of them, so they stay and eat everything we own. They may kill me when they've finished.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Odysseus's anger came through. If he were young, or Odysseus's son, or Odysseus himself, he'd go and kill those men, even if someone cut his head off. Better to die fighting at home than watch guests abused, enslaved women dragged around indecently and his goods wasted. Telemachus heard his resolve. But the enemies still outnumbered them. He sent Eumaeus to tell Penelope privately he was safe and return at once. What about Laertes? Eumaeus asked. Since his grandson left, he'd been wasting away. His mother could send a trusted woman to him, Telemachus said. Eumaeus shouldn't delay.
    - id: ch02
      title: "No other father"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Eumaeus tied his sandals and left. When he was far enough away, Athena appeared outside. Telemachus couldn't see her. His father could, and the dogs whined and backed away. She called Odysseus out beyond the yard.
        - id: ch02-b02
          speaker: athena
          text: >-
            Let your son know. Plan how to kill the suitors together, then go to town. I'll come to fight beside you.
        - id: ch02-b03
          speaker: narrator
          text: >-
            She touched him with her wand. A clean tunic and cloak replaced his old clothes. His cheeks grew full, his beard turned dark, and his color returned. He walked back inside looking like the man who had once left Ithaca. Telemachus looked away from him.
        - id: ch02-b04
          speaker: telemachus
          text: >-
            You must be a god. You were an old man just now. Please don't hurt me.
        - id: ch02-b05
          speaker: odysseus
          text: >-
            I am your father.
        - id: ch02-b06
          speaker: narrator
          text: >-
            He kissed his son, and at last let his tears fall. Telemachus stared. Then he pulled back, afraid to trust this hope.
        - id: ch02-b07
          speaker: telemachus
          text: >-
            A man can't change in an instant. Some god wants me to believe this, then take it away and make me suffer again.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Odysseus returned to the place where he had sat as a beggar.
        - id: ch02-b09
          speaker: odysseus
          text: >-
            Athena did this to me. There is no other Odysseus coming. I've been away twenty years. Now I've finally reached home.
        - id: ch02-b10
          speaker: narrator
          text: |-
            Telemachus held his father, and they both cried aloud. Odysseus had last seen his son as a baby. Telemachus had known his father only through stories told by other people. They stayed in each other's arms while the morning went on outside.

            Eventually Telemachus asked how he had got here. Odysseus described the Phaeacian ship and how he had slept all the way across the sea. Their gifts were safe in a cave. Athena had directed him here to plan the suitors' deaths with his son.
    - id: ch03
      title: "A secret to keep"
      blocks:
        - id: ch03-b01
          speaker: odysseus
          text: >-
            Tell me how many men we're facing.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Telemachus gave the numbers. Fifty-two came from Dulichium, twenty-four from Same, twenty from Zacynthus and twelve from Ithaca. That made a hundred and eight. Add six servants with the Dulichians, Medon, a singer and two men who carved meat. He knew his father's reputation, but couldn't see how two could win against so many.
        - id: ch03-b03
          speaker: telemachus
          text: >-
            We can't do it without help.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            Suppose Zeus and Athena help us. Will that be enough?
        - id: ch03-b05
          speaker: narrator
          text: |-
            Telemachus considered his father. Those gods had great power, certainly. But they lived far above the place where his enemies waited. Odysseus explained what they must do themselves. Telemachus would go home in the morning. Later, Eumaeus would bring Odysseus, disguised again as a beggar. His son must not react if people insulted him, threw things, or dragged him out. If he tried to protect his father, their secret would be lost.

            Athena would prompt Odysseus, and he'd nod to his son. Then Telemachus must put the hall's weapons in the locked storeroom. He could blame the soot, or say he feared a fight among drunk men. They must keep a sword and a spear each, and two oxhide shields, ready to grab. No one else must know the stranger's name, not Eumaeus, Laertes or Penelope. They still needed to find which servants would support them.

            Telemachus disagreed with visiting every farm to test the men. It would take too long, with the suitors wasting the estate meanwhile. Test the women in the house now, he said. Leave the men until later, if Zeus really supported them. His son could keep a secret and question his plans too.
    - id: ch04
      title: "The news reaches the palace"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            In town, the crew sent a messenger from the ship to tell Penelope the news. Eumaeus arrived to do the same. The messenger announced Telemachus's safe return in front of the waiting women. Eumaeus spoke privately to the queen, then left as he had been told.

            The suitors learned their victim was home. Before they could send for the ambush party, its ship came in. Antinous was furious. They'd watched day and night and still missed Telemachus. Kill him on his farm or the road, he urged, before he called the people together and exposed the plot. The people might exile them. Once he was dead, they could share his estate, leaving the house to his mother and her husband. If they wouldn't kill him, they must go home, stop eating his goods and woo Penelope from there. Amphinomus wanted Zeus's advice first. With his approval, he'd kill Telemachus himself and press the others to join him. If not, they must hold back. They agreed and returned to the palace.

            Medon had told Penelope about the conspiracy. She came downstairs with her attendants, stood beside a pillar, and confronted Antinous.
        - id: ch04-b02
          speaker: penelope
          text: >-
            Your father raided the Thesprotians with Taphian pirates, though those people were at peace with us. Our people wanted his life and his wealth. He fled here, and Odysseus saved him. Now you eat his property, court his wife and plot to kill his son. Is this your thanks? Stop, and make the others stop.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Eurymachus promised none of the suitors would harm Telemachus. He remembered being held on Odysseus's knee and fed from his hand. His own spear would protect that man's son, he said. Of course, he added, death from the gods couldn't be avoided. He sounded affectionate, while hiding his own part in the murder plot. Penelope went upstairs, still afraid and unhappy, until Athena let her sleep.

            At the hut, Odysseus and Telemachus were making supper. Before Eumaeus came back, Athena changed the father into the wrinkled man in rags again. To the swineherd, neither of the people he had left that morning seemed to have changed. Telemachus asked whether the ambushers were back. Eumaeus hadn't waited to ask. He had seen a ship full of armed men from the hill above town. It might have been theirs, but he wasn't sure. Telemachus smiled at his father without letting Eumaeus notice. They ate and settled down for the night.

            Eumaeus still thought the old man was a guest. Telemachus lay near the fire knowing his father was there.
