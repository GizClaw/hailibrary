premise: >
  从《奥德赛》第八卷主干新写。归船已备，旅人却在歌者唱起特洛伊时藏起眼泪。
  竞技中的挑衅逼他显露力量，主人的调停与对手的道歉修复了气氛。
  他主动要求唱木马，再次流泪；只有近旁的国王察觉，停止宴歌，请他讲出姓名与来路。
characters:
