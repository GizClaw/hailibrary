  - {id: demodocus, description: "受尊重的盲歌者，能以歌呈现人们共同记忆中的战争与神话"}
  - {id: laodamas, description: "邀请客人参加竞技的王子"}
  - {id: euryalus, description: "轻率挑衅后愿意道歉并赠剑的青年"}
  - {id: athena, description: "在人群中护持奥德修斯的女神"}
  - {id: arete, description: "替客人收好赠礼并安排沐浴的王后"}
  - {id: nausicaa, description: "即将与获救旅人告别的公主"}
