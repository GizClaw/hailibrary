audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定清楚", timbre: "清晰稳定", pace: "舒缓", pitch: "中音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    laodamas:
      display_name: 拉奥达马斯
      tts: {delivery: "自信有礼", timbre: "年轻开朗", pace: "平稳", pitch: "中音"}
    euryalus:
      display_name: 欧律阿洛斯
      tts: {delivery: "大胆直接", timbre: "明亮有力", pace: "利落", pitch: "中低音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    ares:
      display_name: 阿瑞斯
      tts: {delivery: "热切而自信", timbre: "强健浑厚", pace: "轻快", pitch: "中低音"}
    hephaestus:
      display_name: 赫淮斯托斯
      tts: {delivery: "直率执着", timbre: "粗粝而有共鸣", pace: "沉着", pitch: "低音"}
    god_observer:
      display_name: 一位神
      tts: {delivery: "带讥诮的观察口吻", timbre: "清亮", pace: "平稳", pitch: "中音"}
    apollo:
      display_name: 阿波罗
      tts: {delivery: "从容而略带打趣", timbre: "清晰圆润", pace: "舒缓", pitch: "中音"}
    hermes:
      display_name: 赫尔墨斯
      tts: {delivery: "爽快坦率", timbre: "明亮流畅", pace: "活泼", pitch: "中高音"}
    poseidon:
      display_name: 波塞冬
      tts: {delivery: "认真而有权威", timbre: "深沉有共鸣", pace: "沉稳", pitch: "低音"}
    arete:
      display_name: 阿瑞忒
      tts: {delivery: "深思直率", timbre: "成熟清晰", pace: "舒缓", pitch: "中音"}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: "温雅坦诚", timbre: "年轻清楚", pace: "舒缓", pitch: "中高音"}
  chapters:
    - id: ch01
      title: "宴席上的歌声"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            黎明这清晨的女儿，伸出玫瑰色的手指。国王和奥德修斯起来，向船边的集会场走去，由国王带路。到了，两人挨着坐在光滑的石座上。雅典娜为了帮助客人返乡，变作阿尔基诺奥斯的仆人，到城里去，一人一人地招呼。
        - id: ch01-b02
          speaker: athena
          text: >-
            费埃克斯的长老和议事的诸位，都来开会吧！国王家来了一名航海很久的外乡人，大家听听他说话。他那样子，真像不死的神。
        - id: ch01-b03
          speaker: narrator
          text: >-
            城里人一听便想看，挤进会场，能坐的、能站的地方都满了。奥德修斯让人人惊叹。雅典娜改了他的头肩仪容，使他看起来比实际更高大、更壮实。她要叫费埃克斯人对这非凡人物有好感，也要让他在他们随后提出的各种比试中得意。人到齐，国王便说。
        - id: ch01-b04
          speaker: alcinous
          text: >-
            长老们，各位议事者，听听我的打算。这人不知什么姓名，也不知来自东边西边，反正到我家了。他要求护送，想把归程安排定。以前我们怎么帮助客人，这回也怎么做。从没有人住在我家，还能说我送他不够快。找条全新、没出过航的船下海，挑五十二个最灵巧的年轻水手。船桨各自在座旁绑好，然后上岸，到我家开宴，一切东西我来出。年轻船员负责这些。至于各位长老和议事者，都到廊下来陪客，别说推辞的话。还有得摩多科斯，也请来。无论唱什么，他都比别的歌人好。
        - id: ch01-b05
          speaker: narrator
          text: >-
            阿尔基诺奥斯领着众人先回去，一名侍从另去请歌人。五十二名桨手下到海边，推船入水，搬上桅杆与帆，用搓好的皮带把桨固定在桨栓，依次安放齐全，白帆再高高升起。船停在离岸一点距离的水里，他们才回岸上，去王宫。
            院子、附屋、宅子周围，到处都是人，老人年轻人都有。国王宰了十二只绵羊、八头大猪和两头牛。大家剥皮，收拾肉食，做成盛大的宴席。
            得摩多科斯由仆人引来。缪斯很爱这位名歌人，却既给他好处，又给他苦痛。他看不见东西，歌声却有神赐的本领。蓬托诺奥斯把椅子靠着廊柱，安置在宾客当中，琴挂在歌人头顶的木钉，再告诉他往哪里伸手能摸到。旁边摆一张好桌，装食物的篮子与一杯酒都放好，让他随时想喝就喝。
            众人吃饱喝足，缪斯便使得摩多科斯唱起英雄功业。他唱的是人人议论的往事，奥德修斯跟阿喀琉斯在宴会上吵架，恶狠狠地互相说话。阿伽门农听到将领争执，居然高兴，因为阿波罗预告过这一幕。那时候他走过皮托的石地，去问神谕。后来宙斯降给达那奥斯和特洛伊双方的苦难，便由此开始。

            歌声里，奥德修斯拉起紫披风盖脸，不好意思叫这里人看见自己的泪。一停唱，他就擦眼睛，揭下布，举酒杯敬神。费埃克斯人爱听，让歌人接着唱，他便再次蒙头悲哭。只有近坐的阿尔基诺奥斯听到叹息，知道他难受，立刻叫大家换个活动。
        - id: ch01-b06
          speaker: alcinous
          text: >-
            诸位，饭吃得够了，配着饭的歌曲也听够了。看看身手去吧。客人回家，就能向朋友说，我们拳击、摔跤、跳远、奔跑，比其他民族如何出色。
    - id: ch02
      title: "铁饼飞过人群"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            国王又带头，大家跟上。仆人挂好歌人的琴，领他离开回廊，走上首领们去看比赛的路。几千人涌来，好选手也不少，准备争各种奖。有阿克罗纽斯、奥库阿洛斯、厄拉特柔斯、瑙忒乌斯、普吕姆纽斯、安基阿洛斯、厄瑞特墨乌斯、蓬忒乌斯、普罗柔斯、托翁、阿纳贝西纽斯，还有安菲阿洛斯，他父亲波吕纽斯、祖父忒克通。欧律阿洛斯也在，父亲叫瑙玻洛斯。他长得如阿瑞斯一样，除拉奥达马斯外，是费埃克斯人里最英俊的。国王三个儿子都来参赛，拉奥达马斯、哈利奥斯、克吕托纽斯。
            先跑步。路线从起点标好，众人齐冲出去，平原顿时扬尘。克吕托纽斯第一个到，远远甩开其他人，好比两匹骡子在休耕地里犁一趟那么长。摔跤费劲，也使人痛，最强的是欧律阿洛斯。跳跃胜出的是安菲阿洛斯，掷饼没人比得上厄拉特柔斯，拳击则由拉奥达马斯取胜。大家玩得快活，王子才说起客人。
        - id: ch02-b02
          speaker: laodamas
          text: >-
            我们问问外乡人擅长什么吧。看那腿，大腿小腿，还有手和脖子，多结实！他年纪也不大，就是近来受了罪。多强的人在海里折腾，也会被毁得不像样。
        - id: ch02-b03
          speaker: euryalus
          text: >-
            是这样，拉奥达马斯。你这位客人，就由你去问。
        - id: ch02-b04
          speaker: narrator
          text: >-
            王子走到人群中央，邀请奥德修斯。
        - id: ch02-b05
          speaker: laodamas
          text: >-
            客人，你会哪样，便选哪样来赛一场。以前你一定比过许多回。人这一生，要博个好名声，没什么胜过手脚强健、技艺高明。试试吧，别再想着烦恼。你的船已下海，人也备齐，回家这事拖不了多久。
        - id: ch02-b06
          speaker: odysseus
          text: >-
            拉奥达马斯，为什么拿我打趣？我哪有比输赢的念头，心里全是忧虑。万般苦难受够，来到这里是求助的，要请你们国王、请诸位百姓送我回去。
        - id: ch02-b07
          speaker: narrator
          text: >-
            欧律阿洛斯却直接出言侮辱。
        - id: ch02-b08
          speaker: euryalus
          text: >-
            这么说，大家喜欢的那些技艺，你根本不会。怕是个贪利商贩，开船当船长，或者经商，心里只有去程多少货、回程多少货，哪看得出一点选手模样。
        - id: ch02-b09
          speaker: narrator
          text: >-
            奥德修斯怒气冲冲地回他。
        - id: ch02-b10
          speaker: odysseus
          emotion: angry
          text: >-
            讲这种话，你不害羞？真是没礼貌！神给人的本领，从来不一样，长相、口才、头脑，哪能样样齐全。有人模样差，说出来的话却漂亮，人人爱听。他温和有分寸，话又甜，人们自然听从，集会时让他引导，去哪里都受尊重。有人却美得如神，偏没见识。你就是后一种。连神也造不出比你更好看的人，可这好皮囊里是个笨蛋！这些胡乱的话把我气坏，也全说错了。我会很多竞技，年轻有力的时候，是世间最好的选手之一。现在上过战场，又受海上风波折磨，人累，心也苦，早被磨损。可是仍要比，你已经刺痛我了。
        - id: ch02-b11
          speaker: narrator
          text: >-
            他披风都没解，赶上前，抓了个比别人用的更大、更厚、更重的铁饼。胳膊向后抡，再使劲掷出，空中一阵嗡鸣。铁饼从手里飞得流畅又疾猛，费埃克斯人看得畏缩，它却已经远远超过所有记号。雅典娜扮作男子，在落地处作标记，然后说。
        - id: ch02-b12
          speaker: athena
          text: >-
            这位置，瞎子摸都摸得出！客人，你超得太远了，哪还用担心？我们费埃克斯没人扔得到这么远。
        - id: ch02-b13
          speaker: narrator
          text: >-
            人群中有这样一位朋友，奥德修斯听得高兴，接下来的话缓和些。
        - id: ch02-b14
          speaker: odysseus
          text: >-
            年轻人，追上这个落点再说。我还能扔一块同样重的，重一点也行。有谁想来较量，就上吧。我还在气头上，打拳、摔跤、跑步，随你们挑。只有拉奥达马斯不比，我是他客人，还是朋友。我看人在别国，挑战主人一家，实在不聪明，也不稳当，把自己的依靠都弄没了。其他人没有限制，我就要看谁更强。凡是人会的竞技，我都能来一手。弓箭尤其擅长。战场上，多少人跟我同时瞄一个敌人，我也是第一个射倒他的。当年我们在特洛伊，天天练习，只有菲洛克忒忒斯能赢我。世上还活着、还吃面包的人，别的谁也赶不上。不过已经过世的英雄，像赫拉克勒斯、俄伊卡利亚的欧律托斯，我不跟他们相比。他们连神都能挑战。欧律托斯正因为跟阿波罗争射术，惹怒他，才早早被杀。我投标枪，还远过别人的箭。可能输给你们的只有跑步。我怕这个，海把我弄得太虚，吃的又断了，力气至今没恢复。
        - id: ch02-b15
          speaker: narrator
          text: >-
            众人无话，阿尔基诺奥斯出来作答。
        - id: ch02-b16
          speaker: alcinous
          text: >-
            客人，我们很高兴听你讲。你愿展示本领，是咱们有位选手说了难听话，让你不快。他确实不懂讲话，明礼的人不会如此。但请理解我的意思，等回去，同家人和各位首领开宴，告诉他们我们祖传就懂各样好技艺。拳头、角力，不算特别强，跑得快、船驾得好，却是拿手的。好饭菜、音乐舞蹈，我们都喜欢，也爱常换净衣、泡热澡、睡舒服的床。来，跳舞最好的几个人跳起来。让客人回去说，航海、奔跑、舞步、歌声，我们怎样胜过其他民族。谁去我家把得摩多科斯的琴拿来？他还留在那里。
        - id: ch02-b17
          speaker: narrator
          text: >-
            仆人赶紧去取，负责竞技的九个执事则把地面整好。他们管这一切，所以划出宽宽的舞场，又将地弄平。里拉琴送回来，歌人坐在中间，城里最擅舞的青年开始轻快移动双脚。那些欢腾灵巧的步子，让奥德修斯看得开心。
    - id: ch03
      title: "歌中的锁链"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            得摩多科斯接着唱的是阿瑞斯和阿佛洛狄忒，唱他们如何在赫淮斯托斯家开始私情。阿瑞斯送了许多礼物，玷污这位丈夫的婚床。太阳神见到，去告诉他。赫淮斯托斯听完怒了，走进铁匠房想报复，把大砧安好，开始打锁链。链子要谁也解不开、拉不断，能把人困牢。做好以后，他回卧房，像布蜘蛛网一样，床柱上挂满链，顶梁也垂下来许多。做得这么细巧，连神都看不见。
            他布妥整张床，就装作出门去勒姆诺斯，美丽的地方，也是他最爱的去处。阿瑞斯却一直在察看，一见他走，立刻带着热烈欲望赶来。这时阿佛洛狄忒才从父亲宙斯那儿回家，正要坐。阿瑞斯进来，拉起她的手。
        - id: ch03-b02
          speaker: ares
          text: >-
            去你丈夫的床吧，他已经不在了。去了勒姆诺斯，找那些说蛮族话的辛提斯人。
        - id: ch03-b03
          speaker: narrator
          text: >-
            她也愿意，便同去床上，结果一躺就让锁链缠住，起不来，手脚也动不了，才发现中计。太阳神又当了报信人，赫淮斯托斯尚未到勒姆诺斯，就转身返家。他来到床前，狂怒得在前厅向所有神大叫，叫声惊人。
        - id: ch03-b04
          speaker: hephaestus
          emotion: angry
          text: >-
            宙斯父亲！你们这些有福、永远不死的神，都过来瞧，有个又好笑又丢脸的场面！阿佛洛狄忒这位宙斯的女儿，嫌我腿瘸，老是侮辱我。她喜欢阿瑞斯，样子美，身材好，我却有残疾。这可不是我错，是父母错，他们本来就不该生我。看看，两人睡到我床上了！看得我火都上来。他们相爱，可一有办法逃，谁还愿留着睡？恐怕也睡不成。先让她父亲退钱，我娶这个坏女儿付过的钱，全退了才能放。长得美，却不忠诚！
        - id: ch03-b05
          speaker: narrator
          text: >-
            神们都往他家聚。环抱大地的波塞冬来了，带来幸运的赫尔墨斯、阿波罗也来了。女神却脸上挂不住，没有一个出门。赐给世人好东西的男神站在门口，一看匠神使得巧，就笑个没完。一位转头对旁边的神说。
        - id: ch03-b06
          speaker: god_observer
          text: >-
            做坏事哪有好结果。身弱的还难住了身强的！赫淮斯托斯拖着瘸腿，抓到的却是跑得最快的天神。阿瑞斯，这次赔款可不会少。
        - id: ch03-b07
          speaker: narrator
          text: >-
            阿波罗在众神议论时，问起赫尔墨斯。
        - id: ch03-b08
          speaker: apollo
          text: >-
            赫尔墨斯，传令、送好运的神，我看你要能跟阿佛洛狄忒同睡，锁链多结实，你也不管吧？
        - id: ch03-b09
          speaker: hermes
          text: >-
            阿波罗君王，给我这个机会就好。哪怕锁链变成三倍，你们所有男神女神都看着，我还是愿意跟她躺一起。
        - id: ch03-b10
          speaker: narrator
          text: >-
            不死的神又大笑，波塞冬却认真得很，反复替阿瑞斯求放。
        - id: ch03-b11
          speaker: poseidon
          text: >-
            解开吧，你要担保，我就担保。诸神觉得公道的赔数，他一定会付清。
        - id: ch03-b12
          speaker: hephaestus
          text: >-
            别求我这样。给坏人作的担保，我信不过。万一他把锁链和欠账都扔下，逃出去，我拿什么办法向你讨？
        - id: ch03-b13
          speaker: poseidon
          text: >-
            赫淮斯托斯，他真不赔钱就走，我来给。
        - id: ch03-b14
          speaker: hephaestus
          text: >-
            话到这里，我不能推，也不应当推了。
        - id: ch03-b15
          speaker: narrator
          text: >-
            锁链松开，两人一自由就跑。阿瑞斯到色雷斯，爱笑的女神去塞浦路斯、去帕福斯。她的树林、祭坛在那里，香气从祭火中升起。美惠女神给她洗浴，擦上永生诸神用的神食香油，又替她穿好最动人的衣裳。

            这就是歌人刚唱的故事。奥德修斯和航海的费埃克斯人，全听得着迷。
    - id: ch04
      title: "红球与赠礼"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            国王让拉奥达马斯、哈利奥斯再单独跳，没有别人比得过他们。波吕波斯给他们做过一只红球，此刻一人把腰往后弯，抛球向云里，另一人跳离地面，轻巧接住，还没等它落下。直抛玩过，又边跳边相互传，围成一圈的年轻人不住拍手，脚下跺得响。客人于是夸道。
        - id: ch04-b02
          speaker: odysseus
          text: >-
            国王，你说这里人舞得最轻灵，果真说中了。这一场我看得惊讶，他们已证明本领。
        - id: ch04-b03
          speaker: narrator
          text: >-
            阿尔基诺奥斯很高兴，向长老们提议。
        - id: ch04-b04
          speaker: alcinous
          text: >-
            各位长老、议事者，客人这么有见识，款待也该让他满意。你们十二位首领，加上我十三个，每人送一件净披风、一件衣裳，再拿一塔兰特精金。赶快一齐送上，叫他晚饭心头痛快。欧律阿洛斯还得认真道歉，也送份礼，他刚才太没规矩。
        - id: ch04-b05
          speaker: narrator
          text: >-
            众人都称好，差仆人去拿礼物。欧律阿洛斯开口答应。
        - id: ch04-b06
          speaker: euryalus
          text: >-
            国王，要让他满意，我完全照办。这把剑给他，除了银柄，都是青铜，剑鞘也一并拿去，才用新锯象牙做的，正配这剑，对他会很值钱。
        - id: ch04-b07
          speaker: narrator
          text: >-
            他把剑放进客人手里，随即向他祝愿。
        - id: ch04-b08
          speaker: euryalus
          text: >-
            老客人，好运给你。我讲得不对的地方，就让风吹走吧。听说你在外头受苦，离家那么久，愿神送你安全回去。
        - id: ch04-b09
          speaker: odysseus
          text: >-
            朋友，你也交好运，愿众神把幸福都给你。你把歉意和剑一起送了我，希望今后不会因少了剑而受不便。
        - id: ch04-b10
          speaker: narrator
          text: >-
            他将剑挂过肩膀，日落近了，一份份礼不断进王宫，都由送礼人的仆役带来。王子们接收，交给母亲照管。国王带大家回屋，请宾客坐下，又叫阿瑞忒。
        - id: ch04-b11
          speaker: alcinous
          text: >-
            妻子，找出最好的箱子，把干净披风和衣裳放进去。铜锅架火，加水烧热，给客人洗澡。我们费埃克斯贵族送的礼，也好好收稳。这样晚饭和饭后音乐，他都能更高兴地享受。我自己再送这个金杯，手工多精。他此后一生给宙斯或别的神献酒，看它就会记起我。
        - id: ch04-b12
          speaker: narrator
          text: >-
            王后让女仆快把三足大锅架火上，锅里装洗澡水，底下明火烧着，添柴后愈来愈旺。火苗围绕锅腹跳动，水逐渐热起来。她同时从自己屋中拿好箱，费埃克斯人的漂亮衣服、金子，样样放下，最后再添国王的披风和那件好衣，叮嘱客人。
        - id: ch04-b13
          speaker: arete
          text: >-
            盖子你亲手盖好，绳子也立刻捆妥。免得归途船上睡觉，有人把财物偷走。
        - id: ch04-b14
          speaker: narrator
          text: >-
            奥德修斯听了，合盖绑结，用的是喀耳刻教他的法子。他才系牢，女管事便来请他去洗澡。他很乐意，热水正好。离开卡吕普索以来，都没有人伺候，当年在那里，女神服侍得像待神一样。女仆给他洗身、涂油，送来干净衣服披风。他从浴室出来，去同正喝酒的宾客团聚。美丽的瑙西卡在廊柱旁站着，目送他走过，带着欣赏和爱慕。
        - id: ch04-b15
          speaker: nausicaa
          text: >-
            再见，客人，回去平安到家后，可要记得我。该报的救命之恩，头一个就归我呢。
        - id: ch04-b16
          speaker: odysseus
          text: >-
            伟大国王的女儿瑙西卡，但愿宙斯，那位赫拉强大的丈夫，让我归乡。往后我一辈子都会像感激守护的神那样祝福你，毕竟性命是你救下的。
    - id: ch05
      title: "木马与泪水"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            奥德修斯坐在国王身旁，晚餐上好，酒也兑好。有人领来得摩多科斯，这位受欢迎的歌人坐进众人中间，靠着柱子，身子便能倚一倚。奥德修斯切下一块烤猪肉，带着很多肥脂，原来的大块肉上还剩不少。他叫仆人送过去。
        - id: ch05-b02
          speaker: odysseus
          text: >-
            请得摩多科斯吃这块肉。他的歌虽然让我伤感，我照样敬重他。天下人都看重歌人，缪斯爱他们，传授他们歌唱的本事。
        - id: ch05-b03
          speaker: narrator
          text: >-
            仆人用手捏着肉，送到歌人那儿，得摩多科斯收得欢喜。大家用了眼前美食，饮酒吃饱，奥德修斯就对他提出心愿。
        - id: ch05-b04
          speaker: odysseus
          text: >-
            你是我世上最敬佩的人，得摩多科斯。必是宙斯女儿缪斯，还有阿波罗教过你。不然阿开亚人回来的故事，那么多苦、那么多经历，怎么唱得这样准？不是亲眼见过，就是听亲历的人讲过。现在换个唱吧，唱木马。厄佩奥斯靠雅典娜帮忙把它做好，奥德修斯又在里头藏进后来攻城的那些人，使计运进特洛伊城堡。你若唱好，我就遍传你的名，叫世人知道神给你的才多出色。
        - id: ch05-b05
          speaker: narrator
          text: >-
            神的灵感引着歌人，他从部分阿尔戈斯人烧营帐、乘船撤走唱起。另一些人则和奥德修斯躲在木马里，等在特洛伊的集会场。因为特洛伊人已亲自把它拖进堡，大家围着商量，有三派主意。一派想当场拆了，一派要拉到城堡下面那块岩石的顶端，推下悬崖，还有一派愿留作神的祭品，讨神欢心。他们选了最后这个办法。可让木马进来的时候，这城就注定灭亡，里面最勇的阿尔戈斯人，正在等着杀害、摧毁特洛伊。
            接着，他唱战士们从马中出来，冲出埋伏地，开始攻城。阿开亚人到处奔跑，到处掠夺。奥德修斯像阿瑞斯一样猛，陪墨涅拉奥斯杀到得伊福波斯宅中，那里的战斗最烈，但雅典娜帮他，胜利仍到手。

            听着这些，奥德修斯悲痛到控制不住，泪水把脸颊打湿。仿佛一位女子，看见丈夫倒在自己城前、自己人面前。他勇敢为家和孩子战斗，到头来喘着最后一口气。妻子扑上去抱着他大叫，敌人却从背后打她双肩、打她背，抓她去做奴隶。一生辛劳悲苦，脸上美色都褪了。奥德修斯就是那样可怜地哭。别人没察觉，只有坐得近的国王听见抽泣、叹息，马上站起来。
        - id: ch05-b06
          speaker: alcinous
          text: >-
            费埃克斯的长老、议事者，叫歌人歇一歇吧，不是每位客人都听得快活。饭一吃完，得摩多科斯开唱，我们这位远客就开始哀叹。他显然压着重大的苦。先停，叫宾主都高兴才妥。今天这些宴席，送出的好礼和护送归家的安排，全为敬他而办。凡有一点善心，都知道求助的客人该像兄弟来待。
            客人，你也请开诚布公，我要问的别再藏着。真话才是礼貌。父母在家里叫什么名字唤你？邻人、同城的人又叫什么？人生来就有父母取名，无论穷富，不会全然没有姓名。再讲祖国、民族和城在哪里，我们的船好照着去。它们没领航的人，也没有别国船上的舵，却知道船上人在想什么、想去哪儿。世上所有国和城它们都认得，云雾封海也照样能走，不会破船受伤。
            不过父亲以前给过警告，我还记得。波塞冬怪我们太随便，来个人要送，我们就送。有一天，船刚护送完回航，他要毁一条，再搬高山把我们的城压住。这是父亲从前讲的，神究竟要不要如此做，全凭他自己。
            现在告诉我们，你漂流各处，去过哪些国？人怎样，城又怎样？哪些凶恶荒蛮、敌视外来人，哪些仁善、肯待客？还有，听达那奥斯这些阿尔戈斯人从特洛伊回来的事，你为何难过？他们遭到的一切，神本就安排好，故意给苦难，叫以后的人有歌可唱。莫非你在特洛伊失去妻子家的勇士，岳父或者女婿？血亲以外，这可就是最亲的亲人。又或是哪位勇敢又善良的朋友死去了？好伙伴在心里的分量，也同兄弟一样。
