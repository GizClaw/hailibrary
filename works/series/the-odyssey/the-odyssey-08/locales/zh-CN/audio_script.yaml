audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    laodamas:
      display_name: 拉奥达马斯
      tts: {delivery: "自信有礼", timbre: "年轻开朗", pace: "平稳", pitch: "中音"}
    euryalus:
      display_name: 欧律阿洛斯
      tts: {delivery: "大胆直接", timbre: "明亮有力", pace: "利落", pitch: "中低音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: "温雅坦诚", timbre: "年轻清楚", pace: "舒缓", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 他不愿参加比赛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            一早，国王领客人到港边会场。雅典娜装作王家的仆人，沿城叫人，又让奥德修斯高大健壮，受人敬重，能赢接下来的比赛。国王吩咐挑一艘新船，再配五十二名好水手。船准备好了，大家回到王宫，宴席上有牛肉、羊肉和猪肉。

            仆人领着得摩多科斯进了大厅。缪斯曾给他歌唱的天分，却又拿走了他的视力。仆人把座位安置妥当，琴、食物和酒都放在他伸手能摸到的地方。
            饭后他唱起奥德修斯和阿喀琉斯在宴上吵架。阿伽门农听见两人反目，竟然高兴，因为阿波罗早就说过会有这场争吵。也正是从这场争吵开始，宙斯给希腊人和特洛伊人带来了灾难。
            奥德修斯拉起披风，不让人看见脸上的泪。歌一停，他便擦干眼泪，再放下披风，举杯向神献酒。大家催歌者再唱，他又遮住了脸。旁人没有发现，只有坐在近处的国王听见了他的叹息。
        - id: ch01-b02
          speaker: alcinous
          text: |
            该去竞技了。让我们的客人见识见识，拳术、摔跤、跳跃、跑步，我们怎么胜过别的国家。
        - id: ch01-b03
          speaker: narrator
          text: |
            一项项比下来，跑步是克吕托纽斯第一，摔跤是欧律阿洛斯赢。安菲阿洛斯跳得最好，厄拉特柔斯掷盘最远，拉奥达马斯赢拳术。这位王子请客人一起比。
        - id: ch01-b04
          speaker: laodamas
          text: |
            船都备好了，不会耽误你回去。来试一项，也把烦恼暂时放放吧。
        - id: ch01-b05
          speaker: odysseus
          text: |
            我已经受尽苦，想着的只有家，哪还想比赛？我是来求你们相助，别再催我了。
        - id: ch01-b06
          speaker: euryalus
          text: |
            你身上可看不出半点比赛的本事。你倒像个贪财的商人，脑子里盘算的只有货物能赚多少钱。
        - id: ch01-b07
          speaker: narrator
          text: |
            奥德修斯动了怒，责备青年，模样好，不等于脑子也好。有的人长得平常，却很会说话，走到哪儿都受人尊敬。这青年却只有一张好看的脸，一说话就像傻瓜。他自己年轻时也是比赛的好手。战争、大海把他折磨成这样，可受了这番侮辱，他仍要回敬。
            他连披风都没脱，拿起比旁人更重、更大的圆盘，挥臂掷出去。圆盘呼啸着飞过，众人纷纷往旁边躲，落点远远超过先前所有的记号。雅典娜换了模样，走过去标出位置，说盲人伸手一摸，也能摸出差别，没有费埃克斯人能掷到这么远。听见有人支持，客人就叫大家来试。
            拳术、摔跤，或是赛跑，他都肯比，只有主家的王子拉奥达马斯，他不挑战。做客的人不能跟招待自己的那一家争胜。至于箭术，他说在特洛伊，只有菲罗克忒忒斯的本领比自己强。不过，赫拉克勒斯、欧律托斯那些古代英雄，他可不敢比。他们连神都敢挑战，欧律托斯就因为同阿波罗比箭，遭到杀害。他还说，自己的矛能掷得比别人的箭更远。只有跑步，他没把握，海上缺粮，已经把他熬得衰弱。
            满场都静着，没人接话。国王承认客人受了冒犯，却又改了口，说拳术、摔跤算不上他们的长处。他们拿手的是跑步、航海和歌舞，也爱美食、热水澡、舒服的床。这回，还是请客人看看他们跳舞吧。
    - id: ch02
      title: 歌里的锁链
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            琴拿来了，场地也腾好了，青年们开始跳舞。歌者改唱战神阿瑞斯和爱神阿佛洛狄忒偷情的事。

            爱神背着丈夫赫淮斯托斯，跟战神睡在自家的床上。太阳神把看见的私情告诉了丈夫。赫淮斯托斯非常愤怒，造出极细的锁链，连神也看不见，却怎么也挣不断。他用锁链布满床铺，假装出发去楞诺斯。
            战神一看他走，就来邀爱神上床。她欣然同意。两人一躺，便被链条缠住，连手脚都动不了。太阳神再去报信，丈夫赶回来，叫所有神来看。
            他气得骂妻子，说她嫌自己跛脚，爱战神的好模样。要放他们，就得叫宙斯退还当初为女儿收下的婚礼财物。
            男神们围过来，笑得停不下来。跑得最快的战神，竟被跛脚的匠神抓住了。女神们觉得羞耻，谁也没来。阿波罗问赫尔墨斯，要是能跟爱神睡在一起，肯不肯被这些链条锁住？赫尔墨斯说，锁链再多三倍也肯，所有男神女神都来看，他也肯。众神又大笑起来。
            只有波塞冬认真替战神求情，担保他会赔偿。赫淮斯托斯却不相信坏人的保证。阿瑞斯要是逃掉，留下的债，又能找谁要？波塞冬便答应，阿瑞斯真跑了，这钱就由自己来付。匠神这才解开锁链。战神逃去色雷斯，爱神到了塞浦路斯的帕福斯，美惠女神替她洗澡、抹油，再给她穿上美丽的衣裳。
            奥德修斯和本国人都听得高兴。拉奥达马斯和兄弟又跳舞传红球，一人高抛，一人跳起来接。客人称赞，国王也满意，请首领们送礼，再叫欧律阿洛斯来赔罪。
            青年献了佩剑，青铜剑身，银柄配象牙鞘。
        - id: ch02-b02
          speaker: euryalus
          text: |
            我刚才那番话，错在我，别再记着了。希望你顺顺利利到家，往后的日子少些苦。
        - id: ch02-b03
          speaker: narrator
          text: |
            奥德修斯接过礼物，也祝他幸福，希望他往后不会因为少了这把剑而吃亏，随后把剑佩到肩上。
            国王和另外十二位首领，各送斗篷、长衣和一塔兰同黄金。傍晚，王后收好陆续送到的礼，放入箱中，也加上国王的衣物。国王另给金杯，想让他将来向神献酒时记得自己。
            王后怕他在船上睡着时遭人偷窃，就嘱咐他把箱盖绑牢。他打了喀耳刻教过的绳结，系好箱子，才去洗热水澡，换上干净衣服。回到厅堂，瑙西卡正站在柱旁，向他告别。
        - id: ch02-b04
          speaker: nausicaa
          text: |
            等你安稳回家，别忘记最先救你的人。
        - id: ch02-b05
          speaker: odysseus
          text: |
            愿宙斯让我回去。你救了我的命，我会一辈子敬你，像敬保护我的神一样。
    - id: ch03
      title: 木马与眼泪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            客人又坐到国王旁边，歌者也被引来。他切下好肉，请人送给歌者。歌声让他痛苦，他还是敬重歌者。饭后，他又主动请歌者再唱。
        - id: ch03-b02
          speaker: odysseus
          text: |
            你唱得这样准确，就像亲眼在场，或者听经历过的人讲过。再唱那匹木马吧，厄佩奥斯造的，雅典娜也出了力。里面的人怎样进城？这段若唱得好，我一定到处赞扬神给你的天分。
        - id: ch03-b03
          speaker: narrator
          text: |
            歌者唱起希腊人怎样离开营地。一部分人烧了营帐，乘船退走，奥德修斯和勇士们却藏进马腹。特洛伊人把木马拖入城里，围着它商量，有人主张拆开，有人要从高处推下，也有人想留下献给神。

            木马最终留在了城里。

            藏着的人出来攻城，在街上杀掠。奥德修斯和墨涅拉奥斯杀进得伊福波斯的家，打得最激烈，靠雅典娜帮助取胜。
            奥德修斯又哭了，就像一个扑在丈夫身上痛哭的女人。丈夫为守住城池和家人而战，正在她怀里断气，敌人却打她的肩膀和后背，拖她去做奴隶。只有近旁的国王察觉，听见他在抽泣。国王起身叫停，说宴席、礼物和护送是给客人准备的，不能只让主人高兴，他却受苦。求助的人应当像兄弟般对待。
        - id: ch03-b04
          speaker: alcinous
          text: |
            请别再瞒着。告诉我名字和家乡，我们才能送你。
        - id: ch03-b05
          speaker: narrator
          text: |
            国王接着解释，这里的船不靠舵，也不需要谁来掌方向。人心里要去哪儿，船就知道，各国各城它都认得，雾再浓也挡不住。不过父亲留下过警告，替外乡人送行太多，波塞冬终有一天会毁掉他们一艘回航的船，再用山把整座城压住。这话究竟会不会成真，还得看神怎样决定。
        - id: ch03-b06
          speaker: alcinous
          text: |
            你一路走过哪些地方？那里的人怎样待你，谁肯帮忙，谁又伤害了你？一唱到特洛伊，你怎么就这样难过？神把这些灾祸降给人，就是要让后世的人唱下去。那场仗，是夺走了你的亲人，还是夺走了你看作兄弟的同伴？
