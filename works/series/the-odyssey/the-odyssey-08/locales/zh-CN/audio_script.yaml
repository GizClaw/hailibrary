audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    alcinous:
      display_name: 阿尔基诺奥斯
      tts: {delivery: "好客而有威严", timbre: "浑厚温暖", pace: "稳重", pitch: "中低音"}
    laodamas:
      display_name: 拉奥达马斯
      tts: {delivery: "自信有礼", timbre: "年轻开朗", pace: "平稳", pitch: "中音"}
    euryalus:
      display_name: 欧律阿洛斯
      tts: {delivery: "大胆直接", timbre: "明亮有力", pace: "利落", pitch: "中低音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    nausicaa:
      display_name: 瑙西卡
      tts: {delivery: "温雅坦诚", timbre: "年轻清楚", pace: "舒缓", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 歌声一起，他便遮住了脸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            清早，国王带奥德修斯到港边开会。雅典娜变成王家的仆人，把居民叫来，又使奥德修斯显得更高大健壮，让人敬重，也让他能在接下来的比赛中获胜。国王选了五十二名水手，叫他们准备新船。备好后，大家回宫吃牛羊和猪肉的宴席。
            有人领着得摩多科斯进厅。缪斯给他歌唱的才能，却夺走了视力。侍从把琴和酒食放在他摸得到的地方。饭后，他唱起奥德修斯和阿喀琉斯争吵的往事。阿伽门农听见争吵，反而高兴。阿波罗早有神谕，预告了这件事，它也成了宙斯带给双方灾祸的开头。
            四周的人听得很专心。奥德修斯却用披风遮住了脸。
            琴声一停，他就擦掉泪，放下披风。众人请歌者继续，他又遮着脸。坐得近的国王听见了叹息，别人却没发觉。他没有追问，先叫大家出去。
        - id: ch01-b02
          speaker: alcinous
          text: |
            大家出去比赛吧。让客人看看，我们的拳术、摔跤、跳跃和跑步，怎样胜过别国的人。
        - id: ch01-b03
          speaker: narrator
          text: |
            克吕托纽斯跑得最快，欧律阿洛斯赢了摔跤，安菲阿洛斯赢跳跃，厄拉特柔斯掷盘最远，拉奥达马斯赢拳术。
            王子拉奥达马斯来请他参加。
        - id: ch01-b04
          speaker: laodamas
          text: |
            船都准备好了，不急着走。你也来比一项，好吗？
        - id: ch01-b05
          speaker: odysseus
          text: |
            为什么催我？我有太多苦恼，只想着回家，不想比赛。我是来求你们帮忙的。
        - id: ch01-b06
          speaker: narrator
          text: |
            欧律阿洛斯却出言侮辱。
        - id: ch01-b07
          speaker: euryalus
          text: |
            你不是竞技好手，倒像个贪钱的商人，成天只想货物和利润。
    - id: ch02
      title: 盘落在所有记号以外
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            奥德修斯生气地说，好看不等于聪明。相貌普通的人，能靠谈吐赢得尊敬。这青年虽有好模样，却像傻瓜一样说话。他自己年轻时是出色的竞技者，虽受了战争和海上的苦，也要回答这样的侮辱。
            披风还穿在身上，他便挑了一个更大更重的盘，挥臂扔了出去。盘带着响声飞过，大家向旁边躲开。它落得很远，超过了原先所有的记号。
            雅典娜换了模样，去标出落点，说连盲人也摸得出来，比其他人远太多了。听见有人站在自己这边，奥德修斯便让众人来试。
            拳术、摔跤、跑步都能比，只是不挑战拉奥达马斯。客人不该同主人的家人争胜。他说，特洛伊只有菲罗克忒忒斯射箭胜过自己。他不跟赫拉克勒斯、欧律托斯这些古人比，他们曾挑战神。欧律托斯就因为同阿波罗比箭，被神杀死。他的长矛比别人的箭还远，只有跑步，自己受了海上的饥饿，已经衰弱，怕会输。
            没有人应声。国王上前，把话转开。
        - id: ch02-b02
          speaker: alcinous
          text: |
            你的力气，我们都看见了。现在，请你欣赏一下我们的舞蹈吧。
        - id: ch02-b03
          speaker: narrator
          text: |
            国王先前夸过拳术、摔跤，现在却承认，那不是本国最强的本领。他们善跑、善航海，也善歌舞，喜欢好饭、热浴和好床。琴拿来，地方腾好，青年们起舞。
            得摩多科斯唱阿瑞斯和阿佛洛狄忒偷情，睡在她丈夫的床上。太阳神发现，告诉了赫淮斯托斯。匠神气坏了，造出神也看不见、挣不断的细锁链，铺在床上，假装去了楞诺斯。阿瑞斯见他出门，就来约阿佛洛狄忒同床。她愿意，两人却一躺下就被捆住，什么也动不了。
            太阳神再次报信，匠神赶回，叫诸神来看，说妻子嫌他跛脚，爱上了俊美的战神。他要把两人关着，等宙斯退还为女儿收下的婚礼财物。男神们来围观，大笑不止。女神们害羞，没有来。跑得快的战神，输给了跛足的匠神。
            阿波罗问赫尔墨斯，为了同阿佛洛狄忒睡觉，肯不肯受这些锁链？赫尔墨斯说，哪怕再多三倍，所有男神女神都看着，也肯。大家又笑。波塞冬认真求他放人，保证战神会赔偿。匠神不放心，战神要是逃了，钱向谁要？波塞冬说，到时自己赔。他才解开锁链。阿瑞斯跑去色雷斯，阿佛洛狄忒去了塞浦路斯的帕福斯，美惠女神给她洗澡、抹油、更衣。
            奥德修斯和本国人都很喜欢这支歌。接着，拉奥达马斯和兄弟跳着舞传红球。球抛得高，接得准，步子也没乱。奥德修斯细看了一阵，开口赞扬他们。
            国王很高兴，请首领们送些衣服和黄金给客人，又提醒欧律阿洛斯，他也该为刚才的话做点什么。
        - id: ch02-b04
          speaker: alcinous
          text: |
            欧律阿洛斯，你过来。那些话，还得你亲自向客人解释。
        - id: ch02-b05
          speaker: narrator
          text: |
            青年献出青铜剑，配着银柄、象牙剑鞘，向客人认错。
        - id: ch02-b06
          speaker: euryalus
          text: |
            刚才是我说得太过分了。把这把剑收下吧。祝你以后一路顺利。
        - id: ch02-b07
          speaker: narrator
          text: |
            奥德修斯接了剑，向他祝福。
        - id: ch02-b08
          speaker: odysseus
          text: |
            愿你也幸福。希望送出这把剑，不会让你有所欠缺。
    - id: ch03
      title: 客人点了一首木马的歌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            他把剑佩到肩上。十三位首领，包括国王，各给一件斗篷、一件长衣和一塔兰同黄金。到了傍晚，阿瑞忒装箱，再放进国王的衣物。国王还给金杯。王后叫他绑紧盖子，防着在船上睡着时被偷。他用喀耳刻教的结绑好了，才去洗热水澡。
            洗过澡，换过衣服，他身上松快了些。走回厅里时，瑙西卡站在柱旁。
        - id: ch03-b02
          speaker: nausicaa
          text: |
            平安回家后，别忘记我。你得先记住，是我救了你的命。
        - id: ch03-b03
          speaker: narrator
          text: |
            他停住脚，认真地回答。
        - id: ch03-b04
          speaker: odysseus
          text: |
            愿宙斯让我回去。我会一辈子敬你，如同保护我的神，是你救下了我。
        - id: ch03-b05
          speaker: narrator
          text: |
            入席后，奥德修斯看见歌者也来了，就切下一块好肉，请人送给他。虽然歌声让自己难受，可他不怨歌者。正是这个人，把旧事唱得像又发生了一遍。
            饭吃完了，他还主动请歌者接着唱。
        - id: ch03-b06
          speaker: odysseus
          text: |
            你唱得这么准，就像自己见过，或者听在场的人讲过。下一段唱好，我一定到处称赞神给你的才能。
            请唱木马那一段吧。就是厄佩奥斯在雅典娜帮助下造的那匹木马。唱唱里面的人是怎样进城的。
        - id: ch03-b07
          speaker: narrator
          text: |
            得摩多科斯唱到一部分希腊人烧营帐、乘船退走。奥德修斯和勇士们藏在马里。特洛伊人把它拖进城门，有的想拆开，有的要从高处推下去，还有的要留给神。
            他们把木马留住了。
            勇士出了木马，在街上杀人、抢掠。奥德修斯和墨涅拉奥斯攻到得伊福波斯的家，那里打得最凶，雅典娜帮助他们获胜。
            奥德修斯哭了，像个抱着垂死丈夫的女人。丈夫为了守家而死，敌人却还打她的肩背，把她拖走做奴隶。只有坐在近处的国王，发觉他的泪，听见他的哭声，便站起来。
        - id: ch03-b08
          speaker: alcinous
          text: |
            停一停，先别唱了。
        - id: ch03-b09
          speaker: narrator
          text: |
            琴声停了。国王说，宴席、礼物和护送都是为了客人，大家该把求助的人当成兄弟。
        - id: ch03-b10
          speaker: alcinous
          text: |
            你家究竟在哪里？我们要送你去哪里，又该叫你什么名字？
        - id: ch03-b11
          speaker: narrator
          text: |
            本国的船不用舵，也不用掌舵人，能懂人的心意，认得各地，不怕云雾。国王的父亲却说过，他们送走太多人，波塞冬也许会发怒，毁掉一艘归船，还要把城压在山下。会不会应验，国王说，由神决定。
        - id: ch03-b12
          speaker: alcinous
          text: |
            你还去过哪里？哪些人招待了你，哪些人伤害了你？特洛伊的歌，为什么叫你这么难过？诸神安排那些祸事，是为了让后人传唱。你失去了亲戚，还是亲如兄弟的朋友？
