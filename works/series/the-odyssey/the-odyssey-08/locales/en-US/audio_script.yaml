  chapters:
    - id: ch01
      title: "The singer at the feast"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Rosy-fingered Dawn, the child of morning, appeared. Alcinous and Ulysses rose, and the king led his guest to the Phaeacians' assembly place beside the ships. There they sat next to one another on a bench of polished stone.
            Minerva took the appearance of a servant from Alcinous's house. She wanted to help Ulysses on his journey home, so she went through the town, approaching the citizens one by one.
        - id: ch01-b02
          speaker: athena
          text: >-
            Elders and councillors of the Phaeacians, come to the meeting. All of you should hear this stranger at the king's house. He's arrived after a long sea voyage, and he looks like one of the immortal gods.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Her words made them eager to see him. They crowded into the assembly until every seat was filled and even the standing places were packed. Ulysses' appearance astonished them. Minerva had made his head and shoulders more beautiful. He seemed taller and more powerfully built than he really was. She wanted the people to think well of him as a remarkable man, and she wanted him to succeed in the many tests of skill they would soon put before him. When everyone had gathered, Alcinous addressed them.
        - id: ch01-b04
          speaker: alcinous
          text: >-
            Elders and councillors, let me tell you what I propose. We don't yet know this stranger's name or whether he comes from the east or the west. But he has reached my house and asks us to take him home. He wants the arrangements settled. Let's prepare his escort, as we have for other people. No visitor to my house has ever had cause to say I was slow in helping him leave. Launch a ship that has never sailed before, and choose fifty-two of our most capable young sailors. Fasten each oar beside its own man's seat. Then leave the vessel and come to my house to prepare the feast. I'll supply everything needed. Those are my instructions to the young men who will be the crew. The rest of you elders and councillors must join me in entertaining our visitor in the cloister. I won't accept excuses. Send for Demodocus too. Whatever story he chooses to sing, no bard can match him.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Alcinous left the assembly at the head of the company, and the others followed him. One servant went to fetch Demodocus. Meanwhile the fifty-two young men chosen to row the ship made their way down to the shore, carrying out the king's instructions. They drew the vessel into the sea and brought the mast and sails aboard. The oars had to be fastened to their pins, and for that they used twisted strips of leather. Once everything had been fitted in its proper order, they spread the white sails above the deck. They left the ship moored a short distance from the shore. Then they returned to land and went to join the feast at King Alcinous's house.
            There was a great gathering waiting there. The buildings around the main house were full of people, and so were the yards and the spaces surrounding them. Old men and young men had come in crowds. To make a meal worthy of them, Alcinous had twelve sheep killed, together with eight pigs that had reached their full size and two oxen. The skins were removed and the meat prepared. Everything was made ready for a splendid feast.
            Soon a servant arrived, leading the famous singer Demodocus. The Muse had loved this man very much. But her favour had brought him something bad as well as something good. She had taken his eyesight from him. She had also given him the divine power of singing. Pontonous set his chair among the other guests and rested it against one of the posts that supported the roof. The lyre was hung on a peg above the singer's head. Pontonous made sure he knew where to reach for it and find it with his hands. At his side he placed a handsome table, with a basket holding food. A cup of wine stood ready too, so the blind singer could take a drink whenever he felt the wish.
            The guests began to eat. When everyone had enough food and wine, the Muse stirred Demodocus to sing about the great deeds of heroes. His song told a story that was on everyone's lips, the quarrel between Ulysses and Achilles. At a feast those two had flung angry words at each other. Agamemnon was pleased when he heard his captains quarrelling. Apollo had foretold this moment at Pytho, when Agamemnon crossed the stone floor to ask the oracle. It marked the beginning of the suffering Jove had planned for Danaans and Trojans alike.

            As the bard sang, Ulysses drew his purple cloak over his head. He hid his face because he was ashamed to let the Phaeacians see his tears. Whenever the song paused, he wiped his eyes, uncovered his head, and lifted his cup to pour an offering. But the listeners loved the story and asked Demodocus to continue. Then Ulysses covered himself once more and wept bitterly. Only Alcinous noticed. He was close enough to hear the deep sighs. He spoke at once.
        - id: ch01-b06
          speaker: alcinous
          text: >-
            Elders and councillors, we've had plenty of food, and plenty of the music that belongs with it. Let's turn to the games. When our guest reaches home, he can tell his friends how far we surpass other peoples at boxing, wrestling, jumping, and running.
    - id: ch02
      title: "The challenge on the field"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The king rose to lead them, and the rest of the company came after him. A servant put Demodocus's lyre back on its peg, took the singer out of the cloister, and guided him towards the games. He set him on the very same road that the leading men of the Phaeacians were following. A crowd numbering several thousand people followed behind. Among them were many skilled competitors, with good men ready for every prize to be won.
            Among them were Acroneos, Ocyalus, Elatreus, Nauteus, Prymneus, Anchialus, Eretmeus, Ponteus, Proreus, Thoon, and Anabesineus. There was Amphialus too, the son of Polyneus and grandson of Tecton. Euryalus, son of Naubolus, looked like Mars himself. Only Laodamas was handsomer among all the Phaeacians. Three of the king's sons competed, Laodamas, Halios, and Clytoneus.
            First came the race on foot. They marked out the course, measuring the way from its starting post. The runners all shot forward at the same moment. Dust rose under their feet as they ran over the level ground. Clytoneus reached the end well before anyone else. Think of the length of a furrow that a pair of mules can turn across a field left fallow. That was the distance between him and the other runners. They next tried wrestling, the hard sport that puts a man's body through pain. Euryalus showed himself the strongest wrestler. When it came to jumping, Amphialus went farther than all the rest. In throwing the disc, none of the competitors could reach Elatreus's mark. Laodamas, the king's son, was the best with his fists in the boxing. The company had enjoyed all these contests when Laodamas suggested inviting their visitor to take part.
        - id: ch02-b02
          speaker: laodamas
          text: >-
            Why not ask the stranger which of these skills he has? Look at the man's build. His thighs, his calves, his hands, and his neck are wonderfully strong. He's not old either. He has clearly suffered lately, though. Nothing wears a man down like the sea, however strong he starts out.
        - id: ch02-b03
          speaker: euryalus
          text: >-
            You're right, Laodamas. Go and ask him yourself. He's your guest.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Laodamas walked into the middle of the gathering and addressed Ulysses.
        - id: ch02-b05
          speaker: laodamas
          text: >-
            Sir, if you have a skill in any of these sports, I hope you'll join us. You must have tried many of them before. Nothing brings a man greater honour through his life than showing what his hands and feet can do. Enter one of the contests and put your sadness aside. Your voyage won't be held up for long. The ship is afloat already, and we've found your crew.
        - id: ch02-b06
          speaker: odysseus
          text: >-
            Laodamas, why tease me with this? My thoughts are on my troubles, not on winning games. I've suffered more than I can tell. I came here to ask help from your king and people, so I could find my way home.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Euryalus now insulted him openly.
        - id: ch02-b08
          speaker: euryalus
          text: >-
            Then you know nothing of the sports other men enjoy. I take you for one of those greedy traders who sail about as merchants and captains. You think only of the cargo going out and what you'll carry home. There's little sign of an athlete in you.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Ulysses answered fiercely.
        - id: ch02-b10
          speaker: odysseus
          emotion: angry
          text: >-
            You should be ashamed. What an insolent man you are! The gods certainly don't give everyone equal gifts of speech, looks, and judgement. A man may have an unimpressive face and body, yet speak so well that everyone who meets him is charmed. He talks with sweetness and restraint. People listen willingly, follow his advice in their assemblies, and honour him wherever he goes. Another man may look like a god and still have no good sense to go with it. That is you. A god couldn't make you handsomer, but you're a fool. Those thoughtless words have angered me deeply, and you've judged me wrongly. I excel at many sports. When I was young and strong, few athletes of my time were better. Now hard work and grief have worn me down. I've suffered on battlefields and out on that exhausting sea. Even so, I'll compete. Your mockery has struck too deep for me to leave it unanswered.
        - id: ch02-b11
          speaker: narrator
          text: >-
            He strode forward without even removing his cloak. He took a disc much bigger, thicker, and heavier than the ones the Phaeacians used among themselves. Swinging it back, he hurled it from his powerful hand. It hummed as it flew. The Phaeacians shrank from the rush of its smooth flight. It passed every mark the other throwers had made. Minerva, disguised as a man, marked where it fell.
        - id: ch02-b12
          speaker: athena
          text: >-
            Sir, even a blind man could feel his way to your mark and know it. It's so much farther than the rest. You needn't worry about this contest. No Phaeacian will reach a throw like that.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Ulysses was glad to hear a friendly voice among the spectators. He spoke more pleasantly now.
        - id: ch02-b14
          speaker: odysseus
          text: >-
            Young men, try to reach that mark. I can throw another disc just as heavy, or heavier still. Anyone who wants a contest with me can come forward. I'm still very angry. Boxing, wrestling, running, I'll try any of them against any man here except Laodamas. I won't compete with him, because I'm his guest and friend. A visitor shouldn't challenge his host's family, especially in a foreign land. That wouldn't be sensible. He would undermine his own position. But I exclude no one else. Let's settle who's best. I know every kind of sport people practice, and I'm especially good with a bow. In battle, however many men beside me aim at the same enemy, my arrow is always first to bring him down. When we Achaeans fought and practiced at Troy, only Philoctetes was a better archer than I was. Of all the others still living on this earth and eating its bread, I surpass them by far. I wouldn't compete with mighty men who are dead, such as Hercules or Eurytus of Oechalia. They could challenge the gods themselves. That's how Eurytus lost his life too soon. He challenged Apollo with the bow, and the angry god killed him. I can throw a spear farther than another man can shoot an arrow. Only in running might a Phaeacian beat me. That time at sea brought me very low. My food ran short, and I haven't recovered my strength.
        - id: ch02-b15
          speaker: narrator
          text: >-
            No one answered except Alcinous.
        - id: ch02-b16
          speaker: alcinous
          text: >-
            Sir, we've enjoyed hearing you. I see that you mean to show your strength because one of our men has offended you. Nobody who knows how to speak properly would have said what he did. I hope you'll understand what I mean now. When you're home, dining with your family and the leaders of your people, tell them that we have inherited a gift for many kinds of skill. We're not particularly great at boxing or wrestling. But we run wonderfully fast, and we are excellent sailors. We love a fine dinner, singing, and dancing. We also like fresh linen often, warm baths, and comfortable beds. Let our best dancers begin. Then our guest can tell his friends how we surpass other nations in sailing, running, dance, and song. Demodocus left his lyre at my house. Someone run and bring it for him.
        - id: ch02-b17
          speaker: narrator
          text: >-
            A servant hurried back to the palace. Nine men had been appointed to manage the games. They stepped forward to arrange the dancing ground, making it smooth and marking out a wide space. The servant returned with the lyre. Demodocus took his place in their midst, and the town's finest young dancers began. Their feet moved so lightly and so merrily that Ulysses watched with delight.
    - id: ch03
      title: "The net of Vulcan"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Demodocus now sang of the love between Mars and Venus, and how their secret affair began in Vulcan's house. Mars gave Venus many presents and dishonoured her husband's marriage bed. The Sun saw what they were doing and told Vulcan.
            Such dreadful news filled Vulcan with anger. He went into the workshop where he did his smithing, turning over a plan to punish them. He moved his great anvil into position and set to work on chains. He would forge them so that no one could loosen the links and no one could break free. Whoever they caught would stay exactly where the trap held them. Once he had finished making this snare, he took it to his sleeping room. He wound chains round the posts of the bed, draping them like the strands of a spider's web. Many more hung from the great roof beam above it. The links were so fine, so skillfully hidden in their thinness, that even an immortal would not be able to see them.
            With the whole bed covered in his trap, Vulcan acted as though he was setting out on a journey to lovely Lemnos. It was the place he liked more than any other on earth. But Mars wasn't careless about watching him. The moment he saw Vulcan leave, he hurried towards the house, full of his burning love for Venus. She had only just come back from a visit to her father Jove and was preparing to sit down. Before she did, Mars arrived inside and clasped her hand in his own.
        - id: ch03-b02
          speaker: ares
          text: >-
            Come, let's lie on Vulcan's couch. He's away from home, gone to Lemnos and the Sintians, with their strange, barbarous speech.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Venus was willing enough. They went to the couch, and the trap caught them. They could not rise or move a hand or foot. Too late, they understood what Vulcan had set for them. He had not even reached Lemnos when the Sun, keeping watch, reported what was happening. He turned back. In a furious rage he came to the house and stood in the entrance hall, shouting loudly for all the gods to hear.
        - id: ch03-b04
          speaker: hephaestus
          emotion: angry
          text: >-
            Father Jove! All you blessed gods who live for ever! Come and look at this ridiculous, shameful sight. Venus, Jove's daughter, is always dishonouring me because I limp. She loves Mars because he's handsome and well made. I'm a cripple, yes, but blame my parents, not me. They should never have brought me into the world. Look at these two asleep together in my own bed. The sight makes me furious. They're very fond of each other, but I doubt they'll choose to stay there a moment longer than they must. I doubt they'll do much sleeping either. Still, they won't leave until her father gives back what I paid for this worthless daughter of his. She's beautiful, but she isn't faithful.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The gods gathered at Vulcan's house. Neptune, who encircles the earth, came, and so did Mercury, bringer of luck, and King Apollo. The goddesses were ashamed and all stayed at home. The gods who give good things to humankind stood in the doorway. When they saw the clever trap Vulcan had made, they burst into laughter that seemed never to end. One turned towards another and commented.
        - id: ch03-b06
          speaker: god_observer
          text: >-
            So much for doing wrong. Even someone weak can outwit the strongest. Look at lame Vulcan! He limps, but he's caught the fastest god in heaven. Mars will have a heavy price to pay now.
        - id: ch03-b07
          speaker: narrator
          text: >-
            While they talked, Apollo put a question to Mercury.
        - id: ch03-b08
          speaker: apollo
          text: >-
            Mercury, messenger and giver of good fortune, would you mind how strong those chains were if you could lie beside Venus?
        - id: ch03-b09
          speaker: hermes
          text: >-
            King Apollo, I only wish I had the chance. Let there be three times as many chains. Let every god and goddess stand and watch. I'd still sleep with her if I could.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The immortals roared with laughter again. Neptune did not join their joking. He took the matter seriously and kept asking Vulcan to free Mars.
        - id: ch03-b11
          speaker: poseidon
          text: >-
            Let him loose. I'll guarantee what you ask. He'll pay the full amount that the immortal gods consider a fair settlement.
        - id: ch03-b12
          speaker: hephaestus
          text: >-
            Don't ask that of me. A guarantee for a bad man is poor security. If Mars walks off and leaves his debt behind with his chains, how could I make you answer for it?
        - id: ch03-b13
          speaker: poseidon
          text: >-
            Vulcan, if he goes without paying you, I'll pay it myself.
        - id: ch03-b14
          speaker: hephaestus
          text: >-
            On those terms I can't refuse you, and I ought not to.
        - id: ch03-b15
          speaker: narrator
          text: >-
            He released the bonds. As soon as the lovers were free, they hurried away. Mars went to Thrace. Laughter-loving Venus went to Cyprus, to Paphos, where her grove and altar were fragrant with burned offerings. There the Graces bathed her and rubbed her with the ambrosial oil used by the immortals. They dressed her in clothes of enchanting beauty.

            That was the song Demodocus sang. Ulysses and the Phaeacians who sailed the seas listened, charmed by it.
    - id: ch04
      title: "Dancing and gifts"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Alcinous called on Laodamas and Halius to dance by themselves. No one else could compete with them. They took a red ball made for them by Polybus. One bent backwards and threw it towards the clouds. The other sprang from the ground and caught it easily before it could come down. After throwing it straight upward like that, they began dancing while they tossed it to and fro. The young men standing in a circle applauded and stamped their feet loudly. Ulysses spoke to the king.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Alcinous, you told me your people danced more nimbly than anyone in the world. They've proved it now. I was amazed watching them.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The king was delighted by the praise. He called to his people.
        - id: ch04-b04
          speaker: alcinous
          text: >-
            Elders and councillors, our guest has remarkable judgement. Let's show him the hospitality he has every right to expect. There are twelve leading men among you. With me, that makes thirteen. Each should give him a clean cloak, a shirt, and a talent of pure gold. Bring it all together and give it now, so he can sit down to supper with a happy heart. Euryalus must make a proper apology as well as a gift, because he spoke rudely.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Everyone approved and sent servants to collect the gifts. Euryalus answered Alcinous.
        - id: ch04-b06
          speaker: euryalus
          text: >-
            King Alcinous, I'll satisfy the stranger as fully as you ask. I'll give him my sword. The blade is bronze, and its hilt is silver. He shall have its sheath too, made of freshly cut ivory. That will be a valuable gift for him.
        - id: ch04-b07
          speaker: narrator
          text: >-
            He put the sword into Ulysses' hands and spoke to him directly.
        - id: ch04-b08
          speaker: euryalus
          text: >-
            Good fortune to you, old friend. Whatever I said wrongly, let the wind carry it away. May the gods bring you home safely. I understand you've been far from home a long time and have suffered greatly.
        - id: ch04-b09
          speaker: odysseus
          text: >-
            Good fortune to you too, my friend. May the gods give you every happiness. I hope you won't feel the lack of the sword you've offered with your apology.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Ulysses fastened the sword across his shoulders. As sunset approached, servants began arriving at Alcinous's palace with gifts from their masters. The king's sons received them and placed them in their mother's care. Alcinous then led the way indoors and invited his guests to sit down. He turned to Arete.
        - id: ch04-b11
          speaker: alcinous
          text: >-
            Wife, bring the finest chest we have. Put a clean cloak and shirt inside. Set a copper pot over the fire and heat water for our guest's bath. Pack all the gifts from our noble people carefully too. Then he'll enjoy supper and the singing afterwards all the more. For my own gift, I'll add this beautifully worked gold cup. Throughout his life, whenever he pours an offering to Jove or any god, I want it to remind him of me.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Arete told the maids to hurry and put a large three-legged pot over the fire. They filled it with bath water and set it above the clear flames. More sticks made the fire blaze. The flames played round the belly of the pot, and the water grew hot.
            Meanwhile Arete fetched a splendid chest from her own room. She packed inside it all the fine clothing and gold the Phaeacians had brought. Last she added Alcinous's cloak and good shirt, then spoke to Ulysses.
        - id: ch04-b13
          speaker: arete
          text: >-
            Close the lid yourself, and bind the whole chest straight away. You don't want someone stealing from you on the journey while you sleep aboard the ship.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Ulysses shut the lid and tied it fast with a knot Circe had taught him. He had finished before the housekeeper came to call him to his bath. Warm water was a great pleasure to him. No one had waited on him since he left Calypso's house. While he lived with her, she had cared for him as if he were a god.
            The servants washed him, rubbed him with oil, and gave him a clean shirt and cloak. He left the bathing room to join the guests at their wine. Beautiful Nausicaa stood beside a pillar holding up the cloister roof. She watched him pass with admiration.
        - id: ch04-b15
          speaker: nausicaa
          text: >-
            Farewell, stranger. When you're safely home, remember me. The first debt you owe for saving your life is to me.
        - id: ch04-b16
          speaker: odysseus
          text: >-
            Nausicaa, daughter of mighty Alcinous, may Jove, Juno's powerful husband, let me reach my home. If he does, I'll bless you all my days as the guardian who saved me. My life was your gift.
    - id: ch05
      title: "The wooden horse"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Ulysses sat beside Alcinous. Supper was served, and wine was mixed for the guests. A servant guided the much-loved Demodocus into their midst and placed him near a supporting pillar, so he could lean against it. Ulysses cut a piece from the roast pork. It had plenty of fat, and there was plenty still left on the joint. He gave an instruction to a servant.
        - id: ch05-b02
          speaker: odysseus
          text: >-
            Bring this pork to Demodocus and ask him to eat it. His songs may cause me pain, but I'll honour him just the same. Singers are loved and respected everywhere. The Muse teaches them their art and cares for them.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The servant carried the meat in his fingers to Demodocus. The bard took it gladly. They all ate the fine food set before them. When they had enough to eat and drink, Ulysses addressed the singer.
        - id: ch05-b04
          speaker: odysseus
          text: >-
            Demodocus, I admire you more than any other man. The Muse, Jove's daughter, and Apollo must have taught you. You tell the Achaeans' return so faithfully, all their sufferings and adventures. If you weren't there yourself, someone who was must have told you. Now change the song. Tell us of the wooden horse that Epeus built with Minerva's help. Tell how Ulysses filled it with the men who would sack Troy, and by his clever plan brought it inside the fortress. Sing that story truly, and I'll tell the whole world what wonderful gifts heaven has given you.
        - id: ch05-b05
          speaker: narrator
          text: >-
            With inspiration from heaven, the bard began at the moment when some of the Argives set their tents alight and left in their ships. The rest had stayed behind, hidden inside the horse with Ulysses. They waited in the place where the Trojans held their assemblies. It was the Trojans themselves who had pulled the wooden horse into the fortress. Now it stood among them while they gathered round to decide what should be done with it.
            They had three different plans. One group wanted to smash the thing apart, then and there. Another wanted to drag it to the summit of the rocky height on which the fortress was built, and throw it down the steep cliff. Others thought they should keep it standing as a gift to the gods, an offering to make the gods well disposed towards them. In the end they agreed on keeping it. But taking that horse within their walls had already doomed the city. All the bravest Argives were inside, waiting for the chance to bring death and ruin to the Trojans.
            Next the singer told how the Achaean warriors came pouring out of the horse. They broke out from their place of ambush and began to sack the town. They ran here and there through its streets, overrunning it and taking what they found. He sang of Ulysses going to Deiphobus's house with Menelaus, raging in battle like Mars himself. At that house the struggle was more furious than anywhere else. Still, with Minerva helping him, Ulysses won the victory.

            While the singer told all this, grief overcame Ulysses and the tears made his cheeks wet. He cried like a woman who finds her husband fallen outside his own city, before the eyes of his own people. He has been fighting bravely to protect his house and his children, and now he lies dying. She cries out and throws herself over his body. She holds him in her arms while he gasps for the breath that is leaving him. But enemy men come upon her from behind and beat her across the shoulders and back. They take her away to be a slave. What waits for her is a life of hard work and sorrow, and the beauty in her cheeks fades away. Just as bitterly and pitifully as that woman, Ulysses wept over the story he was hearing.
            No one in the company noticed except Alcinous. Seated close beside him, the king heard his sobbing and the sighs that broke from him. He stood up at once.
