      title: "The name he had not told"
      blocks:
        - id: ch06-b01
          speaker: alcinous
          text: >-
            Elders and councillors of the Phaeacians, let Demodocus stop. His song doesn't please everyone here. Ever since supper ended and he began singing, our visitor has been groaning and grieving. There is clearly a great sorrow on him. Let the singer rest, so host and guest can enjoy themselves together. That is how it should be. These festivities, the gifts we gladly offer, and the journey we're preparing are all in our guest's honour. Anyone with even a little kindness knows that a visitor who asks for help should be treated like a brother.
            So, sir, please don't keep back what I now ask. It would be kinder to answer openly. What did your father and mother call you at home? What name do your neighbours and fellow citizens know? Rich or poor, nobody goes entirely without a name. Parents give one to a child when it is born. Tell me your country, your people, and your city too. Our ships must know where to take you. We Phaeacians have no pilots. Our ships don't carry rudders like those of other nations. The vessels themselves know what we think and what we want. They know every city and country on earth. Mist and cloud may cover the sea, but they can cross it just as well. There's no danger of wreck or harm.
            Yet I remember something my father used to say. Neptune was angry with us because we gave escorts too readily to anyone who asked. One day, he said, the god would destroy a ship as it returned from taking a traveller home. Then he would bury our city beneath a great mountain. That was my father's warning. Whether the god carries it out is for him alone to decide.
            Now tell us the truth of your journeys. Where have you wandered, and through which countries? Tell us about their cities and people. Which were hostile, wild, and without decent customs? Which were kind and welcomed strangers? And why does the return of the Argive Danaans from Troy make you so unhappy? The gods arranged those events and sent all that suffering so that later generations would have tales to sing. Did a brave relative of your wife's die there? Your father-in-law, perhaps, or a son-in-law? Those are the closest bonds beyond one's own blood. Or was it a brave, good-hearted companion you lost? A true friend can be as dear as a brother.
