  chapters:
    - id: ch01
      title: The guest hides his face
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            At dawn, the king took his unnamed guest to the meeting place by the harbor. Athena had called the townspeople together in a servant's shape. She made Odysseus taller and stronger, to impress them and help him in the contests to come.
            Alcinous ordered a new ship prepared, with fifty-two chosen sailors. When it was ready, they came back for sheep, pigs and oxen at the feast.
            A servant seated Demodocus by a pillar. The Muse had given him song, but taken his sight. His lyre, food and wine were put within reach. After the meal, he sang about the quarrel between Odysseus and Achilles. Agamemnon had been glad to hear it. Apollo had foretold it, and it began the troubles Zeus sent to both armies.
            Odysseus covered his face with his cloak.
            When the music stopped, he dried his cheeks and took his cup. When it started again, he covered himself. Alcinous was sitting near enough to hear him struggling to breathe evenly. Nobody else noticed.
            The king chose to leave his questions for another time.
        - id: ch01-b02
          speaker: alcinous
          text: |
            Let's go to the games. Our guest should see that we beat other peoples at boxing, wrestling, jumping and running.
        - id: ch01-b03
          speaker: narrator
          text: |
            Clytoneus won the race. Euryalus won at wrestling, Amphialus at jumping, Elatreus at discus, and Laodamas at boxing.
            Laodamas, the king's son, finished his own contest and approached him.
        - id: ch01-b04
          speaker: laodamas
          text: |
            Come and have a throw with us. Your boat's ready. We can spare a little time.
        - id: ch01-b05
          speaker: odysseus
          text: |
            Why press me? I've troubles enough. I'm thinking of home, not games. I've come to ask you for help.
        - id: ch01-b06
          speaker: narrator
          text: |
            Euryalus insulted him.
        - id: ch01-b07
          speaker: euryalus
          text: |
            You're no athlete. You look like a greedy trader, with nothing but cargo and profit on your mind.
    - id: ch02
      title: The throw and the sword
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Odysseus angrily rebuked him. A good face didn't mean a wise mind. A plain man could speak well and win respect. Euryalus had looks, but spoke like a fool. Odysseus had been a fine athlete when young. Even after war and shipwreck, he would answer this insult.
            Still wearing his cloak, he picked up a discus heavier than the others. He swung and threw. The rush of it made the spectators draw back. It landed well beyond all the earlier throws.
            Athena, in a man's shape, marked the landing place. She said even a blind man could find it, so far beyond the rest. Odysseus was pleased to hear a friendly voice.
        - id: ch02-b02
          speaker: odysseus
          text: |
            Match that, if you can.
        - id: ch02-b03
          speaker: narrator
          text: |
            He challenged anyone to box, wrestle or run, except Laodamas. It wasn't wise to compete against the family hosting him. At Troy, only Philoctetes could beat him with a bow. He wouldn't challenge the dead heroes, Heracles or Eurytus, who'd competed with gods. Apollo had killed Eurytus for challenging him at archery. His spear went farther than other men's arrows. Running alone worried him. The sea and hunger had worn him down. Nobody answered.
            Alcinous broke the silence.
        - id: ch02-b04
          speaker: alcinous
          text: |
            That's enough to show us your strength. Let us show you another of our skills now.
        - id: ch02-b05
          speaker: narrator
          text: |
            Earlier, the king had praised their boxing and wrestling. Now he admitted these weren't their strongest skills. They were good at running, sailing, music and dance. They liked good food, baths and beds. He called for the lyre. The ground was cleared, and dancers began.
            Demodocus sang about Ares and Aphrodite sleeping in her husband Hephaestus's bed. The Sun saw them and told Hephaestus. In fury, he made unbreakable chains so fine that even gods couldn't see them. He covered the bed with them, then pretended to leave for Lemnos. Ares hurried over and invited Aphrodite to bed. She gladly went with him. The chains trapped them both. They couldn't move.
            The Sun reported again. Hephaestus came back and called the gods to witness his disgrace. His wife despised him for his lameness and wanted handsome Ares, he said. They would stay bound until Zeus returned what he'd been paid for his daughter. The male gods came and roared with laughter. The goddesses stayed away in shame. Slow, lame Hephaestus had caught swift Ares. Ares would have to pay.
            Apollo asked Hermes whether he'd put up with the chains for a night with Aphrodite. Hermes would take three times as many, he said, with all the gods and goddesses watching. They laughed again. Poseidon alone took it seriously and asked for Ares to be freed. He would guarantee payment. Hephaestus objected. What if Ares escaped and left his debt? Poseidon promised to pay it himself. Hephaestus then opened the chains. Ares fled to Thrace. Aphrodite went to Paphos in Cyprus, where the Graces bathed her, rubbed her with oil and dressed her.
            Odysseus and the Phaeacians enjoyed hearing the song. Next Laodamas and his brother danced with a red ball. They tossed it high, leaped to catch it and never lost the rhythm. Odysseus watched closely and praised their skill.
            Pleased, Alcinous asked the leaders to bring the guest presents. Then he spoke to Euryalus.
        - id: ch02-b06
          speaker: alcinous
          text: |
            Give him something better to remember you by than that challenge.
        - id: ch02-b07
          speaker: narrator
          text: |
            Euryalus offered his bronze sword, silver hilt and ivory sheath, with an apology.
        - id: ch02-b08
          speaker: euryalus
          text: |
            I shouldn't have spoken that way. Please take my sword, and put those words behind us. May your journey from here be easier.
        - id: ch02-b09
          speaker: narrator
          text: |
            Odysseus accepted the sword and put it over his shoulder.
        - id: ch02-b10
          speaker: odysseus
          text: |
            Good luck to you as well. May you never feel the lack of the sword you've given me.
    - id: ch03
      title: The horse in the song
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            The thirteen leaders, including the king, each gave a cloak, shirt and talent of gold. By evening, Arete had packed everything, adding the king's clothes. Alcinous also gave a gold cup. Arete told Odysseus to secure the lid against thieves while he slept aboard. He used a knot Circe had taught him, then went to bathe.
            The warm water helped his tired body. He changed into clean clothes and returned to the hall. Nausicaa stood beside a pillar.
        - id: ch03-b02
          speaker: nausicaa
          text: |
            Farewell. Remember me at home. You owe me first for saving your life.
        - id: ch03-b03
          speaker: narrator
          text: |
            Odysseus stopped to answer her.
        - id: ch03-b04
          speaker: odysseus
          text: |
            May Zeus bring me home. I'll honor you all my life as the one who saved me.
        - id: ch03-b05
          speaker: narrator
          text: |
            He took his place by the king. They brought Demodocus back, and Odysseus sent him a fine piece of meat. Hearing the songs had been painful. That wasn't the singer's fault. He had made the old events seem real again.
            After supper, Odysseus asked him for more.
        - id: ch03-b06
          speaker: odysseus
          text: |
            You tell it so accurately, you must have seen it or heard from somebody who did. Sing this next tale well, and I'll tell everyone about your divine gift.
            Sing about the wooden horse Epeius built with Athena's help. How did the men get into the city?
        - id: ch03-b07
          speaker: narrator
          text: |
            Demodocus sang of Greeks burning their tents and sailing off, while Odysseus and the warriors hid in the horse. The Trojans dragged it into the city. Some wanted to break it up, others to throw it off the height. Others wanted it kept for the gods.
            The horse stayed.
            The warriors came out and sacked the city. They killed and plundered in its streets. Odysseus and Menelaus went to Deiphobus's house. The fight was fiercest there, but Athena gave them victory.
            Odysseus wept like a woman clinging to her dying husband. He'd fallen defending home, and enemies struck her back and shoulders, dragging her away as a slave. Only Alcinous noticed the tears and heard the sobs. He rose.
        - id: ch03-b08
          speaker: alcinous
          text: |
            Stop there, Demodocus.
        - id: ch03-b09
          speaker: narrator
          text: |
            The music stopped.
        - id: ch03-b10
          speaker: alcinous
          text: |
            We gave this feast to welcome our guest. We shouldn't be causing him pain. Tell us, friend, where must we take you? What's your name?
        - id: ch03-b11
          speaker: narrator
          text: |
            Their ships needed no helmsman or rudder, the king said. They understood what men wanted and knew the world's cities, even in fog. His father had warned that Poseidon might punish them for so many escorts. He might wreck a ship coming back and bury their city under a mountain. The king left that to the god.
        - id: ch03-b12
          speaker: alcinous
          text: |
            Tell us where you've traveled, and who treated you well or badly. Why do these songs hurt you? The gods sent those troubles for later people to sing about. Did you lose a relation there, or a friend as dear as your brother?
