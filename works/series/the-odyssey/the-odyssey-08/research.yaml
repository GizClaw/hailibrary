  - "The user's task exception permits a compressed HaiLibrary reading edition while preserving classic and published author Homer / 荷马. Both locale Writers remain homer. This is neither Butler's imported wording nor a literal Chinese translation and makes no unabridged claim. Front matter and numbered footnotes are omitted; no locale source_url/translator falsely identifies the new prose as an import."
  - "Retained: Athena summoning and strengthening, fifty-two sailors, Muse's mixed gift of song and blindness; Achilles quarrel, Agamemnon's pleasure and Apollo oracle; hidden tears noticed only by king; named winners, polite invitation, merchant/profit insult and angry reply; heavy discus, Athena's blind-man comparison, challenge with host exception, Philoctetes, Eurytus killed by Apollo, weakened running; king's changed claims about athletic skill; dancers; complete adultery story with Sun reports, forged invisible chains, false Lemnos trip, willing bed encounter, public shaming, lameness grievance, Zeus repayment demand, gods laughing/goddesses absent, Apollo/Hermes sexual joke, contested guarantee, release and separate destinations; red-ball dance; apology/sword, thirteen gift shares, theft warning and Circe knot; bath and Nausicaa's rescue claim/his lifetime honor promise; pork for singer, praise and horse request; burned tents, Trojan alternatives, preserved horse, sack/killings, Deiphobus fight; enslaved widow simile; only king noticing tears; identity, supernatural rudderless ships, destruction warning and question about dead kin/friend."
  - "Compressed: full competitor catalogue beyond event winners, winning distances, slaughter totals and detailed ship equipment, long rhetorical comparisons about eloquence, every archery adjective, dancing floor administration, textile and bath-vessel inventories, and repeated questions about names. Embedded actions and sexual/violent consequences are retained rather than removed as jokes or catalogue."
  - "Claim inventory: provenance is documentary. Muse, divine trap, oracle, supernatural ships and Poseidon threat are mythology. Blindness and lameness remain the poem's details; gods' ridicule and occupational insult are attributed conduct, not endorsed claims about disabled people or merchants. The Trojan sack is epic narrative, not asserted archaeology. Only Alcinous perceives either episode of weeping, and the identity answer remains in Book IX."
  - "Removed invented private motives for requesting songs, audience-wide discovery of tears and a new cloak-lowering ending. Each script is independently spoken from its own final locale. No media changes."
