premise: "Menelaus's account of a struggle with the sea god Proteus finally gives Telemachus news of his living father. In Ithaca, the discovery of the son's voyage leads the suitors to prepare an ambush while Penelope seeks help."
characters:
  - {id: telemachus, description: "The visitor whose search finally produces news but leaves him unaware of a new danger."}
  - {id: pisistratus, description: "The traveling companion who identifies his friend and gently interrupts the grieving meal."}
  - {id: menelaus, description: "The king of Sparta, whose wealth has not removed his grief for lost companions."}
  - {id: helen, description: "The queen whose recollection of Troy is followed by her husband's more troubling memory."}
  - {id: eteoneus, description: "The servant who asks whether the unexpected visitors should be admitted."}
  - {id: idothea, description: "Proteus's daughter, who helps Menelaus catch the changing sea god."}
  - {id: proteus, description: "The sea god who reveals the obstructed voyage and the fate of the missing leaders."}
  - {id: noemon, description: "The ship's owner, whose practical question reveals that Telemachus has sailed."}
  - {id: antinous, description: "The suitor who organizes twenty men to ambush the returning son."}
  - {id: medon, description: "The servant who overhears the plot and warns Penelope."}
  - {id: penelope, description: "The mother who learns together of the secret journey and the threat against it."}
  - {id: euryclea, description: "The nurse who reveals her promise and directs Penelope towards prayer."}
  - {id: vision_iphthime, description: "Athena's dream messenger in the appearance of Penelope's sister."}
