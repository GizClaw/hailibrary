  chapters:
    - id: ch01
      title: Guests at the wedding feast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            They came to Lacedaemon, a city lying low in the land, and drove directly to the home of Menelaus. The king was in his own house, holding a feast with many members of his family. He was celebrating his son's marriage and his daughter's marriage at the same time. Long before, while he was still at Troy, he had agreed to give his daughter to the son of the brave warrior Achilles. Now the gods were making that marriage possible. Menelaus was sending her away with a company of chariots and horses, to the city of the Myrmidons. The son of Achilles was king there. For his only son, Menelaus had found a bride at Sparta, a daughter of Alector. The son's name was Megapenthes. A slave woman had borne him. Helen had borne the beautiful Hermione, as lovely as golden Venus herself, but after that child the gods had allowed her no others.

            Menelaus's neighbors and relatives were enjoying the feast. A singer played his lyre for them. As he struck up a tune, two tumblers performed among the company. Outside, Telemachus and Nestor's son stopped their horses at the gate. Eteoneus, one of Menelaus's servants, came out and saw them. He hurried back inside, went close to his master, and reported their arrival.
        - id: ch01-b02
          speaker: eteoneus
          text: |-
            Menelaus, two strangers have come to the gate. They look as if Jove himself might be their father. Shall we unharness their horses and let them in, or send them to find some other friend who can receive them?
        - id: ch01-b03
          speaker: narrator
          text: |-
            Menelaus answered in great anger.
        - id: ch01-b04
          speaker: menelaus
          emotion: angry
          text: |-
            Eteoneus, son of Boethous, you never used to be a fool. Why speak like one now? Of course you must unharness the horses. Bring the strangers in to eat. Think how often you and I stayed in other people's houses before we finally returned here. May heaven allow us to live peacefully in our own house from now on.
        - id: ch01-b05
          speaker: narrator
          text: |-
            Eteoneus rushed back out and called the other servants to help. They took the sweating horses out of harness, tied them at the mangers and fed them oats mixed with barley. They rested the chariot against the far wall of the courtyard, then led their visitors indoors.

            Telemachus and Pisistratus looked around in astonishment. The house shone like the sun and moon. They admired everything they could see, and only when they had looked to their hearts' content did they go into the bathing room. There the servants washed them and spread oil over their bodies. They brought woollen cloaks and shirts for the two guests, who then sat down at Menelaus's side. A maid carried in a lovely golden jug full of water. She poured it into a silver basin so the visitors could wash their hands, and drew a clean table close to them. A senior servant offered bread and many of the fine foods the house had in store. The man who carved the meat brought plates of all the different kinds, then placed a golden cup beside each guest.
        - id: ch01-b06
          speaker: menelaus
          text: |-
            Welcome. Eat your supper first. When you have finished, I will ask who you are. Men like you must come from a family of distinction. Surely your ancestors were kings who carried scepters. Poor men do not have sons like these.
        - id: ch01-b07
          speaker: narrator
          text: |-
            He gave them some of the fat roast loin placed beside him, the choice piece reserved for the host. They reached for the good food before them. After they had eaten and drunk enough, Telemachus leaned so close to Pisistratus that nobody else was meant to hear his words.
        - id: ch01-b08
          speaker: telemachus
          text: |-
            Pisistratus, my dear friend, look at all that shining bronze and gold. And the amber, ivory and silver. I feel as though I am looking into Olympian Jove's own palace. I can hardly take in how splendid it is.
        - id: ch01-b09
          speaker: menelaus
          text: |-
            My sons, no mortal can compare himself with Jove. His house and everything that belongs to him are everlasting. There may be another man with as much wealth as I have, or there may not. But I paid for mine with long travels and much suffering. Almost eight years passed before I brought my fleet home. I went to Cyprus, Phoenicia and Egypt. I visited the Ethiopians, the Sidonians and the Erembians. I reached Libya, where lambs are born with horns and the sheep give birth three times each year. The ewes give milk in every season. Everyone there, master or servant, has plenty of cheese, meat and good milk.

            While I was traveling among those peoples and gathering a great fortune, my brother was being betrayed by his wicked wife. He was secretly murdered, in a dreadful way. So being the master of all these riches brings me no pleasure. Whoever your parents may be, surely they have told you the story. They must also have told you how much I lost when a great house was destroyed, a house that had been furnished throughout with magnificent things. I wish I owned only a third of what is mine today. In return, I wish I could have remained at home, and that all the men who died on Troy's plain were still alive. They perished so far from their own Argos.

            I sit here in my house and mourn them, every one. Sometimes I cry out in grief. Then I stop again. Tears bring little comfort, and a man soon grows tired of weeping. Yet there is one man I grieve for more than all the others together. When I think about him, I cannot bear either food or sleep. No Achaean worked harder or put himself in greater danger. He gained nothing from it, and left me only sorrow. He has been missing so long, and we cannot discover whether he lives or has died. His old father suffers for him. So does his patient wife Penelope, and Telemachus, the son he left behind as a baby in arms.
        - id: ch01-b10
          speaker: narrator
          text: |-
            Menelaus had heard the whispered admiration and answered it. Now his words stirred a deep longing in Telemachus. At the mention of his father, tears ran from his eyes. He raised his cloak with both hands and hid his face. Menelaus noticed. He could not decide whether to let the young man speak when he was ready, or question him at once.

            As he hesitated, Helen came down from her fragrant room with its high vaulted roof. She was as beautiful as Diana. Adraste brought her a chair, and Alcippe a soft woollen rug. Phylo carried her silver workbox, a gift from Alcandra, the wife of Polybus. They lived in Egyptian Thebes, the richest city in the world. Polybus had given Menelaus two baths made of pure silver, two tripods and ten talents of gold. His wife had given Helen beautiful gifts too, a golden distaff and this silver box. It ran on wheels and had a band of gold around the top. Phylo set it beside her, full of fine-spun yarn. A distaff wound with violet wool lay across it. Helen sat, placed her feet on the footstool, and spoke to her husband.
        - id: ch01-b11
          speaker: helen
          text: |-
            Menelaus, do we know the names of our visitors? I may be guessing wrongly, but I must say what I think. I have never seen a man or woman bear such a likeness to someone else. Looking at this young man, I hardly know what to think. He is so like Telemachus, the baby Ulysses left behind when the Achaeans went to fight at Troy. All because of shameless me.
        - id: ch01-b12
          speaker: menelaus
          text: |-
            My dear wife, I see it as clearly as you do. His hands and feet could be Ulysses' own. His hair, the shape of his head, the look in his eyes, all are the same. Just now I was describing what Ulysses suffered for my sake. The young man began to cry and covered his face with his cloak.
        - id: ch01-b13
          speaker: pisistratus
          text: |-
            Menelaus, son of Atreus, you have guessed correctly. This is Telemachus. He is modest, and it embarrasses him to begin questioning someone whose words are so wise and wonderful. My father Nestor sent me to bring him here. He hoped you might offer advice or tell him what to do. When a father has gone away and left no one to support his son, the son has troubles at home. That is how things stand with Telemachus. His father is absent, and nobody among his own people will stand beside him.
        - id: ch01-b14
          speaker: menelaus
          text: |-
            Then the son of my dearest friend has come to see me. His father suffered so much on my behalf. I always hoped to welcome him with special honor once the gods brought us safely back across the sea. I would have founded a city for him in Argos and built him a house. I would have persuaded him to leave Ithaca with his possessions, his son and all his people. I could have sacked one of the neighboring cities under my rule and given it to them. Then we would have seen each other constantly. Only death could have ended such close and happy friendship. But heaven must have begrudged us that happiness. It has not even let the poor man return to his own home.
        - id: ch01-b15
          speaker: narrator
          text: |-
            His words brought tears to everyone. Helen wept, and Telemachus and Menelaus wept with her. Pisistratus could not hold back his tears either. He remembered his dear brother Antilochus, killed by the son of radiant Dawn. He spoke to Menelaus.
        - id: ch01-b16
          speaker: pisistratus
          text: |-
            Sir, when we talked about you at home, my father Nestor said you had a rare understanding of things. If you can, please consider my request. I would rather not cry while we are eating supper. Morning will come. Then I can weep as much as I wish for the dead. We can do nothing more for them now, except shave our heads and let the tears run down our faces. I lost a brother at Troy. He was no ordinary man there, and you must have known him. Antilochus was his name. I never saw him myself, but people tell me how swift he was on his feet, and how brave in battle.
        - id: ch01-b17
          speaker: menelaus
          text: |-
            My friend, you have more sense than your years would suggest. I can see your father's wisdom in the way you speak. It is easy to recognize the son of a man the gods have blessed, both in the wife he married and in the children he has. Nestor has had that blessing all his life, from his earliest days to this moment. He enjoys a healthy old age in his own house, surrounded by sons who are kind in their nature and brave in their actions. We will set our tears aside and return to supper. Bring water for our hands. Telemachus and I can speak at length in the morning.
        - id: ch01-b18
          speaker: narrator
          text: |-
            A servant named Asphalion poured water over their hands. They turned again to the food set before them.
    - id: ch02
      title: Stories from within Troy
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Helen, Jove's daughter, thought of something else. She put a herb into the wine that drove away worry, sadness and anger. Anyone who drank it would shed no tears for the rest of that day. Even if both parents fell dead, or a brother or son was cut to pieces before his eyes, he could not weep. This powerful medicine had been given to Helen by an Egyptian woman, Polydamna, the wife of Thon. All kinds of herbs grew in Egypt. Some were good to mix into wine. Others were poisonous. Everyone there was a skilled physician, for the people belonged to the race of Paeeon. Helen mixed in the herb, told the servants to pass the wine, and began to speak.
        - id: ch02-b02
          speaker: helen
          text: |-
            Menelaus, son of Atreus, and my dear friends, you sons of honorable fathers, enjoy the feast. Such good fortune comes as Jove chooses. He gives us both good and evil and does whatever he wishes. Let me tell a story that suits this moment. I could never list every deed of Ulysses, but I can tell you one thing he did at Troy, when the Achaeans were in great difficulty.

            He wounded and bruised himself, put on ragged clothes and entered the enemy city. He looked like a low servant or a beggar, nothing like the man we knew among his own people. He walked into Troy in that disguise, and nobody challenged him. Only I recognized him. I started asking questions, but he was too clever to give himself away to me. Later I washed him, rubbed him with oil and gave him clothes. I swore a solemn oath that I would not tell the Trojans who he was until he had reached his own camp and ships safely. Then he told me everything the Achaeans planned to do.

            Before he got back to the Argive camp, he killed many Trojans and learned much that was useful. The women of Troy mourned all that he had done. I was glad. By then I was longing for home. I regretted the harm Venus had done when she brought me there, away from my country, my daughter and my lawful husband. My husband, after all, lacks neither good looks nor good judgment.
        - id: ch02-b03
          speaker: menelaus
          text: |-
            Every word of that is true, my dear wife. I have traveled far and known many heroes, but never another man like Ulysses. Think of his courage and patience inside the wooden horse. The bravest Argives were hidden there, waiting to bring destruction and death upon the Trojans. You came up to the horse then. Some god friendly to Troy must have urged you to do it. Deiphobus was with you.

            Three times you walked around our hiding place and patted it. You called out the names of our leaders, imitating each man's wife. Diomed, Ulysses and I sat inside and heard you. Diomed and I did not know whether to leap out or answer from where we sat. Ulysses stopped us. We all stayed still. Only Anticlus was about to reply. Ulysses clapped both his strong hands over the man's mouth and held them there. That saved every one of us. He kept Anticlus silent until Minerva led you away.
        - id: ch02-b04
          speaker: telemachus
          text: |-
            How sad that none of it could save him. Not even his own iron courage was enough. But now, sir, let us go to bed. We can lie down and enjoy the kindness of sleep.
        - id: ch02-b05
          speaker: narrator
          text: |-
            Helen called for the maids to prepare sleeping places in the room above the gateway. She told them to use the good red rugs, spread coverlets over the beds, and set out woollen cloaks for the strangers to wrap themselves in. The women carried a torch out of the room and went to make the beds. Soon a male servant brought the two guests to the places prepared for them. That was where Telemachus and Pisistratus passed the night, in the forecourt. The son of Atreus lay in a room farther inside the house, with beautiful Helen beside him.
    - id: ch03
      title: A goddess on the island
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            When morning's child, rosy-fingered Dawn, appeared, Menelaus rose and dressed. He tied his sandals on his handsome feet and slung his sword over his shoulder. He stepped out of his room looking like an immortal god, then sat down near Telemachus.
        - id: ch03-b02
          speaker: menelaus
          text: |-
            Telemachus, what brought you on this long voyage over the sea to Lacedaemon? Have you come for your own affairs, or on public business? Tell me the whole story.
        - id: ch03-b03
          speaker: telemachus
          text: |-
            Sir, I hoped you could give me news of my father. People are eating away everything we own. Our fine property is being wasted. The house is full of villains slaughtering my sheep and oxen in great numbers. They say they are there to court my mother. I appeal to you here at your knees. Tell me about my father's sorrowful end, if you witnessed it yourself or heard about it from another traveler. He was born to suffer. Please do not spare me out of pity. Give me a plain account of what you saw. If brave Ulysses ever served you faithfully in words or deeds, while the Trojans were pressing you Achaeans hard, remember him now. Help his son by telling the whole truth.
        - id: ch03-b04
          speaker: narrator
          text: |-
            Menelaus was deeply shocked by what he heard.
        - id: ch03-b05
          speaker: menelaus
          text: |-
            Cowards like those want to take a brave man's place in his marriage bed? A mother deer might as well leave her newborn young in a lion's den and wander off to feed in a wood or a grassy hollow. When the lion returns, he will kill both mother and young soon enough. That is how Ulysses will deal with the suitors. By father Jove, Minerva and Apollo, if he is still the man I saw wrestling Philomeleides in Lesbos, their lives will be short and their wedding miserable. He threw Philomeleides so hard that every Achaean cheered. Let that same Ulysses come near them.

            Now for your question. I will tell you exactly what the old man of the sea told me. I will hide nothing or try to deceive you. I was on my way here, but the gods kept me in Egypt. They were not fully satisfied with the sacrifices I had made. The gods insist on receiving everything due to them.

            There is an island off Egypt called Pharos. It lies about a day's sailing from the mainland, for a ship with a good, strong wind following her. Pharos has a fine harbor where sailors can fill their water supplies. From there, they can make their way out into the open sea. That was where the gods kept us without wind for twenty days. There was not even a breath from the direction we needed to carry us onward. We would have eaten through every last bit of our supplies, and the men would have starved, if a goddess had not taken pity on me. Our rescuer was Idothea, the daughter of Proteus, the old man who lives in the sea. She had become very fond of me.

            She found me alone one day. I was often by myself. The men carried their barbed hooks all around the island, hoping to catch a fish or two to ease their hunger. The goddess spoke to me there.
        - id: ch03-b06
          speaker: idothea
          text: |-
            Stranger, you seem to enjoy being hungry. At least it cannot be troubling you much. You stay here day after day and make no attempt to leave, while your men are slowly dying.
        - id: ch03-b07
          speaker: menelaus
          text: |-
            I answered her plainly. Whichever goddess you may be, I am not staying by choice. I must have offended the gods in heaven. You gods know everything, so tell me which immortal is holding me here. How am I to cross the sea and get back to my home?
        - id: ch03-b08
          speaker: idothea
          text: |-
            I will explain it all to you, stranger. An old immortal lives beneath the sea near here. He is an Egyptian called Proteus. People say he is my father. He is Neptune's chief servant and knows every part of the ocean floor. Catch him and hold him, and he will tell you about your voyage. He will show you the courses to follow and how to sail home. If you wish, he can also tell you everything that has happened in your house, good or bad, during your long and dangerous travels.
        - id: ch03-b09
          speaker: menelaus
          text: |-
            I asked her how it could be done. Can you show me a way of trapping him without letting him guess what I am planning? A mortal cannot easily catch a god.
        - id: ch03-b10
          speaker: idothea
          text: |-
            Stranger, I will tell you clearly what you need to know. At about the time the sun reaches the middle of the sky, the old man rises from beneath the waves. Before he appears, the west wind ruffles the water lying over his head, as if announcing him. Once he is out of the sea, he lies down in a great sea cave and goes to sleep. The seals come up from the grey water as well. People call them Halosydne's chickens. They crowd around the old man in great numbers and fall asleep beside him. The smell they bring with them is very strong, like fish.

            Tomorrow morning, early, I will bring you to that place and lay you in hiding. Pick the three best men from your whole fleet. I will explain the tricks you must be ready for. The old man first looks over all the seals and counts them, tallying the number on his five fingers. When he has checked every one, he lies down among them, just as a shepherd rests among his sheep. Watch for him to fall asleep. The moment he does, seize him with all your strength and keep him there. He will use everything he knows to break free. He may become any creature that lives on the earth. He will turn into fire and into water too. Hold on through it all. Grip him more and more tightly, until he speaks to you and returns to the form he had when he lay down. Only then should you relax your hold and release him. You can ask what immortal is angry with you, and how you must travel across the sea to reach your home.
        - id: ch03-b11
          speaker: menelaus
          text: |-
            She finished and dived beneath the waves. I walked back toward the row of ships on the shore, with a heavy heart. By the time I reached my ship, night was coming. We prepared supper and slept on the beach.
    - id: ch04
      title: Holding fast to Proteus
      blocks:
        - id: ch04-b01
          speaker: menelaus
          text: |-
            When morning's child, rosy-fingered Dawn, appeared, I took the three men I trusted most for courage and ability of every kind. We followed the edge of the sea, praying with all our hearts to the gods. While we were on our way, the goddess had gone beneath the water and fetched four sealskins from the sea floor. They had only just been stripped from the animals. This was the trick she had planned for her father. She dug four hollows for us to lie in, then sat down and waited for our approach. When we came close, she told us to lie in the hollows, one man after another. Over each of us she threw a sealskin.

            We could scarcely have endured that hiding place without her help. The fishy stench was dreadful. Who would choose to sleep beside a sea monster? But she had thought of that too. She put ambrosia beneath each man's nostrils. Its sweet fragrance overpowered the smell of the seals, and we could bear it.

            We waited all morning as best we could. Hundreds of seals came up to bask on the shore. At noon the old man appeared. He found his fat seals and counted them all. We were among the first he counted, and he suspected nothing. Once he had finished, he lay down to sleep. We shouted, sprang on him and held him fast. His tricks began at once. First he became a lion with a great mane. Then, suddenly, a dragon, a leopard and a wild boar. One moment he was flowing water, the next a tree. We held on through every change and never let go. At last the cunning old creature was in distress and began to question me.
        - id: ch04-b02
          speaker: proteus
          text: |-
            Son of Atreus, which god planned this trap with you? Who taught you to catch me and hold me against my will? What do you want from me?
        - id: ch04-b03
          speaker: menelaus
          text: |-
            I told him he knew already. Old man, there is no point in trying to put me off. I have been trapped on this island so long, with no sign of escape, that I am losing hope. You gods know everything. Tell me who is keeping me here, and how I can sail across the sea to my own home.
        - id: ch04-b04
          speaker: proteus
          text: |-
            If you want to finish the voyage quickly, you must sacrifice to Jove and all the other gods before you sail. It has been decreed that you cannot return to your friends and your own house yet. First you must go back to the river of Egypt, fed by heaven, and offer holy sacrifices of a hundred beasts to the immortal gods who rule above. Once you have done that, they will let you reach home.
        - id: ch04-b05
          speaker: menelaus
          text: |-
            It broke my heart to hear that I must make the long, dreadful journey back to Egypt. Even so, I promised to obey. Old man, I will do everything you have told me. But answer another question truthfully. When Nestor and I sailed away from Troy, we left other Achaeans behind. Have they all returned safely? Did any of them die miserably on his own ship, or among his friends after his fighting was over?
        - id: ch04-b06
          speaker: proteus
          text: |-
            Son of Atreus, why ask? You would be better off not hearing what I can tell you. It will certainly bring tears to your eyes. Many of the men you ask about are dead. Many are still alive. Only two of the Achaean leaders died on the voyage home. You were there for the deaths on the battlefield. A third leader is alive at sea, but cannot return.

            Ajax suffered a shipwreck. Neptune forced him onto the great rocks called Gyrae, but then allowed him to climb out of the sea alive. Minerva hated Ajax, yet he could still have escaped death despite her anger. It was his own boast that ruined him. He declared that the gods had tried to drown him and had been unable to do it. When Neptune heard him talking so proudly, the god grasped his trident with both of his strong hands. He struck the rock of Gyrae and broke it into two parts. The lower part remained firmly where it had stood. But the piece on which Ajax was sitting fell headfirst into the water. Ajax fell with it, gulped down the salt sea and drowned.

            Your brother and his ships escaped because Juno guarded him. But just as he was approaching the high headland of Malea, a gale swept him back out to sea against his will. It drove him to the coast where Thyestes once lived, and where Aegisthus now had his home. Then it seemed that he would reach his own country safely after all. The gods turned the wind back to its old direction, and the ships came home. Agamemnon kissed his native earth. He wept with joy to stand in his country again.

            There was a man whom Aegisthus had kept constantly on watch. He had promised this lookout two talents of gold for the task. A whole year the man had watched for Agamemnon. Aegisthus was determined that the returning king should not get past him unnoticed and have time to make ready for war. When the lookout at last saw Agamemnon passing, he went to Aegisthus with the news. Aegisthus began arranging the trap without delay. He chose twenty warriors, the bravest he had, and concealed them along one side of the covered walk. On the other side, facing the hiding place, he laid out a feast. He sent his chariots and horsemen to bring Agamemnon to that feast. The invitation hid a murderous plan. The king arrived without suspecting the death prepared for him. Once the banquet was finished, Aegisthus slaughtered him like an ox in a butcher's yard. Not a single follower of Agamemnon lived through it. Not a single follower of Aegisthus did either. All of them were killed in those covered walks.
        - id: ch04-b07
          speaker: menelaus
          text: |-
            When Proteus told me that, my heart broke. I sat on the sand and wept. I no longer wanted to live or see the sunlight. I rolled on the ground in sorrow until my tears were spent. Then the old man spoke again.
        - id: ch04-b08
          speaker: proteus
          text: |-
            Son of Atreus, stop wasting time in this bitter weeping. It cannot help you. Find your way home as quickly as possible. Aegisthus may still be alive. Even if Orestes has killed him before you arrive, you may yet reach his funeral.
        - id: ch04-b09
          speaker: menelaus
          text: |-
            That brought some comfort into my grief. I asked about the other man. Now I know the fate of those two. Tell me about the third leader you mentioned. Is he still living, but unable to cross the sea and return? Or has he died? Do not keep it from me, however painful it may be.
        - id: ch04-b10
          speaker: proteus
          text: |-
            The third is Ulysses of Ithaca. I can see him on an island, weeping bitterly in the house of the nymph Calypso. She holds him prisoner. He has no ship or sailors to carry him across the water, so he cannot return home.

            As for the end of your own life, Menelaus, it will not come to you in Argos. The gods will carry you to the Elysian plain, far away at the world's end. Fair-haired Rhadamanthus rules that country. Nowhere else do people live with such ease. Elysium has no rain of any kind, no hail falling from the sky, and no snow. Oceanus breathes a wind from the west without ceasing. It comes softly singing over the sea and gives fresh life to everyone there. That is the future awaiting you, because you married Helen and are the son-in-law of Jove himself.
        - id: ch04-b11
          speaker: menelaus
          text: |-
            With those words he dived below the waves. My companions and I went back to the ships, and I carried my worries with me. Night was falling when we arrived. We made supper and slept on the shore. When rosy-fingered Dawn returned, we launched the ships and loaded the masts and sails. We went aboard, sat at the rowing benches and struck the grey sea with our oars. Once more I brought my ships into Egypt's river, fed by heaven. This time our sacrifices were full and sufficient. They appeased the gods. Then I raised a mound in memory of Agamemnon, so that his name would never die. Afterward, the gods sent a favorable wind, and my passage home was swift.

            Now, Telemachus, stay with me another ten or twelve days. Then I will send you on your way with a splendid gift, a chariot and three horses. I will give you a beautiful drinking cup as well. All your life, when you pour wine to the immortal gods, it will remind you of me.
    - id: ch05
      title: A gift for an island home
      blocks:
        - id: ch05-b01
          speaker: telemachus
          text: |-
            Son of Atreus, please do not keep me longer. I could happily listen to you for another twelve months. Your conversation is so delightful that I would never even wish myself home with my parents. But the crew I left in Pylos are already impatient. While I stay here, I cannot get back to them.

            If you wish to give me something, I would rather have a fine piece of metalwork. I cannot take horses home to Ithaca. Let them remain as an ornament to your own stables. Your kingdom has broad plains. Lotus grows there, and meadow-sweet, wheat and barley, and oats with their pale, spreading ears. Ithaca has no open fields or places to race horses. It suits goats better than horses, and I love it all the more for that. None of our islands has much level ground for keeping horses. Ithaca has the least of all.
        - id: ch05-b02
          speaker: narrator
          text: |-
            Menelaus smiled and took Telemachus by the hand.
        - id: ch05-b03
          speaker: menelaus
          text: |-
            Your answer shows your good upbringing. I can change the gift, and gladly will. You shall have the finest and most valuable piece in my house. It is a mixing bowl made by Vulcan himself. The whole bowl is pure silver, except for the rim, which is inlaid with gold. Phaedimus, king of the Sidonians, gave it to me when I visited him again on my way home. I will give it to you.
        - id: ch05-b04
          speaker: narrator
          text: |-
            They continued their conversation while guests arrived at the king's house. The visitors brought sheep and wine. Their wives had packed bread for them to bring too. Now they were busy preparing their meals in the courtyards.
    - id: ch06
      title: A plan against Telemachus
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            Back in Ithaca, the suitors were playing on the level ground outside Ulysses' house. Some threw discs, while others aimed their spears at a target. They were as arrogant as ever. Antinous and Eurymachus sat together. They led the others and stood well above them in influence. Noemon, the son of Phronius, came up to Antinous.
        - id: ch06-b02
          speaker: noemon
          text: |-
            Antinous, do you know when Telemachus will return from Pylos? He borrowed my ship, and I need it now to cross over to Elis. I keep twelve breeding mares there, with year-old mule foals beside them that have not been trained yet. I want to bring one over and train it here.
        - id: ch06-b03
          speaker: narrator
          text: |-
            They were astonished. They had been certain Telemachus never sailed to the city of Neleus. They thought he was somewhere on the farms, among his sheep or visiting the swineherd. Antinous questioned Noemon.
        - id: ch06-b04
          speaker: antinous
          text: |-
            When did he leave? Tell me the truth. Which young men went with him? Were they free men, or his own slaves? He might have found enough of those. And what about the ship? Did you lend it willingly when he asked, or did he take it without your permission?
        - id: ch06-b05
          speaker: noemon
          text: |-
            I lent it willingly. A man of his standing came to me in difficulty and asked for help. How could I refuse him? The crew were the finest young men we have. I saw Mentor board as captain, or a god who looked exactly like him. That puzzles me. I saw Mentor here myself yesterday morning, although he was supposed to be on the way to Pylos.
        - id: ch06-b06
          speaker: narrator
          text: |-
            Noemon returned to his father's house. Antinous and Eurymachus were furious. They called the other men away from their games and told them to sit with them. Once the company had gathered, Antinous, the son of Eupeithes, spoke. Rage filled his heart, and his eyes seemed to flash with fire.
        - id: ch06-b07
          speaker: antinous
          emotion: angry
          text: |-
            This voyage is serious trouble. We were certain his plans would fail. Yet the boy has slipped away in spite of us, and taken a choice crew with him. He will be making difficulties for us soon. May Jove take him before he is fully grown. Find me a ship and twenty men. I will wait for him in the channel between Ithaca and Samos. He will regret ever setting out to look for his father.
        - id: ch06-b08
          speaker: narrator
          text: |-
            The others applauded his plan, and they all went inside. Penelope soon learned what they intended. A servant named Medon had stood outside the outer court and overheard their plotting within. He came to tell his mistress. As he stepped through the doorway of her room, she spoke to him.
        - id: ch06-b09
          speaker: penelope
          text: |-
            Medon, what do the suitors want now? Have they sent you to tell the maids to leave their master's work and cook another meal for them? I wish they would never court or feast again, here or anywhere else. Let this be their last time. Look at the way you all waste my son's property. When you were children, didn't your fathers tell you how well Ulysses treated them? He never bullied anyone or spoke harshly. A king may sometimes say cruel things. He may favor one man and dislike another. Ulysses never treated anyone unjustly. Your behavior shows your wicked hearts. Is there no gratitude left in the world?
        - id: ch06-b10
          speaker: medon
          text: |-
            Madam, I wish that were the whole matter. They have planned something far worse. May the gods prevent it. They mean to murder Telemachus on his return from Pylos and Lacedaemon. He has gone there to ask for news of his father.
        - id: ch06-b11
          speaker: narrator
          text: |-
            Penelope's heart sank. For a long time she could say nothing. Tears filled her eyes, and words would not come. At last she spoke.
        - id: ch06-b12
          speaker: penelope
          emotion: sad
          text: |-
            Why did my son leave me? Why sail away in those ships, those sea-horses that travel so far across the ocean? Does he want to die with no one left to carry his name?
        - id: ch06-b13
          speaker: medon
          text: |-
            I cannot tell whether a god urged him, or he decided on his own to search for news. He wanted to learn whether his father was dead, or alive and coming home.
        - id: ch06-b14
          speaker: narrator
          text: |-
            Medon went back down the stairs. Penelope remained in her room, crushed by the news. Though there were plenty of chairs and benches in the house, she had no heart to sit on any of them. She could only throw herself down on her own bedroom floor and weep. The maids of the household gathered around her. Old women and young women alike began to cry with her. Her sorrow overcame her, and at last she cried out to them.
        - id: ch06-b15
          speaker: penelope
          emotion: sad
          text: |-
            My dear women, heaven has given me more suffering than any other woman of my age in this country. First I lost my brave husband, with his lion's heart. He had every virtue a man could have, and his name was known across Hellas and middle Argos. Now my beloved son is at the mercy of wind and sea. No one even told me he was going.

            You wretched girls knew when he was leaving. Yet not one of you thought to wake me. If I had known, he would have abandoned the journey, however much he wanted to go. Or he would have left my dead body behind. It would have been one or the other. Now one of you fetch old Dolius, the gardener my father gave me when I married. Send him straight to Laertes with the whole story. Perhaps he can find a way to bring the people to our side, against these men who want to wipe out his family and Ulysses' line.
        - id: ch06-b16
          speaker: euryclea
          text: |-
            Madam, you may kill me or let me stay in your house. Do as you choose, but hear the truth. I knew his plans. I gave him the bread and wine he asked for. He made me swear not to tell you for ten or twelve days, unless you asked or heard that he had gone. He did not want tears to spoil your beauty.

            Now wash your face and change your clothes. Go upstairs with the maids and pray to Minerva, the daughter of Jove who bears the aegis. She can rescue him from the very jaws of death. Don't trouble Laertes. He has enough sorrow already. I cannot believe the gods hate the family of Arceisius's son so much. A son will remain to follow him and inherit the house and all the fine fields around it.
        - id: ch06-b17
          speaker: narrator
          text: |-
            The old nurse's words quieted her mistress's weeping, and she wiped the tears from her eyes. Penelope washed, changed her dress and went upstairs with the maids. She put crushed barley into a basket and prayed to Minerva.
        - id: ch06-b18
          speaker: penelope
          text: |-
            Hear me, tireless daughter of Jove who bears the aegis. If Ulysses ever burned the fat thigh bones of sheep or heifers for you while he lived here, remember those offerings now. Be kind to me, and save my dear son from the suitors' wickedness.
        - id: ch06-b19
          speaker: narrator
          text: |-
            She called out loudly, and the goddess heard her. In the covered walk below, the suitors were making a great noise. One of them spoke.
        - id: ch06-b20
          speaker: suitor_other
          text: |-
            The queen is getting ready to marry one of us. She has no idea her son is already marked for death.
        - id: ch06-b21
          speaker: narrator
          text: |-
            That was what they imagined. They did not know what was to come. Antinous warned them.
        - id: ch06-b22
          speaker: antinous
          text: |-
            Keep your voices down, friends. Someone inside may hear. We all agree on what must be done. Let us get up and carry it out quietly.
        - id: ch06-b23
          speaker: narrator
          text: |-
            He selected twenty men and led them down to the ship by the shore. They launched her and put the mast and sails aboard. In the proper order, they fastened the oars to their pins with twisted leather straps and raised the white sails. Their good servants brought their weapons and armor. The men moored the vessel a short distance offshore, returned to land and ate supper. Then they waited for nightfall.
    - id: ch07
      title: The dream and the waiting ship
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: |-
            Penelope lay upstairs in her room, unable to eat or drink. Would her brave son escape, or would the wicked suitors overpower him? Her thoughts circled like a lioness caught in a net with hunters pressing in on every side. At last she fell asleep. She lay still on her bed, with neither movement nor thought.

            Minerva devised another plan. She made a vision shaped like Penelope's sister Iphthime. Iphthime was also a daughter of Icarius. She had married Eumelus and lived in Pherae. Minerva sent the vision to Ulysses' house to stop Penelope's tears. It passed through the little hole where the strap ran through the door, the strap used to pull it shut. Then it hovered above her head and spoke.
        - id: ch07-b02
          speaker: vision_iphthime
          text: |-
            Penelope, you are sleeping. The gods who live free from trouble will not leave you to cry in such sorrow. Your son has not offended them. He will return to you.
        - id: ch07-b03
          speaker: narrator
          text: |-
            Penelope slept peacefully at the entrance to the land of dreams. From there she answered.
        - id: ch07-b04
          speaker: penelope
          text: |-
            Sister, what has brought you all the way here to see me? It is not often that you come to my house. I suppose it is because your own home is so far away. Must I stop weeping and put aside all the painful thoughts that torment me? I have lost my brave husband, my lion-hearted husband. He had every good quality, and everyone in Hellas and middle Argos knew his name. Now my dear son has taken ship as well. Foolish boy. He has never learned to endure hardship or move among gatherings of men.

            I fear for him even more than for my husband. Thinking of him makes me tremble. Something may happen among the people he has gone to, or on the sea. He has many enemies. They are plotting against him and mean to kill him before he reaches home.
        - id: ch07-b05
          speaker: vision_iphthime
          emotion: calm
          text: |-
            Take courage. Don't let fear overwhelm you. Someone has gone with him whom many men would gladly have beside them. Minerva herself. She pities you and has sent me to bring this message.
        - id: ch07-b06
          speaker: penelope
          text: |-
            If you are a god, or have come at a god's command, tell me about the other unhappy one too. Is he still living, or has he died and entered the house of Hades?
        - id: ch07-b07
          speaker: vision_iphthime
          text: |-
            I will not give you a certain answer about his life or death. There is no purpose in speaking idly.
        - id: ch07-b08
          speaker: narrator
          text: |-
            The vision slipped through the hole for the door strap and vanished into the air. Penelope woke refreshed and comforted. Her dream had been so vivid.

            Meanwhile, the suitors boarded their ship and sailed out, determined to kill Telemachus. Midway along the channel between Ithaca and Samos lay a small rocky island called Asteris. It had a harbor on either side where a ship could wait. There the Achaeans took up their ambush.
