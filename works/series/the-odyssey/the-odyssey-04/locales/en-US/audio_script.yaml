  chapters:
    - id: ch01
      title: A father in other people's memories
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            They reached Menelaus's home during a wedding feast. Hermione, his daughter, was being sent to marry Achilles' son. Megapenthes, his son, had a Spartan bride. A servant asked whether to bring the strangers in or send them somewhere else. Menelaus was angry at the question.
        - id: ch01-b02
          speaker: menelaus
          text: |
            Of course they can. Remember all the people who took us in before we reached home. Go and welcome them.
        - id: ch01-b03
          speaker: narrator
          text: |
            They fed the horses and put the chariot away. The visitors washed and changed. The hall shone with ivory, bronze, silver and gold. Menelaus offered food before asking who they were. After eating, Telemachus whispered that the gods must have a house like this. Menelaus overheard.
        - id: ch01-b04
          speaker: menelaus
          text: |
            The gods' houses are beyond anything I could own.
        - id: ch01-b05
          speaker: narrator
          text: |
            He'd spent almost eight years getting back. While he'd gathered riches abroad, his brother had been killed. He'd give up much of his wealth to bring back the men who died at Troy. He missed Odysseus most, the man who'd done so much for them and disappeared.
            Telemachus began to cry. He held his cloak over his face.
            Helen came in and noticed him. She asked her husband if this might be Odysseus's boy. His eyes, his head, his hands looked familiar. Pisistratus told them who he was and that Nestor had sent them looking for news.
            Menelaus had hoped to bring Odysseus and all his people and possessions to Argos. He would sack one of his subject cities to house his friend. They could be together until death. The gods hadn't allowed it. Everyone wept. Pisistratus remembered his brother Antilochus, whom he'd never met. He suggested eating now and grieving in the morning. Menelaus agreed.
            Helen put a magical Egyptian drug into the wine. Whoever drank it couldn't cry for the rest of the day, even if a parent died before them, or a child was cut to pieces. She told them how Odysseus had injured himself and put on rags to enter Troy as a beggar. She alone recognized him. She washed and clothed him. Only when she'd sworn not to betray him before his escape did he tell her the Greek plans. He killed many Trojans and got back with information.
        - id: ch01-b06
          speaker: helen
          text: |
            By then I missed my country, my daughter and my husband. I regretted that Aphrodite had brought me away. Troy's women mourned, but I was pleased he got back.
        - id: ch01-b07
          speaker: narrator
          text: |
            Her husband brought up a different memory.
        - id: ch01-b08
          speaker: menelaus
          text: |
            Yet when we were inside the horse, you almost made us give ourselves away.
        - id: ch01-b09
          speaker: narrator
          text: |
            They'd hidden in the wooden horse to destroy Troy. Helen walked round it with Deiphobus. She called each man by name, copying his wife's voice. Menelaus and Diomedes wanted to answer, or jump out. Odysseus stopped them. Anticlus began to answer, but Odysseus held his mouth shut until Athena took Helen away.
            Telemachus mourned that even such courage hadn't saved his father. Then he asked to sleep.
        - id: ch01-b10
          speaker: telemachus
          text: |
            Could we go to bed now? I'd like to talk more tomorrow.
        - id: ch01-b11
          speaker: narrator
          text: |
            They slept in the gatehouse. In the morning, Telemachus told Menelaus what the suitors were doing. The king was furious. They were like young deer in a lion's den. Odysseus would return and kill them. Then he promised the news he'd heard from Proteus.
        - id: ch01-b12
          speaker: menelaus
          text: |
            Proteus gave me news of Odysseus. I'll tell you how I got him to speak.
    - id: ch02
      title: Holding the sea god
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            On the way home, Menelaus had spent twenty days trapped on Pharos, an island off Egypt. There was no wind to take him where he needed to go. Food was running out. The sailors fished along the shore, hoping for a meal. A goddess found him there alone one day. Her name was Idothea, and Proteus was her father.
        - id: ch02-b02
          speaker: idothea
          text: |
            Will you still be here when your last food is gone?
        - id: ch02-b03
          speaker: menelaus
          text: |
            If I knew a way out, I'd have taken it. Can you help me find one?
        - id: ch02-b04
          speaker: narrator
          text: |
            Idothea said her father knew what was holding them there. Each noon, he came up from the sea to sleep with his seals. Menelaus must choose three strong men and seize him. The god would change shape, but they must hold on until he gave up.
            Next day, she covered the four men with seal skins. The stink nearly sent them running before Proteus arrived. She put sweet-smelling ambrosia under their noses, and they managed to stay still. The seals came ashore. Proteus counted them, including the four men, and lay down to sleep.
            They grabbed him. Suddenly they were holding a lion. Then he became other fierce animals, then flowing water, then a tree. Whatever shape he took, they wouldn't let go. At last the old man was himself again.
        - id: ch02-b05
          speaker: proteus
          text: |
            What have you caught me for?
        - id: ch02-b06
          speaker: menelaus
          text: |
            I need to get home.
        - id: ch02-b07
          speaker: narrator
          text: |
            Proteus said he must go back to Egypt and complete the offerings he'd neglected. Then the gods would let him leave. Menelaus dreaded going back, but he agreed. Before releasing Proteus, he asked about the other commanders.
            Ajax had survived a wreck, then claimed the gods couldn't drown him. Poseidon broke the rock beneath him, and he died in the sea. Agamemnon had landed full of joy and kissed the ground. But a paid lookout had watched for him for a year. Aegisthus hid twenty men beside a banquet and invited him in. They butchered the king. In the fight, every follower on both sides was killed as well.
            Menelaus collapsed on the sand and wept. Proteus told him to make for home. Perhaps Aegisthus was still alive. If Orestes had killed him already, Menelaus might get there for the funeral.
            Then there was a third commander, living but unable to return. Menelaus would not leave without knowing who.
        - id: ch02-b08
          speaker: proteus
          text: |
            It's Odysseus. Calypso won't let him leave her island. He mourns there, without sailors or a ship to bring him back.
    - id: ch03
      title: News to take home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Telemachus now had a god's eyewitness account. His father lived, weeping as Calypso's captive.
            Menelaus finished his story. Proteus had predicted that the king would eventually find rest in Elysium, because his wife Helen was Zeus's daughter. Then the god disappeared. Menelaus returned to Egypt, completed the offerings and made a memorial for Agamemnon. After that, a good wind brought him home.
            The king invited Telemachus to stay and offered him a chariot, three horses and a cup. Telemachus thanked him. But he wanted to get back to his sailors at Pylos.
        - id: ch03-b02
          speaker: telemachus
          text: |
            Horses aren't much use on Ithaca. Those paths are better for goats. Could I have a gift I can carry home instead?
        - id: ch03-b03
          speaker: narrator
          text: |
            Menelaus smiled. He offered a silver bowl with a gold rim. Hephaestus had made it, and the king of Sidon had given it to him. Guests were coming through the door again as the household began preparing another meal.
    - id: ch04
      title: The borrowed ship
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            In Ithaca, Noemon needed his ship again. He asked Antinous when Telemachus would return from Pylos.
        - id: ch04-b02
          speaker: antinous
          text: |
            You mean he's really gone?
        - id: ch04-b03
          speaker: narrator
          text: |
            Noemon explained that he'd lent the ship freely. Good young men had joined the crew, with Mentor aboard. At least, he thought it was Mentor. He'd also seen Mentor in town after the ship had sailed. He couldn't make sense of that.
            When Noemon left, Antinous and Eurymachus angrily called the others together. They'd thought the boy was on a farm. Instead he'd found a ship and crew. He might cause trouble before he was even grown.
        - id: ch04-b04
          speaker: antinous
          text: |
            Get me twenty men and a vessel. We'll be there to intercept him.
        - id: ch04-b05
          speaker: narrator
          text: |
            Their plan was to kill him in the passage near Ithaca before he got ashore. The others agreed. None of them realized that Medon had heard everything. The household servant went straight to Penelope.
    - id: ch05
      title: The mother's unanswered question
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |
            Upstairs, Penelope assumed Medon had brought some fresh demand for the feast. She began complaining, but he told her what he'd heard. She fell silent. Her son had gone to sea, and these men intended to murder him. She learned both things at once.
        - id: ch05-b02
          speaker: penelope
          text: |
            Why did he leave me? Does he want to die with nobody to carry on his name?
        - id: ch05-b03
          speaker: narrator
          text: |
            Medon didn't know whose idea it was. He went downstairs. Penelope fell on the floor and wept among her women. She blamed them for keeping quiet. She would have stopped her son from sailing, or died before letting him leave. She wanted Dolius, the gardener, sent to Laertes. Perhaps he could get the people to help. Euryclea came forward.
        - id: ch05-b04
          speaker: euryclea
          text: |
            I knew he was going. I prepared his food and wine.
            You can kill me, or let me live here. But I'll tell you the truth. He made me swear to wait ten or twelve days, unless you asked. He didn't want you crying and spoiling your beauty. Laertes has enough grief. Wash, change and pray to Athena. She can save your son from death.
        - id: ch05-b05
          speaker: narrator
          text: |
            Penelope followed her advice. In her prayer, she asked Athena to remember what Odysseus had offered her and protect his son. The men downstairs thought she was getting ready to marry. Antinous silenced their loud talk and ordered the ship prepared. Armed men gathered by the water to wait for night.
            Upstairs, Penelope couldn't eat. She pictured her son among strangers, on unknown coasts, with enemies planning his death. Eventually, she fell asleep.
            Athena sent her a dream figure in the shape of her sister Iphthime. It entered the room and promised that the gods would send the boy home.
        - id: ch05-b06
          speaker: penelope
          text: |
            He's so inexperienced. He's never been through anything like this, and he doesn't know the people around him.
        - id: ch05-b07
          speaker: vision_iphthime
          text: |
            Athena is there to help him. She sent me with that message.
        - id: ch05-b08
          speaker: narrator
          text: |
            Penelope turned to the other question, the one she'd lived with for years.
        - id: ch05-b09
          speaker: penelope
          text: |
            Can you tell me if my husband is still living?
        - id: ch05-b10
          speaker: narrator
          text: |
            The figure would say nothing about Odysseus. It disappeared. Penelope woke comforted, but she still hadn't heard what her son now knew in Sparta.

            Meanwhile the suitors reached the rocky island of Asteris. They hid their ship in shelter there and watched for Telemachus's sail.
