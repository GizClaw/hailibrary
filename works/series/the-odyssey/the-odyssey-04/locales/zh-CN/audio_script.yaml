      display_name: 伊芙提墨的幻影
      tts: {delivery: 轻柔而笃定, timbre: 轻盈清楚, pace: 平缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 婚宴上的远客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            两人来到地势低平的拉刻代蒙，径直把车赶到墨涅拉奥斯家。国王正在家里请许多族人吃饭，庆祝儿子与女儿的两场婚事。当年还在特洛伊，他就把女儿许给了勇士阿喀琉斯的儿子。如今有诸神成全，婚事该办了。他正用车马送女儿去密耳弥多涅斯人的城，那里由阿喀琉斯之子统治。独子的媳妇是从斯巴达选来的，是阿勒克托尔的女儿。儿子名叫墨伽彭忒斯，母亲是个女奴。海伦只生了赫耳弥奥涅，她美得像金色的阿佛洛狄忒，此后，上天没有再给海伦孩子。

            家中的亲友和邻人吃喝玩乐，歌人一面唱，一面弹里拉琴。乐曲响起，两个翻筋斗的艺人便在人群里表演。忒勒马科斯和涅斯托尔的儿子把马停在大门外。仆人厄忒俄纽斯出来，一看见他们，就急忙跑回去，贴近主人禀报。
        - id: ch01-b02
          speaker: eteoneus
          text: |-
            墨涅拉奥斯，外头来了两个生客，看着都像宙斯的儿子。咱们要不要把马卸下来？还是让他们自己想办法，到别的朋友那里去？
        - id: ch01-b03
          speaker: narrator
          text: |-
            墨涅拉奥斯听了，非常生气。
        - id: ch01-b04
          speaker: menelaus
          emotion: angry
          text: |-
            波厄托奥斯的儿子厄忒俄纽斯，你以前不糊涂，今天怎么说这样的傻话？当然给他们卸马，请进来吃晚饭。回到这里以前，你我也住过那么多人家，还不明白吗？愿上天保佑，我们往后能一直在这里安稳度日。
        - id: ch01-b05
          speaker: narrator
          text: |-
            厄忒俄纽斯赶紧出去，叫上其他仆人。他们解开马轭，把浑身是汗的马拴到食槽前，喂了燕麦和大麦拌成的饲料，再把车靠在院子尽头的墙上，引客人进屋。

            忒勒马科斯和庇西斯特拉托斯都看惊了。满屋的光辉，如同太阳和月亮。他们把一切欣赏够了，才去浴室洗澡。仆人替两人洗净、抹油，送来羊毛斗篷和衬衣，他们坐到墨涅拉奥斯旁边。一个女仆拿着漂亮金壶，把水倒进银盆，请两人洗手，又搬来干净桌子。管事女仆拿出面包和家中各种好吃的，切肉的仆人送来一盘盘肉，在他们身边摆好金杯。
        - id: ch01-b06
          speaker: menelaus
          text: |-
            欢迎，请先吃饭。吃好了，我再问你们是谁。看你们这样的仪表，就知道家世必定不凡，一定是哪位执掌权杖的王的后人。穷人家可养不出这样的儿子。
        - id: ch01-b07
          speaker: narrator
          text: |-
            他把留给自己的上好烤腰肉拿过来，分给客人。那肉肥美，原本是给主人的好部位。两人开始享用。吃喝够了，忒勒马科斯把头凑向庇西斯特拉托斯，低声说，不想让旁人听见。
        - id: ch01-b08
          speaker: telemachus
          text: |-
            庇西斯特拉托斯，好朋友，你看那铜、那黄金，多亮！还有琥珀、象牙、白银。什么都华美极了，就像奥林波斯宙斯的宫殿一样，我都不知该怎样赞叹。
        - id: ch01-b09
          speaker: menelaus
          text: |-
            孩子们，人怎么能比得上宙斯。他的宫殿，他身边所有的东西，都是永远不朽的。凡人当中，也许有和我一样富的，也许没有。但我去过很多地方，苦也没少吃，差不多过了八年，才带船队回到家。我去过塞浦路斯、腓尼基，还有埃及人、埃塞俄比亚人、西顿人、厄瑞姆比亚人那里。也到过利比亚，那里的小羊一出生就长角，母羊一年能生三回。主人也好，仆人也好，都有充足的奶酪、肉和好奶，母羊一年四季都产奶。

            可我在各地漂泊，赚了许多财物的时候，兄长却遭恶妻背叛，暗中被惨杀。做这些财富的主人，我也一点不快乐。无论你们父母是谁，都该讲过这些，还该告诉你们，那座高大华丽、样样陈设齐全的宅子毁了，我损失多大。我愿只剩三分之一的财产，换我当年能留在家中，换那些远离阿尔戈斯、死在特洛伊平原的战士都还活着。

            我常坐在这里，为他们一个一个地难过。有时大声哭，后来又不哭了。哭没多少用处，人总会哭累。但有一个人，让我比想起其他所有人都悲痛。想到他，我连饭都不愿吃，觉也睡不着。阿开亚人里，谁比他更辛苦，更肯去冒险？他却没有得到好处，给我留下无尽哀愁。他这么久没回来，我们连死活都不知。老父亲、饱受苦难的妻子佩涅洛佩，还有出征时仍是怀中婴儿的忒勒马科斯，也都为他伤心。
        - id: ch01-b10
          speaker: narrator
          text: |-
            原来，墨涅拉奥斯听到了方才的低语。如今他这番话，却把忒勒马科斯的思父之情全勾了起来。年轻人一听到父亲，眼泪就落下，双手扯起斗篷，遮住了脸。国王看在眼里，不知该等他自己愿意说，还是马上问个清楚。

            他正犹豫，海伦下楼了。她从一间充满香气、有着高高拱顶的房间里出来，看上去就像阿耳忒弥斯那么美。阿德拉斯忒搬来椅子，阿尔基佩拿来软羊毛毯，菲洛捧来了银针线箱。这箱是阿尔坎德拉送的，她丈夫波吕波斯住在埃及的忒拜，那是世上最富的城。他曾给墨涅拉奥斯两个纯银浴盆、两只三脚鼎和十塔兰特黄金，妻子又给海伦一根金纺线杆，以及这只带轮子的银箱。箱口有金边，里面装着纺得细细的纱，缠紫羊毛的纺线杆放在箱上。菲洛把它放到海伦身旁。海伦坐好，把脚搁在脚凳上，问起丈夫。
        - id: ch01-b11
          speaker: helen
          text: |-
            墨涅拉奥斯，来的客人是谁，我们已经知道了吗？我不知自己猜得准不准，可有话实在想说。不论男的女的，我从没见谁长得这么像另一个人。看着他，我真不知怎么想。这年轻人像极了忒勒马科斯，奥德修斯当年留在家里的那个婴儿。你们阿开亚人那时一心作战，去了特洛伊，都为了我这个无耻的女人。
        - id: ch01-b12
          speaker: menelaus
          text: |-
            亲爱的妻子，你看出的，我也看出了。他的手和脚，都与奥德修斯相同。头发、头形、眼睛的神情，也像。刚才我说他父亲为了我，遭了那么多罪，他马上掉泪，把斗篷拉到脸前。
        - id: ch01-b13
          speaker: pisistratus
          text: |-
            阿特柔斯的儿子墨涅拉奥斯，您说得对。他就是忒勒马科斯，只是性子谦逊，面对您这样谈吐近乎神明的人，不好意思先开口。我父亲涅斯托尔让我陪他来，是想请您给些主意，指一指路。做儿子的，父亲走了，家里又没帮手，日子总有麻烦。他现在就是如此，父亲不在，同胞中没有人愿意支持他。
        - id: ch01-b14
          speaker: menelaus
          text: |-
            原来是好友的儿子来看我！你父亲为我受苦太多。我一直盼着，诸神让我们平安越海归来后，我要格外好好地招待他。我会在阿尔戈斯为他建城、造宅，请他带上财物、儿子和百姓，从伊萨卡迁来。我统辖的邻城，选一座攻掠下来，就给他们。那样我们随时相见，交情又亲，又快活，只有死才能把我们分开。可天上大概舍不得给这种幸福，连他回自己家，都不肯成全。
        - id: ch01-b15
          speaker: narrator
          text: |-
            他的话叫人人落泪。海伦哭，忒勒马科斯哭，墨涅拉奥斯也哭了。庇西斯特拉托斯想到亲爱的兄长安提洛科斯，被光辉黎明的儿子杀死，眼睛也湿了。他便开口对国王说。
        - id: ch01-b16
          speaker: pisistratus
          text: |-
            先生，在家说起您，父亲总夸您明白事理，别人很少能比。可以的话，就听听我的请求吧。我不想一面吃晚饭，一面哭。反正明天会来，等到上午，为死去的人哭多久，我都愿意。我们还能替他们做什么呢？只有剃下头发，让眼泪流满脸。我兄长死在特洛伊，绝不是那里差劲的人，您肯定认识。他是安提洛科斯。我自己没见过他，大家却都说，他跑得飞快，打仗勇猛。
        - id: ch01-b17
          speaker: menelaus
          text: |-
            好朋友，你真不像这个年纪的人，懂事得多，分明像你父亲。上天赐给一个人好妻子、好儿女，这样的父亲养出的孩子，很容易认出来。涅斯托尔一辈子受着福，如今在自己家中，身子健旺地老去，儿子们陪伴着，心地好，也有勇气。那我们就停下哭泣，再吃些吧。拿水来，让大家洗手。明天一早，我和忒勒马科斯有的是时间细谈。
        - id: ch01-b18
          speaker: narrator
          text: |-
            仆人阿斯法利翁端水给大家洗了手，众人重新拿起面前的好食物。
    - id: ch02
      title: 海伦与木马中的往事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            宙斯的女儿海伦又有了个主意。她给酒加了一种草药，喝下去，忧虑、悲伤、坏心情都能消掉。当天余下的时间里，人一滴泪也流不出。父母双双死在眼前也好，亲眼见兄弟或儿子被砍成碎块也好，都不会哭。这种厉害的药，来自埃及，是托翁的妻子波吕达姆娜给她的。埃及长各种药草，有的能放进酒缸，有的却有毒。那里的人属于佩埃翁一族，个个会医病，医术都好。海伦把药放好，让仆人传酒，就开始说话。
        - id: ch02-b02
          speaker: helen
          text: |-
            阿特柔斯的儿子墨涅拉奥斯，还有各位名门的好朋友，尽情吃喝吧。人出身怎样，都是宙斯安排，福是他给的，祸也由他降下，全凭他喜欢。我来讲个合适的故事。奥德修斯立过那么多功，没法一件一件讲，我就说说，你们阿开亚人在特洛伊城前困难很多的时候，他做的一件事。

            他把自己弄得浑身是伤，穿上破衣服，走进敌人的城。看上去像干粗活的仆人，像乞丐，完全不是我们平常认识的样子。他这样进了特洛伊，没人问什么，只有我认出他，开始盘问。可他的心思太巧，我问不出来。后来，我替他洗澡、擦油，给了衣服，又发下重誓，在他回到阿开亚人的营地和船旁以前，我绝不揭穿他。他才肯把我们的全部计划告诉我。

            他回去以前，还杀掉不少特洛伊人，收集了许多消息。城里的女人哭个不停，我却开心。那时我已经想回家，后悔阿佛洛狄忒给我惹的祸，她把我带来这里，让我丢开自己的国家、女儿，还有合法的丈夫。我那丈夫，论长相、论头脑，哪一样也不差啊。
        - id: ch02-b03
          speaker: menelaus
          text: |-
            亲爱的妻子，你讲得一点不假。我去过许多地方，也和不少英雄打过交道，就是没见过第二个奥德修斯。木马里面，他多能忍，多勇敢！我们阿尔戈斯最好的战士都藏在那里，等着给特洛伊人送去死亡和毁灭。就在那时，你走到木马旁，得伊福波斯也跟着。一定是哪位偏向特洛伊的神，叫你来的。

            你把藏着我们的木马绕了三遍，边走边拍，逐个喊首领的名字，声音却学成我们妻子的样子。狄奥墨得斯、奥德修斯和我，在里面全听见了。我跟狄奥墨得斯都犹豫，到底跳出去，还是隔着木板回应？奥德修斯不准，我们才没动。只有安提克洛斯想答话。他立刻伸出结实的双手，捂住那人的嘴，怎么也不放。这一捂，救了所有人的命。他一直这样堵着，直到雅典娜把你领走。
        - id: ch02-b04
          speaker: telemachus
          text: |-
            可惜啊，他做了这么多，还是不能救自己，连钢铁般的勇气也没用。先生，现在请安排我们睡下吧，好让大家躺着，享一享安眠的福气。
        - id: ch02-b05
          speaker: narrator
          text: |-
            海伦吩咐女仆，到门楼的房间铺床，用好红毯，铺上床罩，再拿羊毛斗篷给客人披。女仆举着火把去准备，一个男仆过会儿便引客人去。忒勒马科斯和庇西斯特拉托斯睡在前院，阿特柔斯的儿子在内室就寝，美丽的海伦躺在他身旁。
    - id: ch03
      title: 海岛上遇见女神
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            清晨的女儿、玫瑰指的黎明一来，墨涅拉奥斯便起来穿衣。他把凉鞋系在俊美的脚上，肩膀佩上剑，走出房间，神采像个不朽的天神。他来到忒勒马科斯旁边坐下。
        - id: ch03-b02
          speaker: menelaus
          text: |-
            忒勒马科斯，说说吧，为什么渡这么远的海到拉刻代蒙？是为了公事，还是自己的私事？我想听听整个缘由。
        - id: ch03-b03
          speaker: telemachus
          text: |-
            先生，我想知道您有没有父亲的消息。我们家快被吃垮，好好的产业不停损失。一屋子坏人，动不动宰很多牛羊，说是为了向母亲求婚。我在您膝前求告，若您知道父亲怎样惨死，就请告诉我。亲眼看见也好，旁的旅人说的也好。他生来就有这么多苦处。您不要同情我，就不肯说重话。见过什么，请一字不瞒。当年阿开亚人在特洛伊人手下苦战，英勇的父亲奥德修斯若用言语、用行动忠心帮过您，就请您现在念他的情，把实情交代给我。
        - id: ch03-b04
          speaker: narrator
          text: |-
            墨涅拉奥斯大吃一惊。
        - id: ch03-b05
          speaker: menelaus
          text: |-
            这群胆小鬼，竟敢想占一个勇士的婚床！母鹿若把刚生的小鹿放在狮窝，自己去林子或长草的山谷吃东西，等狮子回来，母子很快都没命。奥德修斯回去，也会这样收拾那些人。凭父亲宙斯、雅典娜、阿波罗说一句，他如果还有在莱斯博斯摔跤时的本领就好了。他把菲洛墨勒伊德斯狠狠摔下，所有阿开亚人都叫好。这样的奥德修斯一到，求婚人就活不长了，婚礼准会很惨。

            你要问的事，我绝不绕圈，也不骗你。海中老人对我讲过的话，我会全部告诉你。当年我正想回家，却被神留在埃及。我献的百牲祭还不够让他们满意。他们该得的供奉，向来要求得很严。

            埃及外海有个法罗斯岛，船要是遇着强劲顺风，一天差不多就到了。那里港口很好，可以补水，随后驶向外面的大海。我却在岛上困了二十天，没有一点好风肯吹我们走。吃的眼看就要用光，船员全要饿死，幸亏有女神怜悯我，救了我。她是海中老人普罗透斯的女儿，名叫伊多忒娅，很喜欢我。

            有一天我独自待着，她来找我。船员们常拿带倒刺的鱼钩，绕遍岛子，看能不能钓一两条鱼，好不那么饿，所以我常是一个人。她就这么问我。
        - id: ch03-b06
          speaker: idothea
          text: |-
            外乡人，你喜欢饿着肚子吧？就算不喜欢，也没怎么发愁。否则怎么一天又一天住下，连走都不想办法？你那些人，都在慢慢饿死呢。
        - id: ch03-b07
          speaker: menelaus
          text: |-
            我告诉她，不论您是哪一位女神，我都不是情愿留下的。肯定是我得罪了天上的神。你们无所不知，请说说，究竟谁不让我走？我怎样才能渡海回到家里？
        - id: ch03-b08
          speaker: idothea
          text: |-
            外乡人，我把办法讲清楚。附近水下住着个不老不死的人，叫普罗透斯，是个埃及老人，大家说他是我父亲。他是波塞冬最重要的侍从，海底哪一寸地方都知道。你把他捉住，抓牢别放，他就会指点你，该选什么航路，怎样渡海回家。愿意的话，你还可以问，自己长期冒险在外时，家里有过哪些好事坏事。他也能告诉你。
        - id: ch03-b09
          speaker: menelaus
          text: |-
            我又请她指教，要用什么计策，才能不让这位老神发觉、起疑，把他抓住？凡人捉神，可太难了。
        - id: ch03-b10
          speaker: idothea
          text: |-
            我来解释，外乡人。太阳升到天中间，海中老人就会浮出水面。他没出来，西风已经吹动头顶的海水，仿佛替他报信。他上来后，便到一处很大的海洞里躺下睡觉。海豹也从灰海中上岸，这些就是人们说的哈洛叙德涅的小鸡。它们成群睡在他周围，浑身浓浓的鱼腥味。

            明早我领你去，藏好埋伏。你先从整支船队选三个最能干的人，我再说说，他会怎样对付你。先是巡视海豹，一个个数，用五根手指核清楚，再像牧人躺在羊群里那样睡下。等他一睡着，你们赶紧抓，全部力气都用上，不让他跑。他会拼命挣脱，会变成地上各种动物，连水、火都能变。可你们别松手，还得越捉越紧。直到他开口，恢复入睡时那副模样，你们才能放开，问哪个神在生气，问怎么才能横渡海洋，回自己家。
        - id: ch03-b11
          speaker: menelaus
          text: |-
            她说完，就钻回浪里了。我走向岸边停着的一排船，心里很愁。到了自己的船旁，天快黑了，大家备好晚饭，在海滩上安睡。
    - id: ch04
      title: 抓住海中老人
      blocks:
        - id: ch04-b01
          speaker: menelaus
          text: |-
            玫瑰指的黎明一现身，我就叫上那三个伙伴。无论哪方面的本领，他们都是我最放心的。我们沿着海边走，诚诚恳恳祈求上天。女神那边也在忙，从海底取了四张刚剥下的海豹皮，要用来骗她父亲。她先挖好四个让人躺下的坑，坐着等。我们一走近，她就叫我们一个接一个躺进去，每人身上盖一张皮。

            这埋伏可难熬，腥臭太呛人了。谁想跟海兽睡一块儿啊？幸好她又帮了忙，想出解救的办法，在我们鼻子下面放了点神食，香得把臭味都压下去。这才使人好受起来。

            整个上午，我们耐着等，看见一群群海豹上岸晒太阳，足有几百头。中午，海中老人来了，看看那些肥胖的海豹，开始数。我们就在前几个里，他竟没怀疑。数完，他躺下睡了。我们叫喊着扑上去，把他抓牢。他马上变，一会儿是长鬃狮子，一会儿是龙，再变豹子、野猪，又成了流动的水，忽然又是一棵树。可我们始终不放。老家伙虽然狡猾，也难受得撑不住，终于开口了。
        - id: ch04-b02
          speaker: proteus
          text: |-
            阿特柔斯的儿子，是哪个神跟你一起安排了这个圈套？你们硬把我捉住，究竟想做什么？
        - id: ch04-b03
          speaker: menelaus
          text: |-
            我就回答，老人家，您自己还不明白吗？躲开我的问题，对您有什么用？我在这里已经困太久，看不出什么时候能走，几乎绝望了。神样样事都知道，那么，到底是哪位神阻拦我？我该怎么出海，才能到家？
        - id: ch04-b04
          speaker: proteus
          text: |-
            想早点完成航行，顺顺当当回去，就得先向宙斯和其他神献祭，再上船。你的命运已经定好了。要先回埃及，进入那条由天水养育的河流，向天上永生的统治者们，献上神圣的百牲祭，才能回到朋友身边，回自己的房子。祭礼办好，他们便会放你走完这条路。
        - id: ch04-b05
          speaker: menelaus
          text: |-
            想起要再走那段漫长又可怕的海路，回到埃及，我心都碎了。可是我仍答应了，老人家，我会把您交代的全做完。但还有件事，请您告诉我真相。涅斯托尔和我当时离开特洛伊，其他阿开亚人还在后头。他们都安全回家了吗？有没有人在仗打完以后，死在自己的船上，或在亲友身边遭了灾？
        - id: ch04-b06
          speaker: proteus
          text: |-
            阿特柔斯的儿子，何必要问？不听，或许更好。听见我说的，你一定要掉眼泪。那些人，许多死了，许多还活着。阿开亚的首领在回家途中死了两个。至于战场的死伤，你也在那里，不用我讲。另有第三位，人活着，却在海上回不去。

            埃阿斯遭遇船难。波塞冬把他赶到居赖的大岩石上，又让他从水里逃生。雅典娜虽恨他，他本来也能不死，可他自己夸口，断了性命。他竟说诸神想把自己淹死，还是没有本事办到。波塞冬听到，双手紧握三叉戟，把那块岩石劈成两截。下面的基座没动，上面托着埃阿斯的那一块，连人一起砸进了海。他灌满咸水，淹死了。

            你兄长和船队逃过一劫，是赫拉在保护。快到马勒亚高海角时，又遇大风，硬把船吹离他想去的地方，重新推回外海。船被赶到从前堤厄斯忒斯住过的岬岸，现今埃癸斯托斯在那里。后来，诸神让风转回原来的方向，船似乎终于能平平安安回去了。他们果然到了家，阿伽门农低头亲吻本乡的土地，为重返祖国而高兴得流泪。

            可埃癸斯托斯安排了一个人长年瞭望，答应付两塔兰特黄金。那人已经盯了一整年，防着阿伽门农悄悄到家、准备交战。他看见国王经过，马上报给埃癸斯托斯。阴谋就开始了，那人挑二十名最勇敢的武士，藏在回廊一边，对面摆酒宴。然后派车马迎阿伽门农来，说是请他吃饭，实则害命。国王毫无戒心地来了，根本不知道会死。宴席结束，埃癸斯托斯就像屠场杀牛一样杀了他。阿伽门农的随从一个没剩，埃癸斯托斯的随从也全死了，所有人倒在那些回廊里。
        - id: ch04-b07
          speaker: menelaus
          text: |-
            普罗透斯说了这些，我难过得心碎，坐在沙上哭。我连活下去都不想，也不想再见太阳。我倒在地上翻滚，痛哭很久，直到哭够了，那老人才继续说。
        - id: ch04-b08
          speaker: proteus
          text: |-
            阿特柔斯的儿子，别这样苦哭，白白耽误时间了，半点用也没有。你该尽快找路回家。埃癸斯托斯也许没死，就算俄瑞斯忒斯已经先下了手，你还可能赶上那人的葬礼。
        - id: ch04-b09
          speaker: menelaus
          text: |-
            这话让我稍稍好受些，尽管仍是悲伤。我便说，这两个我清楚了，那么第三个呢？他真还活着，困在海上不能回来？还是人已经没了？再难过的消息，我也请您直说。
        - id: ch04-b10
          speaker: proteus
          text: |-
            是伊萨卡的奥德修斯。我看见他在一座岛上，在仙女卡吕普索的房子里，伤心得很。她不放他走，他又没有船，没有水手帮忙渡海，回不了家。你的结局却另有安排，墨涅拉奥斯。你不会死在阿尔戈斯，诸神要把你送到世界尽头的厄吕西翁原野。

            那里有金发的拉达曼提斯掌管，人活得比其他任何地方都安适。没有雨，没有冰雹，也没有雪。俄刻阿诺斯总送来西风，从海上轻轻唱着吹过，让每个人都有新鲜活力。因为你娶了海伦，成为宙斯的女婿，所以有这样好的去处。
        - id: ch04-b11
          speaker: menelaus
          text: |-
            说完，他潜回水下，我和伙伴往船上走，一路心里还是不安。到船边，夜又快来了，我们做晚饭，睡在海滩。清晨的女儿、玫瑰指的黎明出现，大家把船推下水，安置桅杆、船帆，自己上去，坐上桨座，划开灰色的海。船再次进入埃及那条受天水滋养的河流。我献了足够多、样样合宜的百牲祭，才把众神的怒意平息，又给阿伽门农造一座纪念坟冢，让名字能永久留下。之后，有神赐的顺风，我很快就回了家。

            现在，忒勒马科斯，你再多住十天或者十二天，我送你走，还要送一份大礼。一辆车，三匹马，再加一个美丽的酒爵。往后一生，你每次用它向不朽的诸神献酒，都能想起我。
        - id: ch04-b12
          speaker: telemachus
          text: |-
            阿特柔斯的儿子，还是别再挽留了。其实，让我听您再说十二个月，我也乐意，都不会记起要回家陪父母。您的谈话太好听。但船员等在皮洛斯，已经着急，您留着我，我就没法回到他们身边。

            礼物若能选，我想要一件金属做的贵重器皿。马就不往伊萨卡带了，让它们留在您的厩里，增光吧。这里有大片平地，莲草、绣线菊、麦子和大麦都长得好，燕麦还抽着又白又舒展的穗。伊萨卡没有宽广田野，没有赛马地方，倒更适合山羊。我还偏偏因此更喜欢它。这些岛里，都不太有养马的平地，伊萨卡最少。
        - id: ch04-b13
          speaker: narrator
          text: |-
            墨涅拉奥斯笑着，把他的手握进自己手中。
        - id: ch04-b14
          speaker: menelaus
          text: |-
            这话一听就知道，你家教很好。你想换礼物，我有办法，也很愿意。我给你家中最珍贵、最好的一件器皿，是赫淮斯托斯亲手造的调酒缸。除了镶金的边缘，全身都是纯银。我回家路上，再次去拜访西顿国王斐狄摩斯，这是他送我的。现在就送你吧。
        - id: ch04-b15
          speaker: narrator
          text: |-
            两人说话的时候，客人还不断来。他们带着羊和酒，妻子为他们包好的面包也拿来了，大家便在院中忙着准备饭食。
    - id: ch05
      title: 伊萨卡的阴谋
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            伊萨卡这边，求婚人正在奥德修斯家门外玩，平整的地面上，有人扔铁饼，有人掷长矛瞄靶，仍然那样放肆。他们最主要的首领安提诺奥斯和欧律马科斯坐在一块儿。弗洛尼奥斯的儿子诺厄蒙走过去，向安提诺奥斯打听。
        - id: ch05-b02
          speaker: noemon
          text: |-
            安提诺奥斯，有没有听说，忒勒马科斯哪天从皮洛斯回来？他拿着我的船，我想用它去厄利斯。那里养了十二匹种母马，跟着一岁大的骡驹，都还没驯过。我想带一头回来驯养。
        - id: ch05-b03
          speaker: narrator
          text: |-
            两人吃了一惊。他们认定忒勒马科斯没去涅琉斯的城，只以为他在某个田庄，看羊，或者找牧猪人去了。安提诺奥斯马上追问。
        - id: ch05-b04
          speaker: antinous
          text: |-
            他到底什么时候走的？老实告诉我，带了哪些青年？是自由人，还是自家奴仆？找些奴仆，他倒可能办到。你的船呢，是他求你帮忙，你乐意借的，还是他不经同意就拿走？
        - id: ch05-b05
          speaker: noemon
          text: |-
            我愿意借的。他这样的身份，遇了难事，来请我帮一把，我总不能说不吧？跟去的，都是本地最好的年轻人。我还看到门托尔登船，像船长一样。或者那是个神，长得跟他完全一样。我就不懂，昨天上午明明还在这里见着门托尔，他那时不该正在去皮洛斯的路上吗？
        - id: ch05-b06
          speaker: narrator
          text: |-
            诺厄蒙回父亲家去了。安提诺奥斯与欧律马科斯大怒，叫大家停下游戏，到这边坐。人一聚拢，欧佩忒斯的儿子安提诺奥斯便发话。他心里满是愤怒，眼睛像冒着火。
        - id: ch05-b07
          speaker: antinous
          emotion: angry
          text: |-
            这可不得了，忒勒马科斯居然真出海了！我们还以为他准会失败。可他不顾我们，挑了好船员，跑了出去，再过些时候就要惹事。愿宙斯别等他长大，就把他收去。给我找船，配二十个人，我要守在伊萨卡和萨摩斯之间的水道，等他回来。他会后悔出去找父亲的！
        - id: ch05-b08
          speaker: narrator
          text: |-
            众人都叫好，随后进屋商量。没多久，佩涅洛佩就知道了。原来仆人墨冬在外院外面，听到他们在里面的密谋，赶去向女主人报告。脚才跨过她房门，她便先问。
        - id: ch05-b09
          speaker: penelope
          text: |-
            墨冬，他们又叫你来干什么？是不是要女仆把主人的工作扔下，替他们做饭？我真盼这些人再也不能求婚，再也不能吃宴席，这里不能，哪儿都不能。让这是最后一次吧！你们把我儿子的财产这样浪费。小时候，父亲没教过你们，奥德修斯待他们怎样好吗？他既不专横，也不说难听的话。国王难免有时爱这个，烦那个，说些重话，可他从没亏待任何人。你们却这样报答，真是坏心肠，世间连感恩都没有了。
        - id: ch05-b10
          speaker: medon
          text: |-
            夫人，真愿只有这么点事。可他们准备干的，还要可怕。求神明让他们办不成吧。他们要杀忒勒马科斯，等他从皮洛斯、拉刻代蒙回来时下手。他去那里，是打听父亲的消息。
        - id: ch05-b11
          speaker: narrator
          text: |-
            佩涅洛佩心直往下沉，半晌说不出话。眼里满是泪水，一句话也说不了，好久才问出来。
        - id: ch05-b12
          speaker: penelope
          emotion: sad
          text: |-
            儿子怎么舍下我走了？为什么要乘那些海马一样在海上远航的船？他难道想死在外头，连替自己传下姓名的后人都没有？
        - id: ch05-b13
          speaker: medon
          text: |-
            我不知道是哪个神让他动身，还是他自己想去。他只是要看看，能否问出父亲死了，还是活着，正在回家。
        - id: ch05-b14
          speaker: narrator
          text: |-
            墨冬下楼去了，佩涅洛佩却悲伤得受不了。家里并不缺座椅，她偏一张都不想坐，扑在卧房地上哭。所有女仆聚拢来，年老的、年轻的，都跟着流泪。她心里疼得厉害，终于大声说起来。
        - id: ch05-b15
          speaker: penelope
          emotion: sad
          text: |-
            我的姐妹们，同国同龄的女人，哪一个比我更受上天折磨！先失去丈夫，他像狮子一样勇敢，有天底下所有的美德，希腊与阿尔戈斯中部都传他的名。现在心肝儿子又交给了风浪，我连他要出门都不知道。

            你们这些坏丫头，个个晓得他启程，竟没有谁到床边叫我一声。我若知道，哪怕他再下决心，也不许他走。他要么放弃，要么把我的尸首留在家里，只有这两条路。现在去叫老多利奥斯吧，我出嫁时父亲给我的那个园丁。让他立刻跑一趟，跟拉厄尔忒斯全说清。也许老人有办法使百姓同情我们，对付这帮要杀尽他和奥德修斯后代的人。
        - id: ch05-b16
          speaker: euryclea
          text: |-
            夫人，您想杀我，还是让我活在家里，都由您。我会讲实话。我全知道，也把面包和酒给他备好了。他要我郑重起誓，十天、十二天里不跟您透露，除非您问起来，或听说他已经走了。他不想您哭坏容颜。

            请先洗脸，换衣服，带侍女上楼向雅典娜祷告。她是持神盾的宙斯的女儿，儿子哪怕到了死神嘴边，她也能拉回来。别再告诉拉厄尔忒斯，他已经够苦了。我不相信，诸神会那么恨阿尔刻西奥斯儿子这一支人。总会留个儿子接下去，继承宅院，还有周围铺得很远的好田地。
        - id: ch05-b17
          speaker: narrator
          text: |-
            老奶妈这样劝，女主人便停下了哭。她替女主人擦掉眼泪。佩涅洛佩洗净面孔，更换衣裳，和侍女到楼上，取一个篮子放入捣碎的大麦，开始祈祷。
        - id: ch05-b18
          speaker: penelope
          text: |-
            永不疲倦的女神，持神盾的宙斯的女儿，请您听我。奥德修斯从前在家，若给您烧献过羊与小母牛肥肥的腿骨，今天请记着他的供奉，帮帮我，让我亲爱的儿子不受那些恶求婚人残害。
        - id: ch05-b19
          speaker: narrator
          text: |-
            她放声祈求，雅典娜听到了。下面有顶的回廊，求婚人却闹得正欢，有一个说道。
        - id: ch05-b20
          speaker: suitor_other
          text: |-
            王后正收拾着，要嫁我们之中的谁呢。哪里晓得，她儿子早就要没命了。
        - id: ch05-b21
          speaker: narrator
          text: |-
            他们这样说，自己的前途却什么也不知道。安提诺奥斯让大家小声些。
        - id: ch05-b22
          speaker: antinous
          text: |-
            同伴们，别嚷那么大声，让话传进内室就不好了。我们都商量一致了，悄悄起身，去做那件事吧。
        - id: ch05-b23
          speaker: narrator
          text: |-
            安提诺奥斯选了二十人，走到海边，把船推入水里，装好桅杆与帆。他们按次序，用拧成的皮带把桨系在桨柱上，再把白帆扬起。忠实的仆人拿来了盔甲武器。众人在距岸稍远处系好船，上岸吃了晚饭，等着天色变黑。
    - id: ch06
      title: 姐妹的幻影
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            佩涅洛佩在楼上躺着，什么也吃不进、喝不下。勇敢的儿子能躲开吗？还是敌不过那伙恶人？她像陷进猎网、四面被猎人逼近的母狮，脑中不断翻腾这些念头。直到睡去，她才在床上静静地不动，也不再思量。

            雅典娜另外想了个法子，做出一道幻影，长得跟佩涅洛佩的妹妹伊芙提墨一样。妹妹是伊卡里奥斯的女儿，嫁给欧墨洛斯，住在费赖。雅典娜叫幻影去奥德修斯家，安慰佩涅洛佩，让她不再掉泪。幻影从门上穿皮带的小洞钻进去，那根皮带是拉门用的。它悬在睡着的人头顶，开口说话。
        - id: ch06-b02
          speaker: vision_iphthime
          text: |-
            佩涅洛佩，你现在睡着了。诸神自己日子安逸，也不会让你一直哭、一直伤心。儿子没做得罪他们的事，会回来见你的。
        - id: ch06-b03
          speaker: narrator
          text: |-
            佩涅洛佩甜甜地睡在梦的门口，从那里回答她。
        - id: ch06-b04
          speaker: penelope
          text: |-
            妹妹，你怎么来了？你不常来看我，大概因为家太远吧。真要我不哭，真要我把那些折磨人的想法丢开吗？我失了勇敢如狮的丈夫，世上的好品质他都具备，希腊和阿尔戈斯中部，到处知道他的名。现在儿子也登船走了，傻孩子没吃过苦，更没习惯在成群的人中来往。

            我对他的担心，比对丈夫还厉害。想一想就发抖，怕他在远方人那里出祸，怕他在海上出祸。他的仇人那么多，商量好非得在回家前杀死他。
        - id: ch06-b05
          speaker: vision_iphthime
          emotion: calm
          text: |-
            别这么害怕，振作些。有位陪伴他的，是多少人巴不得请到身边的帮手，就是雅典娜。她可怜你，所以差我来送个信。
        - id: ch06-b06
          speaker: penelope
          text: |-
            如果你是位神，或受了神的命令，那另一个苦命的人，也请告诉我吧。他还活着吗？还是死了，已在哈得斯的宫里？
        - id: ch06-b07
          speaker: vision_iphthime
          text: |-
            他是活是死，我不会给你确切的断言。说些无凭的话，没什么用处。
        - id: ch06-b08
          speaker: narrator
          text: |-
            幻影又穿过皮带小孔，化散在空气里。佩涅洛佩醒来，心里得了宽慰，精神也好了，因为刚才的梦鲜明得那么真切。

            这时候，求婚人已经上船，向海上驶去，铁了心要害忒勒马科斯。伊萨卡与萨摩斯之间的水道正中，有座不大的岩石岛，叫阿斯忒里斯。两边都有港口，可以停船。那些阿开亚人，就藏在了这里。
