audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    menelaus:
      display_name: 墨涅拉奥斯
      tts: {delivery: 坦诚而好客, timbre: 成熟浑厚, pace: 稳健, pitch: 中低音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    helen:
      display_name: 海伦
      tts: {delivery: 从容而善于思索, timbre: 温润清亮, pace: 舒缓, pitch: 中音}
    proteus:
      display_name: 普罗透斯
      tts: {delivery: 谨慎而通晓世事, timbre: 苍老粗厚, pace: 从容, pitch: 低音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: 深思而克制, timbre: 清晰温润, pace: 舒缓, pitch: 中音}
    vision_iphthime:
      display_name: 伊芙提墨的幻影
      tts: {delivery: 轻柔而笃定, timbre: 轻盈清楚, pace: 平缓, pitch: 中音}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: 亲切而坦率, timbre: 温厚苍老, pace: 从容, pitch: 中低音}
  chapters:
    - id: ch01
      title: 客席上的往事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            两人到斯巴达，赶上墨涅拉奥斯家办婚事。他的女儿赫耳弥奥涅要嫁给阿喀琉斯的儿子，儿子墨伽彭忒斯娶的是斯巴达姑娘。亲友聚在屋里，唱歌弹琴。

            仆人见门外来了生客，就问是接进来，还是让他们找别处。主人听了生气。
        - id: ch01-b02
          speaker: menelaus
          text: |
            我们在外头这么多年，也靠别人款待，难道忘了？卸了马，请他们进来吃饭！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: |
            客人洗浴更衣，吃过饭。忒勒马科斯望着金银、象牙和铜器，对同伴小声说，宙斯的家怕也不过这样。主人听见，说凡人哪能同神比。他走了近八年，带回很多财富，哥哥却在这时候被人害死。若能让特洛伊死去的同伴活着，他只留三分之一的财产也甘愿。
            最让他牵挂的是奥德修斯。那人替大家吃了最多的苦，至今生死不知，老父、妻儿都等着。青年听得流泪，拿斗篷挡脸。这时海伦入了座，看着青年，问丈夫。
        - id: ch01-b04
          speaker: helen
          text: |
            他是不是奥德修斯的儿子？两人太像了。
        - id: ch01-b05
          speaker: narrator
          text: |
            庇西斯特拉托斯说明了他的身份，说是父亲涅斯托尔让自己陪他来找消息。墨涅拉奥斯说，原来盼着回家以后，能接老友一家到阿耳戈斯。他甚至打算攻破自己管辖的一座城，让奥德修斯带着人和产业搬来住。这样，两人就能常常见面，一直来往到老死。可神竟然连奥德修斯回家都不肯答应。
            大家都哭了。庇西斯特拉托斯也想起没见过的哥哥安提洛科斯，他死在特洛伊。青年请大家先吃，明早再哀悼。主人答应。
            海伦往酒里加了埃及的神奇药草。喝下去，一整天都不会哭，哪怕眼看父母死去，孩子被砍碎也一样。她开始讲奥德修斯潜入特洛伊的事。
            他伤了自己，穿破衣扮成乞丐进城，只有海伦认出他来。她给他洗澡更衣，发誓直到他回希腊军营都保密，他才告诉她计划。后来，他杀了许多特洛伊人，带情报逃出。城里的女人为死去的人哭泣，海伦却高兴。
        - id: ch01-b06
          speaker: helen
          text: |
            我那时已经想家了，想女儿，想丈夫，也后悔阿佛洛狄忒带我到特洛伊。
        - id: ch01-b07
          speaker: menelaus
          text: |
            还有木马那次。我们躲在里面，等着攻城，你和得伊福波斯绕着走，叫人名，模仿我们妻子的声音。我跟狄奥墨得斯想回答，想跳出去，奥德修斯都不让。安提克洛斯刚要开口，他就死死捂住他的嘴，直到雅典娜把你领走。
        - id: ch01-b08
          speaker: narrator
          text: |
            忒勒马科斯叹息，父亲这么有本事，也没救得了自己。他请求去睡，两位青年就到门楼歇了一夜。
    - id: ch02
      title: 抓住变形的海神
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            第二天，他说出家里的困境，请主人不管听过什么，都直说。国王愤怒地说，求婚人就像住进狮穴的小鹿，狮子回来，谁还活得了？
        - id: ch02-b02
          speaker: menelaus
          text: |
            你父亲的消息，海神普罗透斯确实告诉过我。我不会瞒你，他说了什么，我就全讲出来。不过，先得让你知道，我是怎样找到他的。
        - id: ch02-b03
          speaker: narrator
          text: |
            他曾经被困在埃及外海，一个叫法罗斯的岛上，整整二十天，没有一阵能让船离开的顺风。粮食快用完了，船员只能去钓鱼，找些吃的充饥。普罗透斯的女儿伊多忒娅看见国王独自在岸上，问他怎么还要留着，难道看着部下一天天饿死？
        - id: ch02-b04
          speaker: menelaus
          text: |
            我不是不想走，是没办法。到底哪个神在拦我？该怎么回家？
        - id: ch02-b05
          speaker: narrator
          text: |
            她说，父亲知道。每天中午，他会来海豹当中睡觉。选三个最可靠的人埋伏，趁睡着抓住他。无论变成什么，都别放。
            第二天，她挖了四个浅坑，叫他们躺下，用新剥的海豹皮盖住。四个人闻着那股腥臭，几乎受不了。她便在他们鼻下各放些带香味的神食。到了正午，普罗透斯上岸，点数海豹时把四个人也算了进去，毫不疑心地睡下。
            四个人同时扑过去，把海神抓住。抓在手里的，先变成一头狮子，再变成其他猛兽，然后又是流水、树木。变了这么多样，他们仍然牢牢抓着，不肯松手。海神终于变回老人，问是谁教他们这样做，又为什么要抓他。国王只求一条能回家的路。
            海神要他返回埃及，补足欠神的祭礼。他不情愿再折回，也只好答应，还问了分散的统帅后来怎样。
            埃阿斯从沉船逃生，竟说神也淹不死他。波塞冬就劈开脚下的礁石，让他沉到海底。阿伽门农已经归来，高兴得吻故乡的土地。可埃癸斯托斯买通一个人，等他的船等了整整一年。得到报信，就设宴，藏好二十个伏兵，把国王骗来，像杀牛一样杀了他。双方的随从，也都死在这场争斗里。
            墨涅拉奥斯一听，倒在沙上痛哭。海神催他快回去，凶手也许还活着。就算俄瑞斯忒斯已经杀了他，也许还能赶上葬礼。
            还有第三个人活着，困在海上。国王追着问是谁。
        - id: ch02-b06
          speaker: proteus
          text: |
            奥德修斯。我见他在卡吕普索那里哭。女神不让他离岛，他又没船、没水手，没法过海。
        - id: ch02-b07
          speaker: narrator
          text: |
            普罗透斯还预言，国王娶了宙斯的女儿海伦，晚年就会被送到厄吕西翁，安享那里的生活。说完，他潜入海里。墨涅拉奥斯返回埃及，献了祭，又给哥哥建纪念的墓冢，这才有顺风，回到了斯巴达。
            主人想再留青年十天或十二天，送一辆车、三匹马和酒杯。青年却惦记皮洛斯的船员，不想久住。
        - id: ch02-b08
          speaker: telemachus
          text: |
            伊萨卡山多，地方又小，适合养山羊，养马就不合适了。礼物最好换成我能带回家的东西。
        - id: ch02-b09
          speaker: narrator
          text: |
            国王笑着答应，给他最好的银碗。这碗镶着金边，是赫淮斯托斯造的，西顿国王赠给他的。家里又来客人了，下一顿饭也开始准备。
    - id: ch03
      title: 儿子的船与母亲的泪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            伊萨卡的诺厄蒙也要用船，来问安提诺奥斯，忒勒马科斯什么时候从皮洛斯回。

            他们惊讶了，一直以为青年在乡下，哪想到出了海。船主说自己愿意借，去的都是本地好青年，门托尔也跟着。可后来，他又在城中见过门托尔，实在奇怪。

            他走后，安提诺奥斯气冲冲召来同伴。
        - id: ch03-b02
          speaker: antinous
          text: |
            这小子还没长大就能找麻烦！给我船，二十个人。我们半路截住他，别让他上岸。
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: |
            他们要在伊萨卡附近的海峡杀人。同伴都赞成，仆人墨冬却在外头听到了。他上楼告诉佩涅洛佩。她还以为那些人又催女仆做饭，正想抱怨，才听清，儿子离家了，还有人要杀他。她听得连话也说不出了。
        - id: ch03-b04
          speaker: penelope
          text: |
            他怎么能走呢？想死在外面，连替他留下名字的人也没有吗？
        - id: ch03-b05
          speaker: narrator
          text: |
            墨冬也说不清，是神带着他走，还是他自己决心去找父亲。墨冬离开后，母亲倒地痛哭，怪女仆怎么没有叫醒她。若她早知道，儿子就得取消这趟航行，要不便让她死在眼前。她要园丁多利奥斯去找拉厄尔忒斯，也许老人能求得百姓帮忙。乳母这才说出实情。
        - id: ch03-b06
          speaker: euryclea
          text: |
            您杀我也好，让我活也好，我先说实话。粮酒都是我备的。他叫我起誓，瞒住十天或十二天，除非您先问。他怕您又哭得憔悴。别惊动拉厄尔忒斯了，他够难过了。洗脸换衣，求求雅典娜，她能从死里把孩子救回来。
    - id: ch04
      title: 梦里没有说出的消息
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            佩涅洛佩洗脸，换好衣服，带女仆上楼祈祷，请雅典娜记得丈夫从前的祭礼，救他们的儿子。求婚人还当她筹备结婚呢。安提诺奥斯让大家闭嘴，悄悄备船。武器搬上去，人也齐了，就等天黑。

            母亲吃不下，想来想去，都是儿子的安危。后来她睡了。雅典娜派来一个梦影，样子就像她的妹妹伊芙提墨，说儿子会平安回家。她却仍不放心，青年没经历过这样的苦难，还有仇敌想要他的命。
        - id: ch04-b02
          speaker: vision_iphthime
          text: |
            雅典娜正陪着他。她派我来，就为把这话告诉你。
        - id: ch04-b03
          speaker: penelope
          text: |
            那我丈夫呢？他到底还活着没有？
        - id: ch04-b04
          speaker: narrator
          text: |
            梦影没肯说出奥德修斯的生死，马上不见了。她醒来，多少安心了些。但儿子在斯巴达得到的消息，她还不知道。

            求婚人的船已经到了阿斯忒里斯，藏进避风的港湾，等着截杀青年。
