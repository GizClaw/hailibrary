audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    menelaus:
      display_name: 墨涅拉奥斯
      tts: {delivery: 坦诚而好客, timbre: 成熟浑厚, pace: 稳健, pitch: 中低音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    helen:
      display_name: 海伦
      tts: {delivery: 从容而善于思索, timbre: 温润清亮, pace: 舒缓, pitch: 中音}
    proteus:
      display_name: 普罗透斯
      tts: {delivery: 谨慎而通晓世事, timbre: 苍老粗厚, pace: 从容, pitch: 低音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: 深思而克制, timbre: 清晰温润, pace: 舒缓, pitch: 中音}
    vision_iphthime:
      display_name: 伊芙提墨的幻影
      tts: {delivery: 轻柔而笃定, timbre: 轻盈清楚, pace: 平缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 宴席上认出的客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            两人到墨涅拉奥斯家时，正赶上婚宴。女儿赫耳弥奥涅要嫁给阿喀琉斯的儿子，儿子墨伽彭忒斯则娶了斯巴达姑娘。仆人问，要接待门外的客人，还是让他们去别处？主人一听就生气了。
        - id: ch01-b02
          speaker: menelaus
          text: |
            我们在回家的路上，也靠别人收留过那么多次。快去给他们卸马，请他们进来吧。
        - id: ch01-b03
          speaker: narrator
          text: |
            忒勒马科斯洗好澡，换上衣服，吃过饭，看着满屋金银、象牙和铜器，小声说，这简直像宙斯的宫殿。主人听见了，说凡人哪比得上神。他走了近八年才回来，财宝不少，哥哥却在这时候遭人杀害。若能让战死的同伴活过来，他宁可只留下三分之一的财富。
            提起奥德修斯，主人停了好久。那人帮大家做了那么多事，偏偏没人知道他还活着没有。青年听得掉泪，用斗篷挡住脸。海伦过来坐下，看见了他。
        - id: ch01-b04
          speaker: helen
          text: |
            你看，他是不是奥德修斯的孩子？
        - id: ch01-b05
          speaker: narrator
          text: |
            庇西斯特拉托斯说明身份和来意。主人说，他原想让奥德修斯带家人和产业迁来阿耳戈斯，甚至愿攻破自己治下的一座城，给朋友安家。他们本可相伴到死，神却没答应。大家都哭了，庇西斯特拉托斯也想起从未见过的哥哥安提洛科斯。
            是他劝众人先吃饭，明天再悲伤。海伦把埃及的神奇药草放进酒里，喝的人一整天都不会流泪，就算看见父母死在眼前，或者孩子被砍碎也不会。接着，她讲起特洛伊的事。
            奥德修斯自己弄出满身伤，穿着破衣装乞丐进城，只有她认出来。她给他洗浴更衣，发誓在他逃走以前保密，他才说出希腊人的计划。他后来杀了许多特洛伊人，带着情报脱身。城里的女人哭了，海伦却高兴。她说自己想念家乡、女儿和丈夫，后悔阿佛洛狄忒把她带走。
            墨涅拉奥斯说，他们躲在木马里，准备毁灭特洛伊。海伦和得伊福波斯绕着马走，叫出人名，模仿妻子的声音。他和狄奥墨得斯想回答，甚至想跳出去，都被奥德修斯拦住。安提克洛斯一要开口，他就捂住那人的嘴，直到雅典娜带走海伦。
            忒勒马科斯说，父亲有这些本领，也没救得了自己。随后，他请求去睡。
    - id: ch02
      title: 不能松开的手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            次日，青年说出家里的困境，请主人连坏消息也别隐瞒。国王愤怒地说，那些人像进了狮穴的小鹿，奥德修斯回来就会杀死他们。他接着答应，把海神说过的话全讲出来。
        - id: ch02-b02
          speaker: menelaus
          text: |
            海神普罗透斯告诉过我，你父亲在哪里。我先说说，我怎么才问到了他。
        - id: ch02-b03
          speaker: narrator
          text: |
            墨涅拉奥斯被困在埃及外海的法罗斯岛，整整二十天没有合适的风。食物快没了，船员靠钓鱼找吃的。普罗透斯的女儿伊多忒娅发现他一个人在岸边，问他是不是打算一直饿下去。
        - id: ch02-b04
          speaker: menelaus
          text: |
            我哪里愿意留在这儿？可我找不到办法走啊。
        - id: ch02-b05
          speaker: narrator
          text: |
            伊多忒娅说，父亲知道缘故。他中午会到海豹中间来睡觉。墨涅拉奥斯得挑三个可靠的人，埋伏好，一见他睡下就抓住。海神一定会变形，但变成什么，都得抓牢。
            次晨，女神挖了四个坑，给四个人盖上海豹皮。气味实在难闻，她又拿来芳香的神食，放在他们鼻子下面。他们这才忍住。海豹游上岸，普罗透斯也出来了。他把他们一起点数，没发现是人，就睡下了。
            四个人扑过去抓他。他先变成狮子，又成了别的猛兽，后来是流水，再后来是树。他们一直没放手。海神终于变回老人，问他们想干什么。
            墨涅拉奥斯要他指条回家的路。海神说，得先回埃及，把没完成的祭礼补上。国王不愿走回头路，却还是答应，又问起别的统帅。
            埃阿斯逃过船难，却说神也淹不死自己。波塞冬就劈开他脚下的礁石，让他沉入海中。阿伽门农高兴得亲吻故土，可埃癸斯托斯花钱买通的人，已经盯了一年。凶手设宴，在旁边埋伏二十个人，骗来国王，像宰牛那样杀了他。两边的随从也在争斗中全死了。
            墨涅拉奥斯哭倒在沙滩上。普罗透斯劝他快回去。凶手也许还活着，就算俄瑞斯忒斯已经替父报仇，他也可能赶上葬礼。但海神又说，还有一个人活着，困在海上回不去。国王马上追问。
        - id: ch02-b06
          speaker: menelaus
          text: |
            那个人是谁？请告诉我。
        - id: ch02-b07
          speaker: proteus
          text: |
            是奥德修斯。卡吕普索留着他，不准他离开。他在岛上伤心，也没有船和船员送他回来。
        - id: ch02-b08
          speaker: narrator
          text: |
            青年这次有了神亲眼所见的证言。父亲确实活着，正被卡吕普索关在岛上哭泣。
            墨涅拉奥斯接着说，海神还预言，他会因娶了宙斯的女儿海伦，最终到厄吕西翁安享归宿。然后海神消失。他回埃及献祭，又替哥哥建了纪念的墓冢，后来才顺着风回家。
            主人请青年再住十天或十二天，要送马车、三匹马和酒杯。青年惦念着皮洛斯的船员，不肯久留。伊萨卡山路适合山羊，带马回去也不合适。
        - id: ch02-b09
          speaker: telemachus
          text: |
            我能换一样方便带回家的东西吗？
        - id: ch02-b10
          speaker: narrator
          text: |
            国王笑着答应给他一只镶金边的银碗。赫淮斯托斯造了它，西顿国王又把它送给墨涅拉奥斯。屋里又来了许多客人，大家开始忙下一顿饭。
    - id: ch03
      title: 船主的一句话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            与此同时，伊萨卡的诺厄蒙来找自己的船。他问安提诺奥斯，忒勒马科斯几时从皮洛斯回来，他还有别的事要用船。求婚人愣了。他们以为青年在乡下，没想到已经出了海。
            诺厄蒙说，船是他愿意借的，跟着去的青年也都很好，还有门托尔同行。不过，船走后他又在城中见到了门托尔，不知道这是什么缘故。
            等船主走开，安提诺奥斯把玩游戏的人都招来。他们小看了这个青年。他真找到了船，也找到了船员。
        - id: ch03-b02
          speaker: antinous
          text: |
            找一艘船，再召二十个人。等他回来，我们半路截住他。
        - id: ch03-b03
          speaker: narrator
          text: |
            大家同意在伊萨卡附近的海峡杀死青年。他们不知道，仆人墨冬在外面听见了。
            墨冬赶到楼上。佩涅洛佩以为求婚人又要她做宴席的事，正想责备，才听清报信。儿子离家了，还遭到这些人的算计。两件事一起来，她愣了半天才出声。
        - id: ch03-b04
          speaker: penelope
          text: |
            他为什么离开我？难道要死在外面，连个留下名字的人都没有？
        - id: ch03-b05
          speaker: narrator
          text: |
            墨冬说不清是谁的主意，随后下楼。佩涅洛佩倒在地上哭，怪女仆不报信。她若早知道，一定拦下儿子，否则宁可死在他面前。她想让园丁多利奥斯找拉厄尔忒斯，让老人求民众帮助。
            欧律克勒娅说，主人可以杀她，也可以让她活着，但先听实话。她知道出海的事，还准备了粮酒。青年让她起誓保密十天或十二天，除非母亲发觉来问，他不想让母亲哭坏容颜。她劝主人别再惊动老人，先洗脸、更衣，再求雅典娜。女神能从死亡边缘救回青年。
    - id: ch04
      title: 梦里的妹妹
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |
            佩涅洛佩撑起身，带着女仆上楼祈祷。她求雅典娜想想丈夫从前献的祭，救救他们的儿子。楼下的人却猜她正要准备嫁人。安提诺奥斯叫他们别再嚷，悄悄把事情办好。武器运到了船上，人手也都来了，只等入夜。
            母亲吃不下饭。儿子会到哪儿，遇见什么人，又会走哪段海路，她反复想着。想累了，终于睡去。雅典娜派了个梦影来，看上去就是她的妹妹伊芙提墨。
            梦影让她放心，儿子一定会回家。她还是害怕，孩子年轻，经历少，又有那么多人要害他。
        - id: ch04-b02
          speaker: vision_iphthime
          text: |
            他有雅典娜帮助。她就在他身旁，也是她派我来见你的。
        - id: ch04-b03
          speaker: penelope
          text: |
            那我的丈夫呢？奥德修斯是生是死，你知道吗？
        - id: ch04-b04
          speaker: narrator
          text: |
            梦影没有答复，随后就不见了。佩涅洛佩醒过来，多少放下了些心。可是儿子在斯巴达听到的好消息，她仍不知道。

            海上那艘求婚人的船，已经藏进阿斯忒里斯小岛的避风处。他们在那里等，等另一艘船从远处回来。
