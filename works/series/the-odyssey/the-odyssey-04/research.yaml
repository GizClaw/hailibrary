  - "Retained: double wedding and angry hospitality rebuke; recognition and tears; Menelaus's intended sacking of a subject city to house Odysseus; Egyptian drug's supernatural suppression of grief even at violent family deaths; Odysseus wounding himself for disguise, Helen's secrecy oath, killings and escape; her longing for husband/daughter and blame of Aphrodite; her contradictory horse impersonation with Deiphobus, restrained warriors and Anticlus's silencing; predicted death of suitors; Pharos hunger, Idothea, four seal skins, ambrosia and unrelenting hold through transformations; required Egypt sacrifices; Ajax's boast and drowning; paid lookout, twenty-man banquet trap and deaths of all followers on both sides; Menelaus's grief, Orestes possibility, living captive Odysseus and Elysium; memorial and gifts; Noemon's information, Mentor double appearance, twenty-man murder ambush; Medon's warning, mother's threat to prevent departure or die, nurse's exposure to being killed, oath and beauty rationale; prayer, dream protection, refusal of husband's news and Asteris."
  - "Compressed: wedding ancestries beyond names and marriages, luxury inventories, Menelaus's agricultural/travel catalogue, Proteus's individual animal forms, repeated meal/ritual directions, exact ship equipment, Noemon's mule-breeding business and Iphthime's marriage location. No new resolution of Helen's ambiguous conduct is supplied."
  - "Claim inventory: provenance is documentary. Drugs, divine transformations, ambrosia, prophecy and dream protection are declared myth, with no real plant or treatment claim. Menelaus reports Proteus's sighting; it is not his own eyewitness view of Odysseus. Penelope does not know the Sparta report. Terrain remarks serve the inherited gift choice, not measured geography. Threats and coercion remain attributed narrative conduct."
  - "Removed invented cup movements, Helen's silent response and the mistaken claim that this is the first assurance of survival after Athena's Book I statement. Scripts use their own final locale source. No media changes."
