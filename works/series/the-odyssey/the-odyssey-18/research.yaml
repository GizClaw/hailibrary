sources:
  - url: "https://www.gutenberg.org/ebooks/1727"
    authority: "Project Gutenberg catalogue, ebook 1727"
    claims:
      - "The consulted Odyssey is attributed to Homer, translated by Samuel Butler, and marked public domain in the USA."
  - url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
    authority: "Samuel Butler translation, Book XVIII; 1900 translation with the 1921 second-edition preface"
    claims:
      - "Irus threatens the disguised Odysseus. The suitors arrange the fight; servants force the frightened Irus to prepare. Odysseus considers a killing blow, limits it to conceal himself, still breaks bone, and drags Irus to the gate."
      - "Antinous threatens Irus with Echetus; the suitors repeat the threat after the fight. Odysseus warns Amphinomus to leave before bloodshed, but Athena has doomed him to die by Telemachus."
      - "Athena gives Penelope sleep and beauty. Penelope wishes for death; the suitors desire her as a bed companion; Telemachus wishes their necks broken."
      - "Penelope recalls Odysseus's instructions concerning his parents and her remarriage, obtains gifts without the encouragement her words appear to offer, and withdraws."
      - "Melantho, raised by Penelope and now Eurymachus's lover, mocks Odysseus; he threatens to have her torn apart. Eurymachus throws a stool that wounds the cupbearer; Amphinomus helps end the feast."
  - url: "https://atlas.perseus.tufts.edu/nodes/urn:cts:greekLit:tlg0012.tlg002.perseus-grc2:18.67/"
    authority: "Tufts Perseus / Scaife ATLAS, Odyssey 18.67, Greek text and Cunliffe/LSJ lexical material for μήδεα"
    claims:
      - "In the Echetus mutilation threat, μήδεα refers to male genitals, not intestines. This reading edition uses genitals / 生殖器 instead of Butler's entrails."
  - url: "https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901000730"
    authority: "Getty Research Institute"
    claims:
      - "The Odyssey is a twenty-four-book ancient Greek epic traditionally attributed to Homer."
notes:
  - "2026-10-11: task-scoped HaiLibrary reading retelling under the user's express instruction; classic and Homer / 荷马 attribution remain. Neither locale is represented as Butler's unchanged prose or as an unabridged translation."
  - "Complete Book XVIII was compared with git commit 1208d108's Butler source. The coordinating author separately checked the Greek line and its Cunliffe/LSJ definitions; the genital-mutilation correction is applied to both articles and both scripts."
  - "Condensed boundaries: Irus's alternate birth name and errand-name explanation, extended reflections on human fortune, named attendants, gift-giver and jewelry catalogues, and repeated insults. Forced participation, injuries, threatened mutilation, sex, death wishes, and divine doom are retained."
  - "Claim classification: the events are supported literary plot; Athena's transformations and doom are declared myth. Penelope's suicide wish is her despair within the story, not advice. Statements about courting custom are this household's claims, not universal cultural rules."
  - "Knowledge continuity: Penelope and the two herdsmen still do not recognize the guest. Amphinomus receives warning but returns to his seat. Irus survives this narrated fight; the threats concerning Echetus are not reported as already carried out."
  - "No dedication, preface, footnote, translator note, modern published retelling, or screen adaptation supplies the new prose. Media bytes are unchanged."
