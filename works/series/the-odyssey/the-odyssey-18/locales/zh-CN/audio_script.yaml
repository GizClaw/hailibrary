audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    irus:
      display_name: 伊罗斯
      tts: {delivery: "逞强好斗", timbre: "粗重", pace: "急促张扬", pitch: "低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "审慎而有主见", timbre: "成熟清楚", pace: "从容", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮有力", pace: "平稳", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "傲慢而咄咄逼人", timbre: "粗厚", pace: "有力", pitch: "中低音"}
    melantho:
      display_name: 墨兰托
      tts: {delivery: "轻蔑而锋利", timbre: "明亮", pace: "较快", pitch: "中高音"}
  chapters:
    - id: ch01
      title: "非打不可"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "奥德修斯还坐在门边，等着见妻子，伊罗斯就来了。他在城里替人跑腿，也常来宫里讨饭，个子很大。这回见了陌生老人，便要把人赶走。"
        - id: ch01-b02
          speaker: irus
          text: "快走！他们都示意让我撵你了。你不起来，我可就动手。"
        - id: ch01-b03
          speaker: odysseus
          text: >-
            门口够咱们两个坐。我又没拿你的东西。你再逼我，别看我上了年纪，一样能打得你嘴边、胸前全是血。
        - id: ch01-b04
          speaker: narrator
          text: >-
            伊罗斯更生气了，嚷着要打掉他的牙。安提诺奥斯笑着叫人来看，说谁赢谁先挑火边的肉，以后还能来吃饭，别的乞丐都不准进。奥德修斯装出没把握的样子，说自己老了，身体又弱，打不过年轻人，可肚子饿，只好试一试。他要大家先发誓，不会趁着他们交手暗算自己。众人答应了，忒勒马科斯也说，自己是主人，一定护着客人。

            他把破衣扎到腰上，露出粗壮的腿和宽阔的胸肩。雅典娜又给他添了力气。看的人纷纷说，伊罗斯怕是要输。伊罗斯浑身发抖，仆人却硬给他束紧衣服，推到前面。安提诺奥斯又吓唬他。
        - id: ch01-b05
          speaker: antinous
          text: >-
            你要是打输了，我就把你送到厄刻托斯王那里。到时你的鼻子、耳朵和生殖器都得割掉，生殖器还要拿去喂狗。
        - id: ch01-b06
          speaker: narrator
          text: |-
            奥德修斯想过一拳杀死他，又怕露出真本领，让人怀疑，就决定收着些力气。伊罗斯先打中他的右肩。他回了一拳，打在伊罗斯耳朵下面，骨头裂开，血从嘴里涌出来。伊罗斯倒在尘土里，呻吟着，两腿乱蹬，怎么也爬不起来。求婚人笑得厉害。奥德修斯抓住他的脚，拖到外门，让他靠墙坐好，再塞上手杖，叫他看住狗和猪。要是还想在乞丐中横行霸道，下回可就更惨。

            他背着破袋回来，众人夸他，还说要送伊罗斯去厄刻托斯。安提诺奥斯给了许下的肉。安菲诺摩斯送来两块面包，一杯酒，祝老人往后好过些。奥德修斯却给他警告。他也曾有钱、有力气，仗着这些做过错事，后来才懂得，日子说变就变。那些人正花主人的钱，欺辱主人的妻子，而主人快回来了。
        - id: ch01-b07
          speaker: odysseus
          text: "但愿你先平安回家，别在这里撞上他。这事一定要流血，不会就这样散了。"
        - id: ch01-b08
          speaker: narrator
          text: >-
            他先洒一点酒祭神，自己喝过，再把杯子交还。安菲诺摩斯低着头，听得很不安，可最终仍坐回求婚人中间。雅典娜已经决定，让忒勒马科斯杀死他。
    - id: ch02
      title: "王后的礼物"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            楼上的佩涅洛佩想去见求婚人，是雅典娜让她起了这个念头。她告诉管事欧律诺墨，要提醒儿子别轻信那些人的好话。管事让她先洗去脸上的泪痕，她却没有打扮的心思，只叫两名侍女来陪。等她们时，雅典娜让她睡着，又使她恢复美貌，看着更庄重。侍女的说话声把她叫醒，她摸着脸，竟希望阿耳忒弥斯也让自己这样安静地死去，别再为丈夫难过。

            她起身遮着面纱，由两人陪着到厅中。男人们巴不得跟她同床，她却问儿子。
        - id: ch02-b02
          speaker: penelope
          text: "你不小了，怎么眼看客人受这种欺负？真打成重伤，可怎么办？"
        - id: ch02-b03
          speaker: narrator
          text: >-
            儿子承认，母亲有理由责怪他。他知道什么对、什么不对，可这些人天天逼他，身旁又没有帮手。至少，这场比试没随他们的心愿，老人赢了。他盼宙斯、雅典娜和阿波罗折断每个求婚人的脖子，让他们也像伊罗斯那样瘫倒。

            欧律马科斯夸王后长得美，又聪明，见她的人多了，明天来求婚的也会多。王后却说起丈夫。他当年握着她的手，告诉她，特洛伊人很能打，自己不一定能活着回来。她得照顾他的父母，等儿子长大，就可以另找丈夫，离开这里。如今孩子大了，她不想要的婚事也越来越近了。
        - id: ch02-b04
          speaker: penelope
          text: >-
            可谁求婚是你们这做法？该带牛羊来招待女方家人，该送礼。整天在别人家花用，怎么说得过去？
        - id: ch02-b05
          speaker: narrator
          text: >-
            门边的丈夫很高兴。她说了他们爱听的话，收到了礼物，却没真给他们以为的保证。安提诺奥斯说，礼物可以收，但她不选丈夫，他们就不走。仆人带来绣袍、金链、琥珀和耳环，一件衣服用十二枚金别针扣着。王后带着侍女上楼，礼物也搬了上去。
    - id: ch03
      title: "谁来守灯"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            天色黑了，歌舞没停。三个火盆里烧着干柴，女仆轮换举火把。奥德修斯要接手，让她们去陪王后，或者纺毛，男人留到天亮他也不怕熬夜。

            墨兰托先笑他。这女仆幼时受过王后抚养，还拿过她送的玩具，如今却不顾她伤心，和欧律马科斯做了情人。
        - id: ch03-b02
          speaker: melantho
          text: >-
            不过打赢一个伊罗斯，就敢这样胡说？还不去别处睡。碰上更强的，有你受的。
        - id: ch03-b03
          speaker: narrator
          text: "奥德修斯脸沉了。"
        - id: ch03-b04
          speaker: odysseus
          text: "我会把这些话告诉忒勒马科斯。到时他会让人把你撕碎。"
        - id: ch03-b05
          speaker: narrator
          text: "女仆们怕他告发，退回屋里。他举着火把留在火盆边，看着那些人在自家墙上的影子。"
    - id: ch04
      title: "又一只凳子"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            雅典娜还要他更愤怒，不肯让这些人安分。欧律马科斯笑老人秃顶，屋里怕是靠脑袋照明，不靠火把。又装着请他去乡下垒墙栽树，管吃管穿，说惯了讨饭的人，多半不肯工作。奥德修斯说，两人各拿一把镰刀，从早割草到晚，看谁先累。再给他们同样好的牛，看谁犁的沟直。要是打仗，给他武器，他也能站在最前面。
        - id: ch04-b02
          speaker: odysseus
          text: "你也就在这群人当中，才觉得自己了不起。等奥德修斯回来，你逃的时候，连那么宽的门都会嫌窄。"
        - id: ch04-b03
          speaker: narrator
          text: >-
            欧律马科斯怒气上来，抓起凳子扔。奥德修斯躲到安菲诺摩斯的膝旁，凳子砸中斟酒人的右手。那人喊着向后倒去，酒壶落地，响了一声。众人吵起来，反倒怪乞丐害他们没法痛快吃喝。忒勒马科斯站出来，让众人回家。
        - id: ch04-b04
          speaker: telemachus
          text: "你们也该吃饱喝足了。回去睡觉吧，别再在这里吵闹。"
        - id: ch04-b05
          speaker: narrator
          text: |-
            求婚人咬着嘴唇，惊讶他敢这样开口。安菲诺摩斯却支持他，劝大家别再伤害客人和仆人，献完酒便散。

            最后一杯喝完，各人终于回去。
        - id: ch04-b06
          speaker: narrator
          text: "厅里终于安静了，火把还在亮着。"
