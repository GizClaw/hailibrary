audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    irus:
      display_name: 伊罗斯
      tts: {delivery: "逞强好斗", timbre: "粗重", pace: "急促张扬", pitch: "低音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "颐指气使而轻蔑", timbre: "浑厚带锋芒", pace: "果断", pitch: "中低音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接", timbre: "清亮年轻", pace: "平稳", pitch: "中音"}
    suitor_other:
      display_name: 一名求婚人
      tts: {delivery: "直率活跃", timbre: "明亮", pace: "轻快", pitch: "中音"}
    suitor_greeting_1:
      display_name: 第一名求婚人
      tts: {delivery: "热烈张扬", timbre: "浑厚", pace: "轻快", pitch: "中低音"}
    suitor_greeting_2:
      display_name: 第二名求婚人
      tts: {delivery: "热烈张扬", timbre: "清晰", pace: "轻快", pitch: "中音"}
    suitor_greeting_3:
      display_name: 第三名求婚人
      tts: {delivery: "热烈张扬", timbre: "明亮", pace: "轻快", pitch: "中高音"}
    amphinomus:
      display_name: 安菲诺摩斯
      tts: {delivery: "礼貌周全", timbre: "圆润清楚", pace: "沉稳", pitch: "中低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "深思而克制", timbre: "清晰柔韧", pace: "舒缓", pitch: "中音"}
    eurynome:
      display_name: 欧律诺墨
      tts: {delivery: "坦率体贴", timbre: "成熟温暖", pace: "舒缓", pitch: "中低音"}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: "圆滑自信", timbre: "悦耳而有共鸣", pace: "平稳", pitch: "中低音"}
    melantho:
      display_name: 墨兰托
      tts: {delivery: "尖锐轻慢", timbre: "清亮锋利", pace: "利落", pitch: "中高音"}
    suitor_complaining:
      display_name: 抱怨的求婚人
      tts: {delivery: "直率不满", timbre: "粗粝清楚", pace: "平稳", pitch: "中音"}
  chapters:
    - id: ch01
      title: "门口的拳斗"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            又一个流浪汉来了。他平常在伊萨卡满城讨饭，出了名地能吃、爱喝酒，怎么也改不了。他看着块头大，却没什么力气，也吃不住累。母亲给他起名阿尔奈奥斯，可年轻人都叫他伊罗斯，因为叫他替谁跑腿，他都去。他一来就朝奥德修斯骂，要把这家的主人从自己家里赶走。
        - id: ch01-b02
          speaker: irus
          text: >-
            老头，从门口让开！不走，我揪住脖子，提起脚把你拖出去。你看看，他们都在给我递眼色，要我动手。我是不愿意才没干。自己起来走吧，要不咱们就打！
        - id: ch01-b03
          speaker: narrator
          text: >-
            奥德修斯皱着眉看他。
        - id: ch01-b04
          speaker: odysseus
          text: >-
            朋友，我哪里惹着你了？别人给你多少，我从来没嫉妒过。门口这么大，我们两个都坐得下。人家又没让你出东西，你心疼什么？你不也跟我一样讨饭吗？兴许神哪天会让我们都转运。可是动不动就说打，我听了会发火。我虽老，也能打得你嘴上、胸口流满血。那样明天倒省心，你不会再来奥德修斯家吵我了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            伊罗斯气得回骂起来。
        - id: ch01-b06
          speaker: irus
          emotion: angry
          text: >-
            又脏又馋的东西，嘴倒能说，像个卖鱼的老婆子一样！我真该两手一起打，把你的牙一颗颗敲掉，像敲断野猪的獠牙。来吧，叫这些人都看着。你老了这么多，打得过我？
        - id: ch01-b07
          speaker: narrator
          text: >-
            两人在门前光平的石板上互相骂着。安提诺奥斯瞧见，哈哈大笑，叫其他人来看。
        - id: ch01-b08
          speaker: antinous
          text: >-
            这种乐子，你们可没看过！神送到这家来的好戏，这回算头一遭。伊罗斯跟外乡人翻脸了，眼看要打架。快，让他们这就打！
        - id: ch01-b09
          speaker: narrator
          text: >-
            求婚人笑着把两个破衣烂衫的乞丐围住。安提诺奥斯接着定下赏品。
        - id: ch01-b10
          speaker: antinous
          text: >-
            都听着，火旁那些山羊肚，灌了血和肥油，本来留给晚饭。你们谁赢，谁本事高，就让他挑一个。今后我们开饭，他随时能吃，其他乞丐一个也不许来。
        - id: ch01-b11
          speaker: narrator
          text: >-
            大家都答应。奥德修斯要让他们猜不出身份，故意说自己不行。
        - id: ch01-b12
          speaker: odysseus
          text: >-
            各位，我老了，还受了这么多罪，哪里比得上年轻人。可肚子硬逼着我，明知道是挨揍，也得去。不过先请诸位发个誓，别有人偏帮伊罗斯，趁机偷打我，让他得胜。
        - id: ch01-b13
          speaker: narrator
          text: >-
            众人发过誓，忒勒马科斯也发了话。
        - id: ch01-b14
          speaker: telemachus
          text: >-
            外乡人，你愿意比，就去跟他比。这里谁都不用怕。谁敢打你，就得对付不止一个人。我是这家的主人，安提诺奥斯、欧律马科斯这两位首领也都是通情理的，意见和我相同。
        - id: ch01-b15
          speaker: narrator
          text: >-
            大家认可这句话。奥德修斯把旧衣服束在腰上，露出有力的胳膊、宽宽的肩膀和胸膛，还有健壮的两条大腿。雅典娜来到他身边，让这些筋骨更有力量。求婚人看得惊呆了，有人转过头对邻座说。
        - id: ch01-b16
          speaker: suitor_other
          text: >-
            好大的腿！外乡人把这么一身力气藏在破衣裳里，伊罗斯马上就要给打散了！
        - id: ch01-b17
          speaker: narrator
          text: >-
            伊罗斯一听，心里更没底了。仆人强替他束好衣服，往院子露天的地方带，他的胳膊腿都吓得直抖。安提诺奥斯骂他。
        - id: ch01-b18
          speaker: antinous
          text: >-
            只会欺负人的家伙！这么个衰老、落魄的乞丐你都怕，生下来干什么？我说到做到，他要胜过你，我就用船把你送到大陆，给厄刻托斯王。那王谁靠近都杀。他会先割鼻子耳朵，再掏出你的肠子喂狗！
        - id: ch01-b19
          speaker: narrator
          text: >-
            这下伊罗斯更害怕了，可人已经被推到院中央。两人举起拳头。奥德修斯考虑，是一下把他打死，还是打轻点，只打倒就好。他怕打得太狠，阿开亚人会猜出自己的身份，便决定少用些力。
            两人开打，伊罗斯一拳中了右肩。奥德修斯还手，打在他耳朵下的脖子上，头骨都裂了，嘴里直冒血。他跌进尘土，咬着牙呻吟，双脚乱踢。求婚人举着手，笑得快喘不过气。奥德修斯抓住他一只脚，拖到外院的门房，把他安在墙边靠好，手里放上棍子。
        - id: ch01-b20
          speaker: odysseus
          text: >-
            在这儿坐着，看住狗和猪，别让它们过来。你够可怜的了。再敢称王称霸，管起别的乞丐来，我让你比现在还惨。
    - id: ch02
      title: "一杯酒的劝告"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            奥德修斯把那又脏又破的旧褡裢用绳挂回肩头，仍到门槛上坐下。求婚人进回廊，一边笑，一边向他祝贺。
        - id: ch02-b02
          speakers: [suitor_greeting_1, suitor_greeting_2, suitor_greeting_3]
          ensemble: chorus
          text: >-
            愿宙斯和诸神满足你的愿望！那个吃不饱、缠个没完的家伙，总算让你收拾了。我们马上把他送上大陆，给那个谁靠近就杀谁的厄刻托斯王！
        - id: ch02-b03
          speaker: narrator
          text: >-
            这些话，奥德修斯听来正是吉兆。安提诺奥斯送来一个很大的山羊肚，里面灌满血和油。安菲诺摩斯从篮里拿来两块面包，又端着盛酒的金杯向他祝愿。
        - id: ch02-b04
          speaker: amphinomus
          text: >-
            老客人，祝你交好运。眼前虽然这么难，但愿往后，你的日子会好起来。
        - id: ch02-b05
          speaker: odysseus
          text: >-
            安菲诺摩斯，我看你是个有见识的人。你有那样的父亲，当然不会差。我听别人夸过他，杜利基翁的尼索斯，又勇敢又有钱。据说你是他儿子，你自己看来也很出众。所以我这番话，请你好好听。在世上所有的生灵里面，人最会把自己看得了不起。身体好，有力气，得着上天保佑，他就觉得灾祸永远不会来。可幸福的诸神要是让他受苦，他也只好承受，想办法过日子。人每天的心境，都由万能的神每天来安排。我懂这些，因为我以前富过。我那时又倔又骄傲，觉得有父兄在后面支持，就干下许多坏事。因此，不管做什么，都该敬畏诸神。上天给好处，安心领受，别自以为了不起。你看看这些求婚人，多么可耻！糟蹋别人的财产，侮辱他的妻子，可那人一定会回家，过不了多久。真快回来了。盼上天先让你平安回去，别在他进门那天遇上。等他到了，跟求婚人之间，不流血是了结不了的。
        - id: ch02-b06
          speaker: narrator
          text: >-
            奥德修斯把酒奠给诸神，自己也喝了，然后把金杯放回安菲诺摩斯手里。安菲诺摩斯低着头，神情严肃地离开。他已觉出不祥，可还是没能逃过死，因为雅典娜已经定下，要让他死在忒勒马科斯手中。他重新回到原处坐好。
    - id: ch03
      title: "佩涅洛佩的礼物"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            雅典娜让佩涅洛佩忽然想去见那些求婚人。她要让他们更爱慕王后，也让丈夫和儿子更加尊敬她。佩涅洛佩装出嘲讽的笑容，叫了欧律诺墨。
        - id: ch03-b02
          speaker: penelope
          text: >-
            我现在又想去看看求婚人了，虽然真讨厌他们。我还想劝儿子，不要再跟他们来往。嘴上那么客气，心里却没有好意。
        - id: ch03-b03
          speaker: eurynome
          text: >-
            孩子，你这话一点不错。去告诉儿子吧。不过先沐浴，脸上擦点油。总挂着眼泪可不行，也不能永远这么哀伤。你从前不是天天求，盼活到儿子长胡须吗？忒勒马科斯现在已经长大成人了。
        - id: ch03-b04
          speaker: penelope
          text: >-
            欧律诺墨，你对我好，我知道。可别再劝我洗脸打扮，丈夫一出海，我的美貌就让神夺去了。你倒去叫奥托诺厄、希波达弥娅来。我到廊下，需要她们陪着。独自走到男人中间不合规矩，我可不能去。
        - id: ch03-b05
          speaker: narrator
          text: >-
            老妇出去传话，让两名女仆来见女主人。雅典娜另有主意，先让佩涅洛佩躺在榻上，甜甜睡去，手脚都沉了。趁她睡着，女神给她添上美丽和优雅，好叫阿开亚人个个惊叹。她的脸被洗得容光照人，那美丽就像阿佛洛狄忒和美惠女神跳舞时一样。身子也长高了，显得更庄严，皮肤比新锯开的象牙还白。雅典娜做完，便离开。女仆从女眷的房里过来，谈话声把佩涅洛佩叫醒。她用手摸过脸。
        - id: ch03-b06
          speaker: penelope
          text: >-
            身上这么多苦，竟还能睡得如此舒服。要是阿耳忒弥斯现在就让我这样轻轻地死了，该多好。丈夫不在，我就不必一天天绝望，一天天耗下去了。我亲爱的丈夫没有哪样不好，他是阿开亚人里最出色的。
        - id: ch03-b07
          speaker: narrator
          text: >-
            她带着两名侍女走下楼，来到求婚人面前。她站在撑着回廊屋顶的柱边，面纱挡着脸，一边一名端庄的女仆。求婚人看得出神，迷恋得不得了，各自祈求，愿自己能娶到她，同她睡在一张床上。她却向儿子问话。
        - id: ch03-b08
          speaker: penelope
          text: >-
            忒勒马科斯，你怎么长大了，反不如小时候懂事？以前你知道分寸，现在做的却不像样。看你的个子和相貌，外人倒会当你是个殷实人家的孩子。刚才那场乱子怎么闹的？让一个客人遭这种欺凌，你怎么能不管？人家投到我们门下求保护，真给打伤了，你还怎么见人？
        - id: ch03-b09
          speaker: telemachus
          text: >-
            母亲，你不满意，我能理解。小时候不懂的，现在我已经明白，什么对、什么错，我也分得清。可是想每回都做周全，太难。这些坏人一个接一个来逼我，逼得我乱了心神，又没有人帮我。不过，伊罗斯这场架，求婚人可没看成想看的好戏，是外乡人赢了。我愿宙斯父神、雅典娜、阿波罗，把这群求婚人的脖子全拧断，不论屋内屋外。让他们都像外院门边的伊罗斯，一点劲都没有。看他的头晃得像醉汉，挨打挨得站不起来。不管家在哪儿，他都回不去，力气已经耗光。
        - id: ch03-b10
          speaker: narrator
          text: >-
            母子谈话的时候，欧律马科斯走了过来。
        - id: ch03-b11
          speaker: eurymachus
          text: >-
            佩涅洛佩王后，伊卡里奥斯的女儿，要是伊阿索斯的阿尔戈斯那些阿开亚人，全看见你今天的样子，明早还会有更多人来求婚。世间女子，无论聪明才干还是美貌，都没法跟你比。
        - id: ch03-b12
          speaker: penelope
          text: >-
            欧律马科斯，阿尔戈斯人带着我丈夫出发去特洛伊那天，上天就拿走了我的好容貌、好身段。如果他回来料理家里，我也会有更好的仪态，更受人敬重。可现在只是忧愁压着我，上天把一场又一场苦难放在我身上。丈夫走前就知道，握着我的右手腕，这样嘱咐。
        - id: ch03-b13
          speaker: odysseus
          text: >-
            妻子啊，我们去特洛伊，不会每个人都平安回来。特洛伊人用弓、用矛都厉害，驾战车打仗也强。战场上要分胜负，战车是最快的。我不知道诸神会让我回家，还是让我死在那里。我不在，你要管好家，像平时一样照顾我的父母，而且得比平时更用心。等儿子有了胡须，你就挑喜欢的人再嫁，离开眼下这个家。
        - id: ch03-b14
          speaker: penelope
          text: >-
            当时他就是这样讲的，如今一件件都来了。总有个晚上，我得接受那桩让我憎恨的婚事。宙斯连幸福的希望也不给我留。此外还有一点，让我伤透了心。诸位，你们求婚的做法，不是我们故乡的规矩。看上一位高贵的女子，认为她能做个好妻子，男人们争着求娶时，该拿牛羊来宴请她的亲友，该给她送上厚礼。哪能这样吃别人的家产，却一点也不付出？
        - id: ch03-b15
          speaker: narrator
          text: >-
            奥德修斯听了高兴。他知道妻子并不是真心奉承，讲这些好听话，是要从求婚人手里要礼物。安提诺奥斯回答她。
        - id: ch03-b16
          speaker: antinous
          text: >-
            伊卡里奥斯的女儿，佩涅洛佩王后，只要有人肯给，你想收多少都收下，礼物不该推辞。但我们不会各回各处做自己的事。你不选出最好的一个嫁给他，我们就半步也不走。
        - id: ch03-b17
          speaker: narrator
          text: >-
            众人拍手赞同，分别让仆人取礼来。安提诺奥斯给的是件宽大的美丽衣裙，上面刺绣细致，用十二个精巧的纯金胸针扣住。欧律马科斯很快拿来金珠和琥珀串的链子，亮得像阳光。欧律达马斯让两个仆人送来耳环，三枚坠子光闪闪的。波吕克托尔的儿子庇珊德罗斯王拿来做工罕见的项链。其余的人，也个个奉上了漂亮的礼物。
    - id: ch04
      title: "火光下的争执"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            王后回楼上，女仆拿着礼物随后跟去。求婚人继续唱歌跳舞，从傍晚一直闹到天黑。于是他们抬来三个火盆，填进劈好的柴。木头放得久，干透了，用来点上火把，让女仆轮着举起照亮。奥德修斯叫住这些女人。
        - id: ch04-b02
          speaker: odysseus
          text: >-
            你们的主人奥德修斯离家这么久了，去内屋陪王后吧。给她说说话解愁，或者纺线、理羊毛。这里我来照明。这群人待到天亮也成，我能熬，他们熬不倒我。
        - id: ch04-b03
          speaker: narrator
          text: >-
            女人们互相看看，笑了。漂亮的墨兰托尤其瞧不起他，开口嘲弄。她是多利奥斯的女儿，从小由佩涅洛佩抚养照料，还拿玩具给她玩。可她毫不关心女主人的痛苦，爱上欧律马科斯，还和他私通。
        - id: ch04-b04
          speaker: melantho
          text: >-
            你这穷鬼，是不是疯透了？找家铁匠铺，找个闲人说话的地方睡去，在这里嚼什么舌头？面前这么多比你尊贵的人，你插嘴也不害臊！喝酒喝昏了？还是原本就这样乱说？不过打倒个伊罗斯，就不知道自己是谁了。小心来个更有本事的，抡起棍子敲你脑袋，打得你满身是血，从这里出去！
        - id: ch04-b05
          speaker: narrator
          text: >-
            奥德修斯瞪住她。
        - id: ch04-b06
          speaker: odysseus
          text: >-
            恶女人，这些话我会转告忒勒马科斯。他会把你的手脚扯断，让你四肢分家！
        - id: ch04-b07
          speaker: narrator
          text: >-
            女仆们吓得发抖，往内屋去了。她们当真以为他要去告。奥德修斯守着火盆，手里举着火把，眼睛看着人群，想着那些肯定要发生的事。
            雅典娜却要把求婚人的无礼不断挑起来，让奥德修斯恨他们更深。她促使波吕波斯的儿子欧律马科斯开他的玩笑，逗得其他人笑。
        - id: ch04-b08
          speaker: eurymachus
          text: >-
            来向佩涅洛佩王后求婚的诸位，我有句话要说。这个人到奥德修斯家，还真有用。我看亮光根本不是从火把来的，是他那颗头在放光。头发都没了，一根不留！
        - id: ch04-b09
          speaker: narrator
          text: >-
            欧律马科斯再转过头，直接问奥德修斯。
        - id: ch04-b10
          speaker: eurymachus
          text: >-
            外乡人，愿不愿到我的乡间去干活？报酬我给足。你能不能修石头围墙，能不能种树？饭我包一年四季，还管你衣服鞋子。你去吗？当然不肯，你这人养懒了，根本不想做工。你宁愿四乡讨吃的，往自己肚子里填。
        - id: ch04-b11
          speaker: odysseus
          text: >-
            欧律马科斯，我倒想跟你比一比。挑初夏，白天最长的时候，我拿好镰刀，你也拿一把，牧草长到该割时，从早上割到晚上，看谁坚持得久，谁割得好。或者我们比犁田，各自牵一对黄褐色的壮牛，配得齐，耐得住累。给我四英亩地，看谁的犁沟更直。又或者今天就打仗，给我盾，两支矛，一顶贴着太阳穴的头盔。你会看见我打在最前面，哪还有心思笑我的肚子！你这么凶狠又自大，只不过身边圈子小，人又坏，就显得自己是人物了。奥德修斯一旦回家掌权，这些宽宽的大门，到你往外逃时，可就嫌窄了。
        - id: ch04-b12
          speaker: narrator
          text: >-
            欧律马科斯听得暴怒，瞪着他叫起来。
        - id: ch04-b13
          speaker: eurymachus
          emotion: angry
          text: >-
            混蛋，竟敢当着大家这样顶撞我，我这就收拾你！你是醉了，还是总这么疯言疯语？打赢个伊罗斯，就把脑子也丢了！
        - id: ch04-b14
          speaker: narrator
          text: >-
            他捞起脚凳。奥德修斯怕挨打，靠到杜利基翁人安菲诺摩斯的膝边寻求保护。凳子打上斟酒人的右手，把他打得叫了一声，仰面栽下去。酒壶也掉到地上，发出一声响。回廊有屋顶的那片地方，求婚人乱纷纷吵起来，扭头向旁边的人抱怨。
        - id: ch04-b15
          speaker: suitor_complaining
          text: >-
            这人上哪儿不好，偏来这里，真该倒霉！添这么多乱子。一个乞丐，也弄得大家不得安宁。再这么胡闹，宴席还有什么可乐的？
        - id: ch04-b16
          speaker: narrator
          text: >-
            忒勒马科斯走到众人面前。
        - id: ch04-b17
          speaker: telemachus
          text: >-
            各位是中了恶神的邪，疯了吗？吃喝以后就不能守点规矩？我没想赶你们任何人走。只是晚饭已吃过，还是越早回去睡觉越好。
        - id: ch04-b18
          speaker: narrator
          text: >-
            求婚人咬住嘴唇，没想到他这么敢说。安菲诺摩斯出面相劝，他的父亲是尼索斯，祖父是阿瑞提阿斯。
        - id: ch04-b19
          speaker: amphinomus
          text: >-
            别动气，他的话有道理，我们别争辩了。外乡人也好，奥德修斯家的仆人也好，谁都别再伤害。叫斟酒人把酒送来，一人一份，我们敬过神就回家歇息。客人交给忒勒马科斯照管，他投奔的是这个家。
        - id: ch04-b20
          speaker: narrator
          text: >-
            大家听着满意。安菲诺摩斯的仆人穆利奥斯也来自杜利基翁，他在碗里把酒和水调好，一个人接一个人地送过去。众人向幸福的神灵奠酒，随后各自喝到尽兴，便分头走出门，回到自己的住处。
