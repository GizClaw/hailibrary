audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "用平实语言从容讲述史诗", timbre: "温暖清晰", pace: "舒缓有节奏", pitch: "中音"}
    odysseus:
      display_name: 奥德修斯
      tts: {delivery: "沉着机敏", timbre: "带有风霜感", pace: "从容", pitch: "中低音"}
    irus:
      display_name: 伊罗斯
      tts: {delivery: "逞强好斗", timbre: "粗重", pace: "急促张扬", pitch: "低音"}
  chapters:
    - id: ch01
      title: "门口容得下两个人"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            伊罗斯来了。他常在城里替人跑腿，在宫里讨吃的，身材高大。这时门槛上已有了一个老人，他便以为人家抢了自己的位置，要把人赶开。
        - id: ch01-b02
          speaker: irus
          text: >-
            走开吧！他们正叫我赶你呢。再坐着，我就不客气了。
        - id: ch01-b03
          speaker: narrator
          text: |-
            奥德修斯说，地方够大，能坐两个人，自己没拿他的东西，犯不着吵。可是，再威胁下去，他照样能打得伊罗斯嘴边、胸前全是血。伊罗斯越说越凶，还扬言要打掉他的牙。安提诺奥斯笑着招呼大家过来，看两个乞丐打架。赢的人可以先挑火上烤的肉，以后继续来吃饭，其他乞丐就别来了。奥德修斯装作没把握，说年纪大了，又虚弱，哪里敌得过年轻人，可肚子饿，只能试一试。他先让他们发誓，不许趁交手时暗算自己，帮伊罗斯。众人答应，忒勒马科斯也说，自己是主人，会保护客人。

            老人把衣服扎紧，露出了结实的双腿和宽大的肩胸，雅典娜还给他增加力量。围观者开始说，伊罗斯这回要输了。他吓得发抖，仆人还是硬给他扎好衣服，把他推过去。安提诺奥斯说，输了，就把他装船送给厄刻托斯王，那人会割掉他的耳朵、鼻子和生殖器，再把生殖器给狗吃。奥德修斯想过一拳打死他，又怕让人认出来，决定少用些力。伊罗斯打中他的右肩，他回了一拳，打在耳朵下面，骨头都裂了。伊罗斯嘴里涌着血，倒地呻吟，两腿乱蹬，再也站不起来。众人笑个不停。奥德修斯抓住他的脚，拖到外门，让他靠墙坐着，塞给他一根杖，叫他看住狗和猪，再想欺负别的乞丐，下次只会更惨。
    - id: ch02
      title: "一杯酒和一句警告"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            奥德修斯背着破袋回来坐下，求婚人夸着他，还说要送伊罗斯去见厄刻托斯。安提诺奥斯兑现了肉食，安菲诺摩斯还带来两块面包、一杯酒，祝他以后好过一点。老人看着这个好言相待的人，给了他一个警告。他说自己也曾有钱、有力气，仗着这些做过错事，没想到日子能变得那么快。求婚人正在花别人的钱，侮辱别人的妻子，而那家的主人快要回来了。
        - id: ch02-b02
          speaker: odysseus
          text: >-
            希望他到的时候，你已经平安回家。千万别留在这里与他相见，那是会流血的。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他先洒酒敬神，再饮一口，把杯子交回去。安菲诺摩斯低头想了想，觉得不安，却仍坐回了原处。他也逃不过。雅典娜已决定让忒勒马科斯杀死他。
    - id: ch03
      title: "王后下楼"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            雅典娜让佩涅洛佩动了念头，要去见见求婚人。她对欧律诺墨说，儿子得提防那些表面亲热、暗里害他的人。女管事劝她洗脸，把泪痕擦去再出去。王后不想梳妆，只要两位侍女陪着。自从丈夫出海，她就没了享乐的心思。

            趁欧律诺墨去找人，雅典娜让王后甜甜睡了一觉，使她重新容光焕发，也更有威仪。侍女们说话，把她唤醒了。她摸着脸，希望阿耳忒弥斯让自己就这么安安静静死去，再也不用为丈夫难过。她还是起来了，面前举着纱，由两人陪着来到柱边。男人都盼着她到自己的床上去。她却先责问儿子，长大的人，怎能任由客人受辱？如果客人重伤，又该怎么办？

            忒勒马科斯说，母亲生气有道理。他知道是非，只是天天被这些人逼迫，又没人帮他。这回他们也没有如愿，老人把伊罗斯打败了。他盼宙斯、雅典娜和阿波罗把求婚人的脖子全折断，让他们也像伊罗斯那样瘫着。欧律马科斯忙夸王后美丽聪明，说若更多人见到她，来求婚的还会更多。她回答时，想的是丈夫。奥德修斯动身前握着她的手，说并非人人都能活着离开特洛伊。她得照料他的双亲，等孩子成人，可以另选丈夫，离开家门。

            儿子已经长大，她不愿过的婚姻生活似乎也近了。然而求婚的人理当带牲口来款待女方家人，还要送礼，怎么能整天吃人家的东西？奥德修斯在门边听得高兴。王后顺着他们的心意说话，换来礼物，却没真作他们盼望的承诺。安提诺奥斯说，她尽管收，选好丈夫以前他们却不会离开。仆人纷纷取来绣袍、金链和琥珀，还有耳环。一件袍子上有十二枚金别针。王后上了楼，女人们把礼物跟着送上去。
    - id: ch04
      title: "留下的火光"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            到天黑，求婚人还没唱跳够。屋里抬来三个火盆，烧着干柴，女仆轮换着举火把。奥德修斯提议自己守灯，让她们去陪王后，聊聊天或纺毛。这些人留到早上，他也能陪着不睡。墨兰托嘲笑他，说他只不过打败一个伊罗斯，就敢在这里乱说话，最好去别处睡，免得更强的人来赶他。这个女仆小时候受过王后照料，拿过她送的玩具，现在却不在意她的忧伤。她是欧律马科斯的情人，站在求婚人那边。奥德修斯的脸沉了下来。
        - id: ch04-b02
          speaker: odysseus
          text: >-
            我这就去告诉忒勒马科斯。他会让人把你手脚都撕下来！
        - id: ch04-b03
          speaker: narrator
          text: >-
            女人们吓得走开了，怕他真的告状。老人拿着火把站到火盆边，注视那些人映在自家墙上的影子。雅典娜还不让他们停止傲慢。欧律马科斯取笑秃头老人，说照亮屋子的该是他的脑袋。他又问，去乡下筑石墙、栽树，管吃管穿，老人愿不愿意？恐怕只想讨饭，不想出力吧。奥德修斯便说，一人一把镰刀，割到天黑，看谁先累。或者同样的好牛，各自去犁地，看谁犁得直。真要作战，给他武器，他也能冲在前头。
        - id: ch04-b04
          speaker: odysseus
          text: >-
            你围着这么一群人才觉得自己了不起。奥德修斯若回来，这么宽的大门，也不够你逃的。
        - id: ch04-b05
          speaker: narrator
          text: |-
            欧律马科斯举凳便扔。奥德修斯低身避到安菲诺摩斯膝边，躲了过去。凳子砸中斟酒人的右手，那人喊着向后倒，酒壶落地作响。求婚人吵嚷起来，埋怨老人搅了宴席。忒勒马科斯站出来，要他们吃饱喝足就回去睡。连喝完酒安稳坐着都做不到，何必再留？他们咬着嘴唇，没想到年轻人敢这样讲话。安菲诺摩斯赞同他，说别再动客人或仆人了。献完酒，喝最后一杯就走，客人让主人照料。

            大家接过调好的酒，依次祭神，饮完后各自回家。

            人声终于静了，屋里的火把还在燃烧。
