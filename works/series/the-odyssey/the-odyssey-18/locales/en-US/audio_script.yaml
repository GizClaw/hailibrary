  chapters:
    - id: ch01
      title: "The beggars fight"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Another tramp now arrived at the house. He begged all over Ithaca, and everyone knew how hopelessly greedy and fond of drink he was. He looked huge, but had little strength and no endurance. His mother had named him Arnaeus. The young men called him Irus instead, because he would run errands for anyone who sent him. As soon as he arrived he began abusing Ulysses. He meant to drive him out of the very house that belonged to him.
        - id: ch01-b02
          speaker: irus
          text: >-
            Out of that doorway, old man! Move, or you'll be dragged away by your neck and your heels. Can't you see them winking at me? They all want me to throw you out. I just don't care to use force. So get to your feet and leave by yourself, or we'll have a fight.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Ulysses looked at him with a frown.
        - id: ch01-b04
          speaker: odysseus
          text: >-
            Friend, I haven't harmed you at all. People give you plenty, and I don't envy you for it. This doorway has space for both of us. Why grudge me a gift when it isn't yours to give? You look like a beggar, just as I am. Perhaps the gods will improve our fortunes one day. But stop threatening to fight. You may make me angry. Old as I am, I can leave your mouth and chest covered in blood. Then I shall have a quieter day tomorrow. You won't be coming back to Ulysses' house.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Irus answered in a fury.
        - id: ch01-b06
          speaker: irus
          emotion: angry
          text: >-
            You dirty, greedy wretch! Listen to you, rattling away like an old woman selling fish. I'm ready to use both fists on you and knock out those teeth like so many boar's tusks. Get yourself ready. These people can watch. You're never going to beat a man as much younger than you as I am.
        - id: ch01-b07
          speaker: narrator
          text: >-
            There on the smooth paving in front of the door, they hurled their insults at each other. Antinous saw the quarrel and laughed aloud. He called the others over.
        - id: ch01-b08
          speaker: antinous
          text: >-
            Here's the best entertainment you've ever had! The gods have never sent anything like it to this house before. Irus and the stranger have fallen out. They're going to fight. Let's get them started at once.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The suitors came laughing and gathered round the two men in rags. Antinous offered them a prize.
        - id: ch01-b10
          speaker: antinous
          text: >-
            Hear this, both of you. Down by the fire we have goats' stomachs filled with blood and fat, put aside for supper. The man who wins and shows he's the stronger can choose whichever one he wants. He may eat at our table whenever he pleases. We won't let another beggar come about the house.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Everyone agreed. Ulysses answered in a way that would keep them from guessing who he was.
        - id: ch01-b12
          speaker: odysseus
          text: >-
            Gentlemen, what chance does an old man have against someone young? Suffering has worn me out. But my belly won't let me refuse, even though all I can expect is a beating. First you must swear this. None of you will strike me unfairly to help Irus and make sure he wins.
        - id: ch01-b13
          speaker: narrator
          text: >-
            They swore the oath he asked of them. When they had finished, Telemachus spoke as well.
        - id: ch01-b14
          speaker: telemachus
          text: >-
            Stranger, if you want to settle this with him, there's nobody here you need to fear. Anyone who hits you will find he's fighting more than one man. I'm the host. Antinous and Eurymachus, our other chiefs, agree with me. They both know what's reasonable.
        - id: ch01-b15
          speaker: narrator
          text: >-
            They all accepted that. Ulysses tied his old rags round his waist. His powerful thighs came into view, along with his wide chest and shoulders and his strong arms. Minerva came near and put still more strength into his limbs. The suitors could hardly believe what they were seeing. A man turned to his neighbour with a remark that passed among them.
        - id: ch01-b16
          speaker: suitor_other
          text: >-
            Look at the thighs that stranger's been hiding under his rags! There won't be much left of Irus after this.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Irus heard them and grew very uneasy. The servants tied up his clothes by force and brought him into the open yard. He was so frightened that his arms and legs were shaking. Antinous rounded on him.
        - id: ch01-b18
          speaker: antinous
          text: >-
            All that swaggering, and now this! You should never have been born if a broken-down old tramp can frighten you. Let me make you a promise I'll certainly keep. If he beats you and proves the better man, I'll put you on a ship for the mainland. You'll go to King Echetus, who kills everyone who comes near him. He'll cut your ears and nose off, pull out your guts, and feed them to the dogs.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Irus was more terrified than before, but they brought him into the middle of the yard. The two men raised their fists. Ulysses considered how hard to hit. He could kill the man outright, or use less force and only knock him down. He chose the lighter blow. Otherwise the Achaeans might begin to suspect who he really was.
            The fight began. Irus struck Ulysses on the right shoulder. Ulysses hit Irus in the neck just below the ear. The blow smashed bones in his skull, and blood poured from his mouth. He dropped groaning into the dust, grinding his teeth and kicking his legs. The suitors flung up their hands and laughed till they nearly choked.
            Ulysses took Irus by one foot and dragged him through the outer court to the gatehouse. He propped him against the wall and put his staff in his hands.
        - id: ch01-b20
          speaker: odysseus
          text: >-
            Stay there and keep the dogs and pigs away. What a sorry creature you are. Try making yourself king of the beggars again, and you'll suffer worse than this.
    - id: ch02
      title: "A warning over wine"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Ulysses slung the dirty, ragged old bag over his shoulder by its cord and went back to the threshold to sit. The suitors entered the cloister, laughing and calling out good wishes to him.
        - id: ch02-b02
          speakers: [suitor_greeting_1, suitor_greeting_2, suitor_greeting_3]
          ensemble: chorus
          text: >-
            May Jove and all the gods give you everything you want! You've stopped that greedy tramp from pestering us. Soon we'll send him to the mainland, to King Echetus. He kills anyone who comes near him.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Ulysses took their words as a good omen. Antinous put a large goat's stomach before him, stuffed with blood and fat. Amphinomus brought two loaves from the bread basket. He raised a golden cup of wine to the stranger's health.
        - id: ch02-b04
          speaker: amphinomus
          text: >-
            I wish you well, old friend. You're in a very hard place now. May there be better days ahead for you.
        - id: ch02-b05
          speaker: odysseus
          text: >-
            Amphinomus, you seem to have good sense. With your father, that isn't surprising. I've heard people speak well of Nisus of Dulichium. They say he's brave and wealthy, and that you're his son. You look like a man of some standing yourself. So listen carefully to what I'm going to tell you. Of all the creatures that live on earth, none is so vain as a man. While heaven gives him health and strength, he thinks nothing bad will ever happen to him. Then the blessed gods send him sorrow, and he must bear it as best he can. Almighty God gives men their daily minds day by day. I know what that's like. I was rich once too. I was stubborn and proud. I counted on my father and brothers to stand behind me, and I did a great many wrong things. A man should fear the gods in everything he does. When heaven sends him something good, he should accept it without boasting. Look at the shameful things these suitors do. They eat away a man's estate and dishonour his wife. Yet that man is certain to return, and soon. Very soon, I tell you. May the gods let you reach home safely before then. I hope you won't be here to meet him on the day he arrives. Once he returns, he and the suitors will not part without blood being spilled.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Ulysses poured an offering to the gods. He drank, then handed the golden cup back to Amphinomus. Amphinomus went away with his head bowed and a serious face. He sensed that disaster was coming. Even so, he did not escape his death. Minerva had already decided that Telemachus would kill him. He returned to the seat he had left and sat down again.
    - id: ch03
      title: "The queen appears"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Minerva now gave Penelope the idea of showing herself to the suitors. The goddess wanted them to desire her even more. She also wanted Penelope to earn still greater respect from her husband and son. Penelope put on a mocking laugh and spoke to Eurynome.
        - id: ch03-b02
          speaker: penelope
          text: >-
            Eurynome, I've thought again. Much as I detest the suitors, I feel like going down to see them. I'd also like to warn my son to have no more dealings with those men. Their words may be sweet, but they intend harm.
        - id: ch03-b03
          speaker: eurynome
          text: >-
            My child, you're right about all of that. Go and speak to your son. But first wash yourself and rub some oil on your face. Don't keep going about with tears on your cheeks. It's not right to grieve without a pause. You always prayed you'd live to see Telemachus grow a beard, and now he is grown.
        - id: ch03-b04
          speaker: penelope
          text: >-
            I know you want the best for me, Eurynome. Still, don't urge me to wash and put on oil. The gods took away my beauty when my husband sailed. But send Autonoe and Hippodamia to me. I need them beside me when I go into the cloister. It wouldn't be proper to go alone among all those men.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The old woman left to call the maids to their mistress. Minerva had another plan as well. She sent a sweet sleep over Penelope. The queen lay on her couch and felt her limbs grow heavy. Then the goddess gave her more beauty and grace, so that all the Achaeans would admire her. She bathed her face in the heavenly beauty Venus wears when she dances with the Graces. She made her taller, with a more commanding figure. Her skin was whiter than freshly sawn ivory. After doing this, Minerva left. The maids came from the women's rooms, and the sound of their voices woke Penelope. She drew her hands across her face.
        - id: ch03-b06
          speaker: penelope
          text: >-
            What a wonderfully sweet sleep that was, even with all my troubles. If only Diana would give me a death just as gentle, here and now. Then I wouldn't go on wasting away in despair over my dear husband. He had every good quality a man could have. No Achaean was more outstanding than he was.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Penelope came down from her upstairs room with two maids beside her. When she reached the suitors she stood by a pillar supporting the cloister roof. She held her veil before her face. A sober, steady maid stood on either side. The suitors were overwhelmed at the sight. Each desired her desperately, and each prayed that she would become his wife and share his bed. Penelope spoke to her son.
        - id: ch03-b08
          speaker: penelope
          text: >-
            Telemachus, I fear you have less sense and less care for decent behaviour than you used to. As a child you knew better. Now you're grown, a stranger seeing your height and your handsome face would think you had a prosperous father. But you aren't behaving as you should. What was that uproar? Why did you let a stranger be treated so shamefully? He came to our house for protection. What if he'd been seriously hurt here? Think of the disgrace that would have brought you.
        - id: ch03-b09
          speaker: telemachus
          text: >-
            Mother, I understand why you're displeased. I know what's right and wrong now. When I was younger I didn't understand as I do today. But I can't always manage everything as I should. One after another, these wicked men drive me out of my senses, and no one stands beside me. Besides, that fight didn't end the way the suitors hoped. The stranger beat Irus. I wish father Jove, Minerva, and Apollo would break the necks of every man courting you, both inside this house and out. Let them all go as limp as Irus over there by the gate in the outer yard! Look how his head wags like a drunkard's. He's taken such a beating that he can't even stand. He couldn't walk home, wherever his home may be. He's no strength left at all.
        - id: ch03-b10
          speaker: narrator
          text: >-
            As mother and son talked, Eurymachus came forward to speak to Penelope.
        - id: ch03-b11
          speaker: eurymachus
          text: >-
            Queen Penelope, daughter of Icarius, if all the Achaeans in Iasian Argos could see you as you are now, even more suitors would be here tomorrow morning. No woman in the world can match your beauty or the strength of your mind.
        - id: ch03-b12
          speaker: penelope
          text: >-
            Eurymachus, my face and figure lost their beauty when the Argives sailed to Troy and took my dear husband with them. Heaven took it all from me then. If he came home and looked after my affairs, people would honour me more, and I would have a better appearance before them. Instead I'm weighed down by cares, and by every sorrow the gods have chosen to put upon me. My husband knew what lay ahead. When he left, he took hold of my right wrist and spoke to me.
        - id: ch03-b13
          speaker: odysseus
          text: >-
            Wife, not every one of us will come back safely from Troy. The Trojans know how to fight with bows and spears. They're skilled at fighting from chariots too, and nothing settles a battle faster than that. So I can't tell whether the gods will bring me back to you, or whether I'll die there at Troy. While I'm gone, see to everything at home. Care for my father and mother as you do now, and take even greater care in my absence. But once you see our son growing a beard, marry whichever man you choose, and leave the home we have now.
        - id: ch03-b14
          speaker: penelope
          text: >-
            That's what he told me. Now it's all coming true. One night I'll have to give myself to a marriage I hate. Jove has left me no hope of happiness. And there's another hurt that cuts deep into my heart. None of you courts me as men do in my country. When they seek a noble woman they believe will make a good wife, each hoping to win her, they bring sheep and oxen to feed her friends. They give the woman splendid gifts. They don't consume someone else's property and pay nothing for it.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Ulysses was pleased to hear her asking the suitors for presents. She was flattering them, and he knew the fine words did not express what she really meant. Antinous answered her.
        - id: ch03-b16
          speaker: antinous
          text: >-
            Daughter of Icarius, Queen Penelope, accept as many gifts as you wish from anyone willing to offer them. A gift isn't something to refuse. But we won't leave here and go back to our own concerns. Not one step, until you've married the finest man among us, whoever he proves to be.
        - id: ch03-b17
          speaker: narrator
          text: >-
            The others applauded. Each sent a servant for a gift. Antinous's man brought a large, beautiful dress with exquisite embroidery. Twelve finely made pins of pure gold fastened it. Eurymachus promptly offered a splendid chain of gold and amber beads, gleaming like sunlight. Two servants belonging to Eurydamas returned with earrings made with three shining pendants. They glittered beautifully. King Pisander, son of Polyctor, sent a necklace made with the rarest skill. All the others gave something lovely as well.
    - id: ch04
      title: "The torches"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The queen went upstairs again, with her maids carrying the presents behind her. The suitors turned to singing and dancing. They stayed through the evening and went on until it was dark. Then three braziers were brought in for light. They filled them with split wood, old and very dry, and lit torches from the fires. The maids took turns holding up those torches. Ulysses spoke to them.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Women, your master Ulysses has been away a long time. Go into the house and sit with your queen. Keep her company and cheer her, or spin and sort the wool. I'll give these men their light. Let them stay until morning if they want. They won't wear me out. I can endure a good deal.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The maids looked at one another and laughed. Pretty Melantho began taunting him with contempt. She was Dolius's daughter, but Penelope had brought her up. As a child she had been cared for by the queen and given toys to play with. Yet she showed no concern for her mistress's grief. She had fallen in love with Eurymachus and was sleeping with him.
        - id: ch04-b04
          speaker: melantho
          text: >-
            You miserable man, have you lost your mind altogether? Go and sleep in a smith's shop or where people gather to gossip. Don't stand here babbling. Aren't you ashamed to speak in front of your betters, with so many of them present? Is that the wine talking? Or do you always chatter like this? Beating that tramp Irus seems to have turned your head. Watch out. A stronger man might come along and crack your skull with a stick. Then you'll be sent from the house with blood running off you.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Ulysses scowled at her.
        - id: ch04-b06
          speaker: odysseus
          text: >-
            You spiteful woman! I'll tell Telemachus what you've said. He'll have you pulled apart, limb from limb.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The women were frightened. They went farther into the house, trembling all over. They thought he would do exactly what he had threatened. Ulysses stood by the burning braziers with the torches raised. He watched the people and thought about what was surely going to happen.
    - id: ch05
      title: "Eurymachus loses his temper"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Minerva would not let the suitors stop their insults even for a moment. She wanted Ulysses to hate them more bitterly still. So she prompted Eurymachus, son of Polybus, to mock him, and the other men laughed.
        - id: ch05-b02
          speaker: eurymachus
          text: >-
            Hear me, all you men courting Queen Penelope. I'll tell you what I think. There's a reason this stranger has come into Ulysses' house. The light isn't coming from the torches at all. It's shining from his head! He hasn't a hair left on it, not one.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Then Eurymachus addressed Ulysses himself.
        - id: ch05-b04
          speaker: eurymachus
          text: >-
            Stranger, how would you like work in the country? I'll send you there and pay you properly. Can you put up a stone wall? Can you plant trees? I'll feed you throughout the year and supply clothes and shoes. Will you take it? Of course you won't. Your habits are too bad, and you don't want to work. You'd rather wander about begging and fill your belly that way.
        - id: ch05-b05
          speaker: odysseus
          text: >-
            Eurymachus, I'd like to try working beside you in early summer, when the days are longest. Give me a sound scythe and take one yourself. When the grass is ready for mowing, let us cut from dawn until dark. Then we'll see who keeps going longer and who cuts better. Or we could try ploughing. Give each of us a pair of tawny oxen, evenly matched, strong, and able to keep at it. Put me in a field of four acres, and watch which of us drives the straighter furrow. And if war began today, give me a shield, two spears, and a helmet fitting close around my temples. You'd see me at the very front of the fighting. You'd stop laughing about my belly then. You're cruel and arrogant. You think you're great because you live among a tiny circle of people, and bad people at that. If Ulysses returns to what's his, you'll discover something. The doors of his house are wide, but you'll find them narrow when you try to flee through them.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Eurymachus was furious. He glared at Ulysses and shouted at him.
        - id: ch05-b07
          speaker: eurymachus
          emotion: angry
          text: >-
            You wretch! I'll soon make you pay for daring to speak to me that way, right here in front of all these people. Is the wine in your head making you talk like this? Or do you always go on with such nonsense? Since you beat that wandering beggar Irus, you seem to have lost your senses altogether.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He seized a footstool. Ulysses was afraid and moved to the knees of Amphinomus of Dulichium for protection. The stool struck the cupbearer's right hand and knocked him over. With a cry he fell flat on his back. His wine jug clattered to the floor. In the roofed cloister the suitors broke into an uproar. Men turned to their neighbours to complain.
        - id: ch05-b09
          speaker: suitor_complaining
          text: >-
            Why couldn't that stranger have gone somewhere else? Bad luck to him and all the trouble he brings us. We can't have this disturbance over a beggar. If people keep behaving so foolishly, none of us will enjoy the feast any more.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Telemachus came forward to address them.
        - id: ch05-b11
          speaker: telemachus
          text: >-
            Gentlemen, have you all gone mad? Can't you eat and drink and keep decent order? Some evil power must have hold of you. I don't mean to force anyone out. But you've had your supper. The sooner you go home to bed, the better.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The suitors bit their lips. They were astonished that he dared speak so boldly. But Amphinomus spoke up. He was the son of Nisus, whose own father was Aretias.
        - id: ch05-b13
          speaker: amphinomus
          text: >-
            Don't take offence. What he's said is reasonable, so let's not answer back. And no one must hurt the stranger or any of Ulysses' servants. Have the cupbearer bring wine round. We'll make our offerings to the gods, then go home and rest. Leave the stranger to Telemachus. After all, the man has come to his house.
        - id: ch05-b14
          speaker: narrator
          text: >-
            The suitors were pleased to hear what Amphinomus proposed. His servant Mulius, who came from Dulichium, prepared a bowl of wine mixed with water. He carried it round the company and served them one man after another. They poured out their offerings to the blessed gods. When the offerings were finished, each man drank as much as he wanted. Then the suitors went their separate ways, every one of them returning to his own home.
