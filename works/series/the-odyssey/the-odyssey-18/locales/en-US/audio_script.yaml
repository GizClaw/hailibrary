audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "measured epic storytelling in plain speech", timbre: "warm and clear", pace: "measured", pitch: "medium"}
    odysseus:
      display_name: Odysseus
      tts: {delivery: "deliberate and resourceful", timbre: "weathered", pace: "unhurried", pitch: "medium-low"}
    irus:
      display_name: Irus
      tts: {delivery: "boastful and quarrelsome", timbre: "coarse and heavy", pace: "blustering", pitch: "low"}
    penelope:
      display_name: Penelope
      tts: {delivery: "thoughtful and controlled", timbre: "clear", pace: "measured", pitch: "medium"}
    melantho:
      display_name: Melantho
      tts: {delivery: "sharp and dismissive", timbre: "bright and cutting", pace: "brisk", pitch: "medium-high"}
  chapters:
    - id: ch01
      title: "A fight and a warning"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Odysseus was still waiting to speak with Penelope when another beggar came. This was Irus, a big man who ran errands in town and regularly ate at the palace. He wanted the stranger off the threshold.
        - id: ch01-b02
          speaker: irus
          text: >-
            Get out of my way, old man. Everyone wants me to put you outside.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Odysseus looked at him.
        - id: ch01-b04
          speaker: odysseus
          text: >-
            There's space for you and me. None of your things are missing. Stop threatening me, or I'll hit you till your mouth and chest are covered in blood, old as I am.
        - id: ch01-b05
          speaker: narrator
          text: |-
            Irus threatened to break his teeth. Antinous heard the quarrel and laughed. He called the others to watch the two beggars fight. He would give the winner first choice of the rich food cooking for supper. After that, the winner could eat with them and keep the doorway. They wouldn't admit another beggar. Odysseus acted as though he hardly dared try. He was too old to beat a younger man, he said, but he needed food. He made the suitors promise they wouldn't hit him during the fight. They swore, and Telemachus, as master of the house, promised to protect him too.

            Odysseus tied up his rags, showing broad shoulders and powerful legs. Athena made him stronger still. The men around him stopped laughing in the same way. Now they thought Irus might lose. Irus heard that, and his body shook. The servants tied his clothes up against his will and made him come forward. Antinous said they would send him across the sea to Echetus if he lost. That king would slice off his ears, nose, and genitals. He would give the genitals to the dogs.

            Odysseus thought about killing him. But he held back, afraid somebody might recognize him if he struck too hard. Irus hit his right shoulder. Odysseus punched him under the ear and broke bone. Blood ran from Irus's mouth as he dropped, groaning and kicking in the dirt. He couldn't get up. The suitors laughed loudly. Odysseus took him by a foot, pulled him to the gate, and sat him against the wall with a staff in his hands.
        - id: ch01-b06
          speaker: odysseus
          text: >-
            Keep the pigs and dogs away. Start bullying beggars again, and next time it'll be worse for you.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Odysseus took his bag back to the threshold. The men praised him. They still meant to send Irus to Echetus. Antinous brought the promised meat. Amphinomus gave him two loaves and wine, hoping his fortune would improve. Odysseus took the food but warned him. He said he had once relied on money and strength himself, and had done wrong because he felt secure. Fortune could change very suddenly. These men were wasting another man's goods and dishonoring his wife. The owner would soon be back.
        - id: ch01-b08
          speaker: odysseus
          text: >-
            I hope you're safely home before he arrives. Don't be here to face him. There will be blood when he comes.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He poured some wine as an offering, drank, and returned the cup. Amphinomus bowed his head. The warning worried him. Even so, he sat down with the suitors again. Athena had decided he would die when Telemachus struck him.
    - id: ch02
      title: "What the queen asked for"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Athena gave Penelope the thought of going downstairs. She told Eurynome she needed to warn her son. The suitors spoke pleasantly, but meant him harm. Eurynome suggested she wash away the signs of crying before she appeared. Penelope wouldn't dress for a celebration. Her happiness had gone with her husband. She only asked for two attendants to come with her. While Eurynome fetched them, Athena let her fall into a pleasant sleep, restored her beauty, and made her presence more commanding.

            She woke to the women's voices. She wished Artemis would let her die as easily as she had fallen asleep. Then she would stop suffering over her husband. She got up, held her veil before her face, and went down between the two women. Every suitor wanted her in his bed. She spoke to Telemachus.
        - id: ch02-b02
          speaker: penelope
          text: >-
            You're a grown man. How could you let them abuse a guest here? Suppose he'd been seriously injured?
        - id: ch02-b03
          speaker: narrator
          text: |-
            Telemachus said she had reason to be angry. He knew what was right, but these men gave him no peace, and he had nobody to help him. Besides, the fight hadn't ended as they expected. The stranger had won. He wished Zeus, Athena, and Apollo would snap all the suitors' necks. Then they would lie there, limp as Irus. Eurymachus praised the queen's looks and intelligence. If more men saw her, he said, more would come seeking her hand. Penelope spoke instead of Odysseus. Before leaving, he had held her hand and warned her he might not survive Troy. She must look after his parents. Once their son was grown, she could choose a new husband and leave.

            That time had come, and the marriage she feared seemed close. But she said these men weren't courting her properly. They ought to bring gifts and provide food for her family. Instead, they ate what she owned already. Odysseus was glad as he listened. She was getting presents from them with words they mistook for encouragement. Antinous told her to take the gifts, though they would stay until she chose someone. Servants ran off to fetch them. They brought an embroidered dress with twelve gold fastenings, a gold and amber chain, earrings, and other jewelry. Penelope returned upstairs, followed by her women carrying the presents.
    - id: ch03
      title: "Keeping the lights"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Singing and dancing began again. At nightfall, three braziers were brought in, filled with dry wood. The women held torches in turns. Odysseus offered to take care of the lights. They could go and talk to the queen or work with her wool. He could stay awake for as long as the men wanted. Some women laughed at that, and Melantho mocked him. Penelope had cared for her as a child and given her toys. Now she seemed to care little for Penelope's grief. She was Eurymachus's lover, speaking among his companions.
        - id: ch03-b02
          speaker: melantho
          text: >-
            You beat Irus, and now you think this is your place? Find somewhere else to sleep. Someone stronger might still put you out.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Odysseus turned toward her.
        - id: ch03-b04
          speaker: odysseus
          text: >-
            Telemachus will hear about this from me. He'll order them to tear your arms and legs off.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The women were afraid he would do it. They hurried away, leaving him by the braziers. He held the torches and watched the men's shadows move on the walls of his own home.
    - id: ch04
      title: "The second stool"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Athena wouldn't let the suitors give up their insults. Eurymachus said the light must come from the beggar's bare head, not the fire. Everyone laughed. Then he offered him a job making stone walls and planting trees. He would feed and clothe him, he said, though a beggar probably preferred asking for food to working. Odysseus answered him.
        - id: ch04-b02
          speaker: odysseus
          text: >-
            Take a scythe and give me one. We can cut grass from morning to night and see who lasts. Or give us each good oxen, and look at the furrows we plow. In a battle, give me weapons and see if I fight at the front. You feel important with this crowd around you. When Odysseus comes back, those big doors may not be wide enough for you to escape through.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Eurymachus snatched up a stool and threw it. Odysseus ducked beside Amphinomus's knees. The stool missed him and hit the cupbearer's right hand. The man cried out and fell on his back. His jug clattered against the floor. The men burst into noisy complaints, blaming the beggar for spoiling the feast. Telemachus came forward. They had eaten enough, he said. If they couldn't drink without a quarrel, they should go to bed at home. They bit their lips, astonished that he dared tell them this.

            Amphinomus agreed with him. There must be no more attacks on the guest or the servants. They should pour their offerings, drink, and leave the stranger with the household that had received him. A servant mixed a last bowl of wine. The suitors made their offerings and drank, then each set off for home.

            The hall grew quiet, but the torches still burned.
