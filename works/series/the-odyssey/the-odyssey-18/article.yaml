labels: { topics: [ adventure, travel ], themes: [ perseverance, identity ], moods: [ reflective ] }
premise: >-
  荷马史诗第十八卷的阅读整理。奥德修斯被迫与伊罗斯交手，又向安菲诺摩斯发出警告； 佩涅洛佩下楼责问儿子，并使求婚人送来礼物。入夜后，老人守着灯火忍受新的羞辱， 直到忒勒马科斯让宴席散去。
characters:
  - { id: odysseus, description: "仍未公开身份的主人，在对抗、警告和观察中等待时机" }
  - { id: irus, description: "试图独占讨食位置，却被求婚人推入争斗的流浪者" }
  - { id: telemachus, description: "保护客人、承受母亲责问，并要求求婚人离席的年轻主人" }
  - { id: antinous, description: "把弱者争斗当作娱乐、以奖赏和恐吓促成拳斗的求婚人" }
  - { id: amphinomus, description: "受到隐晦警告却仍留席，随后劝众人停止冲突的求婚人" }
  - { id: penelope, description: "悲伤未减，却能在求婚人的欲望中为家中取回赠礼的女主人" }
  - { id: eurynome, description: "劝王后整理仪容、安排侍女陪同的女管事" }
  - { id: melantho, description: "由王后抚养、与欧律马科斯相恋并嘲弄老客人的女仆" }
  - { id: eurymachus, description: "以奉承和嘲笑支配气氛，受顶撞后掷凳伤及斟酒人的求婚人" }
titles:
