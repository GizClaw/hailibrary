audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "从容讲述，转折清楚", timbre: "温润清晰", pace: "舒缓而有变化", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，迟疑与坚定自然转换", timbre: "清亮", pace: "中速", pitch: "中音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定而耐心", timbre: "沉静清晰", pace: "从容", pitch: "中音"}
    zeus:
      display_name: 宙斯
      tts: {delivery: "从容而有权威", timbre: "浑厚清楚", pace: "稍缓", pitch: "低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "克制而亲切", timbre: "柔和成熟", pace: "稍缓", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "自信，话中带着逼问", timbre: "厚实略干", pace: "中速", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 众神决定归途
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            特洛伊打完仗了。那些逃过刀剑、逃过海难的人，都陆续回到了家。奥德修斯还没回来。卡吕普索把他留在海岛，要他做丈夫，不肯放人。他想念的却是妻子和家乡。同船的人已经全死了。他们不听禁令，吃了太阳神的牛，最后谁也没能回去。
            一天，波塞冬去赴宴，其他神聚在奥林波斯。宙斯想到了埃癸斯托斯。赫尔墨斯早就劝过这个人，别去勾引阿伽门农的妻子，更别杀她丈夫。可他两件事都做了。如今，阿伽门农的儿子俄瑞斯忒斯也杀了他。
        - id: ch01-b02
          speaker: zeus
          text: |
            人遭了祸，就怪我们。有的祸，明明是他们自己招来的。
        - id: ch01-b03
          speaker: narrator
          text: |
            雅典娜说，那个凶手确实活该。可是奥德修斯呢？他只想再看看家乡，哪怕看见一缕炊烟也好。他在特洛伊献过那么多祭品，宙斯难道忘记了？
        - id: ch01-b04
          speaker: zeus
          text: |
            我记得他。是波塞冬不肯罢休。奥德修斯弄瞎了他的儿子波吕斐摩斯，他就不让人回家。他不杀奥德修斯，却一直拦着。大家一起决定送他回去吧，海神总不能反对所有的神。
        - id: ch01-b05
          speaker: narrator
          text: |
            雅典娜说，先让赫尔墨斯去通知卡吕普索。她自己去伊萨卡见那个儿子，鼓励他出门，到皮洛斯和斯巴达打听。
            她拿着铜矛，变成塔菲亚人的首领门忒斯，来到奥德修斯家。求婚人正坐在吃剩的牛皮上玩棋，仆人忙着备饭。忒勒马科斯坐在他们当中，想象父亲回家，把这些人赶出去。他一看见门外的客人，就赶紧迎上前。
        - id: ch01-b06
          speaker: telemachus
          text: |
            请进来，先吃点东西。有什么事，吃过再说。
        - id: ch01-b07
          speaker: narrator
          text: |
            青年把铜矛放进父亲的兵器架，让客人坐得离那些人远些。有人送来洗手的水，还有面包、肉和酒。求婚人吃饱了，又逼斐弥奥斯唱歌。忒勒马科斯趁琴声响起，靠近客人，小声说话。
        - id: ch01-b08
          speaker: telemachus
          text: |
            吃别人的，听歌自然高兴。要是我父亲回来，他们就该盼自己跑得快，不是钱多了。可我已经不信那些归来的传闻。您是什么人？认识我父亲吗？
        - id: ch01-b09
          speaker: narrator
          text: |
            客人自称门忒斯，运铁出海做买卖，准备换铜回来。他说两家原本就熟，拉厄耳忒斯知道这交情。只是老人现在伤心得不进城，住在乡下。他也是听说奥德修斯已归来，才登门的。既然人不在，恐怕是神或者什么人把他扣在岛上。
        - id: ch01-b10
          speaker: athena
          text: |
            他没有死。我不会算命，可我相信他能回来。就是铁链锁着，他也会设法脱身。你这头脸，尤其眼睛，真像他。你是他儿子吧？
        - id: ch01-b11
          speaker: telemachus
          text: |
            我母亲是这么讲的。我自己怎么能知道？要是父亲留在自家土地上，安安稳稳活到老，该多好。
    - id: ch02
      title: 不能继续等待
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            门忒斯问，这家里为什么天天开宴席？青年告诉他，附近岛上和伊萨卡有权势的男人都来了，要娶他母亲。母亲既不一口拒绝，也不选个人。他们就不停吃喝，把家产一点点耗尽。他担心，接着就该轮到自己遭殃了。父亲若死在特洛伊，好歹能留座坟，留个光荣的名字。现在呢，连人去了哪里都不知道。
        - id: ch02-b02
          speaker: athena
          text: |
            这里需要奥德修斯，需要他拿着武器站回门口。我认识他时，他曾找人要毒药，准备涂在箭上。那人怕神，不肯给。我父亲却给了他。若他还是那时候的样子，这些人哪会有什么好婚事。
        - id: ch02-b03
          speaker: narrator
          text: |
            父亲能不能回来报仇，诸神会决定。可青年自己也有事要办。
        - id: ch02-b04
          speaker: athena
          text: |
            明早召开大会，把家里的事讲给大家听，请神来作证。叫求婚人回自己家。母亲若想嫁，就让她回父亲那里，择丈夫、备嫁礼。
            你找一艘船，带二十个人，先见皮洛斯的涅斯托尔，再去斯巴达找墨涅拉奥斯。他在希腊人里回来最晚。
            父亲若活着，正在回家，你就再忍一年。若真死了，就回来给他筑坟，办祭奠，安排母亲改嫁。然后，想想怎样杀死家里的求婚人。明着动手也好，用计也好。你不是小孩子了。想想俄瑞斯忒斯，他杀了害死父亲的人，如今人人都赞他。
        - id: ch02-b05
          speaker: narrator
          text: |
            忒勒马科斯答应记住，还请客人洗个澡、歇一歇，收下厚礼再走。门忒斯说，不能再等了，礼物就留到下次见面，彼此再交换。
            说着，雅典娜竟像鸟一样飞上了天空。忒勒马科斯心里多了一股勇气。他明白了，原来有神来见过他。他便直接回到求婚人那里。
    - id: ch03
      title: 厅堂里的警告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            斐弥奥斯正在唱希腊人归途的灾难，唱雅典娜怎样使他们受苦。佩涅洛佩在楼上听见，带着两个女人下来。她蒙着面纱，站在柱子旁哭，求歌者另唱一支神和英雄的故事。这支歌总让她想起失去的丈夫，她实在受不了。
        - id: ch03-b02
          speaker: telemachus
          text: |
            母亲，让他唱自己选的吧。灾难又不是歌者惹的，是宙斯给人祸福。没回来的，也不止我父亲一个。你回去织布纺线，照管女仆吧。这儿该男人讲话，尤其该由我讲，因为这个家由我作主。
        - id: ch03-b03
          speaker: narrator
          text: |
            佩涅洛佩很惊讶，把儿子的话记在心里，上了楼。她哭着想念丈夫，直到雅典娜让她睡去。楼下，那些求婚人个个都盼着和她上床。
            忒勒马科斯叫他们别吵，好好听斐弥奥斯唱歌。明早必须去大会，他要正式请他们离开。
        - id: ch03-b04
          speaker: telemachus
          text: |
            想吃宴席，你们就回家轮流摆，自己出钱。要是偏想吃光我们一家，我就求宙斯。愿你们全死在这屋里，连报仇的人也没有。
        - id: ch03-b05
          speaker: narrator
          text: |
            求婚人咬着嘴唇，惊讶他竟这样大胆。安提诺奥斯咒他，愿宙斯永远别让他做伊萨卡的王。
        - id: ch03-b06
          speaker: telemachus
          text: |
            神若给我王位，我愿意接。岛上谁领头，现在还说不定。可父亲的家，还有他取得的奴仆，得由我自己管。
        - id: ch03-b07
          speaker: narrator
          text: |
            欧律马科斯说，产业确实归他，没人会抢，也没人会伤害他。接着就问，那客人是谁，有没有奥德修斯的消息？
        - id: ch03-b08
          speaker: telemachus
          text: |
            我看父亲已经死了。传闻我不信，母亲找来的预言家，我也不信。客人叫门忒斯，是父亲的老朋友。
        - id: ch03-b09
          speaker: narrator
          text: |
            认出女神的事，他一个字没提。
            那些人又唱又跳，入夜才各回各家。欧律克勒娅举着火把，送青年上楼。她年轻时被拉厄耳忒斯买下，受他敬重。他怕妻子怨恨，没同她上床。后来，她做了忒勒马科斯的乳母。现在，她把青年的衣服折好，关上房门。

            他盖着羊毛毯，一整夜没睡，还在想着出海的事，想着雅典娜的劝告。
