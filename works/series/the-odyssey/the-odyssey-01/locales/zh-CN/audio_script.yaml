audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 用平实的话从容讲述古老史诗
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    zeus:
      display_name: 宙斯
      tts:
        delivery: 沉稳直接而有威严
        timbre: 浑厚成熟
        pace: 从容
        pitch: 低音
    athena:
      display_name: 雅典娜
      tts:
        delivery: 笃定敏锐
        timbre: 清亮坚定
        pace: 稳健
        pitch: 中音
    telemachus:
      display_name: 忒勒马科斯
      tts:
        delivery: 坦率年轻
        timbre: 清朗略带稚气
        pace: 自然而有果断的停顿
        pitch: 中音
    penelope:
      display_name: 佩涅洛佩
      tts:
        delivery: 深思而克制
        timbre: 清晰温润
        pace: 舒缓
        pitch: 中音
    antinous:
      display_name: 安提诺奥斯
      tts:
        delivery: 强硬傲慢
        timbre: 厚实而有棱角
        pace: 较快
        pitch: 中低音
    eurymachus:
      display_name: 欧律马科斯
      tts:
        delivery: 圆滑自信
        timbre: 圆润清楚
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 众神商议归期
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            缪斯啊，请说说那位足智多谋的英雄吧。攻下名扬四方的特洛伊城以后，他到处漂泊，走了很远很远。他见过许多城邦，也了解了许多民族怎样生活。他在海上吃尽苦头，为的是活下去，把同伴也平安带回家。可他再怎么努力，也救不了他们。他们做了蠢事，竟去吃太阳神许珀里翁的牛，丢掉了性命。太阳神从此不许他们回家。宙斯的女儿啊，把你知道的这一切，也讲给我们听吧。

            那时，从战场和海难中活下来的人，全都回了家。唯独奥德修斯还在外面。他想回自己的国家，想回到妻子身边。可卡吕普索女神不让他走，把他留在一座大洞穴里，想嫁给他。一年年过去，众神终于定下让他回伊萨卡的日子。但回到同胞中间以后，他还得受苦。诸神如今都可怜起他来，只有波塞冬仍不放过他，总设法拦住他回家的路。

            这时候，波塞冬去了世界尽头。那里的埃塞俄比亚人分住在两处，一处在西，一处在东。他们献上了用牛羊做祭品的百牲大祭，波塞冬正在享受祭宴。其余的神都聚到了奥林波斯的宙斯宫里。宙斯是神和人的父亲，他先说话了。他正想到埃癸斯托斯，那人已经被阿伽门农的儿子俄瑞斯忒斯杀死。
        - id: ch01-b02
          speaker: zeus
          text: |-
            看看这些凡人，总说灾祸是我们神明带来的。其实呢，是他们自己愚蠢。埃癸斯托斯就是这样。他明知会送命，还要勾引阿伽门农的妻子，做这不义的事，后来又杀了阿伽门农。我让赫尔墨斯去警告过他，这两件事都做不得。等俄瑞斯忒斯长大，想回家了，一定会给父亲报仇。赫尔墨斯好心好意地劝他，他就是不肯听。如今，该还的，他一点也没少还。
        - id: ch01-b03
          speaker: athena
          text: |-
            父亲，克洛诺斯的儿子，众王之上的王，埃癸斯托斯是罪有应得。谁那样做，都该受同样的惩罚。可我惦记的不是他，是奥德修斯。一想到他受的苦，我就心疼。他孤身困在大海中的岛上，离所有亲友那么远。那岛正好在海中央，长满森林。岛上的女神是阿特拉斯的女儿。阿特拉斯懂神术，管着海底，还扛着分开天地的那些巨柱。他女儿扣着奥德修斯不放，什么好听的话都说，想让他忘了家。他却连活着都觉得没意思，只想再看一眼自家屋顶的炊烟。您怎么一点也不理会呢？他在特洛伊时，不是一次又一次烧祭品供奉您吗？您为什么还要生他的气？
        - id: ch01-b04
          speaker: zeus
          text: |-
            孩子，这话从何说起？我哪里会忘记奥德修斯。凡人中，有谁比他更能干？又有谁给天上永生的诸神献过比他更多的祭品？不过，波塞冬的怒气还没消。奥德修斯弄瞎了独眼巨人之王波吕斐摩斯的一只眼睛。波吕斐摩斯是波塞冬的儿子，母亲叫托俄萨，是海王福耳库斯的女儿。所以，波塞冬没有直接取他的性命，却一直折磨他，不许他回家。我们一起来想个办法，送他回去吧。大家都同意的话，波塞冬总不能独自反对我们所有人。他会平息怒气的。
        - id: ch01-b05
          speaker: athena
          text: |-
            父亲，克洛诺斯的儿子，众王之上的王，既然大家决定让奥德修斯回家，就先让赫尔墨斯去奥吉吉亚岛，告诉卡吕普索，我们已经拿定主意，她必须放人。我这就去伊萨卡，给忒勒马科斯添些勇气。我要让他敢于召集阿开亚人的大会，当众责问那些向佩涅洛佩求婚的人。他们赖在他家，吃了不知多少牛羊。我还会引他到斯巴达和皮洛斯去，打听亲爱父亲的消息。这次出门，也会让人们对他刮目相看。
    - id: ch02
      title: 门口的来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            雅典娜系好金光闪闪的凉鞋。这双鞋永远不会坏，能带她像风一样掠过陆地和海面。她拿起包着青铜的长矛。矛又粗又结实，令人害怕。那些英雄只要惹怒她，无论怎样列阵，都会被它打垮。她从奥林波斯最高的山峰冲了下来，转眼到了伊萨卡，立在奥德修斯家门口，手里拿着青铜矛。她已经换了模样，看起来是个来访的客人，塔福斯人的首领门忒斯。

            屋前，那些有身份的求婚人正在下棋。他们宰了牛，吃了肉，又坐在牛皮上。男仆和侍童忙着伺候，有人往调酒缸里兑水和酒，有人用湿海绵擦桌子再摆好，还有人切着一大堆肉。

            忒勒马科斯最先看见了她。他正坐在求婚人中间，满心忧闷，想着英勇的父亲。他盼着父亲回来，重新掌管家业，受到从前那样的尊敬，把这群人统统赶跑。一看见客人，他就去了门口。他不愿让来客站在外面等。握住她的右手以后，他请她把长矛交过来。
        - id: ch02-b02
          speaker: telemachus
          text: |-
            快请进，欢迎您来。先在家里吃顿饭，等吃好了，再告诉我们您有什么事。
        - id: ch02-b03
          speaker: narrator
          text: |-
            他领着雅典娜进了屋，把长矛安放在矛架上。矛架靠着粗大的承柱，里面有他那不幸的父亲留下的许多长矛。接着，他请客人坐在装饰华丽的椅子上，座下铺了锦织的布，脚边放了脚凳。他自己也搬把椅子坐在旁边，离求婚人很远。这样，客人吃饭时不必听他们吵闹，忍受他们的无礼，他也好细问父亲的下落。

            女仆用漂亮的金壶把水倒进银盆，请两人洗手，再搬来一张干净桌子。管事女仆拿出面包和家里各种好吃的。切肉的仆人把一盘盘不同的肉送来，在他们身边放下金杯，另一个男仆便把酒斟上了。

            求婚人进屋，纷纷坐上长凳和椅子。男仆为他们浇水洗手，女仆捧着面包篮挨个送去，侍童调好了酒和水。他们伸手拿起美食，吃喝起来。吃够喝够，还要听歌看舞，才觉得这场宴席圆满。仆人把里拉琴递给斐弥奥斯，他们硬要他唱。他一弹起琴，开口唱歌，忒勒马科斯就凑到雅典娜耳边，低声说话，不让别人听见。
        - id: ch02-b04
          speaker: telemachus
          text: |-
            先生，我说这些话，请您别介意。不用自己掏钱，听歌还不容易吗？这里所有的花费，都算在一个人头上。可那个人的骨头，也许正在荒地里烂掉，也许被海浪碾成粉了。要是他们看见我父亲回伊萨卡来，宁愿腿长一点，也不会盼钱袋再鼓一点了。钱救不了他们。可惜，父亲遇上了灾难。如今有人说他要回来，我们也不信。我们再见不着他了。

            您也跟我说说实话吧。您叫什么，从哪儿来？您的家乡在哪里，父母是谁？坐什么样的船来的？那些水手怎么把您带到伊萨卡，他们说自己是哪国人？您总不能从陆地走到这里呀。还有，您是第一次登门，还是我父亲在家的时候，您就来过？以前客人可多了，父亲自己也常到处走。
        - id: ch02-b05
          speaker: athena
          text: |-
            好，我全告诉你，不瞒你。我是门忒斯，安基阿洛斯的儿子，统领塔福斯人。我带船员出海，去一个语言不同的国家。船上装着铁，正准备运去忒墨萨，回来带铜。船就停在那边，城外乡野旁的雷特隆港，港口上方是树林茂密的涅里同山。

            我们父辈早就是朋友了。你问老拉厄尔忒斯，他就知道。不过我听说，他现在不进城了，一个人住在乡间，生活很艰苦。有个老妇人照料他，他在葡萄园忙累了回来，她就给他做饭。我这次来，是因为听说你父亲已回了家。看来诸神还拦着他。他没有死，至少没有死在大陆上。也许他留在大海中间的某座孤岛上，也许给野蛮人抓住了，那些人不肯放他走。

            我不懂预言，看征兆也没什么本领。但天上有个声音让我这样想，我可以告诉你，他不会再离家很久。他那样善于想办法，就是戴着铁链，也能找出回家的路。你也老实告诉我，奥德修斯真有你这么俊的儿子？这头面，这眼睛，太像他了。他去特洛伊以前，我俩亲近得很。那时候，阿尔戈斯最杰出的人都去了特洛伊。从此，我们就没再见过。
        - id: ch02-b06
          speaker: telemachus
          text: |-
            母亲告诉我，父亲是奥德修斯。可自己的父亲究竟是谁，谁能真的知道呢？我巴不得是另一个人的儿子，那人守着自己的地和家产，好好地活到老。您既然问了，我就说吧，天底下再没有谁，比人们所说的我父亲更倒霉了。
        - id: ch02-b07
          speaker: athena
          text: |-
            佩涅洛佩有你这样的好儿子，你们这家人还用担心断了后代吗？可这宴席又是怎么回事？这些都是些什么人？在庆祝什么呢？你们是请客，还是办婚事？没见谁带吃的过来。客人怎么能闹成这样，满屋子都是他们的吵声。随便哪个正派人走近了，都要厌恶他们。
        - id: ch02-b08
          speaker: telemachus
          text: |-
            我告诉您吧，先生。父亲还在时，一家人过得好，家业也好。可诸神不高兴了，把这些全变了。他们藏起父亲，藏得那么深，还没有哪个凡人消失得这样彻底过。要是他和部下在特洛伊城前战死，或者打完了仗，在朋友身边去世，我还不至于这么难受。阿开亚人会给他的骨灰筑坟，我也能继承他的声名。可风暴把他带去了哪儿，我们不知道，什么踪迹也找不到。他只留给我惊慌和难过。

            而且，上天给我的苦处，还不只失去父亲这一件。我们各个岛的首领都来了，有杜利基翁的，有萨墨的，有长满树林的扎金索斯的，还有伊萨卡本地那些头面人物。他们说是向母亲求婚，却一直吃我们家的东西。母亲不愿直说不嫁，也不肯作决定。他们毁着我的家业，接下来就会毁掉我了。
    - id: ch03
      title: 去寻找父亲
      blocks:
        - id: ch03-b01
          speaker: athena
          text: |-
            真是这样？那你可太需要奥德修斯回来了！给他戴上头盔，拿好盾牌，再握两支长矛。只要他像我第一次在家里见到他时那样，站回自家门口，就能把这群无赖收拾了。那次，他在我家喝酒，十分快活，刚从厄菲拉回来。他去找墨耳墨罗斯的儿子伊洛斯讨毒药，要涂在箭上。伊洛斯怕那些永生的神，不肯给。我父亲很喜欢他，就给了他一些。他要是还像当初一样，求婚人的日子就不多了，婚礼也该惨了。

            不过，他是否回来报仇，要看诸神的意思。你自己得赶快设法把人赶走。听我说，明早召集阿开亚的英雄们，开个大会。把你的遭遇说给大家听，请天上的神作证。让这些人回自己的家去。要是母亲已经打算再嫁，就请她回娘家，让她父亲给她找丈夫，备好出嫁的礼物。父亲疼爱女儿，该给她的就要给。

            你呢，去挑艘最好的船，带二十名船员，出海打听父亲。他失踪这么久了，也许有人知道消息。也许神会传个信来，人们常这样听说一件事。先到皮洛斯问涅斯托尔，再往斯巴达去见墨涅拉奥斯。阿开亚人中，他最后一个回家。如果听说父亲活着，正往家走，你就再忍十二个月，让求婚人耗些家产。如果听说他死了，你马上回来，隆重地给他办葬礼，筑个坟冢纪念他，再让母亲嫁人。

            办完以后，就该好好想想，怎样在家里杀死这些人。明着来，或者暗中设法，都可以。你已经长大了，不能老说自己年纪小。人们都在夸俄瑞斯忒斯，你听说过吧？他杀了埃癸斯托斯，替被害的父亲报了仇。你长得这么好，又机灵，拿出点胆量，也让后人记住你。现在我得走了。船员还等在船上，等得太久，会着急的。记牢这些话，你自己再想想。
        - id: ch03-b02
          speaker: telemachus
          text: |-
            先生，您像待亲生儿子一样教导我，我很感激。您的话我会一一照做。虽然您赶着出海，还是多留一会儿吧。洗洗澡，休息一下，我再送您件礼物，让您高兴地上路。一定是很美、很贵重的一件，就当作纪念。这是亲近的朋友才会送给彼此的东西。
        - id: ch03-b03
          speaker: athena
          text: |-
            这回别留我，我要马上动身。想送我的礼物，你先收着，下次来我再带走。你送得好，我也会给你回一件，同样珍贵。
        - id: ch03-b04
          speaker: narrator
          text: |-
            说完，雅典娜像鸟儿一样飞进了天空。忒勒马科斯觉得自己添了胆量，比刚才还惦念父亲。这变化使他惊奇，他明白了，客人原来是位神。于是他直接回到了求婚人身边。
    - id: ch04
      title: 家中的歌声与争执
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            斐弥奥斯还在弹唱。他唱阿开亚人从特洛伊回来时的苦难，那是雅典娜带给他们的。大家静静坐着，听得入了神。伊卡里奥斯的女儿佩涅洛佩在楼上听到了。她带着两个侍女，沿宽大的楼梯下来，站到求婚人面前。支撑回廊屋顶的柱子就在身边，两个端庄的姑娘一左一右陪着她。她把面纱挡在脸前，哭得很伤心。
        - id: ch04-b02
          speaker: penelope
          emotion: sad
          text: |-
            斐弥奥斯，神和英雄的故事，你不是还知道很多吗？都是诗人爱唱的那些事。另选一个给他们唱吧，让他们安安静静喝酒。别再唱这段伤心事了，我受不了。它总让我想起失去的丈夫，我一直在为他哭。他的名声，当年整个希腊，连阿尔戈斯中部都知道啊。
        - id: ch04-b03
          speaker: telemachus
          text: |-
            母亲，他愿意唱什么，就让他唱什么。那些苦难不是唱歌的人造成的，是宙斯造成的。他想把福气或灾祸给谁，就给谁。这人唱达那奥斯人的不幸归途，也没有害人的意思。新歌总是最受欢迎的。您要想开一点，忍一忍。没从特洛伊回来的，哪里只有奥德修斯。死的人还有很多。回屋做您的事吧，织布、纺线，吩咐仆人们干活。这里说话该由男人来，尤其该由我来，因为这个家由我掌管。
        - id: ch04-b04
          speaker: narrator
          text: |-
            佩涅洛佩十分惊讶，回到屋内，把儿子这番话记住了。她带侍女上楼，回房继续哀悼亲爱的丈夫。后来，雅典娜让甜甜的睡意落在她眼上，她才睡去。下面有顶的回廊中，求婚人闹哄哄的，个个都盼望能跟她同床。忒勒马科斯开了口。
        - id: ch04-b05
          speaker: telemachus
          text: |-
            你们这些没羞耻、又放肆的求婚人！今晚先好好吃喝，可别争吵。斐弥奥斯的歌声像神赐的一样，能听见很难得。明早都来参加大会，我会当众通知你们，离开这儿。你们可以轮流去彼此家里设宴，花自己的钱。要是还想白吃同一个人的家产，那就愿上天助我，宙斯一定会叫你们偿清。你们将死在我父亲的家里，连替你们报仇的人都没有。
        - id: ch04-b06
          speaker: narrator
          text: |-
            求婚人咬住了嘴唇。他们没有料到，忒勒马科斯说话竟这样大胆。欧佩忒斯的儿子安提诺奥斯先回答他。
        - id: ch04-b07
          speaker: antinous
          text: |-
            神明教了你不少本事啊，会吓唬人，会夸口了。愿宙斯别让你接父亲的位子，做伊萨卡的首领。
        - id: ch04-b08
          speaker: telemachus
          text: |-
            安提诺奥斯，你别为这事骂我。神要是答应，我也做得到，那我愿意当。你觉得当首领就是最坏的下场？我倒觉得很好，有财富，也有尊荣。如今奥德修斯死了，伊萨卡还有很多有声望的人，老的年轻的都有。首领也许由别人来做。可我自己的家，还得听我的，奥德修斯为我赢来的人，也得归我管。
        - id: ch04-b09
          speaker: eurymachus
          text: |-
            我们谁做首领，上天自会决定。你自己的宅子和财产，当然由你管。伊萨卡只要还有人在，就不会让谁欺负你、抢你的东西。好兄弟，说说刚才的客人吧。他是哪里人，什么家族，家产在什么地方？他带来你父亲要回来的消息了？还是来办自己的事？看起来他挺富有的。可是走得太快，转眼就没影了，我们都还没来得及认识他。
        - id: ch04-b10
          speaker: telemachus
          text: |-
            父亲死了，已经不在了。现在传来什么消息，我都不信。母亲有时候还请卜者来问话，我却不再听那些预言。刚才那位叫门忒斯，是安基阿洛斯的儿子，带领塔福斯人，跟我父亲是老朋友。
        - id: ch04-b11
          speaker: narrator
          text: |-
            但他自己心里知道，来的其实是雅典娜。

            求婚人继续唱歌跳舞，一直玩到了天黑，才各回各家睡觉。忒勒马科斯带着满腹心事，走向塔楼上的卧室。那里很高，可以望见外面的院子。欧律克勒娅拿着两支明亮的火把，走在前面。她是位好心的老妇人，父亲叫奥普斯，祖父叫庇塞诺尔。拉厄尔忒斯在她年轻时，用自己的钱买了她，付出相当于二十头牛的价钱。他在家中给她的尊重，和给妻子的一样，但怕妻子怨恨，从没和她同床。忒勒马科斯还是婴儿时，就由她照料。她比家里其他女人都疼爱他，如今又为他照路。

            忒勒马科斯推门进去，坐到床上。他脱下衬衣，交给老妇人。她叠好，挂在床边的木钉上，才走出去。她握着银门扣把门拉拢，又拉皮带闩上门。忒勒马科斯裹着羊毛毯躺下，整夜都在想那趟将要开始的航行，也想着雅典娜对他说过的话。
