audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: "从容讲述，转折清楚", timbre: "温润清晰", pace: "舒缓而有变化", pitch: "中音"}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: "年轻直接，迟疑与坚定自然转换", timbre: "清亮", pace: "中速", pitch: "中音"}
    athena:
      display_name: 雅典娜
      tts: {delivery: "笃定而耐心", timbre: "沉静清晰", pace: "从容", pitch: "中音"}
    zeus:
      display_name: 宙斯
      tts: {delivery: "从容而有权威", timbre: "浑厚清楚", pace: "稍缓", pitch: "低音"}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: "克制而亲切", timbre: "柔和成熟", pace: "稍缓", pitch: "中音"}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: "自信，话中带着逼问", timbre: "厚实略干", pace: "中速", pitch: "中低音"}
  chapters:
    - id: ch01
      title: "门外的客人"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            特洛伊的仗已经打完了，活下来的人一个个回了家。可奥德修斯一直没有回来。

            卡吕普索把他扣在海岛上，想嫁给他。他不肯留下，一心要回妻子身边。他的同伴已经一个不剩了。他们不听劝，把太阳神的牛杀来吃了，结果再也没能回家。

            有一天，波塞冬去赴宴，其他神在奥林波斯聚会。宙斯说起阿伽门农。这位国王打完仗回家，竟被妻子的情人杀死。凶手叫埃癸斯托斯。赫尔墨斯劝过他，别勾引别人的妻子，更不能杀人家的丈夫，可他就是不听。后来，国王的儿子俄瑞斯忒斯杀了他，替父亲报仇。
        - id: ch01-b02
          speaker: zeus
          text: "一出了祸事，人就怪神。有些祸明明是他们自己惹下的，也算在我们头上。"
        - id: ch01-b03
          speaker: athena
          text: "那个凶手的下场，是他自己招来的。可奥德修斯又怎样呢？他只想再看看家乡升起的炊烟。他在特洛伊向您献过那么多祭品，您难道都忘了？"
        - id: ch01-b04
          speaker: zeus
          text: >-
            我还记着他。一直不肯罢休的是波塞冬。奥德修斯弄瞎了那个独眼巨人，波吕斐摩斯，那是海神的儿子。海神不取他的命，却一回又一回挡住他的归路。大家一起决定怎么办吧。如果我们都同意，波塞冬也不能一个人反对。
        - id: ch01-b05
          speaker: narrator
          text: |
            雅典娜提了个办法。先让赫尔墨斯去告诉卡吕普索，众神决定让奥德修斯回家。她自己去伊萨卡，鼓励他的儿子到皮洛斯和斯巴达找消息。

            她拿着铜矛，变成塔菲亚首领门忒斯的模样，到了奥德修斯家门口。那些来求婚的人坐在牛皮上玩棋，仆人正给他们备酒备肉。儿子忒勒马科斯也在其中。他想，父亲若回来，把这些人赶走，该有多好。看见客人站在门外，他连忙起来迎接。
        - id: ch01-b06
          speaker: telemachus
          text: "快请进来。先用饭，等吃好了，咱们再谈。"
        - id: ch01-b07
          speaker: narrator
          text: >-
            他接下铜矛，搁在父亲的兵器架里，又给客人安排了个座位，离那些人远些。洗手的水送来了，随后是面包、肉和酒。那群人吃够了，又逼斐弥奥斯弹唱。琴声一响，忒勒马科斯就凑近客人，小声说起话来。
        - id: ch01-b08
          speaker: telemachus
          text: >-
            钱不用自己出，他们听歌倒高兴！父亲要是真回来，钱再多也没用了，他们只会盼自己能跑快些。可说他快回家的话，我已经听得太多了。您从哪儿来？您以前认识他吗？
        - id: ch01-b09
          speaker: narrator
          text: >-
            来客报上门忒斯的名字，说船上运的是铁，这一船铁要拿去换铜。两家的交情从上一辈就有了，青年的祖父拉厄尔忒斯知道。这些年，老人一直很伤心，如今独自住在乡下，不来城里。
        - id: ch01-b10
          speaker: athena
          text: |
            别人说你父亲已经到家，我才登门来看他。现在他还没回来，恐怕是在某个岛上，神或是什么人扣住了他。我不会预言，但我相信他没死。你父亲那么能干，就算被铁链锁住，他也会找出回家的路。

            你的模样很像他，眼睛也像。你就是他儿子吧？
        - id: ch01-b11
          speaker: telemachus
          text: "我也只是听母亲这么说，只能信她了。要是父亲能留在自家的田地上，过一辈子安稳日子，那该多好。"
    - id: ch02
      title: "去找父亲的消息"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            门忒斯问，这家里为什么有这么多人吃喝。青年告诉他，附近岛上、伊萨卡本地有势力的人，都想娶母亲。母亲没有答应谁，也不肯把话说绝。他们就天天来，把家产一点点吃空。这样下去，连他自己都难保。

            父亲如果战死在特洛伊，至少能有座坟，把好名声留给儿子。可现在，人去了哪里，是死是活，他全不知道。
        - id: ch02-b02
          speaker: athena
          text: >-
            真得让奥德修斯带着武器回来，站到自己门口！有一回，他想拿毒药涂箭，就去找人要。那人怕神，不肯给，我父亲却给了他。要真是当年的奥德修斯回来了，这些人还怎么结得成婚？
        - id: ch02-b03
          speaker: narrator
          text: "父亲能不能回家报仇，要看诸神怎样决定。门忒斯劝青年，他自己也该动起来。"
        - id: ch02-b04
          speaker: athena
          text: |
            明天一早，把大家召集起来。当众说清楚家里的遭遇，让神作证，叫那些人各自回家。母亲要是决定再嫁，就回娘家，让她父亲找个丈夫，准备嫁妆。

            你去找船，带二十个人出海。先问皮洛斯的涅斯托尔，再去斯巴达问墨涅拉奥斯。他比其他希腊人都晚回来，也许听见过什么。

            要是父亲还活着，已经在回来的路上，你再忍受一年。可他若确实死了，你就回来筑坟，办祭礼，再安排母亲嫁人。然后，好好想想怎样杀死这些求婚人。直接动手，或是设个计谋。你已经长大了。俄瑞斯忒斯杀了害死父亲的人，大家都称赞他。你也该挣个名声。
        - id: ch02-b05
          speaker: narrator
          text: |
            忒勒马科斯说自己会记住，还请客人再留一会儿，洗浴休息，收下一份贵重的礼物再走。门忒斯却说不能再耽搁，礼物等下回见面再交换。

            说着，雅典娜像一只鸟，飞进了天空。青年十分惊讶，这才知道刚才和自己说话的是神。他有了勇气，便回到求婚人那里。
    - id: ch03
      title: "这个家由谁做主"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            斐弥奥斯还在唱，唱希腊人回家路上怎样遭难，雅典娜又怎样使他们受苦。楼上的佩涅洛佩听见了，带着两个侍女下楼。面纱遮着脸，她站在柱旁流泪，请歌者换一支歌。
        - id: ch03-b02
          speaker: penelope
          text: "斐弥奥斯，你还会那么多神和英雄的故事，另唱一支吧。这一支别再唱了，我听着，就想起我的丈夫。"
          emotion: sad
        - id: ch03-b03
          speaker: telemachus
          text: >-
            他想唱什么，就让他唱吧。带来灾祸的不是歌者。宙斯才掌管人的祸福。没能从特洛伊回来的又不止奥德修斯一个。母亲，你回去织布纺线，管好女仆。这里轮到男人说话，首先得听我说，我是这个家的主人。
        - id: ch03-b04
          speaker: narrator
          text: >-
            佩涅洛佩很吃惊，记住了这番话，上楼去了。她仍为丈夫伤心，哭着哭着，雅典娜让她睡着了。楼下却还在吵闹。每个求婚人都想娶她，和她睡在一起。忒勒马科斯叫大家别吵，听斐弥奥斯唱歌。
        - id: ch03-b05
          speaker: telemachus
          text: >-
            明早开会，你们都来。我会当着众人的面叫你们离开。要摆宴席，就回自己家，轮流花自己的钱。你们要是不走，非把我一家吃空不可，我就求宙斯给我作主。愿你们死在这屋里，也没人能替你们报仇！
        - id: ch03-b06
          speaker: narrator
          text: "这话让求婚人咬住了嘴唇。他们没想到青年会这样大胆。安提诺奥斯咒骂起来。"
        - id: ch03-b07
          speaker: antinous
          text: "愿你永远也当不上伊萨卡的王！"
        - id: ch03-b08
          speaker: telemachus
          text: >-
            真有神让我当王，我当然愿意。伊萨卡有势力的人不少，王位最后归谁，还说不定。父亲留下的房子和奴仆，倒一定得由我来管。
        - id: ch03-b09
          speaker: narrator
          text: >-
            欧律马科斯承认，这些家产是他的，还保证不会有人抢走，也没人会伤害他。说完，又打听那位客人是谁，是否带来了父亲的消息。
        - id: ch03-b10
          speaker: telemachus
          text: "父亲已经死了。那些传闻，我一句也信不过。母亲请来的预言家说什么，我也不信。刚才那人叫门忒斯，从前跟父亲有交情。"
        - id: ch03-b11
          speaker: narrator
          text: |
            来的是女神，他心里很清楚，却没对求婚人说。

            一直唱歌跳舞到夜里，那群人才各自回了家。欧律克勒娅举着火把，送忒勒马科斯上楼。她是他的老乳母。年轻时，拉厄尔忒斯把她买进家里，对她很尊重，但怕妻子怨恨，没有和她同过床。后来她喂养过这个孩子，如今又替他把衣服叠起来，把门关上。

            忒勒马科斯躺在羊毛毯下，始终睡不着。出海的事，还有雅典娜那些话，他想了整整一夜。
