  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: "patient storytelling with clear turns", timbre: "warm and clear", pace: "measured", pitch: "medium"}
    telemachus:
      display_name: Telemachus
      tts: {delivery: "direct, with a young man's uncertainty", timbre: "clear and youthful", pace: "varied", pitch: "medium"}
    athena:
      display_name: Athena
      tts: {delivery: "assured and attentive", timbre: "steady and clear", pace: "unhurried", pitch: "medium"}
    zeus:
      display_name: Zeus
      tts: {delivery: "deliberate and authoritative", timbre: "full and resonant", pace: "measured", pitch: "low"}
    penelope:
      display_name: Penelope
      tts: {delivery: "restrained and personal", timbre: "soft and mature", pace: "unhurried", pitch: "medium"}
