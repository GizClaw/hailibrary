  chapters:
    - id: ch01
      title: The gods consider a homecoming
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Muse, tell me about that resourceful hero. After he took the famous city of Troy, he wandered far across the world. He visited many cities and learned how many different peoples lived. At sea he endured terrible suffering. He struggled to stay alive and to bring his men safely home with him. But however hard he tried, he could not save them. Their own foolishness destroyed them. They ate the cattle of Hyperion, the Sun-god, and he made sure they never reached their homes. Daughter of Jove, tell us all of this, from whatever you know of their story.

            By now, everyone who had survived the fighting and the wrecks at sea had returned home. Everyone except Ulysses. He longed for his wife and his own country, but the goddess Calypso would not let him leave. She kept him in a great cave and wanted him for her husband. The years passed. At last the time came when the gods had decided he should return to Ithaca. Even there, among his own people, his troubles would not be finished. Still, the gods had begun to feel pity for him. Only Neptune refused. He kept persecuting Ulysses and blocking his journey home.

            Just then Neptune was away with the Ethiopians. They lived at the ends of the world, in two separate parts, one toward the west and one toward the east. He had gone to receive a sacrifice of a hundred sheep and oxen, and was enjoying the feast. The other gods had gathered in the palace of Olympian Jove. Their father, the father of men as well, spoke first. He was thinking about Aegisthus, whom Agamemnon's son Orestes had killed.
        - id: ch01-b02
          speaker: zeus
          text: |-
            Listen to the way people blame us gods. They bring trouble on themselves through their own foolishness, then say we caused it. Take Aegisthus. He insisted on taking Agamemnon's wife, though he had no right to her, and then he murdered Agamemnon. He knew it would cost him his life. I sent Mercury to warn him against both things. Once Orestes grew up and wanted to come home, he would certainly avenge his father. Mercury meant him well. He told him plainly, but Aegisthus would not listen. Now he has paid for the whole of it.
        - id: ch01-b03
          speaker: athena
          text: |-
            Father, son of Saturn, king above all kings, Aegisthus deserved what came to him. Anyone who acts as he did should meet the same end. But leave him aside. It is Ulysses I grieve for. Think of him suffering on that lonely island, surrounded by sea and so far from everyone who loves him. The island lies right out in the middle of the ocean, covered in forest. A goddess lives there, the daughter of Atlas, who knows such powerful magic. He watches over the ocean's depths and bears the great pillars that hold earth and heaven apart. His daughter keeps poor Ulysses there. She tries every sweet word she knows to make him forget his home. He has grown weary of living. All he wants is to see the smoke of his own chimneys again. Yet you pay no attention, Father. When he was fighting at Troy, didn't he burn sacrifice after sacrifice to win your favor? Why are you still so angry with him?
        - id: ch01-b04
          speaker: zeus
          text: |-
            My child, how can you say that? Of course I remember Ulysses. There is no more capable man alive. No one offers more generously to the immortal gods in heaven. But you must remember Neptune's anger. Ulysses put out an eye of Polyphemus, the king of the Cyclopes. Polyphemus is Neptune's son. His mother is the nymph Thoosa, whose father is Phorcys, the king of the sea. That is why Neptune torments Ulysses. He will not simply kill him, but he keeps him from coming home. Let us decide together how to bring him back. Neptune will have to let his anger settle. He cannot easily oppose all the rest of us when we agree.
        - id: ch01-b05
          speaker: athena
          text: |-
            Father, son of Saturn, king above all kings, if we mean to bring Ulysses home, let us send Mercury to Ogygia first. He can tell Calypso that our decision is made. Ulysses must return. I shall go to Ithaca meanwhile and give his son Telemachus some courage. I will help him dare to call an assembly of the Achaeans and speak against his mother Penelope's suitors. They keep eating his sheep and oxen without end. Then I shall guide him to Sparta and Pylos to ask for news of his dear father's return. People will think well of him for making that journey.
    - id: ch02
      title: A stranger at the gate
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Minerva fastened on her shining golden sandals. They never wore out, and carried her as fast as the wind over land and sea. She took up her dreadful spear, stout and strong, with its bronze point. With that weapon she broke the ranks of heroes who had angered her. Down she flew from the highest peaks of Olympus. In a moment she stood at the gateway of Ulysses' house in Ithaca, holding a bronze spear. She had made herself look like a visitor, Mentes, the chief of the Taphians.

            The highborn suitors were outside the house, playing draughts. They sat on the hides of oxen they had killed and eaten. Servants and pages hurried around them. Some mixed wine and water in the great bowls. Some wiped the tables with wet sponges and set them again. Others cut up great heaps of meat.

            Telemachus noticed the visitor before anyone else. He was sitting unhappily among the suitors, thinking about his brave father. If only his father came back, took possession of his house and won back his old honor. He would send these men running. In the midst of those thoughts, Telemachus caught sight of Minerva. He went straight to the gate. It troubled him to see a stranger waiting outside. He clasped her right hand and offered to take her spear.
        - id: ch02-b02
          speaker: telemachus
          text: |-
            Come in, and welcome. There is food for you in our house. Once you have eaten, you can tell us what has brought you here.
        - id: ch02-b03
          speaker: narrator
          text: |-
            He led her inside. Against a sturdy pillar stood a rack full of his unfortunate father's spears. He put hers beside them. Then he brought her to a finely decorated chair, spread a damask cloth beneath it, and provided a stool for her feet. He set his own chair close by, well away from the suitors. She could eat without their noise and rude behavior disturbing her. He could also ask about his father more freely there.

            A maid arrived with water in a beautiful gold jug. She poured it into a silver basin so they could wash their hands, then brought a clean table to their side. A senior servant supplied bread and the best things the house had to offer. The man who carved the meat brought plates of different cuts and set golden cups beside them. Another servant fetched wine and filled their cups.

            The suitors now came in and settled on the chairs and benches. Male servants poured water over their hands. Maids carried the bread baskets around, while pages mixed more wine with water. The men reached for the good food before them. When they had eaten and drunk enough, they called for music and dancing. Those pleasures were the finest finish to a feast. A servant brought a lyre to Phemius. They forced him to sing for them, whether he wished to or not. As his fingers touched the strings and his song began, Telemachus leaned his head close to Minerva's. He spoke quietly enough that no one else could hear.
        - id: ch02-b04
          speaker: telemachus
          text: |-
            Sir, please don't take offense at what I am about to say. It costs these men nothing to listen to songs. Someone else pays for it all. His bones are rotting in some lonely place, or being ground into powder by the waves. If they saw my father come back to Ithaca, they would pray for longer legs rather than a longer purse. Their money could not help them then. But he has met some dreadful fate. Sometimes someone still tells us he is coming, and we no longer believe it. We shall never see him again.

            Now tell me honestly about yourself, sir. Who are you? Where have you come from? What town is yours, and who are your parents? What sort of ship brought you here? How did the crew bring you to Ithaca, and what country did they say they belonged to? You certainly cannot have walked here. There is something else I want to know. Is this your first visit to our house, or did you come here while my father was still at home? We used to have many visitors in those days. He traveled a great deal himself.
        - id: ch02-b05
          speaker: athena
          text: |-
            You shall have the full truth. My name is Mentes. Anchialus is my father, and I rule the Taphians. I have brought my own ship and crew. We are sailing to people who speak a different language, carrying iron to Temesa and hoping to bring copper back. You will find my ship out there, away from the town, beside the open countryside. She lies in Rheithron harbor, below wooded Mount Neritum.

            Our fathers were friends long before this. Ask old Laertes and he will tell you. Though I hear he no longer comes into town. He lives alone in the country and has a hard time of it. An old woman looks after him. When he comes back tired from tending his vineyard, she makes his meal. I heard your father had returned, and that is why I came. It seems the gods are still holding him back. But he is not dead, not somewhere on the mainland. I think he is on an island far out at sea, or in the hands of savage people who refuse to release him.

            I have no gift for prophecy, and little knowledge of omens. Still, heaven puts this thought into my mind. I tell you he will not be away much longer. He has so many ways of solving a difficulty that even iron chains could not stop him finding a way home. Now give me an honest answer. Can Ulysses really have a son as fine-looking as you? Your head and your eyes are astonishingly like his. We were close friends before he sailed for Troy, where all the finest of the Argives went too. We have not seen each other since that time.
        - id: ch02-b06
          speaker: telemachus
          text: |-
            Mother tells me Ulysses is my father. But how can a child be certain who his father is? I wish I belonged to a man who had lived peacefully into old age on his own land. Since you ask, the man they call my father has had worse luck than anyone beneath the sky.
        - id: ch02-b07
          speaker: athena
          text: |-
            With a son like you born to Penelope, your family is not about to die out. But explain something else to me. Who are all these people? Why is there so much feasting? Are you giving a banquet, or is someone in the family getting married? Nobody appears to have brought any food of his own. And what dreadful manners your guests have. Their uproar fills the house. Any decent person coming near them would be disgusted.
        - id: ch02-b08
          speaker: telemachus
          text: |-
            Sir, while my father was here, our family and our house were doing well. The gods took offense and changed all that. They have hidden him away more completely than any mortal was ever hidden before. Even his death would have been easier to bear if he had fallen with his men outside Troy. Or he might have died among friends once his battles were over. The Achaeans would have raised a mound above his ashes, and his great name would have passed to me. Instead the storm winds have carried him off somewhere. We have no idea where. He has left no trace at all, and I am left with nothing but fear and misery.

            Losing my father is not even the end of our trouble. Heaven has given me another kind of suffering. The chiefs from all our islands have come here. They come from Dulichium, Same, and the wooded island of Zacynthus. All the leading men of Ithaca itself are here too. They say they are courting my mother, and use that as their excuse to eat us out of our home. She will not give them a flat refusal, but she will not settle the matter either. They are destroying everything I own. Soon they will destroy me as well.
    - id: ch03
      title: The guest's counsel
      blocks:
        - id: ch03-b01
          speaker: athena
          text: |-
            Can that be true? Then you need Ulysses back indeed. Put a helmet on him, give him a shield and two spears. Let him stand at his own door as he was when I first knew him, drinking and enjoying himself in our house. He would soon deal with these wretched suitors. He had just come from Ephyra then. He went there to ask Ilus, the son of Mermerus, for poison to put on his arrows. Ilus was afraid of the immortal gods and refused. My father gave him some instead, because he loved him so much. If Ulysses came back as he was that day, these men would have little time left to live, and a miserable wedding.

            But the gods must decide whether he comes home and takes revenge in his house. You should start trying to get rid of these men now. Here is my advice. Tomorrow morning, call the Achaean heroes to an assembly. Tell them what has happened and ask heaven to witness your words. Tell the suitors to leave, each for his own home. If your mother really wishes to marry, let her go back to her father. He can find her a husband and give her the wedding gifts a well-loved daughter ought to have.

            As for you, find the best ship you can and take twenty men with you. Go in search of the father you have lost for so long. Someone may know something. Or heaven may send you a message. People often hear news that way. Go first to Pylos and question Nestor. After that, travel to Sparta and see Menelaus. He was the last of all the Achaeans to get home. If you hear that your father is alive and coming back, you can endure another twelve months of these men wasting your wealth. If the news is that he has died, come straight home. Give him the full funeral rites and raise a burial mound in his memory. Then have your mother marry again.

            Once you have done that, think carefully about how to kill these suitors in your own house. You may do it openly or use a trick. You are too old to keep saying you are only a child. Surely you have heard how everyone praises Orestes. He killed Aegisthus, the man who murdered his father. You are a handsome, quick young fellow. Show what you are made of, and win a name that people will remember. Now I must return to my ship and crew. They will be impatient if I leave them waiting any longer. Think all this over yourself, and remember my advice.
        - id: ch03-b02
          speaker: telemachus
          text: |-
            You have been very kind, sir. You have spoken to me as if I were your own son. I will follow everything you have told me. I know you want to continue your voyage, but please stay a little longer. Have a bath and refresh yourself first. Then I can send you on your way happily with a gift. I mean to give you something beautiful and valuable to remember me by, the sort of keepsake that dear friends exchange.
        - id: ch03-b03
          speaker: athena
          text: |-
            Please don't keep me now. I need to leave at once. If you want to give me something, save it until my next visit. I will take it home then. Choose a fine gift for me, and I will send you one just as valuable in return.
        - id: ch03-b04
          speaker: narrator
          text: |-
            With that, she flew away like a bird into the air. She had left Telemachus braver than before, with his mind turning still more strongly toward his father. He felt the change in himself and wondered at it. Now he knew his guest had been a god. He went directly back to the seated suitors.
    - id: ch04
      title: Telemachus speaks for his house
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Phemius was still singing. His listeners sat silent, held by the sad story of the return from Troy and the suffering Minerva had brought upon the Achaeans. Upstairs in her room, Penelope, the daughter of Icarius, heard him. She came down the broad staircase with two of her maids. She stopped by a pillar that held up the roof of the covered walk. A modest young maid stood on either side of her. Penelope held her veil before her face and wept bitterly.
        - id: ch04-b02
          speaker: penelope
          emotion: sad
          text: |-
            Phemius, you know so many other deeds of gods and heroes, the ones poets love to sing about. Give these men one of those songs. They can drink their wine quietly while you sing. But stop this sorrowful story. It hurts my grieving heart too much. It brings back the husband I have lost. I never stop mourning him. His name was famous all through Hellas and middle Argos.
        - id: ch04-b03
          speaker: telemachus
          text: |-
            Mother, let the singer choose his own song. The men who sing about suffering do not cause it. Jove does. He gives people good fortune or misery as he pleases. Phemius means no harm by singing about the Danaans' disastrous voyage home. People always give their loudest praise to the newest songs. You must try to accept it and bear the pain. Ulysses was not the only man who failed to return from Troy. Many others died there too. Go back inside to your work, to the loom and the distaff, and tell the servants what to do. Speaking here is men's business, and mine most of all. I am the master of this house.
        - id: ch04-b04
          speaker: narrator
          text: |-
            Penelope turned back, astonished, and took her son's words to heart. She and her maids went upstairs to her room. There she wept for her dear husband until Minerva laid sweet sleep upon her eyes. Meanwhile, the suitors' loud voices filled the covered walk. Each man prayed that he might be the one to share her bed. Telemachus spoke to them.
        - id: ch04-b05
          speaker: telemachus
          text: |-
            You shameless, arrogant suitors. Enjoy the feast for now, but stop your quarreling. It is a rare privilege to hear a voice as wonderful as Phemius has, a voice like a gift from the gods. Tomorrow morning, come to the full assembly. There I will formally tell you to leave. Hold your feasts in one another's homes, taking turns, and pay for them yourselves. If you still choose to live off one man's wealth, then heaven help me, Jove will make you pay in full. You will fall here in my father's house, and no one will take revenge for you.
        - id: ch04-b06
          speaker: narrator
          text: |-
            The suitors bit their lips. They were amazed that he dared to speak so boldly. Antinous, the son of Eupeithes, answered him.
        - id: ch04-b07
          speaker: antinous
          text: |-
            So the gods have taught you how to threaten and boast, Telemachus. May Jove never let you become chief of Ithaca as your father was.
        - id: ch04-b08
          speaker: telemachus
          text: |-
            Don't reproach me for it, Antinous. If the gods allow it and I have the chance, I will gladly be chief. Is that really the worst fate you can wish on me? Being chief is a good thing. It brings wealth and respect. Of course, now that Ulysses is dead, Ithaca has many other great men, young and old. One of them may become leader. But I will still rule my own house, and the people Ulysses won for me will answer to me.
        - id: ch04-b09
          speaker: eurymachus
          text: |-
            Heaven will choose which of us becomes chief. Your house and your property will be yours to command. As long as a man remains in Ithaca, nobody will be allowed to hurt you or steal what is yours. But tell me about that stranger, my friend. What country is he from? Who are his family? Where does he own land? Did he bring news that your father is returning, or did he have business of his own? He looked like a prosperous man. Yet he left in such a hurry. He was gone before we could get acquainted.
        - id: ch04-b10
          speaker: telemachus
          text: |-
            My father is gone. He is dead. I don't trust any of the reports that reach me now. Mother sometimes calls in a prophet and asks him questions, but I no longer pay attention to what they predict. The stranger was Mentes, son of Anchialus and chief of the Taphians. He is an old friend of my father's.
        - id: ch04-b11
          speaker: narrator
          text: |-
            In his heart, though, Telemachus knew the visitor had been the goddess.

            The suitors went back to singing and dancing. They kept it up until evening. When darkness came over their pleasures, each man went to his own house to sleep. Telemachus set off for his room, deep in troubled thought. It was high in a tower overlooking the outer courtyard. The good old woman Euryclea walked ahead of him with two blazing torches. She was the daughter of Ops, whose father was Pisenor. Laertes had bought her with his own money when she was still very young. He paid the value of twenty oxen. In his household he treated her with as much respect as his wife, but never took her to his bed. He feared his wife's resentment. Now she lit the way for Telemachus. She loved him more than any of the other women in the household, because she had nursed him as a baby.

            He opened his bedroom door and sat on the bed. As he took off his shirt, he handed it to her. She folded it neatly and hung it on a peg beside his bed. Then she left him. She pulled the door shut by its silver catch and drew the bolt into place with a strap. Under a woollen fleece, Telemachus lay thinking all night about his voyage and the advice Minerva had given him.
