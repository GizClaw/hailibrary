  chapters:
    - id: ch01
      title: The gods and the visitor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            Troy's war had ended. The men who'd escaped the fighting and the sea were home. But Odysseus was still in Calypso's cave. She wanted to marry him and wouldn't let him leave. He wanted his wife and his island. His own men were dead. They'd eaten the Sun god's cattle against his will, and lost their chance of coming home.
            Poseidon was away at a feast when the other gods met on Olympus. Zeus remembered Aegisthus. Hermes had warned the man not to take Agamemnon's wife or kill her husband. He'd done both. Now the dead man's son, Orestes, had killed him.
        - id: ch01-b02
          speaker: zeus
          text: |
            People blame us when they've brought their own troubles on themselves.
        - id: ch01-b03
          speaker: narrator
          text: |
            Athena agreed about the murderer. But what about Odysseus? He wanted just one sight of smoke from his own country. Had Zeus forgotten the offerings he'd made at Troy?
        - id: ch01-b04
          speaker: zeus
          text: |
            Of course I remember him. Poseidon won't forgive him for blinding his son Polyphemus. He doesn't kill Odysseus, but he keeps him from home. We must agree to bring him back. Poseidon can't oppose every one of us.
        - id: ch01-b05
          speaker: narrator
          text: |
            Athena suggested sending Hermes to Calypso. She herself would encourage the son in Ithaca and send him to Pylos and Sparta for news.
            She came to the palace with a bronze spear. She looked like Mentes, the Taphian chief. The suitors were playing draughts on the hides of cattle they'd eaten. Servants prepared their feast. Among them sat Telemachus, picturing his father coming back to throw them out. He noticed the stranger at the gate and hurried over.
        - id: ch01-b06
          speaker: telemachus
          text: |
            Welcome. Have some food first. Then tell us why you've come.
        - id: ch01-b07
          speaker: narrator
          text: |
            He left the spear in his father's weapon rack and gave the guest a seat away from the noise. They were brought washing water, bread, meat and wine. After the suitors had eaten, they forced Phemius to sing. With the lyre playing, Telemachus could speak quietly to his guest.
        - id: ch01-b08
          speaker: telemachus
          text: |
            It's easy to enjoy a song when someone else pays. If Father came back, these men would want longer legs, not fuller purses. But I don't believe those rumors anymore. Who are you? Did you ever know him?
        - id: ch01-b09
          speaker: narrator
          text: |
            The visitor said he was Mentes. He traded iron abroad for copper. Their fathers were friends. Laertes could tell him so, though the old man now lived sadly out in the country. Mentes had heard Odysseus was back. Since he wasn't, some god or captors must be keeping him on an island.
        - id: ch01-b10
          speaker: athena
          text: |
            He's living. I can't tell fortunes, but I believe he'll return. Even iron chains wouldn't hold him forever. Your head and eyes look like his. Are you his son?
        - id: ch01-b11
          speaker: telemachus
          text: |
            Mother tells me I am. How could I know for myself? I wish my father had stayed on his land and lived to old age.
    - id: ch02
      title: Advice for the son
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Mentes asked about the feast. Telemachus explained. Powerful men from Ithaca and the nearby islands wanted Penelope. She wouldn't refuse them all, and she wouldn't choose. They were consuming his property. He feared they'd destroy him next. If Father had died at Troy, there would be a grave and an honorable name for his son. Instead he'd simply disappeared.
        - id: ch02-b02
          speaker: athena
          text: |
            You need your father here, armed and ready. Once he came asking for poison for his arrows. One man feared the gods and refused. My father supplied it. If that same Odysseus came to the door, these men would bitterly regret their wedding plans.
        - id: ch02-b03
          speaker: narrator
          text: |
            The gods would decide if Odysseus returned for revenge. But his son must act, too.
        - id: ch02-b04
          speaker: athena
          text: |
            Hold an assembly tomorrow. Tell everyone what's happening, and call the gods as witnesses. Send these men home. If your mother wants another husband, let her father choose him and arrange the marriage gifts.
            Then get a ship with twenty men. Go to Nestor in Pylos. After that, visit Menelaus in Sparta. He was the last Greek to get home.
            If your father's alive and returning, wait another year. If he's dead, come back, raise his grave mound and give him funeral honors. Arrange your mother's marriage. Then work out how to kill these suitors in your house, with open force or a trick. You're a child no longer. Think of Orestes. He killed his father's murderer, and everyone praises him for it.
        - id: ch02-b05
          speaker: narrator
          text: |
            Telemachus said he would remember. He offered a bath and a fine present before the guest left. But Mentes was in a hurry. They could exchange gifts next time.
            Suddenly Athena flew into the air like a bird. Telemachus felt a new courage. He understood that his visitor was a god, and went straight back to the suitors.
    - id: ch03
      title: Words in the hall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            Phemius sang about the Greeks' terrible return and the suffering Athena had sent. Penelope heard him from upstairs. She came down with two women, stood veiled beside a pillar, and wept. She wanted another song about gods or heroes. This one hurt too much. It brought her lost husband back to mind.
        - id: ch03-b02
          speaker: telemachus
          text: |
            Mother, let him sing what he chooses. He's not the one who caused the disaster. Zeus sends good and bad to men. Father wasn't the only man who never returned from Troy. Go back to your loom and see to your servants. Men do the speaking here. I do, above all, because this house is mine to rule.
        - id: ch03-b03
          speaker: narrator
          text: |
            His words astonished Penelope. She took them to heart and went upstairs. There she cried until Athena put her to sleep. Down below, the suitors each wished they could share her bed.
            Telemachus ordered them to quieten down and hear Phemius. Tomorrow they were to meet in assembly. He would give them formal notice to leave.
        - id: ch03-b04
          speaker: telemachus
          text: |
            Take turns paying for feasts in your own homes. If you'd rather devour one man's property, I'll appeal to Zeus. May you all die here, with nobody to take revenge for you.
        - id: ch03-b05
          speaker: narrator
          text: |
            They bit their lips. They hadn't expected him to speak so boldly. Antinous wished Zeus would never let the young man rule Ithaca.
        - id: ch03-b06
          speaker: telemachus
          text: |
            I'd accept it if the god offered it. Perhaps another man will rule the island. But I'll be master of my father's house and the slaves he acquired for me.
        - id: ch03-b07
          speaker: narrator
          text: |
            Eurymachus said his property was safe. Nobody would rob him or hurt him. Then he asked who the guest was, and if he'd brought news.
        - id: ch03-b08
          speaker: telemachus
          text: |
            I think Father's dead. I don't believe rumors, or the prophets Mother sends for. That man was Mentes, an old friend of the family.
        - id: ch03-b09
          speaker: narrator
          text: |
            He didn't tell them he'd recognized the goddess.
            The men went back to singing and dancing. At night they left for their own homes. Euryclea brought torches and led Telemachus upstairs. Laertes had bought her as a young woman and treated her with honor. He hadn't slept with her, fearing his wife's anger. She'd nursed Telemachus as a baby. Now she folded his shirt and closed his door.

            He lay under a woollen fleece, awake all night, thinking about the journey and Athena's advice.
