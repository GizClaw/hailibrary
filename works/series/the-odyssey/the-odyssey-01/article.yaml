premise: "In this new retelling of Book I of the ancient Greek Odyssey tradition, Telemachus gives a stranger a place at his crowded table and is challenged to stop waiting for news of his father. Athena's visit leads him to confront the suitors and prepare to call an assembly."
characters:
  - {id: telemachus, description: "Odysseus's young son, whose anger at the occupation of his home has not yet become action."}
  - {id: athena, description: "The goddess who visits in the form of Mentes and urges Telemachus to make his own next move."}
  - {id: zeus, description: "The ruler of the gods, who agrees that Odysseus's long captivity must end."}
  - {id: odysseus, description: "The absent king of Ithaca, held on Calypso's island and opposed by Poseidon."}
  - {id: penelope, description: "Telemachus's mother, caught between grief for her missing husband and pressure to marry again."}
  - {id: antinous, description: "A leading suitor who treats the young host's new authority as a threat."}
  - {id: eurymachus, description: "A suitor who uses courteous questions to discover what has changed."}
  - {id: phemius, description: "A singer compelled to entertain the men occupying the household."}
  - {id: euryclea, description: "The older household woman who cared for Telemachus when he was small."}
