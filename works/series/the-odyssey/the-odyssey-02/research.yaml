notes:
  - "Chinese rework after f60bc6c: the complete zh-CN article and its independent audio script were newly phrased for native Chinese narration. English files and en-US metadata are unchanged. Public author remains Homer / 荷马, writer remains homer, and the existing classic reading-edition exception and compression boundaries remain in force. Current Chinese measurements and concrete editorial evidence are in the final section of audit.md."
  - "This pass retains the mother's encouraging messages, shroud deception, death curse, civic refusal, borrowed divine forms and oath exception. It corrects pronoun ambiguity about whose promises were insincere and avoids implying the suitors permanently lived in the house. No new dialogue episode, motive, historical assertion or media is introduced. Internal use of 百径灯 language_prompt does not change the published author or adopt its plot/fairness defaults. Laertes is consistently 拉厄尔忒斯 in the new Chinese."
  - "Exact local comparison source: git show 1208d108:works/series/the-odyssey/the-odyssey-02/locales/en-US/article.md, read in full for both locales. Butler is the consulted plot translator, not the writer of this English reading edition."
  - "User-authorized task exception to classic's verbatim-import default: a compressed HaiLibrary reading edition retains type classic and author Homer / 荷马, removes front matter and footnote numbering, and uses newly written native prose. This is neither an unabridged import nor a literal Chinese translation. Locale writer IDs remain homer; absent source_url/translator fields do not falsely identify new prose as an imported translation."
  - "Retained: Aegyptius's killed son and suitor son; Telemachus's appeal and tears; Antinous's accusation about encouraging messages and the three-year shroud trick exposed in year four; refusal to expel Penelope, repayment and Erinyes; explicit death curse; Zeus's eagles; Halitherses's twentieth-year prophecy; Eurymachus's death wish, fine and threat; requested ship and funeral alternatives; Mentor's curse on future rulers and rebuke to the inactive majority; Leiocritus's threat against a returning Odysseus; Athena as Mentor, same-day doom of the suitors and practical help; the son's promise to harm them; poison jokes and estate division; twelve jars and twenty measures; Euryclea's belief the father is dead and oath; Athena as Telemachus, Noemon's loan, induced sleep, loading, west wind and offerings."
  - "Compressed: remote speaker ancestries, comparisons with Tyro/Alcmena/Mycene, repeated accusations and appeals, exact compensation hypotheticals, storeroom treasure inventory, ship fastening details and extended sail imagery. The real Mentor at the meeting remains separate from Athena's later impersonation."
  - "Claim inventory: edition/attribution have documentary and independent cultural support. Disguise, sent eagles, Erinyes, prophecy and magically caused wind/sleep are declared myth; warnings remain speaker claims. Marriage coercion, revenge threats and property claims are retained narrative conduct. Ordinary weaving, preparation, concealment and boarding remain causal and consistent. No historical generalization, survival instruction or pharmacological claim is added."
  - "Deleted invented staff weight, loss of rehearsed words, look-back farewell and assertions that Euryclea watched loading. Both independent scripts follow their own final prose. No media changes."
