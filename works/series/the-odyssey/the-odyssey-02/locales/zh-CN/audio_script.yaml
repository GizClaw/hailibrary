audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    aegyptius:
      display_name: 埃古普提奥斯
      tts: {delivery: 诚恳而深思, timbre: 苍老沙哑, pace: 缓慢, pitch: 中低音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    penelope:
      display_name: 佩涅洛佩
      tts: {delivery: 深思而克制, timbre: 清晰温润, pace: 舒缓, pitch: 中音}
    halitherses:
      display_name: 哈利忒尔塞斯
      tts: {delivery: 坦诚而有分量, timbre: 苍劲略干, pace: 从容, pitch: 中低音}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: 圆滑自信, timbre: 圆润清楚, pace: 平稳, pitch: 中音}
    mentor:
      display_name: 门托尔
      tts: {delivery: 坚定直率, timbre: 沉厚成熟, pace: 稳健, pitch: 低音}
    leiocritus:
      display_name: 勒奥克里托斯
      tts: {delivery: 直硬强势, timbre: 粗厚清晰, pace: 较快, pitch: 中低音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    suitor_young:
      display_name: 年轻求婚人
      tts: {delivery: 轻慢地讥讽, timbre: 年轻明亮, pace: 较快, pitch: 中高音}
    suitor_other:
      display_name: 另一名求婚人
      tts: {delivery: 漫不经心而自信, timbre: 粗润, pace: 松缓, pitch: 中低音}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: 亲切直接, timbre: 温厚苍老, pace: 舒缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 久违的民众大会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            清晨的女儿、玫瑰指的黎明又出现了。忒勒马科斯起来穿好衣服，把凉鞋系在俊美的双脚上，肩上佩了剑，走出房间，像个不朽的神。他立刻让传令官去召集民众。呼声传开，大家都来了。他拿着长矛去会场，身边跟着两条猎犬。雅典娜让他的仪态俊美得如同神明，人们看着他经过，都十分惊叹。他要坐到父亲从前的位置上，连年纪最大的议事者也为他让了路。

            首先发言的是埃古普提奥斯。老人年纪很大，腰背弯得厉害，一生见过许多事。他有个儿子安提福斯，跟奥德修斯去了盛产好马的伊利昂。后来，他们一同被关进洞穴，残忍的独眼巨人杀了安提福斯，把他做成自己的最后一顿晚饭。老人还剩三个儿子，两个在家替他种地，一个叫欧律诺摩斯，也参加了求婚。可是，失去安提福斯的悲伤一直没过去。他开口时，还在流泪。
        - id: ch01-b02
          speaker: aegyptius
          text: |-
            伊萨卡的各位，听听我的话吧。奥德修斯走了以后，我们的议事者就没聚在一起开过会。今天是谁把大家叫来的？年轻人，还是老人？到底有什么急事？莫非听说军队要来了，想先通知我们？或者，还有别的要紧公事？我想，不管是谁，一定是个很好的人。愿宙斯成全他的心愿。
        - id: ch01-b03
          speaker: narrator
          text: |-
            忒勒马科斯觉得这是好兆头，马上站了起来。他满肚子的话，实在憋不住了。他走到人群中间，好心的传令官庇塞诺尔把权杖递过来。他接了，朝埃古普提奥斯说话。
        - id: ch01-b04
          speaker: telemachus
          text: |-
            老人家，是我召集大家的。我最有苦处，很快您就知道了。我没听说有军队要打来，也不是为了商量公事。我想说的是家里的两场灾难。第一场，父亲不在了。他是你们的首领，也是那么好的人，对你们人人都像父亲一样。第二场灾难还要大，眼看着就要毁掉我的家业。

            在座的头面人物，你们的儿子正缠着母亲，要她嫁人，不管她愿不愿意。他们为什么不去找伊卡里奥斯呢？让她父亲选中意的女婿，给女儿备出嫁的礼物，他们又不敢。却天天留在我家，杀我们的牛羊，杀肥山羊，办起大宴。喝掉多少酒，谁也不心疼。再多家产都经不起这样花。父亲已经不能替我们守住家门，我也拦不住他们。我一生都赶不上父亲，可真要有力量，我会保护自己。如今实在忍受不了了，这个家既遭羞辱，又要毁了。

            请你们顾顾良心，想想旁人怎么看，也要怕上天发怒啊。神要是看不下去，也会来惩罚你们。我求宙斯，也求那位主持议事始终的忒弥斯作证。朋友们，别什么都不做，留下我独自对付他们。难道父亲从前做了对不起阿开亚人的事，你们就帮着求婚人，报复我？真要吃光这个家，我倒宁愿是你们自己来吃。那我还可以去讨还，一户一户通知你们，直到赔足为止。现在，我连办法都没有。
        - id: ch01-b05
          speaker: narrator
          text: |-
            忒勒马科斯把权杖摔到地上，大哭起来。所有人都可怜他，可谁也没动，还是坐着，也没人敢生气地回斥他。安提诺奥斯却开了口。
        - id: ch01-b06
          speaker: antinous
          text: |-
            忒勒马科斯，你也太狂妄了！竟敢把错全推给我们。该怪的是你母亲，她多会骗人哪。这三年，眼看就要四年，她把我们弄得心神不定。人人都得到鼓励，都收到她传的话，可她一句也不是真心。还有另一件事，她在屋里支起大绣架，做起那么大一幅精细的织物。她当时对我们是这么说的。
        - id: ch01-b07
          speaker: penelope
          text: |-
            爱我的各位，奥德修斯确实死了，可别急着催我再嫁。等我把英雄拉厄尔忒斯的裹尸布织好吧，等死神来带他时，就能用上。我这针线本领，总得留点成绩，不能白费。他那样有钱，死后要是连裹尸布都没得盖，这里的女人会说闲话的。
        - id: ch01-b08
          speaker: antinous
          text: |-
            她这样一说，我们就答应等。白天，看她织那么大一块布，晚上，她却对着火把把线拆开。整整三年，我们没一个识破的。等到第四年，一个知情的女仆来告诉我们，我们才撞见她拆布。这下，她想也好，不想也好，总得把它织完。

            所以，我们的答复，你和阿开亚人都听明白。把母亲送回她父亲那里，让她嫁给两个人都愿意选的丈夫。她仗着雅典娜教会她那些本事，仗着脑子聪明，就这样摆架子，老折磨我们。再下去会出什么事，我不知道。堤罗、阿尔克墨涅、迈刻涅，那些从前出了名的女人，我们也听过，没有一个能比得上你母亲。可她用这种办法待我们，就是不公。

            上天让她生了这个心思，她一天不改，我们就一天继续吃掉你的家产。她又为什么要改呢？荣誉都是她的，花钱受损的可是你。她不从我们当中选一个嫁了，我们就不走。自己的田地是在伊萨卡，还是在别处，我们都不回去。
        - id: ch01-b09
          speaker: telemachus
          text: |-
            安提诺奥斯，她是生下我的母亲啊，我怎么能从父亲家里赶走她？父亲在外，究竟死了还是活着，谁知道？如果我非把她送回去不可，就得赔伊卡里奥斯很多钱。我担不起，他还会严厉对待我，上天也会惩罚我。母亲出门时会求复仇女神来报复。这也实在不光彩，我绝不做。

            你们若觉得不满意，就去别家吃喝，轮流作东，各出各的钱。还要在一个人家里白吃，那就求上天帮我，宙斯会让你们还清这笔账。你们会死在父亲的家里，谁也不会替你们报仇。
    - id: ch02
      title: 飞过头顶的鹰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            他说话的时候，宙斯从山上派来了两只鹰。它们顺风飞来，并排往前，威风极了。飞到会场正中上空，两只鹰开始转圈，翅膀拍打着空气，目光里的死亡直逼下面人们的眼睛。随后，它们互相扑击，猛烈撕抓，向右飞过城去。大家十分惊奇，你问我，我问你，不知道这表示什么。哈利忒尔塞斯最精通预言，也最懂这些征兆。他把心里的看法直截了当地说了出来。
        - id: ch02-b02
          speaker: halitherses
          text: |-
            伊萨卡的人们，听我一句。尤其是你们这些求婚人，灾难快来了。奥德修斯不会再在外面耽搁很久，他其实已经离得很近，会带来毁灭和死亡。不只求婚人，伊萨卡还有很多人也要遭难。我们趁早明白过来吧。在他到家以前，先阻止这些坏事。求婚人最好自己收手，这对你们有好处。

            我不是随口预言，我知道自己在说什么。当年奥德修斯跟阿尔戈斯人去特洛伊，我就说过，他会遭许多磨难，失去所有部下，到了第二十年才回家，回来时谁都认不出来。他经历的事，一样样都和我说过的相合。现在，剩下的也要应验了。
        - id: ch02-b03
          speaker: narrator
          text: |-
            波吕波斯的儿子欧律马科斯回答他。
        - id: ch02-b04
          speaker: eurymachus
          text: |-
            老头，还是回去给自家孩子预言吧。否则，他们可要更难过了。我懂这些征兆，比你还懂。大白天，哪里没有鸟儿飞？很少真有什么意思。奥德修斯早死在外乡，可惜你没跟着死，偏要在这里说这些，挑起忒勒马科斯的火气。他已经够愤怒的。你是想讨点赏钱带回家吧？

            我告诉你，事情一定会是这样。一个老人，本来该懂事，却去劝年轻人闹事，先倒霉的是那个年轻人。他什么也得不到，我们不会让他得逞。接下来，你也得受罚。我们会叫你交一大笔钱，让你舍不得掏，压得你受不了。

            忒勒马科斯，当着大家的面，我也警告你。让母亲回她父亲那儿去，请他给女儿找丈夫，该有的出嫁赠礼都备上。他那么疼女儿，当然要给。在那之前，我们继续求婚，你就别想清静。没有谁能吓倒我们，你说得再好也不管用，这老头的预言更没用。你爱说多少都行，我们只会更恨你。

            我们照样回去吃喝，花你的家产，一个钱也不赔。你母亲不再折磨我们，我们才停。她每天吊着我们，让人人都巴望着，彼此争夺这样一个出众的女人。有她这么一弄，我们连向别的女人求婚都办不到，不然，早就该娶妻了。
        - id: ch02-b05
          speaker: telemachus
          text: |-
            欧律马科斯，你们所有求婚人，我不再说，也不再请求了。天上的神和伊萨卡的百姓，都已经知道我的事。给我艘船，配二十名船员，让我往来吧。我要去斯巴达和皮洛斯，打听多年不见的父亲。也许有人能说点消息，也许神传来音信给我指路。世人常这样知道一件事。如果父亲活着，正往家赶，我再忍十二个月，任你们浪费些家产。要是他死了，我马上回来，郑重为他办葬礼，筑冢纪念，再让母亲改嫁。
        - id: ch02-b06
          speaker: narrator
          text: |-
            他坐下了，门托尔站起来。奥德修斯与他是朋友，临走前，把家里的一切托给他照管，也准许他全权管束仆人。门托尔坦诚地对大家说出了看法。
        - id: ch02-b07
          speaker: mentor
          emotion: angry
          text: |-
            伊萨卡人啊，愿你们再也碰不到宽厚的首领，再没有谁公平地治理你们。往后的首领，就让他们全都残酷、全都不讲道理吧！奥德修斯当年像父亲一样待你们，如今却没人记得他。

            求婚人还不至于让我这么生气。他们心肠坏，硬要动粗，拿性命打赌，赌奥德修斯不回来，所以才敢横着行事，吃他的家产。可你们怎么也一直坐着？看到这么不成样的事，连管都不愿管，我实在寒心。真想拦的话，你们人多，他们人少，难道拦不住？
        - id: ch02-b08
          speaker: narrator
          text: |-
            这时，欧厄诺尔的儿子勒奥克里托斯回话了。
        - id: ch02-b09
          speaker: leiocritus
          text: |-
            门托尔，尽说这些糊涂话干什么？还想叫百姓来拦我们？为吃饭的事，一个人和一群人打，哪有那么容易。哪怕奥德修斯回来了，看见我们在家里设宴，非要把我们赶出去，他妻子也高兴不了。她那么盼他，可他和这么多人斗，丢了命也只能怪自己。你刚才说的，全没道理。

            大家散了吧，该干什么干什么去。这男孩要上路，让门托尔、哈利忒尔塞斯这些父亲的老朋友去帮他。如果他真会走的话。我可不信。他多半还是待在这儿，等谁来告诉他一点消息。
        - id: ch02-b10
          speaker: narrator
          text: |-
            大会就这样被他结束了。人们各自回家，求婚人又去了奥德修斯家。
    - id: ch03
      title: 海边得到的帮助
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            忒勒马科斯独自走到海边，在灰色浪花中洗了双手，向雅典娜祷告。
        - id: ch03-b02
          speaker: telemachus
          text: |-
            昨天来过的神啊，请听我的话。您让我出海找父亲，他已经失踪太久了。我想照您说的去做，可阿开亚人拦着我，尤其是那些坏求婚人，他们不让我走。
        - id: ch03-b03
          speaker: narrator
          text: |-
            雅典娜就在他祈祷时来到身旁。这次，她看起来像门托尔，声音也像。
        - id: ch03-b04
          speaker: athena
          text: |-
            忒勒马科斯，如果你真有父亲的禀性，今后就不会糊涂，不会胆怯。奥德修斯说话一定算数，做事也总要做到底。你要像他，出海就不会白跑。可如果你身上没有奥德修斯和佩涅洛佩的血，我看成功的希望就不大。儿子能赶上父亲的很少，大多比不上，胜过的更少。幸好，你以后不会做傻事，也不会做胆小鬼，父亲那份判断的智慧，你也多少有一些。所以，我相信这件事还有希望。

            别去跟那些求婚人混在一起。他们又笨，又没德行。死亡就要来了，他们也不想一想，灾祸会让他们在同一天全都死去。你的出海不会再拖很久。我与你父亲相交多年，会帮你找船，也会亲自同去。

            现在先回家，到那些人中间，着手准备吃的。酒装罐子，活命要靠的大麦粉装皮袋，样样收拾妥当。我马上进城，找愿意同行的人。这里有许多船，新的旧的都有，我逐一看看，挑最好的那艘。船备好了，就赶快走。
        - id: ch03-b05
          speaker: narrator
          text: |-
            宙斯的女儿说完，忒勒马科斯马上照做。他心情不好地回到家，求婚人正在外院给山羊剥皮，给猪燎毛。安提诺奥斯走过来，笑着握住了他的手。
        - id: ch03-b06
          speaker: antinous
          text: |-
            忒勒马科斯，你可真好斗啊！别再记恨，别用话或行动来找麻烦。和从前一样，来跟我们吃喝吧。你要的，阿开亚人都会备齐。船给你，精挑的船员也给你。你可以马上去皮洛斯，问问高贵的父亲什么时候回来。
        - id: ch03-b07
          speaker: telemachus
          text: |-
            安提诺奥斯，有你们在，我哪还吃得安稳，高兴得起来？我小时候，你们已经糟蹋了那么多家产，还不够吗？现在我大了，懂的多了，力气也大了。不管我在伊萨卡的百姓中间，还是去了皮洛斯，我都会尽力叫你们吃苦。我一定要走，不会白走。这也多亏你们，让我没有船，没有船员，只能搭别人的船，当不了船长。
        - id: ch03-b08
          speaker: narrator
          text: |-
            他把手从安提诺奥斯手里猛地抽了出来。其他人一边在屋子周围准备饭菜，一边笑话他。一个年轻求婚人说了起来。
        - id: ch03-b09
          speaker: suitor_young
          text: |-
            忒勒马科斯打算杀我们呢。他准想去皮洛斯找朋友帮忙，或者去斯巴达，他不是非去不可吗？会不会再跑趟厄菲拉，弄点毒药，放进我们酒里，把我们都毒死？
        - id: ch03-b10
          speaker: suitor_other
          text: |-
            也许他一坐上船，就跟父亲一样，死在离朋友很远的地方。那可有事给我们做了，得把他的家产分一分。房子就不用分，给他母亲和她的新丈夫吧。
    - id: ch04
      title: 隐秘的准备与出航
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            他们这样说着，忒勒马科斯却去了下面的库房。库房又高又宽，父亲的金器和铜器堆在地上。敞开的箱子里放着亚麻布，还有备用衣服。香喷喷的橄榄油也存放在这里。沿墙摆了一桶桶陈酒，都已酿得醇熟，没掺水，连神也配享用。这些酒是为奥德修斯留的，万一他还能回来，就可以喝。库房有牢固的两扇门，从中间打开。老管家欧律克勒娅是奥普斯的女儿、庇塞诺尔的孙女，白天黑夜都忠心照看着这些东西。忒勒马科斯把她叫来。
        - id: ch04-b02
          speaker: telemachus
          text: |-
            奶妈，请给我装些好酒。父亲那份最好的先留着，可怜的父亲万一躲过死亡，终于回家，还要喝的。给我装剩下最好的，要十二罐，每罐都得有盖子。再拿缝好的结实皮袋，装大麦粉，大约二十量。马上放在一起，谁都别告诉。晚上母亲上楼睡了，我再来拿。我要去斯巴达和皮洛斯，打听亲爱的父亲有没有归来的消息。
        - id: ch04-b03
          speaker: narrator
          text: |-
            欧律克勒娅听见了，哭了起来。她疼爱地对他说话。
        - id: ch04-b04
          speaker: euryclea
          emotion: sad
          text: |-
            好孩子，你怎么想到这种事？你还想去哪里啊？家里唯一的盼头就是你。父亲已经死在外头，连地方都不知道。你一离开，这帮坏人就会谋算杀你，再分你的财产。别走了，留在自己人身边吧。别去荒凉的大海漂流，让操心受苦耗尽了你的性命。
        - id: ch04-b05
          speaker: telemachus
          text: |-
            放心，奶妈，上天准许我这么做。你要答应我，发个誓，别跟母亲说。等我走后十天或者十二天再告诉她，除非她听说我不在，自己来问。我不想她哭坏了，损伤美貌。
        - id: ch04-b06
          speaker: narrator
          text: |-
            老妇人郑重地发了誓。发完誓，她就给罐子装酒，给皮袋装大麦粉。忒勒马科斯回到求婚人那边。

            雅典娜又去办另一件事。她化成忒勒马科斯，在城中挨个找船员，通知他们太阳落山时到船边来。她找到弗洛尼奥斯的儿子诺厄蒙，问他借船，他很乐意。等太阳落下，天完全黑了，女神把船送下水，放上出航该有的全部船具，停在港口的尽头。船员陆续到了，她一个个地给他们打气。

            然后她回到奥德修斯家，浓浓的困意压住了那些求婚人。她让酒意冲昏他们的脑袋，杯子都从手里落下。他们不再恋着酒席，拖着沉重的眼皮，昏昏沉沉地回城睡觉去。女神又变回门托尔的样子，用他的声音叫忒勒马科斯出来。
        - id: ch04-b07
          speaker: athena
          text: |-
            忒勒马科斯，大家已经上船，坐在桨边等你发令了。赶紧来，我们该走了。
        - id: ch04-b08
          speaker: narrator
          text: |-
            她带路，忒勒马科斯跟着。到了船边，看见船员在水旁等候，他便招呼大家。
        - id: ch04-b09
          speaker: telemachus
          text: |-
            各位，帮我把补给搬上船吧。全都放在回廊那儿了。母亲还不知道，女仆也只有一个知情。
        - id: ch04-b10
          speaker: narrator
          text: |-
            忒勒马科斯领着大家回去，众人跟上，把东西依照他的吩咐搬来。随后雅典娜先上船，坐在船尾，他也登船，坐到她旁边。船员松开缆绳，各自在长凳上就位。雅典娜送来西方的顺风，吹过深蓝海浪，呼呼作响。忒勒马科斯让他们抓好绳索，升起帆。他们照做，把桅杆插进横梁上的桅座，立好，用前面的支索拉紧，再用绞拧成的牛皮绳把白帆拉上去。风吹鼓白帆，船在深蓝的水面飞驰，船首的浪沫一路嘶嘶作声。众人把船上的东西全系牢，往调酒缸倒满酒，向那些自古就长生不死的神奠酒，尤其敬那位灰眼睛的女神，宙斯的女儿。

            船一路向前，穿过夜里的一个个时辰，从天黑驶到了黎明。
