audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: 圆滑自信, timbre: 圆润清楚, pace: 平稳, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: 亲切直接, timbre: 温厚苍老, pace: 舒缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 没有人帮他
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            一早，忒勒马科斯就让传令官召集大家。父亲走后，伊萨卡再没开过大会。他拿着矛，带两条狗进了会场。雅典娜让他显得格外有神采，连老人都给他让座，请他坐在父亲原来的地方。

            先说话的是埃古普提奥斯。他一个儿子跟奥德修斯打仗，后来让独眼巨人吃了，他一直伤心。另一个儿子却成了求婚人。老人问，是有敌人来，还是出了什么大事，怎么今天要把大家叫来？青年接过传令官的手杖。
        - id: ch01-b02
          speaker: telemachus
          text: |
            今天召集大家的是我。没有敌人打来，遭难的是我的家。父亲还没消息，他们又来逼母亲嫁人。提亲本该去她父亲那里，他们却天天到我家来，宰我的牲畜，喝我的酒，吃得产业都快空了。我挡不住。父亲怎样管这个家，你们都见过，就能看着他儿子挨欺负吗？这么多损失，叫我向谁讨？
        - id: ch01-b03
          speaker: narrator
          text: |
            他把手杖摔下，哭了。大家可怜他，可谁都没出来帮忙。安提诺奥斯反而要怪他母亲。
        - id: ch01-b04
          speaker: antinous
          text: |
            这还能怪我们？你母亲挨个传话，让每个人都觉得有机会，可她根本不当真。那件寿衣也是她骗人用的，你总知道吧？
        - id: ch01-b05
          speaker: narrator
          text: |
            佩涅洛佩说过，得先给拉厄尔忒斯织好寿衣，才能考虑嫁人。不然老人死后没布裹身，会惹人议论。求婚人答应等。她白天织，夜里点着灯又拆开。三年都瞒住了。第四年，一个女仆告密，他们撞见她拆线，才逼她做完。
        - id: ch01-b06
          speaker: antinous
          text: |
            送她回娘家，叫她选个人。选不出来，我们就不走。大家夸她聪明，赔家产的可不是她，是你。
        - id: ch01-b07
          speaker: telemachus
          text: |
            她生我、养我，我怎么能赶她离开父亲的家？何况父亲还不知是死是活。外祖父会要我赔偿，母亲会求复仇女神来罚我，其他神也不会放过我。这种丑事，我绝不肯做。你们想摆宴席，就轮流在自己家里摆，花自己的钱。若非要吃空我这一家，我就求宙斯，让你们全死在父亲的屋里，连替你们报仇的人都没有。
        - id: ch01-b08
          speaker: narrator
          text: |
            宙斯派来的两只鹰并肩飞到会上，转着圈互相抓啄，又向右飞过城镇。哈利忒尔塞斯会看鸟兆，他警告众人，奥德修斯快到家了。求婚人会被杀，还有许多伊萨卡人也要丧命。当年出征时，他就说过，奥德修斯的同伴会一个不剩，他要吃尽苦头，到第二十年才回来，而且没人认得。欧律马科斯偏不听。
        - id: ch01-b09
          speaker: eurymachus
          text: |
            天上哪天没有鸟？还能只只都算预兆！奥德修斯早已没命了，你跟他一块死了才好。你这样撺掇孩子，不就是想捞点好处？再敢胡说，你就等着受重罚，忒勒马科斯也别想好过。谁来我们都不怕，你的预言更吓不住人。他母亲不选丈夫，我们就继续吃，赔偿的钱，你们一分也别想拿到。
        - id: ch01-b10
          speaker: narrator
          text: |
            青年不再求了。百姓和神都听过他的遭遇。他现在只要船和二十个人，去皮洛斯、斯巴达打听父亲。父亲若在回家，他肯再忍一年。若死了，他就回来筑坟祭奠，再安排母亲再嫁。
            门托尔是父亲的老友。他责问众人，奥德修斯的恩情难道全忘了？既然这样，就让以后做主的人都凶恶不公。他更怪那些旁观者，人比求婚人多，竟还看着一家人受害。
            勒奥克里托斯却说，奥德修斯回来也打不过他们，妻子没来得及高兴，他就得死。他叫大家散去，要出海就让几个老友替青年安排。

            大会散了。求婚人又回奥德修斯家吃喝，其余的人各回各家。
    - id: ch02
      title: 船和粮酒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            忒勒马科斯一个人走到海边，在海水里洗过手，便向昨天见过的神求助。
        - id: ch02-b02
          speaker: telemachus
          text: |
            你叫我去找父亲，可那些人不让我走。我该怎么办？
        - id: ch02-b03
          speaker: narrator
          text: |
            雅典娜来到身边，变成门托尔，借他的声音回答。
        - id: ch02-b04
          speaker: athena
          text: |
            你父亲有的勇气，你也得拿出来。他说了就做，事情从不会干一半就丢下。别再跟那些求婚人混了。他们还蒙在鼓里，不知道自己会在同一天死去。找船、找人，我来办，我也会陪你走。你回家准备酒和粮食吧。
        - id: ch02-b05
          speaker: narrator
          text: |
            回到院子，安提诺奥斯笑着拉他的手，请他别生气，一起吃喝，还说船员和船都会替他安排。青年一下把手抽了回来。
        - id: ch02-b06
          speaker: telemachus
          text: |
            从前我年纪小，不懂事，你们把我的东西糟蹋了多少！如今我长大了，力气也有了。我留在这里也好，去皮洛斯也好，都得想办法报复你们。就算没有自己的船，没有自己的船员，我也要走。你们别指望我再陪着高兴！
        - id: ch02-b07
          speaker: narrator
          text: |
            求婚人还在嘲笑，有人猜他去找外乡的救兵，有人猜他想弄毒药回来，倒进他们的酒。也有人巴不得他跟父亲一样，一去不回，这样他们就能瓜分家产。
            忒勒马科斯进了库房，找到掌管粮酒的欧律克勒娅。父亲那份最好的酒要留下，另外替他装十二坛，每坛都盖好，大麦粉也备二十份。他要去皮洛斯、斯巴达打听消息，等母亲上楼睡下，便把粮酒取走。
            老妇人哭着劝他留下。她认定父亲已死在异乡，家里只剩他一个指望，不能再去海上冒险。他一走，求婚人还可能杀他，抢走产业。
        - id: ch02-b08
          speaker: telemachus
          text: |
            放心，是神叫我去的。你替我起个誓，先瞒母亲十天或者十二天。要是她自己听说了，提前来问，那就告诉她。我怕她又哭得憔悴。
        - id: ch02-b09
          speaker: narrator
          text: |
            乳母发誓保密，动手装酒备粮。青年又回到那些人当中。
    - id: ch03
      title: 连夜出港
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            雅典娜变成忒勒马科斯，去城里招人，还向诺厄蒙借了船，让大家日落到港口。天黑，器具已经备齐，船员也来了。
            她回家里让求婚人犯困，困得酒杯都拿不住，纷纷回去睡。等他们走了，女神又变成门托尔来叫青年。
        - id: ch03-b02
          speaker: athena
          text: |
            走吧，人都在船边等你。
        - id: ch03-b03
          speaker: narrator
          text: |
            到港口后，青年带船员去搬粮酒，装上船。母亲不知道，女仆里也只有乳母知情。他在船尾坐到女神身旁。船员解开缆绳，坐到各自的位置，雅典娜便送来了西风。青年叫他们升帆，白帆一鼓，船就劈开深蓝的水，船头两旁响着浪沫声。大家向神献酒，特别感谢雅典娜。

            他们就这么向前航行，穿过一夜的黑暗，直到天明。
