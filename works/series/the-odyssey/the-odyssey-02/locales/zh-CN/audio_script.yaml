audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 用平实的话从容讲述古老史诗, timbre: 温暖清晰, pace: 舒缓而有变化, pitch: 中音}
    telemachus:
      display_name: 忒勒马科斯
      tts: {delivery: 坦率年轻, timbre: 清朗略带稚气, pace: 自然而有果断的停顿, pitch: 中音}
    antinous:
      display_name: 安提诺奥斯
      tts: {delivery: 强硬傲慢, timbre: 厚实而有棱角, pace: 较快, pitch: 中低音}
    eurymachus:
      display_name: 欧律马科斯
      tts: {delivery: 圆滑自信, timbre: 圆润清楚, pace: 平稳, pitch: 中音}
    athena:
      display_name: 雅典娜
      tts: {delivery: 笃定敏锐, timbre: 清亮坚定, pace: 稳健, pitch: 中音}
    euryclea:
      display_name: 欧律克勒娅
      tts: {delivery: 亲切直接, timbre: 温厚苍老, pace: 舒缓, pitch: 中音}
  chapters:
    - id: ch01
      title: 谁肯站起来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            天亮后，忒勒马科斯就叫传令官去召集大家。他带着铜矛和两条狗，来到父亲当年坐的地方。雅典娜让他显得格外出众，连老人们也给他让了座。
            自从奥德修斯出海，伊萨卡还没开过大会。埃古普提奥斯老人问，是不是敌人来了。他一个儿子跟着奥德修斯走，后来让独眼巨人吃了，他一直伤心。另一个儿子却是求婚人。青年这时接过传令官递来的手杖。
        - id: ch01-b02
          speaker: telemachus
          text: |
            没有敌人要来。我叫大家来，是因为家产快让人吃光了。
        - id: ch01-b03
          speaker: narrator
          text: |
            他看见座中有求婚人的父辈，便一件件说起家里的事。宴席没完没了，牲畜不停被杀，母亲又被逼着嫁人。那些人不去她娘家谈，只在这里享受。父亲失踪，再没人能拦他们。
        - id: ch01-b04
          speaker: telemachus
          text: |
            这些损失，我找谁要？你们看得清清楚楚，就不能替我说句话？
        - id: ch01-b05
          speaker: narrator
          text: |
            他扔下手杖哭了。大家同情他，却不开口。安提诺奥斯反而责怪佩涅洛佩。她给每个人传话、给希望，却不当真，还用寿衣骗他们。
            那是给年老的拉厄尔忒斯准备的寿衣。她答应织好再挑丈夫，白天便坐着织，夜里点上灯，又把线拆开。三年就这么过去。到第四年，知道内情的女仆告诉了求婚人，他们捉住她拆线，逼她把布织完。
        - id: ch01-b06
          speaker: antinous
          text: |
            让她回娘家，选个丈夫吧。她不选，我们就不走。人人赞她聪明，损失的却是你的产业。
        - id: ch01-b07
          speaker: telemachus
          text: |
            你是叫我把自己的母亲赶出门？
        - id: ch01-b08
          speaker: narrator
          text: |
            父亲还不知是死是活，他怎么能赶走生养自己的母亲？外祖父会要他赔偿，母亲会叫复仇女神来，诸神也会罚他。这既不义，又坏名声，他绝不做。
        - id: ch01-b09
          speaker: telemachus
          text: |
            回你们自己家吃喝去。还赖着吃空我们一家，我就求宙斯，让你们全死在父亲的屋里，没人替你们报仇。
        - id: ch01-b10
          speaker: narrator
          text: |
            宙斯派来的两只鹰，在众人上空转着，忽然伸爪相斗，又往右边飞过城镇。哈利忒尔塞斯起身说起这个鸟兆。
            他警告大家，奥德修斯快回来了，要杀求婚人，还会杀死许多伊萨卡人。他早就预言过，奥德修斯会失去同伴，受尽苦难，到第二十年才回来，没人认得。欧律马科斯冷笑着反驳。
        - id: ch01-b11
          speaker: eurymachus
          text: |
            鸟天天在天上飞。怎么一飞过来，我们就得听你的？
        - id: ch01-b12
          speaker: narrator
          text: |
            他咒老人像奥德修斯那样死掉，还说老人是想从青年手里骗钱，再不闭嘴，就重重罚他，让青年也更不好过。他们不怕人，也不信预言，佩涅洛佩不作决定，他们就照吃不付钱。忒勒马科斯换了个请求，要船和二十个船员。他得去皮洛斯、斯巴达问消息。若父亲正在归途，他可以再等一年。若已经死了，就回岛祭奠、立墓，再安排母亲的婚事。
            门托尔是父亲的老朋友。他咒往后的统治者都凶恶不公，因为大家把仁厚的奥德修斯全忘了。他尤其怪旁观者，人比求婚人多，还看着这一家受害。勒奥克里托斯说，就算奥德修斯回来，也会被他们杀死，妻子来不及高兴又得失去他。他让大家散去，几个老人要帮出海，就自己安排。

            人们就这么散了。旁人回了自己的家，求婚人又走向奥德修斯的房子。
    - id: ch02
      title: 库房里的约定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            青年独自走到海边，洗了手，向昨天来过的神求助。他按嘱咐当众开了口，可开完会，还是没有船。
        - id: ch02-b02
          speaker: telemachus
          text: |
            现在怎么办？我还是走不成啊。
        - id: ch02-b03
          speaker: narrator
          text: |
            雅典娜来到旁边，顶着门托尔的模样，用他的声音回答。这一次，父亲的老友是女神变的。
        - id: ch02-b04
          speaker: athena
          text: |
            我去安排船和人。你回家准备吃的，还有酒。这趟我跟你去。
        - id: ch02-b05
          speaker: narrator
          text: |
            她叫青年拿出父亲的勇气，别跟求婚人混在一起。那些人放纵胡来，没想过就快死了，而且会死在同一天。父亲从来不会半途丢下事情，儿子也得做下去。青年于是回家。
            安提诺奥斯笑着抓住他的手，请他吃喝，还说船和人都会有人张罗。刚才那番争执，好像已经过去了。青年甩开他的手。
        - id: ch02-b06
          speaker: telemachus
          text: |
            我小时候，你们就花我的家产。现在我长大了，懂了，也更有力气了。我会尽力害你们，不管在这里，还是去皮洛斯。我没有自己的船和船员，也照样要走。谁还想跟你们吃喝高兴？
        - id: ch02-b07
          speaker: narrator
          text: |
            后面的人开始笑。有的猜他出门搬救兵，有的说他要弄毒药，也有人盼他一去不回，他们好分家产。他不再回嘴，直接去了库房。
            欧律克勒娅管着库房，有些酒是专门存着等奥德修斯的。青年叫她留下父亲那份最好的，另装十二坛，加上盖，再备二十份大麦粉。他说了自己要去皮洛斯、斯巴达，还说等母亲上楼，就来搬。
            老妇人哭着劝他。她认为父亲已死在异乡，家里只剩儿子这个指望，何必再去海上冒险？他一走，那些人就可能杀他，分掉产业。青年小声答话。
        - id: ch02-b08
          speaker: telemachus
          text: |
            有人会照看我的。先替我瞒着母亲十天或十二天，好吗？如果她自己发觉了，问起来，你就告诉她。
        - id: ch02-b09
          speaker: narrator
          text: |
            他不想让母亲哭坏了容颜。欧律克勒娅起誓保密，开始装酒备粮。青年又回到求婚人中间。
    - id: ch03
      title: 夜里升起的帆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            城里，另一个忒勒马科斯正在招人。那是雅典娜借了他的模样，把肯出海的人一一召集好，又向诺厄蒙借来船，叫他们日落到港口碰面。天黑时，船上该有的器具也备妥了。
            女神回到大厅，让求婚人困得连杯子都拿不住。他们这才散去，要回自家睡觉。她又换成门托尔的样子，来叫青年。
        - id: ch03-b02
          speaker: athena
          text: |
            该动身了，船员都等着呢。
        - id: ch03-b03
          speaker: narrator
          text: |
            到了海边，青年带船员回去取粮酒，装到船上。母亲还不知道。家里的女仆中，只有欧律克勒娅帮着准备了。
            他和女神坐在船尾。船员松开缆绳，把桨伸进海里。雅典娜送来的西风吹到了，青年吩咐大家升帆。白帆吃满了风，船向前驶去，劈开暗蓝色的海水。他们向诸神献酒，尤其感谢一路相助的雅典娜。

            船不停往前，驶过了整个夜晚，直到天亮。
