  chapters:
    - id: ch01
      title: The unanswered appeal
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |
            At dawn, Telemachus told the heralds to call a meeting. Ithaca hadn't held one since his father left.
            He came with his spear and two dogs. Athena gave him such a striking appearance that the elders moved aside for him to take his father's seat. Old Aegyptius asked if an enemy was coming. The Cyclops had eaten one of his sons, who'd sailed with Odysseus. Another son had joined the suitors. The old man still mourned the one he'd lost. Now the herald gave Telemachus the staff for speaking.
        - id: ch01-b02
          speaker: telemachus
          text: |
            No, there's no army coming. I need help with what's happening at home.
        - id: ch01-b03
          speaker: narrator
          text: |
            He described the animals killed for the feasts, the wine disappearing from the stores, and the pressure on his mother to marry. Some of these listeners were related to the men responsible. He'd come to them because he wanted them to act.
        - id: ch01-b04
          speaker: telemachus
          text: |
            You all knew my father. Are you going to let them take everything he left us?
        - id: ch01-b05
          speaker: narrator
          text: |
            He flung the staff down and cried. Everyone felt sorry for him. Nobody spoke, until Antinous got up.
        - id: ch01-b06
          speaker: antinous
          text: |
            It's your mother you should be asking. She's the one who's kept us here.
        - id: ch01-b07
          speaker: narrator
          text: |
            He said she'd sent each man encouraging messages without meaning them. She'd also asked them to wait while she wove a burial cloth for Laertes. Every day she worked. At night, by torchlight, she undid the work. Three years passed without discovery. In the fourth, a woman told them, and they caught her pulling out the threads.
        - id: ch01-b08
          speaker: antinous
          text: |
            She's finished it now. Send her to her father and have her choose a husband. Until she does, we'll eat what belongs to you. People praise her cleverness, but you're the one losing your property.
        - id: ch01-b09
          speaker: narrator
          text: |
            To get them out, Antinous wanted him to throw his mother out first.
        - id: ch01-b10
          speaker: telemachus
          text: |
            She isn't leaving this house on my orders.
        - id: ch01-b11
          speaker: narrator
          text: |
            Her father would demand compensation. His mother would call the avenging Erinyes against him, and the gods would punish him. Throwing her out would disgrace him. They didn't even know whether her husband was dead.
        - id: ch01-b12
          speaker: telemachus
          text: |
            Eat in your own houses. If you won't leave mine, may Zeus let you die there with no one to avenge you.
        - id: ch01-b13
          speaker: narrator
          text: |
            Zeus sent two eagles. They wheeled above the crowd and fought with their claws, then flew across the town. Halitherses understood bird signs. He warned them to stop. Long ago, he'd foretold that Odysseus would lose his companions and return unrecognized in the twentieth year. Now he said Odysseus was coming to kill the suitors, and many other Ithacans too. Eurymachus answered him.
        - id: ch01-b14
          speaker: eurymachus
          text: |
            Birds fly past all the time. Are we supposed to be frightened whenever one appears?
        - id: ch01-b15
          speaker: narrator
          text: |
            He wished Halitherses dead with Odysseus. He accused him of wanting a reward, threatened him with a heavy fine, and said Telemachus would suffer more as well. They feared nobody, and no prophecy. Until Penelope married, they'd keep eating without paying. Telemachus said the gods and the people had heard him. He would beg no more.
        - id: ch01-b16
          speaker: telemachus
          text: |
            Will you at least help me look for news? Let me take twenty men in a ship to Nestor in Pylos, and then to Menelaus in Sparta. I want to hear what they know.
        - id: ch01-b17
          speaker: narrator
          text: |
            If Odysseus was returning, he could wait another year. If his father was dead, he would come back to honor him, build a memorial and arrange his mother's marriage. They needed something more than rumors.
            Mentor, Odysseus's old friend, supported him. May future rulers be cruel and unjust, he said, since they had forgotten their kind king. He blamed the crowd most. They outnumbered the suitors. Why let them carry on? Leiocritus said Odysseus himself wouldn't survive fighting so many. He sent everyone home. The old friends could arrange the voyage, if the boy ever left.
            And people left. Men who'd felt sorry for Telemachus went home without helping. The suitors headed for his house.
    - id: ch02
      title: The stores for a voyage
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |
            Telemachus went down to the sea alone. He washed his hands, lifted them, and prayed to the god who'd visited him.
        - id: ch02-b02
          speaker: telemachus
          text: |
            I called the meeting. I told them. But it's all the same as before. How can I get away?
        - id: ch02-b03
          speaker: narrator
          text: |
            Mentor seemed to be standing beside him. But now it was Athena wearing the old man's face.
        - id: ch02-b04
          speaker: athena
          text: |
            I'll get the ship and the crew. Have our food and wine ready. I'm coming with you.
        - id: ch02-b05
          speaker: narrator
          text: |
            She encouraged him to show his father's courage and stay clear of the suitors. They never considered the death that was coming. All would die on one day. His father hadn't left work unfinished. Telemachus went home.
            Antinous laughed and took his hand. He offered dinner and wine, saying the voyage could be arranged. Telemachus snatched his hand away.
        - id: ch02-b06
          speaker: telemachus
          text: |
            You wasted my property when I was little. I understand it now, and I'm stronger. Here or in Pylos, I'll hurt you every way I can. I haven't a ship or crew of my own, but I'm still going. Don't ask me to enjoy your company.
        - id: ch02-b07
          speaker: narrator
          text: |
            As he walked away, the others joked that he'd come back with an army, or poison for their wine. Perhaps he'd disappear like his father. Then they could share out his property. He didn't turn back.
            In the storeroom, Euryclea guarded wine saved for Odysseus. Telemachus told her to leave his father's best wine alone. He wanted twelve jars with lids, and twenty measures of barley meal. He told her where he was going, and said he'd take the stores when his mother went upstairs.
            She wept. His father was dead somewhere abroad, she believed. He was their last hope, and now he wanted to risk the sea. Once he left, the suitors might kill him and take everything.
        - id: ch02-b08
          speaker: telemachus
          text: |
            Someone is helping me, though you can't see it. Please keep it from Mother for ten or twelve days. If she learns I've gone and questions you, then tell her.
        - id: ch02-b09
          speaker: narrator
          text: |
            He didn't want his mother's tears to spoil her beauty. Euryclea swore to say nothing, then filled the jars and readied the meal. He went back to the suitors.
    - id: ch03
      title: The waiting crew
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |
            In town, Athena had become the image of Telemachus. Everyone she asked to join the crew thought it was him asking. Noemon lent her a ship without hesitation. By sundown the men had their meeting place, and the ship was ready in the harbor.
            Then Athena returned to the house and made the suitors sleepy over their wine. They couldn't hold their cups. Instead of staying on, they wanted their beds. Once they'd left, she appeared to Telemachus as Mentor.
        - id: ch03-b02
          speaker: athena
          text: |
            Come along. Your crew is waiting.
        - id: ch03-b03
          speaker: narrator
          text: |
            They went to the water, where the crew waited. Telemachus led them back for the stores, then had everything loaded. His mother didn't know. Euryclea was the only woman in the house who'd helped with the preparations.
            Athena sat in the stern, with Telemachus next to her. They cast off and took their places at the oars. The goddess brought a west wind. At Telemachus's order, the men raised the sail. Wind filled it, and the water slipped faster past the hull. They poured offerings to the gods, giving special thanks to Athena.

            They sailed on through the night, all the way to dawn.
