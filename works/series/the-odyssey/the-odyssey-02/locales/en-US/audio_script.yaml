  chapters:
    - id: ch01
      title: A meeting at last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Morning's child, rosy-fingered Dawn, appeared. Telemachus got out of bed and dressed. He fastened sandals on his handsome feet, slung his sword over his shoulder, and stepped out of his room looking like an immortal god. At once he sent the heralds to summon an assembly. They called, and the people gathered. Then he took his spear and went to meet them, with his two hounds beside him. Minerva gave him a beauty and presence like a god's. Everyone marveled as he passed. Even the oldest councillors moved aside when he came to sit in his father's place.

            The first man to speak was Aegyptius. He was so old that his back was bent almost double, and his long life had given him a wealth of experience. His son Antiphus had sailed with Ulysses to Ilius, the country of fine horses. Later, when the men were all shut inside the cave, the savage Cyclops killed Antiphus and cooked him for his last evening meal. Aegyptius had three other sons still living. Two worked the land that belonged to their father. The third, Eurynomus, had joined the suitors. But none of that eased the old man's grief for Antiphus. He had never recovered from losing him, and tears were still falling as he began to speak.
        - id: ch01-b02
          speaker: aegyptius
          text: |-
            People of Ithaca, listen to me. Our councillors have not met once since Ulysses sailed away. Who has called us here today? Is he young or old? What is so urgent? Has he heard that an army is approaching, and come to warn us? Or has he some other public matter to discuss? Whoever he is, I am sure he is a good man. May Jove give him what he longs for.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Telemachus took those words as a good omen. He got to his feet at once. Everything he wanted to say was almost bursting out of him. He stood right in the middle of the assembly. The good herald Pisenor brought the staff and placed it in his hand. Telemachus turned toward Aegyptius to answer him.
        - id: ch01-b04
          speaker: telemachus
          text: |-
            Sir, you will soon understand why I called you here. No one has more cause for complaint than I have. I have heard of no army coming to attack us. I have no public business to lay before you. This is about my own family and the two terrible things that have happened to us. First, I have lost my good father. He was your leader, and he cared for every one of you like a father. The second trouble is worse still. Before long it will destroy everything I own.

            The sons of your leading men keep demanding that my mother marry them, though she does not want to. They dare not visit her father Icarius and ask him to choose the husband he likes, and arrange his daughter's wedding gifts. Instead, they stay at my father's house day after day. They slaughter our cattle, sheep and fat goats for their feasts. They never stop to think how much wine they are drinking. No household could survive such waste. Ulysses is no longer here to keep harm from our doors, and I am not strong enough to resist them. I will never be the man he was. But if I had the strength, I would defend myself. I cannot bear it any longer. They are shaming my house and destroying it.

            Think of your consciences. Think what other people will say. Fear the anger of heaven too. The gods may be offended and turn against you. In the name of Jove, and of Themis who rules our councils from beginning to end, I beg you, my friends, do not leave me to stand alone. Unless my brave father wronged the Achaeans somehow, and you are helping these men to punish me for it. If someone must eat away everything I own, I would rather you ate it yourselves. Then I could demand repayment. I could go from house to house serving notice until you paid the whole debt. As things are, I have no way to help myself.
        - id: ch01-b05
          speaker: narrator
          text: |-
            With those last words, Telemachus hurled the staff hard against the ground and broke down in tears. The people watching him were full of pity. Still, they remained seated without saying anything. Not one of them dared to give him an angry reply. Antinous alone was willing to answer him that way.
        - id: ch01-b06
          speaker: antinous
          text: |-
            Telemachus, you arrogant young boaster. How dare you blame us for all this? Your mother is responsible. She is a cunning woman. For three years now, nearly four, she has been driving us mad. She gives each man encouragement, sends him messages, and never means a word of what she says. Then there was the other trick she played on us. In her own room she put up a great embroidery frame. On it she began an enormous piece of delicate needlework. Here is what she said when she asked us to wait.
        - id: ch01-b07
          speaker: penelope
          text: |-
            My dear suitors, Ulysses is dead, but please do not hurry me into another marriage yet. Let me finish this burial cloth for the hero Laertes. I want something to show for my skill with the needle. The cloth must be ready for the day death takes him. He is a rich man. If he were laid out without a shroud, the women here would talk about it.
        - id: ch01-b08
          speaker: antinous
          text: |-
            That was her request, and we agreed. We watched her weaving that enormous cloth through the day. But at night she unpicked it by torchlight. For three years she deceived us, and we never discovered it. Then, in the fourth year, a maid who knew her secret told us. We caught her undoing the work. After that she had to finish, whether she wanted to or not.

            So here is our answer. You and every Achaean here must understand it. Send your mother back to her father, and tell her to marry someone they both choose. If she keeps tormenting us with her cleverness, I cannot say what will happen. She makes so much of the skills Minerva gave her. We have never heard of another woman like this. We know the stories of Tyro, Alcmena and Mycene, and all the famous women of the past. None was a match for your mother. But she had no right to treat us as she did.

            As long as she keeps this plan heaven has put into her head, we shall keep eating your property. Why should she change it? She wins all the honor and praise. You pay for it, not her. Understand this clearly. We are not going back to our lands, here or anywhere else, until she chooses one of us and marries him.
        - id: ch01-b09
          speaker: telemachus
          text: |-
            Antinous, she gave birth to me. How could I drive her from my father's house? He is still somewhere abroad, alive or dead, we do not know. If I force her to return, I must pay her father Icarius a great deal of money. That alone would be hard enough. He would treat me harshly, and heaven would punish me as well. On leaving, my mother would call upon the Erinyes to avenge her. It would disgrace me too. I will have nothing to do with it.

            If you dislike my answer, leave us. Take turns feasting in one another's houses, and pay for your own food. If you insist on living off one man's wealth, then may heaven help me. Jove will make you repay it all. You will die in my father's house, and nobody will avenge your deaths.
    - id: ch02
      title: Eagles over the assembly
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Telemachus was still speaking when Jove sent two eagles down from the top of the mountain. The wind carried them steadily onward. They glided beside one another with the ease of creatures that ruled the sky. Directly above the middle of the assembly they began to wheel around, beating the air with their wings and glaring death into the eyes below. Then they attacked each other fiercely. They tore at one another as they turned to the right and flew over the town. The people watched in amazement, asking one another what the sight could mean. Halitherses knew more about prophecy and the reading of omens than anyone there. He gave them his interpretation plainly and honestly.
        - id: ch02-b02
          speaker: halitherses
          text: |-
            Hear me, people of Ithaca. These words are especially for the suitors. I see disaster ahead of them. Ulysses will not be away much longer. He is already close, bringing death and destruction. And it will not strike the suitors alone. Many others here in Ithaca will suffer too. We must act wisely while there is time. Stop this wickedness before he arrives. The suitors had better stop of their own free will. That would be best for them.

            I know what I am saying. When the Argives sailed to Troy and Ulysses went with them, I foretold what would happen to him. He would suffer greatly. He would lose every one of his men. Then, in the twentieth year, he would return, and no one would recognize him. Everything has happened as I said. Now the rest is coming true.
        - id: ch02-b03
          speaker: narrator
          text: |-
            Eurymachus, the son of Polybus, answered.
        - id: ch02-b04
          speaker: eurymachus
          text: |-
            Go home, old man. Tell the future to your own children, or you may make things worse for them. I can read these signs better than you. Birds fly about in the daylight all the time. Usually it means nothing. Ulysses is dead in some distant country. You should have died with him, instead of chattering about omens and stirring up Telemachus. He is angry enough already. I suppose you expect him to reward you with something for your family.

            Let me tell you what really will happen. An old man ought to know better. If he talks a young fellow into making trouble, that young fellow will suffer more for it. He will gain nothing, because we suitors will stop him. Then we will fine you, old man, more than you can comfortably pay. You will find that a heavy burden.

            Now I warn Telemachus in front of everyone here. Send your mother to her father. Let him choose her husband and give her the wedding gifts a father should give his dear daughter. Until that happens, our courtship will keep making trouble for you. No man frightens us. We care nothing for your fine speeches or this old man's predictions. Go on preaching, sir. You will only make us hate you more.

            We shall return to the house and keep consuming Telemachus's property without paying. His mother must stop tormenting us first. Day after day she keeps us waiting in hope, each man competing to win such an extraordinary woman. And how can we court anyone else while she treats us this way? We might have married other women by now.
        - id: ch02-b05
          speaker: telemachus
          text: |-
            Eurymachus, and all you other suitors, I will not argue or beg any further. The gods and the people of Ithaca have heard what has happened to me. Give me a ship, then, and twenty men to take me where I need to go. I want to travel to Sparta and Pylos to ask about my father. He has been missing so long. Someone may have news, or heaven may send a message to guide me. People often hear things that way. If I learn that he is alive and returning, I will endure another twelve months of your waste. If he is dead, I will come home at once, perform the full funeral rites and raise a mound for him. Then I will have my mother marry again.
        - id: ch02-b06
          speaker: narrator
          text: |-
            Telemachus sat down. Mentor stood up to speak. He was a friend of Ulysses, who had left him in charge of his whole household, with full authority over the servants. He spoke frankly to the people.
        - id: ch02-b07
          speaker: mentor
          emotion: angry
          text: |-
            People of Ithaca, I hope you never have a kind ruler again. May no one govern you fairly. May all your leaders be cruel and unjust from now on. Every one of you has forgotten Ulysses, though he ruled you like a father. The suitors anger me less than the rest of you. They are willing to act violently and wickedly. They stake their own heads on Ulysses never coming back, and boldly eat through his property. Let them take that risk. But you others simply sit here. You do not even try to stop this disgrace. That shocks me. You could stop it if you wished. There are many of you, and only a few of them.
        - id: ch02-b08
          speaker: narrator
          text: |-
            Leiocritus, the son of Evenor, replied.
        - id: ch02-b09
          speaker: leiocritus
          text: |-
            Mentor, what foolish talk. Why are you trying to set the people against us? A man has a hard fight when he takes on many others over their food. Suppose Ulysses himself came back while we were feasting in his house. Suppose he tried his hardest to drive us out. His wife longs so much to see him, but she would have little to celebrate then. He would have only himself to blame for his death, fighting against so many. What you say makes no sense.

            The rest of you can return to your business now. Mentor and Halitherses are old friends of the boy's father. Let them arrange his journey, if he ever goes. I do not think he will. More likely he will stay here until someone brings him news.
        - id: ch02-b10
          speaker: narrator
          text: |-
            With that, he ended the meeting. The people went to their separate homes. The suitors went back to Ulysses' house.
    - id: ch03
      title: Help beside the sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Telemachus walked alone to the shore. He washed his hands in the grey waves and prayed to Minerva.
        - id: ch03-b02
          speaker: telemachus
          text: |-
            Hear me, the god who came to me yesterday. You told me to cross the sea and search for my father, who has been missing all these years. I want to do what you said. But the Achaeans are stopping me, especially those wicked suitors.
        - id: ch03-b03
          speaker: narrator
          text: |-
            Minerva came near as he prayed. She had the face and voice of Mentor.
        - id: ch03-b04
          speaker: athena
          text: |-
            Telemachus, if you have your father's nature, you will show neither foolishness nor cowardice from now on. Ulysses always kept his promises and finished what he began. If you are like him, your voyage will achieve something. Without the blood of Ulysses and Penelope in you, I could see little chance of success. Sons seldom equal their fathers. Most are worse, and few are better. But you are not going to act like a fool or a coward. You have something of your father's sound judgment, and that gives me hope for your plan.

            Do not join forces with any of these foolish suitors. They have no sense of what is right and no good judgment. They give no thought to the death that is coming for them. Soon the same day's disaster will kill them all. You will not have to wait long for your voyage. Your father and I have been friends so long that I shall find your ship myself and sail with you.

            Go home now, back among the suitors. Start preparing your supplies. Pack everything properly. Put the wine in jars, and the barley meal that keeps a man alive into leather bags. I will go around the town at once to find volunteers. Ithaca has plenty of ships, old ones and new ones. I will look them over and choose the best. We shall get her ready and sail without delay.
        - id: ch03-b05
          speaker: narrator
          text: |-
            Telemachus obeyed Jove's daughter straight away. He returned home in a gloomy mood. In the outer courtyard, the suitors were skinning goats and burning the hair from pigs. Antinous immediately came over, laughing, and caught his hand.
        - id: ch03-b06
          speaker: antinous
          text: |-
            Telemachus, you fierce young fighter. Put away these grudges. No more angry words or actions. Come eat and drink with us as you used to. The Achaeans will supply whatever you need. A ship, and the best men for a crew. You can leave for Pylos at once and ask for news of your noble father.
        - id: ch03-b07
          speaker: telemachus
          text: |-
            Antinous, how can I eat in peace or enjoy anything with men like you? You wasted enough of my good property when I was a child. Now I am older. I understand more, and I am stronger too. Whether I stay here among our people or go to Pylos, I will do you all the harm I can. I am going, and the journey will achieve something. Thanks to you suitors, I have no ship or crew of my own. I will have to travel as a passenger, instead of commanding my own vessel.
        - id: ch03-b08
          speaker: narrator
          text: |-
            He pulled his hand away from Antinous. Around the buildings, the other men kept preparing their meal and mocking him. One young suitor spoke.
        - id: ch03-b09
          speaker: suitor_young
          text: |-
            Telemachus plans to kill us, does he? Perhaps he thinks he will bring allies from Pylos. Or Sparta, since he is so determined to go there. Will he visit Ephyra too, and fetch poison to stir into our wine? That would finish us.
        - id: ch03-b10
          speaker: suitor_other
          text: |-
            Maybe he will board a ship and die far from his friends, just like his father. That would keep us busy. We could divide all his property. We can leave the house itself to his mother and whoever marries her.
    - id: ch04
      title: The nurse's promise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            While they talked like that, Telemachus went down to the tall, roomy storeroom. His father's gold and bronze lay piled on the floor. Linen and spare clothes filled open chests. Sweet-smelling olive oil was stored there too. Along the wall stood casks of old, well-matured wine, untouched by water and good enough for a god. It was kept against the chance that Ulysses might still come home. Strong, well-made double doors closed the room. Euryclea, the faithful old housekeeper, guarded its contents day and night. She was the daughter of Ops, son of Pisenor. Telemachus called her into the room.
        - id: ch04-b02
          speaker: telemachus
          text: |-
            Nurse, fill some jars for me with your best wine. Keep aside the special wine for my father, of course, in case the poor man escapes death and makes it home. Use the best of the rest. I need twelve jars, each with a lid. Then fill some well-stitched leather bags with barley meal, about twenty measures altogether. Have it all ready now, but tell no one. I will collect it this evening, when Mother has gone upstairs to bed. I mean to travel to Sparta and Pylos and see if anyone knows when my dear father will return.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Euryclea began to cry when she heard his plan. She spoke to him with all her affection.
        - id: ch04-b04
          speaker: euryclea
          emotion: sad
          text: |-
            My dear boy, what put this idea into your head? Where can you want to go? You are the only hope this house has left. Your poor father is dead in some foreign land, and nobody even knows where. The moment you leave, these wicked men will plan to get rid of you. They will divide everything you own among themselves. Stay here with your own people. Don't wander over that empty sea and wear your life away with worry and suffering.
        - id: ch04-b05
          speaker: telemachus
          text: |-
            Don't be afraid, Nurse. Heaven has approved my plan. But swear you will not tell Mother until I have been away ten or twelve days. Unless she hears I have gone and asks you herself. I don't want her to cry and spoil her beauty.
        - id: ch04-b06
          speaker: narrator
          text: |-
            The old woman gave her most solemn promise to keep the secret. Once she had sworn, she began filling the wine jars and the bags of barley meal. Telemachus went back to the suitors.
    - id: ch05
      title: Across the water by night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Minerva now turned to another task. She made herself look like Telemachus and went around the town, telling each member of the crew to be at the ship by sunset. She also visited Noemon, the son of Phronius, and asked to borrow a ship. He readily agreed. After sunset, when darkness lay over the land, she launched the vessel. She put aboard all the gear a ship would need, and moored her at the far end of the harbor. The crew soon arrived. Minerva gave each man words of encouragement.

            Then she returned to Ulysses' house and overwhelmed the suitors with sleepiness. Their wine confused them. Cups slipped from their hands. Instead of lingering over their drink, they went back into town to sleep, their eyes heavy. Minerva again took Mentor's shape and voice and called Telemachus outside.
        - id: ch05-b02
          speaker: athena
          text: |-
            Telemachus, the crew are aboard at their oars. They are waiting for your orders. Come quickly. It is time to leave.
        - id: ch05-b03
          speaker: narrator
          text: |-
            She led the way and he followed. At the ship, they found the men waiting beside the water. Telemachus spoke to them.
        - id: ch05-b04
          speaker: telemachus
          text: |-
            Men, come and help me bring our supplies aboard. Everything is together in the covered walk. My mother knows nothing about it. Only one of the maids knows.
        - id: ch05-b05
          speaker: narrator
          text: |-
            Telemachus went ahead to show them where the supplies were, and the men followed him. They brought everything back as he had directed. Minerva climbed aboard before him and found her place in the stern. Telemachus came aboard next and sat down at her side. The men untied the mooring ropes and settled on their benches. Minerva sent a favorable wind from the west, whistling over the deep blue waves. Telemachus ordered the crew to take the ropes and raise the sail. They obeyed. They fitted the mast into its socket in the cross plank, lifted it, and secured it with the ropes running forward. Then, with ropes of twisted ox hide, they hauled the white sail aloft. The wind filled it out. The ship flew through the deep blue water, and foam hissed along her bows as she sped ahead. The men secured everything throughout the ship. They filled the bowls used for mixing wine and water right to the brim, and poured out wine in honor of the immortal gods who had lived from the beginning of time. Above all, their offerings honored Jove's grey-eyed daughter.

            So the ship ran on through the hours of night, from darkness until dawn.
