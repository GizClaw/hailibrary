premise: "A public appeal fails to free Telemachus's household. Refusing to drive his mother away, he prepares a journey for news of his father and leaves Ithaca with Athena's help."
characters:
  - {id: telemachus, description: "The young son who must carry a public refusal into a practical decision."}
  - {id: antinous, description: "A leading suitor who blames Penelope's delay for the household's losses."}
  - {id: eurymachus, description: "A suitor who rejects the warning offered by an omen."}
  - {id: halitherses, description: "An elder who interprets the eagles as a warning of Odysseus's return."}
  - {id: mentor, description: "Odysseus's old friend, who reproaches the assembly for remaining passive."}
  - {id: athena, description: "The goddess who takes the forms of Mentor and Telemachus to help arrange the voyage."}
  - {id: euryclea, description: "The household keeper who fears for the son but prepares his stores."}
  - {id: penelope, description: "The absent wife and mother whose weaving delayed the suitors."}
  - {id: aegyptius, description: "An elder whose question opens the assembly."}
  - {id: leiocritus, description: "A suitor who dismisses the public meeting."}
  - {id: noemon, description: "The Ithacan who lends the expedition a ship."}
