audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    doctor:
      display_name: 医生
      tts: {delivery: "亲切睿智，轻松时幽默，诊断时坚定", timbre: 温暖清亮, pace: 平稳自然, pitch: 中音}
    grandpa:
      display_name: 爷爷
      tts: {delivery: "寡言沉稳，粗粝外表下藏着深厚温情", timbre: 低沉沧桑, pace: 舒缓, pitch: 低音}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
  chapters:
    - id: ch01
      title: 第十七章　一份补偿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，医生跟着彼得和羊群，从多尔夫里往山上走。医生待人和气，一路几次找彼得说话，可不管问什么，都很难从男孩嘴里问出一个字。彼得本来就不爱开口，于是一行人静静走到小屋前。海蒂带着自己的两只山羊，早已等在那里。她和山羊一样精神，活泼得像山间刚升起的太阳。
        - id: ch01-b02
          speaker: peter
          text: 你今天去不去？
        - id: ch01-b03
          speaker: narrator
          text: 彼得每天都拿这句话迎接海蒂，听着既像问她，也像在催她动身。
        - id: ch01-b04
          speaker: heidi
          text: 去呀，只要医生也跟我们一起去。
        - id: ch01-b05
          speaker: narrator
          text: 彼得斜着眼睛看了看医生。爷爷提着午餐袋出来，先跟医生问了早安，再把袋子挂到彼得脖子上。袋子比往常沉，因为爷爷想到医生或许愿意留在山上，跟孩子们一起吃午饭，便多装了些肉。彼得咧嘴笑了。他一掂分量，就知道里面准有平时吃不到的好东西。
        - id: ch01-b06
          speaker: narrator
          text: 大家继续往高处走。山羊照旧争先恐后地挤到海蒂身边，每一只都想离她最近。海蒂被它们推来顶去，只好停下。
        - id: ch01-b07
          speaker: heidi
          text: 好啦，你们都到前面去，乖乖走。别总回头挤我、顶我，我还要跟医生说话呢。雪花，你也要听话呀。
        - id: ch01-b08
          speaker: narrator
          text: 她轻轻拍了拍雪花的背，好不容易才从羊群中挤出来。医生牵住她的手，这下可再也不愁没人说话了。海蒂讲起每只山羊不同的脾气，又讲山花、岩石和飞鸟。两个人边说边爬，不知不觉便到了歇脚的地方。彼得一路都在偷偷瞪医生。医生要是看见那一道道不友善的目光，也许真会吓一跳，好在他什么也没察觉。
        - id: ch01-b09
          speaker: narrator
          text: 海蒂领医生来到自己最喜欢的地方，两人在暖暖的草地上并肩坐下。秋日金色的光辉罩着峰顶，也铺满远处碧绿的山谷。大片雪原在阳光下闪闪发亮，两座灰色岩峰立在深蓝的天空前，像从古老的岁月起就一直守在那里。轻柔的晨风吹过山野，吹在身上有种说不出的清新和舒服，也摇动了夏日繁花最后留下的蓝铃花。纤细的花朵在阳光里点着头。高空中，那只大鸟展开宽阔的翅膀，一声不响地绕着大圈，悠然浮在蓝天里。
        - id: ch01-b10
          speaker: narrator
          text: 海蒂的目光一会儿落在花朵上，一会儿又追向天空和大鸟。花在摇，天那么蓝，阳光那么亮，大鸟又那么快活。所有一切都美极了。她眼里亮着喜悦，转头想看看医生是不是也一样高兴。医生却若有所思地望着四周。迎上海蒂明亮的眼睛，他终于开了口。
        - id: ch01-b11
          speaker: doctor
          text: 是啊，海蒂，我知道这里有多美。可一个人要是带着满心悲伤来到这里，要怎样才能把心治好，也为眼前这一切高兴起来呢？
        - id: ch01-b12
          speaker: heidi
          text: 可是山上没有人会难过呀。只有在法兰克福才会难过。
        - id: ch01-b13
          speaker: narrator
          text: 医生笑了笑，很快又认真起来。
        - id: ch01-b14
          speaker: doctor
          text: 那要是一个人离开法兰克福的时候，没能把悲伤都留在那里呢？你想想，还有什么能帮他？
        - id: ch01-b15
          speaker: heidi
          text: 要是实在不知道该怎么办，就去把所有事都告诉上帝。
        - id: ch01-b16
          speaker: doctor
          text: 这个办法很好，海蒂。可如果苦难就是上帝送来的，那我们该对他说什么？
        - id: ch01-b17
          speaker: narrator
          text: 海蒂认真想了一会儿。她心里一直相信，不论遇上什么苦难，上帝都能把人救出来。她回想自己的经历，终于知道该怎样回答了。
        - id: ch01-b18
          speaker: heidi
          text: 那就要等。还要一直告诉自己，上帝一定知道，会有一种幸福从这场苦难里生出来，他正准备把它带给我们。我们得耐心，不能逃开。后来，忽然有件事发生了，我们才亲眼看懂，原来上帝一直都有一个好心意。只是我们看不见以后，只知道现在有多难受，就以为永远都会这么难受。
        - id: ch01-b19
          speaker: doctor
          text: 这样的信心真好。孩子，你一定别把它丢掉。
        - id: ch01-b20
          speaker: narrator
          text: 医生安静地坐了一阵。他望着头顶高大的群山，又望向山下照着阳光的绿色谷地，过了好一会儿才继续问海蒂。
        - id: ch01-b21
          speaker: doctor
          text: 你能明白这种感觉吗？一个人明明坐在这么美的地方，眼睛却像被阴影挡住了。他感受不到四周的美，也没法从中得到快乐。可他又知道，眼前本来可以有多美，心里便更加难过。你明白吗？
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: 海蒂快乐的心忽然疼了一下。医生说的阴影，让她想起了祖母。祖母再也看不见阳光，也看不见山上的美景。每逢海蒂想到祖母眼前永远是一片黑暗，这份最大的忧伤就会重新醒来。她的快乐被突如其来的心痛打断了。沉默片刻后，她严肃地回答。
        - id: ch01-b23
          speaker: heidi
          text: 我明白。这时候得念一首祖母喜欢的赞美诗。那些诗会带回来一点光，常常让她心里又变得很亮，重新快活起来。祖母亲口这样告诉过我。
        - id: ch01-b24
          speaker: doctor
          text: 她喜欢哪几首赞美诗？
        - id: ch01-b25
          speaker: heidi
          text: 我只会那首写太阳和美丽花园的，还有那首长诗里的几节。祖母最喜欢那几节，每次总让我连着念两三遍。
        - id: ch01-b26
          speaker: doctor
          text: 那就念给我听吧，我也想听。
        - id: ch01-b27
          speaker: narrator
          text: 医生坐直了一些，准备仔细听。海蒂合起双手，想了片刻。
        - id: ch01-b28
          speaker: heidi
          text: 我从祖母说最能给她希望和信心的那一节念起，好不好？
        - id: ch01-b29
          speaker: narrator
          text: 医生点点头。海蒂开始念了。
        - id: ch01-b30
          speaker: heidi
          text: 莫让你的心忧愁，莫让恐惧侵扰灵魂。自有智慧的守护者，会把你稳稳支撑。你若失败，他便得胜，看那仇敌纷纷逃遁。你所受的一切磨难，终将化作惊喜欢欣。哪怕一时仿佛觉得，他的慈悲已经隐去，仿佛他不再眷顾，那迷途无依的儿女，也别怀疑他的怜悯。他的爱永不会疲倦。凡是耐心等候的人，终会得到心中所愿。
        - id: ch01-b31
          speaker: narrator
          text: 海蒂忽然停住，不知道医生是不是还在听。他一动不动，一只手遮着眼睛。海蒂以为他睡着了，便决定等他醒来再念。山上一点声音也没有。医生当然没有睡。他的思绪回到了很久以前。他又看见自己还是个小男孩，站在亲爱的母亲椅边。母亲搂着他的脖子，念的正是海蒂方才念过的诗句。那些话，他已经多年没有听过了。此刻，他仿佛又听见母亲的声音，看见那双慈爱的眼睛落在自己身上。
        - id: ch01-b32
          speaker: narrator
          text: 海蒂已经不念了，可那久远而亲切的声音，似乎仍在对医生说着别的话。那些话把他带得很远。过了许久，他才动了一下，放下遮住眼睛的手。一回过神，他便对上了海蒂惊奇的目光。
        - id: ch01-b33
          speaker: doctor
          text: 海蒂，这首赞美诗真美。改天我们还到这里来，到时候你再念给我听。
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: 医生握住孩子的手，说话声里已经多了一份欢快。可另一边，彼得正忙着用自己的办法发脾气。海蒂好几天没跟他上山，今天好不容易来了，却一直陪着那位老先生，连一句话也没跟彼得说。彼得越想越气，便站到医生背后，让医生看不见他。他攥紧拳头，对着这个敌人一下又一下地打空拳。后来，两只拳头都举起来了。海蒂陪医生坐得越久，他挥得就越凶。
        - id: ch01-b35
          speaker: narrator
          text: 太阳升到了彼得熟悉的位置。他知道，该吃午饭了，便猛地扯开嗓子。
        - id: ch01-b36
          speaker: peter
          text: 吃午饭啦！
        - id: ch01-b37
          speaker: narrator
          text: 海蒂起身去拿午餐袋，想让医生坐在原地吃饭。医生拦住她，说自己一点也不饿，只想喝杯羊奶，还想再往高处走一走。海蒂这才觉得自己也不饿，只想喝奶。她打算带医生去那块铺满苔藓的大岩石看看，金翅雀曾经在那里差点跳下去摔死。她跑到彼得身边，把事情说清楚，请他给两个人挤羊奶。彼得却像没听明白。
        - id: ch01-b38
          speaker: peter
          text: 那袋子里的饭，谁吃？
        - id: ch01-b39
          speaker: heidi
          text: 全都归你。不过你得先快点把羊奶挤来。
        - id: ch01-b40
          speaker: narrator
          text: 彼得从没这样麻利地办过差事。他只想着午餐袋，还有里面如今全归自己的食物。等海蒂和医生坐下喝奶，他马上打开袋子。看见那块肉，他高兴得身子都颤了一下。可手刚伸过去，又停住了。彼得想起，自己刚才还躲在医生背后攥拳头，而医生现在却把整顿好饭都让给了他。他心里有些过意不去，觉得这样吃起来不会香。
        - id: ch01-b41
          speaker: narrator
          text: 彼得突然跳起来，跑回刚才挥拳的地方。他摊开两只手，高高举着，表示再也不想把它们攥成拳头。一直举到觉得自己已经补偿了先前的举动，他才飞奔回来。现在，他既有一颗踏实的心，又有一顿难得的好饭，可以享受双份的快乐了。
        - id: ch01-b42
          speaker: narrator
          text: 海蒂陪医生边走边聊，很久以后，医生才说自己该回去了，海蒂也该回羊群那边。海蒂却不答应，因为她不愿让医生独自走完下山的路。她坚持送他到爷爷的小屋，还要再多送一段。她一路牵着朋友的手，告诉他哪片草地最受山羊喜欢，又指给他看，哪些地方一到夏天就会开满各种颜色的花。爷爷在夏天教过她，所以每一种花，她都叫得出名字。
        - id: ch01-b43
          speaker: narrator
          text: 最后，医生一再催促，海蒂才肯停下。两人互道晚安，医生继续下山。他走一会儿便回头看一次，每次都看见海蒂仍站在原地朝他挥手。许多年前，他亲爱的小女儿也曾这样站在家门前，目送他离开。
        - id: ch01-b44
          speaker: narrator
          text: 接下来整整一个月，秋日一直晴朗，阳光又明亮又温暖。医生每天早晨来到小屋，再从这里出发，到山里各处远足。有时他要攀上更高的地方，爷爷就陪着他。他们一路爬到那些被风暴吹打多年的老枞树旁，常常惊动巢里的大鸟。大鸟受惊后猛地飞起来，翅膀呼呼作响，一边粗声鸣叫，一边贴着他们头顶掠过。
        - id: ch01-b45
          speaker: narrator
          text: 医生很爱听爷爷谈山里的事，也惊讶于他竟认得那么多植物。带着香气的枞树、深色松树和芬芳的松针，树根边随处可见的卷曲苔藓，还有最小的草叶和最不起眼的花朵，每一样有什么用，爷爷都知道。大大小小的动物有什么习性，他也一样清楚。他还会讲很多有趣的故事，说的都是住在岩洞、地洞和枞树梢上的山中居民。医生的日子过得又快活又飞快。傍晚告别时，他几乎每天都会对老人说同一句话。
        - id: ch01-b46
          speaker: doctor
          text: 朋友，我每次离开这里，都能从你身上再学会一点新东西。
        - id: ch01-b47
          speaker: narrator
          text: 天气最好的时候，医生也会单独和海蒂出去。两人像第一天那样坐在一起。海蒂给他念赞美诗，再讲些只有自己知道的事。彼得还是坐在不远处，不过他心里已经不再生气，也不会偷偷挥拳头了。
        - id: ch01-b48
          speaker: narrator
          text: 九月快结束了。一天早晨，医生来到小屋，脸上没有平日那么快活。他说，今天是自己留在山上的最后一天，必须回法兰克福了。这片山野已经让他觉得像家一样，一想到要走，他就很难过。爷爷也舍不得这位客人。海蒂早已习惯每天见到好朋友，突然听说要分别，简直无法相信。可医生非走不可。他向老人告别，请海蒂陪自己走一段。海蒂牵着他的手下山，还是不敢相信医生这一走，就真的不再回来了。
        - id: ch01-b49
          speaker: narrator
          text: 走出一段路，医生停下来，摸了摸海蒂卷曲的头发。
        - id: ch01-b50
          speaker: doctor
          text: 就送到这里吧，海蒂。你该回去了，我也得跟你说再见。要是能带你去法兰克福，让你一直陪着我，那该多好。
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: 海蒂眼前立刻出现了法兰克福。那里有一排又一排望不到头的房屋，有坚硬的街道，还有罗滕迈尔小姐和蒂内特。她迟疑起来。
        - id: ch01-b52
          speaker: heidi
          text: 我还是想让您回到我们这里来。
        - id: ch01-b53
          speaker: doctor
          text: 是啊，你说得对。那样会更好。可现在，再见了，海蒂。
          emotion: sad
        - id: ch01-b54
          speaker: narrator
          text: 海蒂把手放进医生手里，抬头望着他。那双慈爱的眼睛里含着泪。医生猛地转过身，快步向山下走去。海蒂站着一动不动，那双含泪的温柔眼睛却深深刺痛了她。她突然哭出声来，拼命追向渐渐走远的身影，一边追，一边断断续续地喊。
        - id: ch01-b55
          speaker: heidi
          text: 医生！医生！
          emotion: sad
        - id: ch01-b56
          speaker: narrator
          text: 医生回过头，站住等她。海蒂终于追到跟前，眼泪不断从脸上流下来。她抽泣着说。
        - id: ch01-b57
          speaker: heidi
          text: 我跟您去法兰克福，现在就去！您想让我陪多久，我就陪多久。我只要先跑回去告诉爷爷一声。
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: 医生把手放在她身上，想让激动的孩子安静下来。
        - id: ch01-b59
          speaker: doctor
          text: 不，不，亲爱的孩子，现在还不行。你眼下得留在枞树下，不然又会生病。不过，我有件事想求你。以后要是我病了，身边又一个人也没有，你愿意来陪我吗？我能不能相信，到时候会有人照顾我、关心我？
          emotion: calm
        - id: ch01-b60
          speaker: heidi
          text: 愿意，愿意！您哪天派人来叫我，我哪天就去。我爱您，几乎像爱爷爷一样。
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: 海蒂还没有从悲伤中缓过来。医生再次向她告别，转身上路。海蒂留在原地，一直望着他，不停地挥手，直到最后一个小黑点也消失不见。医生最后一次回头，看见阳光下的群山，也看见还在挥手的海蒂。他在心里轻轻说道，待在山上真好，对身体好，对心灵也好。一个人在这里，也许能重新学会怎样快乐起来。
