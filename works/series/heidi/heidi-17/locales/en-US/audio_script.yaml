  chapters:
    - id: ch01
      title: A Compensation
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, the doctor walked up from Dorfli beside Peter and the goats. The kind gentleman tried again and again to start a conversation with the boy. He asked questions as they climbed, but Peter would hardly give him a word in reply. Talking had never come easily to Peter, and no amount of friendly effort could persuade him. So the whole party made its way up in silence until they reached the hut. Heidi was waiting there with her two goats. All three looked as fresh and lively as the morning sun on the mountains.
        - id: ch01-b02
          speaker: peter
          text: Are you coming today?
        - id: ch01-b03
          speaker: narrator
          text: It was Peter's usual greeting, half question and half command.
        - id: ch01-b04
          speaker: heidi
          text: Of course, as long as the doctor comes too.
        - id: ch01-b05
          speaker: narrator
          text: Peter glanced sideways at the doctor. Grandfather came out, wished the doctor good morning, and hung the lunch bag around Peter's neck. It was heavier than usual. Grandfather had put in meat, thinking the doctor might want to eat outside with the children. Peter grinned. He could tell there was something special in the bag.
        - id: ch01-b06
          speaker: narrator
          text: They started up the mountain. As always, the goats crowded around Heidi, each one trying to stay closest to her. At last, she stopped.
        - id: ch01-b07
          speaker: heidi
          text: Go on ahead now, and behave yourselves. Stop turning back to push and poke me. I want to talk to the doctor. And Snowflake, you be good and do as you're told.
        - id: ch01-b08
          speaker: narrator
          text: Heidi gave Snowflake a little pat and slowly worked her way out of the herd. Then she joined the doctor and took his hand. He had no trouble talking with her. Heidi told him all about the goats and their different ways, and about the flowers, the rocks, and the birds. They talked as they climbed and reached their resting place before they knew it. Peter kept throwing unfriendly looks at the doctor, but the doctor never noticed them.
        - id: ch01-b09
          speaker: narrator
          text: Heidi led her friend to the place where she always sat to enjoy the view. The doctor settled beside her on the warm grass. Autumn sunlight lay golden over the heights and the green valley far below. The great snowfield flashed in the bright sun, and two gray peaks rose with ancient majesty against the deep blue sky. A soft morning breeze moved across the mountain. It gently stirred the last bluebells left from summer, and their slender heads nodded in the sunshine. High overhead, the great bird circled without a sound, floating contentedly on its wide wings through the blue air.
        - id: ch01-b10
          speaker: narrator
          text: Heidi's gaze moved from one beautiful thing to another. She watched the flowers swaying, the blue sky, the bright sunlight, and the happy bird. Everything seemed beautiful beyond words, and her eyes shone with joy. Then she turned to see whether the doctor was enjoying it too. He had been sitting there thoughtfully, looking over the mountain. When he met her bright, glad eyes, he answered the question in her face.
        - id: ch01-b11
          speaker: doctor
          text: Yes, Heidi, I see how lovely it is. But tell me something. If someone comes up here with a sad heart, how can it heal enough to enjoy all this beauty?
          emotion: sad
        - id: ch01-b12
          speaker: heidi
          text: But nobody is sad up here. People are only sad in Frankfurt.
        - id: ch01-b13
          speaker: narrator
          text: The doctor smiled, then became serious again.
        - id: ch01-b14
          speaker: doctor
          text: What if someone can't leave all that sadness behind in Frankfurt? Do you know anything that could help then?
        - id: ch01-b15
          speaker: heidi
          text: When you don't know what else to do, you have to go and tell God everything.
        - id: ch01-b16
          speaker: doctor
          text: That's a good thought, Heidi. But what can we say if God is the one who sent the trouble?
        - id: ch01-b17
          speaker: narrator
          text: Heidi thought for a while. Deep inside, she was certain God could help with every trouble. She remembered what had happened in her own life, and then she knew how to answer.
        - id: ch01-b18
          speaker: heidi
          text: Then you have to wait. You have to keep telling yourself that God knows some happiness that will come out of the trouble. We just have to be patient and not run away. Then one day, something happens, and we can see that God had something good in mind all along. We only think we'll be miserable forever because we can't see what's coming.
          emotion: calm
        - id: ch01-b19
          speaker: doctor
          text: That is a beautiful faith, child. Be sure you hold on to it.
        - id: ch01-b20
          speaker: narrator
          text: The doctor sat quietly for a time. He looked at the great mountains above them and the green valley shining below. Then he spoke again.
        - id: ch01-b21
          speaker: doctor
          text: Can you understand this, Heidi? A man might sit here with such a shadow over his eyes that he can't feel any of the beauty around him. And knowing how beautiful it could be only makes his heart sadder. Can you understand that?
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: Pain struck Heidi's happy heart. The shadow over the eyes made her think of Grandmother, who would never see the sunlight or the beauty of the mountain. That was Heidi's great sorrow, and it returned whenever she remembered Grandmother's darkness. For several minutes, she said nothing. Then she answered in a grave voice.
        - id: ch01-b23
          speaker: heidi
          text: Yes, I understand. When that happens, you have to say one of Grandmother's hymns. They bring back a little light. Sometimes they make everything so bright for her that she's happy again. Grandmother told me that herself.
        - id: ch01-b24
          speaker: doctor
          text: Which hymns do you mean, Heidi?
        - id: ch01-b25
          speaker: heidi
          text: I only know the one about the sun and the beautiful garden, and a few verses from the long hymn she loves. She always asks me to read those verses to her two or three times.
        - id: ch01-b26
          speaker: doctor
          text: Then say them for me. I'd like to hear them too.
        - id: ch01-b27
          speaker: narrator
          text: The doctor sat up so he could listen. Heidi folded her hands and gathered her thoughts.
        - id: ch01-b28
          speaker: heidi
          text: Should I start with the verse that gives Grandmother hope and makes her feel safe?
        - id: ch01-b29
          speaker: narrator
          text: The doctor nodded, and Heidi began.
        - id: ch01-b30
          speaker: heidi
          text: |-
            Let not your heart be troubled
            Nor fear your soul dismay,
            There is a wise Defender
            And He will be your stay.
            Where you have failed, He conquers,
            See, how the foeman flies!
            And all your tribulation
            Is turned to glad surprise.

            If for a while it seemeth
            His mercy is withdrawn,
            That He no longer careth
            For His wandering child forlorn,
            Doubt not His great compassion,
            His love can never tire,
            To those who wait in patience
            He gives their heart's desire.
        - id: ch01-b31
          speaker: narrator
          text: Heidi stopped. The doctor had not moved, and one hand covered his eyes. She wondered if he had fallen asleep. If he woke and wanted more, she would continue. The mountain was completely still. But the doctor was not asleep.
        - id: ch01-b32
          speaker: narrator
          text: His thoughts had carried him far into the past. He saw himself as a little boy standing beside his dear mother's chair, with her arm around his neck. She was saying those very verses to him, words he had not heard for many years. Once again, he could hear his mother's voice and see her loving eyes resting on him. After Heidi fell silent, that dear old voice seemed to go on speaking. The words he heard in memory carried him far away. A long time passed before he moved or took his hand from his eyes. When he finally looked up, Heidi was watching him in wonder.
        - id: ch01-b33
          speaker: doctor
          text: Heidi, that was a beautiful hymn. We'll come here together another day, and you can say it for me again.
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: His voice sounded happier now, and he took Heidi's hand in his.
        - id: ch01-b35
          speaker: narrator
          text: Meanwhile, Peter had been busy giving his anger somewhere to go. Heidi had not come to the pasture for days. Now that she was finally there, she spent the whole time beside the old gentleman, and Peter could not get a single word with her. He worked himself into a terrible temper. At last, he went and stood some distance behind the doctor, where the doctor could not see him. Peter doubled one fist and struck at his enemy through the air. Soon he was using both fists. The longer Heidi stayed beside the doctor, the more fiercely Peter threatened him from behind.
        - id: ch01-b36
          speaker: narrator
          text: At last, the sun reached the place that told Peter it was noon. He shouted as loudly as he could.
        - id: ch01-b37
          speaker: peter
          text: It's time to eat!
        - id: ch01-b38
          speaker: narrator
          text: Heidi got up to fetch the lunch bag so the doctor could eat right where he was sitting, but he stopped her. He was not hungry at all, he said. He only wanted a glass of milk, because he hoped to climb a little higher. At that, Heidi decided she was not hungry either and wanted only milk. She wanted to take him to the great moss-covered rock where Greenfinch had nearly jumped down and killed herself. Heidi ran over, explained the plan to Peter, and told him to get milk for both of them. Peter seemed unable to understand what he had heard.
        - id: ch01-b39
          speaker: peter
          text: Then who's going to eat what's in the bag?
        - id: ch01-b40
          speaker: heidi
          text: You can eat it. Just hurry and get the milk first.
        - id: ch01-b41
          speaker: narrator
          text: Peter had rarely done a job so quickly. He could think only of the bag and everything in it, which now belonged to him. Once Heidi and the doctor were sitting together with their milk, Peter opened the bag. He trembled with delight when he saw the meat. He reached in, but something stopped him.
        - id: ch01-b42
          speaker: narrator
          text: His conscience reminded him of the fists he had shaken behind the doctor. And now that same doctor had given him his whole fine dinner. Peter felt as if he could not enjoy it after what he had done. Suddenly, he jumped up and ran back to the very place where he had stood before. This time, he held up both hands wide open. It was his way of showing that he no longer wanted to use them as fists. He kept them raised until he felt he had made up for his behavior. Then he rushed back to the bag. Now he could enjoy two things at once, an unusually satisfying meal and a clear conscience.
        - id: ch01-b43
          speaker: narrator
          text: Heidi and the doctor climbed higher and talked for a long time. At last, he said it was time for him to head back. No doubt, he added, Heidi would want to return to her goats. But Heidi would not hear of it. If she left him there, he would have to walk the whole way down the mountain alone. She insisted on going with him at least as far as Grandfather's hut, and perhaps a little farther.
        - id: ch01-b44
          speaker: narrator
          text: She held his hand the whole way and kept him entertained with one story after another. She pointed out the places where the goats liked best to feed and the slopes that filled with flowers of every color in summer. She knew each flower's proper name because Grandfather had taught her through the summer months. At last, the doctor insisted that she turn back. They said good night, and he continued down the mountain alone. Again and again, he looked behind him. Each time, Heidi was still standing in the same place, waving to him. Long ago, his own dear little daughter had stood watching him in just that way whenever he left home.
        - id: ch01-b45
          speaker: narrator
          text: The whole autumn month stayed bright and sunny. Every morning, the doctor came up to the hut, then set out across the mountain. Grandfather went with him on some of the higher climbs. Together, they reached the ancient fir trees, bent and battered by years of storms. Sometimes they startled the great bird from its nest. It rose very near their heads in a whirl of wings and harsh cries before flying away.
        - id: ch01-b46
          speaker: narrator
          text: The doctor took great pleasure in Grandfather's company and conversation. He was amazed by the old man's knowledge of every mountain plant. Grandfather knew the fragrant firs, the dark pines with their scented needles, the curled moss around the roots, and even the smallest plant and tiniest flower. He knew what each one could be used for. He understood the mountain animals just as well, from the larger creatures to the smallest. Whether they lived in caves, in holes, or high in the fir trees, Grandfather knew their ways and had many amusing stories about them. The days passed quickly and pleasantly. When the doctor left the old man in the evening, he rarely went without saying the same thing.
        - id: ch01-b47
          speaker: doctor
          text: My friend, I never leave you without learning something new.
        - id: ch01-b48
          speaker: narrator
          text: On some of the loveliest days, the doctor went out with Heidi instead. They sat together as they had on that first morning. Heidi repeated her hymns and told him things that only she knew. Peter kept a little distance away, but he had made peace with the matter. He no longer shook angry fists at the doctor.
        - id: ch01-b49
          speaker: narrator
          text: September drew to an end. One morning, the doctor arrived looking less cheerful than usual. This would be his last day, he told them. He had to return to Frankfurt, and it grieved him to say goodbye to the mountain, which had begun to feel like home. Grandfather, too, was deeply sorry that his guest was leaving. Heidi had grown so used to seeing her dear friend every day that she could hardly believe the time had suddenly come for them to part. She stared up at him in surprise and doubt, as if there might be some mistake. But there was no help for it. He truly had to go.
        - id: ch01-b50
          speaker: narrator
          text: The doctor said farewell to Grandfather and asked if Heidi could walk part of the way with him. She took his hand and went down the mountain, still unable to understand that he was leaving for good. After a while, the doctor stopped and passed his hand over her curly head.
        - id: ch01-b51
          speaker: doctor
          text: This is where you must turn back, Heidi, and where I must say goodbye. If only I could take you to Frankfurt and keep you there with me!
          emotion: sad
        - id: ch01-b52
          speaker: narrator
          text: Heidi pictured Frankfurt. She saw its endless rows of houses and its hard streets. She even saw Miss Rottenmeier and Tinette. Her answer came slowly.
        - id: ch01-b53
          speaker: heidi
          text: I'd rather have you come back to us.
        - id: ch01-b54
          speaker: doctor
          text: Yes, you're right. That would be better. But now, goodbye, Heidi.
          emotion: sad
        - id: ch01-b55
          speaker: narrator
          text: Heidi put her hand in his and looked up. The doctor's kind eyes were full of tears. Then he pulled himself away and hurried down the path.
        - id: ch01-b56
          speaker: narrator
          text: Heidi stood without moving. The tears in those friendly eyes had gone straight to her heart. Suddenly, she began to cry and ran after him as fast as she could.
        - id: ch01-b57
          speaker: heidi
          text: Doctor! Doctor!
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: He turned and waited. When Heidi reached him, tears were streaming down her face.
        - id: ch01-b59
          speaker: heidi
          text: I'll go to Frankfurt with you right now. I'll stay as long as you want. I only need to run back and tell Grandfather first.
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: The doctor put a hand on her and gently tried to settle her.
        - id: ch01-b61
          speaker: doctor
          text: No, no, dear child. Not now. You need to stay here under the fir trees for a while, or you might become ill again. But I want to ask you something. If I'm ever sick and alone, will you come stay with me then? Can I know that someone will be there to look after me and care for me?
          emotion: calm
        - id: ch01-b62
          speaker: heidi
          text: Yes, yes! I'll come the very day you send for me. I love you almost as much as Grandfather.
          emotion: sad
        - id: ch01-b63
          speaker: narrator
          text: Heidi was still deeply upset. The doctor said goodbye once more and went on his way. She stood watching him and waving for as long as she could see even the smallest speck of him.
        - id: ch01-b64
          speaker: narrator
          text: The doctor turned one last time. He looked back at Heidi waving on the sunny mountain, and spoke softly to himself.
        - id: ch01-b65
          speaker: doctor
          text: It is good up there, good for the body and the soul. A man might learn how to be happy again.
