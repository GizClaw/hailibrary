audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    grandfather:
      display_name: 外公
      tts:
        delivery: 简短沉稳，粗粝中渐渐透出关怀
        timbre: 低沉厚实
        pace: 不紧不慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 探看新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 德特刚刚走得看不见了，老人就回到长凳上。他一声不响，只管低头望着地面。烟斗里冒出一团团浓烟，慢慢飘向空中。海蒂可没有闲着。她正兴致勃勃地四处探看这个新地方。小屋旁边搭着一座羊棚，她探头进去看了看，里面一只山羊也没有。她又跑到屋后的冷杉树下。强风穿过林间，最高处的枝头一阵呼啸，一阵轰鸣。海蒂站住，听得出了神。等风声渐渐低下去，她才接着绕过墙角，回到外公身边。
        - id: ch01-b02
          speaker: narrator
          text: 外公还坐在原处，姿势和她离开时一模一样。海蒂沿着小屋绕了一圈，又回到他面前。她把两只手背到身后，就那么一动不动地看着他。老人终于抬起头来。
        - id: ch01-b03
          speaker: grandfather
          text: 你想要什么？
        - id: ch01-b04
          speaker: heidi
          text: 我想看看屋子里面都有什么。
        - id: ch01-b05
          speaker: grandfather
          text: 那就跟我来。
        - id: ch01-b06
          speaker: narrator
          text: 外公起身走向小屋，海蒂跟在后面。
        - id: ch01-b07
          speaker: grandfather
          text: 别忘了把你的衣服包拿进来。
        - id: ch01-b08
          speaker: heidi
          text: 那些衣服我以后都用不着了。
        - id: ch01-b09
          speaker: narrator
          text: 老人回过头，仔细看了看这个孩子。海蒂的黑眼睛亮闪闪的，正盼着看看屋里的一切。外公低声说，这孩子倒是一点也不笨。接着，他又问她。
        - id: ch01-b10
          speaker: grandfather
          text: 你怎么会用不着那些衣服？
        - id: ch01-b11
          speaker: heidi
          text: 我想像山羊那样到处跑。你看，它们的腿又细又轻快。
        - id: ch01-b12
          speaker: grandfather
          text: 行啊，你愿意就这么跑吧。不过衣服还是得拿进来，收在柜子里。
        - id: ch01-b13
          speaker: narrator
          text: 海蒂照他说的做了。外公推开门，她也跟着走进小屋。整个底层就是一个宽敞的房间，里面只有一张桌子、一把椅子。一个墙角放着外公的床，另一个墙角砌着炉灶，上面吊着一口大锅。对面墙上还有一扇大门，那就是柜子。外公打开柜门，海蒂看见几件衣服，有的挂着，有的叠在架子上。那里还有衬衫、袜子、手帕，以及盘子、杯子和玻璃杯。最高的一层放着圆面包、熏肉和奶酪。原来，阿尔姆大叔吃的穿的全在这里。
        - id: ch01-b14
          speaker: narrator
          text: 柜门一开，海蒂赶紧把自己的衣服包塞到外公的东西后面，藏得深深的，巴不得谁也找不出来。然后，她又认认真真地把整个房间看了一遍，连每个角落都没有漏下。
        - id: ch01-b15
          speaker: heidi
          text: 外公，我要睡在哪儿？
        - id: ch01-b16
          speaker: grandfather
          text: 你看中哪儿，就睡哪儿。
    - id: ch02
      title: 干草棚里的床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这话让海蒂高兴坏了。她马上到处寻找，想挑一个最舒服的地方。外公床边的墙角靠着一架短梯。她顺着梯子爬上去，发现上面是一间干草棚。大垛新鲜的干草散发着甜甜的香味，墙上还有一扇圆窗。站在窗边，一直可以望到下面的山谷。
        - id: ch02-b02
          speaker: heidi
          text: 外公，我就睡在这里！上面美极了，你快来看看呀！
          emotion: happy
        - id: ch02-b03
          speaker: grandfather
          text: 我知道上面是什么样。
        - id: ch02-b04
          speaker: narrator
          text: 海蒂已经忙着搬起干草，在棚里来来回回。
        - id: ch02-b05
          speaker: heidi
          text: 我在铺床呢。你得给我拿一条床单上来，床上总要先铺好床单，人才能躺呀。
        - id: ch02-b06
          speaker: grandfather
          text: 好。
        - id: ch02-b07
          speaker: narrator
          text: 外公走到柜子前，翻找了一阵，终于抽出一长块粗布。家里只有这个能当床单。他把布拿到上面一看，海蒂已经铺出了一张很不错的小床。床头多堆了一层干草，正好可以当枕头。床的位置也选得巧，她躺下以后，照样能舒舒服服地望见圆窗外面。
        - id: ch02-b08
          speaker: grandfather
          text: 铺得真不错。现在可以放床单了，不过先等等。
        - id: ch02-b09
          speaker: narrator
          text: 外公又搬来一大捆干草，把床垫得更厚，这样孩子躺下时，便不会感觉到下面硬邦邦的地板。海蒂抓起粗布床单，可它沉得很，她几乎拿不动。好在布料厚实又紧密，尖尖的草梗穿不过去，也就扎不到她。外公和她一起把床单铺开。哪里太长、哪里太宽，海蒂就手脚麻利地把多出来的布掖到干草下面。很快，小床变得又整齐又舒服，任谁看了都觉得像模像样。海蒂站在那里，看着自己的成果，忽然想起一件事。
        - id: ch02-b10
          speaker: heidi
          text: 外公，我们漏了一样东西。
        - id: ch02-b11
          speaker: grandfather
          text: 漏了什么？
        - id: ch02-b12
          speaker: heidi
          text: 还没有被子呢。睡觉的时候，人要钻到床单和被子中间呀。
        - id: ch02-b13
          speaker: grandfather
          text: 原来得这样。可我要是没有被子呢？
        - id: ch02-b14
          speaker: heidi
          text: 没关系，外公。我再抱些干草来，盖在身上就行了。
          emotion: calm
        - id: ch02-b15
          speaker: narrator
          text: 她说着就要去抱干草，外公却叫她等一等。他爬下梯子，走到自己的床边，拿回一只又大又厚的亚麻布口袋，往海蒂面前一放。
        - id: ch02-b16
          speaker: grandfather
          text: 喏，这个总比干草好吧？
        - id: ch02-b17
          speaker: narrator
          text: 海蒂使出全身力气拖着口袋，想把它铺平。可这活儿太重，那两只小手怎么也干不好。外公便过来帮她。等两人把口袋端端正正地铺好，整张床看起来又暖和又舒服，漂亮得不得了。海蒂喜滋滋地望个不停。
        - id: ch02-b18
          speaker: heidi
          text: 这床被子真好，整张床都这么漂亮！要是天已经黑了，我现在就能钻进去睡觉啦。
          emotion: happy
    - id: ch03
      title: 第一顿饭
      blocks:
        - id: ch03-b01
          speaker: grandfather
          text: 睡觉以前，我们是不是该先吃点东西？
        - id: ch03-b02
          speaker: narrator
          text: 海蒂刚才只顾着铺床，别的什么都忘了。如今一想到食物，她一下子觉得饿极了。早晨出发以前，她只吃过一片面包，喝了一小杯淡咖啡。走过那么长、那么热的一段山路以后，她再没吃过任何东西。
        - id: ch03-b03
          speaker: heidi
          text: 对，我也觉得该吃东西了。
        - id: ch03-b04
          speaker: grandfather
          text: 既然我们都这么想，那就下去吧。
        - id: ch03-b05
          speaker: narrator
          text: 海蒂先下了梯子，老人跟在后面。他来到炉边，把大锅推开，拉过铁链上吊着的小锅，又坐到圆圆的三脚凳上，把炉火吹得又亮又旺。锅里很快沸腾起来。外公拿长柄铁叉托着一大块奶酪，放在火上不停翻烤，直到两面都成了好看的金黄色。海蒂好奇地看着看着，忽然转身奔向柜子，开始忙碌地来回跑。
        - id: ch03-b06
          speaker: narrator
          text: 外公拿着罐子和烤奶酪来到桌旁时，桌子已经摆得整整齐齐。圆面包、两只盘子、两把餐刀，各自在该放的位置上。海蒂早就把柜子里的东西看清楚了，也记得吃饭该拿些什么。
        - id: ch03-b07
          speaker: grandfather
          text: 对，就是这样。你还会自己动脑筋，这很好。不过，桌上还少一样东西。
        - id: ch03-b08
          speaker: narrator
          text: 他把烤软的奶酪放到一片面包上。海蒂望望热气腾腾的罐子，马上又奔回柜子。架子上还剩一只小碗，她一时没看见别的东西，可很快就发现深处放着两只玻璃杯。她立刻把玻璃杯和小碗都拿到桌上。
        - id: ch03-b09
          speaker: grandfather
          text: 好，你果然知道怎么办。可你准备坐哪儿？
        - id: ch03-b10
          speaker: narrator
          text: 屋里只有一把椅子，外公正坐在上面。海蒂冲到炉边，把三脚凳拖到桌旁，一屁股坐了上去。
        - id: ch03-b11
          speaker: grandfather
          text: 你倒是给自己找到座位了，不过这张凳子有点矮。其实，就算换成我的椅子，你也还够不着桌面。先吃东西要紧，来吧。
        - id: ch03-b12
          speaker: narrator
          text: 外公站起来，把牛奶倒进小碗，再将小碗放到椅子上，推到海蒂的三脚凳面前。这样，她也有了自己的小桌子。外公又递给她一大片面包和一块金黄的奶酪，自己坐到桌角上吃起来。海蒂两手捧住碗，一口气喝光了牛奶。漫长炎热的山路让她渴坏了，她连气都顾不上喘，放下碗时才深深吸了一口气。
        - id: ch03-b13
          speaker: grandfather
          text: 牛奶好喝吗？
        - id: ch03-b14
          speaker: heidi
          text: 我从来没喝过这么好喝的牛奶。
          emotion: happy
        - id: ch03-b15
          speaker: grandfather
          text: 那就再喝一碗。
        - id: ch03-b16
          speaker: narrator
          text: 老人把小碗重新倒得满满的。海蒂也开始大口吃面包。她先把烤得像黄油一样柔软的奶酪抹在上面，两样东西合在一起，滋味好极了。她吃一阵，再喝几口牛奶，脸上全是满足。饭后，外公到屋外整理羊棚。海蒂也跟了过去，兴致勃勃地看着他先把地面扫干净，再铺上一层新鲜稻草，给晚上归来的山羊睡觉。
    - id: ch04
      title: 外公的新凳子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 接下来，外公走进小井棚。他削出几根细长的圆木棍，又做了一块小圆板，在上面钻好几个孔，把木棍一根根插进去。仿佛变魔法似的，一张三脚凳转眼就做好了。它和外公的凳子一模一样，只是更高一些。海蒂看得目瞪口呆，一句话也说不出来。
        - id: ch04-b02
          speaker: grandfather
          text: 你猜，这是什么？
        - id: ch04-b03
          speaker: heidi
          text: 我知道，是给我的凳子！因为它这么高，而且一下子就做好了。
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: 海蒂仍旧满心惊叹，也很佩服外公的本事。外公低声说，她看得明白，一双眼睛倒是长对了地方。说完，他又绕着小屋继续干活。这里敲进一枚钉子，那里把门上松动的地方重新固定好。他带着锤子、钉子和木片，从一处走到另一处。哪里需要修理，哪里该清理，他就在哪里停下来动手。海蒂也一步一步跟在后面，眼睛始终没有离开外公的一举一动。对她来说，每件新看到的事情都那么有趣，又给她添上一份快乐。
        - id: ch04-b05
          speaker: narrator
          text: 这一天就这样快快乐乐地过去，转眼到了傍晚。古老的冷杉间，风吼得比先前更加响亮，一阵接一阵从高高的枝头滚过。海蒂停下来听着，心里欢喜得满满的。她围着老树又蹦又跳，就像从未有过的巨大喜悦忽然落到了她身上。外公站在羊棚旁，静静望着她在树下欢快地跳舞。
        - id: ch04-b06
          speaker: narrator
          text: 忽然，远处响起一声尖亮的口哨。海蒂停了下来，外公也走出羊棚。高处的山羊一只接一只地蹦下山来，彼得就在羊群中间。海蒂欢叫着冲过去，钻进羊群，挨个向早晨认识的老朋友问好。来到小屋旁，羊群停住了。两只美丽纤秀的山羊跑向外公，一只白，一只棕。它们舔着他的手，因为外公掌心放着一点盐。这是他每天都备好的，专门等自家的山羊回来吃。
        - id: ch04-b07
          speaker: narrator
          text: 随后，彼得带着其余羊群下山，渐渐看不见了。海蒂却舍不得离开眼前这两个漂亮的小家伙。她温柔地摸摸这一只，又摸摸另一只，一会儿跑到它们这边，一会儿又绕到那边，心里喜欢得不得了，围着它们不停地蹦跳。
        - id: ch04-b08
          speaker: heidi
          text: 外公，它们是我们的吗？两只都是吗？你要把它们关进羊棚吗？以后它们会一直和我们住在一起吗？
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: 她的问题一个追着一个，外公每次都只来得及回答一个“是”。等两只山羊舔完盐，他便让海蒂拿来她的小碗和面包。海蒂马上照办。外公挤了白山羊的奶，把小碗装得满满的，又掰下一块面包给她。
        - id: ch04-b10
          speaker: grandfather
          text: 吃晚饭吧，吃完就上床睡。德特表姐还给你留了一个小包，睡衣和其他小东西都在里面。需要的话，就到柜子最底下找。我得把山羊关好，你快去睡个好觉。
        - id: ch04-b11
          speaker: heidi
          text: 晚安，外公！可是它们叫什么名字？外公，它们叫什么呀？
        - id: ch04-b12
          speaker: narrator
          text: 外公已经领着山羊走开了，海蒂一路追在后面问。
        - id: ch04-b13
          speaker: grandfather
          text: 白的叫小天鹅，棕的叫小熊。
        - id: ch04-b14
          speaker: heidi
          text: 晚安，小天鹅！晚安，小熊！
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 两只山羊已经进了羊棚，海蒂只好扯开嗓子向它们道晚安。随后，她坐到凳子上吃喝起来。风大得几乎要把她吹走，她便赶快吃完晚饭，跑回屋里，爬上自己的小床。没过多久，她就甜甜地睡熟了，睡得又香又沉，仿佛一位躺在丝绸软榻上的小公主。
    - id: ch05
      title: 暴风之夜
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 没过多久，趁着天边还留着一点微光，外公也上床了。他每天都要随着日出起身，而夏天的太阳总是很早就从山后爬上来。到了夜里，风越来越凶。一阵阵狂风撞在墙上，整座小屋都在发抖，古老的横梁吱吱嘎嘎，像是在呻吟。风又从烟囱里呼号着灌下来，听着好像有人在痛苦地哭喊。老冷杉也被吹得猛烈摇晃，不时有枝条折断，掉到地上。
        - id: ch05-b02
          speaker: narrator
          text: 半夜，老人忽然起了床。他低声念叨着，孩子大概会害怕。随后，他爬上梯子，来到海蒂的床边。
        - id: ch05-b03
          speaker: narrator
          text: 外面，月亮正和漆黑的云层争斗。云飞得很快，刚刚散开，让月亮清清亮亮地照出来，转眼又盖住它，四周重新变得一片漆黑。这一刻，月光恰好穿过圆窗，直直照在海蒂的小床上。
        - id: ch05-b04
          speaker: narrator
          text: 海蒂躺在那床厚重的被子下面，睡得两颊红润。她把脑袋安安稳稳地枕在圆圆的小胳膊上，稚嫩的脸上带着幸福的神情，像是正在做一个甜美的梦。老人站在床边，一直低头望着熟睡的孩子。后来，飞驰的黑云再次遮住月亮，干草棚里什么也看不见了，他这才转身下了梯子，回到自己的床上。
