audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    heidi:
      display_name: Heidi
      tts:
        delivery: direct, curious, and openhearted
        timbre: bright and youthful
        pace: lively
        pitch: high
    grandfather:
      display_name: Grandfather
      tts:
        delivery: gruff, spare, and commanding
