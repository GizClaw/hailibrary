  chapters:
    - id: ch01
      title: "CHAPTER II. AT HOME WITH GRANDFATHER"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The moment Dete was out of sight, the old man returned to his bench. He stayed there without a word, looking down at the ground while thick curls of smoke rose from his pipe. Heidi, meanwhile, was having a fine time exploring her new home. She looked all around until she found the goat shed built against the hut. When she peeked inside, she saw that it was empty. So she kept searching and soon came to the fir trees behind the hut. A strong breeze blew through them. Their highest branches rushed and roared overhead, and Heidi stood perfectly still to listen. When the sound faded, she started off again. She walked around the far corner of the hut and came back to the place where her grandfather sat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He had not moved at all. Heidi planted herself in front of him with her hands behind her back and stared. At last he looked up.
        - id: ch01-b03
          speaker: grandfather
          text: >-
            What do you want?
        - id: ch01-b04
          speaker: heidi
          text: >-
            I want to see what's inside your house.
        - id: ch01-b05
          speaker: grandfather
          text: >-
            Come along, then.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He stood and led the way toward the hut.
        - id: ch01-b07
          speaker: grandfather
          text: >-
            Bring your bundle of clothes.
        - id: ch01-b08
          speaker: heidi
          text: >-
            I won't need those anymore.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The old man turned and studied her. Heidi's dark eyes sparkled as she waited to see what was inside.
        - id: ch01-b10
          speaker: grandfather
          text: >-
            She's certainly quick enough. Why won't you need the clothes?
        - id: ch01-b11
          speaker: heidi
          text: >-
            I want to go around like the goats do, with their thin, light legs.
        - id: ch01-b12
          speaker: grandfather
          text: >-
            You may, if you like. But bring the clothes in. They belong in the cupboard.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Heidi did as she was told and followed him through the door. One good-sized room filled the whole lower floor of the hut. A table and one chair were the only furniture. Her grandfather's bed stood in one corner. The hearth was in another, with a large kettle hanging above it. On the far side, a wide door had been built right into the wall. That was the cupboard. Grandfather opened it for her. Some of his clothes hung inside. A couple of shirts, along with socks and handkerchiefs, lay on one shelf. A second shelf held plates, cups, and glasses. On a still higher shelf sat a round loaf of bread, smoked meat, and cheese. Everything Alm-Uncle needed to clothe and feed himself was kept inside that one cupboard.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Heidi hurried forward and pushed her bundle as far behind his things as she could, where nobody would find it easily. Then she looked around the room with care.
        - id: ch01-b15
          speaker: heidi
          text: >-
            Grandfather, where will I sleep?
        - id: ch01-b16
          speaker: grandfather
          text: >-
            Anywhere you want.
        - id: ch01-b17
          speaker: narrator
          text: >-
            That answer delighted Heidi. She began at once to search every nook and corner, determined to find the nicest possible place to sleep. Near Grandfather's bed, she noticed a short ladder leaning against the wall. Up she climbed, and a moment later she found herself in the hayloft. A great heap of fresh, sweet-smelling hay lay waiting there. In the wall was a round window, and when Heidi looked through it, she could see all the way down into the valley below.
        - id: ch01-b18
          speaker: heidi
          text: >-
            I'm sleeping up here! It's wonderful, Grandfather. Come and see how wonderful it is!
          emotion: happy
        - id: ch01-b19
          speaker: grandfather
          text: >-
            I already know what it's like.
        - id: ch01-b20
          speaker: heidi
          text: >-
            I'm making my bed now. But you have to bring me a sheet. A bed needs a sheet to lie on.
        - id: ch01-b21
          speaker: grandfather
          text: >-
            All right.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Grandfather searched through the cupboard and pulled out a long piece of coarse cloth. It was the only thing he had that could serve as a sheet. When he carried it up, Heidi had already shaped a fine little bed. She had piled extra hay at one end for a pillow and placed it so she could look comfortably through the round window while she lay there.
        - id: ch01-b23
          speaker: grandfather
          text: >-
            That's well done. Now we'll put on the sheet. Wait here first.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He went for another large bundle of hay and added it to the bed. That made it thick enough to keep Heidi from feeling the hard floor beneath her. Then he called for the sheet. Heidi got hold of it, but the coarse cloth was almost too heavy for her to carry. That heaviness would help once she lay down. The close, thick weave would stop the sharp haystalks from poking through and pricking her. The two of them spread it across the whole bed. Wherever the cloth was too long or too wide, Heidi quickly tucked it under the hay. When they finished, the little bed looked as neat and comfortable as anyone could wish. Heidi stood still and gazed thoughtfully at their work.
        - id: ch01-b25
          speaker: heidi
          text: >-
            Grandfather, we forgot something.
        - id: ch01-b26
          speaker: grandfather
          text: >-
            What did we forget?
        - id: ch01-b27
          speaker: heidi
          text: >-
            A blanket. When you go to bed, you get between the sheet and the blanket.
        - id: ch01-b28
          speaker: grandfather
          text: >-
            Is that how it works? What if I don't have one?
        - id: ch01-b29
          speaker: heidi
          text: >-
            That's all right, Grandfather. I can cover myself with more hay.
          emotion: calm
        - id: ch01-b30
          speaker: narrator
          text: >-
            She turned at once to gather an armful, but Grandfather stopped her. He climbed down to his bed and came back carrying a large, thick flax sack. He tossed it down beside her.
        - id: ch01-b31
          speaker: grandfather
          text: >-
            There. Isn't that better than hay?
        - id: ch01-b32
          speaker: narrator
          text: >-
            Heidi grabbed the sack and pulled with all the strength in her little body. She wanted to make it lie smooth and straight, but her small hands were not made for such a heavy job. Grandfather came to her aid. Together they tugged the thick sack into place and spread it tidily across the bed. When they were done, the whole bed looked so warm and comfortable that Heidi could do nothing but stand there and gaze at it in delight.
        - id: ch01-b33
          speaker: heidi
          text: >-
            What a wonderful blanket! The whole bed is beautiful. I wish it were nighttime so I could climb in right now.
          emotion: happy
        - id: ch01-b34
          speaker: grandfather
          text: >-
            Maybe we should eat something first. What do you think?
        - id: ch01-b35
          speaker: narrator
          text: >-
            All the excitement of making the bed had driven food from Heidi's mind. Now that she thought of it, she was terribly hungry. Since early that morning, before the long, hot climb, she had eaten only a piece of bread and drunk a small cup of weak coffee.
        - id: ch01-b36
          speaker: heidi
          text: >-
            Yes, I think we should.
        - id: ch01-b37
          speaker: grandfather
          text: >-
            Then let's go down, since we agree.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Grandfather followed the child down the ladder. He went straight to the hearth, pushed the large kettle aside, and pulled forward the smaller one hanging from the chain. Then he sat on the round-topped stool with its three legs and blew on the fire until a clear, bright flame sprang up. It did not take long for the kettle to boil. While he waited, Grandfather fixed a large piece of cheese on the end of a long iron fork. He held it over the flame, turning it around and around. Before long, both sides had toasted to a rich golden yellow.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Heidi watched every move with eager interest. All at once, a new idea seemed to come to her. She ran to the cupboard and began hurrying back and forth between it and the table. Grandfather paid no attention until the food was ready. Then he got up and carried over a jug and the toasted cheese. He found that Heidi had already laid the table neatly. The round loaf was there, along with two plates and two knives, each in the proper place. That morning, Heidi had taken careful note of everything in the cupboard. Now she knew which of those things they would need for their meal.
        - id: ch01-b40
          speaker: grandfather
          text: >-
            That's right. I'm glad you can think for yourself. But we're still missing something.
        - id: ch01-b41
          speaker: narrator
          text: >-
            He laid the toasted cheese on a slice of bread. Heidi looked at the jug, with its tempting steam, and hurried back to the cupboard. At first she saw only a small bowl left on the shelf. Then she spotted two glasses farther back. She brought the bowl and both glasses straight to the table.
        - id: ch01-b42
          speaker: grandfather
          text: >-
            Good. You know how to get things done. But where will you sit?
        - id: ch01-b43
          speaker: narrator
          text: >-
            Grandfather had the room's only chair. Heidi flew to the hearth, dragged the three-legged stool to the table, and sat down.
        - id: ch01-b44
          speaker: grandfather
          text: >-
            You found yourself a seat, though it's rather low. Even my chair wouldn't make you tall enough to reach the table. Never mind that now. It's time to eat.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Grandfather got up from the chair and filled the little bowl with milk. He set it on the chair and pushed the chair in front of Heidi's low stool. Now she had a table that was just her size. He brought her a large slice of bread and a piece of the golden toasted cheese, then told her to begin. Once she had everything she needed, he settled himself on the corner of the real table and started eating his own meal.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Heidi lifted the bowl in both hands and drank without stopping until it was empty. All the thirst from her hot journey had returned. She had been too eager even to breathe. At last she lowered the bowl and took a deep breath.
        - id: ch01-b47
          speaker: grandfather
          text: >-
            Did the milk taste good?
        - id: ch01-b48
          speaker: heidi
          text: >-
            I've never had milk this good.
        - id: ch01-b49
          speaker: grandfather
          text: >-
            Then have some more.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He filled her bowl right to the brim and put it before her again. By then Heidi had begun hungrily on her bread. First she spread the toasted cheese across it. The heat had made the cheese as soft as butter, and together they tasted delicious. Heidi sat eating with complete contentment. Now and then she stopped for another long drink of milk, then happily returned to her bread and cheese.
        - id: ch01-b51
          speaker: narrator
          text: >-
            After the meal, Grandfather went outside to prepare the goat shed. Heidi watched him sweep it clean and lay down fresh straw for the goats to sleep on. Next he went to the little shed by the well. There he cut several long, round sticks and a small round board. He bored holes in the board and fitted the sticks into them. Almost as if by magic, there stood a three-legged stool like his own, only taller. Heidi could only stare in astonishment.
        - id: ch01-b52
          speaker: grandfather
          text: >-
            What do you think that is?
        - id: ch01-b53
          speaker: heidi
          text: >-
            It's my stool. I know because it's so tall. And you made it in only a minute!
          emotion: surprised
        - id: ch01-b54
          speaker: grandfather
          text: >-
            She understands what she sees. Her eyes are in the right place.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Grandfather spoke those words to himself as he continued on his way around the hut. He hammered in a nail here and secured part of the door there. With his hammer, nails, and pieces of wood, he moved from one spot to the next. Wherever something needed to be mended or cleared away, he stopped and put it right. Heidi followed him step for step. Her eyes took in every movement of his hands, and each new thing she saw became another source of pleasure.
        - id: ch01-b56
          speaker: narrator
          text: >-
            In that way, the hours passed happily until evening came. Then the wind began to roar through the old fir trees more loudly than ever. Heidi stood listening with delight. The sound filled her heart so completely with gladness that she began to skip and dance around the ancient trees. She moved as though some joy greater than any she had ever known had suddenly come to her. Grandfather stood quietly by the shed and watched her.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Suddenly, a sharp whistle rang through the air. Heidi stopped in the middle of her dance, and Grandfather came all the way out of the shed. From the heights above, the goats appeared one after another. They came springing down the slope with Peter in their midst. Heidi gave a cry of joy and ran straight into the flock. She moved among them, greeting first one goat and then another, welcoming the friends she had met that morning.
        - id: ch01-b58
          speaker: narrator
          text: >-
            As the herd drew near the hut, the goats stopped. Then two beautiful, slender animals ran ahead to Grandfather. One was white and the other brown. They began licking his hands, for he held a little salt in them. He always had it ready when his two goats came home. Peter went on and disappeared with the rest of the herd. Heidi gently stroked first one goat and then the other. She ran from one side of them to the other, jumping about in her delight at the pretty creatures.
        - id: ch01-b59
          speaker: heidi
          text: >-
            Are these ours, Grandfather? Both of them? Will you put them in the shed? Will they stay here with us all the time?
          emotion: happy
        - id: ch01-b60
          speaker: narrator
          text: >-
            Her questions came so quickly that Grandfather barely had time to answer each one.
        - id: ch01-b61
          speaker: grandfather
          text: >-
            Yes. Yes. Yes. Yes.
        - id: ch01-b62
          speaker: narrator
          text: >-
            When the goats had licked up all the salt, he sent Heidi to bring her bowl and some bread. She was back in no time. Grandfather milked the white goat until her bowl was full, then broke off a piece of bread.
        - id: ch01-b63
          speaker: grandfather
          text: >-
            Eat your supper, then go up to bed. Cousin Dete left another small bundle for you. There's a nightgown and a few other things in it, down at the bottom of the cupboard, if you want them. I have to put the goats away. Off you go, and sleep well.
        - id: ch01-b64
          speaker: heidi
          text: >-
            Good night, Grandfather! Good night! But what are their names, Grandfather? What are they called?
        - id: ch01-b65
          speaker: narrator
          text: >-
            She ran after him and the goats as she called.
        - id: ch01-b66
          speaker: grandfather
          text: >-
            The white one is Little Swan. The brown one is Little Bear.
        - id: ch01-b67
          speaker: heidi
          text: >-
            Good night, Little Swan! Good night, Little Bear!
          emotion: happy
        - id: ch01-b68
          speaker: narrator
          text: >-
            Heidi called the names as loudly as she could, because Little Swan and Little Bear were already inside the shed. Then she sat down on her new seat and began to eat her bread and drink the fresh milk. The wind was so strong that it almost blew her away. She made haste, finished her supper, and went indoors. Then she climbed the ladder and settled into the bed she had made. Very soon, she was sleeping as sweetly and soundly as any young princess resting on a couch of silk.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Grandfather went to bed not long afterward, while twilight still lingered. He rose every morning with the sun, and in summer the sun climbed over the mountains very early.
        - id: ch01-b70
          speaker: narrator
          text: >-
            During the night, the wind turned wild. Again and again, powerful gusts struck the walls. The whole hut trembled, and its old beams groaned and creaked under the strain. The storm came howling and wailing down the chimney like the voices of people in pain. It raged with such fury among the old fir trees that branches snapped here and there and crashed to the ground.
        - id: ch01-b71
          speaker: narrator
          text: >-
            In the middle of the night, the old man got up.
        - id: ch01-b72
          speaker: grandfather
          text: >-
            The child will be frightened.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Grandfather climbed the ladder into the loft and went to stand beside Heidi's bed. Outside, the moon struggled against dark clouds that were racing across the sky. One moment the clouds swept aside, leaving the moon clear and bright. The next moment they rushed over it, and everything became dark again. Just then, the clouds opened. Moonlight streamed through the little round window and fell directly across Heidi's bed.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Heidi lay beneath the heavy cover, with only her head showing. Her cheeks were rosy with sleep, and her head rested peacefully on one small, round arm. A happy look lay across her young face, as though she were dreaming of something pleasant. The old man stood there, looking down at the sleeping child. He did not move until the clouds swept across the moon once more and the light vanished from the loft. When he could see her no longer, he turned and went back to bed.
