audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
    john:
      display_name: 约翰
      tts:
        delivery: 老实谨慎，逞强时仍透着紧张
        timbre: 浑厚朴实
        pace: 稍慢
        pitch: 中低音
    cook:
      display_name: 厨娘
      tts:
        delivery: 直率持重，感叹时带着老仆人的笃定
        timbre: 温厚略沙哑
        pace: 适中
        pitch: 中音
    sesemann:
      display_name: 赛赛曼先生
      tts:
        delivery: 爽直果断，诙谐中带着一家之主的威严
        timbre: 明朗沉稳
        pace: 从容有力
        pitch: 中低音
    doctor:
      display_name: 医生
      tts:
        delivery: 亲切睿智，轻松时幽默，诊断时坚定
        timbre: 温暖清亮
        pace: 平稳自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 每天敞开的大门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一连好几天，罗滕迈尔小姐都很少说话，像是被什么心事缠住了。黄昏一到，她穿过房间和长廊，总要小心地回头看，还会往暗处瞧一眼。她仿佛总觉得有人在背后悄悄跟着，冷不防就会扯住她的裙子。
        - id: ch01-b02
          speaker: narrator
          text: 有些地方，她再也不肯一个人去。楼上那些宽敞的客房，楼下那间神秘的大厅，都得让蒂内特陪着。她嘴上说，也许会有东西需要拿上拿下。那间大厅里走一步就有回声，墙上那些戴白色大领子的老参议员，也一直从画框里严肃地往下看，一动也不动。
        - id: ch01-b03
          speaker: narrator
          text: 蒂内特也照着她的样子做。只要有事上楼或下楼，就会叫塞巴斯蒂安来帮忙，嘴上总说有一件东西自己拿不动。塞巴斯蒂安若奉命去远处的房间，又会叫上约翰，说取东西时也许用得着他。其实从来没有什么可搬的，他们谁都可以独自去。不过约翰每次都乐意作伴，因为谁也说不准，哪一天他也得请塞巴斯蒂安陪自己走一趟。
        - id: ch01-b04
          speaker: narrator
          text: 楼上的人这样来来去去。楼下那位在宅子里做了多年的厨娘，只管站在锅碗中间摇头叹气。
        - id: ch01-b05
          speaker: cook
          text: 真想不到，我活到今天，竟会碰上这种怪事！
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: 赛赛曼先生的宅子里，的确有件古怪又神秘的事。每天一早，仆人们来到楼下，都会看见临街的大门敞得大大的，可附近一个人影也没有。
        - id: ch01-b07
          speaker: narrator
          text: 最初几天，大家吓得把所有房间和角落搜了个遍。他们以为有贼藏在屋里，半夜偷了东西逃走。可是什么也没丢，所有物件都好好待在原处。
        - id: ch01-b08
          speaker: narrator
          text: 到了晚上，他们给大门上两道锁，又横着插好木门闩，以为这回一定万无一失。可第二天一早，门还是开着。仆人们又怕又急，于是一天比一天起得早，却总是赶不上开门的人。他们来到楼下时，四周的一切都还在沉睡，邻居家的门窗也关得严严实实。
        - id: ch01-b09
          speaker: narrator
          text: 罗滕迈尔小姐劝了又劝，塞巴斯蒂安和约翰终于壮起胆子，答应在大厅旁边的房间守一夜，看看究竟会发生什么。她找来主人收藏的几件武器，又给塞巴斯蒂安一瓶烈酒。万一真要交手，这些东西可以让两个人不至于临阵胆怯。
        - id: ch01-b10
          speaker: narrator
          text: 守夜那天，两人一坐下就开始喝壮胆酒。起初，他们的话越来越多。后来，困意涌了上来，他们靠着椅背，渐渐没了声音。
        - id: ch01-b11
          speaker: narrator
          text: 午夜的钟声响过，塞巴斯蒂安醒了。他连声叫约翰，可约翰的脑袋左一歪、右一倒，怎么也不肯醒。塞巴斯蒂安这时睡意全无，只好听着四周的动静。宅子里静得像一只老鼠也没有，连街上的声音都消失了。
        - id: ch01-b12
          speaker: narrator
          text: 这份安静让人心里发毛。塞巴斯蒂安不敢大声叫，只能轻轻摇晃同伴。直到一点钟敲响，约翰才睁开眼，想起自己为什么坐在这里。他站起来，硬摆出一副勇敢的样子。
        - id: ch01-b13
          speaker: john
          text: 走吧，塞巴斯蒂安。我们到外面瞧瞧出了什么事。你别怕，跟着我就行。
        - id: ch01-b14
          speaker: narrator
          text: 约翰把房门完全推开，跨进前厅。就在这一刻，一股风突然从敞开的临街大门灌进来，吹灭了他手里的灯。他猛地往后一退，差点把身后的塞巴斯蒂安撞翻。接着，他一把抓住同伴，把人拖回房里，赶紧关上门，又使足力气把钥匙拧到再也拧不动。
        - id: ch01-b15
          speaker: narrator
          text: 约翰划亮火柴，重新点起蜡烛。刚才他宽大的身子挡在前头，塞巴斯蒂安既没看见敞开的大门，也没感觉到那阵风。可现在借着烛光一看，他不由得惊叫一声。约翰浑身发抖，脸白得像鬼。
        - id: ch01-b16
          speaker: sebastian
          text: 怎么了？你刚才在外面看见什么了？
        - id: ch01-b17
          speaker: john
          text: 门开了一半。台阶顶上站着一个白影，就站在那里，然后一下子不见了。
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: 塞巴斯蒂安只觉得血都凉了。两个人紧紧挨着坐下，谁也不敢再动。天终于亮了，街上重新传来人声，他们才一起走出房间，关好临街的大门，再上楼向罗滕迈尔小姐报告这一夜的经历。
        - id: ch01-b19
          speaker: narrator
          text: 罗滕迈尔小姐为了等消息，整夜没睡。两人刚把所有经过讲完，她马上给赛赛曼先生写信。这封信可不同于他一辈子收到过的任何一封信。她说自己吓得手指僵硬，几乎握不住笔，请他想尽办法立刻回来。大门每天早晨都敞开着，宅子毫无遮拦，全家人的性命都没了保障。至于这些怪事最终会带来多么可怕的后果，更是谁也说不准。
        - id: ch01-b20
          speaker: narrator
          text: 赛赛曼先生回信说，生意上的事让他无法立刻回家。他虽然惊讶，还是希望幽灵已经消失了。如果它继续作怪，就请祖母来想办法。她一定能让幽灵再也不敢登门。
        - id: ch01-b21
          speaker: narrator
          text: 罗滕迈尔小姐觉得，他根本没有认真看待这件事，便马上写信给祖母。那边的答复也没让她满意，有几句话甚至叫她十分恼火。祖母说，她不愿意因为罗滕迈尔以为自己见了鬼，就从荷尔斯泰因再跑一趟法兰克福。她认识这宅子以来，从没见过幽灵。如今即便真有一个，也一定是活的。罗滕迈尔应该对付得了，不然就去找巡夜人帮忙。
    - id: ch02
      title: 赛赛曼先生回来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 罗滕迈尔小姐可不愿继续担惊受怕。之前，她怕孩子们听说以后再也不肯独处，会给自己添麻烦，所以一直瞒着她们。现在，她径直走进书房，压低声音，把所有怪事都说了出来。
        - id: ch02-b02
          speaker: clara
          text: 我一分钟也不能一个人待着！爸爸必须回来。罗滕迈尔小姐，你晚上要睡在我房里。海蒂也不能独自睡，幽灵可能会伤害她！
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 克拉拉越说越激动。她坚持让大家睡在同一间屋里，整夜都点着灯。蒂内特住在隔壁，塞巴斯蒂安和约翰则到楼上来，在前厅守上一夜。幽灵只要一出现在台阶上，他们就立刻大喊，把它吓跑。
        - id: ch02-b04
          speaker: narrator
          text: 罗滕迈尔小姐费了很大劲，才让克拉拉安静下来。她答应马上写信给孩子的父亲，也答应把自己的床搬到克拉拉房里，一刻都不让她单独待着。不过，所有人不能挤在同一间屋里。海蒂若是害怕，可以让蒂内特去她的房间陪着。
        - id: ch02-b05
          speaker: narrator
          text: 海蒂从没听说过幽灵。比起鬼，她更怕蒂内特，所以马上表示自己不在意幽灵，夜里宁愿一个人睡。
        - id: ch02-b06
          speaker: narrator
          text: 罗滕迈尔小姐又写了一封信。她告诉赛赛曼先生，宅子里这些无法解释的怪事，已经伤害了克拉拉柔弱的身体，而且最坏的后果随时可能出现。遇到这种情形，癫痫和圣维特舞蹈症常会突然发作。若不马上消除全家恐慌的根源，克拉拉就可能染上其中一种病。
        - id: ch02-b07
          speaker: narrator
          text: 这封信奏效了。两天后，赛赛曼先生站在自家门前，使劲拉响门铃。所有人都从宅子各处冲出来，惊恐地彼此张望。他们以为那个胆大包天的幽灵，竟然在白天作怪了。
        - id: ch02-b08
          speaker: narrator
          text: 塞巴斯蒂安小心地从半掩的百叶窗后偷偷看出去。门铃又猛响了一阵。这回任谁都听得出来，拉铃的绝对是一只活人的手。他认出那是谁，立刻没命地冲出房间，一头栽下楼梯。到了楼下，他赶紧爬起来，一把打开临街的大门。
        - id: ch02-b09
          speaker: narrator
          text: 赛赛曼先生匆匆打过招呼，片刻也不停留，直接上楼去看女儿。克拉拉一见他就欢呼起来。他发现孩子精神很好，显然和平常一样健康，脸上的忧虑才渐渐散开。克拉拉亲口告诉他，自己一点病也没有。她见到爸爸实在太高兴了，因为是幽灵把爸爸引回家，她现在甚至庆幸宅子闹了鬼。
        - id: ch02-b10
          speaker: sesemann
          text: 那么，你们那位幽灵近来怎么样？
        - id: ch02-b11
          speaker: narrator
          text: 他转向罗滕迈尔小姐，眼里带着笑意。
        - id: ch02-b12
          speaker: rottenmeier
          text: 我向您保证，这不是玩笑。等到明天早晨，您也笑不出来了。宅子里这些事只能说明，从前发生过什么可怕的事，却一直被人瞒着。
        - id: ch02-b13
          speaker: sesemann
          text: 这件事我可不知道。不过，请你别怀疑我那些品行高尚的祖先。现在劳驾你叫塞巴斯蒂安到餐厅来，我要单独问他几句话。
        - id: ch02-b14
          speaker: narrator
          text: 赛赛曼先生知道，塞巴斯蒂安和罗滕迈尔小姐一向不大合得来。他对这场闹鬼，心里已经有了猜测。塞巴斯蒂安一出现，他就让年轻人走近些。
        - id: ch02-b15
          speaker: sesemann
          text: 老实告诉我，你是不是扮成幽灵，故意吓唬罗滕迈尔小姐，拿她取乐？
        - id: ch02-b16
          speaker: sebastian
          text: 绝对没有，先生，我以名誉担保！请您别这样想，这件事也弄得我非常不安。
        - id: ch02-b17
          speaker: narrator
          text: 塞巴斯蒂安说得十分诚恳，一看就知道没有撒谎。
        - id: ch02-b18
          speaker: sesemann
          text: 好吧。既然不是你，明天早晨我就让你和约翰看看，幽灵在大白天是什么模样。你这么高大强壮，竟然会被鬼吓跑，真该害臊！
        - id: ch02-b19
          speaker: sesemann
          text: 现在替我给那位医生老朋友捎个口信。代我问候他，请他今晚九点一定过来。我特意从巴黎搭快车回来，就是要找他诊治。病得这么重，我还得留他住一夜。请他事先安排好。听明白了吗？
        - id: ch02-b20
          speaker: sebastian
          text: 明白，先生。我一定照您的吩咐办。
        - id: ch02-b21
          speaker: narrator
          text: 赛赛曼先生回到女儿身边，叫她不用再怕。他很快就会查清这位幽灵的底细，让它再也不能作怪。
    - id: ch03
      title: 月光下的白影
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 晚上九点整，孩子们已经上床，罗滕迈尔小姐也回了房间，医生准时来到。他头发灰白，面色红润，有一双明亮而和善的眼睛。进门时，他还满脸担忧。可一看见自己的病人，马上笑出声来，还拍了拍他的肩膀。
        - id: ch03-b02
          speaker: doctor
          text: 看你的气色，可真不像一个病得需要我陪夜的人。
        - id: ch03-b03
          speaker: sesemann
          text: 别急，老朋友。等我们捉住真正需要你陪夜的那一个，他的脸色会难看得多。
        - id: ch03-b04
          speaker: doctor
          text: 原来宅子里真有个病人，而且还得先捉住他？
        - id: ch03-b05
          speaker: sesemann
          text: 情形比这更糟！宅子里有鬼，我家闹幽灵了！
        - id: ch03-b06
          speaker: narrator
          text: 医生听完，放声大笑。
        - id: ch03-b07
          speaker: sesemann
          text: 医生，你可真会同情人！可惜罗滕迈尔不在这里。她深信我家某位老祖先犯过滔天大罪，现在正在宅子里来回游荡，为自己赎罪。
        - id: ch03-b08
          speaker: doctor
          text: 她是怎么认识这位老祖先的？
        - id: ch03-b09
          speaker: narrator
          text: 医生还是觉得十分有趣。赛赛曼先生便告诉他，宅子里人人都作证，每晚有人把临街大门打开。为防万一，他准备了两把装好子弹的手枪。
        - id: ch03-b10
          speaker: narrator
          text: 如果这只是某个仆人的朋友编出来的把戏，趁主人不在，故意吓唬全家，那么朝天放一枪，也能让那人好好受一回惊。如果来的是贼，那人也许先叫大家相信宅子闹鬼，以后再来偷窃。这样即使有人听见声响，也会以为是幽灵，谁也不敢跑出来阻拦。碰上这种情形，手里有一把趁手的武器同样少不了。
        - id: ch03-b11
          speaker: narrator
          text: 两个人来到塞巴斯蒂安和约翰守过夜的那个房间，准备在那里待上一整夜。桌上放着一瓶葡萄酒，方便他们长时间坐着时偶尔喝一口，提提精神。酒瓶旁边摆着两把手枪，房里还点起两支粗大的蜡烛。赛赛曼先生打定主意，绝不在半明半暗的光线里等待幽灵。
        - id: ch03-b12
          speaker: narrator
          text: 他们紧紧关上房门，免得光漏到前厅，把幽灵吓跑。随后，两位先生舒舒服服地靠进扶手椅，聊起各种事情，时不时喝一大口酒。不知不觉，钟敲了十二下。
        - id: ch03-b13
          speaker: doctor
          text: 幽灵闻见我们的气味，今晚不敢来了。
        - id: ch03-b14
          speaker: sesemann
          text: 再等一会儿。它平常要到一点钟才出现。
        - id: ch03-b15
          speaker: narrator
          text: 两个人接着谈话。一点钟到了。屋里没有一点声音，外面的街道也静悄悄的。医生忽然竖起手指。
        - id: ch03-b16
          speaker: doctor
          text: 嘘！赛赛曼，你听见了吗？
        - id: ch03-b17
          speaker: narrator
          text: 他们安静地听着。木门闩被人轻轻推开，钥匙在锁孔里转动，接着，大门开了。赛赛曼先生伸手去拿手枪。
        - id: ch03-b18
          speaker: doctor
          text: 你不会是害怕了吧？
        - id: ch03-b19
          speaker: sesemann
          text: 小心一点总没有坏处。
        - id: ch03-b20
          speaker: narrator
          text: 赛赛曼先生低声回答后，一手握枪，一手举起蜡烛，跟在医生身后。医生也拿着灯和手枪，轻轻走在前面。两个人跨进前厅。月光穿过敞开的大门，落在一个白色身影上。那个身影就站在门口，一动不动。
        - id: ch03-b21
          speaker: doctor
          text: 谁在那里？
        - id: ch03-b22
          speaker: narrator
          text: 医生的喝问在前厅里回荡。两个人举着烛火和武器，一步步朝白影走过去。白影转过身，发出一声低低的惊叫。原来，那是海蒂。她穿着白色小睡衣，光着双脚，睁大惊惶的眼睛，盯着眼前的灯火和手枪。她从头抖到脚，像风里的一片叶子。
        - id: ch03-b23
          speaker: narrator
          text: 两位先生吃惊地看着彼此。
        - id: ch03-b24
          speaker: doctor
          text: 赛赛曼，我看这就是你那个送水的小姑娘。
        - id: ch03-b25
          speaker: sesemann
          text: 孩子，这是怎么回事？你想做什么？为什么跑到楼下来？
        - id: ch03-b26
          speaker: narrator
          text: 海蒂吓得脸上没有一点血色。她的声音轻得几乎听不见。
        - id: ch03-b27
          speaker: heidi
          text: 我不知道。
          emotion: fearful
        - id: ch03-b28
          speaker: doctor
          text: 这件事交给我吧，赛赛曼。你回椅子上坐着，我送孩子上楼睡觉。
        - id: ch03-b29
          speaker: narrator
          text: 医生放下手枪，轻轻牵住海蒂的手，带她上楼。两个人并肩往上走。
        - id: ch03-b30
          speaker: doctor
          text: 别害怕，没有什么可怕的。什么事也没有，安安静静走就好。
          emotion: calm
    - id: ch04
      title: 医生的药方
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了海蒂的房间，医生先把蜡烛放到桌上，又抱起孩子，把她安顿在床里，仔细盖好被子。随后，他坐在床边耐心等着。过了一会儿，海蒂终于平静了一些，不再像刚才那样浑身发抖。医生这才握住她的手，用安抚的语气问她。
        - id: ch04-b02
          speaker: doctor
          text: 好了，现在好些了吗？告诉我，你刚才想去哪里？
          emotion: calm
        - id: ch04-b03
          speaker: heidi
          text: 我哪里也不想去。我不知道自己下了楼，忽然就已经在那里了。
        - id: ch04-b04
          speaker: doctor
          text: 我懂了。你刚才是不是在做梦？梦里好像真的看见了什么，也听见了什么？
        - id: ch04-b05
          speaker: heidi
          text: 是的，我每天夜里都做梦，而且总是同一个梦。我好像又回到了爷爷身边。我听见屋外枞树的声音，也看见星星亮得不得了。我赶紧打开门，跑到外面去。那里的一切都那么美！可是醒来以后，我还在法兰克福。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 海蒂说着，拼命忍住堵在喉咙里的哭声。
        - id: ch04-b07
          speaker: doctor
          text: 你身上有哪里疼吗？头疼不疼？背疼不疼？
        - id: ch04-b08
          speaker: heidi
          text: 都不疼。只是这里像压着一块大石头。
        - id: ch04-b09
          speaker: doctor
          text: 是不是像吃了什么东西，堵在里面咽不下去？
        - id: ch04-b10
          speaker: heidi
          text: 不是那样。那东西沉沉的，像是我非常想哭。
        - id: ch04-b11
          speaker: doctor
          text: 那么，你会痛痛快快哭出来吗？
        - id: ch04-b12
          speaker: heidi
          text: 不行，我不能哭。罗滕迈尔小姐不许我哭。
        - id: ch04-b13
          speaker: doctor
          text: 所以，你只能把眼泪全咽回去，对吗？你在法兰克福快乐吗？
        - id: ch04-b14
          speaker: heidi
          text: 快乐。
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 她答得很轻，听起来却更像是“不快乐”。
        - id: ch04-b16
          speaker: doctor
          text: 从前，你跟爷爷住在哪里？
        - id: ch04-b17
          speaker: heidi
          text: 住在山上。
        - id: ch04-b18
          speaker: doctor
          text: 山上没什么好玩的吧？有时候很无聊，是不是？
        - id: ch04-b19
          speaker: heidi
          text: 不，不！山上美极了，真的美极了！
          emotion: sad
        - id: ch04-b20
          speaker: narrator
          text: 海蒂再也说不下去。她想起了从前的生活，又经历了刚才的惊吓，还把眼泪压在心里那么久。所有这些一下子涌来，已经超过了孩子所能承受的分量。泪水接连不断地落下，她终于再也忍不住，放声大哭起来。
        - id: ch04-b21
          speaker: narrator
          text: 医生站起身，温柔地把她的头放到枕上。
        - id: ch04-b22
          speaker: doctor
          text: 哭吧，把眼泪都哭出来，这样会好受一些。哭完就睡觉，明天一切都会好的。
          emotion: calm
        - id: ch04-b23
          speaker: narrator
          text: 医生离开房间，下楼去找赛赛曼先生。他重新坐进朋友对面的扶手椅，开始说明自己的诊断。
        - id: ch04-b24
          speaker: doctor
          text: 赛赛曼，先告诉你，这个小姑娘会梦游。每晚打开大门，把全家吓得不得安宁的幽灵，就是她。
        - id: ch04-b25
          speaker: doctor
          text: 还有，这孩子思乡成疾，已经瘦得只剩一把骨头。再这样下去，她真要变成一副骨架了。我们必须马上行动。
        - id: ch04-b26
          speaker: doctor
          text: 梦游是神经过度紧张引起的，只有一个办法，就是送她回去，让她呼吸故乡山间的空气。那样，她的神经才能平静下来。至于折磨她的乡愁，也只有同一个治法。所以，明天就让孩子动身回家。这就是我的药方。
        - id: ch04-b27
          speaker: narrator
          text: 赛赛曼先生站起身，忧心忡忡地在房间里来回走。
        - id: ch04-b28
          speaker: sesemann
          text: 什么！这孩子会梦游，还病了？她在我家思乡成疾，瘦成这个样子，竟然没有一个人看出来，也没有一个人知道？她来的时候健康又快乐，现在你却要我把一个可怜的小骷髅送回她爷爷那里？你怎么会想到让我做这种事？
          emotion: surprised
        - id: ch04-b29
          speaker: sesemann
          text: 我不能这么做！你来照料她，随你用什么办法，先让她恢复健康，然后她再回家。可是在那之前，你必须替她治病。
        - id: ch04-b30
          speaker: doctor
          text: 赛赛曼，你得想清楚自己在做什么。这种病不是药丸和药粉能治好的。孩子的身体本来就不强健。如果马上送她回去，山里的空气也许还能让她康复。要是不送她走，后果就不一样了。难道你宁愿她最后抱着病回家，也不愿她现在回去吗？
        - id: ch04-b31
          speaker: narrator
          text: 赛赛曼先生停下脚步。医生的话让他猛然明白，事情有多么严重。
        - id: ch04-b32
          speaker: sesemann
          text: 医生，既然事情是这样，那确实只有一条路，而且必须马上安排。
        - id: ch04-b33
          speaker: narrator
          text: 两个人在房里来回走了一阵，把接下来该做的事情一一商量妥当。从他们最初坐下来守夜，已经过去了很长时间，医生便告辞了。这一回，不再需要别人去碰那扇门。赛赛曼先生亲自打开前厅的大门，清晨的亮光从外面一直照进宅子。
