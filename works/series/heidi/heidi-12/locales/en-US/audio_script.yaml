  chapters:
    - id: ch01
      title: Strange Nights in the House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For several days, Fraulein Rottenmeier had been unusually quiet and lost in thought. At twilight, she moved from room to room and along the long corridors with great caution. Again and again she glanced behind her or peered into a dark corner. She seemed to expect someone to follow without a sound, then suddenly reach out and tug her dress. Before long, she would no longer enter certain parts of the house alone.
        - id: ch01-b02
          speaker: narrator
          text: If she had to visit the grand guest rooms on the upper floor, she always called Tinette along, saying there might be something to carry up or down. She did the same when she went into the large, mysterious council chamber below. Every footstep echoed through that room. From their frames, old senators in enormous white collars looked down with solemn faces, never moving at all.
        - id: ch01-b03
          speaker: narrator
          text: Tinette began doing exactly the same thing. Whenever she had work upstairs or down, she called Sebastian to help with something she claimed she could not carry alone. When Sebastian was sent to one of the distant rooms, he took John in case he needed help bringing back whatever was required. John always agreed, though there was never anything to carry and either man could easily have gone alone. He knew that before long, he might want Sebastian to perform the same service for him.
        - id: ch01-b04
          speaker: narrator
          text: Down in the kitchen, the cook had served the family for years. She stood over her pots and kettles, shaking her head.
        - id: ch01-b05
          speaker: cook
          text: I never thought I'd live to see such a thing.
        - id: ch01-b06
          speaker: narrator
          text: Something truly strange was happening in Herr Sesemann's house. Each morning, the servants came downstairs and found the front door standing wide open. No one was anywhere near it.
        - id: ch01-b07
          speaker: narrator
          text: At first, everyone searched every room and corner in alarm. They thought a thief must have hidden inside, then slipped away at night with stolen goods. But nothing had been touched. Everything was exactly where it belonged.
        - id: ch01-b08
          speaker: narrator
          text: Every night they locked the door twice and fastened the wooden bar across it for extra safety. It made no difference. The door stood open again the next morning. The frightened servants began rising earlier and earlier, hoping to catch whoever did it. Yet no matter how early they came down, the door had opened first. Everyone nearby was still wrapped in sleep, and every door and window in the neighboring houses remained shut tight.
        - id: ch01-b09
          speaker: narrator
          text: At last, after much urging from Fraulein Rottenmeier, Sebastian and John gathered enough courage to keep watch. They would spend the night in the room beside the council chamber and see what happened. Fraulein Rottenmeier found some of Herr Sesemann's weapons and gave them to Sebastian. She also supplied a bottle of spirits, so their courage would hold if they had to fight.
    - id: ch02
      title: The First Watch
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the chosen night, the two men sat down and immediately tried some of the strengthening drink. At first it made them very talkative. Then it made them very sleepy. They leaned back in their chairs and fell silent.
        - id: ch02-b02
          speaker: narrator
          text: When midnight struck, Sebastian woke and called to John. John was not easy to rouse. His head rolled from side to side, and he kept sleeping. Sebastian listened carefully. He was wide awake now. The house was as still as a mouse, and even the sounds from the street had died away.
        - id: ch02-b03
          speaker: narrator
          text: That ghostly silence made Sebastian too uneasy to sleep again. He did not even dare raise his voice to wake John. Instead, he reached over and gently shook him. At last, when the clock struck one, John opened his eyes and slowly remembered why he was sitting in a chair instead of lying in bed. Then he got to his feet and put on a great show of bravery.
        - id: ch02-b04
          speaker: john
          text: Come on, Sebastian. We have to look outside and see what's happening. There's no need to be scared. Just stay behind me.
        - id: ch02-b05
          speaker: narrator
          text: John opened the room door wide and stepped into the hall. At that instant, a gust rushed in through the open front door and blew out the light in his hand. John sprang backward so violently that he nearly knocked Sebastian over. He clutched his companion, pulled him back into the room, slammed their door, and turned the key as far as he could make it go.
        - id: ch02-b06
          speaker: narrator
          text: John struck a match and lit his candle again. Sebastian had not seen the open door or felt the wind behind John's broad body, so he had no idea what had happened. Then he saw John in the candlelight and cried out. John was white as a ghost and trembling all over.
        - id: ch02-b07
          speaker: sebastian
          text: What happened? What did you see out there?
        - id: ch02-b08
          speaker: john
          text: The door was partly open. There was a white figure at the top of the steps. It stood there, and then it vanished all at once.
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: Sebastian felt his blood turn cold at the story. The two men sat down as close together as they could. Neither one dared move again until morning broke and the streets outside began to come alive. Only then did they leave the room together. They shut the front door behind them and hurried upstairs to tell Fraulein Rottenmeier everything they had experienced.
        - id: ch02-b10
          speaker: narrator
          text: She was ready and waiting for them. The worry of wondering what they might report had kept her awake all night. As soon as they had told her every detail, she sat down and wrote straight to Herr Sesemann. Never in his life had he received a letter like it.
        - id: ch02-b11
          speaker: rottenmeier
          text: My fingers are so stiff with fear that I can hardly write. You must arrange to come home at once. Dreadful things are happening here, and no one can explain them. Every morning the front door stands open. No one in the house feels that life is safe anymore, and there is no telling what terrible thing may happen next.
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: Herr Sesemann replied that he could not possibly leave his business and return at once. The ghost story astonished him, but he hoped the ghost had disappeared by then. If it kept troubling the household, Fraulein Rottenmeier should ask his mother to come. He felt sure she would find a way to deal with it and stop it from haunting the house.
        - id: ch02-b13
          speaker: narrator
          text: Fraulein Rottenmeier disliked the tone of his letter. He was not taking the danger seriously enough. She wrote to Frau Sesemann at once, but that answer pleased her no better. Some of its remarks seemed downright insulting.
        - id: ch02-b14
          speaker: narrator
          text: Frau Sesemann wrote that she had no desire to make the long trip from Holstein to Frankfurt just because Rottenmeier imagined she saw ghosts. There had never been a ghost in the house during all the years she had known it. If one had appeared now, then it must be a living ghost, and Rottenmeier ought to be able to deal with it herself. If she could not manage that, she had better send for the watchman to help.
        - id: ch02-b15
          speaker: narrator
          text: Fraulein Rottenmeier refused to spend another day in fear. Until then, she had told the children nothing. She knew they would never stay alone once they heard, and that would be inconvenient for her. Now she marched straight into the study and told Clara and Heidi the entire story in a low, mysterious voice.
        - id: ch02-b16
          speaker: clara
          text: I can't stay alone for another minute! Papa has to come home, and you must sleep in my room. Heidi can't be left alone either. The ghost might hurt her! We should all sleep in one room with the light on all night. Tinette can stay next door, and Sebastian and John can sit in the upstairs hall. The moment the ghost appears on the steps, they can shout and scare it away!
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: Clara grew more and more excited, and Fraulein Rottenmeier had great trouble calming her. She promised to write to Clara's father at once. She would have her own bed moved into Clara's room and would not leave her alone for a moment. They could not all sleep together, she said. If Heidi was frightened, Tinette could go into the child's room.
        - id: ch02-b18
          speaker: narrator
          text: Heidi had never heard of ghosts before. Still, she feared Tinette much more than any ghost.
        - id: ch02-b19
          speaker: heidi
          text: I don't mind the ghost. I'd rather sleep by myself.
        - id: ch02-b20
          speaker: narrator
          text: Fraulein Rottenmeier sat down and wrote Herr Sesemann another letter. This time she declared that the unexplained events in the house had badly affected his daughter's delicate health. Unless the cause of the general alarm was removed, the worst consequences might follow. In cases like this, she warned, epileptic fits and Saint Vitus's dance could begin suddenly, and Clara might be struck by either one.
    - id: ch03
      title: Herr Sesemann Comes Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The letter worked. Two days later, Herr Sesemann stood at his front door and pulled the bell so hard that everyone came running from every part of the house. They stared at one another in terror, certain that the ghost had begun its tricks in broad daylight.
        - id: ch03-b02
          speaker: narrator
          text: Sebastian cautiously peered through a half-closed shutter. At once, another violent ring sounded through the house. No one could mistake it now. A very real, very unghostly hand had given the bell a mighty pull. Sebastian recognized the hand, rushed wildly from the room, and tumbled head over heels down the stairs. He picked himself up at the bottom and flung open the street door.
        - id: ch03-b03
          speaker: narrator
          text: Herr Sesemann gave Sebastian a brief greeting and hurried straight upstairs to his daughter's room. Clara welcomed him with a cry of joy. She looked lively and seemed as well as ever. The worried frown slowly left his face as he heard from Clara herself that nothing was wrong with her. She was so delighted to see him that she was actually glad about the ghost, since it had brought him home again.
        - id: ch03-b04
          speaker: sesemann
          text: So, how is the ghost doing?
        - id: ch03-b05
          speaker: narrator
          text: He turned to Fraulein Rottenmeier with an amused sparkle in his eyes.
        - id: ch03-b06
          speaker: rottenmeier
          text: I assure you, this is not funny. By tomorrow morning, you won't be laughing. What is happening here points to some terrible deed from the past that was hidden away.
        - id: ch03-b07
          speaker: sesemann
          text: I know nothing about that. But please don't cast suspicion on my respectable ancestors. Now, would you send Sebastian to the dining room? I need to speak with him alone.
        - id: ch03-b08
          speaker: narrator
          text: Herr Sesemann knew that Sebastian and Fraulein Rottenmeier did not get along very well. He had his own suspicions about the whole scare.
        - id: ch03-b09
          speaker: sesemann
          text: Come here, my boy, and be honest with me. Have you been pretending to be a ghost just to make trouble for Fraulein Rottenmeier?
        - id: ch03-b10
          speaker: sebastian
          text: No, sir, on my honor! Please don't think that. This business has made me very uneasy too.
        - id: ch03-b11
          speaker: narrator
          text: Sebastian's answer was plainly sincere.
        - id: ch03-b12
          speaker: sesemann
          text: In that case, tomorrow morning I'll show you and John what ghosts look like by daylight. You should be ashamed, Sebastian. A big, strong fellow like you, running from a ghost! Now take a message to my old friend the doctor. Give him my regards and ask him to come here tonight at nine without fail. Tell him I rushed here from Paris to consult him. The case is so bad that he'll have to spend the night. Make sure he understands.
        - id: ch03-b13
          speaker: sebastian
          text: Yes, sir. I'll take care of it exactly as you asked.
        - id: ch03-b14
          speaker: narrator
          text: Herr Sesemann returned to Clara. He told her not to be afraid any longer. He would soon learn the truth about the ghost and put an end to the trouble.
        - id: ch03-b15
          speaker: narrator
          text: At exactly nine that night, after the children had gone to bed and Fraulein Rottenmeier had retired, the doctor arrived. He was a gray-haired man with a fresh face and two bright, kindly eyes. He looked anxious as he came in, expecting to find a serious patient. Then he caught sight of Herr Sesemann, burst out laughing, and clapped his friend on the shoulder.
        - id: ch03-b16
          speaker: doctor
          text: Well! You look awfully healthy for someone I'm supposed to sit up with all night.
        - id: ch03-b17
          speaker: sesemann
          text: Be patient, my friend. The one we're waiting for will look much worse once we catch him.
        - id: ch03-b18
          speaker: doctor
          text: So there is a sick person here, but first we have to catch him?
        - id: ch03-b19
          speaker: sesemann
          text: Worse than that, Doctor. There's a ghost in the house. My house is haunted!
        - id: ch03-b20
          speaker: narrator
          text: The doctor laughed out loud.
        - id: ch03-b21
          speaker: sesemann
          text: That's a fine way to show sympathy! Too bad my friend Rottenmeier can't hear you. She is certain that one of my long-dead relatives is wandering through the house, doing penance for some horrible crime.
        - id: ch03-b22
          speaker: doctor
          text: And how did she happen to meet this relative of yours?
        - id: ch03-b23
          speaker: narrator
          text: Still amused, the doctor listened while Herr Sesemann told him the whole story. According to the combined testimony of everyone in the household, someone opened the front door every night. Herr Sesemann had therefore prepared two loaded revolvers, so the two friends would be ready for whatever might happen.
        - id: ch03-b24
          speaker: sesemann
          text: Perhaps a friend of the servants made up this trick to frighten everyone while I was away. If so, a shot into the air should give the joker a proper scare. Or perhaps it's a thief. He may want us to believe in a ghost so that later, when he comes to steal, nobody will dare run out. If that's the answer, we'll be glad to have good weapons.
    - id: ch04
      title: The Ghost Appears
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The two friends settled into the same room where Sebastian and John had kept watch. On the table stood a bottle of wine to refresh them through the long night. Beside it lay two revolvers. Two large candles burned brightly, because Herr Sesemann had no intention of waiting for a ghost in dim light.
        - id: ch04-b02
          speaker: narrator
          text: They shut the room door tightly so no glow would reach the hall and frighten the ghost away before it appeared. Then the two gentlemen settled comfortably into their armchairs. They talked about one thing after another and paused now and then for a good drink of wine. Their conversation carried on so easily that midnight arrived before either of them noticed the time.
        - id: ch04-b03
          speaker: doctor
          text: The ghost must have smelled us. It looks as though it plans to stay away tonight.
        - id: ch04-b04
          speaker: sesemann
          text: Give it time. It usually doesn't appear before one.
        - id: ch04-b05
          speaker: narrator
          text: They began talking again. The clock struck one. The house was silent, and so was the street. Suddenly the doctor raised a finger.
        - id: ch04-b06
          speaker: doctor
          text: Quiet, Sesemann. Do you hear that?
        - id: ch04-b07
          speaker: narrator
          text: Both men held still and listened. From the silent hall, they clearly heard the wooden bar being pushed softly aside. The sound was unmistakable. A moment later, the key turned in the lock. Then the front door itself swung open. Herr Sesemann immediately put out his hand and reached for his revolver.
        - id: ch04-b08
          speaker: doctor
          text: You're not frightened, are you?
        - id: ch04-b09
          speaker: narrator
          text: The doctor rose to his feet.
        - id: ch04-b10
          speaker: sesemann
          text: It never hurts to be careful.
        - id: ch04-b11
          speaker: narrator
          text: Herr Sesemann seized one candle in his other hand and followed the doctor. The doctor went first, armed in the same way with a light and a revolver. Moving softly, they stepped into the hall. The front door stood open, and moonlight poured through it. Right there in the doorway was a white figure, standing perfectly still.
        - id: ch04-b12
          speaker: doctor
          text: Who's there?
        - id: ch04-b13
          speaker: narrator
          text: His voice thundered and echoed through the hall as the two men advanced with their candles and weapons. The white figure turned toward them and gave a soft cry. It was Heidi, standing barefoot in her little white nightgown. She stared with wild eyes at the bright lights and the revolvers pointed before her. Her whole body shook like a leaf in the wind. The two men stopped and looked at each other in astonishment.
        - id: ch04-b14
          speaker: doctor
          text: Why, Sesemann, I believe this is your little water carrier.
        - id: ch04-b15
          speaker: sesemann
          text: Child, what are you doing here? What did you want? Why did you come downstairs?
        - id: ch04-b16
          speaker: narrator
          text: Heidi was white with terror. Her voice was barely a whisper.
        - id: ch04-b17
          speaker: heidi
          text: I don't know.
          emotion: fearful
        - id: ch04-b18
          speaker: doctor
          text: Sesemann, this is for me to handle. Go back to your chair. I'll take the child upstairs and put her to bed.
        - id: ch04-b19
          speaker: narrator
          text: The doctor set down his revolver and gently took Heidi's hand. He led her upstairs beside him.
        - id: ch04-b20
          speaker: doctor
          text: Don't be scared. There's nothing to fear. Everything is all right. Just walk quietly with me.
          emotion: calm
        - id: ch04-b21
          speaker: narrator
          text: When they reached Heidi's room, the doctor placed the candle on the table. He lifted the child in his arms, laid her on the bed, and tucked the covers carefully around her. Then he sat beside her and waited. Little by little she grew quieter and stopped trembling so violently. He took her hand and spoke in a kind, soothing voice.
        - id: ch04-b22
          speaker: doctor
          text: There now, you're feeling better. Tell me, where were you trying to go?
          emotion: calm
        - id: ch04-b23
          speaker: heidi
          text: I wasn't trying to go anywhere. I didn't know I had gone downstairs. Then all at once, I was there.
        - id: ch04-b24
          speaker: doctor
          text: I understand. Were you dreaming? Did it feel as though you could see and hear something very clearly?
        - id: ch04-b25
          speaker: heidi
          text: Yes. I have the same dreams every night. I think I'm back with Grandfather. I hear the fir trees outside, and I see the stars shining so brightly. Then I pull the door open and run out, and everything is so beautiful! But when I wake up, I'm still in Frankfurt.
          emotion: sad
        - id: ch04-b26
          speaker: narrator
          text: As Heidi spoke, she fought back the sobs that seemed to choke her.
        - id: ch04-b27
          speaker: doctor
          text: Does anything hurt? Your head, perhaps, or your back?
        - id: ch04-b28
          speaker: heidi
          text: No. I only feel as if a huge stone is pressing right here.
        - id: ch04-b29
          speaker: doctor
          text: Like something you ate is stuck and won't go down?
        - id: ch04-b30
          speaker: heidi
          text: No, not like that. It's something heavy, as if I need to cry very badly.
        - id: ch04-b31
          speaker: doctor
          text: And then do you let yourself have a good cry?
        - id: ch04-b32
          speaker: heidi
          text: Oh, no. I mustn't. Fraulein Rottenmeier told me not to cry.
        - id: ch04-b33
          speaker: doctor
          text: So you keep it all inside. Are you happy here in Frankfurt?
        - id: ch04-b34
          speaker: heidi
          text: Yes.
        - id: ch04-b35
          speaker: narrator
          text: The answer was so low that it sounded much more like no.
        - id: ch04-b36
          speaker: doctor
          text: Where did you live with your grandfather?
        - id: ch04-b37
          speaker: heidi
          text: Up on the mountain.
        - id: ch04-b38
          speaker: doctor
          text: That couldn't have been much fun. It must have felt dull sometimes, didn't it?
        - id: ch04-b39
          speaker: heidi
          text: No, no! It was beautiful. Beautiful!
          emotion: sad
        - id: ch04-b40
          speaker: narrator
          text: Heidi could say no more. The memory of her life on the mountain came rushing back. Added to the fright she had just endured and all the crying she had kept buried for so long, it was more than the child's strength could bear. The tears began falling fast down her face, and she broke into violent sobs.
        - id: ch04-b41
          speaker: narrator
          text: The doctor stood and gently lowered her head onto the pillow.
        - id: ch04-b42
          speaker: doctor
          text: That's it. Let yourself cry. It will help you. Then go to sleep. Tomorrow, things will be all right.
          emotion: calm
    - id: ch05
      title: The Doctor's Prescription
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The doctor left Heidi and went back downstairs. When he was seated once more in the armchair across from his friend, he told Herr Sesemann what he had discovered.
        - id: ch05-b02
          speaker: doctor
          text: Sesemann, first, your little guest walks in her sleep. She is the ghost who has opened the front door night after night and thrown your whole household into a panic. Second, the child is wasting away from homesickness. She is nearly a skeleton already, and something must be done at once.
        - id: ch05-b03
          speaker: doctor
          text: Her overexcited nerves are causing the sleepwalking, and there is only one remedy. Send her back to the air of her own mountain. Her homesickness has the very same cure. The child must leave for home tomorrow. That is my prescription.
        - id: ch05-b04
          speaker: narrator
          text: Herr Sesemann sprang from his chair. Deeply troubled, he paced back and forth across the room while the doctor's diagnosis sank in.
        - id: ch05-b05
          speaker: sesemann
          text: What? The child is sick and walking in her sleep? She has been pining for home and growing thin under my own roof, and no one saw it or knew a thing! She came here happy and healthy. How can I send her grandfather a poor little skeleton? I can't do it. You must take charge of her. Do whatever is needed and make her strong and well. Then she can go home, but surely you must treat her first.
        - id: ch05-b06
          speaker: doctor
          text: Sesemann, think about what you're asking. Pills and powders cannot cure this illness. The child isn't strong. If you send her home now, the mountain air may restore her. If you wait, would you rather have her return sick, or never return at all?
        - id: ch05-b07
          speaker: narrator
          text: Herr Sesemann stopped in the middle of the room. The doctor's warning came as a shock and left him with no answer for a moment.
        - id: ch05-b08
          speaker: sesemann
          text: When you put it that way, Doctor, there is only one choice. We must arrange it immediately.
        - id: ch05-b09
          speaker: narrator
          text: The two friends walked up and down together for a while, arranging exactly what must be done. At last the doctor said goodbye. Many hours had passed since they first sat down to wait for the ghost. This time Herr Sesemann himself opened the hall door, and the clear morning light streamed through it into the house.
