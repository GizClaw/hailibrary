audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    dete:
      display_name: 德特
      tts:
        delivery: 精明爽利，热切时语速稍快
        timbre: 清脆鲜明
        pace: 偏快
        pitch: 中高音
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔聪慧，久病的安静中带着活泼的好奇心
        timbre: 轻柔清亮
        pace: 舒缓自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，训诫时郑重而不容置疑
        timbre: 清晰端正
        pace: 适中偏慢
        pitch: 中音
    coachman:
      display_name: 马车夫
      tts:
        delivery: 冷淡敷衍，回答简短含混
        timbre: 粗哑低沉
        pace: 适中
        pitch: 低音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 恪守规矩，私下说话直率而带点滑稽感
        timbre: 浑厚清晰
        pace: 适中
        pitch: 中低音
    tinette:
      display_name: 蒂内特
      tts:
        delivery: 拿腔拿调，话里总带着轻慢和嘲弄
        timbre: 尖细清脆
        pace: 稍慢
        pitch: 偏高
  chapters:
    - id: ch01
      title: 来到塞泽曼家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 法兰克福的塞泽曼家里，小女儿克拉拉正躺在病人专用的长椅上。她整天都待在这张椅子上，由人推着在各个房间之间来去。现在她在书房里。这屋子东一件、西一件地摆着东西，却很舒服，看得出一家人常来这里坐。精美的书柜装着玻璃门，克拉拉平日也在这里上课，所以大家才叫它书房。
        - id: ch01-b02
          speaker: narrator
          text: 克拉拉的脸清瘦苍白，一双柔和的蓝眼睛一直望着时钟。今天的钟好像走得特别慢，她少见地有些不耐烦。
        - id: ch01-b03
          speaker: clara
          text: 罗滕迈尔小姐，还没到时间吗？
        - id: ch01-b04
          speaker: narrator
          text: 罗滕迈尔小姐挺直腰身，坐在小针线桌旁刺绣。她穿着一件样式奇特的宽衣服，大衣领像披肩一样铺开，头上还戴着高高隆起的圆顶头饰，看上去十分庄严。塞泽曼太太多年前去世后，塞泽曼先生就把家务和仆人都交给她管理。他自己常常不在家，只嘱咐了一件事。家里的事情都得让克拉拉发表意见，不能违背女儿的心愿。
        - id: ch01-b05
          speaker: narrator
          text: 克拉拉第二次问起时间时，德特正好带着海蒂来到大门外。马车夫才从车座上下来，德特便问他，这时候求见罗滕迈尔小姐是不是太迟了。
        - id: ch01-b06
          speaker: coachman
          text: 我可管不了这个。你到门厅摇铃，叫塞巴斯蒂安来。
        - id: ch01-b07
          speaker: narrator
          text: 德特依言摇了铃。塞巴斯蒂安走下楼来，一看见她就惊讶地瞪圆了眼睛。那双眼睛，简直快赶上他外套上的圆纽扣了。
        - id: ch01-b08
          speaker: dete
          text: 请问，现在见罗滕迈尔小姐还来得及吗？
        - id: ch01-b09
          speaker: sebastian
          text: 这事也不归我管。摇那边的铃，叫蒂内特。
        - id: ch01-b10
          speaker: narrator
          text: 他说完就转身走了，一点心也不肯多操。德特只好再摇一次铃。蒂内特这才出现。她头上端端正正戴着一顶雪白的小帽子，脸上却挂着嘲弄的神情。
        - id: ch01-b11
          speaker: tinette
          text: 什么事？
        - id: ch01-b12
          speaker: narrator
          text: 她站在楼梯顶上喊。德特又把问题说了一遍。蒂内特转身离开，过了一会儿才回来。
        - id: ch01-b13
          speaker: tinette
          text: 上来吧。她正等着你呢。
        - id: ch01-b14
          speaker: narrator
          text: 德特牵着海蒂上楼，走进书房，蒂内特跟在后面。德特客客气气地站在门边，手里仍紧紧抓着海蒂，一点也不敢放松。这里的一切对孩子来说都很陌生，她实在猜不准，海蒂会不会突然想出什么举动来。
    - id: ch02
      title: 罗滕迈尔小姐的盘问
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 罗滕迈尔小姐慢慢站起来，走到新来的小伴读面前，想仔细看看她。可海蒂的模样似乎不大合她的心意。孩子穿着朴素的粗呢小裙子，头上扣着一顶走了形的旧草帽。她从帽檐下仰起天真的小脸，毫不掩饰地盯着那顶高耸的头饰，满眼都是惊奇。
        - id: ch02-b02
          speaker: narrator
          text: 罗滕迈尔小姐把海蒂从头到脚看了一遍，半点细节也不肯放过。海蒂也一动不动地望着她，目光始终没有移开。过了好一会儿，盘问终于开始了。
        - id: ch02-b03
          speaker: rottenmeier
          text: 你叫什么？
        - id: ch02-b04
          speaker: heidi
          text: 海蒂。
        - id: ch02-b05
          speaker: rottenmeier
          text: 什么？这哪像受洗时取的正式名字？你受洗以后到底叫什么？
          emotion: surprised
        - id: ch02-b06
          speaker: heidi
          text: 我不记得了。
        - id: ch02-b07
          speaker: rottenmeier
          text: 哪有人这样回答！德特，这孩子究竟是傻，还是根本没规矩？
        - id: ch02-b08
          speaker: narrator
          text: 罗滕迈尔小姐摇着头。德特暗暗捅了海蒂一下，怪她答得太不合时宜，嘴上却赶紧替她解释。
        - id: ch02-b09
          speaker: dete
          text: 请小姐听我说。她很少见生人，所以不习惯。她不傻，也不是故意没规矩，她连这两个词是什么意思都不知道。她心里怎么想，嘴上就怎么说。今天又是头一回进这样的大户人家，当然不懂礼数。不过她听话，也愿意学，还请小姐多担待。她受洗时叫阿德莱德，跟她去世的母亲，也就是我姐姐同名。
        - id: ch02-b10
          speaker: rottenmeier
          text: 嗯，这个名字才像话。不过德特，你带来的孩子这么小，实在让我吃惊。我说得很清楚，要找一个跟我们小姐年纪相近的孩子，既能陪她上课，也能陪她做别的事。克拉拉小姐已经十二岁多了。这个孩子几岁？
        - id: ch02-b11
          speaker: dete
          text: 请小姐原谅，连我也记不清她到底多大。她是小一点，可也小不了太多。让我想想，大概十岁上下吧。
        - id: ch02-b12
          speaker: heidi
          text: 外公告诉过我，我八岁。
        - id: ch02-b13
          speaker: narrator
          text: 德特又捅了她一下。海蒂还是不明白自己哪里说错了，一点也没慌。
        - id: ch02-b14
          speaker: rottenmeier
          text: 什么，才八岁！比克拉拉整整小四岁，这能有什么用？你以前学过什么？带过什么书来念？
          emotion: angry
        - id: ch02-b15
          speaker: heidi
          text: 我一本书也没有。
        - id: ch02-b16
          speaker: rottenmeier
          text: 那你是怎么学会认字的？
        - id: ch02-b17
          speaker: heidi
          text: 我没学过。彼得也没学过。
        - id: ch02-b18
          speaker: rottenmeier
          text: 上天保佑，你竟然不识字！这是真的吗？你到底学过什么？
          emotion: surprised
        - id: ch02-b19
          speaker: heidi
          text: 什么也没学过。
        - id: ch02-b20
          speaker: narrator
          text: 海蒂毫不躲闪，说得老老实实。罗滕迈尔小姐足足停了一两分钟，才从震惊里缓过来。
        - id: ch02-b21
          speaker: rottenmeier
          text: 年轻女人，你先前说的那个伙伴，跟眼前这个孩子完全不是一回事。你怎么会把她带来给我？
        - id: ch02-b22
          speaker: narrator
          text: 德特可不会轻易被问倒，她马上热烈地说了起来。
        - id: ch02-b23
          speaker: dete
          text: 请小姐准许我说一句，我带来的正是您要找的孩子。您说过，想要一个跟普通孩子不一样的。可我认识的那些孩子，大都一个样，没什么特别。再也找不到比她更合适的了，我看她简直天生就该来这里。不过我现在非走不可，我的女主人还等着我呢。请小姐放心，我很快会再来看看她过得好不好。
        - id: ch02-b24
          speaker: narrator
          text: 德特行了个礼，飞快地跑出房间，又一路下楼去了。罗滕迈尔小姐愣了一下，立刻追出去。要把孩子留下，她还有许多事情要交代，也有许多问题没问。可海蒂已经站在屋里，而德特分明铁了心要把她留下。罗滕迈尔小姐追赶不及，只能面对这个已经落到手上的错误。
    - id: ch03
      title: 两个女孩
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海蒂还站在刚进门的地方，半步也没挪。刚才那一连串问答，克拉拉一直安静地看着。这会儿，她朝海蒂招了招手。
        - id: ch03-b02
          speaker: clara
          text: 到我这边来吧。
        - id: ch03-b03
          speaker: narrator
          text: 海蒂走到她面前。
        - id: ch03-b04
          speaker: clara
          text: 你喜欢别人叫你海蒂，还是叫你阿德莱德？
        - id: ch03-b05
          speaker: heidi
          text: 大家一直都叫我海蒂。
        - id: ch03-b06
          speaker: clara
          text: 那我也叫你海蒂。这个名字很适合你。我以前没听过这样的名字，也没见过像你这样的孩子。你的头发一直都这么短、这么卷吗？
        - id: ch03-b07
          speaker: heidi
          text: 是啊，我想一直都是这样。
        - id: ch03-b08
          speaker: clara
          text: 你来到法兰克福，觉得高兴吗？
        - id: ch03-b09
          speaker: heidi
          text: 不高兴。不过我明天就回家，还要给祖母带一个白面包。
        - id: ch03-b10
          speaker: clara
          text: 你可真有意思！他们请你来，是想让你留在这里陪我，还要跟我一起上课。你又不会认字，以后的课一定有新鲜事，总算不会那么闷了。平常一个上午怎么也过不完。老师每天差不多十点来，一直教到两点，实在太久了。
        - id: ch03-b11
          speaker: clara
          text: 有时候，他把书举起来，紧紧贴在脸前，好像眼睛看不清。其实呀，他只是困得想打呵欠。罗滕迈尔小姐也会拿出那条大手帕，蒙住自己的脸，装得像是书里的内容让她很感动。可她也只是在打呵欠。我自己也常常想打，却得拼命忍着。要是让她看见，她马上就去拿鱼肝油，说我又虚弱了，非逼我喝一剂。那东西难喝极了。所以我只能忍住。现在好了，你学认字的时候，我可以躺在这里听，肯定有趣多了。
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: 一听说自己要学认字，海蒂迟疑着摇了摇头。
        - id: ch03-b13
          speaker: clara
          text: 哎呀，别说傻话。你当然得学，谁都要认字。我的老师脾气很好，从来不会发火，什么都会解释给你听。不过有件事你要记住。他解释的时候，你肯定听不懂，可千万别追问。不然他会越讲越多，你反倒越来越糊涂。等以后学得多了，自己懂了一些，你才会慢慢明白他先前说的那些话。
    - id: ch04
      title: 第一顿午饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 罗滕迈尔小姐回到书房时，还在生气。她没能追上德特，没法继续追问，也没机会当面指出，德特先前的话有多靠不住，海蒂又有多不适合给克拉拉做伴。眼下该怎么收拾这个局面，她一点办法也没有。偏偏答应接孩子来的人就是她自己，想到这里，她越发恼火，在书房和餐厅之间焦躁地走来走去，一刻也停不下来。
        - id: ch04-b02
          speaker: narrator
          text: 塞巴斯蒂安正站在摆好的餐桌旁，查看有没有漏掉什么东西，罗滕迈尔小姐立刻骂起他来。
        - id: ch04-b03
          speaker: rottenmeier
          text: 有什么心事，留到明天早上再想。动作快一点，不然今天谁也别想吃上午饭！
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 她又急匆匆地出去叫蒂内特，语气坏得很。女仆听见了，迈着比平常更扭捏的小步子走来，脸上满是无礼的神气。就连罗滕迈尔小姐也不敢责骂她，只能把火气往肚里压。
        - id: ch04-b05
          speaker: rottenmeier
          text: 把刚来的小女孩那间房收拾出来。东西都是齐的，只要把灰掸干净。
        - id: ch04-b06
          speaker: narrator
          text: 她拼命克制着自己，才把话说完。
        - id: ch04-b07
          speaker: tinette
          text: 哟，还真值得我费这番心。
        - id: ch04-b08
          speaker: narrator
          text: 蒂内特丢下这句话，转身走了。就在这时，塞巴斯蒂安猛地推开通往餐厅的折门，声音响得根本没有必要。方才挨骂时他不敢回嘴，心里却气得厉害。接着，他走到克拉拉的长椅后面，装好推椅用的把手。海蒂靠近几步，站在那里一直盯着他。
        - id: ch04-b09
          speaker: sebastian
          text: 喂，我身上到底有什么？你为什么老盯着我看？
        - id: ch04-b10
          speaker: narrator
          text: 要是塞巴斯蒂安知道罗滕迈尔小姐恰好走进来了，他绝不敢这样问。
        - id: ch04-b11
          speaker: heidi
          text: 因为你看上去真像彼得。
        - id: ch04-b12
          speaker: narrator
          text: 女管家吓得双手一合，压低声音，连话都说得结巴了。
        - id: ch04-b13
          speaker: rottenmeier
          text: 这怎么得了！她居然跟一个仆人说话，说得就像在跟朋友说话一样！世上竟会有这样的孩子，我做梦也想不到！
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: 塞巴斯蒂安把长椅推进餐厅，又扶着克拉拉坐到椅子上。罗滕迈尔小姐挨着她坐下，让海蒂坐在对面。桌边只有她们三人，彼此隔得很开，塞巴斯蒂安端菜时有足够的地方走动。
        - id: ch04-b15
          speaker: narrator
          text: 海蒂的盘子旁放着一只漂亮的白面包卷。她一看见，眼睛立刻高兴得亮了起来。塞巴斯蒂安长得像彼得，这让她觉得他很可信。海蒂像只小老鼠，安安静静坐着，等他端着一盘鱼走到身旁，才指着面包问他。
        - id: ch04-b16
          speaker: heidi
          text: 这个能给我吗？
        - id: ch04-b17
          speaker: narrator
          text: 塞巴斯蒂安点了点头，又斜眼去看罗滕迈尔小姐，想知道她会有什么反应。海蒂立刻拿起面包卷，塞进自己的口袋。塞巴斯蒂安拼命忍着笑，脸都抽动起来。可他牢记仆人的规矩，一声不出，也不敢动，仍站在海蒂身旁。海蒂没有取鱼，他既不能开口，也不能离开。她不解地看了他一会儿。
        - id: ch04-b18
          speaker: heidi
          text: 那个我也一定要吃吗？
        - id: ch04-b19
          speaker: narrator
          text: 塞巴斯蒂安又点头。
        - id: ch04-b20
          speaker: heidi
          text: 那就请你给我一点吧。
        - id: ch04-b21
          speaker: narrator
          text: 海蒂平静地望着盘子。塞巴斯蒂安差一点再也忍不住，连手里的菜盘都可疑地抖了起来。
        - id: ch04-b22
          speaker: rottenmeier
          text: 把盘子放在桌上吧，过一会儿再进来。
        - id: ch04-b23
          speaker: narrator
          text: 塞巴斯蒂安马上消失了。女管家叹了一口气，把脸转向海蒂。
        - id: ch04-b24
          speaker: rottenmeier
          text: 至于你，阿德莱德，我看我必须从最基本的规矩教起。就先说餐桌上的规矩吧。
        - id: ch04-b25
          speaker: narrator
          text: 她极其仔细地讲起海蒂该怎么做。说完餐桌上的一套，她又特意补充下去。
        - id: ch04-b26
          speaker: rottenmeier
          text: 吃饭时不许跟塞巴斯蒂安讲话，平时也不许。只有需要吩咐他，或者有非问不可的事情时，才能开口。就算那样，也不能像刚才那样跟他说话，好像他是你的熟人。我不许再听见第二次！对蒂内特也一样。至于该怎么称呼我，听别人怎么叫，你就跟着叫。克拉拉小姐要你怎么称呼她，由她来决定。
        - id: ch04-b27
          speaker: clara
          text: 那当然就叫我克拉拉。
        - id: ch04-b28
          speaker: narrator
          text: 接下来又是长长一串规矩。几点起床，几点睡觉，怎样进房间，怎样出去，门应该怎么关，每样东西又该怎么收拾整齐。每一件事，罗滕迈尔小姐都讲得很细。她一直说个不停，海蒂的眼皮却一点点合了起来。孩子清晨还不到五点就起床，又走了那么远的路。这时她靠在椅背上，很快睡熟了，后面那些话一句也没听见。
        - id: ch04-b29
          speaker: rottenmeier
          text: 阿德莱德，我的话终于讲完了。你一定要全记住！你都听懂了吗？
        - id: ch04-b30
          speaker: clara
          text: 海蒂早就睡着啦。
        - id: ch04-b31
          speaker: narrator
          text: 克拉拉笑得整张脸都漾起了波纹。她已经很久没有吃过这么有趣的一顿饭了。
        - id: ch04-b32
          speaker: rottenmeier
          text: 这孩子简直让人受不了！以后还不知道要叫我受多少苦！
          emotion: angry
        - id: ch04-b33
          speaker: narrator
          text: 罗滕迈尔小姐使劲摇铃。蒂内特和塞巴斯蒂安一起跑进来，差点撞到一处。可是这样大的动静也没有吵醒海蒂。他们费了好一番力气，才勉强把她唤醒，领着她去卧室。一路先穿过书房，再走过克拉拉的卧室和罗滕迈尔小姐的起居室，最后才来到给海蒂安排的那间角屋。
