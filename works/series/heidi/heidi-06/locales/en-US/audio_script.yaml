  chapters:
    - id: ch01
      title: A New Arrival
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In her Frankfurt home, Herr Sesemann's daughter Clara spent each day on an invalid couch. It could be wheeled from room to room, so she did not always have to stay in one place. That afternoon she was in the study. From all the familiar things standing and lying around, you could tell that the family often sat there together. They made it feel comfortable and lived-in. A handsome bookcase with glass doors explained why everyone called it the study. It was also the room where Clara usually had her lessons.
        - id: ch01-b02
          speaker: narrator
          text: Clara's little face was thin and pale. Her soft blue eyes stayed fixed on the clock, and to her it seemed to be moving especially slowly that day. Impatience was very unusual for Clara, but now even her voice carried a touch of it as she asked the same question for the second time.
        - id: ch01-b03
          speaker: clara
          text: Isn't it time yet, Fraulein Rottenmeier?
        - id: ch01-b04
          speaker: narrator
          text: Fraulein Rottenmeier sat very straight at a small worktable, busy with her embroidery. She wore a mysterious, loose garment with a large collar that spread over her shoulders. On her head was a tall, dome-shaped headdress. Altogether, she looked very solemn. Clara's mother had been dead for years, and in all that time Herr Sesemann had trusted Fraulein Rottenmeier to run the house and supervise the servants. He was often away from home, leaving her in sole charge. There was only one condition. Clara was to have a voice in every matter, and nothing was to be done against her wishes.
        - id: ch01-b05
          speaker: narrator
          text: Just as Clara repeated her question, Dete and Heidi reached the front door. A coachman had just climbed down from his box. Dete stopped him and asked whether they had come too late to see Fraulein Rottenmeier.
        - id: ch01-b06
          speaker: coachman
          text: Don't ask me. Ring the hall bell for Sebastian.
        - id: ch01-b07
          speaker: narrator
          text: Dete did as he said and rang the hall bell. Sebastian came down the stairs. The sight of Dete and the child astonished him so much that he opened his eyes almost as wide as the big round buttons on his coat.
        - id: ch01-b08
          speaker: dete
          text: Is it too late to see Fraulein Rottenmeier?
        - id: ch01-b09
          speaker: sebastian
          text: That's not for me to say. Ring the other bell for Tinette.
        - id: ch01-b10
          speaker: narrator
          text: Sebastian disappeared without troubling himself any further. Dete rang the other bell. This time Tinette appeared at the top of the stairs. A spotless white cap was perched on her head, and she looked down at them with a mocking expression.
        - id: ch01-b11
          speaker: tinette
          text: What do you want?
        - id: ch01-b12
          speaker: narrator
          text: Dete asked the same question once more. Tinette vanished, then soon returned.
        - id: ch01-b13
          speaker: tinette
          text: Come upstairs. She's waiting for you.
        - id: ch01-b14
          speaker: narrator
          text: Dete led Heidi upstairs and into the study, with Tinette following behind. Once inside, Dete stopped politely near the door. She still kept a tight hold on Heidi's hand. Everything around them was new to the child, and Dete had no idea what Heidi might suddenly decide to do.
        - id: ch01-b15
          speaker: narrator
          text: Fraulein Rottenmeier rose slowly and came closer to inspect Clara's new companion for herself. What she saw did not seem to please her. Heidi wore a plain little wool dress, and her old straw hat had been bent out of shape. She looked out innocently from beneath it. There was no hiding her amazement as she gazed up at the lady's towering headdress.
        - id: ch01-b16
          speaker: rottenmeier
          text: What is your name?
        - id: ch01-b17
          speaker: narrator
          text: For several long moments, Fraulein Rottenmeier examined the child closely from head to foot. All the while, Heidi stood there with her eyes fixed just as steadily on Fraulein Rottenmeier.
        - id: ch01-b18
          speaker: heidi
          text: Heidi.
        - id: ch01-b19
          speaker: rottenmeier
          text: What? That isn't a proper Christian name. You weren't baptized Heidi. What name were you given then?
        - id: ch01-b20
          speaker: heidi
          text: I don't remember.
        - id: ch01-b21
          speaker: rottenmeier
          text: What kind of answer is that? Dete, is this child foolish, or is she being rude?
        - id: ch01-b22
          speaker: narrator
          text: Dete gave Heidi a quiet poke because she thought the answer entirely unsuitable. Then she hurried to speak for the child before Heidi could say anything else.
        - id: ch01-b23
          speaker: dete
          text: Please allow me to explain. She isn't foolish or rude. She doesn't even know what rude means. She simply says exactly what she thinks. This is her first day in a fine house, so she hasn't learned the manners yet. But she's obedient and very willing to learn, if you'll excuse her. She was baptized Adelaide, after her mother, my sister, who has died.
        - id: ch01-b24
          speaker: rottenmeier
          text: Adelaide. At least that is a name one can say. But Dete, I'm astonished that you've brought such a young child. I asked for someone Clara's age, someone who could share her lessons and everything else she does. Clara is over twelve. How old is this girl?
        - id: ch01-b25
          speaker: dete
          text: I admit I've lost track of her exact age. She's a little younger, certainly, but not by much. I can't be precise. I should think she's about ten.
        - id: ch01-b26
          speaker: heidi
          text: Grandfather told me I'm eight.
        - id: ch01-b27
          speaker: narrator
          text: Dete poked her again for correcting the answer. Heidi had not the slightest idea why her aunt kept doing that, so she was not embarrassed or confused in the least.
        - id: ch01-b28
          speaker: rottenmeier
          text: Only eight? She's four years too young! What use can she be? And what have you learned? Which books have you studied?
          emotion: angry
        - id: ch01-b29
          speaker: heidi
          text: None.
        - id: ch01-b30
          speaker: rottenmeier
          text: Then how did you learn to read?
        - id: ch01-b31
          speaker: heidi
          text: I never learned. Peter hasn't either.
        - id: ch01-b32
          speaker: rottenmeier
          text: Good heavens! You truly can't read? Is that possible? Then what have you learned?
          emotion: surprised
        - id: ch01-b33
          speaker: heidi
          text: Nothing.
        - id: ch01-b34
          speaker: narrator
          text: Heidi gave the plain truth without the least hesitation. Fraulein Rottenmeier fell silent for a minute or two while she recovered from the shock. At last she turned to Dete.
        - id: ch01-b35
          speaker: rottenmeier
          text: This is nothing like the companion you led me to expect. How could you bring me such a child?
    - id: ch02
      title: Left Behind
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Dete was not easily discouraged. She answered with spirit.
        - id: ch02-b02
          speaker: dete
          text: But she is exactly what you asked for. You wanted a child unlike other children. Most children I know are much the same, but Heidi is different. I thought she was made for this place. Now I really must go, because my employer will be waiting. With your permission, I'll come back soon and see how she's doing.
        - id: ch02-b03
          speaker: narrator
          text: With that, Dete bowed, hurried from the room, and ran downstairs. Fraulein Rottenmeier stood speechless for a moment before rushing after her. If Heidi was truly going to stay, there were many more questions to ask and arrangements to discuss. The child was already there, though, and Fraulein Rottenmeier could plainly see that Dete intended to leave her there.
        - id: ch02-b04
          speaker: narrator
          text: Heidi stayed beside the door, in the same place where she had stood ever since entering the room. Clara had watched the entire interview without saying a word. Once the two women were gone, she beckoned Heidi toward her.
        - id: ch02-b05
          speaker: clara
          text: Come over here.
        - id: ch02-b06
          speaker: narrator
          text: Heidi went to her.
        - id: ch02-b07
          speaker: clara
          text: Which name do you like better, Heidi or Adelaide?
        - id: ch02-b08
          speaker: heidi
          text: Everyone always calls me Heidi.
        - id: ch02-b09
          speaker: clara
          text: Then Heidi is what I'll call you. It suits you. I've never heard that name before, but I've never met anyone like you either. Has your hair always been short and curly?
        - id: ch02-b10
          speaker: heidi
          text: Yes, I think it has.
        - id: ch02-b11
          speaker: clara
          text: Are you glad you came to Frankfurt?
        - id: ch02-b12
          speaker: heidi
          text: No. I'm going home tomorrow, and I'll take Grandmother a white roll.
        - id: ch02-b13
          speaker: clara
          text: You really are funny! You were brought here to stay with me and take lessons with me. Lessons may finally be interesting now that you can't read. They're usually terribly dull, and the morning feels endless. My tutor comes at about ten, and we work until two. That takes forever.
        - id: ch02-b14
          speaker: clara
          text: Sometimes he holds the book close to his face, as if he can't see it. But really, he's trying to hide a huge yawn. Every so often Fraulein Rottenmeier covers her face with her big handkerchief, as if the reading has deeply moved her. She's hiding a yawn too.
        - id: ch02-b15
          speaker: clara
          text: I often need to yawn myself, but I have to stop it. If Fraulein Rottenmeier catches me, she runs for the cod-liver oil. She says I must be getting weak again and need a dose. That oil is horrible, so I try very hard not to yawn. But now lessons will be much more fun. I can lie here and listen while you learn to read.
        - id: ch02-b16
          speaker: narrator
          text: At the thought of learning to read, Heidi shook her head uncertainly.
        - id: ch02-b17
          speaker: clara
          text: Oh, don't be silly, Heidi. Everyone has to learn. My tutor is kind and never gets cross. He'll explain everything. Of course, you won't understand his explanations at first. Just don't ask questions, or he'll explain even more and you'll understand even less. Later, when you've learned more, you'll start to see what he meant.
        - id: ch02-b18
          speaker: narrator
          text: Fraulein Rottenmeier returned after failing to catch Dete. She was thoroughly upset. She had wanted to ask for more details about the child. Most of all, she had wanted to convince Dete that Heidi was completely unfit to be Clara's companion. Now the child had been left in her house, and she did not know what to do or how to undo the trouble. What made it worse was knowing that she herself had agreed to have Heidi brought there.
    - id: ch03
      title: Dinner in the Sesemann House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Fraulein Rottenmeier hurried back and forth between the study and the dining room, too agitated to keep still. Sebastian stood by the table he had just finished setting. He was only looking it over to make sure nothing was missing, but Fraulein Rottenmeier immediately began to scold him.
        - id: ch03-b02
          speaker: rottenmeier
          text: You can finish thinking tomorrow morning. Hurry, or dinner will never be served today.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: Then Fraulein Rottenmeier hurried out and called Tinette in such a bad temper that the maid came tripping forward with steps even more dainty than usual. Tinette wore such a pert, bold look that even Fraulein Rottenmeier did not quite dare scold her. Having to hold in all that anger only made her feel it more strongly.
        - id: ch03-b04
          speaker: rottenmeier
          text: Prepare the room for the little girl who just arrived. Everything is ready except for the dusting.
        - id: ch03-b05
          speaker: narrator
          text: Fraulein Rottenmeier had to force herself to speak evenly.
        - id: ch03-b06
          speaker: tinette
          text: As if that's worth my trouble.
        - id: ch03-b07
          speaker: narrator
          text: Tinette turned away. Meanwhile, Sebastian flung open the folding doors to the dining room with much more noise than necessary. He was furious too, but he did not dare answer Fraulein Rottenmeier back. Then he went to Clara's couch and began arranging the handle at the rear so he could wheel her into the next room. Heidi came close and stood there staring at him.
        - id: ch03-b08
          speaker: sebastian
          text: Well? What are you staring at me for?
        - id: ch03-b09
          speaker: narrator
          text: He would never have growled at her if he had known Fraulein Rottenmeier was coming into the room just then.
        - id: ch03-b10
          speaker: heidi
          text: You look so much like Peter.
        - id: ch03-b11
          speaker: narrator
          text: Fraulein Rottenmeier clasped her hands in horror and spoke half under her breath.
        - id: ch03-b12
          speaker: rottenmeier
          text: Can this be happening? She talks to a servant as if he were her friend! I never imagined such a child.
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: Sebastian wheeled Clara's couch into the dining room and helped her move into her chair. Fraulein Rottenmeier took the seat beside Clara, then signaled for Heidi to sit across from them. Those three were the only people at the table. Since they were seated far apart, Sebastian had plenty of room to walk between them and offer each dish.
        - id: ch03-b14
          speaker: narrator
          text: Beside Heidi's plate lay a lovely white roll, just like the kind she wanted to take to Grandmother. Her eyes lit up as soon as she noticed it. Seeing that Sebastian looked like Peter had made her feel she could trust him. She sat as quiet as a mouse and did not move until he came to her side, holding out the dish of fish.
        - id: ch03-b15
          speaker: heidi
          text: May I have this roll?
        - id: ch03-b16
          speaker: narrator
          text: Sebastian nodded, then cast a sideways glance at Fraulein Rottenmeier to see how she would take the question. Heidi immediately grabbed the roll and slipped it into her pocket. Sebastian's face began to twist because laughter was bubbling up inside him. He knew his place far too well to let it out. So he stayed beside Heidi, silent and motionless. It was not his place to speak, and he could not leave until she had taken some fish.
        - id: ch03-b17
          speaker: heidi
          text: Am I supposed to eat some of that too?
        - id: ch03-b18
          speaker: narrator
          text: Sebastian nodded again.
        - id: ch03-b19
          speaker: heidi
          text: Then please give me some.
        - id: ch03-b20
          speaker: narrator
          text: Heidi looked calmly down at her plate, as if her request were the most ordinary thing in the world. Sebastian's control of his face was beginning to fail. He was still trying not to laugh, but now the dish itself had begun to tremble suspiciously in his hands.
        - id: ch03-b21
          speaker: rottenmeier
          text: Put the dish on the table. You may come back later.
        - id: ch03-b22
          speaker: narrator
          text: Fraulein Rottenmeier gave him a severe look, and Sebastian vanished at once.
        - id: ch03-b23
          speaker: rottenmeier
          text: Adelaide, I can see that I must teach you the most basic manners. We'll begin with how you are to behave at the table.
        - id: ch03-b24
          speaker: narrator
          text: Fraulein Rottenmeier sighed and began giving Heidi careful instructions about every single thing she was supposed to do at the table. When that lesson was finished, she came to a rule she considered especially important.
        - id: ch03-b25
          speaker: rottenmeier
          text: You are not to speak to Sebastian at meals or at any other time, unless you must give him an order or ask a necessary question. Even then, you must not talk to him as if he belongs to your family. I will not hear you address him that way again. The same applies to Tinette. You will address me as everyone else does. Clara may decide what you should call her.
        - id: ch03-b26
          speaker: clara
          text: Clara, of course.
        - id: ch03-b27
          speaker: narrator
          text: Then came a long list of rules about ordinary behavior. Fraulein Rottenmeier explained when Heidi must get up and go to bed. She told her how to enter and leave a room, how to shut doors, and how to keep all her things in order. The lecture went on and on. Heidi's eyes slowly began to close. She had been awake since before five that morning, and the journey had been long. At last she leaned back in her chair and fell sound asleep while Fraulein Rottenmeier was still talking.
        - id: ch03-b28
          speaker: rottenmeier
          text: Now remember everything I've told you, Adelaide. Did you understand it all?
        - id: ch03-b29
          speaker: clara
          text: Heidi has been asleep for ages.
          emotion: happy
        - id: ch03-b30
          speaker: narrator
          text: Clara's whole face rippled with amusement as she looked at the sleeping child. She had not enjoyed such an entertaining dinner in a very long time.
        - id: ch03-b31
          speaker: rottenmeier
          text: What I have to endure with this child is simply unbearable!
          emotion: angry
        - id: ch03-b32
          speaker: narrator
          text: Fraulein Rottenmeier rang the bell so violently that Tinette and Sebastian both rushed in and nearly fell over each other. Yet even all that noise was not enough to wake Heidi. They had great difficulty rousing her enough to get her moving toward bed. Her bedroom lay at the far end of a chain of rooms. First they had to take her through the study, then through Clara's bedroom, and after that through Fraulein Rottenmeier's sitting room. Only then did they reach the corner room that had been set aside for Heidi.
