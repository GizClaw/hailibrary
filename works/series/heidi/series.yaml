cover_prompt: |-
  A wordless cover scene high in the Swiss Alps in the late nineteenth century shows Heidi returning to her grandfather's mountain home. Heidi is a bright eight-year-old girl with short dark curls, sun-browned cheeks, bare feet, and a simple red wool dress over a cream blouse, carrying a small bundle. Her tall white-bearded grandfather stands beside the timber chalet, while Peter, a lean goatherd boy in worn brown clothes and a felt hat, guides a lively group of goats along the slope. Heidi runs toward the open chalet door with both arms lifted, making joyful homecoming the focal action. Use a wide child-height view with alpine flowers, fir trees, and mountain ridges receding behind her, leaving broad clear sky above. Keep the people, clothing, chalet, and landscape faithful to rural Switzerland around the 1880s and independent of screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
