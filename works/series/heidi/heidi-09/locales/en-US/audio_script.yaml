  chapters:
    - id: ch01
      title: Herr Sesemann Hears of Things Which Are New to Him
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A few days later, Herr Sesemann came home. At once, the whole house filled with noise and people hurrying up and down the stairs. Sebastian and Tinette carried package after package in from the carriage. Whenever their master returned, he brought plenty of pretty things for his home. But Herr Sesemann did not wait for the packages to be opened or put away. The moment he entered the house, he went straight to see his daughter.
        - id: ch01-b02
          speaker: narrator
          text: It was late afternoon, the time when Heidi and Clara were always together. Father and daughter greeted each other with great affection, for they loved each other dearly. While they spoke, Heidi quietly slipped away into a corner. Herr Sesemann noticed her there and held out his hand.
        - id: ch01-b03
          speaker: herr_sesemann
          text: So this is our little Swiss girl. Come shake hands with me. There we are. Now, are you and Clara good friends? Or do you quarrel, cry, make up, and start all over again the next time?
        - id: ch01-b04
          speaker: heidi
          text: No. Clara is always kind to me.
        - id: ch01-b05
          speaker: clara
          text: And Heidi has never once tried to quarrel with me.
        - id: ch01-b06
          speaker: herr_sesemann
          text: Good. I'm glad to hear it. Now you must excuse me, Clara. I haven't eaten anything all day, and I want my dinner. Afterward, I'll show you everything I brought home.
        - id: ch01-b07
          speaker: narrator
          text: In the dining room, Fraulein Rottenmeier was carefully overseeing every part of his meal. Once Herr Sesemann took his place, she sat down across from him. Her whole face seemed to announce that bad news was coming. The sight was alarming enough that he asked at once what had happened.
        - id: ch01-b08
          speaker: herr_sesemann
          text: What should I be bracing myself for, Fraulein Rottenmeier? You look positively alarming. What's wrong? Clara seems cheerful enough.
        - id: ch01-b09
          speaker: rottenmeier
          text: Herr Sesemann, it concerns Clara. We have been terribly deceived.
        - id: ch01-b10
          speaker: herr_sesemann
          text: Really? How?
        - id: ch01-b11
          speaker: narrator
          text: He went on drinking his wine without the least alarm.
        - id: ch01-b12
          speaker: rottenmeier
          text: As you remember, we decided Clara should have a companion. I know how much you want only well-mannered, properly raised people near her. So I looked for a little Swiss girl. I hoped for the kind one reads about, a child born from the mountain air who almost moves without touching the ground.
        - id: ch01-b13
          speaker: herr_sesemann
          text: Even a Swiss child must touch the ground to get anywhere. Otherwise, she would have wings instead of feet.
        - id: ch01-b14
          speaker: rottenmeier
          text: Oh, you know what I mean. I imagined a child so at home among the living creatures of those high, pure mountains that she would seem like an ideal being from another world.
        - id: ch01-b15
          speaker: herr_sesemann
          text: And what would Clara do with an ideal being from another world?
        - id: ch01-b16
          speaker: rottenmeier
          text: This is no joke. It is far more serious than you think. I have been shamefully deceived.
        - id: ch01-b17
          speaker: herr_sesemann
          text: But how? What is so shameful about it? I see nothing shocking in the child.
        - id: ch01-b18
          speaker: rottenmeier
          text: If only you knew what she has done, and what sorts of people and animals she brought into this house while you were away! The tutor can tell you even more.
        - id: ch01-b19
          speaker: herr_sesemann
          text: Animals? What exactly do you mean?
        - id: ch01-b20
          speaker: rottenmeier
          text: It is impossible to understand her behavior. The only explanation is that sometimes she is plainly not in her right mind.
        - id: ch01-b21
          speaker: narrator
          text: Until then, Herr Sesemann had paid very little attention to the complaints. Strange visitors and animals did not seem terribly serious. But the thought that Heidi might not be in her right mind was different. If it were true, the child might have a harmful effect on Clara. Herr Sesemann studied Fraulein Rottenmeier closely. Before he believed her, he wanted to make sure the confusion was not actually on her side of the table.
        - id: ch01-b22
          speaker: narrator
          text: Just then, the door opened and the tutor was announced.
        - id: ch01-b23
          speaker: herr_sesemann
          text: Ah, here is someone who can clear this up. Sit down and have coffee with me. No ceremony, please. Now, what is going on with the child who came to be Clara's companion? I hear she has brought animals into the house. Is she in her right mind?
        - id: ch01-b24
          speaker: narrator
          text: The tutor felt he ought to begin properly. First, he tried to express how pleased he was that Herr Sesemann had returned. Then he started to explain that he had come especially to welcome him. Herr Sesemann would not let him finish either courtesy. He asked the tutor to come straight to the point and explain what he knew about Heidi. So the tutor began in his usual long and careful way.
        - id: ch01-b25
          speaker: tutor
          text: If I am to give an opinion of the little girl, I should first say that there is, on one side, a lack of development. This comes from the careless way she was raised, or rather, from the neglect of her early education and her solitary mountain life. That life is not entirely bad, of course. It has certain advantages, provided it does not continue beyond a reasonable length of time—
        - id: ch01-b26
          speaker: herr_sesemann
          text: My good friend, you're working much too hard. I only want to know two things. Have any animals she brought inside alarmed you? And do you think she is a suitable companion for my daughter?
        - id: ch01-b27
          speaker: tutor
          text: I would not want to turn you against her in any way. On one hand, she is unfamiliar with society because of the uncivilized life she led before coming to Frankfurt. On the other hand, she does possess some good qualities, and taken as a whole—
        - id: ch01-b28
          speaker: herr_sesemann
          text: Forgive me, my dear sir. Don't trouble yourself any further. I think my daughter may need me.
        - id: ch01-b29
          speaker: narrator
          text: Herr Sesemann quickly left the dining room, and he took care not to return while the tutor was there. In the study, he settled into a chair beside his daughter. Heidi rose politely when he turned toward her. He began to ask her for something, then stopped because he could not think what it should be. He only needed an excuse to send her away for a little while.
        - id: ch01-b30
          speaker: herr_sesemann
          text: Little one, would you fetch me... fetch me a glass of water.
        - id: ch01-b31
          speaker: narrator
          text: Water was the first thing that came into his mind.
        - id: ch01-b32
          speaker: heidi
          text: Fresh water?
        - id: ch01-b33
          speaker: herr_sesemann
          text: Yes, yes. As fresh as you can get it.
        - id: ch01-b34
          speaker: narrator
          text: Heidi vanished at once. Herr Sesemann drew his chair closer to Clara and took her hand.
        - id: ch01-b35
          speaker: herr_sesemann
          text: Now, my dear Clara, give me a clear answer. What animals has Heidi brought into the house? And why does Fraulein Rottenmeier think she sometimes loses her senses?
        - id: ch01-b36
          speaker: narrator
          text: Clara had no difficulty giving him a clear answer. Fraulein Rottenmeier had already spoken to her about Heidi's supposedly wild way of talking, but Clara had never understood what the lady meant by it. She told her father exactly what had happened with the tortoise. Then she told him about the basket of kittens and the commotion they had caused. Finally, she repeated what Heidi had said on the day Fraulein Rottenmeier became so frightened. By the end of Clara's account, Herr Sesemann was laughing heartily.
        - id: ch01-b37
          speaker: herr_sesemann
          text: So you don't want me to send her home? You haven't grown tired of having her here?
        - id: ch01-b38
          speaker: clara
          text: Oh, no! Please don't send her away. The days go much faster now that Heidi is here. Something new happens every day. It was so dull before, and she always has so much to tell me.
        - id: ch01-b39
          speaker: herr_sesemann
          text: Then that settles it. And here comes your little friend. Did you bring me some good fresh water?
        - id: ch01-b40
          speaker: narrator
          text: Heidi handed him a glass.
        - id: ch01-b41
          speaker: heidi
          text: Yes. It came straight from the pump.
        - id: ch01-b42
          speaker: clara
          text: You didn't go all the way to the pump yourself, did you?
        - id: ch01-b43
          speaker: heidi
          text: Yes, I did. It's very fresh. There were so many people at the first pump that I had to go farther down the street. The second pump was just as crowded. I finally got water at the pump on the next street. A white-haired gentleman asked me to give Herr Sesemann his kind regards.
        - id: ch01-b44
          speaker: herr_sesemann
          text: That was quite an expedition. Who was this gentleman?
        - id: ch01-b45
          speaker: heidi
          text: He was walking by. When he saw me, he stopped and said, "You have a glass. Will you give me a drink? Who are you taking the water to?" I told him it was for Herr Sesemann. He laughed a lot and sent you that message. He said he hoped you would enjoy the water, too.
        - id: ch01-b46
          speaker: herr_sesemann
          text: Now I wonder who sent me those good wishes. Tell me what he looked like.
        - id: ch01-b47
          speaker: heidi
          text: He was kind, and he laughed. He wore a thick gold chain with a gold thing hanging from it. It had a big red stone. The top of his walking stick looked like a horse's head.
        - id: ch01-b48
          speakers: [clara, herr_sesemann]
          ensemble: duo
          text: It was the doctor, my old friend the doctor!
          emotion: surprised
        - id: ch01-b49
          speaker: narrator
          text: Herr Sesemann smiled to himself. His old friend had stopped a little girl carrying a glass through the streets, asked her for a drink, and learned that the water was meant for Herr Sesemann. He could well imagine what the doctor must have thought of this unusual new way of satisfying his thirst.
        - id: ch01-b50
          speaker: narrator
          text: That evening, Herr Sesemann and Fraulein Rottenmeier were alone together, going over the affairs of the household. He informed her that Heidi would remain in the house. He had found the child perfectly sound in mind, and Clara clearly liked having her as a companion. There was no reason to send her away. Then he laid special weight on what he said next, so there could be no mistake about his wishes.
        - id: ch01-b51
          speaker: herr_sesemann
          text: I expect the child to be treated kindly in every way. Her unusual habits are not crimes. If she is too much for you to manage alone, help will soon arrive. My mother is coming for a long visit, and as you know, she can get along with anyone, no matter what they are like.
        - id: ch01-b52
          speaker: rottenmeier
          text: Oh, yes. I know.
        - id: ch01-b53
          speaker: narrator
          text: There was no relief at all in Fraulein Rottenmeier's voice. The thought of Frau Sesemann coming to help did not comfort her.
        - id: ch01-b54
          speaker: narrator
          text: Herr Sesemann stayed home only a short time. Before two weeks had passed, he had to leave again for Paris. Clara could hardly bear to have her father go away again so soon. He comforted her with the promise that her grandmother would arrive in only a few days and stay for a long visit.
        - id: ch01-b55
          speaker: narrator
          text: Herr Sesemann had barely gone when a letter came from Frau Sesemann. She would arrive the next day. The letter gave the hour so a carriage could meet her at the station.
        - id: ch01-b56
          speaker: narrator
          text: Clara was overjoyed by the news. All evening, she talked about her grandmother and the coming visit. She said "grandmamma" so often that before long, Heidi was calling the coming visitor "grandmamma" too. Fraulein Rottenmeier gave her a sharp look of displeasure. By now, though, Heidi was used to being continually in the lady's bad books. One more disapproving look had little effect on her.
        - id: ch01-b57
          speaker: narrator
          text: But Fraulein Rottenmeier did not mean to let the matter rest. As Heidi went toward her room that night, the lady was waiting for her. She stopped the child, drew her into her own room, and gave her strict instructions about the proper way to address Frau Sesemann when she arrived.
        - id: ch01-b58
          speaker: rottenmeier
          text: You must never call Frau Sesemann "grandmamma." You will always address her as "madam." Do you understand?
        - id: ch01-b59
          speaker: narrator
          text: Heidi's puzzled face showed that she did not understand at all. But Fraulein Rottenmeier looked so severe that Heidi did not dare ask her to explain.
