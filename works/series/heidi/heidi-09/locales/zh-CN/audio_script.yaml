audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    tutor:
      display_name: 家庭教师
      tts:
        delivery: 谨慎克制，说理时平稳周全
        timbre: 温和端正
        pace: 不紧不慢
        pitch: 中音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
    sesemann:
      display_name: 塞泽曼先生
      tts:
        delivery: 亲切爽朗，诙谐中带着明快果断
        timbre: 温厚清朗
        pace: 从容适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 父亲回来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 几天以后，塞泽曼先生家里一下忙碌起来。楼梯上脚步不断，塞巴斯蒂安和蒂内特来回奔走，把马车里的包裹一件件搬上楼。主人终于回来了。他每次回家，总要带回许多漂亮东西。不过这一回，他连行李也顾不上安顿，进门先去看女儿。
        - id: ch01-b02
          speaker: narrator
          text: 那时已近傍晚，海蒂正像往常一样陪着克拉拉。父女俩一见面，亲热得不得了。他们本来就彼此深爱。海蒂见了，悄悄退进墙角。塞泽曼先生却朝她伸出手，和气地招呼她。
        - id: ch01-b03
          speaker: sesemann
          text: 这就是我们家的瑞士小姑娘吧？来，过来跟我握握手。对，就是这样。告诉我，你和克拉拉是不是好朋友？你们会不会先吵架，再哭着和好，下一回又重新吵起来？
        - id: ch01-b04
          speaker: heidi
          text: 不会。克拉拉一直对我很好。
        - id: ch01-b05
          speaker: clara
          text: 海蒂也对我很好。她从来没有要跟我吵架。
        - id: ch01-b06
          speaker: narrator
          text: 塞泽曼先生听了很满意，站起身来。他一整天还没吃过东西，现在实在饿了。
        - id: ch01-b07
          speaker: sesemann
          text: 那我就放心了。克拉拉，你先原谅我离开一会儿，我非得去吃饭不可。等我吃完，再把带回来的东西全给你看。
        - id: ch01-b08
          speaker: narrator
          text: 餐厅里，罗滕迈尔小姐正在盯着仆人准备饭菜。主人刚一坐下，她也在对面落座。只看那张脸，就知道她有一肚子坏消息要说。塞泽曼先生不由得问她出了什么事。克拉拉明明看起来很快活，她这副迎接主人的神情却着实吓人。
        - id: ch01-b09
          speaker: rottenmeier
          text: 塞泽曼先生，这件事关系到克拉拉。我们受了极其可怕的欺骗。
        - id: ch01-b10
          speaker: sesemann
          text: 是吗？究竟怎么骗的？
        - id: ch01-b11
          speaker: narrator
          text: 塞泽曼先生照旧安安稳稳地喝着酒。罗滕迈尔小姐郑重地提醒他，当初大家决定给克拉拉找个小伴儿，是因为他希望女儿身边的人都有规矩、有教养。她正是为了这个，才挑了一个瑞士小姑娘。
        - id: ch01-b12
          speaker: rottenmeier
          text: 我以为，她会像书里写的那种孩子。她仿佛从山间清风里生出来，生活在高山上，走起路来轻飘飘的，连脚也不沾地。
        - id: ch01-b13
          speaker: sesemann
          text: 可一个瑞士孩子要去什么地方，总得踩着地面走吧？不然，上天就该给她一双翅膀，而不是两只脚。
        - id: ch01-b14
          speaker: rottenmeier
          text: 您明明懂我的意思。我说的是那种熟悉高山上所有生灵、在纯净天地里长大的孩子。她来到我们中间，应当像另一个世界来的美好精灵。
        - id: ch01-b15
          speaker: sesemann
          text: 可克拉拉要这样一位美好精灵来做什么呢？
        - id: ch01-b16
          speaker: rottenmeier
          text: 我没有说笑。事情比您以为的严重得多。我受骗了，而且骗得骇人，骗得可耻！
        - id: ch01-b17
          speaker: sesemann
          text: 到底什么事这样骇人、这样可耻？我看那孩子一点也不可怕。
        - id: ch01-b18
          speaker: rottenmeier
          text: 您根本不知道她做过什么！您不在的时候，她把各种人、各种动物都招进了屋。家庭教师能告诉您更多。
        - id: ch01-b19
          speaker: sesemann
          text: 动物？您说的究竟是什么动物？
        - id: ch01-b20
          speaker: rottenmeier
          text: 这根本没法解释。那孩子的一举一动都叫人无法理解，除非她有时候确实神志不清。
        - id: ch01-b21
          speaker: narrator
          text: 到这时为止，塞泽曼先生并没把她的话放在心上。可“神志不清”就不同了。若真是这样，说不定会伤到克拉拉。他眯起眼，仔细端详坐在对面的女士，想先看看究竟是不是她自己神志不清。就在这时，门开了，仆人通报说家庭教师到了。
    - id: ch02
      title: 两份离奇的报告
      blocks:
        - id: ch02-b01
          speaker: sesemann
          text: 来得正好！这下有人能帮我把事情弄清楚了。请坐，也陪我喝杯咖啡，千万别客气。现在请您告诉我，给我女儿作伴的那个孩子究竟怎么了？她真的把动物带进屋了吗？她的神志到底正不正常？
        - id: ch02-b02
          speaker: narrator
          text: 家庭教师觉得，自己应当先说有多么高兴见到主人回来，再解释他正是特意登门欢迎的。塞泽曼先生却请他别再铺垫，马上把海蒂的事说清楚。于是，家庭教师摆出一贯的说话方式，慢慢讲了起来。
        - id: ch02-b03
          speaker: tutor
          text: 既然您要听我的看法，我想先说明，一方面，这个小姑娘的心智还没有充分发展。原因大概是她从小没有受到细心照料，或者更准确地说，她的教育受到了忽视。她又长期独自在山上生活。不过，山居生活也不能完全否定。恰恰相反，只要时间不超过一定限度，它无疑也有一些益处……
        - id: ch02-b04
          speaker: sesemann
          text: 我的好先生，您不必费这么多心。我只问两件事。她带来的动物吓到您没有？总的说来，她适不适合陪伴我的女儿？
        - id: ch02-b05
          speaker: tutor
          text: 我绝不想说什么话，让您先对她产生偏见。一方面，她来法兰克福以前过着未开化的生活，所以不懂得怎样与人交往。另一方面，她也有一些很好的品质。若从整体来看……
        - id: ch02-b06
          speaker: narrator
          text: 塞泽曼先生再也听不下去了。他客气地请家庭教师不必继续费神，又说女儿大概正在找自己，随即飞快地离开餐厅，而且再没回来。
        - id: ch02-b07
          speaker: narrator
          text: 他回到书房，在克拉拉身边坐下。海蒂一见他进来，立刻站起身。他转向孩子，想请她拿一样东西，却怎么也想不出该拿什么。其实，他只是要把海蒂暂时支开，好单独问问女儿。最后，他总算想到了。
        - id: ch02-b08
          speaker: sesemann
          text: 小姑娘，替我拿一杯水来，好吗？
        - id: ch02-b09
          speaker: heidi
          text: 要新鲜的水吗？
        - id: ch02-b10
          speaker: sesemann
          text: 要，要，越新鲜越好。
        - id: ch02-b11
          speaker: narrator
          text: 海蒂立刻跑得没了踪影。塞泽曼先生把椅子拉得离女儿更近，握住她的手，请她清清楚楚地回答。海蒂到底带过什么动物进屋？罗滕迈尔小姐为什么认定她有时神志不清？
        - id: ch02-b12
          speaker: narrator
          text: 克拉拉一点也不为难。罗滕迈尔小姐也跟她说过，海蒂讲起话来疯疯癫癫，可克拉拉始终不明白那些话哪里不对。她把乌龟和小猫引起的乱子一件件讲给父亲听，又复述了那天海蒂说过的话。塞泽曼先生听完，放声大笑。
        - id: ch02-b13
          speaker: sesemann
          text: 那么，你不想让我送她回家？她住在这里，你还没有厌烦吗？
        - id: ch02-b14
          speaker: clara
          text: 没有，一点也没有！请您千万别送她走。海蒂来了以后，时间过得快多了。每天都会碰上新鲜事，不像以前那么闷。她还有说不完的话讲给我听。
        - id: ch02-b15
          speaker: narrator
          text: 这回答让父亲彻底放了心。正说着，海蒂回来了，手里端着一杯水。
        - id: ch02-b16
          speaker: sesemann
          text: 你的小伙伴回来了。怎么样，水够新鲜吗？
        - id: ch02-b17
          speaker: heidi
          text: 够新鲜，是刚从水泵里打出来的。
        - id: ch02-b18
          speaker: clara
          text: 你不会自己跑到水泵那里去了吧？
        - id: ch02-b19
          speaker: heidi
          text: 是我自己去的，所以水很新鲜。我走了好远。第一个水泵旁边人太多，我就继续往街下面走。第二个水泵旁边还是有那么多人，到了再下一条街，我才打到水。还有一位白头发的先生，让我替他向塞泽曼先生问好。
        - id: ch02-b20
          speaker: sesemann
          text: 你这一趟收获真不少！那位先生是谁呢？
        - id: ch02-b21
          speaker: heidi
          text: 他正从那里经过，看见我拿着杯子，就停下来问我，能不能给他喝一口水，还问我把水送给谁。我说是送给塞泽曼先生的，他听了笑得很厉害。他让我向您问好，还说希望您喝得高兴。
        - id: ch02-b22
          speaker: sesemann
          text: 原来还有人送我这样的好意。你说说看，他长什么样？
        - id: ch02-b23
          speaker: heidi
          text: 他很和气，总是在笑。他戴着一条粗粗的金链子，下面挂着一件金东西，上面有一颗很大的红宝石。他的手杖顶上还有一个马头。
        - id: ch02-b24
          speaker: clara
          text: 是医生，是那位老朋友医生！
        - id: ch02-b25
          speaker: sesemann
          text: 是医生，是我的老朋友！
        - id: ch02-b26
          speaker: narrator
          text: 父女俩同时认出了那个人。塞泽曼先生暗暗发笑。他忍不住猜想，老朋友看见海蒂用这种办法替自己取水，会对这件事作何感想。
    - id: ch03
      title: 海蒂可以留下
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 当天晚上，塞泽曼先生同罗滕迈尔小姐单独商量家里的事情。他明确告诉她，自己要把海蒂留下。孩子神志完全正常，克拉拉也很喜欢有她作伴。
        - id: ch03-b02
          speaker: sesemann
          text: 所以，我要您处处善待这个孩子。她有些地方和别人不同，可那不是罪过，不能这样看待。您要是觉得一个人实在应付不了，也不用发愁。我母亲很快就会来这里长住。您也知道，不管遇见什么样的人，她都能相处得来。
        - id: ch03-b03
          speaker: rottenmeier
          text: 哦，是的，我知道。
        - id: ch03-b04
          speaker: narrator
          text: 罗滕迈尔小姐嘴上这样回答，声音里却听不出半点轻松。显然，这位即将到来的帮手，并不能让她感到安慰。
        - id: ch03-b05
          speaker: narrator
          text: 塞泽曼先生这一次在家住得很短。还不到两个星期，他又要动身去巴黎。克拉拉舍不得父亲这么快离开。父亲便拿祖母来安慰她，说再过几天，祖母就会来到家里。
        - id: ch03-b06
          speaker: narrator
          text: 果然，塞泽曼先生前脚刚走，塞泽曼夫人的来信后脚便到了。她说自己第二天抵达，还把到站时间写得明明白白，好让家里派马车去车站迎接。
        - id: ch03-b07
          speaker: narrator
          text: 克拉拉高兴极了。那天晚上，她说起祖母就停不下来。海蒂听得多了，也跟着她叫起了“奶奶”。罗滕迈尔小姐立刻投来不悦的目光。不过，海蒂早已习惯这位女士事事都看自己不顺眼，所以并没有放在心上。
    - id: ch04
      title: 该叫她什么
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了晚上，海蒂正要回自己的房间，罗滕迈尔小姐却早已在路上等着。她把孩子拉进自己屋里，严厉地交代，塞泽曼夫人来了以后，该怎样称呼她。
        - id: ch04-b02
          speaker: rottenmeier
          text: 你绝对不许叫她“奶奶”。无论什么时候，都必须称她“夫人”。听明白了吗？
        - id: ch04-b03
          speaker: narrator
          text: 罗滕迈尔小姐说完，盯着海蒂困惑的脸。海蒂其实一点也没听明白，可她看见对方神色严厉，便不敢再问。
