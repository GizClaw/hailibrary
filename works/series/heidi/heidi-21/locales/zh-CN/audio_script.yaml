audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandfather:
      display_name: 外公
      tts: {delivery: "简短沉稳，粗粝中渐渐透出关怀", timbre: 低沉厚实, pace: 不紧不慢, pitch: 低音}
    clara:
      display_name: 克拉拉
      tts: {delivery: "温柔友善，带着久病女孩的安静和机敏", timbre: 轻柔清亮, pace: 从容自然, pitch: 中高音}
  chapters:
    - id: ch01
      title: 山上的清晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳刚从群山上升起来，第一片金光落在小屋和下面的山谷里。阿尔姆大叔早已静静站在屋外。他虔敬地望着晨雾一点点退去，山峰和谷地也从昏暗中显露出来，迎接新的一天。
        - id: ch01-b02
          speaker: narrator
          text: 淡淡的朝云越照越亮。太阳终于放出全部光辉，岩石、树林和山坡都变成了金色。大叔这才回到小屋，放轻脚步，上了梯子。
        - id: ch01-b03
          speaker: narrator
          text: 克拉拉刚刚醒来。阳光穿过圆窗，在床边跳动闪烁。她惊讶地看着，一时想不起这是哪里。等她瞧见身旁熟睡的海蒂，才听到爷爷愉快地问她，昨晚睡得好不好，早晨还累不累。
        - id: ch01-b04
          speaker: clara
          text: 我一点也不累。昨晚睡着以后，我一整夜都没醒过。
        - id: ch01-b05
          speaker: narrator
          text: 爷爷满意极了，马上替她穿戴起来。他的手又轻又稳，克拉拉需要什么，他都明白，仿佛照顾生病的孩子才是他最熟悉的工作。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂睁眼一看，克拉拉已经穿好了衣服，正让爷爷抱着下楼。她赶紧起床，飞快收拾好自己，顺着梯子跑下去，又冲出门外。
        - id: ch01-b07
          speaker: narrator
          text: 屋外还有一件新鲜事。昨夜孩子们睡下以后，爷爷拆掉羊棚侧面的两块木板，开出一道能让躺椅通过的口子。木板随时可以卸下，也能随时装回去。现在，他正从那里把克拉拉推到阳光下。安顿好她，他便去照看羊儿，海蒂跑来陪她。
        - id: ch01-b08
          speaker: narrator
          text: 清晨的风吹过两个孩子的脸，每一阵都送来冷杉的香气。克拉拉快活地深呼吸，靠在椅背上。她从未在这么早的时候来到开阔的山野，也从没让清晨的风这样迎面吹过。她觉得身体从没有这样健康，这样舒畅过。
        - id: ch01-b09
          speaker: narrator
          text: 这是她第一次这么早待在空旷的山野。高山的空气清凉又干净，每吸一口都叫人愉快。太阳明亮又可爱，在这里却不闷，也不烫，只把温暖轻轻放在她的手上和脚边的草地上。克拉拉从来不知道清晨的风会这样清新，更没想到山上的早晨会是这个样子。
        - id: ch01-b10
          speaker: clara
          text: 海蒂，要是我能永远留在这里，永远跟你住在一起，那该多好呀！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 她在椅子里转向这边，又转向那边，恨不得把四周的阳光和清风全都吸进来。
        - id: ch01-b12
          speaker: heidi
          text: 你现在相信了吧？我早就说过，跟爷爷一起住在山上，是世界上最美的事！
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: 爷爷从羊棚回来了，手里端着两小碗雪白的羊奶，奶沫还在碗沿轻轻晃动。
        - id: ch01-b14
          speaker: grandfather
          text: 这碗给小姑娘。小天鹅的奶能让你长力气。来，祝你健康，把它喝光吧。
        - id: ch01-b15
          speaker: narrator
          text: 克拉拉从没尝过羊奶。她先闻了闻，还有些犹豫，迟迟没有把碗送到嘴边。可海蒂毫不迟疑，一口接一口，喝得很香，她也跟着尝起来。不一会儿，碗底一滴也不剩了。原来她同样喜欢这味道，甜美得像是加过糖和肉桂。
        - id: ch01-b16
          speaker: grandfather
          text: 很好，明天我们喝两碗。
    - id: ch02
      title: 彼得的不高兴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得赶着羊群上来了。羊儿们争着跟海蒂亲热，叫声又响又密，附近的人根本听不见彼此说话。大叔便把彼得拉到一旁。
        - id: ch02-b02
          speaker: grandfather
          text: 你听好。从今天起，小天鹅爱去哪里，你就让它去。它知道哪里有最好的草。它想往高处走，你就跟上，别的羊也可以一起去。绝不能把它赶回来。多走几步累不着你，它也比你更清楚什么对自己好。我要它产最好的奶。你干吗那样瞪着那边，像要吃人似的？没人会妨碍你。快走吧，别忘了我的话。
        - id: ch02-b03
          speaker: narrator
          text: 彼得不敢违抗大叔，只好带羊群出发。可他扭头斜眼一瞟，心里显然还压着什么。羊儿们簇拥海蒂走了一小段，彼得正希望她跟来。
        - id: ch02-b04
          speaker: peter
          text: 你得跟我们一起走。小天鹅往哪里去，我就得跟到哪里。
        - id: ch02-b05
          speaker: heidi
          text: 我不能去！克拉拉在这里一天，我就一天不能跟羊群上山，所以会有好久好久不能去。不过爷爷答应了，有一天会带我们两个一起上去。
        - id: ch02-b06
          speaker: narrator
          text: 海蒂从羊群中挤出来，跑回克拉拉身边。彼得却握起两只拳头，朝躺椅上的病女孩比画了一下。他随即不停步地向上爬，直到身影消失。他害怕大叔看见，更不敢想大叔会怎样处置那两只拳头。
        - id: ch02-b07
          speaker: narrator
          text: 两个女孩计划了太多事情，反倒不知道先做哪一件。海蒂提议先给奶奶写信，她们答应过每天报平安。奶奶一直担心，长久住在山上是否真的有益于克拉拉的健康，也不知道她会不会一直喜欢这里。只要每天收到外孙女的消息，她就能放心留在拉加茨。一旦克拉拉需要她，她也能立刻赶来。
        - id: ch02-b08
          speaker: clara
          text: 写信一定得进屋吗？我真不想离开外面。
        - id: ch02-b09
          speaker: narrator
          text: 海蒂马上想出了办法。她跑进屋，取来课本、纸笔和小凳，把读本和习字簿叠在克拉拉膝上当桌子，自己坐到长凳边。两个人就这样开始写信。可克拉拉每写一句，就忍不住抬头看一会儿，这地方实在美得叫人无心低头。风轻轻扇着她的脸，在冷杉间低声响着。长翅膀的小虫嗡嗡飞过透明的空气，阳光下辽阔的牧场安安静静。沉默的高峰立在上方，宽广安详的山谷铺在下面。偶尔有牧童远远喊一声，岩石便送回轻柔的回声。
        - id: ch02-b10
          speaker: narrator
          text: 两个孩子只顾写写停停，不知不觉，上午过去了。爷爷端来午间热腾腾的羊奶，说只要天空里还留着一点阳光，小姑娘就该待在屋外。大家像昨天一样露天吃午饭。饭后，海蒂把克拉拉推到冷杉树下。她们商量好了，整个下午都待在那里，把海蒂离开法兰克福以后发生的事情全讲一遍。那边的生活大致还是老样子，可塞泽曼家里有那么多海蒂熟悉的人，每个人都有新鲜小事可说。
        - id: ch02-b11
          speaker: narrator
          text: 她们坐在树荫下越谈越起劲，树上的鸟儿也唱得越响，仿佛很爱听孩子们的闲话，还想加入进来。时间飞快溜走，她们觉得只过了一会儿，傍晚却已经来了。彼得也赶着羊群回来。他还是皱着眉，满脸怒气。
        - id: ch02-b12
          speaker: heidi
          text: 晚安，彼得！
        - id: ch02-b13
          speaker: clara
          text: 彼得，晚安！
        - id: ch02-b14
          speaker: narrator
          text: 彼得像是根本没有听见，一句也不回答，只管板着脸，气冲冲地赶着羊群继续往前走。
    - id: ch03
      title: 山上的好日子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 爷爷牵走小天鹅去挤奶。克拉拉望着它，忽然特别想再喝一碗香喷喷的奶，等得都有些心急。
        - id: ch03-b02
          speaker: clara
          text: 海蒂，这不是很奇怪吗？我从小吃东西，都只是因为别人说我非吃不可。什么都像鱼肝油，我总希望人不用吃，也不用喝。现在呢，我居然盼着爷爷快把羊奶送来。
          emotion: surprised
        - id: ch03-b03
          speaker: heidi
          text: 我懂。以前在法兰克福，饭菜也总像卡在我的喉咙里，怎么都咽不下去。
        - id: ch03-b04
          speaker: narrator
          text: 海蒂记得自己在法兰克福的滋味，克拉拉却还不能完全明白。她从没在户外过上一整天，更没有呼吸过这样高爽而充满活力的山间空气，自然不知道胃口从哪里来了。爷爷终于送来晚奶，她立刻大口喝起来，比海蒂还先见到碗底，随后又想再要一点。
        - id: ch03-b05
          speaker: narrator
          text: 爷爷拿着两个空碗进屋，再出来时，碗里又盛满了奶。他还端来两片厚实的面包，上面抹着满满的黄油。那天下午，他特意走到一个牧人家里，因为那家做的黄油格外香甜，他便带了一大块回来。两个孩子有了山间生活带来的好胃口，吃得津津有味。爷爷站在旁边，看得满心欢喜。
        - id: ch03-b06
          speaker: narrator
          text: 晚上，克拉拉原想躺着看星星，眼睛却怎么也睁不开。海蒂刚睡着，她也睡了，一夜又沉又安稳。这样的好觉，她过去从来没有过。接下来两天也一样舒心。到了第三天，两名壮实的脚夫上山了，每人肩上扛着一张床，还有全套铺盖和雪白的新床罩。
        - id: ch03-b07
          speaker: narrator
          text: 脚夫也带来奶奶的一封信。信里说，两张床是送给克拉拉和海蒂的。从此海蒂得睡在真正的床上。冬天去多尔夫里时，她带走一张，另一张留在小屋。这样，克拉拉每次来山上，都知道这里有一张床专门等着她。奶奶还谢谢孩子们写了那么长的信，请她们天天写下去，好让自己知道她们做过什么，也能在心里看见她们每天的生活。
        - id: ch03-b08
          speaker: narrator
          text: 爷爷爬上阁楼，把海蒂原先铺床的干草全都掀起来，推回那一大堆草垛。随后，他又帮着脚夫，把两张床一张接一张搬到阁楼上。他把床紧紧挨在一起，位置正好还能看见圆窗外的阳光和星星。孩子们多么喜欢白天照进来的太阳，也喜欢夜里闪烁的星光，爷爷全都知道。
        - id: ch03-b09
          speaker: narrator
          text: 拉加茨的奶奶每天收到山上的好消息，知道病弱的外孙女一天比一天好，自然十分高兴。克拉拉也越来越喜欢这里。爷爷把她照顾得那么周到，待她又那么亲切，她怎么夸都夸不完。海蒂整天活泼地陪着她，甚至比在法兰克福时更加有趣。每天早晨一睁眼，她想到的第一句话都一样。
        - id: ch03-b10
          speaker: clara
          text: 啊，真好，我还在这里！
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: 每天都有这样确切的好消息，奶奶知道外孙女一切顺利，就决定把探望孩子们的日子往后推一推。毕竟，那段陡峭的山路上去再下来，对她多少有些劳累。
        - id: ch03-b12
          speaker: narrator
          text: 爷爷格外怜爱这个病弱的小客人，每天都琢磨一个新办法，想让她恢复得更快。每天下午，他都会上山，而且一天比一天爬得更高。傍晚回来时，他抱着一大束叶子。石竹和百里香似的气息混在一起，隔着老远就能闻到。他把叶束挂进羊棚，羊儿们一回来就认出了香味，急得恨不能马上扑过去。
        - id: ch03-b13
          speaker: narrator
          text: 可爷爷辛苦爬上高处，寻找这些稀罕植物，并不是要让整群羊不费力气就吃到美食。叶子全归小天鹅，好让它产出格外上好的奶。这份加餐很快有了效果。小天鹅越来越活泼，嬉闹的时候总把头高高一扬，两只眼睛也一天比一天明亮。
        - id: ch03-b14
          speaker: narrator
          text: 克拉拉来到山上，转眼已经三个星期。近来每天早晨，爷爷把她抱下楼，都会问她愿不愿意试着站上一两分钟。他的口气总是耐心又温和。
        - id: ch03-b15
          speaker: grandfather
          text: 小姑娘，今天也试一试，好不好？
        - id: ch03-b16
          speaker: narrator
          text: 克拉拉想让爷爷高兴，每次都答应。可双脚一碰地，她就紧紧抓住他，喊着腿疼。爷爷仍让她每天多坚持一小会儿。
    - id: ch04
      title: 明天一起上山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 群山间好多年没有过这样灿烂的夏天。日子一天天过去，天空始终没有一片云，太阳也始终明亮。鲜花尽情张开带着香气的花瓣，目光落到哪里，哪里就有鲜艳的颜色迎上来。到了傍晚，深红霞光落在群峰和辽阔的大雪原上，越照越浓，太阳最后沉进一片金色的火海。
        - id: ch04-b02
          speaker: narrator
          text: 海蒂怎么也讲不完那片美景，因为只有再往高处走，才能看见所有色彩一起铺开的辉煌。她最爱讲山坡上的那处花地。明亮的金色岩蔷薇一大片一大片盛开，蓝花多得数不清，连草地都像变成了蓝色。近旁还有整丛整丛的棕色花朵，香气那么醉人，只要在那里坐下，就再也不想挪动一步。
        - id: ch04-b03
          speaker: narrator
          text: 一天傍晚，她陪克拉拉坐在冷杉下面，又讲了一遍鲜花和夕阳。说着说着，她忽然太想亲眼再看一次，便跳起来，跑向羊棚。她还没进门，爷爷已经听到了喊声。
        - id: ch04-b04
          speaker: heidi
          text: 爷爷，明天带我们跟羊群一起上山，好不好？现在上面真的美极了！
          emotion: happy
        - id: ch04-b05
          speaker: grandfather
          text: 可以。不过我答应你，小姑娘也要做一件让我高兴的事。今天晚上，她得再试一次，好好用双脚站住。
        - id: ch04-b06
          speaker: narrator
          text: 海蒂立刻跑回克拉拉身边，把好消息告诉她。克拉拉一心盼着明天的远足，答应晚上会照爷爷说的，再试一次，而且一定拿出最大的力气。海蒂比她还要快活，也更加激动。傍晚，彼得的身影刚一出现，她就迫不及待地朝他喊起来。
        - id: ch04-b07
          speaker: heidi
          text: 彼得！明天我们大家都跟你上山，还会在那里待一整天！
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: 彼得像一头气坏了的熊，只含糊地咕哝一声。他忽然举起木棍，要打绿雀。绿雀看见了，马上跃过雪花的背，躲到一旁，木棍只从空气里扫过去。
        - id: ch04-b09
          speaker: narrator
          text: 那天晚上，克拉拉和海蒂躺进各自的漂亮新床，满心都是对明天的快乐期待。她们有那么多计划要商量，便认真说好整夜不睡，一直聊到可以起床的时候。谁知脑袋才碰到柔软的枕头，谈话就突然停了。两个孩子已经进入梦乡。
        - id: ch04-b10
          speaker: narrator
          text: 克拉拉梦见一片无边无际的田野。蓝色钟形花开得密密麻麻，把大地铺成了天空的颜色。海蒂则听见高处那只巨大的猛禽在呼唤她。
        - id: ch04-b11
          speaker: narrator
          text: 那声音一遍又一遍地喊着：“来吧！来吧！来吧！”
