  chapters:
    - id: ch01
      title: How Life Went On at Grandfather's
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The sun had just climbed above the mountains. Its first golden rays reached the hut and the valley below. Grandfather stood quietly outside, as he did each morning, watching the thin mist slowly lift. He remained there for some time, still and devout. The heights and the valley came out of the twilight shadows and woke to a new day. Overhead, the pale morning clouds grew brighter and brighter. At last the sun shone in all its glory, and golden light poured over the rocks, woods, and hills.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather went back into the hut and softly climbed the ladder. Clara had just opened her eyes. Bright sunlight streamed through the round window, dancing and sparkling all around her bed. She stared at it in wonder. For a moment she could not remember what she was seeing or where she was. Then she noticed Heidi asleep beside her, and Grandfather cheerfully asked whether she had slept well and felt rested.
        - id: ch01-b03
          speaker: clara
          text: I'm not tired at all. Once I fell asleep, I never woke up the whole night.
        - id: ch01-b04
          speaker: narrator
          text: Grandfather was pleased. He cared for her so gently and knew just what she needed. Anyone might have thought he had spent his life looking after sick children.
        - id: ch01-b05
          speaker: narrator
          text: When Heidi woke, Clara was already dressed and resting in Grandfather's arms, ready to go downstairs. Heidi flew through her own dressing and hurried down the ladder. Outside, another surprise waited. After the children had gone to bed, Grandfather had removed two boards from the side of the shed. The hut door was too narrow for Clara's chair, so he had made an opening wide enough to roll it through. The boards stayed loose and could be put back whenever he wished.
        - id: ch01-b06
          speaker: narrator
          text: Grandfather was already wheeling Clara through the new opening and out into the sunshine. He left her in front of the hut while he went to tend the goats, and Heidi ran to her friend. A fresh breeze moved around the girls' faces. Each new puff carried the scent of the fir trees. Clara breathed it in with delight, leaned back in her chair, and felt a kind of health and comfort that was entirely new to her.
        - id: ch01-b07
          speaker: narrator
          text: Never before in her life had Clara been outdoors so early in the countryside. She had never felt a fresh morning breeze like this one. The pure mountain air was cool and refreshing, and every breath was a pleasure. Then there was the bright, lovely sun. Up here it was not hot or heavy. It lay soft and warm on her hands and on the grass by her feet. Clara had never imagined the mountain would feel like this.
        - id: ch01-b08
          speaker: clara
          text: Oh, Heidi, I wish I could stay up here with you forever!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: She turned from side to side in her chair, eager to feel the sun and air all around her.
        - id: ch01-b10
          speaker: heidi
          text: Now you know I was right. Being up here with Grandfather is the most beautiful thing in the world!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Just then Grandfather came from the goat shed with two small bowls of foaming white milk, one for each girl.
        - id: ch01-b12
          speaker: grandfather
          text: This will do my little daughter good. It's from Little Swan, and it will make you strong. Here's to your health, child. Drink it all.
        - id: ch01-b13
          speaker: narrator
          text: Clara had never tasted goat's milk before. She hesitated and smelled it before letting the bowl touch her lips. Then she saw Heidi drink without the least doubt and noticed how much Heidi enjoyed it. Clara followed her example. She kept drinking until not a single drop remained. She thought it was delicious, almost as if someone had mixed sugar and cinnamon into the milk.
        - id: ch01-b14
          speaker: grandfather
          text: Tomorrow, we'll drink two bowls.
        - id: ch01-b15
          speaker: narrator
          text: He had watched with satisfaction as Clara followed Heidi's example.
        - id: ch01-b16
          speaker: narrator
          text: Peter now arrived with the herd. The goats crowded around Heidi to give her their usual noisy morning welcome. They bleated without stopping, each one eager to show its joy and affection. The noise was so great that no one standing near them could hear a word, so Grandfather drew Peter aside.
        - id: ch01-b17
          speaker: grandfather
          text: Listen carefully. Starting today, let Little Swan go wherever she chooses. She knows where to find the best plants. If she climbs higher, follow her, and let the other goats go too. Do not turn her back. A little more climbing won't hurt you, and she knows what is good for her better than you do. I want her to give the finest milk she can. And why are you staring over there as if you'd like to eat someone? No one is going to trouble you. Now go, and remember what I said.
        - id: ch01-b18
          speaker: narrator
          text: Peter was used to obeying Grandfather at once. He marched away with the herd, but he turned his head and rolled his eyes in a way that showed he was keeping some thought to himself. The goats pressed around Heidi and carried her with them for a short distance. That was exactly what Peter wanted.
        - id: ch01-b19
          speaker: peter
          text: You'll have to come with us. I have to follow Little Swan now.
        - id: ch01-b20
          speaker: heidi
          text: I can't! I won't be able to come for a long, long time, not while Clara is here. But Grandfather promised to take both of us up the mountain one day.
        - id: ch01-b21
          speaker: narrator
          text: Heidi freed herself from the goats and ran back to Clara. Peter clenched both fists and shook them at the girl in the chair. Then he hurried up the slope until he was out of sight. He was afraid Grandfather might have seen him, and he had no wish to find out what Grandfather thought of those fists.
        - id: ch01-b22
          speaker: narrator
          text: Clara and Heidi had made so many plans that they hardly knew where to start. Heidi suggested writing first to Grandmamma. They had promised to send her news every day. Grandmamma did not yet know whether a long stay on the mountain would suit Clara's health, or whether Clara would go on enjoying herself there. If news of her granddaughter arrived each day, Grandmamma could stay in Ragatz without worrying. She would also be ready to come to Clara at a moment's notice.
        - id: ch01-b23
          speaker: clara
          text: Do we have to go inside to write? I'd rather stay here. It's so much nicer outdoors.
        - id: ch01-b24
          speaker: narrator
          text: Heidi knew how to arrange that. She fetched her schoolbooks, writing things, and little stool. She laid a reading book and copybook across Clara's knees to make a desk, then sat at the bench and began her own letter. Clara stopped after nearly every sentence to look around. The day was far too beautiful for steady writing.
        - id: ch01-b25
          speaker: narrator
          text: The breeze had softened. Now it only cooled Clara's face and whispered lightly through the fir trees. Tiny winged insects hummed and danced around her in the clear air. A deep stillness rested over the wide, sunny pastures. High peaks rose silently above them, while far below, the whole broad valley lay in peace. Once in a while, a shepherd boy's call traveled through the air. Then a soft echo came back from the rocks.
        - id: ch01-b26
          speaker: narrator
          text: Morning slipped away without the girls noticing. At noon Grandfather came with bowls of steaming milk. His little daughter, he said, must stay outdoors as long as one ray of sunlight remained in the sky. He set out the midday meal, and once again they ate in the open air. Afterward, Heidi pushed Clara's chair into the shade of the fir trees. They had agreed to spend the afternoon telling each other everything that had happened since Heidi left Frankfurt. In a general way, life at the Sesemann house had gone on as usual. But there were all sorts of smaller things to tell about the people who lived there, people Heidi knew very well.
        - id: ch01-b27
          speaker: narrator
          text: The girls sat talking under the trees. The livelier their conversation became, the louder the birds sang overhead. It sounded almost as if the birds wanted to take part in the girls' happy gossip. The hours flew past so quickly that evening seemed to arrive all at once. Peter came back down the mountain with the goats, still scowling and looking angry.
        - id: ch01-b28
          speaker: heidi
          text: Good night, Peter!
        - id: ch01-b29
          speaker: clara
          text: Good night, Peter!
        - id: ch01-b30
          speaker: narrator
          text: Peter ignored them and trudged on with the goats.
        - id: ch01-b31
          speaker: narrator
          text: Clara watched Grandfather lead Little Swan away for milking. All at once, she longed for another bowl of that fragrant milk and could hardly wait for him to bring it.
        - id: ch01-b32
          speaker: clara
          text: Isn't this strange, Heidi? For as long as I can remember, I only ate because I had to. Everything seemed to taste like cod-liver oil. I used to wish I never had to eat or drink. And now I'm waiting and waiting for Grandfather to bring the milk.
          emotion: surprised
        - id: ch01-b33
          speaker: heidi
          text: Yes, I know exactly what that's like.
        - id: ch01-b34
          speaker: narrator
          text: Heidi remembered the many days in Frankfurt when food seemed to stick in her throat. Clara did not understand what had changed. She had never spent a whole day outdoors before, much less in such high, life-giving mountain air.
        - id: ch01-b35
          speaker: narrator
          text: When Grandfather finally brought the evening milk, Clara drank so quickly that her bowl was empty before Heidi's. Then she asked for a little more. Grandfather carried both bowls inside and soon brought them out full again. This time he had something else for their supper. That afternoon, he had walked to a herdsman's house where sweet-tasting butter was made and brought home a large piece. Now he spread it thickly over two good slices of bread. He stood and watched with pleasure while Clara and Heidi ate their delicious meal with the hunger and enjoyment of children.
        - id: ch01-b36
          speaker: narrator
          text: That night Clara lay down, planning to watch the stars. But her eyes would not stay open. She fell asleep as soon as Heidi did and slept soundly until morning, something she could not remember ever doing before.
        - id: ch01-b37
          speaker: narrator
          text: The next two days passed just as pleasantly. On the third day, the girls received a surprise. Two strong porters climbed the mountain. Each carried a bed on his shoulders, along with bedding and a beautiful new white coverlet. They also brought a letter from Grandmamma.
        - id: ch01-b38
          speaker: narrator
          text: The beds were for Clara and Heidi. From then on, Grandmamma wrote, Heidi must always sleep in a proper bed. When she moved down to Dorfli for the winter, she should take one bed with her and leave the other at the hut. That way Clara would always know a bed was waiting whenever she visited the mountain. Grandmamma thanked the girls for their long letters and asked them to keep writing each day, so she could picture everything they were doing.
        - id: ch01-b39
          speaker: narrator
          text: Grandfather climbed to the loft and pulled the hay from Heidi's old bed, throwing it back onto the great hay pile. Then he helped the porters carry the new beds upstairs. He placed them close beside each other, but made sure the girls could still look through the little window. He knew how much pleasure they found in the sunlight by day and the stars at night.
        - id: ch01-b40
          speaker: narrator
          text: Meanwhile, down in Ragatz, Grandmamma rejoiced over the excellent reports that arrived from the mountain each day. Clara found her new life more delightful all the time. She could not say enough about the kindness and care Grandfather gave her. She also wrote about Heidi's lively, amusing company. Up here, Heidi was even more entertaining than she had been in Frankfurt. Each morning when Clara opened her eyes, her first thought was, "Oh, how glad I am to still be here."
        - id: ch01-b41
          speaker: narrator
          text: Every letter gave Grandmamma fresh proof that all was going well with Clara. So she decided she could put off her next visit to the children a little longer. Riding up and down the steep mountain was tiring for her.
        - id: ch01-b42
          speaker: narrator
          text: Grandfather seemed to feel a special tenderness for the sick child in his care. Every day he tried to think of something new that might help her recover. Each afternoon he climbed the mountain, going a little higher than he had the day before. In the evening he returned with a large bundle of leaves. Their mingled fragrance was like carnations and thyme, and the children could smell it while he was still some distance away.
        - id: ch01-b43
          speaker: narrator
          text: Grandfather hung the bundle inside the goat shed. When the goats came home, they recognized the smell and went wild trying to reach the leaves. But he had not climbed after those rare plants merely to give the herd a treat without making them search for it. Everything he gathered was for Little Swan alone. He wanted her to give especially fine milk for Clara. The extra feeding soon showed its effect. Little Swan tossed her head with more playful energy every day, and a bright glow came into her eyes.
        - id: ch01-b44
          speaker: narrator
          text: Three weeks had now passed since Clara came to the mountain. For the last several mornings, after carrying her downstairs, Grandfather had asked whether she would try standing on her feet for a minute or two.
        - id: ch01-b45
          speaker: grandfather
          text: Will my little daughter try standing for me today?
        - id: ch01-b46
          speaker: narrator
          text: Clara tried because she wanted to please him. But the moment her feet touched the ground, she clung to him.
        - id: ch01-b47
          speaker: clara
          text: It hurts too much!
        - id: ch01-b48
          speaker: narrator
          text: Grandfather held her safely, but he had her continue the effort a little longer each day.
        - id: ch01-b49
          speaker: narrator
          text: The mountains had not seen such a splendid summer in many years. Day after day, the sky stayed cloudless and the sun shone brilliantly. Fragrant flowers opened wide, and wherever anyone looked, the land glowed with color. At evening, crimson light spread across the mountain peaks and over the great field of snow. At last, the sun went down in a sea of golden flame.
        - id: ch01-b50
          speaker: narrator
          text: Heidi never grew tired of describing all this to Clara, because the full glory of those colors could only be seen higher up. Most of all, she talked about one place on the upper slope. Bright golden rock roses grew there in great masses. Blue flowers were so thick that the grass itself seemed to have turned blue. Close beside them stood whole bushes covered with brown blossoms. Their scent was so delicious that once you sat down among them, you never wanted to move again.
        - id: ch01-b51
          speaker: narrator
          text: One evening under the fir trees, Heidi was telling Clara again about the flowers and the wonderful sunset. Suddenly she longed so strongly to see it all that she jumped up and ran to Grandfather in the shed. She began calling before she was even inside.
        - id: ch01-b52
          speaker: heidi
          text: Grandfather, will you take us up with the goats tomorrow? Oh, it's so beautiful there now!
        - id: ch01-b53
          speaker: grandfather
          text: All right. But if I do, my little daughter must do something for me. This evening, she must try her very best to stand on her feet again.
        - id: ch01-b54
          speaker: narrator
          text: Heidi raced back beneath the fir trees with the good news. Clara promised that she would try her very best, just as Grandfather wished. She was looking forward to the next day's trip more than she could say. Heidi was so pleased and excited that she called to Peter the moment he came into sight that evening.
        - id: ch01-b55
          speaker: heidi
          text: Peter! Peter! Tomorrow we're all coming with you, and we'll stay up there the whole day!
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: Peter was as cross as a bear. He muttered something and raised his stick to strike Greenfinch for no reason at all. Greenfinch saw it coming. She leaped over Snowflake's back, and the stick struck only the air.
        - id: ch01-b57
          speaker: narrator
          text: That night Clara and Heidi climbed into their two fine beds, filled with happy thoughts of tomorrow. Their heads were so full of plans that they agreed to stay awake all night. They would keep talking until it was late enough for them to get up. But their heads had hardly touched the soft pillows when the conversation suddenly stopped.
        - id: ch01-b58
          speaker: narrator
          text: Clara dreamed of an enormous field the color of the sky, so thick with blue, bell-shaped flowers that no ground could be seen. And from high above, Heidi heard the great bird of prey calling to her, "Come! Come! Come!"
