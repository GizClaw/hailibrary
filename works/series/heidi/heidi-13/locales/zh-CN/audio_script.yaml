audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
    sesemann:
      display_name: 赛赛曼先生
      tts:
        delivery: 爽直果断，诙谐中带着一家之主的威严
        timbre: 明朗沉稳
        pace: 从容有力
        pitch: 中低音
    tinette:
      display_name: 蒂内特
      tts:
        delivery: 冷淡傲慢，说话简短而疏远
        timbre: 清脆偏冷
        pace: 稍快
        pitch: 中高音
    dete:
      display_name: 德特
      tts:
        delivery: 精明健谈，推托时语速急促
        timbre: 明亮利落
        pace: 偏快
        pitch: 中高音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 直率粗朴，带着山村人的审视口气
        timbre: 粗厚
        pace: 适中
        pitch: 中低音
    grandmother:
      display_name: 祖母
      tts:
        delivery: 慈爱虔诚，喜悦中带着年迈者的颤音
        timbre: 温柔苍老
        pace: 缓慢
        pitch: 中音
    brigitta:
      display_name: 布丽吉塔
      tts:
        delivery: 朴实热心，惊讶时话语接连不断
        timbre: 温厚明朗
        pace: 适中
        pitch: 中音
    grandpa:
      display_name: 爷爷
      tts:
        delivery: 寡言沉稳，粗粝外表下藏着深厚温情
        timbre: 低沉沧桑
        pace: 舒缓
        pitch: 低音
    peter:
      display_name: 彼得
      tts:
        delivery: 质朴少言，开心时仍有几分腼腆
        timbre: 清亮朴实
        pace: 稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 天亮前的决定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天才四点半，赛赛曼先生已经又恼火又激动地冲上楼。他穿过走廊，把罗滕迈尔小姐的房门敲得震天响。她从睡梦中惊叫着醒来，只听见主人隔着门催她赶快到餐厅去，说家里必须立刻准备一趟旅程。罗滕迈尔小姐看看钟，简直不敢相信。她一辈子没起过这么早，脑子里只转着一个问题，究竟出了什么事？好奇加上慌张，她拿什么都拿错，越急越忙不成，竟满屋寻找已经穿在身上的衣服。
        - id: ch01-b02
          speaker: narrator
          text: 赛赛曼先生继续向前，把通往各个仆人房间的铃逐一拉响。一个个惊慌的身影从床上跳起来，都认定幽灵袭击了主人，主人正等着他们救命。他们一个接一个赶到餐厅，一张脸比一张脸害怕。可主人好端端地在屋里来回踱步，神色还很愉快，完全不像刚和幽灵打过照面。约翰马上去套马备车，蒂内特去叫醒海蒂，替她穿好出门衣服，塞巴斯蒂安则赶去德特做事的那户人家，把她带来。
        - id: ch01-b03
          speaker: narrator
          text: 罗滕迈尔小姐终于梳洗穿戴完毕，下楼来了。她浑身收拾得一丝不乱，只有帽子前后戴反。赛赛曼先生只当她清早被自己惊醒，才会这样慌乱，并没有多问。他立刻要她找一只箱子，把那个瑞士孩子的全部东西装进去。他还不习惯海蒂这个名字，平常总那样称呼她。箱子里还要添上克拉拉不少衣物，好让孩子带着一身体面的行装回家。这些事都要马上办，根本没有时间慢慢斟酌。
        - id: ch01-b04
          speaker: narrator
          text: 罗滕迈尔小姐愣在原地。她本来满心等着听主人讲一场可怕的闹鬼经历，谁知等来的只是麻烦又平常的收拾行李。她又失望又不解，还盼着主人说明缘由。赛赛曼先生却已经去找克拉拉了。
        - id: ch01-b05
          speaker: narrator
          text: 宅子里的动静也惊醒了克拉拉。父亲坐在床边，把昨夜的事情全告诉她。医生说海蒂的神经过度紧张。她若继续夜夜梦游，可能越走越远，甚至爬到屋顶上去。所以必须立刻送她回家。
        - id: ch01-b06
          speaker: narrator
          text: 克拉拉难过得想出一个又一个办法，希望海蒂留下。父亲没有改变决定，只答应她，只要不再闹别扭，明年夏天便带她去瑞士。克拉拉只好让步，不过她要把箱子抬进自己房里，好亲手添上喜欢的东西。父亲很乐意让她替海蒂准备一套漂亮行装。
        - id: ch01-b07
          speaker: narrator
          text: 德特也在这时赶到了。她站在前厅，想不通这么早把自己叫来，究竟是出了什么大事。赛赛曼先生说明海蒂的病情，要她当天就送孩子回去。德特大失所望。她想起阿尔姆大叔最后说过，再也不愿见她。孩子先留下，后来又被她带走，如今竟还要送回去，这件事怎么想都不稳妥，也不明智。于是她搬出惯常那套说不完的理由，说今天明天都绝对走不了，手头事情太多，往后几天多半也没有空。
        - id: ch01-b08
          speaker: narrator
          text: 赛赛曼先生听懂了，她根本不肯去，便让她离开。他改叫塞巴斯蒂安护送海蒂，当天到巴塞尔住一夜，第二天把孩子送回爷爷身边，再立刻回来。他还会写封信，把事情向老人解释清楚。
        - id: ch01-b09
          speaker: sesemann
          text: 有件事你千万留心。到了这张卡片上的旅馆，先检查孩子房里的窗户，全部关紧。她上床以后，再从外面锁住房门。她会梦游，在陌生地方走下楼、打开大门，可能会遇上危险。你明白了吗？
        - id: ch01-b10
          speaker: sebastian
          text: 啊，原来闹鬼就是这么回事！
          emotion: surprised
        - id: ch01-b11
          speaker: sesemann
          text: 对，就是这么回事。你是个胆小鬼，约翰也一样。告诉他，这一屋子人全是傻瓜。
        - id: ch01-b12
          speaker: narrator
          text: 赛赛曼先生说完便去书房给阿尔姆大叔写信。塞巴斯蒂安独自留在原地，想到自己把梦游的孩子当成鬼，越想越觉得难堪。他一遍又一遍地对自己说，都怪约翰那个笨蛋硬把他拖回房里。要是当时没有退缩，他早就亲自追上那个小白影，把它看个清楚了。如今若让他再见到一次，他肯定会马上追过去。当然，他反复说着这番勇敢话的时候，清晨的天光已经照进屋里，房间里的每一处角落都明明白白地摆在眼前。
        - id: ch01-b13
          speaker: narrator
          text: 海蒂已经穿好礼拜日的裙子，站在那里等候。蒂内特只把她摇醒，替她穿衣，一个字也没解释。在她眼里，这个没受过教育的小丫头还不值得自己开口。
    - id: ch02
      title: 告别法兰克福
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 赛赛曼先生带着写好的信回到餐厅，早餐也已经摆上桌。他四下一看，不见海蒂，便问孩子去了哪里。有人把海蒂领来，她走到主人面前，像平常一样向他道早安。赛赛曼先生没有立刻开口，只仔细端详着孩子的脸，像是在确认医生所说的病容。随后，他问海蒂觉得这个安排怎么样。孩子一脸迷惑，完全不知道家里为何清早忙成一团，更不知道那辆正在准备的马车正是来接自己的。
        - id: ch02-b02
          speaker: sesemann
          text: 原来没人告诉你。你今天就回家，现在马上动身。
        - id: ch02-b03
          speaker: heidi
          text: 您是说，我今天真的能回家了吗？
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: 海蒂的脸一下白了。这个消息压得她一时喘不过气来。赛赛曼先生问她还想不想听下去，她的双颊立刻因为欢喜红了起来。
        - id: ch02-b05
          speaker: heidi
          text: 想，当然想！
          emotion: happy
        - id: ch02-b06
          speaker: sesemann
          text: 那就坐下来，好好吃早饭。吃完以后，你坐马车出发。
        - id: ch02-b07
          speaker: narrator
          text: 海蒂很想照办，却连一口也咽不下去。她激动得不知道自己是醒着还是在做梦，会不会再一睁眼，又穿着睡衣站在临街的大门前。赛赛曼先生叫罗滕迈尔小姐替塞巴斯蒂安备足食物，又让海蒂先上楼陪克拉拉，等马车来了再走。
        - id: ch02-b08
          speaker: narrator
          text: 海蒂早就盼着去见克拉拉，一听吩咐便飞奔上楼。克拉拉房间中央摆着一只硕大的箱子，箱盖敞开，里面有裙子、围裙、手帕和各式针线用品。克拉拉一样一样数给她听，又得意地举起一只篮子。海蒂探头一看，高兴得跳了起来。里面整整齐齐放着十二只雪白滚圆的小面包，全是给山上祖母的。两个孩子只顾欢喜，一时竟忘了离别已经来到。直到楼下有人喊马车到了，她们才发现再没有工夫慢慢难过。
        - id: ch02-b09
          speaker: clara
          text: 海蒂，快看呀，这些全是我让人替你装进去的。你喜欢吗？还有这一篮小面包，也都带给祖母。
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 海蒂赶回自己的房间，取出那本心爱的书。书一直藏在枕头下面，日日夜夜陪着她，别人当然不会想到替她收走。她把书放进盛面包的篮子，又打开衣柜，寻找另一件也许没人想到的宝贝。她果然猜对了。罗滕迈尔小姐嫌那条旧红披肩不配和新衣服放在一起，便把它留下。海蒂用披肩包起自己的旧帽子，搁在篮子最上面。鲜红的布包十分显眼，她自己则戴好漂亮的新帽子，走出去告别。
        - id: ch02-b11
          speaker: narrator
          text: 罗滕迈尔小姐守在楼梯顶端，一眼看见那个显眼的红布包，立刻把它从篮里拿出来，扔在地上。
        - id: ch02-b12
          speaker: rottenmeier
          text: 不行，阿黛莱德。你不能带着这种东西走出我们家。你究竟还要它做什么？
        - id: ch02-b13
          speaker: narrator
          text: 海蒂不敢弯腰去捡，只用恳求的眼神望着赛赛曼先生，仿佛自己最珍贵的宝物被人夺走了。
        - id: ch02-b14
          speaker: sesemann
          text: 她喜欢什么，就让她带什么回去。哪怕她想带上小猫和乌龟，也随她的便。罗滕迈尔小姐，这种事不必操心。
        - id: ch02-b15
          speaker: narrator
          text: 海蒂欢喜又感激地捡回布包。车门旁，赛赛曼先生伸手向她告别，希望她会记得自己和克拉拉，又祝她一路平安。海蒂谢过他在法兰克福给予自己的所有好意，还请他替自己向医生道别，再好好谢谢医生。她一直记得，医生昨晚把她送回床上时说过，明天一切都会好的。如今这句话果然成了真，她也很明白，其中一定有医生的一份功劳。
        - id: ch02-b16
          speaker: narrator
          text: 海蒂、篮子和路上的食物都上了车，塞巴斯蒂安最后坐进去。赛赛曼先生又祝他们一路顺风，马车便驶离了宅子。
    - id: ch03
      title: 回到群山脚下
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，海蒂坐进火车车厢，把篮子牢牢抱在膝上。给祖母的小面包就在里面，她一刻也不肯松手，还不时打开看一眼。几个钟头里，她安静得像只小老鼠。直到这时，她才慢慢相信，自己真的要回到爷爷、高山、祖母和彼得身边。熟悉的景象一幅幅浮上心头，一个可怕的念头也忽然跟着冒了出来。
        - id: ch03-b02
          speaker: heidi
          text: 塞巴斯蒂安，你真的能肯定，山上的祖母还活着吗？
          emotion: fearful
        - id: ch03-b03
          speaker: sebastian
          text: 别往坏处想。她一定还活着。
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: 海蒂听完，又沉入自己的思绪。她不时打开篮子看一眼，那些圆圆的小面包让她稍稍安心。回家以后，她最盼望的事就是把十二只面包一只只摆到祖母桌上。车厢里沉默了很久，她还是忍不住又说，要是能确实知道祖母活着，那该多好。塞巴斯蒂安已经困得睁不开眼，只半睡半醒地含糊答道，老人肯定还好端端的，没有任何理由会去世。
        - id: ch03-b05
          speaker: narrator
          text: 海蒂也终于睡熟。昨夜睡得不安稳，今天又起得很早，她一直睡到塞巴斯蒂安摇醒她，说巴塞尔快到了。第二天，他们又坐了好几个钟头的火车。海蒂依旧抱着篮子，连一句话也说不出来。列车每走一英里，她离家更近，心里的激动也更强。
        - id: ch03-b06
          speaker: narrator
          text: “迈恩费尔德”的报站声突然响起，两个人慌忙跳起来。转眼，他们已经和箱子一起站在月台上，列车喷着蒸汽远去。塞巴斯蒂安惋惜地望着它。他实在不想靠双脚爬山。在他想象中，这个地方处处半开化，山路既累人又危险。
        - id: ch03-b07
          speaker: narrator
          text: 车站外停着一辆破旧的小马车。有个肩膀宽阔的男人，正在把火车运来的沉重麻袋往车上搬。塞巴斯蒂安走过去，先问哪条路去德尔弗利最安全。男人只冷淡地回答，这里每条路都安全。塞巴斯蒂安只好换一种问法，又问走哪里才不会掉下悬崖，还问箱子怎样运到村里。男人看看箱子，用眼睛估量了一下重量。他正好要赶车回德尔弗利，只要箱子不太重，就愿意把孩子和箱子一起带去，再替海蒂找个人送她上山。
        - id: ch03-b08
          speaker: heidi
          text: 到了德尔弗利，我能自己走。我很熟悉上山的路。
        - id: ch03-b09
          speaker: narrator
          text: 海蒂说自己认得从德尔弗利上山的路，可以独自走完。塞巴斯蒂安一听不用亲自爬山，总算放下心来。他把海蒂拉到一旁，交给她一个卷得结结实实的纸包，还有一封写给爷爷的信。纸包是赛赛曼先生送的礼物，必须放到篮子最底下，压在小面包下面，还要一路仔细看好，千万不能丢。他甚至吓唬孩子，若把它弄丢，赛赛曼先生一定会非常生气，以后再也不会像从前那样待她。所以这位小小姐最好牢牢记住他的每一句话。
        - id: ch03-b10
          speaker: heidi
          text: 我一定会收好，绝不会弄丢。
        - id: ch03-b11
          speaker: narrator
          text: 海蒂马上把纸包和信放进篮子底下。箱子也被抬上马车。塞巴斯蒂安抱起海蒂和篮子，把她们安顿到高高的座位上，又同孩子握手道别。他不断朝篮子使眼色，提醒她盯紧自己的东西。车夫就站在旁边，塞巴斯蒂安觉得防备些总没有坏处，尤其是他自己本该把孩子送到旅程终点。车夫翻身坐到海蒂身旁，马车终于朝群山驶去。塞巴斯蒂安庆幸前面再没有又累又危险的山路等着自己，便舒舒服服地留在车站，等返程火车。
        - id: ch03-b12
          speaker: narrator
          text: 车夫是德尔弗利的磨坊主。他没见过海蒂，却听过她的身世，也认识她的父母。一路上，他很想弄清孩子为什么回来。
        - id: ch03-b13
          speaker: miller
          text: 你就是从前跟阿尔姆大叔住在一起的孩子吧？下面那些人待你不好，所以这么快就回来了？
        - id: ch03-b14
          speaker: heidi
          text: 不是，他们对我很好。法兰克福的一切都好得不能再好了。
        - id: ch03-b15
          speaker: miller
          text: 那你为什么要跑回来？既然人家肯留你，你在那里过得又比家里好，怎么不留下呢？
        - id: ch03-b16
          speaker: heidi
          text: 是赛赛曼先生准我回来的。要不是他答应，我不会回来。可是世上不管什么地方，都比不上和爷爷一起住在山上。山上要好一千倍。
        - id: ch03-b17
          speaker: miller
          text: 等你真回去了，也许就不这样想了。
        - id: ch03-b18
          speaker: narrator
          text: 磨坊主暗自觉得孩子古怪。她明明知道山上是什么日子，竟还要回去。他吹起口哨，不再说话。海蒂却认出了路边每一棵树。头顶那些锯齿状峰顶像老朋友一样望着她，她也朝它们点头。她欢喜得想跳下车，一口气跑到山顶，却始终坐着没有乱动。
        - id: ch03-b19
          speaker: narrator
          text: 马车在五点钟驶进德尔弗利。妇人和孩子立刻围住这辆载着箱子和陌生孩子的车，人人都想知道她从哪里来，要往哪里去，又是谁家的孩子。磨坊主把海蒂抱下车，她匆匆谢过他，说爷爷会派人来取箱子，转身就想往山上跑。可人们这个抓她一下，那个又拉住她，人人都有不同的问题。海蒂满脸焦急，奋力挤出人群。大家便认定她害怕爷爷，还说阿尔姆大叔这一年来脾气更坏，见谁都像要把人一把掐死。孩子若还有别处可去，绝不会跑回那条老恶龙的山洞。
        - id: ch03-b20
          speaker: narrator
          text: 磨坊主打断了闲话，说自己知道的比他们更多。他告诉众人，一位和气的先生亲自把孩子送到迈恩费尔德，看着她上车。那人付车钱时没有还价，还额外给了他一笔。孩子也亲口说，她在外面想要什么就有什么，是她自己愿意回爷爷身边。围观的人听了惊讶不已，这个消息很快传遍全村。当晚没有一家不在谈论这桩奇闻。海蒂竟然自愿舍弃富足的生活，回到爷爷身边。
    - id: ch04
      title: 祖母的祈祷
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 海蒂挎着沉重的篮子，沿德尔弗利上方的陡峭山路拼命往上爬。越接近山顶，路就越陡。她不得不一次次停下来喘气，可心里从头到尾只装着一个问题。祖母还会像从前那样坐在纺车旁的老地方吗？她真的还活着吗？终于，小屋出现在山坳里。海蒂的心立刻怦怦直跳。她越跑越快，心也越跳越响。等她赶到屋前，浑身抖得几乎推不开门。好不容易站进屋里，她又喘得说不出一个字。
        - id: ch04-b02
          speaker: grandmother
          text: 我的上帝，这声音多像从前海蒂跑进屋来！要是我还能再见她一次，该有多好。是谁在那里？
        - id: ch04-b03
          speaker: heidi
          text: 是我，是我呀，祖母！
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 海蒂叫着奔到老人身边，跪下来握紧她的双手，整个人依偎过去，欢喜得再也说不出话。祖母也沉默了许久，这份幸福来得实在太突然。她终于抬起手，轻轻摸到海蒂卷曲的头发。那熟悉的发卷和熟悉的声音都在告诉她，日夜盼望的孩子真的回来了。喜悦的泪水从失明的眼睛里滚下来，一滴一滴落在海蒂手上。
        - id: ch04-b05
          speaker: grandmother
          text: 对，这就是她的头发，也是她的声音。感谢上帝，他应允了我的祈求！真的是你吗，海蒂？你真的回来了？
          emotion: happy
        - id: ch04-b06
          speaker: heidi
          text: 真的是我。祖母，别哭。我回来了，再也不会离开。我每天都来看您。您好些天不用再吃硬面包了，快看呀！
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 海蒂把十二只小面包全取出来，一只只堆在祖母膝上。老人摸了又摸，仿佛怎么也摸不到尽头。
        - id: ch04-b08
          speaker: grandmother
          text: 孩子啊，你带来了多大的福气！可最大的福气还是你。再说几句话吧，让我好好听听你的声音。
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: 海蒂便说起自己怎样日日害怕。她怕祖母在自己离开时去世，怕老人永远吃不到白面包，也怕自己再也见不到她。就在这时，布丽吉塔走进屋，看见海蒂，惊得在原地站了片刻。
        - id: ch04-b10
          speaker: brigitta
          text: 哎呀，这是海蒂！可真的是她吗？祖母，您要是能看见就好了。她的裙子这么漂亮，模样也变了，简直快认不出来。那顶插羽毛的帽子也是你的吧？戴起来让我瞧瞧。
          emotion: surprised
        - id: ch04-b11
          speaker: heidi
          text: 我不想戴。你喜欢就拿去吧，我还有自己的帽子。
        - id: ch04-b12
          speaker: narrator
          text: 海蒂解开红布包，取出那顶一路颠簸以后变得更破的旧帽子，可她一点也不在意。她还清楚记得，爷爷当初冲德特喊过，再也不愿见到她和那顶插羽毛的帽子。自从离开山上，海蒂就从未停止过回家的念头，所以一直小心保存着自己的旧帽子。布丽吉塔说她犯傻，怎么也不肯收下漂亮的新帽子。她劝海蒂把帽子卖给德尔弗利校长的女儿，一定能换回一大笔钱。海蒂没有改变主意，只悄悄把它藏到祖母椅子后面的角落里。
        - id: ch04-b13
          speaker: narrator
          text: 接着，海蒂脱下漂亮裙子，只穿着露出两条胳膊的衬裙，外面裹上红披肩。她握住祖母的手，说自己该回爷爷那里了，不过明天一定再来。老人紧紧把孩子的手握在掌中，怎么也舍不得放她离开，只一遍遍叮嘱她明天千万还要回来。
        - id: ch04-b14
          speaker: grandmother
          text: 明天一定要来，千万别忘了。
        - id: ch04-b15
          speaker: brigitta
          text: 你为什么把漂亮裙子脱了？
        - id: ch04-b16
          speaker: heidi
          text: 我想这样回爷爷那里。要不然，他也许认不出我。你刚才不是也差点没认出来吗？
        - id: ch04-b17
          speaker: narrator
          text: 海蒂解释说，自己这样回去，爷爷才不会认不出她，因为连布丽吉塔刚才也差点没认出来。布丽吉塔送她走到门口，压低声音，神秘地提醒她，爷爷当然认得她，漂亮裙子根本不会碍事。不过彼得说，阿尔姆大叔如今总在生气，碰到谁也不肯说话，所以她还是得小心些。海蒂向她道过晚安，挎起篮子，独自继续上山。
    - id: ch05
      title: 山上的夏日黄昏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 四周陡峭的绿坡都沐浴在夕阳里，闪闪发亮。走了一会儿，高处那片耀眼的大雪原也渐渐露了出来。海蒂每走一段就忍不住停下回头，因为更高的山峰都在她身后。忽然，一片温暖的红光铺上脚边的草地。她再次转身，不禁看呆了。梦里从未重现过这样的辉煌，她也已经忘记眼前的景色有多么壮丽。世上似乎再没有任何东西能同它相比。
        - id: ch05-b02
          speaker: narrator
          text: 两座高峰像两团巨大的火焰，直冲天空。整片雪原染成深红，玫瑰色的云朵浮在上方。山坡上的草地化作黄金，岩石也燃起灿烂的光，下面整座山谷都浸在金色薄雾里。海蒂站在这一片光辉中，转着身子看了又看。失而复得的喜悦涨满心头，化作泪水，不断从她的脸颊上滚落。
        - id: ch05-b03
          speaker: narrator
          text: 她情不自禁地合起双手，仰望天空，大声感谢上帝把自己带回家。这里的一切还像从前一样美，甚至比她记忆中更加美丽，而这一切如今又重新属于她了。欢喜和感激装得太满，她怎么也找不到足够的话来表达谢意。于是她站在那里，一次又一次道谢。直到辉煌的霞光开始消退，她才终于舍得转身，飞快地继续往上跑。
        - id: ch05-b04
          speaker: narrator
          text: 很快，屋顶上方的枞树梢出现了，接着是屋顶和整间小屋。爷爷像从前一样坐在那里抽烟斗，枞树在他身后随风摇摆。海蒂越跑越快。老人还没看清是谁，她已经扔下篮子，扑过去搂住他的脖子。
        - id: ch05-b05
          speaker: heidi
          text: 爷爷，我回来了！真的是我回来了！
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 老人自己也一句话都说不出来。多少年来，这是他第一次眼中含泪，只得抬起手，从眼睛上擦过去。随后，他轻轻解开海蒂搂在自己颈上的胳膊，把孩子稳稳抱到膝上。老人没有急着问话，只默默端详了她好一会儿，仿佛要确认眼前这个孩子真的已经回到身边。
        - id: ch05-b07
          speaker: grandpa
          text: 这么说，你回到我这里来了。怎么回事？你看着可不大像一位贵小姐。是他们把你赶回来的吗？
        - id: ch05-b08
          speaker: heidi
          text: 不是的，爷爷，您千万别这么想。他们没有赶我，大家都对我很好，克拉拉、祖母和赛赛曼先生都很好。可是离开您以后，我一直不知道该怎么熬下去。我常觉得自己快要死了，胸口闷得连气也喘不上来。可我什么都没告诉他们，因为他们那样照顾我，我若还说不快活，就太忘恩负义了。后来有一天清早，赛赛曼先生忽然告诉我可以回来。我想医生也帮了我不少忙。也许所有事情都写在信里了。
        - id: ch05-b09
          speaker: narrator
          text: 海蒂说着便从爷爷膝上跳下来，跑到篮子旁，取出塞巴斯蒂安交给她的纸包和信，一起递给爷爷。老人只说纸包属于她，顺手把它放到身旁的长凳上。随后，他拆开赛赛曼先生的信，从头到尾仔细读完。老人脸上没有流露出什么，也一句话没说，只把那封信折好，收进自己的衣袋。
        - id: ch05-b10
          speaker: grandpa
          text: 你还愿意跟我一起喝牛奶吗？把钱也拿上。这些钱够你买一张床、被褥，还有两三年穿的衣服。
        - id: ch05-b11
          speaker: heidi
          text: 我不要钱。我已经有床了，克拉拉又给我装了好多衣服，我以后再也不会缺衣服。
        - id: ch05-b12
          speaker: grandpa
          text: 收起来，放进柜子。总有一天你会用得上。
        - id: ch05-b13
          speaker: narrator
          text: 海蒂听话地拿起纸包，快活地蹦跳着跟爷爷进了屋。她一个角落接一个角落地跑过去，看见熟悉的东西全还在原处，心里别提有多高兴。随后，她又爬上通往干草阁的梯子，却突然停住，惊慌地朝下面喊，自己的床不见了。爷爷告诉她，他不知道孩子会回来，不过床很快就能重新铺好，让她现在先下来喝牛奶。
        - id: ch05-b14
          speaker: narrator
          text: 海蒂从梯子上下来，坐回从前那张高凳。她端起熟悉的奶碗，大口大口地喝起来，仿佛这一生从来没有尝过这么美味的东西。法兰克福精致的食物，此刻全比不上这碗刚挤下来的山羊奶。直到一口气喝完，她才依依不舍地放下碗。
        - id: ch05-b15
          speaker: heidi
          text: 爷爷，我们家的牛奶比世上所有东西都好喝！
          emotion: happy
        - id: ch05-b16
          speaker: narrator
          text: 屋外突然响起一声尖亮的口哨。海蒂一听见这个熟悉的声音，立刻像闪电一样冲出门。羊群正在岩石间跳跃，彼得走在它们中间。他一看见海蒂，便惊得停在原地，只顾瞪大眼睛望着她，半句话也说不出。海蒂先高声向他问好，接着一头跑进羊群，呼唤小天鹅和小熊，问这两个老朋友还认不认得自己。
        - id: ch05-b17
          speaker: narrator
          text: 山羊马上认出她的声音，纷纷用头蹭她，放声咩咩叫着，仿佛也在为她回来而欢喜。她把其余山羊的名字一个接一个叫出来，它们全争先恐后地奔来，挤成一团。性急的小绿雀索性腾空跃起，从两个同伴身上跳过去，只想离海蒂更近。就连平日胆小的小白雪花也忽然鼓足勇气，坚定地把大土耳其佬顶到一旁。那个大家伙被它的大胆惊得愣住，高高翘起胡子，仿佛在说，你难道没看见我是谁吗？
        - id: ch05-b18
          speaker: narrator
          text: 重新站在所有老朋友中间，海蒂欢喜得快要发狂。她伸手搂住秀气的小白雪花，又去抚摸性子急躁的小绿雀。那些亲热又毫无戒心的山羊从四面八方往她身上蹭，把她围得密不透风。海蒂在羊群里一点点往前挤，好不容易才来到彼得身边。男孩还站在原处，显然没有从这场意外重逢带来的惊讶里回过神。
        - id: ch05-b19
          speaker: heidi
          text: 彼得，快下来呀。跟我说声晚上好。
        - id: ch05-b20
          speaker: peter
          text: 原来你真的回来了？那你明天还跟我一起上山吗？
          emotion: surprised
        - id: ch05-b21
          speaker: heidi
          text: 明天不行，后天也许可以。明天我得下山看祖母。
        - id: ch05-b22
          speaker: peter
          text: 你回来，我真高兴。
          emotion: happy
        - id: ch05-b23
          speaker: narrator
          text: 彼得说海蒂回来真叫他高兴，整张脸都亮了起来。可等他要继续赶路时，山羊却比从前任何一天都难管。他又哄又吓，费尽力气才把它们重新聚拢。海蒂正一边搂着一只爷爷的山羊，带着小天鹅和小熊往羊圈走，整群山羊却忽然掉头，全追着她跑。海蒂只好把两只羊带进圈里，赶快关上圈门。否则彼得今天夜里恐怕永远也回不了家。
        - id: ch05-b24
          speaker: narrator
          text: 海蒂回到屋里，发现爷爷已经替她重新铺好床。刚收进来的干草堆得高高的，散发着新鲜又好闻的清香。爷爷在上面铺开干净的床单，仔细抚平，再把四边都稳稳掖进干草里。那一夜，海蒂怀着一颗无比幸福的心躺进自己的旧床。这是她离开山上以后，整整一年里睡得最沉、最安稳、也最香甜的一觉。
        - id: ch05-b25
          speaker: narrator
          text: 爷爷夜里至少起来十次，每一次都爬上梯子，看看孩子是否安好，有没有半点不安稳的迹象。他还伸手摸摸塞在圆窗里的干草，确认月光不会太亮，照到海蒂身上。可孩子一次也没有翻动。她再也不需要在睡梦中四处游走，因为心里那份烧灼般的巨大思念终于得到了满足。她已经亲眼看见高山和岩石在晚霞中燃烧，亲耳听见风穿过枞树。如今，她又回到了山上的家。
