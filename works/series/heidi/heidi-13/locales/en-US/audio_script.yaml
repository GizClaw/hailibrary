  chapters:
    - id: ch01
      title: Before Sunrise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Herr Sesemann hurried upstairs, still irritated and stirred up by the night's discovery. He strode along the passage to Fraulein Rottenmeier's room and knocked far more loudly than anyone usually dared. She woke from a sound sleep with a frightened cry and heard the master of the house calling through her door.
        - id: ch01-b02
          speaker: sesemann
          text: Please hurry down to the dining room. We have to prepare for a journey right away.
        - id: ch01-b03
          speaker: narrator
          text: Fraulein Rottenmeier looked at the clock. It was only four thirty, and never in her life had she risen so early. What could possibly have happened? Curiosity pulled her one way and alarm pulled her another. She rushed about taking up the wrong things, putting them down again, and searching everywhere for clothes she had already managed to put on.
        - id: ch01-b04
          speaker: narrator
          text: Herr Sesemann moved on and rang every servants' bell in turn. Frightened figures sprang out of bed. Each of them was certain the ghost had attacked their master and that he was calling for help. They made their way into the dining room one after another, every face more terrified than the one before. To their astonishment, Herr Sesemann was pacing the floor, looking well and cheerful, with no sign that he had met a ghost at all.
        - id: ch01-b05
          speaker: narrator
          text: There was no time to waste. He sent John to ready the horses and carriage. Tinette was to wake Heidi and dress her for a journey, while Sebastian hurried to the house where Dete worked and brought her back. Fraulein Rottenmeier finally appeared downstairs. Everything about her was carefully arranged except her cap, which sat backward on her head. Herr Sesemann blamed that small disaster on the shocking hour at which he had awakened her.
        - id: ch01-b06
          speaker: sesemann
          text: Get a trunk and pack everything that belongs to the Swiss child. Add a good selection of Clara's clothes so she has proper things to wear at home. It all has to be done now. We have no time to think it over.
        - id: ch01-b07
          speaker: narrator
          text: Fraulein Rottenmeier stood as if her feet had taken root and stared at him. She had fully expected a long, private account of some dreadful ghostly encounter during the night. Such a tale would have been delightful to hear now that broad daylight had come. Instead, she had been given ordinary, troublesome packing orders. Surprise and disappointment left her standing there, waiting for some further explanation.
        - id: ch01-b08
          speaker: narrator
          text: Herr Sesemann had no thought of explaining. He left her where she stood and went to Clara. Just as he expected, the commotion had awakened her. She lay listening and wondering what had happened. Her father sat beside her and told her everything from the night before. The doctor believed Heidi's nerves were badly strained. Her sleepwalking might carry her farther each night, perhaps even onto the roof, where she could be in terrible danger. Herr Sesemann could not accept the responsibility of keeping her there. Clara had to see that sending Heidi home at once was the only safe choice.
        - id: ch01-b09
          speaker: narrator
          text: Clara was deeply upset. At first she offered one plan after another that might let Heidi stay. Her father remained firm. If Clara accepted the decision reasonably and made no further fuss, he promised to take her to Switzerland the next summer. There was no escaping the separation, so Clara finally gave in. She asked for only one thing. The trunk must be brought into her room and packed there, where she could add anything she wished. Her father was more than pleased to let her provide Heidi with a fine outfit.
        - id: ch01-b10
          speaker: narrator
          text: Dete arrived while all this was happening and waited in the hall, wondering what extraordinary event could have caused anyone to send for her at such an hour. Herr Sesemann explained Heidi's condition and said Dete must take her home that very day. The news was not at all what Dete had expected. She remembered Grandfather's last words to her. He never wanted to set eyes on her again. She had first left the child with him, then taken her away, and now she was supposed to bring her back. Dete decided that would be neither safe nor wise.
        - id: ch01-b11
          speaker: dete
          text: I couldn't possibly leave today or tomorrow. There is far too much for me to do. Really, I doubt I can get away on any of the next several days.
        - id: ch01-b12
          speaker: narrator
          text: Her excuses poured out so freely that Herr Sesemann soon understood the truth. She did not intend to go at all. He dismissed her and called for Sebastian instead. Sebastian must prepare to leave. He would travel with Heidi as far as Basle that day and complete the journey home the next. Herr Sesemann would give him a letter for Grandfather that explained everything. Once Heidi was safely delivered, Sebastian could return by the first train.
        - id: ch01-b13
          speaker: sesemann
          text: There is one thing you must handle carefully. I know the people at this hotel in Basle. The name is on this card, and they'll give both of you rooms. Go into Heidi's room and make certain the windows are fastened so she can't easily open them. Once she's in bed, lock her door from the outside. She walks in her sleep, and in a strange place she might wander downstairs or try the front door. Do you understand?
        - id: ch01-b14
          speaker: sebastian
          text: Oh! So that was our ghost?
          emotion: surprised
        - id: ch01-b15
          speaker: sesemann
          text: Yes, that was it. You're a coward, Sebastian. Tell John he's one too, and the whole household has behaved like a pack of fools.
        - id: ch01-b16
          speaker: narrator
          text: Herr Sesemann went to write his letter. Sebastian stayed behind, feeling foolish.
        - id: ch01-b17
          speaker: sebastian
          text: If only I hadn't let that fool John pull me back! I would have followed the little white figure. I certainly would now.
        - id: ch01-b18
          speaker: narrator
          text: He kept saying this to himself, but it was easy to be brave now that daylight made every corner plainly visible. Meanwhile, Heidi stood waiting in her Sunday dress, wondering what would happen. Tinette had awakened her with a shake, put on her clothes, and never offered one word of explanation. In Tinette's eyes, the uneducated little girl was much too far beneath her to deserve conversation.
    - id: ch02
      title: Homeward Bound
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Breakfast was ready when Herr Sesemann returned with the letter.
        - id: ch02-b02
          speaker: sesemann
          text: Where is the child?
        - id: ch02-b03
          speaker: narrator
          text: Heidi came in and wished him good morning. He studied her face.
        - id: ch02-b04
          speaker: sesemann
          text: Well, little one? What do you think of the news?
        - id: ch02-b05
          speaker: narrator
          text: Heidi looked puzzled, and Herr Sesemann laughed.
        - id: ch02-b06
          speaker: sesemann
          text: No one has told you! You're going home today. You're leaving right away.
        - id: ch02-b07
          speaker: heidi
          text: Home?
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: Heidi turned pale. For a moment, the news took her breath away.
        - id: ch02-b09
          speaker: sesemann
          text: Don't you want to hear the rest?
        - id: ch02-b10
          speaker: heidi
          text: Oh, yes! Yes!
          emotion: happy
        - id: ch02-b11
          speaker: narrator
          text: Color rushed back into her face.
        - id: ch02-b12
          speaker: sesemann
          text: Then sit down and eat a good breakfast. After that, you'll be off in the carriage.
        - id: ch02-b13
          speaker: narrator
          text: Heidi tried to obey, but she could not swallow a single bite. The excitement was too great. She hardly knew whether she was awake or dreaming. Perhaps she would open her eyes again and find herself in her nightgown at the front door, with this wonderful promise of home gone like a dream.
        - id: ch02-b14
          speaker: sesemann
          text: Make sure Sebastian takes plenty of food. The child can't eat now, and that's natural. Heidi, go stay with Clara until the carriage comes.
        - id: ch02-b15
          speaker: narrator
          text: Heidi had been longing to do just that. She ran upstairs and found a huge trunk open in the middle of Clara's room.
        - id: ch02-b16
          speaker: clara
          text: Come here, Heidi! Look at everything I've put in for you. Aren't you pleased?
        - id: ch02-b17
          speaker: narrator
          text: Clara eagerly showed her everything she had chosen. There were dresses and aprons, handkerchiefs, and all kinds of things for sewing and other work. Then she reached for a basket and held it up in triumph.
        - id: ch02-b18
          speaker: clara
          text: And look at this!
        - id: ch02-b19
          speaker: narrator
          text: Heidi peeked inside and jumped for joy. There were twelve beautiful, round white rolls, every one of them meant for Grandmother. For a little while, the children were so delighted with the gifts that they forgot the moment of separation had arrived. Then someone called that the carriage was ready. The call came so suddenly that there was no time left to grieve together.
        - id: ch02-b20
          speaker: narrator
          text: Heidi ran to her own room for the precious book she kept beneath her pillow day and night. No one could have packed it there, so she carried it back and placed it beside the rolls. Then she opened her wardrobe and looked for another treasure that no one else would think important. She was right. Fraulein Rottenmeier had judged the old red shawl too worthless to pack. Heidi wrapped it around something else she wanted, then laid the bright and very noticeable red bundle on top of the basket.
        - id: ch02-b21
          speaker: narrator
          text: Heidi put on her pretty hat and left the room. There was little chance for a real farewell between the girls, because Herr Sesemann was already waiting to put her into the carriage. Fraulein Rottenmeier stood at the top of the stairs to say goodbye. The moment she spotted the odd red bundle, she pulled it from the basket and threw it onto the floor.
        - id: ch02-b22
          speaker: rottenmeier
          text: No, Adelaide. You cannot leave this house carrying that thing. What could you possibly want it for?
        - id: ch02-b23
          speaker: narrator
          text: With that, Fraulein Rottenmeier said goodbye to the child. Heidi did not dare bend down and pick up her bundle. She only turned an imploring look toward Herr Sesemann. Her face made it seem as though someone had taken the greatest treasure she owned.
        - id: ch02-b24
          speaker: sesemann
          text: The child may take home anything she likes, even kittens and tortoises. There is no reason for us to object, Fraulein Rottenmeier.
        - id: ch02-b25
          speaker: narrator
          text: Heidi quickly gathered up the bundle. Joy and gratitude shone on her face. At the carriage door, Herr Sesemann held out his hand and said he hoped she would remember both him and Clara. Then he wished her a happy journey. Heidi thanked him for every kindness she had received in his house.
        - id: ch02-b26
          speaker: heidi
          text: Please tell the doctor goodbye for me, and thank him very, very much.
        - id: ch02-b27
          speaker: narrator
          text: She had not forgotten the doctor's promise from the night before that everything would be all right tomorrow. Now she understood that he must have helped to make it so. Herr Sesemann lifted Heidi into the carriage. The basket and the food for the journey went in after her, and at last Sebastian climbed into his place.
        - id: ch02-b28
          speaker: sesemann
          text: Have a pleasant journey!
        - id: ch02-b29
          speaker: narrator
          text: The carriage rolled away, and before long Heidi was sitting in a railway car with her basket clasped tightly on her lap. She would not let it leave her hands for even a moment. The wonderful rolls for Grandmother were inside, and they had to be guarded carefully. From time to time she lifted the cover and looked at them simply for the pleasure of seeing them there.
        - id: ch02-b30
          speaker: narrator
          text: For many hours she sat as quiet as a mouse. Only now did she begin to understand that she truly was going home. She would see Grandfather, the mountain, Grandmother, and Peter again. One by one, pictures of everything she loved rose before her eyes. She tried to imagine how each familiar place would look. Then those thoughts brought one terrible question into her mind.
        - id: ch02-b31
          speaker: heidi
          text: Sebastian, are you sure Grandmother on the mountain hasn't died?
          emotion: fearful
        - id: ch02-b32
          speaker: sebastian
          text: No, no. Let's hope not. I'm sure she's still alive.
          emotion: calm
        - id: ch02-b33
          speaker: narrator
          text: Heidi fell back into her thoughts. Now and then, she looked inside the basket. More than anything, she longed to lay all twelve rolls across Grandmother's table and see that there would be no hard bread for a while. After a long silence, the worry became too strong to hold inside.
        - id: ch02-b34
          speaker: heidi
          text: If only we could know for sure that she's alive.
          emotion: fearful
        - id: ch02-b35
          speaker: sebastian
          text: Yes, yes, she's sure to be alive. There's no reason she wouldn't be.
        - id: ch02-b36
          speaker: narrator
          text: Sebastian answered with his eyes half closed, already slipping toward sleep. After a while, Heidi fell asleep too. The night before had been disturbed, and she had risen before dawn. Now she slept so soundly through the rhythm of the train that she did not wake until Sebastian took her by the arm and shook her.
        - id: ch02-b37
          speaker: sebastian
          text: Wake up, Heidi! We'll be getting off any moment. We're almost in Basle!
    - id: ch03
      title: Through Dorfli
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day brought another railway journey lasting many hours. Once again, Heidi kept the basket on her knees. Nothing Sebastian could have said would have persuaded her to give it up. That day she never even opened her mouth. With every mile, they drew closer to home, and her rising excitement left her completely speechless.
        - id: ch03-b02
          speaker: narrator
          text: Before Heidi expected it, a voice suddenly called, “Mayenfeld!” She and Sebastian jumped to their feet, both taken by surprise. A minute later, they were standing on the platform with the trunk beside them. The train pulled away and went steaming down the valley.
        - id: ch03-b03
          speaker: narrator
          text: Sebastian watched it go with regret. Riding in a railway car suited him much better than a long, tiring climb on foot. He was certain there must be danger as well as hard walking in a country where, as he imagined it, everything and everyone was half wild. He looked carefully in both directions for someone who seemed safe enough to ask about the road to Dorfli.
        - id: ch03-b04
          speaker: narrator
          text: Just outside the station stood a shabby little cart and horse. A broad-shouldered man was loading it with heavy sacks that had arrived on the train. Sebastian approached him and asked which road offered the safest way to Dorfli.
        - id: ch03-b05
          speaker: miller
          text: Every road around here is safe.
        - id: ch03-b06
          speaker: narrator
          text: That answer did not settle Sebastian's worries, so he changed the question. Which was the best road if a traveler wanted to avoid falling over a cliff? And how could the trunk be carried to Dorfli? The man studied the box and seemed to weigh it with his eyes. He offered to take it on his own cart if it was not too heavy, since he was driving to Dorfli. After a little more discussion, they agreed that he would carry both Heidi and the trunk to the village. Once there, he would find someone who could take her on up the mountain.
        - id: ch03-b07
          speaker: heidi
          text: I can go alone from Dorfli. I know the way.
        - id: ch03-b08
          speaker: narrator
          text: Sebastian was greatly relieved to learn that he would not have to climb the mountain. He drew Heidi aside and gave her a thick rolled parcel along with a letter for Grandfather. The parcel, he explained, was a gift from Herr Sesemann. She must place it at the very bottom of her basket, underneath the rolls, and be careful not to lose it. Herr Sesemann would be terribly upset if she did, and he would never feel the same toward her again. Sebastian told the little miss to remember every word.
        - id: ch03-b09
          speaker: heidi
          text: I won't lose it. I promise.
        - id: ch03-b10
          speaker: narrator
          text: Heidi immediately placed the parcel and letter at the bottom of her basket. By then, the trunk had been hoisted into the cart. Sebastian lifted Heidi and her basket onto the high seat and shook her hand goodbye. Then he made several signs reminding her to keep her eyes on the basket. The driver stood close enough to hear, and Sebastian thought caution was best. Deep down, he knew that he should have seen the child safely to the very end of her journey.
        - id: ch03-b11
          speaker: narrator
          text: The driver swung himself onto the seat beside Heidi, and the cart rolled away toward the mountains. Sebastian watched them go. Glad that no tiring and dangerous walk lay ahead of him, he settled down at the station to wait for the train that would carry him back.
        - id: ch03-b12
          speaker: narrator
          text: The driver was the miller from Dorfli, and the sacks in the cart were flour he was taking home. He had never seen Heidi before, but he knew all about her, just as everyone in the village did. He had known her father and mother. After looking at the child beside him, he felt certain she must be the one he had heard so much about. He began to wonder why she had returned so soon and started asking questions as they traveled.
        - id: ch03-b13
          speaker: miller
          text: You're the child who used to live with Alm-Uncle, aren't you?
        - id: ch03-b14
          speaker: heidi
          text: Yes.
        - id: ch03-b15
          speaker: miller
          text: Did they treat you badly down there? Is that why you've come back so soon?
        - id: ch03-b16
          speaker: heidi
          text: No. Everything in Frankfurt was as nice as it could be.
        - id: ch03-b17
          speaker: miller
          text: Then why are you hurrying home again?
        - id: ch03-b18
          speaker: heidi
          text: Herr Sesemann gave me permission. Otherwise, I wouldn't have left.
        - id: ch03-b19
          speaker: miller
          text: If they would have kept you, why didn't you stay where life was better?
        - id: ch03-b20
          speaker: heidi
          text: Because I'd rather be with Grandfather on the mountain a thousand times over than anywhere else in the world.
        - id: ch03-b21
          speaker: miller
          text: You may change your mind when you get there. Strange. She knows what that place is like.
        - id: ch03-b22
          speaker: narrator
          text: The miller grumbled that answer, then began to whistle and asked no more questions. Heidi looked eagerly around her. She knew every tree beside the road. High overhead, the jagged mountain peaks looked down on her like old friends, and Heidi nodded back to them. Her joy and longing grew wilder with every moment. She felt as if she must leap from the cart and run with all her strength until she reached the top. Yet for all the commotion inside her, she remained perfectly still on the seat.
        - id: ch03-b23
          speaker: narrator
          text: The clock was striking five when the cart entered Dorfli. Women and children immediately crowded around it. The sight of the miller arriving with a child and a large trunk awakened every bit of curiosity in the neighborhood. Everyone wanted to know where they had come from, where they were going, and to whom they belonged.
        - id: ch03-b24
          speaker: heidi
          text: Thank you. Grandfather will send someone for the trunk.
        - id: ch03-b25
          speaker: narrator
          text: The miller lifted Heidi down, and she turned at once to run up the path. Before she could escape, one bystander caught her, then another. Each had a different question and wanted an answer before letting her pass. Heidi pushed her way through them with such distress written across her face that at last they were forced to release her.
        - id: ch03-b26
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: Look how frightened she is. No wonder!
        - id: ch03-b27
          speaker: narrator
          text: Once Heidi was out of reach, they began talking among themselves. Alm-Uncle, they said, had grown much worse during the past year. He never spoke a word, and whenever he met anyone, he looked ready to kill them. If the child had any other place in the world to go, they were certain she would never willingly run back to the old dragon's den.
        - id: ch03-b28
          speaker: narrator
          text: The miller interrupted them and declared that he knew more about the matter than they did. A kind gentleman had brought the girl all the way to Mayenfeld and seen her safely onto the cart. He had paid her fare without one word of bargaining and had even added extra money for the driver. More important, the child had plainly told him that she had been given everything she needed in Frankfurt. Returning to her grandfather was her own wish.
        - id: ch03-b29
          speaker: narrator
          text: This information amazed the whole group. It was repeated from one person to another and traveled through Dorfli with remarkable speed. By that evening, there was not a house in the village where people were not discussing the astonishing news. Heidi had given up a rich and comfortable home of her own free will, all so she could return to her grandfather.
    - id: ch04
      title: Grandmother's House
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Heidi climbed the steep path from Dorfli as quickly as she could. The basket was heavy, and now and then she had to stop and catch her breath. The farther she climbed, the steeper the trail became. Yet she hardly noticed anything except the one thought that filled her mind. Would she find Grandmother sitting in her usual corner beside the spinning wheel? Most important of all, was Grandmother still alive?
        - id: ch04-b02
          speaker: narrator
          text: At last, Heidi saw Grandmother's little house in the hollow of the mountain, and her heart began to pound. She ran faster, and with every step her heart seemed to beat louder. Now she had reached the house. Her hands trembled so badly that she could hardly open the door. A moment later, she stood inside, but the run had left her too breathless to make a sound.
        - id: ch04-b03
          speaker: grandmother
          text: Oh, dear God! That's how Heidi used to run in. If only I could have her here once more! Who is it?
        - id: ch04-b04
          speaker: heidi
          text: It's me! It's Heidi, Grandmother!
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: Heidi ran to the old woman, dropped to her knees beside her, and seized both her hands. She held on tightly, unable to say another word for joy. The happiness was so sudden and unexpected that Grandmother could not speak either. For a while, they stayed that way in silence. Then the old woman slowly reached out and stroked Heidi's curly hair.
        - id: ch04-b06
          speaker: grandmother
          text: Yes. That's her hair, and that's her voice. Thank God for answering my prayer! Is it truly you, Heidi? Have you really come back to me?
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: Tears of joy fell from her blind eyes onto Heidi's hand.
        - id: ch04-b08
          speaker: heidi
          text: Yes, Grandmother, I'm really here. Please don't cry. I've come back, and I'm never going away again. I'll visit you every day. And you won't have hard bread for a while. Look! Just look!
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: Heidi took out the rolls and piled all twelve on Grandmother's lap.
        - id: ch04-b10
          speaker: grandmother
          text: Oh, child, what a blessing you've brought! But you are the greatest blessing, Heidi. Say something else, child. Let me hear your voice.
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: Grandmother touched Heidi's hair again and passed her hand over the child's warm cheeks, as if she needed to feel that Heidi was truly there. Then Heidi told her about the fear she had carried in Frankfurt. She had been terribly unhappy whenever she imagined that Grandmother might die while Heidi was away. Grandmother would never receive the soft white rolls, and Heidi would return too late to see her ever again.
        - id: ch04-b12
          speaker: narrator
          text: Peter's mother came in and stopped, overcome with surprise.
        - id: ch04-b13
          speaker: brigitta
          text: Why, it's Heidi! But can it really be?
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: Heidi stood, and Brigitta walked all around her, admiring the way she looked.
        - id: ch04-b15
          speaker: brigitta
          text: Grandmother, if only you could see her! Her dress is so pretty that you would hardly know her. Is that feathered hat yours too? Put it on and let me see you in it.
        - id: ch04-b16
          speaker: heidi
          text: No, I'd rather not. You can have it if you want. I don't need it. I still have my own hat.
        - id: ch04-b17
          speaker: narrator
          text: Heidi opened the red bundle and took out her own old hat. The journey had battered it even more, but that did not trouble her at all. She had never forgotten Grandfather calling after Dete that he did not want to see her or the feathered hat again. From the day Heidi left the mountain, she had kept thinking about coming home to him. That was why she had guarded her old hat so anxiously through all her time in Frankfurt.
        - id: ch04-b18
          speaker: brigitta
          text: Don't be foolish, Heidi. I won't take such a fine hat. If you don't want to wear it, sell it to the schoolmaster's daughter in Dorfli. You could get a lot of money for it.
        - id: ch04-b19
          speaker: narrator
          text: Heidi did not change her mind, though Brigitta tried to persuade her. Without making any more argument, she quietly hid the pretty hat in a corner behind Grandmother's chair. Then she took off the fine dress she had worn for the journey. Over her underskirt, she wrapped the old red shawl, which left her arms bare. Dressed more like her old self, she clasped Grandmother's hand.
        - id: ch04-b20
          speaker: heidi
          text: I have to go home to Grandfather now, but I'll come back tomorrow. Good night, Grandmother.
        - id: ch04-b21
          speaker: grandmother
          text: Yes, come back. Promise you'll come tomorrow.
        - id: ch04-b22
          speaker: narrator
          text: Grandmother pressed Heidi's hands and did not want to let them go.
        - id: ch04-b23
          speaker: brigitta
          text: Why did you take off that lovely dress?
        - id: ch04-b24
          speaker: heidi
          text: I'd rather go to Grandfather like this. Maybe he wouldn't know me in the dress. You hardly knew me at first.
        - id: ch04-b25
          speaker: narrator
          text: Brigitta walked her to the door and lowered her voice.
        - id: ch04-b26
          speaker: brigitta
          text: You could have kept it on. He would have known you. Still, be careful. Peter says Alm-Uncle is always in a bad temper now and never speaks.
        - id: ch04-b27
          speaker: narrator
          text: Heidi wished her good night and continued up the mountain with the basket on her arm.
    - id: ch05
      title: Home on the Mountain
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: All around Heidi, the steep green slopes shone brightly in the evening sun. Before long, the great gleaming snowfield came into view high above her. The tallest peaks were behind her as she climbed, so she had to keep stopping and turning around to see them. Then, without warning, a warm red light spread across the grass at her feet.
        - id: ch05-b02
          speaker: narrator
          text: Heidi turned again. She had forgotten how splendid the mountains could be, and none of her dreams in Frankfurt had shown her anything like this. Two high peaks rose into the sky like enormous flames. The whole snowfield glowed crimson, with rosy clouds floating above it. Grass on the mountainsides had turned to gold. Every rock was shining, and the valley below lay deep in a golden mist.
        - id: ch05-b03
          speaker: narrator
          text: Heidi stood surrounded by all that splendor, and tears of pure happiness ran down her cheeks. Without thinking, she folded her hands and lifted her eyes toward heaven. Out loud, she thanked God for bringing her home. She thanked Him because everything was as beautiful as before, even more beautiful than she had remembered, and because all of it was hers to love again. Her heart overflowed with so much joy and gratitude that words could not hold it all.
        - id: ch05-b04
          speaker: narrator
          text: She stayed until the glory began to fade. Then she ran on. Soon the fir tops appeared above the hut roof, then the roof itself, and finally the whole hut. Grandfather sat outside smoking his pipe just as he had before, with the fir trees moving in the wind.
        - id: ch05-b05
          speaker: narrator
          text: Heidi's small feet moved faster and faster. Alm-Uncle looked up, but before he had time to make out who was racing toward him, Heidi had reached the bench. She dropped her basket, flung both arms around his neck, and held him tight. The excitement of seeing him again was so great that she could manage only one word, over and over.
        - id: ch05-b06
          speaker: heidi
          text: Grandfather! Grandfather! Grandfather!
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: The old man could not speak at all. For the first time in many years, tears filled his eyes, and he had to pass a hand across them. At last, he gently loosened Heidi's arms from around his neck. He lifted her onto his knee and looked closely at the child who had come back to him.
        - id: ch05-b08
          speaker: grandfather
          text: So you've come back to me, Heidi. How did that happen? You don't look much like a grand young lady. Did they send you away?
        - id: ch05-b09
          speaker: heidi
          text: Oh, no, Grandfather! Please don't think that. Everyone was so kind to me. Clara was, and Grandmamma, and Herr Sesemann. But I couldn't bear being away from you anymore. I thought I might die because it felt as if I couldn't breathe. I never told them, because that would have been ungrateful. Then, early one morning, Herr Sesemann suddenly said I could go. I think the doctor helped, but maybe the letter explains it.
        - id: ch05-b10
          speaker: narrator
          text: Heidi jumped down, fetched the rolled parcel and letter, and handed both to Grandfather. He placed the parcel on the bench, read the letter, and slipped it into his pocket without a word.
        - id: ch05-b11
          speaker: grandfather
          text: Do you think you can still drink milk with me? Bring your money inside. It will buy a bed, bedding, and enough dresses for a couple of years.
        - id: ch05-b12
          speaker: heidi
          text: I don't need it. I already have a bed, and Clara packed so many clothes that I'll never need any more.
        - id: ch05-b13
          speaker: grandfather
          text: Put it in the cupboard. You'll need it someday.
        - id: ch05-b14
          speaker: narrator
          text: Heidi obeyed, placed the money safely in the cupboard, and skipped happily after Grandfather into the hut. She ran from one corner to another, delighted by every familiar thing she saw. Then she hurried up the ladder toward her sleeping place. At the top, she stopped short. Something important was missing, and she called down in surprise and distress.
        - id: ch05-b15
          speaker: heidi
          text: Oh, Grandfather! My bed is gone!
          emotion: surprised
        - id: ch05-b16
          speaker: grandfather
          text: We can make it again in no time. I didn't know you were coming back. Come down now and have your milk.
        - id: ch05-b17
          speaker: narrator
          text: Heidi sat on her old high stool and drank eagerly from her bowl. It tasted better than anything she could remember.
        - id: ch05-b18
          speaker: heidi
          text: Grandfather, our milk tastes better than anything else in the whole world!
          emotion: happy
        - id: ch05-b19
          speaker: narrator
          text: A sharp whistle sounded outside. Heidi shot through the door. The goats came leaping over the rocks with Peter among them. He saw Heidi, stopped where he was, and stared without a word.
        - id: ch05-b20
          speaker: heidi
          text: Good evening, Peter! Little Swan! Little Bear! Do you remember me?
          emotion: happy
        - id: ch05-b21
          speaker: narrator
          text: The goats knew her voice. They crowded close, rubbing their heads against her and bleating with joy as she called them each by name. Impatient Greenfinch leaped over two others to reach her. Even shy little Snowflake firmly butted the Great Turk aside. He stood there lifting his beard, as if to remind everyone who he was.
        - id: ch05-b22
          speaker: narrator
          text: Heidi hugged Snowflake and stroked unruly Greenfinch while the trusting goats pressed in from every side. At last, she came near Peter, who still had not recovered from his surprise.
        - id: ch05-b23
          speaker: heidi
          text: Come down, Peter, and say good evening to me!
        - id: ch05-b24
          speaker: peter
          text: So you really came back?
          emotion: surprised
        - id: ch05-b25
          speaker: narrator
          text: He ran down and took the hand Heidi held out. Then he asked the same question he used to ask when they came home each evening.
        - id: ch05-b26
          speaker: peter
          text: Will you come up with me again tomorrow?
        - id: ch05-b27
          speaker: heidi
          text: Not tomorrow. Maybe the day after. Tomorrow I have to visit Grandmother.
        - id: ch05-b28
          speaker: peter
          text: I'm glad you're back.
          emotion: happy
        - id: ch05-b29
          speaker: narrator
          text: Peter's whole face shone with pleasure. Then he turned to continue home with the goats, but never had they given him so much trouble. He coaxed them, threatened them, and worked until he had finally gathered the flock together. At that very moment, Heidi started toward the hut with one arm resting over each of Grandfather's two goats. The entire flock wheeled around and raced after her.
        - id: ch05-b30
          speaker: narrator
          text: Heidi had to take the two goats into their stall and close the door, or Peter would never have gotten home that night. When she went inside, she found her bed ready. Grandfather had piled the fresh, sweet-smelling hay high and carefully spread clean sheets over it.
        - id: ch05-b31
          speaker: narrator
          text: Heidi lay down that night with a happy heart. On the fresh hay, she slept more soundly than she had slept for a whole year. Grandfather did not rest nearly so easily. At least ten times during the night, he rose and climbed the ladder to look at her. He watched for any sign of restlessness, then felt the hay he had stuffed into the round window to make sure the moonlight could not shine too brightly across her bed.
        - id: ch05-b32
          speaker: narrator
          text: Heidi never stirred. She no longer needed to wander. The burning longing in her heart had been answered. She had seen the high mountains and rocks glowing in the evening light. She had heard the wind in the fir trees. She was home again on the mountain.
