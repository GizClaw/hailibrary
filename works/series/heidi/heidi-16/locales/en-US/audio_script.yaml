  chapters:
    - id: ch01
      title: Morning on the Mountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Rosy morning light spread across the mountains. A fresh breeze rustled through the old fir trees and set their ancient branches waving back and forth. That sound woke Heidi, and she opened her eyes. Whenever the trees roared, something powerful stirred inside her. Their voices seemed to draw her straight toward them. She leaped from bed and dressed as fast as she could. Even so, it took a little while. These days, she took care to make herself clean and tidy before she went out.
        - id: ch01-b02
          speaker: narrator
          text: When she climbed down the ladder, Grandfather was already outside. As he did each morning, he studied the sky and the land to judge the coming weather. Small pink clouds drifted overhead. The sky grew bluer by the minute, and the rising sun was turning the high peaks and meadows to gold.
        - id: ch01-b03
          speaker: heidi
          text: Oh, it's beautiful! So beautiful! Good morning, Grandfather!
          emotion: happy
        - id: ch01-b04
          speaker: grandfather
          text: Well, you're awake already, are you?
        - id: ch01-b05
          speaker: narrator
          text: After greeting him, Heidi ran around to the fir trees. Each new gust rushed through their branches, and each time she jumped and cried out with delight.
        - id: ch01-b06
          speaker: narrator
          text: While Heidi listened to the trees, Grandfather went to milk the goats. Then he brushed and washed them, making them ready for their trip up the mountain, and led them from the shed. The moment Heidi saw her two friends, she ran over and threw her arms around them. They bleated back and pressed their heads against her, each trying to show more affection and get closer than the other. Soon she was nearly squeezed between them.
        - id: ch01-b07
          speaker: narrator
          text: Heidi wasn't frightened. But when lively Little Bear shoved too hard, she spoke to him.
        - id: ch01-b08
          speaker: heidi
          text: No, Little Bear. You're pushing just like the Great Turk.
        - id: ch01-b09
          speaker: narrator
          text: Little Bear pulled his head back at once and stopped his rough greeting. Little Swan raised her head as if to say that no one could ever accuse her of acting like the Great Turk. White Swan, after all, had rather finer manners than Brown Bear.
        - id: ch01-b10
          speaker: narrator
          text: Then Peter's whistle rang out, and all the goats came leaping and springing up the path. Soon the whole flock crowded around Heidi with their wild, noisy greetings. They pushed her one way and then another as each goat tried to reach her. At last she worked her way through the commotion to Snowflake. The young goat had been trying in vain to get close.
        - id: ch01-b11
          speaker: narrator
          text: Peter let out one final, tremendous whistle. He wanted to scare the goats aside so he could speak to Heidi himself. The flock sprang away, and he came closer.
        - id: ch01-b12
          speaker: peter
          text: Can you come up with me today?
        - id: ch01-b13
          speaker: narrator
          text: He plainly did not want to hear no.
        - id: ch01-b14
          speaker: heidi
          text: I'm afraid I can't, Peter. The people from Frankfurt could arrive any minute, and I have to be home when they come.
        - id: ch01-b15
          speaker: peter
          text: You've been saying that for days.
        - id: ch01-b16
          speaker: narrator
          text: Peter grumbled the words.
        - id: ch01-b17
          speaker: heidi
          text: And I'll keep saying it until they get here. Peter, how could I be away when they come? I couldn't do that!
        - id: ch01-b18
          speaker: peter
          text: Uncle would still be here.
        - id: ch01-b19
          speaker: narrator
          text: His voice had turned sour. Just then, Grandfather called out in a voice that carried across the meadow.
        - id: ch01-b20
          speaker: grandfather
          text: Why isn't the army moving? Have we lost the field marshal, or are some of the troops missing?
        - id: ch01-b21
          speaker: narrator
          text: Peter turned away. He swung his stick until it whistled through the air, a signal the goats understood. They set off at a quick trot toward the high pasture, with Peter following behind.
    - id: ch02
      title: The Visitor Arrives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Since coming home to Grandfather, Heidi sometimes thought of things that had never entered her mind in the old days. Each morning she worked hard to put her bed in order, patting it here and smoothing it there until it lay perfectly flat. Downstairs, she put every chair back in its place. If anything had been left lying around, she tucked it into the cupboard. Then she fetched a dust cloth, climbed onto a chair, and rubbed the table until it shone again.
        - id: ch02-b02
          speaker: narrator
          text: Whenever Grandfather came in and saw the tidy room, he looked around with pleasure. He thought the hut seemed ready for Sunday every day now, and that Heidi's time away had taught her something after all.
        - id: ch02-b03
          speaker: narrator
          text: Once Peter had gone and breakfast was over, Heidi began her usual work. But that morning she made very slow progress. The day outside was too lovely, and every few minutes something drew her away. First, a bright ray of sunlight streamed cheerfully through the open window. To Heidi, it almost seemed to be calling, telling her to come outside.
        - id: ch02-b04
          speaker: narrator
          text: Heidi could not stay indoors when the sunshine called like that, so out she ran. Light sparkled over everything around the hut. It shone across all the mountains and stretched far down the valley. The grassy slope looked so golden and inviting that Heidi simply had to sit there for a few minutes and gaze around her.
        - id: ch02-b05
          speaker: narrator
          text: Then she suddenly remembered the stool still standing in the middle of the floor and the table she had not polished. Up she jumped, and back inside she ran. Before long, though, the fir trees began their old song. Heidi felt it through her whole body. Once again, she could not resist the need to be outdoors. Away she raced to leap and play in time with the waving branches.
        - id: ch02-b06
          speaker: narrator
          text: Grandfather was working in his shed. Now and then he stepped out, smiling as he watched her. He had just gone back to work when Heidi shouted for him.
        - id: ch02-b07
          speaker: heidi
          text: Grandfather! Grandfather! Come quick!
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: He hurried outside, afraid something had happened. Instead, he saw Heidi racing toward the path that led down the mountain.
        - id: ch02-b09
          speaker: heidi
          text: They're coming! They're coming! The doctor is right in front!
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: Heidi dashed to meet her old friend. The doctor held out both hands, and she clung to his arm, overflowing with joy.
        - id: ch02-b11
          speaker: heidi
          text: Good morning, Doctor! And thank you, thank you so much!
          emotion: happy
        - id: ch02-b12
          speaker: doctor
          text: God bless you, child. What are you thanking me for?
        - id: ch02-b13
          speaker: narrator
          text: He smiled as he asked.
        - id: ch02-b14
          speaker: heidi
          text: For letting me come home to Grandfather.
        - id: ch02-b15
          speaker: narrator
          text: The doctor's face brightened as suddenly as if a ray of sunlight had crossed it. He had never expected such a welcome. Lost in his own loneliness, he had climbed the mountain without noticing the beauty on every side, though the view grew lovelier the higher he went. He had imagined Heidi might have forgotten him after seeing so little of him. He also felt like a messenger carrying nothing but disappointment, because the friends she expected were not with him. He had prepared himself for no great show of affection. Yet here she stood, her eyes dancing with joy, full of gratitude and love as she held tightly to his arm.
        - id: ch02-b16
          speaker: narrator
          text: He took her hand with fatherly tenderness.
        - id: ch02-b17
          speaker: doctor
          text: Now take me to your grandfather, Heidi. I want to see where you live.
        - id: ch02-b18
          speaker: narrator
          text: But Heidi stayed where she was, searching the path below.
        - id: ch02-b19
          speaker: heidi
          text: Where are Clara and Grandmother?
        - id: ch02-b20
          speaker: doctor
          text: Ah, I have something to tell you, and it will make you as sorry as it makes me. I've come alone, Heidi. Clara was too ill to travel, so Grandmother stayed with her. But next spring, when the days are warm and long again, they will certainly come.
          emotion: sad
        - id: ch02-b21
          speaker: narrator
          text: Heidi was deeply troubled and could hardly make herself believe it. For so long she had pictured Clara and Grandmother arriving on the mountain, and now it would not happen after all. She stood perfectly still for a moment or two, overcome by the sudden disappointment. The doctor said nothing more. Everything around them was quiet. Only the sighing of the fir trees could be heard from where they stood.
        - id: ch02-b22
          speaker: narrator
          text: Then Heidi remembered why she had run down the path in the first place. The doctor really had come, even if the others had not. She lifted her eyes and saw the sadness in his face as he looked down at her. He had never looked that way when she knew him in Frankfurt. The sight went straight to Heidi's heart. She could not bear to see anyone unhappy, especially her dear doctor. She was sure he must feel sad because Clara and Grandmother could not come, so she began thinking of the best way to comfort him.
        - id: ch02-b23
          speaker: heidi
          text: Spring isn't so far away. They'll be sure to come then. Time goes very fast up here, and when they do come, they can stay longer. Clara will like that.
          emotion: calm
        - id: ch02-b24
          speaker: heidi
          text: Come on. Let's go find Grandfather.
        - id: ch02-b25
          speaker: narrator
          text: Hand in hand, they climbed toward the hut. Heidi wanted so badly to cheer him that she kept telling him how quickly winter passed on the mountain. It hardly seemed to count at all, she said, and summer would return before they knew it. Soon she believed her own words so completely that she called to Grandfather in a cheerful voice as they came near.
        - id: ch02-b26
          speaker: heidi
          text: They didn't come today, but they'll be here before very long!
          emotion: happy
    - id: ch03
      title: A Meal Before the Hut
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The doctor was no stranger to Grandfather. Heidi had told the old man so much about her friend that he knew him well already. Grandfather held out his hand in a friendly welcome. The two men sat in front of the hut, and when the doctor beckoned, Heidi took her own little place beside him.
        - id: ch03-b02
          speaker: narrator
          text: The doctor told Grandfather that Herr Sesemann had insisted on sending him on this journey. He admitted that he had not felt quite himself for a long while, and he too believed the trip would do him good. Then he leaned toward Heidi and whispered about a surprise. Something from Frankfurt had traveled with him and was still being carried up the mountain. The doctor claimed it would give her even more pleasure than the sight of her old friend.
        - id: ch03-b03
          speaker: narrator
          text: Heidi could hardly contain her excitement. What in the world could it be?
        - id: ch03-b04
          speaker: narrator
          text: Grandfather urged the doctor to spend as many of the beautiful autumn days on the mountain as he could. At the very least, he should climb up whenever the weather was fine. Grandfather could not offer him a bed because there was no place in the hut to put him. Still, the doctor did not need to return all the way to Ragatz. A small, clean inn stood down in Dorfli. If he stayed there, he could walk up every morning, and the mountain air would do him a world of good. Grandfather even offered to serve as his guide wherever in the mountains he wished to go.
        - id: ch03-b05
          speaker: narrator
          text: The plan delighted the doctor, and the two men settled it just as Grandfather had suggested.
        - id: ch03-b06
          speaker: narrator
          text: By then, the sun had climbed to noon. The wind had died, and the fir trees stood still. For such a high place, the air was wonderfully warm and mild, with a delicious freshness mixed into the sunshine.
        - id: ch03-b07
          speaker: narrator
          text: Grandfather went inside and soon returned carrying a table. He set it in front of the bench.
        - id: ch03-b08
          speaker: grandfather
          text: Heidi, run in and bring out what we need for the table. The doctor will have to take us as we are. Our food may be plain, but I think he'll agree that the dining room is pleasant.
        - id: ch03-b09
          speaker: doctor
          text: I certainly do agree. Just look at that sunlit valley! Thank you for inviting me. Everything must taste good in a place like this.
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: Heidi hurried back and forth, busy as a bee. She brought out everything she could find in the cupboard. Nothing could please her more than helping to entertain the doctor. Meanwhile, Grandfather prepared the meal. He appeared with a steaming jug of milk and cheese toasted golden brown. Then he cut thin slices from the meat he had cured himself in the pure mountain air.
        - id: ch03-b11
          speaker: narrator
          text: The doctor enjoyed that dinner more than any meal he had eaten in a whole year.
        - id: ch03-b12
          speaker: doctor
          text: Our Clara simply must come up here. This place would transform her. And if she ate this well for any length of time, she'd grow plumper than anyone had ever seen her!
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: As he spoke, a man appeared on the path with a large package on his back. He reached the hut, dropped his load on the ground, and took two or three deep breaths of mountain air.
        - id: ch03-b14
          speaker: doctor
          text: Ah, here is the other traveler from Frankfurt.
        - id: ch03-b15
          speaker: narrator
          text: The doctor stood and began unwrapping the package while Heidi watched, full of expectation. Once he had removed the heavy outer covering, he turned it over to her.
        - id: ch03-b16
          speaker: doctor
          text: There you are, child. Now you can unpack your treasures yourself.
    - id: ch04
      title: Treasures from Frankfurt
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Heidi opened the presents one after another until all her treasures lay spread before her. She could not say a word while she worked. Wonder and delight had taken her voice away. Only when the doctor came over and opened the large box did she finally cry out. Inside were the soft cakes meant for Grandmother to eat with her coffee.
        - id: ch04-b02
          speaker: heidi
          text: Now Grandmother will have something nice to eat!
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: Heidi wanted to pack everything again and take it to her at once. Grandfather told her he would walk down with the doctor that evening, so she could come along and deliver the gifts then.
        - id: ch04-b04
          speaker: narrator
          text: Next Heidi found the packet of tobacco and ran to give it to Grandfather. It pleased him so much that he filled his pipe immediately. The two men sat together again. Smoke curled upward from their pipes while they talked about one thing after another. All the while, Heidi stayed among her treasures, picking up one present to examine it and then turning eagerly to the next.
        - id: ch04-b05
          speaker: narrator
          text: Suddenly she ran over and stood in front of the doctor. She waited until the conversation paused.
        - id: ch04-b06
          speaker: heidi
          text: No. The other thing didn't make me happier than seeing you, Doctor.
        - id: ch04-b07
          speaker: narrator
          text: Both men burst out laughing.
        - id: ch04-b08
          speaker: doctor
          text: Well, I never would have guessed that!
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: When the sun began sinking behind the mountains, the doctor stood. It was time to return to Dorfli and find his room. Grandfather carried the cakes, the shawl, and the huge sausage. The doctor took Heidi's hand, and all three started down the mountain.
        - id: ch04-b10
          speaker: narrator
          text: At Peter's house, Heidi said goodbye to the two men. She would wait with Grandmother while Grandfather went on to Dorfli with his guest. He would come back for her afterward. As the doctor shook her hand, Heidi offered him the greatest treat she could imagine.
        - id: ch04-b11
          speaker: heidi
          text: Would you like to go up with the goats tomorrow morning?
        - id: ch04-b12
          speaker: doctor
          text: It's a promise. We'll go together.
          emotion: happy
    - id: ch05
      title: Gifts for Grandmother
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Heidi ran inside to Grandmother. First, with quite a struggle, she managed to carry in the box of cakes. Then she hurried outside again for the sausage, since Grandfather had left all the presents beside the door. A third trip brought in the shawl. Heidi arranged everything as close to Grandmother as she possibly could. That way, the old woman could feel each gift for herself and understand what had arrived. Last of all, Heidi spread the shawl across Grandmother's knees.
        - id: ch05-b02
          speaker: heidi
          text: They're all from Frankfurt. Clara and Grandmother sent them.
        - id: ch05-b03
          speaker: narrator
          text: Grandmother and Brigitta were astonished. Brigitta had watched Heidi drag in one heavy thing after another and could not imagine what was happening.
        - id: ch05-b04
          speaker: heidi
          text: You're happy about the cakes, aren't you, Grandmother? Feel how soft they are!
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: Heidi said it again and again, and Grandmother always gave the same grateful answer.
        - id: ch05-b06
          speaker: grandmother
          text: Yes, yes, Heidi, of course I am. What kind people they must be!
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: Then Grandmother ran her hand over the thick, warm shawl.
        - id: ch05-b08
          speaker: grandmother
          text: This will be wonderful when the cold winter comes. I never thought I'd own anything so splendid to wrap around me.
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: Heidi was a little surprised that Grandmother seemed happier about the shawl than the cakes.
        - id: ch05-b10
          speaker: narrator
          text: Brigitta, meanwhile, stared at the sausage almost in awe. She had hardly ever seen such a monstrous sausage, much less owned one. She could scarcely trust her eyes and shook her head doubtfully.
        - id: ch05-b11
          speaker: brigitta
          text: I'll have to ask Uncle what we're supposed to do with it.
        - id: ch05-b12
          speaker: heidi
          text: It's for eating. What else would it be for?
        - id: ch05-b13
          speaker: narrator
          text: Just then, Peter tumbled through the door.
        - id: ch05-b14
          speaker: peter
          text: Uncle's right behind me. He's coming—
        - id: ch05-b15
          speaker: narrator
          text: Peter stopped in the middle of his sentence. He had spotted the sausage, and the sight left him too stunned to go on. Heidi understood that Grandfather was close, so she said goodbye to Grandmother.
        - id: ch05-b16
          speaker: narrator
          text: These days, Grandfather never passed the house without stepping in to wish the old woman a good day. She loved hearing his footsteps approach because he always brought her a cheerful word. But evening had come, and it was already late for Heidi. She rose with the lark each morning, and Grandfather never allowed her to stay up beyond her proper bedtime. So this time he only called good night through the open door. Then he and the child set off for home at once.
        - id: ch05-b17
          speaker: narrator
          text: Together, they climbed beneath the starry sky toward their peaceful home.
