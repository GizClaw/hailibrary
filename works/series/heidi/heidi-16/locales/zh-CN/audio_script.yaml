audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    doctor:
      display_name: 医生
      tts: {delivery: "亲切睿智，轻松时幽默，诊断时坚定", timbre: 温暖清亮, pace: 平稳自然, pitch: 中音}
    grandpa:
      display_name: 爷爷
      tts: {delivery: "寡言沉稳，粗粝外表下藏着深厚温情", timbre: 低沉沧桑, pace: 舒缓, pitch: 低音}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandmother:
      display_name: 祖母
      tts: {delivery: "慈爱虔诚，喜悦中带着年迈者的颤音", timbre: 温柔苍老, pace: 缓慢, pitch: 中音}
    brigitta:
      display_name: 布丽吉塔
      tts: {delivery: "朴实热心，惊讶时话语接连不断", timbre: 温厚明朗, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 山上的清晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清早，初升的天光把群山染成玫瑰红。清风钻进枞树，吹得古老的枝条来回摆动，树梢发出阵阵轰鸣。海蒂听见这熟悉的声音，立刻醒了。每回枞树这样呼唤，她心里都会激动起来，恨不得马上跑到树下。她跳下床，飞快地穿衣服，不过还是花了些时间。自从回家以后，她总记得把自己收拾得又干净又整齐。
        - id: ch01-b02
          speaker: narrator
          text: 海蒂顺着梯子下来，爷爷已经站在屋外。他每天早晨都要看看天空和四周的山野，好判断当天的天气。粉红的小云朵飘在天上，天空越来越亮，也越来越蓝。太阳才从最高的山峰后露头，山岭和草坡就全变成了金色。
        - id: ch01-b03
          speaker: heidi
          text: 啊，真美，太美了！爷爷，早上好！
          emotion: happy
        - id: ch01-b04
          speaker: grandpa
          text: 咦，你这么早就醒了？早上好。
        - id: ch01-b05
          speaker: narrator
          text: 海蒂绕到枞树旁，专心听自己最爱的声音。每当一阵新风轰然穿过枝叶，她就欢叫着跳起来。爷爷已经去挤羊奶了。挤完以后，他又把两只山羊洗刷干净，替它们做好上山的准备，再领出羊棚。海蒂一看见两个朋友，马上跑过去抱住它们。它们也咩咩叫着回应，争先恐后地用脑袋蹭她，都想挨得最近，差点把她夹在中间挤扁。小熊顶得太用力，海蒂也一点不害怕。
        - id: ch01-b06
          speaker: heidi
          text: 不行，小熊，你这样推我，简直和大土耳其一样。
        - id: ch01-b07
          speaker: narrator
          text: 小熊听懂了，马上缩回脑袋，不再粗鲁地往前挤。小天鹅却高高扬起头，脸上的神气仿佛在说，谁也别想指责它举止像大土耳其。毕竟，白色的小天鹅一向觉得自己比棕色的小熊更有派头。彼得的哨声很快传来，所有山羊一路蹦蹦跳跳地赶到，转眼就围住海蒂。它们吵吵闹闹地向她问好，热情地把她推来推去。海蒂费了好大劲，才从羊群中挤出去，来到一直努力靠近她、却怎么也够不着她的雪花身边。
        - id: ch01-b08
          speaker: narrator
          text: 彼得又吹了一声震耳的口哨，把羊群吓到两边。他其实是想靠近海蒂，问她一句话。
        - id: ch01-b09
          speaker: peter
          text: 你今天能跟我一起上山吗？
        - id: ch01-b10
          speaker: heidi
          text: 恐怕不行。他们随时会从法兰克福来，我一定得在家等他们。
        - id: ch01-b11
          speaker: peter
          text: 你已经这样说了好多天。
        - id: ch01-b12
          speaker: heidi
          text: 那我就一直说到他们来呀。他们到的时候，我怎么能不在家？我可做不出这种事。
        - id: ch01-b13
          speaker: peter
          text: 大叔反正会在家。
          emotion: angry
        - id: ch01-b14
          speaker: grandpa
          text: 这支大军怎么还不出发？是元帅没跟上，还是有士兵掉队了？
        - id: ch01-b15
          speaker: narrator
          text: 彼得只好转身走了。他一边走，一边把手里的棍子挥得呼呼响。山羊全都听懂了这个出发的信号，立刻撒开腿，飞快奔向高处的牧场，彼得就跟在羊群后面。
    - id: ch02
      title: 等候来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从法兰克福回来以后，海蒂常会想起从前不曾留意的事。她每天费心铺床，拍了又抚，直到铺面平整。接着，她要在楼下屋里走上一圈，把每把椅子放回原位，把散落的东西收进橱柜。最后再取来抹布，爬上椅子，把桌子擦得重新发亮。爷爷过一会儿进屋，看见四周这样整洁，总会满意地想，如今这里天天都像过星期日，海蒂这趟远门没有白走。
        - id: ch02-b02
          speaker: narrator
          text: 彼得走后，海蒂和爷爷吃完早饭，她照常开始干活，今天却怎么也干不快。屋外实在太美了，总有新东西来打断她。一束明亮的阳光快活地穿过窗口，像在叫她快出去。海蒂觉得屋里再也待不住，便跑出去回应它。她看见小屋周围、所有山峰和远方的山谷都闪着光。金灿灿的草坡太诱人，她非坐下来望上一会儿不可。忽然，她又记起小凳子还留在屋子正中，桌子也没有擦，只得跳起来，赶紧跑回去。
        - id: ch02-b03
          speaker: narrator
          text: 没多久，枞树又唱起古老的歌。那声音传遍海蒂全身，她奔向屋外的愿望又变得无法抵抗。她跑出去，随着摇动的枝条奏出的曲调蹦跳嬉戏。爷爷正在工棚里忙自己的活儿，隔一会儿便走出来，笑着看看她玩耍。这一回，他才刚转身回到棚里，就听见海蒂在外面急急地大声喊他。
        - id: ch02-b04
          speaker: heidi
          text: 爷爷！快来，快来！他们来了！医生走在最前面！
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 爷爷连忙出来，还怕孩子遇上了什么事。海蒂已经朝下山的路飞奔过去。医生伸出双手迎她，她一到跟前，就紧紧抱住他的手臂。
        - id: ch02-b06
          speaker: heidi
          text: 医生，早上好！我要谢谢您，好多好多遍！
          emotion: happy
        - id: ch02-b07
          speaker: doctor
          text: 愿上帝保佑你，孩子。你为什么要谢我呢？
        - id: ch02-b08
          speaker: heidi
          text: 因为是您让我回家，又能和爷爷住在一起。
        - id: ch02-b09
          speaker: narrator
          text: 医生的脸一下亮了，像有阳光掠过。他一路想着自己的孤单，竟没看见山色有多美，也没发现越往上走，景色越动人。他以为海蒂和自己相处不久，早把他忘了。何况克拉拉她们没有来，他像是专程送来失望的人，哪敢盼望热烈的欢迎。眼前的海蒂却满眼喜悦，满怀感激和亲近，仍挽着他的手臂。医生疼爱地牵起她的手。
        - id: ch02-b10
          speaker: doctor
          text: 海蒂，带我去见爷爷吧，也让我看看你住的小屋。
        - id: ch02-b11
          speaker: heidi
          text: 可是克拉拉和祖母在哪里？
        - id: ch02-b12
          speaker: doctor
          text: 唉，我得告诉你一件让我们都难过的事。这次只有我来了。克拉拉病得很重，不能旅行，祖母只好留在她身边。不过明年春天，等天气暖和、白昼变长，她们一定会来。
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: 海蒂呆住了。她盼了那么久，早就在心里一遍遍想象大家来到山上的样子，如今那一幕竟然不会发生，她怎么也信不了。突如其来的失望压住了她，她站着一动不动。医生没有再说，周围静悄悄的，只听得见远处枞树的叹息。过了一会儿，海蒂想起自己为什么跑下山，也想起医生毕竟真的来了。她抬头一看，医生低头望着她，眼里满是她在法兰克福从未见过的悲伤。海蒂最受不了别人不快乐，更何况是亲爱的医生。她以为他也在为克拉拉和祖母不能来难过，便赶紧想法子安慰他。
        - id: ch02-b14
          speaker: heidi
          text: 等到春天其实没有多久，她们那时一定会来。我们山上的日子过得可快了，而且她们春天来，还能多住些时候，克拉拉会更高兴。现在去找爷爷吧。
          emotion: calm
        - id: ch02-b15
          speaker: narrator
          text: 两个人手牵着手往小屋走。海蒂一心想让医生重新快活起来，一路不断向他保证，山上的冬天过得特别快，快得几乎不值得放在心上。还没等人觉察，夏天转眼又会回来。她越说越相信自己的话，走到小屋前时，已经又变得欢欢喜喜。她远远告诉爷爷，大家今天虽然没有来，却用不了多久就一定会到。
    - id: ch03
      title: 小屋前的午餐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 爷爷早从海蒂那里听说过医生的许多事，虽然今天才见面，却已经不觉得他陌生。老人亲切地同客人握手。两个大人在屋前坐下，医生也招呼海蒂坐到自己身旁。医生说，是塞泽曼先生坚持请他来走这一趟。他自己近来一直不大舒服，也相信山中旅行会有好处。接着，他压低声音，悄悄告诉海蒂，还有一样从法兰克福来的东西正在上山。那东西和医生一路同行，而且会让她比见到老医生本人更高兴。海蒂听得激动万分，脑子里不停猜测，却怎么也想不出那会是什么。
        - id: ch03-b02
          speaker: narrator
          text: 爷爷劝医生趁着秋日晴美，多在山上住些时候，至少天气好的日子都该上来。他很想留客，可小屋实在没有安置医生的地方。爷爷便劝他别再回拉加茨，住到多尔夫里那家干净整洁的小客店去。这样一来，医生每天早晨都能上山，山路和空气一定会给他不少好处。若还想看看别处，爷爷愿意亲自做向导，带他去山中任何想去的地方。医生一听就喜欢上这个安排，两个人当场把事情定了下来。
        - id: ch03-b03
          speaker: narrator
          text: 他们说话的时候，太阳也在不断升高，不知不觉已经到了正午。风渐渐停了，先前不停摇曳的枞树如今静静立着，一根枝条也不再摆动。身在这样高的山上，空气仍旧出奇地温暖柔和，阳光的暖意里又混着清新宜人的凉气。爷爷这才站起身，走进小屋，过了几分钟，搬出一张桌子摆在座位前。
        - id: ch03-b04
          speaker: grandpa
          text: 海蒂，把吃饭要用的东西拿出来。医生只能跟着我们吃些家常饭，不过咱们这个饭厅，他一定会喜欢。
        - id: ch03-b05
          speaker: doctor
          text: 那还用说！多谢你们请我吃饭。坐在这里看着阳光下的山谷，什么东西吃起来都会香。
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 海蒂像只忙碌的小蜜蜂，跑进跑出，把橱柜里能找到的东西全搬上桌。能帮着招待医生，她高兴得不知怎样做才够。与此同时，爷爷也准备好了饭菜。他端来一罐热气腾腾的羊奶，还有烤得金黄的奶酪，又从自己腌制的肉上切下几片薄片。那肉一直晾在山间纯净的空气里。医生坐在这座开阔明亮的饭厅中，吃得格外香，整整一年都没有哪顿饭让他这样满意。
        - id: ch03-b07
          speaker: doctor
          text: 克拉拉一定得来这里。山上的日子会让她完全变一个人。她要能像我今天这样吃上一阵子，准会长得比谁都丰满。
    - id: ch04
      title: 从法兰克福来的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 医生说话的时候，一个男人正沿着山路往上走，背上扛着一个很大的包裹。他来到小屋前，把沉重的包裹往地上一放，停下来连着深吸了两三口山间的新鲜空气。医生一看就站起身来，告诉海蒂，那正是和他一起从法兰克福远道而来的东西。他走到包裹旁，亲手解开外面的绳索，再一层层拆掉厚重的外层包布。海蒂守在旁边，眼睛紧紧盯着他的手，满怀期待地等着看里面究竟藏着什么。
        - id: ch04-b02
          speaker: doctor
          text: 好了，孩子。剩下这些宝贝，你自己一件件拆吧。
        - id: ch04-b03
          speaker: narrator
          text: 海蒂把礼物一件一件打开，直到所有宝贝都摆在眼前。她一会儿看看这个，一会儿摸摸那个，惊讶和欢喜填满了心，竟始终说不出一句话。后来，医生又走到她身边，亲手打开那只大盒子，让她看清里面装满了松软的小蛋糕，还告诉她，这些都是给祖母配咖啡吃的。海蒂这才终于发出一声欢叫。
        - id: ch04-b04
          speaker: heidi
          text: 这下祖母有好吃的东西了！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 海蒂恨不得立刻把所有礼物重新包好，马上送到祖母那里。爷爷说，傍晚他正好要陪医生下山，她可以跟着一起去，把东西都带上。海蒂又在礼物中找到一包烟草，赶紧跑过去送到爷爷手里。爷爷喜欢极了，当即取出一些装进烟斗。两个大人重新坐下来，一边抽烟，一边谈着各种各样的事情，淡淡的烟雾从烟斗里袅袅升起。海蒂还在礼物间来回走动，一会儿看看这一件，一会儿又拿起那一件。忽然，她跑到两个大人跟前，站在医生面前，耐心等他们的谈话出现停顿。
        - id: ch04-b06
          speaker: heidi
          text: 医生，不对。那些礼物没有让我比见到您更高兴。
        - id: ch04-b07
          speaker: narrator
          text: 两个大人听了，都忍不住笑了起来。医生望着海蒂，回答说，他怎么也没有想到，孩子会给自己这样一个答案。
    - id: ch05
      title: 祖母的惊喜
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 太阳开始沉到群山背后，医生站起身来，该去多尔夫里找住处了。爷爷拿着小蛋糕、厚披肩和那根大香肠，医生牵起海蒂，三个人一起沿山路往下走。来到彼得家，海蒂向两人告别，留下陪祖母，也等着爷爷回来接她。爷爷还要继续把客人送到村里。医生握着海蒂的手告别，海蒂便把自己想得到的最好玩乐送给他。
        - id: ch05-b02
          speaker: heidi
          text: 您明天早晨愿意跟我们一起赶山羊上山吗？
        - id: ch05-b03
          speaker: doctor
          text: 就这么说定了。明天我们一起去！
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 海蒂跑进祖母家。她先费力地把小蛋糕盒搬进屋，又跑出去拿爷爷留在门边的香肠，第三趟才把厚披肩取来。她把每一样礼物都放得紧靠祖母，好让看不见的老人伸手就能摸到，明白那里有什么。最后，海蒂把披肩轻轻铺在祖母膝上。布丽吉塔一直看着她把一件件沉甸甸的东西拖进屋，完全不知道发生了什么，脸上满是惊讶。
        - id: ch05-b05
          speaker: heidi
          text: 这些都是从法兰克福来的，是克拉拉和祖母送给你们的。祖母，你一定很喜欢小蛋糕吧？快尝尝，它们可松软了！
        - id: ch05-b06
          speaker: grandmother
          text: 喜欢，当然喜欢，海蒂！她们真是好心人。再摸摸这条厚披肩，冬天披着该多暖和啊。我从没想过，自己还能有这么漂亮的东西。
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 海蒂有点不明白，祖母看起来怎么会喜欢披肩胜过蛋糕。布丽吉塔却一直盯着香肠，神情几乎带着敬畏。她一生都很少见到这样大得吓人的香肠，更别说自己拥有一根了，简直不敢相信自己的眼睛。她左看右看，最后还是疑惑地摇了摇头。
        - id: ch05-b08
          speaker: brigitta
          text: 我得问问大叔，这么大一根东西，到底是拿来做什么的？
        - id: ch05-b09
          speaker: heidi
          text: 当然是拿来吃的呀，不会有别的用处。
        - id: ch05-b10
          speaker: narrator
          text: 就在这时，彼得跌跌撞撞地闯进来。他才说大叔跟在后面，马上就到，目光忽然落在香肠上，整个人惊得停在那里，连没说完的话也忘了。海蒂却听明白爷爷快来了，便向祖母告别。爷爷如今每回路过这扇门，总会进屋问候老人。祖母也爱听他的脚步声一点点靠近，因为他每次都会带来一句让人舒心的话。可是今晚已经很晚，海蒂又总和云雀一样早起，爷爷从不让她误了睡觉的时候。因此，他今天只隔着敞开的门向祖母道声晚安，就立刻带上海蒂回家。爷孙俩踏着满天星光，重新爬上山去，回到他们宁静的小屋。
