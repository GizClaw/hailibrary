audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    grandmother:
      display_name: 祖母
      tts: {delivery: "慈爱虔诚，喜悦中带着年迈者的颤音", timbre: 温柔苍老, pace: 缓慢, pitch: 中音}
    brigitta:
      display_name: 布丽吉塔
      tts: {delivery: "朴实热心，惊讶时话语接连不断", timbre: 温厚明朗, pace: 适中, pitch: 中音}
    grandpa:
      display_name: 爷爷
      tts: {delivery: "寡言沉稳，粗粝外表下藏着深厚温情", timbre: 低沉沧桑, pace: 舒缓, pitch: 低音}
    pastor:
      display_name: 牧师
      tts: {delivery: "诚恳宽厚，话语里带着温暖的力量", timbre: 温和沉稳, pace: 从容, pitch: 中低音}
    villagers:
      display_name: 村民们
      tts: {delivery: "质朴热闹，议论时直爽而好奇", timbre: 明朗厚实, pace: 适中, pitch: 中音}
    miller:
      display_name: 磨坊主
      tts: {delivery: "直率粗朴，带着山村人的审视口气", timbre: 粗厚, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 白面包和赞美诗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海蒂在摇动的枞树下等爷爷。爷爷要陪她到祖母家，再从那里去多夫里取回箱子。她急着知道老人吃白面包时有多喜欢，也迫不及待地想再看见祖母，听见那熟悉的声音。可如今，等待一点也不显得漫长。枞树的低语怎么听也听不够，绿草地送来的阵阵花香怎么闻也闻不够。阳光下，金黄色的花朵灿灿发亮，眼前仿佛摆开了一席盛宴。海蒂更是怎么也看不够。爷爷终于走出小屋，向四周望了一眼，便快活地招呼她一起动身。
        - id: ch01-b02
          speaker: narrator
          text: 这天是星期六。阿尔姆大叔每逢这一天，总要把屋里屋外全收拾得干干净净。他忙了整整一上午，好空出下午陪海蒂下山。这时，四处都像他喜欢的那样整齐妥帖。两人在祖母的小屋前分手，海蒂独自跑了进去。老人早已听见她走近的脚步。孩子才跨过门槛，她便惊喜地问，是不是海蒂又来看她了。接着，她紧紧握住孩子的手，迟迟不肯松开，仿佛仍然担心海蒂会再一次被人从身边带走。
        - id: ch01-b03
          speaker: narrator
          text: 祖母说白面包香极了，才吃过一只，身上已经多了些力气。布丽吉塔相信，母亲只要这样吃一个星期，精神准会好起来。可老人怕面包吃光，到现在只舍得吃一只。海蒂想了一会儿，突然有了办法。
        - id: ch01-b04
          speaker: heidi
          text: 我要写信给克拉拉，请她再送这么多来，说不定还能送两倍呢！从前我衣柜里有好大一堆。那些面包拿走时，她答应还给我同样多。她一定肯送。
        - id: ch01-b05
          speaker: brigitta
          text: 主意倒好，可送到这里，面包就又干又硬了。多夫里的面包师也烤白面包，要是偶尔能买几只就好了。可我的钱只够买黑面包。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂脸上又亮起来。她想到了更好的办法，高兴得在屋里直蹦。
        - id: ch01-b07
          speaker: heidi
          text: 我有好多钱呀！我终于知道该怎么花了。祖母每天吃一只新鲜白面包，星期日吃两只，让彼得从多夫里带上来。
          emotion: happy
        - id: ch01-b08
          speaker: grandmother
          text: 不行，孩子，我不能让你这样花。人家给你钱，不是为了这件事。你得交给爷爷，让他告诉你怎么用。
        - id: ch01-b09
          speaker: narrator
          text: 海蒂一心要为祖母做这件好事，谁也拦不住。她仍旧在屋里跳来跳去，一遍遍念着，祖母以后每天都有一只面包吃，很快就会完全恢复力气。她的声音忽然更加欢欣，因为她又想到一件事。老人也许正因为身子虚弱，眼前才总是一片黑暗。等身子强壮起来，说不定一切都会重新亮起来。祖母不愿扫孩子的兴，安静地听着，没有说话。海蒂继续蹦跳，忽然看见架上那本很久没人碰过的赞美诗集，心里又冒出一个叫人高兴的念头。
        - id: ch01-b10
          speaker: heidi
          text: 祖母，我现在会读书了。要不要我从您的旧书里念一首赞美诗？
        - id: ch01-b11
          speaker: grandmother
          text: 要，当然要！孩子，你真的会读了吗？
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: 海蒂爬上椅子，取下那本很久没人碰过的书，灰尘顿时扬了起来。她擦净书，在祖母身边坐好，请老人挑一首。祖母把纺车推开，只说随她挑，便满怀期待地等着。海蒂翻着书，偶尔低声念一两行，最后选中一首写太阳的诗。她越读越投入。
        - id: ch01-b13
          speaker: heidi
          text: 清晨已经来到，大地温暖又明亮，静静沐浴在金色的光芒。晨曦驱散了夜的云障。上帝亲手创造的一切，就在四周显现。万物不论大小，都把他的荣耀传遍，哪里看不见他慈爱的印鉴？世间万物终会消逝，上帝却永远长存。他用坚定的力量完成自己的旨意，他的旨意稳固不移，直到永恒。他的救恩永远不会失落。纵然忧伤和恐惧袭上人心，他终会领我们渡过生命的风波。我们终将在蒙福的花园欢聚。风雨过后，安歇在那里。我怀着平安静静等待，上帝安排的时刻最好。
        - id: ch01-b14
          speaker: narrator
          text: 祖母合起双手，脸上现出一种难以形容的喜悦，那是海蒂从未见过的神情。与此同时，泪水却不断滑过老人的面颊。诗一读完，她便急切地恳求孩子再念一次，只要再念一次就好。海蒂从诗句里得到的快乐一点也不比祖母少，立刻从最后一节重新读起。
        - id: ch01-b15
          speaker: heidi
          text: 我们终将在蒙福的花园欢聚。风雨过后，安歇在那里。我怀着平安静静等待，上帝安排的时刻最好。
        - id: ch01-b16
          speaker: grandmother
          text: 海蒂，这些话让我的心亮起来了！你给了我多大的安慰啊！
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: 老人一遍遍念着欢欣的诗句。海蒂满脸喜悦，目光舍不得从祖母脸上移开。往日的忧愁消失了，平安和快乐照亮了那张脸。她仿佛正用一双清澈的新眼睛，望着那座花园，望着天堂。
    - id: ch02
      title: 回家路上的领悟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 窗上忽然响起敲击声。海蒂抬头一看，爷爷正在外面招手，叫她一起回去。临走前，她答应第二天一定还来。就算跟彼得上山，也只同他待半天。想到自己能使祖母的心重新明亮快活，她便觉得这是世上最快乐的事，甚至比在阳光灿烂的山上陪着鲜花和山羊更叫她高兴。海蒂正要出门，布丽吉塔拿着她落下的裙子和帽子追过来。海蒂把裙子搭在手臂上，因为爷爷从前见过它。可她坚决不要那顶插羽毛的帽子。布丽吉塔尽管留下好了，反正她再也不会把它戴在头上。
        - id: ch02-b02
          speaker: narrator
          text: 海蒂满心都是这天上午发生的事，一见爷爷，立刻从头讲起。只要有钱，每天都能从多夫里买来新鲜的白面包。祖母吃过以后已经有了精神，听完赞美诗也快活起来，心里仿佛真的照进了光。说着说着，海蒂又回到自己最关心的面包上。
        - id: ch02-b03
          speaker: heidi
          text: 祖母不肯拿我的钱。爷爷，您把钱全交给我，好不好？我每天给彼得买一只面包的钱，星期日给两只的钱。
        - id: ch02-b04
          speaker: grandpa
          text: 那你的床怎么办？你可以买一张真正的床，余下的钱仍够买面包。
        - id: ch02-b05
          speaker: narrator
          text: 海蒂不肯放弃。她说自己睡干草床，比睡法兰克福那张带软枕的床安稳多了。爷爷终于答应，让她自己支配那些钱。那笔钱足够给祖母买好多年的面包。
        - id: ch02-b06
          speaker: narrator
          text: 海蒂想到祖母从此不必再啃硬黑面包，欢呼着拉住爷爷，一路唱唱跳跳，轻快得像只小鸟。她觉得从没有哪一天像今天这样幸福。可走着走着，她忽然安静下来。她终于懂了，如果上帝在她哭求时立刻送她回家，她只能带回一点面包，也不会读书，更不能用诗句安慰祖母。如今一切比她自己想的好得多，果然像法兰克福的老夫人说过的那样。
        - id: ch02-b07
          speaker: heidi
          text: 我真高兴，上帝没有马上答应我从前哭着求的事。以后我要照老夫人教的，每天祈祷，也每天感谢他。要是他没照我求的去做，我就会想，这和法兰克福那次一样，他一定在准备更好的事。爷爷，我们每天都祈祷，永远别再忘记他，好不好？不然，他也许会忘记我们。
        - id: ch02-b08
          speaker: grandpa
          text: 要是一个人已经忘记他了呢？
        - id: ch02-b09
          speaker: heidi
          text: 那就什么都糟了。上帝会任凭那个人想往哪里走就往哪里走。等他又穷又苦，哭起来的时候，别人只会说，是你自己离开了上帝，所以本来能帮助你的上帝，也只好由你去了。
        - id: ch02-b10
          speaker: grandpa
          text: 这话不错。海蒂，是谁教你的？
        - id: ch02-b11
          speaker: heidi
          text: 法兰克福的老夫人。她把这些都讲给我听了。
        - id: ch02-b12
          speaker: narrator
          text: 爷爷默默走了一会儿。他像在对自己说，一个人真走到那一步，就再也回不去了。被上帝忘记的人，会永远被忘记。
        - id: ch02-b13
          speaker: heidi
          text: 不会的，爷爷，人还能回去！老夫人告诉过我，我书里的故事也是这样说的。您还没听过。我们快到家了，回去我就念给您听，您会知道它有多美。
        - id: ch02-b14
          speaker: narrator
          text: 海蒂急着让爷爷听见那个故事，在陡峭的山路上越走越快。两人才到山顶，她便松开爷爷的手，先跑进小屋。海蒂的箱子太重，不能整个搬上山。爷爷把里面一部分东西装进背篓，亲自背了回来。这时，他从肩上卸下背篓，走到自己的位子上坐好，仍在想着方才那些话，一声也没有出。
    - id: ch03
      title: 失而复得的儿子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海蒂很快抱着书跑出来。看见爷爷已经坐好，她立刻来到他身边。这故事读过太多遍，书页一翻就自己落在那里。她带着深深的同情讲起一个儿子。他本来在父亲家过着幸福生活，披着漂亮斗篷，带父亲的羊群到田野去。他倚着牧杖看夕阳，书里的图画正是这个模样。可他忽然想拿到自己的财物和钱，自己做主人，便向父亲要了应得的一份。他离开自己的家，把所有财产都挥霍掉了。
        - id: ch03-b02
          speaker: narrator
          text: 等到一无所有，他只好去替另一个主人干活。那个人没有他父亲那样的田野和羊群，只有猪需要看管。他只能穿着破衣服，守在猪群旁边，吃几颗猪吃的豆荚充饥。穷困中，他想起从前在家多么幸福，想起父亲待他多么慈爱，也终于明白自己有多忘恩负义。他因为悲伤和思念哭了起来，决定起身回家。他要对父亲承认，自己得罪了天，也得罪了父亲，已经不配再做儿子，只求父亲把他当作一个雇工。
        - id: ch03-b03
          speaker: narrator
          text: 儿子离家还很远，父亲就看见了他。海蒂故意停下，问爷爷猜猜父亲是不是仍在生气，会不会说一句，我早就告诉过你。接着她继续念。父亲看见儿子，心里满是怜爱，马上跑过去，搂住他的脖子亲吻他。儿子说，自己得罪了天，也得罪了父亲，不配再称为儿子。
        - id: ch03-b04
          speaker: heidi
          text: 可父亲吩咐仆人，快把最好的袍子拿来给他穿，把戒指戴在他手上，把鞋穿在他脚上。再牵来肥牛犊宰了，让大家一起吃喝庆祝。因为他的儿子死而复生，失而复得。于是，他们真的欢庆起来。
        - id: ch03-b05
          speaker: heidi
          text: 爷爷，这个故事是不是很美？
        - id: ch03-b06
          speaker: narrator
          text: 海蒂原以为爷爷听完以后，一定会又惊讶又欢喜。可老人始终坐在那里，没有说话，也没有露出她期待的神情。
        - id: ch03-b07
          speaker: grandpa
          text: 你说得对，海蒂。这是个很美的故事。
        - id: ch03-b08
          speaker: narrator
          text: 爷爷的神情十分严肃，海蒂也静下来，只看书里的图画。过了一会儿，她把书轻轻推到爷爷面前，指给他看。那个回家的儿子换上新衣，站在父亲身边，又成了他的儿子。海蒂只说，你看，他现在多快活。
        - id: ch03-b09
          speaker: narrator
          text: 几个钟头以后，海蒂已经在床上熟睡。爷爷爬上梯子，把灯放到她的床边，让灯光落在孩子身上。海蒂的双手仍旧合在胸前，仿佛做着祷告便睡着了。那张小脸满是平安和信赖，其中仿佛有什么正在向老人诉说。爷爷站在那里，一声不响地低头凝望了很久。最后，他自己也合起双手，垂下头，低声说出方才故事中儿子认错的话。
        - id: ch03-b10
          speaker: grandpa
          text: 父亲，我得罪了天，也得罪了你，不配再称为你的儿子。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 说完以后，爷爷一声不响，两颗大大的泪珠从他苍老的面颊上缓缓滚落下来。
    - id: ch04
      title: 星期日的钟声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一早，爷爷站在屋前，静静望着山岭和山谷。明亮的晨光洒遍四周，谷底传来早钟，鸟儿在枞树间唱着晨歌。爷爷回屋叫醒海蒂。太阳升起来了，他要孩子穿上最好的裙子，同自己去教堂。海蒂赶紧换好衣服。她下楼看见爷爷，却惊讶得站住了。她从没见过爷爷这副模样，那件带银纽扣的星期日礼服让老人格外精神。
        - id: ch04-b02
          speaker: heidi
          text: 爷爷，我从没见过您这样！您穿这身真好看！
          emotion: surprised
        - id: ch04-b03
          speaker: grandpa
          text: 你也很好看。走吧。
        - id: ch04-b04
          speaker: narrator
          text: 爷爷牵着海蒂走下山坡。四面八方的钟都响起来，他们越靠近山谷，钟声越响亮、越浑厚。海蒂欢喜地听着，觉得简直像在过盛大的节日。两人进入多夫里的教堂，在后排坐下时，会众已经到齐，赞美诗也唱起来了。可诗还没唱完，大家就互相碰着胳膊，悄声传话。
        - id: ch04-b05
          speaker: villagers
          text: 你看见了吗？阿尔姆大叔到教堂来了！
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 消息很快传遍教堂。妇人们频频回头，连赞美诗唱到哪里也找不着了。牧师开始讲道，大家才重新专心。他的话充满热诚和感恩，听的人深受打动，仿佛有一桩天大的喜事降临在所有人身上。礼拜结束，阿尔姆大叔牵着海蒂走出教堂，径直朝牧师家去。其余的人好奇地望着他的背影，有些人甚至跟在后面，要亲眼看看老人究竟会不会进门。他真的走了进去。大家便聚成一群群，一边议论这件怪事，一边盯紧牧师家的门。他们猜不出老人为何下山，更不知道他出来时会怒气冲冲、同人争吵，还是会平静地结束这场会面。
        - id: ch04-b07
          speaker: villagers
          text: 他也许没我们想的那么坏。瞧他牵小姑娘的手，多么当心。那些传闻本来就太夸张。他要是真坏透了，怎么敢进牧师家？
        - id: ch04-b08
          speaker: miller
          text: 我早就说过。要是爷爷又狠心又刻薄，孩子见了他就害怕，哪个孩子会舍得离开吃喝丰足、样样都好的地方，逃回他身边？
        - id: ch04-b09
          speaker: narrator
          text: 大家的口气渐渐亲切起来。妇人们也走上前，把从彼得和祖母那里听来的事全讲了一遍。到最后，所有人都守在外面，倒像正在等候一位离开他们许久、如今终于归来的老朋友。屋里，阿尔姆大叔敲响了书房的门。牧师走出来迎接，神情并不惊讶，仿佛早已料到老人会来。他大概方才在教堂里看见了阿尔姆大叔。牧师热情地伸出手，这样友善的欢迎完全出乎老人意料，他一时竟说不出话来，过了一会儿才定下心神，说明自己的来意。
        - id: ch04-b10
          speaker: grandpa
          text: 牧师，请您忘记上次到山上时，我说过的那些话。您的劝告出于好意，我却固执地反对，请别因此怨恨我。您是对的，错的是我。我决定听您的劝告，冬天在多夫里找个住处。孩子还不够强健，受不住山上的严寒。这里的人若不信任我，那也是我自己的过错。不过我相信，您不会这样待我。
        - id: ch04-b11
          speaker: narrator
          text: 牧师慈祥的眼睛因喜悦发亮。他紧紧握住老人的手。
        - id: ch04-b12
          speaker: pastor
          text: 邻居，你来我这里以前，已经走进了真正该去的教堂。我实在太高兴了。你重新回到我们中间，绝不会后悔。在我这里，你永远是亲爱的朋友和邻居。我盼着同你共度愉快的冬夜，也会替小姑娘找几个可爱的朋友。
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: 牧师慈爱地摸摸海蒂卷曲的头发，又牵着她，同老人一起走向门口。一直来到屋外，他才依依不舍地同阿尔姆大叔握手告别。等在外面的人全看见了，那模样就像牧师正在送别自己最要好的朋友。门才关上，会众便一拥而上，争着同老人握手。伸来的手实在太多，阿尔姆大叔竟不知道先握哪一只。有人说，看见他重新回来真高兴；有人说，早就盼着再同他好好聊聊。各种亲切的问候从四面传来。老人告诉大家，自己打算冬天搬回多夫里的旧居。人群里立刻爆发出一片欢呼。听那声音，仿佛他是全村最受爱戴的人，仿佛他不在的这些年，大家简直不知道该怎样生活。
        - id: ch04-b14
          speaker: narrator
          text: 大部分朋友都陪着祖孙俩走了一段山路。告别时，每个人都要爷爷亲口答应，下次下山一定到自己家坐坐。人们终于一个个离开，只剩下爷爷和海蒂。老人站在那里，久久望着渐渐远去的身影。他脸上亮着光，仿佛心里的阳光映了出来。海蒂用清澈安定的眼睛仰望他，说爷爷今天变得越来越好看，她从没见过他这个样子。
        - id: ch04-b15
          speaker: grandpa
          text: 是吗？海蒂，今天我得到的快乐，其实是我不配拥有的。我也没想过，人还能这样快乐。同上帝和世人和好，真好。上帝把你送到我的小屋，对我实在太好了。
          emotion: happy
    - id: ch05
      title: 老朋友与新消息
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 到了彼得家，爷爷推开门，径直走了进去。他向祖母问早安，还说秋风到来以前，屋子有几处得再修补一下。祖母听出是阿尔姆大叔，惊喜得几乎不敢相信。她说自己有生之年竟能见到这一天，如今终于可以亲口感谢老人从前为她做过的一切。她一连两次祝愿上帝报答他，又向他伸出颤抖的手。爷爷热诚地握住那只手，她却仍然没有放开，因为心里还有一件最要紧的事没有说。
        - id: ch05-b02
          speaker: grandmother
          text: 我心里还有一件事，一定要求您。要是我曾经伤害过您，请别把孩子再次送走，至少等我埋进草地下以后再说。您不知道，她对我有多要紧！
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: 海蒂早已站在祖母身边，老人把她紧紧搂进怀里。
        - id: ch05-b04
          speaker: grandpa
          text: 别怕，祖母。我不会用这件事惩罚您，也不会惩罚自己。如今我们都在一起，愿上帝保佑我们长久这样生活。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: 布丽吉塔把爷爷拉到屋里一角，让他看那顶插着羽毛的帽子。她从头解释了一遍帽子为什么会留在这里，又说这样贵重的东西是孩子的，自己当然不能拿走。爷爷朝海蒂望去，脸上没有一点不悦。他告诉布丽吉塔，帽子本来就是海蒂的。孩子若不想再戴，自然有权这样决定，也有权把它送给别人，所以她尽管收下。
        - id: ch05-b06
          speaker: brigitta
          text: 这顶帽子少说也值十先令！海蒂从法兰克福带回的福气可真多。我有时想，把彼得也送去住一阵，也许对他有好处。您觉得呢？
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 爷爷眼中闪过快活的笑意。他觉得彼得去一趟也不会有什么坏处，只是最好等个合适的机会再动身。恰在这时，他们谈论的彼得本人冲进屋来。他显然急得不得了，进门时脑袋重重撞在门上，震得屋里样样东西都跟着发响。他停下来直喘粗气，手里却一直举着一封信。这可是从未有过的大事。信封上清清楚楚写着海蒂的名字，是刚送到多夫里邮局来的。大家立刻围着桌子坐好，都想听听里面写了什么。海蒂马上拆开信，毫不迟疑地念起来。
        - id: ch05-b08
          speaker: narrator
          text: 信是克拉拉写的。海蒂离开以后，家里变得那么冷清，她简直不知道日子该怎么熬。她终于说服父亲，今年秋天带她到拉加茨的温泉疗养。老夫人也已经安排好，到时会去那里同他们会合。她们两个人都盼着看望海蒂和爷爷。老夫人还托克拉拉带话，说海蒂把小面包带给祖母，做得完全正确。为了不让老人只干吃面包，她又寄来了一些咖啡，现在已经在路上。等她秋天来到阿尔姆山，还希望海蒂亲自带她去见见这位老朋友。
        - id: ch05-b09
          speaker: narrator
          text: 大家听完这些消息，又惊讶又欢喜。每个人都有许多话要谈，也有许多事要问，连爷爷也没有注意时间正在过去。想到将来的那些日子，人人都满怀期待；而这一天已经发生的重逢，更叫他们快活。祖母说，世上最幸福的事，就是一位老朋友仍像从前一样回来问候。那会安慰人的心，让人相信总有一天，自己爱过的一切都会重新赐回来。她请阿尔姆大叔过不了多久就再来，又问海蒂是不是明天便会来看她。
        - id: ch05-b10
          speaker: narrator
          text: 爷爷和海蒂都郑重答应，一定会照办。大家这才发现，已经到了该离开的时候。祖孙俩告别祖母，沿山路往回走。早晨下山时，四方的钟声曾一路迎接他们。如今他们朝山上的小屋慢慢攀登，宁静的晚钟又陪伴着他们走完归途。夕阳已经低垂，小屋静静沐浴在温暖的余晖里，连它也显出一派安宁的星期日气象。
        - id: ch05-b11
          speaker: narrator
          text: 不过，这个故事里的快乐还没有结束。等今年秋天老夫人来到这里，海蒂和祖母还会遇见许多新的欢乐与意想不到的惊喜。到那时，干草阁里毫无疑问会摆上一张真正的床。因为老夫人无论走到哪里，总能很快把那里安排得井井有条。从屋外到屋里，从大事到小事，没有一样会被她遗漏。
