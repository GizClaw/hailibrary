  chapters:
    - id: ch01
      title: Light for Grandmother
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Heidi waited beneath the swaying fir trees while Grandfather got ready to go down the mountain with her. First they would stop at Grandmother's cottage. Then he would continue to Dorfli for Heidi's trunk. She longed to know whether Grandmother had enjoyed the white bread, and she could hardly wait to see and hear her again. Yet waiting no longer felt tiresome. Heidi could never listen long enough to the familiar voice of the trees. She could never breathe in too much of the sweet air drifting from the green pastures, where golden-headed flowers glowed in the sun like a feast spread before her eyes. At last Grandfather came out, looked around, and called to her.
        - id: ch01-b02
          speaker: grandfather
          text: All right. We're ready to go.
        - id: ch01-b03
          speaker: narrator
          text: It was Saturday, the day Grandfather always made everything clean and orderly, both inside the hut and outdoors. That morning he had devoted himself to the work so he would be free to walk with Heidi in the afternoon. By the time they set out, the whole place was spotless and arranged exactly as he liked it. They parted at Grandmother's cottage. Grandfather continued toward Dorfli, while Heidi ran eagerly inside. Grandmother heard the familiar footsteps coming and greeted her the instant she crossed the threshold.
        - id: ch01-b04
          speaker: grandmother
          text: Is that you, child? Have you really come back?
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: Grandmother caught Heidi's hand and held it tightly in her own. She still seemed afraid the child might be torn away from her again. Then she had to tell Heidi all about the white bread. She had enjoyed it so much, and after being able to eat it, she already felt stronger.
        - id: ch01-b06
          speaker: brigitta
          text: If Mother could eat bread like that for one week, I'm sure some of her strength would return. But she's so afraid the rolls will run out that she's eaten only one.
        - id: ch01-b07
          speaker: narrator
          text: Heidi listened and thought for a moment. Suddenly, an answer came to her.
        - id: ch01-b08
          speaker: heidi
          text: I know what I'll do, Grandmother! I'll write to Clara. She'll send just as many rolls again, or maybe twice as many. I had a great big pile in my wardrobe, and when they were taken away, Clara promised to replace every one. I know she'll do it.
        - id: ch01-b09
          speaker: brigitta
          text: That's a fine idea. But the rolls would turn hard and stale. The baker in Dorfli makes white rolls. If only we could buy one of his now and then. I can barely pay for the black bread as it is.
        - id: ch01-b10
          speaker: narrator
          text: That gave Heidi an even better idea. Her face lit up, and she skipped around the room.
        - id: ch01-b11
          speaker: heidi
          text: Oh, I have lots of money, Grandmother! Now I know what to do with it. You'll have one fresh white roll every day and two on Sundays. Peter can bring them up from Dorfli.
          emotion: happy
        - id: ch01-b12
          speaker: grandmother
          text: No, no, child. I can't allow that. The money wasn't given to you for this. You must give it to Grandfather and let him decide how it should be spent.
        - id: ch01-b13
          speaker: narrator
          text: Heidi would not give up her plan. She kept jumping about and happily repeating that Grandmother would have a roll every day and grow strong again.
        - id: ch01-b14
          speaker: heidi
          text: Oh, Grandmother, if you get strong, maybe everything will become light for you again. Perhaps it's dark only because you're weak.
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: Grandmother said nothing. She did not want to spoil Heidi's pleasure. Then Heidi noticed the old hymnbook and had another idea.
        - id: ch01-b16
          speaker: heidi
          text: Grandmother, I can read now. Would you like me to read you a hymn from your old book?
        - id: ch01-b17
          speaker: grandmother
          text: Oh, yes! But can you truly read now, child?
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: Heidi had already climbed onto a chair and taken down the book. A cloud of dust rose from it because no one had touched it for so long. She wiped it clean, sat on a stool beside Grandmother, and asked which hymn she wanted.
        - id: ch01-b19
          speaker: grandmother
          text: Choose whichever one you like, child.
        - id: ch01-b20
          speaker: narrator
          text: Grandmother pushed aside her spinning wheel and waited eagerly. Heidi turned the pages, softly reading a line here and there to herself. Then she found one.
        - id: ch01-b21
          speaker: heidi
          text: Here's a hymn about the sun, Grandmother. I'll read this one.
        - id: ch01-b22
          speaker: narrator
          text: Heidi began, and her voice grew warmer with every verse.
        - id: ch01-b23
          speaker: heidi
          text: |-
            The morning breaks,
            And warm and bright
            The earth lies still
            In the golden light—
            For Dawn has scattered the clouds of night.

            God's handiwork
            Is seen around,
            Things great and small
            To His praise abound—
            Where are the signs of His love not found?

            All things must pass,
            But God shall still
            With steadfast power
            His will fulfill—
            Sure and unshaken is His will.

            His saving grace
            Will never fail,
            Though grief and fear
            The heart assail—
            O'er life's wild seas He will prevail.

            Joy shall be ours
            In that garden blest,
            Where after storm
            We find our rest—
            I wait in peace—God's time is best.
        - id: ch01-b24
          speaker: narrator
          text: Grandmother sat with her hands folded. Tears ran down her cheeks, but her face held a joy beyond anything Heidi had ever seen there before. Both the tears and that wonderful joy remained as Heidi reached the end of the hymn. Then Grandmother pleaded with the child to read again.
        - id: ch01-b25
          speaker: grandmother
          text: Read it once more, Heidi. Just once more.
        - id: ch01-b26
          speaker: narrator
          text: Heidi gladly repeated the final verse.
        - id: ch01-b27
          speaker: heidi
          text: |-
            Joy shall be ours
            In that garden blest,
            Where after storm
            We find our rest—
            I wait in peace—God's time is best.
        - id: ch01-b28
          speaker: grandmother
          text: Oh, Heidi, that brings light into my heart. What comfort you've given me!
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: Grandmother kept repeating the joyful words to herself. Heidi beamed with happiness and could not take her eyes from the old woman's face. Never before had it looked like that. The familiar troubled expression had disappeared. Peace and joy shone there instead, as though Grandmother could already see with clear new eyes into the garden of Paradise.
    - id: ch02
      title: The Way Back
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A knock sounded at the window. Heidi looked up and saw Grandfather motioning for her to come home with him. Before leaving, she promised to return the next day. Even if she went out with Peter, she would spend only half the day with him. The thought of making Grandmother's world light and happy again pleased her more than anything, even a day among the sunny flowers and goats. At the door, Brigitta hurried after her with the dress and hat she had left behind. Heidi laid the dress over her arm. Grandfather had already seen it, so she did not mind carrying it home. But she firmly refused the hat. Brigitta could keep it. Heidi never meant to put it on her head again.
        - id: ch02-b02
          speaker: narrator
          text: As soon as she joined Grandfather, Heidi poured out everything that had happened. She told him that fresh white bread could come from Dorfli every day if there was money, and that Grandmother had suddenly seemed stronger and happier, with light shining in her face. Then Heidi returned to the rolls.
        - id: ch02-b03
          speaker: heidi
          text: Grandfather, if Grandmother won't take my money, will you give it back to me? Then I can give Peter enough to buy one roll every day and two on Sundays.
        - id: ch02-b04
          speaker: grandfather
          text: What about buying a bed? You could have a proper one, and there would still be plenty left for bread.
        - id: ch02-b05
          speaker: narrator
          text: Heidi kept asking until he agreed. She told him she slept much better on her hay than she ever had on the fine bed with pillows in Frankfurt.
        - id: ch02-b06
          speaker: grandfather
          text: The money belongs to you. Spend it as you please. It will buy Grandmother bread for years.
        - id: ch02-b07
          speaker: narrator
          text: Heidi cried out with joy at the thought of what this meant. Grandmother would never again have to make do with hard black bread when she needed something soft to eat.
        - id: ch02-b08
          speaker: heidi
          text: Oh, Grandfather, everything in our lives is happier than it has ever been!
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: Holding his hand, she sang and skipped along as lightly as a bird. Then she suddenly grew quiet.
        - id: ch02-b10
          speaker: heidi
          text: If God had brought me home as soon as I begged Him to, it all would have been different. I would have had only a little bread for Grandmother, and I wouldn't have learned to read the words that comfort her. God arranged everything much better than I could. It happened just as Grandmamma said. I'm so glad He didn't give me everything right away, even when I prayed and cried. I'll always pray the way she taught me, and I'll always thank Him. When He doesn't give me what I ask for, I'll remember Frankfurt and think, God must be planning something better. We'll pray every day, won't we, Grandfather? We won't forget Him again, or He might forget us.
        - id: ch02-b11
          speaker: grandfather
          text: And what if someone does forget Him?
        - id: ch02-b12
          speaker: heidi
          text: Then everything goes wrong. God lets people go wherever they choose. When they become poor and miserable and start crying, no one feels sorry for them. People say, “You ran away from God, so the One who could have helped you left you on your own.”
        - id: ch02-b13
          speaker: grandfather
          text: That's true, Heidi. Who taught you that?
        - id: ch02-b14
          speaker: heidi
          text: Grandmamma explained it to me.
        - id: ch02-b15
          speaker: narrator
          text: Grandfather walked in silence for a while. Then he spoke as if he had been following a thought of his own.
        - id: ch02-b16
          speaker: grandfather
          text: Once it happens, it lasts forever. No one can go back. If God has forgotten someone, that person stays forgotten.
        - id: ch02-b17
          speaker: heidi
          text: Oh, no, Grandfather! We can go back. Grandmamma told me so, and it's in the beautiful story in my book. You haven't heard it yet. We'll be home soon, and then I'll read it to you. You'll see how beautiful it is.
        - id: ch02-b18
          speaker: narrator
          text: In her eagerness to share the story, Heidi climbed the steep path faster and faster. The moment they reached the top, she let go of Grandfather's hand and ran into the hut. He swung a basket down from his shoulders. The trunk itself had been too heavy to carry up the mountain, so he had brought part of its contents in the basket. Then he settled onto his seat and began to think.
        - id: ch02-b19
          speaker: narrator
          text: Heidi soon raced outside with her book under her arm. She was delighted to find Grandfather already seated. In an instant she was beside him, opening the book to the story she had read so many times that its pages fell open by themselves.
        - id: ch02-b20
          speaker: heidi
          text: Good, Grandfather. You're all ready to listen.
        - id: ch02-b21
          speaker: narrator
          text: With deep feeling, Heidi read about a son who had once lived happily at home. He went into the fields with his father's flocks, wearing a fine cloak and leaning on a shepherd's staff as the sun went down, just as the picture showed. Then he decided he wanted his own property and money so that he could be his own master. He asked his father for his share, left home, and wasted everything he had. When nothing remained, he had to hire himself out to a man who had no flocks or fields like his father's. He had only pigs. The son watched them in ragged clothes and had nothing to eat but the husks meant for the animals. Then he remembered his old, happy life at home. He remembered how kindly his father had treated him and how ungrateful he had been. Sorrow and longing made him weep.
        - id: ch02-b22
          speaker: heidi
          text: He thought, “I'll get up and go to my father. I'll say, ‘Father, I'm not worthy to be called your son. Please make me one of your hired servants.’” Then, while he was still far from home, his father saw him.
        - id: ch02-b23
          speaker: narrator
          text: Heidi stopped reading.
        - id: ch02-b24
          speaker: heidi
          text: What do you think happens now, Grandfather? Do you think his father is still angry? Will he say, “I warned you”? Listen to what happens next.
        - id: ch02-b25
          speaker: narrator
          text: Heidi read on. The father saw his son and felt compassion for him. He ran to meet him, threw his arms around him, and kissed him.
        - id: ch02-b26
          speaker: heidi
          text: The son said, “Father, I have sinned against heaven and against you. I'm not worthy to be called your son.” But the father called to his servants. “Bring the finest robe and put it on him. Put a ring on his hand and shoes on his feet. Prepare the fattened calf, and let us celebrate. My son was dead, and now he is alive. He was lost, and now he is found.” So they began to celebrate.
        - id: ch02-b27
          speaker: heidi
          text: Isn't that a beautiful story, Grandfather?
        - id: ch02-b28
          speaker: narrator
          text: Grandfather remained silent, though Heidi had expected him to show his pleasure and surprise.
        - id: ch02-b29
          speaker: grandfather
          text: You're right, Heidi. It is a beautiful story.
        - id: ch02-b30
          speaker: narrator
          text: He looked so serious when he answered that Heidi fell silent too. She sat quietly studying the pictures. After a while, she gently pushed the open book toward him and pointed to the returned son. In the picture, the young man stood beside his father in fresh clothes, welcomed once more as one of his own sons.
        - id: ch02-b31
          speaker: heidi
          text: Look how happy he is there.
        - id: ch02-b32
          speaker: narrator
          text: Several hours later, Heidi lay fast asleep in her hay bed. Grandfather climbed the ladder and set his lamp nearby so its light fell across the sleeping child. Her hands were still folded, as if sleep had overtaken her while she said her prayers. An expression of peace and trust rested on her small face. Something in that peaceful look seemed to appeal to him. For a long time he stood gazing down at her without speaking. At last he too folded his hands and bowed his head.
        - id: ch02-b33
          speaker: grandfather
          text: Father, I have sinned against heaven and before You. I am not worthy to be called Your son.
          emotion: sad
        - id: ch02-b34
          speaker: narrator
          text: Two large tears slowly rolled down the old man's cheeks as he stood beside her bed.
    - id: ch03
      title: Sunday Bells
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Early the next morning, Grandfather stood outside the hut and quietly looked around. Fresh sunlight lay across mountain and valley. A few early bells sounded from below, and birds sang in the fir trees. He stepped inside and called up to Heidi.
        - id: ch03-b02
          speaker: grandfather
          text: Come along, Heidi! The sun is up. Put on your best dress. We're going to church together.
        - id: ch03-b03
          speaker: narrator
          text: Heidi dressed quickly. This was such an unusual invitation from Grandfather that she did not want to waste a moment. She put on her fine Frankfurt dress and came downstairs. The sight of Grandfather stopped her in astonishment.
        - id: ch03-b04
          speaker: heidi
          text: Why, Grandfather! I've never seen you look like this. You're wearing the coat with the silver buttons. You look so handsome in your Sunday coat!
          emotion: surprised
        - id: ch03-b05
          speaker: grandfather
          text: And you look fine too. Come on now.
        - id: ch03-b06
          speaker: narrator
          text: He took her hand, and together they walked down the mountainside. Bells rang from every direction, growing louder and fuller as they approached the valley. Heidi listened with delight.
        - id: ch03-b07
          speaker: heidi
          text: Listen, Grandfather! It sounds like a great festival!
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: The congregation had already gathered, and the singing had begun when Heidi and Grandfather entered the church at Dorfli. They quietly took seats in the back. But before the hymn was over, one person after another noticed them. Neighbors nudged each other, heads turned, and whispers moved through the church.
        - id: ch03-b09
          speaker: villager_1
          text: Look! Alm-Uncle is here in church!
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: Soon everyone in the church knew Alm-Uncle was there. The women turned around so often to stare that they lost their place in the hymn and could no longer follow the singing. But when the sermon began, the whole congregation became more attentive. The pastor spoke with such warmth and thankfulness that his words touched everyone who heard them. It felt as though some great joy had come to them all.
        - id: ch03-b11
          speaker: narrator
          text: When the service ended, Grandfather took Heidi's hand and headed for the pastor's house. The others watched curiously. Some even followed to see whether he went inside. He did. Then they gathered in groups near the door, wondering why the old man had come down and whether he would emerge angry and quarrelsome or peaceful.
        - id: ch03-b12
          speaker: villager_1
          text: Maybe Alm-Uncle isn't as bad as we thought. Look how carefully he holds the child's hand.
        - id: ch03-b13
          speaker: villager_2
          text: I've always thought people made him sound worse than he is. If he were truly so bad, he wouldn't dare go into the pastor's house.
        - id: ch03-b14
          speaker: miller
          text: Didn't I tell you that from the start? What child would leave a home with the best food and everything she needed, just to run back to a cruel grandfather she feared?
        - id: ch03-b15
          speaker: narrator
          text: The villagers began to feel friendly toward Alm-Uncle. The women came forward and repeated everything they had heard from Peter and Grandmother about Heidi's life on the mountain. Before long, the whole group stood watching the pastor's door as if an old friend, missing from among them for many years, were about to return.
        - id: ch03-b16
          speaker: narrator
          text: Inside the pastor's house, Grandfather knocked on the study door. The pastor came out and greeted him as though he had been expecting this visit. Perhaps he had already caught sight of the old man in church. He shook Grandfather's hand warmly. Such a friendly welcome was more than Grandfather had expected, and at first he could not speak at all. At last, he gathered himself and found the words.
        - id: ch03-b17
          speaker: grandfather
          text: Pastor, I've come to ask you to forget what I said when you visited me. Please don't hold my stubbornness against me. Your advice was kindly meant. You were right, and I was wrong. I've decided to follow it and find a place in Dorfli for the winter. The child isn't strong enough for the bitter cold on the mountain. If people here distrust me, I know that's my own fault. But I'm sure you won't treat me that way.
        - id: ch03-b18
          speaker: narrator
          text: Pleasure shone in the pastor's kind eyes. He pressed Grandfather's hand with deep feeling.
        - id: ch03-b19
          speaker: pastor
          text: Neighbor, you entered the right church before you came into mine, and I couldn't be happier. You won't regret living among us again. You will always be welcome as my dear friend and neighbor. I look forward to many pleasant winter evenings together, and we'll find some good friends for the child as well.
          emotion: happy
        - id: ch03-b20
          speaker: narrator
          text: The pastor rested a kind hand on Heidi's curly head. Then he took her hand and walked with Grandfather all the way to the door. He did not say goodbye until they stood outside. The people waiting nearby could all see him shake Grandfather's hand as warmly, and as reluctantly, as if he were parting from his closest friend.
        - id: ch03-b21
          speaker: narrator
          text: The door had barely closed before the whole congregation came forward. Everyone wanted to shake Grandfather's hand first, and so many hands reached for him that he did not know where to begin.
        - id: ch03-b22
          speaker: villager_1
          text: We're so glad to have you among us again!
          emotion: happy
        - id: ch03-b23
          speaker: villager_2
          text: I've been hoping we'd have another good talk someday.
          emotion: happy
        - id: ch03-b24
          speaker: narrator
          text: Greetings came from every side. When Grandfather said he planned to return to his old rooms in Dorfli for the winter, a chorus of pleasure rose around him. Anyone watching might have thought he was the best-loved man in Dorfli and that the villagers had hardly known how to live without him. Most of his friends walked partway up the mountain with him and Heidi. One by one they said goodbye, and each made him promise that the next time he came down, he would be sure to visit.
        - id: ch03-b25
          speaker: narrator
          text: At last Grandfather and Heidi stood alone, watching the others walk away. A light shone on his face as though it came from sunshine within his heart. Heidi looked up at him with her clear, steady eyes.
        - id: ch03-b26
          speaker: heidi
          text: Grandfather, you keep looking nicer and nicer today. I've never seen you like this before.
        - id: ch03-b27
          speaker: grandfather
          text: Do I? Well, yes, Heidi. Today I'm happier than I deserve, and happier than I ever thought I could be. It is good to be at peace with God and with people. God was good to me when He sent you to my hut.
          emotion: happy
    - id: ch04
      title: Old Friends and New Joys
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When they reached Peter's home, Grandfather opened the door and went straight inside.
        - id: ch04-b02
          speaker: grandfather
          text: Good morning, Grandmother. I think we need to do a little more patching before the autumn winds arrive.
        - id: ch04-b03
          speaker: grandmother
          text: Dear God, it's Uncle! I never thought I would live to see this. Now I can thank you for all you've done for me. May God reward you! May God reward you!
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: She reached out a trembling hand. Grandfather clasped it warmly, and she held on while she continued.
        - id: ch04-b05
          speaker: grandmother
          text: There's something heavy on my heart. I have to beg you. If I've ever hurt you, please don't punish me by sending the child away again before I lie beneath the grass. You don't know what Heidi means to me!
          emotion: fearful
        - id: ch04-b06
          speaker: narrator
          text: She drew Heidi close. The child had already taken her usual place beside Grandmother.
        - id: ch04-b07
          speaker: grandfather
          text: Don't be afraid, Grandmother. I won't punish you or myself that way. We're all together now. May God keep us so for a long time.
          emotion: calm
        - id: ch04-b08
          speaker: narrator
          text: Brigitta drew Grandfather aside into a corner of the room and showed him the hat with its feathers. She explained exactly how it had come to be there. Of course, she added, she could not possibly accept such a valuable thing from a child. Grandfather looked toward Heidi, but there was not the least displeasure in his face.
        - id: ch04-b09
          speaker: grandfather
          text: The hat is hers. If she doesn't want to wear it, she has every right to give it to you. Please keep it.
        - id: ch04-b10
          speaker: narrator
          text: Brigitta was delighted. She held up the hat for everyone to admire.
        - id: ch04-b11
          speaker: brigitta
          text: Why, it must be worth more than ten shillings! And just think of all the good Heidi brought home from Frankfurt. Sometimes I wonder whether Peter ought to spend a little time there. What do you think, Uncle?
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: A merry look came into Grandfather's eyes. A stay in Frankfurt might do Peter no harm, he thought, but the boy had better wait for a good opportunity before setting off. At that very moment, the person they were discussing rushed through the door. Peter was in such a hurry that he struck his head hard against it, making everything in the room rattle. Gasping and breathless, he came to a stop and held out a letter.
        - id: ch04-b13
          speaker: narrator
          text: A letter was a great event in that house, for nothing like it had ever happened before. This one had been delivered to the post office in Dorfli, and it was addressed to Heidi. Everyone sat down around the table to hear what it said. Heidi opened the envelope at once and began reading without hesitation. The letter was from Clara.
        - id: ch04-b14
          speaker: clara
          text: Dear Heidi, the house has been terribly dull since you left, and I hardly know what to do with myself. At last I persuaded Papa to take me to the baths at Ragatz this autumn. Grandmamma will meet us there, and we both look forward to visiting you and your grandfather.
        - id: ch04-b15
          speaker: narrator
          text: Clara also passed along a message from Grandmamma.
        - id: ch04-b16
          speaker: clara
          text: Grandmamma says you were quite right to take the rolls to Grandmother. She doesn't want your friend to eat them dry, so some coffee is already on its way. When Grandmamma visits the Alm this autumn, she hopes you'll take her to meet your old friend.
        - id: ch04-b17
          speaker: narrator
          text: Everyone cried out with pleasure and surprise at the news. There was so much to discuss and so many questions to ask that even Grandfather failed to notice the hours passing. They all delighted in thinking about the happy days that would come with the autumn visit. Yet the meeting that had taken place that very day gave them even greater joy.
        - id: ch04-b18
          speaker: grandmother
          text: Nothing brings more happiness than an old friend returning and greeting us as before. It comforts the heart and makes us trust that one day everything we have loved will be restored to us. You'll come again soon, won't you, Uncle? And you'll come tomorrow, child?
        - id: ch04-b19
          speaker: narrator
          text: Grandfather and Heidi faithfully promised that they would come again. Then it was time for the little gathering to break up. Bells had greeted the two of them when they traveled down the mountain that morning. Now peaceful evening chimes accompanied them as they climbed back toward the hut. It stood bathed in the low light of the setting sun and looked as peaceful and special as Sunday itself.
        - id: ch04-b20
          speaker: narrator
          text: When Grandmamma comes in the autumn, still more joys and surprises will await Heidi and Grandmother. There will surely be a proper bed in the hayloft, because wherever Grandmamma goes, she soon sets everything right, both outside and in.
