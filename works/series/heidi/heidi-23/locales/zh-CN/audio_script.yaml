audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandfather:
      display_name: 外公
      tts: {delivery: "简短沉稳，粗粝中渐渐透出关怀", timbre: 低沉厚实, pace: 不紧不慢, pitch: 低音}
    clara:
      display_name: 克拉拉
      tts: {delivery: "温柔友善，带着久病女孩的安静和机敏", timbre: 轻柔清亮, pace: 从容自然, pitch: 中高音}
    grandmamma:
      display_name: 奶奶
      tts: {delivery: "慈爱爽朗，机敏风趣，说话亲切而有主见", timbre: "温暖明亮，带着年长女性的柔和质感", pace: "从容自然，劝慰时舒缓", pitch: 中音}
    sesemann:
      display_name: 赛赛曼先生
      tts: {delivery: "爽直果断，诙谐中带着一家之主的威严", timbre: 明朗沉稳, pace: 从容有力, pitch: 中低音}
    baker:
      display_name: 面包师
      tts: {delivery: "爱议论，话说得笃定而响亮", timbre: 粗实明朗, pace: 自然利落, pitch: 中音}
    brigitta:
      display_name: 布丽吉塔
      tts: {delivery: "操心而直率，语气朴素家常", timbre: 温厚朴实, pace: 适中, pitch: 中音}
    grandmother:
      display_name: 奶奶
      tts: {delivery: "慈爱宽厚，话语缓慢而体贴", timbre: 苍老柔和, pace: 舒缓, pitch: 中低音}
    doctor:
      display_name: 医生
      tts: {delivery: "亲切睿智，轻松时幽默，诊断时坚定", timbre: 温暖清亮, pace: 平稳自然, pitch: 中音}
  chapters:
    - id: ch01
      title: 奶奶上山
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 奶奶来信说，自己第二天一定上山。一早，彼得就把信送到了小屋。外公和两个孩子已经站在外面，羊儿们也等着出发。晨风清清爽爽，羊儿顽皮地摇着头。海蒂和克拉拉一边摸它们，一边祝它们一路愉快。外公看看两个孩子红润精神的脸，再看看壮健的羊群，满意地笑了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得走近时，脚步却越来越慢。他把信递给外公，忽然受惊似的转身就走，还匆匆回头看了一眼，好像真有什么在后面追他。接着，他猛地一跳，朝山上飞奔而去。
        - id: ch01-b03
          speaker: heidi
          text: 爷爷，彼得怎么老像那个怕人拿棍子追的土耳其大汉？他也是回过头，摇摇脑袋，然后一下跳开。
        - id: ch01-b04
          speaker: grandfather
          text: 没准儿他觉得，自己该挨的那根棍子正在后面追呢。
        - id: ch01-b05
          speaker: narrator
          text: 彼得一口气跑过第一段山坡，等大家看不见他了才停下。他疑神疑鬼地四处张望，忽然又惊跳起来，猛然回头，好像有人揪住了他的后颈。他时刻都在等法兰克福的警察从灌木或树篱后扑出来。越等越怕，越怕越难受，心里一刻也安静不下来。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂忙着收拾小屋。奶奶要来，她非得把每样东西都弄得干干净净、整整齐齐。克拉拉看她跑来跑去，只觉得又有趣又好玩。上午很快过去，两个孩子换好衣服，并肩坐在屋外的长凳上等客人。
        - id: ch01-b07
          speaker: narrator
          text: 外公从山上采回一大束蓝龙胆，拿来给她们看。花朵在晨光里闪闪发亮，两个孩子欢喜地赞叹了好一阵。外公把花拿进屋，海蒂却隔一会儿就从凳子上跳起来，看看奶奶到了没有。
        - id: ch01-b08
          speaker: narrator
          text: 终于，一支小队伍沿着山路弯弯曲曲地上来了，次序和海蒂猜的一模一样。向导在最前面，奶奶骑着白马跟在后面，最后还有一个脚夫，背着沉甸甸的大包袱。奶奶上山，披肩和毯子总要带得足足的。
        - id: ch01-b09
          speaker: narrator
          text: 奶奶到了山顶，骑在马上低头一看，两个孩子竟并排坐在长凳上。她急忙下马。
        - id: ch01-b10
          speaker: grandmamma
          text: 这是怎么回事？克拉拉，你怎么没躺在椅子里？你们到底在做什么呀？
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 她还没走到跟前，又惊讶得举起双手。
        - id: ch01-b12
          speaker: grandmamma
          text: 真的是你吗，我的孩子？你的脸颊又圆又红，我简直认不出你了！
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 奶奶快步上前，正要拥抱克拉拉，海蒂已经从凳子上跳下来。克拉拉把手搭在她肩上，两个人若无其事地一起往前走。奶奶吓了一跳，还以为海蒂又想出了什么从没听说过的冒险办法。
        - id: ch01-b14
          speaker: narrator
          text: 可克拉拉是真的站得笔直，也真的稳稳走在海蒂身边。两个孩子转过身，红润的脸上都带着灿烂的笑。奶奶又哭又笑地跑过去，抱完克拉拉，又抱海蒂，再把克拉拉搂进怀里。她欢喜得一句话也说不出来。
        - id: ch01-b15
          speaker: narrator
          text: 奶奶这才看见外公站在长凳旁，微笑着望着她们。她挽起克拉拉的胳膊，一路不停地惊叹，带她走到老人面前，然后紧紧握住外公的双手。
        - id: ch01-b16
          speaker: grandmamma
          text: 亲爱的大叔，我们要怎么谢您才够？这全是您的功劳！您这样照顾她，守着她……
          emotion: happy
        - id: ch01-b17
          speaker: grandfather
          text: 也有上帝赐下的阳光，还有山里的空气。
        - id: ch01-b18
          speaker: clara
          text: 还有我喝的好羊奶呢！奶奶，您绝对想不到我喝了多少，而且可好喝了。
          emotion: happy
        - id: ch01-b19
          speaker: grandmamma
          text: 看你这两边脸颊，我就知道了。你又结实又丰满，个子也长高了，我真快认不出你啦。我从来不敢盼，也没想过能看见你变成这样。我怎么都看不够，到现在还不敢相信这是真的。可我得马上给你爸爸发电报，让他立刻从巴黎过来。我先不告诉他原因，这会是他一生中最大的幸福。大叔，我该去哪儿发电报？刚才那些人已经走了吗？
        - id: ch01-b20
          speaker: grandfather
          text: 已经走了。你要是着急，我可以把彼得叫来，让他替你送下去。
        - id: ch01-b21
          speaker: narrator
          text: 奶奶连忙道谢。她恨不得立刻把好消息告诉儿子，一天也不想耽搁。外公走开几步，把手指放进嘴里，吹出一声响亮的口哨。岩石间的回音都醒了，一声声传向远处。
        - id: ch01-b22
          speaker: narrator
          text: 没过几分钟，彼得就跑下山来。他认得外公的哨声，可赶到时脸白得像鬼，以为外公要把他交出去。没想到，外公只递给他一张写好的纸，叫他立刻送去多尔夫里的邮局，费用以后再付。钱不能先给彼得，经他手的事太多了，不大稳妥。
        - id: ch01-b23
          speaker: narrator
          text: 彼得拿着纸走了，心里暂时松了些。外公叫他不是为了交人，看来警察还没到。
        - id: ch01-b24
          speaker: narrator
          text: 大家终于安心围坐在屋前吃午饭，又把这些日子发生的事一样样讲给奶奶听。外公每天怎样先扶克拉拉站起来，再让她慢慢挪动双脚。那天大家商量好要一起上山，躺椅却让风吹得不见了。克拉拉那么想去看花，只好试着站起来走路，就这样迈出了第一步。从那以后，外公天天陪她练习，她也一天比一天走得更稳、更远。
        - id: ch01-b25
          speaker: grandmamma
          text: 这怎么可能！我真不敢相信自己不是在做梦。我们真的都醒着，真的坐在高山小屋旁吗？眼前这个脸蛋圆圆、健健康康的孩子，真是从前那个苍白病弱的克拉拉吗？
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: 奶奶不断惊叹，也不断感激，讲故事的人只好一次次停下来。海蒂和克拉拉精心准备的惊喜实在太成功了，两个孩子快活得怎么也静不下来。
    - id: ch02
      title: 山路上的陌生人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在这时，办完巴黎事务的赛赛曼先生也准备给大家一个惊喜。一个阳光明媚的早晨，他没有向母亲透露半个字，便登上火车，当天赶到巴塞尔。第二天一早，他又继续赶路。整个夏天没见女儿，他突然思念得厉害，非马上见到她不可。
        - id: ch02-b02
          speaker: narrator
          text: 他到拉加茨时，母亲刚离开几个钟头。听说她当天上山了，他立刻雇车赶往迈恩费尔德。到了那里，又得知马车还能一直驶到多尔夫里，他便叫车夫接着赶路。他早就听人说过，从村里步行到山上有多远，既然已经坐车到了这里，当然想把最下面这一段路也省下来。
        - id: ch02-b03
          speaker: narrator
          text: 可这最后一段山路还是又长又累。他走了半天，连小屋的影子也没看到，只记得别人反复说过，彼得家的屋子就在半山腰。四处都是登山人踩出的印子，窄路朝每个方向伸出去。赛赛曼先生开始怀疑自己走错了，也许那间屋子其实在山的另一边。
        - id: ch02-b04
          speaker: narrator
          text: 他想找个人问路，远近却看不到人，也听不见说话声。山风偶尔呼啸而过，昆虫在太阳下嗡嗡叫，一只小鸟站在孤零零的落叶松上快活地唱着。他停了一会儿，让清凉的风吹吹发热的脸。
        - id: ch02-b05
          speaker: narrator
          text: 忽然，有个人从山坡上飞奔下来，正是拿着电报的彼得。他没有走小路，而是直冲陡坡。赛赛曼先生看见了，便招手叫他过来。彼得胆怯地靠近，身子歪到一边，好像一条腿还能走，另一条只能拖在后面。
        - id: ch02-b06
          speaker: sesemann
          text: 快一点，小伙子！告诉我，这条路通不通往那位老人和海蒂的小屋？法兰克福来的客人是不是也在那里？
        - id: ch02-b07
          speaker: narrator
          text: 彼得只发出一声低低的惊叫，转身就逃。他慌得连摔几个跟头，蹦着，撞着，骨碌碌滚下山坡，简直和那张躺椅一模一样。好在他没有摔成碎片，只有那封电报撕成片片，四处飞散。
        - id: ch02-b08
          speaker: narrator
          text: 赛赛曼先生心想，山里人的胆子可真小。他认定是自己的陌生面孔吓坏了这个没见过世面的孩子。他看着彼得一路滚向山谷，过了几分钟，才重新上路。
        - id: ch02-b09
          speaker: narrator
          text: 彼得怎么也停不下来，一会儿翻滚，一会儿又以古怪的姿势倒栽葱。可身体挨的磕碰还不是最可怕的，真正抓住他的是心里的恐惧。那个问路的陌生人一定是法兰克福来的警察，绝不会错。
        - id: ch02-b10
          speaker: narrator
          text: 他一路滚到多尔夫里上方最后一片陡坡，身子被一丛灌木牢牢挂住，这才终于没有继续掉下去。彼得一动不动地躺了片刻，一边拼命喘气，一边想自己接下来到底该怎么办。就在这时，身边突然有人说话。
        - id: ch02-b11
          speaker: baker
          text: 滚得好！要是明天风再把一个吹下来，你们一个个都要像没缝牢的土豆袋，从山上撞到这里吗？
        - id: ch02-b12
          speaker: narrator
          text: 原来面包师干完一天闷热的活，正出来透气。他看见彼得像椅子一样一圈圈滚下来，笑得十分开心。彼得又吓了一跳，爬起来就往山上赶。他只想钻进自己的被窝藏好，可羊群还在高处，外公又严厉吩咐他快去快回。彼得最怕外公，怎么也不敢违抗。
        - id: ch02-b13
          speaker: narrator
          text: 他没有别的办法，只好一瘸一拐地往回走。刚才那一阵恐惧已经把心揪得发疼，从山坡上一路滚下来，身上也不知道磕碰了多少次。他再也跑不动，只能拖着沉重的脚步，哼哼唧唧地慢慢往山上爬。
        - id: ch02-b14
          speaker: narrator
          text: 赛赛曼先生经过第一间小屋，总算确定方向没错。他重新打起精神，走过漫长又疲惫的一段，终于看见了目的地。爷爷的小屋就在上方，深色的冷杉树梢正从屋顶后随风摇动。
        - id: ch02-b15
          speaker: narrator
          text: 最后一段陡坡就在眼前。再过一两分钟，他就能见到女儿了。一想到克拉拉会有多惊喜，他便暗暗高兴。可山上的人早已认出他，也正在准备一个他万万想不到的惊喜。
        - id: ch02-b16
          speaker: narrator
          text: 赛赛曼先生刚踏上屋前的空地，就有两个身影迎面走来。一个是身材高挑的金发姑娘，脸颊粉红，正靠着海蒂。海蒂乌黑的眼睛里，也跳动着喜悦的光。他猛然停下，怔怔望着她们，眼泪一下涌了出来。
        - id: ch02-b17
          speaker: narrator
          text: 往事全都回来了。克拉拉的母亲从前也是这个样子，也是金发姑娘，也有一张白里透红的秀美脸庞。赛赛曼先生简直不知道自己是醒着，还是在梦里。
        - id: ch02-b18
          speaker: clara
          text: 爸爸，您不认识我了吗？我们才分开一个夏天，我真的变了那么多？
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: 赛赛曼先生奔过去，一把搂住女儿。
        - id: ch02-b20
          speaker: sesemann
          text: 是啊，你真的变了！这怎么可能？我现在看到的是真的吗？真是我的小克拉拉吗？真的是你吗？
          emotion: surprised
        - id: ch02-b21
          speaker: narrator
          text: 他把女儿紧紧抱住，又退开一步，从头到脚仔细看了一遍，好像眼前的景象随时会消失。接着，他又把她搂进怀里，再一次松开手，确认站在眼前的真是自己的女儿。奶奶也走了过来。她很想亲眼看看，儿子发现这个奇迹以后，脸上会露出怎样的幸福。
        - id: ch02-b22
          speaker: grandmamma
          text: 怎么样，亲爱的儿子？你确实给了我们一个惊喜，可跟我们给你预备的相比，就不算什么了，这一点你得承认。现在快去向大叔问好吧，他可是我们最大的恩人。
          emotion: happy
        - id: ch02-b23
          speaker: narrator
          text: 奶奶亲昵地吻了吻儿子。
        - id: ch02-b24
          speaker: sesemann
          text: 当然。还有我们家的小客人，小海蒂。
        - id: ch02-b25
          speaker: narrator
          text: 他说着握住海蒂的手，亲切地看着她。海蒂站在克拉拉身边，脸颊也被山上的阳光染得红润明亮。
        - id: ch02-b26
          speaker: sesemann
          text: 回到山上的家，你还是这么健康快活吧？其实根本不用问。山上哪一朵蔷薇，也没有你的脸这样鲜艳。孩子，看见你这么好，我真高兴。
        - id: ch02-b27
          speaker: narrator
          text: 海蒂满心欢喜地抬头望着赛赛曼先生和善的脸。她还清楚记得，他从前待自己有多么好。如今山上又有这样大的幸福等着他，看见他终于亲眼发现这个奇迹，海蒂的心也跟着欢跳起来。奶奶领儿子去见外公。两个男人紧紧握手，赛赛曼先生说出发自内心的感激，也不停惊叹克拉拉身上的变化。奶奶则一个人绕到屋后，去看看那些古老的冷杉。
        - id: ch02-b28
          speaker: narrator
          text: 古老冷杉垂下长长的枝条，在树下留出一片空地。那里摆着一大丛深蓝色的龙胆，花朵鲜润明亮，像刚从山坡上冒出来，还在原地生长一样。奶奶完全陶醉在这片美丽中，不由得把双手合在一起。
        - id: ch02-b29
          speaker: grandmamma
          text: 太美了！海蒂，亲爱的孩子，快来看看！这是你特意替我摆的吗？真是美得出奇！
          emotion: happy
        - id: ch02-b30
          speaker: narrator
          text: 两个孩子一起跑来。
        - id: ch02-b31
          speaker: heidi
          text: 不是我放的，不过我知道是谁。
        - id: ch02-b32
          speaker: clara
          text: 奶奶，这些花长在山上时就是这样，那时候还要更美呢。可您猜猜，今天是谁把它们采回来的？
        - id: ch02-b33
          speaker: narrator
          text: 克拉拉笑得十分得意，奶奶差点以为花是她亲手采的，可那怎么可能呢？就在这时，冷杉后传来轻轻的窸窣声。彼得回来了。他远远看清外公身边站着谁，便绕了一大圈，想悄悄溜过去。
        - id: ch02-b34
          speaker: narrator
          text: 奶奶已经看见他，也认出了他。她以为这些花也许是彼得采的，而他害羞得想躲起来。那可不能让他就这么走掉，总要给他一点奖赏。
        - id: ch02-b35
          speaker: grandmamma
          text: 过来吧，孩子。到这里来，别害怕。
        - id: ch02-b36
          speaker: narrator
          text: 彼得吓得像石头一样，一动不动。经过这一整天的折磨，他已经没有半点抵抗的力气，脑子里只剩一句话，这下全完了。他头发根根竖起，脸色惨白，恐惧把整张脸都扭歪了。最后，他还是从冷杉后面走了出来。
        - id: ch02-b37
          speaker: grandmamma
          text: 勇敢一点。别再犹豫，老实告诉我，是不是你做的？
        - id: ch02-b38
          speaker: narrator
          text: 彼得低着头，根本没看见奶奶指的是花。他只知道外公站在屋角，灰色的眼睛正盯着自己。外公身旁，还有世上最可怕的人，那个法兰克福来的警察。他浑身哆嗦，嘴唇也颤起来。
        - id: ch02-b39
          speaker: peter
          text: 是……是我。
          emotion: fearful
        - id: ch02-b40
          speaker: grandmamma
          text: 那有什么好怕的？
        - id: ch02-b41
          speaker: peter
          text: 因为……因为它摔得粉碎，再也拼不回去了。
          emotion: fearful
        - id: ch02-b42
          speaker: narrator
          text: 他的两个膝盖撞个不停，几乎站不住。奶奶走到外公身旁，同情地看着他。
        - id: ch02-b43
          speaker: grandmamma
          text: 这个可怜的孩子，是不是有点神志不清？
        - id: ch02-b44
          speaker: grandfather
          text: 一点也没有。他就是那阵把椅子刮下山的风，现在正等着该受的惩罚。
        - id: ch02-b45
          speaker: narrator
          text: 奶奶很难相信。彼得不像坏透了的孩子，她也想不出他为什么要毁掉那张少不了的椅子。可椅子出事的时候，外公心里已经有了怀疑。彼得从一开始就愤怒地盯着克拉拉，后来又处处显出不喜欢山上这些变化。外公把看见的一切放在一起，很快猜中了灾祸的缘由，所以指出是彼得时一点也没有迟疑。
        - id: ch02-b46
          speaker: narrator
          text: 奶奶听完，立刻激动地替彼得说话。
        - id: ch02-b47
          speaker: grandmamma
          text: 不，大叔，别再罚这个可怜的孩子了。也该替他想一想。法兰克福来了这么多陌生人，把他唯一拥有的海蒂抢走了，海蒂又确实值得人珍惜。他连续几个星期独自坐着，除了想着自己的委屈，什么也做不了。我们得公平些。他让怒气冲昏了头，才想报复。当然，这是件傻事，可人生气的时候，谁没做过傻事呢？
    - id: ch03
      title: 彼得说出真相
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 奶奶说完，走回彼得身边。彼得还站在那里，不停发抖。她在冷杉下的长凳上坐下，和和气气地叫他过去。
        - id: ch03-b02
          speaker: grandmamma
          text: 过来，孩子，站到我面前。我有话跟你说。别再发抖了，好好听着。你把椅子推下山，摔得粉碎。这件事很坏，你当时自己也明白，还知道理应受罚，所以才想方设法瞒着大家，好逃过惩罚。
        - id: ch03-b03
          speaker: grandmamma
          text: 可你要懂得，做了坏事却以为没人知道，那就错了。上帝什么都看得见，也听得见。一个人想藏住自己做过的坏事，上帝就会叫醒藏在他心里的小守卫。每个人一出生，这个守卫就在那里。我们不做错事，他便安安静静地睡着。
        - id: ch03-b04
          speaker: grandmamma
          text: 可他一醒，就拿小刺棒不停地刺，让人没有一刻安宁。他还会扯着难听的嗓子喊，你就要被发现了，他们就要抓你去受罚了。这样一来，人每天都活在害怕和烦恼里，再也得不到幸福安宁。彼得，你最近是不是一直有这种感觉？
        - id: ch03-b05
          speaker: narrator
          text: 彼得懊悔地点点头。奶奶说的正是他的感受，他再明白不过。
        - id: ch03-b06
          speaker: grandmamma
          text: 还有一件事，你也算错了。你本想害人，最后这场祸反而给他们带来了好处。克拉拉没了椅子，又那么想看花，只好试着自己走。从那以后，她一天比一天走得好。要是继续住在这里，她以后每天都能上山，比坐椅子时去得还勤。
        - id: ch03-b07
          speaker: grandmamma
          text: 所以你看，上帝能从坏事里替受害的人引出好事，做坏事的人却得自己吃苦果。你全听懂了吗？听懂了就别忘。下次再想做坏事，要记得心里那个拿小刺棒、声音难听的小守卫。你会记住吗？
        - id: ch03-b08
          speaker: peter
          text: 会，我会记住。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 彼得还是垂头丧气。他不知道最后会怎样，那个警察毕竟还和外公站在一起。
        - id: ch03-b10
          speaker: grandmamma
          text: 好，这件事就到这里，不再追究了。不过我想送你一样东西，让你以后想起法兰克福来的客人，也能有点高兴的回忆。你有没有一直想要的东西？最喜欢什么礼物？
        - id: ch03-b11
          speaker: narrator
          text: 彼得抬起头，睁大眼睛盯着奶奶。刚才他还以为灾祸马上就要落下来，现在竟能随便挑一样想要的东西，脑子顿时乱成一团。
        - id: ch03-b12
          speaker: grandmamma
          text: 我说的是真的。你可以选一样礼物，留作法兰克福客人送你的纪念，也表示他们不再计较你犯的错。现在懂了吗？
        - id: ch03-b13
          speaker: narrator
          text: 彼得这才慢慢明白，他不用再怕受罚了。面前这位好心太太，已经把他从警察手里救出来。他觉得身上像卸下了一座山，也终于懂了，无论犯过什么错，或者有什么该做却没做，最好马上全都承认。
        - id: ch03-b14
          speaker: peter
          text: 还有……那张纸也让我弄丢了。
        - id: ch03-b15
          speaker: narrator
          text: 奶奶想了一会儿，才明白他说的是那封电报。
        - id: ch03-b16
          speaker: grandmamma
          text: 你肯说出来，真是个好孩子。犯了错千万别藏着，事情总还能重新变好。现在告诉我，你想要什么？
        - id: ch03-b17
          speaker: narrator
          text: 一想到世上什么都能要，彼得简直有些发晕。迈恩费尔德一年一度的集市浮现在眼前。一个个摊位亮闪闪的，上面摆满了叫人喜欢的东西。他每年都能站在那里看上几个钟头，一件件看过去，却从不敢想自己真能带走一样。他的钱袋里最多只有半便士，可那些迷人的东西，每一样都得花上两倍的钱。
        - id: ch03-b18
          speaker: narrator
          text: 有漂亮的小红哨子，可以拿来召唤羊群。还有一把带圆柄的精美小刀，名字叫打癞蛤蟆，用它砍榛树枝，一定神气极了。两样东西究竟选哪一个？彼得想了又想，怎么也决定不了。忽然，他有了一个聪明主意。从现在到明年集市，还有很久可以慢慢考虑。
        - id: ch03-b19
          speaker: peter
          text: 我要一便士。
        - id: ch03-b20
          speaker: grandmamma
          text: 这个要求可不算贪心。过来吧！
        - id: ch03-b21
          speaker: narrator
          text: 奶奶忍不住笑了。她拿出钱袋，把四枚亮闪闪、圆溜溜的先令放到他掌心，又添上几枚便士。
        - id: ch03-b22
          speaker: grandmamma
          text: 我们现在就算清楚。我给你的便士，跟一年里的星期一样多。这样一整年里，每到星期日，你都能拿一便士出来花。
        - id: ch03-b23
          speaker: peter
          text: 一直到我死吗？
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: 奶奶笑得更厉害了。几个男人听见笑声，也停下谈话，留神听这边说什么。
        - id: ch03-b25
          speaker: grandmamma
          text: 是啊，孩子，你一辈子都会有。我会把它写进遗嘱。儿子，你听见了吧？你也要写进自己的遗嘱。只要彼得活着，每个星期都给他一便士。
        - id: ch03-b26
          speaker: narrator
          text: 赛赛曼先生点头答应，也跟着笑起来。彼得又看看手里的钱，想弄清自己是不是在做梦。
        - id: ch03-b27
          speaker: peter
          text: 感谢上帝！
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: 他连跑带跳地走了，比平时还敏捷，这次却一直站得稳稳的。如今催他飞奔上山的已不是恐惧，而是他一生从没感受过的喜悦。烦恼和颤抖全都消失了。只要活着，他每个星期都有一便士。
        - id: ch03-b29
          speaker: narrator
          text: 午饭后，大家坐在一起闲谈。克拉拉把父亲拉到旁边，热切地开口了。从前那个总是疲倦无力的小病人，从没有过这样的神气。
        - id: ch03-b30
          speaker: clara
          text: 爸爸，您真该知道爷爷每天替我做了多少事！他的好，我数也数不完，可我一辈子都不会忘。我一直在想，能替他做点什么，或者送他什么礼物。只要能带给他一半的快乐，就抵得上他给我的了。
        - id: ch03-b31
          speaker: sesemann
          text: 克拉拉，这正好也是我最大的心愿。我也一直在想，要怎么感谢我们的恩人。
        - id: ch03-b32
          speaker: narrator
          text: 父亲每看女儿一眼，脸上的幸福就更多一点。他走到正在和奶奶热烈交谈的外公面前。外公看见他来，便站起身。赛赛曼先生握住他的手。
        - id: ch03-b33
          speaker: sesemann
          text: 亲爱的朋友，我们认真谈几句吧。这些年来，我从没有过真正的幸福，您一定相信。钱和财产都不能让可怜的女儿恢复健康，不能让她快乐，那些东西对我还有什么用？
        - id: ch03-b34
          speaker: sesemann
          text: 在上帝的帮助下，是您让她健康强壮。您不只给了她新的生命，也给了我新的生命。请告诉我，我要怎样才能表达感激？您的恩情我永远报答不完，可只要我做得到，全都听您吩咐。朋友，请告诉我，能让我为您做什么？
        - id: ch03-b35
          speaker: narrator
          text: 外公安静地把这些话听完。他望着眼前这位幸福的父亲，脸上一直带着欣慰的微笑，也完全明白对方为什么这样激动。
        - id: ch03-b36
          speaker: grandfather
          text: 赛赛曼先生，请相信，令爱康复，我也一样高兴。为了这个结果，所有辛苦都已经有了回报。您说的每句话，我都真心感谢，可我什么也不缺。只要还活着，我和孩子需要的东西就都够用。
        - id: ch03-b37
          speaker: grandfather
          text: 我只有一个愿望。要是这个愿望能实现，我这一生就再没有牵挂了。
        - id: ch03-b38
          speaker: sesemann
          text: 说吧，亲爱的朋友。请告诉我，是什么愿望？
        - id: ch03-b39
          speaker: grandfather
          text: 我已经老了，在世的日子不会太久。我走以后，没有东西能留给孩子。她也没有亲人，只有一个人总想着能从她身上得到多少好处。要是您能答应我，永远不让海蒂到陌生人中间谋生，那就是对我照顾令爱的最好报答。
        - id: ch03-b40
          speaker: sesemann
          text: 亲爱的朋友，那种事绝不会发生。我把海蒂当作自己家的孩子。您问我母亲，再问我女儿，就知道她们决不会让海蒂落进别人手里。要是我的保证能让您安心，我现在就和您握手起誓。海蒂永远不用到陌生人中间谋生。不管我还活着，还是我已经不在了，我都会把她安排妥当。
        - id: ch03-b41
          speaker: sesemann
          text: 我还要告诉您一件事。先不说生活有没有保障，这孩子本来就不适合离开家乡。她住在我们那里时，我们已经看明白了。不过，她已经交到朋友，其中有一位正在法兰克福办事。等事情处理好，他就能自己选择住处，安心过以后的日子。
        - id: ch03-b42
          speaker: sesemann
          text: 我说的是那位医生，我的朋友，去年秋天来过这里。他认真想过您的建议，打算在附近住下来。因为再没有别的地方，能让他像陪着您和海蒂时那样健康快乐。从今以后，这孩子身边会有两个保护她的人。但愿两个人都活得长久，一起照顾她！
        - id: ch03-b43
          speaker: grandmamma
          text: 愿上帝让这个心愿实现！
        - id: ch03-b44
          speaker: narrator
          text: 奶奶热切地握住外公的手，让他知道，自己和儿子抱着一样真诚的心愿。接着，她搂住站在旁边的海蒂，把孩子拉到身边。
        - id: ch03-b45
          speaker: grandmamma
          text: 亲爱的海蒂，我也想问你一件事。你有没有特别想要的东西？
        - id: ch03-b46
          speaker: heidi
          text: 有！
          emotion: happy
        - id: ch03-b47
          speaker: grandmamma
          text: 那就马上告诉我。你想要什么？
        - id: ch03-b48
          speaker: heidi
          text: 我想要我在法兰克福睡过的那张床，还要高高的枕头和厚厚的被子。这样老奶奶睡觉时，脑袋就不会一直垂下去，压得快喘不过气。厚被子还能让她暖暖和和，不用再披着披肩睡觉，也不会冻坏了。
        - id: ch03-b49
          speaker: narrator
          text: 海蒂一心想替老奶奶求到这件东西，急得连气都顾不上喘，一口气说到最后才停。
        - id: ch03-b50
          speaker: grandmamma
          text: 我最亲爱的孩子，你告诉我的是什么呀！你提醒得对。我们只顾沉浸在自己的幸福里，常常忘了最应该先想到的事。上帝给我们这么多恩典，我们就该立刻想想那些缺少许多东西的人。
        - id: ch03-b51
          speaker: grandmamma
          text: 我马上发电报去法兰克福。罗特麦耶小姐今天就会把床打包，两天后就能送到这里。愿上帝保佑，让老奶奶很快舒舒服服地睡在上面。
          emotion: happy
    - id: ch04
      title: 到老奶奶家去
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 海蒂高兴得绕着奶奶直蹦，忽然又停下来。
        - id: ch04-b02
          speaker: heidi
          text: 我得马上下山，把这件事告诉老奶奶。这么久没去看她，她一定也很难过。
        - id: ch04-b03
          speaker: narrator
          text: 她一刻也等不了，非得马上把好消息送去。她也想起上一次见面时，老人有多忧愁。
        - id: ch04-b04
          speaker: grandfather
          text: 不行，海蒂，你在想什么？家里还有客人，不能这样跑来跑去。
        - id: ch04-b05
          speaker: grandmamma
          text: 这孩子的想法也没什么不对，大叔。为了我们，可怜的老奶奶已经太久没见海蒂了。不如大家一起下山看她。我的马应该还在等着，我可以从那里骑去多尔夫里，一到村里就发电报。儿子，你觉得怎么样？
        - id: ch04-b06
          speaker: narrator
          text: 赛赛曼先生还没来得及谈自己的旅行计划，便请母亲先听他说完。他原想和母亲在瑞士游览一番，只是不知道克拉拉能不能经得住其中一段路。现在女儿已经能一路同行，他便可以尽情享受这份快乐，也不愿错过暮夏的好天气。
        - id: ch04-b07
          speaker: narrator
          text: 他不想错过暮夏的好日子，便提议自己和母亲当晚先住在多尔夫里，第二天再来接克拉拉。之后，一家三代一起下到拉加茨，从那里开始游览瑞士。想到马上就要告别高山，克拉拉起初很难过。可新的旅程又叫她忍不住期待，眼前还忙忙碌碌的，根本没有留下多少时间让她伤心。
        - id: ch04-b08
          speaker: narrator
          text: 奶奶拉起海蒂的手，正要带头出发，忽然想起了一件事。
        - id: ch04-b09
          speaker: grandmamma
          text: 可克拉拉怎么办？她还走不了这么远呀。
        - id: ch04-b10
          speaker: narrator
          text: 她回头一看，外公早把克拉拉抱了起来，正稳稳地跟在后面，便满意地点点头。赛赛曼先生走在最后，一行人就这样下山了。
        - id: ch04-b11
          speaker: narrator
          text: 海蒂和奶奶并肩走，一路高兴得又跑又跳。奶奶问老奶奶平日怎样生活，每天做些什么，尤其想知道冬天那么冷，她是怎么熬过去的。那家里的每一件事，海蒂都清楚。她说老人常常缩在墙角，冷得不停发抖，又把老人平常吃什么、家里最缺什么，全都仔仔细细讲给奶奶听。
        - id: ch04-b12
          speaker: narrator
          text: 奶奶一路关切地听着，不知不觉便到了老奶奶家。布丽吉塔正在太阳下晾彼得的第二件衬衫。等他把身上那件穿得够久，正好能换。她看见这么多人走近，立刻冲进屋里。
        - id: ch04-b13
          speaker: brigitta
          text: 有一大群人正从咱们这里经过，看着像是全都要回家了。大叔也在，还抱着那个生病的孩子。
        - id: ch04-b14
          speaker: grandmother
          text: 唉，真的就这样走了吗？海蒂也跟他们在一起吗？那他们是要把她带走了。只要她能再来一趟，把手放进我手里就好了。只要再让我听一次她的声音！
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: 就在这时，门猛地打开，海蒂一下扑到墙角，紧紧抱住老奶奶。
        - id: ch04-b16
          speaker: heidi
          text: 奶奶！奶奶！我在法兰克福睡的那张床要送来了，三个枕头和厚厚的被子全都有。赛赛曼奶奶说，两天后就能送到！
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 海蒂急着看老人听见好消息后的欢喜，话说得再快也嫌不够。老奶奶微微笑了，却仍有几分忧伤。
        - id: ch04-b18
          speaker: grandmother
          text: 她一定是位善良的好太太。想到她会把你带在身边，我本来应该高兴，可我大概也活不了多久了。
          emotion: sad
        - id: ch04-b19
          speaker: grandmamma
          text: 我听见什么了？是谁对我的好奶奶说这种话？不，不，绝不会这样！海蒂会留下来陪您，让您快活。我们想见她，就由我们来找她。
        - id: ch04-b20
          speaker: narrator
          text: 一个亲切的声音在旁边响起。赛赛曼太太跟着海蒂进了屋，刚好听见她们的话。她握住老奶奶的手，热切地按了按。
        - id: ch04-b21
          speaker: grandmamma
          text: 我们盼着每年都来阿尔卑斯山一次。我们的孩子在这里得到了这么大的奇迹，我们当然应该回来，特别感谢上帝。
        - id: ch04-b22
          speaker: narrator
          text: 老奶奶的脸一下亮起来，露出真正幸福的光。她一遍遍握紧赛赛曼太太的手，激动得说不出感谢的话。两颗大大的泪珠从苍老的脸颊滚下来，那是欢喜的泪。海蒂看着老人脸上的变化，自己也终于完完全全地幸福了。
        - id: ch04-b23
          speaker: heidi
          text: 奶奶，现在发生的这些事，是不是就像我上次给您读的那首赞美诗？法兰克福送来的床，不正是为了让您好起来吗？
        - id: ch04-b24
          speaker: grandmother
          text: 是啊，海蒂。还有好多别的好东西，也都是上帝送给我的。我从没想过，世上会有这么多好心人，肯为一个贫苦的老太婆操心，替她做这么多事。
        - id: ch04-b25
          speaker: grandmother
          text: 知道世上有这样善良的人，愿意怜悯我这个又穷又没用的人，我就更能相信，仁慈的天父永远不会忘记他最微小的造物。
          emotion: happy
        - id: ch04-b26
          speaker: grandmamma
          text: 我的好奶奶，在上帝眼里，我们都一样贫穷无助，也都需要他记得我们。现在得说再见了，不过只是暂时分别，我们还会重逢。明年再来阿尔卑斯山，第一个拜访的就是您。在那以前，我们也不会忘记您。
          emotion: calm
        - id: ch04-b27
          speaker: narrator
          text: 赛赛曼太太再次握住老奶奶的手，向她告别。可老奶奶舍不得就这样让她走，又说了许多感激的话，还求上帝把所有福气赐给恩人，也赐给她身边的每个人。
        - id: ch04-b28
          speaker: narrator
          text: 最后，赛赛曼先生和母亲终于继续下山。外公抱着克拉拉回家，海蒂走在旁边。只要想到老奶奶就要得到的那些东西，她每走一步都快活得想跳起来。
    - id: ch05
      title: 再见，等我们重逢
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早晨，克拉拉就要离开了。她流了许多眼泪，舍不得向美丽的高山之家告别。她这一生，从没有在别的地方这样幸福过。海蒂竭力安慰她。
        - id: ch05-b02
          speaker: heidi
          text: 夏天一转眼就会再来。到时候你还会来，而且肯定比这一次更好，因为从第一天起，你就能到处走。我们每天都可以跟着羊群上山，去鲜花生长的地方。只要你来了，我们就能天天一起快活。
          emotion: calm
        - id: ch05-b03
          speaker: narrator
          text: 赛赛曼先生照约定来接女儿。这时，他正站在一旁和外公说话，两个人还有许多事要谈。克拉拉听了海蒂的话，心里稍稍好受些，便擦干眼泪。
        - id: ch05-b04
          speaker: clara
          text: 一定替我跟彼得和羊儿们说再见，特别是小天鹅。我真想送它一件礼物。它帮了我那么多，让我变得强壮起来。
        - id: ch05-b05
          speaker: heidi
          text: 当然可以。你可以送它一点盐呀。每天晚上回家，它最喜欢舔爷爷手里的盐。
        - id: ch05-b06
          speaker: clara
          text: 对呀！那我就从法兰克福送一百磅盐来！我也要给它一样东西，让它能记得我。
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 赛赛曼先生朝孩子们招手，该出发了。奶奶的白马已经牵上山，准备给克拉拉骑。她再也不用让人放进椅子里抬下去了。
        - id: ch05-b08
          speaker: narrator
          text: 海蒂一直跑到山坡最外缘，站在那里不住地朝克拉拉挥手。白马载着克拉拉沿山路慢慢走远，最后，白马和马背上的身影完全消失，再也看不见了。
        - id: ch05-b09
          speaker: narrator
          text: 后来，那张床送到了。老奶奶一整夜都睡得香甜，身体一定也会慢慢强壮起来。
        - id: ch05-b10
          speaker: narrator
          text: 赛赛曼奶奶也没有忘记，山上的冬天有多么寒冷。她送来一个大包，里面装满各种各样的暖和衣物。老奶奶可以把它们一层又一层裹在身上。往后再坐到那个墙角，她一定不会像从前那样，整天冷得发抖了。
        - id: ch05-b11
          speaker: narrator
          text: 多尔夫里到处都在动工。医生已经来了，暂时还住在从前住过的地方。朋友们劝他买下外公和海蒂冬天居住的那座老宅。房子里的屋顶很高，还有一座华丽的炉子，砌着精美的彩绘瓷砖。只看这些，就知道这里从前大概属于一位体面的绅士。
        - id: ch05-b12
          speaker: narrator
          text: 医生正在重建老宅的一部分，留给自己住。另一部分也会修好，仍让外公和海蒂使用。他知道外公性情独立，喜欢单独住在自己的屋里。房屋最后面，还要给两只羊修一间温暖结实的棚子，让它们舒舒服服过冬。
        - id: ch05-b13
          speaker: narrator
          text: 医生和外公一天比一天亲近。他们常在新修的房屋间走动，看看工程做到哪里。走着走着，两人的心思总会落到海蒂身上。对他们来说，这所房子带来的最大快乐，就是那个无忧无虑的小姑娘会和他们住在一起。
        - id: ch05-b14
          speaker: narrator
          text: 有一次，两个人并肩站着，医生向外公开口。
        - id: ch05-b15
          speaker: doctor
          text: 亲爱的朋友，我相信，您看这件事和我一样。我分享着您从海蒂身上得到的幸福。除了您，我觉得自己就是和她最亲近的人。不过，我也想分担照顾她的全部责任，尽力替这孩子做些事。
        - id: ch05-b16
          speaker: doctor
          text: 这样，我才觉得自己也有疼爱她的权利，也才能盼着她陪伴我，在我老了以后照料我。这是我心里最大的愿望。她可以像亲生孩子那样向我要求任何事，我也会把她当自己的孩子照顾。等到您和我必须离开的那一天，我们就能放心地留下她。
        - id: ch05-b17
          speaker: narrator
          text: 外公一句话也没有说，只伸出手，把医生的手紧紧握在自己手里。可言语已经不需要了。医生从老朋友的眼睛里看得清清楚楚，他的心里有多么激动，又有多么欢喜和感激。
        - id: ch05-b18
          speaker: narrator
          text: 这时，海蒂和彼得正坐在老奶奶身边。一个有说不完的话，另外两个有听不完的话。三个人越凑越近，急切得几乎喘不过气，唯恐漏听了一个字。
        - id: ch05-b19
          speaker: narrator
          text: 刚刚过去的夏天发生了那么多事，能讲的实在太多了。自从那些事情发生以后，他们一直没有机会这样聚在一起。
        - id: ch05-b20
          speaker: narrator
          text: 三个人终于又相伴在一起，共同回想那些奇妙的经历。谁脸上的幸福更多，实在很难说。也许布丽吉塔最高兴。大家向她解释了好一阵，她终于第一次真正弄明白，彼得终身每个星期一便士的故事究竟是怎么回事。
        - id: ch05-b21
          speaker: narrator
          text: 到最后，老奶奶终于开口了。
        - id: ch05-b22
          speaker: grandmother
          text: 海蒂，给我读一首赞美诗吧！我想，余下这一生，我什么也做不了，只能感谢天父把这一切恩典赐给我们。
          emotion: happy
