  chapters:
    - id: ch01
      title: Grandmamma Comes to the Mountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandmamma had written to say that she would arrive without fail. Early the next morning, Peter brought her letter up the mountain. Grandfather and the children were already outside. The goats tossed their heads in the fresh air while Heidi and Clara stroked them and wished them a pleasant day. Grandfather looked from the children's healthy faces to his fine goats and smiled at them all.
        - id: ch01-b02
          speaker: narrator
          text: Peter slowed down as he came near. The moment he handed Grandfather the letter, he spun around. He glanced behind him as if something frightening were chasing him, then bounded away toward the pasture.
        - id: ch01-b03
          speaker: heidi
          text: Grandfather, why does Peter keep acting like the Great Turk when someone is coming after him with a stick? He turns around, shakes his head, and jumps away just like that.
        - id: ch01-b04
          speaker: grandfather
          text: Maybe Peter thinks he sees the stick he deserves coming after him.
        - id: ch01-b05
          speaker: narrator
          text: Peter ran over the first rise without stopping. Once the hut was out of sight, he stood still and searched all around him. All at once he jumped and stared behind him, as if someone had grabbed the back of his neck. He expected a police officer from Frankfurt to spring out from every bush and hedge and seize him. Every minute only stretched out the suspense. Instead of feeling safer, Peter grew more frightened and miserable. Wherever he went and whatever he did, he could not find one peaceful moment.
        - id: ch01-b06
          speaker: narrator
          text: Heidi spent the morning putting the hut in perfect order for Grandmamma. Clara watched her work with great interest. When the chores were done, the girls dressed and sat together on the bench to wait.
        - id: ch01-b07
          speaker: narrator
          text: Grandfather showed them a splendid bunch of blue gentians he had gathered high on the mountain. The flowers shone in the morning sun, and both girls cried out over their beauty. He carried them inside while Heidi kept jumping up to look for Grandmamma.
        - id: ch01-b08
          speaker: narrator
          text: At last, a little procession came winding upward. A guide walked first. Grandmamma followed on a white horse, and behind her came a porter bent under a heavy bundle. She never climbed the mountain without plenty of rugs and wraps.
        - id: ch01-b09
          speaker: narrator
          text: The moment Grandmamma saw Clara sitting upright on the bench, she hurried down from her horse in alarm.
        - id: ch01-b10
          speaker: grandmamma
          text: Clara, why aren't you lying in your chair? What are you all doing? Wait, is that really you? Your cheeks are round and rosy. I hardly recognize you!
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: Grandmamma rushed forward to embrace her. Before she could, Heidi slipped off the bench. Clara leaned on Heidi's shoulder, and the two girls walked toward her as naturally as could be. For an instant, Grandmamma feared that Heidi had dreamed up some wild experiment. But Clara was truly walking, steady and upright. Both girls turned toward her with bright eyes and rosy faces.
        - id: ch01-b12
          speaker: narrator
          text: Laughing and crying at once, Grandmamma hugged Clara, then Heidi, then Clara again. She could not speak for joy. When she noticed Grandfather smiling beside the bench, she linked arms with Clara and walked her over to him. Then she let go and took both of his hands.
        - id: ch01-b13
          speaker: grandmamma
          text: My dear Uncle, how can we ever thank you? You did this with all your care and nursing—
          emotion: happy
        - id: ch01-b14
          speaker: grandfather
          text: And with God's good sunshine and mountain air.
        - id: ch01-b15
          speaker: clara
          text: And don't forget the wonderful milk. Grandmamma, I drink so much goat's milk now, and it tastes so good!
          emotion: happy
        - id: ch01-b16
          speaker: grandmamma
          text: I can see that in your cheeks. You're strong and plump, and taller too. I never dreamed I would see you looking like this. I can hardly take my eyes off you. Now I must send word to your father in Paris and tell him to come at once. I won't tell him why. This will be the happiest surprise of his life. Uncle, have the men already gone? How can I send a telegram?
        - id: ch01-b17
          speaker: grandfather
          text: The men have gone. If it can't wait, I'll call Peter. He can carry it down.
        - id: ch01-b18
          speaker: narrator
          text: Grandmamma thanked him. She could not bear to keep the news from her son one day longer. Grandfather stepped aside and gave a piercing whistle through his fingers. The rocks high above threw back the sound.
        - id: ch01-b19
          speaker: narrator
          text: Peter knew that whistle and soon came running. His face was white as a ghost's. He thought Grandfather had called him down to hand him over. Instead, Grandfather gave him a written message and told him to take it straight to the post office in Dorfli. He would pay the fee later, since Peter had enough to keep track of already.
        - id: ch01-b20
          speaker: narrator
          text: Peter left with the telegram, somewhat relieved. If Grandfather had not called him down to surrender him, then the police officer had not arrived yet.
        - id: ch01-b21
          speaker: narrator
          text: The others could finally sit down in peace for dinner around the table in front of the hut. Grandmamma wanted every detail. She heard how Grandfather first helped Clara stand and then made her move her feet a little each day. She heard about the planned trip to the high pasture, how the chair had vanished down the mountain, and how Clara's longing to see the flowers made her try to cross the grass. Those first steps had led to more steps, and each day she had grown steadier.
        - id: ch01-b22
          speaker: grandmamma
          text: It hardly seems possible. Are we truly awake and sitting here by the mountain hut? Can that round-faced, healthy girl really be my pale, sick little Clara?
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: Again and again she broke in with wonder and gratitude. Heidi and Clara could not stop enjoying the surprise they had planned so carefully, or Grandmamma's amazement each time she looked at Clara.
    - id: ch02
      title: Another Surprise Arrives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, Herr Sesemann had prepared a surprise of his own. When his work in Paris was done, he boarded a train without telling his mother. He traveled to Basel that day and continued the next morning, longing to see the daughter from whom he had been separated all summer.
        - id: ch02-b02
          speaker: narrator
          text: He reached Ragatz only a few hours after Grandmamma had left. When he learned she had started for the mountain that very day, he wasted no time. He hired a carriage and drove to Mayenfeld. There he discovered that the road could carry him as far as Dorfli, so he stayed in the carriage until then. The walk from that village to the hut, he thought, would be as much climbing as he cared to do.
        - id: ch02-b03
          speaker: narrator
          text: He was right. The path climbed and climbed, yet the hut never appeared. He knew Peter's home stood halfway up because people had described it many times. But narrow trails ran in every direction, and he began to wonder whether he was on the wrong side of the mountain.
        - id: ch02-b04
          speaker: narrator
          text: Herr Sesemann searched the slopes for someone who could direct him, but not a soul appeared near or far. The mountain seemed completely still. From time to time the wind whistled past him. Insects hummed in the sunshine, and a cheerful bird sang from one lonely larch. Tired and overheated, he stopped and let the cool Alpine air blow across his face. Then a figure came racing down the mountainside. It was Peter, carrying Grandmamma's telegram and running straight down the steep grass instead of following the path.
        - id: ch02-b05
          speaker: narrator
          text: Herr Sesemann waved him over. Peter crept closer sideways, as if one leg worked and the other had to be dragged behind.
        - id: ch02-b06
          speaker: herr_sesemann
          text: Come along, boy. Is this the path to the old man's hut, where Heidi lives and the visitors from Frankfurt are staying?
        - id: ch02-b07
          speaker: narrator
          text: Peter made one low sound of terror. Then he whirled and tried to run. He pitched head over heels and went rolling and bouncing down the slope just as the chair had done. Peter did not break apart, but the telegram did. It tore into scraps that flew away on the wind.
        - id: ch02-b08
          speaker: herr_sesemann
          text: These mountain people are remarkably shy.
        - id: ch02-b09
          speaker: narrator
          text: Herr Sesemann was sure the strange boy had panicked at the sight of a stranger. He watched Peter's wild descent for a moment, then continued uphill.
        - id: ch02-b10
          speaker: narrator
          text: Peter could not stop himself. He rolled onward and every so often went head over heels again. Yet the bruises and jolts were not the worst of it. Terror filled him because he was now certain the police officer from Frankfurt had finally arrived. In Peter's mind, the stranger who had asked for Grandfather's hut could be no one else. The man had come all that way to find him and punish him for the chair.
        - id: ch02-b11
          speaker: narrator
          text: Near the last high slope above Dorfli, a bush caught Peter and ended his fall. He lay still, trying to recover and think.
        - id: ch02-b12
          speaker: baker
          text: Nicely done! First one thing comes bumping down, and now another. What will the wind roll past tomorrow, another badly tied sack of potatoes?
        - id: ch02-b13
          speaker: narrator
          text: The baker stood nearby laughing. He had come outside after the heat of his day's work and had watched Peter tumble much like the chair. Peter jumped up in fresh alarm and started back uphill without looking behind him.
        - id: ch02-b14
          speaker: narrator
          text: More than anything, Peter wanted to go home, crawl into bed, and hide where he felt safest. But he had left the goats high on the pasture. Grandfather had given strict orders that he return quickly so they would not be alone for long. Peter stood in greater awe of Grandfather than of anyone, and he would never dare disobey him. There was no escape. The anguish, the rolling, and the violent shaking had taken away all his strength. Unable to run, he limped and groaned as he slowly climbed the whole way back.
        - id: ch02-b15
          speaker: narrator
          text: Herr Sesemann passed the first hut and knew he had chosen the right path. After one more long, tiring climb, he saw Grandfather's home at last, with the dark fir tops moving above its roof. He was delighted. Only one steep stretch remained, and then he could surprise Clara.
        - id: ch02-b16
          speaker: narrator
          text: But the people at the hut had already recognized him, and they prepared a surprise he never expected. As he reached the open ground, two figures walked toward him. A tall, fair-haired girl with pink cheeks leaned on Heidi, whose dark eyes danced with delight.
        - id: ch02-b17
          speaker: narrator
          text: Herr Sesemann stopped as if rooted to the ground and stared at the two children. Tears suddenly filled his eyes, and memories rose in his heart. Clara looked just as her mother once had, a fair-haired girl with that same delicate pink-and-white face. All summer he had pictured his frail child far away from him. Now she was walking down the mountain to meet him. He could not tell whether he was awake or dreaming.
        - id: ch02-b18
          speaker: clara
          text: Don't you know me, Papa? Have I changed so much since you saw me?
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: He ran to Clara and caught her in his arms. Then he stepped back to look at her, afraid the sight might vanish.
        - id: ch02-b20
          speaker: herr_sesemann
          text: You have changed! How can this be? Is what I'm seeing real? Are you truly my little Clara?
          emotion: surprised
        - id: ch02-b21
          speaker: narrator
          text: He hugged her once more, then held her away again so he could be certain. Grandmamma came forward, eager to see her son's joy.
        - id: ch02-b22
          speaker: grandmamma
          text: Well, my dear son, what do you say? Your arrival surprised us, but our surprise for you is far greater. You must admit that. Now come and greet Uncle, our greatest benefactor.
          emotion: happy
        - id: ch02-b23
          speaker: herr_sesemann
          text: Gladly. And first, let me greet the little member of our own household. Heidi, are you still happy and well here? I don't need to ask. No Alpine rose could look healthier. It does me good to see you.
        - id: ch02-b24
          speaker: narrator
          text: He shook Heidi's hand, and she looked up happily into his kind face. He had always been good to her. Now he had found such joy waiting on the mountain that her own heart beat faster for him.
        - id: ch02-b25
          speaker: narrator
          text: Grandmamma led her son to Grandfather. While the men shook hands and Herr Sesemann poured out his thanks and amazement, she walked behind the hut to visit the old fir trees.
        - id: ch02-b26
          speaker: narrator
          text: Under the long branches, in a clear place on the ground, stood a great mass of dark blue gentians. They were so fresh and bright that they seemed to be growing there. Grandmamma clasped her hands at the sight.
        - id: ch02-b27
          speaker: grandmamma
          text: How beautiful! Heidi, dear, come look. Did you arrange this wonderful surprise for me?
          emotion: happy
        - id: ch02-b28
          speaker: heidi
          text: No, I didn't put them there. But I know who did.
        - id: ch02-b29
          speaker: clara
          text: They grow like that high on the mountain, Grandmamma, only they're even lovelier there. Now guess who brought these down today.
    - id: ch03
      title: Peter Tells the Truth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Clara smiled with such pleasure that for a moment Grandmamma almost believed the girl had climbed up and gathered the flowers herself, though that could hardly be possible. Just then, the fir branches gave a faint rustle. Peter had finally returned from his disastrous errand. From a distance he had seen the stranger standing beside Grandfather. Certain that this was the Frankfurt police officer, he had made a long circle around the hut and was trying to slip behind the trees without anyone noticing him.
        - id: ch03-b02
          speaker: narrator
          text: Grandmamma spotted him. She guessed that the shy boy must have brought the gentians and wanted to escape without being thanked. She decided he deserved a little reward.
        - id: ch03-b03
          speaker: grandmamma
          text: Come here, Peter. There's no need to be afraid.
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: Peter froze. After everything he had suffered that day, he had no strength left to resist. One thought filled his mind. It was all over now. His hair seemed to stand on end as he stepped from behind the trees, pale and twisted with fear.
        - id: ch03-b05
          speaker: grandmamma
          text: Be brave and answer me plainly. Did you do it?
          emotion: calm
        - id: ch03-b06
          speaker: narrator
          text: Peter kept his eyes down, so he never saw her pointing toward the flowers. He knew Grandfather was watching from the hut, and beside him stood the most terrifying person Peter could imagine, the police officer from Frankfurt. Trembling from head to foot, he whispered his answer.
        - id: ch03-b07
          speaker: peter
          text: Yes.
          emotion: fearful
        - id: ch03-b08
          speaker: grandmamma
          text: Why should that frighten you?
        - id: ch03-b09
          speaker: peter
          text: Because... because it's smashed to pieces. Nobody can ever put it together again.
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: The words barely came out, and his knees knocked together. Grandmamma went to Grandfather in confusion.
        - id: ch03-b11
          speaker: grandmamma
          text: Is the poor boy not quite right in his mind?
        - id: ch03-b12
          speaker: grandfather
          text: His mind is fine. He's the wind that sent Clara's chair down the slope, and now he's waiting for the punishment he earned.
        - id: ch03-b13
          speaker: narrator
          text: Grandmamma could hardly believe the accusation. Peter did not look like a thoroughly bad boy, and she could not imagine why he would destroy something Clara needed so badly. Grandfather, however, had suspected him from the moment the chair vanished. From the beginning, he had noticed Peter's angry looks at Clara and every sign of the boy's resentment over what was happening on the mountain. He had fitted those signs together with the strange path the chair must have taken. Now Peter's frightened confession proved that Grandfather had reached the right conclusion.
        - id: ch03-b14
          speaker: grandmamma
          text: No, Uncle, don't punish him any more. We must be fair. Strangers came from Frankfurt and took Heidi, the one friend he treasured, away from him. Then for weeks he sat alone each day, thinking about what he had lost. His anger took control and pushed him into a foolish act of revenge. It was wrong, but all of us can act foolishly when anger rules us.
        - id: ch03-b15
          speaker: narrator
          text: Peter still stood shaking. Grandmamma sat on the bench beneath the firs and called him closer.
        - id: ch03-b16
          speaker: grandmamma
          text: Stand here and listen to me. You pushed the chair down the mountain and broke it. You knew that was wrong, and you knew you deserved punishment. That is why you tried to hide the truth. But anyone who does wrong and thinks nobody knows is mistaken. God sees and hears everything.
        - id: ch03-b17
          speaker: grandmamma
          text: When we try to hide a wrong deed, a little watchman wakes inside us. He has been there since we were born, sleeping until we do wrong. Then he begins to prod us. He gives us no peace. He keeps warning, “Now they'll find out. Now punishment is coming.” We live in fear and lose every happy, quiet moment. Haven't you felt that lately, Peter?
        - id: ch03-b18
          speaker: narrator
          text: Peter nodded. She had described exactly what had been happening inside him.
        - id: ch03-b19
          speaker: grandmamma
          text: You were mistaken about something else too. The harm you meant to cause helped the people you wanted to hurt. Clara had no chair, but she longed to see the flowers. So she tried to walk. Each day since then, she has walked better. If she stayed here, she might soon climb the mountain more often than she ever could in that chair.
        - id: ch03-b20
          speaker: grandmamma
          text: God can bring good out of evil for the people who were harmed, while the person who did wrong suffers the misery of it. Do you understand? The next time you want to do something wrong, remember that little watchman, his sharp prod, and his warning voice. Will you remember?
        - id: ch03-b21
          speaker: peter
          text: Yes, I will.
        - id: ch03-b22
          speaker: narrator
          text: Peter was still subdued. He did not know how this would end, and the supposed police officer was still standing beside Grandfather.
        - id: ch03-b23
          speaker: grandmamma
          text: Good. Then that matter is finished. Now I want you to have something pleasant to remember the visitors from Frankfurt. Is there anything you've wanted very much? What gift would you like best?
        - id: ch03-b24
          speaker: narrator
          text: Peter stared at her. A moment ago he had expected disaster. Now she was offering him anything he wanted, and his thoughts spun.
        - id: ch03-b25
          speaker: grandmamma
          text: I mean it. Choose a gift to remember us by, and let it show that we won't hold your wrongdoing against you any longer. Do you understand now?
        - id: ch03-b26
          speaker: narrator
          text: At last Peter understood that punishment was over and this kind lady had saved him from the officer. The weight of a whole mountain seemed to lift from him. He also saw that the best thing was to confess everything he had done or failed to do.
        - id: ch03-b27
          speaker: peter
          text: I lost the paper too.
        - id: ch03-b28
          speaker: narrator
          text: Grandmamma had to think for a moment before she remembered the telegram.
        - id: ch03-b29
          speaker: grandmamma
          text: I'm glad you told me. Don't hide it when you've done something wrong. Then matters can be set right. Now, what would you like me to give you?
        - id: ch03-b30
          speaker: narrator
          text: Peter grew almost dizzy at the thought that he might choose anything in the world. At once he pictured the yearly fair at Mayenfeld. He saw the glittering stalls and all the wonderful objects he had stood admiring for hours, never dreaming that one could belong to him. Peter's purse never held more than half a penny, and even the smallest of those treasures cost twice as much. Until this moment, wanting them had been the closest he could come to owning them.
        - id: ch03-b31
          speaker: narrator
          text: He could choose one of the bright red whistles used to call goats. Or he could have a splendid round-handled knife, perfect for work among the hazel bushes. Peter could not decide. Then a clever thought came to him. He could wait until next year's fair and think about it all that time.
        - id: ch03-b32
          speaker: peter
          text: A penny.
        - id: ch03-b33
          speaker: narrator
          text: Grandmamma laughed, pulled out her purse, and placed four bright shillings in his hand. Then she added some pennies on top.
        - id: ch03-b34
          speaker: grandmamma
          text: That's a modest request. We'll settle the account now. I've given you one penny for every week of the year. Each Sunday, you may take out one penny to spend.
        - id: ch03-b35
          speaker: peter
          text: For as long as I live?
          emotion: surprised
        - id: ch03-b36
          speaker: narrator
          text: Grandmamma laughed even harder. The men stopped talking to hear what was happening.
        - id: ch03-b37
          speaker: grandmamma
          text: Yes, for your whole life. I'll put it in my will. Son, you hear me. Put it in yours too. Peter is to receive one penny a week for as long as he lives.
        - id: ch03-b38
          speaker: narrator
          text: Herr Sesemann nodded and laughed with her. Peter studied the money to make sure he was awake.
        - id: ch03-b39
          speaker: peter
          text: Thank God!
          emotion: happy
        - id: ch03-b40
          speaker: narrator
          text: He raced away up the mountain, running and leaping with even more than his usual energy. This time he managed to stay on his feet. Fear was no longer chasing him. A joy greater than any he had ever known sent him flying over the grass. The police officer, the hidden wrongdoing, and the dreadful waiting had vanished from his mind. His shaking and misery were over. In their place stood one magnificent fact. Every week, for the rest of his life, Peter would have a penny of his own.
    - id: ch04
      title: The Wishes That Matter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Later, after dinner, the group sat talking together. Clara drew her father aside. She spoke with an eagerness no one would have expected from the tired little invalid she once had been.
        - id: ch04-b02
          speaker: clara
          text: Papa, if you knew everything Grandfather has done for me, day after day! I couldn't count all his kindnesses, and I'll remember them my whole life. I keep wondering what I can do for him. What gift could bring him even half the happiness he has given me?
        - id: ch04-b03
          speaker: herr_sesemann
          text: That is exactly what I want too, Clara. I've been thinking about how we can thank our good friend.
        - id: ch04-b04
          speaker: narrator
          text: Every look at his healthy daughter made Herr Sesemann happier. He crossed to Grandfather, who was talking with Grandmamma. Grandfather rose, and Herr Sesemann took his hand.
        - id: ch04-b05
          speaker: herr_sesemann
          text: My dear friend, I have not known real happiness for years. What use were money and property when they could not make my child healthy and happy? With God's help, you made her strong. You gave new life to Clara and to me. Tell me how I can thank you. I could never repay you, but anything in my power is yours. Please tell me what I can do.
        - id: ch04-b06
          speaker: narrator
          text: Grandfather listened quietly, smiling as he watched the joyful father.
        - id: ch04-b07
          speaker: grandfather
          text: Herr Sesemann, your daughter's recovery gives me joy too. That has repaid every bit of trouble. I thank you for your words, but I need nothing. I have enough for Heidi and myself as long as I live. I have only one wish. If it were granted, I would have no other worry.
        - id: ch04-b08
          speaker: herr_sesemann
          text: Then tell me, my friend. What is it?
        - id: ch04-b09
          speaker: grandfather
          text: I'm growing old, and I won't be here forever. I have nothing to leave Heidi. She has only one relative, and that person would always try to profit from her. Promise me that Heidi will never be sent among strangers to earn her living. That would repay me richly for anything I've done for Clara.
        - id: ch04-b10
          speaker: herr_sesemann
          text: That will never happen. We think of Heidi as one of our own. My mother and Clara would never let her be left to strangers. But if a promise will ease your mind, take my hand. I will provide for her in my lifetime and after it. Heidi will never have to earn her living among strangers.
        - id: ch04-b11
          speaker: herr_sesemann
          text: And there is more. Heidi was never meant to live away from home. We learned that in Frankfurt. But she has friends. One of them, the doctor, is finishing his affairs there so he can live where he chooses and rest. He has thought carefully about your advice and means to settle nearby. Now Heidi will have two protectors close at hand. May both of them live a long time to share that duty.
        - id: ch04-b12
          speaker: grandmamma
          text: May God grant exactly that.
        - id: ch04-b13
          speaker: narrator
          text: Grandmamma warmly shook Grandfather's hand. Then she put an arm around Heidi and drew her close.
        - id: ch04-b14
          speaker: grandmamma
          text: I have a question for you too, dear Heidi. Is there something you especially wish for?
        - id: ch04-b15
          speaker: heidi
          text: Yes, there is!
          emotion: happy
        - id: ch04-b16
          speaker: grandmamma
          text: Then tell me what it is.
        - id: ch04-b17
          speaker: heidi
          text: I want the bed I slept in at Frankfurt, with the high pillows and the thick comforter. Then Grandmother won't have to lie with her head downhill, struggling to breathe. She'll be warm enough that she won't need her shawl in bed to keep from freezing.
        - id: ch04-b18
          speaker: narrator
          text: Heidi rushed through every word without stopping for breath. She wanted that bed for Grandmother with all her heart.
        - id: ch04-b19
          speaker: grandmamma
          text: My dear child, I had no idea Grandmother was suffering like that. You were right to remind me. In the middle of our own happiness, we forget what should come first. When God gives us special mercy, we should remember people who lack so much. I'll send a telegram to Frankfurt at once. Fraulein Rottenmeier will pack the bed today, and it will arrive in two days. God willing, Grandmother will soon sleep comfortably in it.
        - id: ch04-b20
          speaker: narrator
          text: Heidi skipped around Grandmamma in delight. Then she stopped short.
        - id: ch04-b21
          speaker: heidi
          text: I have to hurry down and tell Grandmother. She'll be worried because I haven't visited in so long.
        - id: ch04-b22
          speaker: narrator
          text: Heidi could not wait another moment to carry the news. She also remembered how distressed Grandmother had been during their last visit.
        - id: ch04-b23
          speaker: grandfather
          text: No, Heidi. You can't run back and forth when we have guests here.
        - id: ch04-b24
          speaker: grandmamma
          text: She isn't entirely wrong, Uncle. Poor Grandmother has gone without Heidi long enough because of us. Let's all visit her. My horse can meet me there, and the message can go from Dorfli at once. What do you think, son?
        - id: ch04-b25
          speaker: narrator
          text: Herr Sesemann asked his mother to wait while he explained his own plan. He had meant to take her on a short tour through Switzerland if Clara was strong enough to join them. Now he could enjoy Clara's company fully, and he did not want to waste the beautiful days at the end of summer.
        - id: ch04-b26
          speaker: herr_sesemann
          text: Let's stay in Dorfli tonight. Tomorrow I'll come back for Clara. Then the three of us can go to Ragatz and begin our trip from there.
        - id: ch04-b27
          speaker: narrator
          text: Clara was upset at first by the thought of leaving the mountain so soon. Still, the journey pleased her, and there was no time to sink into sadness.
        - id: ch04-b28
          speaker: narrator
          text: Grandmamma took Heidi's hand and started off, then suddenly remembered that Clara could not walk so far. She turned to ask what they would do and saw Grandfather already carrying Clara in his strong arms. Herr Sesemann followed last, and the whole party headed down the mountain.
    - id: ch05
      title: Good-Bye Till We Meet Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Heidi jumped for joy as she walked beside Grandmamma. Along the way, Grandmamma asked how Peter's grandmother lived, what she did, and how she managed through the freezing winters. Heidi knew every detail. She told her how the old woman huddled in her corner, trembling with cold, and exactly what food she had and what she went without.
        - id: ch05-b02
          speaker: narrator
          text: Grandmamma listened with sympathy until they reached the house. Brigitta was outside hanging Peter's second shirt in the sun, so it would be ready after he had worn the first one long enough. At the sight of the approaching party, she hurried indoors.
        - id: ch05-b03
          speaker: brigitta
          text: Mother, the whole group is coming past. They must all be going home. Uncle is with them, carrying the sick girl.
        - id: ch05-b04
          speaker: grandmother
          text: Oh, must it happen already? Did you see Heidi with them? Then they're taking her away. If only she could put her hand in mine once more. If only I could hear her voice again!
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: The door flew open. Heidi rushed to the corner and threw her arms around Grandmother.
        - id: ch05-b06
          speaker: heidi
          text: Grandmother! My bed from Frankfurt is coming here, with all three pillows and the thick comforter. Grandmamma says it will arrive in two days!
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: The words tumbled out because Heidi could hardly wait to see Grandmother's joy. The old woman smiled, though sadness remained in her voice.
        - id: ch05-b08
          speaker: grandmother
          text: She must be a truly kind lady. I ought to be glad that she's taking you with her, but I won't live long after you go.
          emotion: sad
        - id: ch05-b09
          speaker: grandmamma
          text: Who has been telling my good Grandmother such things? No one is taking Heidi away. She will stay here and make you happy. We want to see her again, but we will come to her. We hope to visit the Alm every year. On this mountain, God gave our child a miracle, and we have special reason to give thanks here.
          emotion: calm
        - id: ch05-b10
          speaker: narrator
          text: Grandmamma had followed Heidi inside and now held Grandmother's hand. Happiness lit the old woman's face. She pressed Grandmamma's hand again and again, unable to speak, while two large tears of joy rolled down her cheeks. When Heidi saw that change, her own happiness was complete.
        - id: ch05-b11
          speaker: heidi
          text: Grandmother, hasn't it happened just like the hymn I read last time? Isn't the bed from Frankfurt being sent to help you get well?
        - id: ch05-b12
          speaker: grandmother
          text: Yes, Heidi, and God has sent many other good things too. I never knew so many kind people would take such trouble for a poor old woman. When people show such goodness to someone useless like me, it makes me believe even more strongly in a loving Father in Heaven who never forgets the least of His creatures.
          emotion: happy
        - id: ch05-b13
          speaker: grandmamma
          text: My good Grandmother, all of us are equally poor and helpless before God. We all need Him to remember us. Now we must say good-bye, but only until we meet again. When we visit the Alm next year, you will be the first person we come to see. Until then, we will not forget you.
          emotion: calm
        - id: ch05-b14
          speaker: narrator
          text: Grandmamma shook her hand in farewell. Even then, Grandmother could not let her leave without thanking her again and asking God to give every blessing to her and everyone she loved.
        - id: ch05-b15
          speaker: narrator
          text: At last, Herr Sesemann and his mother continued down toward Dorfli. Grandfather carried Clara back up to the hut. Heidi went beside him, so delighted about Grandmother's coming bed that every step became a jump.
        - id: ch05-b16
          speaker: narrator
          text: The next morning brought many tears. Clara wept as she said good-bye to the beautiful mountain home where she had been happier than ever before. Heidi tried to comfort her.
        - id: ch05-b17
          speaker: heidi
          text: Summer will come again before you know it. Then you'll be back, and it will be even better because you can walk from the very first day. We can go out with the goats every morning, all the way to the flowers, and enjoy ourselves from the moment you arrive.
          emotion: calm
        - id: ch05-b18
          speaker: narrator
          text: Herr Sesemann had returned as promised to take Clara away. While he and Grandfather talked over the many things they still had to discuss, Clara dried her eyes. Heidi's words had made the parting a little easier.
        - id: ch05-b19
          speaker: clara
          text: Please say good-bye to Peter and all the goats for me, especially Little Swan. I wish I could give her something. She helped so much to make me strong.
          emotion: sad
        - id: ch05-b20
          speaker: heidi
          text: You could send her some salt. You know how she loves licking it from Grandfather's hand when she comes home at night.
        - id: ch05-b21
          speaker: clara
          text: Oh, then I'll send a hundred pounds of salt from Frankfurt! I want her to have something that will remind her of me.
          emotion: happy
        - id: ch05-b22
          speaker: narrator
          text: Herr Sesemann beckoned. It was time to leave. Grandmamma's white horse had been brought up for Clara, because no chair was needed now. Heidi ran to the far edge of the slope. She kept waving until the final glimpse of Clara and the white horse vanished from sight.
    - id: ch06
      title: Happiness in Dorfli
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The bed from Frankfurt arrived. Grandmother began sleeping so soundly through the night that she was certain to grow stronger.
        - id: ch06-b02
          speaker: narrator
          text: Grandmamma had also remembered the bitter mountain winter. She sent a large parcel filled with warm clothes. Now Grandmother could wrap herself up from every side, and she would no longer sit trembling with cold in her corner.
        - id: ch06-b03
          speaker: narrator
          text: Down in Dorfli, there was building everywhere. The doctor had arrived and was staying in his old rooms for the time being. His friends had urged him to buy the old house where Grandfather and Heidi lived during winter. Its high rooms and great stove, covered in beautifully painted tiles, showed that it had once belonged to a fine gentleman.
        - id: ch06-b04
          speaker: narrator
          text: The doctor was rebuilding one part for himself and repairing the other for Grandfather and Heidi. He understood Grandfather's independent nature and knew the old man wanted a home of his own. Behind the house, the workers were adding a warm, solid stall where the two goats could spend the winter in comfort.
        - id: ch06-b05
          speaker: narrator
          text: The doctor and Grandfather became better friends each day. As they walked around the building site and inspected the work, their thoughts always returned to Heidi. For both men, the best thing about the house was knowing that the cheerful child would be there with them.
        - id: ch06-b06
          speaker: doctor
          text: My dear friend, I believe you will understand this as I do. I share your happiness in Heidi almost as if I were the person closest to her after you. But I want to share the responsibility too and do everything I can for her.
        - id: ch06-b07
          speaker: doctor
          text: Then I will feel that I have a place in her life. I can look forward to having her near me and caring for me when I'm old. That is my heart's greatest wish. She will have the same claim on me as my own child, and I will provide for her that way. When the day comes for you and me to go, we can leave her without fear.
        - id: ch06-b08
          speaker: narrator
          text: Grandfather did not answer in words. He clasped the doctor's hand. In the old man's eyes, his friend could read how deeply moved, grateful, and glad he was.
        - id: ch06-b09
          speaker: narrator
          text: At that same moment, Heidi and Peter were sitting with Grandmother. Heidi had so much to tell, and the others were so eager to listen, that all three leaned closer and closer, hardly breathing for fear of missing a word.
        - id: ch06-b10
          speaker: narrator
          text: There was so much to say about everything that had happened through the summer. They had rarely been able to meet. Now they were together again, remembering one wonderful event after another, and it was hard to say which of the three looked happiest.
        - id: ch06-b11
          speaker: narrator
          text: Brigitta's face may have been happiest of all. With everyone explaining the story, she finally understood how Peter had come to receive one penny every week for the rest of his life.
        - id: ch06-b12
          speaker: grandmother
          text: Heidi, read me one of the hymns. For the rest of my life, I feel I can do nothing but thank our Father in Heaven for all the mercy He has shown us.
          emotion: happy
