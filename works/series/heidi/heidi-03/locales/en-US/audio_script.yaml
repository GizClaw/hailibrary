  chapters:
    - id: ch01
      title: "CHAPTER III. OUT WITH THE GOATS"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Early the next morning, a loud whistle woke Heidi. Sunlight streamed through the round window, laying golden rays across her bed and the great heap of hay. When she opened her eyes, the whole loft seemed to shine with gold. For a moment she stared around, wondering where she was. Then she heard her grandfather's deep voice outside, and everything came back to her. She had left her old home. Now she lived up on the mountain with Grandfather instead of old Ursula.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Ursula was nearly deaf and always cold. She spent every day beside the kitchen hearth or the sitting-room stove, and Heidi had to stay where the old woman could see her. If Heidi went out of sight, Ursula could not hear where she had gone. Many times, shut inside those four walls, Heidi had longed to run outdoors. So this morning she was overjoyed to wake in her new home. All the wonderful things she had seen yesterday were waiting outside, and best of all were the two dear goats.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Heidi jumped out of bed. She had so few clothes that dressing took only a few minutes. Then she climbed down the ladder and ran out of the hut. Peter was already there with his flock. Grandfather was leading his own two goats from the shed to join them. Heidi hurried over to say good morning to him and to the goats.
        - id: ch01-b04
          speaker: grandfather
          text: >-
            Would you like to go up the mountain with them?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Nothing could have pleased her more. Heidi answered by jumping for joy.
        - id: ch01-b06
          speaker: grandfather
          text: >-
            First you have to wash and make yourself neat. If you go out dirty, that bright sun overhead will laugh at you. Look. I've set everything out.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He pointed to a large tub of water standing in the sun by the door. Heidi ran to it and splashed and scrubbed until she gleamed. While she washed, Grandfather went into the hut and called Peter after him, telling the boy to bring his food bag. Peter obeyed, though he looked puzzled, and put down the little bag that held his meager dinner.
        - id: ch01-b08
          speaker: grandfather
          text: >-
            Open it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Grandfather placed a large piece of bread and an equally large piece of cheese inside. Peter's eyes widened. Each piece was twice the size of his own portion.
        - id: ch01-b10
          speaker: grandfather
          text: >-
            Now we only need the little bowl. Heidi isn't used to drinking straight from a goat the way you do. At dinner, milk two bowls for her. She's staying with you until you come back this evening. And mind that she doesn't tumble over any rocks. Do you hear me?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Just then Heidi came running in.
        - id: ch01-b12
          speaker: heidi
          text: >-
            Will the sun laugh at me now, Grandfather?
        - id: ch01-b13
          speaker: narrator
          text: >-
            She sounded worried. Grandfather had hung a rough towel beside the tub, and fear of the sun had made her scrub her face, arms, and neck so hard that she was red as a lobster. He gave a small laugh.
        - id: ch01-b14
          speaker: grandfather
          text: >-
            No. The sun won't find anything to laugh at now. But when you come home tonight, you'll have to get right into that tub like a fish. If you run around with the goats, your feet will be filthy. Off you go.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Heidi set off joyfully toward the mountain. The wind had swept every cloud away during the night. A deep blue sky stretched overhead, and the bright sun shone down across the green slopes. Everywhere she looked, flowers were opening their little blue and yellow cups and turning them toward the light as if they were smiling. Heidi ran one way, then another, calling out in delight at every new discovery. In one place, the ground was covered with soft red primroses. A little farther on, lovely gentians made the grass gleam blue. Rising above them all were the golden cistus flowers. Their tender leaves trembled, while their bright heads laughed and nodded in the breeze.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The whole bright field swayed around her, and Heidi was so enchanted that she forgot Peter and even the goats. First she ran far ahead. Then a new flash of color drew her off to the side. Each glowing patch of red or yellow seemed more tempting than the last. All the while she picked great handfuls and tucked them into her little apron. She wanted every flower she saw. Her plan was to carry them home and stick them all through the hay in the loft. Then, when she woke in the morning, her bedroom would look just like the flowering meadows outside.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Peter had to stay watchful. His round eyes were not quick, and now they had more work than they could manage. The goats were as lively as Heidi. They scattered in every direction, while Peter hurried after them, whistling, calling, and swinging his stick until he had brought the runaways together again.
        - id: ch01-b18
          speaker: peter
          text: >-
            Heidi! Where have you gone now?
        - id: ch01-b19
          speaker: heidi
          text: >-
            I'm here!
        - id: ch01-b20
          speaker: narrator
          text: >-
            The answer came from somewhere Peter could not see. Heidi was sitting at the foot of a little hill covered thickly with sweet-smelling prunella. Its fragrance filled the air. She had never smelled anything so lovely, and she sat among the flowers taking deep breaths.
        - id: ch01-b21
          speaker: peter
          text: >-
            Come over here! Your grandfather said you're not supposed to fall over the rocks.
        - id: ch01-b22
          speaker: heidi
          text: >-
            Where are the rocks?
        - id: ch01-b23
          speaker: narrator
          text: >-
            She still did not get up. Each breeze carried more of the sweet scent toward her.
        - id: ch01-b24
          speaker: peter
          text: >-
            Farther up. Way up there. We still have a long climb, so come on! And the old bird of prey sits on the very highest peak, croaking.
        - id: ch01-b25
          speaker: narrator
          text: >-
            That brought Heidi to her feet at once. She ran to Peter with her apron full of flowers, and they started climbing together.
        - id: ch01-b26
          speaker: peter
          text: >-
            You have enough now. If you keep picking, we'll be here forever. And if you take every flower today, there won't be any left tomorrow.
        - id: ch01-b27
          speaker: narrator
          text: >-
            That last reason made perfect sense to Heidi. Besides, her apron was already so full that another flower would hardly fit. She certainly did not want to leave herself nothing to pick tomorrow. From then on, she stayed beside Peter. The goats settled down too. They could smell the plants they loved on the higher slopes and climbed eagerly toward them without stopping.
        - id: ch01-b28
          speaker: narrator
          text: >-
            At last they reached the place where Peter always stopped for the day and let the goats graze. It lay directly below the high rocks. Bushes and fir trees climbed partway up their sides, but beyond the last trees, the bare and jagged summits rose into the sky. On one side of the mountain, the rock was torn open by deep clefts. A creature that wandered there could easily come to harm, so Grandfather had good reason to warn Peter about keeping Heidi safe. Peter slipped the food bag from his shoulder and searched for a protected spot. He tucked it carefully into a little hollow in the ground. He knew how suddenly the wind could strike at that height, and he had no wish to watch his precious bread and cheese go rolling down the mountainside. After the climb and all his chasing, he was tired. He dropped onto the warm ground and stretched out at full length.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Heidi untied her apron without spilling its load. She rolled the cloth carefully around the flowers and placed the bundle beside Peter's bag, safe inside the hollow. Then she sat near the boy and slowly looked around. The valley lay far, far below, washed in the clear morning sun. Straight ahead, a broad white snowfield rose high against the dark blue sky. To her left stood an enormous pile of rock. On each side of it, a bare and towering peak reached upward, so sharp and high that it seemed to pierce the blue. From where Heidi sat, the two peaks appeared to be looking sternly down at her.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Heidi sat perfectly still and let her eyes travel across the whole scene. A deep quiet lay over everything. The only movement came with the soft, light breaths of wind. They swayed the blue flower bells and the shining golden heads of the cistus, setting the blossoms nodding merrily on their slender stems. Peter had fallen asleep after his hard climb. Above them, the goats wandered among the bushes in search of leaves. Heidi had never known such happiness. She seemed to drink in the golden sunlight, the fresh mountain air, and the sweet smell of the flowers all at once. She could not imagine wanting anything more than to stay in that place forever. So the time passed without her noticing. From the valley, she had often lifted her eyes toward these distant mountains. Now that she sat among them, they no longer seemed distant at all. They seemed to have faces of their own, looking down at her like old friends.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Suddenly, a harsh cry sounded overhead. Heidi looked up. A bird larger than any she had ever seen was circling above her on great outspread wings. Round and round it wheeled, sending its sharp, croaking call down from the sky.
        - id: ch01-b32
          speaker: heidi
          text: >-
            Peter! Peter, wake up! The great bird is here. Look! Look!
          emotion: surprised
        - id: ch01-b33
          speaker: narrator
          text: >-
            Peter sat up at her call. Together they watched the bird climb higher and higher into the blue until it vanished behind the gray mountaintops.
        - id: ch01-b34
          speaker: heidi
          text: >-
            Where did it go?
        - id: ch01-b35
          speaker: peter
          text: >-
            Back to its nest.
        - id: ch01-b36
          speaker: heidi
          text: >-
            Does it live all the way up there? It must be wonderful to live so high! Why does it make that sound?
        - id: ch01-b37
          speaker: peter
          text: >-
            It can't help it.
        - id: ch01-b38
          speaker: heidi
          text: >-
            Let's climb up and find its nest.
        - id: ch01-b39
          speaker: peter
          text: >-
            Oh, no. No! No! Even the goats can't climb that high. And didn't Alm-Uncle say you weren't to fall over the rocks?
        - id: ch01-b40
          speaker: narrator
          text: >-
            Peter suddenly began to whistle and call so loudly that Heidi wondered what was happening. The goats understood. One after another, they came springing down the rocks until the whole flock had gathered on the green plateau. Some kept nibbling the juicy stems. Others skipped here and there or pushed their horns together in play.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Heidi jumped up and ran in and out among the flock. Watching goats play together like this was entirely new to her. One skipped past, another lowered its horns, and soon she was moving right along with them in their lively games. She was too delighted for words. As she played, she made the acquaintance of every goat in turn. To Heidi, they were not simply one flock. Each was its own creature, with a face and manner all its own, and she began noticing the special way every one of them behaved.
        - id: ch01-b42
          speaker: narrator
          text: >-
            While she watched them, Peter brought the food bag from its hollow. He laid the bread and cheese on the ground in a square. The two large pieces went on Heidi's side, the smaller ones on his. He knew exactly which belonged to each of them. Then he took the little bowl, milked it full from the white goat, and set it in the middle of the square.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Peter called Heidi, but gathering her took even more effort than gathering the goats. Their lively leaps and games had captured all her attention. She neither saw nor heard anything else. At last Peter shouted so loudly that the rocks echoed, and Heidi finally came. The moment she saw the feast arranged on the ground, she skipped around it for joy.
        - id: ch01-b44
          speaker: peter
          text: >-
            Stop jumping. It's dinnertime. Sit down and eat.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Heidi sat and looked once more at the neat square, with the bowl placed proudly in the center.
        - id: ch01-b46
          speaker: heidi
          text: >-
            Is that milk for me?
        - id: ch01-b47
          speaker: peter
          text: >-
            Yes. The two big pieces of bread and cheese are yours too. When you finish that milk, you get another bowl from the white goat. Then I get mine.
        - id: ch01-b48
          speaker: heidi
          text: >-
            Which goat gives you milk?
        - id: ch01-b49
          speaker: peter
          text: >-
            My own goat, the spotted one. Now go on and eat.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Heidi lifted the bowl and drank every drop. As soon as she set it down, Peter got up and filled it again. Heidi broke a piece from her bread. Then she held out the rest, which was still larger than Peter's whole piece, along with her entire slice of cheese.
        - id: ch01-b51
          speaker: heidi
          text: >-
            You take these. I have plenty.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Peter stared at her, too astonished to speak. In his whole life, he could never have given away food like that. For a moment he hesitated, unable to believe she meant it. Heidi kept holding out the bread and cheese. When he still did not take them, she laid them on his knees. Then Peter understood. He grabbed the food and nodded his thanks. That day he ate a finer dinner than he had ever known as a goat-herd.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Heidi kept watching the flock.
        - id: ch01-b54
          speaker: heidi
          text: >-
            Tell me every goat's name.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Peter knew every name by heart. He had very little else to keep in his head, so remembering the whole flock gave him no trouble. As each goat passed, he pointed it out and told Heidi what it was called. She listened with all her attention. It did not take long before she could pick out every goat for herself and call it by name. Once she knew what to look for, they were not hard to tell apart. Each had some habit or feature that belonged to it alone. A person only had to watch closely, and watching them was exactly what Heidi loved to do.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The big goat called the Turk had enormous horns and was always trying to butt the others. Most of the flock ran when they saw their rough companion coming. Only Greenfinch, a slim and nimble little goat, dared to face him. She would rush at him three or four times in a row with such speed and skill that the Turk often stopped in surprise. He did not dare attack again while Greenfinch stood ready, her sharp horns pointed toward him.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Then there was little White Snowflake. She bleated in such a sad, pleading way that Heidi had already run to her several times and held her head between her hands to comfort her. Now that pitiful little cry came again. Heidi jumped up, ran over, and put her arms around Snowflake's neck.
        - id: ch01-b58
          speaker: heidi
          text: >-
            What's wrong, little Snowflake? Why do you cry as if you're in trouble?
        - id: ch01-b59
          speaker: narrator
          text: >-
            Snowflake pressed close to Heidi as if she trusted her, and stopped bleating. Peter was still sitting over his bread and cheese when he called across to them.
        - id: ch01-b60
          speaker: peter
          text: >-
            She cries because the old goat isn't here. They sold her in Mayenfeld the day before yesterday, so she won't be coming up the mountain again.
        - id: ch01-b61
          speaker: heidi
          text: >-
            Who's the old goat?
        - id: ch01-b62
          speaker: peter
          text: >-
            Her mother, of course.
        - id: ch01-b63
          speaker: heidi
          text: >-
            Where's her grandmother?
        - id: ch01-b64
          speaker: peter
          text: >-
            She doesn't have one.
        - id: ch01-b65
          speaker: heidi
          text: >-
            And her grandfather?
        - id: ch01-b66
          speaker: peter
          text: >-
            She doesn't have one of those either.
        - id: ch01-b67
          speaker: heidi
          text: >-
            Oh, you poor little Snowflake! Don't cry anymore. I'll come up here with you every day, so you won't be alone. And if you need anything, you can come straight to me.
          emotion: calm
        - id: ch01-b68
          speaker: narrator
          text: >-
            The little goat rubbed her head contentedly against Heidi's shoulder and no longer gave those sorrowful bleats. When Peter finished eating, he joined Heidi and the flock. By then, she had learned a great deal about all the goats.
        - id: ch01-b69
          speaker: narrator
          text: >-
            She had decided that Grandfather's two, Little Swan and Little Bear, were by far the prettiest and best behaved. They carried themselves with a certain dignity and usually went their own way. As for the great Turk, they treated him as if he were not worth noticing.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Soon the goats began climbing the rocks again. Each searched for the plants it liked best, and each searched in its own fashion. Some bounded over every stone and bush in their path, refusing to stop until they reached the exact leaves they wanted. Others took their time. They moved carefully upward and cropped every good mouthful they found along the way. The Turk kept roaming among them and now and then gave a neighbor a jab with his horns. Little Swan and Little Bear were different. They climbed lightly, never missing the bushes with the choicest leaves. Once they found them, they balanced gracefully on their pretty legs and nibbled with delicate bites. Heidi stood with her hands clasped behind her back, studying every movement they made.
        - id: ch01-b71
          speaker: heidi
          text: >-
            Peter, Little Swan and Little Bear are the prettiest goats of all.
        - id: ch01-b72
          speaker: peter
          text: >-
            I know. Alm-Uncle brushes and washes them, and gives them salt. They have the best shed too.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Peter had stretched out on the ground again. All at once he sprang up and raced after the goats. Heidi ran behind him as fast as she could. She had to know what was wrong.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Peter plunged through the flock toward the side of the mountain where the rocks dropped straight down for a great distance. A careless goat that went too near could fall and break every leg. He had spotted the curious Greenfinch leaping that way, and he reached her only just in time. She had already jumped to the very edge.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Peter threw himself down and caught one of her hind legs. Greenfinch bleated furiously. She was angry to be held back from her exploring. She fought to escape and kept trying to leap forward so stubbornly that Peter could not get up. He feared he might pull her leg right off.
        - id: ch01-b76
          speaker: peter
          text: >-
            Heidi, come help me!
        - id: ch01-b77
          speaker: narrator
          text: >-
            Heidi was already beside them. She saw at once that both Peter and the goat were in danger. Quickly, she gathered a bunch of sweet-smelling leaves and held them beneath Greenfinch's nose.
        - id: ch01-b78
          speaker: heidi
          text: >-
            Come on, Greenfinch. Don't be naughty now. You could fall down there and break your leg. That would hurt terribly!
        - id: ch01-b79
          speaker: narrator
          text: >-
            The young goat turned around at once and began contentedly eating from Heidi's hand. Peter got to his feet and caught the band around Greenfinch's neck, where her bell hung. Heidi took hold of the other side. Together they led the wanderer back to the rest of the flock, which had gone on peacefully grazing.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Once Greenfinch was safe, Peter raised his stick to give her a hard beating as punishment. The goat saw what was coming and shrank back in fear.
        - id: ch01-b81
          speaker: heidi
          text: >-
            No, Peter! You can't hit her. Look how frightened she is!
        - id: ch01-b82
          speaker: peter
          text: >-
            She deserves it.
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: >-
            He lifted the stick again. Heidi threw herself against him. Her dark eyes flashed as she faced him.
        - id: ch01-b84
          speaker: heidi
          text: >-
            You have no right to touch her! You'll hurt her. Leave her alone!
          emotion: angry
        - id: ch01-b85
          speaker: narrator
          text: >-
            Peter stared at the commanding little figure in surprise. At last, and very unwillingly, he lowered his stick.
        - id: ch01-b86
          speaker: peter
          text: >-
            Fine. I'll let her off if you give me more of your cheese tomorrow.
        - id: ch01-b87
          speaker: narrator
          text: >-
            After the fright Greenfinch had given him, Peter meant to get something in return.
        - id: ch01-b88
          speaker: heidi
          text: >-
            You can have all my cheese tomorrow, and every day. I don't want it. I'll give you bread too, a big piece like the one you had today. But you have to promise never to beat Greenfinch, or Snowflake, or any of the goats.
        - id: ch01-b89
          speaker: peter
          text: >-
            All right. I don't care.
        - id: ch01-b90
          speaker: narrator
          text: >-
            That was Peter's way of accepting the bargain. He released Greenfinch, and she bounded joyfully back to her companions.
        - id: ch01-b91
          speaker: narrator
          text: >-
            All the while, without anyone noticing, the long day had been slipping toward its close. Now the sun hung near the high mountains and was just about to disappear behind them. Heidi sat on the ground once more. She had grown quiet and was gazing at the little blue, bell-shaped flowers. They glistened in the evening sun, while a sheet of golden light spread across the grass and every blossom around them. Then the rocks overhead began to change. A glow ran over their gray faces, growing brighter and warmer as Heidi watched. Suddenly, she could sit still no longer. She sprang to her feet.
        - id: ch01-b92
          speaker: heidi
          text: >-
            Peter! Peter! Everything is on fire! The rocks are burning, and the great snowy mountain, and the sky. Oh, look! That high rock is red with flames. Look at the beautiful, fiery snow! Get up, Peter! The fire has reached the great bird's nest. Look at the rocks and the fir trees. Everything is burning!
          emotion: surprised
        - id: ch01-b93
          speaker: peter
          text: >-
            It always looks like that. It isn't really fire.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Peter calmly went on peeling his stick. Heidi ran back and forth, looking first one way and then the other. She could not take in enough of the beautiful sight.
        - id: ch01-b95
          speaker: heidi
          text: >-
            Then what is it, Peter? What makes it happen?
        - id: ch01-b96
          speaker: peter
          text: >-
            It just turns that way by itself.
        - id: ch01-b97
          speaker: heidi
          text: >-
            Look! Now everything is turning rose-colored. See the mountain covered in snow, and the one with the tall pointed rocks? What are their names?
        - id: ch01-b98
          speaker: peter
          text: >-
            Mountains don't have names.
        - id: ch01-b99
          speaker: heidi
          text: >-
            Oh, it's beautiful! The snow is crimson, and there are so many roses high on the rocks. Oh! Now they're turning gray. Oh, no. All the color has faded. It's gone, Peter!
        - id: ch01-b100
          speaker: narrator
          text: >-
            The last rosy color drained away as she spoke. The snow lost its crimson shine. The roses vanished from the rocks, and the bright peaks turned cold and gray. Heidi sank to the ground and stared at them. Her face held such distress that anyone seeing her might have thought everything beautiful in the world had come to an end.
        - id: ch01-b101
          speaker: peter
          text: >-
            It'll come back tomorrow. Get up. We have to go home now.
        - id: ch01-b102
          speaker: narrator
          text: >-
            He whistled to the flock, and they all began the journey home.
        - id: ch01-b103
          speaker: heidi
          text: >-
            Does it happen every day? Will we see it whenever we bring the goats up here?
        - id: ch01-b104
          speaker: narrator
          text: >-
            Heidi climbed down beside Peter, waiting eagerly. She hoped with all her heart that he would say yes.
        - id: ch01-b105
          speaker: peter
          text: >-
            It happens most days.
        - id: ch01-b106
          speaker: heidi
          text: >-
            But will it happen tomorrow? Are you sure?
        - id: ch01-b107
          speaker: peter
          text: >-
            Yes, yes. It'll happen tomorrow for sure.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Heidi was happy again. Her mind was so full of new sights and thoughts that she said nothing more until they reached the hut. Grandfather sat beneath the fir trees. He had built himself a seat there and was waiting for his goats, which always came home by this side of the mountain.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Heidi ran toward him with the white and brown goats close behind. They knew their own master and their own stall. Peter called after her.
        - id: ch01-b110
          speaker: peter
          text: >-
            Come with me again tomorrow! Good night!
        - id: ch01-b111
          speaker: narrator
          text: >-
            He had more than one reason for wanting Heidi to return. She hurried back, took his hand, and promised to go. Then she made her way through the flock and put her arms around Snowflake's neck once more.
        - id: ch01-b112
          speaker: heidi
          text: >-
            Sleep well, Snowflake. Remember, I'll be with you again tomorrow. You don't have to bleat so sadly anymore.
          emotion: calm
        - id: ch01-b113
          speaker: narrator
          text: >-
            Snowflake looked at her in a friendly, grateful way, then went leaping happily after the other goats. Heidi returned to the fir trees. She began calling to Grandfather before she had even reached him.
        - id: ch01-b114
          speaker: heidi
          text: >-
            Oh, Grandfather, it was so beautiful! There was fire, and there were roses on the rocks, and blue and yellow flowers. Look what I brought you!
          emotion: happy
        - id: ch01-b115
          speaker: narrator
          text: >-
            She opened the apron that held her flowers and shook them out at his feet. But how they had changed. Heidi hardly recognized them. They looked like dry scraps of hay, and not one little flower cup remained open.
        - id: ch01-b116
          speaker: heidi
          text: >-
            Oh, Grandfather, what happened to them? They didn't look like this this morning. Why are they like this now?
          emotion: surprised
        - id: ch01-b117
          speaker: grandfather
          text: >-
            They like standing out in the sun. They don't like being shut inside an apron.
        - id: ch01-b118
          speaker: heidi
          text: >-
            Then I won't pick any more. But Grandfather, why did the great bird keep croaking?
        - id: ch01-b119
          speaker: grandfather
          text: >-
            Go take your bath while I fetch some milk. When we sit down to supper, I'll tell you about it.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Heidi obeyed. Later, she sat on her high stool with her bowl of milk and Grandfather beside her. The question was still waiting.
        - id: ch01-b121
          speaker: heidi
          text: >-
            Why does the great bird croak and scream down at us, Grandfather?
        - id: ch01-b122
          speaker: grandfather
          text: >-
            He's making fun of the people in the villages below. They crowd together and gossip, and they encourage one another to say and do wicked things. The bird calls down, "You'd be better off if you separated, went your own ways, and came up here to live on the heights like me!"
        - id: ch01-b123
          speaker: narrator
          text: >-
            A wild note entered the old man's voice. As Heidi listened, she could almost hear the bird's croak again, clearer than before.
        - id: ch01-b124
          speaker: heidi
          text: >-
            Why don't the mountains have names?
        - id: ch01-b125
          speaker: grandfather
          text: >-
            They do have names. Describe one to me. If I know it, I'll tell you what it's called.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Heidi described the rocky mountain with the two high peaks so exactly that Grandfather was delighted.
        - id: ch01-b127
          speaker: grandfather
          text: >-
            Yes, that's the one. I know it.
        - id: ch01-b128
          speaker: narrator
          text: >-
            He told her its name.
        - id: ch01-b129
          speaker: grandfather
          text: >-
            Did you see another one?
        - id: ch01-b130
          speaker: narrator
          text: >-
            Heidi told him about the mountain with the great snowfield. She explained how it had seemed to catch fire, then turned rosy red, then suddenly went pale when every bit of color disappeared.
        - id: ch01-b131
          speaker: grandfather
          text: >-
            I know that one too.
        - id: ch01-b132
          speaker: narrator
          text: >-
            He gave her its name as well.
        - id: ch01-b133
          speaker: grandfather
          text: >-
            So, did you enjoy your day with the goats?
        - id: ch01-b134
          speaker: narrator
          text: >-
            Then Heidi began at the morning and told him about the whole day. She spoke of the flowers, the goats, the high rocks, and everything that had delighted her. Yet she returned again and again to the fire that had burst across the mountains in the evening. That had been the greatest wonder of all. She needed to know where the fiery colors came from and why they vanished. Peter had not been able to explain any of it, so Heidi would not rest until Grandfather told her how it happened.
        - id: ch01-b135
          speaker: grandfather
          text: >-
            The sun does that. When it says good night to the mountains, it throws its most beautiful colors over them. That way, they won't forget the sun before it comes back the next day.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Heidi loved that answer. She could hardly wait for the next day, when she could climb with the goats again and watch the sun say good night to the mountains. But first she had to go to bed. All night she slept soundly on the hay, dreaming only of shining mountains covered in red roses. Among them, happy little Snowflake leaped in and out.
