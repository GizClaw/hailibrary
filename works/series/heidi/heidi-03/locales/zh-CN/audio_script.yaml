audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    grandfather:
      display_name: 外公
      tts:
        delivery: 简短沉稳，粗粝中渐渐透出关怀
        timbre: 低沉厚实
        pace: 不紧不慢
        pitch: 低音
    peter:
      display_name: 彼得
      tts:
        delivery: 朴实直率，话不多，偶尔带着孩子气的不耐烦
        timbre: 清亮略粗
        pace: 明快利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 清晨出发
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，一声响亮的口哨把海蒂叫醒了。阳光从圆窗照进来，一道道金光落在她的床上，也落在大垛干草上，整个干草棚都亮闪闪的。海蒂睁开眼，惊讶地四处看了看，一时想不起自己在哪儿。直到外面传来外公低沉的声音，她才慢慢记起来。她已经离开从前住的地方，到山上来和外公一起生活了。
        - id: ch01-b02
          speaker: narrator
          text: 从前，海蒂天天陪着老乌尔苏拉。老人耳朵很聋，又总是怕冷，不是守着厨房的炉火，就是坐在起居室的火炉旁。海蒂只要走出她的视线，她就听不出孩子去了哪里，所以海蒂只能一直待在四面墙里，心里却总盼着出去。现在，她在山上的新家醒来，昨天看到的新鲜事物，今天还能再看见。只要一想到那两只可爱的山羊，她就快活极了。
        - id: ch01-b03
          speaker: narrator
          text: 海蒂一下跳下床。她的衣服本来就没几件，没多久便穿好了。她爬下梯子，飞快地跑出门。彼得已经领着羊群等在那里，外公正把自家的两只山羊带出羊棚，让它们也走进羊群。海蒂跑过去，向外公和山羊们一一道早安。
        - id: ch01-b04
          speaker: grandfather
          text: 你想跟着它们一起上山吗？
        - id: ch01-b05
          speaker: narrator
          text: 海蒂高兴得跳了起来。这一下就是她的回答。
        - id: ch01-b06
          speaker: grandfather
          text: 那你得先把自己洗干净，收拾整齐。要不然，头顶这么亮的太阳看见你脏兮兮的，可要笑你了。你瞧，我都准备好了。
        - id: ch01-b07
          speaker: narrator
          text: 外公指了指门前的大木盆。木盆放在阳光下，里面装满了水。海蒂赶紧跑过去，又泼水又用力搓，直到把自己洗得干干净净。外公趁这时候进了小屋，也叫彼得拿着饭袋跟进来。彼得虽然觉得奇怪，还是把那个装着寒酸午饭的小口袋放了下来。
        - id: ch01-b08
          speaker: grandfather
          text: 把袋子打开。
        - id: ch01-b09
          speaker: narrator
          text: 外公往袋里放进一大块面包，又放了一块同样大的奶酪。彼得瞪圆了眼睛。那两块食物，无论哪一块，都有他自己的午饭两倍大。
        - id: ch01-b10
          speaker: grandfather
          text: 还少一只小碗。海蒂不会像你那样，直接凑到山羊身上喝奶。午饭时，你给她挤满两碗。今天她一直跟着你，到傍晚都由你照看。千万别让她从岩石上摔下去，听清楚了吗？
        - id: ch01-b11
          speaker: narrator
          text: 这时，海蒂跑了进来。外公已经在木盆旁挂好一条粗毛巾。她怕太阳真的取笑自己，便使劲擦脸、胳膊和脖子，擦得全身通红，简直像一只煮熟的龙虾。外公看着她，轻轻笑了一声。
        - id: ch01-b12
          speaker: heidi
          text: 外公，太阳现在还会笑我吗？
        - id: ch01-b13
          speaker: grandfather
          text: 不会了，它现在找不到什么可笑的。不过，今晚回来以后，你得像条鱼一样，整个人钻进木盆里。你跟山羊满山跑一天，两只脚一定会弄脏。好了，你们去吧。
    - id: ch02
      title: 花海里的山路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 海蒂欢欢喜喜地上山去了。夜风早把云吹得干干净净。深蓝的天空铺在头顶，明亮的太阳挂在当中，照着青翠的山坡。蓝花和黄花张开小小的花杯，抬起脸朝着太阳。海蒂一会儿跑到这边，一会儿又奔到那边，快活得一路欢呼。这里开着一大片娇嫩的红樱草，那里闪着龙胆花可爱的蓝光。再往高处看，叶片纤柔的金色岩蔷薇也在风里向她点头。五颜六色的花朵摇来摇去，叫她舍不得移开眼睛。
        - id: ch02-b02
          speaker: narrator
          text: 海蒂看花看得入了迷，连彼得和羊群都忘了。她一会儿跑在前面，一会儿又斜着奔到旁边。哪里出现一片鲜红或明黄，她就追到哪里。她大把大把地采花，全兜在小围裙里，打算带回家插在干草中间，让自己的卧室也像草地一样漂亮。彼得可忙坏了。他那双转动得不太灵便的圆眼睛，今天简直看不过来。山羊和海蒂一样活泼，全都四处乱跑。他只好跟在后面，不停吹口哨，大声呼唤，还要挥着木棍，把离群的山羊一只只赶回来。
        - id: ch02-b03
          speaker: peter
          text: 海蒂，你又跑到什么地方去了？
        - id: ch02-b04
          speaker: heidi
          text: 我在这儿！
        - id: ch02-b05
          speaker: narrator
          text: 声音不知从哪里传来，彼得却看不见她。原来，海蒂坐在一座小丘下面，四周长满芬芳的夏枯草，连空气里都是花香。她从没闻过这么好闻的气味，便坐在花丛里，一口接一口地深深吸气。
        - id: ch02-b06
          speaker: peter
          text: 快过来！你可不能从岩石上掉下去。你外公特意交代过我。
        - id: ch02-b07
          speaker: heidi
          text: 岩石在哪儿呢？
        - id: ch02-b08
          speaker: narrator
          text: 海蒂还是坐着没动。每一阵风送来的香气，好像都比前一阵更甜。
        - id: ch02-b09
          speaker: peter
          text: 还在高高的上面呢。我们要走的路长着呢，快来吧！最高的山峰上还蹲着那只老猛禽，一直呱呱地叫。
        - id: ch02-b10
          speaker: narrator
          text: 这句话立刻把海蒂叫了起来。她兜着满围裙的花，跑回彼得身边。两个人又一起往上爬。
        - id: ch02-b11
          speaker: peter
          text: 你采的花已经够多了。再采下去，今天永远也走不到山顶。要是今天把花全摘光，明天可就一朵也没有了。
        - id: ch02-b12
          speaker: narrator
          text: 海蒂听懂了最后这个道理。她的围裙也已经塞得满满的，几乎放不下另一朵花。明天没有花可采，那怎么行呢？于是，她不再离开彼得。山羊们也规矩了一些。它们闻到了高处那些爱吃的草木，急着赶过去，一刻不停地向上攀。
        - id: ch02-b13
          speaker: narrator
          text: 他们终于来到彼得平常歇息的地方。那里就在高高的岩壁脚下。岩壁下面长着灌木和冷杉，上面是光秃嶙峋的峰顶。山的一侧裂着一道道深沟，难怪外公一再叫彼得小心。彼得把饭袋放进地面的一处浅坑。他知道山上的风有多大，可不想让宝贵的午饭滚下山去。一路忙到这里，他已经累坏了，便往温暖的地上一躺，直挺挺地休息起来。
    - id: ch03
      title: 高坡上的新朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海蒂解开围裙，用它仔细包好采来的花，也把花放进浅坑，紧挨着彼得的饭袋。然后，她在躺倒的彼得身边坐下来，抬眼望向四周。山谷远在下方，泡在清晨的阳光里。正前方，大片雪原高高耸立在深蓝的天空下。左边堆着巨大的岩石，两旁各有一座光秃陡峭的山峰，像要刺进蓝天，沉沉地俯视着她。
        - id: ch03-b02
          speaker: narrator
          text: 海蒂一动不动，把四周的一切都看进眼里。天地间静极了。只有轻柔的风一阵阵吹过，蓝花的小铃铛和岩蔷薇金亮的花冠便在细茎上快活地点头。彼得已经累得睡着了。山羊们正在上方的灌木间攀来攀去，一会儿露出身影，一会儿又钻进叶丛。海蒂从来没有这么幸福过。金色的阳光照在身上，山间的空气又清新，花朵还不断送来甜香。她尽情感受着这一切，只想永远留在这里，再也没有别的愿望。
        - id: ch03-b03
          speaker: narrator
          text: 时间静静地过去。以前，海蒂常常待在谷底，只能从下面抬头仰望群山。现在，她已经来到山上，那些山好像都有了面孔，像相识很久的老朋友一样低头看着她。忽然，头顶传来一声粗厉的长鸣。海蒂抬头一看，一只从没见过的大鸟张开宽阔的翅膀，在高空一圈又一圈地盘旋，还不时从她头顶发出尖利沙哑的叫声。
        - id: ch03-b04
          speaker: heidi
          text: 彼得，彼得，快醒醒！那只大鸟来了！快看呀，快看！
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: 彼得听见她喊，坐了起来。两个人一起望着大鸟。它越飞越高，最后消失在灰色山峰的后面。
        - id: ch03-b06
          speaker: heidi
          text: 它飞到哪里去了？
        - id: ch03-b07
          speaker: peter
          text: 回窝里去了。
        - id: ch03-b08
          speaker: heidi
          text: 它的家真的在那么高的地方吗？住在那么高的地方，一定好极了！可它为什么一直那样叫？
        - id: ch03-b09
          speaker: peter
          text: 因为它就是忍不住要叫。
        - id: ch03-b10
          speaker: heidi
          text: 那我们爬上去，看看它的窝在哪儿吧。
        - id: ch03-b11
          speaker: peter
          text: 哎哟，哎哟，哎哟！连山羊都爬不到那么高。再说，大叔不是叫你千万别从岩石上摔下去吗？
        - id: ch03-b12
          speaker: narrator
          text: 彼得忽然吹起口哨，又扯开嗓子大喊，声音大得让海蒂不知道出了什么事。山羊们却全听懂了。它们一只接一只从岩石上跳下来，直到全都聚在绿色的平台上。有的还在嚼鲜嫩多汁的草茎，有的四处蹦跳，还有的拿角互相推撞着玩。
        - id: ch03-b13
          speaker: narrator
          text: 海蒂也跳起来，跑进羊群中间。她从没见过这么多山羊聚在一起玩，自己也跟着它们嬉闹。她挨个认识这些新朋友，很快看出每一只都有不同的模样、脾气和动作。彼得从浅坑里拿出饭袋，把面包和奶酪摆成一个四方形。大的两块放在海蒂那边，小的留给自己，谁吃哪一份，他分得清清楚楚。他又拿出小碗，从白山羊身上挤了香甜的新鲜羊奶，把碗放在四方形的正中间。
        - id: ch03-b14
          speaker: narrator
          text: 彼得叫海蒂来吃饭，可把她叫回来，竟然比召集山羊还难。她只顾看新伙伴们蹦跳玩耍，别的什么都看不见，也听不见。彼得只好放声大喊，连上面的岩壁都送回了他的声音。海蒂终于跑回来。她看见地上摆好的午餐，高兴得绕着食物跳个不停。
        - id: ch03-b15
          speaker: peter
          text: 别跳了，该吃午饭啦。快坐下来吃吧。
        - id: ch03-b16
          speaker: heidi
          text: 这碗牛奶是给我的吗？
        - id: ch03-b17
          speaker: narrator
          text: 海蒂坐下来，欢喜地看着那个漂漂亮亮的四方形。正中间的小碗，成了最显眼的装饰。
        - id: ch03-b18
          speaker: peter
          text: 是你的。两块大面包和大奶酪也是你的。你喝完这碗，我还要从白山羊那里再挤一碗给你，然后才轮到我。
        - id: ch03-b19
          speaker: heidi
          text: 那你喝哪一只山羊的奶？
        - id: ch03-b20
          speaker: peter
          text: 我喝自己家那只花山羊的。你先吃午饭吧。
        - id: ch03-b21
          speaker: narrator
          text: 海蒂端起小碗，一口气把奶喝光。她刚放下碗，彼得就站起来，又给她挤了满满一碗。海蒂从面包上掰下一小块，把剩下的面包和整块大奶酪都递给彼得。那块剩下的面包，还是比彼得自己完整的一块更大。
        - id: ch03-b22
          speaker: heidi
          text: 这些都给你吧。我有这么多，已经够吃了。
        - id: ch03-b23
          speaker: narrator
          text: 彼得惊讶得说不出话。他这一辈子，不管得到什么，都不会想到把它送给别人。他迟疑了一会儿，简直不敢相信海蒂是认真的。可她一直伸着手，后来见他不接，干脆把面包和奶酪放在他膝盖上。彼得这才明白，赶紧抓住食物，点头向她道谢。自从当上牧羊童，他还没吃过这么丰盛的一顿饭。
        - id: ch03-b24
          speaker: heidi
          text: 把它们的名字全都告诉我吧。
        - id: ch03-b25
          speaker: narrator
          text: 彼得熟悉每一只山羊的名字。他脑子里装的别的事情本来就不多，记起这些名字一点也不费力。他逐只指给海蒂看，一个个说给她听。海蒂听得很专心，没过多久，就能认出每一只，也能叫出它们的名字。每只山羊都有特别的地方，只要仔细看，就绝不会认错，而海蒂正是这样看着它们。
        - id: ch03-b26
          speaker: narrator
          text: 那只长着一对大角的，叫大土耳其佬。它总爱拿头撞别的山羊，大家看见它过来就躲开，谁也不想理这个粗鲁的伙伴。只有纤细灵巧的小绿雀敢和它较量。小绿雀会飞快地向它冲上三四回，每一下都又快又准，常常把大土耳其佬吓得站着不动。它知道，小绿雀还在对面等着再来一次，头上的角又尖得很。
        - id: ch03-b27
          speaker: narrator
          text: 还有一只小白雪花。它叫得又稚嫩又伤心，像是在苦苦求人。海蒂已经几次跑过去，捧着它的头安慰它。这时候，那凄切的叫声又响了起来。海蒂马上跑过去，抱住小山羊的脖子。
        - id: ch03-b28
          speaker: heidi
          text: 怎么啦，小白雪花？你为什么叫得这么伤心？是不是遇到什么难过的事了？
          emotion: sad
        - id: ch03-b29
          speaker: narrator
          text: 小白雪花信赖地紧紧靠着海蒂，不再叫了。彼得还坐在原处，他的面包和奶酪还没吃完，便隔着一段路朝她喊。
        - id: ch03-b30
          speaker: peter
          text: 它会这样叫，是因为那只老山羊不在了。前天，有人把老山羊卖到迈恩费尔德去了，她以后再也不会上山了。
        - id: ch03-b31
          speaker: heidi
          text: 老山羊是谁呀？
        - id: ch03-b32
          speaker: peter
          text: 当然是它妈妈。
        - id: ch03-b33
          speaker: heidi
          text: 那它的外婆呢？
        - id: ch03-b34
          speaker: peter
          text: 它没有外婆。
        - id: ch03-b35
          speaker: heidi
          text: 外公呢？
        - id: ch03-b36
          speaker: peter
          text: 也没有。
        - id: ch03-b37
          speaker: heidi
          text: 啊，可怜的小白雪花！以后别这样哭了。我每天都会上山来陪你，你就不会孤单了。要是有了什么事，只管来找我。
          emotion: calm
        - id: ch03-b38
          speaker: narrator
          text: 小山羊满足地用头蹭着海蒂的肩膀，再也没有发出哀伤的叫声。彼得终于吃完午饭，也走进羊群里。这时候，海蒂已经从他那里知道了许多山羊的事。她认定外公的两只山羊是羊群里最漂亮、最懂规矩的。它们举止神气，常常只走自己的路。大土耳其佬再粗鲁，它们也根本不放在眼里，甚至还有点瞧不起它。
    - id: ch04
      title: 险崖和燃烧的群山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 山羊们又开始往岩石上爬，用各自的办法寻找爱吃的植物。有的一路跳过碰到的所有东西，直到找到最中意的食物。有的走得格外仔细，把沿途的鲜嫩叶子一片片啃下来。大土耳其佬还是不时拿角去顶别的山羊。小天鹅和小熊轻巧地向上攀，总能找到最好的灌木。它们用四条秀气的腿稳稳站住，再慢慢细嚼叶片。海蒂背着双手站在一旁，把它们的每个动作都看在眼里。
        - id: ch04-b02
          speaker: heidi
          text: 彼得，所有山羊里，小天鹅和小熊最漂亮。
        - id: ch04-b03
          speaker: peter
          text: 我当然知道。阿尔姆大叔会给它们刷毛、洗澡，还喂它们吃盐。它们住的羊棚也是最好的。
        - id: ch04-b04
          speaker: narrator
          text: 彼得突然跳起来，急忙向山羊们追去。海蒂不知道出了什么事，也赶紧跟在后面。彼得穿过羊群，奔向山的另一侧。那里的岩壁直直落下去，深得吓人。哪只冒失的山羊靠得太近，就可能掉下去，把四条腿全摔断。
        - id: ch04-b05
          speaker: narrator
          text: 好奇的小绿雀正朝那边跳。彼得赶到时，它已经到了深渊边上，再晚一步就危险了。彼得顾不得别的，扑倒在地，一把抓住它的一条后腿。小绿雀突然被拽住，不能再往前探险，顿时气得大声咩叫。它拼命挣扎，一心要挣脱，还固执地往前跳。彼得趴在那里，既没法站起来，又怕继续使劲会把山羊的腿扯脱臼，只好大喊海蒂来帮忙。
        - id: ch04-b06
          speaker: narrator
          text: 海蒂跑到近前，一眼就看出彼得和小绿雀都有危险。她飞快地采下一把香喷喷的叶子，送到小绿雀鼻子下面，柔声哄它。
        - id: ch04-b07
          speaker: heidi
          text: 来，小绿雀，别再闹啦。你会从这里掉下去，把腿摔断的，那得多疼呀！
          emotion: calm
        - id: ch04-b08
          speaker: narrator
          text: 小绿雀马上转过身，满足地吃起海蒂手里的叶子。彼得趁机站起来，抓住它颈间系铃铛的带子。海蒂也从另一边抓住带子。两个人一起把这个乱跑的家伙领回了羊群。等小绿雀安全了，彼得举起木棍，打算狠狠揍它一顿。小绿雀看见木棍，害怕得缩起身子。
        - id: ch04-b09
          speaker: heidi
          text: 不行，彼得，你不能打它！你看，它已经吓成这样了！
        - id: ch04-b10
          speaker: peter
          text: 它就是该挨打。
        - id: ch04-b11
          speaker: narrator
          text: 彼得嘟囔着，又举起木棍。海蒂一下冲到他面前。她那双黑眼睛闪着怒火。
        - id: ch04-b12
          speaker: heidi
          text: 你不许碰它！它会疼的。把木棍放下！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: 彼得惊讶地看着这个威风凛凛的小不点，只好不情愿地放低木棍。
        - id: ch04-b14
          speaker: peter
          text: 好吧。要是你明天还给我奶酪，我就不打它。
        - id: ch04-b15
          speaker: narrator
          text: 刚才受了那么大一场惊吓，彼得总觉得自己该换回点什么。
        - id: ch04-b16
          speaker: heidi
          text: 全都给你！明天给你，以后每天也给你，反正我不想吃。我还会给你面包，和今天那块一样大。不过，你也得答应我，永远不许打小绿雀、小白雪花，也不许打别的山羊。
        - id: ch04-b17
          speaker: peter
          text: 好吧，我才不在乎呢。
        - id: ch04-b18
          speaker: narrator
          text: 这就算谈好了。彼得松开小绿雀，它立刻快活地跳回伙伴们中间。
        - id: ch04-b19
          speaker: narrator
          text: 不知不觉，一天已经走到尽头，太阳快要落到高山后面了。海蒂又坐在地上，静静望着蓝色的铃形花。它们在夕阳里闪闪发亮。花朵和草地都披着一层金光，高处的岩石也越来越亮，像是真的烧了起来。海蒂忽然跳起身。
        - id: ch04-b20
          speaker: heidi
          text: 彼得！彼得！到处都着火了！岩石烧起来了，大雪山和天空也着火了！你快看，上面那块高岩冒着红色火焰，连雪都烧红了！快起来呀！火已经烧到大鸟的窝了。岩石、冷杉，所有东西都着火了！
          emotion: surprised
        - id: ch04-b21
          speaker: peter
          text: 天天都是这样，其实根本没有着火。
        - id: ch04-b22
          speaker: narrator
          text: 彼得安安稳稳地坐着，手里还在削木棍。海蒂却来回跑着，一会儿看这边，一会儿望那边。这么美丽的景象，她怎么也看不够，只想弄明白眼前的一切。
        - id: ch04-b23
          speaker: heidi
          text: 那到底是什么？彼得，这到底是怎么回事？
        - id: ch04-b24
          speaker: peter
          text: 它自己就会变成这样。
        - id: ch04-b25
          speaker: heidi
          text: 快看，现在全变成玫瑰色了！你看那座雪山，再看那座有尖岩峰的山。它们叫什么名字？
          emotion: surprised
        - id: ch04-b26
          speaker: peter
          text: 山哪有什么名字。
        - id: ch04-b27
          speaker: heidi
          text: 太美了！雪变成了深红色，高处的岩石上像开满了玫瑰。啊，现在它们变灰了！颜色越来越暗……彼得，什么都没有了。
          emotion: sad
        - id: ch04-b28
          speaker: narrator
          text: 海蒂坐回地上，满脸难过，好像世上的一切真的全结束了。
        - id: ch04-b29
          speaker: peter
          text: 明天还会再来的。快起来吧，我们该回家了。
        - id: ch04-b30
          speaker: narrator
          text: 彼得吹响口哨，把山羊们召集起来。大家一起踏上归途。海蒂走在彼得身边，沿着山路往下走，心里急着想听见一个肯定的回答。
        - id: ch04-b31
          speaker: heidi
          text: 每天都会这样吗？以后我们天天带山羊上来，都能看见吗？
        - id: ch04-b32
          speaker: peter
          text: 大多数日子都能看见。
        - id: ch04-b33
          speaker: heidi
          text: 那明天一定会有吗？
        - id: ch04-b34
          speaker: peter
          text: 会，会，明天一定会有。
        - id: ch04-b35
          speaker: narrator
          text: 海蒂这才又快活起来。她的小脑袋里装满了这一天新见到的事，也装满了从没想过的新念头。她一边跟着羊群下山，一边安静地想着，一路没有再说话，直到他们回到小屋。
    - id: ch05
      title: 回家后的答案
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 外公坐在冷杉树下，那里摆着一张他搭好的座椅。他像平常一样，等着自家的山羊回家。海蒂向外公跑去，小天鹅和小熊跟在她后面。它们认得主人，也认得自己的羊棚。彼得留在后面，朝海蒂大声喊。
        - id: ch05-b02
          speaker: peter
          text: 明天还要跟我一起来！晚安！
        - id: ch05-b03
          speaker: narrator
          text: 彼得盼着她明天同行，理由可不止一个。海蒂赶紧跑回去，握了握他的手，答应第二天还和他一起上山。然后，她从挤挤挨挨的山羊中间穿过去，再一次搂住小白雪花的脖子，用轻柔安慰的声音和它道晚安。
        - id: ch05-b04
          speaker: heidi
          text: 好好睡吧，小白雪花。别忘了，我明天还会来陪你。所以，你不要再那么伤心地叫啦。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: 小白雪花亲热又感激地望了她一眼，便快活地跳着追上其他山羊。
        - id: ch05-b06
          speaker: narrator
          text: 海蒂回到冷杉树下，还没走到外公面前就喊了起来。她打开兜着花的围裙，把花全抖在外公脚边。可是，那些可怜的花已经完全变了样。早晨还那么鲜艳的颜色，现在暗淡下来。柔软的花茎全都弯了，花朵挤在一起，看上去只像一把干草。没有一只小花杯还张开着，海蒂几乎认不出它们了。
        - id: ch05-b07
          speaker: heidi
          text: 外公，山上美极了！有大火，岩石上开满玫瑰，还有蓝花和黄花。你快看，我都带回来了！咦，外公，它们怎么变成这样了？早上明明不是这样的呀！
          emotion: surprised
        - id: ch05-b08
          speaker: grandfather
          text: 它们喜欢站在外面的阳光里，不喜欢闷在围裙里面。
        - id: ch05-b09
          speaker: heidi
          text: 那我以后再也不摘花了。可是外公，那只大鸟为什么一直呱呱地叫？
        - id: ch05-b10
          speaker: grandfather
          text: 先去洗澡吧，我去挤奶。等我们坐下来吃晚饭，我再把这些都讲给你听。
        - id: ch05-b11
          speaker: narrator
          text: 海蒂听话地去洗了澡。后来，她坐在高凳上，面前放着一碗牛奶，外公就在她身边。她又问起那只大鸟。
        - id: ch05-b12
          speaker: heidi
          text: 外公，那只大鸟为什么总是呱呱叫，还朝着我们尖声喊呢？
        - id: ch05-b13
          speaker: grandfather
          text: 它在笑山下村庄里的人。那些人总挤在一起说长道短，还互相撺掇着去说坏话、做坏事。大鸟是在喊，你们为什么不各自分开，走自己的路，再像我一样到高处来生活呢？
        - id: ch05-b14
          speaker: narrator
          text: 老人说这些话时，声音里几乎带着一股山野间的狂放。海蒂仿佛又听见了那只大鸟的叫声，而且比先前听得更清楚。
        - id: ch05-b15
          speaker: heidi
          text: 那些山为什么没有名字？
        - id: ch05-b16
          speaker: grandfather
          text: 它们有名字。你把其中一座山的样子讲给我听。只要我认识，就告诉你它叫什么。
        - id: ch05-b17
          speaker: narrator
          text: 海蒂把那座长着两座高峰的岩山说得清清楚楚。外公听了很高兴。
        - id: ch05-b18
          speaker: grandfather
          text: 对，我知道你说的是哪一座。
        - id: ch05-b19
          speaker: narrator
          text: 外公告诉她山的名字，又问她还看见了什么。海蒂便说起那座铺着大片雪原的山。她讲那座山怎样燃烧起来，怎样变成玫瑰红，又怎样突然变得苍白，最后所有颜色都不见了。
        - id: ch05-b20
          speaker: grandfather
          text: 那一座我也知道。看来，你今天跟着山羊出去，玩得很开心吧？
        - id: ch05-b21
          speaker: narrator
          text: 外公也把那座山的名字告诉了她。海蒂接着把一整天的事情从头讲到尾。每一件事都那么有趣，而傍晚四处燃起的大火，她说得尤其仔细。彼得什么也解释不出来，所以她一定要外公告诉她，那究竟是怎么回事。
        - id: ch05-b22
          speaker: grandfather
          text: 那是太阳做的。太阳要向群山道晚安时，就把自己最美的颜色洒在它们身上。这样，等到第二天太阳回来以前，群山也不会忘记它。
        - id: ch05-b23
          speaker: narrator
          text: 海蒂听了，高兴极了。她几乎等不及第二天到来，好再跟着山羊爬上山，也看太阳怎样向群山道晚安。不过，现在她得先上床睡觉。整个夜里，她都在干草床上沉沉地睡着。梦里只有一座座闪亮的山。山上到处开满红玫瑰，快活的小白雪花正在花丛间跳进跳出。
