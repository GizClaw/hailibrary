  chapters:
    - id: ch01
      title: Afternoons with Grandmamma
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Every afternoon after dinner, Grandmamma sat beside Clara while the girl rested. Fraulein Rottenmeier disappeared into her own room at the same time, perhaps to rest too. Five minutes were enough for Grandmamma. She would get right back up and send for Heidi. In her room, she talked with the child, kept her busy, and found all sorts of ways to amuse her.
        - id: ch01-b02
          speaker: narrator
          text: Grandmamma owned many pretty dolls. She taught Heidi to sew dresses and pinafores for them, using a marvelous collection of cloth in every color one could imagine. Before long, Heidi could make all kinds of beautiful clothes for the little figures. Grandmamma also enjoyed hearing her read aloud. The more tales Heidi read, the more she loved them. She entered so fully into the characters' lives that they felt like dear friends, and being with them brought her more and more pleasure.
        - id: ch01-b03
          speaker: narrator
          text: Yet through all those afternoons, Heidi never looked truly happy. The old brightness had gone from her eyes. During the last week of Grandmamma's visit, Heidi came to her room after dinner as usual, with the book tucked under her arm. Grandmamma drew her close, set the book aside, and looked at her carefully.
        - id: ch01-b04
          speaker: grandmother
          text: Now, Heidi, tell me why you're unhappy. Is the same trouble still weighing on your heart?
        - id: ch01-b05
          speaker: narrator
          text: Heidi nodded.
        - id: ch01-b06
          speaker: grandmother
          text: Have you told God about it?
        - id: ch01-b07
          speaker: heidi
          text: Yes.
        - id: ch01-b08
          speaker: grandmother
          text: And do you ask Him every day to make things right and help you feel happy again?
        - id: ch01-b09
          speaker: heidi
          text: No. I stopped praying.
        - id: ch01-b10
          speaker: grandmother
          text: Oh, Heidi, don't tell me that! Why did you stop?
          emotion: surprised
        - id: ch01-b11
          speaker: heidi
          text: It doesn't do any good. God doesn't listen. There are so many people in Frankfurt praying to Him every night. He can't pay attention to all of them, and He certainly didn't hear me.
        - id: ch01-b12
          speaker: grandmother
          text: What makes you so certain He didn't hear you?
        - id: ch01-b13
          speaker: heidi
          text: I asked for the same thing every day for weeks, and God still hasn't done it.
    - id: ch02
      title: The Right Time
      blocks:
        - id: ch02-b01
          speaker: grandmother
          text: That's where you're mistaken, Heidi. You mustn't think of God that way. He is a good father to all of us, and He understands what is best for us better than we do. Sometimes we ask for something that wouldn't be good for us. Then He doesn't give us that thing. If we keep praying earnestly instead of running away and losing our trust, He gives us something better.
          emotion: calm
        - id: ch02-b02
          speaker: grandmother
          text: God knew that what you wanted wasn't right for you just yet. But He heard every word. He can see and hear everyone at once because He is God, not a human being like you or me. Perhaps He said, “Yes, Heidi will have what she asks for, but only when the right time comes. Then she can be completely happy.”
          emotion: calm
        - id: ch02-b03
          speaker: grandmother
          text: Suppose He gave you your wish now, and one day you discovered that having your own way had not been best for you. You might cry, “If only God hadn't given me what I asked for! It isn't as good as I thought.” So God watches over you. He waits to see if you'll trust Him, pray every day, and turn to Him for everything you need.
          emotion: calm
        - id: ch02-b04
          speaker: grandmother
          text: But while God has been watching over you, you've run away from Him. You stopped praying and forgot all about Him. When God no longer hears a familiar voice among all those praying, He lets that person go their own way and discover how foolish it was. Then trouble comes, and the person cries, “Save me, God! No one else can help me.” And God asks, “Why did you leave Me? I couldn't help you while you were running away.”
        - id: ch02-b05
          speaker: grandmother
          text: You wouldn't want to grieve God when He only wants to be kind to you, would you? Go ask Him to forgive you. Keep praying and trusting Him. You can be sure He'll make everything right and happy for you, and your heart will feel light again.
          emotion: calm
        - id: ch02-b06
          speaker: narrator
          text: Heidi trusted Grandmamma completely. Every word went straight into her heart.
        - id: ch02-b07
          speaker: heidi
          text: I'll go right now and ask God to forgive me. I'll never forget Him again.
        - id: ch02-b08
          speaker: grandmother
          text: That's right, dear child. Don't be unhappy. He'll grant everything you wish when the right time comes.
          emotion: calm
        - id: ch02-b09
          speaker: narrator
          text: Heidi ran away to pray. She asked that she might always remember God and that God would keep thinking of her.
    - id: ch03
      title: The Book and the Tears
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The day came for Grandmamma to leave. It was a sad day for Clara and Heidi, but Grandmamma was determined to make it feel as much like a holiday as she could. She kept the girls so lively and entertained that they had no time to brood until her carriage actually drove away.
        - id: ch03-b02
          speaker: narrator
          text: After that, the house felt silent and empty. Heidi and Clara had no idea what to do with themselves. They sat together for the rest of the day like two lost children.
        - id: ch03-b03
          speaker: narrator
          text: The next afternoon, Heidi came in carrying her book. She offered to read aloud to Clara every day if Clara wanted her to. Clara agreed. At least it would be pleasant for that afternoon. Heidi began with her usual eagerness, but she did not get far. The tale opened with a grandmother who was dying.
        - id: ch03-b04
          speaker: heidi
          text: Oh! Then Grandmamma is dead!
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: Heidi burst into tears. Everything she read felt so real that she believed the story meant the grandmother back home. Her sobs grew harder.
        - id: ch03-b06
          speaker: heidi
          text: She's dead! I'll never see her again, and she never got even one of the white rolls!
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: Clara did everything she could to explain that the tale was about an entirely different grandmother. At last, Heidi understood. Still, she could not stop crying. Now another fear had seized her. The grandmother at home might die, and Grandfather might die too, while Heidi was so far away. If she stayed gone too long, she might return to a place where everything was silent and dead. She would be all alone and never see the people she loved again.
        - id: ch03-b08
          speaker: narrator
          text: Fraulein Rottenmeier came into the room while Heidi was still weeping, and Clara told her what had happened. The lady quickly lost patience. She walked up to Heidi and spoke with firm decision.
        - id: ch03-b09
          speaker: rottenmeier
          text: Adelaide, that is quite enough of this pointless crying. Listen carefully. If you make another scene like this while reading, I will take the book away, and you will not have it again.
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: The threat worked at once. Heidi turned pale with fear. The book was her one great treasure. She hurried to dry her tears and swallowed her sobs as well as she could, so no one would hear another sound.
    - id: ch04
      title: Silent Homesickness
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: From then on, Heidi never cried aloud over anything she read. Often she had to fight hard to hold back her tears. Clara would watch her face twist with the effort.
        - id: ch04-b02
          speaker: clara
          text: Heidi, what strange faces you're making! I've never seen anything like them.
        - id: ch04-b03
          speaker: narrator
          text: The faces made no noise, so they did not bother Fraulein Rottenmeier. After struggling through each fresh wave of misery, Heidi would settle herself and quietly read on for a while. No one around her understood the sorrow she was hiding.
        - id: ch04-b04
          speaker: narrator
          text: Heidi lost all her appetite. She grew so pale and thin that Sebastian felt miserable whenever he looked at her. He could not bear to see her refuse every delicious dish he placed before her. Sometimes he bent close and spoke in a kind, fatherly whisper, trying to persuade her to eat.
        - id: ch04-b05
          speaker: sebastian
          text: Try just a little. You don't know how good it is. Here, one nice spoonful. Now one more.
        - id: ch04-b06
          speaker: narrator
          text: Nothing helped. Heidi barely ate. The moment she put her head down at night, she saw home before her eyes. She buried her face in the pillow and wept so no one could hear.
        - id: ch04-b07
          speaker: narrator
          text: Many weeks went by. Heidi could not tell whether it was winter or summer. The walls around her and the view from the windows never seemed to change. She almost never went beyond the house. Once in a while, Clara felt well enough for a drive, but the carriage could travel only a short way because Clara could not bear the motion for long.
        - id: ch04-b08
          speaker: narrator
          text: Even then, the girls saw little except elegant streets, tall houses, and crowds of people. They rarely made it past them. Grass and flowers, fir trees and mountains, all remained far away. Heidi's longing for the familiar beauty of home grew stronger every day. A single word that reminded her of it could bring tears to the edge of her eyes, and she had to struggle to keep them back.
        - id: ch04-b09
          speaker: narrator
          text: Autumn passed, and winter passed too. Once again, sunlight shone on the white walls of the houses across the way. Heidi thought the time must have come for Peter to lead the goats out again. The golden cistus flowers would be glowing in the sun, and at sunset all the rocks around them would seem to catch fire.
        - id: ch04-b10
          speaker: narrator
          text: Heidi would sit in a corner of her lonely room and cover her eyes with both hands so she could not see the sunlight on the opposite wall. There she stayed without moving, silently fighting her terrible homesickness until Clara sent for her again.
