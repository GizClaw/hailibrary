audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    grandmother:
      display_name: 祖母
      tts:
        delivery: 慈爱爽朗，机敏风趣，说话亲切而有主见
        timbre: 温暖明亮，带着年长女性的柔和质感
        pace: 从容自然，劝慰时舒缓
        pitch: 中音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 祖母的劝告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 祖母来访的这些日子，每天下午吃过饭，她都会先陪正在休息的克拉拉坐上几分钟。罗滕迈尔小姐大概也要歇一歇，早就回自己的房间去了。可祖母只坐五分钟就又起身，叫人把海蒂带到她那里。
        - id: ch01-b02
          speaker: narrator
          text: 祖母总有各种办法让海蒂忙起来，也让她高兴。她拿出许多漂亮的洋娃娃，教海蒂给它们缝裙子和围裙。她收藏的碎布什么颜色都有，块块都很美。海蒂就拿这些布练习针线，为一个个小人儿做出了各式衣裳。
        - id: ch01-b03
          speaker: narrator
          text: 祖母也爱听海蒂朗读。故事读得越多，海蒂就越喜欢它们。书里的人仿佛成了她亲爱的朋友。走进他们的生活，陪着他们，让她越来越快乐。可她终究没有真正快活起来，那双眼睛再也不见从前明亮的神采。
        - id: ch01-b04
          speaker: narrator
          text: 转眼到了祖母来访的最后一个星期。一天午饭后，她照常叫海蒂过来。孩子胳膊下夹着书走进房间。祖母把她唤到身边，又把书放在一旁。
        - id: ch01-b05
          speaker: grandmother
          text: 来，孩子，告诉我，你为什么不快乐？心里还是在为那件事发愁吗？
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: 海蒂点了点头。
        - id: ch01-b07
          speaker: grandmother
          text: 你把这件事告诉上帝了吗？
        - id: ch01-b08
          speaker: heidi
          text: 告诉了。
        - id: ch01-b09
          speaker: grandmother
          text: 那你每天都祷告，请他把事情安排好，让你重新快乐起来吗？
        - id: ch01-b10
          speaker: heidi
          text: 没有。我已经不祷告了。
        - id: ch01-b11
          speaker: grandmother
          text: 海蒂，别这么说！你为什么停下来了？
          emotion: surprised
        - id: ch01-b12
          speaker: heidi
          text: 祷告也没有用，上帝根本不听。法兰克福有那么多人，每天晚上都在向他祷告，他哪里能每个人都顾得上呢？他一定没有听见我说的话。
        - id: ch01-b13
          speaker: narrator
          text: 海蒂越说越激动。祖母便问她，为什么能这样肯定。
        - id: ch01-b14
          speaker: heidi
          text: 我一连几个星期，每天都求同一件事，可上帝一直没有照我的请求去做。
        - id: ch01-b15
          speaker: grandmother
          text: 你想错了，海蒂。上帝是我们大家慈爱的父亲。他比我们自己更清楚，什么才真正对我们有益。要是我们求的东西并不好，他不会把它给我们。只要我们继续诚心祷告，不逃开，也不失去信任，他会给我们更好的东西。
          emotion: calm
        - id: ch01-b16
          speaker: grandmother
          text: 上帝觉得，你求的那件事，现在还不适合立刻实现。不过，你要相信他已经听见了。上帝不是你我这样的凡人。他能同时看见每个人，也能听见每个人说话。
          emotion: calm
        - id: ch01-b17
          speaker: grandmother
          text: 他知道，暂时不让你得到想要的东西，对你反而更好。所以他会说，好吧，海蒂会得到她所求的，只是要等合适的时候。那样，她才能真正快乐。
          emotion: calm
        - id: ch01-b18
          speaker: grandmother
          text: 要是我现在就依了她，将来有一天，她发现不照自己的意思来才更好，就会哭着说，要是上帝没有答应我就好了，结果根本不像我盼的那么好！
          emotion: calm
        - id: ch01-b19
          speaker: grandmother
          text: 上帝一直看顾着你。他在等着看，你会不会信任他，会不会每天继续祷告，无论想要什么都来求他。可你却转身跑开，不再祷告，还把他忘了。
          emotion: calm
        - id: ch01-b20
          speaker: grandmother
          text: 那么多祷告的声音里，要是上帝再也听不见一个熟悉的声音，他就会让那个人照自己的意思走，好让他明白自己有多傻。等那个人遇到苦难，就会喊，上帝啊，救救我吧，再没有别人能帮我了！
          emotion: calm
        - id: ch01-b21
          speaker: grandmother
          text: 上帝便会问，你为什么离开我？你自己跑开了，我怎么帮助你呢？上帝只想善待你，你一定不愿让他伤心吧？去求他宽恕，再继续祷告，继续信任他。你放心，他会把一切安排妥当，让你重新快乐起来。到那时，你又会轻松快活了。
          emotion: calm
        - id: ch01-b22
          speaker: narrator
          text: 海蒂全心信任祖母。她说的每一个字，都深深落进了孩子心里。
        - id: ch01-b23
          speaker: heidi
          text: 我马上去求上帝宽恕。以后，我再也不会忘记他了。
          emotion: sad
        - id: ch01-b24
          speaker: grandmother
          text: 这就对了，亲爱的孩子。别再难过。到了合适的时候，他会实现你的愿望。
          emotion: calm
        - id: ch01-b25
          speaker: narrator
          text: 海蒂跑回去祷告。她求自己永远记得上帝，也求上帝继续惦记着她。
    - id: ch02
      title: 祖母离开以后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 祖母离开的日子终于到了。克拉拉和海蒂都很伤心，可祖母决意把这一天过得像个节日，不许她们闷闷不乐。她不停地想办法逗两个孩子，让她们一直有说有笑。直到马车真的把祖母载走，她们才来得及为离别难过。
        - id: ch02-b02
          speaker: narrator
          text: 祖母一走，整座房子忽然又静又空。海蒂和克拉拉不知道还能做些什么，只好像两个迷路的孩子一样，呆呆地坐完了这一天。
        - id: ch02-b03
          speaker: narrator
          text: 第二天，两个人相伴的时间到了。海蒂夹着书走进来，问克拉拉，愿不愿意让她每天下午继续读书给她听。克拉拉答应了，心想至少今天听一听也好。海蒂便像往常一样，兴致勃勃地读起来。
        - id: ch02-b04
          speaker: narrator
          text: 可她没有读多久。故事刚讲到一位祖母快要去世，海蒂就突然大叫起来。
        - id: ch02-b05
          speaker: heidi
          text: 啊！那奶奶已经死了！
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: 她放声痛哭。在海蒂心里，读到的事情都像真的一样。她以为故事里死去的就是家里的奶奶，越想越伤心，只顾一遍遍哭喊。
        - id: ch02-b07
          speaker: heidi
          text: 她死了，我再也见不到她了！她连一个白面包卷都没有吃到！
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 克拉拉想尽办法解释，说故事讲的是另一位祖母，跟家里的奶奶完全不是一个人。海蒂好不容易相信了，却还是怎么也停不下眼泪。
        - id: ch02-b09
          speaker: narrator
          text: 因为她又想到，自己离家这样远，也许奶奶真的会去世，甚至爷爷也会去世。要是她过很久才能回去，也许那里已经一片寂静，所有人都不在了。到那时，只剩下她孤零零一个，再也见不到自己最爱的人。
        - id: ch02-b10
          speaker: narrator
          text: 罗滕迈尔小姐已经来到房间。克拉拉把事情告诉了她。海蒂还在哭，那位女士越来越不耐烦，便走到她面前，用不容争辩的口气开了口。
        - id: ch02-b11
          speaker: rottenmeier
          text: 够了，阿德莱德！不许再这样无缘无故地哭闹。我只说这一次。以后你读书时再闹成这样，我就把书收走，再也不许你拿到。
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 这番话立刻起了作用。海蒂吓得脸色发白。那本书是她唯一的珍宝。她赶紧擦掉眼泪，拼命把抽泣咽回去，不让任何声音漏出来。
    - id: ch03
      title: 无声的眼泪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 罗滕迈尔小姐的威胁果然管用。从那以后，无论读到什么，海蒂都不敢再哭出声。可是有时候，她得费很大的力气才能忍住眼泪。她的脸也会跟着皱起来，看得克拉拉十分惊奇。
        - id: ch03-b02
          speaker: clara
          text: 海蒂，你的脸怎么扭成这样？我从来没见过这种怪样子！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 好在那些怪脸一点声音也没有，不会惹恼罗滕迈尔小姐。海蒂熬过那阵绝望的悲伤，便又安静地读上一会儿，谁也看不出她心里的痛苦。
        - id: ch03-b04
          speaker: narrator
          text: 可海蒂再也没有胃口。她脸色越来越苍白，身体也越来越瘦。塞巴斯蒂安看见她这样，心里很不好受。每次端上好菜，她都不肯吃，他实在不忍心，只好像一位慈爱的父亲那样轻声哄她。
        - id: ch03-b05
          speaker: sebastian
          text: 吃一点吧，你不知道这有多好吃。来，满满一勺，再吃一勺。
          emotion: calm
        - id: ch03-b06
          speaker: narrator
          text: 可还是没有用，海蒂几乎什么都吃不下。每天晚上，她的头刚挨到枕头，家乡的景象便回到眼前。她只能把脸埋进枕头里哭，不让人听见。
    - id: ch04
      title: 遥远的群山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就这样，许多个星期过去了。海蒂分不清外面是冬天还是夏天。她从窗里看出去，只能望见墙壁和窗户，景象从来没有变化。
        - id: ch04-b02
          speaker: narrator
          text: 只有在克拉拉身体难得好些，可以坐车出门时，海蒂才能离开这座房子。可克拉拉受不了长时间的颠簸，她们走不出多远。眼前无非还是一条又一条漂亮的街道，一幢又一幢高大的房屋，还有来来往往的人群。
        - id: ch04-b03
          speaker: narrator
          text: 她们几乎从来看不到城市的尽头。青草、鲜花、枞树和群山，始终远得像在天边。海蒂越来越想念那些熟悉而美丽的东西。现在，她只要在书里碰到一个会让她想起家乡的词，泪水就会涌上来。她每次都得拼命忍住。
        - id: ch04-b04
          speaker: narrator
          text: 秋天过去，冬天也过去了。太阳又照上对面房屋雪白的墙。海蒂便想，彼得现在一定又赶着山羊出门了。金色的岩蔷薇正在阳光里闪亮。到了黄昏，四周的岩石又会像燃烧起来一样。
        - id: ch04-b05
          speaker: narrator
          text: 海蒂走到寂寞的房间角落里坐下，用双手蒙住眼睛。她不愿再看那片落在白墙上的阳光。她就这样一动不动，默默抵挡着可怕的乡愁，直到克拉拉又派人来叫她。
