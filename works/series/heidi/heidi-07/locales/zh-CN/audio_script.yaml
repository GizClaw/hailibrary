audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    tinette:
      display_name: 蒂内特
      tts:
        delivery: 冷淡简短，语气里带着不耐烦
        timbre: 清脆偏冷
        pace: 稍快
        pitch: 中高音
    tutor:
      display_name: 家庭教师
      tts:
        delivery: 谨慎克制，说理时平稳周全
        timbre: 温和端正
        pace: 不紧不慢
        pitch: 中音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
    organ_boy:
      display_name: 手摇风琴男孩
      tts:
        delivery: 寡言实际，回答干脆利落
        timbre: 稍显粗哑的少年声
        pace: 简短偏快
        pitch: 中高音
    tower_keeper:
      display_name: 守塔老人
      tts:
        delivery: 起初暴躁，心软以后亲切直爽
        timbre: 苍老浑厚
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第七章　罗滕迈尔小姐难熬的一天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海蒂来到法兰克福后的第一个早晨，一睁眼，竟想不起自己在哪里。她揉揉眼睛，坐起来四处看。这是一间又宽又大的屋子，自己躺在靠墙的高高白床上。阳光从两幅长得出奇的白窗帘间透进来。窗边摆着两把椅子，椅套上开满硕大的花朵，旁边的沙发也蒙着同样的花布，沙发前还有一张圆桌。墙角的盥洗架上，放着好多她从没见过的东西。忽然，她全想起来了。这里是法兰克福，昨天的事情也一件件回到了脑子里。最后，就连罗滕迈尔小姐说过的规矩，她也想起了自己听进去的那一部分。
        - id: ch01-b02
          speaker: narrator
          text: 海蒂跳下床，穿好衣服，马上从一扇窗跑到另一扇窗。她想看看外面的天空和田野，可那两幅沉重的窗帘挡在眼前，简直像一只鸟笼。她用力去拉，窗帘却太重，只好从下面钻过去，挨到窗前。窗台又高得出奇，她踮起脚，也只能勉强把脑袋探过窗台。可她最想看的景色，一样也没有。无论跑到哪扇窗前，眼里都只有墙、窗户，又是墙、又是窗户。海蒂不由得害怕起来。
        - id: ch01-b03
          speaker: narrator
          text: 时候还早。往常在山上，海蒂一早就会跑出门，看看天蓝不蓝，太阳有没有爬过山头，枞树是不是迎着风摆动，花儿是不是已经睁开眼睛。如今，她就像一只刚关进明亮新笼子的鸟，扑到这边，又扑到那边，把每一道栏杆都试一遍，只想重新飞回广阔的天地。她用力推这扇窗，又去抬那扇窗，连小手指都塞到窗框底下试过了，可窗户一动不动。她心里只想着，外面一定有青草，远处的山坡上一定还留着没有融尽的雪。她实在不能忍受眼前永远只有墙和窗。
        - id: ch01-b04
          speaker: narrator
          text: 忙了好一阵，海蒂只好放弃。她想绕到屋外去找草地，可又记起昨晚在大门前看见的只有石头。这时有人敲门，蒂内特探进了头。
        - id: ch01-b05
          speaker: tinette
          text: 早餐已经准备好了。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂根本不知道，这句话是叫她去吃饭。可蒂内特的脸色冷冰冰的，一看就不欢迎别人追问。海蒂看懂了，便从桌下拖出一只小凳，搬到墙角坐好，安静地等着。没多久，门外传来一阵衣裙的窸窣声，罗滕迈尔小姐忙忙乱乱地走了进来，脸上又带着怒气。
        - id: ch01-b07
          speaker: rottenmeier
          text: 阿德莱德，你坐在这里做什么？连叫你吃早餐都听不懂吗？快跟我来！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 这回海蒂听明白了，立刻跟上去。克拉拉已经在桌边等了一阵，亲切地向她问好。克拉拉的脸色比往常明快许多，她正盼着今天再发生些新鲜事。早餐安安静静地吃完了。海蒂规规矩矩地吃了黄油面包。随后，克拉拉被推回书房，罗滕迈尔小姐叫海蒂也跟去，陪她等到家庭教师来上课。
        - id: ch01-b09
          speaker: heidi
          text: 在这里，要怎么才能看到外面，还能一直看到下面的地面呢？
        - id: ch01-b10
          speaker: clara
          text: 把窗户打开，再往外看就行了呀。
        - id: ch01-b11
          speaker: heidi
          text: 可是那些窗户根本打不开。
          emotion: sad
        - id: ch01-b12
          speaker: clara
          text: 窗户能开的。你打不开，我也打不开，不过等塞巴斯蒂安来了，你请他帮忙就好。
        - id: ch01-b13
          speaker: narrator
          text: 原来窗户真的能开，也真的能看见外面。海蒂一下轻松了许多，她刚才还觉得自己简直像被关进了牢房。克拉拉接着问起她的家乡，海蒂高高兴兴地说起山、羊群，还有开满鲜花的草地。那些全是她最最舍不得的地方。
        - id: ch01-b14
          speaker: narrator
          text: 这时，家庭教师已经到了。罗滕迈尔小姐却没有领他进书房，而是先拉他到餐厅，把满肚子的烦恼都倒了出来。她说，自己先前写信告诉塞泽曼先生，克拉拉很想有个伴。她也觉得有个伙伴很好，既能陪克拉拉上课，叫她更用功，也能陪她玩。其实她心里还有一个念头。有了伴，自己就不用时时陪着生病的姑娘解闷了，因为这件事有时实在让她吃不消。
        - id: ch01-b15
          speaker: narrator
          text: 塞泽曼先生回信答应了，不过有一个条件。他说，必须把来的孩子当作自己的女儿看待，绝不能让任何孩子受欺负、受折磨。
        - id: ch01-b16
          speaker: rottenmeier
          text: 这句话根本多余。谁会想去折磨孩子呢！
        - id: ch01-b17
          speaker: narrator
          text: 她接着告诉家庭教师，自己被人骗得有多惨。这个孩子已经做出了那么多叫人难以想象的事。老师不仅得从字母开始教，连每天怎样生活，都得从最简单的规矩讲起。照她看来，只有一条路能摆脱这场灾难。家庭教师必须说，两个孩子不能一起学习，否则一定会耽误远远领先的克拉拉。有了这个理由，塞泽曼先生准会同意把海蒂送回家。可先生知道孩子已经到了，她不敢不经允许就送走她。
        - id: ch01-b18
          speaker: tutor
          text: 我看还是不要急着下结论。小姑娘也许有些事情学得晚，却可能在别的事情上懂得更多。只要认真教上一阵，她很快就能赶上来。
        - id: ch01-b19
          speaker: narrator
          text: 家庭教师说话十分谨慎，并不肯偏听一面。罗滕迈尔小姐见他不愿帮自己，还准备认真教海蒂认字，只好打开书房门，让他进去。他刚跨过门槛，她就飞快地把门关上，自己留在餐厅，因为她对从字母开始教人这件事实在深恶痛绝。她在餐厅来回踱步，琢磨着该让仆人怎样称呼阿德莱德。先生说要待这孩子和亲生女儿一模一样，她想，这条规矩尤其该由仆人遵守。
        - id: ch01-b20
          speaker: narrator
          text: 她还没想多久，书房里忽然传来一声吓人的巨响，紧接着，里面的人慌乱地喊起塞巴斯蒂安。罗滕迈尔小姐冲进去一看，书本、练习簿、墨水瓶和别的东西全倒在地上，桌布乱糟糟地盖在最上面。一股黑墨水正从底下淌出来，流过地板。海蒂却不见了。
        - id: ch01-b21
          speaker: rottenmeier
          text: 看看这里成了什么样！桌布、书、针线篮，全泡在墨水里了！一定又是那个倒霉孩子干的！
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 家庭教师难过地望着满地狼藉。这种事无论怎么想，也很难往好处想。克拉拉倒很喜欢这场少见的变故，兴致勃勃地看着眼前的结果。
        - id: ch01-b23
          speaker: clara
          text: 是海蒂弄的，可她真的不是故意的，千万别罚她。她刚才突然跳起来，急着往外跑，桌布被她一带，东西才全倒了。街上正好有好多车经过，她大概从没见过马车，所以才跑得那么快。
        - id: ch01-b24
          speaker: rottenmeier
          text: 我不是早就说了吗？她什么都不懂，连上课该坐好听讲都不知道！可这个闯祸的孩子去哪儿了？她不会逃走了吧？我要怎么向塞泽曼先生交代？
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 罗滕迈尔小姐一面担心海蒂真的逃走，一面又怕没法向塞泽曼先生交代。她跑出书房，急急冲下楼梯。海蒂就在楼下敞开的大门口，站在那里惊奇地朝街道两边张望。
        - id: ch01-b26
          speaker: rottenmeier
          text: 你在这里做什么？怎么能一声不响地跑出来？
          emotion: angry
        - id: ch01-b27
          speaker: heidi
          text: 我刚才听见枞树的声音了，可我怎么也找不到它们。现在，那声音又听不见了。
          emotion: sad
        - id: ch01-b28
          speaker: narrator
          text: 海蒂失望地望向马车声传来的地方。那阵隆隆声听起来太像南风吹过枞树了，她心里一高兴，就飞跑出来寻找。
        - id: ch01-b29
          speaker: rottenmeier
          text: 枞树？你以为这里是树林吗？真是荒唐！跟我上楼，看看你闯出了什么祸！
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 海蒂转过身，乖乖跟着她回到楼上。一看见地上的书本、桌布和黑墨水，她吃惊极了。方才她只顾着奔向枞树，根本不知道自己把桌上的东西全拖了下来。
        - id: ch01-b31
          speaker: rottenmeier
          text: 这是第一次，我就原谅你。要是再有第二次，我可不会算了。记住，上课必须坐着别动，好好听讲。你若做不到，我就把你绑在椅子上。听明白了吗？
        - id: ch01-b32
          speaker: heidi
          text: 听明白了。我以后上课一定不乱动。
        - id: ch01-b33
          speaker: narrator
          text: 海蒂这才知道，上课时安静坐好也是一条规矩。塞巴斯蒂安和蒂内特被叫来收拾摔坏的东西，把房间重新整理好。家庭教师向大家道过早安便离开了，这一天已经没法再继续上课。经过这一番忙乱，这一早晨当然也完全没有留给人打呵欠的工夫。
        - id: ch01-b34
          speaker: narrator
          text: 每天下午，克拉拉都得休息一阵。罗滕迈尔小姐告诉海蒂，这段时间她可以随意玩耍。午饭后，克拉拉被安置在长椅上，女管家也回了自己的房间。海蒂知道，选择自己游戏的时候终于到了，这正是她一直盼着的机会。她早就打定主意要办一件事，只是要办成还需要别人帮忙。于是她站到餐厅门外的过厅里，专门等着截住自己要找的人。
        - id: ch01-b35
          speaker: narrator
          text: 几分钟后，塞巴斯蒂安从厨房上来，手里托着银茶具，要把它们收进餐厅的柜子。海蒂迎上去，照罗滕迈尔小姐教她的规矩，十分郑重地称呼他。塞巴斯蒂安很惊讶，口气也不大好。
        - id: ch01-b36
          speaker: sebastian
          text: 小姐想要什么？
        - id: ch01-b37
          speaker: heidi
          text: 我只是想问你一件事，不是早晨那种坏事。
        - id: ch01-b38
          speaker: narrator
          text: 海蒂以为塞巴斯蒂安还在生墨水的气，很想让他高兴一点。
        - id: ch01-b39
          speaker: sebastian
          text: 是吗？那你先告诉我，为什么要那样称呼我？
        - id: ch01-b40
          speaker: heidi
          text: 是罗滕迈尔小姐吩咐的。她说，每次跟你讲话都得那样叫你。
        - id: ch01-b41
          speaker: narrator
          text: 塞巴斯蒂安笑了。海蒂却很惊讶，她完全没听出哪里好笑。塞巴斯蒂安明白她只是在服从命令，声音也亲切起来。
        - id: ch01-b42
          speaker: sebastian
          text: 那么，这位小姐到底想要什么呢？
        - id: ch01-b43
          speaker: heidi
          text: 我不叫小姐，我叫海蒂。
        - id: ch01-b44
          speaker: sebastian
          text: 这倒没错。可还是那位女士，她也吩咐我要称你小姐。
        - id: ch01-b45
          speaker: heidi
          text: 是这样吗？那我只好也叫小姐了。现在，我一共有三个名字啦。
        - id: ch01-b46
          speaker: narrator
          text: 海蒂顺从地接受了这个新名字，又叹了口气。她已经看出来，在这座房子里，罗滕迈尔小姐说什么，什么就是规矩。塞巴斯蒂安则继续走进餐厅，把托盘里的银茶具一件件收进柜子。
        - id: ch01-b47
          speaker: sebastian
          text: 那么，小小姐究竟想问什么？
        - id: ch01-b48
          speaker: heidi
          text: 窗户要怎样才能打开？
        - id: ch01-b49
          speaker: sebastian
          text: 就是这样开呀！
        - id: ch01-b50
          speaker: narrator
          text: 塞巴斯蒂安一下推开一扇大窗。海蒂跑过去，可她的头顶只够到窗台，根本望不出去。塞巴斯蒂安搬来一只高木凳，让她站上去看下面的动静。海蒂爬上凳子，以为这次终于能看到自己盼望的景色，却很快一脸失望地缩回了头。
        - id: ch01-b51
          speaker: heidi
          text: 外面怎么只有石头铺的街道？塞巴斯蒂安，要是绕到房子的另一边，又能看到什么呢？
          emotion: sad
        - id: ch01-b52
          speaker: sebastian
          text: 还是这些，和你现在看到的一样。
        - id: ch01-b53
          speaker: heidi
          text: 那我要去哪里，才能从高处把整座山谷都看见呢？
        - id: ch01-b54
          speaker: sebastian
          text: 你得爬上一座很高的塔，比如教堂的塔。瞧见那边顶上有金球的塔了吗？站到那里，能望出去很远很远。
        - id: ch01-b55
          speaker: narrator
          text: 海蒂立刻从凳子上下来，跑出门，冲下台阶，来到街上。从窗口看，那座塔离得那么近，她还以为只要跑过马路就能到。可她沿着一整条街跑到底，塔还是一点也没有变近，后来连塔影也看不见了。她拐进另一条街，走了又走，依旧找不到。身边经过了许许多多的人，可每个人都行色匆匆。海蒂觉得，他们一定忙得连停下来指路的时间都没有。
        - id: ch01-b56
          speaker: narrator
          text: 到了一个街角，她忽然看见一个男孩。男孩背着手摇风琴，手臂上还抱着一只模样古怪的动物。海蒂赶紧跑过去。
        - id: ch01-b57
          speaker: heidi
          text: 顶上有金球的那座塔在哪里？
        - id: ch01-b58
          speaker: organ_boy
          text: 我不知道。
        - id: ch01-b59
          speaker: heidi
          text: 那我要问谁，才能找到一个给我带路的人？
        - id: ch01-b60
          speaker: organ_boy
          text: 我不知道。
        - id: ch01-b61
          speaker: heidi
          text: 那你知道别的教堂吗？要有高高的塔。
        - id: ch01-b62
          speaker: organ_boy
          text: 我倒是知道一座。
        - id: ch01-b63
          speaker: heidi
          text: 那就请你带我去吧。
        - id: ch01-b64
          speaker: organ_boy
          text: 先让我看看，你愿意拿什么来换。
        - id: ch01-b65
          speaker: narrator
          text: 男孩伸出手。海蒂摸遍口袋，掏出一张画着红玫瑰花环的卡片。那是克拉拉早晨刚送给她的，她盯着看了一会儿，实在舍不得。可只要登上塔，她就能看见山谷，还有一片片青翠的山坡了。
        - id: ch01-b66
          speaker: heidi
          text: 我把这张卡片给你，你想要吗？
        - id: ch01-b67
          speaker: narrator
          text: 男孩缩回手，摇了摇头。海蒂倒很高兴，又把卡片收回口袋。
        - id: ch01-b68
          speaker: heidi
          text: 那你到底想要什么？
        - id: ch01-b69
          speaker: organ_boy
          text: 我想要钱。
        - id: ch01-b70
          speaker: heidi
          text: 我没有钱，不过克拉拉有，她一定肯给我。你要多少呢？
        - id: ch01-b71
          speaker: organ_boy
          text: 我要两个便士。
        - id: ch01-b72
          speaker: heidi
          text: 那我们现在就走吧。
        - id: ch01-b73
          speaker: narrator
          text: 两个孩子一起上路。海蒂边走边问男孩背的是什么。男孩告诉她，那是手摇风琴，只要转动把手，就会奏出好听的乐曲。不知不觉，他们来到一座古老的教堂前，教堂有一座高塔。男孩停住脚步。
        - id: ch01-b74
          speaker: organ_boy
          text: 就是这座教堂。
        - id: ch01-b75
          speaker: heidi
          text: 可大门紧紧关着，我要怎么进去呢？
        - id: ch01-b76
          speaker: organ_boy
          text: 我不知道。
        - id: ch01-b77
          speaker: heidi
          text: 你说，我能不能像在家里叫塞巴斯蒂安那样摇铃？
        - id: ch01-b78
          speaker: organ_boy
          text: 我不知道。
        - id: ch01-b79
          speaker: narrator
          text: 海蒂已经看见墙上的铃，便使足力气拉了起来。
        - id: ch01-b80
          speaker: heidi
          text: 我上塔的时候，你得留在这里。我不认识回去的路，还要靠你带我回家。
        - id: ch01-b81
          speaker: organ_boy
          text: 那你准备再给我什么？
        - id: ch01-b82
          speaker: heidi
          text: 你还想要什么呢？
        - id: ch01-b83
          speaker: organ_boy
          text: 我还要两个便士。
        - id: ch01-b84
          speaker: narrator
          text: 门里传来钥匙转动的声音。沉重的大门吱嘎一声，被人拉开了。一位老人走出来，起先只是惊讶，接着便生起气来。
        - id: ch01-b85
          speaker: tower_keeper
          text: 你们怎么这样把我从塔上叫下来？铃上明明写着“供登塔者使用”，难道你们不认识字吗？
          emotion: angry
        - id: ch01-b86
          speaker: narrator
          text: 男孩一言不发，只伸手指着海蒂。
        - id: ch01-b87
          speaker: heidi
          text: 可我本来就是想登塔呀。
        - id: ch01-b88
          speaker: tower_keeper
          text: 你上塔干什么？是谁让你来的？
        - id: ch01-b89
          speaker: heidi
          text: 没有人让我来。我只是想爬上去，从高处往下看。
        - id: ch01-b90
          speaker: tower_keeper
          text: 快回家吧，别再用这种花样叫我下来。要是再有一次，我可不会这么轻易放过你！
          emotion: angry
        - id: ch01-b91
          speaker: narrator
          text: 老人转身要关门，海蒂却抓住他的外衣，眼巴巴地求他。
        - id: ch01-b92
          speaker: heidi
          text: 请让我上去一次吧，就这一次。
        - id: ch01-b93
          speaker: narrator
          text: 老人回头看见她恳切的眼睛，马上心软了。他牵起海蒂的手，声音也和气下来。
        - id: ch01-b94
          speaker: tower_keeper
          text: 好吧，你既然这么想上去，我就带你去。
        - id: ch01-b95
          speaker: narrator
          text: 男孩在教堂台阶上坐下来，表示自己会留在原地等候。海蒂牵着老人的手，爬上塔里一级又一级的台阶。台阶越往上越小，最后一段窄得很。等这一段也爬完，他们终于到了塔顶。老人抱起海蒂，让她从敞开的窗口望出去。
        - id: ch01-b96
          speaker: tower_keeper
          text: 好了，现在你能往下看了。
        - id: ch01-b97
          speaker: narrator
          text: 海蒂脚下铺开了一片屋顶、尖塔和烟囱的海洋。她马上把头缩了回来。
        - id: ch01-b98
          speaker: heidi
          text: 这里跟我想的完全不一样。
          emotion: sad
        - id: ch01-b99
          speaker: tower_keeper
          text: 现在你知道了吧？像你这么小的孩子，哪里懂什么叫风景。走吧，我们下楼去，以后别再摇我的铃了！
        - id: ch01-b100
          speaker: narrator
          text: 老人把海蒂放到地上，自己走在前面，沿着窄楼梯往下走。转过一处弯，台阶渐渐宽了。左边有一道门，通向守塔人的住处。门外的平台贴着房间向前伸，一直伸到陡斜的屋顶边缘。平台尽头放着一只大篮子，篮子前面蹲着一只灰色的大猫。它一看见有人经过，就发出警告的低吼，不许他们碰自己的一家。
        - id: ch01-b101
          speaker: narrator
          text: 海蒂站住了。她从没见过这么大的一只猫，惊奇得挪不开眼睛。其实，这座古老的高塔里到处都是老鼠，大猫每天随随便便就能捉上半打当晚餐。老人见海蒂看得出神，便安慰她。
        - id: ch01-b102
          speaker: tower_keeper
          text: 有我在这里，大猫不会伤害你。过来看看那些小猫吧。
        - id: ch01-b103
          speaker: narrator
          text: 海蒂走到篮子边，立刻欢喜地叫起来。七八只小猫在里面爬来爬去，滚作一团，你压着我，我又绊倒你。海蒂从篮子这边跳到那边，生怕错过任何一只小猫的有趣模样。
        - id: ch01-b104
          speaker: heidi
          text: 它们真可爱！这些小猫多招人喜欢呀！
          emotion: happy
        - id: ch01-b105
          speaker: tower_keeper
          text: 你想带一只回去吗？
        - id: ch01-b106
          speaker: narrator
          text: 老人看着她这么开心，自己也很快活。
        - id: ch01-b107
          speaker: heidi
          text: 真的可以给我一只，让我自己养吗？
          emotion: surprised
        - id: ch01-b108
          speaker: tower_keeper
          text: 当然可以。你想多拿几只也行。只要有地方养，把这一篮子全带走都可以。
        - id: ch01-b109
          speaker: narrator
          text: 老人早就希望不用再费什么心，便能把这些小猫送出去。海蒂高兴得简直待不住了。塞泽曼先生家的房子那么大，当然有足够的地方养下它们。她又想到，克拉拉一看见这些可爱的小东西，一定会又惊讶又欢喜。
        - id: ch01-b110
          speaker: heidi
          text: 可是，我要怎么把它们带回家呢？
        - id: ch01-b111
          speaker: narrator
          text: 她急忙伸出手，想看看一次能抱走几只。老猫却凶猛地扑过来，吓得她连忙退后。
        - id: ch01-b112
          speaker: tower_keeper
          text: 你告诉我送到哪儿，我可以替你带过去。
        - id: ch01-b113
          speaker: narrator
          text: 老人抚摸着大猫，让它安静。这只猫是他的老朋友，已经在塔里陪了他许多年。
        - id: ch01-b114
          speaker: heidi
          text: 送到塞泽曼先生家。那是一座大房子，大门上有个金色的狗头，嘴里还衔着一个圆环。
        - id: ch01-b115
          speaker: narrator
          text: 其实老人根本不需要这么详细的说明。他守塔已经很多年，附近每一座房子都认识，而且塞巴斯蒂安还是他的熟人。
        - id: ch01-b116
          speaker: tower_keeper
          text: 我知道那座房子。可我什么时候送去，又该找谁呢？你肯定不是那一家的人吧？
        - id: ch01-b117
          speaker: heidi
          text: 我不是那家的人，可我把小猫带回去，克拉拉一定会特别高兴。
        - id: ch01-b118
          speaker: narrator
          text: 老人想下楼了，海蒂却舍不得离开篮子里的热闹景象。
        - id: ch01-b119
          speaker: heidi
          text: 要是现在就能带走一两只多好！一只给我，一只给克拉拉，可以吗？
        - id: ch01-b120
          speaker: tower_keeper
          text: 好吧，你稍等一下。
        - id: ch01-b121
          speaker: narrator
          text: 老人小心地把大猫引进自己的房间，让它留在一碗食物旁边。等他出来关好门，便叫海蒂拿两只小猫。海蒂高兴得两眼发亮，先抱起一只白猫，又抱起一只身上带着黄白条纹的小猫。她把白猫放进右边口袋，把条纹小猫放进左边口袋，这才心满意足地跟着老人下了楼。
        - id: ch01-b122
          speaker: narrator
          text: 男孩仍坐在教堂台阶上。老人关上教堂大门，海蒂便问起回家的路。
        - id: ch01-b123
          speaker: heidi
          text: 回塞泽曼先生家应该走哪边？
        - id: ch01-b124
          speaker: organ_boy
          text: 我不知道。
        - id: ch01-b125
          speaker: narrator
          text: 海蒂把大门、台阶和窗户的样子说了一遍，男孩还是摇头。她又想了想，换了一种说法。
        - id: ch01-b126
          speaker: heidi
          text: 从家里一扇窗户往外看，能看见一座非常非常大的灰房子。它的屋顶是弯弯折折的，就像我现在用手指画的这样。
        - id: ch01-b127
          speaker: narrator
          text: 海蒂伸出食指，在空中画出一道曲折的线。男孩一下跳起来。看来，他很习惯照着这样的标志找路。他拔腿往前跑，海蒂紧紧跟着，没过多久，两人便来到那扇有大狗头门环的门前。海蒂摇响门铃，塞巴斯蒂安很快就开了门。他一见是海蒂，立刻催她快些进去。
        - id: ch01-b128
          speaker: narrator
          text: 海蒂一跃进门，塞巴斯蒂安马上把门关好，完全没注意那个男孩还留在台阶上，正惊奇地望着他们。
        - id: ch01-b129
          speaker: sebastian
          text: 快一点，小小姐，直接去餐厅！大家已经在吃饭了，罗滕迈尔小姐现在就像一门装满火药的大炮。小小姐怎么会独自跑出去呢？
        - id: ch01-b130
          speaker: narrator
          text: 海蒂走进餐厅。罗滕迈尔小姐没有抬头，克拉拉也没出声，屋里静得叫人不安。塞巴斯蒂安替海蒂拉开椅子。她刚坐稳，罗滕迈尔小姐便板着脸，十分严厉地开了口。
        - id: ch01-b131
          speaker: rottenmeier
          text: 阿德莱德，你的事情，我稍后再谈。现在我只说这一点。你没有得到允许，也没告诉任何人，就这样跑出家门，还在外面游荡到现在，实在太没规矩、太不像话了。我从来没听说过这种行为！
          emotion: angry
        - id: ch01-b132
          speaker: narrator
          text: 她话音刚落，海蒂的口袋里便传出一声细细的“喵”。
        - id: ch01-b133
          speaker: rottenmeier
          text: 阿德莱德，你做错了事，竟然还敢把我的话当成玩笑，这样回答我？
          emotion: angry
        - id: ch01-b134
          speaker: heidi
          text: 真的不是我在叫呀！
        - id: ch01-b135
          speaker: narrator
          text: 两只口袋里又接连响起两声“喵”。塞巴斯蒂安差点摔了手里的菜盘，赶紧冲出房间。
        - id: ch01-b136
          speaker: rottenmeier
          text: 够了！你马上站起来，离开这间屋子！
          emotion: angry
        - id: ch01-b137
          speaker: narrator
          text: 海蒂害怕地站起来，还想再解释，可她才说了半句，口袋里又响起三声急急的猫叫。
        - id: ch01-b138
          speaker: clara
          text: 海蒂，你明明看见罗滕迈尔小姐生气了，为什么还要不停地学猫叫呢？
        - id: ch01-b139
          speaker: heidi
          text: 不是我，是小猫在叫。
        - id: ch01-b140
          speaker: rottenmeier
          text: 什么？小猫？塞巴斯蒂安！蒂内特！快找到那些可怕的小东西，把它们拿走！
          emotion: fearful
        - id: ch01-b141
          speaker: narrator
          text: 罗滕迈尔小姐站起来，逃进书房，反锁了房门。这下她就能保证小猫不会靠近自己了。在她眼里，小猫简直是世上最可怕的东西。
        - id: ch01-b142
          speaker: narrator
          text: 塞巴斯蒂安不得不在门外等了好几分钟，直到自己不再笑，才敢重新进来。他给海蒂端菜时早已看见，一只小猫的脑袋正从她的口袋里偷偷探出来，也猜到了接下来会有怎样一场好戏。第一声猫叫才响，他就乐得差点连盘子也端不住。等他终于恢复镇定，罗滕迈尔小姐惊慌失措的呼救声早已经停了。
        - id: ch01-b143
          speaker: narrator
          text: 餐厅里现在安安静静，和刚才的混乱完全不同。克拉拉把两只小猫放在膝上，海蒂跪在她身边。两个孩子一边笑，一边陪着那两只小巧又灵秀的小动物玩耍。
        - id: ch01-b144
          speaker: clara
          text: 塞巴斯蒂安，你一定得帮我们。请给小猫找张床，放在罗滕迈尔小姐看不见的地方。她那么怕小猫，一发现就会立刻把它们送走。可我们想留下它们，等屋里只有我们时，就把它们抱出来玩。你能把它们藏在哪里呢？
        - id: ch01-b145
          speaker: sebastian
          text: 这件事交给我吧。我会在篮子里铺张小床，再把篮子放到那位小姐多半不会去的地方。你们只管放心。
        - id: ch01-b146
          speaker: narrator
          text: 塞巴斯蒂安马上动手，自己还一直暗暗发笑。他猜到这些小猫往后还会惹出风波。一想到罗滕迈尔小姐又要受点惊扰，他心里便觉得十分有趣。
        - id: ch01-b147
          speaker: narrator
          text: 过了很久，快到上床的时候，罗滕迈尔小姐才敢把门打开一道小缝，从里面朝外问。
        - id: ch01-b148
          speaker: rottenmeier
          text: 塞巴斯蒂安，你已经把那些吓人的小畜生拿走了吗？
          emotion: fearful
        - id: ch01-b149
          speaker: narrator
          text: 塞巴斯蒂安连着向她保证了两遍，说小猫早已拿走。他一直留在屋里，就是等着她问这句话。现在，他又快又轻地从克拉拉膝上抱起小猫，转身不见了。
        - id: ch01-b150
          speaker: narrator
          text: 罗滕迈尔小姐原本还给海蒂准备了一大篇训话，只好留到第二天再说。烦恼、愤怒和惊吓轮番折腾了她一整天，而这一切，都是毫不知情的海蒂惹出来的。她已经精疲力竭，一句话也没说，便回房休息。克拉拉和海蒂随后也离开了。想到两只小猫正舒舒服服地睡在自己的小床上，她们心里都快活极了。
