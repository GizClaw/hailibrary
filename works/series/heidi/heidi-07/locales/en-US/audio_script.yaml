  chapters:
    - id: ch01
      title: Fraulein Rottenmeier Spends an Uncomfortable Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On her first morning in Frankfurt, Heidi opened her eyes and could not remember where she was. She rubbed them, sat up, and looked all around. Her high white bed stood along one side of a large, wide room. Morning light filtered through white curtains so long that they seemed to run from ceiling to floor. Near the windows were two chairs covered in a pattern of enormous flowers. A sofa wore the same flowers, and a round table stood in front of it. In one corner, Heidi saw a washstand covered with objects unlike anything she had seen in her life. Then her memory returned all at once. This was Frankfurt. Everything that had happened the day before came back to her, including as much as she had heard of Fraulein Rottenmeier's many instructions.
        - id: ch01-b02
          speaker: narrator
          text: Heidi jumped out of bed, dressed herself, and hurried first to one window and then to another. More than anything, she wanted to see the sky and the country outside. Behind those enormous curtains, though, she felt like a bird shut inside a cage. She tried to pull the curtains aside, but they were far too heavy for her. Instead, she crawled underneath them to reach the glass. The windows themselves were so high that she could barely lift her head above the sill to peer out. Even then, she could not see any of the things she longed for. Everywhere she looked there were walls and windows, then more walls and more windows. The sight began to frighten her.
        - id: ch01-b03
          speaker: narrator
          text: It was still early. At home, Heidi always rose early and ran straight outside to see how the world looked that morning. Was the sky blue? Had the sun climbed above the mountains? Were the fir trees swaying? Had the flowers opened their eyes? Now she darted from window to window like a bird newly placed in a bright cage, testing one bar after another in the hope of flying free. Heidi could not bear to see only walls and windows. Somewhere outside there had to be green grass and the last patches of unmelted snow on the mountain slopes. She tried to open the first window, then the second. She even pushed her little fingers beneath them and strained to lift them, but neither one moved. After a while, she understood that all her effort was useless. She thought she might go outside and walk around the house until she came to grass. Then she remembered the night before. In front of the house, she had seen nothing but stones.
        - id: ch01-b04
          speaker: narrator
          text: Just then someone knocked. Tinette put her head through the door.
        - id: ch01-b05
          speaker: tinette
          text: Breakfast is ready.
        - id: ch01-b06
          speaker: narrator
          text: Heidi had no idea that those words were an invitation to come to the table. Tinette's face did not encourage questions. In fact, it warned Heidi not to ask any. Heidi was quick enough to understand that expression, even if she did not understand the message. She pulled a small stool from under the table, carried it to the corner, and sat there in silence to wait for whatever might happen next. Before long, Fraulein Rottenmeier swept in with a great rustling and bustling of clothes. The sight of Heidi sitting in the corner immediately annoyed her.
        - id: ch01-b07
          speaker: rottenmeier
          text: What are you doing, Adelheid? Don't you know what breakfast means? Come with me at once!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: That command was easy to understand, and Heidi followed at once. Clara had been waiting at the breakfast table for some time. She greeted Heidi kindly. Her face looked much brighter than usual, because she expected her new companion to make all kinds of interesting things happen again that day. Breakfast itself passed quietly. Heidi ate her bread and butter in exactly the proper way, giving Fraulein Rottenmeier nothing to criticize. When the meal ended, Clara was wheeled back into the study. Fraulein Rottenmeier ordered Heidi to follow, stay with Clara, and wait there until the tutor arrived and the lessons began.
        - id: ch01-b09
          speaker: narrator
          text: As soon as they were alone, Heidi asked Clara the question that had been troubling her.
        - id: ch01-b10
          speaker: heidi
          text: How can I see outside from here, all the way down to the ground?
        - id: ch01-b11
          speaker: clara
          text: Open a window and look out.
        - id: ch01-b12
          speaker: heidi
          text: But they won't open.
          emotion: sad
        - id: ch01-b13
          speaker: clara
          text: Oh, they do open. You can't manage them, and neither can I. Ask Sebastian when you see him. He can open one for you.
        - id: ch01-b14
          speaker: narrator
          text: Heidi felt much better when she learned that the windows could be opened. Until then, the house had felt like a prison. Clara began asking about Heidi's home, and Heidi gladly told her about the mountain, the goats, and the flower-filled meadows she loved.
        - id: ch01-b15
          speaker: narrator
          text: Meanwhile, the tutor arrived. Fraulein Rottenmeier did not take him straight into the study. She pulled him aside into the dining room first and poured out the whole story of her troubles. She explained how the awkward situation had begun. Some time before, she had written to Herr Sesemann that his daughter very much wanted a companion. Fraulein Rottenmeier had added that she thought it was an excellent idea. Another child could encourage Clara to work harder during lessons and amuse her during playtime. She did not tell the tutor that she had also wanted the arrangement for her own sake. If Clara had a companion, Fraulein Rottenmeier would no longer have to entertain the sick girl herself at every spare moment, a duty that sometimes felt like too much for her.
        - id: ch01-b16
          speaker: narrator
          text: Herr Sesemann had agreed, but only if the companion was treated exactly like his own child. No child in his house was to be tormented or pushed around. Fraulein Rottenmeier found that warning quite unnecessary.
        - id: ch01-b17
          speaker: rottenmeier
          text: As though anyone here would ever torment a child!
        - id: ch01-b18
          speaker: narrator
          text: Then she explained how completely she had been deceived about the child. Heidi had already done things Fraulein Rottenmeier could hardly imagine any child doing. The tutor would not merely have to start with the alphabet. He would also have to teach her the most basic rules of ordinary life. To Fraulein Rottenmeier, there was only one way out of the disaster. The tutor must declare that the two girls could not possibly learn together without harming Clara's progress, since Clara was so far ahead. That would give them a proper reason to get rid of Heidi. Herr Sesemann would surely agree to send her home. Fraulein Rottenmeier could not take that step on her own, however. Clara's father knew by now that the companion had arrived, and Fraulein Rottenmeier did not dare remove her without his command.
        - id: ch01-b19
          speaker: tutor
          text: I don't think we should decide so quickly. If the little girl is behind in some things, she may be ahead in others. A little steady teaching may soon even everything out.
        - id: ch01-b20
          speaker: narrator
          text: The tutor was a cautious man who would not judge the child after hearing only one side. Fraulein Rottenmeier soon saw that he would not support her plan. He seemed perfectly prepared to take on Heidi and begin with the alphabet. With no ally beside her, she opened the study door and let him enter. Then she shut it quickly and remained outside, because she had a perfect horror of the ABC and would not sit through it herself. She paced back and forth across the dining room. Her thoughts turned to the servants. What should they be told to call Adelaide? Herr Sesemann had written that the girl must be treated exactly like his own daughter. Fraulein Rottenmeier decided that this must apply especially to the way the servants addressed her.
        - id: ch01-b21
          speaker: narrator
          text: She was not allowed much time to settle the question. A terrible crash came from the study, followed by frantic cries for Sebastian. Fraulein Rottenmeier rushed through the door. The room was a scene of complete confusion. Books and exercise books lay in a heap on the floor with the inkstand, the workbasket, and other objects. The tablecloth had fallen on top of everything. From beneath the pile, a dark stream of ink crept farther and farther across the floor. And Heidi had disappeared.
        - id: ch01-b22
          speaker: rottenmeier
          text: Just look at this! The tablecloth, the books, the workbasket, everything is in the ink! I suppose that unfortunate child did it!
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: The tutor stared unhappily at the wreckage. To him, it looked very bad indeed. Clara, however, seemed to enjoy seeing something so unusual happen.
        - id: ch01-b24
          speaker: clara
          text: Heidi did it, but it was an accident. You mustn't punish her. She jumped up so fast that she pulled the tablecloth with her, and everything fell. A lot of carriages were going by, and she suddenly ran off. Maybe she's never seen one before.
        - id: ch01-b25
          speaker: rottenmeier
          text: This proves exactly what I said! She knows nothing at all. She doesn't even know that she must sit still and listen during lessons. But where is she? Has she run away? What will Herr Sesemann say to me?
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: Fraulein Rottenmeier ran down the stairs. At the bottom, Heidi stood in the open doorway, gazing up and down the street.
        - id: ch01-b27
          speaker: rottenmeier
          text: What are you doing out here? What made you run away like that?
        - id: ch01-b28
          speaker: heidi
          text: I heard the fir trees, but I can't see where they are. Now I can't hear them anymore.
          emotion: sad
        - id: ch01-b29
          speaker: narrator
          text: Carriages had been rumbling past, but to Heidi the sound was like the south wind blowing through the fir trees. She had rushed outside in delight to find them. Now she looked sadly toward the place where the sound had come from.
        - id: ch01-b30
          speaker: rottenmeier
          text: Fir trees? Do you think you're in a forest? What nonsense! Come upstairs and see the mess you've made.
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: Heidi turned back into the house and followed Fraulein Rottenmeier upstairs. The ruined study amazed her. She had been so joyful when she thought she heard the fir trees, and so desperate to reach them, that she had never felt the tablecloth catch as she sprang away. She had not seen the books, the workbasket, or the inkstand follow her to the floor. Until that moment, she had no idea that she had caused the disaster at all.
        - id: ch01-b32
          speaker: rottenmeier
          text: I will excuse you this once because it is your first time. It must never happen again. During lessons, you will sit still and pay attention. If you cannot do that, I shall tie you to your chair. Do you understand?
        - id: ch01-b33
          speaker: heidi
          text: Yes. I won't move again.
        - id: ch01-b34
          speaker: narrator
          text: Now Heidi understood that sitting still was a rule during lessons. Sebastian and Tinette were called to clean up the broken things and put the room in order. The tutor said good morning and left, since no more lessons were possible that day. He certainly had found no time to yawn that morning.
        - id: ch01-b35
          speaker: narrator
          text: Clara always had to rest for a certain length of time in the afternoon. Fraulein Rottenmeier told Heidi that while Clara rested, Heidi could amuse herself in any way she chose. After dinner, the servants settled Clara on her couch, and the housekeeper withdrew to her own room. Heidi knew that her chance had come. There was one thing she had been longing to do, and she had already made up her mind about it. She could not manage it alone, though. She needed help from one particular person. To make sure she did not miss him, she took up a position in the hall directly outside the dining room door and waited.
        - id: ch01-b36
          speaker: narrator
          text: Soon Sebastian came up from the kitchen carrying a tray of silver tea things. As he reached the top of the stairs, Heidi addressed him in the formal way Fraulein Rottenmeier had ordered.
        - id: ch01-b37
          speaker: sebastian
          text: What do you want, miss?
        - id: ch01-b38
          speaker: heidi
          text: I only want to ask you something. It isn't anything bad like this morning.
        - id: ch01-b39
          speaker: narrator
          text: Sebastian sounded cross, and Heidi thought he must still be angry about the spilled ink. She hoped to make peace with him. Instead, Sebastian wanted to know why she was speaking to him so formally.
        - id: ch01-b40
          speaker: sebastian
          text: And why are you talking to me that way?
        - id: ch01-b41
          speaker: heidi
          text: Fraulein Rottenmeier told me I always had to speak to you like that.
        - id: ch01-b42
          speaker: narrator
          text: Sebastian laughed. Heidi stared at him in astonishment, because she could not find anything amusing in their conversation. Sebastian now understood that the child had not chosen that stiff form of address. She was only obeying Fraulein Rottenmeier as carefully as she knew how. His bad temper disappeared, and when he spoke again, his voice was friendly.
        - id: ch01-b43
          speaker: sebastian
          text: All right, then. What does miss want?
        - id: ch01-b44
          speaker: heidi
          text: My name isn't miss. It's Heidi.
        - id: ch01-b45
          speaker: sebastian
          text: True enough. But that same lady ordered me to call you miss.
        - id: ch01-b46
          speaker: heidi
          text: Oh. Then I suppose you have to. Now I have three names.
        - id: ch01-b47
          speaker: narrator
          text: Heidi sighed. Sebastian went into the dining room to put away the silver and asked once more what she wanted.
        - id: ch01-b48
          speaker: heidi
          text: How do you open a window?
        - id: ch01-b49
          speaker: sebastian
          text: Why, like this!
        - id: ch01-b50
          speaker: narrator
          text: Sebastian answered by flinging one of the great windows upward. Heidi ran over at once, but even with the window open, she was too short to see outside. The top of her head barely reached the sill. Sebastian found a tall wooden stool, carried it to the window, and told her to climb up. From there, he said, the little miss could look down and see everything happening below. Heidi climbed eagerly onto the stool. At last, she thought, she would see what she had been longing for ever since she woke. She leaned out, looked down, and drew her head back again. The hope went straight out of her face.
        - id: ch01-b51
          speaker: heidi
          text: There's nothing out there but stone streets. If I went around to the other side of the house, what would I see?
          emotion: sad
        - id: ch01-b52
          speaker: sebastian
          text: Nothing different from what you see here.
        - id: ch01-b53
          speaker: heidi
          text: Then where can I go to look out over the whole valley?
        - id: ch01-b54
          speaker: sebastian
          text: You'd have to climb a high tower. A church tower would do. See that one over there with the gold ball on top? From there, you can see a very long way.
        - id: ch01-b55
          speaker: narrator
          text: Heidi climbed down from the stool as fast as she could. She ran through the door, hurried down the steps, and dashed into the street. From the high window, the tower had looked so close that she imagined she had only to cross the road to reach it. Out on the ground, everything was different. She ran the whole length of the street, but the tower never seemed to come any nearer. Soon it vanished from sight altogether. Heidi turned into another street and walked on and on, still finding no tower. Crowds of people passed her, but everyone moved with such speed and purpose that Heidi thought none of them had enough time to stop and tell her the way.
        - id: ch01-b56
          speaker: narrator
          text: At a street corner, Heidi found a boy with a hand organ on his back and a funny-looking animal on his arm.
        - id: ch01-b57
          speaker: heidi
          text: Where is the tower with the gold ball on top?
        - id: ch01-b58
          speaker: organ_boy
          text: I don't know.
        - id: ch01-b59
          speaker: heidi
          text: Who can I ask to show me?
        - id: ch01-b60
          speaker: organ_boy
          text: I don't know.
        - id: ch01-b61
          speaker: heidi
          text: Do you know a different church with a high tower?
        - id: ch01-b62
          speaker: organ_boy
          text: Yes. I know one.
        - id: ch01-b63
          speaker: heidi
          text: Then come show me.
        - id: ch01-b64
          speaker: organ_boy
          text: First show me what you'll give me.
        - id: ch01-b65
          speaker: narrator
          text: The boy held out his hand and waited to see his payment. Heidi searched through her pockets. At last she brought out a card painted with a wreath of beautiful red roses. For a moment or two, she simply looked at it. Clara had given it to her that very morning, and Heidi was sorry to lose such a lovely present so soon. Then she thought of the view she expected from the tower. She would look down into a wide valley and see all the beautiful green slopes. That hope mattered even more than the card, so she held it out to the boy.
        - id: ch01-b66
          speaker: heidi
          text: Would you like this?
        - id: ch01-b67
          speaker: narrator
          text: The boy pulled back his hand and shook his head.
        - id: ch01-b68
          speaker: heidi
          text: Then what would you like?
        - id: ch01-b69
          speaker: organ_boy
          text: Money.
        - id: ch01-b70
          speaker: heidi
          text: I don't have any, but Clara does. I'm sure she'll give me some. How much do you want?
        - id: ch01-b71
          speaker: organ_boy
          text: Twopence.
        - id: ch01-b72
          speaker: heidi
          text: Come on, then.
        - id: ch01-b73
          speaker: narrator
          text: They set off together. Along the way, Heidi asked what he carried on his back. He told her it was a hand organ and that it played beautiful music when he turned the handle. Soon they stood before an old church with a high tower.
        - id: ch01-b74
          speaker: organ_boy
          text: There it is.
        - id: ch01-b75
          speaker: heidi
          text: But how do I get inside?
        - id: ch01-b76
          speaker: organ_boy
          text: I don't know.
        - id: ch01-b77
          speaker: heidi
          text: Do you think I can ring a bell, the way people ring for Sebastian?
        - id: ch01-b78
          speaker: organ_boy
          text: I don't know.
        - id: ch01-b79
          speaker: narrator
          text: Heidi spotted a bell set into the wall and pulled it with all her strength.
        - id: ch01-b80
          speaker: heidi
          text: If I go up, you have to wait here. I don't know the way home, so you'll have to show me.
        - id: ch01-b81
          speaker: organ_boy
          text: What will you give me for that?
        - id: ch01-b82
          speaker: heidi
          text: What do you want?
        - id: ch01-b83
          speaker: organ_boy
          text: Another twopence.
        - id: ch01-b84
          speaker: narrator
          text: A key turned inside. An old man pulled open the heavy, creaking door. He stared at the children in surprise, then began to scold them.
        - id: ch01-b85
          speaker: tower_keeper
          text: Why did you ring and make me come all the way down? Can't you read the sign over the bell? It says the bell is for people who want to climb the tower.
          emotion: angry
        - id: ch01-b86
          speaker: narrator
          text: The boy said nothing. He only pointed at Heidi.
        - id: ch01-b87
          speaker: heidi
          text: But I do want to climb the tower.
        - id: ch01-b88
          speaker: tower_keeper
          text: What do you want up there? Did someone send you?
        - id: ch01-b89
          speaker: heidi
          text: No. I only want to look down from the top.
        - id: ch01-b90
          speaker: tower_keeper
          text: Go home, and don't play this trick on me again. Next time you may not get off so easily.
          emotion: angry
        - id: ch01-b91
          speaker: narrator
          text: With that warning, the old man turned away and began to close the heavy door. Heidi could see that her one chance to reach the top of the tower was disappearing. She caught hold of his coat before he could shut her outside.
        - id: ch01-b92
          speaker: heidi
          text: Please let me go up. Just this once.
        - id: ch01-b93
          speaker: narrator
          text: The old man looked back, ready to scold her again. Then he saw the pleading in her eyes. His anger faded, his whole manner changed, and he took her by the hand.
        - id: ch01-b94
          speaker: tower_keeper
          text: Well, if you truly want it that much, I'll take you.
        - id: ch01-b95
          speaker: narrator
          text: The boy sat down on the church steps, making it clear that he was satisfied to wait below. Hand in hand, Heidi and the old man began climbing the tower. They went up step after step. The higher they climbed, the smaller and tighter the steps became. Near the top, they reached one last stair so narrow that Heidi had to place her feet with care. When they had climbed it, there were no more steps. They had reached the end. The old man picked Heidi up so she could look through the open window.
        - id: ch01-b96
          speaker: tower_keeper
          text: There. Now you can look down.
        - id: ch01-b97
          speaker: narrator
          text: Below her stretched a sea of roofs, towers, and chimneys. Heidi quickly pulled her head back.
        - id: ch01-b98
          speaker: heidi
          text: This isn't anything like what I thought it would be.
          emotion: sad
        - id: ch01-b99
          speaker: tower_keeper
          text: There, you see? A child your age doesn't know anything about a view. Come down now, and don't ring my bell again.
        - id: ch01-b100
          speaker: narrator
          text: He set her down and started ahead of her on the narrow stairs. Where the stairway turned and became wider, they passed the door to the tower keeper's room. Beside that door, the landing continued along the edge of the steep, sloping roof. At the far end stood a large basket. A huge gray cat sat guard in front of it. When she saw them, she snarled a warning. She wanted every passerby to know that no one was to touch her family. Heidi stopped and stared. She had never seen such a monster of a cat. The old tower was home to whole armies of mice, so the cat never had trouble finding food. She could catch half a dozen mice for her dinner every day.
        - id: ch01-b101
          speaker: tower_keeper
          text: She won't hurt you while I'm here. Come take a look at the kittens.
        - id: ch01-b102
          speaker: narrator
          text: Heidi stepped up to the basket and cried out with delight. Seven or eight tiny kittens tumbled over one another, scrambling, rolling, and playing. Heidi hopped from one side of the basket to the other so she would not miss any of their antics.
        - id: ch01-b103
          speaker: heidi
          text: Oh, they're so sweet! Look at the darling little kittens!
          emotion: happy
        - id: ch01-b104
          speaker: tower_keeper
          text: Would you like one?
        - id: ch01-b105
          speaker: heidi
          text: One for me to keep?
          emotion: surprised
        - id: ch01-b106
          speaker: tower_keeper
          text: Of course. Take more than one if you like. You can have the whole lot if you have room for them.
        - id: ch01-b107
          speaker: narrator
          text: The old man was only too glad at the thought of finding homes for the kittens without any more work of his own. Heidi could hardly contain her joy. The Sesemann house was enormous. Surely it had room for all these little creatures. She pictured herself arriving with the kittens and showing them to Clara. How astonished Clara would be, and how delighted when she saw them tumbling and playing together.
        - id: ch01-b108
          speaker: heidi
          text: But how can I carry them home?
        - id: ch01-b109
          speaker: narrator
          text: Heidi moved quickly toward the basket, already trying to decide how many kittens her two hands could carry. Before she could touch one, the mother cat sprang at her so fiercely that Heidi shrank back in fear. The old man came closer and stroked the cat until she settled down. He knew her well. She was an old friend of his and had shared the tower with him for many years.
        - id: ch01-b110
          speaker: tower_keeper
          text: I'll bring them for you. Just tell me where you live.
        - id: ch01-b111
          speaker: heidi
          text: Herr Sesemann's house. It's a big house with a gold dog's head on the door, and the dog has a ring in its mouth.
        - id: ch01-b112
          speaker: narrator
          text: The old man needed no more directions. He had cared for the tower for many years, knew every house nearby, and even knew Sebastian.
        - id: ch01-b113
          speaker: tower_keeper
          text: I know the house. When should I bring them, and who should I ask for? I'm sure you aren't part of the family.
        - id: ch01-b114
          speaker: heidi
          text: No, but Clara will be so happy when I bring her the kittens.
        - id: ch01-b115
          speaker: narrator
          text: The old man was ready to go downstairs, but Heidi could hardly pull herself away from the tumbling kittens.
        - id: ch01-b116
          speaker: heidi
          text: Could I take just one or two now? One for me and one for Clara?
        - id: ch01-b117
          speaker: tower_keeper
          text: Wait a moment.
        - id: ch01-b118
          speaker: narrator
          text: He gently drew the mother cat into his room, set her beside a bowl of food, and closed the door. Then he told Heidi to choose two. Her eyes shone. She picked up one white kitten and one striped in white and yellow, tucked one into each pocket, and went downstairs.
        - id: ch01-b119
          speaker: narrator
          text: The boy was still sitting on the steps. After the old man locked the church door, Heidi asked the boy to lead her back to Herr Sesemann's house.
        - id: ch01-b120
          speaker: organ_boy
          text: I don't know where it is.
        - id: ch01-b121
          speaker: narrator
          text: Heidi described the front door, the steps, and the windows, but the boy only shook his head.
        - id: ch01-b122
          speaker: heidi
          text: From one window, you can see a very, very big gray house. Its roof goes up and down like this.
        - id: ch01-b123
          speaker: narrator
          text: Heidi traced a zigzag in the air with one finger to show him the shape of the roof. At once the boy understood. He was clearly used to finding his way by signs like that. He jumped to his feet and ran straight off, with Heidi hurrying close behind him. In a very short time, they reached the right house and stopped before the door with the large dog's head holding a ring in its mouth. Heidi rang the bell, and Sebastian opened it at once.
        - id: ch01-b124
          speaker: sebastian
          text: Hurry, hurry!
        - id: ch01-b125
          speaker: narrator
          text: Heidi sprang inside. Sebastian shut the door without noticing the boy, who remained on the steps staring after them.
        - id: ch01-b126
          speaker: sebastian
          text: Quickly, little miss. Go straight to the dining room. They're already at the table, and Fraulein Rottenmeier looks ready to explode. Why did you run off like that?
        - id: ch01-b127
          speaker: narrator
          text: Heidi walked into the dining room. Fraulein Rottenmeier refused to look up. Clara did not say a word. No one greeted Heidi or asked where she had been, and the silence around the table felt deeply uncomfortable. Sebastian pulled out her chair and pushed it into place after she sat down. Only then did Fraulein Rottenmeier turn toward her. With a severe expression, the housekeeper began to speak in a voice that was both stern and solemn.
        - id: ch01-b128
          speaker: rottenmeier
          text: I will deal with you later, Adelheid. For now, understand this. You behaved disgracefully. You left the house without permission, told no one where you were going, and wandered around until this hour. I have never heard of such behavior.
          emotion: angry
        - id: ch01-b129
          speaker: narrator
          text: A small voice answered from Heidi's pocket.
        - id: ch01-b130
          speaker: white_kitten
          text: Meow!
        - id: ch01-b131
          speaker: narrator
          text: That was more than Fraulein Rottenmeier could bear.
        - id: ch01-b132
          speaker: rottenmeier
          text: How dare you answer me with a joke after behaving so badly?
          emotion: angry
        - id: ch01-b133
          speaker: heidi
          text: I didn't—
        - id: ch01-b134
          speakers: [white_kitten, striped_kitten]
          ensemble: duo
          text: Meow! Meow!
        - id: ch01-b135
          speaker: narrator
          text: Sebastian nearly dropped the dish he was carrying and rushed from the room.
        - id: ch01-b136
          speaker: rottenmeier
          text: That is enough! Get up and leave the room.
          emotion: angry
        - id: ch01-b137
          speaker: narrator
          text: Frightened, Heidi stood and tried once more to explain.
        - id: ch01-b138
          speaker: heidi
          text: It really wasn't—
        - id: ch01-b139
          speakers: [white_kitten, striped_kitten]
          ensemble: duo
          text: Meow! Meow! Meow!
        - id: ch01-b140
          speaker: clara
          text: Heidi, you can see that it makes Fraulein Rottenmeier angry. Why do you keep meowing?
        - id: ch01-b141
          speaker: heidi
          text: It isn't me. It's the kittens.
        - id: ch01-b142
          speaker: rottenmeier
          text: What? Kittens? Sebastian! Tinette! Find those horrible little creatures and take them away!
          emotion: fearful
        - id: ch01-b143
          speaker: narrator
          text: Fraulein Rottenmeier fled into the study and locked the door behind her. Of everything in the world, kittens frightened her most.
        - id: ch01-b144
          speaker: narrator
          text: Sebastian had already seen a little kitten's head peeking from Heidi's pocket while he served her. He guessed exactly what would happen once it began to cry. When the first meows came, he was so overcome with laughter that he could barely finish passing the dishes. Then Fraulein Rottenmeier began shouting, and he had to escape. Outside the room, he waited several minutes until he could control himself. Her distressed cries for help had ended by the time he returned. The dining room was peaceful again. Clara had both kittens in her lap, and Heidi knelt beside her. The girls laughed together as they played with the tiny, graceful animals.
        - id: ch01-b145
          speaker: clara
          text: Sebastian, you have to help us. Please find a bed for the kittens where Fraulein Rottenmeier won't discover them. She's so afraid of them that she'll send them away at once. We want to keep them and bring them out whenever we're alone. Where can you hide them?
        - id: ch01-b146
          speaker: sebastian
          text: Leave that to me. I'll make them a bed in a basket and put it somewhere the lady never goes.
        - id: ch01-b147
          speaker: narrator
          text: Sebastian began at once, chuckling to himself. He suspected the kittens would cause another disturbance someday, and he rather enjoyed the thought of Fraulein Rottenmeier being unsettled again.
        - id: ch01-b148
          speaker: narrator
          text: It was almost bedtime before Fraulein Rottenmeier dared open the study door a crack and call through it.
        - id: ch01-b149
          speaker: rottenmeier
          text: Sebastian, have you taken those dreadful little animals away?
          emotion: fearful
        - id: ch01-b150
          speaker: narrator
          text: Sebastian assured her twice that he had. He had been waiting nearby for that very question. Now he quietly gathered the kittens from Clara's lap and carried them away.
        - id: ch01-b151
          speaker: narrator
          text: Fraulein Rottenmeier had saved a long scolding for Heidi, but she postponed it until the next day. After all the irritation, anger, and fright Heidi had unknowingly caused, the housekeeper was too exhausted to continue. She went to bed without another word. Clara and Heidi followed, happy to know that the kittens were sleeping in a comfortable little bed.
