  chapters:
    - id: ch01
      title: Snowbound on the Mountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Snow lay so deep around the hut that the windows seemed level with the ground, and the door had vanished completely. Fresh snow fell every night. If Grandfather had still been living up there, he would have faced the same morning work that Peter did. Each day Peter climbed out through the sitting-room window. If the night had not been bitterly cold, he dropped almost to his shoulders in loose snow. Then he had to struggle until he was free, pushing and twisting with his hands, his feet, and even his head.
        - id: ch01-b02
          speaker: narrator
          text: His mother passed the big broom out through the window, and Peter worked hard to clear a path to the door. He had to sweep every bit of snow well away from it. Otherwise, the moment someone opened the door, the whole soft heap would tumble into the room. If the frost turned that heap solid first, a wall of ice would seal the entrance and no one could come in or go out. The window offered no escape for anyone except Peter, because he alone was small enough to squeeze through.
        - id: ch01-b03
          speaker: narrator
          text: Sometimes the new snow froze solid overnight, and those were Peter's favorite mornings. He could crawl out onto a hard, smooth surface, take the little sled his mother handed him, and race down to Dorfli any way he pleased. The whole mountain had become one broad, unbroken sledding road.
        - id: ch01-b04
          speaker: narrator
          text: Grandfather had kept his promise not to spend the winter at the old hut. When the first snow came, he closed the hut and all the sheds, then moved down to Dorfli with Heidi and the goats. Near the church stood a rambling, half-ruined house. Long ago, it had belonged to an important man, a distinguished soldier who entered the service of Spain. He fought bravely there and gathered a great treasure. When he returned to Dorfli, he spent part of it on a fine house where he meant to live. But he had grown used to the noise of weapons and the bustle of the wider world. Quiet country life could not hold him. Before long, he went away again, and this time he never returned.
        - id: ch01-b05
          speaker: narrator
          text: After many years, everyone felt sure the soldier was dead. A distant relative took possession of the house, but by then it badly needed repair, and he had no wish to rebuild it. Instead, he rented it to poor families for very little money. Whenever another part fell down, no one fixed it. That went on year after year. Grandfather had rented the crumbling place when his son Tobias was still a boy. Since then, it had stood empty. Only someone who knew how to close every hole and gap could live there. Otherwise, wind, rain, and snow swept through the rooms. Even a candle flame could not survive, and anyone inside might freeze during the long winter. Grandfather, though, knew exactly how to make the place livable. Once he decided to winter in Dorfli, he rented it again and spent the fall making it solid and tight. He and Heidi moved in during the middle of October.
        - id: ch01-b06
          speaker: narrator
          text: If you came toward the house from behind, you first entered an open space between two walls. One of them had half fallen down. Above it rose the arch of an old window, thick with ivy. The vines spread across the remains of a rounded roof that must once have belonged to a chapel. Beyond that stood a large hall, wide open to the courtyard because it had no doors. Most of its walls and roof were gone too. The piece of roof still hanging there looked ready to fall at any moment, but two strong pillars held it up. Grandfather built a wooden partition in this hall and spread straw across the floor. That became the goats' winter home.
        - id: ch01-b07
          speaker: narrator
          text: From there, long passages twisted through the ruins. Cracks opened on every side, and now and then you could look straight through them to the sky, the fields, or the road outside. At last, the passages ended at a strong oak door. Behind it was one room that had remained whole. Its walls and dark wooden panels were as sound as ever. In one corner stood a huge tiled stove that nearly touched the ceiling. Large blue pictures covered its white tiles. Some showed ancient castles among trees, with hunters riding out behind their hounds. Others showed a still lake shaded by broad oak trees, while a man sat fishing nearby. A bench ran all the way around the stove. You could sit comfortably and take your time with every picture.
        - id: ch01-b08
          speaker: narrator
          text: Heidi hurried straight to that bench. She moved around the stove, looking closely at each scene. Then something behind it caught her eye. Four boards formed a wide box in the space by the wall. There were no apples in it. Instead, Heidi found her own bed from the hut, complete with its hay mattress, sheets, and sack for a blanket. She clapped her hands.
        - id: ch01-b09
          speaker: heidi
          text: Oh, Grandfather, this is my room! I love it. But where will you sleep?
          emotion: happy
        - id: ch01-b10
          speaker: grandfather
          text: You need to stay close to the stove, or you'll freeze. Come see my room too.
        - id: ch01-b11
          speaker: narrator
          text: Heidi hopped down from the stove bench and skipped after Grandfather across the big room. At the far end, he opened a door into a smaller room. That would be his bedroom. Beyond it was yet another door. Heidi pushed this one open herself and stopped in amazement. The room on the other side was a kitchen, but it was enormous. She had never seen anything like it.
        - id: ch01-b12
          speaker: narrator
          text: Grandfather still had plenty of work ahead before the kitchen was finished. Wind whistled through cracks and open holes in its walls. Still, he had already nailed up so many new boards that it looked as though small cupboards had been built all around the room. He had also made the great old outside door safe with rows of screws and nails, shutting out the cold air as well as he could. That protection was badly needed. Just outside stood a mass of fallen buildings, overgrown with tall weeds. Countless beetles and lizards had made their homes among the ruins.
        - id: ch01-b13
          speaker: narrator
          text: Heidi was delighted with her winter home. By the next morning, she knew every corner so well that she could lead Peter through it herself. She would not let him leave until he had seen every last wonder.
    - id: ch02
      title: Waiting for the Frost
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Heidi slept soundly in her warm corner beside the stove. Still, every morning when she first opened her eyes, she believed she was back on the mountain. She felt she must jump up and run outside at once. Were the fir trees so quiet because thick snow was weighing down their branches? Then she looked around the unfamiliar room. It took several moments before she could be certain where she was. As she remembered that she was not at home in the hut, a heavy, troubled feeling pressed in on her.
        - id: ch02-b02
          speaker: narrator
          text: Soon she would hear Grandfather outside caring for the goats. They would give one or two loud bleats, as if calling her to hurry. Then Heidi was happy again. She knew she was still at home, and she jumped out of bed and ran to the animals as fast as she could.
        - id: ch02-b03
          speaker: narrator
          text: On the fourth morning, she spoke as soon as she saw Grandfather.
        - id: ch02-b04
          speaker: heidi
          text: I have to visit Grandmother today. She shouldn't be left alone for so long.
        - id: ch02-b05
          speaker: grandfather
          text: You can't go today, and you can't go tomorrow. The mountain is buried under snow deeper than you are tall, and more is still falling. Even a sturdy boy like Peter can hardly force his way through. A little thing like you would sink out of sight, and we wouldn't be able to find you again. Wait until the snow freezes. Then the surface will be hard enough to walk on.
        - id: ch02-b06
          speaker: narrator
          text: Heidi did not want to wait, but her days were so full that they slipped past quickly. Every morning and afternoon, she went to school in Dorfli and eagerly learned whatever she was taught. Peter was hardly ever there.
        - id: ch02-b07
          speaker: narrator
          text: The teacher never seemed greatly concerned.
        - id: ch02-b08
          speaker: teacher
          text: Peter hasn't come again today. There's so much snow on the mountain that I suppose he couldn't get through.
        - id: ch02-b09
          speaker: narrator
          text: Yet Peter always managed to get through it after lessons were over. Most evenings, he came to visit Heidi.
        - id: ch02-b10
          speaker: narrator
          text: After several days, the sun finally returned and shone brightly over the white earth. But it slipped behind the mountains again very early, almost as though it took less pleasure in the winter world than it did when the ground was green and full of flowers. Then a clear, full moon rose. All night, its light spread across the vast white snowfield. By morning, every frozen slope flashed and sparkled, and the whole mountain looked like one enormous crystal.
        - id: ch02-b11
          speaker: narrator
          text: Peter climbed from his window as usual, expecting to sink. Instead, he landed on hard ice and slid downhill like a sled before he could stop. He got up, stamped, and drove his heels down with all his strength. He could not break off even the smallest chip. The mountain was frozen hard as iron.
        - id: ch02-b12
          speaker: narrator
          text: This was exactly what Peter had wanted. Now Heidi could come up. He hurried indoors, swallowed the milk his mother had left for him, pushed a piece of bread into his pocket, and announced his plan.
        - id: ch02-b13
          speaker: peter
          text: I have to get to school.
        - id: ch02-b14
          speaker: grandmother
          text: Good. Go learn as much as you can.
        - id: ch02-b15
          speaker: narrator
          text: Peter crawled back through the window because frozen snow still blocked the door. He pulled his little sled after him and, a moment later, shot down the mountain.
    - id: ch03
      title: The Runaway Sled
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Peter flew downhill like lightning. Soon he reached Dorfli, which stood directly on the road toward Mayenfeld. But he decided not to stop there. At that speed, he was sure any attempt would hurt both him and the sled. So he kept racing down the road, faster and farther, until at last he reached level ground. Only then did the sled slow down and stop by itself.
        - id: ch03-b02
          speaker: narrator
          text: Peter climbed off and looked around. The force of that wild ride had carried him a little way beyond Mayenfeld. He thought about school. Lessons must have begun already, and walking all the way back to Dorfli would take a full hour. There was no chance of arriving on time now. Peter decided that meant he could take his time. He wandered back and reached Dorfli just as Heidi came home from school and sat down to dinner with Grandfather.
        - id: ch03-b03
          speaker: narrator
          text: Peter stepped inside and stood in the center of the room. He had important news, so he blurted it out at once.
        - id: ch03-b04
          speaker: peter
          text: She's got it now.
        - id: ch03-b05
          speaker: grandfather
          text: Got what? You sound like a general bringing news from battle.
        - id: ch03-b06
          speaker: peter
          text: The frost.
        - id: ch03-b07
          speaker: heidi
          text: Then I can visit Grandmother now! But why weren't you at school? You could ride down on your sled.
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: Heidi spoke reproachfully. If someone could get to school, she believed that person should be there.
        - id: ch03-b09
          speaker: peter
          text: The sled took me too far. By then I was late.
        - id: ch03-b10
          speaker: grandfather
          text: Sounds like desertion to me. You know deserters get their ears pulled.
        - id: ch03-b11
          speaker: narrator
          text: Peter grabbed at his cap in alarm. He feared Grandfather more than anyone.
        - id: ch03-b12
          speaker: grandfather
          text: A general like you should be twice as ashamed of running away. Suppose your goats scattered in every direction and refused to follow you, even when you knew what was best for them. What would you do?
        - id: ch03-b13
          speaker: peter
          text: I'd beat them.
        - id: ch03-b14
          speaker: grandfather
          text: And if a boy acted like those unruly goats and got a beating, what would you say?
        - id: ch03-b15
          speaker: peter
          text: He'd deserve it.
        - id: ch03-b16
          speaker: grandfather
          text: Good. Then remember this. The next time your sled carries you past the school while you should be in class, come straight to me afterward. You'll get exactly what you deserve.
        - id: ch03-b17
          speaker: narrator
          text: Peter finally understood. He was the boy behaving like a disobedient goat. Nervously, he glanced toward the corner to see whether Grandfather kept anything there like the switch Peter used on his animals.
        - id: ch03-b18
          speaker: narrator
          text: Then Grandfather's voice suddenly turned cheerful.
        - id: ch03-b19
          speaker: grandfather
          text: Sit down and eat. Afterward, Heidi can go with you. Bring her home tonight, and supper will be waiting here.
        - id: ch03-b20
          speaker: narrator
          text: The sudden change left Peter grinning from ear to ear. He obeyed without a moment's delay and took the seat beside Heidi. She was so excited about seeing Grandmother that she could not eat another bite. Her potatoes and toasted cheese were still on the plate, so she pushed them toward Peter. At the very same time, Grandfather filled Peter's plate from the other side. Soon a mountain of food rose in front of the boy. Peter showed no lack of courage. He attacked the whole pile.
        - id: ch03-b21
          speaker: narrator
          text: Heidi fetched the warm cloak Clara had sent. With the hood over her head, she stood ready beside Peter. The instant he swallowed his last bite, she urged him on.
        - id: ch03-b22
          speaker: heidi
          text: Come on. Let's go now.
        - id: ch03-b23
          speaker: narrator
          text: As they walked together, Heidi had plenty to tell him. On their first day in the new stall, her two goats had been terribly unhappy. They refused to eat anything. They only stood with their heads hanging down, and they could not even stir themselves enough to bleat. Heidi had asked Grandfather what was wrong. He told her the goats felt just as she had felt in Frankfurt, because this was the first time in their lives they had come down from the mountain.
        - id: ch03-b24
          speaker: heidi
          text: You can't understand what that feels like, Peter, unless it's happened to you.
        - id: ch03-b25
          speaker: narrator
          text: Peter was so deep in thought that he barely seemed to hear her. They were nearly home when he stopped.
        - id: ch03-b26
          speaker: peter
          text: I'd rather go to school than get what your grandfather promised me.
        - id: ch03-b27
          speaker: narrator
          text: Heidi agreed and encouraged him to keep that good intention.
    - id: ch04
      title: Grandmother's Comfort
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They found Brigitta sitting alone with her knitting. Grandmother had caught a chill and was spending the day in bed. Heidi had never seen the familiar old figure missing from the corner. She hurried into the next room. Grandmother lay on a poorly covered bed, wrapped in her warm gray shawl.
        - id: ch04-b02
          speaker: grandmother
          text: Thank God you're here!
        - id: ch04-b03
          speaker: narrator
          text: All through the fall, Grandmother had carried a secret fear. Whenever Heidi stayed away for very long, the worry grew stronger. Peter had told her about a strange gentleman from Frankfurt who walked with them and kept talking to Heidi. Grandmother became certain he had come to take the child away again. Even after she heard that the gentleman had left alone, the fear did not disappear. Perhaps Frankfurt would send someone else to fetch Heidi.
        - id: ch04-b04
          speaker: heidi
          text: Grandmother, are you very sick?
        - id: ch04-b05
          speaker: grandmother
          text: No, no, child. The cold has only settled into my bones a little.
          emotion: calm
        - id: ch04-b06
          speaker: narrator
          text: She stroked Heidi's head lovingly.
        - id: ch04-b07
          speaker: heidi
          text: Will you be completely well as soon as the weather gets warm?
        - id: ch04-b08
          speaker: grandmother
          text: Yes, God willing. Maybe sooner. I want to get back to my spinning. I thought I might do a little today, but I'm sure I'll be well again tomorrow.
          emotion: calm
        - id: ch04-b09
          speaker: narrator
          text: Grandmother could tell that Heidi was frightened, so she tried to put the child at ease. It worked. Heidi had been deeply upset because she had never seen Grandmother sick in bed. She studied the old woman for a moment.
        - id: ch04-b10
          speaker: heidi
          text: In Frankfurt, everyone wears a shawl when they go walking. Did you think yours was meant for bed?
        - id: ch04-b11
          speaker: grandmother
          text: I wear it here so I won't freeze, dear. I'm very glad to have it, because my bedcovers aren't thick.
        - id: ch04-b12
          speaker: heidi
          text: But your bed isn't right. Your head goes downhill instead of uphill.
        - id: ch04-b13
          speaker: grandmother
          text: I know, child. I can feel it. My pillow was never very thick to begin with. I've lain on it for so many years that now it's almost completely flat.
        - id: ch04-b14
          speaker: narrator
          text: She touched the thin pillow, which felt little better than a board, and tried to shift into a more comfortable position.
        - id: ch04-b15
          speaker: heidi
          text: Oh, I wish I'd asked Clara if I could bring my Frankfurt bed home for you. I had three big pillows, one stacked on top of another. They were so high that I could hardly sleep at all. I always slid down, trying to find one flat place. Then I had to pull myself back up again, because they said sleeping high on the pillows was the proper thing to do. Could you sleep that way, Grandmother?
        - id: ch04-b16
          speaker: grandmother
          text: Oh, yes. All those pillows would keep a person warm, and it's easier to breathe when your head is raised. But we won't talk about what I don't have. God has given me so much that other old sick people must go without. I get that good bread every day. I have this warm shawl, and I have your visits, Heidi. I'm thankful for all of it. Will you read something to me today?
        - id: ch04-b17
          speaker: narrator
          text: As she spoke, Grandmother wearily lifted her head, still searching for a higher place to rest it. Heidi ran into the other room and brought back the hymnbook. One after another, she chose the hymns Grandmother loved best. By now, Heidi knew them all by heart. So many days had passed since her last visit that she was just as glad to hear the familiar words again as Grandmother was. The old woman lay quietly with her hands folded. As she listened, a peaceful smile slowly crossed her tired, troubled face. She looked like someone who had just been brought wonderful news.
        - id: ch04-b18
          speaker: narrator
          text: Suddenly, Heidi stopped reading.
        - id: ch04-b19
          speaker: heidi
          text: Grandmother, are you all better already?
        - id: ch04-b20
          speaker: grandmother
          text: Yes, child. Listening to you has made me feel better. Please finish it.
          emotion: happy
        - id: ch04-b21
          speaker: narrator
          text: Heidi continued until she reached the final words.
        - id: ch04-b22
          speaker: heidi
          text: |-
            As the eyes grow dim, and darkness
            Closes round, the soul grows clearer,
            Sees the goal to which it travels,
            Gladly feels its home is nearer.
        - id: ch04-b23
          speaker: narrator
          text: Grandmother repeated the words softly to herself once or twice. As she did, her face filled with happy expectation. Heidi took just as much pleasure in those words. They brought back the picture of her own return home, when the mountain had welcomed her beneath a beautiful, sunny sky.
        - id: ch04-b24
          speaker: heidi
          text: Grandmother, I know exactly what going home is like!
          emotion: happy
        - id: ch04-b25
          speaker: narrator
          text: Grandmother did not answer, but she had heard. The peaceful look that made Heidi think she was well stayed on her face.
        - id: ch04-b26
          speaker: narrator
          text: A little later, Heidi saw that darkness was coming.
        - id: ch04-b27
          speaker: heidi
          text: I have to go home now. I'm so glad you're well again.
        - id: ch04-b28
          speaker: narrator
          text: Grandmother took Heidi's hand and held it tightly.
        - id: ch04-b29
          speaker: grandmother
          text: Yes, I'm happy again. Even if I have to go on lying here, I can be content. No one knows what it's like to spend day after day alone in this room. Everything is silent and dark. I don't hear another voice, and I never see one ray of light. Sad thoughts come over me. Sometimes I feel I can't bear them any longer, and I wonder whether it will ever be light again. But then you come and read those words to me. They comfort me, and my heart can rejoice again.
          emotion: sad
        - id: ch04-b30
          speaker: narrator
          text: Then Grandmother let her go. Heidi hurried into the other room and called Peter. It was fully dark now, and they had to leave quickly.
    - id: ch05
      title: A Plan for Grandmother
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Outside, the moon shone over the white snow, making everything almost as clear as day. Peter brought out his sled. Heidi sat behind him, and he took the front to steer. Together they flew down the mountain like two birds darting through the air.
        - id: ch05-b02
          speaker: narrator
          text: That night, Heidi lay high on her soft bed of hay. She kept thinking about Grandmother lying on that low, flat pillow. She remembered everything the old woman had said. Whenever she heard the hymns, light and comfort woke inside her again. Heidi thought that if she could read to Grandmother every day, she could go on helping her feel better.
        - id: ch05-b03
          speaker: narrator
          text: But Heidi knew the weather might keep her away for a week, perhaps even two. She could not simply climb the mountain whenever she wished. The thought troubled her deeply. She tried hard to imagine some other way for Grandmother to hear the words she loved, not only on Heidi's visits, but every single day.
        - id: ch05-b04
          speaker: narrator
          text: Suddenly, an idea came to her. She was so delighted that waiting until morning seemed almost impossible. Then she sat straight up. She had been thinking so hard that she had forgotten her prayers, and now she never let a day end without them.
        - id: ch05-b05
          speaker: narrator
          text: Heidi prayed with all her heart for herself, for Grandfather, and for Grandmother. Then she settled back into the warm, soft hay and slept soundly and peacefully until morning.
