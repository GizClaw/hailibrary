audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    grandpa:
      display_name: 爷爷
      tts: {delivery: "寡言沉稳，粗粝外表下藏着深厚温情", timbre: 低沉沧桑, pace: 舒缓, pitch: 低音}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandmother:
      display_name: 祖母
      tts: {delivery: "慈爱虔诚，喜悦中带着年迈者的颤音", timbre: 温柔苍老, pace: 缓慢, pitch: 中音}
    teacher:
      display_name: 老师
      tts: {delivery: "随和宽厚，说话不紧不慢", timbre: 温和朴实, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 第十八章　多尔夫里的冬天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 山上的雪已经堆到窗户那么高，小屋的大门彻底不见了。阿尔姆大叔要是还住在那里，也得像彼得一样天天清雪，因为每夜都有新雪落下。彼得每天早晨只能从起居室的窗户钻出去。夜里若没冻透，他一落地就会陷到肩膀，只好手脚并用，连头都使上劲，挣扎着从雪里脱身。母亲再从窗口递出大扫帚，让他卖力清出通往门口的路。门边的雪得挖得又干净又远，不然一开门，整片松雪就会全倒进屋。要是严寒把它冻成一堵冰墙，门也打不开，谁都不能进出，而那扇小窗又只容得下彼得。
        - id: ch01-b02
          speaker: narrator
          text: 不过，新雪要是在夜里冻得又硬又平，彼得可就高兴了。他爬到光滑结实的雪面上，接过母亲从窗口递出来的小雪橇，想从哪条路线滑下多尔夫里都行。因为这时，从眼前一直到山下，整座山就是一条又宽又长、没有断口的雪橇道。
        - id: ch01-b03
          speaker: narrator
          text: 阿尔姆大叔没有留在山上过冬。他守了诺言。第一场雪一来，他便封好小屋和外面的棚舍，带着海蒂和山羊搬到多尔夫里。教堂附近有一座破败的大宅。从前，一位显贵而勇敢的军官住在那里。他曾去西班牙从军，立过许多战功，也带回不少财宝。他拿出一部分战利品，在故乡盖起漂亮的房子，本想从此住下。可他习惯了战场和外面世界的喧闹，受不了乡间的安静，很快又走了，这一次再没回来。
        - id: ch01-b04
          speaker: narrator
          text: 许多年过去，人们终于认定军官已经去世，一位远亲接下了房子。宅子早已失修，那位亲戚不肯重建，就用很低的租金租给穷人。哪一处塌了，也没人去管。这样的日子过了许多年。阿尔姆大叔的儿子托比亚斯还小的时候，大叔便租住过这里。后来房子一直空着。若不懂得堵住孔洞和裂口，根本没法住人。风雨和雪都会灌进房间，蜡烛也点不住，住客一定熬不过漫长的严冬。阿尔姆大叔却知道该怎么修。他决定下山过冬以后，便租下旧宅，整个秋天都在把它修牢、封严。十月中旬，他和海蒂住了进去。
        - id: ch01-b05
          speaker: narrator
          text: 从房后走过去，先是一片空地，两边都有墙，其中一道已经塌了一半。上方还留着古老的窗拱，常春藤密密地爬过窗拱，又盖住半圆屋顶的残迹。那里以前大概是一座小礼拜堂。再往前，是一间没有门的大厅，直通外面的广场。墙和屋顶也残缺不全。剩下的屋顶看着随时会掉下来，全靠两根粗柱子撑着。阿尔姆大叔竖起一道木隔板，在地上铺好稻草，把大厅变成山羊的家。
        - id: ch01-b06
          speaker: narrator
          text: 从大厅进去，走廊一条接一条，仿佛总也走不到头。透过墙上的裂缝，时而能看见天空，时而能看见外面的田野和道路。走到尽头，才有一扇厚实的橡木门。门后的屋子还完好无损，墙壁和深色护墙板都像从前一样结实。墙角是一座几乎顶到天花板的大火炉。白瓷砖上画着一幅幅很大的蓝色图画。有树林围绕的古堡，有带着猎犬骑马出发的猎人，也有安静的湖、枝叶宽展的橡树和独自钓鱼的人。炉边围着一圈座位，人可以舒舒服服坐下来，慢慢看清每一幅画。
        - id: ch01-b07
          speaker: narrator
          text: 海蒂刚到，就坐在炉边一幅幅看过去。等她绕到火炉背后，立刻又发现了更叫她欢喜的东西。火炉和墙壁之间，四块木板围成一个大槽，像是用来装苹果的。里面没有苹果，却放着她自己的床。干草褥子、床单和当盖被的口袋，一样不少，跟山上小屋里完全相同。海蒂拍起手来。
        - id: ch01-b08
          speaker: heidi
          text: 爷爷，这里就是我的房间呀，真好！那您睡在哪里呢？
          emotion: happy
        - id: ch01-b09
          speaker: grandpa
          text: 你得睡在火炉旁边，不然会冻坏的。来吧，我也带你看看我的房间。
        - id: ch01-b10
          speaker: narrator
          text: 海蒂跳下座位，蹦蹦跳跳地跟着爷爷穿过大屋。尽头那扇门后有个小房间，是爷爷的卧室。小房间后面还有一道门。海蒂自己推开一看，不由得站住了。那是一间大得出奇的屋子，像个厨房，比她见过的任何厨房都大。要把这里修好，爷爷显然还有许多活要做。墙上留着不少孔洞和裂缝，风正从里面呼呼地往里钻。爷爷已经钉了许多新木板，乍看像在四周安了一圈小橱柜。那扇又大又旧的门，也让他用螺钉和钉子牢牢封住，好挡住冷风。门外紧挨着一大片坍塌的房屋，高高的野草里住满了甲虫和蜥蜴。
        - id: ch01-b11
          speaker: narrator
          text: 海蒂喜欢极了这个新家。搬来的第二天早晨，她已经把每个角落都摸得一清二楚。彼得一来，她便领着他到处参观，把所有值得看的东西一样样指给他。旧宅里每一件奇妙的东西，她都非要彼得仔细看过，才肯让他离开。
        - id: ch01-b12
          speaker: narrator
          text: 海蒂每晚都在火炉旁睡得很香。可清晨刚醒时，她总以为自己仍在山上，还想着要马上跑出去，看看枞树是不是让厚雪压住了，才会那么安静。她得朝四周看一阵，才明白自己身在何处。一想到这里不是山上的小屋，胸口便像压了什么似的。接着，她会听见爷爷在外面照料山羊。山羊也大声叫上一两下，像在催她。于是海蒂又高兴了。只要爷爷和山羊都在，她就仍然在家。第四天早晨，她一见爷爷，便说出了惦记已久的事。
        - id: ch01-b13
          speaker: heidi
          text: 我今天一定得上山看祖母。不能让她一个人等这么久。
        - id: ch01-b14
          speaker: grandpa
          text: 今天不能去，明天也不行。山上的雪深得很，现在还在下。连结实的彼得都走得很吃力。你这么小，很快就会让雪埋住，到时候我们再也找不到你。等雪冻硬些，你就能踩在上面走了。
        - id: ch01-b15
          speaker: narrator
          text: 一想到还要等，海蒂很不情愿。不过每天都有许多事，她还没怎么留意，日子便飞快过去了。如今她每天上午和下午都去多尔夫里上学，老师教什么，她便热心又认真地学什么。彼得却很少在那里露面，几乎总是缺课。
        - id: ch01-b16
          speaker: teacher
          text: 看来彼得今天又不来了。山上雪那么厚，他大概走不下来吧。
        - id: ch01-b17
          speaker: narrator
          text: 老师很随和，偶尔说过这句话，也就算了。奇怪的是，傍晚学校一放学，彼得却总能穿过山上的厚雪走下来，而且通常还会顺路去看海蒂。
        - id: ch01-b18
          speaker: narrator
          text: 又过了几天，太阳终于出来，把白色的大地照得亮堂堂的。可它很早便躲到山后，仿佛大地没有绿草和鲜花以后，也没那么值得看了。夜里，一轮清亮的大月亮升起，照着广阔的雪原，整整一夜都没有离开。第二天早晨，整座山到处闪闪发亮，像一块巨大的水晶。彼得照常爬出窗口，却没像往常那样陷进软雪，而是扑倒在坚硬的冰面上。他像一架没人驾驭的雪橇，沿着山坡滑下去一大截，才终于停住身子。
        - id: ch01-b19
          speaker: narrator
          text: 彼得爬起来，又跺脚，又使出全身力气拿鞋跟去凿，结果连一小片冰碴也敲不下来。整片高山牧场已经冻得像铁一样硬。彼得盼的正是这样，因为他知道，海蒂终于能踩着硬雪上山看他们了。他赶紧回屋，一口喝下母亲备好的牛奶，又把一块面包塞进口袋。
        - id: ch01-b20
          speaker: peter
          text: 我得去上学了。
        - id: ch01-b21
          speaker: grandmother
          text: 这才对。去吧，能学多少就好好学多少。
        - id: ch01-b22
          speaker: narrator
          text: 彼得再次钻出窗户。门已经被冻雪堵死了。他拖出小雪橇，转眼便冲下山去，快得像一道闪电。到了多尔夫里，前面的路直通迈恩费尔德。他觉得这速度根本停不下来，硬停只会摔坏自己和雪橇，索性继续往前冲。到了平地，雪橇总算自己停了。彼得下来一看，竟然已经越过迈恩费尔德好一段路。
        - id: ch01-b23
          speaker: narrator
          text: 彼得四下一看，才发现自己被那股冲劲带得太远了。学校的课早就开始，从这里走回多尔夫里还得整整一个钟头。他想，反正已经迟了，慢慢回去也没关系，果然一路不慌不忙。等他走进多尔夫里，海蒂刚放学回家，正在跟爷爷吃午饭。彼得今天有一件要紧的消息，便站到屋子正中，连口气也不歇，急着说了出来。
        - id: ch01-b24
          speaker: peter
          text: 她现在冻住啦。
        - id: ch01-b25
          speaker: grandpa
          text: 什么冻住了？瞧你这副口气，跟要开战似的，将军。
        - id: ch01-b26
          speaker: peter
          text: 雪冻住了。
        - id: ch01-b27
          speaker: heidi
          text: 那我现在能去看祖母啦！可你怎么没去学校？你明明可以坐雪橇下来呀。
        - id: ch01-b28
          speaker: narrator
          text: 在海蒂看来，明明去得了还要缺课，可不是好孩子该做的事。
        - id: ch01-b29
          speaker: peter
          text: 雪橇把我带得太远。等我回来，已经迟了。
        - id: ch01-b30
          speaker: grandpa
          text: 这就叫临阵脱逃。逃兵要被揪耳朵，你知道吧？你还是领兵的将军，逃跑就更丢脸了。要是山羊一只往东，一只往西，不肯跟着你，也不肯做对它们有好处的事，你会怎么办？
        - id: ch01-b31
          speaker: narrator
          text: 彼得吓得扯了扯帽子。阿尔姆大叔正是他最敬畏的人。
        - id: ch01-b32
          speaker: peter
          text: 我会揍它们。
        - id: ch01-b33
          speaker: grandpa
          text: 要是一个孩子也像那些淘气山羊，因为不听话挨了揍，你会怎么说？
        - id: ch01-b34
          speaker: peter
          text: 那是他活该。
        - id: ch01-b35
          speaker: grandpa
          text: 好，你记住。下次该上课的时候，你要是又让雪橇带着你冲过学校，事后来找我，把该受的罚领了。
        - id: ch01-b36
          speaker: narrator
          text: 彼得这才明白爷爷这一连串问题的用意。原来，那个像淘气山羊一样不肯听话的孩子就是他。他有些害怕地瞟向墙角，想看看那里是不是正好放着什么可以惩罚他的家伙，就像他平时惩罚山羊时用的东西一样。爷爷却忽然换了快活的口气。
        - id: ch01-b37
          speaker: grandpa
          text: 来，坐下吃点东西。吃完以后，海蒂跟你一起走。晚上把她送回来，我给你留晚饭。
        - id: ch01-b38
          speaker: narrator
          text: 彼得没料到事情会忽然变成这样，立刻笑开了花，毫不犹豫地坐到海蒂身边。海蒂想到马上能见祖母，激动得再也吃不下了，把盘里剩下的土豆和烤奶酪都推给彼得。爷爷又从另一边往他盘里添。食物堆得像座小山，彼得也毫不退缩，勇敢地大吃起来。海蒂跑到橱柜边，拿出克拉拉送的暖斗篷，穿好以后，把兜帽拉到头顶。她已经准备妥当，就站在彼得身边，直等他咽下最后一口。
        - id: ch01-b39
          speaker: heidi
          text: 好啦，我们现在就走吧。
        - id: ch01-b40
          speaker: narrator
          text: 两个孩子并肩走在路上，海蒂有许多话要告诉彼得。她说，自己的两只山羊刚搬进新棚时难过极了，什么也不肯吃，只垂着头站在那里，连叫一声的精神都没有。海蒂去问爷爷这是怎么回事。爷爷告诉她，山羊这辈子头一次离开山上，那份难过就跟海蒂当初去了法兰克福一样。
        - id: ch01-b41
          speaker: heidi
          text: 彼得，你要是没亲自尝过，就不会明白那是什么滋味。
        - id: ch01-b42
          speaker: narrator
          text: 彼得一路都在想爷爷的话，几乎没听见海蒂说什么。直到快到家，他才停住脚步，闷闷地开了口。
        - id: ch01-b43
          speaker: peter
          text: 那我还是去上学吧，总比挨大叔说的那顿打好。
        - id: ch01-b44
          speaker: narrator
          text: 海蒂也这么认为，便鼓励他一定照办。两人进屋时，布丽吉塔独自坐着织东西。祖母受了寒，身体不舒服，只能卧床休息。海蒂从没见祖母离开墙角那个熟悉的座位，赶忙跑进里屋。老人躺在铺盖单薄的小床上，裹着那条暖和的灰披肩。
        - id: ch01-b45
          speaker: grandmother
          text: 感谢上帝，你终于来了！
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: 可怜的祖母整个秋天都在暗暗害怕。海蒂只要隔得久些不来，她心里的不安便格外强烈。彼得说过，有位陌生先生从法兰克福来，总带着海蒂出去，还跟她说很多话。祖母认定那人是来把海蒂带走的。后来听说先生独自离开了，她还是放心不下，总觉得法兰克福会另派人来接孩子。海蒂走到床边，忧心地望着她。
        - id: ch01-b47
          speaker: heidi
          text: 祖母，您病得很厉害吗？
        - id: ch01-b48
          speaker: grandmother
          text: 没有，没有，孩子。只是寒气钻进骨头里一点儿。
          emotion: calm
        - id: ch01-b49
          speaker: heidi
          text: 那等天气暖起来，您马上就会全好吗？
        - id: ch01-b50
          speaker: grandmother
          text: 会的，只要上帝愿意。或许还不用等那么久呢。我还想回去纺线。今天原本也想纺一点儿，明天准能全好。
          emotion: calm
        - id: ch01-b51
          speaker: narrator
          text: 祖母看出海蒂害怕，便尽力让她安心。海蒂确实十分忧虑，因为她从来没见祖母病倒在床上，也从来没见那个熟悉的身影离开墙角。听完这些话，她总算好受些。她严肃地看了老人一两分钟，又发现一件不明白的事。
        - id: ch01-b52
          speaker: heidi
          text: 法兰克福的人都是出门散步才披披肩。祖母，您怎么把它披到床上来了？
        - id: ch01-b53
          speaker: grandmother
          text: 我披着它，就不会冻着了呀。我的被褥不太厚，所以有这件披肩真好。
        - id: ch01-b54
          speaker: heidi
          text: 可是您的床也不对。头这边应该高起来，现在反而往下斜。
        - id: ch01-b55
          speaker: grandmother
          text: 我知道，孩子，我躺着能感觉到。这只枕头原本就不厚，我又睡了这么多年，早已把它压得扁扁的了。
        - id: ch01-b56
          speaker: narrator
          text: 祖母摸了摸脑后的薄枕头，想找个舒服些的姿势。那枕头硬得简直像块木板。
        - id: ch01-b57
          speaker: heidi
          text: 早知道，我就该请克拉拉让我带走法兰克福那张床。我有三个大枕头，一个叠着一个，害得我几乎睡不着。我总往下滑，想找个平地方，可人家说规矩就是要睡在那么高的地方，我只好又把自己往上挪。祖母，您能睡在那样的枕头上吗？
        - id: ch01-b58
          speaker: grandmother
          text: 当然能。枕头能保暖，头垫高些，呼吸也容易。不过别再说这些了。许多年老生病的人没有的东西，我已经有了很多，真该感谢上帝。我每天都有好面包，还有这条暖披肩，也有你来看我。海蒂，今天给我读点什么吧。
        - id: ch01-b59
          speaker: narrator
          text: 祖母说话时，疲倦地抬起头，像是在寻找一个高些的地方靠住。海蒂跑到外屋拿来赞美诗集。祖母已经好多天没听她读了，她便把老人最爱的诗一首接一首挑出来，慢慢念给她听。如今海蒂早已把这些诗全都记熟。孩子读得欢喜，祖母听得也欢喜。老人双手交握，静静躺着。疲惫而忧愁的脸上渐渐露出安详的微笑，仿佛刚刚有人给她带来了一个好消息。
        - id: ch01-b60
          speaker: heidi
          text: 祖母，您是不是已经完全好啦？
        - id: ch01-b61
          speaker: grandmother
          text: 是啊，孩子。听着你读，我已经好多了。继续吧，把它读完。
          emotion: happy
        - id: ch01-b62
          speaker: narrator
          text: 海蒂接着往下读，终于读到最后几句。
        - id: ch01-b63
          speaker: heidi
          text: 纵然双眼渐渐昏暗，黑夜把四周笼罩，灵魂却会越发明亮，看清自己归往的目标，欢喜地感到，那永恒的家已越来越近。
        - id: ch01-b64
          speaker: narrator
          text: 祖母轻声把诗句重复了一两遍，脸上满是喜悦和向往。海蒂也从诗句里感受到了同样的快乐。她眼前又出现了自己回家那天，阳光照耀群山的美丽景象。
        - id: ch01-b65
          speaker: heidi
          text: 祖母，我知道回家是什么滋味！
          emotion: happy
        - id: ch01-b66
          speaker: narrator
          text: 祖母没有回答，可她把海蒂的话全都听见了。那种让孩子以为她已经康复的喜悦神情，始终留在老人脸上。过了一阵，窗外的天色慢慢暗了下来。
        - id: ch01-b67
          speaker: heidi
          text: 天快黑了，我该回家了。知道您已经全好了，我真高兴。
        - id: ch01-b68
          speaker: narrator
          text: 祖母把海蒂的手握进掌心，紧紧攥住。
        - id: ch01-b69
          speaker: grandmother
          text: 是啊，我心里又快活了。就算还得一直躺着，我也知足。没人知道，日复一日独自躺在这里是什么滋味。四周又静又黑，听不到人的声音，也看不见一丝光。那些悲伤的念头会涌上来。有时候，我觉得自己再也熬不下去了，也觉得光明永远不会回来。可是你一来，把那些话念给我听，我就得到了安慰，心里也重新欢喜起来。
          emotion: sad
        - id: ch01-b70
          speaker: narrator
          text: 祖母终于放开她。海蒂跑到外屋，催彼得赶快走，因为天已经全黑了。可他们出了门才发现，一轮月亮正照着白雪，四周清清楚楚，亮得像白天。彼得拖来雪橇，让海蒂坐在后面，自己坐在前面掌舵。两个孩子飞快地滑下山去，像两只鸟从空中掠过。
        - id: ch01-b71
          speaker: narrator
          text: 那天夜里，海蒂躺在高高的干草床上，想起祖母那只低矮的枕头，也想起老人说，只要听见赞美诗，光和安慰就会在心里醒来。海蒂想，要是自己每天都能读给祖母听，也许就能让她一天比一天好。可她知道，下一次上山，至少还要等一个星期，说不定得等两个星期。这个念头让海蒂十分苦恼。她想了又想，拼命琢磨怎样才能让祖母每天听到那些喜爱的诗句。
        - id: ch01-b72
          speaker: narrator
          text: 忽然，她想出了一个办法。这个主意让她欢喜极了，简直等不到早晨，只想立刻开始实行。海蒂猛地从床上坐了起来。她方才一直忙着想心事，竟忘记了祷告。如今，不做完祷告，她绝不会结束一天。于是，她全心全意地为自己、爷爷和祖母祈祷。祷告完，她重新躺回温暖柔软的干草里，很快安稳地睡着了，一直睡到清晨来临。
