  chapters:
    - id: ch01
      title: Another Grandmother
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next evening, the whole house was filled with excitement and preparation. Anyone could see that the expected lady was someone whose opinion mattered and whom everyone deeply respected. Tinette wore a new white cap for the occasion. Sebastian gathered every footstool he could find and placed them in convenient spots. Wherever the visitor chose to sit, one would be waiting for her feet. Fraulein Rottenmeier moved from room to room, inspecting every detail. She held herself very straight and looked especially dignified. Another powerful lady might be coming, but Fraulein Rottenmeier meant to show that her own authority was not about to disappear.
        - id: ch01-b02
          speaker: narrator
          text: At last, the carriage drove up to the door. Tinette and Sebastian hurried down the steps to meet it. Fraulein Rottenmeier followed at a slower and more stately pace, then stepped forward to welcome the guest. Heidi had been sent upstairs and ordered to remain in her room until someone called her. The grandmother would certainly want to see Clara alone first. So Heidi sat down in a corner and carefully repeated all her instructions to herself while she waited.
        - id: ch01-b03
          speaker: narrator
          text: Before long, Tinette poked her head through the door.
        - id: ch01-b04
          speaker: tinette
          text: Go downstairs to the study.
        - id: ch01-b05
          speaker: narrator
          text: Heidi had not dared ask Fraulein Rottenmeier again what she should call the grandmother. She wondered if the lady had made a mistake. Heidi had never heard anyone called by anything but a proper name. As she opened the study door, a kind voice welcomed her.
        - id: ch01-b06
          speaker: grandmother
          text: Ah, here she is! Come in, child, and let me get a good look at you.
        - id: ch01-b07
          speaker: narrator
          text: Heidi walked over and spoke clearly. She said good evening, then carefully used the title Fraulein Rottenmeier had taught her.
        - id: ch01-b08
          speaker: heidi
          text: Good evening, Mrs. Madam.
        - id: ch01-b09
          speaker: grandmother
          text: Well! Is that what you call people back on your mountain?
          emotion: happy
        - id: ch01-b10
          speaker: heidi
          text: No. I never knew anyone with that name before.
        - id: ch01-b11
          speaker: grandmother
          text: Neither did I! Never mind. When I'm with the children, I'm always Grandmamma. You can remember that, can't you?
          emotion: happy
        - id: ch01-b12
          speaker: heidi
          text: Oh, yes. I used to say that all the time at home.
        - id: ch01-b13
          speaker: grandmother
          text: I see.
        - id: ch01-b14
          speaker: narrator
          text: Grandmamma gave a cheerful little nod and studied Heidi more closely. Every so often, she nodded again. Heidi looked steadily back with her serious eyes. There was such kindness and warmth in the newcomer that everything about her pleased Heidi. She could hardly look away. Grandmamma's hair was beautiful and white. Two long lace ends hung from the cap on her head. Whenever she moved, they fluttered gently around her face as though a soft breeze were always blowing there. The sight gave Heidi a feeling of pure delight.
        - id: ch01-b15
          speaker: grandmother
          text: And what is your name, child?
        - id: ch01-b16
          speaker: heidi
          text: Everyone calls me Heidi. But now I'm supposed to be Adelaide, so I'll try to remember—
        - id: ch01-b17
          speaker: narrator
          text: Heidi stopped. She felt a little guilty because she still did not answer when Fraulein Rottenmeier suddenly called her Adelaide. Just then, Fraulein Rottenmeier entered the room.
        - id: ch01-b18
          speaker: rottenmeier
          text: Frau Sesemann will surely agree that we needed a name the servants could pronounce easily.
        - id: ch01-b19
          speaker: grandmother
          text: My good Rottenmeier, if someone is named Heidi and is used to being called Heidi, then Heidi is what I shall call her. And that settles it.
        - id: ch01-b20
          speaker: narrator
          text: Fraulein Rottenmeier hated being addressed by her last name alone. But Grandmamma always went her own way, so there was nothing to be done. She was sharp, too. The moment she entered a house, she understood exactly what was going on inside it.
        - id: ch01-b21
          speaker: narrator
          text: The next day after dinner, Clara lay down on her couch as usual. Grandmamma sat beside her for a few minutes and closed her eyes. Before long, she was on her feet again, as lively as ever. She trotted into the dining room, but no one was there. She supposed Heidi must be asleep. Then she went straight upstairs to Fraulein Rottenmeier's room and knocked loudly. Several minutes passed before the door opened. Fraulein Rottenmeier drew back in surprise. She had not expected Grandmamma to visit her there.
        - id: ch01-b22
          speaker: grandmother
          text: Where is the child? What does she do with herself all this time? That's what I've come to ask.
        - id: ch01-b23
          speaker: rottenmeier
          text: She sits in her room. She could make herself useful there if she had the slightest idea how. But Frau Sesemann, you cannot imagine the strange things that child thinks up and does. I could hardly describe them in polite company.
        - id: ch01-b24
          speaker: grandmother
          text: I might do the same things if I were made to sit in there like her. And then you certainly wouldn't want to describe my behavior in polite company! Please bring the child to my room. I have some lovely books to give her.
        - id: ch01-b25
          speaker: rottenmeier
          text: But that is the problem. What good are books to her? After all this time, she still hasn't learned her ABCs. Nothing seems to enter her head. The tutor will confirm it. If that man didn't have the patience of an angel, he would have stopped teaching her long ago.
        - id: ch01-b26
          speaker: grandmother
          text: How strange. She doesn't look like a child who can't learn her letters. Bring her anyway. At least she can enjoy the pictures.
        - id: ch01-b27
          speaker: narrator
          text: Fraulein Rottenmeier was ready with several more remarks, but Grandmamma had already turned away and hurried toward her own room. The report that Heidi could not learn surprised her. She meant to discover the truth for herself, though she would not question the tutor. She respected him as an upright man and always had a friendly greeting for him. Still, she carefully avoided being drawn into conversation with him. His long, roundabout way of speaking always tired her.
        - id: ch01-b28
          speaker: narrator
          text: Soon Heidi stood in Grandmamma's room, gazing with wide-eyed delight at the beautiful colored pictures. Grandmamma slowly turned the pages for her. When a new picture appeared, Heidi suddenly cried out. For a moment or two, she stared as her eyes grew brighter. Then tears began to fall. At last, she broke into sobs. Grandmamma looked down at the page. It showed a green pasture filled with young animals. Some were grazing, while others nibbled at the bushes. In the middle stood a shepherd. He leaned on his staff and watched over his happy flock. The sun was sinking below the horizon, and golden light covered the whole scene.
        - id: ch01-b29
          speaker: narrator
          text: Grandmamma rested a kind hand on Heidi's.
        - id: ch01-b30
          speaker: grandmother
          text: Don't cry, dear child. Perhaps the picture reminded you of something. It has a beautiful story, and I'll tell it to you tonight. These books have many other wonderful stories to read and tell again. But first, you and I must talk. Dry your tears and come stand where I can see you. There. We're all right again.
          emotion: calm
        - id: ch01-b31
          speaker: narrator
          text: Heidi could not stop sobbing at once. Grandmamma did not rush her. She waited patiently and, from time to time, repeated that everything was all right and they could be happy again. Only when she saw that Heidi was truly growing calmer did she begin to ask her questions.
        - id: ch01-b32
          speaker: grandmother
          text: Tell me, how are your lessons going? Do you like them? Have you learned very much?
        - id: ch01-b33
          speaker: heidi
          text: Oh, no. But I knew from the start I couldn't learn it.
          emotion: sad
        - id: ch01-b34
          speaker: grandmother
          text: What do you think you can't learn?
        - id: ch01-b35
          speaker: heidi
          text: Reading. It's too hard.
        - id: ch01-b36
          speaker: grandmother
          text: Really? Who told you that?
          emotion: surprised
        - id: ch01-b37
          speaker: heidi
          text: Peter did. He knows because he tried and tried, and he couldn't learn.
        - id: ch01-b38
          speaker: grandmother
          text: Then Peter must be a very unusual boy! Listen, Heidi. We can't always believe whatever Peter says. We have to try for ourselves. I'm sure you weren't paying full attention while the tutor taught you your letters.
        - id: ch01-b39
          speaker: heidi
          text: It won't do any good.
        - id: ch01-b40
          speaker: narrator
          text: Heidi spoke as if this were a hardship she simply had to bear.
        - id: ch01-b41
          speaker: grandmother
          text: Now listen to me. You haven't learned your alphabet because you believed what Peter told you. This time, you must believe me. I tell you that you can learn to read very soon, just as many other children do. Those children are like you, not like Peter. And then comes the best part. Do you see that picture with the shepherd and the animals? As soon as you can read, the whole book will be yours. You'll discover all about the sheep and goats, what the shepherd did, and every wonderful thing that happened to him. It will feel just as if someone were telling you the entire story. You would like that, wouldn't you?
        - id: ch01-b42
          speaker: heidi
          text: Oh, if only I could read right now!
        - id: ch01-b43
          speaker: grandmother
          text: I can see it won't take you long. Come, let's go back to Clara. Bring the books with you.
        - id: ch01-b44
          speaker: narrator
          text: Heidi had listened to every word with eager attention. Now she longed to read more than ever. When Grandmamma said it would not take her long to learn, Heidi believed her. Then Heidi gathered up the books. Hand in hand, the two of them left Grandmamma's room and returned downstairs to Clara in the study.
        - id: ch01-b45
          speaker: narrator
          text: Heidi had changed since the day she longed so badly for home that she tried to leave. Fraulein Rottenmeier had found her on the steps and scolded her. She called Heidi wicked and ungrateful for trying to run away. She also said it was a good thing Herr Sesemann knew nothing about it. That day, Heidi finally understood that Dete had been wrong. She could not go home whenever she wished. She would have to remain in Frankfurt for a long, long time, perhaps forever.
        - id: ch01-b46
          speaker: narrator
          text: Heidi believed Herr Sesemann would think her ungrateful if she said she wanted to leave. She was sure Clara and Grandmamma would think the same. That left no one she dared trust with her longing for home. Grandmamma was so kind to her. Heidi would not, for anything in the world, give her a reason to become as angry as Fraulein Rottenmeier had been. So the child kept everything hidden inside.
        - id: ch01-b47
          speaker: narrator
          text: But the sorrow in Heidi's little heart grew heavier and heavier. She could no longer eat her meals, and every day she became a little paler. At night, she lay awake for hours. As soon as she was alone and everything around her had grown still, the mountain rose clearly before her. She saw it covered in sunshine and flowers. When sleep finally came, she dreamed of the rocks and the snowfield turning crimson in the evening light.
        - id: ch01-b48
          speaker: narrator
          text: Each morning, Heidi woke believing for a moment that she was back at the hut. She would get ready to run joyfully outside and into the sun. Then she saw the large bed. The truth came back all at once. She was in Frankfurt, far, far away from home. Again and again, she pressed her face into the pillow and wept there for a long time. She kept every sob quiet so no one would hear her.
        - id: ch01-b49
          speaker: narrator
          text: Heidi's unhappiness did not escape Grandmamma. She watched the child for several days, hoping the sadness would pass and Heidi would grow bright again. Instead, nothing improved. Morning after morning, Heidi came downstairs looking as though she had already been crying. At last, Grandmamma brought her into her room one day. She drew the child close and gently asked what was wrong.
        - id: ch01-b50
          speaker: grandmother
          text: Heidi, tell me what's wrong. Is something troubling you?
        - id: ch01-b51
          speaker: narrator
          text: Heidi feared the truth would make Grandmamma think she was ungrateful and stop being kind to her.
        - id: ch01-b52
          speaker: heidi
          text: I can't tell you.
        - id: ch01-b53
          speaker: grandmother
          text: Could you tell Clara?
        - id: ch01-b54
          speaker: heidi
          text: Oh, no. I can't tell anyone.
          emotion: sad
        - id: ch01-b55
          speaker: narrator
          text: Her answer was firm, but her face held so much pain that Grandmamma's heart filled with pity.
        - id: ch01-b56
          speaker: grandmother
          text: Then let me tell you what to do, dear child. When we're in great trouble and can't speak about it to anyone, we can turn to God. We can tell Him what is in our hearts and ask Him to help us. He can free us from every worry weighing us down. You understand that, don't you? Each evening, you say your prayers to God in heaven. You thank Him for everything He has done for you, and you ask Him to keep you from all harm. Isn't that what you do?
          emotion: calm
        - id: ch01-b57
          speaker: heidi
          text: No. I never pray.
        - id: ch01-b58
          speaker: grandmother
          text: Has no one ever taught you? Don't you know what praying means?
          emotion: surprised
        - id: ch01-b59
          speaker: heidi
          text: I used to pray with my first grandmother. But that was a long time ago, and I've forgotten how.
        - id: ch01-b60
          speaker: grandmother
          text: Then that's why you've felt so unhappy. You thought there was no one who could help you. But think what a comfort it is when your heart is heavy with grief. At any moment, you can go to God and tell Him everything. You can ask Him for the help no one else can give you. He can help. And He can give you everything that will make you happy again.
          emotion: calm
        - id: ch01-b61
          speaker: narrator
          text: A sudden light of joy came into Heidi's eyes.
        - id: ch01-b62
          speaker: heidi
          text: Can I tell Him everything? Everything?
          emotion: surprised
        - id: ch01-b63
          speaker: grandmother
          text: Yes, Heidi. Everything.
          emotion: calm
        - id: ch01-b64
          speaker: narrator
          text: Heidi quickly pulled her hand from Grandmamma's loving hold.
        - id: ch01-b65
          speaker: heidi
          text: May I go now?
        - id: ch01-b66
          speaker: grandmother
          text: Yes, of course.
        - id: ch01-b67
          speaker: narrator
          text: Heidi ran out of Grandmamma's room and hurried into her own. She sat down on a stool and folded her hands together. Then she told God about everything that was making her so sad and unhappy. She held nothing back. When she had told it all, she earnestly begged Him to help her and to let her go home to Grandfather.
        - id: ch01-b68
          speaker: narrator
          text: About a week after Heidi's prayer, the tutor asked Grandmamma for a private interview. A remarkable thing had happened, and he wished to report it. Grandmamma invited him to her room. When he entered, she greeted him warmly, held out her hand, and pushed a chair toward him.
        - id: ch01-b69
          speaker: grandmother
          text: I'm glad to see you. Please sit down and tell me what brings you here. Nothing bad, I hope? No complaints?
        - id: ch01-b70
          speaker: tutor
          text: Quite the opposite. Something has happened that I had entirely stopped hoping for. No one who knew all that came before could possibly have guessed it. By every expectation, what has occurred can only be called a miracle. And yet it truly has occurred, in the most extraordinary manner, quite contrary to anything one might reasonably have anticipated—
        - id: ch01-b71
          speaker: grandmother
          text: Has Heidi finally learned to read?
        - id: ch01-b72
          speaker: narrator
          text: The tutor stared at her, too astonished to speak. At last, he found his voice.
        - id: ch01-b73
          speaker: tutor
          text: It is truly amazing. She never seemed able to learn even her ABCs, despite all my careful explanations and the unusual effort I devoted to her. At last, I decided to make no further attempt at the impossible. I simply placed the letters before her as they were, without any long discussion of their origin and meaning. And now, one might say she learned them overnight. She began reading correctly at once, which is not at all what one expects from a beginner. It is almost equally astonishing that you guessed such an unlikely development.
          emotion: surprised
        - id: ch01-b74
          speaker: grandmother
          text: Many unlikely things happen in life. Sometimes two things come together and produce a happy result. Here, perhaps a fresh eagerness to learn met a new method of teaching. Neither one did any harm. We can only be glad that the child has made such a good beginning, and hope that she continues to improve.
          emotion: happy
        - id: ch01-b75
          speaker: narrator
          text: After saying goodbye to the tutor, Grandmamma went down to the study to make certain the good news was true. There sat Heidi beside Clara, reading aloud to her. Heidi herself seemed amazed by what she could do. As she read, the black letters came alive. They turned into people and things and exciting stories. With every line, her delight grew as a whole new world opened before her.
        - id: ch01-b76
          speaker: narrator
          text: That same evening, Heidi came to the table and found the large book with the beautiful pictures lying on her plate. She looked from the book to Grandmamma, with a question in her eyes. Grandmamma answered with a kind nod.
        - id: ch01-b77
          speaker: grandmother
          text: Yes. It's yours now.
        - id: ch01-b78
          speaker: heidi
          text: Mine to keep? Even when I go home?
          emotion: happy
        - id: ch01-b79
          speaker: grandmother
          text: Of course. It's yours forever. Tomorrow, we'll begin reading it.
        - id: ch01-b80
          speaker: clara
          text: But you're not going home yet, Heidi. Not for years. When Grandmamma leaves, I want you to stay here with me.
        - id: ch01-b81
          speaker: narrator
          text: That night, Heidi went to her room and looked at her book once more before bed. From that day forward, her greatest pleasure was reading the stories that belonged to its beautiful pictures. She read them over and over. In the evening, Grandmamma would invite Heidi to read aloud to them. Heidi was always delighted, because reading was no trouble to her now. As she spoke the words, every scene seemed clearer and more beautiful. Afterward, Grandmamma explained the stories and told Heidi and Clara even more about them.
        - id: ch01-b82
          speaker: narrator
          text: Still, Heidi loved the shepherd picture best. There he stood, leaning on his staff with the flock all around him in the green pasture. He was home again and happy, caring for his father's sheep and goats. Another picture showed him far away from his father's house. He had been forced to watch over pigs, and he had grown pale and thin because husks were all he had to eat. Even the sun looked less bright in that picture. The whole world around him seemed gray and misty.
        - id: ch01-b83
          speaker: narrator
          text: Then came the third picture in the story. The old father was running forward with both arms stretched wide, ready to meet and embrace his returning son. The son was sorry for what he had done. He came toward his father timidly, worn out and terribly thin, with a ragged coat hanging from him. This was Heidi's favorite story of all. She read it over and over, sometimes aloud and sometimes to herself. And she never grew tired of hearing Grandmamma explain it to her and Clara.
        - id: ch01-b84
          speaker: narrator
          text: Of course, the book held many other stories too. Heidi read those and looked closely at all their pictures. With so much to read, see, and hear Grandmamma explain, the days passed quickly. The happy hours seemed to hurry by. Before long, the time drew near for Grandmamma to leave Frankfurt and return home.
