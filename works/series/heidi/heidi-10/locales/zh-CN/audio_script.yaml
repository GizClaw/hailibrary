audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    tutor:
      display_name: 家庭教师
      tts:
        delivery: 谨慎克制，说理时平稳周全
        timbre: 温和端正
        pace: 不紧不慢
        pitch: 中音
    grandmother:
      display_name: 祖母
      tts:
        delivery: 慈爱爽朗，机敏风趣，说话亲切而有主见
        timbre: 温暖明亮，带着年长女性的柔和质感
        pace: 从容自然，劝慰时舒缓
        pitch: 中音
    tinette:
      display_name: 蒂内特
      tts:
        delivery: 简短利落，守礼中略显冷淡
        timbre: 清脆偏冷
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 另一位祖母来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天傍晚，整座宅子都在等候一位贵客。人人忙着准备，一看就知道，这位夫人深受敬重，说出来的话也很有分量。蒂内特换上了崭新的白帽子。塞巴斯蒂安把家里所有脚凳都找出来，摆到方便的地方。这样一来，夫人无论什么时候想坐下，脚边都有一只现成的。
        - id: ch01-b02
          speaker: narrator
          text: 罗滕迈尔小姐挺直腰背，到处巡视。她那副威严的样子，仿佛在告诉所有人，就算另一位有权势的人要来了，她在这屋里的权威也不会消失。
        - id: ch01-b03
          speaker: narrator
          text: 马车终于停在门前。蒂内特和塞巴斯蒂安奔下台阶迎接，罗滕迈尔小姐迈着庄重的步子跟在后面。海蒂却被送回房间，必须等人叫她才能下楼，因为祖母刚到，当然要先单独看看克拉拉。
        - id: ch01-b04
          speaker: narrator
          text: 海蒂坐在墙角，把听到的吩咐一遍遍念给自己听。没过多久，蒂内特从门边探进头来。
        - id: ch01-b05
          speaker: tinette
          text: 下楼，到书房去。
        - id: ch01-b06
          speaker: narrator
          text: 海蒂一直没敢再问罗滕迈尔小姐，该怎样称呼祖母。她还怀疑那番吩咐是不是弄错了。哪有人不按自己的名字来叫，反倒用别的名号呢？她推开书房门，里面立刻传来一个和善的声音。
        - id: ch01-b07
          speaker: grandmother
          text: 啊，这孩子来了！快进来，让我好好看看你。
        - id: ch01-b08
          speaker: narrator
          text: 海蒂走到客人面前，先用清亮的嗓音，一字一句地向她问好。接着，她努力照罗滕迈尔小姐的话去做。
        - id: ch01-b09
          speaker: heidi
          text: 晚上好，夫人太太。
        - id: ch01-b10
          speaker: grandmother
          text: 哎呀！你们山上都是这样称呼人的吗？
        - id: ch01-b11
          speaker: heidi
          text: 不是。我以前从没认识过叫这个名字的人。
        - id: ch01-b12
          speaker: narrator
          text: 祖母又笑了，还轻轻拍了拍海蒂的脸颊。
        - id: ch01-b13
          speaker: grandmother
          text: 我也不认识呢！不过不要紧。我跟孩子们在一起的时候，永远都是奶奶。这个名字，你不会忘吧？
        - id: ch01-b14
          speaker: heidi
          text: 不会，不会。我在家常常这样叫。
        - id: ch01-b15
          speaker: grandmother
          text: 原来是这样，我明白了。
        - id: ch01-b16
          speaker: narrator
          text: 祖母快活地点点头，又仔细打量起海蒂。海蒂也用那双沉静而认真的眼睛看着她。这位客人亲切又热诚，叫孩子打心眼里喜欢。祖母的一切都吸引着她，她怎么也舍不得移开目光。
        - id: ch01-b17
          speaker: narrator
          text: 祖母有一头美丽的白发，帽子两边垂下长长的花边。她每动一下，花边就在脸旁轻轻飘舞，像有一阵柔风围着她吹。海蒂看得满心欢喜。
        - id: ch01-b18
          speaker: grandmother
          text: 孩子，你叫什么名字？
        - id: ch01-b19
          speaker: heidi
          text: 大家一直叫我海蒂。不过现在他们要叫我阿德莱德，我会留神，尽量……
        - id: ch01-b20
          speaker: narrator
          text: 海蒂忽然停下了。她还没听惯阿德莱德这个名字，罗滕迈尔小姐突然这样叫她时，她总是不答应。想到这里，她有点惭愧。就在这时，罗滕迈尔小姐走进了房间。
        - id: ch01-b21
          speaker: rottenmeier
          text: 塞泽曼夫人想必也赞同我的看法。哪怕只是为了让仆人念起来方便，也应该给她选一个容易念的名字。
        - id: ch01-b22
          speaker: grandmother
          text: 我尊敬的罗滕迈尔，一个人若是叫海蒂，又早就听惯了这个名字，我就照样叫她海蒂。事情就这么定吧。
        - id: ch01-b23
          speaker: narrator
          text: 老夫人总是只叫她“罗滕迈尔”，这常常把罗滕迈尔小姐气得不轻。可气也没有用，祖母向来依自己的意思做事，谁也拿她没办法。况且她头脑敏锐，耳聪目明，才踏进家门，就看懂了这里正在发生什么。
    - id: ch02
      title: 图画书里的牧场
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天午饭后，克拉拉照常躺到卧榻上。祖母陪她坐了一会儿，闭了闭眼睛，随即又精神十足地站起来，脚步轻快地去了餐厅。那里一个人也没有。
        - id: ch02-b02
          speaker: grandmother
          text: 她大概睡着了。
        - id: ch02-b03
          speaker: narrator
          text: 祖母来到罗滕迈尔小姐门外，用力敲门。过了一会儿，门终于开了。罗滕迈尔小姐见到这位意外的访客，惊讶得往后一退。
        - id: ch02-b04
          speaker: grandmother
          text: 那孩子在哪里？这半天，她都在做些什么？我就是来问这件事的。
        - id: ch02-b05
          speaker: rottenmeier
          text: 她坐在自己房里。假如她多少懂得怎样做个有用的人，原本可以找点事情来做。可是，塞泽曼夫人，您根本想不到她会冒出什么离奇念头，又会做出什么怪事。有些事在体面人面前，我简直说不出口。
        - id: ch02-b06
          speaker: grandmother
          text: 我要是也像她一样，非得关在那间屋里，只怕做出的事也差不多。到时候，您肯定也不愿在体面人面前提起！去把孩子叫来，带到我房里。我带了几本漂亮的书，正想送给她。
        - id: ch02-b07
          speaker: narrator
          text: 罗滕迈尔小姐绝望地摊开双手。
        - id: ch02-b08
          speaker: rottenmeier
          text: 不幸就不幸在这里！书对她有什么用？她来了这么久，连字母都没学会。想往她脑子里放进一点东西，简直不可能。家庭教师也会这样告诉您。要不是他有天使一般的耐心，早就不教她了。
        - id: ch02-b09
          speaker: grandmother
          text: 这倒奇怪。依我看，她不像连字母都学不会的孩子。不管怎样，先把她带来。至少，她还能看看书里的图画。
        - id: ch02-b10
          speaker: narrator
          text: 罗滕迈尔小姐还想再说，祖母却已经转身，快步回自己的房间去了。听说海蒂学不会东西，她十分惊讶，也决定亲自弄明白。她没有去问家庭教师。她敬重他的品行，每次见面都会友好地问候，可从不肯让他拉住自己长谈，因为他那套说话方式实在叫人疲倦。
        - id: ch02-b11
          speaker: narrator
          text: 海蒂很快来到祖母房里。祖母把书递给她，她睁大眼睛，又惊又喜地看着那些美丽的彩色图画。忽然，祖母翻到新的一页，海蒂一看见上面的画，就惊叫出声。她的眼睛越看越亮，泪水却紧接着滚了下来，最后竟放声抽泣。
        - id: ch02-b12
          speaker: narrator
          text: 祖母低头看那幅画。碧绿的牧场上满是幼小的牲畜，有的吃草，有的啃着灌木。中间站着一个牧人。他倚着手杖，望着欢快的牲口。夕阳刚沉到地平线下，金色的光照遍了整幅画。
        - id: ch02-b13
          speaker: narrator
          text: 祖母慈爱地把手放在海蒂手上。
        - id: ch02-b14
          speaker: grandmother
          text: 别哭，亲爱的孩子，别哭。这幅画也许让你想起了什么。不过你看，画里有一个很美的故事，今晚我就讲给你听。书里还有许多好故事，可以自己读，也可以讲给别人听。
          emotion: calm
        - id: ch02-b15
          speaker: grandmother
          text: 现在，我们先谈一谈。擦干眼泪，站到我面前来，让我好好看看你。好啦，我们又高兴起来了。
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: 海蒂过了好一阵才止住哭泣。祖母没有催她，只等她慢慢平静，偶尔再柔声宽慰几句。
        - id: ch02-b17
          speaker: grandmother
          text: 好啦，已经没事了。我们又高兴起来了。
          emotion: calm
        - id: ch02-b18
          speaker: narrator
          text: 等海蒂终于安定下来，祖母才问起她的功课。
        - id: ch02-b19
          speaker: grandmother
          text: 告诉我，上课的时候，你学得怎么样？你喜欢那些功课吗？已经学会很多东西了吗？
        - id: ch02-b20
          speaker: heidi
          text: 哦，没有！不过我早就知道，那是学不会的。
          emotion: sad
        - id: ch02-b21
          speaker: grandmother
          text: 你觉得什么学不会？
        - id: ch02-b22
          speaker: heidi
          text: 读书呀。那太难了。
        - id: ch02-b23
          speaker: grandmother
          text: 真的吗？这是谁告诉你的？
        - id: ch02-b24
          speaker: heidi
          text: 彼得告诉我的。他当然知道，因为他试了又试，怎么也没学会。
        - id: ch02-b25
          speaker: grandmother
          text: 那彼得一定是个很古怪的男孩！可是海蒂，我们不能什么都听彼得的，得自己试一试。家庭教师教你认字母的时候，你肯定没有把全部心思都放在上面。
        - id: ch02-b26
          speaker: heidi
          text: 试了也没有用。
        - id: ch02-b27
          speaker: narrator
          text: 海蒂说得像个已经认命的人，只等着忍受一件无法改变的事。祖母却要她仔细听好。
        - id: ch02-b28
          speaker: grandmother
          text: 你一直没学会字母，是因为你相信了彼得。现在，你得相信我。我说你很快就能学会读书。许多孩子都能学会，他们跟你一样，可不像彼得。
        - id: ch02-b29
          speaker: grandmother
          text: 再听听后面的好事。你看见那幅有牧人和牲畜的画了吗？等你会读书了，这本书就送给你。羊和山羊的事，牧人做过的事，还有他遇见的奇妙事情，你都能自己读懂，就像有人把整个故事讲给你听。你很想知道这些，对不对？
        - id: ch02-b30
          speaker: narrator
          text: 海蒂一心一意地听着。听到这里，她长长叹了口气。
        - id: ch02-b31
          speaker: heidi
          text: 啊，要是我现在就会读书，该多好！
        - id: ch02-b32
          speaker: grandmother
          text: 我看你很快就能学会。现在，我们该下楼去找克拉拉了。把书带上吧。
        - id: ch02-b33
          speaker: narrator
          text: 祖母牵起海蒂的手，两个人一同回到书房。
    - id: ch03
      title: 不能说出的思念
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海蒂曾经因为太想回家，准备离开这座房子。可她在台阶上遇见了罗滕迈尔小姐，还挨了一顿责骂。罗滕迈尔小姐说，她想逃走，既恶劣又忘恩负义，幸好塞泽曼先生并不知道这件事。从那天起，海蒂变了。
        - id: ch03-b02
          speaker: narrator
          text: 直到那一天，她才终于明白，事情并不像迪特姨妈说的那样，她不能想回家就回家。她得留在法兰克福很久很久，也许永远不能离开。要是她想走，塞泽曼先生就会觉得她忘恩负义。她相信，祖母和克拉拉也会这样想，所以没有一个人能听她诉说。
        - id: ch03-b03
          speaker: narrator
          text: 海蒂不敢向任何人说自己有多想家。祖母对她这样好，她无论如何也不愿惹祖母生气，更不愿让祖母像罗滕迈尔小姐那样恼怒。可是，她心里的忧愁越来越重。她吃不下饭，脸色也一天比一天苍白。
        - id: ch03-b04
          speaker: narrator
          text: 到了夜里，海蒂总要清醒很久。只要四周安静下来，阳光灿烂、鲜花遍地的高山就会清清楚楚地出现在眼前。她终于睡着以后，又会梦见那些岩石和雪原，被夕阳染得通红。
        - id: ch03-b05
          speaker: narrator
          text: 早晨醒来，她还以为自己回到了小屋，正要快活地跑出去，奔进阳光里。可紧接着，她看见的还是那张大床。这里是法兰克福，她离家那么远，那么远。海蒂常常把脸埋在枕头里，安静地哭上很久，不让任何人听见。
        - id: ch03-b06
          speaker: narrator
          text: 祖母看出了海蒂的苦恼。她先等了几天，想看看孩子会不会重新开朗，脸上不再带着那副忧郁的神情。可是情况没有好转。海蒂许多个早晨下楼以前，显然都哭过。于是有一天，祖母又把她带进房间，拉到自己身边。
        - id: ch03-b07
          speaker: grandmother
          text: 告诉我吧，海蒂，到底怎么了？你有什么烦心事吗？
          emotion: calm
        - id: ch03-b08
          speaker: narrator
          text: 海蒂怕自己一说实话，祖母就会觉得她忘恩负义，从此不再对她这样好。
        - id: ch03-b09
          speaker: heidi
          text: 不能告诉您。
          emotion: sad
        - id: ch03-b10
          speaker: grandmother
          text: 那么，你能告诉克拉拉吗？
        - id: ch03-b11
          speaker: heidi
          text: 哦，不能。我谁也不能告诉。
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: 海蒂答得十分坚决，脸上却满是痛苦。祖母看着她，心里充满了怜惜。
        - id: ch03-b13
          speaker: grandmother
          text: 那么，亲爱的孩子，我告诉你该怎么做。人遇到很大的苦恼，又不能对任何人讲时，可以转向上帝，求他帮助。压在心头的每一种忧愁，他都能替我们解脱。你明白吗？
          emotion: calm
        - id: ch03-b14
          speaker: grandmother
          text: 你每天晚上都会向天上的上帝祷告吧？感谢他为你做的一切，也求他保护你，不让祸事临到你，对不对？
          emotion: calm
        - id: ch03-b15
          speaker: heidi
          text: 不，我从来不祷告。
        - id: ch03-b16
          speaker: grandmother
          text: 从来没人教过你吗，海蒂？难道你连祷告是什么意思也不知道？
        - id: ch03-b17
          speaker: heidi
          text: 从前，我跟第一个奶奶一起祷告过。可那是很久以前的事，我已经忘了。
        - id: ch03-b18
          speaker: grandmother
          text: 海蒂，你这样不快乐，是因为你不知道有谁能帮助你。心里压着沉重的忧伤时，无论什么时候，你都可以去找上帝，把一切告诉他，请他给你别人给不了的帮助。想想看，这是多大的安慰。
          emotion: calm
        - id: ch03-b19
          speaker: grandmother
          text: 上帝能帮助我们，也能把那些会让我们重新快乐起来的东西赐给我们。
          emotion: calm
        - id: ch03-b20
          speaker: narrator
          text: 海蒂的眼睛里忽然闪出喜悦的光。
        - id: ch03-b21
          speaker: heidi
          text: 我能把一切都告诉他吗？所有的事都能说吗？
          emotion: surprised
        - id: ch03-b22
          speaker: grandmother
          text: 能，海蒂。一切都能说。
          emotion: calm
        - id: ch03-b23
          speaker: narrator
          text: 祖母正疼爱地把海蒂的手握在两手之间，海蒂却把手抽出来，急忙问她。
        - id: ch03-b24
          speaker: heidi
          text: 我现在可以走了吗？
        - id: ch03-b25
          speaker: grandmother
          text: 当然可以。
        - id: ch03-b26
          speaker: narrator
          text: 海蒂立刻奔出祖母的房间，跑回自己的屋子。她坐上小凳，合起双手，把所有让自己忧伤难过的事情，一件不漏地全都告诉了上帝。她诚心诚意地求上帝帮助她，也求上帝让她回家，回到爷爷身边。
    - id: ch04
      title: 黑色字母活了起来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大约一星期以后，家庭教师请求和塞泽曼夫人面谈。他说有一件非同寻常的事，必须亲自告诉她。祖母请他进来，伸手问候，又把椅子推到他面前。
        - id: ch04-b02
          speaker: grandmother
          text: 见到您真高兴。请坐吧，告诉我，是什么事让您来找我？希望不是坏事，也不是来告状的吧？
        - id: ch04-b03
          speaker: tutor
          text: 恰恰相反。发生了一件我早已不再指望的事。凡是知道先前情形的人，谁也猜不到会有这样的结果。照理说，这件事简直只能算作奇迹。可它的确发生了，而且来得异常突然，完全出乎所有人的意料……
        - id: ch04-b04
          speaker: grandmother
          text: 难道海蒂这孩子终于学会读书了？
        - id: ch04-b05
          speaker: narrator
          text: 家庭教师惊讶地望着祖母，一时说不出话来。过了片刻，他才继续往下说。
        - id: ch04-b06
          speaker: tutor
          text: 这实在奇妙极了。我先前为她详加解释，也花了非同寻常的心力，她却好像连字母也学不会。后来，我决定不再勉强尝试这种不可能的事，只把字母原样摆给她看，也不再长篇讲解它们的来源和意义。
        - id: ch04-b07
          speaker: tutor
          text: 没想到，她一下子学得这样快。可以说，她一夜之间就认得了字母，马上开始正确地阅读，跟大多数初学者完全不同。还有一件事几乎同样令我吃惊，您竟然猜中了这样一件谁也料不到的事。
        - id: ch04-b08
          speaker: grandmother
          text: 生活里常有料不到的事。两件事碰到一起，有时就会有好结果。比如孩子忽然有了学习的热情，又赶上新的教法，这两样都没有坏处。她开了个好头，我们只管替她高兴，再盼着她继续进步吧。
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: 送走家庭教师以后，祖母下楼去书房，想亲眼看看这个好消息是不是真的。海蒂果然坐在克拉拉身边，正大声读书。她自己也对这个变化十分惊讶。那些黑色字母一个个活起来，变成了人，变成了事情，还变成了一段段扣人心弦的故事。一个从未见过的新世界在她眼前打开，她也越来越欢喜。
        - id: ch04-b10
          speaker: narrator
          text: 当天晚上，海蒂来到餐桌旁，刚在自己的位置坐下，就发现那本有美丽图画的大书正放在盘子上。她不敢相信这本书会属于自己，只好带着疑问看向祖母。祖母亲切地点点头。
        - id: ch04-b11
          speaker: grandmother
          text: 对，现在它是你的了。
        - id: ch04-b12
          speaker: heidi
          text: 是我的，可以一直留着吗？等我回家的时候，也能带走吗？
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: 海蒂满脸喜色，脸颊也红了。
        - id: ch04-b14
          speaker: grandmother
          text: 当然。它永远都是你的。明天，我们就开始读这本书。
        - id: ch04-b15
          speaker: clara
          text: 可是你现在还不回家呀，海蒂，好多年都不会回去。祖母走了以后，我还要你留下来陪我呢。
        - id: ch04-b16
          speaker: narrator
          text: 那天夜里，海蒂回到房间，临睡前又看了看自己的书。从那一天起，她最大的乐趣就是一遍又一遍地读那些配着美丽图画的故事。傍晚大家坐在一起时，只要祖母请她大声读给众人听，她就满心欢喜。
        - id: ch04-b17
          speaker: grandmother
          text: 现在，请海蒂读给我们听吧。
        - id: ch04-b18
          speaker: narrator
          text: 读书对海蒂来说已经一点也不费力。她把故事读出声来，那些景象便好像就在眼前，显得更加美丽，也更加清楚。祖母还会为她解释，再把故事里更多的事情讲给她听。
        - id: ch04-b19
          speaker: narrator
          text: 海蒂最喜欢的，仍是牧人站在碧绿牧场上的那一幅。他倚着手杖，羊群围在身边。这时，他已经回到家中，幸福地牧放父亲的绵羊和山羊。
        - id: ch04-b20
          speaker: narrator
          text: 下一幅里，牧人远离了父亲的家，被迫替人照看猪群。他只能拿豆荚充饥，整个人变得又苍白又瘦弱。连太阳都仿佛不再那么明亮，四周也笼罩在一片灰暗的雾气里。
        - id: ch04-b21
          speaker: narrator
          text: 故事还有第三幅画。年老的父亲张开双臂，奔向悔悟归来的儿子，要把他抱进怀里。儿子疲惫不堪，瘦骨嶙峋，身上只穿着破烂的外衣，正胆怯地朝父亲走去。
        - id: ch04-b22
          speaker: narrator
          text: 这是海蒂最喜爱的故事。她一遍遍地读，有时读出声，有时默默地读。祖母为她和克拉拉讲解，她怎么听也听不厌。不过，书里还有许多别的故事。日子就在读书和看图画中过得飞快，祖母回家的时候也越来越近了。
