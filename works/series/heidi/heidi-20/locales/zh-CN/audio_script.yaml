audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    grandfather:
      display_name: 外公
      tts: {delivery: "简短沉稳，粗粝中渐渐透出关怀", timbre: 低沉厚实, pace: 不紧不慢, pitch: 低音}
    grandmother:
      display_name: 祖母
      tts: {delivery: "慈爱虔诚，喜悦中带着年迈者的颤音", timbre: 温柔苍老, pace: 缓慢, pitch: 中音}
    clara:
      display_name: 克拉拉
      tts: {delivery: "温柔友善，带着久病女孩的安静和机敏", timbre: 轻柔清亮, pace: 从容自然, pitch: 中高音}
    grandmamma:
      display_name: 奶奶
      tts: {delivery: "慈爱爽朗，机敏风趣，说话亲切而有主见", timbre: "温暖明亮，带着年长女性的柔和质感", pace: "从容自然，劝慰时舒缓", pitch: 中音}
  chapters:
    - id: ch01
      title: 第二十章　远方朋友的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 五月来了。从每一处高地流下的春溪水量充足，又清又亮，一路奔进山谷。温暖澄澈的阳光落满山坡，群山重新绿了。最后一点残雪已经退尽，太阳早早唤醒花儿，让一颗颗鲜艳的小脑袋探出草丛。年轻的春风唱着歌穿过冷杉，摇下去年留下的暗色枯针，为即将装点枝头的嫩绿新针腾出地方。更高的蓝天上，那只大鸟还像从前一样盘旋。金色阳光照亮爷爷的小屋，四周的土地重新变得又暖又干。如今，人想在哪里坐下享受阳光都行。
        - id: ch01-b02
          speaker: narrator
          text: 海蒂回到山上，又像往常那样到处奔跑，每个地方都好得叫她舍不得离开。她停下来听风。风从山巅发出低沉又神秘的声音，一路靠近，一路变强，最后扑向冷杉，把树木吹得弯下去，又猛地摇起来。那声音像是在放声欢呼。海蒂被吹得像羽毛一样摇晃，也恨不得加入这片欢乐的歌声。
        - id: ch01-b03
          speaker: narrator
          text: 她又绕回屋前洒满阳光的空地，坐在地上，把脸凑近短草仔细看。她要数数有多少小花杯已经打开，又有多少正悄悄准备开放。无数小甲虫和长着翅膀的虫儿在阳光里跳跃、爬行、飞舞，她也跟它们一起快活。刚刚苏醒的泥土不断送来春天的气息，海蒂一口口深深吸进胸中，觉得山上从没这样美过。她相信所有细小的生命都跟自己一样高兴，因为四面八方仿佛都有细微的声音在唱，在嗡嗡地应和。
        - id: ch01-b04
          speaker: narrator
          text: 那些声音都像在说：“在山上！在山上！”
        - id: ch01-b05
          speaker: narrator
          text: 屋后的工棚传来锯木和劈木的声响。海蒂喜欢听，因为自从来到这里，这声音就一直陪着她。她突然起身，绕到工棚前，非得瞧瞧爷爷在忙什么。门边已经放着一把崭新的椅子，第二把也正在爷爷灵巧的手下成形。
        - id: ch01-b06
          speaker: heidi
          text: 啊，我知道这些椅子给谁坐！法兰克福的人来了，正好用得上。这把给奶奶，您手里这把给克拉拉。然后……然后大概还要再做一把。爷爷，您说罗滕迈尔小姐会不会根本不跟他们来？
          emotion: happy
        - id: ch01-b07
          speaker: grandfather
          text: 现在还不能确定。不过，多做一把总稳妥些。她要是真的来了，我们也有椅子请她坐。
        - id: ch01-b08
          speaker: narrator
          text: 海蒂盯着那把朴素的木椅。椅子连扶手也没有，她试着想象罗滕迈尔小姐坐在上面的样子。想了半天，她还是疑惑地摇摇头。
        - id: ch01-b09
          speaker: heidi
          text: 爷爷，我看她坐不了这样的椅子。
        - id: ch01-b10
          speaker: grandfather
          text: 那就请她去坐那张长榻吧，上面铺着漂亮的绿草羽绒褥呢。
        - id: ch01-b11
          speaker: narrator
          text: 海蒂正琢磨那究竟是什么，山坡上方传来口哨、吆喝和熟悉的响动。她一跑出去，四条腿的朋友们就把她围住了。羊儿们也为回到高山而兴奋，又跳又叫，争着往她身上挤，都想跟她亲热。彼得把它们朝两旁赶开。他有一样东西要交给海蒂。好不容易挤到跟前，他递出一封信。
        - id: ch01-b12
          speaker: peter
          text: 给你！
        - id: ch01-b13
          speaker: narrator
          text: 彼得只说了这么一句，剩下的全让海蒂自己弄明白。
        - id: ch01-b14
          speaker: heidi
          text: 是你放羊时，有人交给你的吗？
          emotion: surprised
        - id: ch01-b15
          speaker: peter
          text: 不是。
        - id: ch01-b16
          speaker: heidi
          text: 那你从哪里拿来的？
        - id: ch01-b17
          speaker: peter
          text: 在午饭袋里找到的。
        - id: ch01-b18
          speaker: narrator
          text: 这话不能说全错。昨晚，多尔夫里的邮差把信交给彼得，他随手塞进空饭袋。今早，他把面包和奶酪压在上面，去牵阿尔姆大叔的两只羊时，早把信忘了。中午吃完东西，他在袋里寻找最后一点面包屑，这才想起信还躺在底下。
        - id: ch01-b19
          speaker: narrator
          text: 海蒂仔细看清地址，立刻举着信，欢欢喜喜跑回工棚。
        - id: ch01-b20
          speaker: heidi
          text: 是法兰克福寄来的！克拉拉写的！爷爷，您想听吗？
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: 爷爷当然愿意，彼得也跟进来听。他把背牢牢靠在门柱上，觉得这样更容易听懂海蒂读的每句话。等两个人都站好，海蒂展开了信。
        - id: ch01-b22
          speaker: clara
          text: 最亲爱的海蒂，东西全收好了。再等两三天，爸爸把自己的事安排妥当，我们就出发。他不能同行，得先去巴黎。医生每天都来，一进门就催我们快走，越快上山越好。他比谁都着急。你想不到，他上次跟你们在一起有多快活！整个冬天，他几乎每天都来。每次走进我的房间，他都说，那些事非得再讲一遍不可。
        - id: ch01-b23
          speaker: clara
          text: 他坐下来，讲自己和你、和爷爷做过的事，讲高山、鲜花和远离城镇村庄的那片宁静，也讲那里清新得叫人陶醉的空气。他常说：“到了那里，谁都会好起来。”自从山上回来，他真的像变了一个人，看着年轻了，也重新快活起来。在那以前，他已经很久没有这样了。我真盼着亲眼看到那一切，跟你住在山上，还能认识彼得和羊群。
        - id: ch01-b24
          speaker: clara
          text: 医生吩咐我先在拉加茨疗养六个星期，然后我们会搬去多尔夫里。只要天气好，我每天都坐在椅子里，让人抬上山，跟你待上一整天。奶奶陪我走这一趟，也会一直留下。她一想到能去看你，同样高兴得很。不过你猜怎么着？罗滕迈尔小姐不肯来。
        - id: ch01-b25
          speaker: clara
          text: 奶奶几乎每天都问她：“我尊敬的罗滕迈尔，这趟瑞士之行究竟怎么办？请告诉我，你真的想跟我们去吗？”她每回都客客气气地道谢，再说自己已经打定主意。我猜，是塞巴斯蒂安把她吓住了。他把山说得可怕极了，说岩石悬在头上，人随时会掉进裂缝。山路又那么陡，每迈一步都可能一路滑到底，只有山羊爬上去才不怕送命。
        - id: ch01-b26
          speaker: clara
          text: 她听完浑身发抖，从那以后，再也不像原先那样向往瑞士。蒂内特也害怕起来，同样拒绝同行。所以，最后只有奶奶和我。塞巴斯蒂安会把我们送到拉加茨，再回法兰克福。我真是一天也等不下去了，只想快点见到你。再见，最亲爱的海蒂。奶奶送给你最亲切的问候，还有所有美好的祝愿。永远爱你的朋友，克拉拉。
        - id: ch01-b27
          speaker: narrator
          text: 信一读完，彼得就猛地离开门柱，冲到外面。他把木棍举在空中胡乱挥舞。羊儿们受了惊，朝山下逃去，跳得比平常又高又远。彼得举着棍子全速追赶，像是要把怒火全撒到一个看不见的仇敌身上。其实，他恨的正是法兰克福客人即将到来的消息。只要一想到他们，他就气恼不已。
        - id: ch01-b28
          speaker: narrator
          text: 海蒂却满怀期待。她决定第二天一有机会就下山，把谁要来、尤其是谁不来，全都告诉祖母。这些细节一定会让祖母感兴趣。海蒂讲过法兰克福的生活，祖母早已熟悉信里提到的每个人，也一直深深关心孩子在那里经历的种种事情。第二天下午，海蒂独自出发。太阳照着高空，白昼越来越长。她踩着干爽的山路向下飞奔，五月的风从背后推着她，让她跑得比两条腿自己能跑的还快。一路这样跑下山，实在痛快极了。
        - id: ch01-b29
          speaker: narrator
          text: 祖母已经起床，回到墙角的纺车前，脸上却满是忧虑。昨晚，彼得怒气冲冲地说，法兰克福有一大群人要来，还不知道以后会发生什么。老人一夜没睡。那个旧日的恐惧又来缠着她，她怕海蒂会被人带走。海蒂一进门就搬来小凳，坐在祖母身边，急急地把消息全说出来。她越讲越兴奋，却忽然看清了祖母的神情。
        - id: ch01-b30
          speaker: heidi
          text: 祖母，您怎么了？我说了这么多，您一点也不高兴吗？
        - id: ch01-b31
          speaker: grandmother
          text: 高兴，当然高兴，孩子。你这么快活，我自然也高兴。
        - id: ch01-b32
          speaker: narrator
          text: 祖母努力让自己看起来开朗一点，可海蒂还是放心不下。
        - id: ch01-b33
          speaker: heidi
          text: 我看得出来，您有心事。难道您担心罗滕迈尔小姐最后还是会来？
        - id: ch01-b34
          speaker: grandmother
          text: 不是，不是，孩子，什么事也没有。把手给我，让我摸着你，知道你就在这里。那件事对你也许才是最好的，可是我觉得，自己几乎承受不住。
        - id: ch01-b35
          speaker: heidi
          text: 如果您会承受不住，再好的事我也不要。
        - id: ch01-b36
          speaker: narrator
          text: 海蒂说得坚决，祖母反而更害怕了。她认定法兰克福的人要接走海蒂。孩子现在恢复了健康，那些人自然想把她重新留在身边。祖母又怕海蒂知道自己的忧愁，会因为舍不得她而拒绝离开。那样也不对。老人想找个依靠，而她只知道向一位寻求帮助。
        - id: ch01-b37
          speaker: grandmother
          text: 海蒂，有件事能安慰我，也能让这些念头平静下来。请给我念那首开头是“凡事终会成全”的赞美诗吧。
        - id: ch01-b38
          speaker: narrator
          text: 海蒂马上翻到那一页，用清亮的童声念了起来。
        - id: ch01-b39
          speaker: heidi
          text: 凡事终会成全，只要你信靠我。我展开医治的双翼，来拯救你，使你解脱。
        - id: ch01-b40
          speaker: grandmother
          text: 对，对，我正想听这些话。
          emotion: calm
        - id: ch01-b41
          speaker: narrator
          text: 祖母脸上深重的忧色消散了。海蒂想了一会儿，才开口问她。
        - id: ch01-b42
          speaker: heidi
          text: 祖母，“医治”就是把所有病痛都治好，让每个人恢复健康，是吗？
        - id: ch01-b43
          speaker: grandmother
          text: 对，就是这个意思。我们可以相信，一切都会按照上帝美好的旨意实现。再念一遍吧，让我们牢牢记住，以后别再忘了。
          emotion: calm
        - id: ch01-b44
          speaker: narrator
          text: 海蒂又念了两三遍。想到一切最终都会得到最妥善的安排，她自己也感到欢喜。傍晚，她沿山路回家。头顶的星星一颗接一颗亮起，每颗星仿佛都把一道新的快乐照进她心中。她走几步就停下来仰望。等整片天空缀满星光，她忍不住把刚刚明白的事说出了声。
        - id: ch01-b45
          speaker: heidi
          text: 是的，我现在懂了。我们为什么这样快乐，又为什么什么都不怕？因为上帝知道，什么对我们最好，什么对我们最美。
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: 星星睁着闪亮的眼睛，一路对她点头。回到家时，她看见爷爷也站在外面望着天空。那一晚的星星，确实比平常更加灿烂。
        - id: ch01-b47
          speaker: narrator
          text: 五月的夜晚清亮，白天也一样。太阳每天从万里无云的天空升起，光芒跟前一晚落山时同样耀眼。爷爷清早朝外一看，总会发出惊叹。
        - id: ch01-b48
          speaker: grandfather
          text: 今年的阳光真是少见。灌木和花草一定会飞快地长。将军，你可看好自己的军队，别让它们吃得太饱，连你也管不住了。
        - id: ch01-b49
          speaker: narrator
          text: 彼得胸有成竹地一挥木棍，脸上的神情分明是在回答：“这事交给我。”五月就这样过去，山野一天比一天绿。接着，六月带着更炽热的太阳和更漫长明亮的白昼来了。鲜花开遍整座山，无论走到哪里，眼前都有鲜亮的颜色。空气也被花朵染上了甜美的香气，仿佛整片山野都在盛放。
        - id: ch01-b50
          speaker: narrator
          text: 六月快结束的一天，海蒂做完家务，跑出屋子。她想先去看看冷杉，再爬到高处，瞧那丛岩蔷薇有没有盛开。花瓣在阳光下完全舒展时，那花美得很。谁知她刚转过屋角，便猛地大叫一声。爷爷听见，立刻从工棚跑出来。
        - id: ch01-b51
          speaker: heidi
          text: 爷爷，爷爷！快过来！您看呀，快看！
          emotion: surprised
        - id: ch01-b52
          speaker: narrator
          text: 老人赶到她身边，顺着她伸出的手望去。一支奇特的队伍正沿山路上来。两个男人走在最前面，抬着一顶轿椅。一个女孩坐在椅中，披肩把她裹得严严实实。后面跟着一匹马，马背上的夫人仪态高贵。她兴致勃勃地四处张望，还跟身旁的向导交谈。
        - id: ch01-b53
          speaker: narrator
          text: 再后面，有个男人推着一张空躺椅。大家显然觉得，在这样陡的山路上，病弱的主人坐轿椅更安全。队伍最后，一名脚夫背着一大捆斗篷、披肩和毛皮，那堆东西高得超过了他的头顶。
        - id: ch01-b54
          speaker: heidi
          text: 他们来了！真的来了！
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: 果然是法兰克福的客人。那些人影沿着山路越来越近，最后真的停在小屋跟前。走在前面的轿夫放下轿椅，海蒂立刻飞奔过去，两个孩子都欢喜极了，紧紧拥抱在一起。奶奶这时也到了山顶。她从马背上下来，先亲热地问候海蒂，又转身迎向已经走来招呼客人的爷爷。两个人过去虽然不曾见面，却早从别人口中熟悉了对方，因此相见时一点也不觉得拘束，反倒像一对多年未见的老朋友。
        - id: ch01-b56
          speaker: grandmamma
          text: 大叔，您的住处真是气派！我怎么也想不到，这里会美成这样。连国王看了都要羡慕您！再看看我的小海蒂，长得多好，活像一朵野蔷薇。我简直不知道该先看哪里，四周处处都美。克拉拉，你呢？你觉得这里怎么样？
          emotion: happy
        - id: ch01-b57
          speaker: narrator
          text: 奶奶把海蒂拉到身边，抚摸她红润的脸颊。克拉拉早已看得入迷。这样的美景，她以前连想都没有想过，更不用说亲眼见到。她高兴得一声声赞叹。
        - id: ch01-b58
          speaker: clara
          text: 啊，奶奶，我真想永远住在这里！
          emotion: happy
        - id: ch01-b59
          speaker: narrator
          text: 爷爷已经拉来克拉拉惯用的躺椅，还在上面铺好了毯子。他走到她面前，说赶路的轿椅太硬，还是换回躺椅更舒服。没等别人帮忙，他便用有力的双臂抱起克拉拉，轻轻放下，又仔细替她盖好，把双脚安放在柔软的垫子上。那动作熟练得像是他一生都在照顾行动不便的病人。奶奶看得十分惊讶。
        - id: ch01-b60
          speaker: grandmamma
          text: 亲爱的大叔，要是我知道您在哪里学的护理，我马上就把认识的护理人员全送过去，让他们也学学怎样照料病人。您怎么会懂这么多？
          emotion: surprised
        - id: ch01-b61
          speaker: grandfather
          text: 这些本事，大多是亲身经历教会我的，不是什么训练。
        - id: ch01-b62
          speaker: narrator
          text: 大叔说着，脸上的笑意渐渐退去，悲伤从眼中掠过。许多年前，他见过一张被痛苦折磨的脸。那个人全身瘫痪，躺在病床上，连一只手脚都动不了。在西西里那场惨烈的战斗中，那人曾是他的上尉。大叔发现上尉负伤倒地，便亲手把他背离战场。此后，上尉不肯让任何别人靠近，大叔只好一直留在身旁护理他，直到死亡终于结束了他的痛苦。如今，那张受苦的脸和当年的一切都回到眼前。难怪照顾生病的克拉拉，替她做这些体贴细致的小事，对大叔来说如此自然。他早在从前就做惯了。
        - id: ch01-b63
          speaker: narrator
          text: 蓝得没有一丝云的天空盖在小屋、冷杉和高高的岩峰上方，灰色山巅被阳光照得闪闪发亮。克拉拉望着周围，怎么也看不够。
        - id: ch01-b64
          speaker: clara
          text: 海蒂，如果我也能跟你到处走，该有多好！我真想去看那些冷杉，也想看看你讲过的每一样东西。我明明听得那么熟，可今天才第一次真的来到这里。
        - id: ch01-b65
          speaker: narrator
          text: 海蒂使出全身力气，只费了一点劲，就把躺椅推过屋角，一直来到冷杉旁。克拉拉从没见过这样的树。树干又高又直，粗长的枝条一层层伸展开来，越往下越茂密，最底下几乎碰到地面。奶奶也跟过来，望着这些古老的巨树，不知该赞叹哪里才好。是浓绿而高耸、直指蓝天的树冠，还是石柱一样的树干和那些笔直巨大的枝杈？它们处处都在诉说漫长的岁月。多少年来，它们从高处俯瞰山谷，看着人们来了又走，看着世上的一切不停改变，自己却始终安稳地站在那里，没有受到打扰，也从未改变。
        - id: ch01-b66
          speaker: narrator
          text: 海蒂又推克拉拉来到羊棚，把门完全拉开，让她看清里面。可是羊儿全都出门了，棚中眼下没有多少可看。克拉拉想到她们得在羊群回来前下山，十分遗憾。
        - id: ch01-b67
          speaker: clara
          text: 我多想见见彼得，还有他的整群羊啊。
        - id: ch01-b68
          speaker: grandmamma
          text: 亲爱的孩子，眼前看得到的美景已经这么多了，我们就好好欣赏，别再惦记暂时看不到的东西吧。
        - id: ch01-b69
          speaker: clara
          text: 啊，那些花！快看开着红花的灌木，还有一直点头的蓝铃花！要是我能站起来，亲手采一些就好了！
        - id: ch01-b70
          speaker: narrator
          text: 海蒂马上跑去采了一大束，放到克拉拉膝头。
        - id: ch01-b71
          speaker: heidi
          text: 克拉拉，这些还不算什么。要是你能再往上走，到羊儿吃草的地方，那才好看呢！红色矢车菊一丛接一丛，蓝铃花多得数不清。黄色的岩蔷薇像纯金一样闪亮，全都挤在一处。还有长着大叶子的花，爷爷叫它们“亮眼睛”。棕色的小花顶着圆脑袋，闻起来香极了。山上真的太美了！你只要坐进花丛，就再也不愿站起来，因为看见的、闻到的，全都那么好。
          emotion: happy
        - id: ch01-b72
          speaker: narrator
          text: 说起那些景象，海蒂双眼发亮，她自己也恨不得马上再看一遍。克拉拉听得同样向往，柔和的蓝眼睛里满是热切。
        - id: ch01-b73
          speaker: clara
          text: 奶奶，我能上去吗？有什么办法能让我也去？海蒂，要是我会走路，就可以跟你一起到处爬了！
        - id: ch01-b74
          speaker: heidi
          text: 我一定推得动你，这张椅子可轻了。
        - id: ch01-b75
          speaker: narrator
          text: 为了证明，海蒂推着椅子飞快绕过屋角，险些连人带椅冲下山坡。幸好奶奶就在旁边，及时伸手拦住。爷爷这时也没闲着。他把桌子和多出来的椅子搬到屋前长凳旁，大家可以坐在外面吃午饭。牛奶和奶酪很快备好，一行人兴高采烈地围桌坐下。
        - id: ch01-b76
          speaker: narrator
          text: 奶奶和医生一样，立刻爱上了这间露天饭厅。目光顺着山谷伸向远方，再越过层层山岭，一直能望到蓝天尽头。清风吹过桌边，清爽宜人，冷杉沙沙作响，像是在为这顿饭奏着节日的乐曲。
        - id: ch01-b77
          speaker: grandmamma
          text: 我从没吃过这样叫人快活的一顿饭。实在太妙了！
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: 奶奶一连赞叹了两三次。忽然，她看见克拉拉的盘子，惊讶得停下来。
        - id: ch01-b79
          speaker: grandmamma
          text: 克拉拉，我没看错吧？你真的在吃第二块烤奶酪？
          emotion: surprised
        - id: ch01-b80
          speaker: narrator
          text: 克拉拉盘中果然放着第二片金黄色的奶酪。
        - id: ch01-b81
          speaker: clara
          text: 奶奶，它真的太好吃了，比拉加茨所有的菜都好吃。
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: 她说着，继续很有胃口地吃起来。
        - id: ch01-b83
          speaker: grandfather
          text: 对，吃得下多少就吃多少！厨房里少了什么，山里的空气会替你补上。
        - id: ch01-b84
          speaker: narrator
          text: 午饭继续进行。奶奶和阿尔姆大叔越谈越投机。他们聊着人，聊着事情，也聊起整个世道，彼此的看法总是不谋而合。要是不知情的人在旁边听见，准会把他们当成相识多年的老友。大家说说笑笑，时间过得格外轻快。后来，奶奶转头望向西边，发现太阳已经落下去一大截。抬轿的人和马很快就会来，她们也该准备下山了。
        - id: ch01-b85
          speaker: clara
          text: 奶奶，再待一个小时吧，哪怕两个小时也好！我们还没看小屋里面，也没看海蒂的床，还有好多东西没有看。要是今天能有十个小时就好了！
        - id: ch01-b86
          speaker: grandmamma
          text: 那可办不到。
        - id: ch01-b87
          speaker: narrator
          text: 奶奶自己其实也很想进屋看看，于是众人都离开饭桌。爷爷把克拉拉的躺椅推到门边，大家却在那里停住了。椅子比门宽，根本推不进去。这点困难没有拦住爷爷。他马上用有力的双臂抱起克拉拉，把她稳稳带进屋里。奶奶把每一处布置都仔细看过。屋里收拾得有条有理，处处显得温暖舒适，她看了又觉得有趣，又十分喜欢。接着，她问起海蒂的卧房，毫不迟疑地爬上通往干草阁楼的梯子。
        - id: ch01-b88
          speaker: grandmamma
          text: 海蒂，上面就是你的卧房，对吗？啊，干草闻起来真香，这样的地方睡觉，一定对身体很好。
        - id: ch01-b89
          speaker: narrator
          text: 奶奶走到圆窗前向外望。爷爷抱着克拉拉上来，海蒂蹦跳着跟在后面。大家一同看着那张奇妙的干草床。奶奶一边端详，一边深深吸进带着干草香的空气。克拉拉喜欢得几乎说不出话。
        - id: ch01-b90
          speaker: clara
          text: 海蒂，你住在这里真好！躺在床上就能望进天空，身边到处都是这么好闻的香气。外面的冷杉还会摇动，会发出沙沙声。我从没见过这样舒服又快乐的卧房。
          emotion: happy
        - id: ch01-b91
          speaker: grandfather
          text: 我一直在想，如果您愿意，不妨让您的小孙女留在山上。她在这里一定会越来越强壮。您带了许多披肩和盖毯，我们能给她铺一张软床。平日照料孩子的事，您不用担心，我会照顾好她。
        - id: ch01-b92
          speaker: narrator
          text: 两个孩子听见这话，快活得像刚飞出笼子的小鸟。奶奶也满脸喜悦。
        - id: ch01-b93
          speaker: grandmamma
          text: 亲爱的大叔，您真是太好了！您正好说出了我的心思。我也在想，留在山上一阵，也许正是她最需要的。可这会给您添多少麻烦，带来多少不便！您说起护理和照顾她，却好像那根本不算什么。谢谢您，大叔，我真是从心底感谢您。
          emotion: happy
        - id: ch01-b94
          speaker: narrator
          text: 奶奶长久地握着大叔的手，感激地摇着。大叔也回握她，神情十分愉快。他马上开始准备，先把克拉拉抱回屋外躺椅。海蒂跟在身后，高兴得不知道该跳多高。接着，大叔收起一大堆披肩和毛皮，笑着打趣。
        - id: ch01-b95
          speaker: grandfather
          text: 幸好奶奶为一场冬季远征带足了装备，现在全能派上用场。
        - id: ch01-b96
          speaker: grandmamma
          text: 有远见是一种美德，能免去许多灾祸。我们翻过群山，没有碰上暴风、大风和倾盆大雨，当然应该感激，我们也确实很感激。不过，正如您说的，我为那些灾祸带来的东西，现在倒有了真正的用处。
        - id: ch01-b97
          speaker: narrator
          text: 两人边说边上了干草阁楼，立刻动手铺床。他们带来的东西实在太多，披肩、盖毯和毛皮一层压着一层，等床铺好，简直像一座小小的堡垒。奶奶伸出手，把床面一寸寸仔细摸过，生怕有哪根干草尖露在外面。她说，只要有一根能够钻出来，那根草就一定会钻出来。好在柔软的褥垫十分平整，又厚得很，无论什么也不可能从下面刺透。
        - id: ch01-b98
          speaker: narrator
          text: 两个人满意地下楼，发现孩子们正有说有笑。她们已经开始安排克拉拉留下以后，从早晨醒来到晚上入睡，整天要一起做些什么。接下来的问题，是克拉拉究竟能住多久。孩子们先去问奶奶，奶奶却把这个问题交给爷爷。爷爷想过以后说，克拉拉至少要在山里的空气中住上一个月，认真试一试，才能看出效果。孩子们一听，快活地拍起手来。她们原先怎么也没有想到，竟然可以朝夕相伴这么长的时间。
        - id: ch01-b99
          speaker: narrator
          text: 抬轿的人、马和向导已经出现。轿夫立刻被打发回去，奶奶准备上马下山。
        - id: ch01-b100
          speaker: clara
          text: 奶奶，这不算说再见。您会常常来看我们过得怎么样，我们也会一直盼着您来，对不对，海蒂？
        - id: ch01-b101
          speaker: narrator
          text: 海蒂觉得，这一天已经装满了数不清的快乐。她说不出别的话，只能再跳一下回答克拉拉。奶奶骑上强健的马，大叔牵住缰绳，要带她走下陡峭的山路。奶奶请他别送太远，他还是坚持送到多尔夫里，因为山路险峻，骑马下去也不能说毫无危险。
        - id: ch01-b102
          speaker: narrator
          text: 奶奶不愿独自住在多尔夫里，便决定返回拉加茨，以后再从那里不时上山看望孩子。大叔还没回来，彼得已经赶着羊群下山。羊儿一见海蒂，马上全朝她涌过来。不一会儿，海蒂和躺椅上的克拉拉便被围在中央。羊儿亲热地挤着她们，一颗颗脑袋争先恐后地往前探，挨在一起你推我碰。海蒂就在这一片热闹中逐一说出它们的名字，把每只羊都认真介绍给克拉拉。
        - id: ch01-b103
          speaker: narrator
          text: 克拉拉终于见到了盼望已久的小雪花、活泼的绿雀，还有爷爷家两只规规矩矩的羊。其他羊儿也都见到了，包括大土耳其。彼得一直远远站着，时不时朝克拉拉投去不太友善的目光。
        - id: ch01-b104
          speakers: [heidi, clara]
          ensemble: duo
          text: 晚上好，彼得！
        - id: ch01-b105
          speaker: narrator
          text: 彼得一句也没回答，只恼怒地举起木棍，像要把空气劈成两半，随后赶着羊群跑远了。
        - id: ch01-b106
          speaker: narrator
          text: 克拉拉在山上已经见过无数美好的东西，可一天结束时的景象，才是这一切的顶峰。夜里，她躺在干草阁楼那张又大又软的床上，海蒂就在身边。敞开的圆窗像是直接开在夜空之中。克拉拉从那里望出去，一眼便望进成团闪耀的群星中央。星光仿佛近在身边，这份从未有过的景象让她欢喜得叫了起来。
        - id: ch01-b107
          speaker: clara
          text: 海蒂，这就像我们坐在一辆高高的车里，一直要驶进天堂！
          emotion: happy
        - id: ch01-b108
          speaker: heidi
          text: 是啊。你知道星星为什么那么快乐，还一直看着我们，对我们点头吗？
        - id: ch01-b109
          speaker: clara
          text: 不知道。为什么呢？
        - id: ch01-b110
          speaker: heidi
          text: 因为星星住在天堂。它们知道，上帝会把我们的一切安排得很好。所以，我们不用害怕，也不必烦恼，可以相信所有事情最后都会变好。星星就是因为这个才那么快乐。它们向我们点头，是想叫我们也快乐起来。不过，我们不能忘了祷告。上帝安排一切时，我们要请祂记得我们。这样，我们心里就会安稳，不会再怕以后发生什么。
          emotion: calm
        - id: ch01-b111
          speaker: narrator
          text: 两个孩子在床上坐起来，一同做了祷告。随后，海蒂把头枕在自己圆圆的小胳膊上，转眼就睡着了。克拉拉却久久醒着。睡在高高的山上，仿佛就睡在群星中间，这份从未有过的新奇让她怎么也平静不下来。过去，她很少见到星星，因为夜里从来不走出家门。而在法兰克福的家中，窗帘总会早早拉上，等天上的星星出现，窗外已经被遮得严严实实。
        - id: ch01-b112
          speaker: narrator
          text: 每次闭上眼，克拉拉都忍不住重新睁开。她一定要确认，那两颗特别大的星星是不是还在从窗外望进来，是不是真的像海蒂说的那样，一直朝她点头。它们始终留在原处，从没有离开。克拉拉望着那两张明亮闪烁的脸，怎么也看不够。最后，她的双眼终于自己合上了。只有在梦中，那两颗巨大又友善的星星仍然守在那里，把温柔的光照向她。
