  chapters:
    - id: ch01
      title: News from Distant Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: May had come. Fresh spring streams poured down from every height into the valley, and warm, clear sunshine covered the mountain. The last snow was gone. Bright flowers had begun to lift their heads above the new grass. A playful spring wind sang through the fir trees and shook down their old, dark needles, making room for the fresh green ones that would soon dress the branches. High above, the great bird circled through the blue sky as it always had. Golden light shone over Grandfather's hut, and the ground around it was warm and dry enough for anyone to sit wherever they pleased.
        - id: ch01-b02
          speaker: narrator
          text: Heidi was home on the mountain again. She ran from place to place and could not decide which one she loved best. Sometimes she stopped to hear the wind's deep, mysterious voice coming down from the peaks. It drew closer and stronger until it struck the fir trees and bent their branches, shaking them as if it were shouting for joy. The wind tossed Heidi about like a feather, and she felt she had to join that joyful chorus. Then she raced back to the sunny ground before the hut. She sat in the short grass and looked closely for tiny flower cups that had opened, or were just about to open. Beetles and winged insects jumped, crawled, and danced in the sun. Heidi rejoiced with them and breathed in the spring scents rising from the newly awakened earth. The mountain had never seemed more beautiful. She imagined every tiny creature was as happy as she was, and that little voices all around were singing and humming, "On the mountain! On the mountain!"
        - id: ch01-b03
          speaker: narrator
          text: From the shed behind the hut came the sound of sawing and chopping. Heidi loved that familiar noise. She had heard it ever since her first days on the mountain. All at once she sprang up and ran around the hut to see what Grandfather was making. One new chair already stood finished outside the shed. Under his skillful hands, a second chair was taking shape.
        - id: ch01-b04
          speaker: heidi
          text: Oh, I know who those are for! We'll need them when everyone comes from Frankfurt. This one is for Grandmamma, and the one you're making is for Clara. And then... I suppose we'll need one more. Or do you think Fraulein Rottenmeier might not come with them?
          emotion: happy
        - id: ch01-b05
          speaker: grandfather
          text: I can't say yet. We'd better make another, so we can offer her a seat if she does come.
        - id: ch01-b06
          speaker: narrator
          text: Heidi studied the plain wooden chair with no arms. She tried to picture Fraulein Rottenmeier sitting on it. After a few thoughtful moments, she shook her head.
        - id: ch01-b07
          speaker: heidi
          text: Grandfather, I don't think she could sit on that chair.
        - id: ch01-b08
          speaker: grandfather
          text: Then we'll invite her to sit on the couch with its beautiful green turf feather bed.
        - id: ch01-b09
          speaker: narrator
          text: Heidi was still wondering what he meant when whistling and calling sounded from above. She knew those sounds at once. She ran out and was soon surrounded by her four-legged friends. The goats seemed just as glad as Heidi to be high on the mountain again. They leaped and bleated, crowding around her and pushing her from side to side, each one eager to show its affection. Peter drove them apart because he had something for Heidi. When he finally reached her, he held out a letter.
        - id: ch01-b10
          speaker: peter
          text: Here.
        - id: ch01-b11
          speaker: heidi
          text: Did somebody give this to you while you were out with the goats?
          emotion: surprised
        - id: ch01-b12
          speaker: peter
          text: No.
        - id: ch01-b13
          speaker: heidi
          text: Then where did you get it?
        - id: ch01-b14
          speaker: peter
          text: It was in my dinner bag.
        - id: ch01-b15
          speaker: narrator
          text: That was partly true. The postman in Dorfli had given Peter the letter the evening before, and Peter had dropped it into his empty bag. That morning, he stuffed his bread and cheese on top and forgot all about it when he came to fetch Grandfather's two goats. At midday, after eating every bit of bread and cheese, he searched the bag for any crumbs that might be left. Only then did he remember the letter lying at the bottom.
        - id: ch01-b16
          speaker: narrator
          text: Heidi carefully read the address. Then she dashed back to the shed, holding the letter out to Grandfather.
        - id: ch01-b17
          speaker: heidi
          text: It's from Frankfurt! It's from Clara! Would you like me to read it aloud?
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: Grandfather was ready and glad to listen. So was Peter, who had followed Heidi into the shed. He leaned his back against the doorpost. He thought the support would help him follow the reading, and there he stood, prepared to hear every word.
        - id: ch01-b19
          speaker: heidi
          text: Dearest Heidi, everything is packed. We'll leave in two or three days, as soon as Papa is ready to go. He isn't coming with us because he must travel to Paris first. The doctor visits every day. The moment he comes through the door, he calls, "Off you go, as quickly as you can! Off to the mountain!" He can hardly wait for us to leave. You would never guess how much he enjoyed his time with you. He has visited us almost every day this winter, and every time he comes into my room, he says he must tell me the whole story again. Then he sits down and describes everything he did with you and Grandfather. He talks about the mountains and flowers, the great silence so high above all the towns and villages, and the wonderful fresh air. He often says, "No one can help getting well up there." Since his visit, he has become a different man. He looks young and happy again, and he had not looked that way for a long time. Oh, I can't wait to see it all, to be with you on the mountain, and to meet Peter and the goats.
        - id: ch01-b20
          speaker: heidi
          text: First I must spend six weeks taking the cure at Ragatz. The doctor ordered that. Afterward, we'll move up to Dorfli. On every fine day, I'll be carried up the mountain in my chair and spend the day with you. Grandmamma is traveling with me and will stay with me. She is delighted to visit you too. But just imagine this. Fraulein Rottenmeier refuses to come. Almost every day Grandmamma asks her, "Well, my dear Rottenmeier, what about this journey to Switzerland? Please tell me if you truly wish to join us." Fraulein Rottenmeier always thanks her very politely and says her mind is made up.
        - id: ch01-b21
          speaker: heidi
          text: I think I know why. Sebastian described the mountain in the most terrifying way. He said the rocks hang over the path so dangerously that you could fall into a deep crack at any moment. He said the climb is so steep that every step makes you afraid you'll slip all the way to the bottom, and only goats can get up safely without being killed. Fraulein Rottenmeier shuddered when she heard him. Ever since then, she hasn't been nearly as excited about Switzerland. Tinette is frightened too, and she also refuses to come. So it will be only Grandmamma and me. Sebastian will travel with us as far as Ragatz, then return to Frankfurt.
        - id: ch01-b22
          speaker: heidi
          text: I can hardly stand waiting to see you again. Good-bye, dearest Heidi. Grandmamma sends all her love and best wishes. Your loving friend, Clara.
        - id: ch01-b23
          speaker: narrator
          text: As soon as the letter ended, Peter pushed himself away from the doorpost and rushed outside. He whirled his stick so wildly that the frightened goats bounded down the mountain in higher, wider leaps than usual. Peter raced after them with the stick still raised, as though he longed to strike some enemy no one else could see. That enemy was the thought of the visitors from Frankfurt. Their coming filled him with fury.
        - id: ch01-b24
          speaker: narrator
          text: Heidi was so full of happy expectation that she decided to visit Grandmother at the first chance the next day. She would tell her who was coming, and especially who was not. Grandmother knew everyone from Heidi's stories and had listened with deep interest to everything about her life in Frankfurt. Early the next afternoon, Heidi set off alone. The sun shone overhead, the days were growing longer, and the ground was dry. It was a joy to race down the mountain while the brisk May wind at her back sent her along even faster than her own legs could carry her.
        - id: ch01-b25
          speaker: narrator
          text: Grandmother was no longer in bed. She sat in her old corner at the spinning wheel, but her face was troubled and sad. Peter had come home the night before full of anger. He had told her about the large party coming from Frankfurt and said he did not know what else might happen afterward. The old fear that Heidi would be taken away had kept Grandmother awake all night. Heidi hurried in, pulled her little stool close, and poured out all her news. Her excitement grew with every word. Then she suddenly stopped.
        - id: ch01-b26
          speaker: heidi
          text: Grandmother, what's wrong? Aren't you even a little glad about what I'm telling you?
        - id: ch01-b27
          speaker: grandmother
          text: Yes, yes, child. Of course I am, if it makes you so happy.
        - id: ch01-b28
          speaker: narrator
          text: Grandmother tried to brighten her face, but Heidi could still see the worry there.
        - id: ch01-b29
          speaker: heidi
          text: Something is bothering you. Are you afraid Fraulein Rottenmeier might come after all?
        - id: ch01-b30
          speaker: grandmother
          text: No, no, child. It's nothing. Just give me your hand, so I can be sure you're here. No doubt it would be best for you, though I don't think I could live through it.
        - id: ch01-b31
          speaker: heidi
          text: Then I don't want what's best. Not if you couldn't live through it.
        - id: ch01-b32
          speaker: narrator
          text: Heidi spoke with such determination that Grandmother's fear grew worse. She felt certain the Frankfurt visitors meant to take Heidi back now that the child was well. Still, she wanted to hide her trouble. Heidi's heart was so tender that she might refuse to leave, and Grandmother believed that would not be right. She looked for help and quickly knew the only place to find it.
        - id: ch01-b33
          speaker: grandmother
          text: Heidi, one thing would comfort me and quiet my thoughts. Read me the hymn that begins, "All things will work for good."
        - id: ch01-b34
          speaker: narrator
          text: Heidi found the hymn at once. In her clear young voice, she read it aloud.
        - id: ch01-b35
          speaker: heidi
          text: All things will work for good to those who trust in Me. I come with healing on my wings, to save and set you free.
        - id: ch01-b36
          speaker: grandmother
          text: Yes, yes. That's exactly what I needed to hear.
          emotion: calm
        - id: ch01-b37
          speaker: narrator
          text: The deep worry faded from Grandmother's face. Heidi watched her thoughtfully for a moment.
        - id: ch01-b38
          speaker: heidi
          text: Healing means something that cures everything and makes everyone well, doesn't it, Grandmother?
        - id: ch01-b39
          speaker: grandmother
          text: Yes, that's what it means. And we can be sure everything will happen according to God's good purpose. Read the verse again, so we'll remember it well and never forget it.
        - id: ch01-b40
          speaker: narrator
          text: Heidi read the words two or three more times. She too found comfort in the promise that everything would be arranged for the best.
        - id: ch01-b41
          speaker: narrator
          text: Evening had come when Heidi started back up the mountain. One by one, the stars appeared overhead. They shone so brightly that each seemed to send a new ray of joy into her heart. She stopped again and again to look up. At last, stars covered the whole sky, and Heidi spoke aloud.
        - id: ch01-b42
          speaker: heidi
          text: Now I understand why we can be happy and not be afraid. God knows what is good and beautiful for us.
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: The stars kept nodding with their shining eyes until she reached home. Grandfather was standing there looking up too. The stars had seldom been more glorious than they were that night.
        - id: ch01-b44
          speaker: narrator
          text: The May days were as clear and bright as the nights. Every morning, the sun rose into a cloudless sky with the same splendor it had carried when it set the evening before. Grandfather would look outside in amazement.
        - id: ch01-b45
          speaker: grandfather
          text: This truly is a wonderful year for sunshine. The shrubs and plants will grow faster than ever. General, you'd better keep your army from getting out of hand with all that rich food.
        - id: ch01-b46
          speaker: narrator
          text: Peter would swing his stick with great confidence. His face seemed to answer, "Leave that to me."
        - id: ch01-b47
          speaker: narrator
          text: So May passed, with the whole mountain growing greener day by day. Then June arrived. The sun grew hotter, and the bright days stretched longer. Flowers opened all across the mountain until every patch of ground shone with color and their sweet scent filled the air. June itself was almost over when Heidi finished her morning chores and ran outside. First she meant to visit the fir trees. After that, she would climb higher and see whether the rockrose bush had bloomed, because its flowers were especially lovely when they stood open in the sun. She had just turned the corner of the hut when she saw something on the path and cried out so loudly that Grandfather came running from the shed to learn what had happened.
        - id: ch01-b48
          speaker: heidi
          text: Grandfather! Grandfather! Come here! Look, look!
          emotion: surprised
        - id: ch01-b49
          speaker: narrator
          text: Grandfather came to her side and looked where she pointed. A strange procession was slowly making its way up the mountain. Two men led the way, carrying a sedan chair with a girl bundled securely in shawls. Behind them came a horse. A stately lady rode it, looking around with great interest and talking to the guide who walked beside her. Another man pushed a reclining chair up the steep path. Clara had been carried in the sedan because that was thought safer for the climb. Last came a porter. The great heap of cloaks, shawls, and furs on his back rose far above his head.
        - id: ch01-b50
          speaker: heidi
          text: They're here! They're here!
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: Heidi jumped again and again for joy. It really was the party from Frankfurt. She watched the figures come closer at every turn of the path until at last they stood before the hut. The two men lowered the sedan chair to the ground. Heidi rushed forward, Clara reached for her, and the two children threw their arms around each other in delight. By then Grandmamma had reached the top as well. She climbed down from her horse and gave Heidi a warm, loving greeting. Grandfather came forward to welcome all his guests, and Grandmamma turned to greet him next. There was no stiffness or awkwardness between them. Each had heard so much about the other that from their first words, they felt like old friends.
        - id: ch01-b52
          speaker: grandmamma
          text: Uncle, what a magnificent home you have! I never imagined it could be this beautiful. A king might envy you. And look at my little Heidi. She's as fresh as a wild rose! I don't know where to look first. Everything is lovely. Clara, what do you think? Tell us!
          emotion: happy
        - id: ch01-b53
          speaker: narrator
          text: Grandmamma drew Heidi close and stroked her rosy cheeks. Clara stared around her in wonder. She had never imagined such beauty, much less seen it.
        - id: ch01-b54
          speaker: clara
          text: Oh, Grandmamma, I wish I could stay here forever!
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: Grandfather had pulled Clara's reclining chair close and spread some wraps over it. Now he stepped toward her.
        - id: ch01-b56
          speaker: grandfather
          text: Let's move the little daughter to the chair she knows. She'll be more comfortable there. That traveling seat is rather hard.
        - id: ch01-b57
          speaker: narrator
          text: Without waiting for help, he lifted Clara in his strong arms and gently placed her on her own couch. He tucked the covers around her and settled her feet on the soft cushion. Anyone watching might have thought he had spent his whole life caring for people who could not walk. Grandmamma watched in surprise.
        - id: ch01-b58
          speaker: grandmamma
          text: My dear Uncle, if I knew where you learned to care for someone like that, I'd send every nurse I know to the same place. They should all learn to handle their patients as gently as you do. Where did you learn so much?
          emotion: surprised
        - id: ch01-b59
          speaker: grandfather
          text: Experience taught me more than training ever did.
        - id: ch01-b60
          speaker: narrator
          text: Grandfather smiled, but the smile soon disappeared. Sadness crossed his face as he remembered a suffering man from long ago, lying helpless and unable to move. The man had been his captain during the fierce fighting in Sicily. Grandfather had found him wounded and carried him away. After that, the captain refused to let anyone else come near. Grandfather stayed and cared for him until the man's suffering ended in death. The memory returned clearly now. That was why caring for Clara felt natural, and why he knew how to give her the same gentle attention he had once given his captain.
        - id: ch01-b61
          speaker: narrator
          text: The cloudless blue sky stretched over the hut and fir trees, then far above the high rocks. Their gray peaks glittered in the sun. Clara looked from one beautiful sight to the next and could not take in enough of it. Everything she had known only through Heidi's stories now stood before her.
        - id: ch01-b62
          speaker: clara
          text: Oh, Heidi, if only I could walk around with you! I want to see the fir trees and all the places I know from your stories, even though I've never been here before.
        - id: ch01-b63
          speaker: narrator
          text: Heidi put all her strength into the chair. After one hard push, she found she could roll it quite easily around the hut to the fir trees. There they stopped. Clara had never seen trees like these. Their trunks rose tall and straight, and their long, heavy branches reached down until they nearly touched the ground. The lower they grew, the thicker they became. Grandmamma followed the children and stood amazed too. She could hardly choose what she admired most. Far overhead, the full green treetops rose toward the sky. Below them stood the enormous trunks, with straight branches like great pillars. The ancient firs seemed to speak of all the long years they had watched the valley. People had come and gone, and everything below had kept changing. The trees alone stood undisturbed, just as they had before.
        - id: ch01-b64
          speaker: narrator
          text: Next, Heidi pushed Clara to the goat shed and threw the door wide open so she could see everything inside. There was not much to see while the goats were away. Clara was sorry they would have to leave before the flock returned.
        - id: ch01-b65
          speaker: clara
          text: I wish I could see Peter and all his goats.
        - id: ch01-b66
          speaker: grandmamma
          text: My dear, let's enjoy all the beautiful things we can see instead of thinking about what we can't.
        - id: ch01-b67
          speaker: narrator
          text: Grandmamma followed as Heidi rolled the chair onward. Suddenly Clara caught sight of the flowers.
        - id: ch01-b68
          speaker: clara
          text: Oh, look at them! There are bushes covered in red flowers, and bluebells nodding everywhere. If only I could stand up and pick some!
          emotion: happy
        - id: ch01-b69
          speaker: narrator
          text: Heidi ran to gather a large bouquet and laid it in Clara's lap.
        - id: ch01-b70
          speaker: heidi
          text: These are hardly anything, Clara. If you could go higher, where the goats graze, then you'd really see flowers. There are whole bushes of red centaury, and so many more bluebells. The bright yellow rockroses gleam like pure gold, all crowded into one place. There are flowers with big leaves that Grandfather calls Bright Eyes, and little round brown ones that smell wonderful. It's so beautiful up there. When you sit among them, everything looks and smells so lovely that you never want to get up again.
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: Heidi's eyes shone as she remembered it. She longed to see the high meadow again herself. Her excitement passed to Clara, whose soft blue eyes filled with the same longing.
        - id: ch01-b72
          speaker: clara
          text: Grandmamma, could I get up there somehow? Could I really go? Oh, if only I could walk and climb everywhere with you, Heidi!
        - id: ch01-b73
          speaker: heidi
          text: I'm sure I can push you. Your chair rolls so easily!
        - id: ch01-b74
          speaker: narrator
          text: To prove it, Heidi sent the chair speeding around the corner. It nearly flew down the mountainside, but Grandmamma was close enough to stop it just in time.
        - id: ch01-b75
          speaker: narrator
          text: Meanwhile, Grandfather had not wasted a moment. He carried the table outside and set the extra chairs in front of the bench. There would be room for everyone to sit together and eat the dinner he was preparing indoors. Soon the fresh milk and toasted cheese were ready, and the cheerful company gathered around the table. Grandmamma was as delighted with their outdoor dining room as the doctor had been. From her seat, she could see far down the valley, then over range after range of mountains to the last stretch of blue sky. A light wind moved around the table and cooled them as they ate. Above it all, the fir trees rustled like music made especially for their feast.
        - id: ch01-b76
          speaker: grandmamma
          text: I have never enjoyed anything so much. This is truly magnificent!
          emotion: happy
        - id: ch01-b77
          speaker: narrator
          text: She said it again and again. Then she looked at Clara's plate and stared.
        - id: ch01-b78
          speaker: grandmamma
          text: Clara, am I really seeing you take a second piece of toasted cheese?
          emotion: surprised
        - id: ch01-b79
          speaker: narrator
          text: A second golden slice really did lie on Clara's plate.
        - id: ch01-b80
          speaker: clara
          text: Oh, it tastes wonderful, Grandmamma. It's better than any of the food we have at Ragatz.
          emotion: happy
        - id: ch01-b81
          speaker: grandfather
          text: Good. Eat all you can! The mountain air makes up for anything our kitchen lacks.
        - id: ch01-b82
          speaker: narrator
          text: The meal went on in high spirits. Grandmamma and Grandfather talked more and more freely as the minutes passed. Whatever they said about people, daily life, or the wider world, they found they thought alike. Anyone listening might have believed they had known each other for years. Laughter and conversation carried the time away so quickly that no one noticed how late it had grown. At last, Grandmamma looked toward the west and saw how low the sun had fallen.
        - id: ch01-b83
          speaker: grandmamma
          text: We must get ready to leave soon, Clara. The sun is already far down. The men will be here any minute with the horse and the sedan chair.
        - id: ch01-b84
          speaker: narrator
          text: Clara's face fell.
        - id: ch01-b85
          speaker: clara
          text: Oh, Grandmamma, can't we stay another hour? Or two? We haven't seen inside the hut, or Heidi's bed, or any of her other things. I wish this day were ten hours longer!
          emotion: sad
        - id: ch01-b86
          speaker: grandmamma
          text: Well, we can't make that happen.
        - id: ch01-b87
          speaker: narrator
          text: Still, Grandmamma wanted to see the hut too. They all rose from the table, and Grandfather pushed Clara's chair to the doorway. There they had to stop. The chair was much too wide to fit through. Grandfather solved the problem at once by lifting Clara in his arms and carrying her inside.
        - id: ch01-b88
          speaker: narrator
          text: Grandmamma walked all around the room and looked closely at every part of the little household. Everything had its place. Its neatness amused her, and its warm, cozy feeling pleased her even more. When she learned that Heidi slept above them, she went straight to the ladder. She climbed into the hayloft without the least hesitation.
        - id: ch01-b89
          speaker: grandmamma
          text: This is your bedroom up here, isn't it, Heidi? Oh, the hay smells sweet. What a healthy place to sleep!
        - id: ch01-b90
          speaker: narrator
          text: She crossed to the round window and looked outside. Grandfather climbed up after her with Clara in his arms, and Heidi came springing up behind them. Soon all four stood around Heidi's wonderful bed of hay. Grandmamma studied the place thoughtfully. Every few moments, she drew in another deep breath of the sweet, hay-scented air. Clara looked from the bed to the open window and then out toward the moving fir trees. The sleeping room delighted her so much that at first she could not find words for it.
        - id: ch01-b91
          speaker: clara
          text: Heidi, it's wonderful up here! You can lie in bed and look straight into the sky. The hay smells so good, and outside you can hear the fir trees waving and rustling. I've never seen such a bright, cheerful bedroom.
          emotion: happy
        - id: ch01-b92
          speaker: narrator
          text: Grandfather looked across at Grandmamma.
        - id: ch01-b93
          speaker: grandfather
          text: I've been thinking. If you agree, your granddaughter could stay up here. I'm sure the mountain would make her stronger. You brought plenty of shawls and blankets, so we can make a soft bed from them. And don't worry about her care. I'll look after her myself.
        - id: ch01-b94
          speaker: narrator
          text: Clara and Heidi were as joyful as two birds suddenly set free. Grandmamma's face shone with satisfaction.
        - id: ch01-b95
          speaker: grandmamma
          text: My dear Uncle, how kind you are! You've said exactly what I was thinking. I kept wondering whether staying here might be just what Clara needs. But I worried about all the trouble it would cause you. And now you offer to nurse her and care for her as though it were nothing. Thank you, Uncle. I mean it with all my heart.
          emotion: happy
        - id: ch01-b96
          speaker: narrator
          text: She took Grandfather's hand and shook it for a long time. He returned the handshake with a pleased look.
        - id: ch01-b97
          speaker: narrator
          text: Grandfather began making arrangements at once. He carried Clara outside to her chair, while Heidi followed, jumping as high as she could in her happiness. Then he gathered a great pile of shawls and furs.
        - id: ch01-b98
          speaker: grandfather
          text: It's a good thing Grandmamma packed for a winter campaign. We can put all these things to excellent use.
        - id: ch01-b99
          speaker: grandmamma
          text: It pays to be prepared. Being careful prevents many disasters. We crossed your mountains without storms, fierce winds, or sudden floods, and we're thankful for that. Now all the things I packed against those dangers will be useful after all.
        - id: ch01-b100
          speaker: narrator
          text: Grandfather and Grandmamma climbed into the hayloft and made a bed. They piled so many soft things one over another that the finished bed looked like a little fortress. Grandmamma carefully swept her hand across it, checking for any sharp pieces of hay.
        - id: ch01-b101
          speaker: grandmamma
          text: If even one piece of hay can poke through, it will.
        - id: ch01-b102
          speaker: narrator
          text: But the thick, soft mattress was perfectly smooth, and no piece of hay could work its way through. Grandfather and Grandmamma looked over their work once more, then went downstairs satisfied. Outside, they found Heidi and Clara laughing and talking without pause. The girls were arranging the days ahead, deciding what they would do from morning until evening for as long as Clara remained on the mountain. That brought them to the most important question of all. How long could she stay? They appealed to Grandmamma first. She would not decide and told them Grandfather should say what was best.
        - id: ch01-b103
          speaker: grandfather
          text: She should give the mountain air at least a month to do its work.
        - id: ch01-b104
          speaker: narrator
          text: The children clapped their hands. Neither had dreamed they might have a whole month together.
        - id: ch01-b105
          speaker: narrator
          text: Soon the bearers, horse, and guide appeared on the path. The bearers were sent back immediately, and Grandmamma prepared to mount the horse for her trip down.
        - id: ch01-b106
          speaker: clara
          text: This isn't good-bye, Grandmamma. You'll come up sometimes and see how we're doing. We'll be waiting for every visit, won't we, Heidi?
        - id: ch01-b107
          speaker: narrator
          text: The day had brought Heidi so many joys that she could answer Clara only by leaping into the air again.
        - id: ch01-b108
          speaker: narrator
          text: Once Grandmamma was seated on the sturdy horse, Grandfather took the bridle to lead her down the steep mountain path. She asked him not to come far, but he insisted on taking her safely to Dorfli. The path was sharp and dangerous for someone on horseback. Grandmamma did not want to stay alone in Dorfli, so she decided to return to Ragatz and make visits to the mountain from there.
        - id: ch01-b109
          speaker: narrator
          text: Before Grandfather returned, Peter came down from the high pasture with the goats. The moment the animals caught sight of Heidi, the whole flock rushed toward her. They crowded around both Heidi and Clara's couch, pushing and poking their heads over one another so each could come closest. Clara could finally see the lively creatures she had heard so much about. Heidi welcomed them all and introduced them to her friend one by one, carefully giving each goat its name.
        - id: ch01-b110
          speaker: narrator
          text: At last, Clara met the little Snowflake she had waited so long to see, the lively Greenfinch, Grandfather's well-behaved goats, and many more, including the Grand Turk. Peter stayed apart. He watched Clara with unfriendly looks.
        - id: ch01-b111
          speakers: [heidi, clara]
          ensemble: duo
          text: Good evening, Peter!
        - id: ch01-b112
          speaker: narrator
          text: Peter did not answer. He swung his stick angrily as if he wanted to cut the air in two. Then he ran away, and the goats hurried after him.
        - id: ch01-b113
          speaker: narrator
          text: Clara had already seen more beautiful things than she could have imagined, but the finest moment of her first day came after dark. She lay on the large, soft bed they had made in the hayloft, with Heidi close beside her. The round window stood open to the clear night. There was nothing between the children and the sky, and Clara could look straight into the middle of the bright clusters of stars.
        - id: ch01-b114
          speaker: clara
          text: Heidi, it feels as though we're riding in a carriage high in the sky, and we're about to drive straight into heaven.
          emotion: happy
        - id: ch01-b115
          speaker: heidi
          text: Yes. And do you know why the stars look so happy? Do you know why they look down and nod at us?
        - id: ch01-b116
          speaker: clara
          text: No. Why do they?
        - id: ch01-b117
          speaker: heidi
          text: They live in heaven, so they know how well God arranges everything for us. We don't need to be afraid or troubled. We can be sure everything will come right in the end. That's why the stars are happy. They nod because they want us to be happy too. But we must remember to pray and ask God to remember us while He arranges things. Then we can feel safe and stop worrying about what might happen.
          emotion: calm
        - id: ch01-b118
          speaker: narrator
          text: The two girls sat up together and said their prayers. Then Heidi lay down, rested her head on her small, round arm, and fell asleep at once. Clara stayed awake for a long time. This new experience of sleeping so high on the mountain, with the open sky beside her, was too wonderful to leave behind. At home, she almost never saw even one star. She never went outdoors after nightfall, and the curtains in the house were always drawn before the stars came out.
        - id: ch01-b119
          speaker: narrator
          text: Whenever Clara closed her eyes, she soon felt she had to open them again. She wanted to make sure the two largest stars were still looking through the round window and nodding to her, just as Heidi had said. Each time she looked, there they were in exactly the same place. Their bright, sparkling faces seemed so near and friendly that Clara could not bear to stop watching them. At last, her tired eyes closed on their own and did not open again. Even then, the stars did not leave her. In her dreams, she still saw those two great, friendly lights shining down from the sky.
