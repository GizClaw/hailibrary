  chapters:
    - id: ch01
      title: The Doctor's Decision
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a bright September morning, and the kind doctor who had ordered that Heidi be sent home was walking along a broad street toward Herr Sesemann's house. The day was so full of sunshine and sweetness that everyone ought to have felt glad. But the doctor kept his eyes on the ground. He never once looked up at the blue sky. His face, once so cheerful, was sad now, and since the spring his hair had grown grayer. After his wife died, his only daughter had been his constant companion. A few months earlier, she too had died, and the doctor had never been the same bright man since.
        - id: ch01-b02
          speaker: narrator
          text: Sebastian opened the door and greeted him with great respect. The doctor was Herr Sesemann's dearest friend, and Clara loved him too. His kindness had won the hearts of everyone in the house. As he started upstairs ahead of Sebastian, he asked about the household. Despite his sorrow, his voice was as pleasant as ever.
        - id: ch01-b03
          speaker: doctor
          text: Is everything going along as usual, Sebastian?
        - id: ch01-b04
          speaker: narrator
          text: The doctor came into Herr Sesemann's room, and his friend greeted him with relief.
        - id: ch01-b05
          speaker: herr_sesemann
          text: I'm very glad you're here, Doctor. We really must talk again about the trip to Switzerland. Do you still say Clara can't go, even though her health is clearly improving?
        - id: ch01-b06
          speaker: doctor
          text: My dear Sesemann, I have never known anyone like you. I wish your mother were here. She would see everything clearly and soon set it right. You sent for me three times yesterday to ask this very question, although you already know my answer.
        - id: ch01-b07
          speaker: narrator
          text: Herr Sesemann knew he was trying his friend's patience. He put one pleading hand on the doctor's shoulder.
        - id: ch01-b08
          speaker: herr_sesemann
          text: I know, dear friend. But try to understand. I can't bear to refuse Clara something I've promised her all this time. For months, she has thought about this journey day and night. She endured her last terrible attack so patiently because she hoped she would soon see Heidi again in Switzerland. Clara already has to give up so many pleasures. How can I tell the poor child that this long-awaited visit must be taken from her too? I simply don't have the courage.
        - id: ch01-b09
          speaker: doctor
          text: You must find the courage, Sesemann.
        - id: ch01-b10
          speaker: narrator
          text: His voice was firm. Herr Sesemann fell silent and looked miserable. After a pause, the doctor explained the situation once more.
        - id: ch01-b11
          speaker: doctor
          text: Think carefully about how things stand. Clara has not had such a bad summer in years. A journey this tiring could only harm her. It is out of the question. Besides, September is already here. The mountain might still be warm and pleasant, but it could just as easily be very cold. The days are getting shorter too. Clara couldn't spend the night up there, so she would have no more than two hours to visit. Even after reaching Ragatz, she would still face hours of travel because she would have to be carried up the mountain in a chair. No, Sesemann. It is impossible.
        - id: ch01-b12
          speaker: doctor
          text: But I will go with you to speak to Clara. She's a sensible child, and I'll explain my plan. Next May, she can go to the baths and stay for the cure until the weather is truly hot. Then she can be carried up the mountain from time to time. Once she's stronger, she'll enjoy those outings much more than she could now. If we want to give her any chance of recovering, we must watch over her with the greatest care.
        - id: ch01-b13
          speaker: narrator
          text: Herr Sesemann had listened sadly, accepting every word. Then he sprang to his feet.
        - id: ch01-b14
          speaker: herr_sesemann
          text: Doctor, tell me honestly. Do you truly have any hope that she will recover in the end?
        - id: ch01-b15
          speaker: narrator
          text: The doctor only shrugged.
        - id: ch01-b16
          speaker: doctor
          text: Very little.
        - id: ch01-b17
          speaker: doctor
          text: But think of my sorrow, my friend. You still have a beloved child waiting to greet you when you come home. You don't return to an empty house and sit down to eat alone. Clara is happy and comfortable here. She must give up many things, yes, but she has many blessings too. No, Sesemann, you are not the one most deserving of pity. You still have the joy of being together. Think of my lonely home.
        - id: ch01-b18
          speaker: narrator
          text: Herr Sesemann began pacing the room, as he always did when he was deep in thought. All at once he stopped beside the doctor and put a hand on his shoulder.
        - id: ch01-b19
          speaker: herr_sesemann
          text: Doctor, I have an idea. I can't stand seeing you this way. You're not the man you used to be, and you need something to draw you out of your sorrow for a while. So here is my proposal. You should make the journey and visit Heidi for us.
        - id: ch01-b20
          speaker: narrator
          text: The sudden suggestion startled the doctor. He tried to object, but Herr Sesemann was too delighted with his idea to let him speak. He took the doctor by the arm and led him straight into Clara's room.
    - id: ch02
      title: Clara's Request
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Clara was always glad to see the kind doctor, because he usually brought an amusing story with him. He had been more serious lately, but Clara knew why. She would have given a great deal to see him lively again. When he came to her, she held out her hand. The doctor sat beside her, and her father drew up another chair and took her hand in his.
        - id: ch02-b02
          speaker: narrator
          text: Herr Sesemann began by telling Clara how much he too had looked forward to their Swiss journey. Then, as quickly as he could, he told her the hardest part. She could not make the trip now. He dreaded seeing her cry, so he hurried on to his new plan. Perhaps the doctor could be persuaded to take a holiday and visit Heidi for them. Such a journey might do their friend a great deal of good.
        - id: ch02-b03
          speaker: narrator
          text: Tears filled Clara's blue eyes, though she fought to hold them back for her father's sake. Losing the trip was a bitter disappointment. During the lonely hours of her long illness, the thought of visiting Heidi had been her one comfort and joy. But Clara knew her father would never refuse her anything unless he was certain it would hurt her. She swallowed her tears as best she could and turned to the one hope that remained. She took the doctor's hand, gently stroked it, and pleaded with him.
        - id: ch02-b04
          speaker: clara
          text: Dear Doctor, you will go see Heidi, won't you? Then you can come home and tell me everything. Tell me what it's like up there and what Heidi, Grandfather, Peter, and the goats do all day. I know them all so well! You can take the things I want to send Heidi too. I've planned them all, including something for Grandmother. Please go, dear Doctor. If you do, I'll take as much cod-liver oil as you want me to.
        - id: ch02-b05
          speaker: narrator
          text: No one could say whether the promise of all that cod-liver oil settled the matter. But the doctor smiled.
        - id: ch02-b06
          speaker: doctor
          text: Then of course I must go, Clara. All that oil will make you as round and strong as your father and I want you to be. Have you decided when I should leave?
        - id: ch02-b07
          speaker: clara
          text: Tomorrow morning. Early, if you can.
        - id: ch02-b08
          speaker: herr_sesemann
          text: She's right. The sun is out, the sky is blue, and there isn't a day to waste. It would be a shame to miss even one day like this in the mountains.
        - id: ch02-b09
          speaker: narrator
          text: The doctor could not help laughing.
        - id: ch02-b10
          speaker: doctor
          text: Next you'll be scolding me because I'm not there already. Very well. I must go make my arrangements.
        - id: ch02-b11
          speaker: narrator
          text: Clara would not let him leave until she had given him message after message for Heidi. She also told him everything he must look at so he could describe it exactly when he returned. Her gifts would be sent to him later. Fraulein Rottenmeier first had to help pack them, and just then she was away on one of her trips into town, which always kept her busy for quite a while.
        - id: ch02-b12
          speaker: narrator
          text: The doctor promised to follow every one of Clara's directions. He would leave sometime the next day, even if he could not start first thing in the morning. When he came back, he would give her a faithful account of everything he had seen, heard, and experienced.
    - id: ch03
      title: News Travels Through the House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Servants have a curious way of discovering what is happening before anyone tells them. Sebastian and Tinette seemed especially gifted at it. The doctor was still going downstairs when Tinette, who had just been summoned, entered Clara's room.
        - id: ch03-b02
          speaker: clara
          text: Take that box and bring it back filled with those soft cakes we have with coffee.
        - id: ch03-b03
          speaker: narrator
          text: Clara pointed to a box that had been brought in long ago for this very purpose. Tinette picked it up and walked out, letting it dangle scornfully from her hand.
        - id: ch03-b04
          speaker: tinette
          text: It hardly seems worth all this trouble.
        - id: ch03-b05
          speaker: narrator
          text: Downstairs, Sebastian opened the front door for the doctor and bowed.
        - id: ch03-b06
          speaker: sebastian
          text: Would the Herr Doctor kindly give my greetings to the little miss?
        - id: ch03-b07
          speaker: doctor
          text: Ah, so you already know I'm going on a journey.
        - id: ch03-b08
          speaker: narrator
          text: Sebastian hesitated and gave an awkward little cough.
        - id: ch03-b09
          speaker: sebastian
          text: I... well, I hardly know myself. Oh, yes, now I remember. I happened to pass through the dining room and heard the little miss's name. Then I put the pieces together, and so I thought...
        - id: ch03-b10
          speaker: doctor
          text: I understand. A person can discover a great many things by thinking. Goodbye for now, Sebastian. I'll be sure to deliver your message.
        - id: ch03-b11
          speaker: narrator
          text: The doctor was about to hurry away when an unexpected obstacle appeared. A fierce wind had cut Fraulein Rottenmeier's walk short, and she reached the front door just as he came out. Her white shawl billowed so widely that she looked like a ship under full sail.
        - id: ch03-b12
          speaker: narrator
          text: The doctor stepped back. Fraulein Rottenmeier had always shown him particular respect, so she stepped back too, with exaggerated politeness. For several seconds, each tried to make way for the other. Then a sudden gust sent Fraulein Rottenmeier sailing almost into the doctor's arms. She had to stop and collect herself before she could shake his hand with proper dignity.
        - id: ch03-b13
          speaker: narrator
          text: She was annoyed that the wind had forced her to enter the house in such an undignified fashion. But the doctor had a gift for calming people when their pride had been ruffled. Soon she was listening with her usual composure as he told her about his journey.
        - id: ch03-b14
          speaker: doctor
          text: May I ask you to pack the parcels for Heidi? No one knows how to arrange them as well as you do.
        - id: ch03-b15
          speaker: narrator
          text: He made the request in his most agreeable voice, and then he said goodbye.
    - id: ch04
      title: Gifts for the Mountain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Clara expected a long struggle before Fraulein Rottenmeier would agree to send all the gifts she had gathered for Heidi. This time, however, Clara was wrong. Fraulein Rottenmeier was in an unusually good mood. She cleared the large table so every gift could be spread across it and packed while Clara watched.
        - id: ch04-b02
          speaker: narrator
          text: It was not a small task. The presents came in every shape and size. First there was a little warm cloak with a hood. Clara had designed it herself so Heidi could visit Grandmother during the winter whenever she wished. She would no longer have to wait until Grandfather could carry her there wrapped in a sack to keep her from freezing.
        - id: ch04-b03
          speaker: narrator
          text: Next came a thick, warm shawl for Grandmother. She could wrap it closely around herself when terrible gusts of wind swept around the cottage. Then there was the large box of cakes. Those were for Grandmother too, so she could have something besides bread with her coffee.
        - id: ch04-b04
          speaker: narrator
          text: After that came an enormous sausage. Clara had first meant it for Peter, who never had anything but bread and cheese. Then she worried that he might be so delighted that he would eat the whole sausage at once and make himself sick. Instead, she decided to send it to Brigitta. Brigitta could take some for herself and Grandmother, then give Peter his share a little at a time.
        - id: ch04-b05
          speaker: narrator
          text: A packet of tobacco was for Grandfather, who enjoyed his pipe when he rested in the evening. Last came a great many mysterious little bags, parcels, and boxes. Clara had taken special pleasure in collecting them. Each one would be a joyful surprise for Heidi when she opened it.
        - id: ch04-b06
          speaker: narrator
          text: At last the work was done. An impressive package rested on the floor, ready for its journey. Fraulein Rottenmeier gazed at it with satisfaction, absorbed in the fine art of packing. Clara looked at it with pleasure too. She imagined Heidi crying out and jumping for joy as the huge parcel was opened at the hut.
        - id: ch04-b07
          speaker: narrator
          text: Then Sebastian came in, lifted the package onto his shoulder, and carried it away to be sent straight to the doctor's house.
