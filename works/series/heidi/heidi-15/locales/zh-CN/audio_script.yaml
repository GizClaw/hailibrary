audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    clara:
      display_name: 克拉拉
      tts: {delivery: "温柔友善，带着久病女孩的安静和机敏", timbre: 轻柔清亮, pace: 从容自然, pitch: 中高音}
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts: {delivery: "严肃讲究，恼怒时仍竭力维持威严", timbre: 清晰而略显尖锐, pace: "适中，训诫时稍快", pitch: 中高音}
    sebastian:
      display_name: 塞巴斯蒂安
      tts: {delivery: "爽朗机敏，守礼之中藏着诙谐", timbre: 明快厚实, pace: 适中, pitch: 中音}
    sesemann:
      display_name: 赛赛曼先生
      tts: {delivery: "爽直果断，诙谐中带着一家之主的威严", timbre: 明朗沉稳, pace: 从容有力, pitch: 中低音}
    doctor:
      display_name: 医生
      tts: {delivery: "亲切睿智，轻松时幽默，诊断时坚定", timbre: 温暖清亮, pace: 平稳自然, pitch: 中音}
    tinette:
      display_name: 蒂内特
      tts: {delivery: "冷淡傲慢，说话简短而疏远", timbre: 清脆偏冷, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 医生的忧伤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月一个晴朗的早晨，阳光明亮，空气清甜，四周都沐浴在明媚的晨光里，仿佛每个人都该觉得欢喜。那位曾吩咐送海蒂回家的好心医生，正沿着宽阔的街道，走向塞泽曼先生的家。他却一直低头看路，一眼也没望过头顶那片蓝天。从前那张快活的脸，如今满是哀伤。才过了一个春天，他的头发又白了许多。
        - id: ch01-b02
          speaker: narrator
          text: 医生的妻子去世以后，独生女儿便成了他唯一的伴侣，日日陪在他身边。可是就在几个月前，死神又带走了这个亲爱的孩子。从那以后，医生再没有恢复过去的开朗。塞巴斯蒂安恭恭敬敬地把他迎进门。全家人都敬爱医生。他不只是主人和小姐最亲近的朋友，也一直真心善待宅子里的每一个人，因此赢得了所有人的心。
        - id: ch01-b03
          speaker: doctor
          text: 塞巴斯蒂安，家里还是老样子吗？
        - id: ch01-b04
          speaker: narrator
          text: 医生温和地问着，走在塞巴斯蒂安前面上了楼。塞泽曼先生也一直等着他，一见朋友进门，马上迎了上来。
        - id: ch01-b05
          speaker: sesemann
          text: 医生，你来得正好！我们真得再谈一次瑞士之行。克拉拉的身体明明好多了，你还是不肯让她去吗？
        - id: ch01-b06
          speaker: doctor
          text: 亲爱的塞泽曼，我真没见过你这样的人。要是令堂在这里就好了。她一来，什么事都能理清，也会马上把一切安排妥当。昨天你派人请了我三次，每次都问同一件事，可你明明知道我的意见。
        - id: ch01-b07
          speaker: sesemann
          text: 我知道，这样纠缠，谁都会不耐烦。可你也得体谅我。这件事我答应孩子很久了，她几个月来日夜盼着去瑞士。上回病得那么重，她还能耐心忍着，就是因为想到很快能再见海蒂。她已经失去了那么多乐趣。现在连盼了这么久的探望也要取消，我怎么忍心告诉她？我真的说不出口。
          emotion: sad
    - id: ch02
      title: 无法成行的旅程
      blocks:
        - id: ch02-b01
          speaker: doctor
          text: 塞泽曼，你必须下定决心。克拉拉今年夏天病得这么厉害，是好几年都没有过的。长途旅行只会让她的身体更糟，她绝不能去。现在又是九月，山上也许还温暖晴朗，也许已经冷得很。白天越来越短，她又不能在那里过夜，最多只能停留两个钟头。从拉加茨到山上还要走好几个钟头，路上得一直让人用椅子抬着她。无论怎样，这趟旅行都办不到。
        - id: ch02-b02
          speaker: doctor
          text: 我陪你去和克拉拉谈。她是个懂事的孩子，会听明白我的安排。明年五月先送她去温泉，让她在那里安心疗养，一直住到天气真正热起来。到时可以偶尔抬她上山走走。等身体更强壮了，这些出游也会比现在让她玩得更尽兴。我们若还想给她一个康复的机会，就必须处处小心，时时照看。
        - id: ch02-b03
          speaker: narrator
          text: 塞泽曼先生忧心忡忡地听完，忽然站了起来。
        - id: ch02-b04
          speaker: sesemann
          text: 医生，请你告诉我实话。你真的还相信她最后能恢复健康吗？
          emotion: fearful
        - id: ch02-b05
          speaker: doctor
          text: 希望很小。可是，朋友，也请你想想我的苦处。你回家时，还有心爱的孩子等着你，迎接你。你不会走进空屋，一个人坐下吃饭。克拉拉在家也过得舒适快活。她固然失去了不少乐趣，也拥有许多福分。你们至少还能在一起，所以你并没有那么可怜。再想想我那座空荡荡的房子吧。
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 塞泽曼先生一想事情，就爱在屋里来回大步走。他走了一阵，忽然停在医生身边，把手搭在朋友肩上。
        - id: ch02-b07
          speaker: sesemann
          text: 医生，我有办法了。我不忍心再看你这样。你已经完全不像过去的你。你得离开这份悲伤一阵子，到别处换换心境。这趟旅行由你去吧，请你替我们探望海蒂。
        - id: ch02-b08
          speaker: narrator
          text: 医生没想到他会这样提议，刚要推辞，就被兴奋的朋友拉住手臂，带进了克拉拉的房间。克拉拉总是欢迎医生来，因为他常给她讲有趣的事。近来医生严肃多了，克拉拉知道他为什么悲伤。只要能让他恢复过去活泼的样子，她什么都愿意做。她朝医生伸出手。医生在她身边坐下，父亲也拉过椅子，握着女儿的手说起那趟大家都盼望的瑞士之行，还告诉她，自己原来也一直盼着出发。
        - id: ch02-b09
          speaker: narrator
          text: 塞泽曼先生害怕克拉拉哭，只匆匆说出她不能成行，便赶紧讲起新计划。他一再告诉女儿，这次休假能给医生带来多大的好处。克拉拉的蓝眼睛里果然含满了泪水。要放弃这趟旅行，对她实在是沉重的打击。漫长的病中，那些孤单的时光里，去山上看海蒂一直是她唯一的盼望和安慰。可她知道，父亲向来疼爱她。除非确信一件事会伤害她，否则绝不会拒绝她。于是她竭力把泪水咽回去，拉过医生的手轻轻抚摸，把仅存的希望全放到了他身上。
        - id: ch02-b10
          speaker: clara
          text: 亲爱的医生，您会替我去看海蒂，对不对？回来以后，请把山上的一切都讲给我听。海蒂、爷爷、彼得，还有山羊们，每天都做些什么，您都要看清楚。我觉得自己已经很熟悉他们了！您还可以带上我给海蒂的礼物，我连给祖母的东西也想好了。求您去吧。只要您肯去，您让我喝多少鱼肝油，我都喝。
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: 谁也不知道，是不是最后那句保证打动了医生。不过，他的确笑了。
        - id: ch02-b12
          speaker: doctor
          text: 那我一定得去了。这样你就能长得像你父亲一样结实丰满，这正是我想看到的。你也替我想好什么时候动身了吗？
        - id: ch02-b13
          speaker: clara
          text: 明天一早就走，能多早就多早。
        - id: ch02-b14
          speaker: sesemann
          text: 她说得没错。现在阳光灿烂，天空又蓝，不能再耽搁了。山上这样的好日子，错过一天都可惜。
        - id: ch02-b15
          speaker: doctor
          text: 再催下去，你们就要怪我怎么还没到山上了。好吧，我这就回去准备。
          emotion: happy
    - id: ch03
      title: 宅子里的消息
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 克拉拉却不肯马上放医生走。她有数不清的话要捎给海蒂，还把医生该留心看的事情一一交代清楚，好让他回来后仔细说给她听。礼物要晚些送去，因为还得让罗滕迈尔小姐帮她打包。那位小姐此刻正在城里办事，她每回出门，总会忙上好一阵子。医生答应全照克拉拉的话去做。即使不能一早启程，也会在第二天动身。回来以后，凡是一路经历、看见和听见的事，他都会如实讲给她听。
        - id: ch03-b02
          speaker: narrator
          text: 一户人家的仆人们有一种奇妙的本领。一件事还没有人正式告诉他们，他们往往已经从零星的话里猜到了。塞巴斯蒂安和蒂内特尤其精通这个本领。医生还在下楼，克拉拉一摇铃，蒂内特便走进了房间。
        - id: ch03-b03
          speaker: clara
          text: 把那只盒子拿去，装满我们喝咖啡时吃的松软小蛋糕，再给我带回来。
        - id: ch03-b04
          speaker: narrator
          text: 克拉拉指着早已为此准备好的盒子。蒂内特提起来，让它轻蔑地在手里晃着，转身走了。
        - id: ch03-b05
          speaker: tinette
          text: 就这么点东西，我看根本不值得费这个事。
        - id: ch03-b06
          speaker: narrator
          text: 楼下，塞巴斯蒂安正鞠着躬替医生开门。
        - id: ch03-b07
          speaker: sebastian
          text: 医生先生，能不能劳驾您替我向小小姐问好？
        - id: ch03-b08
          speaker: doctor
          text: 原来你已经知道我要出门旅行了。
        - id: ch03-b09
          speaker: narrator
          text: 塞巴斯蒂安一下子结巴起来，还尴尬地咳了一声。
        - id: ch03-b10
          speaker: sebastian
          text: 我……我只是……其实我自己也不大清楚。对了，我想起来了。我碰巧从餐厅经过，听到了小小姐的名字。后来把前后的话凑在一起，就猜……
        - id: ch03-b11
          speaker: doctor
          text: 明白了。只要肯动脑筋，还真能想明白不少事。回头见，塞巴斯蒂安。我一定替你把问候带到。
    - id: ch04
      title: 门口的一阵大风
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 医生正要匆匆离开，门口忽然冒出一道阻碍。外面的风太猛烈，罗滕迈尔小姐没法继续散步，只好回来。她走到门前时，医生也正往外走。她肩上的白披巾被风吹得高高鼓起，看上去就像一艘张满帆的船。
        - id: ch04-b02
          speaker: narrator
          text: 医生退后一步，请她先进。罗滕迈尔小姐一向格外敬重医生，也过分客气地往后退，请他先走。两个人面对面站了好几秒，都急着给对方让路。偏偏这时，一阵狂风扑过来。罗滕迈尔小姐带着全身鼓起的“船帆”，险些直接撞进医生怀里。
        - id: ch04-b03
          speaker: narrator
          text: 她只得先稳住身体，整理好自己，恢复平日的端庄，才能规规矩矩地同医生握手。这样毫无体面地被风吹进门，实在让她恼火。好在医生最会平息别人受伤的自尊。没过多久，罗滕迈尔小姐就镇定下来，像平常一样安静听他说话。医生告诉她自己要出门旅行，又用最和气的口吻，请她替海蒂收拾礼物，因为打包的事只有她最拿手。交代完以后，他便告辞了。
    - id: ch05
      title: 给海蒂的大包裹
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 克拉拉本以为，要让罗滕迈尔小姐答应把自己搜集的礼物全送给海蒂，少不了一场长久的争执。这回她猜错了。罗滕迈尔小姐的心情比平时还好。她清空大桌子，把礼物一件件摊开，在克拉拉眼前打包。那些东西大小不同，形状各异，要把它们全装妥帖，一点也不轻松。
        - id: ch05-b02
          speaker: narrator
          text: 第一件，是克拉拉亲自设计的暖和小斗篷，上面还带着风帽。到了冬天，海蒂想去看祖母，随时都能穿着它下山，再也不用等爷爷把她裹进麻袋里防寒，然后亲自带她去。第二件，是给祖母的厚披肩。可怕的狂风一阵阵扫过小屋时，老人可以把它严严实实裹在身上，不会再觉得冷。
        - id: ch05-b03
          speaker: narrator
          text: 接着是装满松软小蛋糕的大盒子，也是给祖母的。以后老人喝咖啡时，就不必只有面包可以配着吃了。然后是一根大得惊人的香肠。它本来要送给彼得，因为那个孩子平时只有面包和奶酪可吃。后来克拉拉又担心，他一高兴就把香肠全吃光，反而吃坏肚子。于是她决定把香肠交给布丽吉塔，让她和祖母也吃一些，再每天分一点给彼得。
        - id: ch05-b04
          speaker: narrator
          text: 还有一包烟草，是送给爷爷的。他每天晚上歇息时，喜欢坐在那里抽烟斗。最后，桌上还摆着许多神秘的小袋子、小包裹和小盒子。克拉拉收集这些东西时格外高兴，因为海蒂每打开一个，都会得到一份叫她快活的惊喜。
        - id: ch05-b05
          speaker: narrator
          text: 漫长的打包终于结束。一个气派十足的大包裹躺在地板上，随时可以运走。罗滕迈尔小姐满意地望着自己的成果，心里还在琢磨打包这门手艺。克拉拉也快活地看着它，想象大包裹送到山上小屋时，海蒂会发出怎样的惊叫，又会怎样又惊又喜地跳起来。
        - id: ch05-b06
          speaker: narrator
          text: 这时，塞巴斯蒂安走进房间。他弯腰把大包裹扛到肩上，带了出去。包裹要立刻送到医生家，等着和医生一起出发。
