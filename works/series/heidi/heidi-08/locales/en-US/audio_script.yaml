  chapters:
    - id: ch01
      title: There Is Great Commotion in the Large House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, Sebastian had just shown the tutor into the study when the front bell rang with a tremendous clang. He hurried to answer it, certain that only Herr Sesemann would ring that way. Perhaps the master of the house had come home without warning. But when Sebastian opened the door, he found a ragged little boy with a hand organ strapped to his back.
        - id: ch01-b02
          speaker: sebastian
          text: What do you mean, ringing the bell like that? I'll teach you better manners. What do you want?
          emotion: angry
        - id: ch01-b03
          speaker: organ_boy
          text: I need to see Clara.
        - id: ch01-b04
          speaker: sebastian
          text: You rude little rascal! You should call her Miss Clara. Now tell me what you want with her.
          emotion: angry
        - id: ch01-b05
          speaker: organ_boy
          text: She owes me fourpence.
        - id: ch01-b06
          speaker: sebastian
          text: You must be out of your mind. How would you even know a young lady named Clara lives here?
        - id: ch01-b07
          speaker: organ_boy
          text: She owes me twopence for showing her the way there, and two more for showing her the way back.
        - id: ch01-b08
          speaker: sebastian
          text: What a pack of lies! The young lady never goes out. She can't even walk. Be off with you before I send you away myself.
        - id: ch01-b09
          speaker: narrator
          text: The boy would not be frightened away. He stayed exactly where he was and answered firmly.
        - id: ch01-b10
          speaker: organ_boy
          text: I did see her in the street. I can tell you what she looks like. Her black hair is short and curly, her eyes are black, and she wears a brown dress. She doesn't talk quite the way we do.
        - id: ch01-b11
          speaker: narrator
          text: Sebastian understood at once. The little newcomer had clearly been getting into more mischief. Laughing to himself, he brought the boy inside.
        - id: ch01-b12
          speaker: sebastian
          text: Ah, now I understand. Come with me and wait outside the study until I tell you to enter. The instant you go in, start playing your organ. The lady loves music.
        - id: ch01-b13
          speaker: narrator
          text: Sebastian knocked at the study door. Someone called for him to come in, and he announced that a boy outside insisted on speaking to Miss Clara herself. Such a strange and unexpected message delighted Clara.
        - id: ch01-b14
          speaker: clara
          text: Send him in right away! We have to let him come in, don't we? He seems so determined to see me.
        - id: ch01-b15
          speaker: narrator
          text: The boy was already through the door. Following Sebastian's instructions, he began cranking his organ at once. Fraulein Rottenmeier had gone to the dining room with her sewing so she could escape the alphabet lesson. Now she stopped to listen. Was that music coming from the street? It sounded much too close. Surely no organ could be playing inside the study. Yet that was exactly where it was.
        - id: ch01-b16
          speaker: narrator
          text: She rushed across the long dining room and flung open the door. There stood the ragged boy in the middle of the study, turning the organ with all his strength. The tutor tried to speak, but no one could hear him. Clara and Heidi listened with delight.
        - id: ch01-b17
          speaker: rottenmeier
          text: Stop that! Stop this instant!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: The music swallowed her voice. She charged toward the boy, then saw a dreadful dark shape crawling across the floor toward her feet. It was the tortoise. Fraulein Rottenmeier leaped higher than she had in years and shrieked with all her might.
        - id: ch01-b19
          speaker: rottenmeier
          text: Sebastian! Sebastian!
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: Her scream rose above the organ, and the boy finally stopped playing. Sebastian had been peeping through the door, doubled over with laughter. By the time he came in, Fraulein Rottenmeier had collapsed into a chair.
        - id: ch01-b21
          speaker: rottenmeier
          text: Take them out! The boy and the animal. Get both of them away at once!
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: Sebastian pulled the boy from the room while the boy scooped up his tortoise. Once they were outside, Sebastian put some coins into his hand.
        - id: ch01-b23
          speaker: sebastian
          text: Here's the fourpence Miss Clara owed you, and fourpence more for the music. You did everything just right.
        - id: ch01-b24
          speaker: narrator
          text: Then he shut the front door behind the boy. The study grew quiet at last, and the interrupted lessons began again. Fraulein Rottenmeier did not return to her sewing in the dining room. She took up a position inside the study and kept watch over everyone herself. As long as she was present, she meant to prevent any more of the dreadful goings-on that had already disturbed the morning.
        - id: ch01-b25
          speaker: narrator
          text: Before long, another knock came. Sebastian entered and said that someone had delivered a large basket with strict orders to give it to Miss Clara at once.
        - id: ch01-b26
          speaker: clara
          text: For me? Bring it in right away. I want to see what it is!
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: Sebastian carried in a large covered basket, set it down, and left.
        - id: ch01-b28
          speaker: rottenmeier
          text: The lesson should be finished before anyone opens that basket.
        - id: ch01-b29
          speaker: narrator
          text: Clara could not imagine what might be inside. Again and again, she glanced longingly toward it. Halfway through one of her declensions, she stopped.
        - id: ch01-b30
          speaker: clara
          text: Couldn't I take just one little peek before we go on?
        - id: ch01-b31
          speaker: tutor
          text: There are reasons for allowing it, and reasons against it. I might allow it because, if all your attention is fixed on the basket—
        - id: ch01-b32
          speaker: narrator
          text: He never finished. The cover was loose. One kitten tumbled out, then a second and a third. Two more followed, and then still more. In moments, kittens raced in every direction so quickly that they seemed to fill the room. They jumped over the tutor's boots and nipped at his trousers. They climbed Fraulein Rottenmeier's dress, rolled around her feet, and sprang onto Clara's couch, scratching, scrambling, and mewing everywhere.
        - id: ch01-b33
          speaker: clara
          text: Oh, the dear little things! They're so pretty! Look at this one, Heidi. And look at that one over there!
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: Heidi ran after them in delight, first to one corner and then another. The tutor stood beside the table, helplessly lifting one foot and then the other away from the scratching kittens. Fraulein Rottenmeier was too horrified to speak. She did not dare rise from her chair, afraid all the dreadful little creatures would leap on her together. At last she found her voice.
        - id: ch01-b35
          speaker: rottenmeier
          text: Tinette! Tinette! Sebastian! Sebastian!
          emotion: fearful
        - id: ch01-b36
          speaker: narrator
          text: Tinette and Sebastian both came running at her call. Catching the kittens was not quick work. The servants gathered them one by one while the little creatures still scrambled in every direction. At last, every kitten was back inside the basket. The servants carried them away and put them with the two kittens that were already in the house. Once again, so much had happened during lessons that the tutor had found no chance to yawn.
        - id: ch01-b37
          speaker: narrator
          text: Late that evening, after Fraulein Rottenmeier had partly recovered, she summoned Sebastian and Tinette and questioned them closely. At last she learned that Heidi's trip the day before had caused everything. She sat pale with anger, unable at first to find words. Then she dismissed the servants and turned to Heidi, who stood beside Clara's couch with no idea what wrong she had done.
        - id: ch01-b38
          speaker: rottenmeier
          text: Adelaide, only one punishment may make you understand how badly you've behaved. You are a little barbarian, but perhaps we can tame you. Then you won't do such things again. I shall put you in a dark cellar with the rats and black beetles.
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: Heidi listened in silent surprise. She had never seen the kind of cellar Fraulein Rottenmeier described. Her grandfather's cellar was a pleasant place where fresh cheeses and new milk were kept. She did not know what rats or black beetles were, either.
        - id: ch01-b40
          speaker: clara
          text: No, no, Fraulein Rottenmeier! You must wait until Papa comes home. He wrote that he'll be here soon. I'll tell him everything, and he can decide what should happen to Heidi.
          emotion: fearful
        - id: ch01-b41
          speaker: narrator
          text: Fraulein Rottenmeier could not oppose that higher authority, especially when Clara's father was expected so soon. She rose, plainly displeased.
        - id: ch01-b42
          speaker: rottenmeier
          text: Very well, Clara. But I will have something to tell Herr Sesemann too.
        - id: ch01-b43
          speaker: narrator
          text: With that, she left the room.
        - id: ch01-b44
          speaker: narrator
          text: Two days passed without another disturbance, but Fraulein Rottenmeier still could not regain her peace of mind. Every time she saw Heidi, she remembered the deception she believed had been played on her. It seemed that from the moment the child entered the house, everything had been turned upside down. No matter how hard the lady tried, she could not restore proper order. Clara, on the other hand, had become much more cheerful. The lesson hours no longer felt long or dull to her. Heidi was always creating some unexpected diversion, even when she did not mean to.
        - id: ch01-b45
          speaker: narrator
          text: Heidi mixed up all her letters and seemed unable to learn them. The tutor tried to help by comparing their shapes to familiar things. He would say one looked like a little horn, or another like a bird's beak. Those descriptions filled Heidi's mind with pictures, but they did not teach her the alphabet.
        - id: ch01-b46
          speaker: heidi
          text: That's a goat! And that one's a bird of prey!
          emotion: happy
        - id: ch01-b47
          speaker: narrator
          text: Late each afternoon, Heidi sat with Clara and told her long stories about the mountain and her life there. But the more she talked, the stronger her longing grew. She always ended the same way.
        - id: ch01-b48
          speaker: heidi
          text: I have to go home now. Tomorrow I really must go!
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: Clara always tried to soothe her. She reminded Heidi that her father would soon return. Heidi only had to wait for him, and then they would ask what could be done. Each time, Heidi gave in and seemed to recover her spirits quite quickly. There was a secret happiness beneath her homesickness. Every day in Frankfurt added two more white rolls to the collection she was saving for grandmother. At dinner, Heidi slipped the roll beside her plate into her pocket, and at supper she did the same again. She could not bear to eat one herself. Grandmother had no white bread at home, and the dark bread was so hard that she could barely eat it.
        - id: ch01-b50
          speaker: narrator
          text: After dinner each day, Heidi had to spend two hours alone in her room. By now, she understood that she was not allowed to run freely through Frankfurt as she had run around the mountain, so she did not attempt another trip outside. Talking with Sebastian in the dining room had also been forbidden. As for Tinette, Heidi kept out of her way and never thought of starting a conversation. The child knew very well that the maid looked down on her and spoke to her in a mocking voice.
        - id: ch01-b51
          speaker: narrator
          text: That left Heidi with many quiet hours to picture home. Day after day, she imagined everything on the mountain turning green. She saw the yellow flowers shining in the sunlight. In her thoughts, the warm brightness spread across the snow and the rocks and filled the whole wide valley. Sometimes the longing to be there grew so strong that she could hardly contain it. And Dete had told her that she could go home whenever she liked. At last, one day, Heidi felt she could not bear to remain in Frankfurt any longer. She gathered every roll she had saved, tied them all inside her red shawl, put her old straw hat on her head, and went downstairs to leave.
        - id: ch01-b52
          speaker: narrator
          text: Just as she reached the front door, Fraulein Rottenmeier returned from a walk and stopped her. For a moment, the lady stared at Heidi from head to toe, her eyes fixed especially on the red bundle.
        - id: ch01-b53
          speaker: rottenmeier
          text: Why are you dressed that way? What do you think you're doing? I strictly forbade you to run through the streets, and here you are, ready to go out again looking like a beggar!
          emotion: angry
        - id: ch01-b54
          speaker: heidi
          text: I wasn't going to run around. I was going home.
          emotion: fearful
        - id: ch01-b55
          speaker: rottenmeier
          text: What did you say? You want to go home? You mean to run away! What would Herr Sesemann say if he knew? Make sure he never hears of this. And what is wrong with his house? Haven't you been treated better than you deserve? Have you lacked anything? Have you ever had a house like this, or food like this, or so many people waiting on you? Have you?
          emotion: angry
        - id: ch01-b56
          speaker: heidi
          text: No.
        - id: ch01-b57
          speaker: rottenmeier
          text: Of course you haven't! You have everything anyone could want, and still you're ungrateful. You're so comfortable here that all you do is think of the next naughty thing!
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: Heidi could hold her feelings in no longer. All her trouble poured out at once.
        - id: ch01-b59
          speaker: heidi
          text: I only want to go home! If I stay away this long, Snowflake will start crying again. Grandmother is waiting for me. Greenfinch will be beaten because I'm not there to give Peter any cheese. I never get to see the sun say good night to the mountains. And if the great bird flew over Frankfurt, he'd croak louder than ever about people crowding together and teaching each other bad things instead of going to live on the rocks, where everything is better!
          emotion: sad
        - id: ch01-b60
          speaker: rottenmeier
          text: Heaven help us! The child has lost her mind!
          emotion: fearful
        - id: ch01-b61
          speaker: narrator
          text: Fraulein Rottenmeier turned in alarm and rushed up the steps. In her hurry, she collided hard with Sebastian.
        - id: ch01-b62
          speaker: rottenmeier
          text: Bring that poor little creature inside at once!
        - id: ch01-b63
          speaker: narrator
          text: She pressed a hand to the spot where she had struck her head. Sebastian obeyed while rubbing his own head, which had taken an even harder blow. Heidi had not moved. Her eyes blazed, and her whole body trembled with the feelings inside her.
        - id: ch01-b64
          speaker: sebastian
          text: In trouble again? There, don't take it so hard. Keep your courage up. That's what matters. She nearly knocked a hole in my head, but you mustn't let her bully you.
        - id: ch01-b65
          speaker: narrator
          text: Heidi still did not move.
        - id: ch01-b66
          speaker: sebastian
          text: We have to go now. She ordered me to bring you in.
        - id: ch01-b67
          speaker: narrator
          text: Heidi began climbing the stairs, but she crept along slowly, nothing like her usual self. The sight made Sebastian sad. He followed her, doing his best to encourage her.
        - id: ch01-b68
          speaker: sebastian
          text: Don't give in, and don't let her make you miserable. Keep your courage! You're such a sensible little miss. You haven't cried once since you came, and plenty of children your age cry a dozen times a day. The kittens are having great fun in their new home. They leap everywhere and act half wild. When Fraulein Rottenmeier is out of the way, we'll go up and see them. How about that?
        - id: ch01-b69
          speaker: narrator
          text: Heidi gave a tiny nod, but there was no joy in it. Sebastian's heart went out to her as he watched her creep away to her room.
        - id: ch01-b70
          speaker: narrator
          text: That evening at supper, Fraulein Rottenmeier said nothing. She watched Heidi as if she expected another strange outburst at any moment. Heidi sat perfectly still and ate nothing. She only moved once, quickly hiding her roll in her pocket.
        - id: ch01-b71
          speaker: narrator
          text: When the tutor arrived the next morning, Fraulein Rottenmeier took him aside before allowing him to begin the lesson. In confidence, she told him what she feared. Perhaps the change of air, the new way of life, and all the unfamiliar surroundings in Frankfurt had affected Heidi's mind. She described how the child had dressed for a journey the day before, tried to go home alone, and then poured out that strange speech about the goats, grandmother, the setting sun, and the great bird.
        - id: ch01-b72
          speaker: tutor
          text: There's no need for alarm. I have noticed that the child is a little unusual, but her mind is sound. With careful guidance and teaching, I'm sure she will become more balanced. That is what I'm working toward.
        - id: ch01-b73
          speaker: narrator
          text: The new account only made the tutor more certain of his judgment. He had already noticed Heidi's unusual ways, and he had so far failed completely to teach her the alphabet. No matter how he explained the letters, the child seemed unable to understand them. To him, that was further proof that careful education was what she needed. Fraulein Rottenmeier felt greatly relieved by his assurance. Her worst fear had been set aside, so she released the tutor and allowed him to return to his work.
        - id: ch01-b74
          speaker: narrator
          text: During the afternoon, the image of Heidi dressed for her journey suddenly returned to Fraulein Rottenmeier. Herr Sesemann would soon be home, and the child must look respectable when he arrived. The lady decided to improve Heidi's clothes with several things from Clara's wardrobe. She explained her plan to Clara, who was perfectly willing to give Heidi as many dresses and hats as she needed. Fraulein Rottenmeier then went upstairs to examine everything the child owned. She meant to decide which things could be kept, which must be thrown away, and what should be replaced. Only a few minutes passed before she hurried back. Her face now wore an expression of utter horror.
        - id: ch01-b75
          speaker: rottenmeier
          text: Adelaide, what did I find in your wardrobe? I have never heard of anyone doing such a thing! That cupboard is for clothes, and there was a whole heap of rolls at the bottom. Clara, can you believe it? Bread in a wardrobe! Tinette, go upstairs and remove every one of those rolls. Take that old straw hat from the table too.
          emotion: disgusted
        - id: ch01-b76
          speaker: heidi
          text: No! Don't! I have to keep my hat, and the rolls are for grandmother!
          emotion: fearful
        - id: ch01-b77
          speaker: narrator
          text: Heidi rushed to stop Tinette, but Fraulein Rottenmeier caught hold of her.
        - id: ch01-b78
          speaker: rottenmeier
          text: You will stay here. That bread and all that rubbish will be taken where they belong.
          emotion: angry
        - id: ch01-b79
          speaker: narrator
          text: In despair, Heidi threw herself onto Clara's couch and began to weep wildly. Her crying grew louder and more anguished with every moment. Between sobs, she kept saying the same thing.
        - id: ch01-b80
          speaker: heidi
          text: Grandmother's bread is gone! Every roll was for grandmother. Now they've taken them away, and she won't get even one!
          emotion: sad
        - id: ch01-b81
          speaker: narrator
          text: She cried as though her heart would break. Fraulein Rottenmeier fled the room. Clara was frightened and distressed by Heidi's sobbing.
        - id: ch01-b82
          speaker: clara
          text: Heidi, please don't cry like this. Listen to me. You don't have to be so unhappy. I promise you'll have just as many rolls when you go home, or even more, and they'll all be fresh. These would have turned hard and stale by then. Please, Heidi, don't cry anymore.
          emotion: sad
        - id: ch01-b83
          speaker: narrator
          text: For a long time, Heidi could not stop sobbing. Without Clara's promise, she might not have stopped at all. The promise comforted her, but she needed to be certain she could trust it. Again and again, as her sobs slowly eased, she asked Clara the same question.
        - id: ch01-b84
          speaker: heidi
          text: Will you really give me as many as I had? All of them, for grandmother?
          emotion: sad
        - id: ch01-b85
          speaker: clara
          text: Yes, just as many. More, if you want. Only please be happy again.
          emotion: calm
        - id: ch01-b86
          speaker: narrator
          text: Heidi came to supper that evening with her eyes still red from crying. The moment she saw the white roll beside her plate, she could not hold back another sob. Still, she fought to control herself because she knew she must sit quietly at the table. Sebastian kept trying to catch her eye. Whenever he succeeded, he made the strangest signs. He pointed first to his own head and then toward hers, adding little encouraging nods. His silent message seemed to be that she should not be unhappy, because he had something safely in his care.
        - id: ch01-b87
          speaker: narrator
          text: That night, as Heidi got ready for bed, she found her old straw hat hidden under the bedcover. She snatched it up in delight and crushed it even further in her joy. Then she wrapped it in a handkerchief and pushed it deep into the farthest corner of the wardrobe.
        - id: ch01-b88
          speaker: narrator
          text: Sebastian was the one who had hidden the hat. He had been in the dining room when Fraulein Rottenmeier called Tinette, and he heard everything that happened afterward. He heard the order to clear Heidi's cupboard, and he heard the child's desperate crying over grandmother's bread and her old hat. Sebastian followed Tinette upstairs. When she came back out of Heidi's room carrying the rolls and the hat, he took the hat from her hands. He said he would see to the old thing himself. It genuinely pleased him to save it for Heidi and return it where she could find it. That was the secret behind every encouraging sign he had made to her across the supper table.
