audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    clara:
      display_name: 克拉拉
      tts:
        delivery: 温柔友善，带着久病女孩的安静和机敏
        timbre: 轻柔清亮
        pace: 从容自然
        pitch: 中高音
    rottenmeier:
      display_name: 罗滕迈尔小姐
      tts:
        delivery: 严肃讲究，恼怒时仍竭力维持威严
        timbre: 清晰而略显尖锐
        pace: 适中，训诫时稍快
        pitch: 中高音
    tutor:
      display_name: 家庭教师
      tts:
        delivery: 谨慎克制，说理时平稳周全
        timbre: 温和端正
        pace: 不紧不慢
        pitch: 中音
    sebastian:
      display_name: 塞巴斯蒂安
      tts:
        delivery: 爽朗机敏，守礼之中藏着诙谐
        timbre: 明快厚实
        pace: 适中
        pitch: 中音
    organ_boy:
      display_name: 手摇风琴男孩
      tts:
        delivery: 寡言实际，回答干脆利落
        timbre: 稍显粗哑的少年声
        pace: 简短偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 不速之客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，塞巴斯蒂安刚把家庭教师领进书房，大门铃又猛烈地响了起来。铃声又响又急，他赶紧朝楼下跑去。一路上他还在心里嘀咕，只有塞泽曼先生才会这样按铃，莫非先生突然回家了？他来到门边，猛地把门拉开。可是，门外根本没有塞泽曼先生，只有一个衣衫褴褛的小男孩，背上还背着一架手摇风琴。
        - id: ch01-b02
          speaker: sebastian
          text: 你这是干什么？敢把门铃按成这样，看我怎么教训你！你到这里来做什么？
          emotion: angry
        - id: ch01-b03
          speaker: organ_boy
          text: 我要见克拉拉。
        - id: ch01-b04
          speaker: sebastian
          text: 你这个又脏又没规矩的小无赖，连“克拉拉小姐”都不会叫吗？你找她到底有什么事？
          emotion: angry
        - id: ch01-b05
          speaker: organ_boy
          text: 她欠我四个便士。
        - id: ch01-b06
          speaker: sebastian
          text: 你一定是疯了！你怎么知道这里住着一位叫克拉拉的小姐？
        - id: ch01-b07
          speaker: organ_boy
          text: 我给她带过路。去的时候两个便士，回来又是两个便士。
        - id: ch01-b08
          speaker: sebastian
          text: 编谎话也该编得像一点！小姐从不出门，她连路都走不了。快回你来的地方去，不然我就亲自赶你走。
        - id: ch01-b09
          speaker: narrator
          text: 男孩一点也没被吓住，还是稳稳地站在门口。
        - id: ch01-b10
          speaker: organ_boy
          text: 可我真的在街上见过她。我还能说出她的样子。她的黑头发又短又卷，眼睛也是黑的，穿着棕色裙子，说话的口音和我们不一样。
        - id: ch01-b11
          speaker: narrator
          text: 塞巴斯蒂安这才明白，男孩遇见的准是海蒂。他忍着笑，把男孩拉进了门。
        - id: ch01-b12
          speaker: sebastian
          text: 原来是这么回事。你跟我来，在书房门外等着。我叫你进去，你就进去。记住，一进屋马上摇风琴，那位小姐最喜欢音乐。
        - id: ch01-b13
          speaker: narrator
          text: 塞巴斯蒂安敲开书房，告诉大家，门外有个男孩，非要亲自和克拉拉小姐说话不可。克拉拉一听，立刻来了精神。
        - id: ch01-b14
          speaker: clara
          text: 那就快让他进来呀。他这样急着找我，当然该让他进来，对不对，老师？
        - id: ch01-b15
          speaker: narrator
          text: 其实男孩已经进了屋。他牢记塞巴斯蒂安的吩咐，一上来就摇响手摇风琴。为了躲开字母课，罗滕迈尔小姐拿着针线活去了餐厅。她忽然停下手，仔细听起来。这乐声是从街上传来的吗？可街上的声音哪会这样近？难道书房里真有人在摇风琴？这又怎么可能呢？可她再听，分明就是。她急忙冲过长长的餐厅，跑到另一头，一把扯开书房门。眼前的景象叫她简直不敢相信。
        - id: ch01-b16
          speaker: narrator
          text: 那个破衣烂衫的男孩站在屋子中央，拼命转着风琴把手。家庭教师想开口，声音却完全被音乐盖住了。海蒂和克拉拉倒听得兴高采烈。
        - id: ch01-b17
          speaker: rottenmeier
          text: 停下！立刻给我停下！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 她的尖叫还是压不过风琴声。她正要冲过去，忽然发现一个黑黢黢的可怕东西在地上爬，眼看就要碰到自己的脚。那是一只乌龟。罗滕迈尔小姐纵身跳得老高，怕是许多年都没跳过这么高了。
        - id: ch01-b19
          speaker: rottenmeier
          text: 塞巴斯蒂安！塞巴斯蒂安！
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: 这回她的声音终于盖过音乐，男孩马上停了手。塞巴斯蒂安一直在门外偷看，早已笑弯了腰。等他进屋，罗滕迈尔小姐已经瘫倒在椅子上。
        - id: ch01-b21
          speaker: rottenmeier
          text: 把他们全都弄出去！男孩，还有那只动物，马上带走！
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 男孩赶紧捡起乌龟，塞巴斯蒂安把他拉到门外，又往他手里放了钱。
        - id: ch01-b23
          speaker: sebastian
          text: 这是克拉拉小姐欠你的四个便士。再给你四个，算是演奏的钱。你照我的话做得一点不错！
        - id: ch01-b24
          speaker: narrator
          text: 塞巴斯蒂安说完，便当着男孩的面关上大门。书房总算重新安静了，刚才被打断的功课也从头开始。罗滕迈尔小姐再也不肯回餐厅。这一回，她亲自坐在书房里守着大家，认定只要自己在场，就能防住任何可怕的乱子，不让它再次发生。
    - id: ch02
      title: 满屋的小猫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，门上又响起敲门声。塞巴斯蒂安进来禀报，说有人送来一只大篮子，还特意吩咐立刻交给克拉拉小姐。
        - id: ch02-b02
          speaker: clara
          text: 是给我的吗？快拿进来，让我看看那篮子是什么样的！
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: 塞巴斯蒂安搬进一只盖得严严实实的大篮子，转身出去了。
        - id: ch02-b04
          speaker: rottenmeier
          text: 我看还是先把课上完，再打开篮子。
        - id: ch02-b05
          speaker: narrator
          text: 克拉拉猜不出里面是什么，忍不住一次次朝篮子张望。变格念到一半，她终于停了下来。
        - id: ch02-b06
          speaker: clara
          text: 老师，我能不能先看一眼里面是什么？我只看一眼，然后马上接着念。
        - id: ch02-b07
          speaker: tutor
          text: 从一个方面说，我赞成。从另一个方面说，我又反对。我赞成，是因为你的心思如果全放在篮子上……
        - id: ch02-b08
          speaker: narrator
          text: 家庭教师没能把话说完。篮盖原来没有扣紧。一只、两只、三只小猫滚到地上，接着又出来两只，后面还有更多。转眼间，小猫们朝四面八方飞奔，快得难以形容，仿佛已经塞满了整个房间。它们跳过老师的靴子，咬住他的裤腿，顺着罗滕迈尔小姐的裙子往上爬，又在她脚边滚作一团。还有几只蹿上克拉拉的长椅，一边抓挠，一边攀爬，喵喵叫个不停。地上、椅上、人的脚边，到处都是小猫，书房一下乱得没法收拾。
        - id: ch02-b09
          speaker: clara
          text: 哦，它们太可爱了！真漂亮！海蒂，快看这只，再看那边那一只！
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 海蒂欢喜得从这个角落追到那个角落。家庭教师站在桌旁，不知道怎样才好，只能抬起右脚，又换成左脚，躲着那些又抓又爬的小猫。罗滕迈尔小姐吓得说不出话，也不敢离开椅子，生怕这些可怕的小东西一起跳到她身上。过了好一会儿，她才重新找回声音。
        - id: ch02-b11
          speaker: rottenmeier
          text: 蒂内特！蒂内特！塞巴斯蒂安！塞巴斯蒂安！
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: 两个仆人闻声赶来，一个追到桌边，一个守住长椅，把四处逃窜的小猫一只一只捉回来。小猫们可不肯老实待着，刚放进去的还想往外爬。两人费了好大工夫，才把它们全都放回篮子，然后抬出去，和先前那两只养在一起。这一天又是乱子接着乱子，大家自然又没得到打呵欠的机会。
        - id: ch02-b13
          speaker: narrator
          text: 到了晚上，罗滕迈尔小姐总算从早晨的惊吓里恢复了一些。她叫来两个仆人，仔细盘问，终于弄清了事情的来龙去脉。原来手摇风琴男孩和一篮小猫都和海蒂有关，是她前一天出门带来的结果。罗滕迈尔小姐气得脸色发白，一时连话也说不出来。她让蒂内特和塞巴斯蒂安退下，转身看着站在克拉拉长椅旁的海蒂。海蒂却完全不懂自己究竟犯了什么错。
        - id: ch02-b14
          speaker: rottenmeier
          text: 阿德莱德，我只想得出一种惩罚，也许能让你明白自己的行为有多坏。你简直是个十足的小野人，不过我们要试试看，能不能把你驯服，叫你不敢再做这种事。我要把你关进黑漆漆的地窖，让老鼠和黑甲虫陪着你！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 海蒂安静又惊讶地听着。她从没见过这样的地窖。祖父家的地窖放着新做的奶酪和刚挤的牛奶，又舒服又招人喜欢。至于老鼠和黑甲虫是什么样，她也一点不知道。克拉拉却急坏了。
        - id: ch02-b16
          speaker: clara
          text: 不行，不行！罗滕迈尔小姐，你必须等爸爸回来。他写信说很快就到家。我会把一切都告诉他，让他决定该怎么处置海蒂。
        - id: ch02-b17
          speaker: narrator
          text: 克拉拉搬出了父亲，罗滕迈尔小姐便无可奈何，何况塞泽曼先生真的很快就要回来了。她不大高兴地站起身。
        - id: ch02-b18
          speaker: rottenmeier
          text: 那就照你的意思吧，克拉拉。不过，我也有话要对塞泽曼先生说。
        - id: ch02-b19
          speaker: narrator
          text: 她说完，便离开了房间。
    - id: ch03
      title: 海蒂想回家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 接下来两天平安无事，再没发生乱子。可是罗滕迈尔小姐怎么也恢复不了平静。只要海蒂出现在眼前，她就会想起自己受到的捉弄。她觉得，自从这孩子走进大宅，一切好像全颠倒了。她费尽力气，也没法让事情重新变得井井有条。克拉拉倒比以前快活多了。过去，上课的时间总显得格外漫长。现在她再也不觉得难熬，因为海蒂总能弄出点新鲜事来，把大家的心思带到别处去。
        - id: ch03-b02
          speaker: narrator
          text: 海蒂把所有字母混在一起，怎么也记不住。家庭教师指着字母的形状，有时说像一只小角，有时说像鸟嘴，希望这样能帮她记住。可那些说法只在海蒂脑子里变成了一幅幅山上的画。
        - id: ch03-b03
          speaker: heidi
          text: 那是一只山羊！那是一只猛禽！
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 她看见了山羊和飞鸟，却还是没认出字母。下午晚些时候，海蒂总陪克拉拉坐着，一讲起山上的景色和生活，就说个不停。思乡的念头越来越强，最后总会冲出口来。
        - id: ch03-b05
          speaker: heidi
          text: 我现在必须回家！明天我真的一定得走！
        - id: ch03-b06
          speaker: narrator
          text: 克拉拉每次都会耐心安慰她，让她先等父亲回来，到时候再一起看该怎么办。海蒂会答应，也很快像是又振作起来。这是因为她心里藏着一点欢喜。每在这里多住一天，她就能替奶奶多攒两个白面包。午餐时有一个，晚餐时又有一个，她总趁人不注意，悄悄把它装进口袋。奶奶没有白面包吃，硬邦邦的黑面包又几乎咬不动。海蒂明明也喜欢这些柔软的白面包，可只要想到奶奶，便怎么也舍不得吃掉自己那份。
        - id: ch03-b07
          speaker: narrator
          text: 午饭后，海蒂得独自在房间里坐两个钟头。她已经知道，在法兰克福不能像在山上一样到处跑，所以也不再试着出门。罗滕迈尔小姐不许她在餐厅同塞巴斯蒂安说话。至于蒂内特，海蒂总是躲得远远的，也从没想过主动同她交谈。她很清楚，那位女仆瞧不起自己，一开口就带着嘲弄。于是一天又一天，海蒂都有很长一段时间，只能独自坐着想家。
        - id: ch03-b08
          speaker: narrator
          text: 她想着，山上一定正在一点点转绿。金黄的花朵已经盛开，在阳光里闪闪发亮。温暖的日光铺满四周，照着积雪，照着岩石，也照亮了整座宽阔的山谷。海蒂一遍又一遍地想象那幅景色。每想一回，回家的渴望就更强一点，到后来几乎叫她再也忍不住。况且迪特姨妈明明说过，只要她愿意，随时都可以回去。
        - id: ch03-b09
          speaker: narrator
          text: 终于有一天，海蒂觉得自己一分钟也熬不下去了。她把所有白面包包进红披肩，戴上旧草帽，匆匆下楼。可是刚走到门口，她就遇见散步回来的罗滕迈尔小姐。回家的路当场被截住了。罗滕迈尔小姐从头到脚盯着她看，目光最后落在红布包上。
        - id: ch03-b10
          speaker: rottenmeier
          text: 你为什么打扮成这个样子？这是什么意思？我不是严厉禁止过你在街上乱跑吗？可你又要出门，还把自己弄得像个小叫花子！
          emotion: angry
        - id: ch03-b11
          speaker: heidi
          text: 我不是要乱跑。我是要回家。
          emotion: fearful
        - id: ch03-b12
          speaker: rottenmeier
          text: 你说什么？回家？你竟想这样逃走！要是塞泽曼先生知道了，他会怎么说？你绝不能让他听见这件事！我倒要问问，这座房子有什么不好？我们待你还不够好吗？你缺过什么吗？你以前住过这样的房子，吃过这样的饭菜，还有这么多人服侍你吗？
          emotion: angry
        - id: ch03-b13
          speaker: heidi
          text: 没有。
        - id: ch03-b14
          speaker: rottenmeier
          text: 我就知道没有！你在这里什么都不缺，却一点也不知道感恩。就是因为你过得太舒服，才闲得只会想下一件坏事！
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: 海蒂再也压不住心里的难受，所有思念一起涌了出来。
        - id: ch03-b16
          speaker: heidi
          text: 我真的只是想回家。我要是离开太久，雪花又会哭。奶奶还在等我。我不在那里，就不能拿奶酪给彼得，绿雀会挨打。我也永远看不见太阳怎样向群山道晚安。要是那只大鸟飞过法兰克福，它一定会叫得更响，说人们都挤在一起，彼此教坏，却不肯到岩石上去住。山上明明好得多！
          emotion: sad
        - id: ch03-b17
          speaker: rottenmeier
          text: 上天保佑，这孩子失去理智了！
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: 罗滕迈尔小姐惊慌地转身，匆匆跑上台阶，一头撞上塞巴斯蒂安。她捂住被撞疼的额头，急忙下令。
        - id: ch03-b19
          speaker: rottenmeier
          text: 立刻把那个不幸的小东西带进来！
        - id: ch03-b20
          speaker: narrator
          text: 塞巴斯蒂安揉着自己的脑袋走下去。他挨的那一下其实更重。海蒂仍站在原地，眼睛亮得发烫，内心的激动让她浑身发抖。
        - id: ch03-b21
          speaker: sebastian
          text: 怎么，又惹上麻烦啦？好了，别太往心里去。最要紧的是打起精神！她差点把我的脑袋撞出一个洞，你可别让她吓住。不过我们得进去了，她叫我来带你。
        - id: ch03-b22
          speaker: narrator
          text: 海蒂开始上楼，却一步挨着一步，走得异常缓慢，和平时完全不同。塞巴斯蒂安看得很难过，跟在后面不断替她打气。
        - id: ch03-b23
          speaker: sebastian
          text: 千万别认输，也别让她把你弄得不快活。鼓起勇气来！我们家小姐多懂事呀，你来了以后，她一次都没哭过。好多孩子像她这么大，一天能哭十几回呢。那些小猫在楼上的新家可开心了，到处乱跳，活像一群小疯子。以后等罗滕迈尔小姐不在，我们一起去看它们，好不好？
        - id: ch03-b24
          speaker: narrator
          text: 海蒂轻轻点头，可那点头一点喜气也没有，看得塞巴斯蒂安心疼。他站在那里，用同情的目光一直望着她，看她慢慢挪回自己的房间。到了晚餐时，罗滕迈尔小姐一句话也不说，只不时警惕地瞥向海蒂，好像孩子随时会用什么稀奇古怪的方式突然发作。海蒂安静地坐着，不动，也不吃。她唯一做的事，就是趁人不注意，飞快地把盘边的白面包装进口袋。
        - id: ch03-b25
          speaker: narrator
          text: 第二天早晨，家庭教师一到，罗滕迈尔小姐就把他拉到一旁。她担心气候、生活方式和陌生环境全变了，会不会把海蒂的头脑弄坏。她讲了昨天的事，也讲了海蒂那一番古怪的话。
        - id: ch03-b26
          speaker: tutor
          text: 您不用惊慌。我已经发现，这孩子确实有些不同寻常，不过她的心智没有问题。只要细心照料，好好教导，她自然会恢复平衡，这也正是我一直在努力做的事。
        - id: ch03-b27
          speaker: narrator
          text: 家庭教师听过这番话，再想到自己至今没能教会海蒂字母，反倒更相信这个判断了。罗滕迈尔小姐听完，放心了不少，便让他去上课。
    - id: ch04
      title: 白面包和旧草帽
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 下午，罗滕迈尔小姐忽然想起海蒂昨天准备远行时的样子。那顶草帽，那只红布包，实在叫她难以忘记。她决定从克拉拉的衣柜里挑些衣服给海蒂，好让塞泽曼先生回家时，孩子看起来像样一点。她把这主意告诉克拉拉，克拉拉很乐意，无论多少衣裙和帽子都肯送。于是罗滕迈尔小姐上楼翻查海蒂的东西，想看看什么该留下，什么必须扔掉。才过几分钟，她就回来了，脸上满是惊恐。
        - id: ch04-b02
          speaker: rottenmeier
          text: 阿德莱德，我在你的衣柜里看见了什么！我从没听说有人会做这种事！衣柜明明是放衣服的，可柜底竟有一堆白面包。克拉拉，你相信吗？整整一大堆面包！蒂内特，上楼把那些白面包全拿走，还有桌上那顶旧草帽！
          emotion: angry
        - id: ch04-b03
          speaker: heidi
          text: 不要！草帽必须留下！那些白面包是给奶奶的！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 海蒂冲上去，想拦住蒂内特。罗滕迈尔小姐却一把抓住她，牢牢按着，不让她追过去。
        - id: ch04-b05
          speaker: rottenmeier
          text: 你留在这里。那些面包和破烂，都该送到它们该去的地方。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 海蒂绝望地扑倒在克拉拉的长椅上，放声大哭。她越哭越响，也越哭越伤心。
        - id: ch04-b07
          speaker: heidi
          text: 奶奶的白面包全没有了！那些全是给奶奶的，现在都被拿走了。奶奶一只也吃不到了！
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 海蒂哭得像是心都要碎了。罗滕迈尔小姐跑出了房间。克拉拉听着她的哭声，又难过，又害怕。
        - id: ch04-b09
          speaker: clara
          text: 海蒂，求你别再哭了！听我说，别这么伤心。等你回家，我会给你同样多的白面包，或者给你更多，而且全是新鲜的，让你带给奶奶。你藏的这些，到那时候早就又干又硬了。好了，别哭了！
          emotion: calm
        - id: ch04-b10
          speaker: narrator
          text: 海蒂还是抽噎了很久，哭声一阵阵地涌上来，怎样也停不住。要不是克拉拉的承诺给了她安慰，她简直会一直哭下去。等抽泣渐渐平息，她仍不敢就这样相信。她一次次抬起头，非要把同一个问题问清楚，确定克拉拉真的会把白面包交给她，真的能让奶奶吃上。
        - id: ch04-b11
          speaker: heidi
          text: 你真的会给我同样多吗？和我原来的一样多，全是给奶奶的吗？
          emotion: sad
        - id: ch04-b12
          speaker: clara
          text: 真的，我会给你同样多，还会给得更多。只要你重新快活起来。
          emotion: calm
        - id: ch04-b13
          speaker: narrator
          text: 晚餐时，海蒂的眼睛还哭得通红。一看见盘边的白面包，她便想起那些被拿走的面包，忍不住又抽噎了一声。但她知道坐在餐桌边必须安安静静，只好努力忍住。塞巴斯蒂安只要一对上她的目光，就会做出种种奇怪的手势。他先指指自己的头，又指指海蒂的头，再轻轻点几下，像是在告诉她，不要难过，他已经替她把那件宝贝好好保住了。
        - id: ch04-b14
          speaker: narrator
          text: 那天夜里，海蒂正准备上床，忽然发现旧草帽好好地躺在被子下面。她一下子欢喜起来，赶紧伸手把它抱住。激动中，她又把帽子捏得更不像样了。随后，她找来一块手帕，把草帽仔细包好，塞进衣柜最里面的角落。
        - id: ch04-b15
          speaker: narrator
          text: 原来是塞巴斯蒂安救下了草帽。蒂内特上楼拿面包和帽子时，他正在餐厅，听见了海蒂遭遇的一切，也听见她伤心地大哭。于是他跟了上去。蒂内特拿着东西走出海蒂的房间，他便一把接过那顶帽子。
        - id: ch04-b16
          speaker: sebastian
          text: 这个旧东西交给我处理吧。
        - id: ch04-b17
          speaker: narrator
          text: 塞巴斯蒂安说这话时，就已经打定主意，不会让旧草帽被扔掉。他悄悄把帽子藏到海蒂的被子下面。能为伤心的孩子留下这件宝贝，他打心眼里高兴。晚餐时，他又是指脑袋，又是向海蒂点头，那些鼓励她的手势，说的正是这件事。
