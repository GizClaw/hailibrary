  chapters:
    - id: ch01
      title: "CHAPTER I. UP THE MOUNTAIN TO ALM-UNCLE"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A footpath begins in the old village of Mayenfeld, a pleasant place in the valley. It winds through green, shady meadows until it reaches the foot of the mountains. From high above, the stern and lofty peaks look down over everything below. As the path climbs, the land around it slowly grows wilder. A traveler does not have to go far before the air fills with the fragrance of short grass and hardy mountain plants. The way is steep there, and it leads directly upward toward the summits.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One clear June morning, two figures were making their way up that narrow path. One was a tall, sturdy girl. The other was a small child whom she held by the hand. The child's cheeks glowed crimson from the heat, and the bright color showed even through her dark, sun-browned skin. That was hardly surprising. Though the hot June sun beat down on her, she was dressed as if she needed protection from the bitterest winter cold. She looked no more than five years old, if she was even that old. But it was almost impossible to see her natural shape. She seemed to have two dresses on, or perhaps three, one over another. Around them all was a thick red woolen shawl, wrapped until her little body had no shape at all. On her feet were heavy mountain shoes with nails in their soles. Buried under all those clothes, she trudged slowly and painfully upward through the heat.
        - id: ch01-b03
          speaker: narrator
          text: >-
            They had left the valley more than an hour behind when they reached Dorfli, the little hamlet halfway up the mountain. Greetings came from every side. Some people called through their windows. Others stood in open doorways or outside their houses. The older girl had returned to her old home, and everyone recognized her. But she did not pause to answer their welcomes or the questions they called after her. She walked straight through the hamlet without stopping for even a moment. Only when she reached the last of its scattered houses did a woman call to her from the doorway.
        - id: ch01-b04
          speaker: barbel
          text: >-
            Hold on, Dete! If you're headed farther up, I'll walk with you.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dete stopped. At once, the child dropped her hand and sat on the ground.
        - id: ch01-b06
          speaker: dete
          text: >-
            Are you tired, Heidi?
        - id: ch01-b07
          speaker: heidi
          text: >-
            No. I'm hot.
        - id: ch01-b08
          speaker: dete
          text: >-
            We're nearly at the top. Be brave a little longer and take nice big steps. We'll be there in another hour.
        - id: ch01-b09
          speaker: narrator
          text: >-
            A stout, good-natured woman joined them. She and Dete walked ahead, talking eagerly about everyone and everything around Dorfli, while Heidi trailed behind.
        - id: ch01-b10
          speaker: barbel
          text: >-
            So where are you taking the child? She's the little girl your sister left, isn't she?
        - id: ch01-b11
          speaker: dete
          text: >-
            Yes. I'm taking her up to Uncle. She'll live with him now.
        - id: ch01-b12
          speaker: barbel
          text: >-
            Live up there with Alm-Uncle? Dete, you can't be serious! How could you even think of it? The old man will send you and your whole plan straight back down the mountain.
          emotion: surprised
        - id: ch01-b13
          speaker: dete
          text: >-
            He can't very well do that. He's her grandfather, so he has to provide for her. I've cared for her until now, and I'm not giving up a good new position because of her. It's time her grandfather did his duty.
        - id: ch01-b14
          speaker: barbel
          text: >-
            That might make sense if he were like anybody else, but you know he isn't. What would he do with such a young child? She can't possibly live with him. And where are you going?
        - id: ch01-b15
          speaker: dete
          text: >-
            Frankfurt. An excellent position is waiting for me. The family stayed at the Baths last summer, and I looked after their rooms. They wanted to take me home with them then, but I couldn't leave. Now they've come back and offered again. This time I'm going with them, whatever anyone says.
        - id: ch01-b16
          speaker: barbel
          text: >-
            I'm glad I'm not that child! Nobody knows a thing about the old man up there. He wants nothing to do with anyone, and from one year's end to the next, he never sets foot inside a church. Once in a while he comes down the mountain. Whenever he does, people hurry out of the way of him and that great stick he carries. Just seeing those huge gray eyebrows and that enormous beard is frightening enough. He looks like some wild old heathen from a far-off land. Hardly anyone would want to meet him alone.
        - id: ch01-b17
          speaker: dete
          text: >-
            So what? He's still her grandfather, and he has to care for her. He won't hurt her. If he does, he'll be the one who answers for it, not me.
        - id: ch01-b18
          speaker: barbel
          text: >-
            I wish I knew what he has on his conscience. Why else would he look that way and live alone on the mountain like a hermit? He hardly lets anyone see him. People tell all sorts of stories. Your sister must have told you plenty about him, Dete. Didn't she?
        - id: ch01-b19
          speaker: dete
          text: >-
            She did, but I'm not repeating it. If any of it reached him, I'd be in trouble.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Barbel had wanted the truth about Alm-Uncle for a long time. She could not understand why he seemed to hate other people, or why he insisted on living alone. Nor could she understand the way everyone spoke about him almost in whispers. They seemed afraid to say anything against him, but no one was willing to stand up for him either. Even his name puzzled her. All of Dorfli called him Uncle, though he could not possibly be uncle to everybody who lived there. But that was the village custom, so Barbel did what everyone else did and called the old man Uncle too.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Barbel had moved to Dorfli only after her recent marriage. Before that, her home had been down in Prattigau. She did not know much about the people who had once lived in Dorfli or the things that had happened there years ago. Dete was different. She had been born in the hamlet and had lived there with her mother until the woman died the year before. Afterward, Dete went to the Baths at Ragatz and found work as a chambermaid in the large hotel. That very morning, she had traveled all the way from Ragatz with Heidi. A friend had let them ride in a hay cart as far as Mayenfeld, and from there they had begun the long walk up the mountain.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Barbel would not waste this chance to satisfy her curiosity. She slipped her arm through Dete's as if sharing a confidence.
        - id: ch01-b23
          speaker: barbel
          text: >-
            You know the truth behind all those stories about him. Tell me what's wrong with the old man. Did people always avoid him? Was he always so set against everyone?
        - id: ch01-b24
          speaker: dete
          text: >-
            How would I know what he was always like? I'm only twenty-six, and he must be at least seventy. I can't tell you much about his youth. But if I knew you wouldn't spread my words all through Prattigau, I could tell you quite a lot. My mother came from Domleschg, and so did he.
        - id: ch01-b25
          speaker: barbel
          text: >-
            Oh, nonsense, Dete. Gossip isn't that bad in Prattigau. And when I need to hold my tongue, I can.
        - id: ch01-b26
          speaker: dete
          text: >-
            All right, then. I'll tell you. But wait.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Dete looked back to make sure Heidi was too far away to hear what she was about to say. But the child was nowhere in sight. She must have turned away from the path some time earlier, while the women were too busy with their conversation to notice. Dete stopped where she was and looked in every direction. The footpath curved a little this way and that, but nearly its whole length was visible all the way down toward Dorfli. At that moment, no one could be seen anywhere along it.
        - id: ch01-b28
          speaker: barbel
          text: >-
            There she is! Look over there. She's climbing that slope with the goatherd and his goats. I wonder why he's taking them up so late today. This works out well for us. He can keep an eye on her, and you can tell me the story.
        - id: ch01-b29
          speaker: dete
          text: >-
            He doesn't need to fuss over her. She's not at all foolish for five. She watches everything around her. I've noticed that often enough, and it may help her someday. The old man has nothing up there but his hut and two goats.
        - id: ch01-b30
          speaker: barbel
          text: >-
            Did he ever own more than that?
        - id: ch01-b31
          speaker: dete
          text: >-
            More? He once owned one of the biggest farms in all of Domleschg. He was the older of two brothers. The younger one was quiet, sensible, and orderly. But nothing pleased Uncle unless he could act like a grand gentleman. He drove around the countryside and spent his time with bad company, strangers whom nobody there even knew. Before long, drinking and gambling had swallowed his whole property. When his mother and father learned what he had done, the sorrow was too much for them. They died soon afterward, one following the other. His younger brother had been reduced to poverty too. He left in anger, and no one knew where he went. Uncle himself had nothing left except his bad name, so he disappeared as well.
        - id: ch01-b32
          speaker: dete
          text: >-
            For a while, nobody knew where he was. Then someone found out that he'd gone to Naples and become a soldier. After that, there wasn't another word about him for twelve or maybe fifteen years. At the end of that long silence, he suddenly appeared in Domleschg again. This time he had a young child with him. He tried to place the boy with some of his relatives, but every door was shut in his face. Nobody wanted anything more to do with him. Their refusal left him bitter. He swore that he would never set foot in Domleschg again. Then he brought his little son here to Dorfli, and the two of them stayed.
        - id: ch01-b33
          speaker: dete
          text: >-
            His wife was probably a woman from the Grisons whom he met while he was away. She died not long after they married. Uncle couldn't have been entirely without money, because when Tobias was old enough, he paid for the boy to learn carpentry. Tobias grew into a steady young man, and everyone in Dorfli treated him kindly. But the villagers still looked at Uncle with suspicion. People even whispered that he'd been forced to escape from Naples. They said things might have gone very badly for him if he'd stayed, because he'd killed a man. And not in a fair fight, you understand. They said it happened in some sort of brawl.
        - id: ch01-b34
          speaker: dete
          text: >-
            Our family never refused to admit the relationship. My great-grandmother on Mother's side was the sister of his grandmother, so we called him Uncle. Through my father, we're also related to nearly every family in Dorfli. Because all of us used that name, the whole village eventually began calling him Uncle too. Later, when he went away to live on the high mountain pasture, everyone added the name of the pasture. From then on, wherever he went, he was known as Alm-Uncle.
        - id: ch01-b35
          speaker: barbel
          text: >-
            And what became of Tobias?
        - id: ch01-b36
          speaker: dete
          text: >-
            Wait, I'm coming to that. You can't expect me to tell you everything at once. Tobias learned his trade in Mels. When his apprenticeship was finished, he returned to Dorfli and married my sister Adelaide. They had always been fond of each other. Once they were married, they lived very happily together. But that happiness did not last for long.
        - id: ch01-b37
          speaker: dete
          text: >-
            Only two years after the wedding, Tobias was killed at work. A beam fell on him and killed him where he stood. They carried his body home. When Adelaide saw her husband so terribly injured, horror and grief overwhelmed her. She fell into a fever and never recovered from it. She had always been delicate. Sometimes she suffered strange spells when no one could tell whether she was awake or asleep. Two months after Tobias was carried to his grave, his wife followed him there.
          emotion: sad
        - id: ch01-b38
          speaker: dete
          text: >-
            Their sad deaths were talked about everywhere, both near and far. In private homes and out in public, people said it was a punishment Uncle had earned through his godless life. Some went so far as to say it directly to his face. Our minister tried to awaken his conscience and urged him to repent. But Uncle only became angrier and more stubborn. He would not speak to a soul, and everyone did all they could to stay out of his way. Then, all at once, we heard that he had gone up to live on the Alm. He meant never to come down again. Ever since then, he has lived alone on the mountainside, at war with God and with other people.
        - id: ch01-b39
          speaker: dete
          text: >-
            Mother and I took in Adelaide's little girl. Heidi was only a year old then, and the two of us cared for her. When Mother died last year, I had to go down to the Baths and earn money. I paid old Ursel, who lives in the village just above, to keep Heidi and look after her. I stayed at the Baths through the whole winter. Since I can sew and knit, I had no trouble finding plenty of work. Then, early this spring, the same family I'd served before came back from Frankfurt. Once again, they asked me to return home with them. We leave the day after tomorrow. I promise you, Barbel, this is an excellent position for me.
        - id: ch01-b40
          speaker: barbel
          text: >-
            And you're still handing the child over to that old man? Dete, I can't believe you'd do it.
        - id: ch01-b41
          speaker: dete
          text: >-
            What do you expect from me? I've done my duty. I can't take a five-year-old to Frankfurt. But where are you going, Barbel? We're already halfway up the Alm.
        - id: ch01-b42
          speaker: barbel
          text: >-
            This is where I meant to stop. I need to speak with the goatherd's wife. She does some spinning for me in winter. Good-bye, Dete, and good luck!
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dete shook her friend's hand and stayed where she was while Barbel headed toward a small, dark brown hut. It stood a few steps off the path, in a hollow halfway up the Alm. The hollow gave it some protection from the mountain wind, and that protection mattered. The hut was so broken-down and worn out that even in its sheltered place it hardly seemed safe for anyone to live in. Whenever the strong south wind came sweeping over the mountain, everything inside began to move. The doors and windows shook and rattled. Every rotten old beam creaked and trembled. On days like those, if the goatherd's hut had stood higher on the exposed slope, it might have been blown straight down into the valley without a moment's warning.
        - id: ch01-b44
          speaker: narrator
          text: >-
            This was the home of Peter, an eleven-year-old goatherd. Every morning he went down to Dorfli to collect the village goats. Then he drove the whole herd high onto the mountain, where they were free to wander and feed on the delicious plants until evening. At the end of the day, Peter and his light-footed animals came running and leaping down the mountain again. Once they reached Dorfli, Peter put his fingers to his mouth and gave a sharp whistle. At that signal, the owners came out of their houses to fetch the goats that belonged to them.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Usually it was the younger boys and girls who came running when they heard Peter's whistle. None of them were afraid of the gentle goats. That hour in the village was Peter's only chance, through all the summer months, to see his young friends. Every other hour of his day was spent alone with the herd. It was true that his mother and blind grandmother lived at home with him, but he always had to leave very early in the morning. In the evening, after bringing the goats down, he stayed in Dorfli as long as he possibly could, talking and playing with the other children. That meant he did not reach home until late. There was just enough time each morning to swallow his bread and milk before he left. At night he ate another meal much like it, lay down, and went straight to sleep.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Peter's father had also been known as the goatherd because that was how he had earned his living when he was younger. Some years before, he had been killed in an accident while cutting wood. Peter's mother was really named Brigitta. But for the sake of the old connection, everyone still called her the goatherd's wife. Her blind mother needed no other name at all. To both young people and old people throughout the neighborhood, she was simply Grandmother.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Dete had been standing there for ten full minutes, turning this way and that as she searched for some sign of the children and goats. She could not catch even one glimpse of them. At last she climbed to a higher place. From there she could see much more of the mountain as it fell away toward the valley. Still she searched the surrounding slopes, and with every moment, the anxiety in her face and movements grew stronger.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Meanwhile, the children were climbing by a longer, roundabout way. Peter knew many places away from the main path where shrubs and other plants made especially good food for his goats, and he often led the herd toward them. At first, Heidi struggled after him. The heat and the weight of that thick armor of clothes had worn her out, and she panted as she climbed. But she did not complain. Her small eyes kept watch on everything ahead. First she studied Peter, who sprang lightly here and there on bare feet, wearing only his short, cool breeches. Then she watched the slim-legged goats. They leaped over rocks and bushes and raced up the steepest places with even greater ease.
        - id: ch01-b49
          speaker: narrator
          text: >-
            All at once, Heidi sat down on the ground. Her small fingers moved as quickly as they could. First she pulled off the heavy shoes. Then off came her stockings. She stood again, unwound the hot red shawl from around her body, and threw it down. Next she began unfastening her dress. It was off in a second, but another dress was still underneath. Dete had put Heidi's Sunday frock over her everyday one so she would not have to carry it. Quick as lightning, Heidi undid that dress as well and dropped it with the others.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Now Heidi wore only a light undergarment with short sleeves. She stretched out her bare arms in delight, arranged all the clothes in one neat pile, and raced after Peter and the goats. Soon she was climbing and jumping as nimbly as the rest of them.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Peter had paid no attention to what Heidi was doing while she lagged behind. But when she ran up to him in her new outfit, his face opened into a grin. He looked back at the small heap of clothes on the ground, and the grin stretched wider and wider until his mouth seemed to reach almost from ear to ear. He did not say a word about it. Heidi, able to move easily at last, began talking to him instead. She wanted to know how many goats he had. She asked where he was going with them and what he would do when he got there. One question followed another, and Peter had to answer them all.
        - id: ch01-b52
          speaker: narrator
          text: >-
            After some time, the children and goats came close to the hut and finally moved into Dete's view. The little company was climbing steadily toward her from lower on the slope. Dete had barely caught sight of them when she saw how Heidi was dressed. At once, she let out a shriek.
        - id: ch01-b53
          speaker: dete
          text: >-
            Heidi! What have you done? Just look at you! Where are both your dresses? Where's the red shawl? And your new shoes, and the stockings I knitted? Everything is gone! What were you thinking? Where are all your clothes?
          emotion: surprised
        - id: ch01-b54
          speaker: narrator
          text: >-
            Heidi calmly pointed down the mountain.
        - id: ch01-b55
          speaker: heidi
          text: >-
            Down there.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Dete looked where Heidi pointed. Far below, she could just make out something on the ground with a red patch on top. It had to be the woolen shawl.
        - id: ch01-b57
          speaker: dete
          text: >-
            You naughty little thing! Why would you do that? What made you take everything off? What were you thinking?
          emotion: angry
        - id: ch01-b58
          speaker: heidi
          text: >-
            I don't want any clothes.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Heidi answered without showing the least sign that she regretted what she had done.
        - id: ch01-b60
          speaker: dete
          text: >-
            You careless child! Don't you have any sense? Who's going all the way back for them? It's half an hour down there! Peter, hurry and fetch them. Stop staring at me as if your feet were stuck to the ground!
          emotion: angry
        - id: ch01-b61
          speaker: peter
          text: >-
            I'm late already.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Peter spoke slowly and did not move. His hands stayed in his pockets while Dete scolded.
        - id: ch01-b63
          speaker: dete
          text: >-
            Standing there with your eyes wide open won't get you anywhere. Look, I'll give you something nice.
        - id: ch01-b64
          speaker: narrator
          text: >-
            She held out a bright new coin, and it flashed in the sunlight. The sight changed Peter at once. He was off down the steep mountainside, taking the shortest possible way. In almost no time, he reached the little pile. He gathered every piece of clothing, tucked the bundle under his arm, and raced back up. He returned so quickly that even Dete had to give him a word of praise. Then she handed over the promised coin. Peter immediately pushed it deep into his pocket. His whole face beamed with delight. It was not often that he could call such riches his own.
        - id: ch01-b65
          speaker: dete
          text: >-
            Carry the clothes as far as Uncle's for me. You're headed that way.
        - id: ch01-b66
          speaker: narrator
          text: >-
            Peter was glad to agree. Dete prepared to continue, starting up the steep mountainside that rose directly behind the goatherd's hut. Peter followed her on his bare feet. His left arm held the bundle of Heidi's clothes close against him, while his right arm swung his goatherd's stick. Beside him, Heidi and the goats went skipping and jumping joyfully up the slope.
        - id: ch01-b67
          speaker: narrator
          text: >-
            After climbing for more than three quarters of an hour, they reached the top of the Alm. Uncle's hut stood on a shelf of rock. The winds could strike it from every side, but every ray of sunshine could rest there too. From the hut, a person could look out over the whole valley below. Three old fir trees stood behind it. Their branches had never been cut, and they grew long and thick. Beyond the trees rose another great wall of mountain. Beautiful grass and plants still covered its lower heights. Higher up, the slopes became stonier, with only patches of scrub. Those slopes led at last to the steep, bare, rocky summits.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Uncle had built a seat against the side of the hut that faced the valley. He sat there with his pipe in his mouth and his hands on his knees, gazing quietly into the distance. Then Dete, the children, and the goats suddenly climbed into sight. Heidi reached him first. She walked straight to the old man and held out her hand.
        - id: ch01-b69
          speaker: heidi
          text: >-
            Good evening, Grandfather.
        - id: ch01-b70
          speaker: grandfather
          text: >-
            Well, well. What's all this about?
        - id: ch01-b71
          speaker: narrator
          text: >-
            He took her hand and gave it one short, abrupt shake. Then he studied her for a long time from beneath his bushy eyebrows. Heidi did not look away. She stared steadily back at him, without the least fear. Grandfather's long beard and thick gray eyebrows made him a remarkable sight. The eyebrows grew together over his nose until they looked like one great bush. Heidi had never seen anyone like him, and she simply could not take her eyes off his face. By then Dete had reached the hut, with Peter coming behind her. Peter stopped and waited, curious to see what would happen.
        - id: ch01-b72
          speaker: dete
          text: >-
            Good day, Uncle. I've brought you Tobias and Adelaide's child. You probably don't recognize her. You haven't seen her since she was one.
        - id: ch01-b73
          speaker: grandfather
          text: >-
            And what is she doing up here with me? Peter, take your goats and go. You're late enough already. Take mine along too.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Peter obeyed at once. One look from the old man told him he should not stay, and he quickly disappeared.
        - id: ch01-b75
          speaker: dete
          text: >-
            She's come to stay with you. I've done my duty by her for four years. Now it's time you did yours.
        - id: ch01-b76
          speaker: grandfather
          text: >-
            So that's how it is. And when she starts crying and begging for you, the way foolish little children do, what am I supposed to do then?
        - id: ch01-b77
          speaker: dete
          text: >-
            That's for you to decide. When she was left with me as a baby, I cared for her without complaining, even though Mother and I had plenty to do. Now I have to earn my own living, and you're her closest relative. If you can't keep her, do whatever you like. But if any harm comes to her, you'll answer for it. I should think your conscience is already carrying enough.
        - id: ch01-b78
          speaker: narrator
          text: >-
            The truth was that Dete's own conscience was not easy about what she was doing. Because she felt guilty, she had grown hot and irritable. That was why her answer went farther than she had meant it to. As the last words left her mouth, Uncle rose from his seat. He looked at her in such a way that she drew back one step, and then another. He flung out his arm and spoke in a voice that allowed no argument.
        - id: ch01-b79
          speaker: grandfather
          text: >-
            Leave. Go back where you came from, right now. And don't let me see your face again anytime soon.
          emotion: angry
        - id: ch01-b80
          speaker: narrator
          text: >-
            Dete needed no second warning.
        - id: ch01-b81
          speaker: dete
          text: >-
            Good-bye, then. Good-bye, Heidi.
        - id: ch01-b82
          speaker: narrator
          text: >-
            She turned quickly and started running down the mountain. She did not slow her pace until she was safely back in Dorfli. The agitation inside her drove her onward as if a steam engine were working there. As soon as she entered the hamlet, questions rained down from every side. Everyone knew Dete. They also knew all about Heidi's birth and the sad history of her parents. From windows and doorways, voice after voice demanded to know what Dete had done with the child and where she had left her.
        - id: ch01-b83
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: >-
            Where's the child? Where did you leave her, Dete?
        - id: ch01-b84
          speaker: dete
          text: >-
            Up there with Alm-Uncle! I've told you already.
        - id: ch01-b85
          speaker: villager_1
          text: >-
            How could you do such a thing?
          emotion: angry
        - id: ch01-b86
          speaker: villager_2
          text: >-
            You left a helpless little girl up there?
          emotion: surprised
        - id: ch01-b87
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: >-
            That poor little child! That poor little child!
          emotion: sad
        - id: ch01-b88
          speaker: narrator
          text: >-
            Their reproaches followed Dete along the road. At last she could bear no more. She ran until their voices could not reach her.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Dete was far from happy when she thought about what she had done. Heidi's dying mother had placed the little girl in her care, and Dete knew it. Still, she quieted her conscience with another thought. If she went away and earned plenty of money, perhaps she would be able to do more for the child. It also comforted her to remember that she would soon be far from all these people who were making such a fuss and calling after her. More than anything, she was relieved that she was free now. Nothing stood between her and the excellent position in Frankfurt.
