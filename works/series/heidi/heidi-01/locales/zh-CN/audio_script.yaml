audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖细腻，带着从容的讲故事感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    heidi:
      display_name: 海蒂
      tts:
        delivery: 天真直接，遇到新鲜事时满是好奇和喜悦
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 偏高
    dete:
      display_name: 德特
      tts:
        delivery: 干脆利落，心虚或着急时语气更冲
        timbre: 清亮结实
        pace: 明快
        pitch: 中高音
    barbel:
      display_name: 芭贝尔
      tts:
        delivery: 热心健谈，好奇时追问得又快又紧
        timbre: 圆润亲切
        pace: 稍快
        pitch: 中音
    peter:
      display_name: 彼得
      tts:
        delivery: 朴实寡言，回答总是慢半拍
        timbre: 清脆而略显粗朴
        pace: 偏慢
        pitch: 中高音
    grandfather:
      display_name: 外公
      tts:
        delivery: 简短沉稳，粗粝中藏着威严
        timbre: 低沉厚实
        pace: 不紧不慢
        pitch: 低音
    village_woman_1:
      display_name: 村中女人甲
      tts:
        delivery: 直率急切，责备时毫不掩饰
        timbre: 明亮朴实
        pace: 稍快
        pitch: 中音
    village_woman_2:
      display_name: 村中女人乙
      tts:
        delivery: 心软忧虑，说话带着怜惜
        timbre: 柔和朴实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 六月的山路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 古老的迈恩费尔德村坐落在一片宜人的地方。小路从村里弯弯曲曲地伸出去，穿过碧绿阴凉的草地，一直来到山脚。群山从这一面俯瞰着下面的山谷，峰峦高高耸起，神色森严。沿着小路再往上走，四周越来越荒僻。上山的人走不了多远，就能闻见短草和结实的山地植物散发出的清香。脚下的路越来越陡，一直向高处的峰顶伸去。
        - id: ch01-b02
          speaker: narrator
          text: 六月里一个晴朗的早晨，狭窄的山路上来了两个人。走在前面的是个高大结实的姑娘，手里牵着一个小女孩。孩子至多五岁，脸颊晒得通红，那层红晕连晒黑的皮肤也遮不住。天气明明很热，她却像要去过寒冬，身上套着两三件裙子，外面还裹了一条厚厚的红羊毛披巾。隔着这么多衣服，根本看不出她原本是什么身形。她脚上的钉底山鞋也沉得很，整个人裹成了小小的一团，只能顶着热气，一步一步吃力地往上挪。
        - id: ch01-b03
          speaker: narrator
          text: 她们离开山谷约有一个钟头，才走到半山腰的德尔弗利村。一路上，不断有人从窗口、敞开的门边和屋外向她们招呼。年长的姑娘名叫德特，她回到了故乡，老相识们都在欢迎她，还接连问她去了哪里。德特却一次也没有停，只顾往前走。到了村子最边上一座孤零零的屋子前，门口有人喊住了她。
        - id: ch01-b04
          speaker: barbel
          text: 德特，等等！你还要往上走的话，我跟你一道去。
        - id: ch01-b05
          speaker: narrator
          text: 德特停下脚步。海蒂立刻松开她的手，一屁股坐在地上。
        - id: ch01-b06
          speaker: dete
          text: 海蒂，你走累了？
        - id: ch01-b07
          speaker: heidi
          text: 我不累，就是太热了。
        - id: ch01-b08
          speaker: dete
          text: 快到山顶了。再打起精神走一会儿，步子迈大一点，一个钟头就能到。
        - id: ch01-b09
          speaker: narrator
          text: 一个身材丰腴、面相和善的女人走来，和德特并肩走在前面。她就是芭贝尔。两人马上兴致勃勃地聊起来，从德尔弗利村里说到村外，把各种人和事都谈了一遍。海蒂没有插话，独自在后面慢慢跟着。
        - id: ch01-b10
          speaker: barbel
          text: 你要把这孩子带去哪儿？她就是你姐姐留下的女儿吧？
        - id: ch01-b11
          speaker: dete
          text: 对。我要送她去大叔那里，以后就让她住在山上。
        - id: ch01-b12
          speaker: barbel
          text: 让这么小的孩子跟阿尔姆大叔住？德特，你疯了吗？你怎么会想出这个主意？那个老头准会把你和孩子一起赶下山！
          emotion: surprised
        - id: ch01-b13
          speaker: dete
          text: 他不能赶我们。孩子是他的亲孙女，他总该尽一点责任。我已经把她带到这么大了。芭贝尔，我好不容易才找到一份好差事，不能为了她把机会扔掉。现在该轮到她外公了。
        - id: ch01-b14
          speaker: barbel
          text: 他要是个寻常人，那当然没什么。可你明明知道他的脾气。他哪会照料孩子，何况孩子还这么小！她怎么可能跟他过日子？对了，你自己要去哪儿？
        - id: ch01-b15
          speaker: dete
          text: 去法兰克福。那里有一份再好不过的差事。去年夏天，那户人家来温泉疗养，我照料过他们的房间。当时他们就想带我走，可我实在脱不开身。现在他们又来了，又问了我一次。我已经决定跟他们去，你就别替我操心了。
        - id: ch01-b16
          speaker: barbel
          text: 幸亏我不是这个孩子！山上那老头到底有什么底细，谁也说不清。他从不跟人来往，一年到头连教堂都不进。偶尔下山一次，大家一看见他拄着那根大棍子，就赶紧躲开。那两道浓灰眉毛，再加上一大把胡子，看着就吓人。他简直像个老异教徒，又像个印第安人，谁愿意单独遇见他呀！
          emotion: fearful
        - id: ch01-b17
          speaker: dete
          text: 那又怎样？他终究是孩子的外公，非得照管她不可。他不会伤害海蒂。真出了事，也是他的责任，不是我的。
    - id: ch02
      title: 阿尔姆大叔的往事
      blocks:
        - id: ch02-b01
          speaker: barbel
          text: 我真想知道，这老头到底做过什么亏心事，才会变成现在这样，像个隐士似的躲在山上，几乎从不露面。关于他的传闻可多了。德特，你姐姐一定跟你讲过不少，对不对？
        - id: ch02-b02
          speaker: dete
          text: 我是听说过，可不想把这些话到处传。要是传到他耳朵里，我就有麻烦了。
        - id: ch02-b03
          speaker: narrator
          text: 芭贝尔早就想弄明白，大叔为什么像恨透了所有人，非要独自生活。村里人提起他，总会压低声音，好像谁也不敢公开讲他的坏话。可真要有人说他不好，又没人愿意站出来替他辩护。还有一件事也让她纳闷。这个老人明明不可能是全村人的大叔，为什么人人都这么叫他？她始终想不通，只是大家都这么叫，她也只好跟着叫。
        - id: ch02-b04
          speaker: narrator
          text: 芭贝尔结婚不久，婚后才从山下的普雷蒂高搬来。德尔弗利附近这些年发生过什么，又住过哪些人，她都不太熟悉。德特却出生在这里，一直陪母亲住到去年。母亲去世后，她才到拉加茨温泉的大旅馆当客房女佣。今天一早，她带着海蒂从那里赶来。一个朋友让她们搭上运草车，把两个人送到迈恩费尔德。芭贝尔知道德特一定听过旧事，怎么肯放过这个打听真相的好机会？她亲热地挽起德特的胳膊。
        - id: ch02-b05
          speaker: barbel
          text: 我知道，你一定清楚那些传闻是真是假，也知道他从前的全部经历。快跟我讲讲吧。他究竟出了什么事？难道他一直都这么躲着人吗？
        - id: ch02-b06
          speaker: dete
          text: 我哪知道他年轻时什么样？我才二十六岁，他至少七十了。不过，你要能保证听完以后不传遍整个普雷蒂高，我倒是知道不少。我母亲来自多姆莱施格，他也是那里人。
        - id: ch02-b07
          speaker: barbel
          text: 你说这话是什么意思？普雷蒂高的人才没有那么爱嚼舌头。该闭嘴的时候，我当然管得住自己。
          emotion: angry
        - id: ch02-b08
          speaker: dete
          text: 那我就告诉你。不过先等等。
        - id: ch02-b09
          speaker: narrator
          text: 德特警觉地回头看了看，想确定海蒂离得够远，听不见她们接下来要说的话。谁知孩子已经不见了。她大概早就离开小路，可两个人聊得太投入，谁也没有发现。德特停下来四处寻找。山路虽然有几处弯曲，却几乎一路都能望见，可以一直看到德尔弗利。可她来来回回看了好几遍，此刻路上连一个人影也没有。她们刚才只顾说话，甚至没注意孩子是从哪儿离开的。
        - id: ch02-b10
          speaker: barbel
          text: 我看见她了！在那边。她正跟着牧羊童和羊群往山坡上爬呢。也不知道他今天为什么这么晚才赶羊上山。不过这样正好，他能替我们看着孩子，你也能放心给我讲故事了。
        - id: ch02-b11
          speaker: dete
          text: 海蒂用不着他照看。她虽然才五岁，可一点也不傻，眼睛还特别灵。周围发生什么，她总能看见。以后跟那个老头住，这个本事准有用。毕竟他除了两只山羊和一间小屋，什么都没有。
        - id: ch02-b12
          speaker: barbel
          text: 难道他从前有过更多东西？
        - id: ch02-b13
          speaker: dete
          text: 那当然。他家以前在多姆莱施格有一座很大的农庄。他们兄弟两个，弟弟安静又守规矩，他这个哥哥却偏要摆阔少爷的架子。他坐着车到处游荡，还结交了一群来路不明的外乡朋友。他喝酒、赌博，最后把家产全败光了。父母知道后伤透了心，先后去世。弟弟也落得一无所有，一气之下远走他乡，从此没人知道他去了哪里。
        - id: ch02-b14
          speaker: dete
          text: 大叔除了一身坏名声，也什么都没剩下，后来同样消失了。过了一阵，人们查到他去了那不勒斯当兵。此后十二年，也可能是十五年，再没有他的消息。后来，他突然回到多姆莱施格，身边还带着一个年幼的孩子。他想请亲戚收养，可每一家都把他挡在门外，不肯再和他来往。他受了这种对待，心里全是怨恨，发誓再也不踏进多姆莱施格一步。于是，他来到德尔弗利，带着小儿子住下了。
        - id: ch02-b15
          speaker: dete
          text: 他妻子大概是格劳宾登人，是他在南方遇见的，结婚不久就死了。他手里应该还剩一点钱，因为他把儿子托比亚斯送去学木匠。托比亚斯是个本分的小伙子，村里人人都喜欢他。可大家还是怀疑大叔，甚至有人说，他是从那不勒斯逃回来的，要不然一定会落得很惨。听说他在一场斗殴里杀了人，那可不是公平的决斗。
        - id: ch02-b16
          speaker: dete
          text: 不过，我们家没有不认这门亲。我母亲那边的曾外祖母，是他祖母的姐妹，所以我们叫他大叔。我父亲这边又和德尔弗利几乎家家沾亲，后来全村也跟着这么叫。等他搬上高山牧场，人们走到哪里都叫他阿尔姆大叔了。
        - id: ch02-b17
          speaker: barbel
          text: 那托比亚斯后来怎么样了？
        - id: ch02-b18
          speaker: dete
          text: 别急，我正要讲呢。这么多事，我总不能一口气说完。托比亚斯在梅尔斯学完手艺，回到德尔弗利，娶了我姐姐阿德莱德。他们一直彼此喜欢，婚后也过得很和美。可好日子没过多久。结婚才两年，一根横梁在托比亚斯干活时砸下来，当场要了他的命。人们把他抬回家。阿德莱德看见丈夫的遗体已经变了形，又害怕又悲痛，当时就发起烧来，从此再也没有康复。
        - id: ch02-b19
          speaker: dete
          text: 她身体本来就弱，还常常莫名发作，叫人分不清她到底醒着还是睡着。托比亚斯下葬两个月，她也去世了。这件悲惨的事传得很远。人们背地里、当面都说，这是大叔不敬神，才会受到这样的惩罚。牧师想唤醒他的良心，劝他悔改，他却变得更加愤怒，更加固执，再也不理任何人，大家也都躲着他。忽然有一天，我们听说他搬上高山牧场，再也不想下来了。从那以后，他一个人住在山里，与上帝为敌，也与世人为敌。
        - id: ch02-b20
          speaker: dete
          text: 那时阿德莱德的小女儿才一岁，我和母亲把她接来照料。去年母亲去世，我下山去温泉挣钱，就花钱请上面村子的老乌尔塞尔照看孩子。整个冬天我都留在温泉。我会缝衣服，也会编织，活儿多得做不完。今年春天，我从前服侍过的那户法兰克福人又来了，还是要我跟他们回去。我们后天就启程。你相信我，这真是一份好得不能再好的差事。
        - id: ch02-b21
          speaker: barbel
          text: 可你还是要把孩子交给山上那个老头？德特，我真不敢相信你会这么做。
        - id: ch02-b22
          speaker: dete
          text: 你这是什么意思？我已经尽了自己的责任。难道还要我把她带去法兰克福吗？她才五岁！倒是你要去哪儿，芭贝尔？我们已经走到高山牧场的半腰了。
        - id: ch02-b23
          speaker: barbel
          text: 我刚好到地方。我要跟牧羊童的母亲说几句话，冬天她替我纺线。那就再见了，德特，祝你好运！
    - id: ch03
      title: 跟着羊群上山
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 德特和芭贝尔握手道别，留在原地看着她走向一间深褐色的小屋。那屋子离山路只有几步，坐落在一处洼地里，多少能避开山风。从德尔弗利往上算，它正好位于高山牧场的半山腰。幸好还有这一点遮挡，因为屋子已经破旧不堪，住在里面也很不安全。暴烈的南风横扫山间时，门窗就一起摇晃作响，腐朽的老梁也会吱嘎呻吟，整间屋子抖个不停。要是它盖在更高、更空旷的山坡上，只怕转眼就会被风刮进山谷，根本逃不过去。
        - id: ch03-b02
          speaker: narrator
          text: 十一岁的彼得就住在这里。每天早晨，他都要下到德尔弗利，把各家的山羊一只只接来，再赶到山上。羊群可以在山间自由自在地走动，吃一整天鲜嫩的植物。一直到傍晚，彼得才带着脚步轻快的羊群，连跑带跳地回到村里。他会把手指放进嘴里，吹一声响亮的口哨。各家的主人听见了，就出来领走自己的羊。通常跑来回应哨声的是男孩女孩，因为谁都不怕这些温顺的山羊。
        - id: ch03-b03
          speaker: narrator
          text: 整个夏天，彼得只有这时候能见到小伙伴，白天其余的时候都独自守着羊群。他家里还有母亲和一位失明的祖母，可他每天一大早就得出门。傍晚回到德尔弗利以后，他又总想尽量多留一会儿，和别的孩子说话、玩耍，所以到家时已经很晚。他早晨只能匆匆吃下牛奶和面包，晚上再吃一顿同样的饭，接着倒头就睡。彼得的父亲年轻时也靠放羊过日子，大家同样叫他牧羊人，几年前却在伐木时意外去世了。母亲本名布丽吉塔，人们念着从前的称呼，还是叫她牧羊人的妻子。至于那位失明的老人，附近无论老少，都只叫她祖母。
        - id: ch03-b04
          speaker: narrator
          text: 德特足足等了十分钟，不停向四周张望，还是看不见孩子和羊群。她只好再往高处爬，好越过斜向山谷的坡地，看得更远。她的脸色越来越焦急，动作也越来越不安，双眼始终搜寻着四周的山坡。其实，两个孩子正沿着一条遥远而曲折的路线往上爬。彼得熟悉这片山坡，知道许多地方长着不同的灌木和植物，那些都是山羊爱吃的好东西，所以他常常把羊群带离大家走惯的大路。
        - id: ch03-b05
          speaker: narrator
          text: 海蒂被厚衣服裹得像穿了一身铠甲，热得筋疲力尽。她起初喘着气，艰难地跟在彼得后面，却一直没有出声。那双小眼睛一刻也没闲着，一会儿看彼得，一会儿看山羊。彼得光着脚，只穿一条轻薄的短裤，能够灵巧地从这里蹦到那里。那些腿脚细长的山羊更轻松，越过岩石和灌木，攀上陡坡，甚至比彼得还快。
        - id: ch03-b06
          speaker: narrator
          text: 忽然，海蒂坐到地上，两只小手飞快地脱掉鞋袜。她站起来，解下热烘烘的红披巾，往旁边一扔，又去解连衣裙。一件裙子脱下来，里面居然还有一件。原来德特不想一路提着衣物，干脆把礼拜日穿的裙子套在了日常裙子外面。海蒂一点也没有耽搁，转眼又解开里面那件裙子，把它也脱了下来。
        - id: ch03-b07
          speaker: narrator
          text: 现在她只穿着一件轻薄的短袖内衣。她快活地舒展开两条光溜溜的小胳膊，把鞋袜、披巾和裙子整整齐齐堆成一小堆，接着追上彼得和羊群，蹦蹦跳跳地往高处爬，灵活得一点也不输给队伍里的任何一个。海蒂落在后面时，彼得根本没注意她在做什么。等她穿着这身轻便衣服跑上来，他咧开嘴笑了。再回头看看地上那一小堆东西，他笑得嘴角都快碰到耳朵，却什么也没说。
        - id: ch03-b08
          speaker: narrator
          text: 海蒂终于能轻松活动，便和彼得聊了起来。她的问题一个接一个，彼得只好不断回答。她想知道他有多少只羊，要把羊赶去哪儿，到了那里又会做些什么。又走了一阵，他们和羊群终于靠近小屋，出现在德特眼前。德特刚看清这支往上爬的小队，就尖叫起来。
        - id: ch03-b09
          speaker: dete
          text: 海蒂，你干了什么！快看看自己成了什么样！你的两件裙子呢？红披巾呢？我给你买的新鞋，还有我亲手织的新袜子，全都不见了！一件也没剩！海蒂，你到底怎么想的？衣服都去哪儿了？
          emotion: surprised
        - id: ch03-b10
          speaker: narrator
          text: 海蒂安安静静地指向下面的山坡。
        - id: ch03-b11
          speaker: heidi
          text: 都在那下面。
        - id: ch03-b12
          speaker: narrator
          text: 德特顺着她指的方向看去，好不容易才看见地上有一团东西，上面露着一小块红色。那当然是羊毛披巾。
        - id: ch03-b13
          speaker: dete
          text: 你这个没用的小东西！怎么会想出这种事？为什么把衣服全脱了？你到底想干什么？
          emotion: angry
        - id: ch03-b14
          speaker: heidi
          text: 我不想穿那些衣服。
        - id: ch03-b15
          speaker: narrator
          text: 海蒂一点也不后悔。德特却一边责骂，一边哀叹起来。
        - id: ch03-b16
          speaker: dete
          text: 你这个冒失的小东西，怎么一点脑子也没有？谁肯下那么远的坡替你拿？来回足足要半个钟头！彼得，快去把衣服捡回来。别站在那里张着嘴瞪我，好像脚底生了根！
          emotion: angry
        - id: ch03-b17
          speaker: peter
          text: 我已经迟了。
        - id: ch03-b18
          speaker: narrator
          text: 彼得两手插在口袋里，一直站在原地，看着德特又惊又怒，却动也没动。
        - id: ch03-b19
          speaker: dete
          text: 你光站着瞪眼，当然哪儿也去不了。这样吧，你回来以后，我给你一样好东西。
        - id: ch03-b20
          speaker: narrator
          text: 她伸出手，亮出一枚崭新的钱币。钱币在阳光下一闪，彼得马上动身，抄最近的路飞快跑下陡坡。没过多久，他就到了那堆衣服旁，把所有东西夹在胳膊底下，又飞快跑回来。他快得让德特吃惊。她把答应的钱交给他时，也不得不夸了他一句。彼得立刻把钱塞进口袋，脸上高兴得发亮，因为他很少能拥有这么一大笔钱。
        - id: ch03-b21
          speaker: dete
          text: 反正你也往上走，就替我把这些东西一直拿到大叔家吧。
        - id: ch03-b22
          speaker: narrator
          text: 牧羊人小屋后面的山坡突然向上抬起，又陡又直，德特已经准备继续登山。彼得爽快地答应了。他赤着脚跟在德特身后，左臂紧紧夹着刚捡回来的衣服包，右手挥着牧羊杖。海蒂和山羊们则在他身旁欢欢喜喜地蹦跳，一行人就这样继续朝高山牧场走去。
    - id: ch04
      title: 山顶的小屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又爬了三个多刻钟，他们终于到了高山牧场的顶端。大叔的小屋建在一块突出的岩地上。这里虽然迎着风，却能接住每一缕阳光。站在屋前，还能一眼望遍下方整座山谷。屋后站着三棵老冷杉，枝条又长又密，从来没有修剪过。冷杉后面又耸起一道高高的山壁。山壁低处还长满秀美的青草和植物，越往上，石头越多，只剩低矮的灌木，最后一路通向陡峭光秃的岩峰。
        - id: ch04-b02
          speaker: narrator
          text: 小屋朝向山谷的那面墙边，大叔靠墙搭了一张长凳。此刻，他正坐在那里，嘴里衔着烟斗，两只手安稳地放在膝上，静静望着远方。孩子、山羊和德特突然从坡下冒了出来。海蒂第一个到达。她径直走到老人面前，向他伸出手。
        - id: ch04-b03
          speaker: heidi
          text: 晚上好，外公。
        - id: ch04-b04
          speaker: grandfather
          text: 哦？这是怎么回事？
        - id: ch04-b05
          speaker: narrator
          text: 老人粗声问着，猛地握了一下孩子的手，又从浓眉底下久久打量她。海蒂一点也不害怕，也定定地望回去。外公的模样实在奇特。长长的胡须垂在脸上，两道粗密的灰眉毛在鼻梁上连成一片，像一丛灌木。海蒂怎么也移不开眼睛。这时，德特终于爬了上来，彼得跟在后面。他没有马上去放羊，而是停在一旁，想站一会儿，看看接下来会发生什么。
        - id: ch04-b06
          speaker: dete
          text: 您好，大叔。我把托比亚斯和阿德莱德的女儿带来了。她一岁以后，您就再没见过，恐怕已经认不出来了。
        - id: ch04-b07
          speaker: grandfather
          text: 她到我山上来做什么？
        - id: ch04-b08
          speaker: narrator
          text: 老人冷冷地问完，又冲彼得喊道。
        - id: ch04-b09
          speaker: grandfather
          text: 你还不快赶羊去！本来就够晚了，把我的两只也一起带走。
        - id: ch04-b10
          speaker: narrator
          text: 彼得马上照办，很快就不见了。老人只看了他一眼，他就觉得自己绝不能再留下去。
        - id: ch04-b11
          speaker: dete
          text: 我把孩子送来，是要让她以后跟您住。我想，这四年里我已经尽到责任了，现在该轮到您。
        - id: ch04-b12
          speaker: grandfather
          text: 原来是这么回事。以后她要是像那些不懂事的小东西一样，哭着闹着要找你，我怎么办？
        - id: ch04-b13
          speaker: narrator
          text: 老人的眼里闪过一道锐光，紧紧盯住德特。
        - id: ch04-b14
          speaker: dete
          text: 那是您的事。她还是婴儿时就丢给了我。母亲和我本来已经忙得够呛，还是一句怨言也没有，把她养到现在。可我也得挣钱过日子，您是她最近的亲人。您留不下她，就自己想办法。要是孩子出了事，后果由您承担。不过依我看，您良心上的担子已经够重了，最好别再添一件。
        - id: ch04-b15
          speaker: narrator
          text: 德特本来就对自己的做法有些不安。心里一发热，她的语气越说越急，出口的话也比原先打算的多。她自己也没料到，会一口气讲出这么多。最后几个字刚落下，大叔就从长凳上站起来。他朝德特看了一眼，那目光吓得她往后退了一两步。接着，他把手臂朝外一挥，用不容违抗的口吻叫她离开。
        - id: ch04-b16
          speaker: grandfather
          text: 马上走。尽快滚回你来的地方，最近别再让我看见你。
          emotion: angry
    - id: ch05
      title: 德特独自下山
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 德特根本不用他再说一遍。
        - id: ch05-b02
          speaker: dete
          text: 那么再见了。您再见，海蒂！
        - id: ch05-b03
          speaker: narrator
          text: 她飞快转身，跑着下山，一路都没有慢下来，直到平安回到德尔弗利才停住。心里的不安像一台蒸汽机在身体里开动，推着她不停向前。村里人的问题立刻像雨点一样，从四面八方落下来。大家都认识德特，也知道孩子出生以来的种种遭遇，每个人都想知道她把海蒂怎么样了。每经过一扇门、一个窗口，都有人朝她喊。
        - id: ch05-b04
          speakers: [village_woman_1, village_woman_2]
          ensemble: duo
          text: 孩子呢？德特，你把孩子留在哪儿了？
        - id: ch05-b05
          speaker: dete
          text: 留在山上，跟阿尔姆大叔住！我不是已经告诉你们了吗？
        - id: ch05-b06
          speaker: narrator
          text: 女人们纷纷责骂她。
        - id: ch05-b07
          speaker: village_woman_1
          text: 你怎么能做出这种事！
          emotion: angry
        - id: ch05-b08
          speaker: village_woman_2
          text: 那孩子无依无靠，你竟然把她一个人留在山上！
          emotion: sad
        - id: ch05-b09
          speakers: [village_woman_1, village_woman_2]
          ensemble: duo
          text: 可怜的小不点儿！可怜的小不点儿！
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: 这句话一遍又一遍追在德特身后。她越来越不愿回答，终于再也受不了，只能拼命往前跑，直到那些声音完全听不见。想到自己的做法，她心里并不快活，因为母亲临终前把孩子托付给了她。可她又安慰自己，只要能挣到很多钱，以后就更有能力为海蒂做点事。想到自己很快会远离这些把事情闹得沸沸扬扬的人，她松了一口气。再想到从此可以自由地去做那份好差事，她更觉得高兴。
