audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "温暖细腻，带着从容的讲故事感", timbre: 清澈柔和, pace: 舒缓而富有变化, pitch: 中音}
    heidi:
      display_name: 海蒂
      tts: {delivery: "天真直接，遇到新鲜事时满是好奇和喜悦", timbre: 明亮稚嫩, pace: 轻快自然, pitch: 偏高}
    peter:
      display_name: 彼得
      tts: {delivery: "质朴少言，开心时仍有几分腼腆", timbre: 清亮朴实, pace: 稍慢, pitch: 中高音}
    brigitta:
      display_name: 布丽吉塔
      tts: {delivery: "朴实热心，惊讶时话语接连不断", timbre: 温厚明朗, pace: 适中, pitch: 中音}
    grandmother:
      display_name: 祖母
      tts: {delivery: "慈爱虔诚，喜悦中带着年迈者的颤音", timbre: 温柔苍老, pace: 缓慢, pitch: 中音}
    teacher:
      display_name: 老师
      tts: {delivery: "随和宽厚，说话不紧不慢", timbre: 温和朴实, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 第十九章　冬天还在继续
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，彼得准时去了学校，还带上了午饭。住得远的孩子中午都不回家。他们照例坐到桌子上，双脚稳稳踩着长凳，把食物摊在膝头，就这样吃午饭。多尔夫里的孩子却可以回家吃。一点钟前，大家想做什么都行，到了钟点再上课。彼得只要来上学，做完当天的功课以后，总要去大叔家看看海蒂。
        - id: ch01-b02
          speaker: narrator
          text: 这天，彼得刚进大屋，海蒂就冲过来抓住他。她一直在等他呢。
        - id: ch01-b03
          speaker: heidi
          text: 彼得，我有办法了！
        - id: ch01-b04
          speaker: peter
          text: 什么办法？
        - id: ch01-b05
          speaker: heidi
          text: 你非得学会读书不可。
        - id: ch01-b06
          speaker: peter
          text: 我早就学过了。
        - id: ch01-b07
          speaker: heidi
          text: 我知道。可你得学到真的会读，读了能派上用场。
        - id: ch01-b08
          speaker: peter
          text: 我永远也学不会。
        - id: ch01-b09
          speaker: heidi
          text: 现在没人相信你学不会，我也不信。法兰克福的奶奶早就说，那不是真的，还叫我千万别听你的。
        - id: ch01-b10
          speaker: narrator
          text: 彼得听得愣了一下。海蒂可没停。
        - id: ch01-b11
          speaker: heidi
          text: 我知道怎么教，很快就能教会你。你现在就得学。等你会读了，每天都能给祖母念一两首赞美诗。
        - id: ch01-b12
          speaker: peter
          text: 我才不管呢。
        - id: ch01-b13
          speaker: narrator
          text: 这句话可把海蒂惹恼了。学会读书，给祖母念赞美诗，明明是件又对又好的事，也是她最挂心的事，彼得却硬着心肠不肯答应。她两眼闪着光，站到彼得面前，带着威吓的口气开了口。
        - id: ch01-b14
          speaker: heidi
          text: 你要是不肯照我说的学，我就告诉你会怎么样。你母亲不是常说，要送你去法兰克福学好多东西吗？我知道那里的男孩在哪儿上课。克拉拉坐车带我出去时，指过那幢大房子。他们不光小时候去，长大以后还得上更多的课。我亲眼看见过。那里可不只有我们这样一位和气的老师。老师多得不得了，全在一所学校里。他们都穿黑衣服，像要去教堂，头上还戴着这么高的黑帽子！
        - id: ch01-b15
          speaker: narrator
          text: 海蒂伸出一只手，从地面往上比画着那些人的高度。彼得一听，只觉得一阵寒气顺着脊背爬了下去。海蒂没有察觉他的害怕，反而越说越起劲。
        - id: ch01-b16
          speaker: heidi
          text: 你得走进那群先生中间。轮到你时，你不会读，还会把字母拼错。到时候，他们就会笑话你，比蒂内特笑得还厉害。你真该看看蒂内特取笑人时的样子。
        - id: ch01-b17
          speaker: peter
          text: 好吧，那我学。
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 彼得又委屈又恼火，海蒂的气却立刻消了。
        - id: ch01-b19
          speaker: heidi
          text: 这才对。我们马上开始！
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: 她说干就干，把彼得拉到桌边，又忙着取来书。克拉拉送她的礼物中，有一本句句押韵的字母书。头天夜里，海蒂躺在床上就想好了，用这本书教彼得再合适不过。现在，两个人并肩坐在桌前，一起低头看着书，功课开始了。第一句话，海蒂让彼得拼了两三遍，一定要他念得又对又顺。可他总也念不好。
        - id: ch01-b21
          speaker: heidi
          text: 我先大声念一遍。你听清楚原来怎么念，再学就容易啦。A、B、C，今天牢牢记，不然法官叫你去受审。
        - id: ch01-b22
          speaker: peter
          text: 我才不去。
        - id: ch01-b23
          speaker: heidi
          text: 去哪儿？
        - id: ch01-b24
          speaker: peter
          text: 去见法官。
        - id: ch01-b25
          speaker: heidi
          text: 那就快把这三个字母学会，你便不用去了。
        - id: ch01-b26
          speaker: narrator
          text: 彼得又学了起来，一遍又一遍，使足了劲念那三个字母。
        - id: ch01-b27
          speaker: heidi
          text: 这三个，你现在肯定记住了。
        - id: ch01-b28
          speaker: narrator
          text: 头两句竟然这么管用，海蒂决定先替以后的功课铺铺路。
        - id: ch01-b29
          speaker: heidi
          text: 等一等，我再念几句。你先听听，以后还有什么在等你。D、E、F、G，顺溜念到底，不然会有坏事找上你。H、I、J、K，要是忘了它，当场丢脸羞得抬不起头呀。L、M紧跟别迟疑，笨蛋偷懒要受罚一记。若知后头什么在等候，N、O、P、Q赶快学个够。R、S、T，赶紧记心头，不然更坏的事还在后头。
        - id: ch01-b30
          speaker: narrator
          text: 海蒂念得又清楚又慢。念到这里，她忽然停住了。彼得静得出奇，她得看看他到底在做什么。只见他像石头一样坐在那里，惊恐地瞪着她。那些藏在句子里的威吓，还有对种种可怕惩罚的暗示，已经把他吓坏了。海蒂心地善良，马上不忍心起来，赶紧安慰他。
        - id: ch01-b31
          speaker: heidi
          text: 别怕，彼得。你每天傍晚都来，只要像今天这样学，最后一定能认全字母。这样，那些事就不会发生了。不过你得天天来，不能像上学那样来一天、歇一天。就算下雪，也不会伤着你。
          emotion: calm
        - id: ch01-b32
          speaker: narrator
          text: 彼得吓得服服帖帖，立刻答应了。当天的功课到此结束，他便回了家。
        - id: ch01-b33
          speaker: narrator
          text: 从那以后，彼得一点也不打折扣地照海蒂的话去做。每天傍晚，他都来老老实实学后面的字母，还把书里的句子句句放在心上。爷爷常坐在屋里，舒服地抽着烟斗。听着他们上课，他脸上偶尔会抽动一下，像是突然有一阵笑意涌上来。彼得费过这一番大力气以后，常被留下吃晚饭。当天被那些句子吓出的满心痛苦，也算得到了丰厚的补偿。
        - id: ch01-b34
          speaker: narrator
          text: 冬天一天天过去，彼得认的字母果然越来越多。只是每天都要跟那些句子苦战一场。终于，他学到了U。
        - id: ch01-b35
          speaker: heidi
          text: U和V，可别认颠倒，不然送你去最怕去的道。
        - id: ch01-b36
          speaker: peter
          text: 对，可我绝不会去！
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: 嘴上虽然这么说，那天他却学得特别卖力，仿佛真有人会突然冲进来，一把揪住他的衣领，把他拖到最不愿去的地方。第二天傍晚，又轮到了W。
        - id: ch01-b38
          speaker: heidi
          text: W若还结结巴巴，快看墙边棍子等着打。
        - id: ch01-b39
          speaker: peter
          text: 墙边根本没有棍子。
        - id: ch01-b40
          speaker: heidi
          text: 可你知道爷爷箱子里有什么吗？有根棍子，差不多跟你的胳膊一样粗。他要是拿出来，你就真能看见墙边的棍子了。
        - id: ch01-b41
          speaker: narrator
          text: 彼得知道那根粗榛木棍。他马上低下头，跟W较起劲来，非记住不可。又过一天，书里轮到了X。
        - id: ch01-b42
          speaker: heidi
          text: 轮到X你得说出来，不然今天没饭菜。
        - id: ch01-b43
          speaker: narrator
          text: 彼得瞧了瞧装着面包和奶酪的橱柜。
        - id: ch01-b44
          speaker: peter
          text: 我可没说过我会忘掉X。
          emotion: angry
        - id: ch01-b45
          speaker: heidi
          text: 那就好。只要没忘，我们就学下一个，学完便只剩一个了。
        - id: ch01-b46
          speaker: narrator
          text: 彼得还没完全明白，海蒂已经念起Y来。
        - id: ch01-b47
          speaker: heidi
          text: Y前若是停下来，人人指你喊‘羞！羞！’来。
        - id: ch01-b48
          speaker: narrator
          text: 彼得眼前一下出现了法兰克福的先生们。他们全戴着高高的黑帽子，一张张脸上都是轻蔑和嘲弄。彼得顿时来了力气，猛扑到Y上，死死跟它较量，再也不肯放过这个字母。直到把它记得烂熟，哪怕闭上眼也能清楚看见它的模样，他才肯罢休。
        - id: ch01-b49
          speaker: narrator
          text: 第二天，彼得来的时候颇有些神气，甚至带着几分高高在上的样子。毕竟只剩最后一个字母需要跟他较量了。海蒂一开始上课，便念出最后两句。彼得听完，轻蔑地哼了一声。
        - id: ch01-b50
          speaker: heidi
          text: 赶快学会Z，千万别拖拉，不然送到霍屯督人那儿安家。
        - id: ch01-b51
          speaker: peter
          text: 随你怎么说吧。反正谁也不知道这些人到底住在哪儿。
        - id: ch01-b52
          speaker: heidi
          text: 爷爷肯定知道。我现在就去问他，他正在对面跟牧师说话呢。
        - id: ch01-b53
          speaker: narrator
          text: 海蒂起身直奔门口，真要去问。彼得却痛苦地叫了起来。
        - id: ch01-b54
          speaker: peter
          text: 别去！
          emotion: fearful
        - id: ch01-b55
          speaker: narrator
          text: 他还没学会最后一个字母，脑子里却已经看见大叔和牧师把他架走，径直送去霍屯督人那里。那声惊叫把海蒂喊了回来。
        - id: ch01-b56
          speaker: heidi
          text: 你怎么啦？
          emotion: surprised
        - id: ch01-b57
          speaker: peter
          text: 没什么！回来！我要学这个字母！
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: 彼得吓得话都说不顺了。海蒂却真的想知道霍屯督人住在哪儿，仍旧坚持要问爷爷。彼得绝望地求了又求，她最后才肯让步。不过，她也要彼得拿出点东西交换。他不但得一遍遍念Z，直到这个字母牢牢留在脑子里，再也不可能忘掉，海蒂还马上开始教他拼读。那天傍晚，他着实开了个很好的头。此后的功课，就这样一天接一天继续下去。
        - id: ch01-b59
          speaker: narrator
          text: 严寒退去了，雪又变软，天上还总落新雪。足足三个星期，海蒂都不能去看祖母。正因为自己去不了，她教彼得教得更起劲了，好让他用每天读赞美诗来补上自己的缺席。一天傍晚，彼得从海蒂那里回到家，一进门便宣布。
        - id: ch01-b60
          speaker: peter
          text: 我现在会了。
        - id: ch01-b61
          speaker: brigitta
          text: 会什么了，彼得？
        - id: ch01-b62
          speaker: peter
          text: 会读书了。
        - id: ch01-b63
          speaker: brigitta
          text: 你说真的？祖母，您听见了吗？
          emotion: surprised
        - id: ch01-b64
          speaker: narrator
          text: 祖母当然听见了。她也正躺在那里暗暗纳闷，彼得会读书这样的事，究竟是怎么发生的。
        - id: ch01-b65
          speaker: peter
          text: 我现在得念一首赞美诗。海蒂叫我念的。
        - id: ch01-b66
          speaker: narrator
          text: 布丽吉塔赶忙拿来书。祖母已经很久没听见那些美好的诗句了，满心欢喜地躺在那里等着。彼得坐到桌旁，翻开书开始朗读。母亲挨着他坐下，惊讶地听着。彼得每读完一节，她都忍不住赞叹一声。
        - id: ch01-b67
          speaker: brigitta
          text: 谁能想到，他真的会读呢！
          emotion: surprised
        - id: ch01-b68
          speaker: narrator
          text: 祖母一句话也没说。她得用力听清彼得念出的词，只能绷紧了全部心神，跟着他读出的每一个字往下走。
        - id: ch01-b69
          speaker: narrator
          text: 第二天，彼得班上正好有读书课。轮到他时，老师照例没抱什么希望。
        - id: ch01-b70
          speaker: teacher
          text: 还是跟往常一样，跳过彼得吧。要不，你再试一回？我可不敢说让你‘读’，只求你结结巴巴挤出一句话来。
        - id: ch01-b71
          speaker: narrator
          text: 彼得拿起书，一点也没迟疑，也没有结巴，一口气读完了三行。老师把自己的书放下，目不转睛地盯着彼得，仿佛眼前是什么从未见过的古怪奇迹。好半天，他才终于开口。
        - id: ch01-b72
          speaker: teacher
          text: 彼得，你身上一定出了奇迹！我用世上少有的耐心教你这么久，以前你连字母都念不出来。现在我才刚决定，不再在你身上白费力气，你竟然能把一句完整的话读得又对又清楚。这样的奇迹到底是怎么发生的？
          emotion: surprised
        - id: ch01-b73
          speaker: peter
          text: 是海蒂。
        - id: ch01-b74
          speaker: narrator
          text: 老师惊讶地转头看海蒂。海蒂毫不知情，安安静静坐在长凳上，身上怎么看也没有一点超凡的模样。老师只好又问彼得。
        - id: ch01-b75
          speaker: teacher
          text: 我还发现，你整个人都变了。从前你一缺课就是一个星期，有时几个星期都不来。最近你却一天也没落下。是谁让你变好的？
        - id: ch01-b76
          speaker: peter
          text: 是大叔。
        - id: ch01-b77
          speaker: narrator
          text: 老师越发惊奇，看看彼得，又看看海蒂，再看看彼得。
        - id: ch01-b78
          speaker: teacher
          text: 那我们再试一回。
        - id: ch01-b79
          speaker: narrator
          text: 彼得只好再显一次本领，又读了三行。这一回仍然又正确又清楚。这下谁也不能怀疑了，彼得真的会读书。学校一放学，老师便立刻去找牧师，把这个消息告诉他，还特意说明，这是海蒂和爷爷一同努力所得的可喜成果。
        - id: ch01-b80
          speaker: narrator
          text: 从此，彼得每天傍晚都念一首赞美诗。在这件事上，他确实照海蒂的话做了。可谁也没法让他再念第二首，祖母也从不要求。布丽吉塔对儿子的新本事总也惊叹不完。每逢这位朗读者上床睡下，她便会欢喜地说起他的将来。
        - id: ch01-b81
          speaker: brigitta
          text: 他如今会读书了，以后还不知能有多大的出息呢。
          emotion: happy
        - id: ch01-b82
          speaker: grandmother
          text: 是啊，他能学会一样东西，当然很好。可我真盼着春天快点来，让海蒂再来看看我。赞美诗让彼得一念，就不像原来的诗了。总有那么多词不见了。我忙着猜那些词是什么，后面的意思也听丢了。那些诗便再也不像海蒂念的时候一样，能一直走进我的心里。
        - id: ch01-b83
          speaker: narrator
          text: 其实，彼得早给自己想好了省力的办法。碰见太长的词，或是别的难词，他就干脆跳过去。他觉得一节诗有那么多词，少一两个，祖母根本不会察觉。结果，他念出的赞美诗里，偏偏总缺少最要紧的词。
